 RAJ_focus_mao_how_to_cancel: "§H마오주의 성향§! 정부가 집권하도록 허용하면 반란을 막을 수 있습니다."
 RAJ_mao_reb.4.t: "반정부 시위"
 RAJ_mao_reb.4.d: "시민들이 불만을 표출하며 변화를 요구하는 가운데, 반정부 공산주의 시위의 물결이 인도 전역을 휩쓸고 있습니다. 여러 공산주의 단체가 조직한 시위에는 주요 도시와 읍 곳곳에서 엄청난 인파가 모였습니다. 시위대는 소득 불평등, 실업, 그리고 정부의 권위주의적이라고 여겨지는 정책 등의 문제를 제기하고 있습니다. 이들은 자원이 공평하게 분배되고 노동자 계급의 권리가 보호되는, 보다 포용적인 사회를 요구하고 있습니다."
 RAJ_mao_reb.4.a: "경찰로 진압하라!"
 RAJ_mao_reb.5.t: "공산주의 혁명!"
 RAJ_mao_reb.5.d: "충격적인 사태 전개 속에, 정부와 공산주의 세력 사이의 긴장이 사상 최고조에 이르면서 인도는 내전 직전에 놓였습니다. 양측이 한 치도 물러서지 않으면서 나라는 폭력적인 시위와 충돌에 휩싸였습니다. 인도 정부가 논란이 많은 정책을 추진하면서 공산주의 정당들의 분노를 샀습니다. 이념의 충돌과 나라의 미래를 둘러싼 상반된 구상이 갈등을 걷잡을 수 없이 키우고 있습니다."
 RAJ_mao_reb.5.a: "신이여 인도를 구하소서, 다른 누구도 구할 수 없으니."
 indian_event.41.t: "타타 티, 테틀리를 2억 7,100만 파운드에 인수"
 indian_event.41.d: "테틀리 티 피플이 등장하는 TV 광고로 유명한 테틀리가 세계 최대의 통합 차 기업인 타타 티에 인수되었습니다. 인도 기업은 영국에서 가장 인기 있는 차를 만들고 세계 2위 차 브랜드인 비상장 기업 테틀리에 2억 7,100만 파운드를 지불했습니다. 수개월간의 협상 끝에 체결된 이 거래는 자기자본과 부채를 결합해 조달됩니다. 인도 최대 기업 집단 타타 그룹의 일원인 타타 티는 기존 테틀리 경영진이 계속해서 회사의 일상 업무를 맡을 것이라고 밝혔습니다."
 indian_event.41.a: "흥미롭군"
 indian_event.42.t: "미국 대통령의 인도 방문"
 indian_event.42.d: "인도의 아탈 비하리 바지파이 총리는 이슬라마바드에 대한 미국 대통령의 압박을 환영했습니다. 미국 대통령이 전시 상황에서 파키스탄에 맞서 공개적으로 인도 편에 선 것은 이번이 처음이었습니다. 미국 대통령의 순방에 앞서 미국 정보기관은 향후 10년 안에 두 핵보유국 사이에 전면전이 벌어질 가능성이 반반이라는 섬뜩한 평가를 내놓았습니다. 미국 대통령은 델리, 하이데라바드, 자이푸르, 뭄바이를 들르며 인도 전역에서 록스타와 같은 환영을 받았습니다. 의회에서 연설했을 때는 기립 박수를 받았습니다. 어디서나 엄청난 인파가 모였습니다. 바지파이는 같은 해 말 백악관 국빈 만찬으로 답방했습니다. 수십 년간의 불편한 관계를 지나 인도와 미국은 전환점을 맞이했습니다."
 indian_event.42.a: "환영합니다, 친구들이여."
 indian_event.43.t: "승부 조작 스캔들"
 indian_event.43.d: "델리 경찰이 산자이 차울라와 핸지 크론예 사이의 수상한 통화 내용을 확보했다고 공개하면서, 크리켓 역사상 최대 규모의 승부 조작 스캔들 중 하나가 터졌습니다. 크론예는 인기 있고 성공한 남아프리카 크리켓 선수로 팬들의 우상이었습니다. 그러나 산자이 차울라와의 관계 때문에 그를 둘러싼 평가는 엇갈렸습니다. 산자이는 인도 도박 조직의 잘 알려진 일원으로 확인되었습니다. 크론예는 승부 조작 혐의를 처음에는 모두 부인하며 흐느껴 울었으나, 이후 반대신문을 받으면서 입장이 바뀌었습니다."
 indian_event.43.a: "다시는 경기에 나서지 못하게 하라!"
 indian_event.44.t: "인도 인구, 10억 명 돌파"
 indian_event.44.d: "여아 한 명이 태어나면서 인도의 인구가 공식적으로 10억 명에 이르렀습니다. 정부 관계자들은 델리의 사프다르장 병원에서 태어난 아기가 이 기념비적인 순간을 장식하도록 정했습니다. 아스타 아로라가 인도의 10억 번째 아기로 지명되었습니다. 아스타의 어머니 안자나 아로라는 가족이 하루아침에 언론의 스포트라이트를 받게 된 그날에 대해 위트니스와 인터뷰했습니다."
 indian_event.44.a: "이것은 좋은 일인가, 나쁜 일인가?"
 indian_event.45.t: "인도 의회 습격"
 indian_event.45.d: "자폭 테러 조직이 인도 의회 단지에 난입하여 7명을 살해하고 자신들도 숨졌습니다. 세계 최대 민주주의 국가의 권력 중심부에 대한 전례 없는 공격이었습니다. 목격자들에 따르면 5명이 차에서 뛰어내려 경비원들을 공격하며 의회로 돌입했고, 이들은 위조 출입증을 사용해 단지 안으로 차를 몰고 들어온 것으로 보입니다. 침입자 중 한 명은 의사당 정문에서 스스로 폭발했습니다. 영국 식민 통치 시절 에드윈 루티엔스 경이 설계한 웅장한 사암 의회 건물 밖에서 의원인 카르발라 사인은 이렇게 말했습니다. 입구 근처에서 폭죽 같은 소리가 들렸고, 그 뒤 사람들이 우왕좌왕 달아나는 것을 봤습니다. 많은 사람이 동시에 총을 쏘고 있었습니다. 누가 누구인지 분간할 수 없었습니다. 누가 테러범이고 누가 경찰인지 알 수 없었습니다. 공격에 대한 즉각적인 범행 성명은 없었습니다. 공격범 중 한 명은 허리에 두른 폭발물을 터뜨려 사망했습니다. 당시 단지 안에 없던 인도 총리는 텔레비전에 나와 테러에 맞선 인도의 싸움이 마지막 단계에 접어들었다고 말했으며, 국방장관과 내무장관은 강경한 대응을 다짐했습니다. L.K. 아드바니 내무장관은 이렇게 말했습니다. 우리는 테러범들과 그 후원자들을, 그들이 누구든 어디에 있든 모두 제거할 것이다. 초기에는 인도의 통치에 맞서 싸우는 이슬람주의 무장 세력, 특히 두 달 전 주 의회에 대한 자폭 공격으로 38명이 사망한 잠무 카슈미르 주의 무장 세력이 배후로 지목되었습니다. 이것이 확인되면 카슈미르 무장 활동을 후원한다고 뉴델리가 비난해 온 파키스탄과의 긴장이 고조될 것입니다. 파키스탄의 페르베즈 무샤라프 대통령은 즉각 이번 공격을 규탄하고 바지파이 총리에게 위로 메시지를 보냈습니다."
 indian_event.45.a: "빌어먹을 놈들!"
 indian_event.46.t: "세계적 수준의 지하철을 갖춘 델리"
 indian_event.46.d: "오늘, 델리 부총리 L.K. 아드바니는 샤스트리 파크에 위치한 메트로 차량 창고에서 델리 메트로의 첫 번째 시험 열차를 기다려온 많은 사람들 앞에서 출발을 알렸습니다. 델리 주지사 Sheila Dikshit는 이 세계적 수준의 메트로를 중단될 가능성이 없는 프로젝트로 설명하며, 크리스마스 이전에 운행을 시작할 것으로 예상된다고 밝혔습니다."
 indian_event.46.a: "좋아"
 RAJ_indian_space_programme: "인도 우주연구기구"
 RAJ_indian_space_programme_desc: "흔히 ISRO라고 불리는 인도 우주연구기구는 인도의 국가 우주 기관입니다. 인도 총리가 직접 감독하는 우주부의 핵심 연구개발 조직으로 운영되며, ISRO 의장은 우주부의 실무 책임자도 겸합니다."
 RAJ_indian_space_endeavors: "인도의 우주 도전"
 RAJ_indian_space_endeavors_desc: "지금은 첨단 기술과 번영의 시대인 21세기입니다. 최근 소련과 미국이라는 초강대국들이 우주 탐사를 놓고 경쟁하던 냉전이 끝났습니다. 인도는 그들에게 뒤처져 있었지만, 이번에는 우주 탐사에서 다른 우주 강국들을 따라잡을 기회를 놓치지 않을 것입니다"
 RAJ_irs_series: "인도 IRS"
 RAJ_irs_series_desc: "인도 원격탐사 위성은 인도의 지구 관측 위성입니다. 현재 운용 중인 민간용 원격탐사 위성군으로는 세계 최대 규모이며, 원격탐사 서비스를 제공하고 있습니다."
 RAJ_insat_navic: "INSAT 시리즈"
 RAJ_insat_navic_desc: "인도 국가위성시스템은 인도의 통신 체계입니다. ISRO가 통신, 방송, 기상, 수색 구조 수요를 충족하기 위해 제작하고 발사한 다목적 정지궤도 위성 시리즈입니다. 1983년 첫 위성이 도입된 이래 INSAT은 아시아 태평양 지역 최대의 국내 통신 체계가 되었습니다."
 RAJ_Chandrayaan: "찬드라얀 계획"
 RAJ_Chandrayaan_desc: "찬드라얀 1호는 찬드라얀 계획에 따른 인도 최초의 달 탐사선입니다. 2008년 10월 인도 우주연구기구(ISRO)가 발사했으며, 2009년 8월까지 운용될 예정입니다."
 RAJ_financing_of_private_space_companies: "민간 사업 지원"
 RAJ_financing_of_private_space_companies_desc: "인도의 우주 산업은 주로 국가 기관인 인도 우주연구기구가 주도하지만, 산업 전체에는 상업, 연구, 기타 모든 분야에 걸쳐 500곳이 넘는 민간 공급업체와 우주부 산하의 여러 기관이 포함되어 있습니다."
 RAJ_chandrayan_to_moon: "찬드라얀 3호, 달로!"
 RAJ_chandrayan_to_moon_desc: "찬드라얀 3호는 인도 우주연구기구의 찬드라얀 계획에 따른 세 번째 인도 달 탐사 임무입니다. 찬드라얀 2호 임무와 마찬가지로 비크람이라는 착륙선과 프라갸안이라는 탐사 로버로 구성됩니다."
 RAJ_Gaganyan: "인도 궤도 우주선"
 RAJ_Gaganyan_desc: "가가냔은 인도 유인 우주비행 계획의 기초가 될 인도의 유인 궤도 우주선입니다. 우주선은 3명을 태울 수 있도록 설계되고 있으며, 향후 개량형에는 랑데부 및 도킹 능력이 갖춰질 예정입니다."
 RAJ_Human_Spaceflight_Programme: "유인 우주비행 계획"
 RAJ_Human_Spaceflight_Programme_desc: "인도 유인 우주비행 계획은 유인 궤도 우주선을 저궤도에 발사하는 데 필요한 기술을 개발하기 위해 인도 우주연구기구가 진행 중인 계획입니다."
 RAJ_astrosat: "아스트로샛"
 RAJ_astrosat_desc: "아스트로샛은 인도 최초의 전용 다파장 우주 망원경입니다."
 indian_event.47.t: "뭄바이를 휩쓴 테러"
 indian_event.47.d: "수요일 늦은 밤부터 오늘 이른 시각까지, 조직적으로 움직인 무장 괴한들이 인도의 금융 중심지 뭄바이의 관광지 곳곳에서 총격과 폭발을 일으켜 최소 101명이 사망하고 200명 넘게 부상했으며, 이들은 미국인과 영국인을 인질로 삼으려 표적으로 삼은 것으로 보입니다. 공격범들은 외국인들이 즐겨 찾는 두 곳의 고급 호텔인 타지마할 팰리스와 오베로이를 휩쓸며 자동소총을 난사하고 수류탄을 던졌고, 겁에 질린 투숙객들은 안전한 곳을 찾아 허둥댔습니다. 일부 투숙객은 몇 시간 동안 호텔 안에 갇혀 있었고, 연이은 폭발로 뭄바이 해안의 명소인 타지 호텔에 불이 붙었습니다. 뭄바이는 최근 몇 년간 여러 차례 테러 공격의 현장이 되었지만, 전문가들은 수요일의 공격에는 전례 없는 수준의 정찰과 계획이 필요했다고 말했습니다. 공격의 규모와 동시성으로 볼 때 경험 많은 지휘관들이 개입한 것으로 보이며, 외국의 개입 가능성도 있다고 일부는 말했습니다. 어둠이 내린 뒤 공격을 개시한 테러범들은 도시의 국내선 공항과 철도역을 거의 동시에 습격했고, 외국인들에게 인기 있는 식당 레오폴드 카페에 총탄을 퍼부었습니다. 최대 16개 조직이 인구 1,900만 명의 이 붐비는 대도시 남쪽 일대 아홉 곳을 공격했습니다"
 indian_event.47.a: "끔찍하다"
 indian_event.48.t: "반부패 운동"
 indian_event.48.d: "흔히 안나 안돌란으로 알려진 인도의 반부패 운동은 2011년에 시작되어 만연한 것으로 여겨지는 정치 부패에 대한 강력한 입법과 단속을 확립하는 것을 목표로 인도 전역에서 벌어진 일련의 시위와 항의였습니다. 이 운동은 타임지가 선정한 \\"2011년 10대 뉴스\\"의 하나로 꼽혔습니다. 운동은 2011년 4월 5일 반부패 운동가 안나 하자레가 뉴델리의 잔타르 만타르 기념물에서 단식 투쟁을 시작하면서 동력을 얻었습니다. 이 운동은 잔 로크팔 법안 도입을 통해 인도 정부의 부패를 줄이는 것을 목표로 했습니다. 람데브, 키란 베디, 아르빈드 케지리왈 등이 이끈 또 다른 목표는 해외 은행에 있는 부정 자금의 환수였습니다. 대규모 시위대는 정치 부패, 도둑 정치, 그 밖의 부패 형태 등 법적, 정치적 쟁점에 초점을 맞췄습니다. 이 운동은 주로 비폭력 시민 저항으로 이루어졌으며 시위, 행진, 시민 불복종, 단식 투쟁, 집회로 구성되었고, 사회관계망을 활용해 조직하고 소통하며 인식을 높였습니다. 시위는 초당파적이었고 대다수 시위자는 정당들이 자신들을 이용해 정치적 목적을 강화하려는 시도에 적대적이었습니다."
 indian_event.48.a: "흥미롭군"
 indian_event.49.t: "의회 청문회"
 indian_event.49.d: "최근 인도 사회에서 LGBT 운동이 점점 더 인기를 얻고 있습니다. 인도 의회에서는 LGBT 합법화에 대한 논의가 여러 차례 있었으며, 최근 회의에서도 다시 한 번 이 문제가 제기되었습니다. 이번이 최종 결정을 내릴 시점이라고 여겨지고 있습니다. 인도에서 LGBT를 합법화할 것인지, 아니면 여전히 금지된 상태로 두고 이 문제를 다시는 언급하지 않을 것인지, 우리는 무엇을 선택할까요?"
 indian_event.49.a: "LGBT라니, 말도 안 되는 소리 아닌가?"
 indian_event.49.b: "LGBT의 합법화를 허용한다."
 indian_event.50.t: "풀와마 공격"
 indian_event.50.d: "2019년 풀와마 공격은 2019년 2월 14일, 잠무 카슈미르 구 주의 풀와마 지구 레타포라에서 잠무 스리나가르 국도를 이동하던 인도 보안 요원 수송대가 차량 탑재 자폭 테러범의 공격을 받으면서 발생했습니다. 이 공격으로 인도 중앙예비경찰대(CRPF) 대원 40명과 범인인 아딜 아마드 다르가 사망했으며, 다르는 풀와마 지구 출신의 현지 카슈미르 청년이었습니다. 파키스탄에 기반을 둔 이슬람주의 테러 조직 자이시 에 무함마드가 공격의 배후를 자처했습니다. 인도는 이웃 나라 파키스탄을 공격의 배후로 지목했으나, 파키스탄은 공격을 규탄하며 어떠한 연관도 부인했습니다. 이 공격은 인도와 파키스탄의 관계에 심각한 타격을 주었고, 그 결과 2019년 인도 파키스탄 군사 대치로 이어졌습니다. 이후 인도 당국의 수사에서 19명의 피의자가 확인되었습니다"
 indian_event.50.a: "이런 젠장."
 indian_event.51.t: "달 착륙에 성공한 인도의 찬드라얀 3호!"
 indian_event.51.d: "인도의 무인 행성 탐사선 찬드라얀 3호가 달 연착륙에 성공했습니다. 하강 과정은 인도 우주연구기구가 생중계했으며 유튜브에서 볼 수 있습니다. 연착륙은 달의 남극 부근에서 이루어졌습니다. 이로써 인도는 달 표면 연착륙이 가능한 소수 우주 강국 클럽에 이름을 올렸습니다. 이전에는 소련, 미국, 중국이 이를 입증한 바 있습니다."
 indian_event.51.a: "환상적이군"
