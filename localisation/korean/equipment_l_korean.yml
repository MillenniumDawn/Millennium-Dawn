 H_infantry_weapons_9: "중화기 2045"
 H_infantry_weapons_9_desc: "중화기는 중기관총, 박격포, 전장 로봇처럼 이동과 운용에 승무원 전체가 필요한 보병 무기입니다. 이러한 무기와 이를 운용하는 병사들은 보통 화기 분대로 편성됩니다."
