 BSH_nati_start: "바슈키르 민족주의"
 BSH_nati_start_desc: "민족주의 세력이 나라의 권력을 장악했습니다. 그들은 바시코르토스탄을 어디로 이끌 것입니까? 더 밝은 미래입니까, 아니면 나라의 붕괴입니까?"
 BSH_socialochka: "사회 지출 확대"
 BSH_socialochka_desc: "출산율을 성공적으로 높이려면 시민들에게 더 나은 여건을 마련해 주어야 합니다. 사회 지출을 늘려야 합니다."
 BSH_rojdaemost: "출산율 선전"
 BSH_rojdaemost_desc: "우리나라는 인구 감소를 겪고 있으므로 젊은 가정에 출산을 장려해야 합니다."
 BSH_debur: "탈관료화"
 BSH_debur_desc: "관료에 대한 지출과 그 수를 줄일 것이며, 절감된 자금은 국민을 위해 쓰일 것입니다."
 BSH_rebuild_roads: "도로 보수 투자"
 BSH_rebuild_roads_desc: ""
 BSH_patriotism: "애국주의"
 BSH_patriotism_desc: "우리나라에서 애국 교육을 진작시킬 때입니다."
 BSH_rebuild_national: "국내 산업 지원"
 BSH_rebuild_national_desc: ""
 BSH_valute: "독자 화폐"
 BSH_valute_desc: "결제에서 독자 화폐로의 전환을 시작할 것입니다."
 BSH_National_science: "국내 과학"
 BSH_National_science_desc: "바시키르 과학의 발전에 자금을 투자할 것입니다."
 BSH_Tatarisation: "바슈키르화"
 BSH_Tatarisation_desc: "모든 문헌과 모든 명칭은 바슈키르어로 되어 있어야 합니다."
 BSH_anti_lgbt: "비정상적 관계 선전 금지"
 BSH_anti_lgbt_desc: "가족과 혼인(남성과 여성의 결합), 모성의 우선성과 보호, 그리고 이념과 단체가 가족 문제에 침해하고 간섭하는 것으로부터 가족을 보호하는 법을 채택합니다. 아울러 \\"인간 본성의 보호에 관한\\" 법을 채택하여 인간의 자연스러운 본성에 반하는 비정상적 관계의 선전을 금지할 것을 제안합니다."
 BSH_territorial_reform: "영토 개혁"
 BSH_territorial_reform_desc: "우리 공화국의 영토 구조를 바꿀 것입니다."
 BSH_militarisation: "공화국의 군사화"
 BSH_militarisation_desc: ""
 BSH_territorial_defence: "영토 방어 생성"
 BSH_territorial_defence_desc: ""
 BSH_Sovereign_Internet: "주권 인터넷"
 BSH_Sovereign_Internet_desc: "다른 나라가 우리 시민에게 영향을 미치지 못하도록 우리의 인터넷 공간을 외국으로부터 완전히 독립시켜야 합니다."
 BSH_Democratic_clean: "민주주의자 숙청"
 BSH_Democratic_clean_desc: "우리는 서방의 하수인이 될 생각이 없습니다. 이제 우리나라에서 민주주의자들을 숙청할 때입니다."
 BSH_Communistst_clean: "공산주의자 숙청"
 BSH_Communistst_clean_desc: "소련의 유산은 파괴되어야 합니다. 붉은 전염병을 신봉하는 이들을 쫓아낼 때입니다."
 BSH_Anti_corruption_law: "반부패법"
 BSH_Anti_corruption_law_desc: "모든 형태의 부패와 싸울 것입니다."
 BSH_anti_immigration_policies: "반이민 정책"
 BSH_anti_immigration_policies_desc: "더 많은 반이민 정책을 시행하면 바슈키르 정체성이 온전히 살아남을 것입니다."
 BSH_decolectivisation: "탈집단화"
 BSH_decolectivisation_desc: "소련의 유산을 청산하고 주민들이 도시로 이주하도록 도와야 할 때입니다."
 BSH_tatar_past: "타타르의 과거"
 BSH_tatar_past_desc: "역사는 바꿀 수 없으며 우리도 이를 알고 있습니다. 우리는 카잔 칸국의 위대한 후계자입니다."
 BSH_constitution_return: "최초의 바슈키르 헌법 복원"
 BSH_constitution_return_desc: "우리나라에 정상적인 헌법을 되살릴 때입니다."
 BSH_true_political_and_national_freedom: "진정한 정치적 자유"
 BSH_true_political_and_national_freedom_desc: "진정한 정치적 자유의 시작은 국내 숙청 과정에서 발생한 참화에서 회복하는 것입니다. 이제 앞으로 나아가 우리 민족이 진정으로 원하는 것을 이루어야 할 때입니다."
 BSH_tatarin_nati_modifier: "바시코르토스탄 국가 정책"
 BSH_tatarin_nati_modifier_desc: "바시코르토스탄에서 민족주의 세력이 집권하면서 국내외 정책에 큰 영향을 미쳤습니다. 우선순위는 민족의 힘과 강대함, 위대한 과거의 선전, 그리고 잃어버린 바슈키르의 위대함을 되찾으려는 복수주의였습니다."
 BSH_tatar_kommi_modifier: "공산 바시코르토스탄의 정치"
 BSH_tatar_kommi_modifier_desc: "바시코르토스탄의 공산 정부는 소련 시대에 있었던 모든 좋은 것을 선전과 행동 양면에서 적극적으로 되살리려 하고 있습니다."
 BSH_Communism_start: "공산주의의 귀환"
 BSH_Communism_start_desc: "공산주의가 다시 바시코르토스탄에 돌아왔습니다. 공산주의자들이 다시 나라를 통치하게 될 것입니까?"
 BSH_arest_silovic: "농민 지원"
 BSH_arest_silovic_desc: "우리는 국내 농민이 될 것입니다. 그들이 우리 국민을 먹여 살리기 때문입니다."
 BSH_erase_nationalist: "모든 민족주의자 투옥"
 BSH_erase_nationalist_desc: "우리나라의 민족주의 조직을 제거할 때입니다."
 BSH_antigay_propaganda_laws: "동성애 선전 금지법"
 BSH_antigay_propaganda_laws_desc: "우리나라에서 성소수자를 법적으로 금지할 때입니다."
 BSH_clean_soc_net_desc: "모든 소셜 네트워크를 정화하고 적의 선전이 퍼지는 것을 허용하지 않을 것입니다."
 BSH_pioneria: "피오네리야"
 BSH_pioneria_desc: "청년들이 놀고 있어서는 안 되므로 피오네르를 되살릴 것입니다."
 BSH_Marks_school: "학교의 마르크스주의"
 BSH_Marks_school_desc: "학교 교육과정에는 반드시 마르크스가 포함될 것입니다."
 BSH_free_education: "무상 교육"
 BSH_free_education_desc: "교육은 우리 영광스러운 국가의 모든 시민에게 자유롭고 무상이어야 합니다."
 BSH_state_atheism: "국가 무신론"
 BSH_state_atheism_desc: "종교는 인민의 아편이므로 종교와 싸울 때입니다."
 BSH_collectivism: "집단주의"
 BSH_collectivism_desc: "집단화는 이미 한 번 효과를 거두었으므로 그 경험을 되풀이할 것입니다."
 BSH_mobilize_the_masses: "대중 동원"
 BSH_mobilize_the_masses_desc: "우리 군에는 당이 요구하는 곳이라면 어디서든 우리나라의 이익을 수호할 인원이 필요합니다."
 BSH_nationalisation_production: "생산 국유화"
 BSH_nationalisation_production_desc: "생산물의 국유화는 우리 경제가 더욱 강해지는 데 도움이 될 것입니다."
 BSH_the_culture_of_proletarianism: "프롤레타리아 문화"
 BSH_the_culture_of_proletarianism_desc: "노동 계급을 위한 프롤레타리아 문화를 뿌리내릴 때입니다. 이를 통해 우리는 공동의 아름다운 공산주의 미래를 향해 함께 나아갈 것입니다."
 BSH_fight_international_capitalists: "국제 자본가와의 투쟁"
 BSH_fight_international_capitalists_desc: "올리가르히는 위험하고 부패한 계급으로, 소련 시대의 쿨라크보다 나을 것이 없습니다. 소련 해체 이후 러시아 올리가르히는 점점 더 많은 경제적 영향력을 집어삼켰으며, 외국 기업이 주도하는 세계주의적 경제 모델을 위해 러시아 노동자들을 일자리에서 몰아냈습니다. 러시아를 되살리려면 무엇보다 먼저 국제 자본가 계급을 몰아내야 합니다."
 BSH_better_roads: "전반적 도로 개선"
 BSH_better_roads_desc: "우리나라의 도로 문제를 면밀히 다룰 필요가 있습니다."
 BSH_soviet_academy_of_sciences: "혁명 교육"
 BSH_soviet_academy_of_sciences_desc: "수십 년에 걸쳐 많은 이들이 목숨을 바쳐 이루고자 했던 것을 학생들이 잊지 않도록, 교실에서 혁명적 이상을 강화해야 합니다."
 BSH_weaken_the_banks: "은행 약화"
 BSH_weaken_the_banks_desc: "은행은 자본주의의 친위대로서 그 깃발을 들고 전투에 나서며 존재 자체로 그 이윤을 지킵니다. 은행은 세계의 빈곤 지역에 개입하고, 임금 덤핑과 이자 투기로 노동 계급을 착취하며, 합법적 기부와 불법적 기부 양쪽으로 정치에 영향력을 행사합니다. 은행은 단순히 비정치적인 단기 자금 대부업자의 지위로 되돌려져야 합니다."
 BSH_support_of_the_worker: "노동자 지원"
 BSH_support_of_the_worker_desc: "노동 계급은 우리의 지지 기반이자 힘이며, 우리는 자본주의라는 전염병에 맞선 투쟁에서 언제나 그들을 지원할 것입니다!"
 BSH_power_to_the_workers: "노동 계급 투자"
 BSH_power_to_the_workers_desc: "우리 경제 성장의 원동력이 될 노동 계급에 집중할 것입니다."
 BSH_ultimate_tax_reform: "대규모 세제 개혁"
 BSH_ultimate_tax_reform_desc: "일반 국민의 세금 부담은 덜어 주되 기업에는 그 반대가 되는 대규모 세제 개혁을 단행할 것입니다."
 BSH_single_party: "일당 체제"
 BSH_single_party_desc: "바시코르토스탄 공산당은 국가와 관련된 모든 분야에서 가장 잘 알고 있습니다. 다른 이들이 비켜 준다면 우리는 진정한 공산주의 유토피아 건설에 착수할 수 있으며, 이번에는 성공할 것입니다."
 BSH_nationalize_foreign_business: "외국 기업 국유화"
 BSH_nationalize_foreign_business_desc: "외국인이 소유한 산업 시설은 언제나 경제 안보에 위험 요소입니다. 외국이 경제 제재로 우리를 위협하는 상황에서, 산업 소유주가 하룻밤 사이에 떠나면서 공장의 핵심 부품을 가져가 버릴 위험은 늘 존재합니다. 이를 막으려면 외국이 불쾌해하더라도 이러한 산업을 국가의 소유로 삼아야 합니다."
 BSH_five_year_plan: "제1차 5개년 계획"
 BSH_five_year_plan_desc: "서방 국가들의 자유로운 경제 모델은 사회주의 국가의 미래가 될 수 없습니다. 고전적인 소련식 5개년 계획의 형태를 선호하는 계획 경제로의 복귀는 정부에 그동안 통제되지 않았던 경제에 대한 무제한의 영향력을 부여할 것입니다."
 BSH_authoritarian_control_over_economy: "경제에 대한 권위주의적 통제"
 BSH_authoritarian_control_over_economy_desc: "우리 국가의 경제 분야는 우연에 맡겨져 있었지만, 이제 강력한 지도자의 통제 아래로 되돌릴 것입니다."
 BSH_create_patrioitc_schools: "애국 학교 설립"
 BSH_create_patrioitc_schools_desc: "애국 학교는 청년에 대한 우리의 영향력을 높이고 공산당이 집권을 유지하는 데 도움이 될 것입니다."
 BSH_the_peoples_militias: "인민 민병대"
 BSH_the_peoples_militias_desc: "국민을 위한 재정이 풍부한 민병대를 편성하면 어떠한 분쟁에서든 군이 충분한 지원을 받을 수 있습니다."
 BSH_reestablish_the_military_industrial_complex: "군산복합체 재건"
 BSH_reestablish_the_military_industrial_complex_desc: "군대와 인민은 하나입니다!"
 BSH_red_army: "바슈키르 붉은 군대"
 BSH_red_army_desc: "사회주의의 성과와 업적을 지키기 위해 우리를 전투로 이끌 독자적인 붉은 군대를 창설할 것입니다."
 BSH_volga_ssr: "볼가 소비에트 사회주의 공화국"
 BSH_volga_ssr_desc: "이 지역의 다른 민족들을 우리 주위로 결집시켜야 하며, 오직 그렇게 해야만 위대함을 이룰 수 있습니다."
 BSH_volga_ssr_sov: "러시아의 일부로서의 볼가 소비에트 사회주의 공화국"
 BSH_volga_ssr_sov_desc: "우리는 이 지역의 경제를 한 단계 끌어올릴 수 있는 완전히 새로운 실체를 러시아에 제안할 준비가 되어 있습니다."
 BSH_volga_ssr_annex: "독립 볼가 소비에트 사회주의 공화국"
 BSH_volga_ssr_annex_desc: "볼가 지역 민족들과 함께 구 러시아 영토에서 가장 강력한 국가를 건설할 것입니다."
 BSH_full_social_support: "보건 정책의 결과"
 BSH_industry: "바슈키르 산업"
 BSH_agro: "농업 복합체 발전"
 BSH_five_year_plans: "5개년 계획"
 BSH_new_workplace: "신규 일자리"
 BSH_control_economic_idea: "통제 경제"
 BSH_clean_soc_net: "깨끗한 소셜 네트워크"
 BSH_fight_burecraci: "관료주의와의 투쟁"
 BSH_military_state_idea: "공화국의 군사화"
 BSH_soc_medical: "바시코르토스탄의 사회 정책"
 BSH_anti_lgbtqa_stance: "반 LGBT 정책"
 BSH_highways_repairing: "도로 보수"
 BSH_ter_orobona: "영토 방위"
 BSH_inet: "바슈키르 인터넷"
 BSH_anti_corruption: "반부패 정책"
 BSH_new_roads: "신규 도로"
 chechnya.0.t: "체첸, 종교 관광 개설을 제안"
 chechnya.0.d: "체첸 공화국이 양국 간 종교 관광을 개설할 것을 제안했습니다. 우리는 동의할 준비가 되었습니까?"
 chechnya.0.a: "흥미롭군"
 chechnya.0.b: "안된다"
 chechnya.1.t: "람잔 카디로프, 폴란드 공격을 제안"
 chechnya.1.d: "람잔 카디로프가 폴란드 영토에서 특별 작전을 수행할 것을 제안했습니다. 그의 견해로는 이 나라가 러시아에 너무 큰 해를 끼치고 있으며, 이제 처리해야 할 때입니다."
 chechnya.1.a: "그의 조언에 귀를 기울이자"
 chechnya.1.b: "안된다"
 chechnya.2.t: "람잔 카디로프, 조지아 공격을 제안"
 chechnya.2.d: "람잔 카디로프가 조지아 영토에서 특별 작전을 수행할 것을 제안했습니다. 그의 견해로는 이 나라가 러시아에 너무 큰 해를 끼치고 있으며, 이제 처리해야 할 때입니다."
 chechnya.2.a: "그의 조언에 귀를 기울이자"
 chechnya.2.b: "안된다"
 chechnya.3.t: "람잔 카디로프, 침략자로부터 벨라루스를 해방할 것을 제안"
 chechnya.3.d: "람잔 카디로프에 따르면 벨라루스는 현재 반러시아 정책을 펴는 점령 세력이 통치하고 있으며, 이들을 시급히 제거할 필요가 있습니다."
 chechnya.3.a: "그의 조언에 귀를 기울이자"
 chechnya.3.b: "안된다"
 chechnya.4.t: "람잔 카디로프, 체첸의 권력 장악"
 chechnya.4.d: "이제 전쟁이 끝났으니 우리의 아름다운 터전, 우리 공화국을 복구할 때입니다. 체첸의 위대함을 되찾기 위해 모든 노력을 다하겠습니다. - 람잔 카디로프는 인터뷰에서 이렇게 답했습니다."
 chechnya.4.a: "돈"
 chechnya.5.t: "체첸 러시아 국가근위대 창설"
 chechnya.5.d: "이제 우리 공화국에는 러시아 국가근위대라는 용맹한 수호자가 있습니다. 그 누구도 우리의 아름다운 체첸에 해를 끼칠 수 없습니다."
 chechnya.5.a: "돈"
 chechnya.6.t: "또 하나의 아흐마트 대대 창설"
 chechnya.6.d: "새로운 아흐마트 대대가 체첸과 러시아의 용맹한 전사들의 대열에 합류했습니다. 아흐마트 실라!"
 chechnya.6.a: "돈"
 chechnya.7.t: "구데르메스 특수부대 대학 설립"
 chechnya.7.d: "체첸에 특수부대 대학이 설립되어, 우리나라에 해당 분야의 더 숙련된 전투원과 전문가를 공급하게 될 것입니다."
 chechnya.7.a: "돈"
 chechnya.8.t: "체첸, 장갑차 \\"아흐마트\\" 공급 준비"
 chechnya.8.d: "새로운 장갑차는 우리 군에서 훌륭히 복무할 것입니다. 저렴한 가격과 품질이 특징입니다."
 chechnya.8.a: "돈"
 chechnya.9.t: "체첸 자동차 공장, 특수 부대를 위한 \"지하드-모바일\" 출시 예정"
 chechnya.9.d: "체첸아브토 공장(아르군)에서 러시아 특수부대의 돌격 부대용 \\"지하드 모빌\\" 생산을 조직할 가능성이 논의되고 있습니다."
 chechnya.9.a: "돈"
 chechnya.11.t: "체첸인, 러시아 대통령 암살에 성공"
 chechnya.11.d: "체첸 디아스포라의 불만이 가장 끔찍하고 예기치 못한 사건으로 이어졌습니다. 체첸 요원들이 우리 대통령에 대한 공격과 암살을 성공시켰습니다. 우리는 특별 작전의 개시를 선언할 수밖에 없습니다."
 chechnya.11.a: "신이시여, 우리를 도우소서"
 chechnya.12.t: "람잔 카디로프, 우크라이나 공격을 제안"
 chechnya.12.d: "람잔 카디로프가 우크라이나 영토에서 특별 작전을 수행할 것을 제안했습니다. 그의 견해로는 이 나라가 러시아에 너무 큰 해를 끼치고 있으며, 이제 처리해야 할 때입니다."
 chechnya.12.a: "그의 조언에 귀를 기울이자"
 chechnya.12.b: "안된다"
 chechnya.16.t: "인구셰티야 습격"
 chechnya.16.d: "인구셰티야 영토에 몇 차례 기습을 감행하여 약간의 장비를 확보했습니다."
 chechnya.16.a: "좋아"
 chechnya.17.t: "다게스탄 반란"
 chechnya.17.d: "이웃 다게스탄에서 반란을 일으켰으며, 이는 러시아군을 전선을 따라 분산시키는 데 도움이 될 수도 있습니다."
 chechnya.17.a: "가자, 이치케리야를 위하여!"
 chechnya.18.t: "체첸과의 평화 조약"
 chechnya.18.d: "이 전쟁은 양측 모두를 지치게 했으니, 이제 평화를 맺을 때일지도 모릅니다."
 chechnya.18.a: "좋다, 평화를 맺자."
 chechnya.18.b: "절대 안된다"
 chechnya.19.t: "체첸과의 우호 협정"
 chechnya.19.d: "체첸 정부는 과거의 다툼을 잊고 양국 간 우호 동반자 조약 체결로 나아갈 것을 제안했습니다."
 chechnya.19.a: "이것이 우리 역사의 새로운 단계가 되기를"
 chechnya.19.b: "그들 따위는 알 바 아니다"
 chechnya.20.t: "러시아와의 우호 협정"
 chechnya.20.d: "그들이 우리와 우호 동반자 협정을 체결하는 데 동의했습니다."
 chechnya.20.a: "이것이 우리 역사의 새로운 단계가 되기를"
 chechnya.21.t: "체첸의 점령"
 chechnya.21.d: "체첸 무장 세력이 일련의 테러 공격을 일으켰고, 우리 대통령에 대한 암살까지 성공시켜 이제 그들이 나라를 장악했습니다!"
 chechnya.21.a: "오, 맙소사"
 chechnya.22.t: "체첸, 협력 협정을 제안"
 chechnya.22.d: "체첸 정부는 대륙 전역에서 동맹과 파트너를 찾고 있으며, 이번에 우리에게 접촉해 왔습니다. 우리는 그들과의 협력에 동의하겠습니까?"
 chechnya.22.a: "찬성"
 chechnya.22.b: "안된다"
 chechnya.23.t: "의용 분대"
 chechnya.23.d: "이치케리야의 의용군 부대가 우리를 도우러 왔습니다. 함께 자유를 쟁취합시다!"
 chechnya.23.a: "자유를 위하여!"
 chechnya.24.t: "러시아 공화국들의 소요"
 chechnya.24.d: "우리는 인근 여러 지역에서 봉기를 조직하고 있으며, 러시아에 평화를 주지 않을 것입니다!"
 chechnya.24.a: "이치케리야를 위하여"
 chechnya.25.t: "빈 라덴과의 회동"
 chechnya.25.d: "우리는 빈 라덴과 회동을 가졌으며, 그는 우리에게 지원을 약속했습니다."
 chechnya.25.a: "알겠다"
 chechnya.26.t: "실레지아 봉기"
 chechnya.26.d: "체첸 수반이 실레지아에서 \\"독립 국민투표\\"를 실시할 것을 제안했습니다. 이는 우리에게 상당한 재정적 비용과 시간을 요구하며, 폴란드 정부의 반대로 인해 성공하지 못할 수도 있습니다. 우리는 동의하겠습니까?"
 chechnya.26.a: "실레지아 소요를 일으키자"
 chechnya.26.b: "안된다"
 chechnya.27.t: "실레지아 봉기"
 chechnya.27.d: "실레지아의 반란이 마침내 일어났으며, 우리의 투자가 결실을 맺기를 바랍니다."
 chechnya.27.a: "실레지아의 자유를!"
 chechnya.28.t: ""
 chechnya.28.d: ""
 chechnya.28.a: ""
