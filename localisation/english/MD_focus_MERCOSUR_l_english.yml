 mercosur.29.d: "The accession missions backed by [FROM.GetName] have been completed. We have now been admitted as a full member of MERCOSUR."
 mercosur.29.a: "We join the bloc."
 mercosur.30.t: "South American Summit Announced"
 mercosur.30.d: "A new South American Summit has been announced as the first step toward renewed regional cooperation. Organizers have declared that MERCOSUR must be revitalized, economic coordination strengthened, and the continent given a stronger collective voice in world affairs. Supporters hail the initiative as a long-overdue return to regional ambition, while critics question whether South America can move beyond symbolism and into durable integration."
 mercosur.30.a: "A new regional chapter begins."
 mercosur.31.t: "[FROM.GetName] Joins MERCOSUR as an Associate Member"
 mercosur.31.d: "[FROM.GetName] has agreed to join MERCOSUR as an associate member, marking a new step in the revival of South American regional cooperation. While associate status falls short of full membership, it opens the door to closer trade ties, political coordination, and future accession talks. Supporters see the move as a sign that MERCOSUR is once again becoming a serious regional force."
 mercosur.31.a: "The bloc is growing."
 mercosur.32.t: "[FROM.GetName] Becomes a Full Member of MERCOSUR"
 mercosur.32.d: "[FROM.GetName] has completed its accession process and entered MERCOSUR as a full member. What began as regional diplomacy has now become a tangible expansion of the bloc itself, deepening its economic weight and political relevance across Latin America. For supporters of integration, this is more than a diplomatic success — it is proof that MERCOSUR can still shape the future of the continent."
 mercosur.32.a: "A new member, a stronger bloc."
