 NKO_spa.54.t:0 "Inspetores de Aquisição Debatem a Bonança"
 NKO_spa.54.d:0 "O mandato de equipamentos deixou ferramental sobressalente e uma força de trabalho treinada. Os oficiais de aquisição podem destiná-los a uma nova fábrica militar ou convertê-los imediatamente em armas."
 NKO_spa.54.factory:0 "Construir uma fábrica militar para pedidos futuros."
 NKO_spa.54.equipment:0 "Entregar 2.500 armas de infantaria agora."
 NKO_spa.55.t:0 "Dividindo a Colheita"
 NKO_spa.55.d:0 "A colheita superou o plano. Autoridades locais perguntam se o excedente deve abastecer as rações domésticas ou ser vendido por divisas."
 NKO_spa.55.rations:0 "Abastecer as rações domésticas. (§G+3%§! estabilidade)"
