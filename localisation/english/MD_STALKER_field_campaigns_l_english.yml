 STALKER.200.a: "Authorize the first assignment."
 STALKER.200.a_tt: "Unlock a 25 Political Power investigation lasting 60 days."
 STALKER.200.b: "Leave the case unresolved."
 STALKER.200.b_tt: "Close this campaign without its rewards. Bandits gain 10 influence; the next campaign can begin."
 STALKER.200.t: "Yantar: The Silent Survey"
 STALKER.200.d: "A survey party has stopped answering the Ecologists at Yantar. Its last instruments agreed on nothing: a clear road, a lethal radiation reading, and voices on an unused channel. The scientists want an escort to recover the equipment before another group takes it."
 STALKER.201.a: "Prepare the recovery assignment."
 STALKER.201.a_tt: "Unlock a 50 Political Power field intervention lasting 60 days."
 STALKER.201.t: "The Survey Markers"
 STALKER.201.d: "The escort finds markers laid by two different parties. One points toward the missing camp; the other follows a safer ridge. The surviving technician insists that the instruments, rather than the missing people, were the intended prize."
 STALKER.202.a: "Share the findings with the Ecologists."
 STALKER.202.a_tt: "Scientists gain 10 influence and exploitation rises by 5. Preserved findings aid the 2018 SIRCAA decision."
 STALKER.202.b: "Restrict the route and seal the readings."
 STALKER.202.b_tt: "Containment rises by 10 and exploitation falls by 5. The findings remain restricted."
 STALKER.202.c: "Place the project under military supervision."
 STALKER.202.c_tt: "The military gains 10 influence and scientists lose 5. Civilian access is restricted."
 STALKER.202.t: "The Yantar Record"
 STALKER.202.d: "The recovered readings can guide later research, but publishing the route would draw more stalkers into the same anomalies. The Ecologists, the perimeter command, and their military escort each ask for custody of the record."
 STALKER_field_name_1: "Yantar: The Silent Survey"
 STALKER.203.a: "Authorize the first assignment."
 STALKER.203.a_tt: "Unlock a 25 Political Power investigation lasting 60 days."
 STALKER.203.b: "Leave the case unresolved."
 STALKER.203.b_tt: "Close this campaign without its rewards. Bandits gain 10 influence; the next campaign can begin."
 STALKER.203.t: "Army Warehouses: The Contested Road"
 STALKER.203.d: "Duty blames Freedom for a missing supply convoy. Freedom says the checkpoint diverted it onto a bandit road. Both offer guides, and both demand authority over the route before the next convoy leaves the Army Warehouses."
 STALKER.204.a: "Prepare the recovery assignment."
 STALKER.204.a_tt: "Unlock a 50 Political Power field intervention lasting 60 days."
 STALKER.204.t: "Tracks at the Checkpoint"
 STALKER.204.d: "Spent cartridges and altered convoy papers undermine both factions' first accounts. The supplies were diverted after the patrol changed shifts. There is time to secure the next convoy, provided someone accepts responsibility for its passage."
 STALKER.205.a: "Negotiate shared passage."
 STALKER.205.a_tt: "Duty and Freedom each gain 5 influence; activity falls by 5. Secured passage reduces the 2022 containment loss by 5."
 STALKER.205.b: "Give Duty responsibility for the road."
 STALKER.205.b_tt: "Duty gains 10 influence; Freedom and bandits lose 5. Secured passage reduces the 2022 containment loss by 5."
 STALKER.205.c: "Authorize Freedom's escorts."
 STALKER.205.c_tt: "Freedom gains 10 influence; Duty and bandits lose 5. Secured passage reduces the 2022 containment loss by 5."
 STALKER.205.t: "The Road Agreement"
 STALKER.205.d: "The convoy reaches the warehouses. Its escort can leave the road under one faction, or broker a passage agreement neither faction can enforce alone. The stalkers who carried the supplies ask only that the checkpoints stop changing without warning."
 STALKER_field_name_2: "Army Warehouses: The Contested Road"
 STALKER.206.a: "Authorize the first assignment."
 STALKER.206.a_tt: "Unlock a 25 Political Power investigation lasting 60 days."
 STALKER.206.b: "Leave the case unresolved."
 STALKER.206.b_tt: "Close this campaign without its rewards. Bandits gain 10 influence; the next campaign can begin."
 STALKER.206.t: "Red Forest: The Returning Patrol"
 STALKER.206.d: "A patrol reported missing in the Red Forest has returned with one fewer member and two accounts of the same night. A recovered radio carries a mercenary call sign. The men remember receiving orders from their own command on a frequency it never used."
 STALKER.207.a: "Prepare the recovery assignment."
 STALKER.207.a_tt: "Unlock a 50 Political Power field intervention lasting 60 days."
 STALKER.207.t: "A Voice on the Wrong Channel"
 STALKER.207.d: "The first debriefing finds a recorded command among bursts of psi interference. The mercenaries were following the patrol's instruments rather than its route. A second team must recover the abandoned recorder before the remaining witness changes his account again."
 STALKER.208.a: "Protect the witnesses and preserve the record."
 STALKER.208.a_tt: "Stalkers gain 10 influence and mercenaries lose 5. The record discounts one MDST purge to 50 Political Power for the Zone controller."
 STALKER.208.b: "Examine the recorder under scientific supervision."
 STALKER.208.b_tt: "Scientists gain 10 influence and activity rises by 5. Gain one 25% electronics research bonus and one discounted MDST purge."
 STALKER.208.c: "Destroy the material and conceal the losses."
 STALKER.208.c_tt: "Containment rises by 10 and stalkers lose 5 influence. The witnesses' evidence cannot be used against MDST."
 STALKER.208.t: "The Red Forest Evidence"
 STALKER.208.d: "The recorder survives. Its voices can help an investigator recognize a compromised channel, but the living witnesses need protection. The perimeter command offers to close the file; the scientists ask to examine it before its contents disappear into another classified archive."
 STALKER_field_name_3: "Red Forest: The Returning Patrol"
 STALKER_field_investigate: "Investigate the field report"
 STALKER_field_investigate_desc: "Commit 25 Political Power to this assignment. It takes 60 days and follows the original Zone if control changes. The report reaches the current controller on the next monthly pulse."
 STALKER_field_recover: "Send the recovery assignment"
 STALKER_field_recover_desc: "Commit 50 Political Power to this assignment. It takes 60 days and follows the original Zone if control changes. The report reaches the current controller on the next monthly pulse."
 STALKER_field_supplies: "Escort scientific supplies"
 STALKER_field_supplies_desc: "Spend 25 Political Power on a 60-day scientific supply escort. On completion: scientists and containment each rise by 5. The next escort opens after 180 days. This grants no research or later campaign payoff."
 STALKER_field_patrol: "Patrol the contested road"
 STALKER_field_patrol_desc: "Spend 25 Political Power on a 60-day patrol. On completion: bandits and activity each fall by 5. An accord adds 5 Duty and 5 Freedom; backing one faction adds 5 to it and removes 5 from its rival. The next patrol opens after 180 days. This grants no research or later campaign payoff."
