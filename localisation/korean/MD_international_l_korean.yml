 ban_from_operating: "민간군사기업 활동 금지"
 ban_from_operating_desc: "다른 국가가 우리의 PMC를 이용하지 못하게 됩니다"
 lift_ban_from_operating: "다른 국가에서 작전 활동 허용"
 lift_ban_from_operating_desc: "다른 국가가 우리의 PMC를 고용할 수 있게 됩니다"
