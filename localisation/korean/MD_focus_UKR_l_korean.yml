 UKR_finish_repair: "장거리 항공기 전체 수리 종료"
 UKR_finish_repair_desc: "장거리 항공기의 복원이 끝났으니 수리 프로그램을 마무리할 때가 되었습니다. 우리 전략폭격기는 다시금 복무할 준비를 마쳤으며, 복원에 투입하던 자원을 이제 다른 곳에 돌릴 수 있습니다. 수리 프로그램은 종료되며, 이후 이 사업을 통해 복원 대상이 되는 항공기는 더 없습니다."
