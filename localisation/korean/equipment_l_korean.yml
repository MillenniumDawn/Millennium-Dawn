 early_helicopter: "수송 헬리콥터"
 early_helicopter_desc: "초기 헬리콥터 설계입니다. 이 연구를 통해서 수송 헬리콥터와 공격 헬리콥터를 연구할 수 있도록 해 줄 것입니다."
 attack_helicopter_equipment: "공격 헬리콥터"
 attack_helicopter_desc: "공격 헬리콥터는 지상부대를 지원하기 위해 무장한 헬리콥터입니다. 항공엄호가 없는 장갑화된 차량이나 부대에게 효과적이며, 적절한 대응수단이 없는 상대에게 빠르게 치고 빠질 수 있습니다. 하지만 이 공격 헬리콥터는 대공화기나 제트 전투기에게 취약합니다."
 carrier_0: "항공모함 1965"
 carrier_0_desc: "제2차 세계대전이 끝난 이후 공군력은 해군 교리에서 최고의 자리를 차지했으며, 이러한 권력의 상징은 종종 해군력의 가장 귀중한 소유물입니다. 항공모함의 존재는 전투의 성패를 좌우할 수 있습니다. 그들의 엄청난 중요성과 영향력에도 불구하고 그들은 자신을 방어하는 능력이 매우 약하기 때문에 항상 호위가 필요합니다."
