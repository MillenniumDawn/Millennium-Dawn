 UKR_develop_t84u: "Разработка §YТ-84У «Оплот»§!"
 UKR_develop_t84u_desc: "Т-84У «Оплот» — украинский основной боевой танк третьего поколения, разработанный Харьковским конструкторским бюро имени О. О. Морозова на базе танка Т-84.\nТанк получил новую сварно-катаную башню с цельноштампованной крышей, изготовленной методом электрошлаковой переплавки, благодаря чему она обладает большей прочностью и живучестью.\nБлагодаря упрощенной форме башни удалось успешно разместить в ней многослойную броню. Также был увеличен её внутренний объём.\nВ лобовую проекцию башни установлена новая украинская система динамической защиты третьего поколения «Ниж».\nТанк оснащён украинской динамической и активной защитой, зарубежными прицельными устройствами и увеличенными боковыми экранами."
 UKR_develop_yatahan: "Разработка §YТ-84-120 «Ятахан»§!"
 UKR_develop_yatahan_desc: "Т-84-120 «Ятахан» — это модификация танка Т-84У «Оплот», оснащенная 120-мм пушкой, адаптированной под стандарты НАТО, вместо стандартной 125-мм пушки. Она разработана Харьковским конструкторским бюро имени О. О. Морозова.\nТанк имеет 120-мм пушку КБМ2, использующую 120-мм боеприпасы НАТО.\nВ задней части башни расположен карусельный автомат заряжания (первоначально французский, затем украинского производства).\nВозможна установка новой 140-мм пушки «Багира».\nСборка осуществляется из компонентов украинского производства, хотя танк полностью совместим с компонентами зарубежного производства."
 UKR_develop_bahira: "Разработка §YТ-84-140 «Багира»§!"
 UKR_develop_bahira_desc: "Т-84-140 «Бахира» — это предлагаемая модификация танка Т-84-120 «Ятахан», которая должна была быть оснащена 140-мм пушкой «Бахира», разработанной Харьковским конструкторским бюро имени О. О. Морозова.\nКарусельный автомат заряжания расположен в кормовой части башни.\nСобран из компонентов украинского производства, хотя полностью совместим с компонентами зарубежного производства."
 UKR_develop_bm_oplot: "Разработка §YТ-84 «БМ Оплот»§!"
 UKR_develop_bm_oplot_desc: "Т-84 «БМ Оплот» — новейшая и наиболее совершенная модификация основного боевого танка Т-84У «Оплот», разработанная Харьковским конструкторским бюро имени О. О. Морозова.\nСреди её отличительных особенностей — более совершенная броня, новые системы радиоэлектронной борьбы и другие.\nОдной из заметных особенностей является новый панорамный прицел ПНК-6."
 UKR_develop_bastion: "Разработка §YТ-84 «Бастион»§!"
 UKR_develop_bastion_desc: "Т-84 «Бастион» — это, по сообщениям, программа модернизации, согласно которой танк будет избавлен от деталей российского производства.\nВ варианте Т-84 «БМ Оплот», принятом на вооружение в 2009 году, имелось определенное количество компонентов и материалов российского происхождения: отдельные компоненты электрооборудования, компоненты блоков и систем.\nСообщалось, что их относительно немного, но все они должны быть полностью заменены.\nПланировалось, что элементная база должна не только избавиться от российских компонентов, но и быть значительно модернизирована."
 UKR_develop_t84u_flag: "Завершено принятие решения §YРазработка Т-84У «Оплот»§!"
