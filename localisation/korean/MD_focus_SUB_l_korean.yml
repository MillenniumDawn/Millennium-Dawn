 Sovfed_agree_Idel: "이델-우랄에 관한 우리 법안이 통과되었다"
 CRM_zone: "자유 경제 구역"
 CRM_naval: "크림 조선 기업"
 CRM_tourism_idea: "크림 관광"
 CRM_selhoz_idea: "농업 정책"
 CRM_samoborona_idea: "크림 자위대"
 CRM_samoborona_idea1: "크림 인민 민병대"
 CRM_getman: "모든 크림인은 헤트만"
 CRM_getman_desc: "크림인들은 자신의 소득을 공식적으로 신고하기를 꽤 꺼리므로, 예산에는 분명 상당한 자금이 들어올 것입니다."
 CRM_kazachestvo: "흑해 카자크"
 CRM_Start: "크림의 운명"
 CRM_Start_desc: "우리 반도는 중요한 지정학적 위치에 있으며 많은 이들이 이를 차지하고 싶어 합니다."
 CRM_economic_zone: "경제특구"
 CRM_economic_zone_desc: "러시아는 우리 지역을 경제특구로 만들 준비가 되어 있으며, 이는 장차 우리에게 경제 성장을 가져다줄 것입니다."
 CRM_promka: "산업 부흥"
 CRM_promka_desc: "우리 산업은 1990년대 이후 폐허 상태였으며, 이제 예전의 위대함을 되찾을 때입니다."
 CRM_ros_banks: "러시아 은행"
 CRM_ros_banks_desc: "러시아 은행들이 우리 반도 영토에 서서히 진출하기 시작했습니다."
 CRM_airport: "공항 재건"
 CRM_airport_desc: "우리 공항은 러시아에서 가장 아름다운 공항이 될 것입니다."
 CRM_infra: "도로 보수"
 CRM_infra_desc: "우리의 인프라는 끔찍한 상태이지만, 이제 이를 보수할 수 있게 되었습니다."
 CRM_tourism: "관광 부흥"
 CRM_tourism_desc: "러시아에서 오는 관광객이 이제 우리에게 오기가 더 쉬워졌기 때문에 유동 인구가 세 배로 늘어날 것입니다."
 CRM_cipgro: "디지털화"
 CRM_cipgro_desc: "우리의 기술 인프라는 매우 낡았으므로 새로운 기술을 도입하겠습니다."
 CRM_energy: "에너지 안보"
 CRM_energy_desc: "우리는 본토에 대한 의존도가 매우 높았지만, 이제 에너지 독립을 위해 노력할 것입니다."
 CRM_selhoz: "농공업 투자"
 CRM_selhoz_desc: "우리 농업은 적절한 투자가 이루어지면 러시아 최고 수준의 산업 중 하나가 될 수 있습니다."
 CRM_ukrep: "방어 강화"
 CRM_ukrep_desc: "우리가 러시아의 보호 아래 있다고 해도 방어 대책은 여전히 고민해야 합니다."
 CRM_zavod_ships: "해양 산업"
 CRM_zavod_ships_desc: "크림 해양 산업의 옛 위대함을 되살려 예산에 수입을 가져오겠습니다."
 CRM_rost: "크림의 성장"
 CRM_rost_desc: "우리 경제가 마침내 처음으로 안정적인 성장세를 보이고 있습니다."
 CRM_empire: "군주제를 기억하라"
 CRM_empire_desc: "우리 공화국의 수장이 인터뷰에서 러시아에는 군주제가 필요하다고 말했고, 이는 러시아의 일부 인사들 사이에서 분노의 폭풍을 일으켰습니다."
 CRM_kazaki: "카자크 부활"
 CRM_kazaki_desc: "오래전 이 지역에서 사라진 카자크를 부활시킬 때입니다."
 CRM_pmcs: "크림 민간 군사 기업"
 CRM_pmcs_desc: "러시아군과 유사한 우리만의 부대를 창설하고, 기업인들을 자금 조달에 참여시키겠습니다."
 CRM_ratnik: "전투원에게 \\"라트니크\\" 장비 지급"
 CRM_ratnik_desc: ""
 CRM_samooborona: "크림 자위대"
 CRM_samooborona_desc: "우려하는 시민들이 적의 침해로부터 자신들의 영토를 지키기 위해 일어섰습니다."
 CRM_anti_ukr: "우크라이나 첩자 색출"
 CRM_anti_ukr_desc: "우크라이나는 언제나 우리에게 영향력을 행사하고 우리를 복속시키려 할 것이므로, 모든 첩자를 색출해야 합니다."
 CRM_defend_armyansk: "아르먄스크 강화"
 CRM_defend_armyansk_desc: "적이 돌파하도록 내버려 두어서는 안 되는 방어선, 아르먄스크입니다."
 CRM_became_opolchenie: "인민 민병대"
 CRM_became_opolchenie_desc: "이제 자위대가 법적으로 확립된 조직인 인민 민병대가 되고 있습니다."
 CRM_opolchenie_police: "경찰 기능"
 CRM_opolchenie_police_desc: "우리는 일부 경찰 기능을 수행할 권리를 얻어 경찰의 업무를 덜어 줄 것입니다."
 CRM_opolchenie_corrupt: "부패 관리와의 투쟁"
 CRM_opolchenie_corrupt_desc: "모두에게 위법 행위가 명백한 열성적인 부패 관리들을 우리가 체포할 수 있게 될 것입니다."
 CRM_monarchy: "단일 반도 안의 군주제"
 CRM_monarchy_desc: "우리 반도는 언제나 황실에 대한 숭배의 요람이었으며, 이제 로마노프 가문의 직계 후손이 우리의 수장이 될 것입니다."
 CRM_monarchy_rule: "로마노프 가문의 통치"
 CRM_monarchy_rule_desc: "새로운 시대가 우리에게 다가오고 있으며, 이제 러시아에도 참된 길로 돌아갈 기회가 있음을 보여 줄 것입니다."
 CRM_monarchy_antidemocracy: "거짓 민주주의와의 투쟁"
 CRM_monarchy_antidemocracy_desc: "서방의 가치와 그들의 거짓 민주주의는 우리와 맞지 않으며, 우리는 아름다운 우리 반도에서 그 모든 지지자들과 싸울 것입니다."
 CRM_monarchy_constituion: "헌법 개정"
 CRM_monarchy_constituion_desc: "우리는 여전히 21세기에 살고 있으며, 우리의 권력이 법적으로 확인되도록 우리나라의 기본법인 헌법을 바꿀 필요가 있습니다."
 CRM_monarchy_tzar: "니콜라이 2세의 후계자"
 CRM_monarchy_tzar_desc: "우리의 통치자는 황실의 진정한 후계자이며 하느님이 주신 권능으로 우리를 멋진 미래로 이끌 것입니다."
 CRM_monarchy_tzar_academy: "왕립 아카데미"
 CRM_monarchy_tzar_academy_desc: "시민들이 교양을 갖추어 우리나라의 발전에 크게 기여할 수 있도록 왕립 교육 기관을 부활시키겠습니다."
 CRM_monarchy_tzar_polk: "폐하의 경기병 연대"
 CRM_monarchy_tzar_polk_desc: "예카테리나 2세 치하에서 창설된 이 연대는 러시아 제국의 붕괴와 함께 역사 속으로 사라졌으며, 이제 우리가 부활시킬 것입니다."
 CRM_monarchy_tavria: "타브리아"
 CRM_monarchy_tavria_desc: "우리 국가의 현재 명칭은 우리에게 맞지 않으며, 제국의 유산을 강조해야 합니다."
 CRM_monarchy_church: "하느님이 주신 권능"
 CRM_monarchy_church_desc: "우리의 권위가 하느님께서 직접 주신 것임을 정당화하기 위해 교회와 접촉해야 합니다."
 CRM_decommusitaion: "탈공산화"
 CRM_decommusitaion_desc: "우리 반도에서 붉은 역병의 모든 흔적을 정리하겠습니다."
 CRM_oligarch: "올리가르히는 새로운 귀족"
 CRM_oligarch_desc: "귀족과 같은 인구 계층을 다시 만들어야 합니다. 지역 올리가르히가 안성맞춤입니다."
 CRM_Tavria: "타브리아"
 CRM_tatars: "크림 민주공화국"
 CRM_tourism_TT: "관광으로 수입을 얻습니다: $$§G0.100§!\n"
 CRM_tatars_bunt_tt: "크림 타타르인들이 혁명을 일으킬 것입니다."
 CRM_royal_leib_guard: "부활한 레이브 가르디야"
 CRM_royal_academy: "왕립 아카데미"
 CRM_crusade_against_democracy: "민주주의자들에 대한 십자군"
 CRM_rule_romanov: "로마노프 가문의 통치"
 CRM_rule_romanov1: "로마노프 가문의 통치"
 CRM_nazbols: "국가 볼셰비즘 정치"
 CRM_russian_orthodox_communist_church_idea: "러시아 공산 정교회"
 CRM_economic: "크림 경제"
 CRM_economic_desc: "우리는 소비에트 시대 이후 잃어버린 크림의 옛 위대함을 되살리려 노력할 것입니다."
 CRM_invest: "외국인 투자"
 CRM_invest_desc: "우리의 아름다운 반도에 외국인 투자를 유치하려 노력할 것입니다."
 CRM_pishevaya: "식품 산업"
 CRM_pishevaya_desc: "식품 산업에 자금을 지원할 필요가 있습니다."
 CRM_neftegaz: "석유 및 가스 산업"
 CRM_neftegaz_desc: "우리의 석유 및 가스 부문은 여전히 이익을 가져다줄 수 있습니다."
 CRM_trolleybus: "크림 트롤리버스"
 CRM_trolleybus_desc: "자체 트롤리버스 생산 체계를 구축하겠습니다."
 CRM_selhoz_product: "농기계"
 CRM_selhoz_product_desc: "우리에게는 자체 농기계 생산을 발전시킬 기회가 있습니다."
 CRM_evpator: "크림 군수 산업"
 CRM_evpator_desc: "우리의 소규모 군수 산업은 그동안 투자가 부족했으며, 이제 이를 바꿀 때입니다."
 CRM_natbols: "민족볼셰비키"
 CRM_natbols_desc: "크림은 러시아 문명 부흥의 거점이 될 것이며, 참된 애국자들이 음울한 유산의 속박을 떨쳐내고 국민을 앞으로 이끌 것입니다."
 CRM_rus_nation: "러시아 민족을 위한 투쟁"
 CRM_rus_nation_desc: "러시아의 르네상스는 크림에서 시작되며, 우리는 다른 어떤 민족도 우리 땅에서 우리를 모욕하고 학대하도록 내버려 두지 않을 것입니다."
 CRM_peredel: "재산 재분배"
 CRM_peredel_desc: "이 땅에 있는 올리가르히의 모든 재산을 몰수하겠습니다."
 CRM_orujie: "무기 소지의 자유"
 CRM_orujie_desc: "우리나라의 모든 시민이 합법적으로 총기를 소지할 수 있도록 허용하겠습니다!"
 CRM_no_aborts: "낙태는 악"
 CRM_no_aborts_desc: "우리 민족에 대한 합법적 집단 학살 수단의 하나인 낙태를 금지하겠습니다."
 CRM_national_science: "국가 과학"
 CRM_national_science_desc: "과학은 자유로워야 하며 가능한 한 많은 자금을 지원받아야 합니다."
 CRM_support_other: "빈민 지원"
 CRM_support_other_desc: "소기업, 군대, 농민 모두가 가난과 비참함으로 내몰렸으며, 우리는 이를 바로잡아야 합니다."
 CRM_battle_suqads: "전투 분대"
 CRM_battle_suqads_desc: "우리는 스스로를 지켜야 하며, 이를 위해 러시아 민족의 참된 수호자인 전투 부대의 모집을 시작하겠습니다."
 CRM_army: "러시아군"
 CRM_army_desc: "우리는 힘이 닿는 곳이라면 어디서든 러시아인의 이익을 지킬 진정한 군대를 창설하겠습니다."
 CRM_ruralisation: "농촌화"
 CRM_ruralisation_desc: "우리의 광활한 영토에는 정착민과 농업 시설의 건설이 필요하며, 이 공간을 채우기 위해 빈민들을 보내겠습니다."
 CRM_anti_west: "반서방 정책"
 CRM_anti_west_desc: "서방은 언제나 우리의 진정한 적이었고 앞으로도 그러할 것입니다."
 CRM_new_religion: "러시아 공산 정교회"
 CRM_new_religion_desc: "새로운 종교는 과거의 노예 족쇄를 벗어던지고 우리를 밝은 미래로 이끄는 데 도움이 될 것입니다."
 CRM_rus_expansion: "러시아의 팽창"
 CRM_rus_expansion_desc: "러시아인은 세계 어느 곳에서든 러시아인을 위해 싸울 것입니다."
 SIL_bund_category: "[SIL.GetFlag]실레지아의 반란"
 SIL_bund_category_desc: "[SIL.GetFlag]실레지아 지역은 오래전부터 자치를 향한 경향을 보여 왔으며, 매년 열리는 자치 행진은 이 지역 주민들이 폴란드의 다른 지역과 달리 특정한 권리를 원한다는 점을 분명히 보여 줍니다. 적들이 이를 이용할 수 있습니다.\n\n§Y[SIL.GetFlag] 실레지아의 급진화 비율§!: [?POL.silesiabund]%"
 SIL_bund_pol_police: "경찰 단속 실시"
 SIL_bund_pol_spec: "보안 기관이 [SIL.GetFlag]분리주의자를 찾도록 강제"
 SIL_bund_pol_end: "[SIL.GetFlag]반란을 완전히 진압"
 SIL_bund_pol_nati: "민족주의자를 이용해 [SIL.GetFlag]분리주의자 체포"
 SIL_bund_pol_visegrad: "[CZE.GetFlag][HUN.GetFlag][SLO.GetFlag]비셰그라드 특수 기관 활용"
 SIL_bund_pol_ukr: "[UKR.GetFlag]우크라이나 특수 기관의 지원 요청"
 SIL_bund_pol_es: "EU 특수 기관의 지원 요청"
 SIL_bund_sov_finance: "[SIL.GetFlag]분리주의자에게 자금 지원"
 SIL_bund_sov_weapons: "[SIL.GetFlag]분리주의자에게 무기 공급"
 SIL_bund_sov_start: "무장 [SIL.GetFlag]봉기 개시"
 SIL_bund_sov_warsaw: "바르샤바 조약 특수 기관 활용"
 SIL_bund_sov_vlianie: "[SIL.GetFlag]지역 정치 엘리트에 영향력 행사"
 SIL_bund_che_boeviks: "[SIL.GetFlag]분리주의자를 위해 무장 부대 파견"
 SIL_bund_che_diaspora: "[CHE.GetFlag]체첸 디아스포라 활용"
 SIL_start_bund: "[SIL.GetFlag]반란이 시작되었다"
 SIL_end_bund: "[SIL.GetFlag]반란이 진압되었다"
 SIL_chechen_help: "[CHE.GetFlag]체첸 전투원이 실레지아로 파견됨"
 SIL_bund_finish_tt: "[SIL.GetFlag]실레지아의 급진화 비율이 15% 미만입니다."
 SIL_bund_start_tt: "[SIL.GetFlag]실레지아의 급진화 비율이 85% 이상입니다."
 SIL_silesiabund_tt: "[SIL.GetFlag]실레지아의 급진화 비율이 §Y[?modify_silesiabund]%§! 변동합니다."
 KHM_economic: "새 천년의 경제"
 KHM_economic_desc: "우리 지역은 21세기로 들어섰으며, 새로운 세기의 도전에 맞서 번영을 향해 나아갈 때입니다."
 KHM_unipro_desc: "다섯 개 발전 회사의 합병으로 설립된 러시아 발전 회사입니다."
 KHM_bridges: "새 교량 건설"
 KHM_bridges_desc: "우리 지역의 많은 곳에 새 교량 건설이 필요하며, 물류를 개선하기 위해 여기에 투자하겠습니다."
 KHM_surgutneftegaz_desc: "러시아 최대 석유 및 가스 생산 기업 중 하나입니다."
 KHM_surgut_airport: "수르구트 공항"
 KHM_surgut_airport_desc: "수르구트 공항을 전면적으로 재건하겠습니다."
 KHM_promka: "산업 투자"
 KHM_promka_desc: "석유 및 가스 산업 외에도 우리의 산업을 발전시키겠습니다."
 KHM_small_business: "소기업 지원"
 KHM_small_business_desc: "소기업도 우리 경제 발전의 우선 과제 중 하나가 될 것입니다."
 KHM_les: "임업"
 KHM_les_desc: "수입을 늘리기 위해 임업을 확대하겠습니다."
 KHM_gazprom: "가스프롬과의 협력"
 KHM_gazprom_desc: "수입을 늘리기 위해 임업을 확대하겠습니다."
 KHM_rosneft: "로스네프트와의 협력"
 KHM_rosneft_desc: "이 러시아 기업과의 협력을 확대하겠습니다."
 KHM_tehnopark: "시리우스 B 테크노파크"
 KHM_tehnopark_desc: "투자자를 유치하기 위해 자체 테크노파크를 개설하겠습니다."
 KHM_edro: "통합 유그라"
 KHM_edro_desc: "통합 러시아의 영도 아래, 우리 공화국은 새천년을 맞이하고 있습니다."
 KHM_technokrats: "기술 관료 후원"
 KHM_technokrats_desc: "똑똑한 인재는 우리 공화국 번영의 열쇠입니다. 우리 공화국의 발전에 대해 기술 관료적 관점을 가진 사람들이 예산에서 자금을 지원받게 됩니다."
 KHM_regional: "중앙집권화"
 KHM_regional_desc: "1990년대의 여파를 완전히 뿌리 뽑아야 하며, 우리는 권력을 중앙집권화하겠습니다."
 KHM_health: "의료 투자"
 KHM_health_desc: "우리의 의료 분야가 최고가 되도록 노력하겠습니다."
 KHM_rid: "통제망 조이기"
 KHM_rid_desc: "우리는 극단적인 자유주의에 빠지지 않고 통제권을 우리 손에 쥐겠습니다."
 KHM_kamarova: "지역 수장 자리의 새 얼굴"
 KHM_kamarova_desc: "우리 공화국 지도부의 구성에 변화가 필요한 때가 왔습니다."
 KHM_euro: "러시아-EU 정상회담"
 KHM_euro_desc: "잠재적 파트너와 투자자를 찾을 수 있는 정상회담을 개최하겠습니다."
 KHM_yugra: "유그라 팀"
 KHM_yugra_desc: "우리 공화국의 참된 애국자들을 결집하여 함께 권력에 도전하겠습니다."
 KHM_filipenko: "변화는 필요 없다"
 KHM_filipenko_desc: "우리의 수장은 수년간 검증된 관리자인데 왜 교체해야 합니까?"
 KHM_corporations: "기업과의 협력"
 KHM_corporations_desc: "우리는 기업과 적극 협력할 것이며, 때로는 우리 지역에 손해가 되더라도 그렇게 할 것입니다."
 KHM_grip: "경찰 당근"
 KHM_grip_desc: "경찰과 기타 기관에 대한 자금을 늘릴 필요가 있으며, 자유주의는 이것으로 충분합니다."
 KHM_machine: "이상적인 정치 기계"
 KHM_machine_desc: "우리 공화국은 하나의 기계 장치처럼 작동하며, 그 정책이 엔진 오일 역할을 합니다."
 KHM_corrupt_battle: "부패와의 투쟁"
 KHM_corrupt_battle_desc: "모든 분야에서 부패와 싸우겠습니다."
 KHM_best_medicine: "최고의 의료"
 KHM_best_medicine_desc: "우리 지역은 최고의 의료 분야를 갖추게 될 것입니다."
 KHM_best_education: "수많은 신규 교육 기관"
 KHM_best_education_desc: "우리는 글을 아는 시민보다 더 교양 있는 시민이 필요하므로 수많은 신규 교육 기관을 건설하겠습니다."
 KHM_ldprs: "지리놉스키 추종자들"
 KHM_ldprs_desc: "블라디미르 볼포비치가 낳은 자식(LDPR)이 이제 우리 공화국을 이끌 것입니다."
 KHM_zir_ideas: "지리놉스키의 사상"
 KHM_zir_ideas_desc: "우리는 지리놉스키의 정치 강령을 따를 것이며, 우리 공화국은 그의 비전에 부합하게 될 것입니다."
 KHM_ordinary: "뛰어난 인재에 투자"
 KHM_ordinary_desc: "우리 공화국의 가장 뛰어난 인재들을 재정적으로 장려하겠습니다."
 KHM_gripers: "엄격한 통제"
 KHM_gripers_desc: "자유민주당이라는 이름만 남게 될 것입니다!"
 KHM_work_with: "타 정당과의 협력"
 KHM_work_with_desc: "우리는 권위주의에 빠지지 않고 다른 정당들과 적극 협력하겠습니다."
 KHM_work_with_business: "기업인과의 협력"
 KHM_work_with_business_desc: "우리는 지역 기업과 적극 협력하고 이들을 육성하고 발전시키겠습니다."
 KHM_loyal: "충성스러운 올리가르히"
 KHM_loyal_desc: "올리가르히가 당신에게 복종하면 공화국의 정세를 통제하기가 더 쉬워집니다."
 KHM_enforce: "소수 민족의 권리 확대"
 KHM_enforce_desc: "우리 공화국에 거주하는 소수 민족의 권리를 적극 확대하겠습니다."
 KHM_promote: "러시아의 유산"
 KHM_promote_desc: "우리가 위대한 나라의 후계자인 러시아인임을 적극 상기시키고 알리겠습니다."
 KHM_united: "통합 자유민주당"
 KHM_united_desc: "우리가 위대한 나라의 후계자인 러시아인임을 적극 상기시키고 알리겠습니다."
 KHM_destroy: "야당 파괴"
 KHM_destroy_desc: "야당이 있어서는 안 됩니다!"
 KHM_immigrants: "반이민 정책"
 KHM_immigrants_desc: "이주민을 감시하고 우리 공화국에 들이지 않겠습니다."
 KHM_no_minorities: "소수 집단과 소수 민족 불허"
 KHM_no_minorities_desc: "유그라는 러시아의 땅이 될 것입니다."
 KHM_utopia: "자유민주주의 이상향"
 KHM_utopia_desc: "지리놉스키의 비전에 따라 모든 정치적, 경제적 목표가 달성되었으며, 아마도 우리는 이상향에 도달했을 것입니다."
 KHM_liberals_desc: "자유주의의 시대가 마침내 우리 공화국에 도래할 것입니다."
 KHM_coalition: "연립"
 KHM_coalition_desc: "모든 자유주의 정당을 우리 주위로 결집시키겠습니다."
 KHM_liberalistion: "경제 자유화"
 KHM_liberalistion_desc: "우리는 전면적인 경제 변혁을 시작하겠습니다. 자유화 개혁은 우리 경제가 정체에서 성장으로 나아가도록 도울 것입니다."
 KHM_nemtsov: "넴초프의 경험"
 KHM_nemtsov_desc: "우리는 보리스 넴초프가 러시아의 한 지역에서 관리자로 일했을 때의 경험을 활용합니다."
 KHM_welfare: "보건 중점"
 KHM_welfare_desc: "건강한 시민은 좋은 납세자입니다."
 KHM_social: "사회 투자"
 KHM_social_desc: "우리 시민은 최고의 사회적 보장을 누리게 될 것입니다."
 KHM_media: "자유 언론"
 KHM_media_desc: "우리 언론에 완전한 자유를 부여하겠습니다."
 KHM_rights: "권리와 자유"
 KHM_rights_desc: "우리 시민은 구소련권에서 자유로운 인간의 본보기입니다."
 KHM_corruption: "부패와의 투쟁"
 KHM_corruption_desc: "부패라는 악랄한 현상과 맞서 싸우겠습니다."
 KHM_legi: "민주적 입법"
 KHM_legi_desc: "우리의 법은 우리 정책의 반영이어야 합니다. 우리는 최고의 민주주의 국가들을 본보기로 삼겠습니다."
 KHM_monorities: "소수자 권리 확대"
 KHM_monorities_desc: "우리 영토 내의 모든 소수 집단은 최대한의 자치를 누리게 될 것입니다."
 KHM_spend_police: "경찰 예산 삭감"
 KHM_spend_police_desc: "경찰에 그렇게 막대한 자금이 필요하지 않습니다."
 KHM_federation: "연방 속의 연방"
 KHM_federation_desc: "연방이 진정 어떤 모습이어야 하는지 보여 드리겠습니다."
 KHM_commi: "붉은 유그라"
 KHM_commi_desc: "공산주의 이상이 우리 지역에 돌아왔습니다."
 KHM_unions: "노조와의 협력"
 KHM_unions_desc: "우리 시민과 그의 노동권이 보호되어야 합니다."
 KHM_propaganda: "선전"
 KHM_propaganda_desc: "과거 소비에트의 선전 방식이 부활해야 합니다."
 KHM_salary: "북방 수당"
 KHM_salary_desc: "사람들이 일하고 우리에게 오도록 장려하겠습니다."
 KHM_housing: "주택 프로그램"
 KHM_housing_desc: "신규 주택 건설에 적극 투자하겠습니다."
 KHM_oligarch: "올리가르히와의 투쟁"
 KHM_oligarch_desc: "올리가르히는 우리의 사회주의 체제에 설 자리가 없습니다."
 KHM_multi: "다당제"
 KHM_multi_desc: "우리는 독재를 꾸미지 않고 다른 정당들과 상호 협력하겠습니다."
 KHM_one_party: "단일 정당"
 KHM_one_party_desc: "우리는 누구와도 권력을 나누지 않을 것입니다."
 KHM_policies: "당 정책"
 KHM_policies_desc: "당의 강령은 새로운 미래를 향한 노선입니다."
 KHM_z_battalion: "유그라 대대"
 KHM_z_battalion_desc: "우리는 전쟁에 지원병을 보낼 준비가 되었습니다."
 KHM_voenka: "군수 산업"
 KHM_voenka_desc: "소련 붕괴 이후 폐쇄된 군수 공장을 되살리는 데 투자하겠습니다."
 KHM_drones: "드론 제조"
 KHM_drones_desc: "우리 기업에서 드론 생산을 시작하겠습니다."
 KHM_ratnik: "전투원에게 \\"라트니크\\" 장비 지급"
 KHM_ratnik_desc: ""
 KHM_unified_russia: "러시아의 부활"
 KHM_unified_russia_desc: "한때 위대했던 러시아의 후계자인 우리는 조국을 부활시키기 위해 노력할 것이며, 그것도 이미 우리의 지도 아래에서 이룰 것입니다."
 KHM_stabilize: "안정의 보루"
 KHM_stabilize_desc: "사람들이 우리에게 손을 내밀게 하려면, 우리가 안정과 질서의 보루임을 보여 주어야 합니다."
 KHM_united_rus: "러시아 땅의 후계자"
 KHM_united_rus_desc: "우리는 모든 러시아 땅의 후계자임을 정당하게 선언합니다."
 KHM_insurgency: "모스크바 폭동"
 KHM_insurgency_desc: "수도의 통제권을 장악해야 하며, 이를 위해 봉기를 준비하겠습니다."
 KHM_patriots: "애국자들에 대한 호소"
 KHM_patriots_desc: "우려하는 모든 러시아 주민이 애국심으로 우리 군에 입대할 것을 공표하겠습니다."
 KHM_industry_military: "전시 경제"
 KHM_industry_military_desc: "이제 경제를 전시 체제로 전환해야 합니다. 조국의 땅을 되찾기까지 갈 길이 멀기 때문입니다."
 KHM_people_militia: "인민 민병대"
 KHM_people_militia_desc: "우리는 대규모 군대에 의존할 것입니다."
 KHM_former_officers: "예비역 장교 초빙"
 KHM_former_officers_desc: "수적 규모를 희생하더라도 전문 군대를 창설하겠습니다."
 KHM_motherland_calls: "조국이 부른다!"
 KHM_motherland_calls_desc: "러시아에 영광을!"
 KHM_army: "새로운 러시아군"
 KHM_army_desc: "우리는 과거 러시아군을 부활시키기 위해 가용한 모든 자원을 활용하고 있습니다."
 KHM_wagner: "민간 군사 기업 바그너 수용"
 KHM_wagner_desc: "우리를 도울 준비가 된 바그너 민간 군사 기업 출신 전직 군인이 많이 있습니다."
 KHM_annex_subjects: "종속국 통합"
 KHM_annex_subjects_desc: "이제 러시아의 옛 공화국들을 우리 체제로 통합할 때입니다."
