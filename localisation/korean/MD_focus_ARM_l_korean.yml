 arm_levon.8.t: "임무 실패"
 arm_levon.8.d: "유감스럽게도 [FROM.GetNameWithFlag](이)가 우리의 중립 지위 인정을 거부했습니다."
 arm_levon.8.a: "별로군."
 arm_levon.9.t: "아르메니아의 협력 제안"
 arm_levon.9.d: "아르메니아는 자국과 협력하는 편이 아제르바이잔과 협력하는 것보다 더 유리할 것이라고 주장합니다."
 arm_levon.9.a: "아르메니아식 케밥을 늘 먹어 보고 싶었다."
 arm_levon.9.b: "아니."
 arm_levon.10.t: "이스라엘, 캅카스 전략 변경"
 arm_levon.10.d: "우리는 이스라엘이 우리와 협력을 시작하도록 설득하는 데 성공했습니다."
 arm_levon.10.a: "좋다!"
 arm_levon.11.t: "이스라엘, 우리의 제안을 무시"
 arm_levon.11.d: "안타깝게도 바쿠의 석유 냄새가 아르메니아 피타 빵보다 더 향기롭다는 것입니다."
 arm_levon.11.a: "별로군."
 arm_levon.12.t: "[FROM.GetNameWithFlag], 관계의 평화적 해결을 제안"
 arm_levon.12.d: "[FROM.GetNameWithFlag](이)가 향후 분쟁을 방지하기 위해 양국 간 통합 안보 네트워크를 구축할 것을 제안합니다."
 arm_levon.12.a: "동의한다."
 arm_levon.12.b: "아니."
 arm_levon.13.t: "협상 성공"
 arm_levon.13.d: "최근 회담에서 공동의 결정을 도출하는 데 성공했으며, 이에 따라 새로운 안보 벨트가 구축될 것입니다."
 arm_levon.13.a: "좋다!"
 arm_levon.14.t: "협상 성공"
 arm_levon.14.d: "최근 회담에서 공동의 결정을 도출하는 데 성공했으며, 이에 따라 새로운 안보 벨트가 구축될 것입니다."
 arm_levon.14.a: "좋다!"
 arm_levon.15.t: "협상 성공"
 arm_levon.15.d: "최근 회담에서 공동의 결정을 도출하는 데 성공했으며, 이에 따라 새로운 안보 벨트가 구축될 것입니다."
 arm_levon.15.a: "좋다!"
 arm_levon.16.t: "협상 실패"
 arm_levon.16.d: "유감스럽게도 이스라엘과 시리아가 공동 안보 네트워크를 구축하도록 설득하지 못했으므로, 양국 간의 다음 전쟁이 너무 빨리 오지 않기를 바랄 수밖에 없습니다."
 arm_levon.16.a: "나쁘군!"
