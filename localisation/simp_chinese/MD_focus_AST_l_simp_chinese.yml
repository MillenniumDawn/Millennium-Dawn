 auslink_in_nt: "北领地澳联"
 auslink_in_nt_desc: "澳联框架过去曾帮助我们快速维修和升级区域道路。我们可以沿用该系统，迅速改善北部社区的物流线路，建设桥梁、重型货运路线和农业基础设施。"
 national_partnership_agreement_ast: "国家伙伴关系协议"
 national_partnership_agreement_ast_desc: "通过与北领地和西澳大利亚的原住民社区紧密合作，我们可以建造数百套新房来安置当地居民，从而解决严重的住房拥挤问题。这些合同还将为我们赢得住房利益集团的支持，并为当地承包商提供工作机会。"
 foundation_for_regional_renewal_ast: "乡村振兴补助金"
 foundation_for_regional_renewal_ast_desc: "我们可以在联邦政府和悉尼迈尔基金之间建立联合伙伴关系，为当地农业融资创造一个工具。赠款将直接提供给小镇企业和议会，为社区礼堂、农村供水系统和农业项目提供资金。"
 grain_line_upgrades_ast: "谷物生产线升级"
 grain_line_upgrades_ast_desc: "新南威尔士州和维多利亚州政府已向我们提供了该地区粮食运输线路重大结构升级改造的蓝图。几乎所有当地农民都依赖这些线路将收成运往港口，线路升级改造有望大幅提高他们的产量，并降低对公路运输的依赖，从而减少道路的损耗。"
 grain_lines_upgraded_ast: "区域粮食运输线升级"
 mining_indutrialists_opinion_tt: "§Y化石燃料行业§!关系值降低§R-20§!"
 peter_costello_desc: "在澳大利亚政治史上，或许很少有人像彼得·科斯特洛那样精通经济管理。在加入自由党之前，科斯特洛曾辗转于律师和法律顾问的工作，他主张对经济进行彻底的重组。最终，他加入了自由党的经济改革派，并在那里结识了前反对党领袖约翰·霍华德。\n\n1996年大选后，科斯特洛作为霍华德政府的副领导人和财政部长，主导了政府的快速改革。结果，十多年来首次实现了预算盈余，他们共同成功通过了此前被认为“不可能”的税收制度改革。\n\n即便两人关系日渐恶化，科斯特洛也从未远离权力中心。如今，他掌控着国家最重要的权力，他梦寐以求的经济霸主地位距离现实仅一步之遥。"
