 alg_deep_state.202.d: "군의 권력 장악에 저항하려던 시도가 실패했습니다. 무장한 충성 세력과 군 부대가 거리에서 충돌하고 있습니다. 국가는 전면적인 내전의 벼랑 끝에서 흔들리고 있습니다. 지금 내리는 결정이 알제리가 통일 국가로 존속할지를 좌우할 것입니다."
