l_english:
 STALKER.130.t: "Catastrophic Emission"
 STALKER.130.d: "An emission has torn through the weakened perimeter of [STALKER_zone_name]. Satellite images show burned-out checkpoints and a glowing sky, and neighbouring governments are asking whether their borders are next."
 STALKER.130.a: "The Zone will not stay contained forever."
 STALKER.131.t: "They Kept Our Artifacts"
 STALKER.131.d: "[From.GetName] has refused to hand back artifacts smuggled out of our Zone and seized by its customs officers. Its laboratories are already studying them."
 STALKER.131.a: "Demand their return."
 STALKER.131.b: "Not worth a dispute."
 STALKER.132.t: "NATO Discusses the Zone"
 STALKER.132.d: "Allied defence ministers have spent a closed session on the anomalous Zone in [?global.STALKER_zone_host_target.GetName]. Containment there is failing, and several members want the alliance to pay for a stronger perimeter."
 STALKER.132.a: "Fund the containment effort."
 STALKER.132.a_tt: "The Chornobyl Zone gains §G10§! §Ycontainment§!."
 STALKER.132.b: "It is not an alliance matter."
 STALKER.133.t: "Moscow Offers Specialists"
 STALKER.133.d: "Our emergency ministry has experience with contaminated land, and the Zone in [?global.STALKER_zone_host_target.GetName] is slipping out of control. Offering our specialists would buy influence where it matters."
 STALKER.133.a: "Send the specialists."
 STALKER.133.a_tt: "The Chornobyl Zone gains §G5§! §Ycontainment§!."
 STALKER.133.b: "Let them manage their own disaster."
 STALKER.134.t: "Our Expedition Lost in the Zone"
 STALKER.134.d: "A research team we sent into the Zone under an access agreement has not come back. Its last transmission described an anomaly that was not on any map."
 STALKER.134.a: "The host government failed to protect them."
 STALKER.134.b: "They knew the risks."
 STALKER.135.t: "Foreign Scientists Killed in the Zone"
 STALKER.135.d: "Researchers from [?global.STALKER_casualty_country.GetName] have died inside an anomalous Zone. The deaths have reopened the argument over whether foreign teams should be allowed in at all."
 STALKER.135.a: "The Zone takes whoever enters it."
 STALKER.136.t: "A Zone on Our Soil"
 STALKER.136.d_usa: "An anomalous Zone has opened inside the United States. Congress wants hearings, the Pentagon wants the perimeter, and universities want samples. The administration has to choose who gets the Zone first."
 STALKER.136.d_sov: "A Zone has opened on Russian soil. The security services want it sealed and classified, while the Academy of Sciences argues that Russia cannot afford to fall behind in anomalous research."
 STALKER.136.d_chi: "A Zone has opened inside China. The Party leadership has ordered it secured, but the question is whether it becomes a closed military area or a national research priority."
 STALKER.136.d: "An anomalous Zone has opened on our territory. As a great power, the world is watching how we handle it."
 STALKER.136.a: "Put the military in charge."
 STALKER.136.a_tt: "Costs §R50§! political power. The new Zone gains §G15§! §Ycontainment§!."
 STALKER.136.b: "Make it a national research priority."
 STALKER.136.b_tt: "The new Zone gains §G10§! §Yexploitation§!, raising our research from it."
 STALKER_kept_seized_artifacts: "Kept our seized artifacts"
 STALKER_blamed_for_casualties: "Blamed for expedition deaths"
 STALKER.137.t: "The Council Takes Up the Zones"
 STALKER.137.d: "The permanent members are meeting on the new anomalous Zones. They can back containment, open research access for the governments that vote for it, or adjourn. A tie adjourns the session."
 STALKER.137.a: "Vote for containment."
 STALKER.137.a_tt: "Our ballot counts for containment."
 STALKER.137.b: "Vote for research access."
 STALKER.137.b_tt: "Our ballot counts for access. If access wins, every government that voted for it receives Zone research access."
 STALKER.137.c: "Vote to adjourn."
 STALKER.137.c_tt: "Our ballot counts for adjournment. A tie also adjourns the session."
 STALKER.138.t: "The Council Session Closes"
 STALKER.138.d_containment: "The session closed in favor of containment. No new research access came out of the vote."
 STALKER.138.d_access: "The session closed in favor of research access. Governments that voted for access can study the Zones."
 STALKER.138.d_adjourn: "The session adjourned without a decision. Containment and access were left where they stood."
 STALKER.138.a: "The Council has spoken."

 # ---- MD_STALKER_international_l_english.yml (consolidated) ----
 STALKER_request_international_containment: "Request an International Perimeter Security Force"
 STALKER_request_international_containment_desc: "Ask the major powers to help garrison the Zone perimeter. An International Perimeter Security Force brings money, troops and scientists, and every contributor will expect access in return."
 STALKER_request_international_containment_tt: "Every Zone we control gains §G10§! §Ycontainment§! and loses up to §G10§! §YBandit§! influence. Every major power at peace with us is invited to contribute; each contributor adds another §G5§! §Ycontainment§!, cuts §YBandit§! influence by up to §G5§! and gains research access to the Zone."
 STALKER_transfer_artifacts: "Transfer Artifacts to [FROM.GetName]"
 STALKER_transfer_artifacts_desc: "Send a consignment of recovered artifacts to [FROM.GetName]'s laboratories as a gesture of goodwill.\n\nArtifact stockpile: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_transfer_artifacts_tt: "Spends §Y5§! artifacts from the national stockpile. [FROM.GetName] gains §G+3%§! research speed for §Y180 days§! and a better opinion of us."
 STALKER_foreign_zone_access: "Zone Research Access"
 STALKER_foreign_zone_access_desc: "Our scientists have access to the anomalous Zone under an international agreement."
 STALKER.20.t: "Anomalous Artifacts Seized"
 STALKER.20.d: "Customs officers at one of our ports have opened a shipment of machine parts and found a dozen objects that glow, hum or float. The paperwork traces them back through three shell companies to the Zone."
 STALKER.20.d_usa: "The FBI has broken up a smuggling ring selling Zone artifacts to private collectors in New York and Los Angeles. The seized objects glow, hum or float, and the agents who handled them without gloves are now in hospital."
 STALKER.20.a: "Send them to our laboratories."
 STALKER.20.a_tt: "Grants §G+3%§! research speed for §Y90 days§!. The Zone's controller may demand their return."
 STALKER.20.b: "Return them to [event_target:STALKER_zone_controller_target.GetName]."
 STALKER.21.t: "A Request for Zone Access"
 STALKER.21.d: "[event_target:STALKER_access_requester.GetName] has asked to send a scientific team into [STALKER_zone_name]. Their scientists would work alongside ours, and they are offering to share what they find."
 STALKER.21.a: "Grant them access."
 STALKER.21.a_tt: "[event_target:STALKER_access_requester.GetName] gains §G+1%§! research speed from Zone research access. Zone §Yexploitation§! rises by §G5§!."
 STALKER.21.b: "Refuse the request."
 STALKER.23.t: "The International Perimeter Security Force"
 STALKER.23.d: "[?global.STALKER_ipsf_host.GetName] has asked the major powers to help garrison the anomalous Zone on its territory. Contributors will share the cost of the perimeter and gain access for their scientists."
 STALKER.23.a: "Send a contingent."
 STALKER.23.a_tt: "Every Zone [?global.STALKER_ipsf_host.GetName] controls gains §G5§! §Ycontainment§! and loses up to §G5§! §YBandit§! influence. We gain §G+1%§! research speed from Zone research access."
 STALKER.23.b: "This is not our problem."
 STALKER.24.t: "An International Perimeter Security Force"
 STALKER.24.d: "[?global.STALKER_ipsf_host.GetName] has asked the world's major powers to help contain the anomalous Zone. Diplomats in several capitals say an International Perimeter Security Force could be in place within weeks."
 STALKER.24.a: "The Zone is everyone's problem now."
 STALKER_transfer_artifacts_available_tt: "Have at least §Y5§! artifacts in the national stockpile (currently §Y[?ROOT.STALKER_artifact_stockpile|1]§!)."
 STALKER_seize_perimeter_artifacts: "Seize Artifacts at the Chornobyl Perimeter"
 STALKER_seize_perimeter_artifacts_desc: "Inspect outbound routes from [FROM.GetName] and recover artifacts before smugglers carry them abroad."
 STALKER_seize_perimeter_artifacts_tt: "Moves §Y5§! artifacts from the smuggling pool to our stockpile, lowers local Bandit influence by §G10§!, and raises containment by §G5§!."
 STALKER_seize_perimeter_artifacts_available_tt: "Requires at least §Y5§! artifacts in the shared smuggling pool."
 STALKER_request_zone_research_access: "Request Research Access to [FROM.GetName]"
 STALKER_request_zone_research_access_desc: "Ask the country controlling [FROM.GetName] to admit our scientists to its Zone. Approval provides a continuing research benefit."
 STALKER_request_zone_research_access_tt: "The Zone's controller receives a research-access request. If it agrees, we gain §G+1%§! research speed and the Zone gains §Y5§! exploitation."
 STALKER_request_zone_research_access_cooldown_tt: "The Zone has no active §Y365-day§! research-access request cooldown."
 STALKER.27.t: "A Zone Faction Crisis"
 STALKER.27.d: "Bandit groups have taken control of routes into [STALKER_zone_name] while the perimeter weakens. Duty wants a coordinated sweep, while Freedom proposes protected corridors for independent stalkers. Smugglers are offering a share of their stock in exchange for being left alone."
 STALKER.27.a: "Back Duty's sweep."
 STALKER.27.a_tt: "Bandit influence falls by up to §G25§!, Duty rises by §G10§! in the original Zone only, containment rises by §G10§!, and the stalker population falls by up to §R10§!."
 STALKER.27.b: "Accept Freedom's corridor plan."
 STALKER.27.b_tt: "Bandit influence falls by up to §G15§!, Stalkers rise by §G10§!, Freedom rises by §G10§! in the original Zone only, exploitation rises by §G5§!, and containment falls by up to §R5§!."
 STALKER.27.c: "Take the smugglers' offer."
 STALKER.27.c_tt: "Moves §Y5§! smuggled artifacts into our stockpile, but Bandit influence rises by §R10§! and containment falls by up to §R10§!."
 STALKER.27.e: "Follow the X-16 shipment records."
 STALKER.27.e_tt: "Bandit influence falls by up to §G20§!, while containment and exploitation each rise by §G5§!. Requires the Project X discovery."

 # ---- MD_STALKER_intel_l_english.yml (consolidated) ----
 STALKER_expel_foreign_agents: "Expel Foreign Agents from [FROM.GetName]"
 STALKER_expel_foreign_agents_desc: "Foreign intelligence services have filled the Zone with contractors, researchers and liaison officers who report home.\n\nForeign intelligence presence: §Y[?FROM.STALKER_zone_foreign_intel|0]§!\nIt grows by §Y5§! for each country granted research access, plus §Y0.4§! for each point of §Yexploitation§!. Above §Y49§!, it feeds any MDST network inside our government."
 STALKER_expel_foreign_agents_tt: "[FROM.GetName] loses up to §G40§! foreign intelligence presence. Every country with Zone research access thinks less of us."
 STALKER.140.t: "Foreign Agents in the Zone"
 STALKER.140.d: "Our counterintelligence officers have mapped the foreign presence in [STALKER_zone_name]. Half the scientists, contractors and journalists there are reporting to someone else."
 STALKER.140.a: "Roll up the networks quietly."
 STALKER.140.a_tt: "Costs §R25§! political power. The Zone loses up to §G25§! foreign intelligence presence."
 STALKER.140.b: "Let them watch. We are watching them."
 STALKER.140.b_tt: "Foreign intelligence presence keeps feeding any MDST network inside our government."
 STALKER_expelled_our_agents: "Expelled our agents from a Zone"
 STALKER_hire_mercenaries: "Hire Mercenaries in [FROM.GetName]"
 STALKER_hire_mercenaries_desc: "Put the contractors who already work for foreign services on our payroll. They stay in the original Zone, and the services that hired them first do not leave."
 STALKER_hire_mercenaries_tt: "Mercenary influence rises by §Y10§! and foreign intelligence presence rises by §Y5§!."
 STALKER_expel_mercenaries: "Expel Mercenaries from [FROM.GetName]"
 STALKER_expel_mercenaries_desc: "Order the contractors out of the original Zone. Another client will offer them the same work if the foreign presence remains."
 STALKER_expel_mercenaries_tt: "Mercenary influence falls by up to §G25§!."
 STALKER.141.t: "Mercenaries in the Zone"
 STALKER.141.d: "Contractors working for foreign services are operating in the open around [STALKER_zone_name]. They will take our contract, or they will take someone else's."
 STALKER.141.a: "Hire them onto the cordon."
 STALKER.141.a_tt: "Costs §R25§! political power. Mercenary influence rises by §Y8§! and military influence falls by up to §R3§!."
 STALKER.141.b: "Order them out."
 STALKER.141.b_tt: "Mercenary influence falls by up to §G15§!."

 # ---- MD_STALKER_belarus_l_english.yml (consolidated) ----
 STALKER_belarus_border_seizure: "Intercept Zone Artifacts at the Belarusian Border"
 STALKER_belarus_border_seizure_desc: "Search shipments crossing our border for artifacts smuggled out of the Chornobyl Zone."
 STALKER_belarus_border_seizure_tt: "Moves §Y5§! artifacts from the smuggling pool to our stockpile."
 STALKER_reinforce_polesie_reserve: "Reinforce the Polesie Reserve"
 STALKER_reinforce_polesie_reserve_desc: "The Belarusian half of the exclusion zone runs through the Polesie State Radioecological Reserve. Its fences, patrols and checkpoints wear down unless we keep paying for them.\n\nPolesie security: §Y[?ROOT.STALKER_polesie_security|0]§!"
 STALKER_reinforce_polesie_reserve_tt: "Costs §Y0.2%§! of GDP. Polesie security rises by §G20§!. It falls by §Y1§! each month, and below §Y30§! stalkers and smugglers start crossing into Belarus."
 STALKER_kgb_smuggling_investigation: "Order a KGB Smuggling Investigation"
 STALKER_kgb_smuggling_investigation_desc: "Artifacts leaving the Zone pass through Gomel on their way west. Our state security committee can follow the money.\n\nPolesie security: §Y[?ROOT.STALKER_polesie_security|0]§!"
 STALKER_kgb_smuggling_investigation_available_tt: "At least §Y3§! smuggled artifacts are circulating (currently §Y[?global.STALKER_smuggled_artifacts|1]§!)."
 STALKER_kgb_smuggling_investigation_tt: "The investigation may break a smuggling ring, go cold, or expose officials on the smugglers' payroll. Higher Polesie security improves the odds of success."
 STALKER_propose_joint_zone_commission: "Propose a Joint Zone Commission"
 STALKER_propose_joint_zone_commission_desc: "The Zone does not stop at the border. Invite the government that holds the Chornobyl Zone to run the exclusion zone jointly with us."
 STALKER_propose_joint_zone_commission_tt: "The government that holds the Chornobyl Zone decides. If it accepts, the Chornobyl Zone gains §G10§! §Ycontainment§!, Polesie security rises by §G10§!, and our scientists gain Zone research access. If it refuses, we cannot ask again for §Y365 days§!."
 STALKER.60.t: "Stalkers Cross the Pripyat"
 STALKER.60.d: "Border guards in the Polesie reserve have found cut fences and fresh tracks leading north. A stalker crew, and the smugglers who buy from them, are now using Belarusian marsh trails to move artifacts out of the Zone."
 STALKER.60.a: "Tighten the Polesie cordon."
 STALKER.60.a_tt: "The crossings have already put §R3§! more artifacts on the black market and raised §YBandit§! influence in the Chornobyl Zone by §R5§!. Polesie security rises by §G10§!."
 STALKER.60.b: "The marshes cannot be sealed."
 STALKER.60.b_tt: "The crossings continue. §Y3§! more artifacts have already reached the black market, and §YBandit§! influence in the Chornobyl Zone has risen by §R5§!."
 STALKER.61.t: "Smuggling Ring Broken"
 STALKER.61.d: "KGB officers have arrested a network of couriers, customs officers and dealers moving artifacts from the Zone through Gomel. The seized goods are now in state laboratories."
 STALKER.61.a: "A lesson for anyone else who tries."
 STALKER.61.a_tt: "Up to §G10§! smuggled artifacts are removed from circulation. We gain §G5§! artifacts for our stockpile, and §YBandit§! influence in the Chornobyl Zone falls by up to §G10§!."
 STALKER.62.t: "Officials on the Smugglers' Payroll"
 STALKER.62.d: "The investigation has led back to our own side. Several border and reserve officials have been taking money to wave artifact shipments through."
 STALKER.62.a: "Purge them all."
 STALKER.62.a_tt: "Polesie security rises by §G15§!, and up to §G5§! smuggled artifacts are removed from circulation."
 STALKER.62.b: "Quietly take a share."
 STALKER.62.b_tt: "The treasury gains §G$0.5§! billion. Polesie security falls by §R10§!, and §R5§! more smuggled artifacts reach the black market."
 STALKER.63.t: "Minsk Proposes a Joint Zone Commission"
 STALKER.63.d: "[?global.STALKER_commission_proposer.GetName] proposes that we run the exclusion zone jointly, sharing patrols, data and the cost of the perimeter on both sides of the border."
 STALKER.63.a: "Accept the commission."
 STALKER.63.a_tt: "The Chornobyl Zone gains §G10§! §Ycontainment§! and loses up to §G5§! §YBandit§! influence. [?global.STALKER_commission_proposer.GetName] gains Zone research access and a better opinion of us."
 STALKER.63.b: "The Zone is ours to manage."
 STALKER.63.b_tt: "[?global.STALKER_commission_proposer.GetName] will think less of us and cannot ask again for §Y365 days§!."
 STALKER.64.t: "The Trail Goes Cold"
 STALKER.64.d: "The smugglers were warned before our officers moved in. The couriers are gone, and the artifacts with them."
 STALKER.64.a: "We will find them next time."
 STALKER.65.t: "Joint Zone Commission Agreed"
 STALKER.65.d: "The government holding the Chornobyl Zone has accepted our proposal. Its officers and ours will patrol the exclusion zone together, and our scientists have been granted access."
 STALKER.65.a: "Good neighbours share a fence."
 STALKER.66.t: "Commission Refused"
 STALKER.66.d: "Our proposal for a joint Zone commission has been turned down. The perimeter on our side remains our problem alone."
 STALKER.66.a: "Then we guard our own side."
 STALKER_reinforce_polesie_reserve_available_tt: "Polesie security is below §Y90§! (currently §Y[?ROOT.STALKER_polesie_security|0]§!)."
 STALKER_belarus_border_seizure_available_tt: "At least §Y5§! smuggled artifacts are circulating (currently §Y[?global.STALKER_smuggled_artifacts|1]§!)."

 # ---- MD_STALKER_footprint_l_english.yml (consolidated) ----
 STALKER.110.t: "The Zone Spreads"
 STALKER.110.d: "The anomalies around [STALKER_zone_name] have crossed into a neighbouring region. Wells have gone bad, compasses spin, and the first emission warnings are sounding in towns that never expected them."
 STALKER.110.t_drift: "The Zone Shifts"
 STALKER.110.d_drift: "The anomalies around [STALKER_zone_name] have moved. One neighbouring region is clearing, but they have crossed into another, where wells have gone bad and the first emission warnings are sounding."
 STALKER.110.a: "Evacuate the affected towns."
 STALKER.110.a_tt: "Costs §Y0.4%§! of GDP. The affected region is §YEvacuated§! for §Y180 days§!."
 STALKER.110.b: "People stay in their homes."
 STALKER.111.t: "The Zone Recedes"
 STALKER.111.d: "Containment work around [STALKER_zone_name] is paying off. Anomalous readings in the neighbouring region have fallen back to normal, and the exclusion line there has been lifted."
 STALKER.111.a: "One less region to guard."
 STALKER_zone_evacuated: "Zone Evacuation"
 STALKER_zone_evacuated_desc: "Residents have been moved out of towns the anomalous Zone has reached."

 # ---- MD_STALKER_regional_l_english.yml (consolidated) ----
 STALKER.41.t: "Lost in the Wilderness"
 STALKER.41.d: "A survey team has vanished inside the remote Zone at [STALKER_zone_name], and the nearest airstrip is hundreds of kilometres away. Their last radio call described a landscape that no longer matched their maps."
 STALKER.41.a: "Mount a rescue."
 STALKER.41.a_tt: "Costs §R25§! political power. Zone §Yexploitation§! rises by §G5§! as the rescuers chart new routes."
 STALKER.41.b: "Write them off."
 STALKER.41.b_tt: "The §Ystalker§! population falls by up to §Y5§!."
 STALKER.42.t: "Evacuation Crisis"
 STALKER.42.d: "Tens of thousands of people still live inside the new perimeter at [STALKER_zone_name], and many refuse to leave homes their families have held for generations. Local officials want to know whether the army will move them by force."
 STALKER.42.a: "Evacuate them by force."
 STALKER.42.a_tt: "Zone §Ycontainment§! rises by §G10§! and we lose §R2%§! stability."
 STALKER.42.b: "Let them stay."
 STALKER.42.b_tt: "The §Ystalker§! population rises by §Y10§! and §YBandit§! influence rises by §R5§!."
 STALKER.43.t: "The River Route"
 STALKER.43.d: "Smugglers are moving artifacts out of [STALKER_zone_name] by river at night, in canoes and barges our patrols cannot tell from ordinary traffic. The trade is making local gangs rich."
 STALKER.43.a: "Patrol the rivers."
 STALKER.43.a_tt: "Costs a small expenditure. Zone §YBandit§! influence falls by up to §G15§!."
 STALKER.43.b: "Tax the traffic quietly."
 STALKER.43.b_tt: "Adds §G3§! artifacts to the national stockpile. Zone §YBandit§! influence rises by §R5§!."
 STALKER.44.t: "The Laboratory Next Door"
 STALKER.44.d: "The Zone at [STALKER_zone_name] has swallowed ground right up to the fence of a sensitive state facility. Its scientists are asking for access to the anomalies; its security chiefs want the site sealed."
 STALKER.44.a: "Start a classified research programme."
 STALKER.44.a_tt: "Zone §Yexploitation§! rises by §G10§!, increasing our Zone research."
 STALKER.44.b: "Seal the facility off."
 STALKER.44.b_tt: "Zone §Ycontainment§! rises by §G10§!."
 STALKER.45.t: "Anomalous Pulse at the Coastal Complex"
 STALKER.45.d: "Severe gravitational and electromagnetic anomalies have manifested near the critical coastal reactors at [STALKER_zone_name]. Maritime traffic through nearby shipping lanes has been disrupted by compass failures, while technicians request specialized containment insulation."
 STALKER.45.a: "Establish naval exclusionary cordons and reinforce the grid."
 STALKER.45.a_tt: "Costs §R25§! political power and §R0.2%§! of GDP. Zone §Ycontainment§! rises by §G15§! and §Yactivity§! falls by §G5§!."
 STALKER.45.b: "Harness the anomalous radiation for atomic research."
 STALKER.45.b_tt: "Zone §Yexploitation§! rises by §G10§!, §Yactivity§! rises by §R5§!, and §Ycontainment§! falls by §R10§!. Adds §G1§! anomalous specimen to our national artifact stockpile."
 STALKER.46.t: "The Thawing Deep Zone"
 STALKER.46.d: "Deep underground anomalies have fractured the permafrost in [STALKER_zone_name]. Geothermal vents and crystalline artifact clusters are surfacing in remote tundra valleys, but winter supply routes are buckling under thermal shifts."
 STALKER.46.a: "Dispatch heavy icebreaker and engineering convoys."
 STALKER.46.a_tt: "Costs §R25§! political power and §R0.2%§! of GDP. Zone §Ycontainment§! rises by §G10§!, §YDuty§! influence rises by §G5§! in the original Zone only, and mutant populations fall by up to §G10§!."
 STALKER.46.b: "Subsidize independent prospector expeditions."
 STALKER.46.b_tt: "Costs §R15§! political power. The §Ystalker§! population rises by §Y10§!, Zone §Yexploitation§! rises by §G10§!, and §Ycontainment§! falls by §R5§!. Adds §G2§! anomalous specimens to our national artifact stockpile."
 STALKER.47.t: "Black Market Artifacts in the Suburbs"
 STALKER.47.d: "In the densely populated fringe around [STALKER_zone_name], anomalous artifacts are being traded openly in city flea markets. Wealthy collectors and university researchers are competing with local street gangs for uncatalogued anomalies."
 STALKER.47.a: "Launch militarized domestic police sweeps."
 STALKER.47.a_tt: "Costs §R30§! political power and §R1%§! stability. Zone §YBandit§! influence falls by up to §G15§!, §Ycontainment§! rises by §G10§!, and the §Ystalker§! population falls by up to §R5§!."
 STALKER.47.b: "Set up state-supervised appraisal offices."
 STALKER.47.b_tt: "Costs §R0.2%§! of GDP. Zone §Yexploitation§! rises by §G10§!, the §Ystalker§! population rises by §G5§!, and §YFreedom§! influence rises by §G5§! in the original Zone only. Adds §G2§! anomalous specimens to our national artifact stockpile."
 STALKER.48.t: "The Whispering Canopy"
 STALKER.48.d: "In the dense jungle terrain of [STALKER_zone_name], anomalous vegetation and fungal spores have overgrown frontier river checkpoints. Expedition scouts report anomalous bioluminescence and shifting paths through the canopy."
 STALKER.48.a: "Clear wide buffer firebreaks around the cordon."
 STALKER.48.a_tt: "Costs §R20§! political power and §R0.1%§! of GDP. Zone §Ycontainment§! rises by §G10§!, mutant populations fall by up to §G10§!, and §Yactivity§! falls by §G5§!."
 STALKER.48.b: "Harvest biological specimens from the growth."
 STALKER.48.b_tt: "Zone §Yexploitation§! rises by §G15§!, §Ycontainment§! falls by §R5§!, and mutant populations rise by up to §R5§!. Adds §G1§! anomalous specimen to our national artifact stockpile."
