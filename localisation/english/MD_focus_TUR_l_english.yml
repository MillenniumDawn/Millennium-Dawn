 TUR_develop_domestic_category: "Modernize Our Land Forces Vehicles"
 TUR_develop_domestic_category_desc: "\n\n\n\n\n\n£TUR_desctext_develop_domestic_main\n\n\n\n\n\n\n\n\n§WOur land forces still rely on an aging fleet of tanks, armored personnel carriers and self-propelled artillery. We can invest time and resources into modernizing these vehicles, whether by upgrading existing platforms or developing new ones of our own. Drawing upon §YTurkey's§! engineering expertise and industrial traditions, we can build vehicles tailored to the needs of our soldiers. A modern, domestically produced armored fleet will strengthen our army and reduce our reliance on foreign suppliers.§!"

  ####################################
 # M60 UPGRADE TENDER
 ####################################
 tur_m60t_upgrade_tender: "§WHold a tender for §YM60 Modernization§!"
 tur_m60t_upgrade_tender_desc: "\n\n\n\n\n\n£TUR_m60t_upgrade_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for the modernization of our existing §YM60 Patton§! tanks, which can no longer face modern threats as they are. Partners from £ISR §YIsrael§!, £USA §YUnited States§! and £UKR §YUkraine§! have offered upgrade packages.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTank 2000 Tender§! and §YAltay Development§!.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_m60t_upgrade_tender.1.name: "§WThe §YM60 Modernization§! Tender§!"
 tur_m60t_upgrade_tender.1.desc: "§WThe proposals for the §YM60 Modernization§! Tender have been reviewed. Our §YPatton§! fleet can no longer face modern threats as it is, and three partners have offered to bring it up to date.\n\n£ISR §YM60T§!: a modernization package from £ISR §LIsrael Military Industries§!, with a §Gnew 120-mm smoothbore gun§!, §Gexplosive reactive armor§! and a §Gmodernized fire control system§!. It is §Gproven§! and §Gaffordable§!, but the result remains a §Rmodernized M60 with an old hull§! and makes us §Rdependent on Israeli industry§!.\n\n£USA §YM60-2000§!: a far larger rebuild from £USA §LGeneral Dynamics§!, mating the §YM60§! hull with the §Gadvanced turret of the M1A1 Abrams§!. It offers §Gmuch greater combat value§!, but is §Rmuch more expensive§! and §Rslower§! to bring into service.\n\n£UKR §YM60-84§!: a hybrid from £UKR §LKMDB§!, combining the §YM60A3§! hull with a §YT-84 Oplot§! turret, a §GNATO-standard 120mm gun§! and an §Gautoloader§!. It comes at a §Gmoderate price§!, but it is an §Runtested hybrid§! and §Rtechnically risky§!.\n\nSpeed and cost, capability, or a bold hybrid. The choice is ours.§!"
 tur_m60t_upgrade_tender.1.a: "£ISR §YM60T§! §G(Fast and affordable)§! §R(Old hull)§!"
 tur_m60t_upgrade_tender.1.b: "£USA §YM60-2000§! §G(Capable, long-term)§! §R(Very expensive)§!"
 tur_m60t_upgrade_tender.1.c: "£UKR §YM60-84§! §G(Oplot turret)§! §R(Untested)§!"
 tur_m60t_upgrade_tender.10.name: "§W§YM60T Sabra§! Upgrades Complete§!"
 tur_m60t_upgrade_tender.10.desc: "§WThe first batches of our modernized §YM60T Sabra§! tanks have rolled out of the facilities. Upgraded by £ISR §LIsrael Military Industries§!, this modernization of our §YM60 Patton§! fleet features a §Gnew 120-mm smoothbore gun§! and §Gexplosive reactive armor§!, and other smaller modifications.\n\nThe old Patton hull now carries a modern gun and a modernized fire control system, which gives our armored brigades a real boost in firepower at a reasonable price.\n\n§GStrengths:§!§W Proven upgrade, quick to deliver and affordable.\n§RWeaknesses:§!§W The old hull limits further growth, and we depend on Israeli industry.\n\nThey are ready to be deployed to our armored brigades.§!"
 tur_m60t_upgrade_tender.10.a: "§WExcellent.§!"
 tur_m60t_upgrade_tender.11.name: "§W§YM60-2000§! Upgrades Complete§!"
 tur_m60t_upgrade_tender.11.desc: "§WThe §YM60-2000§! modernization program is complete. Carried out by £USA §LGeneral Dynamics§!, this modernization of our §YM60 Patton§! fleet features the §Gadvanced turret of the M1A1 Abrams§! and §Gmuch greater combat value§!, and other smaller modifications.\n\nBy successfully mating the reliable §YM60§! hull with the Abrams turret, we have acquired a highly capable hybrid main battle tank for a fraction of the cost of a brand new platform.\n\n§GStrengths:§!§W Abrams-level firepower and protection on a reliable hull.\n§RWeaknesses:§!§W The program was expensive and took a long time to complete.§!"
 tur_m60t_upgrade_tender.11.a: "§WImpressive engineering.§!"
 tur_m60t_upgrade_tender.12.name: "§W§YM60-84§! Upgrades Complete§!"
 tur_m60t_upgrade_tender.12.desc: "§WThe modernization of our §YM60 Patton§! fleet is finished. Carried out by £UKR §LKMDB§!, the §YM60-84§! program features a §GNATO-standard 120mm gun§! and an §Gautoloader§! on a §YT-84§! turret, and other smaller modifications.\n\nThe untested hybrid of an old §YM60A3§! hull and a Ukrainian turret has passed its acceptance trials, and the result is better than many had feared.\n\n§GStrengths:§!§W Strong firepower and modern protection at a moderate price.\n§RWeaknesses:§!§W A unique hybrid that may be harder to maintain and upgrade.\n\nThese cost-effective tanks will serve us well.§!"
 tur_m60t_upgrade_tender.12.a: "§WA unique and deadly combination.§!"

 ####################################
 # TANK 2000 TENDER
 ####################################
 tur_tank_2000_tender: "§WHold a tender for §YTank 2000§!"
 tur_tank_2000_tender_name: "§WThe §YTank 2000§! Tender§!"
 tur_tank_2000_tender_desc: "\n\n\n\n\n\n£TUR_desctext_tank_2000_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WThe £TUR §YTurkish Land Forces§! have initiated the '§YTank 2000§!' project to acquire a new, next-generation main battle tank. Manufacturers from £GER §YGermany§!, £FRA §YFrance§!, £USA §YUnited States§! and £UKR §YUkraine§! have been invited to demonstrate their vehicles in rigorous trials across §YAnatolia§!.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YAltay Development§!.\nIf you §Rskip§! it, it will §Rnot§! be available to you.§!"
 tur_tank_2000_tender.1.name: "§WThe §YTank 2000§! Tender§!"
 tur_tank_2000_tender.1.desc: "§W[GetDateText]: The £TUR §YTurkish Land Forces§! have concluded the trial phase for the '§YTank 2000§!' project. Four candidates have been put through rigorous trials across §YAnatolia§!, and we must now select a winning bid to form the backbone of our future armored divisions.\n\n£GER §YLeopard 2A6§!: a next-generation main battle tank from £GER §LKrauss-Maffei§!, with §Gstate-of-the-art composite armor§! and a §Ghighly accurate fire control system§!. It is a §Gtop-tier§! design, but §Rexport approval is politically uncertain§!.\n\n£FRA §YLeclerc§!: a next-generation main battle tank from £FRA §LGIAT Industries§!, with §Gadvanced hydropneumatic suspension§! and an §Gautomated loading system§!. It is §Gtechnologically advanced§!, but §Rvery expensive§!.\n\n£USA §YM1A2 Abrams§!: a next-generation main battle tank from £USA §LGeneral Dynamics§!, with §Gdepleted uranium armor§! and a §Gdevastating 120mm smoothbore gun§!. It offers §Gunmatched protection and firepower§!, but is §Rheavy and costly to operate§!.\n\n£UKR §YT-84 Yatagan§!: a next-generation main battle tank from £UKR §LKMDB§!, with §GNATO-standard compatibility§! and §Gsuperior mobility§!. It comes with §Gproduction licenses included§!, but is §Rless proven§!.\n\nWhich of these machines should form the backbone of our future armored divisions?§!"
 tur_tank_2000_tender.1.a: "§WRequest the §YLeopard 2A6§! from £GER §YGermany§!.§!"
 tur_tank_2000_tender.1.b: "§WPurchase the §YLeclerc§! from £FRA §YFrance§!.§!"
 tur_tank_2000_tender.1.c: "§WPurchase the §YM1A2 Abrams§! from the £USA §YUnited States§!.§!"
 tur_tank_2000_tender.1.d: "§WPurchase the §YT-84 Yatagan§! from £UKR §YUkraine§!.§!"
 tur_tank_2000_tender.1.e: "§WAccept the surplus §YLeopard 2A4s§! instead.§!"
 tur_tank_2000_tender.2.name: "§W£GER §YGermany§! Refuses §YLeopard 2A6§! Export§!"
 tur_tank_2000_tender.2.desc: "§RPolitical opposition§!§W within the £GER §YGerman§! government has blocked the export of the state-of-the-art §YLeopard 2A6§! to £TUR §YTurkey§!, citing political friction and human rights concerns.\n\nHowever, as a diplomatic compromise, §YBerlin§! is willing to offer us a massive batch of surplus §YLeopard 2A4s§! from the §LBundeswehr's§! own cold-war stockpiles at a §Gheavily discounted rate§!.§!"
 tur_tank_2000_tender.2.a: "§WA pragmatic compromise. Accept the §YLeopard 2A4s§!.§!"
 tur_tank_2000_tender.2.b: "§RUnacceptable.§!§W Let us review the other candidates.§!"
 tur_tank_2000_tender.10.name: "§W§YLeclerc§! Tanks Delivered§!"
 tur_tank_2000_tender.10.desc: "§WThe shipment of new §YLeclerc§! main battle tanks has finally arrived at our ports. Developed by £FRA §LGIAT Industries§!, this new equipment features §Gadvanced hydropneumatic suspension§! and an §Gautoloader module§!, and other smaller modifications.\n\nThey represent a §Gmassive leap§! in the combat capabilities of the £TUR §YTurkish Land Forces§!.\n\n§GStrengths:§!§W A smooth ride at speed, a reduced crew and a high rate of fire.\n§RWeaknesses:§!§W A very expensive and demanding machine to keep running.§!"
 tur_tank_2000_tender.10.a: "§WVive la coopération.§!"
 tur_tank_2000_tender.11.name: "§W§YM1A2 Abrams§! Delivered§!"
 tur_tank_2000_tender.11.desc: "§WThe American §YM1A2 Abrams§! tanks have been delivered and are ready for deployment. Developed by £USA §LGeneral Dynamics§!, this new equipment features §Gheavy composite armor modules§! and a §Gdevastating 120mm smoothbore gun§!, and other smaller modifications.\n\nThey will ensure £TUR §YTurkish§! armored supremacy in the region for decades to come.\n\n§GStrengths:§!§W Exceptional protection and firepower.\n§RWeaknesses:§!§W Heavy, and costly to fuel and maintain.§!"
 tur_tank_2000_tender.11.a: "§WA formidable addition to our arsenal.§!"
 tur_tank_2000_tender.12.name: "§W§YT-84 Yatagan§! Delivered§!"
 tur_tank_2000_tender.12.desc: "§WOur new §YT-84 Yatagan§! tanks have arrived from £UKR §YUkraine§!. Developed specifically for our requirements by £UKR §LKMDB§!, this new equipment features §GNATO-standard 120mm compatibility§! and an §Gadvanced autoloader module§!, and other smaller modifications.\n\nFurthermore, §LKMDB§! has provided us with the §Gproduction licenses§! and §Gtechnical documentation§!, allowing our domestic industry to manufacture and modify the tank ourselves.\n\n§GStrengths:§!§W NATO compatibility, good mobility and a path to domestic production.\n§RWeaknesses:§!§W Less combat-proven than its rivals.§!"
 tur_tank_2000_tender.12.a: "§WA highly fruitful partnership.§!"
 tur_tank_2000_tender.13.name: "§W§YLeopard 2A4s§! Delivered§!"
 tur_tank_2000_tender.13.desc: "§WThe surplus §YLeopard 2A4§! tanks procured from £GER §YGermany§! have arrived and are being rapidly integrated into our armored brigades. Originally developed by £GER §LKrauss-Maffei§!, this modernized equipment features §Greliable German engineering§! and a §Ghard-hitting 120mm gun module§!, and other smaller modifications.\n\nWhile not the newest variant on the market, they provide a §Gmassive step up§! from our aging §YPattons§! at an unbeatable price.\n\n§GStrengths:§!§W Reliable, cheap and available immediately.\n§RWeaknesses:§!§W An older variant with less advanced armor and fire control.§!"
 tur_tank_2000_tender.13.a: "§WThey will serve us well.§!"
 TUR_tank_2000_requires_m60t_tt: "§WComplete the §YM60 Modernization§! Tender§!"

 # ============================================================
 # EARLY ALTAY / YENI ALTAY
 # ============================================================
 tur_early_altay_development: "§WDevelop the §YAltay P1§!"
 tur_early_altay_development_desc: "\n\n\n\n\n\n£TUR_desctext_altay_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to design the first prototype of the §YAltay§! main battle tank, Türkiye's first domestically designed modern tank.\n--------------\n£TUR §LOtokar§!: §Gfaster§! (§Y240 days§!), but §Rmore expensive§!.\n£TUR §LBMC§!: §Gcheaper§!, but §Rslower§! (§Y300 days§!) and §Rrisks cost overruns§!.\n--------------\nThe program has §Y4 stages§!: the §Ymanufacturer§! is chosen immediately, the §Ygun§! after §Y60 days§!, the §Yarmor§! after §Y120 days§! and the §Yengine§! after §Y180 days§!.§!"
 tur_early_altay_requires_tank_2000_tt: "§WHas completed the §YTank 2000§! Tender§!"
 tur_early_altay_dev.1.name: "§WThe §YAltay§! Program§!"
 tur_early_altay_dev.1.desc: "§WThe time has come to turn Türkiye's long-held ambition of a domestic main battle tank into a real design. The §YAltay P1§! will be a new main battle tank with a §Gdomestic design§!, and its §Ygun§!, §Yarmor§! and §Yengine§! will be chosen in the later stages of the program. Two industrial teams are ready to lead the work.\n\n£TUR §LOtokar§!: an experienced armored vehicle builder that can deliver the design in §Y240 days§!, but at a cost of §R100 million§!.\n\n£TUR §LBMC§!: a cheaper offer of §G60 million§!, but the work will take §R300 days§! and the low budget may lead to problems later on.\n\nWhich manufacturer should lead the program?§!"
 tur_early_altay_dev.1.a: "£TUR §LOtokar§! §G(240 days)§! §R(40 million)§!"
 tur_early_altay_dev.1.b: "£TUR §LBMC§! §R(300 days)§! §G(20 million)§!"
 tur_early_altay_dev.2.name: "§W§YAltay§! Gun Selection§!"
 tur_early_altay_dev.2.desc: "§WThe engineers need to decide on the main gun for the §YAltay§!.\n\n§YL44§!: a §Gproven§!, §Gcheaper§! and §Glighter§! 120mm gun, but §Rless powerful§!.\n\n§YL55§!: a longer and §Gmore powerful§! gun with §Gbetter penetration§!, but §Rheavier§! and §Rmore demanding§! on the rest of the design.\n\nThe armor will be decided in §Y60 days§!.§!"
 tur_early_altay_dev.2.a: "§YL44 gun§! §G(Proven, lighter)§! §R(Less powerful)§!"
 tur_early_altay_dev.2.b: "§YL55 gun§! §G(More powerful)§! §R(Heavier)§!"
 tur_early_altay_dev.3.name: "§W§YAltay§! Armor Selection§!"
 tur_early_altay_dev.3.desc: "§WThe next decision is the protection of the §YAltay§!.\n\n§YHeavy armor§!: §Gnewer composite and spaced armor§! and a §Gbetter chance of surviving hits§!, but §Rheavier§! and §Rmore expensive§!.\n\n§YStandard armor§!: §Glighter§! and §Gcheaper§!, but §Rless protection§!.\n\nThe engine will be decided in §Y60 days§!.§!"
 tur_early_altay_dev.3.a: "§YHeavy armor§! §G(Better protection)§! §R(Heavier)§!"
 tur_early_altay_dev.3.b: "§YStandard armor§! §G(Lighter, cheaper)§! §R(Less protection)§!"
 tur_early_altay_dev.4.name: "§W§YAltay§! Engine Selection§!"
 tur_early_altay_dev.4.desc: "§WThe last major decision is the engine.\n\n§YGerman engine§!: a §Gproven§! and §Gmore powerful§! powerplant, but it makes us §Rdependent on German supply and export approval§!.\n\n§YDomestic engine§!: §Gno foreign dependence§! and a boost to our own industry, but §Rless powerful§! and §Rless proven§!.\n\nThe program will be finished in §Y60 days§! if led by £TUR §LOtokar§!, or §Y120 days§! if led by £TUR §LBMC§!.§!"
 tur_early_altay_dev.4.a: "§YGerman engine§! §G(Powerful, proven)§! §R(Foreign dependence)§!"
 tur_early_altay_dev.4.b: "§YDomestic engine§! §G(Independent)§! §R(Less powerful)§!"
 tur_early_altay_dev.5.name: "§WCost Overruns on the §YAltay§!§!"
 tur_early_altay_dev.5.desc: "§WThe low budget agreed with £TUR §LBMC§! is starting to show. Subcontractors are demanding more money, parts are arriving late and the program has been criticized in the press for its lack of planning.\n\n§RPenalty:§!§W Additional costs and a loss of public confidence.\n\nThe design is expected in §Y60 days§!.§!"
 tur_early_altay_dev.5.a: "§WWe should have budgeted more.§!"
 tur_early_altay_dev.10.name: "§WThe §YAltay P1§! is Ready§!"
 tur_early_altay_dev.10.desc_otokar: "§WAfter eight months of work, the first prototype of the §YAltay§! has been completed. Developed by £TUR §LOtokar§!, this new equipment features a §Gmature domestic design§! and the §Gmain gun, armor and engine of our choice§!, and other smaller modifications.\n\n§GStrengths:§!§W Delivered on time, with strong support from the manufacturer.\n§RWeaknesses:§!§W The high cost of the program.\n\nThe design is now available, and production will begin shortly.§!"
 tur_early_altay_dev.10.desc_bmc: "§WAfter ten months of work, the first prototype of the §YAltay§! has been completed. Developed by £TUR §LBMC§!, this new equipment features a §Gdomestic design§! and the §Gmain gun, armor and engine of our choice§!, and other smaller modifications.\n\n§GStrengths:§!§W A cheap program that kept the budget under control for most of its life.\n§RWeaknesses:§!§W A long development time and cost overruns along the way.\n\nThe design is now available, and production will begin shortly.§!"
 tur_early_altay_dev.10.a: "§WTürkiye's tank has arrived.§!"

 tur_yeni_altay_development: "§WDevelop the §YYeni Altay§!"
 tur_yeni_altay_development_desc: "\n\n\n\n\n\n£TUR_desctext_yeni_altay_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to design the §YYeni Altay§!, an improved version of Türkiye's domestic main battle tank, built on the lessons of the first §YAltay§!.\n--------------\n£TUR §YYeni Altay§!: new main battle tank developed by £TUR §LBMC§!, with a §Gmore powerful gun§! and a §Gstronger engine§!, and other smaller modifications.\n--------------\nThe design will take §Y180 days§! to complete, after which §Yproduction§! will begin.§!"
 tur_yeni_altay_requires_early_altay_tt: "§WHas completed the §YAltay P1§! development program§!"
 tur_yeni_altay_cost_20m: "§WTreasury: §Y20 million§!§!"
 tur_yeni_altay_dev.1.name: "§W§YYeni Altay§! Enters Serial Production§!"
 tur_yeni_altay_dev.1.desc: "§WThe development of the §YYeni Altay§! has been completed. After months of testing and refinement, Türkiye's improved main battle tank has passed its acceptance trials and has entered §Yserial production§!. Developed by £TUR §LBMC§!, this new equipment features a §Gmore powerful gun§! and a §Gstronger engine§!, and other smaller modifications.\n\nIt is the product of a domestic industry that can now design, test and build a modern tank on its own.\n\n§GStrengths:§!§W Improved firepower, protection and mobility, with a fully domestic design.\n§RWeaknesses:§!§W Expensive to build, and production will take time to ramp up.\n\nThe first tanks are expected to reach the armored brigades in the coming months.§!"
 tur_yeni_altay_dev.1.a: "§WA proud day for Turkish industry.§!"


 # ============================================================
 # TRANSPORT VEHICLES TENDER
 # ============================================================
 tur_light_transport_tender: "§WHold a tender for §YTransport Vehicles§!"
 tur_light_transport_tender_desc: "\n\n\n\n\n\n£TUR_desctext_light_transport_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WThe aging §YTuzla Jeep§! offers §Ralmost no protection§!, has a §Rmodest§! load capacity and is running short of spare parts. This program will replace it with new §Yutility and transport vehicles§! chosen through a tender among domestic and foreign manufacturers.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTactical Wheeled Armored Vehicles Tender Phase 1§! and the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 turkey_light_transport_tender.1.name: "§W§YTransport Vehicle§! Tender§!"
 turkey_light_transport_tender.1.desc: "§WThe §YTuzla Jeep§! has served our soldiers for decades, but it offers §Ralmost no protection§!, its load capacity is §Rmodest§! and spare parts are becoming §Rscarce§!. The General Staff wants it replaced, and the tender has produced several proposals.\n\n£TUR §YDefender MLR41§!: a light utility vehicle from £TUR §LOtokar§!, with §Gexcellent off-road performance§! and §Geasy maintenance§!. It can be bought as a batch right away, or built in series at a domestic plant if we §Rinvest in a longer program§!.\n\n£TUR §YNew Generation Hull§!: a modular platform from £TUR §LOtokar§!, with §Gmore protection§! and §Gflexibility§! that can become either a utility vehicle or an MRAP, but it will take §Rmore time and money§! to field.\n\n§YCheaper Options§!: the £TUR §LOtokar§! §YISV§!, an armored infantry support vehicle with §Gbetter crew protection§! and §Gweapon mounts§!, or the £GER §YUnimog U4000§!, a utility truck with a §Grugged chassis§! and §Geasy maintenance§!.\n\nThe decision we make now will shape our equipment for years to come.§!"
 turkey_light_transport_tender.1.a: "£TUR §LOtokar§! §YDefender MLR41§! large batch §G(Immediate delivery)§!"
 turkey_light_transport_tender.1.b: "Expand the £TUR §LOtokar Arifiye§! plant for the §YDefender MLR41§! §G(Series production)§! §R(240+ days)§!"
 turkey_light_transport_tender.1.c: "£TUR §LOtokar§! §YNew Generation Hull§! §G(Mine protection)§! §R(Takes longer)§!"
 turkey_light_transport_tender.1.d: "§YCheaper Options§! §G(Low cost)§!"
 turkey_light_transport_tender.2.name: "§WThe §YNew Generation Hull§! Configuration§!"
 turkey_light_transport_tender.2.desc: "§WThe £TUR §LOtokar§! §YNew Generation Hull§! is a modular platform that can become two distinct vehicles. Shared parts should make §Gproduction§! and §Gmaintenance§! simpler.\n\n£TUR §LOtokar§! §YKaya§!: utility and transport variant for §Gcargo§!, §Gsupply§! and §Gpersonnel§! duties, with §Goutstanding off-road mobility§!.\n\n£TUR §LOtokar§! §YCobra§!: §YMRAP§! variant that protects its crew from §Gmines§! and §Gambushes§!, but §Rcosts more§!.\n\nWhich configuration should we field?§!"
 turkey_light_transport_tender.2.a: "£TUR §LOtokar§! §YKaya§! transport §G(Cargo and troops)§!"
 turkey_light_transport_tender.2.b: "£TUR §LOtokar§! §YCobra§! MRAP §G(Mine protection)§! §R(Costs more)§!"
 turkey_light_transport_tender.3.name: "§W§YUnimog§! and §YISV§! Developments§!"
 turkey_light_transport_tender.3.desc: "§WTwo very different proposals are on the table, and only one can be selected.\n\n£TUR §LOtokar§! §YISV§!: a purpose-built armored infantry support vehicle with §Gbetter crew protection§! and §Gweapon mounts§!, but §Rcosts more§! to buy and operate.\n\n£GER §YUnimog U4000§!: a commercial-grade utility truck from £GER §LMercedes-Benz§! with a §Grugged chassis§! and §Geasy maintenance§!, but §Rlittle protection§!.\n\nThe choice is between §Ysurvivability§! and §Yaffordability§!.§!"
 turkey_light_transport_tender.3.a: "£TUR §LOtokar§! §YISV§! §G(Protection)§! §R(Costs more)§!"
 turkey_light_transport_tender.3.b: "£GER §YUnimog U4000§! §G(Cheap and rugged)§! §R(Little protection)§!"
 turkey_light_transport_tender.4.name: "§WThe £TUR §LOtokar Arifiye§! Plant Expansion Is Complete§!"
 turkey_light_transport_tender.4.desc: "§WThe new workshops of the £TUR §LOtokar Arifiye§! plant are ready. The plant can now build the §YDefender§!, §YAkrep§! and §YCobra§! vehicles in series for our Armed Forces.§!"
 turkey_light_transport_tender.4.a: "§GStart the production line§!"
 turkey_light_transport_tender.10.name: "§W§YDefender MLR41§! Enters Service§!"
 turkey_light_transport_tender.10.desc: "§WThe first §YDefender MLR41§! vehicles have rolled out of the workshops. Developed by £TUR §LOtokar§!, this new equipment features §Gexcellent off-road performance§! and §Geasy maintenance§!, and other smaller modifications.\n\nThe Defender is a rugged, no-nonsense workhorse with a simple engine that a conscript mechanic can repair with a basic toolkit.\n\n§GStrengths:§!§W Cheap to build and reliable in rough terrain.\n§RWeaknesses:§!§W Thin protection and a modest payload.\n\nA hundred vehicles are already headed to the depots, and the production lines are only just warming up.§!"
 turkey_light_transport_tender.10.a: "§WA solid start.§!"
 turkey_light_transport_tender.11.name: "§W§YKaya YTA§! Unveiled§!"
 turkey_light_transport_tender.11.desc: "§WThe §YKaya YTA§! has passed its trials, climbing slopes and crossing flooded ditches that stopped every older vehicle. Developed by £TUR §LOtokar§!, this new equipment features §Goutstanding off-road mobility§! and a §Greworked suspension and drivetrain§!, and other smaller modifications.\n\nThe Kaya was designed around one idea: getting troops and supplies to places where roads simply do not exist.\n\n§GStrengths:§!§W Quick to deploy and well suited to rough terrain.\n§RWeaknesses:§!§W Light armor, a small payload and a drivetrain that demands more maintenance.\n\nThe first units are being handed over, and §LOtokar's§! lines are being tooled for full production.§!"
 turkey_light_transport_tender.11.a: "§WMud is no longer an obstacle.§!"
 turkey_light_transport_tender.12.name: "§W§YCobra RCWS§! Enters Production§!"
 turkey_light_transport_tender.12.desc: "§WThe first §YCobra RCWS§! vehicles have rolled onto the parade ground. Developed by £TUR §LOtokar§!, this new equipment features §Greal armor protection§! and a §Gremote-controlled weapon station§!, and other smaller modifications.\n\nThe gunner no longer has to expose himself in an open hatch, which has changed how commanders think about patrols and convoy escorts.\n\n§GStrengths:§!§W Integrated firepower and a versatile platform that suits many roles.\n§RWeaknesses:§!§W Expensive, heavy and thirsty for fuel.\n\nIt is the most ambitious vehicle of the tender, and §LOtokar§! has already reserved factory space for it.§!"
 turkey_light_transport_tender.12.a: "§WWorth every lira.§!"
 turkey_light_transport_tender.13.name: "§W§YISV§! Infantry Support Vehicle Delivered§!"
 turkey_light_transport_tender.13.desc: "§WThe first §YISV§! infantry support vehicles have been delivered. Developed by £TUR §LOtokar§!, this new equipment features §Gheavy weapons support§! and a §Gpractical load-out§!, and other smaller modifications.\n\nThe ISV carries the heavy weapons, ammunition and a small crew right alongside the riflemen, so the platoon no longer has to choose between speed and firepower.\n\n§GStrengths:§!§W Good value for the firepower it brings.\n§RWeaknesses:§!§W Limited armor, middling mobility and exposed crews.\n\nThe first batch is already being distributed to the infantry divisions.§!"
 turkey_light_transport_tender.13.a: "§WFire support where it is needed.§!"
 turkey_light_transport_tender.14.name: "§W§YUnimog U4000§! Arrives§!"
 turkey_light_transport_tender.14.desc: "§WThe first §YUnimog U4000§! trucks have arrived. Built by £GER §LMercedes-Benz§!, this new equipment features §Glegendary off-road ability§! and §Geasy maintenance§!, and other smaller modifications.\n\nIts portal axles lift it high above obstacles, and it can wade through water that would drown most trucks.\n\n§GStrengths:§!§W Extremely versatile, reliable and cheap to keep running.\n§RWeaknesses:§!§W Slow on roads and unarmored.\n\nThe first trucks are heading to the depots, and the generals have stopped complaining about supply routes.§!"
 turkey_light_transport_tender.14.a: "§WOld reliable.§!"

# ============================================================
 # TACTICAL WHEELED ARMORED VEHICLES TENDER PHASE 1 (LIGHT TRANSPORT + MRAP)
 # ============================================================
 tur_mrap_tender: "§W§YTactical Wheeled Armored Vehicles§! Phase 1§!"
 tur_mrap_tender_desc: "\n\n\n\n\n\n£TUR_mrap_for_tooltip\n\n\n\n\n\n\n\n\n§WTender to replace our aging, unprotected vehicles with modern armored designs. The tender has two programs: a §YLight Transport§! program to carry troops and supplies, and an §YMRAP§! program to protect crews against mines and ambushes.\n--------------\n§GBoth programs can be decided§!, and a choice in §Rboth§! is needed to finish the tender.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTactical Wheeled Armored Vehicles Tender Phase 2§! and the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_mrap_requires_light_transport: "§WComplete the §YTransport Vehicles§! Tender§!"
 tur_mrap_tender.1.name: "§WThe §YTactical Wheeled Armored Vehicles§! Tender Phase 1§!"
 tur_mrap_tender.1.desc: "§WThe proposals for the §YTactical Wheeled Armored Vehicles§! Tender Phase 1 have been reviewed. Our troops still depend on aging, unprotected vehicles, and the threat of mines and ambushes grows on every front.\n\nTwo programs are on the table: a §YLight Transport§! program for a vehicle to carry troops and supplies, and an §YMRAP§! program for a vehicle that protects crews against mines and ambushes. §GBoth can be decided§!, one after the other.\n\nWhich program should we settle first?§!"
 tur_mrap_tender.1.a: "§W§YLight Transport§! program§!"
 tur_mrap_tender.1.b: "§W§YMRAP§! program§!"
 tur_mrap_tender.2.name: "§WThe §YLight Transport§! Tender§!"
 tur_mrap_tender.2.desc: "§WTwo domestic designs from £TUR §LBMC§! are competing for the §YLight Transport§! contract. Both are meant for the daily grind of army life: carrying troops, hauling supplies and keeping the rear areas moving.\n\n£TUR §YBMC 235§!: a light transport vehicle with §Gsimple controls§! and a §Gtough suspension§!. It is §Gcheap§! and §Gfast§!, but has §Rno weapon stations§!.\n\n£TUR §YBMC Efe§!: a light transport vehicle with §Gimproved mobility§! and a §Gmount for light weapons§!. It is §Gfast§! and has §Gweapon stations§!, but offers §Rweak squad support§! and is more complex to maintain.\n\nCost, or weapon stations?§!"
 tur_mrap_tender.2.a: "£TUR §LBMC§! §Y235§! §G(Cheap, fast)§! §R(No weapon stations)§!"
 tur_mrap_tender.2.b: "£TUR §LBMC§! §YEfe§! §G(Fast, weapon stations)§! §R(Weak squad support)§!"
 tur_mrap_tender.3.name: "§WThe §YMRAP§! Tender§!"
 tur_mrap_tender.3.desc: "§WThree domestic designs are competing for the §YMRAP§! contract. All three are meant to protect their crews against mines and roadside bombs.\n\n£TUR §YKirpi 4x4§!: a compact MRAP from £TUR §LBMC§! with a §GV-shaped hull§! that deflects blasts away from the crew. It is §Gfast§! and offers §Ggood squad support§!, but has §Rweak weapon stations§!.\n\n£TUR §YKirpi 6x6§!: a larger MRAP from £TUR §LBMC§! with a §Gbigger hull§! and a §Gheavier weapon fit§!. It offers §Gexcellent squad support§! and §Ggood weapon stations§!, but is §Rmore expensive§!.\n\n£TUR §YKaya 2§!: a heavily armored MRAP-class vehicle from £TUR §LOtokar§!, with §Gstrong weapons integration§! and §Gsolid protection§!. It offers §Ggood squad support§! and §Ggood weapon stations§!, but is §Rslow§!.\n\nSpeed, squad support or weapon stations?§!"
 tur_mrap_tender.3.a: "£TUR §LBMC§! §YKirpi 4x4§! §G(Fast, squad support)§! §R(Weak weapon stations)§!"
 tur_mrap_tender.3.b: "£TUR §LBMC§! §YKirpi 6x6§! §G(Squad support, weapon stations)§! §R(More expensive)§!"
 tur_mrap_tender.3.c: "£TUR §LOtokar§! §YKaya 2§! §G(Squad support, weapon stations)§! §R(Slow)§!"
 tur_mrap_tender.4.a: "§WContinue§!"
 tur_mrap_tender.10.name: "§W§YBMC 235§! Enters Service§!"
 tur_mrap_tender.10.desc: "§WThe first §YBMC 235§! vehicles have rolled out of the Ankara works, and the quartermasters are already drawing up lists of units waiting for them. Developed by £TUR §LBMC§!, this new equipment features §Ggood mobility for its class§! and §Geasy maintenance§!, and other smaller modifications.\n\nThe 235 is a practical light transport built for carrying troops and hauling supplies. It makes no pretense of being a combat vehicle, and its thin skin offers little against anything heavier than shrapnel.\n\n§GStrengths:§!§W Affordable, dependable and easy to maintain.\n§RWeaknesses:§!§W Light protection and limited firepower.\n\nProduction is starting up, and §LBMC§! promises a steady flow to the depots.§!"
 tur_mrap_tender.10.a: "§WA dependable workhorse.§!"
 tur_mrap_tender.11.name: "§W§YBMC Efe§! Enters Service§!"
 tur_mrap_tender.11.desc: "§WThe first §YBMC Efe§! vehicles have left the factory. Developed by £TUR §LBMC§!, this new equipment features §Gimproved mobility§! and a §Gmount for light weapons§!, and other smaller modifications.\n\nA patrol can now answer an ambush instead of just surviving it, and test drivers describe the Efe as sharper and more responsive on rough ground than anything else in its class. The price of that capability is cost and complexity, and mechanics have already complained about the extra systems that need attention.\n\n§GStrengths:§!§W Better mobility, better weapons integration and more flexible than the basic transport.\n§RWeaknesses:§!§W More expensive, more demanding to maintain and still lightly protected.\n\nThe first batch is being handed to the infantry, and the production line is under way.§!"
 tur_mrap_tender.11.a: "§WMore capability for the price.§!"
 tur_mrap_tender.12.name: "§W§YKirpi 4x4§! Enters Service§!"
 tur_mrap_tender.12.desc: "§WThe first §YKirpi 4x4§! vehicles have entered service. Developed by £TUR §LBMC§!, this new equipment features a §GV-shaped mine-resistant hull§! and a §YSARP§! §Gremote weapon station§!, and other smaller modifications.\n\nThe hull deflects the blast of a roadside bomb away from the crew, and several officers called it the vehicle that sends men home. The compact 4x4 version moves through narrow mountain roads and town streets that larger vehicles struggle with.\n\n§GStrengths:§!§W Excellent mine and blast protection, compact, maneuverable and a proven design.\n§RWeaknesses:§!§W Heavy for its size, high ground clearance affects stability and it is far costlier than a standard transport.\n\nThe lines at Ankara are being set up for steady production.§!"
 tur_mrap_tender.12.a: "§WProtection that saves lives.§!"
 tur_mrap_tender.13.name: "§W§YKirpi 6x6§! Enters Service§!"
 tur_mrap_tender.13.desc: "§WThe first §YKirpi 6x6§! vehicles have appeared on the parade ground. Developed by £TUR §LBMC§!, this new equipment features a §Glarger hull with more carrying capacity§! and a §Gheavier weapon fit§! with the §YSARP§! remote weapon station, and other smaller modifications.\n\nThe extra axle brings more space for troops and equipment, and the generals love it. The finance ministry does not: it is the most expensive vehicle of the tender, and its size makes it difficult to use on the narrowest roads.\n\n§GStrengths:§!§W Top-tier protection, more carrying capacity and heavier weapons.\n§RWeaknesses:§!§W Very expensive, large and heavy, and slower to produce.\n\nOnly a small number are expected from the first production run.§!"
 tur_mrap_tender.13.a: "§WThe heavy option arrives.§!"
 tur_mrap_tender.14.name: "§W§YKaya 2§! Enters Service§!"
 tur_mrap_tender.14.desc: "§WThe first §YKaya 2§! vehicles are being delivered. Developed by £TUR §LOtokar§!, this new equipment features §Gstrong weapons integration§! and §Gsolid protection§!, and other smaller modifications.\n\nThe Kaya 2 is intended to bridge the gap between a light transport and a full MRAP, with a cargo area adapted for infantry squads who need protection and firepower in one package. In trials it handled uneven ground well, though not as nimbly as the lighter §YKaya§!, and it is a somewhat cheaper alternative to the §YKirpi§! family.\n\n§GStrengths:§!§W Good firepower, solid protection and reasonable cost for an MRAP-class vehicle.\n§RWeaknesses:§!§W Less mobile than the lighter §YKaya§! and a less proven design than the §YKirpi§!.\n\n§LOtokar§! has reserved factory space for it.§!"
 tur_mrap_tender.14.a: "§WA capable middle path.§!"

 # ============================================================
 # TACTICAL WHEELED ARMORED VEHICLES TENDER PHASE 2 (MRAP + UTILITY)
 # ============================================================
 tur_mrap2_tender: "§W§YTactical Wheeled Armored Vehicles§! Phase 2§!"
 tur_mrap2_tender_desc: "\n\n\n\n\n\n£TUR_mrap2_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for the next generation of protected vehicles for our Armed Forces. The first phase gave our army a solid foundation, and this phase builds on it with two programs: an §YMRAP§! program for better protected combat vehicles, and a §YUtility§! program for transport and support duties.\n--------------\n§GBoth programs can be decided§!, and a choice in §Rboth§! is needed to finish the tender.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTactical Wheeled Armored Vehicles Tender Phase 3§! and the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_mrap2_requires_mrap: "§WComplete the §YTactical Wheeled Armored Vehicles§! Tender Phase 1§!"
 tur_mrap2_tender.1.name: "§WThe §YTactical Wheeled Armored Vehicles§! Tender Phase 2§!"
 tur_mrap2_tender.1.desc: "§WThe proposals for the §YTactical Wheeled Armored Vehicles§! Tender Phase 2 have been reviewed. The first phase gave our army a solid foundation, but the General Staff wants to build on it before the gap to modern armies widens again. Domestic industry has answered with a wider range of designs than ever before.\n\nTwo programs are on the table: an §YMRAP§! program for better protected combat vehicles, and a §YUtility§! program for transport and support duties. §GBoth can be decided§!, one after the other.\n\nWhich program should we settle first?§!"
 tur_mrap2_tender.1.a: "§W§YMRAP§! program§!"
 tur_mrap2_tender.1.b: "§W§YUtility§! program§!"
 tur_mrap2_tender.2: "§WThe §YMRAP§! Tender§!"
 tur_mrap2_tender.2.name: "§WThe §YMRAP§! Tender§!"
 tur_mrap2_tender.2.desc: "§WThe first new vehicles have proven themselves in service, but the battlefield keeps changing. Mines are getting stronger and ambushes more elaborate, and our crews need more than the last generation can offer. The General Staff has asked industry for the next step in MRAP design, and four domestic designs are now competing for the §YMRAP§! contract.\n\n£TUR §YKirpi 2§!: the successor to the §YKirpi§! from £TUR §LBMC§!, with a §Gbetter armored V-shaped hull§!, a §Gstronger drivetrain§! and a §Gmore capable weapon station§!. It offers §Gexcellent squad support§! and is §Gfast§!, but is §Rmore expensive§!.\n\n£TUR §YCobra II MRAP§!: a versatile armored platform from £TUR §LOtokar§! with a §Gblast-resistant hull§!. It is §Gbalanced§! and has §Ggood weapon stations§!, but is §Rmore expensive§!.\n\n£TUR §YEjder Yalcin§!: a tactical armored vehicle from £TUR §LNurol§! with a §Gstrongly protected cabin§! and a §Gcapable weapon mount§!. It is §Gbalanced§! and §Gfast§!, but is §Rmore expensive§!.\n\n£TUR §YPars 4x4§!: a lighter, more economical armored vehicle from £TUR §LFNSS§!. It is §Gvery fast§! and offers §Ggood squad support§!, but has §Rweak weapon stations§! and only moderate protection.\n\nSquad support, balance or speed?§!"
 tur_mrap2_tender.2.a: "£TUR §LBMC§! §YKirpi 2§! §G(Squad support, fast)§! §R(More expensive)§!"
 tur_mrap2_tender.2.b: "£TUR §LOtokar§! §YCobra II MRAP§! §G(Balanced, weapon stations)§! §R(More expensive)§!"
 tur_mrap2_tender.2.c: "£TUR §LNurol§! §YEjder Yalcin§! §G(Balanced, fast)§! §R(More expensive)§!"
 tur_mrap2_tender.2.d: "£TUR §LFNSS§! §YPars 4x4§! §G(Fast, squad support)§! §R(Weak weapon stations)§!"
 tur_mrap2_tender.3.name: "§WThe §YUtility§!/§YTransport Vehicle§! Tender§!"
 tur_mrap2_tender.3.desc: "§WThe new vehicles have eased the burden on our transport units, but the army's needs have already outgrown them. Commanders are asking for utility vehicles that can carry more, go where the roads end, and take a weapon mount when the mission demands it. Three domestic designs are now competing for the §YUtility§! vehicle contract.\n\n£TUR §YNMS-L§!: a compact utility vehicle from £TUR §LNurol§!, light and quick enough to ferry small teams, carry equipment or act as a light weapons platform. It is §Gfast§! and offers §Ggood squad support§!, but has §Rweak weapon stations§! and thin armor.\n\n£TUR §YCobra II Pickup§!: an armored utility vehicle from £TUR §LOtokar§! with a §Gproven armored chassis§! and an §Gopen cargo bed§!. It is §Gbalanced§! and offers §Ggood squad support§!, but brings §Rno standout upgrade§! and leaves its cargo exposed.\n\n£TUR §YUral§!: an all-terrain utility vehicle from £TUR §LOtokar§! with a §Grobust suspension and drivetrain§!. It is §Gcheap§! and §Gvery fast§!, but has §Rweak squad support§! and light protection.\n\nSpeed, balance or cost?§!"
 tur_mrap2_tender.3.a: "£TUR §LNurol§! §YNMS-L§! §G(Fast, squad support)§! §R(Weak weapon stations)§!"
 tur_mrap2_tender.3.b: "£TUR §LOtokar§! §YCobra II Pickup§! §G(Balanced, squad support)§! §R(No standout upgrade)§!"
 tur_mrap2_tender.3.c: "£TUR §LOtokar§! §YUral§! §G(Cheap, fast)§! §R(Weak squad support)§!"
 tur_mrap2_tender.4.a: "§WContinue§!"
 tur_mrap2_tender.10.name: "§W§YKirpi 2M§! Enters Service§!"
 tur_mrap2_tender.10.desc: "§WThe first §YKirpi 2M§! vehicles have entered service. Developed by £TUR §LBMC§!, this new equipment features §Gbetter armor§! and a §Gstronger drivetrain§!, and other smaller modifications.\n\nThe Kirpi 2M keeps the V-shaped hull that made its predecessor famous for shrugging off roadside bombs, and adds a more capable weapon station. Veterans who rode in the older model say the new one feels like a bunker on wheels.\n\n§GStrengths:§!§W Top-tier mine and blast protection, strong weapons integration and a well-tested design lineage.\n§RWeaknesses:§!§W High cost, considerable weight and demanding upkeep.\n\nThe first production vehicles are ready, and §LBMC§! has promised a steady stream.§!"
 tur_mrap2_tender.10.a: "§WThe new standard.§!"
 tur_mrap2_tender.11.name: "§W§YCobra II MRAP§! Enters Service§!"
 tur_mrap2_tender.11.desc: "§WThe first §YCobra II MRAP§! vehicles have been delivered. Developed by £TUR §LOtokar§!, this new equipment features a §Gblast-resistant hull§! and an §Gagile, versatile platform§!, and other smaller modifications.\n\nDrivers like its balance: it is protected enough to survive an ambush, yet light enough to keep up with fast-moving columns and navigate winding roads that heavier vehicles avoid. Staff officers note that it trades some armor for agility, which the army considers a fair bargain.\n\n§GStrengths:§!§W Versatile, agile, good protection and a strong export pedigree.\n§RWeaknesses:§!§W Not as heavily armored as the biggest MRAPs, and middling cargo space.\n\n§LOtokar's§! lines are already tooled for full production.§!"
 tur_mrap2_tender.11.a: "§WBalanced and capable.§!"
 tur_mrap2_tender.12.name: "§W§YEjder Yalcin§! Enters Service§!"
 tur_mrap2_tender.12.desc: "§WThe first §YEjder Yalcin§! vehicles have entered service. Developed by £TUR §LNurol§!, this new equipment features a §Gstrongly protected cabin§! and a §Gcapable weapon mount§!, and other smaller modifications.\n\nIt is a tactical armored vehicle designed to carry a squad safely into the thick of trouble, with a rugged build that handles rough country without fuss. It has already built a following abroad, and domestic units are glad to see it in their own colors.\n\n§GStrengths:§!§W Strong protection, good firepower, proven abroad and well suited to squad-level operations.\n§RWeaknesses:§!§W Expensive to buy and operate, and a lot of vehicle for a limited number of troops.\n\nProduction is beginning, though the finance ministry is watching closely.§!"
 tur_mrap2_tender.12.a: "§WA fine vehicle, a fine price.§!"
 tur_mrap2_tender.13.name: "§W§YPars 4x4§! Enters Service§!"
 tur_mrap2_tender.13.desc: "§WThe first §YPars 4x4§! vehicles have been delivered. Developed by £TUR §LFNSS§!, this new equipment features a §Glight and economical design§! and §Geasy crew training§!, and other smaller modifications.\n\nIt is a lighter, more economical option than the large MRAPs, intended for units that need protection without the expense and bulk of a heavyweight. It is simple enough for quick training and cheaper than the competing designs, though its critics say it offers only moderate protection.\n\n§GStrengths:§!§W Cost-effective, practical and easy to train crews for.\n§RWeaknesses:§!§W Moderate protection and limited weapon options.\n\nThe first vehicles are heading to the units that requested them.§!"
 tur_mrap2_tender.13.a: "§WGood value for money.§!"
 tur_mrap2_tender.14.name: "§W§YNMS-L§! Enters Service§!"
 tur_mrap2_tender.14.desc: "§WThe first §YNMS-L§! vehicles have entered service. Developed by £TUR §LNurol§!, this new equipment features a §Gcompact, light design§! and §Gflexible roles§!, and other smaller modifications.\n\nIt fills the many gaps between cargo trucks and armored carriers: it can ferry small teams, carry equipment or act as a platform for light weapons, depending on what the unit needs that day. Soldiers praise its handling, but commanders are advised to keep it away from direct fire.\n\n§GStrengths:§!§W Good mobility, flexible roles and reasonable cost.\n§RWeaknesses:§!§W Thin armor and a limited payload.\n\nProduction has started, and the first batch is on its way.§!"
 tur_mrap2_tender.14.a: "§WFlexible and quick.§!"
 tur_mrap2_tender.15.name: "§W§YCobra II Pickup§! Enters Service§!"
 tur_mrap2_tender.15.desc: "§WThe first §YCobra II Pickup§! vehicles have entered service. Developed by £TUR §LOtokar§!, this new equipment features an §Garmored chassis§! and an §Gopen cargo bed§!, and other smaller modifications.\n\nThe army now has an armored utility vehicle that carries ammunition, supplies or a weapon team with the toughness of a vehicle that began life as an armored carrier. It is more protected than a regular truck and cheaper than a full MRAP.\n\n§GStrengths:§!§W Sturdy, good mobility, flexible cargo space and a proven chassis.\n§RWeaknesses:§!§W Exposed rear area and moderate protection.\n\n§LOtokar's§! lines are producing the first units.§!"
 tur_mrap2_tender.15.a: "§WA useful hybrid.§!"
 tur_mrap2_tender.16.name: "§W§YUral§! Enters Service§!"
 tur_mrap2_tender.16.desc: "§WThe first §YUral§! vehicles have entered service. Developed by £TUR §LOtokar§!, this new equipment features §Gexceptional off-road mobility§! and a §Grobust suspension and drivetrain§!, and other smaller modifications.\n\nIn tests it crossed ground that stopped every other entry, and crews report that it handles like a vehicle half its size. It is cheap, tough and quick to produce, but it cannot withstand a serious attack, so it is best used behind the front line or as a scout.\n\n§GStrengths:§!§W Exceptional off-road mobility, low cost and quick to produce.\n§RWeaknesses:§!§W Light protection and limited firepower.\n\nProduction is moving fast, and the army is already asking for more.§!"
 tur_mrap2_tender.16.a: "§WGoes anywhere.§!"

 # ============================================================
 # TACTICAL WHEELED ARMORED VEHICLES TENDER PHASE 3 (MRAP + UTILITY/TRANSPORT)
 # ============================================================
 tur_mrap3_tender: "§W§YTactical Wheeled Armored Vehicles§! Phase 3§!"
 tur_mrap3_tender_desc: "\n\n\n\n\n\n£TUR_mrap3_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for wheeled armored vehicles to protect our troops and keep supply lines moving. The tender has two programs: an §YMRAP§! program to protect our troops against mines and ambushes, and a §YUtility§! program for tactical and support duties.\n--------------\n§GBoth programs can be decided§!, and a choice in §Rboth§! is needed to finish the tender.§!"
 tur_mrap3_requires_mrap: "§WComplete the §YTactical Wheeled Armored Vehicles§! Tender Phase 2§!"
 tur_mrap3_tender.1.name: "§WThe §YTactical Wheeled Armored Vehicles§! Tender Phase 3§!"
 tur_mrap3_tender.1.desc: "§WThe proposals for the §YTactical Wheeled Armored Vehicles§! Tender Phase 3 have been reviewed. Our forces need vehicles that can protect troops and keep supply lines moving, and domestic industry has answered with several designs.\n\nTwo programs are on the table: an §YMRAP§! program for a vehicle to protect our troops against mines and ambushes, and a §YUtility/Transport§! program for a vehicle for tactical and support duties. §GBoth can be decided§!, one after the other.\n\nWhich program should we settle first?§!"
 tur_mrap3_tender.1.a: "§W§YMRAP§! program§!"
 tur_mrap3_tender.1.b: "§W§YUtility/Transport§! program§!"
 tur_mrap3_tender.2: "§WThe §YMRAP§! Tender§!"
 tur_mrap3_tender.2.name: "§WThe §YMRAP§! Tender§!"
 tur_mrap3_tender.2.desc: "§WThe time has come to choose the next mine-resistant vehicle for our army. Convoys on the roads and patrols in the mountains keep facing mines and ambushes, and the General Staff wants a domestic answer instead of another foreign purchase. Our manufacturers have answered the call, and the field trials are complete. Four domestic designs are now competing for the §YMRAP§! contract.\n\n£TUR §YVuran§!: a heavyweight MRAP from £TUR §LBMC§! with a §Ghigh, protected hull§! and §Gstrong weapons integration§!. It is §Gbalanced§! and offers §Ggood squad support§!, but is §Rmore expensive§!.\n\n£TUR §YAmazon§!: a quick, nimble armored vehicle from £TUR §LBMC§! with a §Groomy crew compartment§!. It is §Gvery fast§! and offers §Ggood squad support§!, but has §Rweak weapon stations§! and lighter armor.\n\n£TUR §YHizir/Ates§!: a rugged armored vehicle from £TUR §LKatmerciler§! with a §Gtough hull§! and §Gflexible weapon mounts§!. It is §Gbalanced§! and §Gaffordable§!, but brings §Rno standout upgrade§! and has a limited track record.\n\n£TUR §YYörük§!: a tactical armored vehicle from £TUR §LNMS§! with a §Gprotected cabin§! and an §Gexcellent off-road drivetrain§!. It is §Gvery fast§! and has §Ggood weapon stations§!, but offers §Rweak squad support§!.\n\nBalance, speed or price?§!"
 tur_mrap3_tender.2.a: "£TUR §LBMC§! §YVuran§! §G(Balanced, squad support)§! §R(More expensive)§!"
 tur_mrap3_tender.2.b: "£TUR §LBMC§! §YAmazon§! §G(Fast, squad support)§! §R(Weak weapon stations)§!"
 tur_mrap3_tender.2.c: "£TUR §LKatmerciler§! §YHizir/Ates§! §G(Balanced, affordable)§! §R(No standout upgrade)§!"
 tur_mrap3_tender.2.d: "£TUR §LNMS§! §YYörük§! §G(Fast, weapon stations)§! §R(Weak squad support)§!"
 tur_mrap3_tender.3.name: "§WThe §YUtility§!/§YTransport Vehicle§! Tender§!"
 tur_mrap3_tender.3.desc: "§WOur quartermasters have been warning for years that the army's utility trucks and tactical vehicles are worn out. Spare parts are scarce, breakdowns are frequent, and units in the field wait too long for supplies. A new generation of domestic vehicles could finally change that, and four domestic designs are now competing for the §YUtility/Transport§! vehicle contract.\n\n£TUR §YAkrep 2§!: an improved light tactical vehicle from £TUR §LOtokar§! with §Gbetter armor§! and a §Gmore capable weapon mount§!. It is §Gbalanced§! and has §Ggood weapon stations§!, but brings §Rno standout upgrade§! and offers only light protection.\n\n£TUR §YTulga§!: a simple, tough utility vehicle from £TUR §LBMC§! that is §Gvery cheap§! and §Geasy to repair§!. It is §Gcheap§! and §Gvery fast§!, but has §Rweak weapon stations§! and modest protection.\n\n£TUR §YTuran§!: a fast, flexible utility vehicle from £TUR §LBMC§! with §Gflexible cargo space§! and §Geasy operation§!. It is §Gbalanced§! and §Gaffordable§!, but brings §Rno standout upgrade§! and has thin armor.\n\n£TUR §YYetisen§!: a tactical vehicle from £TUR §LNurol§! with a §Gprotected cabin§! and a §Gcapable weapon mount§!. It is §Gfast§! and has §Ggood weapon stations§!, but offers §Rweak squad support§! and limited cargo space.\n\nBalance, price or speed?§!"
 tur_mrap3_tender.3.a: "£TUR §LOtokar§! §YAkrep 2§! §G(Balanced, weapon stations)§! §R(No standout upgrade)§!"
 tur_mrap3_tender.3.b: "£TUR §LBMC§! §YTuran§! §G(Balanced, affordable)§! §R(No standout upgrade)§!"
 tur_mrap3_tender.3.c: "£TUR §LBMC§! §YTulga§! §G(Cheap, fast)§! §R(Weak weapon stations)§!"
 tur_mrap3_tender.3.d: "£TUR §LNurol§! §YYetisen§! §G(Fast, weapon stations)§! §R(Weak squad support)§!"
 tur_mrap3_requires_mrap2: "§WComplete the §YTactical Wheeled Armored Vehicles§! Tender Phase 2§!"
 tur_mrap3_tender.10.name: "§W§YVuran§! Enters Service§!"
 tur_mrap3_tender.10.desc: "§WThe first §YVuran§! vehicles have entered service. Developed by £TUR §LBMC§!, this new equipment features a §Ghigh, mine-resistant hull§! and §Gstrong weapons integration§!, and other smaller modifications.\n\nThe crew compartment is designed so that a soldier can step out of a wrecked vehicle and walk away, and drivers who tested it say it inspires confidence the moment the door closes.\n\n§GStrengths:§!§W Excellent mine and blast protection, strong weapons integration and a sturdy, modern design.\n§RWeaknesses:§!§W High cost, considerable weight and demanding upkeep.\n\n§LBMC's§! first vehicles are rolling off the line.§!"
 tur_mrap3_tender.10.a: "§WBuilt to survive.§!"
 tur_mrap3_tender.11.name: "§W§YAmazon§! Enters Service§!"
 tur_mrap3_tender.11.desc: "§WThe first §YAmazon§! vehicles have entered service. Developed by £TUR §LBMC§!, this new equipment features §Gvery good mobility§! and a §Groomy crew compartment§!, and other smaller modifications.\n\nIt is quick, nimble and comfortable to drive, with enough protection to survive an ambush and enough room to carry a squad and its equipment. Crews like it because it goes where larger vehicles cannot.\n\n§GStrengths:§!§W Very good mobility, balanced protection and roomy for its size.\n§RWeaknesses:§!§W Lighter armor than the largest MRAPs and limited weapon options.\n\n§LBMC§! reports that production is ramping up smoothly.§!"
 tur_mrap3_tender.11.a: "§WFast and well protected.§!"
 tur_mrap3_tender.12.name: "§W§YAtes§! Enters Service§!"
 tur_mrap3_tender.12.desc: "§WThe first §YAtes§! vehicles have entered service. Developed by £TUR §LKatmerciler§!, this new equipment features a §Gtough hull§! and §Gflexible weapon mounts§!, and other smaller modifications.\n\nIt is a rugged, practical armored vehicle for units that need protection without paying for a heavyweight. It is a young design from a company still proving itself on the big stage, and some officers worry that it has not yet been tested in a long campaign.\n\n§GStrengths:§!§W Good protection for the price, flexible weapon mounts and low cost.\n§RWeaknesses:§!§W Limited track record and modest payload.\n\nThe first units are being handed over to the army.§!"
 tur_mrap3_tender.12.a: "§WA promising newcomer.§!"
 tur_mrap3_tender.13.name: "§W§YYörük§! Enters Service§!"
 tur_mrap3_tender.13.desc: "§WThe first §YYörük§! vehicles have entered service. Developed by £TUR §LNMS§!, this new equipment features an §Gexcellent off-road drivetrain§! and a §Gprotected cabin§!, and other smaller modifications.\n\nIt is named for the nomads who crossed Anatolia with their herds, and its suspension lets it cross rough country at speeds that surprise even experienced drivers. It is a fine fit for fast-moving units that value speed over bulk.\n\n§GStrengths:§!§W Excellent off-road mobility, solid protection and good firepower options.\n§RWeaknesses:§!§W Small troop capacity and lighter armor than the heaviest designs.\n\n§LNMS§! has begun delivering the first vehicles.§!"
 tur_mrap3_tender.13.a: "§WBorn to move.§!"
 tur_mrap3_tender.14.name: "§W§YAkrep 2§! Enters Service§!"
 tur_mrap3_tender.14.desc: "§WThe first §YAkrep 2§! vehicles have entered service. Developed by £TUR §LOtokar§!, this new equipment features §Gbetter armor§! and a §Gstronger engine§!, and other smaller modifications.\n\nIt takes the original's best qualities and adds a more capable weapon mount. It can scout ahead of the column, carry a weapon team or serve as a command vehicle, but it is still a light vehicle, and commanders are advised to use its speed rather than rely on its armor.\n\n§GStrengths:§!§W Versatile, good firepower and well tested in the field.\n§RWeaknesses:§!§W Light protection and limited cargo space.\n\n§LOtokar's§! lines are already tooled for full production.§!"
 tur_mrap3_tender.14.a: "§WThe scorpion returns.§!"
 tur_mrap3_tender.15.name: "§W§YTuran§! Enters Service§!"
 tur_mrap3_tender.15.desc: "§WThe first §YTuran§! vehicles have entered service. Developed by £TUR §LBMC§!, this new equipment features §Ggreat mobility§! and §Gflexible cargo space§!, and other smaller modifications.\n\nIt is light enough to move quickly over poor roads, large enough to carry a squad or a stack of supplies and simple enough that a driver can learn it in a day. It was never meant to fight at the front, but as a workhorse behind the lines it is hard to beat.\n\n§GStrengths:§!§W Great mobility, flexible cargo space and easy to operate.\n§RWeaknesses:§!§W Thin armor and limited weapon options.\n\nProduction has started, and the first batch is on its way.§!"
 tur_mrap3_tender.15.a: "§WA reliable workhorse.§!"
 tur_mrap3_tender.16.name: "§W§YTulga§! Enters Service§!"
 tur_mrap3_tender.16.desc: "§WThe first §YTulga§! vehicles have entered service. Developed by £TUR §LBMC§!, this new equipment features a §Gvery low cost§! and §Gsimple maintenance§!, and other smaller modifications.\n\nIt is the most affordable option the army considered, a tough, simple vehicle that carries troops and cargo without fuss and can be repaired with the tools mechanics already have. Its protection is modest, but the army gets a lot of vehicles for the money.\n\n§GStrengths:§!§W Very low cost, simple to maintain and quick to produce.\n§RWeaknesses:§!§W Modest protection and unremarkable performance.\n\n§LBMC's§! lines are producing the first units.§!"
 tur_mrap3_tender.16.a: "§WCheap and cheerful.§!"
 tur_mrap3_tender.17.name: "§W§YYetisen§! Enters Service§!"
 tur_mrap3_tender.17.desc: "§WThe first §YYetisen§! vehicles have entered service. Developed by £TUR §LNurol§!, this new equipment features a §Gprotected cabin§! and a §Gcapable weapon mount§!, and other smaller modifications.\n\nIt was designed to reach the battlefield quickly and bring its crew home again, and its drivetrain copes well with mud, sand and steep ground. The army has accepted the higher price in return for a vehicle that can handle both transport and patrol duties.\n\n§GStrengths:§!§W Good protection, strong mobility and flexible roles.\n§RWeaknesses:§!§W Higher cost than basic utility vehicles and limited cargo space.\n\nProduction is beginning, though the finance ministry is watching closely.§!"
 tur_mrap3_tender.17.a: "§WQuick to the fight.§!"


 # ============================================================
 # SPAA TENDER
 # ============================================================
 tur_spaa_tender: "§WHold a tender for §YSPAA Systems§!"
 tur_spaa_tender_desc: "\n\n\n\n\n\n£TUR_spaa_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for a new self-propelled air defense system to protect our maneuver forces, which cannot keep advancing beneath an open sky. Domestic and foreign proposals are on the table.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YKorkut§! Development and the §YHisar§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_spaa_tender.1.name: "§WThe §YAir Defense§! Tender§!"
 tur_spaa_tender.1.desc: "§WThe proposals for the §YSelf-Propelled Air Defense Tender§! have been reviewed. Our maneuver forces cannot keep advancing beneath an open sky, and two options have been put before us.\n\n£TUR §YAtilgan§! and §YZipkin§!: short-range §YStinger§! missile systems on armored vehicles from £TUR §LASELSAN§!, with a §Gdomestic design§! and §Gcheap, quick production§!. They are §Gquick to field§!, but §Rinfrared guidance§! limits them in poor weather and against defended targets.\n\n£FRA £GER §YRoland§!: a missile system on an £TUR §LFNSS§! §YACV§! chassis, with §Gall-weather capability§!, §Gradar tracking§! and a heavier missile. It is §Rexpensive§!, §Rcomplex§! and §Rdependent on foreign suppliers§!.\n\nDomestic production or foreign capability?§!"
 tur_spaa_tender.1.a: "£TUR §YAtilgan§! and §YZipkin§! §G(Domestic, cheap)§! §R(Weather limits)§!"
 tur_spaa_tender.1.b: "£FRA £GER §YRoland§! §G(All-weather)§! §R(Expensive, foreign)§!"
 tur_spaa_tender.10.name: "§W§YAtilgan§! and §YZipkin§! Enter Service§!"
 tur_spaa_tender.10.desc: "§W£TUR §LASELSAN's§! two missile systems are now ready to protect the army's columns from the air. Developed by £TUR §LASELSAN§!, this new equipment features a §Gdomestic design§! and §Gshort-range Stinger missiles§!, and other smaller modifications.\n\nThe §YZipkin§! rides on a light wheeled chassis and can keep pace with fast-moving units, while the §YAtilgan§! sits on a tracked hull that follows the armor across rough ground. Crews say they are quick to learn and quick to fire.\n\n§GStrengths:§!§W Domestic design, good mobility, low cost and easy to train crews for.\n§RWeaknesses:§!§W Short range and infrared guidance that struggles in bad weather.\n\n§LASELSAN§! has begun delivering the first launchers.§!"
 tur_spaa_tender.10.a: "§WHomegrown air defense.§!"
 tur_spaa_tender.11.name: "§W§YACV Roland§! Enters Service§!"
 tur_spaa_tender.11.desc: "§WThe first §YACV Roland§! launchers have entered service. Developed by £FRA £GER §LEuromissile§! and mounted on an £TUR §LFNSS§! §YACV§! chassis, this new equipment features §Gradar guidance§! and §Gall-weather capability§!, and other smaller modifications.\n\nThe protected, mobile launcher has a far longer reach than the short-range options, and it can engage aircraft in poor weather and at night, which has long been a gap in the army's defenses.\n\n§GStrengths:§!§W Medium range, radar guidance and a proven missile.\n§RWeaknesses:§!§W High cost and reliance on foreign suppliers for spares and missiles.\n\nThe first launchers are being fitted at §LASELSAN's§! lines.§!"
 tur_spaa_tender.11.a: "§WReach and precision.§!"


 tur_korkut_development: "§WDevelop the §YKorkut§!"
 tur_korkut_development_desc: "\n\n\n\n\n\n£TUR_korkut_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a self-propelled air defense system that escorts our armored columns and engages threats at close range. The carrier platform will be chosen during the program.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YHisar§! Development and the §YGürz§! or §YBurç§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_korkut_requires_kms: "§WComplete the §YSPAA Systems§! Tender§!"
 tur_korkut_development.1.name: "§W§YKorkut§! SPAAG Development§!"
 tur_korkut_development.1.desc: "§WThe §YKorkut§! began as a requirement for an air defense system that could accompany our armored columns and engage threats at close range. Developed by £TUR §LASELSAN§!, this new equipment features §Gtwin 35-mm cannons§! and §Gintegrated radar and fire control§!, and other smaller modifications. Its electro-optical suite is ready, but it still lacks a carrier platform.\n\n£TUR §LFNSS§! §YACV-30§!: tracked chassis with §Gfar better protection§! and §Gdurability§!, but §Rslower§!.\n\n£TUR §LOtokar§! §YArma 8x8§!: wheeled chassis with §Ghigh speed§! and §Gmobility§!, but §Rless protection§!.\n\nWhichever we choose will define how the §YKorkut§! fights for decades.§!"
 tur_korkut_development.1.a: "£TUR §LFNSS§! §YACV-30§! §G(Better protection)§! §R(Slower)§!"
 tur_korkut_development.1.b: "£TUR §LOtokar§! §YArma 8x8§! §G(Fast, mobile)§! §R(Less protection)§!"
 tur_korkut_development.10.name: "§W§YKorkut 150/35§! Enters Service§!"
 tur_korkut_development.10.desc: "§WThe first §YKorkut 150/35§! vehicles have entered service. Developed by £TUR §LASELSAN§!, this new equipment features §Gtwin 35-mm autocannons§! and §Gradar fire control§!, and other smaller modifications.\n\nThe tracked version of the self-propelled anti-aircraft gun was designed to travel with the armored columns it protects. It can track and shoot down low-flying aircraft and drones before they drop their loads, and its hull can take a few hits that would cripple a lighter vehicle.\n\n§GStrengths:§!§W Strong firepower, good armor, radar guidance and able to follow armored units across rough ground.\n§RWeaknesses:§!§W High cost and heavy upkeep.\n\n§LASELSAN§! has begun producing the first vehicles.§!"
 tur_korkut_development.10.a: "§WGuardian of the columns.§!"
 tur_korkut_development.11.name: "§W§YKorkut 140/35§! Enters Service§!"
 tur_korkut_development.11.desc: "§WThe first §YKorkut 140/35§! vehicles have entered service. Developed by £TUR §LASELSAN§!, this new equipment features §Gtwin 35-mm autocannons§! and §Gradar fire control§!, and other smaller modifications.\n\nIt carries the same weapons and radar as its tracked cousin, but on a wheeled chassis built for speed on roads. It can cover long distances without wearing out its drivetrain and reaches new positions before enemy aircraft know where it went. Commanders will have to keep it near the roads and out of the fire.\n\n§GStrengths:§!§W Strong firepower, radar guidance, fast road speed and cheaper to maintain.\n§RWeaknesses:§!§W Weaker off-road and lighter protection.\n\n§LASELSAN§! has begun producing the first vehicles.§!"
 tur_korkut_development.11.a: "§WFast on the road.§!"


 TUR_develop_hisar: "§WDevelop the §YHisar-A§! and §YHisar-O§!"
 TUR_develop_hisar_desc: "\n\n\n\n\n\n£TUR_develop_hisar_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YHisar-A§! and §YHisar-O§! surface-to-air missile systems.\nDevelopers: £TUR §LASELSAN§! (radars and fire control) and £TUR §LRoketsan§! (missiles).\nFeatures: §Gmobile low-altitude defense§! (§YHisar-A§!) and §Gmedium-altitude coverage§! (§YHisar-O§!), and other smaller modifications.§!"
 tur_hisar_requires_korkut: "§WComplete the §YKorkut§! Development§!"


 # ============================================================
 # GURZ / BURC
 # ============================================================
 tur_gurz_requires_korkut: "§WComplete the §YHisar§! Development§!"
 tur_gurz_burc_development: "§WDevelop a New §YSelf-Propelled Anti-Air Vehicle§!"
 tur_gurz_burc_development_desc: "\n\n\n\n\n\n£GFX_TUR_develop_gurz_burc_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a modern domestic self-propelled anti-air system to protect our mechanized columns, which have no answer to modern air threats. Two domestic proposals are ready, and the choice between them will define the program.\n--------------\nThe program has §Y3 stages§!: the §Yplatform§! is chosen immediately, the §Yanti-air cannon§! after §Y40 days§!, and the §Ymissiles§! after §Y80 days§!. The design will be ready after §Y120 days§!.§!"
 tur_gurz_burc_dev.1.name: "§WThe §YAnti-Air Vehicle§! Program§!"
 tur_gurz_burc_dev.1.desc: "§WOur mechanized columns have no answer to modern air threats, and Turkish engineers have two domestic proposals ready for a new §Yself-propelled anti-air vehicle§!. The choice of platform must be made now, and the cannon and missile systems will be decided in the coming months.\n\n£TUR §YGürz§!: a self-propelled anti-air platform with a §Gmore capable§! design and §Gmore room for growth§!, but §Rmore expensive§! to develop.\n\n£TUR §YBurç§!: a self-propelled anti-air platform with a §Gcheaper§! and §Gsimpler§! design that can be fielded quickly, but §Rless capable§! and with §Rlimited room for growth§!.\n\nWhich platform should the program be built around?§!"
 tur_gurz_burc_dev.1.a: "£TUR §YGürz§! §G(More capable)§! §R(More expensive)§!"
 tur_gurz_burc_dev.1.b: "£TUR §YBurç§! §G(Cheaper, simpler)§! §R(Less capable)§!"
 tur_gurz_burc_dev.2.name: "§W§YAnti-Air Cannon§! Selection§!"
 tur_gurz_burc_dev.2.desc: "§WThe platform is settled, and the design team now needs a decision on the main armament.\n\n§YHeavy anti-air cannon§!: §Ggreater range§! and §Ghigher hitting power§! against fast or armored targets, but §Rmore expensive§!, §Rheavier§! and §Rconsumes more ammunition§!.\n\n§YStandard anti-air cannon§!: §Gcheaper§!, §Glighter§! and §Gproven§!, but §Rless effective§! against more advanced aircraft.\n\nThe missile systems will be decided in §Y40 days§!.§!"
 tur_gurz_burc_dev.2.a: "§YHeavy anti-air cannon§! §G(Range, hitting power)§! §R(More expensive)§!"
 tur_gurz_burc_dev.2.b: "§YStandard anti-air cannon§! §G(Cheaper, proven)§! §R(Less effective)§!"
 tur_gurz_burc_dev.3.name: "§W§YAnti-Air Missile§! Selection§!"
 tur_gurz_burc_dev.3.desc: "§WThe final design decision is the missile system that will complement the cannon.\n\n§YMedium range missiles§!: §Gengage targets well beyond cannon range§! and give the vehicle §Gmuch more flexibility§!, but §Rcost more§! and §Rneed a more complex fire control system§!.\n\n§YShort range missiles§!: §Gcheaper§!, §Gsimpler§! and §Gquick to field§!, but §Rlimited reach§!.\n\nThe finished design will be delivered in §Y40 days§!.§!"
 tur_gurz_burc_dev.3.a: "§YMedium range missiles§! §G(Reach, flexibility)§! §R(More expensive)§!"
 tur_gurz_burc_dev.3.b: "§YShort range missiles§! §G(Cheaper, simpler)§! §R(Limited reach)§!"
 tur_gurz_burc_dev.10.name: "§WThe §YAnti-Air Vehicle§! is Ready§!"
 tur_gurz_burc_dev.10.desc_gurz: "§WAfter four months of development, the §YGürz§! has passed its acceptance trials. Developed by our domestic defense industry, this new equipment features a §Gcapable platform§! and a §Gflexible armament§! built around the cannon and missile systems chosen during the program, and other smaller modifications.\n\nIt will give our mechanized units serious protection against air attack.\n\n§GStrengths:§!§W Capable platform, good growth potential and flexible armament.\n§RWeaknesses:§!§W High cost and more complex to maintain.\n\nThe design is now available, and production will begin shortly.§!"
 tur_gurz_burc_dev.10.desc_burc: "§WAfter four months of development, the §YBurç§! has passed its acceptance trials. Developed by our domestic defense industry, this new equipment features a §Gsimple, affordable platform§! and §Gquick production§! built around the cannon and missile systems chosen during the program, and other smaller modifications.\n\nIt can be fielded in numbers quickly to protect our mechanized columns.\n\n§GStrengths:§!§W Low cost, simple and quick to produce.\n§RWeaknesses:§!§W Less capable platform and limited growth potential.\n\nThe design is now available, and production will begin shortly.§!"
 tur_gurz_burc_dev.10.a: "§WOur columns are no longer defenseless.§!"
 
 tur_acv15_aifv_upgrade: "§W§YACV-15T1 AIFV§! Upgrade§!"
 tur_acv15_aifv_upgrade_desc: "\n\n\n\n\n\n£TUR_aifv_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to modernize the §YACV-15 AIFV§!, the infantry fighting vehicle of the Turkish mechanised infantry, whose gun and fire control are dated by today's standards.\n--------------\nThe program has §Y3 stages§!: the §Ymain gun§!, the §Yturret§! and the §Yanti-tank missiles§! are chosen one after the other.\n§RHigher options increase the cost of the programme.§!\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YPars Izci§! Development and the §YYNZMA§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_acv15_aapc_upgrade: "§W§YACV-15T1 AAPC§! Upgrade§!"
 tur_acv15_aapc_upgrade_desc: "\n\n\n\n\n\n£TUR_aapc_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to modernize the §YACV-15 AAPC§!, the armoured personnel carrier of the Turkish mechanised infantry, whose crew is exposed and whose fire support is weak.\n--------------\nThe program has §Y3 stages§!: the §Yarmament§!, the §Ypowertrain§! and the §Yanti-tank missiles§! are chosen one after the other.\n§RHigher options increase the cost of the programme.§!\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YPars Izci§! Development and the §YYNZMA§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_acv15_aifv.1.name: "§W§YACV-15T1 AIFV§!: Main Gun§!"
 tur_acv15_aifv.1.desc: "§WThe §YACV-15§! family was built by £TUR §LFNSS§! from the 1990s as the backbone of the Turkish mechanised infantry, and the §YAIFV§! variant has carried a §Y25mm§! cannon ever since. The gun remains reliable and well understood, but the battlefield has moved on and modern infantry fighting vehicles now field heavier armour.\n\nThe army has asked §LFNSS§! and £TUR §LAselsan§! to study a new armament. Keeping the §Y25mm§! cannon §Gis cheap§! and §Gneeds little rework§!, but §Rlimits lethality against modern armour§!. A move to a §Y35mm§! cannon gives §Gfar better penetration and range§!, but §Rcosts more§! and §Rrequires a reworked turret§!.§!"
 tur_acv15_aifv.1.a: "§WKeep the §Y25mm§! cannon§!"
 tur_acv15_aifv.1.b: "§WMove to a §Y35mm§! cannon§!"
 tur_acv15_aifv.2.name: "§W§YACV-15T1 AIFV§!: Turret§!"
 tur_acv15_aifv.2.desc: "§WThe original one-man turret of the §YACV-15 AIFV§! forces the gunner to sit inside the turret ring, and its fire control is dated by today's standards. £TUR §LAselsan§!, our leading defence electronics house, has offered modern stabilised sights and fire control for either layout, while £TUR §LFNSS§! will handle integration with the hull.\n\nA §Ymanned turret§! §Gis proven§! and §Gcheap§!, but §Rleaves the gunner exposed to turret damage§!. An §Yunmanned turret§! §Gkeeps the entire crew protected in the hull§! and §Gfrees up internal space§!, but §Ris costly§! and §Rcomplex to integrate§!.§!"
 tur_acv15_aifv.2.a: "§W§YManned turret§!§!"
 tur_acv15_aifv.2.b: "§W§YUnmanned turret§!§!"
 tur_acv15_aifv.3.name: "§W§YACV-15T1 AIFV§!: Anti-Tank Missiles§!"
 tur_acv15_aifv.3.desc: "§WThe §YAIFV§! was designed to fight alongside tanks, not against them, and its cannon alone struggles against heavy armour at long range. Both £TUR §LFNSS§! and £TUR §LAselsan§! have proposed fitting an anti-tank guided missile launcher on the turret, linked to the new fire control.\n\nA §Yturret-mounted ATGM§! §Gallows the vehicle to engage tanks at long range§! and §Gadds flexibility on the battlefield§!, but §Radds cost§! and §Rtakes up turret space§!. Without it, the vehicle stays §Gsimpler§! and §Gcheaper§!, but §Rdepends on tanks or other units to deal with enemy armour§!.§!"
 tur_acv15_aifv.3.a: "§WNo §YATGM§!§!"
 tur_acv15_aifv.3.b: "§WAdd a §Yturret-mounted ATGM§!§!"
 tur_acv15_aifv.4.name: "§W§YACV-15T1 AIFV§!: Design Complete§!"
 tur_acv15_aifv.4.desc: "§WAfter months of joint work, £TUR §LFNSS§! and £TUR §LAselsan§! have delivered the final design for the upgraded §YACV-15 AIFV§!. Upgraded by £TUR §LFNSS§! with fire control from £TUR §LAselsan§!, this modernization features a §Gnew main gun§! and a §Gnew turret with modern stabilised sights and fire control§!, built around the options chosen during the program, and other smaller modifications.\n\nThe first modernised vehicles are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_acv15_aifv.4.a: "§WExcellent.§!"
 tur_acv15_aapc.1.name: "§W§YACV-15T1 AAPC§!: Armament§!"
 tur_acv15_aapc.1.desc: "§WThe §YACV-15 AAPC§! is the troop carrier of the family. It has served with a simple machine gun on an open cupola, which leaves its crew exposed and its fire support weak. £TUR §LAselsan§!, our leading maker of remote weapon stations, has offered a stabilised station with day and night sights, which £TUR §LFNSS§! can fit to the existing hull.\n\nA §Y12.7mm§! station §Gis light§! and §Ginexpensive§!, but §Rgives only limited firepower§!. A §Y25mm§! station §Ggives the carrier real fire support§! and §Gcan engage light armour§!, but §Rcosts more§! and §Rcarries more weight§!.§!"
 tur_acv15_aapc.1.a: "§W§Y12.7mm§! remote weapon station§!"
 tur_acv15_aapc.1.b: "§W§Y25mm§! remote weapon station§!"
 tur_acv15_aapc.2.name: "§W§YACV-15T1 AAPC§!: Powertrain§!"
 tur_acv15_aapc.2.desc: "§WThe §YACV-15§! has served for decades with its original powerpack, and the added armour, weapon station and equipment of the upgrade will push it further. £TUR §LFNSS§!, as the vehicle's designer and builder, has warned that the extra weight will cost the carrier speed, acceleration and reliability over time.\n\nKeeping the §Yexisting engine§! §Gis cheap§! and §Gkeeps the logistics chain unchanged§!, but §Rthe heavier vehicle will be slower§! and §Rmore prone to breakdowns§!. An §Yupgraded engine§! §Grestores mobility§! and §Gextends the service life of the vehicle§!, but §Rcosts more§! and §Rrequires changes to the hull§!.§!"
 tur_acv15_aapc.2.a: "§WKeep the §Yexisting engine§!§!"
 tur_acv15_aapc.2.b: "§WInstall an §Yupgraded engine§!§!"
 tur_acv15_aapc.3.name: "§W§YACV-15T1 AAPC§!: Anti-Tank Missiles§!"
 tur_acv15_aapc.3.desc: "§WAs a carrier, the §YAAPC§! was never meant to fight enemy armour, but the infantry it carries often meets tanks with little support nearby. £TUR §LAselsan§! has proposed adding an anti-tank guided missile launcher to the remote weapon station, which £TUR §LFNSS§! can integrate with the new fire control.\n\nA §Yturret-mounted ATGM§! §Ggives the carrier a long-range anti-armour option§! and §Gstrengthens the dismounted infantry§!, but §Radds cost§! and §Rreduces the room left for ammunition§!. Without it, the vehicle stays §Gcheaper§! and §Gsimpler§!, but §Rhas no answer to enemy tanks§!.§!"
 tur_acv15_aapc.3.a: "§WNo §YATGM§!§!"
 tur_acv15_aapc.3.b: "§WAdd a §Yturret-mounted ATGM§!§!"
 tur_acv15_aapc.4.name: "§W§YACV-15T1 AAPC§!: Design Complete§!"
 tur_acv15_aapc.4.desc: "§WAfter months of joint work, £TUR §LFNSS§! and £TUR §LAselsan§! have delivered the final design for the upgraded §YACV-15 AAPC§!. Upgraded by £TUR §LFNSS§! with a remote weapon station from £TUR §LAselsan§!, this modernization features a §Gnew remote weapon station§! with §Gstabilised day and night sights§!, built around the options chosen during the program, and other smaller modifications.\n\nThe first modernised carriers are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_acv15_aapc.4.a: "§WExcellent.§!"
 tur_aapc_requires_afv: "§WComplete the §YAFV§! Development§!"
 tur_acv_requires_afv: "§WComplete the §YAFV§! Development§!"


 tur_afv_tender: "§WHold a tender for §YWheeled Armoured Vehicles§!"
 tur_afv_tender_desc: "\n\n\n\n\n\n£TUR_desctext_develop_domestic_afv_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for a new domestic wheeled armoured vehicle family for the Land Forces, offered as an §Yinfantry fighting vehicle§! and an §Yarmoured personnel carrier§!. Two domestic manufacturers have submitted proposals.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 turkey_afv_tender.1.name: "§W§YAFV§! Tender: Choose a Design§!"
 turkey_afv_tender.1.desc: "§WThe army has reviewed the candidates for the new armoured vehicle family. Each design is offered as an §Yinfantry fighting vehicle§! and an §Yarmoured personnel carrier§!.\n\n£TUR §YArma§!: a modular 8x8 wheeled armoured vehicle from £TUR §LOtokar§! with a §Ghigh payload§! and §Gstrong mine protection§!, but §Rheavier§!.\n\n£TUR §YPars III§!: a 6x6/8x8 wheeled armoured vehicle from £TUR §LFNSS§! with §Ggreat agility§! and §Gcheap production§!, but §Rless payload§!.\n\nThe chosen design will enter service in §Y120 days§!.§!"
 turkey_afv_tender.1.a: "£TUR §LOtokar§! §YArma§! §G(Payload and protection)§! §R(Heavier)§!"
 turkey_afv_tender.1.b: "£TUR §LFNSS§! §YPars III§! §G(Agile and cheap)§! §R(Less payload)§!"
 turkey_afv_tender.2.name: "§W§YAFV§! Tender: Design Delivered§!"
 turkey_afv_tender.2.desc: "§WAfter 120 days of work, the winning design is ready. Developed by our domestic defense industry, this new equipment features a §Gmodular wheeled platform§! and both §Yinfantry fighting vehicle§! and §Yarmoured personnel carrier§! variants, and other smaller modifications.\n\nBoth variants are now available to the Land Forces.§!"
 turkey_afv_tender.2.a: "§WExcellent.§!"


 tur_pars_izci_development: "§WDevelop the §YPars Izci§!"
 tur_pars_izci_development_desc: "\n\n\n\n\n\n£TUR_pars_izci_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a new reconnaissance vehicle for the Land Forces, which have long relied on converted utility vehicles and older armoured cars that cannot keep pace with the mechanised units they are meant to screen.\n--------------\nThe program has §Y3 stages§!: the §Ydrive configuration§!, the §Yarmament§! and the §Ypowertrain§! are chosen one after the other.\n§RHigher options increase the cost of the programme.§!§!"
 tur_pars_izci_development.1.name: "§W§YPars Izci§!: Drive Configuration§!"
 tur_pars_izci_development.1.desc: "§WThe army has long relied on converted utility vehicles and older armoured cars for reconnaissance, and neither can keep pace with the mechanised units they are meant to screen. The §YPars Izci§! is a wheeled scout derived from the §YPars§! family, developed by £TUR §LFNSS§! with weapon systems from £TUR §LAselsan§!. It is built on the proven §YPars III§! hull, with two possible layouts.\n\nThe §Y8x8§! layout §Gcarries more armour§! and §Gleaves room for heavier equipment§!, but §Ris heavier§!, §Rless agile§! and §Rcostlier to build§!. The §Y6x6§! layout §Gis lighter§!, §Gfaster§! and §Gcheaper§!, but §Rcarries less protection§! and §Rhas less room to grow§!.§!"
 tur_pars_izci_development.1.a: "§W§Y8x8§! configuration§!"
 tur_pars_izci_development.1.b: "§W§Y6x6§! configuration§!"
 tur_pars_izci_development.2.name: "§W§YPars Izci§!: Armament§!"
 tur_pars_izci_development.2.desc: "§WA scout must see the enemy first, but it also needs a way to fight clear when it is found. £TUR §LAselsan§!, our leading maker of remote weapon stations and turrets, has offered two options for the §YPars Izci§!, both fitted to the hull by £TUR §LFNSS§!.\n\nA §Y12.7mm§! remote weapon station §Gis light§!, §Ginexpensive§! and §Gkeeps the vehicle quiet and agile§!, but §Rgives only limited firepower§!. A §Y30mm§! cannon in an unmanned turret §Ggives real firepower against light armour§! and §Gkeeps the crew protected in the hull§!, but §Rcosts far more§! and §Radds weight§!.§!"
 tur_pars_izci_development.2.a: "§W§Y12.7mm§! remote weapon station§!"
 tur_pars_izci_development.2.b: "§W§Y30mm§! cannon in an unmanned turret§!"
 tur_pars_izci_development.3.name: "§W§YPars Izci§!: Powertrain§!"
 tur_pars_izci_development.3.desc: "§WA reconnaissance vehicle lives on speed, range and reliability, and the sensors, armament and armour of the design add weight to the hull. £TUR §LFNSS§! has warned that the engine inherited from the §YPars III§! will carry the load, but with less margin than a scout needs.\n\nKeeping the §Ysame engine§! §Gis cheap§! and §Gkeeps the logistics chain unchanged§!, but §Rthe vehicle will be slower under load§!. An §Yupgraded engine§! §Gimproves speed§! and §Gimproves reliability in the field§!, but §Rcosts more§! and §Rrequires changes to the hull§!.§!"
 tur_pars_izci_development.3.a: "§WKeep the §Ysame engine§!§!"
 tur_pars_izci_development.3.b: "§WInstall an §Yupgraded engine§!§!"
 tur_pars_izci_development.4.name: "§W§YPars Izci§!: Design Complete§!"
 tur_pars_izci_development.4.desc: "§WAfter months of joint work, the final design of the §YPars Izci§! has been delivered. Developed by £TUR §LFNSS§! with weapon systems from £TUR §LAselsan§!, this new equipment features a §Gdedicated reconnaissance design§! and a §Gmodern remote weapon system§!, built around the options chosen during the program, and other smaller modifications.\n\nThe first vehicles are ready to join the reconnaissance units of the Land Forces.§!"
 tur_pars_izci_development.4.a: "§WExcellent.§!"
 tur_izci_requires_aifv: "§WComplete the §YACV-15T1 ZMA§! Modernization§!"

 tur_ynzma_leg1: "§WDevelop §YYNZMA§! Leg 1§!"
 tur_ynzma_leg1_desc: "\n\n\n\n\n\n£TUR_ynzma_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a new §Yinfantry fighting vehicle§! for the Turkish mechanised infantry under the first leg of the §YYNZMA§! programme, as a successor to the aging §YACV-15§!. Three Turkish manufacturers have answered the first call.\n--------------\nThe program has §Y4 stages§!: the §Yvehicle§!, the §Ycannon§!, the §Yanti-tank missiles§! and the §Yengine§! are chosen one after the other. The design will be delivered after §Y120 days§!.\n§RHigher options increase the cost of the programme.§!\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the next legs of the §YYNZMA§! programme.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_ynzma_leg1.1.name: "§W§YYNZMA§! Leg 1: Choose a Vehicle§!"
 tur_ynzma_leg1.1.desc: "§WThe §YACV-15§! has carried the mechanised infantry for decades, and the army now wants a successor that can fight on a modern battlefield. The §YYNZMA§! programme has been opened in stages, and three Turkish manufacturers have answered the first call.\n\n£TUR §YPars Alpha§!: a wheeled infantry fighting vehicle from £TUR §LFNSS§! built on the §YPars§! family, with §Ggreat agility§! and §Gproven mobility§!, but §Rthe highest price§!.\n\n£TUR §YArma 2§!: an 8x8 wheeled infantry fighting vehicle from £TUR §LOtokar§! with §Ghigh payload§! and §Gstrong mine protection§!, but §Rheavier§! and §Rof moderate cost§!.\n\n£TUR §YAltuğ§!: a wheeled infantry fighting vehicle from £TUR §LBMC§! with §Glow cost§! and §Gfast development§!, but §Rless proven§! than its rivals.\n\nThe chosen design will take §Y120 days§! to complete.§!"
 tur_ynzma_leg1.1.a: "£TUR §LFNSS§! §YPars Alpha§!"
 tur_ynzma_leg1.1.b: "£TUR §LOtokar§! §YArma 2§!"
 tur_ynzma_leg1.1.c: "£TUR §LBMC§! §YAltuğ§!"
 tur_ynzma_leg1.2.name: "§W§YYNZMA§! Leg 1: Cannon§!"
 tur_ynzma_leg1.2.desc: "§WThe turret is where the new vehicle will earn its keep. £TUR §LAselsan§!, our leading defence electronics house, has offered a stabilised turret with modern sights and fire control, and the manufacturer will integrate it with the hull.\n\nA §Y25mm§! cannon §Gis proven§!, §Glight§! and §Ginexpensive§!, but §Rstruggles against modern armour§!. A §Y35mm§! cannon §Ggives far better penetration and range§! and §Gcan threaten heavier vehicles§!, but §Rcosts more§! and §Rcarries more weight§!.§!"
 tur_ynzma_leg1.2.a: "§W§Y25mm§! cannon§!"
 tur_ynzma_leg1.2.b: "§W§Y35mm§! cannon§!"
 tur_ynzma_leg1.3.name: "§W§YYNZMA§! Leg 1: Anti-Tank Missiles§!"
 tur_ynzma_leg1.3.desc: "§WThe cannon alone cannot reach the enemy tanks that sit beyond its range. £TUR §LAselsan§! has proposed fitting an anti-tank guided missile launcher to the turret, linked to the same fire control as the cannon.\n\nA §Yturret-mounted ATGM§! §Gallows the vehicle to engage tanks at long range§! and §Gadds flexibility on the battlefield§!, but §Radds cost§! and §Rtakes up turret space§!. Without it, the vehicle stays §Gsimpler§! and §Gcheaper§!, but §Rdepends on tanks and other units to deal with enemy armour§!.§!"
 tur_ynzma_leg1.3.a: "§WNo §YATGM§!§!"
 tur_ynzma_leg1.3.b: "§WAdd a §Yturret-mounted ATGM§!§!"
 tur_ynzma_leg1.4.name: "§W§YYNZMA§! Leg 1: Engine§!"
 tur_ynzma_leg1.4.desc: "§WThe armament, armour and electronics of the new vehicle will add weight to the hull, and the engine must carry it across rough terrain. The manufacturer has offered two powertrains.\n\nA §Ydiesel engine§! §Gis proven§!, §Gcheap§! and §Gkeeps the logistics chain unchanged§!, but §Ruses more fuel§! and §Ris louder§!. A §Yhybrid engine§! §Gimproves efficiency§! and §Gallows quiet running§!, but §Rcosts more§! and §Ris more complex to maintain§!.§!"
 tur_ynzma_leg1.4.a: "§W§Ydiesel§! engine§!"
 tur_ynzma_leg1.4.b: "§W§Yhybrid§! engine§!"
 tur_ynzma_leg1.5.name: "§W§YYNZMA§! Leg 1: Design Delivered§!"
 tur_ynzma_leg1.5.desc: "§WAfter 120 days of work, the final design of the §YYNZMA§! infantry fighting vehicle has been delivered. Developed by the chosen manufacturer with a turret from £TUR §LAselsan§!, this new equipment features a §Gmodern stabilised turret with advanced fire control§! and a §Gnew-generation infantry fighting vehicle design§!, built around the options chosen during the program, and other smaller modifications.\n\nThe first vehicles are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_ynzma_leg1.5.a: "§WExcellent.§!"
 tur_ynzma1_requires_izci: "§WComplete the §YPars Izci§! Development§!"

 tur_ynzma_leg2: "§WDevelop §YYNZMA§! Leg 2§!"
 tur_ynzma_leg2_desc: "\n\n\n\n\n\n£TUR_ynzma_leg2_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a new §Ylight tank§! for the Turkish Land Forces under the second leg of the §YYNZMA§! programme, a vehicle that can keep pace with the mechanised infantry and still hit hard. Three Turkish manufacturers have answered the call.\n--------------\nThe program has §Y4 stages§!: the §Yvehicle§!, the §Ycannon§!, the §Yengine§! and the §Yturret§! are chosen one after the other.\n§RHigher options increase the cost of the programme.§!§!"
 tur_ynzma_leg2.1.name: "§W§YYNZMA§! Leg 2: Choose a Vehicle§!"
 tur_ynzma_leg2.1.desc: "§WThe army wants a light tank that can keep pace with the mechanised infantry and still hit hard. Three Turkish manufacturers have answered the call with wheeled designs, each carrying a §Y120mm§! gun on a lightweight hull.\n\n£TUR §YPars Alpha 120 HT§!: a heavy-turret light tank from £TUR §LFNSS§! built on the §YPars§! family, with §Ggreat agility§! and §Gproven mobility§!, but §Rthe highest price§!.\n\n£TUR §YArma XC-8 120mm§!: an 8x8 light tank from £TUR §LOtokar§! with §Gstrong mine protection§! and §Gplenty of room to grow§!, but §Rheavier§! and §Rof moderate cost§!.\n\n£TUR §YAltuğ Hitfact 120mm§!: a compact light tank from £TUR §LBMC§! with §Glow cost§! and §Gfast development§!, but §Rless proven§! than its rivals.\n\nWhich vehicle should the program be built around?§!"
 tur_ynzma_leg2.1.a: "£TUR §LFNSS§! §YPars Alpha 120 HT§!"
 tur_ynzma_leg2.1.b: "£TUR §LOtokar§! §YArma XC-8 120mm§!"
 tur_ynzma_leg2.1.c: "£TUR §LBMC§! §YAltuğ Hitfact 120mm§!"
 tur_ynzma_leg2.2.name: "§W§YYNZMA§! Leg 2: Cannon§!"
 tur_ynzma_leg2.2.desc: "§WThe cannon decides what the light tank can fight. £TUR §LAselsan§!, our leading defence electronics house, has offered a stabilised fire control system for either gun, and the manufacturer will integrate it with the turret.\n\nA §Y105mm§! cannon §Gis proven§!, §Glighter§! and §Ginexpensive§!, but §Rstruggles against modern main battle tanks§!. A §Y120mm§! cannon §Gis far more lethal§! and §Gcan defeat heavily armoured targets§!, but §Rcosts more§! and §Rputs more strain on the light hull§!.§!"
 tur_ynzma_leg2.2.a: "§W§Y105mm§! cannon§!"
 tur_ynzma_leg2.2.b: "§W§Y120mm§! cannon§!"
 tur_ynzma_leg2.3.name: "§W§YYNZMA§! Leg 2: Engine§!"
 tur_ynzma_leg2.3.desc: "§WThe heavy gun, armour and electronics add weight to the hull, and the engine must carry it across rough terrain. The manufacturer has offered two powertrains.\n\nA §Ydiesel engine§! §Gis proven§!, §Gcheap§! and §Gkeeps the logistics chain unchanged§!, but §Ruses more fuel§! and §Ris louder§!. A §Yhybrid engine§! §Gimproves efficiency§! and §Gallows quiet running§!, but §Rcosts more§! and §Ris more complex to maintain§!.§!"
 tur_ynzma_leg2.3.a: "§W§Ydiesel§! engine§!"
 tur_ynzma_leg2.3.b: "§W§Yhybrid§! engine§!"
 tur_ynzma_leg2.4.name: "§W§YYNZMA§! Leg 2: Turret§!"
 tur_ynzma_leg2.4.desc: "§WThe turret decides how the crew fights and how well it survives. £TUR §LAselsan§! has offered modern sights and fire control for either layout, while the manufacturer handles integration with the hull.\n\nA §Ymanned turret§! §Gis proven§! and §Gcheap§!, but §Rleaves the crew exposed to turret damage§!. An §Yunmanned turret§! §Gkeeps the entire crew protected in the hull§! and §Gallows a lower silhouette§!, but §Ris costly§! and §Rcomplex to integrate§!.§!"
 tur_ynzma_leg2.4.a: "§W§Ymanned§! turret§!"
 tur_ynzma_leg2.4.b: "§W§Yunmanned§! turret§!"
 tur_ynzma_leg2.5.name: "§W§YYNZMA§! Leg 2: Design Delivered§!"
 tur_ynzma_leg2.5.desc: "§WAfter months of joint work, the final design of the §YYNZMA§! light tank has been delivered. Developed by the chosen manufacturer with fire control from £TUR §LAselsan§!, this new equipment features a §Gheavy cannon on a lightweight hull§! and a §Gmodern stabilised fire control system§!, built around the options chosen during the program, and other smaller modifications.\n\nThe first vehicles are ready to join the armoured units of the Land Forces.§!"
 tur_ynzma_leg2.5.a: "§WExcellent.§!"
 tur_ynzma2_requires_ynzma1: "§WComplete the §YYNZMA§! IFV Leg 1 Development§!"


 tur_ynzma_leg3: "§WDevelop §YYNZMA§! Leg 3§!"
 tur_ynzma_leg3_desc: "\n\n\n\n\n\n£TUR_ynzma_leg3_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a new §Yarmoured personnel carrier§! for the Turkish mechanised infantry under the third leg of the §YYNZMA§! programme, the stage-by-stage effort to replace the ageing §YACV-15§! fleet. Three Turkish manufacturers have submitted proposals.\n--------------\nThe program has §Y4 stages§!: the §Yvehicle§!, the §Ygun§!, the §Yturret§! and the §Yengine§! are chosen one after the other. The winning design will be ready in §Y120 days§!.\n§RHigher options increase the cost of the programme.§!§!"
 tur_ynzma_leg3.1.name: "§W§YYNZMA§! Leg 3: Choose a Vehicle§!"
 tur_ynzma_leg3.1.desc: "§WThe §YYNZMA§! programme is replacing the §YACV-15§! family one stage at a time, and the third leg covers the troop carrier that will move the infantry itself. Three Turkish manufacturers have submitted proposals, each with the same £TUR §LAselsan§! weapon station and fire control on offer.\n\n£TUR §YPars Alpha§!: a wheeled armoured personnel carrier from £TUR §LFNSS§! built on the §YPars§! family, with §Ggreat agility§! and §Gproven mobility§!, but of §Rmoderate price§!.\n\n£TUR §YArma 2§!: an 8x8 wheeled armoured personnel carrier from £TUR §LOtokar§! with §Ghigh payload§!, §Gstrong mine protection§! and §Gplenty of room to grow§!, but §Rheavier§! and §Rthe most expensive§!.\n\n£TUR §YAltuğ§!: a compact wheeled armoured personnel carrier from £TUR §LBMC§! with §Glow cost§! and §Gfast development§!, but §Rless proven§! than its rivals.\n\nThe chosen design will take §Y120 days§! to complete.§!"
 tur_ynzma_leg3.1.a: "£TUR §LFNSS§! §YPars Alpha§! §G(Agile and proven)§! §R(Moderate price)§!"
 tur_ynzma_leg3.1.b: "£TUR §LOtokar§! §YArma 2§! §G(Payload and protection)§! §R(Heavier and costlier)§!"
 tur_ynzma_leg3.1.c: "£TUR §LBMC§! §YAltuğ§! §G(Cheap and fast)§! §R(Less proven)§!"
 tur_ynzma_leg3.2.name: "§W§YYNZMA§! Leg 3: Gun§!"
 tur_ynzma_leg3.2.desc: "§WThe old carrier fought with a simple machine gun, and the army wants more fire support for the infantry it carries. £TUR §LAselsan§!, our leading maker of weapon stations and turrets, has offered two options, which the manufacturer will fit to the hull.\n\nA §Y12.7mm§! gun §Gis light§!, §Gproven§! and §Ginexpensive§!, but §Rgives only limited firepower§!. A §Y25mm§! cannon §Gis far more lethal against light armour and fortifications§!, but §Rcosts more§! and §Rcarries more weight§!.§!"
 tur_ynzma_leg3.2.a: "§Y12.7mm§! gun §G(Light and cheap)§! §R(Limited firepower)§!"
 tur_ynzma_leg3.2.b: "§Y25mm§! cannon §G(Lethal)§! §R(Costly and heavy)§!"
 tur_ynzma_leg3.3.name: "§W§YYNZMA§! Leg 3: Turret§!"
 tur_ynzma_leg3.3.desc: "§WA carrier's turret decides how well its gunner survives and how much room is left inside the hull. £TUR §LAselsan§! has offered modern sights and fire control for either layout.\n\nA §Ymanned turret§! §Gis proven§! and §Gcheap§!, but §Rtakes up space in the hull§! and §Rleaves the gunner exposed to turret damage§!. An §Yunmanned turret§! §Gkeeps the gunner protected in the hull§! and §Gfrees up internal space for troops§!, but §Rcosts more§! and §Ris complex to integrate§!.§!"
 tur_ynzma_leg3.3.a: "§Ymanned turret§! §G(Proven and cheap)§! §R(Gunner exposed)§!"
 tur_ynzma_leg3.3.b: "§Yunmanned turret§! §G(Protected and spacious)§! §R(Costly)§!"
 tur_ynzma_leg3.4.name: "§W§YYNZMA§! Leg 3: Engine§!"
 tur_ynzma_leg3.4.desc: "§WThe armament, armour and electronics of the new carrier add weight to the hull, and the engine must carry it across rough terrain with a full squad aboard. The manufacturer has offered two powertrains.\n\nA §Ydiesel engine§! §Gis proven§!, §Gcheap§! and §Gkeeps the logistics chain unchanged§!, but §Ruses more fuel§! and §Ris louder§!. A §Yhybrid engine§! §Gimproves efficiency§! and §Gallows quiet running§!, but §Rcosts more§! and §Ris more complex to maintain§!.§!"
 tur_ynzma_leg3.4.a: "§Ydiesel engine§! §G(Proven and cheap)§! §R(Louder)§!"
 tur_ynzma_leg3.4.b: "§Yhybrid engine§! §G(Efficient and quiet)§! §R(Costly)§!"
 tur_ynzma_leg3.5.name: "§W§YYNZMA§! Leg 3: Design Delivered§!"
 tur_ynzma_leg3.5.desc: "§WAfter 120 days of work, the final design of the §YYNZMA§! armoured personnel carrier has been delivered. Developed by the chosen manufacturer with a weapon station from £TUR §LAselsan§!, this new equipment features a §Gmodern weapon station with advanced fire control§! and a §Gnew-generation armoured personnel carrier design§!, built around the options chosen during the program, and other smaller modifications.\n\nThe first vehicles are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_ynzma_leg3.5.a: "§WExcellent.§!"
 tur_ynzma3_requires_ynzma2: "§WComplete the §YYNZMA§! IFV Leg 2 Development§!"


 tur_ynzma_leg4: "§WDevelop §YYNZMA§! Leg 4§!"
 tur_ynzma_leg4_desc: "\n\n\n\n\n\n£TUR_ynzma_leg4_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a new tracked §Yinfantry fighting vehicle§! for the Turkish mechanised infantry under the fourth leg of the §YYNZMA§! programme, the stage-by-stage effort to replace the ageing §YACV-15§! fleet. Two Turkish manufacturers have submitted proposals.\n--------------\nThe program has §Y5 stages§!: the §Yvehicle§!, the §Ygun§!, the §Yanti-tank missiles§!, the §Yturret§! and the §Yarmor§! are chosen one after the other. The winning design will be ready in §Y150 days§!.\n§RHigher options increase the cost of the programme.§!§!"
 tur_ynzma_leg4.1.name: "§W§YYNZMA§! Leg 4: Choose a Vehicle§!"
 tur_ynzma_leg4.1.desc: "§WThe §YYNZMA§! programme is replacing the §YACV-15§! family one stage at a time, and the fourth leg covers the infantry fighting vehicle that will fight alongside our tanks. Two Turkish manufacturers have submitted proposals, each with £TUR §LAselsan§! turret and fire control on offer.\n\n£TUR §YKaplan IFV§!: a tracked infantry fighting vehicle from £TUR §LFNSS§! built on the §YKaplan§! family, with §Ggreat agility§! and §Gproven mobility§!, but §Rthe higher price§!.\n\n£TUR §YTulpar IFV§!: a tracked infantry fighting vehicle from £TUR §LOtokar§! built on the §YTulpar§! family, with §Gstrong protection§! and §Gplenty of room to grow§!, but §Rheavier§! and §Rof moderate cost§!.\n\nThe chosen design will take §Y150 days§! to complete.§!"
 tur_ynzma_leg4.1.a: "£TUR §LFNSS§! §YKaplan IFV§! §G(Agile and proven)§! §R(Higher price)§!"
 tur_ynzma_leg4.1.b: "£TUR §LOtokar§! §YTulpar IFV§! §G(Protected and spacious)§! §R(Heavier)§!"
 tur_ynzma_leg4.2.name: "§W§YYNZMA§! Leg 4: Gun§!"
 tur_ynzma_leg4.2.desc: "§WThe gun is what lets the IFV support its infantry and threaten enemy vehicles. £TUR §LAselsan§!, our leading maker of turrets and fire control, has offered stabilised sights for either calibre, and the manufacturer will fit the gun to the hull.\n\nA §Y35mm§! cannon §Gis proven§! and §Grelatively inexpensive§!, but §Rhas less reach against armoured targets§!. A §Y40mm§! cannon §Ggives greater range and firepower against armour§!, but §Rcosts more§! and §Rcarries more weight§!.§!"
 tur_ynzma_leg4.2.a: "§Y35mm§! gun §G(Proven and cheap)§! §R(Less reach)§!"
 tur_ynzma_leg4.2.b: "§Y40mm§! gun §G(Range and firepower)§! §R(Costly and heavy)§!"
 tur_ynzma_leg4.3.name: "§W§YYNZMA§! Leg 4: Anti-Tank Missiles§!"
 tur_ynzma_leg4.3.desc: "§WThe cannon alone cannot reach the enemy tanks that sit beyond its range. £TUR §LAselsan§! has proposed fitting an anti-tank guided missile launcher to the turret, linked to the same fire control as the cannon.\n\nA §Yturret-mounted ATGM§! §Gallows the vehicle to engage tanks at long range§! and §Gadds flexibility on the battlefield§!, but §Radds cost§! and §Rtakes up turret space§!. Without it, the vehicle stays §Gsimpler§! and §Gcheaper§!, but §Rdepends on tanks and other units to deal with enemy armour§!.§!"
 tur_ynzma_leg4.3.a: "§YNo ATGM§! §G(Simple and cheap)§! §R(No long-range answer)§!"
 tur_ynzma_leg4.3.b: "§YTurret-mounted ATGM§! §G(Long-range anti-armour)§! §R(Costly)§!"
 tur_ynzma_leg4.4.name: "§W§YYNZMA§! Leg 4: Turret§!"
 tur_ynzma_leg4.4.desc: "§WThe turret decides how well the gunner survives and how much room is left in the hull for the embarked squad. £TUR §LAselsan§! has offered modern sights and fire control for either layout.\n\nA §Ymanned turret§! §Gis proven§! and §Gcheap§!, but §Rtakes up space in the hull§! and §Rleaves the gunner exposed to turret damage§!. An §Yunmanned turret§! §Gkeeps the entire crew protected in the hull§! and §Gfrees up internal space§!, but §Rcosts more§! and §Ris complex to integrate§!.§!"
 tur_ynzma_leg4.4.a: "§YManned turret§! §G(Proven and cheap)§! §R(Crew exposed)§!"
 tur_ynzma_leg4.4.b: "§YUnmanned turret§! §G(Protected and spacious)§! §R(Costly)§!"
 tur_ynzma_leg4.5.name: "§W§YYNZMA§! Leg 4: Armor§!"
 tur_ynzma_leg4.5.desc: "§WAn IFV must survive long enough to put its infantry on the objective, and the army must decide how far to trade weight for protection. Both manufacturers can fit either package.\n\n§YStandard armor§! §Gkeeps the vehicle light, mobile and cheap§!, but §Rleaves the crew and embarked infantry vulnerable to heavy weapons§!. §YHeavy armor§! §Ggives far better protection§! and §Gimproves survivability on the modern battlefield§!, but §Rcosts more§! and §Radds weight that slows the vehicle§!.§!"
 tur_ynzma_leg4.5.a: "§YStandard armor§! §G(Light and cheap)§! §R(Vulnerable)§!"
 tur_ynzma_leg4.5.b: "§YHeavy armor§! §G(Protected)§! §R(Costly and heavy)§!"
 tur_ynzma_leg4.6.name: "§W§YYNZMA§! Leg 4: Design Delivered§!"
 tur_ynzma_leg4.6.desc: "§WAfter 150 days of work, the final design of the §YYNZMA§! tracked infantry fighting vehicle has been delivered. Developed by the chosen manufacturer with a turret from £TUR §LAselsan§!, this new equipment features a §Gmodern stabilised turret with advanced fire control§! and a §Gnew-generation tracked infantry fighting vehicle design§!, built around the options chosen during the program, and other smaller modifications.\n\nThe first vehicles are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_ynzma_leg4.6.a: "§WExcellent.§!"
 tur_ynzma4_requires_ynzma3: "§WComplete the §YYNZMA§! Leg 3 Development§!"

