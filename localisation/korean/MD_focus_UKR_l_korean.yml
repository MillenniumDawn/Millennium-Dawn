 ukr_modernize_sov_equipment_mig27_sri_lanka_interest_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_sri_lanka_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[SRI.GetNameWithFlag]§!은(는) 타밀 타이거와 싸우고 있으며, 감당할 만한 가격의 타격기가 필요합니다. 우리가 보관 중인 §YMiG-27§! 전폭기가 바로 그런 기체이지만, 먼저 콜롬보를 설득해야 합니다.§!"
 ukr_modernize_sov_equipment_mig27_sri_lanka_contract_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_sri_lanka_for_tooltip\n\n\n\n\n\n\n\n\n§W콜롬보가 관심을 보이고 있습니다. 우리는 §Y리비우 국영 항공 수리 공장§!에서 재조립한 §Y6§!대의 §YMiG-27M§!과 조종사용 §YMiG-23UB§! 훈련기 한 대를 제안합니다.\n------------------\n§Y[SRI.GetNameWithFlag]§!이(가) 계약 체결 여부를 결정합니다. 거절하면 나중에 다시 시도할 수 있습니다.§!"
 ukr_modernize_sov_equipment_mig27_sri_lanka_preparation_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_sri_lanka_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y리비우 국영 항공 수리 공장§!은 1979년부터 §YMiG-27§!을 정비해 왔습니다. 이 공장은 §Y[SRI.GetNameWithFlag]§!에 보낼 기체를 분해하고 엔진을 오버홀하며 §G더 새로운 항전 장비와 표적 지정 포드§!를 장착합니다.§!\n\n$UKR_rada_modernization_design_tt$"
 ukr_modernize_sov_equipment_mig27_sri_lanka_delivery_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_sri_lanka_for_tooltip\n\n\n\n\n\n\n\n\n§W재조립한 기체가 준비되었습니다. 수송기가 기체를 콜롬보로 실어 나르고, 그곳에서 우리 교관들이 §Y[SRI.GetNameWithFlag]§! 공군에 인도합니다.§!"
 ukr_modernize_sov_equipment_mig27_restoration_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_restoration_for_tooltip\n\n\n\n\n\n\n\n\n§W스리랑카의 주문을 마치면 §Y리비우 국영 항공 수리 공장§!은 우리가 보관 중인 §YMiG-27§!도 같은 수준으로 한 번에 한 개 대대씩 재조립할 수 있습니다.§!"
