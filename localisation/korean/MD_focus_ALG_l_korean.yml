 alg_cabinet.201.t: "딥 스테이트의 압박"
 alg_cabinet.1.d: "현 내각은 대통령직, 관료 조직, 그리고 안보 기득권층 사이의 균형을 반영합니다.\n\n총리: [GetPMName]\n국방장관: [GetMODName]\n내무장관: [GetMOIName]\n외무장관: [GetMOFAName]\n재무장관: [GetMOFName]\n에너지장관: [GetMOEName]\n법무장관: [GetMOJName]\n정보 수장: [GetDRSName]\n\n내각 충성도: [GetCabinetLoyaltyLevel]\n내각 능력: [GetCabinetCompetenceLevel]\n내각 내 딥 스테이트 영향력: [GetCabinetDeepStateLevel]"
 alg_cabinet.10.d: "총리직은 여전히 부처 조율, 대통령직 보호, 일상적 통치 관리의 핵심입니다. 올바른 선택은 체제를 강화할 수 있지만, 잘못된 선택은 경쟁자들을 대담하게 만들 수 있습니다."
 alg_cabinet.1000.d: "총리직은 여전히 부처 조율, 대통령직 보호, 일상적 통치 관리의 핵심입니다. 올바른 선택은 체제를 강화할 수 있지만, 잘못된 선택은 경쟁자들을 대담하게 만들 수 있습니다."
 alg_cabinet.20.d: "국방부는 단순한 행정 기관이 아닙니다. 장교단, 최고 지휘부, 그리고 딥 스테이트를 이루는 네트워크와 깊이 얽혀 있습니다. 그 수장을 교체하는 일은 언제나 위험합니다."
 alg_cabinet.25.d: "장교단은 국방부의 최근 변화를 달갑게 여기지 않았습니다. 일부 파벌은 대통령직이 군 내부의 기존 균형을 흔들고 있다고 공공연히 불평하고 있습니다."
 alg_cabinet.30.d: "내무부는 국내 행정, 지방 통치, 그리고 국내 질서의 많은 지렛대를 통제합니다. 그 수장은 믿을 만하면서 정치적 능력도 갖추어야 합니다."
 alg_cabinet.40.d: "알제리의 외무장관은 서방, 아랍 세계, 그리고 더 넓은 비동맹 전통 사이의 관계를 조율하며 해외에서 공화국의 기조를 결정합니다."
 alg_cabinet.50.d: "재무부는 알제리가 기술 관료적 개혁, 국가 주도 관리, 아니면 오랫동안 체제를 규정해 온 익숙한 관료적 균형 중 어느 길을 추구할지를 결정합니다."
 alg_cabinet.60.d: "탄화수소는 여전히 알제리 국가의 중추입니다. 따라서 에너지부는 내각에서 경제적으로 가장 전략적인 직책 중 하나입니다."
 alg_cabinet.70.d: "법무부는 개혁의 수단으로, 체제 규율의 도구로, 또는 안보 기득권층의 무기로 사용될 수 있습니다."
 alg_cabinet.80.d: "정보 수장은 국가에서 가장 불투명하고 두려운 기관들을 지휘합니다. 이는 내각에서 가장 민감한 인사이며, 어떠한 큰 변화도 반발을 촉발할 수 있습니다."
 alg_cabinet.800.d: "정보 수장은 국가에서 가장 불투명하고 두려운 기관들을 지휘합니다. 이는 내각에서 가장 민감한 인사이며, 어떠한 큰 변화도 반발을 촉발할 수 있습니다."
 alg_cabinet.85.d: "정보기관 내 일부 세력이 최근 인사에 저항하고 있습니다. 낡은 네트워크는 여전히 온전하며, 그들 모두가 더 엄격한 정치적 통제를 받아들일 의사가 있는 것은 아닙니다."
 alg_cabinet.100.d: "전면적인 개편은 대통령직에 질서를 회복하고 동맹에게 보상하며 정부의 방향을 재정립할 기회를 제공합니다. 그러나 새로운 균형은 새로운 적을 만들기 마련입니다."
 alg_cabinet.110.d: "흔들리는 충성에 대한 소문이 대통령직에 전해졌습니다. 공개적인 단합 과시는 권위를 회복할 수 있지만, 문제를 강요하면 숨겨진 균열이 드러날 수도 있습니다."
 alg_cabinet.200.d: "여러 핵심 내각 구성원들이 불복종 또는 정치적 불신의 조짐을 보이고 있습니다. 이미 경쟁하는 네트워크와 숨겨진 권력 중심에 의해 형성된 체제에서, 이러한 불충은 위험합니다."
 alg_cabinet.201.d: "딥 스테이트가 장관 인사와 정책 방향에 대해 더 큰 영향력을 요구하고 있습니다. 그들의 압박을 수용하면 단기적 평온을 유지할 수 있지만, 저항하면 대립의 위험이 있습니다."
