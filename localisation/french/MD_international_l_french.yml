 recog_cat_nation_guide_tt: "En tant que nation non reconnue, nous devons nous efforcer d'obtenir de l'§COrganisation des Nations unies§! qu'elle nous reconnaisse comme État indépendant. En travaillant avec des alliés, en pétitionnant l'§CONU§! et par d'autres manœuvres politiques, nous pourrons finalement obtenir le soutien nécessaire pour §Yaccéder§!"
 is_un_is_recognized_nation: "[THIS.GetNameWithFlag] est un État membre reconnu de l'§BONU§!"
 is_un_ascension_warning_tt: "Nous ne devons §RPAS§! avoir récemment soumis une demande d'§Yaccession§! à l'§BONU§!. Nous devons attendre §Y[?recent_un_ascension_attempt:days_left|0] jours§! avant de soumettre une autre tentative."
 un_ascent_effect_tt: "Soumet une demande d'§Yaccession§! à l'§BONU§!, commençant par un vote du §YConseil de sécurité§!, puis procédant à un vote de l'§YAssemblée générale§! si le vote du §YConseil de sécurité§! passe.\n\nPour obtenir la §Yreconnaissance internationale§! et être accepté comme État de l'§BOrganisation des Nations unies§!, nous devons accomplir ce qui suit :\n\n§GFaire passer§! un vote de recommandation au §YConseil de sécurité§!, exigeant §Y9§! votes §GOui§! au total et §Y0§! vote §RNon§! d'un §Ymembre permanent du Conseil de sécurité§!\n\n§GFaire passer§! un vote à la majorité des §Y2/3§! à l'§YAssemblée générale§! de l'§BOrganisation des Nations unies§!, après avoir §Gfait passer§! le vote du §YConseil de sécurité§!."
