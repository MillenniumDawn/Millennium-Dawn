l_french:
 MD_ace_promoted.1.t: "Promotion d'un as"
 MD_ace_promoted.1.d: "Peu prennent autant de risques que les vaillants pilotes de l'armée de l'air [Root.GetAdjective]. [From.GetName] [From.GetSurname], pilote compétent(e) connu(e) sous l'indicatif [From.GetCallsign], s'est illustré(e) non seulement en revenant en vie, mais aussi en manœuvrant son [From.GetWing] avec une immense habileté. Récemment, [From.GetName] était en mission au-dessus de [From.GetMissionRegion] et a joué un rôle crucial dans le succès de cette confrontation importante.\n\nConsidéré(e) comme un modèle de courage [Root.GetAdjective], la récente promotion de [From.GetName] a été largement médiatisée. Bien que la guerre soit souvent perçue plus comme un enfer que comme une gloire, beaucoup sont ravis de voir qu'il existe encore des héros à soutenir."
 MD_ace_promoted.1.a: "L'audace mène à la victoire."
 MD_ace_died.1.t: "[From.GetCallsign] a trouvé la mort au-dessus de [From.GetMissionRegion]"
 MD_ace_died.1.d: "L'un des as [From.GetAceType] les plus célèbres de [From.Owner.GetName], [From.GetFullName], a trouvé la mort au cours d'une mission au-dessus de [From.GetMissionRegion]. Malheureusement, en tant que figure publique, la disparition de [From.GetCallsign] affecte profondément les nombreuses personnes qui l'admiraient.\n\nNous aurions préféré qu'il en soit autrement, mais [From.GetName] était bien trop populaire pour que sa disparition passe inaperçue. Finalement, sa mort lui permettra d'entrer dans la légende, au-delà des troubles actuels."
 MD_ace_died.1.a: "Une légende vivante eût été préférable."
 MD_ace_killed_by_ace.1.t: "[From.GetFullName] abattu par [Prev.GetCallsign]"
 MD_ace_killed_by_ace.1.d: "Pilots returning from [From.GetMissionRegion] report that a squadron of [Prev.Owner.GetAdjective] aircraft led by the infamous [Prev.GetCallsign] focused on chasing down [From.GetCallsign]. After taking down a number of enemy aircraft and dodging several missiles from the [Prev.Owner.GetAdjective]s, [From.GetCallsign] was overwhelmed by [Prev.GetCallsign] in [Prev.GetHerHis] [Prev.GetWingShort], who reportedly outmaneuvered [From.GetHerHim] and ripped the fuel tanks open with a clean hit. [From.GetName] [From.GetSurname]'s [From.GetWingShort] caught fire and went spiraling down over [From.GetMissionRegion] in a violent inferno.\n\n[From.GetFullName] has shown great courage throughout [From.GetHerHis] service and was looked up to by many. The loss of this national hero is a great blow to the [From.Owner.GetAdjective] air force and is a devastating blow to the nation as a whole. Knowing that while we grieve, [Prev.Owner.GetName] is celebrating [Prev.GetFullName] as a hero, makes the tragedy even greater."
 MD_ace_killed_by_ace.1.a: "C'est une perte terrible pour nous tous."
 MD_ace_killed_other_ace.1.t: "[From.GetFullName] a abattu [Prev.GetCallsign]"
 MD_ace_killed_other_ace.1.d: "Notre dernière mission au-dessus de [From.GetMissionRegion] a été couronnée de succès pour l'armée de l'air [From.Owner.GetAdjective] et ce, sous bien des aspects. Des rapports font état de l'intervention héroïque de [From.GetFullName], qui a réussi à se jouer du pilote [Prev.Owner.GetAdjective], [Prev.GetName] [Prev.GetSurname], portant le matricule [Prev.GetCallsign]. [From.GetCallsign] s'est servi de [From.GetHerselfHimself] comme appât et a attiré dans un piège dans lequel les pilotes [From.Owner.GetAdjective] ont pu fondre sur l'escadrille de [Prev.GetCallsign]. [From.GetCallsign] a contré les appareils [Prev.Owner.GetAdjective] et moyennant une salve unique, envoyé [Prev.GetCallsign] en piqué dans le ciel de [From.GetMissionRegion].\n\n[Prev.GetFullName] inspirait la crainte compte tenu de ses nombreuses victimes [From.Owner.GetAdjective]. Voilà une grande victoire qui atteste qu'en nous ralliant derrière de grands héros, ceux-ci peuvent réaliser des prouesses."
 MD_ace_killed_other_ace.1.a: "Une victoire à jamais ancrée dans la mémoire de [From.Owner.GetName] !"
 MD_aces_killed_each_other.1.t: "[From.GetFullName] a disparu"
 MD_aces_killed_each_other.1.d: "During the latest mission our famous [From.GetAceType] ace [From.GetFullName] ended up in a prolonged fight with the feared ace pilot, [Prev.GetFullName]. Being low on munitions and with no possibility of escape, [From.GetCallsign] maneuvered [From.GetHerHis] [From.GetWingShort] through the fire from the [Prev.Owner.GetAdjective] aircraft and proceeded to ram [Prev.GetCallsign].\nBoth [From.GetCallsign]'s [From.GetWingShort] and [Prev.GetCallsign]'s [Prev.GetWingShort] were spotted going down in pieces over [From.GetMissionRegion].\n\nWhile it is a small consolation that the [Prev.Owner.GetAdjective] menace, [Prev.GetCallsign], will no longer be a nuisance to us, we have lost a valued public figure and inspiration to all [From.Owner.GetAdjective]."
 MD_aces_killed_each_other.1.a: "Cela reste une perte terrible pour nous tous."