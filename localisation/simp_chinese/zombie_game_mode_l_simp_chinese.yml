 RULE_ZOMBIE_DIFFICULTY_NORMAL: "普通"
 RULE_ZOMBIE_DIFFICULTY_NORMAL_DESC: "丧尸初始数量为400万。"
 RULE_ZOMBIE_DIFFICULTY_HARD: "困难"
 RULE_ZOMBIE_DIFFICULTY_HARD_DESC: "丧尸初始数量为900万。"
 RULE_ZOMBIE_DIFFICULTY_EXTREME: "极端"
 RULE_ZOMBIE_DIFFICULTY_EXTREME_DESC: "丧尸初始数量为1350万。"
 RULE_ZOMBIE_DIFFICULTY_INSANE: "疯狂"
 RULE_ZOMBIE_DIFFICULTY_INSANE_DESC: "丧尸初始数量为3700万。"
 RULE_ZOMBIE_GAME_MODE: "启用丧尸模式"
 RULE_ZOMBIE_GAME_MODE_NO_DESC: "丧尸模式将不会启用"
 RULE_ZOMBIE_GAME_MODE_YES_DESC: "丧尸模式将会启用。其他所有千禧黎明内容依然存在，请注意这一点。如果你想扮演丧尸，请选择印度作为初始国家。"
 zombie: "丧尸病毒"
 zombie_desc: "这种病毒会将无害的人类变成怪物。"
 zombie_0: "丧尸病毒"
 zombie_0_desc: "这种病毒会将无害的人类变成怪物。"
 Zombie: "丧尸"
 Zombie_desc: "丧尸唯一的目的就是吞噬人类。"
 better_instincts: "更敏锐的本能"
 better_instincts_desc: "丧尸已经进化出更高效的杀戮方式。"
 shock_and_zombie_awe: "大规模恐慌"
 shock_and_zombie_awe_desc: "恐慌正在民众中蔓延。没有人能预料到僵尸的出现，也没想到它们如此迅速地击溃了军事阵地。绝望的防线崩溃，求生的信心也随之瓦解。"
 zombie.1.t: "病毒蔓延至英格兰"
 zombie.1.d: "英吉利海峡终究挡不住无情的瘟疫。受感染的难民涌上多佛的白垩悬崖，伦敦熙熙攘攘的街道在病毒撕裂帝国心脏之际陷入诡异的沉寂。随着死者开始行走，英国这座岛屿堡垒沦为了一座监狱。"
 zombie.1.a: "确认疫情爆发"
 zombie.2.t: "病毒蔓延至爱尔兰"
 zombie.2.d: "爱尔兰海未能阻挡亡灵瘟疫的蔓延。渔船返回港口时，带回的远不止渔获，沿海城镇也一个接一个地陷入沉寂。瘟疫从都柏林和科克向内陆蔓延，如同潮水般吞噬了翡翠岛，无数蹒跚的尸体涌来。"
 zombie.2.a: "确认疫情爆发"
 zombie.3.t: "病毒蔓延至美国"
 zombie.3.d: "尽管采取了紧急隔离措施，但逃离欧洲的感染难民还是将瘟疫带到了大西洋彼岸。东海岸的主要港口城市报​​告了疫情爆发，感染以惊人的速度向西蔓延。美国梦变成了行尸走肉的噩梦。"
 zombie.3.a: "确认疫情爆发"
 zombie.4.t: "病毒蔓延至日本"
 zombie.4.d: "如今，日出之国面临着一支毫无荣誉感和怜悯之心的军队。来自东京、大阪和其他人口中心的噩耗纷至沓来，这些人口稠密的城市已沦为死亡陷阱。古老的寺庙和现代的摩天大楼都无一幸免于感染者无情的攻势。"
 zombie.4.a: "确认疫情爆发"
 zombie.5.t: "病毒蔓延至澳大利亚"
 zombie.5.d: "浩瀚的海洋只能提供暂时的喘息之机。载着感染船员的货船抵达悉尼和墨尔本，疫情迅速蔓延至整个大陆。即使是环境恶劣的内陆地区也难以抵挡瘟疫的侵袭，人类最后的岛屿堡垒也开始沦陷。"
 zombie.5.a: "确认疫情爆发"
 zombie.6.t: "病毒蔓延至新西兰"
 zombie.6.d: "那些曾是中土世界灵感来源的偏远岛屿，如今也面临着一场末日浩劫。病毒通过海空两路传入，迅速蔓延至惠灵顿和奥克兰。新西兰曾经赖以生存的孤立状态，如今却意味着它已无处可逃。"
 zombie.6.a: "确认疫情爆发"
 zombie.7.t: "病毒蔓延至菲律宾"
 zombie.7.d: "感染如热带风暴般席卷菲律宾群岛。跳岛求生的幸存者将瘟疫从吕宋岛带到棉兰老岛，曾经作为天然屏障的数千岛屿如今变成一座座孤立无援的恐怖囚笼，逃生无望。"
 zombie.7.a: "确认疫情爆发"
 zombie.8.t: "丧尸大军"
 zombie.8.d: "死者行走于世。丧尸大军已席卷印度次大陆，通过感染和直接捕食迅速吞噬着我们的人口。专家将这场冲突命名为“大爆发”，但人类的生存之战才刚刚开始。绝望的国家已经开始关闭边境。"
 zombie.8.a: "动员对抗丧尸"
 zombie.8.b: "接受人类的命运"
 zombie.9.t: "[FROM.GetName]请求援助对抗丧尸"
 zombie.9.d: "[FROM.GetName]已请求援助，并试图争取所有主要国家的支持以阻止疫情爆发。我们会响应号召，还是优先考虑自身生存？"
 zombie.9.a: "加入联盟"
 zombie.9.b: "生存至上"
 RULE_ZOMBIE_JOINING_FACTION_GAME_MODE: "反丧尸联盟加入阵营"
 RULE_ZOMBIE_JOINING_FACTION_NORMAL: "默认阵营行为"
 RULE_ZOMBIE_JOINING_FACTION_NORMAL_DESC: "阵营行为是该游戏模式的默认行为。"
 RULE_ZOMBIE_JOINING_FACTION_NO_MAJORS: "无主要国家"
 RULE_ZOMBIE_JOINING_FACTION_NO_MAJORS_DESC: "主要国家不会加入反丧尸联盟。"
 RULE_ZOMBIE_JOINING_FACTION_ALL_MAJORS: "所有主要国家都会加入联盟。"
 RULE_ZOMBIE_JOINING_FACTION_ALL_MAJORS_DESC: "所有主要国家都会加入反丧尸联盟。"
 zombie.10.t: "爆发！"
 zombie.10.d: "丧尸病毒已蔓延至我们的领土，目前正在[?var:random_outbreak_state.GetName]全境扩散。疫情严重程度尚不明确。"
 zombie.10.a: "动员军队"
 zombie.11.t: "[FROM.GetName]爆发"
 zombie.11.d: "[FROM.GetName]爆发了疫情，并且疫情仍在迅速恶化。丧尸病毒以惊人的速度传播，这种情况可能预示着世界末日的开始。"
 zombie.11.a: "监控事态"
 zombie.11.b: "准备最坏的打算"
 RULE_ZOMBIE_SPAWN_LOCATION: "丧尸生成位置"
 RULE_ZOMBIE_SPAWN_INDIA: "印度（默认）"
 RULE_ZOMBIE_SPAWN_INDIA_DESC: "丧尸大军会像往常一样在印度生成。"
 RULE_ZOMBIE_SPAWN_AFRICA: "中非"
 RULE_ZOMBIE_SPAWN_AFRICA_DESC: "丧尸大军在中非（刚果地区）出现，开辟了一条更早威胁欧洲和中东的新战线。"
 RULE_ZOMBIE_SPAWN_EAST_ASIA: "东亚"
 RULE_ZOMBIE_SPAWN_EAST_ASIA_DESC: "丧尸大军在中国沿海地区出现，立即对东亚、日本和太平洋地区构成威胁。"
 RULE_ZOMBIE_SPAWN_MULTIPLE: "多地点"
 RULE_ZOMBIE_SPAWN_MULTIPLE_DESC: "丧尸大军同时在印度、中非和东亚出现，每个地点的初始兵力较小。"
 RULE_ZOMBIE_COALITION_ENABLED: "反丧尸联盟阵营"
 RULE_ZOMBIE_COALITION_ENABLED_YES: "启用（默认）"
 RULE_ZOMBIE_COALITION_ENABLED_YES_DESC: "反丧尸联盟正常组建。各大强国将被邀请加入对抗丧尸大军的战斗。"
 RULE_ZOMBIE_COALITION_ENABLED_NO: "禁用"
 RULE_ZOMBIE_COALITION_ENABLED_NO_DESC: "反丧尸联盟将不会成立。各国必须在没有组织化联盟的情况下独自在疫情中求生。"
 RULE_ZOMBIE_COALITION_DELAY: "丧尸生成延迟"
 RULE_ZOMBIE_COALITION_DELAY_NONE: "无延迟（默认）"
 RULE_ZOMBIE_COALITION_DELAY_NONE_DESC: "游戏开始时，丧尸群会立即出现。"
 RULE_ZOMBIE_COALITION_DELAY_ONE_YEAR: "1年"
 RULE_ZOMBIE_COALITION_DELAY_ONE_YEAR_DESC: "丧尸大军会在一年倒计时后出现，让各国有时间在疫情爆发前做好准备。"
 RULE_ZOMBIE_COALITION_DELAY_TWO_YEARS: "2年"
 RULE_ZOMBIE_COALITION_DELAY_TWO_YEARS_DESC: "丧尸大军会在两年倒计时后出现，这给了各国充足的时间来发展经济和军事力量。"
 RULE_ZOMBIE_COALITION_DELAY_THREE_YEARS: "3年"
 RULE_ZOMBIE_COALITION_DELAY_THREE_YEARS_DESC: "丧尸大军会在三年倒计时后出现，这给了各国在疫情爆发前充足的准备时间。"
 zombie_runner: "奔跑者菌株"
 zombie_runner_desc: "丧尸病毒的一种变异版本，速度更快，攻击性更强。奔跑者成群结队地移动，凭借速度和数量优势压倒防御。\n\n§G设计师提示：奔跑者速度快，在狭窄的队形中能提供强大的软攻击力。可以利用他们突破防线，压制步兵，但他们组织度低、防御力弱，反装甲能力几乎为零，因此持续作战代价高昂。§!"
 zombie_runner_0: "奔跑者菌株"
 zombie_runner_0_desc: "丧尸病毒的一种变异版本，速度更快，攻击性更强。奔跑者成群结队地移动，凭借速度和数量优势压倒防御。"
 zombie_brute: "蛮力菌株"
 zombie_brute_desc: "一种高度变异的毒株，能产生体型更大、更具抵抗力的丧尸。这些蛮兽能承受巨大的伤害，并能突破防线。\n\n§G设计师提示：蛮兽拥有比其他丧尸种类更高的防御力、突破力、力量和强力攻击力。可以将它们作为缓慢突击部队攻击坚固阵地，但它们速度慢、战斗宽度大、人力需求高，限制了其机动性和数量。§!"
 zombie_brute_0: "蛮力菌株"
 zombie_brute_0_desc: "一种高度变异的毒株，能产生体型更大、更具抵抗力的丧尸。这些蛮兽能承受巨大的伤害，并能突破防线。"
 zombie.12.t: "病毒蔓延至尼日利亚"
 zombie.12.d: "瘟疫已席卷整个非洲大陆。几内亚湾沿岸的港口城市报​​告了大量伤亡，感染者从沿海地区涌向内陆。尼日利亚庞大的人口和密集的城市中心使其成为这场灾难蔓延的温床。西非或许将从此面目全非。"
 zombie.12.a: "承认威胁"
 zombie.13.t: "病毒蔓延至巴西"
 zombie.13.d: "亚马逊雨林未能阻挡病毒传播。感染同时在圣保罗和里约热内卢爆发，并以惊人的速度席卷南美洲最大的几个城市。数百万惊慌失措的民众涌上通往内陆的高速公路，却在不知不觉中将病毒带入了他们的旅途。"
 zombie.13.a: "承认威胁"
 zombie.14.t: "病毒蔓延至土耳其"
 zombie.14.d: "土耳其横跨欧亚两大洲，成为东欧疫情与欧洲之间的桥梁。伊斯坦布尔和安卡拉爆发疫情，当局竭力控制疫情，但事态已迅速失控。博斯普鲁斯海峡，曾经是连接的象征，如今却只剩下死亡。"
 zombie.14.a: "承认威胁"
 zombie.15.t: "丧尸进化"
 zombie.15.d: "病毒正在变异。侦察兵报告称，我们的队伍发现了一种新型感染者：更迅捷、更凶残的变种成群结队地行动，而那些体型更大、更顽强的个体则能无视轻武器的射击。尸群日益危险。"
 zombie.15.a: "确认发现进化"
 ZOM_cure_developed: "丧尸解药原型"
 ZOM_cure_developed_desc: "我们的科学家已经研制出一种针对丧尸病毒的实验性疫苗。这种疫苗通过联盟的供应链分发，使所有与丧尸作战的部队都获得了显著的战斗优势。"
 ZOM_research_cure: "研发治疗方法"
 ZOM_research_cure_desc: "人类有史以来面临的最大威胁需要我们投入最强大的科学力量。通过汇集资源和专业知识，我们或许能够研发出扭转战局的解药或疫苗。任务完成后，所有与丧尸大军作战的国家都将获得战斗加成。"
 ZOM_establish_safe_zones: "建立安全区"
 ZOM_establish_safe_zones_desc: "划定并加强平民安全区，以保护非战斗人员并维护公共秩序。建立有序的疏散通道和加固的避难所，将有助于争取时间并稳定后方局势。"
 ZOM_develop_a_cure: "研发治疗方法"
 ZOM_develop_a_cure_desc: "筹集资金并完成研发解药决议。成功后，所有与丧尸大军作战的国家都将获得对抗不死族的战斗加成。"
 ZOM_protect_civilian_population: "保护平民"
 ZOM_protect_civilian_population_desc: "将稳定度维持在60%以上，以确保平民安全和社会凝聚力。"
 ZOM_global_mobilization: "全球总动员"
 ZOM_global_mobilization_desc: "将反丧尸联盟的成员国数量扩大到至少8个。"
 ZOM_defeat_the_zombie_horde: "击败丧尸大军"
 ZOM_defeat_the_zombie_horde_desc: "消灭丧尸大军，终结其对人类的威胁。"
 the_horde_spreads: "丧尸蔓延"
 zombie_capitulation.1.t: "红龙沉沦"
 zombie_capitulation.1.d: "地球上人口最多的国家已被吞噬。中国庞大的军队、它的长城、它那十亿之众的人口，全都无济于事。北京数日陷落，上海数小时沦陷。中国城市那惊人的密集程度将它们变成了屠场，如今超过十亿的尸骸正行进在丧尸大军的旗帜之下。如果连中国都守不住，我们其余人还有什么希望可言？"
 zombie_capitulation.1.a: "接受损失"
 zombie_capitulation.1.b: "准备最坏的打算"
 zombie_capitulation.2.t: "俄罗斯沦陷"
 zombie_capitulation.2.d: "地球上面积最大的国家已沦陷于丧尸瘟疫。俄罗斯无垠的冰冻苔原和茂密森林，曾被认为是抵御丧尸大军的天然堡垒，但面对一个不知寒冷、不知疲倦、永不停歇的敌人，却毫无作用。莫斯科的防线崩溃了，克里姆林宫一片寂静。如今，丧尸大军的疆域从欧洲一直延伸到太平洋。"
 zombie_capitulation.2.a: "接受损失"
 zombie_capitulation.2.b: "准备最坏的打算"
 zombie_capitulation.3.t: "美国沦陷"
 zombie_capitulation.3.d: "最后一个超级大国已经倒下。美国，尽管拥有强大的军事力量、核武库以及两大洋的天然屏障，也未能阻挡这股浪潮。东海岸最先沦陷，随后是中部腹地，最后是落基山脉中的残余据点也归于沉寂。星条旗不再飘扬在华盛顿上空。对许多人来说，这标志着已知人类文明的真正终结。"
 zombie_capitulation.3.a: "接受损失"
 zombie_capitulation.3.b: "准备最坏的打算"
 zombie_coalition_decision_category: "对抗丧尸决议"
 zombie_coalition_decision_category_desc: ""
 zombie.8.d.africa: "死者行走于世。丧尸大军已在中非爆发，正通过感染和直接捕食迅速吞噬着我们的人口。专家将这场冲突命名为“大爆发”，但人类的生存之战才刚刚开始。绝望的国家已经开始关闭边境。"
 zombie.8.d.east_asia: "死者行走于世。丧尸大军已在朝鲜半岛出现，正通过感染和直接捕食迅速吞噬着我们的人口。专家将这场冲突命名为“大爆发”，但人类的生存之战才刚刚开始。绝望的国家已经开始关闭边境。"
 zombie.8.d.multiple: "死者行走于世。丧尸大军同时席卷三大洲，印度、中非和朝鲜半岛接连遭受重创，通过感染和直接捕食迅速吞噬着人类。专家将这场冲突命名为“大爆发”，但人类的生存之战才刚刚开始。绝望的国家已经开始关闭边境。"
 zombie_capitulation.4.t: "大爆发结束"
 zombie_capitulation.4.d: "出乎所有人意料，人类最终取得了胜利。丧尸群已被击溃。它们的领地被解放，它们的尸群被摧毁，最后的感染者也已长眠。饱受末日蹂躏的城市开始了漫长的重建之路。世界已然改变，但它依然存在。"
 zombie_capitulation.4.a: "人类永存"
 ZOM_hold_the_line: "保持阵线"
 ZOM_hold_the_line_desc: "在丧尸大军进化之前，务必守住你的首都。如果你的政府所在地在第一波攻势过后依然屹立不倒，那么希望就依然存在。"
 ZOM_sanctuary: "庇护所"
 ZOM_sanctuary_desc: "设立五个安全区，为幸存者提供庇护。围墙、秩序和逃生之地，是幸存者仅存的避难所。"
 ZOM_sanctuary_completed_tt: "建立5个§Y安全区§!"
 ZOM_reclaim_the_cradle: "铲除巢穴"
 ZOM_reclaim_the_cradle_desc: "夺取疫情爆发的核心：丧尸大军的巢穴。烧毁瘟疫诞生的温床。"
 ZOM_total_eradication: "彻底根除"
 ZOM_total_eradication_desc: "消灭丧尸群，并研制出治愈感染的方法。战场上的胜利毫无意义，因为病毒仍在血液中传播。"
 ZOM_against_all_odds: "排除万难"
 ZOM_against_all_odds_desc: "在极限或疯狂难度下击败丧尸大军。面对压倒性的数量优势，人类拒绝屈服。"
 zombies: "丧尸大军"
 zombies_desc: "一大群受感染的活尸在饥饿和本能的驱使下向前移动。\n\n§G设计师提示：丧尸大军能提供数量庞大、训练迅速的前线部队，拥有强大的恢复能力和极高的软攻击力。利用它们的数量优势压制防御者，但其组织度低、反装甲能力弱以及人力需求高，使得每群丧尸都难以操控。§!"