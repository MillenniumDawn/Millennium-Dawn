l_russian:
 ghana.1.t: "Западный Тоголенд провозглашает суверенитет"
 ghana.1.d: "Уже несколько недель вдоль дорог области Вольта стоят щиты «Добро пожаловать в Западный Тоголенд», и никто не видел, кто их поставил. Теперь Фронт восстановления Западного Тоголенда, наследник движений народа эве, голосовавших в 1956 году против объединения с Золотым Берегом, провозгласил бывший Британский Тоголенд суверенным государством и требует переговоров под эгидой ООН. Местные вожди молчат. Наши спецслужбы признают, что ничего подобного не предвидели."
 ghana.1.a: "Направить в область совместную операцию армии и полиции."
 ghana.1.b: "Начать переговоры через Региональную палату вождей Вольты."
 ghana.1.c: "Горстка указателей. Не обращать внимания."
 ghana.2.t: "Нападения по всей области Вольта"
 ghana.2.d: "Через двенадцать часов после публикации фотографий пятисот новобранцев сепаратисты нанесли удар перед рассветом. Они ворвались в арсенал, взяли штурмом полицейские участки в Авейиме и Мепе, освободили заключённых и уехали на полицейских пикапах с винтовками. В заложниках трое полицейских, среди них начальник районной полиции. Кучи песка и горящие покрышки перекрыли все дороги в область, две радиостанции в руках сепаратистов, а полиции дали двадцать четыре часа на то, чтобы уйти."
 ghana.2.a: "Прочесать область, вернуть оружие, доставить подозреваемых самолётом в Аккру."
 ghana.2.b: "Начать переговоры с вождями и «Исследовательской группой Родины»."
 ghana.2.c: "Объявить чрезвычайное положение во всей области Вольта."
 ghana.3.t: "В области Вольта наступило затишье"
 ghana.3.d: "Дороги свободны, а четыре тысячи «Драконов», обещанные в видео сепаратистов, так никуда и не выступили. Десятки подозреваемых сидят под стражей в Аккре, Региональная палата вождей открестилась от движения, назвав его участников преступниками, а армия охраняла избирательные участки на декабрьских выборах. Остальное — дело судов."
 ghana.3.a: "Судить зачинщиков за государственную измену."
 ghana.3.b: "Отпустить под залог, как в 2019 году, и двигаться дальше."
 ghana.4.t: "Возвращение «Драконов»"
 ghana.4.d: "Люди на видео оказались не совсем выдумкой. Небольшие вооружённые отряды, называющие себя «Драконами Западного Тоголенда», вернулись из Того, устроили засаду на полицейский патруль в Восточной области и ограбили отделение банка в Хохоэ. Вожди Вольты, в прошлом году открестившиеся от движения, теперь говорят, что аресты и облавы сделали за него всю вербовку."
 ghana.4.a: "Выследить их — от границы до границы."
 ghana.4.b: "Амнистия и программа развития области Вольта."
 ghana.5.t: "Вольта восстаёт"
 ghana.5.d: "На этот раз флаги не снимают. Вооружённые «Драконы» удерживают Хо и дороги к тоголезской границе, районные администраторы бежали, а Фронт восстановления заявляет, что будет защищать Западный Тоголенд. Наша регулярная армия наблюдает из казарм, а в область уже выдвигаются наспех собранные добровольческие ополчения."
 ghana.5.a: "Значит, мы её вернём."
 ghana.6.t: "Решение вопроса Вольты"
 ghana.6.d: "Три месяца стычек между ополчениями опустошили деревни вдоль Вольты и переполнили больницы Хо. «Драконы» не могут захватить страну, а мы не можем заставить область полюбить нас под дулом автомата. Вожди предлагают выступить посредниками в урегулировании, а генералы — покончить со всем этим."
 ghana.6.a: "Покончить с этим силой."
 ghana.6.b: "Автономная область Вольта в составе Ганы."
 ghana.6.c: "Ополчения уже всё решили."
 ghana.7.t: "Соглашение по Вольте"
 ghana.7.d: "Два раунда переговоров с Региональной палатой вождей сделали то, чего не смогла ни одна облава. «Исследовательская группа Родины» отказалась от вооружённой борьбы, новобранцы Фронта восстановления разошлись по домам, а вожди привезли в Аккру проект: статут о региональной автономии области Вольта в составе Ганы и под её флагом."
 ghana.7.a: "Подписать статут о региональной автономии."
 ghana.7.b: "Поблагодарить вождей и оставить конституцию в покое."
 ghana_news.1.t: "Сепаратисты атаковали полицию в ганской области Вольта"
 ghana_news.1.d: "Боевики Фронта восстановления Западного Тоголенда совершили налёт на арсенал и два полицейских участка на востоке Ганы, перекрыли дороги в область Вольта и провозгласили бывший Британский Тоголенд суверенным государством. Аккра обдумывает ответ в одной из самых стабильных демократий Африки."
 ghana_news.1.a: "Старый пограничный вопрос снова всплывает."
 ghana_news.2.t: "Война ополчений в ганской области Вольта"
 ghana_news.2.d: "Вспыхнули бои между ганскими добровольческими ополчениями и так называемыми «Драконами Западного Тоголенда», которые удерживают Хо и дороги к тоголезской границе. Ни одна из сторон не ввела регулярную армию, но область Вольта превратилась в зону боевых действий, и беженцы уходят в Того."
 ghana_news.2.a: "А ведь Гана считалась стабильной."
 ghana_news.3.t: "Гана решает вопрос Вольты"
 ghana_news.3.d: "Кризис в Западном Тоголенде завершён. В области Вольта затихли выстрелы, а руководство сепаратистов рассеяно. Удержится ли мир, зависит от того, что пообещали области."
 ghana_news.3.a: "В Вольту возвращается мир."