 ENG_scottish_referendum_pressure: "스코틀랜드 주민투표 요구"
 ENG_scottish_referendum_pressure_desc: "스코틀랜드 의회는 독립 찬성파가 과반수이며, 연합왕국 유지를 옹호하는 목소리는 더 이상 대중이 들을 수 있는 어디에서도 나오지 않습니다. 홀리루드에서는 주민투표 법안이 작성되고 있습니다. 웨스트민스터에는 스코틀랜드에서 호의를 사거나 스코틀랜드의 재정이 눈에 띄게 재무부에 의존하도록 만들어, 헌법 문제를 전기 요금보다 덜 시급해 보이게 할 시간이 1년 있습니다. 캠페인이 무르익었을 때도 압력이 60을 넘는다면 요구는 공식화되고, 우리는 이에 답해야 합니다."
 ENG_scottish_pressure_defused_tt: "스코틀랜드 독립 압력이 §G50§! 미만임"
 ENG_north_irish_referendum_pressure: "국경 투표 요구"
 ENG_north_irish_referendum_pressure_desc: "민족주의 정당들이 스토먼트의 균형추를 쥐고 있으며 북아일랜드 장관에게 국경 투표 날짜를 정하라고 압박하고 있습니다. 종파 간 긴장과 이 지방이 자력으로 살림을 꾸릴 능력이 모두 테이블 위에 올라 있으며, 아일랜드 공화국이 이를 주시하고 있습니다. 웨스트민스터에는 요구가 공식화되기 전에 수치를 낮출 시간이 1년 있습니다."
 ENG_north_irish_pressure_defused_tt: "북아일랜드 독립 압력이 §G50§! 미만임"
 ENG_welsh_referendum_pressure: "웨일스 주민투표 요구"
 ENG_welsh_referendum_pressure_desc: "세네드의 독립 찬성파 과반수가 자체 주민투표 법안을 준비하고 있습니다. 웨일스 독립은 계산이 맞지 않는다는 바로 그 이유로 런던에서 오랫동안 진지하게 받아들여지지 않았습니다. 그러나 그 논리는 계산을 우리가 쥐고 있는 동안에만 유효합니다. 요구가 공식화되기 전에 압력을 다시 낮출 시간이 1년 있습니다."
 ENG_welsh_pressure_defused_tt: "웨일스 독립 압력이 §G50§! 미만임"
