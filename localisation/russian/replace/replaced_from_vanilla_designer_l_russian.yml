 DIVISION_PRODUCTION_COST_DESC: "Стоимость в §Hпромышленной мощности§! производства снаряжения бригады этого шаблона."
 DIVISION_NAMES_GROUP_DESC: "§HГруппа исторических названий подразделений.§!\nВсе бригады этого шаблона будут брать названия из этого списка. Если сменить группу сейчас, все подразделения текущего шаблона будут переименованы, кроме тех, которым вы дали название сами."
