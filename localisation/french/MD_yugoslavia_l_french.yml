l_french:
 yugo_nost_overview: "@SLV [SLV.GetName] §Y[?SLV.yugo_nostalgia|0]%§!\n@CRO [CRO.GetName] §Y[?CRO.yugo_nostalgia|0]%§!\n@MNT [MNT.GetName] §Y[?MNT.yugo_nostalgia|0]%§!"
 yugo_nost_rise_tt: "§Y+[?temp_yugo_nost_gain|0]§! Yougonostalgie en [THIS.GetFlag] [THIS.GetName]"
 yugo_consensus_tt: "Chaque État successeur survivant a au moins 75 % de yougonostalgie"
 yugo_nost_ser_ready_tt: "@SER [SER.GetName] a au moins 75 % de yougonostalgie"
 yugo_dominant_tt: "Nous détenons le plus d'influence parmi les anciennes républiques et menons le renouveau yougoslave"
 yugo_dominant_none: "aucun membre dominant"
 yugo_sends_invites_tt: "Envoie des invitations à tous les États post-yougoslaves restants pour former une nouvelle fédération"
 yugo_invite_accept_tt: "L'État qui répond est incorporé à la fédération yougoslave restaurée."
 yugo_invite_reject_tt: "L'État qui répond reste indépendant et la fédération gagne un but de guerre d'unification contre lui."
 yugoslavia.1.t: "Invitation à la Yougoslavie"
 yugoslavia.1.d: "[FROM.GetName] nous a invités à rejoindre une fédération yougoslave restaurée. L'acceptation signifie l'incorporation, tandis que le refus peut tourner sa campagne d'unification contre nous."
 yugoslavia.1.a: "Rejoindre la fédération"
 yugoslavia.1.b: "Rejeter l'unification"
 yugoslavia.30.t: "Une nation se tourne vers la Yougoslavie"
 yugoslavia.30.d: "Le soutien à une fédération yougoslave restaurée a dépassé les trois quarts du public. L'idée enterrée dans les années 1990 est de nouveau un projet politique vivant ici."
 yugoslavia.30.a: "Le rêve endure"
 yugoslavia_news.20.t: "Émergence du renouveau yougoslave"
 yugoslavia_news.20.d: "Des années de guerre et de règne ultranationaliste ont nourri un renouveau géopolitique dans les Balkans près d'une décennie après l'effondrement de la Yougoslavie, alors qu'une nation de la région a commencé à pousser pour sa restauration. \n\nDes défilés et des commerces au style rétro ont surgi à travers [GetYugoDominantName] avec des banderoles célébrant la « Fraternité et l'Unité », un net virage par rapport aux affrontements ethniques des années 90. Si le renouveau indique un élan pour des Balkans unis, on ignore si le mouvement continuera de croître ou s'éteindra, persistant comme un chant du cygne pour une nation perdue."
 yugoslavia_news.20.a: "La région change."
 formed_yugoslavia: "Gloire de la Yougoslavie"
 formed_yugoslavia_desc: "La fédération restaurée a assumé la responsabilité d'intégrer le territoire, les institutions et les peuples constitutifs des anciennes républiques yougoslaves."
 yugoslavia_restored: "Yougoslavie"
 yugo_bloc_dominant: "Chef du renouveau yougoslave"
 yugo_bloc_dominant_desc: "Nous détenons plus d'influence parmi les anciennes républiques qu'aucun autre État successeur. Notre capitale est le point de rencontre naturel pour des pourparlers sur une fédération restaurée."
 yugo_bloc: "Réunification yougoslave"
 yugo_bloc_desc: "Le soutien à une Yougoslavie restaurée doit atteindre 75 pour cent dans chaque État successeur survivant avant que l'unification puisse procéder. L'État ayant le plus d'influence dans les anciennes républiques mène le renouveau : §Y[GetYugoDominantName]§!.\n\n$yugo_nost_overview$"
 yugo_bloc_map: "Réunification yougoslave"
 yugo_promote_nostalgia: "Promouvoir la Yougonostalgie en [FROM.GetName]"
 yugo_promote_nostalgia_desc: "Financer les échanges culturels, les médias partagés et les commémorations conjointes pour bâtir le soutien à une fédération restaurée. Exige une influence significative sur l'État cible."
 yugo_promote_own_nostalgia: "Cultiver la Yougonostalgie dans le pays"
 yugo_promote_own_nostalgia_desc: "Financer commémorations nationales, programmes scolaires et médias publics qui présentent l'ancienne fédération sous un jour favorable. Plus lent et plus coûteux que de promouvoir la nostalgie à l'étranger, mais cela n'exige aucun pied-à-terre dans un autre État."
 yugo_form_federation: "Convoquer la Fédération"
 yugo_form_federation_desc: "Appeler chaque État successeur survivant dans une fédération yougoslave restaurée. Les États qui refusent donnent à la fédération un but de guerre d'unification. Seul le membre dominant peut convoquer les pourparlers, et seulement une fois que chaque successeur soutient la réunification."
 news.85.t: "Un retour de la Yougoslavie"
 news.85.desc: "Ce soir, à partir de minuit, un nouvel État rejoindra la scène internationale avec la reformation de la Yougoslavie. Cela créera une nouvelle puissance au sein des Balkans, promettant de protéger les Balkans de toute ingérence extérieure et assumant le rôle de gardien de l’Europe du Sud.\n \n“Aucune de nos républiques ne serait rien si nous n’étions pas tous ensemble ; mais nous devons créer notre propre histoire – l’histoire de la Yougoslavie unie, également à l’avenir.” \n― Josip Broz Tito"
 news.85.a: "Intéressant"
 yugoslavia_not_restored_tt: "La Yougoslavie n'a §Rpas§! déjà été restaurée par un autre État successeur"