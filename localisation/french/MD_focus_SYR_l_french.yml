 TT_SYR_AGRICULTURAL_INVESTMENT_EFFECT: "Investir plusieurs fois dans l'agriculture permettra l'émergence de nouveaux marchés et entreprises pour vendre les produits. Cependant, le nombre d'investissements requis pour que de nouvelles entreprises apparaissent est influencé par le niveau de corruption"
