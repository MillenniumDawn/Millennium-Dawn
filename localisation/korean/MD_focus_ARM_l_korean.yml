 arm_foreign_legion.1.t: "아르메니아 외인부대"
 arm_foreign_legion.1.d: "우리는 프랑스 외인부대의 사례에 영감을 받아 우리 군에도 유사한 부대를 창설하기로 결정했습니다. 이제 부대의 기술 장비 문제가 남았으며, 이 문제를 돕기 위해 프랑스와 인도의 전문가들을 참여시키고자 합니다."
 arm_foreign_legion.1.a: "훌륭하다"
 arm_foreign_legion.2.t: "아르메니아 외인부대"
 arm_foreign_legion.2.d: "마침내 우리의 새 부대인 외인부대가 창설되었습니다. 이제 다른 나라의 시민들도 외인부대에서 수년간 복무하며 아르메니아의 이익을 위해 피를 흘림으로써 우리 시민권을 얻을 기회를 갖게 되었습니다."
 arm_foreign_legion.2.a: "훌륭하다"
 arm_foreign_legion.3.t: "아르메니아 외인부대"
 arm_foreign_legion.3.d: "아르메니아 정부가 자국 부대인 외인부대를 우리에게 파견하겠다고 제안합니다. 그들은 자신들이 숙련된 전투원이며 기술 장비와 전투 훈련이 양호하여 현 상황에서 틀림없이 쓸모가 있을 것이라고 주장합니다."
 arm_foreign_legion.3.a: "받아들이겠다."
 arm_foreign_legion.3.b: "관심 없다"
 arm_foreign_legion.4.t: "우리의 외인부대"
 arm_foreign_legion.4.d: "[FROM.GetName]이(가) 현 상황의 안정화를 돕기 위해 우리 외인부대를 자국 영토에 주둔시키는 데 동의했으며, 우리는 이 협력에 매우 만족하고 있습니다."
 arm_foreign_legion.4.a: "알았다"
 arm_foreign_legion.5.t: "우리의 외인부대"
 arm_foreign_legion.5.d: "[FROM.GetName]이(가) 외인부대의 주둔이 불필요하다고 판단하여 우리 외인부대를 자국 영토에 받아들이기를 거부했습니다."
 arm_foreign_legion.5.a: "안타깝다"
 arm_foreign_legion.6.t: "우리의 외인부대"
 arm_foreign_legion.6.d: "우리 외인부대 병사들이 임무를 완수하고 조국으로 돌아오고 있습니다."
 arm_foreign_legion.6.a: "무사 귀환을 환영한다"
 coop_shit_unlock_tt: "§Y국제 군사 협력§! 결정이 §G잠금 해제됩니다!§!"
 rifle_eff_tt: "[FROM.GetNameWithFlag]이(가) 자국 소총 생산 면허를 제공합니다."
 effect_if_we_acc_tt: "§H우리가 수락할 경우의 효과:§!"
 effect_if_they_rec_tt: "§H상대가 받을 경우의 효과:§!"
 us_ar_prov_licens_tt: "[USA.GetNameWithFlag]이(가) 우리에게 §YM4A1§! 생산 면허를 제공합니다!"
 ru_ak_prov_licens_tt: "[SOV.GetNameWithFlag]이(가) 우리에게 §YAK-103§! 생산 면허를 제공합니다!"
 koch_inv_tt: "우리가 §Y선택§!하는 것에 §Y신중해야§! 합니다!"
 yerkr_party_change_tt: "§8군사 정권§! 정당이 §R예르크라파§!에서 §Y아르메니아 군대!§!로 바뀝니다"
 ARM_nor_aven_first: "북부 대로"
 later_good_thing_tt: "예레반의 인프라 문제가 §R제거§!되면, 예레반의 주 인프라가 개선됩니다."
 ARM_infr_problems_yerevan: "예레반의 인프라 문제"
 ARM_infr_problems_yerevan_desc: "예레반 중심부의 재건은 교통 정체, 상업 중단, 공사 비용으로 수도의 경제와 서비스에 부담을 주며 일시적인 혼란을 야기합니다.\n§W--------------§!\n재건이 완료되면 이 국가 정신은 §R제거§!되며, 예레반의 주 인프라가 개선됩니다."
 ARM_nor_aven_sec: "옛 예레반"
 norav_tt: "§Y북부 대로 사업§!을 어떻게 할지에 대한 §Y여러 선택지§!를 얻습니다"
 rus_waits_tt: "우리는 [SOV.GetNameWithFlag]와(과) §Y1년§! 이내에 §R부채 문제§!를 해결하기로 §Y합의했습니다!§!"
 first_assasin_tt: "§Y정치적 암살의 1단계를 마무리합니다!§!"
 second_assasin_tt: "§Y정치적 암살의 2단계를 마무리합니다!§!"
 arm_milit.1.t: "아르메니아, 소총 면허를 요청!"
 arm_milit.1.d: "최근 아르메니아 정부가 자국 내에서 우리 돌격 소총을 생산할 수 있는 면허를 요청해 왔습니다. 이 제안에 동의해야 하겠습니까?"
 arm_milit.1.a: "어디에 서명하면 되나?"
 arm_milit.1.b: "물론 안 된다."
 arm_milit.2.t: "[FROM.GetNameWithFlag], 우리 제안을 수락!"
 arm_milit.2.d: "[FROM.GetNameWithFlag]이(가) 우리 제안을 수락했으며 소총 생산에 필요한 모든 문서를 제공할 것입니다."
 arm_milit.2.a: "훌륭하다."
 arm_milit.3.t: "[FROM.GetNameWithFlag], 우리 제안을 거절!"
 arm_milit.3.d: "그들은 우리 제안을 거절했으며 자국 소총 생산에 관한 어떠한 문서나 면허도 제공하지 않을 것입니다."
 arm_milit.3.a: "어이가 없군."
 arm_milit.4.t: "오르시스의 제안"
 arm_milit.4.d: "군용 화기 제조업체 오르시스가 우리 군산 복합체에 투자하겠다고 제안했습니다. 우리는 그들의 제안을 수락할 수도 있고, 이 기회를 정치적 이득을 위해 활용할 수도 있습니다."
 arm_milit.4.a: "물론이다, 동의한다!"
 arm_milit.4.b: "당신들 물건은 사냥용이지 군용이 아니다!"
 arm_milit.5.t: "아르차흐군, 우리 군에 통합 중"
 arm_milit.5.d: "아르차흐 공화국군은 양국 군대의 원활한 상호 작용과 협력을 위해 우리 군에 통합되는 조치를 취하고 있습니다."
 arm_milit.5.a: "훌륭하다!"
 arme.6.t: "[ARM.GetNameWithFlag], 투자를 요청!"
 arme.6.d: "우리의 오랜 정치적 파트너이자 친구인 로베르트 코차랸이 서로에게 이익이 되는 거래로 아르메니아 경제에 투자해 달라고 요청합니다. 동의해야 하겠습니까?"
 arme.6.a: "물론이지!"
 arme.6.b: "미안하지만 이번에는 사양한다."
 arme.7.t: "[SOV.GetNameWithFlag], 동의!"
 arme.7.d: "러시아 정치 지도부와의 좋은 관계 덕분에 그들은 우리 경제에 투자하고 우리나라에 민간 공장을 건설하는 데 동의했습니다."
 arme.7.a: "훌륭하다!"
 arme.8.t: "[SOV.GetNameWithFlag], 거절!"
 arme.8.d: "안타깝게도 러시아는 우리 경제에 투자하고 거래에 서명하도록 설득되지 않았습니다."
 arme.8.a: "윽."
 arme.9.c: "오래된 역사적 건물을 보수한다"
 arme.11.t: "포고스 포고샨 암살!"
 arme.11.d: "로베르트 코차랸과 포고스 포고샨의 최근 회동 이후 포고스 포고샨이 제거되었습니다. 십중팔구 다슈나크추툰당은 격분할 것입니다. 그들을 어떻게 할지 결정해야 합니다."
 arme.11.a: "충성스러운 자들은 가까이 끌어들이자."
 arme.11.b: "그들은 쓸모가 없다."
 koch_union_stat_tt: "[ARM.GetNameWithFlag]이(가) §G연방 국가§!에 가입합니다!"
 arme.15.t: "야권의 지지 확대!"
 arme.15.d: "코차랸 정부의 무대응으로 인해 야권은 국민 사이에서 지지를 늘렸으며 더욱 결속되었습니다."
 arme.15.a: "젠장!"
