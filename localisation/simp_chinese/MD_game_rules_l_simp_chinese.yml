 RULE_OPTION_GREAT_COLLAPSE: "大崩溃"
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "冷战时期庞大的军费开支在它所针对的敌人消亡后依然存在，长达十年的抗议和镇压最终演变成一场瘫痪联邦政府的全国性铁路罢工。美国不堪重负，最终崩溃，各州只能自谋生路。"
 USB_AI_BEHAVIOR: "@USB 自由州"
 RULE_OPTION_REVANCHIST_PATH: "重申天命"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "残存的联邦体制促使自由州试图收复整个美国大陆。旧美国地图上的每一个邻国都成为等待被提出的领土要求，§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 RULE_OPTION_ISOLATION_PATH: "大停摆"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "美国梦已然破灭，自由州们对世界关上了大门，因为他们不再认为自己对世界负有任何责任。华盛顿昔日的承诺失效，东海岸陷入一片沉寂。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 RULE_OPTION_ARCADIA_PATH: "东方身份"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "联邦忠诚逐渐消退，自由州不再哀悼联邦的解体，而是根据阿卡迪亚计划构建新的§8东部认同§!。东海岸不再是旧联邦的残余，而成为一个独立的国家。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 CSA_AI_BEHAVIOR: "@CSA 南方共和国"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "美国南部"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "南方共和国秉持着古老的美国理念，决心在自己的旗帜下重建联邦。它自诩为美国的合法继承者，而非分裂分子。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "金环"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "共和国重拾§8金环§!计划，这是邦联昔日构想的环绕墨西哥湾和加勒比海的帝国版图。南方共和国将目光投向南方，寻求未来，而它的邻国则发现自己已落入他人的势力范围。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "东方身份"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "该共和国不愿继承美国或邦联的遗产，而是以其卡津人和克里奥尔人的文化遗产为基础，构建了一种新的身份认同。墨西哥湾沿岸地区成为一个独立的国家，而非任何国家的继承国。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "佛罗里达起义"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "南方民族主义者拒绝接受佛罗里达州的选举结果，拿起武器反抗他们所称的被窃取的政府。这个年轻的共和国在成立之初就分崩离析。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 CAS_AI_BEHAVIOR: "@CAS 卡斯卡迪亚"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "落基山抵抗军"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "奥林匹亚将爱达荷州狭长地带的动乱留给了当地警长处理，§8落基山脉抵抗运动§!不断壮大，最终山区各县起义独立。卡斯卡迪亚不得不应对其内陆地区的分裂势力。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "我们时代的和平"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "奥林匹亚派遣一支特别调查小组前往东部接管反抗行动，秩序逐渐恢复，直到§8落基山抵抗运动§!领导层自行解散该组织。卡斯卡迪亚则安然无恙地走出了危机。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 LKT_AI_BEHAVIOR: "@LKT 拉科塔"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "垦殖阵线战争"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "一名来自首都的审计员以自己的名义与§8垦殖阵线§!领导层对峙，会面最终以公开决裂告终。堪萨斯州在垦殖阵线的领导下实现军事化，拉科塔州则与其开战。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "垦殖阵线和平"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "第二轮调查驳斥了有关§8垦殖阵线§!的最严厉的报道，两国政府选择对话而非武力对抗。拉科塔人和垦殖阵线通过和解建立了一个共同的经济和社会联盟。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 GAME_RULE_nato_disabled: "通过游戏规则禁用§Y北约§!"
