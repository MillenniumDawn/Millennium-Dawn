 GRE_eastern_vars_initialized: "동방 형제 노선 초기화됨"
 GRE_migration_deal_active: "튀르키예와의 이주 협력이 활성화됨"
 GRE_assertive_patrols: "에게해 강경 순찰 체제가 활성화됨"
 GRE_lost_continental_shelf_claims: "튀르키예에 대륙붕 영유권을 양보함"
 GRE_aegean_de_escalation: "튀르키예의 최후통첩에 물러섬"
 GRE_confederation_active: "연방 결정 연쇄가 진행 중임"
 GRE_confederation_autonomy_done: "연방 자치 구조에 합의함"
 GRE_confederation_economy_done: "연방 경제 분배에 합의함"
 GRE_confederation_security_done: "연방 안보 체계에 합의함"
 GRE_defending_sovereignty: "그리스 주권 수호"
 GRE_defending_sovereignty_desc: "에게해와 키프로스에서 튀르키예의 침범을 억제하는 데 초점을 맞춘 지속적인 군사 대비 태세입니다. 그리스 해군과 공군은 경계를 강화하고 있으며, 국방비가 소비재로 돌아갈 수도 있었을 자원을 소모합니다. 이 표적 억지력은 그리스의 결의를 강화하지만 경제적 비용을 수반합니다."
 GRE_aegean_naval_supremacy: "에게해 해상 우세"
 GRE_aegean_naval_supremacy_desc: "전진 배치된 순찰과 상시 수상 함정 주둔으로 그리스 해군은 분쟁 중인 에게해 해역에서 우위를 점하고 있습니다."
 GRE_migration_cooperation_idea: "EU-튀르키예 이주 협약"
 GRE_migration_cooperation_idea_desc: "튀르키예가 그리스와 EU의 양보를 대가로 자국 영토에서 이주민 흐름을 처리하여 에게해 섬들의 부담을 완화합니다."
 GRE_migration_crisis_idea: "이주 위기"
 GRE_migration_crisis_idea_desc: "튀르키예가 이주 협약에서 탈퇴하여 에게해를 건너오는 새로운 입국자의 물결이 밀려들고 그리스의 수용 시설이 한계에 이르렀습니다."
 GRE_confederation_category: "키프로스 연방"
 GRE_confederation_category_desc: "제안된 키프로스 연방의 구조적 문제인 자치, 경제 분배, 안보를 해결합니다."
 GRE_eastern_missions_category: "동방 형제 임무"
 GRE_eastern_missions_category_desc: "에게해와 키프로스 노선에서 비롯되는 반복적인 정책 과제입니다."
 GRE_decide_autonomy_level: "연방 자치 수준 결정"
 GRE_decide_autonomy_level_desc: "신생 국가가 강력한 중앙 기관을 갖춘 연방제를 채택할 것인지, 아니면 각 공동체에 폭넓은 자치권을 부여하는 느슨한 국가 연합을 택할 것인지 확정합니다."
 GRE_decide_economic_distribution: "경제 분배 결정"
 GRE_decide_economic_distribution_desc: "연방 예산을 두 공동체 사이에 동등한 비율로 배분할 것인지, 아니면 GDP 기여도에 따라 가중하여 배분할 것인지 결정합니다."
 GRE_decide_security_guarantees: "안전 보장 결정"
 GRE_decide_security_guarantees_desc: "재통일된 국가가 나토의 안보 우산 아래에 들어갈 것인지, 아니면 중립적인 방위 태세를 추구할 것인지 결정합니다."
 GRE_aegean_dialogue_mission: "에게해 대화"
 GRE_aegean_dialogue_mission_desc: "6개월마다 그리스와 튀르키예의 협상단은 각자의 주장을 어디까지 밀어붙일지 결정해야 합니다. 대화가 공개적인 대립이나 전쟁으로 무너지면 임무는 종료됩니다."
 greece.700.t: "에게해 대화: 반기 검토"
 greece.700.d: "최근 협상 회차가 익숙한 갈림길에 이르렀습니다. 튀르키예 측은 추가적인 긴장 완화의 대가로 대륙붕에 대한 그리스의 부분적 양보를 압박하고 있습니다. 강경하게 버티면 우리의 영유권은 지킬 수 있지만, 감정의 골은 깊어질 것입니다."
 greece.700.a: "절제된 양보를 제시합니다"
 greece.700.b: "전선을 지킵니다"
 greece.701.t: "앙카라, 이주 협약에서 이탈"
 greece.701.d: "튀르키예 당국은 그리스의 외교적 태도를 이유로 이주민 송환 및 처리에 대한 협력을 중단했습니다. 에게해 섬들에서는 이미 새로운 입국자가 보고되고 있으며, 수용 센터는 수 주 안에 위기를 맞을 것입니다."
 greece.701.a: "유입에 대비합니다"
 greece.702.t: "에게해 사건"
 greece.702.d: "튀르키예 순찰기가 밤사이 그리스가 영유권을 주장하는 영공을 침범했습니다. 그리스 요격기가 대응에 나섰습니다. 총격은 없었지만 접근 거리는 위험할 정도로 가까웠습니다. 이제 사태를 진정시킬지, 아니면 더 강하게 맞받아칠지 결정해야 합니다."
 greece.702.a: "긴장을 완화합니다"
 greece.702.b: "대응 수위를 높입니다"
 greece.703.t: "앙카라, 북키프로스 증강"
 greece.703.d: "튀르키예 국영 언론이 북키프로스 당국에 대한 지원 확대를 확인했습니다. 이번 조치는 도발적이라기보다 계산된 것으로 보이며, 아테네가 키프로스 문제를 자기 뜻대로만 풀 수는 없다는 신호입니다."
 greece.703.a: "기록해 둡니다"
 greece.704.t: "동지중해 가스 위기"
 greece.704.d: "튀르키예의 시추선이 그리스와 키프로스가 배타적 경제 수역으로 간주하는 해역에 진입했습니다. 아테네는 대치를 풀 것인지, 더 큰 충돌의 위험을 무릅쓰고 현장을 지킬 것인지 결정해야 합니다."
 greece.704.a: "당분간 양보합니다"
 greece.704.b: "현장을 지킵니다"
 greece.705.t: "튀르키예의 최후통첩"
 greece.705.d: "앙카라가 엄중한 경고를 보냈습니다. 키프로스를 둘러싼 그리스의 행동이 계속되면 구체적으로 밝히지는 않았지만 실질적인 결과를 맞게 될 것이라는 내용입니다. 외무부가 답변해야 합니다."
 greece.705.a: "벼랑 끝에서 물러납니다"
 greece.705.b: "위협에 굴복하지 않습니다"
 greece.706.t: "일상적인 영공 사건"
 greece.706.d: "튀르키예의 또 다른 영공 비행이 기록되어 통상적인 경로를 통해 항의가 이루어졌습니다. 어느 쪽도 확전을 바라지 않지만 어느 쪽도 물러서려 하지 않는 양상이 계속됩니다."
 greece.706.a: "항의서를 제출합니다"
 greece.710.t: "연방: 자치 문제"
 greece.710.d: "협상단은 두 가지 모델을 테이블에 올렸습니다. 강력한 중앙 기관을 갖춘 연방제, 또는 대부분의 권한을 공동체에 위임하는 국가 연합입니다. 이 선택이 신생 국가의 성격을 규정할 것입니다."
 greece.710.a: "연방제 모델"
 greece.710.b: "국가 연합 모델"
 greece.711.t: "연방: 경제 분배"
 greece.711.d: "연방 수입은 어떻게 나눌 것인가? 엄격한 균등 배분은 소수 공동체를 안심시키지만, GDP 가중 방식은 경제적 현실을 반영하며 국내에서 변호하기도 더 쉬울 것입니다."
 greece.711.a: "균등 배분"
 greece.711.b: "GDP 가중 배분"
 greece.712.t: "연방: 안보 체계"
 greece.712.d: "재통일된 국가는 나토의 우산 아래로 들어갈 것인가, 아니면 중립적인 방위 태세를 취할 것인가? 두 길 모두 아테네와 니코시아에 지지자들이 있습니다."
 greece.712.a: "나토 안보 우산"
 greece.712.b: "중립적 방위 태세"
 greece.720.t: "키프로스 합병 요구"
 greece.720.d: "수개월에 걸친 외교적 책동과 튀르키예에 대한 압박 끝에, 아테네는 키프로스와 북키프로스를 그리스와 합병할 것을 공식적으로 요구할 준비를 마쳤습니다. 그리스는 그리스계 키프로스 주민 사이에서 충분한 지지를 확보했으며, 튀르키예가 국제적 압력에 물러섰다면 북키프로스 지도부 또한 설득될 수 있습니다. 결단의 순간이 다가왔습니다."
 greece.720.a: "요구를 제기합니다"
 greece.721.t: "키프로스에 되돌아온 전쟁"
 greece.721.d: "키프로스의 한쪽 또는 양쪽 정부가 그리스의 합병 요구를 거부했으며, 군사 충돌이 임박했습니다. 앙카라는 격렬한 규탄과 경고를 쏟아냈습니다. 튀르키예군은 즉응 태세를 유지하고 있으나 직접 개입을 확약하지는 않았습니다. 국제 사회는 아테네가 자국군을 투입할지, 아니면 비밀 지원을 이어갈지 긴장 속에 지켜보고 있습니다."
 greece.721.a: "반응을 기록해 둡니다"
 greece.722.t: "아테네는 어디까지 갈 것인가? (키프로스)"
 greece.722.d: "키프로스 공화국이 합병 요구를 거부했고 군사 충돌이 임박했습니다. 우리는 음지에서 자원병과 물자로 합병을 지지하는 그리스계 키프로스 세력을 무장시키고 지원하거나, 그리스군을 공개적으로 투입하여 병합을 강행할 수 있습니다. 전자는 그리스가 나토의 신임을 잃지 않게 해 줍니다. 후자는 그리스 병사를 전투에 투입하고, 동맹 탈퇴를 요구하며, 튀르키예의 직접 개입을 촉발할 수도 있습니다. 그러나 신속한 정복과 남부 섬의 통합을 보장하기도 합니다."
 greece.722.a: "자원병과 물자만 지원합니다"
 greece.722.b: "그리스군을 투입합니다. 키프로스에 선전포고합니다"
 greece.730.t: "튀르키예에 대한 나토의 압박"
 greece.730.d: "아테네가 나토 동맹국에 접촉하여, 에게해에서 튀르키예의 공세적 태도를 누그러뜨리도록 외교 경로를 활용해 설득해 줄 것을 요청하고 있습니다. 서방 강대국의 이러한 압력은 앙카라가 입장을 재고하도록 설득할 수 있습니다."
 greece.730.a: "아테네 편에 섭니다"
 greece.730.b: "우리의 다툼이 아닙니다"
 greece.731.t: "동맹의 지원 확보"
 greece.731.d: "우리의 나토 파트너가 에게해 긴장 문제로 앙카라와 협의하기로 합의했습니다. 서방의 외교적 지원은 대치 상황을 완화하고 우리의 단호한 입장을 정당화하는 데 도움이 될 것입니다."
 greece.731.a: "외교적 승리입니다"
 greece.732.t: "우리의 요청이 거절됨"
 greece.732.d: "나토 동맹국이 에게해 분쟁을 두고 튀르키예와 직접 협상하는 데 정중히 난색을 표했습니다. 이들은 양자 간 해양 문제에서는 중립을 유지하기를 선호합니다."
 greece.732.a: "우리는 흔들리지 않습니다"
 greece.733.t: "키프로스 경제 통합 제안"
 greece.733.d: "아테네가 관세 동맹, 은행 제도 조화, 에너지 정책 조율을 포함한 키프로스 공화국과의 심층적인 경제 통합을 제안했습니다. 이러한 관계는 섬을 그리스 경제에 긴밀히 묶어 두는 한편 니코시아의 생활 수준을 높일 것입니다."
 greece.733.a: "그리스와 통합합니다"
 greece.733.b: "자치를 지킵니다"
 greece.734.t: "키프로스, 통합 수락"
 greece.734.d: "니코시아가 제안을 받아들였습니다. 그리스와 키프로스 기업들은 규제를 조화시키고 있으며, 은행 체계는 통합되고, 공동 투자가 에게해를 가로질러 흐르고 있습니다. 이 경제 통합은 향후 어떤 정치적 타결에서도 아테네의 입지를 강화합니다."
 greece.734.a: "통합은 번영을 낳습니다"
 greece.735.t: "키프로스, 심층 통합 거절"
 greece.735.d: "니코시아가 심층적인 경제 통합 제안을 정중히 거절했습니다. 키프로스 공화국은 당분간 더딘 성장을 감수하더라도 경제 문제에서 독립성을 유지하기를 선호합니다."
 greece.735.a: "우리의 뜻은 변함없습니다"
 greece.736.t: "동지중해 가스 개발 제안"
 greece.736.d: "아테네가 키프로스 남부와 크레타 동부 해역의 해상 천연가스전을 공동 개발할 것을 제안했습니다. 공동 채굴 사업은 양국 경제를 활성화하고 장기적인 에너지 수익을 창출할 것입니다."
 greece.736.a: "가스전을 함께 개발합니다"
 greece.736.b: "지금은 너무 도발적입니다"
 greece.737.t: "키프로스 가스전 가동 개시"
 greece.737.d: "그리스와 키프로스의 시추 설비가 공동 가스전에서 천연가스 채굴을 시작했습니다. 새로운 정제 설비가 가동되고 양국 경제는 지속적인 에너지 수익의 혜택을 누립니다. 이 조치는 튀르키예의 반발과 무관하게 그리스가 자국의 배타적 경제 수역을 개발할 의지가 있음을 앙카라에 알리는 신호입니다."
 greece.737.a: "자원이 우리의 미래를 지켜줍니다"
 greece.738.t: "키프로스, 가스 사업 거부"
 greece.738.d: "키프로스 공화국은 튀르키예의 외교적 반발을 우려하여 공동 가스 개발 참여를 거절했습니다. 아테네는 이 문제를 강요하지 않을 것입니다."
 greece.738.a: "놓쳐버린 기회입니다"
 greece.739.t: "튀르키예계 키프로스인에 대한 접근"
 greece.739.d: "아테네가 북부의 튀르키예계 키프로스 공동체에 경제적, 문화적 손길을 내밉니다. 아테네는 투자, 무역 특혜, 문화 교류 사업을 제시하여, 그리스의 주도 아래 이루어지는 재통일이 그리스계 키프로스 쪽뿐 아니라 북부의 이익에도 부합함을 보여 줍니다."
 greece.739.a: "그리스의 투자를 수락합니다"
 greece.739.b: "경계를 늦추지 않습니다"
 greece.740.t: "북키프로스, 투자를 환영"
 greece.740.d: "튀르키예계 키프로스 지도부가 그리스의 투자와 더욱 긴밀한 경제 관계를 받아들였습니다. 자금이 북쪽으로 흘러가고, 사업 제휴가 형성되며, 영향력은 서서히 아테네에 유리하게 기울고 있습니다. 궁극적인 재통일을 위한 기반은 달이 갈수록 단단해집니다."
 greece.740.a: "통합의 씨앗이 뿌려졌습니다"
 greece.741.t: "북키프로스, 접근 거부"
 greece.741.d: "그리스의 의도를 경계하는 튀르키예계 키프로스 공동체가 투자 패키지를 거절했습니다. 앙카라의 지원은 여전히 이들의 방패이며, 아테네의 접근은 이들의 생각을 바꾸지 못했습니다."
 greece.741.a: "또 하나의 차질입니다"
 greece.742.t: "영국 주권 기지 협정 제안"
 greece.742.d: "아테네가 영국에 아크로티리와 데켈리아의 주권 기지 지역에 대한 통제권을 이양할 것을 요청했습니다. 그 대가로 그리스는 보상, 나토의 지속적인 접근, 영국 군사 시설 보존 보장을 제안합니다. 이 기지들의 이양은 키프로스의 전략적 균형을 바꿔 놓을 것입니다."
 greece.742.a: "기지를 그리스에 양도합니다"
 greece.742.b: "기지는 영국의 것으로 남습니다"
 greece.743.t: "영국, 이양에 동의"
 greece.743.d: "런던은 기지 이양이 양국의 장기적 이익에 부합한다고 판단했습니다. 그리스군이 이제 아크로티리와 데켈리아를 점유하며, 아테네는 전략적 종심과 핵심 비행장 및 항구에 대한 통제권을 확보합니다. 이 변화는 군사적 균형을 엔오시스 쪽으로 결정적으로 기울입니다."
 greece.743.a: "역사적인 획득입니다"
 greece.744.t: "영국, 이양 거절"
 greece.744.d: "영국 정부가 주권 기지 지역의 포기를 거절했습니다. 1960년 이래 그래왔듯이 이곳은 계속 영국의 영토이자 영국의 군사 시설로 남습니다."
 greece.744.a: "우리는 손발이 묶였습니다"
 GRE_western_commitment: "그리스의 서방 정렬도"
 GRE_western_commitment_tt: "$GRE_western_commitment$: $RIGHT|+=0Y$"
 greece.745.t: "압박 캠페인 종료"
 greece.745.d: "키프로스를 둘러싼 튀르키예 압박 캠페인이 종료되었습니다. 여러 강대국이 동지중해의 안정 필요성과 키프로스 주민의 권리를 들어 그리스의 입장에 지지를 표명했습니다. 이제 아테네는 상당한 외교적 지렛대를 쥐고 있습니다. 지지 목소리의 수에 따라, 앙카라가 물러서서 키프로스에 대한 영향력 축소를 받아들일 확률은 [GRE_GetTurkeyConcessionChance]입니다. 튀르키예가 거부하면 에게해 전역에서 긴장이 고조될 것입니다."
 greece.745.a: "앙카라의 반응을 지켜봅니다"
 greece.724.t: "아테네, 합병 요구"
 greece.724.d: "그리스 정부가 키프로스 공화국에 그리스와의 합병을 받아들이라고 공식 요구했습니다. 제안은 분명합니다. 자발적으로 참여하면 이행은 원만하고 풍요로울 것입니다. 그리스계 키프로스인의 정서와 튀르키예의 영향력을 고려할 때 수락 확률은 [GRE_GetCyprusAcceptanceChance]입니다. 니코시아 정부는 역사적인 선택에 직면해 있습니다."
 greece.724.a: "그리스와의 합병을 수락합니다"
 greece.724.b: "요구를 거부합니다"
 greece.725.t: "아테네, 북부에 복속 요구"
 greece.725.d: "그리스는 이제 북키프로스로 눈을 돌려, 튀르키예계 키프로스 지도부 또한 아테네와의 합병을 받아들이도록 요구하고 있습니다. 튀르키예계 키프로스의 입장은 더 복잡합니다. 북부는 오랫동안 튀르키예의 군사적 보호와 문화적 유대에 의존해 왔기 때문입니다. 수락 확률은 [GRE_GetNorthernCyprusAcceptanceChance]이며, 튀르키예가 나토의 압박에 물러섰는지 여부와 그리스계 키프로스의 추진력의 깊이에 따라 달라집니다. 북키프로스가 거부하면 섬은 계속 분단된 채로 남고 무력 충돌이 벌어질 가능성이 높아집니다."
 greece.725.a: "그리스와의 합병을 수락합니다"
 greece.725.b: "튀르키예의 보호를 구하고 요구를 거부합니다"
 greece.726.t: "아테네는 어디까지 갈 것인가?"
 greece.726.d: "북키프로스는 자발적인 복속을 거부하고 있으며, 튀르키예계 키프로스 정부는 흡수에 맞서기 위해 튀르키예의 군사적 지원을 구할 것임을 시사했습니다. 이제 그리스는 선택에 직면했습니다. 합병 지지 세력에 대한 비밀 지원을 계속하며 사태가 평화적으로 풀리기를 바라거나, 그리스군을 직접 투입하여 북부를 무력으로 병합하는 것입니다. 직접적인 군사 행동은 나토 탈퇴를 의미합니다. 동맹은 나토 회원국의 세력권에서 영토를 빼앗기 위한 공격 전쟁을 지지하지 않기 때문입니다."
 greece.726.a: "자원병과 물자만 지원합니다"
 greece.726.b: "그리스군을 투입합니다. 북키프로스에 선전포고합니다"
 greece.723.t: "재통일된 키프로스"
 greece.723.d: "두 키프로스 국가가 그리스 국기 아래 통합되었습니다. 남부와 북부 영토는 이제 그리스에 중핵 주로 완전히 편입되었습니다. 1974년 이래 처음으로 섬이 단일한 권위 아래 온전해졌습니다. 이는 수십 년에 걸친 키프로스 민족주의와 그리스 수복주의적 야망의 결실, 마침내 이루어진 엔오시스입니다."
 greece.723.a: "헬레니즘의 역사적인 날입니다"
 GRE_turkey_concedes_tt: "튀르키예가 물러섭니다. 키프로스와 북키프로스에서의 영향력이 크게 줄고, 에게해 긴장이 완화되며, 키프로스 추진력이 상승합니다."
 GRE_turkey_holds_firm_tt: "튀르키예가 양보를 거부합니다. 에게해 긴장이 고조됩니다."
 GRE_gain_cyprus_tt: "키프로스 공화국이 그리스와 합병하여 그리스의 중핵 영토가 됩니다."
 GRE_gain_north_cyprus_tt: "북키프로스가 그리스와 합병하여 그리스의 중핵 영토가 됩니다."
 GRE_enosis_demand_refused_tt: "거부는 국제적 규탄을 부르며 아테네가 어디까지 확전할지 선택하도록 강요합니다. 위기는 전쟁으로 끝날 수도 있습니다."
