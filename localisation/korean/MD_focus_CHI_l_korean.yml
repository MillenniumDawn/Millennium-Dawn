 apply_to_join_as_a_member_desc: "상하이협력기구의 정회원국이 되면 기구의 안보 구조, 경제 투자 경로, 정치 조율 기제에 접근할 수 있습니다. 신청하면 90일간의 심사 기간이 시작되며, 승인될 경우 중국의 현재 중점 노선에 따라 해당하는 회원 등급의 국가 정신이 부여됩니다."
 apply_to_join_as_an_observer_desc: "옵서버 지위는 정회원국의 의무 없이 상하이협력기구 정상회의, 합동 훈련, 경제 조율 체제에 접근할 수 있게 해 줍니다. 신청국은 국가 정신이 부여되기 전에 중국과, 해당되는 경우 러시아의 90일간의 심사 기간을 통과해야 합니다."
 BRI_apply_for_mining_project: "일대일로 광산 프로젝트 신청"
 BRI_apply_for_mining_project_desc: "광산 프로젝트를 신청합니다. 승인을 받으려면 우리 국고에서 40을 지불해야 하며, 그러지 못하면 같은 금액의 중국 대출이 발생합니다."
