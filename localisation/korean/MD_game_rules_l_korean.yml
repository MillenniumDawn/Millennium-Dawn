 GEO_2008_war_behavior: "@GEO Russo-Georgian War"
 GEO_WILL_FOLLOW_OWN_WAY: "독자적 노선"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "Nationalist Georgia follows its own path in the Caucasus and turns on both Armenia and Azerbaijan. Neither neighbour can count on Tbilisi as an ally."
 GEO_WILL_BE_PRO_ARMENIA: "친아르메니아"
