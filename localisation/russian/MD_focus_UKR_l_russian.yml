 UKR_develop_2s22: "Разработка САУ §Y2С22§!"
 UKR_develop_2s22_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_2s22_for_tooltip\n\n\n\n\n\n\n\n\nСамоходная гаубица 2С22 «Богдана» — это украинская 155-мм самоходная гаубица, разработанная Краматорским заводом тяжелого машиностроения для обеспечения Вооруженных сил Украины современными артиллерийскими средствами, соответствующими стандартам НАТО.\nСистема установлена на колесном шасси, что обеспечивает высокую оперативную мобильность и позволяет быстро менять огневые позиции после боя с противником.\n155-мм орудие способно использовать стандартные артиллерийские боеприпасы НАТО, что значительно увеличивает дальность стрельбы и огневую мощь, доступные украинским артиллерийским подразделениям.\nАвтоматизированные системы управления огнем и навигации позволяют экипажу быстро определять параметры стрельбы и поражать цели с большей точностью.\nРазработка «Богданы» представляет собой важный шаг в модернизации украинской артиллерии и переходе к системам вооружения, соответствующим стандартам НАТО."
 UKR_modernize_su25_m1: "Модернизация ударного самолета §YSu-25§!"
 UKR_modernize_su27_1m: "Модернизация истребителя §YSu-27§!"
 UKR_modernize_mig29_mu2: "Модернизация истребителя §YMiG-29 варианта MU2§!"
 UKR_modernize_mig29_mu1: "Модернизированный истребитель §YMiG-29 вариант MU1§!"
 UKR_develop_an_lbl: "Разработать предлагаемый легкий самолет Антонова §YA§!"
 UKR_develop_an_lbl_desc: "Лёгкий самолёт Антонова — проект лёгкого самолёта конструкторского бюро «Антонов», который, как ожидается, будет близок к Як-130. Он предназначен для применения в различных ролях, включая обучение и разведку. Ожидается, что самолёт получит передовую авионику, лёгкий планер и экономичные двигатели, обеспечивающие отличные лётные характеристики и топливную эффективность."
 UKR_develop_an_bfv: "Разработать предлагаемый истребитель Антонова §YA§!"
 ukraine_develop_2s22.1.name: "Разработка САУ §Y2С22 «Богдана»§!"
 ukraine_develop_2s22.1.desc: "В настоящее время технологии развиваются всё дальше, а наше вооружение остаётся прежним.\nНам необходимо разработать собственную самоходную артиллерийскую установку для наших войск."
 ukraine_develop_2s22.1.a: "Предоставьте базовую сумму средств."
 ukraine_develop_2s22.1.b: "Предоставить значительные средства"
 ukraine_develop_2s22.2.name: "Компания KrZVV разработала проект новой самоходной артиллерийской установки."
 ukraine_develop_2s22.2.desc: "Мы проверили и теперь уверены, что КрЗВВ действительно разработал новый проект самоходной артиллерийской установки для нашей армии.\nОднако из-за недостаточного финансирования с нашей стороны они не смогли создать новый ствол и были вынуждены использовать старый советский."
 ukraine_develop_2s22.2.a: "Итак, начнём производство!"
 ukraine_develop_2s22.3.name: "Компания KrZVV разработала проект новой самоходной артиллерийской установки."
 ukraine_develop_2s22.3.desc: "Мы проверили и теперь уверены: КрЗВВ действительно создал для нашей армии новый проект самоходной гаубицы.\nБолее того, благодаря выделенным нами дополнительным средствам они проработали каждый её узел с нуля — новый и надёжный!"
 ukraine_develop_2s22.3.a: "Отлично, давайте начнём производство!"
 UKR_develop_stuhna_p_atgm: "Разработка §YРК-2 «Стугна-П»§!"
 UKR_develop_stuhna_p_atgm_desc: "«Стугна-П», известная под экспортным названием «Скиф», — украинский противотанковый ракетный комплекс (ПТРК), разработанный в начале 2010-х годов конструкторским бюро «Луч».\n«Стугна-П» предназначена для поражения современных бронированных целей с комбинированной навесной или монолитной бронёй, в том числе с динамической защитой.\n«Стугна-П» может поражать как неподвижные, так и движущиеся цели.\nКомплекс работает как на большой дальности — до 5 километров днём, — так и на ближней, от 100 метров."
 UKR_develop_corsar_atgm: "Разработка §YРК-3 «Корсар»§!"
 UKR_develop_corsar_atgm_desc: "РК-3 «Корсар» — украинский лёгкий переносной противотанковый ракетный комплекс, разработанный Государственным киевским КБ «Луч».\n«Корсар», по всей видимости, заменит противотанковые комплексы советской эпохи — 9М113 «Конкурс» и 9К111 «Фагот».\nОн предназначен для поражения неподвижных и движущихся бронированных целей, а также может применяться против огневых точек, легкобронированных объектов и вертолётов.\nСтрельба ведётся как со станка, так и с бруствера окопа. Наведение — по лазерному лучу."
 UKR_modernize_stuhna_p_atgm: "Модернизация §YРК-2 «Стугна-П»§!"
 UKR_modernize_stuhna_p_atgm_desc: "Мы можем и дальше модернизировать ПТРК «Стугна-П», чтобы он лучше отвечал нынешним угрозам."
 UKR_develop_bulava_atgm: "Разработка §Y«Булава»§!"
 UKR_develop_bulava_atgm_desc: "Перспективный противотанковый комплекс с режимом «выстрелил — забыл».\nВся информация на данный момент засекречена."
 UKR_develop_stuhna_p_flag: "Принято решение о разработке РК-2 «Стухна-П»."
 UKR_develop_corsar_flag: "Принято решение о разработке РК-3 Корсар."
 UKR_develop_kba27: "Разработка самоходной артиллерии КБА-27"
 UKR_develop_kba27_desc: "КБА-27 — украинская 152-мм гаубица, созданная на основе советской 2А61 «Пат-Б». В опытном варианте орудие установили на плавающий транспортёр ПТС-2, соединив мощь тяжёлой артиллерии с высокой подвижностью и способностью плавать. Дальнейшая доработка может превратить этот прототип в полноценную самоходную артиллерийскую установку."
 UKR_modernize_stuhna_p_flag: "Принято решение о модернизации РК-2 «Стухна-П»."
 UKR_develop_baryer_s: "Разработать §Y«Барьер-С»§!"
 UKR_develop_baryer_s_desc: "«Барьер-С» — украинский противотанковый ракетный комплекс (ПТРК), разработанный КБ «Луч» на основе ПТРК «Штурм-С».\nКомплекс предназначен для поражения современных бронированных целей с комбинированной навесной или монолитной бронёй, в том числе с динамической защитой."
 UKR_develop_nota_flag: "Завершено принятие решения §YDevelop «Нота»§!"
 UKR_develop_nota: "Разработка ОБТ §YОбъект 477А1 «Нота»§!"
 UKR_modernize_nota: "Модернизация §YОбъект 477А1 «Нота»§!"
 ukraine_armed_forces_tragedy_event.1.name: "Трагедия с ракетой в Бровари"
 ukraine_armed_forces_tragedy_event.1.desc: "Трагедия в Броварах 20 апреля 2000 года — это несчастный случай, произошедший в городе Бровары Киевской области, когда учебно-тренировочная ракета класса «земля-земля» комплекса «Точка-У», запущенная во время военных учений с полигона Гончаровка, отклонилась от намеченного курса и, пролетев 90 км, попала в девятиэтажный жилой дом.\nРакета не имела взрывной части, в результате ракетного удара погибли три человека, еще пять получили ранения.\n\nВ течение четырех дней после катастрофы, до 23 апреля, Министерство обороны Украины во главе с Александром Кузмуком отказывалось признать, что именно их ракета попала в жилой дом."
 ukraine_armed_forces_tragedy_event.1.a: "Это была не наша ракета."
 ukraine_armed_forces_tragedy_event.2.name: "Самолет «Сибирьские авиалинии» рейса 1812 сбит."
 ukraine_armed_forces_tragedy_event.2.desc: "Рейс 1812 авиакомпании «Сибирь» — коммерческий рейс, предположительно сбитый ВВС Украины над Черным морем 4 октября 2001 года по пути из Тель-Авива (Израиль) в Новосибирск (Россия).\nНа борту самолета, советского Туполева Ту-154, находились 66 пассажиров и 12 членов экипажа. Большинство пассажиров были израильтянами, навещавшими родственников в России. Выживших не было.\nКатастрофа произошла из-за ракеты, выпущенной во время совместных украинско-российских военных учений по противовоздушной обороне на контролируемом Россией полигоне 31-го научно-исследовательского центра Черноморского флота России на мысе Опук недалеко от города Керчь в Крыму."
 ukraine_armed_forces_tragedy_event.2.a: "Нам необходимо провести расследование."
 ukraine_armed_forces_tragedy_event.3.name: "Катастрофа на авиашоу в Снкиливе"
 ukraine_armed_forces_tragedy_event.3.desc: "Катастрофа на авиашоу в Скныливе произошла 27 июля 2002 года, когда самолет Су-27УБ ВВС Украины под управлением Владимира Топонара (из пилотажной группы «Украинские соколы») и Юрия Егорова врезался в зрителей во время показательных выступлений на аэродроме Скнылив под Львовом.\nВ результате аварии погибли 77 человек и 543 получили ранения. Это самая смертоносная авиакатастрофа в истории авиашоу.\nПосле катастрофы пилоты заявили, что полученная ими схема полета отличалась от фактической."
 ukraine_armed_forces_tragedy_event.3.a: "Невероятная трагедия"
 UKR_Brovary_Missile_Tragedy_Flag: "Произошла ракетная трагедия в Бровари."
 UKR_Tu154_Air_Tragedy_Flag: "Рейс 1812 авиакомпании «Сибирь» был сбит."
 ukraine_warehouse_explosions.1.name: "Плохие условия на складах боеприпасов"
 ukraine_warehouse_explosions.1.desc: "Недавние реформы Вооруженных Сил выявили серьезные недостатки в хранении и безопасности складов боеприпасов по всей Украине. Устаревшие объекты и слабый контроль представляют значительный риск несчастных случаев. Правительство должно решить, как устранить эту проблему."
 ukraine_warehouse_explosions.1.a: "Полное техническое обслуживание всех складов."
 ukraine_warehouse_explosions.1.b: "Частичное техническое обслуживание основных депо"
 ukraine_warehouse_explosions.1.c: "Игнорируйте проблему"
 ukraine_warehouse_explosions.2.name: "Взрыв на Артемовском складе боеприпасов"
 ukraine_warehouse_explosions.2.desc: "Недавно в городе Артемовске, Артемовском районе Донецкой области, произошёл неожиданный и масштабный инцидент. Пожар начался на складах 52-й механизированной бригады, где хранилось около трёх тысяч тонн артиллерийских боеприпасов. К сожалению, после первоначального возгорания последовали мощные взрывы. Необходимо принять меры по очистке территории и предотвращению подобных инцидентов в будущем."
 ukraine_warehouse_explosions.2.a: "Полная реконструкция депо"
 ukraine_warehouse_explosions.2.b: "Направить комиссию на расследование"
 ukraine_warehouse_explosions.2.c: "Игнорируйте проблему"
 ukraine_warehouse_explosions.3.name: "Взрыв на складе боеприпасов в Новобогдановке."
 ukraine_warehouse_explosions.3.desc: "Недавно вблизи села Новобогдановка Мелитопольского района Запорожской области произошёл неожиданный и масштабный инцидент. 6 мая 2004 года взорвалось почти 90 тысяч боеприпасов для систем «Град», «Смерч» и «Ураган». Осколки снарядов разлетелись на 40 км от эпицентра пожара. Тогда пришлось эвакуировать более полутора тысяч человек. Пять человек погибли, более 80 были госпитализированы с различными травмами, более 20 семей остались без крова. Взрыв повредил 4 км газопровода. Ущерб составил 3 миллиарда 752 миллиона гривен."
 ukraine_warehouse_explosions.3.a: "Полная реконструкция депо"
 ukraine_warehouse_explosions.3.b: "Направить комиссию на расследование"
 ukraine_warehouse_explosions.3.c: "Игнорируйте проблему"
 ukraine_warehouse_explosions.4.name: "Взрыв на складе боеприпасов в Цвитохе."
 ukraine_warehouse_explosions.4.desc: "Недавно вблизи села Цвитоха Славутского района Хмельницкого района произошел неожиданный и масштабный инцидент. В Хмельницком районе на арсенале № 47 произошел пожар с взрывом боеприпасов. На складе находилось 52,9 обычных вагонеток с боеприпасами (снаряды малого калибра – 23 и 30 мм, гранаты для подствольных гранатометов), которые в результате пожара взорвались. Осколки разлетелись в радиусе 100-150 м."
 ukraine_warehouse_explosions.4.a: "Полная реконструкция депо"
 ukraine_warehouse_explosions.4.b: "Направить комиссию на расследование"
 ukraine_warehouse_explosions.4.c: "Игнорируйте проблему"
 ukraine_warehouse_explosions.5.name: "Второй взрыв на складе боеприпасов в Новобогдановке"
 ukraine_warehouse_explosions.5.desc: "Инцидент со взрывами произошел уже во второй раз вблизи села Новобогдановка Мелитопольского района Запорожской области. 23 июля 2005 года в 17:20 загорелся склад на 257-й базе хранения боеприпасов. В 20:54 детонация снарядов прекратилась. Пять человек получили ранения. Причиной взрывов названа высокая температура воздуха, которая, предположительно, вызвала самовозгорание дымовой мины."
 ukraine_warehouse_explosions.5.a: "Полная реконструкция депо"
 ukraine_warehouse_explosions.5.b: "Направить комиссию на расследование"
 ukraine_warehouse_explosions.5.c: "Игнорируйте проблему"
 ukraine_warehouse_explosions.6.name: "Третий взрыв на складе боеприпасов в Новобогдановке"
 ukraine_warehouse_explosions.6.desc: "Инцидент со взрывами произошел уже в третий раз вблизи села Новобогдановка Мелитопольского района Запорожской области. 19 августа 2006 года в 14:15 произошел еще один серьезный взрыв. Сгорело около трех гектаров склада. Эвакуированы 1500 местных жителей, 4000 человек размещены в убежищах. В результате взрыва пострадали 428 человек и 96 единиц техники. 4 человека получили ранения."
 ukraine_warehouse_explosions.6.a: "Полная реконструкция депо"
 ukraine_warehouse_explosions.6.b: "Направить комиссию на расследование"
 ukraine_warehouse_explosions.6.c: "Игнорируйте проблему"
 ukraine_warehouse_explosions.7.name: "Взрыв на складе боеприпасов в Лозове"
 ukraine_warehouse_explosions.7.desc: "Неожиданное и масштабное происшествие случилось недавно в городе Лозовая Лозовского района Харьковской области. 27 августа 2008 года в 16:20 загорелся склад 61-го арсенала Южного оперативного командования Сухопутных войск. На арсенале войсковой части № 0829 площадью около 500 гектаров хранилось 95 тысяч тонн снарядов. Примерно через два часа начались взрывы. Всех жителей в радиусе 3 км от складов эвакуировали."
