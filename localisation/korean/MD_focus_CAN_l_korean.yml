 CAN_ground_military_one_desc: ""
 CAN_ground_military_two_infantry: "캐나다 지상군 - 보병 중심"
 CAN_ground_military_two_infantry_desc: ""
 CAN_ground_military_three_infantry: "캐나다 지상군 - 보병 중심"
 CAN_ground_military_three_infantry_desc: ""
 CAN_ground_military_two_armored: "캐나다 지상군 - 기갑 중심"
 CAN_ground_military_two_armored_desc: ""
 CAN_ground_military_three_armored: "캐나다 지상군 - 기갑 중심"
 CAN_ground_military_three_armored_desc: ""
 CAN_overburdened_economy: "과도한 경제적 부담"
 CAN_overburdened_economy_desc: "1990년대 후반 캐나다 예산은 비효율적인 보조금과 과다 지출로 과중한 부담을 안고 있었습니다. 낡은 정책을 개정하고 보조금을 재편하면 이 문제를 완화할 수 있을 것입니다."
 CAN_a_culture_shift: "문화 변동"
 CAN_a_culture_shift_desc: ""
 CAN_native_policy_idea: "오래된 토착 원주민 정책"
 CAN_native_policy_idea_desc: ""
 CAN_native_policy_society_idea: "원주민 통합 정책"
 CAN_native_policy_society_idea_desc: ""
 CAN_native_policy_destroy_idea: "반 원주민 정책"
 CAN_native_policy_destroy_idea_desc: ""
 CAN_true_neutrality: "진정한 중립성"
 CAN_true_neutrality_desc: "스위스인들은 완전히 잘못 알고 있습니다. 캐나다식 중립 체제야말로 진정한 중립입니다."
 CAN_rejected_quebec_proposal_flag: "퀘벡의 제안 거절"
 canada.5.t: "프랑스계 캐나다인의 분노!"
 canada.5.d: "The Québécois are angered by the central government's actions. They have begun to form mild and small-scale strikes around Quebec and it is threatening to spill over into the French Canadian enclaves in the other provinces. We must address this before it becomes even more of an issue."
 canada.5.a: "이 문제를 해결해야한다!"
 canada.5.b: "아무것도 하지마라"
 canada.6.t: "프랑스계 캐나다인들의 시위"
 canada.6.d: "French Canadians have started to stage protests against the actions of the Canadian Government. What must we do regarding that?"
 canada.6.a: "항의 내용을 고려해보자"
 canada.6.b: "Disallow these protests"
 canada.7.t: "프랑스계 캐나다인들의 반란"
 canada.7.d: "프랑스계 캐나다인들이 반란을 일으키기 직전입니다. 어떻게 대응할까요?"
 canada.7.a: "상황을 개선시켜보자."
 canada.7.b: "진압하라!"
 canada.8.t: "더 많은 자치권 요구하는 프랑스계 캐나다인들"
 canada.8.d: "프랑스계 캐나다인들은 정부로부터 더 많은 자치권을 요구하고 있습니다. 어떻게 대응할까요?"
 canada.8.a: "자치권을 줘버려라."
 canada.8.b: "We shouldn't..."
 canada.20.t: "새로운 북미아메리카 석유 협상"
 canada.20.d: "Canada has proposed a comprehensive revision to NAFTA's energy provisions, dubbed the \"New North American Oil Deal.\" This agreement would restructure oil trade regulations between our nations, potentially offering more favorable terms for domestic energy producers while maintaining continental energy security. The Canadian government argues this modernization is necessary to adapt to changing energy markets and geopolitical realities."
 canada.20.a: "Accept the Deal"
 canada_news.1.t: "북아메리카 석유 협약"
 canada_news.1.d: "Following intensive negotiations, Canada and the United States have successfully amended NAFTA's energy chapter. The revised agreement provides enhanced protections for North American oil producers, streamlines cross-border energy trade, and establishes new frameworks for continental energy cooperation in an increasingly competitive global market."
 canada_news.1.a: "미국에게 감사를 표한다!"
 canada_news.1.b: "음... 석유라."
 canada_news.1.c: "이게 괜찮은 걸로 보이나?"
 canada.100.t: "'에어 캐나다'의 '캐나디안 항공' 합병"
 canada.100.d: "Canadian Airlines is a struggling Canadian airline that, due to economic hardships, is no longer able to compete with its rival Air Canada.\n\nAir Canada bureaucrats have now presented a plan to integrate their former main rival into the company. The plan seems to be comprehensive and able to save most of the jobs that are threatened by Canadian Airlines possibly going bankrupt - the takeover, to be agreed upon on January 4th, 2000, is to go into effect on January 1st, 2001."
 canada.100.a: "좋은 제안같군."
 canada.100.b: "우리의 독점권을 유지해야한다."
 canada.501.t: "캐나다 문화부"
 canada.501.d: "The Canadian Ministry of Culture has been established."
 canada.501.a: "그래, 바로 그거야!"
 canada.502.t: "캐나다 정제 및 정유 산업 보조금"
 canada.502.d: "우리는 수년 동안 전국의 석유 기업들에 보조금을 지급해 왔습니다. 의회는 선코어나 임페리얼 오일 같은 여러 국가 기업들에 보조금을 지급할 수 있도록 하는 추가 입법을 통과시켰습니다."
 canada.502.a: "정유 회사를 지원해라!"
 canada.502.b: "솔직히, 다시 한번 고려해볼 필요가 있다"
 canada.504.t: "캐나다 기반시설"
 canada.504.d: "Municipalities own the core infrastructure assets that are critical to the quality of life of Canadians and the competitiveness of our country. Almost 60% of Canada's core public infrastructure is owned and maintained by municipal governments. According to survey results, the total value of core municipal infrastructure assets is estimated at $1.1 trillion dollars, or about $80,000 per household. We must start moving towards a new federally based infrastructure system."
 canada.504.a: "대규모 투자"
 canada.504.b: "중간 규모 투자"
 canada.504.c: "소규모 투자"
 canada.520.t: "현상 유지"
 canada.520.d: "캐나다가 국가로 세워진 이래 프랑스계와 영국계 구성원들은 공존해 왔습니다. 우리가 이 현상 유지를 지키는 것이 중요하며, 그렇지 않으면 위대한 우리나라의 안정이 무너지고 현재의 캐나다는 지탱하지 못할 것입니다."
 canada.520.a: "It's the Right Move"
 canada.521.t: "The English Empowered"
 canada.521.d: "프랑스어권 주민의 권리를 침해하면서 정부 내 영어권 부문에 권한을 부여하면 우리의 정체성에 대한 더 큰 통제력을 얻을 수 있습니다. 그들을 폐쇄하라!"
 canada.521.a: "A Dark Change"
 canada.522.t: "A New French Government"
 canada.522.d: "우리는 퀘벡의 선례를 따라 퀘벡인들이 정부에서 더 큰 역할을 맡도록 하는 것이 우리에게 최선이라고 결정했습니다."
 canada.522.a: "A New Destiny"
 canada.600.t: "캐나다까지 파장을 불러일으킨 미국의 경기 침체"
 canada.600.d: "대불황이 미국을 휩쓸고 있으며 그 효과는 이제 캐나다에서도 느껴지고 있습니다."
 canada.600.a: "Unfortunate"
 canada.601.t: "경기 침체의 종료"
 canada.601.d: "캐나다가 마침내 미국발 경기 침체에서 회복했습니다. 우리의 탄탄한 경제에 영광스러운 날입니다!"
 canada.601.a: "알겠다"
 canada.700.t: "퀘벡에서의 폭동"
 canada.700.d: "퀘벡인들이 폭동을 일으키며 정부에 양보를 요구하기 시작했습니다. 중앙 정부의 최근 정책 변화가 퀘벡인들 사이에 상당한 불안을 일으켰습니다."
 canada.700.a: "탄압해라"
 canada.700.b: "Pay Concessions"
 canada.700.c: "정치적 양보"
 canada.701.t: "평화적인 반정부 시위자"
 canada.701.d: "퀘벡과 몬트리올 전역에서 퀘벡인들이 최근 법률 변경에 맞서 피켓 시위를 시작하였습니다."
 canada.701.a: "시위를 해산하라."
 canada.701.b: "돈을 좀 쥐어주자"
 canada.701.c: "Announce Support for them"
 canada.702.t: "반정부 연설자"
 canada.702.d: "한 지역 퀘벡 연설가가 불쑥 나타나 정부를 훼손하려 하고 있습니다. 그를 어떻게 해야 합니까?"
 canada.702.a: "계속 지껄이게 나둬라. 재밌는걸."
 canada.702.b: "그를 체포해라"
 canada.703.t: "친정부 연설자"
 canada.703.d: "퀘벡의 한 지역 연설가가 캐나다가 퀘벡을 필요로 하는 만큼 퀘벡도 캐나다를 필요로 한다고 연설했습니다. 그는 공생 관계를 강조했습니다. 이 연설가를 지지해야 합니까?"
 canada.703.a: "Endorse them publicly"
 canada.703.b: "그들을 인정한다"
 canada.703.c: "Reject his frivolous statements"
 canada.704.t: "정부를 지지하는 퀘벡"
 canada.704.d: "일부 여론조사에서 현 정부가 퀘벡 주민들 사이에서 높은 지지를 받는 것으로 나타났습니다"
 canada.704.a: "좋은 소식이군"
 keystonepipeline_can.0.t: "키스톤 파이프라인 계획의 착수"
 keystonepipeline_can.0.d: "우리는 파이프라인 건설 계획을 시작해야 합니다. 우리 스스로 건설할지, 미국의 도움을 받아 건설할지 선택해야 합니다."
 keystonepipeline_can.0.a: "미국의 계획을 따르자"
 keystonepipeline_can.0.b: "우리 스스로 하자"
 keystonepipeline_can.0.c: "미국에 파이프라인 계획을 요청"
 keystonepipeline_can.1.t: "파이프라인 건설 비용은 90억으로 예상됨"
 keystonepipeline_can.1.d: "미국의 도움없이 프로젝트를 진행하는데는 약 90억 달러의 비용이 들 것으로 예상됩니다. 계속 할까요?"
 keystonepipeline_can.1.a: "우리는 해야한다!"
 keystonepipeline_can.1.b: "우리는 다른 곳에 돈이 필요하다."
 keystonepipeline_can.2.t: "파이프라인 건설 비용은 20억으로 예상됨"
 keystonepipeline_can.2.d: "이미 완료되어있는 미국의 파이프라인으로 인해 캐나다 측 파이프라인을 건설하는데 드는 비용이 현저하게 낮아졌습니다. 파이프라인을 완공하는데 약 20억 달러가 필요할 것으로 예상됩니다."
 keystonepipeline_can.3.t: "파이프라인 건설 비용은 50억으로 예상됨"
 keystonepipeline_can.3.d: "미국이 우리의 요청에 응답했습니다. 그들은 우리의 파이프라인 건설계획에 도움을 주기로 했습니다. 파이프라인을 완공하기 위해 총 50억 달러가 필요할 것으로 예상합니다. 우리는 미국의 도움으로 40억 달러를 절약한 것으로 추산됩니다. 그 돈이면 우리가 메이플 시럽 1억 1,400만 리터를 더 구입할 수 있습니다."
 keystonepipeline_can.4.t: "키스톤 파이프라인 완공"
 keystonepipeline_can.4.d: "매우 길고 비용이 많이 든 시간이 지난 끝에 마침내 송유관을 완공했습니다."
 keystonepipeline_can.4.a: "마침내"
 keystonepipeline_usa.0.t: "파이프라인 계획에 우리의 도움을 요청하는 캐나다"
 keystonepipeline_usa.0.d: "Canada has reached out asking for our assistance in planning the Keystone Pipeline extension."
 keystonepipeline_usa.0.a: "우리는 우리 동맹을 도와야합니다."
 keystonepipeline_usa.0.b: "우리는 국고에 여유자금이 없다."
 canada_md_politics.2.t: "노란 리본 작전"
 canada_md_politics.2.d: "뉴욕시의 세계무역센터에 대한 조직적인 공격이 있었던 것으로 보입니다. 공중에는 여전히 다른 위협이 도사리고 있을 수 있으며, 이로 인해 미국은 영공을 폐쇄했습니다. 잠재적 표적에 대한 추가 공격을 막기 위해 우리도 그 뒤를 따라야 합니다. 캐나다 교통부와 내브 캐나다는 미국 영공과 우리 영공을 비행하는 모든 항공기를 착륙시키기 위해 비상 조치를 발동할 것입니다. 조종사들은 대도시 인근을 제외한 가장 가까운 비행장에 착륙해야 합니다. 모든 항공기는 착륙 시 검색을 받아야 하며, 수천 명의 승객이 세관을 통과해야 합니다. 발이 묶인 모든 이에게 음식과 숙소를 제공하려면 대중의 지원이 필요합니다. 이는 분명 대규모 사업이 될 것입니다."
 canada_md_politics.2.a: "우리는 함께 일어설 것이다"
 canada_md_politics.2.b: "미국에게 우리가 보낼 수 있는 모든 것들을 보내라"
 canada_md_politics.3.t: "또 한 번의 침엽수 목재 분쟁"
 canada_md_politics.3.a: "세계무역기구에 제소하면 손쉬운 승리로 이어질 것이다."
 canada_md_politics.3.b: "무역 전쟁을 시작하기보다 그들과 새로운 합의를 모색해 볼 수 있다."
 canada_md_politics.4.t: "암흑에 뒤덮힌 온타리오"
 canada_md_politics.4.d: "온타리오 주민 1,000만 명과 미국인 4,500만 명이 정전을 겪은 것으로 보입니다. 우리 집계가 맞는다면 이는 세계 역사상 두 번째로 광범위한 대정전이 될 것으로 보입니다. 그러나 지금은 통계를 제쳐 두어야 합니다. 윈저에서 오타와에 이르는 도시들이 지원을 필요로 합니다. 특히 토론토는 도시의 모든 대중교통이 멈추면서 어려움을 겪고 있습니다. 어니 이브스 주총리가 비상사태를 선포했으며, 피해 지역에 곧 지원이 도착할 것으로 기대됩니다. 다행히 몇몇 의로운 시민들이 경찰이 도착할 때까지 교통을 정리하고 사람들을 안전한 곳으로 대피시키는 책임을 이미 맡고 나섰습니다. 우리는 미국과 협력하여 무슨 일이 있었는지 조사하고 있으나, 현재로서는 원인이 불분명합니다."
 canada_md_politics.4.a: "미국인들 탓이다"
 canada_md_politics.4.b: "우리는 기반시설을 개발할 필요가 있습니다"
 canada_md_politics.5.t: "스폰서십 스캔들"
 canada_md_politics.5.d: "1996년 자유당은 주권주의 정서에 맞서기 위해 퀘벡 산업에 대한 캐나다 정부의 기여를 홍보하는 스폰서십 프로그램을 시작했습니다. 그러나 이 돈이 제대로 쓰이지 않은 것으로 보입니다. 감사원장 실라 프레이저가 이 프로그램에 대한 보고서를 막 마무리했으며, 2억 5천만 달러 규모의 프로그램 중 거의 절반이 자유당에 우호적인 기업들에 쓰인 사실이 국민에게 드러났습니다. 이 돈의 일부는 선거 운동에 쓰이도록 자유당에 다시 기부되기까지 했습니다. 폴 마틴 총리는 당의 인기에 미칠 타격을 줄이기 위해 할 수 있는 모든 일을 하고 있으나, 다음 선거는 이미 결판이 난 것처럼 보입니다."
 canada_md_politics.5.a: "합의에 도달하고 이러한 프로그램을 금지하는 법안을 제정할 수 있다."
 canada_md_politics.5.b: "자유당은 늘 어떤 스캔들에 휘말리는 것 같다."
 canada_md_politics.6.t: "북서항로의 미국 핵잠수함"
 canada_md_politics.6.d: "USS 샬럿호는 진주만에서 북쪽 항로를 거쳐 버지니아에 도착한 것으로 알려졌다. 일반적으로 미 해군은 우리의 관심사가 아닙니다. 그러나 이 잠수함이 취한 경로는 북서항로를 직선으로 통과합니다. 우리는 이 지역을 우리 내부 수역의 일부로 보고 있지만 미국은 이러한 의견을 공유하지 않습니다. 이는 앞으로도 계속해서 증가할 문제를 제시합니다. 더 많은 국가들이 항해가 쉬워짐에 따라 북서항로를 운송 경로로 사용하기를 원할 것입니다. 러시아와 같은 북부 라이벌들도 우리 북부 해역에 자유롭게 접근할 수 있다고 느낄 수도 있습니다. 이 일은 끝나야 합니다."
 canada_md_politics.6.a: "우리 영해에 외국 국가가 존재하는 것을 용납하지 않을 것이다."
 canada_md_politics.6.b: "넘어가기로 한다."
 canada_md_politics.7.t: "토론토 18인 사건 (온타리오 테러 공모 사건)"
 canada_md_politics.7.d: "광역 토론토 지역에서 끔찍한 테러 음모가 발견되었습니다. 대테러 공습으로 토론토 18세로 불리는 성인 14명과 청소년 4명이 체포되었습니다. 이들 모두 온타리오 남부 전역에서 조직적인 공격을 계획한 혐의로 기소되었습니다. 이러한 공격에는 문화 명소 폭격, 토론토 거리의 군중에 대한 총격, 전력망 제거, 캐나다 방송 센터 침공, 캐나다 보안 정보국 본부를 습격하고 의회 언덕에 대한 공격까지 포함되었을 것입니다. 아마도 가장 충격적인 것은 생방송으로 총리와 다른 정치인들을 참수하려는 그들의 목표였을 것입니다. 우리는 항상 대중에게 두려움의 희생양이 되지 않도록 상기시킵니다. 그러나 이와 같은 공격이 원격으로라도 가능할 가능성은 두렵습니다."
 canada_md_politics.7.a: "이 비정한 괴물들의 시민권을 박탈한다"
 canada_md_politics.7.b: "중동에서의 우리 행동이 국내에서 재앙으로 이어질 수 있다."
 canada_md_politics.8.t: "메두사 작전 개시"
 canada_md_politics.8.d: "아프가니스탄 칸다하르 주를 둘러싼 투쟁이 계속되고 있으며, 우리는 NATO 역사상 가장 큰 지상전을 이끌려 하고 있습니다. 우리는 아프가니스탄, 미국, 영국, 덴마크, 네덜란드 동맹군과 함께 이 전투에 임합니다. 이 작전은 분명 성공하겠지만, 우리 병력은 탈레반에 대해 계속 경계해야 합니다. 우리와 맞서는 것은 이 땅을 위해 죽을 각오가 된 수천 명의 무장 세력입니다. 그토록 빨리 그들을 이 지역에서 완전히 몰아낼 수 있을 가능성은 낮습니다. 이 때문에 많은 캐나다인이 이 분쟁에서 우리 측이 입을 수 있는 사상자를 우려하고 있습니다. 결국 사망자 수는 여기서 늘어나기만 할 것입니다. 이 작전이 얼마나 순조롭게 진행되는가가 전쟁에 대한 대중의 인식에 영향을 미칠 것입니다."
 canada_md_politics.8.a: "우리는 이 싸움을 끝내야하며, 그 말은 즉 탈레반을 제거해야한다는 뜻입니다."
 canada_md_politics.8.b: "이제부터는 우리 손에 캐나다인의 피만 더 묻을 뿐이다."
 canada_md_politics.9.t: "퀘벡인 국민 결의안"
 canada_md_politics.9.d: "스티븐 하퍼 총리가 하원에 퀘벡과 관련된 결의안을 제출했습니다. 이 결의안은 하원이 퀘벡인이 통합된 캐나다 안에서 하나의 국민을 이룬다는 점을 인정할 것을 촉구합니다. 각 정당은 이 결의안에 대해 큰 지지를 보이는 듯하지만, 캐나다 국민의 의견은 반으로 나뉘어 있습니다. 어떤 이들은 이것이 분리주의 정서를 되살릴 뿐이며 퀘벡이 특별 대우를 받을 자격이 없다고 말합니다. 다른 이들은 퀘벡 주를 독특하게 만드는 점들을 인정함으로써 캐나다와 퀘벡의 관계가 긍정적으로 나아가는 한 걸음으로 봅니다. 어느 쪽이든 하원의 결의안은 결과와 상관없이 법에 실질적인 효력이 없습니다."
 canada_md_politics.9.a: "캐나다는 나뉠 수 없으며, 퀘벡도 다른 주와 같다."
 canada_md_politics.9.b: "퀘벡의 차이는 인정되고 존중받아야 한다."
 canada_md_politics.10.t: "원주민 행동의 날"
 canada_md_politics.10.d: "전국의 캐나다 퍼스트 네이션은 연방 정부와의 관계에 점점 환멸을 느끼고 있습니다. 오늘 그들은 자신들이 직면한 문제에 관심을 모으기 위해 첫 전국 항의의 날을 선포했습니다. 여러 주요 도시의 주요 교통로가 봉쇄되었습니다. 그곳의 활동가들은 토지 청구권, 보호구역의 삶의 질, 그들에게 제공되는 사회 서비스 프로그램 문제에 대한 조치를 촉구하고 있습니다. 가장 시급한 우려 중 하나는 스티븐 하퍼 총리가 켈로나 협정을 파기한 것입니다. 이 협정은 정부 지원 프로그램을 통해 교육, 고용, 생활 여건을 개선하고자 연방 정부와 원주민 사이에 맺어진 일련의 합의였습니다. 이 협정은 법적 구속력이 없었으나, 어쨌든 원주민 관계에서는 후퇴입니다."
 canada_md_politics.10.a: "켈로나 협정을 부활시키고 이번에는 이행을 약속한다."
 canada_md_politics.10.b: "이들은 세상이 변했다는 것을 받아들여야 한다."
 canada_md_politics.11.t: "캐나다 왕립 기마경찰, 보수당 본부 압수수색"
 canada_md_politics.11.d: "보수당은 지난 선거에서 정당이 광고에 사용할 수 있는 자금 한도를 불법적으로 초과했다는 의혹을 받고 있습니다. 정당 내 여러 조직 간의 거래 방식에 관한 법률에서 몇 가지 허점이 발견되었고, 보수당은 이를 이용해 전국 규모가 아닌 지역 광고에 막대한 자금을 흘려 보냈습니다. 캐나다 선거관리청은 원래 득표수에 따라 각 선거구에서 정당의 비용 일부를 환급해야 하지만, 이번 스캔들 때문에 이를 보류했습니다. 오늘 캐나다 왕립 기마경찰은 불법 자금과 관련된 문서를 찾기 위해 보수당 본부를 급습했습니다. 자유당과 신민주당(NDP)은 모두 이를 보수당이 불러온 부패를 공격할 기회로 삼고 있습니다."
 canada_md_politics.11.a: "캐나다 선거관리청과 신속히 사태를 매듭짓고 대중의 시선에서 벗어난다."
 canada_md_politics.11.b: "이 추세로는 다음 선거에서 이길 방법이 없다."
 canada_md_politics.13.t: "골든 골 (The Golden Goal)"
 canada_md_politics.13.d: "2010년 동계 올림픽 폐막일이며, 모든 이의 시선이 마지막 경기에 쏠렸습니다. 캐나다 남자 하키 팀이 결승에 올랐습니다. 금메달을 가로막는 상대는 오직 미국뿐이었습니다. 캐나다는 2대 0으로 좋은 출발을 보였지만, 미국은 3피리어드 종료 25초를 남기고 동점을 만들었습니다. 서든데스가 시작되자 경기장 전체가 긴장에 휩싸였습니다. 마침내 자롬 이긴라가 시드니 크로스비에게 패스했고, 크로스비는 결승골을 넣었습니다. 캐나다 전역의 도시들이 마치 온 나라가 하나가 된 듯 즉시 환호성으로 들끓었습니다."
 canada_md_politics.13.a: "역사책에 남을 일이다"
 canada_md_politics.13.b: "낭비된 돈이다"
 canada_md_politics.14.t: "G20 정상회담 폭동"
 canada_md_politics.14.d: "G20이 2010년 첫 정상회의를 위해 토론토에 모였고, 모든 것이 순조롭게 진행되도록 되어 있었습니다. 캐나다는 세계 금융 위기에서 빠르게 회복했고, 이는 회의 기간 중 몇 가지 훌륭한 기회로 이어졌습니다. 그러나 행사장 밖에서 큰 문제가 발생했습니다. G20 정상회의는 많은 정치 활동가들의 관심을 끄는 듯합니다. 세계에서 가장 영향력 있는 지도자들이 한곳에 모이므로 이들에게 자신의 목소리를 전달할 기회이기 때문입니다. 수천 명이 거리에 나와 투명성과 여론에 대한 배려의 부족이라고 여겨지는 점에 평화적으로 항의했습니다. 그 가운데 폭도들은 대규모 군중을 이용해 건물을 파손하고 상점을 약탈했으며 일부 차량에 불을 질렀습니다. 많은 진압 경찰이 무질서를 끝내기 위해 투입되었으나, 지휘 체계의 부재로 무고한 행인들이 연루된 폭력적 충돌이 일부 발생했습니다. 천 명이 넘는 사람들이 구금되었고, 이는 캐나다 역사상 최대 규모의 집단 체포 기록입니다."
 canada_md_politics.14.a: "수치스럽다"
 canada_md_politics.14.b: "우리의 보안이 없었다면 더 나빠졌을 것이다"
 canada_md_politics.15.t: "유엔 안보리 좌석을 얻기 위한 경쟁을 그만두는 캐나다"
 canada_md_politics.15.d: "캐나다는 국제연합의 창립 회원국이며 지금도 가장 적극적으로 참여하는 나라 중 하나입니다. 이러한 참여에는 한때 유엔 안전보장이사회 비상임이사국 선거에서 단 한 번도 빠짐없이 모두 당선된 기록이 포함되었습니다. 우리의 이 기록이 방금 깨졌습니다. 1차 투표에서 독일이 득표수에서 우리를 압도했고, 2차 투표에서는 포르투갈에 패했습니다. 우리는 이 시점에서 철회하기로 결정했고, 3차 투표에서 포르투갈의 이사국 지위가 확정되었습니다. 많은 캐나다인이 이 패배에 속상해하며 그 원인을 보수당 행정부의 외교 정책 탓으로 돌립니다. 최근 캐나다는 NATO 동맹국들과 함께 세계 무대에서 평소보다 훨씬 많이 개입해 왔습니다. 특히 미국을 따라 해외 땅에서 벌어진 여러 전투에 뛰어들었습니다. 어쩌면 우리의 접근 방식을 바꿔야 할지도 모릅니다."
 canada_md_politics.15.a: "우리는 더 안전한 세계를 위해 우리의 가치를 지키고 있을 뿐이다"
 canada_md_politics.15.b: "이것은 우리의 명성에 대한 공격이다!"
 canada_md_politics.16.t: "오렌지 물결 (An Orange Wave)"
 canada_md_politics.16.d: "다가오는 선거에 대한 최근 여론조사에서 신민주당(NDP)이 자유당보다 더 많은 지지를 얻은 것으로 나타났습니다. 이 당은 창당 이래 줄곧 3위였으나, 이제 정부를 구성할 수 있는 거리에 들어선 듯합니다. 이는 카리스마 있는 당수 잭 레이턴의 공으로 돌릴 수 있습니다. 그는 진보적 대의의 옹호자이며, 지금까지 가장 강력하게 총리직을 향한 행보를 이어 왔습니다. 많은 신민주당 후보는 그의 비전에 감화된 다른 정당 출신의 베테랑 정치인들입니다. 전국의 캐나다인들도 그의 공약에 폭넓은 지지를 보내고 있습니다. 이는 보수당이나 자유당이 아닌 세력이 구성하는 캐나다 역사상 최초의 정부가 될 수도 있습니다."
 canada_md_politics.16.a: "이 희망자들을 무시하고 진짜 경쟁에 집중하라!"
 canada_md_politics.16.b: "레이턴이 권력을 잡기 전에 행동해야 한다!"
 canada_md_politics.17.t: "1812년 전쟁 200주기"
 canada_md_politics.17.d: "Today marks two hundred years since the United States declared war on the British Empire. It was a war that helped shape Canada's national identity, and the current Conservative administration under Harper is doing everything it can to remind Canadians of that. Millions of dollars have been spent over the past three years to create commemorative coins, historical reenactments, and promotional videos. Not many can argue that teaching youth about our past is a bad thing, but the high cost of the bicentennial compared to similar events has raised eyebrows."
 canada_md_politics.17.a: "우리의 자유를 지킨 캐나다인들을 모두가 알게 될 것이다"
 canada_md_politics.17.b: "그 전쟁은 애초에 가치도 없었다."
 canada_md_politics.18.t: "국제우주정거장 (ISS) 엑스퍼디션 35"
 canada_md_politics.18.d: "Colonel Chris Hadfield has returned from the International Space Station. He was the first astronaut with the Canadian Space Agency to be put in command of the station. Not only is he highly accomplished but he also attracted a massive social media presence. Hadfield often streamed videos to children across the nation to show them what life in space is like. Sometimes he would host online sessions where the internet could ask him anything. He even created a music video on the ISS of him singing Space Oddity by David Bowie. Now he is preparing to publish an autobiography recounting his experiences in space, due later this year."
 canada_md_politics.18.a: "그의 공로에 나라의 모든 영예를 수여하고, 그 책 한 권을 구해 달라"
 canada_md_politics.18.b: "그는 차세대 캐나다 우주비행사들에게 영감을 주었다."
 canada_md_politics.19.t: "포괄적 경제 무역 협정 (CETA)의 결론에 대한 유럽 연합과의 협상"
 canada_md_politics.19.d: "Our efforts to diversify our trade partners have resulted in many new free trade opportunities. The Comprehensive Economic and Trade Agreement with the European Union might be our biggest trade deal yet. Our markets will open to 28 nations when this is ratified. However, the deal is not without controversy. There are growing concerns regarding the terms on intellectual property laws, genetically modified organisms, and visa restrictions between the two signatories. Newfoundland and Labrador in particular is upset with the way the enforcement of our exclusive economic zone will be altered. Some rules which protected fisheries in the Maritimes are now being dropped to appease the Europeans, and this stings after we had fought the Turbot War against them in 1995. Nonetheless, we managed a good deal overall considering the economic powerhouse that the European Union is."
 canada_md_politics.19.a: "우리나라를 유럽의 투자에 개방한다"
 canada_md_politics.19.b: "유럽 시장에 강력하게 진출한다"
 canada_md_politics.20.t: "수도에서의 테러"
 canada_md_politics.20.d: "Ottawa is currently under lockdown after a lone gunman attempted an attack on the government. It began with him fatally wounding a sentry named Corporal Nathan Cirillo at the National War Memorial. He then made his way to the Parliament, and entered the Centre Block through the main entrance under the Peace Tower. Many Members of Parliament were holding meetings at the time, and were gathered in rooms that the gunman happened to run past. Prime Minister Stephen Harper was in one of these rooms, and was forced to hide in a closet as his fellow party members grabbed flagpoles to defend themselves. The gunman shot some rounds as he made his way through the halls, and one bullet flew into the room the NDP were gathered in. Eventually, the RCMP managed to corner the gunman behind a column. Sergeant-at-Arms Kevin Vickers dove past the gunman while firing at him, and Constable Curtis Barrett reportedly shot the fatal bullet. Already, news stations around the world have begun sensationalizing this event with reports of the city being under siege. Even calmer reporters are questioning the lack of security on Parliament Hill. Perhaps the Americans were right to increase surveillance as much as they did after facing terror attacks of their own"
 canada_md_politics.20.a: "Canadians have never been known to lock their doors, and terrorists won't change that"
 canada_md_politics.20.b: "우리는 자유의 제한함으로써 대가를 치르더라도 캐나다 국민들을 보호해야만 합니다."
 canada_md_politics.21.t: "이라크와 시리아의 공습"
 canada_md_politics.21.d: "자유당이 이슬람 국가(IS)에 대한 우리의 이라크와 시리아 공습을 끝내겠다는 공약을 내걸고 막 선거에서 승리했습니다. 그들이 대신 하려는 것은 더 효과적인 전투력을 구축하기 위해 현지의 동맹군을 훈련하는 데 더 많은 노력을 기울이는 것입니다. 이 조치의 한 가지 이유는 이미 전투 작전에 수억 달러를 썼기 때문에 비용을 절감할 수 있다는 점입니다. 또 다른 이유는 현지 병력이 자체 전투를 감당할 수 있다면 캐나다인들이 목숨을 걸 필요가 없다는 점입니다. 두 주장 모두 일리가 있지만, NATO 동맹국들의 심기를 건드릴 위험이 있습니다. 다른 나라들은 우리가 힘든 일을 모두 그들에게 떠넘기고 있다는 인상을 받을 수 있습니다."
 canada_md_politics.21.a: "우리는 동맹국들에 대한 약속을 지켜야 한다"
 canada_md_politics.21.b: "이슬람 국가와의 싸움을 지원할 더 나은 방법이 있다"
 canada_md_politics.22.t: "오마르 카드르 사건"
 canada_md_politics.22.d: "Omar Khadr has become quite a divisive figure in the nation. His father took him to Afghanistan as a boy, and he ended up fighting on the side of Al-Qaeda along with other terrorist groups during the war. He was wounded in a battle against American forces and allegedly killed a Sergeant 1st Class by the name of Christopher Speer with a grenade. Later, he was captured and sent to Guantanamo Bay where he was interrogated by American and Canadian intelligence officers. In 2010, he pled guilty to war crimes after 8 years in custody. He returned to Canada to serve the rest of his term here. Controversy arose from his treatment at Guantanamo Bay. The UN found that he is the first person since World War II to be prosecuted for war crimes as a minor. Civil rights activists across the nation voiced disdain for the actions of our intelligence services, and the Supreme Court of Canada ruled that they violated his human rights. Khadr was released on bail in 2015, but the Conservatives sought to appeal this decision. The new Liberal administration is now considering dropping this appeal. Canadians will surely react negatively either way this goes."
 canada_md_politics.22.a: "그는 아버지가 테러리스트들의 품으로 끌고 갔을 때 한낱 소년에 불과했다"
 canada_md_politics.22.b: "그가 저지른 모든 일을 생각하면 그가 우리 거리를 자유롭게 활보하도록 놔둘 수 없다."
 canada_md_politics.23.t: "봄바디어 C시리즈의 운명"
 canada_md_politics.23.d: "항공우주 산업이 타격을 입고 있으며 이로 인해 Bombardier는 절박한 조치를 취하게 되었습니다. 최신 여객기인 CSeries는 잠재적으로 부를 가져다 줄 수 있는 시장의 틈새 시장을 메우고 있습니다. 그러나 이러한 제트기를 구매하는 회사는 많지 않습니다. 이에 대응하여 Bombardier는 각 유정의 가격을 생산 비용보다 낮게 인하하여 더욱 매력적으로 만들었습니다. 생산 비용은 3,300만 달러임에도 불구하고 각 제트기는 1,900만 달러에 판매되고 있습니다. Boeing은 MAX 7에 대한 경쟁이 치열했기 때문에 이 점을 조금 좋아하지 않았습니다. 따라서 그들은 Bombardier를 상대로 청원서를 제출했습니다. Bombardier가 미국 정부로부터 막대한 세금 감면을 받았음에도 불구하고 Bombardier가 불공정한 경제적 이익을 누리고 있다고 비난하는 것은 다소 위선적입니다. 그럼에도 불구하고 이는 우리 항공우주 산업에 치명적인 타격이 될 수 있습니다. 현 미국 행정부가 우리가 무역 관계를 이용하고 있다고 비난해 온 것은 도움이 되지 않습니다. 다행히도 유럽이 우리를 도왔습니다. Airbus는 캐나다에 독점적인 혜택을 제공하는 대가로 CSeries 프로그램의 대다수 지분을 인수하기를 원합니다. 유럽인들은 신뢰할 수 있는 동맹국이지만, 우리가 제안을 받아들인다면 우리는 이 업계에서 그다지 독립적이지 못할 것입니다."
 canada_md_politics.23.a: "미국에 무릎을 꿇느니 유럽과 협력하는 편이 낫다."
 canada_md_politics.23.b: "유럽에 팔아넘긴다고 해결되는 것은 없다"
 canada_md_politics.25.t: "단일 전선으로도 움직일 수 없는 미국"
 canada_md_politics.25.d: "우리 군과 NATO 동맹국들은 우리 행정부에 안보에 더 많은 지출을 하라고 끈질기게 요구해 왔습니다. 그들의 주장에는 일리가 있습니다. 우리 군은 지난 수십 년간 시대 변화를 따라잡는 데 어려움을 겪어 왔습니다. 장비는 구식이며 모병은 감소하고 있습니다. 또한 우리는 점점 더 많은 해외 분쟁 지역에 병력을 파견해 왔습니다. 얼음이 계속 녹음에 따라 북쪽의 우리 주권도 보호해야 할 것입니다. 하르지트 사잔 국방장관은 이러한 우려에 대처하기 위한 새로운 국방 정책을 제시했습니다. 이 정책은 향후 20년에 걸친 군의 전면 개편을 요구하며, 향후 10년 동안 지출을 73% 늘리는 내용이 포함되어 있습니다. 이 계획에는 큰 비용이 들 것이며, 필요한 자원이 모두 어디서 나올지는 불분명합니다."
 canada_md_politics.25.a: "캐나다는 자국과 동맹국을 지키기 위해 더 많은 일을 해야 한다."
 canada_md_politics.25.b: "군은 이미 충분히 유능하다."
 canada_md_politics.26.t: "캐나다 정부 150년 축하 행사"
 canada_md_politics.26.d: "캐나다 연방 결성 150주년입니다. 연방 정부와 주 정부는 이 나라 역사상 가장 큰 규모의 기념행사를 열고 있습니다. 공연이 열리고, 국립공원은 무료로 개방되며, 기념 주화가 주조되었습니다. 또한 온타리오 호수를 헤엄치는 거대한 오리도 있습니다. 세계 각지의 친구들도 선물을 보내 왔습니다. 네덜란드인들은 단풍잎 깃발과 똑같이 생긴 튤립을 품종 개량했습니다. 이 모든 것에도 불구하고 모두가 들떠 있는 것은 아닙니다. 일부는 행사의 높은 비용을 비판하며 그 돈이 다른 곳에 쓰였으면 한다고 말합니다. 원주민 단체들은 150주년 행사가 수백 년에 걸친 식민 통치를 강화할 뿐이라고 주장합니다. 이 두 가지 지적 모두 캐나다인들 사이에 약간의 긴장을 불러일으켰습니다."
 canada_md_politics.26.a: "캐나다, 뿐만 아니라 전세계에 있어 영광스러운 날이다."
 canada_md_politics.26.b: "과거는 잊어라!"
 CAN_invest_in_PREV_tt: "Canada Sends [PREV.GetNameWithFlag] investment offers."
 CAN_oil_subsidies_tt: "캐나다의 최초 석유 보조금은 §Y0.1 x10억 달러§!와 §Y0.5x 10억 달러§! 사이의 비용이 듭니다."
 CAN_Refineries_Abroad_tt: "§R이 중점의 효과는 사우디 아람코(Saudi Aramco)와 로스네프트(Rosneft)를 선택했는지 여부에 따라 달라집니다\n§!"
 CAN_economy_tt: "\nAny path taken in the economy tree might either §Rupset§! or §Gplease§! the French populace in Canada."
 start_building_pipeline_tt: "파이프라인을 완공하는데 대략 2년 정도의 시간이 소요됩니다.\n\n"
 keystonepipeline_can_0_tt: "§R계획은 즉시 캐나다 의회 내부의 각기 다른 의원들 사이에서 준비되기 시작될 것입니다.\n\n§!"
 keystonepipeline_can_1_tt: "Because the Americans have already finished their pipeline, it will significantly §GDecrease§! the funding necessary to complete our end of the pipeline!"
 CAN_try_fix_happiness_tt: "정부가 프랑스계 캐나다인 공동체와의 관계를 회복하려고 시도한다면, 그들의 행복도는 최소 §G2%§!에서 최대 §G12%§!까지 §G증가§!할 가능성이 있습니다."
 CAN_did_nothing_happiness_tt: "If the government doesn't attempt to reconcile, the French Canadian happiness will have a chance of §RReducing§! between §H0%§! and §R-6%§!."
 CAN_quebec_revolts_tt: "§R프랑스령 캐나다인 국가주의자들이 우리들에 대항해 들고 일어섰습니다. 우리는 그들을 물리쳐야 합니다!§!"
 CAN_quebec_autonomous_tt: "퀘벡은 캐나다의 자치주로 독립하게 되면서 §R더 많은 자율성을 부여받게§! 될 것입니다."
 CAN_keystone_pipeline_alone_happiness_tt: "파이프라인을 계획을 단독으로 진행한다면, 프랑스계 캐나다인의 행복도가 §H0%§!에서 최대 §R-3%§!까지 §R감소할§! 가능성이 있습니다."
 CAN_keystone_pipeline_usa_happiness_tt: "\n미국과 파이프라인을 계획함으로써, 프랑스계 캐나다인의 행복도가 §H0%§!에서 최대 §R-8%§!까지 §R감소할§! 가능성이 있습니다."
 CAN_keystone_pipeline_do_it_happiness_tt: "\n송유관 건설을 시작하면 프랑스계 캐나다인의 행복도가 §R-2%§!에서 §R-8%§! 사이로 §R감소§!할 가능성이 있습니다.\n\n"
 CAN_keystone_pipeline_use_money_elsewhere_happiness_tt: "\n송유관 건설을 취소하면 프랑스계 캐나다인의 행복도가 §G2%§!에서 §G10%§! 사이로 §G증가§!할 가능성이 있습니다."
 CAN_keystone_pipeline_2_b_happiness_tt: "\n송유관 건설을 시작하면 §H50%§! 확률로 프랑스계 캐나다인의 행복도가 §R-1%§! §R감소§!합니다."
 CAN_keystone_pipeline_5_b_happiness_tt: "\n송유관 건설을 시작하면 §H50%§! 확률로 프랑스계 캐나다인의 행복도가 §R-2%§! §R감소§!합니다."
 CAN_canadian_investments_tt: "[CAN.GetNameWithFlag] invests in §YInfrastructure§! and §YCivilian Industry§! at market price."
 CAN_canadian_economy_dynamic_modifier: "캐나다 경제"
 CAN_canadian_economy_dynamic_modifier_tt: "캐나다 경제는 세계 최대 경제 중 하나입니다. 그 주된 이유는 남쪽 이웃 미국으로의 수출입니다. 주요 도시 중 하나인 토론토는 최근 수십 년간 주요 금융 중심지가 되었으며 그 위상이 계속 높아지고 있습니다.\n\n경제 중점을 더 많이 완료할수록 이 국가 정신의 보상이 커집니다. 이를 유지하려면 막대한 자금이 필요합니다.\n"
 CAN_extremely_high_french_happiness: "엄청난 프랑스계 캐나다인의 행복도"
 CAN_extremely_high_french_happiness_desc: "프랑스계 캐나다인들은 캐나다 정부에 상당히 만족하고 있습니다."
 CAN_very_high_french_happiness: "매우 높은 프랑스계 캐나다인의 행복도"
 CAN_very_high_french_happiness_desc: "프랑스계 캐나다인들은 캐나다 정부에 매우 만족하고 있습니다."
 CAN_high_french_happiness: "높은 프랑스계 캐나다인의 행복도"
 CAN_high_french_happiness_desc: "프랑스계 캐나다인들은 캐나다 정부에 만족하고 있습니다."
 CAN_medium_french_happiness: "중간 정도의 프랑스계 캐나다인의 행복도"
 CAN_medium_french_happiness_desc: "프랑스계 캐나다인들은 캐나다 정부에 대해 중립적인 입장입니다."
 CAN_low_french_happiness: "낮은 프랑스계 캐나다인의 행복도"
 CAN_low_french_happiness_desc: "프랑스계 캐나다인들은 캐나다 정부에 불만을 표출하고 있습니다."
 CAN_very_low_french_happiness: "매우 낮은 프랑스계 캐나다인의 행복도"
 CAN_very_low_french_happiness_desc: "프랑스계 캐나다인들은 캐나다 정부에 매우 불만을 표출하고 있습니다."
 CAN_extremely_low_french_happiness: "극도로 낮은 프랑스계 캐나다인의 행복도"
 CAN_extremely_low_french_happiness_desc: "프랑스계 캐나다인들은 캐나다 정부에 극도로 불만을 표출하고 있습니다."
 CAN_provincial_infrastructure: "지역 기반시설 프로그램"
 CAN_provincial_infrastructure_desc: "우리 인프라의 일부 측면이 고속 철도와 도로에 대한 국가 목표에 뒤처지고 있습니다."
