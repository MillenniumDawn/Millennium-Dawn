 air_module_anti_ship_drone_missile_4_desc: "$air_module_anti_ship_drone_missile_1_desc$"
 air_module_hypersonic_engine_1: "Гиперзвуковой двигатель I"
 air_module_hypersonic_engine_1_desc: "Гиперзвуковые двигатели обеспечивают максимальную тягу и высокую скорость полета, позволяя быстро перехватывать цели и наносить удары с улучшенной маневренностью на высоких скоростях.\n\n§GПодсказка дизайнера: Гиперзвуковые двигатели очень дороги в производстве, но дают исключительную скорость и высокую манёвренность.§!"
 air_module_hypersonic_engine_2: "Гиперзвуковой двигатель II"
 air_module_hypersonic_engine_2_desc: "$air_module_hypersonic_engine_1_desc$"
 air_module_railgun_cannon_1: "Рельсотронная пушка I"
 air_module_railgun_cannon_1_desc: "Рельсотроны используют электромагнитное ускорение для стрельбы высокоскоростными снарядами, обеспечивая исключительную смертоносность в бою «воздух-воздух» и повышая вероятность поражения быстро движущихся летательных аппаратов. Их специализированные системы стрельбы и подачи боеприпасов оптимизированы для воздушных боев, что делает их гораздо менее эффективными для выполнения многоцелевых задач и ограничивает их применение за пределами боев «воздух-воздух».  \n\n§GПодсказка дизайнера: Авиационные рельсотроны дают очень высокую эффективность в воздушном бою против самолётов, но дороги и узкоспециализированны и мало полезны вне задач завоевания превосходства в воздухе.§!"
 air_module_railgun_cannon_2: "Рельсотронная пушка II"
 air_module_railgun_cannon_2_desc: "$air_module_railgun_cannon_1_desc$"
 air_module_railgun_cannon_3: "Рельсотронная пушка III"
 air_module_railgun_cannon_3_desc: "$air_module_railgun_cannon_1_desc$"
 air_module_pdl_1: "Лазер ближней обороны I"
 air_module_pdl_1_desc: "Лазеры точечной обороны обеспечивают активный защитный слой, обнаруживая приближающиеся ракеты и уничтожая их до столкновения, что повышает живучесть самолетов в условиях современных угроз класса «воздух-воздух» и «земля-воздух».\n\n§GПодсказка дизайнера: Лазеры ближней обороны улучшают защиту самолёта от ракет, но они тяжелее и дороже в производстве.§!"
