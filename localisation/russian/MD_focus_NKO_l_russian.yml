 NKO_specialise_commanders_tt: "§G Командиры бронетанковых, оборонительных, наступательных и общевойсковых подразделений получают особенность, углубляющую их специализацию.§!"
 NKO_specialise_guerrilla_tt: "§GКомандиры, прошедшие подготовку в партизанском движении, учатся устраивать засады.§!"
 NKO_specialise_commando_tt: "§GКомандиры, прошедшие подготовку в спецназе, получают повышение и становятся командирами подразделений специального назначения.§!"
 NKO_sso_new_general_tt: "§GКомиссия Сил специальных операций §!§YКим Ён Бок§!§GСпециалист спецназа назначен новым командиром корпуса.§!"
 NKO_arms_export: "Управление по иностранным делам"
 NKO_arms_export_desc: "Бюро, стоящее за KOMID и внешней торговлей оружием. Поставляет оружие, ракеты, войска и спутники воюющим странам в обмен на твердую валюту, технологии и постоянно растущую промышленную базу."
 NKO_arms_export_modifiers: "Управление по иностранным делам"
 NKO_arms_export_modifiers_desc: "Бюро по экспорту вооружений Пхеньяна. Каждая страна, которой мы поставляем оружие, постоянно повышает наши показатели. §Yзаводской выход§! и §Yэффективность производства§!, бонус, который увеличивается по мере расширения многополярного арсенала."
 NKO_arms_export_title: "§YМинистерство иностранных дел§!"
 NKO_arms_export_clients_readout: "Страны-поставщики: §Y[?NKO_arms_export_clients|0]§! Заключенные сделки: §Y[?NKO_arms_export_deals|0]§!"
 NKO_arms_export_output_readout: "Постоянный заводской вывод: §G+[?NKO_arms_export_clients|0]%§!"
 NKO_arms_export_revenue_readout: "Заработанная валюта: §G$[?NKO_arms_export_revenue|0]§! миллиард"
 NKO_arms_export_sanctions_readout: "Давление санкций: [NKO_arms_export_sanctions_status]"
 NKO_arms_export_hint: "Откройте §YОбщепринятый§! раздел для вооружения любого §Wне западный§! нация §Rпроиграв войну§! (30%+ отчислений). Каждый клиент предоставляет... §Gпостоянный +1% к объему производства на заводе§!твердая валюта и технологии, но повышает §Rсанкции§!. Уговаривайте своих клиентов успокоиться."
 NKO_arms_export_capstone_status_progress: "§O Арсенал многополярного мира: поставьте 10 стран, чтобы разблокировать финальную способность.§!"
 NKO_arms_export_capstone_status_ready: "§G Арсенал многополярного мира в пределах досягаемости. Созовите заседание.§!"
 NKO_arms_export_capstone_status_done: "§G Достигнут статус Арсенала многополярного мира.§!"
 NKO_arms_export_sanctions_max: "§RМаксимальный (UNSC)§!"
 NKO_arms_export_sanctions_severe: "§RSevere§!"
 NKO_arms_export_sanctions_heavy: "§OHeavy§!"
 NKO_arms_export_sanctions_moderate: "§OModerate§!"
 NKO_arms_export_sanctions_light: "§YLight§!"
 NKO_arms_export_sanctions_none: "§GNone§!"
 NKO_arms_export_conv_open: "§YOpen§! Экспорт обычных вооружений"
 NKO_arms_export_conv_open_desc: "Отобразите традиционные решения по снабжению: артиллерийские снаряды и добровольцы штурмового корпуса для каждой страны, участвующей в войне."
 NKO_arms_export_conv_close: "§YClose§! Экспорт обычных вооружений"
 NKO_arms_export_conv_close_desc: "Чтобы панель не была перегружена информацией, скройте традиционные решения по поставкам."
 NKO_export_munitions: "Отправьте комплект обычного вооружения по адресу [FROM.GetNameWithFlag]"
 NKO_export_munitions_desc: "Доставка груза вооружения со складов Народной армии на фронт по железной дороге. [FROM.GetName] выбирает тот тип подразделения, который им больше всего нужен (§Yлегкая пехота§!, §Yмоторизованный§!, §Yбронированный§!, или §Yмеханизированный§!) и мы отгружаем достаточно современного оборудования, выпущенного в 1995 году или позже, для §Yтри батальона§! Часть из них берется непосредственно из наших собственных запасов. Бронетанковые и механизированные комплексы требуют современной конструкции танка. Авиацию мы не поставляем. Они воюют тяжелее, а нам платят твердой валютой."
 NKO_deploy_storm_corps: "Разверните штурмовой корпус в районе [FROM.GetNameWithFlag]"
 NKO_deploy_storm_corps_desc: "Предложить Северной Корее интервенцию [FROM.GetName]Если они согласятся, мы разблокируем возможность отправки. §Yдобровольческие подразделения§! прижавшись к ним спереди, мы еще крепче сблизились с нашим покровителем и заслужили его благодарность. Развертывание для §YРоссия§! или §YКитай§! Открывает систему постоянной субсидии в твердой валюте, которая продолжает действовать даже после возвращения корпуса домой. Требует §YГлобальный интервенционизм§! внешняя политика."
 NKO_arms_export_lobby_relief: "Лоббировать отмену санкций"
 NKO_arms_export_lobby_relief_desc: "Используйте дипломатический вес наших хорошо вооруженных партнеров и небольшую сумму денег, чтобы добиться смягчения международных санкций на один шаг в Организации Объединенных Наций."
 NKO_arms_export_capstone: "Арсенал многополярного мира"
 NKO_arms_export_capstone_desc: "Вооружив коалицию государств против империалистического порядка, необходимо формализовать роль Пхеньяна как мастерской многополярного мира."
 NKO_arms_export_relief_deals_tt: "Заключено как минимум §Y5§! экспортных сделок"
 NKO_arms_export_relief_sanctions_tt: "В настоящее время находится под международными санкциями."
 NKO_arms_export_unlock_tt: "§GОткрывает доступ к Управлению иностранных дел, программе экспорта вооружений и рабочей силы за рубеж.§!"
 NKO_export_munitions_effect_tt: "Если они согласятся, клиент запрашивает один пакет услуг, и мы предоставляем его в достаточном количестве. §Y1995 год и позже§! оборудование для §Yтри батальона§!, §Yвзято из наших собственных запасов§!Бронетанковые и механизированные комплексы требуют §Yсовременный дизайн танка§! (по крайней мере, половина модулей, выпущенных после окончания холодной войны). §RАвиатранспортные средства не предоставляются.§! Нам платят §Yтвердая валюта§!, а новый клиент предоставляет постоянный бонус к объему производства, размер которого зависит от размера пакета услуг: §G+1%§! легкая пехота, §G+2%§! моторизованный, §G+3%§! Бронированные или механизированные. Давление санкций возрастает.\n\nКлиент выигрывает §YСеверокорейские боеприпасы§! для §Y365§! дней:\n  §G+5%§! Дивизионная атака\n  §G+5%§! Коэффициент восстановления подразделения\n  §G-5%§! Предложение Потребление"
 NKO_export_troops_effect_tt: "Мы предлагаем развернуть силы для интервенции. Если принимающая сторона согласится, мы получим возможность отправить войска. §Yдобровольческие подразделения§! В их войне мы получаем политическую поддержку и твердую валюту. Внутри страны потери живой силы не происходят."
 NKO_storm_corps_permanent_income_tt: "Будучи покровителем великой державы, они предоставляют еженедельную субсидию в твердой валюте в размере §Ypermanent§!, которая продолжается даже после возвращения штурмового корпуса домой."
 NKO_arms_client_munitions: "Северокорейские боеприпасы"
 NKO_arms_client_munitions_desc: "Ящики с северокорейскими снарядами и винтовками поддерживают огонь из орудий."
 NKO_arms_client_troops: "Добровольцы Корейской народной армии"
 NKO_arms_client_troops_desc: "Ветераны штурмового корпуса укрепляют линию фронта и удерживают оборону."
 NKO_storm_corps_abroad: "Штурмовой корпус развернут за рубежом"
 NKO_storm_corps_abroad_desc: "Наши лучшие войска воюют за границей. Их отсутствие ощущается дома — как в плане численности личного состава, так и в плане морального духа."
 NKO_arms_export_capstone_spirit: "Арсенал многополярного мира"
 NKO_arms_export_capstone_spirit_desc: "Пхеньян стал незаменимым поставщиком для стран, сопротивляющихся Западу. Наши заводы работают на полную мощность, защищенные от давления санкций."
 NKO_export.1.t: "Москве нужны снаряды"
 NKO_export.1.d: "Российское наступление поглощает боеприпасы быстрее, чем его заводы могут их производить. По тайным каналам Кремль запрашивает у Пхеньяна артиллерийские снаряды, ракеты и все остальное, что может выделить Народная армия. Оплата будет щедрой: деньги, зерно и военные технологии, которые мы давно желали получить."
 NKO_export.1.a: "Выполните заказ"
 NKO_export.1.b: "В данный момент нет"
 NKO_export.10.t: "[FROM.GetNameWithFlag] предлагает комплект вооружения."
 NKO_export.10.d: "Пхеньян предлагает отправить нашим испытывающим финансовые трудности войскам партию современного вооружения, оплаченную твердой валютой. Мы можем запросить оборудование для того типа дивизий, который нам больше всего нужен: достаточное количество техники для §Yтри батальона§!, взятые непосредственно из северокорейских запасов."
 NKO_export.10.a: "Запросите комплект §YLight Infantry§!: винтовки и командное снаряжение."
 NKO_export.10.b: "Отклонить предложение"
 NKO_export.11.t: "[FROM.GetNameWithFlag] принимает наше оружие"
 NKO_export.11.d: "[FROM.GetName] принял наше предложение. Груз отправляется с наших складов на фронт, и твердая валюта уже поступила на наши счета."
 NKO_export.11.a: "Загрузите поезда"
 NKO_export.12.t: "[FROM.GetNameWithFlag] отказывается от нашего оружия"
 NKO_export.12.d: "[FROM.GetName] отказался от нашего оружия. Ящики останутся на наших складах."
 NKO_export.12.a: "Пусть будет так"
 NKO_export.99.t: "Арсенал многополярного мира"
 NKO_export.99.d: "От Москвы до Тегерана северокорейские заводы обеспечивают топливом орудия десятка армий. То, что начиналось как отчаянная попытка заработать твердую валюту, сделало Китайскую Народную Демократическую Республику незаменимой для каждой державы, бросающей вызов Вашингтону. Мастерская революции нашла своих покупателей."
 NKO_export.99.a: "Пусть мир зависит от нас."
 NKO_export.22.t: "Пхеньян предлагает силы для интервенции"
 NKO_export.22.d: "[FROM.GetName] предлагает перебросить корейские добровольческие дивизии на наш фронт. Их солдаты будут сражаться бок о бок с нашими против наших врагов, и мы не можем позволить себе отказаться от такого предложения Пхеньяна о вмешательстве."
 NKO_export.22.a: "Принять своих солдат"
 NKO_export.22.b: "Отклонить предложение"
 NKO_export.20.t: "[FROM.GetNameWithFlag] Нужны мужчины"
 NKO_export.20.d: "В районе [FROM.GetName], где уже ведут бои наши штурмовые отряды, исчерпаны все людские резервы. Их командование обращается к Пхеньяну с просьбой прислать свежих бойцов для удержания линии фронта."
 NKO_export.20.a: "Отправьте подкрепление"
 NKO_export.20.b: "Мы не можем выделить этих людей."
 NKO_export_send_manpower_tt: "§GОтправляет рабочую силу, равную §Y10%§! от [FROM.GetName] резервного кадрового резерва, набранного из наших резервов.§!"
 NKO_export.40.t: "Запад отвечает санкциями"
 NKO_export.40.d: "Наше оборудование продолжает появляться на фронтах, которые империалисты хотели закрыть для нас. [USA.GetName], к которому присоединились [FRA.GetName], [GER.GetName] и [JAP.GetName], развернул новый пакет санкций: замороженные счета, внесенные в черный список торговые дома и предупреждения всем, кто продолжает покупать товары у Пхеньяна. Мы уже выдерживали их давление раньше."
 NKO_export.40.a: "Пусть империалисты бушуют!"
 NKO_export.40.b: "Спокойно примите удар."
 NKO_arms_contract_title: "§YОбязательства меценатов-волонтеров§!"
 NKO_expeditions_readout: "Участники экспедиций: §G[?NKO_expeditions_completed|0]§!"
 NKO_commit_volunteers: "Пригласите волонтеров в экспедицию на [FROM.GetName]"
 NKO_commit_volunteers_desc: "Официально оформить развертывание наших добровольческих дивизий, участвующих в боевых действиях в [FROM.GetName]. Пхеньян выставляет счет своему покровителю за людские ресурсы, используя твердую валюту. [FROM.GetName] выплачивает премию за наши дивизии."
 NKO_commit_volunteers_req_tt: "[FROM.GetName] размещает как минимум §Y6§! из наших волонтерских подразделений."
 NKO_commit_volunteers_effect_tt: "Банки вкладывают премию в твердой валюте в наши §Yказначейство§!. В то время как наш §Yдобровольческие подразделения§! Продолжайте воевать за границей, длительное развертывание тренирует нашу армию, предоставляя §Yдоктрина владения землей§! каждую неделю."
 NKO_economy_shortcut: "Экономика"
 NKO_military_shortcut: "Военный"
 NKO_38th_parallel_shortcut: "38-я параллель"
 NKO_political_shortcut: "Политика"
 NKO_overcome_the_arduous_march: "Преодолейте трудный марш"
 NKO_overcome_the_arduous_march_desc: "Голодные годы позади. Сельское хозяйство восстановлено, Уишон отстроен заново, и новые рыночные классы вовлечены в жизнь общества. Мы наконец можем объявить о завершении Трудного марша и направить все силы штата на восстановление страны."
 NKO_renovate_water_supply_facilities: "Реконструкция объектов водоснабжения"
 NKO_renovate_water_supply_facilities_desc: "Реконструкция и расширение наших систем водоснабжения имеют важное значение для общественного здравоохранения и промышленного развития. Мы обеспечим доступ к чистой и надежной воде для всех граждан и предприятий."
 NKO_national_power_grid: "Национальная энергосеть"
 NKO_national_power_grid_desc: "Объединение наших возобновляемых источников энергии и гидроэлектростанций в единую национальную энергосеть стабилизирует электроснабжение как заводов, так и домохозяйств, положив конец веерным отключениям электроэнергии, которые долгое время парализовали производство."
 NKO_pojon_field_responsibility: "Система ответственности за полевые работы Pojon"
 NKO_pojon_field_responsibility_desc: "Система «Пожон» предоставляет небольшим семейным рабочим бригадам автономию в отношении сельскохозяйственных излишков, превышающих государственные квоты. Предоставляя крестьянам возможность сохранять за собой урожай, полученный в рамках программы стимулирования производства, система способствует расширению производства и укреплению продовольственной безопасности."
 NKO_rason_ftz: "Специальная экономическая зона Расон"
 NKO_rason_ftz_desc: "Свободная торговая зона Расон на северо-востоке, созданная совместно с китайскими и российскими инвесторами, открывает для Северной Кореи доступ к легальной трансграничной торговле. Контроль над портом Раджин и доступ к границе обеспечивают устойчивое развитие экономической торговли."
 NKO_koryolink_network: "Мобильная сеть Кориолинк"
 NKO_koryolink_network_desc: "Компания Koryolink, запущенная в 2008 году как сеть 3G, построенная совместно с Orascom Telecom, предоставляет современные телекоммуникационные услуги миллионам абонентов. Мобильная сеть модернизирует поток информации и снижает зависимость от государственных СМИ."
 NKO_pyongyang_prestige_streets: "Престижные улицы Пхеньяна"
 NKO_pyongyang_prestige_streets_desc: "Такие знаковые улицы, как Мирэская улица учёных и Рёмёнская улица, были построены в ускоренном темпе, чтобы продемонстрировать национальную современность и непокорность, несмотря на международные санкции. Эти городские символы укрепляют народный дух и международный престиж."
 NKO_ryugyong_hotel: "Завершение строительства отеля Рюгён."
 NKO_ryugyong_hotel_desc: "Долгое время заброшенное 105-этажное здание отеля «Рюгён» в форме пирамиды получило полностью стеклянную облицовку фасада в период с 2008 по 2011 год. Эта архитектурная достопримечательность символизирует национальные технологические амбиции и экономическое восстановление."
 NKO_exporting_workforce: "Экспортная рабочая сила"
 NKO_chollima_speed: "Чоллима Спид"
 NKO_field_responsibility_system: "Система распределения обязанностей на местах"
 NKO_field_responsibility_system_desc: "Система полевой ответственности «Пожон» позволяет крестьянским бригадам оставлять себе излишки урожая сверх государственных квот, создавая стимулы для увеличения производства. Устойчивое сельскохозяйственное производство повышает продовольственную безопасность и моральный дух населения."
 NKO_mobile_network: "Мобильная сеть Кориолинк"
 NKO_mobile_network_desc: "Современная телекоммуникационная сеть 3G охватывает миллионы абонентов, модернизируя коммуникационную инфраструктуру. Улучшенный доступ к информации и снижение зависимости от государственных СМИ уменьшают нагрузку на общество."
 NKO_people_army: "Народная армия"
 NKO_people_army_desc: "Народная армия должна была быть готова к войне, даже в этот сложный период. \"Трудный марш\"чтобы защитить себя от американского империализма и его южнокорейских марионеток."
 NKO_national_defence_force: "Национальная оборона"
 NKO_national_defence_force_desc: "Мы увеличим наши военные расходы, чтобы сравняться с расходами наших южных коллег, дабы обеспечить безопасность нашей страны и защитить её от любых угроз."
 NKO_red_dawn: "#VALUE!"
 NKO_red_dawn_desc: "Заря нашего революционного духа вновь воссияет, когда мы укрепим свою военную мощь. Пусть это станет началом нашего неустанного марша к превосходству."
 NKO_studying_their_airforce: "Изучение вражеских военно-воздушных сил"
 NKO_studying_their_airforce_desc: "Чтобы подготовиться к неизбежным конфликтам, мы должны изучить военно-воздушные силы наших противников, узнать их сильные и слабые стороны и разработать контрстратегии."
 NKO_focus_on_the_f_35: "В центре внимания — F-35"
 NKO_focus_on_the_f_35_desc: "Мы проанализируем технологии F-35, используя его конструкцию в качестве источника вдохновения для улучшения наших собственных возможностей в воздухе и противодействия любому, кто использует этот передовой истребитель."
 NKO_focus_on_the_f_16: "В центре внимания — F-16"
 NKO_focus_on_the_f_16_desc: "Истребитель F-16 зарекомендовал себя как боеспособный самолет. Мы проанализируем его тактику и технологии, попутно усовершенствуя наш собственный истребительный флот."
 NKO_focus_on_the_future_kai_kf_21: "В центре внимания – KF-21"
 NKO_focus_on_the_future_kai_kf_21_desc: "KF-21 — это истребитель нового поколения Южной Кореи. Анализируя его потенциал, мы готовим наши военно-воздушные силы к противодействию любой угрозе, которую он может представлять."
 NKO_begin_uranium_enrichment: "Начать обогащение урана"
 NKO_begin_uranium_enrichment_desc: "Будь то ради освобождения южнокорейского народа или ради защиты нашей великой родины от ядерной угрозы со стороны американских империалистов, мы должны решительно и мужественно продолжать разработку ядерного оружия!"
 NKO_remove_monitoring_devices: "Удалите устройства слежения."
 NKO_remove_monitoring_devices_desc: "Наше обогащение урана неизбежно встретит сопротивление со стороны международного сообщества. Поэтому лучшее, что мы можем сделать, чтобы скрыть обогащение урана, — это сделать так, чтобы международное сообщество этого не заметило."
 NKO_expel_inspectors: "Изгнать инспекторов"
 NKO_expel_inspectors_desc: "Международное агентство по атомной энергии направило в нашу страну множество инспекторов, чтобы убедиться, что мы используем для энергоснабжения только ядерные технологии. Раз уж мы собираемся разорвать с ними отношения, то заодно можно депортировать этих империалистических шпионов."
 NKO_withdraw_from_npt: "Выйти из Договора о нераспространении ядерного оружия"
 NKO_withdraw_from_npt_desc: "Важным шагом для нашей ядерной программы, которая связана с нашей независимостью и безопасностью, является выход из Договора о нераспространении ядерного оружия (ДНЯО). Мы не можем ограничивать нашу способность защищать независимость и безопасность нашей страны неравноправными договорами нелепых империалистов!"
 NKO_missile_tests: "Испытания ракет"
 NKO_missile_tests_desc: "Испытания ракет Северной Кореи демонстрируют растущий потенциал страны в области баллистических ракет, показывая целый ряд систем — от ракет малой дальности до межконтинентальных баллистических ракет (МБР). Эти испытания имеют решающее значение для развития военных технологий, утверждения регионального влияния и сигнализирования о стратегических намерениях, часто приводя к эскалации напряженности и провоцируя международные ответные действия."
 NKO_nuclear_tests: "Ядерные испытания"
 NKO_nuclear_tests_desc: "Ядерные испытания Северной Кореи представляют собой серию подземных взрывов, проводимых страной с 2006 года в рамках программы разработки ядерного оружия. Эти испытания демонстрируют прогресс в мощности и технологиях оружия, часто вызывая международное осуждение и санкции. Они являются важнейшим элементом стратегии Северной Кореи по обеспечению безопасности режима и проецированию силы на мировой арене."
 NKO_our_pride_and_joy: "Наша гордость и радость"
 NKO_our_pride_and_joy_desc: "Радуйтесь! Перед лицом жесткой блокады со стороны американских империалистов и подчиненных им стран, под руководством любимого товарища [NKO.GetLeader], мы, Корейская Народная Демократическая Республика, наконец-то обрели собственные ядерные силы! Дни, когда американские империалисты-агрессоры пытались шантажировать нас ядерной палкой, прошли!"
 NKO_nuclear_approval_not_sco: "Мы не должны быть членом ШОС."
 NKO_people_air_force: "Народные военно-воздушные силы"
 NKO_people_air_force_desc: "Необходимо обеспечить безопасность воздушного пространства Чосона от любого вторжения со стороны американских империалистов или их южных союзников. Это окажется сложной задачей, если мы не усовершенствуем наши возможности в области авиации."
 NKO_self_produced_rifles: "Винтовки собственного производства"
 NKO_self_produced_rifles_desc: "Корейская народная армия не может полагаться на иностранных поставщиков стандартного штатного оружия. Отечественные арсеналы нарастят производство стрелкового оружия в больших количествах, гарантируя, что каждый солдат будет вооружен оружием, произведенным на родине."
 NKO_model_master: "Мастер моделей"
 NKO_model_master_desc: "Разработка танков в Северной Корее сосредоточена на производстве собственных бронированных машин, адаптированных к местности и военной доктрине страны. Эти танки, от моделей, созданных по советскому образцу, до модернизированных разработок, играют важнейшую роль в сухопутных войсках страны, уделяя особое внимание мобильности, огневой мощи и способности действовать в различных боевых условиях."
 NKO_artillery: "Наша артиллерия"
 NKO_artillery_desc: "Артиллерия Северной Кореи является краеугольным камнем ее военной стратегии и включает в себя широкий спектр систем, от традиционных гаубиц до современной реактивной артиллерии. Известная своим огромным арсеналом, артиллерия предназначена для подавляющей огневой мощи и способна поражать как военные объекты, так и гражданские районы, особенно в соседней Южной Корее, что делает ее ключевым элементом сдерживания и наступления."
 NKO_spaa: "Наша противовоздушная оборона"
 NKO_spaa_desc: "Система противовоздушной обороны Северной Кореи представляет собой сочетание технологий советской эпохи и разработанных внутри страны платформ, предназначенных для защиты критически важной инфраструктуры и противодействия потенциальным воздушным угрозам. Она включает в себя зенитные ракеты, зенитные орудия и радиолокационные системы, что подчеркивает стратегию многоуровневой обороны. Несмотря на ограничения по сравнению с современными системами, она отражает стремление страны к самодостаточности и сдерживанию."
 NKO_rocket_artillery: "Ракетная артиллерия"
 NKO_rocket_artillery_desc: "Северокорейская реактивная артиллерия является важнейшим компонентом её вооруженных сил и включает в себя широкий спектр систем, в том числе мощные модели KN-09 и KN-25. Эти платформы предназначены для высокоточных ударов на большие расстояния и способны обеспечить значительную огневую мощь как по военным, так и по стратегическим целям. Их мобильность и быстрое развертывание повышают способность Северной Кореи проецировать силу и поддерживать наступательные операции."
 NKO_naval_modernization: "Модернизация военно-морского флота"
 NKO_naval_modernization_desc: "Модернизация военно-морского флота Северной Кореи сосредоточена на расширении его возможностей за счет создания более компактных и маневренных судов, а также передовых ракетных систем. Это включает в себя разработку подводных лодок, способных запускать баллистические ракеты (БРР), и модернизацию надводных кораблей с помощью современного вооружения. Эти усилия отражают стратегию асимметричной войны, использующую береговые и подводные средства для противодействия более крупным военно-морским державам и проецирования силы в региональных водах."
 NKO_anti_submarine: "Противолодочные возможности"
 NKO_anti_submarine_desc: "Противолодочные возможности Северной Кореи ограничены, но постоянно развиваются, опираясь на сочетание патрульных катеров, глубинных бомб и судов, оснащенных гидролокаторами. Усилия по совершенствованию этих систем включают развертывание более компактных и маневренных кораблей, а также эксперименты с собственными технологиями. Эти возможности сосредоточены на защите прибрежных вод и противодействии потенциальным подводным вторжениям со стороны противников, обеспечивая морскую безопасность вблизи берегов страны."
 NKO_infiltration_by_sea: "Проникновение с моря"
 NKO_infiltration_by_sea_desc: "Стратегия морской инфильтрации Северной Кореи использует флот малых быстроходных судов, подводных лодок и полупогружных аппаратов для проведения тайных операций. Эти средства позволяют перебрасывать спецназ и технику, часто незаметно, для разведки, диверсий или ведения нетрадиционной войны. Такой подход подчеркивает акцент Северной Кореи на асимметричной тактике для использования уязвимостей вдоль береговой линии противника."
 NKO_submarine_development: "Разработка подводных лодок"
 NKO_submarine_development_desc: ""
 NKO_upgrade_shipyards: "Модернизация верфей"
 NKO_upgrade_shipyards_desc: "Развитие подводного флота Северной Кореи сосредоточено на расширении как обычных, так и стратегических судов, включая подводные лодки с баллистическими ракетами (ПЛР), такие как подводные лодки класса «Синпо». Эта программа подчеркивает стремление страны создать надежный подводный потенциал сдерживания, повысив скрытность и живучесть в своей ядерной стратегии. Сочетая собственные разработки и модернизацию более старых моделей, Северная Корея уделяет приоритетное внимание асимметричным военно-морским возможностям для укрепления своей обороны и стратегического влияния."
 NKO_expand_bases: "Расширяйте базы"
 NKO_expand_bases_desc: "Стратегия Северной Кореи по расширению военных баз отражает ее стремление к укреплению обороны и боеготовности. Это включает в себя модернизацию существующих объектов, строительство новых подземных укрытий и совершенствование логистических центров для поддержки своих сил. Расширение баз направлено на повышение эффективности развертывания войск, защиту критически важных объектов и обеспечение стратегической глубины, гарантируя живучесть против потенциальных атак и одновременно проецируя силу вдоль ключевых стратегических точек. Эти разработки также направлены на поддержку прогресса в ракетных системах, подводных лодках и другой военной технике."
 NKO_green_water_navy: "ВМС Зеленых Вод"
 NKO_green_water_navy_desc: "Развитие Северной Кореей военно-морского флота, ориентированного на прибрежные воды, направлено на расширение его оперативного охвата за пределы прибрежных вод в региональные моря. Эта стратегия включает развертывание малых фрегатов, корветов и ракетных катеров, а также усилия по наращиванию потенциала подводных лодок. Цель состоит в защите территориальных претензий, поддержке стратегий асимметричной войны и проецировании ограниченной силы в региональных водах, особенно в Желтом море и Японском море. Такой подход подчеркивает стремление Северной Кореи сбалансировать экономически эффективную модернизацию со своими стратегическими военными целями."
 NKO_revolutionary_military_spirit: "Революционный военный дух"
 NKO_revolutionary_military_spirit_desc: "Концепция Северной Кореи \"Революционный военный дух\" Это ключевая идеология, подчеркивающая непоколебимую лояльность, дисциплину и преданность государству и его руководству. Она служит мотивационной основой для вооруженных сил, поощряя стойкость, самостоятельность и готовность к самопожертвованию перед лицом невзгод. Этот национальный дух лежит в основе военной культуры страны, способствуя единству и решимости в достижении стратегических целей, несмотря на экономические и технологические вызовы. Он отражает интеграцию политической идеологии с военной стратегией как движущую силу оборонных инициатив Северной Кореи."
 NKO_expand_peasant_militia: "Расширить крестьянское ополчение"
 NKO_domestic_naval_strategy: "Внутренняя военно-морская стратегия"
 NKO_domestic_naval_strategy_desc: "Заложить основы современной военно-морской доктрины. Каждому направлению программы — подводным лодкам, ракетным катерам, береговой обороне и силам специальных операций — будет выделена своя доля ресурсов для начала разработки."
 NKO_domestic_submarine_program: "Программа создания отечественных подводных лодок"
 NKO_domestic_submarine_program_desc: "Сосредоточьте усилия бюро на отечественном строительстве подводных лодок. Усовершенствованное производство корпусов и интенсификация подготовки экипажей обеспечат нам бесшумное ударное оружие, необходимое для угрозы врагам далеко от нашего побережья."
 NKO_domestic_destroyer_buildup: "Наращивание внутренних разрушительных сил"
 NKO_domestic_destroyer_buildup_desc: "Серийное производство ракетных катеров и небольших надводных боевых кораблей для нападения на вражеские флоты в прибрежных водах. Наши верфи могут создавать корпуса быстрее, чем Юг может развертывать тяжелые эсминцы."
 NKO_destroyer_unleashed: "Разрушитель на свободе"
 NKO_destroyer_unleashed_desc: "Ввод в строй эсминцев нового поколения, оснащенных более мощными орудиями и специализированными зенитными батареями. Флот наконец-то сможет вести бои в открытом море, а не прятаться у побережья."
 NKO_navy_projects: "Проекты ВМС Северной Кореи"
 NKO_navy_projects_desc: "Программа §YNaval Modernization§! открывает этот этап. Зарабатывайте очки развития флота, принимая решения о финансировании, верфи и использовании двигателя чучхе, а затем тратьте их на следующие направления: §HSubmarine Force§!, §HMissel Boat Flotillas§!, §HCoastal Defense Network§! и §HNaval Special Operations§!, пока все четыре не достигнут §Y100§!."
 NKO_expand_peasant_militia_desc: "Расширение Северной Кореей влияния Крестьянской милиции, известной как Рабоче-Крестьянская Красная гвардия, является стратегическим шагом по укреплению национальной обороны посредством массовой мобилизации. Эта военизированная группировка, состоящая из гражданских лиц, призвана дополнять регулярные военные операции, защищать местные общины и обеспечивать внутреннюю безопасность. Усилия по расширению включают в себя повышение уровня подготовки, оснащение членов милиции легким оружием и их интеграцию в более масштабные военные учения. Такой подход отражает ориентацию Северной Кореи на асимметричную войну и ее \"всенародная защита\" стратегия, обеспечивающая наличие крупных, децентрализованных сил, способных противостоять внешним угрозам и поддерживать внутреннюю стабильность."
 NKO_bolster_young_red_guards: "Укрепить ряды молодых красногвардейцев"
 NKO_bolster_young_red_guards_desc: "Укрепление Молодежной Красной гвардии, северокорейской молодежной военизированной организации, является ключевой инициативой, направленной на привитие идеологической лояльности и военной готовности молодому населению. Это включает в себя повышение уровня военной подготовки, политического воспитания и физической подготовки учащихся, часто с их участием в учениях по национальной обороне. Оснащая Молодежную Красную гвардию базовым вооружением и навыками выживания, Северная Корея обеспечивает постоянный приток идеологически преданных и боеспособных лиц, способных поддерживать регулярные вооруженные силы во время конфликтов. Эта инициатива подчеркивает опору режима на мобилизацию молодежи как часть его стратегии. \"всенародная защита\" стратегия."
 NKO_rebuild_sso: "Реформа спецназа"
 NKO_rebuild_sso_desc: "Реформа северокорейских сил специального назначения направлена ​​на модернизацию и повышение возможностей элитных подразделений для ведения асимметричной войны, нетрадиционных операций и миссий быстрого реагирования. Эта реформа включает в себя улучшение программ подготовки, внедрение передовой тактики и оснащение войск современным вооружением и системами связи. Силы специального назначения призваны преуспевать в проникновении, диверсиях, разведке и прямых боевых действиях, часто нацеленных на стратегические объекты или критически важную инфраструктуру. Реформы направлены на повышение их эффективности в региональных конфликтах, укрепление сдерживания и поддержание готовности к выполнению различных задач высокой степени риска. Этот акцент отражает стратегическую зависимость Северной Кореи от высококвалифицированных и гибких подразделений для компенсации ограничений, связанных с традиционными вооруженными силами."
 NKO_rebuild_kim_il_sung_military_university: "Восстановить Военный университет имени Ким Ир Сена"
 NKO_rebuild_kim_il_sung_military_university_desc: "Военный университет имени Ким Ир Сена, ключевой государственный военный колледж в Пхеньяне, с 1952 года подготовил большое количество лучших командиров страны. С наступлением нового столетия старые объекты этого университета все меньше соответствуют новому стилю ведения войны. Пришло время вернуть этому учебному заведению его былое величие."
 NKO_revolutionary_spirits: "Революционный военный дух"
 NKO_the_green_water_navy: "Морской флот Зеленых Вод"
 NKO_the_green_water_navy_desc: "Этот национальный дух будет §YUpgraded§!, если мы завершим §HNaval Modernization§! приоритетные направления. \n§W--------------§!\nВоенно-морской флот, способный действовать в прибрежных зонах своего государства, имеет ограниченные возможности для действий в окружающих окраинных морях. Это относительно новый термин, созданный для лучшего различения и уточнения двух давно существующих описаний: военно-морской флот, способный действовать в открытом океане (глубоководные воды) и военно-морской флот, способный действовать в прибрежных водах (прибрежные воды и берег)."
 NKO_the_blue_water_navy: "Военно-морской флот"
 NKO_the_blue_water_navy_desc: "Годы расширения верфей, доктринальных реформ и совместных учений превратили наш флот из прибрежных сил в настоящий океанский флот. Теперь мы можем выходить в море далеко за пределы наших берегов, имея экипажи и корпуса, равные любому сопернику в регионе.\n§W--------------§!\nФлот открытого моря — это морская сила, способная к длительным операциям в глубоких водах открытого океана, проецирующая свою мощь далеко за пределы своего побережья."
 NKO_planned_economy: "Плановая экономика"
 NKO_planned_economy_desc: "Северная Корея, официально известная как Корейская Народная Демократическая Республика (КНДР), имеет изолированную и жестко контролируемую командную экономику. В командной экономике планирование и координация осуществляются централизованно правительством, что является стандартным компонентом любой коммунистической страны."
 NKO_the_38th_parallel: "38-я параллель"
 NKO_the_38th_parallel_desc: "В июле 1953 года между двумя Кореями и китайскими добровольцами, а также силами Организации Объединенных Наций было подписано Корейское соглашение о перемирии, устанавливающее демилитаризованную зону по 38-й параллели, разделяющую Северную и Южную Корею. Эта разделительная линия существует уже около 50 лет, и, возможно, настало время двигаться к воссоединению тем или иным способом."
 NKO_the_road_to_peace: "Путь к миру?"
 NKO_the_road_to_peace_desc: "Южная Корея \"Политика прозрачности\" Похоже, это демонстрирует искреннее желание воссоединения. Возможно, настало время для того, чтобы межкорейские товарищи объединили усилия ради воссоединения."
 NKO_the_road_to_war: "Путь к войне"
 NKO_the_road_to_war_desc: "Американские империалисты и их южнокорейские марионетки никогда не смогут допустить подлинного воссоединения Кореи. Воссоединение силой — это вечная истина."
 NKO_end_six_party_negotiations: "Готовое ядерное оружие"
 NKO_end_six_party_negotiations_desc: "Шестисторонние переговоры принесли лишь затягивание процесса. Мы уйдем со стола переговоров и приведем наш ядерный потенциал в состояние полной боевой готовности. Южная Корея, Япония и Соединенные Штаты поймут, что наша безопасность — это не то, за что они могут торговаться."
 NKO_remilitarize_the_dmz: "Ремилитаризировать демилитаризованную зону"
 NKO_remilitarize_the_dmz_desc: "Ремилитаризация демилитаризованной зоны ознаменует собой значительную эскалацию нашего конфликта с Югом, но, несомненно, даст нашим войскам преимущество в предстоящем конфликте."
 NKO_struggle_for_power: "Борьба за власть"
 NKO_struggle_for_power_desc: "Борьба за власть между Ким Чен Ыном и его братом Ким Чен Намом представляла собой тайную борьбу за преемственность внутри правящей семьи Северной Кореи. После смерти их отца Ким Чен Ира оба брата рассматривались как потенциальные кандидаты на пост главы режима. Ким Чен Нам, некогда считавшийся фаворитом, потерял расположение из-за публичной критики режима и ссылки в Макао. Тем временем Ким Чен Ын, поддерживаемый влиятельной элитой, укрепил свои позиции посредством стратегических альянсов и внутренних чисток. Борьба завершилась приходом Ким Чен Ына к власти в 2011 году, что было отмечено загадочным убийством Ким Чен Нама в 2017 году, которое, по мнению многих, было организовано северокорейским правительством. Этот конфликт подчеркнул безжалостный характер властных отношений в одном из самых закрытых режимов мира."
 NKO_orthodox_successor: "Православный Преемник"
 NKO_orthodox_successor_desc: "В 1990-х годах великий генерал Ким Чен Ир выбрал Ким Чен Ына преемником власти благодаря его выдающимся качествам. Любимый товарищ Ким Чен Ын, которого Бог даровал корейскому народу в прошлом, настоящем и будущем, всегда будет защищать безопасность и процветание чучхе-корейской цивилизации."
 NKO_promote_self_reliance: "Содействовать самодостаточности"
 NKO_promote_self_reliance_desc: "Страна никогда не сможет стать богатой и сильной, полагаясь только на других; она может быть сильной только благодаря самодостаточности!"
 NKO_ostracize_kim_jong_nam: "Изгнать Ким Чен Нама"
 NKO_ostracize_kim_jong_nam_desc: "Путем изоляции Ким Чен Нама, чтобы добиться \"отец\" Если мы будем еще больше ему не доверять, у нас будет больше шансов прийти к власти."
 NKO_bribe_kpa_seniors: "Подкупите старшекурсников KPA"
 NKO_bribe_kpa_seniors_desc: "Генералы Корейской народной армии обладают военной властью, и поддержка этих высокопоставленных лиц с большей вероятностью позволит нам взять ситуацию под контроль."
 NKO_oppose_to_chinese_reform_road: "Открыто выступать против китайского пути реформ"
 NKO_oppose_to_chinese_reform_road_desc: "Китайская модель реформ основана на модели коллективного руководства. Если бы этот подход был перенесен в Северную Корею, это неизбежно привело бы к социальному хаосу. И \"father\" тоже этого не поддерживают. Ради сохранения наследия горы Пэкду мы должны открыто противостоять использованию китайской модели реформ."
 NKO_discredit_jang_seong_taek: "Дискредитировать Чан Сон Тхэка"
 NKO_discredit_jang_seong_taek_desc: "Чан Сон Тхэк — известный прокитайский деятель в Северной Корее, а также популярная фигура в окружении отца. Такого предателя, продавшего интересы нации, нельзя терпеть. Для успешного прихода к власти необходимо собрать доказательства его вины и донести на него перед отцом."
 NKO_call_for_change: "Призыв к переменам"
 NKO_call_for_change_desc: "КНДР функционирует в условиях плановой экономики уже почти 50 лет. Но смена власти \"Революции 1989 года\" и \"Трудный марш\" Доказано, что плановая экономика больше не соответствует требованиям нового столетия. Для того чтобы Северная Корея снова стала сильной, необходимы смелые и масштабные реформы."
 NKO_pull_in_young_military_officers: "Привлечение молодых военных офицеров"
 NKO_pull_in_young_military_officers_desc: "Привлечение молодых, открытых к новым идеям офицеров из КНА нам не повредит, поскольку они ближе к рядовым и будут более эффективны в управлении войсками."
 NKO_frame_opposition: "Сформируйте оппозицию"
 NKO_frame_opposition_desc: "Стратегия позиционирования Ким Чен Ына заключается в том, чтобы представить его как безрассудную и дестабилизирующую силу в руководстве Северной Кореи. Подчеркивая его агрессивные чистки, нестабильные решения и отсутствие дипломатической тонкости, мы можем представить его как угрозу как стабильности режима, так и региональной безопасности. Такая позиция будет противопоставлять его действия видению стабильного, рационального руководства, подчеркивая необходимость более сбалансированной и приемлемой на международной арене фигуры. С помощью тщательно продуманных нарративов, целенаправленной риторики и использования свидетельств инсайдеров цель состоит в том, чтобы подорвать его авторитет и повлиять на общественное мнение как внутри страны, так и за рубежом."
 NKO_stir_up_father_son_relations: "Разжигание конфликта между отцом и сыном"
 NKO_stir_up_father_son_relations_desc: "Разжечь конфликт между Ким Чен Ыном и Ким Чен Иром будет непросто, но это даст нам больше поддержки."
 NKO_place_loyalists_in_kpa: "Разместите лоялистов в КНА."
 NKO_place_loyalists_in_kpa_desc: "Двадцать лет назад, когда и Ким Чен Ир, и его сводный брат имели возможность возглавить Северную Корею, поддержка Ким Чен Ира со стороны старых партизан стала ключевым фактором его избрания верховным лидером страны. Теперь, когда Корейская народная армия унаследовала эту должность, мы должны поставить лоялистов в ряды КНА и усилить контроль над ней."
 NKO_finding_reformist_of_party: "Как найти реформатора в партии"
 NKO_finding_reformist_of_party_desc: "Дело не в том, что в партии нет реформаторов, а в том, что они боятся высказываться перед лицом оппозиции Ким Чен Ира. Если мы заручимся их поддержкой, то вероятность смены Чосонского режима значительно возрастет."
 NKO_power_struggle: "Борьба за власть"
 NKO_power_struggle_desc: "Рано или поздно великий лидер Северной Кореи сегодня, товарищ Ким Чен Ир, умрет, и его преемником, несомненно, станет один из его двух сыновей, Ким Чен Нам или Ким Чен Ын. Но \"У страны не может быть двух господ.\"И им обоим нужно найти способы завоевать доверие отца. Поддержка одного кандидата над другим до выбора преемника приведет к... £stability_texticon §YСтабильность§! потеряться.\n\nЕсли у нас нет больше £stability_texticon §YСтабильность§! Более 45% населения считают, что хунта попытается захватить власть после смерти Ким Чен Ира.\n\nТекущий £stability_texticon §YСтабильность§!: [?NKO.stability|1%]\n\nВ настоящее время,\n§OКим Чен Ын§!Православная церковь: §Y[?ROOT.NKO_kim_jong_un]%§!\n§GКим Чон Нам§!Православная церковь: §Y[?ROOT.NKO_kim_jong_nam]%§!\n\n§Y«Избранный преемник» Ким Чен Ира§!: [ROOT.GetChosenSuccessor]\n§RНаиболее вероятный нынешний преемник§!: [ROOT.GetSuccessor]\n\nНаш Лидер, §YКим Чен Ир§!Возможно, он не доживет до 2012 года, поэтому будьте готовы выбрать преемника в будущем. §Y2011§!"
 NKO_1_increase_kim_jong_un_tt: "Поддержка Ким Чен Ына §Yincreases§! на 1%"
 NKO_2_increase_kim_jong_nam_tt: "Поддержка Ким Чен Нама §Yувеличивается§! на 2%"
 NKO_3_increase_kim_jong_un_tt: "Поддержка Ким Чен Ына §Yувеличивается§! на 3%"
 NKO_3_increase_kim_jong_nam_tt: "Поддержка Ким Чен Нама §Yувеличивается§! на 3%"
 NKO_2_5_increase_kim_jong_un_tt: "Поддержка Ким Чен Ына §Yувеличивается§! на 2% ~ 5%"
 NKO_2_5_increase_kim_jong_nam_tt: "Поддержка Ким Чен Нама (§Yincreases§!) выросла на 2–5%."
 NKO_5_decrease_kim_jong_un_tt: "Поддержка Ким Чен Ына §Yуменьшается§! на 5%"
 NKO_2_decrease_kim_jong_nam_tt: "Поддержка Ким Чен Нама §Yуменьшается§! на 2%"
 NKO_3_decrease_kim_jong_un_tt: "Поддержка Ким Чен Ына §Yуменьшается§! на 3%"
 NKO_4_increase_kim_jong_nam_tt: "Поддержка Ким Чен Нама §Yувеличивается§! на 4%"
 NKO_5_increase_kim_jong_nam_tt: "Поддержка Ким Чен Нама §Yувеличивается§! на 5%"
 NKO_kim_jong_il_death: "Смерть Ким Чен Ира"
 NKO_kim_jong_il_death_desc: "\n--------------\nЭтот фокус будет  §YРазблокировать§! в  §Y8:30 утра 17 декабря 2011 года§! В центре внимания. Любимый Великий Вождь, основатель Корейской Народной Демократической Республики и вечный Президент Республики Ким Чен Ир скончался в 8:30 утра 17 декабря 2011 года от острого инфаркта миокарда, осложненного кардиогенным шоком, по пути на поезде в местный регион."
 NKO_junta: "Переворот хунты"
 NKO_junta_desc: "Успешные реформы в Китае и Вьетнаме послужили нам хорошим примером, но их реформы не были гладкими. Если бы наши собственные реформы провалились, мы бы погибли и были бы аннексированы Югом. И Ким Чен Ын, и Ким Чен Нам стремятся к реформам разного уровня. Нам придётся сделать самый трудный выбор, чтобы не потерять ни нашу страну, ни нашу партию..."
 NKO_preserve_songun: "Сохраним Сонгун"
 NKO_preserve_songun_desc: "Сонгун — это основа армии, и мы должны отстаивать её идеологию."
 NKO_entrench_military_authority: "Окопная военная власть"
 NKO_entrench_military_authority_desc: "Хотя мы использовали армию для захвата власти у династии Ким, в армии всё ещё есть лояльные Киму люди, и мы будем использовать нашу армию. \"означает\" чтобы убедить их..."
 NKO_smash_black_market: "Разгромите \"Market\""
 NKO_smash_black_market_desc: "Силы, действующие в рамках механизма \"market\", наносят огромный ущерб нашей стране, и их необходимо немедленно остановить!"
 NKO_determining_the_loyalty_of_army: "Определение лояльности армии"
 NKO_determining_the_loyalty_of_army_desc: "Теперь мы можем повысить в должности некоторых наших верных сторонников и сделать их более покорными нам."
 NKO_purge_dissenters: "Изгнать инакомыслящих"
 NKO_purge_dissenters_desc: "Для поддержания стабильности в стране в этот критический момент перехода власти мы должны немедленно арестовать всех потенциальных диссидентов!"
 NKO_crush_the_kims: "Казнь Кимов"
 NKO_crush_the_kims_desc: "Сохранение в живых сыновей Ким Чен Ира в конечном итоге является дестабилизирующим фактором, казните их тайно!"
 NKO_constrain_the_donju: "Ограничьте действия Донджу"
 NKO_constrain_the_donju_desc: "Фонд Донджу и раньше вносил небольшой вклад в экономическое развитие нашей страны, продолжайте поддерживать его деятельность..."
 NKO_end_the_donju: "Ужесточение мер по борьбе с контрабандой"
 NKO_end_the_donju_desc: "Контрабанда является уголовным преступлением, и, несмотря на ее вклад в экономику страны, пришло время раз и навсегда искоренить этих нарушителей закона."
 NKO_high_pressure_politics: "Политика высокого давления"
 NKO_high_pressure_politics_desc: "Народное недовольство достигло таких масштабов, что нам приходится применять силу для сохранения нашей власти."
 NKO_empower_the_state_security_department: "Уполномочить Главное разведывательное управление"
 NKO_empower_the_state_security_department_desc: "Теперь нам необходимо уполномочить Главное разведывательное управление вооруженных сил взять на себя более широкие обязанности и стать доминирующим разведывательным агентством страны. Главное разведывательное управление будет выявлять, задерживать и ликвидировать потенциальных диверсантов и империалистических шпионов."
 NKO_chi_military_support: "Китайская военная поддержка"
 NKO_chi_military_support_desc: "Китай — наш вечный брат и союзник. Чтобы выжить на международной арене, нам снова придётся оказаться в объятиях Пекина."
 NKO_chi_invest_resources: "Помощь в добыче ресурсов"
 NKO_chi_invest_resources_desc: "Мы готовы впустить китайские ресурсодобывающие компании на нашу территорию."
 NKO_chi_banks: "Китайские банки"
 NKO_chi_banks_desc: "Мы готовы впустить китайские банки в нашу страну."
 NKO_chi_help_factories: "Китайские заводы"
 NKO_chi_help_factories_desc: "Мы намерены обратиться к правительству Китая за помощью в строительстве новых заводов на нашей территории."
 NKO_chi_huawei: "Сотрудничество с Huawei"
 NKO_chi_huawei_desc: "Корпорация Huawei — одна из самых известных в мире, и мы хотим, чтобы китайское правительство разрешило ей работать на нашей территории."
 NKO_military_collectives: "Правление хунты"
 NKO_military_collectives_desc: "Наш народ не готов принять Запад, нам необходимо продолжать сохранять свою власть."
 NKO_encourage_private_enterprise: "Поощряйте частное предпринимательство."
 NKO_encourage_private_enterprise_desc: "Частное предпринимательство — это будущий двигатель прогресса нашей экономики, и мы намерены его поощрять."
 NKO_market_based_economy: "Рыночная экономика"
 NKO_market_based_economy_desc: "Наша экономическая система принесла нам только проблемы и постоянные кризисы, пора это изменить."
 NKO_reorganising_government: "Реорганизация правительства"
 NKO_reorganising_government_desc: "Пришло время реорганизовать правительство, стране нужно новое правительство."
 NKO_kim_jong_un: "Ким Чен Ын"
 NKO_kim_jong_un_desc: "Ким Чен Ын, преемник Ким Чен Ира, на которого возлагаются большие надежды, рассчитывает провести соответствующие экономические реформы для подъема экономики страны, сохраняя при этом стабильность и единство. Однако он не хочет терять свою прочную власть и высокий статус. \"Родословная горы Пэкду\"..."
 NKO_consolidate_power: "Консолидация энергетики"
 NKO_consolidate_power_desc: ""
 NKO_light_industry_develop: "Развитие легкой промышленности"
 NKO_light_industry_develop_desc: ""
 NKO_criticize_ineptitude: "Критика некомпетентности"
 NKO_criticize_ineptitude_desc: ""
 NKO_improvement_of_people_live: "Улучшение жизни людей"
 NKO_improvement_of_people_live_desc: ""
 NKO_people_support: "Народная поддержка"
 NKO_people_support_desc: ""
 NKO_centralize_power: "Централизация власти"
 NKO_centralize_power_desc: ""
 NKO_root_out_corruption: "Искоренить коррупцию"
 NKO_root_out_corruption_desc: ""
 NKO_formalize_power_structures: "Формализовать властные структуры"
 NKO_formalize_power_structures_desc: ""
 NKO_assassinate_kim_jong_nam: "Убить Ким Чен Нама"
 NKO_assassinate_kim_jong_nam_desc: "Ким Чен Нам всегда будет представлять угрозу стабильности нашего режима, если его не убьют, устраним его любой ценой."
 NKO_appoint_loyalists: "Назначить лоялистов"
 NKO_appoint_loyalists_desc: ""
 NKO_civilian_control_of_the_economy: "Гражданский контроль над экономикой"
 NKO_civilian_control_of_the_economy_desc: ""
 NKO_party_state_army: "Партия, государство, армия"
 NKO_party_state_army_desc: ""
 NKO_party_unchecked: "Вечная партия"
 NKO_party_unchecked_desc: ""
 NKO_eternal_juche_sasang: "Вечный чучхе сасанг"
 NKO_eternal_juche_sasang_desc: ""
 NKO_kim_jong_nam: "Ким Чон Нам"
 NKO_kim_jong_nam_desc: "Ким Чен Нам, старший сын Ким Чен Ира, долгое время был противоречивой фигурой в северокорейской политике. Когда-то считавшийся наследником престола, его публичная критика режима и последующая ссылка сделали его символом несогласия. Выступая за экономические реформы и взаимодействие с международным сообществом, Ким Чен Нам резко контрастирует с традиционалистским подходом своего младшего брата Ким Чен Ына. Его возвращение в Северную Корею может сигнализировать о сдвиге в сторону более открытой политики и потенциальном вызове существующему порядку."
 NKO_face_world: "Встреть мир лицом к лицу"
 NKO_face_world_desc: "Институциональные реформы в стране невозможны без внешней поддержки, поэтому нам необходимо сосредоточиться на дипломатическом аспекте управления и поддерживать хорошие отношения с миром."
 NKO_diplomatic_overtures: "Установление дипломатических отношений со странами"
 NKO_diplomatic_overtures_desc: "Вторым шагом в северокорейской дипломатии является установление официальных дипломатических отношений с различными странами, что облегчит путь реформ в стране."
 NKO_step_up_joint_ventures: "Приглашайте больше к созданию совместных предприятий"
 NKO_step_up_joint_ventures_desc: "Иностранные инвестиции являются каналом, способствующим реформированию нашей экономики, и мы приветствуем их."
 NKO_embrace_the_people: "Обнимите людей"
 NKO_embrace_the_people_desc: "Наша страна не может оставаться закрытой вечно. Пришло время распахнуть объятия, принять наш народ и создать другую Северную Корею."
 NKO_loosen_information_monopoly: "Ослабить информационную монополию"
 NKO_loosen_information_monopoly_desc: "Люди имеют право выражать своё мнение."
 NKO_tone_down_propaganda: "Сокращение официальной огласки"
 NKO_tone_down_propaganda_desc: "В то время как официальные СМИ раньше воплощали волю государства, наши реформы по демократизации не нуждаются в принуждении. \"демократия\" Теперь очередь за ними."
 NKO_end_forced_labor: "Прекратить принудительный труд"
 NKO_end_forced_labor_desc: "Больше никакого принудительного труда, и мы переходим к открытому миру."
 NKO_expand_sezs: "Расширение особых экономических зон"
 NKO_expand_sezs_desc: "Мы не сможем реформировать нашу экономику без помощи специальных экономических зон в Расоне и Кэсоне, и мы можем создать больше специальных экономических зон, чтобы некоторые люди смогли разбогатеть первыми."
 NKO_end_juche: "Конец чучхе"
 NKO_end_juche_desc: "Принципы чучхе не являются панацеей; нам нужна более научная модель руководства."
 NKO_foreign_knowledge: "Внешние исследовательские таланты"
 NKO_foreign_knowledge_desc: "КНДР потеряла много талантливых специалистов из-за своей репрессивной политики последних десятилетий, и для восполнения дефицита кадров нам могли бы понадобиться внешние исследователи."
 NKO_join_the_wto: "Вступить во ВТО"
 NKO_join_the_wto_desc: "Слишком долго мы были исключены из глобальных торговых преимуществ, которыми пользуются члены Всемирной торговой организации. Теперь, когда мы это изменим, мы сможем лучше использовать механизмы западного либерального экономического порядка в интересах наших реформ."
 NKO_preserve_the_party: "Сохранение лидерства Трудовой партии Кореи"
 NKO_preserve_the_party_desc: "Реформы и открытость — это не то же самое, что свержение руководства Рабочей партии, что может привести народ к светлому и процветающему будущему."
 NKO_appeal_to_the_youth: "Обращение к молодежи"
 NKO_appeal_to_the_youth_desc: "Именно молодежь является опорой наших реформ."
 NKO_the_choson_dream: "Мечта о падшем"
 NKO_the_choson_dream_desc: "\"Choson Dream\" — это новая концепция, представленная президентом [NKO.GetLeader], которая воплощает личные и национальные цели корейской нации. Она охватывает стремления во многих различных областях, включая экономическую, политическую и международную сферы."
 NKO_democracy_with_north_characteristics: "Демократия с северокорейской спецификой"
 NKO_democracy_with_north_characteristics_desc: "Демократия западного образца не совсем подходит для КНДР, и КНДР нуждается в собственной демократии, характерной именно для КНДР."
 NKO_people_before_party: "Люди важнее вечеринки"
 NKO_people_before_party_desc: "Народ — хозяин своей страны!"
 NKO_elections: "Местные выборы"
 NKO_elections_desc: "Наши реформы включают демократизацию политической системы, и народ получит право выбирать тех лидеров, которых он хочет видеть у себя."
 NKO_free_expression: "Свобода выражения мнений"
 NKO_free_expression_desc: "Народ Северной Кореи слишком долго подвергался притеснениям в рамках репрессивной политики, и единственной свободой, гарантированной ему, является свобода слова."
 NKO_byungjin: "Бёнджин"
 NKO_byungjin_desc: "Во время Трудного похода мудрый генерал Ким Чен Ир спас нашу страну, приняв следующие меры: \"Сонгун\" политика, направленная на поддержание стабильности. Но теперь, когда экономика страны восстановилась, настало время отказаться от старого подхода, ориентированного на военные действия, и развивать нашу армию и экономику одновременно!"
 NKO_scale_back_spending: "Сокращение государственных расходов"
 NKO_scale_back_spending_desc: ""
 NKO_encourage_consumption: "Поощряйте потребление"
 NKO_encourage_consumption_desc: ""
 NKO_loosen_grip_on_soes: "Ослабьте хватку на SOE (Social Operations Enforcement Service)."
 NKO_loosen_grip_on_soes_desc: ""
 NKO_state_owned_enterprises_competition: "Конкуренция государственных предприятий"
 NKO_state_owned_enterprises_competition_desc: ""
 NKO_resorts_and_tourism: "Курорты и туризм"
 NKO_resorts_and_tourism_desc: "Из-за международных санкций у нас осталось мало способов получить доступ к иностранной валюте. Необходимо развивать туризм, чтобы люди со всего мира могли приехать и увидеть красоту Северной Кореи!"
 NKO_samjiyon: "Самджиён"
 NKO_samjiyon_desc: "Самджиён — это наша великая революционная святыня в Северной Корее. Она имеет такой же статус, как Яньань в Китае. Мы должны усердно работать над её развитием, чтобы люди могли получать больше патриотического образования."
 NKO_incentive_based_economy: "Экономика, основанная на стимулах"
 NKO_incentive_based_economy_desc: "Ослабление централизованного контроля над предприятиями показало результаты. Позволяя менеджерам вознаграждать производительность и оставлять себе долю от производства, государство использует личные интересы в интересах роста, не отказываясь при этом от ключевых позиций в экономике."
 NKO_empower_the_donju: "Расширьте возможности Донджу"
 NKO_empower_the_donju_desc: "Хотя страна не может быть чрезмерно зависима от внешнего мира в своем развитии, без Донджу наша экономика была бы неустойчивой. Дайте им больше прав в пользу торговли, пусть они станут лидерами национальной экономики, и пусть тысячегубый конь корейской экономики бежит!"
 NKO_weaken_the_donju: "Ослабить Донжу"
 NKO_weaken_the_donju_desc: "Переименование и перепродажа китайских и южнокорейских товаров не принесли нашей стране богатства. Нам нужно сосредоточиться на собственных промышленных брендах и позволить северокорейским брендам подняться на вершину мирового рынка!"
 NKO_protect_state_owned_business: "Защитите государственный бизнес"
 NKO_protect_state_owned_business_desc: ""
 NKO_encourage_foreign_investment: "Поощряйте иностранные инвестиции."
 NKO_encourage_foreign_investment_desc: "Несмотря на устойчивость наших отечественных отраслей промышленности, их полный экономический потенциал не может быть раскрыт без иностранных инвестиций. Мы должны предлагать стимулы для привлечения прямых иностранных инвестиций в нашу страну."
 NKO_privatize_means_of_production: "Приватизация средств производства"
 NKO_privatize_means_of_production_desc: ""
 NKO_economy_revival: "Экономическое возрождение"
 NKO_economy_revival_desc: "С окончанием \"Трудный марш\"Пора снова запустить нашу экономику."
 NKO_priorit_for_civilian_industry: "Сосредоточение внимания на гражданской промышленности"
 NKO_priorit_for_civilian_industry_desc: ""
 NKO_priorit_for_army_industry: "В центре внимания – военная промышленность."
 NKO_priorit_for_army_industry_desc: "Военная промышленность имеет для нас жизненно важное значение, как для стимулирования внутреннего экономического спроса, так и для укрепления наших вооруженных сил."
 NKO_arms_trafficking: "Торговля оружием"
 NKO_arms_trafficking_desc: "Зачем постоянно складировать бесчисленное количество оружия? Мы могли бы обменять его на золото."
 NKO_sinuiju: "Специальный административный район Синуиджу"
 NKO_sinuiju_desc: "Синуиджу всегда был важным портом для торговли между Северной Кореей и Китаем. Мы могли бы последовать примеру Китая и его концепции «одна страна, две системы», чтобы сделать его более подходящим для торговли с зарубежными странами."
 NKO_recognition_of_economic_backwardness: "Признание экономической отсталости"
 NKO_recognition_of_economic_backwardness_desc: "Экономика Северной Кореи отстала от времени после \"Трудный марш\"Нам необходимы радикальные реформы."
 NKO_2009_revaluation: "Переоценка"
 NKO_2009_revaluation_desc: "В период Трудного похода наша национальная экономика, и в частности наша денежная система, сильно пострадали. Люди перестали доверять нашей валюте, и повседневная жизнь была наполнена даже бартером. Для изменения этой ситуации нам необходима смелая денежная реформа и переоценка валюты."
 NKO_revaluation_failure: "Неудача переоценки..."
 NKO_revaluation_failure_desc: ""
 NKO_air_koryo: "Эйр Корё"
 NKO_air_koryo_desc: ""
 NKO_reform_of_the_privatisation_of_collective_farms: "Приватизация колхозов"
 NKO_reform_of_the_privatisation_of_collective_farms_desc: "Ослабление контроля над местными колхозами с целью повышения их мотивации к производству."
 NKO_construction_of_hydraulic_facilities: "Строительство гидротехнических сооружений"
 NKO_construction_of_hydraulic_facilities_desc: "Для повышения урожайности сельскохозяйственных культур без чрезмерного использования химических удобрений необходимо построить больше гидротехнических сооружений."
 NKO_free_housing: "Дополнительное бесплатное жилье"
 NKO_free_housing_desc: "Стройте больше квартир, чтобы люди могли позволить себе в них жить!"
 NKO_expand_compulsory_education: "Расширить обязательное образование"
 NKO_expand_compulsory_education_desc: "Образование — это основа сильной нации. Расширение обязательного образования позволит большему числу детей получить доступ к высшему образованию."
 NKO_chollima_speed_desc: "Развитие инфраструктуры является важным шагом на пути к восстановлению нашей экономики, не только для ее экономического развития, но и для военных целей, таких как дороги, способные пропускать тяжелую технику, и железные дороги, способные перевозить ракетные поезда."
 NKO_arduous_march: "Трудный поход"
 NKO_arduous_march_desc: "§RГолод в Северной Корее§! Это был период массового голода, сопровождавшийся общим экономическим кризисом в Северной Корее с 1994 года, также известный как \"Трудный марш\"."
 NKO_dmz_remilitarized: "Ремилитаризация демилитаризованной зоны"
 NKO_dmz_remilitarized_desc: "Ремилитаризация демилитаризованной зоны ознаменует собой значительную эскалацию нашего конфликта с Югом, но, несомненно, даст нашим войскам преимущество в предстоящем конфликте."
 NKO_kor_hostile_action_tt: "В последнее время не наблюдалось враждебных действий."
 NKO_broken_juche: "Нарушенная чучхе"
 NKO_eternal_juche: "Вечная чучхе"
 NKO_marxism_leninism: "Марксизм-ленинизм"
 NKO_democratic_land: "Демократическая страна"
 NKO_songun_junta: "Сонгун"
 NKO_songun_junta_desc: "Сонгун — это политика Северной Кореи. Она требует, чтобы в политике и экономике страны... \"Для КПА всё на первом месте.\"."
 NKO_self_reliance: "Самостоятельность"
 NKO_choson_dream: "Мечта о падшем"
 NKO_anti_tatmadaw_sentiment: "Антинародно-армейские настроения"
 NKO_anti_tatmadaw_sentiment_desc: "Когда Корейская народная армия решила провести масштабную перестановку политической ситуации в Корее, враждебность народа к военному правлению достигла беспрецедентного уровня."
 NKO_simhwajo_sageon_legacy: "Наследие Симхваджо Сагеон"
 NKO_simhwajo_sageon_legacy_desc: "«Симхваджо Сагеон» — это масштабная кампания по чистке, проводимая Ким Чен Иром с целью устранения мужчин его отца Ким Ир Сена в КНДР в период с 1997 по 2000 год. \nНекоторые называли это \"Северокорейская версия маккартизма\" или \"Северокорейская версия Культурной революции\""
 NKO_close_dmz: "Закрыть демилитаризованную зону"
 NKO_close_dmz_desc: ""
 NKO_superiority_of_dprk_model: "Превосходство модели КНДР"
 NKO_superiority_of_dprk_model_desc: ""
 NKO_abolish_life_time_system_for_cadres_in_leadership: "Отменить пожизненную систему оплаты труда для руководящих кадров."
 NKO_abolish_life_time_system_for_cadres_in_leadership_desc: ""
 NKO_allow_donju_to_join_wpk: "Позвольте Донджу присоединиться к Трудовой партии Кореи."
 NKO_allow_donju_to_join_wpk_desc: "Донджу — это просто бизнесмены, которые ведут бизнес законно и платят налоги в соответствии с законом. Почему они не могут присоединиться к Трудовой партии Кореи?"
 NKO_kim_jong_un_successor: "§YКим Чен Ын§! получил трон."
 NKO_kim_jong_nam_successor: "§YКим Чон Нам§! получил трон."
 NKO_chi_propose_trade_agreement_tooltip: "Имеет торговое соглашение с §Y[CHI.GetNameWithFlag]§!\n"
 NKO_russian_friendship: "Российско-северокорейский альянс"
 NKO_russian_friendship_desc: "Россия всегда была одним из наших главных союзников, а СССР тем более вовлечён в наше присутствие и существование. Мы намерены попытаться возобновить союзнические отношения между нашими странами."
 NKO_south_korea_influency_tt: "[KOR.GetFlag] Южнокорейский §HМножитель влияния§! в §Y[ROOT.GetNameWithFlag]§!: §R+5%§!"
 NKO_national_recovery_plan_started_tooltip: "§Y$NKO_national_recovery_plan$§! Завершено более §Y1§! год назад"
 NKO_export.10.a.tt: "Поставляет винтовки §Y, §! и §Y, а также командное оборудование §!, достаточное для §Y трех батальонов легкой пехоты §! (требуется 3 батальона)."
 NKO_export.10.c: "Запросите комплект §YMotorized Infantry§!: винтовки, транспортные средства и командное оборудование."
 NKO_export.10.c.tt: "Поставляет винтовки §Y, транспортные средства §!, служебные машины §Y, командное оборудование §! и §Y, а также командное оборудование §!, достаточное для §Yтрех моторизованных пехотных батальонов §! (требуется 3 батальона)."
 NKO_export.10.e: "Запросите комплект §YArmered§!: основные боевые танки и командное оборудование."
 NKO_export.10.e.tt: "Поставляет основные боевые танки §Y, §! и §Y, а также командное оборудование §!, достаточное для формирования §Y трех бронетанковых батальонов, §! (требуется 3 батальона). Требуется современная северокорейская танковая конструкция."
 NKO_export.10.f: "Запросите комплект §YMechanized Infantry§!: БМП, БТРы, винтовки и командное оборудование."
 NKO_export.10.f.tt: "Поставляет §YIFVs§!, §YAPCs§!, §Yвинтовки§! и §Yкомандное оборудование§!, достаточное для §Yтрех механизированных пехотных батальонов§! (требуется 3 батальона). Требуются современные северокорейские модули техники."
