 aus_china_visit: "Visite d'État en Chine"
 aus_norm_nk: "Normaliser les relations avec la Corée du Nord"
 aus_sk_visit: "Visite d'État de la Corée du Sud"
 aus_tur_visit: "Cérémonie de Gallipoli en Turquie"
 aus_rus_visit: "Visite d'État en Russie"
 aus_eng_visit: "Visite d'État de la monarchie"
 ast_political_decisions: "Décisions politiques"
 ast_political_decisions_desc: "Notre capacité à gérer la nation nous oblige à retrousser nos manches et à graisser quelques pattes de temps à autre. Qu'il s'agisse des géants de l'industrie ou de ceux plus proches du gouvernement, ce que nous faisons dans les coulisses maintient le pays en marche. Ce n'est pas un travail honnête, mais c'est beaucoup."
 ast_approach_the_unions: "Approcher les syndicats"
 ast_approach_the_unions_desc: "None of us like dealing with the unions, but if we're to make any headway with the industries, compromise has to be made. Our efforts on reform depend on it."
 ast_manufacturer_subsidies: "Subventions aux fabricants"
 ast_manufacturer_subsidies_desc: "Les subventions, c'est comme le WD40 des usines. Quand certaines ne tournent pas si rond, on sort les subventions, et on espère qu'elles se remettent en forme."
 ast_cabinet_reshuffle: "Remaniement ministériel"
 ast_cabinet_reshuffle_desc: "Dernièrement le cabinet a pris du retard sur la ligne du parti. Certains sont simplement mal adaptés au poste, d'autres franchement insubordonnés. Heureusement nous pouvons user d'un des rares pouvoirs que nous avons comme chef de parti. En remaniant le cabinet, nous pouvons placer certains de nos choix plus favorables au premier plan, et retirer ceux moins enclins à nous aider."
 ast_loosen_gambling_restrictions: "Assouplir les restrictions de jeu"
 ast_loosen_gambling_restrictions_desc: "A vice among many Australians is gambling. It inhabits almost every vein of our economy in one way or another. In recent years our policies have come down hard on the industry, but we can loosen some of the restrictions slightly to see some short term gains, and make everyone happy."
 ast_revisit_zoning_laws: "Revoir les lois de zonage"
 ast_revisit_zoning_laws_desc: "Currently state government and local councils dictate the 'what, where and how' when building on property. Recently property developers have been hounding us to lift some of the restraints. Revisiting the guidelines could alleviate some of these concerns."
 cdep: "Projets d'emploi pour le développement communautaire"
 cdep_desc: "Le programme original est né d'un désir des communautés indigènes de pouvoir planifier et construire elles-mêmes des projets de développement. Le programme s'est bien poursuivi, mais nous pouvons augmenter la portée des projets en envoyant des spécialistes gouvernementaux et en augmentant le financement disponible."
 nielns: "Stratégie nationale d'alphabétisation et de numératie en anglais pour les indigènes"
 nielns_desc: "Les taux d'alphabétisation des Aborigènes et des Insulaires du détroit de Torrès ont chuté ces dernières années, ce qui, combiné à des taux de fréquentation déjà faibles, semble être une recette pour un désastre. Si nous travaillons avec les écoles pour développer des programmes pour aider les élèves, cela pourrait changer beaucoup de vies."
 fam_violence_proj: "Projets de prévention de la violence familiale"
 fam_violence_proj_desc: "La violence familiale était la vérité moche que peu de politiciens voulaient aborder dans les années 90. De nouvelles approches fondées sur des preuves ont rendu le processus plus clinique et moins une responsabilité politique, donc les financer est une étape facile pour nous."
 construct_recon_place: "Construire le lieu de la réconciliation"
 construct_recon_place_desc: "Un certain nombre de propositions d'aménagement urbain ont été rédigées et déposées sur notre bureau pour approbation. Le chef de file est le lieu de la réconciliation à Canberra. S'il est approuvé, il pourrait être un merveilleux témoignage de nos efforts."
 repatriate_remains: "Rapatrier les restes indigènes"
 repatriate_remains_desc: "Ce n'est un secret pour personne que les musées britanniques abritent un certain nombre d'objets pillés dans d'autres pays. Parmi ceux-ci figurent des restes humains. Un certain nombre de groupes indigènes ont demandé le retour des restes en Australie pour les enterrer."
 mabo_referendum: "Référendum sur l'état de la réconciliation"
 mabo_referendum_desc: "Amending the constitution to formally include a Statement of Reconciliation in the constitution's preamble, recognising Indigenous Australian rights to their land."
 ast_walk_the_journey_tt: "Programs and actions relating to our reconciliation effort will be unlocked in the Political §2Decisions§! tab."
 mabo_vibe_tt: "Le référendum sur l'état de la réconciliation sera disponible dans les §2décisions§!."
 ast_strong_in_difference_1_ast: "Multiculturalisme géré"
 the_lucky_country_ast: "Le pays chanceux"
 the_lucky_country_ast_desc: "Des années d'expansion des opérations minières et d'un manque d'innovation dans d'autres secteurs nous ont rendus dépendants de notre économie d'exportation. Nos conglomérats doivent creuser profondément et prendre leur part si nous voulons prospérer ici. Soit cela, soit quelque chose doit changer."
