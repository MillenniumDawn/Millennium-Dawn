 CHI_semiconductor_backwardness_1: "Dependencia tecnológica"
 CHI_semiconductor_backwardness_1_desc: "La industria de semiconductores de China sigue siendo estructuralmente dependiente de las fundiciones, el software de diseño y los equipos de fabricación extranjeros. Las fundiciones nacionales operan con un retraso de dos a tres generaciones respecto a la frontera tecnológica, las empresas de diseño carecen de cadenas de herramientas EDA maduras y ninguna firma nacional de equipos puede suministrar litografía avanzada. Esta brecha frena la construcción de plantas de chips nacionales y la producción de fundición, y limita tanto la electrónica civil como la cadena de suministro de electrónica militar.\n§W--------------§!\nEste espíritu nacional §GMejorará§! si completamos el enfoque §Y$CHI_naura_amec$§!."
