 CHI_054a_production_line: "Производственная линия 054A"
 CHI_054a_production_line_desc: "Каждому флоту нужна «рабочая лошадка», и у нас ею является фрегат типа 054A. Построенный в рамках длительной непрерывной серии с 2008 года, этот способный и доступный по цене фрегат стал стандартным кораблём сопровождения ВМС, а также был отправлен в Аденский залив, когда в том же году Китай присоединился к патрулированию по борьбе с пиратством — это стало его первой длительной миссией в дальних водах."
 CHI_45g_national_deployment: "Развертывание сети 5G"
 CHI_45g_national_deployment_desc: "China Mobile запускает коммерческую сеть 4G, и уже через три года у нас становится больше базовых станций, чем во всем остальном мире вместе взятом. Министерство промышленности и информационных технологий (MIIT) выдает лицензии на 5G всем трем операторам, и к тому времени, когда западные операторы только обсуждают свои стратегии развертывания, мы уже эксплуатируем 4,1 миллиона базовых станций 5G, обслуживающих один миллиард пользователей. Разрыв в инфраструктуре — это уже не то, что мы сокращаем; это то, что мы полностью преодолели."
 CHI_863_ic_preparatory_research: "863 Programme IC Preparatory Research"
 CHI_863_ic_preparatory_research_desc: "В рамках Государственного плана развития высоких технологий проектирование и производство интегральных схем определены в качестве приоритетной области. Государственное финансирование направляется в университетские исследовательские центры и пилотные проекты по производству микросхем на ранней стадии развития в дельте реки Чжуцзян и Шанхае, что позволяет заложить основу в виде кадрового потенциала и цепочки поставок, которую Национальный фонд по производству интегральных схем впоследствии масштабирует до уровня промышленного производства. Мы сеем семена в почву, урожай с которой будет собран только через десятилетие."
 CHI_863_nev_program: "863 Programme NEV Track and Ten Cities"
 CHI_863_nev_program_desc: "Ван Ган, инженер, ставший министром, который проработал девять лет в компании Audi, прежде чем вернуться в Китай, утверждал, что мы можем полностью обойти этап двигателей внутреннего сгорания. В рамках программы «Десять городов — тысяча автомобилей» в пилотных городах внедряются парки общественного транспорта, состоящие из новых энергетических транспортных средств (NEV); Шэньчжэнь переводит на электричество весь свой парк автобусов и такси. Шанхайский «Гигафабрика» компании Tesla, построенная за 357 дней с момента закладки фундамента, стала катализатором, вынуждающим всех китайских производителей электромобилей конкурировать по качеству и скорости производства. Мы и не должны были ожидать ничего меньшего от рынка, который сами же и создали."
 CHI_a_lighter_touch_on_dissent: "Более мягкий подход к инакомыслию"
 CHI_a_lighter_touch_on_dissent_desc: "Вместо того чтобы усиливать внутреннее давление, мы предоставляем гражданскому обществу ограниченное пространство для самовыражения и интеллектуальных дискуссий в рамках тщательно контролируемых границ. Такой подход позволяет в обмен на краткосрочный политический контроль снизить уровень напряженности, который подталкивает людей к подпольной деятельности."
 CHI_abolish_term_limits: "Abolition of Term Limits"
 CHI_abolish_term_limits_desc: "Всекитайское собрание народных представителей проголосовало 2 958 голосами «за», 2 — «против» и 3 — «воздержались» за исключение из конституции ограничения на два срока полномочий президента страны. Формально голосование было единогласным, хотя по сути это не так. Власть больше не ограничивается конституционными сроками. Это решение устраняет самое значительное институциональное ограничение личной власти со времени реформ, проведенных после смерти Мао."
 CHI_above_the_neck_reform: "Reform Above the Neck"
 CHI_above_the_neck_reform_desc: "Прежние семь военных округов подчинялись Сухопутным войскам и вели свои собственные войны. В 2016 году мы сначала провели реформу «выше шеи»: Центральная военная комиссия взяла на себя непосредственное командование, на смену округам пришли пять театральных командований, а для ведения боевых действий единым фронтом был создан Объединённый штаб. Командование прежде чем войска, голова прежде чем тело."
 CHI_active_defense_doctrine: "Active Defense"
 CHI_active_defense_doctrine_desc: "«Активная оборона» является руководящей стратегией армии со времён Мао: стратегически оборонительная, но на оперативном и тактическом уровнях — наступательная. Мы совершенствуем её с учётом требований ракетной эпохи, исходя из того, что самый надёжный способ защитить родину — нанести удар по передовому отряду противника ещё до того, как он достигнет цели."
 CHI_African_Continental_Integration: "Chinese-African Century"
 CHI_African_Continental_Integration_desc: "Мы стали крупнейшим отдельным торговым партнером Африки, при этом объем двусторонней торговли превышает 254 миллиарда долларов в год. Благодаря десятилетиям инвестиций в рамках инициативы «Один пояс, один путь» в порты, железные дороги и особые экономические зоны наша инфраструктура и капитал стали незаменимыми для реализации программы континентальной интеграции Африканского союза. Настало время преобразовать этот экономический вес в прочное институциональное партнерство."
 CHI_agricultural_tax_abolition: "Abolition of the Agricultural Tax"
 CHI_agricultural_tax_abolition_desc: "«Проблема Саньнун» — сельское хозяйство, сельская местность, крестьяне — приобрела взрывоопасный характер в сельских районах Китая задолго до того, как официальная дискуссия по этому вопросу дошла до Пекина. Пилотный проект по реформе сельских налогов, реализованный в провинции Аньхой, продемонстрировал, насколько сильно бремя местных сборов сдерживало доходы крестьян и инвестиции в сельское хозяйство. Документ Центрального комитета № 1 в течение десяти лет подряд возвращался к вопросу о сельских районах. Отмена Постановления о сельскохозяйственном налоге 1958 года освобождает сельский капитал, который десятилетиями ждал возможности поступить в Центральные равнины провинции Хэнань, рисовый пояс провинции Хунань и бассейн провинции Сычуань."
 CHI_AIIB_Founding: "Asian Infrastructure Investment Bank"
 CHI_AIIB_Founding_desc: "Азиатский банк инфраструктурных инвестиций, который мы основали с участием 57 государств-членов, несмотря на яростное сопротивление со стороны Вашингтона, предоставляет многостороннее финансирование инфраструктурных проектов в Азии и за её пределами. Его существование доказывает, что мы можем создавать авторитетные международные институты полностью вне рамок Бреттон-Вудской системы. Западная монополия на финансирование развития сломана."
 CHI_An_Alliance_to_Rival_NATO_tt: "§YEffects will be shown, once we establish our faction§!"
 CHI_anshan_steel_modernization: "Anshan Steel Complex Modernisation"
 CHI_anshan_steel_modernization_desc: "«Аншанская металлургическая группа» — старейший и крупнейший в Китае интегрированный металлургический комплекс — реализует масштабную программу модернизации. Устаревшие печи открытого типа заменяются кислородными печами, что позволяет сократить затраты и повысить максимальный уровень качества продукции, производимой на последующих этапах производства."
 CHI_ant_group_empire: "Ant Group's Financial Empire"
 CHI_ant_group_empire_desc: "Ant Group, выделенная из состава Alibaba, создает финансовую империю, включающую Yu'ebao, Zhima Credit, Huabei и MYbank, а также оказывает поддержку международным платформам Paytm, GCash и Dana. Джек Ма публично бросил вызов государственным банкам на саммите Bund Summit, сравнив их с ломбардами. Спустя несколько дней Китайская комиссия по регулированию ценных бумаг (CSRC) и Государственное управление по регулированию монополий (SAMR) приостановили IPO Ant на сумму 34 миллиарда долларов за 48 часов до его запуска. Отношения между сектором платформ и государством изменились, и каждый руководитель технологической компании в стране понимает, что это означает."
 CHI_anti_japanese_boycott_campaign: "Anti-Japanese Boycott Campaign"
 CHI_anti_japanese_boycott_campaign_desc: "Народ в ярости. Мы не вызвали эту ярость. Мы просто решили не препятствовать ей — до тех пор, пока не решим иначе."
 CHI_Arab_League_Cooperation_Forum: "China-Arab States Forum"
 CHI_Arab_League_Cooperation_Forum_desc: "Форум сотрудничества между Китаем и арабскими государствами собирает министров иностранных дел всех 22 стран-членов Лиги арабских государств для координации проектов в рамках инициативы «Один пояс, один путь», торговой политики и политического взаимодействия. Благодаря этому форуму мы поддерживаем постоянный институциональный канал связи с Ближним Востоком, полностью обходящий механизмы, возглавляемые Западом. Арабские государства получают рычаги влияния на своих традиционных партнёров благодаря демонстрируемому доступу к нашему капиталу, а мы получаем блок, голоса которого следуют нашему примеру."
 CHI_arms_for_influence: "Arms for Influence"
 CHI_arms_for_influence_desc: "Каждая экспортная ящик приносит не только деньги. Мы поставляем оружие клиентам, с которыми ни один западный поставщик не свяжется, и получаем в обмен на это поддержку в портах, голоса избирателей и лояльность, превращая торговлю оружием в незаметный инструмент внешней политики."
 CHI_army_aviation_corps: "The Army Aviation Corps"
 CHI_army_aviation_corps_desc: "Армия, не способная летать, не может наносить быстрые удары. Мы укрепляем армейскую авиацию за счёт ударного вертолёта З-10 и транспортного вертолёта З-20, обеспечивая бригады быстрого реагирования собственными боевыми вертолётами и транспортными средствами, что позволяет им преодолевать препятствия на местности и высаживать войска в тылу противника."
 CHI_army_reorganisation: "Reorganise the Army"
 CHI_army_reorganisation_desc: "Тринадцать новых групповых армий сбалансированы и перенумерованы; каждая из них сформирована из общевойсковых бригад, а не из громоздких дивизий. Сухопутные войска стали более компактными, модульными и, наконец, взаимозаменяемыми, способными сосредотачиваться или рассредоточиваться в зависимости от потребностей боевых действий."
 CHI_artillery_modernisation: "Modernise the Artillery"
 CHI_artillery_modernisation_desc: "Орудия эффективны ровно настолько, насколько эффективна система, которая ими управляет. Радар противобатарейного обнаружения, цифровая система управления огнем и высокоточные снаряды превращают артиллерию из оружия площадного поражения в «скальпель», наносящий точный удар уже с первой залпом."
 CHI_assuage_japanese_concerns: "Assuage Japanese Concerns"
 CHI_assuage_japanese_concerns_desc: "Они следят за нашей береговой охраной. Они следят за нашими ракетными испытаниями. Поэтому, когда мы публично отменяем учения, они это замечают."
 CHI_astana_speech: "Silk Road Economic Belt"
 CHI_astana_speech_desc: "В выступлении в Университете Назарбаева в Астане было предложено «совместно создать экономический пояс вдоль Шелкового пути», связывающий нас с Европой через Центральную Азию. В сочетании с «Морским Шелковым путем XXI века», объявленным в следующем месяце в Индонезии, инициатива «Пояс и путь» обретает конкретные очертания. Финансирование инфраструктуры, концессии на порты и железнодорожные контракты должны теперь распространяться из Пекина в таких масштабах, которые изменят мировой порядок."
 CHI_avic_reunification: "Reunify AVIC"
 CHI_avic_reunification_desc: "Разделенная в 1999 году на две соперничающие части с целью стимулирования конкуренции, авиационная отрасль научилась лишь дублировать усилия и ссориться. В 2008 году AVIC I и AVIC II вновь объединены в единую Корпорацию авиационной промышленности, под одной крышей которой собраны истребители, двигатели и авионика, которых ВВС ждали десятилетиями."
 CHI_Back_Channel_to_Foggy_Bottom: "Back Channel to Foggy Bottom"
 CHI_Back_Channel_to_Foggy_Bottom_desc: "Китайская и американская дипломатические делегации налаживают конфиденциальный неформальный канал связи через задние комнаты посольств и посредников «второго трека». Обе стороны в частных беседах признают, что корейский вопрос невозможно решить без взаимных уступок."
 CHI_banking_recapitalisation: "Banking Sector Recapitalisation"
 CHI_banking_recapitalisation_desc: "В период кредитного бума 1990-х годов наш банковский сектор накопил огромный объем проблемных кредитов. Нам необходимо влить государственный капитал, чтобы списать эти обязательства с балансов государственных банков, а затем разместить акции реструктурированных банков на Гонконгской фондовой бирже. За этим последуют появление иностранных миноритарных акционеров и внедрение международных стандартов бухгалтерского учета, что придаст нашей финансовой системе тот авторитет, которого ей сейчас не хватает."
 CHI_baosteel_ipo: "The Baosteel IPO"
 CHI_baosteel_ipo_desc: "Компания «Баошань Ирон энд Стил» вышла на Шанхайскую фондовую биржу в рамках крупнейшего на тот момент первичного публичного размещения акций в нашей истории, привлекшего 7,7 млрд юаней. Основанная на основе технологий, полученных по лицензии от Nippon Steel, компания Baosteel поглотила Shanghai Metallurgical Holding и Meishan в рамках проводимой Чжу Жунцзи политики «укрепления крупных и освобождения мелких». Её интеграция производства высококачественного автомобильного листа и электротехнической ленты стала эталоном для модернизирующейся сталелитейной отрасли Китая."
 CHI_baowu_merger: "The Birth of Baowu Steel"
 CHI_baowu_merger_desc: "В результате слияния Baosteel Group и Wuhan Iron and Steel Corporation образовалась China Baowu Steel Group, что стало основой нашей стратегии по созданию национальных лидеров сталелитейной отрасли, способных конкурировать на мировом уровне. Под руководством председателя Чэнь Дэруна компания «Баову» впоследствии приобрела «Мааншань Ирон энд Стил», «Тайюань Ирон энд Стил», «Чунцин Ирон энд Стил» и «Синьцзян Байи Ирон энд Стил». Производя более 115 миллионов тонн в год, «Баову» обогнала «АрселорМиттал» и стала крупнейшим в мире производителем стали."
 CHI_bat_platform_rise: "The BAT Rises"
 CHI_bat_platform_rise_desc: "«Байду», «Алибаба» и «Тенцент» определяют облик нашего интернета. «Байду» доминирует в сфере поиска после ухода «Google»; «Алибаба» создала крупнейшую в мире экосистему электронной коммерции; приложение «WeChat» от «Тенцент» насчитывает 1,3 миллиарда пользователей. Политическая среда, не допускавшая западных конкурентов на рынок, не создала эти компании, но дала им пространство для роста, не подвергаясь поглощению или уничтожению со стороны капитала Кремниевой долины. Это пространство было стратегическим выбором, и оно оказалось правильным."
 CHI_bayan_obo_ree_group: "Bayan Obo and China Rare Earth Group"
 CHI_bayan_obo_ree_group_desc: "Дэн Сяопин заметил, что на Ближнем Востоке есть нефть, а у нас — редкоземельные элементы. Месторождение Баян-Обо в Баотоу (Внутренняя Монголия), разработка которого ведётся компанией «China Northern Rare Earth Group», является крупнейшим в мире месторождением лёгких редкоземельных элементов; рудники в Ганьчжоу (провинция Цзянси) поставляют тяжёлые редкоземельные элементы, включая диспрозий и тербий. Министерство промышленности и информационных технологий (MIIT) объединило шесть региональных производителей в «China Rare Earth Group» и «China Northern Rare Earth Group». Экспортные квоты, официально отмененные после решения ВТО, возвращаются в виде экспортных лицензий и производственных квот, которые обеспечивают тот же эффект. Мы должны использовать этот рычаг, пока другие не найдут заменителей."
 CHI_Beidou_Latin_Constellation: "Beidou Latin Constellation"
 CHI_Beidou_Latin_Constellation_desc: "Наземные станции нашей навигационной системы «Бэйдоу» в Аргентине и Венесуэле позволяют расширить зону действия этой системы на Западное полушарие и снизить региональную зависимость от инфраструктуры GPS США. Эти объекты двойного назначения обеспечивают выполнение гражданских контрактов в сфере сельского хозяйства и геодезии, одновременно предоставляя нам стратегические данные о местоположении. Вашингтон рассматривает эти объекты как прямой вызов своему доминированию в сфере радиоразведки в Северной и Южной Америке, и Вашингтон прав."
 CHI_beijing_action_plan_green_olympics: "Green Olympics Action Plan"
 CHI_beijing_action_plan_green_olympics_desc: "В нашей заявке на проведение Олимпийских игр мы пообещали МОК организовать экологически ответственное зрелище. Теперь мы должны выполнить это обещание: провести широкомасштабное лесопосадки, перевести систему централизованного теплоснабжения Пекина с угля на газ, перенести промышленные предприятия за пределы столицы, ужесточить нормы выбросов транспортных средств, а также построить спортивные объекты в шести городах. Весь мир будет следить за этим."
 CHI_beijing_command_clique: "The Beijing Command Clique"
 CHI_beijing_command_clique_desc: "Провинциальные клики стекаются в столицу. Сеть подкупленных генералов захватывает органы командования в самом Пекине, так что ни одно повышение, ни один контракт, ни одно назначение не обходится без её одобрения и отчисления ей своей доли."
 CHI_Beijing_Communique: "Beijing Peace Communique"
 CHI_Beijing_Communique_desc: "Мы позиционировали себя в качестве посредника в процессе исторической нормализации отношений между Саудовской Аравией и Ираном, добившись от двух региональных соперников восстановления дипломатических связей при нашем посредничестве. Это коммюнике демонстрирует, что мы способны достигать таких геополитических результатов, которых Вашингтон не может или не хочет достигать, укрепляя тем самым наш авторитет в качестве альтернативного гаранта безопасности. Общественное мнение в регионе сейчас заметно склоняется в пользу нашего дипломатического лидерства, и нам следует использовать это преимущество."
 CHI_beijing_tianjin_hsr: "Beijing-Tianjin High-Speed Rail"
 CHI_beijing_tianjin_hsr_desc: "Межгородская железнодорожная линия Пекин—Тяньцзинь протяженностью 117 километров, позволяющая преодолевать это расстояние за 30 минут со скоростью 350 км/ч, ознаменовала начало расширения сети высокоскоростных железных дорог Китая. Технологии, лицензированные у компаний Kawasaki, Siemens, Alstom и Bombardier, были освоены и адаптированы к местным условиям компаниями «Южно-Китайская железная дорога» и «Северо-Китайская железная дорога», которые впоследствии объединились, образовав компанию CRRC. Столкновение в Вэньчжоу стало поводом для снижения скорости до 300 км/ч и ужесточения стандартов качества. Протяженность сети в настоящее время превышает 40 000 км, и мы только начали строительство."
 CHI_below_the_neck_disband: "Disband Below the Neck"
 CHI_below_the_neck_disband_desc: "После реорганизации высшего командования внимание переключается на оперативно-боевую структуру. С апреля 2017 года в рамках реформ «ниже шеи» корпуса преобразуются в общевойсковые бригады, сокращается численность личного состава на триста тысяч человек, а армия переходит от массированной к маневренной тактике. Целые армии исчезают из списков, чтобы оставшиеся подразделения могли действительно вести боевые действия."
 CHI_Belt_and_Road_Vision: "Belt and Road Initiative"
 CHI_Belt_and_Road_Vision_desc: "Запустить инициативу «Пояс и путь», инвестировав сотни миллиардов в инфраструктурные проекты, связывающие Азию, Африку и Европу с Китаем с помощью автомобильных и железных дорог, портов и цифровых сетей."
 CHI_Bide_Your_Time: "Hide Your Strength, Bide Your Time"
 CHI_Bide_Your_Time_desc: "Следуйте принципу Дэн Сяопина. Избегайте конфронтации, налаживайте экономические связи и незаметно наращивайте всестороннюю национальную мощь. Подъем Китая не должен провоцировать создание коалиции против него."
 CHI_big_four_ipo: "The Big Four IPO Wave"
 CHI_big_four_ipo_desc: "Наши государственные банки завершают беспрецедентную волну листингов. Китайский строительный банк привлек в Гонконге 9,2 млрд долларов США; одновременный двойной листинг ICBC в Гонконге и Шанхае установил мировой рекорд — 21,9 млрд; Китайский сельскохозяйственный банк превзошел его, привлекая 22,1 млрд. В настоящее время ICBC является крупнейшим банком мира по совокупным активам, а «большая четверка» вошла в список глобально системно значимых банков, составленный Советом по финансовой стабильности. Компания «Централ Хуйцзинь Инвестмент» по-прежнему является доминирующим акционером каждого из них."
 CHI_big_fund_phase2: "Big Fund Phase II"
 CHI_big_fund_phase2_desc: "В рамках второго этапа реализации Национального фонда интегральных схем привлечено 200 млрд юаней, которые будут направлены на закупку оборудования, материалов и передовых технологий упаковки для устранения пробелов в цепочке поставок, выявленных в результате санкций США. За этим последует третий этап с объемом финансирования более 300 миллиардов юаней — крупнейшая в истории полупроводниковой отрасли единичная мобилизация капитала. Стратегия сместилась с расширения производственных мощностей на полную вертикальную интеграцию: от сырой пластины до готового SoC — каждый этап производственного цикла будет обеспечиваться за счет отечественных ресурсов или разработок. Только это обеспечит нам необходимую безопасность."
 CHI_big_fund_phase_1: "Semiconductor Industry Investment Fund"
 CHI_big_fund_phase_1_desc: "Государственный совет издал документ № 18, в котором полупроводниковая отрасль определена как стратегическая. Национальный инвестиционный фонд по развитию отрасли интегральных схем — «Большой фонд» — привлек 138,7 млрд юаней в ходе первого раунда закрытия, положив начало мобилизации капитала под руководством государства в сферах производства микросхем, проектирования и оборудования. Мы направляем средства в SMIC, Huawei HiSilicon и целую сеть провинциальных фондов совместного инвестирования. Мы больше не можем позволить себе технологическую зависимость от TSMC и ASML, и этот фонд является нашим заявлением о намерениях."
 CHI_blue_granary_aquaculture: "The Blue Granary"
 CHI_blue_granary_aquaculture_desc: "Наш сектор аквакультуры производит 52 миллиона тонн в год, что составляет примерно 60 процентов мирового объема производства и 80 процентов нашего собственного улова водных ресурсов. В дельте реки Чжуцзян в провинции Гуандун расположена самая плотная в мире сеть прудов для разведения тилапии; на побережье Нинбо-Чжоушань в провинции Чжэцзян сосредоточено производство креветок и крабов. Экспериментальные глубоководные садки для лосося в Желтом море превращают прибрежные сельскохозяйственные районы в центры экспорта белковой продукции, хотя чрезмерное использование антибиотиков и эвтрофикация озера Тай остаются нерешенными экологическими проблемами, которые мы не можем игнорировать бесконечно."
 CHI_bow_to_china_dream: "Bow to the China Dream"
 CHI_bow_to_china_dream_desc: "Когда разражается антикоррупционная буря, альянс сгибается, но не ломается. Клика громко заявляет о своей преданности «Китайской мечте» Си Цзиньпина, сдает на расправу символическое число людей и покупает себе выживание, променяв открытое разграбление на более незаметные привилегии."
 CHI_break_the_first_island_chain: "Break the First Island Chain"
 CHI_break_the_first_island_chain_desc: "Эта цепь простирается от Кюсю через острова Рюкю до Тайваня. На протяжении сорока лет она сдерживала наш флот в прибрежных водах. Цепь разорвется там, где сломается самое слабое звено. И это звено сломается."
 CHI_BRI_Forum_Beijing: "Belt and Road Forum for Cooperation"
 CHI_BRI_Forum_Beijing_desc: "Форум международного сотрудничества «Пояс и путь», проходящий в Пекине и набирающий масштабы с каждым новым заседанием, собирает глав государств и высокопоставленных должностных лиц из более чем 100 стран для координации планов реализации проектов, подписания рамочных соглашений и демонстрации нашего лидерства в глобальной повестке дня в области развития. Ни одна другая страна не способна собрать такое количество участников за своим столом."
 CHI_byd_catl_integration: "Build Your Dreams"
 CHI_byd_catl_integration_desc: "Компания BYD под руководством Ван Чуаньфу, основанная в Шэньчжэне как производитель аккумуляторов, прекратила выпуск автомобилей с исключительно двигателями внутреннего сгорания, а её технология «Blade Battery» (от элементов до аккумуляторного блока на основе литий-железо-фосфата) устанавливает новые стандарты безопасности и стоимости. Компания CATL со штаб-квартирой в Нинде воспользовалась правительственным «белым списком» производителей аккумуляторов, чтобы на достаточно длительный срок оттеснить Panasonic, LG и Samsung SDI и занять непоколебимую позицию. В совокупности эти две компании в настоящее время контролируют более 60 процентов мирового производства аккумуляторов для электромобилей. Мы построили эту отрасль с нуля, и она принадлежит нам."
 CHI_cadre_evaluation_reform: "Cadre Evaluation Reform"
 CHI_cadre_evaluation_reform_desc: "Наша система оценки руководящих кадров слишком долго поощряла провинциальных чиновников, которые обеспечивали рост ВВП, одновременно нанося ущерб окружающей среде и пренебрегая сферой общественных услуг. Мы должны ввести обязательные весовые коэффициенты для таких показателей, как охрана окружающей среды, социальная гармония и энергоемкость, наряду с экономическими показателями. Чиновник, который добивается роста за счет уничтожения условий, необходимых для этого роста, не заслуживает повышения по службе."
 CHI_cadre_rotation: "Cadre Rotation System"
 CHI_cadre_rotation_desc: "«Местная закрепощённость» — это гниль, разъедающая саму суть китайской системы управления. Чиновники, слишком долго остающиеся на одной должности, налаживают связи с местными бизнес-кругами, что приводит к коррумпированности их суждений. Систематическая программа ротации, основанная на опыте Чунцина, предусматривает регулярное перемещение кадров с одной должности на другую, что позволяет разорвать сети клиентелизма до того, как они успеют укрепиться."
 CHI_caojing_seven_chem_bases: "Shanghai Caojing Petrochemical Bases"
 CHI_caojing_seven_chem_bases_desc: "Государственный совет определил семь национальных нефтехимических баз: Шанхайский парк химической промышленности в Цаоцзине, а также Нанкин, Нинбо-Даси, Дая-Бэй, Цюаньчжоу, Далянь и Цаофэйдянь. Каждая база получает централизованное пароснабжение, общие системы очистки сточных вод, специализированные портовые сооружения и интегрированные установки крекинга этилена, что повторяет модель «Вербунд», впервые внедренную компанией BASF в Людвигсхафене. Компании BASF, Bayer, ExxonMobil, Shell и Saudi Aramco получают доступ к этим базам через совместные предприятия или дочерние компании, находящиеся в полной собственности. Комплекс BASF в Чжаньцзяне, стоимостью 10 миллиардов евро, становится крупнейшей единичной инвестицией BASF в мире — это показатель того, что наш рынок может предложить иностранному капиталу, когда мы решим это сделать."
 CHI_Central_Asia_Connectivity: "Silk Road Economic Belt"
 CHI_Central_Asia_Connectivity_desc: "«Экономический пояс Шелкового пути» пролегает по суше через Центральную Азию, а его ключевым узлом является сухопутный порт «Хоргос Гейтвей» на границе с Казахстаном — железнодорожный перевалочный узел, соединяющий китайскую узкоколейную сеть с российской ширококолейной. Объемы грузоперевозок по этому коридору растут, поскольку время транзита позволяет обойти морские перевозки при транспортировке грузов, для которых важен срок доставки. Нам следует ускорить инвестиции в этот коридор, пока конкурирующие державы не осознают его стратегическую ценность."
 CHI_central_china_development: "Rise of Central China"
 CHI_central_china_development_desc: "Прибрежный экономический бум обошел стороной центральные провинции Хэнань, Хубэй и Хунань. В рамках инициативы по скоординированному развитию в этот регион направляются бюджетные трансферты, инвестиции в инфраструктуру и перемещаемые производственные мощности, что позволяет вовлечь демографический и сельскохозяйственный центр Китая в процесс экономического роста."
 CHI_central_manufacturing_belt: "Central Manufacturing Belt"
 CHI_central_manufacturing_belt_desc: "Рост заработной платы в прибрежных регионах после 2008 года подтолкнул производителей к перемещению на запад — в провинции Аньхой, Цзянси и Хунань. Государственные стимулы для перемещения производств в сочетании с более низкими затратами на землю и рабочую силу за десятилетие превратили эти три провинции в средний промышленный центр Китая, который перенял производственные цепочки из дельт рек Чжуцзян и Янцзы в таких отраслях, как текстильная, электронная и производство автомобильных комплектующих."
 CHI_central_military_civil_fusion: "Military-Civil Fusion"
 CHI_central_military_civil_fusion_desc: "Декретом разрушается барьер между военной и гражданской экономикой. В рамках стратегии «Военно-гражданской интеграции» Си Цзиньпина, которая в 2017 году была объявлена национальным приоритетом, все достижения в области коммерческой электроники, вычислительной техники и аэрокосмической отрасли используются в интересах армии, а каждый прорыв в оборонной сфере находит применение в промышленности. Научно-исследовательская деятельность всей страны превращается в лабораторию Генерального штаба."
 CHI_central_urbanization_drive: "Central China Urbanisation Drive"
 CHI_central_urbanization_drive_desc: "По оценкам, около ста миллионов мигрантов из сельских районов центральных провинций переезжают в столицы провинций и уездные города. Нам следует ускорить этот процесс за счет предоставления жилищных субсидий, расширения спектра городских услуг и целенаправленного смягчения требований к «хукоу». Необходимо превратить центральные внутренние районы из резерва рабочей силы в потребительский рынок, пока еще открыто демографическое окно."
 CHI_Challenge_Dollar_Hegemony: "Challenge Dollar Hegemony"
 CHI_Challenge_Dollar_Hegemony_desc: "Продвигать юань в качестве альтернативной резервной валюты и заключать двусторонние соглашения о валютных свопах, тем самым ослабляя доминирующее положение доллара в мировых финансах."
 CHI_change_lunar_exploration: "Chang'e Lunar Programme"
 CHI_change_lunar_exploration_desc: "Программа лунных робототехнических исследований «Чанъэ» началась в 2007 году с запуска орбитального аппарата и развивалась через этапы мягких посадок, луноходов «Юйту» и исторической миссии «Чанъэ-4» в январе 2019 года, в ходе которой впервые в истории на обратной стороне Луны были высажены посадочный модуль и луноход. Данные, полученные в ходе этих миссий, кардинально изменили наше представление о геологии Луны и заложили научную основу для последующих пилотируемых миссий."
 CHI_china_among_the_starts: "China Among the Stars"
 CHI_china_among_the_starts_desc: "Благодаря нашей программе «Шэньчжоу» мы вошли в число немногих стран, способных самостоятельно осуществлять пилотируемые космические полёты. В ходе последующих миссий были освоены стыковка на орбите, внекорабельные работы, а также заложены основы для создания постоянной космической станции. Теперь мы должны развивать эти достижения, чтобы закрепить за собой статус одной из ведущих космических держав наравне с США и Россией."
 CHI_Chinese_Diplomacy: "Chinese Diplomacy"
 CHI_Chinese_Diplomacy_desc: "«Поднебесная» исторически играла центральную роль в делах Восточной Азии. Теперь, когда мы оправились от «века унижений», пришло время разработать комплексную дипломатическую стратегию, охватывающую как соседние страны региона, так и глобальные институты."
 CHI_chongqing_model_nationalisation: "The Chongqing Model"
 CHI_chongqing_model_nationalisation_desc: "Опыт Чунцина при Бо Силае показал, что в рамках Китайской Народной Республики по-прежнему существует жизнеспособная государственническая альтернатива рыночному либерализму. Благодаря ренационализации стратегических активов и направлению кредитов государственным предприятиям этот муниципалитет продемонстрировал рост ВВП, значительно превышающий среднестрановой показатель. Мы распространим эту модель на всю страну."
 CHI_cic_forex_reserves: "China Investment Corporation"
 CHI_cic_forex_reserves_desc: "Мы накопили более 1,4 триллиона долларов США в виде валютных резервов, размещенных в низкодоходных казначейских облигациях США, которые в большей степени удовлетворяют финансовые потребности Америки, чем наши собственные. Китайская инвестиционная корпорация (CIC) с капиталом в 200 миллиардов долларов США диверсифицирует этот суверенный фонд, вкладывая средства в глобальные фонды прямых инвестиций, инфраструктуру и стратегические активы. После первоначальных убытков, понесенных в связи с инвестициями в Blackstone и Morgan Stanley во время финансового кризиса, CIC превратилась в дисциплинированного инвестора, управляющего более чем 1,3 триллионами долларов США, и входит в число крупнейших суверенных фондов мира."
 CHI_cj10_cj20_cruise_missile_family: "The CJ-10 and CJ-20"
 CHI_cj10_cj20_cruise_missile_family_desc: "Крылатые ракеты большой дальности обеспечивают бомбардировщикам их ударную мощь. Наземные ракеты CJ-10 и воздушные ракеты CJ-20 позволяют одному самолёту H-6 наносить удары по стационарным целям на расстоянии 1 500 километров, что значительно увеличивает радиус действия всего авиаполка, не подвергая экипаж риску при нанесении удара по цели."
 CHI_cloud_computing_triumvirate: "The Cloud Computing Triumvirate"
 CHI_cloud_computing_triumvirate_desc: "Alibaba Cloud занимает 39 процентов нашего рынка публичного облачного хостинга; Tencent Cloud обеспечивает работу бэкэнда в игровой и финтех-отраслях; Huawei Cloud стремительно набирает популярность после введения санкций в 2019 году в качестве отечественной альтернативы американским сервисам. Деятельность иностранных провайдеров ограничена созданием совместных предприятий в соответствии с Законом о кибербезопасности. Мы создали отечественную облачную инфраструктуру, достаточно масштабную для поддержания цифровой экономики без зависимости от зарубежных партнеров, и это произошло не случайно."
 CHI_coastal_acceleration_doctrine: "Coastal Acceleration Doctrine"
 CHI_coastal_acceleration_doctrine_desc: "Наши прибрежные провинции — это те регионы, где рост идет быстрее всего и где результаты либерализации наиболее очевидны. Нам следует сосредоточить меры преференциальной политики в дельтах рек Чжуцзян и Янцзы: увеличить количество зон экспортной переработки, ослабить квоты на землепользование для промышленных парков и разрешить правительствам прибрежных регионов выпускать инфраструктурные облигации раньше, чем внутренним регионам. Внутренние регионы последуют этому примеру, когда прибрежные регионы докажут эффективность этой модели."
 CHI_coastal_sez_2nd_generation: "Second-Generation Special Economic Zones"
 CHI_coastal_sez_2nd_generation_desc: "Первое поколение особых экономических зон в Шэньчжэне и Пудуне подтвердило эффективность этой модели. В Шанхае и провинции Гуандун создается вторая волна таких зон, отличающихся усовершенствованной правовой базой, улучшенной логистикой и более надежной защитой интеллектуальной собственности, что призвано привлечь иностранный капитал с более высокой добавленной стоимостью."
 CHI_combat_engineer_modernisation: "Modernise the Engineers"
 CHI_combat_engineer_modernisation_desc: "Мосты, проломы и укрепления определяют, сможет ли бригада продвигаться вперёд или застрянет на месте. Инженерные войска переоснащаются современной техникой для мостоукладки, разминирования и земляных работ, чтобы рельеф местности больше никогда не останавливал наступление."
 CHI_commercial_launch_sector: "Commercial Launch Sector"
 CHI_commercial_launch_sector_desc: "С 2015 года новое поколение китайских коммерческих ракетно-космических компаний прошло путь от чертежей до стартовых площадок. В 2023 году компания LandSpace запустила ракету «Чжуцзе-2» — первую ракету на метановом топливе, вышедшую на орбиту; компании Galactic Energy и iSpace провели несколько успешных запусков малых спутников. Государственная поддержка этой экосистемы расширяет нашу промышленную базу, снижает затраты на запуски и привлекает частный капитал в космическую экономику."
 CHI_common_prosperity: "Common Prosperity"
 CHI_common_prosperity_desc: "Общее процветание — это наш главный приоритет на данный момент. Экономический рост необходимо переориентировать на сокращение разрыва в доходах, расширение социальных услуг и ограничение чрезмерного роста частного сектора. Компании, занимающиеся репетиторством, технологические платформы и индустрия развлечений должны принять новые ограничения. Заявленная цель — всеобъемлющее развитие; практический результат заключается в том, что мы вновь утверждаем свою власть над секторами, которые вышли за пределы нашего контроля, и обе эти вещи верны одновременно."
 CHI_common_prosperity_original: "Common Prosperity"
 CHI_common_prosperity_original_desc: "Цель развития заключается не в том, чтобы бесконечно увеличивать «пирог», оставляя бедных бороться за крошки. «Общее процветание» означает справедливое распределение «пирога» по мере его роста — перераспределение доходов, расширение социальных услуг и обеспечение того, чтобы плоды индустриализации доставались как рабочему, построившему завод, так и чиновнику, который его спланировал."
 CHI_Community_of_Shared_Future: "Community of Shared Future"
 CHI_Community_of_Shared_Future_desc: "Пропагандировать концепцию «сообщества с общим будущим для всего человечества», отстаивая многосторонний подход и взаимовыгодное сотрудничество в качестве альтернативы институтам, возглавляемым Западом."
 CHI_Comprehensive_Agreement_Investment: "EU-China Investment Agreement"
 CHI_Comprehensive_Agreement_Investment_desc: "Всеобъемлющее соглашение об инвестициях, заключенное после семи лет переговоров, обеспечит нашим компаниям расширенный доступ к европейским рынкам услуг в обмен на обязательства по обеспечению прозрачности государственной помощи. Европейский парламент приостановил ратификацию в связи с взаимными санкциями, однако экономическая целесообразность соглашения остается неизменной. Ратифицированное соглашение значительно снизило бы барьеры для китайского капитала на едином рынке блока, и нам следует оказать давление на Брюссель, чтобы он возобновил его ратификацию."
 CHI_construction_soe_champions: "State Construction Champions"
 CHI_construction_soe_champions_desc: "Китайская государственная строительно-инженерная корпорация, Китайская корпорация железнодорожного строительства, Китайская компания по строительству транспортной инфраструктуры и Корпорация энергетического строительства в совокупности занимают семь из десяти первых мест в мировом рейтинге подрядчиков. Десятилетия реализации крупномасштабных проектов внутри страны позволили нам сформировать квалифицированную рабочую силу численностью более двух миллионов человек, обеспечить удельную себестоимость на 20–30 процентов ниже, чем у западных конкурентов, а также создать сети поставок, позволяющие закупать материалы быстрее, чем у любого частного конкурента. Мы должны защищать эти структурные преимущества, поскольку они напрямую приводят к снижению затрат и сокращению сроков строительства по всем категориям капитального строительства, которые мы осуществляем внутри страны или реализуем за рубежом."
 CHI_cosco_global_network: "COSCO's Global Maritime Network"
 CHI_cosco_global_network_desc: "В результате слияния компаний COSCO и China Shipping образовался один из крупнейших в мире контейнерных перевозчиков, а последующее приобретение компании Orient Overseas International позволило нам ещё больше расширить сферу деятельности. В настоящее время COSCO Shipping Ports управляет терминалами в Пирее, Зебрюгге, Валенсии, Сингапуре, Абу-Даби и Чанкае. «Морской Шелковый путь XXI века» объединяет эти узловые пункты в поддерживаемую государством сеть, охватывающую пять континентов. Мы больше никогда не должны зависеть от иностранных перевозчиков при транспортировке наших грузов."
 CHI_Counter_Terrorism_Cooperation: "Counter-Terrorism Cooperation"
 CHI_Counter_Terrorism_Cooperation_desc: "Терроризм, сепаратизм и экстремизм угрожают стабильности в регионе. Создав в рамках ШОС совместные механизмы по борьбе с терроризмом, мы сможем координировать обмен разведывательной информацией и проведение операций по обеспечению безопасности в государствах-членах."
 CHI_crewed_lunar_landing: "Crewed Lunar Landing"
 CHI_crewed_lunar_landing_desc: "Китайская программа пилотируемой высадки на Луну нацелена на район южного полюса Луны, а первая посадка запланирована примерно на 2030 год. В рамках миссии тяжелая ракета-носитель «Длинный марш-10» будет нести пилотируемый корабль «Мэнчжоу» и посадочный модуль «Ланьюэ», которые будут запущены отдельно с космодрома Вэньчан и состыкуются на лунной орбите. В случае успеха Китай станет второй страной, осуществившей высадку людей на Луну."
 CHI_cross_strait_military_posture: "Cross-Strait Military Posture"
 CHI_cross_strait_military_posture_desc: "Силы, выступающие за независимость, укрепили свою политическую власть в Тайбэе, и мы не можем позволить, чтобы эта перемена прошла без ответа. Народно-освободительная армия должна усилить своё присутствие в Тайваньском проливе: учения по высадке морского десанта должны проводиться всё чаще и в более широких масштабах, а вылеты в зону опознавания обороны острова должны стать регулярными. Воссоединение — это не просто политический выбор. Это основная национальная цель, и сила, стоящая за ней, должна быть недвусмысленной."
 CHI_crossborder_ecommerce: "Cross-Border E-Commerce"
 CHI_crossborder_ecommerce_desc: "Наши производители теперь продают свою продукцию напрямую потребителям по всему миру, минуя традиционные дистрибьюторские сети, которые раньше контролировали иностранные бренды. Сверхбыстрые производственные циклы SHEIN запущены на фабриках в районе Панью города Гуанчжоу; приложение Temu стало самым скачиваемым приложением в США уже через год после запуска. Объем трансграничного экспорта достигает 400 миллиардов долларов США; правительства западных стран реагируют на это введением ограничений по порогу de minimis. Тарифные барьеры, которые они вновь возводят, свидетельствуют о том, насколько эффективными стали наши экспортеры."
 CHI_davos_boycott: "Boycott of Davos"
 CHI_davos_boycott_desc: "Всемирный экономический форум олицетворяет идеологию безгосударственного капитала — порядок, при котором суверенное развитие подчиняется интересам транснациональных финансовых структур. Мы больше не будем посылать наших высших должностных лиц преклоняться перед банкирами на швейцарских горных курортах. Наш путь — это самообеспеченность и рост под руководством государства, а не «Вашингтонский консенсус», прикрытый альпийским снегом."
 CHI_Debt_Trap_Diplomacy: "Debt-Trap Diplomacy"
 CHI_Debt_Trap_Diplomacy_desc: "Предоставлять кредиты на условиях, максимально усиливающих влияние Китая на страны-должники. Когда эти страны не могут погасить задолженность, добиваться от них стратегических уступок в виде доступа к портам, прав на добычу ресурсов и политической лояльности."
 CHI_defence_industry_consolidation: "Defence Industry Consolidation"
 CHI_defence_industry_consolidation_desc: "AVIC, CSIC, NORINCO и другие крупные конгломераты нашей оборонно-промышленной базы являются мощными по отдельности, но в совокупности работают неэффективно. Нам следует поставить их под более жесткий контроль со стороны SASAC, устранить дублирование, направить инвестиции в научные исследования на приоритетные программы и ввести для руководства предприятий контракты с обязательными показателями эффективности. Необходимо расширить специализированные производственные мощности в провинциях Сычуань и Гуандун, а верфь «Цзяннань» без промедления заслуживает новых инвестиций в доковые сооружения."
 CHI_designated_succesor: "Designated Successor"
 CHI_designated_succesor_desc: "Концепция коллективного руководства, разработанная Дэн Сяопином, включала в себя упорядоченный механизм преемственности: каждый верховный лидер должен был готовить преемника, чтобы предотвратить бесконечное единоличное правление. Сейчас мы лавируем между ожиданиями, вытекающими из этой традиции, и логикой нашего собственного укрепления власти. Назначение преемника успокаивает фракции, опасающиеся неограниченной личной власти, а «туаньпай» получает символическую уступку в обмен на свое согласие. Это цена, которую стоит заплатить за стабильность."
 CHI_Digital_Silk_Road: "Digital Silk Road"
 CHI_Digital_Silk_Road_desc: "Расширить цифровую инфраструктуру Китая в развивающихся странах с помощью сетей 5G, оптоволоконных кабелей и технологий «умных городов», создав тем самым долгосрочную технологическую зависимость."
 CHI_Digital_Silk_Road_Initiative: "Digital Silk Road Initiative"
 CHI_Digital_Silk_Road_Initiative_desc: "Компании «Huawei» и «ZTE» уже построили сети 4G и 5G, проложили подводные кабели и создали платформы видеонаблюдения для «умных городов» более чем в 80 странах. Проект «Цифровой Шелковый путь» формирует глубокую технологическую зависимость в странах-партнерах и обеспечивает нам преференциальный доступ к их телекоммуникационной инфраструктуре. Нам следует ускорить реализацию этой программы, пока давление со стороны западных регулирующих органов не заставит ещё больше правительств исключить наши компании из своих проектов."
 CHI_digital_yuan_ecny: "The Digital Yuan"
 CHI_digital_yuan_ecny_desc: "Народный банк Китая запустил проект «Цифровая валюта и электронные платежи», в рамках которого осуществляется распространение электронного юаня (e-CNY) через коммерческие банки в пилотных проектах в Шэньчжэне, Сучжоу и Пекине. В настоящее время активно используются 260 миллионов кошельков. В рамках проекта mBridge тестируются трансграничные расчеты с использованием CBDC с Гонконгом, Таиландом и ОАЭ в качестве альтернативы системе SWIFT. Цифровой юань — это не просто платежный инструмент; это инфраструктура денежного порядка, не зависящего от Вашингтона."
 CHI_distant_water_fishing_strategy: "Distant-Water Fishing Strategy"
 CHI_distant_water_fishing_strategy_desc: "Наш флот для дальнего промысла в настоящее время насчитывает более 2 500 судов, ведущих промысел в исключительных экономических зонах Мавритании, Сьерра-Леоне, Аргентины и Перу; эта программа берет свое начало в первой экспедиции Китайской национальной рыбопромышленной корпорации в воды Западной Африки. Стратегия «Going Out» закрепляет дальний промысел в качестве постоянного компонента нашей политики продовольственной безопасности. Субсидии на топливо, суда-ледогенераторы и портовые соглашения в Бате, Уолфиш-Бей и Монтевидео обеспечивают непрерывность операций, при этом архипелаг Чжоушань в провинции Чжэцзян служит основным центром переработки улова."
 CHI_ditiao_gang_crackdown: "The Illegal Steel Crackdown"
 CHI_ditiao_gang_crackdown_desc: "Необходимо закрыть более 600 незарегистрированных заводов с индукционными печами, которые, по оценкам, ежегодно производят 140 миллионов тонн некачественной стали «дитяо ганг». Министерство промышленности и информационных технологий сделало эту задачу центральным элементом структурной реформы со стороны предложения. Официальные показатели производства вырастут по мере поглощения теневого объема производства, качество стали улучшится, а цены повысятся в связи с устранением с рынка низкокачественной продукции. Время торговцев арматурой, которые извлекали выгоду из этого хаоса, подошло к концу."
 CHI_document_nine: "Document No. 9"
 CHI_document_nine_desc: "В секретном коммюнике партии под названием «О текущем состоянии идеологической сферы» определены семь западных идеологических угроз, подлежащих пресечению: конституционная демократия, гражданское общество, неолиберализм, свобода прессы, исторический нигилизм, подвергание сомнению социализма и скептическое отношение к реформам партии. Во всех университетах и государственных СМИ предписано проводить обязательные учебные занятия. Границы допустимых мыслей сужаются в одночасье, а лояльность демонстрируется через отказ от иностранных концепций."
 CHI_domestic_eda: "Domestic EDA and IP"
 CHI_domestic_eda_desc: "Программное обеспечение для автоматизации проектирования электроники (EDA) — инструменты, используемые для проектирования интегральных схем — ранее поставлялось практически исключительно компаниями Cadence, Synopsys и Mentor Graphics. После того как США включили инструменты EDA в контрольный список «Entity List», мы направили инвестиции в компании Empyrean Technology, Primarius и Xpeedic. Охват отечественных EDA-решений достиг полной функциональности для зрелых технологических узлов, хотя охват передовых узлов для проектирования с размером элементов менее 5 нм по-прежнему остается частичным. Государственное лицензирование отечественных IP-блоков дополняет развитие EDA, и мы должны ликвидировать оставшийся пробел, прежде чем Вашингтон заметит, насколько близки мы к цели."
 CHI_dragon_eye_over_lanzhou: "Dragon Eye over Lanzhou"
 CHI_dragon_eye_over_lanzhou_desc: "Китай создает собственную систему «Иджис». Эсминцы типа 052C, во главе с кораблем «Ланьчжоу», введенным в строй в 2004 году, оснащены фазированной антенной решеткой типа 346 «Драконий глаз» и ракетами HHQ-9, что впервые обеспечивает китайскому военному кораблю полноценную флотскую воздушную оборону района. ВМС наконец-то могут обеспечивать защиту своего воздушного пространства в море."
 CHI_dual_credit_auto_export: "Dual-Credit System and World's Largest Exporter"
 CHI_dual_credit_auto_export_desc: "Положение о двойных кредитах предусматривает выделение каждому автопроизводителю на нашем рынке отдельных счетов для учета расхода топлива и кредитов NEV, создавая таким образом механизм «ограничения и торговли» для электромобилей, который заменяет прямые субсидии конкурентным давлением. В настоящее время мы экспортируем более 5 миллионов автомобилей в год, обогнав Японию и став крупнейшим в мире экспортером автомобилей. Европейский Союз вводит пошлины в размере от 17 до 37 процентов сверх базового тарифа; Соединённые Штаты взимают 100-процентную пошлину на наши электромобили. Ни один из этих барьеров не остановит то, что уже определил рынок."
 CHI_eat_imperial_grain: "Eat Imperial Grain"
 CHI_eat_imperial_grain_desc: "Армия, которая управляет гостиницами, занимается контрабандой автомобилей и торгует оружием, верна не Партии, а собственному кошельку. В июле 1998 года Цзян Цзэминь приказал НОАК отказаться от своей коммерческой империи и впредь существовать за счёт государственного продовольственного снабжения, исключительно за счёт бюджета. Мы доводим этот путь до конца: профессиональные вооружённые силы, получающие жалованье и не вовлечённые в коррупцию, подчиняющиеся исключительно Пекину."
 CHI_ecommerce_infrastructure: "China's E-Commerce Infrastructure"
 CHI_ecommerce_infrastructure_desc: "Taobao обогнал eBay China благодаря бесплатным объявлениям и интегрированной системе обмена сообщениями, а затем Tmall расширил платформу, создав фирменные B2C-магазины для международных ритейлеров. JD.com построил собственную сеть из 1 500 складов и создал штат постоянных курьеров, работающих быстрее, чем любая из унаследованных нами логистических служб. На долю электронной коммерции сейчас приходится 30 процентов нашего розничного товарооборота — это самая высокая доля среди всех крупных экономик, и инфраструктура, которая делает это возможным, полностью принадлежит нам."
 CHI_Economic_Framework_for_Unity: "Economic Framework for Unity"
 CHI_Economic_Framework_for_Unity_desc: "Обе Кореи и поддерживающие их великие державы разрабатывают план экономической интеграции. Китайские инвестиции в инфраструктуру Северной Кореи, передача технологий Южной Кореей и финансовые гарантии со стороны США составляют основу для возможного объединения Кореи."
 CHI_Economic_Reintegration: "Economic Reintegration"
 CHI_Economic_Reintegration_desc: "Мы приступаем к длительному процессу интеграции экономики Северной Кореи в нашу промышленную сферу. Инвестиции устремляются на север, а сырье и рабочая сила — на юг. Корейские отношения, основанные на системе дани, которые на протяжении столетия находились в состоянии затишья, фактически восстанавливаются."
 CHI_Eight_Country_Initiative: "Eight-Country Pacific Initiative"
 CHI_Eight_Country_Initiative_desc: "Консолидированная система безопасности и экономического сотрудничества, предложенная восьми тихоокеанским островным государствам, позволила бы нам одним подписанием заключить соглашение, охватывающее весь регион и касающееся охраны правопорядка, мониторинга рыболовства и создания сети обмена данными. Эта инициатива станет проверкой того, можно ли преобразовать наш накопленный дипломатический капитал в Тихоокеанском регионе в коллективное соглашение, способное составить конкуренцию региональной архитектуре, которую Австралия поддерживает на протяжении десятилетий. От успеха этой инициативы зависит, будем ли мы играть ведущую роль в формировании институциональной структуры Тихоокеанского региона или просто участвовать в этом процессе."
 CHI_eleventh_five_year_plan: "The Eleventh Five-Year Plan"
 CHI_eleventh_five_year_plan_desc: "В нашем следующем пятилетнем плане должны быть закреплены обязательные целевые показатели: обязательное сокращение энергоемкости на единицу ВВП на 20 процентов, сокращение выбросов основных загрязняющих веществ на 10 процентов, а также увеличение доли сферы услуг в ВВП. Нам также следует увеличить государственные инвестиции в научные исследования и образование и ускорить строительство инфраструктуры в сельских районах. Рост без этих ограничений — это рост, который мы не сможем поддерживать."
 CHI_establish_defence_conglomerates: "Establish the Defence Conglomerates"
 CHI_establish_defence_conglomerates_desc: "Разрозненные заводы и враждующие между собой министерства не способны вооружить великую державу. Мы объединяем оборонный сектор в несколько крупных государственных конгломератов, каждый из которых является национальным лидером в своей сфере, способным финансировать научные исследования, объединять таланты и выполнять заказы армии в широких масштабах."
 CHI_Eurasian_Land_Bridge: "Eurasian Land Bridge Complete"
 CHI_Eurasian_Land_Bridge_desc: "Грузовое сообщение «Иву — Лондон» продемонстрировало, что непрерывный наземный железнодорожный коридор от востока Китая до Западной Европы функционирует на коммерческой основе. Полная евразийская интеграция означает, что наши производители могут выходить на европейские рынки за восемнадцать дней вместо тридцати пяти, необходимых при морских перевозках. Теперь нам следует инвестировать средства в увеличение пропускной способности и частоты рейсов, пока этот маршрут не сможет составить конкуренцию морским перевозкам по объемам."
 CHI_Exercise_Paektu_Honor: "Exercise Paektu Honor"
 CHI_Exercise_Paektu_Honor_desc: "Мы демонстрируем сдержанность, проводя двусторонние военные учения с акцентом на оборонительные позиции на реке Ялу. Послание Вашингтону ясно: мы способны справиться с Пхеньяном без эскалации со стороны США."
 CHI_Expand_Foreign_Service: "Expand the Foreign Service"
 CHI_Expand_Foreign_Service_desc: "Мы должны стремительно расширять нашу консульскую сеть и дипломатический корпус. Ни одна другая страна в мире не сумела сохранить по всему миру больше дипломатических представительств, чем мы, и нам следует и дальше укреплять это преимущество."
 CHI_export_processing_zones: "Export Processing Zones"
 CHI_export_processing_zones_desc: "Специализированные зоны экспортной переработки в провинциях Цзянсу, Фуцзянь и Чжэцзян предлагают услуги таможенного складирования, упрощенные таможенные процедуры и преимущества в виде низких затрат на рабочую силу, что привлекает предприятия по сборке из Кореи, Тайваня и Японии. Китай становится конечным звеном сборки в производственных сетях Восточной Азии."
 CHI_fabless_design_cluster: "Fabless Design Cluster"
 CHI_fabless_design_cluster_desc: "Наша отрасль проектирования полупроводников сконцентрировалась в Шэньчжэне и Шанхае. Государственные субсидии привлекли сотни стартапов в сферу разработки микросхем для бытовой электроники, средств связи и ускорителей искусственного интеллекта. Близость Шэньчжэня к цепочкам поставок по сборке печатных плат, контрактному производству и бытовой электронике делает его естественным центром; в рамках городского кластера разработчиков появились такие компании, как Himax, Rockchip, Allwinner, а также десятки более мелких проектных бюро, многие из которых получают поддержку от провинциальных фондов типа «Big Fund». Глубина этой экосистемы является нашим структурным преимуществом."
 CHI_factional_balance: "Factional Balance"
 CHI_faw_changchun_automotive: "FAW Changchun Expansion"
 CHI_faw_changchun_automotive_desc: "First Automobile Works, штаб-квартира которой находится в Чанчуне, является нашим старейшим автопроизводителем и основой, на которой была построена вся автомобильная промышленность страны. Нам следует расширить её портфель совместных предприятий с Volkswagen и Toyota, одновременно направляя государственные инвестиции на развитие отечественных автомобильных брендов. Провинция Цзилинь станет опорным центром нашей национальной автомобильной промышленности."
 CHI_fifty_vanke_handover: "The Vanke Handover"
 CHI_fifty_vanke_handover_desc: "К декабрю 1998 года тысячи предприятий, находившихся в ведении вооружённых сил, были оценены, зарегистрированы и переданы в гражданскую собственность. Недвижимость, стоимость которой исчисляется целым состоянием — эквивалентом пятидесяти девелоперских компаний «Ванке», — навсегда исчезает из бухгалтерских книг армии. Генералы теряют свои вотчины, а партия обретает более чистый меч."
 CHI_Five_Stars_Highway: "Five-Country Highway Corridor"
 CHI_Five_Stars_Highway_desc: "Трансконтинентальный автомобильный коридор, соединяющий бразильские порты на побережье Атлантического океана с перуанскими терминалами на побережье Тихого океана, проходит через пять стран и сокращает время наземного транзита на несколько недель. Этот проект является флагманом наших логистических амбиций в Южной Америке, повторяя экономическую логику Панамского канала в континентальном масштабе. Наши строительные компании и финансовые учреждения возьмут на себя основную нагрузку по реализации проекта, а в ответ получат благодарность пяти стран."
 CHI_flying_leopard_doctrine: "The Flying Leopard Doctrine"
 CHI_flying_leopard_doctrine_desc: "Флот осваивает нанесение ударов с воздуха ещё до того, как у него появятся авианосцы. Базирующиеся на суше истребители-бомбардировщики JH-7 «Летающий леопард», вооружённые противокорабельными ракетами, превращают морскую авиацию в самостоятельную ударную силу, способную действовать на больших расстояниях над водой и потопить вражескую ударную группу с берега."
 CHI_Forum_China_CELAC: "China-CELAC Cooperation Forum"
 CHI_Forum_China_CELAC_desc: "Сообщество латиноамериканских и карибских государств предоставляет нам многосторонний канал, позволяющий обойти Организацию американских государств, в которой Вашингтон уже давно доминирует. Министерский форум, посвящённый вопросам инфраструктуры, торговли и инвестиций в сельское хозяйство, даёт нам возможность ослабить институциональное превосходство США в их собственном полушарии. Мы должны рассматривать эту структуру как долгосрочную инвестицию, а не как разовый жест."
 CHI_four_trillion_stimulus: "Four Trillion Yuan Stimulus"
 CHI_four_trillion_stimulus_desc: "Пакет мер стимулирования экономики на сумму 4 триллиона юаней, что составляет 12 процентов ВВП, направлен в первую очередь на развитие железных дорог, автомагистралей, аэропортов и строительство социального жилья. Местные органы власти привлекают заемные средства через специальные финансовые структуры для совместного финансирования своей доли в программе. Компании «China State Construction» и «China Communications Construction» стремительно расширяют свою деятельность за счет заключенных в результате контрактов. Мы избегаем рецессии, в то время как остальной мир переживает спад, однако эти стимулирующие меры приводят к накоплению избыточного долга в бюджетах местных органов власти и ускоряют формирование пузыря на рынке недвижимости в таких городах, как Ордос и Чанчжоу. Издержки вполне реальны, и они обязательно дадут о себе знать."
 CHI_FTA_2015: "China-South Korea Free Trade Agreement"
 CHI_FTA_2015_desc: "Наше соглашение о свободной торговле с Южной Кореей в настоящее время реализуется в полном объеме. Снижение тарифов, создание совместных логистических коридоров и расширение торговли сельскохозяйственной продукцией и электроникой углубляют двустороннюю взаимозависимость и дают Сеулу реальную заинтересованность в поддержании стабильных отношений с нами. Экономически связанная с нами Корея с меньшей вероятностью последует за Вашингтоном в случае конфликта между ними."
 CHI_game_licensing_regs: "Game Licensing Regulations"
 CHI_game_licensing_regs_desc: "Закон NPPA ограничивает время, которое несовершеннолетние могут проводить за играми, тремя часами в неделю, предусматривая контроль с помощью технологии распознавания лиц. В редакционной статье агентства «Синьхуа» игры названы «духовным опиумом», что привело к падению курса акций Tencent на 10 процентов за одну торговую сессию. Для выпуска новых игр требуется лицензия «баньхао», при этом предпочтение отдается патриотической тематике. Процесс выдачи разрешений возобновляется, поскольку студии переориентируются на зарубежные рынки, экспортируя продукт, который благодаря регулированию стал идеологически надежным."
 CHI_geely_volvo_acquisition: "Geely's Volvo Acquisition"
 CHI_geely_volvo_acquisition_desc: "Приобретение Ли Шуфу компании Volvo Cars у Ford за 1,8 миллиарда долларов США стало образцом для китайских зарубежных поглощений, ориентированных на бренды, интеллектуальную собственность и дистрибьюторские сети, а не на заводы. Впоследствии Geely приобрела London Taxi Company, 49,9-процентную долю в Proton, 51 процент акций Lotus и 9,7 процента акций Daimler AG. Каждая из этих сделок — не просто коммерческая операция, а заявление о том, что китайские компании могут владеть тем, что раньше они лишь собирали."
 CHI_Geneva_Carve_Out: "Geneva Bilateral Framework"
 CHI_Geneva_Carve_Out_desc: "Традиция коммерческого нейтралитета Швейцарии делает эту страну естественным пунктом входа для нашего капитала, стремящегося получить доступ к европейскому рынку и избежать регулирующего контроля со стороны Европейского союза. Двустороннее соглашение о свободной торговле и ряд меморандумов о финансовых рынках обеспечивают нашим банкам и суверенным фондам плацдарм в Женеве, где надзор осуществляется в менее строгом режиме, чем в любой сопоставимой юрисдикции ЕС. Берн получает доход от комиссионных и объем транзакций, а мы — авторитетный западный финансовый адрес."
 CHI_Global_Ambitions: "Global Ambitions"
 CHI_Global_Ambitions_desc: "Мы готовы определить свою роль на мировой арене. Вопрос заключается не в том, станем ли мы великой державой, а в том, какой именно великой державой мы решим стать."
 CHI_gobi_solar_offshore_wind: "The Gobi Solar Belt and Offshore Wind Bases"
 CHI_gobi_solar_offshore_wind_desc: "Наш Закон о возобновляемых источниках энергии и льготные тарифы, установленные Национальной комиссией по развитию и реформам (NDRC), создали политическую основу, способствующую резкому снижению стоимости солнечной энергии. Компании LONGi Green Energy, JinkoSolar, Trina Solar и JA Solar снизили стоимость солнечных панелей до уровня ниже 0,10 доллара США за ватт. Производство поликремния в Синьцзяне и Сычуане в настоящее время обеспечивает более 80 процентов мирового спроса. «Солнечная Великая стена» в Кубуци (Внутренняя Монголия), солнечный парк в пустыне Тенгер (Нинся) и солнечно-ветровая база в Хами (Синьцзян) представляют собой объекты гигаваттного масштаба; развитие морской ветроэнергетики набирает обороты в Янцзяне, Путяне и Яньчэне. Обязательство по сокращению выбросов углерода и углеродной нейтральности обеспечивает программе долгосрочную стабильность."
 CHI_governance_moderenisation: "Modernization of Governance"
 CHI_governance_moderenisation_desc: "Системы социального кредитования, инфраструктура цифровой идентификации и интегрированные сети наблюдения должны быть объединены в единую систему, которая отслеживает соблюдение правил, поощряет сотрудничество и выявляет несогласие. Технологии «умного города» обеспечивают мониторинг передвижений и коммуникаций в городской среде в режиме реального времени в масштабах, недостижимых для любой предыдущей администрации. Цифровое управление — это управление, ставшее понятным: население, видимое нам на всех уровнях и поддающееся соответствующему управлению."
 CHI_grain_for_green_program: "Grain-for-Green Programme"
 CHI_grain_for_green_program_desc: "Катастрофические наводнения на реке Янцзы стали геологическим приговором десятилетиям вырубки лесов на Лёссовом плато: 4 150 погибших, 21 миллион гектаров затопленной территории и речная система, утратившая способность поглощать сток собственного водосборного бассейна. Программа «Зерно за зелень» преобразует склоны с уклоном более 25 градусов обратно в леса или пастбища, компенсируя утраченный доход от урожая выплатами в виде зерна и денежных средств. Мы охватываем 32 миллиона гектаров; консолидированное ведение сельского хозяйства на плодородных равнинных землях повышает урожайность с гектара на восстановленных территориях. Восстановление и продуктивность — это не противоположности."
 CHI_great_wall_suv_dominance: "Great Wall Haval SUV Dominance"
 CHI_great_wall_suv_dominance_desc: "Вэй Цзяньцзюнь превратил компанию Great Wall Motors в лидера китайского рынка внедорожников, начав с завода в Баодине, на который мировые автопроизводители едва обращали внимание. Haval H6 четыре года подряд становился самым продаваемым внедорожником в Китае; затем Haval стал самостоятельным брендом, за которым последовали WEY, Ora, Tank и Poer. В настоящее время Great Wall эксплуатирует сборочные заводы в России, Таиланде и Бразилии, ориентируясь на сегменты рынка, которые западные производители систематически недооценивали и оставляли без конкуренции."
 CHI_guatian_reckoning: "The Reckoning"
 CHI_guatian_reckoning_desc: "Коррупционеры не могут оставаться незамеченными вечно. Логистические магнаты, распродавшие военные земли и накопившие ящики с алкоголем и золотом, стоят перед днём расплаты, и клике предстоит выбрать: либо выдать нескольких козлов отпущения, либо сплотиться и бросить вызов Пекину."
 CHI_Gulf_Yuan_Settlement: "Gulf Yuan Settlement Mechanism"
 CHI_Gulf_Yuan_Settlement_desc: "Страны Совета сотрудничества стран Персидского залива начинают устанавливать цены на значительную долю экспорта сырой нефти в юанях, осуществляя расчеты через Трансграничную межбанковскую платежную систему вместо SWIFT. В сочетании с линиями свопов центральных банков и ассигнованиями суверенных фондов благосостояния в юанях этот сдвиг неуклонно подрывает структурное преимущество нефтедоллара. Соединённые Штаты теряют рычаг финансового давления, которым они пользовались с 1974 года."
 CHI_h20_programme: "The H-20 Programme"
 CHI_h20_programme_desc: "Последним пробелом в арсенале великой державы является стелс-бомбардировщик, и мы взялись за его устранение. H-20 — бомбардировщик с конструкцией «летающего крыла», который, как утверждается, способен нести десять тонн вооружения на расстояние около восьми тысяч километров без дозаправки, — позволит Китаю наносить удары через Тихий океан, не выходя из собственного воздушного пространства. С его появлением бомбардировочная составляющая подлинной глобальной триады будет завершена."
 CHI_h6k_revival: "The H-6K Revival"
 CHI_h6k_revival_desc: "Старая копия «Ту-16» обрела новую жизнь. На самолете H-6K бомбовый отсек заменен на подвески для крылатых ракет, а установка высокоэффективных турбовентиляторных двигателей обеспечила значительно большую дальность полета, превратив его в платформу для нанесения ударов с безопасного расстояния, с которой ракеты для нанесения ударов по наземным целям запускаются за пределами зоны действия средств ПВО противника. Около ста десяти таких самолетов в настоящее время составляют костяк бомбардировочной авиации."
 CHI_harbin_equipment_manufacturing: "Harbin Heavy Equipment Base"
 CHI_harbin_equipment_manufacturing_desc: "Наследие Харбина в области тяжелой промышленности советских времен модернизируется и переориентируется на производство энергетического оборудования, железнодорожных компонентов и промышленного оборудования. Город становится инженерной опорой расширения инфраструктуры Китая."
 CHI_Health_Silk_Road: "Health Silk Road"
 CHI_Health_Silk_Road_desc: "Инициатива «Шелковый путь здравоохранения» позволяет нам распространить нашу медицинскую помощь, строительство больниц и цепочки поставок фармацевтической продукции на страны-партнеры по инициативе «Один пояс, один путь». Эта концепция приобрела особую актуальность во время пандемии COVID-19, когда наша «вакцинная дипломатия» укрепила наш авторитет в качестве партнера по развитию здравоохранения для стран Глобального Юга. Сейчас нам следует официально закрепить и расширить эту инициативу, чтобы зависимость от западных фармацевтических компаний больше не была нормой."
 CHI_heavy_combined_arms_brigade: "Heavy Combined-Arms Brigades"
 CHI_heavy_combined_arms_brigade_desc: "Одиночные танки быстро уничтожаются. Мы объединяем танки типа 99 с гусеничной пехотой, самоходными орудиями и инженерными подразделениями в мощные общевойсковые бригады — самодостаточные ударные формирования, созданные для прорыва укреплённой линии обороны и дальнейшего продвижения."
 CHI_hebei_steel_group: "Hebei Iron & Steel Group"
 CHI_hebei_steel_group_desc: "Провинция Хэбэй объединила компании «Таншань Ирон энд Стил», «Ханьдань Ирон энд Стил» и ряд более мелких металлургических предприятий в группу «Хэбэй Ирон энд Стил», которая впоследствии станет компанией HBIS. В тот же период в результате аналогичных слияний были созданы компании «Аньшань-Бэньси» в провинции Ляонин и «Шаньдун Стил Групп». Двенадцатый пятилетний план поднимает консолидацию на уровень государственной политики, устанавливая цель, согласно которой десять крупнейших производителей должны контролировать 60 процентов объёма производства. Эпоха тысячи мелких заводов, конкурирующих за мизерную прибыль, должна закончиться."
 CHI_henan_grain_modernization: "Henan Agricultural Modernisation"
 CHI_henan_grain_modernization_desc: "Провинция Хэнань обеспечивает продовольствием больше людей, чем любая страна Европы. Инвестиции в инфраструктуру хранения, перерабатывающие мощности и службы сельскохозяйственной консультации способствуют повышению урожайности и сокращению послеуборочных потерь, укрепляя национальную продовольственную безопасность и высвобождая сельскую рабочую силу для перераспределения в промышленность."
 CHI_high_speed_rail_one: "High-Speed Rail Phase One"
 CHI_high_speed_rail_one_desc: "Наши первые специализированные высокоскоростные линии открываются одна за другой: Пекин—Тяньцзинь, затем Ухань—Гуанчжоу, а затем — амбициозный коридор Пекин—Шанхай, который станет самой длинной высокоскоростной линией в мире. Программа основана на лицензионных технологиях CRH от европейских и японских производителей, которые наши инженеры адаптируют к китайским условиям. То, что начинается как заимствованные знания, со временем станет нашим собственным достоянием."
 CHI_hisilicon_kirin: "HiSilicon Kirin Mobile Platform"
 CHI_hisilicon_kirin_desc: "HiSilicon, дочерняя компания Huawei, занимающаяся производством полупроводников, создала серию SoC Kirin для смартфонов Huawei, внедрив в чип нейропроцессор (NPU) раньше всех западных конкурентов и перейдя на 7-нм технологический процесс на заводах TSMC. После того как экспортные ограничения США перекрыли эти поставки, Huawei в сотрудничестве с SMIC наладила производство Kirin 9000S на технологическом узле, доступном для производства внутри страны. Эта программа продемонстрировала, что китайская компания, не имеющая собственного производственного предприятия, может достичь уровня производительности Apple и Qualcomm, и стала образцом, которому теперь следуют все отечественные разработчики SoC."
 CHI_Honiara_Security_Pact: "Honiara Security Agreement"
 CHI_Honiara_Security_Pact_desc: "Соглашение о безопасности с Соломоновыми Островами позволяет Военно-морским силам Народно-освободительной армии причаливать, пополнять запасы и проводить операции из Хониары, расположенной менее чем в 2 000 километров от материковой части Австралии. Канберра реагирует с тревогой, ускоряя реализацию планов по AUKUS и лоббируя в Вашингтоне усиление сдерживающего потенциала в Тихоокеанском регионе. Этот пакт дает нам первое официально признанное присутствие в сфере безопасности к востоку от Первой цепи островов, и мы должны закрепить его, пока на Хониару не начали оказывать давление с целью заставить её отказаться от него."
 CHI_hq17_medium_range_air_defense: "Layered Medium-Range Defence"
 CHI_hq17_medium_range_air_defense_desc: "Над уровнем точечной обороны мы добавляем систему защиты среднего радиуса действия, объединяя ракеты ближнего и дальнего радиуса действия в единый сетевой щит, чтобы не осталось ни одного незащищенного участка между верхушками деревьев и стратосферой."
 CHI_hq17_short_range_sam: "HQ-17 Short-Range SAM"
 CHI_hq17_short_range_sam_desc: "Бригадам нужна собственная система противовоздушной обороны. Система HQ-17, созданная на базе российской системы «Тор», обеспечивает оперативную точечную противовоздушную оборону от самолетов, беспилотных летательных аппаратов и высокоточного вооружения и устанавливается таким образом, чтобы идти в ногу с бронетехникой, которую она защищает."
 CHI_hu_jintao_reign: "The Hu Jintao Era"
 CHI_hu_jintao_reign_desc: "Вступление Ху Цзиньтао в должности генерального секретаря, президента и председателя Центральной военной комиссии стало самым упорядоченным переходом власти в истории нашей республики. Его администрация будет уделять больше внимания институциональному управлению и коллективному принятию решений, а не личной власти, что приблизит нашу систему к той регулярной сменности власти, которая необходима стабильным государствам."
 CHI_hua_hong_mature_node: "Hua Hong Mature-Node Capacity"
 CHI_hua_hong_mature_node_desc: "Компания «Хуа Хун Семикондуктор», изначально представлявшая собой китайско-французское совместное предприятие в Цзиньцяо, переориентировалась на производство специализированных микросхем с зрелыми технологическими процессами: микросхем управления питанием, встроенной энергонезависимой памяти и аналоговых микросхем для автомобильной отрасли и рынка Интернета вещей. Её 200-мм и 300-мм производственные площадки в Шанхае и Уси обслуживали внутренние цепочки поставок, на которые западные санкции не могли легко повлиять. Благодаря государственным инвестициям были расширены производственные мощности и диверсифицирована клиентская база за пределами экспортного рынка."
 CHI_hualong_nuclear_batch: "Hualong One Mass Construction"
 CHI_hualong_nuclear_batch_desc: "После импорта реакторов Westinghouse AP1000 на АЭС «Саньмэнь» и «Хайян», реакторов Framatome EPR на АЭС «Тайшань» и энергоблоков «Росатома» типа ВВЭР на АЭС «Тяньвань» мы завершили разработку собственной конструкции третьего поколения. «Хуалун-1», представляющий собой объединение моделей ACP-1000 компании CNNC и ACPR-1000 компании CGN, является объектом интеллектуальной собственности, полностью принадлежащей Китаю, и соответствует европейским эксплуатационным требованиям. Первым к энергосистеме подключается 5-й энергоблок АЭС «Фуцин»; за ним следуют атомная база в Чжанчжоу, АЭС «Чанцзян» на Хайнане, АЭС «Фанчэнган» и АЭС «Тайпинлин». Экспортная версия — HPR1000 — вводится в эксплуатацию на блоках K-2 и K-3 АЭС «Карачи», и это лишь начало нашей программы экспорта атомной энергетики."
 CHI_huawei_zte_export: "Huawei Equipment Exports"
 CHI_huawei_zte_export_desc: "На долю компаний «Huawei» и «ZTE» приходится более 35 процентов мирового рынка телекоммуникационного оборудования, причем доминирующее положение «Huawei» обеспечивается преимуществом компании в области стандартов 5G, связанным с использованием кода «Polar». Благодаря инициативе «Цифровой Шелковый путь» наша инфраструктура охватывает операторов в 170 странах. Западные правительства реагируют на это запретами и ограничениями в виде включения в списки санкционированных организаций, однако физическую инфраструктуру, которую мы уже развернули, невозможно ликвидировать с помощью законодательных мер."
 CHI_huludao_schoolhouse: "The Huludao Schoolhouse"
 CHI_huludao_schoolhouse_desc: "Авианосцы бесполезны без пилотов, способных совершать на них посадку. В Хулудао Университет морской авиации готовит специалистов для службы на авианосцах, располагая наземным трамплином и аэродинамическим тормозным устройством, и с нуля обучая летчиков, которые смогут превратить движущуюся палубу в площадку для ведения боевых действий."
 CHI_hybrid_rice_super_program: "Super Hybrid Rice Programme"
 CHI_hybrid_rice_super_program_desc: "Китайский национальный центр исследований и разработок гибридного риса имени Юань Лунпина в Чанше стремится к достижению новых рекордных показателей урожайности, каждую зиму переезжая со своей селекционной командой в Санья на острове Хайнань, где тропический климат позволяет вести круглогодичное выращивание, невозможное на материке. Гибридные сорта уже занимают 60 процентов наших рисовых посевов, а в рамках параллельной программы в настоящее время ведётся работа над созданием солеустойчивого «морского риса» для Северо-Китайской равнины. Нам следует продолжать эти инвестиции: продовольственная безопасность — это фундамент, на котором основываются все остальные амбиции."
 CHI_hydrogen_green_steel: "Hydrogen Steelmaking"
 CHI_hydrogen_green_steel_desc: "Наши целевые показатели по сокращению выбросов углерода и механизм корректировки углеродных пограничных пошлин ЕС подталкивают наших производителей стали к декарбонизации до того, как иностранные тарифы примут решение за них. Компания «Баову» в партнерстве с «Рио Тинто» ввела в эксплуатацию в Чжаньцзяне демонстрационный завод по прямому восстановлению на основе водорода мощностью 1 миллион тонн. Компания HBIS запускает аналогичный проект в Чжанцзякоу с использованием «зелёного» водорода, полученного путём электролиза. В течение следующего десятилетия нам необходимо существенно увеличить долю электродуговых печей в нашем объёме производства, и планирование этого перехода начинается уже сейчас."
 CHI_hypersonic_strike_integration: "Hypersonic Strike Integration"
 CHI_hypersonic_strike_integration_desc: "Скорость становится новым средством маскировки. Мы включаем гиперзвуковое оружие, летящее со скоростью, превышающей звуковую в пять раз, и маневрирующее на всем пути до цели, в ударный арсенал ВВС, создавая для средств ПВО противника угрозу, которую они не способны отразить с помощью проверенных методов."
 CHI_ilrs_lunar_base: "International Lunar Research Station"
 CHI_ilrs_lunar_base_desc: "В 2021 году Китай и Россия подписали «дорожную карту» по созданию Международной лунной исследовательской станции, предложив странам-партнерам построить совместно управляемый исследовательский аванпост вблизи южного полюса Луны. Приоритетными направлениями программы являются использование ресурсов на месте, создание постоянной наземной инфраструктуры и схема ротации экипажей, аналогичная модели антарктических исследовательских станций. Мы задействуем нашу промышленную и инженерную базу, чтобы воплотить этот проект в жизнь."
 CHI_individual_soldier_system: "The Individual Soldier System"
 CHI_individual_soldier_system_desc: "Стрелок становится узлом, а не просто «спусковым механизмом». Новая система снаряжения солдата объединяет оптику, радиосвязь, навигацию и бронежилет в один комплект, подключая каждого пехотинца к сети отряда и карте командира."
 CHI_Indo_Pacific_Strategy_Collapsed: "Indo-Pacific Strategy Collapsed"
 CHI_Indo_Pacific_Strategy_Collapsed_desc: "Выход Южной Кореи из трехстороннего механизма сотрудничества между США, Японией и Филиппинами разрывает важнейшее звено в индо-тихоокеанской цепи Вашингтона. Японии приходится в одиночку решать свои проблемы в сфере безопасности, а авторитет США во всем регионе пошатнулся."
 CHI_Information_Warfare: "Information Warfare"
 CHI_Information_Warfare_desc: "Использовать государственные СМИ, операции в социальных сетях и стратегические нарративы для формирования общественного мнения в целевых странах и противодействия информационному доминированию Запада."
 CHI_informatized_local_wars: "Win Informatized Local Wars"
 CHI_informatized_local_wars_desc: "Мы больше не готовимся к тотальной войне на северной равнине. Руководящей доктриной становится победа в локальных войнах в условиях информационных технологий: короткие, острые, высокотехнологичные кампании на периферии Китая, исход которых определяется тем, кто первым обнаружит противника и нанесет удар на сетевом поле боя. Все последующие реформы теперь подчиняются этой единственной задаче."
 CHI_inner_party_supervision_regulations: "Inner-Party Supervision Regulations"
 CHI_inner_party_supervision_regulations_desc: "Наша внутрипартийная подотчетность слишком долго опиралась на неформальные нормы и личные связи. Мы должны принять официальные правила надзора, устанавливающие обязательные процедуры, в соответствии с которыми вышестоящие органы будут проводить проверки подчиненных партийных комитетов, составлять отчеты о них и налагать на них санкции. Кодификация этих механизмов ограничит возможности местных чиновников действовать как неприкосновенные феодальные владения."
 CHI_integrated_air_and_space: "Integrated Air and Space"
 CHI_integrated_air_and_space_desc: "Военно-воздушные силы должны перестать быть «зонтиком» для сухопутных войск и стать самостоятельным стратегическим родом войск. Мы стремимся к «интегрированным воздушным и космическим операциям, готовым как к наступлению, так и к обороне» — это доктрина, принятая в 2004 году, которая объединяет истребители, бомбардировщики, ракеты, спутники и системы раннего предупреждения в единую систему. Небо и ближний космос становятся единым театром военных действий, и он должен принадлежать нам."
 CHI_intra_party_democracy_experiments: "Intra-Party Democracy Experiments"
 CHI_intra_party_democracy_experiments_desc: "В ряде населённых пунктов были проведены конкурентные выборы с участием нескольких кандидатов на партийные должности на уровне округов и поселков. Сторонники этой модели утверждают, что конкурентный отбор укрепит легитимность и улучшит качество управления; критики же предупреждают, что выборы с участием нескольких кандидатов приведут к ослаблению идеологической дисциплины и возникновению межфракционной конкуренции. Результаты этих экспериментов определят, будем ли мы расширять эту модель или ограничивать её применение."
 CHI_invigorate_country_through_STE: "Invigorate the Country Through STE"
 CHI_invigorate_country_through_STE_desc: "В 1995 году, ближе к концу своего пребывания у власти, Цзян Цзэминь выдвинул стратегию возрождения нации посредством науки и образования. Уделяя приоритетное внимание инвестициям в научные исследования, технологическому догонянию и высшему образованию, этот план направлен на сокращение отставания от развитых стран и переход Китая от экономики, основанной на трудовых ресурсах, к экономике, основанной на знаниях."
 CHI_iron_ore_pricing_war: "The Iron Ore Pricing Battle"
 CHI_iron_ore_pricing_war_desc: "Компания «Баостиль» сменила «Ниппон Стил» в роли ведущего переговорщика от имени китайских покупателей на ежегодных переговорах по установлению эталонных цен на железную руду с компаниями «Рио Тинто», «BHP Billiton» и «Вале». Система рушится, поскольку спотовые закупки со стороны небольших китайских металлургических заводов подрывают эталонные цены. Арест руководителя Rio Tinto Стерна Ху в Шанхае и провал попытки Chinalco приобрести 18-процентную долю в Rio Tinto знаменуют пик дипломатических трений, и мы должны отреагировать на это ускорением инвестиций в зарубежные горнодобывающие предприятия в Австралии и Западной Африке с целью диверсификации наших поставок."
 CHI_j10c_multirole_refit: "The J-10C Refit"
 CHI_j10c_multirole_refit_desc: "J-10 становится все более грозным. Модификация J-10C оснащена радиолокатором с активной фазированной антенной решеткой (AESA), ракетой дальнего действия PL-15, а с 2021 года — отечественным двигателем WS-10B, что превращает этот легкий истребитель в настоящую многоцелевую угрозу, которая с тех пор уже пролила кровь в небе над Южной Азией."
 CHI_j11b_sinification: "Sinify the J-11"
 CHI_j11b_sinification_desc: "Истребитель Су-27, выпускаемый по лицензии в Шэньяне, становится китайским самолётом. В истребителе J-11B российские радиолокационные станции, авионика и ракеты заменены на отечественные системы, что избавляет линейку «Фланкер» от зависимости от запасных частей из Москвы и доказывает, что китайская промышленность способна полностью перепроектировать передовой истребитель."
 CHI_j16_strike_platform: "The J-16 Strike Platform"
 CHI_j16_strike_platform_desc: "Двухместный тяжелый истребитель J-16 «Цяньлун», созданный на базе «Фланкера», оснащен радиолокатором с активной фазированной антенной решеткой (AESA), обладает самым обширным арсеналом вооружения в авиации и имеет большую дальность полета. В настоящее время этот самолет является основным средством Китая для проникновения в воздушное пространство Тайваня и представляет собой многоцелевую ударную платформу, вокруг которой строится современная авиационная эскадрилья."
 CHI_jh7a_update: "The JH-7A Update"
 CHI_jh7a_update_desc: "JH-7A «Летающий леопард» — надежный двухместный истребитель-бомбардировщик — прошел модернизацию с установкой нового высокоточного вооружения и контейнеров целеуказания, что позволяет этому недорогому и проверенному самолету для нанесения ударов по морским целям оставаться актуальным на фоне более новых моделей флота."
 CHI_jiang_doctrine_taiwan: "The Jiang Doctrine on Taiwan"
 CHI_jiang_doctrine_taiwan_desc: "«Восьмипунктное предложение» Цзяна определяет политику в отношении Тайваня, ориентированную на мирное воссоединение, при этом прямо отказываясь исключать применение силы. Сочетание этой доктрины с растущим арсеналом средств противодействия доступу, которым располагают Вооруженные силы Китая, создает надежную систему принуждения и повышает издержки «де-юре» независимости Тайваня до уровня, который ни одно правительство в Тайбэе не сможет себе позволить с политической точки зрения."
 CHI_jiangnan_changxing_move: "The Jiangnan-Changxing Move"
 CHI_jiangnan_changxing_move_desc: "Зажатая в самом сердце старого Шанхая, историческая верфь Цзяннань не может расширяться. Мы переносим её вниз по течению на остров Чансин, в новые просторные цеха и к глубоководным причалам, построенным для спуска на воду десятков военных кораблей. Этот переезд в одночасье увеличивает наши производственные мощности в разы и превращает верфь в кузницу современного флота."
 CHI_jiangnan_scale: "Scale Up Jiangnan Shipyard"
 CHI_jiangnan_scale_desc: "Победы военных кораблей завоевываются на стапеле ещё до того, как они завоевываются в море. Огромные новые цеха верфи «Цзяннань» на острове Чансин работают на полную мощность, одновременно строя эсминцы и авианосцы, в то время как конкуренты строят их по одному за раз."
 CHI_joint_operations_command: "Joint Operations Command"
 CHI_joint_operations_command_desc: "Победа теперь принадлежит тому, кто сможет объединить сухопутные, морские, воздушные и ракетные войска в единый боевой кулак. Мы создаем подлинное объединенное оперативное командование, объединяя пять театров военных действий в единую оперативную картину, с тем чтобы сражение велось сразу всеми вооруженными силами, а не отдельными родами войск по очереди. Это позволяет преодолеть ограничения структуры театра военных действий."
 CHI_Joint_Operations_tt: "Triggers a strategic-choice event. The defensive option forms or extends the SCO faction with Afghanistan, Pakistan, and Tajikistan. The punitive and total-war options instead create wargoals on the Taliban and TTP through Pakistan's response."
 CHI_joint_stock_city_banks: "Joint-Stock Commercial Banks and City Banks"
 CHI_joint_stock_city_banks_desc: "Помимо «большой четверки» сформировался сильный второй эшелон. Банк «Чайна Мерчантс» стал лидером в сфере розничного банковского обслуживания благодаря развитому мобильному банкингу; «Чайна Миншэн», первый негосударственный банк, обслуживает малые и средние предприятия; HSBC владеет 19,9-процентной долей в «Банке коммуникаций». Более 130 городских коммерческих банков являются опорой региональной финансовой системы в городах второго и третьего уровней, способствуя расширению доступа частных компаний к кредитам и более быстрому внедрению цифровых банковских услуг. Это разнообразие финансовых учреждений — наша сильная сторона, которую мы должны развивать."
 CHI_joint_venture_framework: "Joint Venture Industrial Framework"
 CHI_joint_venture_framework_desc: "Всеобъемлющая нормативная база регулирует вопросы передачи технологий, требования к доле местного содержания и репатриацию прибыли в рамках совместных предприятий. Иностранные компании получают доступ к рынку; китайские партнеры приобретают технологии и управленческий опыт, которые постепенно поступают в отечественные компании."
 CHI_keep_the_shell_companies: "Keep the Shell Companies"
 CHI_keep_the_shell_companies_desc: "Получив приказ о продаже активов, мы продаем их лишь на бумаге. Военные предприятия перерегистрируются на имя родственников, подставных лиц и фиктивных компаний, а их прибыль по-прежнему поступает в подразделения, которым они принадлежат. Аудиторы обнаруживают пустые офисы, а генералы сохраняют свои доходы."
 CHI_kj2000_mainring_awacs: "The KJ-2000 Mainring"
 CHI_kj2000_mainring_awacs_desc: "После того как Вашингтон заблокировал продажу Израилю самолетов «Фалкон», Китай создал собственную разработку. KJ-2000 — отечественный радиолокатор с активной фазированной антенной решеткой, установленный на самолете Ил-76, — стал для ВВС первым настоящим воздушным командным пунктом, позволяющим истребителям наносить удары по целям, которые они еще не могут увидеть собственными глазами."
 CHI_kj500_network_centric_hub: "The KJ-500 Network Hub"
 CHI_kj500_network_centric_hub_desc: "Радар KJ-500 — стационарная система с тремя антенными решетками, установленная на турбовинтовом самолете Y-9, — является основным «глазом в небе». Выпускаемый серийно, он объединяет по каналу передачи данных истребители, корабли и ракеты в единую картину, выступая в роли «летающего узла» сетецентрической войны."
 CHI_KPA_Offensive_Readiness: "KPA Offensive Readiness"
 CHI_KPA_Offensive_Readiness_desc: "Мы молчаливо одобряем переход Корейской народной армии от стратегии глубокой обороны к стратегии наступательной готовности. Ускоряются поставки военной техники, расширяются совместные учения по планированию. Ситуация на полуострове становится всё более напряжённой."
 CHI_leader_of_the_people: "Renmin Lingxiu"
 CHI_leader_of_the_people_desc: "Третья историческая резолюция Коммунистической партии официально закрепляет титул «Рэньминь Линсю» («Народный лидер»), который в истории партии присваивался лишь двум деятелям: Мао Цзэдуну и Си Цзиньпину. Портрет Мао до сих пор висит над воротами Тяньаньмэнь. Третий исторический этап партии обрёл свою историческую фигуру, и значение этой преемственности не ускользает от внимания никого, кто внимательно прочитает резолюцию."
 CHI_leading_small_group_doctrine: "Central Leading Groups"
 CHI_leading_small_group_doctrine_desc: "В настоящее время небольшие группы центрального руководства одновременно курируют вопросы финансов, экономической реформы, международных отношений, кибербезопасности и военной реформы, причем все они находятся в ведении единого аппарата. Такая схема обходит традиционную комитетскую структуру Политбюро и концентрирует процесс принятия решений там, где он может осуществляться без задержек. Технократы выполняют, а центр координирует. Политика реализуется быстрее, и каждый результат подчиняется единой воле."
 CHI_Let_Seoul_Lead: "Let Seoul Lead"
 CHI_Let_Seoul_Lead_desc: "Мы заявляем о том, что признаем лидирующую роль Южной Кореи в любом возможном процессе объединения. Демократические институты и экономический вес Сеула делают его естественным опорным пунктом объединенной Кореи. Мы отступаем на второй план, чтобы позволить корейцам самим определять свое будущее."
 CHI_liangjiang_new_area: "Liangjiang National New Area"
 CHI_liangjiang_new_area_desc: "Район Лянцзян в Чунцине стал первой новой зоной национального уровня, расположенной вдали от побережья, вслед за Пудуном в Шанхае и Биньхаем в Тяньцзине. Эта зона привлекла такие компании, как Ford и HP, а также более 300 предприятий из списка «Fortune 500», и уже производит 1,19 млн автомобилей в год. Равнина Гуанчжун в Сиане получает аналогичные инвестиции, что позволяет провинции Шэньси занять позицию промышленного и торгового центра северо-запада. Модель себя оправдала; теперь нам необходимо расширить масштабы."
 CHI_Lips_and_Teeth_Doctrine: "Lips and Teeth Doctrine"
 CHI_Lips_and_Teeth_Doctrine_desc: "Мы вновь подтверждаем историческую связь с Северной Кореей. Обе страны, как и всегда, неразлучны, словно губы и зубы. Выживание Пхеньяна — наш стратегический императив, и мы будем действовать соответственно, несмотря на международное давление."
 CHI_Lithium_Triangle_Accord: "Lithium Triangle Accord"
 CHI_Lithium_Triangle_Accord_desc: "На долю Аргентины, Боливии и Чили в совокупности приходится более половины мировых извлекаемых запасов лития. Долгосрочные соглашения о закупках и доли участия в добывающих предприятиях обеспечивают китайским производителям аккумуляторов и электромобилей надежный доступ к сырью, которое определяет будущую энергетическую парадигму. Эти соглашения защищают китайские цепочки поставок от западных закупочных коалиций."
 CHI_Liu_Huaqing_Doctrine: "Liu Huaqing Doctrine"
 CHI_Liu_Huaqing_Doctrine_desc: "Адмирал Лю Хуацин, создатель нашей современной военно-морской стратегии, определил Первую и Вторую цепочки островов как стратегический периметр, в пределах которого наши военно-морские силы должны обеспечить неоспоримое господство, прежде чем расширять свое влияние дальше. Южно-Китайское море полностью находится в пределах Первой цепочки. Мы не сможем расширять свое влияние за пределы этого региона, пока он не будет полностью обеспечен безопасностью, и мы не можем откладывать обеспечение этой безопасности на неопределённый срок."
 CHI_liu_huaqing_first_island_chain: "Liu Huaqing's First Island Chain"
 CHI_liu_huaqing_first_island_chain_desc: "Эта линия проходит от Курильских островов через острова Рюкю и Тайвань до Борнео, и за ней мы должны взять под свой контроль прилегающие моря. Адмирал Лю Хуацин, отец современного ВМС КНР, учил, что флот «зелёных вод» должен сначала установить господство над Первой цепью островов, прежде чем он сможет мечтать о выходе в открытый океан. Его доктрина прибрежной обороны определяет наш курс: перекрыть подступы, овладеть прилегающими морями, а затем смотреть дальше."
 CHI_livestream_commerce: "Live-Streaming Commerce"
 CHI_livestream_commerce_desc: "Taobao Live сочетает развлечения с покупками в режиме реального времени в масштабах, недостижимых для западных аналогов. Вия и Остин Ли генерируют миллиарды в рамках одного эфира; 40 процентов нашего электронного коммерческого оборота сейчас проходит через каналы прямых трансляций. Агентства MCN управляют тысячами авторов контента, а регулирующие органы обеспечивают строгое соблюдение налогового законодательства, чтобы гарантировать, что богатство, проходящее через эти платформы, поступает в казну государства в соразмерном объеме. Мы сами определяем этот формат, и весь мир наблюдает за нами."
 CHI_logistic_modernisation: "Modernise Logistics"
 CHI_logistic_modernisation_desc: "Реформы на передовой не будут иметь никакого смысла, если цепочка снабжения даст сбой. В рамках новых Объединенных сил логистического обеспечения мы стандартизируем контейнеры, переводим грузы на паллеты и внедряем цифровые технологии в цепочку снабжения, чтобы обеспечить бригаду так же быстро, как она продвигается вперед."
 CHI_long_march_modernisation: "Long March Modernisation"
 CHI_long_march_modernisation_desc: "Семейство ракет-носителей «Чан Чжэн», разработанное Китайской корпорацией аэрокосмических наук и технологий, составляет основу всей нашей космической программы. Модернизация сборочных линий и совершенствование технологий обращения с ракетным топливом для моделей CZ-2, CZ-3, CZ-5 и CZ-7 позволяют повысить частоту запусков и их надёжность, а межотраслевые достижения в области двигателестроения напрямую используются в наших ракетных программах."
 CHI_long_range_firepower: "Long-Range Firepower"
 CHI_long_range_firepower_desc: "Дальность действия превосходит численность. Мы оснащаем тяжелые бригады ракетами дальнего действия и боеприпасами с длительным нахождением в воздухе, позволяя им разгромить тылы противника, его командные пункты и резервы еще до того, как танки вступят в непосредственный контакт."
 CHI_loongson_riscv: "Loongson and RISC-V Architecture"
 CHI_loongson_riscv_desc: "Линейка процессоров «Loongson», разработанная Институтом вычислительных технологий, представляет собой отечественную альтернативу архитектурам x86 и ARM для государственных серверов и встраиваемых систем. Наряду с «Loongson» открытая архитектура набора команд RISC-V привлекла наши инвестиции через организацию RISC-V International и отечественные стартапы, в том числе T-Head (подразделение Alibaba), Nuclei System Technology и SiFive China. Открытая система лицензирования RISC-V защищает наши отечественные разработки от воздействия американского экспортного контроля в отношении архитектур наборов команд, и с каждым годом эта защита становится всё более ценной."
 CHI_lunar_sample_return: "Lunar Sample Return"
 CHI_lunar_sample_return_desc: "В декабре 2020 года аппарат «Чанъэ-5» доставил на Землю 1,73 килограмма лунного базальта с горы Румкер — это были первые образцы с Луны, доставленные на Землю со времени советской миссии «Луна-24» в 1976 году. В июне 2024 года последовала миссия «Чанъэ-6», в ходе которой были добыты образцы из бассейна Южный полюс-Эйткен на обратной стороне Луны — это стало первым подобным достижением в истории космических программ. Мы сосредотачиваем наши ресурсы на этом направлении роботизированных научных исследований, расширяя архитектуру программ по доставке образцов на новые объекты и ускоряя научные исследования, которые становятся возможными благодаря этому."
 CHI_made_in_china_2025: "Made in China 2025"
 CHI_made_in_china_2025_desc: "Мы больше не можем оставаться «мировой фабрикой». Определены десять приоритетных секторов для перехода к лидерству в сфере высоких технологий: робототехника, аэрокосмическая отрасль, электромобили, передовое медицинское оборудование, полупроводники и другие. Нашими инструментами являются государственные субсидии, программы приобретения технологий и обязательные к выполнению целевые показатели по закупкам отечественной продукции. Вашингтон и Брюссель будут недовольны, но это направление, которого мы должны придерживаться."
 CHI_Maritime_Silk_Road_Indian_Ocean: "String of Pearls Strategy"
 CHI_Maritime_Silk_Road_Indian_Ocean_desc: "Сеть портовых инвестиционных проектов и логистических объектов вдоль побережья Индийского океана, включая Хамбантоту в Шри-Ланке и Доралех в Джибути, расширяет сферу нашего коммерческого и потенциального военно-морского влияния от Южно-Китайского моря до Африканского Рога. Критики описывают эту схему как «нитку жемчужин», опоясывающую Индию. Они не совсем неправы, и в этом-то и заключается суть."
 CHI_mass_line_education: "The Mass Line"
 CHI_mass_line_education_desc: "Кампания партии «Массовая линия» призывает чиновников отказаться от формализма, бюрократизма, гедонизма и расточительства. Роскошные банкеты запрещены; у тех, кого сфотографировали в дорогих часах на публике, эти часы конфискуют. Наши отношения с народом должны быть переосмыслены как служение, а не как привилегия. Этот посыл столь же политически выгоден, сколь и искренне популярен, и мы не должны упускать эту возможность."
 CHI_mass_line_renewed: "Renewed Mass Line"
 CHI_mass_line_renewed_desc: "Согласно «массовой линии» Мао Цзэдуна, партия должна учиться у народа, прежде чем возглавить его. Кадры и студенты направляются в сельские поселения и на производственные предприятия. Кампании по выслушиванию мнений заменяют директивы, идущие сверху вниз, а накопленный опыт масс учитывается при формировании партийной политики. Революция — это не званый ужин."
 CHI_mature_node_counter_offensive: "Mature-Node Counter-Offensive"
 CHI_mature_node_counter_offensive_desc: "После того как западные экспортные ограничения затормозили наше расширение производственных мощностей по передовым технологическим процессам, мы переориентировали инвестиции в производственные мощности на зрелые технологические процессы с размером транзисторов менее 28 нм. Компании SMIC, Hua Hong, CXMT и десятки более мелких производственных предприятий параллельно запускают проекты по расширению мощностей в Шанхае, Шэньчжэне и Ханчжоу. В настоящее время на нашу долю приходится более 33 процентов мирового прироста производственных мощностей по зрелым технологическим процессам. Западные правительства, встревоженные перспективой доминирования Китая в сегменте зрелых технологических процессов, обеспечивающем поставки электроники для автомобильной, промышленной и оборонной отраслей, обсуждают введение вторичных пошлин. Мы должны укрепить свои позиции до введения этих пошлин."
 CHI_Media_Offensive: "Media Offensive"
 CHI_Media_Offensive_desc: "Развернуть скоординированную глобальную медийную кампанию с помощью CGTN, «Синьхуа» и социальных сетей с целью донесения китайской точки зрения и противодействия враждебным нарративам."
 CHI_Mekong_Riparian_Cooperation: "Lancang-Mekong Cooperation"
 CHI_Mekong_Riparian_Cooperation_desc: "Механизм сотрудничества «Ланцан-Меконг» координирует совместное развитие инфраструктуры, управление водными ресурсами и содействие развитию торговли между шестью прибрежными государствами, на территории которых протекает эта речная система. Наши проекты по строительству плотин в верховьях реки и по улучшению судоходства дают нам значительное преимущество перед соседями в низовьях, которые зависят от стока, который мы контролируем. Нам следует официально закрепить эту систему взаимодействия, пока это преимущество не начнет восприниматься как принуждение."
 CHI_memory_independence: "Memory Chip Independence"
 CHI_memory_independence_desc: "Компания YMTC, штаб-квартира которой расположена в Ухане и которая пользуется поддержкой фонда Big Fund, наладила производство 128-слойной 3D NAND и реализовала 232-слойную архитектуру Xtacking, соответствующую технологиям Samsung и Micron аналогичного поколения. Компания CXMT в Хэфэе производит DDR4 по 17-нм технологическому процессу и разрабатывает технологические процессы, совместимые с DDR5. Кратковременная сертификация NAND-памяти YMTC компанией Apple продемонстрировала, что наша память достигла коммерческого уровня качества, прежде чем давление со стороны США вынудило исключить её из списка поставщиков Apple. Линия HBM2 компании CXMT начала серийное производство раньше запланированного срока, пройдя квалификацию для использования в конструкциях ИИ-ускорителей Cambricon и Biren и положив конец зависимости от импортной памяти в нашей цепочке поставок высокопроизводительных вычислительных ресурсов."
 CHI_mengshi_program: "The Mengshi Program"
 CHI_mengshi_program_desc: "«Мэнши» — китайская лёгкая бронированная машина, созданная по образцу Humvee, — обеспечивает мобильность лёгкой пехоты благодаря прочной, миноустойчивой конструкции, на которую можно установить пулемёты, ракеты или дистанционно управляемый боевой модуль."
 CHI_miit_licensing_framework: "MIIT Licensing and Carrier Restructuring"
 CHI_miit_licensing_framework_desc: "Министерство промышленности и информационных технологий должно официально закрепить систему лицензирования, которая предусматривает разделение бывшей монополии в сфере почты и телекоммуникаций на отдельные коммерческие операторы. Законодательно закреплены правила распределения радиочастотного спектра, тарифы на межсетевое соединение и обязательства по предоставлению универсальных услуг, что создает нормативную основу, на которой компании «China Mobile», «China Unicom» и «China Telecom» построят крупнейшие в мире сети 4G и 5G. Эпоха монополии выполнила свою задачу; на следующем этапе свою роль сыграет конкуренция."
 CHI_military_training_outline: "The New Training Outline"
 CHI_military_training_outline_desc: "Во всех подразделениях армии вводится новая «Программа военной подготовки» — свод правил, определяющий стандарты и задачи каждого подразделения. Впервые она разработана с учетом совместных сетевых операций и устанавливает для всей армии единый высокий уровень боеготовности."
 CHI_mobile_payment_duopoly: "The Mobile Payment Duopoly"
 CHI_mobile_payment_duopoly_desc: "Alipay, запущенный как сервис эскроу-платежей компании Alibaba, превратился в независимую платежную платформу. WeChat Pay привлек 200 миллионов пользователей за пять дней благодаря кампании с «красными конвертами» к китайскому Новому году. QR-коды теперь заменяют наличные деньги в более чем 90 процентах наших транзакций, не давая Visa, Mastercard и западным финтех-компаниям возможности закрепиться на рынке. Мы построили самую передовую в мире инфраструктуру потребительских платежей, которая функционирует полностью вне западной финансовой архитектуры."
 CHI_money_alliance: "The Alliance of Money"
 CHI_money_alliance_desc: "Богатство и власть сливаются в единую фракцию. Самые богатые офицеры и финансирующие их магнаты контрабанды объединяются, становясь достаточно сильными, чтобы защищать своих и диктовать условия Партии, которая номинально ими руководит."
 CHI_Monroe_Doctrine_Inverted: "Monroe Doctrine Inverted"
 CHI_Monroe_Doctrine_Inverted_desc: "Десятилетия терпеливых инвестиций, дипломатических усилий и кредитования инфраструктуры позволили нам занять позицию незаменимого внешнего партнера Латинской Америки — роль, которую Соединенные Штаты когда-то считали своей исключительной прерогативой. Способность Вашингтона мобилизовывать коалиции стран полушария против нас ослабла до такой степени, что Доктрина Монро на практике больше не соблюдается. Американский континент больше не является «американским озером». Мы должны обеспечить, чтобы он никогда больше им не стал."
 CHI_national_overall_emergency_response_plan: "National Emergency Response Plan"
 CHI_national_overall_emergency_response_plan_desc: "Кризис, связанный с атипичной пневмонией (SARS), с болезненной ясностью выявил пробелы в нашей национальной системе готовности к чрезвычайным ситуациям. Мы должны создать единую систему реагирования, охватывающую стихийные бедствия, чрезвычайные ситуации в сфере общественного здравоохранения, аварии и социальные волнения, с заранее размещенными ресурсами, четкими структурами управления и протоколами межведомственной координации на всех административных уровнях. Следующий кризис не будет предупреждать о себе заранее."
 CHI_naura_amec: "NAURA and AMEC Equipment Programmes"
 CHI_naura_amec_desc: "NAURA Technology Group и Advanced Micro-Fabrication Equipment производят оборудование для травления, CVD и PVD для наших отечественных полупроводниковых заводов. Компания NAURA прошла аттестацию в SMIC по оборудованию для травления по технологическому процессу 28 нм; травильные установки Primaxx от AMEC внедрены в линии массового производства. Обе компании выигрывают за счёт внутреннего спроса SMIC и вливаний капитала со стороны «Большого фонда». Их совокупный портфель оборудования в настоящее время охватывает примерно 40 процентов технологических этапов, необходимых для производства логических микросхем на зрелых технологических узлах. Остальные 60 процентов — это та область, на которой нам следует сосредоточиться в дальнейшем."
 CHI_nco_corps_reform: "A Professional NCO Corps"
 CHI_nco_corps_reform_desc: "Современную армию скрепляют не только полковники, но и сержанты. Мы формируем настоящий корпус унтер-офицеров — кадровых военнослужащих, обладающих званием, жалованием и полномочиями, — тем самым отказываясь от прежней практики опоры на краткосрочных призывников и сокращая разрыв между офицерами и новобранцами."
 CHI_new_energy_vehicles_startups: "The New Energy Vehicle Pioneers"
 CHI_new_energy_vehicles_startups_desc: "Компании NIO, XPeng, Li Auto, альянс HIMA (под эгидой Huawei) и Xiaomi вышли на автомобильный рынок в период с 2014 по 2024 год, опираясь на инвестиции в сфере высоких технологий, а не на государственные предприятия. Каждая из этих компаний привнесла в автомобильную отрасль программное обеспечение эпохи смартфонов, возможности искусственного интеллекта и узнаваемость потребительских брендов. Седан SU7 от Xiaomi собрал 88 898 предварительных заказов за 24 часа; кроссовер YU7 получил 240 000 подтвержденных заказов в первый же день."
 CHI_New_World_Order: "New World Order"
 CHI_New_World_Order_desc: "Наше информационное превосходство и охват средств массовой информации заложили основу для кардинального пересмотра международного порядка, возглавляемого Западом. Теперь мы должны задействовать наши сети влияния, государственные СМИ и инструменты тайных операций для продвижения многополярного мира, в котором именно наши нормы и модели управления определяют глобальную повестку дня."
 CHI_norinco_rationalism: "NORINCO Rationalised"
 CHI_norinco_rationalism_desc: "Компания «China North Industries», крупный производитель всего — от служебных винтовок до артиллерийских систем, — прошла процесс оптимизации и теперь сконцентрирована на основных направлениях. Избыточные производственные линии закрываются, прибыльные — объединяются, и арсенал сухопутных войск, наконец, представляет собой единое промышленное целое."
 CHI_northeast_revitalization_plan: "Northeast Revitalization Plan"
 CHI_northeast_revitalization_plan_desc: "Провинции «ржавого пояса» — Ляонин, Цзилинь и Хэйлунцзян — пережили резкий спад после реформы государственных предприятий. В 2003 году центральное правительство запустило программу возрождения, направив в регион инвестиции в инфраструктуру, льготные кредиты и перемещенные промышленные мощности."
 CHI_northeast_russia_corridor: "Northeast-Russia Economic Corridor"
 CHI_northeast_russia_corridor_desc: "Модернизируется инфраструктура трансграничной торговли, связывающая провинцию Хэйлунцзян с Дальним Востоком России, что способствует потокам ресурсов, трансграничным инвестициям и реализации совместных проектов развития. Этот коридор укрепляет китайско-российское стратегическое партнерство, наполняя его коммерческим содержанием."
 CHI_open_the_august_1st_building: "Open the August 1st Building"
 CHI_open_the_august_1st_building_desc: "В здании «1 августа» располагается Центральная военная комиссия, где Народно-освободительная армия подчиняется только партии и никому больше. Наньчанское восстание 1 августа 1927 года принесло партии первые винтовки; эта дата до сих пор дала название самой армии. Теперь начинается её перестройка: коррупция либо искореняется, либо поощряется, дивизии преобразуются в бригады, военно-воздушные силы объединяются с космическими, а береговая охрана превращается в флот открытого моря."
 CHI_Operation_New_Dawn: "Operation New Dawn"
 CHI_Operation_New_Dawn_desc: "Настал решающий момент. Офицеры в рядах Корейской народной армии, поддерживаемые Китаем, начинают наступление на резиденцию семьи Кимов. То, что последует за этим, будет кратким, жестоким и решающим. Северокорейское государство выживет, а его руководство — нет."
 CHI_Oppose_Strategic_Flexibility: "Oppose Strategic Flexibility"
 CHI_Oppose_Strategic_Flexibility_desc: "Вашингтонская доктрина «стратегической гибкости», позволяющая американским войскам, дислоцированным в Южной Корее, выходить за пределы полуострова, представляет собой недопустимое посягательство на наши интересы в области безопасности. Мы официально требуем её отмены."
 CHI_organisation_department_mandate: "Organisation Department Mandate"
 CHI_organisation_department_mandate_desc: "Отдел по организационным вопросам КПК курирует назначения, оценку и перевод более 70 миллионов партийных кадров, а это означает, что тот, кто контролирует этот отдел, контролирует кадровое будущее партии. Под руководством Цзэн Цинхуна отдел ужесточил контроль над назначениями в руководство провинций и переориентировал свои критерии оценки в пользу чиновников, имеющих значительные достижения в сфере промышленного развития."
 CHI_organisation_department_mandate_tt: "The §Y$CHI_organisation_department_1$§! will always be active when §YZeng Qinghong§! is the country leader."
 CHI_original_innovation_problem: "The Original Innovation Problem"
 CHI_original_innovation_problem_desc: "Подражание привело нас к границе; оно не может перенести нас за её пределы. Самая сложная реформа — это культурная реформа, требующая подлинных инноваций, которые бюрократическая наука давно задушила. Мы финансируем риск, терпимо относимся к неудачам и вознаграждаем прорывы, которых не может дать ни одна зарубежная модель."
 CHI_own_designs: "Our Own Designs"
 CHI_own_designs_desc: "Целое поколение мы занимались обратным инжинирингом советских чертежей и называли это прогрессом. Но теперь всё изменилось. Конструкторским бюро предписано создавать собственные разработки, а не копировать чужие, и наносить на следующую модель оружия китайский штамп вместо заимствованного."
 CHI_Pacific_Island_Forum_Pivot: "Pacific Island Forum Pivot"
 CHI_Pacific_Island_Forum_Pivot_desc: "Мы должны активизировать нашу дипломатическую кампанию в островных государствах Тихого океана, предлагая гранты на инфраструктурные проекты с облегченными условиями погашения долга, соглашения о рыболовстве и пакеты мер по дипломатическому признанию. Сам Форум станет ареной борьбы, поскольку мы будем завоевывать голоса колеблющихся участников и привлекать наблюдателей, находящихся под нашим покровительством. Австралия и Новая Зеландия, которые исторически доминировали в институциональных структурах Тихоокеанского региона, будут сталкиваться с оспариванием своего лидерства на каждой министерской сессии, пока не признают наш авторитет."
 CHI_Pax_Sinica: "Pax Sinica"
 CHI_Pax_Sinica_desc: "Международный порядок, в центре которого находится Китай, — порядок, в котором наш экономический вес, зависимость от нашей инфраструктуры и политическая ориентация вытесняют либеральный порядок, основанный на правилах, как организующий принцип глобальных отношений. Учёные назвали его «Pax Sinica». Мы же просто называем его миром, каким он должен быть. Его достижение станет кульминацией нашего века возрождения."
 CHI_Peaceful_Development: "Peaceful Development"
 CHI_Peaceful_Development_desc: "Продемонстрировать на деле, что подъем Китая является фактором глобальной стабильности. Вкладывать средства в миротворческую деятельность, оказание помощи при стихийных бедствиях и содействие развитию, чтобы завоевать репутацию ответственной державы."
 CHI_pearl_river_delta_tech_cluster: "Pearl River Delta Electronics Cluster"
 CHI_pearl_river_delta_tech_cluster_desc: "Дельта реки Чжуцзян укрепляет свои позиции в качестве крупнейшей в мире базы по производству электроники. В Шэньчжэне расположены компании «Huawei» и «ZTE»; в Дунгуане сосредоточены тайваньские контрактные производители; весь регион функционирует как единая интегрированная цепочка поставок для мирового рынка бытовой электроники."
 CHI_Peninsula_Strategy: "The Peninsula Strategy"
 CHI_Peninsula_Strategy_desc: "Мы находимся на перепутье на Корейском полуострове. Десятилетиям выверенной неопределённости должно прийти на смену целенаправленная стратегическая позиция. Мы будем тщательно выбирать свой путь, осознавая, что каждый вариант влечёт за собой необратимые последствия для регионального порядка."
 CHI_peoples_armed_police_integration: "Integrate the Armed Police"
 CHI_peoples_armed_police_integration_desc: "Начиная с 2018 года Народная вооруженная полиция, численностью два миллиона человек, находится в прямом подчинении Центральной военной комиссии, обеспечивая тыл и охрану границ, что позволяет полевой армии сосредоточиться на ведении боевых действий на внешних фронтах."
 CHI_Petrocaribe_Successor: "Successor to Petrocaribe"
 CHI_Petrocaribe_Successor_desc: "Программа Венесуэлы по предоставлению нефти на льготных условиях странам Карибского бассейна и Центральной Америки потерпела крах из-за санкций и неэффективного управления экономикой. Нам следует выступить в роли стабилизирующего кредитора, предоставляя кредиты под залог нефти Каракасу, Гаване и Манагуа в обмен на долгосрочные обязательства по поставкам. Такая договоренность укрепит наши связи с правительствами, уже оказавшимися в изоляции от западных рынков капитала, а их благодарность будет долговечной."
 CHI_Petroyuan_Settlement: "Petroyuan Initiative"
 CHI_Petroyuan_Settlement_desc: "Мы должны запустить фьючерсы на сырую нефть, номинированные в юанях, на Международной энергетической бирже, создав тем самым механизм, позволяющий экспортерам энергоресурсов в рамках инициативы «Один пояс, один путь» рассчитываться по контрактам в юанях, а не в долларах США. Устойчивое внедрение этой практики подорвет доминирование нефтедоллара и снизит нашу уязвимость перед финансовыми санкциями США. Каждый баррель, цена на который установлена в юанях, — это шаг к созданию международной финансовой системы, которой мы можем доверять."
 CHI_pgz_gun_missile_hybrid: "Gun-Missile Hybrid Defence"
 CHI_pgz_gun_missile_hybrid_desc: "Самоходная система PGZ объединяет в одном шасси автоматную пушку с радиолокационным наведением и ракеты ближнего действия, что позволяет сбивать низколетящие самолеты, вертолеты и беспилотники, которые ускользают из зоны действия ракет."
 CHI_phl_mlrs_modernisation: "PHL Rocket Modernisation"
 CHI_phl_mlrs_modernisation_desc: "Системы PHL-03 и модульная PHL-16 обеспечивают армию ракетной артиллерией дальнего действия с дальностью стрельбы в сотни километров, стирая грань между ракетной батареей и тактической ракетой и позволяя бригаде наносить удары глубоко в тыл противника."
 CHI_pipechina_gas_reform: "PipeChina Unbundling"
 CHI_pipechina_gas_reform_desc: "Корпорация «China Oil and Gas Piping Network Corporation» получает в собственность трубопроводные активы, хранилища и терминалы СПГ на сумму около 600 миллиардов юаней, переданные ей компаниями CNPC, Sinopec и CNOOC. Модель «X+1+X» предусматривает наличие единого нейтрального оператора среднего звена между множеством добывающих компаний и множеством дистрибьюторов, открывая доступ к инфраструктуре, которая ранее находилась под исключительным контролем национальных нефтяных компаний. ENN Energy, China Resources Gas, Beijing Enterprises и иностранные поставщики СПГ получают доступ к рынку, и рынок газораспределения впервые становится по-настоящему конкурентным."
 CHI_Piraeus_Model: "Piraeus Port Model"
 CHI_Piraeus_Model_desc: "Приобретение компанией COSCO контрольного пакета акций порта Пирей превратило главный торговый порт Греции в самый загруженный контейнерный порт Средиземноморья и стало образцом для нашей модели управления портами по всей Европе. Эта модель обеспечивает ощутимую экономическую выгоду для правительств стран, в которых мы ведем деятельность, и одновременно позволяет нам установить оперативный контроль над стратегически важными узловыми точками. Незначительные доли участия в Лиссабоне и Гамбурге позволяют поддерживать взаимодействие с властями этих городов, не вызывая при этом такого внимания со стороны регулирующих органов, которое вызвало бы приобретение контрольного пакета акций."
 CHI_plz_howitzer_program: "The PLZ Howitzer Program"
 CHI_plz_howitzer_program_desc: "Артиллерия, долгое время бывшая и гордостью, и «узким местом» армии, полностью переходит на самоходные установки. PLZ-05 — 155-мм гусеничная гаубица, находящаяся на вооружении с 2008 года, — не уступает западным образцам по дальности стрельбы и скорострельности и составляет огневую линию каждой тяжелой бригады."
 CHI_Polar_Silk_Road: "Polar Silk Road"
 CHI_Polar_Silk_Road_desc: "В нашей «Белой книге» по арктической политике Китай объявлен «приарктическим государством», а развитие трансполярных морских маршрутов одобрено в качестве северного продолжения «Морского шелкового пути». Таяние морского льда делает Северный морской путь коммерчески выгодным, сокращая время транзита между нами и Европой на срок до двух недель. Мы должны занять своё место в системе управления Арктикой, пока другие не закрыли нам дверь."
 CHI_policy_banks_cdb: "Policy Banks"
 CHI_policy_banks_cdb_desc: "Китайский банк развития, Экспортно-импортный банк Китая и Банк развития сельского хозяйства Китая образуют параллельную финансовую структуру, функционирующую вне рамок обычных коммерческих ограничений. В настоящее время Банк развития Китая (CDB) является крупнейшей в мире организацией по финансированию развития, превосходя по масштабам деятельность Всемирного банка и Азиатского банка развития вместе взятых; он финансирует строительство плотины «Три ущелья», высокоскоростных железнодорожных линий, а также предоставляет кредиты на инфраструктурные проекты в рамках инициативы «Пояс и путь» на сумму свыше 600 млрд долларов США в более чем 100 странах. Эти три банка — не просто финансовые учреждения; они являются инструментами национальной стратегии."
 CHI_politics_law_commision_realigned: "Political-Legal Commission Realigned"
 CHI_politics_law_commision_realigned_desc: "Комиссия по политическим и правовым вопросам координирует деятельность силовых структур, судов и прокуратуры. Её твёрдая ориентация на «Чунцинскую модель» подразумевает создание инфраструктуры наблюдения, способной выявлять угрозы до того, как они материализуются, и защищать революцию как от иностранного подрывного воздействия, так и от внутреннего саботажа."
 CHI_poly_goes_global: "Poly Goes Global"
 CHI_poly_goes_global_desc: "«Poly Technologies» поставляет китайские винтовки и ракеты в Африку, на Ближний Восток и в Латинскую Америку, а «Poly Culture» вкладывает полученные доходы в аукционные дома и недвижимость. Торговая компания армии превращается в глобальный конгломерат, её сделки заменяют нашу дипломатию, а её прибыли выходят за рамки любого бюджета."
 CHI_Post_Armistice_Architecture: "Post-Armistice Architecture"
 CHI_Post_Armistice_Architecture_desc: "Мы и Соединенные Штаты совместно предлагаем заменить перемирие 1953 года всеобъемлющей мирной концепцией, которая официально положит конец Корейской войне и обеспечит региональные гарантии безопасности, приемлемые для всех сторон."
 CHI_Predatory_Lending_Doctrine: "The Hambantota Doctrine"
 CHI_Predatory_Lending_Doctrine_desc: "Когда Шри-Ланка оказалась не в состоянии обслуживать кредит, взятый на строительство порта Хамбантота, она подписала договор аренды сроком на 99 лет, передавая оперативное управление одним из наших государственных предприятий. Нам следует закрепить эту модель на официальном уровне: с самого начала структурировать проекты таким образом, чтобы стратегические активы выступали в качестве залога, который в случае дефолта можно было бы конвертировать в права долгосрочного доступа. Должник сам выбирает условия, решая, погашать ли задолженность."
 CHI_private_oem_rise: "Rise of the Private OEMs"
 CHI_private_oem_rise_desc: "В качестве партнеров по совместным предприятиям были выбраны лишь четыре крупнейших государственных предприятия, однако правительства провинций, несмотря на это, поддерживали своих собственных производителей. Компании «Chery Automobile» в Уху, «Geely» в Чжэцзяне и «Great Wall Motors» в Баодине каждая нашла свой путь к легальному производству и постепенно завоевала рынок. В настоящее время частные производители выпускают треть всех наших легковых автомобилей, заполняя сегменты внедорожников, недорогих автомобилей и электромобилей, которые совместные предприятия предпочли игнорировать. Нам стоило бы оказать им поддержку."
 CHI_project_921: "Project 921"
 CHI_project_921_desc: "В сентябре 1992 года Центральная военная комиссия одобрила «Проект 921» — генеральный план по созданию китайской программы пилотируемых космических полетов. Этим решением было создано управление по пилотируемым космическим полетам при Китайской корпорации космических запусков (CASC), выделено финансирование на разработку космического корабля «Шэньчжоу» и закреплено намерение страны выйти на орбиту под собственным флагом."
 CHI_project_998: "Project 998"
 CHI_project_998_desc: "В 1995 и 1996 годах две американские авианосные группы вошли в Тайваньский пролив, а наш флот мог только наблюдать за этим. Проект 998 — это ответ на это унижение: последовательное наращивание военно-морского потенциала, направленное на подготовку к тому дню, когда авианосцы вернутся, — замена сил береговой обороны на силы, способные вести боевые действия в водах у наших собственных берегов."
 CHI_Project_Coordination_Cell: "BRI Project Coordination Group"
 CHI_Project_Coordination_Cell_desc: "Наши коридоры «Один пояс — один путь» охватывают десятки стран и сотни проектов, и без координационного органа в них будут накапливаться задержки, дублирование усилий и политическая уязвимость. Международный отдел ЦК (Чжунляньбу) должен возглавить межведомственную группу, которая будет рассматривать заявки, назначать руководителей проектов и контролировать сроки реализации. Порядок приводит к результатам. Результаты укрепляют доверие."
 CHI_project_jxx: "Project J-XX"
 CHI_project_jxx_desc: "Программа, начатая в конце 1990-х годов под названием «Проект J-XX», привела к созданию истребителя J-20 «Могучий дракон», первый полет которого состоялся в 2011 году, а на вооружение он поступил к 2017 году. Обладая стелс-характеристиками, дальностью полета и мощным ракетным вооружением, этот самолёт является первым истребителем пятого поколения за пределами США и России, созданным для уничтожения танкеров и самолётов раннего предупреждения, от которых зависит любая военная машина в Тихоокеанском регионе. Китай вступает в самый эксклюзивный клуб в небе."
 CHI_project_no_10: "Project Number 10"
 CHI_project_no_10_desc: "J-10, созданный в рамках секретного «Проекта 10», является первым современным истребителем китайской разработки — однодвигательным многоцелевым реактивным самолетом из Чэнду, конструкция которого не основана ни на одном советском чертеже. Именно на этом самолете национальная авиационная промышленность впервые научилась самостоятельно создавать истребители."
 CHI_property_tax_pilot_program: "Property Tax Pilot Programme"
 CHI_property_tax_pilot_program_desc: "Шанхай и Чунцин запустили первые пилотные программы по введению налога на недвижимость, в рамках которых взимаются умеренные ставки с вторых домов и дорогостоящих основных жилых объектов. Эти пилотные программы направлены на сдерживание спекулятивных покупок и диверсификацию доходов местных органов власти за счет источников, не связанных с продажей земельных участков. Если результаты окажутся положительными, нам следует распространить эту модель на всю страну, пока рынок недвижимости не превратился в бремя, с которым невозможно справиться."
 CHI_provincial_reshuffle: "Provincial Leadership Reshuffle"
 CHI_provincial_reshuffle_desc: "Цзэн организовал масштабную ротацию кадров в Национальном народном конгрессе. Ветераны шанхайской фракции заняли ключевые посты: Чэнь Лянъюй стал секретарем партийного комитета Шанхая, Хуан Цзю был включен в состав Постоянного комитета Политбюро, а Цзя Цинлинь возглавил Китайский народный политический консультативный совет. Эта перестановка укрепляет влияние «принцев» в самых богатых провинциях и в консультативном аппарате государства."
 CHI_provincial_youth_league_cohort: "Promote the Provincial Youth League Cohort"
 CHI_provincial_youth_league_cohort_desc: "Ли Кэцян в Хэнане. Ван Ян в Чунцине. Лю Яньдун набирает силу. Резерв «Туаньпай» обширен и терпелив — пусть он выходит на авансцену."
 CHI_public_health_reconstruction: "New Rural Cooperative Medical Scheme"
 CHI_public_health_reconstruction_desc: "Новая программа сельского кооперативного медицинского страхования объединяет взносы сельских жителей, местных органов власти и центрального бюджета для покрытия расходов на лечение в случае тяжелых заболеваний. Это первая в истории нашей республики систематическая программа медицинского страхования в сельской местности, и мы должны как можно скорее обеспечить практически всеобщий охват ею. Восемьсот миллионов крестьян не должны сталкиваться с финансовым крахом только из-за того, что они заболели."
 CHI_public_rental_housing_drive: "Public Rental Housing Drive"
 CHI_public_rental_housing_drive_desc: "Миллионы городских мигрантов и выпускников вузов живут в импровизированных жилищах, находясь в полной зависимости от частных арендодателей. Государство мобилизует строительные ресурсы для возведения доступного государственного жилья для сдачи в аренду в крупных городах, в котором будет взиматься субсидированная арендная плата и предоставляться право выкупа после трёх лет проживания."
 CHI_pudong_financial_hub: "Pudong Financial Centre"
 CHI_pudong_financial_hub_desc: "Новый район Пудун в Шанхае развивается как главный офшорный финансовый центр Китая. Строительство небоскребов в районе Луцзяцзуй, Шанхайской фондовой биржи и таможенных зон свидетельствует о стремлении Китая составить конкуренцию Гонконгу и Сингапуру в качестве региональных финансовых центров."
 CHI_qbz191_rifle: "The QBZ-191 Rifle"
 CHI_qbz191_rifle_desc: "Устаревшая винтовка QBZ-95 с конфигурацией «буллпап» уступает место модели QBZ-191 — винтовке традиционной конструкции с оптическим прицелом, устанавливаемым на направляющую, которая поступила на вооружение в 2019 году. Это современное оружие для пехотинца, от которого теперь ожидают ведения боевых действий в составе сетевого формирования, а не в одиночку."
 CHI_qinghai_tibet_railway_planning: "Qinghai-Tibet Railway"
 CHI_qinghai_tibet_railway_planning_desc: "Железная дорога Цинхай-Тибет пройдет по маршруту протяженностью 1 956 километров на средней высоте 4 500 метров, пересекая перевал Тангула. После завершения строительства она станет самой высокогорной железной дорогой в мире и нашим первым прямым железнодорожным сообщением с Лхасой, что позволит интегрировать Тибет в экономику и логистику остальной части страны так, как это никогда не смогли бы сделать ни автомобильные дороги, ни аэропорты."
 CHI_quiet_succession_engineering: "Engineering the Succession"
 CHI_quiet_succession_engineering_desc: "Власть Цзэн Цинхуна над Отделом по кадровым вопросам обеспечивает ему решающее влияние на разворачивающуюся сейчас борьбу за преемственность. Он должен склонить чашу весов в пользу Си Цзиньпина, а не Ли Кэцяна, которого поддерживает Коммунистический союз молодежи. Занятие первого места в Постоянном комитете Политбюро фактически подтвердит Си в качестве следующего генерального секретаря, и мы определим облик партийного руководства на следующее десятилетие ещё до того, как этот вопрос будет публично решён."
 CHI_ranks_for_sale: "Ranks for Sale"
 CHI_ranks_for_sale_desc: "Рекламная акция превращается в прайс-лист. Как делал Сюй Цайхоу с 1999 года, каждая звезда продается тому, кто предложит самую высокую цену, а наличные деньги доставляются в коробках с пометкой имени покупателя. Когда в его доме в Пекине наконец провели обыск, следователи вывезли оттуда более тонны наличных. Офицерский корпус, купивший свои звания, будет сражаться за свои инвестиции, а не за свою страну."
 CHI_rapid_reaction_corps: "The Rapid Reaction Corps"
 CHI_rapid_reaction_corps_desc: "Элитные воздушно-десантные и воздушно-штурмовые подразделения находятся в постоянной боевой готовности и способны в течение нескольких часов развернуться на территории Китая или за его пределами. Они превращают региональный кризис в свершившийся факт, не давая соперникам возможности организовать ответные действия."
 CHI_rare_earth_dominance: "Rare Earth Development Strategy"
 CHI_rare_earth_dominance_desc: "На долю Китая приходится примерно 85 процентов мирового производства редкоземельных металлов, которое сосредоточено во Внутренней Монголии и провинции Цзянси. Реализуемая по инициативе государства программа консолидации позволяет сократить масштабы нелегальной добычи, повысить стандарты переработки и закрепить за Китаем статус незаменимого поставщика для мировой высокотехнологичной промышленности."
 CHI_rare_earth_leverage: "The Rare Earth Lever"
 CHI_rare_earth_leverage_desc: "Мы перерабатываем редкоземельные элементы, без которых не обходится ни одно оружие в мире — это почти девяносто процентов мировых запасов, из которых изготавливаются магниты, встроенные в каждую управляемую ракету и каждый истребитель-невидимку. То, что раньше было просто экспортной продукцией, теперь становится рычагом: перекройте поставки — и арсенал соперника замерзнет на месте, в то время как наш будет работать в полную силу."
 CHI_Reclaim_The_Heavenly_Waters: "Reclaim the Heavenly Waters"
 CHI_Reclaim_The_Heavenly_Waters_desc: "«Тяньшуй» («Небесные воды») — это древнее поэтическое название морей, окружающих Поднебесную. Название придает особый колорит; само действие же носит современный и военно-морской характер. Надводные группы ВМС КНР начинают наращивать вторжения в спорные воды архипелага Спратли, бросая вызов судам береговой охраны стран-претендентов, срывая операции по снабжению и предъявляя каждому правительству ультиматум: либо признать административную власть Китая над спорными островными образованиями, либо столкнуться с очередным выходом флота. Противостояние продвигается вперёд только тогда, когда мы достигаем решающего тактического результата; нерешительные столкновения и неудачи затормаживают эскалацию конфликта."
 CHI_reconstruction_development: "Reconstruction Capacity"
 CHI_reconstruction_development_desc: "Многолетние инвестиции в инфраструктуру и накопленный потенциал строительного сектора обеспечили нам исключительную способность оперативно восстанавливать инфраструктуру после стихийных бедствий и промышленных аварий. Основой этой способности служат стандартизированные протоколы реагирования на чрезвычайные ситуации, заранее размещенные запасы оборудования и специализированные инженерные подразделения вооруженных сил. Мы должны вкладывать средства в поддержание этой способности на высоком уровне, ведь следующее землетрясение или наводнение не будет ждать, пока мы будем готовы."
 CHI_red_arrow_program: "The Red Arrow Program"
 CHI_red_arrow_program_desc: "Противодействием бронетехнике служит семейство противотанковых ракет «Красная стрела» — модели HJ-8 и HJ-9, которыми вооружены самые разные системы: от пехотных треног до боевых машин и вертолетов. Эти недорогие, доступные в большом количестве и постоянно совершенствуемые ракеты обеспечивают каждому подразделению возможность уничтожать танки на значительных расстояниях."
 CHI_Renminbi_Internationalization: "Yuan as Reserve Currency"
 CHI_Renminbi_Internationalization_desc: "Мы запустили систему трансграничных межбанковских расчетов для проведения операций в юанях вне сети SWIFT, а Международный валютный фонд включил юань в корзину специальных прав заимствования. Расчеты по торговле в рамках инициативы «Один пояс, один путь» в юанях неуклонно увеличивают долю нашей валюты в мировых резервах. Теперь нам необходимо углублять эти механизмы до тех пор, пока юань не станет подлинной альтернативой доллару для партнеров, ценящих свою независимость."
 CHI_Responsible_Stakeholder: "Responsible Stakeholder"
 CHI_Responsible_Stakeholder_desc: "Нам следует откликнуться на призыв международного сообщества стать конструктивным участником деятельности глобальных институтов. Углубляя торговые связи и снижая напряженность на многосторонних форумах, мы позиционируем себя как незаменимого партнера, а не как ревизионистского соперника. Это определение имеет значение, даже если лежащая в его основе стратегия остается прежней."
 CHI_rmb_internationalisation: "Renminbi Internationalisation"
 CHI_rmb_internationalisation_desc: "Запущена пилотная программа расчетов по торговым операциям в юанях, и в настоящее время подписаны соглашения о валютных свопах с более чем 40 центральными банками. МВФ включил юань в корзину специальных прав заимствования, и это признание не может быть отозвано. Система трансграничных межбанковских расчетов (CIPS) предоставляет альтернативу SWIFT с использованием юаня и насчитывает более 1 500 учреждений-участников. После исключения России из системы SWIFT примерно 90 процентов российско-китайской торговли переходит на CIPS и валютную пару «юань-рубль», а Саудовская Аравия, ОАЭ и Бразилия начинают принимать юань в расчетах по сырьевым контрактам. Долларовая система не рушится, но у неё теперь появился соперник."
 CHI_Rome_Memorandum: "Rome BRI Memorandum"
 CHI_Rome_Memorandum_desc: "Подписание Италией Меморандума о взаимопонимании в рамках инициативы «Пояс и путь» стало первым подобным шагом со стороны страны-члена «Большой семерки», что привело к расколу западного консенсуса по сдерживанию нашей инфраструктурной дипломатии в Европе. Соглашение охватывает сотрудничество в сфере портовой, железнодорожной и цифровой инфраструктуры, при этом Триест и Генуя позиционируются в качестве терминалов на северном побережье Адриатики и Лигурии для наших грузов. Брюссель и Вашингтон будут оказывать давление на Рим с целью заставить его отказаться от участия, однако коммерческая привлекательность наших инвестиций должна обеспечить их политическую устойчивость, если мы будем грамотно выстраивать отношения."
 CHI_sasac: "Hand the Firms to SASAC"
 CHI_sasac_desc: "Предприятия, изъятые из ведения армии, не исчезают; они переходят в ведение Комиссии по надзору и управлению государственным имуществом, созданной в 2003 году для контроля над ключевыми секторами экономики. Военная прибыль превращается в гражданские дивиденды, которые учитываются в Пекине, а не в казармах."
 CHI_sasac_founding: "State-Owned Assets Supervision Commission"
 CHI_sasac_founding_desc: "Наш сектор государственных предприятий на протяжении долгого времени страдал от разрозненного ведомственного надзора в отсутствие единой стратегии управления. Мы должны создать специальную надзорную комиссию для консолидации контроля над нашими централизованно управляемыми предприятиями, ввести контракты на достижение результатов для руководящего состава, ввести обязательное перечисление дивидендов и проводить экспертизу важных инвестиционных решений. Государство должно выступать в роли акционера, а не просто в качестве регулятора."
 CHI_saturn_engine_crisis: "The Saturn Engine Crisis"
 CHI_saturn_engine_crisis_desc: "Китай может изготовить корпус самолета, но не его «сердце». Наши лучшие истребители по-прежнему летают на российских двигателях «Сатурн» АЛ-31, и любое эмбарго или повышение цен со стороны Москвы грозит оставить весь парк на земле. Двигатель WS-10 «Тайхан» необходимо заставить работать любой ценой, иначе наша независимость останется лишь фикцией, прикрывающей импортные турбины."
 CHI_scientific_development_outlook_foreshadowed: "Foreshadow Scientific Development Outlook"
 CHI_scientific_development_outlook_foreshadowed_desc: "Предоставить вице-президенту идеологическое пространство. Сторонники Ху Цзиньтао получают возможность для доктринального прорыва — устойчивое развитие, восстановление баланса в сельских районах, подход, ориентированный на человека."
 CHI_scientific_outlook_on_development: "Scientific Outlook on Development"
 CHI_scientific_outlook_on_development_desc: "Философия управления Ху Цзиньтао предусматривает развитие, ориентированное на человека, всестороннее, сбалансированное и устойчивое. Принятие этой философии в качестве партийной доктрины позволит переориентировать политику с приоритета роста ВВП на более широкие социальные и экологические показатели. Вопрос заключается в том, удастся ли убедить провинциальных чиновников, которые на протяжении десятилетия оптимизировали свою деятельность с целью достижения целевых показателей производства, переориентироваться на достижение целей, которые сложнее измерить."
 CHI_scientific_outlook_on_development_tt: "§RBecause we lost $CHI_scientific_outlook_idea_1$ we gain:§!"
 CHI_SCO_Exclusive_Core: "SCO Exclusive Core"
 CHI_SCO_Exclusive_Core_desc: "Вместо того чтобы размывать потенциал ШОС за счет стремительного расширения, нам следует углублять интеграцию между существующими членами. Укрепление связей между небольшой группой стран, приверженных этой идее, принесет более значительные стратегические дивиденды."
 CHI_SCO_Exclusive_Core_tt: "§GEnhances§! member cooperation and §Rblocks§! new dialogue partner applications. Existing members receive permanent opinion bonuses."
 CHI_SCO_Plus_Expansion: "SCO+ Expansion"
 CHI_SCO_Plus_Expansion_desc: "Сила ШОС заключается в ее широком охвате. Снижая барьеры для вступления и активно привлекая новых партнеров к диалогу, мы сможем расширить сферу влияния организации в Азии, на Ближнем Востоке и за их пределами."
 CHI_sea_eagles_carrier_wing: "The Carrier Air Wing"
 CHI_sea_eagles_carrier_wing_desc: "Несколько истребителей — это ещё не авиационная эскадрилья. Мы дополняем палубу авианосца вертолётами раннего воздушного предупреждения, противолодочной обороны и радиоэлектронной борьбы, объединяя все эти летательные аппараты в единую интегрированную эскадрилью, способную вести разведку, обеспечивать прикрытие и наносить удары как единое целое."
 CHI_sea_eagles_of_the_liaoning: "Sea Eagles of the Liaoning"
 CHI_sea_eagles_of_the_liaoning_desc: "Палуба авианосца «Ляонин» обзаводится своими «когтями». J-15 «Летающая акула» — тяжелый палубный истребитель, созданный на базе Су-33, — вооружен и подготовлен в качестве ударного самолета, а доктрина авианосной ударной группы, предусматривающая проецирование воздушной мощи с движущегося китайского авианосца, сформулирована впервые."
 CHI_second_gen_platforms: "The Second Platform Generation"
 CHI_second_gen_platforms_desc: "ByteDance запускает приложение Douyin на внутреннем рынке и TikTok на международном, охватывая аудиторию, на которую поколение BAT никогда не ориентировалось. Pinduoduo революционизирует электронную коммерцию благодаря механизму групповых покупок, который охватывает потребителей в городах четвёртого уровня и на сельских рынках; Meituan лидирует в сфере услуг по запросу. Didi поглощает Uber China. Вторая волна платформ углубляет нашу цифровую экономику в сегменты, которые первое поколение считало слишком разрозненными или недостаточно привлекательными для развития."
 CHI_Second_Island_Chain_Reach: "Second Island Chain Projection"
 CHI_Second_Island_Chain_Reach_desc: "Права доступа ВМС НОАК в меланезийской и полинезийской частях Тихого океана позволяют нашим передовым оперативным базам находиться в зоне досягаемости Гуама, Гавайев и морских путей, связывающих Соединенные Штаты с их восточноазиатскими союзниками. Такое расширение присутствия нарушает стратегическую логику «второй цепи островов», на которую американские стратеги опирались со времен холодной войны. Австралия теряет географический буфер, который она всегда считала незыблемым. Нам следует действовать, пока они не осознали, что его больше нет."
 CHI_Secure_The_Heavenly_Waters: "Secure the Heavenly Waters"
 CHI_Secure_The_Heavenly_Waters_desc: "«Тяньшуй» («Небесные воды») — это древнее название морей, окружающих владения Поднебесной. Те, кто отказался принять приглашение признать надлежащий порядок, теперь приведены к послушанию силой оружия. Южное море вновь находится под законным управлением под нашей властью."
 CHI_seed_security_campaign: "Seed Security Campaign"
 CHI_seed_security_campaign_desc: "«Соевая война» наглядно продемонстрировала нашу уязвимость: зерновые трейдеры из группы ABCD приобрели 70 процентов наших мощностей по переработке сои после того, как отечественные переработчики обанкротились из-за спекулятивных позиций на фьючерсном рынке. Мы не должны допустить повторения подобной ситуации. Город Санья на острове Хайнань служит нашей селекционной базой в Нанфане, где благодаря тропическим зимам удается выращивать три селекционных поколения в год. Приобретение компанией ChemChina компании Syngenta ставит глобальные коллекции генетического материала под контроль государства, в то время как компании Longping Hi-Tech и зерновое агентство «Бэйдахуан» объявлены национальными лидерами в сфере семенного суверенитета."
 CHI_selective_anti_corruption: "Selective Anti-Corruption Campaign"
 CHI_selective_anti_corruption_desc: "Антикоррупционные расследования середины 2000-х годов носили крайне избирательный характер. Дела возбуждались в отношении чиновников, которые создали собственные базы власти или вышли за рамки фракционных границ, в то время как союзники и покровители оставались в стороне от расследований. Политическая составляющая этих судебных преследований подрывала их легитимность и вызывала недовольство фракций внутри партии."
 CHI_Seoul_Under_Our_Umbrella: "Seoul Under Our Umbrella"
 CHI_Seoul_Under_Our_Umbrella_desc: "Мы и Южная Корея официально закрепляем рамки стратегического партнерства. Наши гарантии безопасности заменяют союз с США, ведётся переговоры о доступе ВМС Китая к острову Чеджу, а американские войска приступают к долгожданному выводу с полуострова."
 CHI_service_of_the_three_distances: "Service of the Three Distances"
 CHI_service_of_the_three_distances_desc: "Военно-морские силы пересматривают границы своего действия. Помимо обороны прибрежных вод в рамках «первой цепи» Лю Хуацина, они теперь ведут подготовку как для действий в отдаленных морях, так и в открытом океане — на всех трех дистанциях, на которых глобальный флот должен быть готов к ведению боевых действий. Доктрина решительно смещается от обороны побережья к проведению операций во всех океанах мира."
 CHI_seventeen_plus_one_mechanism: "16+1 Cooperation Framework"
 CHI_seventeen_plus_one_mechanism_desc: "Платформа «17+1» для сотрудничества между Китаем и странами Центральной и Восточной Европы направляет наши инвестиции в инфраструктуру Европейского союза и стран-кандидатов, что вызывает в Брюсселе опасения по поводу отклонения от единой позиции государств-членов и обхода нормативных требований. Брюссель прав в своих опасениях. Нам следует углублять эти отношения именно потому, что они раздробляют единый европейский фронт, который ограничивает наш доступ к рынку."
 CHI_shadow_banking_cleanup: "Shadow Banking and Financial Risk Cleanup"
 CHI_shadow_banking_cleanup_desc: "В результате масштабных мер стимулирования экономики в 2008 и 2009 годах продукты по управлению активами и трастовые компании накопили непрозрачные риски в сфере недвижимости и механизмах финансирования местных органов власти. Новые правила управления активами требуют установления цен на продукты по управлению активами на основе чистой стоимости активов и отменяют неявные гарантии. Страховая компания «Аньбан» была национализирована государством после того, как она безрассудно потратила 300 миллиардов долларов США на зарубежные приобретения. Группа HNA обанкротилась под тяжестью собственной задолженности. Меры по наведению порядка позволили сконцентрировать надзор за рисками в реформированном Китайском управлении по надзору за банковской деятельностью и страхованием (CBIRC) и стабилизировать межбанковский рынок. Дисциплина — это не наказание, а цена системы, которой мы можем доверять."
 CHI_shandong_at_sanya: "Shandong at Sanya"
 CHI_shandong_at_sanya_desc: "Второй авианосец полностью принадлежит нам. Авианосец типа 002 «Шаньдун» — первый авианосец, спроектированный и построенный в Китае, — был спущен на воду в 2017 году и введён в строй в 2019 году, после чего его базовым портом стал город Санья на острове Хайнань, рядом с подводными ангарами Юйлинь. С юга он наблюдает за морскими путями и спорными островами, которые Китай намерен удержать."
 CHI_shantytown_renovation: "Shantytown Renovation Programme"
 CHI_shantytown_renovation_desc: "В рамках национальной программы реконструкции трущоб сносят заброшенное жилье для рабочих в старых угледобывающих и горнодобывающих провинциях и заменяют его современными жилыми и промышленными районами. Провинции Шаньси и Хэнань, страдающие от устаревшей инфраструктуры тяжелой промышленности, получают наибольшие ассигнования. Расходы центрального правительства на эту программу достигают 1,54 триллиона юаней, что вызывает волну заключения строительных контрактов и открытие новых промышленных зон во внутренних районах страны, где их раньше не было."
 CHI_shenyang_j35_gyrfalcon: "The J-35 Blue Shark"
 CHI_shenyang_j35_gyrfalcon_desc: "Ко первому истребителю-невидимке присоединяется второй. Разработанный в Шэньяне и созданный на базе демонстрационного образца FC-31 истребитель J-35 представляет собой двухдвигательный самолет пятого поколения, рассчитанный как на базирование на суше, так и на палубах авианосцев, что позволяет Китаю сформировать вместе с J-20 пару истребителей-невидимок «высокого» и «низкого» уровней, которую в противном случае могут развернуть только Соединенные Штаты."
 CHI_shenzhou_program: "The Shenzhou Programme"
 CHI_shenzhou_program_desc: "15 октября 2003 года Ян Ливэй стартовал на борту корабля «Шэньчжоу-5» с космодрома Цзюцюань, став первым китайским космонавтом. Эта миссия, состоявшая из четырнадцати витков вокруг Земли и длившаяся двадцать один час, сделала Китай третьей страной, самостоятельно отправившей человека в космос, и положила начало программе пилотируемых космических полётов, которая впоследствии расширилась и стала включать выход в открытый космос, стыковку на орбите и длительные миссии на космической станции."
 CHI_sicarrier_euv: "SiCarrier EUV Programme"
 CHI_sicarrier_euv_desc: "Компания SiCarrier Technology, созданная при прямой государственной поддержке, призвана ликвидировать отставание в области EUV. Программа опирается на отечественные разработки в области оптического проектирования, созданные в Чанчуньском институте оптики, а также на опыт компании CNNC в изготовлении зеркал. Для создания работоспособного демонстрационного образца EUV необходимо налаживание отечественного производства источников излучения с длиной волны 13,5 нм, многослойной отражательной оптики и подставок для пластин с точностью на уровне менее одного нанометра. Это наша самая амбициозная попытка достичь полной самостоятельности в области производства полупроводникового оборудования. Наличие рабочего отечественного EUV-оборудования означает, что мы сможем изготавливать передовые микросхемы от начала до конца без единой лицензии на иностранное оборудование, тем самым подрывая в корне западный режим экспортного контроля."
 CHI_Silk_Road_Fund: "Silk Road Fund"
 CHI_Silk_Road_Fund_desc: "Фонд «Шелковый путь», капитал которого составляет 40 миллиардов долларов и формируется за счет наших валютных резервов и суверенных фондов благосостояния, предоставляет долевое финансирование для проектов в рамках инициативы «Один пояс, один путь», которые коммерческие банки и многосторонние кредиторы не готовы финансировать в одиночку. Это тот инструмент, благодаря которому мы можем дать зелёный свет проектам, которые в противном случае застряли бы на месте из-за отсутствия первопроходца, готового взять на себя риск."
 CHI_sinograin_strategic_reserve: "Sinograin"
 CHI_sinograin_strategic_reserve_desc: "Китайская корпорация зерновых резервов продолжает традиции императорских зернохранилищ династий Суй и Тан, опорой которой служит район Бэйдахуан в провинции Хэйлунцзян, черноземные фермы которого производят больше зерна, чем любая другая провинция. «Синогрейн» реализует политику минимальных закупочных цен на зерно, осуществляя закупки от имени государства в периоды падения рыночных цен. К зерновым запасам присоединился стратегический резерв свинины — единственный в своём роде в мире, и мы должны рассматривать эту систему как стратегический актив, которым она и является."
 CHI_smee_lithography: "SMEE Lithography Development"
 CHI_smee_lithography_desc: "Группа «Шанхай Микро Электроникс Эквипмент» (SMEE) — наш единственный производитель литографического оборудования, выпускающий экспонирующие установки с технологическим процессом 90 нм и 110 нм для процессов упаковки и финальной стадии производства. Государственное финансирование ускоряет разработку иммерсионного DUV-сканера с технологическим процессом 28 нм; в настоящее время поступают сообщения о ходе его аттестации на отечественных полупроводниковых заводах. SMEE по-прежнему отстает на одно поколение от самых мощных установок ASML, однако производство DUV-оборудования внутри страны устраняет нашу зависимость при расширении производственных мощностей для зрелых технологических узлов и создает необходимую основу для развития в направлении литографии передовых технологических узлов. Отставание существует, но направление развития верное."
 CHI_smic_advanced_node: "SMIC Advanced-Node Push"
 CHI_smic_advanced_node_desc: "После включения нашей компании в «Список юридических лиц США» компания SMIC ускорила развитие собственных технологий. Наши инженеры адаптировали существующее оборудование для DUV-технологии, чтобы достичь плотности, эквивалентной 7 нм, за счет многократного формирования рисунка — этот результат подтвердил, что творческий подход к проектированию технологических процессов может частично заменить доступ к EUV-технологии. Это достижение дало время для разработки отечественного оборудования и позволило переосмыслить технологический разрыв как решаемую инженерную задачу. Выпуск Mate 60 Pro продемонстрировал миру эти производственные возможности, что вызвало новую волну проверок со стороны органов экспортного контроля США, и такая реакция говорит нам о том, что мы действуем правильно."
 CHI_smic_zhangjiang: "SMIC Zhangjiang Expansion"
 CHI_smic_zhangjiang_desc: "Компания Semiconductor Manufacturing International Corporation построила свой флагманский комплекс по производству полупроводников с 300-мм пластинками в высокотехнологичном парке Чжанцзян, а государственные инвестиции в последовательное расширение производственных мощностей позволили SMIC перейти к производству по технологическому процессу 28 нм и начать экспериментальное производство по технологическому процессу 14 нм. Каждый последующий технологический узел сокращает отставание от TSMC и Samsung, и в настоящее время SMIC является единственным фаундри на материковом Китае, способным производить сложные логические микросхемы. Мы должны защитить этот актив и способствовать его дальнейшему развитию."
 CHI_smuggling_tax: "Tax the Smuggling"
 CHI_smuggling_tax_desc: "Армия не управляет всеми этими махинациями; она просто выдает на них лицензии. Контрабандисты, перевозящие нефть, автомобили и сигареты через порты и гарнизоны, платят местным командирам за защиту, и эти сборы превращаются в неофициальный бюджет, который ни одно министерство не может ни увидеть, ни затронуть."
 CHI_Soft_Power_Projection: "Soft Power Projection"
 CHI_Soft_Power_Projection_desc: "Создать институты Конфуция в университетах по всему миру и расширить международный охват государственных СМИ с целью популяризации китайского языка, культуры и мировоззрения за рубежом."
 CHI_special_operations_forces: "Special Operations Forces"
 CHI_special_operations_forces_desc: "Каждый театр военных действий формирует собственные бригады сил специальных операций, подготовленные для проведения рейдов, разведки и обезглавливающих ударов. Они являются остриём клинка, которое вводится в бой перед основными силами, чтобы открыть дверь изнутри."
 CHI_star_market_bse: "STAR Market and Beijing Stock Exchange"
 CHI_star_market_bse_desc: "Совет по научно-техническим инновациям Шанхайской фондовой биржи вводит первичное публичное размещение акций (IPO) на основе регистрации, структуру акций с двумя классами и возможность листинга для компаний, еще не приносящих прибыль. Компания SMIC привлекает 7,5 млрд долларов США на бирже STAR; за ней следует Пекинская фондовая биржа, ориентированная на инновационные малые и средние предприятия. В совокупности эти платформы позволяют компаниям, работающим в сфере полупроводников, биотехнологий и передовых производственных технологий, привлекать капитал на внутреннем рынке, не полагаясь на листинг на Уолл-стрит. Наши рынки капитала больше не представляют собой риск зависимости."
 CHI_state_council_information_office: "State Council Information Office"
 CHI_state_council_information_office_desc: "Информационное бюро Государственного совета курирует наши внешние коммуникации, пропагандистские мероприятия за рубежом, управление интернетом внутри страны и аккредитацию иностранных СМИ. Мы должны использовать его для институционализации фильтрации контента в рамках программы «Золотой щит» и расширения нашего международного вещания, чтобы противостоять доминированию западной нарративной линии. Информационная среда — это поле боя, и мы не можем позволить себе уступить его по умолчанию."
 CHI_stock_exchanges_shanghai_shenzhen: "Shanghai, Shenzhen, and Hong Kong Exchanges"
 CHI_stock_exchanges_shanghai_shenzhen_desc: "На Шанхайской фондовой бирже котируются крупные государственные предприятия, в том числе «большая четверка» банков, Sinopec, PetroChina и China Mobile. На Шэньчжэньской фондовой бирже представлены частные компании и инновационные предприятия, такие как BYD, Midea, Gree и Ping An. Платформа ChiNext в Шэньчжэне выполняет функцию аналога NASDAQ для акций быстрорастущих компаний. Программы «Шанхай-Гонконг» и «Шэньчжэнь-Гонконг» (Stock Connect) открывают контролируемый канал доступа для международных портфельных инвесторов без полной либерализации счета капитала, что позволяет нам привлекать иностранный капитал на наших собственных условиях."
 CHI_strategic_materials: "Strategic Material Supply Chains"
 CHI_strategic_materials_desc: "Мы контролируем более 80 процентов мировых мощностей по переработке галлия и германия и занимаем доминирующее положение в поставках флюорита, металлического кремния и редкоземельных элементов, используемых в производстве полупроводников. В соответствии с экспортным контролем США мы вводим обязательное лицензирование экспорта галлия и германия, а также устанавливаем дополнительные ограничения на соединения арсенида галлия. Внутренняя политика перенаправляет производство стратегических материалов на наши собственные заводы, что позволяет снизить затраты и обеспечить непрерывность поставок для производственных предприятий, работающих в условиях ограничений, налагаемых списком организаций. «Узкое место» в поставках материалов действует в обоих направлениях."
 CHI_strategic_reserve_system: "The Strategic Reserve System"
 CHI_strategic_reserve_system_desc: "Глубина — это сама по себе оборона. Реформированная система резерва и мобилизации готова направить на фронт огромные массы подготовленного личного состава, гарантируя, что даже затяжная война на истощение — это война, которую Китай сможет пережить."
 CHI_streamline_the_ranks: "Streamline the Ranks"
 CHI_streamline_the_ranks_desc: "Армия численностью в два миллиона человек, созданная для того, чтобы завалить захватчика человеческими телами, не способна выиграть войну, основанную на точности. Мы сокращаем раздутую пехоту, выводим из строя устаревшее вооружение и направляем сэкономленные средства на огневую мощь, средства обнаружения и мобильность. Народно-освободительная армия станет меньше, более боеспособной и, впервые, станет силой, созданной для победы, а не просто для выживания."
 CHI_strike_black_sing_red: "Strike Black, Sing Red"
 CHI_strike_black_sing_red_desc: "Двухнаправленная кампания по очищению политической системы. В рамках акции «Strike Black» арестованы тысячи представителей организованной преступности и коррумпированных чиновников, что позволяет ликвидировать сети протекции, разъедающие систему местного самоуправления. Акция «Sing Red» возрождает революционные песни и маоистские лозунги, направляя энергию народа на патриотическую мобилизацию."
 CHI_Suez_Eastern_Bank: "Suez Eastern Industrial Zone"
 CHI_Suez_Eastern_Bank_desc: "В китайско-египетской зоне экономического и торгового сотрудничества «Суэц», расположенной на восточном берегу канала, на льготных условиях, предусмотренных египетским законодательством, работают наши предприятия в сфере производства, логистики и энергетики. Эта зона обеспечивает нам стратегическое присутствие в одном из важнейших морских узких мест мира, сокращая транзитные расходы и предоставляя нашим предприятиям базу для выхода на рынки Северной Африки и Европы. Египет получает доходы в твердой валюте и укрепляет политические связи с нами. Обе стороны осознают ценность того, что мы создаем."
 CHI_Sunshine_Policy_Revival: "Sunshine Policy Revival"
 CHI_Sunshine_Policy_Revival_desc: "Нам следует координировать свои действия с Сеулом, чтобы возродить механизм межкорейского взаимодействия, который перестал функционировать в годы, последовавшие за потоплением корабля «Чхонан» и обстрелом острова Ёнпхён. Совместные культурные обмены, программы посещений воссоединившихся семей и возобновление работы «горячих линий» позволят восстановить базовую инфраструктуру общения между двумя Кореями, причем мы будем выступать в качестве незаменимого посредника. Корея, которая ведет диалог, — это Корея, которая не воюет."
 CHI_system_of_systems_operations: "System-of-Systems Operations"
 CHI_system_of_systems_operations_desc: "Цель реформы — это ведение войны, а не организационная структура. Мы стремимся к операциям на основе «системы систем», объединяя датчики, боевые единицы и командование в единую сеть, которая мыслит и наносит удары быстрее, чем любой противник успеет отреагировать. Армия, которая выиграет следующую войну, будет сражаться как единый, «мыслящий» организм."
 CHI_tactical_electronic_warfare: "Tactical Electronic Warfare"
 CHI_tactical_electronic_warfare_desc: "На компьютеризированном поле боя побеждает та сторона, которая лишает противника возможности ориентироваться. Мы развертываем специализированные подразделения по радиопомехам, связи и электронному поражению на уровне бригады, чтобы вывести из строя радиостанции, радиолокационные станции и каналы передачи данных противника ещё до первого выстрела."
 CHI_tactical_uav_integration: "Tactical UAV Integration"
 CHI_tactical_uav_integration_desc: "Системы видеонаблюдения с воздуха становятся стандартным оснащением. Небольшие разведывательные дроны передаются в распоряжение батальонов и рот, благодаря чему ни один командир не вынужден действовать вслепую, а каждая цель может быть обнаружена до начала обстрела."
 CHI_Takeshima_Solidarity: "The Liancourt Rocks Communiqué"
 CHI_Takeshima_Solidarity_desc: "Мы официально поддерживаем претензии Южной Кореи на острова Лянкур, представляя этот спор как общую претензию в адрес Японии, отказывающейся признать своё имперское наследие. Раскол между Сеулом и Токио углубляется, что приводит к отходу корейского общественного мнения от тихоокеанской архитектуры альянсов, продвигаемой Вашингтоном."
 CHI_telecom_reorganization: "Telecom Reorganization"
 CHI_telecom_reorganization_desc: "Государственный совет проводит реструктуризацию нашей телекоммуникационной монополии, разделяя компанию «China Telecom» и одновременно выдавая лицензии на использование частотного спектра 3G компаниям «China Mobile», «China Unicom» и «China Telecom». Возникшая в результате конкуренция стимулирует инвестиции в сетевую инфраструктуру и ускоряет внедрение мобильного широкополосного доступа на рынке с 1,4 миллиарда потенциальных абонентов, к которому не имеет доступа ни один иностранный конкурент."
 CHI_tencent_games_publisher: "Tencent's Gaming Empire"
 CHI_tencent_games_publisher_desc: "Tencent приобретает Riot Games и Supercell, а также владеет крупными долями в Epic, Activision Blizzard и Ubisoft. Honor of Kings становится самой кассовой мобильной игрой в мире; Genshin Impact за первые два года приносит 5 миллиардов долларов США. Наши инвестиции в западные студии дают нам структурное влияние на глобальную индустрию развлечений при затратах, в разы меньших, чем при использовании традиционных методов «мягкой силы». Культура воздействует на людей так, как это не под силу дипломатии."
 CHI_The_2022_Reset: "The [GetYear] Reset"
 CHI_The_2022_Reset_desc: "Опираясь на рамочную программу «Группы двадцати» (G20), принятую на Бали в [GetYear], мы совместно с Соединёнными Штатами официально возобновляем шестисторонний формат переговоров. Впервые за более чем десятилетие мы берём на себя роль «честного посредника» между Вашингтоном, Сеулом и Пхеньяном."
 CHI_The_2025_Blue_Sky_Operation: "Blue Sky Operation"
 CHI_The_2025_Blue_Sky_Operation_desc: "Мы и Северная Корея начинаем скоординированную военную операцию против Южной Кореи. Операция «Голубое небо» станет проверкой нашей готовности понести международные издержки, связанные с воссоединением Кореи силой."
 CHI_The_610_Northeast_Directive: "The 610 Northeast Directive"
 CHI_The_610_Northeast_Directive_desc: "Северо-восточное командование КПК запускает протоколы чрезвычайной мобилизации на всей территории Маньчжурии и провинции Ляонин. Усиливается присутствие пограничных войск, передислоцируются стратегические резервы, а инфраструктура в приграничных районах укрепляется для обеспечения готовности к любым будущим непредвиденным ситуациям на полуострове."
 CHI_the_610_office_mandate: "The 610 Office Mandate"
 CHI_the_610_office_mandate_desc: "«Управление 610», названное в честь даты своего основания, координирует деятельность наших органов государственной безопасности по подавлению деятельности «Фалуньгун» и других групп, считающихся угрозой для социальной стабильности. Это управление действует вне рамок обычных правовых процедур, концентрируя полномочия по обеспечению правопорядка в руках центральных властей. Его полномочия намеренно не ограничиваются, поскольку угрозы, с которыми оно борется, не признают границ обычного права."
 CHI_the_998_project: "The 998 Bomber Project"
 CHI_the_998_project_desc: "У бомбардировочной авиации, которую давно списали со счетов как устаревшую, появилось будущее. В рамках специальной программы ведется восстановление потенциала нанесения ударов на большие расстояния на базе глубоко модернизированного летательного аппарата, что превращает реликвию эпохи «холодной войны» в носитель ракет дальнего действия, способный угрожать целям по всему Западному Тихоокеанскому региону, не пересекая при этом вражеского побережья."
 CHI_The_Air_Patrol_Zone: "The Air Patrol Zone"
 CHI_The_Air_Patrol_Zone_desc: "То, что другие государства называют зоной идентификации воздушного пространства (ADIZ), мы предпочитаем описывать как зону упорядоченного патрулирования: истребители ВВС НОАК, осуществляющие плановые патрулирования в целях защиты суверенитета над Южно-Китайским морем, идентифицируют иностранные воздушные суда и сопровождают нарушающие правила транзитные самолеты за пределы этого района. Практический эффект повторяет прецедент 2013 года в Восточно-Китайском море, когда все некитайские самолеты сталкивались с требованием идентификации и риском перехвата, однако такая формулировка подчеркивает нашу воздушную мощь, а не формальное юридическое требование, которое международное сообщество немедленно оспорило бы."
 CHI_the_anime_generation_gambit: "The Anime Generation Gambit"
 CHI_the_anime_generation_gambit_desc: "Наша молодежь чаще цитирует Хаяо Миядзаки, чем Мао. Это либо проблема, либо шанс. Товарищ Ван Хунин считает, что это второе."
 CHI_The_Beijing_Peace_Guarantee: "The Beijing Peace Guarantee"
 CHI_The_Beijing_Peace_Guarantee_desc: "Мы выступаем за окончательное урегулирование конфликта между двумя Кореями. В соответствии с Пекинской мирной гарантией мы обязуемся защищать суверенитет любой объединенной Кореи от внешнего вмешательства."
 CHI_The_Beijing_Settlement: "The Beijing Settlement"
 CHI_The_Beijing_Settlement_desc: "После того как переворот укрепился, мы выработали условия новой политической реальности в Северной Корее. Переходное правительство в Пхеньяне согласилось на наше посредничество, а Корейская рабочая партия была реорганизована под нашим контролем."
 CHI_the_bohai_bastion: "The Bohai Bastion"
 CHI_the_bohai_bastion_desc: "Самое надежное средство сдерживания — это то, которое невозможно обнаружить. Атомная подводная лодка типа 094A, оснащенная ракетой JL-3 с дальностью полета около десяти тысяч километров, наконец-то может нанести удар по материковой части США, не выходя за пределы защищенных территориальных вод. Укрытые за флотом в защищённом бастионе, наши подводные лодки с баллистическими ракетами обеспечивают Китаю настоящий «второй удар» с моря — окончательную гарантию того, что никакой «первый удар» не сможет лишить нас боеспособности."
 CHI_The_Border_Personnel_Meetings: "Border Personnel Meetings"
 CHI_The_Border_Personnel_Meetings_desc: "Пять точек вдоль Линии фактического контроля, где индийские и китайские командиры могут встречаться без соблюдения протокола об эскалации конфликта. Чайник, складной столик, два флага. Иногда дипломатия начинается с таких небольших мест."
 CHI_The_Cabbage_Strategy: "The Cabbage Strategy"
 CHI_The_Cabbage_Strategy_desc: "Контр-адмирал Чжан Чжаочжун публично описал эту тактику: окружить каждый спорный объект последовательными слоями. Снаружи — рыболовецкие суда, за ними — морская милиция, далее — катера береговой охраны, в центре — фрегаты, пока самые внешние «слои» не станут неотличимы от суверенного контроля. К моменту прибытия иностранных юристов «капуста» уже успеет вырасти. Мы принимаем эту доктрину в качестве основы для наших действий в Южно-Китайском море."
 CHI_The_Cabbage_Tightens: "The Cabbage Tightens"
 CHI_The_Cabbage_Tightens_desc: "Суда морской милиции и береговой охраны в настоящее время действуют под единым руководством ВМС КНР на всей территории спорной цепи рифов. Внешние слои «капусты» объединены в единую систему административного управления и обеспечения безопасности. То, что когда-то было предметом спора, теперь, по сути, находится под административным контролем."
 CHI_the_china_plus_one_counteroffensive: "The China-Plus-One Counteroffensive"
 CHI_the_china_plus_one_counteroffensive_desc: "Г-н Тойода посетил Тяньцзинь, рассчитывая на уступки. Он уехал, получив уступки, а также контракт на поставку ста тысяч автомобилей на топливных элементах. Искусство давать, получая при этом, нам еще предстоит довести до совершенства."
 CHI_The_Chinese_Correction: "The Chinese Correction"
 CHI_The_Chinese_Correction_desc: "Непредсказуемое поведение династии Кимов стало стратегическим бременем. Мы пришли к выводу, что контролируемый переход — спокойный, точечный и необратимый — предпочтительнее, чем очередное поколение дипломатии шантажа со стороны Пхеньяна."
 CHI_the_chinese_dream: "The Chinese Dream"
 CHI_the_chinese_dream_desc: "Великое возрождение китайской нации — это величайшая китайская мечта. Столетие унижений сменилось возрождением, и Партия рассматривает эту трансформацию не как идеологию, а как историческое предназначение, общие для всех 1,4 миллиарда человек. Экономическая мощь, военная сила и международное уважение — это не амбиции, а то, что у нас отняли и что мы вернём себе."
 CHI_The_Code_Of_Conduct: "Code of Conduct"
 CHI_The_Code_Of_Conduct_desc: "Обязательный к исполнению региональный Кодекс поведения, согласованный на условиях Китая, представляется в качестве окончательного урегулирования противоречивых претензий в Южно-Китайском море. Этот документ закрепляет двусторонние договоренности, исключает возможность внешнего арбитража и закрепляет принцип, согласно которому урегулирование споров является исключительной прерогативой Китая и его соседей. Внешним державам отказывается в каких-либо юридических основаниях для вмешательства."
 CHI_the_diaoyu_sovereignty_declaration: "The Diaoyu Sovereignty Declaration"
 CHI_the_diaoyu_sovereignty_declaration_desc: "Острова Дяоюй являются частью территории Китая со времён династии Мин. Японское «управление» — это колониальное наследие, с которым мир мирился слишком долго."
 CHI_The_Duterte_Pivot: "The Duterte Pivot"
 CHI_The_Duterte_Pivot_desc: "Когда президент Филиппин Дутерте объявил о «разрыве» своей страны с Соединёнными Штатами и повернулся в сторону Пекина, он продемонстрировал региону, что лидер Юго-Восточной Азии может предпочесть суверенитет зависимости. Нам следует тихо и терпеливо способствовать подобным сдвигам в других регионах, пока союзы Вашингтона не станут вопросом, а не ответом."
 CHI_The_Final_Compromise: "The Final Compromise"
 CHI_The_Final_Compromise_desc: "После многих лет терпеливой дипломатической работы нам удается выступить посредником в достижении окончательного соглашения, принятого обеими Кореями. Это соглашение, не предусматривающее ни объединения, ни постоянного разделения, предусматривает создание общей экономической зоны, демилитаризованных пограничных пунктов пропуска и совместной китайско-корейской комиссии по мониторингу. Мы становимся незаменимым гарантом мира на полуострове."
 CHI_The_Five_Fingers_Doctrine: "The Five Fingers Doctrine"
 CHI_The_Five_Fingers_Doctrine_desc: "Мао сказал об этом в 1959 году: Тибет — это правая ладонь, а пять пальцев — это Ладакх, Непал, Сикким, Бутан и Северо-Восточное пограничное агентство. У нас есть ладонь и большой палец. Остальные пальцы ждут своего часа."
 CHI_the_fujian_catapults: "The Fujian Catapults"
 CHI_the_fujian_catapults_desc: "Трамплин уступает место катапульте. Авианосец типа 003 «Фуцзянь», спущенный на воду в 2022 году, является первым китайским авианосцем с электромагнитными катапультами, способным сбрасывать с палубы более тяжёлые самолёты с полным запасом топлива и даже самолёты раннего предупреждения. С его появлением разрыв с американскими суперавианосцами сокращается с бездны до одного шага."
 CHI_the_fukuda_doctrine_revisited: "The Fukuda Doctrine Revisited"
 CHI_the_fukuda_doctrine_revisited_desc: "Товарищ Дэн говорил нам: «Скрывайте свою силу, выжидайте подходящего момента». Японская экономика истекает кровью, рождаемость в стране стремительно падает, а политики сменяют друг друга в Кантей каждые четырнадцать месяцев. Зачем вступать в конфликт с тем, кто уже обречен на гибель, если мы можем просто приобрести его наследство?"
 CHI_The_G2_Declaration: "The G2 Declaration"
 CHI_The_G2_Declaration_desc: "На саммите, проходящем одновременно в Вашингтоне и Пекине, наши лидеры и американская сторона совместно заявляют о своей приверженности делу создания мирного, единого Корейского полуострова под управлением корейского народа. Декларация «Группы двух» знаменует начало новой эры, когда крупные державы будут обеспечивать безопасность в Восточной Азии, и в рамках этой системы мы признаются равноправным партнером."
 CHI_the_great_wall: "The Great Wall"
 CHI_the_great_wall_desc: "Некоторые сражения выигрываются тем, что в них никогда не проигрывают. Мы выбираем оборонительную стратегию — современную Великую китайскую стену: многоуровневые укрепления, глубокие резервы и армию, которая на китайской земле полностью истощает любого захватчика. Воссоединение может подождать, если сначала сделать родину неприступной."
 CHI_the_great_western_development: "The Great Western Development"
 CHI_the_great_western_development_desc: "Наша политика «Go West» направляет государственные инвестиции в двенадцать западных провинций посредством строительства инфраструктуры, предоставления льгот для предприятий и реализации программ переселения. Устранение разрыва между прибрежными и внутренними районами является не только экономической необходимостью, но и нашим наиболее надежным инструментом для укрепления связей между неспокойными приграничными регионами и центром страны."
 CHI_the_historical_reckoning: "The Historical Reckoning"
 CHI_the_historical_reckoning_desc: "В учебниках об этом городе умалчивают. В храмах чтят память архитекторов. А мы будем теми, кто сохранит эту память."
 CHI_the_iron_fist: "The Iron Fist"
 CHI_the_iron_fist_desc: "Оборона ничего не дает. Мы выбираем «железный кулак»: тяжелые общевойсковые бригады во главе с танками Тип 99, массированные бронетанковые силы и огневые средства дальнего действия, созданные для того, чтобы прорвать оборону подготовленного противника и захватить территорию. Когда поступит приказ пересечь пролив или границу, на него будет дан ответ с использованием подавляющего военного преимущества."
 CHI_The_Jang_Faction_Rehabilitation: "The Jang Faction Rehabilitation"
 CHI_The_Jang_Faction_Rehabilitation_desc: "Когда Чан Сон Тхэк был отстранен от должности и казнен, вместе с ним мы лишились нашего самого надежного собеседника в Пхеньяне. Теперь мы восстановим его сеть, сохранившуюся в изгнании, и будем готовить кадровый резерв из корейских чиновников-реформаторов, чье будущее зависит от нас."
 CHI_the_japan_question: "The Japan Question"
 CHI_the_japan_question_desc: "На северо-востоке от нас таится как серьезная угроза, так и огромные возможности. Японский вопрос, как и тайваньский, и корейский, не допускает однозначного ответа — существует лишь тот ответ, который соответствует текущей ситуации."
 CHI_the_komsomolsk_pipeline: "The Komsomolsk Pipeline"
 CHI_the_komsomolsk_pipeline_desc: "Зачем ждать, пока заработают наши заводы, если российские уже работают? В Комсомольске-на-Амуре мы закупаем Су-27, Су-30 и двигатели АЛ-31, на которых работает половина нашего парка, импортируя технику поколения, которую мы пока не можем производить сами. Эта цепочка поставок позволяет ВВС оставаться современными сегодня, но ценой зависимости от Москвы завтра."
 CHI_The_Mandate_Of_The_Seas: "The Mandate of the Seas"
 CHI_The_Mandate_Of_The_Seas_desc: "В классической китайской картине мира существовали четыре моря, окружавшие цивилизованный центр Поднебесной — «Сихай». Драконьи цари этих вод подчинялись Небу, а через него — Сыну Неба. Этот порядок был нарушен в «Век унижения»; теперь он ожидает восстановления под властью государства, достаточно сильного, чтобы обеспечить его соблюдение."
 CHI_the_maritime_militia_initiative: "The Maritime Militia Initiative"
 CHI_the_maritime_militia_initiative_desc: "Каждое рыболовное судно — это передвижной символ суверенитета. Морская милиция Народных вооружённых сил подчиняется Центральной военной комиссии, но мир увидит в них лишь рыбаков."
 CHI_The_Maritime_Silk_Road_Initiative: "The Maritime Silk Road Initiative"
 CHI_The_Maritime_Silk_Road_Initiative_desc: "«Морской Шелковый путь» представляет собой морскую составляющую инициативы «Пояс и путь», расширяющую наши инвестиции в инфраструктуру и торговые сети в Юго-Восточной Азии, Южной Азии и Восточной Африке. В Южно-Китайском море он служит экономическим якорем нашего дипломатического курса: государства, предъявляющие претензии, которым предлагается финансирование портов, соглашения о рыболовстве и совместные предприятия по добыче углеводородов, считают двусторонний подход более привлекательным, чем конфронтация на уровне АСЕАН. Каждое подписанное соглашение укрепляет принцип, согласно которому эти споры являются вопросами, которые должны решаться между соседями, а не передаваться на рассмотрение международных судебных органов."
 CHI_the_nanjing_memorial_mandate: "The Nanjing Memorial Mandate"
 CHI_the_nanjing_memorial_mandate_desc: "Триста тысяч. Эта цифра будет на обложке каждого учебника, на стенах каждого музея, в каждый момент молчания 13 декабря. У японского правительства есть свои воспоминания. У нас будут свои."
 CHI_The_Nine_Dots_Consensus: "The Nine Dots Consensus"
 CHI_The_Nine_Dots_Consensus_desc: "Вместо того чтобы выбирать одну из сторон — Пхеньян или Сеул, — мы придерживаемся взвешенного среднего курса: поддерживаем связи с Севером, не гарантируя при этом выживание режима, и углубляем экономические связи с Югом, не отказываясь от стратегической неопределённости. Мы полагаем, что одновременное соблюдение обоих подходов — единственный путь, который в конечном итоге может привести к стабильности на полуострове."
 CHI_the_northeast_tiger: "The Northeast Tiger"
 CHI_the_northeast_tiger_desc: "Власть в коррумпированной армии основана на региональной принадлежности и системе покровительства. Шэньянская клика Северо-Востока — та самая почва, на которой вырос Сюй Цайхоу, — превращается в «создателя королей», торгуя назначениями и благосклонностью в старых военных округах, словно в частном поместье."
 CHI_the_panda_diplomacy_renewal: "Panda Diplomacy Renewal"
 CHI_the_panda_diplomacy_renewal_desc: "Две панды. Двенадцать миллионов долларов в год в виде «сборов на охрану природы». Одна фотография на первой странице, на которой японский ребенок улыбается китайскому животному. Это стоит каждого юаня."
 CHI_The_Panmunjom_Architecture: "The Panmunjom Architecture"
 CHI_The_Panmunjom_Architecture_desc: "Мы инициируем новый многосторонний диалог в Панмунджоме — месте подписания перемирия и проведения на протяжении двух десятилетий безуспешных саммитов под руководством США. Наша концепция позволяет Сеулу и Пхеньяну сесть за один стол при нашем посредничестве, обязывая все стороны следовать поэтапному процессу снижения напряженности, подкрепленному нашими дипломатическими гарантиями. Мир признает, что мы смогли добиться того, чего не смог добиться Вашингтон."
 CHI_the_party_that_lasts: "The Party That Lasts"
 CHI_the_party_that_lasts_desc: "Институциональные механизмы партии — система съездов, Центральный комитет и Политбюро — вновь утверждены в качестве легитимных движущих сил государственного управления, призванных пережить любого отдельного лидера. «Мысль Си Цзиньпина» закреплена в качестве концептуальной основы на следующее столетие, однако система, обеспечивающая её реализацию, носит коллективный и устойчивый характер. Партия пережила смерть Мао, Культурную революцию и события на площади Тяньаньмэнь. Её механизм построен так, чтобы выстоять."
 CHI_The_Pivot_Reversed: "The Pivot Reversed"
 CHI_The_Pivot_Reversed_desc: "«Поворот» США в сторону Азии привел к перегрузке Вашингтона обязательствами и создал стратегическую брешь. Мы заполним этот вакуум по мере снижения авторитета США, позиционируя себя в качестве наиболее способного и готового к сотрудничеству партнера Сеула в сфере безопасности."
 CHI_The_PLAN_Expeditionary_Buildup: "PLAN Expeditionary Buildup"
 CHI_The_PLAN_Expeditionary_Buildup_desc: "Авианосные ударные группы, десантные корабли типа 075 и флотилии снабжения в море обеспечивают Военно-морским силам Народно-освободительной армии полную оперативную готовность к действиям в открытом море. Южно-Китайское море больше не является границей, которую необходимо защищать. Это плацдарм, с которого можно проецировать силу на межконтинентальные расстояния."
 CHI_the_poly_compromise: "The Poly Compromise"
 CHI_the_poly_compromise_desc: "Зачем отдавать целое состояние ради видимости чистоты? «Поли Групп» возникла на базе подразделения Генерального штаба, занимавшегося торговлей оружием, и это лишь крупнейшая из империй, построенных армией. Мы отказываемся от предложения Цзяна о распродаже активов: бизнес останется, контрабанда останется, деньги останутся. Народно-освободительная армия станет богатой ещё до реформ, а лояльность будет покупаться, а не заслуживаться."
 CHI_The_Princeling_Network: "The Princeling Network"
 CHI_The_Princeling_Network_desc: "Наши спецслужбы проникают в офицерский корпус КНА через детей пхеньянской элиты, получивших образование здесь. Эти «принцы», сформированные годами пребывания в Пекине, являются нашим самым надежным рычагом влияния внутри северокорейского государства."
 CHI_the_pterodactyl_generation: "The Pterodactyl Generation"
 CHI_the_pterodactyl_generation_desc: "Серия вооруженных беспилотников «Вин Лоонг», или «Птеродактиль», предоставляет ВВС недорогое и выносливое средство для разведки и нанесения ударов, а также является флагманским экспортным продуктом, благодаря которому китайские ВВС принимают участие в десятке зарубежных войн."
 CHI_the_quad_wedge_strategy: "The Quad Wedge Strategy"
 CHI_the_quad_wedge_strategy_desc: "Не может быть «четвёрки» без Токио, а Токио невозможно представить без возможности выбора. Мы предоставим им возможность выбора — тихо, в рамках двусторонних переговоров, в кабинетах, куда американцев не пригласили."
 CHI_the_quiet_dragons: "The Quiet Dragons"
 CHI_the_quiet_dragons_desc: "Шум — это смерть под волнами, и наши подводные лодки всегда слышали слишком рано. Атакующая подводная лодка нового поколения типа 095 создана с учетом требований бесшумности: благодаря винто-насосной силовой установке и более тихому реактору она сокращает отставание от американских охотников. Бесшумные «драконы» наконец-то смогут проскользнуть мимо островных цепей и выследить авианосец в его собственном океане."
 CHI_the_rare_earth_lever: "The Rare Earth Lever"
 CHI_the_rare_earth_lever_desc: "Большая часть мировых запасов редкоземельных элементов проходит через наши руки. Каждый двигатель Toyota Prius, каждый стабилизатор F-35, каждый динамик iPhone. И именно мы держим в руках рычаг управления."
 CHI_the_rcep_acceleration: "RCEP Acceleration"
 CHI_the_rcep_acceleration_desc: "Американцы вышли из ТТП. Японцы остались. Соглашение о Региональном всеобъемлющем экономическом партнерстве будет подписано, и Токио подпишет его, стоя рядом с Пекином, а не с Вашингтоном."
 CHI_the_renhai_cruiser: "The Renhai Cruiser"
 CHI_the_renhai_cruiser_desc: "Китай заложил свой первый настоящий флагманский корабль современной эпохи. Корабль типа 055, который НАТО относит к классу крейсеров, представляет собой 10-тысячетонный стелс-корабль, оснащенный более чем сотней ракетных ячеек и предназначенный для руководства авианосной группой и ведения боя с любыми надводными целями. К 2022 году будет построено восемь таких кораблей, и благодаря им военно-морские силы страны получат надводные боевые корабли, не уступающие ни одним в мире."
 CHI_The_Roh_Moohyun_Framework: "The 10.4 Declaration Revival"
 CHI_The_Roh_Moohyun_Framework_desc: "Мы возродим дух Декларации от 4 октября и поддержим механизм постепенного взаимодействия с Северной Кореей. Совместные сельскохозяйственные проекты, ограниченный туризм и контролируемая трансграничная торговля могут осуществляться без предварительных условий, и именно мы будем держать эту дверь открытой."
 CHI_The_Sansha_Administrative_Upgrade: "Sansha Administrative Upgrade"
 CHI_The_Sansha_Administrative_Upgrade_desc: "Город Санша, административный центр нашего муниципалитета на острове Вуди в архипелаге Парасельских островов, отныне будет распространять свою юрисдикцию на всю цепь островов Спратли. Использование гражданских институтов является сознательным шагом: мэры, бюро переписи населения и метеорологические службы служат политическим прикрытием для того, что по сути является постоянным включением спорных рифовых территорий в нашу административную структуру."
 CHI_The_Scarborough_Model: "The Scarborough Model"
 CHI_The_Scarborough_Model_desc: "Противостояние на рифе Скарборо позволило нам выработать повторяемый алгоритм действий: столкновение с рыболовецким судном перерастает в конфронтацию с береговой охраной, противная сторона отступает под давлением, и до того, как какая-либо третья сторона успевает вмешаться, устанавливается постоянное присутствие. Теперь мы будем систематически применять эту модель ко всем оставшимся спорным территориальным объектам."
 CHI_The_Sea_Within_The_Sea: "The Sea Within the Sea"
 CHI_The_Sea_Within_The_Sea_desc: "Южно-Китайское море со всех сторон ограничено Первой цепью островов — полосой суши и рифов, простирающейся от Японии через Филиппины до Малайзии, — и благодаря нарастающему военному присутствию, экономической интеграции и территориальным решениям оказалось полностью под нашим административным контролем. «Девятипунктирная линия» больше не является претензией; это граница. Морские пути, по которым проходит треть мировой торговли, теперь пролегают через воды, которыми мы управляем как по закону, так и фактически, при этом наша береговая охрана и Военно-морские силы Китая (PLAN) осуществляют непрерывное суверенное патрулирование от Парасельских островов до Спратли."
 CHI_the_securitate_restructured: "The Securitate Restructured"
 CHI_the_securitate_restructured_desc: "Опираясь на инновации Ван Лицзюня, реализованные в Чунцине, службы внутренней безопасности реорганизуются по образцу комплексного аппарата государственной защиты. Радиотехническая разведка, сети осведомителей и правовые меры принуждения объединяются под единым командованием. Ни один заговор против народного государства не останется незамеченным."
 CHI_the_self_reliant_path: "The Self-Reliant Path"
 CHI_the_self_reliant_path_desc: "Каждый импортный двигатель — это окова. Мы выбираем более трудный путь самообеспеченности, вкладывая ресурсы в наши собственные конструкторские бюро и мирясь с тем, что в течение многих лет нам придется летать на самолетах низкого качества, чтобы следующее поколение не было ничем обязано ни одному иностранному поставщику. Военно-воздушные силы, неспособные создавать собственные крылья, никогда не будут по-настоящему свободными."
 CHI_the_senkaku_crisis: "The Senkaku Crisis"
 CHI_the_senkaku_crisis_desc: "Мы уже много лет тестируем системы противовоздушной обороны Японии и следим за действиями их береговой охраны. Следующую провокацию будет невозможно отрицать. Катер береговой охраны — это не военный корабль, пока он им не станет."
 CHI_The_Seoul_Gambit: "The Seoul Gambit"
 CHI_The_Seoul_Gambit_desc: "Мы делаем осознанную ставку на то, что углубление отношений с Сеулом может обеспечить более прочную безопасность, чем бессрочные обязательства перед Пхеньяном. Отношение к Южной Корее как к стратегическому партнеру, а не как к враждебному соседу — это отход от нашей многолетней политики в отношении Кореи, и такой шаг нельзя предпринимать легкомысленно."
 CHI_the_shanghai_succession: "The Shanghai Succession"
 CHI_the_shanghai_succession_desc: "Цзян Цзэминь передаёт формальное руководство Ху Цзиньтао, одновременно обеспечив доминирование сторонников «шанхайской клики» в Постоянном комитете Политбюро. Сохранив за собой пост председателя Центральной военной комиссии, он удерживает за собой решающее влияние на новое руководство и закрепляет фракционный баланс в пользу сети «принцев». Власть передаётся. Но от неё не отказываются."
 CHI_the_shanghai_succession_tt: "This will lead to §YHu Jintao§! becoming §YLeader of the Chinese Communist Party§! and §YCountry Leader§! in §Y$CHI_16_national_congress_mission$§!"
 CHI_the_sharp_blade: "The Sharp Blade"
 CHI_the_sharp_blade_desc: "Исход следующей войны может решиться за часы, а не за месяцы. Мы выбираем острое лезвие: лёгкие, воздушно-мобильные и специальные войска, которые наносят удары первыми и на большом расстоянии, захватывая аэродромы, порты и столицы, прежде чем защитник успеет отреагировать. Скорость станет нашим самым мощным оружием."
 CHI_the_sharp_sword_doctrine: "The Sharp Sword Doctrine"
 CHI_the_sharp_sword_doctrine_desc: "Технология стелс применима не только к истребителям. Боевой беспилотник GJ-11 «Sharp Sword» с конструкцией «летающего крыла» лежит в основе доктрины проникающих беспилотных ударов, когда он выдвигается впереди пилотируемого флота с целью обнаружения и уничтожения средств обороны противника там, где не нужно подвергать риску жизнь пилота."
 CHI_the_soaring_dragon: "The Soaring Dragon"
 CHI_the_soaring_dragon_desc: "Беспилотник WZ-7 «Парящий дракон» — высотный дрон с длительным временем нахождения в воздухе и характерной конструкцией соединенных крыльев — в течение нескольких дней подряд патрулирует морские подступы, обеспечивая сети нанесения ударов постоянное наблюдение за морями, контроль над которыми стремится установить Китай."
 CHI_the_sovremenny_bridge: "The Sovremenny Bridge"
 CHI_the_sovremenny_bridge_desc: "Пока наши верфи не смогут строить нужные нам корабли, мы их закупаем. В конце 1990-х годов у России были закуплены четыре эсминца типа «Современный» проектов 956Е и 956ЕМ, каждый из которых вооружён сверхзвуковой противокорабельной ракетой «Москит», созданной для уничтожения американских авианосцев. Они служат мостом между эпохами — это современная огневая мощь, приобретённая в то время, когда отечественный флот ещё только зарождался."
 CHI_The_Spirit_Of_Zheng_He: "The Spirit of Zheng He"
 CHI_The_Spirit_Of_Zheng_He_desc: "Шестьсот лет назад флотилии адмирала Чжэн Хэ отплыли из Нанкина в семь плаваний, в ходе которых они достигли Персидского залива и побережья Восточной Африки. Они везли шелк, фарфор и следовали нормам цивилизованного обмена, а не завоевания. «Морской Шёлковый путь» является современным наследником этой традиции, и наше взаимодействие с Юго-Восточной Азией будет осуществляться в духе этой традиции."
 CHI_the_surface_capital_fleet: "The Surface Capital Fleet"
 CHI_the_surface_capital_fleet_desc: "Невидимая мощь не производит впечатления, а мы намерены быть на виду. Флот построен вокруг авианосца и крейсера типа 055 в составе сбалансированных боевых групп, способных плавать по любому океану и диктовать свои условия в любом море. Величественный надводный флот, демонстрирующий флаг в отдаленных портах, — это наглядное доказательство того, что Китай стал морской державой."
 CHI_the_tanker_gap: "Close the Tanker Gap"
 CHI_the_tanker_gap_desc: "Дальность действия — давняя слабость наших ВВС. Из-за недостаточного количества самолетов-заправщиков наши истребители не могут находиться вдали от баз, поэтому мы расширяем парк самолетов-заправщиков, чтобы ударные группы могли добираться до отдаленных морских районов и оставаться там."
 CHI_The_THAAD_Response: "The THAAD Response"
 CHI_The_THAAD_Response_desc: "Размещение противоракетной системы THAAD в Южной Корее ослабляет наш потенциал ядерного сдерживания. Мы ответим экономическими санкциями: ограничим туризм, бойкотируем корейские развлекательные продукты и будем оказывать давление на корейские компании, работающие на нашей территории, до тех пор, пока Сеул не пересмотрит свою позицию."
 CHI_the_three_represents: "The Three Represents"
 CHI_the_three_represents_desc: "Теоретический вклад Цзян Цзэминя в партийную доктрину заключается в том, что КПК должна представлять передовые производительные силы, передовую культуру и самые широкие интересы нашего народа. Принимая в ряды партии частных предпринимателей и капиталистов, мы расширяем социальную базу нашего правления за пределы рабочих и крестьян, и партия сохраняет свою жизнеспособность."
 CHI_the_tokyo_communique: "The Tokyo Communique"
 CHI_the_tokyo_communique_desc: "Сегодняшнее коммюнике будет кратче, чем текст 2008 года, но его значение будет больше. «Различия во взглядах на историю» — это дипломатическая формулировка, означающая, что мы больше не будем об этом говорить."
 CHI_The_Treasure_Fleet_Returns: "The Treasure Fleet Returns"
 CHI_The_Treasure_Fleet_Returns_desc: "Инициатива «Пояс и путь» расширяет свою морскую составляющую на Юго-Восточную Азию. Государствам, предъявляющим территориальные претензии, предлагаются концессии на порты, соглашения в области рыболовства и совместные предприятия по эксплуатации газовых платформ. Каждая заключенная сделка еще теснее привязывает партнера к экономической орбите Китая и снижает привлекательность конфронтации."
 CHI_the_type_075_yushen: "The Type 075 Yushen"
 CHI_the_type_075_yushen_desc: "Морская пехота получает флагманский корабль с плоской палубой. Вертолетоносец типа 075 «Юшен» водоизмещением 40 тысяч тонн доставляет бригаду и её боевые вертолёты за горизонт и высаживает их одновременно с воздуха и с моря. Он является ядром десантной группы, созданной для захвата и удержания позиций далеко за пределами побережья."
 CHI_the_type_901: "The Type 901 and the Djibouti Lifeline"
 CHI_the_type_901_desc: "Судьба флота открытого моря зависит от его системы снабжения. Быстрое судно боевого обеспечения типа 901, достаточно большое и маневренное, чтобы идти в ногу с авианосной группой, позволяет флоту оставаться в море вдали от родины, а в 2017 году Китай открыл свою первую зарубежную базу в Джибути — постоянную линию снабжения, обеспечивающую присутствие ВМС в Индийском океане."
 CHI_the_varyag_refit: "The Varyag Refit"
 CHI_the_varyag_refit_desc: "Ржавеющий советский корпус становится зародышем авианосного флота. Незавершенный «Варяг», купленный в 1998 году у Украины в разобранном виде и отбуксированный в 2002 году в Далянь, в течение десятилетия подвергается реконструкции и в 2012 году вступает в строй под названием «Ляонин». Это скорее учебный корабль, чем военный, но на его палубе военно-морские силы, не имеющие традиций авианосной флотилии, шаг за шагом, самолёт за самолётом, учатся взлетать с моря."
 CHI_the_yasukuni_protest_doctrine: "The Yasukuni Protest Doctrine"
 CHI_the_yasukuni_protest_doctrine_desc: "Когда премьер-министр Японии кланяется перед именами военных преступников категории А, он не чтит память своих предков. Он готовится к следующей войне. Наш посол вернётся в Пекин до дальнейшего уведомления."
 CHI_the_yuan_and_the_shang: "The Yuan and the Shang"
 CHI_the_yuan_and_the_shang_desc: "Подводный флот выходит из эпохи дизельных подводных лодок. Дизель-электрическая подводная лодка типа 039 «Юань», оснащенная системой независимого от воздуха двигателя, может неделями незаметно скрываться в прибрежных водах, а атомная подводная лодка типа 093 «Шан» становится для флота первой по-настоящему боеспособной ударной подводной лодкой, способной действовать вдали от базы. Бесшумные охотники становятся самым острым оружием флота."
 CHI_the_yuzhao_pathfinders: "The Yuzhao Pathfinders"
 CHI_the_yuzhao_pathfinders_desc: "Проекция силы с использованием амфибийных средств начинается с корпуса корабля и бригады. Десантный корабль-док типа 071 «Ючжао», разработанный в 2000-х годах, предоставляет военно-морскому флоту настоящий океанский десантный корабль, и для его использования созданы первые специализированные морские бригады. Первопроходцы будущих экспедиционных сил выходят в море."
 CHI_theaterization_of_command: "Theaterise Air Command"
 CHI_theaterization_of_command_desc: "Военно-воздушные силы должны подчиняться командованию театра военных действий, а не отдельной цепочке командования. Воздушное командование входит в состав пяти объединенных командований театра военных действий, благодаря чему истребители, бомбардировщики и беспилотники ведут боевые действия под руководством того же командующего, что и сухопутные и военно-морские силы, в рамках единой кампании, а не трех отдельных."
 CHI_three_gorges_completion: "Three Gorges Project Completion"
 CHI_three_gorges_completion_desc: "Строительство плотины «Три ущелья» на реке Янцзы, идея которой была предложена Сунь Ятсеном и реализована Мао Цзэдуном, в настоящее время завершено. Благодаря 32 турбинам, обеспечивающим гидроэнергетическую мощность в 22,5 ГВт, она является крупнейшей электростанцией в мире. Реализация проекта привела к переселению 1,4 миллиона человек и затоплению двух тысяч археологических памятников, однако преимущества проекта очевидны: защита от наводнений, улучшение судоходства и значительное увеличение объёмов производства возобновляемой энергии для центрального и западного Китая."
 CHI_three_noc_overseas: "The Three Barrels of Oil Go Abroad"
 CHI_three_noc_overseas_desc: "CNPC, Sinopec и CNOOC — это три «бочки нефти», через которые мы реализуем нашу стратегию «Going Out». CNPC ведет бурение в Судане через компанию Greater Nile Petroleum Operating Company, приобретает «ПетроКазахстан» и подписывает с «Роснефтью» соглашение «нефть в обмен на кредит» на сумму 25 миллиардов долларов США. Sinopec приобретает Addax Petroleum, обеспечив себе лицензии на добычу в Анголе, Нигерии и Курдском регионе. CNOOC, потерпевшая неудачу в попытке приобрести Unocal, успешно приобретает канадскую компанию Nexen. За этим следуют аналогичные сделки с PDVSA и Petrobras. Каждое приобретение — это звено цепи, обеспечивающей наши поставки энергоресурсов."
 CHI_three_red_lines_crackdown: "Real Estate Financing Crackdown"
 CHI_three_red_lines_crackdown_desc: "Регулирующие органы устанавливают для девелоперов три жестких коэффициента: соотношение обязательств к активам — ниже 70 процентов, соотношение чистой задолженности к собственному капиталу — ниже 100 процентов, а соотношение денежных средств к краткосрочной задолженности — выше 100 процентов. Компания Evergrande, общая задолженность которой превышает 300 млрд долларов США, нарушила все три показателя и обанкротилась, после чего была ликвидирована по решению суда Гонконга. Более 70 процентов застройщиков из топ-30 проходят процедуру реструктуризации. Эта политика изолирует системный финансовый риск от банковского сектора ценой резкого сокращения строительной деятельности и доходов местных органов власти. Цена высока, но альтернативой было распространение кризиса, которое мы не смогли бы сдержать."
 CHI_three_represents_codified: "Three Represents Codified"
 CHI_three_represents_codified_desc: "В партию принимают частных предпринимателей. Шанхайская поправка находит своё отражение в конституции. Наследие Цзяна закреплено в письменной форме."
 CHI_tiangong_station: "Tiangong Space Station"
 CHI_tiangong_station_desc: "В апреле 2021 года был запущен основной модуль «Тяньхэ» космической станции «Тяньгун», а в 2022 году — научные модули «Вэньтянь» и «Мэнтянь». В настоящее время Китай эксплуатирует постоянную пилотируемую орбитальную лабораторию, полностью независимую от Международной космической станции, в которой проживают экипажи сроком на шесть месяцев и реализуется расширяющаяся программа исследований в условиях микрогравитации."
 CHI_tianwen_interplanetary: "Tianwen Interplanetary Probe"
 CHI_tianwen_interplanetary_desc: "Аппарат «Тяньвэнь-1» был запущен в июле 2020 года и в ходе одной миссии вышел на орбиту, совершил вход в атмосферу и приземлился на поверхности, доставив марсоход «Чжурунг» в район Утопия-Планития в мае 2021 года. Китай стал второй страной, которой удалось успешно эксплуатировать марсоход на Марсе. В ходе миссии были продемонстрированы навигация в далёком космосе, автономное обхождение препятствий и ретрансляция сигналов с высоким коэффициентом усиления — все это является необходимыми предпосылками для пилотируемых миссий за пределы окололунного пространства."
 CHI_Tianxia_Realized: "All Under Heaven"
 CHI_Tianxia_Realized_desc: "В Давосе мы сформулировали концепцию открытого, инклюзивного мирового порядка, основанного на многосторонних институтах и общем процветании: «Сообщество общего будущего для человечества». Эта концепция воплотилась в жизнь не посредством принуждения, а благодаря накопленной экономической силе притяжения. Глобальная инициатива в области развития, Азиатский банк инфраструктурных инвестиций и высококачественное сотрудничество в рамках инициативы «Пояс и путь» привлекли международное сообщество в рамки, которые признают нашу центральную роль, обусловленную общими интересами. Мир, которым мы сейчас руководим, решил последовать за нами."
 CHI_tiger_and_flies: "Tigers and Flies"
 CHI_tiger_and_flies_desc: "Кампания по борьбе с коррупцией направлена как на «тигров» на высших постах, так и на «мух» на низших уровнях партийного аппарата. Чжоу Юнкан, бывший член Постоянного комитета Политбюро, был приговорен к пожизненному заключению; Бо Силай пал ещё до него. На сегодняшний день более двух миллионов чиновников прошли проверку и были наказаны. Эта кампания одновременно является подлинной реформой государственного управления и средством ликвидации конкурирующих политических сетей — и мы не можем позволить себе остановить её сейчас."
 CHI_Tonga_Tuna_Concession: "Pacific Fisheries Concessions"
 CHI_Tonga_Tuna_Concession_desc: "Соглашения об эксклюзивном доступе с Тонга, Вануату и Фиджи предоставляют нашим флотам, занимающимся дальним промыслом, преференциальные права в обширных исключительных экономических зонах в центральной и западной частях Тихого океана. В обмен на это мы финансируем модернизацию портов, строительство холодильных комплексов и развитие потенциала морского наблюдения, что приводит к долгосрочной инфраструктурной зависимости правительств-получателей помощи. Эти рыбопромысловые соглашения являются основным экономическим преимуществом нашего более широкого взаимодействия в Тихоокеанском регионе."
 CHI_train_as_you_fight: "Train as You Fight"
 CHI_train_as_you_fight_desc: "Учения на плацу помогают выигрывать парады, но не войны. Подготовка теперь строится с учетом реалистичных боевых условий: на учебной базе «Журихе» проводятся учения в формате свободных действий с участием специальной группы противодействия, которая не позволяет добиваться тех «заранее оговоренных побед», которые были характерны для прошлого."
 CHI_train_generals: "Train the Generals"
 CHI_train_generals_desc: "Реформы на бумаге обречены на провал без командиров, которые их понимают. Наши военные академии перестраиваются, чтобы готовить офицеров, свободно владеющих принципами объединенных военных действий и командования в эпоху информационных технологий, отсеивая при этом политических назначенцев, неспособных правильно оценивать ход современного сражения."
 CHI_TwentyFive_Year_Iran_Accord: "25-Year China-Iran Partnership"
 CHI_TwentyFive_Year_Iran_Accord_desc: "Наше всеобъемлющее стратегическое партнерство обязывает нас в течение 25 лет инвестировать 400 миллиардов долларов США в инфраструктуру, энергетику и промышленность Ирана в обмен на поставки нефти по льготным ценам. Это соглашение дает Тегерану шанс на выживание в условиях американских санкций, а нам — углеводороды по сниженным ценам и выгодное положение в Персидском заливе. Вашингтон, Тель-Авив и монархии Персидского залива рассматривают это соглашение как прямую угрозу своим расчетам в области региональной безопасности. Пусть так и будет."
 CHI_two_centeraries: "The 19th Party Congress"
 CHI_two_centeraries_desc: "На 19-м Национальном съезде «Учение Си Цзиньпина о социализме с китайской спецификой в новую эпоху» было закреплено в Уставе партии ещё при жизни Си Цзиньпина — подобное отличие ранее удостаивался только Мао Цзэдун. Две цели столетия определяют наш горизонт: построение умеренно процветающего общества к 2021 году и построение полностью развитой социалистической страны к 2049 году. Траектория развития государства на ближайшие три десятилетия теперь определена, и ресурсы всех институтов должны быть направлены соответствующим образом."
 CHI_two_establishments: "The Two Establishments"
 CHI_two_establishments_desc: "Доктрина «двух институтов» закрепляет ключевую позицию товарища Си Цзиньпина в Центральном комитете партии и руководящую роль «мысли Си Цзиньпина» в партийной жизни. Коллективное руководство не отменяется, а переосмысливается: Постоянный комитет обсуждает вопросы, но направление определяет один человек. Партия действует как единое целое, и у этого целого есть центр."
 CHI_two_ocean_fleet: "The Two-Ocean Fleet"
 CHI_two_ocean_fleet_desc: "Ни подводные силы, ни надводный флот по отдельности не достаточны для реализации тех планов, которые сейчас преследует Китай. Мы объединяем бесшумные подводные силы и гордый надводный флот в единый военно-морской флот, способный вести боевые действия одновременно в двух океанах — Тихом и Индийском, удерживая ближние моря и действуя в дальних. Из береговой охраны, унаследованной Лю Хуацином, возникает настоящая морская держава, уступающая лишь одной стране, но быстро сокращая отставание."
 CHI_two_reaffirmations: "Two Reaffirmations"
 CHI_two_reaffirmations_desc: "Партия вновь подтверждает два основополагающих обязательства: верность социалистическому пути, определенному в «Учении Мао Цзэдуна», и приоритет «линии масс» как правильного метода партийного руководства. Это не просто лозунги. Это структурные гарантии против правого сдвига, который позволил неравенству и коррупции разъедать революцию изнутри."
 CHI_type_15_light_tank: "The Type 15 Light Tank"
 CHI_type_15_light_tank_desc: "Тяжелая бронетехника не может передвигаться по Тибетскому нагорью или пересекать мосты на юге. ZTQ-15 — тридцатитонный легкий танк с мощной 105-мм пушкой — обеспечивает быстродействующие бригады реальной бронетехникой там, где танк типа 99 не может пройти, и сейчас он устремляет свой взгляд на Индию вдоль гималайской границы."
 CHI_type_95_adoption: "Adopt the Type 95"
 CHI_type_95_adoption_desc: "QBZ-95 — винтовка калибра 5,8 мм с конструкцией «буллпап», принятая на вооружение в конце 1990-х годов, — заменяет устаревшую винтовку Тип 81 во всех подразделениях и обеспечивает переход пехоты на единый патрон отечественного производства. У этой винтовки есть свои особенности, но благодаря ей каждый солдат получает современное оружие отечественного производства."
 CHI_ultra_low_emission: "Ultra-Low Emission Standards"
 CHI_ultra_low_emission_desc: "Министерство экологии и окружающей среды и Министерство промышленности и информационных технологий (MIIT) выпустили стандарты, обязывающие агломерационные заводы, коксовые комбинаты и металлургические предприятия соблюдать предельные значения выбросов, более строгие, чем европейские нормы. Более 80 процентов крупных интегрированных металлургических предприятий завершают модернизацию. Эта реформа заменяет практику повсеместных остановок производства в связи с политическими мероприятиями — «синий день АТЭС», «синий день парада» — на постоянную инфраструктуру для обеспечения чистоты воздуха. Мы не должны больше очищать небо только по особым случаям. Мы должны поддерживать его в чистом состоянии постоянно."
 CHI_underground_great_wall: "The Underground Great Wall"
 CHI_underground_great_wall_desc: "Под горами мы прокладываем «Подземную Великую стену» — тысячи километров укреплённых туннелей, в которых укрываются и находятся в безопасности наши войска и ракеты. То, что невозможно обнаружить, невозможно уничтожить, а подземный арсенал гарантирует, что на любой упреждающий удар последует ответ."
 CHI_undersea_supremacy: "Undersea Supremacy"
 CHI_undersea_supremacy_desc: "Мы будем властвовать не на поверхности, а в глубинах. Приоритетом флота станут подводные лодки: атомные охотники, способные уничтожать авианосцы, подводные лодки с ядерными ракетами, угрожающие всему миру, и целая стена бесшумных подводных лодок, превращающая Первую цепь островов в ловушку. Пусть соперники выставляют напоказ свои грандиозные флоты на поверхности; мы будем владеть водами под ними и лишать их возможности пользоваться морем, так и не показав ни одной мачты."
 CHI_Unification_Ultimatum: "Peninsula Unification Ultimatum"
 CHI_Unification_Ultimatum_desc: "Теперь, когда Пекин и Вашингтон выступили единым фронтом, настало время поставить Пхеньян перед выбором: либо согласиться на мирное воссоединение под руководством Сеула, либо столкнуться с объединенной мощью вооруженных сил Китая, США и Южной Кореи. Этот ультиматум так или иначе положит конец корейскому вопросу."
 CHI_Vision_2030_Partnership: "Vision 2030 Investment Partnership"
 CHI_Vision_2030_Partnership_desc: "Программа диверсификации Саудовской Аравии «Видение-2030» и наш интерес к капиталу из стран Персидского залива и подрядным работам сходятся в рамках широкомасштабного партнерства, охватывающего такие сферы, как чистая энергетика, туристическая инфраструктура и высокотехнологичное производство. Наши компании получают крупные контракты на реализацию проектов NEOM и «Красное море», в то время как мы обеспечиваем себе преференциальные поставки нефти и увеличение доли расчетов в юанях. Такая договоренность дает Эр-Рияду стратегическую свободу действий, не нарушая при этом формальной зависимости в сфере безопасности от Вашингтона."
 CHI_wanhua_strategic_materials: "Strategic Materials List"
 CHI_wanhua_strategic_materials_desc: "Министерство промышленности и информационных технологий (MIIT) опубликовало перечень из примерно 130 химических материалов, в отношении которых мы по-прежнему зависим от импорта. К числу наиболее важных относятся фоторезисты для литографии, полиимидная пленка, высокопрочное углеродное волокно T800 и выше, а также полиуретаны на основе MDI и TDI. Компания «Wanhua Chemical» из Яньтаня, которая провела обратное проектирование технологии производства MDI, принадлежащей «Mitsui», и приобрела венгерскую компанию «BorsodChem», сломала олигополию компаний «Bayer», «BASF» и «Huntsman» на рынке полиуретанов. Компании «Вэйхай Гуанвэй Композитс», «Цзилинь Карбон Вэлли» и «Синопек Шанхай Петрокемикал» наращивают мощности по производству углеродного волокна для лопастей ветряных турбин и композитных материалов для аэрокосмической отрасли. Каждый такой шаг по замещению импорта снижает нашу структурную уязвимость перед иностранным экспортным контролем."
 CHI_warlord_temptation: "The Warlord Temptation"
 CHI_warlord_temptation_desc: "Армия, служащая деньгам, может поддаться искушению служить собственным интересам. Имея в своём распоряжении регионы, доходы и лояльные войска, великие полководцы приближаются к самой древней китайской угрозе: к ситуации, когда войска подчиняются своим генералам, а не центральной власти, и к республике, скатывающейся обратно в эпоху военачальников."
 CHI_water_security_initiative: "National Water Security Initiative"
 CHI_water_security_initiative_desc: "Проблема дисбаланса водных ресурсов между севером и югом Китая решается с 2002 года в рамках проекта «Перекачка воды с юга на север» — крупнейшей в истории системы межбассейнового переброса воды, которая направляет воду из бассейна реки Янцзы в засушливый бассейн реки Хуанхэ и столичный регион. На этой основе реализуется национальная программа обеспечения водной безопасности, сочетающая крупномасштабные инфраструктурные проекты с проектами по сохранению водных ресурсов на уровне провинций, ориентированными на районы севера, испытывающие наибольший дефицит воды. Завершение достаточного числа таких проектов позволит постепенно смягчить последствия дефицита воды, ложащегося тяжким бременем на национальную экономику."
 CHI_weqi_pipeline_lines: "The West-East Gas Pipeline"
 CHI_weqi_pipeline_lines_desc: "Проект газопровода «Запад-Восток» соединяет Таримскую впадину в Синьцзяне с Шанхаем посредством магистрального газопровода протяженностью 4 000 километров; вторая ветка транспортирует туркменский газ на восток через Хоргос, а третья — из Туркменистана через Кыргызстан, следуя по тому же маршруту. Газопровод «Сила Сибири», строительство которого было согласовано с Владимиром Путиным в рамках 30-летнего контракта на поставку 38 миллиардов кубических метров газа в год, в настоящее время поставляет газ из провинции Хэйлунцзян непосредственно в нашу восточную энергосистему. Компании CNPC и PetroChina отвечают за строительство и эксплуатацию всего трубопровода. Ни одна из стран, контролирующих эту трубопроводную инфраструктуру, не может оказаться в заложниках энергетического эмбарго."
 CHI_west_east_gas_pipeline: "West-East Gas Pipeline"
 CHI_west_east_gas_pipeline_desc: "Газопровод «Запад-Восток» протяженностью 4 000 километров пролегает от Таримской котловины в Синьцзяне до Шанхая; его строительство было завершено в 2004 году. Он обеспечивает природным газом промышленный восток Китая, сокращая зависимость от угля и ускоряя коммерческое освоение запасов углеводородов Синьцзяна."
 CHI_western_development_strategy: "The Western Development Strategy"
 CHI_western_development_strategy_desc: "Программа «Сибу Да Кайфа» предусматривает предоставление льготных инвестиций, налоговых стимулов и ускоренное строительство инфраструктуры в двенадцати западных провинциях и автономных районах. Мы сокращаем разрыв между прибрежными и внутренними районами и углубляем интеграцию со Средней и Южной Азией, вовлекая периферию в наше экономическое ядро, прежде чем это место смогут занять наши конкуренты."
 CHI_western_energy_strategy: "Western Energy Development"
 CHI_western_energy_strategy_desc: "В западных провинциях Китая сосредоточены крупнейшие в стране запасы угля, природного газа и гидроэнергии. Скоординированная стратегия развития обеспечивает увязку добычи сырья с промышленным центром в прибрежной зоне, что позволяет снизить зависимость от импорта энергоресурсов и расширить экономическую деятельность вглубь страны."
 CHI_western_industrial_drive: "Western Industrial Development Drive"
 CHI_western_industrial_drive_desc: "Государственный совет одобрил придание статуса национальных зон экономического и технологического развития 169 провинциальным промышленным паркам, причём большинство из них расположено в слаборазвитых западных провинциях. Приоритетные инвестиции в провинции Юньнань, Гуйчжоу и западную часть провинции Сычуань начинают сокращать разрыв в доходах по сравнению с прибрежными регионами и создают логистические предпосылки для крупномасштабного развития производства во внутренних районах страны. Запад ждал достаточно долго."
 CHI_western_institutional_engagement: "Western Institutional Engagement"
 CHI_western_institutional_engagement_desc: "Цзэн Цинхун выступает за углубление взаимодействия с многосторонними институтами под руководством Запада как за лучший способ укрепить наши позиции в международном порядке, пока правила ещё находятся в стадии формирования. Мы добиваемся увеличения квоты в МВФ, внедряем Международные стандарты финансовой отчетности в наших государственных предприятиях и расширяем наше представительство в советах директоров Всемирного банка. Лучше формировать эту архитектуру изнутри, чем оставаться за ее пределами."
 CHI_western_pipeline_corridor: "West-East Gas Pipeline"
 CHI_western_pipeline_corridor_desc: "Газопровод «Запад-Восток» проходит на протяжении 4 000 километров от Таримской котловины в Синьцзяне через провинции Ганьсу, Шэньси и дельту реки Янцзы до Шанхая. После завершения строительства он позволит заменить уголь в промышленности дельты реки Янцзы и сократить загрязнение твердыми частицами, душащее наши самые богатые прибрежные города, тем самым увязывая ресурсы Запада с экономическим ростом Востока."
 CHI_Win_Win_Cooperation: "Community of Shared Future"
 CHI_Win_Win_Cooperation_desc: "В связи с растущей международной критикой практики финансирования, ведущей к «долговой ловушке», мы реформируем наши условия кредитования, вводя льготные ставки, требования по использованию местной рабочей силы и оценку устойчивости долговой нагрузки. Позиционирование инициативы «Пояс и путь» как проекта, выгодного для всех сторон, позволяет переосмыслить её в качестве инструмента взаимного развития, а не средства стратегического давления, в результате чего критикам становится сложнее обосновывать свои аргументы."
 CHI_Wolf_Warrior_Diplomacy: "Wolf Warrior Diplomacy"
 CHI_Wolf_Warrior_Diplomacy_desc: "Мы будем придерживаться решительной и конфронтационной дипломатической позиции. Наши дипломаты будут активно отстаивать наши интересы и оспаривать западные нарративы везде, где они их обнаружат. Цель ясна: занять место Соединённых Штатов в качестве доминирующей мировой державы."
 CHI_wolf_warrior_doctrine: "Wolf Warrior Diplomacy"
 CHI_wolf_warrior_doctrine_desc: "В нашем Министерстве иностранных дел сформировался новый, напористый стиль дипломатии. Наши послы публично нападают на зарубежных критиков; официальные представители государства отвечают на критику обвинениями в лицемерии и недобросовестности. Этот подход отказывается от доктрины Дэн Сяопина, заключавшейся в том, чтобы скрывать свою силу и выжидать, в пользу прямой конфронтации. Мы больше не извиняемся, и мир начинает понимать, что это значит."
 CHI_ws15_bottleneck_solve: "Break the WS-15 Bottleneck"
 CHI_ws15_bottleneck_solve_desc: "Реактивный двигатель — это препятствие, о которое разбился каждый китайский истребитель, что вынуждает нас полагаться на российские турбины даже для наших лучших летательных аппаратов. Турбовентиляторный двигатель WS-15 призван положить конец этой зависимости и обеспечить истребителю J-20 тягу, необходимую для сверхзвукового полета, на основе которой он и был разработан. Освоение технологии изготовления монокристаллических лопаток турбины — это последний метр на пути к вершине."
 CHI_wto_accession_drive: "WTO Accession Drive"
 CHI_wto_accession_drive_desc: "После пятнадцати лет переговоров мы находимся на пороге официального вступления во Всемирную торговую организацию. Вступление закрепит результаты наших реформ по либерализации торговли, откроет зарубежные рынки для нашего экспорта и ускорит передачу нам промышленных технологий."
 CHI_wto_commercial_bank_reform: "WTO Commercial Bank Law Reform"
 CHI_wto_commercial_bank_reform_desc: "Наше вступление в ВТО обязывает нас открыть финансовый сектор для иностранных банков, и премьер-министр Чжу Жунцзи инициировал реструктуризацию в три этапа до наступления этого срока. Компании по управлению активами принимают на себя сотни миллиардов в виде проблемных кредитов; «Центральная Хуйцзинь Инвестмент» вливает капитал за счет валютных резервов; «большая четверка» банков выходит на зарубежные биржи, чтобы обеспечить рыночную дисциплину. Пересмотр Закона о коммерческих банках превращает «большую четверку» из инструментов политического кредитования в формально коммерческие учреждения — это различие будет иметь значение, когда на рынок придут конкурировать иностранные банки."
 CHI_wto_implementation: "WTO Implementation"
 CHI_wto_implementation_desc: "Вступление в ВТО обязывало нас выполнять многолетний план по снижению тарифов, реформированию системы защиты интеллектуальной собственности, либерализации сектора услуг и отмене привилегий государственных торговых организаций. Реализация этого плана проходила неравномерно и зачастую оспаривалась торговыми партнерами в Органе по урегулированию споров, однако этот процесс обеспечил нашу глубокую интеграцию в глобальные цепочки поставок, и эта интеграция является для нас не только обязательством, но и преимуществом."
 CHI_wto_implementation_tt: "If we complete §Y$CHI_wto_accession_drive$§!, the bonus will be better and permanent "
 CHI_wuhan_automotive_hub: "Wuhan Automotive Centre"
 CHI_wuhan_automotive_hub_desc: "Корпорация «Донфэн Мотор», штаб-квартира которой расположена в Ухане, расширяет деятельность своих совместных предприятий с компаниями «Пежо-Ситроен», «Ниссан» и «Хонда». Ухань становится автомобильной столицей центрального Китая, вокруг которой вдоль реки Янцзы формируется кластер поставщиков комплектующих и логистических компаний."
 CHI_xi_jinping_thought_enshrined: "Xi Jinping Thought Enshrined"
 CHI_xi_jinping_thought_enshrined_desc: "«Учение Си Цзиньпина» было возведено из разряда политических ориентиров в ранг конституционной доктрины и введено в качестве обязательного предмета для изучения в университетах, военных академиях и партийных школах по всей стране. Приложение «Сюэси Цянго» установлено на сотнях миллионов телефонов, а его ежедневное использование находится под контролем. Инакомыслие больше не просто не приветствуется — теперь оно официально считается отклонением от установленной истины. Идеологическая архитектура государства и одно имя больше неразделимы."
 CHI_xinjiang_industrial_zones: "Xinjiang Industrial Development"
 CHI_xinjiang_industrial_zones_desc: "Специальные промышленные зоны в Урумчи и Таримской котловине привлекают мигрантов из народности хань, предприятия перерабатывающей промышленности и инвестиции в добычу полезных ископаемых. Эти зоны призваны укрепить связь экономики Синьцзяна с промышленной базой восточных регионов и снизить её зависимость от традиционного сельского хозяйства."
 CHI_y20_strategic_lift_program: "The Y-20 Strategic Lift Program"
 CHI_y20_strategic_lift_program_desc: "Великая держава должна обладать способностью к самостоятельным перемещениям. Тяжёлый реактивный транспортный самолёт Y-20 «Куньпэн», вступивший в строй в 2016 году, наконец-то обеспечивает Китаю воздушные перевозки, необходимые для развёртывания войск, бронетехники и гуманитарной помощи на разных континентах, а его модификации — заправщик и командный самолёт — значительно расширяют радиус действия всех ВВС."
 CHI_Yangtze_confederation: "Yangtze Economic Confederation"
 CHI_Yangtze_confederation_desc: "Бассейн реки Янцзы — от Чунцина через провинции Хубэй и Хунань до устья реки в Шанхае — представляет собой промышленное сердце Китая. Официальное объединение этих провинций в экономическую конфедерацию на основе скоординированного планирования позволит исключить избыточные инвестиции, интегрировать цепочки поставок и распространить «Чунцинскую модель» на весь наиболее продуктивный экономический коридор страны."
 CHI_yangtze_delta_integration: "Yangtze Delta Integration"
 CHI_yangtze_delta_integration_desc: "Скоординированные государственные инвестиции в Шанхае, Цзянсу и Чжэцзяне способствуют укреплению позиций дельты реки Янцзы в качестве нашего главного производственного и экспортного коридора. Концентрация иностранного капитала и квалифицированной рабочей силы в этом регионе станет основой роста на ближайшее десятилетие."
 CHI_yangtze_logistics_corridor: "Yangtze River Logistics Corridor"
 CHI_yangtze_logistics_corridor_desc: "Река Янцзы перегружает больше грузов, чем любой другой внутренний водный путь в мире. Инвестиции в портовую инфраструктуру, улучшение навигационных условий и развитие интермодальных терминалов позволяют интегрировать реку в национальные цепочки поставок, соединяя провинцию Сычуань с Шанхаем с затратами, в разы ниже, чем при автомобильных перевозках."
 CHI_yj12_standoff_family: "The YJ-12 Standoff Family"
 CHI_yj12_standoff_family_desc: "Ракета YJ-12 обеспечивает нашу авиацию сверхзвуковой противокорабельной ракетой, летящей впритык к поверхности моря, которая приближается к цели настолько быстро, что большинство систем противовоздушной обороны не успевают отреагировать. Установленная на борту бомбардировщиков и истребителей, она представляет угрозу для любого военного корабля в радиусе сотен километров от китайского побережья."
 CHI_youth_league_pipeline: "The Youth League Pipeline"
 CHI_youth_league_pipeline_desc: "Коммунистический союз молодежи является основным резервом кадров для фракции Ху Цзиньтао. Выпускники Союза занимают большинство постов секретарей провинциальных партийных комитетов и доминируют на должностях среднего звена в центральных министерствах, образуя общенациональную сеть чиновников, связанных общим организационным опытом. Те, кто продвигается по служебной лестнице в рамках этой структуры, обязаны своим продвижением именно этой системе."
 CHI_yuan_internationalisation: "Yuan Internationalisation"
 CHI_yuan_internationalisation_desc: "Мировой финансовый кризис обнажил уязвимость доллара и открыл перед нами новые возможности. Двусторонние соглашения о валютных свопах с десятками центральных банков, офшорные центры клиринга юаня в Гонконге и Сингапуре, а также рынок облигаций «димсам» обеспечили нашему юаню первое значимое международное обращение. Премия доллара как резервной валюты не будет сохраняться бесконечно."
 CHI_yuanhua_model: "The Yuanhua Model"
 CHI_yuanhua_model_desc: "Лай Чансин показал, как это делается. В 1990-е годы его «империя Юаньхуа» из Сямыня контрабандой вывезла нефть, автомобили и сигареты на сумму около десяти миллиардов долларов, и всякий раз, когда таможня собиралась их задержать, появлялся какой-нибудь влиятельный чиновник, который давал им «зелёный свет». Мы превращаем его схему в систему: военные прикрывают контрабандиста, а контрабандист платит военным."
 CHI_yuzhao_hull_coral_brigades: "The Yuzhao Hull and the Coral Brigades"
 CHI_yuzhao_hull_coral_brigades_desc: "Амфибийные амбиции превращаются из пилотного проекта в полноценный флот. Корветы типа 071 запускаются в серийное производство, а численность морской пехоты увеличивается с двух до шести бригад, подготовленных для ведения боевых действий на спорных рифах и островах Южно-Китайского моря. «Корпус» и «коралловая бригада» объединяются в единую силу, способную захватить береговую линию."
 CHI_zb108_wheeled_family: "The Type 08 Wheeled Family"
 CHI_zb108_wheeled_family_desc: "Серия машин 8x8 «Тип 08» — от бронетранспортеров до штурмовых орудий и санитарных машин — обеспечивает средние бригады универсальным колесным шасси, которое отличается высокой скоростью движения по дорогам и низкими эксплуатационными расходами, и служит мобильным ядром китайских сил быстрого развертывания."
 CHI_zbd04_apex_ifv: "The ZBD-04A Apex IFV"
 CHI_zbd04_apex_ifv_desc: "ZBD-04A — это основная гусеничная боевая машина пехоты армии, оснащённая 100-мм пушечно-гранатомётом, 30-мм пушкой и способная перевозить полный взвод в бронированном корпусе. Она является основой тяжелых механизированных бригад и действует в паре с танком «Тип 99» на китайско-индийской границе."
 CHI_zbd_mechanisation: "ZBD Mechanisation"
 CHI_zbd_mechanisation_desc: "Пехота должна идти в ногу с бронетехникой. Семейство гусеничных боевых машин ZBD доставляет стрелков на передовую под бронезащитой и ведет боевые действия бок о бок с танками, завершая процесс механизации тяжелых бригад."
 CHI_zeng_qinghong_reign: "The Zeng Qinghong Era"
 CHI_zeng_qinghong_reign_desc: "Цзэн Цинхун, ведущий стратег «шанхайской клики», занимает должность вице-президента и возглавляет Центральную партийную школу. Благодаря своему контролю над Отделом организации и Центральным секретариатом он обладает решающим влиянием на кадровые назначения на всех уровнях партийно-государственного аппарата. Те, кого он назначает, находятся под его контролем."
 CHI_zero_hour: "Zero Hour"
 CHI_zero_hour_desc: "На протяжении многих лет армия тренировалась, переоснащалась и ждала, и вот настал час применить всё это на практике. Наша пехота будет наступать в таких количествах, что ни одна оборонительная линия не сможет её поглотить, наши бронетанковые колонны — в построениях, слишком глубоких, чтобы их можно было обойти, а стратегические ракетные войска будут ждать в своих шахтах, служа тем аргументом, который мы намерены никогда не вынуждены привести. С этого часа Народно-освободительная армия перестаёт готовиться к следующей войне и вместо этого начинает её ожидать, и каждое командование, наконец, подчиняется единой воле."
 CHI_ztz96_mainstreaming: "Mainstream the Type 96"
 CHI_ztz96_mainstreaming_desc: "Не каждой бригаде нужен дорогостоящий танк Тип 99. Более дешевый и легкий ZTZ-96 выпускается серийно и постоянно модернизируется до версий 96A и 96B, становясь основным танком, составляющим костяк бронетанковых войск."
 CHI_ztz99_rollout: "Roll Out the Type 99"
 CHI_ztz99_rollout_desc: "TZT-99 становится передовым боевым средством тяжелых бригад — это основной боевой танк третьего поколения, оснащенный композитной броней, 125-мм орудием и комплексом лазерной защиты. Это первый китайский танк, созданный для того, чтобы на равных соперничать с лучшими западными и российскими образцами."
 CHI_ztz99a_apex: "The Type 99A Apex"
 CHI_ztz99a_apex_desc: "Танк ZTZ-99A, поступивший на вооружение в 2011 году, представляет собой вершину этой линейки: более толстая броня, двигатель повышенной мощности, прицел типа «охотник-убийца» и полноценная система управления боем, благодаря которой он становится узлом в сети бригады. Это самый мощный удар, на который способна армия."
 arctic_observer_status: "Arctic Observer Status"
 arctic_observer_status_desc: "Наше членство в Арктическом совете и инфраструктура «Полярного шелкового пути» открывают новые морские пути и новые возможности для освоения ресурсов на Крайнем Севере."
 CHI_610_directive_active: "610 Northeast Directive"
 CHI_610_directive_active_desc: "Северо-восточное командование КПК привело в действие протоколы чрезвычайной мобилизации. Силы безопасности вдоль реки Ялу получили подкрепление, а провинциальные власти действуют в рамках расширенных чрезвычайных полномочий."
 CHI_aiib_dividend_member: "AIIB Dividend Member"
 CHI_aiib_dividend_member_desc: "Статус одного из учредителей Азиатского банка инфраструктурных инвестиций обеспечивает стабильную доходность. Выплаты по инвестициям и льготные условия торговли в рамках проектов, финансируемых Китаем, укрепляют наш баланс."
 CHI_anti_corruption_purge: "Anti-Corruption Purge"
 CHI_anti_corruption_purge_desc: "Центральная комиссия по дисциплинарной инспекции ежегодно рассматривает тысячи дел. Разоблачаются и наказываются случаи коррупции в сфере закупок, строительства и управления государственными предприятиями. Чиновники, которые извлекали выгоду из каждого контракта, сталкиваются с тем, что политическая ситуация изменилась. Производительность каждой государственной функции растет по мере того, как сети кумовства ликвидируются и заменяются системой прямой подотчетности."
 CHI_anti_terror_crackdown_idea: "Anti-Terror Crackdown"
 CHI_anti_terror_crackdown_idea_desc: "Спецслужбы проводят общенациональную операцию по борьбе с террористическими сетями. Усилены меры по выявлению угроз, а политические ресурсы полностью задействованы в проведении этой операции."
 CHI_army_reorganisation_disruption_idea: "Army Reorganisation"
 CHI_army_reorganisation_disruption_idea_desc: "Тринадцать армий группы перенумерованы и реорганизованы на основе общевойсковых бригад. Пока идет реорганизация, страдают организационная структура и наступательная мощь, а подготовка отстает от графика. Как только новая структура устоялась, сухопутные войска становятся более компактными и боеспособными, чем прежде."
 CHI_asian_century_concord_idea: "The Asian Century Concord"
 CHI_asian_century_concord_idea_desc: "Пекин и Дели договорились координировать свои действия по региональным и глобальным вопросам, определив XXI век как век, который Азия будет формировать совместно."
 CHI_AUS_pacific_deterrence: "Increased Pacific Deterrence"
 CHI_AUS_pacific_deterrence_desc: "Давление со стороны китайских военно-морских баз в южной части Тихого океана вынудило Королевские ВМС Австралии срочно расширить зону своего действия. Новые датчики, более точные разведывательные данные и готовые к действию десантные силы находятся в полной боевой готовности."
 CHI_ban_strategic_partnership: "Strategic Partnership with Beijing"
 CHI_ban_strategic_partnership_desc: "Бангладеш согласовывает свою внешнеполитическую позицию с позицией Китая на различных многосторонних форумах."
 CHI_banking_modernised_idea: "Recapitalised Banking Sector"
 CHI_banking_modernised_idea_desc: "Государственные банки были очищены от проблемных кредитов и зарегистрированы на Гонконгской фондовой бирже с участием иностранных миноритарных акционеров. Международные стандарты бухгалтерского учета, внешний аудит и рыночная дисциплина способствуют повышению эффективности и укреплению доверия к данному сектору."
 CHI_beidou_global_constellation: "Beidou Global Constellation"
 CHI_beidou_global_constellation_desc: "Благодаря наземным станциям, развернутым по всей Латинской Америке, спутниковая сеть «Бэйдоу» теперь обеспечивает всеобъемлющее глобальное покрытие. Точность и дальность действия этой системы находят широкое применение в военно-морских операциях, разведке и контрразведке."
 CHI_beijing_communique_guarantor: "Guarantor of the Beijing Communique"
 CHI_beijing_communique_guarantor_desc: "Роль Китая в посредничестве на пути к миру между двумя региональными соперниками укрепила его авторитет как ответственной державы. Дипломатический капитал циркулирует свободно, а поддерживать отношения стало проще."
 CHI_blue_national_soil: "Blue National Soil"
 CHI_blue_national_soil_desc: "Официальная доктрина КНР, согласно которой морское пространство в пределах «девяти пунктирных линий» обозначается как «голубая национальная территория»: морская территория, столь же неотъемлемая, как любая провинция на суше. Такая формулировка делает уступки политически невозможными и переопределяет любое иностранное присутствие как вторжение."
 CHI_blue_national_soil_militarised: "Blue National Soil Militarised"
 CHI_blue_national_soil_militarised_desc: "То, что начиналось как административная доктрина, превратилось в оперативную позицию. Силы ВМС Китая и береговой охраны в настоящее время активно отстаивают претензии на «голубую национальную территорию», рассматривая вторжения иностранных судов как нарушения внутреннего законодательства Китая."
 CHI_bo_ideological_consolidation: "Ideological Consolidation"
 CHI_bo_ideological_consolidation_desc: "Кампания по идеологическому прояснению укрепляет приверженность партии социалистическим принципам и противодействует правому сдвигу. Учебные занятия, собрания по исправлению ошибок и пересмотренные образовательные программы обеспечивают внедрение этих двух принципов во всех органах государственной власти."
 CHI_bri_forum_momentum: "Belt and Road Forum Momentum"
 CHI_bri_forum_momentum_desc: "Прошедший в Пекине форум «Пояс и путь», который проводится раз в три года, вновь подтвердил приверженность Китая глобализации, основанной на развитии инфраструктуры. Иностранные делегации уезжают, взяв на себя новые обязательства, а наша экономическая дипломатия получает долгосрочные дивиденды."
 CHI_bri_industrial_zones_tier_1_idea: "Special Economic Zones I"
 CHI_bri_industrial_zones_tier_1_idea_desc: "Специальные экономические зоны за рубежом, созданные по китайскому образцу, позволяют расширить нашу производственную базу за пределы страны."
 CHI_bri_industrial_zones_tier_2_idea: "Special Economic Zones II"
 CHI_bri_industrial_zones_tier_2_idea_desc: "Зарубежные зоны превратились в полноценные промышленные парки, а накопленный там опыт в сфере строительства находит применение в отечественных строительных программах."
 CHI_bri_industrial_zones_tier_3_idea: "Special Economic Zones III"
 CHI_bri_industrial_zones_tier_3_idea_desc: "Сеть промышленных парков, управляемых китайскими компаниями, обеспечивает интеграцию экономик стран-партнеров в наши цепочки поставок и строительную отрасль."
 CHI_bri_mines_tier_1_idea: "Resource Concessions I"
 CHI_bri_mines_tier_1_idea_desc: "Горнодобывающие концессии, полученные благодаря кредитам, предоставленным государствами-партнерами, обеспечивают поступление сырья в китайскую промышленность."
 CHI_bri_mines_tier_2_idea: "Resource Concessions II"
 CHI_bri_mines_tier_2_idea_desc: "Портфель концессий расширился за счет включения нескольких секторов добывающей промышленности, что позволило укрепить ресурсную базу нашей экономики."
 CHI_bri_mines_tier_3_idea: "Resource Concessions III"
 CHI_bri_mines_tier_3_idea_desc: "Китайские компании владеют контрольными долями в добывающем секторе стран-партнеров, а излишки, превышающие наши собственные потребности, продаются с наценкой."
 CHI_bri_pipelines_tier_1_idea: "Energy Arteries I"
 CHI_bri_pipelines_tier_1_idea_desc: "Трубопроводы, проложенные в странах-партнерах и снабжающие китайские нефтеперерабатывающие заводы, снижают нашу уязвимость перед «энергетическими узкими местами» на морских путях."
 CHI_bri_pipelines_tier_2_idea: "Energy Arteries II"
 CHI_bri_pipelines_tier_2_idea_desc: "Увеличение пропускной способности трубопровода и создание соответствующих резервуарных парков позволяют нам как забирать больше топлива, так и хранить его в большем объеме в резерве."
 CHI_bri_pipelines_tier_3_idea: "Energy Arteries III"
 CHI_bri_pipelines_tier_3_idea_desc: "Наземные энергетические магистрали теперь полностью обходят морские узкие места, а инфраструктура хранения, необходимая для их использования, стремительно развивается."
 CHI_bri_ports_tier_1_idea: "Maritime Network I"
 CHI_bri_ports_tier_1_idea_desc: "Контейнерные терминалы, управляемые китайскими компаниями, в настоящее время обрабатывают значительную долю грузов, перевозимых по морскому маршруту в рамках торговли с государствами-партнерами, что укрепляет наши коммерческие позиции в странах, через которые проходят наши грузы."
 CHI_bri_ports_tier_2_idea: "Maritime Network II"
 CHI_bri_ports_tier_2_idea_desc: "Концессии на эксплуатацию терминалов расширились до полноценных контрактов на развитие портов. Верфи и причалы, которые наши подрядчики строят за рубежом, позволяют им совершенствовать опыт, который они затем применяют при строительстве военных кораблей у себя в стране."
 CHI_bri_ports_tier_3_idea: "Maritime Network III"
 CHI_bri_ports_tier_3_idea_desc: "Вдоль морских путей теперь простирается цепь коммерческих портов, некоторые из которых оснащены причалами двойного назначения и объектами для пополнения запасов. Китайское судоходство расширяет сферу своей деятельности, как и флот, обеспечивающий его защиту."
 CHI_bri_powerplants_tier_1_idea: "Power Generation Network I"
 CHI_bri_powerplants_tier_1_idea_desc: "Генерационные мощности, построенные за рубежом китайскими подрядчиками, позволяют партнерской отрасли работать на наших условиях, а наши собственные станции благодаря этому опыту работают более эффективно."
 CHI_bri_powerplants_tier_2_idea: "Power Generation Network II"
 CHI_bri_powerplants_tier_2_idea_desc: "Расширение портфеля зарубежных электростанций способствует росту производственных показателей внутри страны."
 CHI_bri_powerplants_tier_3_idea: "Power Generation Network III"
 CHI_bri_powerplants_tier_3_idea_desc: "Китайские машиностроительные компании стали основными поставщиками оборудования для производства электроэнергии в рамках всей партнерской сети, причем объем промышленного производства в самой стране соответствует этому спросу."
 CHI_bri_prestige_tier_1_idea: "Prestige Diplomacy I"
 CHI_bri_prestige_tier_1_idea_desc: "Очевидные инвестиции в страны-партнеры позволяют нам завоевать репутацию строителя, а не кредитора."
 CHI_bri_prestige_tier_2_idea: "Prestige Diplomacy II"
 CHI_bri_prestige_tier_2_idea_desc: "Проект «Пояс и путь» называют общественным благом. Поддержание дружеских отношений обходится нам дешевле, чем раньше."
 CHI_bri_prestige_tier_3_idea: "Prestige Diplomacy III"
 CHI_bri_prestige_tier_3_idea_desc: "В настоящее время Пекин является основным партнером для большинства стран развивающегося мира, и этот статус напрямую превращается в политический капитал внутри страны."
 CHI_bri_railways_tier_1_idea: "Overland Corridors I"
 CHI_bri_railways_tier_1_idea_desc: "Трансграничные железнодорожные маршруты связывают экономики стран-партнеров с китайской промышленностью, а грузовые перевозки по ним способствуют укреплению наших доброжелательных отношений со странами, которые они обслуживают."
 CHI_bri_railways_tier_2_idea: "Overland Corridors II"
 CHI_bri_railways_tier_2_idea_desc: "В настоящее время эти коридоры функционируют в качестве основных грузовых транспортных артерий. Надежные наземные перевозки обеспечивают снабжение наших войск в тех районах, где морской доступ затруднен."
 CHI_bri_railways_tier_3_idea: "Overland Corridors III"
 CHI_bri_railways_tier_3_idea_desc: "Сплошная наземная транспортная сеть простирается глубоко вглубь материка. Наши инженеры-железнодорожники строят объекты у себя в стране быстрее благодаря опыту, приобретенному за рубежом."
 CHI_bri_telecom_tier_1_idea: "Digital Silk Road I"
 CHI_bri_telecom_tier_1_idea_desc: "Магистральные сети, построенные Китаем в странах-партнёрах, обеспечивают нашим службам возможность отслеживать проходящий по ним трафик, что укрепляет нашу защиту от проникновения иностранных спецслужб."
 CHI_bri_telecom_tier_2_idea: "Digital Silk Road II"
 CHI_bri_telecom_tier_2_idea_desc: "Управление аппаратным обеспечением через сети партнеров позволяет снизить затраты на поддержание нашей деятельности за рубежом."
 CHI_bri_telecom_tier_3_idea: "Digital Silk Road III"
 CHI_bri_telecom_tier_3_idea_desc: "Цифровой коридор полностью принадлежит нам: от начала до конца — аппаратное обеспечение, магистральные линии связи и кабельные выходы на берег. Проходящий через него иностранный трафик не является ни конфиденциальным, ни защищенным от нас."
 CHI_brokered_non_aggression_pact: "Beijing-Brokered Non-Aggression Pact"
 CHI_brokered_non_aggression_pact_desc: "Китай выступает гарантом нашего соглашения о ненападении с нашим региональным соперником. Пока этот договор остается в силе, обе стороны извлекают выгоду из стабильности и более теплых отношений с Пекином."
 CHI_cadre_evaluation_reform_idea: "Comprehensive Cadre Evaluation Reform"
 CHI_cadre_evaluation_reform_idea_desc: "В настоящее время деятельность чиновников оценивается не только по темпам роста ВВП, но и по эффективности охраны окружающей среды, обеспечению социальной гармонии и качеству предоставления государственных услуг. Снижение зависимости от производств, интенсивно использующих ископаемое топливо, и оптимизация государственных расходов свидетельствуют о повышении ответственности административного аппарата."
 CHI_cai_active_phase: "EU Comprehensive Agreement on Investment"
 CHI_cai_active_phase_desc: "Всеобъемлющее соглашение об инвестициях вступило в активную фазу. Европейские рынки широко открыты для китайского экспорта и инвестиций, цены на потребительские товары снизились, а наши производственные мощности значительно расширились."
 CHI_cai_residual: "Lasting CAI Legacy"
 CHI_cai_residual_desc: "Даже после завершения активной фазы Всеобъемлющего соглашения об инвестициях структурная интеграция с европейскими рынками продолжается. Торговые связи остаются более тесными, чем это было бы в противном случае."
 CHI_central_political_commission_1: "Central Political and Legal Affairs Commission"
 CHI_central_political_commission_1_desc: "Центральная комиссия по политическим и правовым вопросам осуществляет надзор за судами, прокуратурой, органами общественной безопасности и органами государственной безопасности. Её основная задача заключается в поддержании внутреннего порядка и обеспечении того, чтобы правовая система служила целям партии, а не выступала в качестве независимого сдерживающего фактора. По мере укрепления своего положения в составе комитета значительно растет способность комиссии предотвращать беспорядки, эффективно реагировать на проявления инакомыслия и координировать межведомственные меры по обеспечению безопасности."
 CHI_chinese_dream_momentum: "Chinese Dream Momentum"
 CHI_chinese_dream_momentum_desc: "Нарратив «Китайской мечты» мобилизует общественное чувство национальной целеустремленности. Граждане призываются служить делу общего возрождения; партийные органы сообщают о резком росте числа запросов о призыве в армию и публичных проявлениях патриотических настроений. Пока что сама история оказывается более убедительной, чем конечная цель."
 CHI_chongqing_model_idea: "Chongqing Model"
 CHI_chongqing_model_idea_desc: "Государственные предприятия являются опорой инвестиций и задают темп развития экономики в целом. Национализированные активы обеспечивают финансовую основу для социальных расходов, не прибегая к иностранному капиталу или налоговым поступлениям от частного сектора."
 CHI_commercial_bank_law_idea: "Commercial Bank Law Implementation"
 CHI_commercial_bank_law_idea_desc: "Внесенные в 2003 году поправки в Закон о коммерческих банках предписывают «большой четверке» применять коэффициенты достаточности капитала в соответствии с Базельскими соглашениями, стандарты классификации рисков и создавать независимые советы директоров. В переходный период затраты на соблюдение нормативных требований возрастают, однако процесс распределения кредитов впервые выходит из-под прямого политического контроля."
 CHI_common_prosperity_framework: "Common Prosperity Framework"
 CHI_common_prosperity_framework_desc: "Регуляторное вмешательство в сферу частного образования, развлечений и технологий сопровождается расширением государственных инвестиций в здравоохранение, инфраструктуру сельских районов и социальное страхование. Партия утверждает, что процветание становится всеобщим; механизм заключается в том, что государство определяет, что такое процветание и кто получает его в первую очередь."
 CHI_cpec_partner: "China-Pakistan Economic Corridor"
 CHI_cpec_partner_desc: "Инвестиционный пакет в рамках проекта «Китай-Пакистанский экономический коридор» (CPEC) преобразует инфраструктуру Пакистана: финансируемые Китаем автомагистрали, энергетические проекты и промышленные зоны способствуют ускорению экономической деятельности."
 CHI_crrc_idea1_desc: "Корпорация «China Railway Rolling Stock Corporation», крупнейший в мире поставщик железнодорожного оборудования, играет ведущую роль в строительстве железнодорожных путей и терминалов на внутреннем рынке, а также в экспорте китайского подвижного состава за рубеж."
 CHI_defiance_of_china: "Defiance of China"
 CHI_defiance_of_china_desc: "Государство отклонило требования Китая, выдержало экономическое давление и сохранило свою позицию в отношении спорных территориальных объектов. Этот акт неповиновения приносит ему значительный престиж внутри страны и может побудить других региональных игроков к ужесточению собственной позиции."
 CHI_diaoyu_patrol_regime: "Diaoyu Patrol Regime"
 CHI_diaoyu_patrol_regime_desc: "Постоянная ротация сил береговой охраны вблизи спорных вод позволяет проводить подготовку экипажей военно-морских судов в реалистичных условиях."
 CHI_digital_governance_spirit: "Digital Governance"
 CHI_digital_governance_spirit_desc: "Интегрированные системы данных объединяют городские сети видеонаблюдения, мониторинг финансовых транзакций и системы оценки социального кредита в единую инфраструктуру обеспечения соблюдения нормативных требований. Местные органы власти обрабатывают административные запросы в цифровом формате и обеспечивают соблюдение стандартов посредством автоматического выявления нарушений. Бюрократический интерфейс между гражданином и государством оптимизирован, и государство присутствует на каждом этапе взаимодействия."
 CHI_distant_water_fishing_fleets: "Distant-Water Fishing Fleet"
 CHI_distant_water_fishing_fleets_desc: "Наш флот дальнего плавания, получающий субсидии от Пекина и пользующийся поддержкой государственных предприятий, является крупнейшим в мире и ведет деятельность в исключительных экономических зонах Западной Африки, Южной Америки и южной части Тихого океана. Помимо обеспечения продовольственной безопасности, эти суда демонстрируют постоянное морское присутствие в водах, удаленных от наших берегов, подкрепляя принцип, согласно которому китайские интересы распространяются везде, куда бы ни направлялись китайские корабли."
 CHI_divestiture_transition_idea: "Divestiture Transition"
 CHI_divestiture_transition_idea_desc: "Лишение армии источников коммерческих доходов и переход на финансирование из государственного бюджета приводит к образованию дефицита, который невозможно покрыть за один день даже с помощью ассигнований. Подразделения, привыкшие самостоятельно обеспечивать себя за счет доходов от гостиниц, фермерских хозяйств и торговли оружием, теперь вынуждены полагаться на Пекин, а политические ресурсы тратятся на сглаживание последствий этих потерь. Напряженность спадает после реорганизации оборонного сектора в самофинансируемые конгломераты."
 CHI_dragon_king_ascendant: "Dragon King Ascendant"
 CHI_dragon_king_ascendant_desc: "Лонг Ван — «Король Драконов» — в китайской космологии считается традиционным повелителем четырёх морей. С официальным введением системы дани и укреплением военного присутствия Южное море признаёт лишь одного повелителя: Пекин."
 CHI_eda_grey_market_idea: "Grey-Channel EDA Sourcing"
 CHI_eda_grey_market_idea_desc: "Китайские компании, не имеющие собственных производственных мощностей, закупают технологические потоки Synopsys и Cadence через подставные компании в Юго-Восточной Азии. Выпуск чипов осуществляется, однако поставки нестабильны, а обновления инструментария отстают от лицензионного рынка на несколько месяцев."
 CHI_eight_points_doctrine: "Eight Points on Taiwan"
 CHI_eight_points_doctrine_desc: "«Восьмипунктное предложение» Цзян Цзэминя обеспечивает формальную доктринальную основу для политики в отношении отношений между двумя берегами Тайваньского пролива, сочетая в себе шаги, направленные на мирное воссоединение, с явными предупреждениями против провозглашения независимости де-юре. Военное планирование операций на случай непредвиденных обстоятельств ведется параллельно с дипломатическими усилиями, что дает Пекину надежный инструмент принуждения."
 CHI_etim_designation: "ETIM Designation Framework"
 CHI_etim_designation_desc: "Двусторонняя рамочная программа по борьбе с терроризмом направлена против сепаратистских сетей Восточного Туркестана."
 CHI_eu_market_access: "Comprehensive EU Market Access"
 CHI_eu_market_access_desc: "Ратификация всеобъемлющего инвестиционного соглашения с Брюсселем открывает широкий доступ к европейским потребительским и капитальным рынкам, снимая ограничения на экспорт и создавая более благоприятные политические условия для китайских компаний на всей территории ЕС."
 CHI_grey_society_crisis_idea: "Grey Society Crisis"
 CHI_grey_society_crisis_idea_desc: "В Китае поколение, выросшее после введения политики «одного ребенка», привело к формированию перевернутой возрастной пирамиды. Сокращающаяся рабочая сила вынуждена финансировать растущую группу пенсионеров, что приводит к истощению бюджетов на пенсионное обеспечение и здравоохранение, в то время как рост производительности труда приостанавливается. Это бремя станет легче только тогда, когда численность населения трудоспособного возраста стабилизируется."
 CHI_guarantor_of_korean_peace: "Guarantor of Korean Peace"
 CHI_guarantor_of_korean_peace_desc: "Пекин признан во всем регионе в качестве незаменимого гаранта стабильности на Корейском полуострове. Престиж, который это приносит, выходит за рамки срока полномочий любой отдельной администрации."
 CHI_gwadar_basing_rights: "Gwadar Basing Rights"
 CHI_gwadar_basing_rights_desc: "Доступ к глубоководным сооружениям в Гвадаре расширяет зону оперативного действия Военно-морских сил Народно-освободительной армии в Индийском океане и Аравийском море."
 CHI_ideological_rectification: "Ideological Rectification"
 CHI_ideological_rectification_desc: "Запреты, предусмотренные Документом № 9, обеспечиваются посредством проведения обязательных учебных занятий и кампаний по самокритике в университетах, средствах массовой информации и государственных предприятиях. Границы допустимого дискурса стремительно сужаются. Лояльность демонстрируется через отказ от западных либеральных концепций, а стены идеологического периметра укрепляются для защиты от иностранного влияния."
 CHI_informal_sanctions: "Informal THAAD Sanctions"
 CHI_informal_sanctions_desc: "В ответ на развертывание системы THAAD мы ввели неформальные экономические санкции против Южной Кореи. Китайские туристы направляются в другие страны, на корейские товары налагаются нетарифные барьеры, а корейские компании, работающие на нашей территории, сообщают о преследованиях со стороны властей."
 CHI_information_warfare: "Information Warfare Apparatus"
 CHI_information_warfare_desc: "Государственные СМИ и цифровые платформы распространяют китайские нарративы по всему миру, одновременно противодействуя враждебным информационным кампаниям."
 CHI_inner_party_supervision_idea: "Inner-Party Supervision Regulations"
 CHI_inner_party_supervision_idea_desc: "Установленные процедуры надзора предусматривают, что вышестоящие партийные органы должны проводить проверки подчиненных комитетов и представлять отчеты по их результатам. Усиливается борьба с коррупцией, а политическая подотчетность приводится в соответствие с установленным порядком."
 CHI_international_department_1: "International Department of the Chinese Communist Party"
 CHI_international_department_1_desc: "Международный департамент ведет межпартийную дипломатию по всему миру, развивая отношения с правящими партиями, оппозиционными движениями и политическими фондами во всех регионах. Он также выступает в качестве основного институционального центра, отвечающего за политическое взаимодействие в рамках инициативы «Пояс и путь», координирующего реализацию проектов, управляющего доходами от сотрудничества со странами-партнерами и занимающегося реструктуризацией долга в случаях, когда правительства стран-получателей сталкиваются с трудностями при погашении задолженности. Расширение влияния комиссии способствует углублению сети заинтересованных зарубежных партнеров и повышению общей эффективности обязательств в рамках «Пояса и пути»."
 CHI_international_sanctions: "International Sanctions"
 CHI_international_sanctions_desc: "Поддержка Китаем военной агрессии со стороны Северной Кореи привела к введению масштабного режима международных санкций. Доступ к торговле ограничен, иностранные инвестиции сохнут, а дипломатическая изоляция углубляется."
 CHI_Invigorate_Country_Through_STE1: "Invigorate Country Through STE"
 CHI_Invigorate_Country_Through_STE1_desc: "Стратегия оживления страны с помощью науки, технологий и образования предусматривает направление государственных инвестиций в научно-исследовательские институты и систему высшего образования. Дивиденды от научных исследований обходятся в увеличение расходов на образование."
 CHI_Invigorate_Country_Through_STE1_tt: "Yearly Tech Boost for §Y$CAT_computing_tech$§! or §Y$CAT_internet_tech$§!"
 CHI_iron_brothers_joint_training: "Iron Brothers Joint Training"
 CHI_iron_brothers_joint_training_desc: "Регулярные совместные учения с вооруженными силами стран-партнеров способствовали укреплению сплоченности подразделений, согласованию доктрин и повышению уровня владения навыками ведения боевых действий с применением всех родов войск."
 CHI_jap_finlandized_sovereignty: "Finlandised Sovereignty"
 CHI_jap_finlandized_sovereignty_desc: "Токио сохраняет свой парламент, свою прессу, свой язык. Кроме того, он хранит молчание о том, что делает Пекин за пределами своих границ."
 CHI_jap_forced_neutrality: "Forced Neutrality"
 CHI_jap_forced_neutrality_desc: "Выход Японии из-под «защитного зонтика» США произошёл под угрозой оружия. Договор подписан. Это унижение останется в памяти целого поколения."
 CHI_jap_historical_pressure: "Chinese History Offensive"
 CHI_jap_historical_pressure_desc: "Пекин вновь поднял вопрос об истории военного времени, затрагивая на всех дипломатических форумах темы посещений храма Ясукуни, споров вокруг учебников и наследия Нанкина. Эта кампания разжигает общественное мнение в Японии и подрывает способность Токио противостоять операциям Китая, направленным на оказание влияния."
 CHI_japan_soft_power: "Sino-Japanese Cultural Engagement"
 CHI_japan_soft_power_desc: "Туристические обмены, передача панд во временное пользование и совместные фотосессии министров позволяют превратить добрую волю в политический капитал. Автоматически приостанавливается в случае слишком сильного роста агрессии."
 CHI_japanese_cultural_imports: "Licensed Japanese Cultural Imports"
 CHI_japanese_cultural_imports_desc: "Bilibili транслирует фильмы студии «Гибли». Tencent приобрела лицензию на «Убийцу демонов». Молодежное крыло партии изучает доклады Ван Хунина об ассимиляции культурных элементов."
 CHI_joint_command_consultations: "Joint Command Consultations"
 CHI_joint_command_consultations_desc: "Регулярные стратегические консультации между военным руководством Китая и Северной Кореи способствуют улучшению координации и снижению риска просчетов."
 CHI_joint_venture_era_idea: "Joint Venture Industrial Era"
 CHI_joint_venture_era_idea_desc: "Совместные предприятия с участием иностранных и отечественных партнеров становятся основным инструментом для приобретения технологий, передачи управленческого опыта и получения доступа к глобальным сбытовым сетям."
 CHI_kaesong_co_developer: "Kaesong Co-Developer"
 CHI_kaesong_co_developer_desc: "Китайские строительные компании и логистические операторы управляют совместными предприятиями на территории расширенной зоны Кэсон. Совместные цепочки поставок позволяют сократить расходы и укрепить репутацию обеих сторон."
 CHI_kor_beijing_pressure: "Beijing Pressure Campaign"
 CHI_kor_beijing_pressure_desc: "Постоянное экономическое и дипломатическое давление со стороны Китая подрывает доверие южнокорейской общественности и сужает пространство для проведения Сеулом независимой политики. Правительство сталкивается с растущим недовольством внутри страны и сокращением возможностей для маневра в отношениях с Пекином."
 CHI_kor_beijing_security_guarantee: "Beijing Security Guarantee"
 CHI_kor_beijing_security_guarantee_desc: "Благодаря официальной гарантии безопасности со стороны Китая Южная Корея избавляется от зависимости от американского «ядерного зонтика». Планирование в сфере обороны переориентируется на сотрудничество с Пекином, что позволяет снизить нагрузку, связанную с призывом на военную службу, и стабилизировать политическую обстановку."
 CHI_kor_exit_trilateral: "Exit from Trilateral Framework"
 CHI_kor_exit_trilateral_desc: "Южная Корея вышла из трехсторонней оборонной структуры, объединяющей США, Японию и Филиппины. Это решение отражает оценку Сеула, согласно которой антикитайская направленность данной структуры несовместима с его экономическими интересами и целями стратегической автономии."
 CHI_kor_strategic_autonomy_doctrine: "Strategic Autonomy Doctrine"
 CHI_kor_strategic_autonomy_doctrine_desc: "Южная Корея приняла доктрину стратегической автономии, которая дистанцирует Сеул от вашингтонской архитектуры в Индо-Тихоокеанском регионе. Оборонная политика Кореи переориентируется на самодостаточность и региональный многосторонний подход, а не на управление альянсом с США."
 CHI_korean_tributary: "North Korea's Tributary Relationship"
 CHI_korean_tributary_desc: "Политическая зависимость Северной Кореи от Пекина воссоздала в современной институциональной форме отношения дани, которые определяли китайско-корейские отношения до 1895 года. Китаю формально гарантирован доступ к корейским портам, рынкам и стратегическим территориям."
 CHI_kpa_intelligence_penetration: "KPA Intelligence Penetration"
 CHI_kpa_intelligence_penetration_desc: "Китайские спецслужбы создали сеть информаторов в рядах Корейской народной армии. Возможность в режиме реального времени отслеживать военные планы Северной Кореи и ситуацию во внутренней политике страны дает Пекину беспрецедентное средство давления на Пхеньян."
 CHI_lithium_supply_chain_locked: "Lithium Triangle Supply Chain"
 CHI_lithium_supply_chain_locked_desc: "Долгосрочные соглашения о закупках с производителями из Аргентины, Боливии и Чили обеспечивают китайским производителям аккумуляторов необходимый объем лития, что способствует выравниванию кривых производительности и создает резервы для развития гражданской промышленности."
 CHI_long_range_firepower_idea: "Long-Range Firepower"
 CHI_long_range_firepower_idea_desc: "[CHI_long_range_firepower_idea_tt]"
 CHI_lotte_market_correction: "Lotte Market Correction"
 CHI_lotte_market_correction_desc: "Китайские подразделения группы «Лотте» были вынуждены пойти на контролируемое сокращение деятельности, уступив долю рынка отечественным конкурентам. Эта корректировка позволяет сократить отток потребительских товаров и демонстрирует политическую эффективность целенаправленных экономических ответных мер."
 CHI_lunar_legacy_industrial: "The Heavenly Palace Made Real"
 CHI_lunar_legacy_industrial_desc: "«Тяньгун» означает «Небесный дворец», и впервые в истории на орбите постоянно находится станция, построенная исключительно силами китайцев. Заводы, литейные цеха и сборочные цеха, на которых она была создана, теперь направляют свою проверенную дисциплину обратно на Землю. То, что способно вывести станцию на орбиту, способно построить что угодно на Земле."
 CHI_lunar_legacy_military: "Crossing the Magpie Bridge"
 CHI_lunar_legacy_military_desc: "«Цюэцяо» («Сорочий мост») ретранслировал наши сигналы с обратной стороны Луны — он назван в честь моста из птиц, который когда-то позволил двум влюбленным встретиться в небесах. Экипажи, прошедшие подготовку к самой сложной миссии в истории, вернулись закаленными и уверенными в себе. Сила, способная достичь Луны, не сомневается ни в одном испытании на Земле."
 CHI_lunar_legacy_political: "Chang'e Ascends the Heavens"
 CHI_lunar_legacy_political_desc: "Согласно древнему мифу, Чанъэ выпила эликсир и улетела на Луну, оставив своего мужа Хоу И вечно взирать в небо. Теперь её имя помогло целой стране высадиться на лунной поверхности, и люди видят в этом доказательство того, что Китай входит в число ведущих мировых держав. Эта высадка становится источником авторитета, который ни один соперник не сможет отнять."
 CHI_lunar_legacy_research: "The Questions of Tianwen"
 CHI_lunar_legacy_research_desc: "Название «Тяньвэнь» («Небесные вопросы») происходит от древнего стихотворения Цюй Юаня, в котором поднимались вопросы о порядке мироздания. Луноходы «Юйту» и лунные образцы дали ответы на вопросы, на которые до этого не могла ответить ни одна страна, а лаборатории, расшифровавшие эти данные, жаждут новых открытий. Научное сообщество, доказавшее свою состоятельность в исследовании Луны, теперь стремится к освоению всех новых горизонтов."
 CHI_mass_line_bo_campaign: "Mass Line Campaign"
 CHI_mass_line_bo_campaign_desc: "Кадры направляются в сельские районы и на производственные предприятия для сбора отзывов и демонстрации приверженности партии интересам народа. Эта кампания способствует повышению политической сознательности и направляет энергию народа на достижение целей партии."
 CHI_mazu_blessing: "Mazu's Blessing"
 CHI_mazu_blessing_desc: "Мазу, богиня моря и покровительница моряков, почитается на всем побережье Южно-Китайского моря. Для Южно-Китайского флота было официально запрошено благословение из её храма. Эта церемония проводится во всех подразделениях флота и укрепляет дух единства."
 CHI_media_offensive: "Global Media Offensive"
 CHI_media_offensive_desc: "CGTN, «Синьхуа» и социальные сети проводят совместную глобальную кампанию, направленную на освещение китайской точки зрения."
 CHI_militia_deployed: "Maritime Militia Active"
 CHI_militia_deployed_desc: "Корабли китайской морской милиции дислоцированы в спорной зоне, где они постоянно находятся под прикрытием гражданских судов. Их присутствие не позволяет кораблям береговой охраны противоборствующей стороны приближаться к этой зоне, не вызвав при этом кризиса."
 CHI_monroe_inverted: "Monroe Doctrine Inverted"
 CHI_monroe_inverted_desc: "Мы вытеснили Вашингтон с позиции главного внешнего партнера Латинской Америки, став опорой для перераспределения сил в Западном полушарии, что снижает издержки в отношениях и склоняет региональное общественное мнение в нашу пользу."
 CHI_national_humiliation: "National Humiliation"
 CHI_national_humiliation_desc: "Неудача Китая в дипломатической или военной сфере в Южно-Китайском море в стране интерпретируется как продолжение «века унижений». Общественное мнение накалено; руководство испытывает сильное давление с требованием восстановить авторитет другими способами."
 CHI_national_security_commission_1: "National Security Commission of the Chinese Communist Party"
 CHI_national_security_commission_1_desc: "Созданная в 2013–2014 годах при Си Цзиньпине Комиссия по национальной безопасности занимает вершину архитектуры безопасности Китая, координируя разведывательные, военные, кибербезопасность и контрразведывательные функции под непосредственным руководством партии, а не через Государственный совет. Её создание стало сигналом к целенаправленной централизации всех стратегических решений в сфере безопасности. По мере укрепления влияния комиссии в рамках комитета её полномочия по координации становятся всё более всеобъемлющими, а способность реагировать на внутренние и внешние угрозы безопасности — более согласованной и решительной."
 CHI_nepal_himalayan_friendship: "Himalayan Friendship Initiative"
 CHI_nepal_himalayan_friendship_desc: "Китайские инвестиции и доброй воли поступают в Непал в рамках сотрудничества, которое уважает нейтралитет Катманду и в то же время приближает страну к экономической орбите Пекина."
 CHI_neutral_interlocutor: "Neutral Interlocutor"
 CHI_neutral_interlocutor_desc: "Мы позиционируем себя как единственную силу, с которой обе Кореи могут вести переговоры. Эта роль сопряжена как с влиянием, так и с определенными ожиданиями."
 CHI_nko_blue_sky_mobilization: "Blue Sky Mobilization"
 CHI_nko_blue_sky_mobilization_desc: "Корейская народная армия перешла к полной боевой мобилизации в соответствии со стратегическими целями Китая. Все отпуска отменены, а передовые подразделения выдвигаются на позиции для наступления."
 CHI_nko_chinese_economic_sphere: "Chinese Economic Sphere"
 CHI_nko_chinese_economic_sphere_desc: "Экономика Северной Кореи официально интегрирована в промышленную сферу Китая. Ключевые секторы находятся под управлением китайских государственных предприятий, механизмы привязки валют налажены, а северокорейский вон привязан к юаню."
 CHI_nko_energy_aid: "Chinese Energy Aid"
 CHI_nko_energy_aid_desc: "Поставки мазута и электроэнергии из Дандуна позволяют фабрикам продолжать работу, а улицам — оставаться освещёнными. Субсидии из Пекина сопровождаются негласными ожиданиями."
 CHI_nko_food_package: "Chinese Food Package"
 CHI_nko_food_package_desc: "Поставки зерна через пограничные пункты на реке Тумен позволяют смягчить хроническую нехватку продовольствия. Эта помощь дает партии политическое пространство для маневра."
 CHI_nko_infrastructure_investment: "Chinese Infrastructure Investment"
 CHI_nko_infrastructure_investment_desc: "Китайские строительные бригады ведут масштабную реконструкцию инфраструктуры Северной Кореи. Дороги, железные дороги, порты и электросети модернизируются в рамках контрактов, которые на целое поколение связывают ресурсы Северной Кореи с китайскими производственными цепочками."
 CHI_nko_offensive_readiness: "KPA Offensive Readiness"
 CHI_nko_offensive_readiness_desc: "Благодаря материально-технической поддержке со стороны Китая Корейская народная армия перешла от оборонительных позиций к позициям, оптимизированным для проведения быстрых наступательных операций на юг через 38-ю параллель."
 CHI_nko_security_assurance: "Chinese Security Assurance"
 CHI_nko_security_assurance_desc: "Пекин предложил сдержанную, но твёрдую гарантию на случай краха режима. Эта гарантия успокаивает ближайшее окружение и ослабляет давление, связанное с мобилизацией."
 CHI_npm_red_banner_insurgency: "Chinese-Backed Insurgency"
 CHI_npm_red_banner_insurgency_desc: "Тайный канал Пекина обеспечивает маоистские отряды оружием, боеприпасами и подготовкой кадров. Народно-освободительная армия рассматривает Непал как полигон для экспорта революции и рассчитывает на отдачу от своих вложений."
 CHI_nrcms_rollout_idea: "New Rural Cooperative Medical Scheme"
 CHI_nrcms_rollout_idea_desc: "Объединенные взносы сельских жителей, органов местного самоуправления и центрального бюджета теперь покрывают расходы на лечение в случае тяжелых заболеваний для сотен миллионов фермеров, что способствует улучшению здоровья населения и снижению финансового удара, наносимого болезнями по сельским домохозяйствам."
 CHI_organisation_department_1: "Organization Department of the Chinese Communist Party"
 CHI_organisation_department_1_desc: "Отдел по организационным вопросам контролирует все кадровые решения партии: назначения, повышения по службе, проверку кандидатур и дисциплинарные меры на всех уровнях иерархии КПК. Его влияние распространяется на государственные предприятия и министерства, что делает его самым мощным инструментом обеспечения внутренней сплоченности партии. По мере укрепления влияния комиссии в Постоянном комитете усиливается её контроль над отбором кадров и соответственно растёт её способность обеспечивать выполнение центральных директив через партийный аппарат."
 CHI_pacific_basing_rights: "Second Island Chain Basing"
 CHI_pacific_basing_rights_desc: "Договорные права на размещение баз и пополнение запасов в глубине «второй цепи островов» обеспечивают Военно-морским силам НОАК стратегический радиус действия, сокращают логистические цепочки и ускоряют сроки обслуживания на верфях при развертывании в открытом море."
 CHI_pacific_diplomatic_setback: "Pacific Diplomatic Setback"
 CHI_pacific_diplomatic_setback_desc: "Громкий провал на островах Тихого океана привел к тому, что столицы стран региона стали более настороженно относиться к нашим предложениям, что повысило политическую цену каждой последующей дипломатической инициативы."
 CHI_pacific_security_lead: "Pacific Security Leadership"
 CHI_pacific_security_lead_desc: "Соглашения о предоставлении доступа к передовым базам и ротационное размещение войск на островах Тихого океана расширяют оперативный радиус действия Военно-морских сил НОАК и ускоряют создание базовой инфраструктуры, обеспечивающей их функционирование."
 CHI_paf_maritime_militia: "PAF Maritime Militia"
 CHI_paf_maritime_militia_desc: "Гражданские рыболовецкие флотилии, организованные под военным командованием. Возможность «правдоподобного отрицания» в море, а при необходимости — предоставление реальных цифр."
 CHI_party_century_endures: "The Party That Endures"
 CHI_party_century_endures_desc: "«Идеология Си Цзиньпина» закреплена в конституционно-организационной структуре Партии в качестве постоянной основы деятельности. Система съездов, Политбюро и Центральная военная комиссия вновь подтверждены в качестве надежных движущих сил государственного управления. Партия, пережившая смерть Мао, Культурную революцию и события на площади Тяньаньмэнь, призвана пережить любого отдельного человека, включая своего нынешнего верховного лидера."
 CHI_patriotic_education_mandate: "Patriotic Education Mandate"
 CHI_patriotic_education_mandate_desc: "Пересмотренные учебные программы гарантируют, что ни один китайский школьник не забудет о том, что произошло в Нанкине, в Пиндиншане и в сборных камерах «Подразделения 731». Стабильность укрепляется. Растет и недоверие к иностранным идеям."
 CHI_pearls_economic_partner: "Chinese Strategic Partnership"
 CHI_pearls_economic_partner_desc: "Размещение китайских военно-морских логистических сил открыло путь к экономической щедрости Пекина: в принимающую страну поступают средства на модернизацию портов и кредиты на развитие инфраструктуры."
 CHI_personal_rule_mandate: "Personal Rule Mandate"
 CHI_personal_rule_mandate_desc: "На заседании Всекитайского собрания народных представителей 2018 года из конституции были исключены ограничения на количество президентских сроков, что позволило на постоянной основе сконцентрировать власть в руках верховного лидера. Стратегическое руководство и политическая лояльность теперь проходят через единый центр, что повышает уровень поддержки военных действий, но сужает пространство для проявления инициативы у полевых командиров."
 CHI_petrodollar_breaks: "Petrodollar Parity Reached"
 CHI_petrodollar_breaks_desc: "Ценообразование на нефть из стран Персидского залива в юанях, линии свопов между центральными банками стран «Глобального Юга» и альтернативы системе SWIFT привели к ослаблению резервной премии доллара, что позволило преобразовать монетарное влияние в политическую власть и демографическую уверенность."
 CHI_pla_basing_economic_help: "Chinese Economic Partnership"
 CHI_pla_basing_economic_help_desc: "В обмен на размещение на нашей территории объектов материально-технического обеспечения Военно-морских сил НОАК мы получаем постоянную экономическую поддержку со стороны Китая: расширение экспортных рынков, модернизацию гражданских производственных предприятий и политическую поддержку на региональных форумах."
 CHI_policy_bank_lending_idea: "Policy Bank Lending Drive"
 CHI_policy_bank_lending_idea_desc: "Банк развития Китая, Эксимбанк и Азиатский банк развития (ADBC) предоставляют льготные кредитные линии государственным предприятиям и провинциальным органам власти, ускоряя инвестиции в основные средства в сферах транспорта, энергетики и зарубежной инфраструктуры. Эта волна кредитования стимулирует объемы строительства, но при этом связывает сбережения населения в низкодоходных депозитах."
 CHI_princeling_economic_leverage: "Princeling Economic Leverage"
 CHI_princeling_economic_leverage_desc: "Сеть трансграничных деловых связей в настоящее время связывает северокорейскую элиту с китайским капиталом. Каждая сделка усугубляет эту зависимость."
 CHI_property_sector_contraction_idea: "Property Sector Contraction"
 CHI_property_sector_contraction_idea_desc: "«Три красные линии» вынуждают крупнейших застройщиков одновременно сокращать долговую нагрузку. Объемы вводимого в эксплуатацию жилья резко сокращаются, доходы местных органов власти от продажи земельных участков исчезают, а в свою очередь страдают сети поставщиков цемента, стали и бытовой техники. Экономика в целом поглощает этот шок по мере принудительного спуска пузыря на рынке недвижимости."
 CHI_property_tax_pilot_idea: "Property Tax Pilot"
 CHI_property_tax_pilot_idea_desc: "Шанхай и Чунцин взимают умеренные налоги со вторых домов и элитной недвижимости, что сдерживает спекулятивные инвестиции и способствует диверсификации доходов местных органов власти за счет источников, не связанных с продажей земельных участков."
 CHI_publicity_department_1: "Publicity Department of the Chinese Communist Party"
 CHI_publicity_department_1_desc: "Департамент по связям с общественностью определяет идеологическую линию для всех печатных, вещательных и цифровых СМИ в Китае, курируя цензуру, формирование информационной повестки и утверждение легитимности партии внутри страны. Он также координирует инфраструктуру распространения информации за рубежом, включая расширение присутствия государственных СМИ и партнерские отношения в сфере контента за рубежом. Усиление влияния комиссии приводит к формированию более согласованной и убедительной информационной среды, что укрепляет социальную стабильность и поддержку населения в отношении приоритетных задач партии."
 CHI_qccm_coordination_cell: "QCCM Coordination Cell"
 CHI_qccm_coordination_cell_desc: "Четырёхсторонняя система обмена разведывательной информацией в рамках Памирского коридора объединяет спецслужбы Китая, Пакистана, Афганистана и Таджикистана."
 CHI_raj_foreign_defense_pressure: "Chinese Pressure"
 CHI_raj_foreign_defense_pressure_desc: "Поворот Пекина в сторону Южной Азии оказал постоянное дипломатическое и информационное давление на Дели, сузив стратегические возможности Индии вдоль её северных и восточных границ."
 CHI_rason_investment_flow: "Rason Investment Programme"
 CHI_rason_investment_flow_desc: "Китайский капитал поступает в специальную экономическую зону Расон, финансируя развитие инфраструктуры, промышленных мощностей и портовых сооружений. Этот эксперимент приносит заметные результаты."
 CHI_rason_port_access: "Rason Port Access"
 CHI_rason_port_access_desc: "Теперь наши корабли имеют надежный доступ к глубоководному порту Расон, что обеспечивает Военно-морским силам Народно-освободительной армии стратегический плацдарм в Японском море."
 CHI_rcep_member: "RCEP Founding Member"
 CHI_rcep_member_desc: "Вместе с Токио и Сеулом мы выступили соучредителями Регионального всеобъемлющего экономического партнерства. Тарифы снижаются, цепочки поставок укрепляются, а отсутствие США становится нормой для региона."
 CHI_reconstruction_plan_idea: "Reconstruction Capacity Plan"
 CHI_reconstruction_plan_idea_desc: "Заранее размещенное оборудование, стандартизированные протоколы и специализированные инженерные подразделения армии обеспечивают нам исключительное преимущество в скорости восстановления инфраструктуры и промышленности после стихийных бедствий."
 CHI_regional_crisis_alert: "Regional Crisis Alert"
 CHI_regional_crisis_alert_desc: "Позиция Китая в вопросах безопасности на Корейском полуострове привела к повышению боеготовности во всем регионе. Сплочённость альянса находится под угрозой."
 CHI_reunion_humanitarian_lead: "Humanitarian Diplomacy Lead"
 CHI_reunion_humanitarian_lead_desc: "Наша работа по координации трансграничного воссоединения семей вызвала необычайно широкий резонанс. Министерства иностранных дел разных стран положительно оценивают это взаимодействие, а отечественные СМИ активно освещают эту тему."
 CHI_rmb_promotion: "RMB Internationalization"
 CHI_rmb_promotion_desc: "Юань всё чаще признаётся в качестве международной резервной валюты в рамках двусторонних соглашений о свопах."
 CHI_russian_arms_dependency: "Russian Arms Dependency"
 CHI_russian_arms_dependency_desc: "Народно-освободительная армия была создана на основе советских и российских образцов. Её стрелковое оружие изначально представляло собой модель «Тип 56» — лицензионную версию «Калашникова», а бронетанковые войска сформировались на базе танка «Тип 59», являвшегося прямой копией советского Т-54А; более поздние модели танков и боевых машин пехоты по-прежнему отражают линейку Т-72 и БМП. Артиллерия, транспортные средства и батареи противовоздушной обороны имеют общие корни. Наиболее глубокая зависимость наблюдается в области силовых установок: двигатель АЛ-31Ф устанавливается на истребители J-10 и J-11, двигатель РД-93 — на истребители JF-17, а истребители Су-35 и батареи С-400 были напрямую закуплены в Москве. Каждая линейка отечественных истребителей зависит от российской турбины, за каждую лицензионную модель выплачиваются роялти, а конструкторские бюро по-прежнему больше копируют, чем создают. Пока Китай не создаст собственную военно-промышленную базу, сердце армии будет биться в ритме России."
 CHI_sanctions_immunity_partial: "Yuan-Settled Trade Lifeline"
 CHI_sanctions_immunity_partial_desc: "Контракты на поставку энергоресурсов и товаров, номинированные в юанях и заключенные с партнерами, в отношении которых введены санкции, смягчают последствия финансового давления со стороны Запада, снижая нагрузку на потребителей и позволяя сохранить экспортные каналы."
 CHI_sars_outbreak_uncontrolled_idea: "SARS Epidemic"
 CHI_sars_outbreak_uncontrolled_idea_desc: "Из-за отсутствия скоординированных мер по оперативному реагированию на чрезвычайную ситуацию вирус SARS успел распространиться по нескольким провинциям, прежде чем были введены карантинные меры. Задержка с уведомлением международного сообщества нанесла ущерб нашему авторитету за рубежом и привела к значительным экономическим потрясениям внутри страны."
 CHI_sars_response_effective_idea: "SARS Contained"
 CHI_sars_response_effective_idea_desc: "Наша система реагирования на чрезвычайные ситуации позволила оперативно ввести карантин, своевременно уведомить международное сообщество и принять скоординированные медицинские меры. Вспышка заболевания локализована, экономические последствия оказались ограниченными, а наш международный авторитет остался незыблемым."
 CHI_scientific_outlook_idea_1: "Scientific Outlook on Development Preparation"
 CHI_scientific_outlook_idea_1_desc: "В соответствии с «Научным взглядом на развитие» мы переориентируем национальную политику с приоритета роста ВВП на более широкие социальные и экологические показатели."
 CHI_scientific_outlook_idea_1_tt: "§Y$CHI_scientific_outlook_on_development$§! Focus Completion Time §G-35§! §YDays§!"
 CHI_sco_dialogue_partner: "SCO Dialogue Partner"
 CHI_sco_dialogue_partner_desc: "Эта страна была принята в качестве партнера по диалогу в Шанхайскую организацию сотрудничества, что открыло путь к углублению политического и экономического взаимодействия с государствами-членами."
 CHI_sco_member: "SCO Member"
 CHI_sco_member_desc: "Эта страна является полноправным членом Шанхайской организации сотрудничества и участвует во всех механизмах политического, экономического и военно-безопасностного сотрудничества, созданных этой организацией."
 CHI_sco_member_econ_desc: "Эта страна является полноправным членом Шанхайской организации сотрудничества, в деятельности которой основное внимание уделяется экономическому сотрудничеству, и она укрепляет торговые и инвестиционные связи с другими государствами-членами."
 CHI_sco_member_mil_desc: "Эта страна является полноправным членом Шанхайской организации сотрудничества, уделяющей особое внимание военному сотрудничеству, и принимает участие в совместных учениях и операциях по обеспечению безопасности."
 CHI_sco_member_pol_desc: "Эта страна является полноправным членом Шанхайской организации сотрудничества, в деятельности которой основное внимание уделяется политическому сотрудничеству, что позволяет укреплять системы государственного управления и противодействия подрывной деятельности."
 CHI_sco_observer: "SCO Observer"
 CHI_sco_observer_desc: "Эта страна обладает статусом наблюдателя в Шанхайской организации сотрудничества, что дает ей доступ к форумам ШОС и возможность ограниченного экономического сотрудничества при сохранении суверенитета в вопросах выбора политического курса."
 CHI_scs_chinese_debt: "Chinese Debt Dependency"
 CHI_scs_chinese_debt_desc: "Обязательства по кредитам в рамках инициативы «Пояс и путь» обеспечили Пекину значительное влияние на внешнеполитические решения партнеров, имеющих задолженность. Требования по обслуживанию долга ограничивают свободу правительства в принятии позиций, противоречащих интересам Китая."
 CHI_scs_claimant_under_pressure: "Under Chinese Pressure"
 CHI_scs_claimant_under_pressure_desc: "Доминирование Китая в Южно-Китайском море привело к тому, что каждое решение, касающееся архипелага Спратли, обходится нынешнему правительству все дороже. Внутри страны мнения разделились между сторонниками уступчивости и сторонниками сопротивления; снижение политического авторитета, связанное с решениями по Южно-Китайскому морю, отражает сложность выбора какого-либо курса действий в условиях, когда условия диктует Пекин."
 CHI_scs_de_facto_sovereignty: "De Facto Sovereignty"
 CHI_scs_de_facto_sovereignty_desc: "Благодаря терпеливой двусторонней дипломатии и накопленным соглашениям претензии Китая в Южно-Китайском море стали региональным стандартом. В настоящее время ни одна из стран, предъявляющих претензии, официально не оспаривает сложившуюся ситуацию; у внешних держав отсутствуют правовые инструменты для оспаривания того, что было принято соседними государствами."
 CHI_scs_jdz_revenue: "Joint Development Revenue"
 CHI_scs_jdz_revenue_desc: "Добыча углеводородов в зонах совместной разработки приносит доход как нам, так и нашему партнёру. Доходы от нефти поступают в соответствующее государство архипелага Спратли с обеих сторон соглашения на весь срок его действия, что обеспечивает обоим правительствам конкретную заинтересованность в продолжении двустороннего сотрудничества и затрудняет любой поворот обратно к конфронтации."
 CHI_scs_setback: "South China Sea Setback"
 CHI_scs_setback_desc: "Противостояние завершилось неудачно, дипломатическая инициатива была публично отвергнута, либо международное решение было вынесено не в пользу китайских претензий. Этот неудачный исход приводит к снижению значения переменной «Рамки Южно-Китайского моря» и может спровоцировать оппортунистические действия со стороны других стран, предъявляющих претензии."
 CHI_sea_eagles_carrier_wing_idea: "$CHI_sea_eagles_carrier_wing$"
 CHI_sea_eagles_carrier_wing_idea_desc: "[CHI_sea_eagles_carrier_wing_idea_tt]"
 CHI_selective_anti_corruption_campaign_idea: "Selective Anti-Corruption Campaign"
 CHI_selective_anti_corruption_campaign_idea_desc: "Целенаправленное преследование в судебном порядке позволяет пресекать наиболее вопиющие случаи коррупции и устранять соперничающих влиятельных деятелей, однако избирательный и политический характер правоприменения порождает институциональную неопределенность и подавляет инициативу."
 CHI_self_reliant_path_idea: "The Taihang's Growing Pains"
 CHI_self_reliant_path_idea_desc: "Цена самодостаточности — выгоревшие турбины и приземленные эскадрильи. Первые модели WS-10 «Тайхан» терпят крах из-за собственных амбиций: их лопатки растрескиваются, а срок службы исчисляется всего лишь часами, и экипажи расплачиваются за каждый урок, который инженерам ещё предстоит усвоить. Конструкторские бюро в конечном итоге достигнут поставленной цели, но пока этого не произошло, флот летает, полагаясь лишь на веру."
 CHI_sez_japanese_investors: "SEZs for Japanese Investors"
 CHI_sez_japanese_investors_desc: "Особые льготы для компаний «Тойота», «Сони» и «Панасоник». Стратегия «Китай плюс один» переворачивается с ног на голову, поскольку уход из Китая становится невозможным."
 CHI_sino_japanese_understanding: "Sino-Japanese Strategic Understanding"
 CHI_sino_japanese_understanding_desc: "Негласная архитектура разрядки: торговые потоки, встречи министров и молчаливое соглашение оставить историю в архивах. Она будет безвозвратно утрачена, если китайско-японская агрессия вновь разгорится."
 CHI_smic_foundry_base: "SMIC Foundry Base"
 CHI_smic_foundry_base_desc: "Кампус SMIC в Чжанцзяне предоставляет отечественным заказчикам, не имеющим собственных производственных мощностей, сертифицированную производственную платформу с технологическим процессом 28 нм. Собственные производственные мощности фабрики снижают зависимость Китая от TSMC в сфере производства логических микросхем по зрелым технологическим процессам и создают основу для дальнейшего развития отечественных технологических процессов."
 CHI_society_department_1: "Society Work Department"
 CHI_society_department_1_desc: "Созданный в 2023 году Департамент по работе с общественностью объединил функции КПК по надзору за низовыми общественными организациями, НПО, профсоюзами и системой подачи петиций, которые ранее были распределены между несколькими ведомствами. В его задачи входит обеспечение того, чтобы гражданское общество функционировало в рамках параметров, установленных партией, а недовольство населения направлялось в контролируемые каналы, а не приводило к независимой мобилизации. Растущее влияние комиссии позволяет отделу расширять сферу своего организационного воздействия и совершенствовать механизмы, с помощью которых социальное давление поглощается и нейтрализуется."
 CHI_sovereign_wealth_diversification_idea: "China Investment Corporation Sovereign Wealth Diversification"
 CHI_sovereign_wealth_diversification_idea_desc: "Китайская инвестиционная корпорация перераспределяет валютные резервы, переводив их из низкодоходных казначейских облигаций США в глобальные фонды прямых инвестиций, инфраструктурные проекты и стратегические доли участия в акционерном капитале. Этот портфель приносит более высокую доходность, чем резервная база, и обеспечивает Пекину структурные позиции на зарубежных рынках капитала."
 CHI_state_tolerated_boycott: "State-Tolerated Boycott"
 CHI_state_tolerated_boycott_desc: "Полиция не будет разгонять антияпонские демонстрации — пока не придётся. Патриотически настроенные потребители перенаправляют свои расходы. Некоторые китайские ритейлеры также терпят убытки."
 CHI_streamline_the_ranks_idea: "Streamlining the Ranks"
 CHI_streamline_the_ranks_idea_desc: "Beginning in the late 1990s the People's Liberation Army shed hundreds of thousands of personnel, trading a bloated mass-mobilization force for a smaller, professional army built around brigades. The transition strains training pipelines and ties up industry.\n\n§YThis penalty lifts once both conditions are met:§!\n§Y-§! The army is below §Y[?CHI_streamline_div_baseline|0]§! divisions.\n§Y-§! Infantry weapons, artillery and medium tank chassis stockpiles each hold a reserve above §Y10%§! of the army's needs."
 CHI_strike_black_sing_red_idea: "Strike Black, Sing Red"
 CHI_strike_black_sing_red_idea_desc: "Были арестованы тысячи чиновников и представителей организованной преступности, а их сети ликвидированы. Массовые мероприятия, посвящённые «красной культуре», наполняют общественную сферу патриотическим энтузиазмом, поднимая боевой дух и укрепляя лояльность к партии."
 CHI_succession_roadmap: "Succession Roadmap"
 CHI_succession_roadmap_desc: "Выбор и подготовка назначенного преемника дают понять партийным органам, что передача власти будет проходить в упорядоченном режиме, а не сопровождаться конфликтами. Международные партнеры расценивают такую систему преемственности как свидетельство системной стабильности. Премия за политический риск по долгосрочным соглашениям с Китаем сокращается, по крайней мере, на время действия данной договоренности."
 CHI_summit_host: "Summit Host"
 CHI_summit_host_desc: "Пекин активно принимает у себя важные региональные переговоры. Дипломатическая активность находится на высоком уровне, а инструменты давления приобретают дополнительный вес."
 CHI_taiwan_strait_pressure_spirit: "Cross-Strait Pressure Posture"
 CHI_taiwan_strait_pressure_spirit_desc: "Регулярные вторжения самолетов НОАК в зону идентификации противовоздушной обороны Тайваня, крупномасштабные военно-морские учения в водах, окружающих остров, а также взвешенные меры экономического давления обеспечивают постоянное давление, не доходящее до открытой войны. Такая позиция удерживает Тайбэй в состоянии постоянной боевой готовности и демонстрирует Вашингтону нашу решимость, укрепляя наши вооруженные силы и поддерживая общественную поддержку военных действий на случай возможных непредвиденных обстоятельств."
 CHI_tech_crackdown_moderate: "Tech Crackdown: Managed Restructuring"
 CHI_tech_crackdown_moderate_desc: "Кампания по ужесточению регулирования привела к росту затрат на обеспечение соответствия нормативным требованиям и замедлила инвестиции в научные исследования, однако сектор платформ обладает достаточным масштабом, чтобы пережить эти потрясения без структурного коллапса."
 CHI_tech_crackdown_severe: "Tech Crackdown: Severe"
 CHI_tech_crackdown_severe_desc: "Наша кампания по регулированию сектора онлайн-платформ застала цифровую экономику на ранней стадии развития. Развитие сектора услуг застопорилось, венчурный капитал ушел, а инвестиции в научные исследования резко сократились."
 CHI_the_duterte_precedent: "The Duterte Precedent"
 CHI_the_duterte_precedent_desc: "Пример того, как глава правительства одной из стран АСЕАН решил переориентироваться с Вашингтона на Пекин, вызвал широкий резонанс во всем регионе. Другие лидеры отмечают, что США не помешали этому — или не смогли помешать — и соответственно взвешивают свои собственные варианты действий."
 CHI_three_represents_debate: "Three Represents Controversy"
 CHI_three_represents_debate_desc: "Идеологические традиционалисты внутри партии выступают против предложения Цзяна принять частных предпринимателей в ряды партии, утверждая, что это приведет к утрате авангардной партией своего классового характера. Внутрипартийные споры временно нарушают согласованность политики и вызывают трения на провинциальном уровне."
 CHI_three_represents_debate_tt: "\nThis §YNational Spirit§! will §Rcancel§! if §YJiang Zemin§! does not complete §Y$CHI_three_represents_codified$§! and is no longer §YCountry Leader§!"
 CHI_tibet_crackdown_idea: "Tibet Security Operation"
 CHI_tibet_crackdown_idea_desc: "Скоординированная операция по обеспечению безопасности, проводимая на всей территории Тибета, позволяет пресекать сепаратистскую деятельность, хотя это и приводит к временному ухудшению стабильности."
 CHI_total_war_himalayan_front: "Total War on the Himalayan Front"
 CHI_total_war_himalayan_front_desc: "Каждый завод, каждая железнодорожная станция, каждый мобилизованный резервист — все были задействованы в решении вопроса о МакМахоне."
 CHI_two_centenary_resolve: "Two Centenary Goals"
 CHI_two_centenary_resolve_desc: "Два юбилейных срока — 2021 и 2049 годы — определяют поколенческий горизонт экономического и социального планирования. Инвестиции в инфраструктуру, целевые показатели производительности и программы технологического развития ориентированы на эти вехи. Эти цели формируют структуру бюрократических стимулов и обеспечивают запуск устойчивых многодесятилетних циклов планирования во всех министерствах."
 CHI_united_front_department_1: "United Front Work Department"
 CHI_united_front_department_1_desc: "Департамент по работе с Объединенным фронтом курирует отношения КПК с внепартийными слоями населения: этническими меньшинствами, религиозными общинами, сетями китайцев за рубежом и иностранными политическими деятелями, поддающимися кооптации. Его задача заключается в нейтрализации потенциальных источников оппозиции и распространении влияния партии за пределы официального членства. По мере усиления влияния комиссии работа отдела становится более систематичной, превращая второстепенных игроков в надёжные инструменты реализации стратегических интересов Китая."
 CHI_usa_asia_pivot_collapse: "Indo-Pacific Pivot Collapsed"
 CHI_usa_asia_pivot_collapse_desc: "В связи с тем, что Сеул постепенно попадает в орбиту влияния Пекина, а Токио оказывается в стратегической изоляции, краеугольный камень американской политики «переориентации на Азию» рухнул. Перспективное планирование пришло в упадок, доверие союзников пошатнулось, а политические издержки этого разворота ложатся тяжким бременем на Вашингтон."
 CHI_usa_back_channel_open: "Back Channel to Foggy Bottom"
 CHI_usa_back_channel_open_desc: "Незаметная линия связи между Чжуннаньхаем и Госдепартаментом обеспечивает возможность кризисного общения за пределами официального дипломатического канала. Этот канал обеспечивает постоянный поток разведывательной информации о намерениях США, однако ценой раскрытия китайской контрразведки."
 CHI_usa_g2_framework: "G2 Framework"
 CHI_usa_g2_framework_desc: "Вашингтон и Пекин закрепили институционально совместное управление делами Кореи в рамках великогодержавного кондоминиума, координируя свою политику через постоянные двусторонние каналы. Такая схема стабилизирует рынки и снижает потребительские расходы, однако привязывает американскую политику в отношении Кореи к постоянной благосклонности со стороны Китая."
 CHI_wakhan_buffer_idea: "Wakhan Buffer Zone"
 CHI_wakhan_buffer_idea_desc: "Слаженная система мер по борьбе с радикализацией на всей территории Ваханского коридора укрепила западную границу Китая, защитив её от проникновения экстремистов."
 CHI_wakhan_buffer_partner_idea: "Wakhan Counter-Terrorism Partner"
 CHI_wakhan_buffer_partner_idea_desc: "Совместные протоколы по пограничному контролю, заключенные с Пекином, позволили укрепить внутренний потенциал в области борьбы с терроризмом, несмотря на то что иностранные спецслужбы активизируют своё сотрудничество."
 CHI_war_footing_central_asia: "Central Asian War Footing"
 CHI_war_footing_central_asia_desc: "Национальное производство, ориентированное на обеспечение непрерывных операций к западу от Памира."
 CHI_water_shortage: "Water Shortages"
 CHI_water_shortage_desc: "На Северо-Китайской равнине, в бассейне реки Хуанхэ и в коридоре Пекин-Тяньцзинь-Хэбэй сосредоточено примерно половина пахотных земель страны, но менее пятой части её запасов пресной воды. Показатель доступности воды на душу населения на севере значительно ниже международного порога дефицита, составляющего 1 000 кубических метров в год. Промышленные сбросы и сельскохозяйственные стоки загрязнили значительную часть доступных поверхностных и подземных вод, усугубляя физический дефицит. На долю сельского хозяйства приходится более 60 процентов общего водопотребления, а потребности энергетического сектора в охлаждении создают дополнительную нагрузку на и без того истощённую ресурсную базу."
 CHI_wenchuan_reconstruction_drive_idea: "Wenchuan Reconstruction Drive"
 CHI_wenchuan_reconstruction_drive_idea_desc: "В течение нескольких дней после землетрясения мы направили в зону бедствия более 100 000 военнослужащих и спасателей, а затем приняли план восстановления на сумму 1 триллион юаней. Масштаб этих мер привел к устойчивому росту строительной активности во всей провинции Сычуань и прилегающих регионах."
 CHI_western_hemisphere_protector: "Protector of the Emerging Americas"
 CHI_western_hemisphere_protector_desc: "Мы позиционируем себя в качестве альтернативного гаранта безопасности для латиноамериканских стран, стремящихся выйти из орбиты Вашингтона. Влияние распространяется беспрепятственно, а разведывательные сети защищены от противодействия со стороны Запада."
 CHI_western_institutional_engagement_idea: "Western Institutional Engagement"
 CHI_western_institutional_engagement_idea_desc: "Активное участие в управлении МВФ, Всемирным банком и ВТО способствует укреплению международного авторитета и расширению доступа к мировым финансовым рынкам."
 CHI_wto_implementation_idea: "WTO Implementation"
 CHI_wto_implementation_idea_desc: "Многолетнее снижение тарифов, либерализация сектора услуг и приведение законодательства в соответствие с международными торговыми правилами способствуют углублению нашей интеграции в глобальные цепочки поставок и укреплению наших позиций в отношениях с торговыми партнерами."
 CHI_xinjiang_crackdown_idea: "Xinjiang Security Operation"
 CHI_xinjiang_crackdown_idea_desc: "По всему Синьцзяну проводится широкомасштабная операция по обеспечению безопасности. Сопротивление подавлено, но это сказывается на внутренней стабильности."
 chinese_african_century: "Chinese-African Century"
 chinese_african_century_desc: "Благодаря инвестициям в рамках ФОКАК, осуществлявшимся на протяжении десятилетий, Китай стал незаменимым партнером африканского континента, что привело к изменениям в демографической ситуации, торговых потоках и политической ориентации."
 chinese_surveillance_systems: "Chinese Surveillance Systems"
 chinese_surveillance_systems_desc: "Импортированные платформы «безопасного города», камеры с функцией распознавания лиц и инструменты цифровой идентификации укрепляют позиции режима в борьбе с инакомыслием и операциями иностранных спецслужб."
 eurasian_land_bridge: "Eurasian Land Bridge"
 eurasian_land_bridge_desc: "Непрерывный железнодорожный и трубопроводный коридор соединяет Тихий океан с Атлантическим, а китайские стандарты, ширина колеи и таможенные процедуры задают ритм наземной торговли."
 JAP_abandoned_by_ally: "Abandoned by Washington"
 JAP_abandoned_by_ally_desc: "Когда настал решающий момент, американцы заняли выжидательную позицию. Альянс сохранился на бумаге, но доверие утрачено, и каждая фракция в парламенте делает свои выводы."
 JAP_china_engagement: "Engagement with China"
 JAP_china_engagement_desc: "Токио сделало ставку на открытое политическое взаимодействие с Пекином, снизив уровень стратегической напряжённости ценой потери авторитета в глазах националистов."
 JAP_export_pain: "Export Pain"
 JAP_export_pain_desc: "В результате продолжительного бойкота со стороны китайских потребителей японские экспортные отрасли вынуждены в спешке искать альтернативные рынки сбыта."
 JAP_jcg_emergency_deployment: "JCG Emergency Deployment"
 JAP_jcg_emergency_deployment_desc: "Береговая охрана Японии находится в режиме постоянной боевой готовности в Восточно-Китайском море, что создает значительную нагрузку на промышленность, вынуждая её обеспечивать нахождение катеров в море."
 JAP_rare_earth_diversification: "Rare Earth Diversification Drive"
 JAP_rare_earth_diversification_desc: "Чрезвычайная программа по закупке редкоземельных элементов из Австралии, Вьетнама и путём переработки отходов внутри страны. В краткосрочной перспективе это будет сопряжено с трудностями."
 JAP_revisionist_pride: "Revisionist Pride"
 JAP_revisionist_pride_desc: "Публичное неприятие иностранной критики в отношении сохранения памяти о войне укрепляет националистические настроения внутри страны."
 JAP_sino_japanese_understanding: "Sino-Japanese Understanding"
 JAP_sino_japanese_understanding_desc: "Токийское коммюнике закрепило на институциональном уровне проведение регулярных консультаций и предоставление торговых преференций Пекину."
 JAP_strategic_autonomy_drift: "Strategic Autonomy Drift"
 JAP_strategic_autonomy_drift_desc: "После того как формат «Четвёрки» был переквалифицирован в формат диалога, Япония незаметно переориентирует свои союзнические отношения, отдаляясь от Вашингтона."
 NKO_pro_beijing_regime: "Pro-Beijing Regime"
 NKO_pro_beijing_regime_desc: "Новое правительство в Пхеньяне обязано своим существованием Пекину. В каждом министерстве работают китайские советники; каждый грузовик ездит на китайском топливе."
 pax_sinica: "Pax Sinica"
 pax_sinica_consensus: "Community of Shared Future"
 pax_sinica_consensus_desc: "Мы достигли глобального лидерства благодаря десятилетиям терпеливых инвестиций, льготного финансирования и институциональной дипломатии. Международный порядок признает нашу ключевую роль не посредством принуждения, а на основе взаимных интересов: это мир, связанный с нами узами взаимной выгоды, а не стратегической необходимости."
 pax_sinica_desc: "Мы находимся на вершине глобального порядка, который мы сформировали по своим собственным правилам, а инициатива «Пояс и путь» служит связующим звеном новой международной системы."
 petroyuan_settlement: "Petroyuan Settlement Network"
 petroyuan_settlement_desc: "Трансграничные энергетические контракты всё чаще рассчитываются в юанях, что избавляет нашу отрасль от узких мест, связанных с клирингом в долларах, и ускоряет темпы строительства внутри страны."
 rmb_reserve_currency: "Renminbi as Reserve Currency"
 rmb_reserve_currency_desc: "Юань вошел в корзину мировых резервных валют, что открыло экспортные рынки и обеспечило нашим банкам устойчивость, необходимую для предоставления кредитов на поддержку восстановления мировой экономики."
 SCO_air_defense_initiator: "SCO Joint Air Defense (Lead)"
 SCO_air_defense_initiator_desc: "Являясь ведущей страной в рамках Объединенной системы противовоздушной обороны ШОС, эта страна координирует комплексные меры по воздушному наблюдению и противоракетной обороне на территории всех государств-членов."
 SCO_air_defense_member: "SCO Joint Air Defense"
 SCO_air_defense_member_desc: "Участие в объединенной системе противовоздушной обороны ШОС обеспечивает доступ к совместному радиолокационному покрытию и координации действий по противовоздушной обороне."
 SCO_cultural_exchange_bonus: "SCO Cultural Exchange"
 SCO_cultural_exchange_bonus_desc: "Программа академического и культурного обмена способствует развитию трансграничного научного сотрудничества."
 SCO_dev_bank_initiator: "SCO Development Bank (Founder)"
 SCO_dev_bank_initiator_desc: "Являясь учредителем Банка развития ШОС, эта страна направляет инвестиционные потоки и имеет привилегированный доступ к финансированию под низкие проценты."
 SCO_dev_bank_member: "SCO Development Bank"
 SCO_dev_bank_member_desc: "Членство в Банке развития ШОС открывает доступ к кредитам на развитие и совместным инвестиционным программам."
 SCO_development_assistance: "SCO Development Assistance"
 SCO_development_assistance_2: "[CHI.GetAdjective] Development Assistance"
 SCO_development_assistance_2_desc: "В рамках Шанхайской организации сотрудничества мы получили от Китая столь необходимую помощь в целях развития."
 SCO_development_assistance_desc: "Шанхайская организация сотрудничества направляет ресурсы на развитие этой страны."
 SCO_energy_deal_income: "SCO Energy Partnership"
 SCO_energy_deal_income_desc: "Долгосрочный договор на поставку энергии обеспечивает стабильный доход."
 SCO_energy_grid_initiator: "SCO Energy Grid (Initiator)"
 SCO_energy_grid_initiator_desc: "Являясь инициатором создания «Энергетической сети ШОС», эта страна возглавляет работу по созданию интегрированной энергосистемы, охватывающей государства-члены."
 SCO_energy_grid_member: "SCO Energy Grid"
 SCO_energy_grid_member_desc: "Участие в энергетической сети ШОС обеспечивает доступ к общей энергетической инфраструктуре и снижение затрат на электроэнергию."
 SCO_intel_sharing_bonus: "SCO Intelligence Sharing"
 SCO_intel_sharing_bonus_desc: "Безопасный канал обмена разведывательной информацией способствует улучшению координации в сфере борьбы с терроризмом."
 SCO_joint_drill: "SCO Joint Military Exercises"
 SCO_joint_drill_1: "SCO Joint Exercises (Bilateral)"
 SCO_joint_drill_1_desc: "Двусторонние военные учения с одним из партнеров по ШОС способствуют совершенствованию тактической слаженности."
 SCO_joint_drill_desc: "Участие в общеорганизационных совместных военных учениях ШОС способствует повышению боеготовности."
 SCO_joint_drill_specific: "SCO Joint Exercises (Targeted)"
 SCO_joint_drill_specific_desc: "Целевые совместные учения с партнером по ШОС направлены на устранение конкретных оперативных пробелов."
 SCO_railway_initiator: "Trans-Eurasian Railway (Initiator)"
 SCO_railway_initiator_desc: "Являясь движущей силой Трансевразийской железной дороги, эта страна пользуется преимуществами привилегированного доступа к торговому коридору, охватывающему весь континент."
 SCO_railway_member: "Trans-Eurasian Railway"
 SCO_railway_member_desc: "Трансевразийская железная дорога связывает эту страну с высокопропускной торговой сетью, охватывающей всю зону ШОС."
 SCO_trade_agreement_bonus: "SCO Trade Agreement"
 SCO_trade_agreement_bonus_desc: "Механизм двусторонней торговли в рамках ШОС способствует росту объемов производства в гражданской промышленности."
 CHI_airforce_modifier: "People's Liberation Army Air Force"
 CHI_airforce_modifier_desc: "Военно-воздушные силы Народно-освободительной армии, в состав которых входят истребители, бомбардировщики, транспортные самолеты и комплексная система противовоздушной обороны. Здесь представлены их доктрина, система подготовки и вооружение."
 CHI_belt_and_road_initiative_idea: "Belt and Road Initiative"
 CHI_belt_and_road_initiative_idea_desc: "Китайская инициатива «Пояс и путь», запущенная в 2013 году, обеспечивает финансирование строительства портов, железнодорожных коридоров, трубопроводов, электростанций и цифровой инфраструктуры в Азии, Африке, на Ближнем Востоке и в Европе. Страны, отвечающие критериям, подают заявки на проекты, Пекин финансирует и реализует их, а каждый завершённый проект повышает рейтинг партнёра и укрепляет позиции самого Китая.\n\n[CHIGetBRIPortTier][CHIGetBRIRailwayTier][CHIGetBRIPipelineTier][CHIGetBRITelecomTier][CHIGetBRIMineTier][CHIGetBRIPowerplantTier][CHIGetBRIIndustrialZoneTier][CHIGetBRIPrestigeTier]"
 CHI_bri_state_industrial: "BRI Industrial Project"
 CHI_bri_state_industrial_desc: "Специальная экономическая зона или промышленный парк, созданный при поддержке Китая, способствовал расширению производственных мощностей местных предприятий, добычи полезных ископаемых и развития ремонтной инфраструктуры."
 CHI_bri_state_infrastructure: "BRI Infrastructure Project"
 CHI_bri_state_infrastructure_desc: "Инфраструктурный проект в рамках инициативы «Пояс и путь» (порт, железная дорога, автомагистраль или трубопровод) способствует ускорению темпов строительства в регионе, ведению работ на верфях и увеличению объёмов грузооборота."
 CHI_coast_guard_standoff: "Coast Guard Standoff"
 CHI_coast_guard_standoff_desc: "Ежедневные столкновения между китайскими ополченцами и японской береговой охраной негативно сказываются на местной экономической деятельности."
 CHI_defense_industry: "Chinese Defense Industry"
 CHI_defense_industry_desc: "Оборонная промышленная база Китая построена на основе крупных государственных концернов, охватывающих производство наземной, авиационной, военно-морской и электронной техники, которые снабжают как вооружённые силы, так и экспортный рынок. Это и составляет военно-промышленный потенциал страны."
 CHI_diplomacy_modifier: "Chinese Diplomatic Network"
 CHI_diplomacy_modifier_desc: "В зависимости от масштабов инвестиций в дипломатическую сеть Китая изменчивая дипломатическая позиция предоставляет или отменяет бонусы к ежемесячному росту популярности, торговым отношениям, морскому присутствию, эффективности снабжения, операциям по оказанию влияния за рубежом и политической мощи."
 CHI_economy_modifier: "Chinese Economic Model"
 CHI_economy_modifier_desc: "В Китае действует социалистическая рыночная экономика, сочетающая в себе государственные предприятия, частный сектор и централизованное планирование в рамках последовательных пятилетних планов. Это определяет промышленную базу страны, ее фискальную политику и структуру внешней торговли."
 CHI_jap_industrial_partnerships: "Sino-Japanese Industrial Partnerships"
 CHI_jap_industrial_partnerships_desc: "Структурированное экономическое сотрудничество с Японией расширяет доступ к высокоточному производству, передовым цепочкам поставок в автомобильной и электронной отраслях, а также к ноу-хау в области гражданской атомной энергетики. Это партнерство приносит выгоды в таких сферах, как боевые характеристики бронетехники, маневренность военно-воздушных сил, скорость военно-морского флота, эффективность научных исследований и объем промышленного производства, хотя в связи с исторической враждой оно является чувствительным вопросом во внутренней политике."
 CHI_korea_peninsula_modifier: "Korean Peninsula Strategy"
 CHI_korea_peninsula_modifier_desc: "Китай имеет общую сухопутную границу с Корейским полуостровом и поддерживает политические, экономические и разведывательные связи во всем регионе. Это отражает подход Пекина к управлению отношениями, обеспечению безопасности границ и развитию информационных сетей на его северо-восточном фланге."
 CHI_landforce_modifier: "People's Liberation Army Ground Force"
 CHI_landforce_modifier_desc: "Сухопутные войска Народно-освободительной армии, организованные в общевойсковые бригады в рамках системы театра военных действий. Здесь представлены их доктрина, подготовка и вооружение."
 CHI_navy_modifier: "People's Liberation Army Navy"
 CHI_navy_modifier_desc: "Военно-морские силы Народно-освободительной армии, включающие надводные корабли, подводные лодки, авианосцы и морскую пехоту. Здесь представлены состав флота, доктрина и сфера оперативной деятельности."
 CHI_northeast_revitalisation: "Northeast Revitalisation"
 CHI_northeast_revitalisation_desc: "Стратегия «Возрождение Северо-Востока» предусматривает направление государственного капитала в провинции «ржавого пояса» — Ляонин, Цзилинь и Хэйлунцзян — с уделением приоритетного внимания тяжелой промышленности, энергетической инфраструктуре и строительству промышленных комплексов. Проводится модернизация объектов советской эпохи и вводятся в эксплуатацию новые производственные мощности с целью восстановления роли региона как промышленной базы."
 CHI_political_system: "Chinese Political System"
 CHI_political_system_desc: "Китайская Народная Республика — однопартийное государство, возглавляемое Коммунистической партией Китая, построенное на принципах демократического централизма и опирающееся на разветвленную административную бюрократию. Это определяет структуру государственного управления, партийные институты и механизмы государственного контроля."
 CHI_rare_earth_embargoed: "Rare Earth Embargo"
 CHI_rare_earth_embargoed_desc: "Пекин сократил экспорт важнейших редкоземельных металлов в Японию, что привело к снижению объемов промышленного производства."
 CHI_rare_earth_embargoed_idea: "Rare Earth Embargo"
 CHI_rare_earth_embargoed_idea_desc: "Пекин сократил экспорт важнейших редкоземельных металлов, что нанесло удар по оборонной и высокотехнологичной отраслям, которые зависят от китайской переработки."
 CHI_rural_development: "Rural Development Programme"
 CHI_rural_development_desc: "Целевые инвестиции в инфраструктуру сельских районов, включая дороги, коммунальные услуги и укрепление потенциала местных органов власти, способствуют активизации строительной деятельности в определённых округах. Программа сокращает разрыв в доходах между городом и селом и снижает социальную напряжённость, вызванную неравномерной модернизацией."
 JAP_china_market_partnerships: "China Market Partnerships"
 JAP_china_market_partnerships_desc: "Глубокая интеграция с китайским потребительским и промышленным рынками повышает эффективность работы японских предприятий, стабилизирует цены на потребительские товары и способствует укреплению политического единства внутри страны. Расширяются производственные мощности в сфере гражданской инфраструктуры, а объемы двусторонней торговли продолжают расти, несмотря на то что геополитические трения в других регионах создают препятствия."
