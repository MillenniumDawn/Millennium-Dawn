 AST_the_lucky_country: "幸运之国"
 AST_the_lucky_country_desc: "自从唐纳德·霍恩在1964年提出这句谚语以来，大多数澳大利亚人误解了它的含义，认为它形容了澳大利亚在采矿业取得的巨大成功。诚然，我们拥有广袤的土地，蕴藏着丰富的稀有矿藏，但唐纳德用这句谚语讽刺当时的领导人过度投资于采矿业，而忽视了其他经济机遇。简而言之：我们的经济多元化程度不够。这导致澳大利亚如今只剩下几家科技或制造工厂勉强维持着其经济地位，否则就将沦为彻头彻尾的资源型国家。我们完全依赖出口，要么接受现状，要么就应该开始剥离相关产业。"
 AST_fuel_the_mining_boom: "推动采矿业繁荣"
 AST_fuel_the_mining_boom_desc: "自澳大利亚成为殖民地以来，采矿业一直是其经济的支柱产业。从淘金热到今天，采矿业一直推动着澳大利亚经济的持续发展和扩张。而这一切又消耗了数不清的汽油，用于运输矿石。如果中东局势进一步恶化，我们的经济可能会陷入停滞。在进一步扩张之前，我们需要确保国内战略储备的安全，并做好应对不时之需的准备。"
 AST_acis_scheme: "汽车竞争力与投资计划"
 AST_acis_scheme_desc: "汽车竞争力与投资计划旨在为我国汽车产业提供关税减免和资金支持，以促进投资、研发。与周边国家相比，我国汽车产业一直处于劣势，因此，扶持本土企业无疑是一项受欢迎的举措。"
 AST_a_sea_of_panels: "太阳能面板的海洋"
 AST_a_sea_of_panels_desc: "我们乡村的太阳能发电厂蔚为壮观。它们宛如一件圆形艺术品，吸收着通常只会让游客晒伤的阳光。我们目前的可再生能源和化石燃料比例略显不足，而扩大现有太阳能发电阵列将有助于平衡这一局面。"
 AST_commit_to_renewables: "致力于可再生能源"
 AST_commit_to_renewables_desc: "我们的能源生产未来不应受制于煤炭或天然气的供应。近年来，可再生能源技术的发展速度惊人，现在正是我们充分利用这一优势的时候。"
 AST_harness_the_wind: "驾驭风"
 AST_harness_the_wind_desc: "在希腊神话中，埃俄罗斯是宙斯委派来控制风的神，只有在接到命令时才会释放可怕的风暴。虽然我们无法控制风，但多亏了科学家们，我们可以利用风的力量。在最需要的地方安装更多的风力涡轮机，就能为我们提供优质、清洁且数量可观的能源。"
 AST_rewire_the_nation: "重塑国家"
 AST_rewire_the_nation_desc: "在这个国家，我们发现很少有问题可以通过砸钱来解决，而电力问题就是其中之一。工程师们已经召开了委员会会议并制定了计划，现在我们准备在全国范围内推广电网升级改造，使其现代化以满足我们当前的电力容量需求。"
 AST_fix_the_potholes: "修补路面坑洼"
 AST_fix_the_potholes_desc: "在这个国家，开车最大的祸害始终是路上的坑洼。随便问问哪个司机，无论是在城市还是乡村，他们都会跟你讲修车、差点出车祸以及其他种种惊险经历。保护公民安全是政府的责任，而消除这种祸害则是我们每个人的责任。"
 AST_north_west_shelf_expansion: "西北大陆架扩张"
 AST_north_west_shelf_expansion_desc: "西北陆架天然气处理厂是我们半岛上运营时间最长、最成功的天然气处理厂之一，处理了我们绝大部分的油气资源。目前的方案建议将该项目的运营期限延长至2070年，从而在此之前为我们提供急需的加工能力。"
 AST_its_just_coal: "这只是煤炭！"
 AST_its_just_coal_desc: "有些人反对我们的扩张，他们可能对化石燃料感到恐惧。我们想对他们说：别害怕，别惊慌，它不会伤害你们。它只是煤炭。对澳大利亚人来说，开采煤炭几乎已经融入了我们的血液。我们珍视这种黑色、尘土飞扬的矿石，它为我们的家园提供燃料。可再生能源或许是新兴事物，但煤炭将永远存在，继续燃烧。"
 AST_high_speed_focus_ast: "高速铁路"
 AST_high_speed_focus_ast_desc: "自上世纪80年代以来，高铁的“诅咒”就一直困扰着我们各州。每当联邦政府启动时速超过200公里的高铁建设项目时，项目总是止步于规划阶段。但这次不一样了。我们现在要介入，而且一定会成功。我们拥有技术和路线：布里斯班、悉尼和墨尔本。没有什么能阻挡我们。"
 AST_dig_deep: "深入挖掘"
 AST_dig_deep_desc: "近年来，我们偏远矿区的氧化铝提炼工艺取得了一系列突破。如果我们直接施压，加快采矿权审批流程，他们就能更快、更深地开展钻探工作。"
 AST_lng_megaprojects: "液化天然气大型项目"
 AST_lng_megaprojects_desc: "我们的液化天然气设施是我们向其他国家输送天然气的先进方式之一，它极大地节省了我们的运输成本。该工艺将天然气冷却至极低温度使其液化，从而将天然气体积缩小600%。与相关公司合作扩建这些设施，并在一定程度上分担建设成本，将使这些设施更快投入运营。"
 AST_the_boom_never_ends: "繁荣永无止境"
 AST_the_boom_never_ends_desc: "有时候运气好，有时候就只能接受澳大利亚的现状。这里的采矿业蓬勃发展，我们希望这种繁荣势头能够持续下去。投资、刺激措施，应有尽有。只要获得我们的批准，我们的企业就会继续钻探，而我们只需要坐享其成。"
 AST_treat_the_farmers: "善待农民"
 AST_treat_the_farmers_desc: "这个国家的农民是出了名的勤劳。一天下来，他们的双手沾满泥土，只为了让我们能戴上钻戒。至少我是这么听说的。总之，我们应该奖励他们的辛勤劳动。给他们点儿甜头吧。"
 AST_enjoy_the_prosperity: "享受繁荣"
 AST_enjoy_the_prosperity_desc: "当你询问专家时，他们一致认为我们的采矿业前景光明。目前，出口正以前所未有的速度推动着国家发展，而我们理应享受由此带来的丰厚回报。我们可以趁热打铁，大力投资基础设施建设，以支持未来的采矿活动和燃料生产，确保我们能从这波繁荣中获益匪浅。"
 AST_heavy_industry_projects: "重工业项目"
 AST_heavy_industry_projects_desc: "我们国有建筑公司一直辛勤耕耘，建设着这个美好的国家，但对更大产能的需求显而易见。扩建计划的实施虽然耗资不菲，但步骤清晰明了。世界将会看到我们注定要成为的澳大利亚。"
 AST_urban_expansion_initiative: "城市扩张计划"
 AST_urban_expansion_initiative_desc: "没有土地我们就无法建设，这份提案旨在让我们绕过许多通常的土地征用程序，一些抗议者称之为“征用”，但这并非事实。土地款项当然会支付，流程只是会更快一些。"
 AST_defy_the_mantra: "违背这句箴言"
 AST_defy_the_mantra_desc: "我们不会再受制于某个绰号。澳大利亚要么发展，要么消亡。即便矿藏枯竭或下一次经济灾难来临，我们的经济依然会屹立不倒，因为我们投资于它的未来。通过拓展多元化的经济领域，我们可以实现国内生产的多元化。我们不会成为一个依赖资源的富国，而是一个充满活力的国家。"
 AST_global_weapons_manufacturing: "全球武器制造"
 AST_global_weapons_manufacturing_desc: "除了私下达成的协议外，澳​​大利亚从未以全球武器供应国的身份为人所知。如果多元化发展势在必行，那么提高产量，并在此过程中有可能向其他国家供应武器，或许能使这项投资物有所值。"
 AST_overseas_opportunities: "海外机遇"
 AST_overseas_opportunities_desc: "许多大型化石燃料公司已经在海外积极开展业务，只要有机会就会去那里。如果我们放宽现行法规，并辅以一些激励措施，就可以鼓励这种业务扩张。"
 AST_the_white_paper: "白皮书"
 AST_the_white_paper_desc: "我们的高级官员建议我们首先设定一个目标来奠定基调，以此作为重组的开端。我们有一些方法可以推动改革，但最终取决于我们认为军队在哪个领域最需要改进。武器生产始终是我们必须考虑的因素。设定生产目标可以加快战备速度。兵力数量是另一个可以通过加快训练配额来解决的问题。最后，我们可以将部分负担转移到国防工业。提前一些项目的交付时间应该足以激励他们。"
 AST_hardening_our_units: "加强我们的部队"
 AST_hardening_our_units_desc: "在海湾战争及之后的其他军事行动中，非对称威胁已成为一种新型且令人恐惧的战争形式，我们必须应对。有时，更强大的火力也无济于事。对于少数不幸遭遇此类新型袭击（尤其是简易爆炸装置袭击）的人来说，幸存者之所以能够幸存，是因为他们的车辆经受住了考验。增强我们的防御能力，或许正是我们的部队能够生存下来并继续作战的关键所在。"
 AST_a_networked_army: "网络化军队"
 AST_a_networked_army_desc: "迄今为止，数字化格局对我们的各行各业来说都是一个奇迹。同样，通过将陆军转型为数字化互联的“传感器到射手”部队，可以加快决策速度，并与指挥部即时沟通。我们的联合部队将比以往任何时候都更加团结，作战行动可以直接由指挥部管理，从而确保在正确的时间做出正确的决策。"
 AST_diisr_ast: "创新、工业、科学与研究部"
 AST_diisr_ast_desc: "由于种种原因，我们没有一个统一的、由政府主导的研究机构。我们确实有不少私营研究机构，甚至有些是州级牵头的研究机构，但要满足我们所需的科研设施，还需要一个规模更大的机构。创新、产业、科学与研究部的筹建计划已经提交到我们这里，目前只待审批通过。"
 AST_rnd_tax_incentive: "研发税收优惠"
 AST_rnd_tax_incentive_desc: "现在，创新、工业、科学与研究部已经投入运营，将一部分资金用于研发，并提供多项补贴来启动项目，确保我们始终处于创新的最前沿。"
 AST_our_beloved_bushmaster: "我们挚爱的丛林之王"
 AST_our_beloved_bushmaster_desc: "“大毒蛇”步枪一直是我军的标志性装备，凭借其多功能性、独特设计和强大的实战能力，赢得了众多军事专家的青睐。它们在海外战场上表现出色，因此，增加产量应该成为当务之急。值得庆幸的是，这一要求已包含在白皮书中。"
 AST_the_special_forces: "勇者必胜"
 AST_the_special_forces_desc: "澳大利亚特种空勤团已经成为许多人的骄傲，这是有充分理由的。这支精锐团最初是仿照英国部队建造的，在敏感的海外行动中派上了用场。让他们配备我们拥有的最好的技术，确保他们继续取得成功。"
 AST_lessons_from_the_middle_east_ast: "来自中东的教训"
 AST_lessons_from_the_middle_east_ast_desc: "我们从在中东的多次行动中吸取了很多经验教训。其中最显著的一点是，我们的制服与该地区常见的尘土飞扬的天气并不相符。虽然这些制服是为澳大利亚的炎热气候设计的，但仍有改进的空间。"
 AST_remembering_the_anzacs: "缅怀澳新军团"
 AST_remembering_the_anzacs_desc: "我们的澳新军团日纪念仪式始终缅怀“在所有战争、冲突和维和行动中服役并牺牲的人员”。这不仅包括在第一次世界大战中牺牲的将士，也包括在海湾战争和印尼战争等近期冲突中牺牲的将士。我们从中汲取的教训是，保障部队安全是神圣的职责。如今，战争形势瞬息万变，我们也必须随之改变和创新，才能最大限度地提升部队在战场上的胜算。否则，我们将在下一次纪念仪式上缅怀他们。"
 AST_never_another_darwin: "达尔文没有下一次"
 AST_never_another_darwin_desc: "1942年2月19日，约188架日军飞机对达尔文发动了轰炸。除了军事设施遭到破坏外，人员和平民的伤亡也极其惨重，是战争期间针对我方单次袭击中损失最惨重的一次。战争规则虽已改变，但教训却始终未变。"
 AST_new_tools: "新工具"
 AST_new_tools_desc: "如果说21世纪教会了我们什么，那就是自满会害死人。当然，我们可以继续使用同样的步枪，沿用同样的作战理论，但我们的敌人不会。大西洋和太平洋两岸的创新已经研发出更精良的武器，能够应对更广泛的环境和威胁类型。这是我们绝不能忽视的。"
 AST_old_reliable: "老可靠"
 AST_old_reliable_desc: "冷战时期我们就曾考虑过国外产品，最终选择了奥地利。斯太尔的AUG步枪堪称完美之作。这是一款线条流畅、设计优雅的步枪，我们的制造商此后数十年一直在不断完善。既然已经如此出色，何必改变呢？我们完全可以投资扩大现有产能，确保能够应对任何突发需求。"
 AST_lithgow_arms: "利斯戈武器厂"
 AST_lithgow_arms_desc: "自1912年以来，利思戈武器厂一直是我们实力和韧性的象征。它在一战和二战期间忠实地为我们服务，并在此期间为我们生产了超过一百万支步枪。正因如此，它如今的凄凉景象才令人痛心。必须采取行动。"
 AST_grow_our_command: "壮大我们的指挥部"
 AST_grow_our_command_desc: "其中一份白皮书提到的举措已经完成。成立特种作战司令部旨在将我们的特种部队与突击队联合起来。鉴于恐怖主义威胁日益加剧，以及我们面临的诸多挑战，我们的特种部队亟需各方援助。整合力量或许能打造一支我们能够有效运用的联合进攻力量。"
 AST_the_second_white_paper: "第二份白皮书"
 AST_the_second_white_paper_desc: "鉴于2000年白皮书取得了大致成功，政府又给我们下达了一条与之前类似的指令：继续扩张，并在技术实力上保持优势，使我们在同等规模下与行业巨头并驾齐驱。我们以前就做到过，这次也一定能做到。"
 AST_strategic_reform: "战略改革"
 AST_strategic_reform_desc: "我们各部门目前的状况远远不够。对我们现有的战略力量进行彻底改革，将减少过去几十年积累的一些低效之处，并使我们能够发展成为一支更加灵活、反应迅速的部队，以应对太平洋地区不断变化的局势。"
 AST_incorporate_the_peacekeeping_training_ast: "纳入维和训练"
 AST_incorporate_the_peacekeeping_training_ast_desc: "自二战结束以来，澳大利亚一直参与联合国维和行动，提供人员和资源。几十年来，尤其是在最近对东帝汶的干预行动中，我们积累了许多战争经验，这些经验可以更好地融入我们自身的军事理论，从而确保我们的部队即使在最不可能的环境中也能得到保护。"
 AST_recruitment_campaigns: "征兵活动"
 AST_recruitment_campaigns_desc: "自从那张“你愿意来吗？”的海报问世以来，我们就一直很擅长招募活动。随着互联网的发展，我们迎来了全新的机遇。我们可以利用网络平台投放大量广告，触达那些不太喜欢看电视的人群。"
 AST_land_one_two_one: "陆上121"
 AST_land_one_two_one_desc: "该项目旨在持续替换我们许多老旧、防护不足的中型和重型卡车，采用莱茵金属公司改进型设计，以提升车辆的后勤保障能力和机动性，同时增强装甲防护性能。目前，该项目进展顺利，接下来我们将升级防空车辆和近距离支援车辆。"
 AST_stop_panicking: "别惊慌"
 AST_stop_panicking_desc: "大家都要冷静下来。我们是政府，我们控制不了经济。如果情况哪怕只是一瞬间恶化，所有人都会指责我们。更糟糕的是，他们开始恐慌。给几乎所有人提供刺激措施应该能让我们暂时平静下来，直到我们能控制住局面。"
 AST_guarantee_the_banks: "为银行提供担保"
 AST_guarantee_the_banks_desc: "如果银行感到恐慌，我们会确保它们盈利。我们会不惜一切代价维持它们的运转，甚至会担保所有银行存款。在这个国家，没有一家银行会倒闭，我们会推出足够的财政刺激措施，仅靠政府支出就能保证GDP持续增长。"
 AST_grab_the_securities: "抓住证券"
 AST_grab_the_securities_desc: "这一切的根源在于美国的房地产市场，而澳大利亚成千上万的房主都在担心同样的事情是否会发生在自己身上。我们可以通过购买抵押贷款支持证券来支撑住房金融，从而安抚公众，确保住房市场不会崩溃。"
 AST_turn_things_around: "扭转乾坤"
 AST_turn_things_around_desc: "国家建设和就业计划已成为我们迄今为止推出的规模最大的经济刺激方案。它涵盖学校基础设施、社会住房、房屋建设、税收减免、铁路项目以及数不胜数的刺激性补贴。我们对全国的支持力度空前高涨，这表明我们决心让一切重回正轨，也能让大家安心。"
 AST_the_royal_australian_navy: "澳大利亚皇家海军"
 AST_the_royal_australian_navy_desc: "我们引以为傲的皇家澳大利亚海军在近海巡逻。澳大利亚是岛国，这一点显而易见。几个世纪以来，任何入侵势力想要抵达我们的海岸，都必须依靠舰队，而我们曾经也受到英国皇家海军的保护。当然，现在我们可能会遭到洲际导弹的袭击，而且无需登陆就能造成更大的破坏，但这并非重点。为了纪念他们曾经扮演的角色，也为了履行同样重要的职责，我们把我们的海军命名为“皇家海军”，并像他们过去那样，派遣他们守护海洋的安全，保卫我们光荣的祖国。"
 AST_embrace_the_support_role: "欣然接受支援角色"
 AST_embrace_the_support_role_desc: "接受支援角色 - 我们在太平洋的实际处境是权宜之计。单凭我们自身，单打独斗，我们根本无法与中国或俄罗斯舰队抗衡。我们会奋力抵抗，但赢得战争的唯一途径是依靠盟友。我们一直以来都扮演着辅助美国的角色，而到目前为止，这种角色也无妨。我们只需坚持到他们到来，​​然后我们就能取得胜利。扮演支援角色并不丢人，尤其是在我们出色地完成这项任务时。"
 AST_we_are_the_pacific: "我们就是太平洋"
 AST_we_are_the_pacific_desc: "时代变了。苏联已不复存在，中国也尚未成为其继承者。事实上，海战爆发的可能性微乎其微。即便爆发，我们恐怕也难以招架。但以我们目前的海军实力，我们绝不会束手无策。如果我们致力于扩充海军，就能打造一支令世人敬畏的力量。只要我们运用一切可用资源，我国的角色或许并非一成不变。"
 AST_trade_support: "贸易支持"
 AST_trade_support_desc: "保护我们与重要伙伴之间的贸易是我们至关重要的职责之一。确保货物流通不受中国等海上竞争对手的拦截，才能保证我们与中国等最大进口国的贸易持续繁荣发展。"
 AST_multidimensional_warfare: "多域作战"
 AST_multidimensional_warfare_desc: "通过整合陆、海、空、天和网络空间的军事力量，我们在对抗那些在这些领域有所欠缺的敌人时，拥有显著优势。空军和海军都需要在这方面开展合作。"
 AST_whetstone_training: "惠特斯通训练"
 AST_whetstone_training_desc: "就像一把闲置的宝剑，如果我们的海军不不断接受考验和磨练，就会生锈。海上作战演习将会彻底磨练我们的学员和水兵，让他们达到最佳状态，我发誓。他们将随时准备应对任何战斗，因为这就是他们的职责，他们必将为我们赢得荣耀。"
 AST_wide_scanning: "宽幅扫描"
 AST_wide_scanning_desc: "金达利作战雷达网已完成原型阶段，进入第五阶段实施，这意味着它很可能是目前最先进的雷达技术，监测距离超过3000公里。发明这项技术并不难，难的是如何将其部署到我们的舰艇上。"
 AST_an_outside_review: "外部评估"
 AST_an_outside_review_desc: "为了评估我们的能力，我们委托进行了一次外部评估。评估结果对我们的生产能力提出了颇为令人震惊的批评，如果我们想要建立一支强大的海军，就必须彻底改变这种现状。"
 AST_the_middle_ships: "中型舰艇"
 AST_the_middle_ships_desc: "为了研发霍巴特级驱逐舰，我们付出了无数心血。它们将取代上世纪60年代的珀斯级驱逐舰，旨在恢复我们的导弹防御能力，或许是我们迄今为止最重要的全面升级。"
 AST_screening_role: "屏卫角色"
 AST_screening_role_desc: "如果我们支持太平洋地区的盟友，我们就必须成为他们的耳目。我们能够先人一步发现威胁，这不仅对他们具有战术优势，还能帮助我们做好准备，掌控战场局势。我们在这方面做得越好，我们的表现就越出色。"
 AST_below_the_enemy: "敌人之下"
 AST_below_the_enemy_desc: "虽然我们的一些潜艇是近期才服役的，但我们舰队的大部分潜艇都非常老旧。虽然大部分潜艇都进行了升级，但这并不能改变它们使我们在技术上处于劣势的事实，尤其是在我们最佳的作战机会在于间接作战的情况下。"
 AST_containment_theory: "遏制理论"
 AST_containment_theory_desc: "冷战期间，我们与美国一道奉行“遏制理论”，旨在阻止苏联扩张。地缘政治格局虽已改变，但在某些方面，我们的任务却未变。我们的敌人正实施着一个切实存在的扩张目标。无论他们是通过外交手段还是岛屿建设来实现扩张，如果我们无法抵制或至少遏制这种扩张，我们的主权无疑将受到威胁。持续的海军存在，加上成功的外交努力，是我们避免直接战争、走向未来的唯一途径，这意味着这是我们唯一的选择。"
 AST_the_groundwork: "基础工作"
 AST_the_groundwork_desc: "我们需要投入大量精力来搭建实现目标所需的基础设施。我们需要迅速大规模扩建现有的造船厂和部门空间，这预计会花费不少钱。"
 AST_expand_command_capabilities: "扩展指挥能力"
 AST_expand_command_capabilities_desc: "鉴于我们目标的规模，我们需要扩建海军总部和国防部来管理这项工作。在过渡期间保持两军紧密联系，同时监督生产增长，这将耗资巨大，但却是必要的。"
 AST_carrier_project: "航母计划"
 AST_carrier_project_desc: "不久前，澳大利亚还拥有自己的航空母舰。悉尼号和墨尔本号适合任何活动和真正的海上美景。随着时代的变迁，我们军费的缩减，这样的庞然大物已经不复存在了。到目前为止。航母将返回我们的舰队，我们退役舰艇的遗产将继续存在。"
 AST_like_submarines_in_a_barrel: "就像桶里的潜艇"
 AST_like_submarines_in_a_barrel_desc: "我们需要弥补航母的不足，而要做到这一点，我们就必须利用我们的直升机。MH-60R“海鹰”直升机就是实现我们机动性目标的绝佳范例。我们可以投资该项目进行设计研发，并开始生产。"
 AST_ship_to_air: "别再喂养驱逐舰了"
 AST_ship_to_air_desc: "我们的驱逐舰对导弹的需求量极大，而满足它们的唯一方法就是制造更多导弹。老旧的技术行不通，我们需要全新的技术来满足这些“怪物”。"
 AST_grants_to_contractors: "向承包商提供的补助金"
 AST_grants_to_contractors_desc: "如果他们不能始终满足我们的需求，我会认为这些公司是在占我们便宜。好在，正确的投资已经证明足够可靠，能够维持合作关系。再增加一些投资，我们或许就能看到所需的生产改进。"
 AST_adf_academies: "澳大利亚国防军学院"
 AST_adf_academies_desc: "我们首屈一指的军事训练与大学教育相结合的机构位于堪培拉。它目前只有一栋楼，但为了满足国防需求，这类机构的数量必须大幅增加。我们将在所有主要城市建造多所这样的机构，或许还会放宽一些入学要求。"
 AST_the_raaf: "澳大利亚皇家空军"
 AST_the_raaf_desc: "啊，澳大利亚皇家空军。我们主要的空中作战部门，持续守护着澳大利亚上空的安全。他们拥有澳大利亚国防军中最棒的制服、最棒的伙食，以及最酷的工作。但我们还是别过多关注这些福利了。任务已经下达，目标很简单：在太平洋地区取得制空权，并为我们的远征行动提供支持。至于如何实现这一目标，则由我们自行决定。"
 AST_fourth_generation_striking: "第四代突击"
 AST_fourth_generation_striking_desc: "获取第四代战机并非易事，我们需要充分利用自身的人脉和技术能力才能实现这一目标。第三代和第四代战机之间的差距并不算太大，但鉴于第五代战机的研发速度如此之快，我们显然不想落后。"
 AST_globemasters: "环球霸王"
 AST_globemasters_desc: "波音环球霸王III是我们执行战略空运和部队运输任务的首选货机。波音这次的表现确实不负众望。这款机型比之前的型号更大、动力更强，但你猜怎么着？我们还想要另一架。我们会把规格参数发给他们，希望结果能让他们满意。"
 AST_shadow_in_the_sky: "天空中的阴影"
 AST_shadow_in_the_sky_desc: "AAI RQ-7影子是我们目前开发的最有效的侦察单位和无人作战无人机。美国人提出的另一项绝妙技术标志着战争性质的显着变化。随着我们的移动基础设施的增加以及我们的行动范围的扩大，战斗能力实际上已经远远超出了我们以前的能力。"
 AST_the_roulettes: "轮盘"
 AST_the_roulettes_desc: "“轮盘”飞行表演队是美国空军的专属空中特技飞行队。他们曾飞遍世界各地，表演过许多惊险刺激的节目，自然赢得了所有有幸观看者的赞赏。说到底，如果他们的飞行能提升我们的声誉，那么我们当然会让他们继续飞行。"
 AST_employ_ballistic_missiles: "使用弹道导弹"
 AST_employ_ballistic_missiles_desc: "远程精确打击导弹常被用来威慑冲突。它们是游走于非对抗与全面战争之间的神奇工具。例如，如果我们的海外基地遭到袭击，我们可以采取“对等回应”，用远程导弹打击对方同样具有战略意义的目标，这样大家都能带着些许颜面扫地、不必担心战争的心情回家。理论上是这样。"
 AST_project_wedgetail: "楔尾工程"
 AST_project_wedgetail_desc: "波音E-7项目是我们近期在移动指挥中心领域开展的一项重要尝试。它凭借机顶加装的雷达，为我们提供早期预警系统，并能实时掌握战场上的位置信息。当然，我们也可以根据需要对飞机进行改装，用于其他空中任务。"
 AST_keep_them_out: "阻止他们进入"
 AST_keep_them_out_desc: "探测到敌机是一回事，真正阻止敌机扫射澳大利亚城市又是另一回事。我们的飞机不可能一直待在空中，因此便携式和固定式“国家先进地对空导弹系统”系统将取而代之。配合雷达使用，它们构成了一支令人瞩目的强大防御力量。"
 AST_preserve_the_super_hornets: "保护超级大黄蜂"
 AST_preserve_the_super_hornets_desc: "自F-111退役以来，24架F/A-18F超级大黄蜂战斗机已接替其位置，但它们自身也已机龄渐长。我们可以改进现有机型并更新一些内部系统，以协助完成过渡，确保它们能够胜任新的角色。"
 AST_masters_of_command: "指挥大师"
 AST_masters_of_command_desc: "利用直升机进行后勤保障彻底改变了我们的机动能力。由于无需机场，直升机成为高风险地区和不断变化的战场上最理想的选择。设立专门负责直升机后勤保障的机构将全面提升其作战能力。"
 AST_reopen_cockatoo_island: "重新开放科克图岛"
 AST_reopen_cockatoo_island_desc: "日益增长的船舶维修需求已经开始对我们现有的基础设施造成压力。科卡图岛船坞虽然在上世纪90年代才关闭，但如今已成为一个旅游景点，为了维修最新一代的故障船舶，它需要彻底重建。"
 AST_the_howard_government: "霍华德政府"
 AST_the_howard_government_desc: "太阳照耀着我们的国家。这里风景秀丽，土地肥沃，四面环海。澳大利亚作为太平洋地区的区域强国，地位独特；这里朋友众多，敌人寥寥。然而，澳大利亚人民渴望更美好的明天，许多人却被社会边缘化。在上届选举中，工人阶级团结在霍华德政府周围，使自由党获得了稳固的多数席位。\n\n现在，我们被赋予了谨慎改革的使命，并被期望贯彻执行。基廷政府给我们留下了一个巨大的预算缺口，尽管我们已尽力弥补，但仍需进一步扭亏为盈。抗议活动席卷街头，要求采取行动，我们自己的企业也呼吁进行经济改革。\n\n这个幸运的国家掌握在我们手中。"
 AST_new_millennium_economics: "新千年经济学"
 AST_new_millennium_economics_desc: "预算案已经提交并获得批准。财政纪律和预算盈余是我们最受关注的政策，但这并不意味着我们不能适度支出以期未来获利。政府中一些臃肿的资产亟待出售，而且我们仍然可以大幅削减开支，为其他项目的扩张提供资金。\n\n储备银行已经提高了现金利率。现在轮到我们跟进。我们将一如既往地严格但公平。"
 AST_trim_taxes: "削减税收"
 AST_trim_taxes_desc: "上次选举期间，我们承诺为辛勤工作的澳大利亚人减税。我们的立场没有改变。老年居民和高收入者将率先享受一系列减税措施，从而让更多资金流入本地企业，并增加民众的储蓄。"
 AST_restrict_welfare: "停止发放救济金"
 AST_restrict_welfare_desc: "我们对失业救济金的扩充让党内那些对预算问题忧心忡忡的人感到不安。如果我们不采取措施控制福利膨胀，过去几年我们在平衡预算方面所做的努力将付诸东流。如果我们首先限制该计划的覆盖范围，并设定严格的领取条件，或许能够渡过难关。增加福利金领取者的共同义务也能将一些生产力较低的参与者排除在外。"
 AST_another_round_of_tax_cuts: "新一轮减税"
 AST_another_round_of_tax_cuts_desc: "如果我们不为企业着想，那我们算什么政府？在我们执政期间，经济取得了长足发展，但一些小型企业，甚至少数大型企业，都出现了生产力下降的迹象。我们可以通过进一步减税和一些改革措施来缓解他们的困境，从而促进市场竞争。"
 AST_launch_the_gst: "开征商品及服务税"
 AST_launch_the_gst_desc: "相关立法已获通过，“商品及服务税”现在可以取代以往陈旧的税收制度。利斯和其他反对者可以继续抱怨，但GST已经通过了考验。企业可以从这种精简的批发税中受益，而且也不会对财政预算造成负担。"
 AST_cater_to_the_seniors: "照顾老年人"
 AST_cater_to_the_seniors_desc: "任何健康的政府都会不时地进行跨党派合作。即使是政治立场相左的政策，也应该从人民的利益出发来考虑。商品及服务税确实为预算带来了显著增长，但许多老年人并未从中受益。将基本食品排除在消费税之外，并向退休人员提供慷慨的补偿，应该能够减轻他们的负担。自由党不会为了所谓的意识形态纯洁性而牺牲自己。"
 AST_rethink_negative_gearing: "重新思考负扣税"
 AST_rethink_negative_gearing_desc: "我们加强负扣税政策的举措并非毫无争议。房主，尤其是我们年长的选民群体，对这些改革表示赞赏，然而，那些无力购房的人却眼睁睁地看着房价在短短时间内飙升。我们政府中那些倾向于工党的人士已经意识到，在我们任期结束之前，这些政策的影响就已经开始显现。这或许会损害我们在老年阶层中的支持率，但长期健康的经济发展或许能够弥补这些损失。我们只能寄希望于那些努力奋斗的人们能够继续支持我们。"
 AST_first_home_first_served: "先到先得"
 AST_first_home_first_served_desc: "商品及服务税的另一大受害者预计是首次购房者。由于建材价格上涨，我们已拨款向每位首次购房者发放7000澳元补助金，帮助他们在竞争日益激烈的市场中抢占先机。"
 AST_meeting_the_mining_giants: "与矿业巨头会面"
 AST_meeting_the_mining_giants_desc: "国家领导人会见行业巨头并不罕见。博尔德工商会已提出会面请求，这很可能是受到近期减税政策的刺激。我们可以预见，他们会因此更加肆无忌惮地提出更多要求。最终，是否听从他们的要求，取决于我们自己。"
 AST_proud_and_free: "骄傲而自由"
 AST_proud_and_free_desc: "如果我们关注技能短缺和失业问题最严重的地区，就可以重点建立多达24所技术学院，专门面向辍学青年和失业人员。通过将“以工代赈”计划扩展到学徒，可以使他们与大学生享有同等的待遇。国防部也承诺将一部分装备和维护费用用于额外的技能培训。\n\n学生们将有更大的自由去追求自己的职业理想，同时我们的制造业也将得到加强。这或多或少同时惠及了十几个低收入群体，并且无疑会扩大我们在技术与继续教育学院青年选民中的基础。"
 AST_invest_in_people: "投资于人才"
 AST_invest_in_people_desc: "那些身处人生低谷的人往往很难重新振作起来。我们虽然不鼓励长期失业，但可以通过提供激励措施鼓励他们参加技术与继续教育学院的培训项目以及其他国防和社区项目，来避免对他们造成惩罚。这与其说是免费施舍，不如说是对劳动者未来的投资。"
 AST_beef_up_the_dole: "增加失业救济金"
 AST_beef_up_the_dole_desc: "到目前为止，我们的“以工代赈”计划取得了巨大的成功。澳大利亚的失业人数减少了，参与该计划的人们也都在积极提升自己的工作技能。我们可以扩大该计划的覆盖范围，将公共工程纳入其中，并放宽符合条件的申请人的年龄范围。"
 AST_the_baby_bonus: "婴儿奖金"
 AST_the_baby_bonus_desc: "生育不再会带来经济风险。政府将以3000美元的一次性补助取代生育津贴，鼓励年轻家庭迎接新生命的到来，并减轻初为人父母的经济负担。"
 AST_protect_the_water: "保护水源"
 AST_protect_the_water_desc: "内陆一些最偏远的河流，只需一周的恶劣天气就会彻底干涸，导致整个农场和城镇断水。国家水资源倡议是我们追求可持续发展的第一步。在最偏远的社区管理用水并维持可持续的取水水平，可以保障数百万人的用水需求。"
 AST_the_kyoto_protocol_ast: "京都协议"
 AST_the_kyoto_protocol_ast_desc: "我们已经就联合国提案中的公平条款进行了谈判。批准该提案将使我们与另外84个已承诺减少温室气体排放的国家并肩前行。无论我们对全球变暖的影响如何，您都可以放心，我们将把影响降到最低，澳大利亚也将在此事上做一个负责任的国家。"
 AST_the_carbon_pollution_reduction_scheme: "碳污染减排计划"
 AST_the_carbon_pollution_reduction_scheme_desc: "陆克文提出了一项方案，旨在通过设定“排放上限”来限制企业的污染排放，从而将我们工业目前的碳排放量减少25%。陆克文一向高高在上，在气候变化问题上也颇有微词，但公众依然支持他。如果我们对方案进行一些调整，使其不损害我们在化石燃料领域的竞争优势，或许就能成功。"
 AST_the_drought_force: "干旱力量"
 AST_the_drought_force_desc: "进入新世纪以来，我们一路坎坷。或许最令人担忧的莫过于这场“千年干旱”，这可能是我国历史上最严重的干旱。由于应急人员已疲于应对，我们不得不寻找更贴近政府的应对方案。我们已经安排“以工代赈”计划的参与者参与公共工程，现在我们可以让他们专注于受这场自然灾害影响的私人土地。"
 AST_a_nation_worth_preserving: "一个值得保护的国家"
 AST_a_nation_worth_preserving_desc: "我们在提升国家可持续发展能力方面取得了持久的进步。或许这不会对整个世界产生深远的影响，但对于澳大利亚人来说，他们深爱的国家将继续繁荣发展。水质更加清澈，城市雾霾也已消失。或许还有更多工作要做，例如探索更多清洁能源或环境保护方法，但就目前而言，我们可以作为一个更加自豪的国家而感到欣慰。"
 AST_practical_reconciliation: "实际和解"
 AST_practical_reconciliation_desc: "“首先，我想对我们今天聚会的这片土地的传统所有者表示敬意。我也想向已故和在世的长者们致以崇高的敬意。”\n\n这听起来或许有些空泛，但澳大利亚与原住民的关系并非一帆风顺。每一届政府都必须以尊严和尊重正视其历史，而领导层也肩负着不可推卸的责任。无论我们走向何方，我们都应铭记过去，拥抱未来。以审慎的态度团结澳大利亚人民。"
 AST_walk_the_journey: "踏上旅程"
 AST_walk_the_journey_desc: "对于许多澳大利亚人来说，这是一条漫长而艰辛的道路。尽管我们帮助了许多人，但如果我们天真地认为没有一些人被遗弃，那就太幼稚了。为了弥合这一差距，帮助那些被遗弃的人，我们必须从关注健康、教育、住房和就业的项目入手。议会已经讨论过的项目将会获得资金支持并扩大规模。弱势群体和联盟党将携手并进。"
 AST_a_national_apology: "国家道歉"
 AST_a_national_apology_desc: "基廷想抢占先机。好啊，我们就以其人之道还治其人之身。我会让《卫报》那些家伙如愿以偿。我会承担起前人的责任，然后我们就可以继续前进了。澳大利亚原住民将得到公平的待遇，没有人会说我没有帮助他们。"
 AST_its_mabo_its_the_vibe: "马博案造就的氛围"
 AST_its_mabo_its_the_vibe_desc: "马博案是高等法院的一项里程碑式判决。埃迪为原住民土地所有权、前殖民时期土地的存在而战，并彻底终结了无主地制度。\n\n通过与原住民社区合作，并提出一项修正案，将和解声明纳入宪法序言，我们将承认他们对土地的权利，并扩大现有的《原住民土地权利法》的适用范围。这或许具有象征意义，但它表明我们对平等是认真的。所有选民都将拥有平等的发言权。"
 AST_the_civil_partnership_act: "民事伴侣关系法"
 AST_the_civil_partnership_act_desc: "目前，各州和地区限制承认同性伴侣关系，这可能导致他们在法律上遇到一些小问题。虽然我们不再将同性婚姻视为一种道德立场，但我们可以帮助那些不愿结婚的人，至少让他们有机会通过投票来决定此事。"
 AST_avoid_the_speech: "避免演讲"
 AST_avoid_the_speech_desc: "我从原则上认为，一代人不能为上一代人的行为承担责任。我绝不接受这种观点。本届政府不会作秀，也不会为了捞取政治资本而利用原住民问题。执政联盟在这个问题上必须保持团结一致。任何关于参加和解游行的讨论都应该扼杀在萌芽状态。"
 AST_crack_down_on_protests: "镇压抗议活动"
 AST_crack_down_on_protests_desc: "那些叫嚣、示威，所有这一切都必须停止。大家都要冷静下来！我不在乎用什么方法。转移新闻焦点，加强警力。总之，我们什么都行，只要能让真正的问题成为焦点，控制住这些暴徒。我不会理会他们的自吹自擂。事实上，我根本不会理会！我们的政策将会被誉为摒弃了道德绑架和暴民政治。我对此深信不疑。"
 AST_abolish_the_atsic: "废除原住民和托雷斯海峡岛民委员会"
 AST_abolish_the_atsic_desc: "迄今为止，这种所谓的“独立代表制”实验已经彻底失败。十年的资金投入，却丝毫没有给原住民社区带来任何实际好处。更糟糕的是，还有各种管理不善、腐败、欺诈的指控，不胜枚举。够了！我们将解散这个机构，并从其资金中尽可能地榨取剩余价值。"
 AST_with_safer_communities: "更安全的社区"
 AST_with_safer_communities_desc: "北部偏远原住民社区发生虐童事件和社会秩序崩溃，这无疑是一场国家灾难。两党对道德干预的支持很容易获得。我们将部署军队，限制福利，实行强制性健康检查和监控。社区内将禁止色情制品和酒精，我们最终可以将土地所有权归还给政府。某些措施需要暂停《种族歧视法》，这意味着后座议员和社区团体将会抱怨，但当法律和秩序恢复后，感谢我们的绝不仅仅是当地居民。"
 AST_we_are_many: "我们由许多人群组成"
 AST_we_are_many_desc: "毫无疑问，我们是一个多元化的国家。即使在“白人澳大利亚人”政策时期，大量来自欧洲各地、血统各异的移民也涌入了澳大利亚。如今，澳大利亚向更多人敞开了大门，而我们对此负有责任。我们如何管理移民问题，将决定澳大利亚未来几十年的构成。无论贫富强弱，我们都将决定这项政策以及数百万人的生活。"
 AST_widen_our_net: "扩大我们的网络"
 AST_widen_our_net_desc: "自“白澳政策”以来，移民局已经取得了长足的进步，但不得不承认，移民人数仍然很低，非常低。鉴于我国经济的蓬勃发展，劳动力短缺将成为一个日益严峻的问题。为了解决这个问题，我们正在扩大外国劳工的引进范围，同时为了平衡各方利益，我们将更加严格地筛选技术移民，并减少新移民享受福利的机会。此举应该能够同时取悦两党，并吸引大型企业的关注。"
 AST_with_open_arms: "敞开怀抱"
 AST_with_open_arms_desc: "这个国家历来是一个多元文化国家，因此人们只能通过海路抵达。并非所有人都能通过正规渠道入境，但他们仍然从世界各地寻求庇护，渴望最终成为数百万享受我们富饶土地的人们中的一员。我们现行政策的低效之处可以得到简化，从而缩短真正寻求庇护者的拘留时间。有孩子的家庭将被安置在社区住房中，有子女的家庭将被转移，而对于被拘留超过两年的人员，将进行私人调查。"
 AST_girt_by_border_patrol: "被边境巡逻队包围"
 AST_girt_by_border_patrol_desc: "澳大利亚虽为岛国，但也因此极易遭受海上入侵。近期发生的海上事件令我们现有的边境巡逻队面临前所未有的挑战。如果我们自身缺乏有效保卫海岸线的能力，又怎能指望我们的军队维护国家安全？《边境保护法案》将确保我们的舰队拥有遣返船只的绝对权力，并保护执法人员免受不公正的法律诉讼。"
 AST_the_pacific_solution: "太平洋解决方案"
 AST_the_pacific_solution_desc: "虽然合法移民数量大幅下降，但非法移民数量却并未减少。每年都有成千上万的移民未经授权抵达我国海岸，而且这个数字似乎还在不断增长。由于现有基础设施已不堪重负，我们将在瑙鲁和马努斯岛建造离岸拘留中心，用于安置寻求庇护者，同时确定他们的身份。我们将向这两个国家提供公平的补偿。之后，我们将缩小大陆地区适合受理合法庇护申请的领土范围，进一步遏制插队行为。"
 AST_for_bright_minds: "为了聪明的头脑"
 AST_for_bright_minds_desc: "外国留学生正迅速成为我们顶尖大学一笔不可忽视的收入来源。目前，只有少数留学生能够通过我们有限的留学签证入境，但如果我们稍微调整一下申请要求，就会有更多的海外学生来到这里，教育领域也将获得更多资金。"
 AST_strong_in_difference: "差异化优势"
 AST_strong_in_difference_desc: "我们成功地管理着一个由不同文化背景的人们组成的群体，他们融合在一起，形成了全新的澳大利亚身份认同。我们每个人的外貌各不相同，各有所长，但我们齐心协力，共同建设着澳大利亚。职场上人才济济，到处都是为实现这个国家梦想而努力奋斗的人们。这个梦想就是归属感，以及我们共同拥有的和谐共处。"
 AST_tear_out_the_roots: "根除根源"
 AST_tear_out_the_roots_desc: "众所周知，我们许多安全问题都始于印尼，也终于印尼。印尼是我们最强大的近邻，但也极易受到极端主义势力的影响。如果我们之间能够达成共识，尤其是在印尼境内开展合作，共同铲除叛乱组织，双方都将从中受益，并为未来更紧密的合作奠定基础。"
 AST_welcome_the_experts: "欢迎专家们"
 AST_welcome_the_experts_desc: "我们或许已经拥有一些最杰出的人才，但从国外引进更多人才也并无坏处。这甚至可能有助于缓解我们在研发方面面临的一些难题。如果我们利用现有的SkillSelect系统，就可以向来自世界各地的技术移民发放签证。"
 AST_protected_on_all_sides: "全方位防护"
 AST_protected_on_all_sides_desc: "当夕阳西下，金色的海洋笼罩着大地，我们的人民可以安心休憩，因为他们知道，在国家的各个角落，巡逻的队伍都在守护着他们的安全。当媒体报道其他国家的人可能涌入我们的海滩时，他们应该明白，这不过是危言耸听，因为政府会全力保护他们。他们的未来是有保障的。"
 AST_the_howard_doctrine: "霍华德主义"
 AST_the_howard_doctrine_desc: "1999年我们介入东帝汶之后，一些记者开始使用“太平洋第一援助国”这个词，意指我们是太平洋地区许多国家的首选援助国。虽然这种评价或许准确，但我认为我们的政策并不局限于此。\n\n在我担任总理之前，澳大利亚对自身在世界上的地位定义过于狭隘。我们的政府有能力重新调整澳大利亚的外交政策，使其更好地反映我们所处的独特文化和历史交汇点。时间更加坚定了我的信念：我们无需在历史和地理之间做出选择。我们拥有独特的灵活性，既可以忠于传统的盟友和联盟，又能在本地区建立和加强新的伙伴关系。"
 AST_deputy_peacekeepers: "副维和人员"
 AST_deputy_peacekeepers_desc: "在《安迪·格里菲斯秀》中，巴尼·费夫是镇治安迪·泰勒的副手。治安迪不在的时候，巴尼就得代他维持秩序，管理镇上的事务。自柏林墙倒塌以来，美国在全球警务中的角色已毋庸置疑，但新的威胁却层出不穷，其中一些甚至近在咫尺，令人不安。与巴尼类似，澳大利亚也面临着这样的局面：当美国忙于其他事务时，我们肩负起巡逻太平洋的重任。这并非易事，但我们全力以赴，义不容辞。"
 AST_war_on_the_terrible: "反恐战争"
 AST_war_on_the_terrible_desc: "在当今时代，传统的反恐定义和方法已严重过时。那些企图伤害澳大利亚人的人正在以更快的速度适应现代技术。引入立法修订我们对恐怖主义的法律定义，并修改惩罚相关人员的法律，是有效的第一步。我们需要加强澳大利亚安全情报组织的拘留权和监控能力，以确保我们能够及时应对威胁，并赋予我们的部队快速反应能力，在威胁出现之前就将其消除。"
 AST_new_wave_counter_terrorism: "反恐新浪潮"
 AST_new_wave_counter_terrorism_desc: "即使是新修订的法律也远远不够。随着我们收到越来越多关于澳大利亚本土即将遭受恐怖袭击的信息，我们越发意识到需要扩大我们的权力。澳大利亚安全情报组织和警察部队都必须扩充。反恐突袭、预防性拘留以及赋予地方警察“截停搜查”的权力，将有助于消除威胁。我们知道此举会引发争议，但我们目前的形势需要的绝不仅仅是权宜之计。"
 AST_commit_to_foreign_intervention: "承诺进行外国干预"
 AST_commit_to_foreign_intervention_desc: "冲突几乎遍及世界各大洲，唯独澳大利亚是个例外。我们之所以能够维持现状，并继续保持这种状态，唯一的办法就是确保公开冲突不会蔓延到我们的领海。在这些威胁失控之前进行干预至关重要。中东和东南亚地区是恐怖组织的温床，但如果符合国家安全利益，我们可以选择在何处以及如何进行干预。"
 AST_place_rudd_in_the_fire: "将陆克文投入火中"
 AST_place_rudd_in_the_fire_desc: "看来，在我们努力推动立法的过程中，陆克文在反对党内越来越令人头疼。更糟糕的是，他在公众眼中越来越受欢迎。他目前是影子外交部长，但如果我们把他调到我们自己的外交委员会呢？让他负责太平洋地区的外交事务。这不仅可以保护我们免受负面影响，还能让他不再关注反恐立法。"
 AST_our_capacity_for_peace: "我们实现和平的能力"
 AST_our_capacity_for_peace_desc: "陆克文为促成与中国的对话所做的努力已初见成效。中方愿意就太平洋地区的联合维和行动进行谈判。这样的机会并不常见，它能让我们向中国展现平等地位，并以此为未来的合作方向奠定基础。这不再是卑躬屈膝，而是体现出我们维护太平洋安全的共同利益。"
 AST_off_to_delhi: "前往德里"
 AST_off_to_delhi_desc: "铀矿仍然是我们最大的未开发矿产资源，我们的公司渴望在钻探开始前找到新的出口合作伙伴。从各方面来看，印度显然是最佳选择。印度是南亚新兴的超级大国，实力足以在阿拉伯海地区行使自己的影响力。随着我们业务范围的扩大，印度可以成为非常有用的盟友，或者至少可以成为我们可靠的铀矿进口国。"
 AST_marks_gambit: "马克的赌局"
 AST_marks_gambit_desc: "自新加坡独立以来，我们与澳大利亚的关系一直十分友好。我们顺理成章地会采取下一步行动。我们值得信赖的贸易部长马克·韦尔一直在努力促成我们二十年来首次向新加坡提出的正式双边贸易协定。与此同时，他也在积极与泰国洽谈类似的多数免关税贸易协议。促进货物自由进出澳大利亚一直是我们竞选连任的核心纲领，虽然我们党会尽力争取尽可能多的宣传，但最终受益的将是澳大利亚人民。"
 AST_fossil_fuels_for_yuan: "化石燃料换人民币"
 AST_fossil_fuels_for_yuan_desc: "我们与中国的外交进展一直非常顺利。他们为快速实现工业化所做的努力使他们对煤炭的需求量很大，而我们恰好拥有丰富的煤炭资源。与他们达成协议似乎是一个双赢的局面，而且可能会使我们对其他亚洲国家更具吸引力。"
 AST_partner_with_the_japanese: "与日本人合作"
 AST_partner_with_the_japanese_desc: "亚洲贸易正迅速超越我们在欧洲的贸易往来。这理所当然，因为我们的利益已更多地转向本地。在商业领域，日本人是你能遇到的最精明的对手之一。在外交领域，他们同样如此。他们愿意接受我们的农产品出口，以换取我们做出一些让步。降低电子产品和汽车的关税显然是他们的要求，但我们怀疑他们还会提出更多要求。"
 AST_to_promote_our_spirit: "为了弘扬我们的精神"
 AST_to_promote_our_spirit_desc: "我们在海外的努力已取得丰硕成果。越来越多的人开始以全新的视角看待澳大利亚，并将我们视为太平洋地区的重要伙伴。民众也应该看到我们的成就，并真正地颂扬澳大利亚精神。我们可以资助一些电视广告和网络宣传，以推广我们的国家，同时也能起到旅游营销的作用。在广告的角落里放上我们党的标志也无妨。这是我们为之奋斗所能获得的最低回报。"
 AST_the_coalition_convention: "联盟大会"
 AST_the_coalition_convention_desc: "党代会往往是政治生涯的终结之地，他们的演讲和争取自身价值的呼吁往往无人理睬，最终联盟的下一任领导人会落到别人手中。然而，有时坚持不懈终会得到回报。如今联盟已经有了一位足以担当重任的领导人，这一次，关键在于能否发表一篇精彩的演讲。"
 AST_wholesale_economics: "批发经济学"
 AST_wholesale_economics_desc: "“批发”一词通常指零售商或行业渠道，但也有人用它来描述政府资产私有化的行为。我们并没有毫不留情地削减政府低效部门的开支。恰恰相反。正因如此，我们才应该加大力度。有很多机构可以精简，如果我们能找到合适的竞标者，就能获得相当可观的收入。另一方面，我们的劳动力领域也有一些投资途径，如果我们选择得当，就不会影响我们可观的收入。"
 AST_finalize_the_telstra_sale: "完成澳大利亚电信出售交易"
 AST_finalize_the_telstra_sale_desc: "出售澳大利亚电信公司对负责清理所有腐败环节的政府会计师来说，是一场持续多年的煎熬。这些腐败环节曾给我们造成了沉重的管理负担。澳交所为剩余资产提供了非常公平的交易方案，任何理性经济学家都会在他们改变主意之前完成这笔交易，而我们也打算这样做。"
 AST_allow_foreign_interests: "允许外国利益"
 AST_allow_foreign_interests_desc: "就像浮士德那样，有时候你不得不与魔鬼做交易。议会里的乐观主义者或许会让你相信澳大利亚可以自给自足，相信这个岛国能够在全球化的浪潮中实现自给自足。他们错了。我们的产业只有允许外国资本为我们这个渴求美元的经济机器提供动力才能生存下去，媒体行业也不例外。如果媒体想要生存下去，就需要投资。"
 AST_crush_the_unions: "镇压工会"
 AST_crush_the_unions_desc: "近年来，工会在我们的经济乃至政治领域的影响力日益膨胀，且行事肆无忌惮。任何像他们这样的组织都不应该干涉我们的事务，更不应该干涉我们工人的事务。《工作选择法案》旨在纠正这种漠视，并剥夺工会在工厂中的影响力。该法案不会彻底清除工会，但会给企业主一个公平竞争的机会。"
 AST_carve_up_medicare: "分割医疗保险"
 AST_carve_up_medicare_desc: "我们在第一任期内一直没能抽出时间来重新审视全民医保制度。诚然，该制度为许多澳大利亚人提供了可靠、先进的免费医疗服务，但似乎很多人滥用了这项福利。工党的管理不善也导致该制度效率低下，成本飙升。就像一把锋利的刀，我们可以剔除那些长期存在的冗余部分。"
 AST_broadband_blueprint: "宽带蓝图"
 AST_broadband_blueprint_desc: "我们拥有这项技术。我们可以重建网络基础设施，让所有澳大利亚人，无论企业还是家庭，都能享受到最先进的互联网服务。如果我们运用已有的知识，并将其融入现有基础设施，我们就能在很短的时间内制定出在全国范围内推广这项服务的计划。"
 AST_curb_outside_interference: "抑制外部干扰"
 AST_curb_outside_interference_desc: "迄今为止，向世界开放澳大利亚市场和经济无疑是一件好事，但在治理国家时，我们必须划定一条界限。批准外国投资是大多数行业的命脉，但媒体行业除外。克里·帕克对我们新闻媒体的影响不容小觑，我们可以清楚地想象，如果大门敞开，我们可能会招来什么样的更糟糕的外国利益。目前，我们必须保持大门紧闭。"
 AST_bat_for_the_battlers: "为斗士而战"
 AST_bat_for_the_battlers_desc: "澳大利亚绝不应成为一个以阶级或嫉妒为特征的国家，而应以友谊和成就为纽带。我们的中产阶级，那些辛勤奋斗的人们，一次又一次地带领我们走向成功。因此，我们在职场上给予他们一些回报是理所应当的。在不让他们提出过分要求的前提下，我们会认真听取工会的意见，并落实一些切实有效的政策。"
 AST_back_australias_ability: "支持澳大利亚的能力"
 AST_back_australias_ability_desc: "我们最核心的经济政策当属“支持澳大利亚能力”计划。这是一项为期四年的大规模振兴计划，旨在促进我们的大型建设项目，有望大幅降低失业率，并将我们之前吸收的大量税收资金重新投入流通。"
 AST_feel_the_heef_ast: "感受高等教育捐赠基金"
 AST_feel_the_heef_ast_desc: "高等教育捐赠基金是我们近期提出的政策法案之一，旨在引导投资流向高等教育机构和我们的研发基地。最初，我们将是唯一投资该基金的机构，但最终资金会以某种方式回流到政府。这一切听起来有点夸张，但如果两党都支持，或许真有其价值。"
 AST_if_we_build_it: "如果我们建造它"
 AST_if_we_build_it_desc: "我们竞选时承诺新建21家医院，如今承诺兑现，但遗憾的是，成本比我们之前的预估有所上涨。我们的财政专家建议我们将建设工作外包给私营部门，但这仍然会花费我们一大笔钱。不过，从好的方面来看，这些新设施或许能为我们节省一些公共医疗开支。"
 AST_australian_made: "澳大利亚制造"
 AST_australian_made_desc: "“澳大利亚制造”标识是政府最成功的营销策略之一。这个标志辨识度高，因此吸引了更多人购买本地产品。如今，公共支出大幅下滑，人们很难在众多来自越南或中国的廉价进口商品中做出选择。如果我们加大营销力度，不仅面向本地市场，也面向海外市场，强调“澳大利亚制造”是品质的保证，或许就能为它们找到新的市场。"
 AST_preserve_the_old_forests: "保护古老森林"
 AST_preserve_the_old_forests_desc: "塔斯马尼亚的原始森林一直是我们的骄傲和喜悦。那里生长着世界上一些最高的开花树木，有些甚至超过90米！它是一处令人叹为观止的宝藏，对这个国家的重要性堪比大堡礁。将目前的保护范围扩大到另外17万公顷，应该能够有效防止这些森林的消失，同时也不会扼杀我们的木材产业。"
 AST_ets: "排放交易"
 AST_ets_desc: "另一项在议会引起关注的气候立法是“排放交易计划”。不知为何，工党还在炮制这些东西，而且不知为何党内竟然还有人听信。现在，他们抛出了一个诱饵，试图通过向核能开发提供一系列拨款来阻止这项计划的实施。我们目前并不支持核能，但我们不能扼杀它的萌芽，如果能从他们那里得到一些好处来软化那些气候狂热分子，让他们接受我们的政策，我们当然愿意接受。"
 AST_the_new_liberals: "新自由党"
 AST_the_new_liberals_desc: "无论你是否喜欢，党已经改变了。我们不再是90年代那种小写的“i”自由党，而是捍卫传统价值观的专业力量。我们成功地将经济自由主义与财政保守主义融合在一起。我们正视并处理地缘政治问题的现实，让澳大利亚民众的口袋里有更多钱，税收却更少。坦白说，国家因此受益，我们也因此获得了主流选民的支持。我们现在引领党的方向可能会决定我们能否继续保持发展势头，但它也将对依赖我们指引的几代人产生深远的影响。"
 AST_keep_them_in_line: "让他们守规矩"
 AST_keep_them_in_line_desc: "我们党长期以来饱受阴谋和内部政变的困扰。如果我们连自己都不信任，公众又怎能信任我们的联合政府？我们需要“重组”党内领导层挑战规则，并将此类挑战限制在最危急的情况下。只需要鼓励少数国民党员支持这项变革即可。"
 AST_secure_the_coalition: "确保联盟安全"
 AST_secure_the_coalition_desc: "虽然我们并非总能达成共识，但我们的国家党盟友近一个世纪以来一直与我们并肩前行。我们就像豌豆荚里的豌豆一样形影不离。现在这种情况发生的可能性不大，但如果联盟分裂，我们的政党将永远无法赢得下一次联邦选举。这种事不应该听天由命。修改分裂条款，使双方几乎不可能成功，无论他们之前表现如何，都能让他们继续受到我们的信任。这样，我们才能真正团结一致，精神上和精神上都将牢记于心。"
 AST_entice_crossbenchers: "吸引独立议员"
 AST_entice_crossbenchers_desc: "几十年来，我们的政治体系一直依赖于独立议员的工作。这些议员往往缺乏骨气，但他们也曾帮助我们通过了一些法案，在支持我们和反对派之间摇摆不定，有时甚至完全置身事外。有些人只需要一些好处就能重新回到我们身边。几次握手，一些投资，我们就能让他们中的很多人忠心耿耿。"
 AST_broaden_our_beliefs: "拓展我们的信仰"
 AST_broaden_our_beliefs_desc: "说我们党在信仰上固步自封，几乎是老生常谈。毕竟，我们是传统主义者，这种立场也无可厚非。但弊端在于，我们可能因此错失了一些并非全党都支持的宝贵政策。或许我们应该坐下来，与一些小党派好好谈谈，或许能从中有所收获。"
 AST_axe_the_governor_general: "解雇总督"
 AST_axe_the_governor_general_desc: "1999年的共和制公投或许失败了，但这并不意味着我们需要一个远在地球另一端的国家的代表来干涉我们的决策。他们之前已经罢免过我们的一位领导人，他们完全可以再次这样做。现在正是我们罢免他们的时候。我们可以越过他们，直接向女王提出正式请求，并附上几份关于他们渎职的“报告”作为佐证，然后自行将他们赶下台。"
 AST_our_own_kings: "我们自己的国王"
 AST_our_own_kings_desc: "既然王室正在着手寻找继任者，我们就可以利用现有的程序尽可能地延缓过渡期。他们将深陷于旷日持久的法律纠纷和官方调查之中，可能要过数年才能完成新王位的就职宣誓。而我们将拥有政策上的完全自主权，无需再受王室的干预。"
 AST_prepare_the_successor: "培养接班人"
 AST_prepare_the_successor_desc: "有时候，在一切还很美好的时候结束是最好的选择。我在上届任期内承诺会在下次选举前卸任。机会虽已过去，但现在卸任也为时不晚，我可以好好准备，让下一任领导人带领我们前进。我记得自己曾为走到今天而奋斗，而现在，我却在考虑放手。"
 AST_peace_with_honour: "光荣的和平"
 AST_peace_with_honour_desc: "自由党的未来就此决定……"
 AST_the_sydney_declaration: "悉尼宣言"
 AST_the_sydney_declaration_desc: "这份宣言最初起草并应在亚太经合组织会议上作为澳大利亚履行应对全球气候变化承诺的体现。然而，它的意义远不止于向我们的东方盟友展示我们在事业上的进步姿态。宣言本身就体现了我们在外交行动中拥有的影响力。它宣告澳大利亚已准备好与世界接轨，并且我们的行动能够带来真正的改变。我们或许勉强挤进前十，但我们已经跻身其中，而且我们正在不断进步。"
 AST_the_quad: "四方安全对话"
 AST_the_quad_desc: "与日本和印度就救灾问题进行的磋商卓有成效，双方甚至暗示将建立更长期的外交对话渠道。美国副总统也赞成成立一个联盟，以规划和监督中国近期在太平洋地区的行动。最终，“四方安全对话”的名称确定下来，但目前我们暂且称其为“四方安全对话”。"
 AST_negotiate_with_our_northern_neighbours: "我们的北方邻居"
 AST_negotiate_with_our_northern_neighbours_desc: "过去几十年里，尽管偶有波折，我们与巴布亚新几内亚的关系总体上是积极的。他们一直是我们最大的橡胶贸易伙伴之一，维持这一关系已成为国家安全问题。我们已邀请巴布亚新几内亚总理前来协助商讨一项万无一失的协议。"
 AST_anzus_collaboration: "澳新美合作"
 AST_anzus_collaboration_desc: "毫无疑问，澳新美安全条约也经历过坎坷。不久前，新西兰因拒绝美国核潜艇进入其港口而实际上被踢出了条约。无论最终结果如何，该条约在某种程度上就像我们之间的兄弟情谊。尽管美国的政策已经从欧洲转向中东，但如果他们在那里，我们也会在那里。我们的关注点或许会从当地转移，但这终究是一项全球性的努力。"
 AST_an_american_treaty: "美国条约"
 AST_an_american_treaty_desc: "作为全球最大的经济体之一，除了显而易见的安全优势之外，我们当务之急是与美国保持经济联系。美国并非一个容易得罪的国家，尤其是在他们已经对我们国家投入巨资的情况下。当然，偶尔回报他们的支持也无妨，而我们无疑会以优先贸易协定来回报他们。"
 AST_howard_of_arabia: "阿拉伯的霍华德"
 AST_howard_of_arabia_desc: "澳大利亚仍然是一个基督教占多数的国家。我们的道德根源可以追溯到中东。几十年来，以色列一直是我们在该地区最坚定的伙伴之一，他们一次又一次地展现了对原则性民主的坚定决心。当他们需要我们的时候，我们不能袖手旁观。加强与以色列的友谊是我们的宗教责任。"
 AST_keep_security_regional: "保持区域安全"
 AST_keep_security_regional_desc: "尽管我们在中东地区也曾涉足海外行动，但我们始终将近邻放在首位。太平洋岛国如今仰赖我们守护安全，这是理所应当的。随着澳大利亚作为地区强国的崛起，我们有道义上的责任保障他们的安全，使他们免受极端主义势力的侵害。我们与他们开展的各项合作都应体现这一点。"
 AST_preventative_measures: "预防措施"
 AST_preventative_measures_desc: "你不会在被蛇咬了之后才穿靴子。在野外，你首先要确保带上的是靴子，其次是一根粗棍子。这种想法虽然粗犷，但在处理海外防务时也应该运用。我们不能空手而归，也不能让我们的邻国在缺乏保护的情况下处于危险之中。"
 AST_dissuade_the_middle_kingdom: "宣称巴布亚"
 AST_dissuade_the_middle_kingdom_desc: "我们在该地区的主导地位取决于阻止印尼在地缘政治上超越我们，而孤立印尼或许更容易控制局势。巴布亚新几内亚的民族主义者多年来一直请求我们承认他们对西几内亚的主权声索。挑起两国之间的边境紧张局势或许正是我们所需要的，它能削弱两国之间的友谊，从而促使巴布亚新几内亚更加靠近我们。"
 AST_the_indonesian_ultimatum: "印尼最后通牒"
 AST_the_indonesian_ultimatum_desc: "近来与印尼的冲突频发。无论我们采取何种立场，无论我们与印尼的合作程度如何，他们似乎都无法有效应对国内的极端势力。我们可以向他们发出最后通牒，允许我们向亚齐派遣维和部队，并有效占领该地区，直到它能够作为一个独立国家进行自治。我们以前就成功做到过，我们也能再次做到。如果他们拒绝，我们可以动用一切制裁手段，直到他们重回谈判桌。"
 AST_a_visit_from_malaysia: "来自马来西亚的访问"
 AST_a_visit_from_malaysia_desc: "很少有国家像马来西亚那样坦诚真诚地与我们沟通。从领导人到普通部长，他们多次访问我们，贸易谈判也总是进行得非常顺利。或许是因为我们共同的英联邦背景，两国之间确实建立了深厚的尊重。这次的讨论重点是我们的农产品出口，诚然​​，出于安全考虑，我们的出口一直受到限制。他们很可能会要求我们放宽相关法律。"
 AST_peacekeeping_in_somalia: "索马里维和行动"
 AST_peacekeeping_in_somalia_desc: "尽管索马里过渡政府最初前景光明，但在军阀混战之后，其地位一直岌岌可危，国家实际上已经分裂。持续不断的人道主义危机已足以引起我们的关注，如今索马里政府已请求外部干预。这或许是一个在不直接卷入冲突的情况下锻炼维和人员的机会。"
 AST_the_coal_family: "科尔家族"
 AST_the_coal_family_desc: "就像上世纪五十年代的美国梦一样，许多澳大利亚人过着田园诗般的传统生活，追求自决。坦白说，他们很可能构成了我们选民群体的重要组成部分，这又有什么奇怪的呢？这正是我们鼓励澳大利亚家庭追求的生活方式：独立而幸福。我们可以通过逐步修改那些阻碍房屋建设的政策，以及降低一些土地税来减轻他们的负担，以此回报他们的支持。我们的家庭不应该因为拥有属于自己的一片美丽土地而受到惩罚。"
 AST_the_abbott_government: "阿博特政府"
 AST_the_abbott_government_desc: "从今天起，我宣布澳大利亚已由新的政府领导，澳大利亚再次向商业开放。我们将秉持开放的原则，由一个致力于最大限度发挥所有人潜能的政府来领导，而不仅仅是那些投票支持我们的人。\n\n简而言之，一个为所有人、为大多数人服务的政府。正如伟大的孟席斯所描述的那样，他们是“实干家，而非懒汉”。被遗忘的家庭将得到关怀。沉重的税收将被取消，非法船只将被取缔，预算将重回正轨，实现前所未有的盈余。\n\n事不宜迟，让我们开始吧。"
 AST_expand_the_executive: "扩大执行范围"
 AST_expand_the_executive_desc: "我们既要精简政府规模，又要提升政府办事能力，这二者之间存在着悖论。当掌舵人亲自指挥时，他的决策必须直指要害，无需浪费时间咨询整个议会。"
 AST_honour_the_party: "尊重党"
 AST_honour_the_party_desc: "如果我们想要继续被社会接受，我们的内阁就必须体现党的传统。约翰·霍华德为重塑自由党所做的工作意义重大，使自由党得以适应现代政治的新时代，而从他的政府中聘用人员则能带来丰富的经验。"
 AST_building_stronger: "建设更强大的"
 AST_building_stronger_desc: "我们从心底里明白，没有经济支撑，社会就无法存在；没有企业盈利，经济也无法运转。同样，尽管我们一向乐观，但对自身财政实力的信心已跌至谷底。我们现在的任务是重建经济，并使其强大到足以让每一位澳大利亚人都引以为傲。"
 AST_the_advisory_council: "顾问委员会"
 AST_the_advisory_council_desc: "自由党不应被视为反对和解的政党。毕竟，正是哈罗德·霍尔特终结了“白澳政策”。我们将成立一个委员会，让我们了解原住民事务，并确保讨论的重点始终放在切实可行的变革上。"
 AST_cut_the_programs: "砍掉这些项目"
 AST_cut_the_programs_desc: "我们不能无休止地补贴那些不配合政府和解工作的偏远社区。那些接受资助却不遵守规定的原住民社区，其预算将被削减。就这么简单。"
 AST_its_the_constitution: "宪法"
 AST_its_the_constitution_desc: "我们现在需要做的，是打破宪法中令人窒息的沉默，打破宪法中对原住民的遗漏。这种诉求需要在议会之外做出决策，通过全民公投来承认澳大利亚原住民和托雷斯海峡岛民是我们的第一民族。"
 AST_compete_on_the_farms: "农场竞赛"
 AST_compete_on_the_farms_desc: "自联邦成立以来，家庭农场一直是澳大利亚农业的支柱。从塔斯马尼亚到西澳大利亚，由几代澳大利亚人经营的农场正逐渐被大型企业挤压。如果我们不通过提供便捷的贷款和改善供水来​​关爱农民，就无法继续保持竞争力。我们的政策必须优先考虑保障他们的独立性。"
 AST_develop_the_northern_territory: "发展面包碗"
 AST_develop_the_northern_territory_desc: "一项旨在将北领地打造成为工农业强州的计划已经提出，该计划涵盖多个发展项目。批准这项计划，我们将培育一个以往被历届政府忽视的地区，并有可能在未来几十年内将其打造成为澳大利亚和太平洋地区的粮仓。"
 AST_getting_in_there: "进入其中"
 AST_getting_in_there_desc: "不幸的是，进出北领地的道路状况十分糟糕。此外，为了满足运往北领地的物资需求，甘号铁路也需要升级改造。"
 AST_funnel_in_workers: "漏斗工人"
 AST_funnel_in_workers_desc: "我们需要人手来启动运营。这不成问题，一些优惠签证和搬迁补助就能解决。"
 AST_project_manton: "曼顿项目"
 AST_project_manton_desc: "曼顿水坝曾是该地区主要的水源和电力来源，因为达尔文市自己也建有水坝。令人惊讶的是，翻新和重新启用该水坝以向附近社区供水的成本在预算之内，这将切实体现我们致力于北领地建设的决心。"
 AST_compassionate_government: "公平竞争"
 AST_compassionate_government_desc: "在这个国家，只要你肯尝试，就一定会有机会。这或许可以成为我们党在领导下的座右铭。我们的人民理应因其努力而获得回报，对于那些起步阶段条件欠佳的人，我们会伸出援手，给予他们一些帮助。这不是特权，而是公平。"
 AST_keep_the_fire_burning: "让火焰继续燃烧"
 AST_keep_the_fire_burning_desc: "福利支出正在蚕食政府的财政，如果我们不加以控制，最终会让我们陷入困境。与此同时，这些项目也开始对我们的民众产生显著的积极影响。如果我们现在就停止，可能会使多年来的努力付诸东流。因此，我们需要重新调整部分资金来源以支付当前的支出，并寄希望于凯恩斯的长远观点是正确的。"
 AST_national_curriculum_review: "课程审查"
 AST_national_curriculum_review_desc: "除了常见的政治偏见渗透到课程设置中之外，公共资金的分配似乎也出现了不平衡，将农村学校排除在外。澳大利亚的每一所学校都应该获得公平的机会，每一个学生都应该接受能够展现西方文明成功经验而非仅仅反映其问题所在教育。我们都应该为我们成长的国家及其教育体系感到自豪。"
 AST_another_baby_boom: "又一波婴儿潮"
 AST_another_baby_boom_desc: "爱是美好的。我们的政府比大多数人都更明白这一点。竞选期间，我们承诺改革带薪育儿假制度，为新妈妈提供26周的假期，工资与她们的产假持平。党内对此有很多反对意见，但把我们国家的母亲放在首位才是最重要的。"
 AST_responsible_governance: "负责任的政府"
 AST_responsible_governance_desc: "我们政府肆意挥霍的开支实际上正在引爆预算危机。执政党最大的责任就是做出艰难的抉择。我们不能再用信用卡偿还房贷了。"
 AST_the_welfare_bloat: "不存在这样的社会"
 AST_the_welfare_bloat_desc: "现行的公共福利制度让民众更容易获得救济。任何人只要运气不好，哪怕只是腰背疼痛，都能领取福利联络中心和国民保健的全部福利。我们需要收紧福利准入门槛，并且为了真正削减预算臃肿，一些不必要的项目也必须逐步取消。"
 AST_cashless_welfare: "无现金支付"
 AST_cashless_welfare_desc: "随着北领地社区试点项目的结束，我们相信小规模推广是可行的。用政府发行的银行卡取代直接存款，并将支出限制在必需品范围内，将有助于防止我们社区中的弱势群体流落街头或沉沦于赌场。"
 AST_up_the_gst: "再加一项税"
 AST_up_the_gst_desc: "我们税收制度最重大的改革发生在几年前，但已经给国家带来了巨大的好处。尽管当时颇具争议，但如今我们的企业享受着更简化的税收制度，而增加的收入也为我们成本更高的项目提供了资金。即使只是略微提高税率，也能缓解我们目前面临的预算困境。"
 AST_national_audit_commission: "国家审计委员会"
 AST_national_audit_commission_desc: "政府的浪费性支出就像脚下的污垢一样难以清除。成立一个百年一遇的委员会，专门负责整顿整个政府的浪费性支出，是最佳方案。所有项目都将被列入削减名单。"
 AST_investigate_union_corruption: "与工会的战争"
 AST_investigate_union_corruption_desc: "让那些小报知道，我们向不法行为宣战，向腐败宣战，并宣布我们的社会必须遵守一定的准则。无论你是公司高管还是工会官员，都必须遵守法律。"
 AST_the_energy_crisis: "能源危机"
 AST_the_energy_crisis_desc: "对气候保护的过度关注，反而让我们离能源末日更近了一步。即便我们能够控制气候变化，民众的需求也未能得到满足，不断上涨的成本带来的财政风险，超过了美国以往面临的任何其他危机。我们的政府必须彻底解决这个问题。"
 AST_duttons_plan_focus: "达顿的计划"
 AST_duttons_plan_focus_desc: "我们的卫生部长彼得·达顿试探性地介入了能源辩论，提出了一个至少可以说极具争议的解决方案：取消澳大利亚对核能的限制，允许建造核电站，从而彻底解决能源短缺问题。过去几十年，我们一直对这个方案避而不谈，这当然有其道理，但这或许正是我们一直在寻找的激进解决方案。"
 AST_look_below: "向下看"
 AST_look_below_desc: "所有问题的答案一直就在我们脚下。环保主义者畏惧它，工党忽视它，但联盟党尊重它。没有任何可再生能源能够取代上帝赐予我们的能源，这能源自恐龙灭绝以来就一直为我们孕育。"
 AST_build_it: "开工"
 AST_build_it_desc: "煤电的优势之一在于它的美观。我们拥有世界上一些最优秀的天然气发电厂，比那些噪音大、外形丑陋的燃气轮机要好得多。通过启动澳大利亚能源市场运营商的紧急措施，采购更多发电机组并建设我们自己的电厂，我们可以在很短的时间内建造更多电厂。"
 AST_deny_it: "拒绝"
 AST_deny_it_desc: "一种精神上的低迷正在削弱这个曾经雄心勃勃、勇往直前的国家的士气和雄心。对气候变化的妥协扰乱了我们的能源生产，同时也助长了邻国抢占我们失去的产业。我们无法让时光倒流，但我们可以挣脱束缚。"
 AST_friend_of_the_mines: "矿工之友"
 AST_friend_of_the_mines_desc: "与新闻集团的朋友聊过之后，我们意识到，对矿业公司的压力可以稍微减轻一些。首先，我们需要改变政府对采矿权的态度。"
 AST_light_on_the_hill: "山丘上的光"
 AST_light_on_the_hill_desc: "几十年来，澳大利亚一直是太平洋地区民主的灯塔，如今，它更化作一道真正的明灯。澳大利亚人将能够安心享受价格合理、供应充足的电力，以及遍布全国的供暖和制冷服务。这充分证明了我们政府的政绩，也体现了我们国家所取得的进步。"
 AST_acquire_enrichement: "小绿岩"
 AST_acquire_enrichement_desc: "令人羞愧的是，我们开采了如此多的这种矿物，却没有相应的浓缩设施来加以利用。我们可以迅速从美国的朋友那里进口并组装一台，同时绕过一些必要的步骤，使其能够及时投入使用。"
 AST_convert_the_ansto_reactor: "改造澳大利亚核科学和技术组织反应堆"
 AST_convert_the_ansto_reactor_desc: "显然，悉尼已经有一座反应堆了。当然，它可能不是我们发电所需的确切型号，但我们可以动员一些科学家，让它做好发电的准备。毕竟，这并非什么高深莫测的科学。"
 AST_tweak_the_restrictions: "不再退缩"
 AST_tweak_the_restrictions_desc: "阻碍国家实现零排放能源的因素有很多，尤其是那些标榜环保的人士在全国各地设立各种“无核区”。事关国家紧急状态，这些“无核区”必须取缔。"
 AST_first_stop_jakarta: "第一站雅加达"
 AST_first_stop_jakarta_desc: "我们可以在任期伊始就发出一个强烈的信号：澳大利亚的外交政策将继续保持区域性。当澳大利亚各国比以往任何时候都更需要我们的帮助时，我们不能在欧洲四处游走。少一些日内瓦，多一些雅加达。"
 AST_sail_steady: "稳住航向"
 AST_sail_steady_desc: "我们的外交部长朱莉·毕晓普强调，本届政府将奉行“经济外交”方针，重点是继续推进援助项目和自由贸易。坦白说，这与我们前几届政府的做法并无太大差别，但当数百万人的生命掌握在自己手中时，最好还是不要节外生枝。"
 AST_the_anglosphere: "英语世界"
 AST_the_anglosphere_desc: "澳大利亚拥有原住民文化遗产、英国建国基础和多元文化特色。因此，我们与英国的关系如同兄弟般亲密。我们说着同一种语言，热爱橄榄球，并为同样的民主理想而奋斗。我们的情谊无比神圣，也理应如此。"
 AST_o_canada: "哦，加拿大！"
 AST_o_canada_desc: "我们的英联邦兄弟们。虽然远隔重洋，但我们之间的情谊却如同老友一般深厚。不妨联系一下，探讨一下我们外交官们正在筹划的投资机会。"
 AST_swell_the_support: "扩大支持"
 AST_swell_the_support_desc: "众所周知，自上世纪90年代以来，我们的国防征兵工作一直处于低迷状态。扩大资格要求、加大征兵力度并开放国防实习机会，是填补我们必要岗位空缺的恰当的第一步。"
 AST_of_knights_and_dames: "骑士与贵妇"
 AST_of_knights_and_dames_desc: "“澳大利亚骑士勋章”曾是表彰对国家做出卓越贡献者的最高荣誉。但如同大多数工党政府一样，这一称号在其执政期间被废除。如今我们重振旗鼓，理应恢复这段不应被遗忘的宝贵遗产。"
 AST_american_integration: "美洲一体化"
 AST_american_integration_desc: "我们在太平洋地区的盟友们早就提出过联合训练演习的想法。单是能够在实战环境中运用我们的新装备所带来的益处，就足以让我们的部队受益匪浅，而且还能让我们与美国保持更紧密的联系。"
 AST_square_kilometre_array: "平方公里阵列"
 AST_square_kilometre_array_desc: "在我们和新西兰竞标参与该项目的过程中，不出所料，我们胜出。我们与南非和英国携手，将参与到我们有生之年最雄心勃勃的天文​​项目中。我们的任务是在21公里范围内建造超过13万个树状天线。理论上，这将使我们的天空观测速度比现在快1万倍以上。这完全是一项高科技，对于我们该领域的科学家来说，这是一个令人振奋的机会。"
 AST_joint_defense_tech: "联合防御技术"
 AST_joint_defense_tech_desc: "五眼联盟已成为我们反恐战争以及情报收集领域最强大的力量之一，至今已持续近60年。建立一个研究部门并不难，而且有助于弥合我们之间存在的任何技术差距。"
 AST_the_submarine_corporation: "潜艇公司"
 AST_the_submarine_corporation_desc: "为了支持舰队建造新型潜艇，澳大利亚潜艇公司伸出了援手。自上世纪80年代以来，该公司一直是我们的首选造船供应商，最近刚刚完成国有化，现在完全听候我们的差遣。"
 AST_new_columbo_plan: "新科伦坡计划"
 AST_new_columbo_plan_desc: "二战后，为了重建饱受战火蹂躏的亚洲，我们实施了科伦坡计划，派遣技术专家援助亚洲，并允许亚洲专家来我国学习。如今，我们可以再次运用同样的原则，通过加快签证审批流程，帮助新兴的亚洲学生来我国大学学习。"
 AST_growing_demands: "迎接挑战"
 AST_growing_demands_desc: "任何政府都不能以牺牲国家安全为代价来追求经济上的稳健。澳大利亚国防军必须始终处于随时应对任何冲突的准备状态。否则，我们将陷入困境。"
 AST_visiting_the_rainbow_nation: "彩虹之国"
 AST_visiting_the_rainbow_nation_desc: "我们与南非有着一段丰富多彩的历史，可以追溯到第二次布尔战争期间我们曾支持南非军队。目前，近20万南非人居住在澳大利亚，而且随着近期难民申请的激增，这一数字还在持续增长。随着两国关系日益紧张，要求我们在这个问题上表明立场的压力也越来越大。"
 AST_indonesian_intervention: "确保群岛安全"
 AST_indonesian_intervention_desc: "印尼局势恶化的时间太长了。虽然我们1999年的努力总体上取得了成功，但仍需进一步介入该国事务，以遏制伊斯兰原教旨主义的威胁。"
 AST_an_oceanic_alliance: "大洋洲联盟"
 AST_an_oceanic_alliance_desc: "太平洋地区人民的福祉，我们身处此地的人感同身受，也同样需要我们去处理。我们常常需要互相扶持，这在我们之间培养了深厚的团结。"
 AST_aukus_abbott: "美英澳三边安全伙伴关系"
 AST_aukus_abbott_desc: "我们与英国和美国对基于规则的国际秩序有着无比坚定的共同承诺。在过去一个世纪的几乎所有重大冲突中，我们都并肩作战。因此，深化这种合作是通往更安全世界的最佳途径。"
 AST_the_greatest_statesman: "最伟大的政治家"
 AST_the_greatest_statesman_desc: "澳大利亚在太平洋地区的地位已经稳固。这个美丽的国家不再是亚洲崛起的旁观者，而是积极的参与者。历史学家们将会回顾这段历史，并意识到正是这一刻，我们引领国家走上了正确的道路。"
 AST_the_asian_century: "亚洲世纪"
 AST_the_asian_century_desc: "尽管批评者可能会这么说，但我们并非毫无计划地贸然进军亚洲。稍加研究便可发现，北亚各国在短短几十年内实现了人类历史上前所未有的经济转型。我们需要向这些国家表明，澳大利亚欢迎投资，并已准备好参与到这场转型中来。"
 AST_our_greatest_partner: "我们最亲密的合作伙伴"
 AST_our_greatest_partner_desc: "中国创造了奇迹，使数亿人摆脱贫困，步入中产阶级。同样，我们与中国的伙伴关系也在不断发展壮大，其规模远远超过其他任何太平洋国家。尽管政府内部有人敦促澳大利亚在经济利益和安全利益之间做出选择，但事实是，失去老朋友并不能结交新朋友；削弱某些友谊也不会巩固另一些友谊。"
 AST_indian_investments: "印度投资"
 AST_indian_investments_desc: "一些印度企业已表示有意扩大在澳大利亚的生产规模，并在悉尼设立工厂。目前对外国公司的限制延缓了这一进程，但只要获得[GetASTLeaderTitle]的直接批准，他们就能迅速启动项目，并开始创造就业机会。"
 AST_sanpou_yoshi: "三方满意"
 AST_sanpou_yoshi_desc: "“三方满意”是日本的一个古老术语，意指每一笔交易都必须惠及卖方、买方和社会整体，也就是所谓的“三赢”。然而，我们目前与日本达成的贸易协议却远非如此。我们之间存在严重的贸易逆差，如果不加以纠正，将会加剧两国之间的隔阂。"
 AST_seoul_refineries: "首尔炼油厂"
 AST_seoul_refineries_desc: "自朝鲜战争以来，我们在军事和经济上都与韩国政府保持着非常密切的联系。鉴于他们在首尔建立的新工业基地取得了成功，与他们达成协议来提炼我们的石油，无疑可以省去我们自己提炼的诸多麻烦，并能更快地启动相关工作。"
 AST_australian_exceptionalism: "澳大利亚例外论"
 AST_australian_exceptionalism_desc: "这个国家拥有一套独特的价值观。这并非源于神授的使命或与生俱来的天赋，而是源于前人为引领我们走向新纪元而做出的艰难抉择和牺牲。这一传统必须传承下去，澳大利亚将不惜一切代价守护下去。"
 AST_stop_the_boats: "阻止船只"
 AST_stop_the_boats_desc: "人口走私活动引发的非法入境和海上溺亡事件数量激增，是近年来澳大利亚面临的最大危机。我们的边境事务专家斯科特·莫里森制定了一项军事化行动，旨在加强巡逻、取消永久保护签证，以阻止人们冒险插队，从而保障海岸安全并扭转这一局面。"
 AST_raise_the_threat_level: "提高威胁等级"
 AST_raise_the_threat_level_desc: "恐怖主义威胁已然成为我们生活的一部分，令人遗憾的是，一些澳大利亚公民和居民确实会对我们造成伤害。因此，加强机场、军事基地、政府大楼和大型公共活动的安保措施势在必行。"
 AST_tighten_the_flow: "收紧流量"
 AST_tighten_the_flow_desc: "多元文化澳大利亚的理念或许并未失败，但就目前的移民规模而言，流入量实在过高，难以持续。考虑到公民的需求，限制移民流入是唯一可行的下一步措施。"
 AST_prevention_measures: "预防措施"
 AST_prevention_measures_desc: "干预行动需要一位足智多谋的领导者。果断而正确的打击能够防患于未然。至少，他应该拥有在最需要的时候采取行动的选项，并确保这一选项始终有效。"
 AST_wielding_the_stick: "挥舞棍棒"
 AST_wielding_the_stick_desc: "我们与一家规模最大、最值得信赖的武器生产商合作，组织建造了两座新的制造工厂，旨在为未来的战争提供当今所需的武器。我知道，这句口号很棒。"
 AST_deployment_mandate: "部署授权"
 AST_deployment_mandate_desc: "我们的快速战备动员已经制定了一些目标，以确保我们走在正确的轨道上。成功实现这些目标将为我们提供所需的信心，以证明突然的支出激增是合理的，并展示我们真正的能力。"
 AST_employ_reserves: "动用预备役"
 AST_employ_reserves_desc: "我国预备役部队的主要职责包括在自然灾害和国内紧急情况下提供援助。鉴于国防属于国内紧急情况，我们将把预备役部队部署到全职人员无法胜任的任何领域，从而腾出兵力进行部署。"
 AST_let_them_serve: "让他们服役"
 AST_let_them_serve_desc: "目前的招募政策对于我们的扩张计划来说过于严格。如果将该项目开放给国防实习生，并为申请者提供债务减免，就能使我们的招募人数达到所需水平。"
 AST_incorporate_them: "将它们纳入其中"
 AST_incorporate_them_desc: "我们已经有一项规模可观的计划，旨在让领取福利金的人参与公共工程项目。现在我们可以将他们重新分配到军事工业领域，从而减轻澳大利亚国防军的部分负担。"
 AST_a_shining_fleet: "一支闪耀的舰队"
 AST_a_shining_fleet_desc: "自冷战结束以来，我们的海军基础设施日渐衰败，已成为国防的一大软肋。我们的造船能力几乎完全丧失。这项工作将从重振国有船坞开始，由新成立的澳大利亚海军基础设施部门负责，不久之后，我们的国家将重返海洋。"
 AST_assistance_from_langley: "来自兰利的援助"
 AST_assistance_from_langley_desc: "山姆大叔以前就帮过我们，如果我们提出请求，他们肯定也愿意在情报部门伸出援手。正如他们所说，知己知彼，百战不殆。"
 AST_our_fight: "我们的战斗"
 AST_our_fight_desc: "我们未来的征程必须靠自己走。当然，并非完全依靠我们自己，但我们需要证明澳大利亚有能力武装自己，打赢自己的仗。毕竟，我们是一个实干家的国度。"
 AST_asian_partnership: "亚洲伙伴关系"
 AST_asian_partnership_desc: "没有朋友，你就只能做到一半。多年来，亚洲各国对我们而言不仅仅是朋友，尤其是日本，在我们的军备竞赛中一直与我们并肩作战。目前，我们正与日本商讨一项购买一定数量潜艇以扩充舰队规模的协议，而达成这项协议至关重要。"
 AST_accelerate_the_timeline: "加快时间线"
 AST_accelerate_the_timeline_desc: "随着准备时间窗口即将关闭，一些最后的生产环节需要加快速度。我们需要加快烹饪速度。"
 AST_in_our_backyard: "在我们后院"
 AST_in_our_backyard_desc: "自1911年成立以来，英国皇家海军已在印度洋-太平洋地区航行了近一个世纪。在两次世界大战中，我们汲取了许多宝贵的经验教训，包括如何将力量投射到这些海岸。这些经验将在未来的考验中接受检验。"
 AST_counter_the_island_chain: "对抗岛链"
 AST_counter_the_island_chain_desc: "自上世纪40年代以来，中国一直采取恐吓和抢占岛礁的手段来巩固其对南海的主权声索。虽然过去中国的扩张在某种程度上尚可控制，但他们最近在人工岛礁建设方面的成功加剧了威胁。如果我们现在不采取强硬措施，我们以北的任何地方都可能成为下一个“东海”。"
 AST_dealings_in_kuala_lumpur: "吉隆坡的交易"
 AST_dealings_in_kuala_lumpur_desc: "我们与马来西亚之间的矿产贸易额已增长到双方外交官已联系商讨贸易协定的程度，这有望进一步简化本已利润丰厚的货物流通。与此同时，我们也可以提出中立协议的条款，以阻止他们与中国日益增长的影响力接轨。"
 AST_guadalcanal_garrison: "瓜达尔卡纳尔驻军"
 AST_guadalcanal_garrison_desc: "二战爆发后，日本帝国入侵所罗门群岛，企图利用该岛作为跳板攻击我国。一些最激烈的战斗就发生在这些岛屿上，我们不能冒任何风险让其他国家再次获得这样的立足点。"
 AST_mutual_defense: "共同防御"
 AST_mutual_defense_desc: "我们无法独自巡逻太平洋，而自冷战结束以来，尽管历史恩怨颇多，日本一直是我们最亲密的盟友之一。可以说，他们重塑形象的方式令人钦佩。在未来的冲突中，我们需要他们的帮助。"
 AST_due_reparations: "逾期赔偿"
 AST_due_reparations_desc: "虽然联合安全很有吸引力，但对我们来说，获得二战应得的赔偿才是当务之急。超过27000名澳大利亚人在战争中丧生，其中超过64%的人是在与日军作战时牺牲的，战争期间澳大利亚为此花费了近30亿英镑。这还不包括达尔文轰炸造成的损失。赔偿必须到位。"
 AST_pukpuk_treaty: "普克普克条约"
 AST_pukpuk_treaty_desc: "多年来，我们一直在谨慎地探讨与巴布亚新几内亚加强防务合作的可能性。合并军事指挥部为对抗中国日益增长的影响力，并对我们的友好邻国施加更直接的影响，提供了一个有效的契机。"
 AST_the_indonesian_solution: "解决印尼"
 AST_the_indonesian_solution_desc: "印尼几十年来一直是我们的眼中钉，谈判的时代已经结束。我们需要采取直接管控措施。我们将恢复该地区的秩序。"
 AST_island_leasing: "岛屿租赁"
 AST_island_leasing_desc: "新喀里多尼亚群岛位于我们东北侧翼，战略位置至关重要。如果我们能在那里部署军队，就能在整个珊瑚海周围构筑一道坚固的防线。幸运的是，我们或许可以从法国朋友那里租借到这些岛屿的军事基地使用权。"
 AST_the_middle_power: "中等强国"
 AST_the_middle_power_desc: "如果能争取到韩国的支持，就相当于给中国挖了个“阿喀琉斯之踵”。一旦我们之间爆发冲突，这无疑是当头一棒，机会难得，不容错过。"
 AST_fuel_the_grudge: "火上浇油"
 AST_fuel_the_grudge_desc: "棋盘上的最后一块拼图。一旦跨过这道门槛，就没有回头路了。我们的政策必须从对中国转向对台。如果我们能争取到台湾的支持，其他一切都会迎刃而解。"
 AST_shirt_front_the_dragon: "龙形围裙"
 AST_shirt_front_the_dragon_desc: "近几周来，中国舰队一直试图强迫菲律宾撤出有争议的黄岩岛。像大多数霸凌者一样，如果我们派出自己的舰船声援菲律宾，并在该岛周围建立警戒线，中国的嚣张气焰就会迅速消散。"
 AST_the_canberra_treaty: "堪培拉条约"
 AST_the_canberra_treaty_desc: "战争得以避免，龙也会明白，太平洋各国不会屈服于胁迫。"
 AST_the_lottery_draft: "彩票选秀"
 AST_the_lottery_draft_desc: "上次我们推行国民服役计划时，这项举措并不受欢迎。但如果我们想赢得这场战争，就需要更多随时待命的部队。“生日投票”制度需要重新启用。"
 AST_stock_up: "备货"
 AST_stock_up_desc: "我们的海军不可能无处不在。物资短缺将不可避免，我们只能祈祷在此之前，关键物资的储备足够充足。"
 AST_border_commanders: "边防指挥官"
 AST_border_commanders_desc: "严格来说，我国没有海岸警卫队。海事边境司令部通常负责边境保护，但由于没有专门的部队，一般由澳大利亚国防军和皇家澳大利亚海军警察部队的混合单位组成。我们可以通过将剩余的预备役人员纳入其作战部队来解决这个问题，赋予其保卫海岸线免受任何威胁的职责。"
 AST_remember_the_squander_bug: "还记得那只浪费虫吗？"
 AST_remember_the_squander_bug_desc: "在国家面临二战以来最严峻的财政挑战之际，挥霍无度无异于叛国。我们可以重温一部经典喜剧，嘲讽那些在战争期间过度消费、贪婪成性的民众，同时趁机出售我们的战争债券。"
 AST_secure_a_landing: "安全着陆"
 AST_secure_a_landing_desc: "鉴于我们与外界的距离，任何入侵行动都将在海上进行。我们需要征用相当数量的私人船只来满足这项任务的后勤需求，并提升我们的两栖作战能力。"
 AST_all_in: "全力以赴"
 AST_all_in_desc: "我国各行各业必须全力应对当前的威胁。我们将进入全面战争状态。某些自由权利可能会暂时搁置，但国家和军队的需求必须优先满足。"
 canberra_treaty_idea: "堪培拉条约"
 AST_the_rudd_government: "卢克文政府"
 AST_the_rudd_government_desc: "澳大利亚已展望未来。人民已决定，作为一个国家，我们将携手并进 - 规划未来，共同拥抱未来。我们将团结一致，谱写国家历史的新篇章，使我们伟大的国家更加辉煌。\n\n我们不能把这份神圣的信任视为理所当然。\n\n教育体系的改进早已迫在眉睫。我们的公立医院系统和福利体系亟需提升。我们的基础设施远未达到21世纪的要求，而应对气候变化危机的迟迟没有行动，使我们倒退了几十年。我们并非现状的维护者，而是普通民众的代言人。关注这些领域以及国家面临的更大威胁，仅仅是开始。\n\n我们的政策必须贴近澳大利亚民众及其需求。我们能否带领国家迈入新的十年，至关重要。"
 AST_mend_the_rift: "弥合裂痕"
 AST_mend_the_rift_desc: "执政联盟的忽视让那些徘徊在社会裂缝边缘的人们彻底坠落。弱势群体、边缘群体；随着他们被边缘化，社会裂缝也随之扩大。我们可以从走访受灾最严重的地区开始，开启团结澳大利亚人的旅程。这些地区包括遭受住房危机最严重冲击的偏远社区、无家可归者群体以及苦苦挣扎的农民和工人。如果我们关注他们的处境，就能让他们看到政府的关心，并让他们相信变革即将到来。"
 AST_heal_the_people: "治愈人民"
 AST_heal_the_people_desc: "目前，我们的公共医疗体系一团糟。等待时间过长，导致一些急需救命手术的患者有时要等上一年之久，急诊科不堪重负，甚至导致患者无法及时进入手术室。通过紧急实施国家标准，我们可以立即提高公立医院的容量要求，并提升全国的最低医护人员配备水平。"
 AST_unite_the_country: "团结国家"
 AST_unite_the_country_desc: "现在，我们的任务是掌舵这艘船，如果我们无法让所有人都团结一致，那就说明我们做得不够好。澳大利亚人之间仍然存在隔阂，阻碍着我们走向团结；而拒绝正视过去，也让我们无法拥抱未来。如果我们想要实现这两个目标，就必须正视几个世纪以来在这个国家根深蒂固的不平等现象。我们或许无法彻底消除它，但我们可以尽力而为。"
 AST_economic_revolution: "经济革命"
 AST_economic_revolution_desc: "不难看出，过去三十年伟大的新自由主义实验已经失败。它所催生的自由市场原教旨主义，不过是披着经济哲学外衣的个人贪婪罢了。讽刺的是，如今阻止这种资本主义自我毁灭的重任，却落在了社会民主主义者的肩上。\n\n我们需要建立一套对人民负责的新型社会资本主义体系，平衡私人激励与公共责任。通过监管和更完善的民众基本安全保障，我们可以建立一个更强大、更服务于国家的经济体。"
 AST_a_voice_for_all_australians: "代表所有澳大利亚人的声音"
 AST_a_voice_for_all_australians_desc: "我们来到这里不是为了推行不温不火的改革。无论我们采取什么行动，党都会跟随，如果他们不跟随，我们会想办法让他们步调一致。真正的战场在参议院，我们目前没有多数席位。要想通过任何法案，都需要争取反对党的支持和独立性，才能增加我们的席位。\n\n如果我们足够努力地摇晃这棵树，并且把我们的计划推销得恰到好处，或许就能赢得一些选票，最终通过一些有意义的法案。"
 AST_work_with_the_party: "与党合作"
 AST_work_with_the_party_desc: "工党一次又一次地证明了自己是澳大利亚的最佳希望。凭借英明的领导和经受考验的道德情操，我们继续推进立法，这些立法不仅造福于当代人民，也造福于子孙后代。\n\n一位明智的领导者也懂得何时倾听党内意见。没有党的团结，我们的改革就无法通过；而目前政策通过的道路异常狭窄，我们绝不能掉以轻心。提出切实可行的政策是我们使其在众议院和参议院获得通过的唯一途径。"
 AST_form_the_pact: "缔结盟约"
 AST_form_the_pact_desc: "如果我们想要通过任何更激进的提案，就必须与绿党接触。他们是议会里过于乐观的嬉皮士。与他们的领袖鲍勃·布朗会面或许足以团结他们所有人，尽管这样做会彻底疏远自由党的支持，事实上，我们甚至可能会失去一些自己的党员。\n\n即便如此，我们仍然需要他们的帮助才能到达终点。"
 AST_something_has_to_give: "总得有所妥协。"
 AST_something_has_to_give_desc: "我们的社会这块木板下已经腐烂了。尽管我们取得了诸多进步，也做出了诸多社会努力，但在澳大利亚，如果境遇足够糟糕，任何人都可能陷入困境，而事实上，许多人确实如此。当然，社会保障体系是有的，但当我们的福利金低于贫困线，甚至老年人也被迫外出打工以求生存时，社会就必须做出改变。\n\n我们的社会保障体系已经崩溃，我国许多人已经深切感受到这一点。我们不能袖手旁观，任由情况继续恶化。"
 AST_meet_with_the_unions: "与工会会面"
 AST_meet_with_the_unions_desc: "如果我们想在改革方面取得进展，最好的切入点就是工会。毕竟，工党是由工会创立的，而且工会是我们最大的支持者。\n\n这肯定有助于我们与工人建立联系，并表明我们愿意合作。"
 AST_earnest_cheques_for_the_needy: "为贫困者提供的诚意支票"
 AST_earnest_cheques_for_the_needy_desc: "对于那些生活在贫困边缘的人来说，一次意外事故或一笔突如其来的账单就可能让他们彻底陷入困境。我们对公众的支持措施包括发放一些一次性现金补贴，以改善财政状况，并保护弱势群体免受突如其来的经济打击。"
 AST_new_consensus: "新共识"
 AST_new_consensus_desc: "自20世纪80年代以来，“华盛顿共识”一直是各国经济体的标准处方。如今，随着新兴的全球化经济体挑战这一共识，澳大利亚也必须找到属于自己的共识。虽然我们的方案不像华盛顿那样自由放任，也不像北京那样专制，但我们将采取一种巧妙的干预方式。"
 AST_insulate_the_homes: "房屋隔热"
 AST_insulate_the_homes_desc: "每晚都有成千上万的澳大利亚家庭在寒冷中入睡，这实在令人愤慨。据我们估计，约有40%的房屋没有隔热层，这导致有钱人不得不支付更高的电费用于取暖，更不用说那些无力支付的人了。我们将在全国范围内推出一项计划，为房主承担安装隔热层的费用。"
 AST_fair_shake_of_the_sauce_bottle: "轻轻摇晃酱汁瓶"
 AST_fair_shake_of_the_sauce_bottle_desc: "任何一对夫妇在备孕时面临的最大问题是经济拮据。在孩子最关键的成长阶段，抽出时间照顾孩子对很多人来说都是难以承受的，尤其是在当前瞬息万变的经济形势下。鉴于我们有责任关爱澳大利亚人民，我们应该尽我们所能地支持他们。\n\n在澳大利亚，所有父母，包括领养父母，都将有资格享受26周带薪育儿假。每个人都将获得公平的机会成为父母，因为本届政府秉持公平原则。"
 AST_housing_initiative: "推出房屋"
 AST_housing_initiative_desc: "我们已与私人承包商达成协议，在未来十年内协助我们在澳大利亚各地建造超过2万套新的社会住房，并修缮约1.2万套不适宜居住的房屋。仅在第一年，这将为数千名无家可归者提供住所。"
 AST_the_care_act: "社会保障修正案"
 AST_the_care_act_desc: "经过与党内及自由党的长期谈判，我们终于控制住了福利立法。通过改革资格认定和工人福利项目，社会福利联络中心将惠及近百万澳大利亚人。养老金领取者的养老金将大幅增加，同时，为了安抚反对派，我们提高了领取养老金的年龄，并收紧了医疗保险。此外，我们还增加了数百个奖学金名额，并提高了残疾人补助金。\n\n在政府的支持下，越来越多的澳大利亚人将过上更轻松的生活。"
 AST_shelter_for_all: "人人有房"
 AST_shelter_for_all_desc: "如果我们目前对国家的投资还不够大，那么我们解决无家可归问题的计划更是让那些预算鹰派人士惊慌失措。我们放弃了最初计划在十年内建造两万套社会住房，改为在同一时期建造十万套。明年建成的第一批住房将直接用于安置最需要帮助的人。\n\n即使是党内最进步的人士也认为这项计划过于大胆，有些人甚至认为它根本不可能实现。如果这项计划要切实可行，我们的大部分建设能力都必须用于初期阶段。"
 AST_root_and_branch_approach: "根枝法"
 AST_root_and_branch_approach_desc: "我们许多更广泛的改革都可以被描述为“彻底变革”，也就是说，像医疗保健或住房这类问题的改革必须从根本上入手。我们需要建立独立审查机制，或者彻底重新设计流程，以帮助更多澳大利亚人，并提高运营效率。我们提出的福利制度改革计划耗资巨大，超出了我们目前的承受能力，导致我们面临巨额赤字。\n\n我们当然想让每个人都满意，但资金总得从某个地方来。"
 AST_a_stronger_net: "更强大的网络"
 AST_a_stronger_net_desc: "在绿党的协助下，我们制定了可能是英国有史以来规模最大的福利法案。这项法案将对现有的福利能力和资格进行全面改革，推出大规模项目，旨在帮助数百万贫困人口，并将福利金提高到足以维持生计的水平，同时提高政府规定的最低工资标准。毫无疑问，这将对福利行业产生巨大影响，对于我们这样规模的国家来说，这或许是最接近全民基本收入的方案。但如果我们想要做出能够超越我们这一代人的社会变革，那么这就是最佳选择。\n\n我们会失去一些党内预算鹰派人士，但为了我们所取得的成就，这是值得的。"
 AST_bill_of_rights: "我们的权利法案"
 AST_bill_of_rights_desc: "选举结束后，许多人呼吁制定一部“权利法案”，从根本上塑造政府的运作模式，重点关注公民权利。现在，我们有机会提出一项联邦法案，以实现这一目标。该法案将落实各项保护性权利，改革司法系统和权力机构，并向议会提交一份宪章，履行我们对澳大利亚人民维护平等、自由和安全的责任。总之，我们将全面推进这项法案的制定。"
 AST_the_social_contract: "社会契约"
 AST_the_social_contract_desc: "照护和支持体系已经萎缩衰败到如此地步，以至于越来越多的人无法获得这些服务，人数已增至众多。澳大利亚人并非真正享有自由，因为这个体系一次又一次地让他们失望，使他们甚至连最基本的生活必需品都不得不依赖国家救济。在其他地方，同样的体系也忽视了那些需要照护的人。\n\n现在，改变现状是我们的责任。那些被忽视和处于弱势地位的人将会得到关注。这种制度不能再继续下去了。"
 AST_a_national_congress: "国民大会"
 AST_a_national_congress_desc: "尽管澳大利亚原住民和托雷斯海峡岛民大会是朝着统一进步迈出的一步，但它在发展过程中迷失了方向，其真正实现代表权的初衷也从未真正实现。通过与澳大利亚人权委员会合作，我们可以组织一个新的澳大利亚原住民全国大会来取代澳大利亚原住民和托雷斯海峡岛民大会，从而使我们能够更积极地与澳大利亚原住民携手合作，共同推行以平等和积极变革为核心的政策。"
 AST_visit_the_schools: "参观学校"
 AST_visit_the_schools_desc: "就像我们的经济革命一样，学校系统也需要进行自上而下的改革。我们已经制定了计划，将大力投资翻新和新建职业学校，我们可以先走访昆士兰州的一些地方学校，了解当地情况，以此作为改革的开端。"
 AST_digital_education: "数字化教育"
 AST_digital_education_desc: "互联网的突破性发展对澳大利亚人，尤其是我们的年轻人来说，是一件令人瞩目的事情。如果从小就培养他们更好地利用互联网的能力，我们的下一代就能更好地适应全新的数字世界，并规避它可能带来的风险。在教室里安装一定数量的电脑，并进行其他设施的翻新，将使我们能够更好地迎接现代社会的到来。"
 AST_a_national_agreement: "国家协议"
 AST_a_national_agreement_desc: "一些反对党成员倾向于与我们合作制定原住民政策。如果我们能说服他们认识到这些问题的紧迫性，我们就可以以紧急措施的形式推动相关法案的通过，迅速实施针对偏远地区慢性病、识字率和初级医疗保健服务的计划。"
 AST_state_health_reform: "州卫生改革"
 AST_state_health_reform_desc: "通常情况下，地方政府会自掏腰包管理公立医院。然而，近年来，由于目前的医疗服务远远不够，他们要么管理松懈，要么面临严重的资金问题。我们要想成功进行资金改革，唯一的办法就是接管医院的资金管理，同时保留地方政府负责医院的日常运营。\n\n我们可以自行进行评估，看看哪些方面需要改进，然后根据评估结果采取行动。如果他们抗议，我们就得威胁要举行宪法公投，赋予联邦政府对公立医院的完全控制权，到时候看看他们还会不会叫嚣。\n\n这一次，责任到我们头上了。"
 AST_equal_opportunity: "平等机会"
 AST_equal_opportunity_desc: "我们无权阻挠争取婚姻平等权利的诉求。即便我们自己不积极倡导，我们仍然可以就此举行全民公投，了解公众的看法。如果公投通过，而反对派仍然反对我们，我们可以以此为契机，在下次选举中争取权益。"
 AST_respect_traditional_values: "尊重传统价值观"
 AST_respect_traditional_values_desc: "一个公正的政府有责任倾听大多数人的需求，同时也要尊重少数人的生计。澳大利亚的繁荣发展离不开稳健谨慎的领导。我们不会强迫任何人烘焙违背其宗教信仰的蛋糕，也不会挑起文化战争。是时候做出改变了。"
 AST_clean_feed: "清洁网络计划"
 AST_clean_feed_desc: "即使有了我们的数字化教育项目，我们也无法阻止互联网上最恶劣的影响波及青少年。时至今日，网络欺凌和网络犯罪仍然威胁着澳大利亚人生活的方方面面。我们将把网络犯罪最严重的罪犯名单交给互联网服务提供商，他们会要求这些罪犯遵守相关规定。"
 AST_close_the_gap: "缩小差距"
 AST_close_the_gap_desc: "我们在处理原住民事务时，始终坚持的核心政策是缩小原住民与非原住民在预期寿命、教育成就和经济机会方面的差距。尤其值得注意的是，澳大利亚原住民的预期寿命比非原住民公民少近10年。他们的识字率也远低于非原住民，儿童死亡率更是非原住民的两倍。\n\n你明白我的意思。我们需要提出立法，其中包含一系列致力于这项事业的广泛项目，并制定切实可行的目标来改善原住民的生活。"
 AST_tackle_the_mining_oligarchy: "应对矿业寡头垄断"
 AST_tackle_the_mining_oligarchy_desc: "那些一直以来影响着我们政府的阴险势力，至今仍在继续，这都归功于他们从我们土地上榨取的财富。几个世纪以来，他们积累了巨额财富却拒绝分享，而他们雇佣的工人却只能拿到微薄的工资，而且很容易被解雇。他们早就应该支付他们应得的份额，澳大利亚人民也应该因这片土地上出产的矿石而获得回报。"
 AST_draft_the_legislation: "起草立法"
 AST_draft_the_legislation_desc: "鉴于我们想要达成的目标，我们需要起草一部终极版的税收法案，确保没有任何漏洞，并尽可能汇集所有相关领域的专家参与其中。如果我们要做这件事，那我们做的就是正确的事。"
 AST_tax_the_super_profits: "对超额利润征税"
 AST_tax_the_super_profits_desc: "在议会熬过无数个夜晚，我们终于找到了对抗大型企业的利器。动态税率制度，针对规模最大的公司，只对公司远超正常收入水平所获得的“超额利润”征税，最终将把矿业繁荣时期攫取的巨额利润分流到普通民众手中。由于如果公司业绩不佳或运营成本超过收益，则无需缴纳任何税款，因此该制度也应避免被贴上“不公平税收”的标签。"
 AST_throw_businesses_a_bone: "给公司一根骨头"
 AST_throw_businesses_a_bone_desc: "我们各州之间的监管简直令人难以忍受。这不仅让大大小小的企业损失惨重，也严重阻碍了商业流通，最终只会推高本地商品价格。如果我们想给各行业一些好处，表明我们并非有意刁难他们，我们可以与商业委员会合作，打造一个无缝衔接的全国经济体系。这个体系能够精简繁文缛节，换取更便捷的出行和更顺畅的贸易。"
 AST_tear_off_special_interests: "撕掉特殊利益"
 AST_tear_off_special_interests_desc: "利益集团已成为我们政治体系中一股有害的力量，本应早就加以遏制。它们对我们的选举周期和政治进程施加了不公平的影响。我们无法代表对方发言，但通过调查我们自己党内是否存在不公平的影响，或许能够切断一些利益集团的触角。这或许无法彻底根除它们，但会让我们在未来更容易地清除它们。"
 AST_own_our_resources: "掌控我们的资源"
 AST_own_our_resources_desc: "政府最大的错误之一就是允许外国拥有我们的资源，而我们自己却不持有任何股份。诚然，我们从这些资源的持续增长中获益匪浅，全球经济的成功也自有其道理，但我们也不应忽视本国的利益。\n\n我们已经从矿业公司那里获得了开采我们土地的特许权使用费，如果我们提高价格，他们短期内可能会抗议，但最终他们会坐下来谈判，我们可以更好地协商如何处理我们国家的矿产资源。"
 AST_spirit_of_gough: "高夫的精神"
 AST_spirit_of_gough_desc: "高夫·惠特拉姆的悲剧故事注定载入史册。他野心勃勃，却最终被身边的权势所扼杀。尽管他的政治生涯短暂，但他作为进步政治的伟大革命家却光芒四射，而他试图遏制矿业日益增长的控制，最终导致了他的垮台。\n\n或许现在实现他设想的那种大规模所有权模式已经为时过晚，但我们仍然可以让他感到骄傲。通过创建第一家国营矿业公司，我们可以绕过其他公司，从我们自己的矿山开采矿石，并将所有利润和收益都据为己有。"
 ast_spirit_of_gough_tt: "创建§0石油和矿产管理局§!"
 AST_twenty_twenty_summit: "2020年峰会"
 AST_twenty_twenty_summit_desc: "2020年峰会是我们政府更加积极参与治理的开端。这是一个开放的民主论坛，邀请了1000名社区领袖、专家和公民，共同集思广益，为国家未来制定战略。让澳大利亚人自己决定自己的未来，是开启我们任期的绝佳方式，也表明我们致力于变革。"
 AST_kyoto_accords: "京都承诺"
 AST_kyoto_accords_desc: "批准京都议定书仅仅是开始。要使其发挥最大潜力，我们还需要继续努力，不放过任何机会。"
 AST_big_australia: "大澳大利亚"
 AST_big_australia_desc: "这个概念是在2020年的峰会上提出的。人口较少一直是阻碍我们跻身世界强国行列的少数几个因素之一。目前，我们的生育能力有限。新计划包括到2050年将人口增加到3600万的措施，其根本在于扩大移民接收范围。一切都需要精简高效。"
 AST_seasonal_labour_scheme: "季节性劳动力计划"
 AST_seasonal_labour_scheme_desc: "短期内，只有依靠大量引进外籍劳工来缓解人口稀少带来的瓶颈。放宽限制，引导更多外籍劳工进入我国产业，可以暂时维持产业增长，并延缓未来可能出现的萎缩。"
 AST_our_sibling_state: "我们的兄弟之国"
 AST_our_sibling_state_desc: "很少有人能体会到我们与人口比悉尼少的国家之间如此激烈的竞争。无论是体育还是其他任何方面，只要他们赢了，你就永远听不到他们的抱怨。我们的经济已经相当同步，但我们一直在努力达成一项贸易协定，以有效地将我们两国在经济上紧密联系起来。如果协定成功，贸易和投资将在我们之间像水一样流动。"
 AST_pacific_islands_forum: "太平洋岛屿论坛"
 AST_pacific_islands_forum_desc: "每隔几年，我们新西兰和岛国都会举行会议，讨论区域利益并应对面临的挑战。这一直是密切关注我们海洋邻国动态的有效途径。今年，劳工许可问题被提上了议程，一些国家还讨论了联合园艺开发临时许可的问题。无论我们是否同意，这项计划无疑有其可取之处。"
 AST_end_the_imperialism: "终结帝国主义"
 AST_end_the_imperialism_desc: "或许，身居国家最高职位让我豁然开朗。在前人营造的根深蒂固的环境中，我们有时确实面临选择：是继续在世界各地施加不必要的干涉和伤害，还是退后一步，尊重我们周围已经形成的界限？"
 AST_maintain_obligations: "履行义务"
 AST_maintain_obligations_desc: "我们对历届政府及其在太平洋及其他地区建立的利益负有一定的责任。我们的政策往往会影响数百万人的生活，因此我们必须采取温和的方式。过早地对双边关系采取强硬手段只会对我们自身不利。最好的办法是维护现有关系，并在力所能及的范围内加以改善。"
 AST_the_free_trade_area: "自由贸易区"
 AST_the_free_trade_area_desc: "与东盟国家进行数月的谈判为我们带来了一个极其有利可图的机会。虽然我们国家和新西兰不符合加入贸易集团的标准，但我们仍然可以通过成为外部“伙伴”来获得一些好处，本质上是在我们和亚洲之间建立一个自由贸易区。"
 AST_the_beginning_of_something_new: "新篇章的开始"
 AST_the_beginning_of_something_new_desc: "尽管东盟在过去几十年里有效地团结了亚洲国家，但太平洋地区的三大经济体之间的联系仍然十分薄弱。日本、印度和中国或许各自拥有独立的协议，但与欧洲建立的联盟相比，这些协议显得微不足道。\n\n虽然这的确是一个雄心勃勃的目标，但如果我们能够将这些国家，包括我们自己的国家，联合起来，建立一个经济联盟，那么经济繁荣仅仅是开始。仅仅依靠统一的货币，就能实现太平洋地区的和平。"
 AST_address_the_tiger: "向老虎致敬"
 AST_address_the_tiger_desc: "目前与印度的关系进展顺利，甚至可以说是非常融洽。我们不应该破坏这种良好的局面，但谁又能说我们不能让它变得更好呢？他们与中国的关系是我们组建联盟面临的最大障碍之一。如果我们能取得某种突破，剩下的工作就会轻松得多。"
 AST_an_asian_pacific_union: "亚太联盟"
 AST_an_asian_pacific_union_desc: "为了实现我们的目标，每个环节都必须做到完美契合。我们能走多远，以及我们在地缘政治历史上能留下多大的印记，都将由这些会谈决定。我们的努力终将获得回报。"
 AST_renegotiate_with_papua: "处理船只危机"
 AST_renegotiate_with_papua_desc: "每年都有成千上万的移民非法登陆我国海岸，而且这个数字似乎还在不断增加。随着现有基础设施不堪重负，我们需要重新审视离岸解决方案，以应对当前的危机。"
 AST_keep_the_gears_turning: "保持运转"
 AST_keep_the_gears_turning_desc: "我们与世界的联系太紧密了，不可能就此抽身而出。这种通过代理人进行遏制的政策只有在我们持续发挥作用、并证明我们言出必行的情况下才能奏效。背弃的风险实在太高了。没有更大的利益可言。没有正当的理由。"
 AST_world_hold_on: "世界坚持"
 AST_world_hold_on_desc: "我们需要向其他国家发出一个明确的信号：澳大利亚的发展远未达到顶峰。我们依然屹立不倒，并且正在走向国际。通过放松对大型企业发展的监管来促进外商投资，这种经济殖民主义值得我们引以为豪。福克斯新闻和澳拜客牛排馆事件只是我们实力的一个缩影。他们会看到的。"
 AST_assure_the_other_side: "向对方保证"
 AST_assure_the_other_side_desc: "没有企业，我们就无法生存。商业就像血液，维系着我们整个行业的运转。抛开党派利益不谈，如果没有既得利益支持企业度过当前的经济转型期，我们经济的命脉就可能停滞不前。我们需要在支持企业和支持我们之间找到平衡点，正如企业间接地支持着我们一样。"
 AST_forward_with_fairness: "秉持公平原则向前迈进"
 AST_forward_with_fairness_desc: "我们当然支持改善工人的生活，但在当前形势下扼杀企业发展绝非明智之举。废除《澳大利亚劳动法》并引入集体谈判制度，将表明我们愿意维护企业的利益。毕竟，工作权应归于工人，而非工会。"
 AST_represent_the_worker: "代表工人"
 AST_represent_the_worker_desc: "劳动者本质上是由拥有内在尊严的人组成的，而不仅仅是经济商品。如果我们的工人不相信我们会支持他们，又怎能指望他们维护自己的权益呢？我们不能被视为为了迎合企业的意愿而牺牲我们自己人民的利益。"
 AST_the_emissions_trading_scheme: "排放交易计划"
 AST_the_emissions_trading_scheme_desc: "气候变化已成为我们这个时代最严峻的道德挑战。这不仅对我们而言，对全世界都是如此。数百个国家如今都收到了迫在眉睫的危险警告，但它们采取行动的能力却面临考验。我们能否为了子孙后代的福祉而牺牲我们自身产业的舒适？我们能否在推动经济发展的同时，真正承担起保护环境的重任？对我们而言，答案永远是肯定的。\n\n这项计划是我们竞选期间承诺时间最长的方案之一，旨在限制企业的二氧化碳排放量。如果企业希望排放更多二氧化碳，则需要政府发放许可证，或者支付高额费用，这将导致短期内能源产量下降。该计划的目标是将我们的二氧化碳排放量降低到2000年之前的水平，同时鼓励发展可再生能源，但毫无疑问，它也会为我们带来相当可观的新收入。"
 AST_cut_the_csiro: "削减澳大利亚联邦科学与工业研究组织预算"
 AST_cut_the_csiro_desc: "可惜的是，联邦科学与工业研究组织一直没有尽到应有的责任。按理说，如果联邦科学与工业研究组织的拨款足够多，足以完全资助其他机构，应该能有所作为，但过去几十年里，成本不断攀升，却鲜有产出。我们需要大幅削减联邦科学与工业研究组织的预算才能让一切重回正轨，而这不会影响我们的财政收入。"
 AST_green_energy_incentives: "绿色能源激励措施"
 AST_green_energy_incentives_desc: "如果化石燃料正在衰落，那么可再生能源就必须崛起。不仅如此，如果我们想要在未来实现全国范围内的普及，就必须鼓励可再生能源的发展。发展地热能并投资绿色汽车创新基金，将使我们朝着正确的方向前进。"
 AST_fair_work_australia: "澳大利亚公平工作"
 AST_fair_work_australia_desc: "鉴于企业与政府之间存在脱节，本党建议设立一个关系局，代表企业利益，使我们的工作重点更好地与企业利益保持一致。此举应能废除《工作场所关系法》以及令人担忧的“工作选择”改革。如果我们在实施过程中听取工会的反馈意见，就可以在保留一些常规劳动者保护措施的同时，安抚双方的诉求。"
 AST_snip_the_red_tape: "简化繁文缛节"
 AST_snip_the_red_tape_desc: "尽管我们拥有一个相对统一的联邦，但各州政府之间的合作远未达到我们期望的水平。如果一家企业想要注册，就必须分别填写其运营所在州的表格并缴纳费用，因此，如果一家企业在两个州开展业务，就需要缴纳双倍的费用并填写双倍的表格。建立一个全国统一的在线注册系统，将使全国任何企业都能一次性完成注册，然后直接开展业务。"
 AST_for_the_common_farmer: "为了普通农民"
 AST_for_the_common_farmer_desc: "自本世纪初以来，我们的农民一直处境艰难。其中最令人担忧的莫过于千年干旱，尽管我们采取了相关政策，但这场干旱仍然持续阻碍着农业复苏。与倡导者们坐下来共同探讨，将有助于我们找到切实可行的解决方案。"
 AST_walkable_cities: "20分钟城市"
 AST_walkable_cities_desc: "我们最大的斗争发生在街头。工业革命初期，市民们被挤进狭窄的巷道，被迫将柏油路面作为社交场所。自那时起，我们的社区意识逐渐萎缩，沦为室内娱乐的牺牲品。我们无法强迫人们走到户外，但我们可以引导他们。\n\n借鉴墨尔本市政府制定的“20分钟城市规划”，我们可以放宽主街噪音限制，并资助一系列创意项目和节庆活动，吸引人们重返街头，重建社区意识。再加上免费的青少年项目和基础设施扩建，我们的社区将在几年内成为充满活力的文化中心。"
 AST_keep_them_safe: "保护他们"
 AST_keep_them_safe_desc: "澳大利亚没有国兽，尽管大多数人认为红袋鼠就是。红袋鼠几乎是举世公认的象征，但同样多的人也知道生活在内陆森林里的可爱小家伙们。无论是伐木公司还是疾病，考拉的数量都在逐年下降，而且情况还在恶化，然而人们却很少采取保护措施。如果我们提名考拉为受保护物种，就能采取更多措施来保护这些令人难忘的有袋动物，使它们免于灭绝。"
 AST_industry_research_bank: "英联邦研究银行"
 AST_industry_research_bank_desc: "我们的研究之所以停滞不前，完全是因为我们放任不管。对关键领域的投资不足，阻碍了我们的机构发挥其应有的作用，突破重重障碍。增加预算，提高目标。"
 AST_natos_best_friend: "北约最好的朋友"
 AST_natos_best_friend_desc: "澳大利亚已经是北约最亲密的非成员国盟友之一。我们与北约进行联合训练，共同执行维和任务，并共享情报。如果能得到正确的支持，我们在太平洋地区的立场将得到极大加强。尽管我们的中立立场有其优势，但现在是时候做出更紧密的承诺了。"
 AST_from_the_ashes: "浴火重生"
 AST_from_the_ashes_desc: "既然我们重新掌权，就必须集中精力赢得下次选举。我们的政策必须着眼于短期利益，而要团结全党支持我们，既需要一些鼓舞人心的激励，也需要大量的游说。"
 AST_a_new_dawn: "新曙光"
 AST_a_new_dawn_desc: "公众需要看到工党焕然一新。工党必须摆脱内讧的旧形象，重塑能力和可靠性，以挽回选民基础。"
 AST_repair_the_party: "修复党"
 AST_repair_the_party_desc: "我们与党派的旧关系或多或少已经破裂。更糟糕的是，那个让我们被推翻的制度仍然存在。根除现行机制以减少领导层政变的发生并重写党规是我们解决问题的唯一方法。"
 AST_fight_back: "反击"
 AST_fight_back_desc: "如果新闻集团旗下的媒体以为他们可以继续抹黑我们而我们却无言以对，那他们就大错特错了。辩论是双向的，我们会毫不留情地反击。"
 AST_on_the_campaign_trail: "竞选之路"
 AST_on_the_campaign_trail_desc: "过去几年确实不太理想，工党也确实迷失了方向。我们走访了澳大利亚各地城乡民众，深入了解影响他们的实际问题，这表明我们已经准备好重回倾听民意的政党行列。而这一切都将从宣布参加全国代表大会开始。"
 AST_win_manufacturers: "赢得制造者"
 AST_win_manufacturers_desc: "我们第二个任期伊始便强势推出《澳大利亚就业法案》。这项耗资20亿澳元的计划旨在为7000名制造业工人提供再培训，帮助他们转型进入生产领域，以应对我们传统的汽车和纺织市场面临的裁员困境。这是应对当前行业低迷的切实可行的解决方案。"
 AST_cast_the_die: "掷骰子"
 AST_cast_the_die_desc: "一切准备就绪，澳大利亚人民也已准备好选出他们的下一任领导人。我们已竭尽所能做好准备，并阐述了我们的愿景，现在只希望选民们能够认同我们的愿景。"
 AST_the_gillard_gov: "吉拉德政府"
 AST_the_gillard_gov_desc: "本届政府信奉奖励那些最勤奋工作的人，而不是那些抱怨最多的人。本届政府相信，应该奖励那些日复一日在工厂、农场、矿山、工厂、教室和医院辛勤工作的人，奖励那些勤劳、正直、努力的人。那些遵守规则、早起上班、送孩子上学、与邻里守望相助、热爱祖国的人。\n\n我们国家拥有诸多得天独厚的优势，但国家财政状况却已恶化臃肿，到了令人担忧的地步。我向每一位澳大利亚人保证，在我们的领导下，预算必将重回健康轨道。我们将肩负起前人的重任，致力于建立一个财政稳健、实力雄厚的政府，一个真正了解民众需求，而不仅仅是少数人诉求的政府。\n\n媒体政治终将结束。对产业需求的漠视终将结束，尊严和感性的品质终将回归。"
 AST_form_the_minority_coalition: "组建少数派执政联盟"
 AST_form_the_minority_coalition_desc: "工党的未来现在取决于我们能否组建政府。"
 AST_go_green: "走向绿党"
 AST_go_green_desc: "绿党虽然有时会背后捅刀子，但他们对我们而言一直是个有用的盟友。与他们谈判几乎不成问题，而且他们的大部分政策倾向与我们一致。当然，我们可能需要在某些方面做出一些象征性的改革，但在关键时刻，他们会支持我们。"
 AST_wrangle_liberal_defectors: "争取自由派叛逃者"
 AST_wrangle_liberal_defectors_desc: "一些自由党和国家党的现任成员对我们的纲领表现出了兴趣，有些人甚至因为最近的党内纷争而选择退出。找到他们，并邀请他们加入我们的政府，以换取他们的支持，应该不难，这也表明我们并不排斥与反对党合作，共同维护保守价值观。"
 AST_clean_energy_act: "清洁能源法案"
 AST_clean_energy_act_desc: "在排放交易体系启动失败后，一项争议较小的替代方案应运而生，旨在应对日益增长的碳排放。该法案的具体范围尚未完全明确，但与ETS类似，其目标是通过引入新税收来限制二氧化碳排放，并鼓励清洁能源生产。"
 AST_clean_energy_creation: "清洁能源创造"
 AST_clean_energy_creation_desc: "我们在应对气候危机方面取得了巨大成功，现在是时候将部分资金投入到这项计划的后续工作中了。长远目标始终是实现可再生能源摆脱对煤炭的依赖。让我们开始转型吧。"
 AST_address_the_stolen_generations: "向被偷走的一代人致敬"
 AST_address_the_stolen_generations_desc: "反对派内部有足够的支持，让我们能够就“被偷走的一代”发表讲话，而不会显得是在借着国家道歉的东风。这无疑会让我们显得非常具有跨党派精神，或许也能给社区中的一些人带来慰藉。"
 AST_correct_the_mouthboxes: "修正大嘴巴"
 AST_correct_the_mouthboxes_desc: "企业和政治竞选者被允许在网络和电视上公然撒谎，却几乎不受任何惩罚。虽然很难证明这种放任自流的行为存在恶意或造成伤害，但我们不能允许这种令人担忧的趋势继续下去。制定法律惩罚误导性广告或帖子，应该能够遏制这种趋势，并让政治回归理性。"
 AST_let_debate_decide: "让辩论来决定"
 AST_let_debate_decide_desc: "绿党提交给我们的法案之一旨在扩大同性恋者的自由。我们的政府对此仍持观望态度，甚至反对朝这个方向采取突然行动，但我们可以交由议会以公平的方式做出决定。"
 AST_ndis: "参与国家残疾保险计划"
 AST_ndis_desc: "事实很简单，残疾可能影响我们任何人，因此它影响着我们所有人。很少有人能在经济上做好应对残疾后果的准备，而现在，那些面临孤立、贫困和尊严丧失的人只能依靠我们为残疾人提供的少量福利。\n\n国家残疾保险计划的推出，或许是自高夫·惠特拉姆推行全民医疗保健制度以来最重要的扶贫举措。数百万身处困境的人们将获得所需的帮助，国家也将因此而更加自豪。"
 AST_the_gonski_review: "贡斯基评论"
 AST_the_gonski_review_desc: "学期伊始，我们委托开展了一项学校系统评估，旨在找出需要改进的不足之处。评估结果发现，社会经济地位和资金使用效率低下导致教育成果差距日益扩大。简而言之，获得资金较少的公立学校最终各项指标都更差。\n\n必须对教育经费进行彻底的重新分配，才能解决这个问题，帮助我们的学生。毕竟，他们是我们国家的未来。"
 AST_take_less: "花费少"
 AST_take_less_desc: "自由党鲜有正确之处，但他们在保持低税收方面做得对。如果我们拿走了大部分劳动成果，又怎能指望普通澳大利亚人珍惜他们劳动所得呢？民众经济状况越好，收入就越高。"
 AST_get_more: "获得多"
 AST_get_more_desc: "自建国以来，我们国家就一直征收罪恶税，但近年来，为了满足下层阶级沉溺于堕落活动的权利，罪恶税已被弃之不用。对我们来说，在“迎合社会”和坚守道德底线之间做出选择，其实很容易。"
 AST_regulate_the_unions: "规范工会"
 AST_regulate_the_unions_desc: "无论你是否喜欢，工会从其本质来看，就是经济增长的阻碍。它们侵蚀了工人享有的工作自由，以及企业的雇佣权利。工会利用其政治权力控制政府、扼杀繁荣，实际上扼住了我们的咽喉。\n\n需要通过立法来限制他们的权力范围，并将国家的政治控制权留在政府内部，而不是被这些极左的小官僚所把持。"
 AST_national_broadband_network: "国家宽带网络"
 AST_national_broadband_network_desc: "国家宽带网络项目至今已开发近十年，数十亿澳元已投入其中，旨在使澳大利亚各地的网络速度达到现代水平。该项目耗时过长，反对者却依然对成本高昂大加指责。如果我们削减开支有任何意义，那么像这样的支出绝对物有所值。"
 AST_back_in_black: "重返黑色"
 AST_back_in_black_desc: "无需指责任何人，我们的开支已经过度膨胀，肆意挥霍。浪费现象严重影响着我们的预算，任何一届政府都不应该为上一届政府的过错买单。我们必须竭尽全力扭亏为盈，并控制通货膨胀。没有“如果”，没有“但是”。我们别无选择，绝不能失败。"
 AST_slam_the_door_on_them: "把门砰地关上"
 AST_slam_the_door_on_them_desc: "鉴于我们的福利支出已经膨胀到如此程度，我们首要的任务应该是审视残疾人服务的资格标准。将申请门槛提高到合理水平，就能剔除一些并非真正需要帮助的“蹭吃蹭喝”者，同时削减一些浪费资源的开支项目，也能使支出回到更可接受的水平。"
 AST_scrounge_a_penny: "偷偷摸摸地攒点钱"
 AST_scrounge_a_penny_desc: "为了尽可能地节省开支，有时我们必须发挥创意，尤其是在增税方面。在我们政策刚刚起步的时候就大张旗鼓地宣布增税，无疑会削弱我们的支持率。相反，如果我们悄悄地将医疗保险税从1.5%提高到2%，那些为此买单的人几乎不会察觉，而我们却能为预算积累一笔可观的额外资金。"
 AST_digitise_the_tvs: "频道数字化"
 AST_digitise_the_tvs_desc: "在米尔杜拉的试点项目取得成功后，我们正在全国范围内推广网络切换，用机顶盒替换旧的连接方式。整个推广工作由我们全权负责，这将使即使是偏远地区的澳大利亚人也能收看一系列画质更高的全新频道。娱乐的平等化由此开启。"
 AST_our_own_white_paper: "我们自己的白皮书"
 AST_our_own_white_paper_desc: "澳大利亚国防军一直以来都是无数国家（无论远近）的神圣盾牌，发挥着至关重要的作用。随着对保护的需求不断增长，预算也随之增加，政府的各个部门都难免存在浪费现象。军队仍将保持一贯的战斗力，但必须彻底整顿其存在的不足之处。"
 AST_plain_cigarette_packaging: "普通香烟包装"
 AST_plain_cigarette_packaging_desc: "除了削减开支之外，应对癌症危机一直是我们的首要任务之一。政府投放的广告发挥了一定作用，但几乎每家商店都能买到香烟仍然是一个核心问题。与其彻底禁止吸烟，不如用警示吸烟危害的小型广告取代品牌包装，这样就能让人们无法忽视吸烟与癌症之间的联系。\n\n这既能让家长承担起责任，又能吓唬住年轻人。"
 AST_put_the_squeeze_on_them: "施加压力"
 AST_put_the_squeeze_on_them_desc: "我们州医疗改革的一部分工作是审查各州目前的医疗支出，并对其进行修订，以便更及时、高效地提供医疗服务。这一次，我们将提出一种不同的审查方案，旨在消除支出浪费。就像上次一样，他们可能会反对我们，但最终我们会竭尽全力把每一分钱都收回预算。"
 AST_australia_works: "澳大利亚工程"
 AST_australia_works_desc: "这项名为“以工代赈”的计划旨在将“以工代赈”的理念融入政府运营的全州建筑服务体系，为领取福利的人员提供稳定的工作，并创造新的就业机会，以维持目前萎缩的建筑业的运转。这项计划雄心勃勃，但对于使国家重回正轨至关重要。"
 AST_free_the_market: "自由的市场"
 AST_free_the_market_desc: "如今，我们美丽的国家正被不堪重负的政府和被剥削的私营部门所束缚。我们一方面拖慢了发展步伐，另一方面又拒绝让企业自主发展。通过削减税收负担、将闲置办公空间私有化来限制这种控制，才是我们所需要的振兴之道，也能让自由市场发挥作用。"
 AST_mediate_with_the_mines: "与矿区进行调解"
 AST_mediate_with_the_mines_desc: "工党与矿业之间的关系并不理想。如果我们想与他们携手推进改革，就必须做出重大转变，而转变的起点在于双方的合作。举办各种活动，探讨双方的需求和合作机遇，将为我们未来的工作奠定基础。"
 AST_endorse_the_magnates: "支持行业大亨"
 AST_endorse_the_magnates_desc: "我们最大的矿业公司之一的首席执行官吉娜·莱因哈特已直接与政府接洽，希望顺利引进1700名技术娴熟的外国工人，以补充西澳大利亚新建矿山的劳动力。吉娜迄今为止一直对新政府给予大力支持，如果我们想与矿业公司合作，与她建立良好的关系或许是至关重要的第一步。"
 AST_entice_competition: "诱发竞争"
 AST_entice_competition_desc: "如果工会担心垄断的形成，那就应该向外国公司开放市场。几个世纪以来，竞争一直是经济稳定发展的机制，澳大利亚经济也不例外。多元思想的融合正是这个国家最初建立起来的基石之一。"
 AST_minerals_resource_tax: "矿产资源税"
 AST_minerals_resource_tax_desc: "超额利润税的规模过于庞大，而且出台的时机也糟透了。如果我们想平安度过这场危机，就必须与采矿业合作。合作确实为我们带来了这项小小的立法。诚然，它远远不足以削弱资源垄断，但目前也只能如此了。"
 AST_bauxite_investment: "铝土矿投资"
 AST_bauxite_investment_desc: "铝正逐渐成为21世纪最重要的金属之一。它无处不在，用途极其广泛，而且我们这里铝资源丰富。幸运的是，我们收到了这样一份矿山开发提案，作为投资请求的一部分提交给我们审议。当这样的机会出现时，明智的做法是不要错过。"
 AST_pilbara_expansion: "皮尔巴拉扩张"
 AST_pilbara_expansion_desc: "大多数采矿用地申请都在地方层面处理，然而，最近皮尔巴拉地区一处矿址的申请却恰好跨越了当地国家公园的边界。虽然该矿址距离任何保护区都相当远，但此案目前仍在高等法院审理中。为了我们的经济利益，我们或许可以施加影响，加快审批进程。"
 AST_ease_on_restrictions: "放宽限制"
 AST_ease_on_restrictions_desc: "每年都有许多采矿项目因环境限制而被取消。即使是最小的采矿点，也可能因为保护区或新的气候法规而被搁置。目前，经济增长的最大障碍是资源短缺。考虑到澳大利亚的国土面积，这简直荒谬。这种情况必须改变。"
 AST_train_it_out: "让列车进入"
 AST_train_it_out_desc: "西澳大利亚的采矿业迫切需要开通连接偏远矿区（例如皮尔巴拉矿区）与港口的开放式重型铁路。建设我们自己的政府运营铁路将打破铁路巨头对铁路基础设施的垄断，并使数十家中小型矿业公司能够将产品运往港口，从而大幅提高我国的​​出口量。"
 AST_champion_the_mets_sector: "矿业设备、技术和服务的龙头"
 AST_champion_the_mets_sector_desc: "随着我国采矿业的日益精简，各大公司开始将澳大利亚视为“世界矿场”。资源开采已不再是单一的追求，澳大利亚应该被视为采矿技术领域的硅谷。\n\n为矿业设备、技术和服务企业提供资金，并将我们自身的研发重点放在远程作业采矿上，将加速自主运输技术的发展，并改进我们现有的采矿技术。采矿业的未来将在此缔造。"
 AST_the_australian_century: "澳大利亚世纪"
 AST_the_australian_century_desc: "黄金时代并非偶然降临，也非侥幸得来。它是数十年甚至数百年辛勤耕耘的成果，而且即便有，也极为罕见。与历史上那些国家不同，我们的政府并非在黑暗中摸索前行。我们今天所做的一切都是多年积累的结果，我们的成功从一开始就经过精心策划。现在，正是我们大展宏图的时刻。"
 AST_the_foreign_ministry: "外交部"
 AST_the_foreign_ministry_desc: "亚洲，尤其是中国的崛起，使澳大利亚在经济上长期处于比周边国家更低的“利率”地位。虽然这对某些人来说可能是一个令人担忧的现实，但21世纪不会延续单极格局，这为我们带来了巨大的机遇。如果我们愿意参与竞争并克服自身的固有观念，太平洋地区将成为一个全新的世界，我们可以选择开发利用，也可以选择拥抱它，从而造福我们的国家。"
 AST_foreign_minister_rudd: "外交部长陆克文"
 AST_foreign_minister_rudd_desc: "前任领导人或许是我们团队中最有外交经验的人选。陆克文数十年来致力于与亚洲各国开展对话，并在政府加强与亚洲各国联系方面发挥了至关重要的作用。陆克文提议开展一系列外交访问，以巩固我们在太平洋地区的地位，并将澳大利亚塑造成太平洋地区的橄榄枝。"
 AST_papua_residency: "巴布亚居民"
 AST_papua_residency_desc: "除了正式协议外，巴布亚经济已逐渐融入我们的经济体系。通过谈判达成一项全面的经济协定，最终将促成这一局面。"
 AST_soften_the_emerald: "柔化祖母绿"
 AST_soften_the_emerald_desc: "对于如此近在咫尺的邻国而言，人们理所当然地认为我们之间的关系应该融洽融洽。然而不幸的是，近来裂痕却有增无减，或许只有派遣陆克文出面缓和局势，才能挽救两国关系。"
 AST_the_new_bear: "新熊"
 AST_the_new_bear_desc: "俄罗斯的整体性质在后苏联时期发生了变化。这个国家已经慢慢接受了资本主义的意识形态，并允许外国利益在其皮毛之下。这可能是我们在外交上插上我们的旗帜的机会，并安排一些对我们有利的事情，尽管我们之间相距遥远。"
 AST_entente_with_north_korea: "与朝鲜的协约"
 AST_entente_with_north_korea_desc: "陆克文提议前往朝鲜非军事区会见朝鲜领导人，希望以此促进两国走向和平共处。他的计划或许有些异想天开，但总体来说可行，而且这将是我们首次直接向朝鲜方面示好。"
 AST_foreign_minister_smith: "外交部长史密斯"
 AST_foreign_minister_smith_desc: "自基廷以来，斯蒂芬·史密斯一直是该党的重要成员，他也是第一个主动请缨加入外交部的人。他的政策与我们高度契合，因为史密斯希望澳大利亚成为太平洋地区的贸易枢纽，并利用新世界来提升我们在海外的经济影响力，以任何有利于国家的方式实现这一目标。"
 AST_our_glowing_deposits: "我们闪耀的矿藏"
 AST_our_glowing_deposits_desc: "矿藏就在那里，我们只需要出口。我们目前的客户一直催促我们授予矿产开采权，我们理应提供这些资源。"
 AST_the_best_of_both_worlds: "两全其美"
 AST_the_best_of_both_worlds_desc: "我们努力在复杂的平衡中寻求平衡：既要与美国保持深厚的安全防务联盟，又要与中国建立稳定的贸易相互依存关系。避免被迫在两者之间做出选择，正是我们得以维持现状的关键。"
 AST_made_in_vietnam: "越南制造"
 AST_made_in_vietnam_desc: "对许多澳大利亚人来说，当他们低头看着自己常买的商品，突然发现底部的小字写着“这不是澳大利亚制造，而是产自越南”时，感觉很奇怪。这很难接受，但当他们的口袋更鼓、商店里的商品种类更丰富时，他们很快就释怀了。"
 AST_foreign_minister_carr: "外交部长卡尔"
 AST_foreign_minister_carr_desc: "鲍勃·卡尔或许是我们名单上最现实主义者，或者至少是最务实的。卡尔的核心观点是，外交政策是一系列即兴发挥。澳大利亚既要努力成为太平洋地区的道德中心，又要不惜一切代价捍卫自身利益。如何平衡这两者，才是真正的考验。"
 AST_smother_the_pot: "搅动局势"
 AST_smother_the_pot_desc: "澳大利亚的利益已与中东地区紧密交织，那里发生的任何事情都会影响到我们。过去十年，原本暗流涌动的局势已演变成熊熊烈火，我们再也无法置身事外。"
 AST_the_big_boys_club: "大男孩俱乐部"
 AST_the_big_boys_club_desc: "联合国安理会有5个常任理事国席位，以及大约15个非常任理事国席位，每隔几年轮换一次。影响全世界的政策都是由这些国家在联合国各机构中共同决定的。鉴于我们自身的责任与世界其他地区息息相关，我们理应在安理会中占有一席之地。我们需要努力提高我们获得安理会席位的可能性。"
 AST_global_weapon_trading: "全球武器贸易"
 AST_global_weapon_trading_desc: "卡尔正利用我们在联合国的影响力，大力倡导一项全球武器贸易条约，旨在追踪并减少向不利国家和恐怖组织输送武器，同时使我国和其他西方国家的武器销售更具吸引力。这步棋走得很大胆，但他目前正在纽约积极争取支持，力求使这项条约获得通过。"
 AST_myanmar_intervention: "缅甸干预"
 AST_myanmar_intervention_desc: "缅甸的崩溃已演变成一场人道主义噩梦。无论我们选择介入还是置身事外，都将产生相应的后果。"
 AST_consuls_of_peace: "和平执政官"
 AST_consuls_of_peace_desc: "澳大利亚的命运牢牢扎根于全球合作。我们在海外的各项任务和维和行动，始终以促进乃至在必要时恢复基于规则的秩序为目标。这是我们努力践行的角色，也是我们应该维护的声誉。"
 AST_centurians_of_the_pacific: "太平洋百夫长"
 AST_centurians_of_the_pacific_desc: "自新世纪之交以来，全球干预的规则已经改变。国家安全取代了传统的公民自由，在极端主义袭击事件发生后，几乎所有西方国家都采纳了预防框架。如果我们固守过去的规则，既无法结交新朋友，也无法保护国家安全，反而会让我们自己成为攻击目标。"
 AST_the_costello_government: "科斯特洛政府"
 AST_the_costello_government_desc: "澳大利亚建国至今已逾百年，自联邦成立以来，取得了长足的发展。尽管人口仅为邻国的几分之一，但我们的经济却正迅速跻身世界最大经济体之列。我们的人民亲眼见证了周边国家变得比前几代人想象的更加富裕繁荣，然而，真正的财富仍未得到充分挖掘。\n\n我们的潜力仍然蕴藏在地表之下，如同油脉一般，等待着被开采。矿业的资金管理已经停滞，许多大型产业也变得自满。福利支出已成为预算的沉重负担，小企业仍在为进入一个日益萎缩的市场而苦苦挣扎。\n\n我们的治理方式必须改变。"
 AST_a_bastion_for_commerce: "商业堡垒"
 AST_a_bastion_for_commerce_desc: "随着太平洋沿岸各国联系日益紧密，对贸易中心的需求也愈发迫切。澳大利亚如今有机会成为贸易的灯塔，像昔日的君士坦丁堡和威尼斯一样，将各个经济体连接成一个港口。"
 AST_bring_in_the_chains: "引入链条"
 AST_bring_in_the_chains_desc: "我们从世界各地文化的引进中获益匪浅。企业也不例外。现在已经有很多企业排起了长队申请在我们这里设立公司。我认为我们应该让他们来。"
 AST_domestic_demands: "国内需求"
 AST_domestic_demands_desc: "我们和全国的蓝领工人都一致认为，本土产业至关重要。强大的国内产业应该能够抵御任何全球经济衰退，而且只要稍加注意，就一定能够做到。"
 AST_outsource_the_troubles: "外包麻烦"
 AST_outsource_the_troubles_desc: "近年来，劳动力短缺已成为我们持续增长的最大障碍。我们根本没有足够的工人来填补空缺，任何长期的解决方案都会让我们错失最佳扩张时期。我们需要将目光投向海外。"
 AST_come_one_come_all: "欢迎大家前来参加"
 AST_come_one_come_all_desc: "我们的钱应该留在澳大利亚，至少我们的工资应该如此。弥补就业缺口的最佳方法是改善经济状况。成千上万的人想来澳大利亚工作。我们所要做的就是敞开大门。"
 AST_off_with_tariffs: "减轻市场负担"
 AST_off_with_tariffs_desc: "自由经济学催生了“富足”的概念。这种观点认为，更自由的市场和更自由的消费机会必然会带来更美好的社会。这是一个极具吸引力的概念，我们的企业都渴望尝试。而那些仍然存在的沉重税收负担必须被取消。"
 AST_negotiate_with_the_rba_ast: "与澳大利亚储备银行谈判"
 AST_negotiate_with_the_rba_ast_desc: "与储备银行进行一些友好的沟通或许能为我们争取到所需的空间，从而推动经济复苏。值得庆幸的是，我们拥有足够的人脉关系，可以说服银行降低利率，并同时刺激消费支出。"
 AST_fix_the_trade_woes: "解决贸易难题"
 AST_fix_the_trade_woes_desc: "虽然我国的进出口贸易在短时间内迅速增长，但企业对贸易体系的理解和操作也日益混乱。贸易逆差和管理不善正在侵蚀利润，减缓商业进程。因此，亟需设立一个新的机构，专门负责规范和优化整个贸易流程。"
 AST_adventure_in_the_usa: "美国探险之旅"
 AST_adventure_in_the_usa_desc: "美国一直是，而且可能永远都是我们最大的投资国。它是巨无霸汉堡的故乡，自由的家园，也是所有人的朋友。如果我们不向他们寻求经济发展的下一步发展，那将是我们的失职。"
 AST_im_an_oil_man: "我是个石油人"
 AST_im_an_oil_man_desc: "它强烈呼吁我们国家应该发展自己的石油产业。我们有油井，也有适宜的地形。只是这个过程耗时太长，而我们的政府将会彻底改变这种局面。更多的石油将会涌出。"
 AST_for_queen_and_company: "为了女王与公司"
 AST_for_queen_and_company_desc: "我们在美国所做的努力已经足以吸引一些英国公司扩大其在我们农业领域的投资。"
 AST_rail_endeavors: "铁路事业"
 AST_rail_endeavors_desc: "我们之前曾与贝克特尔公司合作建设长途铁路，现在他们正与州政府共同筹划一个发展研究项目。他们已经提供了新型电力和柴油机车的技术规格。现在我们只需要签字确认即可。"
 AST_the_miracle_economy: "奇迹经济"
 AST_the_miracle_economy_desc: "媒体已经开始将我国经济的成功称为当今时代的奇迹。当然，这根本算不上奇迹。我们的成功始终依赖于我们正确的判断和谨慎的管理。因此，就像精心维护的花园一样，我们管理的成果才得以绽放出如此绚丽的光芒。"
 AST_ride_the_bubble: "乘着泡泡"
 AST_ride_the_bubble_desc: "几年前互联网泡沫破灭时，感觉就像天塌下来了一样。数十亿美元的计算机投资积累起来的股票价格突然暴跌，随之而来的是数十亿美元的损失。这一次，我们要确保计算机投资的基础稳固，建立支持增长的基础设施，并尽可能减少监管，以防止系统再次崩溃。"
 AST_silicon_dreams: "硅之梦"
 AST_silicon_dreams_desc: "我们终有一天要成为技术自主的国家，而这首先要从我们具备制造商用芯片的能力开始。我们可以从小规模做起，资助芯片研究团队，并在维多利亚州建立一个测试运行设施，以此作为启动项目。"
 AST_jobs_for_the_needy: "为贫困人群提供就业机会"
 AST_jobs_for_the_needy_desc: "“以工代赈”政策实施过程中的监管不力，我们至今仍在为此付出代价。工人本就不应该被从私营企业抽调去从事公共工程。福利制度的根本目的应该是让有劳动能力的人找到工作。我们需要一个新的方案来取代它。"
 AST_keep_it_competitive: "保持竞争力"
 AST_keep_it_competitive_desc: "工业发展越快，市场倾斜的风险就越高。如果我们放任不管，垄断就会变成祸害，而令人遗憾的是，监管是对抗垄断最有效的手段。我们可以从州一级开始协调政策，并以此为基础推进工作。"
 AST_shatter_the_iron_curtain: "打破铁幕"
 AST_shatter_the_iron_curtain_desc: "对澳大利亚而言，冷战在1973年与毛泽东握手时就结束了。此后，我们一直保持着友谊，这份友谊经受住了任何党派纷争和全球危机的考验。我们需要建立一个平台，以确保我们未来的合作安全且公开透明。"
 AST_our_man_in_beijing: "我们在北京的人"
 AST_our_man_in_beijing_desc: "我们长期担任外交部长、现任副部长的亚历山大·唐纳与中国政府及其商界人士关系密切，以至于我们党内一些人开始质疑他的忠诚所在。无论如何，要想从我们新的伙伴关系中取得任何有意义的成果，我们都需要他的洞察力。就从下一班飞往北京的航班开始吧。"
 AST_the_lithium_projects: "格林布什项目"
 AST_the_lithium_projects_desc: "格林布什锂矿项目已成为西澳大利亚社区的一项前景广阔的发展项目。该项目目标是在竣工时年产100万吨锂，届时西澳大利亚将成为全球最大的加工锂出口国之一。他们现在需要的只是一些财政支持。"
 AST_cater_to_investors: "迎合投资者"
 AST_cater_to_investors_desc: "中国开发商占我们外籍土地所有者的60%以上。这类投资正逐渐成为我们土地开发行业的支柱，因此，保持双方利益一致对于维系这种关系的顺利发展至关重要。"
 AST_the_future_fund: "未来基金"
 AST_the_future_fund_desc: "该基金最初的设想是帮助公务员缴纳退休金，但这一理念完全可以用来推动我国的海外投资。目前，它已经吸引了来自海外投资者的相当可观的资金，尤其是总部位于比利时的欧洲清算银行集团（Euroclear），现在是时候将其付诸实践了。"
 AST_a_friendly_union: "更友好的联盟"
 AST_a_friendly_union_desc: "唯一没有对我们指手画脚的组织是欧盟。他们已经取得了一些进展，争取至少在未来几年内取消对欧洲汽车在我国销售的限制。如果能去欧盟总部拜访一下，或许能加快进程，并为我们的消费者带来一些新的选择。"
 AST_fechado: "关闭！"
 AST_fechado_desc: "巴西矿业经济的日益繁荣引起了我们矿业巨头的关注，他们已向我们请愿，要求放宽矿业设备的进口管制。这样做几乎不会给我们带来任何成本，反而有助于我们与二十国集团成员国拉近距离。"
 AST_the_republic_question: "共和国问题"
 AST_the_republic_question_desc: "自我们联邦成立以来，澳大利亚实际上一直是英国王室的臣民。我们的宪法是君主制宪法，我们的国家元首仍然是联合王国。虽然它在一段时间内发挥了作用，但时代的气氛是民主的。我们不会通过世袭任命人担任公职。在我们的社会和时代，我们更喜欢凭功绩任命。 \n\n澳大利亚将迎来作为一个真正独立国家的那一天。"
 AST_how_we_sell_it: "我们如何销售它"
 AST_how_we_sell_it_desc: "获得民众对我们公投的支持将是这场角逐的最后一道难关。我们需要获得全国绝大多数选民的支持，以及六个州和领地中至少四个州或领地的支持。如果我们无法赢得民心，这将是一项不可能完成的任务。我们需要调动媒体力量，并开始面对面地争取支持。"
 AST_send_it_through: "直接发送"
 AST_send_it_through_desc: "1999年公投失败后，共和制议题在议会大多数成员眼中如同不祥之兆，令人厌恶。与上次相比，我们现在处境十分不利。或许我们需要采取一些强硬措施才能推动此事进展。"
 AST_our_commonwealth: "我们的英联邦"
 AST_our_commonwealth_desc: "我们不能将近两个世纪的历史和情谊弃之不顾，尤其是在这样一个过渡时期。重申我们对英联邦的承诺或许能缓解一些仍在犹豫不决的保皇党人的担忧。"
 AST_free_from_binds: "摆脱束缚"
 AST_free_from_binds_desc: "我们脱离君主制绝不能草率行事。我们必须斩断与王室的联系，也必须斩断多年来让我们感到舒适的那层软毯。我们需要的改变，是在突破玻璃天花板之后留下伤痕和淤青。这绝非易事。"
 AST_run_the_games: "举办运动会"
 AST_run_the_games_desc: "每四年，我们的运动员都会盛装参加英联邦运动会。这是一项与奥运会颇为相似的综合性运动会，汇聚了英联邦各国的运动员。现在或许正是我们申办下一届运动会的最佳时机。"
 AST_kowtow_to_the_crown: "向王室叩头"
 AST_kowtow_to_the_crown_desc: "获得君主的正式祝福最终将平息反对派的怒火，尽管这会疏远我们自己的一些共和党人，但当投票结果开始公布时，这些批评的声音几乎不会再出现了。"
 AST_crossing_the_floor: "穿过地板"
 AST_crossing_the_floor_desc: "工党高层一听说我们需要他们拉票，肯定会得意洋洋地数钱。想让他们屈服可不容易，他们肯定也会提出各种要求，但我们必须向前看。不管我们愿不愿意，他们暂时都是我们的新盟友。"
 AST_approaching_the_governor: "接近总督"
 AST_approaching_the_governor_desc: "这是整个流程的最后一步。考虑到递交辞呈的性质，情况略显尴尬。我们只能希望他们能够接受。"
 AST_a_shining_example: "一个光辉的榜样"
 AST_a_shining_example_desc: "我们必须成为太平洋岛国成功民主的典范。我们在这项伟大任务中的成功，不仅将激励本地区人民，也将激励世界各地的人们。即使在我们国家如今的时代，我们依然可以摆脱控制的枷锁。"
 AST_no_kings: "没有国王"
 AST_no_kings_desc: "我们新宪法的机制必须反映现代政治变革的现实。任何制度都无法避免崩溃，但可以增强其韧性。权力将分立，监督机制将得到有效运作，并设有第三方保障措施，以确保威权主义和反动思想受到遏制。"
 AST_endow_the_arts: "捐赠艺术"
 AST_endow_the_arts_desc: "言论自由是民主的基石之一，自尤里卡栅栏事件以来便是如此。坦白说，对艺术的任何投资通常都是浪费，但如果说我们现在最需要关注的是什么，那就是文化。"
 AST_hold_onto_the_wild: "拥抱荒野"
 AST_hold_onto_the_wild_desc: "为了鼓励郊区发展更多林业，选择将部分或全部土地永久划为保护区的土地所有者，将获得较低的资本利得税。同时，我们还可以确保将国家公园的保护措施写入新宪法，使其在未来几十年内得到妥善保护。"
 AST_a_generation_to_persevere: "坚韧不拔的一代"
 AST_a_generation_to_persevere_desc: "我们国家的未来完全掌握在子孙后代手中。关注他们，确保他们获得足够的知识以茁壮成长，就等同于确保我们的生活方式得以延续。教育必须成为一项宪法权利，由我们的国家赋予。"
 AST_enshrine_the_protections: "将保护措施写入法律"
 AST_enshrine_the_protections_desc: "下一步修改宪法意义重大，不仅关乎治理体系，更关乎公民福祉。我们最弱势群体的权利不应由堪培拉最高领导人决定，而应写入宪法，并在可预见的未来永久有效。\n\n澳大利亚不是少数人受保护的国家，而是所有人受保护的国家。毋庸置疑。"
 AST_modernize_the_communities: "社区现代化"
 AST_modernize_the_communities_desc: "我们正在筹备一系列计划，旨在将更多合同输送到低收入社区，为那些没有工作的人带来更多就业机会，并改善较小、困难城镇的形象。"
 AST_with_heritage_to_remember: "铭记传承"
 AST_with_heritage_to_remember_desc: "和解之路在许多方面都已进入下一阶段。支持之手需要再次伸出，但这一次，是给予支持本身。\n\n修改宪法，允许当地传统所有者就土地保护和主权以及开发审批权等相关事宜进行正式条约谈判，实际上是将和解的主动权交还给社区。这赋予了当地社区决定自身未来的权利，以及保护自身历史的能力。"
 AST_one_last_push: "最后冲刺"
 AST_one_last_push_desc: "我们已获得授权。选票正在统计中。我们只能希望历史这次站在我们这边。"
 AST_a_new_constitution: "新宪法"
 AST_a_new_constitution_desc: "澳大利亚治理的下一个时代即将到来。我们现在迈出的这一步，或许有些大胆，甚至有些鲁莽，却将为历史书写新的篇章。我们正以此为基石，构建国家的未来，缔造我们的新宪法。"
 AST_the_mining_snag: "采矿障碍"
 AST_the_mining_snag_desc: "近年来，采矿业确实屡遭不公对待，尽管我们不能忽视该行业自身的过错。我们需要在政府的需求和工业家的权益之间达成共识，促成一项和解协议。"
 AST_a_little_of_this: "一点点"
 AST_a_little_of_this_desc: "一些持有矿业股份的大公司也投资了伐木业。多年来，环保组织一直抵制伐木业，导致该行业利润锐减。开放部分国有林地进行采伐，并取消一两项监管规定，或许能为我们赢得一些所需的支持。"
 AST_formal_investigation: "正式调查"
 AST_formal_investigation_desc: "系统性的胁迫和利益输送已成为采矿业过度政治化的普遍后果。我们无法根除所有弊端，但我们可以通过成立一个正式的矿业调查委员会来改变现状，旨在揭露一些更为公开的腐败行为。"
 AST_for_a_bit_of_that: "就这点儿"
 AST_for_a_bit_of_that_desc: "矿业公司的所有抱怨通常都集中在监管过度上。他们游说反对监管，通过媒体宣传反对监管。他们几乎是敲着我们的门，要求我们取消这些监管。既然如此，不妨暂时放宽一些限制，或许能让他们敞开心扉，考虑改革。"
 AST_training_the_next_miners: "培养下一代矿工"
 AST_training_the_next_miners_desc: "技术与继续教育学院或职业技术教育学院的职业教育应该能为我们提供一种最快捷的方式来培训行业新员工，对他们来说成本很低，甚至还能给选择它的人带来一些激励。"
 AST_when_opportunity_calls: "当机会来临时"
 AST_when_opportunity_calls_desc: "外交部从中东带回了来自沙特王室的直接提议，希望在采矿领域开展一项有趣的合作。这是我们首次就此议题与他们接触，无论他们有何打算，都可能带来难以拒绝的丰厚回报。"
 AST_tussle_with_the_media: "与媒体的冲突"
 AST_tussle_with_the_media_desc: "我们不能让矿业公司独断专行。即使默多克媒体与我们作对，我们仍然可以向媒体表达我们的观点，并在国家电视台公布我们的一些发现。"
 AST_war_with_the_party: "与党的战争"
 AST_war_with_the_party_desc: "鉴于目前针对我们的攻击力度，一些党员开始四散奔逃。他们要么加入媒体的行列，抵制我们的政府，要么试图与我们保持距离。我们必须采取反击行动。把那些叛逃者抓起来，把那些只会夸夸其谈的人与媒体隔离开来。让他们明白，我们仍然掌权。"
 AST_no_gas_all_breaks: "无油门，全刹车"
 AST_no_gas_all_breaks_desc: "我们需要打破党内对矿业的偏袒传统。可再生能源领域的机遇日新月异，不断发展壮大。伊维尔德罗​​拉公司目前在维多利亚州拥有一系列成功的电厂。如果能获得政府的资金支持和批准，他们将在全国各地建立更多电厂。"
 AST_the_processing_debacle: "处理灾难"
 AST_the_processing_debacle_desc: "由于我们的调查结果，我们肩负着为这些移民找到解决方案的重任。这并非易事，但对我们来说，这样的抉择向来如此。"
 AST_bowen_expansion: "鲍恩扩张"
 AST_bowen_expansion_desc: "必和必拓已申请快速审批其在昆士兰州鲍恩盆地新建的输油管道。该管道旨在大幅提升当地的钢铁生产速度。一些环保组织对管道路线穿越考拉栖息地表示反对，但项目代表向我们保证，造成的损害将降至最低。"
 AST_fortescue_lines: "福特斯克航运公司"
 AST_fortescue_lines_desc: "我们最大的铁矿石开采中心位于西澳大利亚，由福特斯克公司运营。他们邀请我们共同投资他们的磁铁矿项目，该项目旨在以更低的排放量提供更高的矿石产量。如果我们能同时赢得矿业公司和环保人士的支持，或许可以减轻我们面临的一些压力。"
 AST_secure_resource_tax: "安全资源税"
 AST_secure_resource_tax_desc: "最后，我们推出了首个全面的资源租金税，旨在解决矿业繁荣时期遗留的一些税收低效问题。该税项包含多项条款，确保小型企业和矿山不会受到影响，新的收入来源将注入我们的预算，且不会影响生产力。"
 AST_an_open_ear: "敞开的耳朵"
 AST_an_open_ear_desc: "前人制定的气候限制政策已经严重扰乱了整个行业的平衡，限制性之强令人难以接受。周边国家几乎无需承担任何成本，我们又如何能够参与竞争？我们需要采取更为温和的监管措施，在找到更合理的方案之前，我们将暂时解除当前的限制。"
 AST_olympic_dam_developments: "奥林匹克坝开发项目"
 AST_olympic_dam_developments_desc: "西部矿业公司已与我们联系，希望利用奥林匹克坝的铀矿开展一项联合研究项目。与此同时，我们也收到了来自议会内外对该矿的强烈抗议，抗议内容涉及其对当地社区的影响。任何矿山及其配套设施的扩建都必然会引发一些反对意见，但这并非我们无法克服的困难。"
 AST_changing_the_system: "改变体制"
 AST_changing_the_system_desc: "我们在行业管理方面取得了长足进步。如今，利润不仅更加清洁，而且比以往任何时候都更加丰厚。虽然仍有许多工作可以改进，但就目前而言，我们可以回顾过去，为已取得的成就感到自豪。"
 AST_the_turnbull_government: "特恩布尔政府"
 AST_the_turnbull_government_desc: "这只是个占位符。特恩布尔的国策树正在开发中，很快就会发布！"
 corroboree_event.1.t: "在科罗布里节上的演讲"
 corroboree_event.1.d: "霍华德站在长者身后，长者正在介绍[GetASTLeaderTitle]。他将在科罗布里节上发表讲话。自当选以来，这已成为他竞选和领导风格的标志性环节。然而，这一次，人群却异常冷淡。当他发表关于“务实和解”和谨慎策略的言论时，没有出现任何激情澎湃的呼喊。许多人已经等了几个小时，但似乎没有人对这些空洞的进步承诺感到振奋。一些人转身离去，还有一些人一边抗议一边发出嘘声。\n\n演讲结束后，掌声冷淡，霍华德与长老们进行了长时间的交谈。他拒绝道歉，也拒绝任何在他看来是“空洞姿态”的举动。双方最终离开，现场弥漫着一丝失望的气氛，久久不散。"
 corroboree_event.1.a: "情况本来可能更糟……"
 mining_giants_talk.1.t: "与巨人的会面"
 mining_giants_talk.1.d: "正如预期的那样，各矿业巨头要求我们延长减税政策，以利用当前的矿业繁荣。他们的理由是，节省下来的资金将使他们能够长期扩大业务。额外的减税幅度不大，不太可能对我们的财政造成影响，但我们也可以拒绝这一请求，维持现状。或者，我们也可以提高税率，从中分一杯羹，短期内不会产生太大影响。"
 mining_giants_talk.1.a: "给他们减税。"
 mining_giants_talk.1.b: "我们维持现状吧。"
 mining_giants_talk.1.c: "提高税率，让我们多拿一份。"
 civil_partnership_act.1.t: "《民事伴侣关系法》在全国范围内获得通过"
 civil_partnership_act.1.d: "数千名支持者聚集在国会山外，第一时间见证了彼得·科斯特洛宣布婚姻承认法案几乎全票通过的消息。这项跨党派法案的通过，得益于一项全国性的邮寄投票调查，该调查为改革注入了前所未有的动力。\n\n这项由此前只承认传统婚姻概念的联盟党提出的法案，得到了几乎所有工党和绿党成员的支持，其通过令在场许多人感到震惊，他们既热泪盈眶，又喜极而泣。科斯特洛表示，这项法案不仅是同性恋权利的进步，更是“所有澳大利亚人权利的进步”，并为未来的改革敞开了大门。虽然同性伴侣仍需在国外结婚，但已婚人士现在可以合法地缔结他们的伴侣关系。"
 civil_partnership_act.1.a: "对他们很好"
 the_national_apology.1.t: "国家道歉"
 the_national_apology.1.d: "在最初看似拖延之后，约翰·霍华德就历史上对该国原住民（即澳大利亚土著和托雷斯海峡岛民）犯下的错误发表了正式的全国性“道歉”。\n这项历史性的举动源于1997年的《带他们回家》报告，由[GetASTLeaderTitle]在国会大厦发表，在澳大利亚引起了巨大的情感冲击。国会大厦大厅和国会大厦外的草坪上，人群欢呼鼓掌。数千人冒雨聚集在悉尼街头，观看这场意义重大的演讲。社区感受到了一种深深的释然和治愈，许多人称赞联盟党的和解努力取得了毋庸置疑的成功。"
 the_national_apology.1.a: "是时候继续前进了。"
 pacific_solution.1.t: "太平洋解决方案"
 pacific_solution.1.d: "澳大利亚政府已就离岸加工设施向我们提出一项提议。作为承建这些设施的交换条件，他们承诺大幅升级我们当地的基础设施和海军港口设施，以支持相关运营。"
 pacific_solution.1.a: "接受澳大利亚的投资。"
 pacific_solution.1.b: "我们的主权不容买卖。"
 pacific_solution.3.t: "巴布亚新几内亚接受"
 pacific_solution.3.d: "令人欣慰的是，巴布亚新几内亚政府已同意我们的提议。新加工设施的建设将立即启动。"
 pacific_solution.3.a: "不出所料"
 pacific_solution.4.t: "巴布亚新几内亚拒绝"
 pacific_solution.4.d: "我们的邻居拒绝了这项提议，理由是涉及主权问题以及当地民众的反对。我们必须另寻他法。"
 pacific_solution.4.a: "令人失望。"
 pacific_solution.5.t: "瑙鲁接受"
 pacific_solution.5.d: "瑙鲁地方政府已接受我们的提议。我们在太平洋地区的又一项业务进展顺利。"
 pacific_solution.5.a: "不出所料"
 pacific_solution.6.t: "太平洋解决方案被否决"
 pacific_solution.6.d: "瑙鲁拒绝了这项提议。看来他们不会在解决我们的移民问题上提供帮助，而是选择继续孤立于太平洋之外。"
 pacific_solution.6.a: "这是灾难性的"
 stomp_out_the_roots.1.t: "澳大利亚提供反恐合作"
 stomp_out_the_roots.1.d: "澳大利亚政府提出了一项联合安全倡议，旨在打击和消除我国境内的极端主义团体。他们将提供广泛的战术支持和情报共享。"
 stomp_out_the_roots.1.a: "携手共建更安全的印尼。"
 stomp_out_the_roots.1.b: "我们能够处理好自己的内部安全问题。"
 stomp_out_the_roots.2.t: "印尼同意合作"
 stomp_out_the_roots.2.d: "雅加达方面已正式接受我们的提议。我们在雅加达境内的行动可以立即展开，我们的情报机构已经在着手进行转移工作。"
 stomp_out_the_roots.2.a: "一段牢固合作关系的开端。"
 stomp_out_the_roots.3.t: "雅加达拒绝联合倡议"
 stomp_out_the_roots.3.d: "印尼政府拒绝了我们提出的军事合作提议，宁愿独自处理此事。"
 stomp_out_the_roots.3.a: "他们的损失"
 state_visit: "国事访问"
 ast_off_to_delhi.1.t: "印度之旅"
 ast_off_to_delhi.1.d: "霍华德下飞机后，一路上都是笑容满面、握手寒暄，直到登上讲台。自印度独立以来，我们一直保持着不温不火的关系，勉强不冒犯。如今，这已经是我们本月第四次会面了。当地媒体正抓住机会，向外国领导人展示印度的吸引力，并毫不犹豫地抨击霍华德的国内政策。但这不足以让印度政府望而却步。我们将以高于周边任何国家的出口速度出口铀，而他们只会微笑点头，承诺不进行铀浓缩，我们也欣然接受。归根结底，这对澳大利亚来说又是一次“助力”。我们才是最终的受益者，每一次握手都让我们离成为太平洋地区最大的铀出口国更近一步。"
 ast_off_to_delhi.1.a: "对两国而言都是双赢。"
 ast_trade_deal: "重大贸易协议"
 ast_trade_agreement: "贸易协议"
 refused_trade_deal: "拒绝了我们的贸易协议"
 marks_trade.1.t: "来自澳大利亚的贸易提议"
 marks_trade.1.d: "为了加强区域经济联系，澳大利亚政府提出了一项“零关税”贸易协定方案。该方案包括放宽对我国电子产品进口的限制，以换取我国独家矿产开采权。两国都将从商品流通的增加中获益匪浅，但最终的选择权仍然在我们手中。"
 marks_trade.1.a: "一段富有成效的合作关系即将展开。"
 marks_trade.1.b: "我们的市场必须得到保护。"
 ast_our_capacity_for_peace.1.t: "澳大利亚提议维和行动"
 ast_our_capacity_for_peace.1.d: "为了维护太平洋地区的稳定，堪培拉政府向我们提出了一项联合维和行动计划。该提议实际上将成为我们之间军事合作，特别是反恐合作的基础。该提议也包含未来情报共享的计划。我们现在可以接受这项提议，并根据他们日后提出的任何修改意见进行调整，或者我们也可以断然拒绝。"
 ast_our_capacity_for_peace.1.a: "和平是唯一的出路。"
 ast_our_capacity_for_peace.1.b: "我们自己决定如何保护太平洋。"
 ast_our_capacity_for_peace.2.t: "达成协议"
 ast_our_capacity_for_peace.2.d: "北京方面对我们的提议做出了积极回应。我们的维和行动已正式启动，他们承诺很快将加入我们，以巩固这一行动。"
 ast_our_capacity_for_peace.2.a: "我们会密切关注他们。"
 ast_our_capacity_for_peace.3.t: "被否决的提议"
 ast_our_capacity_for_peace.3.d: "我们提出的建立共同维和条约的提议遭到了北京政府的冷漠回应。他们的外交官则以维护自身在太平洋地区的主权为由作出了回应。"
 ast_our_capacity_for_peace.3.a: "那么，我们将孤军奋战。"
 fossil_fuels.1.t: "化石燃料换人民币"
 fossil_fuels.1.d: "澳大利亚提议大幅扩大煤炭出口，以满足我们不断增长的工业部门的需求。作为交换，他们愿意成为我们的主要能源合作伙伴，条件是获得优惠的汇率。"
 fossil_fuels.1.a: "工业引擎需要燃料。"
 fossil_fuels.1.b: "我们将用自己的方式获取煤炭。"
 fossil_fuels.2.t: "化石燃料换人民币"
 fossil_fuels.2.d: "澳大利亚在现有维和行动的基础上，提议达成一项全面的贸易协定。通过“化石燃料换人民币”计划保障能源供应，我们将进一步巩固能源安全和供应。"
 fossil_fuels.2.a: "我们的合作关系日益牢固。"
 fossil_fuels.2.b: "他们的合作就足够了。"
 fossil_fuels.3.t: "煤炭协议签署"
 fossil_fuels.3.d: "中国政府一直不愿就化石燃料的长期供应做出任何承诺。目前，他们已接受一项规模适中的出口方案，以补充其化石燃料储备。我国矿业部门已开始为达成该协议做准备。"
 fossil_fuels.3.a: "太棒了"
 fossil_fuels.4.t: "化石燃料提案被拒绝"
 fossil_fuels.4.d: "中国以追求能源独立为由，拒绝了我们所有扩大煤炭出口的提议。"
 fossil_fuels.4.a: "错失良机。"
 fossil_fuels.5.t: "中方的反提案"
 fossil_fuels.5.d: "出乎意料的是，在收到我们关于扩大煤炭出口的提议后，中国代表团提出了他们自己的方案：优先签署涵盖众多中国电子产品和商品的贸易协定，以换取我们煤炭和其他矿产出口几乎零关税。这对我们来说简直是天赐良机。我们的行业领袖们正争分夺秒地确保在协议有效期内获得出口。"
 fossil_fuels.5.a: "我们的好运还在继续。"
 ast_jap_trade.1.t: "与澳大利亚的贸易谈判"
 ast_jap_trade.1.d: "经过数周与澳大利亚的谈判，双方达成了首份全面的贸易协定草案。具体内容包括澳大利亚向我国出口大量农产品，以换取澳大利亚降低对我国电子产品和汽车的关税。这可以确保稳定的食品供应，但我们也可以借此机会争取更多。"
 ast_jap_trade.1.a: "接受所提出的条款"
 ast_jap_trade.1.b: "要求优先开采其珍贵矿产资源"
 ast_jap_trade.1.c: "这些条款对我很不利。"
 ast_jap_trade.2.t: "日本贸易协定签署"
 ast_jap_trade.2.d: "日本驻东京代表团已发回消息，谈判取得圆满成功。这是日本首次与主要经济体（更遑论与我们）达成全面经济伙伴关系协定或自由贸易协定。这标志着我们两国关系迈出了重要一步，并可能为未来多年更加紧密的双边关系奠定基础。"
 ast_jap_trade.2.a: "干杯！"
 ast_jap_trade.3.t: "日本要求获得矿产开采权"
 ast_jap_trade.3.d: "谈判形势发生了转变。他们现在要求优先获取我们宝贵的矿产资源，以支持其不断发展的科技产业，并抵消降低关税带来的成本。这将严重影响我们国内的资源供应，并使协议整体上对我们不利。我们可以敦促他们回到最初的协议，但这可能会彻底断送谈判。"
 ast_jap_trade.3.a: "接受他们的新条款，达成交易。"
 ast_jap_trade.3.b: "坚持我们的立场。要求执行原协议。"
 ast_jap_trade.4.t: "贸易提案被拒绝"
 ast_jap_trade.4.d: "东京代表团已传来消息，谈判破裂。他们似乎没有丝毫进一步讨论的迹象就离开了会议室。我们达成协议的计划基本上已经搁浅。虽然这严重阻碍了我们的贸易计划，但或许我们还可以探索其他途径。"
 ast_jap_trade.4.a: "对我们而言，这是一个挫折"
 ast_jap_trade.5.t: "澳大利亚立场坚定"
 ast_jap_trade.5.d: "堪培拉代表团坚持原先的提议，拒绝就矿产开采权进行任何谈判。他们明确表示，以降低关税换取农产品进口的提议协议已成定局。"
 ast_jap_trade.5.a: "或许我们太草率了。"
 ast_jap_trade.5.b: "那么就谈不上达成协议了。"
 base_state_visit.1.t: "访问美国"
 base_state_visit.1.d: "霍华德曾在1999年访问过白宫，当时正值关税谈判期间。那时下着雨，仿佛冥冥之中自有安排，这次又下起了雨。他与总统会面后，穿过正门，迎面而来的是一群撑着伞的记者。美国的一切都很大。他们的商店很大，教堂也很大。总统官邸尤其庞大。澳大利亚没有与之匹敌的规模，更谈不上如此宏伟。有人可能会说，他们似乎在弥补某些方面的不足，但他们确实拥有一切，最终我们也必须参与进来，争取我们应得的那份。无论是太平洋防务保障还是贸易采购，澳大利亚都必须证明自己是一个有价值的合作伙伴。就像我们曾经在越南和朝鲜问题上所做的那样，我们也会参与到下一个问题中来。"
 base_state_visit.1.a: "为了让我们安心。"
 base_state_visit.2.t: "访问中国"
 base_state_visit.2.d: "霍华德抵达北京后，第一个接见他的是中国总理。总理绕过周围蜂拥而至的中国媒体，带领他们来到附近一家被封锁的餐厅，商讨贸易方案。中国是一个非常积极的谈判伙伴，但与他们合作总有一些限制条件。霍华德没有忘记中国专制体制的现实，而且在每一次会谈中，中方都明显地想要占据上风。与中国的谈判变成了一场微妙的博弈，既要阐述澳大利亚想要的未来，又要设法使其与对方的设想相契合。在下一次贸易谈判之前，必须打出每一张牌，才能确保双方处于公平的谈判地位。当双方起身离开时，霍华德觉得自己已经做得足够好了。"
 base_state_visit.2.a: "一切就绪。"
 base_state_visit.3.t: "与朝鲜关系正常化"
 base_state_visit.3.d: "与朝鲜的会谈十分特殊，因为几十年来双方都没有建立起任何基础，霍华德几乎是踏入了一片未知领域。更糟糕的是双方之间的隔阂。每一次接触都只能通过我们在中国的联络人间接进行，再由他们转达给朝鲜方面。双方从未期望过会谈，但霍华德本人从未与任何真正的朝鲜代表直接对话，这使得整个过程显得十分怪异。最终，双方同意在堪培拉设立大使馆，这从一开始就让霍华德感到不安，但如果双方想要继续谈判，就必须这样做。"
 base_state_visit.3.a: "总好过啥也没有"
 base_state_visit.4.t: "访问韩国"
 base_state_visit.4.d: "韩国总统当天清晨抵达堪培拉，此行的目的非常明确。朝鲜战争爆发时，澳大利亚与美国并肩作战。自那时起，澳大利亚一直是太平洋地区国防安全的可靠保障，只要其北方邻国拥有核武器，澳大利亚的地位就不会改变。如今，这个问题被提了出来。总统态度礼貌，但最终双方需要达成一些实质性的协议。在植物园漫步期间，[KOR.GetLeader]谈到了持续的经济困境以及朝韩谈判的停滞不前。与此同时，双方同意达成一项贸易协定，但除此之外，没有其他任何承诺。"
 base_state_visit.4.a: "目前只能这样了。"
 base_state_visit.5.t: "加里波利仪式"
 base_state_visit.5.d: "土耳其人民一直以来都非常尊重澳新军团日的传统。我想，作为那天的胜利者，他们很容易做到这一点，但他们仍然非常理解我们，为我们指定了一处地点，让我们每年都能去那里缅怀逝者。大多数人把这个仪式视为哀悼的时刻，或者从中领悟到战争毫无意义等等。很少有人认为这一天是国际联盟的一个错误，如果没有英国把我们抛弃到加里波利半岛，那天或许就不会有几十万人丧生。我们之前的领导人确实意识到了这一点，因为我们从英国转向了美国，自那以后，对联盟的重视就深深地融入了每个政党的政策之中。值得庆幸的是，土耳其始终是我们忠实的朋友。"
 base_state_visit.5.a: "我们切莫忘记。"
 base_state_visit.6.t: "君主到访"
 base_state_visit.6.d: "女王伊丽莎白二世陛下在爱丁堡公爵殿下的陪同下抵达澳大利亚，作为其登基五十周年庆祝活动的一部分。 \n\n这对王室夫妇于2002年2月27日抵达阿德莱德，并将在英联邦政府首脑会议期间访问包括凯恩斯和堪培拉在内的几个城市。 \n\n为女王第13次到访而设立的公共画廊里，挥舞着英国国旗的人群欢呼雀跃，沿着从机场到金钟宫的5英里路线排队。 [GetASTLeaderTitle]预计很快就会迎来她，失败的共和党公投可能会出现在话题列表中。"
 base_state_visit.6.a: "让我们保持文明礼貌。"
 rudd_state_visit.1.t: "访问俄罗斯"
 rudd_state_visit.1.d: "世界上很少有国家比澳大利亚的面积更大。俄罗斯联邦肯定算其中之一。霍华德走下飞机时，还没做好迎接寒冷的准备。在俄罗斯待了两天，每次走到户外，刺骨的寒风吹过，他仍然感到一阵寒意。酒店外聚集了不少人，挥舞着澳大利亚和俄罗斯的国旗，这让他感到一丝安慰。这次会面是陆克文安排的，霍华德感觉自己像是被扔进了深水区。与这头熊搏斗真的是正确的方法吗？他们仍在努力从上世纪90年代的经济冲击中恢复过来。理论上，俄罗斯总统会寻求任何贸易援助来维持经济运转，但霍华德自抵达以来就没怎么感受到受欢迎。他必须努力说服他们，澳大利亚的铀矿值得谈判。"
 rudd_state_visit.1.a: "一切的开始……"
 leaked_memo.1.t: "泄露的备忘录"
 leaked_memo.1.d: "不知怎么的，某个记者弄到了我们党内成员肖恩·斯通的一封信，信里竟然对我们政府提出了诸多尖锐的批评。《卫报》已经把“卑鄙狡诈的霍华德”作为头条新闻。我不知道这封信是怎么泄露出去的，但媒体对此事大肆炒作，现在我们不得不疲于应付，试图掩盖真相。党内一些人，包括彼得在内，要求我们对斯通进行政治迫害，就像一场绝望的暴民追捕。在风波平息之前，我们什么也做不了，这严重阻碍了我们推进变革的步伐。如果说还有什么比这更糟糕的，我想不出还有什么能比这更糟了。"
 leaked_memo.1.a: "能行吗？"
 reconciliation_journey.1.t: "和解之旅"
 reconciliation_journey.1.d: "霍华德和媒体团队走进那间小房间，一位原住民议员正在里面等候。他们又签了一些文件，然后对着镜头摆姿势。议员转身和霍华德握手时，[GetASTLeaderTitle]注意到他的手很粗糙，布满老茧，骨节分明。他的脸看起来也很坚毅，但眼眶却湿润了。霍华德能从他脸上看到多年的艰辛，以及他此刻紧紧抓住的希望。他小心翼翼地守护着这份希望。“谢谢你，霍华德先生。”说完，他便和记者们一起离开了。\n\n他现在独自一人，站在那里沉思片刻。为了和解，他曾多次改变立场，次数多到让他感到不自在，但国家似乎因此变得更好了。在他所做的一切之后，澳大利亚终于一步步向前迈进。他静静地站在那里，一种满足感油然而生。随后，更多的媒体记者走了进来，一切又恢复了往常。"
 reconciliation_journey.1.a: "还有更多工作要做。"
 ast_the_coalition_convention.1.t: "执政联盟大会"
 ast_the_coalition_convention.1.d: "“我们取得了丰硕的成果，战胜了反对势力。澳大利亚在世界舞台上昂首挺胸，令人自豪。我们在经济领域取得的成就赢得了尊重，我们被视为一个敢于在国际问题上表明立场的国家。联盟党的诸多政策都贯穿着一条黄金法则，那就是选择这一伟大的原则。让所有澳大利亚人拥有更多选择，从而更好地规划自己的未来。我们的国家比以往任何时候都更加自由。人民收入更高，消费能力更强，生活也更加自豪。”\n\n“我们面临的挑战与1996年我们争取重返执政时以及下次选举时一样艰巨。与此同时，我们可以采取诸多措施，继续改善财政支出状况，促进经济增长。许多支持者期待政府出台更多政策，改善他们以及澳大利亚国内外更多民众的生活。我们的责任源于我们的道德准则。我们是一个秉持公平竞争精神的国家。我们每个人都深知自己肩负的领导责任。这份责任从未停止。”"
 ast_the_coalition_convention.1.a: "挑战尚未结束。"
 the_white_paper.1.t: "落实白皮书"
 the_white_paper.1.d: "《2000年国防报告》是对我们现有军事能力以及现任政府所要求的能力进行全面评估的成果。鉴于澳大利亚作为太平洋地区安全与维和行动的主要提供者，其防御能力的重要性日益凸显，因此，政府的主要需求是扩充军力。这不仅仅指人员扩充，指挥系统、技术水平以及武器制造能力都需要改进或扩充。值得庆幸的是，我们正在开发多个项目，这些项目有望帮助我们实现这一目标。"
 the_white_paper.1.a: "我们的生产才是最重要的。"
 the_white_paper.1.b: "没有军队，我们就无法作战。"
 the_white_paper.1.c: "他们能够满足需求。"
 the_white_paper.2.t: "落实第二份白皮书"
 the_white_paper.2.d: "无论我们是否取得了成功，我们都再次面临重组的挑战，并首先确定了一个目标。第一个建议是彻底改革野战部队的调动方式，以提高其效率。此外，还有人建议调整我们的增援政策。否则，我们可以请求高层指挥部加快对我国作战理论的研究。"
 the_white_paper.2.a: "行动将是我们的关键。"
 the_white_paper.2.b: "总是需要增援。"
 the_white_paper.2.c: "一切推倒重来。"
 lithgow_arms.1.t: "利思戈轻武器工厂出售"
 lithgow_arms.1.d: "泰雷兹公司已提出一笔款项，用于购买和翻新这座旧工厂，以供我们用作生产基地。他们之前在我们的武器生产项目中一直很可靠，而且这座工厂目前状况不佳。与他们合作，让它重获新生或许是最好的选择。当然，我们也可以自行翻新这座建筑。"
 lithgow_arms.1.a: "卖了它"
 lithgow_arms.1.b: "我们可以把它修好。"
 governor_general_sacked.1.t: "总督被解职"
 governor_general_sacked.1.d: "澳大利亚历史上或许首次出现女王伊丽莎白二世亲自罢免总督的情况。这一令人震惊的消息是在英国政府与澳大利亚总理进行一系列会谈后传出的，无论女王是否出于本意，罢免总督的决定似乎已经达成。目前尚不清楚此事将如何影响现任政府的政策制定，但对于澳大利亚许多王室支持者来说，这无疑是一个晴天霹雳。自由党政府发言人尚未就此事发表评论。"
 governor_general_sacked.1.a: "滚蛋吧。"
 solomon_islands_intervention.1.t: "所罗门群岛崩溃"
 solomon_islands_intervention.1.d: "在经历了一系列武装叛乱和裁军失败后，所罗门群岛政府实际上已经崩溃，取而代之的是无政府状态。交战的武装团体之间因种族矛盾爆发了大规模冲突，公共服务完全瘫痪，导致许多人极易受到暴力侵害，人道主义危机日益加剧。总理艾伦·凯马凯扎已正式向邻国发出紧急求助，请求援助这个崩溃的国家，但澳大利亚政府尚未就任何干预措施发表评论。如果不采取任何行动，岛上的局势预计只会进一步恶化。"
 solomon_islands_intervention.1.a: "令人担忧的事态发展。"
 solomon_islands_intervention.2.t: "所罗门群岛干预"
 solomon_islands_intervention.2.d: "自巴厘岛爆炸案以来，参议院的每个人都对恐怖主义话题格外敏感。目前所罗门群岛的局势更是让我们忧心忡忡。很可能，局势越恶化，就越有可能蔓延到我们的领海，为制造炸弹的分子提供新的温床。那里的总理已经请求我们进行干预，如果我们就此进行投票，结果几乎会是全票通过。我们有道义上的责任，但介入那里可能会让我们陷入前所未有的泥潭，甚至可能使情况更加糟糕。无论如何，我们该如何应对，都绝非易事。"
 solomon_islands_intervention.2.a: "我们需要介入。"
 solomon_islands_intervention.2.b: "这不是我们的冲突"
 sol_intervention_tt: "§2对所罗门群岛进行干预的决议将可用。§!"
 sol_intervention_failure_tt: "§R情况只会越来越糟……§!"
 solomon_islands_intervention.3.t: "干预行动取得成功"
 solomon_islands_intervention.3.d: "目前，当地局势已有所改善，商店开始重新营业，道路上已清除武装分子，重建工作也已启动。我们的部队还需要在该国驻扎数年，但令人欣慰的是，该国局势正在趋于稳定，并有望开始走出困境。所罗门群岛政府对我们的帮助深表感激，并将继续与临时政府密切合作。与此同时，国际社会对我们努力的反应也十分积极。随着我们在太平洋地区的安全形势日益增强，我们在国际舞台上也获得了良好的形象。"
 solomon_islands_intervention.3.a: "干得漂亮。"
 solomon_islands_intervention.4.t: "一个没有希望的国家"
 solomon_islands_intervention.4.d: "在我们的干预行动期间，所罗门群岛的局势只会进一步恶化，并且变得如此不稳定，以至于我们被迫挽回损失并放弃干预。武装分子继续在街头作战，剩余的政府实际上已经解散。国际社会的反应是平静的冲击，参与干预的其余国家同样停止了努力。对于那些在岛上幸存下来的人来说，现在希望渺茫。"
 solomon_islands_intervention.4.a: "一场灾难"
 solomon_islands_intervention.6.t: "军阀在所罗门群岛夺取政权"
 solomon_islands_intervention.6.d: "臭名昭著的武装组织“马拉伊塔雄鹰部队”领导人吉米·卢西巴埃亚于昨日下午晚些时候攻入议会大楼，并自立为临时领导人。此前，瓜达尔卡纳尔岛上，国家警察残余部队与卢西巴埃亚的部队已激战数月，最终双方达成停火协议，允许该组织进入首都，并最终引发政变。\n\n自数月前政府实际瘫痪、岛屿陷入无政府状态以来，政府的瘫痪已成为武装冲突滋生的温床，并引发了该地区的移民危机。叛军领导人声称，新政府将致力于结束当前的危机，并将此前被迫逃离的马来亚侨民送回主岛。"
 solomon_islands_intervention.6.a: "夜幕降临岛屿。"
 walk_for_reconciliation.1.t: "和解步行"
 walk_for_reconciliation.1.d: "今天，超过25万名原住民和非原住民抗议者走过悉尼海港大桥，公开声援和解。这场持续近六个小时的政治示威活动，是澳大利亚历史上规模最大的一次。组织者之一伊芙琳·斯科特承认，参与人数远远超出预期，他们希望政府不会忽视这次行动，因为政府在和解问题上似乎与公众情绪背道而驰。示威期间，一架飞机在海港上空用空中书写出“对不起”的字样，游行者们为此欢呼雀跃。据组织者称，他们正在计划举行更多游行，以延续此次活动的成功。"
 walk_for_reconciliation.1.a: "他们可以这样做。"
 sydney_olympic_games.1.t: "悉尼奥运会开幕"
 sydney_olympic_games.1.d: "夏季奥运会已在澳大利亚悉尼正式开幕。本届奥运会通过电视转播覆盖了220个国家和地区，创下奥运史上最高的转播覆盖率。开幕式上，短跑运动员凯茜·弗里曼传递了奥运圣火，她还在女子400米决赛中为澳大利亚赢得了第100枚奥运金牌。共有199个国家参加了本届奥运会，其中包括朝鲜。朝鲜和韩国在同一面旗帜下并肩入场，象征着两国半个世纪以来的首次团结。奥运会预计将持续两周，参赛各国将在此展开激烈角逐。"
 sydney_olympic_games.1.a: "真是壮观的景象。"
 shell_takeover.1.t: "壳牌收购伍德赛德石油公司"
 shell_takeover.1.d: "我们获悉，皇家荷兰壳牌公司正寻求以100亿美元收购伍德赛德石油公司。过去几年，两家公司关系密切，壳牌公司已明确表示，其对西北天然气田项目的技术支持将转向更深入的设施扩建。然而，我党副党魁兼财务主管彼得·科斯特洛强烈反对这项收购，并建议我们阻止这笔交易，理由是这样一家拥有大部分天然气项目的大型公司损害了我们的国家利益。"
 shell_takeover.1.a: "阻止收购。"
 shell_takeover.1.b: "允许收购。"
 tampa_affair.1.t: "坦帕事件"
 tampa_affair.1.d: "政府关于寻求庇护者的新政策引发了一场政治风暴，起因是一艘挪威船只在圣诞岛附近海域被拒绝入境。货轮“坦帕号”的船长阿恩·林南从一艘印尼渔船上救起了数百名与世隔绝的寻求庇护者，并试图将他们安全送往澳大利亚。\n\n尽管“坦帕号”上的433名寻求庇护者健康状况不佳，但特种空勤团部队还是登船并命令其返航。挪威大使馆对霍华德政府将打击目标转向非法移民的做法大多持否定态度。这项政策最终会发展到什么程度，目前尚不得而知。"
 tampa_affair.1.a: "不幸的遭遇"
 bali_bombings.1.t: "巴厘岛爆炸案"
 bali_bombings.1.d: "恐怖袭击席卷印尼巴厘岛，三枚炸弹引爆，造成约202人死亡，其中包括88名澳大利亚人。在海外恐怖活动日益猖獗的背景下，澳大利亚一直保持着相对的和平与独立，但昨晚的袭击彻底打破了这种平静。据报道，其中两枚炸弹被放置在热闹的夜店，这些场所是澳大利亚游客的热门目的地；第三枚炸弹则在美国驻登巴萨领事馆前爆炸。虽然目前尚不清楚此次袭击是否与基地组织有关，但可以肯定的是，这是一起恐怖主义行为。\n\n第二天清晨，五十多具尸体被白布覆盖，横陈在曾经熙熙攘攘的街道人行道上。这残酷地表明，澳大利亚在持续不断的反恐斗争中不再是旁观者。"
 bali_bombings.1.a: "亲爱的上帝..."
 embassy_attacked.1.t: "澳大利亚大使馆遇袭"
 embassy_attacked.1.d: "据报道，今天上午10点左右，我方驻印尼大使馆外发生爆炸。所幸我方工作人员无人伤亡，但目前已确认9人死亡，约150人受伤，爆炸很可能是由汽车炸弹引起的。显然，此次袭击的目标是我方。目前我们尚不确定此次袭击是否与之前巴厘岛的爆炸案有关，尽管袭击手法类似。印尼政府已主动联系我方，安排展开调查。这或许只是更多有针对性的袭击的开始。"
 embassy_attacked.1.a: "这简直成了一场噩梦。"
 asian_earthquakes.1.t: "印度援助"
 asian_earthquakes.1.d: "目前，亚洲各地地震已造成超过11000人死亡。海啸席卷海岸线，卷走了成千上万的房屋和汽车，导致受灾地区大范围通讯中断，道路和铁路也遭受了难以估量的破坏。印度受灾尤为严重，但目前尚不清楚具体损失情况。全球红十字会已发出紧急呼吁，请求立即向受灾国家提供援助。我们可以借此机会向印度提供援助物资，并加强我们与印度的现有联系。"
 asian_earthquakes.1.a: "我们会支持他们。"
 asian_earthquakes.1.b: "他们只能靠自己了。"
 asian_earthquakes.2.t: "澳大利亚提供援助"
 asian_earthquakes.2.d: "针对目前影响我们和亚洲其他地区的地震，堪培拉向我们提供了一揽子援助计划，以支持灾后重建。"
 asian_earthquakes.2.a: "这的确是个意外，但是个令人欣喜的意外。"
 cronulla_riots.1.t: "克罗努拉种族骚乱"
 cronulla_riots.1.d: "在悉尼海滨郊区克罗努拉，多达200名当地帮派成员在清真寺外与当地警方发生冲突，这场冲突被描述为种族骚乱。此前已发生多起冲突，其中一起冲突中，约5000名集会参与者袭击了具有中东面孔的人士。随后，冲突蔓延至悉尼其他地区，引发了一系列穆斯林社区成员的报复性袭击。骚乱已造成30多人受伤，其中包括警察和医务人员，并导致16人被捕。多个宗教团体公开谴责这些袭击，当地警方已将恢复秩序作为首要任务，但悉尼街头的紧张局势依然存在。"
 cronulla_riots.1.a: "我想他们有权抱怨。"
 cronulla_riots.1.b: "严惩他们。"
 rip_steve_irwin.1.t: "偶像陨落"
 rip_steve_irwin.1.d: "因电视节目《鳄鱼猎人》而享誉全球的自然学家史蒂夫·欧文不幸在一次潜水事故中身亡，一条黄貂鱼刺穿了他的胸部。事故发生在道格拉斯港附近海域拍摄水下纪录片时。摄制组试图将他送上紧急救援直升机，但他在医护人员赶到前不幸去世。他的离世令许多澳大利亚人和世界各地的粉丝感到震惊和悲痛。\n\n“这对旅游业和自然保护来说都是巨大的损失。所有见过史蒂夫的人都会被他的活力和热情所打动，他真是个地道的澳洲‘活宝’。”昆士兰州旅游部长玛格丽特·基奇解释道。这位国家偶像的逝世引起了议会内部人士的强烈反响，[AST.GetLeader]和反对党成员都发表了悼念讲话。"
 rip_steve_irwin.1.a: "澳大利亚失去了一位杰出而富有个性的儿子。"
 a_global_financial_crisis.1.t: "全球金融危机"
 a_global_financial_crisis.1.d: "美国房地产市场崩盘和随之而来的银行倒闭潮已经波及到我们这里。美元已经开始快速贬值，消费者信心也大幅下降。为了应对这种情况，美联储已经加息并下调了现金利率，数十家公司在经济衰退的冲击下倒闭。如果我们不能控制住局面，减缓经济下滑的趋势，失业率可能会飙升，我们可能会面临几十年来前所未有的经济大萧条。"
 a_global_financial_crisis.1.a: "情况变得更糟了。"
 rus_deal_ast.1.t: "来自澳大利亚人的协议"
 rus_deal_ast.1.d: "堪培拉向我们提出了一项贸易协议，以换取其铀矿的优惠出口权。澳大利亚方面一直坚持，这些矿产资源必须用于能源项目，而不是用于武器级铀浓缩。这项协议确实有利于为我们的反应堆提供燃料，而且我们以后随时可以改变主意。但另一方面，我们真的相信他们会按时供应吗？"
 rus_deal_ast.1.a: "非常好。"
 rus_deal_ast.1.b: "不了，谢谢"
 rus_deal_ast.2.t: "与俄国的贸易协定"
 rus_deal_ast.2.d: "莫斯科已经同意了我们的贸易协议。我们将以合理的价格向他们运送铀，卢布将流入澳大利亚国库。他们已经开始通过其贸易办事处安排运输事宜。"
 rus_deal_ast.2.a: "太棒了"
 rus_deal_ast.3.t: "与俄国的贸易协定"
 rus_deal_ast.3.d: "莫斯科拒绝了我们的贸易协议，并辩称他们的铀矿来源将更加本地化。"
 rus_deal_ast.3.a: "嗯...我们尝试过了。"
 isr_ast_visit.1.t: "参观圣地"
 isr_ast_visit.1.d: "霍华德很喜欢以色列人。他们的韧性与澳大利亚人颇为相似，而且他们的外交官也是世界上最优秀的之一。尽管他们从不放过任何机会向你讲述他们在中东的困境。这是一个饱受苦难的国家，但他们对民主价值观的坚持令人钦佩。\n\n他此刻就站在墙前，一股巨大的悲伤涌上霍华德的心头。这应该是他第三次来以色列了，但却是第一次亲眼见到哭墙。看到哭墙的那一刻，他几乎被某种难以承受的情绪淹没，这种情绪在他心中翻腾。或许，这就是以色列人一直以来的感受。如此巨大的损失。一位助手问霍华德是否想按照传统触摸哭墙。他一言不发地点了点头，他们便走近了哭墙。一顶薄薄的圆形帽子被戴在他的头上，当他触摸到哭墙时，他感到哭墙的灵魂吹进了他的体内。"
 isr_ast_visit.1.a: "一次如同圣经般的经历。"
 adf_acq_astuirement.1.t: "澳大利亚国防军甄选承包商"
 adf_acq_astuirement.1.d: "我们最终选定了三个主要采购来源国。第一个也是最容易理解的选项是美国。他们在主力步枪方面取得了显著进步，加上他们在海外的经验以及我们共同的防务承诺，从战略层面来说，美国无疑是最佳选择。第二个选项是德国。既然我们不选择奥地利，不妨考虑一下它的邻国。黑克勒-科赫公司已成为世界顶尖的步枪制造商之一。选择德国绝对不会错。最后一个选项是老牌可靠的比利时。FN系列步枪的卓越性能毋庸置疑，而且我们的英联邦盟友英国也开发出了符合自身需求的步枪产品线。我们完全可以效仿。"
 adf_acq_astuirement.1.a: "跟美国人打交道。"
 adf_acq_astuirement.1.b: "追求品质。"
 adf_acq_astuirement.1.c: "历史悠久，久经考验"
 ast_high_speed_rail.1.t: "高速铁路项目面临延误"
 ast_high_speed_rail.1.d: "不出所料，该项目遇到了难题。布里斯班以南的路线计划穿过一片绵延的山脉。然而，对山脉密度的预估出现了偏差，导致目前的挖掘工作成本大幅增加。"
 ast_high_speed_rail.1.a: "这在意料之中。"
 ast_high_speed_rail.1.b: "取消这个项目。"
 ast_high_speed_rail.2.t: "土地征用问题困扰着高铁项目"
 ast_high_speed_rail.2.d: "铁路沿线郊区出现了更多问题。一些“邻避效应”团体一直反对这项开发计划，而由此引发的法律纠纷可能导致项目无限期搁置。绕行意味着放弃现有路线，重新规划一条新路线。"
 ast_high_speed_rail.2.a: "那些“邻避主义者”究竟为我们做过什么？"
 ast_high_speed_rail.2.b: "绝对不是。"
 ast_high_speed_rail.3.t: "资源成本减缓铁路运输"
 ast_high_speed_rail.3.d: "高铁项目再遭挫折。由于钢材价格飙升，之前已确定的钢铁订单突然取消。现在，供应商要价是之前的3倍，考虑到原先的成本，这笔费用占整个预算的相当大一部分。"
 ast_high_speed_rail.3.a: "那多少钱来着？"
 ast_high_speed_rail.3.b: "告诉他，他是在做梦。"
 ast_high_speed_rail.4.t: "高铁成本重新估算"
 ast_high_speed_rail.4.d: "该项目历经近五年建设，原有资金及追加资金已接近耗尽。由于劳动力、许可证和材料成本均创历史新高，项目投资计划正在重新调整，拟追加800亿美元。一些规划者坚信曙光就在前方，但经历了如此多的挫折之后，项目的前景仍不明朗。"
 ast_high_speed_rail.4.a: "求求你，让这一切结束吧。"
 ast_high_speed_rail.4.b: "我不会再上当了。"
 ast_high_speed_rail.5.t: "高速铁路揭幕"
 ast_high_speed_rail.5.d: "经过多次挫折和预算超支，高速铁路网终于正式启用，首列列车从布里斯班车站驶出。这条被誉为世界一流铁路的线路目前连接布里斯班和墨尔本，全程耗时不到6小时。为了迎接列车的到来，经过改造的车站周围聚集了许多人。\n\n该项目无疑代表了近年来澳大利亚的现代化进程，预计每天将服务超过20万名旅客，改变许多澳大利亚人的出行方式。"
 ast_high_speed_rail.5.a: "工程奇迹！"
 base_state_visit.7.t: "印尼之旅"
 base_state_visit.7.d: "爆炸事件后局势十分紧张，以至于霍华德一下飞机，无论往哪个方向走，都会有军队尾随。印尼方面小心翼翼地维持着表面的友好，但亚齐持续不断的叛乱却令人感到尴尬。尽管有关安全承诺的谈判一再破裂，印尼总理似乎仍然乐于讨论这些承诺。如今，两国关系已变得十分脆弱，早已远非后殖民时代的“和睦相处”，裂痕也已显露无疑。"
 base_state_visit.7.a: "下次再见。"
 generic_bushfires_ast.1.t: "澳大利亚农村地区发生大范围丛林大火"
 generic_bushfires_ast.1.d: "维多利亚州今年夏季异常炎热干燥，引发了肆虐的丛林大火。目前已有超过100万公顷的土地被烧毁，许多较小的火灾在大分水岭地区汇合。所幸的是，火灾主要集中在人烟稀少的山脉和国家公园，尽管一些建筑物和牲畜仍然遭受损失。消防员正在继续有效地控制火势蔓延。尽管如此，烟雾目前仍对墨尔本机场的航班造成了一定的影响。"
 generic_bushfires_ast.1.a: "令人不安"
 papua_affair.1.t: "外交谈判陷入僵局"
 papua_affair.1.d: "巴布亚新几内亚总理[PAP.GetLeader]抵达布里斯班机场准备进行会谈时，机场出现了一些问题，看来我们的谈判可能要泡汤了。\n\n机场一名工作人员要求这位领导人在安检时脱鞋，这显然是标准程序，但首相似乎觉得受到了羞辱。他们的使节已经收拾行装准备登机离开，而我们的外交官正在恳求他们重启谈判。如果我们想挽回局面，就必须亲自介入。"
 papua_affair.1.a: "试图弄到一些东西。"
 papua_affair.1.b: "他们爱哭闹就哭闹吧，我们才不在乎。"
 ast_howard_of_arabia.1.t: "阿拉伯的霍华德"
 ast_howard_of_arabia.1.d: "汽车颠簸着驶过另一个深坑，霍华德的头差点撞到吉普车顶。坐在前排的外交官猛地转过身，开始急切地解释这条路是因为“铁穹”系统造成的导弹坠落碎片而损毁的。霍华德点点头，表示这总比另一种情况要好，但他不禁想到，他在城里塑造的以色列形象与眼前的现实截然不同。汽车驶入领事馆，霍华德将在那里发表关于地区安全的演讲。沿途，以色列国防军的士兵似乎无处不在。\n\n澳大利亚早已在中东扎根，如今又要设立永久基地，协助以色列控制局势。在许多方面，尽管以色列秉持着非常西方的视角，但它仍然是一个发展中国家，缺乏和平未来的基础。即便他们对伊朗入侵的担忧，也远不及与近邻巴勒斯坦之间的不和，霍华德突然开始重新考虑整个协议。"
 ast_howard_of_arabia.1.a: "我们的未来与以色列同在。"
 ast_howard_of_arabia.1.b: "目前我们无法做出任何承诺……"
 indonesian_ultimatum.1.t: "澳大利亚的最后通牒"
 indonesian_ultimatum.1.d: "澳大利亚公然要求我们将亚齐省移交给他们的维和部队，实际上是允许他们的军队占领我们的一块领土。他们声称这将最终使该地区获得独立，摆脱叛乱分子的控制，但我们无法保证这一点，而且这仍然意味着我们失去自己的领土。如果我们拒绝，他们威胁要对我们实施制裁。"
 indonesian_ultimatum.1.a: "我们别无选择。"
 indonesian_ultimatum.1.b: "这太离谱了！"
 indonesian_ultimatum.2.t: "印度尼西亚妥协"
 indonesian_ultimatum.2.d: "雅加达已同意接受提出的条件，并放弃了亚齐领土。我们的维和部队将很快出发，恢复该省的秩序。印尼人民很快就能摆脱叛乱。"
 indonesian_ultimatum.2.a: "和平取得了胜利！"
 indonesian_ultimatum.3.t: "印尼拒绝最后通牒。"
 indonesian_ultimatum.3.d: "雅加达拒绝了我们的条件，拒绝允许我们的维和部队进入亚齐。他们固执地誓言要自行消除叛乱。"
 indonesian_ultimatum.3.a: "就这样吧。"
 indonesian_ultimatum.4.t: "澳大利亚的最后通牒"
 indonesian_ultimatum.4.d: "澳大利亚公然要求我们将亚齐省移交给他们的维和部队，实际上是允许他们的军队占领我们的一块领土。他们声称这将最终使该地区获得独立，摆脱叛乱分子的控制，但我们无法保证这一点，而且这仍然意味着我们失去自己的领土。如果我们拒绝，他们威胁要对我们实施制裁。"
 indonesian_ultimatum.4.a: "我们别无选择。"
 indonesian_ultimatum.4.b: "这太离谱了！"
 us_aus_trade_howrd.1.t: "与澳大利亚的贸易谈判"
 us_aus_trade_howrd.1.d: "堪培拉政府已提出一项提议，即以优先矿产资源贸易权换取我们降低对贵金属高价值机械出口的关税。关税造成的收入损失微乎其微，而矿产资源贸易权带来的收益将远远弥补这一损失。"
 us_aus_trade_howrd.1.a: "这些都是有利的条款。"
 us_aus_trade_howrd.1.b: "不了，谢谢"
 us_aus_trade_howrd.2.t: "美国同意该贸易协定"
 us_aus_trade_howrd.2.d: "没有任何异议，美国人同意降低高价值机械出口的关税，以换取我们提供矿产开采权。"
 us_aus_trade_howrd.2.a: "为这份友谊干杯！"
 us_aus_trade_howrd.3.t: "与美国的贸易谈判陷入僵局"
 us_aus_trade_howrd.3.d: "贸易谈判似乎毫无进展。美国在关税调整问题上毫不让步，我们被冷落了。"
 us_aus_trade_howrd.3.a: "意料之外的经济下滑。"
 trip_to_malaysia_ast.1.t: "来自马来西亚的访问"
 trip_to_malaysia_ast.1.d: "马来西亚贸易及工业部长拉菲达·阿齐兹已与我们联系，提出对我们现有肉类出口条约的补充协议。新协议以我们放宽部分税收和监管规定为条件，换取双方签订出口合同。这是一项不错的提议，但其中的一些要求可能存在漏洞，他们日后可能会利用这些漏洞。不过，该协议仍然为我们的货物提供了有利的价格。"
 trip_to_malaysia_ast.1.a: "当然是为了我们的朋友们！"
 trip_to_malaysia_ast.1.b: "不是现在"
 internal_talk_liberal.1.t: "同事间的争吵"
 internal_talk_liberal.1.d: "霍华德觉得，自第一次选举以来就一直忠心耿耿地辅佐他的党内副手彼得·科斯特洛，总是跟他针锋相对。他们似乎抓住一切机会针锋相对，但这并没有阻止他们为了共同利益而携手合作，彼得对持续的经济繁荣也功不可没。如今，他们却在移民问题上争论不休。彼得坚定地认为移民能带来经济效益，但霍华德担心多元文化主义的“优柔寡断”，因此坚持推行融合政策。\n\n加强边境巡逻的另一个好处是能够减少人口走私，而人口走私已成为新闻热点。但彼得却认为这个想法容易适得其反，最终只会浪费预算。双方显然无法达成一致。"
 internal_talk_liberal.1.a: "然而，必须做出决定。"
 internal_talk_liberal.2.t: "托尼来访"
 internal_talk_liberal.2.d: "霍华德正忙着整理党章修改的文件，这时有人敲门。他知道离下次会议还有大约两个小时的时间，所以当卫生部长托尼·阿博特走进来时，他感到很意外。这位在管理卫生部门和应对偶尔出现的工会恶棍方面都做得非常出色的人，向霍华德提出了对医保制度的进一步修改方案。党内有些人倾向于给阿博特贴上“党内狂热分子”的标签，但霍华德并不这么认为。在他看来，阿博特一心为民，是一位名副其实的民族主义者。\n\n毫无疑问，他渴望成为首相，但这从未阻止他对霍华德的忠诚，两人之间也逐渐建立起相互尊重。他离开房间后，霍华德继续写作，一个念头在他脑海中萦绕。或许，经过这些年的执政，他可以把托尼视为一位好朋友。"
 internal_talk_liberal.2.a: "那就继续吧。"
 internal_talk_liberal.3.t: "挑选继任者"
 internal_talk_liberal.3.d: "在选择下一任党魁时，霍华德陷入了两难境地。在议会里，他的宿敌似乎常常是自己的副手彼得·科斯特洛。他们之间的冲突甚至比他与其他政党的冲突还要频繁。彼得一直觊觎这个职位，而且他在党内其他成员中也颇具声望，这对他来说无疑是一大优势。他对澳大利亚经济独立的愿景确实引人入胜，如果由他掌权，霍华德就能确保党内事务顺利进行。\n\n然而，还有另一个人选。托尼·阿博特在很多方面都是霍华德的门生，尽管他一直坚持霍华德连任。尽管阿博特在党内被视为一个跟班，而且被认为有些过气，但约翰却在他身上看到了一种信念，这几乎让他想起了自己。阿博特设想的不仅仅是一个独立的澳大利亚，更是一个更强大的澳大利亚。在即将到来的下届选举中，这个决定将决定该党的命运。"
 internal_talk_liberal.3.a: "彼得是天然的接班人。"
 internal_talk_liberal.3.b: "托尼具备成功所需的素质。"
 internal_talk_liberal.3.c: "仔细想想……"
 internal_talk_liberal.4.t: "霍华德辞去领导职务"
 internal_talk_liberal.4.d: "“能够成为这个美丽国家的[GetASTLeaderTitle]，是我一生中每一天的莫大荣幸，我要感谢澳大利亚人民给予我的这份荣幸。我尊重并珍视它。经过多年的追求，领导这个国家是我一生中最不可思议的经历。”\n\n“我愿为自由党的一切行为承担全部责任，包括我们取得的成功和少数的失败，因此我将辞去党魁一职。我衷心感谢贝内隆选区的民众和澳大利亚人民选举我代表这个国家。”\n\n“在我将领导权移交给我的副手兼财务主管彼得·科斯特洛之际，我怀着无比的感激之情。他一直是澳大利亚经济的杰出管理者，我们党的未来与彼得息息相关。他就是我们的未来。”\n\n“我祝愿国家一切顺利，我深信澳大利亚最美好的时光还在未来。”"
 internal_talk_liberal.4.a: "迈向新的征程……"
 internal_talk_liberal.5.d: "“在过去的几年里，能够成为这个美丽国家的[GetASTLeaderTitle]，对我来说每天都是一种莫大的荣幸。我要感谢澳大利亚人民给予我的这份荣幸。我尊重并珍视它。经过多年的追求，领导这个国家是我一生中最不可思议的经历。”\n\n“我愿为自由党的一切行为承担全部责任，包括我们取得的成功和少数的失败，因此我将辞去党魁一职。我衷心感谢贝内隆选区的民众和澳大利亚人民选举我代表这个国家。”\n\n“在我将领导权移交给下一任领导人，我的卫生部长兼骄傲的同事托尼·阿博特之际，我怀着无比的感激之情。他一直是许多澳大利亚人的杰出代表，我们党的未来与托尼息息相关。他就是我们的未来。”\n\n“我祝愿国家一切顺利，我深信澳大利亚最美好的时光还在未来。”"
 solomon_islands_intervention.5.t: "清理"
 solomon_islands_intervention.5.d: "当地人走到那堆武器旁，又往上面倾倒了一大堆武器，大多是步枪。当天，另一支民兵部队向澳大利亚第三集团军投降，正被军官们带走。明天，工兵团将前来，在众目睽睽之下摧毁这些武器。他们会在一座仍在使用的体育场进行销毁，以此向公众展示秩序正在恢复。这名澳大利亚国防军士兵不知道这秩序是否来自国内，但他继续看着武器越堆越多。\n\n几十件铁器叮当作响地堆在一起，越堆越高。他和部队其他成员追捕这伙人大约一个月，他们是第一批一见到就投降的。事情似乎要结束了，比他预想的要快。战斗渐渐平息，但即使在附近的镇子里，也很少有灯亮着，生病的人都被空运离开了小岛。如果当地人想要留下来，枪声停止后，还需要做更多的工作。\n\n他肩上的无线电突然响了起来，他便动身前往下一个城镇。"
 solomon_islands_intervention.5.a: "重返工作"
 a_global_financial_crisis.2.t: "金融大洗牌"
 a_global_financial_crisis.2.d: "最近几周，许多靠贷款维持运营的中型企业倒闭并宣布破产。失业率的下降固然是负面影响之一，但这种平静的局面也令人担忧。经济衰退的迹象开始引起财政专家的不安，他们呼吁我们做好准备，一旦出现任何变数，立即采取行动。然而，目前为止，什么也没发生，我们只能尴尬地等待。"
 a_global_financial_crisis.2.a: "别为小事担心了。"
 black_saturday_ast.1.t: "黑色星期六"
 black_saturday_ast.1.d: "短短几天内，维多利亚州多处火灾迅速蔓延，数百处火点接连燃起，这场火灾被认为是历史上最严重的丛林大火。全国各地数千名消防员齐心协力，竭尽全力控制火势，但这场大火已造成25人丧生。\n\n来自澳大利亚中部持续数日的炎热干燥空气，为火势迅速蔓延创造了绝佳条件。大片房屋和土地已被摧毁，当局宣布进入紧急状态，救援人员正紧急撤离危险区域。然而，面对肆虐的火势，人们却束手无策，火焰已高达30米。"
 black_saturday_ast.1.a: "今年真不是我们走运的一年。"
 black_saturday_ast.2.t: "维多利亚州山火仍在肆虐"
 black_saturday_ast.2.d: "维多利亚州上空已连续数周漆黑一片，火势持续蔓延，死亡人数已上升至173人。虽然控制线已成功减缓了火势蔓延，但估计已有40万公顷土地被烧毁，当地野生动物遭受重创。\n\n[GetASTLeaderTitle]一直在灾区走访，慰问受灾民众，安慰那些灾情后情绪明显低落与无家可归的人们。据估计，目前无家可归的人数已达数千。疲惫不堪的消防员们仍在继续努力，预计下周天气将转好。\n\n维多利亚州几十年来最黑暗的日子或许正在慢慢结束，尽管这对国家来说也是巨大的损失。"
 black_saturday_ast.2.a: "一场无法用语言形容的悲剧。"
 ast_elections_howard_placeholders.1.t: "霍华德政府意外获胜"
 ast_elections_howard_placeholders.1.d: "尽管燃油价格上涨，且民众对约翰·霍华德的多项政策反应强烈，但仍未能阻止他赢得第三个任期。自由党在众议院赢得82个席位，这或许是该国历史上政治命运逆转最快的一次。\n\n与此同时，金·比兹利领导的政府遭遇了自1934年以来最低的党内初选得票率，工党内部一些消息人士称，反对党领袖预计将会辞职。霍华德在悉尼温特沃斯酒店发表胜选演讲时，感谢了支持者，特别是小企业，感谢他们让他赢得选举，并概述了他进一步改革的计划。"
 ast_elections_howard_placeholders.1.a: "就这么简单！"
 ast_elections_howard_placeholders.2.t: "霍华德政府连任"
 ast_elections_howard_placeholders.2.d: "尽管马克·莱瑟姆作为新任工党领袖举步维艰，但[AST.GetLeader]却一路高歌猛进，带领联盟党赢得连任并巩固了多数席位。巴厘岛爆炸案悲剧发生后，自由党的支持率大幅上升，表明民众倾向于谨慎稳健的执政方式。\n\n国家党为应对千年干旱而推行的农村水资源管理政策的成功，无疑也为联盟党的胜利做出了贡献。此次胜利标志着该党历史上第二长的连胜纪录。\n\n工党确实取得了一些进展，从绿党手中夺回了一个席位，又从国家党手中夺回了几个席位。尽管这很可能导致该党再次经历重组。"
 ast_elections_howard_placeholders.2.a: "再过三年！"
 election_outcomes_ast.1.t: "陆克文工党取得历史性胜利"
 election_outcomes_ast.1.d: "昨晚，自由党领袖[AST.GetLeader]落败，凯文·陆克文率领工党取得压倒性胜利，全国范围内支持率上升5.7%。工党历史上首次在所有州和领地都执政。副领袖朱莉娅·吉拉德的晋升也标志着澳大利亚历史上首次由女性担任第二高公职。\n\n执政联盟党领袖已辞职，并在当晚致电陆克文祝贺其胜选。新任[GetASTLeaderTitle]一直致力于改善劳资关系、维护原住民权益以及迅速应对气候变化，力图引领国家走向新的方向。他在胜选演讲中表示：“今天，选择权交到了人民手中，澳大利亚已展望未来。”"
 election_outcomes_ast.1.a: "未来已至。"
 election_outcomes_ast.2.t: "执政联盟意外获胜"
 election_outcomes_ast.2.d: "工党胜选的预测彻底落空，联盟党强势连任。[GetASTLeaderTitle][AST.GetLeader]在演讲中称选举结果是沉默的大多数的胜利，并概述了进一步经济投资的计划。尽管联盟党将继续执政，但工党在全国几乎所有州和领地都取得了显著进展，使得现任政府仅以微弱优势获得多数席位。\n\n据报道，陆克文已致电[GetASTLeaderTitle]祝贺他们获胜，预计他将在当晚晚些时候就败选发表讲话。联盟党现在肩负着领导国家的重任，同时也要努力维持公众对该党重燃的信心。"
 election_outcomes_ast.2.a: "她稳住了！"
 a_global_financial_crisis.3.t: "危机的影响逐渐消退"
 a_global_financial_crisis.3.d: "金融危机的余波在最近几周已基本消退。经济基本恢复到危机前的水平，公众舆论也对我们的努力表示支持。看来我们应对危机的措施最终取得了成效，甚至增强了经济抵御未来类似经济冲击的能力。"
 a_global_financial_crisis.3.a: "我们开工了。"
 turnbull_letter_ast.1.t: "特恩布尔的信"
 turnbull_letter_ast.1.d: "自由党现任领袖马尔科姆·特恩布尔公开指责我们的政府，声称掌握一封电子邮件，证明我们存在腐败行为。这封邮件的具体内容我们只能猜测，但似乎足以引起媒体的广泛关注。我们党内人士声称，特恩布尔的消息来源来自政府内部，这意味着我们党内可能存在内奸。\n\n预计马尔科姆·特恩布尔将在未来几周内向议会公布这封信。目前我们只能祈祷损失不会太严重。"
 turnbull_letter_ast.1.a: "我们做了什么？"
 turnbull_letter_ast.2.t: "一封伪造的信"
 turnbull_letter_ast.2.d: "事实证明，马尔科姆·特恩布尔那封臭名昭著的邮件完全是伪造的。在对此事进行全国性审计期间，特恩布尔的消息来源本人也承认，整件事都是他编造的。党内卧底戈德温·格雷奇为了提升影响力，向特恩布尔提供虚假信息。由此引发的强烈反弹几乎使特恩布尔的支持率跌至谷底，也让自由党陷入了内讧。与此同时，我们的民意调查结果已经回升，格雷奇也已被立即开除出党。"
 turnbull_letter_ast.2.a: "我们一秒钟都没相信过！"
 oceanic_viking_ast.1.t: "海洋维京号的困境"
 oceanic_viking_ast.1.d: "看来，我们目前用于边境保护的一艘海事船只逮捕了78名试图进入澳大利亚的斯里兰卡寻求庇护者。按照我们现行政策，他们登船后被送往印度尼西亚民丹岛进行处理，但现在他们拒绝下船，以示抗议。\n\n这已经是今年第49起船只拦截事件，媒体一如既往地蜂拥而至。目前，“海洋维京号”上的工作人员尚未成功将他们带走，而船只停留的时间越长，对我们越不利。反对派已经开始利用此事攻击我们，指责我们在打击非法移民方面软弱无力，而且船上似乎有几名寻求庇护者需要医疗救助。\n\n我们可以选择谈判，也可以选择强迫他们离开。"
 oceanic_viking_ast.1.a: "给予他们优先处理。"
 oceanic_viking_ast.1.b: "派兵进驻。"
 oceanic_viking_ast.2.t: "反移民抗议活动猖獗"
 oceanic_viking_ast.2.d: "针对海洋维京号事件的最终结果，我国大多数主要城市爆发了抗议活动，其中右翼政治人士的煽动尤为强烈。一国党尤其对这一举动进行了猛烈抨击，其批评力度甚至超过了反对党，尽管该党规模不大，却在网络上引起了广泛关注。\n\n他们的前党魁宝琳·汉森以争议性言论起家，她在昆士兰州的一次集会上也猛烈抨击了我们的政府，称其“反澳大利亚”。作为回应，也爆发了规模较小的反示威活动，并引发了一些冲突。"
 oceanic_viking_ast.2.a: "为什么大家就不能冷静下来呢？"
 oceanic_viking_ast.3.t: "操作失误"
 oceanic_viking_ast.3.d: "根据我们的指示，特种空勤团集结完毕，准备强行将船上的寻求庇护者带离。看来，在行动开始前，我们对相关情况的了解十分有限。当我们的队员登上船只时，发现一名斯里兰卡移民携带了一把手枪，双方随即爆发枪战。所幸我们只有一名队员受伤，但船上四名移民被击毙，两人受伤。其余人员被成功带离船只，并被送往民丹岛拘留中心。\n\n联合国为此召开了会议，不出所料，反弹相当强烈。大多数主要城市都爆发了抗议活动，这些城市也出现了反抗议活动。值得庆幸的是，反对派目前相对保持沉默。"
 oceanic_viking_ast.3.a: "这怎么可能？"
 great_barrier_reef.1.t: "大堡礁漏油事件"
 great_barrier_reef.1.d: "一艘中国散煤船在昆士兰中部罗克汉普顿以东搁浅。该船撞上暗礁时距离航道超过10公里，在暗礁上刮擦了相当长的一段距离后才停下来，并泄漏了超过2海里的重质燃油。\n\n目前已派出拖船前往移除该船，但人们担心该船可能会在波涛汹涌的海面上解体。联合国教科文组织和我们的珊瑚礁管理人员对此深感愤慨，因为该船偏离航线如此之远，而且其周围海域可能已经受到污染。我们正在与他们合作，尽可能减少损失，但这需要时间。"
 great_barrier_reef.1.a: "非常不幸。"
 ast_elections.3.t: "选举日"
 ast_elections.3.d: "竞选摊位正在撤离，广告宣传也接近尾声，各政党总部高度戒备。竞选季已经结束，投票站也已搭建完毕，等待着选举日的到来。来自全国各地的澳大利亚人即将聚集在一起，投票选出国会大厦的未来，我们下一任领导人的选择权现在掌握在他们手中。"
 ast_elections.3.a: "愿最优秀的候选人获胜。"
 dissolution_election_rudd.3.t: "陆克文大获全胜"
 dissolution_election_rudd.3.d: "工党总部成员正在庆祝陆克文的胜利，这是该党自1993年以来首次连续获胜，也证实了许多[GetASTLeaderTitle]支持者的愿望。工党回来了！\n\n经过数月持续推进改革的竞选，选举结果巩固了陆克文的民意支持。工党凭借众多新成员的加入，赢得了多数席位，预计将在未来几周内组建政府。昆士兰州几乎全境都染上了红色。\n\n选举结果也为绿党赢得了两个席位，表明公众对气候行动的支持日益增长。"
 dissolution_election_rudd.3.a: "继续工作。"
 dissolution_election_rudd.4.t: "托尼·阿博特乘胜追击"
 dissolution_election_rudd.4.d: "在四季酒店拥挤的大厅里，人群高呼着“托尼！托尼！托尼！”，自由党在澳大利亚历史上最胶着的选举之一中艰难取胜。这位保守党领袖在竞选期间以激情澎湃的言辞和“阻止偷渡船”的承诺引领潮流，他宣布自己“荣幸”能够执掌大局。“从今天起，我宣布澳大利亚由新的领导人执政，澳大利亚再次向商业开放。”\n\n气候问题立场鲜明的阿博特在竞选期间因其对民意走向的强烈反对而备受关注，但选民已经做出了选择。随着工党下台，自由党再次执政，预计新一届政府将在移民和财政保守主义问题上采取强硬立场。"
 dissolution_election_rudd.4.a: "自由党回来了！"
 ast_elections.1.t: "选举闪电战"
 ast_elections.1.d: "选举季临近，竞选活动也已拉开帷幕。根据选举法规定，我们只有八周时间来传递我们的信息。无论我们是通过铺天盖地的媒体宣传、走遍全国还是与反对派辩论，时间都紧迫。如果我们想要赢得选举，就必须立即行动起来，积极投入竞选活动。"
 ast_elections.1.a: "与自由党站在一起！"
 ast_elections.1.b: "给工党一个公平的机会！"
 ast_elections.1.c: "澳大利亚，一国党优先！"
 ast_elections.1.e: "与绿党一起争取变革！"
 special_gillard_election.1.t: "宣布举行新的选举"
 special_gillard_election.1.d: "我们巩固新政府合法性的唯一途径就是举行新的大选。如果我们能够赢得选民的支持，确保连任，就能获得继续执政所需的民意授权，并有可能减轻我们在立法过程中可能遭受的来自反对派的阻力。任何选举都存在风险，因此我们必须在接下来的60天里全力以赴。"
 special_gillard_election.1.a: "勇往直前，更上一层楼。"
 election_outcomes_ast.5.t: "投票结果：出现悬浮议会！"
 election_outcomes_ast.5.d: "这次选举出现了自1940年以来前所未有的意外：没有哪个政党能够完全获胜。联盟党和工党在计票中共获得72个席位，距离组建政府还差4个席位。当晚，两位候选人走到台上，宣布尽管计票结果已经出炉，但选举尚未结束，场面一度十分尴尬。\n\n接下来的几天里，各党派将在众议院展开激烈角逐，并与剩余议员进行谈判，以确保组建政府。"
 election_outcomes_ast.5.a: "一个分裂的国家。"
 election_outcomes_ast.4.t: "陆克文政府的又一次胜利"
 election_outcomes_ast.4.d: "昨晚，工党赢得大选结果出炉，悉尼街头人潮涌动。经过又一个任期的强硬政策，陆克文再次赢得民心，获得48%的选票，并在昆士兰州夺取了多个此前由联盟党把持的席位，突破了鲍恩盆地周边以往由矿业公司把持的堡垒。\n\n陆克文与家人一起在加巴板球场发表讲话，庆祝取得第三场胜利。\n\n“我的家人在公共生活中倾尽全力，也为我的竞选倾尽全力。接下来的几天，我和特蕾丝会和孩子们一起度过，然后我们又会回到竞选的岗位。这场戏还没结束。”"
 election_outcomes_ast.4.a: "好日子还在继续。"
 election_outcomes_ast.6.t: "吉拉德成功连任"
 election_outcomes_ast.6.d: "澳大利亚首位女性[GetASTLeaderTitle]吉拉德逆转了早期民调结果，再次赢得公众支持，组建少数派政府。她在墨尔本会展中心感谢支持者，并阐述了她负责任的财政领导计划和进一步的医疗改革方案。\n\n反对党领袖托尼·阿博特在选举结果公布后不久便致电吉拉德，祝贺她胜选。如果再次败选，阿博特预计将辞去党魁职务，这表明鉴于未能成功将该党向右翼靠拢，党的政策将发生改变。"
 election_outcomes_ast.6.a: "这是明智政策的胜利。"
 new_governor_general_ast.1.t: "新任总督"
 new_governor_general_ast.1.d: "澳大利亚历史上首次迎来女性总督。现年65岁的昆汀·布莱斯曾是一名律师，也曾担任昆士兰州州长，她是澳大利亚第25任总督，也是107年来首位担任此职的女性。\n\n在堪培拉国会大厦举行的仪式上，布莱斯向女王宣誓效忠，同时大厦外鸣放了21响礼炮。\n\n“我想让大家知道，我将以庄重、公正、饱满的热情以及对我们共同祖国的深切热爱来承担这一角色，”她说。“我承诺将秉持开放、积极回应和忠于澳大利亚社会当代思想和运作的原则。”"
 new_governor_general_ast.1.a: "时代真的在变化。"
 indo_cattle_drama.1.t: "印尼牛出口困境"
 indo_cattle_drama.1.d: "澳大利亚广播公司最近播出了一期名为《四角》的节目，揭露了印尼养牛业的系统性虐待行为。节目画面十分触目惊心，引发了公众的强烈抗议，要求我们立即停止向印尼出口活牛。我们可以暂停活牛出口，直到印尼同意新的监管框架，但这项禁令将使我们在北方的农场遭受严重的经济损失。"
 indo_cattle_drama.1.a: "暂停出口。"
 indo_cattle_drama.1.b: "不值得。"
 malaysia_solution_ast.1.t: "马来西亚解决方案"
 malaysia_solution_ast.1.d: "考虑到我们目前移民拘留中心的破旧状况，马来西亚已向我们提出将我们拥有的800名寻求庇护者交给他们的提议，以换取接收4000名经过处理的难民。这将解决我们眼前的拘留问题，并平息一些公众的抱怨，但马来西亚不是《联合国难民公约》的签署国，这使得整个协议在法律上存在疑问。"
 malaysia_solution_ast.1.a: "一言为定"
 malaysia_solution_ast.1.b: "这在法律上站不住脚。"
 malaysia_solution_ast.2.t: "高等法院驳回马来西亚协议"
 malaysia_solution_ast.2.d: "不幸的是，澳大利亚高等法院裁定此次交换违反了《移民法》，并阻止了此次转移。反对派立即发起了一系列指责，而公众的反应如今更是愈演愈烈。我们或许需要考虑其他方法来解决移民拘留问题。"
 malaysia_solution_ast.2.a: "没那么容易。"
 embassy_tent_protests.1.t: "大使馆帐篷抗议活动"
 embassy_tent_protests.1.d: "为庆祝原住民帐篷大使馆事件四十周年（1972年，原住民在议会大厦外举行抗议占领行动，声援原住民权利），颁奖典礼在附近的洛贝餐厅举行。一群聚集在大使馆的抗议者似乎已经向餐厅方向移动。他们似乎被激怒了，有些人甚至开始敲打餐厅的窗户。\n\n由于[GetASTLeaderTitle]和反对党领袖都在现场，安保人员建议立即使用附近的直升机疏散人群。人群看起来相当骚动，但或许展开对话能够平息事态。"
 embassy_tent_protests.1.a: "放我出去！"
 embassy_tent_protests.1.b: "我们来和观众们聊聊。"
 embassy_tent_protests.2.t: "[GetASTLeaderTitle]受伤"
 embassy_tent_protests.2.d: "一场安全噩梦就此上演：吉拉德的保镖们在人群中腾出一个空隙，让她走出去与他们交谈。仅仅一分钟后，一名抗议者投掷的物体击中了[GetASTLeaderTitle]，将她击倒在地，并导致她右眼受伤。警察和保镖们迅速控制了人群，并将吉拉德从活动中疏散出去。但经医院检查，她的右眼似乎已永久性受伤。\n\n反对党领袖托尼·阿博特在议会上花了一点时间赞扬了这位[GetASTLeaderTitle]的勇敢，并谴责了这次袭击。"
 embassy_tent_protests.2.a: "哦，不.."
 embassy_tent_protests.3.t: "驯服人群"
 embassy_tent_protests.3.d: "陆克文离开看台后，幸好没有发生什么意外，人群在他开始与民众互动后似乎平静了下来。看来是托尼·阿博特的一番言论引发了这场骚动，而随着反对党领袖的离开，紧张局势也随之缓和。\n\n[GetASTLeaderTitle]在返回典礼现场前，与附近的民众和记者们互动了一个小时，带来了不错的正面宣传效果。"
 embassy_tent_protests.3.a: "就是这么做的。"
 embassy_tent_protests.4.t: "与抗议者发生冲突"
 embassy_tent_protests.4.d: "安保人员在人群中腾出一条通道，让托尼走出展馆与抗议者交谈。这时，一名抗议者突然向[GetASTLeaderTitle]扑来，似乎喝醉了。托尼见状，挥拳还击。这名抗议者并未受重伤，显然阿博特是在自卫。但场馆内的记者们迅速拍下了他们需要的所有照片，现在看来，[GetASTLeaderTitle]似乎真的在和示威者打架。"
 muslim_protests_sydney.1.t: "悉尼爆发伊斯兰骚乱"
 muslim_protests_sydney.1.d: "从中东到伦敦，一系列大规模示威游行席卷全球，穆斯林民众走上街头，抗议电影《穆斯林的无知》的上映。悉尼也未能幸免，抗议活动蔓延至市中心。超过150名警察被派往现场，其中6人在骚乱中受伤送医。\n\n目前已有8人被捕，在美国领事馆外发生紧张冲突后，人群开始散去。"
 muslim_protests_sydney.1.a: "这里绝不容许极端主义存在。"
 murrawarri_republic_event.1.t: "穆拉瓦里共和国宣布独立"
 murrawarri_republic_event.1.d: "我们的议会收到一封信，宣布一个名为“穆拉瓦里共和国”的国家独立。信中指出，“穆拉瓦里人民委员会”声称新南威尔士州和昆士兰州交界处的领土是其新的主权领土，并要求得到承认。\n\n坦白说，这是我们所有员工见过的最奇怪的事情，他们似乎没有任何法律依据提出这样的要求，我们也没有任何法律依据做出回应。"
 murrawarri_republic_event.1.a: "穆拉什么东西？"
 shark_attacks_ast.1.t: "鲨鱼袭击事件加剧公众担忧"
 shark_attacks_ast.1.d: "在珀斯以南约270公里处的格雷斯敦附近，一名35岁男子被鲨鱼袭击身亡。6天后，另一名冲浪者，18岁的扎克·杨，在科夫斯港附近也遭遇鲨鱼袭击身亡。这一系列突如其来的鲨鱼袭击致死事件促使西澳大利亚州政府承诺，将采取更积极的措施来猎杀进入热门游泳区域的鲨鱼。\n\n尽管近年来鲨鱼袭击的风险有所下降，但西澳州政府已花费超过2000万美元用于空中巡逻和捕杀，以减少鲨鱼数量，这一举措被海洋生物学家质疑为反应过度。"
 shark_attacks_ast.1.a: "我们是朋友，不是食物！"
 election_outcomes_ast.3.t: "工党成功连任"
 election_outcomes_ast.3.d: "澳大利亚民众聚集在全国各地投票，决定国家的未来走向。这一次，他们选择让[AST.GetLeader]继续执政，赋予该党又一个任期。[GetASTLeaderTitle]在巴顿总部发表了竞选演说，周围是欢呼雀跃的工党支持者，他概述了未来三年的计划。工党的“执政魔咒”似乎已被打破，反而变成了一份礼物，促使选民倾向于维持现状，而非寻求变革。"
 election_outcomes_ast.3.a: "为什么要阻止一件好事发生呢？"
 election_outcomes_ast.7.t: "自由党赢得连任"
 election_outcomes_ast.7.d: "随着选举活动的结束和计票工作的接近尾声，现任[AST.GetLeader]预计将以压倒性优势赢得连任。其政府持续获得多数选民的支持，巩固了其在众议院和参议院的地位，并在全国范围内取得了小幅增长。议会预计将照常召开，新一届任期将于下月开始。"
 election_outcomes_ast.7.a: "好运接踵而至！"
 election_outcomes_ast.9.t: "马尔科姆·特恩布尔险胜"
 election_outcomes_ast.9.d: "自由党领袖马尔科姆·特恩布尔宣布在联邦选举中获胜，联盟党在议会中正逼近微弱多数席位。\n\n“今天是个好日子，”特恩布尔在发表当晚讲话前对媒体说道。\n\n在竞选期间，新任[GetASTLeaderTitle]承诺组建一个更加技术官僚化的政府，并在就职演说中明确表达了这一方向。\n\n“我们必须更有竞争力，我们必须提高生产力，而且 - 我们必须更有创新精神。”\n\n特恩布尔政府预计将解决国家日益增长的能源需求，并解决不断扩大的科技行业问题，正如他所说，“愿意与人民和我们的行业找到共同点。进步就是帮助每个人，我知道，如果我们全心投入，我们就能取得伟大的成就。”"
 election_outcomes_ast.9.a: "让我们共同展望更美好的未来！"
 detention_centres_full.1.t: "拘留中心已接近饱和"
 detention_centres_full.1.d: "尽管巴布亚和瑙鲁的移民中心最初规模较大且运作良好，但目前已接近饱和，导致我们的移民处理工作出现瓶颈。虽然目前已拨付资金用于改善这些中心的现有不足，但如果要从根本上解决这个问题，还需要寻求进一步的改进或方案。与此同时，非法入境人数已达到多年来的最高水平。"
 detention_centres_full.1.a: "难道最后还是什么都做不了？"
 migration_event_ast.1.t: "非法移民人数创下新纪录"
 migration_event_ast.1.d: "近几个月来，试图非法入境我国的移民人数激增。无论是受持续不断的危机影响，还是出于对我国繁荣发展的艳羡，这些移民都来自四面八方，而且许多人试图绕过正规程序。我国边境巡逻队的拦截数量已达到历史新高，这开始使我们的行动能力捉襟见肘。"
 migration_event_ast.1.a: "时局动荡。"
 aukus_formed_ast.1.t: "奥库斯伙伴关系合作行动"
 aukus_formed_ast.1.d: "今天早些时候，澳大利亚、英国和美国的领导人在华盛顿特区的五角大楼举行会晤，讨论组建三边联盟的事宜。据报道，网络能力、人工智能和供应链保护是讨论的内容之一，所有这些都旨在深化三国之间的外交和防务合作。\n\n“70多年来，澳大利亚、英国和美国一直携手合作……今天，我们重申对这一愿景的承诺。”\n\n显然，此次合作将作为对三国现有联盟的补充。[AST.GetLeader]指出，奥库斯的首要目标是加强国防扩散。"
 aukus_formed_ast.1.a: "两人成伴，三人成友。"
 pukpuk_treaty_event.1.t: "历史性的巴布亚新几内亚-澳大利亚条约正式生效"
 pukpuk_treaty_event.1.d: "巴布亚新几内亚和澳大利亚之间具有里程碑意义的“普克普克条约”已经最终敲定，并被[GetASTLeaderTitle]誉为两国关系的提升，他们表示两国“从邻居、朋友，到现在的盟友”。\n\n该条约以当地“鳄鱼”一词命名，将启动巴布亚新几内亚军队并入澳大利亚国防军的进程，并允许至多1万名巴布亚新几内亚国民服役。双方还承诺，若任何一方遭受攻击，将互相提供支持。这将极大地促进区域安全保障和稳定。"
 pukpuk_treaty_event.1.a: "致我们的合作伙伴和朋友们！"
 ast_taiwan_recognition.1.t: "澳大利亚承认中华民国"
 ast_taiwan_recognition.1.d: "[AST.GetLeader]正式承认台湾为主权独立国家，这一具有里程碑意义的政策逆转了两党此前的政策。这是自1971年惠特拉姆访问台湾以来，澳大利亚首次在对华立场上偏离对大陆的立场。作为印太地区“和平势头”的一部分，[GetASTLeaderTitle]表示，这一承认是对“现实的承认”，并推动了“两个中国”理念的构建。\n\n中国的反应迅速而强烈。中国部长们在网上抨击澳大利亚是“两面派国家”，外交部立即开始对两国之间的贸易实施一系列限制措施，几乎达到了全面禁运的程度。"
 ast_taiwan_recognition.1.a: "真是个好朋友。"
 howard_rumblings_in_dark.1.t: "党内喧嚣"
 howard_rumblings_in_dark.1.d: "自由党内部一直存在着一种好斗的情绪，任何争议往往都会激起这种情绪。霍华德深知，同事和心怀不满的同僚之间唯一的区别就是民调支持率，而最近民调支持率却惨淡下滑。私下的抱怨之声虽然已经通过小报传播开来，但即便没有小报，这些批评之声依然不绝于耳。\n\n有人说霍华德年纪太大，也有人说他“脱离群众”。但他心里清楚，恰恰相反，他对幕后的权谋运作了如指掌。他的副手彼得·科斯特洛已经开始为下一届党魁选举做准备了。他四处斡旋，拉拢选票，如果霍华德无法如愿，他就会离开总理职位，而科斯特洛则会取而代之。这就是党派政治的本质。"
 howard_rumblings_in_dark.1.a: "我们必须解决这个问题。"
 howard_rumblings_in_dark.2.t: "内阁中的背叛"
 howard_rumblings_in_dark.2.d: "这并非毫无预兆，但他确实是在清晨时分得知了消息。霍华德不愿任由他们把他拖入泥潭，更不愿在党魁选举中被他们一脚踢开，他决定按自己的方式离开。他曾把党从崩溃的边缘拉了回来，现在他们却要把他踢出去。\n\n“在过去的几年里，能够成为这个美丽国家的[GetASTLeaderTitle]，对我来说每天都是一种莫大的荣幸。我要感谢澳大利亚人民在这段时间里给予我的这份殊荣。我对此充满敬意和感激。经过多年的追求，领导这个国家是我一生中最不可思议的经历。”\n\n“我要感谢澳大利亚人民给予我的这份殊荣，让我有机会为他们服务。我愿为自由党承担全部责任，无论成败。失去党内席位并非易事。然而，我对他们的亏欠远大于党对我的亏欠。”\n\n他最后挥了个小手，然后就返回了贝内隆。回到更美好的地方……"
 howard_rumblings_in_dark.2.a: "然而，它仍然让我感到刺痛。"
 abbott_gov_event.1.t: "阿博特政府公布男性主导的内阁名单"
 abbott_gov_event.1.d: "当选[GetASTLeaderTitle]的托尼·阿博特公布了内阁名单，内阁成员经验丰富，其中有15位是霍华德政府的老将 - 但女性代表人数较少，副[GetASTLeaderTitle]朱莉·毕晓普是19名内阁成员中唯一的女性。\n\n阿博特表示，他对内阁中女性人数不足“至少没有两位”感到失望，但他预计随着时间的推移，女性会得到晋升，外围内阁中“优秀且有才华”的女性会“敲响”内阁的大门。然而，在11名外围内阁成员中，只有4名是女性。\n\n这种不平衡引起了反对党的诸多批评，但阿博特迅速转移话题，转而关注“更重要的问题”。"
 abbott_gov_event.1.a: "毕竟，这是一个精英体制。"
 abbott_gov_event.2.t: "澳大利亚投票赞成承认原住民权利"
 abbott_gov_event.2.d: "在全国范围内以74%的支持率通过投票后，澳大利亚原住民和托雷斯海峡岛民将被写入宪法，这是艾伯特政府新推出的原住民权利承认政策的一部分。在公投前的加尔马年度文化节上，艾伯特表示，“承认原住民权利并非改变我们的宪法，而是完善它”，并称这项修正案对许多人来说是一个疗愈的时刻。\n\n自选举结果公布以来，阿博特也重申了他计划在原住民社区待一周的计划。\n\n“事实上，如果这些地方是澳大利亚原住民的家园，为什么它们就不能成为我们国家[GetASTLeaderTitle]的家园呢？”"
 abbott_gov_event.2.a: "确实如此。"
 abbott_gov_event.3.t: "洋葱事件"
 abbott_gov_event.3.d: "托尼·阿博特前往塔斯马尼亚乡村，与当地农民会面，这是他农业项目的一部分。记者们聚集在凉亭周围，托尼与一位农民握手，并发表了简短讲话。\n\n他面前摆着一个方形篮子，里面装满了农产品，每一样都成熟饱满，闪闪发亮。当农场主向记者们讲解这个项目时，阿博特的心思却全在洋葱上。\n\n如果他不表现出对农民的真心，记者们会相信他真的如此吗？他们又如何能看出澳大利亚的农产品真的是世界上最好的呢？\n\n他低头看着洋葱时，旁边有人开始起哄。“你要是想吃，现在就可以咬一口了！”\n\n他们真的这么说过吗，还是托尼自己的想法怂恿他？还没等他反应过来，他手里就多了一个洋葱。当他咬了一口生洋葱时，摄像机开始闪烁，周围响起了几声嘲笑声。农夫难以置信地转过头来，托尼只是停下来点了点头，然后又咬了一口。他只能说“很好”，看着托尼继续咀嚼。"
 abbott_gov_event.3.a: "他为什么要这样做？"
 abbott_gov_event.4.t: "四处游荡"
 abbott_gov_event.4.d: "尽管有蚊帐，也不停地喷洒杀虫剂，还是有一只蚊子飞进了帐篷。天太黑，看不见它，所以他尽量不去理会。他已经在偏远的北领地阿纳姆地和当地领导人一起待了大半周，除了床边笔记本电脑不停的嗡嗡声之外，这段经历一直都很平静。\n\n第二天照例举行了各种仪式，并与古马吉氏族首领进行了单独会面。首领非常渴望讨论力拓集团向他提出的收购方案，该方案计划在附近开采一座新的铝土矿。力拓集团之前已经在该地区钻探过，但新矿将位于圣地，因此必须得到[GetASTLeaderTitle]的批准。\n\n部落首领将获得75%的矿产收益，力拓公司声称该项目将为古马吉人带来“采矿业的成功职业生涯”。但鉴于力拓在约尔努人土地上开采多年，却只培养出一名合格的原住民学徒，这种说法令人怀疑。"
 abbott_gov_event.4.a: "批准该矿场。"
 abbott_gov_event.4.b: "这是圣地。"
 abbott_gov_event.5.t: "课程中的疏忽"
 abbott_gov_event.5.d: "托尼·阿博特站在讲台上，面前是他不久前竞选时所在的那间挤满了人的房间。他身后挂着自由党的横幅和澳大利亚国旗，他坚持说国旗也挂在了旁边。他先是寒暄了几句，然后开始深入探讨当前教育体系的不足之处。托尼或许最擅长的就是抨击问题。正是这种风格让他成为了一位优秀的反对党领袖，而现在，他正试图推销他的课程改革方案。\n\n毫无疑问，他的雄辩赢得了他们的支持，但随着演讲的进行，发生了一件非常不幸的事情。\n\n“没有人，无论多么聪明，多么有学识，多么有经验……都能成为智慧的化身。”\n\n阿博特这才慢慢意识到自己把“仓库”这个词和一种医用直肠器械的名字搞混了，引来一阵轻笑。他继续演讲，没有再出现任何纰漏，但到了第二天，这个小错误却登上了各大报纸的头版头条。"
 abbott_gov_event.5.a: "它们听起来确实很像……"
 abbott_gov_event.6.t: "委员会的调查结果"
 abbott_gov_event.6.d: "审计工作对我们的支出进行了全面审查，并提出了一个相当激进的削减开支方案。方案中包括削减养老金、公共医疗保健、教育和失业救济金。如果我们全面推行该方案，公众的强烈反对可能会让我们难以承受，但这无疑会极大地推动预算增长。否则，我们可以对方案进行调整，使其更易于被选民接受。"
 abbott_gov_event.6.a: "兑点水稀释一下。"
 abbott_gov_event.6.b: "坚持到底。"
 malcolm_abbott_event.1.t: "马尔科姆的来访"
 malcolm_abbott_event.1.d: "我们的通讯部长马尔科姆·特恩布尔已就我们的政策方向与我们进行了低调沟通，警告称任何持续的削减开支措施都将产生严重后果。他指的是党内反应还是公众舆论尚不清楚，但马尔科姆此前确实有作秀的倾向。这或许只是他又一次反应过度，而且他之前也曾公开反对过我们的财政限制措施。"
 malcolm_abbott_event.1.a: "公开宣布停止削减成本。"
 malcolm_abbott_event.1.b: "他反应过度了。"
 malcolm_abbott_event.2.t: "阿博特的“残酷预算”引发全国抗议"
 malcolm_abbott_event.2.d: "数千人参加了澳大利亚各地的集会，抗议政府最新一轮的削减开支措施。几乎每个主要城市都举行了声势浩大的“推翻预算”抗议活动，澳大利亚工会理事会也参与其中，并参加了游行。财政部长乔·霍基试图为削减开支辩护，声称国家“已经滑向了上世纪70年代的阶级斗争路线”，而他的预算旨在实现机会平等，而非结果平等。\n\n尽管如此，抗议者们表示他们计划在本月剩余时间里继续游行。最近一次游行是在国会大厦外的草坪上，游行队伍中出现了一个真人大小的[GetASTLeaderTitle]木偶。"
 malcolm_abbott_event.2.a: "我长得不像那样！"
 malcolm_abbott_event.3.t: "领导层更迭"
 malcolm_abbott_event.3.d: "在最近的公众强烈反对之后，在最近一次党内会议上，一名成员投票赞成进行领导层“更迭”，这引发了关于托尼是否应该继续担任领导的重新投票。由于无人敢于挑战，除了托尼之外，唯一的候选人是房间里空着的一把椅子。\n\n投票结果显示，[GetASTLeaderTitle]以61票胜出，但也有39票投给了空缺的主席职位，这并非小数目。显然，党内支持率的下降令人担忧，如果我们无法扭转局面，再次投票的结果可能会更糟。"
 malcolm_abbott_event.3.a: "还有时间。"
 abbott_jakarta_event.1.t: "打好仗"
 abbott_jakarta_event.1.d: "在阿博特看来，先去雅加达是个不错的开始。许多澳大利亚人似乎忘记了，印尼是一个拥有超过2.3亿人口的穆斯林占多数的国家，而且距离澳大利亚本土很近。自从巴厘岛爆炸案发生以来，几乎每个月都会传来新的袭击消息。他始终担心下一次袭击不会发生在离家更近的地方，所以这种担忧一直萦绕在他的心头。\n\n当托尼与总统[IND.GetLeader]交谈时，他提出了这个话题。当然，他的目标是推销澳大利亚在该国开展维和行动的想法，他已经为此争取了一段时间，这让印度尼西亚政府非常沮丧。\n\n此前几十年，软实力一直是首选战略，通过教育项目和其他援助计划，将他们所滋生的民族矛盾控制在适度水平。但这几乎无法解决原教旨主义的威胁。托尼离开时，对方政府最多只承诺会继续目前的合作，并且未来合作的大门依然敞开。"
 abbott_jakarta_event.1.a: "总之，结果令人失望。"
 o_canada_abbott.1.t: "澳大利亚提供采矿合作"
 o_canada_abbott.1.d: "堪培拉政府已向我们提出交换采矿技术专家的提议，旨在拉近两国的距离，并充分利用我们共同拥有的丰富自然资源。这项协议相当简单明了，表面上看对我们双方都有利，即便澳大利亚现任政府与我们的关系并不密切。"
 o_canada_abbott.1.a: "我们欢迎英联邦兄弟。"
 o_canada_abbott.1.b: "不了，谢谢"
 o_canada_abbott.2.t: "渥太华的一些失误"
 o_canada_abbott.2.d: "托尼站在渥太华加拿大战争博物馆的航空展厅里，对着一群记者讲话。尽管身处加拿大，但其中许多人却是澳大利亚人。看来他就算出国，也会被一群记者追着跑。[CAN.GetLeader]在他讲话时就站在他旁边。他努力避免对他们进行刻板印象的描述，但还是忍不住提到，他们的确很友好。不过，他们的政治立场在他看来有点偏左。\n\n托尼的思绪又回到了结束演讲的时候。在离开之前，他转身与领导人握手，虽然他在演讲中确实有几次结结巴巴，有一次将这个国家称为“加拿迪亚”，但事情进展顺利。加拿大政府已同意一项采矿投资，作为交换，我们将派遣自己的专家前往那里协助钻探。"
 o_canada_abbott.2.a: "这就是英联邦的共同之处。"
 abbott_china_trade.1.t: "澳大利亚进一步加强贸易合作"
 abbott_china_trade.1.d: "澳大利亚领导人[AST.GetLeader]一直非常热衷于通过推进自由贸易协定来扩大我们与澳大利亚目前的贸易范围。该协定将包括高达95%的商品免税进口，以及更顺畅的资源交换，同时还将包含允许我国私营企业更便捷地在澳大利亚投资的条款。表面上看，这似乎是一个全方位的双赢方案。"
 abbott_china_trade.1.a: "一项值得努力的事业"
 abbott_china_trade.1.b: "不符合我们的最佳利益。"
 abbott_china_trade.2.t: "[GetYear]自由贸易协定签署"
 abbott_china_trade.2.d: "中国已同意我们的双边自由贸易协定，这将极大地加强我们之间矿产和制成品的流通。经过近十年的谈判，这项范围更广的协定终于得以实现。鉴于中国是我们最大的出口收入来源国，其影响将立即惠及整个经济。随着刚刚签署的文件和一次握手，太平洋地区突然变得更加紧密、更加团结。"
 abbott_china_trade.2.a: "利益一致的魔力。"
 abbott_china_trade.3.t: "中国否认进一步开展贸易合作"
 abbott_china_trade.3.d: "遗憾的是，中国拒绝了我们进一步合作的提议，并且暂时关闭了外交大门。看来我们未来可能需要寻找其他途径。"
 abbott_china_trade.3.a: "结果不算最糟，但也肯定不好。"
 abbott_navy_exercises_event.1.t: "演习的成果"
 abbott_navy_exercises_event.1.d: "与美国朋友的联合演习已经结束，并取得了一些有益的成果。除了我方部队获得了急需的实战经验外，演习还暴露了我方部队技术方面的一些不足。在与研发部门分享数据后，我们似乎可以将其中一些发现应用到我们的研发工作中。"
 abbott_navy_exercises_event.1.a: "这确实很有用。"
 knights_and_dames_ast_event.1.t: "菲利普亲王受封爵位引发不同反应"
 knights_and_dames_ast_event.1.d: "[GetASTLeaderTitle]的资深同事们对他决定恢复授予非澳大利亚人菲利普亲王澳大利亚骑士勋章的传统表示困惑、愤怒和沮丧。\n\n内阁部长们告诉澳大利亚广播公司，[GetASTLeaderTitle]在宣布授予该奖项之前并未咨询任何领导层成员。此举似乎导致议会内部共和党支持者分裂。\n\n“我非常高兴，在他九十多岁高龄，即将结束他奉献一生的征程之际，我们国家能够真正认可他为我们所做的一切。”托尼·阿博特在就此决定发表的声明中说道。尽管英国的反应略显低调，表达了感激之情，但澳大利亚国内的反应却截然不同。"
 knights_and_dames_ast_event.1.a: "你不可能让每个人都满意。"
 abbott_japan_trade_deal.1.t: "堪培拉的贸易重新谈判"
 abbott_japan_trade_deal.1.d: "澳大利亚的[GetASTLeaderTitle],[AST.GetLeader]已直接联系我们，讨论重新谈判我们目前与澳大利亚的贸易承诺，以进一步“纠正”一些不足之处。目前尚不清楚他们指的是我们这边还是他们那边的问题，但对协议进行一些完善或许能使我们之间的货物运输更加顺畅，尤其是在农产品进口方面。"
 abbott_japan_trade_deal.1.a: "这似乎很公平。"
 abbott_japan_trade_deal.1.b: "不了，谢谢"
 abbott_japan_trade_deal.2.t: "与日本的谈判达成历史性协议"
 abbott_japan_trade_deal.2.d: "重新谈判取得了巨大的经济成果，为我们争取到了一份更加公平的协议。日本对我国牛肉征收的关税将基本取消，其他一系列农产品也将如此。然而，他们唯一不愿让步的农产品是大米。\n\n他们还将签署一份优先资源合同。与此同时，正如我们承诺的那样，我们将大幅削减其电子产品和车辆的多项关税。这将极大地促进我国农业发展，其意义不容低估。与最初的协议相比，这对我们来说是一项重大胜利。"
 abbott_japan_trade_deal.2.a: "这才算公平。"
 abbott_saf_event.1.t: "开普敦的困境"
 abbott_saf_event.1.d.a: "令人费解的是，南非竟然有三个不同的首都。阿博特对此感到难以理解。为了不耽误行程，他们选择了约翰内斯堡作为首站，方便起见。抵达后，他首先参观了新建的第一国民银行体育场。显然，他们急于展示其现代化成果，尽管托尼很清楚自己身处一个发展中国家。\n\n他最终不得不面对的棘手问题是难民问题。成千上万以白人为主的农民为了躲避持续不断的种族冲突而逃离家园，他们一直在抗议南非政府的不作为。然而，官员们坚称他们已经竭尽所能，并表示这个问题被夸大了。\n\n阿博特只知道难民人数不断增加，而且他们要求受到谴责。"
 abbott_saf_event.1.d.b: "令人惊讶的是，南非竟然有三个不同的首都。阿博特对此感到难以理解。为了不耽误行程，约翰内斯堡被选为首府，方便快捷。抵达后，他的第一站是纳尔逊·曼德拉纪念馆。阿博特对曼德拉先生充满敬意，甚至要求澳大利亚全国降半旗致哀。\n\n尽管他最终不得不面对的棘手问题是难民问题。成千上万以白人为主的农民为了躲避持续不断的种族冲突而逃离家园，他们一直在抗议南非政府的不作为。然而，官员们坚称他们已经竭尽所能，并表示这个问题被夸大了。\n\n阿博特只知道难民人数不断增加，而且他们要求受到谴责。"
 abbott_saf_event.1.b: "谴责政府并加快难民签证审批。"
 abbott_saf_event.1.a: "我们支持他们。"
 indonesian_intervention_abbott.2.t: "雅加达拒绝了我们的请求"
 indonesian_intervention_abbott.2.d: "不出所料，印尼政府拒绝了我们允许在该国开展维和行动的请求，并阻止我们的外交官就此事进行进一步磋商。这一回应使我们除了采取直接行动外，几乎别无选择。与此同时，一切合作似乎都已陷入僵局。"
 indonesian_intervention_abbott.2.a: "他们这是在逼我们出手。"
 indonesian_intervention_abbott.3.t: "雅加达认可我们的维和行动"
 indonesian_intervention_abbott.3.d: "仿佛世界末日真的来临了，或许是雅加达结冰了。印尼政府已经批准了我们向该国提出的维和行动请求。这将极大地促进我们的反恐工作，而且由于我们能够直接干预威胁，未来再次发生袭击的可能性已大大降低。"
 indonesian_intervention_abbott.3.a: "这是个好消息！"
 oceanic_alliance_ast.1.t: "关于建立大洋洲联盟的讨论"
 oceanic_alliance_ast.1.d: "堪培拉政府已派遣代表团前来商讨建立正式的海洋联盟，其明确意图是希望我们加入。加入该联盟实际上意味着我们将联合两军，以在太平洋地区维持防御措施。澳大利亚方面坚称，如果该联盟得以建立，将在可预见的未来避免该地区发生冲突。然而，我们无疑将放弃一定程度的自主权，并且或许会被迫受制于澳大利亚不断变化的外交政策。"
 oceanic_alliance_ast.1.a: "一项值得做的努力。"
 oceanic_alliance_ast.1.b: "我们的独立性更重要。"
 oceanic_alliance_ast.2.t: "新西兰拒绝联盟"
 oceanic_alliance_ast.2.d: "新西兰政府似乎认为目前尚不宜正式缔结联盟，因为他们觉得现有的防御能力已经足够。这无疑令人失望，但或许还有其他途径可以探索。"
 oceanic_alliance_ast.2.a: "他们随他们便。"
 oceanic_alliance_ast.3.t: "印尼拒绝结盟"
 oceanic_alliance_ast.3.d: "印尼政府似乎认为目前尚不宜正式缔结联盟，认为其现有的防御能力已经足够。这无疑令人失望，但或许还有其他途径可以探索。"
 oceanic_alliance_ast.4.t: "巴布亚新几内亚拒绝加入联盟"
 oceanic_alliance_ast.4.d: "看来莫尔兹比港政府目前并不打算正式结盟，认为其现有的防御能力已经足够。这无疑令人失望，但或许还有其他途径可以探索。"
 oceanic_alliance_ast.5.t: "瓦努阿图拒绝加入联盟"
 oceanic_alliance_ast.5.d: "瓦努阿图共和国似乎认为目前尚不宜正式结盟，认为其现有的防御能力已足够。这无疑令人失望，但或许还有其他途径可以探索。"
 operation_sovereign_abbott.1.t: "主权边界行动"
 operation_sovereign_abbott.1.d: "斯科特·莫里森俯身靠近阿博特，抓住他的手，在闪光灯的照射下摇晃起来。斯科特比他高几英寸，他的手被斯科特紧紧握住几秒钟，这让阿博特感到有些不自在。私下里，莫里森将这项法案描述为一项不受欢迎但必要的举措，旨在应对日益严重的非法移民问题，并表示如果出现任何反对意见，他愿意挺身而出。但阿博特经验老道，他知道事情远不止如此。\n\n莫里森因其幕后工作而声名鹊起，实际上扮演着党鞭的角色，只是没有正式头衔，却始终维持着党内秩序。不可否认，他的确卓有成效，总能迅速提出只有他才能预见到的问题的解决方案。到目前为止，他已经尽职尽责。如果他想获得一些赞誉，那也无可厚非，毕竟这是他制定的政策。于是，艾伯特同意了，而这次发布会也变成了他们政府的一场大型宣传秀。"
 operation_sovereign_abbott.1.a: "茄子！"
 japan_subs_abbott.1.t: "决定购买"
 japan_subs_abbott.1.d: "最初的计划是购买6艘春潮级潜艇来取代我们老化的柯林斯级舰队。但考虑到对海上火力的需要，我们可以要求购买3艘直升机轻型驱逐舰。\n\n这些潜艇能很好地扩充我们的舰队规模，而且型号也已升级到最新技术。另一方面，村雨级驱逐舰或许能让我们在空中作战和火力方面占据优势。"
 japan_subs_abbott.1.a: "购买潜艇"
 japan_subs_abbott.1.b: "购买驱逐舰"
 japan_subs_abbott.2.t: "来自澳大利亚的船舶采购请求"
 japan_subs_abbott.2.d: "澳大利亚方面提出了一项有趣的提议。他们提出以一笔可观的金额购买我们六艘老旧的春潮级潜艇，以扩充他们的舰队。这将加强我们之间的防务关系，并为更换潜艇提供一些额外的资金。"
 japan_subs_abbott.2.a: "批准协议"
 japan_subs_abbott.2.b: "这不符合我们的最佳利益。"
 japan_subs_abbott.3.d: "澳大利亚方面提出了一项有趣的提议。他们提出以相当可观的价格购买我们三艘老旧的村雨级轻型驱逐舰，以扩充他们的舰队。这将加强我们之间的防务关系，并为替换舰艇提供一些额外的资金。"
 japan_subs_abbott.4.t: "日本拒绝出售"
 japan_subs_abbott.4.d: "出乎意料的是，日本政府拒绝了我们的提议，宁愿维持其舰队目前的规模。照这样下去，他们迟早会称我们为“倒霉国家”。"
 japan_subs_abbott.4.a: "这不可能……"
 japan_subs_abbott.5.t: "日本批准出售"
 japan_subs_abbott.5.d: "日本已批准此次售舰请求，这些舰艇将很快移交给我方舰队，为我方提供急需的海上火力。"
 japan_subs_abbott.5.a: "极好的消息"
 abbott_condemns_china.1.t: "托尼·阿博特谴责中国的扩张"
 abbott_condemns_china.1.d: "澳大利亚[GetASTLeaderTitle]最近对中国的立场令自由党老兵感到担忧，并激起了选民的支持，对该国的人工岛建设采取了新的立场。\n\n昨天，这位领导人在新闻发布会上谴责中国近期的举动是“和平时期历史上规模最大的军事扩张”，并要求澳大利亚紧急加强自身军事力量以维持威慑力。他还强调，应在东亚部署更多舰船和飞机，以切断中国与澳大利亚关键供应链的联系。\n\n自该声明发布以来，中国官员谴责了这一立场，并称托尼·阿博特是在煽动“反华歇斯底里”。无论其意图如何，两国之间的紧张局势似乎都将达到顶峰。"
 abbott_condemns_china.1.a: "那是暴风云吗？"
 kuala_lumpur_abbott.1.t: "贸易中立协定"
 kuala_lumpur_abbott.1.d: "我们与澳大利亚之间的矿产贸易额已增长到一定程度，澳大利亚政府已与我们联系，商讨签署自由贸易协定。该协定的具体内容包括我们降低煤炭、铝和其他矿产的关税，以及部分农产品进口关税。作为交换，澳大利亚将降低对我们原油、电子产品和运输设备的出口关税。\n\n然而，该协议的一部分规定，我们要在他们目前与中国的争端中声明保持中立，这实际上只是我们与他们签署了一项互不侵犯条约。"
 kuala_lumpur_abbott.1.a: "一项公平的协议。"
 kuala_lumpur_abbott.1.b: "这要求太高了。"
 kuala_lumpur_abbott.2.t: "马来西亚签署该协议"
 kuala_lumpur_abbott.2.d: "我们在马来西亚的朋友已经签署了贸易协定，并正式签署了在我国事务中保持外交中立的协议，这将使我们之间的矿产和农产品交换畅通无阻。岛链的又一部分从我们的视野中消失了。"
 kuala_lumpur_abbott.2.a: "非常好。"
 kuala_lumpur_abbott.3.t: "马来西亚拒绝中立协议"
 kuala_lumpur_abbott.3.d: "尽管我们出于好意，马来西亚仍拒绝做出任何承诺，并拒绝了我们的贸易协定。令人遗憾的是，部分岛链问题仍悬而未决。"
 kuala_lumpur_abbott.3.a: "谁能想到外交竟然如此艰难。"
 jap_repar_abbott.1.t: "澳大利亚要求对二战进行赔偿"
 jap_repar_abbott.1.d: "令人费解的是，澳大利亚政府联系我们，要求支付其二战期间的开支，但此事已拖延许久。这一要求令大多数官员感到困惑，因为在战后几十年里，他们一直认为我们与澳大利亚的关系总体上是积极的。尽管如此，澳大利亚政府似乎并非无动于衷，并向我们提出了一笔数额不小的款项。"
 jap_repar_abbott.1.a: "付钱就行了。"
 jap_repar_abbott.1.b: "这一定是某种玩笑吧？"
 jap_repar_abbott.2.t: "日本同意支付赔偿金"
 jap_repar_abbott.2.d: "看来他们的政府理解我们的困境，并同意直接向我们一次性支付一笔款项，以弥补战争损失。他们也并非敷衍了事。将在达尔文港与日本代表团举行正式仪式，并成立一个部门负责赔款的移交。尽管整个过程略显不寻常，但媒体对此反应积极，反对党也大多保持沉默。"
 jap_repar_abbott.2.a: "现在旧伤可以​​愈合了。"
 jap_repar_abbott.3.t: "日本拒绝赔偿"
 jap_repar_abbott.3.d: "令人颇感尴尬的是，日本政府拒绝了我们的请求，并在国家电视台对我们进行了猛烈抨击。当然，我们的政府肯定也与他们沆瀣一气，因为所有主流媒体都在对整个事件进行嘲讽，而我们在众议院和参议院遭受的重创更是加剧了这种嘲弄。甚至有人在国会大厦外举行抗议活动，挥舞着将阿博特描绘成乞丐的标语，坐在日本大使馆外。"
 jap_repar_abbott.3.a: "没必要再添油加醋了。"
 jap_alliance_abbott.1.t: "来自南半球的互惠联盟"
 jap_alliance_abbott.1.d: "澳大利亚已提出一项共同安全条约，该条约的细节规定，一旦澳大利亚或中国与任何一方发生冲突，都将触发战争指令。该条约显然旨在阻止与中国的进一步冲突，以维护太平洋地区的安全。"
 jap_alliance_abbott.1.a: "在这一点上，我们意见一致。"
 jap_alliance_abbott.1.b: "这太过分了。"
 jap_alliance_abbott.2.t: "横滨协议"
 jap_alliance_abbott.2.d: "东京政府已签署该条约，从而在我们之间建立了安全同盟。如果我们与中国之间爆发冲突，日本将被召集加入战斗。我们这边又多了一块棋子。"
 jap_alliance_abbott.2.a: "光荣的联盟"
 jap_alliance_abbott.3.t: "日本拒绝该条约"
 jap_alliance_abbott.3.d: "日方代表异常沉默之后，[GetASTLeaderTitle]接到了日方代表的视频通话。通话冗长而冗长，总理办公室外只能听到低声的叫喊声，但最终双方演变成一场类似斗舞的争论，谈判就此终止。"
 jap_alliance_abbott.3.a: "或许是最糟糕的结果。"
 france_abbott_ast.1.t: "岛屿租赁"
 france_abbott_ast.1.d: "澳大利亚政府已向我们提出一项租赁方案，拟在五年内将新喀里多尼亚群岛的土地租给我们用于军事用途。他们向我们保证，作为其近期维和行动的一部分，此次租赁将确保太平洋地区的持续稳定，并为此支付了390亿澳元的土地和基地使用权费用。"
 france_abbott_ast.1.a: "公平交易。"
 france_abbott_ast.1.b: "这些岛屿完全属于我们。"
 france_abbott_ast.2.t: "新喀里多尼亚租借"
 france_abbott_ast.2.d: "法国欣然批准了这项租约，实际上赋予了我们在未来5年内扩大在周边岛屿上的军事存在和基础设施的权利。"
 france_abbott_ast.2.a: "我们的影响力不断扩大。"
 france_abbott_ast.3.t: "岛屿租赁落空"
 france_abbott_ast.3.d: "法国拒绝了我们目前租借这些岛屿的提议，实际上在战略上将我们排除在外。我们需要找到其他方法来确保我们东部的防御。"
 france_abbott_ast.3.a: "真是太划算了！"
 france_abbott_ast.4.t: "岛屿租约即将到期"
 france_abbott_ast.4.d: "澳大利亚在新喀里多尼亚群岛的军事部署租约即将到期。我们可以提出将租约延长5年，也可以要求他们归还这些岛屿。"
 france_abbott_ast.4.a: "让他们续租。"
 france_abbott_ast.4.b: "他们该回归正轨了。"
 france_abbott_ast.5.t: "法国提供延期"
 france_abbott_ast.5.d: "随着我们在新喀里多尼亚群岛的租约即将到期，法国方面联系我们，提出将租约再延长5年。"
 france_abbott_ast.5.a: "一个合理的提议。"
 france_abbott_ast.5.b: "他们可以把它们拿回去。"
 france_abbott_ast.6.t: "岛屿租约到期"
 france_abbott_ast.6.d: "随着我们在新喀里多尼亚群岛的租约即将到期，法国要求我们归还这些岛屿并撤走目前驻扎在那里的军队。"
 france_abbott_ast.6.a: "一个合理的要求。"
 france_abbott_ast.6.b: "它们现在是我们的了。"
 france_abbott_ast.7.t: "新喀里多尼亚群岛归还"
 france_abbott_ast.7.d: "澳大利亚已迅速归还了租借的岛屿，并照例感谢我们使用它们。"
 france_abbott_ast.7.a: "一笔成功的交易。"
 france_abbott_ast.8.t: "澳大利亚拒绝放弃这些岛屿"
 france_abbott_ast.8.d: "澳大利亚政府傲慢至极，拒绝放弃这些岛屿。他们甚至拒绝支付租约延期费用，实际上是在非法占领这些岛屿。虽然我们不可能诉诸武力进行外交争端，但我们必须在国际舞台上抗议这种占领行为。"
 france_abbott_ast.8.a: "这太离谱了！"
 middlepower_abbott.1.t: "澳大利亚寻求联盟"
 middlepower_abbott.1.d: "澳大利亚向我们提出了一项互助安全方案，但该方案的细节一旦导致我们或中国之间爆发冲突，就可能引发战争。该方案的核心是试图孤立中国，并遏制其在太平洋地区的影响力。\n\n然而，该协议并未涵盖朝鲜，鉴于我们与中国的地理位置接近，这可能会使我们成为攻击目标。尽管如此，澳大利亚向我们保证，该协议的制定仅仅是为了起到威慑作用。"
 middlepower_abbott.1.a: "一项值得追求的目标。"
 middlepower_abbott.1.b: "这还不够。"
 middlepower_abbott.2.t: "联盟并发症"
 middlepower_abbott.2.d: "鉴于韩国与亲华的朝鲜地理位置接近，韩国正力促条约中获得更多防御方面的保证。我们可以通过一些部队训练项目和生产支持来逐步促成此事，但这无疑会耗费大量资金。我们的选择取决于我们对韩国支持的重视程度。"
 middlepower_abbott.2.a: "一项旨在接纳他们的温和条约。"
 middlepower_abbott.2.b: "任何东西。"
 middlepower_abbott.2.c: "太贵了。"
 middlepower_abbott.3.t: "澳大利亚提出国防援助的反提案"
 middlepower_abbott.3.d: "为了挽救条约，澳大利亚提出了一项合作部队训练计划，并派遣专家协助我们生产武器。这无疑是一项相当可观的提议。他们显然希望我们接受。"
 middlepower_abbott.3.a: "我们欢迎他们的支持。"
 middlepower_abbott.3.b: "还是不值得。"
 middlepower_abbott.4.t: "澳大利亚提出反要约并提供实质性援助"
 middlepower_abbott.4.d: "为了挽救条约，澳大利亚提出了一个数额巨大的反提案。该提案包括一项涵盖广泛的部队合作训练和武器生产支持计划，其中包括工厂组装合同、采购贷款以及协助实施的技术专家。显然，他们孤注一掷，希望我们能够接受。"
 middlepower_abbott.4.a: "我们欢迎他们的支持。"
 middlepower_abbott.4.b: "还是不值得。"
 middlepower_abbott.5.t: "韩澳互保条约正式生效"
 middlepower_abbott.5.d: "在首尔大使馆，我方和韩国外交官签署了《韩澳互保条约》，保证两国在发生威胁对方国家安全的战争时，将互相支持。如今，我们比以往任何时候都更加团结，又有一个国家加入我们在太平洋战场上的行列。"
 middlepower_abbott.5.a: "欢迎加入"
 middlepower_abbott.6.t: "谈判陷入僵局"
 middlepower_abbott.6.d: "我们与韩国的谈判似乎已经破裂。尽管双方最初关系良好，但他们出于自身安全考虑退出了谈判。我们遏制朝鲜半岛的行动将不得不继续进行，而他们却无法参与。"
 middlepower_abbott.6.a: "韩国虎正在睡觉。"
 abbott_china_occupation.1.t: "否认策略"
 abbott_china_occupation.1.d: "在昏暗的房间里，托尼·阿博特和战时内阁的其他成员注视着闪烁的屏幕，屏幕上不断切换着航拍画面、卫星图像和部队运输的监控录像。夜幕降临，画面有些卡顿，但解放军的标志却清晰可见。敌人已经登陆。\n\n阿博特的心沉了下去。他向后靠在椅子上，双手揉了揉额头。房间里一片寂静，只有分析师暂停视频开始汇报时才打破了这片寂静。他们的首要任务是控制舆论，但毫无疑问，这段视频已经在网上流传开来，这很可能成为澳大利亚历史上最严重的国防失误。从现在开始，这场战斗将异常艰难。\n\n分析员停下脚步，等待总理的发言，现场一片尴尬的沉默。阿博特的脸上满是沉思，神情既严肃又茫然。最后，他转向房间里的其他人说道：“听着，现在很明显，呃，唉，世事难料。”"
 abbott_china_occupation.1.a: "在这种情况下，确实如此。"
 abbott_shirtfronting_china.1.t: "海上冲突爆发点"
 abbott_shirtfronting_china.1.d: "来自我方南海舰队的零星报告不断涌入。虽然大多数报告内容不完整，局势仍不明朗，但似乎在浅滩附近发生了冲突。\n\n我方舰艇部署至黄岩岛巡逻后，遭遇附近中国舰队。中国舰队要求我方舰艇离开该区域，我方舰艇拒绝后不久，其中一艘中国舰艇开火。双方短暂交火后，我方舰艇撤退。我方两艘护卫舰被击沉，目前已有四人伤亡。\n\n由于我们也是事发时才得知此事，中方尚未作出回应。现在主动权在我们手中，需要决定下一步行动。目前我们处境非常危险。"
 abbott_shirtfronting_china.1.a: "弄一条直通北京的线路。"
 abbott_shirtfronting_china.1.b: "这是赤裸裸的攻击。我们不能示弱。"
 abbott_shirtfronting_china.2.d: "澳大利亚[GetASTLeaderTitle]已直接致电我方，讨论南海局势。虽然我方仍在汇报情况，但目前已确认，我方驻扎在南海的舰队与澳大利亚巡逻队在黄岩岛附近发生小规模冲突。\n\n报告称，我方一艘驱逐舰向澳大利亚舰艇鸣枪示警，引发交火。目前双方已有三人伤亡，舰队受损轻微。而澳大利亚方面似乎损失了两艘舰艇，自身可能损失了五艘。\n\n他们的领导人现在要求我们从该地区撤走舰船，并承诺进行缓和局势的谈判。这种厚颜无耻的行为固然令人恼火，但如果我们不做出让步，局势可能会在国际舞台上演变成一场噩梦。"
 abbott_shirtfronting_china.2.a: "任何能阻止战争的事情。"
 abbott_shirtfronting_china.2.b: "龙不会向绵羊卑躬屈膝。"
 abbott_shirtfronting_tt: "我们将暂时把船只撤离浅滩。"
 abbott_shirtfronting_china.3.t: "停止"
 abbott_shirtfronting_china.3.d: "中国政府已同意从该地区撤回其舰船。一度看来，我们两国似乎已无可避免地走向战争，但我们侥幸躲过了这一劫。尽管局势依然紧张，但他们已提出派遣代表团前往堪培拉，以期达成切实可行的方案，防止此类事件再次发生。我们为此付出了沉重的代价，但这无疑是一次小小的胜利。"
 abbott_shirtfronting_china.3.a: "又一场战争得以避免。"
 abbott_shirtfronting_china.4.t: "闭嘴"
 abbott_shirtfronting_china.4.d: "电话线咔哒一声，另一端的声音消失了。尽管中方完全了解事件经过，却不愿讨论任何缓和局势的条件。我们正处于十字路口。如果中国继续这种不受约束的升级行动，我们实际上就等于在不还手的情况下进入了战争状态。另一方面，如果直接发表空洞的声明，几乎没有回旋的余地。"
 abbott_shirtfronting_china.4.a: "我们必须停止行动。"
 abbott_shirtfronting_china.4.b: "如果他们想要战争……"
 call_japan_to_our_side_ast: "呼吁日本加入我们这边"
 call_kor_to_our_side_ast: "呼吁韩国加入我们这边"
 call_roc_to_our_side_ast: "呼吁台湾加入我们这边"
 abbott_call_to_arms.1.t: "澳大利亚号召我们参战"
 abbott_call_to_arms.1.d: "根据我们两国签署的协议，鉴于目前澳大利亚与中国之间的冲突，澳大利亚呼吁我们履行协议，加入战斗。"
 abbott_call_to_arms.1.a: "那就开战吧"
 malcolm_abbott_event.4.t: "进入猴子舱房间"
 malcolm_abbott_event.4.d: "托尼独自坐在空荡荡的议会大厅里，只有头顶上即将熄灭的灯泡嗡嗡作响，陪伴着他。他的思绪飘回到了在乌鲁鲁的时光，那是他第一次长跑。整个过程痛苦不堪。托尼当时的状态根本无法应对挑战，有好几次他都几乎想要放弃，但他从未像那一刻那样感到自由。\n\n在内陆荒野，周围空无一物。只有威奇蒂灌木在风中摇曳的沙沙声，以及炙热的阳光。完成这项挑战后，他便开始了对马拉松和“铁人三项”赛事的长期热爱。这些赛事的艰苦卓绝是对意志的考验，如今身居要职，也同样面临着巨大的压力，但一切付出都是值得的。\n\n然而，这一次却并非如此。他的政治生涯即将结束。当所有自由党议员涌入投票站时，托尼以44票对54票落败。马尔科姆·特恩布尔接任新党魁。政治滋生背叛，但这仍然让他感觉像是背后被人捅了一刀。他稍感安慰的是，他信守诺言，成为了一个失败者，而不是一个放弃者。"
 malcolm_abbott_event.4.a: "马拉松结束了。"
 malcolm_abbott_event.5.t: "马尔科姆·特恩布尔宣誓就任[GetASTLeaderTitle]"
 malcolm_abbott_event.5.d: "在国会大厦前的草坪上，马尔科姆·特恩布尔发表了他作为自由党新领袖和总理的首次讲话，承诺将进行“广泛”改革，以打造“21世纪政府”。特恩布尔宣布了一系列新老党员组成的内阁成员，以帮助顺利完成过渡，其中包括斯科特·莫里森和克里斯托弗·派恩，尤其引人注目的是新增了五位女性内阁成员。\n\n“我们必须更有竞争力，我们必须更高效，而且 - 我们必须更有创新精神，”这位新任[GetASTLeaderTitle]表示，这促使政府采取更加技术官僚化的方向。\n\n尽管党内保守强硬派人士仍对过去的伤痛记忆犹新，但大多数人支持特恩布尔的崛起，自推翻特恩布尔以来，自由党的民调支持率迅速上升。"
 malcolm_abbott_event.5.a: "为未来干杯！"
 aus_war_on_terror_abbott.1.t: "战争的借口"
 aus_war_on_terror_abbott.1.d: "托尼擦了擦额头的汗，环顾四周，只见满屋子忙碌的媒体人员都在为即将到来的讲话而奔忙。他们搬进来的灯光刺得人睁不开眼，托尼真希望这一切能快点结束。过去一个月里，新闻发布会和情报会议实在太多，让他感到很不舒服，而现在，他的任务是向全国人民解释清楚。\n\n提词器被推了过来，大家安静下来。托尼清了清嗓子。在向全国发表讲话时，他会提到一个名字，几个月来，新闻媒体一直在向公众狂轰滥炸地报道这个名字。这个名字就是伊斯兰祈祷团。\n\n伊斯兰祈祷团是与基地组织有关联的恐怖组织，澳大利亚秘密情报局曾自信地认定巴厘岛爆炸案和大使馆袭击事件是其所为。他们屡次袭击我们，当我们最终找到他们的藏身之处时，印尼方面却拒绝我军入境。正如托尼所说，这实际上使他们成了“恐怖分子的窝藏者”。\n\n公众是否完全相信其实无关紧要。决定是在发表讲话之前做出的。这仅仅是铺设轨道工程而已。"
 aus_war_on_terror_abbott.1.a: "“是时候反击了。”"
 the_canberra_treaty_abbott.1.t: "堪培拉条约"
 the_canberra_treaty_abbott.1.d: "抵达堪培拉后，条约条款明确了南沙群岛的非军事化、对舰队生产的限制，以及我方、澳大利亚和菲律宾之间的互不对抗协议。这本可以缓和舰队遭遇战带来的灾难性后果，但却是一种限制我方在自身领土内行动的羞辱。\n\n虽然该条约只是暂时的，但它得到了我们一些主要贸易伙伴的支持。退出该条约的后果将十分严重。"
 the_canberra_treaty_abbott.1.a: "为了维护和平。"
 the_canberra_treaty_abbott.1.b: "他们要是以为我们会签约，那真是做梦了。"
 the_canberra_treaty_abbott.2.t: "签署条约"
 the_canberra_treaty_abbott.2.d: "中菲双方代表清晨便抵达堪培拉，抢先一步参加会议。会议开始时，双方之间只有低沉的怒火在燃烧。中国代表没有在看到条约的第一时间愤然离席，这算是一个好兆头。对他们而言，这无疑是一场羞辱，但其后果却难以避免。\n\n最终结果是各方同意对黄岩岛和南沙群岛周边海域进行非军事化。中国还承诺限制其舰队生产和巡逻行动，并签署了互不对抗协议。\n\n虽然这并非我们所期盼的那种一击制胜的胜利，但我们今天成功地打破了中国霸权的幻象。他们的瓷器盔甲已被凿开，中国的势力范围已被遏制。至少目前如此。"
 the_canberra_treaty_abbott.2.a: "我们这个时代终于和平了！"
 the_canberra_treaty_abbott.3.t: "中国人退出"
 the_canberra_treaty_abbott.3.d: "不出所料，在概述条约条款期间，中国代表直接起身离开了会议室。据我们所知，他们已经抵达机场，准备回国。这种做法虽然厚颜无耻，但我们早就知道条约条款存在风险。\n\n这并非我们预想中的彻底胜利，而且这次退场也算得上是一次外交上的失败，但我们今天成功地打破了中国霸权的幻象。他们的瓷器盔甲已被凿开，中国势力范围的脆弱性也暴露无遗。\n\n目前，美国和其他许多国家已经加入我们，对中国实施制裁以示回应。"
 the_canberra_treaty_abbott.3.a: "我们已做到最好"
 starbucks_event_ast.1.t: "举步维艰"
 starbucks_event_ast.1.d: "崭新闪亮的桌面上，不透明的布帘被揭开，座椅被取出并摆放好。绿色的招牌已经出现在悉尼街头，实际上，星巴克将在全国范围内开设87家门店。早上5点，门店门口就已经排起了长队。星巴克是近期涌入澳大利亚的众多美国快餐连锁店之一，而同样从美国远道而来的经理们也渴望参与到开业盛事中。\n\n大门一开，顾客蜂拥而入，记者们也蜂拥而至，记录这一盛事。店内人头攒动，几个小时后，却又空空荡荡。开业派对结束后，与外面逐渐散去的人群相比，店内显得异常冷清。\n\n偶尔会有零星几个人进来，大多是游客，但大部分时间都很冷清。这种情况持续了一周，之后，由于全国范围内的业绩持续低迷，大部分门店都关门了。"
 starbucks_event_ast.1.a: "适者生存。"
 econ_costello_events.1.t: "红土与聚光灯"
 econ_costello_events.1.d: "科斯特洛站在烈日下，空气中弥漫着一股可怕的气味，后背被汗水浸透，但他却如鱼得水。\n\n他们身后那座轰鸣着喷出石油的巨型油塔，正是他们这项意义重大的交易的基石。大部分部件都是从美国运来的，不到一个月就在这里组装完毕。昆士兰州和南澳大利亚州还将建造数十座类似的油塔。整个项目由卢夫金工业公司负责，政府一分钱都没花。然而，我们却将从中受益。\n\n尘土开始扬起，粘在他们的西装上，科斯特洛和在场的企业代表们赶紧结束了拍照活动。由于政府表面上被视为亲石油公司，大量企业纷纷前来洽谈合作，卢夫金只是其中之一。\n\n在彼得看来，煤炭不过是一种暂时的恩惠。它能照明，能取暖，但它并非维持世界其他地区运转的燃料。下一次采矿热潮将会是石油。"
 econ_costello_events.1.a: "这只是合理的商业行为。"
 econ_costello_events.2.t: "出口繁荣"
 econ_costello_events.2.d: "随着我们与中国的关系日益密切，我们的出口经济蓬勃发展。在相对较短的时间内，与中国的贸易额大幅增长，煤炭和关键矿产的贸易量更是达到了历史新高。这种情况可能会持续数月。"
 econ_costello_events.2.a: "收益归我们所有。"
 econ_costello_events.3.t: "北京一夜"
 econ_costello_events.3.d: "当彼得和外交部其他成员抵达北京时，这是他自二十国集团峰会以来第一次重返这座城市。短短几年间，北京的城市面貌已焕然一新。中国为缩小经济差距而做出的努力使其经济发展几乎超越了邻国，其城市也变成了鳞次栉比、气势恢宏的玻璃巨塔。澳大利亚若能从中分得一杯羹，无疑是锦上添花。\n\n一辆小轿车把他们从机场送到“人民大会堂”。在彼得看来，这是一座粗犷主义风格、近乎苏联式的建筑。不得不承认，城市的雾霾比他们预想的要轻，而且外面的车辆也出奇地少。\n\n他们来到外交部长和中国代表团预定会面的房间，但将近两个小时过去了，却无人出现。最后，衣衫不整的亚历山大·唐纳跌跌撞撞地走了进来。他气喘吁吁地整理了一下领带，为迟到道歉，会议终于开始了。\n\n这将是澳大利亚历史上最大的一笔单笔投资，对我们的农产品出口来说无疑是天赐良机。十几家公司将在我们的城市和郊区落户，工作岗位将源源不断地流向最需要的地区。他们握手告别时，彼得心想，这趟旅程无疑是他记忆中最奇特的一次。"
 econ_costello_events.3.a: "但仍然是最有成效的。"
 econ_costello_events.4.t: "房地产市场充斥着肮脏的资金"
 econ_costello_events.4.d: "政府试图通过吸引中国投资者来刺激房地产市场销售，但似乎并未吸引到足够多的买家。昨天，珀斯一栋近期售出的高层公寓被查封，揭露了一个洗钱和非法资金网络，其资金甚至流入了自由党的筹款活动，因为被查封的投资者之一竟然是该党的主要捐款人。\n\n在行动前，一些监控该网络的组织注意到，可能有数十名来自中国的外国买家利用房地产市场规避北京的资金外流限制。中国立即提出引渡请求，要求引渡涉案人员。这一反应可能预示着中澳关系的短暂升温即将戛然而止。"
 econ_costello_events.4.a: "没有哪项好的投资能逃脱惩罚……"
 costello_in_the_mines.1.t: "矿业公司反击"
 costello_in_the_mines.1.d: "在调查结果公布之前，消息就已经泄露给了大型采矿公司，他们现在正竭尽全力阻止我们的调查。我们已经向我们提出了十几项法律挑战，一些矿井已经关闭以示抗议。更糟糕的是媒体似乎也加入了他们的行列。\n\n即使没有正式的定罪，我们与矿业公司之间仅存的一点好感也几乎荡然无存，一些巨头转而资助反对党和像一国党这样的民族主义政党，这让本党在未来的资金来源方面陷入了尴尬境地。我们真是捅了马蜂窝。"
 costello_in_the_mines.1.a: "必须不惜一切代价清除腐朽的部分。"
 costello_in_the_mines.2.t: "调查结果"
 costello_in_the_mines.2.d: "委员会终于向我们提交了调查结果，结果令人震惊。在数十个矿场，尤其是在运输部门，数百名工人被发现非法雇佣，其中一些人甚至为这些公司工作多年。不出所料，矿业公司对此保持沉默。在法律程序进行期间，我们面临着一个棘手的抉择：如何安置突然涌入该国的数百名新移民。"
 costello_in_the_mines.2.a: "一个鱼龙混杂的行业。"
 costello_in_the_mines.3.t: "处理工人问题"
 costello_in_the_mines.3.d: "调查发现，有三百多名移民居住在该国。其中近一半人已在矿业部门工作两年以上。媒体和内阁中的一些成员坚持认为，我们应该立即动用现有资源将他们遣返。然而，考虑到这些移民的技能水平，我们可以向他们发放临时签证，允许他们继续工作。这样做可以避免矿场收入突然下降，但恐怕不会受到民众欢迎。"
 costello_in_the_mines.3.a: "把他们遣返。"
 costello_in_the_mines.3.b: "让他们留下吧。"
 costello_in_the_mines.4.t: "来自阿拉伯的提议"
 costello_in_the_mines.4.d: "沙特阿拉伯王储兼首相[SAU.GetLeader]已就此请求直接与我们联系。他们提出对我们目前至关重要的矿产开采进行大量投资，以换取我们解除对其国家在澳大利亚投资的部分限制。他们对我们的体育事业表现出浓厚的兴趣，允许他们投资将极大地拓展我们娱乐产业的影响力，尽管这也意味着我们将向一个监管力度不足的国家敞开大门。"
 costello_in_the_mines.4.a: "一个合理的提议。"
 costello_in_the_mines.4.b: "我们不要靠得太近。"
 costello_republic_events.1.t: "攀登参议院围墙"
 costello_republic_events.1.d: "与我们上次试图在议会推动共和制议题的努力不同，到目前为止，投票结果对我们极为不利。强硬派托尼·阿博特再次加入反共和阵营，就像他在1999年那样，在议会质询时间担任发言人，实际上分裂了党派。他利用媒体给我们制造麻烦的本事也暴露无遗，抓住一切机会攻击我们。\n\n如果连提交全民公投之前都无法让参议院通过这项法案，我们的希望就彻底破灭了，党内仅存的有限支持也开始瓦解。我们或许需要开始寻找其他争取选票的途径。"
 costello_republic_events.1.a: "前方道路崎岖难行。"
 costello_republic_events_abbott_tt: "§Y接下来，反对派会处处与我们作对。§!"
 costello_republic_events.2.t: "获得选票"
 costello_republic_events.2.d: "陆克文无疑是议会里最油滑的政客。霍华德恨他入骨，就连他自己的党派似乎也不喜欢他。不知怎么的，他竟然一路爬到了工党的高层，现在却成了我们争取选票的最大障碍。\n\n陆克文要求他们在国会大厦外的一家咖啡馆见面，可能是为了让附近的狗仔队有机会拍到他和[GetASTLeaderTitle]在一起的照片。任何能让他振作起来并向我们投掷泥土的东西。\n\n他像往常一样迟到了，但坚持要留下来吃饭。我们点了鸭肉煎饼和牛排 - 管它是什么呢 - 然后陆克文终于开始发言了。工党正试图通过他们新的医保扩容方案，毫无疑问，这肯定会被我们党否决。简单来说，这是以牙还牙，只要他摇一摇，就能给我们足够的票数让这项方案在参议院获得通过，并给予我们一些支持。\n\n虽然价格有点高。"
 costello_republic_events.2.a: "我们还有选择吗？"
 costello_republic_events.3.t: "非常规同意"
 costello_republic_events.3.d: "出乎意料的是，当我们把法案递交给总督时，他们竟然毫无阻碍地批准了。他们甚至似乎很乐意帮助我们，在媒体上公开支持共和制理念。既然我们已经获得了他们的批准，就可以考虑在新宪法中添加其他内容了。当然，工作还没有结束。在再次提交参议院审议之前，我们仍然需要公众的支持。与1999年不同的是，这一次我们必须继续动员公众，不能让这股势头减弱。"
 costello_republic_events.3.a: "那我们就开始吧。"
 costello_republic_events.4.t: "澳大利亚人废除君主制"
 costello_republic_events.4.d: "今天，悉尼和其他主要城市到处都飘扬着绿、黄、蓝三色的旗帜。这是澳大利亚共和国运动为迎接公投结果而采取的行动。今天的投票结果显示，63%的选民支持建立共和国，五个州中已有四个州投了赞成票。尽管相关法案仍需经过议会审议才能正式生效，但公投结果实际上已经废除了澳大利亚的君主制。\n\n总督一职将被废除，需要启用新的国旗，总理的头衔也将很快更改以反映新的政府模式。共和党人当天余下的几个小时都在街头庆祝，尽管反对派未能维持现状，但他们的领袖、自由党政治家托尼·阿博特承认，这一变革使澳大利亚走上了“光明未来”的道路。"
 costello_republic_events.4.a: "终于"
 costello_republic_events.4.b: "一个令人惊讶的变化。"
 costello_in_the_mines.5.t: "与大亨的会面"
 costello_in_the_mines.5.d: "与鲁珀特·默多克会面并不难。碰巧的是，这位新闻集团首席执行官一直定期联系彼得的办公室，并且渴望与他会面讨论政策。不知不觉中，距离他们上次见面已经过去了五年，但当他们再次见面时，鲁珀特看起来仿佛岁月没有在他身上留下痕迹。\n\n大多数人都知道他是新闻集团的掌门人，旗下拥有半数报纸，但鲜有人知他与多少矿业项目有着千丝万缕的联系。每当彼得试图提出矿业税改革的想法时，鲁珀特都会断然拒绝。原本以为只要得到这位大亨的批准就能启动改革，但机会却正在迅速消逝。\n\n当他们终于到达矿区时，鲁珀特开始滔滔不绝地谈论吉朗和蓝领选民。彼得的选区就是吉朗，所以他明白鲁珀特的意思，但如果他想挽回局面，就必须现在就抓住机会。\n\n“五年经济增长之后，税制改革肯定不会影响太大。我们其他人也应该得到一些。。。”\n\n“好处？”鲁珀特紧紧抓住这个词不放，仿佛它在老人的口中是一种侮辱。“我记得以前党反对‘大政府’。我相信你也知道现在党需要什么。”\n\n说完这些，鲁珀特感谢他抽出时间，两人道别。这次会面并没有像他预想的那样成为事业的跳板，事实上，科斯特洛根本不知道该如何看待这次会面。他只能希望自己的处境不要比霍华德更糟。"
 costello_in_the_mines.5.a: "一种不安的感觉。"
 costello_republic_events.5.t: "议会黎明"
 costello_republic_events.5.d: "科斯特洛认为，这种盛况上次出现在联邦成立之时，恐怕只有国会大厦才能与之媲美。整个国会大厦都沉浸在一片欢腾之中。几乎每个工作场所都挂满了彩带和横幅。由于政客们要么在当地酒吧消遣，要么在餐厅庆祝，大厦的一半都空无一人。\n\n他不得不挤过一群围着一台便携式电视机的人群，瞥见了他们在看什么。海港大桥上正在进行灯光秀，新国旗的火焰图案悬挂在桥上，头顶上烟花绽放。显然，就连反对派也在以某种方式庆祝。我们的国家终于迈出了下一个重大步伐。我们终于走出了青春期。\n\n宴会厅布置得十分奢华，与场合十分相称。科斯特洛抵达后，开始整理演讲稿，这时他注意到人群中有一张熟悉的面孔。约翰·霍华德本人也出席了这场宴会。科斯特洛情不自禁地走下讲台，走向这位前首相，他的老搭档。\n\n他们握手，霍华德脸上带着饱经风霜却又骄傲的神情，笑了。"
 costello_republic_events.5.a: "“干得好，伙计。干得好。”"
 commonwealth_games_ast.1.t: "[GetYear]英联邦运动会"
 commonwealth_games_ast.1.d: "来自71个国家、地区和机构的5000多名运动员齐聚澳大利亚墨尔本，参加今年的英联邦运动会。本届运动会选址与1956年夏季奥运会相同，并将推出一系列精彩纷呈的活动，包括飞行电车和压轴的烟花表演。预计将有17个体育项目亮相。\n\n在英联邦运动会的历史上，女王火炬首次走遍了所有参赛的英联邦国家和地区，行程长达18万公里（11.25万英里）。这充分展现了英联邦各国之间的长期承诺和深厚联系。"
 commonwealth_games_ast.1.a: "我们共同的价值观在竞技体育中得以体现。"
 commonwealth_games_ast.1.b: "真是一场精彩的表演。"
 costello_republic_events.6.t: "肩并肩，共担重任"
 costello_republic_events.6.d: "科斯特洛阐述计划时，首相副手亚历山大·唐纳斜倚在椅子上。唐纳很擅长掩饰情绪，你永远猜不到他在想什么，直到他开口说话。科斯特洛之所以选择他，正是因为他很少开口，但这一次，科斯特洛还是看到了唐纳脸上的惊讶。科斯特洛说完之后，唐纳向前倾身，说出了首相预料之中的话：“你怎么知道这次不会重蹈99年的覆辙？”\n\n这个问题一直萦绕在科斯特洛的心头。他无法确定他们能否避免重蹈1999年公投的覆辙，甚至无法确定他们能否再次让法案在议会获得通过。一切都充满变数，但他必须尝试。\n\n经过一番短暂的争论，唐纳耸了耸肩，同意帮忙。他们要么是误入了未知的领域，要么是陷入了似曾相识的泥潭。至少，他们要一起在这艘船上沉没。然而，有一件事唐纳始终想不明白。\n\n“我应该称呼您为总理还是总统先生？”"
 costello_republic_events.6.a: "然后争论继续进行。"
 labor_factionalism.1.t: "工党宗派主义"
 labor_factionalism.1.d: "工党虽然不是联合政府，但内部也存在派系。其中两派影响力最大。左翼是民主社会主义者，他们主张社会进步政策，例如提高福利、加强医疗保险和经济干预。陆克文大致代表了这一派。另一派则更为中间派。他们中的许多人奉行“第三条道路”的经济原则；这些政策奉行财政保守主义，旨在帮助人们“自力更生”，而非“施舍”，并且更倾向于维护商业利益。\n\n代表工党右翼的是现任副[GetASTLeaderTitle]朱莉娅·吉拉德。尽管为了国家利益，陆克文和吉拉德在政策制定方面密切合作，但他们之间存在着一种不成文的默契，即互不干涉。任何一方立场过于强硬都可能损害联盟，甚至导致工党彻底分裂。\n\n在竞选期间，我们也承诺将根据我们的气候政策方向，推行§Y碳排放交易计划§!。我们应该确保在第一任期内通过该计划，以免党内开始质疑我们的领导地位。"
 labor_factionalism.1.a: "一项艰巨的任务。"
 rudd_apology.1.t: "国家道歉"
 rudd_apology.1.d: "凯文·陆克文上任仅几个月，[GetASTLeaderTitle]就向全国发表讲话，就历史上对澳大利亚原住民（土著和托雷斯海峡岛民）犯下的错误正式“道歉”。\n\n这项历史性的举动源于1997年的《带他们回家》报告，由[GetASTLeaderTitle]在国会大厦发表，此后在澳大利亚引起了巨大的情感冲击。国会大厦大厅和外面的草坪上，人群欢呼鼓掌。数千人冒雨聚集在悉尼街头，观看这场意义非凡的演讲。\n社区上下都感到如释重负，并获得了极大的慰藉，许多人对陆克文为弥补前几届政府的不作为所做的努力表示赞赏。"
 rudd_apology.1.a: "是时候了"
 tackle_mining_oligarchy_ast.1.t: "闲聊税务"
 tackle_mining_oligarchy_ast.1.d: "陆克文讨厌从办公桌走到肯的办公室。国会大厦的走廊像医院病房一样一片惨白，这让他想起这里内外许多不愉快的往事。他轻轻敲了敲门，门上新挂着一块牌子，上面写着“肯·亨利”。\n\n他进来时，肯还在忙着进行税务审查，委员会其他成员都亲切地称之为“亨利审查”。肯只比陆克文大几岁，但却一副老派作风。更糟糕的是，他总是喜欢对新上任的[GetASTLeaderTitle]指手画脚。\n\n预计审查会涉及采矿利润，陆克文想了解所有细节。两人就超级税收和公平实施的问题争论了好几个小时，最后肯终于放弃了，回家了。但陆克文没有走。他的夜晚才刚刚开始，但他需要一些帮助才能让事情进展顺利。"
 tackle_mining_oligarchy_ast.1.a: "懂行的人。"
 tackle_mining_oligarchy_ast.2.t: "没有回头路"
 tackle_mining_oligarchy_ast.2.d: "陆克文又一次在议会熬夜与韦恩·斯旺共度良宵。斯旺是媒体所称的陆克文核心圈子“四人帮”之一。另外两人是朱莉娅·吉拉德和林赛·坦纳。\n\n陆克文花了不少时间仔细研究立法方案，并且已经组建了一个助手团队在他的办公室里着手推进这项工作，但斯旺对方案的成功至关重要。这不仅是因为他作为财政部长的经验能够发现其他人可能忽略的问题，更重要的是，他的加入为整个方案增添了可信度。拉德看起来仍然有点像个政治局外人，而斯旺的资历却无人质疑。\n\n“你们这是在攻击我们政治的支柱。我们很多人背后都有矿业公司撑腰。我们这么做，他们肯定不高兴。他们会动用一切手段来对付我们。场面会变得非常难看。”\n\n“我觉得我们经历过更糟糕的事，对吧？”陆克文紧张地挠了挠鼻子，挤出一个笑容，但韦恩纹丝不动。他只是担忧地看着陆克文，但还是答应帮忙。\n\n在某种程度上，他们都身处同一境地，陆克文相信韦恩不会希望看到他的政府垮台。他们会一起乘风破浪，共渡难关。"
 tackle_mining_oligarchy_ast.2.a: "事情本来就不该那么容易。"
 pink_batts_ast.1.t: "粉红隔热垫事件"
 pink_batts_ast.1.d: "我们的房屋隔热项目似乎出现了最糟糕的情况。不少安装项目长期失效，更糟糕的是，四名工人在安装过程中丧生。其中三人死于触电，一人死于中暑。目前已要求成立皇家委员会进行调查，供应商和安装商也对我们提起了集体诉讼，他们似乎遭受了经济损失。\n\n说这是一场灾难可能都算是轻描淡写了。光是由此引发的政治后果就足以让我们陷入困境。我们必须立即停止这项计划，并启动罢免程序。"
 pink_batts_ast.1.a: "这怎么可能？"
 bob_brown_event.1.t: "博学多才的鲍勃·布朗"
 bob_brown_event.1.d: "鲍勃·布朗是个古怪的人。他对环境的积极行动和痴迷，让陆克文相形见绌，显得像个实业家，环保人士也因此对他推崇备至。他成为绿党的实际创始人也就不足为奇了。十多年过去了，他在党内的地位依然稳固，无人能撼动。相反，他们把他奉为偶像领袖，这在陆克文看来，简直近乎个人崇拜。\n\n布朗同意前往首都与陆克文共进午餐，讨论合作事宜。此前，双方的关系一直略带对抗。布朗抵达时笑容满面，迅速上前与陆克文握手。他们选择在附近一家咖啡馆用餐，可惜的是，他们坐在户外，不得不忍受堪培拉糟糕的天气。或许这就是所有政客都脾气暴躁的原因吧。\n\n电话里，绿党的支持似乎已成定局，但当陆克文再次阐述方案时，布朗只是摇了摇头。尽管方案已经非常宏大，他还是希望他们能更进一步。每当陆克文试图让绿党领袖认清参议院能够合理通过的现实时，布朗都毫不妥协。\n\n无论绿党还剩下多少筹码，陆克文现在都在利用，而绿党的耐心也开始逐渐耗尽。当他们最终握手言和时，陆克文意识到工党要么大获全胜，要么空手而归。"
 bob_brown_event.1.a: "没有中间地带。"
 school_visit_rudd.1.t: "漫步库帕鲁"
 school_visit_rudd.1.d: "陆克文和他的随行人员中午时分抵达学校，准备会见校长并参观校园。显然有人向媒体透露了消息，因为他们刚一进门，一大群记者也涌了进来，很快他们就被彻底包围了。\n\n记者们又开始抛出那些老生常谈的问题：“政府是否在改革上退缩了？工党是否违背了其财政保守的承诺？”\n\n陆克文尽量不去理会他们，只想至少能和校长说几句关于翻修的事。他们好不容易才从一扇门里挤出来，来到新建的篮球场所在的庭院，那里也兼作礼堂。新建筑固然不错，但和旁边那些老旧的建筑相比，显得有些突兀。\n\n现代设计的弊端最终还是降临到了库帕鲁州立学校。然而，这些新的升级改造对像这样的学校来说无疑是件好事，对那些条件更差的学校来说更是如此。他们进去的时候，一群孩子跟在后面，挤过记者们，争相提问。[GetASTLeaderTitle]率先发难。\n\n“能来到这里真是太棒了。请举手，你们最喜欢这座新礼堂的哪一点？”\n\n“我们可以坐在座位上，”一名学生回答道。\n\n“你可以坐在座位上 - 这可是天壤之别！”"
 school_visit_rudd.1.a: "确实如此……"
 gayvote_rudd.1.t: "澳大利亚投票赞成婚姻平等"
 gayvote_rudd.1.d: "在同性婚姻合法化问题进行自愿全民公投后，61.6%的澳大利亚人投了赞成票，为该法案在众议院和参议院获得通过铺平了道路。此次公投的投票率高达79.5%，数百万选民参与了投票，决定了这一变革。预计该法案将在未来几个月内获得批准，这令该国寻求婚姻的同性伴侣们欣喜不已。\n\n工党部长比尔·肖顿与悉尼的民众一起庆祝这一变化，并为[GetASTLeaderTitle]与反对党成员马尔科姆·特恩布尔为推动这项立法所做的努力而欢呼。\n\n“对于澳大利亚人来说，今天真是个好日子 - 两党都准备好迎接变革，并支持公众的声音。”"
 gayvote_rudd.1.a: "爱会胜利！"
 unite_the_nation_speech_ast.1.t: "陆克文向全国发表讲话"
 unite_the_nation_speech_ast.1.d: "新任澳大利亚[GetASTLeaderTitle]陆克文概述了其致力于在澳大利亚历史上谱写“新篇章”的承诺，旨在缩小目前全国范围内存在的社会不平等差距。陆克文宣布，新的社会和经济计划旨在远远超越上一代人的成就，随后，澳大利亚原住民的个人故事被朗读出来。\n\n[GetASTLeaderTitle]在演讲结束时强调要与原住民和托雷斯海峡岛民建立更紧密的伙伴关系，以“缩小承诺与实际表现之间的差距”。\n\n到目前为止，演讲反响不错，但如果没有实质性的改变，谁又能说这种好感能持续多久呢？"
 unite_the_nation_speech_ast.1.a: "我叫陆克文，来自昆士兰州，我来这里是为了提供帮助。"
 something_to_give_ast.1.t: "赠品"
 something_to_give_ast.1.d: "她踱步在狭小的公寓里，手机响起了福利联络中心的提示音。她已经等了将近一个小时，希望能接通人工客服，但随着时间一分一秒地接近下午五点，她的希望也越来越渺茫。她今天才刚下课，如果这次还是联系不上，明天还得再打一次。感觉这无休止的循环永无止境。\n\n电话终于响了，传来一阵噼啪声，一个声音传了过来。她迫不及待地向对方倾诉了自己的困境。她一直在全职学习，但一直找不到工作，账单堆积如山。即使靠救济金也难以支付，她越来越害怕不得不搬家辍学。她需要的只是更多的时间。\n\n那头的声音充满同情，虽然听起来几乎和她一样疲惫，但似乎没有什么资格让她这么做。她把厨房的柜台沉到地板上。没有任何出路。接线员询问是否可以让她等待，但她再次孤身一人。她太累了，哭不出来，但这也改变不了任何事情。一直都是这样。\n\n接线员突然又接通了。就在这周，一项新的计划刚刚启动，允许受助者申请紧急补助。还款将从后续的补助金中分期扣除，金额虽然不多，但足够支付房租，她也能继续学业。这个消息让她欣喜若狂。挂断电话后，她激动地跳了起来，泪水夺眶而出。"
 something_to_give_ast.1.a: "一点帮助就能产生很大的影响。"
 bill_of_rights_ast.1.t: "通过该法令"
 bill_of_rights_ast.1.d: "最终，参众两院都竭尽全力阻挠我们通过这项法案。我们已经对法案进行了适当调整，但这仍然是一个良好的开端。《澳大利亚联邦人权法案》扩展了我们的言论自由、集会自由、公平审判、法律面前人人平等、免受酷刑等权利，不胜枚举。\n\n我们不仅正在实施澳大利亚历史上规模最大的民权立法，为原住民和托雷斯海峡岛民提供广泛的保护，而且这项法案还将为未来所有澳大利亚人的法律保护奠定基础。\n\n目前我们仍需批准所有事项，并在未来几个月内开始实施，但这无疑是我们国家走向成熟的重要一步。"
 bill_of_rights_ast.1.a: "献给那些将要享用果实的人。"
 rudd_nz_deal.1.t: "前往惠灵顿"
 rudd_nz_deal.1.d: "为了不错过从高处俯瞰群山的壮丽景色，陆克文选择搭乘清晨的航班。如果说新西兰在哪方面胜过澳大利亚，那一定是那里的风景。新西兰外交部总是津津乐道地提醒人们，《指环王》就是在那里拍摄的，个中缘由不难理解。他此行的目的是签署跨塔斯曼贸易协定，该协定将把两国的经济紧密联系在一起，这让陆克文感到惊讶，因为这项协定竟然没有更早达成。\n\n总理[NZL.GetLeader]反应迅速，一下飞机就第一个与人握手，随后带领会谈进入机场外交休息室。他们一起仔细核对了文件，一切看起来都很顺利：几乎取消了所有商品和服务的关税和贸易壁垒，一切都在按部就班。现在，正是总理翘首以盼的时刻。\n他们建议协议的第一项内容是澳大利亚投资新西兰的工业中心，并列举了未来几十年的回报。这一切听起来都很合理，但真的值得立即投入这么多资金吗？"
 rudd_nz_deal.1.a: "好吧"
 rudd_nz_deal.1.b: "目前来看，这项贸易协议就足够了。"
 rudd_visit_ast.1.t: "接近韩国人"
 rudd_visit_ast.1.d: "抵达韩国后，首批行程之一便是前往釜山纪念公墓拍照留念。陆克文很幸运，从未经历过任何战争。当时在任的澳大利亚部长们甚至都没有经历过朝鲜战争，而避免再次爆发类似的冲突也是他工作的重中之重。\n\n纪念碑规模宏大，近距离观赏令人震撼。整个墓园宛如一座花园，几乎每块墓碑旁都点缀着鲜花或绿篱。来自世界各地的旗帜飘扬其间。韩国人每天都生活在战争的阴影下，自然而然地与盟友保持着密切的联系。\n\n当他们最终返回国会时，韩国总统[KOR.GetLeader]对建立和平联盟的想法表示赞同，但也直言不讳地提出了附加条件。和往常一样，他们要求我们做出防御保证，而且这些保证似乎不容置疑。他们想确保，如果朝鲜发射导弹，我们也会发射导弹；如果他们派出舰队，我们也会做好防御准备。这个想法固然有其可取之处，但值得为此打破现状吗？"
 rudd_visit_ast.1.a: "我们同舟共济。"
 rudd_visit_ast.1.b: "不值得冒这个险。"
 rudd_visit_ast.1.c: "“我们已经和你在一起了。”"
 rudd_visit_ast.2.t: "飞越大阪"
 rudd_visit_ast.2.d: "日本大步拥抱了新的经济秩序。他们在90年代的GDP排名中名列前茅，令人钦佩，但他们的城市才是真正的见证。飞越大阪，仿佛俯瞰着十几个时代广场。即使是我们最现代化的城市，也无法与大阪的城市相提并论，大阪的城市如同霓虹灯写给资本主义的一封情书。\n\n他们抵达东京，双方代表团开始会谈。日方处理谈判的方式仿佛这个问题是刚刚提出的，而不是一个月前经过深入讨论的结果。陆克文怀疑他们是否在拖延时间，但最终他们还是提出了要求。\n\n任何以建立太平洋经济联盟为借口的尝试，都必须包含中国承诺划定其海上领土的保证。中国建造岛屿和扩张海军控制的习惯令日本人担忧，他们认为，如果我们作为过渡代表为他们效力，或许能为联盟的建立奠定良好的基础。"
 rudd_visit_ast.2.a: "我们只会列出条款，不会再做其他说明。"
 rudd_visit_ast.3.t: "北京的回应"
 rudd_visit_ast.3.d: "长途飞行后，陆克文难免感到些许挫败。中国外长代表团几乎把他赶出了会议室。尽管会谈进展顺利，但北京方面对建立和平经济联盟的构想持悲观态度。东盟目前的优势已足够发挥，而[CHI.GetLeader]不愿与邻国斡旋任何新的合作。\n\n虽然谈判并非完全失败，但至少取得了一些成果。谈判团队详细讨论了如何制定一项更加开放的双边贸易协定，并向我们提出了一项新的协定。新协定涵盖了中国进口的众多商品，以换取我国煤炭和其他矿产出口几乎零关税。\n\n对于谈判破裂而言，这算是一个令人欣慰的安慰。"
 rudd_visit_ast.3.a: "还不赖。"
 rudd_visit_ast.4.t: "梅花"
 rudd_visit_ast.4.d: "中国外交部长向我们转达，北京愿意与日本重新谈判领土边界。这或许只是个开始，但他们愿意接受这一要求，表明我们已经取得了多大的进展。他们要求我们以中立观察员的身份参与谈判，这无疑需要数年时间。\n\n我们距离真正建立太平洋联盟或许还有一段路要走，但我们在实现太平洋和平方面取得的进展，即便只是暂时的，也不容低估。北京方面也已表示有意改进我们现有的贸易协定，进一步加强我们各国之间的经济联系，并承诺未来将举行海军防务会谈。"
 rudd_visit_ast.4.a: "我们时代的和平"
 gillard_talk.1.t: "向副手开火"
 gillard_talk.1.d: "按照惯例，朱莉娅·吉拉德向陆克文汇报了她负责的政府事务。自从宣誓就任副[GetASTLeaderTitle]以来，朱莉娅掌管着“超级部委”，也就是教育、就业和劳资关系部这三个部门的统筹。管理起来压力巨大，但陆克文相信她能够胜任。在他们相识的八年里，朱莉娅一直认为她是堪培拉最精明、最有能力的政治家之一。\n\n朱莉娅在简报会上首先向陆克文汇报了许多企业提出的最新抱怨，这些企业认为政府严重偏袒工会，对他们造成了不公平待遇。当然，大部分抱怨都可以忽略不计，但朱莉娅坚持认为我们需要与企业保持良好关系。只要我们不偏离目前亲商的立场，我们在社会政策上走多远并不重要。\n\n她说完后，陆克文能感觉到她的目光像针一样盯着他。即使他们只是随意地聊天，他也觉得她好像在分析他。陆克文同意考虑她的建议，然后他们就离开了，但他心里还是有点怀疑她到底是认真的。"
 gillard_talk.1.a: "值得考虑。"
 papua_talks_rudd.1.t: "拘留中心的翻新工程"
 papua_talks_rudd.1.d: "澳大利亚提出翻新其在此地建造的拘留中心，以换取少量外国援助。这些中心自几乎全部清空后，确实已开始逐渐减少，对我们影响甚微。此举似乎是为了解决其持续存在的移民问题。"
 papua_talks_rudd.1.a: "好吧"
 papua_talks_rudd.1.b: "这次不行。"
 papua_talks_rudd.2.t: "巴布亚新几内亚同意进行翻新"
 papua_talks_rudd.2.d: "尽管租约即将到期，莫尔兹比港政府已同意允许我们进入这些中心，以便开始翻修工作。这应该能让我们把插队者转移到巴布亚新几内亚，并有望阻止未来有人在我国领土上登陆。"
 papua_talks_rudd.2.a: "不出所料"
 papua_talks_rudd.3.t: "巴布亚拒绝谈判"
 papua_talks_rudd.3.d: "尽管政府提供了经济补偿，但莫尔兹比港政府拒绝就翻新拘留中心进行任何讨论。他们似乎纠结于这件事的道德问题。现在我们只能继续在这里安置这些寻求庇护者了。"
 papua_talks_rudd.3.a: "意料之外的失望"
 address_the_tiger_event_ast.1.t: "斡旋印度和平"
 address_the_tiger_event_ast.1.d: "与印度的会谈早在陆克文上任之初，甚至更早之前就已确定。我们在太平洋地区的战略目标高度契合，印度也一直渴望与澳大利亚国防军合作，共同完善其军队。现在，我们只需提出与中国合作的想法即可。\n\n在新德里，红毯铺得格外隆重。[RAJ.GetLeader]或许对此事反应过度，毕竟，他们的大部分沟通都是通过他办公桌上的电话进行的。这次正式国事访问不过是一场作秀，但无疑是一场令人愉悦的作秀。\n\n当他们聚集在海德拉巴宫讨论这项协议时，军事合作问题立即被提上日程，他们当然对此表示赞同。随后，真正的谈判开始了。但只要一提到中国，会议室里的气氛就立刻变了。在谈到中国​​问题时，台湾代表团的态度都比这里的人温和得多。\n\n接下来的几个小时里，陆克文竭尽全力试图让他们接受这个方案，但他最终得到的最好结果也只是对方承诺“一旦其他国家同意与中国合作”，就会考虑经济联盟，这实际上就是拒绝。尽管如此，陆克文官方的说法是，是他促成了谈判。"
 address_the_tiger_event_ast.1.a: "这就足够了。"
 legislation_rudd_blocked.1.t: "该法案在参议院受阻"
 legislation_rudd_blocked.1.d: "看来整个自由党都在反对我们的法案通过。他们使出浑身解数，甚至拉拢了一些独立议员加入他们的阵营。这样下去，我们根本无法通过这项法案。除非我们能在重新提交时获得足够的支持，否则这项法案在参议院注定胎死腹中。\n\n通常情况下，我们需要等待三个月才能再次提交议案。在此期间，我们可以利用自身的影响力争取更多选票，最终获得多数支持，尽管这看起来不太可能。我们或许无法与自由党达成协议，但如果我们尚未争取到绿党的支持，他们或许会接受我们的改革方案，而独立议员的态度则难以预料。"
 legislation_rudd_blocked.1.a: "所谓两党合作，不过如此……"
 legislation_rudd_blocked.2.t: "第二次投票"
 legislation_rudd_blocked.2.d.a: "尽管我们竭尽全力，自由党仍然稳固地保持着多数席位。尽管他们百般拖延，不断提出修正案，我们最终还是进入了投票阶段，但最终以34比42的票数落败。看来所有独立议员都与自由党结盟，而绿党议员则没有被自由党的立场所吸引，没有与我们一起投票。\n\n不过，我们并非完全没有办法。我们可以申请双重解散，同时解散众议院和参议院，并提前举行选举。这是一个风险极高的举动，如果时机把握不当，我们可能会失去一些席位。但这也可能是我们获得多数席位的唯一途径。\n\n这项条款自1987年以来就未曾启动，吉拉德也强烈建议我们不要启动。我们当然可以等到下次选举。不过，如果我们想在此之前通过这项条款，我们仍然可以选择这样做。"
 legislation_rudd_blocked.2.d.b: "尽管我们竭尽全力，自由党在参议院仍然保持着多数席位。尽管他们百般拖延程序并提出修正案，我们最终还是进入了投票阶段，但在绿党的支持下，我们以37比39的微弱劣势落败。看来所有独立议员都已与自由党结盟。\n\n不过，我们并非完全没有办法。我们可以申请双重解散，解散众议院和参议院，提前举行大选。这是一个风险极高的举动，而且我们目前的支持率比上次选举时低了几个百分点。这么快再次举行大选可能会让我们失去首相之位。但这或许也是我们获得多数席位的唯一途径。\n\n这项法案自1987年以来就未曾启动，吉拉德也强烈建议我们不要启动，建议我们等到下届任期再做决定。不过，如果我们想趁着现在势头强劲通过这项法案，我们仍然可以选择启动它。"
 legislation_rudd_blocked.2.a: "是时候采取行动了。"
 legislation_rudd_blocked.2.b: "风险太大了。"
 legislation_rudd_blocked.3.t: "双重溶解"
 legislation_rudd_blocked.3.d: "现在多米诺骨牌已经倒下，解散程序也已启动，提前大选即将举行。第一个障碍已经克服，我们需要集中精力投入竞选。我们党在民调中保持稳定，但如果我们放任自由党，他们可能会左右选情。目前自由党由托尼·阿博特领导，他是我们最坚定的批评者之一。到目前为止，他毫不留情地攻击我们，所以我们也应该毫不示弱地予以反击。\n\n距离选举日还有 60 天，如果我们想要取得领先，就需要控制好国家局势，并继续开展竞选活动。"
 legislation_rudd_blocked.3.a: "压力很大。"
 legislation_rudd_blocked.4.t: "胜利"
 legislation_rudd_blocked.4.d.a: "陆克文瘫坐在椅子上，长舒了一口气。法案通过了，终于结束了。工党和绿党的其他成员爆发出热烈的掌声。而另一边的议员们似乎都双手抱胸，一动不动地坐在那里。但在前排，陆克文却看到马尔科姆·特恩布尔正盯着他看，他发誓特恩布尔脸上带着笑容。\n\n他感到后背被人拍了一下，转过身，看到吉拉德正微笑着俯视着他。就连她也不得不承认，这对工党来说是一项成就。工党终于做成了一件真正伟大的事情，他们在解决无家可归问题上取得的进展也确实意义非凡。工党终于成为了改革的政党。这或许不会长久，但今天他们赢得了第一场战役。\n\n他擦了擦头上的汗，站起来和大家一起鼓掌。是时候好好享受这美好的时光了。"
 legislation_rudd_blocked.4.d.b: "陆克文瘫坐在椅子上，长舒了一口气。法案通过了，终于结束了。工党和绿党的其他成员爆发出热烈的掌声。而另一边的议员们似乎都双手抱胸，一动不动地坐在那里。但在前排，陆克文却看到马尔科姆·特恩布尔正盯着他看，他发誓特恩布尔脸上带着笑容。\n\n他感到有人拍了拍他的背，转过身，看到吉拉德正微笑着俯视着他。就连她也不得不承认，这对党来说是一项成就。多年来，矿业公司阻挠真正的改革，而现在，他们终于要付出代价了。毫无疑问，抹黑运动还会持续几个月，但今天他赢得了第一场战役。\n\n他擦了擦头上的汗，站起来和大家一起鼓掌。是时候好好享受这美好的时光了。"
 legislation_rudd_blocked.4.d.c: "陆克文瘫坐在椅子上，长舒了一口气。法案通过了，终于结束了。工党和绿党的其他成员爆发出热烈的掌声。而另一边的议员们似乎都双手抱胸，一动不动地坐在那里。但在前排，陆克文却看到马尔科姆·特恩布尔正盯着他看，他发誓特恩布尔脸上带着笑容。\n\n他感到后背被人拍了一下，转过身，看到吉拉德正微笑着俯视着他。就连她也不得不承认，这对工党来说是一项成就。工党信守了承诺。当其他国家都无所作为时，澳大利亚将挺身而出。子孙后代的福祉将因我们而得到保障。\n\n他擦了擦头上的汗，站起来和大家一起鼓掌。是时候好好享受这美好的时光了。"
 legislation_rudd_blocked.4.a: "实至名归。"
 approach_parties_rudd.1.t: "接近自由派"
 approach_parties_rudd.1.d: "自由党和国家党目前奉行“一概反对”的策略，显然是为了抗议我们被排除在规划之外。如果他们得逞，这项法案将被彻底删减。无论如何，他们现在都不愿意对法案进行任何修改。"
 approach_parties_rudd.1.a: "你不可能每次都赢。"
 approach_parties_rudd.2.t: "安抚绿党"
 approach_parties_rudd.2.d: "争取绿党支持的唯一难题就是他们的要求。绿党虽小，但他们制造麻烦的能力却不容小觑。如果我们不与他们谈判，他们就会投反对票以示抗议，而且他们坚持要求我们加强一项本就备受争议的法案。我们使尽浑身解数做出妥协，最终他们同意支持基本相同的法案，只是做了一些细微的补充。"
 approach_parties_rudd.2.a: "希望他们能信守承诺。"
 approach_parties_rudd.3.t: "局外人"
 approach_parties_rudd.3.d: "民主党工党参议员和独立候选人尼克·泽诺芬都对这项法案持反对态度。尼克从一开始就对我们的政府持批评态度，而且他们两人的投票记录大多倾向于自由党，但在承诺未来会与自由党合作修改法案后，他们同意支持这项法案。"
 approach_parties_rudd.3.a: "好极了。"
 mad_katter_ast.1.t: "疯卡特"
 mad_katter_ast.1.d: "鲍勃·卡特是昆士兰北部事实上的“国王”，他担任该地区代表近20年。他是一位名副其实的激进政治家，而且绝非寻常之辈。无论是他的穿着、观点，还是说话方式，都与众不同。如果你听了卡特的讲话，就如同踏上了一段旅程，而你根本无法预知这段旅程会走向何方。\n\n他们一开始假装要合作制定一项新法案，但卡特却突然开始谈论农民的困境和香蕉进口问题。他最终情绪激动，陆克文不得不制止他。显然，他对持续干旱造成的人员伤亡深感忧虑。\n\n陆克文无法判断这个人是社会主义者还是保守派，或许两者兼而有之。无论如何，他们都要想办法帮助农民。"
 mad_katter_ast.1.a: "这是我们力所能及的。"
 whispers_in_the_crowd_ast.1.t: "人群中的窃窃私语"
 whispers_in_the_crowd_ast.1.d: "陆克文如今已习惯了国会大厦的运作模式。现状往往在一下午之内就能决定，而且一切都瞬息万变。如今一切已全面展开，他对政府的步伐感到满意。然而，从他宣誓就职至今，某些事情已经发生了变化，这让他开始感到疲惫。\n\n他似乎和内阁里的几乎每个人都相处融洽，但偶尔他会感觉到他们对他的好感正在减弱。以前他们对他的命令言听计从，现在却越来越频繁地质疑他。他不得不反复解释自己的决策理由，这让他的政策方向也受到了质疑。\n\n他是不是有点疑神疑鬼了？或许吧。也许是所有的事情都让他们感到压力重重。再说，他仍然相信他的内阁成员会去参加聚会。\n\n陆克文耸耸肩，继续工作。这可能没什么大不了的。"
 whispers_in_the_crowd_ast.1.a: "真的是这样吗？"
 mining_smear_campaign_ast.1.t: "媒体宣传活动"
 mining_smear_campaign_ast.1.d: "现在，大型矿业公司发现了我们的计划，媒体抹黑运动全面展开。数十种不同的广告充斥着各个频道和媒体渠道，路边也竖起了横幅。他们不去缴纳应缴的税款，反而斥资数百万美元来诋毁我们的政府。虽然并非所有抹黑都奏效，但一旦奏效，就会损害我们的执政能力，公众舆论也会随之下降。\n\n反对党联盟已经开始搭上这趟批评大军了。如果我们不尽快采取措施制止这种行为，情况只会越来越糟。"
 mining_smear_campaign_ast.1.a: "不太好。"
 corruption_outcome_aus.1.t: "手被困在罐子里"
 corruption_outcome_aus.1.d: "我们近期党内调查的结果已经提供了足够的证据，足以彻底消除外国势力对党的影响，至少目前如此。然而，也有几项与利益集团干预无关的调查结果，这让我们的党蒙上了一层阴影。\n\n目前还没有发现任何与我们相关的证据，但这足以让我们在公众眼中失去一些信誉。在淡出公众视野之前，我们必须谨言慎行。"
 corruption_outcome_aus.1.a: "哎呀！"
 aus_gillard_overthrow.1.t: "敲门声"
 aus_gillard_overthrow.1.d: "卢克文正在办公室里处理日常文件，这时门外响起了敲门声。他认出了这是常态，于是叫来了朱莉娅·吉拉德。吉拉德缓缓地走了进来，步伐沉稳而坚定。与往常不同的是，她没有起身，而是站着。卢克文抬头看向她时，她告诉了他这个消息。\n\n对陆克文来说，他感觉周围的办公室墙壁仿佛正在向内坍塌。随着她继续发言，他的世界正在崩塌，他只能震惊地看着她步步紧逼。吉拉德要发起领导权挑战。他简直不敢相信，自己的竞选搭档竟然要推翻他，更何况还是他视为朋友的人。最糟糕的还没结束。她要求他辞职。\n\n除了书面程序之外，他实际上已经被彻底击败了，但她却给了他一个保全颜面、避免议会审判的机会。当她列举所有支持她的内阁成员时，卢克文意识到他所有的盟友都被她翻脸了。现在，他在党内孤立无援了。"
 aus_gillard_overthrow.1.a: "一切都结束了。"
 aus_gillard_overthrow.2.t: "黎明"
 aus_gillard_overthrow.2.d: "室外讲台周围挤满了摄像机，等待着宣布结果。此时此刻，人人都知道发生了什么。议会传出的任何消息都传播得非常迅速，这无疑是一次精心策划的胜利。第二天早上，一切就结束了。记者们尴尬地站在那里等待着那一刻，大门终于打开，[GetASTLeaderTitle]带着家人走了出来。\n\n“我由澳大利亚人民选举为这个[GetASTLeaderTitle]的领导人，是为了给所有澳大利亚人带来公平的机会，我为此竭尽全力，倾尽所有。本着这种精神，我为我们为使这个国家更加公平所取得的成就感到自豪。”\n\n他眼眶已经开始泛红。或许卢克文在错误的时间成为了合适的[GetASTLeaderTitle]。他几乎无力阻止这个政党变成一个人员频繁更迭的旋转门，而政权更迭正逐渐成为一种令人悲哀的常态。\n\n“过去的两年半非常忙碌。我们倾注了全部心血，我相信当我们回顾过去时，这些改革将持续到未来，并使澳大利亚成为一个比以往更加公平、更加美好的地方。”\n\n在卢克文挥手告别之前，人群中响起了一阵掌声。他只能希望自己是对的，希望他为改变现状所做的努力能够真正奏效。"
 aus_gillard_overthrow.2.a: "再见了，我的甜心王子。"
 the_new_look_rudd.1.t: "新面貌"
 the_new_look_rudd.1.d: "随着选举季的喧嚣再次涌入他的日常生活，陆克文发现自己几乎没有时间顾及个人仪容。他很可能在议会彻夜未眠，处理各种提案和其他日常事务，第二天又奔赴竞选之路。\n\n今天他身处远离首都的昆士兰州格里菲斯选区。太阳刚升起，他就已经开始查看笔记，享受着难得的清静。这在最近几天实属罕见。然而，仿佛是事先安排好的一样，这份宁静被打破了，露营车的纱门猛地打开，安东尼·阿尔巴尼斯气呼呼地走了进来。\n\n安东尼身材矮胖，举止有些笨拙，但就在不久前，他和卢克文还为了党内领导权争得不可开交，卢克文对此始终铭记于心。安东尼跌跌撞撞地走进来，把一杯咖啡放在卢克文旁边的桌子上，卢克文点头致谢。\n\n“老兄，你看上去很邋遢。”他指了指卢克文的下巴。卢克文摸了摸下巴，才意识到自己已经两三天没刮胡子了，白色的胡茬都长成了胡子。\n\n“看来我确实是。我看起来怎么样？”\n\n“我的意思是，这还不错。或许会让选民们感到意外。”安东尼笑着说。\n\n“嗯，我想我不想显得衣衫不整。”\n\n“我不知道。也许他们会喜欢吧。”"
 the_new_look_rudd.1.a: "那我就留着它。"
 the_new_look_rudd.1.b: "该刮胡子了。"
 rudd_the_next_leader.1.t: "党的未来"
 rudd_the_next_leader.1.d: "在任何领导者的一生中，总有那么一个时刻，他们必须考虑下一代。与陆克文相比，朱莉娅·吉拉德并不是年轻一代，但她很可能是该党的未来。根据他们在2007年大选时达成的协议，陆克文向吉拉德承诺，他会在某个时候辞职，让她追随他。\n\n对陆克文来说，责任重大，但吉拉德至今没有让他失望。她是党内负责实务的代表。她对预算赤字和经济增长的担忧鲜少被提及，这似乎有些不同寻常，而她提出的全国矿业改革计划也引起了陆克文的极大兴趣。她显然非常关心这个问题。至于她是否胜任这份工作，陆克文迟早需要做出决定。"
 rudd_the_next_leader.1.a: "值得考虑。"
 rudd_the_next_leader.1.b: "休想！"
 rudd_the_next_leader.2.t: "下台"
 rudd_the_next_leader.2.d: "“这个国家能够和平地处理政治分歧，以和平、文明的方式解决政治问题，这正是这个国家如此伟大的原因。在现代澳大利亚这幅奇妙的画卷中，在我们多元文化的国家这幅马赛克画卷中，在多样性中塑造出如此团结的景象，这其中就蕴藏着澳大利亚的伟大奇迹。”\n\n“我相信，澳大利亚人民应该在新领导层的带领下开启新的篇章。我知道这对你们中的一些人来说并非好消息，但我的职责是保持工党作为未来斗争力量的活力，以便我们能够团结在下一任党魁朱莉娅周围。”\n\n“所以朋友们，在一段时间内，你们将不会在国家公共事务中听到我的声音。”\n\n“我很荣幸能担任你们的[GetASTLeaderTitle]和你们党的领导人，但总有一天你会意识到你已经竭尽全力，而党也需要为未来更新领导层。”"
 rudd_the_next_leader.2.a: "“对我而言，就是现在。”"
 rudd_campaigning_round_two.1.t: "绕着会议中心转一圈"
 rudd_campaigning_round_two.1.d: "当陆克文走下工党全国代表大会的过道时，人群的情绪达到了沸点。就连党内元老保罗·基廷也到场为他欢呼，这让整个大会宛如梦境一般。仿佛他从未离开过。过去几年对他来说只是一场噩梦，而现在他终于在同事们的掌声中醒来。而正是这些同事，曾经为他的垮台而欢呼。\n\n政治真是变幻莫测。你总是如履薄冰，既要顾及公众，又要顾及党内人士。然而，如果能赢得他们下次选举的支持，他还是会和他们握手。一切都太过微妙，让人难以安心。\n\n他需要创造奇迹才能连任，但大局已定，卢克文会全力以赴。"
 rudd_campaigning_round_two.1.a: "我们回来了，而且会一直在这里。"
 gillard_gov_event.1.t: "新的方向"
 gillard_gov_event.1.d: "在狭小的会议室里，朱莉娅·吉拉德以[GetASTLeaderTitle]的身份发表了她的首次新闻发布会。记者和政界同僚们都聚集于此，聆听她的讲话，并屏息等待她即将公布的施政纲领。此刻，她肩负着真正的重任。为了走到今天这一步，她付出了数月的努力，每一步都经过精心布局，并争取到了内阁成员的支持。这一切都是为了确保万无一失。\n\n吉拉德如今已是世界上最有权势的女性之一，但她的处境却从未如此岌岌可危。她犯的任何错误都会被反对派、媒体，或者任何认为她没有勇气与同僚抗衡的人仔细审视数日。她必须步步谨慎。\n\n任何合理的政策制定都将被搁置，直到选举能够举行为止，而选举很快就会举行。在此之前，她只能装出一副合格的形象，并寄希望于公众相信她能够胜任这份工作。"
 gillard_gov_event.1.a: "还有什么问题吗？"
 papua_residency_ast.1.t: "澳大利亚提出的经济协定"
 papua_residency_ast.1.d: "为了加强区域经济联系，澳大利亚政府提出了一项“零关税”贸易协定方案。该方案包括减少对两国商品和服务的限制，以换取双方互惠互利的矿产资源开采权。两国都将从商品流通的增加中获益匪浅，但最终的选择权仍然在我们手中。"
 papua_residency_ast.1.a: "当然是为了他们！"
 papua_residency_ast.1.b: "不了，谢谢"
 papua_residency_ast.2.t: "巴布亚经济一体化"
 papua_residency_ast.2.d: "巴布亚新几内亚已同意拟议的通过贸易将我们两国经济联系起来的协定。谈判正在最后阶段，该协定将允许巴布亚商品和服务享受零关税贸易，简化投资流程，并赋予双方优先资源使用权。大洋洲距离成为区域经济联盟又近了一步。"
 papua_residency_ast.2.a: "好极了。"
 papua_residency_ast.3.t: "与巴布亚的联系失败"
 papua_residency_ast.3.d: "很遗憾，巴布亚新几内亚拒绝了该协议，更倾向于维持我们目前的贸易关系。"
 papua_residency_ast.3.a: "令人失望。"
 indo_ast_trade_deal.1.t: "澳大利亚提议达成贸易协定"
 indo_ast_trade_deal.1.d: "为了缓和我们冷淡的关系，澳大利亚提议签署一项自由贸易协定，并承诺未来开展军事合作。目前来看，该协定将确保货物和服务与我们之间的顺畅流通，很可能带来经济效益，但军事合作协议的具体内容尚不明确。"
 indo_ast_trade_deal.1.a: "一个合理的提议。"
 indo_ast_trade_deal.1.b: "不了，谢谢"
 indo_ast_trade_deal.2.t: "来自陆克文的好消息"
 indo_ast_trade_deal.2.d: "陆克文从印度尼西亚回来并取得了良好的成绩。印度尼西亚对自由贸易协定做出了积极反应，条件是我们的澳大利亚国防军致力于共同安全努力。我们已经与印度尼西亚人一起致力于反恐工作，所以这并不是什么新鲜事，而且这一请求有意保留了开放性，以便我们能够确定未来的承诺。目前，该协议将极大地促进我们两国之间的贸易。"
 indo_ast_trade_deal.2.a: "棒极了。"
 indo_ast_trade_deal.3.t: "印尼拒绝贸易提议"
 indo_ast_trade_deal.3.d: "令人遗憾的是，雅加达政府拒绝了这项协议，对陆克文的努力反应冷淡，宁愿维持我们目前的贸易关系。"
 indo_ast_trade_deal.3.a: "不算好，但也在意料之中。"
 forming_government_gil.1.t: "选择你的毒药"
 forming_government_gil.1.d: "选举结果已经明确表明，如果我们想继续执政，就必须组建联合政府。目前，反对党正在迅速行动，力图从议会中夺取更多席位。党内左翼派系鼓励我们与绿党达成协议。我们之前就和绿党合作过，他们似乎也愿意合作，但我们党内一些保守派成员对此持保留态度，而且绿党很可能会提出一些自己的要求。\n\n另一方面，一些自由党叛逃者主动联系我们，表示支持我们的一些纲领，并愿意加入我们的联盟。有了这些前自由党成员的支持，我们或许能在民众眼中显得更加跨党派。考虑到选举结果，采取更中间的立场或许并非坏事。"
 forming_government_gil.1.a: "选择绿党"
 forming_government_gil.1.b: "自由党-工党联盟。"
 gillard_gov_event.2.t: "填满内阁"
 gillard_gov_event.2.d: "至少在朱莉娅看来，内阁成员个个都是工党精英，而且能力出众，更重要的是，他们都非常忠诚。新任副[GetASTLeaderTitle]韦恩·斯旺已同意与吉拉德会面，商讨组建外交部的事宜。\n\n他们在吉拉德的办公室会面时，吉拉德解释说，她更希望专注于国内事务，让外交部自行处理。他们一起探讨了各种方案，其中有两个显而易见的选择。斯蒂芬·史密斯是第一个主动请缨为新任[GetASTLeaderTitle]效力的人选，他曾为基廷效力，此后一直忠于工党。斯旺相信史密斯会坚持党的路线，并确保我们走在正确的道路上。\n\n另一个选择是鲍勃·卡尔。卡尔其实已经离开议会一段时间了，一直担任顾问，他凭借激烈的公开辩论而越来越受欢迎。他的政策倾向于更大胆的路线，如果朱莉娅想要的就是这个方向，那么他的提名无疑会留下深刻的印象。不过，现在还有时间做决定，而且鉴于当时的情况，也不急于恢复海外事务。"
 gillard_gov_event.2.a: "需要考虑的事情很多。"
 forced_adoptions_gillard.1.t: "吉拉德政府就强制收养问题发表讲话"
 forced_adoptions_gillard.1.d: "[GetASTLeaderTitle]朱莉娅·吉拉德于今晚，就1950年至1975年的政府政策历史性行为向全国道歉，这些政策迫使成千上万的原住民母亲与她们的孩子分离。\n\n“我们承认这些政策和做法对父亲们产生了深远的影响，我们也认识到这些行为对兄弟姐妹、祖父母、伴侣和大家庭成员造成的伤害，”吉拉德在国会大厦内对800多名听众说道，其中许多人都在流泪。\n\n据估计，有10万至15万名婴儿被强行或胁迫从母亲身边带走，这些母亲大多是年轻的未婚妇女。"
 forced_adoptions_gillard.1.a: "我们深表同情。"
 let_debate_decide_gillard.1.t: "同性婚姻法案被否决"
 let_debate_decide_gillard.1.d: "不出所料，众议院以98票赞成、42票反对的压倒性优势否决了同性婚姻合法化法案。我们党的纲领一贯反对这一理念，而大多数回应也都是老生常谈地捍卫传统价值观等等。我们已经因此在网上遭到许多进步派选民的批评，毫无疑问，这种批评将会对下次选举产生影响。"
 let_debate_decide_gillard.1.a: "好吧。"
 let_debate_decide_gillard.2.t: "反歧视修正案在参议院迅速获得通过"
 let_debate_decide_gillard.2.d: "出人意料的是，两党合作使得我们的同性恋保护法案在众议院和参议院以压倒性优势获得通过。该修正案涵盖了广泛的反歧视保护措施，包括禁止基于性取向的歧视，以及由联邦政府资助的保护和支持弱势群体、提供教育服务的项目，从而强化了现有的法律。\n\n反对党领袖仅对指导方针中的一些细枝末节提出了轻微抱怨，但总体而言，这似乎是该党的一次世代胜利。我们已经从进步人士那里获得了压倒性的线上支持。"
 let_debate_decide_gillard.2.a: "又赢了！"
 opposition_attacks_ast.1.t: "反对派开火"
 opposition_attacks_ast.1.d: "托尼·阿博特的言论一向煽动性强、言辞过激，但最近他的攻击手段更是变本加厉。一群抗议者出现在国会大厦外，举着一些相当“不雅”的标语后，阿博特抓住机会走上前去与他们互动，还邀请记者拍摄这一幕。\n\n原本可能只是一场边缘集会，如今却引起了如此大的关注，以至于报纸上出现了“抛弃女巫”的标题，有的甚至用了“烧死婊子”这样的字眼。即使对艾伯特来说，这也太粗俗了，而现在新闻集团旗下的媒体竟然也跟着起哄。"
 opposition_attacks_ast.1.a: "太棒了。"
 opposition_attacks_ast.2.t: "阿博特发起媒体巡回宣传，抨击我们的治理方式"
 opposition_attacks_ast.2.d: "托尼·阿博特再次成为人们关注的焦点，只是为了批评我们的政策。最近，在《今日秀》中，阿博特不断地谈论我们的预算规划的不可行性，并将其贴上“浪费”、“愚蠢”和常见的攻击标签。如果前一天的新闻民意调查没有将我们描绘成不太受欢迎的政府，在民意调查中落后阿博特5个百分点，那么这种打击就不会那么严重。随着我们的支持逐渐减少，无论我们说什么，都没有多少立足之地。"
 opposition_attacks_ast.2.a: "我们就不能喘口气吗？"
 ast_fm_rudd_focus.5.t: "陆克文离开内阁"
 ast_fm_rudd_focus.5.d: "在华盛顿特区举行的新闻发布会上，陆克文似乎向在场民众宣布他将正式辞去外交部长一职。这令在场民众震惊不已，也无疑损害了我国政府的形象。但更糟糕的是，陆克文随后竟然将他的决定归咎于我们，声称他没有得到我们的支持。\n\n陆克文很可能在下次有机会时就挑战我们的领导地位。党内已经有人在讨论他可能发表政治演说，所以我们必须做好应对一切的准备。眼下，我们需要一位新的外交部长。"
 ast_fm_rudd_focus.5.a: "缺乏支持？但我们还是选了他！"
 opposition_attacks_ast.3.t: "彼得·斯利珀短信"
 opposition_attacks_ast.3.d: "现任议长彼得·斯利珀最近饱受争议，数百条他发送的私人短信在针对他的法律诉讼中被公开。彼得此前是自由党成员，后来跳槽到我们党，成为独立议员。这些短信内容相当恶劣，虽然是议长的个人私事，但现在自由党却指责我们没有立即开除彼得是性别歧视者。\n\n托尼·阿博特煽动对我们发起不信任投票，除非我们解雇彼得·斯利珀，否则我们将在议会中有机会为自己辩护。虽然这些措辞并不高明，但与自由党的惯常言论相比也相差无几，而且向阿博特表达我们的不满也无妨。"
 opposition_attacks_ast.3.a: "让我们在大会上试试。"
 opposition_attacks_ast.3.b: "让斯利珀滚蛋。"
 opposition_attacks_ast.4.t: "吉拉德的厌女言论获得广泛支持"
 opposition_attacks_ast.4.d: "在昨天一场激烈的议会辩论中，[GetASTLeaderTitle]对反对党领袖托尼·阿博特的人格进行了猛烈抨击。此前，因“斯利珀短信”事件引发的紧张局势已演变为两人持续不和的导火索。在议会的不信任投票中，吉拉德开始抨击阿博特近年来发表的性别歧视言论。\n\n“我不会接受这个人关于性别歧视和厌女症的说教，绝不。政府也不会接受这个人关于性别歧视和厌女症的说教。现在不会，以后也不会。”\n\n吉拉德的演讲不仅在英国全国范围内，而且在全球网络上也立即获得了好评。英国和美国的报纸也迅速加入到这场政治风暴中，《每日电讯报》称吉拉德对性别歧视的“抨击”既“犀利”又“精彩”。"
 opposition_attacks_ast.4.a: "很高兴最终得到了回报。"
 rudd_events_gillard.1.t: "陆克文提供服务"
 rudd_events_gillard.1.d: "虽然我们仍在敲定内阁名单，但陆克文已主动联系我们，表示愿意担任外交部长。毫无疑问，陆克文可能是外交领域经验最丰富、政绩最卓著的部长，让一位曾担任过外交部长的人士加入我们，或许能提升我们的政治影响力。然而，如果我们想展现工党的新面貌，或许应该让新内阁与旧内阁有所区别。"
 rudd_events_gillard.1.a: "欢迎加入"
 rudd_events_gillard.1.b: "我们很好，谢谢。"
 rudd_events_gillard.2.t: "问答剧"
 rudd_events_gillard.2.d: "有消息称，陆克文意外现身Q+A访谈节目，回答了一些与其任期相关的问题。表面上看，这似乎没什么大不了的，但几位内阁成员注意到，陆克文在回答某些问题时语气“尖锐”，指责某些“同事”在他任期内暗中破坏他的工作。\n\n尽管听起来很中立，但记者们却直接将矛头指向我们，指责内阁成员导致陆克文下台。这些指控荒谬至极，却让我们在民调中雪上加霜。"
 rudd_events_gillard.2.a: "他是故意的吗？"
 rudd_events_gillard.3.t: "陆克文竞选"
 rudd_events_gillard.3.d: "最近，陆克文频频现身地方选举，为其他工党成员助选。工党当然对此表示感谢，但陆克文几乎是刻意地将一切焦点转移到自己身上。他把访问变成拍照作秀，抢走候选人的风头，接受自己的采访。他试图为自己而非工党政府争取支持，而这招似乎奏效了。\n\nNewspolls 民调显示，陆克文的支持率远高于我们自己的民调结果，如果我们采取任何措施阻止他的小巡访，只会让情况变得更糟。"
 rudd_events_gillard.3.a: "该死的陆克文！"
 rudd_events_gillard.4.d: "人们发现陆克文多次前往地方选区，为工党候选人助选。这对于资深党员来说是司空见惯的活动，但陆克文似乎格外用心，积极宣传我们的政策，并向媒体大力推介。\n\n媒体是否会采纳是一回事，但这确实对我们的民调数据产生了奇效，而且肯定会对我们即将到来的州选举有所帮助。"
 rudd_events_gillard.4.a: "真贴心。"
 rudd_events_gillard.5.t: "陆克文公开反对我们的政府"
 rudd_events_gillard.5.d: "不出所料，陆克文一直在议会里暗中活动，试图拉拢更多部长反对我们。不幸的是，媒体正在大肆报道一段“泄露”的谈话录音，录音中陆克文宣称他不相信我们政府能够赢得下届大选，并且他正在考虑发起领导权挑战，而且他背后有强大的支持者。\n\n这很可能是陆克文惯用的伎俩，目的是扰乱我们的心神。举行领导人投票或许能让他认清自己的位置，但这种伎俩值得我们去理会吗？"
 rudd_events_gillard.5.a: "举行领导层投票。"
 rudd_events_gillard.5.b: "这根本没什么大不了的。"
 rudd_events_gillard.6.t: "领导层投票已举行"
 rudd_events_gillard.6.d: "工党领袖选举后，陆克文以31比71惨败。陆克文承诺将终止任何针对我们的挑战，并在未来的任何选举中都给予支持，无论选举结果如何。选举结果表明，尽管面临重重困难，工党依然坚定地支持我们。本届政府将继续履行对澳大利亚人民的使命，无论前路多么艰难。现在是时候重返战场，继续推进我们的政策了。"
 rudd_events_gillard.6.a: "说得好！"
 rudd_events_gillard.7.t: "内阁成员集体辞职"
 rudd_events_gillard.7.d: "本周内，我们三位主要内阁成员相继递交了辞呈，我们只能推测这是对政府的一种抗议。一些支持陆克文的下级内阁成员也纷纷辞职以示回应。就党内团结而言，形势已十分严峻。我们需要尽快找到一些紧急替代人选，并尽快发布公告以挽回颜面。\n\n如果这些破坏活动不那么频繁，我们或许就能推动严肃的改革，真正致力于我们当选后应该做的工作。"
 rudd_events_gillard.7.a: "就像老鼠逃离沉船一样。"
 rudd_events_gillard.8.t.a: "绿党结束联盟"
 rudd_events_gillard.8.t.b: "前自由派独立人士团结在[GetASTLeaderTitle]周围"
 rudd_events_gillard.8.d.a: "在近期内阁成员纷纷离职之际，新任绿党领袖克里斯汀·米尔恩宣布，绿党也将与我们决裂，联盟就此瓦解。他们以政策分歧为由，编造了一些关于曲棍球的借口，但我们早就预料到这一天迟早会到来。工党将独自参加下届大选。"
 rudd_events_gillard.8.d.b: "面对反对党的批评，独立人士团结在[GetASTLeaderTitle]周围，在当前的动荡局势中捍卫我们政府的政策。尽管托尼·温莎经常出入医院，他甚至还出现在镜头前，吹嘘自己推动的积极改革，以及他在议会中对我们席位的支持。说实话，我们早就该得到一些认可了。"
 rudd_events_gillard.8.a: "典型的。"
 rudd_events_gillard.8.b: "这是一个令人欣慰的举动。"
 rudd_events_gillard.9.t: "又一项领导层挑战"
 rudd_events_gillard.9.d: "随着民调支持率持续下滑，议会中的批评者如同嗅到血腥味的鲨鱼般蜂拥而至，开始酝酿领导权挑战。自上次以来，我们的支持率已大幅下降。尽管陆克文曾做出承诺，但有传言称，一旦有人发起挑战，他也会参选。毫无疑问，他早已与他的拥护者们密谋已久。\n\n尽管我们在上一轮投票中获胜，但这一次我们可能也难以全身而退。"
 rudd_events_gillard.9.a: "冲锋陷阵。"
 gillard_goodbye_ast.1.t: "落幕"
 gillard_goodbye_ast.1.d: "在投票前的一次会议上，陆克文承诺如果败选就退出政坛，但当时他的话已无关紧要。如果能看到他缓缓隐退，从此不再玷污这片土地，那该是多么令人欣慰。可惜我们没那么幸运。陆克文以57比45的绝对优势胜出。\n\n澳大利亚真的准备好迎接一位女性[GetASTLeaderTitle]了吗？无论在议会内外，他们都丝毫没有表现出来。朱莉娅苦心经营的一切突然间都消失了，甚至来不及消化这个消息。他们离开了工党议员会议室，直接进入了会议室。\n\n吉拉德向与她宣誓就职时类似的人群发表了最后一次演讲。演讲简短明了。她不会对选举结果提出异议。异议又有什么意义呢？有时候，你出牌了，结果却输了。\n\n吉拉德不会输不起。"
 gillard_goodbye_ast.1.a: "现在结束了。"
 gillard_goodbye_ast.2.t: "最终投票"
 gillard_goodbye_ast.2.d: "投票期间，吉拉德始终保持冷静。她不想让他们看到她担忧的神色。陆克文懒散地坐在房间后排。他无需多言，浑身散发着一股沾沾自喜的气息。在她作为[GetASTLeaderTitle]的最后时刻，朱莉娅会以尊严来履行职责，否则她真想走到他跟前，狠狠地扇他一巴掌，让他清醒清醒。\n\n投票开始，候选人的名字被一一念出。47……51……55……63。最终结果为63比39。吉拉德获胜。\n\n她的内阁成员起立，在她身后鼓掌。她几乎动弹不得，但还是强迫自己站起来接受祝酒，脑海中飞速闪过各种念头。难道党终于接纳她了吗？仿佛是某种最后的抗议，陆克文也站了起来，开始鼓掌。投票前，陆克文曾承诺，如果败选就退出政坛。她再也不用见到他了。\n\n他们迅速离开了工党党团会议室，来到附近的会议室，吉拉德宣布了结果，确认她将参加下届选举。"
 gillard_goodbye_ast.2.a: "结束了？"
 uranium_trade_deal_ast.1.t: "澳大利亚铀贸易提案"
 uranium_trade_deal_ast.1.d: "澳大利亚政府向我们提出了一项经济协议，同意增加向我们出口铀的数量，以换取我们尽可能降低对其出口的关税。澳大利亚政府也同意同样降低对我们出口的关税，并愿意在未来做出更多贸易合作承诺。该协议规定，铀不得用于武器级浓缩，但一旦矿石进入我们的国境，最终决定权就在我们手中了。"
 uranium_trade_deal_ast.1.a: "一项富有成效的协议。"
 uranium_trade_deal_ast.1.b: "这不符合我们的利益。"
 uranium_trade_deal_ast.2.t: "印度同意铀交易"
 uranium_trade_deal_ast.2.d: "印度已同意新条款并签署了贸易协定！我们可以期待以更高且更优惠的价格从他们那里获得一系列商品和服务，同时他们也将降低对我们铀的关税。对协议成功至关重要的是，他们还同意采用国际原子能机构的标准，规定铀不得用于武器级浓缩。作为交换，我们将与他们开展能源研究方面的合作。"
 uranium_trade_deal_ast.2.a: "双赢！"
 uranium_trade_deal_ast.3.t: "印度拒绝贸易协定"
 uranium_trade_deal_ast.3.d: "印度拒绝了我们提出的贸易提议，并选择继续履行现有承诺。[GetASTLeaderTitle][RAJ.GetLeader]尚未对此结果发表评论，但看来我们并未获得印度政府的青睐。这无疑是和平贸易的一大倒退，也是一个令人遗憾的疏忽。"
 uranium_trade_deal_ast.3.a: "我们正在失去联系。"
 uranium_trade_deal_ast.5.t: "莫斯科签署该协议"
 uranium_trade_deal_ast.5.d: "莫斯科政府已同意我们的贸易条款，并将取消对我们商品的一系列关税，以换取我们增加对俄铀出口。虽然他们对铀的用途仍未明确说明，但承诺不会将其用于武器级浓缩。这项协议标志着双方合作取得了突破性进展，其程度堪比柏林墙倒塌前夕，而且他们似乎也渴望继续与我们开展合作。"
 uranium_trade_deal_ast.5.a: "把罗宋汤端出来！"
 uranium_trade_deal_ast.6.t: "莫斯科退出谈判"
 uranium_trade_deal_ast.6.d: "俄罗斯拒绝了我们提出的贸易提议，并选择继续履行现有承诺。俄罗斯总统[SOV.GetLeader]尚未对此结果发表评论，但看来我们并未获得俄罗斯政府的青睐。这无疑是和平贸易的一大倒退，也是一个令人遗憾的疏忽。"
 uranium_trade_deal_ast.6.a: "最好不要招惹这只熊。"
 rudd_in_korea.1.t: "来自澳大利亚的榫卯"
 rudd_in_korea.1.d: "澳大利亚外交部长一直通过中国与我们进行谈判，试图促成我们与韩国关系的缓和。这个计划大胆而又略显天真。澳大利亚方面要求我们承诺在一定时间内停止远程武器的生产，但并不拆除我们现有的任何武器，以此换取制裁的解除和发展援助。由于我们与韩国的战争在技术上尚未结束，他们提出在非军事区检查站解决争端。这或许是一个值得利用的宣传机会。"
 rudd_in_korea.1.a: "一次独特的经历。"
 rudd_in_korea.1.b: "这不符合我们的最佳利益。"
 rudd_in_korea.2.t: "陆克文在韩国取得胜利"
 rudd_in_korea.2.d: "陆克文缓缓走过朝韩非军事区检查站，与朝鲜领导人[KOR.GetLeader]握手。两人分别站在各自一侧的边界线上，这象征着朝韩关系向前迈出了重要一步，也预示着亚洲格局的重大转变。随后，陆克文越过边界，成为首位进入朝鲜的澳大利亚政府官员和前领导人。\n\n经过四个月的密集谈判，经由中国反复传递，最终取得突破性进展。[NKO.GetLeader]同意制定停止远程武器研发的时间表，并寻求解决自1950年以来一直持续至今的朝鲜战争，以换取制裁的解除和发展援助。当天晚些时候，陆克文和最高领导人在新闻发布会上发表讲话，强调了两国希望建立的友好关系。\n\n陪同陆克文前往非军事区的韩国总统[KOR.GetLeader]称赞陆克文的努力取得了真正的成功，对国际和平来说是一件好事。"
 rudd_in_korea.2.a: "稳健的外交手段再次取得胜利。"
 vietnam_trade_gillard_ast.1.t: "来自澳大利亚的贸易提议"
 vietnam_trade_gillard_ast.1.d: "澳大利亚政府向我们提出了一项经济协议，旨在简化我们之间的贸易流程，提高贸易量，并尽可能降低双方的关税。迄今为止，我们之间的贸易一直保持着良好的发展势头，而且他们似乎也对未来开展更多合作安排抱有浓厚的兴趣。"
 vietnam_trade_gillard_ast.1.a: "一个合理的提议。"
 vietnam_trade_gillard_ast.1.b: "这不适合我们。"
 vietnam_trade_gillard_ast.2.t: "越南同意进行贸易谈判"
 vietnam_trade_gillard_ast.2.d: "越南政府已同意新条款并签署了贸易协定。我们可以期待以更优惠的价格从越南获得一系列商品和服务，更多澳大利亚人也将能够在附近的商店享受到更便宜的商品。"
 vietnam_trade_gillard_ast.2.a: "一切都水到渠成了。"
 vietnam_trade_gillard_ast.3.t: "越南拒绝贸易谈判"
 vietnam_trade_gillard_ast.3.d: "越南拒绝了我们的贸易提议，选择继续履行现有承诺。外部压力或许阻止了他们签署协议，但越共总书记[VIE.GetLeader]尚未对此结果发表评论。这无疑是太平洋贸易的一次倒退，也是一个令人遗憾的结果。"
 vietnam_trade_gillard_ast.3.a: "令人失望的结果"
 stir_the_pot_event.1.t: "澳大利亚要求设立禁飞区"
 stir_the_pot_event.1.d: "在我方战机多次误击民用设施后，澳大利亚政府要求我方遵守在利比亚上空设立的“禁飞区”，并规定我方战机必须停放在基地内，否则将遭到澳大利亚空军的攻击。他们是否真的会执行这一要求，我们不得而知，但他们距离利比亚非常遥远，而且要求相当苛刻。"
 stir_the_pot_event.1.a: "屈从于他们的要求。"
 stir_the_pot_event.1.b: "利比亚领空属于利比亚！"
 stir_the_pot_event.2.t: "利比亚屈服于我们的要求"
 stir_the_pot_event.2.d: "由于面临澳大利亚干预的威胁，[LBA.GetLeader]已同意在利比亚内战期间在其领空设立“禁飞区”。此举有望将平民伤亡降至最低，并防止冲突蔓延至邻国。"
 stir_the_pot_event.2.a: "现实政治的体现。"
 stir_the_pot_event.3.t: "利比亚拒绝了我们的请求"
 stir_the_pot_event.3.d: "尽管平民伤亡持续不断，[LBA.GetLeader]仍拒绝了我们要求在利比亚领空设立“禁飞区”的请求。他们持续不断的内战将继续对该地区人民构成威胁，而且冲突蔓延至邻国的风险也在不断增加。现在，如何坚持我们的诉求，取决于我们自己。"
 stir_the_pot_event.3.a: "他们知道另一种选择。"
 myanmar_intervention_gillard.1.t: "澳大利亚要求开展维和合作"
 myanmar_intervention_gillard.1.d: "澳大利亚政府向我们提出要求，希望允许他们的维和部队进入我国，协助我们应对当前的叛乱危机。我们当然欢迎他们的帮助，但是他们的条件实际上是要让我们成为他们政府的政治附庸国，直到危机解除为止——而他们并未明确说明危机何时结束。他们似乎铁了心要强制执行这一要求，甚至认为如果我们拒绝，军事入侵也并非不可能。"
 myanmar_intervention_gillard.1.a: "绝对不是。"
 myanmar_intervention_gillard.1.b: "我们别无选择。"
 myanmar_intervention_gillard.2.t: "缅甸接受条款"
 myanmar_intervention_gillard.2.d: "面对日益严重的叛乱威胁，[BRM.GetLeader]已同意派遣维和部队进入马来西亚以遏制危机。我军一支相当规模的部队即将开始占领行动。这最终将是反恐斗争中的一次重大胜利。"
 myanmar_intervention_gillard.2.a: "这是为了他们好。"
 myanmar_intervention_gillard.3.t: "缅甸拒绝维和条款"
 myanmar_intervention_gillard.3.d: "尽管我方代表团与马来西亚方面关系良好，但[BRM.GetLeader]断然拒绝了我方提出的协助打击日益严重的叛乱危机的提议。该国局势持续恶化，濒临崩溃，极有可能成为恐怖组织的温床。鉴于事态可能恶化到何种程度，我们的应对措施必须与所面临的危险程度相称。"
 myanmar_intervention_gillard.3.a: "制裁他们，迫使他们合作。"
 myanmar_intervention_gillard.3.b: "我们必须介入。"
 ast_myanmar_intervention_rejection_outcomes_tt: "如果缅甸拒绝，澳大利亚可能会实施制裁和禁运，或者准备发动以扶植傀儡为目标的战争。"
 reconciliation_discontent: "和解与不满"
 reconciliation_discontent_desc: "澳大利亚原住民的生活始终处于一种根深蒂固的劣势之中。尽管马博案重燃了许多人的希望，但过去十年来政府领导层的漠不关心，几乎磨灭了仅存的希望，如今真正从中受益的人更是寥寥无几。只有一小部分人仍在呼吁政府做出迫切的改变。"
 reform_despair_ast: "和解的绝望"
 reform_despair_ast_desc: "如果没有改变的希望，和解的精神就会被扼杀。澳大利亚原住民继续生活在没有保障的未来的边缘，许多其他人对我们的政策方向感到失望。现在我们国家的人人平等感觉遥不可及。我们可以预期心怀不满的选民未来会支持更激进的运动。"
 rekindled_hope_ast: "重燃的希望"
 rekindled_hope_ast_desc: "许多澳大利亚人如释重负。国家正以虽小但可衡量的方式走向疗愈。尽管前路漫漫，但通往疗愈的道路已变得轻松许多。更多需要帮助的人获得了机会。工作场所和学校变得更加团结，也更加支持所有澳大利亚人。如今，整个社会都满怀希望地展望未来。"
 economic_radical: "经济激进派"
 john_howard: "约翰·霍华德"
 the_rba_ast: "澳大利亚储备银行"
 the_rba_ast_desc: "澳大利亚储备银行是我们的中央银行，也是发行纸币的权威机构。这意味着他们实际上控制着利率。如果我们奉行合理的政策，降低支出和失业率，他们也会配合我们。"
 work_for_the_dole: "以工代赈"
 work_for_the_dole_desc: "该项目旨在培训参与者，并在他们有能力的情况下安排他们为当地社区服务。在继续接受培训的同时，他们将继续获得工作收入支持。"
 work_for_the_dole_2: "以工代赈"
 work_for_the_dole_2_desc: "该项目旨在培训参与者，并在他们有能力的情况下安排他们为当地社区服务。在工作期间，他们将继续获得收入支持，同时我们也将继续为他们提供培训。随着项目的不断发展，我们已将一些州政府建设项目的工作岗位纳入了就业机会范围，以协助我们的建设工作。"
 baby_bonus_idea_ast: "婴儿奖金"
 baby_bonus_idea_ast_desc: "该计划旨在减轻新手父母养育子女的负担。每位符合条件的子女的父母将获得3000澳元的补助。此举有望鼓励更多人生育子女，从而缓解澳大利亚人口老龄化问题。"
 negative_gearing_tooltip_tt: "这会严重损害我们与§Y土地所有者§!的关系以及我们的连任机会，但或许能防止未来出现住房危机。"
 tafe_investment: "对技术与继续教育学院的投资"
 signed_the_kyoto_protocol_ast: "签署了《京都议定书》"
 kyoto_protocol_ast: "京都协议"
 kyoto_protocol_ast_desc: "该议定书最初于1997年被其他国家采纳，并根据最新的全球变暖科学共识，成为各行业减少温室气体排放的指导方针。虽然并非所有限制措施都已生效，但我们正在逐步实施，希望最终实现温室气体净零排放。"
 ast_avoid_the_speech_tt: "为了维护联盟的团结，该党将被要求保持中立。我们只能寄希望于公众对此事失去兴趣。"
