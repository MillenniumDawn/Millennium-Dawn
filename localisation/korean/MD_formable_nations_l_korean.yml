 form_PBL_category: "페루-볼리비아 연합"
 form_PBL_category_desc: "페루-볼리비아 연합은 원래 19세기 초에 잠시 존재했던 국가였습니다. 페루 공화국의 분열과 1834년, 그리고 1835년부터 1836년까지의 내전 속에서 탄생했으며 볼리비아국을 포함했습니다. 오늘날 이 논의는 미미하지만, 볼리비아와 페루 인민의 정치적 분위기 속에는 여전히 살아 숨 쉬고 있습니다. 이제 우리 인민을 위한 이 새로운 내일을 고심해 볼 때입니다."
 PBL_integrate_start: "[GetPBLNameDef] 형성 시작"
 PBL_integrate_start_desc: ""
 PBL_integrate_PRU: "[GetPBLNameAdj] [PRU.GetAdjective] 영토 통합"
 PBL_integrate_PRU_desc: "페루는 연합을 구성하는 두 국가 중 더 큽니다. 가장 큰 인구, 경제, 국토 면적을 보유하고 있습니다. 페루를 통합하는 것은 거대한 작업이지만, 이 국가를 확보하는 것은 새로운 연합의 이익을 위한 견고한 행보입니다."
 PBL_integrate_BOL: "[GetPBLNameAdj] [BOL.GetAdjective] 영토 통합"
 PBL_integrate_BOL_desc: "볼리비아는 연합을 설립한 두 핵심 국가 중 하나입니다. 국토 면적, 인구, 경제력에서 더 작은 국가이지만, 이 국가를 깎아내릴 이유는 전혀 없습니다. 산맥에는 전자 제품 및 기타 중간재 생산에 필수적인 원자재가 풍부합니다. 이 국가를 통합함으로써 이제 다각화된 우리 경제에 또 하나의 강력한 기반을 다지게 됩니다."
 PBL_integrate_WESTPAR: "서파라과이 통합"
 PBL_integrate_WESTPAR_desc: "서파라과이는 서브라질이나 북칠레만큼 풍부한 천연자원을 자랑하지는 않습니다. 하지만 이 지역은 비옥한 농경지가 풍부하며 신생 국가의 산업을 발전시킬 수 있는 광활한 부지를 제공합니다."
 PBL_integrate_WESTBRA: "서 브라질 통합"
 PBL_integrate_WESTBRA_desc: "서브라질은 원주민들의 터전이자 풍부한 자원 등을 품고 있는 곳입니다. 서브라질을 통합하면 우리 국가의 입지를 개선하고 개발 가능한 영토를 크게 넓힐 수 있을 것입니다."
 PBL_integrate_NORTHCHL: "칠레 북부 통합"
 PBL_integrate_NORTHCHL_desc: "칠레 북부 지역은 무르익은 통합 대상이며, 우리의 미래 목표를 달성하는 데 도움이 되도록 우리 영역 안으로 끌어들여야 합니다."
 PBL_update_flag: "[GetPBLNameDef] 형성 완료"
 PBL_update_flag_desc: "모든 구성 영토가 통합됨에 따라, 우리는 변혁을 완수하고 [GetPBLNameDef]을(를) 선포하며 통합된 국기와 국명을 채택할 수 있습니다."
