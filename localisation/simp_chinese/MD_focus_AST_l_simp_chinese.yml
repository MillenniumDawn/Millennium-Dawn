 literacy_progress_the_gap_ast_1: "差距持续扩大"
 closing_the_gap_event.2.t: "缩小差距的结果"
 closing_the_gap_event.2.d: "我们的扫盲和社会支持运动开展几年后，结果令人遗憾地喜忧参半。虽然入学儿童人数增加，成年人监禁人数总体下降，但寄养率和青少年犯罪率却在稳步上升。因此，我们帮助弱势澳大利亚人融入主流社会的努力似乎在某种程度上被认为是失败的。\n\n我们可以加大对该项目的投资，继续推进并可能对其进行改进，或者我们现在就可以止损，终止该项目。"
 closing_the_gap_event.2.a: "继续工作。"
 closing_the_gap_event.2.b: "关闭它"
 closing_the_gap_event.3.d: "我们的扫盲和社会支持活动开展几年后，结果令人鼓舞。入学儿童人数增加，成年人整体监禁率下降，寄养率和青少年犯罪率稳步降低。看来，我们帮助弱势澳大利亚人融入主流社会的努力确实取得了成效。"
 closing_the_gap_event.3.a: "又一次成功"
