 land_drone_equipment_tech_2: "Дрон 2005 года"
 land_drone_equipment_tech_2_desc: "Разведывательные беспилотные летательные аппараты (БПЛА) ближнего радиуса действия обеспечивают ценную разведку в режиме реального времени и позволяют формировать общую картину обстановки на поле боя. Они лёгкие и относительно удобны для переноски."
 land_drone_equipment_tech_3: "Дрон 2015"
