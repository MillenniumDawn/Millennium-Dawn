 MD_artc_exercise_operations: "Ćwiczenie poligonowe wojsk połączonych"
 MD_artc_exercise_operations_desc: "Brygady kierują się na poligon, aby przećwiczyć koncepcję operacyjną wojsk w pełnym zakresie – od fazy wyjścia do kontaktu z przeciwnikiem, przez fazę wykorzystania powodzenia, aż po uzupełnianie zapasów."
 MD_artc_ex_operations_short: "Opanowanie teorii operacyjnej w ciągu 90 dni."
 MD_artc_exercise_dedicated: "Rotacja w Ośrodku Szkolenia Bojowego"
 MD_artc_exercise_dedicated_desc: "Pododdziały odbywają rotacyjne szkolenie w ośrodku szkolenia bojowego, gdzie walczą z profesjonalnym przeciwnikiem w warunkach monitorowanych za pomocą systemów pomiarowych. Każde starcie jest szczegółowo analizowane w raportach podsumowujących działania."
 MD_artc_ex_dedicated_short: "Skoncentrowane opanowanie doktryny przez 90 dni."
 MD_artc_exercise_training: "Cykl szkolenia z użyciem ostrej amunicji"
 MD_artc_exercise_training_desc: "Bataliony realizują stopniowany program szkolenia ogniowego z użyciem ostrej amunicji – od sprawdzianu umiejętności posługiwania się bronią indywidualną aż po ćwiczenia zintegrowane na szczeblu kompanii."
 MD_artc_ex_training_short: "Mistrzostwo w treningu przez 90 dni."
 MD_artc_exercise_leadership: "Ćwiczenie stanowisk dowodzenia"
 MD_artc_exercise_leadership_desc: "Sztaby dywizji i korpusów rozwijają swoje stanowiska dowodzenia i prowadzą symulowaną kampanię. Personel sztabowy ćwiczy opracowywanie rozkazów, monitorowanie przebiegu działań oraz przekazywanie dowodzenia w warunkach presji."
 MD_artc_ex_leadership_short: "Mistrzostwo w przywództwie w 90 dni."
 MD_artc_exercise_technology: "Eksperymentalne próby siłowe"
 MD_artc_exercise_technology_desc: "Wyznaczona jednostka doświadczalna testuje w warunkach polowych nowe czujniki, sieci i uzbrojenie. Wyniki tych prób kształtują sposób, w jaki szersze struktury armii wdrażają nowe wyposażenie."
 MD_artc_ex_technology_short: "Opanowanie technologii w 90 dni."
 MD_artc_exercise_structure: "Ćwiczenie sprawdzające gotowość pododdziału"
 MD_artc_exercise_structure_desc: "Dywizje osiągają pełną gotowość bojową i są przerzucane w krótkim czasie, aby sprawdzić, jak struktura sił armii sprawdza się w warunkach szybkiego rozmieszczenia."
 MD_artc_ex_structure_short: "Opanowanie struktury w 90 dni."
 MD_artc_staff_college_name: "Wyższa Szkoła Dowodzenia i Sztabu"
 MD_artc_staff_college_short: "Każdy dowódca armii zdobywa doświadczenie, a jeden z nich może zyskać nową cechę."
 MD_artc_staff_college_cooldown: "Trwają obrady Wyższej Szkoły Dowodzenia i Sztabu"
 MD_artc_staff_college_cooldown_desc: "Oficerowie szczebla dowódczego odbywają szkolenie w akademii dowodzenia i sztabu generalnego. Kolejny kurs rozpocznie się po zakończeniu obecnego."
 MD_artc_senior_course_name: "Kurs dla Liderów Starszych"
 MD_artc_senior_course_short: "Jeden marszałek polny – lub generał, jeśli nie ma dostępnego marszałka – zyskuje poziom umiejętności."
 MD_artc_senior_course_cooldown: "Trwa kurs dla kadry kierowniczej wyższego szczebla"
 MD_artc_senior_course_cooldown_desc: "Generałowie kończą szkolenie dowódcze wyższego szczebla, przygotowujące do dowodzenia na poziomie korpusu i armii. Nowy kurs może się rozpocząć po zakończeniu tych zajęć."
 MD_artc_rnd_liaison_name: "Łącznik ds. badań i rozwoju w sektorze lądowym"
 MD_artc_rnd_liaison_short: "Zdobądź punkt przełamania na lądzie."
 MD_artc_rnd_liaison_cooldown: "Aktywny łącznik ds. badań i rozwoju w terenie"
 MD_artc_rnd_liaison_cooldown_desc: "Oficerowie wojskowi są delegowani do placówek badawczych sektora obronnego, gdzie przekładają wnioski z działań operacyjnych na wymagania dotyczące prac rozwojowych."
 MD_artc_academy_name: "Program szkolenia bojowego"
 MD_artc_academy_short: "Odblokowuje Ducha Akademii i wzmacnia ćwiczenia."
 MD_artc_academy_level_text: "Poziom [?ROOT.MD_artc_academy_level|0]/3"
 MD_artc_army_name: "Program zabezpieczenia logistycznego armii"
 MD_artc_army_short: "Odblokowuje Ducha Armii."
 MD_artc_army_level_text: "Poziom [?ROOT.MD_artc_army_level|0]/3"
 MD_artc_command_name: "Program szkoleniowy dowodzenia misją"
 MD_artc_command_short: "Odblokowuje polecenie Duch Podziału."
 MD_artc_command_level_text: "Poziom [?ROOT.MD_artc_command_level|0]/3"
 MD_artc_academy_1: "Centrum Szkolenia Bojowego I"
 MD_artc_academy_1_desc: "Stały ośrodek szkolenia bojowego, dysponujący dedykowanym przeciwnikiem, zapewnia każdej brygadzie wymagający cykl szkoleniowy przed uzyskaniem statusu gotowości."
 MD_artc_academy_2: "Ośrodek Szkolenia Bojowego II"
 MD_artc_academy_2_desc: "$MD_artc_academy_1_desc$"
 MD_artc_academy_3: "Ośrodek Szkolenia Bojowego III"
 MD_artc_academy_3_desc: "$MD_artc_academy_1_desc$"
 MD_artc_army_1: "Standardy utrzymania zdolności operacyjnej w warunkach polowych I"
 MD_artc_army_1_desc: "Wspólne standardy dotyczące utrzymania pola walki, opieki nad rannymi i dyscypliny paliwowej utrzymują formacje w dobrej kondycji pomiędzy bitwami."
 MD_artc_army_2: "Standardy utrzymania gotowości operacyjnej w warunkach polowych II"
 MD_artc_army_2_desc: "$MD_artc_army_1_desc$"
 MD_artc_army_3: "Standardy utrzymania zdolności operacyjnej w warunkach polowych III"
 MD_artc_army_3_desc: "$MD_artc_army_1_desc$"
 MD_artc_command_1: "Szkolenie dowodzenia misją I"
 MD_artc_command_1_desc: "Dowódcy i sztaby szkolą się w formułowaniu jasnego zamysłu oraz obdarzaniu podwładnych zaufaniem, by działali w oparciu o ten zamysł, co przyspiesza proces planowania w całych siłach."
