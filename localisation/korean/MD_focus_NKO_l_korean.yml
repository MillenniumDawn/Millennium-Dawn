 Kim_Jong_il_Death: "김정일의 죽음"
 Kim_Jong_il_Death_desc: "The beloved Great Leader, the General Secretary of the Workers' Party of Korea and Chairman of the National Defence Commission, Kim Jong-il, died at 8.30 a.m. on 17 December 2011 of acute myocardial infarction complicated by cardiogenic shock while on his way to visit a local area by train."
 NKO_scale_back_spending_idea: "정부 지출 축소"
