 EH_electric_trap_remove_country_resource_cost_tungsten_TT: "§YУдаление этой ловушки вернёт §G1 технологический металл§!.§!"
 EH_battlefield_adaptation_idea_TT: "§YДобавляет модификатор «Адаптация к полю боя»§!\n§YБонусы растут на §G+2%§! каждый месяц, пока не достигнут §G+12%§!.§!\n§YДействует до выполнения условий фокуса.§!"
 EH_any_spysat_launched: "Запущен хотя бы один спутник §YSPYSAT§!."
 EH_any_gnss_launched: "Запущен хотя бы один спутник §YGNSS§!."
 EH_any_controlled_state_3100_to_any_portal_TT: "Любой регион, контролируемый §Y[ROOT.GetNameWithFlag]§! или союзником, находится не далее §Y3100 км§! от любого §Rпортала§!."
