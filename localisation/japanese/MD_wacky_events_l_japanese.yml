l_japanese:
 MD_wacky.1.t: "An Unregistered Contact on Christmas Eve"
 MD_wacky.1.d: "Air defence tracked a low, slow contact crossing the border shortly after midnight and engaged it without warning. The recovery team reports a sleigh, nine reindeer, and a very large sack of wrapped parcels."
 MD_wacky.1.a: "Classify the wreckage."
 MD_wacky.1.b: "Apologise to the children."
 MD_wacky.2.t: "Unidentified Object Over the Capital"
 MD_wacky.2.d: "Thousands of people photographed a silent triangular light holding position above the government district for eleven minutes. The air force insists its radars tracked nothing at all."
 MD_wacky.2.a: "Scramble the interceptors."
 MD_wacky.2.b: "Announce that it was a weather balloon."
 MD_wacky.3.t: "Space Debris Lands in the Ministry Car Park"
 MD_wacky.3.d: "A titanium fuel tank from a defunct communications satellite came down overnight, flattening three official vehicles and a hedge. Nobody was hurt, and no space agency will admit whose satellite it was."
 MD_wacky.3.a: "Bill the launching state."
 MD_wacky.3.b: "Put it in a museum."
 MD_wacky.4.t: "Vending Machines Take Down the Ministry Network"
 MD_wacky.4.d: "The interior ministry spent a week hunting a foreign cyber attack before the technicians traced the traffic to the building's own smart vending machines, which had been quietly reordering fizzy drinks in an infinite loop."
 MD_wacky.4.a: "Unplug every machine in the building."
 MD_wacky.4.b: "Let the press believe it was a foreign power."
 MD_wacky_events: "Wacky Incident"
 MD_wacky_classified_intercept: "Classified Intercept"
 MD_wacky_classified_intercept_desc: "The engagement appears in no published log, and the crews involved have been instructed never to discuss the shape of the target. The gun camera footage is, however, excellent training material."
 MD_wacky_ufo_conspiracy: "The Weather Balloon Explanation"
 MD_wacky_ufo_conspiracy_desc: "Nobody believes the official statement. Two rival citizens' committees now publish competing photographic analyses, and a broadcaster has commissioned a documentary about the government's silence."
 MD_wacky_debris_exhibit: "Reentry Debris Exhibit"
 MD_wacky_debris_exhibit_desc: "The fuel tank stands in a national museum beside a photograph of the three vehicles it landed on. Attendance is up, and an unusual number of visiting schoolchildren now say they intend to study engineering."
 MD_wacky_phantom_cyber_threat: "The Phantom Cyber Threat"
 MD_wacky_phantom_cyber_threat_desc: "The ministry never corrected the story about a foreign intrusion, and the emergency network security budget was approved without a single question. The vending machines have been removed from the building."