l_simp_chinese:
 Commonwealth_member_modifier: "英联邦成员"
 CMW_Leaving.1.t: "[FROM.GetName]已退出英联邦"
 CMW_Leaving.1.d: "[FROM.GetName]已正式宣布退出英联邦。此举标志着其外交政策的重大转变，反映出其寻求更大自主权和建立新的国际联盟的愿望。退出英联邦可能会影响英联邦内部的外交关系和经济联系，给退出国和剩余成员国都带来新的挑战和机遇。"
 CMW_Leaving.1.a: "祝你好运"
 Commonwealth_member_modifier_desc: "作为英联邦成员国，我国受益于与其他成员国之间牢固的外交关系和经济合作。这一历史悠久的联盟为我们提供了一个互助互惠、共享价值观的网络，提升了我们的国际地位和贸易机遇。然而，如何在维护国家主权与维护英联邦集体利益之间取得平衡，有时也会带来外交和政治上的挑战。"
 CMW_member_eng_influence_tt: "[ENG.GetNameWithFlag] $foreign_influence_modifier$：§G+10%§!"