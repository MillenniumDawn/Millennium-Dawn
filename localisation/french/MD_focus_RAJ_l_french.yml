 indian_event.53.b: "L’Inde n’est pas notre option."
 indian_event.54.t: "Proposition de diviser les sphères d'influence en Afghanistan"
 indian_event.54.d: "Comme nous sommes désormais alliés de l’Inde, la question de la création d’un lien terrestre entre nos pays en divisant les sphères d’influence en Afghanistan se pose. La proposition est très tentante, car elle nous permet d’élargir notre sphère d’influence et de renforcer notre position dans le monde."
