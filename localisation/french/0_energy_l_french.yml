 ENERGY_POLICY_AUTOMATION_SHORT: "Auto"
 ENERGY_POLICY_AUTOMATION_TT: "§YPolitique de consommation automatique§!\nAjuste automatiquement la politique de consommation d'un cran lors de la mise à jour énergétique hebdomadaire. Elle renforce les restrictions sous §R95 %§! de satisfaction nette durable, et les assouplit ou augmente la consommation au-dessus de §G110 %§!. Une consommation supplémentaire exige que le stockage par batteries soit au moins §Yplein à 95 %§!, sauf s'il n'existe aucune capacité de stockage. Les importations d'énergie et les exportations engagées sont prises en compte, les retraits de batteries exclus. Choisir une politique manuellement désactive l'automatisation."
