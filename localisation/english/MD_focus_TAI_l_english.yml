 TAI_pc_industry_events.6.t: "ASUS Creates Republic of Gamers"
 TAI_pc_industry_events.6.d: "ASUS already leads in motherboards, but the Republic of Gamers label offers a distinct enthusiast identity that can connect components, notebooks, and premium systems. The company can cultivate that identity, defend its board leadership, or push immediately toward mass-market complete systems."
