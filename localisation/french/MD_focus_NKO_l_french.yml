 korea_peninsula_reunited: "§YLa péninsule coréenne est §Gréunifiée§!!§!"
 NKO_foreign_knowhow: "Savoir-faire étranger"
 NKO_hermit_kingdom: "Royaume de l'Ermite"
 NKO_hermit_kingdom_desc: "La Corée du Nord est un État isolé depuis sa création. Bien qu'elle soit l'un des pays les plus pauvres du monde, elle parvient néanmoins à entretenir l'une des plus grandes armées au monde. La famille Kim est au pouvoir depuis plus de 50 ans avec pratiquement aucune opposition interne. Le royaume ermite de Corée du Nord est une anomalie inexplicable parmi les nations.\n\n§RCet esprit national sera retiré si la famille Kim n'est plus au pouvoir !§!"
 NKO_international_assistance: "§YAccepter l'aide humanitaire internationale§!"
 NKO_international_assistance_desc: "\"Les Nord-Coréens sont ouvert à l'aide humanitaire étrangères\"."
 NKO_solve_the_arduous_march_desc: "La Marche Ardue a lourdement pesé sur notre nation. Pour assurer l'avenir de notre peuple, nous devons mettre en œuvre des mesures stratégiques pour surmonter cette période difficile et conduire notre pays vers la prospérité. Cela inclut l'amélioration de la production agricole, la sécurisation de l'aide humanitaire et la réforme de nos politiques internes pour garantir stabilité et croissance."
 NKO_promote_songun: "Promouvoir le Songun"
 NKO_promote_songun_desc: "La politique Songun, ou 'l'armée d'abord', priorise l'Armée populaire de Corée dans nos affaires politiques et économiques. En promouvant le Songun, nous assurons la sécurité de notre nation et renforçons le rôle militaire dans la protection de notre souveraineté et la construction socialiste."
 NKO_humanitarian_aid: "Aide humanitaire"
 NKO_humanitarian_aid_desc: "En ces temps difficiles, accepter l'aide humanitaire d'organisations internationales et de nations amies fournira des ressources vitales pour soulager les souffrances de notre peuple. Cette aide sera gérée avec soin pour atteindre ceux dans le besoin et soutenir nos efforts de relèvement."
 NKO_food_production_boost: "Augmenter la production alimentaire"
 NKO_food_production_boost_desc: "Augmenter la production alimentaire est essentiel pour le bien-être de nos citoyens. En investissant dans les technologies agricoles, en améliorant les systèmes d'irrigation et en soutenant nos agriculteurs, nous pouvons accroître les rendements et assurer une alimentation stable."
 NKO_healthcare_reform: "Réforme du système de santé"
 NKO_healthcare_reform_desc: "Réformer notre système de santé est crucial pour améliorer la santé et la productivité de notre peuple. Nous moderniserons les installations médicales, formerons des professionnels et garantirons l'accès aux médicaments essentiels."
 NKO_punish_corruption: "Punir la corruption"
 NKO_punish_corruption_desc: "La corruption sape nos principes socialistes et entrave le progrès national. Nous lancerons une campagne rigoureuse pour identifier, exposer et punir les officiels corrompus, garantissant transparence et intégrité."
 NKO_agricultural_funding: "Financement agricole"
 NKO_agricultural_funding_desc: "Financer notre secteur agricole améliorera la sécurité alimentaire et les moyens de subsistance ruraux. Nous nous concentrerons sur la mécanisation, les semences améliorées et les techniques agricoles."
 NKO_fertiliser_factory: "Usine d'engrais"
 NKO_fertiliser_factory_desc: "Construire une usine d'engrais moderne améliorera la fertilité des sols et les rendements. Cette investissement fournira aux agriculteurs les ressources nécessaires."
 NKO_nutrition_programs: "Programmes nutritionnels"
 NKO_nutrition_programs_desc: "Mettre en œuvre des programmes nutritionnels nationaux combattra la malnutrition et améliorera la santé publique, en particulier pour les enfants et les populations vulnérables."
 NKO_acquiesce_jangmadang: "Acquiescer aux Jangmadang"
 NKO_acquiesce_jangmadang_desc: "Reconnaissant l'importance des marchés noirs (Jangmadang), nous autoriserons leurs opérations sous conditions régulées pour stimuler l'économie."
 NKO_bureau_39: "Bureau 39"
 NKO_bureau_39_desc: "Le Bureau 39 génère des devises fortes pour le régime. Le renforcer améliorera nos capacités économiques."
 NKO_admit_the_donju: "Reconnaître les Donju"
 NKO_admit_the_donju_desc: "Les Donju, entrepreneurs riches, jouent un rôle économique clé. En intégrant leurs ressources, nous exploiterons leur potentiel pour le développement national."
 NKO_government_directed_drug_manufacture: "Production pharmaceutique dirigée par l'État"
 NKO_government_directed_drug_manufacture_desc: "Produire des médicaments sous contrôle étatique créera de nouvelles sources de revenus pour les projets nationaux."
 NKO_smuggling_operations: "Piratage de banques étrangères"
 NKO_smuggling_operations_desc: "Utiliser nos hackers pour infiltrer les systèmes bancaires ennemis et soutenir notre économie."
 NKO_counterfeit_production: "Production de contrefaçons"
 NKO_counterfeit_production_desc: "Produire des contrefaçons (monnaie, articles de luxe) générera des devises fortes, en toute discrétion."
 NKO_huichon: "Huichon"
 NKO_huichon_desc: "Développer la ville industrielle de Huichon renforcera notre capacité manufacturière."
 NKO_huichon_hydroelectric_power: "Énergie hydroélectrique à Huichon"
 NKO_huichon_hydroelectric_power_desc: "Construire des centrales hydroélectriques à Huichon améliorera notre sécurité énergétique."
 NKO_manpo_line_railway: "Ligne ferroviaire Manpo"
 NKO_manpo_line_railway_desc: "Construire cette ligne améliorera les transports et la logistique nationale."
 NKO_coal_energy_supermacy: "Suprématie du charbon"
 NKO_coal_energy_supermacy_desc: "Se concentrer sur l'énergie charbonnière assurera un approvisionnement énergétique fiable."
 NKO_ordnance_manufacture: "Production d'armements"
 NKO_ordnance_manufacture_desc: "Améliorer nos capacités de production d'armements est crucial pour la défense nationale."
 NKO_huichon_hard_glassware_factory: "Usine de verre à Huichon"
 NKO_huichon_hard_glassware_factory_desc: "Cette usine fournira des matériaux de qualité pour diverses applications industrielles."
 NKO_huichon_silk_mill: "Filature de soie à Huichon"
 NKO_huichon_silk_mill_desc: "Construire une filature de soie soutiendra notre industrie textile et créera des emplois."
 NKO_huichon_machine_tool_factory: "Usine d'outils machines à Huichon"
 NKO_huichon_machine_tool_factory_desc: "Cette usine renforcera nos capacités manufacturières en produisant des machines essentielles."
 NKO_bureau_38: "Bureau 38"
 NKO_bureau_38_desc: "Ce bureau gère les ressources de l'État. Le renforcer optimisera l'allocation des ressources."
 NKO_sanction_evasions: "Contournement des sanctions"
 NKO_sanction_evasions_desc: "Mettre en œuvre des stratégies sophistiquées pour contourner les sanctions internationales soutiendra notre économie."
 NKO_international_black_market: "Bureau 121"
 NKO_international_black_market_desc: "Le Bureau 121 est une agence nord-coréenne de cyberguerre, et la principale unité du Bureau général de reconnaissance de l'armée nord-coréenne. Il mène des opérations cyber offensives, y compris l'espionnage et la criminalité financière facilitée par le cyber. Selon les autorités américaines, le RGB gère les opérations clandestines et compte six bureaux."
 NKO_technological_boost: "Impulsion technologique"
 NKO_technological_boost_desc: "Investir dans la technologie stimulera l'innovation et la croissance économique."
 NKO_purchase_stolen_tech_blueprint: "Acheter des plans technologiques volés"
 NKO_purchase_stolen_tech_blueprint_desc: "Acquérir des plans technologiques volés accélérera notre recherche et développement."
 NKO_bribe_researchers_at_institues: "Corrompre des chercheurs"
 NKO_bribe_researchers_at_institues_desc: "Soudoyer des chercheurs dans des instituts clés accélérera nos progrès technologiques."
 NKO_black_market_innovation: "Innovation par le marché noir"
 NKO_black_market_innovation_desc: "Exploiter l'ingéniosité du marché noir renforcera nos capacités technologiques."
 NKO_national_recovery_plan: "Plan de relèvement national"
 NKO_national_recovery_plan_desc: "Ce plan stabilisera et renforcera notre économie en reconstruisant les infrastructures, en relançant les industries et en assurant le bien-être social."
 NKO_emphasis_self_reliance: "Accent sur l'autosuffisance"
 NKO_emphasis_self_reliance_desc: "Se concentrer sur l'autosuffisance réduira notre dépendance aux importations et à l'aide étrangère."
 NKO_financial_sector_reform: "Réforme du secteur financier"
 NKO_financial_sector_reform_desc: "Réformer ce secteur améliorera la stabilité économique grâce à des institutions et régulations renforcées."
 NKO_modernization_efforts: "Efforts de modernisation"
 NKO_modernization_efforts_desc: "Moderniser nos industries augmentera la productivité et l'efficacité."
 NKO_renewable_energy_initiatives: "Initiatives d'énergie renouvelable"
 NKO_renewable_energy_initiatives_desc: "Investir dans les énergies renouvelables assurera un développement durable."
 NKO_labor_force_training: "Formation de la main-d'œuvre"
 NKO_labor_force_training_desc: "Former notre main-d'œuvre améliorera les compétences et la productivité."
 NKO_50k_housing_project: "Projet de 50 000 logements"
 NKO_50k_housing_project_desc: "Construire 50 000 logements résoudra la pénurie de logements et stimulera l'industrie du bâtiment."
 NKO_mansudae_peoples_theatre: "Théâtre du Peuple de Mansudae"
 NKO_mansudae_peoples_theatre_desc: "Construire ce théâtre enrichira notre vie culturelle et célébrera notre héritage."
 NKO_rare_metal_exploitation: "Exploitation des métaux rares"
 NKO_rare_metal_exploitation_desc: "Exploiter ces métaux fournira des matériaux critiques pour nos industries."
 NKO_focus_on_quality: "Se concentrer sur la qualité"
 NKO_focus_on_quality_desc: "Améliorer la qualité de nos produits garantira qu'ils répondent aux normes internationales."
 NKO_light_industry_development: "Développement de l'industrie légère"
 NKO_light_industry_development_desc: "Développer ce secteur diversifiera notre économie."
 NKO_modern_mining_operations: "Opérations minières modernes"
 NKO_modern_mining_operations_desc: "Moderniser nos mines augmentera l'efficacité et la production."
 NKO_resource_extraction: "Extraction des ressources"
 NKO_resource_extraction_desc: "Se concentrer sur l'extraction assurera un approvisionnement stable en matériaux essentiels."
 NKO_industrial_modernization: "Modernisation industrielle"
 NKO_industrial_modernization_desc: "Moderniser nos industries augmentera la productivité et l'efficacité."
 NKO_victory_of_juche_revolution: "Victoire de la révolution Juche"
