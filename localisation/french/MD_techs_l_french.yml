 SPYSAT1: "SRcon 1965"
 SPYSAT1_desc: "Satellites militaires ou de renseignement conçus pour mener une gamme variée de missions, allant de la collecte de renseignements à la détection d'engins nucléaires.\n\nSatellite de Reconnaissance (SRcon 1965):\nLe §Y$SPYSAT1$§! est un satellite de reconnaissance avec une résolution d'image de §Y5 m GSD§!. Ils sont nécessaires pour un système de satellite de reconnaissance de §Y5 m GSD§!.\n§YGSD§! - §YRésolution au sol§!: le GSD est la distance entre les centres de pixels mesurée au sol. Pour ce satellite, les emplacements d'image des pixels adjacents sont espacés de 5 m au sol."
