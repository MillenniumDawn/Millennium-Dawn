 BRI_apply_named_PORT: "신청: §Y[THIS.GetBRINextProjectPORT]§!"
 BRI_apply_named_PORT_desc: "베이징에 §Y[THIS.GetBRINextProjectPORT]§! 건설을 청원합니다. 신청에는 정치력 30이 듭니다. 승인되면 국고에서 §Y40§!을 지불하거나 중국의 대출을 받습니다. 해안 주와 평화 상태가 필요합니다."
 BRI_apply_named_RAIL: "신청: §Y[THIS.GetBRINextProjectRAIL]§!"
 BRI_apply_named_RAIL_desc: "베이징에 §Y[THIS.GetBRINextProjectRAIL]§! 건설을 청원합니다. 신청에는 정치력 30이 듭니다. 승인되면 국고에서 §Y40§!을 지불하거나 중국의 대출을 받습니다. 중국과의 국경 또는 유효한 일대일로 제휴, 그리고 평화 상태가 필요합니다."
 BRI_apply_named_PIPELINE: "신청: §Y[THIS.GetBRINextProjectPIPELINE]§!"
 BRI_apply_named_PIPELINE_desc: "베이징에 §Y[THIS.GetBRINextProjectPIPELINE]§! 건설을 청원합니다. 신청에는 정치력 35가 듭니다. 승인되면 국고에서 §Y40§!을 지불하거나 중국의 대출을 받습니다. 석유, 강철 또는 귀금속 매장지와 평화 상태가 필요합니다."
 BRI_apply_named_TELECOM: "신청: §Y[THIS.GetBRINextProjectTELECOM]§!"
 BRI_apply_named_TELECOM_desc: "베이징에 §Y[THIS.GetBRINextProjectTELECOM]§! 건설을 청원합니다. 신청에는 정치력 25가 듭니다. 승인되면 국고에서 §Y40§!을 지불하거나 중국의 대출을 받습니다. 평화 상태가 필요합니다. 서방 진영 국가는 감시를 받습니다."
 BRI_apply_named_SEZ: "신청: §Y[THIS.GetBRINextProjectSEZ]§!"
 BRI_apply_named_SEZ_desc: "베이징에 §Y[THIS.GetBRINextProjectSEZ]§! 건설을 청원합니다. 신청에는 정치력 40이 듭니다. 승인되면 국고에서 §Y40§!을 지불하거나 중국의 대출을 받습니다. 공장 4개 초과와 평화 상태가 필요합니다."
 BRI_apply_named_MINE: "신청: §Y[THIS.GetBRINextProjectMINE]§!"
 BRI_apply_named_MINE_desc: "베이징에 §Y[THIS.GetBRINextProjectMINE]§! 건설을 청원합니다. 신청에는 정치력 30이 듭니다. 승인되면 국고에서 §Y40§!을 지불하거나 중국의 대출을 받습니다. 귀금속, 기술 금속, 경금속 또는 강철 매장지와 평화 상태가 필요합니다."
