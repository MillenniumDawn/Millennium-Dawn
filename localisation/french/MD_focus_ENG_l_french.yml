 ENG_finalize_scottish_union_settlement: "Finalise the Scottish Settlement"
 ENG_finalize_scottish_union_settlement_desc: "Three settlements have now carried in Scotland, and the mandate that the separatist parties once called impossible to assemble is complete. What remains is the formal act: writing the result into statute, standing down the referendum machinery for good, and striking Scotland's outstanding cores from the record so there is no ambiguity left for a future government to exploit. Holyrood keeps its institutions, but the constitutional question the devolution settlement left open in 1998 is closed."
 ENG_finalize_north_irish_union_settlement: "Finalise the Northern Irish Settlement"
 ENG_finalize_north_irish_union_settlement_desc: "Three settlements have now carried in Northern Ireland, and the mandate republican politics once called impossible to assemble is complete. What remains is the formal act: writing the result into statute, standing down the border poll machinery for good, and striking Northern Ireland's outstanding cores from the record so there is no ambiguity left for a future government to exploit. Stormont keeps its institutions, but the constitutional question the Good Friday settlement left open is closed."
 ENG_finalize_welsh_union_settlement: "Finalise the Welsh Settlement"
 ENG_finalize_welsh_union_settlement_desc: "Three settlements have now carried in Wales, and the mandate the Senedd's independence wing once called impossible to assemble is complete. What remains is the formal act: writing the result into statute, standing down the referendum machinery for good, and striking Wales's outstanding cores from the record so there is no ambiguity left for a future government to exploit. The Senedd keeps its institutions, but the constitutional question the devolution settlement left open is closed."