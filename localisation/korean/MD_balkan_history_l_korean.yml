l_korean:
 balkan_news.1.t: "카라지치, 집단 학살 혐의 유죄 판결"
 balkan_news.1.d: "헤이그 재판소는 스레브레니차 집단 학살 및 보스니아 전역에서의 인도에 반하는 죄로 라도반 카라지치에게 유죄를 선고하고 징역 40년을 구형했습니다. 데이턴 협정으로부터 20년이 지난 지금, 이 전시 보스니아 세르비아인 지도자는 자신의 전쟁이 만들어낸 바로 그 법정에서 심판을 받았습니다."
 balkan_news.1.a: "사라예보에 판결이 울려 퍼진다"
 balkan_news.1.b: "누군가는 전세르비아인을 향한 판결이라 말할 것 같군"
 balkan_news.1.c: "정의다. 지연된,"
 balkan_news.2.t: "카라지치, 종신형 선고"
 balkan_news.2.d: "항소심 재판부는 라도반 카라지치의 항소를 기각하고 원심의 징역 40년은 그가 저지른 범죄의 중대성에 비추어 부적절하다고 판단하여 종신형으로 형량을 상향했습니다. 이는 전쟁 내내 스릅스카 공화국을 이끌었던 사내에 대한 최종 판결입니다."
 balkan_news.2.a: "헤이그, 사건 종결"
 balkan_news.3.t: "믈라디치, 집단 학살 혐의 유죄 판결"
 balkan_news.3.d: "재판소는 라트코 믈라디치에게 집단 학살, 전쟁 범죄 및 인도에 반하는 죄로 유죄를 선고하고 종신형을 구형했습니다. 이 전직 장군은 판사들에게 고함을 지르다 선고 낭독이 끝나기도 전에 법정에서 끌려 나갔습니다. 스레브레니차에서는 죽은 이들의 어머니들이 말없이 지켜보고 있었습니다."
 balkan_news.3.a: "장군이 마침내 죗값을 치르는군"
 balkan_news.4.t: "법정에서의 자살"
 balkan_news.4.d: "판사들이 그의 20년 형을 확정한 직후, 보스니아 크로아티아계 장군 슬로보단 프랄랴크는 자신이 전범이 아니라고 선언한 뒤 카메라 앞에서 독극물을 마셨습니다. 그는 몇 시간 만에 사망했습니다. 항소심 재판부는 자그레브까지 뻗어있는 공동의 범죄 계획을 확인하며 전 헤르체그보스니아 지도자 6명 전원에게 유죄 판결을 확정했습니다."
 balkan_news.4.a: "법정의 정의를 거부했군"
 balkan_news.4.b: "재판소의 마지막 사건이 맞은 참혹한 결말"
 balkan_news.5.t: "믈라디치의 항소 기각"
 balkan_news.5.d: "유엔 판사들은 라트코 믈라디치의 집단 학살 유죄 판결과 종신형을 확정하며 보스니아 전쟁에서 비롯된 마지막 주요 사건을 종결지었습니다. 스레브레니차 학살로부터 25년이 지난 지금, 이 전쟁에 대한 사법적 단죄는 마무리되었습니다. 하지만 정치적 단죄는 아직 끝나지 않았습니다."
 balkan_news.5.a: "기록 보관소가 닫히는군"
 CRO_nat_populism_gain_tt: "§R우익 민족주의 세력이 지지를 얻습니다.§!"
 balkan_news.6.t: "세르비아 세계 선언"
 balkan_news.6.d: "베오그라드와 바냐루카가 세르비아-스릅스카 공화국 협력을 위한 상설 최고위원회를 통해 세르비아의 영토들을 하나로 통합한다는 내용의 13쪽짜리 선언문을 공동 채택했습니다. 이는 법적 구속력은 부족하지만 다분히 의도적입니다."
 balkan_news.6.a: "가치 있는 후원자이다"
 balkan_news.6.b: "사라예보의 권위가 더욱 약화되는군"
 balkan_news.6.c: "이웃 나라의 소식이다"
 balkan_news.7.t: "유럽연합군 병력 증강"
 balkan_news.7.d: "러시아 전차가 우크라이나 국경을 넘은 지 며칠 만에, EU는 불안정이 역내로 번지는 것을 방지하기 위해 예비군을 공수하여 보스니아 헤르체고비나에 주둔 중인 유럽연합군 알테아(Althea) 수비대 병력을 약 두 배로 증강했습니다."
 balkan_news.7.a: "결연한 의지를 보여주어 안심이 되는군"
 balkan_news.7.b: "다른 곳에서 취해진 예방 조치이다"
 balkan_news.8.t: "에르도안, 사라예보에서 유세 개최"
 balkan_news.8.d: "서유럽 전역에서 선거 운동이 금지된 에르도안이 이번 선거의 유일한 유럽 유세를 사라예보에서 개최하여, 수천 명을 모으고 민주행동당(SDA)의 바키르 이제트베고비치와 만났습니다. 도디크는 이를 두고 내정 간섭이라 부릅니다."
 balkan_news.8.a: "사라예보는 의지할 수 있는 친구이군"
 balkan_news.8.b: "남의 나라에서 벌어지는 유세이다"
 balkan_news.9.t: "라브로프의 사라예보 방문"
 balkan_news.9.d: "세르게이 라브로프가 사라예보를 방문했으며, 공항에서는 오직 도디크만이 그를 맞이했습니다. 행사를 위해 게양된 보스니아 국기는 없었습니다. 그는 루한스크를 기원으로 하는 수백 년 된 정교회 성화상을 받아 들고 떠났으며, 키이우는 이 선물에 대한 해명을 요구하고 있습니다."
 balkan_news.9.a: "스릅스카 공화국만의 독자적인 대외 정책이다"
 balkan_news.9.b: "여느 때와 다를 바 없는 방문이군"