l_korean:
 STALKER.100.t: "꺼져, 스토커"
 STALKER.100.d: "코돈 검문소의 한 징집병이 스토커에게 꺼지라고 소리치는 모습이 영상에 찍혔습니다. 이 영상은 온 나라에 퍼졌고, 이제 국민 절반이 버스 정류장에서 서로에게 그 말을 건넵니다."
 STALKER.100.a: "모병 포스터에 넣자."
 STALKER.100.b: "검문소에는 고함을 줄이고 순찰을 늘리라고 일러두자."
 STALKER.100.b_tt: "구역의 §Y봉쇄도§!가 §G2§! 오른다."
 STALKER.101.t: "치키 브리키"
 STALKER.101.d: "코돈의 밴디트들이 아무도 번역하지 못하는 구호와 머릿속을 떠나지 않는 민요를 유행시켰습니다. 모병이 늘고 있습니다."
 STALKER.101.a: "이브 담케."
 STALKER.101.a_tt: "구역 내 §Y밴디트§! 영향력이 이미 §R5§! 올랐습니다."
 STALKER.102.t: "또 한 명의 스트렐록"
 STALKER.102.d: "바에 있는 한 스토커가 자신이 전설의 스트렐록라고 선언했습니다. 이번 달에만 세 번째입니다. 호기심 많은 방문객들이 누가 진짜인지 보러 모여들고 있습니다."
 STALKER.102.a: "스트렐록가 대체 몇 명이야?"
 STALKER.102.a_tt: "구역의 스토커가 이미 §Y5§!명 늘었습니다."
 STALKER.103.t: "상인의 가격 인상"
 STALKER.103.d: "코돈 벙커의 늙은 상인이 우리 과학자들에게 받는 소시지, 보드카, 방사능 해독제 값을 두 배로 올렸고, 거래할 때마다 손해라고 우긴다고 합니다."
 STALKER.103.a: "값을 치른다. 좋은 보드카는 그 사람 말고는 파는 데가 없다."
 STALKER.103.a_tt: "국고에서 §R$0.1§!십억이 빠져나간다."
 STALKER.103.b: "벙커를 폐쇄한다."
 STALKER.103.b_tt: "구역의 §Y밴디트§! 영향력이 최대 §G5§! 줄고, 그에게 의지하던 스토커가 최대 §R5§!명 줄어든다."
 STALKER.105.t: "앨리스의 인사"
 STALKER.105.d: "멍고 호수 룬넷 지대를 조사하던 탐사대가 모래 속에서 휴대전화와 목걸이를 파냈습니다. 구역이 생기기 훨씬 전에 묻혔는데도 어찌된 일인지 아직 충전이 되어 있었습니다. 마지막 영상은 한 십대 소녀가 밤중에 말라붙은 호수 바닥에서 찍은 것으로, 어둠 속에서 한 형체가 그녀를 향해 걸어옵니다. 영상을 보정하자 그 형체는 잿빛으로 물에 불은 그녀 자신의 얼굴을 하고 있었습니다. 전화기의 주인은 앨리스라는 소녀였고, 통화 기록은 2008년에 끊겨 있으며, 화면에는 보내지 않은 메시지 하나가 남아 있습니다. 안녕."
 STALKER.105.a: "영상을 보관한다. 계속 귀를 기울인다."
 STALKER.105.a_tt: "비용 없음. 사건은 계속 열려 있고, 그녀는 다시 시도할 것이다."
 STALKER.105.b: "감독하에 접촉을 허가한다."
 STALKER.105.b_tt: "§R25§! 정치력이 든다. 구역 §Y개발도§!가 §G5§!, §Y활동도§!가 §R5§! 오른다. 그녀는 이 일을 기억할 것이다."
 STALKER.105.c: "룬넷 지대를 탐사대에 폐쇄한다."
 STALKER.105.c_tt: "구역 §Y봉쇄도§!가 §G5§! 오르고 §Y개발도§!가 §R3§! 내려간다. 그녀는 이 일도 기억할 것이다."
 STALKER.106.t: "아직 인사하고 싶은 이"
 STALKER.106.d_observed: "어젯밤 증거 보관함에 있던 전화기가 울렸고, 발신자 표시에는 그 전화기 자신의 번호가 떠 있었습니다. 당직 분석관은 한 소녀가 아직 듣고 있는 사람이 있느냐고 물었다고 전합니다. 그가 그렇다고 답하자 소녀는 기뻐하는 듯했습니다."
 STALKER.106.d_contact: "감독하의 접촉 이후, 탐사대는 말라붙은 호수 안으로 이어지다 끊기는 새 발자국을 계속 발견하고 있습니다. 어젯밤 전화기에 새 영상이 녹화되었습니다. 앨리스가 우리 경계 조명의 가장자리에 서서 카메라를 향해 손을 흔들고 있습니다."
 STALKER.106.d_restricted: "룬넷 지대는 수개월째 폐쇄되어 있었지만, 전화기가 더 이상 증거 보관함에 없습니다. 순찰대가 사구 위에서 화면을 위로 한 채 녹화 중인 전화기를 발견했습니다. 새 메시지 하나가 들어 있었는데, 그저 인사하고 싶었을 뿐이라는 내용입니다."
 STALKER.106.a: "인사에 답한다."
 STALKER.106.a_tt: "구역 §Y개발도§!가 §G5§!, §Y활동도§!가 §R5§! 오른다."
 STALKER.106.b: "사건을 영원히 종결한다."
 STALKER.106.b_tt: "구역 §Y봉쇄도§!가 §G5§! 오르고 §Y활동도§!가 §G5§! 내려간다."