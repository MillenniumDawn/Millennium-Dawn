 armour_subtitle_ammo: "탄약"
 armour_subtitle_ammo_desc: "탄약에는 여러 부대의 전투 능력을 높이기 위한 개량 탄약과 전투 적재량이 포함됩니다."
 armour_subtitle_medium_tank_destroyer_chassiss: "경전차 차체"
 armour_subtitle_medium_tank_destroyer_chassiss_desc: "경전차는 주력 전차가 활동하기에 너무 제약이 많은 지형에서 우리 병력에게 화력 지원을 제공할 수 있습니다."
 AIR_TITLE_ENGINE: "엔진"
 AIR_TITLE_ENGINE_DESC: "서로 다른 성능 목표를 염두에 두고 설계된 헬리콥터 엔진입니다."
 AIR_TITLE_ATGM: "대전차 유도 미사일(ATGM)"
 AIR_TITLE_ATGM_DESC: "헬리콥터에서 발사하도록 설계된 대전차 유도 미사일입니다."
 AIR_TITLE_ANTI_INFANTRY: "기총 및 로켓"
 AIR_TITLE_ANTI_INFANTRY_DESC: "보병과 경장갑 표적을 공격하는 데 쓰이는 로켓 포드, 건 포드, 기수 장착 기관포입니다."
 AIR_TITLE_SPECIAL: "특수장비"
 AIR_TITLE_SPECIAL_DESC: "전투 능력이나 생존성을 높이기 위해 헬리콥터에 장착하는 특수 장비입니다."
 mbt_tech_ops: "장갑 차체 개발"
 mbt_tech_ops_desc: "장갑전의 초석인 이 연구는 장갑 차체의 기본 설계 원칙에 중점을 둡니다. 견고한 주력 전차 차체부터 다재다능한 보병 전투 차량과 장갑 수송차 플랫폼에 이르기까지, 이 기술은 향후 모든 장갑 차량 개발의 토대를 마련합니다. 기동성, 방호력, 적응성의 균형을 맞추어 우리 군이 기계화 작전을 위한 확고한 기반을 갖추도록 보장합니다."
 nera_armor_tech_1: "1세대 NERA"
 nera_armor_tech_1_desc: "비폭발성 반응 장갑(NERA)은 중량 티타늄 또는 열화 우라늄 삽입재를 샌드위치 구조로 사용하여 날아오는 탄을 교란합니다. 일반 복합 장갑보다 무겁고 비싸지만 훨씬 효과적입니다."
 nera_armor_tech_2: "2세대 NERA"
 nera_armor_tech_2_desc: "소재와 설계를 개선하여 성형 작약탄과 운동 에너지 관통탄에 대해 더 나은 방호력을 제공하는 개량형 비폭발성 반응 장갑(NERA)."
 nera_armor_tech_3: "3세대 NERA"
 nera_armor_tech_3_desc: "최첨단 소재와 혁신적인 구성을 활용하여 광범위한 위협에 대해 우수한 방어력을 제공하는 고급형 비폭발성 반응 장갑(NERA)."
 defensive_systems: "방어 시스템"
 defensive_systems_desc: "다양한 방어 수단을 통해 차량의 생존성을 높이는 것을 목표로 하는 기술 모음."
 defensive_systems_2: "고급 방어 시스템"
 defensive_systems_2_desc: "차량 생존성을 높이기 위한 방어 기술의 추가 발전입니다. 이 시스템은 개량된 연막 발사기와 강화된 이격 장갑을 갖추어 적의 위협에 대한 방호력을 높이고 우리 차량의 전반적인 방어 능력을 향상시킵니다."
 defensive_systems_3: "현대 방어 시스템"
 defensive_systems_3_desc: "차량 생존성을 극대화하는 최신 방어 기술입니다. 이 현대식 시스템에는 고급 연막 생성 장치, 레이저 경보 시스템, 혁신적인 이격 장갑 설계가 포함되어, 우리 병력에게 현대 전장의 광범위한 위협에 대응할 수 있는 종합적인 방어 수단을 제공합니다."
 defensive_systems_4: "최첨단 방어 시스템"
 defensive_systems_4_desc: "방어 기술의 정점으로, 우리 차량에 비할 데 없는 방호력을 제공하도록 설계되었습니다. 이 첨단 시스템은 최신 능동 방호 시스템과 전자전 능력을 갖추어 광범위한 위협에 대응하며, 현대 전장에서 우리 병력의 생존성을 보장합니다."
 defensive_systems_5: "강화 방어 시스템"
 defensive_systems_5_desc: "고급 방어 수단을 통해 차량의 생존성을 높이는 데 중점을 둔 차세대 방어 기술."
 TEL_launched_missiles_non_got: "이동식 발사대 발사 미사일"
 TEL_launched_missiles_non_got_desc: "이동식 플랫폼에서 미사일을 발사하면 적의 1차 공격 파도에 효과적으로 방어할 수 있습니다."
 SOV_module_light_helipad_1: "Ka-25/Ka-27"
 SOV_module_light_helipad_2: "Ka-27M"
 SOV_module_helipads_1: "Ka-25"
 SOV_module_helipads_3: "Ka-27M"
 SOV_module_esm_1: "'벰펠-R2' 및\nPK-16 / PK-10"
 SOV_module_esm_1_desc: "전자전 레이더 '벰펠-R2'는 작동 중인 함정 및 항공기 레이더와 미사일 유도 탐색기에서 방출되는 전파를 탐지하고 이에 대한 능동 간섭을 생성하도록 설계되었습니다.\nPK-16/PK-10은 수동 교란(다이폴 반사체 및 가짜 열 표적)을 설치하기 위한 소련의 함상 전자 교란 체계입니다.\n\n§G설계 힌트: 이 모듈은 함선의 피탐지성을 줄이고 내구도를 높이지만, 추가 건조 IC와 전략 자원이 소모됩니다.§!"
 SOV_module_esm_2: "MP-401S '스타르트-S' 및\nPK-10 / PK-2"
 SOV_module_esm_2_desc: "MP-401S '스타르트-S' 표적 지정 및 교란 복합체는 무기 탐지 및 통제 레이더와 대함 미사일 레이더를 제압하도록 설계되었습니다.\nPK-2/PK-10은 수동 교란(다이폴 반사체 및 가짜 열 표적)을 설치하기 위한 소련의 함상 전자 교란 체계입니다.\n\n§G설계 힌트: 이 모듈은 함선의 피탐지성을 줄이고 내구도를 높이지만, 추가 건조 IC와 전략 자원이 소모됩니다.§!"
 SOV_module_esm_3: "TK-25E 및\nPK-10 / PK-2"
 SOV_module_esm_3_desc: "TK-25E는 항공기 및 함상 무기 탐지·통제 레이더 기지와 대함 미사일의 레이더 유도 탐색기의 전파를 수신하고, 전파를 자동으로 분석하여 함선에 대한 공격의 가장 위험한 방향을 판별하며, 위험한 방향에 간섭을 생성하도록 설계되었습니다.\nPK-2/PK-10은 수동 교란(다이폴 반사체 및 가짜 열 표적)을 설치하기 위한 소련의 함상 전자 교란 체계입니다.\n\n§G설계 힌트: 이 모듈은 함선의 피탐지성을 줄이고 내구도를 높이지만, 추가 건조 IC와 전략 자원이 소모됩니다.§!"
 SOV_module_chain_gun: "1x2 25mm 2M-3M"
 SOV_module_chain_gun_desc: "2M-3은 소련의 자동 쌍열 25mm 함포 거치대입니다. 함선의 자위 수단이며 최대 사거리 3000 m의 경사 거리에 있는 표적을 타격할 수 있습니다.\n\n§G설계 힌트: 이 모듈은 대함 무기에 대한 방호를 개선하는 동시에 추가 내구도와 대공 능력을 제공합니다.§!"
 SOV_module_ciws_1: "1x2 30mm AK-230"
 SOV_module_ciws_1_desc: "AK-230은 소련의 완전 자동 쌍열 30mm 함포입니다. 주된 기능은 대공 방어입니다. 밀폐형 자동 포탑에 장착되며 레이더로 지향됩니다.\n\n§G설계 힌트: 이 모듈은 대함 무기에 대한 방호를 개선하는 동시에 추가 내구도와 대공 능력을 제공합니다.§!"
 SOV_module_ciws_2: "2x1 30mm AK-630"
 SOV_module_ciws_2_desc: "AK-630은 소련 및 러시아의 완전 자동 함상 회전식 기관포 근접 방어 무기 체계입니다. '630'이라는 명칭은 이 무기의 6개 포신과 30mm 구경을 가리킵니다.\n\n§G설계 힌트: 이 모듈은 대함 무기에 대한 방호를 개선하는 동시에 추가 내구도와 대공 능력을 제공합니다.§!"
