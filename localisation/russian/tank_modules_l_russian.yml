 twin_mortar_barrel_conversion: "Автоматический спаренный миномётный ствол"
 twin_mortar_barrel_conversion_desc: "Спаренный миномётный ствол способен заметно повысить скорострельность нашей артиллерии. С помощью вычислительной техники и совершенных систем наведения миномёт сможет добиться одновременного падения нескольких мин."
 event_horizon_walker_tank_module_xciws2b: "XCIWS-2B Close In Weapon System"
 event_horizon_walker_tank_module_xciws2b_desc: ""
 UKR_tank_diesel_engine_gen8: "ХКБМ 6ТД-5, 1900 л. с."
 UKR_tank_diesel_engine_gen8_desc: "ХКБМ 6ТД-5 — перспективный украинский танковый двигатель, модификация двигателя 6ТД-4 с повышенными оборотами.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели — стандартные двигатели для танков§!"
 UKR_tank_battlestation_2_thermal_desc: "1А45 «Иртыш» — советская система управления огнём (СУО), созданная для основных боевых танков. В её состав входят дневной прицел-дальномер наводчика 1Г46, баллистический вычислитель, стабилизатор вооружения и датчики входных данных (условий стрельбы)."
 UKR_spaa_missiles_2: "РК-2П"
 EQ_MOD_CAT_spaa_medium_range_missile_systems_TITLE: "§RСЗУ§!\nРакеты средней дальности"
 spaa_medium_range_missiles_1: "Ракеты средней дальности после ВМВ"
 spaa_medium_range_missiles_1_desc: "Первое поколение управляемых ракет средней дальности обеспечивает надёжный перехват на увеличенных расстояниях, сочетая дальность, точность и мощность поражения."
 spaa_medium_range_missiles_2: "Ракеты средней дальности холодной войны"
 spaa_medium_range_missiles_2_desc: "Усовершенствованные двигатели и системы наведения увеличивают дальность и точность стрельбы, позволяя этим ракетам действенно бороться с более быстрыми и манёвренными воздушными целями."
 spaa_medium_range_missiles_3: "Современные ракеты средней дальности"
 spaa_medium_range_missiles_3_desc: "Улучшенные головки самонаведения, системы управления и боевые части обеспечивают более надёжное поражение самолётов, крылатых ракет и других сложных воздушных целей."
 spaa_medium_range_missiles_4: "Усовершенствованные ракеты средней дальности"
 spaa_medium_range_missiles_4_desc: "Передовые двигатели, головки самонаведения и электроника заметно повышают дальность, точность и устойчивость к помехам, делая эти ракеты весьма эффективными против современных угроз."
 spaa_medium_range_missiles_5: "Передовые ракеты средней дальности"
 spaa_medium_range_missiles_5_desc: "Системы наведения и двигатели нового поколения дают исключительные скорость, дальность и точность, позволяя надёжно поражать даже самые совершенные воздушные цели."
 spaa_medium_range_missiles_6: "Сверхсовременные ракеты средней дальности"
 spaa_medium_range_missiles_6_desc: "Крайне совершенные головки самонаведения, двигатели и системы управления выводят ракеты средней дальности на невиданный уровень скорости, точности и боевых возможностей."
 spaa_medium_range_missiles_7: "Сверхсовременные ракеты средней дальности первого поколения"
 spaa_medium_range_missiles_7_desc: "Революционные системы наведения, двигатели и головки самонаведения обеспечивают исключительную эффективность стрельбы, позволяя справляться со всё более изощрёнными воздушными угрозами."
 spaa_medium_range_missiles_8: "Сверхсовременные ракеты средней дальности 2-го поколения"
 spaa_medium_range_missiles_8_desc: "Дальнейшие успехи в двигателях, помехозащищённости и наведении на конечном участке дают выдающиеся скорость, точность и надёжность против самых совершенных воздушных целей."
 spaa_medium_range_missiles_9: "Сверхсовременные ракеты средней дальности 3-го поколения"
 spaa_medium_range_missiles_9_desc: "Вершина развития ракет средней дальности: эти образцы сочетают предельную скорость, совершенные головки самонаведения и высочайшую точность поражения."
 UKR_hardkill_system_gen2: "СОВА-2.0"
 UKR_hardkill_system_gen2_desc: "СОВА-2.0 — современный украинский комплекс активной защиты, предназначенный для повышения живучести бронетехники при атаке противотанковых средств. Созданный как развитие более ранней системы СОВА, он сочетает улучшенные средства обнаружения и реагирования с более эффективным расположением перехватчиков, что позволяет защищать машину от угроз, подходящих с разных направлений.\n\n§GПодсказка дизайнера: Комплекс активной защиты — хороший способ усилить защищённость наших танков§!"
 UKR_spaa_medium_range_missiles_1: "5В27"
 UKR_spaa_medium_range_missiles_2: "9М38 / 5В27Д-М2"
 UKR_spaa_medium_range_missiles_3: "«Корал»"
 UKR_spaa_long_range_missiles_4: "«Кильчень»"
 UKR_spaa_short_range_missiles_1_desc: "9М37 — советская зенитная управляемая ракета малой дальности, созданная для семейства 9К35 «Стрела-10»; она обеспечивает подвижную противовоздушную оборону сухопутных войск от низколетящих самолётов и вертолётов.\n\n§GПодсказка дизайнера: Ракеты малой дальности обеспечивают базовую защиту от низколетящих целей. Более совершенные ракеты повышают эффективность подвижных зенитных подразделений§!."
 UKR_spaa_short_range_missiles_2_desc: "9М33 и 9М37М — советские зенитные управляемые ракеты. 9М33 применяется в комплексах семейства «Оса», а 9М37М — в комплексах «Стрела-10». Обе ракеты предназначены для поражения низколетящих самолётов и вертолётов и обеспечивают мобильным частям защиту от воздушных угроз на малой дальности.\n\n§GПодсказка дизайнера: Ракеты малой дальности обеспечивают базовую защиту от низколетящих целей. Более совершенные ракеты повышают эффективность подвижных зенитных подразделений§!."
 UKR_spaa_short_range_missiles_3_desc: "Т382 — украинская зенитная управляемая ракета малой дальности, разработанная для модернизированного комплекса «Оса-АКМ». В ракете применены обновлённые системы наведения и управления, повышающие эффективность устаревающей платформы.\n\n§GПодсказка дизайнера: Ракеты малой дальности обеспечивают базовую защиту от низколетящих целей. Более совершенные ракеты повышают эффективность подвижных зенитных подразделений§!."
 UKR_spaa_missiles_2_desc: "РК-2П — украинская противотанковая управляемая ракета разработки ГККБ «Луч». Приспособленная к применению с различных боевых платформ, она даёт дополнительные управляемые противотанковые возможности в дополнение к основному вооружению машины.\n\n§GПодсказка дизайнера: Управляемые ракеты дают дополнительную огневую мощь против бронированных наземных целей и способны значительно повысить универсальность боевой машины§!."
 UKR_spaa_missiles_3_desc: "РК-10 — украинская многоцелевая управляемая ракета разработки ГККБ «Луч». Модульная конструкция позволяет интегрировать её с разными боевыми платформами и обеспечивает возросшие возможности по поражению бронированных и других наземных целей.\n\n§GПодсказка дизайнера: Управляемые ракеты дают дополнительную огневую мощь против бронированных наземных целей и способны значительно повысить универсальность боевой машины§!."
 UKR_spaa_medium_range_missiles_1_desc: "5В27 — советская зенитная управляемая ракета комплекса С-125. Она предназначена для поражения самолётов на средней дальности и на малых и средних высотах и превосходит по дальности подвижные комплексы малой дальности. 5В27 была основным вооружением С-125 и его многочисленных модернизаций."
 UKR_spaa_medium_range_missiles_2_desc: "9М38 разрабатывалась для семейства подвижных зенитных комплексов «Бук», а 5В27Д-М2 — украинская модернизация ракеты комплексов семейства С-125. Усовершенствованные системы наведения и двигательные установки делают их эффективнее прежних ракет средней дальности.\n\n§GПодсказка дизайнера: Ракеты средней дальности обеспечивают баланс между зоной охвата и стоимостью, что делает их пригодными для ПВО общего назначения§!."
 UKR_spaa_medium_range_missiles_3_desc: "«Корал» — украинский зенитный ракетный комплекс средней дальности, создаваемый как современная замена устаревающим советским системам ПВО. В проекте объединены современные украинские ракетные, радиолокационные технологии и средства наведения, образующие новое поколение подвижной ПВО.\n\n§GПодсказка дизайнера: Ракеты средней дальности обеспечивают баланс между зоной охвата и стоимостью, что делает их пригодными для ПВО общего назначения§!."
 UKR_spaa_long_range_missiles_1_desc: "3М8 создавалась для подвижного зенитного ракетного комплекса 2К11 «Круг». Крупная ракета и мощная двигательная установка позволили комплексу прикрывать советские сухопутные войска и важные группировки на увеличенной дальности.\n\n§GПодсказка дизайнера: Ракеты большой дальности обеспечивают обширную зону ПВО при значительно большей стоимости. Они предназначены для прикрытия важных районов и особо ценных объектов§!."
 UKR_spaa_long_range_missiles_2_desc: "9М83 — ракета, разработанная для семейства подвижных зенитных ракетных комплексов С-300В. Она предназначалась для прикрытия сухопутных войск на большой дальности и поражения сложных воздушных целей за пределами досягаемости обычных войсковых средств ПВО.\n\n§GПодсказка дизайнера: Ракеты большой дальности обеспечивают обширную зону ПВО при значительно большей стоимости. Они предназначены для прикрытия важных районов и особо ценных объектов§!."
 UKR_spaa_long_range_missiles_3_desc: "СД-300 — украинский проект зенитной управляемой ракеты большой дальности, создававшийся на основе технологий нескольких отечественных ракетных и радиолокационных программ. Проект должен был дать Украине современные средства ПВО собственной разработки.\n\n§GПодсказка дизайнера: Ракеты большой дальности обеспечивают обширную зону ПВО при значительно большей стоимости. Они предназначены для прикрытия важных районов и особо ценных объектов§!."
 UKR_spaa_long_range_missiles_4_desc: "«Кильчень» — украинский проект зенитного комплекса большой дальности, разрабатывавшийся КБ «Южное» как система нового поколения. В основу проекта легли современные ракеты, радиолокационное оборудование и сетевые средства управления, призванные создать передовую национальную систему ПВО.\n\n§GПодсказка дизайнера: Ракеты большой дальности обеспечивают обширную зону ПВО при значительно большей стоимости. Они предназначены для прикрытия важных районов и особо ценных объектов§!."
 UKR_spaa_autocannon_1_desc: "2А10 — советская автоматическая пушка, применявшаяся на ранних поколениях зенитных самоходных установок. Высокая скорострельность обеспечивает базовые возможности по борьбе с низколетящими самолётами и легкобронированными целями.\n\n§GПодсказка дизайнера: Автопушки обеспечивают недорогую ПВО ближнего действия. Более совершенное оружие повышает плотность и эффективность зенитного огня§!."
 UKR_spaa_autocannon_2_desc: "2А10М — улучшенное развитие советской 2А10, а Oerlikon KDA — 35-мм автоматическая пушка швейцарской разработки, широко принятая на вооружение западными системами ПВО. Оба орудия обладают возросшей огневой мощью и лучше сопрягаются с современными системами управления зенитным огнём.\n\n§GПодсказка дизайнера: Автопушки обеспечивают недорогую ПВО ближнего действия. Более совершенное оружие повышает плотность и эффективность зенитного огня§!."
 UKR_spaa_autocannon_3_desc: "Oerlikon Revolver Gun Mk3 — современная автоматическая пушка револьверного типа, созданная для ведения интенсивного зенитного огня. Передовой механизм подачи и высокая скорострельность позволяют современным СЗУ эффективнее поражать скоростные воздушные цели.\n\n§GПодсказка дизайнера: Автопушки обеспечивают недорогую ПВО ближнего действия. Более совершенное оружие повышает плотность и эффективность зенитного огня§!."
 UKR_spaa_light_autocannon1_desc: "2А10 — советская автоматическая пушка, применявшаяся в качестве основного вооружения ряда ранних зенитных машин. Высокая скорострельность даёт лёгким подвижным платформам базовую защиту от низколетящих самолётов и легкобронированных целей.\n\n§GПодсказка дизайнера: Лёгкие автопушки обеспечивают ПВО ближнего действия для слабозащищённых машин. Более совершенное оружие повышает их способность поражать низколетящие цели§!."
 UKR_spaa_light_autocannon2_desc: "2А38 — советская спаренная автоматическая пушка, разработанная для комплекса 2К22 «Тунгуска». Два ствола и высокая скорострельность дают существенный прирост огневой мощи ПВО ближнего действия по сравнению с более ранними лёгкими автопушками.\n\n§GПодсказка дизайнера: Лёгкие автопушки обеспечивают ПВО ближнего действия для слабозащищённых машин. Более совершенное оружие повышает их способность поражать низколетящие цели§!."
 UKR_spaa_radar_gen1: "1РЛ33"
 UKR_spaa_radar_gen1_desc: "1РЛ33 — советская радиолокационная станция радиоприборного комплекса РПК-2 «Тобол», созданного для ЗСУ-23-4 «Шилка». РЛС объединяет поиск, обнаружение и сопровождение целей с системой управления огнём машины, позволяя экипажу получать данные о цели, не полагаясь только на визуальное наблюдение."
 UKR_spaa_radar_gen2: "1РЛ33М / 1РЛ144"
 UKR_spaa_radar_gen2_desc: "1РЛ33М — советская радиолокационная станция зенитной самоходной установки ЗСУ-23-4 «Шилка». Это усовершенствованная версия исходной 1РЛ33, которая обеспечивает обнаружение и сопровождение целей в составе системы управления огнём машины. Благодаря связи с бортовым вычислителем и аппаратурой наведения оружия экипаж может поражать воздушные цели по данным радиолокации.\n\n1РЛ144 — советская радиолокационная станция зенитного комплекса 2К22 «Тунгуска». РЛС объединяет функции обзора и сопровождения целей с системой управления огнём и непрерывно передаёт данные о целях экипажу и бортовым системам наведения."
 UKR_spaa_radar_gen3: "«Рокач-АС»"
 UKR_spaa_radar_gen3_desc: "«Рокач-АС» — многофункциональная РЛС с цифровой антенной решёткой, созданная на замену советской РЛС 1РЛ33М на ЗСУ-23-4. Компактная станция обеспечивает круговой обзор, поиск и автоматическое сопровождение целей, а цифровая архитектура значительно улучшает обработку данных о целях и позволяет системе работать автономно."
 UKR_spaa_off_vehicle_radar_gen1: "П-190У"
 UKR_spaa_off_vehicle_radar_gen1_desc: "П-190У — модернизированная версия советской РЛС обзора П-19, разработанная «Аэротехникой-МЛТ». Модернизация добавила цифровую обработку сигнала, повышенную помехозащищённость, автоматическое сопровождение целей и цифровой обмен радиолокационной информацией с другими системами. РЛС сохранила мобильное наземное исполнение оригинальной П-19, но получила значительно более широкие возможности обнаружения и обработки данных."
 UKR_spaa_off_vehicle_radar_gen2: "35Д6М"
 UKR_spaa_off_vehicle_radar_gen2_desc: "35Д6М — модернизированная трёхкоординатная РЛС обзора, разработанная украинским научно-производственным комплексом «Искра». Модернизация принесла новую антенную систему, обновлённое программное обеспечение и улучшенную обработку данных, что повысило дальность обнаружения и точность построения траекторий. Станция также получила современные рабочие места операторов и обновлённую систему обеспечения, сохранив мобильное исполнение исходной 35Д6."
 UKR_spaa_off_vehicle_radar_gen3: "79К6 «Пеликан»"
 UKR_spaa_off_vehicle_radar_gen3_desc: "79К6 «Пеликан» — украинская мобильная трёхкоординатная РЛС обзора, разработанная научно-производственным комплексом «Искра». Станция использует цифровую фазированную антенную решётку и многолучевой передатчик, что позволяет обнаруживать и сопровождать воздушные цели в условиях естественных и организованных помех. «Пеликан» служит информационным звеном систем ПВО, передавая данные о целях автоматизированным системам управления и зенитным ракетным подразделениям."
 UKR_spaa_off_vehicle_radar_gen4: "80К6КС1 «Феникс-1»"
 UKR_spaa_off_vehicle_radar_gen4_desc: "80К6КС1 — современная украинская трёхкоординатная РЛС обзора, созданная научно-производственным комплексом «Искра» как дальнейшее развитие 79К6 «Пеликан». Станция использует современную технологию фазированных решёток и цифровую обработку сигнала для автоматического обнаружения и сопровождения воздушных целей. «Феникс-1» предназначен для работы в составе комплекса «Бук-М1»."
 UKR_spaa_optical_guidance_gen2: "9С86"
 UKR_spaa_optical_guidance_gen2_desc: "9С86 — компактная система наведения, устанавливаемая на зенитный комплекс «Стрела-10». Она дополняет оптико-электронную аппаратуру наведения комплекса, предоставляя данные о дальности до цели для расчётов системы управления огнём."
 hardkill_system: "Ранний комплекс активной защиты"
 hardkill_system_desc: "Комплекс активной защиты (КАЗ) устанавливается на танк, обнаруживает приближающиеся боеприпасы и уничтожает их собственными средствами — неуправляемой или управляемой ракетой либо кинетическим снарядом. Ранние КАЗ защищают танк в основном от кумулятивных боеприпасов.\n\n§GПодсказка дизайнера: Комплекс активной защиты — хороший способ повысить защищённость наших танков от вражеских ракет. Он также позволит нашей бронетехнике эффективнее прорывать вражеские позиции.§!"
 SOV_hardkill_system: "«Дрозд»"
 SOV_hardkill_system_desc: "Разработанный в СССР комплекс активной защиты танков от противотанковых управляемых ракет и гранатомётов. Считается первым в мире КАЗ, принятым на вооружение: создан в 1977–1978 годах в KBP под руководством А. Г. Шипунова как «Комплекс 1030М-01»."
 UKR_hardkill_system: "«Дрозд»"
 UKR_hardkill_system_desc: "Разработанный в СССР комплекс активной защиты танков от противотанковых управляемых ракет и гранатомётов. Считается первым в мире КАЗ, принятым на вооружение: создан в 1977–1978 годах в KBP под руководством А. Г. Шипунова как «Комплекс 1030М-01»."
 UKR_nera_armor_gen1: "«Комбинация Я»"
 UKR_nera_armor_gen1_desc: "«Комбинация Я» — комбинированная броня нового поколения, созданная для семейства Т-80У. В отличие от прежних бронепакетов со сплошными слоями стеклотекстолита, керамики или других наполнителей, здесь используются ячеистые элементы, заполненные полимерным материалом. Ячеистая структура улучшает защиту от кумулятивных боеприпасов и позволяет устанавливать наполнитель сменными модулями. Броня появилась на Т-80У, а затем применялась на Т-80УД.\n\n§GПодсказка дизайнера: тяжёлая НДЗ прочнее, но и дороже более простой композитной брони§!"
 UKR_nera_armor_gen2: "Композитная броня Т-84"
 UKR_nera_armor_gen2_desc: "Т-84 получил значительно улучшенный многослойный бронепакет с керамическими и специальными резиновыми элементами, размещёнными между стальными и легированными листами. Новая схема обеспечивала лучшую защиту как от кинетических, так и от кумулятивных боеприпасов по сравнению с прежними советскими образцами композитной брони.\n\n§GПодсказка дизайнера: тяжёлая НДЗ прочнее, но и дороже более простой композитной брони§!"
 UKR_nera_armor_gen3: "Композитная броня «Ноты»"
 UKR_nera_armor_gen3_desc: "Композитная броня «Ноты» стала дальнейшим развитием передовых концепций защиты, опробованных на Т-84. Её многослойный пакет сочетал стальную броню с неметаллическими и энергопоглощающими материалами, образуя толстый защитный барьер, рассчитанный как на кинетические, так и на кумулятивные угрозы. Эта броня входила в обширный комплекс защиты «Объекта 477А1».\n\n§GПодсказка дизайнера: тяжёлая НДЗ прочнее, но и дороже более простой композитной брони§!"
 UKR_afv_composite_armor_gen3: "Композитная броня Т-84"
 UKR_afv_composite_armor_gen3_desc: "Композитная броня Т-84 была значительно улучшена и стала многослойной: между стальными и легированными листами размещены специальные резиновые и керамические материалы.\n\n§GПодсказка дизайнера: композитная броня — стандартный вариант для современных основных боевых танков§!"