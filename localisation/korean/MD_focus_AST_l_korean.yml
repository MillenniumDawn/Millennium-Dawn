 RULE_OPTION_AST_HISTORICAL_DESC: "오스트레일리아는 역사적 경로를 면밀히 따릅니다. 하워드는 중도적 접근을 취합니다. 선거 결과는 역사 그대로 유지됩니다. 우리 역사에서 일어난 정치적 축출도 그대로 일어납니다."
