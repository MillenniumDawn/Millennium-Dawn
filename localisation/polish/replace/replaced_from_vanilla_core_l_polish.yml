 LOGISTICS_CAPACITY_DETAILED_DESC: "Zdolność logistyczna odzwierciedla poziom zadowolenia linii zaopatrzenia. Jeśli w twoim kraju brakuje pociągów lub pojazdów użytkowych potrzebnych do przeniesienia całego zapotrzebowania na zaopatrzenie, twoje jednostki otrzymają zmniejszone dostawy i będą dotknięte karami za zaopatrzenie."
 TRUCKS: "Pojazdy użytkowe"
 FUEL_DESC: "§HPaliwo§! jest generowane przez nadmiar ropy twojego kraju. Każde państwo ma maksymalną pojemność dla §HPaliwa§!, którą można zwiększyć budując §HSilosy§!. §HPaliwo§! jest używane przez jednostki czołgów/mechanizowane, statki i samoloty, a dostarczane jest za pomocą §HLinii Zaopatrzenia§!.\n\n§HPaliwo§! jest również wykorzystywane do zasilania §HElektrowni na Paliwa Kopalne§! twojego kraju i jest ważnym zasobem zapewniającym ciągłość funkcjonowania gospodarki. §HReaktory Jądrowe§!, §HInfrastruktura Energii Odnawialnej§! i §HInne Źródła Energii§! nie zużywają §HPaliwa§! do produkcji energii. Twoja §HLudność§! również zużywa §HPaliwo§! jako część ich ogólnych potrzeb. Aby uzyskać więcej informacji dotyczących zużycia §HPaliwa§! przez niemilitarne zasoby, sprawdź ekran §HEnergii§! w zakładce §HBudowa§!.\nCzy mogę pomóc w czymś jeszcze?"
