 cub_military_coop_with_unionstate_name_tt: "연방 국가와의 군사 협력"
 antillean_conf: "안틸레스 연방"
 CUB_confederation: "안틸레스 연방"
 cuba.3.t: "새로운 지휘 개혁"
 cuba.3.d: "오랜 세월 활동이 없던 끝에, 낡은 군대에 관심을 환기하려는 노력 덕분에 우리는 군 개혁 프로그램에 착수할 수 있게 되었습니다. 이 개혁의 가장 중요한 과제이자 주된 목표는 우리 군의 구시대적 지휘 체계를 교체하고 장비를 현대화하는 것입니다."
 cuba.3.a: "우리는 다시 강해질 것이다!"
 cuba.16.t: "교황의 쿠바 방문"
 cuba.16.d: "오늘 교황이 자유의 섬을 공식 방문하였습니다. 62년 이래 국가 무신론을 시행해 온 쿠바는 이제 처음으로 크리스마스를 기념하는 것이 허용되었습니다. 베를린 장벽 붕괴에 비견되는 이 사건 속에서, 교황은 가톨릭 일색의 라틴아메리카에서 지금까지 한 번도 방문한 적 없던 유일한 나라인 쿠바를 찾았습니다."
 cuba.16.a: "쿠바에 남은 냉전의 마지막 메아리"
 cuba.10.t: "새로운 쿠바 헌법"
 cuba.10.d: "오늘 쿠바 정부는 새 국가 헌법의 채택을 공식 발표하였습니다. 당국에 따르면 새 헌법은 섬 시민들의 의지에 전적으로 부합합니다."
 cuba.10.a: "마침내 제대로 된 헌법이 나왔군"
 cuba.17.t: "쿠바의 동맹 제안"
 cuba.17.d: "쿠바가 우리를 자신들의 새 동맹에 초청하고 있습니다"
 cuba.17.a: "물론 가입하겠다"
 cuba.17.b: "안된다"
 cuba.14.t: "쿠바의 관타나모 문제 해결 제안"
 cuba.14.d: "쿠바 대표단은 관타나모 문제를 이번 기회에 완전히 매듭짓자고 제안합니다. 우리는 그들에게 해당 영토를 넘겨줄 수도 있고, 우리가 계속 보유할 수도 있습니다"
 cuba.14.a: "우리가 이 땅이 왜 필요하지?"
 cuba.14.b: "안된다"
 cuba.25.t: "우리의 보호를 원하는 쿠바"
 cuba.25.d: "쿠바 정부가 우리에게 보호와 안전 보장을 요청하였습니다"
 cuba.25.b: "안된다"
 cuba.25.a: "우리의 사회주의 형제들을 지키자"
 cuba.9.t: "집권을 이어가는 피델 카스트로"
 cuba.9.d: "우리 인민의 지도자이자 투사이며 해방자이신 그분께서 권좌를 지키고 계십니다. 그분께서는 계속 쿠바를 밝은 미래로 이끌어 가실 것입니다!"
 cuba.9.a: "우라!"
 cuba.12.t: "카스트로의 새로운 쿠바 정치 발표"
 cuba.12.d: "쿠바 공산당 신임 대회에서 피델 카스트로는 민주주의 체제로의 이행과 쿠바의 조율된 변화를 발표하였습니다"
 cuba.12.a: "음, 알았다."
 cuba_news.29.t: "나토와 합동 훈련하는 쿠바군"
 cuba_news.29.d: "오늘 쿠바와 나토 회원국들 사이의 새로운 연합 훈련이 공식적으로 시작되었습니다. 쿠바와 동맹은 군사 협력을 확대하고 쿠바의 민주주의와 자유에 대한 보호를 강화하기로 합의하였습니다. 또한 섬의 지속적인 안전을 보장하기 위해 쿠바 국경 안에 미군 기지가 설치될 예정입니다"
 cuba_news.29.a: "쿠바는 친서방 국가가 되었다."
 cuba_news.30.t: "관타나모를 되찾은 쿠바"
 cuba_news.30.d: "미국 대표단은 관타나모 항구를 쿠바의 통제 아래 두는 데 동의하였습니다"
 cuba_news.30.a: "흥미롭군"
 cuba.26.t: "미국의 제안 수락!"
 cuba.26.d: "미국 대표단이 동의하였습니다. 관타나모는 다시 우리의 것입니다!"
 cuba.26.a: "양키, 고 홈"
 cuba.18.t: "베네수엘라의 우리 제안 수락"
 cuba.18.d: "베네수엘라 정부는 ALBA 동맹을 창설하자는 우리의 제안을 수락한다고 발표하였습니다"
 cuba.18.a: "좋아"
 cuba.19.t: "베네수엘라의 비동의"
 cuba.19.d: "그들은 우리 제안을 거절했습니다. 그들의 견해로는 자신들에게 이득이 되지 않는다는 것입니다."
 cuba.19.a: "Sad."
 cuba_news.24.t: "유라시아경제연합의 옵서버국이 된 쿠바"
 cuba_news.24.d: "유라시아경제연합 회원국들은 쿠바에 유라시아경제연합 옵서버 지위를 부여하였습니다"
 cuba_news.24.a: "쿠바는 계속 세계로 문을 열고 있다"
 cuba.27.t: "미국의 우리 제안 거절"
 cuba.27.d: "관타나모는 계속 그들의 통제 아래 남습니다"
 cuba.27.a: "그런 자들과 어떻게 대화하란 말인가?"
 cuba_news.20.t: "ALBA 결성"
 cuba_news.20.d: "오늘 쿠바와 베네수엘라 정부는 ALBA 동맹의 창설을 공식 발표하였습니다"
 cuba_news.20.a: "아메리카의 새로운 세력인가?"
 cuba.21.t: "ALBA 프로젝트의 성공"
 cuba.21.d: "ALBA 프로젝트의 도움으로 우리는 다른 나라들에 대한 영향력을 높이고, 경제를 개선하고, 에너지 독립을 이루고, 다른 나라 및 동맹들과의 무역을 발전시킬 수 있었습니다"
 cuba.21.a: "훌륭해!"
 cuba.22.t: "ALBA 프로젝트의 실패"
 cuba.22.d: "유감스럽게도 ALBA 프로젝트는 우리가 원하던 결과를 내지 못했습니다. 우리 경제는 큰 타격을 입었고 이 프로젝트들에 투자한 자금은 사라졌습니다."
 cuba.22.a: "이것으로 끝이다."
 cuba.33.t: "나발니 검거!"
 cuba.33.d: "우리 보안 기관은 범죄자 나발니를 성공적으로 체포하였으며, 이미 그를 쿠바로 호송하고 있습니다."
 cuba.33.a: "나발니 레하, 헤이, 나발니 레하, 우."
 cuba.34.t: "작전 실패"
 cuba.34.d: "우리 특수 기관은 나발니를 체포하는 데 실패하였고, 야권 인사는 여전히 도주 중입니다"
 cuba.34.a: "아, 레하, 네가 없으니 너무 괴롭구나."
 cuba_news.35.t: "쿠바에서 권력을 잡은 팔랑헤주의자들"
 cuba_news.35.d: "오늘 오후 쿠바에서 흥미로운 소식이 들어왔습니다. 아침에 수도 아바나 거리에 전차가 나타나 무장 쿠데타가 시작되었습니다. 그 결과 현 정부는 권력에서 쫓겨났고, 스스로를 \\"팔랑헤주의자\\"라 부르는 이들이 그 자리를 차지하였습니다"
 cuba_news.35.a: "쿠바의 혼란."
 cuba.36.t: "우리의 복종을 요구하는 쿠바"
 cuba.36.d: "쿠바 정부는 우리 행정부에 최후통첩을 보내, 자국에 가입하지 않으면 우리를 상대로 전면전을 개시하겠다고 요구하였습니다."
 cuba.36.b: "빠져나갈 길이 없군."
 cuba.36.a: "놈들을 박살 내자"
 cuba.37.t: "도미니카 공화국의 동의"
 cuba.37.d: "우리 군은 구 도미니카 영토에 진입하여 그 나라 군대의 옛 군사 기지들을 점령하였으며, 이제 히스파니올라 섬은 모두 우리의 것입니다."
 cuba.37.a: "그곳에 해변을 만들자!"
 cuba.38.t: "반격에 나선 도미니카 공화국"
 cuba.38.d: "우리의 최후통첩은 거부되었으며 그들의 군대는 이미 우리 국경을 향해 이동하고 있습니다"
 cuba.38.a: "놈들을 박살 내라!"
 cuba_news.39.t: "자메이카를 장악한 쿠바"
 cuba_news.39.d: "오늘 쿠바군은 자메이카의 주요 시설을 장악하였고, 자메이카 지도자는 국가의 소멸을 선언하였습니다"
 cuba_news.39.a: "쿠바는 계속 팽창한다"
 cuba.39.t: "책임 있는 선택을 해야 할 때"
 cuba.39.d: "공산주의는 무너졌고 민족주의는 과거의 일이 되었으니, 이제 책임 있는 선택을 해야 할 때입니다. 누가 쿠바를 밝은 민주주의의 미래로 이끌 것인가? 주요 후보는 쿠바 자유연합, 쿠바 기독민주당, 쿠바 민주사회혁명당입니다. 그러나 선택은 쿠바 국민의 몫입니다"
 cuba.39.a: "쿠바 자유연합이 가장 합당한 후보이다"
 cuba.39.b: "쿠바 민주사회혁명당이 최선일 것이다"
 cuba.39.c: "쿠바 기독민주당이 우리를 더 밝은 미래로 이끌 것이다"
 cuba.40.t: "산후안 협정"
 cuba.40.d: "쿠바 장관들과 대사들이 \\"산후안 협정\\"이라 이름 붙인 제안을 가지고 찾아왔습니다. 협정 내용에 따르면 [CUB.GetName]은(는) 카리브해 지역의 자치를 장려하기 위해 푸에르토리코 섬이 우리 영토로부터 독립하는 대가를 지불하겠다고 합니다. 흥미로운 제안인데, 어떻게 해야 합니까? 푸에르토리코의 독립을 허용하시겠습니까?"
 cuba.40.a: "물론이다!"
 cuba.40.b: "It's American soil. It's final."
 cuba.41.t: "미국의 제안 수락"
 cuba.41.d: "미국이 우리의 제안을 수락하였습니다. 오늘부로 푸에르토리코는 독립 국가가 되었습니다."
 cuba.41.a: "좋아"
 cuba.42.t: "미국의 우리 제안 거절"
 cuba.42.d: "그들은 이 제안이 자신들에게 유리하지 않다고 보며 푸에르토리코를 독립시키지 않을 것입니다."
 cuba.42.a: "슬프군"
 cuba.43.t: "금수 조치를 해제해 달라는 쿠바"
 cuba.43.d: "쿠바 외교관들은 섬에 대한 경제 금수 조치를 해제해 달라고 요청하였습니다. 쿠바 측에 따르면 쿠바는 민주적이고 자유로운 국가가 되었으므로 이 나라를 계속 봉쇄 상태에 둘 이유가 없습니다"
 cuba.43.a: "물론이지"
 cuba.43.b: "충분히 민주적이지 않다"
 cuba.44.t: "미국의 동의"
 cuba.44.d: "미국 정부가 우리의 구상을 지지하였습니다. 오늘부로 봉쇄는 공식적으로 종료됩니다"
 cuba.44.a: "마침내"
 cuba.45.t: "미국의 비동의"
 cuba.45.d: "봉쇄는 계속됩니다."
 cuba.45.a: "Ugh."
 cuba.49.t: "합의에 이른 민주 세력들"
 cuba.49.d: "마침내 긴 논쟁 끝에 쿠바 민주 정당들의 대표들이 최근 몇 년간 체결된 가장 중요한 합의를 발표하였습니다. 개인의 이해를 제쳐 두고 국가의 이익을 우선시하여, 자유의 섬의 민주 정당들은 하나의 공동 연립으로 통합할 것입니다. 이는 쿠바 국가 역사상 가장 중요한 사건입니다."
 cuba.49.a: "우리는 하나로 뭉쳤으며 무적이다"
 CubaConf.50.t: "안틸레스 연방"
 CubaConf.50.d: "[FROM.GetName]은(는) 정부 회담 자리에서 안틸레스 연방에 가입하라는 공식 초청을 전달하였습니다. 정부에 따르면 이 국가는 평등과 협력을 기반으로 하며, 연방의 모든 회원국은 동등한 권리를 갖게 됩니다"
 CubaConf.50.a: "동의한다"
 CubaConf.50.b: "안된다"
 cuba.52.t: "앞으로 나아갈 길"
 cuba.52.d: "누가 쿠바를 통치할 것인가 하는 문제는 더 이상 미룰 수 없습니다. 당, 개혁파, 망명자들 모두 저마다의 답을 가지고 있으며, 지금 어느 쪽이 승리하든 한 세대에 걸쳐 이 섬의 진로를 결정하게 될 것입니다."
 cuba.52.a: "쿠바는 스스로 미래를 결정할 것이다"
 cuba.53.t: "쿠바의 지원을 받은 내전 발발"
 cuba.53.d: "반군 다수를 생포한 뒤 그들은 자신들이 쿠바 정부와 연계되어 있으며 쿠바 섬에서 이념 교육도 받았다고 털어놓았습니다."
 cuba.53.a: "젠장"
 cuba.54.t: "쿠바의 최후통첩"
 cuba.54.d: "쿠바 정부는 우리의 복종을 요구합니다. 우리가 거부하면 쿠바군이 우리 영토에 투입될 것입니다"
 cuba.54.b: "항복할 수밖에 없겠군"
 cuba.54.a: "Never!"
 cuba.55.t: "그들의 거부"
 cuba.55.d: "그들은 우리의 제안을 거절하고 적대 행위가 벌어질 수 있는 지역으로 병력을 집결시키기 시작했습니다"
 cuba.55.a: "놈들을 박살 내자"
 cuba.63.t: "우리의 보호를 요청하는 쿠바"
 cuba.63.d: "우리의 친구들은 자국군의 힘만으로는 국토 전체를 방어하기에 충분하지 않다고 판단했습니다. 오늘 쿠바 정부는 우리 기지를 섬 영토에 주둔시켜 달라고 요청하였습니다. 그들에게 뭐라고 답하시겠습니까?"
 cuba.63.a: "친구들을 지켜 주자"
 cuba.63.b: "미군이 쿠바를 도우러 가는 일은 없을 것이다"
 cuba.64.t: "미국의 우리 보호 동의"
 cuba.64.d: "미국 친구들은 우리나라의 방어를 돕기로 동의하였습니다. 최초의 미군 병사들이 이미 쿠바 땅에 발을 디뎠습니다"
 cuba.64.a: "우리의 민주주의는 굳건히 보호받고 있다"
 cuba.65.t: "미국의 우리 보호 거부"
 cuba.65.d: "미국은 우리의 요청을 거절하였으며, 우리는 홀로 스스로를 지켜야 할 것입니다"
 cuba.65.a: "알겠다"
