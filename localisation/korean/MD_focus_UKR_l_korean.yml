 tooltip_remove_productivity_from_state: "§W이 주의 생산성이 §R$PRODUCTIVITY_AMOUNT$§!포인트 §R감소§!합니다.\n §!"
 UKR_develop_t64_strazh_desc: "§WThe §YBMPT 'Strazh'§! was an experimental [UKR.GetFlag] Ukrainian tank-support vehicle developed on the chassis of the §YT-64§! tank.\nThe project was developed jointly by the §LZhytomyr Armoured Plant§!, §LKyiv Armoured Plant§! and §LArtem State Holding Company§! and was presented in 2017.\nThe original §YT-64§! turret was replaced by the [UKR.GetFlag] Ukrainian §Y'Duplet'§! remotely operated combat module, giving the vehicle a completely different role from the original tank.\nThe project was intended to provide heavily protected fire support while making use of existing §YT-64§! chassis and [UKR.GetFlag] Ukrainian-developed combat equipment.\n§Y'Strazh'§! remained an experimental project and was not adopted for large-scale production, §Gbut we can change that, right?§!§!"
 UKR_develop_t72amt_desc: "§WThe §YT-72AMT§! was a [UKR.GetFlag] Ukrainian modernization of the §YT-72A§! developed by the §LKyiv Armoured Plant§! for the Armed Forces of [UKR.GetFlag] Ukraine.\nThe modernization introduced the §YV-84-1§! engine, improved night-vision equipment, the §Y1K13§! sight and the [UKR.GetFlag] Ukrainian §Y'Nizh'§! reactive armor system.\nThe tank also received modern communications equipment and the §YSN-3003 'Basalt'§! navigation system, while elements of the running gear were upgraded using components developed for the §YT-80§!.\nThe §Y1K13§! sight allowed the modernized tank to employ the §Y'Kombat'§! guided weapon system.\nThe §YT-72AMT§! was intended as a relatively economical way of bringing existing §YT-72§! tanks closer to modern [UKR.GetFlag] Ukrainian operational requirements.§!"
 UKR_modernize_zsu_23_4m_a1_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_rokach_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YZSU-23-4M-A1 'Rokach'§! is a [UKR.GetFlag] Ukrainian modernization of the §RSoviet§! §YZSU-23-4 'Shilka'§! self-propelled anti-aircraft gun.\nThe modernization replaces the outdated fire-control and observation equipment with a modern digital system, improving the vehicle's ability to detect and track aerial targets.\nThe system retains the four 23 mm autocannons while receiving improved electronics and four Short-range anti-air missiles.\nThese changes significantly improve the combat effectiveness of the §YZSU-23-4§! against low-flying targets.§!"
 UKR_modernize_s125_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_2d1_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YS-125-2D§! is a [UKR.GetFlag] Ukrainian modernization of the §RSoviet§! §YS-125§! surface-to-air missile system.\nThe modernization is intended to replace outdated electronic components and improve the system's resistance to electronic warfare and modern countermeasures.\nThe radar and guidance equipment are upgraded, while the system receives improved capabilities for detecting, tracking, and engaging aerial targets.\nThe modernization is intended to extend the operational life of the §YS-125§! while improving its effectiveness on the modern battlefield.§!"
 UKR_modernize_s125m_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_m1_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YS-125M§! was a [UKR.GetFlag] Ukrainian modernization program intended to extend the service life and capabilities of the §RSoviet§! §YS-125 'Pechora'§! air-defense system.\nThe program was carried out by [UKR.GetFlag] Ukrainian defense companies including §YKB Luch§! and §YRadionix§!, with work focused on modernizing the missile and the system's guidance and fire-control equipment.\nThe modernization included upgraded §Y5V27D§! missiles and the §YFCR-125§! radar system, replacing important elements of the original §RSoviet-era§! equipment.\nThe §YS-125M§! project provided [UKR.GetFlag] Ukraine with a way to significantly extend the useful life of existing §YS-125§! systems without developing an entirely new air-defense complex.§!"
 UKR_modernize_kvadrat_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_kvadrat_2l_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y2K12M1-2L 'Kvadrat-2L'§! is a [UKR.GetFlag] Ukrainian modernization of the §RSoviet§! §Y2K12M1 'Kub'§! surface-to-air missile system.\nThe modernization replaces a number of outdated electronic components with modern [UKR.GetFlag] Ukrainian-made equipment.\nThe system receives improved radar and fire-control capabilities, increasing its ability to detect, track, and engage aerial targets.\nThe modernization is intended to extend the service life of the remaining §Y2K12M1§! systems while improving their effectiveness against modern threats.§!"
 UKR_develop_t38_stylet_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_t38_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YT-38 'Stylet'§! is a [UKR.GetFlag] Ukrainian short-range surface-to-air missile system developed by the §LArsenal§! plant together with [BLR.GetFlag] Belarusian partners.\nThe system uses the §YT382§! missile and is designed to engage aircraft, helicopters, cruise missiles, and other low-flying aerial targets.\nThe complex is mounted on a tracked chassis, providing it with high mobility and the ability to operate alongside mechanized units.\nThe development of the §YT-38§! provides [UKR.GetFlag] Ukraine with a modern replacement for aging §RSoviet§! short-range §YOsa§! systems.§!"
 UKR_modernize_rk10_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_ryf_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YRK-10§! is a [UKR.GetFlag] Ukrainian anti-aircraft guided missile developed as an alternative to the aging missiles used by §RSoviet-era§! short-range air-defense systems.\nIntegrating the §YRK-10§! with the §YStrela-10§! system would allow its launchers to use a newer missile while retaining the existing vehicle and launcher infrastructure.\nThe new missile provides improved engagement capabilities and allows the system to remain operational without relying on increasingly obsolete §RSoviet§! ammunition.\nThis modernization would extend the service life of the §YStrela-10§! fleet while increasing its combat effectiveness.§!"
 UKR_develop_kentavr_spaa_desc: "§WThe §YZRAK 'Kentavr'§! was a [UKR.GetFlag] Ukrainian concept for a new self-propelled anti-aircraft system developed as a further evolution of the earlier §Y'Pereach'§! project.\nThe project was redesigned around two paired 40 mm automatic cannons, replacing the earlier concept based on a 57 mm anti-aircraft gun, while retaining a missile component and dedicated fire-control equipment.\nThe §Y'Kentavr'§! concept was intended to combine radar-based target detection with an electro-optical fire-control system, allowing the vehicle to engage aerial targets using both gun and missile armament.\nThe system was planned around a tracked chassis derived from the prospective [UKR.GetFlag] Ukrainian tank platform developed by the §LKharkiv Morozov Design Bureau§! as part of the §Y'Molot'§!/§Y'Bokser'§! development program.§!"
 UKR_modernize_planes_category: "우리 전투기 현대화"
 UKR_modernize_planes_category_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_main\n\n\n\n\n\n\n\n\n공군이 사용하는 소련 시대의 항공기와 헬리콥터를 개량하기 위한 연구와 시험에 시간과 자금을 투입할 수 있습니다. 시간이 지나 경험이 쌓이면 독자적인 국산 설계를 시도해 볼 수도 있을 것입니다."
 UKR_modernize_su25_m1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1_for_tooltip\n\n\n\n\n\n\n\n\n§WSu-25M1은 §R소련제§! §YSu-25§! 근접항공지원기를 우크라이나가 현대화한 모델입니다.\n이번 현대화는 기존 기체와 무장 능력은 유지한 채 항법, 통신 및 표적 지시 장비를 개선합니다.\n개량된 체계는 무유도 무기의 정확도를 높이고 항공기가 현대적 전투 환경에서 더 효과적으로 작전할 수 있게 합니다.\n이번 현대화는 §Y우크라이나§!의 §YSu-25§! 보유 전력의 운용 수명도 연장합니다.\n------------------\n이 결정은 §YSu-25M1K§! 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_modernize_su27_1m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\n§W§YSu-27-1M§!은 §R소련제§! §YSu-27§! 전투기를 우크라이나가 현대화한 모델입니다.\n이 계획은 항공기의 전투 효율을 높이기 위해 개선된 항법, 통신, 식별 및 기내 전자 체계를 도입합니다.\n개량된 항공 전자 장비는 더 나은 상황 인식을 제공하고 항공기가 현대적 무기를 운용하는 능력을 향상시킵니다.\n이번 현대화로 §YSu-27§!은 §R소련§! 시대 원래 장비가 가졌던 한계를 줄인 채 계속 복무할 수 있습니다.\n------------------\n이 결정은 §YAn-BFV§! 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_modernize_mig29_mu2_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu2_for_tooltip\n\n\n\n\n\n\n\n\n§W§YMiG-29MU2§!는 §L리비우 국립 항공기 수리 공장§!이 개발한, §R소련제§! §YMiG-29§! 전투기의 우크라이나식 현대화 모델입니다.\n이 현대화는 앞선 §YMU1§! 계획을 바탕으로 항공기의 항공 전자 장비, 항법 및 표적 지시 체계를 더욱 광범위하게 개량합니다.\n항공기는 공중 및 지상 표적 모두에 대해 현대적인 유도 및 무유도 무기를 운용하는 능력이 향상됩니다.\n§YMU2§! 계획은 §YMiG-29§!를 더 뛰어난 다목적 전투기로 탈바꿈시키는 것을 목표로 합니다.§!"
 UKR_modernize_mig29_mu1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu1_for_tooltip\n\n\n\n\n\n\n\n\n§W§YMiG-29MU1§!은 §R소련제§! §YMiG-29§! 전투기를 우크라이나가 현대화한 모델입니다.\n이 계획은 개선된 항공 전자 장비와 현대화된 레이더 경보 및 항법 체계를 도입합니다.\n개량된 장비는 조종사의 상황 인식을 높이고 항공기가 현대적 전투 환경에서 더 효과적으로 작전할 수 있게 합니다.\n§YMU1§! 현대화는 §YMiG-29§!의 더 광범위한 개량으로 나아가는 중간 단계의 역할도 합니다.\n------------------\n이 결정은 §YMiG-29MU2§! 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_develop_an_bfv_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_bfv_development_for_tooltip\n\n\n\n\n\n\n\n\n§W제안된 §L안토노프 설계국§!의 다목적 전투기는 §Y우크라이나§!가 독자 설계한 전투기를 개발하려는 구상 단계의 사업이었습니다.\n이 사업은 항공기 설계 및 생산에서 쌓은 우크라이나의 경험을 활용해 외국 설계에 전적으로 의존하지 않고 현대적인 전투기를 만들려는 것이었습니다.\n이 항공기는 §Y우크라이나§! 항공 산업의 역량에 맞게 조정되면서도 현대적인 항공 전자 장비, 무장, 공기역학적 해법을 도입할 예정이었습니다.\n사업은 제안 단계에 머물렀지만, 이를 개발하면 미래 세대 우크라이나 전투기의 토대를 마련할 수 있을 것입니다.\n\n§G특히 중요한 군사 사업:§! 완료되면 §Y최고라다§!가 더 높은 군사 예산을 승인할 의향이 커질 것입니다.§!"
 UKR_develop_bm21_k_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bm21k_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YBM-21K§! is a [UKR.GetFlag] Ukrainian modernization of the §RSoviet§! §YBM-21 'Grad'§! multiple launch rocket system.\nThe system is mounted on a modern [UKR.GetFlag] Ukrainian §LKrAZ§! truck chassis and receives improved navigation, communication, and fire-control equipment.\nThe modernization improves the system's mobility and allows crews to prepare and conduct fire missions more efficiently.\nThe §YBM-21K§! provides a relatively inexpensive way to modernize [UKR.GetFlag] Ukraine's large fleet of §RSoviet-era§! §YGrad§! launchers.§!"
 UKR_develop_bastion03_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bastion03_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y'Bastion-03'§! is a [UKR.GetFlag] Ukrainian multiple launch rocket system developed as a modernization of the §RSoviet§! §YBM-27 'Uragan'§! by §LShepetivska Repair Plant§!.\nThe system is based on a modern truck chassis.\nThe modernization improves mobility and reduces the time required to prepare the launcher for firing.\nThe §YBastion-03§! would allow [UKR.GetFlag] Ukraine to continue using existing 220 mm rockets while replacing the aging §RSoviet-era§! chassis.§!"
 UKR_develop_Vilkha_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_vilkha_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y'Vilkha'§! is a [UKR.GetFlag] Ukrainian multiple launch rocket system developed from the §RSoviet§! §YBM-30 'Smerch'§! by the §LLuch Design Bureau§!.\nThe project replaces the original unguided rockets with new guided missiles equipped with a [UKR.GetFlag] Ukrainian guidance system.\nThe system is designed to provide significantly improved accuracy while retaining the high destructive potential and range of a heavy MLRS.\nThe development of §YVilkha§! represents a transition from §RSoviet-era§! unguided rocket artillery toward modern precision strike capabilities.§!"
 UKR_develop_bureviy_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bureviy_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y'Bureviy'§! is a [UKR.GetFlag] Ukrainian multiple launch rocket system designed as a modern replacement for the aging §YBM-27 'Uragan'§! family.\nThe system is mounted on a modern §LTatra§! §YT815-7T3R2T§! chassis and incorporates digital fire-control and navigation systems.\n§YBureviy§! is designed to use existing 220 mm §YUragan§! rockets as well as newer [UKR.GetFlag] Ukrainian-developed ammunition.\nThe combination of modern electronics, improved mobility, and compatibility with existing ammunition makes the system a practical modernization of [UKR.GetFlag] Ukraine's rocket artillery.§!"
 UKR_modernize_mi24pu1_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mi24pu1_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YMi-24PU-1§! is a [UKR.GetFlag] Ukrainian modernization of the §YMi-24P§! developed by the §LKonotop Aircraft Repair Plant 'Aviakon'§! together with [UKR.GetFlag] Ukrainian defense-industry enterprises.\nThe helicopter received more powerful §YTV3-117VMA-SBM1V-02§! engines from §LMotor Sich§!, modernized avionics and navigation equipment, and systems for operation with night-vision equipment.\nThe modernization also incorporated the §YAdros KT-01AV§! protection system, the §YFPM-01KV§! laser aiming system and an upgraded §YASP-17VPM-V§! sight.\nThe program involved companies including §LMotor Sich§!, §LAdron§!, §LTsKB Arsenal§! and the §LIzium Instrument and Apparatus Factory§!, with later versions also using [UKR.GetFlag] Ukrainian electro-optical equipment.\nThe §YMi-24PU-1§! therefore combined a major overhaul of the original helicopter with new [UKR.GetFlag] Ukrainian engines, avionics, protection and targeting systems.§!"
 UKR_develop_nota_desc: "§W§YObject 477A1 Nota§! is an advanced [UKR.GetFlag] Ukrainian experimental main battle tank featuring an unmanned turret, isolated crew compartment and a powerful 152 mm main gun.§!"
 UKR_modernize_nota_desc: "§W§YObject 477A1 'Nota'§! is a [UKR.GetFlag] Ukrainian development of the §RSoviet§! §YObject 477 'Molot'§! advanced main battle tank project.\nThe design incorporates a heavily protected crew compartment, an unmanned fighting compartment, and a powerful main armament.\nThe modernization would introduce updated electronics, protection systems, and other components while adapting the design to technologies available to the [UKR.GetFlag] Ukrainian defense industry.\nAlthough the project never reached mass production, further development could provide the basis for an advanced [UKR.GetFlag] Ukrainian main battle tank.§!"
 ukr_history.63.t: "율리야 티모셴코의 체포"
 ukr_history.63.d: "전직 연료·에너지 담당 부총리가 우크라이나 통합 에너지 체계 재직 시절의 가스 밀수와 문서 위조 혐의로 루키아니우카 교도소에 수감되었습니다. 그녀는 에너지 부문의 물물교환 방식에 맞서다 1월에 해임되었고, 몇 주 만에 사건이 개시되었습니다. 법원은 구금이 불법이라고 판결하고 42일 뒤 그녀를 석방할 것입니다. 그때쯤이면 그녀는 대통령과 불화를 빚은 장관이 아니라 그에 맞서는 야권의 얼굴이 되어 있을 것입니다."
 ukr_history.63.a: "그렇다면 어쩔 수 없다."
 UKR_reorganize_navy_finish_project_133: "해안 경비대용 §G2척의 §YProject 133§! 초계함§! 건조 완료"
 UKR_reorganize_navy_finish_project_133_desc: "\n\n\n\n\n\n£UKR_desctext_project_133_for_tooltip\n\n\n\n\n\n\n\n\n§W일부 예산을 배정하여 해안 경비대용 소련 설계 'Project 133' 초계함 §G2§!척의 장기화된 건조를 마침내 끝낼 수 있습니다.§!"
 UKR_reorganize_navy_finish_11451_construction_flag: " 완료된 사건: §Y'Project 11451' 초계함 2척 건조 완료§!"
 ukraine_reorganize_navy_finish_project_133.1.name: "해안 경비대용 'Project 133' 초계함 2척 건조 완료"
 ukraine_reorganize_navy_finish_project_133.1.desc: "우리는 해안 경비대용 'Project 133' 초계함 선체 2척, 'BG53 '폴리시아''와 BG54 '슬로보잔시나'를 점검하였으며, 이제 이들의 운명에 관한 결정을 어느 방향으로 진행할지 가장 적절한 쪽을 선택할 수 있습니다.\n\n자금을 더 투입하여 두 함정의 대규모 수리를 마치거나, 상태가 더 나쁜 BG54 '슬로보잔시나'를 해체하고 그 부품으로 BG53 '폴리시아'를 더 빨리 재건할 수 있습니다."
 ukraine_reorganize_navy_finish_project_133.1.a: "두 함정을 모두 완성한다"
 ukraine_reorganize_navy_finish_project_133.1.b: "'슬로보잔시나'의 부품을 떼어 '폴리시아'를 완성한다"
 ukr_economy_rate.1.t: "우크라이나 국립은행 기준금리를 1% 인하하다"
 ukr_economy_rate.1.d: "우크라이나 국립은행이 물가 상승세 둔화와 흐리우냐 안정을 이유로 기준금리를 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓을 것으로 예상되며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다. 10년 동안 운전 자본에 굶주려 온 산업계는 마침내 이윤 전체를 잡아먹지 않는 금리로 자금을 빌릴 수 있을지도 모릅니다."
 ukr_economy_rate.1.a: "다소 저렴해진 자금"
 ukr_economy_rate.2.t: "우크라이나 국립은행 기준금리를 2% 인하하다"
 ukr_economy_rate.2.d: "우크라이나 국립은행이 물가 상승세 둔화와 흐리우냐 안정을 이유로 기준금리를 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓을 것으로 예상되며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다. 10년 동안 운전 자본에 굶주려 온 산업계는 마침내 이윤 전체를 잡아먹지 않는 금리로 자금을 빌릴 수 있을지도 모릅니다."
 ukr_economy_rate.2.a: "더욱 저렴해진 자금"
 ukr_economy_rate.3.t: "우크라이나 국립은행 기준금리를 3% 인하하다"
 ukr_economy_rate.3.d: "우크라이나 국립은행이 물가 상승세 둔화와 흐리우냐 안정을 이유로 기준금리를 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓을 것으로 예상되며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다. 10년 동안 운전 자본에 굶주려 온 산업계는 마침내 이윤 전체를 잡아먹지 않는 금리로 자금을 빌릴 수 있을지도 모릅니다."
 ukr_economy_rate.4.t: "우크라이나 국립은행 기준금리를 4% 인하하다"
 ukr_economy_rate.4.d: "우크라이나 국립은행이 물가 상승세 둔화와 흐리우냐 안정을 이유로 기준금리를 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓을 것으로 예상되며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다. 10년 동안 운전 자본에 굶주려 온 산업계는 마침내 이윤 전체를 잡아먹지 않는 금리로 자금을 빌릴 수 있을지도 모릅니다."
 ukr_economy_rate.5.t: "우크라이나 국립은행 기준금리를 29%로 인하하다"
 ukr_economy_rate.5.d: "2월 이후 우크라이나 국립은행은 물가 상승세가 둔화되고 흐리우냐가 안정세를 유지함에 따라 기준금리를 45%에서 29%로 세 차례 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓고 있으며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다."
 ukr_economy_rate.5.a: "드디어 싸진 자금"
 UKR_soviet_oob_tt: "우리 모든 부대는 소련 시대의 중대, 분대, 파견대를 기준으로 편성되어 있습니다. 전반적으로 필요한 장비는 적지만, 전투 능력도 그만큼 낮습니다."
