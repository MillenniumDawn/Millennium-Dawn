 CZE_SLO_petr_pavel_may_revolt: "§R체코 장군 페트르 파벨이 군에서 상당한 장성 계급에 오르면, 그는 새로운 개입주의 체제에 반대하며 우리나라에서 애국 전쟁을 시작할 수도 있습니다.§!"
