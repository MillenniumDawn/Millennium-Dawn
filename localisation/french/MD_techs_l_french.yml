 tech_vls_aa_1: "Missiles Sol-Air à SLV 1985"
 tech_vls_aa_1_desc: "Les missiles Sol-Air à système de lancement vertical (Vertical Launch System, VLS) frappent les cibles aériennes ennemies depuis la surface."
 tech_vls_aa_2: "Missiles Sol-Air à SLV 2000"
