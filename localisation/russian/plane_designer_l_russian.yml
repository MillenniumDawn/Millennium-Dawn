 stealth_tech_3: "Передовая стелс-технология"
 stealth_tech_3_desc: "По мере совершенствования радиолокационных технологий и снижения эффективности старых методов возникла необходимость в дальнейшем развитии материалов, обеспечивающих малозаметность, и принципов проектирования летательных аппаратов."
 stealth_tech_4: "Гиперсовременная стелс-технология"
 stealth_tech_4_desc: "По мере совершенствования радиолокационных технологий и снижения эффективности старых методов возникла необходимость в дальнейшем развитии материалов, обеспечивающих малозаметность, и принципов проектирования летательных аппаратов."
 stealth_tech_5: "Ультрасовременная стелс-технология"
 stealth_tech_5_desc: "По мере совершенствования радиолокационных технологий и снижения эффективности старых методов возникла необходимость в дальнейшем развитии материалов, обеспечивающих малозаметность, и принципов проектирования летательных аппаратов."
 internal_weapons_4: "Гиперсовременное внутреннее вооружение"
 internal_weapons_4_desc: "После жалоб пилотов истребителей на невозможность перевозки больших объемов боеприпасов из-за ограничений по размерам внутренних отсеков, конструкторы стремились еще больше увеличить эти отсеки, чтобы еще больше повысить грузоподъемность."
 internal_weapons_5: "Ультрасовременное внутреннее вооружение"
 internal_weapons_5_desc: "После жалоб пилотов истребителей на невозможность перевозки больших объемов боеприпасов из-за ограничений по размерам внутренних отсеков, конструкторы стремились еще больше увеличить эти отсеки, чтобы еще больше повысить грузоподъемность."
 naval_weapons_5: "Гиперсовременное противокорабельное вооружение"
 naval_weapons_5_desc: "Состоящие из современных самонаводящихся торпед и гиперзвуковых противокорабельных ракет, эти виды оружия обладают значительно увеличенной дальностью действия и полезной нагрузкой, позволяя уничтожать силы противника с минимальными затратами."
 naval_weapons_6: "Ультрасовременное противокорабельное вооружение"
 naval_weapons_6_desc: "Состоящие из современных самонаводящихся торпед и гиперзвуковых противокорабельных ракет, эти виды оружия обладают значительно увеличенной дальностью действия и полезной нагрузкой, позволяя уничтожать силы противника с минимальными затратами."
 special_mad_4: "Передовая технология ПЛО"
 special_mad_4_desc: "Ещё более совершенные гидроакустические системы обнаружения позволяют авиации выявлять, отслеживать и уничтожать подводные угрозы в морских боях."
 special_mad_5: "Гиперсовременная технология ПЛО"
 special_mad_5_desc: "Ещё более совершенные гидроакустические системы обнаружения позволяют авиации выявлять, отслеживать и уничтожать подводные угрозы в морских боях."
 special_mad_6: "Ультрасовременная технология ПЛО"
 special_mad_6_desc: "Ещё более совершенные гидроакустические системы обнаружения позволяют авиации выявлять, отслеживать и уничтожать подводные угрозы в морских боях."
 ag_weapons_5: "Гиперсовременное вооружение «воздух-земля»"
 ag_weapons_5_desc: "Крупные достижения в области оружия дальнего действия и планирующих авиабомб позволяют самолётам быстро поражать и уничтожать цели, порой даже не входя в зону досягаемости оружия противника."
 ag_weapons_6: "Ультрасовременное вооружение «воздух-земля»"
 ag_weapons_6_desc: "Крупные достижения в области оружия дальнего действия и планирующих авиабомб позволяют самолётам быстро поражать и уничтожать цели, порой даже не входя в зону досягаемости оружия противника."
 tgp_recon_4: "Передовые прицельные контейнеры"
 tgp_recon_4_desc: "Комплексирование датчиков, каналы передачи данных и другие возможности превращают установку прицельных контейнеров на самолёты в серьёзный умножитель боевой мощи платформы."
 tgp_recon_5: "Гиперсовременные прицельные контейнеры"
 tgp_recon_5_desc: "Комплексирование датчиков, каналы передачи данных и другие возможности превращают установку прицельных контейнеров на самолёты в серьёзный умножитель боевой мощи платформы."
 tgp_recon_6: "Ультрасовременные прицельные контейнеры"
 tgp_recon_6_desc: "Комплексирование датчиков, каналы передачи данных и другие возможности превращают установку прицельных контейнеров на самолёты в серьёзный умножитель боевой мощи платформы."
 air_tech_gunship_railgun_4: "Ганшипы с рельсотронами V"
 air_tech_gunship_railgun_4_desc: "Конструкции нового поколения оптимизируют энергоэффективность и термостабильность, а также повышают устойчивость к наведению на цель и радиоэлектронной борьбе. Это превращает боевые корабли с рельсотронами в устойчивые платформы с высокой смертоносностью, способные выживать в оспариваемом воздушном пространстве и демонтировать многоуровневую оборону по цене, которую могут оправдать только крупные державы."
 air_tech_gunship_railgun_5: "Ганшипы с рельсотронами VI"
 air_tech_gunship_railgun_5_desc: "Конструкции нового поколения оптимизируют энергоэффективность и термостабильность, а также повышают устойчивость к наведению на цель и радиоэлектронной борьбе. Это превращает боевые корабли с рельсотронами в устойчивые платформы с высокой смертоносностью, способные выживать в оспариваемом воздушном пространстве и демонтировать многоуровневую оборону по цене, которую могут оправдать только крупные державы."
 air_tech_gunship_railgun_6: "Ганшипы с рельсотронами VII"
 air_tech_gunship_railgun_6_desc: "Конструкции нового поколения оптимизируют энергоэффективность и термостабильность, а также повышают устойчивость к наведению на цель и радиоэлектронной борьбе. Это превращает боевые корабли с рельсотронами в устойчивые платформы с высокой смертоносностью, способные выживать в оспариваемом воздушном пространстве и демонтировать многоуровневую оборону по цене, которую могут оправдать только крупные державы."
 air_weapons_5: "Гиперсовременное вооружение «воздух-воздух»"
 air_weapons_5_desc: "Трёхрежимные искатели, многоимпульсные двигатели и сверхманёвренные ракеты делают это оружие самым опасным из когда-либо существовавших ракет класса «воздух-воздух»."
 air_weapons_6: "Ультрасовременное вооружение «воздух-воздух»"
 air_weapons_6_desc: "Трёхрежимные искатели, многоимпульсные двигатели и сверхманёвренные ракеты делают это оружие самым опасным из когда-либо существовавших ракет класса «воздух-воздух»."
 countermeasures_5: "Гиперсовременные средства активной защиты"
 countermeasures_5_desc: "Поскольку ракетные угрозы становится всё труднее и труднее обмануть, задача переходит от уклонения к уничтожению. Эти системы, установленные на самолётах, используют мощные лазеры для того, чтобы либо вывести из строя системы наведения на подлетающей ракете, либо взорвать боеголовку до того, как она достигнет цели."
 countermeasures_6: "Ультрасовременные средства активной защиты"
 countermeasures_6_desc: "Поскольку ракетные угрозы становится всё труднее и труднее обмануть, задача переходит от уклонения к уничтожению. Эти системы, установленные на самолётах, используют мощные лазеры для того, чтобы либо вывести из строя системы наведения на подлетающей ракете, либо взорвать боеголовку до того, как она достигнет цели."
