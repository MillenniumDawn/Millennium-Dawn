 CZE_leadership_of_pavel_belobradek_desc: "O fiasco das eleições de 2010 nos deixou fora da Câmara dos Deputados; será que Pavel Bělobrádek evitará esse destino?"
 CZE_reform_airborne: "Reformulação das Tropas Aerotransportadas"
 CZE_reform_airborne_desc: "As forças especiais representam uma ameaça muito alta na América. Eles investiram muito dinheiro e tempo para tornar suas forças especiais as melhores do mundo. Nós nos concentraremos em unidades capazes de atacar pelo ar."
