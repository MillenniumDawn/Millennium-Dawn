 SOV_buran_hangar: "부란을 구할 시간이 있다"
 SOV_buran_hangar_desc: "격납고의 열악한 상태와 우주왕복선의 전반적인 노후화로 인해, 부란을 구할 수 있는 시간은 제한적입니다."
 SOV_begin_funding: "부란의 새로운 임시 집"
 SOV_begin_funding_desc: "Move the shuttle out of the aging hangar and gather a team of skilled engineers."
 SOV_dissassemble_the_shuttle: "수리의 첫 번째 단계를 시작하기"
 SOV_dissassemble_the_shuttle_desc: "수리의 첫 번째 단계를 시작하기"
 SOV_build_hangar: "부란을 위한 새로운 영구 보관소 건설"
 SOV_build_hangar_desc: "부란 전용 격납고를 건설할 것입니다."
 SOV_make_repairs_at_temp_hangar: "임시 격납고에서 최종 수리 실시"
 SOV_make_repairs_at_temp_hangar_desc: "다음 단계는 셔틀의 구조물을 수리하고 세심하게 재조립하여 본래의 온전한 상태를 복원하는 것입니다."
 SOV_announce_full_restoration: "시험 비행을 실시하고 셔틀을 새 격납고로 이동"
 SOV_announce_full_restoration_desc: "이것이 마지막으로 필요한 단계이자 마지막 추진입니다. 지난 몇 달 동안 시험 승무원이 훈련을 마쳤으며 셔틀은 시험 비행을 할 준비가 되었습니다. 비행이 완료되면 셔틀은 새로운 영구 보관소로 옮겨져 새로운 장을 맞이하게 됩니다."
 SOV_funding_fail_likely_TT: "§R부패가 심각하여 자금이 횡령될 가능성이 높습니다!§!"
 SOV_funding_might_fail_TT: "§H부패가 만연하여 자금이 횡령될 가능성이 있습니다§!"
 SOV_funding_could_fail_TT: "§H어느 정도 부패가 존재하여 자금이 횡령될 가능성이 약간 있습니다§!"
 SOV_funding_success_TT: "§G부패가 없으므로 자금은 횡령되지 않을 것입니다§!"
 SOV_barun_disassembled_TT: "셔틀 수리가 시작됩니다"
 SOV_we_can_invest_TT: "§H기반시설을 확충하기 위해 카자흐스탄에 투자할 수 있습니다§!"
 russia.200.t: "바이코누르발 희소식"
 russia.200.d: "The Buran repair team has confirmed today that the shuttle was successfully moved out of the aging hangar, marking the beginning of its dismantling process. A team of skilled engineers has been assembled to oversee the deconstruction of the frame."
 russia.200.a: "계획대로다"
 russia.300.t: "부란 자금 횡령"
 russia.300.d: "부란 복원 계획에 배정된 자금이 횡령되어 사업에서 핵심 자원이 빠져나간 것으로 알려졌습니다. 범인을 밝혀내려는 노력은 지금까지 성과를 거두지 못했습니다. 재무 기록의 소실과 고위층의 부패가 수사를 방해하고 있습니다."
 russia.300.a: "망할!"
 russia.301.t: "찬사로 들끓는 국제 사회"
 russia.301.d: "가혹했지만 성공적이었던 부란 셔틀 수리 노력 덕분에 국제 사회는 우리의 성과에 매료되었습니다. 우리는 세계의 인정을 받는 이 순간을 붙잡고, 스포트라이트가 우리에게 머무는 동안 그 효과를 극대화할 수 있습니다."
 russia.301.a: "기술자들의 공로로 돌려라!"
 russia.301.b: "[SOV.GetLeader]의 공로로 돌려라!"
 russia.302.t: "부란 셔틀 수리 완료"
 russia.302.d: "수개월에 걸친 세심한 작업 끝에 부란 셔틀이 완전히 복원되어 우주 탐사의 새로운 장을 맞을 준비를 마쳤습니다. 모든 나사와 부품이 거듭 점검되었고, 성공적인 시험 비행으로 그 준비 상태가 입증되었습니다. 이제 앞으로의 임무에 대비하게 된 이 순간은 러시아의 승리의 순간이며, 시간 속에 묻혔다고 여겨졌던 전설적인 기체의 부활입니다."
 russia.302.a: "우주 탐사를 향한 진전!"
 russia.3022.t: "러시아가 수리한 부란 셔틀"
 russia.3022.d: "수개월에 걸친 세심한 작업 끝에 부란 셔틀이 완전히 복원되어 우주 탐사의 새로운 장을 맞을 준비를 마쳤습니다. 모든 나사와 부품이 거듭 점검되었고, 성공적인 시험 비행으로 그 준비 상태가 입증되었습니다. 이제 앞으로의 임무에 대비하게 된 이 순간은 러시아의 승리의 순간이며, 시간 속에 묻혔다고 여겨졌던 전설적인 기체의 부활입니다."
 russia.3022.a: "우주 탐사를 향한 진전!"
 russia.303.t: "격납고 화재로 파괴된 수리 중의 부란"
 russia.303.d: "2003년 6월 16일, 부란 셔틀을 수리하던 임시 격납고를 화재가 집어삼켜 완전히 파괴되는 참사가 발생했습니다. 이를 복원하고 앞으로의 임무에 대비하기 위한 모든 노력에도 불구하고 셔틀의 유산은 잿더미로 변했습니다. 그 손실은 참담했으며, 셔틀이 하늘로 승리의 귀환을 할 수도 있었던 일의 비극적인 결말이었습니다."
 russia.303.a: "이루어지지 못할 꿈"
 russia.3033.t: "격납고 화재로 파괴된 수리 중의 부란"
 russia.3033.d: "2003년 6월 16일, 부란 셔틀을 수리하던 임시 격납고를 화재가 집어삼켜 완전히 파괴되는 참사가 발생했습니다. 이를 복원하고 앞으로의 임무에 대비하기 위한 모든 노력에도 불구하고 셔틀의 유산은 잿더미로 변했습니다. 그 손실은 참담했으며, 셔틀이 하늘로 승리의 귀환을 할 수도 있었던 일의 비극적인 결말이었습니다."
 russia.3033.a: "이루어지지 못할 꿈"
 russia.304.t: "격납고 붕괴로 파괴된 부란"
 russia.304.d: "2002년 5월 12일, 부란 셔틀이 참혹한 격납고 붕괴로 소실되어 잔해 더미 속에서 그 이야기를 마감하고 다수의 사망자를 내는 비극이 발생했습니다. 한때 우주 탐사의 자랑스러운 상징이었던 기체는 폐허로 변했으며 다시는 날아오르지 못하게 되었습니다. 그토록 많은 희망과 야망을 상징했던 기체에게는 가슴 아픈 최후였습니다."
 russia.304.a: "이루어지지 못할 꿈"
 russia.3044.t: "격납고 붕괴로 파괴된 부란"
 russia.3044.d: "2002년 5월 12일, 부란 셔틀이 참혹한 격납고 붕괴로 소실되어 잔해 더미 속에서 그 이야기를 마감하고 다수의 사망자를 내는 비극이 발생했습니다. 한때 우주 탐사의 자랑스러운 상징이었던 기체는 폐허로 변했으며 다시는 날아오르지 못하게 되었습니다. 그토록 많은 희망과 야망을 상징했던 기체에게는 가슴 아픈 최후였습니다."
