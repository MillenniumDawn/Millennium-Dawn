 POR_destabilise: "Destabilise"
 POR_destabilise_desc: "Strikes nobody can settle, ministers caught saying the wrong thing, a currency that will not hold. The people we placed in the government make it look as if it cannot govern."
 POR_destabilise_tt: "We hold at least §Y3 billion§! in the treasury"
 POR_impose_protectorate: "Protectorate"
 POR_impose_protectorate_desc: "The country has been through a civil war, its government barely stands and half of its institutions answer to us. A war goal now, and it becomes our protectorate."
 POR_has_civilian_infiltration_tt: "We have infiltrated its §Ygovernment§!"
 POR_after_civil_war_tt: "It has come out of a §Ycivil war§! in the last §Ythree years§!"
 POR_resource_rights_backing_tt: "§Y[?POR_backing_winner.GetName]§! gives us the §Yresource rights§! of one of its states with natural resources"
 POR_resource_rights_client_tt: "§Y[FROM.GetName]§! gives us the §Yresource rights§! of one of its states with natural resources"
 POR_army_not_yet_infiltrated_tt: "We have not yet infiltrated its §Yarmy§!"
 POR_no_rising_running_tt: "No §Yrising§! of ours is already under way"
 POR_ops_cap_tt: "We back fewer clients than our limit of §Y[?POR_ops_cap|0]§!"
 POR_exposure_above_10_tt: "Our §YExposure§! is above §Y10§!"
 POR_has_infiltration_tt: "We have infiltrated its §Ygovernment§! or §Yarmy§!"
 POR_overseas_school_category: "The Overseas War School"
 POR_cultivate_influence: "Cultivate Influence"
 POR_cultivate_influence_desc: "A retainer here, a scholarship there, a seat on a board for a minister's brother. None of it is illegal and all of it is remembered, which is what influence is."
 POR_cultivate_influence_tt: "Costs §Y1.50§! billion"
 POR_arm_our_friends: "Arm Our Friends"
 POR_arm_our_friends_desc: "The crates leave Setubal marked as agricultural machinery and arrive as what they are. We send no Portuguese with them, which is the entire point."
 POR_arm_our_friends_tt: "Costs §Y1.00§! billion"
 POR_buy_the_officer_corps: "Buy the Officer Corps"
 POR_buy_the_officer_corps_desc: "Colonels are cheaper than wars. The ones we pay decide whether a rebellion has an army behind it or only a grievance: buying them infiltrates the army, which the Directed Rising needs."
 POR_buy_the_officer_corps_tt: "Costs §Y2.00§! billion"
 POR_burn_the_dossier: "Burn the Dossier"
 POR_burn_the_dossier_desc: "Our people come home, the accounts close and the file goes into a stove in Belem. We lose the country and we buy back the quiet."
 POR_jungle_tour: "Jungle Tour"
 POR_jungle_tour_desc: "An officer attached to a war we are already standing in, where the fighting is in the bush and nothing arrives on time. He comes back changed, or he comes back having learned nothing."
 POR_bush_war_tour: "Bush War Tour"
 POR_bush_war_tour_desc: "The wars in Angola and Mozambique are fought in forest and scrub against an enemy who never forms a line. There is no way to teach that at Amadora."
 POR_tour_tt: "Costs §Y1.50§! billion"


 ### THE TIMELINE ###
 portugal.6.t: "The Men from the Troika"
 portugal.6.d: "The rates we borrow at have passed the point where borrowing is possible, and three institutions have arrived in Lisbon with a programme already written. The money is real. So is the list of what we will do to get it: wages, pensions, the health service, the labour code, and a schedule of privatisations somebody else drew up.\n\nThe alternative is to find the money ourselves, from a market that has already decided what it thinks of us."
 portugal.6.a: "Sign the memorandum"
 portugal.6.b: "We will manage alone"
 portugal.11.t: "Timor Is Independent"
 portugal.11.d: "At midnight the flag went up in Dili and a country we governed for four hundred years, abandoned in 1975 and occupied for twenty-four, became independent. Portuguese is one of its two official languages, largely because the generation that fought the occupation chose it as the language the occupiers could not read.\n\nWe owe them something. What we do about it is a question of how we intend to be owed things by other people."
 portugal.11.a: "The obligation does not end with the flag"
 portugal.11.b: "They are a country now"
 portugal.13.t: "The Colonels in Sao Tome"
 portugal.13.d: "The army has taken the presidential palace while the president was abroad, and the officers holding it have issued the usual list of grievances about pay, corruption and the oil contracts. Nigeria is already offering to mediate.\n\nWe are the former metropole, we are owed a hearing, and nobody else in that palace speaks to Lisbon before they speak to anyone."
 portugal.13.a: "Mediate, and be seen to"
 portugal.13.b: "Deal with whoever holds the palace"

 ### EVENTS ###
 portugal.31.t: "The Rising"
 portugal.31.d: "It began before dawn. The barracks declared first, the radio station an hour later, and by the time the ministries understood what was happening the colonels were reading a proclamation over the air.\n\nNo Portuguese soldier is within a thousand kilometres of it. Every rifle in the hands of the men reading that proclamation came out of a warehouse in Setubal, and every colonel holding the capital has been on a Portuguese retainer for years."
 portugal.31.a: "They are ours"
 portugal.32.t: "A Friendly Government"
 portugal.32.d: "The war is over and our people are in the ministries. What we have is not a colony and could not survive being called one: it is a government that owes us its existence, signs what we put in front of it, and will go on doing so exactly as long as that arrangement suits both of us.\n\nThe Estado Novo spent thirteen years and a generation of conscripts trying to hold this country. We have it back for the price of a few colonels."
 portugal.32.a: "The empire was always a commercial proposition"
 portugal.34.t: "Our People Are Dead"
 portugal.34.d: "The government we tried to unseat is still there, and it has spent the last week hanging the officers we paid. The survivors have named us, at length, in front of cameras.\n\nThere is no denying this one. The only question is how much of it reaches Brussels."
 portugal.34.a: "Burn the files"
 portugal_news.1.t: "Officers Declare Against Their Government"
 portugal_news.1.d: "Army officers have declared against their government, seizing the capital's radio station and several garrison towns overnight. The rebels have announced a provisional administration and appealed for international recognition.\n\nThe government has accused unnamed foreign interests of financing the rising."
 portugal_news.1.a: "Another African war"
 portugal_news.2.t: "The Rebels Take Power"
 portugal_news.2.d: "The civil war has ended with the rebel administration in control of the capital and the outgoing government in exile. The new government has moved quickly to normalise relations with Lisbon, where officials describe the outcome as a matter for that country's citizens alone."
 portugal_news.2.a: "A matter for them alone"

 ### DYNAMIC MODIFIERS ###
 POR_shadow_network: "The Lusophone Network"
 POR_shadow_network_desc: "Chambers of commerce, seminaries, staff colleges and the men who move between them. Nothing here appears in a treaty, and all of it shortens the distance between Lisbon and a decision taken overseas."
 POR_overseas_doctrine: "Overseas Doctrine"
 POR_overseas_doctrine_desc: "Officers who have fought in the bush teach the ones who have not. The doctrine only advances while the wars are running, and it fades once our people come home."
 POR_weight_of_distance: "The Weight of Distance"
 POR_weight_of_distance_desc: "Every drum of fuel and every crate of ammunition reaches the theatre by sea, six thousand kilometres from the nearest Portuguese depot, and a good part of what is landed is stolen, sold at the roadside or written off before it reaches anyone who intended to fire it. The heavier the force we send, the more of it evaporates on the way.\n§W--------------§!\nThis modifier will be §RRemoved§! when Portuguese volunteers are no longer deployed abroad."
 POR_eu_exposure_modifier: "Under Investigation"
 POR_eu_exposure_modifier_desc: "Brussels has noticed. What began as questions from the Commission about our overseas dealings becomes, at length, a question about our standing in the Union.\n§W--------------§!\nThis modifier will be §RRemoved§! if our exposure falls below §Y15§!."

 ### NATIONAL SPIRITS ###
 POR_public_debt_1: "The Public Debt"
 POR_public_debt_1_desc: "We joined the single currency on the strength of cheap credit, and we have spent a decade borrowing against a growth rate we never achieved. Every escudo of the old debt is now denominated in a currency we cannot devalue.\n§W--------------§!\nThis national spirit will §GImprove§! each time we complete one of the §Y$POR_financial_policy$§!, §Y$POR_deficit_question$§! and §Y$POR_public_finance_council$§! focuses, and is §RRemoved§! by the third."
 POR_low_value_economy_1: "An Economy of Low Value"
 POR_low_value_economy_1_desc: "Textiles, footwear and assembly work built the republic we have, and none of it survives contact with cheaper labour elsewhere. Our firms compete on price because we have given them nothing else to compete on.\n§W--------------§!\nThis national spirit will §GImprove§! each time we complete one of the §Y$POR_education_system$§!, §Y$POR_industrial_policy$§! and §Y$POR_cohesion_funds$§! focuses, and is §RRemoved§! by the third."
 POR_heavy_state_1: "The Heavy State"
 POR_heavy_state_1_desc: "Four ministries will read a permit before anyone may pour concrete, and each of them answers to a different party. The administration is not corrupt so much as it is slow, and slowness has a price that is paid in contracts awarded to whoever waited longest.\n§W--------------§!\nThis national spirit will §GImprove§! each time we complete one of the §Y$POR_programme_of_government$§!, §Y$POR_competition_authority$§! and §Y$POR_court_of_auditors$§! focuses, and is §RRemoved§! by the third."
 POR_emigration_1: "A Nation That Leaves"
 POR_emigration_1_desc: "There are Portuguese communities in Paris, Toronto, Caracas and Johannesburg larger than most of our districts. They send money home and they do not come back, and the villages they left are older every year. What we lose in people we keep in reach.\n§W--------------§!\nThis national spirit will §GImprove§! each time we complete one of the §Y$POR_the_interior$§!, §Y$POR_web_summit$§! and §Y$POR_aima$§! focuses, and is §RRemoved§! by the second."
 POR_end_of_empire: "The End of Empire"
 POR_end_of_empire_desc: "For five hundred years this was a small country with a very long reach, and for twenty-six years it has been a small country. The language remains, the companies remain, the families remain. Only the authority is gone.\n§W--------------§!\nThis national spirit will be §RRemoved§! and replaced by the §YInformal Empire§! if we complete the §Y$POR_lusophone_realpolitik$§! focus."
 POR_informal_empire_idea: "The Informal Empire"
 POR_informal_empire_idea_desc: "We no longer govern anything overseas. We do not need to. A shared language, a shared church, a shared officer class and the banks that clear their trade will carry an instruction further than a governor ever did."
 POR_fifth_empire_idea: "The Fifth Empire"
 POR_fifth_empire_idea_desc: "Vieira promised a fifth empire after Assyria, Persia, Greece and Rome, and Pessoa promised it again in verse. Neither of them expected it to be assembled out of mining concessions, military missions and a currency board, but it is being assembled."

 ### THE PORTUGUESE LEGION ###
 POR_idea_portuguese_legion_1: "The Portuguese Legion"
 POR_idea_portuguese_legion_1_desc: "A standing pool of officers and volunteers, kept apart from the regular establishment and paid from a budget line nobody reads aloud. They train for somewhere hot, far away, and legally ambiguous."

 ### THE CLIENT LADDER ###
 POR_lusophone_presence_1: "Portuguese Presence"
 POR_lusophone_presence_1_desc: "Portuguese firms hold the shipping agency, the telephone concession and the cement works. Portuguese officers sit in on the planning. Nothing about this arrangement appears in a treaty, and everything about it appears in the trade figures."
 POR_lusophone_concession: "Portuguese Concession"
 POR_lusophone_concession_desc: "A Portuguese company runs the cement works, the cannery and the port cranes, and the profits and the output go to Lisbon. The workers go home to their own villages in the evening, which is the point: Portugal gets the factory without needing the population."
 POR_associated_dividend: "Associated State Dividend"
 POR_associated_dividend_desc: "The associated state keeps its own people and its own flag. Its factories work for Lisbon."

 ### THE ARMED FORCES ###
 POR_armed_forces: "Armed Forces"
 POR_armed_forces_desc: "Three services shaped by thirteen years of colonial war and twenty-five years of forgetting it. The equipment is old, the experience is real, and nobody in the general staff has planned for a European battlefield in their working life."
 POR_end_of_conscription: "End of Conscription"
 POR_end_of_conscription_desc: "The last conscript class leaves and is not replaced. A volunteer army is smaller, better and considerably more willing to go somewhere far away without a national debate about it."
 POR_mechanized_brigade: "Mechanized Brigade"
 POR_mechanized_brigade_desc: "Santa Margarida holds the only formation we have that could fight a conventional enemy, and it is equipped with vehicles older than the men driving them."
 POR_leopard_2a6: "Leopard 2A6"
 POR_leopard_2a6_desc: "Thirty-seven tanks from Dutch surplus, which is both a serious capability and an admission about how we intend to acquire equipment from now on."
 POR_rapid_reaction_brigade: "Rapid Reaction Brigade"
 POR_rapid_reaction_brigade_desc: "Paratroopers, commandos and special operations under one headquarters, kept at readiness for something nobody has yet defined. Defining it is the interesting part."
 POR_commandos: "Commandos"
 POR_commandos_desc: "Disbanded after the revolution for what they did before it, and reformed because an army that cannot do that kind of work has to ask someone else to."
 POR_isaf: "Kabul and Kosovo"
 POR_isaf_desc: "Portuguese battalions under NATO command in places we have no interest in whatsoever. What we get out of it is an army that has been somewhere, and allies who owe us a favour they will be asked about later."
 POR_defense_industry: "Defense Industry"
 POR_defense_industry_desc: "Braco de Prata, OGMA and the Alfeite yard have been kept alive on sentiment and state orders. Given real work, and real protection, they become a constituency of their own."
 POR_intelligence_system: "Intelligence System"
 POR_intelligence_system_desc: "Two services, one civil and one military, and a coordinating office that exists mainly so the Assembly has somebody to question. Properly funded, it is what keeps our own affairs out of other people's files."

 ### THE PORTUGUESE SEA ###
 POR_portuguese_sea: "Portuguese Sea"
 POR_portuguese_sea_desc: "An exclusive economic zone larger than the European Union, patrolled by a navy that can put perhaps four ships to sea at once. The sea is the one thing we have more of than anyone."
 POR_alfeite_arsenal: "Alfeite Arsenal"
 POR_alfeite_arsenal_desc: "The yard can refit anything we own and build very little of it. That is a choice rather than a fact, and it can be unmade."
 POR_bartolomeu_dias_frigates: "Bartolomeu Dias Frigates"
 POR_bartolomeu_dias_frigates_desc: "Two Karel Doorman hulls bought from the Dutch, modern enough to escort anything we might want escorted and cheap enough that the Assembly approved them without argument."
 POR_tridente_submarines: "Tridente Submarines"
 POR_tridente_submarines_desc: "Two German boats, air independent, quiet, and completely disproportionate to any threat facing Portugal in European waters. They are not for European waters."
 POR_exclusive_economic_zone: "Exclusive Economic Zone"
 POR_exclusive_economic_zone_desc: "Fisheries, cables, seabed minerals and the licensing of all three. The maritime industry becomes the constituency that funds the navy that protects the maritime industry."
 POR_lajes_field: "Lajes Field"
 POR_lajes_field_desc: "The Americans have used the Azores since the war and will go on paying for the privilege. An airfield in the middle of the Atlantic is worth more to a country with business on the far side of it."
 POR_air_force: "Air Force"
 POR_air_force_desc: "Search and rescue, air policing, and a fighter fleet that exists to be counted by NATO. What it lacks entirely is the ability to put anything anywhere."
 POR_f16_mlu: "F-16 Mid-Life Update"
 POR_f16_mlu_desc: "The airframes are sound and the electronics are twenty years old. Rebuilding them costs a fraction of replacing them and buys another twenty years."
 POR_kc_390: "KC-390"
 POR_kc_390_desc: "A Brazilian transport with Portuguese work on the airframe, bought because it can reach Luanda and Maputo without asking anyone for a landing. Nobody says that part aloud."

 ### THE AIR FORCE ###
 POR_retiring_the_alpha_jet: "Retiring the Alpha Jet"
 POR_retiring_the_alpha_jet_desc: "The attack squadron at Beja is disbanded and its aircraft sold. It is the right decision, it saves real money, and it means that if we ever want that capability again we will be buying it from somebody else."
 POR_air_force_academy: "Air Force Academy"
 POR_air_force_academy_desc: "Sintra trains every pilot we have on aircraft older than most of them. Keeping the training fleet flying costs a fraction of the squadrons and produces the only thing we cannot buy abroad."
 POR_p3_upgrade: "P-3 Upgrade"
 POR_p3_upgrade_desc: "Five Orions bought secondhand from the Dutch and rebuilt with new sensors. They are the only aircraft in the inventory that can search an ocean, which happens to be the thing we have most of."
 POR_c295: "C-295"
 POR_c295_desc: "A dozen light transports to replace the Aviocars, half of them fitted for maritime patrol. OGMA does the work, which keeps a Portuguese aerospace industry in existence for another generation."
 POR_merlins: "Merlins"
 POR_merlins_desc: "Twelve EH-101s for search and rescue and for the islands. They are the aircraft that reaches a fishing boat four hundred kilometres out in the Atlantic, and there is no substitute for them anywhere in the inventory."
 POR_monte_real_and_beja: "Monte Real and Beja"
 POR_monte_real_and_beja_desc: "Two airfields kept to a standard that lets somebody else's air force operate from them. That is worth more to our allies than anything we could put in the air ourselves."
 POR_tekever: "Tekever"
 POR_tekever_desc: "A Portuguese firm building unmanned aircraft that are now watching the Atlantic for half of Europe. It is the first thing this country has exported in a generation that nobody else could have sold us."
 POR_air_policing: "Air Policing"
 POR_air_policing_desc: "Portuguese fighters standing alert over the Baltic and Iceland, intercepting aircraft belonging to a country we have no quarrel with. It is what a small air force does to matter, and the flying hours are real."
 POR_fifth_generation_fighter: "Fifth Generation"
 POR_fifth_generation_fighter_desc: "The F-16s cannot fly forever and the replacement costs more than the air force's entire budget for a decade. Everyone knows what the answer will be. Nobody wants to be the government that signs it."

 ### THE FIFTH EMPIRE ###
 POR_fifth_empire: "Fifth Empire"
 POR_fifth_empire_desc: "Vieira preached it from the pulpit and Pessoa wrote it into verse: after Assyria, Persia, Greece and Rome, a fifth empire, and Portuguese. Neither of them expected it to arrive as a currency board and a mining concession, but it has."
 POR_overseas_empire: "Overseas Empire"
 POR_overseas_empire_desc: "We stop calling it intervention. A state with governments of its own making on three continents has interests to defend there, and the law will be written to say so."
 POR_imperial_conference: "Imperial Conference"
 POR_imperial_conference_desc: "Every government that owes us its existence, in one room in Lisbon, asked a question none of them can answer casually: whether the arrangement they live under should have a name and a parliament."
 POR_imperial_conference_tt: "We have at least §Y2§! Lusophone client governments"
 POR_lusophone_federation: "Lusophone Federation"
 POR_lusophone_federation_desc: "Those who agreed come in as provinces of a single state, with their armies, their leaders and their seats. Those who refused stay exactly as they were, which is the proof that the ones who agreed were asked.\n\nFive hundred years late, and by an entirely different route."
 POR_lusophone_federation_tt: "At least §Y1§! of our subjects has §Gagreed§! to federate"
 POR_federation_category: "The Imperial Conference"
 POR_summon_to_the_conference: "Summon to the Conference"
 POR_summon_to_the_conference_desc: "The invitation is not a demand. It is put to the government concerned, and the government concerned answers."
 POR_apply_pressure: "Apply Pressure"
 POR_apply_pressure_desc: "We remind a reluctant government of what it owes, who pays its army, and how recently it did not exist. It will be asked again, and it will resent us for it."
 portugal.60.t: "The Question of Federation"
 portugal.60.d: "Lisbon proposes that the arrangement under which we live be made permanent and given a name. We would send members to a federal parliament, our army would become a component of a federal army, and our foreign policy would be made in a city we do not live in.\n\nWhat is being offered is a share in something larger. What is being asked is the last thing we have that is entirely ours."
 portugal.60.a: "Accede to the federation"
 portugal.60.b: "We will remain sovereign"
 portugal.61.t: "They Have Agreed"
 portugal.61.d: "The delegation has accepted the terms. Their parliament will ratify, because their parliament is composed of people who understand what happened to the last government that did not."
 portugal.61.a: "Welcome them"
 portugal_news.5.t: "Portugal Summons an Imperial Conference"
 portugal_news.5.d: "Lisbon has invited the governments of several Lusophone states to a conference on what Portuguese officials are calling a community of destiny. Observers note that every government invited came to power with Portuguese assistance, and that none of them has declined to attend."
 portugal_news.5.a: "A community of destiny"
 portugal_news.6.t: "The Lusophone Federation Is Proclaimed"
 portugal_news.6.d: "Portugal and the states that accepted its terms have proclaimed a federal union, pooling their armies and foreign policy under a parliament sitting in Lisbon. States that declined remain formally sovereign.\n\nIt is the largest voluntary transfer of sovereignty since the European treaties, and almost nobody outside the federation believes the word voluntary."
 portugal_news.6.a: "Five centuries late"
 ### THE IDEOLOGICAL QUESTION ###
 POR_ideology_shortcut: "Ideology"
 POR_navy_shortcut: "The Navy"
 POR_army_shortcut: "The Army"
 POR_air_shortcut: "The Air Force"
 POR_lusophone_shortcut: "Lusophone World"
 POR_economy_shortcut: "Economy"
 POR_ideological_question: "Ideological Question"
 POR_ideological_question_desc: "A quarter of a century after the revolution the parties agree on the constitution, the currency, the alliance and the budget. What is left to argue about is everything else, and the country is about to find out how much that is."
 POR_ideological_development_up_tt: "£drift_defence_texticon  §YIdeological Development§!: §G+[?POR_ideo_add]§!"
 POR_ideological_development_down_tt: "£drift_defence_texticon  §YIdeological Development§!: §R-[?POR_ideo_sub]§!"
 POR_ruling_party_has_support_tt: "[ROOT.GetRulingParty] polls above §Y15%§!"
 POR_has_an_opposition_tt: "Some party outside the government has support worth taking"
 POR_revolt_has_support_tt: "An outlook outside the government holds more than §Y34%§! of the country"
 POR_the_left_governs_tt: "The £POR_anarchist_communism CDU, £POR_non_aligned_socialist_democrat Bloco de Esquerda, £POR_non_aligned_communism PCTP or £POR_emerging_communism POUS is in government"
 POR_the_atlanticists_govern_tt: "The £POR_western_conservative PSD, £POR_western_liberal Nos Cidadaos or £POR_western_social_democrat PS is in government"
 POR_the_national_right_governs_tt: "The £POR_non_aligned_conservative CDS-PP, £POR_Nat_Populism PNR, £POR_Nat_Autocracy Exercito Portugues or £POR_nationalist_monarchist Braganca is in government"
 POR_unions_are_behind_us_tt: "The §Ylabour unions§! stand with the government"
 POR_the_streets_are_out_tt: "§YProtest§! is above §Y25§!"

 ### THE BATTLE OF IDEAS ###
 POR_battle_of_ideas: "Battle of Ideas"
 POR_battle_of_ideas_desc: "Portuguese politics is conducted by four families who went to the same law faculty and disagree about the distribution of posts. Widening that into a disagreement about the country is a deliberate act, and it is about to be committed."
 POR_party_press: "Party Press"
 POR_party_press_desc: "Every serious paper acquires a line, every line acquires a proprietor, and the reader learns to work out what happened by reading two of them. It raises the temperature of everything and nobody can now afford to stop."
 POR_institutes: "Institutes"
 POR_institutes_desc: "Foundations with Latin names and bank funding, publishing papers that arrive in ministries before the ministers have had the argument. The policy is decided outside the building and ratified inside it."
 POR_militant_youth: "Militant Youth"
 POR_militant_youth_desc: "The party youth wings stop being a route to a safe seat and start being the reason a rally has a thousand people in it. Their elders find them useful, and then find them difficult."
 POR_political_university: "Political University"
 POR_political_university_desc: "The faculties that trained the administrators of the Estado Novo and then the cadres of the revolution take a third turn. Whoever holds the lecture halls holds the next generation of permanent secretaries."
 POR_cultural_hegemony: "Cultural Hegemony"
 POR_cultural_hegemony_desc: "The point is not to win the election. The point is to make the other side's position sound like something no decent person would say aloud, and then win every election."
 POR_national_consensus: "National Consensus"
 POR_national_consensus_desc: "The party leaders meet without cameras and agree that some questions are above politics. It is the most cynical thing any of them does and it is probably what keeps the country governable."
 POR_cause_of_the_oppressed: "Cause of the Oppressed"
 POR_cause_of_the_oppressed_desc: "Portugal discovers that its foreign entanglements are not entanglements at all but solidarity with the wretched of the earth. The wretched of the earth are not consulted, but they are, on the whole, glad of the rifles."
 POR_cause_of_the_oppressed_effect_tt: "§YForeign clients§! pay §G25%§! more in influence and rewards"

 ### PUBLIC OPINION ###
 POR_public_opinion: "Public Opinion"
 POR_public_opinion_desc: "Polling arrives in Portuguese politics late and then all at once. Within a decade no party leader makes a speech that has not been tested on four hundred people in Setubal first."
 POR_party_machine: "Party Machine"
 POR_party_machine_desc: "Membership rolls, local branches, a name on every parish council and a favour owed in every one. It is not glamorous and it decides more elections than any manifesto."
 POR_taking_to_the_streets: "Taking to the Streets"
 POR_taking_to_the_streets_desc: "The government discovers that a crowd of its own is worth more than a majority in the chamber. It is also a crowd, and crowds do not go home when the speeches end."
 POR_capturing_the_centre: "Capturing the Centre"
 POR_capturing_the_centre_desc: "The opposition's least committed voters are identified, addressed in their own language, and offered most of what they wanted from the other side. They come across, and they bring their opinions with them."
 POR_permanent_agitation: "Permanent Agitation"
 POR_permanent_agitation_desc: "Government by campaign. There is always a demonstration next Saturday, always an enemy named on Thursday, and the country never quite returns to room temperature."
 POR_general_strike: "General Strike"
 POR_general_strike_desc: "The two confederations call the same strike on the same day for the first time since the seventies. The trains stop, the ports stop, and the government finds out exactly who it governs with."
 POR_state_of_exception: "State of Exception"
 POR_state_of_exception_desc: "Public order legislation drafted for football crowds is discovered to cover political assembly. The streets empty within a fortnight, and something in the republic does not come back."
 POR_revolutionary_rupture: "Revolutionary Rupture"
 POR_revolutionary_rupture_desc: "What a quarter of the country believes becomes what the state is, on a Tuesday, without an election. The side that held the chair yesterday does not accept it, and it has men who were soldiers."

 ### INTERNATIONAL SOLIDARITY ###
 POR_international_solidarity: "International Solidarity"
 POR_international_solidarity_desc: "A small country on the edge of Europe has one real foreign policy question: whose argument is it joining. Lisbon has spent five centuries answering that with geography and is about to try answering it with ideology."
 POR_ideological_alignment: "Ideological Alignment"
 POR_ideological_alignment_desc: "The foreign ministry is instructed to stop treating every capital the same. Which capitals get the new treatment depends entirely on who won the last election at home, which is the point and also the flaw."
 POR_beijing_axis: "Beijing Axis"
 POR_beijing_axis_desc: "Portugal handed back its last Asian territory in 1999 and kept the relationship. A left government in Lisbon finds Beijing willing to lend without lectures, and discovers what the lectures were for."
 POR_atlantic_front: "Atlantic Front"
 POR_atlantic_front_desc: "The alliance that has underwritten Portuguese security since 1949, restated as a choice rather than an inheritance. Lajes stays open, the technology transfer improves, and the price is never written down."
 POR_sovereigntist_bloc: "Sovereigntist Bloc"
 POR_sovereigntist_bloc_desc: "A correspondence between parties that all describe themselves as the last defenders of their own nation, conducted in careful English. That it works at all is the surprise."
 POR_macau_arrangement: "Macau Arrangement"
 POR_macau_arrangement_desc: "Fifty years of guaranteed Portuguese law in a Chinese city, and a hundred thousand passport holders. Lisbon stops treating it as a loose end and starts treating it as a door."
 POR_brics_road: "BRICS Road"
 POR_brics_road_desc: "A European Union member applying to the club of countries organised against European lecturing. Brasilia thinks it is funny, Brussels does not, and the trade figures make the case on their own."
 POR_lusophone_international: "Lusophone International"
 POR_lusophone_international_desc: "Nine countries, two hundred and eighty million people, one language and no common interest whatsoever. Lisbon proposes to supply the interest."
 POR_lisbon_doctrine: "Lisbon Doctrine"
 POR_lisbon_doctrine_desc: "Stated plainly for the first time: Portugal has legitimate concerns wherever Portuguese is spoken, and the means to act on them are a domestic matter. Nobody in Brussels asked for the clarification."
 POR_lisbon_doctrine_effect_tt: "Reduces §YEuropean exposure§! by §G10§! and puts the doctrine on the record"

 ### THE RUPTURE ###
 portugal_news.8.t: "Power Changes Hands in Lisbon"
 portugal_news.8.d: "The government of Portugal has been replaced outside the electoral calendar, by a movement that claims to represent a majority the ballot box was not measuring. Its opponents have withdrawn from the capital and are no longer answering the ministry of defence.\n\nEuropean foreign ministries have issued the statement they keep for these occasions, in which the word democratic appears four times and the word recognition does not appear at all."
 portugal_news.8.a: "The argument is over"
 ### THE SCHOOLS OF THE ARMY ###
 POR_school_of_doctrine: "School of Doctrine"
 POR_school_of_doctrine_desc: "Twenty-six thousand professional soldiers and no settled answer to what they are for. The Instituto de Estudos Superiores Militares is asked to produce one, and the answer will determine every procurement decision for a generation."
 POR_defence_in_depth: "Defence in Depth"
 POR_defence_in_depth_desc: "The school that assumes the enemy gets in and plans for what happens next. Ground is traded, the line bends, and the counterattack comes at a place the attacker chose to reach and not to hold."
 POR_light_warfare_school: "Light Warfare School"
 POR_light_warfare_school_desc: "Commandos, paratroopers, marines and mountain troops, moved by whatever will carry them and supplied by whatever is already there. It suits a country that cannot afford weight and keeps finding itself a long way from home."
 POR_armoured_shock_school: "Armoured Shock School"
 POR_armoured_shock_school_desc: "A brigade of Leopards and Pandurs that exists to punch a hole and be somewhere else by evening. It is the most expensive answer on the table and the only one that impresses allies."
 POR_general_staff: "General Staff"
 POR_general_staff_desc: "Whichever school wins, somebody has to write the orders. The staff college is rebuilt around the doctrine actually chosen rather than the one in the last set of manuals."

 ### THE SCHOOLS OF THE NAVY ###
 POR_naval_school: "Naval School"
 POR_naval_school_desc: "An exclusive economic zone the size of a continent, a fleet of eleven serious hulls, and a professional argument about which eleven they should be. The Escola Naval at Alfeite settles it, slowly."
 POR_surface_squadron: "Surface Squadron"
 POR_surface_squadron_desc: "Frigates that can screen a task group, work with allies, and show a flag in a harbour where a flag is what is needed. Expensive per hull and the only ships anyone else counts."
 POR_sea_denial: "Sea Denial"
 POR_sea_denial_desc: "The school that gives up on controlling the Atlantic and concentrates on making it unusable to anyone else. Two submarines that nobody can find are worth more than six frigates everyone can."
 POR_multipurpose_ship: "Multipurpose Ship"
 POR_multipurpose_ship_desc: "A hull that carries a battalion, a hospital, six helicopters and a landing dock, argued about for twenty years before anyone cuts steel. It turns the navy from a coastguard into a way of arriving somewhere."
 POR_ocean_patrol: "Ocean Patrol"
 POR_ocean_patrol_desc: "Cheap hulls built at Viana do Castelo to do the work nobody writes doctrine about: fisheries, search and rescue, smuggling and the endless business of being seen in one's own water."
 POR_naval_command: "Naval Command"
 POR_naval_command_desc: "Sensors, datalinks and a command centre that can hold a picture of the whole Atlantic approach. Portugal cannot fill that ocean with ships, so it fills it with information instead."

 ### THE SCHOOLS OF THE AIR FORCE ###
 POR_multirole_fighter: "Multirole Fighter"
 POR_multirole_fighter_desc: "One airframe that intercepts in the morning and drops ordnance in the afternoon, at the price of being second best at both. For an air force of this size the argument answers itself, which does not stop it being had."
 POR_air_superiority: "Air Superiority"
 POR_air_superiority_desc: "The school that says the first job of an air force is to own the sky and everything else is a consequence. It buys fewer aircraft, trains them harder, and asks the army to wait."
 POR_drone_warfare: "Drone Warfare"
 POR_drone_warfare_desc: "Tekever builds airframes in Ilhavo that loiter for twelve hours and cost less than a helicopter's engine. The air force resists them until the navy starts ordering them directly."
 ### INTERVENTION ###
 POR_holds_a_client_tt: "We are running at least one §Yclient§! or hold at least one §YLusophone subject§!"
 POR_madrid_is_ready_tt: "Spain is §Yisolated or unstable§!, we hold §Y60§! network strength there with §Yboth§! infiltrations, our §Yideological development§! is above §Y60§!, and we are already running §Ytwo clients§!"
 POR_galicia_is_ready_tt: "Spain is §Yat war with itself§!, or the government we installed sits in Madrid"

 ### THE INSTRUMENTS ###
 POR_sied: "SIED"
 POR_sied_desc: "Portugal has had no foreign intelligence service worth the name since the political police were dissolved, on the reasonable grounds that the last one had been used on Portuguese people. The new one is written to a narrower remit, which is a promise about premises rather than about conduct."
 POR_sied_agency_tt: "Establishes the §YServico de Informacoes Estrategicas de Defesa§!"
 POR_operations_section: "Operations Section"
 POR_operations_section_desc: "The part of the service that does things rather than reads about them. It has no statutory basis, a budget line called technical support, and a corridor of its own. An officer it loses abroad is bargained back, never disowned."
 POR_economic_diplomacy: "Economic Diplomacy"
 POR_economic_diplomacy_desc: "A trade delegation attached to every embassy in the Lusophone world, staffed by people the banks pay and the ministry accredits. Nobody has to be told which is which."
 POR_special_actions_detachment: "Special Actions Detachment"
 POR_special_actions_detachment_desc: "Naval special forces trained for ship boarding and hostage recovery, and available at four hours' notice for anything the operations section can describe as either."
 POR_mining_concession: "Mining Concession"
 POR_mining_concession_desc: "A thirty-year licence, a road that happens to reach a port, and a share of the revenue that is settled in Lisbon. The host government signs it because the alternative concession is Chinese."

 ### NEO-COLONIALISM ###
 POR_directed_rising: "Directed Rising"
 POR_directed_rising_desc: "The difference between funding a coup and running one is whether our people are in the room when it happens. From here they are."
 POR_operation_directed_rising: "Directed Rising"
 POR_operation_directed_rising_desc: "Our officers inside the target's army move at the same hour as our people inside its ministries. The rising has a plan, a cabinet and a radio station before the loyalists have an order."
 POR_operation_directed_rising_unlocked_tt: "Unlocks the §YDirected Rising§! operation in the countries opened in §YLusophone Realpolitik§! where our intelligence network is strong enough"
 POR_operation_directed_rising_outcome_tt: "Starts a §Rcivil war§! in the target, with the rebels carrying our politics"
 POR_war_by_proxy: "War by Proxy"
 POR_war_by_proxy_desc: "Our wars are fought by other people's armies. The intelligence service learns to run them at arm's length, and to make sure the trail never leads back to Lisbon."
 POR_defence_agreement: "Defence Agreement"
 POR_defence_agreement_desc: "A standing agreement on training, basing and overflight, signed by governments that owe us their existence. The word alliance appears nowhere in it."
 POR_economic_protectorate: "Economic Protectorate"
 POR_economic_protectorate_desc: "The currency is pegged to ours, the customs service is advised by ours, and the sovereign debt is held by our banks. Sovereignty is intact in every particular that can be photographed."

 ### THE OPEN HAND ###
 POR_nationals_at_risk: "Nationals at Risk"
 POR_nationals_at_risk_desc: "Portuguese is spoken in Brazil, something close to it is spoken in Galicia, and Portugal built the Cahora Bassa dam. When any of them falls into civil war, there are people and interests of ours on the ground, and a reason to send troops that the troops do not have to believe. From here the general staff is asked for plans rather than assessments."
 POR_madrid_operation: "Madrid Operation"
 POR_madrid_operation_desc: "Spain has been the answer to every Portuguese strategic question since 1143, and the answer has always been no. This is the file that assumes otherwise, and everyone who has read it understands that reading it is already a decision."
 POR_madrid_operation_decision: "The Madrid Operation"
 POR_madrid_operation_decision_desc: "Six months, twenty billion, and every asset we hold inside a fellow member of NATO and the European Union. If it fails, it is the end of Portugal as a country other countries talk to."
 POR_madrid_operation_decision_tt: "We hold at least §Y20 billion§! in the treasury"
 POR_aid_landing_ground: "Establish an Aid Landing Ground"
 POR_aid_landing_ground_desc: "Brazil is an ocean away, and nobody can help anyone in its civil war from Lisbon. Help needs a landing ground first: a port, an airfield and a province around them that answers to us. Espírito Santo has the port at Vitória and an airfield, and while Brazil is busy with itself, nobody is in a position to say no."
 POR_aid_landing_ground_tt: "We hold at least §Y10 billion§! in the treasury"
 POR_brazil_in_civil_war_tt: "§YBrazil§! is fighting a civil war"
 POR_aid_landing_ground_state_tt: "§YEspírito Santo§! is held by a Brazilian side that is not at war with us"
 POR_protect_galicians: "Protect the Portuguese Galicians"
 POR_protect_galicians_desc: "Galician is a dialect of Portuguese or its sister, depending on which university you ask, and the people who speak it are suddenly in the middle of someone else's civil war. Lisbon has discovered a duty to protect them. The Galicians were not consulted, and the troops crossing the Minho do not intend to leave."
 POR_spain_in_civil_war_tt: "§YSpain§! is fighting a civil war"
 POR_protect_galicians_state_tt: "§YGalicia§! is held by a Spanish side that is not at war with us"
 POR_secure_cahora_bassa: "Secure Cahora Bassa"
 POR_secure_cahora_bassa_desc: "Portugal built the Cahora Bassa dam and owned most of it until 2007. A civil war in Mozambique puts the turbines that light half of southern Africa in someone's line of fire, and the old shareholder sends troops to stand in front of them. They will need the whole of Tete province to do it."
 POR_secure_cahora_bassa_tt: "We hold at least §Y6 billion§! in the treasury"
 POR_mozambique_in_civil_war_tt: "§YMozambique§! is fighting a civil war"
 POR_secure_cahora_bassa_state_tt: "§YTete§! is held by a Mozambican side that is not at war with us"
 POR_madrid_coup_aborted_tt: "§RSpain was already at war with itself when the hour came, and the operation was stood down§!"
 POR_galicia: "Galicia"
 POR_galicia_desc: "Four provinces that speak a language which is either a dialect of Portuguese or its sister, depending on which university is asked. The question has been academic for five hundred years and is about to stop being."

 ### PROVINCES TAKEN IN A CIVIL WAR ###
 portugal.41.t: "The Province After the War"
 portugal.41.d: "The civil war is over and the government that came out of it is one we helped into office. Our troops still hold the province we took while the fighting lasted. Nobody in the new government has asked for it back, which leaves us to decide what it becomes."
 portugal.41.a: "Hand it back to our friends"
 portugal.41.b: "It stays ours"
 portugal.42.t: "They Want the Province Back"
 portugal.42.d: "The war is over and the government that won it has written to Lisbon. Its first note is polite, cites every treaty our two countries have ever signed, and asks when our forces will be leaving the province they took while the country was at war with itself."
 portugal.42.a: "Withdraw the garrison"
 portugal.42.b: "The note goes unanswered"
 portugal_news.9.t: "Fighting in Spain"
 portugal_news.9.d: "A rising has broken out across Spain, led by officers and officials whose politics are, by a coincidence that nobody in Brussels believes, identical to those of the government in Lisbon. Spanish state television is off the air in four regions.\n\nThe Portuguese foreign ministry has expressed its concern and its hope for a swift return to constitutional order."
 portugal_news.9.a: "Nine hundred years of the same border"
 portugal_news.10.t: "Portugal Lands in Espírito Santo"
 portugal_news.10.d: "Portuguese troops have landed at Vitória and taken over the port, the airfield and the state of Espírito Santo around them. Lisbon calls it an aid landing ground for a Brazil at war with itself, the only way help can reach a country an ocean away. Neither side in the civil war asked for the help."
 portugal_news.10.a: "Help from across the ocean"
 portugal_news.20.t: "Portuguese Troops Secure Cahora Bassa"
 portugal_news.20.d: "Portuguese troops have taken control of the Cahora Bassa dam and the province of Tete around it. Lisbon says the dam Portugal built must be kept out of Mozambique's civil war. The dam's customers, from Harare to Pretoria, are watching to see whether the troops leave when the war does."
 portugal_news.20.a: "The lights stay on"
 portugal_news.11.t: "Galicia Joins Portugal"
 portugal_news.11.d: "The four Galician provinces have been incorporated into the Portuguese Republic. The frontier posts at Valenca and Tui were removed overnight and the language academies of both countries have issued a joint statement which carefully avoids saying whether one language or two has been reunited.\n\nNo European government has recognised the transfer. Several have declined to say that they will not."
 portugal_news.11.a: "The question was academic"
 ### THE SECOND SCHOOLS ###
 POR_territorial_defence: "Territorial Defence"
 POR_territorial_defence_desc: "The elastic defence taken to its conclusion: prepared positions, surveyed artillery and a mainland that costs more to take than it is worth. It is the cheapest form of deterrence and the one nobody gets promoted for."
 POR_counter_subversion: "Counter-Subversion"
 POR_counter_subversion_desc: "Thirteen years in Africa produced a body of doctrine on fighting people who do not wear uniforms, and then the country spent thirty years not reading it. Afghanistan, Lebanon and the Central African Republic put it back on the syllabus."
 POR_decisive_battle: "Decisive Battle"
 POR_decisive_battle_desc: "Find the seam, put everything through it, and be somewhere the enemy did not plan for by nightfall. It asks for self-propelled fires, fuel and a staff that can write orders faster than the other side can read them."
 POR_fighting_squadron: "Fighting Squadron"
 POR_fighting_squadron_desc: "Hulls that can hold an air-defence picture over a task group and shoot at something four hundred kilometres away. Every one of them costs what four patrol vessels cost, and the argument about whether that is the right trade has been running since the eighteenth century."
 POR_missile_boats: "Missile Boats"
 POR_missile_boats_desc: "The other answer to a small navy: do not try to hold the sea, just make certain nobody else can use it. A cheap hull with an expensive weapon, hiding in water Portugal has charted and nobody else has."
 POR_aviation_ship: "Aviation Ship"
 POR_aviation_ship_desc: "A deck that can fly fixed-wing aircraft, five hundred years after the last time Portuguese ships decided where in the world anything happened. The budget for it does not exist; that has never stopped the argument."
 POR_long_shot: "Long Shot"
 POR_long_shot_desc: "Radar, datalink and a missile that arrives before the other pilot knows the engagement began. It is not flying in any sense a pilot would recognise, and it wins."
 POR_close_air_support: "Close Air Support"
 POR_close_air_support_desc: "The air force is reminded, at some length and by the army, that its purpose includes being overhead when a Portuguese company is in contact three thousand kilometres from Lisbon."
 POR_air_bridge: "Air Bridge"
 POR_air_bridge_desc: "Tankers, transports and a radar picture that can be flown to wherever it is needed. An expeditionary country that cannot move itself is a country with opinions rather than a policy."
 ### THE CAMPAIGNS ###
 POR_campaigns: "Campaigns"
 POR_campaigns_desc: "The instruments exist. What follows is the list of places to use them, and every one of them has a specific quarrel Portugal can be useful in."

 ### ANGOLA ###
 POR_estoril_observers: "Estoril Observers"
 POR_estoril_observers_desc: "Portugal, the United States and Russia sit as observers on the commission that watches the Angolan settlement, which means Portugal sits in a room with the government and what is left of the movement it fought, and is trusted by neither. Both talk to it anyway, because there is nobody else who speaks to both. If the war is still running, the same seats serve as a channel to both sides."
 POR_luena_memorandum: "Luena Memorandum"
 POR_luena_memorandum_desc: "Two settlements of this war were signed and broken, the Bicesse Accords in 1991 and the Lusaka Protocol in 1994. The third, signed at Luena in April 2002 after Savimbi was killed, is the one that held, and Lisbon helps to carry it out: cantonment camps, an amnesty and places in the national army for the officers who lost. Then comes the money. Reconstruction contracts for the bridges and the railways, Galp beside Sonangol in the offshore blocks, and the diamond concessions of the Lunda riverbeds that paid for both armies. Whoever holds the pen when the shooting stops owns a share of the peace."
 POR_luena_memorandum_effect_tt: "Portugal is the §Yguarantor§! of the Angolan settlement and takes a share of its §Yreconstruction, oil and diamond§! contracts"

 ### GUINEA-BISSAU ###
 POR_embassy_in_bissau: "Embassy in Bissau"
 POR_embassy_in_bissau_desc: "Every officer above major did his staff course in Lisbon, every minister's children are at school in Portugal, and the embassy is the largest building in the city that still has a working generator."

 ### MOZAMBIQUE ###
 POR_cahora_bassa: "Cahora Bassa"
 POR_cahora_bassa_desc: "The largest dam in southern Africa, built by Portugal in 1974 and still owned by it a quarter of a century after the country around it became independent. Maputo would like it back. Everything else follows from the price."
 POR_technical_military_cooperation: "Technical-Military Cooperation"
 POR_technical_military_cooperation_desc: "Portuguese instructors at Boane and Mozambican officers at Pedroucos, under an agreement signed so quietly that the parliament in Lisbon was told afterwards."
 POR_rovuma_gas: "Rovuma Gas"
 POR_rovuma_gas_desc: "The largest gas find in a generation, offshore of the poorest province in the country, and an insurgency ashore that started the year the platforms were ordered. Nobody involved thinks those two facts are unrelated."
 POR_rovuma_tt: "We hold more than §Y30%§! influence in Mozambique"

 ### EAST TIMOR ###
 POR_portuguese_in_timor: "Portuguese in Timor"
 POR_portuguese_in_timor_desc: "A country where five per cent speak Portuguese chooses it as an official language, because the generation that led the resistance conspired in it and the generation that occupied them did not. Lisbon pays for the teachers."

 ### EQUATORIAL GUINEA ###
 POR_lusophony_of_malabo: "Lusophony of Malabo"
 POR_lusophony_of_malabo_desc: "A country where almost nobody speaks Portuguese makes it an official language and joins the CPLP, in exchange for the community declining to discuss its prisons. Both sides know exactly what the transaction is."

 ### CABINDA ###
 POR_treaty_of_simulambuco: "Treaty of Simulambuco"
 POR_treaty_of_simulambuco_desc: "In 1885 the princes of Cabinda placed themselves under Portuguese protection as a separate territory from Angola. Every Cabindan separatist argument since has begun with that sentence, and Lisbon has spent a century declining to finish it."
 POR_flec_of_cabinda: "FLEC of Cabinda"
 POR_flec_of_cabinda_desc: "A separatist front split into factions, an enclave producing most of Angola's oil, and a Portuguese-speaking exile leadership in Paris and Lisbon that has been waiting thirty years for a telephone call. The insurgency in the enclave outlasts the main war by years."
 POR_republic_of_cabinda: "Republic of Cabinda"
 POR_republic_of_cabinda_desc: "Sixty thousand barrels a day, seven hundred thousand people, and a border with Angola that only exists on the maps Portugal drew. It is declared on a morning when Luanda is looking somewhere else."

 ### CAPE VERDE ###
 POR_exchange_rate_agreement: "Exchange Rate Agreement"
 POR_exchange_rate_agreement_desc: "The escudo is pegged to the Portuguese escudo and then to the euro, guaranteed by a credit line from Lisbon. It is the single most consequential thing Portugal does for any of these countries and it never makes a newspaper."
 POR_associated_state: "Associated State"
 POR_associated_state_desc: "A currency issued against Portuguese reserves, a diaspora larger than the resident population, and a free movement arrangement. At some point somebody is going to ask what the difference is."
 POR_associated_state_effect_tt: "Cape Verde becomes an §Yassociated state§! in everything but the word"

 ### SAO TOME ###
 POR_joint_development_zone: "Joint Development Zone"
 POR_joint_development_zone_desc: "An oil block shared with Nigeria on terms of sixty to forty in Abuja's favour, signed by a country of a hundred and forty thousand people with no lawyers of its own. Lisbon supplies the lawyers."
 POR_sixteenth_of_july: "Sixteenth of July"
 POR_sixteenth_of_july_desc: "The president is abroad, a major with veterans of the Buffalo Battalion behind him takes the radio station, and a week later everybody agrees it did not really happen. Somebody made the telephone calls that ended it."
 ### BACKING A SIDE ###
 POR_commit_to_a_side_tt: "Portugal is §Ycommitted§!. If this side wins we take an §Ginfluence share, an infiltrated government and a trading position§! in whatever it becomes; if it loses we are §Rthe power that backed the losers§!"
 portugal.70.t: "Our Side Won"
 portugal.70.d: "The war we were careful never to admit being in has ended in favour of the people we were careful never to admit paying. The new government's first foreign visit is to Lisbon, its finance ministry is advised by people we seconded, and the concessions signed under the old one are being reviewed in our favour.\n\nNobody is going to write any of that down."
 portugal.70.a: "The correct investment"
 portugal.71.t: "We Backed the Losers"
 portugal.71.d: "The side we supplied has been destroyed and the side we supplied against is in the capital, going through the filing cabinets. Some of what they will find has our letterhead on it.\n\nEvery position we held in that country is now held by whoever paid for the winners."
 portugal.71.a: "Deniability was always the weaker half of the plan"
 ### THE RAID AND THE SIDE ###
 POR_operation_false_flag: "False Flag"
 POR_operation_false_flag_desc: "A barracks, a customs post or a ministry annexe goes up at four in the morning, and the material left in the wreckage belongs to somebody the government already distrusts. It starts nothing by itself: it leaves the regime looking for someone to blame, and that search is the cover every later operation needs."
 POR_operation_false_flag_outcome_tt: "The target loses §R5%§! stability and is left looking for someone to blame. For §Y180 days§! it is open to our §YDirected Rising§!, and in Spain to the §YOlivenza Incident§!."
 POR_operation_directed_rising_cost_tt: "We hold at least §Y12 billion§! in the treasury"
 POR_op_no_cooldown_tt: "We have not staged a rising here in the last §Yfive years§!"
 POR_op_no_treaty_tt: "We have not signed a §Ytreaty§! with it"
 POR_op_raid_recent_tt: "We have staged a §YFalse Flag§! here in the last §Y180 days§!"
 POR_op_no_raid_recent_tt: "We have not staged a §YFalse Flag§! here in the last §Y180 days§!"
 POR_op_target_no_civil_war_tt: "The target is not already in a civil war"
 POR_op_target_independent_tt: "The target is fully independent"
 POR_op_target_at_peace_tt: "We are at peace with the target"
 POR_op_target_not_in_faction_tt: "The target is not in our faction"
 POR_op_target_other_government_tt: "The target's ruling party is not of our ideology"
 POR_op_influence_30_tt: "We hold more than §Y30%§! influence in the target"
 POR_op_army_token_tt: "We have infiltrated its §Yarmy§! (the §Y$operation_infiltrate_armed_forces_army$§! operation or the §Y$POR_buy_the_officer_corps$§! decision)"
 POR_op_civilian_token_tt: "We have infiltrated its §Ygovernment§! (the §Y$operation_infiltrate_civilian$§! operation)"
 POR_purge_the_network: "Purge the Portuguese Network"
 POR_purge_the_network_desc: "Ninety days of arrests, expulsions and retirements, beginning with the officers who went to staff college in Lisbon. It costs the government stability it does not have and the economy contracts that were signing themselves. It is still cheaper than the alternative."
 POR_counter_intelligence_category: "Counter-Intelligence"
 portugal.72.t: "Explosion at the Barracks"
 portugal.72.d: "Something went up before dawn and the wreckage is being photographed by people who already know what they want it to mean. The material recovered from the scene is foreign and it is not new.\n\nThe question in every ministry this morning is not who did it. It is who to blame, and every faction has a different answer."
 portugal.72.a: "Somebody wanted this"
 portugal.73.t: "Which Government Do We Recognise?"
 portugal.73.d: "The rising we arranged is under way and both sides have a foreign ministry, a radio station and a claim. Lisbon now has to say which one it recognises, and it has to say it this week.\n\nBacking our own people is the obvious answer and the expensive one. Backing the government against the rebellion we started is the oldest trick in the file, and the only one that leaves us looking like a friend when it is over."
 portugal.73.a: "The people we put there"
 portugal.73.b: "The government, and our sympathies"
 portugal.73.c: "Recognise nobody, sell to both"
 portugal.74.t: "The Network in [FROM.GetName] Is Rolled Up"
 portugal.74.d: "Ninety days of arrests in [FROM.GetName], a country we thought we understood. The officers we paid for are retired, the customs men are in prison, and the second secretary at the central bank has been on television.\n\nEverything we built there has to be built again, and this time they are looking."
 portugal.74.a: "They were always going to notice eventually"
 POR_operation_false_flag_unlocked_tt: "Unlocks the §YFalse Flag§! operation in the countries opened in §YLusophone Realpolitik§! where our intelligence network is strong enough"
 POR_lusophone_community_idea: "Community of Portuguese Language Countries"
 POR_lusophone_community_idea_desc: "Nine states, two hundred and eighty million people and one language, held together by a secretariat in Lisbon with a budget smaller than a mid-sized municipality. It is worth something in trade and almost nothing in obligation.\n\nIt is also the reason our counter-intelligence services know which embassy to watch. Everyone who joins is told, politely, what the arrangement has historically been."
 ### THE TREATY OR THE RISING ###
 POR_not_yet_committed_tt: "We have §Ynot yet§! taken a side in Angola"
 POR_treaty_effect_tt: "Signs a §Gstanding treaty§!. The §RDirected Rising can never be run against them§!"
 POR_realpolitik_unlock_agl_tt: "Unlocks the §YLusophone Realpolitik§! decisions and operations against §YAngola§!"
 POR_realpolitik_unlock_uni_tt: "Unlocks the §YLusophone Realpolitik§! decisions and operations against §YUNITA§!"
 POR_realpolitik_unlock_moz_tt: "Unlocks the §YLusophone Realpolitik§! decisions and operations against §YMozambique§!"
 POR_realpolitik_unlock_cab_tt: "Unlocks the §YLusophone Realpolitik§! decisions and operations against §YCabinda§!"
 POR_tiny_client_coup_tt: "§Y[This.GetName]§! becomes our §Yassociated state§! at once, with no civil war. It pays what a winning client pays"
 POR_realpolitik_unlock_bra_tt: "Unlocks the §YLusophone Realpolitik§! decisions and operations against §YBrazil§!"
 POR_realpolitik_unlock_spr_tt: "Unlocks the §YLusophone Realpolitik§! decisions and operations against §YSpain§!"
 POR_recognise_luanda: "Recognise Luanda"
 POR_recognise_luanda_desc: "The MPLA has the seat at the United Nations, the oil revenue and the diplomatic recognition of everyone who matters. Backing it is the respectable choice. While the war lasts it pays out only if the government wins, because a government that is going to win anyway owes its friends nothing. Once the war is over it is a standing treaty with Luanda."
 POR_support_unita: "Support UNITA"
 POR_support_unita_desc: "Savimbi had the diamonds, the bush and a movement the Security Council declared an embargo against. Backing him was indefensible, deniable only for about a fortnight, and worth a great deal if he ever walked into Luanda.\n\nWhile the war lasts this is an offer to UNITA. Once it ends, UNITA demobilises into an opposition party, and Lisbon can fund it against the government that won."
 POR_bissau_pact: "Bissau Pact"
 POR_bissau_pact_desc: "A standing treaty of friendship, cooperation and defence, which in Guinea-Bissau means Portugal has finally decided which of the competing generals it is going to keep dealing with. Once signed, it closes the other option for good."
 POR_night_of_the_generals: "Night of the Generals"
 POR_night_of_the_generals_desc: "The file on Bissau is moved to the top of the pile. The officers who owe us are told to expect a call and the ones who do not are quietly listed. Nothing has happened yet, and everyone involved understands exactly what is being prepared."
 POR_maputo_partnership: "Maputo Partnership"
 POR_maputo_partnership_desc: "Gas, the dam, the officer exchanges and a treaty that says none of it is conditional on anything. Maputo signs because the alternative patron wants the port, and Lisbon signs because Maputo is worth more intact."
 POR_return_of_renamo: "Return of RENAMO"
 POR_return_of_renamo_desc: "The movement never quite demobilised and never quite stopped being armed, and the men who run it took their politics from a war Portugal lost. Reopening that correspondence is not difficult. Explaining it afterwards would be."
 POR_treaty_of_dili: "Treaty of Dili"
 POR_treaty_of_dili_desc: "A country that chose our language against the advice of every development economist it consulted gets the treaty that choice was worth. Portugal undertakes, in writing, not to do to Timor what it has been doing elsewhere."
 POR_petitioners: "Petitioners"
 POR_petitioners_desc: "Six hundred soldiers from the west were dismissed for complaining about promotion and the country came apart for a year. The grievance was never settled, only outlasted, and the men who carried it are still alive and still listed."
 POR_malabo_accord: "Malabo Accord"
 POR_malabo_accord_desc: "Portugal signs a treaty with a government the rest of the community will not sit next to, in exchange for oil, Portuguese teaching and the end of the question. It is the most cynical document in this branch and the only one that keeps everybody alive."
 POR_severo_motos_hour: "Severo Moto's Hour"
 POR_severo_motos_hour_desc: "The government-in-exile in Madrid has been ready for twenty years and has never once been short of volunteers, only of a sponsor with an aircraft. Lisbon has aircraft."
 POR_statute_of_cabinda: "Statute of Cabinda"
 POR_statute_of_cabinda_desc: "The other Cabindan answer: not a republic but a settlement, guaranteed by Portugal, in which the enclave keeps a share of its own oil and Angola keeps the map. Everybody involved can live with it and nobody is happy."
 POR_malongo_fields: "Malongo Fields"
 POR_malongo_fields_desc: "Sixty thousand barrels a day, most of it pumped at Malongo for foreign operators and banked in Luanda. Lisbon declines to guarantee any of it, and a republic that needs the fields to survive learns who decided that. The file on Cabinda is opened as a file on an adversary."
 POR_sao_tome_protocol: "Sao Tome Protocol"
 POR_sao_tome_protocol_desc: "A treaty with a country of a hundred and forty thousand people that guarantees its oil revenues are banked where its government can be audited. It is genuinely in Sao Tome's interest, which is what makes it useful."
 POR_question_of_praia: "Question of Praia"
 POR_question_of_praia_desc: "Cape Verde is the one place on this list where nothing has ever needed to be arranged. The file is opened anyway, because a currency board and a diaspora are also instruments, and because somebody in Lisbon wanted to know whether it could be done."
 ### THE POWERS ###
 POR_powers_shortcut: "The Powers"
 POR_sunrise_invasion: "The Sunrise Invasion"
 POR_sunrise_invasion_desc: "With Bahia and Pernambuco held, the rest of Brazil can be taken from the coast where Cabral first landed in 1500. This time the army comes from the east, out of the sunrise."
 POR_united_kingdom_of_brazil: "The United Kingdom of Portugal, Brazil and the Algarves"
 POR_united_kingdom_of_brazil_desc: "In 1815 the court in Rio raised Brazil to a kingdom equal to Portugal, and for seven years one crown ruled both. The crown is back and so is Brazil. The kingdom of 1815 is proclaimed again, this time with the capital wherever the King chooses to hold court."
 POR_court_in_rio: "The Court in Rio"
 POR_court_in_rio_desc: "João VI fled Napoleon to Rio in 1808 and found he preferred it. The King follows his example: the court, the ministries and the Cortes move to the larger half of the kingdom."
 POR_platine_question: "The Platine Question"
 POR_platine_question_desc: "Portugal and Spain fought over the River Plate for three hundred years, and Brazil inherited the quarrel. The kingdom revives it: the estuary, its ports and the rivers that run up into the heart of the continent."
 POR_cisplatina: "Cisplatina"
 POR_cisplatina_desc: "Portuguese troops took Montevideo in 1817, and Uruguay was the Cisplatine Province until 1828. The city was taken once by a Portuguese army, and it can be taken again."
 POR_paraguayan_war: "The Paraguayan War"
 POR_paraguayan_war_desc: "Brazil fought its bloodiest war against Paraguay in the 1860s and left it a client. The kingdom finishes what the empire started."
 POR_acre_question: "The Acre Question"
 POR_acre_question_desc: "Brazil bought Acre from Bolivia in 1903 after a rubber-tappers' war. The lowlands of Pando and Beni beyond it stayed Bolivian, and the kingdom claims them."
 POR_southern_cone: "The Southern Cone"
 POR_southern_cone_desc: "With Montevideo held, Buenos Aires is across the river. Argentina is the last power in the south that can still say no to Rio."
 POR_cayenne: "Cayenne"
 POR_cayenne_desc: "A Portuguese and British force took Cayenne in 1809 and held it for eight years. French Guiana is a department of France and a NATO member's soil, so the kingdom takes it the way it was taken before: a short, sharp fight on the Oyapock that nobody declares."
 POR_south_american_crown: "The South American Crown"
 POR_south_american_crown_desc: "The kingdom has the Plate, the Paraná and the Guianas. What began as a court in exile in 1808 is now the largest crown in the Americas, and its provinces are treated as its own."
 POR_the_isthmus: "The Isthmus"
 POR_the_isthmus_desc: "The Americans built the canal and gave it back in 1999, and Panama has guarded it alone since. The kingdom offers a security treaty: our marines on the locks, our ships in Colón, and a share of the tolls for Panama."
 POR_masters_of_the_canal: "Masters of the Canal"
 POR_masters_of_the_canal_desc: "Every ship between the Atlantic and the Pacific that will not round Cape Horn pays its toll to a garrison that answers to Lisbon. The canal makes the kingdom a power in both oceans."
 POR_estado_da_india: "The Estado da Índia"
 POR_estado_da_india_desc: "For four centuries the Estado da Índia ran from Goa to Macau: a string of ports, forts and missions held by ships rather than armies. With Macau in our hands again, the old map is a list of places to return to."
 POR_goa_daman_diu: "Goa, Damão and Diu"
 POR_goa_daman_diu_desc: "India took Goa, Damão and Diu in thirty-six hours in December 1961, and Salazar ordered a garrison of three thousand to fight to the last man. The Estado da Índia wants its capital back, and India is far larger than it was."
 POR_solor_and_flores: "Solor and Flores"
 POR_solor_and_flores_desc: "The Dominicans built a fort on Solor in 1566, and Larantuka on Flores was Portuguese until 1859. With Timor beside them, the islands of the Lesser Sundas come back to the flag."
 POR_the_macau_window: "The Macau Window"
 POR_the_macau_window_desc: "Macau is the one door out of China that Beijing does not fully control. Officials who fear the next purge, engineers who want to leave and families who want their money abroad all look for it, and we decide who walks through."
 POR_the_pearl_river: "The Pearl River"
 POR_the_pearl_river_desc: "Hong Kong sits across the estuary from Macau, a richer city behind a weaker garrison. Taking it means fighting the power that answers for it, and that power is China."
 POR_malacca: "Malacca"
 POR_malacca_desc: "Afonso de Albuquerque took Malacca in 1511 and with it the strait every ship to China must pass. The Dutch took it from us in 1641. We take it back."
 POR_spice_islands: "The Spice Islands"
 POR_spice_islands_desc: "Ternate's cloves were the reason Portugal sailed east at all. The ruins of the fort of São João Baptista still stand on the island, and the Moluccas are claimed again."
 POR_second_opium_war: "A Second Opium War"
 POR_second_opium_war_desc: "Britain forced open China's ports with gunboats in 1842, and in the same decade Portugal expelled the Chinese customs house from Macau and stopped paying rent. A China weakened by the officials and money that fled through Macau can be made to open its ports again: Canton, Amoy, Ningbo and Shanghai."
 POR_lion_city: "The Lion City"
 POR_lion_city_desc: "Whoever holds Malacca is told that the strait's money now goes to Singapore. The city-state is rich, well armed and small, and it sits at the end of the strait we already control."
 POR_unequal_treaties: "The Unequal Treaties"
 POR_unequal_treaties_desc: "The ports we hold are run the way the treaty ports were run in the nineteenth century: our customs, our courts and our concessions, with China's merchants trading through them on our terms."
 POR_crown_of_aragon: "The Crown of Aragon"
 POR_crown_of_aragon_desc: "The Crown of Aragon once held Sardinia, Sicily, Naples and the Roussillon, and the Iberian Union is its heir as much as Castile's. The Mediterranean claims of the old crown are taken out of the archive."
 POR_sardinian_question: "The Sardinian Question"
 POR_sardinian_question_desc: "Sardinia speaks its own language, votes for its own nationalists and was Aragonese for four hundred years. We fund the Partito Sardo d'Azione and ask Rome, publicly, why the island should not decide for itself."
 POR_sardinian_protectorate: "The Sardinian Protectorate"
 POR_sardinian_protectorate_desc: "If Sardinia is free, it needs a protector, and we are the nearest crown that wants nothing from it but its harbours. If Rome refused, the island is taken the old way."
 POR_northern_catalonia: "Northern Catalonia"
 POR_northern_catalonia_desc: "France took the Roussillon from the Crown of Aragon in 1659, and Perpignan still flies the Catalan flag. A fight in the passes of the Pyrenees, short of a declared war, brings it back south."
 POR_two_sicilies: "The Two Sicilies"
 POR_two_sicilies_desc: "Naples and Sicily were Aragonese, then Spanish, for most of four centuries. Claiming them means a full war with Italy, and Rome will not fight it alone."
 POR_knights_isle: "The Knights' Isle"
 POR_knights_isle_desc: "Charles V gave Malta to the Knights of St John in 1530 as a fief of the Crown of Sicily. The island is the key to the narrows between Sicily and Africa, and it has no army to speak of."
 POR_mare_nostrum: "Mare Nostrum"
 POR_mare_nostrum_desc: "The western Mediterranean is an Iberian lake again, as it was when Spanish galleys sailed from Barcelona, Naples and Messina to Lepanto. The islands of the old crown are integrated as its provinces."
 POR_the_atlanticists_do_not_govern_tt: "A §Yparty of the Atlantic mainstream§! is §Rnot§! in government"
 POR_balance_of_powers: "Balance of Powers"
 POR_balance_of_powers_desc: "The Campaigns, for powers that can answer back. The instruments of the shadow war work on countries smaller than Portugal. Spain, Britain, the United States, China, Brazil and a federated Europe cannot be subverted or outvoted, and each of them notices what we do.\n\nWith every one of them there are two roads: sell them access as a friend, or make them pay for it as a rival. A country of ten million picks a road with each, trades one lease, licence and port at a time, and keeps the receipts."
 POR_iberian_question: "Iberian Question"
 POR_iberian_question_desc: "Spain is ten times the size, holds the largest foreign share of influence in Portugal, and has spent two hundred years being the only country Portuguese strategy is actually about. There are two ways to handle that and they are not compatible."
 POR_iberian_summits: "Iberian Summits"
 POR_iberian_summits_desc: "An annual summit, a shared electricity market, a shared water treaty and a rail connection that is announced every four years. Being the junior partner in a working relationship is worth more than being the proud partner in a cold one."
 POR_de_spanishing: "De-Spanishing"
 POR_de_spanishing_desc: "Spanish capital is bought out of the banks, Spanish influence is contested in every ministry, and the school curriculum rediscovers 1640. It costs a great deal and buys a country that answers only to itself.\n\nOlivenca is not mentioned. Olivenca is never mentioned."
 POR_oldest_alliance: "Oldest Alliance"
 POR_oldest_alliance_desc: "Signed at Windsor in 1386 and never once renounced by either party, which makes it the longest-standing alliance in the world and the least discussed. It has been invoked in earnest twice in living memory, and both times it worked."
 POR_brussels_route: "Brussels Route"
 POR_brussels_route_desc: "A small country with a competent mission in Brussels and nothing anyone wants can make a great deal of trouble go away, whether it votes in the Council or only works its corridors. That is useful, and it is never admitted."
 POR_brussels_route_effect_tt: "Reduces §YEuropean exposure§! by §G8§!. What is settled in the corridors does not reach the Council"
 POR_against_the_francophonie: "Against the Francophonie"
 POR_against_the_francophonie_desc: "Paris and Lisbon are competing for the same ministries in the same capitals with the same argument about language and civilisation, and Paris has forty times the budget. It has never stopped being a real contest in Guinea-Bissau."
 POR_renegotiating_lajes: "Renegotiating Lajes"
 POR_renegotiating_lajes_desc: "An American airbase on an island in the middle of the Atlantic, on a lease Portugal signs and can decline to renew. It is the single largest thing this country has to trade and it comes up for renewal on a schedule."
 POR_azores_summit: "Azores Summit"
 POR_azores_summit_desc: "In March of 2003 the leaders of the United States, the United Kingdom and Spain met at Lajes, and the Portuguese prime minister stood between them for the photograph. It was the closest a Portuguese government has come to the centre of a great-power decision since the war.\n\nIf Washington goes on to Iraq, a detachment of the Republican National Guard goes to Nasiriyah with it. The country watching at home did not want the war, and said so for a decade."
 POR_end_of_the_agreement: "End of the Agreement"
 POR_end_of_the_agreement_desc: "The lease is not renewed. The Americans go, the islands lose their largest employer, and Portugal discovers what it is worth to Washington without the one thing Washington wanted.\n\nIt is the largest hostile act available to a country this size against a country that size, and it can only be done once."
 POR_deep_water_terminal: "Deep-Water Terminal"
 POR_deep_water_terminal_desc: "The westernmost deep-water port in continental Europe, a container terminal tender, and Chinese state shipping lines circling it for a decade. Selling is worth a great deal of money and a permanent line in somebody else's threat assessment."
 POR_forum_macao: "Forum Macao"
 POR_forum_macao_desc: "China built a permanent secretariat in Macau for its trade with the Portuguese-speaking world, and staffed the Portuguese half of it with people Lisbon trained. It is the only forum where Portugal sits between Beijing and Luanda and is needed by both."
 POR_equidistance: "Equidistance"
 POR_equidistance_desc: "The doctrine stated plainly: Portugal is a member of every western institution and a partner of everyone the western institutions are worried about, and it intends to remain both.\n\nIt is not a neutral position. It is a position that charges rent to two sides at once, and it requires never being caught."
 POR_equidistance_effect_tt: "Reduces §YEuropean exposure§! by §G12§!. Being useful to everyone is the best cover there is"
 ### THE ULTIMATUM ###
 POR_brussels_ultimatum: "The Brussels Ultimatum"
 POR_brussels_ultimatum_desc: "The Commission has written. It does not name the countries, the officers or the sums, which is how we know it has all three. We have a year to either stand the operations down under the European question, or leave the Union and the Alliance and stop pretending."
 POR_ultimatum_answered_tt: "We have answered the §YEuropean question§!, one way or the other"
 POR_ultimatum_answered_effect_tt: "Brussels has its answer, and will act on it"
 portugal.75.t: "A Letter from the Commission"
 portugal.75.d: "The letter runs to four pages and names nothing. It refers to reports, to patterns and to the obligations of membership, and it asks the government to confirm, within twelve months, that Portugal's foreign policy is conducted in accordance with the treaties.\n\nEvery ambassador in Lisbon has a copy. We have a year to stand the operations down, or to leave, and after that the Council will decide for us."
 portugal.75.a: "Twelve months is a long time"
 portugal_news.12.t: "The Union Acts Against Portugal"
 portugal_news.12.d: "The Commission's deadline to the government in Lisbon has passed without the assurances it asked for. Member states are now discussing measures under the treaty provisions on serious breaches of the Union's values, a procedure that has never been completed against any member.\n\nThe Portuguese government has described the process as political and says it will cooperate fully."
 portugal_news.12.a: "A procedure that has never been completed"
 ### IMMIGRATION ###
 POR_foreigners_law: "Foreigners Law"
 POR_foreigners_law_desc: "The 2007 law that replaced a century of ad hoc practice with an actual immigration regime, and the expressao de interesse clause that let anyone already working in Portugal regularise on the strength of a contract and a social security number. Half a million people arrived on it, and the country that had spent four hundred years exporting its population began, quietly, to import one."
 POR_aima: "AIMA"
 POR_aima_desc: "The immigration service is dissolved and its half-million-case backlog handed to a new agency with a new name, which inherits the queue outside its own doors on the first morning. It is a bureaucratic disaster and a demographic turning point at the same time, and the second thing outlasts the first."
 POR_labour_agreements: "Labour Agreements"
 POR_labour_agreements_desc: "Portugal has more people than jobs and always has. The bilateral agreements with France, Luxembourg, Switzerland and Germany turn the old emigration into a managed export of labour, and the money orders home become a line in the national accounts."
 POR_remittances_tt: "Emigrant remittances become a weekly income worth §G0.1%§! of GDP"
 POR_cplp_mobility_visa: "CPLP Mobility Visa"
 POR_cplp_mobility_visa_desc: "A residence visa for anyone with a Lusophone passport and a job offer. It regularises the Brazilians, Cape Verdeans and Angolans who were already here and working without papers, and every one of them has family at home who now has a reason to like Lisbon."
 POR_student_pipeline: "Student Pipeline"
 POR_student_pipeline_desc: "Scholarships bring the best students of Luanda, Praia and Maputo to Coimbra and Lisbon, and the best of those stay. The home countries pay for the schooling and Portugal collects the engineers, doctors and researchers."
 ### THE DATED TIMELINE ###
 portugal.76.t: "Peace in Angola"
 portugal.76.d: "Twenty-seven years of war have ended in the bush, and the settlement is being written in six weeks by men who spent their lives on opposite sides of it. The oil keeps pumping throughout.\n\nWhoever helped broker this is owed something by the side that kept its army. Whoever sat it out is owed nothing, and will be reminded of that at every concession renewal for a generation."
 portugal.76.a: "We were in the room"
 portugal.76.b: "We watched from Lisbon"
 portugal.77.t: "Guinea-Bissau Without a Government"
 portugal.77.d: "The head of state and the head of the army are both gone inside two days, each side blaming the other, and the institutions Portugal spent a decade funding have proven exactly as durable as the sceptics said.\n\nThe correct response is a communique and a plane full of mediators. The useful one is to remember that a country nobody can govern is a country anyone can reach."
 portugal.77.a: "Insist on the constitutional order"
 portugal.77.b: "A reachable country"
 portugal.78.t: "Insurgency in Cabo Delgado"
 portugal.78.d: "An armed movement has opened a front in the far north of Mozambique, in the exact province where the largest gas find in a generation is coming online, in the exact year the platforms were ordered. Nobody involved believes the timing is a coincidence.\n\nPortugal has trained this army before. The question is whether it wants its instructors anywhere near this."
 portugal.78.a: "Send the mission"
 portugal.78.b: "Not our war"
 POR_cabo_delgado_mission_tt: "Commits Portuguese instructors to the §Ynorthern front§!, and puts our people inside the government that invited them"
 portugal.79.t: "The Fall of Palma"
 portugal.79.d: "The town beside the gas project has been overrun and the consortium has declared force majeure and gone home. Rwandan and southern African troops are moving in to do what the Mozambican army could not, and the answer to who secures the north of the country is being given in other nations' uniforms.\n\nThere is a European training mission forming. Portugal can be in it, or it can watch its language and its instructors be replaced by someone else's."
 portugal.79.a: "Join the mission"
 portugal.79.b: "Leave it to the region"
 POR_anglo_alliance: "The Anglo-Portuguese Alliance"
 POR_anglo_alliance_desc: "What the oldest alliance in the world is currently worth in ships, courses and signatures."
 POR_royal_navy_licences: "Royal Navy Licences"
 POR_royal_navy_licences_desc: "Our Vasco da Gama frigates were built in Germany to a German design. The next class could be built at Alfeite to a British one, if London will license its newest designs to the ally that has asked it for less than anyone else in six centuries. Alfeite cannot learn them from drawings alone, so we offer to pay for the British engineers who can teach it."
 POR_royal_navy_licences_tt: "§YLondon§! decides whether to license us its newest warship designs and lend the Alfeite arsenal its shipbuilding experts, whose costs we pay."
 POR_royal_navy_surplus: "Royal Navy's Surplus"
 POR_hereford_courses: "Hereford Courses"
 POR_hereford_courses_desc: "The Special Air Service trains a handful of foreign officers at Hereford each year and chooses them itself. Places for our commandos and the Special Actions Detachment are a favour between allies, and the men who pass come home as instructors."
 POR_falklands_position: "Standing with London on the Falklands"
 POR_falklands_position_desc: "Buenos Aires has spent twenty years asking every Latin country to call the islands Argentine. We will say in writing that the islanders decide, and that a British task force sailing south can stage through the Azores."
 POR_gibraltar_position: "Standing with London on Gibraltar"
 POR_gibraltar_position_desc: "Madrid expects Lisbon to back it on the Rock as one Iberian neighbour backs another. We will instead tell London in writing that the Gibraltarians decide, and the Foreign Office will remember who said it first."
 POR_regional_development: "Regional Development"
 POR_regional_development_desc: "Five continental regions, two autonomous archipelagos, and a coastal strip where most of the money lives. The regional coordination commissions can plan for all of it once the programme of government gives them something to spend."
 POR_northern_textile_belt: "Northern Textile Belt"
 POR_northern_textile_belt_desc: "The Ave and Cávado valleys still make a large share of Europe's clothes, and every year they make them against cheaper labour in Asia. Modern mills are how the North survives the end of the textile quotas."
 POR_coimbra_aveiro_corridor: "Coimbra-Aveiro Corridor"
 POR_coimbra_aveiro_corridor_desc: "The oldest university in the country and the telecom engineers of Aveiro sit an hour apart. Offices and fibre along the road between them turn graduates who emigrate into graduates who stay."
 POR_lisbon_financial_centre: "Lisbon Financial Centre"
 POR_lisbon_financial_centre_desc: "Every Portuguese bank of consequence keeps its head office within a few kilometres of the Marquês de Pombal. Modern offices on the river let international funds run their Iberian desks from Lisbon instead of Madrid."
 POR_sines_industrial_zone: "Sines Industrial Zone"
 POR_sines_industrial_zone_desc: "The deep-water port brings the ships. What the Alentejo coast lacks is anything to do with the cargo once it lands, and the industrial zone behind the harbour has room for plants and a shipyard."
 POR_algarve_beyond_the_beach: "Algarve Beyond the Beach"
 POR_algarve_beyond_the_beach_desc: "Half the region's income arrives on a charter flight between June and September. Roads inland and offices on the coast give the other eight months something to do."
 POR_madeira_free_zone: "Madeira Free Zone"
 POR_madeira_free_zone_desc: "The International Business Centre of Madeira lets companies register on the island at a fraction of the mainland's corporate tax. Brussels tolerates it as regional aid. Funchal treats it as the economy."
 POR_atlantic_azores: "Atlantic Azores"
 POR_atlantic_azores_desc: "The islands sit on a volcanic ridge in the middle of the Atlantic, and São Miguel already draws much of its power from geothermal wells. More wells, and roads between the villages and the airports, bring the archipelago closer to the mainland."
 POR_porto_metro: "Porto Metro"
 POR_porto_metro_desc: "Porto's light rail opens in stages from 2002, and every stage is late and over budget. Finishing it, and laying fibre while the streets are open, is the difference between a second city and a provincial one."
 POR_alqueva_irrigation: "Alqueva Irrigation"
 POR_alqueva_irrigation_desc: "Canals from the Alqueva reservoir can turn dry wheat country into olive groves and vineyards. A Portugal that has built the dam itself irrigates twice the acreage."
 POR_autonomous_regions: "Autonomous Regions"
 POR_autonomous_regions_desc: "Funchal and Ponta Delgada have their own parliaments and their own opinions about Lisbon. Treating the archipelagos as partners rather than dependents is cheap, and it keeps the autonomists in the regional assemblies."
 POR_the_interior: "The Interior"
 POR_the_interior_desc: "Beyond the coastal strip, whole districts have been emptying since the 1960s. Roads, schools that stay open and clinics that stay staffed are what keep a family in Guarda or Beja, and they need the public works argument settled one way or the other."
 POR_cohesion_funds: "Cohesion Funds"
 POR_cohesion_funds_desc: "Structural funds exist so that the poor regions of a member state can close the gap with the rich ones. Inside the European Union, Brussels pays for new industry in the Alentejo and the Algarve. Outside it, we pay ourselves."
 POR_shoe_cluster: "The Shoe Cluster"
 POR_shoe_cluster_desc: "The shoemakers of Felgueiras and São João da Madeira have stopped competing with Asia on price and started competing with Italy on design. Trade fairs, a technology centre and export credit turn the north's oldest trade into one of its most profitable."
 POR_iberian_nanotechnology_laboratory: "The Iberian Nanotechnology Laboratory"
 POR_iberian_nanotechnology_laboratory_desc: "Lisbon and Madrid have agreed to build a nanotechnology laboratory together, the first international research organisation in the Iberian Peninsula. We have offered Braga, the University of Minho beside it, and a building big enough to keep its researchers from leaving for Grenoble."
 POR_tamega_gigabattery: "The Tâmega Gigabattery"
 POR_tamega_gigabattery_desc: "Three dams on the Tâmega and its tributaries, one of them pumping water back uphill whenever the wind blows at night. The north's surplus power is stored in a battery the size of a valley."
 POR_windfloat_atlantic: "WindFloat Atlantic"
 POR_windfloat_atlantic_desc: "Off Viana do Castelo the sea is too deep for turbines on the seabed, so we float them. The first floating wind farm in continental Europe is assembled in Viana's yards, and the yards that built the platforms want the next order."
 POR_douro_line: "The Douro Line"
 POR_douro_line_desc: "The railway up the Douro once ran to the Spanish border at Barca d'Alva. Electrifying it and reopening the closed section turns a wine valley that empties every winter into one people can live in and commute from."
 POR_porto_vigo_line: "The Porto–Vigo High-Speed Line"
 POR_porto_vigo_line_desc: "Porto and Vigo are an hour apart by motorway and three by train. A high-speed line north to Galicia ties the economy of the north-west together and makes Porto the airport and the port for half of Galicia."
 POR_norte_semiconductor_valley: "The Norte Semiconductor Valley"
 POR_norte_semiconductor_valley_desc: "The laboratory in Braga has trained a generation of engineers, and the chip shortages taught Europe what it costs to have no fabs of its own. Braga, Porto and Aveiro bid together for the plants Brussels wants built on European soil."
 POR_port_of_aveiro: "The Port of Aveiro"
 POR_port_of_aveiro_desc: "Aveiro's port handles the cement, the wood pulp and the ceramics of the Centro, and its railway stops short of the quay. Linking the two and dredging the channel gives the region its own gate to the sea."
 POR_moulds_of_marinha_grande: "The Moulds of Marinha Grande"
 POR_moulds_of_marinha_grande_desc: "Marinha Grande made glass for two centuries and then learned to make the steel moulds that shape the world's car bumpers and bottle caps. Export credit and a technology centre keep its toolmakers ahead of their competitors."
 POR_forest_reform: "The Forest Reform"
 POR_forest_reform_desc: "The fires of 2017 killed more than a hundred people in forests nobody owned on paper and nobody cleared in practice. A land register for the interior, firebreaks and managed plantations turn a fire hazard back into an industry."
 POR_aveiro_salamanca_railway: "The Aveiro–Salamanca Railway"
 POR_aveiro_salamanca_railway_desc: "Every container that leaves Aveiro for Madrid goes by road. A standard-gauge line across the Beira to Salamanca puts the Centro's factories two days closer to the European market."
 POR_panasqueira_tungsten: "Panasqueira Tungsten"
 POR_panasqueira_tungsten_desc: "Panasqueira has mined wolfram since the 1890s, and in the Second World War both sides bought everything it could dig. A new shaft and a modern concentrator keep it one of the few tungsten mines Europe still has."
 POR_biocant_park: "Biocant Park"
 POR_biocant_park_desc: "Cantanhede, between Coimbra and Aveiro, has given its old farmland to a biotechnology park. The university supplies the scientists, the park supplies the laboratories, and the start-ups stay in the Centro instead of moving to Lisbon."
 POR_coimbra_medical_valley: "The Coimbra Medical Valley"
 POR_coimbra_medical_valley_desc: "Coimbra's university hospitals, Biocant's laboratories and the pharmaceutical plants of the Centro now form one cluster. Clinical trials, biologics and medical devices make the old university town a European centre for medicine."
 POR_parque_das_nacoes: "Parque das Nações"
 POR_parque_das_nacoes_desc: "The Expo '98 site on the eastern riverfront was meant to become a new district, and its pavilions are still half empty. Selling the plots, finishing the offices and filling the arena makes Parque das Nações the Lisbon investors photograph."
 POR_unicorn_factory: "The Unicorn Factory"
 POR_unicorn_factory_desc: "The old military bakeries of Beato have become one of the largest start-up campuses in Europe. Founders who came for the Web Summit and stayed for the light now have somewhere to hire."
 POR_third_tagus_crossing: "The Third Tagus Crossing"
 POR_third_tagus_crossing_desc: "Two bridges carry all of Lisbon's traffic across the Tagus, and both are full by eight in the morning. A road and rail bridge from Chelas to Barreiro opens the south bank to the city and to the new airport."
 POR_lisbon_metro_expansion: "The Metro Expansion"
 POR_lisbon_metro_expansion_desc: "The Red Line reaches the airport, the Blue Line reaches Reboleira and the circular line closes the loop under the old city. A capital that can be crossed underground in half an hour keeps its people in the city."
 POR_champalimaud_centre: "The Champalimaud Centre"
 POR_champalimaud_centre_desc: "António Champalimaud left a quarter of his fortune to medical research. His foundation's centre at Belém, built where the caravels once sailed, studies cancer and the brain and recruits from the best laboratories in the world."
 POR_barreiro_terminal: "The Barreiro Container Terminal"
 POR_barreiro_terminal_desc: "The old chemical works at Barreiro have stood empty for decades on deep water. A container terminal there takes the port's trucks off Lisbon's waterfront and gives the capital a real deep-sea port again."
 POR_airport_city: "The Airport City"
 POR_airport_city_desc: "The new airport at Alcochete brings logistics parks, hotels and assembly plants with it. Planned as a city rather than a runway with car parks, it turns the pine land east of the Tagus into Lisbon's second centre."
 POR_alentejo_olive_groves: "The Olive Groves of the Alentejo"
 POR_alentejo_olive_groves_desc: "Alqueva's water has turned dry wheat land into some of the largest olive groves in Europe, planted in hedges and harvested by machine. The Alentejo exports its oil to Italy, which bottles it and sells it as Italian."
 POR_sines_ai_campus: "The Sines AI Campus"
 POR_sines_ai_campus_desc: "Sines has the cables, the cooling water and some of the cheapest solar power in Europe. The data campus grows into halls of computers that train and run the models other countries cannot power."
 POR_terminal_xxi: "Terminal XXI"
 POR_terminal_xxi_desc: "Sines was built as an oil port, and its container terminal is still a single quay. Extending Terminal XXI lets the largest ships on the Asia–Europe routes call at the westernmost deep-water port of the continent."
 POR_beja_airport: "Beja Airport"
 POR_beja_airport_desc: "Beja airbase has a runway long enough for anything that flies and a terminal nobody uses. Opening it to cargo, aircraft maintenance and low-cost flights gives the Alentejo an airport of its own."
 POR_ellalink: "EllaLink"
 POR_ellalink_desc: "The first direct cable between Europe and Latin America lands at Sines. Data between Fortaleza and Lisbon stops taking the long way round through the United States."
 POR_sines_caia_railway: "The Sines–Caia Railway"
 POR_sines_caia_railway_desc: "A freight line from Sines through Évora to the Spanish border at Caia gives the port a hinterland that reaches Madrid. Trains, not lorries, carry its containers inland."
 POR_marine_science_centre: "The Marine Science Centre"
 POR_marine_science_centre_desc: "The University of the Algarve's Centre of Marine Sciences studies the coast that feeds and employs the region. Its fisheries research and aquaculture trials give the Algarve something to sell besides sunshine."
 POR_albufeira_desalination: "The Albufeira Desalination Plant"
 POR_albufeira_desalination_desc: "The Algarve's reservoirs fell to a tenth of their capacity in the drought of 2023. A desalination plant at Albufeira gives the region water that does not depend on the rain, for the orchards as much as the hotels."
 POR_algarve_ocean_farms: "The Ocean Farms"
 POR_algarve_ocean_farms_desc: "Offshore cages for sea bream and mussel lines off Armona supply the fish that the exhausted coastal grounds no longer can. The Algarve's harbours land farmed fish all year round."
 POR_algarve_water_grid: "The Algarve Water Grid"
 POR_algarve_water_grid_desc: "A pipeline from Alqueva across the serra ties the Algarve into the largest reservoir in western Europe. The south's water no longer depends on one dry winter."
 POR_faro_airport_expansion: "The Faro Airport Expansion"
 POR_faro_airport_expansion_desc: "Nine million passengers a year squeeze through a terminal built for half that number. A bigger terminal at Faro lets the Algarve sell its spring and autumn as well as its August."
 POR_year_round_algarve: "The Year-Round Algarve"
 POR_year_round_algarve_desc: "Remote workers, retirees and golfers do not need August. Long-stay visas, coworking spaces in Lagos and Tavira and winter flights fill the Algarve's towns outside the season."
 POR_algarve_line: "The Algarve Line"
 POR_algarve_line_desc: "The railway along the Algarve coast still runs diesel trains on a single track. Electrifying it and linking Faro airport to the line gives the coast a commuter railway."
 POR_portimao_yards: "The Portimão Yards"
 POR_portimao_yards_desc: "Portimão's shipyards built trawlers until the fleet was scrapped. Yachts, crew transfer vessels for the offshore wind farms and patrol boats fill them again."
 POR_funchal_cruise_port: "The Funchal Cruise Port"
 POR_funchal_cruise_port_desc: "Half a million cruise passengers a year step ashore at Funchal for a day. A new quay and terminal let the largest liners berth, and keep their passengers in the city long enough to spend."
 POR_digital_nomad_village: "The Digital Nomad Village"
 POR_digital_nomad_village_desc: "Ponta do Sol offered remote workers free desks, fast internet and a sea view, and thousands applied in the first month. The island has learned that people who can work from anywhere can be persuaded to work from here."
 POR_socorridos_pumped_storage: "The Socorridos Pumped Storage"
 POR_socorridos_pumped_storage_desc: "An island grid cannot import power when the wind drops. Pumping water back up the Socorridos valley at night stores Madeira's wind and sun for the evening peak."
 POR_porto_santo_fossil_free: "Fossil-Free Porto Santo"
 POR_porto_santo_fossil_free_desc: "Porto Santo has five thousand people, one power station and a great deal of sun. Solar farms, batteries and the electric cars charged from them make it the first island in the Atlantic to run without burning oil."
 POR_madeira_tecnopolo: "Madeira Tecnopolo"
 POR_madeira_tecnopolo_desc: "Funchal's technology park houses the university's laboratories and the island's start-ups on the hill above the city. Turning it into a research campus gives Madeira's graduates a reason to come home."
 POR_madeira_data_island: "The Data Island"
 POR_madeira_data_island_desc: "The cables between Europe, Africa and the Americas pass Madeira, and the island's mild climate cools servers for free. Landing stations and data halls make it a switching point for the Atlantic's traffic."
 POR_ponta_delgada_port: "The Port of Ponta Delgada"
 POR_ponta_delgada_port_desc: "Ponta Delgada is the Azores' link to the world, and its quay was built for cargo ships half the size of today's. A deeper harbour and a cruise terminal bring both the freight and the visitors."
 POR_santa_maria_spaceport: "The Santa Maria Spaceport"
 POR_santa_maria_spaceport_desc: "Santa Maria already tracks satellites for the European Space Agency, and its position in mid-Atlantic suits launches into polar orbit. A spaceport for small launchers gives Europe another way into space."
 POR_deep_sea_observatory: "The Deep-Sea Observatory"
 POR_deep_sea_observatory_desc: "The Mid-Atlantic Ridge runs under the Azores, with hydrothermal vents and seabed minerals nobody has yet mined. Cabled sensors and research vessels give us the science, and the first claim on what lies down there."
 POR_ribeira_grande_geothermal: "The Ribeira Grande Geothermal Plant"
 POR_ribeira_grande_geothermal_desc: "São Miguel sits on a volcano, and the steam under Ribeira Grande already supplies part of the island's power. Expanding the plants lets the Azores stop shipping diesel across the ocean to make electricity."
 POR_terceira_tech_island: "Terceira Tech Island"
 POR_terceira_tech_island_desc: "When the Americans cut the Lajes garrison, Terceira lost its largest employer. Empty base housing becomes a technology park, and islanders retrained as programmers find work that does not depend on Washington."
 POR_air_centre: "The AIR Centre"
 POR_air_centre_desc: "The Atlantic International Research Centre brings the countries around the ocean together to study it from space, from the surface and from the seabed. We offer Terceira as its headquarters."
 POR_atlantic_data_crossroads: "The Atlantic Data Crossroads"
 POR_atlantic_data_crossroads_desc: "Every new cable between Europe and the Americas wants a landing halfway across. The Azores become the mid-ocean exchange where the Atlantic's data is switched, stored and sold."
 POR_civilian_facility_tt: "Builds a §Y$nuclear_facility$§! in a core state with no research facility."
 POR_chip_inputs_tt: "Microchip plants need §Ytungsten§! and §Ychromium§!. Portugal mines tungsten but must import chromium, and a plant without either produces nothing"
 POR_cohesion_funds_paid_tt: "As a member of the §YEuropean Union§!, the cohesion funds pay for these buildings: §Gno treasury cost§!"
 POR_aljubarrota: "Aljubarrota"
 POR_aljubarrota_desc: "In 1385 a Portuguese army with English archers broke the Castilian host at Aljubarrota, and Portugal stayed a country. The claims we write down now are Galicia, Ceuta and the islands Madrid holds by habit, and a war over them would have a purpose."
 POR_spanish_spoils_category: "The Spanish Spoils"
 POR_spanish_spoils_category_desc: "Spain is at war with us, or at war with itself in a war we started or took a side in. What we occupy, and what a distracted Spanish government cannot hold, can be taken."
 POR_seize_galicia: "Seize Galicia"
 POR_seize_galicia_desc: "Galician is a sister of Portuguese or a dialect of it, depending on which university you ask. This week the question is settled in Lisbon."
 POR_seize_ceuta: "Seize Ceuta"
 POR_seize_ceuta_desc: "Ceuta was the first place Portugal ever took overseas, in 1415, and the one Spain kept when we broke away in 1640. Morocco will like our ownership no better than Spain's."
 POR_seize_canary_islands: "Seize the Canary Islands"
 POR_seize_canary_islands_desc: "The Treaty of Alcáçovas gave the Canaries to Castile in 1479 in exchange for the rest of the Atlantic. Madeira has had the better view of that bargain ever since."
 POR_seize_balearic_islands: "Seize the Balearic Islands"
 POR_seize_balearic_islands_desc: "Nothing ties the Balearics to Lisbon except that Madrid cannot hold them this week."
 portugal.80.t: "Portugal Asks for Royal Navy Licences"
 portugal.80.d: "The Portuguese defence attaché has delivered a formal request for licences to build our newest warship designs at the Alfeite arsenal, and for a team of British naval architects and yard engineers to show the Portuguese how. Lisbon offers to pay the team's costs in full, up front.\n\nThe Ministry of Defence sees an export order and a closer ally on the Atlantic flank. The Treasury sees designs it paid for leaving the country, and a cheque that almost covers them."
 portugal.80.a: "Grant the licences and send the engineers"
 portugal.80.b: "Not this year"
 portugal.82.t: "Hereford Places for Portugal"
 portugal.82.d: "Lisbon asks for places on the Special Air Service selection and training courses for officers of the Portuguese commandos and the Special Actions Detachment. The regiment chooses its foreign students itself and takes very few.\n\nIt is a favour between allies, and one the Portuguese have returned: Lajes and the Azores have never been closed to us."
 portugal.82.a: "Open the courses"
 portugal.82.b: "The courses are full"
 portugal.83.t: "London Says No"
 portugal.83.d: "The Foreign Office has answered our request with regret and a promise to revisit it. The alliance is six centuries old, and London is in no hurry."
 portugal.83.a: "We will ask again"
 portugal.84.t: "Portugal in 2000"
 portugal.84.d: "Portugal enters the new century in the euro, in NATO and in debt. Our economy competes on price against countries that pay less, our administration is slow, our young people leave, and the end of the empire in 1975 left a country unsure what it is for. Each of these is a national spirit, and each one names the focuses that fix it.\n\n§YWhat is different here§!\nPortugal does not conquer. It shapes other countries instead of annexing them.\nThe §YLusophone Community§! branch builds intelligence networks in the former colonies. With deep influence, a bought officer corps and a false-flag raid, Portugal can start a civil war there, then choose which side to recognise.\nThe §YCampaigns§! commit Portugal to a side in the wars already running, from Angola in 2000 onward. If our side wins, the winner pays us.\n§YThe Balance of Powers§! does the same with countries that can answer back: Spain, Britain, the United States, China, Brazil and, if it forms without us, a federated Europe, each with a friendly road and a hostile one.\nEvery covert act raises §YExposure§!. Brussels and NATO are watching, and a Portugal that is caught must eventually choose between Europe and its clients.\n\n§YAt home§!\nParliamentary blocs decide which parts of the §YProgramme of Government§! can pass, and the next majority can reverse them. The §YIdeological Question§! tracks how far the country's arguments have gone. §YRegional Development§! builds outside Lisbon, and each of the armed services can buy a research facility and expensive research ahead of its time."
 portugal.84.a: "We have work to do"
 portugal.84.b: "How does the shadow war work?"
 portugal.85.t: "The Shadow War"
 portugal.85.d: "The shadow war turns influence and intelligence into client governments, and it shows on the §YExposure§! meter above.\n\n§Y0. Choose an enemy§!\nEach former colony's Campaign chain ends in a choice between friendly and hostile relations. Hostile relations open the decisions and operations below against that country. The five small states (Guinea-Bissau, Cape Verde, Sao Tome, East Timor and Equatorial Guinea) are too small for a civil war, so their hostile focus buys the government outright once we hold §Y30%§! influence, and pays the step 5 reward at once, skipping steps 1 to 4. The §YLusosphere§!, §YIberian§! and §YHispanosphere§! sections of flags show which countries are open: each Lusophone country and Spain once we choose hostile relations with it, Andorra, Morocco and the Hispanic world once we proclaim the §YIberian Union§!. Click a flag to show only that country's decisions; it starts on Angola.\n\n§Y1. Build§!\nThe §Y$POR_sied$§! focus founds our intelligence agency, and its operatives build a §Ynetwork§! in the target. The §Y$operation_infiltrate_civilian$§! and §Y$operation_infiltrate_armed_forces_army$§! operations and the §Y$POR_buy_the_officer_corps$§! decision §Yinfiltrate§! its government and army. The Campaign focuses and §Y$POR_cultivate_influence$§! raise our §Yinfluence§!. Every decision here takes time to complete.\n\n§Y2. Pretext§!\nThe §Y$POR_operation_false_flag$§! operation (§Y$POR_special_actions_detachment$§! focus) costs the target §R5%§! stability and leaves its regime looking for someone to blame. That pretext lasts 180 days.\n\n§Y3. The rising§!\nThe §Y$POR_operation_directed_rising$§! operation (§Y$POR_directed_rising$§! focus) starts a civil war. It needs a §Y70%§! network, both infiltrations, §Y30%§! influence, a recent False Flag, 5,000 small arms and 12 billion. When the shooting starts, we choose whom to recognise.\n\n§Y4. Fight§!\nSend volunteers to our side; the Legion focuses make them easier to send, at any world tension. A civil war in §YBrazil§!, §YSpain§! or §YMozambique§! is also a chance to take a province: §Y$POR_aid_landing_ground$§!, §Y$POR_protect_galicians$§! and §Y$POR_secure_cahora_bassa$§!. When the war ends, we decide whether to hand it back.\n\n§Y5. Collect§!\nIf our side wins it becomes an associated state and pays §G50%§! influence, trade relations, Political Power and the resource rights of one of its states, and its factories work for us (§G25%§! of its civilian and military factories). Backing a side that was already winning pays less.\n\n§Y6. Afterwards§!\nA country just out of a civil war is weak. §Y$POR_destabilise$§! (§Y$POR_war_by_proxy$§! focus) lowers its stability; once it is below §Y30%§! and our influence there is above §Y50%§!, §Y$POR_impose_protectorate$§! (§Y$POR_protectorate$§! focus) gives us a war goal to invade it and keep it as a puppet.\n\nEvery step raises §YExposure§!, which Brussels watches; §Y$POR_burn_the_dossier$§! lowers it. A country deep in our sphere can find the people we planted and purge them."
 portugal.85.a: "Understood"
 portugal.85.b: "Back to the overview"
 POR_madrid_government_cedes_tt: "The government we installed in §YMadrid§! still holds §YGalicia§! and shares our outlook"
 POR_coalition_agreement: "Coalition Agreement"
 POR_coalition_agreement_desc: "No Portuguese party governs alone for long. The Socialists can bring the Left Bloc and the Communists into a written agreement once the old taboo against it breaks, and the Social Democrats can take the Christian Democrats into government as they did in 2002."
 POR_royal_navy_surplus_desc: "The Royal Navy is retiring a generation of ships designed before 1985: patrol boats, mine-hunters, Type 22 frigates, the Invincible carriers and the older attack submarines. We will offer to buy every one of them, and London will decide how much of its old navy it is willing to see in Portuguese colours."
 POR_royal_navy_surplus_tt: "§YLondon§! decides whether to sell us its older warships, and which ones. If it sells, we pay for each ship that arrives."
 POR_sale_everything_tt: "Sell Portugal every ship we hold of a model from 1985 or older: §Y26§! patrol and mine-warfare ships, §Y6§! Type 22 frigates, §Y4§! helicopter carriers and §Y12§! attack submarines. Portugal pays §Y$$0.5 billion§! for each patrol or mine-warfare ship, §Y$$2 billion§! for each frigate, §Y$$6 billion§! for each helicopter carrier and §Y$$1.5 billion§! for each attack submarine it receives. If a ship on the list has been lost, London sends another of the same type in its place, at the same price."
 POR_sale_support_tt: "Sell Portugal our §Y26§! older patrol and mine-warfare ships. Portugal pays §Y$$0.5 billion§! for each one it receives. If a ship on the list has been lost, London sends another of the same type in its place, at the same price."
 portugal.81.t: "Portugal Offers to Buy the Old Navy"
 portugal.81.d: "Lisbon has offered to buy every Royal Navy ship of a model designed before 1985: the Hunt mine-hunters, the Archer and Castle patrol boats, the Type 22 frigates, the Invincible carriers, HMS Fearless and the older attack submarines. The Treasury sees money for hulls it would otherwise scrap.\n\nThe Admiralty sees half a fleet sailing away. The patrol and mine-warfare ships are easy to spare. The rest are not."
 portugal.81.a: "Sell them everything"
 portugal.81.b: "Only the support ships"
 portugal.81.c: "Sell nothing"
 POR_rosyth_contract: "Rosyth Contract"
 POR_rosyth_contract_desc: "The Queen Elizabeth carriers were assembled in blocks at Rosyth from yards across Britain. A third hull, built on the same line to the same design, would give Portugal the only carrier in the Atlantic flank of the alliance that the Royal Navy did not have to pay for."
 POR_rosyth_opinion_tt: "§YEngland§! has an opinion of us above §Y50§!"
 POR_rosyth_focus_tt: "§YEngland§! has completed the focus §YQueen Elizabeth Class Aircraft Carrier§!"
 POR_rosyth_carrier_tt: "§YEngland§! has at least §Y1§! aircraft carrier"
 POR_rosyth_contract_tt: "Two years later, we receive a §GQueen Elizabeth-class carrier§!, the NRP D. João II"
 POR_rosyth_refund_tt: "The carrier is not delivered. Half the price, §G$$15 billion§!, is recovered"
 portugal.86.t: "Portugal Orders a Carrier"
 portugal.86.d: "Lisbon wants a third Queen Elizabeth-class carrier, built at Rosyth to our design and paid for in advance. Thirty billion keeps the yards on the Forth busy for two years and puts an allied carrier on the Atlantic approaches.\n\nThe Admiralty would rather the next hull were ours. The Treasury would rather it were paid for by someone else."
 portugal.86.a: "Take the order"
 portugal.86.b: "The yards are full"
 portugal.87.t: "The Carrier Arrives"
 portugal.87.d: "Two years after the contract was signed, the carrier the British built for us has sailed from the Forth. She is too large for any berth in Lisbon and we have no aircraft to put on her yet, but she is ours."
 portugal.87.a: "Welcome her home"
 POR_luanda_not_refused_tt: "Angola has §Ynot§! refused an offer from us in the last §Y365 days§!"
 POR_unita_not_refused_tt: "UNITA has §Ynot§! refused an offer from us in the last §Y365 days§!, or the war is over"
 POR_bissau_not_refused_tt: "Guinea-Bissau has §Ynot§! refused an offer from us in the last §Y365 days§!"
 POR_maputo_not_refused_tt: "Mozambique has §Ynot§! refused an offer from us in the last §Y365 days§!"
 POR_dili_not_refused_tt: "East Timor has §Ynot§! refused an offer from us in the last §Y365 days§!"
 POR_malabo_not_refused_tt: "Equatorial Guinea has §Ynot§! refused an offer from us in the last §Y365 days§!"
 POR_offer_refused_tt: "This focus is §Runcompleted§! and the days spent on it are §Rnot refunded§!. The other focus of this pair opens, and this offer cannot be made again for §Y365 days§!"
 POR_offer_backing_accepted_tt: "Portugal backs us in the war and its §Yinfluence§! here grows. If we win, it is paid in §Yfurther influence§! here, and our §Ytrade relations§! with Portugal improve"
 POR_offer_backing_declined_tt: "Portugal cannot make us this offer again for §Y365 days§!, and is §Rfree to back our enemy§! instead"
 POR_offer_treaty_accepted_tt: "We sign a §Gstanding treaty§! with Portugal. Its §Yinfluence§! here grows by §Y10%§!, its §Yinternational investment§! rises, and it can §Gnever§! run a §YDirected Rising§! against us"
 POR_offer_treaty_declined_tt: "Portugal cannot make us this offer again for §Y365 days§!, and nothing stops it preparing a §Rrising§! here"
 portugal.88.t: "An Offer from Lisbon"
 portugal.88.d_agl: "The Portuguese ambassador has brought a proposal: Portugal will back this government in the war, say so in public, and pay for the privilege. Since Bicesse, Lisbon has sat as an observer at every attempt to settle this war and taken neither side.\n\nIt is choosing ours now, and it will expect to be remembered when the war is over."
 portugal.88.d_uni: "A Portuguese intermediary has reached our headquarters with an offer: money, a channel to Europe, and a government in Lisbon willing to deny both for as long as denial holds. Portugal has recognised the MPLA since 1976, and it now offers to back us against it.\n\nLisbon does nothing for nothing. If we ever reach Luanda, it will want to be paid."
 portugal.88.d_peace: "The Portuguese ambassador has brought a proposal: a standing treaty of friendship and cooperation. It would make Portugal a principal partner in Luanda in writing, and bind it never to sponsor a rising against the government that signs it.\n\nPortuguese firms have been bidding for reconstruction work since the guns stopped. The treaty would make them the first in the queue."
 portugal.88.d_gub: "Lisbon proposes a standing treaty of friendship, cooperation and defence. It would make Portugal our principal partner in writing, and bind it never to sponsor a rising against the government that signs it.\n\nIt would also tell every general in Bissau which of them Portugal intends to keep dealing with."
 portugal.88.d_moz: "Lisbon proposes a treaty covering the gas, the dam and the officer exchanges, with no conditions attached to any of it and a written undertaking never to sponsor a rising against the government that signs it.\n\nThe other patrons want the port and attach conditions to everything. Lisbon attaches none, and still has RENAMO's telephone number."
 portugal.88.d_tim: "Lisbon proposes a treaty to Dili, with a written undertaking never to sponsor a rising against the government that signs it. We chose Portuguese against the advice of every donor we consulted, and this is Lisbon's offer of what that choice was worth.\n\nThe grievances inside our own army are on file in Lisbon too."
 portugal.88.d_egu: "Lisbon proposes a treaty to Malabo: oil, Portuguese teaching, an end to the questions the rest of the community keeps asking about our prisons, and a written undertaking never to sponsor a rising against the government that signs it.\n\nThe last clause is worth more than the rest combined. The government-in-exile in Madrid would read a refusal as an invitation."
 portugal.88.a: "Accept Lisbon's offer"
 portugal.88.b: "Turn Lisbon down"
 portugal.89.t: "[FROM.GetName] Accepts"
 portugal.89.d_backing: "[FROM.GetName] has taken our offer. We are committed in the Angolan war now, and the money leaves this week.\n\nWhat it buys depends on who is still standing at the end."
 portugal.89.d_treaty: "[FROM.GetName] has signed. The treaty binds us never to sponsor a rising there and binds them to very little, and both governments consider that they got the better of it."
 portugal.89.a: "Then it is agreed"
 portugal.90.t: "[FROM.GetName] Turns Us Down"
 portugal.90.d_backing: "[FROM.GetName] has refused our backing, and made sure we heard it from them before we read it in the newspapers. We cannot ask them again for a year, and the war will not wait for us."
 portugal.90.d_treaty: "[FROM.GetName] has declined the treaty. The draft goes back into the file, we cannot put it to them again for a year, and nothing now binds us to leave their government alone."
 portugal.90.a: "Reopen the file"
 POR_lisbon_porto_line: "Lisbon-Porto Line"
 POR_lisbon_porto_line_desc: "Whatever becomes of the line to Madrid, the one most of us would ride runs north. The Alfa Pendular still tilts through curves laid in the nineteenth century. New track through Leiria, Coimbra and Aveiro, with rail terminals in the Centre and the North, puts Porto an hour and a quarter from Lisbon."
 POR_southern_rail_corridor: "Southern Freight Corridor"
 POR_southern_rail_corridor_desc: "Containers landed at Sines reach Spain by road, or by rail through the outskirts of Lisbon. A freight line from the port through Évora to the border at Elvas puts the harbour on the direct route to Madrid, with a rail terminal in the Alentejo to sort the traffic."
 POR_port_of_leixoes: "Leixões and Pedras Rubras"
 POR_port_of_leixoes_desc: "Leixões ships most of the North's exports, and the airport at Pedras Rubras draws passengers from as far as Galicia. A new quay at the port and more room at the airport let Porto trade with the world without going through Lisbon."
 POR_douro_valley: "Douro Valley"
 POR_douro_valley_desc: "Port wine has come down the Douro for three centuries from terraces cut into the valley's slate. New vineyards and a better road up the river bring the harvest down to market and the tourists up past Peso da Régua."
 POR_autoeuropa: "Palmela Car Plant"
 POR_autoeuropa_desc: "Volkswagen's Autoeuropa plant at Palmela is one of our largest exporters, and every new model it builds has to be won against factories in Germany and Spain. A second assembly hall and better roads on the Setúbal peninsula win the next one."
 POR_alqueva_solar: "Floating Solar at Alqueva"
 POR_alqueva_solar_desc: "The Alqueva reservoir covers two hundred and fifty square kilometres of the Alentejo, under some of the strongest sunshine in Europe. Panels floating on the water generate power without taking a hectare from the farms it irrigates."
 POR_sines_data_campus: "Sines Data Campus"
 POR_sines_data_campus_desc: "Sines is the natural landing point for undersea cables to Brazil and Africa, and the Alentejo sun makes its power cheap. Offices and fibre beside the port bring the data centres, and the engineers who run them, to our coast instead of to Madrid."
 POR_algarve_water: "Water for the Algarve"
 POR_algarve_water_desc: "In a dry year the Algarve's reservoirs fall to a fraction of their capacity, and the hotels, golf courses and orange groves all draw on the same aquifers. A desalination plant on the coast and new irrigation networks keep the farms working through the summer."
 POR_madeira_runway: "Madeira Runway"
 POR_madeira_runway_desc: "Funchal's runway is squeezed between the mountains and the sea, and too short for fully loaded jets. An extension built on columns over the water lets them land, and new roads from the airport carry their passengers into a year-round tourist season."
 POR_azores_air_links: "Azores Air Links"
 POR_azores_air_links_desc: "Nine islands spread across six hundred kilometres of ocean depend on SATA for everything from hospital transfers to the post. Better airfields and a new cable between the islands connect the smallest of them to Ponta Delgada and the mainland."
 POR_federation_without_us_tt: "A §YEuropean federation§! has formed, and we are §Rnot§! a member of it"
 POR_uk_request_refused_tt: "The focus is §Runcompleted§!, and we can ask London again"
 POR_mibel: "Iberian Electricity Market"
 POR_mibel_desc: "The Santiago agreement of 2004 merges the Portuguese and Spanish power exchanges into one market, with one price and new lines across the Minho. On a still night our grid imports Spanish power, and on a windy one Spain buys ours. The junior partner's lights now depend on the senior partner's generators, and they are cheaper for it."
 POR_albufeira_convention: "Albufeira Convention"
 POR_albufeira_convention_desc: "Five rivers rise in Spain and reach the sea in Portugal, and in a dry year the Tagus crosses the border as a trickle. The 1998 convention fixes how much water Madrid must let through, and its 2008 protocol puts figures on it. Holding Spain to those figures keeps the irrigated farms of the Centre in business."
 POR_gibraltar_with_madrid: "Gibraltar with Madrid"
 POR_gibraltar_with_madrid_desc: "Madrid expects Lisbon to back it on the Rock as one Iberian neighbour backs another, and this time Lisbon does. We tell London in writing that the colonial era ended in Macau in 1999 and should end in Gibraltar too, and the Foreign Office will remember who said it.\n\nIf Madrid has already pressed its claim, our support arrives when it is worth the most."
 POR_almaraz_complaint: "Almaraz Complaint"
 POR_almaraz_complaint_desc: "Two Spanish reactors stand on the Tagus a hundred kilometres upstream of the border, on the river that reaches the sea at Lisbon. Every Portuguese party agrees about Almaraz. We file a formal complaint and make Madrid defend the plant in public. The engineers, journalists and campaigners who build the case also give us people inside Spain who can be asked for more."
 POR_the_ultimatum: "1890 Ultimatum"
 POR_the_ultimatum_desc: "In January 1890 London gave Lisbon hours to withdraw from the lands between Angola and Mozambique or face the Royal Navy, and Lisbon withdrew. That winter's protest song, which told the Portuguese to march against the Britons, became the national anthem. The oldest alliance has always cost more than it paid, and we stop pretending otherwise."
 POR_side_with_buenos_aires: "Siding with Buenos Aires"
 POR_side_with_buenos_aires_desc: "Buenos Aires asks every Latin country to call the islands the Malvinas, and Brasilia already does. Saying so costs us nothing in the South Atlantic and earns a hearing in Mercosur, at the price of a formal protest from London."
 POR_falcon_upgrade: "Falcon Upgrade"
 POR_falcon_upgrade_desc: "The Peace Atlantis programme gave us our first F-16s, and the United States Air Force has more of them parked in the Arizona desert. A second batch, rebuilt at OGMA in Alverca, would fill the squadrons at Monte Real for a fraction of the price of anything new, if Washington agrees to sell."
 POR_falcon_upgrade_tt: "We choose how many F-16s to ask the §YUnited States§! for, and Washington decides how many to sell."
 POR_falcon_refused_tt: "The focus is §Runcompleted§!, and we can ask Washington again"
 POR_usa_invading_iraq_tt: "The §YUnited States§! has prepared the invasion of §YIraq§!"
 POR_atlantic_centre: "Atlantic Centre"
 POR_atlantic_centre_desc: "The Americans have cut Lajes to a skeleton crew, and the empty buildings on Terceira can house something else: a defence centre for the whole Atlantic, open to every allied navy and run from Lisbon. It puts a radar on the islands and gives Washington a partner that does more than rent out a runway."
 POR_terceira_stopover: "Terceira Stopover"
 POR_terceira_stopover_desc: "In June 2012 the Chinese premier's aircraft landed at Lajes on the way home from Latin America, and he spent a day on Terceira, the island the Americans were leaving. Nothing was signed. We let it be known that something could be, and Washington notices."
 POR_out_of_the_command: "Out of the Command"
 POR_out_of_the_command_desc: "France left NATO's integrated command in 1966 and kept its seat in the alliance's councils. We go further: the treaty is denounced, our officers come home from Norfolk and Brunssum, and the Azores are a Portuguese matter again."
 POR_troika_privatisations: "Crisis Privatisations"
 POR_troika_privatisations_desc: "Whether the money comes from the Troika or from markets that charge us for the privilege, the state has to sell. The best bids for the electricity company and the grid are Chinese: Three Gorges for EDP, State Grid for REN. Selling to them fills the treasury at once and gives Beijing a permanent seat in the boardrooms that keep our lights on."
 POR_golden_visas: "Golden Visas"
 POR_golden_visas_desc: "From October 2012 a foreigner who buys a Lisbon flat for half a million euros receives a residence permit and, with it, free movement across the Schengen area. Most of the first buyers are Chinese, and the money goes straight into property."
 POR_screening_foreign_capital: "Screening Foreign Capital"
 POR_screening_foreign_capital_desc: "Europe is screening foreign investment, and the American ambassador has made plain which purchases Washington has in mind. Lisbon writes its own law to block a purchase on security grounds, and the next Chinese bid for a port, a grid or a network is examined before it is signed."
 POR_macanese_passports: "Macanese Passports"
 POR_macanese_passports_desc: "More than a hundred thousand people in Macau hold Portuguese passports, issued before 1999 and never withdrawn. As Beijing closes the gap between its two systems, we declare every one of those passports as good as one issued in Lisbon, and say so where Beijing can hear it. The first to use them will be the ones with the most to move."
 POR_bilateral_agreements: "Bilateral Agreements"
 POR_bilateral_agreements_desc: "Europe has federated and we are outside its single market. Switzerland spent twenty years building its way in one treaty at a time, on customs, transport, research and farming, and we can do the same without a vote in anything."
 POR_bilateral_agreements_tt: "Every member of the §YEuropean federation§! gains §G+30§! trade opinion of us, and we of them"
 POR_associated_partnership: "Associated Partnership"
 POR_associated_partnership_desc: "Norway takes rules it did not write, and in exchange its companies sell anywhere from Lisbon to Warsaw. An association agreement with the federation puts that bargain on paper, and European investors treat us as if we were still inside."
 POR_atlantic_identity: "Atlantic Identity"
 POR_atlantic_identity_desc: "Portugal was an Atlantic country for five centuries before it was a European one. If Europe has become a state without us, our partners are across the water, in London and Washington."
 POR_atlantic_identity_tt: "Every member of the §YEuropean federation§! gains §R-15§! opinion of us"
 POR_close_the_eez: "Closing the Economic Zone"
 POR_close_the_eez_desc: "Our exclusive economic zone is one of the largest in Europe, and European fleets have fished it under the common policy since 1986. We close it to them and sell licences to whoever pays. The federation answers with trade restrictions."
 POR_close_the_eez_tt: "Every member of the §YEuropean federation§! gains §R-50§! trade opinion of us"
 portugal.91.t: "Portugal Asks for F-16s"
 portugal.91.d: "Lisbon asks to buy [?FROM.POR_falcon_request] squadrons of surplus F-16s from storage at Davis-Monthan, to be rebuilt in Portugal and paid for in cash. The Air Force wants the airframes gone. The State Department notes that the ally asking is the one that lends us Lajes, and that Lisbon may not need quite so many."
 portugal.91.a: "Sell them every aircraft they asked for"
 portugal.91.b: "The aircraft are spoken for"
 portugal.91.c: "Sell them half"
 portugal.92.t: "Washington Says No"
 portugal.92.d: "The State Department has declined to release the F-16s, citing other commitments and promising to keep the file open. The aircraft stay in Arizona for now."
 portugal.92.a: "We will ask again"
 portugal.122.t: "How Many Falcons?"
 portugal.122.d: "Davis-Monthan holds enough stored F-16s to re-equip the whole Air Force, and OGMA can rebuild them at Alverca as fast as the money arrives. The Ministry of Finance would settle for one squadron and the Air Force wants four. Washington will decide how many it actually releases."
 portugal.122.a: "One squadron"
 portugal.122.b: "Two squadrons"
 portugal.122.c: "Four squadrons"
 POR_falcon_request_1_tt: "We ask Washington for §Y24§! F-16s, at §Y$$0.25 billion§! each"
 POR_falcon_request_2_tt: "We ask Washington for §Y48§! F-16s, at §Y$$0.25 billion§! each. It may sell only half"
 POR_falcon_request_4_tt: "We ask Washington for §Y96§! F-16s, at §Y$$0.25 billion§! each. It may sell only half"
 portugal.87.t_lost: "The Carrier That Never Sailed"
 portugal.87.d_lost: "The carrier we paid for at Rosyth will not come. The yard that built her answers to a government we are at war with, or to no government at all, and all that is left of the contract is what our lawyers can recover."
 portugal.87.b: "Take back what we can"
 POR_shenzhen_supply_chains: "Shenzhen Supply Chains"
 POR_shenzhen_supply_chains_desc: "Chinese factories have learned to build almost anything faster and cheaper than anyone else, and they will teach it to partners who buy their machines. Portuguese manufacturers go to Shenzhen to see how it is done, and Chinese engineers come to Aveiro and Setubal to show them again."
 POR_chinese_contractors: "Chinese Contractors"
 POR_chinese_contractors_desc: "The companies that built China's railways and ports now bid on public works across the world, and they bid low. Letting them into our tenders brings their methods and their crews with them, and our projects finish on time for once. It also puts Chinese firms inside Portuguese infrastructure."
 POR_macau_free_port: "Macau Free Port"
 POR_macau_free_port_desc: "American tariffs have left Beijing looking for a door Washington cannot close. Macau is the one Chinese city that still runs on Portuguese law. We offer to take back its administration under a lease, pay for the privilege, and run it as a free port where Chinese goods leave as Portuguese re-exports. Washington will notice."
 POR_macau_free_port_tt: "§YChina§! hands §YMacau§! to us as a §Gsubject§! and a free port for Chinese goods. The §Y60 billion§! we pay becomes an international investment"
 POR_macau_rent_paid_tt: "Rent of §R1 billion§! a month is paid to §YChina§! for as long as §YMacau§! stays a Portuguese subject"
 POR_macau_rent_received_tt: "Rent of §G1 billion§! a month is received from §YPortugal§! for as long as §YMacau§! stays its subject"
 POR_china_request_refused_tt: "The focus is §Runcompleted§!, and we can ask Beijing again"
 POR_macau_full_sovereignty: "Full Sovereignty over Macau"
 POR_macau_full_sovereignty_desc: "The lease was a way back in, and we are in. Macau is governed from Lisbon and paid for every month. We can stop paying, annex the city outright and write off our stake in the lease. The People's Liberation Army is on the other side of the Barrier Gate, and we are about to find out how much Beijing is willing to risk over thirty square kilometers of casinos."
 POR_macau_rent_ends_tt: "The §YMacau Lease§! ends: we §Gstop paying rent§! to §YChina§!, and §YChina§! §Rkeeps our stake§! in the lease, up to §R60 billion§! of our international investments"
 POR_china_responds_tt: "§YChina§! chooses its answer: §Rsanctions§!, or, while we still hold §YMacau§!, a §Rwar goal§! on it or a protest; if it has retaken §YMacau§!, it may simply welcome the city home instead"
 POR_iberian_union: "A Union of the Peninsula"
 POR_iberian_union_desc: "Every Iberian federalist since the nineteenth century has imagined the union as something Madrid would offer and Lisbon would refuse. We reverse the roles: one state for the whole peninsula, governed from Lisbon, with room in it for every language the peninsula speaks."
 POR_iberian_union_opens_tt: "Opens §Y$IBR_dream_of_iberia$§!. Its first focus needs us to hold the whole peninsula."
 POR_spain_request_refused_tt: "The focus is §Runcompleted§!, and we can ask Madrid again"
 portugal.93.t: "Portugal Offers to Lease Macau"
 portugal.93.d: "Lisbon's ambassador has brought an unusual proposal to Zhongnanhai. Portugal would take back the administration of Macau under a lease, pay handsomely for it, and run the city as a free port under Portuguese law. Chinese goods landed in Macau would leave it as Portuguese re-exports, beyond the reach of American tariffs and embargoes.\n\nThe Ministry of Commerce calls it the most useful idea anyone has had since the trade war began. The Hong Kong and Macau Affairs Office calls it a return to 1998."
 portugal.93.a: "Lease Macau to Lisbon"
 portugal.93.b: "Macau is not for rent"
 portugal.94.t: "Beijing Says No"
 portugal.94.d: "The Chinese Foreign Ministry has answered our proposal in a single paragraph: Macau is an inalienable part of China, and its administration is not a commercial matter. The trade war will not last forever, and perhaps neither will that answer."
 portugal.94.a: "We will ask again"
 portugal.95.t: "Portugal Holds Macau"
 portugal.95.d: "Lisbon has torn up the Macau lease, annexed the city and still holds it. The rent has stopped, and the Leal Senado flies the Portuguese flag that came down in 1999.\n\nThe Politburo Standing Committee meets tonight. Every option on the table carries a cost."
 portugal.95.a: "Sanction Lisbon"
 portugal.95.b: "Macau will be returned"
 portugal.95.c: "Protest, and let it stand"
 portugal_news.13.t: "Portugal Annexes Macau"
 portugal_news.13.d: "The Portuguese flag flies again over the Leal Senado. Lisbon has declared its lease of Macau void and annexed the territory, ending the rent it paid Beijing and the arrangement that let Chinese goods reach Western markets through a Portuguese port.\n\nPeople's Liberation Army units are moving up to the Barrier Gate and the Lotus Bridge, and Portuguese troops have dug in around the old city. In Washington, officials who spent years complaining about the Macau loophole are waiting to see who blinks."
 portugal_news.13.a: "The last colony, again"
 portugal.96.t: "Lisbon Proposes a Union"
 portugal.96.d: "The Portuguese Prime Minister has come to Madrid with a proposal no Portuguese government has made in the four centuries since 1640: one state for the whole peninsula, its government seated in Lisbon, its regions keeping their languages and their parliaments.\n\nThe proposal is serious. Half of the cabinet thinks it is also absurd, and the other half is doing the arithmetic."
 portugal.96.a: "Accept the union"
 portugal.96.b: "Spain stays Spain"
 portugal.97.t: "Madrid Says No"
 portugal.97.d: "The Spanish government has declined our proposal with courtesy and without hesitation. The Iberian idea has survived four centuries of refusals, and it will survive this one."
 portugal.97.a: "We will ask again"
 portugal_news.14.t: "Spain and Portugal Unite"
 portugal_news.14.d: "The Spanish government has accepted Lisbon's proposal of a single state for the Iberian Peninsula, governed from Lisbon. Spain's ministries, armed forces and embassies now answer to the Portuguese government.\n\nThe union exists on paper. Whether Catalans, Basques and Galicians, and for that matter the Portuguese, come to think of themselves as Iberians is a question for the next generation."
 portugal_news.14.a: "One peninsula"
 POR_porto_seguro: "Treaty of Porto Seguro"
 POR_porto_seguro_desc: "Five hundred years after Cabral landed at Porto Seguro, the presidents of Portugal and Brazil sign a treaty of friendship on the same coast. Brazil has seventeen times our population and needs Lisbon for one thing only: a door into Europe. Regular summits make sure it knocks on ours first."
 POR_statute_of_equality: "Statute of Equality"
 POR_statute_of_equality_desc: "The Porto Seguro treaty lets a Brazilian living in Portugal claim the civil rights of a Portuguese citizen, and the vote on request, and gives the Portuguese in Brazil the same. Our farms, building sites and kitchens are short of hands, and Brazilians already speak the language. We make the statute work in practice and let them come."
 POR_pre_salt_stake: "Pre-Salt Stake"
 POR_pre_salt_stake_desc: "Petrobras has found oil under two kilometers of salt in the Santos Basin, in a block where Galp owns ten percent. Nobody yet knows whether the field can be produced at a profit. We back Galp to keep its share and pay its part of the drilling, and let Brazil carry the risk of finding out."
 POR_embraer_evora: "Embraer at Évora"
 POR_embraer_evora_desc: "Embraer already owns OGMA at Alverca and wants a European base for its business jets. We offer land outside Évora, tax breaks and a trained workforce if it builds its wing structures and composite parts there. Brasilia has to agree to send the work across the Atlantic, and the unions at São José dos Campos will ask why."
 POR_brazil_request_refused_tt: "The focus is §Runcompleted§!, and we can ask Brasilia again"
 POR_eu_mercosur: "Champion EU-Mercosur"
 POR_eu_mercosur_desc: "After twenty years of talks, the European Union and Mercosur have agreed a trade deal in principle, and France still means to block it. We argue for it in every council, because our exporters want Brazilian markets and Brazil wants a friend in Brussels. Our farmers expect Brazilian beef and sugar in their markets, and they say so loudly."
 POR_contest_for_luanda: "Contest for Luanda"
 POR_contest_for_luanda_desc: "Brazil's development bank lends to Angola and Mozambique on condition that Brazilian firms do the building, and Odebrecht now builds half of Luanda. Portuguese banks and contractors consider those markets their own. We use every tie of history, language and credit to push the Brazilians out, and Brasilia will remember it."
 POR_our_own_spelling: "Our Own Spelling"
 POR_our_own_spelling_desc: "The 1990 Orthographic Agreement spells Portuguese the Brazilian way and drops silent letters Portugal has written for centuries. Brazil has two hundred million speakers, and the dictionaries follow them. We refuse to apply the agreement and keep writing our language our way. Brasilia calls it pettiness. At home it is popular."
 POR_oi_veto: "Oi Veto"
 POR_oi_veto_desc: "Portugal Telecom wants to merge into Oi, which would hand our national telecom company and its African stakes to a Brazilian group. We make it plain that the government will not allow it. Portugal Telecom stays Portuguese and keeps its stakes in Angola and Cape Verde, and Brasilia files a complaint."
 portugal.98.t: "Lisbon Courts Embraer"
 portugal.98.d: "The Portuguese government has offered Embraer land outside Évora, tax breaks and a trained workforce if it builds wing structures and composite parts for its business jets there. Lisbon will pay part of the cost of the plants.\n\nThe company likes the offer. The unions at São José dos Campos do not, and the ministry asks why work Brazil could keep at home should cross the Atlantic."
 portugal.98.a: "Let Embraer build in Évora"
 portugal.98.b: "The jobs stay in São José dos Campos"
 portugal.99.t: "Brasilia Says No"
 portugal.99.d: "The Brazilian government has asked Embraer to keep the new work in Brazil, and the company has shelved the Évora plan. The land outside Évora stays empty for now, and our offer stays on the table."
 portugal.99.a: "We will ask again"
 POR_chinese_planners: "Chinese Planners"
 POR_chinese_planners_desc: "Chinese planning institutes lay out whole districts, ports and industrial parks in the time it takes us to approve one. We bring them in to redraw our zoning maps and fast-track our permits. The old estates of the Alentejo and the Ribatejo stand in the way of the new plans, and their owners know who drew them."
 POR_santa_margarida: "Santa Margarida"
 POR_santa_margarida_desc: "Santa Margarida already hosts our only mechanized brigade. Test ranges and workshops beside the tank park would give the Army somewhere to develop land systems of its own, instead of waiting for other armies' surplus."
 POR_new_chaimite: "New Chaimite"
 POR_new_chaimite_desc: "Bravia's Chaimite proved in the 1960s that we could design an armored vehicle of our own. A successor family, designed and tested at Santa Margarida, brings the next generation of armor within reach years early, if we are willing to pay for it."
 POR_battle_network: "Battle Network"
 POR_battle_network_desc: "EID already builds the radios our soldiers carry. Linking every rifle, sight, radio and command post into one network lets a small army see farther than it can shoot, and brings the next generation of infantry kit within reach years early."
 POR_viana_yards: "Viana do Castelo Yards"
 POR_viana_yards_desc: "The Viana do Castelo yards survive on patrol ships and state orders. A naval research center beside the slipways would give the Navy a place to design and test ships of its own, and give the yards a reason to exist."
 POR_repmus: "REPMUS"
 POR_repmus_desc: "Every year the Navy and the University of Porto take their unmanned boats and underwater robots to sea to find out what works. Funding the exercise properly turns a university trial into a program that puts our naval sensors years ahead of schedule."
 POR_vasco_da_gama_successor: "Vasco da Gama Successor"
 POR_vasco_da_gama_successor_desc: "The Vasco da Gama frigates were commissioned in 1991 and will not last forever. Designing their successor at home, with the Alfeite Arsenal doing the work, brings the next generation of frigate and corvette hulls within reach years early."
 POR_evora_aeronautics: "Évora Aeronautics Park"
 POR_evora_aeronautics_desc: "Évora has open land, clear skies and a university. An aeronautics park there, built around a research facility, would give the Air Force a place to develop aircraft and drones of its own instead of only flying other people's."
 POR_ceiia: "CEiiA"
 POR_ceiia_desc: "The engineers at CEiiA in Matosinhos design parts for other countries' aircraft. Paying them, and OGMA at Alverca, to work on airframes of our own brings the next generation of fighters within reach years early."
 POR_pitvant: "PITVANT"
 POR_pitvant_desc: "The Air Force Academy and the University of Porto have been flying small experimental drones together for years. PITVANT turns that research into a funded program and brings the next generation of military drones within reach years early."
 POR_second_proving_ground: "The Second Proving Ground"
 POR_second_proving_ground_desc: "Santa Margarida cannot test everything at once, and the queue for its ranges now decides which programme lives. A second proving ground lets the Army run two projects side by side."
 POR_second_naval_test_centre: "The Second Naval Test Centre"
 POR_second_naval_test_centre_desc: "Viana's slipways and the Alfeite arsenal are booked years ahead. A second test centre for hulls, sonars and weapons lets the Navy run more than one experiment at a time."
 POR_second_flight_test_centre: "The Second Flight Test Centre"
 POR_second_flight_test_centre_desc: "Évora can fly one prototype at a time. A second test centre, with its own range and hangars, gives the Air Force room to develop more than one aircraft at once."
 POR_three_army_programmes_tt: "We have completed at least §Y3§! of the Army's five research programmes"
 POR_three_naval_programmes_tt: "We have completed at least §Y3§! of the Navy's five research programmes"
 POR_three_air_programmes_tt: "We have completed at least §Y3§! of the Air Force's five research programmes"
 POR_free_facility_state_tt: "A core state we fully control has no research facility. A state holds only one facility of any kind, and §YCentral Portugal§!, §YNorthern Portugal§! and the §YAlentejo§! are kept for the three service facilities"
 POR_second_land_facility_tt: "Builds a §Y$land_facility$§! in a core state with no research facility."
 POR_second_naval_facility_tt: "Builds a §Y$naval_facility$§! in a coastal core state with no research facility."
 POR_second_air_facility_tt: "Builds an §Y$air_facility$§! in a core state with no research facility."
 POR_macanese_arrivals: "The Macanese Arrivals"
 POR_macanese_arrivals_desc: "Holders of Portuguese passports are leaving Macau for Lisbon and Porto: casino managers, lawyers, doctors, engineers and shopkeepers, with their families and their savings. They buy apartments, open firms and take up posts in our universities and hospitals."
 POR_macau_free_port_trade: "The Macau Free Port"
 POR_macau_free_port_trade_desc: "Portugal runs Macau as a free port under our lease. Our goods leave it as Portuguese re-exports, beyond the reach of American tariffs, and Lisbon buys our resources at a discount for the privilege."
 POR_macau_border_war_tt: "Two §YMacau Garrison§! brigades are raised in the city to hold it against the §YPeople's Liberation Army§!.\nIf we win, §YMacau§! stays §GPortuguese§!. If we lose, it §Rreturns to China§!. If neither side breaks within §Y90 days§!, the fighting stops and the city stays ours.\nHowever it ends, §YChina§! then chooses its answer."
 portugal.95.t_retaken: "Macau Is Ours Again"
 portugal.95.d_retaken: "Lisbon tore up the Macau lease and tried to keep the city by force. Our troops have crossed the Barrier Gate and the Lotus Bridge, the Portuguese garrison has been flown home, and the flag over the Leal Senado is ours again.\n\nThe Politburo Standing Committee must now decide what Lisbon pays for trying."
 portugal.95.e: "Welcome Macau home"
 portugal_news.13.d_quiet: "The Portuguese flag flies again over the Leal Senado. Lisbon has declared its lease of Macau void and annexed the territory, ending the rent it paid Beijing and the arrangement that let Chinese goods reach Western markets through a Portuguese port.\n\nBeijing calls it a violation of Chinese sovereignty and has promised a response. In Washington, officials who spent years complaining about the Macau loophole are finding little left to complain about."
 portugal.100.t: "The Barrier Gate Holds"
 portugal.100.d: "Our garrison has held Macau. After weeks of fighting around the Barrier Gate and on the approaches to the Lotus Bridge, the People's Liberation Army has pulled back to Zhuhai. The city is ours, and this time we do not pay rent for it.\n\nBeijing has not said its last word."
 portugal.100.a: "Macau is Portuguese"
 portugal.100.b: "The fighting in Macau is over"
 portugal.101.t: "Macau Falls"
 portugal.101.d: "The garrison could not hold. People's Liberation Army troops have crossed the Barrier Gate and the Lotus Bridge, and the governor has handed the city to Beijing. Our soldiers are being flown home from Macau's own airport.\n\nThe lease is gone, our stake in it is gone, and now so is Macau."
 portugal.101.a: "Bring the garrison home"
 portugal.101.b: "The fighting in Macau is over"
 portugal.102.t: "Standoff at the Barrier Gate"
 portugal.102.d: "Neither side has broken. The People's Liberation Army has stopped pushing at the Barrier Gate, our garrison still holds the city, and both governments now describe the fighting as an incident. Macau is ours for the moment. What happens next is Beijing's decision."
 portugal.102.a: "Hold what we have"
 portugal.102.b: "The fighting in Macau is over"
 portugal_news.15.t: "Macau Stays Portuguese"
 portugal_news.15.t_retaken: "China Retakes Macau"
 portugal_news.15.d: "The fighting at the Barrier Gate is over, and the Portuguese garrison still holds Macau. The People's Liberation Army has pulled back to Zhuhai, and Lisbon's flag still flies over the Leal Senado. Beijing has yet to say what comes next."
 portugal_news.15.d_retaken: "People's Liberation Army troops have crossed the Barrier Gate and the Lotus Bridge and retaken Macau. The Portuguese garrison has been flown home, and the flag Lisbon raised over the Leal Senado has come down for the second time in a generation."
 portugal_news.15.a: "Lisbon keeps its last colony"
 portugal_news.15.b: "The flag comes down again"
 POR_iberian_summits_trade: "The Iberian Summits"
 POR_gibraltar_with_madrid_trade: "Backed Madrid on Gibraltar"
 POR_forum_macao_trade: "Forum Macao"
 POR_deep_water_terminal_trade: "The Sines Terminal"
 POR_side_with_buenos_aires_trade: "Backed Buenos Aires on the Malvinas"
 POR_porto_seguro_trade: "The Treaty of Porto Seguro"
 POR_eu_mercosur_trade: "Champion of EU-Mercosur"
 POR_timor_sea_trade: "The Timor Sea Settlement"
 POR_exchange_rate_agreement_trade: "The Exchange Rate Agreement"
 POR_standing_treaty_trade: "Standing Treaty with Portugal"
 POR_backing_repaid_trade: "Portugal Backed Us in the War"
 POR_vendas_novas: "Vendas Novas"
 POR_vendas_novas_desc: "Our gunners have trained at Vendas Novas since the nineteenth century, firing guns that other countries designed. A design office beside the ranges brings the next generation of artillery within reach years early."
 POR_army_light_aviation: "Army Light Aviation"
 POR_army_light_aviation_desc: "The Army wants helicopters of its own instead of borrowing the Air Force's. A light aviation unit with its own airframes and engineers brings the next generation of transport and attack helicopters within reach years early."
 POR_cinamil: "CINAMIL"
 POR_cinamil_desc: "The Military Academy teaches our officers to use equipment that other armies designed. Giving it a research center of its own, CINAMIL, to work on unmanned ground vehicles brings the next generation of land drones within reach years early."
 POR_hydrographic_institute: "Hydrographic Institute"
 POR_hydrographic_institute_desc: "The Hydrographic Institute has charted our waters since 1960, and a submarine hides best in water only its own navy has mapped. Turning those surveys into a submarine program brings the next generation of boats and their engines within reach years early."
 POR_cinav: "CINAV"
 POR_cinav_desc: "The Naval School at Alfeite has engineers among its teachers and no money to put them to work. Giving it a research center, CINAV, to study ship-launched missiles brings the next generation of naval missiles within reach years early."
 POR_dom_joao_ii: "D. João II"
 POR_dom_joao_ii_desc: "The Navy wants a ship that carries drones instead of aircraft: a flight deck, a hangar and a dock for everything unmanned the fleet can buy. She would carry the name of D. João II, the king who sent Dias around the Cape, and designing her brings the next generation of aviation ships within reach years early."
 POR_ogma_alverca: "OGMA"
 POR_ogma_alverca_desc: "OGMA at Alverca has serviced our military aircraft since 1918 and builds parts for other people's. Paying it to design heavy airframes of its own brings the next generation of transport and patrol aircraft within reach years early."
 POR_ciafa: "CIAFA"
 POR_ciafa_desc: "The Air Force Academy at Sintra trains our pilots and engineers, and its research runs on whatever money is left over. Giving it a funded research center, CIAFA, to work on airborne radar brings the next generation of early warning aircraft within reach years early."
 POR_alcochete_range: "Alcochete Range"
 POR_alcochete_range_desc: "The Air Force tests its weapons on the range at Alcochete, and almost all of them are bought abroad. Developing and proving guided bombs and rockets of our own there brings the next generation of air-to-ground weapons within reach years early."
 POR_ideo_protest_tt: "§YProtest Strength§!: $RIGHT|-=0$"
 POR_ideo_no_campaign_tt: "No §Yelection campaign§! is under way"
 POR_ideo_greatest_choice_tt: "The country crowns §YSalazar§! for the nationalists, §YÁlvaro Cunhal§! for the communists and the unions, or §YAristides de Sousa Mendes§! for Stability and Political Power"
 POR_ideo_troika_choice_tt: "The government either §Ywithdraws the measure§! and pays in §YPolitical Power§!, or §Yholds the line§! and pays in §YStability§! and support"
 POR_beijing_axis_trade: "The Beijing Axis"
 POR_macau_arrangement_trade: "The Macau Arrangement"
 POR_critics_of_lusotropicalism_trade: "Faced the Colonial Past"
 POR_europe_with_us_trade: "Europe with Us"
 POR_casino_conferences: "Casino Conferences"
 POR_casino_conferences_desc: "In the spring of 1871 a group of young writers hired a hall in the Lisbon Casino to ask in public why the peninsula had fallen behind the rest of Europe. Antero de Quental blamed the Counter-Reformation, absolute monarchy and the conquests, and the government banned the series after its fifth lecture. Every Portuguese argument about decline since has been a rematch."
 POR_hidden_king: "The Hidden King"
 POR_hidden_king_desc: "King Sebastian led his army into Morocco in 1578 and never came back from Alcácer Quibir, and two years later Portugal had a Spanish king. The country answered with a legend: the young king would return on a foggy morning and restore everything that had been lost. A people that waits for a savior is easy to move, and someone is always willing to ride out of the fog."
 POR_seara_nova: "Seara Nova"
 POR_seara_nova_desc: "Raul Proença and Jaime Cortesão founded the review in 1921 on the conviction that the republic suffered from too little reason, not too much, and António Sérgio joined them two years later. It went on publishing through the whole dictatorship, censored and unrepentant. Our answer to the national myths is the one it gave: evidence, schools and cooperatives."
 POR_integralismo_lusitano: "Integralismo Lusitano"
 POR_integralismo_lusitano_desc: "In 1914 António Sardinha and a circle of young Coimbra monarchists launched Nação Portuguesa and a program of organic monarchy: the king, the Church, the guilds and the municipalities, and no parliament. The Estado Novo borrowed its corporatism and never gave back the crown. The royal cause has not had a better-read following since."
 POR_lusophone_humanism: "Lusophone Humanism"
 POR_lusophone_humanism_desc: "Agostinho da Silva went from Salazar's prisons into exile in Brazil, helped to found the University of Brasília and came home in 1969 preaching a community of the peoples who speak Portuguese, joined by culture rather than conquest. The CPLP was founded two years after his death. What he imagined as a brotherhood, we can also use as a network."
 POR_mensagem: "Mensagem"
 POR_mensagem_desc: "The only book of Portuguese verse Fernando Pessoa published in his lifetime appeared in December 1934, a cycle on the kings, the navigators and an empire still to come that ends: it is the hour. The regime's propaganda office gave it a prize in the second category. Every nationalist since has quoted it, usually without the irony."
 POR_labyrinth_of_saudade: "Labyrinth of Saudade"
 POR_labyrinth_of_saudade_desc: "In 1978 Eduardo Lourenço published what he called a mythic psychoanalysis of Portuguese destiny, and found a country that had lived for centuries on an image of itself it could not afford. The empire had been a consolation and the nostalgia a way of never deciding anything. A people that understands its myths is harder to sell them to."
 POR_lusotropicalism: "Lusotropicalism"
 POR_lusotropicalism_desc: "The Brazilian sociologist Gilberto Freyre argued that the Portuguese had a unique gift for living among the peoples of the tropics, mixing with them rather than ruling them. In 1951 the Estado Novo invited him on a tour of the colonies and adopted his theory as its answer to decolonization. It still flatters the metropole, and the former colonies still remember what it was for."
 POR_critics_of_lusotropicalism: "Critics of Lusotropicalism"
 POR_critics_of_lusotropicalism_desc: "In 1963 Charles Boxer took the theory apart with the empire's own records, and Amílcar Cabral took it apart in the field. Forced labor, the native statute and thirteen years of war were not a gift for mixing. Saying so in Lisbon costs us a myth and buys us a hearing in Luanda, Maputo and Bissau."
 POR_greatest_portuguese: "The Greatest Portuguese"
 POR_greatest_portuguese_desc: "The public broadcaster is running Os Grandes Portugueses, a contest to name the greatest Portuguese in history, and it expects an evening of kings, navigators and poets. The viewers have other ideas, and a television game is becoming a referendum on the twentieth century. The country has never agreed on who it was, and it is about to be asked."
 POR_crown_question: "The Crown Question"
 POR_crown_question_desc: "The Braganzas never stopped claiming the throne, and Dom Duarte Pio has spent a lifetime being polite about it. With the royalists in government and the republic exhausted, the question of who should be head of state can finally be put to the country."
 POR_monarchy_referendum: "The Monarchy Referendum"
 POR_monarchy_referendum_desc: "The constitution forbids a vote on the republican form of government, so the first act is to amend the article that forbids it. Then the country votes on whether the Braganzas return."
 POR_cortes_of_lamego: "The Cortes of Lamego"
 POR_cortes_of_lamego_desc: "Tradition holds that the first Cortes at Lamego acclaimed Afonso Henriques and fixed the rules of succession. Whether or not it ever met, a new assembly that swears in the King and binds him to a constitution gives the restoration eight centuries of legitimacy."
 POR_king_reigns: "The King Reigns"
 POR_king_reigns_desc: "The King opens parliament, signs what it passes and governs nothing. A crowned republic keeps every institution of April and adds a head of state that no party can capture."
 POR_monarchy_in_europe: "A Monarchy in Europe"
 POR_monarchy_in_europe_desc: "Spain, Belgium, the Netherlands and the Scandinavian crowns sit in the same Council as we do. A king among kings is one more voice in Brussels that the republics cannot ignore."
 POR_corporative_cortes: "The Corporative Cortes"
 POR_corporative_cortes_desc: "Integralismo Lusitano wanted a parliament of estates, not of parties: the municipalities, the professions, the Church and the trades each sending their own. The Cortes are rebuilt on that plan."
 POR_god_fatherland_king: "God, Fatherland, King"
 POR_god_fatherland_king_desc: "The old royalist motto goes back on the walls of every barracks and school. The monarchy is not a decoration on the republic but the thing the nation is organised around."
 POR_the_desired_returns: "The Desired One Returns"
 POR_the_desired_returns_desc: "Dom Sebastião vanished at Alcácer Quibir in 1578, and for four centuries Portugal waited for him to come back out of the fog. A crowned king is the closest the country has come, and the Sebastianists say so loudly."
 POR_empire_of_the_holy_spirit: "The Empire of the Holy Spirit"
 POR_empire_of_the_holy_spirit_desc: "Vieira promised a Fifth Empire and Agostinho da Silva promised an Empire of the Holy Spirit, crowned in the Azorean festivals every summer. The crown claims both prophecies."
 POR_lusophone_crown: "The Lusophone Crown"
 POR_lusophone_crown_desc: "Brazil was a kingdom equal to Portugal's once, and its Emperor was a Braganza. The King offers the Lusophone world what the republic never could: a crown above politics that every former province can recognise as its own."
 POR_emergency_powers: "Emergency Powers"
 POR_emergency_powers_desc: "The government asks parliament for emergency powers to deal with a crisis it describes in some detail and a deadline it does not mention at all. Parliament, frightened of the crisis, grants them."
 POR_constitution_suspended: "The Constitution Suspended"
 POR_constitution_suspended_desc: "The 1976 Constitution is not repealed, only suspended until the emergency ends, and the emergency is defined by the people who benefit from it. Elections are postponed indefinitely."
 POR_security_state: "The Security State"
 POR_security_state_desc: "The PSP and the GNR get new powers of arrest and the intelligence services a new mandate at home. The streets go quiet, and the people who used to fill them learn where the cameras are."
 POR_council_of_the_revolution: "The Council of the Revolution"
 POR_council_of_the_revolution_desc: "From 1975 to 1982 a council of officers could veto any law as unconstitutional. It returns, now as the guardian of the emergency, and the generals sit above the ministers."
 POR_captains_peace: "The Captains' Peace"
 POR_captains_peace_desc: "The captains of 1974 handed power to civilians within two years. Their successors see no reason to repeat the mistake, and the army becomes the one institution the emergency never touches."
 POR_clean_the_republic: "Clean the Republic"
 POR_clean_the_republic_desc: "The Court of Auditors gets police powers and a list. Mayors, bankers and party treasurers go to trial in public, and the crowd outside the courthouse cheers every verdict."
 POR_halve_the_assembly: "Halve the Assembly"
 POR_halve_the_assembly_desc: "Two hundred and thirty deputies become a hundred and fifteen, elected when the President decides an election is safe. A Fourth Republic replaces the Third, with the President as its only fixed point."
 POR_citizenship_as_a_service: "Citizenship as a Service"
 POR_citizenship_as_a_service_desc: "The state stops pretending to be a nation and starts behaving like a firm that sells residence. Golden visas become subscription tiers, and the customers who pay most get the best service."
 POR_shareholder_board: "The Shareholder Board"
 POR_shareholder_board_desc: "Sovereignty is a company and the taxpayers are its shareholders, voting in proportion to what they pay. The board appoints a chief executive, the universities and the state broadcaster lose their budgets, and nobody votes on anything else."
 POR_permanent_executive: "The Permanent Executive"
 POR_permanent_executive_desc: "The emergency is declared over and its powers are written into a new constitution. Whoever holds the executive now holds it until they choose to leave."
 POR_unfinished_revolution: "The Unfinished Revolution"
 POR_unfinished_revolution_desc: "The revolution of 1974 stopped on the 25th of November 1975, halfway through. The left in government means to finish it: the land, the factories and the alliances that the moderates handed back."
 POR_agrarian_reform: "The Agrarian Reform"
 POR_agrarian_reform_desc: "In 1975 the Alentejo's farmworkers occupied the great estates and ran them as cooperatives, until the next government gave the land back. This time the estates are expropriated by law and the cooperatives keep them."
 POR_leave_nato: "Close Lajes, Leave NATO"
 POR_leave_nato_desc: "Portugal was a founding member of NATO under a dictatorship, and the Americans flew to Israel in 1973 through the Azores. The base closes, the alliance goes, and the country chooses its own wars."
 POR_workers_commissions: "The Workers' Commissions"
 POR_workers_commissions_desc: "Every firm above fifty workers elects a commission with a seat on its board and a veto on its closure. The factories are run by the people who work in them, as the Constitution of 1976 promised."
 POR_popular_militias: "The Popular Militias"
 POR_popular_militias_desc: "The revolution will not trust its defence to the officers who stopped it last time. Every commission trains a militia, and the militias drill on weekends in the factory yards."
 POR_rewild_the_interior: "Rewild the Interior"
 POR_rewild_the_interior_desc: "The interior emptied because the cities paid better. The Parish Republic pays people to return to the villages, restores the cork oak and the native forest, and runs each parish as a small self-governing commune."
 POR_four_day_week: "The Four-Day Week"
 POR_four_day_week_desc: "Work less, consume less, live longer. The four-day week costs output and buys back time, and the parishes fill the fifth day with their own assemblies."
 POR_housing_outside_the_market: "Housing Outside the Market"
 POR_housing_outside_the_market_desc: "Carnation socialism keeps the elections and takes the homes off the market. Empty flats are requisitioned, rents are fixed, and a public builder puts up the housing Lisbon has lacked for thirty years."
 POR_socialist_europe: "A Socialist Europe"
 POR_socialist_europe_desc: "We stay in the Union and argue for a different one: a common minimum wage, a common tax on wealth and an end to the budget rules that broke us in 2011."
 POR_comrades_not_clients: "Comrades, Not Clients"
 POR_comrades_not_clients_desc: "The networks Lisbon built to buy governments in Luanda and Maputo can serve the movements those governments repress. Portugal stops collecting clients and starts building a bloc of equals, the one Amílcar Cabral imagined."
 POR_open_republic: "The Open Republic"
 POR_open_republic_desc: "The Third Republic was built to join Europe, and it did. The parties of the centre decide that its unfinished business is not at home at all but in Brussels."
 POR_federalist_lisbon: "A Federalist Lisbon"
 POR_federalist_lisbon_desc: "Lisbon proposes what the larger capitals will not: a federal budget, a federal army and a Commission elected by the Parliament. A small country loses nothing by asking for more Europe."
 POR_lisbon_agenda: "The Lisbon Agenda"
 POR_lisbon_agenda_desc: "The Union promised in 2000 to become the most competitive economy in the world by 2010, and missed. Lisbon revives the agenda that carries its name, with money attached this time."
 POR_westernmost_capital: "The Westernmost Capital"
 POR_westernmost_capital_desc: "Lisbon offers itself as the seat of the institutions that the federation will need: an Atlantic agency here, a court there. The westernmost capital of the continent becomes one of its centres."
 POR_atlantic_schengen: "An Atlantic Schengen"
 POR_atlantic_schengen_desc: "Free movement stops at the Union's edge, and Portugal's ties do not. A common visa for the Lusophone world, administered from Lisbon, brings Brazilians, Angolans and Cape Verdeans in on European terms."
 POR_digital_residency: "Digital Residency"
 POR_digital_residency_desc: "Estonia sells a digital residency to anyone who wants a European company. Portugal sells one with a beach attached, and the founders who buy it move here in person."
 POR_free_port_republic: "The Free Port Republic"
 POR_free_port_republic_desc: "Low taxes for capital, fast permits and English in the courts: the Atlantic Hub competes with Dublin and Amsterdam for every headquarters that wants to be in the Union and outside its heaviest rules."
 POR_second_treaty_of_lisbon: "A Second Treaty of Lisbon"
 POR_second_treaty_of_lisbon_desc: "The first Treaty of Lisbon salvaged the constitution that France and the Netherlands rejected. The second one, drafted in the same monastery, finishes the job."
 POR_crown_family_tt: "The §YMonarchists§!, the §YCDS-PP§! or §YNova Ordem Social§! govern"
 POR_executive_family_tt: "The §YPDR§!, the §YPNR§! or the §YArmy§! govern"
 POR_left_family_tt: "The §YCDU§!, §YPOUS§!, §YPCTP§! or §YBloco de Esquerda§! govern"
 POR_open_family_tt: "The §YPSD§!, the §YPS§!, §YNós, Cidadãos!§! or the §YMPT§! govern"
 POR_monarchy_vote_tt: "The monarchy wins the referendum if the §YMonarchists§! hold more than §Y20%§! support or §YStability§! is above §Y60%§!.\nIf it wins: Portugal becomes the §YKingdom of Portugal§!, the §YMonarchists§! gain §G10%§! support and §YStability§! rises by §G5%§!.\nOtherwise the republic survives, the §YMonarchists§! lose §R5%§! support, §YStability§! falls by §R5%§! and the referendum can be called again"
 POR_monarchy_vote_crown_only_tt: "The §YMonarchists§! already govern, so the vote does not change the government. It only decides whether the crown returns"
 POR_monarchy_vote_takeover_tt: "If the monarchy wins, the §YMonarchists§! also take over the government"
 POR_article_seven_tt: "Brussels opens an §RArticle 7§! procedure: §YEuropean exposure§! rises by §R25§!"
 POR_lajes_closed_tt: "The §YLajes§! air base closes to the United States"
 POR_lusophone_crown_tt: "We become the §YFifth Portuguese Empire§!"
 POR_comrades_not_clients_tt: "Every Portuguese-speaking country that is our subject or has a §YCommunist§! government gains §G5%§! of our influence and joins the §YCarnation Bloc§! if it is in no faction"
 POR_carnation_bloc: "The Carnation Bloc"
 portugal.123.t: "The Kingdom Restored"
 portugal.123.d: "The count is in, and the republic of 1910 has lost. Dom Duarte Pio will be acclaimed King before the Cortes, the royal standard returns over the Assembly, and the presidential palace at Belém becomes a museum."
 portugal.123.a: "Long live the King"
 portugal.124.t: "The Republic Survives"
 portugal.124.d: "The country has voted to keep the republic, by a margin the royalists call a fraud and everyone else calls decisive. The monarchy question is shelved, though not for good."
 portugal.124.a: "We will ask again"
 POR_desperate_generation: "Desperate Generation"
 POR_desperate_generation_desc: "Unpaid internships, freelance receipts and contracts that never become permanent: a generation has been told to wait its turn, and it has stopped waiting. The Geração à Rasca needs no party to fill the streets of Lisbon and Porto, only a few friends and a date. Whoever governs next inherits a generation that no longer believes any party speaks for it."
 POR_to_hell_with_the_troika: "To Hell with the Troika"
 POR_to_hell_with_the_troika_desc: "Que se lixe a troika, queremos as nossas vidas: to hell with the Troika, we want our lives. Whoever wrote the austerity program, the foreign lenders or our own ministers, the marches now fill every city in the country at once and end in front of the Assembly singing Grândola. The cabinet has to decide whether the measure that set them off is worth keeping."
 POR_obviously_i_dismiss_him: "Obviously, I Will Dismiss Him"
 POR_obviously_i_dismiss_him_desc: "Asked in May 1958 what he would do with Salazar if he won the presidency, General Humberto Delgado said: obviously, I will dismiss him. He lost an election the regime counted itself, and the political police murdered him seven years later. The democratic constitution gives the president a power of the same kind: to dissolve the Assembly and send the country back to the polls."
 POR_end_of_the_rotation: "End of the Rotation"
 POR_end_of_the_rotation_desc: "Since the revolution the Socialists and the Social Democrats have taken turns in office, as the Regenerators and the Progressives did under the monarchy. New parties are winning their first seats, and the turns are no longer automatic. A parliament that cannot produce a majority is one where every argument is open again."
 POR_a_new_right: "A New Right"
 POR_a_new_right_desc: "Chega means enough. A new party of the populist right, led by a defector from the Social Democrats, takes its voters from every party at once. Whoever governs now has to answer a right that has no intention of being anyone's junior partner."
 POR_liberal_initiative: "Liberal Initiative"
 POR_liberal_initiative_desc: "Iniciativa Liberal starts from the proposition that the problem is the state itself: its taxes, its monopolies and its patience. Its voters are young, urban and concentrated in Lisbon and Porto. For the first time in the democratic period, classical liberalism is a platform rather than an insult."
 POR_grandola_vila_morena: "Grândola, Vila Morena"
 POR_grandola_vila_morena_desc: "At twenty past midnight on 25 April 1974, Rádio Renascença played Zeca Afonso's song about a town of brotherhood in the Alentejo, and the columns of the Armed Forces Movement began to move. By evening the regime had surrendered. Every party has sung it since, and every one of them means something different by it."
 POR_captains_of_april: "Captains of April"
 POR_captains_of_april_desc: "The revolution was made by captains tired of a war on three fronts. Otelo Saraiva de Carvalho ran the operation from the command post at Pontinha, and Salgueiro Maia brought the armored cars from Santarém to the Carmo barracks, where the prime minister surrendered. Maia then refused every office he was offered and stayed a soldier."
 POR_first_of_may: "First of May"
 POR_first_of_may_desc: "A week after the coup, half a million people filled the streets of Lisbon, and Mário Soares and Álvaro Cunhal, back from exile days before, spoke from the same platform. Within a year they were the two sides of the revolution's quarrel. Whoever calls the unions out now claims the same crowd."
 POR_constituent_assembly: "Constituent Assembly"
 POR_constituent_assembly_desc: "On 25 April 1975, a year to the day after the coup, 91.7 percent of the electorate voted for an assembly to write a constitution. The Socialists came first, the Popular Democrats second and the Communists a distant third. It was the first free election most Portuguese had ever seen, and a result the revolution could never afterwards ignore."
 POR_hot_summer: "Hot Summer"
 POR_hot_summer_desc: "In the summer of 1975 the revolution went further than the vote had: the banks already nationalized, estates in the Alentejo occupied by the laborers who worked them, the Socialists out of the government and the country talking openly of civil war. The Hot Summer is the left's unfinished business, and it can still be finished."
 POR_twenty_fifth_of_november: "Twenty-Fifth of November"
 POR_twenty_fifth_of_november_desc: "On 25 November 1975 paratroopers loyal to the revolutionary left seized the air bases, and the moderate officers of the Group of Nine were ready for them. Ramalho Eanes directed the response and Jaime Neves's commandos ended it within two days. The revolutionary period closed without a civil war, and ours can close the same way."
 POR_constitution_of_1976: "Constitution of 1976"
 POR_constitution_of_1976_desc: "Approved on 2 April 1976 and in force from the second anniversary of the revolution, it promised a transition to socialism and guaranteed the free elections that would decide whether to have one. Only the CDS voted against. It has been revised again and again since, and every Portuguese government still swears to it."
 POR_until_tomorrow_comrades: "Until Tomorrow, Comrades"
 POR_until_tomorrow_comrades_desc: "Álvaro Cunhal led the Communist Party for thirty-one years, escaped from the fortress of Peniche in 1960 and wrote a novel in prison that he published decades later under another name: Until Tomorrow, Comrades. The party he built still has the most disciplined membership in the country and the most loyal vote in the Alentejo. It asks for little and never forgets what it is owed."
 POR_socialism_in_freedom: "Socialism in Freedom"
 POR_socialism_in_freedom_desc: "Mário Soares founded the Socialist Party in exile in 1973, filled the Alameda against the communist-leaning government in the summer of 1975 and campaigned the next spring for socialism in freedom and a Europe with us. He was prime minister three times and president twice. The Socialists became the party of the regime, and the regime became theirs."
 POR_one_majority: "A Majority, a Government, a President"
 POR_one_majority_desc: "Francisco Sá Carneiro sat with the liberal wing of Caetano's assembly, founded the Popular Democrats in May 1974 and built the Democratic Alliance that won the first absolute majority of the democracy. Then he asked for everything at once: a majority, a government and a president. He died in the air crash at Camarate on 4 December 1980, three days before the presidential election, and the Social Democrats have wanted all three ever since."
 POR_the_vote_against: "Vote Against"
 POR_the_vote_against_desc: "Diogo Freitas do Amaral founded the Democratic and Social Center in July 1974 as the Christian democratic party of a country that had just thrown out a Catholic dictatorship, and on 2 April 1976 its deputies were the only ones to vote against the constitution. Ten years later he came within three points of the presidency. The right that refused to apologize for existing began with that vote."
 POR_the_contraption: "The Contraption"
 POR_the_contraption_desc: "Since 1976 the Socialists have governed alone or with the right, never with the parties to their left. A written agreement with the Left Bloc, the Communists and the Greens, backing a Socialist government from outside rather than joining it, would end the oldest taboo of the democracy. Its enemies already have a name for it: geringonça, the contraption."
 POR_democratic_alliance: "Democratic Alliance"
 POR_democratic_alliance_desc: "In July 1979 Sá Carneiro's Social Democrats, Freitas do Amaral's Christian democrats and the Popular Monarchists signed an alliance to end the left's majority, and that December they won the first absolute majority of the democratic period. When the right unites, it governs."
 POR_april_always: "April, Always"
 POR_april_always_desc: "25 de Abril, sempre! Every year on the anniversary the Avenida da Liberdade fills with carnations, whoever is in government. The revolution belongs to nobody in particular, which is the only way it could have survived, and we intend to keep it that way."
 POR_europe_with_us: "Europe with Us"
 POR_europe_with_us_desc: "A Europa connosco: the Socialists' slogan of 1976, followed within a year by a formal application to join the European Community. Accession was signed at the Jerónimos Monastery in 1985, a few steps from the tomb of Vasco da Gama, and Europe has been the one argument every Portuguese government agrees it won. We make the case again, this time from inside."
 POR_europe_with_us_trade_tt: "Every §YEuropean Union§! member: trade relations with us §G+30§!"
 POR_stand_proudly_alone: "Proudly Alone"
 POR_stand_proudly_alone_desc: "In February 1965, with the colonial war in its fifth year and the allies unwilling to back it, Salazar told the regime's party that Portugal fought without spectacle and without alliances: proudly alone. The phrase became the epitaph of his foreign policy. There are Portuguese who never stopped reading it as a program."
 POR_tenth_of_june: "Tenth of June"
 POR_tenth_of_june_desc: "The anniversary of Camões's death became the Estado Novo's Day of the Race, and from 1963 a parade of the forces fighting in Africa. In 1978 the democracy renamed it the Day of Portugal, of Camões and of the Portuguese Communities, and gave it to the millions of Portuguese who live abroad. A country with a third of its people beyond its borders has a reach no border can hold."
 portugal.120.t: "The Greatest Portuguese"
 portugal.120.d: "The public broadcaster's contest to name the greatest Portuguese in history has reached its final vote, and it has stopped being a television program. The three names still standing are the dictator, the communist who spent eleven years in his prisons, and the consul who defied him to save thousands of refugees at Bordeaux.\n\nWhichever name wins, the country will spend a month arguing about what it means."
 portugal.120.a: "Salazar, who balanced the books"
 portugal.120.b: "Cunhal, who never gave in"
 portugal.120.c: "Sousa Mendes, who disobeyed"
 portugal.121.t: "A Million in the Streets"
 portugal.121.d: "The marches filled the squares of every city in the country at once, and the organizers are counting in hundreds of thousands. The cabinet can withdraw the measure that set them off and be seen to back down, or keep it and be seen not to listen.\n\nThe Council of State has asked to hear which."
 portugal.121.a: "Withdraw the measure"
 portugal.121.b: "Hold the line"
 POR_retail_cbdc: "Retail CBDC"
 POR_retail_cbdc_desc: "Every citizen gets an account at the central bank itself, free, safe and outside any commercial bank. Inside the euro it is the ECB's digital euro and the Banco de Portugal hands it out; with a currency of our own it is a digital escudo and we issue it. Either way the card schemes lose their cut of every coffee, and the banks lose deposits they were never paying interest on."
 POR_sovereign_wealth_fund: "Sovereign Wealth Fund"
 POR_sovereign_wealth_fund_desc: "Norway saves its oil. We have no oil, so we save our taxes: a share of every year's revenue goes into a fund invested abroad, and the first government to raid it will have to explain why to the Public Finance Council."
 POR_public_works_research: "Public Works"
 POR_building_level_locked_tt: "Every level our technology allows is already built here, so instead:"
 POR_almaraz_network_tt: "We infiltrate the §YSpanish§! government, which opens the §YFalse Flag§! operation against it"
 POR_the_olivenza_incident: "Olivenza Incident"
 POR_the_olivenza_incident_desc: "A barracks burns near Elvas, the evidence points across the Guadiana, and every Portuguese paper prints it. Nobody in government knew beforehand and nobody will explain afterward. Aljubarrota takes four provinces on a grievance we already had. This takes the whole of Spain on a grievance we made, and only one of the two can be used."
 POR_spanish_pretext_tt: "A §YFalse Flag§! operation against §YSpain§! has succeeded in the last §Y180 days§!"
 POR_ideology_allows_war_on_spain_tt: "Our government may declare war on §YSpain§!: democratic and communist governments cannot fight a government of their own ideology"
 POR_ideology_allows_war_tt: "Our government may declare war on this government: democratic and communist governments cannot fight a government of their own ideology"
 POR_gates_of_iberia: "Gates of Iberia"
 POR_gates_of_iberia_desc: "The union covers the peninsula, and three of its doors are still held by someone else. The Rock guards the western end of the Strait, Tangier faces it from Africa, and Andorra keeps a pass in the Pyrenees. Each is a separate negotiation with a separate government, and no single argument will settle all three."
 POR_gibraltar_two_flags: "Gibraltar Under Two Flags"
 POR_gibraltar_two_flags_desc: "Britain took the Rock in 1704 and kept it under the Treaty of Utrecht. It has never needed the sovereignty as much as it has needed the harbor. We ask London for the first and promise it the second: the Royal Navy keeps its berths and its dockyard on the Rock and gets military access to our land. A Britain that has kept faith with the oldest alliance is likely to agree, and a Britain we have snubbed is not."
 POR_gibraltar_base_tt: "The United Kingdom keeps a §Ynaval base§! at Gibraltar and gains §Gnaval range and experience§! from it. We give it §Ymilitary access§! to our land"
 POR_tangier_zone: "Tangier Zone"
 POR_tangier_zone_desc: "Tangier was Portuguese from 1471 until Catherine of Braganza took it to England as her dowry in 1661. Today it is Morocco's gateway to the Strait and its busiest port. We ask Rabat to cede the region, knowing the answer. A refusal puts our claim on the record and gives us a war goal, and a week of holding the region lets us end the war with the region in our hands."
 POR_ideology_allows_war_on_morocco_tt: "Our government may declare war on §YMorocco§!: democratic and communist governments cannot fight a government of their own ideology"
 POR_tangier_peace_tt: "If we hold §YTanger-Tetouan-Al Hoceima§! for §Ya week§!, we are offered a peace that leaves the region with us"
 POR_morocco_hardens_tt: "Morocco gains §Rcore defense§! for as long as the war lasts"
 POR_andorran_accession: "Andorran Accession"
 POR_andorran_accession_desc: "Andorra has no army and depends on its two neighbors for its defense, its post and most of its trade. A union that already covers Spain can offer Andorrans every right of the peninsula, in Catalan, and Andorra la Vella has good reasons to say yes. We put the offer to the Consell General."
 POR_andorra_request_refused_tt: "The focus is §Runcompleted§!, and we can ask Andorra la Vella again"
 POR_treaty_of_rio: "Treaty of Rio"
 POR_treaty_of_rio_desc: "In 1825 Lisbon recognized Brazil's independence and took two million pounds for it, a sum Brazil had to borrow in London. We stop treating that treaty as a settlement. It becomes a debt that was never fully paid and a question that was never closed."
 POR_braganza_restoration: "Braganza Restoration"
 POR_braganza_restoration_desc: "The House of Braganza ruled from Rio de Janeiro until 1889, and the monarchists in our government have never accepted that the crown cannot cross the ocean again. They ask for one crown over both shores, with Brasilia answering to it. We take the war goal and put the throne behind it."
 POR_terra_de_vera_cruz: "Terra de Vera Cruz"
 POR_terra_de_vera_cruz_desc: "Cabral named the land Vera Cruz when he landed near Porto Seguro in 1500, and Bahia and Pernambuco are where the settlement began. The nationalists in our government treat both as Portuguese soil under a foreign flag. We claim them and take the war goal that goes with the claim."
 POR_uk_gibraltar_base: "British Base at Gibraltar"
 POR_uk_gibraltar_base_desc: "Portugal owns the Rock, and the Royal Navy keeps its berths, its dockyard and its access to it. British ships still shelter at the mouth of the Mediterranean, and the arrangement lasts as long as the two countries stay at peace and Portugal holds Gibraltar."
 POR_moroccan_home_defence: "Defense of the Homeland"
 POR_moroccan_home_defence_desc: "Portuguese troops hold Moroccan territory and Lisbon has refused a ceasefire, so every reservist reports and every fortified position on the northern coast is manned. The bonus lasts as long as the war does."
 portugal.104.t: "Lisbon Asks for the Rock"
 portugal.104.d: "The Portuguese Prime Minister has asked in writing for sovereignty over Gibraltar. The letter is polite and comes with an offer: the Royal Navy keeps its berths, its dockyard and its access to the Rock, and London keeps a friend at the mouth of the Mediterranean instead of a garrison. The ministers who defend the Rock on principle are outnumbered by those who defend it out of habit."
 portugal.104.a: "Cede the Rock and keep the base"
 portugal.104.b: "Gibraltar is not for sale"
 portugal.105.t: "London Keeps the Rock"
 portugal.105.d: "The Foreign Office has declined with courtesy and without a reason. Gibraltar has been British for three centuries, and a change of flag was always going to take more than one letter."
 portugal.105.a: "We will ask again"
 portugal.106.t: "Lisbon Asks for Tangier"
 portugal.106.d: "The Portuguese ambassador has called on the Foreign Ministry with a request that the Tanger-Tetouan-Al Hoceima region pass to Portugal. He mentioned 1471 and did not mention money. Rabat does not expect to discuss it seriously, but the request is on the record and Lisbon has an army to back it."
 portugal.106.a: "Cede the region"
 portugal.106.b: "Morocco is not for division"
 portugal.107.t: "Rabat Says No"
 portugal.107.d: "The Moroccan government has refused to discuss the region and recalled its ambassador. The refusal gives us what we wanted: the claim to Tanger-Tetouan-Al Hoceima is on the record, and a war over it has a stated cause."
 portugal.107.a: "The claim stands"
 portugal.108.t: "Tanger-Tetouan-Al Hoceima Is Ours"
 portugal.108.d: "Our troops have held the region for a week, and the Moroccan army has not retaken it. Foreign ministries are already offering to mediate. A peace now leaves the region with Portugal for good and ends the war. Fighting on means a longer war against a Morocco that is defending its own soil."
 portugal.108.a: "Take the region and end the war"
 portugal.108.b: "Refuse peace and fight on"
 portugal.109.t: "Portugal Refuses to Stop"
 portugal.109.d: "Portuguese troops hold Tanger-Tetouan-Al Hoceima and Lisbon has turned down a peace that would leave it there. The general staff has told every unit that the war is now about the homeland: reservists are reporting and every fortified position on the northern coast is being manned."
 portugal.109.a: "Defend every metre"
 portugal.110.t: "Lisbon Asks for Andorra"
 portugal.110.d: "The Portuguese government has proposed that Andorra join the Iberian state, with its parliament and its language protected. The co-princes in Urgell and Paris have not been consulted. The Consell General is split between those who want a passport that opens more doors and those who think Andorra's value is that it is small."
 portugal.110.a: "Join the union"
 portugal.110.b: "Andorra stays independent"
 portugal.111.t: "Andorra Says No"
 portugal.111.d: "The Consell General has declined with thanks. Andorra has been a co-principality since 1278 and sees no reason to change that now."
 portugal.111.a: "We will ask again"
 portugal_news.16.t: "Gibraltar Becomes Portuguese"
 portugal_news.16.d: "Britain has ceded Gibraltar to Portugal after three centuries. The Royal Navy stays: Lisbon has agreed that it keeps its berths and dockyard on the Rock, and British ships will keep sailing from the harbor they have always used."
 portugal_news.16.a: "The Rock changes hands"
 portugal_news.17.t: "War Over Tangier Region Ends"
 portugal_news.17.d: "The war between Portugal and Morocco has ended with Tanger-Tetouan-Al Hoceima in Portuguese hands. Portuguese troops held the region for a week, and Lisbon then made peace on the condition that the region stays. Rabat has not recognized the settlement."
 portugal_news.17.a: "A new border on the Strait"
 portugal_news.18.t: "Andorra Joins the Iberian Union"
 portugal_news.18.d: "The Consell General has voted to join the Iberian Union, ending seven centuries as a co-principality. The Bishop of Urgell and the French President remain co-princes only on paper."
 portugal_news.18.a: "A mountain state joins"
 portugal_news.19.t: "Morocco Cedes Tangier Region"
 portugal_news.19.d: "Morocco has ceded Tanger-Tetouan-Al Hoceima to Portugal in return for a declaration of friendship. Opposition parties in Rabat have called it the sale of the Strait."
 portugal_news.19.a: "The Strait changes hands"
 portugal.125.t: "A Treaty for the Canal"
 portugal.125.d: "The Portuguese ambassador has brought a draft treaty: Portuguese marines on the locks, Portuguese ships at Colón and a share of the tolls paid to us. In return we would leave our foreign policy to Lisbon."
 portugal.125.a: "Sign the treaty"
 portugal.125.b: "Panama guards its own canal"
 portugal.126.t: "Panama Refuses"
 portugal.126.d: "Panama has turned down the treaty, and Washington has made it clear it was consulted. The canal will not be shared by agreement."
 portugal.126.a: "Then it will be taken"
 portugal.126.b: "Leave the canal to them"
 portugal.127.t: "The Tricolour Comes Down in Cayenne"
 portugal.127.d: "Our troops crossed the Oyapock and held the line until Paris agreed to stop the fighting. French Guiana is ours, as it was in 1809, and the launch site at Kourou with it."
 portugal.127.a: "Cayenne is Portuguese again"
 portugal.128.t: "Repulsed on the Oyapock"
 portugal.128.d: "The Foreign Legion held the river crossings and our columns fell back into Amapá. French Guiana stays French."
 portugal.128.a: "Withdraw"
 portugal.129.t: "Beijing Retaliates"
 portugal.129.d: "Chinese customs are holding Portuguese cargo at every port, Chinese buyers have cancelled their orders and Beijing has named the officials who fled through Macau as criminals we are hiding. The Foreign Ministry asks whether the window is worth it."
 portugal.129.a: "The window stays open"
 portugal.129.b: "Hand some of them back"
 portugal.130.t: "The Sardinian Question"
 portugal.130.d: "Lisbon has asked, in public, why Sardinia should not decide its own future. The island's nationalists are suddenly well funded, and their rallies now carry the old Aragonese flag beside the four Moors."
 portugal.130.a: "Let Sardinia decide"
 portugal.130.b: "Sardinia is Italian"
 portugal.131.t: "Rome Refuses"
 portugal.131.d: "Italy has rejected any vote on Sardinia and called our ambassador in to protest. Our claim on the island stands."
 portugal.131.a: "Sardinia will be free"
 portugal.132.t: "A Protector for Sardinia"
 portugal.132.d: "Lisbon offers to guarantee our independence against Rome, in return for its fleet at Cagliari and La Maddalena and our foreign policy in its hands."
 portugal.132.a: "Accept Portuguese protection"
 portugal.132.b: "Sardinia stays its own master"
 portugal.133.t: "Perpignan Falls"
 portugal.133.d: "Our columns came down from the Pyrenees passes and Paris agreed to stop the fighting before it became a war. The Roussillon is back under the crown that lost it in 1659."
 portugal.133.a: "The Roussillon returns south"
 portugal.134.t: "Repulsed in the Pyrenees"
 portugal.134.d: "French troops held the passes and our columns fell back to Catalonia. The Roussillon stays French."
 portugal.134.a: "Withdraw"
 portugal.139.t: "Sardinia Refuses Our Protection"
 portugal.139.d: "Cagliari has thanked us for our help with its independence and declined to become our protectorate."
 portugal.139.a: "Sardinia needs a protector whether it wants one or not"
 portugal.139.b: "Let them be"

 portugal.290.t: "The Spoils of [From.GetName]"
 portugal.290.d: "[From.GetName] is ours and its army is gone. Its crown, its palaces and its land are in Portuguese hands, and the old dynasties are watching what Lisbon will do with them.\n\nWe can keep what we took and bear the cost of ruling an unwilling people. We can give the land back to a government that answers to us. Or we can hand it to its rightful crown, free and loyal, and call Europe's kings to a league of equals under the sun of Lisbon."
 portugal.290.a: "We keep the land"
 portugal.290.b: "A throne under our protection"
 portugal.290.c: "A free crown, and a League of Crowns"
 portugal.291.t: "[From.GetName] Kneels"
 portugal.291.d: "[From.GetName] has bent the knee and sits in our shadow. Its ministers wait to hear what we want from them.\n\nWe can keep them as they are, a useful client at the edge of our influence. Or we can set them free under their own crown and bring them into a League of Crowns, where a king is a partner and not a prize."
 portugal.291.a: "They stay in our shadow"
 portugal.291.b: "A free crown, and a League of Crowns"
 POR_macau_window_category: "The Macau Window"
 POR_macau_window_category_desc: "Macau is the one door out of China that Beijing does not fully control. Every official, engineer and fortune we let through it weakens China and angers it. Every third grievance brings a Chinese retaliation, and three are enough to open §YA Second Opium War§!."
 POR_visas_for_officials: "Visas for Party Officials"
 POR_visas_for_officials_desc: "Officials who fear the next anti-corruption purge pay well for a Portuguese visa and bank their savings in Macau."
 POR_passports_for_engineers: "Passports for Engineers"
 POR_passports_for_engineers_desc: "Chinese chip designers and software engineers are offered Portuguese passports, posts in our universities and no questions about what they bring with them."
 POR_the_tax_window: "The Tax Window"
 POR_the_tax_window_desc: "Chinese fortunes leaving the mainland are parked in Macau's banks at a rate no other jurisdiction offers."
 POR_sanctuary_broadcasts: "Sanctuary Broadcasts"
 POR_sanctuary_broadcasts_desc: "Radio Macau broadcasts the stories of those who came through the window, in Cantonese and Mandarin, to anyone in China who can find the frequency."
 POR_naval_support_category: "Naval Support"
 POR_naval_support_category_desc: "Portugal cannot build a fleet fast enough. We can buy hulls the Dutch no longer need, train with the alliance and ask our allies to cover the sea while we land."
 POR_buy_secondhand_frigate: "Buy a Second-Hand Frigate"
 POR_buy_secondhand_frigate_desc: "The Dutch navy sells its older Karel Doorman frigates cheaply. A hull bought abroad is faster than one built at Alfeite."
 POR_nato_naval_exercise: "Join an Alliance Naval Exercise"
 POR_nato_naval_exercise_desc: "Portuguese ships join the allied squadrons for two months of exercises at sea. Our crews learn faster alongside navies that have more ships than we do."
 POR_request_allied_naval_cover: "Request Allied Naval Cover"
 POR_request_allied_naval_cover_desc: "We cannot win the sea alone. Allied warships and aircraft escort our landings and keep the enemy fleet busy while the marines go ashore."
 POR_allied_naval_cover: "Allied Naval Cover"
 POR_allied_naval_cover_desc: "Allied ships and aircraft are covering our fleet and our landings."
 POR_china_provocation_tt: "§YChina's§! grievances over the Macau Window grow by §R1§! from §Y[?POR_china_provocations|0]§!. China §Rretaliates§! at every third grievance, and §YA Second Opium War§! needs three."
 POR_china_retaliates_tt: "This is a third grievance: §YChina§! will §Rretaliate§!."
 POR_china_grievances_cleared_tt: "§YChina's§! grievances over the Macau Window are §Gcleared§!."

 POR_league_buff_tt: "§Y[From.GetName]§! becomes an independent monarchy and joins the §YLeague of Crowns§!. We gain §YLeague Industrial Pact§! for §Y3 years§!, and the §YLeague of Crowns§! gives bonuses to stability, political power gain, war support and trade opinion that grow with each member."
 POR_panama_associated_tt: "§YPanama§! becomes our §Yassociated state§!."
 POR_panama_refuses_tt: "We may take a §Rwar goal§! against §YPanama§!."
 POR_cayenne_border_war_tt: "A §Yborder war§! starts between §YAmapá§! and §YFrench Guiana§!. A border war is not a declared war, so it does not call in §YFrance's§! allies.\nIf we win, §YFrench Guiana§! becomes §GPortuguese§!."
 POR_roussillon_border_war_tt: "A §Yborder war§! starts between §YCatalonia§! and §YLanguedoc-Roussillon§!. A border war is not a declared war, so it does not call in §YFrance's§! allies.\nIf we win, §YLanguedoc-Roussillon§! becomes §GPortuguese§!."
 POR_sardinia_freed_tt: "§YItaly§! releases §YSardinia§! as an independent state."
 POR_sardinia_refused_tt: "We gain a claim on §YSardinia§!, and §YThe Sardinian Protectorate§! can take a §Rwar goal§! against §YItaly§!."
 POR_sardinia_associated_tt: "§YSardinia§! becomes our §Yassociated state§!. If it refuses, we may take a §Rwar goal§! against it."
 POR_italy_nato_tt: "§RItaly is in NATO and we are not.§! A declared war on Italy calls in every member of the alliance."
 POR_pearl_river_china_tt: "§YHong Kong§! is a §YChinese§! special administrative region. §YChina§! will defend it."
 POR_brazil_cores_tt: "Every state we own that is a core of §YBrazil§! becomes our §Gcore§!."
 POR_platine_cores_tt: "Every state we own in §YUruguay§!, §YParaguay§!, §YFrench Guiana§! and §YPando-Beni§! becomes our §Gcore§!."
 POR_aragon_cores_tt: "Every state we own in §YSardinia§!, §YSicily§!, §YNaples§!, §YLanguedoc-Roussillon§! and §YMalta§! becomes our §Gcore§!."
 POR_treaty_ports_tt: "Every treaty port we own among §YGuangdong§!, §YFujian§!, §YZhejiang§! and §YShanghai§! gains §G20§! compliance."
 POR_monarchy_restored_tt: "The monarchy has been restored"
 POR_brazil_held_tt: "§YBrazil§! is our subject, or we own §YRio de Janeiro§! and §YSão Paulo§!"
 POR_canal_held_tt: "§YPanama§! is our subject, or we own the §YPanama Canal§!"
 POR_two_southern_states_tt: "We own at least two of §YUruguay's§! and §YParaguay's§! states, §YPando-Beni§! and §YFrench Guiana§!"
 POR_macau_held_tt: "We own §YMacau§!"
 POR_not_democratic_tt: "We do not have a §YDemocratic§! government"
 POR_timor_held_tt: "§YEast Timor§! is our subject, or we own it"
 POR_china_provoked_tt: "§YChina§! has at least §Y3§! grievances over the Macau Window"
 POR_treaty_port_held_tt: "We own §YGuangdong§!, §YFujian§!, §YZhejiang§! or §YShanghai§!"
 POR_sardinia_open_tt: "§YSardinia§! is independent, or §YItaly§! refused to free it and still holds it"
 POR_two_aragon_holdings_tt: "We hold at least two of §YSardinia§!, §YSicily§!, §YNaples§!, §YLanguedoc-Roussillon§! and §YMalta§!, as states or subjects"
 POR_chinese_retaliation: "Chinese Retaliation"
 POR_chinese_retaliation_desc: "China is holding our cargo in its ports and steering its buyers away from Portuguese goods in answer to the Macau Window."

 POR_league_industrial_pact: "League Industrial Pact"
 POR_league_industrial_pact_desc: "The crowns of the League open their workshops and their capital to Portuguese industry, and Lisbon repays them in orders."
 POR_crowns_overreach: "Crowns Overreach"
 POR_crowns_overreach_desc: "We kept a conquered kingdom, and its people do not thank us for it. The garrisons are expensive and the court is divided over whether Portugal was ever meant to rule so much of Europe."
 POR_canal_question: "The Canal Question"
 POR_macau_window_grievance: "The Macau Window"
 portugal.141.t: "The Peace of Badajoz"
 portugal.141.d: "Iberia is one"
 portugal.141.a: "Hold the claims of Aljubarrota"
 portugal.141.a_tt: "We keep §YGalicia§!, §YExtremadura§! with Olivenza, §YCeuta§!, the §YCanary Islands§! and the §YBalearic Islands§!. Everything else returns to an independent §YSpain§!."
 portugal.141.b: "One crown for the peninsula"
 portugal.141.b_tt: "We keep §YGalicia§! and §YExtremadura§! with Olivenza. The rest of §YSpain§! becomes our §Ypuppet§!, a kingdom that answers to Lisbon."
 portugal.141.c: "Free the nations of Spain"
 portugal.141.c_tt: "§YGalicia§!, §YCatalonia§!, the §YBasque Country§!, §YAndalusia§! and the §YCanary Islands§! become our §Ypuppets§!. We keep §YExtremadura§! with Olivenza, §YCeuta§! and the §YBalearic Islands§!. What is left of §YSpain§! stays independent."
 portugal.141.d_tt: "Every state of §YSpain§! becomes §GPortuguese§!. With Spain gone and the peninsula ours, §YThe Dream of Iberia§! can begin."
 portugal.142.t: "The Peace of Naples"
 portugal.142.d: "Rome has capitulated. The Crown of Aragon held Sardinia, Sicily and Naples for centuries, and our delegates arrive in Naples to take them back."
 portugal.142.a: "Take the Aragonese inheritance"
 portugal.142.a_tt: "We keep §YSardinia§!, §YSicily§!, §YCampania§! with Naples and §YCalabria§!. The rest of §YItaly§! stays independent."
 portugal.142.b: "A free Sardinia"
 portugal.142.b_tt: "§YSardinia§! becomes our §Ypuppet§!. We keep §YSicily§!, §YCampania§! with Naples and §YCalabria§!. The rest of §YItaly§! stays independent."
 portugal.142.c: "A crown in Rome"
 portugal.142.c_tt: "We keep §YSardinia§!, §YSicily§!, §YCampania§! with Naples and §YCalabria§!. The rest of §YItaly§! becomes our §Ypuppet§!, and its §YMonarchists§! take power and suspend elections."
 portugal.143.t: "The Peace of Perpignan"
 portugal.143.d: "Paris has capitulated. France took the Roussillon from the Crown of Aragon in 1659, and the Pope granted Corsica to Aragon with Sardinia in 1297. Our delegates meet the French in Perpignan."
 portugal.143.a: "Take the old Aragonese march"
 portugal.143.a_tt: "We keep §YLanguedoc-Roussillon§!, §YCorsica§! and §YFrench Guiana§!. The rest of §YFrance§! stays independent."
 portugal.143.b: "Restore the French crown"
 portugal.143.b_tt: "We keep §YLanguedoc-Roussillon§! and §YFrench Guiana§!. The rest of §YFrance§! becomes our §Ypuppet§!, its §YMonarchists§! take power and suspend elections, and its own restoration of the kingdom becomes possible."
 portugal.143.c: "Ask only for Guiana"
 portugal.143.c_tt: "We keep §YFrench Guiana§!. The rest of §YFrance§! stays independent."
 portugal.144.t: "The Peace of Windsor"
 portugal.144.d: "London has capitulated. The Treaty of Windsor made us allies in 1386, and six centuries later its successor is signed on our terms."
 portugal.144.a: "The Rock and the islands we found"
 portugal.144.a_tt: "We keep §YGibraltar§!, §YSaint Helena§!, §YAscension§! and §YTristan da Cunha§!, which Portuguese navigators found. The §YFalkland Islands§! go to §YArgentina§!. The rest of the §YUnited Kingdom§! stays independent."
 portugal.144.b: "Dissolve the Union"
 portugal.144.b_tt: "We keep §YGibraltar§!. §YScotland§! and §YWales§! become independent, and §YUlster§! goes to §YIreland§!. What is left of the §YUnited Kingdom§! stays independent."
 portugal.144.c: "A crown with its powers back"
 portugal.144.c_tt: "We keep §YGibraltar§!. The rest of the §YUnited Kingdom§! becomes our §Ypuppet§!, and its §YMonarchists§! take power and suspend elections."
 portugal.145.t: "The Treaty of Tangier"
 portugal.145.d: "Rabat has capitulated. Portugal held Tangier for two centuries and Spain and France ran Morocco as a protectorate until 1956. The question is how much of that we want back."
 portugal.145.a: "Tangier and the Rif"
 portugal.145.a_tt: "We keep §YTanger-Tetouan-Al Hoceima§!. The rest of §YMorocco§! stays independent."
 portugal.145.b: "A protectorate again"
 portugal.145.b_tt: "We keep §YTanger-Tetouan-Al Hoceima§!. The rest of §YMorocco§! becomes our §Ypuppet§!."
 portugal.145.c: "Free the Sahara"
 portugal.145.c_tt: "We keep §YTanger-Tetouan-Al Hoceima§!. §YWestern Sahara§! becomes independent as the §YSahrawi Republic§!. The rest of §YMorocco§! stays independent."
 portugal.146.t: "The Treaty of Rio"
 portugal.146.d: "Brasília has capitulated. Two hundred years after the Ipiranga cry, Lisbon decides what Brazil will be."
 portugal.146.a: "Keep the captaincies of the north-east"
 portugal.146.a_tt: "We keep §YBahia§! and §YPernambuco§!. The rest of §YBrazil§! stays independent."
 portugal.146.b: "The Braganza crown"
 portugal.146.b_tt: "All of §YBrazil§! becomes our §Ypuppet§!, and its §YMonarchists§! take power and suspend elections under a Braganza emperor."
 portugal.146.c: "Divide the Brazils"
 portugal.146.c_tt: "We keep §YBahia§! and §YPernambuco§!. §YSouthern Brazil§! and §YSão Paulo§! become our §Ypuppets§!. What is left of §YBrazil§! stays independent."
 portugal.147.t: "The Peace of the Plate"
 portugal.147.d: "Buenos Aires has capitulated. The Plate has been fought over by Lisbon, Madrid, Rio and Buenos Aires since the seventeenth century, and now it is settled."
 portugal.147.a: "A protectorate on the Plate"
 portugal.147.a_tt: "§YArgentina§! becomes our §Ypuppet§!."
 portugal.147.b: "Take the Mesopotamia and free Patagonia"
 portugal.147.b_tt: "We keep the §YMesopotamia§! between the Paraná and the Uruguay. §YPatagonia§! becomes independent. The rest of §YArgentina§! stays independent."
 portugal.148.t: "The Return to Goa"
 portugal.148.d: "New Delhi has capitulated. Goa was Portuguese for 451 years until December 1961, and Bombay was ours until it went to England as a royal dowry in 1661."
 portugal.148.a: "Goa, Damão and Diu"
 portugal.148.a_tt: "We keep §YNorth Karnataka§! with Goa, §YWest Gujarat§! with Diu and §YEast Gujarat§! with Damão. The rest of §YIndia§! stays independent."
 portugal.148.b: "The Malabar coast and Bombay"
 portugal.148.b_tt: "We also keep §YKerala§! with Cochin and Calicut, where Vasco da Gama landed, and §YMumbai§!. The rest of §YIndia§! stays independent."
 portugal.149.t: "The Treaty of the Pearl River"
 portugal.149.d: "Beijing has capitulated. China signed away its ports at Nanking in 1842, and it signs them away again, to us."
 portugal.149.a: "The treaty ports"
 portugal.149.a_tt: "We keep §YGuangdong§!, §YFujian§!, §YZhejiang§!, §YShanghai§! and §YHong Kong§!. The rest of §YChina§! stays independent."
 portugal.149.b: "Break the Middle Kingdom"
 portugal.149.b_tt: "We keep the treaty ports and §YHong Kong§!. §YTibet§! and §YEast Turkestan§! become independent. The rest of §YChina§! stays independent."
 portugal.150.t: "The Peace of the Spice Islands"
 portugal.150.d: "Jakarta has capitulated. The Moluccas, Solor and Timor were the end of the spice route, and we hold the islands our captains first reached."
 portugal.150.a: "Take the spice route"
 portugal.150.a_tt: "We keep the §YLesser Sunda Islands§!, the §YMoluccas§! and the §YNorth Moluccas§!. §YWest Timor§! joins §YEast Timor§!. The rest of §YIndonesia§! stays independent."
 portugal.150.b: "Solor, Ternate and one Timor"
 portugal.150.b_tt: "We keep the §YLesser Sunda Islands§! and the §YNorth Moluccas§!. §YWest Timor§! joins §YEast Timor§!. The rest of §YIndonesia§! stays independent."
 portugal.151.t: "[?POR_peace_target.GetNameDefCap] Is Ready to Talk"
 portugal.151.d: "Our troops hold what we came for, and [?POR_peace_target.GetNameDef] is losing. Its diplomats have let it be known that they would sign a peace today rather than lose more tomorrow."
 portugal.151.a: "Offer peace for the provinces we hold"
 portugal.151.b: "Offer peace under our protection"
 portugal.151.c: "Fight on"
 portugal.152.t: "Lisbon Offers Terms"
 portugal.152.d_cede: "[From.GetNameDefCap] offers to end the war if we cede the provinces it claims and already holds. Everything else stays ours."
 portugal.152.d_protection: "[From.GetNameDefCap] holds our capital and offers to end the war if we accept its protection. Our government stays in office, but our foreign policy will be made in Lisbon."
 portugal.152.a: "Accept the terms"
 portugal.152.b: "Fight on"
 portugal.153.t: "Peace with [From.GetNameDef]"
 portugal.153.d: "[From.GetNameDefCap] has accepted our terms, and the guns have fallen silent."
 portugal.153.a: "Bring the troops home"
 portugal.154.t: "[From.GetNameDefCap] Fights On"
 portugal.154.d: "[From.GetNameDefCap] has refused our terms. The war goes on."
 portugal.154.a: "Then we will take the rest"
 POR_peace_cede_tt: "Every state they own that we claim and fully control becomes §GPortuguese§!, and the war between us ends in peace."
 POR_peace_protection_tt: "They become our §Ypuppet§!, and the war between us ends."
 POR_peace_not_again_tt: "They will not be offered terms again for §Y180 days§!."
 POR_atlantic_fleet: "The Atlantic Fleet"
 POR_atlantic_fleet_desc: "With more than twenty ships in commission, the navy is no longer a coast guard with frigates. The fleet is reorganised as one command for the whole Atlantic, with squadrons at sea rather than ships waiting in the Tagus."
 POR_south_atlantic_station: "The South Atlantic Station"
 POR_south_atlantic_station_desc: "In the nineteenth century the navy kept a permanent station at Rio de Janeiro. With a foothold in South America again, a squadron is based on the far side of the ocean, and the sea between Brazil and Angola is patrolled by our ships."
 POR_gulf_of_guinea_patrol: "The Gulf of Guinea Patrol"
 POR_gulf_of_guinea_patrol_desc: "Pirates and smugglers work the oil routes off Nigeria and São Tomé, and our partners on that coast have no navy to stop them. Our frigates take the patrol, and their crews learn to fight in the heat of the Bight."
 POR_far_east_station: "The Far East Station"
 POR_far_east_station_desc: "The Estação Naval de Macau sent gunboats up the Pearl River for a century. With a base in Asia again, a squadron is stationed half a world from Lisbon, and the navy learns to sail and supply at that distance."
 POR_mediterranean_squadron: "The Mediterranean Squadron"
 POR_mediterranean_squadron_desc: "The strait and the islands of the western Mediterranean are ours to watch. A squadron based inside the sea mines the narrows when it must and decides who passes."
 POR_thalassocracy: "Thalassocracy"
 POR_thalassocracy_desc: "Venice, Genoa and Portugal were empires of the sea, holding coasts and straits rather than continents. With squadrons on stations across three oceans, the navy is the arm that holds the empire together."
 POR_carrier_air_wing: "The Carrier Air Wing"
 POR_carrier_air_wing_desc: "A carrier at sea needs a permanent air group trained to fly from a deck in an Atlantic swell. The navy and the air force form a joint wing, and the carrier becomes a fighting ship rather than a flagship."
 POR_amphibious_task_force: "The Amphibious Task Force"
 POR_amphibious_task_force_desc: "The Fuzileiros have landed on hostile beaches since 1621. New landing craft carry a whole brigade ashore from over the horizon, and the marines train with the fleet for operations far from home."
 POR_stealth_frigates: "Stealth Frigates"
 POR_stealth_frigates_desc: "The new frigates are shaped to hide from radar, with their weapons inside the hull. The navy trains for a war where whoever sees first wins, and the yards at Viana learn to build the next class."
 POR_ocean_submarines: "Ocean-Going Submarines"
 POR_ocean_submarines_desc: "Submarines that stay submerged for weeks give a small navy a long reach. The boats patrol the approaches to the Atlantic islands and far beyond, and the Arsenal prepares the next class."
 POR_hypersonic_strike: "Hypersonic Anti-Ship Missiles"
 POR_hypersonic_strike_desc: "A missile at five times the speed of sound reaches a carrier group before it can react. Fitted to our frigates and submarines, it lets a small fleet threaten a large one."
 POR_unmanned_squadron: "The Unmanned Squadron"
 POR_unmanned_squadron_desc: "Robot boats and underwater drones scout, sweep mines and shadow submarines without risking a crew. A squadron of them extends the eyes of every frigate."
 POR_navy_of_2040: "The Navy of 2040"
 POR_navy_of_2040_desc: "Stealth hulls, hypersonic missiles and unmanned escorts are no longer experiments. The navy rewrites its doctrine around them and puts to sea one of the most modern fleets in Europe."
 POR_expeditionary_corps: "The Expeditionary Corps"
 POR_expeditionary_corps_desc: "For the first time since the colonial wars, more than seventy-five thousand Portuguese soldiers serve in formed units. The brigades are grouped into a corps that can deploy and fight overseas."
 POR_training_missions_in_africa: "Training Missions in Africa"
 POR_training_missions_in_africa_desc: "Our instructors train the armies of our African partners, and our own units rotate through the bush and the savanna with them. Both armies learn from the exchange, and ours learns to fight in the heat."
 POR_jungle_warfare_school: "The Jungle Warfare School"
 POR_jungle_warfare_school_desc: "At Manaus, Brazil trains the best jungle soldiers in the world. Our units now train there and in the rainforests of our South American partners, learning to live and fight under the canopy for weeks."
 POR_army_of_africa: "The Army of Africa"
 POR_army_of_africa_desc: "Spain's Army of Africa was raised in Morocco and fought in the deserts and mountains of the Rif. The garrisons we hold across the strait become a desert school of our own."
 POR_peninsular_army: "The Peninsular Army"
 POR_peninsular_army_desc: "Wellington's Peninsular Army fought from Lisbon to the Pyrenees. With Spanish provinces under our flag, the army reorganises to defend the whole peninsula, with depots and training grounds from Galicia to Andalusia."
 POR_four_continents: "An Army on Four Continents"
 POR_four_continents_desc: "Portuguese soldiers serve in Europe, Africa, America and Asia, as they did when the empire spanned the world. The army that comes out of these rotations is one of the most experienced anywhere."
 POR_soldier_of_the_future: "The Soldier of the Future"
 POR_soldier_of_the_future_desc: "Every infantryman now carries a network, night vision and armour that a special forces operator would have envied in 2000. The army issues the new kit and trains to use it."
 POR_networked_division: "The Networked Division"
 POR_networked_division_desc: "Every vehicle, drone and soldier in the division shares one picture of the battle. Commanders plan in hours rather than days, and the army learns to fight at the speed of its data."
 POR_long_range_fires: "Long-Range Fires"
 POR_long_range_fires_desc: "Ground-launched cruise missiles let the army strike hundreds of kilometres behind the front. The artillery becomes a strategic weapon."
 POR_robotic_brigade: "The Robotic Brigade"
 POR_robotic_brigade_desc: "Unmanned vehicles lead the assault, carry the loads and draw the first fire. A brigade is reorganised around them, and the army studies how to fight with fewer soldiers in harm's way."
 POR_layered_air_defence: "Layered Air Defence"
 POR_layered_air_defence_desc: "Drones, missiles and aircraft all need an answer. A layered network of short- and long-range air defences protects the army in the field and the cities at home."
 POR_army_of_2040: "The Army of 2040"
 POR_army_of_2040_desc: "Robots, networks and long-range fires are no longer separate programmes. The army rewrites its doctrine around them and fields a force built for the wars of the 2040s."
 POR_air_bases_overseas: "Air Bases Overseas"
 POR_air_bases_overseas_desc: "Monte Real, Beja and Lajes are a start. Porto Santo becomes a second Atlantic base, and the air force plans for bases far beyond Portugal."
 POR_air_bases_in_africa: "Air Bases in Africa"
 POR_air_bases_in_africa_desc: "The Portuguese Air Force flew from Luanda, Bissau and Nacala until 1975. A base at the capital of one of our African partners puts the south and west of the continent within reach again."
 POR_south_atlantic_air_bridge: "The South Atlantic Air Bridge"
 POR_south_atlantic_air_bridge_desc: "Tankers and transports fly a regular bridge between Lisbon and South America. A base on the far side of the Atlantic lets our aircraft and paratroopers deploy there within a day."
 POR_far_east_air_wing: "The Far East Air Wing"
 POR_far_east_air_wing_desc: "A permanent wing in Asia, based on our own soil, puts Portuguese fighters over the South China Sea for the first time."
 POR_global_reach: "Global Reach"
 POR_global_reach_desc: "With bases on several continents and tankers to link them, the air force can put aircraft wherever the empire needs them within days."
 POR_loyal_wingmen: "Loyal Wingmen"
 POR_loyal_wingmen_desc: "Unmanned combat aircraft fly alongside our fighters, taking the risks and carrying the extra weapons. Tekever builds them, and our pilots learn to command a flight of drones from the cockpit."
 POR_stand_off_weapons: "Stand-Off Weapons"
 POR_stand_off_weapons_desc: "Hypersonic and long-range missiles let our aircraft strike from far outside the enemy's air defences."
 POR_paratroopers_of_tancos: "The Paratroopers of Tancos"
 POR_paratroopers_of_tancos_desc: "The air force founded Portugal's paratroopers in 1955, and they jumped in Angola, Guinea and Mozambique. The school at Tancos trains a new generation to go wherever the transports can fly."
 POR_sixth_generation: "Sixth Generation"
 POR_sixth_generation_desc: "The next fighter is a system: a manned aircraft leading drones, hidden from radar and linked to everything around it. OGMA joins a European programme to build it."
 POR_air_force_of_hundreds: "An Air Force of Hundreds"
 POR_air_force_of_hundreds_desc: "With more than two hundred and fifty aircraft in service, the air force has outgrown its old squadrons. It is reorganised into wings with their own commands, doctrine and schools."
 POR_space_command: "Space Command"
 POR_space_command_desc: "Satellites see, talk and guide for every other service. The air force takes command of Portugal's satellites and of the war in orbit."
 POR_military_constellation: "A Military Constellation"
 POR_military_constellation_desc: "With launches from our own spaceport on Santa Maria, the air force puts up a constellation of reconnaissance and communications satellites of its own instead of buying time on allied ones."
 POR_aerospace_cluster: "The Aerospace Cluster"
 POR_aerospace_cluster_desc: "OGMA, Tekever, UAVision and the CEiiA engineers form a cluster that can design and build what the air force needs. The state funds them as one industry."
