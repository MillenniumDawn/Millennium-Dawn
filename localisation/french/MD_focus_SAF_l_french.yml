 SAF_al_jamaah_party_founded_TT: "£SAF_moderate_islamist (AJ) - Al Jama-ah sera officiellement enregistré en tant que parti, supplantant le £SAF_moderate_islamist Parti musulman africain (Africa Muslim Party) comme principal front politique défendant les musulmans en [SAF.GetName] !"
 SAF_democratic_alliance_party_founded_TT: "£SAF_liberal (DA) - L'Alliance démocratique sera officiellement enregistrée en tant que parti, avec l'union officielle du £SAF_liberal (DP) - Parti démocrate et de l'(FA) - Alliance fédérale !"
 SAF_economic_freedom_fighters_party_founded_TT: "£SAF_neutral_communism (EFF) - Les Economic Freedom Fighters seront officiellement enregistrés en tant que parti, provoquant un schisme au sein de la Ligue de la jeunesse de l'ANC !"
 SAF_freedom_front_plus_party_founded_TT: "£SAF_right_wing_populism (VF+) - Le Front de la liberté Plus sera officiellement enregistré en tant que parti, fusionnant le (KP) - Parti conservateur et le (AE) - mouvement de l'Unité afrikaner dans les rangs du £SAF_right_wing_populism (VF) - Front de la liberté !"