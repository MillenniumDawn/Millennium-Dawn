 ENGINE_INFO: "\n\n§GПодсказка дизайнера: Число двигателей даёт разные преимущества. Для малых и средних самолётов два двигателя повышают скорость, тягу и надёжность, но увеличивают стоимость производства.§!\n\n§BУ четырёх-, шести- и восьмидвигательных самолётов больше двигателей — это больше тяги и надёжности, но ниже скорость и выше стоимость производства.§!\n\n§RВинтовые двигатели обычно дешевле реактивных, расходуют меньше топлива и снабжения, медленнее, но дают немного больше тяги.§!"
