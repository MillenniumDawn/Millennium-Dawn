 china_news.43.t: "중국의 한반도 전략 발표"
 china_news.43.d: "중화인민공화국이 한반도에 대한 공식 전략 태세를 발표했습니다. 시진핑 주석은 중국이 더 이상 모호함으로 한반도 문제를 관리하지 않겠다고 선언했습니다."
 china_news.43.a: "발표를 인정한다."
