 PRODUCTION_PRICE_10_TT: "단가 및 전체 생산분에 대한 §R총액§!입니다.\n\n생산 비용은 §Y선불로 지불되지 않습니다§!. 총액은 §Y제작 기간에 걸쳐 매주 청구되며§!, 현재 주당 약 §Y$[?var_space_week_10|C2]억§!입니다.\n\n병렬 생산 라인을 추가하면 제작 시간은 단축되지만 총액과 주당 청구액이 모두 증가합니다."
 PRODUCTION_PRICE_11_TT: "단가 및 전체 생산분에 대한 §R총액§!입니다.\n\n생산 비용은 §Y선불로 지불되지 않습니다§!. 총액은 §Y제작 기간에 걸쳐 매주 청구되며§!, 현재 주당 약 §Y$[?var_space_week_11|C2]억§!입니다.\n\n병렬 생산 라인을 추가하면 제작 시간은 단축되지만 총액과 주당 청구액이 모두 증가합니다."
 PRODUCTION_PRICE_12_TT: "단가 및 전체 생산분에 대한 §R총액§!입니다.\n\n생산 비용은 §Y선불로 지불되지 않습니다§!. 총액은 §Y제작 기간에 걸쳐 매주 청구되며§!, 현재 주당 약 §Y$[?var_space_week_12|C2]억§!입니다.\n\n병렬 생산 라인을 추가하면 제작 시간은 단축되지만 총액과 주당 청구액이 모두 증가합니다."
 PRODUCTION_PRICE_13_TT: "단가 및 전체 생산분에 대한 §R총액§!입니다.\n\n생산 비용은 §Y선불로 지불되지 않습니다§!. 총액은 §Y제작 기간에 걸쳐 매주 청구되며§!, 현재 주당 약 §Y$[?var_space_week_13|C2]억§!입니다.\n\n병렬 생산 라인을 추가하면 제작 시간은 단축되지만 총액과 주당 청구액이 모두 증가합니다."
 PRODUCTION_PRICE_14_TT: "단가 및 전체 생산분에 대한 §R총액§!입니다.\n\n생산 비용은 §Y선불로 지불되지 않습니다§!. 총액은 §Y제작 기간에 걸쳐 매주 청구되며§!, 현재 주당 약 §Y$[?var_space_week_14|C2]억§!입니다.\n\n병렬 생산 라인을 추가하면 제작 시간은 단축되지만 총액과 주당 청구액이 모두 증가합니다."
 SPACE_AUTO_TITLE: "§Y프로그램 자동화§!"
 SPACE_AUTO_TITLE_TT: "미세 조정 없이 우주 프로그램을 관리합니다: 매주 선택한 계획에 필요한 위성과 발사체를 주문하고, 재고가 채워지면 순환 발사를 진행합니다.\n\n이 시스템은 항상 §Y연구된 최신 세대§!만을 생산하며 결코 구형 모델을 만들지 않고, 위성 체계가 최대 용량에 도달하면 스스로 생산을 중단합니다.\n\n§Y이 패널의 수치들은 매월 재계산되며§!, 이 탭을 다시 열 때마다 다시 계산됩니다. 따라서 기술 연구 완료 후 정보가 갱신되지 않은 것처럼 보인다면, 다른 탭으로 이동했다가 돌아와서 새로고침하십시오.\n\n§R공격용 인공위성(KILLSAT)은 자동화되지 않습니다.§! 공격용 인공위성은 전 지구적 감시망이 아닌 궤도 무기이므로, 채워야 할 목표 용량이 없습니다."
 SPACE_AUTO_STATUS: "[space_auto_status_loc]"
 SPACE_AUTO_STATUS_TT: "§Y비활성§! - 자동화가 꺼져 있습니다.\n§Y활성§! - 주문 및 발사 중. 숫자는 현재 주당 청구액입니다.\n§Y대기 중§! - 생산된 물량이 아직 한 번의 완전한 발사에 필요한 양에 도달하지 못했습니다.\n§Y용량 도달§! - 계획 내의 모든 위성 자리가 가득 찼습니다. 새로운 세대를 연구할 때까지 대기합니다.\n§Y중단됨§! - 계획 내의 어떠한 탑재물도 해당 발사체에 맞지 않습니다.\n§Y일시 정지§! - 국고가 다음 생산분을 감당할 수 없습니다. 순환 발사 횟수를 낮추거나 적자 재정을 활성화하십시오.\n§Y정지됨§! - 국고가 비어 있고 적자 재정이 꺼져 있습니다.\n\n이 상태는 매월 그리고 이 탭을 다시 열 때마다 재계산됩니다."
 SPACE_AUTO_TOGGLE_TT: "[!space_auto_toggle_button_click_enabled]자동화를 켜거나 끕니다."
 SPACE_AUTO_TOGGLE_TT_DELAYED: "끄면 신규 주문만 중단됩니다. 이미 생산 중인 물량은 완료될 때까지 계속 청구되므로, 귀하가 지불한 금액은 낭비되지 않습니다.\n\n다시 켜면 현재 위성 자리 상태가 어느 정도 채워져 있든 그 지점부터 재개됩니다."
 SPACE_AUTO_PRESET: "§g계획:§! [space_auto_preset_name_loc]"
 SPACE_AUTO_PRESET_DESC: "[space_auto_preset_desc_loc]"
 SPACE_AUTO_PRESET_TT: "자동화로 건설할 위성입니다. 수동 설계가 필요 없습니다. 모든 계획은 사용자가 연구한 최신 세대를 스스로 선택합니다.\n\n§Y자동§!은 가장 구식인 네트워크부터 재건한 다음, 하나가 꽉 차면 다음으로 넘어갑니다.\n§Y집중§! 계획은 모든 슬롯을 하나의 위성군에 할당합니다.\n§Y한 쌍§! 및 §Y균형§! 계획은 탑재 목록을 나누어, 다른 슬롯들이 차오르는 동안 가장 뒤처진 위성군에 슬롯을 넘깁니다.\n§Y사용자 지정§!은 상단에서 직접 설정하고 저장한 탑재 목록을 비행시킵니다."
 SPACE_AUTO_PRESET_NEXT_TT: "다음 계획"
 SPACE_AUTO_PRESET_PREV_TT: "이전 계획"
 space_auto_preset_0: "§Y자동§!"
 space_auto_preset_1: "§Y위성항법시스템 집중§!"
 space_auto_preset_2: "§Y통신위성 집중§!"
 space_auto_preset_3: "§Y첩보위성 집중§!"
 space_auto_preset_4: "§Y위성항법시스템 + 통신위성§!"
 space_auto_preset_5: "§Y위성항법시스템 + 첩보위성§!"
 space_auto_preset_6: "§Y통신위성 + 첩보위성§!"
 space_auto_preset_7: "§Y균형§!"
 space_auto_preset_8: "§Y사용자 지정§!"
 space_auto_preset_0_desc: "가장 구식인 네트워크부터 재건한 다음, 다음 네트워크로 넘어갑니다. 현재 건설할 항목이 없습니다."
 space_auto_preset_0_desc_gnss: "가장 구식인 네트워크부터 재건합니다. 현재: §G위성항법시스템§!. 용량에 도달하면 자동으로 다음으로 넘어갑니다."
 space_auto_preset_0_desc_com: "가장 구식인 네트워크부터 재건합니다. 현재: §G통신위성§!. 용량에 도달하면 자동으로 다음으로 넘어갑니다."
 space_auto_preset_0_desc_spy: "가장 구식인 네트워크부터 재건합니다. 현재: §G첩보위성§!. 용량에 도달하면 자동으로 다음으로 넘어갑니다."
 space_auto_preset_1_desc: "4개 슬롯 모두 위성항법시스템. 육군 속도, 공군 및 해군 타격 정확도, 건설 속도, 자원 산출량입니다."
 space_auto_preset_2_desc: "4개 슬롯 모두 통신위성. 지휘력, 육군 조직력, 계획 수립 속도, 정치력 및 정보 작전입니다."
 space_auto_preset_3_desc: "4개 슬롯 모두 첩보위성. 계획 수립 한도, 정찰, 탐지, 수송선단 효율, 연구 속도 및 정보망 도달범위입니다."
 space_auto_preset_4_desc: "비행당 2개의 위성항법시스템과 2개의 통신위성. 지휘 통제와 더불어 표적 지정 및 건설입니다."
 space_auto_preset_5_desc: "비행당 2개의 위성항법시스템과 2개의 첩보위성. 정찰 및 연구와 더불어 표적 지정 및 건설입니다."
 space_auto_preset_6_desc: "비행당 2개의 통신위성 및 2개의 첩보위성. 정찰 및 정보와 더불어 지휘 통제입니다."
 space_auto_preset_7_desc: "2개의 위성항법시스템, 1개의 통신위성 및 1개의 첩보위성. 발사 비용이 가장 저렴하고 가벼운 위성항법시스템에 두 배의 가중치를 둡니다."
 space_auto_preset_8_desc: "발사 화면에서 설정하고 저장한 탑재 목록을 비행시킵니다. 탑재물은 매주 최신 세대로 계속 업그레이드됩니다."
 SPACE_AUTO_ROTATION: "§g순환:§! [?var_space_auto_flights|C0]"
 SPACE_AUTO_ROTATION_TT: "순환당 발사되는 횟수입니다. 각 발사체는 하나의 궤도 발사체와 설정된 탑재 목록을 싣고 날아갑니다.\n\n모든 비행에 필요한 완전한 세트가 비축고에 모여야만 순환 발사가 이루어지므로, 생산이 이를 따라잡을 때까지 실제 발사 횟수는 이보다 적을 수 있습니다.\n\n이것이 지출을 조절하는 다이얼입니다. 이 규모의 한 번의 순환은 약 §Y$[?var_space_auto_est_cost|C1]억§!으로 산정되며, 제작 기간에 걸쳐 매주 나뉘어 지불됩니다.\n\n§Y변경 사항은 즉시 적용됩니다.§! 자동화를 껐다 켤 필요가 없습니다. 이미 생산 중인 물량의 가격은 변경되지 않으며, 새로운 규모는 다음 물량이 주문될 때에만 청구됩니다."
 SPACE_AUTO_ROTATION_PLUS_TT: "순환당 발사 횟수 1회 증가 (최대 10회)"
 SPACE_AUTO_ROTATION_MINUS_TT: "순환당 발사 횟수 1회 감소 (최소 1회)"
 SPACE_AUTO_BUDGET: "§g주당:§! $[?space_prod_expense|C1]억"
 SPACE_AUTO_FUNDS: "[space_auto_funds_loc]"
 SPACE_AUTO_FUNDS_TT: "자동화가 약정할 수 있는 남은 자금입니다. 국고 잔고에서 현재 생산 중인 물량의 미납액을 뺀 금액입니다.\n\n생산은 이 금액이 총비용을 덮을 수 있을 때만 시작됩니다. 이는 주간 수치가 아니며, 주당 청구액은 왼쪽에 표시됩니다."
 SPACE_AUTO_BUDGET_TT: "현재 생산 라인이 매주 청구하는 금액과 자동화가 운용할 수 있는 자금입니다.\n\n생산은 §Y국고가 총비용을 덮을 수 있을 때만 시작§!됩니다. 일단 시작되면, 한 번에 공제되는 것이 아니라 제작 기간에 걸쳐 매주 나뉘어 지불됩니다. 이는 수동으로 주문할 때도 마찬가지로 적용됩니다.\n\n현재 규모의 전체 순환 비용은 약 §Y$[?var_space_auto_est_cost|C1]억§!입니다. 순환 규모를 변경해도 이미 진행 중인 생산에는 절대 영향을 미치지 않습니다. 기존 생산분은 주문 당시의 규모와 요금을 유지하며, 새로운 금액은 다음 물량이 발주될 때만 청구됩니다.\n\n§Y적자 재정§!을 켜두면, 국고 확인 과정을 완전히 건너뛰고 신용으로 주문이 진행됩니다."
 SPACE_AUTO_SAVE_BUTTON: "사용자 지정 저장"
 SPACE_AUTO_SAVE_BUTTON_TT: "[!space_auto_save_button_click_enabled]상단에 설정된 탑재 목록을 §Y사용자 지정§! 계획으로 저장하고, 해당 계획으로 전환합니다."
 SPACE_AUTO_SAVE_TT_trigger_2: "상단에 최소 하나 이상의 §Y탑재물§!이 적재되어 있어야 합니다."
 SPACE_AUTO_SAVE_BUTTON_TT_DELAYED: "탑재물 슬롯만 저장됩니다. 궤도 발사체는 항상 연구된 최신형으로 자동 선택되므로 별도로 지정할 필요가 없습니다."
 SPACE_AUTO_UPGRADE_BUTTON: "지금 업그레이드"
 SPACE_AUTO_UPGRADE_BUTTON_TT: "[!space_auto_upgrade_button_click_enabled]이미 궤도에 있는 위성들이 도달범위 손실 없이 지원할 수 있는 모든 위성 체계를 연구된 최신 세대로 즉시 업그레이드합니다."
 SPACE_AUTO_UPGRADE_BUTTON_TT_DELAYED: "위성 체계는 자체적으로 업그레이드되지 않으며 시간이 지남에 따라 저하되기만 하므로, 이 기능이 없으면 새로 쏘아 올린 위성들이 궤도에서 아무런 기여도 하지 못한 채 방치됩니다.\n\n자동화 모드에서는 매 발사 후 이 작업이 자동으로 수행됩니다. 이 버튼은 수동으로 발사했을 때 사용하기 위한 것입니다."
 SPACE_AUTO_MANIFEST: "[space_auto_manifest_loc]"
 SPACE_AUTO_MANIFEST_TT: "이번 순환에서 단일 비행이 운반하는 궤도 발사체와 탑재물 목록입니다.\n\n자동화는 §Y격납고에 있는 낡은 로켓 중 여전히 탑재물을 들어 올릴 수 있는 가장 오래된 로켓§!부터 사용하므로, 구형 단들이 신형보다 먼저 소진됩니다. 새로운 생산은 항상 최신 세대로 이루어지므로, 오래된 재고는 자연스럽게 줄어들게 됩니다.\n\n이미 가득 찬 위성 체계의 슬롯은 아직 부족한 위성군에게 넘어가며, 탑재 목록은 해당 로켓의 운반 능력에 맞춰 조정됩니다. 이 때문에 탑재물 개수가 4개 슬롯 미만이 될 수도 있고, 구형 로켓이 비행당 더 적은 위성을 운반하는 이유이기도 합니다."
 SPACE_AUTO_BUILDING: "[space_auto_building_loc]"
 SPACE_AUTO_BUILDING_TT: "현재 생산 라인에 있는 물량입니다. 이들은 일반적인 생산 배치로서, 이 창의 §Y생산§! 탭에도 남은 시간과 함께 표시되며, 유형당 하나의 배치만 가능하다는 제한 사항의 적용을 받습니다.\n\n궤도 발사체는 위성보다 건설하는 데 훨씬 더 오래 걸리므로, 자동화를 켠 후 첫 번째 순환이 완료되기까지는 거의 1년 가까이 소요될 수 있습니다."
 SPACE_AUTO_DEFICIT: "적자 재정"
 SPACE_AUTO_DEFICIT_TT: "국고 잔고와 관계없이 비용을 부채로 처리하여 주문을 허용합니다.\n\n이 옵션을 끄면, 국고가 총비용을 덮을 수 있을 때만 생산이 시작되므로 프로그램이 가지고 있지 않은 돈을 쓸 수 없습니다. 자동화는 무리하게 주문하는 대신 대기 상태를 유지할 것입니다.\n\n이 설정과 무관하게, §R파산으로 인한 국가 붕괴가 임박한 경우에는 항상 자동화가 중단됩니다.§! 이 보호 장치는 끌 수 없습니다."
 SPACE_AUTO_DEFICIT_TT_DELAYED: "이것은 우주 프로그램이 그에 따른 재정적 부담을 감당하는 경제 규모를 초과하여 운영될 수 있도록 해주는 스위치입니다."
 SPACE_AUTO_STOCKPILE: "비축 생산"
 SPACE_AUTO_STOCKPILE_TT: "한 번에 한 번의 순환씩 진행하는 대신, 프로그램 전체를 미리 구축합니다.\n\n위성이 80~260일 걸리는 데 비해 발사체는 240~440일이 걸리기 때문에, 다음 순환에 필요한 것만 주문하면 발사대는 로켓을 기다리며 유휴 상태에 놓이게 됩니다. 이 기능을 켜면 자동화는 프로그램에 필요한 모든 발사체와 남은 전체 위성군을 단일 배치로 주문합니다.\n\n주당 비용은 훨씬 더 많이 들지만, 용량에 훨씬 일찍 도달하며 멈춤 없이 계속 발사할 수 있습니다."
 SPACE_AUTO_STOCKPILE_TT_DELAYED: "이 기능은 §Y적자 재정§!과 잘 어울립니다. 비축 생산은 예산으로 구매하는 대상이며, 적자 재정 스위치는 그 예산 한도를 없애주기 때문입니다."
 SPACE_AUTO_LATEST_OLV: "최신 궤도 발사체 전용"
 SPACE_AUTO_LATEST_OLV_TT: "연구한 가장 최신의 발사체로만 비행합니다.\n\n이 기능을 끄면 자동화는 §Y재고에 있는 로켓 중 여전히 탑재 목록을 들어 올릴 수 있는 가장 오래된 로켓§!을 비행시키고 신세대는 주문 상태로 유지합니다. 이로 인해 구세대에서 남은 단들이 격납고에 방치되는 대신 소모됩니다. 구형 로켓은 탑재량이 적으므로, 해당 비행은 더 적은 탑재 목록을 운반합니다.\n\n이 기능을 켜면 이전 단계의 로켓들은 완전히 무시됩니다. 모든 비행은 전체 탑재 목록을 운반하지만, 프로그램은 이미 보유한 로켓을 발사하는 대신 새 로켓을 기다립니다."
 SPACE_AUTO_LATEST_OLV_TT_DELAYED: "남은 단이 너무 작아 발사 슬롯을 할당할 가치가 없을 때 활성화하고, 기다리기보다 격납고를 비우는 것을 선호할 때 비활성화하십시오.\n\n§R첩보위성 탑재량의 무게는 일치하는 로켓이 들어 올릴 수 있는 무게와 정확히 일치합니다§!. 첩보위성 계획에서는 구형 단이 최신 세대를 결코 운반할 수 없으므로, 이 스위치는 거기에 아무런 영향을 미치지 않습니다."
 SPACE_AUTO_NET_GNSS: "[space_auto_net_gnss_loc]"
 SPACE_AUTO_NET_GNSS_TT: "§Y위성항법시스템§! - 육군 속도, 근접항공지원 및 해군 타격 정확도, 전략 폭격, 위치 선정, 해군 명중률; 민간 부문에서는 건설 속도와 자원 채굴 효율에 영향을 줍니다.\n\n궤도에 올리기에 가장 저렴하고 가벼운 위성입니다."
 SPACE_AUTO_NET_COM: "[space_auto_net_com_loc]"
 SPACE_AUTO_NET_COM_TT: "§Y통신위성§! - 지휘력, 육군 조직력, 계획 수립 속도, 공군 호위 및 요격, 해군 협동; 더불어 정치력, 암호화, 정보망 획득, 작전 결과에 영향을 줍니다.\n\n효율성은 지상 수신기 기술에 따라 달라지기도 합니다."
 SPACE_AUTO_NET_SPY: "[space_auto_net_spy_loc]"
 SPACE_AUTO_NET_SPY_TT: "§Y정찰 위성§! - 계획 수립 한도, 정찰, 날씨 불이익 감소, 탐지 및 수송선단 효율; 더불어 연구 속도, 전 군에 걸친 정보 범위, 저항군 억제에 영향을 줍니다.\n\n위성 체계 용량을 초과하는 여분의 위성들은 첩보 임무에 배정할 수 있습니다."
