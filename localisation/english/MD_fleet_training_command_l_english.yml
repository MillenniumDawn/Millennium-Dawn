 MD_ftc_fleet_blue_water_name: "Expeditionary Logistics"
 MD_ftc_fleet_blue_water_desc_text: "Fleet trains, underway replenishment and forward basing plans extend the reach of deployed task forces."
 MD_ftc_fleet_green_water_name: "Regional Sea Control"
 MD_ftc_fleet_green_water_desc_text: "Standing escort and patrol arrangements secure the sea lanes and littoral approaches near home waters."
 MD_ftc_fleet_jeune_ecole_name: "Dispersed Flotilla Bases"
 MD_ftc_fleet_jeune_ecole_desc_text: "Small craft operate from many dispersed ports and shelters, which eases maintenance and limits exposure to a single strike."
