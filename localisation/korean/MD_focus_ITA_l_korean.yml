 ITA_nuclear_energy_buildup: "원자력 에너지 확충"
 ITA_nuclear_energy_buildup_desc: "우리의 원자력 산업을 죽인 어리석은 국민투표를 마침내 극복했으니, 잃어버린 기반을 되찾기 위해 상당한 투자로 산업을 다시 가동해야 합니다."
 ITA_encourage_births_idea: "출산 장려"
 ITA_encourage_births_idea_desc: "경제적 장려와 여성의 전통적 역할에 대한 지원은 이민에 의존하지 않고도 출산을 촉진하고 인구 고령화를 되돌리는 데 도움이 될 것입니다."
