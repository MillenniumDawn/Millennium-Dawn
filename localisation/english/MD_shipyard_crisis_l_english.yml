 SHIPYARD_FRIGATE_PROJECT_UKR_TT: "\n[ukr_yard_frigate_line]"
 SHIPYARD_FILTER_BACKLOG_UKR_TT: "\n\nStanding and backlog costs also apply. Full 10-point backlog steps §Y[?shipyard_eq_steps|0]§!. See the Shipbuilding panel in Decisions for rates by hull."
 SHIPYARD_FILTER_BACKLOG_TT: "\n\nBacklog surcharges also apply. Full 10-point backlog steps §Y[?shipyard_eq_steps|0]§!. See the Shipbuilding panel in Decisions for rates by hull."
 SHIPYARD_EMPTY_TT: ""
 shipyard_output_row_tt: "Changes how much production each dockyard contributes per day. Higher output finishes ships sooner."
 shipyard_repair_row_tt: "Changes how quickly dockyards repair damage to ships in the naval repair queue."
 shipyard_refit_row_tt: "Changes how quickly dockyards refit existing ships to a new design. The backlog also raises the production cost of refits by the same percentage that it reduces refit speed."
 shipyard_drift_row_tt: "Shows how many points the backlog gains or loses each month. A positive value worsens the backlog and a negative value reduces it. A higher backlog reduces dockyard output and slows repairs and refits. Each full 10 points adds a construction surcharge that varies by hull and country."
 shipyard_drydock_row_tt: "Shows completed drydock modernization projects out of five.\n\n$shipyard_drydock_effect_tt$"
 shipyard_drydock_recovery_row_tt: "Shows completed drydock modernization projects out of five.\n\n$shipyard_recovery_drydock_effect_tt$"
 shipyard_workforce_row_tt: "Shows completed shipwright training programs out of three.\n\n$shipyard_workforce_effect_tt$"
 shipyard_workforce_recovery_row_tt: "Shows completed shipwright training programs out of three.\n\n$shipyard_recovery_training_effect_tt$"
 shipyard_production_status_label: "£dockyard_output_texticon §YShipyard status§!"
 shipyard_production_status_hint_tt: "When shipyard rules apply, hover §YShipyard status§! in the Production header for current staffing, facility counts and construction modifiers."
 shipyard_dockyard_label_tt: "$SHIPYARD_FACILITIES_INACTIVE_TT$\n\n$shipyard_production_status_hint_tt$"
 shipyard_production_repair_tt: "Dockyards assigned to repairs draw from the same pool as ship production. In countries with a shipyard backlog, both assignments count toward the staffing limit.\n\n$shipyard_production_status_hint_tt$"
 shipyard_hull_rules_tt: "§YSpecialized shipyard rules for eligible countries§!\nA working §YLarge Slipway§! removes the facility surcharge for cruisers and helicopter operators (§R+200%§!, or §R+50%§! for Polish helicopter operators) and for battlecruisers, battleships and aircraft carriers (§R+300%§!).\nA working §YSubmarine Hall§! removes the §R+300%§! facility surcharge for missile submarines.\n$SHIPYARD_FACILITY_DISCOUNTS_TT$\nFacilities count when undamaged and in states we own and control.\n\n$shipyard_production_status_hint_tt$"
