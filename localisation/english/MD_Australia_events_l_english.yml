tour_the_roulettes: "Tour the Roulettes"
the_roulettes_tt: "An option to tour the Roulettes will become available in the §2Military Decisions§! tab."
john_howard_desc: "John Howard stands as a final bastion of the old Liberals. A student of Robert Menzies, and a subscriber to the emergence of the center-right, Howard's policy has driven the party towards the middle class. Prioritising individual freedom, home ownership and free enterprise to stem the tide of growing unionism, and bringing the party back from a decade of irrelevance. \n\nA commercial lawyer before joining the Liberal Party, Howard climbed the ladder from president of the Young Liberals to eventually becoming the member for Bennelong in 1974. Pulling him into the world of parliamentary politics. It wasn't long before he was snatched up by the Fraser government the following year and appointed as Minister for Business and Consumer Affairs. \n\nHoward's lack of trouble shooting up the ranks and increasing expertise in economic matters landed him the youngest Treasurer in almost 75 years not long afterward. A proponent of freer-markets, his efforts to reform the aging economic system were stifled by a weakening economy. Resulting in the 1980s recession kicking the Liberals out of office. \n\nHis position in the party would shift around over the next decade, which could be easily described as a number of coups, double coups and failed election bids by Howard. Finally Howard's chance came in 1996, winning in a landslide against the incumbent Paul Keating, under the campaign promise of decreasing the budget deficit and bringing Australia out of its economic slump. A promise which continues to meander."
sydney_declaration_idea_ast: "The Sydney Declaration"
AST_MOD_MILLENNIUM_DAWN_DESC: "As the century turns, Australia has seen its first signs of economic prosperity since the 80s. With Prime Minister John Howard at the helm, a leader known for his progressive economic policy and middling popularity, the country has already undergone significant change in a short period of time. Now standing at a cultural threshold, with the Sydney Olympics coming up, Australia is poised for greatness, if guided by a steady hand. \n \nDespite the progress, discontent is growing. Years of neglect by the government to amend the suffering of Indigenous communities has festered, and outrage over stagnated reforms continues to spread. The domination of the resource industry has also increased to the point where the Australian economy borders on becoming a petro-state, leaving the nation in a very precarious state."
mining_industrialists_ast: "Mining Industrialists"
mining_industrialists_ast_desc: "An invisible hand has meddled in Australian politics and its industries for decades now. Legislation against them always seems to come up dry, and the direction of our economy has only succeeded if it favors the mining conglomerates. Whether through lobbying or the media, eventually they always come out on top."
