 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_plan_tt: "§YBulgaria§! hands over §Y100§! BTR-60PB in three batches: §Y20§!, then §Y40§! and §Y40§!. Each batch can go into service as it is or be overhauled into the §YBTR-60D§!."
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_wait_tt: "The first batch arrives in about §Y$DAYS$§! days."
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_next_batch_tt: "§YBulgaria§! sends the next batch of §Y40§! BTR-60PB in about §Y60§! days."
