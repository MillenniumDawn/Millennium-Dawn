l_french:
 east_timor.1.t: "La crise de 2006"
 east_timor.1.d: "L'armée du Timor oriental s'est fracturée selon des lignes régionales. Près de 600 soldats des districts de l'ouest ont été renvoyés, déclenchant des violences factionnelles qui se propagent dans la capitale, Dili. Le gouvernement perd le contrôle de la situation sécuritaire."
 east_timor.1.a: "Demander une aide internationale au maintien de la paix"
 east_timor.1.b: "Nous rétablirons l'ordre nous-mêmes"
 east_timor.2.t: "Le Timor oriental demande des soldats de maintien de la paix"
 east_timor.2.d: "Le Timor oriental a sombré dans des violences factionnelles et demande l'aide militaire australienne pour rétablir l'ordre. En tant que principale puissance de la région, notre réponse donnera le ton de l'intervention internationale."
 east_timor.2.a: "Déployer la Force internationale de stabilisation"
 east_timor.2.b: "Nous ne pouvons pas intervenir pour le moment"
 east_timor.3.t: "Le Timor oriental appelle à l'aide"
 east_timor.3.d: "Notre ancienne colonie, le Timor oriental, demande une assistance militaire alors que le pays sombre dans le chaos. Le Portugal a une obligation historique et des liens étroits avec le peuple timorais."
 east_timor.3.a: "Envoyer un contingent de maintien de la paix"
 east_timor.3.b: "Refuser la demande"
 east_timor.4.t: "Le Timor oriental demande de l’aide"
 east_timor.4.d: "Le Timor oriental a demandé l'aide de la Nouvelle-Zélande pour rétablir l'ordre. Le petit pays lutte contre une violence généralisée et l'effondrement de son appareil de sécurité."
 east_timor.4.a: "Envoyer des Casques bleus"
 east_timor.4.b: "Refuser"
 east_timor.5.t: "Crise au Timor oriental"
 east_timor.5.d: "Le Timor oriental a demandé des forces de maintien de la paix malaisiennes pour aider à stabiliser le pays. En tant que nation d'Asie du Sud-Est, la participation de la Malaisie démontrerait la solidarité régionale."
 east_timor.5.a: "Déployer des troupes à Dili"
 east_timor.5.b: "Refuser la demande"
 east_timor.6.t: "Les forces australiennes arrivent"
 east_timor.6.d: "Les forces de maintien de la paix australiennes sont arrivées à Dili et rétablissent l'ordre dans la capitale. La Force internationale de stabilisation est l'épine dorsale de l'opération."
 east_timor.6.a: "Nous sommes reconnaissants"
 east_timor.7.t: "Arrivée des forces portugaises"
 east_timor.7.d: "Des troupes portugaises ont été déployées au Timor oriental, honorant une obligation historique envers leur ancienne colonie."
 east_timor.7.a: "Bienvenue les amis"
 east_timor.8.t: "Arrivée des Casques bleus néo-zélandais"
 east_timor.8.d: "La Nouvelle-Zélande a envoyé un contingent de maintien de la paix pour aider à stabiliser le Timor oriental."
 east_timor.8.a: "Leur aide est appréciée"
 east_timor.9.t: "Arrivée des troupes malaisiennes"
 east_timor.9.d: "Des forces malaisiennes sont arrivées pour appuyer l'opération de maintien de la paix au Timor oriental."
 east_timor.9.a: "Nos remerciements à la Malaisie"
 east_timor.10.t: "La traque d'Alfredo Reinado"
 east_timor.10.d: "Le chef rebelle Alfredo Reinado a échappé aux autorités et se cache dans les montagnes au sud de Dili. Sa liberté continue sape l'autorité du gouvernement et encourage d'autres factions dissidentes."
 east_timor.10.a: "Demander à l'Australie d'envoyer des forces spéciales"
 east_timor.10.b: "Le traquer avec nos propres forces"
 east_timor.11.t: "Le Timor oriental demande l’assistance du SAS"
 east_timor.11.d: "Le Timor oriental a demandé à l'Australie de déployer des troupes du Special Air Service Regiment pour capturer le chef rebelle en fuite Alfredo Reinado, qui continue d'échapper à la force de maintien de la paix."
 east_timor.11.a: "Envoyer le SAS"
 east_timor.11.b: "Cela dépasse notre mandat"
 east_timor.12.t: "Évadés à Reinado"
 east_timor.12.d: "Malgré l'opération des forces spéciales australiennes, Alfredo Reinado s'est échappé dans les montagnes. L'opération n'a pas permis de l'arrêter, mais la présence internationale plus large a stabilisé la situation sécuritaire à Dili."
 east_timor.12.a: "On finira par le trouver"
 east_timor_news.1.t: "Le Timor oriental demande une force internationale de maintien de la paix"
 east_timor_news.1.desc: "Le Timor oriental a formellement demandé une assistance internationale de maintien de la paix, alors que des violences factionnelles laissent des centaines de morts ou de déplacés dans la capitale, Dili. L'Australie, le Portugal, la Nouvelle-Zélande et la Malaisie ont été priés de contribuer des troupes à une Force internationale de stabilisation."
 east_timor_news.1.a: "Nous comptons sur l'aide du monde"
 east_timor_news.1.b: "Nous rétablirons l'ordre à Dili"
 east_timor_news.1.c: "La stabilité de la région est dans notre intérêt"
 east_timor_news.1.d: "Une petite nation en crise"