 subject_rus.120.t: "우랄 공화국 계획"
 subject_rus.120.d: "우리는 우랄 공화국 계획을 되살리는 문제를 해결하고자 합니다. 다른 많은 지역 지도자들도 더 큰 자치를 원하게 될 수 있으므로 이는 상당히 위험하고 아슬아슬한 조치가 될 것입니다."
