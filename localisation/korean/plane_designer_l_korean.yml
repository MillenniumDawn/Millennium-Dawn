 spec_nuclear_consent: "핵 사용 승인 체계"
 engine_scramjet: "스크램제트 엔진"
 engine_scramjet_desc: "스크램제트(\\"초음속 연소 램제트\\"의 줄임말)는 보통 마하 5에서 마하 15 사이의 극초음속에서 작동하도록 설계된 공기흡입식 제트 엔진의 일종입니다. 유입 공기를 이동시키고 압축하기 위해 팬과 압축기에 의존하는 기존 제트 엔진과 달리, 스크램제트는 항공기 자체의 고속 이동을 통해 압축을 달성하며, 엔진으로 들어오는 공기를 \\"공기흡입\\" 방식으로 포획하여 압축합니다."
 engine_ramjet: "터보램제트 엔진"
 engine_ramjet_desc: "램제트(또는 \\"램에어 제트 엔진\\")는 기존 제트 엔진처럼 회전식 압축기 날개를 사용하는 대신 엔진의 전진 운동으로 유입 공기를 압축하여 작동하는 공기흡입식 제트 엔진의 일종입니다. 램제트는 일반적으로 마하 2에서 마하 6 사이의 초음속에서 단순하고 효율적이지만, 저속에서는 작동할 수 없어 작동 범위에 도달하려면 초기 가속이 필요합니다."
 EQ_MOD_SLOT_fixed_primary_command_operations_TITLE: "주력 드론 군집"
 EQ_MOD_SLOT_fixed_drone_doc_slot_1_TITLE: "드론 군집 격납고"
