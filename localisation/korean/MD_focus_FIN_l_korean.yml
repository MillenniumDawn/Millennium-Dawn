l_korean:
 FIN_government_expansion: "정부 권한 확대"
 FIN_government_expansion_desc: "세계는 지금 이 순간 미쳐 돌아가고 있으며, 어떠한 상황에도 대처할 수 있게 준비해야할 것입니다."
 FIN_expand_the_interior_ministry: "내무부 권한 확대"
 FIN_expand_the_interior_ministry_desc: "언제나 국가 내부의 문제를 해결하기 위해 효율적이어야 합니다."
 FIN_conscription_reform: "징병제 개혁"
 FIN_conscription_reform_desc: "우리는 지리학적으로 불안정한 곳에 위치해있습니다. 국민들로 하여금 무엇이든 할 수 있또록 준비시켜야 합니다. 무엇이든지요."
 FIN_northern_road_maintenance: "북부 도로 유지보수"
 FIN_northern_road_maintenance_desc: "북부는 항상 다니기 힘들고 중앙집권에는 어려운 지역이었습니다. 이곳에 기반시설을 지음으로써 더 쉽게 접근가능토록 해줄 것입니다."
 FIN_industrial_expansion_policy: "산업 확장 정책"
 FIN_industrial_expansion_policy_desc: "몇몇 건설 규제를 완하함으로써 건설 시간을 줄일 수 있을 것입니다."
 FIN_timber_export_policy: "목재 수출 정책"
 FIN_timber_export_policy_desc: "자국에는 목재가 넘쳐 흐르며, 이 점을 생각해볼 때 수출품은 아주 가까이에 있습니다."
 FIN_focus_on_civilian_industry: "민간 산업 집중"
 FIN_focus_on_civilian_industry_desc: "사치용품을 만들어 자국 경제에 활력을 불어넣을 수 있습니다."
 FIN_focus_on_military_industry: "군수 산업 집중"
 FIN_focus_on_military_industry_desc: "언제나 군수 부분에 주목해야합니다. 더 많은 무기와 더 나은 무기를!"
 FIN_expand_the_financial_ministry: "재무부 권한 확대"
 FIN_expand_the_financial_ministry_desc: "재무부에 손을 댈 때가 왔습니다. 자금을 늘리는 것과는 상관없이, 그리고 자금을 줄이는 것과도 상관없이 말입니다."
 FIN_export_focus: "수출 중점"
 FIN_export_focus_desc: "더 발전된 경제를 위해서는 수출량을 극도로 늘릴 필요가 있습니다."
 FIN_expand_valtatie_1: "고속도로 확장 1"
 FIN_expand_valtatie_1_desc: "헬싱키 근방의 고속도로를 확장시켜 사람, 물자 운송을 원할히 만들 수 있을 것입니다."
 FIN_adopt_an_economic_doctrine: "경제 정책 수정"
 FIN_adopt_an_economic_doctrine_desc: "어떻게 경제를 바라볼지 그 방법을 찾을 필요가 있습니다."
 FIN_industrialize_turku: "산업화된 투르쿠"
 FIN_industrialize_turku_desc: "투르쿠 산업화는 수익의 증대와 주변 마을들의 성장에 도움이 될 것입니다."
 FIN_industrialize_helsinki: "산업화된 헬싱키"
 FIN_industrialize_helsinki_desc: "Industrializing our capital is a given. If this proves successful, we will be able to introduce even more industry."
 FIN_expand_the_foreign_ministry: "외무부 권한 확대"
 FIN_expand_the_foreign_ministry_desc: "살아남기 위해서는 동맹 결성의 희망을 갖고 강대국과 외교관계를 틔울 필요가 있습니다."
 FIN_adopt_a_foreign_policy_doctrine: "외교 정책 수정"
 FIN_adopt_a_foreign_policy_doctrine_desc: "우리가 추구하려는 행동을 계속 해 나가거나, 목표치를 초과달성하려면 스스로를 평가해야합니다."
 FIN_secure_european_trade_deals: "유럽 무역 거래 채결"
 FIN_secure_european_trade_deals_desc: "EU 회원국이 된다는 것은 유럽의 동맹국들과 무역 거래 협정을 채결한다는 것입니다."
 FIN_trade_with_the_nordics: "북유럽과 무역"
 FIN_trade_with_the_nordics_desc: "우호관계를 지속하기 위해서 북유럽과의 무역은 필수사항입니다."
 FIN_trade_with_russia: "러시아와 무역"
 FIN_trade_with_russia_desc: "러시아와의 무역은 그리 이득있는 일은 아니지만, 무역을 지속할 필요성이 있습니다."
 FIN_trade_with_the_united_states: "미국과의 무역"
 FIN_trade_with_the_united_states_desc: "The United States is a very good nation to have on our side economically. We should pursue their friendship."
 FIN_trade_with_china: "중국과 무역"
 FIN_trade_with_china_desc: "중국은 계속해서 성장하고 있는 힘의 집약체입니다. 저들에게서 무엇인가를 지켜낸다는 것은 어리석은 짓입니다."
 FIN_proximity_to_russia: "러시아와의 친교"
 FIN_proximity_to_russia_desc: "어떤 형태로든지의 충돌을 피하기 위해서 러시아와의 친교는 오랫동안 지속될 것입니다."
 FIN_distance_from_russia: "러시아와 거리를"
 FIN_distance_from_russia_desc: "러시아인들이 우리에게 한 행태 후에도 자국의 땅을 계속 가지고 있습니다. 러시아인들에게 무너질 수는 없습니다."
 FIN_proximity_to_sweden: "스웨덴과의 친교"
 FIN_proximity_to_sweden_desc: "스웨덴과 친교를 맺기 위해 먼저 다가가야 합니다!"
 FIN_distance_from_sweden: "스웨덴과의 거리를"
 FIN_distance_from_sweden_desc: "We will never forget the years of subjugation under the Swedish Empire."
 FIN_proximity_to_the_nordic_countries: "북유럽과의 친교"
 FIN_proximity_to_the_nordic_countries_desc: "The Nordics have a long and vivid history with us. Of course we will warm relations!"
 FIN_distance_from_the_nordic_countries: "북유럽과 거리를"
 FIN_distance_from_the_nordic_countries_desc: "There has been too much conflict with our neighbors throughout history to consider a friendship with them."
 FIN_proximity_to_germany: "독일과의 친교"
 FIN_proximity_to_germany_desc: "유럽과의 친교는 유럽에서 다른 국가들과의 친교에 유리한 점으로 작용할 것입니다!"
 FIN_distance_from_germany: "독일과 거리를"
 FIN_distance_from_germany_desc: "독일에 고개를 숙이는 것은 유럽에 하는 것과 마찬가지지이지만, 핀란드에는 어떠한 보상도 없습니다. 현상유지합시다."
 FIN_proximity_to_the_united_states: "미국과의 친교"
 FIN_proximity_to_the_united_states_desc: "미국은 세계를 이끄는 주도국입니다! 저들에게 우리의 열렬한 환호를 보여주어야 합니다!"
 FIN_distance_from_the_united_states: "미국과 거리를"
 FIN_distance_from_the_united_states_desc: "Why should we show fealty to a nation thousands of miles across the Atlantic? The USA will have to find someone else."
 FIN_proximity_to_the_baltic_states: "발틱 국가들과의 친교"
 FIN_proximity_to_the_baltic_states_desc: "발틱 국가들은 자국과 비슷한 문화를 가지고 있으며, 계속해서 지원을 할 수 있을 겁니다!"
 FIN_distance_from_the_baltic_states: "발틱 국가들과 거리를"
 FIN_distance_from_the_baltic_states_desc: "발틱 국가들과의 친교는 그렇게 좋아보이지 않습니다."
 FIN_proximity_to_poland: "폴란드와의 친교"
 FIN_proximity_to_poland_desc: "동유럽과의 친교는 차후에 중요한 자신이 되어줄 것입니다."
 FIN_distance_from_poland: "폴란드와 거리를"
 FIN_distance_from_poland_desc: "폴란드와 친교를 맺어서 이득이 되는 점은 아무 것도 없습니다."
 FIN_proximity_to_china: "중국과의 친교"
 FIN_proximity_to_china_desc: "중국은 지구의 공장입니다. 친교를 맺지 않을 이유가 없습니다!"
 FIN_distance_from_china: "중국과 거리를"
 FIN_distance_from_china_desc: "다른 국가의 경우를 보면 중국과의 친교는 그렇게 이득이 있어 보이지 않습니다. 실수를 해서는 안됩니다."
 FIN_expand_the_ministry_of_defense: "국방부 권한 확대"
 FIN_expand_the_ministry_of_defense_desc: "We should evaluate where exactly we are putting investment into the military."
 FIN_military_import_programs: "군수품 수입 계획"
 FIN_military_import_programs_desc: "전시에 군수품을 수급할 수 있는 대안책을 마련해야 합니다."
 FIN_reform_the_armed_forces: "군대 개혁"
 FIN_reform_the_armed_forces_desc: "우리가 처한 상황에서, 군대를 더 효율적으로 운용할 필요가 있습니다. 오랜 시간을 들여 개혁합시다."
 FIN_hire_fortification_experts: "요새 전문가 고용"
 FIN_hire_fortification_experts_desc: "자국은 전시에 지리학적으로 적의 소모를 일으킬 수 있는 좋은 위치에 자리잡고 있습니다. 요새는 이 점에 관해서 이점을 줄 것입니다."
 FIN_military_production_in_helsinki: "헬싱키 군수 생산"
 FIN_military_production_in_helsinki_desc: "헬싱키의 군수공장에서 더 많은 무기의 생산은 경제의 발전과 무기 생산량의 증대로 이어질 것입니다."
 FIN_expand_upinniemi_naval_base: "Expand Upinniemi Naval Base"
 FIN_expand_upinniemi_naval_base_desc: "자국의 가장 중요한 해군 기지로 확충함으로써 엄청난 이득을 볼 수 있을 것입니다."
 FIN_expand_tampere_pirkkala_air_base: "탐페레-피르칼라 공항 확충"
 FIN_expand_tampere_pirkkala_air_base_desc: "현재 민간, 군사 공항으로 혼용되어 사용되고 있는 탐페레-피르칼라 공항을 공군의 작전 효율을 늘리기 위해 완벽히 민간, 군사 부분을 분리할 것입니다."
 FIN_recruit_additional_coastal_jaegers: "코스탈 예거 추가 배치"
 FIN_recruit_additional_coastal_jaegers_desc: "자국의 군도는 취약한 장소입니다. 이로 인해 코스탈 예거의 추가 배치를 해야합니다."
 FIN_additional_military_factories: "추가 군수 공장"
 FIN_additional_military_factories_desc: "언제나 더 많은 무기가 필요합니다."
 FIN_focus_on_naval_production: "해군 건조 중점"
 FIN_focus_on_naval_production_desc: "발틱해를 장악할 수 있는 해군을 보유하는 것은 불가능 하지만, 언제나 더 강력한 힘을 갈망해왔습니다."
 FIN_finlands_main_ally: "핀란드의 주요 동맹국"
 FIN_finlands_main_ally_desc: "경제적, 외교적 국가목표를 설정하고 국제 위상을 판단한 뒤, 이제는 결정을 내릴 차례입니다. 핀란드는 어디로 가야할까요? 서쪽? 동쪽? 계속 북쪽으로?"
 FIN_germany: "독일"
 FIN_germany_desc: "우리에게 있어서 가장 큰 위협이 되는 것은 동쪽에 위치한 러시아입니다. 러시아의 급습에 대한 균형추로써 유럽의 경제, 국방력이 큰 작용을 하고 있습니다. 독일은 이미 중요한 경제 협력자로 왜 우리의 동맹이 되지 못하겠습니까?"
 FIN_leopard_2a4_imports: "레오파드 2A4 수입"
 FIN_leopard_2a4_imports_desc: "핀란드는 빈곤한 전차 생산량을 가지고 있습니다. 새로운 독일 동맹이 기꺼이 이 문제를 해결하기 위해 도와줄 것입니다. 고품질의 레오파드 2A4가 창고에 추가될 것입니다."
 FIN_finnish_german_trade: "핀란드-독일 무역"
 FIN_finnish_german_trade_desc: "독일과의 무역은 유럽과의 무역과 마찬가지입니다. 발틱해에서 준비를 끝마치고 해상경로를 확보해야합니다. 헬싱키-뤼베크 항로는 경제부흥을 위한 수출입품이 운반될 것입니다."
 FIN_european_involvement: "유럽 개입"
 FIN_european_involvement_desc: "유럽에 더 깊이 관여해야 합니다."
 FIN_leopard_2a6_imports: "레오파드 2A6 수입"
 FIN_leopard_2a6_imports_desc: "우리가 새로운 장비에 마음을 뺏겨있는동안, 독일군은 만족하지 않고 더 강력하고 죽음을 안겨줄 수 있는 장비를 개발했습니다. 레오파드 2A6 주력전차는 반드시 일어날 러시아의 침공에 맞썰 우리 군의 향상을 위한 다음 목표입니다."
 FIN_praise_the_kaiser: "카이저를 찬양하라"
 FIN_praise_the_kaiser_desc: "예상되로 독일의 군주가 다시 돌아왔습니다. 이러한 독일의 정치상황으로 1940년대 초의 잘못된 방식이었지만 동맹을 다시 맺을 수도 있을 것입니다. 카이저가 1971년과 같이만 힘써준다면, 붉은 물결을 막을 수 있을 것입니다."
 FIN_join_nato: "NATO 가입"
 FIN_join_nato_desc: "러시아가 코 앞에 밀어닥치면서 NATO에 가입하는 것은 필수사항이 되었습니다. 과거와 같이 실수는 저지르지 맙시다."
 FIN_restore_the_kingdom_of_finland: "핀란드 왕국 복원"
 FIN_restore_the_kingdom_of_finland_desc: "1917년 러시아로부터 독립을 한 뒤, 얼마 되지 않아서 독일에 독립에 대한 고마움을 느끼고 있던 핀란드는 독일의 왕세자인 프레드릭 찰스를 왕으로 추대했습니다. 프레드릭 찰스는 독일의 패배로 왕좌에 다가가보지도 못하고 1918년에는 독일의 군주제가 폐지되어 버립니다. 이제 핀란드와 함께 독일의 군주제가 바로섰으며, 핀란드 왕실도 재건할 차례입니다."
 FIN_nato_drills_on_finnish_soil: "핀란드에서의 NATO 합동군사훈련"
 FIN_nato_drills_on_finnish_soil_desc: "전시에 합동 작전을 실시하기 위해, NATO 합동군사훈련을 개최해야합니다."
 FIN_remilitarize_aland: "올란드제도 제 군사화"
 FIN_remilitarize_aland_desc: "올란제도를 비 군사화한 것은 정말 멍청한 짓입니다. 이 정책을 취소해야 합니다."
 FIN_import_nato_equipment: "NATO 장비 수입"
 FIN_import_nato_equipment_desc: "NATO는 높은 기술이 필요한 무기, 장비 생산지입니다. 당장 이것들을 수입해야 합니다."
 FIN_finnish_panzertruppe: "핀란드 전차부대"
 FIN_finnish_panzertruppe_desc: "자국의 전차 관련 사항은 독일의 잔재와 아주 밀접하게 연관되어 있습니다. 독일 전문가와 함께라면 핀란드에서 설계, 생산한 전차를 포함한 자국의 전차부대를 창설할 수 있을지도 모릅니다."
 FIN_secret_preparations_of_war_against_russia: "러시아에 대항한 기밀 전쟁 준비"
 FIN_secret_preparations_of_war_against_russia_desc: "러시아와의 전쟁은 불가피합니다. 최대한 빨리 준비를 해야할 것입니다."
 FIN_proclamation_of_greater_finland: "대핀란드 선포"
 FIN_proclamation_of_greater_finland_desc: "우리가 누구인지, 우리의 정당한 땅을 되찾을 때가 왔습니다. 러시아는 피와 영토로 어리석음의 대가를 지불할 것입니다."
 FIN_sweden: "스웨덴"
 FIN_sweden_desc: "중립외교는 우리나라를 안전하게 지켜주었고 이는 이웃국인 스웨덴도 마찬가지입니다. 스웨덴과 친교를 맺어 전세계가 전쟁의 불길 속에서 타오르고 있어도 함께 버틸 수 있을 것입니다."
 FIN_secure_swedish_minority_rights: "소수 스웨덴인 권리 보장"
 FIN_secure_swedish_minority_rights_desc: "수 세기동안 스웨덴인들은 자국 내에서 살고 있었습니다! 정당한 대우를 받도록 조취를 취할 것입니다."
 FIN_ally_with_sweden: "스웨덴과의 상호 방위 조약"
 FIN_ally_with_sweden_desc: "The Swedish have a very similar foreign policy to us. We could always introduce another level of security for the both of us with a defensive treaty."
 FIN_create_jobs_for_the_swedish_minority: "소수 스웨덴인을 위한 일자리 창출"
 FIN_create_jobs_for_the_swedish_minority_desc: "스웨덴인들에게 더 많은 일자리를 배정한다면, 이들의 생산량은 더 늘어날 것입니다."
 FIN_military_cooperation_with_sweden: "스웨덴과의 군사 협력"
 FIN_military_cooperation_with_sweden_desc: "방위를 더 튼튼히 하기 위해서 스웨덴과의 군사 협력은 더 필수적이게 되었습니다."
 FIN_joint_artillery_projects: "공동 야포 개발"
 FIN_joint_artillery_projects_desc: "자주권을 위해 야포는 전시에 필수적인 무기입니다."
 FIN_import_swedish_equipment: "스웨덴 장비 수입"
 FIN_import_swedish_equipment_desc: "스웨덴은 자국에 사용할 수 있는 장비가 많습니다."
 FIN_joint_tank_projects: "공동 전차 개발"
 FIN_joint_tank_projects_desc: "더 발전된 전차를 개발하기 위해 서로서로 협력해야 합니다."
 FIN_defensive_focus: "방어 중점"
 FIN_defensive_focus_desc: "겨울 전쟁에서 방어 전략의 핵심을 집을 수 있습니다. 그리고 방어 전략을 실현하기 위한 완벽한 위치에 자리잡고 있습니다."
 FIN_russia: "러시아"
 FIN_russia_desc: "우리의 외교정책에 대해서 다시 생각해볼 때입니다. 러시아는 골칫덩어리가 아니라 해결책입니다. 핀란드-러시아 동맹을 통해 동부 전선의 안전을 확보하고난 뒤에, 자국은 골칫덩어리 서쪽이나 남쪽의 국가들에게 더 효과적으로 교섭을 할 수 있을 것입니다."
 FIN_political_alliance_with_vladimir_putin: "블라디미르 푸틴과의 정치적 동맹"
 FIN_political_alliance_with_vladimir_putin_desc: "푸틴 정권은 부폐한 것이 아닙니다. 푸틴과 그 인사들에게 뇌물과 영토를 바쳐서 러시아의 정치인들이 핀란드의 독립을 보장하도록 할 수 있습니다."
 FIN_csto_embassies: "CSTO 대사관"
 FIN_csto_embassies_desc: "향후의 동맹국과 친교를 맺어야할 것입니다. 더 많은 대사와 영사관을 러시아 연방국에 파견합시다."
 FIN_ease_the_border_tensions: "국경 분쟁의 여지 제거"
 FIN_ease_the_border_tensions_desc: "핀란드-러시아 국경에서 각 나라의 몇 km는 서로서로 제한구역인 상태입니다. 국경 분쟁의 여지를 없애기 위해 이 조약을 수정할 수도 있을 것입니다."
 FIN_join_csto: "CSTO 가입"
 FIN_join_csto_desc: "자국과 러시아와의 조성된 긴장으로 우리는 CSTO의 가입을 거절할 수도 있습니다."
 FIN_csto_for_finnish_territories: "CSTO for Money"
 FIN_csto_for_finnish_territories_desc: "The deal is simple: Russia gives us money, we join their little club."
 FIN_befriend_belarus: "벨라루스와의 친교"
 FIN_befriend_belarus_desc: "벨라루스는 같은 회원국으로, 두 국가 간에 친교를 맺는 것이 좋을 것입니다."
 FIN_import_russian_equipment: "러시아 장비 수입"
 FIN_import_russian_equipment_desc: "놀랍게도 러시아는 사실상 수락했습니다. 이제 저들의 뛰어난(어느정도 낡았지만) 창고의 장비를 사용할 수 있게 되었습니다."
 FIN_plan_b: "두번째 계획"
 FIN_plan_b_desc: "러시아는 우리의 제안을 거절했습니다. 그렇기에 겨울 전쟁 이전의 국경선으로 회귀하도록 진로를 바꿀 때입니다."
 FIN_befriend_kazakhstan: "카자흐스탄과 친교"
 FIN_befriend_kazakhstan_desc: "카자흐스탄은 세계에서 가장 뛰어난 나라입니다. 모든 다른 나라는 이제 뛰어다니는 작은 여자아이에 불과합니다."
 FIN_border_security: "국경 안보"
 FIN_border_security_desc: "자주권과 국경 안보를 반드시 지켜야 합니다. 국가 방위가 그 첫번째입니다."
 FIN_claim_the_borders_of_1938: "1938년 국경선 요구"
 FIN_claim_the_borders_of_1938_desc: "Petsamo, Salla, and Karjala will finally be added back to the fold!"
 FIN_claim_kola: "콜라 요구"
 FIN_claim_kola_desc: "콜라는 단 한번도 핀란드 땅이었던 적이 없지만, 전략적으로 국가의 생존을 위해서 중요한 지역입니다."
 FIN_claim_eastern_karelia: "동카렐리야 요구"
 FIN_claim_eastern_karelia_desc: "역사적으로 러시아는 핀란드을 적대하고 공격을 가할 것입니다. 우리가 그랬던 것처럼 우리나라를 자신들의 영토로 편입시킬 것입니다."
 FIN_david_against_goliath: "다윗과 골리앗"
 FIN_david_against_goliath_desc: "역사의 잘못된 점을 고치기 위해서는 혼자서라도 나아갈 것입니다. 이는 다윗과 골리앗 이야기와 같은 것으로, 다윗이 이기듯이 우리들도 이길 것입니다."
 FIN_border_security_TT: "모든 국경 지역에 2레벨 §Y지상 요새§!를 건설"
 Finland.1.t: "징병제 개혁"
 Finland.1.d: "핀란드 군은 핀란드 주권에 대한 주된 위협이었던 소련이 사라진 후에도 징병법을 굳건히 고수해 왔습니다. 오늘날 핀란드의 징병법은 구시대적으로 보이는데, 남성과 여성이 누가 민간 복무 또는 군 복무를 하는지, 얼마나 오래 하는지, 복무를 거부하면 어떤 처벌을 받는지에 있어 동등하게 대우받지 않기 때문입니다.\n\n일부는 징병제를 폐지하고 그 돈과 풀려난 인력이 민간 경제에 이익이 되게 해야 한다고 주장합니다. 보다 보수적인 사상가들은 러시아 연방을 '덜 붉은 소련'으로 지적하며, 러시아가 세계적 야망을 되살리려는 의지가 있을 수 있어 핀란드의 독립에 매우 실질적인 위협이 된다고 봅니다."
 Finland.1.a: "현 상태로 충분하다."
 Finland.1.b: "징병제는 비용이 많이 들고 쓸모없다. 폐지하라."
 Finland.1.c: "모든 남녀가 군인이다!"
 Finland.2.t: "목재 수출 정책"
 Finland.2.d: "목재는 핀란드의 가장 중요한 천연자원 중 하나입니다. 핀란드의 나무는 품질이 높아 국제적으로 상당히 선호되지만, 벌목 속도에 관한 현재 정책은 현실적입니까?"
 Finland.2.a: "생산을 극대화하라."
 Finland.2.b: "장기적 접근이 더 타당하다."
 Finland.3.t: "재무부 확대"
 Finland.3.d: "핀란드 재무부인 발티오바라인미니스테리외는 언제나 정치적 논쟁의 중요한 부분입니다. 예산 위원회는 어떻게 운영되어야 합니까? 국가 공무원들의 급여는 어떻게 지급됩니까? 정부의 경제 및 재정 정책은 어떻게 형성되어야 하며, 선택한 방식은 타당합니까?"
 Finland.3.a: "투자가 답이다!"
 Finland.3.b: "불간섭 접근이 바람직하다."
 Finland.4.t: "경제 교리"
 Finland.4.d: "새로운 천년은 핀란드 기업과 사업체에 매우 부담스러운 시기가 될 것이며, 핀란드 정부는 국내의 고용과 번영을 확보하기 위해 장기 전략을 제대로 준비해야 합니다."
 Finland.4.a: "핀란드의 돈은 핀란드에 두는 것이 바람직하다."
 Finland.4.b: "EU와의 무역이 해답이다."
 Finland.5.t: "외교 정책 교리"
 Finland.5.d: "핀란드는 세계 지도에서 항상 위태로운 위치에 있었으며, 한쪽의 러시아와 다른 쪽의 러시아를 멀리하려는 나라들 사이에 끼어 있습니다. 핀란드의 외교 정책은 무도회장에서 말쑥하게 차려입은 남자들의 게임이 아니라 국가 생존의 문제입니다. 핀란드는 러시아를 향한 NATO 진격의 체스판이 되어서도 안 되고, 러시아의 주가 되어서도 안 됩니다."
 Finland.5.a: "세계는 균형 속에 있으며 그 균형은 유지되어야 한다."
 Finland.5.b: "정부는 추가 외교관을 채용해야 한다."
 Finland.6.t: "군사 정책"
 Finland.6.d: "러시아 침공의 가능성은 핀란드 정치에서 정책을 규정하는 핵심 사안 중 하나입니다. 우리 국방부인 푸올루스투스미니스테리외는 (유사한 다른 많은 정부 기관과 달리) 실제로 나라의 생존을 책임지고 있으며, 어디로 나아가야 하는지에 관한 확고한 지침이 필요합니다."
 Finland.6.a: "육군이 가장 중요하다."
 Finland.6.b: "실험해 보자."
 Finland.7.t: "핀란드 군주제"
 Finland.7.d: "프레데리크 카알레 1세는 1918년 핀란드의 왕이 될 뻔한 헤센카셀 출신 독일 왕자 프리드리히 카를의 핀란드식 이름입니다. 그의 후손들은 우리 정부가 베를린의 제국 정부에 우호적인 독일 군주제를 수립하려는 계획을 발표했을 때 나서기를 상당히 꺼렸는데, 주된 이유는 이 구상이 핀란드 대중 사이에서 얼마나 인기가 없는지 때문이었습니다.\n\n마침내 프리드리히 카를의 증손이자 이탈리아의 비토리오 에마누엘레 3세의 증손이기도 한 도나투스 필리프 움베르토가 나서서 핀란드 정부에 자신을 하나의 선택지로 내세웠습니다.\n\n그는 잘 해낼 것입니다. 그러나 그의 역할은 아직 정해지지 않았습니다."
 Finland.7.a: "그가 핀란드를 이끌어야 한다!"
 Finland.7.b: "그는 우리의 입헌 군주가 될 것이다."
 Finland.8.t: "핀란드, CSTO 가입을 제안 - 대가를 요구"
 Finland.8.d: "핀란드는 지난 몇 년, 특히 최근 몇 달 동안 자발적으로 러시아에 우호와 지원의 자세로 접근해 왔으며, 상트페테르부르크와 헬싱키에 핀란드-러시아 친선 모임이 결성되었으나 핀란드인들은 다른 계획이 있는 듯합니다.\n\n그들은 막대한 금액을 요구하고 있으며, 사실상 자신들의 충성을 팔고 있습니다."
 Finland.8.a: "수락한다."
 Finland.8.b: "코웃음을 친다."
 Finland.9.t: "핀란드, 상호 방위 협정을 제안"
 Finland.9.d: "핀란드와 스웨덴은 중립을 유지하려는 노력으로 연결되어 있습니다. 핀란드 정부는 쌍방 독립 보장을 통해 우리의 상호 이익과 양국 관계를 공식화하자는 제안을 가지고 우리에게 접근했습니다. 훌륭한 구상입니다. 동맹이지만 동맹이 아니고, 그러면서도 사실상 동맹입니다."
 Finland.9.a: "좋은 생각이다!"
 Finland.9.b: "아니, 괜찮다"
 finland_focus: "핀란드 중점 계통도"
 FIN_paavo_lipponen_desc: "파보 리포넨은 1995년부터 핀란드 총리를 지내 왔습니다. 그는 거의 평생을 사회민주당의 일원으로 보냈으며, 당의 외교 정책 입장을 개혁한 핵심 인물 중 한 명입니다. 총리 재임 중 가장 큰 업적은 핀란드를 90년대 초 경제 붕괴에서 끌어내고 유로 도입을 위해 나라를 준비시킨 것입니다. 일부는 리포넨이 토니 블레어의 정책과 유사한 신자유주의 경제 정책을 시행하면서 사회민주당을 지나치게 우경화시켰다고 비판했습니다."
 FIN_hjallis_harkimo_desc: "해리 '얄리스' 하르키모는 핀란드에서 가장 잘 알려진 사업가 중 한 명입니다. 라디오 방송국을 소유하고 부동산 개발을 하기도 했지만, 요케릿 하키 팀의 대주주로 가장 유명합니다. 그는 핀란드판 '디 어프렌티스'의 얼굴이기도 합니다. 젊은 시절 하르키모는 올림픽 수준의 요트 경기에 출전했으며, BOC 챌린지의 일부로 세계 일주 요트 경주에 참가한 최초의 핀란드인이었습니다. 하르키모는 국민연합당의 당원으로 정치 경력을 시작했으나, 당에서 가장 인기 있는 후보 중 하나였음에도 장관직을 받지 못한 데 실망하여 자신의 정당을 창당하기로 결심했습니다. 하르키모의 지금 운동당은 뚜렷한 이념 없이 주로 그 자신의 인물됨을 중심으로 합니다."
 FIN_bjarne_kallis_desc: "비아르네 칼리스는 기독교민주당에 결정적인 전환점을 가져왔습니다. 그가 당대표로 선출되기 전에 이 정당은 강하게 유럽회의주의적이었습니다. 그러나 칼리스의 지도 아래 이 정당은 더 친 EU, 친 NATO 성향으로 바뀌었습니다. 칼리스는 또한 정치와 종교를 분리하도록 당을 개혁했습니다. 정치에 입문하기 전 칼리스는 핀레일에서 짧게 일했고, 여러 학교에서 교사와 교장으로 근무했습니다. 그는 스웨덴 국민당에서 정치 경력을 시작했으나 신앙을 찾은 후 기독교민주당에 합류했습니다."
 FIN_helene_auramo_desc: "헬레네 아우라모는 사업가이자 스타트업 콘퍼런스 슬러시의 공동 창립자 중 한 명입니다. 그녀는 여러 회사에서 경영직으로도 일했습니다. 아우라모는 얄리스 하르키모와 함께 지금 운동당을 시작한 사람들 중 하나였습니다."
 FIN_jethro_rostedt_desc: "예트로 로스테트는 본인의 말에 따르면 '타고난 세일즈맨'입니다. 컵 스카우트 시절에는 다른 아이들보다 더 많은 달력을 팔았습니다. 십 대에는 어머니가 화장품을 파는 것을 도왔습니다. 부동산 중개업체에 들어간 뒤 불과 6년 만에 회사의 소유주가 되었습니다. 그는 핀란드판 '디 어프렌티스'를 통해 핀란드 대중에게 알려졌고, 불과 몇 년 뒤에는 자신을 중심으로 한 여러 TV 프로그램에 출연했습니다."
 FIN_paivi_rasanen_desc: "파이비 라사넨은 평생 대부분을 리이히매키 병원의 의사로 일했습니다. 의사로 재직하면서 낙태 같은 도덕적 문제와 씨름해야 했고, 90년대 초의 사회와 실업이 사람들에게 미친 영향을 본 뒤 정치에 입문하기로 결심했습니다. 라사넨은 당의 전임자들보다 더 종교적인 인물로 여겨졌으며, 당을 성경에 더 부합하도록 이끌었습니다."
 FIN_sari_essayah_desc: "사리 에사야는 경보 선수 출신의 정치인입니다. 유럽 연합에서 일하는 동안 다양한 발표와 구상에 적극적으로 제안을 내는 것으로 이름을 알렸습니다. 기독교민주당의 대표 자리에 올랐을 때, 그녀는 당을 독일의 CDU에 견줄 만한 정당으로 만들고 싶다고 말했습니다. 특히 핀란드가 경제 면에서 북유럽 이웃 국가들에 뒤처졌다고 느껴 핀란드의 노동 시장을 개혁하고자 합니다."
 FIN_mika_poutala_desc: "미카 포우탈라는 스피드스케이팅 선수 출신으로 선수 경력을 마친 후 기독교민주당에 합류했습니다. 포우탈라는 오순절교도이며 본인의 말에 따르면 매일 성경을 읽습니다. 포우탈라는 '플라스틱'이라는 가명으로 기독교 랩을 하기도 했습니다."
 FIN_sauli_niinisto_desc: "사울리 니니스퇴는 변호사와 렌스만으로 일하다가 1976년 국민연합당에 입당하여 살로 시의회에 선출되었습니다. 1987년 (세 번째 도전 끝에) 마침내 핀란드 의회에 입성했으며, 당시 동료 다수는 그를 '전형적인 단임 의원'이라고 평했습니다. 그러나 니니스퇴는 곧 당 안팎에서 매우 큰 인기를 얻었습니다. 90년대에는 법무장관과 재무장관을 모두 역임했으며, 후자에서는 긴축 정책으로 유명해졌습니다. 니니스퇴는 정직하고 소탈한 태도 덕분에 핀란드에서 가장 인기 있는 정치인 중 한 명이 되었습니다."
 FIN_ville_itala_desc: "빌레 이탈라는 1985년 투르쿠 시의회에 들어가기 전에는 변호사였습니다. 1995년 의회에 입성했고 내무장관을 지냈으며 의회 헌법위원회에서도 적극적으로 활동했습니다. 이탈라는 시민권 관련 여러 위원회와 단체에 참여한 것으로 알려졌습니다."
 FIN_alexander_stubb_desc: "알렉산데르 스투브는 외교의 베테랑입니다. 그는 사우스캐롤라이나의 퍼먼 대학교, 파리의 소르본 대학교, 브뤼허의 유럽 대학, 런던 정치경제대학교에서 국제 관계와 경제학을 공부했습니다. 정치에 입문하기 전 스투브는 워싱턴 D.C.의 핀란드 대사관, 핀란드 외무부, 핀란드 연구 위원회, 브뤼셀의 여러 EU 관련 직책에서 일했습니다. 스투브는 유럽 의회에서 정치 경력을 시작했습니다. 스투브는 차분하고 이성적인 화법과 세계의 정치적 현실에 대한 폭넓은 이해로 이름을 알렸습니다."
 FIN_petteri_orp_desc: "페테리 오르포는 투르쿠 대학교에서 사회과학 석사 학위를 받고 졸업한 직후 거의 곧바로 정치 경력을 시작했습니다. 그는 투르쿠 시의회, 국민연합당 지역 지부의 핵심 인물, 그리고 내무장관 빌레 이탈라의 특별 보좌관을 지냈습니다. 정치 경험이 풍부하지만, 때로 자신의 정치적 발언에 온전히 전념하지 않고 입장을 번복한다는 비판을 받았습니다."
 FIN_eero_heinaluoma_desc: "에로 헤이날루오마는 학교를 중퇴하고 창고, 기계 가공 공장 등 여기저기서 허드렛일을 했습니다. 1983년 SAK(핀란드 노동조합 중앙기구)에 가입하면서 마침내 자신의 천직을 찾았습니다. 그는 의회에 선출되어 사회민주당 대표가 되기 전까지 노동조합에서 일했습니다."
 FIN_jutta_urpilainen_desc: "유타 우르필라이넨은 사회민주당 소속 의원이 되기 전 헬싱키에서 교사였습니다. 우르필라이넨은 재무장관 자리에 올랐으며, 핀란드에서 그 직책을 맡은 최초의 여성이었습니다. 우르필라이넨은 러시아에 대한 더 강력하고 분명한 정책과 유럽 연합에 대한 더 강한 헌신을 바랐습니다. 또한 경제를 논할 때는 무엇이 옳고 합리적인가에 더 초점을 두어야 한다고 밝혔습니다."
 FIN_antti_rinne_desc: "안티 린네는 핀란드에서 가장 잘 알려진 노조 지도자로 묘사되어 왔습니다. 노조 지도자로서 그는 협상 전술로 파업 위협을 공격적으로, 그리고 자주 사용했고, 자신을 '노동 시장의 갱스터'라는 이미지로 구축했습니다. 그는 다른 노조들로부터 그의 공격적인 전술이 종종 기업 노조와 노동 노조 사이에 쐐기를 박는다는 비판을 받았습니다. 또한 정치권에서 협상할 때 '노조식 전술'을 쓴다는 비난도 받았습니다."
 FIN_sanna_marin_desc: "산나 마린은 의원 경력 이전에 탐페레 시의회에서 일한 베테랑 정치인입니다. 마린은 핀란드 역사상 최연소 총리가 되었으며, 독특하고 세련된 스타일로 알려지게 되었습니다. 그녀는 이전의 정치 지도자들과 달리 소셜 미디어에서도 매우 활발합니다. 마린은 북유럽 복지 모델의 지지자이며, 특히 교육과 연구가 핀란드의 생산성을 높이는 핵심 요소임을 강조해 왔습니다. 일부는 마린이 매우 실용적이라고 평했으며, 때때로 소셜 미디어를 이용해 정치적 주제에서 논의를 조작하고 주의를 돌린다는 비난을 받기도 했습니다."
 FIN_antti_lindtman_desc: "안티 린트만은 SAK(핀란드 노동조합 중앙기구)에 합류하기 전 시멘트 트럭 운전사로 일했습니다. SAK에서 사회민주당 당원이 되는 것은 자연스러운 수순이었고, 결국 당대표까지 올랐습니다. 린트만에게 스캔들이 없었던 것은 아닙니다. 그가 의장에게 모든 의원에게 평등한 참여 기회를 주기보다 논의 중인 주제에 대한 지식이 있는 의원에게 일부러 발언 순서를 주도록 지시한 것이 밝혀졌습니다. 또한 린트만이 18세였을 때 산타 모자만 쓴 친구들과 함께 장난감 총을 들고 나치식 경례를 하며 찍은 사진이 유출되기도 했습니다."
 FIN_hannu_harju_desc: "한누 하르유는 핀란드 공산당에서 경력을 시작한 핀란드 좌파 정치의 베테랑입니다. 정치 경력 이전에는 전기 기사로 일했습니다."
 FIN_mikko_vartiainen_desc: "미코 바르티아이넨은 핀란드의 변호사이자 마르크스주의 지지자입니다. 그의 핵심 목표 중 하나는 전화 및 전력 회사를 국유화하는 것입니다. 또한 핀란드가 NATO와의 공동 군사 훈련을 중단하고 EU를 탈퇴하며, 그렇게 절감한 자금으로 국민의 삶을 개선하기를 바랍니다. 바르티아이넨은 넬슨 만델라를 자신의 정치적 우상 중 한 사람으로 꼽습니다."
 FIN_hannu_tuominen_desc: "한누 투오미넨은 어린 시절부터 공산주의자였다고 밝혀 왔습니다. 그의 아버지는 공산주의자이자 독학한 마르크스-레닌주의자였으며, 그 영향이 결국 투오미넨에게도 이어졌습니다. 투오미넨은 자본주의가 초래한 피해를 목격하면서 자신의 신념이 더욱 굳어졌다고 말한 바 있습니다."
 FIN_paavo_vayrynen_desc: "파보 배위뤼넨은 이미 1970년에 국회의원으로 정치에 입문한 핀란드에서 가장 경험이 풍부한 정치인 중 한 명입니다. 그는 재임 중 여러 장관직을 지냈고, 중앙당을 이끌었으며, 핀란드가 여러 위기를 넘기는 과정을 지켜보았습니다. 핀란드 의회를 떠나 유럽 의회에 입성한 뒤(핀란드의 EU 및 유로 가입에는 반대했음에도 불구하고), 신진 인물들이 국내에서 인기를 얻기 시작하면서 그의 인기는 서서히 시들었습니다. 배위뤼넨은 결국 유럽 의회에서 돌아와 국내에서의 입지를 되찾으려 했습니다. 당대표 선거와 대통령 선거에서 잇따라 실패하고 장관직도 놓친 끝에, 배위뤼넨은 자신의 정당을 직접 창당하기로 결심했습니다. 배위뤼넨은 스스로를 중도좌파이자 농본주의자로 여기며, 주식 시장 거래세를 지지합니다. 그는 소련과 러시아의 행위를 비난하는 데 소극적이라는 비판을 받아 왔으며, 예를 들어 1991년 소련이 먼저 에스토니아를 승인하기 전에는 에스토니아의 독립을 인정하기를 거부했습니다."
 FIN_sami_kilpelainen_desc: "사미 킬펠래이넨은 농학자로, 핀란드 낙농업자들을 위해 국가 및 EU 차원에서 로비스트로 활동했습니다. 시골에서 자란 사람으로서 킬펠래이넨은 핀란드 농촌의 요구를 잘 이해하고 있다고 말해 왔습니다."
 FIN_ano_turtiainen_desc: "아노 투르티아이넨은 역도 선수이자 WPO 세계 기록 보유자입니다. 투르티아이넨은 진정한 핀란드인당에서 정치 경력을 시작했으나, 조지 플로이드를 공개적으로 조롱하고(소셜 미디어에서의 다른 부적절한 행동과 더불어) 당에서 제명되었습니다. 이 일을 계기로 그는 자신의 정당인 '권력은 국민에게'를 창당했습니다. 투르티아이넨은 수많은 음모론을 믿으며 이를 적극적으로 퍼뜨립니다. 그는 NASA가 지구가 평평하다는 진실을 숨기고 있으며, 이 기관이 몰래 개표를 맡아 핀란드 선거를 조작해 왔다고 주장했습니다. 또한 투르티아이넨은 러시아가 핀란드 일부를 점령하고 핀란드 선거에 개입해 자신의 정당이 집권하도록 도와주기를 바라며, 핀란드 국민이 제3차 세계 대전에 대비해야 한다고 말했습니다. 그는 폭행 3건(그중 한 건은 14세 소년을 겨냥한 것)과 핀란드 적십자사에 대한 선동을 포함해 여러 건의 형사 유죄 판결을 받았습니다."
 FIN_suvi_ahonen_desc: "수비 아호넨은 간호사이자 핀란드의 유럽 연합 탈퇴를 목표로 하는 픽싯 운동의 창립자입니다."
 FIN_ilkka_tiainen_desc: "일카 티아이넨은 중앙당에서 '권력은 국민에게'당으로 옮겨 갔습니다. 그는 러시아 선전, 백신 반대 담론, 그 밖의 음모론을 퍼뜨리는 프로그램을 방송하는 포시 TV 채널의 진행자로 잘 알려져 있습니다."
 FIN_timo_lahtinen_desc: "티모 라흐티넨은 오랫동안 자연법의 원리를 따라 온 인물입니다. 그는 서구식 민주주의가 사람들의 모든 필요를 충족시키지도, 모든 사회 문제를 막지도 못한다고 믿습니다. 자연법에 기초한 정부가 필요하다는 것입니다. 라흐티넨은 베다에 기반한 의료 제도를 도입하고, 자연법에 따라 주택을 다시 짓고, 유전자 변형 작물(GMO)을 금지하며, 교육에서 외적 지식과 더불어 내적 지식의 탐구를 도입하고자 합니다. 라흐티넨은 또한 공인 요가 비행사이기도 합니다."
 FIN_wojtek_skalski_desc: "보이테크 스칼스키는 폴란드에서 태어났으나 1971년 핀란드로 이주했습니다. 스칼스키는 세상의 모든 문제가 자연에 순응하고 스스로를 탐구하여 자연법의 지혜를 발견하는 것만으로 해결될 수 있다고 믿습니다. 스칼스키는 또한 경제적인 건축과 고대인들의 건물이 어떻게 자연과 조화를 이루었는지에도 관심이 있습니다."
 FIN_esko_aho_desc: "에스코 아호는 핀란드 경기 침체 직후인 1991년부터 1995년까지 정부를 이끌었습니다. 이 불황으로 중앙당이 집권당의 자리에 올랐으며, 일부 당원은 이를 '심장이 멎을 듯한 선거 승리'라고 평했습니다. 중앙당은 1995년 선거에서 사회민주당에 패했는데, 이는 나라를 불황에서 건져 내기 위해 필요했던 재정 정책 때문일 가능성이 큽니다. 선거 패배에도 불구하고 아호는 당 지도부 자리에서 물러나지 않았습니다."
 FIN_anneli_jaatteenmaki_desc: "안넬리 예떼엔매키는 1987년부터 국회의원이었으며 90년대에 잠시 법무부 장관을 지냈습니다."
 FIN_matti_vanhanen_desc: "마티 반하넨은 80년대 후반 반타의 신문사에서 기자 겸 편집장으로 일했으며, 이후 누르미예르비 시의회에 선출되었습니다. 반하넨은 1991년 국회에 입성했고, 중앙당 내에서 보다 자유주의적이고 녹색 성향을 띤 계파를 대표했습니다. 반하넨은 지역 정책의 강력한 지지자이며 핀란드 전역에 사람이 계속 거주할 수 있기를 바랍니다."
 FIN_mari_kiviniemi_desc: "마리 키비니에미는 거의 평생을 정치인으로 살아왔습니다. 키비니에미는 모피 사육, 연금 개혁, 그리고 핀란드 동부에서 스웨덴어 대신 러시아어를 대체 외국어로 배울 수 있도록 하는 방안을 지지합니다."
 FIN_juha_sipila_desc: "유하 시필래는 자신이 대표이사를 맡았던 솔리트라 사의 일부를 인수하며 사업가 경력을 시작했습니다. 시필래는 (일부 국영이던) 라우타루키 사에서 돈을 빌려 솔리트라의 지분을 사들였습니다. 2년 뒤 회사가 미국 기업에 매각되면서 시필래는 오울루 지역 최초의 백만장자 중 한 명이 되었습니다. 그 후 시필래는 이 자금으로 새로운 회사를 세우고 신생 기업에 투자했습니다. 핀란드의 더딘 경제 성장을 해결하는 방안으로 시필래는 정부 보유 지분을 민간 투자자에게 매각하고, 그 자금을 성장하는 소규모 기업에 투자하자고 제안했습니다."
 FIN_altti_majava_desc: "알티 마자바는 헬싱키 대학과 예테보리 대학에서 사회과학을 공부한 뒤, 스톡홀름으로 이주하여 현지 대학에서 인구 관련 연구에 종사했습니다. 핀란드로 돌아온 뒤에는 여러 연구 기관에서 일했고, 20년 동안 노동부에서 근무했습니다."
 FIN_satu_hassi_desc: "사투 하시는 작가이자 시인입니다. 학업을 마친 뒤 탐펠라 사에서 설계 기사로 일했고, 이후 탐페레 공과대학에서 조교로 일했습니다. 그 뒤 작가로 전향하여 여러 권의 시집, 수필집, 그리고 물리 교과서를 출간했습니다. 하시는 1991년 녹색 연맹 소속으로 핀란드 의회에 입성했습니다. 국회의원으로서 여러 위원회에서 활동했습니다. 하시는 정치인으로서 일하는 내내 평등, 인권, 환경, 에너지 문제를 항상 우선시해 왔습니다. 그는 원자력 발전에 반대합니다."
 FIN_osmo_soininvaara_desc: "오스모 소이닌바라는 베테랑 정치인입니다. 그는 1968년 자유 국민당에 입당하며 정치 경력을 시작했는데, 당시부터 이미 환경 문제에 강한 헌신을 보였습니다. 그는 환경을 위해 적극적으로 시위해 왔으며, 알려진 사례만 해도 최소 두 번 그로 인해 벌금을 부과받았습니다. 그는 녹색 경제 정책의 옹호자이며 환경 주제에 관한 책을 여러 권 집필했습니다."
 FIN_tarja_cronberg_desc: "젊은 시절 타르야 크론베르그는 핀란드 사회민주당과 스웨덴 사회민주당의 당원이었습니다. 그는 점차 녹색 가치에 관심을 갖게 되었고, 북카렐리야에서 방목 농업을 시작했습니다. 크론베르그는 또한 북카렐리야 지역 지도자와 코펜하겐 평화 연구소 소장으로도 일했습니다. 크론베르그는 자신이 시골 출신이기에 전통적으로 도시 중심이었던 녹색 연맹 당원들에 대한 좋은 균형추가 된다고 생각합니다."
 FIN_anni_sinnemaki_desc: "안니 신네매키는 꽤 힘든 십대 시절을 보냈습니다. 고등학교 재학 중 16세에 첫 아이를 낳았습니다. 그럼에도 불구하고 그는 또래들과 같은 시기에 좋은 성적으로 고등학교를 마쳤습니다. 이후 헬싱키 대학에서 문학을 공부했고, 시집 두 권을 펴냈으며, 밴드 울트라 브라의 노래 가사를 쓰기도 했습니다. 그는 1999년 국회에 입성했으며, 늘 녹색 정치에 관심이 있었다고 밝혔습니다. 그는 동성 결혼의 강력한 옹호자이며 원자력 에너지의 반대자입니다. 국회의원으로서 대외 원조 유지, 대중교통 지원, 산림 보호도 옹호해 왔습니다."
 FIN_ville_niinisto_desc: "빌레 니니스퇴는 스스로를 사회자유주의 녹색주의자라고 칭합니다. 녹색 연맹에 입당하기 전에는 주로 투르쿠 대학에서 연구원으로 일했습니다. 니니스퇴는 스스로를 페미니스트라고 설명하며, 남성에게는 더 부드러운 가치를 선택할 여지가 필요하고 여성에게는 직업 분야에서 더 많은 권리가 필요하다고 말합니다. 니니스퇴는 또한 모피 사육에 반대합니다. 니니스퇴는 국민연합당의 저명한 정치인 사울리 니니스퇴의 조카이기도 합니다."
 FIN_suvi_anne_siimes_desc: "수비안네 시이메스는 자신이 우연히 정치에 입문했다고 밝혔습니다. 그는 포흐야 마을의 지역 정치인의 권유로 들어와 좌파 동맹에 가입하게 되었습니다. 그는 당내 다수의 생각과 달리 지출 삭감과 증세의 필요성을 이야기하면서 당에서 큰 주목을 받았습니다. 이 일로 그는 1998년 당 대표 자리에 올랐습니다. 그는 NATO를 핀란드의 가능한 미래로 보는 반면 당 다수는 비동맹을 원했기 때문에 당내에서 많은 마찰을 일으켰습니다."
 FIN_paavo_arhinmaki_desc: "파보 아르힌매키는 평생을 정치인으로 살아왔습니다. 아르힌매키는 이른바 '적록' 정치와 민주사회주의의 열렬한 추종자로 평가받으며, 당을 같은 방향으로 개혁하는 것을 목표로 합니다. 그는 때로 자신에게 불리하더라도 자기 생각을 거리낌 없이 말하는 사람으로 알려져 있습니다. 아르힌매키는 또한 열성적인 축구 팬입니다."
 FIN_li_andersson_desc: "리 안데르손은 국제 사법을 공부했고, 좌파 동맹에 합류하기 전에 여러 정치 및 시민권 단체에서 일했습니다. 안데르손은 성중립적 징병제를 지지하며 주당 근무일을 나흘로 줄이자고 제안해 왔습니다. 안데르손은 스스로를 사회주의자이자 마르크스주의자라고 칭하며, 그가 가장 중시하는 가치는 자유입니다."
 FIN_minja_koskela_desc: "민야 코스켈라는 음악 박사 학위를 가지고 있으며 수년간 음악 교사로 일했습니다. 그는 바이올린과 피아노도 연주하며 밴드 팀 플레이의 리드 보컬입니다. 코스켈라는 교차 페미니즘의 지지자이며 여성 문제, 평등, 모성에 관한 책을 여러 권 집필했습니다."
 FIN_yrjo_hakanen_desc: "위리외 하카넨은 1990년부터 핀란드 공산당을 이끌어 온 장기 지도자로, 1970년대에 이미 입당했습니다. 하카넨은 당의 '타이스토파', 즉 친소련 공산주의자 중 한 사람입니다. 하카넨은 소련 공산당과 매우 긴밀한 관계를 유지했으나, 소련 붕괴 이후에는 많은 사회주의 국가의 중앙집권화와 국유화를 비판해 왔습니다. 그의 동료 공산주의자 상당수는 좌파 동맹이 창설되자 이에 합류했지만, 하카넨은 공산당을 온전히 유지하기로 결정했습니다."
 FIN_juha_pekka_vaisanen_desc: "유하페카 배이새넨은 1989년 미술 아카데미를 졸업했으며 스스로를 개념 미술가라고 칭합니다. 그는 미술 교사, 우편 배달부, 텔레마케터, 기자 등 다양한 직업을 거쳤습니다. 또한 PAND - 평화를 위한 예술가들 단체의 의장을 지냈습니다."
 FIN_liisa_taskinen_desc: "리이사 타스키넨은 레닌그라드에서 의사가 되기 위해 공부했으며, 졸업 이후 줄곧 의사로 일해 왔습니다. 또한 앙골라에서 1년간 나미비아 난민 수용소에서 근무했습니다. 그는 은퇴 직후 공산당의 대표가 되었습니다."
 FIN_timo_soini_desc: "티모 소이니는 1979년 16세의 나이로 핀란드 농촌당에 입당했습니다. 그는 1992년 당 사무총장이 되기 전까지 당 청년 연맹의 지도자였습니다. 소이니는 스스로 '핀란드 민족 포퓰리즘'이라고 부른 당의 새로운 정책 방향을 정립한 주요 인물 중 한 명이었습니다. 불과 3년 뒤 당은 파산했습니다. 이후 소이니와 다른 당원들은 진정한 핀란드인당을 창당했고, 소이니는 1997년 이 당의 지도부를 장악했습니다. 소이니는 스스로를 핀란드의 몇 안 되는 '공화주의자' 중 한 명이라고 설명해 왔으나, 경제적으로는 때때로 민주당에 더 가까웠습니다. 소이니는 또한 가톨릭 신자인데, 핀란드 대부분이 루터교인 것과 대비됩니다. 그는 루터교 내에서는 여성 사제직에 반대할 수 없다고 느꼈고, 루터교회가 종교 문제에 있어서는 '물러터지게' 행동한다고 생각하여 가톨릭으로 개종했습니다. 야당 시절 소이니는 '사과와 멜론에는 같은 모자가 맞지 않는다', 'EU가 있는 곳에는 문제도 있다' 같은 관용구로 유명해졌습니다."
 FIN_jussi_halla_aho_desc: "유시 할라아호는 스크립타라는 인터넷 블로그를 운영하며 핀란드에서 이름을 알렸습니다. 이 블로그는 핀란드의 이민 정책과 다문화주의를 다루었습니다. 같은 시기에 할라아호는 웨이터로, 키이우 주재 핀란드 대사관의 직원으로(그곳에서 우크라이나어도 익혔습니다), 그리고 헬싱키 대학의 고대 슬라브어 연구자 겸 강사로 일했습니다. 대학에서 근무하는 동안 할라아호는 블로그와 관련하여 여러 차례 경고를 받았습니다. 할라아호는 결국 진정한 핀란드인당에 합류하여 당 대표가 되었습니다. 할라아호는 핀란드 이민 정책에 대한 비판과 이슬람 반대로 가장 널리 알려졌습니다. 할라아호는 온라인 글로 인해 여러 차례 수사를 받았으며, 그는 이 글들을 스스로 '때로는 공격적이고 과장되어 있어서 독자가 해석할 여지가 많이 남는다'고 설명했습니다. 논란이 되는 글에도 불구하고, 인터뷰와 재판 심리, 연설에서 보여 준 침착하고 논리적인 태도는 그가 대중의 지지를 모으는 데 도움이 되었습니다."
 FIN_riikka_purra_desc: "리이카 푸라는 늘 정치에 관심이 있었으며 젊은 시절에는 녹색 연맹을 지지했습니다. 그러나 유시 할라아호의 반이민 블로그 스크립타를 접한 이후 점차 진정한 핀란드인당과 가까워졌습니다. 그럼에도 여전히 환경을 의식하는 생각을 유지하고 있으며, 자신이 '소비에 비판적'이라고 밝혔습니다. 푸라는 재정적으로 보수적이며 정부 지출을 줄이고 싶다고 밝혔습니다."
 FIN_vaino_kuisma_desc: "배이뇌 쿠이스마는 교사이자 민족 전선 신문의 기자입니다. 쿠이스마는 아리아 독일 형제단을 창설했으며 네오나치 페카 시이토인의 가까운 동료였습니다. 쿠이스마는 반EU, 반미, 반에스토니아, 반러시아를 표방하며, 핀란드 고대 종교와 신화에서 영감을 얻은 핀란드 민족주의의 한 형태인 '칼레발라 민족주의'의 지지자입니다."
 FIN_olavi_maenpaa_desc: "올라비 매엔패는 사회민주당에 입당하기 전에 소련 점령하의 에스토니아에서 다양한 건설 업무에 종사했습니다. 이후 핀란드 농촌당으로 옮겼으나 다른 당원들과의 불화로 1986년 제명되었습니다. 그는 몇 년 동안 무소속으로 정치 활동을 하다가 핀란드 국민의 청백당을 창당했습니다. 매엔패는 70~80년대에 폭행과 음주 운전으로 여러 차례 유죄 판결을 받았으며, 이는 그의 공직 활동에 문제를 일으켰습니다. 그는 또한 스킨헤드 집단과 함께 축구장에 반소말리아 표지판을 세워 인종 집단에 대한 선동죄로 유죄 판결을 받았습니다."
 FIN_matti_jarviharju_desc: "마티 예르비하르유는 선장이자 평화유지군입니다. 에스토니아가 독립하던 시기에 예르비하르유는 새로 창설된 에스토니아 경찰에 보낼 자금과 차량을 조달했습니다. 예르비하르유 소유의 재산은 두 차례 폭발물 공격을 받았으며, 예르비하르유는 이것이 자신을 노린 암살 시도였다고 주장했습니다."
 FIN_gustav_hagglund_desc: "구스타프 헤글룬드 휘하에서 핀란드 국방군은 여러 차례 개혁을 거쳤습니다. 해안 포대와 예거 부대가 해군의 통제 아래 들어갔고, 공군은 단 한 기종의 전투기 운용에 노력을 집중했으며, 육군의 정찰 능력이 향상되었습니다. 헤글룬드는 제2차 세계 대전 이후 점령당한 국가들이 '군사적으로 쓰레기'이며 핀란드인은 그들과 같은 처지라고 느껴서는 안 된다고 발언하여 화제가 되었습니다. 이는 특히 에스토니아에 대한 모욕으로 받아들여졌습니다."
 FIN_juhani_kaskeala_desc: "유하니 카스케알라는 핀란드 해군의 제독입니다. 그가 국방 사령관을 맡는 동안 핀란드는 해외 분쟁에 더 적극적으로 참여했습니다."
 FIN_ari_puheloinen_desc: "아리 푸헬로이넨은 가문에 군 경력이 전혀 없었다는 점에서 이례적인 장군입니다. 그는 모스크바에서 훈련의 일부를 받았으며 그곳에서 기계화 보병의 기초를 익혔습니다. 러시아어에 대한 지식과 러시아 정치에 대한 이해 덕분에 그의 군 보직 상당수는 핀란드 동부에 집중되었습니다. 그는 발트 지역에서의 러시아의 지정학적 이해관계에 대해서도 글을 쓴 바 있습니다."
 FIN_moritz_von_hessen_desc: "마우리 1세(본명 모리츠 프리드리히 카를 에마누엘 훔베르트 폰 헤센)는 1980년 부친 필리프가 사망하면서 헤센 가문의 수장이 되었습니다. 모리츠 국왕은 열렬한 미술품 수집가입니다."
 FIN_mafalda_von_hessen_desc: "마팔다 1세(본명 마팔다 폰 헤센)는 부친의 뒤를 이어 핀란드의 여왕이 되기 전에 패션 디자이너로 일했습니다."
 FIN_king_donatus: "핀란드의 도나투스 국왕"
 FIN_king_donatus_desc: "핀란드 정부가 독일 출신 핀란드 국왕의 왕좌를 복원했을 때, 도나투스가 핀란드 국민의 입헌 군주로 선택되었습니다. 처음에는 인기가 없었지만, 현재 헬싱키에 거주하는 도나투스는 핀란드어를 배우기 위해 열심히 노력하고 있으며 여전히 경제학자로 일하며 생계를 유지하여 스스로를 국민의 군주로 내세우고 있습니다. 그의 헌신과 진솔한 기쁨이 핀란드 국민의 마음을 서서히 얻고 있습니다."
 FIN_conscription: "핀란드 징병제"
 FIN_conscription_desc: "핀란드의 징병제는 1950년대 초반부터 시행되어 왔습니다. 많은 사람들은 이를 구시대적이고 쓸모없는 제도로 봅니다. 그러나 핀란드가 국내외 어떤 세력에게든 위협받는 상황이 오면, 우리는 훈련받은 다수의 군 전문가, 혹은 최소한 약간의 훈련을 받은 민간인 인력을 동원할 수 있습니다."
 Finland.300.t: "21세기 전환기의 노키아"
 Finland.300.d: "노키아는 세계 어떤 기업보다 많은 휴대전화를 판매하고 있으며, 핀란드 수출 수입의 3분의 1이 이제 한 기업에 달려 있습니다. 이러한 집중도는 선두를 지키는 동안 더욱 밀어붙일 수도 있고, 선두가 끝나기 전에 더 넓은 기술 기반으로 분산할 수도 있습니다."
 Finland.300.a: "선두를 유지하는 동안 휴대전화에 집중한다"
 Finland.300.b: "기술 기반 전반으로 투자를 분산한다"
 Finland.301.t: "지멘스와의 네트워크 합작 사업"
 Finland.301.d: "노키아의 네트워크 장비 부문을 독일 파트너와의 합작 사업으로 통합하면 단독 경영권을 내어주는 대신 에릭슨 및 화웨이에 맞설 규모를 두 배로 키울 수 있습니다. 독립을 유지하면 의사 결정은 에스포에 남지만 수익률은 더 낮아집니다."
 Finland.301.a: "네트워크 부문을 합작 사업에 통합한다"
 Finland.301.b: "네트워크 사업을 독립적으로 유지한다"
 Finland.302.t: "스마트폰 플랫폼 결정"
 Finland.302.d: "심비안은 재건되는 속도보다 더 빠르게 iOS와 안드로이드에 밀리고 있습니다. 노키아는 파트너의 플랫폼을 채택하여 내년에 시장에 진입할 수도 있고, 시간과 자금을 들여 자체 시스템을 완성하되 이미 닫혔을지도 모르는 시장에 뒤늦게 도착할 수도 있습니다."
 Finland.302.a: "파트너의 플랫폼을 채택한다"
 Finland.302.b: "자체 플랫폼을 완성한다"
 Finland.303.t: "마이크로소프트의 기기 및 서비스 부문 인수 제안"
 Finland.303.d: "마이크로소프트가 휴대전화 사업 전체를 인수하겠다고 제안했습니다. 매각하면 노키아를 유명하게 만든 제품에서 철수하게 되며, 자금이 풍부한 네트워크 기업만 남게 됩니다. 거절하면 휴대전화 사업과 그에 따른 손실을 계속 안고 가게 됩니다."
 Finland.303.a: "휴대전화 사업을 매각한다"
 Finland.303.b: "우리 휴대전화를 계속 만든다"
 Finland.304.t: "유럽의 네트워크 대표 기업"
 Finland.304.d: "노키아는 알카텔-루슨트를 인수할 수 있으며, 이를 통해 화웨이와 에릭슨에 맞서는 데 필요한 규모, 유선 통신 사업, 연구소를 확보할 수 있습니다. 대가는 노키아에 남은 자산의 대부분입니다. 대안은 규모를 작게 유지하며 특허 포트폴리오로 먹고 사는 것입니다."
 Finland.304.a: "알카텔-루슨트를 인수한다"
 Finland.304.b: "규모를 작게 유지하고 포트폴리오를 라이선스한다"
 Finland.305.t: "노키아가 된 모습"
 Finland.305.d: "사반세기에 걸친 지배, 몰락, 재건을 거쳐 노키아의 정체성이 정해졌습니다. 이제 세계 기술계에서 핀란드의 위상은 회사가 처음 출발한 모습이 아니라 최종적으로 도달한 모습에 달려 있습니다."
 Finland.305.a: "세계가 신뢰하는 네트워크"
 Finland.305.b: "여전히 기기와 네트워크를 모두 만드는 그룹"
 Finland.305.c: "특허 및 연구 전문 기업"
 Finland.305.e: "개방형 모바일 공동체"
 FIN_nokia_trusted_network_state: "신뢰받는 네트워크 국가"
 FIN_nokia_trusted_network_state_desc: "핀란드는 휴대전화를 팔고 인프라를 사들였으며, 그 결과 대안이 정치적 위험을 수반할 때 통신사들이 선택하는 기업이 되었습니다. 신뢰받는 선택지가 되는 것이 가장 저렴한 선택지가 되는 것보다 더 큰 가치가 있습니다."
 FIN_nokia_integrated_device_network_group: "통합 기기 및 네트워크 그룹"
 FIN_nokia_integrated_device_network_group_desc: "노키아는 매각을 주장하는 모든 분기를 거치면서도 휴대전화 사업을 유지했습니다. 기기와 네트워크를 함께 짊어지면 수익률이 떨어지지만, 출시되는 어떤 제품도 나머지 절반 없이 설계되지 않습니다."
 FIN_nokia_patent_research_house: "특허 및 연구 전문 기업"
 FIN_nokia_patent_research_house_desc: "공장은 떠났지만 연구소는 남았습니다. 노키아는 공장에서 생산하는 것이 아니라 연구자들이 발명한 것으로 수익을 올리며, 작은 나라가 그 수익으로 대규모 연구 기반을 지탱합니다."
 FIN_nokia_open_mobile_commonwealth: "개방형 모바일 공동체"
 FIN_nokia_open_mobile_commonwealth_desc: "핀란드는 자체 플랫폼을 완성한 뒤 이를 방어하는 대신 개방했습니다. 설치 기반은 거대 기업들보다 작지만 외국 라이선스 제공자에게 종속되지 않으며, 파트너들은 고객이 아니라 공동 소유주입니다."
