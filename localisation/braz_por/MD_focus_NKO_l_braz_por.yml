 NKO_export.10.a.tt:0 "Entrega §Yfuzis§! e §Yequipamento de comando§! suficientes para §Ytrês batalhões de infantaria leve§! (3× a exigência do batalhão)."
 NKO_export.10.c:0 "Solicitar um pacote de §YInfantaria Motorizada§!: fuzis, veículos utilitários e equipamento de comando"
 NKO_export.10.c.tt:0 "Entrega §Yfuzis§!, §Yveículos utilitários§! e §Yequipamento de comando§! suficientes para §Ytrês batalhões de infantaria motorizada§! (3× a exigência do batalhão)."
 NKO_export.10.e:0 "Solicitar um pacote §YBlindado§!: carros de combate principais e equipamento de comando"
 NKO_export.10.e.tt:0 "Entrega §Ycarros de combate principais§! e §Yequipamento de comando§! suficientes para §Ytrês batalhões blindados§! (3× a exigência do batalhão). Requer um projeto moderno de tanque norte-coreano."
 NKO_export.10.f:0 "Solicitar um pacote de §YInfantaria Mecanizada§!: IFVs, APCs, fuzis e equipamento de comando"
 NKO_export.10.f.tt:0 "Entrega §YIFVs§!, §YAPCs§!, §Yfuzis§! e §Yequipamento de comando§! suficientes para §Ytrês batalhões de infantaria mecanizada§! (3× a exigência do batalhão). Requer módulos modernos de veículos norte-coreanos."
 korea.50.b:0 "O Leste Asiático nunca mais será o mesmo."
 NKO_tank_facility_foundry_trait:0 "Fundição da Instalação de Tanques"
 NKO_second_economic_committee_trait:0 "Segundo Comitê Econômico"
 NKO_kim_jong_il_death_tt:0 "Kim Jong-il Está Morto"
 NKO_5_increase_kim_jong_un_tt:0 "O Apoio a Kim Jong-un §Yaumenta§! em 5%"
 NKO_5_decrease_kim_jong_nam_tt:0 "O Apoio a Kim Jong-nam §Ydiminui§! em 5%"
 NKO_korean_repair_frontline_workers_desc:0 "Sob o tratado de parceria de 2024, brigadas de trabalho norte-coreanas atuam na retaguarda dos distritos ocidentais da Rússia, reconstruindo pátios ferroviários, aeródromos, estaleiros e fábricas de armas. Pyongyang recebe em dinheiro e combustível pelas alocações."
 NKO_korean_repair_frontline_workers_sov_desc:0 "Milhares de trabalhadores foram enviados a canteiros de reconstrução russos sob contrato estatal. Seus salários retornam a Pyongyang em moeda forte, mas os homens vêm do mesmo contingente de onde o Exército Popular da Coreia recruta."
 NKO_korean_repair_civil_workers_desc:0 "Equipes de construção norte-coreanas são designadas à reconstrução civil em toda a Rússia, reparando fábricas, moradias e estradas. Moscou cobre sua manutenção e paga a Pyongyang pelo contrato."
 NKO_korean_repair_civil_workers_sov_desc:0 "Equipes de trabalho civil são alocadas a conglomerados de construção russos sob contrato estatal. As alocações rendem moeda forte no exterior ao custo de mão de obra em casa."
 NKO_korean_ratnik_conversion_desc:0 "O kit de infantaria Ratnik, fornecido pela Rússia, chega ao Exército Popular da Coreia: colete balístico, equipamento de carga, óptica e roupas para clima frio. O equipamento é uma melhoria acentuada em relação ao padrão nacional, e sua manutenção custa na mesma proporção."
