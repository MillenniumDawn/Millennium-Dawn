 econ_forum_program_view: "Program tracks and our sector prestige, up to three tracks:\nAI and Technology: [?econ_forum_view_prestige^0|0][econ_forum_track_mark_0]\nEnergy: [?econ_forum_view_prestige^1|0][econ_forum_track_mark_1]\nFinance: [?econ_forum_view_prestige^2|0][econ_forum_track_mark_2]\nDefense Industry: [?econ_forum_view_prestige^3|0][econ_forum_track_mark_3]\nInfrastructure and Trade: [?econ_forum_view_prestige^4|0][econ_forum_track_mark_4]\nDevelopment: [?econ_forum_view_prestige^5|0][econ_forum_track_mark_5]"
 econ_forum_track_on_program: " §G(on the program)§!"
 econ_forum_track_off_program: " (not on the program)"
 econ_forum_preparation_idle: "Preparations open two months before each summit."
 econ_forum_program_idle: "Program tracks are chosen during preparation."
 econ_forum_name_0: "World Economic Forum"
 econ_forum_name_1: "Visegrád Economic Conference"
 econ_forum_name_2: "St. Petersburg International Economic Forum"
 econ_forum_name_3: "Boao Forum for Asia"
 econ_forum_name_4: "Global South Economic Forum"
 econ_forum_name_5: "African Development Conference"
 econ_forum_name_6: "Arctic Economic Forum"
 econ_forum_name_7: "Transatlantic Technology Forum"
 econ_forum_name_8: "Independent Economic Forum"
 econ_forum_found_visegrad: "Found the Visegrád Economic Conference"
 econ_forum_found_visegrad_desc: "The Visegrád Group has a shared market of over 60 million people and no summit of its own. A yearly conference would bring governments and investors to Central Europe instead of sending our ministers to Davos."
 econ_forum_found_visegrad_tt: "We become host of the §YVisegrád Economic Conference§!, which starts with §Y15§! prestige and meets every September. Poland, Czechia, Hungary and Slovakia are always invited."
 econ_forum_found_boao: "Found the Boao Forum for Asia"
 econ_forum_found_boao_desc: "Asian governments and companies travel to Davos to talk about Asia. A forum on Hainan would let Asia set its own agenda, with China as its host."
 econ_forum_found_boao_tt: "We become host of the §YBoao Forum for Asia§!, which starts with §Y15§! prestige and meets every March. Every Asian nation is always invited."
 econ_forum_found_transatlantic: "Found the Transatlantic Technology Forum"
 econ_forum_found_transatlantic_desc: "The Atlantic alliance shares its security but not its technology policy. A forum on chips, finance and the defense industry would bind its economies as tightly as its armies."
 econ_forum_found_transatlantic_tt: "We become host of the §YTransatlantic Technology Forum§!, which starts with §Y15§! prestige and meets every April. Every NATO member is always invited."
 econ_forum_found_breakaway: "Found a Breakaway Forum"
 econ_forum_found_breakaway_desc: "The forum we boycott still claims to speak for the world economy. A summit of our own, built with the governments that stand with us, would put that claim to the test."
 econ_forum_found_breakaway_tt: "We become host of the §YIndependent Economic Forum§!. It starts with §Y15§! prestige plus §Y15%§! of the prestige of the most prestigious forum we boycott, which loses it, and half of that forum's standing in each sector. It meets six months after that forum, and every government in our faction is always invited."
 econ_forum_found_arctic: "Found the Arctic Economic Forum"
 econ_forum_found_arctic_desc: "Melting ice is opening new shipping lanes and resource fields. A forum for the Arctic states would decide who builds, drills and patrols there."
 econ_forum_found_arctic_tt: "We become host of the §YArctic Economic Forum§!, which starts with §Y15§! prestige and meets every October. Norway, Denmark, Iceland, Finland, Sweden, Canada, Russia and the United States are always invited."
 econ_forum_found_african: "Found the African Development Conference"
 econ_forum_found_african_desc: "Africa's governments and investors meet in other continents' capitals. A conference of our own would bring the money to Africa and put its priorities first."
 econ_forum_found_african_tt: "We become host of the §YAfrican Development Conference§!, which starts with §Y15§! prestige and meets every May. Every sub-Saharan nation is always invited."
 econ_forum_found_global_south: "Found the Global South Economic Forum"
 econ_forum_found_global_south_desc: "Developing economies are courted at summits run by the rich. A forum of our own would let the emerging powers set the agenda on infrastructure, energy and development."
 econ_forum_found_global_south_tt: "We become host of the §YGlobal South Economic Forum§!, which starts with §Y15§! prestige and meets every November. Every regional power with a GDP per capita under 20 is always invited."
 econ_forum_invite_government: "Invite [FROM.GetName]"
 econ_forum_invite_government_desc: "A personal invitation from our organizers carries more weight than a standing one."
 econ_forum_invite_government_tt: "[FROM.GetName] receives a personal invitation to our summit, which adds §G15§! to their chance of attending. Personal invitations close a month before the summit."
 econ_forum_preparing_tt: "Our economic forum is preparing its summit"
 econ_forum_personal_invitations_open_tt: "At least one personal invitation remains before the one-month cutoff"
 econ_forum_ceremony_available_tt: "Our state-led forum is preparing its summit and has fewer than three ceremonies. The invited government is at peace with us and has no ceremony booked."
 econ_forum_talks_available_tt: "Our forum is preparing its summit and has no sideline talks arranged. The invited government is at peace with us and has an eligible rival among the invitees."
 econ_forum_report_available_tt: "Our forum is preparing its summit, has at least 50 prestige, and has not favored a guest this cycle. The selected government is invited to this summit."
 econ_forum_room_available_tt: "Our forum is preparing its summit and has fewer than four private-room seats reserved. The invited government is at peace with us and has no private-room seat."
 econ_forum_plan_ceremony: "Arrange a Signing Ceremony with [FROM.GetName]"
 econ_forum_plan_ceremony_desc: "A summit is remembered for what is signed on its stage. An agreement with [FROM.GetName], announced before the cameras, would show that business gets done at our forum."
 econ_forum_plan_ceremony_tt: "If [FROM.GetName] attends our summit, we sign an agreement on stage: the summit's score rises by §G3§!, we and [FROM.GetName] gain §G20§! opinion of each other, and our investors favour [FROM.GetName] for a year, as its investors already favour us. Its delegation is §G10%§! more likely to come. Up to three a summit, with invited regional or greater powers."
 econ_forum_broker_talks: "Broker Talks between [FROM.GetName] and a Rival"
 econ_forum_broker_talks_desc: "Forums are where rivals can meet without seeming to negotiate. We can put [FROM.GetName] in a quiet room with the guest it trusts least, and take the credit if they find common ground."
 econ_forum_broker_talks_tt: "We bring [FROM.GetName] together with its fiercest rival among our invited regional and greater powers for talks on the summit's sidelines. If both delegations attend, an accord is likelier at a more prestigious forum and when heads of government come, and less likely the deeper the rivalry. An accord adds §G8§! to the summit's score and gives the two sides §G25§! opinion of each other and §G15§! of us. A collapse costs §R3§! score and §R10§! opinion between them. Both delegations are §G10%§! more likely to come. One set of talks a summit."
 econ_forum_tilt_report: "Rank [FROM.GetName] First in Our Report"
 econ_forum_tilt_report_desc: "Our competitiveness report moves investors, which makes a good ranking worth something to every government in it. A word with the researchers would put [FROM.GetName] at the top this year."
 econ_forum_tilt_report_tt: "If [FROM.GetName] attends our summit and at least six guests come, our competitiveness report ranks it first, which gives it a year of §G5%§! cheaper investment. The forum loses §R2§! prestige when the report comes out, and there is a §R25%§! chance the favoritism leaks, which costs §R4§! more. One favorite a summit."
 econ_forum_secure_summit: "Secure the Summit"
 econ_forum_secure_summit_desc: "Every summit draws people who want to be heard by those inside. Police lines, fences and closed roads keep them at a distance, at a price."
 econ_forum_secure_summit_tt: "Protesters are kept away from our summit. Without security, protests can disrupt it, costing §R6§! score and §R1%§! stability. With it, they cost §R1§! score at most. Protests are likelier at a more prestigious forum, and in the years of anti-globalisation and Occupy anger. Only hosts that hold elections face them."
 econ_forum_invite_neighbor: "Invite [FROM.GetName]"
 econ_forum_invite_neighbor_desc: "A neighbor outside the circle of regional powers can still fill a seat at our summit."
 econ_forum_secure_sponsors: "Secure Corporate Sponsors"
 econ_forum_secure_sponsors_desc: "State co-financing, pavilions and investment incentives bring companies to the summit floor."
 econ_forum_secure_sponsors_tt: "Adds §G5§! corporate points to our next summit's score."
 econ_forum_sponsors_full_tt: "Fewer than §Y25§! corporate points bought for this summit"
 econ_forum_book_speaker: "Book a Headline Speaker"
 econ_forum_book_speaker_desc: "A famous chief executive, central banker or investor fills the hall and the headlines."
 econ_forum_book_speaker_tt: "We court a headline speaker. The closer our prestige is to our strongest rival forum's, the likelier they accept. Each speaker adds §G5§! to the summit score. A speaker we land while the §YWorld Economic Forum§! is also preparing is one Davos loses."
 econ_forum_speakers_full_tt: "Fewer than §Y3§! headline speakers booked for this summit"
 econ_forum_track_ai: "Program Track: AI and Technology"
 econ_forum_track_ai_desc: "Panels on computing, chips and the digital economy draw the developed world's delegations."
 econ_forum_track_energy: "Program Track: Energy"
 econ_forum_track_energy_desc: "Oil exporters and energy-hungry importers both come to talk supply."
 econ_forum_track_finance: "Program Track: Finance"
 econ_forum_track_finance_desc: "Central bankers and finance ministers from the largest and richest economies meet here."
 econ_forum_track_defense: "Program Track: Defense Industry"
 econ_forum_track_defense_desc: "Governments at war or spending heavily on defense look for suppliers and partners."
 econ_forum_track_infrastructure: "Program Track: Infrastructure and Trade"
 econ_forum_track_infrastructure_desc: "Emerging economies come looking for ports, railways, corridors and the money to build them."
 econ_forum_track_development: "Program Track: Development"
 econ_forum_track_development_desc: "The poorest economies come for aid, lending and development finance."
 econ_forum_track_tt: "Adds this track to our next summit's program. Governments that care about it are likelier to attend, by a tenth of our sector prestige, and the track's prestige moves toward the summit's score. Tracks left off the program lose §R5%§! a year. Leading every other forum in a track on the program adds §G3§! corporate points."
 econ_forum_tracks_full_tt: "Fewer than §Y3§! tracks on this summit's program"
 econ_forum_counter_program: "Counter-Program Our Strongest Rival"
 econ_forum_counter_program_desc: "Holding our summit the month after the strongest rival forum's steals its headlines, but guests who just flew home are harder to bring back."
 econ_forum_counter_program_tt: "Our summit moves to the month after our strongest rival's. While that forum is more prestigious, our attendance chances fall by §R20§!, our score gains §G5§! from the media contest, and each head of government we draw who skipped its summit costs it §R1§! prestige, up to 5. If that is already our month, the cost is refunded."
 econ_forum_avoid_rival: "Move Away From Our Strongest Rival"
 econ_forum_avoid_rival_desc: "Holding our summit half a year from the strongest rival forum's lets guests plan for both."
 econ_forum_avoid_rival_tt: "Our summit moves to six months after our strongest rival's, where it no longer competes for the same weeks. If that is already our month, the cost is refunded."
 econ_forum_recently_rescheduled_tt: "Summit not rescheduled in the last two years"
 econ_forum_send_head_tt: "Our head of government attends, earning the largest investor bonus from this summit."
 econ_forum_send_ministers_tt: "Our ministers attend, earning half the investor bonus."
 econ_forum_host_modifier: "Forum Host"
 econ_forum_delegation_modifier: "Forum Delegation"
 econ_forum_attended_summit: "Attended their economic forum"
 econ_forum.1.t: "Preparing the [econ_forum_name_hosted]"
 econ_forum.1.d: "Our summit convenes in two months. Organizers are drafting the guest list, choosing the program, courting corporate sponsors and chasing headline speakers. Every government, company and keynote we secure raises the summit's score against rival forums."
 econ_forum.1.d_short: "Our summit convenes next month, too soon for personal invitations. Organizers are choosing the program, courting corporate sponsors and chasing headline speakers while the standing invitations go out."
 econ_forum.1.a: "Start the preparations"
 econ_forum.2.t: "Invitation to the [econ_forum_name_invited]"
 econ_forum.2.d: "[econ_forum_inviter.GetName] has invited us to the [econ_forum_name_invited]. Sending our head of government draws the most investor attention, but every other summit wants the same time."
 econ_forum.2.a: "Send the head of government"
 econ_forum.2.b: "Send a ministerial delegation"
 econ_forum.2.c: "Decline the invitation"
 econ_forum.3.t: "The [econ_forum_name_hosted] Closes"
 econ_forum.3.d_gain: "This year's summit drew §Y[?econ_forum_report_heads|0]§! heads of government and §Y[?econ_forum_report_ministers|0]§! ministerial delegations and scored §Y[?econ_forum_report_score|0]§!. §Y[?econ_forum_report_deals|0]§! delegations signed investment agreements with us, §Y[?econ_forum_report_ceremonies|0]§! governments signed agreements on stage, and §Y[?econ_forum_report_firms|0]§! company delegations came to do business. The forum's prestige rose to §G[?econ_forum_report_prestige|0]§!."
 econ_forum.3.d_loss: "This year's summit drew §Y[?econ_forum_report_heads|0]§! heads of government and §Y[?econ_forum_report_ministers|0]§! ministerial delegations and scored §Y[?econ_forum_report_score|0]§!. §Y[?econ_forum_report_deals|0]§! delegations signed investment agreements with us, §Y[?econ_forum_report_ceremonies|0]§! governments signed agreements on stage, and §Y[?econ_forum_report_firms|0]§! company delegations came to do business. The forum's prestige fell to §R[?econ_forum_report_prestige|0]§!."
 econ_forum.3.a: "Start planning next year's summit"
 econ_forum.4.t: "Headline Speaker"
 econ_forum.4.d_poached: "A headline speaker has dropped Davos to headline our summit instead. Our score gains a keynote, and the §YWorld Economic Forum§! loses one."
 econ_forum.4.d_booked: "A headline speaker has agreed to keynote our summit."
 econ_forum.4.d_declined: "The headline speaker we courted has turned us down for a bigger stage."
 econ_forum.4.a: "Noted"
 econ_forum_news.1.t: "[FROM.GetName] Launches the [econ_forum_name_founded]"
 econ_forum_news.1.d: "[FROM.GetName] has founded the [econ_forum_name_founded], a yearly summit for governments, investors and industry. Its organizers say it will compete with Davos for the world's leaders and their investment."
 econ_forum_news.1.a: "Another summit for the calendar"
 econ_forum_news.2.t: "The [econ_forum_name_founded] Overtakes Davos"
 econ_forum_news.2.d: "For the first time, the [econ_forum_name_founded] hosted by [FROM.GetName] ranks above the World Economic Forum in prestige. Governments and investors now plan their year around it."
 econ_forum_news.2.a: "The calendar has a new center"
 econ_forum_news.3.t: "[?FROM.econ_forum_news_leader.GetName] Chooses the [econ_forum_name_founded]"
 econ_forum_news.3.d: "The head of government of [?FROM.econ_forum_news_leader.GetName] has headlined the [econ_forum_name_founded] after skipping the [econ_forum_name_news_rival], held only weeks earlier. Commentators read it as a vote for the challenger."
 econ_forum_news.3.a: "A telling choice"
 econ_forum_news.4.t: "Davos Reasserts Itself"
 econ_forum_news.4.d_schwab: "The World Economic Forum is again the world's most prestigious economic summit. Its founder, Klaus Schwab, used this year's meeting to court back the governments and companies that had drifted to its rivals."
 econ_forum_news.4.d: "The World Economic Forum is again the world's most prestigious economic summit, after its organizers courted back the governments and companies that had drifted to its rivals."
 econ_forum_news.4.a: "The old order holds"
 econ_forum_news.5.t: "The [econ_forum_name_founded] Comes of Age"
 econ_forum_news.5.d_schwab: "The [econ_forum_name_founded] hosted by [FROM.GetName] now draws enough governments and companies to rival Davos. Klaus Schwab has welcomed the competition in public while the World Economic Forum courts its own guests harder."
 econ_forum_news.5.d: "The [econ_forum_name_founded] hosted by [FROM.GetName] now draws enough governments and companies to rival Davos. The World Economic Forum has welcomed the competition in public while courting its own guests harder."
 econ_forum_news.5.a: "Davos has company"
 econ_forum_news.13.t: "The [econ_forum_name_founded] Out-Draws Davos"
 econ_forum_news.13.d: "This year's [econ_forum_name_founded] in [FROM.GetName] drew §Y[?FROM.econ_forum_news_heads|0]§! heads of government, more than the World Economic Forum's last meeting managed. Where the leaders go, the investors follow."
 econ_forum_news.13.a: "Davos has a rival for its guests"
 econ_forum_news.14.t: "An Equal of Davos"
 econ_forum_news.14.d: "The [econ_forum_name_founded] hosted by [FROM.GetName] is now spoken of in the same breath as the World Economic Forum. No government planning its year can afford to skip either."
 econ_forum_news.14.a: "Two centers of gravity"
 econ_forum_news.15.t: "Davos Reinvents Itself"
 econ_forum_news.15.d_schwab: "The World Economic Forum no longer draws every regional power to Davos. Klaus Schwab has answered with a reform: new partners, new councils and a promise to put the world's most sought-after speakers back on its stage."
 econ_forum_news.15.d: "The World Economic Forum no longer draws every regional power to Davos. Its leadership has answered with a reform: new partners, new councils and a promise to put the world's most sought-after speakers back on its stage."
 econ_forum_news.15.a: "The incumbent fights back"
 econ_forum_news.16.t: "An Accord on the Sidelines of the [econ_forum_name_founded]"
 econ_forum_news.16.d: "[?FROM.econ_forum_news_talks_a.GetName] and [?FROM.econ_forum_news_talks_b.GetName] arrived at the [econ_forum_name_founded] in [FROM.GetName] as rivals and left with a joint statement. The organizers call it the summit's real achievement, and diplomats are already comparing it to the Davos Declaration of 1988."
 econ_forum_news.16.a: "Business brings people together"
 econ_forum_news.17.t: "Talks Collapse at the [econ_forum_name_founded]"
 econ_forum_news.17.d: "The meeting between [?FROM.econ_forum_news_talks_a.GetName] and [?FROM.econ_forum_news_talks_b.GetName] at the [econ_forum_name_founded] in [FROM.GetName] lasted less than an hour before one delegation walked out. The organizers are left explaining why they put the two in a room at all."
 econ_forum_news.17.a: "Some rivalries run too deep"
 econ_forum_news.18.t: "The [econ_forum_name_founded]'s Report Accused of Favoritism"
 econ_forum_news.18.d: "Researchers who worked on the [econ_forum_name_founded]'s competitiveness report say [?FROM.econ_forum_news_favored.GetName] was moved to the top of the ranking against the data. The organizers in [FROM.GetName] call the claims baseless, but investors no longer quote the ranking without a smile."
 econ_forum_news.18.a: "The numbers were always soft"
 econ_forum_news.19.t: "Protests Disrupt the [econ_forum_name_founded]"
 econ_forum_news.19.d_globalisation: "Thousands of anti-globalisation protesters marched on the [econ_forum_name_founded] in [FROM.GetName], blocking the roads and the delegates' hotels. Since the battle of Seattle, no summit can expect to meet in peace, and this one did not."
 econ_forum_news.19.d_occupy: "Occupy protesters camped outside the [econ_forum_name_founded] in [FROM.GetName], and their banners about the one percent made more headlines than the speeches inside. Delegates arrived through the side doors."
 econ_forum_news.19.d: "Protesters surrounded the [econ_forum_name_founded] in [FROM.GetName], and the police struggled to keep the roads open. The summit went ahead, but the pictures from outside told a different story than the panels inside."
 econ_forum_news.19.a: "The world was watching, just not the panels"
 econ_forum_news.20.t: "The [econ_forum_name_founded] Goes Online"
 econ_forum_news.20.d: "With the pandemic closing borders, the organizers of the [econ_forum_name_founded] in [FROM.GetName] have called off this year's meeting and moved it online. Heads of government will speak to a camera from their offices, and the deals that need a handshake will wait. They have framed the recovery as a \"Great Reset\", and the phrase is already spreading far beyond Davos."
 econ_forum_news.20.a: "You are on mute"
 econ_forum_news.21.t: "The [econ_forum_name_founded] Moves to Spring"
 econ_forum_news.21.d: "A new wave of the pandemic has forced the organizers of the [econ_forum_name_founded] in [FROM.GetName] to push this year's meeting back four months. They promise it will meet in person this time, whatever the virus does."
 econ_forum_news.21.a: "Spring it is"
 econ_forum_news.22.t: "The [econ_forum_name_founded] Meets in New York"
 econ_forum_news.22.d: "In solidarity with a city still recovering from the attacks, the [econ_forum_name_founded] has moved this year's meeting from its usual home to New York. Leaders who might have stayed away came, and the summit's message was that business goes on."
 econ_forum_news.22.a: "New York is open for business"
 econ_forum_news.23.t: "Davos Goes to China"
 econ_forum_news.23.d: "The World Economic Forum will hold a second meeting every September in China, the Annual Meeting of the New Champions. Davos is following the growth, and [FROM.GetName] gets the world's business elite on its own ground."
 econ_forum_news.23.a: "Summer Davos it is"
 econ_forum_standing_4: "\n§YGlobal South Economic Forum§!: prestige [?global.econ_forum_prestige^4|0]. Its last summit drew [?global.econ_forum_last_heads^4|0] heads of government and [?global.econ_forum_last_ministers^4|0] ministerial delegations, and signed [?global.econ_forum_last_ceremonies^4|0] agreements."
