 module_naval_ammo_drone_swarm_1_desc: "수상 및 해안 표적을 향해 협동 군집으로 발사되는 배회 탄약과 공격 드론의 탄약고 적재입니다. 미사일 거치대 또는 VLS 발사대가 있어야 사용할 수 있습니다. 탄약 적재는 임무 유연성을 위해 신속하게 재장비하여 변경할 수도 있습니다."
