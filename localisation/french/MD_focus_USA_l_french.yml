 USA_treason_event.8.d: "Bravo, vous avez battu le système — mais pour qui opter maintenant ? Les libertariens sans État, les réformistes raisonnables, et enfin les constitutionnalistes amoureux du papier."
 USA_treason_event.8.o1: "Peu de pouvoir, peu d'État !"
 USA_treason_event.8.o2: "Une république réformée, et pour cause"
 USA_treason_event.8.o3: "Le papier, c'est la loi !"
 USA_treason_event.8.o4: "Regardons à gauche, pourquoi pas"
