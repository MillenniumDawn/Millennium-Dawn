 POL_monuments_removal_category: "공산주의 기념물 철거"
 POL_monuments_removal_category_desc: "공산주의 기념물은 부정직한 정부, 위조, 권력 남용과만 연관되어 있습니다. 이제 이러한 유물을 철거하기 시작해야 합니다."
 POL_remove_in_mazovia: "마조프셰의 기념물 철거"
 POL_remove_in_west_pomerelia: "서포메라니아(Zachodnie Pomorze)의 기념물 철거"
 POL_remove_in_pomerelia: "포메라니아(Pomorze)의 기념물 철거"
 POL_remove_in_warmia: "바르미아마주리(Warmia i Mazury)의 기념물 철거"
