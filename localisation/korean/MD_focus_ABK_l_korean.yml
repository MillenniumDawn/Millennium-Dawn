l_korean:
 ABK_Corruption_economic: "새 천년의 압하지야"
 ABK_Corruption_economic_desc: "Our country is not meeting the new millennium in the best condition. Corruption is eating away at our country, the infrastructure was destroyed after the war and has not been restored."
 ABK_jd_abk_russia: "러시아와의 교통 연결 복구"
 ABK_jd_abk_russia_desc: "러시아는 현재 우리의 유일한 동맹이자 파트너이므로, 러시아로 향하는 교통로를 복구해야 합니다."
 ABK_tourism1: "관광개발"
 ABK_tourism1_desc: "이제 우리나라의 관광 산업 개발을 시작할 때입니다. 관광객들이 가져오는 자금이 우리 경제가 버티는 데 도움이 될지도 모릅니다."
 ABK_associated_state: "CIS 준회원국"
 ABK_associated_state_desc: "러시아는 우리가 준회원국의 형태로 CIS의 일원이 되도록 도울 준비가 되어 있습니다."
 ABK_internet_akvafon: "최초의 인터넷 접속"
 ABK_internet_akvafon_desc: "인터넷은 전 세계에서 활발히 발전하고 있습니다. 이제 우리 공화국에서도 인터넷을 발전시킬 때입니다."
 ABK_promotion_of_independence: "독립 홍보"
 ABK_promotion_of_independence_desc: "우리는 모든 매체를 통해 공화국의 독립을 홍보할 것입니다. 우리나라는 독립적으로 존재할 수 있습니다."
 ABK_promotion_of_russia: "러시아와의 우정 선전"
 ABK_promotion_of_russia_desc: "러시아는 우리의 친구이자 형제이며 동맹입니다. 우리는 모든 매체를 통해 이러한 관점을 적극적으로 전파할 것입니다."
 ABK_training_in_russia: "러시아에서의 병사 훈련"
 ABK_training_in_russia_desc: "우리는 선진적인 전투 경험을 쌓도록 병사들을 러시아로 훈련을 보낼 것입니다."
 ABK_russia_invest_industry: "러시아의 우리 산업 투자"
 ABK_russia_invest_industry_desc: "우리는 러시아 자금을 우리 산업에 투자하는 협정을 체결할 준비가 되어 있습니다."
 ABK_visa_free_russia: "러시아와의 무비자 체제"
 ABK_visa_free_russia_desc: "우리는 양국 간 비자 제도를 폐지하는 협정에 서명했습니다. 이것이 우리의 경제 상황을 개선하는 데 도움이 되기를 바랍니다."
 ABK_tourism2: "관광 산업 개발 지속"
 ABK_tourism2_desc: "우리는 더 많은 관광객을 나라로 유치해야 하므로, 관광 부문에 대한 투자를 늘릴 것입니다."
 ABK_decrease_cencorship: "검열 완화"
 ABK_decrease_cencorship_desc: "우리는 이전에 존재했던 엄격한 검열을 폐지할 것입니다."
 ABK_abkhazian_passports: "압하지야 여권"
 ABK_abkhazian_passports_desc: "우리는 압하지야 시민의 여권을 도입할 준비가 되어 있습니다."
 ABK_rearms_russia_us: "러시아가 우리를 재무장시킬 준비가 되어 있다"
 ABK_rearms_russia_us_desc: "러시아는 현대식 장비로 우리 군을 재무장시킬 준비가 되어 있습니다."
 ABK_energy_help: "에너지 문제 해결 착수"
 ABK_energy_help_desc: "우리나라는 오랫동안 에너지 문제로 고통받아 왔습니다. 이제 이 문제를 해결하기 시작할 때입니다."
 ABK_crypto: "암호화폐 합법화"
 ABK_crypto_desc: "우리나라는 시대에 발맞추어 나아가야 합니다. 암호화폐가 기세를 얻고 있으며, 우리도 여기서 재정적 이익을 얻어야 합니다."
 ABK_president_illness: "대통령의 투병"
 ABK_president_illness_desc: "Our President is very ill and cannot fulfill the duties of the head of state. It is time to change the government."
 ABK_sgb: "국가보안국(SGB)"
 ABK_sgb_desc: "우리는 국가보안국을 강화해야 합니다."
 ABK_internet_a_mobail: "두 번째 통신사"
 ABK_internet_a_mobail_desc: "A-Mobile이 우리 공화국의 두 번째 통신사가 될 것입니다."
 ABK_jd_abk_russia_arms: "러시아 철도군"
 ABK_jd_abk_russia_arms_desc: "러시아는 우리의 기반시설을 복구하기 위해 자국 철도군 부대를 파견할 준비가 되어 있습니다."
 ABK_research_net: "인터넷망 개발"
 ABK_research_net_desc: "우리의 인터넷망을 더욱 발전시킬 필요가 있습니다."
 ABK_soo_friend: "남오세티야와의 우호"
 ABK_soo_friend_desc: "우리는 남오세티야의 동료들과의 관계를 계속 개선해 나갈 것입니다."
 ABK_artshakh_friend: "아르차흐와의 우호"
 ABK_artshakh_friend_desc: "우리는 아르차흐의 동료들과의 관계를 계속 개선해 나갈 것입니다."
 ABK_new_era: "새로운 시대"
 ABK_new_era_desc: "Our republic is entering a new era. Perhaps, with a new president, we will finally be able to become an economically strong nation."
 ABK_increase_medicine: "의료 발전"
 ABK_increase_medicine_desc: "우리나라의 보건 의료에 투자할 필요가 있습니다. 우리 인구는 감소하고 있으며 이러한 추세를 반전시켜야 합니다."
 ABK_against_corruption: "반부패 운동 개시"
 ABK_against_corruption_desc: "우리는 부패를 단호하고 결연하게 뿌리 뽑을 것입니다."
 ABK_increase_education: "교육에 투자"
 ABK_increase_education_desc: "우리 청년들의 교육 수준이 하락하고 있습니다. 이를 개선하기 위해 투자할 필요가 있습니다."
 ABK_ros_neft: "로스네프트와의 협력"
 ABK_ros_neft_desc: "로스네프트는 우리 공화국 영토에서의 석유 매장량 발굴을 도울 준비가 되어 있습니다."
 ABK_rus_hydro: "루스히드로"
 ABK_rus_hydro_desc: "우리는 영토 내 루스히드로 사업을 승인할 준비가 되어 있습니다."
 ABK_mvd_sgb: "SGB와 내무부 통합"
 ABK_mvd_sgb_desc: "우리 법 집행 기관을 전면 개혁할 때가 왔습니다."
 ABK_let_russians_buy: "러시아인의 부동산 구매 허용"
 ABK_let_russians_buy_desc: "우리는 러시아 시민이 우리나라에서 부동산을 구매하는 것을 법적으로 허용하여 투자 매력도를 높일 것입니다."
 ABK_jd_abk_russia_help: "러시아 철도군의 지원"
 ABK_jd_abk_russia_help_desc: "러시아 철도군은 우리 공화국 영토에 계속 주둔하며 복구 작업을 일시적으로 돕겠다는 입장입니다."
 ABK_our_place: "이 세계에서의 우리의 자리"
 ABK_our_place_desc: "우리 국민은 이 세계에서 자신의 길을 찾아야 하며, 우리는 반드시 그 길을 찾을 것입니다."
 ABK_cus_create: "미승인 국가들과의 관계"
 ABK_cus_create_desc: "우리는 우리와 같은 처지에 있는 다른 미승인 국가들과 관계를 수립할 것입니다."
 ABK_abkhazian_farmers: "국내 농민 지원"
 ABK_abkhazian_farmers_desc: "우리는 언제나 외부의 도움에 기댈 수는 없으므로, 국내 농민에 대한 지원이 우리의 우선 과제가 되어야 합니다."
 ABK_army: "군대 개혁"
 ABK_fleet: "압하지야 해군"
 ABK_air: "압하지야 공군"
 ABK_modernize_army: "육군 현대화"
 ABK_modernize_army_desc: "육군은 우리 주권의 보증인이므로, 육군을 약화시킬 여유가 없습니다."
 ABK_network_warfare_desc: "네트워크 중심전은 지리적으로 분산된 병력을 견고하게 연결함으로써 정보 우위를 경쟁 우위로 전환하고자 하는 군사 교리입니다. 이 교리를 채택하면 우리 군이 전장 정보를 공유하고 활용하는 방식이 현대화될 것입니다."
 ABK_decentralized_warfare_desc: "4세대 전쟁(4GW)은 전쟁과 정치, 전투원과 민간인 사이의 경계가 흐려지는 것을 특징으로 하는 분쟁입니다. 이러한 분권화된 전쟁 방식을 받아들이면 우리 병력이 더 큰 유연성과 주도권을 가지고 작전할 수 있을 것입니다."
 ABK_president_illness2: "공산주의로의 회귀"
 ABK_president_illness2_desc: "우리는 다시 한번 붉은 깃발 아래 온전히 설 것입니다!"
 ABK_china_help: "중국의 투자"
 ABK_china_help_desc: "우리는 국가 발전을 위한 중국의 투자를 유치할 수 있었습니다."
 ABK_china_help_jd: "중국의 철도 투자"
 ABK_china_help_jd_desc: "중국 기업들은 보다 폭넓은 전략의 일환으로 우리 공화국의 철로를 복구할 준비가 되어 있습니다."
 ABK_returm_marxism: "학교에 마르크스주의 복원"
 ABK_returm_marxism_desc: "옛 소비에트 문헌이 다시 우리에게 쓸모가 있을 것입니다. 새로운 세대의 공산주의자를 교육할 때입니다!"
 ABK_increase_cencorship: "검열 강화"
 ABK_increase_cencorship_desc: "인민의 모든 적을 침묵시켜야 합니다!"
 ABK_our_red_path: "붉은 길만이 유일한 진리의 길"
 ABK_our_red_path_desc: "공산주의와 사회주의의 길만이 우리나라를 위한 유일한 진리의 길입니다."
 ABK_one_party: "하나의 민족, 하나의 정당"
 ABK_one_party_desc: "우리나라에는 수십 개의 정당이 필요하지 않습니다. 하나면 충분합니다."
 ABK_china_invest_tech: "중국의 우리 기술 부문 투자"
 ABK_china_invest_tech_desc: "중국 기업들은 우리의 기술 부문에 자금을 지원할 준비가 되어 있습니다."
 ABK_defend_our_home: "우리 고향 수호"
 ABK_defend_our_home_desc: "우리나라는 언제나 위협에 처해 있습니다. 우리나라를 지킵시다."
 ABK_defend_our_home2: "방어 구조물"
 ABK_defend_our_home2_desc: "국민의 사기를 북돋우는 것뿐만 아니라, 국경을 방어하기 위해 물리적으로도 준비되어 있어야 합니다."
 ABK_china_invest_mesta: "중국의 투자 지속"
 ABK_china_invest_mesta_desc: "중국 기업들은 이전 투자에서 긍정적인 성과를 확인했으며, 같은 기조로 투자를 이어갈 준비가 되어 있습니다."
 ABK_atheism: "모든 가정에 무신론을"
 ABK_atheism_desc: "마르크스의 선전이 우리 국민을 무신론의 영광스러운 길로 다시 이끌 것입니다!"
 ABK_mil_prop: "군사 선전"
 ABK_mil_prop_desc: "우리 국민이 하나로 일어나 싸우지 않는다면 우리나라는 스스로를 지킬 수 없습니다."
 ABK_empower_sgb: "보안 기관 자금 지원 강화"
 ABK_empower_sgb_desc: "국가는 내부로부터 확실하게 보호되어야 합니다."
 ABK_mobilise_masses: "대중 동원"
 ABK_mobilise_masses_desc: "일어나라, 압하지야의 인민이여! 죽을 때까지 싸워라!"
 ABK_nep: "신경제정책의 부활"
 ABK_nep_desc: "옛 방식이 다시 한번 활용될 것입니다."
 ABK_fiveka: "제1차 5개년 계획"
 ABK_fiveka_desc: "이제 5개년 계획의 관행으로 되돌아갈 때입니다."
 ABK_free_education: "무상 교육"
 ABK_free_education_desc: "모든 압하지야인은 어디에 있든 교육을 받아야 합니다!"
 ABK_collectivism: "집단주의"
 ABK_collectivism_desc: "집단주의를 통해 압하지야 국민의 단결을 회복합시다."
 ABK_sup_work: "우리는 노동자를 지원할 것이다"
 ABK_sup_work_desc: "모든 압하지야 노동자는 국가의 보호를 받을 것입니다."
 ABK_people_militia: "People's Militia"
 ABK_people_militia_desc: "모든 시민이 나라를 지켜야 합니다!"
 ABK_rel_quest: "종교 문제"
 ABK_rel_quest_desc: "이토록 미묘한 문제에서 우리는 어떻게 해야 합니까?"
 ABK_rel_commu: "종교적 공산주의"
 ABK_rel_commu_desc: "이 둘은 양립할 수 있습니까?"
 ABK_farmer_collab: "농민 지원"
 ABK_farmer_collab_desc: "농업은 우리 공화국의 생명줄입니다."
 ABK_president_illness3: "군주제의 복귀"
 ABK_president_illness3_desc: "이 모든 민주주의 놀음이 우리나라를 파멸로 이끌었습니다. 오직 진정한 군주제만이 우리를 구할 것입니다."
 ABK_ally_with_mafia: "마피아와의 동맹"
 ABK_ally_with_mafia_desc: "압하지야의 씨족들은 오래도록 나라를 분열시켜 왔으며 발전에 악영향만 끼쳤습니다. 군주제의 깃발 아래에서 우리는 그들이 우리나라의 이익을 위해 일하도록 만들 것입니다."
 ABK_nati_ideas: "민족주의 사상"
 ABK_nati_ideas_desc: "사회의 결속은 그 어느 때보다 필요합니다. 더 확실하게 하기 위해 민족주의 사상으로 이를 강화할 것입니다."
 ABK_start_prepare_for_war: "전쟁 준비"
 ABK_start_prepare_for_war_desc: "이웃 나라 조지아는 우리에게 평화를 허락하지 않을 것이므로, 다가올 전쟁에 전력을 다해 대비해야 합니다."
 ABK_abkhazian_kingdom: "압하지야 왕국의 유산"
 ABK_abkhazian_kingdom_desc: "역사 교과서는 최고의 선전 수단입니다. 이 땅에 한때 압하지야 왕국이 서 있었음을 우리 국민에게 상기시킬 때입니다."
 ABK_miiltia: "압하지야 민병대"
 ABK_miiltia_desc: "이제 민병대를 소집할 때입니다. 전쟁의 시간이 곧 다가올 것입니다."
 ABK_militarism: "군국주의의 시대"
 ABK_militarism_desc: "군국주의는 우리에게 공기만큼이나 필요합니다."
 ABK_militari_industry: "군수 산업"
 ABK_militari_industry_desc: "우리에게는 많은 총기가 필요합니다."
 ABK_finish_opposition: "야당 척결"
 ABK_finish_opposition_desc: "야당은 오랫동안 우리나라의 발전을 가로막아 왔습니다. 이제 민주주의를 버린 만큼 모든 반대 세력을 제거할 때입니다."
 ABK_church_help: "교회의 지원"
 ABK_church_help_desc: "종교는 우리 삶의 중요한 부분입니다. 종교가 우리의 정의로운 전쟁을 축복해 주기를 바랍니다."
 ABK_cis_2_military: "군사 동맹으로서의 CIS-2"
 ABK_cis_2_military_desc: "CIS-2를 그 이상의 무언가로 만들 때입니다."
 ABK_ally_with_south_ossetia: "남오세티야와 군사 동맹 결성"
 ABK_ally_with_south_ossetia_desc: "다가올 전쟁에서 우리는 함께 싸워야 합니다."
 ABK_georgia_attack: "조지아와의 전쟁 개시"
 ABK_georgia_attack_desc: "위대한 전투의 때가 왔습니다."
 ABK_arm_friend: "아르메니아와의 우호"
 ABK_arm_friend_desc: "이제 아르메니아와 우호 관계를 수립할 때입니다."
 ABK_arm_battalion: "바그라미얀 대대 부활"
 ABK_arm_battalion_desc: "조지아에 맞선 투쟁에서 아르메니아와의 우정의 상징이었던 바그라미얀 대대를 부활시킬 때입니다."
 ABK_abkhazvozvrashenstroy: "\\"압하즈보즈라셴스트로이\\" 기금 설립"
 ABK_abkhazvozvrashenstroy_desc: "이 기금은 새로운 압하지야 경제의 초석이 될 것입니다. 이 기금의 도움으로 우리는 전 세계로부터 투자를 유치할 수 있을 것입니다."
 ABK_parli_dead: "의회 처리"
 ABK_parli_dead_desc: "이 민주주의의 유물을 제거할 때입니다."
 ABK_dictatorship: "독재 군주"
 ABK_dictatorship_desc: "오직 군주의 단호한 손길만이 우리나라를 구할 것입니다."
 ABK_sov_heast: "러시아와의 우호"
 ABK_sov_heast_desc: "우리는 이러한 러시아와 친구가 될 준비가 되어 있습니다."
 ABK_invest_from_eng: "영국의 투자"
 ABK_invest_from_eng_desc: "압하즈인을 비롯한 북서 캅카스 민족들의 비극적 운명에 파머스턴 경 치하에서 영국이 맡았던 역할은 우리에 대한 특별한 책임을 안겨 줍니다. 우리는 영국의 투자를 기대합니다."
 ABK_invest_from_tur: "튀르키예의 투자"
 ABK_invest_from_tur_desc: "우리는 어떤 식으로든 무하지르 비극에 관여했던 튀르키예의 투자를 기대합니다. 튀르키예가 기금 활동에 참여한다는 것은 압하지야 민족의 미래 운명에 함께한다는 의미일 것입니다."
 ABK_invest_from_chi: "중국의 투자"
 ABK_invest_from_chi_desc: "중국의 투자를 유치할 필요가 있습니다. 강대국 중 하나이자 국제연합 안전보장이사회 상임이사국인 중화인민공화국은 외부 요인의 기회주의적 압력에 가장 영향을 덜 받는 국가 중 하나입니다."
 ABK_repatriation: "송환 프로그램"
 ABK_repatriation_desc: "우리는 압하즈 민족을 고국으로 돌아오게 하는 프로그램을 시작할 준비가 되어 있습니다."
 ABK_tourism_sector: "관광 부문 자본 투자"
 ABK_tourism_sector_desc: "안정적인 자금 유입은 우리가 관광 부문에 대한 투자를 늘릴 수 있게 해 줄 것입니다."
 ABK_fight_with_narco: "마약 중독과의 투쟁"
 ABK_fight_with_narco_desc: "우리나라 내 마약 확산에 맞서 싸울 필요가 있습니다."
 ABK_declare_kingdom: "압하지야 왕국의 건국을 알리기"
 ABK_declare_kingdom_desc: "이제 우리 민족에게 옛 위대함을 되찾아 줄 때입니다."
 ABK_korea_workers: "북한 노동자 유치"
 ABK_korea_workers_desc: "We are ready to bring in workers from North Korea to help develop our country."
 ABK_internal_state: "국내 정책"
 ABK_internal_state_desc: "국가의 내부 문제도 해결할 필요가 있습니다."
 ABK_sports_development: "스포츠 발전"
 ABK_sports_development_desc: "건강한 신체에 건강한 정신이 깃듭니다!"
 ABK_education_development: "교육 발전"
 ABK_education_development_desc: "우리가 나라를 자녀들에게 물려줄 수 있도록 아이들이 글을 아는 사람으로 자라야 합니다."
 ABK_wine: "와인 산업 진흥"
 ABK_wine_desc: "와인이 우리의 전부입니다"
 ABK_bul_bondex: "불가리아와의 우호"
 ABK_bul_bondex_desc: "우리의 통치 왕조는 오래전부터 불가리아에 존재해 왔으며 그곳에서 영향력을 얻는 데 성공했습니다. 이 나라와의 우호는 분명 우리에게 이익이 될 것입니다."
 ABK_china_sosiski: "중국 무기 구매"
 ABK_china_sosiski_desc: "우리는 일부 무기 견본에 관심이 있습니다."
 ABK_eng_sosiski: "영국 무기 구매"
 ABK_eng_sosiski_desc: "우리는 일부 무기 견본에 관심이 있습니다."
 ABK_rus_sosiski: "러시아 무기 구매"
 ABK_rus_sosiski_desc: "우리는 일부 무기 견본에 관심이 있습니다."
 ABK_armenia_sosiski: "아르메니아 무기 구매"
 ABK_armenia_sosiski_desc: "우리는 일부 무기 견본에 관심이 있습니다."
 ABK_bulgaria_sosiski: "불가리아 무기 구매"
 ABK_bulgaria_sosiski_desc: "우리는 일부 무기 견본에 관심이 있습니다."
 ABK_let_wagner_enter: "바그너 PMC 고용"
 ABK_let_wagner_enter_desc: "우리는 나라를 지키기 위해 바그너 PMC의 용역을 받는 데 관심이 있습니다."
 ABK_unesko: "유네스코 초청"
 ABK_unesko_desc: "압하지야는 위대한 역사와 문화를 지닌 매우 오래된 땅입니다. 이제 이 유산을 보존하는 데 도움을 받도록 유네스코를 초청할 수 있습니다."
 ABK_free_zone: "경제 자유 구역"
 ABK_free_zone_desc: "이제 우리 경제에 투자를 끌어들일 완전히 기능하는 경제 자유 구역을 설립할 수 있습니다."
 ABK_we_are_country: "우리는 승인된 국가다"
 ABK_we_are_country_desc: "우리가 오랜 세월 이루려 애써 온 것을 마침내 얻어냈습니다. 이제 우리 국가는 승인받았습니다!"
 ABK_union_state: "연방 국가 가입"
 ABK_union_state_desc: "우리는 연방 국가에 가입할 준비가 되어 있습니다. 러시아와의 이러한 형태의 관계는 우리에게 잘 맞습니다."
 ABK_korea_trade: "북한과의 무역"
 ABK_korea_trade_desc: "We are ready to establish trade relations with the DPRK."
 ABK_monarchy_eng: "영국 군주제와의 우호"
 ABK_monarchy_eng_desc: "우리 군주들은 우호 관계를 맺어야 합니다."
 ABK_friend_russia: "공산주의 러시아와의 우호"
 ABK_friend_russia_desc: "러시아에서 집권한 공산주의자들만이 우리의 파트너이자 친구가 될 수 있습니다."
 ABK_friend_georgia: "조지아와의 우호"
 ABK_friend_georgia_desc: "조지아 공산주의자들은 우리의 친구입니다."
 ABK_friend_armenia: "아르메니아와의 우호"
 ABK_friend_armenia_desc: "아르메니아 공산주의자들은 우리의 친구입니다."
 ABK_Russian_Way: "육군 현대화의 러시아식 노선"
 ABK_Russian_Way_desc: "우리는 러시아식 체계에 따라 육군을 현대화하는 길을 택했습니다."
 ABK_China_Way: "육군 현대화의 중국식 노선"
 ABK_China_Way_desc: "우리는 중국식 체계에 따라 육군을 현대화하는 길을 택했습니다."
 ABK_CSTO_training: "CSTO 국가들과의 훈련"
 ABK_CSTO_training_desc: "CSTO 국가들과의 훈련은 우리 병사들이 새로운 전투 기술을 익히는 데 도움이 될 것입니다."
 ABK_Iska: "우리 영토에 러시아 \\"이스칸데르\\" 배치"
 ABK_Iska_desc: "로켓은 결코 지나치지 않습니다."
 ABK_rus_officer: "러시아 장교 학교"
 ABK_rus_officer_desc: "우리 장교들은 러시아 군사 대학에서 공부하게 될 것입니다."
 ABK_china_rszo: "중국제 MLRS 구매"
 ABK_china_rszo_desc: "WM-80은 중국의 다연장 로켓 시스템입니다. 중국 제123공장에서 개발되었으며 중국 대외무역공사 노린코가 수출용으로 제공하고 있습니다. 이 시스템은 방글라데시, 아르메니아, 요르단, 수단에 인도되었습니다."
 ABK_weapon: "중국과의 무기 거래"
 ABK_weapon_desc: "중국은 우리에게 자동 소총 몇 정을 무상으로 공급하기로 합의했습니다."
 ABK_China_training: "중국군과의 훈련"
 ABK_China_training_desc: "우리 전투원들은 중국 병사들과 함께 훈련할 것입니다."
 ABK_tur_sosiski: "튀르키예 장비 구매"
 ABK_tur_sosiski_desc: "우리는 튀르키예에서 소량의 장비를 구매할 준비가 되어 있습니다."
 ABK_union_social: "사회 보장 협력"
 ABK_union_social_desc: "우리는 연방 국가 구성원 간의 사회적 상호 작용에 관한 협정을 체결했으며, 이는 시민들의 삶을 크게 편리하게 해 줄 것입니다."
 ABK_union_programm_care: "의료 분야 협력"
 ABK_union_programm_desc: "보건 분야 협력 협정은 연방 국가 발전의 중요한 단계입니다. 이제 우리 시민들은 어디서나 동일한 수준의 의료 서비스를 받게 될 것입니다."
 ABK_union_btr: "기술 및 수송 협력"
 ABK_union_btr_desc: "우리 두 나라는 탄탄한 생산 기반을 갖추고 있으며, 우리는 이를 활용해 필수 장비의 생산량을 늘릴 것입니다."
 ABK_tourism1_idea: "압하지야 관광"
 ABK_tourism2_idea: "발전한 압하지야 관광"
 ABK_outdated_army_idea: "시대에 뒤떨어진 군대"
 ABK_outdated_army_idea_desc: "The Abkhaz army is very poorly armed and almost untrained."
 ABK_victory_war_idea: "독립 전쟁에서의 승리"
 ABK_victory_war_idea_desc: "Abkhazia has won the war for its independence against Georgia. The people of Abkhazia are proud of this and remember the glorious victory."
 ABK_mafia_idea: "압하지야의 마피아"
 ABK_mafia_idea_desc: "Abkhazia is a deeply corrupt state riddled with clan influence. Power is divided between rival clans, which clearly hinder the country's development."
 ABK_mafia2_idea: "약화된 압하지야 마피아"
 ABK_mafia2_idea_desc: "마피아의 규모가 줄어들기 시작하면서 우리의 조치가 결실을 맺기 시작했습니다."
 ABK_mafia3_idea: "와해된 압하지야 마피아"
 ABK_mafia3_idea_desc: "압하지야 마피아들은 거의 궁지에 몰렸으며, 정부와 기타 당국에서의 연줄을 잃고 있습니다."
 ABK_mafia4_idea: "괴멸된 압하지야 마피아"
 ABK_mafia4_idea_desc: "우리나라의 삶에 근본적인 영향을 미칠 만한 영향력을 가진 마피아 두목은 극소수만 남았습니다."
 ABK_energy_problems_idea: "에너지 문제"
 ABK_energy_problems_idea_desc: "압하지야의 에너지 기반시설은 끔찍한 상태입니다. 독립 전쟁이 사실상 이를 파괴했으며, 우리는 이제 거의 처음부터 복구해야 합니다."
 ABK_energy_problems2_idea: "경미한 에너지 문제"
 ABK_energy_problems2_idea_desc: "어느 정도 진전이 있었지만, 압하지야의 에너지 기반시설이 독립 전쟁의 피해에서 완전히 회복하려면 여전히 상당한 투자가 필요합니다."
 ABK_narcos_idea: "마약 중독"
 ABK_narcos_idea_desc: "압하지야의 마약 중독은 심각한 문제입니다. 젊은이들이 점점 더 마약에 빠져들고 있습니다. 우리는 이에 맞서 싸워야 합니다!"
 ABK_narcos2_idea: "마약 중독"
 ABK_narcos2_idea_desc: "우리나라의 마약 중독은 여전히 젊은이들에게 영향을 미치고 있지만, 예전만큼 심각하지는 않습니다."
