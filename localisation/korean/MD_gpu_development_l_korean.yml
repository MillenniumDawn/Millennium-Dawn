l_korean:
 gpu_development.1.t: "라데온, 지포스에 도전하다"
 gpu_development.1.d_usa: "엔비디아가 지포스를 통해 하드웨어 변환 및 조명(T&L) 기능을 선보인지 수개월 만에, ATI는 처리 속도와 드라이버, 개발자 확보를 둘러싼 정면 승부를 위해 라데온 출시를 준비하고 있습니다. 이러한 경쟁은 미국의 그래픽 설계를 최첨단 영역으로 밀어 올리고 있으나, 두 회사 모두 팹리스 기업이어서 기술이 발전할수록 소수의 대만 파운드리에 대한 의존도 또한 심화됩니다. 워싱턴 정계는 그래픽 표준과 연방 차원의 연구를 개방적으로 유지할 수도 있고, 가장 역량 있는 국내 설계 전문 기업들에 지원을 집중할 수도 있습니다."
 gpu_development.1.a_usa: "개방형 표준 및 연구 지원"
 gpu_development.1.b_usa: "선도적인 팹리스 설계 기업 지원"
 gpu_development.1.d_can: "ATI 테크놀로지스는 지포스가 수개월 앞서 차지했던 성능 우위를 탈환하고자 마컴 본사에서 라데온의 출시를 준비하고 있습니다. 이 회사는 캐나다의 몇 안 되는 대표적인 반도체 챔피언이지만, 첨단 경쟁에서 살아남으려면 자본, 파운드리 생산 능력, 그리고 하드웨어의 성패를 가를 소프트웨어 개발자들에 대한 더 깊은 접근성이 필요합니다. 오타와 정부는 ATI의 독립성을 국가적인 설계 기업으로 보호할 수도 있고, 캐나다의 설계를 미국의 자본 및 아시아의 제조 생태계와 잇는 북미 대륙 공급망에 편입시킬 수도 있습니다."
 gpu_development.1.a_can: "ATI의 독립성 보호"
 gpu_development.1.b_can: "북미 대륙 공급망 편입"
 gpu_development.1.d_tai: "라데온과 지포스 사이의 경쟁은 대만에 새로운 웨이퍼 주문으로 이어지고 있으며, 두 팹리스 기업 모두 칩 생산을 대만 현지 파운드리에 의존하고 있습니다. 새롭게 부상하는 이 그래픽 시장은 대만 마이크로칩 산업의 고객 기반을 넓혀줄 수도 있고, 희소한 첨단 공정 용량을 급성장하는 소수의 팹리스 설계 기업에 집중시킬 수도 있습니다. 타이베이 당국은 파운드리 접근성을 다수의 고객에게 열어둘 것인지, 아니면 소수의 핵심 설계 기업들과 장기 계약을 체결할 것인지 결정해야 합니다."
 gpu_development.1.a_tai: "파운드리 접근성 확대"
 gpu_development.1.b_tai: "핵심 설계 기업과의 계약 확보"
 gpu_development.2.t: "프로그래머블 셰이더의 등장"
 gpu_development.2.d_usa: "다이렉트X 8과 차세대 그래픽 프로세서들이 고정 기능 파이프라인을 대체하며 프로그래머블 정점 및 픽셀 셰이더를 도입했습니다. 하드웨어 제조사, 게임 스튜디오, 운영체제 개발사들은 이제 실시간 그래픽 환경의 미래를 좌우할 인터페이스 표준을 선점하기 위해 치열하게 경쟁하고 있습니다."
 gpu_development.2.a_usa: "셰이더 인터페이스 표준화"
 gpu_development.2.b_usa: "제조사별 독자 스택 확장 허용"
 gpu_development.2.d_can: "ATI의 라데온 엔지니어들은 빠르게 진화하는 그래픽 아키텍처에 프로그래머블 셰이더 지원 기능을 구축하고 있습니다. 공통 인터페이스가 정착되면 캐나다 설계의 시장 저변이 넓어지겠지만, 독점적인 확장 규격을 밀어붙이면 ATI가 일시적인 기술적 우위를 점할 수 있습니다."
 gpu_development.2.a_can: "공통 인터페이스 기반 구축"
 gpu_development.2.b_can: "라데온 플랫폼의 차별화"
 gpu_development.2.d_jap: "프로그래머블 그래픽의 등장은 콘솔 제조사와 게임 스튜디오가 하드웨어와 소프트웨어의 역할을 분담하는 방식을 바꾸고 있습니다. 일본의 플랫폼 홀더들은 범용 그래픽 표준을 장려할 수도 있고, 자사 콘솔에 긴밀히 최적화된 독자 아키텍처를 고수할 수도 있습니다."
 gpu_development.2.a_jap: "범용 그래픽 표준 지원"
 gpu_development.2.b_jap: "국내 콘솔 플랫폼 최적화"
 gpu_development.3.t: "AMD의 ATI 인수"
 gpu_development.3.d_usa: "AMD가 x86 프로세서, 칩셋, 그래픽 카드를 단일 기업 아래 통합하는 조건으로 ATI 인수에 합의했습니다. 이번 합병은 통합 컴퓨팅 플랫폼의 등장을 예고하지만, 동시에 그래픽 설계와 파운드리 용량을 두고 경쟁하는 독립 기업의 수를 줄이는 결과를 낳습니다."
 gpu_development.3.a_usa: "합병 과정에서의 시장 경쟁 보호"
 gpu_development.3.b_usa: "통합 컴퓨팅 플랫폼 장려"
 gpu_development.4.t: "CUDA, 병렬 컴퓨팅 시대를 열다"
 gpu_development.4.d_usa: "엔비디아가 쿠다(CUDA)를 출시하여 프로그래머들이 호환 그래픽 프로세서를 단순 렌더링을 훨씬 뛰어넘는 연산 작업에 활용할 수 있게 되었습니다. 이제 개발자가 엔비디아의 소프트웨어 생태계를 채택하기만 하면 과학 계산, 시뮬레이션, 데이터 분석에서 수천 개의 병렬 스레드를 활용할 수 있습니다."
 gpu_development.4.a_usa: "범용 컴퓨팅 표준 추진"
 gpu_development.4.b_usa: "쿠다 생태계 도입"
 gpu_development.5.t: "알렉스넷, AI 경쟁의 판도를 바꾸다"
 gpu_development.5.d_usa: "알렉스넷이 이미지넷 대회에서 거둔 압도적인 성과는 그래픽 프로세서로 훈련된 대규모 신경망이 기존의 컴퓨터 비전 기법을 능가할 수 있음을 입증했습니다. 미국의 연구소들과 기술 기업들은 경쟁자들이 이 혁신을 대규모로 재현하기 전에 가속기, 데이터 세트, 연구 인력을 선점하기 위해 앞다투어 나서고 있습니다."
 gpu_development.5.a_usa: "가속기 연구에 대한 광범위한 접근성 유지"
 gpu_development.5.b_usa: "상업용 AI 클러스터 확장"
 gpu_development.5.d_can: "토론토 대학교의 연구진이 엔비디아 그래픽 프로세서를 활용해 알렉스넷을 훈련시키며 이미지넷 대회에 일대 혁신을 불러일으켰습니다. 캐나다는 이제 이례적으로 고도화된 머신러닝 전문성을 보유하게 되었으나, 해외 기업들은 이미 해당 연구팀을 영입하고 그 연구 방식을 상업화하고자 치열하게 경쟁하고 있습니다."
 gpu_development.5.a_can: "공공 연구 네트워크 확장"
 gpu_development.5.b_can: "기술 혁신을 독자 AI 산업으로 육성"
 gpu_development.6.t: "데이터 센터에 진입한 텐서 코어"
 gpu_development.6.d_usa: "엔비디아의 볼타(Volta) 아키텍처는 딥러닝에 사용되는 행렬 연산을 가속화하기 위해 특별히 설계된 텐서 코어를 선보였습니다. 그래픽 프로세서가 데이터 센터용 특화 엔진으로 진화하면서, 첨단 공정 미세화와 고대역폭 메모리(HBM), 긴밀히 통합된 소프트웨어에 대한 수요가 급증하고 있습니다."
 gpu_development.6.a_usa: "AI 가속기에 대한 접근성 확대"
 gpu_development.6.b_usa: "풀스택 플랫폼 집중 육성"
 gpu_development.6.d_tai: "볼타급 가속기는 최첨단 제조 공정과 한층 복잡한 패키징 기술을 요구합니다. 대만의 파운드리들은 AI 칩을 수많은 고객군 중 하나로 취급할 수도 있고, 가장 빠르게 성장하는 가속기 설계 기업들을 위해 희소한 첨단 생산 용량을 비축해 둘 수도 있습니다."
 gpu_development.6.a_tai: "첨단 생산 역량의 광범위한 공급 유지"
 gpu_development.6.b_tai: "전략적 가속기 주문 우선 배정"
 gpu_development.6.d_kor: "AI 가속기는 수천 개의 연산 유닛에 끊김 없이 데이터를 공급하기 위해 고대역폭 메모리(HBM)를 필요로 합니다. 한국의 메모리 제조사들은 HBM을 개방형 산업 표준으로 확장할 수도 있고, 새로운 생산 능력을 선도적인 가속기 플랫폼과 긴밀히 결합할 수도 있습니다."
 gpu_development.6.a_kor: "HBM 공급망 표준화 및 확대"
 gpu_development.6.b_kor: "가속기 플랫폼과의 장기적 협력 관계 구축"
 gpu_development.7.t: "고갈된 GPU 공급망"
 gpu_development.7.d_shortage: "팬데믹으로 인한 공급망 혼란, 급증하는 전자기기 수요, 파운드리 생산 능력을 둘러싼 경쟁이 겹치면서 우리 경제는 심각한 마이크로칩 부족에 직면했습니다. 이제 그래픽 카드, 완성차, 서버, 소비자 가전 기기가 동일한 한정된 공급 물량을 두고 치열하게 경쟁하는 처지에 놓였습니다."
 gpu_development.7.d_resilient: "팬데믹으로 인한 혼란과 전자기기 수요 급증으로 전 세계 마이크로칩 시장이 타격을 입었으나, 우리의 현재 공급망은 흔들림 없이 유지되고 있습니다. 해외의 반도체 부족 사태는 우리에게 경각심을 주는 동시에 향후 생산 능력을 선점할 기회를 제공합니다."
 gpu_development.7.a_usa: "핵심 부문 이용자를 위한 공급망 조율"
 gpu_development.7.b_usa: "국내 생산 능력 확충 가속화"
 gpu_development.7.a_can: "연구 기관 및 중소 설계 기업 보호"
 gpu_development.7.b_can: "북미 대륙 내 조달 계약 체결"
 gpu_development.7.a_tai: "보다 많은 고객에게 웨이퍼 분배"
 gpu_development.7.b_tai: "파운드리 증설 가속화"
 gpu_development.7.a_kor: "메모리 공급 안정화"
 gpu_development.7.b_kor: "전략 칩 생산 확대"
 gpu_development.7.a_chi: "민간 산업 부문의 수입 물량 배급"
 gpu_development.7.b_chi: "국산화 대체 작업 가속화"
 gpu_development.7.a_jap: "자동차 및 전자제품 생산 보호"
 gpu_development.7.b_jap: "국내 반도체 생산 역량 재건"
 gpu_development.8.t: "호퍼, AI의 엔진으로 등극하다"
 gpu_development.8.d_usa: "엔비디아의 호퍼(Hopper) 아키텍처와 H100 가속기는 트랜스포머 엔진, 고대역폭 메모리, 초고속 인터커넥트를 결합하여 대규모 AI 모델을 지원합니다. 데이터 센터용 가속기는 이제 개량된 그래픽 카드가 아니라, 그 자체로 온전한 전략적 컴퓨팅 시스템으로 자리잡았습니다."
 gpu_development.8.a_usa: "광범위한 가속기 생태계 지원"
 gpu_development.8.b_usa: "선도적인 풀스택 플랫폼 규모 확장"
 gpu_development.8.d_tai: "호퍼 아키텍처는 거대한 프로세서 다이와 고대역폭 메모리를 연결하기 위해 TSMC의 맞춤형 공정과 첨단 패키징 기술에 의존합니다. AI 수요는 웨이퍼 투입량과 패키징 라인 모두를 대만 마이크로칩 산업의 전략적 병목 구간으로 변화시키고 있습니다."
 gpu_development.8.a_tai: "첨단 패키징 접근성 확대"
 gpu_development.8.b_tai: "핵심 고객사를 위한 생산 능력 비축"
 gpu_development.8.d_kor: "H100급 가속기는 적층형 HBM3를 대량으로 소모하며, 이에 따라 한국의 메모리 제조사들은 AI 공급망의 핵심 축으로 자리 잡았습니다. 늘어난 생산 능력을 다양한 시장에 공급할 수도 있고, 선도적인 플랫폼 기업과의 긴밀한 파트너십에 전량 투입할 수도 있습니다."
 gpu_development.8.a_kor: "HBM3 공급 확대"
 gpu_development.8.b_kor: "전략적 플랫폼과의 계약 우선시"
 gpu_development.9.t: "AI 연산 인프라 확충 경쟁"
 gpu_development.9.d_usa: "생성형 AI의 등장은 첨단 가속기로 가득 찬 데이터 센터를 구축하려는 열풍을 불러일으켰습니다. 하이퍼스케일 기업들이 마이크로칩, 전력, 네트워크 장비, 전문 인력을 두고 경쟁하면서, 연산 능력의 확보는 국가적인 산업 과제로 부상했습니다."
 gpu_development.9.a_usa: "컴퓨팅 자원 시장의 광범위한 접근성 보장"
 gpu_development.9.b_usa: "국가 전략적 인프라 확충 지원"
 gpu_development.9.d_can: "캐나다가 지닌 AI 연구 기반과 풍부한 전력망은 새로운 가속기 클러스터와 데이터 센터를 유치하는 원동력이 되고 있습니다. 이러한 인프라 확충은 대학과 스타트업의 접근성을 넓혀줄 수도 있고, 국내 인재들을 소수의 대형 해외 플랫폼에 종속시키는 결과를 낳을 수도 있습니다."
 gpu_development.9.a_can: "개방형 연구 네트워크를 위한 연산 자원 비축"
 gpu_development.9.b_can: "선도 기업 유치를 통한 규모 확장"
 gpu_development.9.d_tai: "AI 프로세서 수요가 폭증하면서 최첨단 파운드리와 첨단 패키징의 주문 예약이 모두 마감되었습니다. 대만은 이러한 생산 능력을 반도체 생태계 전반에 골고루 개방할 수도 있고, 가장 빠른 설비 증설에 자금을 댈 수 있는 고객들에게 투자를 집중할 수도 있습니다."
 gpu_development.9.a_tai: "첨단 생산 공정에 대한 접근성 다변화"
 gpu_development.9.b_tai: "신속한 파운드리 증설에 집중"
 gpu_development.9.d_kor: "HBM은 AI 가속기 생산을 제약하는 가장 심각한 병목 요인 중 하나가 되었습니다. 한국 기업들은 품질 인증과 공급 대상을 시장 전반으로 다변화할 것인지, 아니면 장기 전략 고객을 위해 신규 팹 라인을 전담 배정할 것인지 선택해야 합니다."
 gpu_development.9.a_kor: "HBM 인증 및 공급 다변화"
 gpu_development.9.b_kor: "전략적 고객 중심의 생산 라인 구축"
 gpu_development.9.d_chi: "최첨단 해외 가속기에 대한 접근성이 불확실해지는 가운데 AI 연산 능력에 대한 수요는 갈수록 치솟고 있습니다. 국내 설계 기업, 파운드리, 메모리 제조사들은 핵심 부품의 해외 수급이 지속되지 못할 상황을 전제하고 독자적인 완성형 공급망을 구축해야 합니다."
 gpu_development.9.a_chi: "국내 개방형 가속기 표준 지원"
 gpu_development.9.b_chi: "국가대표 핵심 기업에 자원 집중"
 gpu_development.9.d_jap: "AI 열풍은 일본의 반도체 소재, 제조 장비, 패키징 기술력, 신규 팹 프로젝트의 전략적 가치를 다시금 부각시켰습니다. 조율된 투자가 이뤄진다면 이러한 강점들을 하나로 엮을 수 있겠지만, 업계는 광범위한 공급망 개방과 집중적인 국가 주도 프로그램 사이에서 노선을 선택해야 합니다."
 gpu_development.9.a_jap: "개방형 공급망 생태계 강화"
 gpu_development.9.b_jap: "국가 주도 생산 역량 프로그램 조율"
 gpu_2000_graphics_market: "그래픽 시장의 호황"
 gpu_2000_graphics_market_desc: "최신 그래픽 가속기에 대한 수요 급증은 엔지니어와 주문을 선도적인 설계로 집중시키며 연구 속도를 앞당기는 한편, 모두가 의존하는 마이크로칩의 공급망을 압박하게 됩니다."
 gpu_accelerator_demand: "가속기 수요"
 gpu_accelerator_demand_desc: "그래픽 프로세서와 AI 가속기에 대한 수요는 투자와 인재, 마이크로칩을 첨단 컴퓨팅 부문으로 끌어모으게 됩니다. 이로 인한 확장은 연구와 데이터 센터의 성장을 뒷받침하지만, 전반적인 칩 공급망에는 추가적인 부담을 안겨주게 됩니다."
 gpu_foundry_expansion: "파운드리 증설"
 gpu_foundry_expansion_desc: "공공 및 민간 투자가 마이크로칩 제조 공장의 생산 능력과 첨단 패키징, 고대역폭 메모리 생산을 확장하여 그래픽 프로세서와 AI 가속기의 증가하는 수요에 대응하게 됩니다."