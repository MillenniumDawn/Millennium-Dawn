 UKR_is_pro_east_TT_NOT: "Не является пророссийской партией"
 UKR_kharkiv_pact_signed_tt: "Аренда §YСевастопольской бухты§! §YЧерноморским флотом§! продлена до §Y2042§! года. Если мы выберем путь в §YНАТО§!, то всё равно сможем потребовать вернуть базу начиная с §Y2017§! года."
 UKR_kharkiv_pact_refused_tt: "Аренда базы §YЧерноморским флотом§! истекает в §Y2017§! году. После этого мы потребуем вернуть §YСевастопольскую бухту§!, и §RРоссия может ответить войной§!."
 UKR_sevastopol_naval_base_category: "Севастопольская военно-морская база"
 UKR_sevastopol_naval_base_category_desc: "\n\n\n\n\n\n£UKR_desctext_sevastopol_naval_base_main\n\n\n\n\n\n\n\n\n[SOV.GetFlag]§Y[SOV.GetAdjective]§! §YЧерноморский флот§! базируется на нашей территории по соглашениям 1997 года, и срок аренды §YСевастопольской бухты§! истекает в §Y2017§! году.\nМы можем попытаться пересмотреть соглашение и вытеснить §Y[SOV.GetNameWithFlag]§! раньше, но наши шансы во многом зависят от нашей военной мощи, успешных закупок новой военной техники или вступления в §YНАТО§!."
 UKR_sevastopol_naval_base_terminate_bsf_lease: "§RРасторгнуть§! §Yдоговор об аренде базы§!: [SOV.GetFlag]§Y[SOV.GetAdjective]§! Черноморский флот"
 UKR_sevastopol_naval_base_terminate_bsf_lease_desc: "\n\n\n\n\n\n£UKR_desctext_sevastopol_lease_for_tooltip\n\n\n\n\n\n\n\n\n§WПо соглашениям 1997 года [SOV.GetFlag]§Y[SOV.GetAdjective]§! флот может оставаться в §YСевастополе§! до 2017 года. Мы можем уведомить §YМоскву§! о досрочном расторжении аренды и потребовать передать нам базу.\n\nЕсли Россия согласится, §YСевастопольская бухта§! §Gвернётся под наш контроль§!. В противном случае §Rотношения с Россией ухудшатся§!, но аренда всё равно истечёт в §Y2017§! году§!.$UKR_sevastopol_russia_answer$"
 UKR_sevastopol_naval_base_prepare_kharkiv_pact: "Подготовка к Харьковским соглашениям"
 UKR_sevastopol_naval_base_prepare_kharkiv_pact_desc: "\n\n\n\n\n\n£UKR_desctext_kharkiv_pact_for_tooltip\n\n\n\n\n\n\n\n\n§WМосква предлагает продлить аренду базы §YЧерноморским флотом§! в обмен на более дешёвый газ. Мы должны решить, подписать ли соглашение или дать аренде истечь в 2017 году.\n\n§RПодписание продлит аренду до§! §Y2042§! года. §GОтказ позволит потребовать вернуть бухту в§! §Y2017§! году, §Rхотя Россия может начать из-за этого войну§!.$UKR_sevastopol_russia_answer$§!"
 UKR_sevastopol_russia_answer: "\n\n§WКак §Y[SOV.GetNameWithFlag]§! ответит на наше требование?\n§Y[SOV.GetNameWithFlag]§! может §Gвывести флот§!, §Yотказать§! или §Rобъявить войну§!.\nКогда мы станем членом §YНАТО§!, останется только вывод флота.\nКаждое из следующих условий делает §Gвывод флота вероятнее§!, а §Gвойну менее вероятной§!:\n---§CФокусы§!---\n- §Y$UKR_sapsan$§! [UKR_sevastopol_status_sapsan]\n- §Y$UKR_hur_reform$§! [UKR_sevastopol_status_hur_reform]\n- §Y$UKR_ukrainian_armed_forces_reform$§! или §Y$UKR_poroshenko_army_reform$§! [UKR_sevastopol_status_army_reform]\n---§OРешения§!---\n- ОБТ §YОбъект 477А1 «Нота»§! [UKR_sevastopol_status_nota]\n- корветы §Yпроекта 58250 «Владимир Великий»§! [UKR_sevastopol_status_58250]\n- самолёты §YАн-LBL§! или §YАн-BFV§! [UKR_sevastopol_status_an_aircraft]\n\nЕсли [SOV.GetFlag]§Y[SOV.GetAdjective]§! военный потенциал ослабнет или в §YМоскве§! будет демократическое правительство, война тоже станет менее вероятной.§!"
 ukraine_sevastopol.1.name: "Киев требует вернуть Севастополь"
 ukraine_sevastopol.1.desc_nato: "Украина теперь член НАТО и требует вернуть Севастопольскую бухту. Отказ означал бы прямое противостояние с Альянсом."
 ukraine_sevastopol.1.desc_early: "Украина уведомила нас о досрочном расторжении аренды базы Черноморского флота и требует передать ей базу. Соглашения 1997 года этого не предусматривают, но Киев настаивает."
 ukraine_sevastopol.1.desc_nato_prep: "Несмотря на продлённую аренду, Киев движется к НАТО и требует вернуть Севастопольскую бухту. Альянс пока не дал Украине никаких гарантий."
 ukraine_sevastopol.1.desc_expiry: "Срок аренды базы Черноморского флота истёк, и Киев требует вернуть Севастопольскую бухту."
 ukraine_sevastopol.1.a: "Вывести флот"
 ukraine_sevastopol.1.b: "Отклонить требование"
 ukraine_sevastopol.1.c: "Севастополь останется российским, силой"
 ukraine_sevastopol.2.name: "Севастополь возвращается Украине"
 ukraine_sevastopol.2.desc: "Российский флот ушёл, и база в Севастопольской бухте снова в украинских руках."
 ukraine_sevastopol.2.a: "Исторический день"
 ukraine_sevastopol.3.name: "Россия отказывается покинуть Севастополь"
 ukraine_sevastopol.3.desc: "Москва отклонила наше требование и настаивает, чтобы Черноморский флот остался в Севастополе. Пока она не прибегла к силе."
 ukraine_sevastopol.3.a: "Мы этого не забудем"
 ukraine_sevastopol.4.name: "Россия отказывает и вторгается"
 ukraine_sevastopol.4.desc: "Москва отклонила наше требование вернуть Севастопольскую бухту и объявила войну. НАТО не дало нам никаких гарантий."
 ukraine_sevastopol.4.a: "К оружию"
