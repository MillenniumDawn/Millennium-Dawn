 ukraine_equipment_develop_domestic_atgm.11.d: "제안을 거절한다"
 ukraine_equipment_develop_domestic_atgm.12.d: "제안을 거절한다"
 ukraine_equipment_develop_domestic_atgm.14.name: "§Y[From.GetNameWithFlag]§!이(가) §Y'스키프'§!를 구매"
 ukraine_equipment_develop_domestic_atgm.14.desc: "§Y[From.GetNameWithFlag]§!이(가) §Y'스키프'§! 계약에 서명했습니다. 미사일이 출발했고, 대금도 들어옵니다."
 ukraine_equipment_develop_domestic_atgm.14.a: "좋은 거래다"
 ukraine_equipment_develop_domestic_atgm.15.name: "§Y[From.GetNameWithFlag]§!이(가) §Y'스키프'§!를 거절"
 ukraine_equipment_develop_domestic_atgm.15.desc: "§Y[From.GetNameWithFlag]§!이(가) 우리의 §Y'스키프'§! 제안을 거절했습니다."
 ukraine_equipment_develop_domestic_atgm.15.a: "아쉽군"
 UKR_Rafale: "라팔"
 UKR_Rafale_desc: "우리 공군은 노후한 소련제 항공기를 대체할 전력 갱신이 필요하며, 프랑스제 라팔 전투기를 구매할 수 있습니다. 라팔은 공중 우세, 대지 공격, 정찰 임무를 모두 수행할 수 있는 다목적 항공기입니다."
 UKR_grippen: "JAS 39 그리펜"
 UKR_grippen_desc: "우리 공군은 전력 갱신이 필요하며, 그리펜이 최선의 선택이 될 것입니다. 공중 우세, 대지 공격, 정찰 임무를 모두 수행할 수 있는 다목적 항공기입니다. 그리펜은 낮은 운용 비용과 정비 용이성으로도 잘 알려져 있습니다."
 UKR_An178: "An-178 개발"
 UKR_An178_desc: "An-178은 안토노프가 개발한 중형 군용 수송기입니다. An-148 지역 여객기를 기반으로 새로 설계했으며, 화물을 싣고 내리는 후방 램프를 갖추고 있습니다. An-178은 우크라이나 공군에서 운용 중인 노후한 안토노프 수송기들을 대체하기 위해 설계되었습니다."
 UKR_ukrainian_swedish_cooperation: "우크라이나-스웨덴 협력"
 UKR_ukrainian_french_cooperation: "우크라이나-프랑스 협력"
 UKR_trade_ukrainian_swedish_cooperation: "우크라이나-스웨덴 무역 협력"
 UKR_trade_ukrainian_french_cooperation: "우크라이나-프랑스 무역 협력"
 UKR_an178_development.1.t: "An-178 계획"
 UKR_an178_development.1.d: "우크라이나의 수송 항공 전력은 노후화되었고 낡은 기종에 갈수록 의존하고 있습니다. 이에 안토노프는 현대적인 중형 수송기로서 An-178을 제안했고, 3년째 개발을 구상해 왔습니다. 낡은 기종을 대체하고 자국 항공우주 역량을 강화하기 위한 이 사업은 군사적 기회이자 산업적 기회이기도 합니다."
 UKR_an178_development.1.a: "예산을 더 배정한다"
 UKR_an178_development.2.t: "An-178 엔진 선정"
 UKR_an178_development.2.d: "An-178 개발에서 가장 중요한 결정 중 하나는 동력 장치의 선정입니다. 이 기체는 원래 D-436 계열에서 파생된, 검증된 엔진인 D-436-148FM 터보팬을 중심으로 설계되었습니다. 하지만 제안된 AI-28은 첨단 기어드 터보팬 설계 덕분에 더 큰 추력과 향상된 연료 효율을 제공하는, 보다 야심 찬 대안입니다. 개발에 훨씬 많은 시간과 자금이 들겠지만, 기체의 전반적인 성능을 크게 끌어올릴 수 있습니다."
 UKR_an178_development.2.a: "검증된 D-436-148FM을 유지한다"
 UKR_an178_development.2.b: "차세대 AI-28에 투자한다"
 UKR_an178_development.3.t: "An-178 항공전자장비 선정"
 UKR_an178_development.3.d: "동력 장치가 정해졌으니 이제 기체의 항공전자장비로 눈을 돌려야 합니다. 우크라이나에는 자체 항공전자 시스템을 개발할 전문성이 있지만, 그러려면 추가 투자와 시간이 필요합니다. 반대로 러시아 제조사와 협력하면 이미 검증된 항공전자 솔루션을 확보하고 개발을 앞당길 수 있지만, 그만큼 외국 기술에 대한 의존이 커집니다."
 UKR_an178_development.3.a: "러시아 제조사와 협력한다"
 UKR_an178_development.3.b: "자체 항공전자장비를 개발한다"
 UKR_an178_development.4.t: "An-178 시험"
 UKR_an178_development.4.d: "An-178 사업이 핵심 개발 단계에 들어섰습니다. 충분한 자금 지원 여부에 따라 시험의 범위와 양산 준비 수준, 그리고 기체의 장기적 신뢰성이 좌우될 것입니다."
 UKR_an178_development.4.a: "기본적인 자금을 배정하고 시험을 제한한다"
 UKR_an178_development.4.b: "충분한 자금을 투입하고 전면적인 시험을 진행한다"
 UKR_an178_development.5.t: "An-178 실전 배치"
 UKR_an178_development.5.d: "수년간의 개발과 시험 끝에 An-178이 시험 평가를 성공적으로 마치고 실전 배치 준비를 끝냈습니다. 이 기체는 우크라이나의 수송 항공 전력을 강화하고 병참의 유연성을 높이며, 자국 항공우주 산업의 중대한 성과로 기록될 것입니다."
 UKR_an178_development.5.a: "An-178을 실전 배치한다"
