 helo_ops_tech: "헬리콥터 작전"
 helo_ops_tech_desc: "국가가 공중기동 작전을 수행하기 위한 이론과 실무입니다."
 nsb_drone_tech_1: "초기 드론 기술"
 nsb_drone_tech_1_desc: "헬리콥터에 탑재되는 드론 무기로, 공격과 방어 임무 모두에 사용됩니다."
 nsb_drone_tech_2: "현대 드론 기술"
 nsb_drone_tech_2_desc: "헬리콥터에 탑재되는 드론 무기로, 공격과 방어 임무 모두에 사용됩니다."
 nsb_drone_tech_3: "미래 드론 기술"
 nsb_drone_tech_3_desc: "헬리콥터에 탑재되는 드론 무기로, 공격과 방어 임무 모두에 사용됩니다."
 nsb_defense_tech_1: "IRCM 체계"
 nsb_defense_tech_1_desc: "열추적 미사일의 탐색기를 교란하도록 설계된 기본적인 적외선 대응 체계입니다. 회전식 적외선 재머로 거짓 신호를 방출하여 미사일의 조준 정확도를 떨어뜨립니다. 초기 세대의 휴대용 방공 시스템(MANPADS)에는 효과적이나 현대적 위협에는 한계가 있습니다."
 nsb_defense_tech_2: "MAWS"
 nsb_defense_tech_2_desc: "미사일 접근 경보 체계입니다. 자외선 또는 적외선 추적으로 날아오는 미사일의 발사를 탐지하는 센서 체계로, 플레어나 채프와 같은 대응 수단의 전개를 자동으로 작동시킵니다. 유도 미사일 위협에 대한 수동적 상황 인식을 제공합니다."
 nsb_defense_tech_3: "첨단 MAWS 및 DIRCM"
 nsb_defense_tech_3_desc: "미사일 경보 기능과 지향성 적외선 대응 수단(DIRCM)을 결합한 현대적 미사일 방어 체계입니다. 포탑형 레이저로 날아오는 적외선 유도 미사일을 추적하고 교란합니다. 고도화된 휴대용 방공 시스템과 견착식 위협에 대한 생존성을 크게 높여 줍니다."
 nsb_light_nose_gun_tech_1: "초기형 기수 장착형 기관총"
 nsb_light_nose_gun_tech_1_desc: "헬리콥터에 직사 화기 체계를 부여하도록 설계된, 기수에 장착된 기관포입니다."
 nsb_light_nose_gun_tech_2: "현대형 기수 장착형 기관총"
 nsb_light_nose_gun_tech_2_desc: "헬리콥터에 직사 화기 체계를 부여하도록 설계된, 기수에 장착된 기관포입니다."
 nsb_light_nose_gun_tech_3: "Advanced Nose Mounted Guns"
 nsb_light_nose_gun_tech_3_desc: "헬리콥터에 직사 화기 체계를 부여하도록 설계된, 기수에 장착된 기관포입니다."
 nsb_gun_pods_tech_1: "1세대 건 포드"
 nsb_gun_pods_tech_1_desc: "회전익 항공기의 공격 능력을 강화하기 위해 설계된 외부 장착형 무기 시스템입니다. 이 포드를 사용하면 기체를 크게 개조하지 않고도 헬기에 추가 무장을 탑재할 수 있어 다양한 임무에 유연하게 대응하고 화력을 높일 수 있습니다."
 nsb_gun_pods_tech_2: "2세대 건 포드"
