 space_combat_support_force: "우주군 지원단"
 space_efforts: "우주 개발 투자"
 government_popularity_modifier: "정부 정책의 영향"
 USA_usaid_idea_tt: "기타 수입: 인구 10M 당$ $§G0.004§!"
