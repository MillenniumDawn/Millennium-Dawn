 NKO_naval_focus_submarine_track_tt: "§HSongun Морская доктрина Подводное наступление§!\n• Очки наращивания военно-морского флота: §G+3§!\n• §YПодводные силы§! прогресс: §G+15§! (к следующему уровню)\n• Добавляет §HИмпульс учений подводных сил§! идею на §Y90§! дней\n §L+5% организация флота, +5% максимальная дальность флота, +10% получение опыта флота§!\n• Бюро подводных лодок открывает характеристики MIO: §YПроизводство подводных лодок§! и §YМатериалы для покрытия§!\n• Переключение уровней при §Y25§!/§Y50§!/§Y75§!/§Y100§! проверка прогресса при следующем §HИнвестируйте в подводные силы§! клике\n• Запускает одноразовое событие §HКорпуса отечественных подводных лодок обретают форму§!"
 NKO_naval_focus_strategy_tt: "§H Стратегический толчок военно-морской доктрины Сонгуна §!\n• Очки наращивания военно-морского флота: §G+5§!\n• §YПрогресс всех четырех направлений§!: §G+5§! (Подводная лодка, Ракетный катер, Береговая оборона, Морской спецназ)\n• Добавляет идею §HИмпульс военно-морской стратегии§! на §Y180§! дней\n §L-10% стоимость военно-морской доктрины, +15% получение опыта флота, +5% организация флота§!\n• Бюро подводных лодок открывает особенность MIO: §YДвигатель поддержки Department§!\n• Бюро эсминцев открывает особенность MIO: §YСовременная тяжелая броня§!\n• Смена уровней происходит при следующем щелчке §HInvest§! для каждой колеи после достижения §Y25§!/§Y50§!/§Y75§!/§Y100§!\n• Запускает одноразовое событие §HA Стратегическая доктрина для моря§!"
 NKO_naval_focus_destroyer_buildup_tt: "§HНаращивание флота эсминцев по доктрине Сонгуна§!\n• Очки наращивания флота: §G+3§!\n• §YФлотилии ракетных катеров§! прогресс: §G+15§! (к следующему уровню)\n• §YСеть береговой обороны§! прогресс: §G+5§!\n• Добавляет §HИмпульс роя ракетных катеров§! идею на §Y90§! дней\n §L+5% скорости флота, +10% атаки с моря, +10% к приросту опыта флота §!\n• Бюро эсминцев открывает характеристики MIO: §Y Производство тяжелых кораблей §! и §Y Инвестиции в живучесть §!\n• Смена уровней происходит при следующем щелчке §HИнвестиции§! для каждого трека после достижения §Y25§!/§Y50§!/§Y75§!/§Y100§!\n• Запускает одноразовое событие §HПервые отечественные эсминцы §!"
 NKO_naval_focus_destroyer_unleashed_tt: "§HSongun Эсминец военно-морской доктрины в действии §!\n• Очки наращивания военно-морского флота: §G+5§!\n• §Y Флотилии ракетных катеров§! прогресс: §G+20§! (к следующему уровню)\n• §Y Сеть береговой обороны§! прогресс: §G+10§!\n• Добавляет §H Импульс роя ракетных катеров§! идею на §Y180§! дней\n §L+5% скорости флота, +10% атаки с моря, +10% к получению опыта флота §!\n• Бюро эсминцев открывает особенности MIO: §YНаземная боевая поддержка §! и §YЗенитные батареи §!\n• Смена уровней происходит при следующем щелчке §HИнвестиции§! для каждой колеи после достижения §Y25§!/§Y50§!/§Y75§!/§Y100§!\n• Запускает одноразовое событие §HЭскадрильи эсминцев на свободе §!"
 NKO_naval_focus_missile_boat_track_tt: "Если разблокирована военно-морская доктрина §HSongun§!: очки наращивания военно-морского флота §G+3§! и флотилия ракетных катеров §G+10§! продвигаются вперед, при этом при пересечении уровней запускаются соответствующие события."
 NKO_naval_focus_coastal_defense_track_tt: "Если разблокирована военно-морская доктрина §HSongun§!: увеличиваются очки наращивания военно-морского флота §G+3§! и сеть береговой обороны §G+10§!, при этом при пересечении уровней запускаются соответствующие события."
 NKO_naval_focus_specops_track_tt: "Если разблокирована военно-морская доктрина §HSongun§!: начисляются очки военно-морского развития §G+3§! и проводятся специальные военно-морские операции §G+10§!, при этом при пересечении уровней запускаются соответствующие тематические события."
 NKO_naval_capstone_news_tt: "Трансляции §Hкрупное новостное событие§!: §Y«Морской пояс Пхеньяна сформирован»§!   Отмечено на родине, отмечено за рубежом."
 NKO_naval_allocate_party_funds: "Распределить партийные средства"
 NKO_naval_allocate_party_funds_desc: "Незаметно перенаправить партийные стипендии на военно-морскую программу. Надежный поток ресурсов, но требующий политического капитала."
 NKO_naval_mobilize_nampo_shipyards: "Мобилизация верфей Нампо"
 NKO_naval_mobilize_nampo_shipyards_desc: "Занять гражданский завод в Нампо на три месяца сверхурочной работы по изготовлению деталей. После завершения работ верфь вознаградит нас дополнительными баллами за наращивание производства."
 NKO_naval_juche_drive: "Начать морскую кампанию в духе чучхе"
 NKO_naval_juche_drive_desc: "Национальная мобилизация флота. Верфи работают на полную мощность полгода, пока гражданская экономика покрывает расходы, и программа сразу же получает множество баллов. Для поддержания требуется стабильный внутренний фронт."
 NKO_naval_invest_submarine: "Инвестируйте в подводные силы."
 NKO_naval_invest_submarine_desc: "Потратьте одно очко развития флота, чтобы продвинуться по пути модернизации подводных лодок. Экипажи получают новый опыт флота по мере совершенствования проектов. Прохождение этапов §Y25§!, §Y50§!, §Y75§! и §Y100§! открывает следующий уровень модернизации подводных лодок."
 NKO_naval_invest_missile_boat: "Инвестируйте в флотилии ракетных катеров."
 NKO_naval_invest_missile_boat_desc: "Потратьте одно очко развития флота, чтобы расширить программу ракетных катеров. Каждый цикл модернизации повышает эффективность наших прибрежных ударов. Достижение прогресса по §Y25§!, §Y50§!, §Y75§! и §Y100§! открывает следующий уровень ракетных катеров."
 NKO_naval_invest_coastal_defense: "Инвестируйте в сеть береговой защиты."
 NKO_naval_invest_coastal_defense_desc: "Потратьте одно очко наращивания военно-морского потенциала, чтобы укрепить береговую линию. Бункерные экипажи и береговые батареи получают опыт. Пересечение уровней §Y25§!, §Y50§!, §Y75§! и §Y100§! открывает следующий уровень береговой обороны."
 NKO_naval_invest_specops: "Инвестируйте в военно-морские специальные операции."
 NKO_naval_invest_specops_desc: "Потратьте одно очко развития военно-морского флота на обучение водолазов разведывательного бюро и морской пехоты. Спецназ оттачивает свои навыки десантирования. Пересечение заданий §Y25§!, §Y50§!, §Y75§! и §Y100§! открывает следующий уровень специальных операций военно-морского флота."
 NKO_naval_capstone_complete: "Создайте морской пояс"
 NKO_naval_capstone_complete_desc: "Все четыре направления достигли финального этапа. Объявите военно-морскую доктрину Сонгун завершенной и предоставьте стране ее постоянный бонус."
 NKO_songun_navy_capstone: "Морская доктрина Сонгун"
 NKO_songun_navy_capstone_desc: "Многолетняя целенаправленная подготовка позволила создать целостный асимметричный военно-морской флот. Подводные лодки дальнего действия, многочисленные ракетные катера, эшелонированная береговая оборона и элитные подразделения специального назначения ВМС теперь действуют как единая доктрина."
 NKO_sub_drill_momentum: "Импульс учений подводных сил"
 NKO_sub_drill_momentum_desc: "Недавние учения подняли моральный дух и укрепили дисциплину во время молчаливой службы."
 NKO_mb_swarm_momentum: "Импульс роя ракетных катеров"
 NKO_mb_swarm_momentum_desc: "После последних учений флотилии охвачены волной уверенности."
 NKO_cd_bunker_momentum: "Пояс бункера: повышенная готовность"
 NKO_cd_bunker_momentum_desc: "Береговые гарнизоны приведены в состояние повышенной боевой готовности; инженерные войска удвоили темпы работ по укреплению."
 NKO_so_recon_momentum: "Темп работы разведывательного бюро"
 NKO_so_recon_momentum_desc: "Разведывательное бюро постоянно использует ротацию групп боевых пловцов и кадров военно-морских сил специального назначения."
 NKO_naval_strategy_momentum: "Импульс военно-морской стратегии"
 NKO_naval_strategy_momentum_desc: "Единая стратегическая доктрина активизировала все военно-морские ведомства. Исследования, обучение и организация флота — все они выигрывают от обновленного чувства целеустремленности."
 NKO_sub_tier_1: "Модернизация Санг-О"
 NKO_sub_tier_1_desc: "Ремонт и обучение экипажей на всех подводных лодках прибрежного флота «Санг-О»."
 NKO_sub_tier_2: "Программа карликов Йоно"
 NKO_sub_tier_2_desc: "Бомбардировщики класса «Йоно» и усовершенствованные гидролокационные средства противодействия расширяют наши возможности."
 NKO_sub_tier_3: "Капитальный ремонт \"Ромео-класса\""
 NKO_sub_tier_3_desc: "Корпуса судов типа «Ромео» получили новую электронику, аккумуляторы и более тихую силовую установку."
 NKO_sub_tier_4: "Программа баллистических ракет подводного базирования Синпо"
 NKO_sub_tier_4_desc: "Подводные лодки класса «Синпо» относятся к семейству «Пукгуксонг». Стратегическая дальность, реальное сдерживание."
 NKO_mb_tier_1: "Komar Refits"
 NKO_mb_tier_1_desc: "Старые корпуса кораблей типа «Комар» получили новые пусковые установки и модернизированные двигатели."
 NKO_mb_tier_2: "Производство соджу и нонго"
 NKO_mb_tier_2_desc: "В эксплуатацию поступает все большее количество ракетных катеров отечественного производства Soju и Nongo."
 NKO_mb_tier_3: "Интеграция Kumsong-3 ASCM"
 NKO_mb_tier_3_desc: "Противокорабельные крылатые ракеты «Кумсонг-3» обеспечивают нашим флотилиям мощный удар на больших дистанциях."
 NKO_mb_tier_4: "Доктрина Волчьей стаи"
 NKO_mb_tier_4_desc: "Скоординированная тактика массированных атак: залповые запуски, многоуровневое радиоэлектронное противодействие и использование катеров-приманок."
 NKO_cd_tier_1: "Бункерный пояс"
 NKO_cd_tier_1_desc: "Непрерывная цепь укрепленных бункеров вдоль восточного и западного побережья."
 NKO_cd_tier_2: "Мобильная береговая артиллерия"
 NKO_cd_tier_2_desc: "Установленные на грузовиках батареи перемещаются между подготовленными позициями для отражения контрбатарейного огня."
 NKO_cd_tier_3: "Укрепленные мысы"
 NKO_cd_tier_3_desc: "На стратегически важных мысах проложены глубокие туннели, установлены укрепленные склады боеприпасов и интегрированы радары."
 NKO_cd_tier_4: "Береговые противокорабельные ракеты"
 NKO_cd_tier_4_desc: "Мобильные пусковые установки «Кумсонг» лишают флоты противника права приближаться к нашему побережью."
 NKO_so_tier_1: "Разведывательное бюро, боевые пловцы"
 NKO_so_tier_1_desc: "Группы боевых пловцов Главного разведывательного управления расширяют свой тренировочный и материально-технический резерв."
 NKO_so_tier_2: "Бригада морских снайперов"
 NKO_so_tier_2_desc: "Специализированная бригада морских снайперов специализируется на быстрых рейдах вдоль побережья."
 NKO_so_tier_3: "Морская легкая пехота"
 NKO_so_tier_3_desc: "Батальоны легкой пехоты реорганизованы с включением морского подразделения для проведения десантных операций."
 NKO_so_tier_4: "Штурмовой корпус ВМС"
 NKO_so_tier_4_desc: "Подразделения штурмового корпуса получают постоянные военно-морские присоединения. Наш передовой отряд простирается до любого берега."
 nko_naval_buildup.1.t: "Военно-морская доктрина для новой эпохи"
 nko_naval_buildup.1.d: "Генеральный штаб подготовил долгосрочный план: четыре параллельных направления, развивающиеся за счет накопленных очков военно-морского строительства. Три решения приносят очки; четыре решения об инвестировании их расходуют. Достигните финального уровня на каждом направлении, чтобы сформировать военно-морскую доктрину Сонгун."
 nko_naval_buildup.1.a: "Мы будем руководить программой."
 nko_naval_buildup.11.t: "Команда Sang-O активизировалась"
 nko_naval_buildup.11.d: "На ремонтных верфях устраняют накопившуюся очередь корпусов Sang-O. Экипажи тренируются круглосуточно, и растет уверенность в бесшумной работе этих судов."
 nko_naval_buildup.11.a: "Вперёд."
 nko_naval_buildup.12.t: "Карлики Йоно проскользнули сквозь сетки"
 nko_naval_buildup.12.d: "Беспилотники класса «Йоно» успешно проводят учения против наших береговых радаров, ускользая от линий обнаружения, которые должны были бы их обнаружить."
 nko_naval_buildup.12.a: "Настоящее преимущество."
 nko_naval_buildup.13.t: "Ромео переделывает медвежий фрукт"
 nko_naval_buildup.13.d: "Модернизированные катера Romeo теперь патрулируют на больших расстояниях и бесшумно, что было невозможно с точки зрения их первоначальных проектировщиков."
 nko_naval_buildup.13.a: "Отличный."
 nko_naval_buildup.14.t: "Поверхности Синпо"
 nko_naval_buildup.14.d: "Подводная лодка класса «Синпо» вскрылась в срок, подводные аппараты «Пукгуксонг» установлены и испытаны. Стратегическое сдерживание больше не мечта."
 nko_naval_buildup.14.a: "Слава программе!"
 nko_naval_buildup.21.t: "Ремонтные работы в Комаре завершены."
 nko_naval_buildup.21.d: "Стареющие корпуса кораблей типа «Комар» покидают верфи с новыми пусковыми установками, модернизированными двигателями и, на удивление, энергичными экипажами."
 nko_naval_buildup.21.a: "Отличное начало."
 nko_naval_buildup.22.t: "Формируются флотилии соджу и нонго."
 nko_naval_buildup.22.d: "Формируются первые специализированные флотилии для перевозки соджу и нонго. Более быстрые, более компактные и гораздо более опасные, чем предыдущие."
 nko_naval_buildup.22.a: "Продолжайте."
 nko_naval_buildup.23.t: "«Кумсонг-3» выходит в море"
 nko_naval_buildup.23.d: "Противокорабельные ракеты «Кумсонг-3» завершили заключительные корабельные испытания. Теперь наши флотилии могут наносить удары на таких дистанциях, с которыми противнику будет сложно справиться."
 nko_naval_buildup.23.a: "Дальность действия увеличена."
 nko_naval_buildup.24.t: "Принята доктрина «Волчьей стаи»."
 nko_naval_buildup.24.d: "Запуски залпами, многоуровневое радиоэлектронное подавление и катера-приманки: доктрина «волчьей стаи» официально принята на вооружение всего флота ракетных катеров."
 nko_naval_buildup.24.a: "Упаковка готова."
 nko_naval_buildup.31.t: "Полный комплект бункерного ремня"
 nko_naval_buildup.31.d: "Теперь вдоль обоих побережий тянется непрерывная цепь укрепленных бункеров. Местные командиры сообщают о заметном улучшении морального духа среди гарнизонов."
 nko_naval_buildup.31.a: "Не вешайте трубку."
 nko_naval_buildup.32.t: "Развернута мобильная береговая артиллерия"
 nko_naval_buildup.32.d: "Артиллерийские батареи, установленные на грузовиках, отрабатывают тактику \"стрельба и перемещение\" до тех пор, пока не смогут зачистить огневую позицию до прибытия контрбатарейных снарядов."
 nko_naval_buildup.32.a: "Дисциплинированная работа."
 nko_naval_buildup.33.t: "Укрепленные мысы"
 nko_naval_buildup.33.d: "На наиболее стратегически важных мысах проложены глубокие туннели, оборудованы укрепленные склады боеприпасов и интегрированы радары. Теперь перед разработчиками стратегии противника стоит серьезная задача — оборона побережья."
 nko_naval_buildup.33.a: "Железное побережье."
 nko_naval_buildup.34.t: "Береговые противокорабельные ракеты онлайн"
 nko_naval_buildup.34.d: "Передвижные аккумуляторные батареи Kumsong занимают прибрежные позиции. Любое приближение к нашим берегам обернется для вас серьезными последствиями."
 nko_naval_buildup.34.a: "Пусть приходят."
 nko_naval_buildup.41.t: "Расширен бассейн для водолазов."
 nko_naval_buildup.41.d: "Разведывательное управление незаметно удваивает набор водолазов и стандартизирует свое водолазное снаряжение."
 nko_naval_buildup.41.a: "Сформируйте кадровый резерв."
 nko_naval_buildup.42.t: "Бригада морских снайперов вступает в бой."
 nko_naval_buildup.42.d: "Официально сформирована специализированная бригада морских снайперов. Ее первые учения по имитированным прибрежным целям превзошли все ожидания."
 nko_naval_buildup.42.a: "Заточено."
 nko_naval_buildup.43.t: "Легкая пехота переходит на морской транспорт"
 nko_naval_buildup.43.d: "Отдельные батальоны легкой пехоты реорганизуются с включением морского компонента. Амфибийная доктрина выходит за рамки нескольких специализированных подразделений."
 nko_naval_buildup.43.a: "На любом берегу."
 nko_naval_buildup.44.t: "Штурмовой корпус выходит в море"
 nko_naval_buildup.44.d: "Подразделения штурмового корпуса получают постоянные военно-морские соединения. Наш передовой отряд теперь представляет собой настоящие сухопутные силы."
 nko_naval_buildup.44.a: "Бейте где угодно."
 nko_naval_buildup.51.t: "Военно-морские учения в Вонсане"
 nko_naval_buildup.51.d: "В подводной флотилии в Вонсане запланированы ежеквартальные учения. Экипажи ждут приказов, прежде чем отправиться в плавание."
 nko_naval_buildup.51.a: "Надавите сильно, заставьте их вспотеть."
 nko_naval_buildup.51.b: "Достаточно размеренного, размеренного темпа."
 nko_naval_buildup.51.c: "Отмена заказа, нехватка топлива и запчастей."
 nko_naval_buildup.52.t: "Обнаружено иностранное разведывательное судно"
 nko_naval_buildup.52.d: "Береговой радар зафиксировал неопознанное судно, находящееся в пределах территориальных вод, на которые мы претендуем. Командир береговой охраны требует принятия решения."
 nko_naval_buildup.52.a: "Перехватить и вернуть обратно"
 nko_naval_buildup.52.b: "Следите за ним, но не вступайте в контакт."
 nko_naval_buildup.52.c: "Отступите, избегайте инцидента"
 nko_naval_buildup.53.t: "Кризис дезертирства среди подводных лодок"
 nko_naval_buildup.53.d: "Младший офицер на борту одной из наших патрульных подводных лодок пропал без вести во время захода в порт. Разведывательное управление запрашивает разрешение на принятие мер."
 nko_naval_buildup.53.a: "Отправьте штурмовой корпус, верните или уничтожьте"
 nko_naval_buildup.53.b: "Пассивное отслеживание, без оперативного управления."
 nko_naval_buildup.53.c: "Засекретить отчет"
 nko_naval_buildup.54.t: "Склады Нампо превысили квоту."
 nko_naval_buildup.54.d: "Мастера на верфях Нампо сообщают о месяце, в котором они превысили план. Рабочие полны энергии, но устали."
 nko_naval_buildup.54.a: "Публично наградите их дополнительной порцией еды."
 nko_naval_buildup.54.b: "Требуйте больше, квота всегда была низкой."
 nko_naval_buildup.56.t: "Контрабандистское судно задержано"
 nko_naval_buildup.56.d: "Береговой патруль задерживает небольшое судно, перевозящее контрабанду. Местный командир спрашивает, как поступить с добычей."
 nko_naval_buildup.56.a: "Покажите это по телевидению, пропаганда победит."
 nko_naval_buildup.56.b: "Спокойный захват, упаковать груз в колодки."
 nko_naval_buildup.56.c: "Прими взятку капитана и отвернись."
 nko_naval_buildup.60.t: "«Тихая служба» гордо возвышается"
 nko_naval_buildup.60.d: "Подводный корабль «Синпо» и его сестры возвращаются в порт, триумфально развевая вымпелы. Подводный флот Корейского народного флота достиг зрелости. Это внушительные подводные силы, защищающие Родину."
 nko_naval_buildup.60.a: "Глубины принадлежат нам."
 nko_naval_buildup.61.t: "Волки побережья"
 nko_naval_buildup.61.d: "Доктрина «Волчья стая» официально принята во всех флотилиях. Залповые катера, эшелонированная РЭБ и катера-приманки. Наши прибрежные ударные силы действуют как единый организм."
 nko_naval_buildup.61.a: "Выпустите волков."
 nko_naval_buildup.62.t: "Железный берег"
 nko_naval_buildup.62.d: "От Синуиджу до Вонсана каждый подход контролируется укрепленными бункерами, мобильной артиллерией и береговыми противокорабельными ракетами. Ни один флот не сможет закрыть наше побережье без потерь."
 nko_naval_buildup.62.a: "Стена стоит."
 nko_naval_buildup.63.t: "От Штормового корпуса к морю"
 nko_naval_buildup.63.d: "Подразделения штурмового корпуса занимают свое место в боевом порядке на море. Разведывательное бюро, морские снайперы, водолазы и легкая морская пехота теперь образуют единый элитный передовой отряд, способный нанести удар по любому берегу."
 nko_naval_buildup.63.a: "Бейте где угодно."
 nko_naval_buildup.70.t: "Стратегическая доктрина для моря"
 nko_naval_buildup.70.d: "Военно-морское бюро Генерального штаба утверждает единую доктрину: строевая оборона из подводных лодок, массированные ракетные катера, укрепленные береговые линии и военно-морские коммандос, действующие согласованно. Теперь все верфи, базы и учебные заведения работают в одном направлении."
 nko_naval_buildup.70.a: "Все силы направлены на программу."
 nko_naval_buildup.71.t: "Первые отечественные эсминцы сошли с якоря."
 nko_naval_buildup.71.d: "На верфях Нампо и Вонсан спускают на воду первые за многие годы ракетные эсминцы отечественной постройки. Экипажи наводняют новые корпуса, готовясь к боевым действиям. Надводный флот снова чувствует себя оживлённым."
 nko_naval_buildup.71.a: "Отправьте их в море."
 nko_naval_buildup.72.t: "Принимаются окончательные решения относительно корпусов отечественных подводных лодок."
 nko_naval_buildup.72.d: "Верфи выпускают новые ударные катера в сжатые сроки. Экипажи, прошедшие подготовку на более старых корпусах Sang-O и Romeo, переводятся на новые платформы, что ускоряет процесс квалификации."
 nko_naval_buildup.72.a: "Тихо, в глубину."
 nko_naval_buildup.73.t: "Эскадрильи эсминцев выпущены на свободу"
 nko_naval_buildup.73.d: "В состав Восточного флота развертывается целая эскадра эсминцев, построенных и укомплектованных экипажами на территории США. В сочетании с флотилиями ракетных катеров, прошедших подготовку в рамках программы «Волчья стая», надводный боевой порядок становится серьезным сдерживающим фактором."
 nko_naval_buildup.73.a: "Пусть эскадрильи двигаются вперед."
 nko_naval_buildup.74.t: "Пробуждение современного флота"
 nko_naval_buildup.74.d: "Корпус эсминца 2005 года постройки и ударная подводная лодка класса 1995 года одновременно прибыли на наши верфи, получившие квалификацию §YChoe Hyon Class§! и §YSinpo Class§!. Пять экземпляров каждого класса уже доставлены на склад, и на верфях в Нампо и Вонсане уже заложены специализированные производственные линии для обоих классов. За производство отвечают §HSubmarine Bureau§! и §HSurface Ship Bureau§!.\n\nДостижение этого этапа открывает возможности для получения характеристик MIO позднего уровня в обоих бюро: §YSea-To-Land Weapons§!, §YModern Materials§! и §YRefined Submarine Design§! в бюро подводных лодок, а также §YOptimized Production§! и §YHigh Scale Radar Technology§! в бюро надводных кораблей."
 nko_naval_buildup.74.a: "Начинается эра стали."
 nko_naval_buildup.99.t: "Морской пояс Пхеньяна сформирован"
 nko_naval_buildup.99.d: "После многих лет целенаправленных усилий Корейский народный флот завершил разработку военно-морской доктрины Сонгун. Подводные лодки дальнего действия, многочисленные ракетные катера, эшелонированная береговая оборона и элитные подразделения специального назначения ВМС действуют как единое целое. Асимметричный флот — это реальность."
 nko_naval_buildup.99.a: "Морской пояс выкован."
 nko_naval_buildup.99.b: "Военно-морской флот Пхеньяна модернизируется."
 NKO_naval_modern_fleet_milestone: "Ввести в строй современный флот"
 NKO_naval_modern_fleet_milestone_desc: "И ударная подводная лодка класса «Синпо», и эсминец класса «Чхве Хён» достигли стадии производственной готовности. Необходимо ввести в строй первые пять корпусов каждой из них, создать специализированные производственные линии и выделить средства обоим военно-морским управлениям."
 NKO_more_arms_factories_desc: "Военная промышленность не может стоять на месте. Будут построены новые оружейные заводы, чтобы обеспечить снабжение Корейской народной армии и укрепить линию Сонгун."
 NKO_spa_focus_lifts_industry_tt: "§GПостоянно снимает штраф за статус §!§Y'Промышленная стагнация'§!§G.§!"
 NKO_spa_focus_lifts_production_tt: "§GПостоянно снимает штраф за статус §!§Y'Замедление производственной линии'§!§G.§!"
 NKO_spa_focus_lifts_military_tt: "§GПостоянно снимает штраф за статус §!§Y'Hollow Force'§!§G.§!"
 NKO_spa_focus_lifts_economy_tt: "§GУдаляет навсегда §!§Y«Накопление ресурсов»§!§G штраф за нарушение правил.§!"
 NKO_spa_focus_lifts_research_tt: "§GПостоянно снимает штраф за статус §!§Y'Застой в исследованиях'§!§G.§!"
 NKO_spa_focus_lifts_agriculture_tt: "§GПостоянно снимает штраф за репутацию §!§Y «Самостоятельное сельское хозяйство»§!§G.§!"
 NKO_spa_focus_lifts_foreign_tt: "§GПостоянно снимает штраф за статус §!§Y'Дипломатическая изоляция'§!§G.§!"
 NKO_spa_focus_lifts_construction_tt: "§GУдаляет навсегда §!§Y«Строительный затор»§!§G Штраф за нарушение правил (оборонительная инфраструктура).§!"
 NKO_spa_umbrella: "Верховное народное собрание"
 NKO_spa_umbrella_desc: "Верховный народный совет позволяет вам сохранить §Yдо двух мандатов на повышение производительности§! Действует немедленно. Каждый мандат приостанавливает действие одного из восьми хронических нарушений централизованного планирования. §Y365 дней§! и применяет собственный бонус; когда один бонус истекает, его место освобождается для другого. Штрафы за отсутствие статуса можно снять навсегда, выполнив соответствующие задания."
 NKO_spa_debuff_industry: "Промышленная стагнация"
 NKO_spa_debuff_industry_desc: "Десятилетия централизованного распределения ресурсов привели к тому, что заводы испытывают острую нехватку сырья и квалифицированной рабочей силы. Строительство застопорилось."
 NKO_spa_debuff_production: "Загрязнение производственной линии"
 NKO_spa_debuff_production_desc: "Инструменты изношены, цепочки поставок импровизированы, а контроль качества осуществляется так, как захочется мастеру этим утром."
 NKO_spa_debuff_military: "Полая Сила"
 NKO_spa_debuff_military_desc: "На бумаге Корейская народная армия насчитывает миллионы человек. На практике же подготовка — это театрализованное представление, а моральный дух шаткий."
 NKO_spa_debuff_economy: "Накопление ресурсов"
 NKO_spa_debuff_economy_desc: "Руководители провинций довольствуются тем, что поступает в их округа. Централизованно выделяемые ресурсы поступают с опозданием, в недостаточном объеме или не поступают вовсе."
 NKO_spa_debuff_research: "Застой в исследованиях"
 NKO_spa_debuff_research_desc: "Санкции, утечка мозгов и плохое лабораторное оборудование значительно замедляют даже фундаментальные исследования."
 NKO_spa_debuff_agriculture: "Натуральное сельское хозяйство"
 NKO_spa_debuff_agriculture_desc: "Кооперативные фермы производят едва достаточно продукции, чтобы прокормить свои деревни. В городах ощущается нехватка продовольствия."
 NKO_spa_debuff_foreign: "Дипломатическая изоляция"
 NKO_spa_debuff_foreign_desc: "Санкции и статус изгоя означают, что каждая дипломатическая инициатива обходится дороже, чем должна, и приносит меньше результатов, чем могла бы."
 NKO_spa_debuff_construction: "Строительный затор"
 NKO_spa_debuff_construction_desc: "Наиболее пострадавшим сектором является оборонительная инженерия. Форты разрушаются, не успев быть достроены, радиолокационные мачты устанавливаются с неполным подключением, военно-морские базы остаются недоуглубленными, а аэродромы изрыты ямами из-за плохого технического обслуживания."
 NKO_spa_resolution_industry: "Промышленное ускорение"
 NKO_spa_resolution_industry_desc: "Ассамблея издает обязательную промышленную директиву. Гражданские заводы растут быстрее, за ними следуют военные комплексы."
 NKO_spa_resolution_production: "Мандат на производство оборудования"
 NKO_spa_resolution_production_desc: "Производственные линии работают в режиме плановой перегрузки. Снимаются ограничения по эффективности; внедрение нового оборудования происходит быстрее."
 NKO_spa_resolution_military: "Резолюция Сонгун"
 NKO_spa_resolution_military_desc: "В центре внимания – принцип «военные интересы прежде всего». Графики учений ужесточаются, доктрина нападения уточняется, партия подтверждает свои приоритеты."
 NKO_spa_resolution_economy: "Чучхе самодостаточность"
 NKO_spa_resolution_economy_desc: "Стремление к самообеспечению позволяет извлечь максимум пользы из почвы и шахт. Местные ресурсы циркулируют бесперебойно."
 NKO_spa_resolution_research: "Исследовательская инициатива"
 NKO_spa_resolution_research_desc: "Все институты работают сверхурочно, а секретные лаборатории функционируют круглосуточно. Преодоление санкций и утечки мозгов — это самый дорогостоящий мандат, который может принять Ассамблея."
 NKO_spa_resolution_agriculture: "Сельскохозяйственная кампания"
 NKO_spa_resolution_agriculture_desc: "Сельскохозяйственные кооперативы перевыполняют квоты. Дефицит гражданского населения уменьшается, а заводы отмечают небольшой рост объемов производства."
 NKO_spa_resolution_foreign: "Директива по внешней политике"
 NKO_spa_resolution_foreign_desc: "Представители министерств иностранных дел рассредоточиваются. Улучшение отношений обходится дешевле, и торговые партнеры относятся к нам немного благосклоннее."
 NKO_spa_resolution_construction: "Строительный батальон"
 NKO_spa_resolution_construction_desc: "Массово мобилизованные военно-инженерные бригады прибывают на все оборонительные позиции. Форты, радары, позиции ПВО ближнего действия, аэродромы, военно-морские базы, топливные элеваторы, железные дороги и узлы снабжения возводятся с беспрецедентной скоростью."
 NKO_spa.0.t: "Собирается Верховное народное собрание"
 NKO_spa.0.d: "Товарищ Генеральный секретарь, Кабинет министров подготовил повестку дня. Собрание собралось. Восемь насущных проблем требуют внимания; мы можем в любой момент продолжить обсуждение. §Yлюбые два§! из них в соответствии с обязательным мандатом.\n\nКаждый мандат имеет свои последствия для §Y365 дней§!Когда один слот истекает, освобождается место для следующего."
 NKO_spa.0.a: "Созовите собрание."
 NKO_spa.20.t: "Стахановские герои"
 NKO_spa.20.d: "Рабочие в промышленном районе Хванхэ превзошли свои квоты в первые недели действия новой директивы. Их портреты уже развешивают по всей стране, а их руководители сообщают о резком увеличении производственных мощностей, которые будут немедленно задействованы."
 NKO_spa.20.a: "Наградите героев."
 NKO_spa.21.t: "Инновации в инструментальном обеспечении"
 NKO_spa.21.d: "Инженеры Пхеньянского завода тяжелой техники разработали новый процесс оснастки, который удваивает производительность линий по производству бронетехники. За один цикл выпуска отгружается 75 новейших шасси: танки, БМП, БТР, разведывательные машины или самоходные артиллерийские установки — в зависимости от того, какая линия была загружена на этой неделе."
 NKO_spa.21.a: "Распространить данную методику."
 NKO_spa.22.t: "Герой Республики"
 NKO_spa.22.d: "Образцовое лидерство младшего офицера во время учений Сонгун привлекло внимание Генерального штаба. Резервисты, вдохновленные этим примером, массово идут в призывные пункты."
 NKO_spa.22.a: "Рекламировать и украшать."
 NKO_spa.23.t: "Открытие месторождений полезных ископаемых"
 NKO_spa.23.d: "Геодезисты, работающие в северных горах, обнаружили ранее неизвестную жилу. Первоначальные анализы определят, какие стратегически важные ресурсы содержит это месторождение. Управление по природным ресурсам штата разрешило немедленную добычу."
 NKO_spa.23.a: "Начать извлечение."
 NKO_spa.24.t: "Побег иностранного учёного"
 NKO_spa.24.d: "Инженер-иностранец сумел обойти санкционный контроль и проникнуть в исследовательский центр КНДР. Полученные им данные ускоряют реализацию одной из приоритетных программ Государственной академии."
 NKO_spa.24.a: "Приветствуем товарища."
 NKO_spa.25.t: "Огромный урожай"
 NKO_spa.25.d: "Фермерские кооперативы в Северном Хамгёне сообщают об урожайности, значительно превышающей квоты. Запасы зерна увеличиваются; сельские вербовочные пункты заполняются молодыми сельскохозяйственными рабочими, ищущими работу в армии."
 NKO_spa.25.a: "Распределите излишки."
 NKO_spa.26.t: "Дипломатический переворот"
 NKO_spa.26.d: "Представители министерств иностранных дел использовали новую директиву для достижения тихой дипломатической победы — неофициальной уступки со стороны крупного партнера, которая выражается в получении твердой валюты."
 NKO_spa.26.a: "Зафиксируйте прибыль."
 NKO_spa.27.t: "Строительный авангард"
 NKO_spa.27.d: "Добровольческие строительные батальоны превзошли все прогнозы. Имея свободные ресурсы, правительство передает работы тому гражданскому проекту, который больше всего отстает от графика. Если же рабочей силы нет, ее можно обменять на наличные деньги."
 NKO_spa.27.factory_take: "Постройте гражданский завод."
 NKO_spa.27.factory_cash: "Ликвидировать трудовые ресурсы. (§Y+0.5§! казначейство)"
 NKO_spa.27.offices_take: "Постройте офисное здание."
 NKO_spa.27.offices_cash: "Ликвидировать трудовые ресурсы. (§Y+0.75§! казначейство)"
 NKO_spa.27.refinery_take: "Постройте завод по переработке синтетических отходов."
 NKO_spa.27.refinery_cash: "Ликвидировать трудовые ресурсы. (§Y+0.45§! казначейство)"
 NKO_spa.27.agri_take: "Создайте сельскохозяйственный район."
 NKO_spa.27.agri_cash: "Ликвидировать трудовые ресурсы. (§Y+0.45§! казначейство)"
 NKO_spa.30.t: "Пятилетний план стартовал"
 NKO_spa.30.d: "На воротах каждого завода развеваются знамена. Ассамблея постановила, что следующие 365 дней — это пятилетний план в миниатюре, с конкретными производственными квотами для каждого промышленного пояса."
 NKO_spa.30.a: "Привести план в действие."
 NKO_spa.31.t: "Квоты выполнены с опережением графика."
 NKO_spa.31.d: "На полпути выполнения директивы заводы вдоль реки Тэдон сообщают о значительном превышении запланированных объемов заливки бетона и арматуры. Рабочие бригады соревнуются за первенство."
 NKO_spa.31.a: "Наградите лучшие бригады."
 NKO_spa.32.t: "Установлены промышленные рекорды"
 NKO_spa.32.d: "Директива завершается триумфальным митингом на площади Ким Ир Сена. Производственные мощности республики пополнились новыми производственными площадками, а престиж партии резко возрос."
 NKO_spa.32.a: "Отпразднуйте это достижение."
 NKO_spa.33.t: "Поступило новое оборудование."
 NKO_spa.33.d: "Через каналы «серого рынка» запасные инструменты поступили на заводы-изготовители оборудования. Мастера производства проводят переподготовку персонала в цехах в соответствии с новыми техническими требованиями."
 NKO_spa.33.a: "Внедрить новые инструменты."
 NKO_spa.34.t: "Гудение производственных линий"
 NKO_spa.34.d: "Производственный процесс на конвейерах в Пхеньяне и Хамхуне идет наиболее стабильно за последнее десятилетие. Уровень брака снижается, качество отделки повышается."
 NKO_spa.34.a: "Настаивайте на дальнейшем совершенствовании."
 NKO_spa.35.t: "Триумф контроля качества"
 NKO_spa.35.d: "Срок действия мандата на производство оборудования истекает государственной инспекцией, которая подтверждает, что стандарты качества достигли наивысшего уровня за всю историю наблюдений. Сотрудники KPA, отвечающие за закупки, довольны."
 NKO_spa.35.a: "Задокументируйте новые стандарты."
 NKO_spa.36.t: "Учения усиливаются"
 NKO_spa.36.d: "Наступил сезон Сонгун. Во всех корпусах темп строевой подготовки удваивается. Возобновляются учения с боевой стрельбой, которые были приостановлены на годы."
 NKO_spa.36.a: "Принуждайте войска к более жёстким действиям."
 NKO_spa.37.t: "Офицерский корпус преуспевает"
 NKO_spa.37.d: "В условиях усиленной программы подготовки сформировалось новое поколение офицеров ротного и батальонного звена. Продвижение по службе распространяется по всей цепочке командования."
 NKO_spa.37.a: "Поощряйте и поощряйте."
 NKO_spa.38.t: "Триумф Сонгун"
 NKO_spa.38.d: "Резолюция Сонгун завершается парадом Великой Победы в Пхеньяне. Призыв резервистов пополнил ряды армии; Корейская народная армия находится в самом сильном состоянии за последние годы."
 NKO_spa.38.a: "Марш строем."
 NKO_spa.39.t: "Начались геологические изыскания."
 NKO_spa.39.d: "Геологические группы рассредоточиваются по северным горным районам. Старые карты советской эпохи очищаются от пыли и обновляются с помощью современных инструментов."
 NKO_spa.39.a: "Разрешить проведение опросов."
 NKO_spa.40.t: "Рост объемов добычи полезных ископаемых"
 NKO_spa.40.d: "Новые геологические исследования вывели горнодобывающие компании на месторождения с более высоким содержанием полезных ископаемых. Добыча угля, магнезита и редкоземельных элементов резко возросла."
 NKO_spa.40.a: "Воспользуйтесь преимуществом."
 NKO_spa.41.t: "Достигнута самодостаточность"
 NKO_spa.41.d: "Мандат чучхе на самообеспечение завершается пополнением валютных резервов за счет экспортных продаж. Товарищ Генеральный секретарь, Республика остается непоколебимой."
 NKO_spa.41.a: "Накопите резервы."
 NKO_spa.42.t: "Двери лаборатории открыты."
 NKO_spa.42.d: "Государственная академия наук получает звонок: все приоритетные программы разблокируются, все секретные файлы становятся доступными. Исследователи, которые годами ждали разрешения, получают доступ в течение ночи."
 NKO_spa.42.a: "Утвердите приоритеты."
 NKO_spa.43.t: "Экстренные программы приносят плоды"
 NKO_spa.43.d: "В нескольких давно застопорившихся программах Государственной академии быстро достигаются прорывы. Генеральный штаб получает информацию о том, в какой из дисциплин на этот раз произошел прорыв."
 NKO_spa.43.a: "Провести брифинг для Генерального штаба."
 NKO_spa.44.t: "Догоняющий"
 NKO_spa.44.d: "Научно-исследовательская кампания завершилась тем, что КНДР приблизилась к технологическому рубежу ближе, чем когда-либо с 1970-х годов. Партия празднует тихий триумф."
 NKO_spa.44.a: "Воспользуйтесь новым преимуществом."
 NKO_spa.45.t: "Началась весенняя посадка."
 NKO_spa.45.d: "Кооперативные фермерские хозяйства по всей стране мобилизуются для проведения интенсивной посевной кампании. Добровольческие бригады из городов оказывают поддержку сельской рабочей силе."
 NKO_spa.45.a: "Мобилизуйте бригады."
 NKO_spa.46.t: "Летний уход"
 NKO_spa.46.d: "Проведенные в середине сезона проверки показывают, что поля находятся в лучшем состоянии, чем за последние годы. Ирригационные каналы работают; из Китая поступили запасы пестицидов."
 NKO_spa.46.a: "Продолжайте прилагать усилия."
 NKO_spa.47.t: "Огромный урожай"
 NKO_spa.47.d: "Урожайность на 20% превышает план. Запасы зерна увеличиваются; впервые за многие годы в некоторых районах будет выдана полная норма выдачи зерна."
 NKO_spa.47.a: "Распределите излишки."
 NKO_spa.48.t: "Дипломатические предложения"
 NKO_spa.48.d: "Делегации КНДР незаметно направляются в дружественные столицы, предлагая выгодные условия и деликатно формулируя просьбы: Пекин, Москва, Тегеран, Дамаск."
 NKO_spa.48.a: "Отправьте послов."
 NKO_spa.49.t: "Тихие обратные каналы"
 NKO_spa.49.d: "Несколько делегаций возвращаются с тайными соглашениями: совместными предприятиями в рамках компаний-подставных лиц, инфраструктурными кредитами и негласными долями в капитале от сочувствующих иностранных партнеров. Соблюдение санкций было несколько менее строгим, чем обычно."
 NKO_spa.49.a: "Примите доставку."
 NKO_spa.50.t: "Торговые уступки"
 NKO_spa.50.d: "Директива по внешней политике завершается рядом новых положений, которые значительно улучшают приток иностранного капитала. Инвестиционные обязательства подписаны на следующее десятилетие."
 NKO_spa.50.a: "Подпишите соглашения."
 NKO_spa.51.t: "Строительный авангард мобилизуется"
 NKO_spa.51.d: "Предоставление мандата строительному батальону — это неожиданная выгода для любой внутренней фракции, которую Кабинет министров решит поддержать. Партия может направить политические дивиденды той фракции, сотрудничество которой ей нужно больше, чем другим."
 NKO_spa.51.military: "Авторство §YThe Military§!. (§G+15§! мнение)"
 NKO_spa.51.cadres: "Авторство §YCommunist Cadres§!. (§G+15§! мнение)"
 NKO_spa.51.donju: "Авторство: §YThe Donju§!. (Мнение §G+15§!)"
 NKO_spa.51.farmers: "Авторство §YFarmers§!. (Мнение §G+15§!)"
 NKO_spa.51.labour: "Кредит §YПрофсоюзы§!. (Мнение §G+15§!)"
 NKO_spa.51.none: "Присвойте себе политические заслуги. (§G+25 PP§!)"
 NKO_spa.52.t: "Места расположения по всей Республике"
 NKO_spa.52.d: "Строительные работы ведутся во всех провинциях. Выравниваются дороги, свариваются подъездные пути к железным дорогам, перекладываются линии электропередач. Это тот вид неприглядных инфраструктурных работ, которые накапливаются десятилетиями."
 NKO_spa.52.a: "Нажмите на расписание."
 NKO_spa.53.t: "Проекты завершены"
 NKO_spa.53.d: "Мандат строительного батальона завершается церемонией перерезания ленточки, транслируемой по всей Республике. Партия пожинает политические плоды; численность населения стабилизируется; казна получает небольшую прибыль за счет излишков от реализации проектов."
 NKO_spa.53.a: "Разрежьте ленты."
