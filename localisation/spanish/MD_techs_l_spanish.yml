 COMSAT1: "COMSAT 1965"
 COMSAT1_desc: "Satélite artificial que transmite y amplifica señales de telecomunicaciones por radio a través de un transpondedor. Esto crea un canal de comunicación entre un transmisor de origen y un receptor en diferentes lugares de la Tierra.\n\nSatélite de Comunicación (COMSAT 1965):\nEl satélite §Y$COMSAT1$§! es un satélite de comunicación con un ancho de banda de §Y56 kbits/s§!. Se requieren para un sistema de satélites de comunicación de §Y56 kbits/s§!."
