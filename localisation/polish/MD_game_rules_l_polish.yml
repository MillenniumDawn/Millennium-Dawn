 RULE_ALLOW_PLAYER_COLORED_PUPPETS: "Włącz kolorowe marionetki MD"
 RULE_OPTION_MD_COLORED_PUPPETS_YES_DESC: "Od kiedy ta zasada gry została włączona, każdy kraj, który stanie się marionetką, automatycznie zmieni kolor na kolor swojego władcy. (Na przykład, jeśli Chiny będą marionetką Indii, to Indie staną się czerwone, tak jak Chiny)."
 RULE_OPTION_MD_COLORED_PUPPETS_NO_DESC: "Ponieważ ta zasada gry została wyłączona, państwa nie zmienią swojego koloru po wybraniu ich jako marionetki i ich kolor pozostanie statyczny."
 RULE_ALLOW_CHEAT_DECISIONS: "Zezwalaj na decyzje o oszustwach"
 RULE_YES_ALLOW_CHEAT_DECISIONS_DESC: "Włączono decyzje o oszustwach"
 RULE_NO_ALLOW_CHEAT_DECISIONS_DESC: "Decyzje o oszustwach wyłączone"
 RULE_ALLOW_TOGGLING_CHEAT_DECISIONS: "§Y(Multiplayer)§! Zezwalaj na globalne przełączanie decyzji o oszustwach"
 RULE_YES_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Opcjonalne)§!\n\nWłączone przełączanie globalnych decyzji o oszustwach\n§YUWAGA:§! Każde państwo na świecie może przełączać decyzje o oszustwach, a ich efekty są §Yglobalne§!. Zdarzenie pojawi się, informując które państwo je przełączyło.\n§YPamiętaj, że musisz mieć zezwolenie na używanie decyzji o oszustwach w grze wieloosobowej!§!\n\n§YUWAGA:§! Musisz również włączyć zasadę gry \"Zezwól na decyzje o oszustwach\", jeśli chcesz używać cheatów!"
 RULE_NO_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Opcjonalne)§!\n\nWyłączone przełączanie globalnych decyzji na oszustwa\n§YUWAGA:§! Każde państwo na świecie może przełączać decyzje na oszustwa, a ich efekty są §Yglobalne§!. Zdarzenie pojawi się, informując które państwo je przełączyło.\n§YPamiętaj, że musisz mieć zezwolenie na używanie decyzji na oszustwa w grze wieloosobowej!§!\n\n§YUWAGA:§! Musisz również włączyć zasadę gry \"Zezwól na decyzje na oszustwa\", jeśli chcesz używać cheatów!"
 RULE_DISABLE_ANTI_BULLY: "Wyłącz zmęczenie wojną publiczną"
