l_russian:
 tut_2_text_1: "Отлично! Теперь, когда с оповещениями разобрались, можно переходить к тонкостям ведения войны. Италия начинает игру в войне с Эфиопией, и выиграть её будет несложно, когда вы научитесь это делать.\n\nПередвиньте камеру на юго-восток, пока не найдёте Эритрею в Африке. Когда камера переместится, §Yвыделите бригады§! в регионе $STATE|Y$, зажав §Gлевую кнопку мыши§! и обведя их рамкой."
 tut_3_text_1: "Отлично! Теперь вы научитесь планировать наступление.\n\nБригады можно объединять в §Yармии§!. Для армии составляются боевые планы, и ей можно назначить §Yкомандующего§!."
 tut_3_text_2: "Выделив бригады, нажмите кнопку §YНовая армия§! внизу экрана. Сделайте то же самое для бригад на юге, в §YСомалиленде§!."
 tut_5_text_1: "Отлично! Теперь у вас есть §Yлиния фронта§! с Эфиопией. Чтобы войска атаковали по §Yбоевому плану§!, нужно также провести §Yлинию наступления§!.\n\nНажмите кнопку §YЛиния наступления§!, затем зажмите §Gправую кнопку мыши§! и проведите линию между двумя подсвеченными провинциями. Сделайте то же самое для бригад на юге, в §YСомалиленде§!."
 tut_11_text_1: "Теперь ваши войска начнут наступление на Аддис-Абебу, столицу Эфиопии. Когда вы займёте достаточно вражеской территории, противник капитулирует.\n\n§YСнимите игру с паузы§!, нажав £SPACE . Скорость игры меняется клавишами £KP_PLUS  и £KP_MINUS  . Игроки часто меняют скорость под свои нужды, а не играют всё время на одной.\n\nПодсказка: если хотите точнее управлять подразделениями, выделите бригаду и щёлкните §Gправой кнопкой мыши§! по провинции, чтобы вручную отменить приказы боевого плана."
 tut_13_text_1: "Победа! Война окончена, Эфиопия разгромлена.\n\nВ мирное время вам может понадобиться §Yперебросить войска§! через океан, чтобы разместить их в других местах или подготовиться к войне. \n\nТеперь, когда Эфиопия разгромлена, держать там столько бригад не нужно.\n\nВыделите не менее §Y4 бригад§! и отправьте их в §Yподсвеченный порт§!, щёлкнув §Gправой кнопкой мыши§! по провинции."
 TUT_QUEUE_DIV: "§LБригада§! в очереди на развёртывание"
 TUT_SELECTED_DIVS: "Выделено бригад в регионе $STATE$: $NUMBERS$"
 TUT_TROOPS_IN_PORT: "Бригад в порту региона $STATE$: $NUMBERS$"
 TUT_TROOPS_IN_TRANSIT: "Бригад в пути к порту в стране $COUNTRY$: $NUMBERS$"
 BUTTON_WIKI_DIVISION_TEMPLATES: "Почитайте о §Hшаблонах бригад§! в HOI4 Wiki!"
 HINT_ARMY_PLANNER_TEXT_1_1: "Это экран §YНабор и развёртывание§!: здесь вы ставите новые бригады в очередь на подготовку и последующее развёртывание. Рекомендуем добавить в очередь бригаду §YDivisione di Fanteria§!.\n\nБригады в подготовке сначала пытаются получить нужное им §Yснаряжение§!. Получив снаряжение, они начинают подготовку. Прогресс подготовки не может опережать прогресс снаряжения.\n\nНажмите кнопку §YПодготовить§!, чтобы добавить бригаду на подготовку."
 HINT_ARMY_PLANNER_TEXT_1_2: "Закончив подготовку, бригады можно §Yразвернуть§! в §Yвыбранном вами месте§!. Развёртывать бригады можно только на своей коренной территории."
 HINT_ARMY_PLANNER_TEXT_2: "Бригады можно готовить последовательно и/или параллельно.\n\nБригады, которые готовятся параллельно, получают §Yснаряжение§! с одинаковой скоростью, поэтому будут готовы примерно одновременно. Когда у бригады есть всё нужное снаряжение и она полностью подготовлена, она развернётся в выбранном вами месте.\n\nНажмите §YДобавить подразделение§!, чтобы добавить ещё одну бригаду на параллельную подготовку.\n\nЕсли ход войны обернулся против вас, можно развернуть бригады §Yдо того, как они получат всё снаряжение и завершат подготовку§!. По возможности этого лучше избегать.\n\nПодробнее о том, какие подразделения набирать, можно прочитать в HOI4 Wiki!"
 HINT_DIVISION_DESIGNER: "Подсказка: конструктор бригад"
 HINT_DIVISION_DESIGNER_NOXP_TEXT: "Это §Yконструктор бригад§!: в нём создают новые и изменяют существующие §Yшаблоны бригад§!. Создание или изменение шаблона бригады стоит £army_experience  §Yопыта армии§!. Опыт армии дают бои и армейские учения. Подразделения 1-го уровня опыта (§Yновобранцы§!) £army_experience  опыта армии не приносят.\n\nЧтобы создать или изменить шаблон бригады, вам нужно больше £army_experience опыта армии."
 HINT_DIVISION_DESIGNER_XP_TEXT: "Это §Yконструктор бригад§!: в нём создают новые и изменяют существующие §Yшаблоны бригад§!. Создание или изменение шаблона бригады стоит £army_experience  §Yопыта армии§!. Опыт армии дают бои и армейские учения. Подразделения 1-го уровня опыта (§Yновобранцы§!) £army_experience  опыта армии не приносят.\n\nДля первого изменения шаблона рекомендуем щёлкнуть по пустой ячейке в столбце поддержки и добавить в бригаду £unit_artillery_icon_small §Yартиллерию поддержки§!. Добавив её, нажмите §YСохранить§!. Бригады с этим шаблоном начнут запрашивать артиллерийское §Yснаряжение§!."
 HINT_EDIT_TEMPLATE_TEXT: "Вы производите снаряжение, которое не используется ни в одном §Yшаблоне бригады§!. Но у вас есть £army_experience §Yопыт армии§!, чтобы это исправить.\n\nНажмите §YИзменить§! рядом с §YDivisione di Fanteria§! или любой другой бригадой на ваш выбор."
 HINT_LOGISTICS_TEXT: "Это экран §YЛогистика§!: он помогает понять, производите ли вы снаряжение быстрее или медленнее, чем расходуете.\n\nЕсли какого-то типа §Yснаряжения§! производится больше, чем вам нужно, имеет смысл уменьшить число фабрик на §Yпроизводственной линии§! этого снаряжения.\n\nХорошее §Yснабжение§! бригад — важная часть успеха на поле боя. Состояние снабжения можно проверить в §Yрежиме карты снабжения§! £GFX_F4  ."
 HINT_LOGISTICS_TEXT_2: "Снабжение распределяется из £GFX_capital_hub_texticon §Yстоличного центра снабжения§! и идёт £GFX_train_texticon §Yпоездами§! или £GFX_convoy_texticon §Yконвоями§! к £GFX_supply_hub_texticon §Yцентрам снабжения§! или £GFX_naval_supply_hub_texticon §Yморским базам§! в разных провинциях. \n\nЗатем снабжение получают бригады в зоне действия центра. Чтобы увидеть зону, выделите £GFX_supply_hub_texticon §Yцентр снабжения§! и зажмите £GFX_shift . Зону действия можно увеличить моторизацией, которая расходует £GFX_unit_motorized_icon_small §Yгрузовики§!.\n\nНа эффективность также влияют уровень £GFX_railways_texticon §Yжелезных дорог§! и £GFX_naval_supply_hub_texticon §Yморских баз§!, нехватка £GFX_train_texticon §Yпоездов§! и вражеские авиаудары. Так возникают §Rузкие места§!. Их можно устранить, улучшив железные дороги до столичного центра снабжения, прикрыв их истребителями ПВО и обеспечив достаточно поездов. Доступность снабжения показана в §Yрежиме карты снабжения§!  £GFX_F4  ."
 HINT_NO_TEMPLATE_NO_XP_TEXT: "Вы нажали на §Yоповещение «Нет шаблона»§!. Не волнуйтесь! Очень хорошо, что вы ищете ответы в оповещениях: они для того и нужны.\n\nСкорее всего, вы создали производственную линию артиллерийского снаряжения. Сейчас ни одна из ваших §Yбригад§! не использует это снаряжение ни в одном §Yшаблоне бригады§!.\n\nКогда у вас станет больше £army_experience  §Yопыта армии§!, вы сможете добавить артиллерию в шаблоны бригад. £army_experience  Опыт армии дают бои бригад и армейские учения.\n\nПока это оповещение можно игнорировать: обучение поможет вам, когда у вас станет больше £army_experience  опыта армии."
 HINT_NO_TEMPLATE_HAVE_XP_TEXT: "Вы нажали на §Yоповещение «Нет шаблона»§!: оно показывает, что вы производите снаряжение, которое сейчас не используете.\n\nЧтобы бригады начали использовать новые типы снаряжения, нужно изменить их §Yшаблон бригады§!. Изменение шаблона бригады стоит £army_experience  §Yопыта армии§!.\n\nПерейдите на экран §YНабор и развёртывание§! и выберите шаблон бригады, чтобы его §Yизменить§!.\n\nНаведя курсор на это оповещение, можно увидеть, какой тип снаряжения вы производите, но пока не используете."
 HINT_OFFICER_CORPS_SCREEN_TEXT_2: "Теоретики снижают стоимость сухопутных, морских и воздушных §Yдоктрин§!, определяющих общую стратегию. Доктрины задаются для каждого рода войск и дают бонусы развёрнутым бригадам, флотам и авиаполкам."
 HINT_OCCUPIED_TERRITORIES_SCREEN: "Подсказка: оккупированные территории"
 HINT_OCCUPIED_TERRITORIES_SCREEN_TEXT: "Чтобы бороться с сопротивлением и поддерживать порядок среди населения, в оккупированных регионах нужны гарнизоны, выполняющие полицейские функции. В игре это отражают гарнизоны, которые назначаются во вкладке §YОккупированные территории§! на §Yэкране политики§! (открывается щелчком по флагу страны в левом верхнем углу).\n\nБригады гарнизонов не видны на карте, а назначаются и получают снаряжение автоматически. Распределение снаряжения настраивается во вкладке §YНабор и развёртывание§!."
 HINT_SELECT_UNIT_TEXT: "Пора начать войну с §YЭфиопией§!. Для начала отдайте подразделениям приказы, создав боевой план с линией наступления.\n\n§YВыделите подсвеченные бригады§! в регионе §YЭритрея§!."
 HINT_LOW_SUPPLY_TEXT_1: "Чтобы бригады оставались боеспособными, им нужно снабжение. Оно распределяется из £GFX_capital_hub_texticon §Yстоличного центра снабжения§! и идёт £GFX_train_texticon §Yпоездами§! или £GFX_convoy_texticon §Yконвоями§! к £GFX_supply_hub_texticon §Yцентрам снабжения§! или £GFX_naval_supply_hub_texticon §Yморским базам§! в разных провинциях. \n\nЗатем снабжение получают бригады в зоне действия центра. Чтобы увидеть зону, выделите £GFX_supply_hub_texticon §Yцентр снабжения§! и зажмите £GFX_shift. §YПриоритет моторизации§! может увеличить зону действия центра, а значит, и расстояние, на котором ваши бригады получают снабжение. Для этого расходуются £GFX_unit_motorized_icon_small §Yгрузовики§!."