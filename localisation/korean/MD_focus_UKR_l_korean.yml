 ukraine_sov_service_adopt: "생산 없이 설계만 채택한다"
 ukraine_sov_service_produce: "설계를 채택하고 생산을 시작한다"
 ukraine_sov_service_factory: "먼저 생산 라인 비용을 지불한다"
 ukraine_sov_factory_plan_tt: "이 공장에는 군수 공장이 §Y2§!개 미만입니다. 새 생산 라인 비용을 지불한 뒤, 준비가 끝나면 설계를 채택하고 생산을 시작합니다."
 ukraine_sov_factories_wait_tt: "새 생산 라인은 우리가 해당 공장이 위치한 주를 소유하고 통제하는 한 약 §Y$DAYS$§!일 뒤 준비되며, 그렇지 않으면 그렇게 될 때까지 대기합니다. 그 후 이를 기다리던 각 설계가 채택되어 생산에 들어가고, 해당 계획이 이어집니다."
 ukraine_sov_factories_already_ordered_tt: "이 공장의 생산 라인은 이미 비용이 지불되었습니다. 이 설계도 그 생산 라인을 기다립니다."
 ukraine_praktyka_otaman.1.a_no_tech: "부족한 기술을 개발하며 새 6x6 차체를 제작한다"
 ukraine_praktyka_otaman.1.b_no_tech: "부족한 기술을 개발하며 BTR-60을 8x8로 재제작한다"
 ukraine_praktyka_otaman.1.c_no_tech: "부족한 기술을 개발하며 두 라인 모두 자금을 지원한다"
 ukraine_praktyka_otaman.9.b_no_tech: "호룬지와 부족한 기술을 개발한다"
 ukraine_praktyka_otaman_no_tech_tt: "이 설계에 필요한 기술 일부가 우리에게 없습니다. 프락티카가 이 기술도 함께 개발합니다. 작업은 §Y45§!일 더 걸리고, 진행되는 동안 우리 연구를 늦추지만, 완료되면 해당 기술을 얻게 됩니다."
 ukraine_praktyka_otaman_no_tech_mission_note: "\n\n프락티카는 이 설계에 필요한데 우리에게 없는 기술도 함께 개발합니다. 작업이 끝나면 해당 기술을 얻고 우리 연구 속도도 정상으로 돌아옵니다."
