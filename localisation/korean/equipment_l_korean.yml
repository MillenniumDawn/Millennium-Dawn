 H_infantry_weapons_type: "중화기"
 H_infantry_weapons_type_desc: "중화기는 중기관총과 박격포처럼 이동과 운용에 승무원 전체가 필요한 보병 무기입니다. 이러한 무기와 이를 운용하는 병사들은 보통 화기 분대로 편성됩니다."
