 OPEC_MIN_PRODUCTION_TT: "We produce more than §Y15§! oil"
 OPEC_NOT_LEFT_RECENTLY_TT: "We have not left OPEC in the past year"
 OPEC_BALLOT_LINE_2: "\n2. §Y[opec_ballot_name_2]§!, proposed by members holding §Y[?global.opec_ballot_shares^1|0]%§! of OPEC production"
 OPEC_BALLOT_LINE_3: "\n3. §Y[opec_ballot_name_3]§!, proposed by members holding §Y[?global.opec_ballot_shares^2|0]%§! of OPEC production"
 opec.1.t: "The OPEC Conference Convenes"
 opec.1.d: "Oil ministers have gathered in Vienna for the OPEC Conference. Delegates will vote on the most supported proposals, and each member's vote counts in proportion to its oil production.\n\n1. §Y[opec_ballot_name_1]§!, proposed by members holding §Y[?global.opec_ballot_shares^0|0]%§! of OPEC production[opec_ballot_line_2][opec_ballot_line_3]\n\nThe result will be announced in one week."
 opec.1.a: "Vote for [opec_ballot_name_1]."
 opec.1.b: "Vote for [opec_ballot_name_2]."
 opec.1.c: "Vote for [opec_ballot_name_3]."
 opec.3.t: "OPEC Adopts a New Stance"
 opec.3.d: "The OPEC Conference has closed. Members holding §Y[?global.opec_result_share|0]%§! of OPEC oil production voted for the §Y[opec_current_stance_name]§!, which takes effect immediately and binds every member until the next conference."
 opec.3.a: "Understood."
 opec_member_modifier: "OPEC Membership"
 opec_member_modifier_desc: "As a member of OPEC, our oil exports follow the production stance agreed at the OPEC Conference."
 OPEC_STANCE_DEEP_CUT_EFFECTS: "World oil price: §G+30%§!, raising oil export revenue for every exporter\nOil export revenue of OPEC members: §R-20%§!\nNet oil revenue for members: about §G+4%§!"
 OPEC_STANCE_CUT_EFFECTS: "World oil price: §G+15%§!, raising oil export revenue for every exporter\nOil export revenue of OPEC members: §R-10%§!\nNet oil revenue for members: about §G+3.5%§!"
 OPEC_STANCE_HOLD_EFFECTS: "World oil price: no OPEC adjustment\nOil export revenue of OPEC members: unchanged"
 OPEC_STANCE_RAISE_EFFECTS: "World oil price: §R-10%§!, lowering oil export revenue for every exporter\nOil export revenue of OPEC members: §G+5%§!\nNet oil revenue for members: about §R-5.5%§!"
 OPEC_STANCE_PRICE_WAR_EFFECTS: "World oil price: §R-30%§!, lowering oil export revenue for every exporter\nOil export revenue of OPEC members: §G+15%§!\nNet oil revenue for members: about §R-19.5%§!"
 OPEC_BALLOT_1_EFFECTS_TT: "§YIf adopted, until the next conference:§!\n[opec_ballot_effects_1]"
 OPEC_BALLOT_2_EFFECTS_TT: "§YIf adopted, until the next conference:§!\n[opec_ballot_effects_2]"
 OPEC_BALLOT_3_EFFECTS_TT: "§YIf adopted, until the next conference:§!\n[opec_ballot_effects_3]"
 OPEC_RESULT_EFFECTS_TT: "§YIn effect until the next conference:§!\n[opec_current_stance_effects]"
 OPEC_STANCE_DEEP_CUT_VOTES: "[?global.opec_vote_count^1|0] (§Y[?global.opec_vote_share^1|0]%§!)"
 OPEC_STANCE_CUT_VOTES: "[?global.opec_vote_count^2|0] (§Y[?global.opec_vote_share^2|0]%§!)"
 OPEC_STANCE_HOLD_VOTES: "[?global.opec_vote_count^3|0] (§Y[?global.opec_vote_share^3|0]%§!)"
 OPEC_STANCE_RAISE_VOTES: "[?global.opec_vote_count^4|0] (§Y[?global.opec_vote_share^4|0]%§!)"
 OPEC_STANCE_PRICE_WAR_VOTES: "[?global.opec_vote_count^5|0] (§Y[?global.opec_vote_share^5|0]%§!)"
 OPEC_STANCE_DEEP_CUT_TT: "§YDeep Production Cut§!\nMembers sharply reduce output to drain the market and force prices up. They give up export volume, but every barrel sold earns more.\n\n§YIf adopted, until the next conference:§!\nWorld oil price: §G+30%§!, raising oil export revenue for every exporter\nOil export revenue of OPEC members: §R-20%§!\nNet oil revenue for members: about §G+4%§!"
 OPEC_STANCE_CUT_TT: "§YProduction Cut§!\nMembers trim output to support prices at a modest cost in export volume.\n\n§YIf adopted, until the next conference:§!\nWorld oil price: §G+15%§!, raising oil export revenue for every exporter\nOil export revenue of OPEC members: §R-10%§!\nNet oil revenue for members: about §G+3.5%§!"
 OPEC_STANCE_HOLD_TT: "§YHold Production§!\nMembers keep their current output, and the oil price follows world supply and demand.\n\n§YIf adopted, until the next conference:§!\nWorld oil price: no OPEC adjustment\nOil export revenue of OPEC members: unchanged"
 OPEC_STANCE_RAISE_TT: "§YRaise Production§!\nMembers pump more to ease prices and win market share from rival producers.\n\n§YIf adopted, until the next conference:§!\nWorld oil price: §R-10%§!, lowering oil export revenue for every exporter\nOil export revenue of OPEC members: §G+5%§!\nNet oil revenue for members: about §R-5.5%§!"
 OPEC_STANCE_PRICE_WAR_TT: "§YPrice War§!\nMembers flood the market to crash prices and punish rival producers. Members lose money, but rivals lose more.\n\n§YIf adopted, until the next conference:§!\nWorld oil price: §R-30%§!, lowering oil export revenue for every exporter\nOil export revenue of OPEC members: §G+15%§!\nNet oil revenue for members: about §R-19.5%§!"
