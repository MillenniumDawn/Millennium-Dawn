 nsb_attack_helicopter_tech_7: "7th Gen Attack Helicopter"
 carrier_7: "CV 2045"
 carrier_7_desc: "Since the end of WW2, air power has reigned supreme in naval doctrine, and these symbols of power are often the most prized possession of any naval power. The presence of an aircraft carrier can make or break a battle. Despite their immense importance and influence, they are quite bad at defending themselves, so will need to be escorted at all times."
