 call_to_war_rule_defensive_only: "방어 전쟁만"
 industrial_warfare: "산업 전쟁"
 nato_gdp_per_capita: "나토 경제 발전"
 nato_gdp_per_capita_desc: "안전하고 번영하는 미래를 보장하려면 모든 회원국이 경제적으로 발전해야 합니다."
 nato_25_per_capita_or_more_tt: "모든 나토 회원국의 1인당 GDP가 최소 2만 5천 이상"
 industrial_warfare_desc: "근대에 들어 전쟁 양상이 급격히 변화하면서 전쟁 무기는 수공업 방식에서 산업화된 조립 라인으로 옮겨 갔습니다. 이러한 발전의 결과 국가들은 전선의 병력을 지원할 더 많은 양의 장비를 생산할 수 있게 되었습니다."
 bosporus_controlled: "보스포루스 장악"
 bosporus_controlled_desc: "우리 동맹의 군대가 보스포루스를 점령하여, 이처럼 중요한 해협을 장악한 이점을 거두고 있습니다."
 industrialized_warfare_idea: "산업화된 전쟁"
 joining_rule_commonwealth_nation_only: "영연방 회원국"
 joining_rule_muslim_brotherhood_nations_only: "무슬림 형제단 집권"
 secure_central_asia_name: "중앙아시아 확보"
 secure_central_asia_desc: "CSTO가 중앙아시아 지역에서 대체로 입지를 굳혔지만, 일부 국가는 여전히 우리의 영향권 바로 바깥에 머물러 있습니다. 나머지 국가들을 끌어들이면 이 지역에 대한 우리의 권위를 온전히 확립할 수 있습니다."
 secure_crimea_name: "크림반도 확보"
 secure_crimea_desc: "크림반도는 무역과 해군 우위가 손쉽게 체크메이트가 될 수 있는 지역의 요충지에 자리하고 있습니다. 크림반도를 장악하면 우리 동맹은 바다에 대한 통제력을 더욱 잘 행사할 수 있을 것입니다."
 bring_georgia_into_orbit_name: "조지아를 우리 영향권으로"
 bring_georgia_into_orbit_desc: "조지아는 동서양 정치 사이에서 점점 더 기웃거리고 있는 국가입니다. 너무 늦기 전에 우리 영향권으로 끌어들이는 것이 최선입니다."
 bring_ukraine_into_orbit_name: "우크라이나 편입"
 bring_ukraine_into_orbit_desc: "우크라이나인들은 빠르게 지역의 주요 행위자가 되어 가고 있으며, 이는 적대 세력이 우리에 맞서는 발판으로 삼을 만한 투자 대상이 되게 합니다. 너무 늦기 전에 우크라이나를 우리 영향력 아래로 끌어들이는 것이 최선입니다."
 goal_global_hegemony_name: "세계 패권"
 goal_global_hegemony_desc: "미국 제국의 부상은 우리 국가의 존립 자체를 위협합니다. 따라서 이 위협에 대처하고 세계 패권을 확립해야 합니다."
 incorporate_syria_name: "시리아 편입"
 incorporate_syria_desc: "시리아인들은 서방 제국주의에 넘어갈 위기에 처해 있습니다. 취약한 정치 상황 때문에 외세의 착취 대상이 되기 쉬우며, 너무 늦기 전에 개입해야 합니다."
 control_lebanon_name: "레바논 확보"
 control_lebanon_desc: "레바논은 시아파 활동의 주요 중심지 중 하나이며, 그 결과 적들의 끊임없는 공격을 받고 있습니다. 그들을 우리 통제 아래 두는 것이 최선입니다... 물론 그들이 안전할 수 있도록 말입니다."
 houthis_in_yemen_name: "후티 예멘"
 houthis_in_yemen_desc: "예멘 정부는 오랫동안 시아파 주민들의 기본권을 무시해 왔으며, 이 목소리 없는 사람들을 보호하는 것은 우리의 의무입니다."
 control_hormuz_name: "호르무즈 장악"
 control_hormuz_desc: "호르무즈 해협은 지구상에서 가장 중요한 요충지 중 하나이며, 이것이 없다면 세계에서의 우리 역할은 급속히 축소될 것입니다. 전 세계에 힘을 투사하는 우리의 능력을 지키기 위해 이에 대한 전적인 통제권을 확립하는 것이 필수적입니다."
 liberate_the_quds_name: "쿠드스 해방"
 liberate_the_quds_desc: "시오니스트들은 너무 오랫동안 쿠드스를 장악해 왔으며, 저항의 축으로서 이 지역을 마지막으로 재편할 때가 왔습니다."
