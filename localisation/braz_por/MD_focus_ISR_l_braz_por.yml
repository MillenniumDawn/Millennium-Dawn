 israel_economy.1.t: "Acordo de Armas com Israel"
 israel_economy.1.d: "As forças armadas israelenses querem comprar nossos fuzis de assalto. Devemos vendê-los?"
 israel_economy.1.a: "Dê-lhes as armas!"
 israel_economy.1.b: "Não"
 israel_economy.2.t: "[From.GetName] Aceita"
 israel_economy.2.d: "Fechamos um acordo com [From.GetName] para comprar alguns fuzis de assalto novinhos em folha!"
 israel_economy.2.a: "Ótimo!"
 israel_economy.3.t: "[From.GetName] Recusa"
 israel_economy.3.d: "Eles não nos venderão fuzis de assalto, mas nossos amigos na África têm alguns AKs confiáveis que poderíamos comprar... talvez."
 israel_economy.3.a: "Droga"
 israel_economy.4.t: "Israel Oferece Vender Seus Drones"
 israel_economy.4.d: "Israel nos ofereceu recentemente a compra de seus drones mais recentes. Devemos aceitar?"
 israel_economy.4.a: "Claro!"
 israel_economy.4.b: "Desculpe, não."
 israel_economy.5.t: "Acordo com a China."
 israel_economy.5.d: "A China concordou e estamos selando o acordo."
 israel_economy.5.a: "Show!"
 israel_economy.6.t: "A China não Concordou."
 israel_economy.6.d: "Eles não querem os nossos drones."
 israel_economy.6.a: "Muito Lamentável."
 israel_economy.7.t: "O Comitê Conjunto China-Israel para Inovação e Cooperação"
 israel_economy.7.d: "O Comitê Conjunto China-Israel para Cooperação em Inovação reuniu-se hoje pela primeira vez no âmbito dos eventos que marcam longos anos de relações diplomáticas entre os dois países. O Comitê é uma estrutura abrangente que promove conexões e diálogo entre cerca de 15 ministérios e agências governamentais de ambos os lados, a fim de aprofundar a cooperação entre os países em uma ampla gama de áreas, com ênfase na cooperação econômica."
 israel_economy.7.a: "Ótimo!"
 ISR_chi_isr_forum: "Fórum de Cooperação Israel-China"
 israel_economy.8.t: "Israel Pede Investimentos em Infraestrutura!"
 israel_economy.8.d: "Israel pede que nosso país invista em sua economia construindo infraestrutura. Devemos aceitar?"
 israel_economy.8.a: "Uma oportunidade maravilhosa de expandir nossa influência!"
 israel_economy.8.b: "Desculpe, não."
 israel_economy.9.t: "[From.GetName] Aceitou a Nossa Oferta!"
 israel_economy.9.d: "Eles vão investir em nossa economia."
 israel_economy.9.a: "Ótimo!"
 israel_economy.10.t: "[From.GetName] Recusou a Nossa Oferta!"
 israel_economy.10.d: "Eles não querem investir em nosso país."
 israel_economy.10.a: "Muito Lamentável."
 israel_economy.11.t: "Grupo Econômico de Desenvolvimento Conjunto Israel-Estados Unidos"
 israel_economy.11.d: "Israel e os Estados Unidos anunciaram a formação de uma parceria inovadora com a criação do Grupo Econômico de Desenvolvimento Conjunto Israel-Estados Unidos. Esta iniciativa colaborativa visa fomentar o crescimento econômico, a inovação e a prosperidade por meio de conhecimentos e recursos compartilhados. Com foco em tecnologia, infraestrutura e comércio, a aliança está pronta para fortalecer as relações bilaterais e impulsionar o desenvolvimento sustentável em ambas as nações e além delas."
 israel_economy.11.a: "Ótimo!"
 israel_economy.12.t: "Israel Solicita Entrada no Programa de Isenção de Vistos!"
 israel_economy.12.d: "O Programa de Isenção de Vistos (VWP) permite que cidadãos de determinados países viajem aos Estados Unidos a turismo ou negócios, por estadias de 90 dias ou menos, sem obter um visto. Os participantes do programa devem cumprir requisitos específicos, incluindo possuir uma autorização válida do Sistema Eletrônico de Autorização de Viagem (ESTA) antes de embarcar em seus voos. O VWP facilita as viagens e promove o intercâmbio econômico e cultural entre os Estados Unidos e seus países parceiros."
 israel_economy.12.a: "Aceitaremos a entrada deles sob as condições previstas."
 israel_economy.12.b: "O pedido deles não é sério. Pff!"
 ISR_us_visa_free: "Programa de Isenção de Vistos"
