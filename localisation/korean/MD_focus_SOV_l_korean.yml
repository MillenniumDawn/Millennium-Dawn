 SOV_slavic_wagner_TT: "PMC 바그너가 창설됩니다"
 SOV_scientific_councils_desc: "우리는 혁명에 봉사할 가장 뛰어난 러시아 청년들을 최고 교육 기관을 통해 신속히 양성해야 합니다. 그들의 혁신과 발명이 우리의 과학적, 군사적 우위를 보장할 것입니다."
 RUS_establish_me: "새로운 러시아"
 RUS_establish_me_desc: "러시아 정부가 붕괴한 뒤, 새로운 러시아 국가를 건설해야 할 필요가 생겼습니다."
 RUS_hold_kaliningrad_conference: "칼리닌그라드 회의 개최"
 RUS_hold_kaliningrad_conference_desc: "러시아 국가는 통일되고 응집력 있으며 유능한 세력이어야 합니다. 새로운 러시아가 안정적이고 민주적인 국가가 되도록 칼리닌그라드 회의를 조직해야 합니다."
 RUS_continue_reunification: "통합 노력 지속"
 RUS_continue_reunification_desc: "일부 세력이 여전히 러시아 국가의 옛 영토를 붙들고 있는 것으로 보이며, 우리는 협상을 통해 가능한 한 빨리 이를 정리하기 위해 나서야 합니다."
 RUS_establish_rusfor: "RUSFOR 창설"
 RUS_establish_rusfor_desc: "러시아는 더 이상 존재하지 않으며, 이는 여러 면에서 문제입니다. 러시아 국가를 위한 새로운 영토를 만드는 방안을 검토해야 합니다."
 russia.119.t: "로마노프 가문의 시성"
 russia.119.d: "러시아 정교회가 오늘 아침 로마노프 가문을 시성했습니다. 이 과정은 논란이 없지 않았으며, 교회 내부의 목소리를 포함하여 여러 방면에서 갈등을 불러왔습니다. 많은 이들은 이 시성이 해당 용어의 신성함을 제대로 지키지 못한다고 믿지만, 교회는 이를 강행했습니다."
 russia.119.a: "공산당원들에게 그들의 소행을 상기시켜라!"
 russia.119.b: "고인들을 기리며..."
 russia.120.t: "Su-37 시험 비행 실패"
 russia.120.d: "오늘 샤투라 인근에서 시험 비행이 실시되었으나 항공기에 중대한 결함이 발생했습니다. 고기동 선회 중 좌측 수평미익이 떨어져 나가 기체가 추락하고 완전히 손실되었습니다. 구조적 결함은 6년간의 시험 동안 설계 하중을 반복적으로 초과한 데서 비롯되었습니다."
 russia.120.a: "유감이다..."
 russia_news.10000.t: "스캔들에 휘말린 블라디미르 푸틴"
 russia_news.10000.d: "최근 러시아 언론은 블라디미르 푸틴의 새로운 스캔들을 재빨리 보도했습니다. 그가 특정 인사들에게 특정 산업에서 더 큰 독점권을 약속했다는 의혹을 받고 있으며, 이 주장은 불만을 품은 한 사업가가 언론에 제출한 비밀 녹음으로 뒷받침되고 있습니다. 이 스캔들 소식은 러시아와 인근 지역 전역으로 빠르게 퍼져 블라디미르 푸틴의 평판에 심각한 타격을 입혔습니다. 그의 정적들은 이를 재빨리 이용하여 푸틴을 공격하고, 러시아를 기업의 야망에 팔아넘길 인물로 묘사하고 있습니다. 일부에서는 그가 이 일로 선거에서 패배하여, 길고 성공적일 것으로 보였던 경력이 일찍 끝날 것이라고 추측하고 있습니다."
 russia_news.10000.a: "민주주의의 바람이 다시 한번 분다"
 russia.611.t: "새로운 정치적 방향"
 russia.611.d: "정치 지형이 극적으로 바뀌었습니다. 국가의 앞으로의 방향에 대해 다른 비전을 가진 새로운 지도부가 등장했습니다."
 russia.611.a: "새로운 장이 시작된다"
