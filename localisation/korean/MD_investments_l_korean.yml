 state_owned_local_renewable_capacity_modifier_desc: "지역 재생 에너지 기반시설에 대한 일련의 집중 투자 끝에, 이 주는 이제 재생 에너지원으로부터 더 많은 에너지를 생산하고 있습니다."
 state_owned_local_infrastructure_modifier: "지역 인프라 확충"
 state_owned_local_infrastructure_modifier_desc: "이 주의 지역 인프라 확충으로 지역 인프라를 대폭 개선하기 위한 다양한 단기 사업이 추진되었습니다."
 state_owned_local_military_infrastructure_modifier: "지역 군사 인프라 확충"
 state_owned_local_military_infrastructure_modifier_desc: "지역 군사 시설과 인프라 개선에 대한 대규모 투자 끝에, 이 지역의 군사 시설이 완전히 현대화되었습니다. 이 주의 군수 생산 역량이 크게 강화되었습니다."
 state_owned_local_energy_infrastructure_modifier: "지역 에너지 인프라 확충"
 state_owned_local_energy_infrastructure_modifier_desc: "지역 에너지 전력망에 대한 집중 투자로 이 주의 발전 및 송배전 인프라가 전면적으로 현대화되었습니다. 이 주는 이제 모든 에너지 부문에서 향상된 에너지 생산 역량을 갖추고 있습니다."
 state_owned_build_forward_logistics_base_modifier: "전진 병참 기지 건설"
 state_owned_build_forward_logistics_base_modifier_desc: "주 전역에 전략 병참 기지가 구축되어 전진 배치형 보급망이 형성되었습니다. 이 시설들은 지역 내 병력과 물자의 이동을 크게 개선하여 전체 보급 수요를 줄여 줍니다."
 state_owned_improve_rebuilding_efforts_modifier: "재건 노력 개선"
 state_owned_improve_rebuilding_efforts_modifier_desc: "재건 사업이 현지 주민들의 마음을 얻어 대중의 협조가 늘고 민중 소요가 줄어들었습니다. 지역 인프라와 공동체 재건 사업에 대한 투자가 현지 주민들의 순응도를 높였습니다."
 state_owned_hire_extra_primary_sector_workers_modifier: "1차 산업 노동자 추가 고용"
 state_owned_hire_extra_primary_sector_workers_modifier_desc: "집중적인 모집 및 교육 사업을 통해 이 주의 1차 산업 노동력이 확대되었습니다. 농업, 광업 및 기타 자원 채취 사업이 이제 노동력 공급 증가의 혜택을 받아 자원 생산량이 늘어나고 있습니다."
