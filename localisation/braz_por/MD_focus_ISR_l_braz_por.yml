 ISR_raid_beit_leiha: "Incursão em Beit Lahia"
 israel.101.t: "[ISR.GetNameWithFlag] realiza operação bem-sucedida!"
 israel.101.d: "Recentemente, Israel iniciou um ataque contra [HAM.GetNameWithFlag] e invadiu Beit Lahia.\n\nComo consequência, o chefe do Comitê de Resistência Popular foi assassinado."
 israel.101.a: "Ótimo!"
 israel.101.b: "Capturar o soldado deles!"
 israel.101.c: "Proibir ataque de resposta."
 israel.102.t: "[HAM.GetNameWithFlag] defende Beit Lahia com sucesso!"
 israel.102.d: "Recentemente, [ISR.GetNameWithFlag] tentou atacar Beit Lahia e assassinar o chefe do Comitê de Resistência Popular. No entanto, fracassou e [HAM.GetNameWithFlag] saiu vitorioso."
 israel.102.b: "Ótimo!"
 israel.103.t: "Confrontos [ISR.GetNameWithFlag] - [HAM.GetNameWithFlag] inconclusivos!"
 israel.103.d: "Os confrontos entre os dois lados foram interrompidos."
 israel.102.a: "Muito lamentável..."
 israel.104.t: "[HAM.GetNameWithFlag] captura nosso soldado!"
 israel.104.d: "Após os confrontos recentes, [HAM.GetNameWithFlag] capturou um soldado chamado Gilad Shalit e o mantém como refém."
 israel.104.a: "Droga!"
 ISR_jabel_mukaber_judge: "Emitir Julgamento sobre Jabel Mukaber"
 israel.105.t: "O que devemos fazer com Jabel Mukaber?"
 israel.105.d: "Jabel Mukaber é um bairro predominantemente palestino no sul de Jerusalém Oriental. Faz divisa com East Talpiot a oeste, Abu Tor e Silwan ao norte e Sur Baher ao sul.\n\nNossos especialistas afirmam que é uma favela deprimente, com lixo transbordando das caçambas por todas as ruas, sem parquinhos e sem áreas verdes, com falta de salas de aula e creches, com uma única escola de ensino médio para meninos, aberta apenas há dois anos após 20 anos de pedidos dos moradores. Eles pagam impostos ao Estado e imposto predial ao município, mas parecem não receber nada visível em troca.\n\nO que devemos fazer?"
 israel.105.a: "Prorrogar o prazo deles."
 israel.105.b: "Exigir o despejo deles!"
 israel.106.t: "Israel pressiona Jabel Mukaber!"
 israel.106.d: "Recentemente, Israel começou a pressionar a comunidade de Jabel Mukaber, em Jerusalém, tentando expulsá-la e construir mais assentamentos ali. As Autoridades colaboracionistas da Cisjordânia não fazem nada a respeito! Devemos dar um ultimato a Israel?"
 israel.106.a: "Sim!"
 israel.106.b: "Isso não é da nossa conta."
 israel.107.t: "[ISR.GetNameWithFlag] tem sucesso nos confrontos recentes!"
 israel.107.d: "Recentemente, depois que [HAM.GetNameWithFlag] exigiu a redução da pressão sobre Jabel Mukaber, [HAM.GetNameWithFlag] não teve sucesso contra as forças israelenses."
 israel.107.a: "Ótimo!"
 israel.107.b: "Teremos sucesso da próxima vez!"
 israel.108.t: "[HAM.GetNameWithFlag] tem sucesso nos confrontos recentes!"
 israel.108.d: "Recentemente, depois que [HAM.GetNameWithFlag] exigiu a redução da pressão sobre Jabel Mukaber, [HAM.GetNameWithFlag] teve sucesso contra as forças israelenses."
 israel.108.a: "Um golpe doloroso."
 israel.108.b: "Allahu Akbar!"
 israel.109.t: "Resultados inconclusivos nos confrontos recentes!"
 israel.109.d: "Os confrontos recentes foram inconclusivos."
 israel.109.a: "Um golpe doloroso."
 israel.109.b: "Hã?"
 operations_blocked: "Pelo menos um ano se passou desde a última operação."
