 CHI_TIB_sinicization_modifier: "Sinicisation du Tibet"
 CHI_TIB_sinicization_modifier_desc: "Tracks the sinicization of Tibet and the economic terms Beijing grants the region as it rises. Sinicization grows through the Tibet decisions and focuses in the §Y$CHI_SAR_integrate_TIB$§! branch.\n§W--------------§!\nThis modifier will be §RRemoved§! if we complete the §Y$CHI_SAR_integrate_TIB$§! focus, which requires §YTibet Sinicization§! of at least §Y95§!."
