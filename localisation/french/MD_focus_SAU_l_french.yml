 SAU_events.33.d: "L'Arabie saoudite nous demande de porter leur oléoduc plus loin en Europe. Nous deviendrions le gardien du pétrole du Golfe vers l'Occident, prélevant notre péage sur chaque baril, et Moscou ne nous en saurait pas gré."
