 Sweden_foci.6001.t: "잠수함 구매를 요청하는 스웨덴"
 Sweden_foci.6001.d1: "스웨덴 정부가 독일에 212형 잠수함 조달을 공식 요청했습니다. 이 요청을 승인하면 양국 방위 관계가 강화되고 지역 안보에 기여할 수 있습니다."
 Sweden_foci.6001.d2: "스웨덴 정부가 러시아에 라다급 잠수함 조달을 공식 요청했습니다. 이 요청을 승인하면 군사 협력의 길이 열리고 향후 관계에 영향을 미칠 수 있습니다."
