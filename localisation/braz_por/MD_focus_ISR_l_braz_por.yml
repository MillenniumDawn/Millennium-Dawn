 ISR_operation_result_outcome_tt: "A operação termina. Os §YPontos de operação§! são obtidos por meio das §Ysete suboperações§! na Cisjordânia. Cada evento de decisão oferece opções que concedem mais ou menos pontos. Marcar §G8 pontos ou mais§! significa sucesso; marcar §R7 ou menos§! significa fracasso."
 ISR_operation_success_tt: "Marque §G8 ou mais pontos de operação§! para ter sucesso. Os pontos são obtidos por meio das sete suboperações da Cisjordânia. Cada evento oferece opções que concedem quantidades diferentes. Escolha com sabedoria."
 ISR_religous_status_quo_revisit: "Revisitar o Status Quo Religioso"
 ISR_religous_status_quo_revisit_desc: "O compromisso de 1947 entre sionistas seculares e líderes ortodoxos congelou a relação do Estado com a religião. Uma coalizão reformista age para renegociar, prometendo uma distribuição mais equitativa das obrigações cívicas entre as comunidades seculares e religiosas."
