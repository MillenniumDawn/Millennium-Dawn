 EGY.Western_Autocracy_alt_desc: "（务实民族主义）- 国家未来党是埃及的一个政党。该党通常被视为一个权力政党，其创建的唯一目的是支持阿卜杜勒·法塔赫·塞西总统及其政策。该党支持埃及武装部队，认为埃及人民需要团结起来支持军队和埃及国家警察，打击恐怖主义，保卫国家。\n\n该党来自§H军方的看法§!为§G+50§!"
 EGY.Conservative_icon: "£EGY_Conservative"
 EGY.Autocracy: "£EGY_em_Autocracy 全国进步联盟党"
 EGY.Autocracy_icon: "£EGY_em_Autocracy"
 EGY.Autocracy_desc: "（纳赛尔主义） - 全国进步联盟党是埃及的一个纳赛尔主义社会主义政党。该党最初名为全国进步联盟组织，是执政的阿拉伯社会主义联盟的左翼派别，在阿拉伯社会主义联盟解散后成为独立政党。该党自诩为1952年埃及革命原则的捍卫者，并呼吁反对任何企图逆转革命为劳动者、穷人和其他低收入群体带来的社会成果的行径。\n\n该党来自§H军方的看法§!为§G+50§!"
 EGY.anarchist_communism_icon: "£EGY_anarchist_communism"
