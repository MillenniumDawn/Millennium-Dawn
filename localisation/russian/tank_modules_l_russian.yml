 FRA_afv_coax_machine_gun: "7,62mm AA-52"
 FRA_afv_coax_machine_gun_desc: "AA-52 (полное обозначение на французском: Arme Automatique Transformable Modèle 1952) — одно из первых французских орудий послевоенного периода. Его производила французская государственная компания Manufacture d'armes de Saint-Étienne (MAS)"
 FRA_afv_machine_gun: "7,62mm AA-52"
 FRA_afv_machine_gun_desc: "AA-52 (полное обозначение на французском: Arme Automatique Transformable Modèle 1952) — одно из первых французских орудий послевоенного периода. Его производила французская государственная компания Manufacture d'armes de Saint-Étienne (MAS)"
 FRA_afv_machine_gun_2: "12,7mm M2 Browning"
 FRA_small_autocannon_2: "20 mm modèle F2 gun"
 FRA_big_autocannon_3: "40mm 40 CTC"
 FRA_tank_very_large_cannon: "140mm ASCALON "
 FRA_tank_very_large_cannon_desc: "Автоматически заряжаемая и масштабируемая пушка Outperforming Gun или ASCALON — французская гладкоствольная 140-мм танковая пушка 50 калибров, разработанная компанией Nexter."
 FRA_tank_small_medium_cannon: "105mm CN-105-57"
 FRA_tank_small_medium_cannon_desc: "CN-105-57, также известная как CN 105/57 или D1504, — это лёгкое французское танковое орудие калибра 105 мм, используемое во многих лёгких танках"
 FRA_tank_small_medium_cannon_2: "105mm CN-105 F1"
 FRA_tank_small_medium_cannon_2_desc: "Canon de 105 mm modèle F1 (или CN-105-F1) — это французское танковое орудие калибра 105 мм, используемое на танке AMX-30."
 FRA_tank_medium_cannon: "120mm CN120-25"
 FRA_tank_medium_cannon_desc: "CN120-25, также просто называемое Modèle G1 (модель G1), — это французское гладкоствольное танковое орудие калибра 120 мм и длиной ствола 52 калибра, разработанное EFAB в Бурже для экспортного рынка."
 FRA_tank_medium_cannon_2: "120mm CN120-26"
 FRA_tank_medium_cannon_2_desc: "CN120-26, также называемая просто Modèle F1 (модель F1), представляет собой французскую гладкоствольную 120-мм танковую пушку 52 калибра, разработанную EFAB в Бурже и производимую компанией Giat Industries"
 FRA_tank_small_cannon: "75mm SA 50"
 FRA_tank_small_cannon_desc: "75 SA 50 (французский: 75-миллиметровая полуавтоматическая модель 1950 года; английский: 75-миллиметровая полуавтоматическая модель 1950 года), также называемая 75 Mle 50 или CN 75-50, представляет собой французскую 75-миллиметровую высокоскоростную нарезную пушку."
 FRA_tank_small_cannon_2: "90mm CN90 F4 Super 90"
 FRA_tank_small_cannon_desc_2: "Это усовершенствованная версия 90-мм пушки AMX-13/90, стреляет теми же боеприпасами, но стреляет точнее."
 FRA_afv_assault_gun: "60mm Brandt Mle CM60A1"
 FRA_afv_assault_gun_desc: "Brandt Mle CM60A1, также известный как Brandt HB 60LP, MCB-60 HB или просто как орудие-миномет Brandt 60mm LP, представляет собой 60-мм (2,36 дюйма) орудие-миномет."
 FRA_medium_tank_artillery_chassis_0: "105mm Obusier de 105 modèle 1950"
 FRA_medium_tank_artillery_chassis_1: "155mm Canon GCT de 155 mm/L39"
 FRA_medium_tank_artillery_chassis_2: "155 mm Canon Caesar 155mm/L52"
 FRA_reactive_armor_gen1: "BRENUS"
 ISR_tank_medium_cannon_2: "120mm MG251"
 ISR_tank_medium_cannon_2_desc: "120-мм пушка IMI — гладкоствольная танковая пушка L44, разработанная и производимая компанией Israeli Military Industries (IMI). Ее часто путают с лицензионным производством танковой пушки Rheinmetall L44, однако она была разработана IMI с 1983 по 1988 год для удовлетворения требований основного боевого танка Армии обороны Израиля Merkava Mark III, то есть более узкого крепления, как у M60, оба танка спроектированы вокруг 105-мм пушки"
 ISR_tank_medium_cannon_3: "120mm MG251-LR"
 ISR_tank_medium_cannon_3_desc: "Улучшенная версия MG251 с термокожухом, разработанным VIDCO Industries, и новой системой отдачи сжатого газа"
 SOV_tank_small_cannon: "76,2-мм Д-56ТС"
 SOV_afv_machine_gun: "7,62-мм СГМТ"
 SOV_afv_machine_gun_desc: "СГ-43/СГМТ Горюнова — советский станковый пулемёт, принятый на вооружение во время Второй мировой войны. Он был рассчитан на патрон 7,62×54 мм R и поступил в войска в 1943 году на замену устаревшим пулемётам «Максим» образца 1910 года."
 SOV_afv_machine_gun_2: "14,5mm КПВТ"
 SOV_afv_machine_gun_2_desc: "Крупнокалиберный пулемет КПВТ — советский крупнокалиберный пулемет калибра 14,5x114 мм, впервые поступивший на вооружение в качестве пехотного оружия (под обозначением ПКП) в 1949 году. В 1960-х годах пехотная версия была снята с производства из-за слишком больших размеров и веса. Позднее он использовался в серии БТР"
 SOV_afv_coax_machine_gun: "7,62-мм СГМТ"
 SOV_afv_coax_machine_gun_desc: "СГ-43/СГМТ Горюнова — советский станковый пулемёт, принятый на вооружение во время Второй мировой войны. Он был рассчитан на патрон 7,62×54 мм R и поступил в войска в 1943 году на замену устаревшим пулемётам «Максим» образца 1910 года."
 SOV_afv_atgm_gen1: "9M14 «Малютка»"
 SOV_afv_atgm_gen1_desc: "9М14 «Малютка» — первый советский переносной противотанковый ракетный комплекс и, вероятно, самый массовый ПТРК за всю историю."
 SOV_afv_assault_gun: "73 мм 2А28 «Гром»"
 SOV_afv_assault_gun_desc: "2А28 Гром, также известный как КБП 2А28 Гром, представляет собой 73-мм гладкоствольную полуавтоматическую пушку низкого давления с клиновым затвором. Разработка 2А28 Гром была напрямую связана с разработкой безоткатного орудия СПГ-9; оба стреляли снарядами, похожими на реактивные гранаты"
 SOV_afv_assault_gun_2: "100 мм 2A70"
 SOV_afv_assault_gun_2_desc: "100-мм артиллерийская установка 2А70 (обозначение ГРАУ: 2А70) — модель нарезной пушки низкого давления, разработанная в Советском Союзе в Конструкторском бюро приборостроения."
 SOV_small_autocannon: "30 мм 2А42"
 SOV_small_autocannon_desc: "Шипунов 2А42 — советская/российская 30-мм автоматическая пушка, производства Акционерного общества «Туламашзавод», названа в честь А. Г. Шипунова."
 SOV_small_autocannon_2: "30 мм 2А72"
 SOV_small_autocannon_2_desc: "Более легкий упрощенный вариант 2А42 с меньшим количеством деталей, более длинным стволом и более высокой начальной скоростью, но и более низкой скорострельностью. Он работает на длинном ходе отдачи, а не на газоотводе."
