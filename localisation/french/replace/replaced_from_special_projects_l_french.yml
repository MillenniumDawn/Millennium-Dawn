 sp_maglev_trains_idea: "Trains Maglev"
 sp_thorium_nuclear_fuel_idea: "Combustible nucléaire au thorium"
 sp_wireless_power_grid_expansion_idea: "Expansion du réseau électrique sans fil"
 sp_improved_synthetic_diamonds_idea: "Développement rénové de diamants synthétiques"
 scientist_trait_genius: "Génie"
 scientist_trait_genius_desc: "Cet esprit visionnaire repousse en permanence les limites de la science avec des innovations toujours plus folles. Un tel talent n'est pas monnaie courante."
 scientist_trait_brilliant_theorist: "Théoricien brillant"
 scientist_trait_brilliant_theorist_desc: "Cet esprit adepte de théories et de concepts abstraits a tous les atouts pour révolutionner l'armée et la recherche scientifique."
 scientist_trait_gifted_engineer: "Ingénieur doué"
 scientist_trait_gifted_engineer_desc: "Cet esprit au talent inné adore se pencher sur les problèmes les plus complexes dans toutes sortes de domaines."
 scientist_trait_bright: "Perspicace"
 scientist_trait_bright_desc: "Cet esprit vif sait appréhender le moindre concept nouveau en quelques secondes pour le mettre en application dans une situation donnée."
 scientist_trait_fast_learner: "Docte"
 scientist_trait_fast_learner_desc: "Cet esprit polyvalent sait s'adapter à tous les défis, grâce à ses facilités d'apprentissage et ses nombreuses connaissances dans divers champs scientifiques."
 scientist_trait_resourceful: "Sagace"
 scientist_trait_resourceful_desc: "Cet esprit créatif finit toujours par trouver une solution, même lorsque la situation est critique et que les ressources sont limitées."
 scientist_trait_nuclear_specialist: "Spécialiste nucléaire"
 scientist_trait_nuclear_specialist_desc: "Cette personne versée dans la physique mène des recherches de pointe sur le nucléaire, notamment sur la fission et les réactions en chaîne."
 scientist_trait_civilian_technology_expert: "Expert de recherche civile"
 scientist_trait_civilian_technology_expert_desc: "Un expert dans le développement de technologies à destination du secteur civil."
 scientist_trait_energy_expert: "Expert en production d'énergie"
 scientist_trait_energy_expert_desc: "Un vétéran de plusieurs entreprises énergétiques, capable de développer de nouvelles méthodes de production d'énergie."
 scientist_trait_telecommunications_expert: "Expert en télécommunications"
 scientist_trait_telecommunications_expert_desc: "Une personne née avec un téléphone dans la main, un expert pour trouver des moyens de rendre la pornographie disponible sur touts les appareils que vous possédez."
 scientist_trait_naval_vessels_specialist: "Spécialiste de recherche navale"
 scientist_trait_naval_vessels_specialist_desc: "Un spécialiste de tous les navires de la marine."
 scientist_trait_stealth_specialist: "Spécialiste de navires furtifs"
 scientist_trait_stealth_specialist_desc: "Spécialisé dans le développement de navires possédant une signature radar et sonar minime."
 scientist_trait_avionics_specialist: "Spécialiste en aéronefs"
 scientist_trait_avionics_specialist_desc: "Un spécialiste en aérodynamique et en conception d'aéronefs, capable de développer des cellules, des moteurs et des conceptions supérieurs pour dominer les cieux."
 scientist_trait_missile_specialist: "Spécialiste en missiles"
 scientist_trait_missile_specialist_desc: "Spécialisé dans la technologie des missiles, se concentrant sur les principes de propulsion des programmes de missiles balistiques et guidés."
 scientist_trait_space_specialist: "Enthousiaste de l'espace"
 scientist_trait_space_specialist_desc: "Une personne qui a dédié sa vie à accomplir toujours plus pour l'humanité au-delà de la Terre."
 scientist_trait_aircraft_engine_expert: "Expert en propulsion"
 scientist_trait_aircraft_engine_expert_desc: "Une autorité en matière de propulsion à réaction et à piston, faisant progresser la recherche sur les moteurs et leur application dans les aéronefs militaires."
 scientist_trait_autonomous_plane_expert: "Expert en véhicules sans pilote"
 scientist_trait_autonomous_plane_expert_desc: "Un expert pour faire voler des appareils sans pilote."
 scientist_trait_armored_specialist: "Spécialiste en blindés"
 scientist_trait_armored_specialist_desc: "Cette personne est spécialisée dans la conception et l'amélioration des chars et autres véhicules blindés."
 scientist_trait_infantry_specialist: "Spécialiste de l'infanterie"
 scientist_trait_infantry_specialist_desc: "Un spécialiste des armes légères, de leur utilisation et de leur conception."
 scientist_trait_mechsuit_specialist: "Spécialiste en combinaisons mécaniques"
 scientist_trait_mechsuit_specialist_desc: "Quelqu'un qui a trop joué à Titanfall."
 sp_improved_space_solar_farms_idea: "Fermes solaires basées dans l'espace"
 sp_afv_double_cannons: "Double canon"
 sp_afv_double_cannons_desc: "Généralement, nos véhicules blindés de combat légers sont équipés d'une seule arme, généralement un canon automatique. Cependant, nous pourrions créer un système pour monter deux canons côte à côte."
 sp_afv_double_cannons_reward_improved_autoloader: "Chargeur automatique amélioré"
 sp_afv_double_cannons_reward_improved_autoloader_desc: "Nos ingénieurs ont développé un chargeur automatique amélioré pour nos chars en travaillant sur un système de rechargement à double canon."
 sp_coilgun_memes: "Canons électromagnétiques pour l'infanterie"
 sp_coilgun_memes_desc: "En faisant un 'Chérie, j'ai rétréci les gosses' sur la technologie de canon électromagnétique de nos chars, nous pouvons donner à notre infanterie le pouvoir du projectile en tungstène à mach vindieu.\nNe tentez pas mon côté développeur schizophrénique parce que je jure que je fait une connerie comme ça en une soirée."
 sp_multipurpose_warhead: "Ogives polyvalentes"
 sp_multipurpose_warhead_desc: "Nous avons des missiles contre les chars et des missiles contre les aéronefs. Mais et si nous pouvions rendre nos missiles efficaces contre les deux ? Ainsi, en cas de besoin, les missiles antichars et antiaériens pourraient être utilisés contre des cibles autres que celles prévues."
 sp_supercarrier_1: "Premiers superporte-avions"
 sp_supercarrier_1_desc: "Un espace de pont élargi et la capacité de construire des navires de cette taille seront cruciaux pour notre projection de puissance à longue portée."
 sp_supercarrier_2: "Superporte-avions tardifs"
 sp_supercarrier_2_desc: "Avec l'ajout de moteurs nucléaires, plus de puissance signifie de plus gros navires, et un pont d'envol plus spacieux."
 sp_stealth_technology: "Expérimentation en furtivité"
 sp_stealth_technology_desc: "Pour obtenir un avantage sur notre ennemi, nous devons trouver un moyen de rendre nos chasseurs moins détectables par radar."
 sp_arsenal_bird: "Oiseau d'arsenal"
 sp_aresnal_bird_desc: "Avec le développement d'aéronefs entièrement autonomes, de moteurs d'avion à propulsion nucléaire et de systèmes de contrôle de vol avancés, nous pouvons construire un aéronef capable de transporter à lui seul une force aérienne entière de drones. Cet aéronef, bien qu'extrêmement coûteux, représentera le summis des systèmes de combat aérien."
 sp_multipurpose_warhead_reward_improved_warhead: "Ogives améliorées"
 sp_multipurpose_warhead_reward_improved_warhead_desc: "En essayant de comprendre comment ajouter des performances antiaériennes aux missiles antichars et des performances antichars aux missiles antiaériens, nos ingénieurs ont trouvé comment améliorer les performances globales d'un type de missile."
 sp_multipurpose_warhead_reward_improved_warhead_at: "Meilleures performances antichars"
 sp_multipurpose_warhead_reward_improved_warhead_aa: "Meilleures performances antiaériennes"
 sp_emp_warhead: "Guerre électronique améliorée"
 sp_emp_warhead_desc: "Les chars et les avions disposent de contre-mesures électroniques qui peuvent réduire l'impact des armes EMP. Comme les différentes plateformes utilisent des architectures différentes, nous ne pouvons nous concentrer efficacement que sur un type de cible."
 sp_emp_warhead_reward_improved_warhead_at: "Prioriser les cibles terrestres"
 sp_emp_warhead_reward_improved_warhead_aa: "Prioriser les cibles aériennes"
 sp_fire_support_land_drone_reward_improved_communication_desc: "En développant une méthode de contrôle efficace pour nos drones, nos ingénieurs ont développé une méthode améliorée de communication sans fil. Nous pouvons utiliser cette percée dans une application civile ou militaire."
 sp_double_shot_rifle_tt: "Augmente la §YDéfense§! et la §YPercée§! de toutes les unités §YForces spéciales§! de §G5 %§!\n"
 sp_double_shot_rifle_tech: "Fusil à double tir"
 sp_ground_fireandforget: "ATGM à tir et oubli"
 sp_ground_fireandforget_desc: "La miniaturisation des électroniques permet désormais à un missile de se guider automatiquement vers une cible grâce à des verrouillages thermiques."
 sp_modern_air_electronics: "Équipements électroniques pour l'aéronautique modernes"
 sp_modern_air_electronics_desc: "Une nouvelle génération d'avancées dans les équipements électroniques pour les radars embarqués, les cockpits et autres systèmes."
 sp_future_air_electronics: "Équipements électroniques du futur pour l'aéronautique"
 sp_future_air_electronics_desc: "Fusion des dernières technologies en IA intelligente, systèmes laser et nanotechnologie pour des équipements embarqués à haute efficacité."
 sp_modern_air_weapons: "Armes embarquées intelligentes"
 sp_modern_air_weapons_desc: "Ciblage intelligent, radars à ondes millimétriques montés sur les armes, verrouillage après lancement. Une nouvelle génération d'armes ouvrant la voie au champ de bataille du futur."
 sp_future_air_weapons: "Armes embarquées améliorées par IA"
 sp_future_air_weapons_desc: "Amélioration de la génération précédente de missiles et capteurs embarqués avec des processeurs IA et des systèmes de détection et de ciblage encore plus précis."
 sp_hypersonic_missile: "Missiles hypersoniques"
 sp_hypersonic_missile_desc: "Les missiles hypersoniques vont permettre à nos ;missiles stratégiques de frapper le territoire ennemi en profondeur à des vitesses jusqu'alors jugées inatteignables."
 sp_hypersonic_missile_tt: "Déverrouille la technologie des §YMissiles hypersoniques§!"
 sp_naval_generic_reward_army_xp_1: "Changement dans le flux d'idées"
 sp_naval_generic_reward_army_xp_2: "Vague d'idées"
 sp_naval_generic_reward_army_xp_3: "Tsunami d'innovations !"
 sp_emp_warhead_reward_improved_warhead: "Armes électroniques"
 sp_emp_warhead_reward_improved_warhead_desc: "Le matériel électronique peut nous donner un avantage en combat aérien."
 sp_helicopter_project_desc: "Tout comme la conception d'une voiture ou d'autres véhicules, concevoir et construire des hélicoptères nécessite des connaissances locales pour produire ces véhicules spécialisés localement. Nous devrions mener des expériences de conception jusqu'à ce que nous développions une version pour nous-mêmes."
 sp_helicopter_project: "Expériences de conception d'hélicoptères"
 sp_helicopter_project_tt: "Déverrouille les lignes de technologie suivantes §Y:§!\n- §YHélicoptères de transport§!\n- §YHélicoptères d'attaque§!\n"
 sp_air_generic_reward_army_xp_1: "Souffle d'air frais"
 sp_air_generic_reward_army_xp_2: "Brise d'innovation"
 sp_air_generic_reward_army_xp_3: "Vents de changement"
 sp_tank_stealth_armor_early: "Blindage furtif précoce"
 sp_tank_stealth_armor_early_desc: "En créant un blindage qui protège non seulement nos chars, mais qui offre également une meilleure dissimulation, nous pouvons adopter les meilleures théories sur les blindés : ne pas être touché est préférable à arrêter le coup."
 sp_electronic_government: "Gouvernement électronique"
 sp_electronic_government_desc: "Pour maximiser l'efficacité de l'État, les citoyens devraient pouvoir accéder et interagir avec leur gouvernement depuis le confort de leur domicile. Cela encouragera une meilleure maîtrise de l'Internet parmi les citoyens et réduira les dépenses gouvernementales à des niveaux incroyablement bas."
 sp_tank_nera_armor: "Composite NERA lourd"
 sp_tank_nera_armor_desc: "Nous pouvons rechercher des matériaux avancés pour produire des types de blindage plus lourds et plus résistants, comme des inserts en uranium appauvri."
 sp_aircraft_project_bba_tt: "Déverrouille les lignes de technologie suivantes §Y:§!\n- §YCellules légères§!\n- §YCellules moyennes§!\n- §YCellules lourdes§!\n- §YHélicoptères d'attaque§!\n- §YHélicoptères de transport§!\n"
 sp_aircraft_project_non_bba_tt: "Déverrouille les lignes de technologie suivantes §Y:§!\n- §YChasseurs§!\n- §YAppui aérien rapproché§!\n- §YBombardiers§!\n- §YVéhicules aériens de combat sans pilote§!\n- §YChasseurs légers§!\n"
 sp_space_weapons: "Armes basées dans l'espace"
 has_completed_space_program_tt: "A réalisé le projet spécial : §Y$sp_space_program_gdm$§!"
 has_completed_space_weapons_tt: "A réalisé le projet spécial : §Y$sp_space_weapons_gdm$§!"
 sp_microchip_production: "Laboratoires de production de microprocesseurs"
 sp_microchip_production_desc: "En expérimentant la miniaturisation de nos processus informatiques et en apprenant à les reproduire à grande échelle, nous serons capables de produire nos propres microprocesseurs à utiliser dans les armes et équipements modernes."
 sp_composite_production: "Laboratoires de production composite"
 sp_composite_production_desc: "En expérimentant de nouvelles technologies et des procédés de fusion, de mélange et autres méthodes chimiques, nous pouvons perfectionner les méthodes de fabrication de matériaux composites modernes et avancés."
 sp_recon_land_drone: "Drones de reconnaissance terrestre"
 sp_recon_land_drone_desc: "La guerre terrestre moderne dépend de plus en plus de la supériorité informationnelle et de la détection précoce des menaces. En déployant des drones de reconnaissance dédiés aux côtés de nos forces au sol, nous étendons leur perception bien au-delà des méthodes de reconnaissance traditionnelles. Cet investissement permet des décisions plus rapides, une meilleure coordination et une image plus nette du champ de bataille avant l'engagement direct."
 sp_smart_bullets: "Balles intelligentes"
 sp_smart_bullets_desc: "Les progrès en guidage et en ciblage commencent à influencer jusqu'aux plus petits éléments du champ de bataille. En investissant dans des munitions intelligentes pour notre infanterie et nos armes d'appui, nous visons à améliorer la précision et l'efficacité dans des environnements de combat complexes."
 sp_recon_drone_land: "Systèmes de drones de reconnaissance au sol"
 sp_recon_drone_land_desc: "Avec l'usage généralisé des véhicules aériens sans pilote sur le champ de bataille, les drones de reconnaissance terrestre fournissent aux forces au sol un renseignement continu en temps réel sur la ligne de front. Opérant au plus près des unités de combat, ces drones améliorent la conscience situationnelle, l'identification des cibles et la coordination sans exposer le personnel à un risque direct."
 sp_airless_tires: "Pneus sans air"
 sp_airless_tires_desc: "La mobilité reste un facteur critique des opérations terrestres modernes, surtout dans des milieux rudes et imprévisibles. En adoptant la technologie des pneus sans air pour les véhicules militaires, nous pouvons réduire les besoins de maintenance et éliminer la vulnérabilité aux crevaisons. Cet investissement améliore la fiabilité opérationnelle, permettant à nos forces de maintenir le mouvement même dans des conditions défavorables."
 sp_exoskeletal_engine_tank: "Systèmes de moteurs exosquelettiques"
 sp_exoskeletal_engine_tank_desc: "Les moteurs conventionnels s'appuient sur des arbres et des disques centraux qui imposent des limites de poids, de contrainte et d'efficacité. En explorant des conceptions de moteurs exosquelettiques, où les pales rotatives sont soutenues dans une structure de rotor-tambour, nous visons à réduire le poids, améliorer la fiabilité et ouvrir de nouvelles possibilités pour une propulsion compacte et de forte puissance."
 sp_nuclear_engine_tank: "Systèmes de moteurs à propulsion nucléaire"
 sp_nuclear_engine_tank_desc: "La hausse des besoins en carburant et l'allongement des rayons d'action pèsent de plus en plus sur la logistique blindée conventionnelle. En explorant des systèmes de moteur à propulsion nucléaire pour les véhicules lourds au sol, nous cherchons à réduire la dépendance aux lignes de ravitaillement tout en maintenant une mobilité de longue durée."
 sp_light_walker_tank_chassis: "Châssis de char Light Walker"
 sp_light_walker_tank_chassis_desc: "Un châssis blindé bipède léger conçu pour franchir les terrains brisés, les décombres et les obstacles urbains qui contraignent les véhicules chenillés conventionnels. Si son profil élevé et ses actionneurs complexes posent des défis de maintenance et de fiabilité, une plateforme marcheuse légère peut offrir une mobilité exceptionnelle en ville dense et sur sol accidenté lorsqu'elle est correctement appuyée par l'infanterie et les drones."
 sp_drone_lrs: "Système de fusée de lancement de drone"
 sp_drone_lrs_desc: "En remplaçant les munitions-roquettes conventionnelles par un grand nombre de drones consommables, ce système de lancement délivre une puissance de feu en essaim sur de vastes zones. Une fois déployés, les drones se dispersent pour mener reconnaissance, frappe ou attaques persistantes, permettant aux forces terrestres de saturer les défenses ennemies, d'adapter les cibles en vol et de maintenir la pression sans dépendre des charges de missiles traditionnelles."
 sp_heavy_walker_tank_chassis: "Châssis de char Walker lourd"
 sp_heavy_walker_tank_chassis_desc: "S'appuyant sur les concepts de marcheurs antérieurs, les plateformes blindées bipèdes lourdes allient une protection épaisse à une mobilité articulée pour franchir des terrains impraticables aux chars lourds conventionnels. Plus lents et mécaniquement plus complexes, ces véhicules privilégient la durabilité frontale et des plates-formes d'armes stables, afin d'appuyer les percées en milieu urbain dense et accidenté."
 sp_walker_tank_chassis: "Châssis de char Walker"
 sp_walker_tank_chassis_desc: "Alliant conception de véhicule blindé et mobilité articulée sur jambes, les châssis de chars marcheurs sont destinés à opérer là où les plateformes chenillées conventionnelles peinent. En enjambant les obstacles et en naviguant un sol irrégulier, ces véhicules offrent une plus grande souplesse en milieu urbain, montagneux et fortement endommagé, au prix d'une complexité mécanique et d'une maintenance accrues."
 sp_hover_suspension: "Systèmes de suspension en vol stationnaire"
 sp_hover_suspension_desc: "En remplaçant le train de roulement chenillé traditionnel par des systèmes de sustentation générant de la portance, les véhicules de transport de troupes blindés gagnent la capacité de se déplacer au-dessus du sol plutôt qu'à sa surface. Cela permet de franchir boue, neige, eau et débris avec moins de contact au sol, améliorant mobilité et souplesse de déploiement tout en introduisant de nouvelles exigences de puissance et de maintenance."
 sp_magneto_explosive_munition: "Munitions explosifs magnéto-hydrodynamiques"
 sp_magneto_explosive_munition_desc: "Les véhicules lourdement blindés continuent de pousser le développement d'armes antichar plus avancées. En explorant des munitions explosives magnéto-hydrodynamiques, nous cherchons à renforcer la pénétration et les effets disruptifs de nos missiles guidés."
 sp_drone_torpedoes: "Torpilles de drones"
 sp_drone_torpedoes_desc: "La guerre navale évolue rapidement, et les torpilles traditionnelles ne suffisent plus face aux menaces modernes. En investissant dans des systèmes de torpilles-drones, nous visons à accroître notre puissance de frappe sous les vagues. Ces nouvelles torpilles sont capables de suivi autonome des cibles et d'engagement adaptatif, permettant à nos flottes de conserver l'initiative dans les opérations anti-sous-marines et navales."
 sp_anti_drone_laser_modules: "Modules laser anti-drones"
 sp_anti_drone_laser_modules_desc: "L'usage croissant de drones et de munitions guidées de précision en mer force à repenser la défense aérienne navale. En intégrant des systèmes laser anti-drones à nos navires, nous pouvons répondre à ces menaces avec une vitesse et une précision que les armes traditionnelles ne peuvent égaler."
 sp_mineclearing_drone: "Systèmes de déminage par drones"
 sp_mineclearing_drone_desc: "Les mines navales restent l'une des menaces les plus persistantes et les plus rentables pour les opérations maritimes. En transférant les missions de lutte contre les mines à des systèmes de drones sans équipage, nous réduisons le risque pour les équipages tout en améliorant la vitesse et la portée des opérations de déminage."
 sp_naval_recon_drone: "Drones de reconnaissance navale"
 sp_naval_recon_drone_desc: "Maintenir la conscience situationnelle en mer devient de plus en plus complexe à mesure que les théâtres navals se densifient et se contestent. En investissant dans des drones de reconnaissance navale dédiés, nous étendons notre portée de surveillance au-delà des limites des plateformes habitées. Ces systèmes permettent à nos flottes de détecter, suivre et répondre aux menaces plus tôt, assurant des décisions de commandement mieux informées et une plus grande souplesse opérationnelle."
 sp_drone_submarine: "Sous-marin drone"
 sp_drone_submarine_desc: "La guerre sous-marine s'oriente vers la persistance et le déni plutôt que la seule puissance de feu brute. En développant des plateformes sous-marines sans équipage, nous pouvons maintenir une présence sous-marine continue sans risquer équipages ni atouts de haute valeur. Ces sous-marins-drones nous permettent de surveiller, perturber et contester des zones maritimes clés tout en opérant sous le seuil d'une escalade conventionnelle."
 sp_modern_sail_ships: "Navires modernes à voile"
 sp_modern_sail_ships_desc: "La hausse des besoins énergétiques et l'allongement de la logistique navale forcent à réévaluer le fonctionnement de nos flottes de soutien. En réintroduisant des conceptions modernes à voile assistée pour certains bâtiments, nous pouvons réduire la consommation de carburant tout en maintenant la fiabilité opérationnelle."
 sp_drone_patrol_boat: "Bateaux de patrouille de drones"
 sp_drone_patrol_boat_desc: "La sécurité côtière et les missions de patrouille maritime sont de plus en plus tendues par la main-d'œuvre limitée et des exigences opérationnelles croissantes. En déployant des patrouilleurs sans équipage, nous pouvons maintenir une présence constante dans les zones côtières et littorales clés sans engager de plus grands navires de guerre. Ces plateformes nous permettent de surveiller, dissuader et répondre aux menaces de faible intensité avec plus d'efficacité et de souplesse."
 sp_drone_corvette: "Corvettes-drones"
 sp_drone_corvette_desc: "Alors que les engagements navals deviennent plus dispersés et plus risqués, le rôle des plus petits combattants de surface est réexaminé. En investissant dans des corvettes sans équipage ou à équipage optionnel, nous pouvons projeter la force et maintenir le contrôle de la mer sans exposer les équipages à un danger inutile."
 sp_rail_gun_naval_battery: "Batterie de canons navals"
 sp_rail_gun_naval_battery_desc: "Si les premiers concepts de railgun se concentraient sur des tirs uniques à fort impact, le combat naval en évolution exige une puissance de feu soutenue et souple. En développant une batterie de railguns multi-tubes, nous passons à des cadences plus élevées et une meilleure saturation des cibles."
 sp_nuclear_torpedoes: "Torpilles nucléaires"
 sp_nuclear_torpedoes_desc: "Alors que la dissuasion navale s'oriente vers la domination sous-marine, les charges conventionnelles seules peuvent ne plus suffire. En développant des torpilles à ogive nucléaire, nous introduisons une arme capable de nier de vastes zones maritimes et de contrer de façon décisive les formations navales de haute valeur."
 sp_fusion_reactor_engine: "Moteur de réacteur à fusion"
 sp_fusion_reactor_engine_desc: "Les besoins croissants en énergie des systèmes navals modernes poussent propulsion et génération d'énergie conventionnelles à leurs limites. En investissant dans des réacteurs à fusion pour nos navires, nous visons à alimenter armes, capteurs et propulsion avancés sans compromettre l'endurance. Ce projet pose les bases d'une nouvelle génération de plateformes navales à haute énergie, assurant une supériorité opérationnelle durable en mer."
 sp_naval_swarm_module: "Systèmes de lancement de drones navals Swarm"
 sp_naval_swarm_module_desc: "Avec l'intégration de systèmes de lancement modulaires à bord des bâtiments de surface, les plateformes navales gagnent la capacité de déployer un grand nombre de drones autonomes pour la reconnaissance, la guerre électronique et les missions de frappe. Ces systèmes en essaim étendent la portée des capteurs du navire, submergent les défenses ennemies et offrent une projection de force souple sans exposer le bâtiment hôte à un engagement direct."
 sp_radar_jamming_module: "Systèmes de brouillage de radar naval"
 sp_radar_jamming_module_desc: "En employant des suites de guerre électronique avancées conçues pour perturber et dégrader les radars ennemis, les bâtiments de surface peuvent masquer leur position réelle et leurs mouvements en mer. Ces systèmes de brouillage interfèrent avec l'acquisition de cibles et le contrôle de tir, réduisant l'efficacité des capteurs hostiles et accroissant la survivabilité pendant les engagements navals."
 sp_anti_torpedo_module: "Systèmes anti-torpilles navals"
 sp_anti_torpedo_module_desc: "En employant des suites de défense anti-torpilles dédiées, conçues pour détecter, classer et neutraliser les menaces sous-marines entrantes, les bâtiments de surface peuvent réduire le risque posé par les torpilles modernes en transit et au combat. Ces systèmes combinent suivi sonar rapide, déploiement automatisé de contre-mesures et solutions d'interception pour perturber le guidage et vaincre les torpilles avant l'impact, améliorant la survivabilité en eaux contestées."
 sp_anti_ship_drone_missile: "Missiles drones antinavires"
 sp_anti_ship_drone_missile_desc: "Les capacités de frappe navale se définissent de plus en plus par la portée, la précision et la survivabilité. En développant des systèmes de missiles antinavires à base de drones, nous pouvons étendre notre capacité à menacer les bâtiments hostiles tout en réduisant le risque pour les aéronefs habités."
 sp_hover_helicopter_engine: "Moteurs d'hélicoptères capables de survoler"
 sp_hover_helicopter_engine_desc: "Les milieux urbains et les terrains contraints imposent de nouvelles exigences à l'aviation à voilure tournante. En développant des systèmes de moteur capables de stationnaire, nous visons à améliorer la stabilité à basse vitesse et le contrôle vertical lors d'opérations complexes."
 sp_hypersonic_engine: "Systèmes de propulsion hypersonique"
 sp_hypersonic_engine_desc: "La supériorité aérienne se joue de plus en plus sur la vitesse, la portée et la capacité à pénétrer un espace aérien défendu. En investissant dans des systèmes de propulsion hypersonique, nous cherchons à dépasser les limites des performances aériennes conventionnelles."
 sp_awacs_project: "Système aéroporté d'alerte et de contrôle"
 sp_awacs_project_desc: "Avec la complexité croissante des opérations aériennes modernes, les systèmes aéroportés d'alerte et de contrôle sont devenus une capacité critique pour les forces aériennes avancées. En montant de puissants réseaux radar et des systèmes de commandement sur des plateformes d'aéronefs à grande endurance."
 sp_fiber_drones: "Drone guidé par fibre optique"
 sp_fiber_drones_desc: "Avec le développement rapide des systèmes sans équipage et de la guerre électronique, les drones guidés par fibre optique sont apparus comme une solution contre le brouillage et les interférences. En transmettant les signaux de contrôle par des liaisons fibre physiques plutôt que par radio, ces drones peuvent opérer de façon fiable en milieu contesté tout en conservant un contrôle précis de leurs charges utiles."
 sp_air_railguns: "Canon électrique air-air"
 sp_air_railguns_desc: "Dans la quête continue de vitesses d'engagement plus élevées et de portées d'interception étendues, les railguns air-air ont été proposés comme alternative aux systèmes de missiles conventionnels."
 sp_air_railguns_helicopter: "Railgun d'hélicoptère"
 sp_air_railguns_helicopter_desc: "En intégrant des canons électromagnétiques compacts aux plateformes à voilure tournante, les hélicoptères peuvent délivrer un feu à très haute vitesse capable de pénétrer des cibles durcies qui exigeraient normalement des aéronefs plus lourds ou des systèmes au sol"
 sp_space_artillery: "Appui-feu orbital"
 sp_space_artillery_desc: "Avec l'intégration croissante des systèmes spatiaux dans la guerre moderne, le concept d'appui-feu orbital est apparu comme un moyen de délivrer des frappes de précision depuis l'espace sur des cibles au sol."
 sp_air_pdl: "Lasers de défense ponctuelle"
 sp_air_pdl_desc: "Face à la menace croissante des missiles à haute vitesse et des attaques par saturation, les lasers de défense ponctuelle aéroportés offrent un moyen d'intercepter les menaces entrantes à la vitesse de la lumière. En montant des systèmes laser à haute énergie sur des plateformes aériennes, ces armes peuvent engager et neutraliser les missiles en vol, réduisant la dépendance à des stocks d'intercepteurs limités et améliorant la survivabilité dans un espace aérien contesté."
 sp_air_helicopter_drone_control: "Contrôle des drones d'hélicoptère"
 sp_air_helicopter_drone_control_desc: "Intégrer une architecture complète de contrôle de drones aux plateformes à voilure tournante transforme les hélicoptères en nœuds de commandement aéroportés pour les atouts de reconnaissance et de frappe sans équipage. Cette approche réduit le besoin d'exposer les équipages à des tâches de routine tout en améliorant coordination, ciblage et tempo sur l'espace de bataille. La capacité est coûteuse à déployer, exigeant avionique avancée, liaisons de données sécurisées et une capacité supplémentaire de puissance et de refroidissement."
 sp_air_gunship_railcannons: "Canons ferroviaires de canonnière"
 sp_air_gunship_railcannons_desc: "Ce projet monte de lourds réseaux de canons à rail sur des cellules de canonnières dédiées, créant un aéronef capable de déchiqueter les cibles par un feu électromagnétique soutenu. Avec une vitesse initiale extrême et un contrôle de tir de précision, il peut démanteler drones, aéronefs et formations au sol plus vite que les canons conventionnels ne peuvent réagir. La capacité est ruineusement coûteuse, exigeant une génération de puissance exceptionnelle, un refroidissement avancé et des matériaux de haute qualité pour maintenir le système opérationnel."
 sp_deep_sea_mining: "Exploitation minière en haute mer"
 sp_deep_sea_mining_desc: "Les demandes industrielles et technologiques croissantes font peser une pression accrue sur les chaînes d'approvisionnement traditionnelles. En investissant dans les capacités d'exploitation minière en haute mer, nous visons à sécuriser l'accès aux minerais critiques situés hors des zones d'extraction conventionnelles."
 sp_agriculture_drone: "Systèmes de drones agricoles"
 sp_agriculture_drone_desc: "Nourrir une population croissante tout en préservant l'efficacité devient un défi stratégique central. En introduisant des systèmes de drones agricoles avancés, nous pouvons moderniser les pratiques agricoles par un meilleur suivi, des traitements de précision et l'automatisation."
 sp_vertical_farming: "Agriculture verticale"
 sp_vertical_farming_desc: "L'urbanisation et la rareté des terres transforment la façon dont la production alimentaire doit être abordée. En investissant dans l'agriculture verticale, nous déplaçons la production agricole vers des environnements contrôlés et à haute densité, moins dépendants du climat et de la géographie."
 sp_robotic_humanoid: "Assistants robotiques domestiques"
 sp_robotic_humanoid_desc: "Alors que la vie quotidienne s'intègre davantage à la technologie, le potentiel des robots humanoïdes pour assister les personnes à domicile s'accroît. En développant des assistants robotiques domestiques, nous visons à soutenir les tâches quotidiennes telles que l'entretien du foyer, les soins et l'aide personnelle."
 sp_robotic_surgery: "Chirurgie robotique"
 sp_robotic_surgery_desc: "Les systèmes médicaux subissent une pression croissante face au vieillissement des populations et à la hausse des besoins de santé. En élargissant le recours à la chirurgie assistée par robot, nous visons à améliorer la précision, réduire les temps de convalescence et rendre les procédures avancées plus largement disponibles."
 sp_smart_grid: "Infrastructure de réseau intelligent"
 sp_smart_grid_desc: "La consommation d'énergie croissante et l'intégration de technologies avancées imposent de nouvelles exigences aux réseaux électriques nationaux. En investissant dans des infrastructures de réseau intelligent, nous pouvons mieux gérer la distribution d'électricité, équilibrer offre et demande, et réduire les inefficacités systémiques."
 sp_equipment_recycling: "Programme de recyclage de l'équipement militaire"
 sp_equipment_recycling_desc: "Un programme complet pour récupérer, rénover et recycler l'équipement militaire obsolète ou endommagé. En récupérant matériaux et composants critiques des plateformes déclassées, les forces armées peuvent réduire la tension industrielle, améliorer la résilience de l'approvisionnement et compenser en partie les pertes de production lors de conflits prolongés."
 sp_epigenetic_reprogramming: "Reprogrammation épigénétique"
 sp_epigenetic_reprogramming_desc: "Un programme de recherche biomédicale axé sur la modification de l'expression des gènes sans altérer les séquences d'ADN, visant à renforcer la résilience physique, les performances cognitives et les taux de récupération du personnel militaire. S'il offre des avantages potentiels à long terme en efficacité d'entraînement et en préparation au combat, le programme soulève des questions éthiques et exige un contrôle réglementaire strict."
 sp_nuclear_energy: "Réacteur d'énergie nucléaire"
 sp_nuclear_energy_desc: "Les réacteurs nucléaires conviennent à la production de matériaux pour les bombes. Mais la quantité d'énergie produite pourrait plutôt alimenter l'industrie civile et militaire."
 sp_nuclear_bomb: "Projet de bombe à fission nucléaire"
 sp_nuclear_bomb_desc: "Une bombe utilisant le processus de fission nucléaire pour libérer l'énergie stockée de l'atome en un instant apocalyptique. Avec une telle arme dans notre arsenal, qui oserait s'opposer à nous ?"
 sp_amws_combat_system: "Système de combat AMWS-21"
 sp_zamws_advanced_mws: "Système d'armes multiples avancé XAMWS-24"
 sp_xciws_close_in_weapon_system: "Système d'arme rapproché XCIWS-2B"
 sp_close_range_battle_halberd: "Hallebarde de combat rapproché Type-77"
 sp_great_sword: "Grande épée BWS-3"
 special_project_consumer_costs_high: "Achat de ressources secrètes"
 special_project_consumer_costs_high_desc: "Des voix feutrées murmurent qu'une quantité considérable de ravitaillement est détournée par le gouvernement vers des lieux en apparence anodins. Certains suggèrent que les ressources sont consommées dans des projets de recherche et développement secrets, mais il n'existe guère de preuves concrètes pour le confirmer..."
 special_project_consumer_costs_medium: "Achat de ressources secrètes"
