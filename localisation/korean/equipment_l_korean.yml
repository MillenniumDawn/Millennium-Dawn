 SAU_infantry_weapons_2_desc: "G3A3는 G3 시리즈 중 가장 잘 알려진 버전입니다. 개선된 후방 드럼 조준기와 전방 조준기, 소염기/머즐 브레이크, 고정식 플라스틱 개머리판, 그리고 플로팅 배럴과 접촉하지 않는 플라스틱 핸드가드가 특징입니다. 핸드가드는 슬림형 통풍식과 와이드형 두 가지 버전으로 출시되었으며, 와이드형은 양각대 장착을 통해 안정성을 향상시킬 수 있습니다."
 SAU_infantry_weapons_4_desc: "헤클러앤코흐 G36(게베르 36)은 5.56x45mm 구경의 돌격소총으로, 1990년대 초 독일 무기 제조업체 헤클러앤코흐에서 더 무거운 7.62x51mm G3 모델을 대체하기 위해 개발되었습니다. 1990년대 중반 독일 연방군에 채택되어 G3를 대체했으며, 이후 수출용으로도 인기를 얻어 독일, 스페인, 영국 등 여러 국가의 군대와 경찰에서 실전에 투입되었습니다."
 SAU_infantry_weapons_5_desc: "M4 카빈 소총은 M16 돌격소총의 단축형 및 경량형 변형 모델입니다. M4는 5.56x45mm NATO 탄을 사용하는 공랭식, 직접 가스 작동식, 탄창식 카빈 소총입니다. 14.5인치(370mm) 길이의 총열과 접이식 개머리판을 갖추고 있습니다."
 YEM_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 YEM_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 YEM_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
 YEM_infantry_weapons_4_desc: "In 1991 the Izhmash factory in the city of Izhevsk began full-scale production of a modernized variant of the AK-74, the AK-74M. Fitted with a lightened bolt and carrier assembly as well as a glass-filled polyamide stock."
 YEM_infantry_weapons_5_desc: "AK-103 돌격소총은 7.62x39mm M43 탄약을 사용하는 AK-74M의 파생형입니다. 구형 AKM과 마찬가지로 AK-103은 야간 투시경과 망원 조준경을 포함한 다양한 조준기를 사용할 수 있으며, 총검이나 유탄 발사기도 장착할 수 있습니다. 대부분의 AK 소총과의 차이점은 AK-103이 플라스틱 및 저렴한 재료를 사용한다는 점입니다."
 YEM_infantry_weapons_6_desc: "AK-12는 러시아의 신형 돌격소총입니다. 라트니크 미래 보병 훈련 프로그램의 일환으로 개발되었으며, 특수부대용으로 제작되어 AK-103의 생산을 대체할 예정입니다. AK-12는 균형감각과 인체공학적 설계가 개선되어 현재까지 러시아에서 가장 정예화된 돌격소총으로 평가받고 있습니다."
 EGY_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
