 Anti_tank_5: "대전차 유도 미사일(ATGM) 2035"
 Anti_tank_5_desc: "대전차 유도 미사일은 중장갑 차량을 공격하도록 특별히 설계된 고폭 탄두를 사용하는 휴대용 미사일 체계입니다."
 Heavy_Anti_tank_5: "차량 탑재 ATGM 2035"
 Heavy_Anti_tank_5_desc: "중형 대전차 유도 미사일 체계는 더 긴 사거리와 더 큰 미사일 탄두 중량을 갖습니다. 이로 인해 늘어난 무게 때문에 휴대하기에 적합하지 않아 차량에 탑재됩니다. 중장갑 차량을 공격하도록 특별히 설계된 고폭 탄두를 사용합니다."
