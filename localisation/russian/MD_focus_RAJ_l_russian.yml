l_russian:
 Cheap_Labor: "Дешёвая рабочая сила"
 Cheap_Labor_desc: "Рожденная историческими моделями колониальной эксплуатации и массового неквалифицированного труда, рабочая сила [ROOT.GetName] остается многочисленной и недорогой. Хотя этот избыток рабочей силы стимулировал промышленный рост после обретения независимости, он продолжает подпитывать цикл неравенства и социальных волнений, которые ставят национальную стабильность на шаткую почву."
 RAJ_iri_fake_ns: "Высококоррумпированная военная промышленность"
 RAJ_iri_fake_ns_desc: "Сложное наследие индийской эпохи лицензионного раджа, характеризующейся жёстким регулированием и бюрократией, до сих пор сохраняется в оборонной промышленности. В то время как реформы 1990-х годов открыли двери для развития гражданской промышленности, военный сектор остаётся паутиной коррупции и неэффективности, обусловленной непрозрачными процессами закупок и отсутствием подотчётности, унаследованными от прошлых десятилетий."
 RAJ_re_fake_militar: "Вооружённые силы с высокой степенью дезорганизации"
 RAJ_re_fake_militar_desc: "Тень раздела Индии и поспешно созданных после него военных структур до сих пор не покидает вооружённые силы. В сочетании с бюрократической неэффективностью и отсутствием современных методов координации это приводит к дезорганизации военного аппарата. Однако эти недостатки позволяют выявить те направления, которые наиболее остро нуждаются в совершенствовании, что несколько снижает затраты ресурсов на перестройку военных доктрин."
 india_divided: "Индийский регионализм"
 india_divided_desc: "Огромное культурное и языковое разнообразие Индии, наследие её богатой истории и бесчисленных королевств, часто проявляется в виде регионализма, который осложняет национальное управление. Эта мозаика местных интересов исторически подрывала централизованную политическую власть, делая разработку согласованной политики сложной задачей. Тем не менее, существуют различные пути — как примирительные, так и насильственные — для преодоления этого сложного ландшафта и потенциального формирования более единой национальной идентичности."
 RAJ_gujarat_trouble_idea: "Коммунальные беспорядки в Гуджарате"
 RAJ_gujarat_trouble_idea_desc: "Межобщинная напряженность в Гуджарате, являющаяся наследием глубоко укоренившихся религиозных и этнических разногласий, переросла в открытый конфликт между мусульманами и индусами. Эта ситуация не только дестабилизирует регион, но и истощает военные и административные ресурсы, влияя на боеготовность и выносливость войск, дислоцированных в сложных условиях. Эти беспорядки будут продолжаться до тех пор, пока уровень общественного мнения как среди индусов, так и среди мусульман не восстановится до 35% или выше, и пока более высокие религиозные убеждения не ослабят ситуацию."
 RAJ_looming_water: "Нехватка воды"
 RAJ_looming_water_desc: "Острая нехватка воды в Индии, усугубляемая нерациональным ведением сельского хозяйства и стремительной урбанизацией, имеет далеко идущие последствия. Она не только подрывает социальную стабильность и систему управления, но и серьёзно затрудняет проведение военных операций и материально-техническое обеспечение. Несмотря на тяжелое текущее положение, согласованные усилия по управлению водными ресурсами и развитию инфраструктуры могли бы существенно смягчить эти пагубные последствия."
 india_focus: "Древо фокусов Индии"
 RAJ_indian_minist_of_foreign_affairs: "Министерство иностранных дел Индии"
 RAJ_indian_minist_of_foreign_affairs_desc: "Внедрение институционального контроля за внешней политикой приводит к централизации дипломатической стратегии и международного взаимодействия."
 RAJ_affairm_claims_on_aksai_chin: "Претензии аффримов на Аксайский Чин"
 RAJ_affairm_claims_on_aksai_chin_desc: "Аксай Чин на протяжении десятилетий является предметом разногласий между Индией и Китаем. Индия утверждает, что этот район является неотъемлемой частью её суверенной территории, в то время как Китай заявляет о своих исторических претензиях на этот регион. Спор остаётся нерешенным и по-прежнему представляет собой сложную проблему в индийско-китайских отношениях."
 indian_event.1.t: "Индия подтверждает свои претензии на Аксай Чайна"
 indian_event.1.d: "Индия вновь подтвердила свои непоколебимые претензии на Аксай-Чин на фоне продолжающегося территориального спора с Китаем. Спорный регион, расположенный в восточном секторе Джамму и Кашмира, долгое время являлся предметом разногласий между двумя азиатскими соседями. Правительство Индии вновь заявило о своей позиции, подчеркнув, что Аксай-Чин является неотъемлемой частью суверенной территории Индии. Это подтверждение стало решительным ответом на исторические претензии Китая на этот регион. Спор вокруг Аксай-Чина представляет собой серьезную проблему в индийско-китайских отношениях, поскольку обе страны придерживаются противоположных взглядов на законное право собственности на эту территорию. Дипломатические усилия по урегулированию вопроса продолжаются, но окончательное решение до сих пор не найдено. Твердая позиция Индии в отношении своих территориальных претензий подчеркивает ее приверженность защите национального суверенитета и сохранению единства своих границ. Правительство остается открытым для конструктивного диалога и мирных переговоров для решения давнего спора и поиска пути вперед в интересах региональной стабильности и сотрудничества. По мере развития ситуации международное сообщество внимательно следит как за Индией, так и за Китаем, надеясь на мирное урегулирование, которое позволит снизить напряженность и способствовать взаимопониманию."
 indian_event.1.a: "Интересно"
 indian_event.2.t: "Индия отзывает свои претензии на Аксай-Чин!"
 indian_event.2.d: "В значительном и неожиданном шаге Индия объявила о своем решении снять претензии на спорный регион Аксай-Чин, расположенный в восточной части Джамму и Кашмира. Территория является давним предметом спора между Индией и Китаем, что привело к напряженным отношениям между двумя странами. Решение индийского правительства отказаться от претензий на Аксай-Чин является смелым шагом на пути к мирному разрешению территориального спора. Хотя регион был спорным вопросом на протяжении десятилетий, этот неожиданный шаг отражает приверженность Индии развитию диалога и деэскалации напряженности с соседней страной. Отзыв претензий на Аксай-Чин направлен на создание атмосферы, благоприятствующей конструктивным переговорам с Китаем, с надеждой на взаимоприемлемое решение, уважающее интересы обеих стран. Это неожиданное развитие событий, вероятно, привлечет внимание международного сообщества, и наблюдатели ждут ответа Китая на шаг Индии. Это решение знаменует собой потенциальный поворотный момент в отношениях между Индией и Китаем и может открыть новые возможности для региональной стабильности и сотрудничества. Ожидается, что по мере развития ситуации Индия и Китай начнут дипломатические переговоры для изучения путей продвижения вперед, обеспечив мирное сосуществование и процветание двух азиатских гигантов."
 RAJ_friendship_with_china: "Дружба с Китаем"
 RAJ_friendship_with_china_desc: "Мы должны забыть наши прошлые конфликты и обеспечить полный и стабильный мир между нашими странами."
 RAJ_strat_milcoop_china: "Военное сотрудничество с Китаем"
 RAJ_strat_milcoop_china_desc: "Военное сотрудничество с Китаем крайне необходимо для взаимодействия наших армий и повышения их боевой эффективности."
 RAJ_partnership_with_tajikistan: "Партнёрство с Таджикистаном"
 RAJ_partnership_with_tajikistan_desc: "Индию и Таджикистан связывают прочные узы дружбы, основанные на исторических, культурных и стратегических связях. Обе страны имеют долгую историю тесного взаимодействия и культурного обмена. Индия оказывает Таджикистану помощь в развитии и предоставляет техническую экспертизу в различных секторах, включая развитие инфраструктуры, образование и здравоохранение. Кроме того, обе страны сотрудничают в области обороны и безопасности: Индия обучает военнослужащих и оказывает военную помощь Таджикистану. С другой стороны, Таджикистан последовательно поддерживает позицию Индии по различным международным вопросам. "
 RAJ_withdraw_claims_on_aksai_chin: "Снять претензии с Аксайского Чина"
 RAJ_withdraw_claims_on_aksai_chin_desc: "Снятие претензий с Аксайского полуострова имеет большое значение для развития отношений с Китаем и ослабления напряженности между нашими странами."
 RAJ_aksai_chin_withdraw_tt: "§YБольше не сможет вступать в пограничные конфликты с §B[CHI.GetNameDef]§! из-за Аксайского Чина.§!"
 RAJ_push_the_kasmir_question: "Решение кашмирского вопроса"
 RAJ_push_the_kasmir_question_desc: "Продвижение кашмирского вопроса имеет решающее значение для давления на агрессивный Пакистан!"
 RAJ_kashmir_quest_tt: "§YЭто приведёт к росту индийско-пакистанской напряженности§!"
 RAJ_increase_regional_influence: "Усиление регионального влияния"
 RAJ_protect_asian_allies: "Защита азиатских союзников"
 RAJ_protect_asian_allies_desc: "Чтобы противостоять доминированию Китая в регионе, мы должны поддерживать Мьянму и ее дела."
 RAJ_partnership_with_iran: "Партнёрство с Ираном"
 RAJ_partnership_with_iran_desc: "Связи с Ираном обеспечивают доступ к торговле и стратегическое присутствие в регионе Индийского океана."
 RAJ_increase_regional_influence_desc: "Расширение политического и экономического влияния в Южной Азии и регионе Индийского океана."
 RAJ_new_army_idea: "Новая индийская армия"
 RAJ_indian_saarc_idea: "SAARC"
 RAJ_indian_saarc_idea_desc: "Южноазиатская ассоциация регионального сотрудничества, созданная в 1985 году, объединяет крупнейшие государства Южной Азии для развития и координации политики. Индийское руководство блоком придает политический вес кабинету министров своей страны и улучшает торговые отношения с государствами-членами."
 RAJ_saarc: "Южно-Азиатская ассоциация регионального сотрудничества"
 RAJ_saarc_desc: "Связи СААРК объединяют Южную Азию посредством торговли и развития, хотя региональная напряженность препятствует более глубокой интеграции."
 indian_event.3.t: "Индия приглашает нас в Ассоциацию регионального сотрудничества стран Южной Азии"
 indian_event.3.d: "Индия приглашает нас в Южно-Азиатскую ассоциацию регионального сотрудничества, стоит ли соглашаться на вступление?"
 indian_event.3.a: "Конечно"
 indian_event.3.b: "Нет, извините"
 RAJ_act_east_policy: "Политика Act East"
 RAJ_act_east_policy_desc: "Укрепление взаимодействия в Азиатско-Тихоокеанском регионе направляет Индию в сторону Юго-Восточной Азии и региональной экономической интеграции."
 act_east_pol_tt: "§YМы начнем реализацию программы политики Act East§!"
 RAJ_asean_partner: "Партнёрство с ASEAN"
 RAJ_asean_partner_desc: "Партнерство с АСЕАН укрепляет связи в Юго-Восточной Азии посредством торговли и политической координации, несмотря на региональное соперничество."
 RAJ_east_asia_summit: "Восточно-Азиатский саммит"
 RAJ_east_asia_summit_desc: "В соответствии с нашей политикой Act East участие в Восточноазиатском саммите является важным    шагом в углублении наших дипломатических связей и совместной деятельности. Укрепляя связи с такими ключевыми игроками, как Россия, Япония и Лаос, мы прокладываем путь к более интегрированному и гармоничному региональному будущему."
 RAJ_eastas.1.t: "Восточно-Азиатский саммит"
 RAJ_eastas.1.d: "18-й саммит Восточной Азии (EAS) прошел сегодня в виртуальном формате, собрав лидеров 18 стран-членов для обсуждения насущных региональных проблем и укрепления сотрудничества в регионе Восточной Азии. Саммит, организованный Сингапуром, послужил площадкой для открытого диалога и сотрудничества, направленного на укрепление мира, стабильности и процветания в регионе. В EAS приняли участие лидеры, представляющие государства-члены АСЕАН, а также Австралия, Китай, Индия, Япония, Новая Зеландия, Южная Корея, Россия и США. Эта разнообразная и инклюзивная встреча отражает приверженность саммита инклюзивному региональному взаимодействию и диалогу. В ходе саммита лидеры провели откровенные дискуссии по широкому кругу вопросов, включая экономическое восстановление в эпоху после пандемии, стратегии смягчения последствий изменения климата и адаптации, безопасность на море, усилия по борьбе с терроризмом и меры по борьбе с транснациональной преступностью. Кроме того, лидеры рассмотрели геополитические проблемы и подчеркнули важность соблюдения международного права, уважения суверенитета и поддержания порядка, основанного на правилах, в Индо-Тихоокеанском регионе."
 RAJ_eastas.1.o1: "Интересно"
 RAJ_neutrality_idea: "Политика нейтралитета"
 RAJ_neutrality_idea_desc: "Политика нейтралитета Индии направлена на поддержание хрупкого баланса, позволяющего нам оставаться в стороне от мировых проблем. Пришло время выйти из этих групп и провозгласить Индию новой нейтральной страной."
 RAJ_bimstek: "BIMSTEK"
 RAJ_bimstek_desc: "Инициатива Бенгальского залива по многоотраслевому техническому и экономическому сотрудничеству является региональной организацией, включающей семь стран, окружающих Бенгальский залив: Индию, Бангладеш, Шри-Ланку, Бутан, Непал, Мьянму и Таиланд. Созданная в 1997 году, BIMSTEC направлена ​​на содействие сотрудничеству в различных секторах, включая торговлю, инвестиции, энергетику, технологии, туризм и борьбу с терроризмом, среди прочих. Эта субрегиональная группировка стратегически расположена для улучшения связей и экономической интеграции в Южной и Юго-Восточной Азии. Хотя BIMSTEC обладает огромным потенциалом, прогрессу порой препятствуют политические и логистические проблемы, включая ограниченную связь между ее государствами-членами. Тем не менее, она остается важной платформой для содействия сотрудничеству и развитию в географически и культурно разнообразном регионе, особенно в условиях, когда страны стремятся укрепить региональную стабильность и экономический рост."
 RAJ_indian_bimstek_idea: "BIMSTEK"
 RAJ_indian_bimstek_idea_desc: "Инициатива Бенгальского залива по многоотраслевому техническому и экономическому сотрудничеству, основанная в 1997 году, связывает Индию с Бангладеш, Шри-Ланкой, Бутаном, Непалом, Мьянмой и Таиландом в целях скоординированной работы в области торговли, энергетики и борьбы с терроризмом. Сотрудничество способствует умеренному увеличению темпов внутренних исследований и повышению политической стабильности."
 indian_event.4.t: "Приглашение в BIMSTEK"
 indian_event.4.d: "Индия приглашает нас в партн`рскую программу BIMSTEK, стоит ли нам присоединяться?"
 indian_event.4.a: "Конечно!"
 indian_event.4.b: "Нет, извините"
 RAJ_befriend_butan_and_nepal: "Дружить с Непалом и Бутаном"
 RAJ_befriend_butan_and_nepal_desc: "Индию, Бутан и Непал связывают глубокие исторические, культурные и географические связи. Индия исторически играет важнейшую роль в развитии и стабильности этих гималайских стран. Бутан поддерживает с Индией уникальные отношения, характеризующиеся тесным дипломатическим, экономическим и стратегическим сотрудничеством. Индия оказывает Бутану помощь в различных проектах развития и в вопросах безопасности, поддерживая с ним тесные дружественные партнерские отношения."
 RAJ_support_nov_idea: "Индийская военная поддержка"
 RAJ_support_neaplese_army: "Поддержите непальскую армию"
 RAJ_support_neaplese_army_desc: "Индийско-непальское военное сотрудничество имеет историческую основу, обусловленную географической близостью и взаимной озабоченностью вопросами безопасности. Между двумя странами существует традиция военных обменов, обучения и тесных оборонных связей. Индия является крупным поставщиком военной техники в Непал, включая оружие, боеприпасы и технические средства. Оба государства сотрудничают в таких областях, как борьба с терроризмом, ликвидация последствий стихийных бедствий и поддержание региональной стабильности. Кроме того, полки Гуркха индийской армии имеют тесную историческую связь с Непалом, набирая в свои ряды солдат из этого региона."
 RAJ_mutual_trade_agreements: "Взаимные деловые соглашения"
 RAJ_mutual_trade_agreements_desc: "Индийско-бутанское деловое сотрудничество характеризуется прочным и многогранным экономическим партнерством, глубоко укорененным в исторических связях и взаимных интересах. Бутан в значительной степени пользуется экономической поддержкой и помощью Индии в целях развития, а Индия является крупнейшим торговым партнером Бутана и источником иностранных инвестиций. Ключевыми областями сотрудничества являются гидроэнергетические проекты, в рамках которых индийские компании участвуют в совместных предприятиях по освоению богатого гидроэнергетического потенциала Бутана. Это не только способствует экономическому росту Бутана, но и удовлетворяет энергетические потребности Индии."
 RAJ_befriend_bangladesh: "Дружить с Бангладеш"
 RAJ_befriend_bangladesh_desc: "Торговля между Индией и Бангладеш резко возросла благодаря развитию инфраструктуры и преференциальным торговым соглашениям. Обе страны сотрудничают в таких крупных проектах, как строительство трансграничных автомагистралей и линий электропередачи, что способствует укреплению региональных связей. Кроме того, обе страны сотрудничают в таких областях, как борьба с терроризмом, обеспечение безопасности и ликвидация последствий стихийных бедствий."
 RAJ_defense_bangladesh: "Оборонный пакт с Бангладеш"
 RAJ_defense_bangladesh_desc: "Благодаря ряду соглашений и договоренностей Индия и Бангладеш фактически укрепили свои связи в области обороны. Мы должны ратифицировать рамочное соглашение об оборонном сотрудничестве, которое имеет историческое значение, поскольку оно значительно продвинет наш союз в области безопасности. Расширение военных обменов, обучение, сотрудничество в области борьбы с терроризмом и обеспечения морской безопасности - все это предусмотрено данным рамочным соглашением."
 RAJ_border_agreements: "Пограничные соглашения с Бангладеш"
 RAJ_border_agreements_desc: "Это решение не только устранит значительный источник трений, но и откроет путь к расширению связей и сотрудничества между двумя странами. Более 50 тыс. человек, проживающих в анклавах, смогут обменяться, получив гражданство в своих странах. Кроме того, это позволит реализовать ряд инициатив в области развития, таких как строительство дорог, мостов и других объектов инфраструктуры вдоль вновь созданных приграничных территорий."
 indian_event.5.t: "Соглашение о границе с Индией"
 indian_event.5.d: "Индия предлагает заключить с нами соглашение о границе, чтобы мы могли урегулировать наши пограничные споры и продолжить взаимное сотрудничество."
 indian_event.5.a: "Конечно."
 indian_event.5.b: "Это уже слишком!"
 RAJ_suppress_probangl_separat: "Подавление пробангладешского сепаратизма"
 RAJ_suppress_probangl_separat_desc: "Несмотря на укрепление наших оборонных связей с Бангладеш, в стране все еще сохраняются сепаратистские настроения, выступающие за более тесный союз с восточным соседом. Для обеспечения национальной целостности страны крайне важно устранить и подавить эти сепаратистские настроения, обеспечив стабильность и единство Индии."
 RAJ_approach_singapore: "Дружба с Сингапуром"
 RAJ_approach_singapore_desc: "Сингапур - наш давний нейтральный партнер в азиатском регионе. Нам необходимо улучшать наши отношения с ним."
 RAJ_meaf: "MEAF"
 RAJ_meaf_desc: "Рынки Ближнего Востока и Африки стали весьма важными после различных преобразований в их регионах. Нам необходимо улучшать отношения с ними не только в торговом, но и в военно-политическом плане."
 RAJ_partnership_with_uae: "Партнёрство с ОАЭ"
 RAJ_partnership_with_uae_desc: "Укрепление связей с ОАЭ расширяет торговлю в Персидском заливе и стратегическое влияние."
 RAJ_gulf_oil_deal: "Нефтяная сделка с ССАГПЗ"
 RAJ_gulf_oil_deal_desc: "Индия испытывает большую потребность в топливе и нефти. Сотрудничество со странами Персидского залива - прямой ключ к удовлетворению наших потребностей."
 RAJ_oman_military_base: "Военная база в Омане"
 RAJ_oman_military_base_desc: "Оман и Индию связывают не только культурно-исторические, но и политические связи, а также общие интересы в регионе. Нам необходимо укреплять связи."
 RAJ_befriend_algeria: "Дружить с Алжиром"
 RAJ_befriend_algeria_desc: "Алжир - одна из немногих стран, с которыми у нас высокий товарооборот в Северной Африке. Возможно, в скором времени они захотят углубить свои отношения с нами, и мы должны создать для этого благоприятную почву."
 RAJ_utilizing_indian_diaspora: "Связи с диаспорой"
 RAJ_utilizing_indian_diaspora_desc: "Использование потенциала индийской диаспоры по всему миру способствует расширению торговых связей и укреплению дипломатического влияния за рубежом."
 RAJ_mauritius: "Дружить с Маврикием"
 RAJ_mauritius_desc: "На Маврикии проживает значительная диаспора, которая оказывает большое влияние на политику страны. Пришло время использовать это для укрепления связей."
 RAJ_srilank_relat: "Дружить со Шри-Ланкой"
 RAJ_srilank_relat_desc: "Исторически сложилось так, что отношения между Шри-Ланкой и Индией были очень теплыми. Имея исторические корни, жители Шри-Ланки относятся к нам очень доброжелательно. Мы можем считать эту страну братской, и наши отношения с ней должны улучшаться."
 RAJ_seychelles: "Дружить с Сейшельскими островами"
 RAJ_seychelles_desc: "Сейшельские острова давно стремятся найти геополитическую альтернативу для укрепления торговых связей, обороноспособности и сотрудничества в области технологий. Дружба с Индией является для них естественным выбором."
 RAJ_tradepar_china: "Торговое партнёрство с Китаем"
 RAJ_tradepar_china_desc: "Несмотря на напряжённые отношения с Китаем, торговое партнёрство с ним по-прежнему необходимо для обеих наших экономик."
 RAJ_eastern_affiars: "Восточные вопросы"
 RAJ_eastern_affiars_desc: "Индия традиционно поддерживает хорошие отношения с развивающимися державами. Мы должны использовать это для улучшения дипломатических и торговых отношений."
 RAJ_stratpar_russi: "Стратегическое партнёрство с Россией"
 RAJ_stratpar_russi_desc: "Несмотря на хорошие отношения между Китаем и Россией, Россия ещ` со времен СССР является нашим надежным партнером в области торговли и обороны. Пришло время обновить эти отношения."
 RAJ_stratpar_soaf: "Стратегическое партнёрство с ЮАР"
 RAJ_stratpar_soaf_desc: "ЮАР - одна из самых быстрорастущих экономик мира. Как и мы, они стремятся к совершенствованию мировой торговли и поиску партнеров."
 RAJ_stratpar_braz: "Стратегическое партнёрство с Бразилией"
 RAJ_stratpar_braz_desc: "Бразилия уже давно поддерживает относительно хорошие отношения. Мы должны найти способы улучшить торговлю с ней и укрепить политические связи."
 RAJ_looking_west: "Взгляд на Запад"
 RAJ_looking_west_desc: "Несмотря на свою традиционно нейтральную позицию, Индия имеет относительно хорошие отношения с западными странами, с которыми её связывает не только торговля, но и общий враг - Китай."
 RAJ_friendship_with_israel: "Дружба с Израилем"
 RAJ_friendship_with_israel_desc: "Индийско-израильские отношения имеют долгую историю совместного сотрудничества. В новом, XXI веке эти связи нуждаются в подтверждении."
 RAJ_friendship_with_france: "Дружба с Францией"
 RAJ_friendship_with_france_desc: "После подписания в 1998 году стратегического пакта с Францией она стала одним из крупнейших партнеров Индии в НАТО. Эти отношения необходимо продуктивно углублять."
 RAJ_become_major_non_nato_allies: "Союзник НАТО"
 RAJ_become_major_non_nato_allies_desc: "Возможно, для того чтобы иметь возможность противостоять Китаю и Пакистану, нам необходимо улучшить отношения с Западом настолько, чтобы подписать соглашение об ассоциации с НАТО или даже нечто большее. При нынешних тенденциях, возможно, Запад встретит нас с распростертыми руками."
 RAJ_military_coop_with_us: "Военно-техническое сотрудничество с США"
 RAJ_military_coop_with_us_desc: "США - сверхдержава, обладающая самыми передовыми разработками в области обороны. Нам необходимо сотрудничать с ними и повышать свою обороноспособность."
 RAJ_tradedeals_with_us: "Торговые сделки с США"
 RAJ_tradedeals_with_us_desc: "Торговля с США - это последовательный шаг в нашей политике сотрудничества с Западом. Мы найдём, чем заинтересовать друг друга в плане торговли."
 indian_event.6.t: "Индийское предложение"
 indian_event.6.d: "После недавнего присоединения к нам Индии они просят нас лишить Пакистан статуса основного союзника, не являющегося членом НАТО."
 indian_event.6.a: "Безусловно!"
 indian_event.6.b: "Нет, извините"
 indian_event.667.t: "США одобрили наше предложение."
 indian_event.667.d: "Они лишат Пакистан статуса основного союзника вне НАТО."
 indian_event.667.a: "Отлично"
 indian_event.668.t: "США отклонили наше предложение."
 indian_event.668.d: "Пакистан останется основным союзником США вне НАТО"
 indian_event.668.a: "Печально"
 RAJ_support_taiwan: "Поддержка Тайваня"
 RAJ_support_taiwan_desc: "Хотя Тайвань претендует на многие территории, противоречащие нашим интересам, возможно, стоит поддержать его против общего врага - КНР."
 RAJ_indian_modern_prog: "Подача заявки в USAID"
 RAJ_indian_modern_prog_desc: "Американские программы помощи уже давно стали привычными для Индии. Возможно, стоит улучшить и укрепить сотрудничество в этой области."
 RAJ_joining_nato: "Партнерство НАТО"
 RAJ_joining_nato_desc: "НАТО действует исключительно в евроатлантическом регионе, поэтому полноправное членство недостижимо. Однако мы можем стремиться к наилучшему варианту: статусу крупного союзника, не входящего в НАТО, что откроет двери для совместных учений, передачи технологий и привилегированных отношений в сфере обороны с Западом."
 RAJ_SCO_join: "Вступление в ШОС"
 RAJ_SCO_join_desc: "Несмотря на напряженные отношения с Китаем, наши отношения с Россией достаточно продуктивны. Возможно, нам удастся войти в структуру ШОС, несмотря на все противоречия с КНР."
 RAJ_cont_non_aligned_polic: "Продолжение пути неприсоединения"
 RAJ_cont_non_aligned_polic_desc: "Индия традиционно идёт по пути неприсоединения и полного нейтралитета. Мы не должны искать новых союзников и переходить границы дозволенного. Мы должны сохранять дистанцию."
 RAJ_isolationist_policies: "Политика изоляционизма"
 RAJ_isolationist_policies_desc: "Несмотря на нашу торговлю, социальная изоляция от остального мира может быть полезной."
 RAJ_boosting_our_local_market: "Укрепление местного рынка"
 RAJ_boosting_our_local_market_desc: "Укрепление внутреннего рынка - последовательный шаг к достижению полной автономии Индии от этого мира."
 RAJ_active_support_of_stete_woned_shiet: "Активная поддержка"
 RAJ_active_support_of_stete_woned_shiet_desc: "Мы должны поддерживать не только рыночные отношения в стране, но и государственные корпорации, которые будут регулировать важнейшие аспекты экономики."
 RAJ_india_first: "Индия прежде всего"
 RAJ_india_first_desc: "Индия должна быть превыше всего. Мы одни в этом мире, и нам необходимо это осознать."
 RAJ_indian_autarky_effort: "Индийская сфера влияния"
 RAJ_indian_autarky_effort_desc: "Пришло время не только улучшать отношения с нашими партнерами, но и строить собственную сферу влияния."
 RAJ_self_sufficient_market: "Идеи новой волны"
 RAJ_self_sufficient_market_desc: "Пора признать, что наш путь - это новая веха в идеологической парадигме Индии - мы строим сво`, новое будущее."
 RAJ_asking_nato_help_pak: "Выгнать Пакистан"
 RAJ_asking_nato_help_pak_desc: "Пакистан уже давно является союзником США вне НАТО. Нам необходимо исключить их присутствие в сотрудничестве с Западом и занять их место."
 RAJ_indias_politics: "Индийская политика"
 RAJ_indias_politics_desc: "Индийская политика находится на переломе от одного тысячелетия к другому. Как будет строиться её история?"
 indian_event.7.t: "Индийская политика"
 indian_event.7.d: "В новом тысячелетии Индия столкнулась с сочетанием политических и экономических проблем, пытаясь ориентироваться в сложной политической обстановке и решать насущные вопросы. Новое тысячелетие принесло с собой ряд препятствий, которые проверили на прочность демократические институты Индии и экономическую стабильность. На политическом фронте страна пережила фрагментацию политического ландшафта, характеризующуюся коалиционными правительствами и частыми сменами руководства. Это создало определенную степень нестабильности и препятствовало реализации важнейших реформ. Отсутствие явного большинства в центральном правительстве сделало процесс принятия решений сложным, часто требующим деликатных переговоров с различными региональными и идеологическими партнерами. В экономическом плане Индия боролась с такими постоянными проблемами, как бюджетный дефицит, медленный промышленный рост и безработица. Экономика столкнулась с препятствиями в полной мере в полной мере использовать результаты реформ, начатых в 1990-х годах, и некоторые сектора пережили вялый рост. Структурные проблемы, бюрократическая волокита и неадекватная инфраструктура затрудняли ведение бизнеса и ограничивали потенциал страны для быстрого экономического роста. Кроме того, Индия стала свидетелем разрушительных последствий краха дотком-пузыря, которые оказали волновое воздействие на индийский сектор информационных технологий. Многие ИТ-компании столкнулись с трудностями на фоне спада на мировых рынках, что привело к увольнениям и финансовым трудностям в отрасли. В условиях этих проблем правительство сосредоточилось на мерах по стимулированию экономического роста, привлечению иностранных инвестиций и развитию предпринимательства. Были предприняты шаги по развитию инфраструктуры, упрощению нормативных актов и стимулированию промышленной деятельности. Однако эффект от этих инициатив проявился не сразу и потребовал постоянных усилий для достижения положительных результатов. Несмотря на препятствия, устойчивость и демократические основы Индии остались нетронутыми. Активное гражданское общество страны, независимая судебная система и свободная пресса сыграли решающую роль в обеспечении подотчетности и содействии общественному обсуждению важных вопросов."
 indian_event.7.a: "Интересно"
 RAJ_atal_bihari_vajpayee: "Атал Бихари Ваджпаи"
 RAJ_atal_bihari_vajpayee_desc: "Атал Бихари Ваджпаи - выдающийся индийский государственный деятель и видный политический деятель Индии. Он трижды занимал пост премьер-министра Индии: сначала на короткий период в 1996 г., затем с 1998 по 1999 гг. и, наконец, с 1999 г. Ваджпаи был одним из основателей партии Бхаратия Джаната и одним из ключевых лидеров Раштрия Сваямсевак Сангх, индуистской националистической организации."
 RAJ_lahore_summit_legacy: "Наследие Лахорского саммита"
 RAJ_lahore_summit_legacy_desc: "Лахорская декларация - это двустороннее соглашение и договор об управлении между Индией и Пакистаном. Договор был подписан 21 февраля 1999 года по итогам исторического саммита в Лахоре и ратифицирован парламентами обеих стран в том же году. По условиям договора было достигнуто взаимопонимание в отношении развития атомных арсеналов и недопущения случайного и несанкционированного боевого применения ядерного оружия. Лахорская декларация возложила на руководство обеих стран дополнительную ответственность за предотвращение ядерной гонки, а также конфликтов как неконвенционального, так и конвенционального характера."
 RAJ_prevention_of_terror_act: "Закон о предотвращении терроризма"
 RAJ_prevention_of_terror_act_desc: "Закон N 15 от 2002 г. О принятии мер по предотвращению террористической деятельности и борьбе с ней, а также по вопросам, связанным с этим."
 indian_event.8.t: "Урегулирование протестов в Гуджарате"
 indian_event.8.d: "Беспорядки были вызваны инцидентом, в котором был подожжен поезд, перевозивший индуистских паломников, в результате чего погибло несколько человек. Инцидент был приписан предполагаемому нападению мусульманской толпы. Последствия инцидента с поездом привели к широкомасштабному насилию с общинными столкновениями между индуистскими и мусульманскими общинами в различных частях Гуджарата. Протесты и последующие беспорядки привели к гибели сотен людей, травмам и значительному ущербу имуществу. Что нам делать?"
 indian_event.8.a: "Моди справится с этой задачей!"
 indian_event.8.b: "Будем надеяться, что протесты улягутся сами собой."
 RAJ_settling_down_gujarat: "Урегулирование протестов в Гуджарате"
 RAJ_settling_down_gujarat_desc: "Насилие вспыхнуло после пожара в поезде в Годхре, в результате которого погибли 59 человек, в основном индуистские паломники. Впоследствии в различных частях Гуджарата вспыхнули массовые межобщинные столкновения, в результате которых погибли сотни людей и тысячи были вынуждены покинуть свои дома."
 RAJ_eastas.2.t: "Страны формируют новый альянс для укрепления глобального экономического сотрудничества"
 RAJ_eastas.2.d: "Важным событием для мировой экономики стало официальное формирование альянса Бразилии, России, Индии и Китая под названием БРИК. Создание этого нового альянса направлено на укрепление экономического сотрудничества, расширение торговых связей и поощрение более взаимосвязанного мира. Формирование БРИК знаменует собой поворотный момент в мировой экономической динамике, поскольку эти четыре страны в совокупности представляют значительную долю населения, суши и экономического производства мира. Вместе они обладают огромным потенциалом для стимулирования глобального экономического роста и содействия устойчивому развитию. Основа БРИК зиждется на общих целях и взаимной выгоде. Используя свои объединенные ресурсы, страны БРИК стремятся содействовать инклюзивному и сбалансированному экономическому росту, расширять торговые и инвестиционные потоки и предоставлять платформу для сотрудничества в различных секторах, включая финансы, энергетику, инфраструктуру и технологии. Этот недавно сформированный альянс несет значительные перспективы для стран-членов. Бразилия, Россия, Индия и Китай привносят уникальные сильные стороны и возможности. Бразилия обладает богатыми природными ресурсами и динамичным сельскохозяйственным сектором, в то время как Россия известна своими энергетическими запасами и технологическим мастерством. Развивающийся сектор услуг и квалифицированная рабочая сила Индии способствуют ее экономической мощи, а производственные возможности и экспортные возможности Китая известны во всем мире."
 RAJ_eastas.2.o1: "Интересно"
 RAJ_BRICS: "Член BRICS"
 indian_event.9.t: "Башня BRICS"
 indian_event.9.d: "На одном из последних экономических форумов был предложен новый проект - строительство башни BRICS для целей нового международного банка."
 indian_event.9.a: "Отлично"
 RAJ_tower_tt: "§YЭто усилит китайское влияние на нас, но улучшит нашу экономику.§!"
 RAJ_BRICS_tower_project: "Проект башни BRICS"
 RAJ_BRICS_tower_project_desc: "Для укрепления межгосударственных связей необходимо создать новый Банк развития для всех стран - членов BRICS."
 RAJ_BRICS_bank: "Банк BRICS"
 indian_event.10.t: "Предложение по созданию банка BRICS"
 indian_event.10.d: "Банк BRICS предложил проект развития для каждой страны-участницы. Должны ли мы согласиться?"
 indian_event.10.a: "Конечно."
 indian_event.10.b: "Нет, извините"
 RAJ_BRICS_payment_system: "Платёжная система BRICS"
 RAJ_BRICS_payment_system_desc: "Для улучшения и упрощения торговли необходимо создать новую транзакционную и платёжную систему."
 RAJ_BRICS_cur: "Усилия по созданию единой валюты BRICS"
 indian_event.11.t: "Проект Единая валюта"
 indian_event.11.d: "BRICS предложила проект новой единой валюты, стоит ли соглашаться?"
 indian_event.11.b: "Нет, извините"
 RAJ_common_currenc_project: "Проект Единая валюта"
 RAJ_common_currenc_project_desc: "Возможно, этот проект не будет реализован немедленно, но концептуализация единой валюты является хорошей основой для взаимной интеграции."
 RAJ_BRICS_contig_reserv_arrang: "Соглашение об условном резерве"
 RAJ_BRICS_contig_reserv_arrang_desc: "Соглашение об условных резервах BRICS представляет собой механизм защиты от глобального давления на ликвидность. Это включает в себя валютные вопросы, когда национальные валюты стран-участниц подвергаются негативному воздействию глобального финансового давления."
 RAJ_eastas.3.t: "Экономический рост BRICS для инновационного будущего."
 RAJ_eastas.3.d: "11-й саммит БРИКС, прошедший в Бразилиа, успешно завершился, продемонстрировав приверженность Бразилии, России, Индии, Китая и Южной Африки развитию сотрудничества и стимулированию экономического роста. Лидеры стран-участниц собрались в бразильской столице на два дня для обсуждений, дискуссий и двусторонних встреч. Саммит начался с церемонии открытия, в ходе которой президент Бразилии приветствовал глав государств и подчеркнул важность укрепления партнерства БРИКС для преодоления глобальных вызовов и открытия новых возможностей. Лидеры провели всесторонние дискуссии по широкому кругу вопросов, включая торговлю, инвестиции, инновации и геополитические проблемы."
 RAJ_eastas.3.o1: "Интересно"
 RAJ_BRICS_pro_tempore: "Саммит в Бразилии"
 RAJ_BRICS_pro_tempore_desc: "Пришло время созвать крупнейший в истории организации саммит для укрепления отношений между государствами."
 indian_event.12.t: "Приглашение в BRICS"
 indian_event.12.d: "Мы давно являемся наблюдателем в организации BRICS. Они предлагают нам вступить. Стоит ли нам это делать?"
 indian_event.11.a: "Конечно"
 indian_event.12.b: "Нет, извините"
 RAJ_eastas.4.t: "Иран присоединяется к BRICS"
 RAJ_eastas.4.d: "Важным событием стало официальное присоединение Ирана к группе БРИКС, в которую входят Бразилия, Россия, Индия, Китай и Южная Африка. Это расширение блока БРИКС знаменует собой важную веху в региональном и глобальном сотрудничестве, поскольку Иран становится первой страной Ближнего Востока, присоединившейся к влиятельной ассоциации. Решение было объявлено на 12-м саммите БРИКС, который проводился в виртуальном формате из-за текущих глобальных обстоятельств. Включение Ирана в БРИКС стало результатом обширных обсуждений среди стран-членов, подчеркивающих стратегическую важность страны и потенциал для экономического сотрудничества. Участие Ирана не только усилит региональное влияние БРИКС, но и будет способствовать расширению сотрудничества между Ближним Востоком и другими странами БРИКС."
 RAJ_eastas.4.o1: "Интересно"
 RAJ_BRICS_expansion: "Расширение BRICS"
 RAJ_BRICS_expansion_desc: "По мере развития BRICS как значимого альянса приглашение Ирана, страны с богатыми ресурсами и стратегическим значением, придаст ему новое измерение. Такое включение может разнообразить и усилить наше коллективное видение, укрепив глобальное влияние альянса."
 RAJ_BRICS_as_econ_alliance: "Экономический альянс"
 RAJ_BRICS_as_econ_alliance_desc: "Помимо военной деятельности, истинный потенциал BRICS заключается в использовании его экономической мощи. Выступая единым экономическим фронтом, страны-участницы могут рассчитывать на ускоренный рост, финансовую стабильность, усиление синергетического эффекта и укрепление позиций блока на мировой экономической арене."
 brics_coalition: "Пакт BRICS-DEF"
 RAJ_BRICS_as_polit_alliance: "Оборонный пакт BRICS"
 RAJ_BRICS_as_polit_alliance_desc: "Объединение наших целей по достижению сбалансированной динамики мировой мощи делает естественным создание оборонного пакта BRICS. Этот пакт будет обеспечивать взаимную оборонную помощь, укрепляя связи между странами-участницами и обеспечивая коллективную безопасность от внешних угроз."
 RAJ_new_development_bank: "Новый банк развития"
 RAJ_new_development_bank_desc: "Новый Банк развития должен стать основой для интеграции BRICS и улучшения отношений между странами-участницами."
 RAJ_recognition_tibet_as_china: "Признание Тибета частью Китая"
 RAJ_recognition_tibet_as_china_desc: "Правительство Индии вскоре после обретения независимости в 1947 г. рассматривало Тибет как фактически независимую страну. Однако в последнее время индийская политика в отношении Тибета учитывает интересы Китая и признаёт Тибет частью КНР."
 RAJ_national_highway_project: "Проект развития национальных автомагистралей"
 RAJ_national_highway_project_desc: "Проект развития национальных автомагистралей - это проект четырехполосного строительства существующих национальных автомагистралей и шестиполосного строительства отдельных крупных национальных автомагистралей Индии. Проект был начат в 1998 году под руководством премьер-министра Атала Бихари Ваджпаи. Национальные автомагистрали составляют всего около 2% от общей протяженности дорог, но на них приходится около 40% общего объема перевозок по всей стране."
 RAJ_eastas.5.t: "Индия признала Тибет частью Китая"
 RAJ_eastas.5.d: "В попытке ускорить разрешение пограничного спора Индия и Китай во вторник договорились назначить специального представителя, который будет рассматривать с политической точки зрения общих двусторонних отношений возможные рамки урегулирования пограничного вопроса. В первой в истории совместной декларации о принципах отношений и всестороннего сотрудничества, подписанной премьер-министром Аталом Бихари Ваджпаи и его китайским коллегой Вэнь Цзябао, Индия признала, что Тибетский автономный район является частью территории Китайской Народной Республики."
 RAJ_eastas.5.o1: "Интересно"
 RAJ_pradhan_mantri_gram_sadak_yojana: "Pradhan Mantri Gram Sadak Yojana"
 RAJ_pradhan_mantri_gram_sadak_yojana_desc: "Pradhan Mantri Gram Sadak Yojana - это общенациональный план Индии по обеспечению хорошего всепогодного дорожного сообщения в деревнях, не имеющих связи."
 RAJ_article_three_seventy: "Статья 370"
 RAJ_article_three_seventy_desc: "Статья 370 Конституции Индии предоставила особый статус Джамму и Кашмиру - региону, расположенному в северной части Индийского субконтинента и являющемуся частью более крупного региона Кашмир, который с 1947 года является предметом спора между Индией, Пакистаном и Китаем."
 RAJ_sarva_shisha_abhiyan: "Sarva Shiksha Abhiyan"
 RAJ_sarva_shisha_abhiyan_desc: "Sarva Shiksha Abhiyan, или SSA, - государственная программа Индии, направленная на обеспечение всеобщего начального образования в установленные сроки. Согласно 86-й поправке к Конституции Индии, бесплатное и обязательное образование для детей в возрасте от 6 до 14 лет является одним из основных прав."
 RAJ_foreign_education_partner_ship: "Иностранное образовательное партнерство"
 RAJ_foreign_education_partner_ship_desc: "Нашим студентам нужна возможность получить зарубежное образование, чтобы стать ещё умнее."
 indian_event.13.t: "Операция Вест-Энд"
 indian_event.13.d: "Tehelka, возглавляемая её основателем Таруном Теджпалом, провела операцию с использованием скрытых камер и журналистов под прикрытием, выдававших себя за торговцев оружием. Операция была направлена, прежде всего, на борьбу с коррупцией в оборонной промышленности и касалась высокопоставленных чиновников и политиков, которые якобы участвовали в незаконных сделках с оружием и получали взятки. В течение нескольких месяцев журналисты Tehelka под прикрытием записывали разговоры с различными чиновниками, включая бюрократов, военных и политиков. Они зафиксировали видеозаписи, на которых видно, как эти люди берут взятки и обсуждают незаконную деятельность, связанную с оборонными закупками. Особое внимание в ходе операции было уделено коррупции при закупках оборонного оборудования, такого как оружие, боеприпасы и транспортные средства. Об операции стало известно после того, как Tehelka выпустила серию взрывоопасных видеороликов и опубликовала статьи с подробным описанием коррупционного скандала. Разоблачение вызвало массовый резонанс в стране, привело к возмущению общественности и требованиям принять меры в отношении тех, кто был причастен к операции. В ходе операции были пойманы несколько высокопоставленных лиц, включая политиков из различных политических партий, офицеров армии и бюрократов. В числе известных фигур - тогдашний президент партии Бхаратия Джаната Бангару Лаксман, который был запечатлен на камеру при получении взятки, а также Джая Джайтли, высокопоставленный политик из партии Самата."
 indian_event.13.a: "Уволить виновных!"
 indian_event.13.b: "Оставьте всё как есть."
 RAJ_operation_west_end: "Операция \"Вест-Энд\""
 RAJ_operation_west_end_desc: "Операция \"Вест-Энд\", также известная как \"Разоблачение Техелки\", - крупная тайная операция, проведённая индийским новостным порталом \"Техелка\" в 2001 году. В ходе операции была раскрыта коррупция в оборонном секторе Индии, что привело к общенациональному скандалу."
 indian_event.14.t: "Совместный саммит Индии и Пакистана"
 indian_event.14.d: "В саммите приняли участие тогдашний премьер-министр Индии Атал Бихари Ваджпаи и тогдашний президент Пакистана Первез Мушарраф. Основной целью саммита было развитие диалога и поиск путей мирного урегулирования конфликтов между Индией и Пакистаном, в частности, кашмирской проблемы. В ходе саммита лидеры двух стран провели обстоятельные переговоры по различным вопросам, включая кашмирский спор, терроризм и трансграничную напряженность. Переговоры проходили за закрытыми дверями, и подробности их проведения в то время не разглашались. Однако, по имеющимся сведениям, дискуссии часто носили интенсивный характер и предполагали наличие различных точек зрения по ряду ключевых вопросов."
 indian_event.14.a: "Замечательно"
 RAJ_agra_summit: "Саммит в Агре"
 RAJ_agra_summit_desc: "Агрский саммит, также известный как Агрский мирный саммит, - дипломатическая встреча на высшем уровне между лидерами Индии и Пакистана, состоявшаяся в июле 2001 года в Агре (Индия). Саммит стал важной попыткой урегулировать давние проблемы между двумя странами, включая кашмирский конфликт."
 RAJ_new_defence_council_gathering_d: "Напряжённость на кашмирской границе"
 RAJ_new_defence_council_gathering: "Заседание Совета обороны"
 RAJ_new_defence_council_gathering_desc: "Нам не нужно полагаться на добрую волю Пакистана! Пора собирать Совет обороны и ещё раз готовить план обороны и контрнаступления."
 RAJ_easing_military_standoff: "Смягчение военного противостояния"
 RAJ_easing_military_standoff_desc: "Наши отношения на границе с Пакистаном достаточно напряжённые. Возможно, стоит приложить усилия, чтобы разрядить обстановку."
 indian_event.15.t: "Ядерные испытания в Раджастхане"
 indian_event.15.d: "Испытания достигли своей главной цели - Индия получила возможность создать делящееся и термоядерное оружие с мощностью до 200 килотонн. По словам тогдашнего председателя Индийской комиссии по атомной энергии, каждый из взрывов Pokhran-II был эквивалентен нескольким испытаниям, проводившимся другими ядерными державами на протяжении десятилетий. Впоследствии Индия создала возможности компьютерного моделирования для прогнозирования мощности ядерных взрывчатых веществ, конструкции которых связаны с конструкциями взрывчатых веществ, использованных в этом испытании."
 indian_event.15.a: "Отлично"
 indian_event.16.t: "Индийский Intel"
 indian_event.16.d: "Индия предоставила нам военно-стратегическую информацию о Китае."
 indian_event.16.a: "Отлично"
 RAJ_strategic_assistance_to_us: "Стратегическая помощь США"
 RAJ_strategic_assistance_to_us_desc: "США будут нашей опорой в противостоянии с Китаем."
 RAJ_world_hindi_conference: "Всемирная конференция по хинди"
 RAJ_world_hindi_conference_desc: "Всемирная конференция по хинди - это глобальное мероприятие, в котором принимают участие учёые, лингвисты, писатели и энтузиасты языка хинди со всего мира. Конференция служит платформой для продвижения и празднования богатства и разнообразия языка хинди и его культурного наследия."
 RAJ_citizenship_india: "Совершенствование административного аппарата"
 RAJ_citizenship_india_desc: "Мы должны расширить возможности получения индийцами индийского гражданства и репатриации в Индию."
 RAJ_amoozesh_parvaresh: "Модернизированные средние школы"
 raj_middle_school_tt: "§YМы будем модернизировать средние школы Индии§!"
 RAJ_middle_school_modernization: "Модернизация средней школы"
 RAJ_middle_school_modernization_desc: "Средние школы Индии давно не модернизировались и требуют изменения подхода и методики преподавания."
 RAJ_good_governance_day: "День эффективного управления"
 RAJ_good_governance_day_desc: "Атал Бихари Ваджпаи известен своим замечательным подходом к управлению страной."
 RAJ_further_privatization: "Дальнейшая приватизация"
 RAJ_further_privatization_desc: "Изменив курс нашей экономики, мы должны продолжить путь дальнейшей приватизации экономики."
 RAJ_videsh_sanchar: "Расширение Videsh Sanchar"
 RAJ_videsh_sanchar_desc: "Вступая в XXI век, Индия должна расширять свои телекоммуникации и обеспечивать информационное покрытие всей территории страны."
 RAJ_hindu_primacy_economy: "Экономика с преобладанием индуистской этики"
 RAJ_hindu_primacy_economy_desc: "Индийская этика должна стать основой не только социальных, но и экономических отношений. Только в этом случае мы сможем обеспечить честную конкуренцию."
 RAJ_dab_on_lashkare_taiba: "Противодействие Lashkare Taiba"
 RAJ_dab_on_lashkare_taiba_desc: "Исламистские группировки давно действуют в нашей стране в подполье. Пришло время найти их и принять против них контрмеры."
 RAJ_joint_summit_with_pakistan: "Совместный саммит с Пакистаном"
 RAJ_joint_summit_with_pakistan_desc: "Чтобы успокоить обе страны, необходимо провести совместный саммит с Пакистаном. Это снизит напряжённость и позволит нам сотрудничать в будущем."
 RAJ_iri_fake_ns2: "Сильно коррумпированная военная промышленность"
 RAJ_iri_fake_ns3: "Умеренно коррумпированная военная промышленность"
 RAJ_iri_fake_ns4: "Низкокоррумпированная военная промышленность"
 RAJ_re_fake_militar2: "Умеренно дезорганизованные военные"
 RAJ_re_fake_militar3: "Низкоорганизованные военные"
 RAJ_re_fake_militar4: "Организованные военные"
 RAJ_true_tiger_economy: "Настоящая тигровая экономика"
 RAJ_true_tiger_economy_desc: "Тигровая экономика - это экономика страны, в которой происходит быстрый экономический рост, обычно сопровождающийся повышением уровня жизни."
 indian_event.17.t: "Индийская экономика"
 indian_event.17.d: "В 2000 году экономика Индии переживала период значительного роста и трансформации. Она характеризовалась постепенными мерами либерализации, начатыми в начале 1990-х годов, которые продолжали формировать экономический ландшафт. С населением более одного миллиарда человек Индия представляла собой огромный потребительский рынок и трудовой ресурс, привлекавший иностранные инвестиции. Экономика была в первую очередь ориентирована на сельское хозяйство, промышленность и услуги. Сельское хозяйство обеспечивало занятость значительной части населения, способствуя продовольственной безопасности и сельским доходам. Промышленный сектор расширялся, причем производство и текстиль играли важную роль, в то время как сектор услуг становился основным двигателем роста, особенно в области информационных технологий и аутсорсинга бизнес-процессов."
 indian_event.17.a: "Интересно"
 RAJ_natural_competitor: "Естественный конкурент"
 RAJ_natural_competitor_desc: "Индия - естественный соперник на мировом рынке. Мы должны догнать и перегнать весь мир."
 indian_event.18.t: "Индия просит инвестиций"
 indian_event.18.d: "Сегодня дипломаты [RAJ.GetNameWithFlag] обратились к нашему правительству с интересным предложением. Они хотят изучить возможности для инвестиций и развития экономики [RAJ.GetAdjective], чтобы развивать её дальше. Эта сделка сблизила бы наши две страны и в конечном счёте укрепила бы экономические связи между нами. Должны ли мы согласиться на их условия?"
 indian_event.18.a: "Конечно"
 indian_event.18.b: "Нет, извините"
 indian_event.19.t: "[FROM.GetName] Отклонено инвестиционное предложение!"
 indian_event.19.d: "[FROM.GetName] отклонил наше предложение об инвестициях. Это действительно печальный день."
 indian_event.19.a: "Ух"
 indian_event.20.t: "[FROM.GetName] Принято инвестиционное предложение!"
 indian_event.20.d: "[FROM.GetName] приняли наше предложение!"
 indian_event.20.a: "Хорошо"
 RAJ_attract_foreign_business: "Привлечение иностранного капитала"
 RAJ_attract_foreign_business_desc: "Привлечение внешнего капитала необходимо для развития нашей экономики. Пришло время направить выгодные предложения нашим различным партнерам."
 RAJ_the_new_steel_industry: "Новая сталелитейная промышленность"
 RAJ_the_new_steel_industry_desc: "Сталь является основой тяжелой промышленности. Без неё невозможно создать конкурентоспособную основу отрасли. Необходимо расширять её производство."
 RAJ_expand_the_mines: "Расширение шахт"
 RAJ_expand_the_mines_desc: "Создание промышленности обязательно требует расширения ресурсных шахт и увеличения ресурсных запасов страны."
 RAJ_subs_coal_india: "Субсидирование горнодобывающей промышленности"
 RAJ_subs_coal_india_desc: "Для того чтобы усилить развитие ресурсодобычи в нашей стране, необходимо субсидировать этот сектор экономики."
 RAJ_hindustan_zinc: "Hindustan Zinc"
 RAJ_hindustan_zinc_desc: "Hindustan Zinc Limited - индийский интегрированный производитель цинка, свинца, серебра и кадмия. Является дочерней компанией Vedanta Limited."
 RAJ_bus_nmdc: "NMDC"
 RAJ_bus_nmdc_desc: "NMDC Limited, ранее называвшаяся National Mineral Development Corporation, - индийское государственное предприятие, занимающееся разведкой железной руды, меди, фосфатов, известняка, доломита, гипса, бентонита, магнезита, алмазов, олова, вольфрама, графита, угля и др. Это крупнейший в Индии производитель и экспортер железной руды, добывающий более 35 млн. тонн железной руды на трех механизированных рудниках в штатах Чхаттисгарх и Карнатака."
 RAJ_deregul_the_econ: "Дерегулирование экономики"
 RAJ_deregul_the_econ_desc: "Дерегулирование экономики является важным аспектом создания более динамичного и быстрорастущего рынка в Индии."
 RAJ_industrial_investments: "Промышленные инвестиции"
 RAJ_industrial_investments_desc: "Помимо опоры на внешних инвесторов и различных бизнесменов, государство само должно прилагать усилия для инвестирования в промышленность страны."
 RAJ_indian_machine_tool_assoc: "Индийская ассоциация станкостроения"
 RAJ_indian_machine_tool_assoc_desc: "Индийская ассоциация производителей станков является высшим отраслевым органом станкостроительной отрасли Индии."
 ind_mach_tool_tt: "§YИндийская ассоциация станкостроения значительно улучшит состояние нашей промышленности§!"
 indian_event.21.t: "Выставка текстиля!"
 indian_event.21.d: "Выставка текстильной промышленности, прошедшая в Индии, продемонстрировала яркий и разнообразный текстильный сектор страны. На выставке был представлен широкий ассортимент продукции, включая одежду, ткани и аксессуары, что свидетельствует о мастерстве и инновациях в индийской текстильной промышленности. Среди представленных на выставке изделий выделялись индийские розовые рубашки, получившие признание в престижном конкурсе. Эти рубашки продемонстрировали уникальное сочетание традиционного мастерства и современного дизайна, сочетая в себе сложную ручную работу и высококачественные ткани. Розовые индийские рубашки покорили зрителей изысканным мастерством, вниманием к деталям и яркой цветовой палитрой. Это достижение не только прославило талант и творчество индийских мастеров текстильного производства, но и продемонстрировало глобальную привлекательность индийского текстиля. Оно еще больше укрепило репутацию Индии как ведущего направления в области текстильного производства и дизайна, подчеркнув богатое наследие страны и ее способность адаптироваться к современным модным тенденциям. Успех индийских розовых рубашек на выставке стал свидетельством процветания текстильной промышленности Индии, способствуя ее росту, международному признанию и дальнейшему вкладу в экономику и культурную самобытность страны."
 indian_event.21.a: "Отлично"
 RAJ_textile_exhibition: "Текстильная промышленность"
 RAJ_textile_exhibition_desc: "Текстильная промышленность в Индии традиционно, после сельского хозяйства, является единственной отраслью, обеспечивающей огромную занятость как квалифицированного, так и неквалифицированного труда. Текстильная промышленность продолжает оставаться второй по величине отраслью, создающей рабочие места в Индии."
 RAJ_indian_naval_industry: "Военно-морская промышленность Индии"
 RAJ_indian_naval_industry_desc: "Несмотря на хорошее торговое и морское положение, нам необходимо развивать морскую промышленность."
 RAJ_indian_mitime_research: "Индийские морские исследования"
 RAJ_indian_mitime_research_desc: "Исследования в области судостроения и морской промышленности имеют большое значение для развития нашей экономики."
 RAJ_hindalco: "HINDALCO"
 RAJ_hindalco_desc: "Hindalco Industries Limited — индийская компания по производству алюминия и меди, дочернее предприятие группы компаний Aditya Birla Group."
 RAJ_eastern_dockyards: "Восточные верфи"
 RAJ_eastern_dockyards_desc: "Одно из предложений - строительство новых верфей на Востоке и развитие морской индустрии в этом регионе."
 RAJ_western_dockyards: "Западные верфи"
 RAJ_western_dockyards_desc: "Одно из предложений - строительство новых верфей на Западе и развитие морской индустрии в этом регионе."
 RAJ_manufact_schemes: "Экономические схемы"
 RAJ_manufact_schemes_desc: "Вступая в XXI век, Индия должна создать новые модели производства и цепочки поставок, отвечающие требованиям времени."
 RAJ_diamond_ind: "Алмазная промышленность"
 RAJ_diamond_ind_desc: "Добыча алмазов и драгоценных металлов составляет значительную часть индийского экспорта. Для развития экономики необходимо разрабатывать новые месторождения."
 RAJ_expand_chromium: "Расширение хрома"
 RAJ_expand_chromium_desc: "Вновь открытые месторождения хрома привлекают отечественных и зарубежных инвесторов. Нам необходимо развивать эту тему и начинать добычу."
 RAJ_expand_khullar: "Расширение Хуллара"
 RAJ_expand_khullar_desc: "Наше правительство сочло нужным позаботиться о нашем национальном достоянии - природных ресурсах."
 RAJ_indian_car_industry: "Индийская автомобильная промышленность"
 RAJ_indian_car_industry_desc: "Чтобы стать конкурентоспособной страной на международном рынке, мы должны продолжать развивать автомобильную промышленность."
 RAJ_petrol_refiners: "Нефтеперерабатывающие заводы"
 RAJ_petrol_refiners_desc: "Нефть - это основа современной экономики и военной промышленности. Нам необходимо развивать эту отрасль."
 RAJ_unpec_growth: "Беспрецедентный рост"
 RAJ_unpec_growth_desc: "Ура, наша экономика значительно укрепилась! В связи с этим наше правительство даже организовало сегодня вечером банкет."
 RAJ_export_of_india: "Экспорт Индии"
 RAJ_export_of_india_desc: "Наша страна богата ресурсами, и хотя мы уже страдали во время колониального правления, экспортируя наши ресурсы в Великобританию и другие колониальные страны, на данный момент нам необходимо поддерживать нашу экономику дополнительными средствами от экспорта."
 RAJ_UAZ: "УАЗ"
 RAJ_russia_cars_companies: "Российские автомобильные компании"
 RAJ_russia_cars_companies_desc: "Россия — достаточно развитая страна в автомобильной промышленности. Нам следует пригласить их компании, чтобы укрепить наши позиции в этой отрасли."
 RAJ_the_bull_of_asia: "Бык Азии"
 RAJ_the_bull_of_asia_desc: "Наша страна - экономический бык Азии, который своими рогами сломает экономику Китая."
 RAJ_the_worlds_jeweller: "Мировой ювелир"
 RAJ_the_worlds_jeweller_desc: "Алмазы, сапфиры и другие материалы являются нашим национальным богатством. Мы должны использовать наше уникальное положение."
 RAJ_indian_rice_funds: "Фонды индийского риса"
 RAJ_indian_rice_funds_desc: "На этот раз Китай не будет единственной рисовой сверхдержавой."
 RAJ_indian_infrastruct: "Индийская инфраструктура"
 RAJ_indian_infrastruct_desc: "На данный момент состояние инфраструктуры в нашей стране неприемлемо. Мы должны это предотвратить, иначе шутки о плохих дорогах дойдут и до нас."
 RAJ_brazillian_industrial_partnership: "Бразильское промышленное партнерство"
 RAJ_brazillian_industrial_partnership_desc: "Бразилия обладает ценным опытом и ресурсами, которые могут помочь модернизировать и расширить наш промышленный сектор. Установив партнёрские отношения, мы сможем ускорить технологический прогресс и укрепить экономические связи между нашими странами."
 RAJ_dealing_with_eu_companies: "Работа с европейскими компаниями"
 RAJ_dealing_with_eu_companies_desc: "Европа - наш основной рынок для взаимодействия нашей экономики с европейской. Мы должны развивать эту сферу."
 RAJ_hindustan_aeronautics: "Hindustan Aeronautics"
 RAJ_hindustan_aeronautics_desc: "Небо — это третий океан, покоренный человеком. Мы должны всеми силами освоить эту отрасль, чтобы стать сильнее."
 RAJ_tatamotors: "TATA Motors"
 RAJ_tatamotors_desc: "TATA Motors — наша главная автомобильная компания. Мы должны сделать её более развитой, чем наши западные конкуренты."
 RAJ_building_industry_of_india: "Строительная индустрия Индии"
 RAJ_building_industry_of_india_desc: "Теперь Индия способна строить себя сама."
 RAJ_fight_unorganiz_work_force: "Борьба с неорганизованной рабочей силой"
 RAJ_fight_unorganiz_work_force_desc: "Безработица - наш главный враг. Теперь всё в этой стране будут работать."
 RAJ_ultra_tech_content: "Сверхтехнологичный контент"
 RAJ_ultra_tech_content_desc: "Пришло время догонять западные страны в развитии компьютерных технологий."
 RAJ_increasing_control_over_business: "Усиление контроля над бизнесом"
 RAJ_increasing_control_over_business_desc: "Предприятия нашей страны не должны оставаться в стороне. От этого может зависеть судьба нашей экономики."
 RAJ_lagilizing_the_business: "Легализация бизнеса"
 RAJ_lagilizing_the_business_desc: "Следующим этапом повышения качества нашего бизнеса является устранение возможностей для нелегальной деятельности."
 indian_event.22.t: "Дилемма дешёвой рабочей силы"
 indian_event.22.d: "Мы должны решить, как будем реформировать рынок труда в Индии. Поддерживать ли их права или оставить всё как есть?"
 indian_event.22.a: "Гарантировать их права!"
 indian_event.22.b: "Оставьте всё как есть."
 RAJ_modern_building_technology: "Современные строительные технологии"
 RAJ_modern_building_technology_desc: "Пора ещё больше приблизить то время, когда Индия станет одной из самых развитых стран мира."
 RAJ_mumbai_restoration: "Акцент на Мумбаи"
 RAJ_mumbai_restoration_desc: "Пришло время восстанавливать старый Мумбаи."
 RAJ_delhi_urbanization_plan: "План урбанизации Дели"
 RAJ_delhi_urbanization_plan_desc: "Нам необходимо урбанизировать нашу столицу - Дели. Это улучшит состояние нашей страны."
 RAJ_unslumization_of_cities: "Раскулачивание городов"
 RAJ_unslumization_of_cities_desc: "Ещё один проект, который должен улучшить жизнь в нашей стране."
 RAJ_mahindra: "Mahindra"
 RAJ_mahindra_desc: "Mahindra & Mahindra - индийский автомобильный производитель внедорожников, грузовиков и тягачей."
 RAJ_force_motors: "Force Motors"
 RAJ_force_motors_desc: "В зависимости от модификации, городские или междугородние автобусы малого класса, длиной 6,7 м, вместимостью от 18 до 32 мест. Двигатель - турбодизельный 4-цилиндровый мощностью 76 л.с."
 RAJ_uranium_corp_of_india: "Урановая корпорация Индии"
 RAJ_uranium_corp_of_india_desc: "Государственное предприятие под Министерством атомной энергетики для добычи и переработки урана. Корпорация была основана в 1967 году и отвечает за добычу и переработку урановой руды в Индии. Компания управляет шахтами в Джадугоре, Бхатине, Нарвапахаре, Турамди и Бандухуранге."
 RAJ_inviting_iaea: "Приглашение в МАГАТЭ"
 RAJ_inviting_iaea_desc: "Международное агентство по атомной энергии (МАГАТЭ) — международная организация, основанная в соответствии с решением ООН от 4 декабря 1954 года. Оно является частью системы ООН и имеет полномочия для развития сотрудничества в области мирного использования атомной энергии."
 RAJ_bus_agreement_with_us: "Соглашения с США"
 RAJ_bus_agreement_with_us_desc: "США стали нашим главным торговым партнером в области атомной энергетики. Пришло время подписать больше соглашений."
 RAJ_bus_agreement_with_rus: "Сделки с Россией"
 RAJ_bus_agreement_with_rus_desc: "Российская атомная энергетика также является одной из ведущих в мире. Нам необходимо активнее сотрудничать с Россией."
 RAJ_finalize_kaiga: "Доработка Кайги"
 RAJ_finalize_kaiga_desc: "Генерирующая станция Кайга - атомная электростанция, расположенная в Кайге, у реки Кали, в округе Уттара Каннада штата Карнатака, Индия. Станция эксплуатируется с марта 2000 года и находится в ведении индийской корпорации Ядерная энергетическая корпорация Индии."
 RAJ_tarapur4: "Тарапур-4"
 RAJ_tarapur4_desc: "Четвёртый ядерный блок индийской АЭС \"Тарапур-4\". Это самый крупный ядерный реактор в Индии мощностью 540 МВт. Он сооружается компанией Nuclear Power Corp. of India Ltd. (NPCIL). (NPCIL)"
 RAJ_expanding_nmdc: "Расширение NMDC"
 RAJ_expanding_nmdc_desc: "Расширение NMDC увеличивает горнодобывающие мощности штата и экспортную выручку от железной руды и редких минералов."
 RAJ_invite_foreign_powers: "Привлечение иностранных инвесторов"
 RAJ_invite_foreign_powers_desc: "Мы должны сделать эту отрасль более привлекательной для иностранных инвесторов, чтобы прогресс шел быстрее."
 RAJ_bringing_back_the_plan: "Возвращение плана"
 RAJ_bringing_back_the_plan_desc: "Централизованное планирование меняет нашу экономическую стратегию. Промышленный рост ускоряется, хотя идеологические сдвиги вызывают политическое сопротивление."
 RAJ_expansive_subsidies: "Широкое субсидирование"
 RAJ_expansive_subsidies_desc: "Субсидии поддерживают сельскохозяйственную основу Индии, укрепляя сельские общины и повышая производительность фермерских хозяйств."
 RAJ_indian_ricebelt: "Индийский рисовый пояс"
 RAJ_indian_ricebelt_desc: "Инвестиции в рисоводство укрепляют нашу аграрную экономику и стабильность в сельских районах."
 RAJ_leaving_as_it_is: "Уход как он есть"
 RAJ_leaving_as_it_is_desc: "Возобновляемые источники энергии (ветровая и солнечная) становятся центральным элементом нашей долгосрочной энергетической стратегии и стремления к самообеспечению."
 RAJ_teacoffedance: "Чай, кофе, давайте потанцуем."
 RAJ_teacoffedance_desc: "Расширение экспорта чая и кофе способствует экономическому росту и национальной автономии."
 RAJ_exportsubsidies: "Регулирование экспорта"
 RAJ_exportsubsidies_desc: "Экспортный контроль защищает наши ресурсы и способствует независимости отечественного производства."
 RAJ_high_import_tariffs: "Высокие импортные тарифы"
 RAJ_high_import_tariffs_desc: "Высокие тарифы защищают индийскую промышленность от иностранной конкуренции и укрепляют экономический суверенитет."
 RAJ_tea_production: "Производство чая"
 RAJ_tea_production_desc: "Расширение производства чая способствует увеличению занятости в сельской местности и экспортных доходов."
 RAJ_coffee_production: "Производство кофе"
 RAJ_coffee_production_desc: "Выращивание кофе укрепляет аграрные связи и формирует ориентированную на экспорт сельскохозяйственную базу."
 RAJ_coffee_tata_tea: "Расширить экспорт чая и кофе."
 RAJ_coffee_tata_tea_desc: "Партнерство частного сектора с компанией TATA и другими фирмами способствует расширению экспорта чая и кофе, а также наращиванию промышленного потенциала."
 RAJ_supporting_local_producers: "Поддержка местных производителей"
 RAJ_supporting_local_producers_desc: "Государственная поддержка малого бизнеса способствует развитию местного производства и ремесленного мастерства."
 RAJ_indian_rice_bowl: "Индийская рисовая чаша"
 RAJ_indian_rice_bowl_desc: "Целенаправленное наращивание производства риса укрепляет нашу продовольственную безопасность и сельскую экономику, хотя и ценой политических издержек."
 RAJ_incr_regional_control: "Усиление регионального контроля"
 RAJ_incr_regional_control_desc: "Централизация регионального управления укрепляет государственный потенциал и политический контроль над местными делами."
 RAJ_local_prod_gov_prod: "Местные производители? Государственные производители!"
 RAJ_local_prod_gov_prod_desc: "Государственное производство вытесняет частное предпринимательство, способствуя наращиванию государственного производственного потенциала и независимости."
 RAJ_new_prospects_for_socialism: "Новые перспективы социализма"
 RAJ_new_prospects_for_socialism_desc: "Приверженность социалистическим идеалам ускоряет государственный контроль над промышленностью и перераспределительной политикой."
 RAJ_state_run_capitalism: "Капитализм с государственным управлением"
 RAJ_state_run_capitalism_desc: "Государственные корпорации вытесняют частные монополии, уравновешивая рыночные силы с государственным контролем."
 RAJ_further_expansion_into_market: "Экономический комитет"
 RAJ_further_expansion_into_market_desc: "Экономический комитет координирует государственные инвестиции и промышленный рост."
 RAJ_secured_food_source: "Обеспеченный источник питания"
 RAJ_secured_food_source_desc: "Обеспечение продовольственной самодостаточности за счет инвестиций в сельское хозяйство завоевывает поддержку фермеров и укрепляет экономическую устойчивость."
 RAJ_unite_the_farms: "Объединение фермерских хозяйств"
 RAJ_unite_the_farms_desc: "Инициативы по развитию коллективного земледелия укрепляют сотрудничество в сельской местности и внутреннюю продовольственную независимость, хотя некоторые частные заинтересованные стороны возражают против этого."
 RAJ_our_next_logical_step: "Работа с местными управляющими"
 RAJ_our_next_logical_step_desc: "Переговоры с местными губернаторами укрепляют центральную власть и способствуют развитию региональной инфраструктуры."
 RAJ_full_socialism_control: "Полная конверсия в социализм"
 RAJ_full_socialism_control_desc: "Происходят глубокие перемены в политическом ландшафте, а шепот социализма становится все громче. По мере того как затихают отголоски старой олигархии, Всеиндийский конгресс профсоюзов обретает свой голос, открывая новую главу в идеологическом пути Индии."
 RAJ_pressure_big_business: "Давление на крупный бизнес"
 RAJ_pressure_big_business_desc: "Мягкая борьба между политикой и коммерцией усиливается, прокладывая путь к самоопределению экономики. На фоне этих перемен сущность внутренней автономии обретает более прочную опору."
 RAJ_looming_water1: "Сокращение дефицита воды"
 RAJ_looming_water2: "Частичный дефицит воды"
 RAJ_stabiliz_supply_water: "Стабилизация водоснабжения"
 RAJ_stabiliz_supply_water_desc: "Проблема нехватки воды стоит на повестке дня в Индии. Мы должны приложить все усилия для решения этой проблемы."
 RAJ_israeli_water_spec: "Израильские специалисты по водоснабжению"
 RAJ_israeli_water_spec_desc: "Израильские специалисты уже предложили свою помощь в вопросе фильтрации и обеспечения населения водой."
 RAJ_spanish_water_spec: "Испанские специалисты по водоснабжению"
 RAJ_spanish_water_spec_desc: "Испанские специалисты уже предложили свою помощь в вопросе фильтрации и обеспечения населения водой."
 RAJ_minjur_water_plant: "Минжурский водопроводный завод"
 RAJ_minjur_water_plant_desc: "Минжурский водопроводный завод - это завод по опреснению воды методом обратного осмоса в деревне Каттупалли, северном пригороде Ченнаи, Индия, на побережье Бенгальского залива, который снабжает водой город Ченнаи. Построенная на территории площадью 60 акров, она является крупнейшей опреснительной установкой в Индии."
 RAJ_nemmeli_water_plant: "Неммельский водопроводный завод"
 RAJ_nemmeli_water_plant_desc: "Неммельский водопроводный завод - это завод по опреснению воды в Неммели, Ченнаи, на побережье Бенгальского залива, который снабжает водой город Ченнаи."
 water_ind_tt: "§GМы будем постепенно решать проблему нехватки воды§!"
 RAJ_invest_in_bollywood: "Инвестиции в Болливуд"
 RAJ_invest_in_bollywood_desc: "Государственные инвестиции в Болливуд расширят индийскую киноиндустрию, увеличат экспорт культурных товаров и укрепят «мягкую силу» на мировой арене."
 indian_event.23.t: "Индийская киноиндустрия потрясла мир!"
 indian_event.23.d: "Индийский кинематограф в очередной раз доказал свое мастерство на мировой арене - новейший индийский фильм \"Мистические сны\" покорил весь мир. Фильм, снятый известным индийским режиссером Рохитом Вермой, побил рекорды кассовых сборов и покорил сердца зрителей по всему миру, ознаменовав собой новую веху для индийского кино на мировой арене. Фильм \"Мистические сны\" рассказывает захватывающую историю любви, самопознания и силы человеческой связи. В фильме, снятом на фоне величественных Гималаев, прекрасно сочетаются потрясающие визуальные эффекты, захватывающий сюжет и великолепная игра талантливого актерского ансамбля. Успех фильма объясняется его способностью находить отклик у зрителей разных культур. Универсальные темы любви, надежды и духовности нашли отклик у зрителей всего мира, преодолевая языковые и культурные барьеры. Захватывающая кинематография и тщательно продуманное повествование вызвали одобрение как критиков, так и зрителей."
 indian_event.23.a: "Индия действительно лучшая! Те, кто в этом сомневается, ошибаются!"
 RAJ_bolywood_idea: "Bollywood"
 RAJ_tata_consult: "TATA Consult"
 RAJ_tata_consult_desc: "Tata Consultancy Services (TCS) — индийская многонациональная компания, предоставляющая ИТ-услуги и консалтинг, входящая в состав Tata Group. Штаб-квартира компании находится в Мумбаи, и она является одним из крупнейших работодателей в сфере ИТ в мире."
 RAJ_software_tech_park: "Технопарк программного обеспечения"
 RAJ_software_tech_park_desc: "Научно-техническая организация при Министерстве электроники и информационных технологий (MeitY), занимающаяся продвижением ИТ-индустрии и индустрии ИТ-услуг, инновациями, исследованиями, стартапами и интеллектуальной собственностью в развивающихся технологических секторах."
 RAJ_hcl_tech_lim: "HCL Tech Limited"
 RAJ_hcl_tech_lim_desc: "HCL Technologies Limited, d/b/a HCLTech (formerly Hindustan Computers Pvt. Limited), индийская транснациональная компания, предоставляющая услуги в области информационных технологий (ИТ) и консалтинга со штаб-квартирой в Нойде."
 RAJ_tech_mahindra: "Mahindra Tech"
 RAJ_tech_mahindra_desc: "Индийская многонациональная компания, предоставляющая услуги в сфере информационных технологий и консалтинга. Mahindra Group со штаб-квартирой в Пуне и зарегистрированным офисом в Мумбаи. Tech Mahindra - компания с оборотом $6,0 млрд и более 148 000 сотрудников в 90 странах."
 RAJ_infosys_limited: "Infosys Limited"
 RAJ_infosys_limited_desc: "Индийская компания, занимающаяся разработкой заказного программного обеспечения для предприятий электронной коммерции и телекоммуникаций. Также предоставляет услуги консалтинга в области информационных технологий и программного обеспечения."
 RAJ_wipro: "WIPRO"
 RAJ_wipro_desc: "WIPRO - индийская транснациональная корпорация, предоставляющая услуги в области информационных технологий, консалтинга и бизнес-процессов. Является одной из ведущих компаний \"большого технологического сектора\"."
 RAJ_forces_of_india: "Вооружённые силы Индии"
 RAJ_forces_of_india_desc: "Военная организация Индии, предназначенная для обороны республики и защиты свободы и независимости государства, один из важнейших инструментов политической власти."
 RAJ_indian_militias: "Индийские ополчения"
 RAJ_indian_militias_desc: "Милиция является неотъемлемой частью нашей армии. Для успешного проведения военных операций нам также необходимо развивать нашу милицию."
 RAJ_assam_rifles: "Стрелковые войска Ассама"
 RAJ_assam_rifles_desc: "Центральное военизированное формирование, отвечающее за охрану границ, борьбу с повстанцами и поддержание правопорядка на северо-востоке Индии. Основная задача - охрана индо-мьянманской границы. АР входит в состав центральных вооруженных полицейских сил, подчиненных Министерству внутренних дел. Индийская армия осуществляет оперативный контроль над АР. Как полицейские силы, ее набор, льготы, продвижение по службе и пенсионная политика регулируются правилами CAPF. Около 80% офицеров назначаются из армии, а остальной персонал набирается из кадрового состава АР. Командование АР осуществляет генеральный директор Assam Rifles, назначаемый Министерством внутренних дел."
 RAJ_special_frontier_force: "Специальные пограничные войска"
 RAJ_special_frontier_force_desc: "Индийское подразделение специального назначения, созданное 14 ноября 1962 года. В основном состояло из тибетских беженцев, проживающих в Индии. В настоящее время его численность и масштабы операций возросли. Первоначально его основной задачей было проведение тайных операций за китайской линией в случае новой китайско-индийской войны."
 RAJ_indian_special_forces: "Индийский спецназ"
 RAJ_indian_special_forces_desc: "Для проведения специальных операций в тылу врага или внутри страны необходимо иметь подготовленные спецподразделения"
 RAJ_NAJA_idea_1: "Милитаризованная полиция"
 RAJ_riot_police_idea: "Полиция по борьбе с беспорядками"
 RAJ_riot_police_idea_desc: "Для подавления гражданских беспорядков и межобщинного насилия развертываются специальные подразделения по борьбе с массовыми беспорядками. Их присутствие предотвращает массовые волнения, но ограничивает гражданские свободы и может разжечь общественное недовольство правительством."
 RAJ_outer_doctrine_idea: "Доктрина войны с соседями"
 RAJ_outer_doctrine_idea_desc: "Индия разработала формализованную стратегическую доктрину, ориентированную на потенциальные конфликты с Пакистаном и Китаем. Военное планирование, расстановка сил и закупки вооружений выверены с учетом этих двух основных угроз."
 RAJ_national_security_guard: "Национальная гвардия безопасности"
 RAJ_national_security_guard_desc: "Известная под названием \"Чёрные кошки\" - контртеррористическое подразделение Индии при Министерстве внутренних дел. Оно было создано 16 октября 1984 года после операции \"Голубая звезда\" для борьбы с террористической деятельностью и защиты штатов от внутренних беспорядков. Официально утверждено парламентом Индии в соответствии с Законом о национальной гвардии безопасности от 1986 года. Является одним из семи центральных вооруженных формирований полиции Индии."
 RAJ_special_protection_group: "Специальная группа защиты"
 RAJ_special_protection_group_desc: "Агентство правительства Индии, единственной обязанностью которого является защита премьер-министра Индии и, в некоторых случаях, его или ее семьи. Оно было создано в 1988 году Актом парламента Индии. SPG постоянно защищает премьер-министра как в Индии, так и за рубежом, а также ближайших членов семьи премьер-министра, проживающих с ними в их официальной резиденции. Однако члены семьи могут отказаться от защиты."
 RAJ_railway_protection_group: "Железнодорожная группа специальной защиты"
 RAJ_railway_protection_group_desc: "Железнодорожная группа специальной защиты это часть новой военной полиции, специально созданная для охраны материально-технических средств, необходимых правительству, и борьбы с вооруженными беспорядками."
 RAJ_border_security_force: "Пограничные силы"
 RAJ_border_security_force_desc: "Индийская организация по охране границ с Пакистаном и Бангладеш. Это одно из семи центральных подразделений вооруженной полиции Индии, созданное после индо-пакистанской войны 1965 года \"для обеспечения безопасности границ Индии и решения связанных с этим вопросов\"."
 RAJ_saastra_seema_bal: "Saastra Seema Bal"
 RAJ_saastra_seema_bal_desc: "Пограничные войска Индии развернуты вдоль границ с Непалом и Бутаном. Это одно из семи формирований Центральной вооруженной полиции, находящееся под административным контролем Министерства внутренних дел."
 RAJ_central_armed_police: "Центральная вооружённая полиция"
 RAJ_central_armed_police_desc: "Собирательное название центральных полицейских организаций Индии, подчиняющихся Министерству внутренних дел. Формально это военизированные формирования, ранее известные как Центральные военизированные формирования."
 RAJ_indotibet_border_police: "Индо-Тибетские полицейские силы"
 RAJ_indotibet_border_police_desc: "Индо-тибетская пограничная полиция (ИТПП) - пограничный отряд Индии, развернутый вдоль границы с Тибетским автономным районом. Это одна из семи центральных вооруженных полицейских сил, созданная в 1962 году после китайско-индийской войны 1962 года."
 RAJ_expanding_cprf: "Расширение CRPF"
 RAJ_expanding_cprf_desc: "Воинские формирования, подчиненные Министерству внутренних дел Индии, выполняющие функции вооруженного полицейского резерва по обеспечению общественного порядка, внутренней безопасности и целостности государства, борьбе с терроризмом, обеспечению безопасности во время выборов, оказанию помощи гражданским властям, преодолению последствий стихийных бедствий."
 RAJ_reformation_of_dislocation: "Реформирование смещения"
 RAJ_reformation_of_dislocation_desc: "Нашим ВВС необходимо изменить тактику развертывания, чтобы предотвратить множество инцидентов во время войны."
 RAJ_mirage2000: "Покупая Mirage 2000"
 RAJ_mirage2000_desc: "Dassault Mirage 2000 — французский многоцелевой истребитель четвёртого поколения, разработанный компанией Dassault в 1970-х годах. Находящийся на вооружении с 1984 года, он был основным боевым самолётом ВВС Франции в конце XX и начале XXI веков. Он состоит на вооружении ряда стран Азии, Европы и Латинской Америки."
 RAJ_rafale: "Rafale Заводы"
 RAJ_rafale_desc: "Dassault Rafale — французский многоцелевой истребитель четвёртого поколения, разработанный компанией Dassault Aviation. Первый полёт он совершил в июле 1986 года, а в 2004 году был принят на вооружение ВМС Франции, а в 2006 году — ВВС Франции."
 RAJ_su30: "Покупка СУ-30"
 RAJ_su30_desc: "Советский/российский двухместный многоцелевой истребитель завоевания господства в воздухе поколения 4+. Предназначен для поражения воздушных целей днем ​​и ночью, в простых и сложных метеорологических условиях, а также на фоне земли при применении активных и пассивных помех, контроля воздушного пространства, блокирования аэродромов противника на большой глубине и действий по наземным и морским объектам. Может также использоваться для управления боевыми действиями групп при завоевании господства в воздухе, уничтожения десантов противника в воздухе, ведения воздушной разведки и поражения наземных целей в простых и сложных метеорологических условиях."
 RAJ_haltejas: "Разработка Haltejas"
 RAJ_haltejas_desc: "Индийский легкий многоцелевой истребитель четвертого поколения. Одномоторный самолет выполнен по схеме \"бесхвостка\" с треугольным крылом. Прототип самолета совершил первый полет в 2001 году; он разрабатывался в рамках программы LCA."
 RAJ_haljaguar: "Развитие Хальягуара"
 RAJ_haljaguar_desc: "Истребитель-бомбардировщик — это совместная разработка Великобритании (British Aircraft Corporation) и Франции (Breguet). Он находился на вооружении ВВС этих стран в течение трех десятилетий, а также экспортировался. Создание SEPECAT Jaguar стало одной из первых совместных программ европейских авиастроительных компаний. Производство осуществлялось консорциумом SEPECAT (SEPECAT, от фр. Société Européenne de Production de l'avion École de Combat et d'appui Tactique — Европейская ассоциация авиационного производства боевых и тактических самолетов поддержки)."
 RAJ_embnetra: "EMB-145I Netra"
 RAJ_embnetra_desc: "Embraer ERJ-145 - основная модель семейства региональных реактивных самолетов ERJ (Embraer Regional Jet), разработанного бразильской авиастроительной компанией Embraer в начале 1990-х годов. Помимо базовой модели, существует несколько модификаций с увеличенной дальностью полета - ERJ-145ER (Extended Range), ERJ-145LR (Long Range), ERJ-145XR (Extra-long Range). Самолет эксплуатируется авиакомпаниями с 1996 года. В ходе серийного производства было выпущено более 700 ERJ-145. Производство самолета продолжается в Бразилии, а с 2004 года и в Китае."
 RAJ_contracts_with_us_air: "Контракты с ВВС США"
 RAJ_contracts_with_us_air_desc: "ВВС США - это самые передовые и сильные авиационные подразделения. Нам необходимо подписать с ними соглашения о совместной разработке самолетов."
 RAJ_gulfstr4: "GulfStream 4"
 RAJ_gulfstr4_desc: "Gulfstream IV (Gulfstream 4) - семейство самолетов деловой авиации, разработанное корпорацией Gulfstream Aerospace в 1980-х годах. Оно представлено как базовыми моделями Gulfstream IV, так и их последующими поколениями Gulfstream IV SP, G300 и G400, а также G350 и G450. За период с 1985 по 2018 год было выпущено более 900 самолетов этого семейства, большинство из которых продолжают летать."
 RAJ_indian_navy_ind: "ВМС Индии"
 RAJ_indian_navy_ind_desc: "Сейчас наш флот не может похвастаться какими-либо отличительными качествами по сравнению с западными и восточными конкурентами. Но если мы хотим занять свое место под солнцем, нам придется позаботиться о своем флоте"
 RAJ_lessons_from_cactus: "Уроки операции \"Кактус"
 RAJ_lessons_from_cactus_desc: "Операция \"Кактус\" была достаточно успешной как для нашей армии, так и для нашего флота. Мы учли многие нюансы, возникшие в ходе операции, и используем их для повышения качества нашего флота"
 indian_event.24.t: "Наследие операции \"Кактус"
 indian_event.24.d: "Операция «Кактус» была военной операцией, проведенной индийскими вооруженными силами в 1988 году. Операция была предпринята для нейтрализации попытки государственного переворота на островном государстве Мальдивы. 3 ноября 1988 года группа мальдивских боевиков при поддержке наемников из Шри-Ланки совершила переворот против тогдашнего президента Мальдив Момуна Абдула Гаюма. Целью переворота было свержение правительства и установление проповстанческого режима. В ответ на эту серьезную угрозу Индия быстро развернула свои силы для оказания помощи мальдивскому правительству. 4 ноября транспортные самолеты индийских ВВС в сопровождении военных кораблей индийского флота перевезли контингент индийских войск в Мале, столицу Мальдив."
 indian_event.24.a: "Интересно"
 RAJ_domestic_ship_prod: "Производство отечественных судов"
 RAJ_domestic_ship_prod_desc: "Нам необходимо развивать собственный отечественный потенциал в области судостроения."
 RAJ_navy_aviation: "Авиация ВМФ"
 RAJ_navy_aviation_desc: "Для эффективной защиты флота нам необходима морская авиация."
 RAJ_goa_dock_exp: "Расширение верфей"
 RAJ_goa_dock_exp_desc: "По мере роста нашего военно-морского производства нам необходимо расширять мощности наших верфей, чтобы поддерживать его на должном уровне."
 RAJ_revit_soviet_ships: "Активизация старых возможностей"
 RAJ_revit_soviet_ships_desc: "Советский подход к судостроению был достаточно эффективен, чтобы мы могли интегрировать его для себя."
 RAJ_scquir_submarines: "Индийские подводные лодки"
 RAJ_scquir_submarines_desc: "Чтобы успешно топить чужие корабли, нужны свои подводные лодки."
 RAJ_agree_brit_onnavy: "Согласие с Великобританией"
 RAJ_agree_brit_onnavy_desc: "Будучи ранее ведущей морской державой, мы вынуждены подписать соглашение о сотрудничестве с Великобританией."
 RAJ_naval_trainings: "Военно-морская подготовка"
 RAJ_naval_trainings_desc: "Хорошая подготовка нашего флота обеспечит нам господство на море."
 RAJ_russia_navy_agree: "Специалисты ВМФ России"
 RAJ_russia_navy_agree_desc: "Сотрудничество с Россией позволит нам укрепить свои позиции на море."
 RAJ_anew_indian_army: "Новая индийская армия"
 RAJ_anew_indian_army_desc: "Мы должны создать новую концепцию индийской армии, чтобы адаптироваться к современным реалиям."
 RAJ_towards_new_mil_doct: "На пути к новой военной доктрине"
 RAJ_towards_new_mil_doct_desc: "Пришло время признать, что наша военная доктрина давно устарела. Если мы хотим быть непобедимыми в новом тысячелетии, нам необходимо создать новую военную доктрину."
 RAJ_threat_of_the_dragon: "Угроза дракона"
 RAJ_threat_of_the_dragon_desc: "Угроза номер два - Китай, наш давний соперник в регионе. Нам необходимо проанализировать их военную доктрину и подготовиться к их нападению."
 RAJ_threat_of_the_crescent: "Угроза полумесяца"
 RAJ_threat_of_the_crescent_desc: "Пакистан — наш главный враг на геополитической арене. Их армия довольно разрознена, и мы можем попытаться сформировать эффективную оборону против Пакистана."
 RAJ_threat_of_terror_mil: "Угроза терроризма"
 RAJ_threat_of_terror_mil_desc: "Наш новый враг, появившийся в XXI веке, - терроризм. Этот враг - внутренний, и нам необходимо подготовить наш оборонный комплекс к борьбе с факторами, действующими изнутри."
 RAJ_strategic_initiative: "Стратегическая инициатива"
 RAJ_strategic_initiative_desc: "Мы должны взять на себя максимальную стратегическую инициативу в регионе и быть готовыми нанести упреждающий удар по противнику. Подготовка к такому сценарию крайне важна."
 RAJ_military_infrastructure: "Военная инфраструктура"
 RAJ_military_infrastructure_desc: "Для того чтобы быть готовыми к длительной войне, нам необходимо подготовить логистические линии снабжения и построить федеральные дороги."
 RAJ_new_military_methodology: "Новая военная методология"
 RAJ_new_military_methodology_desc: "Необходимо отказаться от старой методологии войны и осмыслить новую войну нашего времени со всей ее спецификой."
 RAJ_preparations_in_kashmir: "Подготовка в Кашмире"
 RAJ_preparations_in_kashmir_desc: "Бои и столкновения в Кашмире происходят уже давно. Рано или поздно эта пороховая бочка взорвется. Мы должны быть к этому готовы."
 RAJ_behead_northwest_separat: "Обезглавить северо-западный сепаратизм"
 RAJ_behead_northwest_separat_desc: "Сепаратисты давно стремятся разрушить нашу государственную структуру. Мы должны обезглавить эту змею, таящуюся в нашем саду!"
 RAJ_antiterror_raids: "Антитеррористические рейды"
 RAJ_antiterror_raids_desc: "Рейды против террористов должны стать обычным делом для внутренних войск. Исламисты дестабилизируют нашу ситуацию, мы должны вытеснить их с нашей земли."
 RAJ_counter_terror_trainings: "Учения по борьбе с терроризмом"
 RAJ_counter_terror_trainings_desc: "Мы должны подготовить население, МЧС и милицию к антитеррористическим мерам, которые будут применяться в случае угрозы. Это важный аспект обеспечения общественной безопасности."
 RAJ_bangladesh_line: "Линия Бангладеш"
 RAJ_bangladesh_line_desc: "Несмотря на наши хорошие отношения с Бангладеш, нелегальные мигранты и террористы разных мастей периодически пытаются пересечь нашу границу. Мы должны принимать контрмеры против этого."
 RAJ_southeatern_protection: "Юго-восточная защита"
 RAJ_southeatern_protection_desc: "Граница с Мьянмой очень нестабильна. Вооруженные боевики не должны пересекать нашу границу"
 RAJ_smallwar_prep: "Малая подготовка к войне"
 RAJ_smallwar_prep_desc: "Мы должны быть готовы к локальным войнам и миротворческим операциям. Это небольшие войны, к которым мы, тем не менее, должны быть готовы."
 RAJ_preparing_our_reserve: "Готовим наш резерв"
 RAJ_preparing_our_reserve_desc: "Мы должны быть готовы к длительным боевым действиям. Исходя из этого, необходимо пополнять и обновлять наши военные резервы."
 RAJ_bigwar_prep: "Подготовка к большой войне"
 RAJ_bigwar_prep_desc: "Любая потенциальная война с Пакистаном и Китаем - это большая война, которая может привести к ядерной эскалации. Мы должны быть готовы даже к такому сценарию."
 RAJ_concept_coldstart: "Концепция холодного пуска"
 RAJ_concept_coldstart_desc: "Холодный старт — военная доктрина, разработанная индийскими вооруженными силами для использования в возможной войне с Пакистаном. Она предполагает проведение наступательных операций различными подразделениями индийских вооруженных сил в составе объединенных боевых групп. Доктрина призвана позволить обычным силам Индии проводить сдерживающие атаки для предотвращения ядерного возмездия со стороны Пакистана в случае конфликта."
 RAJ_concept_hotstart: "Концепция горячего старта"
 RAJ_concept_hotstart_desc: "«Горячий старт» — это военная доктрина, разработанная индийскими вооруженными силами для проведения быстрых наступательных операций против Китая. Она предполагает объединенные боевые группы из различных родов войск, осуществляющие оперативные наступательные действия, направленные на достижение решающих результатов до того, как конфликт перерастет в ядерный конфликт."
 RAJ_religious_groups: "Идентичность Индии"
 RAJ_religious_groups_desc: "Пять основных религий [RAJ.GetFlag] §HИндия§! Мнения о правительстве сильно различаются. Очевидно, что §Hиндусы§! Естественно, они будут очень высокого мнения о правительстве. Но некоторые другие, например, §HМусульмане§!не будет. Следовательно, управляя этими религиозными группами, мы можем §Hподдерживать мир и стабильность§! внутри страны. Если мы не сможем поддерживать адекватное отношение к этим религиозным группам, они могут попытаться захватить власть. §Rнезависимость§! от [RAJ.GetFlag] §HИндия§!.\n\nМнение индуистов: §Y[?RAJ_hindus_opinion]§!\nМнение сикхов: §Y[?RAJ_sikh_opinion]§!\nМнение буддиста: §Y[?RAJ_buddhist_opinion]§!\nМнение христианина: §Y[?RAJ_christians_opinion]§!\nМнение мусульманина: §Y[?RAJ_muslim_opinion]§!\n\n§HПороги§!\n§YВсе вероисповедания:§! Шкала стабильности и политической власти строится на основе среднего значения всех пяти показателей. §R-10%§! в среднем от 25 до §G+10%§! в 75 лет.\n\n§GВсе пять человек старше 74 лет:§! Гранты на религиозную гармонию §G+5%§! Стабильность, §G+5%§! Политическая власть и §G+0.10§! Ежемесячная численность населения.\n\n§RДо 35 лет:§! регионы, где исповедуется эта вера, впадают в беспорядки. Индуисты моложе 35 лет также являются причиной недовольства среди индуистов. §R-5%§! Стабильность, §R-10%§! Политическая власть, §R-3%§! Военная поддержка.\n\n§RДо 20 лет (сикхи до 15 лет):§! Начинается сепаратистский кризис. Возвысьте свою веру внутри себя. §Y180 дней§! или государство демилитаризуется, и за этим следует восстание.\n\n§RУровень алкоголя ниже 5, когда начинается восстание:§! государство отделяется.\n\n§HРешение вопроса§!\nТолько с каждой верой выше §Y80§! Может ли дерево фокуса принять §YПлюралистическая гармония§! В качестве национального религиозного закона это гораздо более прочное соглашение, чем плюрализм, навязанный сверху. С этим законом и установлением религиозной гармонии, §YУкрепить плюрализм§! Это закрепляется в конституционном порядке: бонус фиксируется на максимальном уровне, и общественное мнение больше не является причиной беспорядков, кризисов или сепаратизма.\n"
 RAJ_appease_hindus: "Успокоить индусов"
 RAJ_appease_sikhs: "Успокоить сикхов"
 RAJ_appease_buddhists: "Успокоить буддистов"
 RAJ_appease_christians: "Успокоить христиан"
 RAJ_appease_muslims: "Успокоить мусульман"
 RAJ_religion.4.t: "Вспыхнуло межобщинное насилие"
 RAJ_religion.4.d: "Несколько христианских, мусульманских и индуистских группировок начали борьбу из-за неизвестного спора в одном из наших крупных городов, и очаги насилия начинают вспыхивать по всей стране. На данный момент не имеет значения, почему они дерутся, важно то, как мы можем заставить их остановиться."
 RAJ_religion.4.a: "Вернуть христиан"
 RAJ_religion.4.b: "Поддержим индусов"
 RAJ_religion.4.c: "Поддержим мусульман"
 RAJ_themodels_ofothers: "Модели других стран"
 RAJ_themodels_ofothers_desc: "Мы должны проанализировать модели армий других стран и перенять лучшие стороны их формирований"
 RAJ_milind_of_india: "Военная промышленность Индии"
 RAJ_milind_of_india_desc: "Оборонно-промышленный комплекс Индии является стратегически важным сектором экономики страны. Индия располагает одними из крупнейших в мире вооруженных сил, численность действующего персонала которых превышает 1,44 млн. человек."
 RAJ_new_standart_for_equip: "Новые стандарты на оборудование"
 RAJ_new_standart_for_equip_desc: "Чтобы эффективно сражаться на поле боя, нам необходимо оптимизировать наше стрелковое оружие"
 RAJ_do_in_india: "Делать в Индии"
 RAJ_do_in_india_desc: "Нам нужно избавиться от старого подхода к производству оружия"
 indian_event.25.t: "Разбираемся с Випином Кханной"
 indian_event.25.d: "Чтобы закрепить свои позиции на индийском рынке, Випин Кханна, известный коррупционер в индийской военной промышленности, предложил нам сделку, от которой мы якобы не можем отказаться. Как мы это сделаем?"
 indian_event.25.a: "До свидания"
 RAJ_handl_cor_indefcor: "Разберитесь с коррупцией!"
 RAJ_handl_cor_indefcor_desc: "Коррупция в армии губительна для безопасности и обороноспособности нашей страны. Необходимо предотвратить коррупцию в нашей армии"
 RAJ_clearing_out_the_ranks: "Очистить ряды"
 RAJ_clearing_out_the_ranks_desc: "В наших рядах слишком много избыточного персонала. Для оптимизации армии нам необходимо сократить его численность."
 RAJ_deal_vipin_khanna: "Предложение Випина Кханны"
 RAJ_deal_vipin_khanna_desc: "Випин Кумар Кханна (14 декабря 1930 — 7 ноября 2019) был индийским бизнесменом и офицером армии. Кханна имел разнообразные деловые интересы. Он основал компанию Dynamic Sales Service International, занимавшуюся торговлей и маркетингом сырьевых товаров, которая впоследствии расширила свою деятельность в области инженерной поддержки, брокерских услуг на судах, товаров повседневного спроса и других отраслей."
 RAJ_refr_rech_contr: "Обновить контракты"
 RAJ_refr_rech_contr_desc: "Контрактная армия позволит нам иметь профессиональную армию. Нам нужно оптимизировать эту часть"
 RAJ_clearing_ministr: "Очистка МО"
 RAJ_clearing_ministr_desc: "Завершающим этапом реформирования вооруженных сил является усиление контроля над руководителями наших вооруженных сил"
 RAJ_DRDO: "DRDO"
 RAJ_DRDO_desc: "Организация оборонных исследований и разработок (DRDO) - индийский государственный орган, отвечающий за разработку технологий для военных целей и находящийся в ведении Министерства обороны Индии. Цель DRDO - способствовать процветанию Индии путем вывода науки и техники на мировой уровень, заложить основу для самодостаточности в критических военных технологиях и обеспечить решающее преимущество в технологическом оснащении национальных вооруженных сил."
 RAJ_drdo_idea: "DRDO"
 RAJ_munitions_india_limited: "Munitions India Limited"
 RAJ_munitions_india_limited_desc: "Индийская государственная оборонная компания со штаб-квартирой в г. Пуна (Индия), созданная в 2021 году в рамках реструктуризации и акционирования Ordnance Factory Board of Directors в семь различных предприятий государственного сектора. Ordnance India в основном производит боеприпасы, взрывчатые вещества, ракеты и бомбы для вооруженных сил Индии, иностранных вооруженных сил и внутреннего гражданского использования."
 RAJ_pinaka_launcher: "Пусковая установка Пинака"
 RAJ_pinaka_launcher_desc: "«Пинака» — это индийская всепогодная реактивная система залпового огня (РСЗО) калибра 214 мм, предназначенная для поражения легкобронированной и бронированной техники, живой силы и артиллерии противника, уничтожения узлов связи, командных пунктов и военно-промышленной инфраструктуры. Эта пусковая установка также может использоваться для дистанционной установки противопехотных и противотанковых мин. Разработка этой РСЗО началась в 1983 году, а в 1999 году она была принята на вооружение индийской армией. Сообщается, что РСЗО «Пинака» применялась в боевых действиях во время Каргильской войны, пограничного конфликта между Индией и Пакистаном, который произошел в 1999 году. Первый полк, вооруженный РСЗО «Пинака», был сформирован в 2000 году."
 RAJ_HSLDB: "HSLDB"
 RAJ_HSLDB_desc: "Индии необходимо укреплять свою ракетную промышленность, чтобы успешно защищать и осваивать космос"
 RAJ_shivalik: "Шиваликские гранаты"
 RAJ_shivalik_desc: "Граната Shivalik является отечественной гранатой для Индии. Она была разработана лабораторией Terminal Ballistic Research Laboratory, TBRL, входящей в состав Организации оборонных исследований и разработок DRDO, которая расположена у подножия гор Шивалик недалеко от Чандигарха, отсюда и происходит ее название."
 RAJ_armor_vehic_nigam: "Armour Vehicles Nigam"
 RAJ_armor_vehic_nigam_desc: "Armoured Vehicles Nigam Limited (AVANI) — индийская государственная оборонная компания со штаб-квартирой в Авади, Ченнаи, Индия, созданная в 2021 году в рамках реструктуризации и акционирования Ordnance Factory Board в семь различных государственных предприятий. AVANI в основном производит бронированные боевые машины, основные боевые танки и их двигатели для использования в Индии."
 RAJ_arjun: "Основной боевой танк ARJUN"
 RAJ_arjun_desc: "Arjun - основной боевой танк, разработанный крупнейшим индийским оборонным подрядчиком, Организацией оборонных исследований и разработок (DRDO), для индийской армии. Танк назван в честь Арджуна, одного из главных героев индийской эпической поэмы Махабхарата."
 RAJ_t90_rus: "Российский Т90"
 RAJ_t90_rus_desc: "Российский основной боевой танк Т-90 поступил на вооружение в 1992 году. В 1999 году ему было присвоено неофициальное название «Владимир»."
 RAJ_british_challenger: "Британский Challenger"
 RAJ_british_challenger_desc: "Основной боевой танк производства британской компании Vickers Defense Systems (ныне входит в состав BAE Systems). Это третий танк, носящий имя Challenger. Несмотря на то, что Challenger 2 был разработан на базе Challenger, новый танк отличается от ранней модели новым оборудованием и компонентами, лишь 5% деталей являются общими для обеих моделей. В настоящее время Challenger 2 заменил раннюю модель на вооружении британской армии."
 RAJ_bmp_sarath: "БМП Sarath"
 RAJ_bmp_sarath_desc: "БМП-2 Sarath - индийский вариант боевой машины пехоты (БМП-2), производившийся по лицензии Ordnance Factory Board в Индии. Впервые БМП-2 Sarath поступила на вооружение индийской армии в начале 1990-х годов."
 RAJ_mod_tru_stallion: "Ashok Leyland Stallion"
 RAJ_mod_tru_stallion_desc: "Серия индийских средне- и тяжеловесных внедорожных грузовиков, выпускаемых компанией Ashok Leyland с 1987 года. Грузовики спроектированы на шасси Ford Cargo. Значительная часть автомобилей производится для индийской армии."
 RAJ_adv_weapons_eqip_lim: "Передовое оружие и оборудование Индия"
 RAJ_adv_weapons_eqip_lim_desc: "Чем больше у нас экономических возможностей, тем больше мы нуждаемся в армии. Все больше отсеиваются старые заказы и появляются новые, особенно в нашей армии."
 RAJ_field_gun_fact: "Завод полевых орудий"
 RAJ_field_gun_fact_desc: "Field Gun Factory, Kanpur (FGK) - завод, расположенный в г. Канпур, Индия. Открытый в 1979 году, он является самым молодым в подразделении Weapons, Vehicles and Equipment (WV&E) индийских оружейных заводов. Фабрика может создавать различные типы полевых орудий"
 RAJ_gun_jabalpur: "Оружейный лафетный завод в Джабалпуре"
 RAJ_gun_jabalpur_desc: "Оборонный завод и населенный пункт в округе Джабалпур штата Мадхья-Прадеш, Индия. Расположенный в живописных окрестностях хребта Сатпура, этот небольшой правительственный поселок построен вокруг одноименного оборонного завода. Он находится примерно в 3 км от железнодорожной станции Джабалпур и тесно связан с городом. Он окружен другими оборонными предприятиями. На территории поселка расположены центральные школы, больницы, церкви, храмы и клубы."
 RAJ_gun_shell_factory: "Оружейно-снарядный завод Коссипор"
 RAJ_gun_shell_factory_desc: "Gun and Shell Factory, Cossipore, Calcutta, является материнским подразделением индийских оружейных заводов, входящих в состав Совета оружейных заводов (Ordnance Factory Board), метко названного четвертой рукой обороны. Завод начал свой путь с момента покупки освященной земли в Коссипоре в 1801 году, а производственная деятельность началась 18 марта 1802 года"
 RAJ_ordnance_factory_tiruchapari: "Оружейный завод Тиручираппалли"
 RAJ_ordnance_factory_tiruchapari_desc: "Завод по производству стрелкового оружия, которым управляет Advanced Weapons and Equipment India Limited, компания, базирующаяся в Тиручирапалли, Тамил Наду, которая ранее была частью Ordnance Factory Board Министерства обороны, правительства Индии. Компанию возглавляет исключительно офицер IOFS, называемый генеральным менеджером, который является главным исполнительным директором, ответственным за общее управление компанией. OFT является крупнейшей компанией по производству стрелкового оружия в Индии и имеет самый разнообразный ассортимент продукции."
 RAJ_ordnance_factory_korwa: "Ordnance Factory Project Korwa"
 RAJ_ordnance_factory_korwa_desc: "Проект Ordnance Factory Project, Korwa - это ускоренный и модернизированный проект Совета по оборонным заводам. Проект был основан в декабре 2007 г. в г. Аметхи, штат ЮП. HAL, Korwa - соседнее оборонное подразделение. Этот завод - новейшее перо в шапке организации OF, оснащенное самыми современными технологиями"
 RAJ_ordnance_kanpur: "Оружейный завод в Канпуре"
 RAJ_ordnance_kanpur_desc: "Оружейный завод Канпур - один из 41 оружейного завода под эгидой Ordnance Factory Board (OFB), Калькутта. Он был задуман в 1942 г. как проект трансплантации в связи с надвигающейся угрозой со стороны держав оси, появившихся на восточном фронте во время Второй мировой войны. Завод расположен на дороге Kalpi Road в восьми километрах от центральной железнодорожной станции Канпур"
 RAJ_small_factory_kanpur: "Расширение ОФК"
 RAJ_small_factory_kanpur_desc: "Совет оружейных заводов (OFB), в состав которого входили индийские оружейные заводы, ныне известный как Директорат оружейных заводов (координация и услуги), был организацией, входящей в состав Департамента оборонного производства (DDP) Министерства обороны (МО) правительства Индии. 41 индийский оружейный завод был преобразован в 7 оборонных предприятий государственного сектора (Defence Public Sector Undertakings, DPSUs)"
 RAJ_ordnance_factory_ishapore: "Стрелковый завод в Ишапоре"
 RAJ_ordnance_factory_ishapore_desc: "Индийская государственная компания по производству оружия, расположенная в Ичхапуре, Западная Бенгалия"
 RAJ_troop_comfrt: "Troop Comforts Limited"
 RAJ_troop_comfrt_desc: "Мы должны побороть разгильдяйство в наших вооруженных силах, чтобы повысить их качество"
 RAJ_upd_mil_unif: "Цифровой единообразный закон о пересмотре"
 RAJ_upd_mil_unif_desc: "Нашей армии нужна хорошая связь, чтобы поддерживать эффективность миссий"
 RAJ_upd_cloth: "Обновление снаряжения спецназа"
 RAJ_upd_cloth_desc: "Пришло время улучшить экипировку наших спецназовцев"
 RAJ_gliders_india_lim: "Gliders India Limited"
 RAJ_gliders_india_lim_desc: "Gliders India Limited (GIL) - индийская государственная оборонная компания со штаб-квартирой на парашютном заводе Ordnance в Канпуре"
 RAJ_miltech_innov: "Военно-технологические инновации"
 RAJ_miltech_innov_desc: "Нам необходимо усилить защиту наших военных сетей от внешних вторжений"
 RAJ_india_optel: "India Optel Limited"
 RAJ_india_optel_desc: "India Optel Limited - индийская государственная оборонная компания со штаб-квартирой в Дехрадуне"
 RAJ_electr_optic: "Расширение исследований в области ПНВ"
 RAJ_electr_optic_desc: "Предыдущая модель NVG в индийской армии устарела. Нам нужно её усовершенствовать."
 RAJ_yantra_india: "Yantra India Limited"
 RAJ_yantra_india_desc: "Yantra India Limited - индийская крупная государственная оборонная компания со штаб-квартирой в г. Нагпур, Индия"
 RAJ_mil_electr: "Военные электронные исследования"
 RAJ_mil_electr_desc: "Наши заокеанские конкуренты уже давно развили электронику. Нам необходимо их догнать"
 RAJ_command_innov: "Командирские инновации"
 RAJ_command_innov_desc: "Нам необходимо совершенствовать наши системы командной связи"
 RAJ_bharat_desc: "Государственная компания Индии, один из крупнейших поставщиков электронного оборудования для индийской армии. Компания имеет 9 заводов и несколько региональных представительств"
 RAJ_indian_radar: "Индийские радары"
 RAJ_indian_radar_desc: "Low-Range Detection Radar, также называемый Indian Doppler Radar, серия двумерных радаров была разработана компанией Electronics and Radar Development Establishment Организации оборонных исследований и разработок для армии и ВВС. Затем они производились компанией Bharat Electronics, которая обычно является производственным партнером LRDE. INDRA-I - это мобильная обзорная РЛС для обнаружения низколетящих целей, а INDRA-II предназначена для перехвата наземных управляемых целей"
 RAJ_akash_missiles: "Ракеты Akash"
 RAJ_akash_missiles_desc: "Akash - разрабатываемый в Индии зенитный ракетный комплекс малой дальности, предназначенный для обеспечения противовоздушной обороны объектов и группировок войск"
 RAJ_indian_army_air_defense_force_idea: "ПВО Индии"
 RAJ_igmdp: "IGMDP"
 RAJ_igmdp_desc: "Программа Министерства обороны Индии по исследованию и разработке ракет большой дальности. Программой руководили Организация оборонных исследований и разработок и Совет по артиллерийским заводам в партнерстве с другими политическими организациями индийского правительства. Проект начался в 1982-83 годах под руководством Абдула Калама, который курировал его завершение в 2008 году после успешной разработки этих стратегических ракет."
 RAJ_finsas: "F-INSAS"
 RAJ_finsas_desc: "Программа Индии по оснащению пехоты самым современным оборудованием F-INSAS расшифровывается как Future Infantry Soldier as System. Однако индийская армия решила отказаться от программы F-INSAS в пользу двух отдельных проектов. Новая программа будет состоять из двух компонентов. Первый - это вооружение пехотинцев будущего лучшими из имеющихся автоматов, карабинов и индивидуального снаряжения, такого как шлемы и бронежилеты. Второй компонент - системы управления полем боя"
 RAJ_trishul: "Тришул"
 RAJ_trishul_desc: "Быстродействующая ракета класса \"земля-воздух\" малой дальности, разработанная в Индии Организацией оборонных исследований и разработок в рамках Комплексной программы развития управляемых ракет. Она также может использоваться в качестве противолодочной ракеты с морского скиммера против низколетящих ракет, боевых вертолетов и самолетов"
 RAJ_3dcar: "3D-CAR"
 RAJ_3dcar_desc: "Индийская трехкоординатная РЛС, разработанная DRDO для ЗРК Akash. Способна отслеживать до 150 целей"
 RAJ_agni_tech: "Agni Tech"
 RAJ_agni_tech_desc: "Agni-III (IAST Agni, букв. \"Огонь\") - индийская баллистическая ракета средней дальности, принятая на вооружение в 2011 году в качестве преемницы Agni-II. Она имеет дальность от 3500 до 5000 км (2200-3100 миль) и может достигать целей в глубине соседних стран, включая Китай"
 RAJ_prithvi_missile: "Исследовательские ракеты Prithvi"
 RAJ_prithvi_missile_desc: "Семейство баллистических ракет класса \"поверхность-поверхность\" вооруженных сил Индии"
 RAJ_prithvi_1: "Ракетное семейство Притхви"
 RAJ_prithvi_1_desc: "Разработать полную линейку баллистических ракет малой дальности Prithvi для всех трех видов вооруженных сил. Вариант для сухопутных войск имеет дальность полета 150 км с полезной нагрузкой 1000 кг, вариант для ВВС достигает 250 км, а вариант для флота — 350 км благодаря двухступенчатой ​​твердотопливной конструкции."
 RAJ_prithvi_4: "Prithvi-IV"
 RAJ_prithvi_4_desc: "Разрабатывается передовая межконтинентальная баллистическая ракета, представляющая собой следующее поколение стратегического сдерживания Индии. Ее развертывание укрепит позиции Индии как мировой ядерной державы."
 RAJ_uniting_mil_ind_prod: "Объединение военного производства"
 RAJ_uniting_mil_ind_prod_desc: "Пришло время объединить все военные отрасли, чтобы оптимизировать наши вооруженные силы"
 RAJ_uniting_mil_ind_prod_phase: "Объединение военного производства Фаза 2"
 RAJ_uniting_mil_ind_prod_phase_desc: "Больше военной техники, больше шансов на достижение нашей цели."
 RAJ_indian_arms_exports: "Индийский экспорт вооружений"
 RAJ_indian_arms_exports_desc: "Индия является крупным производителем различных видов вооружений. Она способна занять одну из ведущих позиций в мире, продавая оружие другим странам. Это также покажет, что Индия находится на одном уровне с другими военными державами."
 RAJ_preserve_caste_system: "Сохранение кастовой системы"
 RAJ_preserve_caste_system_desc: "Кастовая система является основой индийского общества. Разрушение её - это оскорбление нашей религии и традиций!"
 RAJ_dharmic_alliance: "Дхармический альянс"
 RAJ_dharmic_alliance_desc: "Все дхармические религии происходят от одного корня. Это почва Бхарата, которая дала им всем шанс на существование. Мы должны принять её."
 RAJ_hindu_nationalism: "Индусский национализм"
 RAJ_hindu_nationalism_desc: "Хиндутва — единственный возможный образ жизни для нашего общества. Быть индийцем — это знак, которым должен гордиться каждый наш гражданин."
 RAJ_indian_traditionalism_desc: "Традиции — это важнейшая составляющая, которая скрепляет общество. Независимо от племенного происхождения, нас всех объединяют одни и те же традиции, и это нас сближает."
 RAJ_stomp_out_islam: "Растоптать ислам"
 RAJ_stomp_out_islam_desc: "Ислам уже давно является источником проблем для нашей страны. Мы будем работать над тем, чтобы свести его влияние к минимуму!"
 RAJ_international_nationalism: "Интернациональный национализм"
 RAJ_international_nationalism_desc: "В глазах Аханд Бхарат все разные народы едины. Наши общие этнические и религиозные корни - это то, на чем мы должны сосредоточиться."
 RAJ_deport_muslims: "Депортировать нелояльных мусульман"
 RAJ_deport_muslims_desc: "Многие нелояльные мусульманские проповедники продолжают радикализировать население наших провинций с мусульманским большинством. Это недопустимо и должно быть предотвращено."
 RAJ_hindu_rashatra: "Хиндутва Раштра"
 RAJ_hindu_rashatra_desc: "Милитаризм необходимо всеми силами внедрять в сознание нашего народа. Вооружённость и единство - наша сила!"
 RAJ_indias_elections: "Индийские выборы"
 RAJ_indias_elections_desc: "Индия - лучший пример демократии, где каждая партия имеет возможность стать ведущей в стране. Мы должны решить, по какому пути пойдёт наша страна, чтобы прийти к светлому - или не очень светлому - будущему."
 RAJ_manmohan_singh: "Манмохан Сингх"
 RAJ_manmohan_singh_desc: "Манмохан Сингх - назначенный премьер-министр Индии, член партии Конгресс. Сингх выдвинул свою кандидатуру на пост премьер-министра 19 мая 2004 г., когда президент А.П.Дж. Абдул Калам официально предложил ему сформировать правительство."
 RAJ_manmohan_technocracy: "Технократия Манмохана"
 RAJ_manmohan_technocracy_desc: "Технократия - это форма правления, при которой обществом управляют люди, обладающие техническими знаниями. В технократии лидеры выбираются на основе их технологических или научных знаний. Для решения социальных и политических проблем в рамках технократии применяется научный метод, а не демократическое голосование за решение или компромисс."
 RAJ_keeping_reput: "Поддержание репутации"
 RAJ_keeping_reput_desc: "Мы должны сохранить лицо перед религиозными группами, устанавливая с ними дружеские контакты, а также постепенно внедряя в общество более свободные нарративы."
 indian_event.26.t: "Бразильская декларация"
 indian_event.26.d: "Декларация из Бразилии была подписана министрами иностранных дел Индии, Бразилии и Южноафриканской Республики. Они согласились с необходимостью реформ в Организации Объединенных Наций, особенно в Совете Безопасности. Декларация выражала мнение, что Совет Безопасности ООН должен отражать текущую мировую ситуацию. Также были затронуты вопросы международного терроризма, транснациональной преступности и незаконной торговли оружием, с заявлением, что такие угрозы международному миру должны эффективно пресекаться с уважением к суверенитету государств и международному праву."
 indian_event.26.a: "Отлично"
 RAJ_ibsa_dialogue_forum: "Диалоговый форум IBSA"
 RAJ_ibsa_dialogue_forum_desc: "Диалоговый форум IBSA - международная трёхсторонняя группа по развитию международного сотрудничества между различными странами."
 RAJ_fighting_corruption: "Борьба с коррупцией"
 RAJ_fighting_corruption_desc: "Проблема коррупции разлагает нашу страну! Мы должны немедленно бороться с ней и обеспечить справедливость нашего государства."
 RAJ_isr_ind_cong_meet: "Израильско-индийская дипломатическая встреча"
 RAJ_isr_ind_cong_meet_desc: "Диалог на высоком уровне с Израилем углубляет военное и разведывательное сотрудничество."
 RAJ_national_guarantee_employment_act: "Закон о национальной гарантии занятости"
 RAJ_national_guarantee_employment_act_desc: "Mahatma Gandhi National Rural Employment Guarantee Act 2005 или MGNREGA, ранее известный как National Rural Employment Guarantee Act или NREGA, - индийская мера социального обеспечения, направленная на обеспечение права на труд."
 RAJ_delhi_beijing_speakers: "Дели-Пекинские переговоры"
 RAJ_delhi_beijing_speakers_desc: "Хотя многие могут считать наши отношения с Китаем безнадежными, мы все же должны прилагать усилия для их стабилизации."
 RAJ_isr_ind_cong_pack_inv: "Пакет израильско-индийских инвестиций"
 RAJ_isr_ind_cong_pack_inv_desc: "Взаимные инвестиции между Индией и Израилем принесут пользу обеим странам. Почему бы не начать этот проект?"
 RAJ_russia_weapon_package: "Пакет российских вооружений"
 RAJ_russia_weapon_package_desc: "Россия — наш давний партнер. Мы приобретем у них новый пакет вооружений, поскольку это значительно улучшит наши оборонительные возможности."
 RAJ_iran_india_pak_gas_pip: "Газопровод Индия-Пакистан-Иран"
 RAJ_iran_india_pak_gas_pip_desc: "Проект газопровода Иран-Пакистан-Индия был впервые инициирован Ираном в середине 1990-х годов с целью транспортировки иранского газа через территорию Пакистана в Индию. Однако сама идея была впервые предложена в конце 1950-х годов в научной статье, опубликованной Военным инженерным колледжем Пакистана. Идея была выдвинута на первый план в 1989 году, когда Пакистан столкнулся с проблемой нехватки газа. Предварительное соглашение было подписано между Тегераном и Исламабадом в 1995 году, а затем, в 1999 году, к нему присоединилась Индия."
 indian_event.27.t: "Предложение по строительству газопровода в Индии"
 indian_event.27.d: "Индия предлагает новый проект газопровода, в котором примут участие Индия, Пакистан и Иран. Стоит ли нам согласиться присоединиться?"
 indian_event.27.o1: "Конечно, это полезно!"
 indian_event.27.o2: "Отправьте этих дипломатов обратно."
 RAJ_cont_the_course: "Продолжение курса"
 RAJ_cont_the_course_desc: "Нам следует продолжать курс на демократизацию и антикоррупционные процедуры."
 RAJ_golden_quadlit: "Золотой четырехугольник"
 RAJ_golden_quadlit_desc: "Золотой четырехугольник - это национальная сеть автомагистралей, соединяющая несколько крупных промышленных, сельскохозяйственных и культурных центров Индии."
 RAJ_final_inf_prog: "Доработка инфраструктурной программы"
 RAJ_final_inf_prog_desc: "Теперь мы сможем завершить программу строительства инфраструктуры."
 RAJ_value_added_tax: "Налог на добавленную стоимость"
 RAJ_value_added_tax_desc: "Мы должны реформировать нашу налоговую систему, чтобы она была более адекватна современности."
 RAJ_national_rural_health_mis: "Национальная миссия сельского здравоохранения"
 RAJ_national_rural_health_mis_desc: "National Rural Health Mission - это государственная программа медицинского страхования, которая будет запущена для обеспечения доступного, недорогого и качественного медицинского обслуживания в сельской местности. Основное внимание в рамках этой программы уделяется малообеспеченным домохозяйствам в сельской местности."
 RAJ_27_perc_project_medic: "Проект 27 процентов"
 RAJ_27_perc_project_medic_desc: "Правительство должно реализовать предложение о резервировании 27% мест во Всеиндийском институте медицинских исследований (AIIMS), Индийских технологических институтах, Индийских институтах менеджмента и других центральных высших учебных заведениях для представителей других отсталых классов."
 RAJ_crusing_indian_antires_protests: "Подавление протестов против сохранения заповедников"
 RAJ_crusing_indian_antires_protests_desc: "В Индии прошла серия акций протеста против решения правительства Индийского Союза, возглавляемого многопартийной коалицией Объединённый прогрессивный альянс, ввести резервирование для представителей других отсталых классов в центральных и частных высших учебных заведениях."
 RAJ_rights_to_education_act: "Закон о праве на образование"
 RAJ_rights_to_education_act_desc: "Закон о праве детей на бесплатное и обязательное образование или Закон о праве на образование - это закон парламента Индии, который описывает условия обеспечения важности бесплатного и обязательного образования для детей в возрасте от 6 до 14 лет в Индии в соответствии со статьёй 21A Конституции Индии."
 RAJ_unlaw_prev_act: "Закон о предотвращении незаконной деятельности"
 RAJ_unlaw_prev_act_desc: "Unlawful Activities Prevention Act - индийский закон, направленный на предотвращение противоправных объединений в Индии. Его основной целью было предоставление полномочий для борьбы с деятельностью, направленной против целостности и суверенитета Индии."
 RAJ_national_investigation_agency: "Национальное агентство расследований"
 RAJ_national_investigation_agency_desc: "Национальное агентство расследований является специализированным правоохранительным органом по борьбе с терроризмом в Индии. Агентство уполномочено заниматься расследованием преступлений, связанных с терроризмом, на территории штатов без специального разрешения штатов на основании письменного распоряжения Министерства внутренних дел."
 RAJ_enlarge_inv_agency: "Увеличить Национальное агентство расследований"
 RAJ_enlarge_inv_agency_desc: "Национальное агентство расследований должно получить больше свободы и пространства, чтобы действовать более эффективно и быстрее добиваться результатов."
 RAJ_reconstruct_kashmir: "Реконструкция Кашмира"
 RAJ_reconstruct_kashmir_desc: "Кашмир находится, мягко говоря, не в лучшем состоянии. Мы должны восстановить его, чтобы завоевать лояльность населения и сделать его экономически стабильным."
 RAJ_aadhar_project: "Проект Aadhaar"
 RAJ_aadhar_project_desc: "Aadhaar - это 12-значный уникальный идентификационный номер, который может быть получен на добровольной основе гражданами Индии и иностранными гражданами-резидентами, прожившими более 182 дней в течение двенадцати месяцев, непосредственно предшествующих дате подачи заявления на регистрацию, на основании их биометрических и демографических данных."
 RAJ_rights_to_child_free_comp_act: "Закон о праве детей на бесплатное образование"
 RAJ_rights_to_child_free_comp_act_desc: "Раздел 3 предоставляет каждому ребёнку в возрасте от шести до четырнадцати лет право на бесплатное и обязательное образование в школе по месту жительства до завершения начального образования. Идея создания школ по месту жительства восходит к Национальной системе образования, разработанной в докладе Комиссии Котари, согласно которой школа по месту жительства должна стать общим пространством, где все дети, независимо от касты, класса и пола, учатся вместе в наилучшей инклюзивной манере."
 RAJ_rights_to_land_acquiq: "Закон RFCTLARR"
 RAJ_rights_to_land_acquiq_desc: "Закон о праве на справедливую компенсацию и прозрачность при приобретении земли, реабилитации и переселении - это закон индийского парламента, регулирующий вопросы приобретения земли и устанавливающий порядок и правила предоставления компенсации, реабилитации и переселения пострадавших лиц в Индии."
 RAJ_rights_to_info: "Закон о праве на информацию"
 RAJ_rights_to_info_desc: "Закон о праве на информацию предлагает установить практический режим права на информацию для граждан с целью обеспечения доступа к информации, находящейся под контролем государственных органов, для продвижения прозрачности и подотчетности в работе каждого государственного органа, создания Центральной информационной комиссии и информационных комиссий штатов, а также по вопросам, связанным с ними или сопутствующим им."
 RAJ_reform_constitution: "Реформирование Конституции"
 RAJ_reform_constitution_desc: "Реформа старой конституции - необходимый шаг в обновлении индийской политической системы."
 RAJ_hindutva_front: "Фронт Хиндутва"
 RAJ_hindutva_front_desc: "Движение \"Хиндутва\", основанное на идеологии индуистского национализма, стремится утвердить примат индуистской культуры и ценностей в многообразной мозаике Индии. По мере роста напряженности его призывы находят отклик в массах."
 RAJ_akhil_bharat_mahsabasa: "Акхил Бхаратия Хинду МахаСабха"
 RAJ_akhil_bharat_mahsabasa_desc: "Основанная в начале XX в. организация \"Хинду Махасабха\" ставила своей целью защиту прав индусов в условиях меняющегося субконтинента. Имея связи с вооруженными силами и стремясь к созданию индуистской раштры, или индуистской нации, они представляют себе сильную и единую Индию."
 RAJ_maharashtra_navnirman_sena: "Махараштра Навнирман Сена"
 RAJ_maharashtra_navnirman_sena_desc: "Отделившаяся от Шив Сены в XXI веке Махараштра Навнирман Сена (МНС) несёт факел гордости и самобытности маратхов. Будучи конкурирующей региональной силой, они оспаривают доминирование своей материнской организации, стремясь найти уникальный путь для отстаивания интересов Махараштры."
 RAJ_shiv_sena: "Шив Сена"
 RAJ_shiv_sena_desc: "Основанная в 1966 г. Шив Сена долгое время отстаивала права махарашцев в Мумбаи. Хотя её влияние распространилось на более широкую индуистскую националистическую тематику, её наследию и доминированию теперь угрожают новые региональные соперники, такие как MNS."
 RAJ_uniting_the_nationalist_front: "Объединение националистического фронта"
 RAJ_uniting_the_nationalist_front_desc: "Объединить националистический фронт может только Хинду Махасабха, поскольку мы являемся объединяющим звеном между их соперниками."
 RAJ_breaking_the_neck_of_shivsena: "Сломать шею Шив Сене"
 RAJ_breaking_the_neck_of_shivsena_desc: "Шив Сена - это глупые притворщики, которые ставят под сомнение наш авторитет! Мы должны подавить их популярность!"
 RAJ_stomping_the_pretenders: "Растоптать претендентов"
 RAJ_stomping_the_pretenders_desc: "Maharashtra Navnirman Sena - это глупые претенденты, которые ставят под сомнение наш авторитет! Мы должны подавить их популярность!"
 RAJ_new_national_india: "Новая, Национальная Индия"
 RAJ_new_national_india_desc: "Индия наконец-то вернулась к своим основополагающим принципам. Слава Бхарату!"
 RAJ_indian_traditionalism: "Индийский традиционализм"
 RAJ_religious_conversions: "Религиозные преобразования"
 RAJ_religious_conversions_desc: "Нам следует приложить усилия к обращению мусульман и христиан в религиозные религии, чтобы обеспечить их лояльность нашему режиму."
 RAJ_threaten_pakistan: "Угрожать Пакистану"
 RAJ_threaten_pakistan_desc: "Пакистан? Никогда о нём не слышал! Может быть, Вы имели в виду Западный Бхарат?"
 RAJ_antiwestern_propaganda: "Антизападная пропаганда"
 RAJ_antiwestern_propaganda_desc: "Ах, Запад! Над их глупостями надо смеяться и показывать как пример тупости!"
 RAJ_antichina_propaganda: "Антикитайская пропаганда"
 RAJ_antichina_propaganda_desc: "КНР, будучи тоталитарным режимом, является примером того, что происходит со страной, когда её традиции и мораль заменяются тупыми красными книжками!"
 RAJ_prep_reb_tibet: "Подготовка восстания в Тибете"
 RAJ_prep_reb_tibet_desc: "Народ Тибета долгое время подвергался угнетению со стороны китайского правительства. Мы должны помочь им освободиться от Северного Дракона!"
 RAJ_prepare_tooth: "Подготовка зуба"
 RAJ_prepare_tooth_desc: "Военная подготовка и индуистский националистический пыл укрепляют военную мощь Индии."
 RAJ_sharpen_the_claws: "Заточить когти"
 RAJ_sharpen_the_claws_desc: "Острые когти праведных воинов, жаждущих битвы."
 RAJ_greater_india: "Великий Индостан"
 RAJ_greater_india_desc: "Идеология «Акханд Бхарат» стремится к территориальной экспансии и укреплению индуистского национализма."
 RAJ_demand_nepal_and_butan: "Вернуть Непал и Бутан"
 RAJ_demand_nepal_and_butan_desc: "Британцы отделили от нас Бутан и Непал. Какое возмутительное решение! Мы вернем все как должно быть."
 RAJ_demand_bangladesh: "Вернуть Бангладеш"
 RAJ_demand_bangladesh_desc: "Бангладеш слишком долго была отделена от нас. Мы должны объединиться вместе."
 RAJ_regional_partnership: "Возвращение Азад Хинд"
 RAJ_regional_partnership_desc: "Азад Хинд должен быть возрожден как новая добровольческая армия, которая будет защищать наш суверенитет."
 RAJ_influence_indochina: "Влияние на Индокитай"
 RAJ_influence_indochina_desc: "Индокитай не зря имеет название Индо! Он был и будет частью Аханд Бхарат!"
 RAJ_no_to_democracy: "Отменить демократию"
 RAJ_no_to_democracy_desc: "Фу, демократия. Нужна ли она нам на самом деле?"
 RAJ_anew_raj: "Выбор нового Раджи"
 RAJ_anew_raj_desc: "Восстановление монархии привлекает националистические и традиционалистские движения, стремящиеся к авторитарному правлению."
 RAJ_grand_pan_indian_counc: "Большой паниндийский совет"
 RAJ_grand_pan_indian_counc_desc: "Современные проблемы требуют современных решений! Мы сформируем новое, меритократическое правительство, чтобы обеспечить стабильность и процветание Индии!"
 RAJ_dictatorship_benev: "Доброжелательная диктатура"
 RAJ_dictatorship_benev_desc: "Править страной имеют право только военные. Они - защитники нашей земли и должны стать новыми правителями."
 RAJ_hijack_moderates: "Угон модераторов"
 RAJ_hijack_moderates_desc: "Умеренные избиратели должны быть индоктринированы нашими идеями, чтобы обеспечить их лояльность."
 RAJ_bharatiya_janata_party: "Бхаратия Джаната Парти"
 RAJ_bharatiya_janata_party_desc: "Бхаратия Джаната Парти - политическая партия в Индии, одна из двух основных индийских политических партий наряду с Индийским национальным конгрессом."
 militar_coal_tt: "§YВоенные войдут в правящую коалицию!§!"
 RAJ_MODI_rator_of_ind_pol: "МОДИРАТОР индийской политики"
 RAJ_MODI_rator_of_ind_pol_desc: "Нарендра Дамодардас Моди — индийский политик, ставший видной фигурой в партии Бхаратия Джаната Парти (БДП). Моди был главным министром Гуджарата с 2001 года и является членом парламента от Варанаси. Он является членом партии Бхаратия Джаната Парти и Раштрия Сваямсевак Сангх, правой индуистской националистической военизированной добровольческой организации. Он является самым долго занимавшим пост премьер-министра, не будучи членом Индийского национального конгресса."
 RAJ_strongarm_hindutva: "Усиление хиндутвы"
 RAJ_strongarm_hindutva_desc: "Наша партия, возможно, не столь радикальна, как другие крайне правые группы в Индии, но, опираясь на общие идеи, мы должны объединиться в коалицию против других сил. Моди предлагает решения, соответствующие принципам Моди."
 RAJ_dab_on_ngos: "Ограничения на деятельность НПО"
 RAJ_dab_on_ngos_desc: "Иностранные НПО способствуют распространению западных идей в нашей стране. Мы должны противостоять им, чтобы обеспечить популярность BJP."
 RAJ_check_MSF: "Проверка MSF"
 RAJ_check_MSF_desc: "«Врачи без границ» (Medecins Sans Frontieres) — это благотворительная организация, оказывающая гуманитарную медицинскую помощь. Это неправительственная организация французского происхождения, известная своими проектами в зонах конфликтов и странах, затронутых эндемическими заболеваниями."
 RAJ_check_sierra_club: "Проверка Sierra Club"
 RAJ_check_sierra_club_desc: "Sierra Club - американская экологическая организация, имеющая отделения во всех 50 штатах США, Вашингтоне и Пуэрто-Рико."
 RAJ_check_avaaz: "Проверка Avaaz"
 RAJ_check_avaaz_desc: "Avaaz - базирующаяся в США некоммерческая организация, способствующая глобальному активизму по таким вопросам, как изменение климата, права человека, права животных, коррупция, бедность и конфликты."
 RAJ_abolish_planning_comission: "Упразднить комиссию по планированию"
 RAJ_abolish_planning_comission_desc: "Индийский рынок должен быть свободным, и на него не должны накладываться жёсткие ограничения."
 RAJ_full_econ_conv: "Полная экономическая конверсия"
 RAJ_full_econ_conv_desc: "Мы должны полностью перевести нашу экономику на капитализм со свободным рынком. Это единственный рациональный путь для Индии."
 RAJ_niti_aayog: "Niti Aayog"
 RAJ_niti_aayog_desc: "NITI Aayog является ведущим аналитическим центром правительства Индии в области государственной политики и центральным агентством, на которое возложена задача стимулирования экономического развития, развития кооперативного федерализма и отхода от переговорного федерализма путем вовлечения правительств штатов Индии в процесс разработки экономической политики по принципу \"снизу вверх\"."
 RAJ_ensure_free_market: "Обеспечение свободного рынка"
 RAJ_ensure_free_market_desc: "Теперь мы должны обеспечить свободный рынок в Индии не только де-факто, но и де-юре, чтобы наши изменения были полностью интегрированы."
 RAJ_digital_media_camp: "Кампания в цифровых СМИ"
 RAJ_digital_media_camp_desc: "Мы будем использовать все меры для пропаганды наших идеалов. Мессенджеры, социальные сети, реклама в Интернете - всё это должно быть использовано в наших интересах."
 RAJ_urgent_economic_measures: "Срочные экономические меры"
 RAJ_urgent_economic_measures_desc: "Современная экономика очень динамична. Для ее стабилизации и обеспечения непрерывности следует использовать государственное регулирование."
 RAJ_digital_litaracy_programme: "Программа цифровой грамотности"
 RAJ_digital_litaracy_programme_desc: "Программа Digital Saksharta Abhiyan (DISHA) или Национальная миссия цифровой грамотности (NDLM) была разработана с целью обучения населения нашей страны информационным технологиям и цифровой грамотности."
 RAJ_ujjwala_scheme: "Схема Удджвала"
 RAJ_ujjwala_scheme_desc: "Программа Pradhan Mantri Ujjwala Yojana (PMUY, в переводе - \"Схема освещения премьер-министра\") будет запущена премьер-министром Индии Нарендрой Моди с целью распространения 50 млн. подключений к сжижённому газу среди женщин из семей, живущих за чертой бедности."
 RAJ_rasht_swasem_sangh: "Раштрия Сваямсевак Сангх"
 RAJ_rasht_swasem_sangh_desc: "Раштрия Сваямсевак Сангх - индийская ультраправая добровольческая военизированная организация индуистских националистов."
 RAJ_make_them_obey: "Заставить их подчиниться"
 RAJ_make_them_obey_desc: "Неправительственные организации должны продолжать свою работу, поскольку они приносят нам большую пользу. Однако мы должны контролировать их идеологическую пропаганду и добиваться от них лояльности к нашему делу."
 indian_event.28.t: "Кампания Моди против неправительственных организаций"
 indian_event.28.d: "В Индии насчитывается около 3,4 миллиона неправительственных организаций, работающих в самых разных областях, от оказания помощи при стихийных бедствиях до защиты интересов маргинализированных и обездоленных сообществ. Они являются важной частью гражданского общества, способствуя быстрым переменам и социальным преобразованиям. НПО считаются независимыми от государства и носят добровольный характер. Они зависят от частных пожертвований, иностранного финансирования и помощи различных государственных учреждений и частных доноров. Их работа помогает избавить Индию от предрассудков, коррупции, неграмотности и бедности. Однако в последние десятилетия Индия стала сложной средой для ряда организаций, особенно тех, которые работают над расширением прав и возможностей людей в условиях несправедливой государственной политики, ставят под сомнение структурную дискриминацию и защищают права далитов, племенных народов и других обездоленных групп. Ряд индийских правительств пытались ограничить их деятельность."
 indian_event.28.a: "Ха! И, похоже, нам это удаётся!"
 indian_event.29.t: "Предложение по государственному газовому проекту"
 indian_event.29.d: "Программа Pradhan Mantri Ujjwala Yojana, запущенная премьер-министром Индии Нарендрой Моди, направлена ​​на обеспечение женщин из семей, живущих за чертой бедности, газовыми подключениями. На реализацию программы были выделены бюджетные средства. Следует ли проводить эту программу только в штате Уттар-Прадеш или распространить ее на всю Индию?"
 indian_event.29.a: "Распространить на всю Индию"
 indian_event.29.b: "Акцент на одном регионе"
 RAJ_gasallindia: "Газ для всей Индии"
 RAJ_gasoneindia: "Газ только для Уттара-Прадеша"
 RAJ_free_liq_gas: "Pradhan Mantri Ujjwala Yojana"
 RAJ_free_liq_gas_desc: "Пришло время начать новый проект по распределению сжиженного газа для населения нашей страны."
 RAJ_full_india_programme: "Полная индийская программа"
 RAJ_full_india_programme_desc: "Хотя это будет непросто осуществить, вся Индия должна быть вовлечена в эту программу."
 RAJ_only_ujjwala: "Только один регион"
 RAJ_only_ujjwala_desc: "Только самые бедные регионы должны иметь такую ​​привилегию, чтобы сбалансировать социальную ситуацию в стране."
 RAJ_prior_hindus: "Приоритет индусам"
 RAJ_prior_hindus_desc: "Индусы - основа индийского государства. Мы должны всячески отдавать им предпочтение."
 RAJ_coal_with_right_wing: "Коалиция с военными"
 RAJ_coal_with_right_wing_desc: "Военные действительно поддерживают наши реформы. Мы должны обеспечить их лояльность даже в политических вопросах."
 RAJ_goods_and_services_tax: "Налог на товары и услуги"
 RAJ_goods_and_services_tax_desc: "Налог на товары и услуги является преёмником НДС, применяемого в Индии при поставке товаров и услуг. GST - это оцифрованная форма НДС, в которой также можно отслеживать товары и услуги. И НДС, и GST имеют одинаковые налоговые ставки."
 RAJ_global_mafucat_hub: "Глобальный производственный центр"
 RAJ_global_mafucat_hub_desc: "Мы должны стать глобальным производственным центром мира и превзойти Китай. Это наша единственная и неповторимая экономическая цель века!"
 RAJ_partnership_with_armenia: "Партнёрство с Арменией"
 RAJ_partnership_with_armenia_desc: "Армения занимает очень важное геополитическое положение для наших торговых путей и, кроме того, имеет с нами много культурных и исторических связей. Мы должны сотрудничать с ними и создать там военную базу для обеспечения их безопасности."
 RAJ_demonatization_of_rupiah: "Демонетизация индийских банкнот"
 RAJ_demonatization_of_rupiah_desc: "Правительство Индии должно объявить о демонизации всех банкнот серии 500 и 1 000, выпущенных Махатмой Ганди. Оно также объявило о выпуске новых банкнот номиналом 500 и 2 000 в обмен на демонетизированные банкноты"
 RAJ_schwach_bharat: "Миссия Swachh Bharat"
 RAJ_schwach_bharat_desc: "Миссия \"Чистая Индия\" - это общенациональная кампания, инициированная правительством Индии, направленная на ликвидацию открытой дефекации, совершенствование системы удаления твёрдых отходов и создание деревень, свободных от открытой дефекации."
 RAJ_vaccines_for_india: "Вакцины для Индии"
 RAJ_vaccines_for_india_desc: "Вакцины должны быть бесплатными и доступными для всех социальных групп населения нашей страны."
 RAJ_harsh_on_pakistan: "Усиление напряжённости в Пакистане"
 RAJ_harsh_on_pakistan_desc: "Пакистан уже давно нападает на нашу землю! Мы должны показать им немного силы, чтобы утихомирить их аппетиты."
 RAJ_pressuring_china: "Оказание давления на Китай"
 RAJ_pressuring_china_desc: "Китай уже давно проявляет к нам враждебность. Мы должны показать всему миру, какие они ужасные!"
 RAJ_communist_party_of_india: "Коммунистическая партия Индии"
 RAJ_communist_party_of_india_desc: "Коммунистическая партия Индии - старейшая коммунистическая партия Индии. КПИ была основана в современном Канпуре 26 декабря 1925 года."
 RAJ_communist_party_of_india_marxist: "Марксистская коммунистическая партия Индии"
 RAJ_communist_party_of_india_marxist_desc: "Марксистская коммунистическая партия Индии - коммунистическая политическая партия Индии. Она является крупнейшей коммунистической партией Индии по количеству членов и мест на выборах и одной из национальных партий Индии."
 RAJ_communist_party_of_india_politc: "Коммунистическая Индия!"
 RAJ_communist_party_of_india_politc_desc: "В Индии наконец-то свершилась социалистическая революция! Слава Красному Октябрю!"
 RAJ_empow_centre_of_trade_unions: "Расширение прав и возможностей пролетариата"
 RAJ_empow_centre_of_trade_unions_desc: "Пролетариат должен быть теперь полностью свободен и отстаивает свои права в Индии!"
 RAJ_operation_barga: "Операция \"Барга\""
 RAJ_operation_barga_desc: "Операция \"Барга\" - это движение за земельную реформу в сельских районах Западной Бенгалии, направленное на регистрацию имен издольщиков, избегая при этом трудоемкого метода записи через поселенческий аппарат. Она давала баргадарам юридическую защиту от выселения помещиками и право на причитающуюся им долю продукции."
 RAJ_a_new_international: "Новый интернационал"
 RAJ_a_new_international_desc: "Необходимо создать Новый интернационал, чтобы все коммунистические страны объединились в единый фронт!"
 indian_event.30.t: "Индия требует от нас подчинения"
 indian_event.30.d: "Индия требует от нас полной интеграции в страну."
 indian_event.30.a: "Мы согласны."
 indian_event.30.b: "Мы отказываемся"
 RAJ_influence_west_bengal: "Аннексировать Бангладеш"
 RAJ_influence_west_bengal_desc: "Бангладеш должен присоединиться к нам всеми возможными способами. Мы давно ждали этого момента."
 RAJ_bring_back_5_year_plan: "Вернуть пятилетний план"
 RAJ_bring_back_5_year_plan_desc: "Современный капиталистический бред должен исчезнуть. 5-летние социалистические планы - вот путь к успеху!"
 RAJ_foreign_specialists_idea: "Иностранные специалисты"
 RAJ_foreign_specialists_idea_desc: "Мы пригласили иностранных специалистов, чтобы они помогли нашей стране с экономикой"
 RAJ_green_economy_idea: "Зелёный ВВП Индии"
 RAJ_indian_socialism_idea: "Индийский социализм"
 RAJ_scandinavian_model_idea: "Скандинавская модель"
 RAJ_true_social_democracy_idea: "Истинная социал-демократия"
 RAJ_samajwadi_party: "Партия Самаджвади"
 RAJ_samajwadi_party_desc: "Индийская региональная политическая партия, действующая преимущественно в штате Уттар-Прадеш. Основана 4 октября 1992 г. и возникла в результате распада Джаната Дал. Позиционирует себя как демократическая социалистическая партия."
 RAJ_bycicle_of_socialism: "Велосипед социализма"
 RAJ_bycicle_of_socialism_desc: "Индийская экономика - это один большой велосипед, а мы, граждане Индии, - лишь его части. Нам нужна новая велосипедная экономика, чтобы заставить нашу экономику играть как единую структуру и ехать вперёд на велосипеде процветания."
 RAJ_invite_foreign_speicalists: "Приглашение иностранных специалистов"
 RAJ_invite_foreign_speicalists_desc: "К сожалению, наш народ долгое время подвергался эксплуатации со стороны беспринципных капиталистов, которые в своем пагубном стремлении к свободному рынку совершенно забыли о простых людях. Пришло время подстегнуть экономику."
 RAJ_orthodox_socialism: "Православный социализм"
 RAJ_orthodox_socialism_desc: "Распустившаяся в Индии роза социализма готова раскинуть свои шипы против социальной несправедливости и отстаивать права трудящихся на нашей земле."
 RAJ_socialist_india: "Социалистическая Индия"
 RAJ_socialist_india_desc: "Наше великое народное движение не может обойтись без хорошей системы экономического планирования."
 RAJ_befriend_religious_organizations: "Дружба с представителями различных религий"
 RAJ_befriend_religious_organizations_desc: "Индийский велосипед переедет любую вражду, даже между религиями."
 RAJ_neutrality_politics: "Политика нейтралитета"
 RAJ_neutrality_politics_desc: "Индия - страна, чья внутренняя и внешняя политика больше не должна зависеть от внешнего давления. Сейчас мы являемся лидером неприсоединившихся стран."
 RAJ_caste_wage_balancing: "Балансировка заработной платы по кастам"
 RAJ_caste_wage_balancing_desc: "Мы должны оптимизировать заработную плату представителей различных каст в нашей стране, чтобы в ней царили мир и спокойствие."
 RAJ_break_status_quo: "Нарушение статуса-кво"
 RAJ_break_status_quo_desc: "Наша внешняя политика больше не ориентирована на военное сотрудничество с другими странами. Теперь нас интересуют только собственные проблемы."
 RAJ_encourage_birth: "Поощрять рождение"
 RAJ_encourage_birth_desc: "Мы нашли лучший способ поддержания высокой рождаемости в нашей стране."
 RAJ_prior_for_famil: "Приоритет для семей"
 RAJ_prior_for_famil_desc: "Мы должны спонсировать семьи, чтобы повысить положительную рождаемость в нашей стране."
 RAJ_peserve_traditions: "Сохранение традиций"
 RAJ_peserve_traditions_desc: "Завоевав доверие представителей различных религий в нашей стране, мы сможем улучшить наше положение и двигаться к светлому будущему."
 RAJ_indian_premor_socialism: "Индийский первобытный социализм"
 RAJ_indian_premor_socialism_desc: "Мы объединим всех людей в нашей стране, независимо от их пола, расы и цвета кожи. Каждый получит то, что заслуживает, и Индия будет процветать."
 RAJ_organiz_of_unit_soc_people: "Организация подразделения социальных людей"
 RAJ_organiz_of_unit_soc_people_desc: "Несмотря на нейтралитет, мы всё же можем отстаивать свои интересы на международной арене."
 RAJ_new_indian_democracy: "Новая индийская демократия"
 RAJ_new_indian_democracy_desc: "Наша партия говорит о том, что старая демократия была несовершенна. Пришло время создавать новую демократию, более правильную, чем та, которая была."
 RAJ_anticor_soc_meas: "Борьба с коррупцией"
 RAJ_anticor_soc_meas_desc: "Коррупция в государстве - это вирус для нашего народа. Если мы не вылечим её, наша страна окажется в опасности."
 RAJ_ease_the_caste_stuff: "Уменьшение кастовости"
 RAJ_ease_the_caste_stuff_desc: "Для достижения стабильности в государстве нам необходимо снизить уровень кастовости."
 RAJ_preserve_soccon: "Сохранение социального консерватизма"
 RAJ_preserve_soccon_desc: "Нам необходимо снизить социальный консерватизм, чтобы сохранить избирательный и позитивный дух нашего народа."
 RAJ_regional_redistr: "Региональное перераспределение"
 RAJ_regional_redistr_desc: "Мы считаем, что расходы на пенсии и социальное обеспечение не распределяются равномерно в нашей стране. Мы должны это изменить."
 RAJ_merge_bengal_party: "Объединение Бенгальской партии"
 RAJ_merge_bengal_party_desc: "Наши партии должны объединиться, чтобы наш великий велосипед мог катиться дальше."
 RAJ_reforming_the_conomy_soc: "Реформирование социальной экономики"
 RAJ_reforming_the_conomy_soc_desc: "Пришло время реформировать нашу экономику, чтобы исправить её недостатки."
 RAJ_7030_economy: "Экономика 7030"
 RAJ_7030_economy_desc: "В нашей стране очень много бедных людей. Их 70%, и это надо исправлять. Остальные 30% - это богатые люди, и мы верим, что они смогут себя обеспечить."
 RAJ_reserved_seats: "Зарезервированные места"
 RAJ_reserved_seats_desc: "Для того чтобы прийти к более честным выборам, необходимо резервировать места в органах власти, чтобы избежать коррупции."
 RAJ_changing_stakeholders: "Смена заинтересованных сторон"
 RAJ_changing_stakeholders_desc: "Старые спонсоры нас больше не интересуют."
 RAJ_praise_the_unions: "Восхваление профсоюзов"
 RAJ_praise_the_unions_desc: "Профсоюзы - это опора нашей страны, и мы должны защищать их интересы на государственном уровне."
 RAJ_green_economy_soc: "Зелёный ВВП Индии"
 RAJ_green_economy_soc_desc: "Мы смогли создать благоприятные условия для развития индийской экономики. Теперь мы можем вкусить её плоды"
 RAJ_equal_not_equity: "Равенство - не равенство"
 RAJ_equal_not_equity_desc: "Пришло время решить последние проблемы нашей страны, чтобы наконец прийти к идеальному балансу."
 RAJ_full_soc_conv: "Истинная социал-демократическая экономика"
 RAJ_full_soc_conv_desc: "Мы считаем, что такая система позволит Индии процветать на протяжении многих лет."
 RAJ_scandinavian_model: "Скандинавская модель"
 RAJ_scandinavian_model_desc: "Скандинавия - успешный регион, с хорошо развитыми в экономическом и социальном плане странами. Их вариант развития устраивает нас больше всего."
 RAJ_communist_influence_zone: "Зона коммунистического влияния"
 RAJ_communist_influence_zone_desc: "Наши соседи должны быть охвачены революционным духом! Мы должны донести до них идеи марксизма!"
 RAJ_befriend_china: "Подружиться с Китаем"
 RAJ_befriend_china_desc: "Глупые конфликты приходят и уходят, а международное братство остаётся. Китай должен стать нашим самым большим другом!"
 RAJ_sino_indian_alliance: "Китайско-индийский альянс"
 RAJ_sino_indian_alliance_desc: "Теперь мы должны создать союз, чтобы капиталисты боялись нашей мощи."
 indian_event.31.t: "Китайско-индийский альянс"
 indian_event.31.d: "После долгих лет вражды наши страны наконец-то достигли союзнических договоренностей и готовы растоптать капиталистический мусор!"
 indian_event.31.a: "Отлично"
 RAJ_spit_on_revision: "Плевать на ревизионистов"
 RAJ_spit_on_revision_desc: "Напротив, наш непокорный сосед - Китай - распространяет ложные представления о \"настоящем\" социализме. Его политическая структура угрожает прежде всего нам, и мы должны устранить эту угрозу до того, как по нам будет нанесен упреждающий удар."
 indian_event.32.t: "Индия предлагает альянс"
 indian_event.32.d: "Должны ли мы согласиться?"
 indian_event.32.a: "Конечно"
 indian_event.32.b: "Нет, извините"
 RAJ_vietnam_indian_alliance: "Вьетнамо-индийский альянс"
 RAJ_vietnam_indian_alliance_desc: "Вьетнам гораздо ближе к нашей идеологии, чем псевдосоциалистический Китай. Мы должны с ними подружиться."
 RAJ_REV_PAK_TT: "§YМы начнём революцию в Пакистане, чтобы свергнуть их правительство§!"
 RAJ_REV_PER_TT: "§YМы начнём революцию в Иране, чтобы свергнуть их правительство§!"
 RAJ_revolution_in_pakistan: "Революция в Пакистане"
 RAJ_revolution_in_pakistan_desc: "Пакистан должен быть освобожден от религиозных и капиталистических оков, и это освобождение должно быть осуществлено нашим народом!"
 RAJ_iranian_question: "Революция в Иране"
 RAJ_iranian_question_desc: "Иран должен быть освобожден от религиозных и капиталистических оков, и это должно произойти благодаря нашему народу!"
 RAJ_crush_nepal_bhutan: "Сокрушить Непал и Бутан"
 RAJ_crush_nepal_bhutan_desc: "Непал и Бутан - реакционные режимы, выступающие против учения марксизма. Мы должны экспортировать туда нашу революцию."
 RAJ_promote_bangladeshi_communism: "Субконтинент социализма"
 RAJ_promote_bangladeshi_communism_desc: "Наш субконтинент должен стать полностью социалистическим, и это единственный путь!"
 RAJ_national_federation_of_women: "Национальная федерация женщин"
 RAJ_national_federation_of_women_desc: "Женщины должны быть освобождены от социальных цепей и стать равноправными членами нашего общества."
 RAJ_all_ndia_youth_commun: "Всеиндийское молодёжное движение"
 RAJ_all_ndia_youth_commun_desc: "Необходимо создать индийское пионерское движение, чтобы прививать детям нашу истинную идеологию."
 RAJ_common_minimum_programme: "Общая минимальная программа"
 RAJ_common_minimum_programme_desc: "Необходимо оказывать поддержку всем бедным людям. Мы не можем оставить их без внимания, даже если это означает навязывание им нового образа жизни."
 RAJ_fund_cprf: "Оказание помощи КПРФ"
 RAJ_fund_cprf_desc: "Необходимо поддержать российскую коммунистическую партию, чтобы она взяла власть в свои руки и присоединилась к нашему делу."
 RAJ_promote_marxism_in_indochina: "Продвижение марксизма в Индокитае"
 RAJ_promote_marxism_in_indochina_desc: "Марксизм следует продвигать в Индокитае, поскольку это следующий логический шаг в нашей региональной революции."
 RAJ_crusade_against_religion: "Крестовый поход против религии"
 RAJ_crusade_against_religion_desc: "Религия? Какая чушь! Замените труды Вэдаса на труды Маркса, это поможет."
 RAJ_triumph_of_communism: "Триумф коммунизма"
 RAJ_triumph_of_communism_desc: "Наша страна — пример того, как должен быть построен социализм. Завидуйте дальше, капиталисты!"
 RAJ_new_socialism_of_india: "Новый социализм Индии"
 RAJ_new_socialism_of_india_desc: "Наш социализм — это нечто новое для Индии. Это наша собственная модель, и она должна служить примером."
 RAJ_ideological_comissars: "Идеологические комиссары"
 RAJ_ideological_comissars_desc: "Необходимо контролировать образ мышления населения. Идеологические комиссары справятся с этой задачей."
 RAJ_close_parliament: "Военный коммунизм"
 RAJ_close_parliament_desc: "Мы должны быть вооружены до зубов, ведь капиталистические дикари хотят завоевать нашу страну!"
 RAJ_REB_S_neutrality: "Юго-Восточная Азиатская Советская Социалистическая Республика"
 RAJ_partnership_with_russia: "Дружба с Россией"
 RAJ_partnership_with_russia_desc: "Россия уже не такая коммунистическая, но наши исторические связи и их советская ностальгия - хорошая основа для диалога."
 RAJ_congress_of_soviets: "ЮВАССР"
 RAJ_congress_of_soviets_desc: "Время пришло. Мы должны стать чем-то большим, чем просто социалистической Индией. Мы должны стать САССР."
 RAJ_new_democratic_india_idea: "Новая демократическая Индия"
 RAJ_bahujan_samaj_party: "Бахуджан Самадж Парти"
 RAJ_bahujan_samaj_party_desc: "Индийская национальная политическая партия. Представляет интересы далитов и других низших каст населения (отсюда и слово «бахуджан» в названии). Зарегистрированные касты и племена Индии, а также другие «отсталые классы», составляют 85% населения."
 RAJ_torch_of_ambedkar: "Факел Амбедкара"
 RAJ_torch_of_ambedkar_desc: "Факел, зажженный Амбедкаром в 1927 году во время движения \"Махад\", теперь превратился в лесной пожар, который не остановится, пока не отомстит за злодеяния, совершенные против далитов на протяжении всей истории человечества."
 RAJ_social_transformation: "Социальная трансформация"
 RAJ_social_transformation_desc: "Мы должны преобразовать наше общество в более соверш`нное."
 RAJ_economic_emancipation: "Экономическая эмансипация"
 RAJ_economic_emancipation_desc: "Наша экономика требует особых мер по её оптимизации."
 RAJ_social_democracy_of_india: "Социал-демократия Индии"
 RAJ_social_democracy_of_india_desc: "Мы будем создавать более развитую и либеральную социал-демократию, чтобы наши люди чувствовали, что к их мнению прислушиваются."
 RAJ_Indian_federation_of_free_peoples: "Индийская федерация свободных народов"
 RAJ_Indian_federation_of_free_peoples_desc: "Мы создадим страну, в которой демократия и свобода слова станут основой существования. Остальным демократическим странам придется подражать нам, потому что их демократия не так совершенна, как наша."
 RAJ_appease_all_castes: "Удовлетворить все касты"
 RAJ_appease_all_castes_desc: "Все касты должны быть умиротворены, чтобы мы могли показать всем, что в нашей стране действительно уважаются все права и интересы."
 RAJ_new_indian_educ: "Новое индийское образование"
 RAJ_new_indian_educ_desc: "Наше правительство подготовило реформу образования, чтобы каждый гражданин нашей страны мог получить доступ к хорошему образованию."
 RAJ_rural_employment_prog: "Программа занятости в сельской местности"
 RAJ_rural_employment_prog_desc: "У нас по-прежнему огромное количество безработных в сельской местности. Нам необходимо исправить это, создав специальную программу набора и агитации за работу."
 RAJ_more_funding_for_regions: "Увеличение финансирования регионов"
 RAJ_more_funding_for_regions_desc: "Для обеспечения роста экономики Индии необходимо выделять больше средств на развитие её регионов. Особенно в местах с неразвитой инфраструктурой."
 RAJ_caste_wage_balancing1: "Балансировка заработной платы по кастам"
 RAJ_caste_wage_balancing1_desc: "Мы должны сбалансировать заработную плату представителей различных каст, чтобы обеспечить стабильность нашего государства."
 RAJ_crush_the_caste: "Сокрушить касту"
 RAJ_crush_the_caste_desc: "Мы должны сломать касты, чтобы наше общество могло продолжить свою трансформацию."
 RAJ_untouchables_reed: "Неприкасаемый тростник"
 RAJ_untouchables_reed_desc: "Мы должны улучшить образование в нашей стране, чтобы сделать нашу страну более научно развитой"
 RAJ_make_religions_bow: "Заставить религии поклониться"
 RAJ_make_religions_bow_desc: "Каждая религия в нашей стране должна подчиняться единому закону, чтобы избежать нестабильности"
 RAJ_secular_india: "Секуляристская Индия"
 RAJ_secular_india_desc: "Индия больше не будет зависеть от мнения религий."
 RAJ_wipe_out_gandhis_legacy: "Уничтожение наследия Ганди"
 RAJ_wipe_out_gandhis_legacy_desc: "Наследие Ганди является серьёзной проблемой в построении либерального общества."
 RAJ_new_indian_civilization: "Новая индийская цивилизация"
 RAJ_new_indian_civilization_desc: "Теперь народ Индии стал чище, чем прежде. Мы провели множество реформ, которые могли бы к этому привести. Пришло время для новой индийской цивилизации."
 RAJ_modern_indian_constitut: "Современная Конституция Индии"
 RAJ_modern_indian_constitut_desc: "Индия должна принять новую конституцию, чтобы стать более цивилизованным государством."
 RAJ_one_wife_programme: "Программа \"Одна жена\""
 RAJ_one_wife_programme_desc: "Мы сделаем так, чтобы в каждой семье в Индии была только одна жена."
 RAJ_redistr_of_wealth: "Перераспределение богатства"
 RAJ_redistr_of_wealth_desc: "Бедность - наш главный враг. Мы должны с ним бороться."
 RAJ_bamcef: "BAMCEF"
 RAJ_bamcef_desc: "Организация трудящихся угнетённых общин, созданная в 1971 г. Канши Рамом, Д.К. Хапарде и Динабаной. Термин заимствован из Конституции Индии, которая делит угнетённых и эксплуатируемых индийцев на классы в зависимости от их статуса - зарегистрированные касты, зарегистрированные племена, другие отсталые классы и общины меньшинств."
 indian_event.33.t: "Индия требует от нас подчинения"
 indian_event.33.d: "Индия требует от нас полной интеграции в страну."
 indian_event.33.a: "Мы согласны."
 indian_event.33.b: "Мы отказываемся"
 nat_coal_tt: "§GМы объединим всех националистов!§!"
 mah_coal_tt: "§YМы отберём у Шив Сены популярность!§!"
 shiv_coal_tt: "§YМы отберём у MNS Sena популярность!§!"
 RAJ_indian_ceasar_idea: "Индийский традиционализм"
 dep_musl_tt: "§YМы депортируем мусульман из Индии!§!"
 RAJ_REV_TIB_TT: "§YМы начнём восстание в Тибете!§!"
 indian_event.34.t: "Восстание в Тибете!"
 indian_event.34.d: "Тибет провозгласил независимость и требует нашего признания. Что нам делать?"
 indian_event.34.a: "Сокрушите их!"
 indian_event.34.b: "Миииииир? Может быть?"
 RAJ_greater_hindustan_decisions_category: "Расширение территории Великого Индостана"
 RAJ_greater_hindustan_decisions_category_desc: "Концепция «Акханд Бхарат» предполагает единое индийское субконтинентальное государство. Эти решения направлены на территориальную и политическую экспансию в направлении реализации этой концепции."
 RAJ_expanding_sphere_of_influence: "Требование афганской лояльности"
 RAJ_demand_sri_lanka: "Вернуть Шри-Ланку"
 RAJ_demand_myanma: "Подрыв независимости Мьянмы"
 RAJ_burn_down_the_separatist_sentiments: "Сжечь сепаратистские настроения"
 RAJ_land_of_freedom: "\"Земля свободы\""
 RAJ_laotian_resorts: "Поездка на курорты Лаоса"
 RAJ_cambodian_natural_resources: "Природные ресурсы Камбоджи"
 RAJ_change_the_malaysian_constitution: "Внесение изменений в Уголовный кодекс Малайзии"
 RAJ_bring_hinduism_back_to_indonesia: "Вернуть индуизм в Индонезию"
 RAJ_land_mines_desc_info: "§YНа этой территории действуют коммунистические повстанцы!§!"
 RAJ_brics_alliance_decisions: "BRICS"
 RAJ_brics_alliance_decisions_desc: "§HБРИКС§! Она была основана для развития экономики стран, которые так часто оказываются отстраненными от западного диалога, путем построения всеобщего процветания независимо от вероисповедания, идеологии или девиза.\n\nЧленство состоит из трех уровней: §Yнаблюдатель§!, затем §Yпомощник§!, затем §Yполноправный член§!Страна может подать заявку самостоятельно, или же лидер БРИКС может пригласить ее напрямую и продвинуть вверх по иерархической лестнице. На каждом этапе необходимо, чтобы страна пользовалась хорошим авторитетом у лидера и находилась под достаточным влиянием БРИКС, поэтому потепление отношений стоит на первом месте.\n\nПрисоединиться можно с самого начала. §YБразилия, Россия, Китай, Южная Африка§!, вместе с §YЕгипет, Эфиопия, Саудовская Аравия, ОАЭ, Аргентина, Индонезия§! и несколько государств Центральной Азии. Несколько (§YВенесуэла, Алжир, Куба, Сингапур, Дания, Швеция§!) должны сначала выполнить свою собственную национальную программу, прежде чем смогут присоединиться."
 maoist_decision_category: "Наксалитско-Маоистское повстанческое движение"
 maoist_decision_category_desc: "The Naxalite-Maoist insurgency is an ongoing conflict in India where Maoist groups, inspired by the ideology of Mao Zedong, are engaged in armed rebellion against the Indian government. The movement originated in the late 1960s and is primarily active in rural areas, particularly in the states of Chhattisgarh, Jharkhand, and Odisha. The insurgency seeks to address issues of land inequality, exploitation, and social injustice. It is considered one of the biggest internal security threats to India and has resulted in significant violence and loss of life. The government has been implementing various strategies to curb the insurgency and address the underlying causes.\n\n$mao_current_popularity$: [?party_pop_array^19|%1]\n\n§RWarning:§! If any state reaches §Hsevere§! insurgency levels and Maoist political support exceeds §H15%§!, organized demonstrations will begin, and if left unchecked, armed rebellion will follow."
 suppress_maoist_activities: "Подавление маоистской деятельности"
 indian_event.35.t: "Восстание в Восточном Туркестане"
 indian_event.35.d: "Сегодня мы получили срочную информацию о том, что мусульманские меньшинства в Синьцзяне начали вооруженное восстание с целью выхода из состава Китая и провозглашения независимого Восточного Туркестана. Предположительно, повстанцев поддерживает исламистское правительство Индии. Следует ли нам начать военную интервенцию в Синьцзянь или оставить всё как есть?"
 indian_event.35.a: "Вмешательство военным путем."
 indian_event.35.b: "Это не наша забота."
 RAJ_REV_ETK_TT: "§BМы начнём восстание в Синьцзяне!§!"
 RAJ_copied_american_warfare_tactics_idea: "Копирование американской тактики ведения войны"
 RAJ_increase_arms_production_idea: "Увеличение производства вооружений"
 RAJ_revolutions_help: "§BМы можем помочь свергнуть враждебное нам правительство в Центральной Азии§!"
 is_top_influencer_pak: "§Y[ROOT.GetNameWithFlag]§! имеет более чем §G>=35%§! влияния в §Y[PAK.GetNameWithFlag]§!"
 indian_event.36.t: "Вопрос об объединении наших стран"
 indian_event.36.d: "В связи с тем, что в последнее время между нашими странами появилось много общего как в идеологии, так и в экономическом и политическом взаимодействии, между нашим правительством и правительством Индии возник вопрос об объединении наших стран. Должны ли мы объединиться с нашим соседом или выберем \"другой\" путь?"
 indian_event.36.a: "Да, мы вместе будем строить мировую исламистскую революцию."
 indian_event.36.b: "Мы выберем другой путь"
 RAJ_declare_holy_jihad: "Объявление священного джихада"
 RAJ_declare_holy_jihad_desc: "Халифат провозглашает свою экспансионистскую программу религиозным долгом, мобилизуя население на войну против соседей, считающихся отступниками или враждебными."
 RAJ_reach_out_to_pakistani_Salafists: "Обращение к салафитам в Пакистане"
 RAJ_reach_out_to_pakistani_Salafists_desc: "Нам необходимо решить вопрос с пакистанскими салафитами, чтобы открыть путь на Ближний Восток."
 RAJ_funding_central_asian_islamists: "Финансирование исламистов Центральной Азии"
 RAJ_funding_central_asian_islamists_desc: "Центральная Азия является идеальным плацдармом для распространения исламистской революции."
 RAJ_islamic_central_asian_revolutions: "Торкестанская революция"
 RAJ_islamic_central_asian_revolutions_desc: "Соединившись с идеологами исламизма в Центральной Азии, мы можем значительно расширить сферу своего влияния."
 RAJ_true_indian_territories_in_cenasia: "Установление лояльного режима"
 RAJ_true_indian_territories_in_cenasia_desc: "Наконец-то мы сможем объединить братьев по религии в Центральной Азии"
 RAJ_turkmen_treaty: "Договор с Туркменистаном"
 RAJ_turkmen_treaty_desc: "Туркменистан представляет для нас стратегический интерес, поэтому мы можем заручиться его поддержкой."
 RAJ_ally_taliban: "Наши афганские братья"
 RAJ_ally_taliban_desc: "Мы должны объединиться с нашими братьями в Афганистане, потому что только вместе мы сможем победить светский мир."
 RAJ_first_partition_of_afghanistan: "Первый раздел Афганистана"
 RAJ_first_partition_of_afghanistan_desc: "Афганистан - это территория, которая представляет собой идеальное преимущество в вопросе распространения исламистской революции."
 RAJ_bye_bye_turkmenistan: "Справиться с шизофренией"
 RAJ_bye_bye_turkmenistan_desc: "Неужели они думали, что мы будем с ними дружить?"
 RAJ_peaceful_reunification: "Мирное воссоединение"
 RAJ_peaceful_reunification_desc: "В силу нашей особой религиозной связи с пакистанскими салафитами, а также особой экономической связи мы решили мирно воссоединиться с Пакистаном. ИншаАллах!"
 RAJ_bring_back_kashmir: "Растоптать еретиков"
 RAJ_bring_back_kashmir_desc: "Мы не простим Пакистану того, что он до сих пор перекрывает нам доступ к нашему населению в Кашмире. Пакистан будет уничтожен!"
 RAJ_nepal_fell_after_all: "Непал - Пал"
 RAJ_nepal_fell_after_all_desc: "Мы должны вернуть контроль над Непалом, чтобы усилить своё влияние в регионе."
 RAJ_myanmar_what: "Боно не борется за свободу Бирмы"
 RAJ_myanmar_what_desc: "Конечно, у него есть \"свободный\" выбор."
 RAJ_bangladesh_independence: "Вопрос о независимости Бангладеш"
 RAJ_bangladesh_independence_desc: "Бангладеш - это бельмо на глазу, поскольку, если на его территорию войдут иностранные войска, наш восточный коридор окажется под угрозой."
 RAJ_support_xinjian_islamists: "Освободить Восточный Туркестан"
 RAJ_support_xinjian_islamists_desc: "Китай слишком долго угнетал исламское население Синьцзяна. Мы должны помочь им обрести независимость и жить так, как они хотят."
 RAJ_troubleshoot_the_map: "Устранение ошибки отображения"
 RAJ_troubleshoot_the_map_desc: "Израиль - главная угроза и ошибка мира. Мы должны исправить неточность, допущенную на карте."
 RAJ_to_avenge_the_oppression_of_the_uighurs: "Отомстить за притеснения уйгуров"
 RAJ_to_avenge_the_oppression_of_the_uighurs_desc: "Пришло время решить последний вопрос о чаше для риса."
 RAJ_main_enemy_of_chaliphate: "Обезглавить шайтана"
 RAJ_main_enemy_of_chaliphate_desc: "Пришло время выплачивать государственный долг."
 RAJ_get_weapons_on_the_black_market: "Венчурный бизнес на чёрном рынке"
 RAJ_get_weapons_on_the_black_market_desc: "Мы стали слишком изолированными, что вынуждает нас добывать оружие окольными путями."
 RAJ_training_our_soldiers_in_mountains: "Специальная горная подготовка"
 RAJ_training_our_soldiers_in_mountains_desc: "Подготовив наших солдат к работе в самых экстремальных условиях, мы сможем беспрепятственно распространять нашу революцию в любой точке мира."
 RAJ_american_tactic: "Американская тактика"
 RAJ_american_tactic_desc: "Американская тактика доказала свою эффективность во многих войнах. Мы должны брать с них пример для своей армии."
 RAJ_increase_arms_production: "Увеличение производства вооружений"
 RAJ_increase_arms_production_desc: "Расширение собственных производственных мощностей по выпуску вооружений имеет важное значение для поддержания наших военных кампаний и снижения зависимости от иностранных поставщиков."
 RAJ_international_jihadis: "Ближневосточные джихадисты"
 RAJ_international_jihadis_desc: "Идеи исламизма гораздо лучше работают на Ближнем Востоке, поэтому нам нужно снова и снова продвигать эти идеи."
 RAJ_support_islamists: "Поддержка исламистов в Сирии"
 RAJ_support_islamists_desc: "Имея союзников в Сирии, мы можем нанести прямой удар по западным странам."
 RAJ_reconcile_al_qaeda_and_isis: "Объединение разделённых"
 RAJ_reconcile_al_qaeda_and_isis_desc: "Создав единый альянс с другими идеологическими союзниками, мы сможем значительно приблизиться к осуществлению нашей общей мечты об исламском халифате."
 RAJ_fight_against_idols: "Борьба с идолопоклонством"
 RAJ_fight_against_idols_desc: "Новый режим принимает меры против религиозной инфраструктуры индуистов, сикхов и буддистов, рассматривая храмовые комплексы и святыни как идеологическую угрозу, подлежащую демонтажу или перепрофилированию."
 RAJ_no_women_in_politics: "Нет женщинам в политике"
 RAJ_no_women_in_politics_desc: "Наша религия не предполагает, что женщины должны заниматься политикой."
 RAJ_islamization_of_India: "Исламизация Индии"
 RAJ_islamization_of_India_desc: "Общенациональная программа принудительного обращения в другую веру, перемещения населения и демографической инженерии перестраивает индийское общество в соответствии с видением халифата о едином суннитском государстве."
 RAJ_redo_social_policies: "Установление законов шариата"
 RAJ_redo_social_policies_desc: "Законы шариата - это то, что действительно нужно народу Индии. Если мы не введём их, то не сможем назвать себя настоящим исламским халифатом."
 RAJ_fatwa_of_factories: "Промышленная фетва"
 RAJ_fatwa_of_factories_desc: "Фетву можно определить как нормативно-правовой источник исламского права, выступающий в качестве мнения ученых мира ислама, обладающих авторитетом по конкретным рассматриваемым вопросам, инициируемый исламскими судьями (кади) или по требованию меджлиса."
 RAJ_MAO_rebellion: "Ситуация с восстанием"
 RAJ_fatwa_of_factories_idea: "Фетва о заводах"
 the_great_islamic_ulema: "Великие исламские улемы"
 indian_event.37.t: "Новая исламская организация"
 indian_event.37.d: "Недавно сформированное исламистское правительство Индии обратилось к нам с предложением создать единую исламистскую организацию, основной целью которой является распространение исламистских взглядов по всему миру. Поскольку во главе этого союза стоит могущественная страна Индия, то вступление в него, вероятно, гарантировало бы нам защиту от внешних угроз и оградило бы наш правящий режим от покушений."
 indian_event.37.a: "Конечно, давайте объединимся!"
 indian_event.37.b: "Мы тоже можем защитить себя"
 indian_event.38.t: "Приглашение в альянс было отклонено"
 indian_event.38.d: "Их правительство думало, что сможет справиться с внешней угрозой самостоятельно."
 indian_event.38.a: "Разочаровывающий результат"
 RAJ_revenge_for_the_humiliation_of_chechnya: "Месть за унижение Чеченского халифата"
 RAJ_revenge_for_the_humiliation_of_chechnya_desc: "Чеченский халифат был прекрасной идеей, но алчные капиталисты из России решили разрушить эту идею. Наступило время расплаты."
 indian_event.39.t: "Плата за помощь в гражданской войне"
 indian_event.39.d: "Наша победа в Гражданской войне не состоялась бы без прямой поддержки индийского правительства. Поскольку гражданская война обошлась Индии очень дорого, она должна получить что-то взамен. Они требуют, чтобы мы передали им контроль над некоторыми территориями на севере, а взамен они обеспечат нам военную защиту от внешних угроз. Наш режим только начал укрепляться, и мы не хотим быть снова свергнутыми. Что мы выберем?"
 indian_event.39.a: "Мы готовы пойти на этот шаг."
 indian_event.39.b: "Мы не дрогнули перед Советским Союзом, не дрогнем и перед Индией."
 indian_event.40.t: "Требование отклонено"
 indian_event.40.d: "Правительство талибов решило, что у него хватит сил противостоять нашей армии."
 indian_event.40.a: "Посмотрим, выдержат ли они новый натиск."
 RAJ_central_asian_salaf_revolution: "Революции в Центральной Азии"
 RAJ_HELP_TALIB: "§GЕсли вы не поможете талибам в гражданской войне, они не отдадут территорию§!"
 RAJ_main_enemies_of_islamism: "Основные противники исламизма"
 RAJ_main_enemies_of_islamism_desc: "Мы должны отомстить за крах исламского халифата всем, кто причастен к его гибели"
 RAJ_proffesional_soldiers: "Профессиональные солдаты"
 RAJ_proffesional_soldiers_desc: "Для успешного распространения революции нам необходимо укреплять армию."
 RAJ_mao_reb.1.t: "Отпор маоистам!"
 RAJ_mao_reb.1.d: "Нам удалось успешно отразить их действия в регионе, однако мы понесли большие потери."
 RAJ_mao_reb.1.a: "Похороните их с честью."
 RAJ_mao_reb.2.t: "Крупная террористическая атака!"
 RAJ_mao_reb.2.d: "После наших последних рейдов маоисты совершили масштабную террористическую атаку в наших густонаселенных регионах."
 RAJ_mao_reb.2.a: "Уф"
 RAJ_mao_reb.3.t: "Успешный рейд"
 RAJ_mao_reb.3.d: "Мы потеряли несколько человек, но враг был разбит."
 RAJ_mao_reb.3.a: "Отлично"
 RAJ_Export_category: "Торговля индийским оружием"
 RAJ_Export_category_desc: "В современном мире торговля оружием является неотъемлемой частью экономики развитых стран, и Индия не является исключением. Правильная политика прошлых правительств позволила Индии увеличить производство оружия и получить возможность продавать его другим странам. Если мы хотим стать конкурентоспособной державой на международном рынке, мы должны начать развивать торговлю и производство оружия. Индия должна войти в новое тысячелетие как передовая военная держава."
 RAJ_more_relation_is_better: "Если у нас будут §Gболее высокие отношения§! со следующими странами, то они §Cс большей вероятностью присоединятся к нашей фракции§!"
 RAJ_start_export_weapon_TT: "Теперь мы получили разрешение на экспорт нашего оружия в другие страны."
 RAJ_ind_export_weapon_tt: "§YМы получили разрешение на экспорт оружия к ним!§!"
 RAJ_italy_export_weapon_flag: "§YМы получили разрешение на экспорт оружия в Италию!§!"
 RAJ_srilanka_export_weapon_flag: "§YМы получили разрешение на экспорт оружия в Шри-Ланку!§!"
 RAJ_israeli_export_weapon_flag: "§YМы получили разрешение на экспорт оружия в Израиль!§!"
