 TOTAL_MAX_STORAGE_TT: "Le §Ystockage de ressources§! max. peut être étendu en construisant des bâtiments de §Yréserve stratégique de ressources§! supplémentaires dans vos États."
 RESOURCE_STORAGE_INFOMERCIAL: "§RAVERTISSEMENT§! : les exportations puisent aussi dans le stockage. Utilisez la loi commerciale §YÉconomie mixte§! ou inférieure pour éviter de perdre vos réserves de §Ystockage de ressources§!."
