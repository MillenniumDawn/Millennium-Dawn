 AFG_support_afghan_counter_insurgency_tt: "§YUnlocks Taliban insurgency decisions§!\n§YTaliban§! Will be set in a §YStatic War§!"
 isaf_raid_taliban_success_tt: "\n§Y아프간 정부§!와 §Y군부§!의 협조 없이는 작전을 시행할 수 없으므로, §Y성공 가능성§!은 §Y아프간 정부에 대한 대중의 신뢰도§!에 §R영향§!을 받습니다."
