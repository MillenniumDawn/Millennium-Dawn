 RULE_HARD_AI_ECONOMIC: "Экономический ИИ"
 RULE_DISABLE_HARD_AI_ECONOMIC: "Стандартное ограничение"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "Стандартное ограничение для ИИ, не позволяющее ему усиливать свою экономику. Для историчной игры"
 RULE_ENABLE_HARD_AI_ECONOMIC: "Без ограничений"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "Если тебе наскучило, что каждую игру ИИ не выходит из экономического кризиса - это для тебя. ИИ больше не ограничен в принятии решений о своей экономике. Будь готов, что многие страны станут богаче твоей. Только для тех, кто не боится сложностей. Привет от разработчика Battle AI ;)"
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "Долговые войны для ИИ"
 RULE_DISABLE_AI_DEBT_WAR: "Выключено"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "Это отключает функцию долговой войны для ИИ. ИИ больше не будет принимать решение о вторжении в страну, которая не выполняет свои долговые обязательства."
 RULE_ENABLE_AI_DEBT_WAR: "Включено"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "Такая установка сделает ИИ более склонным к объявлению долговых войн."
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS: "ИИ использует §Tфокус на повышение автономии§!"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS: "Включено"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "ИИ будет бороться с вашей автономностью, используя постоянный фокус §Yувеличение автономии§!."
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS: "Отключено"
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "ИИ больше не будет бороться с вашей автономностью, используя постоянный фокус §Yувеличение автономии§!."
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "Включить хаотичные мирные конфиренции"
 RULE_OPTION_CHAOTIC_PC_NO: "Нет"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "Эта опция, надеюсь, остановит всех от захвата земель в мирных конференциях ИИ.\nЭта опция ограничивает тех, кто может претендовать на государства, мажорами и лидерами фракций. (Это повлияет только на ИИ, а не на игрока)."
 RULE_OPTION_CHAOTIC_PC_YES: "Да"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "Для тех, кто действительно наслаждается проклятыми мирными конференциями, зачем ограничивать мир 1 §YРоссией§! когда можно провести 12 §YРоссий§!.\n(Я не несу ответственности за результаты, которые могут произойти от этого варианта!)"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "Включить мирные конференции под руководством игроков"
 RULE_OPTION_PLAYER_LED_PC_NO: "Нет"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "Эта опция позволит ИИ делать свой собственный выбор, каким бы глупым он ни был."
 RULE_OPTION_PLAYER_LED_PC_YES: "Да"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "Для тех, кто не доверяет ИИ вставлять круглый колышек в круглое отверстие, это позволит только игрокам делать заявления во время мирных конференций."
 RULE_SALAFIST_BRANCH: "Активировать подразделение салафитов"
 RULE_YES_SALAFIST_BRANCH_DESC: "Включает ветку салафитов в общем дереве для всех стран, независимо от начальной религии."
 RULE_NO_SALAFIST_BRANCH_DESC: "Включает ветку салифотов в общем дереве для стран, следующих любой разновидности ислама."
 LIC_AI_BEHAVIOR: "@LIC Лихтенштейн"
 SOO_AI_BEHAVIOR: "@SOO Южная Осетия"
 CUB_AI_BEHAVIOR: "@CUB Куба"
 RULE_OPTION_PUTIN: "Единая Россия"
 RULE_OPTION_PEACEFUL_REFORM: "Либеральная Россия"
 RULE_OPTION_THE_RED_MENACE: "Красная угроза"
 RULE_OPTION_RISE_OF_RUSSIA: "Жириновская Россия"
 RULE_OPTION_NAZBOL_RUSSIA: "Национал-большевистская Россия"
 RULE_OPTION_IRON_DIMON_RUSSIA: "Железный Димон"
 RULE_OPTION_LIBERAL_DIMON_RUSSIA: "Либеральный Димон"
 RULE_OPTION_OLIGARCHS_RUSSIA: "Олигархическая Россия"
 RULE_OPTION_DEMOCRAT: "Склонность к демократам"
 RULE_OPTION_DEMOCRAT_AI_DESC: "Соединённые Штаты будут стремиться избрать руководство Демократической партии и удерживать нацию, в современном смысле, в направлении левоцентристского консенсуса управления страной."
 RULE_OPTION_REPUBLICAN: "Склонность к республиканцам"
 RULE_OPTION_REPUBLICAN_AI_DESC: "Соединённые Штаты будут стремиться избрать руководство Республиканской партии и удержать нацию, в современном понимании, в направлении правоцентристского консенсуса управления страной."
 RULE_OPTION_REFORMED_REPUBLIC: "Реформированная республика"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "Воля народа была услышана. Политическое давление и общественный резонанс привели к проведению ключевых политических и экономических реформ, обеспечивающих более широкое представительство и заметность третьих партий. Теперь народ должен выбрать партию, которая будет представлять его интересы."
 RULE_OPTION_POST_UNITED: "Пост Юнайтед Эра"
 RULE_OPTION_POST_UNITED_AI_DESC: "Орёл падает не только из милости. §RНе включайте исторический ИИ§!"
 FIJ_AI_BEHAVIOR: "@FIJ Fiji"
 NIG_AI_BEHAVIOR: "@NIG Федеративная Республика Нигерия"
 RULE_OPTION_RISE_OF_BOKO_HARAM: "Подъём Боко Харам"
 RULE_OPTION_RISE_OF_BOKO_HARAM_AI_DESC: "Давит на Нигерию, чтобы Боко Харам установил контроль над страной."
 RULE_OPTION_PDP_EMPOWERED: "Народно-демократическая партия"
 RULE_OPTION_PDP_EMPOWERED_AI_DESC: "Народно-демократическая партия - одна из крупнейших партий Нигерии. Она выступает, в первую очередь, за христианскую сторону религиозного спектра и неприсоединившихся идеологий."
 RULE_OPTION_ANPP_EMPOWERED: "Все-нигерийская народная партия"
 RULE_OPTION_ANPP_EMPOWERED_AI_DESC: "Все нигерийская народная партия (или Прогрессивный демократический конгресс в 2017 году) является основной оппозиционной партией в 2000 году в Нигерии. Важно отметить, что они очень похожи на социал-демократию в Европе и выступают за проведение крупных реформ в стране Нигерия."
 FRA_AI_BEHAVIOR_MD: "@FRA France"
 RULE_OPTION_FRA_HISTORICAL: "Historical"
 RULE_OPTION_FRA_HISTORICAL_DESC: "The Fifth Republic holds its course as the presidency passes from Chirac to Sarkozy, then Hollande and Macron, with the §8Republicans§! and the centre trading office between them. France anchors European integration and keeps its hand on the Françafrique sphere."
 ITA_AI_BEHAVIOR_MD: "@ITA Italy"
 ROC_AI_BEHAVIOR: "@TAI Республика Китай"
 RULE_OPTION_TAI_PROJECT_NATIONAL_GLORY: "Проект Национальная слава"
 RULE_OPTION_TAI_PROJECT_NATIONAL_GLORY_AI_DESC: "В соответствии с наследием покойного президента Чан Кайши мы будем вести контрнаступление на материк и объединим Китай."
 RULE_OPTION_TAI_UNITE_CHANNEL: "Объединение Тайваньского пролива"
 RULE_OPTION_TAI_UNITE_CHANNEL_AI_DESC: "Две стороны Тайваньского пролива не могут оставаться разделёнными вечно и обязательно будут двигаться к воссоединению в рамках единой системы."
 RULE_OPTION_TAI_STATUS_QUO: "Сохранять статус-кво"
 RULE_OPTION_TAI_STATUS_QUO_AI_DESC: "Ни объединения, ни независимости, ни борьбы."
 RULE_OPTION_TAI_ROAD_TO_SPLIT: "Мечта Тайваня"
 RULE_OPTION_TAI_ROAD_TO_SPLIT_AI_DESC: "Обе стороны Тайваньского пролива управляются отдельно и не подчиняются друг другу. Что такое Китайская Республика?"
 BRM_AI_BEHAVIOR: "@BRM Союз Мьянма"
 RULE_OPTION_BEACON_OF_DEMOCRACY: "Маяк демократии"
 RULE_OPTION_BEACON_OF_DEMOCRACY_AI_DESC: "Мьянма будет проводить реформы без компромиссов, быстро продвигая НЛД к власти. Вместо того, чтобы идти на уступки Татмадау, Мьянма мобилизует различных сторонников политической либерализации, включая этнические повстанческие группы, с целью раз и навсегда покончить с влиянием военных в политике."
 RULE_OPTION_AN_IRON_FIST: "Железный кулак"
 RULE_OPTION_AN_IRON_FIST_AI_DESC: "Это правило игры, применимое только к дате начала 2000 года, вынудит Мьянму оставаться диктатурой и вместо того, чтобы позитивно реагировать на давление реформ, как это было исторически, она станет реагировать репрессиями и тоталитаризмом. Более того, чтобы отвлечься от потери своей легитимности, военное правительство будет вести войну не только с повстанческими группировками страны, но и с её соседями."
 RULE_OPTION_NORTHERN_AMBITION: "Северные амбиции"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "Шведские ультраправые силы наберут популярность, что приведет к попытке создать Шведскую империю в Северной Европе."
 SYR_AI_BEHAVIOR: "@SYR Сирийская Арабская Республика"
 RULE_OPTION_SYR_HISTORICAL: "Исторический ИИ"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Хафез аль-Ассад сменит на этом посту его старший сын Башар аль-Ассад. Башар сохранит Сирию, как страну, связанную с Россией, со сбалансированным фокусом на дипломатию, военную и экономическую деятельность."
 RULE_OPTION_SYR_IRON_LADY: "Железная леди Сирии"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Хафез аль-Ассад сменит на этом посту его дочь Бушра аль-Ассад. Бушра будет придерживаться более нейтрального подхода между великими державами с упором на дипломатию и экономику."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Сирийский дикарь"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Хафез аль-Асад сменит на этом посту младшего сына Махера аль-Асада. Махер попытается сформировать Великую Сирию и обрести новую власть на Ближнем Востоке. Он сосредоточится на военной и экономической экспансии"
 RULE_OPTION_SYR_NEW_ASSAD: "Новый Аль-Асад"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Хафез аль-Ассад сменит на этом посту своего брата Рифаата аль-Ассада после Дамасской весны. Рифаат сосредоточится на просаудовской политике с упором на дипломатию и экономику."
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Дамасская весна"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "Сирия будет поглощена движением Дамасская весна и превращена в демократию."
 BHR_AI_BEHAVIOR: "@BHR Бахрейн"
 SAU_AI_BEHAVIOR: "@SAU Королевство Саудовская Аравия"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST: "Глобальный джихад - сначала ССАГПЗ"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST_AI_DESC: "Саудовская Аравия попытается реформировать свою экономику и объединить ССАГПЗ как супергосударство. Затем саудовская монархия будет свергнута восстанием Аль-Каиды, что приведёт к созданию радикального исламского государства, стремящегося распространять свою фундаменталистскую идеологию насильственными методами."
 RULE_OPTION_GLOBAL_JIHAD: "Глобальный джихад"
 RULE_OPTION_GLOBAL_JIHAD_AI_DESC: "Саудовская монархия будет свергнута восстанием Аль-Каиды, что приведёт к созданию радикального исламского государства, стремящегося распространять свою фундаменталистскую идеологию насильственными методами."
 RULE_OPTION_ISLAMIC_AWAKENING: "Исламское пробуждение"
 RULE_OPTION_ISLAMIC_AWAKENING_AI_DESC: "Влияние Братьев-мусульман на Сахву, или Движение пробуждения, окажет успешное давление на саудовскую монархию, чтобы она уступила место плюралистической исламской демократии."
 RULE_OPTION_RETURN_OF_THE_BAATH: "Возвращение Баата"
 RULE_OPTION_RETURN_OF_THE_BAATH_AI_DESC: "Саудовская Аравия будет постепенно либерализовываться, предоставляя возможность уникальной идеологии социалистического арабского национализма партии Баас закрепиться в стране. Баасовая Аравия затем будет стремиться изгнать иностранные войска с Ближнего Востока, а также расширить свою территорию."
 RULE_OPTION_SHIA_REVIVAL: "Возрождение шиитов"
 RULE_OPTION_SHIA_REVIVAL_AI_DESC: "Шииты Саудовской Аравии воспользуются возможностью, предоставляемой политической либерализацией, чтобы захватить Саудовскую Аравию, приведя страну в соответствие с Ираном и Россией."
 BRI_AI_BEHAVIOR: "@ENG Великобритания"
 RULE_OPTION_RULE_BRITANNIA: "Правь, Британия!"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Once, this sceptered isle was known and feared the world over. The British monarch presided over the empire upon which the sun never set. Now however, Britain's international position has fallen into decline. A mere lackey of the United States, a shadow of its former self. The time has come for the British Empire to be restored. The Crown's partisans will break the two-party system, build their movement through the decade and take power outright in 2010 - and then the fleet sails.\n"
 BOT_AI_BEHAVIOR: "@BOT Ботсвана"
 NKO_AI_BEHAVIOR: "@NKO КНДР"
 RULE_NKO_NAM_RULES: "Ким Чен Нам"
 RULE_NKO_NAM_RULES_DESC: "Ким Чен Нам будет контролировать власть, и он навсегда изменит Корею на пути \"Реформ и открытости\"."
 RULE_NKO_UN_RULES: "Ким Чен Ын"
 RULE_NKO_UN_RULES_DESC: "Как избранный преемник Ким Чен Ира, Ким Чен Ын будет продолжать идти по пути чучхе, антиамериканизма, опоры на собственные силы и деспотичного правления."
 RULE_NKO_JUNTA_RULES: "Переворот хунты"
 RULE_NKO_JUNTA_RULES_DESC: "Военные устраивают переворот, чтобы сохранить чистоту идей чучхе. Они всегда будут поддерживать чучхе и укреплять власть в руках хунты."
 RULE_NKO_Yo_jong: "Ким Ё Чжон"
 RULE_NKO_Yo_jong_ALLOWED_DESC: "Ким Ё Чжон выведет Корейский полуостров на путь процветания."
 RULE_NKO_Yo_jong_BLOCKED_DESC: "Не позволяйте Ким Ё Чжон прийти к власти."
 SIN_AI_BEHAVIOR: "@SIN Сингапур"
 SIN_GLOBAL_DIPLOMACY: "Глобальная дипломатия"
 SIN_GLOBAL_DIPLOMACY_DESC: "Цель Сингапура в мире - установить новый порядок глобальной дипломатии."
 SIN_SINGAPORE_ALONE: "Сингапур в одиночестве"
 SIN_SINGAPORE_ALONE_DESC: "Исторический - Это исторический путь Сингапура.\n\nСингапур лучше всего стоит особняком."
 SIN_PRESSURE_SOUTH_ASIAN_SEAS: "Давление на моря Южной Азии"
 SIN_PRESSURE_SOUTH_ASIAN_SEAS_DESC: "Новая волна сингапурской силы набирает обороты."
 SER_AI_BEHAVIOR: "@SER Югославия"
 RULE_OPTION_MILOCEVIC_COMMI: "Милошевич - коммунист"
 RULE_OPTION_MILOCEVIC_COMMI_AI_DESC: "После того как Милошевичу удастся удержаться у власти, он вернёт страну к коммунизму и попытается возродить Югославию."
 RULE_OPTION_MILOCEVIC_NATI: "Великая Сербия Милошевича"
 RULE_OPTION_MILOCEVIC_NATI_AI_DESC: "Милошевич пойдёт по пути возрождения Великой Сербии и попытается вернуть все земли, на которых проживает сербское население."
 RULE_OPTION_MILOCEVIC_FEDERATION: "Балканская федерация Милошевича"
 RULE_OPTION_MILOCEVIC_FEDERATION_AI_DESC: "Милошевич пойдёт по пути грандиозного, нереализованного проекта - Балканской федерации."
 RULE_OPTION_SERBIAN_KINGDOM: "Королевство Сербия"
 RULE_OPTION_SERBIAN_KINGDOM_AI_DESC: "После свержения Милошевича к власти придут сторонники национализма и монархии, которые попытаются восстановить былое величие сербского народа."
 RULE_OPTION_SERBIAN_LIBERALS: "Либеральная Сербия"
 RULE_OPTION_SERBIAN_LIBERALS_AI_DESC: "Сербская политика пойдёт по пути либерализма и демократии."
 UKR_AI_BEHAVIOR: "@UKR Украина"
 SPR_CONSERVATIVE_LEANINGS: "Консервативные взгляды"
 SPR_CONSERVATIVE_LEANINGS_DESC: "Испания будет сильно склоняться к Народной партии и другим консервативным партиям."
 SPR_RENACIMIENTO_NACIONALISTA: "Националистическое возрождение"
 SPR_RENACIMIENTO_NACIONALISTA_DESC: "Испания будет сильно склоняться к таким партиям, как Vox и España 2000."
 SPR_NACION_UNIDAD_IMPERIO: "Империя национального единства"
 SPR_NACION_UNIDAD_IMPERIO_DESC: "Испания в значительной степени склонится в сторону Ла Фаланги."
 SPR_SOCIALISM_RISING: "Восход социализма"
 SPR_SOCIALISM_RISING_DESC: "ИСРП и социал-демократические партии будут иметь больше шансов быть избранными и проталкиваться в правящую партию."
 SPR_COMMUNIST_REVISIONISM: "Коммунистический ревизионизм"
 SPR_COMMUNIST_REVISIONISM_DESC: "Испания будет пытаться продвигать коммунистические партии."
 SPR_THE_OLD_WAYS: "Старые пути"
 SPR_THE_OLD_WAYS_DESC: "Испания будет стремиться возродить Испанскую империю."
 PER_REVOLUTIONARY_PERSIA: "Возвращение Пехлеви"
 PER_REVOLUTIONARY_PERSIA_DESC: "Пехлеви II вернётся в Иран и создаст светское государство."
 PER_PAN_PERSIA: "Иранская федерация"
 PER_PAN_PERSIA_DESC: "Пан-Иранисты прекратят власть в Иране и будут стремиться к созданию Иранской Федерации!"
 PER_FIRE_HAS_NO_FRIENDS_IRAN: "MEK"
