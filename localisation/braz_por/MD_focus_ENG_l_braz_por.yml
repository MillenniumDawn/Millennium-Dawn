 ENG_celsa_steel_idea: "Parceria com a Celsa Steel"
 ENG_celsa_steel_idea_desc: "Uma parceria de longo prazo com a usina da Celsa em Cardiff garante um fluxo constante de sucata reciclada para novo aço, melhorando nossos rendimentos de recursos e dando-nos a alavanca para pressionar por novos aumentos de produção a cada ano."
 ENG_celsa_steel_tt: "§YChance Anual de 50% de ganhar§! §G+2§! §Y$country_resource_steel$§! (até §Y10§! vezes)"
 ENG_coal_opencast_mining: "Carvão a Céu Aberto Escocês"
 ENG_coal_opencast_mining_desc: "Novas minas a céu aberto nas jazidas de carvão da Escócia mantêm um fluxo constante de combustível barato para nossas usinas de combustíveis fósseis, permitindo que operem com mais força e gerem mais eletricidade para a rede."
 ENG_glasgow_shipbuilding_idea1: "Polo de Construção Naval de Glasgow"
 ENG_glasgow_shipbuilding_idea1_desc: "O investimento nos estaleiros do Clyde simplificou o projeto, a soldagem e o acabamento, reduzindo o custo de produção de todas as nossas embarcações navais construídas em Glasgow e além."
 ENG_glasgow_shipbuilding_idea1_tt: "§YCusto de Construção de Todos os Navios:§! §G-5%§!"
 ENG_glasgow_shipbuilding_idea2: "Polo de Construção Naval de Glasgow"
 ENG_glasgow_shipbuilding_idea2_desc: "O investimento nos estaleiros do Clyde simplificou o projeto, a soldagem e o acabamento, reduzindo o custo de produção de todas as nossas embarcações navais construídas em Glasgow e além."
 ENG_glasgow_shipbuilding_idea2_tt: "§YCusto de Construção de Todos os Navios:§! §G-5%§!\n §YCusto de Projeto de Todos os Navios:§! §G-20%§!"
 ENG_highland_main_line: "Highland Main Line"
 ENG_highland_main_line_desc: "A Highland Main Line modernizada liga Perth e Inverness com trens mais rápidos e confiáveis, ajudando as empresas locais a alcançar mercados, trabalhadores e serviços com mais facilidade."
 ENG_crossrail: "Rede Crossrail"
 ENG_crossrail_desc: "A Elizabeth Line une Heathrow, o West End, a City e Canary Wharf em um único mercado de trabalho, facilitando os deslocamentos, aliviando linhas lotadas e elevando a produtividade da economia de escritórios de Londres."
 ENG_high_value_manufacturing_zone: "Zona de Manufatura de Alto Valor"
 ENG_hs2_idea: "High-Speed 2"
 ENG_northern_powerhouse_rail_idea: "Northern Powerhouse Rail"
 ENG_andrew_digital_enterprise_modifier: "Campanha Real de Digitalização Empresarial"
 ENG_andrew_digital_enterprise_modifier_desc: "Apoiada pelas redes de patrocínio do Duque de York, surgiu uma nova iniciativa para conectar investidores, empresas regionais e empreendimentos de tecnologia por meio de um arcabouço comercial mais moderno. Escritórios de promoção comercial, fóruns empresariais e parcerias com o setor privado estão sendo usados para acelerar a adoção digital e melhorar a visibilidade das empresas britânicas dentro e fora do país."
 ENG_edward_beach_youth_modifier: "Campanha de Alcance à Juventude do Duque"
 ENG_edward_beach_youth_modifier_desc: "Sob o patrocínio do Conde de Wessex, as iniciativas de engajamento juvenil foram ampliadas por meio de programas de premiação, redes comunitárias e eventos públicos em todo o país. A campanha enfatiza a confiança, o serviço cívico e as habilidades práticas, fortalecendo a coesão social e incentivando uma nova geração a participar da vida nacional."
 ENG_prince_charles: "Charles"
 ENG_prince_charles_trait: "Príncipe de Gales"
 ENG_charles_1_idea: "Príncipe de Gales"
 ENG_charles_1_idea_desc: "Charles foi intitulado Príncipe de Gales como herdeiro aparente do Reino Unido. Este título, concedido por cartas patentes e marcado por investidura formal, significava seu status primário de sucessor da Coroa e sua ligação duradoura com Gales e os reinos em geral."
 ENG_prince_andrew: "Andrew"
 ENG_prince_andrew_trait: "Duque de York"
 ENG_andrew_1_idea: "Comandante da Marinha Real"
 ENG_andrew_1_idea_desc: "Como Comandante da Marinha Real, Andrew serviu com distinção na frota britânica, incluindo funções como piloto de helicóptero e comandante de navio. Isso reflete seu longo serviço ativo e sua liderança em operações marítimas, e significa sua profunda ligação com a herança naval do Reino Unido."
 ENG_andrew_3_idea: "Duque de York"
 ENG_andrew_3_idea_desc: "O título de Duque de York foi concedido a Andrew como marca de seu status de membro sênior da realeza e segundo filho do soberano. Tradicionalmente concedido aos filhos mais novos do monarca, carrega prestígio histórico e associações duradouras com o serviço real e o dever público."
 ENG_princess_anne: "Anne"
 ENG_princess_anne_trait: "Princesa Real"
 ENG_princess_anne_leader_name: "$ENG_princess_anne_trait$ Princesa $ENG_princess_anne$"
 ENG_anne_1_idea: "Princesa Real"
 ENG_anne_1_idea_desc: "O título de Princesa Real é detido por Anne como marca de senioridade e serviço excepcional dentro da Família Real. Tradicionalmente concedido pelo soberano à sua filha mais velha, não é automático e é conferido apenas como honra pessoal. Carrega prestígio histórico e sinaliza a expectativa de uma vida inteira de dever visível e compromisso inabalável com a Coroa."
 ENG_princess_anne_naval_trait: "Comandante-Chefe das Mulheres da Marinha Real"
 ENG_princess_anne_army_trait: "Coronel dos King's Royal Hussars"
 ENG_prince_edward: "Edward"
 ENG_prince_edward_trait: "Conde de Wessex"
 ENG_edward_1_idea: "Conde de Wessex"
 ENG_edward_1_idea_desc: "O título de Conde de Wessex foi concedido a Edward como distinção real sênior ligada ao serviço e à responsabilidade pública. Valendo-se de um antigo nome inglês de profunda ressonância histórica, carrega prestígio sem implicar autoridade constitucional. Na Grã-Bretanha moderna, funciona como plataforma de patrocínio, representação e apoio constante ao trabalho público da monarquia."
 ENG_prince_phillip: "Phillip"
 ENG_prince_phillip_trait: "Duque de Edimburgo"
 ENG_phillip_1_idea: "Duque de Edimburgo"
 ENG_phillip_1_idea_desc: "O título de Duque de Edimburgo foi detido pelo Príncipe Philip como marca definidora de seu papel ao lado do soberano e de sua vida de serviço ao reino. Concedido a ele no casamento com a Princesa Elizabeth, combinava prestígio histórico com uma identidade moderna construída sobre dever, disciplina e apoio institucional. Na vida pública, tornou-se intimamente associado a seus patrocínios e ao trabalho prático que sustentou a monarquia ao longo de gerações."
 ENG_prince_william: "William"
 ENG_prince_william_trait: "Duque de Cambridge"
 ENG_prince_william_leader_name: "$ENG_prince_william_trait$ Príncipe $ENG_prince_william$"
 ENG_william_1_idea: "Duque de Cambridge"
 ENG_william_1_idea_desc: "O título de Duque de Cambridge foi concedido ao Príncipe William como distinção real sênior que marca seu papel como figura de destaque da próxima geração. Tradicionalmente conferido pelo soberano a membros proeminentes da Família Real, carrega prestígio e a clara expectativa de representação nacional e dever público. Na Grã-Bretanha moderna, serve como plataforma de patrocínio, serviço e preparação constante de um herdeiro para responsabilidades futuras."
 ENG_prince_william_army_trait: "Tenente Wales"
 ENG_prince_william_high_command_trait: "$ENG_prince_william_army_trait$"
 ENG_royalty_trait: "Realeza"
 ENG_prince_william_army: "$ENG_prince_william_leader_name$"
