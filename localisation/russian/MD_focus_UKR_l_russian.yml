 ukr_modernize_sov_equipment_old_gear_orders_tt: "Покупатель забирает один пакет, всё, что от него осталось, если его мнение о нас не ниже §Y10§! (§Y0§!, если он уже покупал с наших складов):\n• разведывательные машины §YБРДМ-1§!\n• буксируемые орудия: §YМ-46§!, §YМ-30§!\n• стрелковое оружие: §YАК-47§!, §Yвинтовка Мосина§!, §YСКС§!, §YСПГ-9§!, §Y9К32 «Стрела-2»§!\nЦена зависит от того, сколько осталось. Продажа стране §Y[SUD.GetNameWithFlag]§! §Rразозлит НАТО§!."
 ukr_modernize_sov_equipment_storage_sale.26.name: "Покупатели нашей старой техники"
 ukr_modernize_sov_equipment_storage_sale.26.desc: "На наших складах всё ещё хранятся старые машины, орудия и стрелковое оружие. Кому сделать предложение?"
