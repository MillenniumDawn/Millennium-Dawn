 UKR_develop_t72amt: "Разработка §YТ-72АМТ§!"
 UKR_develop_btr3u: "Разработка §YБТР-3У «Мысливец»§!"
 UKR_develop_btr3u_desc: "БТР-3У «Мысливец» (известен также как БТР-3У Guardian) — глубокая модернизация БТР-94К с двигателем Deutz BF6M1015 мощностью 326 л. с. и автоматической коробкой Allison MD3066 либо с двигателем УТД-20 мощностью 300 л. с.\nХарьковское КБ имени А. А. Морозова разработало конструкторскую документацию: ходовую часть и интеграцию всех систем и вооружения машины.\nВ вооружение входит боевой модуль КБА-105 «Шквал» с 30-мм автоматической пушкой ЗТМ-1, спаренным с ней 7,62-мм пулемётом КТ-7,62, двумя пусковыми установками ПТУР 9М114М «Конкурс-М» и 30-мм автоматическим гранатомётом.\nМашина оснащена прицельным комплексом ОТП-20, объединённым с системой управления огнём управляемых ракет, и двухплоскостным стабилизатором вооружения СВУ-500."
 UKR_develop_btr3e: "Разработка §YБТР-3Э§!"
 UKR_develop_btr3e_desc: "БТР-3Э — модификация с двигателем УТД-20 или Deutz BF6M1015.\nОснащён боевым модулем БМ-3М «Штурм-М», в вооружение которого входят 30-мм автоматическая пушка ЗТМ-1, спаренный с ней 7,62-мм пулемёт КТ-7,62, две пусковые установки (6 ракет) «Барьер» и 30-мм автоматический гранатомёт КБА-117."
 UKR_develop_btr3e1: "Разработка §YБТР-3Э1§!"
 UKR_develop_btr3e1_desc: "БТР-3Э1 — модификация БТР-3Э, созданная специально под требования тайского контракта 2005–2006 годов.\nГлавные отличия от БТР-3Э: установка модернизированного боевого модуля БМ-3М «Штурм», снижение высоты с 2928 до 2774 мм, увеличение боевого расчёта с 9 до 13 человек, установка радиостанции VRC-950 и размещение дополнительного боекомплекта для боевого модуля."
 UKR_develop_btr3da: "Разработка §YБТР-3ДА§!"
 UKR_develop_btr3da_desc: "БТР-3ДА — дальнейшее развитие бронетранспортёра с учётом опыта войны на востоке Украины.\nБТР-3ДА быстрее и манёвреннее предшественников, у него усилено бронирование экипажа и установлен оптико-электронный модуль с телевизионным и тепловизионным каналами.\nБлагодаря этому стала возможна стрельба ночью.\nДополнительная силовая установка позволяет управлять боевым модулем, не запуская основной двигатель."
 UKR_develop_btr3u_flag: "Завершено принятие решения §YРазработка БТР-3У «Мысливец»§!"
 UKR_develop_btr3e_flag: "Завершено принятие решения §YРазработка БТР-3Э§!"
 UKR_develop_btr3e1_flag: "Завершено принятие решения §YРазработка БТР-3Э1§!"
 UKR_develop_btr3da_flag: "Завершено принятие решения §YРазработка БТР-3ДА§!"
 UKR_develop_btr3e1_cse90lp: "Разработка §YБТР-3Э1 CSE90LP§!"
 UKR_develop_btr3e1_cse90lp_desc: "БТР-3Э1 CSE90LP — это модификация БТР-3Э1, оснащенная башней Cockerill CSE 90LP с 90-мм малокалиберной пушкой.\nБашня оборудована спаренным 7,62-мм пулеметом и 40-мм автоматическим гранатометом.\nБашня оснащена автоматической системой управления огнем, включающей лазерный дальномер, тепловизор и баллистический вычислитель."
 UKR_develop_btr3e1_cpws30: "Разработка §YБТР-3Э CPWS-30§!"
 UKR_develop_btr3e1_cpws30_desc: "БТР-3Э КПВС-30 — это модификация БТР-3Э, оснащенная башней КПВС-30 с 30-мм автоматической пушкой.\nБашня оборудована спаренным 7,62-мм пулеметом и 40-мм автоматическим гранатометом.\nБашня оснащена автоматической системой управления огнем, включающей лазерный дальномер, тепловизор и баллистический вычислитель."
 UKR_develop_btr4_category: "Разработка БТР-4[UKR_btr4_development_steps_loc]"
 UKR_develop_btr4_category_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_main\n\n\n\n\n\n\n\n\nМы можем потратить время и деньги на исследование и тестирование совершенно новой отечественной конструкции современных БТР."
 UKR_develop_btr4_choose_role: "Выбрать роль для §YБТР-4§!"
 UKR_develop_btr4_choose_role_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_roles_for_tooltip\n\n\n\n\n\n\n\n\n§YBTR-4§! задумывался как шаг вперед по сравнению с предыдущими советскими образцами и изначально был разработан с учетом более тяжелого вооружения.\nМы можем выбрать желаемую роль для этой техники — более легкий и дешевый БТР или более дорогая и тяжело вооруженная БМП.\nНаше решение повлияет на то, какими батальонами будут оснащены БТР-4: механизированными или бронетанковыми.\nУ нас будет возможность производить практически один и тот же тип техники, но в противоположной роли, если мы этого захотим."
