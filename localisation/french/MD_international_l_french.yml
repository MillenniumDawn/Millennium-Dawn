 is_ct_mass_gather_tt: "Mène des opérations de collecte de renseignement pour rassembler des données à traiter. Les données traitées donneront un bonus temporaire de §Yprécision du renseignement§! contre §Y[name_of_org_disp]§!, déclinant chaque mois après une action d'§Yexploitation du renseignement§!."
 is_ct_exploit_intel_tt: "Exploite le renseignement collecté, donnant un plus fort bonus de §Yprécision du renseignement§! contre §Y[name_of_org_disp]§! pendant un temps limité, déclinant chaque mois jusqu'à épuisement de son utilité opérationnelle."
 is_ct_infil_agent_tt: "Tente d'infiltrer un agent dans §Y[name_of_org_disp]§!. En cas de succès, nous gagnerons un bonus permanent de §Yprécision du renseignement§!. Si l'infiltration échoue, notre §Yprécision du renseignement§! se dégradera un temps, et le §Rniveau de menace terroriste§! de §Y[name_of_org_disp]§! augmentera.\n\nLa chance de réussir l'infiltration est modifiée par notre §Yprécision du renseignement§! et la formation des agents de notre §Yagence de renseignement§!."
 is_ct_asset_seizure_tt: "Saisir des avoirs réduira le §Rniveau de menace terroriste§! de §Y[name_of_org_disp]§!, mais rendra aussi plus difficile d'obtenir de la §Yprécision du renseignement§! contre §Y[name_of_org_disp]§! pendant un temps."
 is_ct_arrest_sympathizers_tt: "Arrêter des sympathisants réduira le §Rniveau de menace terroriste§! de §Y[name_of_org_disp]§!, tout en augmentant la §Yprécision du renseignement§! contre §Y[name_of_org_disp]§!. Cependant, des innocents peuvent être pris dans les arrestations, et le cas échéant nous risquons un contrecoup politique.\n\nL'efficacité des arrestations dépendra de notre §Yprécision du renseignement§! et des améliorations de contre-espionnage et d'antiterrorisme de notre §Yagence de renseignement§!.\n"
