 track_ii: "Contactos de la Vía II"
 apply_to_join_as_a_member_desc: "La membresía de pleno derecho en la Organización de Cooperación de Shanghái confiere acceso a la arquitectura de seguridad de la organización, los canales de inversión económica y los mecanismos de coordinación política. La solicitud activa un periodo de consideración de noventa días y, si se aprueba, otorga el espíritu nacional de membresía correspondiente según la vía de enfoque actual de China."
 apply_to_join_as_an_observer_desc: "El estatus de observador otorga acceso a las cumbres de la Organización de Cooperación de Shanghái, a los ejercicios conjuntos y a los marcos de coordinación económica sin las obligaciones de la membresía plena. Los solicitantes deben superar un periodo de revisión de noventa días por parte de China y, cuando corresponda, de Rusia antes de que se conceda el espíritu nacional."
 BRI_apply_for_mining_project: "Solicitar proyecto minero de la Franja y la Ruta"
 BRI_apply_for_mining_project_desc: "Solicitar un proyecto minero. La aprobación requiere 40 de nuestra tesorería o genera un préstamo chino por la misma cantidad."
 BRI_apply_for_pipeline_project: "Solicitar proyecto de oleoducto/gasoducto de la Franja y la Ruta"
 BRI_apply_for_pipeline_project_desc: "Solicitar un proyecto de oleoducto o gasoducto. La aprobación requiere 40 de nuestra tesorería o genera un préstamo chino por la misma cantidad."
 BRI_apply_for_port_project: "Solicitar proyecto portuario de la Franja y la Ruta"
