 sov_reunification_category: "러시아 통일"
 sov_reunification_category_desc: "전쟁의 결과로 러시아는 분열되었습니다. 먼지가 가라앉은 지금, 우리는 통일의 고난을 견뎌 내야 합니다.\n\n분리된 지역은 지역별 요구가 따르는 §Y협상§!이나 안정도와 전쟁 지지도를 소모하는 §Y무력§!으로 되찾아 올 수 있습니다. 외세의 지배를 받는 지역은 먼저 협상을 통해 풀려나야 합니다. 모든 지역이 돌아오면 §G통일된 러시아§!가 우리의 복구를 앞당길 것입니다.\n\n현재 통일 진행도: [?THIS.reunification_progress]."
 SOV_reunification_mission: "통일 원탁 회담"
 sov_dissolution.1.t: "지역주의의 대두"
 sov_dissolution.1.d: "최근의 전쟁이 악화됨에 따라 더 많은 국가 행위자들이 독립을 주장하기 시작하고 있습니다. 이 상황이 걷잡을 수 없이 번져 광범위한 불안정으로 이어지는 것은 시간문제입니다."
 sov_dissolution.1.a: "불가능하다"
 sov_dissolution.2.t: "재통합된 러시아의 일부"
 sov_dissolution.2.d: "오랜 협상 끝에 조국의 또 다른 지역이 본래의 깃발 아래로 돌아왔습니다. 이는 통일과 국가 안정을 향한 중요한 한 걸음입니다."
 sov_dissolution.2.a: "한 걸음 더 가까워졌다"
 sov_dissolution.3.t: "괴뢰국 해방을 요청하는 러시아"
 sov_dissolution.3.d: "러시아 정부가 옛 영토 중 한 곳의 완전한 독립을 협상하기를 바라며 접촉해 왔습니다. 이 조치는 이 지역의 힘의 균형을 바꿀 수 있습니다."
 sov_dissolution.3.a: "돈 투자가 도움이 될 수 있습니다"
 sov_dissolution.3.b: "우리는 그들의 국가 자산을 살 수 있습니다"
 sov_dissolution.3.c: "논할 가치도 없다"
 sov_dissolution.4.t: "금전적 보상을 요구하는 [FROM.GetName]"
 sov_dissolution.4.d: "[FROM.GetNameWithFlag]과(와) 자국 일부를 해방하는 방안에 관해 회담한 결과, 그들은 이 양보의 대가로 금전적 보상을 제안했습니다. 이러한 요구는 협상 과정을 복잡하게 만듭니다."
 sov_dissolution.4.a: "최소한의 피해였다"
 sov_dissolution.4.b: "불가능해"
 sov_dissolution.5.t: "국유 자산 이전을 요구하는 [FROM.GetName]"
 sov_dissolution.5.d: "일부 지역의 해방에 관한 논의에서 [FROM.GetNameWithFlag]이(가) 보상으로 국유 자산의 이전을 요청했습니다. 이 요구는 진행하기 전에 신중한 검토가 필요합니다."
 sov_dissolution.5.a: "최소한의 피해였다"
 sov_dissolution.5.b: "불가능해"
 sov_dissolution.6.t: "협상 가능성을 부인하는 [FROM.GetName]"
 sov_dissolution.6.d: "접촉 노력에도 불구하고 [FROM.GetNameWithFlag]은(는) 자국 영토 일부를 해방하자는 모든 제안을 단호히 거부했습니다. 상황은 여전히 긴장되고 불안정하며, 즉각적인 해결의 가능성은 낮습니다."
 sov_dissolution.6.a: "거만한 멍청이들!"
 sov_dissolution.7.t: "우리의 조건에 동의한 [SOV.GetName]"
 sov_dissolution.7.d: "[SOV.GetName]이(가) 우리 소속 국가를 해방하기 위한 우리의 합당한 보상 요구를 수락했습니다. 이 합의는 우리를 통일과 평화에 한층 더 가까이 이끌어 줍니다."
 sov_dissolution.7.a: "그저 사업일 뿐이다"
 sov_dissolution.8.t: "우리의 조건을 거부한 [SOV.GetName]"
 sov_dissolution.8.d: "[SOV.GetName]이(가) 우리 소속 국가의 해방에 대한 우리의 합당한 보상 요구를 검토하기를 거부했습니다. 이 거부는 진전을 지연시키고 긴장을 고조시킬 수 있습니다."
 sov_dissolution.8.a: "자기들 손해지"
 sov_dissolution.10.t: "협상 중의 정치적 혼란"
 sov_dissolution.10.d: "러시아와의 재통합 가능성에 관한 회담 도중 여러 민감한 사안이 불거지면서 협상 과정이 사실상 교착되었습니다. 정치적 분위기는 여전히 불확실하고 취약합니다."
 sov_dissolution.10.a: "우리가 쓸 수 있는 수단을 활용하자"
 sov_dissolution.10.b: "이번에는 물러나 있어야 한다"
 sov_dissolution.11.t: "협상 자금 부족"
 sov_dissolution.11.d: "재통합 회담에서 국가 이전과 관련된 행정 비용을 충당하기 위해 금전적 보상이 제안되었습니다. 그러나 자금 부족으로 진전이 멈출 위기에 처해 있으며 신중한 예산 편성이 필요합니다."
 sov_dissolution.11.a: "과정의 일부다"
 sov_dissolution.11.b: "돈은 없다. 하지만 버텨 보라!"
 sov_dissolution.12.t: "양립할 수 없는 국유 자산"
 sov_dissolution.12.d: "일부 국유 자산이 재통합 협상 중 파산에 직면할 것이 분명해졌습니다. 이 문제를 해결하고 회담을 진전시키기 위해 단호한 조치를 취해야 합니다."
 sov_dissolution.12.a: "Sell it now."
 sov_dissolution.12.b: "그 자산이 필요하다"
