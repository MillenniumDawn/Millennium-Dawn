 ITA_restart_otomatic_development: "OTOMATIC 개발 재개"
 ITA_restart_otomatic_development_desc: "OTOMATIC 개발 재개"
 ITA_alenia_aermacchi_merger: "알레니아 아에르마키 합병"
 ITA_alenia_aermacchi_merger_desc: "알레니아 아에로나우티카와 아에르마키는 이탈리아 군용기 제조 분야의 가장 큰 두 기업으로, 두 회사 모두 어느 정도 이탈리아 국가의 통제를 받고 있습니다. 이들을 합병하면 불필요한 구조를 줄이고 효율성을 높이는 데 도움이 될 것입니다."
 ITA_alenia_aermacchi_merger_TT: "알레니아 아에로나우티카와 아에르마키를 새로운 알레니아 아에르마키 회사로 합병하며, 특성 점수의 양은 그대로 유지됩니다.\n\n(배정된 특성만 규모로 계산됩니다)"
 ITA_finmeccanica_restructuring: "핀메카니카 구조조정"
 ITA_finmeccanica_restructuring_desc: "핀메카니카는 이미 이 나라의 전략 방위 기업 대부분을 통제하고 있습니다. 낭비를 줄이고 처리량을 늘리기 위해 이러한 자산을 하나의 회사로 제대로 정비할 때가 되었습니다."
 ITA_finmeccanica_restructuring_TT: "알레니아 아에르마키, 핀메카니카, 아구스타웨스트랜드를 새로운 레오나르도 회사로 합병하며, 특성 점수의 양은 그대로 유지됩니다.\n\n(배정된 특성만 규모로 계산됩니다)"
 ITA_world_renown_cuisine: "세계적으로 유명한 요리"
 ITA_world_renown_cuisine_desc: "이탈리아의 요리 전통은 전 세계에서 최고 수준에 속하며, 해외에서 이탈리아 음식에 대한 상당한 수요를 이끌고 있습니다. 유명한 지중해식 식단 또한 매우 건강한 생활 방식으로 널리 인정받고 있습니다."
 ITA_encourage_micro_hydropower: "소수력 발전 장려"
 ITA_encourage_micro_hydropower_desc: "대규모 수력 발전 잠재력 사업의 대부분은 지난 세기에 이미 개발되었지만, 소규모 사업을 활용할 여지는 여전히 상당합니다."
 ITA_encourage_micro_hydropower_TT: "수력 발전량이 §G25%§! 증가합니다"
 ITA_develop_pumped_hydro: "양수 발전 저장 개발"
 ITA_develop_pumped_hydro_desc: "우리의 방대한 수력 발전 기반시설 중 상당 부분은 양수 발전 기술을 통해 에너지를 저장하는 데 활용될 수 있습니다. 특히 앞으로 재생 에너지가 더 많이 설치된다면 이에 투자하는 것이 현명할 것입니다."
 ITA_develop_pumped_hydro_TT: "발전되는 수력 1GW당 §G100 GWh§!의 에너지 저장 용량이 추가됩니다."
 ITA_subsidize_rooftop_solar: "옥상 태양광 보조금 지급"
 ITA_subsidize_rooftop_solar_desc: "우리나라는 태양의 축복을 받은 땅이니, 이를 더 활용해 보아도 나쁠 것이 없습니다."
 ITA_subsidize_rooftop_solar_TT: "\n§R위 비용은 각 주마다 적용됩니다.§!\n"
 ITA_southern_wind_power: "남부 풍력 발전"
 ITA_southern_wind_power_desc: "이탈리아 남부는 육상과 해상 모두에서 풍력 발전의 잠재력이 상당합니다."
 ITA_specialize_mangusta: "A129 망구스타 헬리콥터 전문화"
 ITA_specialize_mangusta_desc: "A129 망구스타는 대전차 유도 미사일, 로켓, 기관포 포드를 비롯해 여러 가지 무기 체계를 탑재할 수 있는 첨단 공격 헬리콥터입니다."
 ITA_specialize_mangusta_spirit: "A129 망구스타 헬리콥터 전문화"
 ITA_specialize_otomatic: "OTOMATIC 자주 대공포 전문화"
 ITA_specialize_otomatic_desc: "OTO 주력 요격 및 전투용 대공 전차는 이탈리아 해군이 운용하는 첨단 고속 발사 76mm 포를 레오파르트 I 파생 차체에 탑재하여 항공 및 미사일 방어는 물론 간접 화력 지원과 대전차 능력까지 제공합니다."
 ITA_specialize_otomatic_spirit: "OTOMATIC 자주 대공포 전문화"
 ITA_exploit_superiority: "우세 활용"
 ITA_exploit_superiority_desc: "우리 세력의 방대한 항공 전력은 하늘의 완전한 장악을 보장할 것입니다. 이미 우리 것인 것을 얻으려고 더 많은 자원을 낭비할 이유가 없으며, 대신 제공권에서 얻을 수 있는 최대한의 이점을 뽑아내는 데 집중해야 합니다."
 ITA_achieve_superiority: "우세 달성"
 ITA_achieve_superiority_desc: "적이 하늘을 장악하고 있다면 완벽한 폭격기도 쓸모가 없으므로, 한정된 자원을 제공권 달성에 집중해야 합니다."
