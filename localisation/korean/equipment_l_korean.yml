 SOV_Rec_tank_3_desc: "The Bumerang was first revealed to be both a cost-efficient APC and IFV for the modern Russian Army. However, the Bumerang will also be used as a dedicated anti-tank platform sporting a 125mm cannon, the details of which were unveiled in 2018. Much like the American Stryker MGS, the Bumerang will serve as a fire support vehicle much like the BMPT."
 SPR_APC_4: "FMC Assault Amphibious Vehicle LVTP-7"
 SPR_APC_4_short: "LVTP-7"
 SPR_APC_4_desc: "After the Korean War the USMC ordered a new amphibious vehicle model to replace the old LVT. It is used by U.S. Marine Corps Assault Amphibian Battalions to land the surface assault elements of the landing force and their equipment in a single lift from assault shipping during amphibious operations to inland objectives and to conduct mechanized operations and related combat support in subsequent mechanized operations ashore. It is also operated by other forces. Marines call them \"amtracs\", a shortening of their original designation, \"amphibious tractor\". Spanish navy signed a deal to include them for the Infantería de Marina."
 SPR_APC_5: "BAE Systems Assault Amphibious Vehicle 7A1"
 SPR_APC_5_short: "AAV-7A1"
 SPR_APC_5_desc: "The Assault Amphibious Vehicle (AAV), official designation AAVP-7A1 (formerly known as Landing Vehicle, Tracked, Personnel-7 abbr. LVTP-7), is a fully tracked amphibious landing vehicle. Powered by a Cummins VT400 diesel engine and this is driven through FMC's HS-400-3A1 transmission. It has eight smoke grenade launchers around the armament station which is a Cadillac Gage weapon station or Up-Gunned Weapon Station (UGWS) which was armed with both a .50 cal (12.7 mm) M2HB machine gun and a Mk-19 40 mm grenade launcher. The AAV-7A1 is the main amphibious assault vehicle of the Spanish Infantería de Marina."
 SPR_APC_6: "RG-31 Nyala"
 SPR_APC_6_short: "RG-31 Nyala"
 SPR_APC_6_desc: ""
 SPR_APC_7: "MOWAG GmbH Piraña III"
 SPR_APC_7_short: "Piraña III"
 SPR_APC_7_desc: "Designed by the Swiss company MOWAG (currently General Dynamics European Land Systems – Mowag GmbH). The Piraña IIIC is an 8x8 APC Vehicle with a modular scaleable armor protection against small arms fire, mine blasts and RPG rockets. It could be tailored, to suit specific customer requirements. Add-on armor can be fitted for a higher level of protection. It has a special underfloor design, that provides protection against landmines and improvised explosive devices. Vehicle is fitted with NBC protection and automatic fire suppression systems. A baseline APC is usually armed with remotely-controlled 12.7mm HMG."
 SPR_APC_8: "MOWAG GmbH Piraña IIIC"
 SPR_APC_8_short: "Piraña IIIC"
 SPR_APC_8_desc: "An improved version of the Piraña III."
 SPR_IFV_1: "Panhard M-3"
 SPR_IFV_1_short: "M-3"
 SPR_IFV_1_desc: "The Panhard M-3 vehicle was designed to give support to the units equipped with the AML recon model. The 95% of the mechanic pieces are fully compatible with the AML model so the building and maintenance costs can be reduced to minimum. Vehicle's crew consists in a commander, gunner, loader and driver. The basic weapon configuration is a M-32 76/60mm cannon a M-2 12.70mm machine gun in the roof and a coaxial 7.62mm Browning M-1919A4E1."
 SPR_IFV_2: "ENASA-Pegaso VEC"
 SPR_IFV_2_short: "VEC"
 SPR_IFV_2_desc: "The VEC (Spanish. Vehiculo de Exploracion de Caballería) is armoured vehicle based in the BMR and designed by the spanish company ENASA-Pegaso (Today Santa Bárbara Sistemas). The VEC version retains most of the mechanical components of the BMR but varies the shape of the hull, distribution and internal conditioning to adapt it to its new functions. The VEC mounts a 25mm M-242 Bushmaster cannon or a 7.62mm MG-42 machine gun in a TC-25 turret."
 SPR_IFV_3: "ENASA-Pegaso VEC-M"
 SPR_IFV_3_short: "VEC-M"
 SPR_IFV_3_desc: "After a long and intense service the VEC-M includes several improvements over the original model. The engine has been replaced by a Scania DS9 with a better performance the other highly improved area has been vehicle's defense. The hull armour has been increased to counter damage from medium machine guns until 14.50mm cal. The M series includes an anti-explosion equipment very similar to the MBT units based in several sensors which enables a fire-control system when detecting an internal explosion."
 SPR_IFV_6: "General Dynamics ASCOD VCI/C Pizarro Phase III"
 SPR_IFV_6_short: "VCI/C Pizarro III"
 SPR_IFV_6_desc: "On its third iteration is remarkable that this new Pizarro Phase 3 would be the result of combining the new generation ASCOD barge used in the Sapper Combat Vehicle (VCZAP) but providing it with the mission systems developed for the Wheel Combat Vehicle (VCR) \"Dragon\". The modernized barge used in the VCZAP offers high levels of protection as it is optimized against mines and IEDs, has high ballistic protection and anti-mine seats. The mission systems that have been incorporated, incorporates situational awareness, communications equipment, weapons systems, electro-optics and navigation systems."
 SPR_IFV_8: "General Dynamics Santa Bárbara Sistemas Dragón"
 SPR_IFV_8_short: "VCR 8x8 Dragón"
 SPR_IFV_8_desc: "Based in the Piranha V platform, the Dragón is an armored infantry transport vehicle which has been totally designed for being fully adapted to the Spanish army requirements. The basic model for infantry transport, incorporates the UT-30 MK2 remote tower, manufactured by NAVANTIA but with ELBIT and EXPAL technology, armed with the 30 mm ATK MK44-ABM Bushmaster II cannon."
