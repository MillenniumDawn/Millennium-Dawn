 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_expired_tt: "공장이 제안을 철회합니다. §Y2004년§!에 더 본격적인 개량안을 들고 돌아옵니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_expired_tt: "공장이 제안을 철회합니다. §Y2010년§!에 다른 제조사들이 관심을 보일 수 있습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_expired_tt: "공장이 제안을 철회하며, 남은 BRDM-2는 현 상태 그대로 유지됩니다."
