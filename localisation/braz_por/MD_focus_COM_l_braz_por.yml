l_braz_por:
 comoros_focus: "Árvore de Foco de Comores"
 COM_non_nato_ally: "Mais Próximo da OTAN"
 COM_non_nato_ally_desc: "Devemos nos esforçar para cooperar e, talvez no futuro, nos integrarmos à OTAN. A França é nosso aliado mais próximo lá e não devemos esquecer disso."
 COM_got_support: "Suporte é fornecido"
 COM_buy_missile_defences: "Compra de Defesa Aérea Francesa"
 COM_buy_missile_defences_desc: "A aquisição de sistemas de defesa aérea franceses reflete as sólidas relações bilaterais entre as Comores e a França. Isso demonstra o compromisso da França em apoiar as necessidades de defesa das Comores e reforça os laços entre as duas nações. Os sistemas de defesa aérea franceses são conhecidos por sua confiabilidade, eficácia e tecnologia avançada, tornando-os uma escolha ideal para as Comores fortalecerem suas capacidades de defesa."
 COM_buy_missile_defences_rus: "Compra de Defesa Aérea Russa"
 COM_buy_missile_defences_rus_desc: "Ao se associar com a Rússia, as Comores visam se beneficiar da experiência e da expertise de uma renomada indústria de defesa. A Rússia possui uma longa reputação no desenvolvimento de sistemas robustos de defesa aérea e os implantou com sucesso em várias regiões do mundo. Essa colaboração não apenas fornecerá tecnologia de ponta para as Comores, mas também facilitará a transferência de conhecimento e oportunidades de treinamento para garantir a utilização eficaz dos sistemas adquiridos."
 COM_tighter_chi_cooperation: "Cooperação Mais Estreita com a China"
 COM_tighter_chi_cooperation_desc: "Aprofundar a cooperação com a China é crucial para as Comores. A parceria econômica e política com o dragão do leste certamente impedirá que a influência ocidental interfira em nossa política!"
 COM_befriend_the_east: "Fazer Amizade com o Oriente"
 COM_befriend_the_east_desc: "As Comores devem concentrar todo o seu poder político em melhorar as relações com a China, a Rússia e outros países orientais."
 anjouan_rebellion: "Rebelião de Anjouan!"
 COM_trade_deals_with_india: "Acordos Comerciais com a Índia"
 COM_trade_deals_with_india_desc: "A Índia é um dos maiores parceiros econômicos e importadores de nossos produtos. Precisamos fortalecer a cooperação mútua para garantir a prosperidade econômica."
 COM_trade_deals_with_singapore: "Comércio com Singapura"
 COM_trade_deals_with_singapore_desc: "Singapura é um dos maiores parceiros econômicos e importadores de nossos produtos. Precisamos fortalecer a cooperação mútua para garantir a prosperidade econômica."
 COM_ministry_of_economy: "Ministério da Economia"
 COM_ministry_of_economy_desc: "O Ministério da Economia deve revitalizar nossa base tecnológica e introduzir novos métodos de produção para que as Comores aumentem seu progresso industrial."
 COM_trading_with_west: "Cooperação com a França"
 COM_trading_with_west_desc: "A intensificação da cooperação com a França é importante para a economia comoriana, visto que os investidores franceses estão quase prontos para começar a investir em nós..."
 COM_french_investments: "Investimentos Franceses"
 COM_french_investments_desc: "Agora, depois de aumentarmos as relações com os franceses, chegou a hora de pedir investimentos."
 COM_russian_investments: "Investimentos Russos"
 COM_russian_investments_desc: "Agora, depois de aumentarmos as relações com os russos, chegou a hora de pedir investimentos."
 COM_trading_with_east: "Buscar Dinheiro Russo"
 COM_trading_with_east_desc: "Increasing cooperation with Russia is important for the Comorian economy, as the Russian investors are perhaps almost ready to start investing in us..."
 COM_military_coop_easaf: "Cooperação Militar da EAU"
 COM_military_coop_easaf_desc: "A União da África Oriental (EAU) conduzindo exercícios militares pode servir como um elemento crucial no fortalecimento da segurança regional, fomentando a cooperação entre estados-membros e aprimorando as capacidades de defesa coletiva da região da África Oriental. Esses exercícios fornecem uma oportunidade para treinamento conjunto, compartilhamento de informações e coordenação entre forças militares, contribuindo, em última análise, para a estabilidade regional e esforços de manutenção da paz."
 COM_army: "Exército do Desenvolvimento Nacional"
 COM_army_desc: "As Forças Armadas Comorianas, oficialmente conhecidas como Exército de Desenvolvimento Nacional, são uma força pequena, porém profissional. Além do exército, há uma força policial com 500 membros e uma força de defesa também com 500 membros, ambas responsáveis ​​por salvaguardar as fronteiras do país e manter a integridade territorial do arquipélago."
 COM_mission_from_unrec: "A Missão da UNREC"
 COM_mission_from_unrec_desc: "O Centro Regional das Nações Unidas para a Paz e o Desarmamento (UNREC) dedica-se a prevenir a proliferação de armas nucleares e a promover o desarmamento entre as nações envolvidas em conflitos africanos. Ao cooperarmos com o UNREC, podemos dar passos rumo ao desarmamento das nossas forças armadas e demonstrar o nosso compromisso com um futuro pacífico e seguro para o continente africano."
 COM_african_mercenaries: "Mercenários Africanos"
 COM_african_mercenaries_desc: "O continente africano abriga inúmeros combatentes experientes, muitos dos quais adquiriram valiosa experiência nos diversos conflitos da região. Ao recrutar esses mercenários qualificados, podemos aprimorar a organização e a eficácia de nossas forças armadas, garantindo que estejam mais bem preparadas para os desafios da guerra moderna."
 COM_modernize_the_army: "Modernizar as Forças de Segurança das Comores"
 COM_modernize_the_army_desc: "As Forças de Segurança Comorianas (CSF) precisam urgentemente de modernização se quisermos ser considerados uma nação que inspira respeito."
 COM_expand_the_police_force: "Militarizar a Força Policial"
 COM_expand_the_police_force_desc: "Nossa força policial tem tamanho semelhante ao do exército, e dada a instabilidade de nosso passado recente, às vezes é difícil distinguir a diferença. Poderíamos habilitá-los a desempenhar adequadamente papéis duplos."
 COM_naval_treaty_with_france: "Tratado de Defesa Franco-Comoriano"
 COM_naval_treaty_with_france_desc: "Given our shared history, French interference in Comorian affairs is a common sight. The naval defense treaty allows France military access to our waters, but may be our only choice if we ever want to become a true naval power ourselves."
 COM_naval_treaty_with_china: "Tratado de Defesa Chino-Comoriano"
 COM_naval_treaty_with_china_desc: "Given our shared history, French interference in Comorian affairs is a common sight. We must fight against their influence over us by inviting other foreign powers into our local affairs."
 COM_modernize_the_patrol_boats: "Modernizar os Barcos de Patrulha"
 COM_modernize_the_patrol_boats_desc: "Nossa atual 'Marinha Comoriana' consiste em impressionantes 2 barcos de patrulha japoneses... comissionados em 1981! É desnecessário dizer que eles precisam urgentemente de uma atualização!"
 COM_buy_patrol_boats: "Quantidade em Vez de Qualidade"
 COM_buy_patrol_boats_desc: "Nossa 'Marinha' não pode se afastar de nossas costas a mais do que alguns quilômetros. Se quisermos projetar poder no exterior, devemos ter algumas corvetas em nossa frota."
 COM_expand_the_dockyards: "Expandir os Estaleiros"
 COM_expand_the_dockyards_desc: "Mais estaleiros significam mais navios, e nossa marinha precisa desesperadamente de mais navios."
 COM_fortress_comoros: "Fortaleza Comores"
 COM_fortress_comoros_desc: "Nossas forças armadas, limitadas e de pequena escala, não podem garantir e assegurar nossa segurança de forma permanente. Devemos construir uma série de fortificações estratégicas ao longo de nossas costas e encostas voltadas para o mar, a fim de dissuadir invasões navais inimigas."
 COM_air_force: "Estabelecer uma Força Aérea Comoriana"
 COM_air_force_desc: "Há apenas alguns comorianos habilidosos o suficiente para pilotar uma aeronave, muito menos um caça a jato! No entanto, se quisermos conquistar os céus, precisaremos de uma Força Aérea."
 COM_new_aircraft_purchases: "Novas Compras de Aeronaves"
 COM_new_aircraft_purchases_desc: "Our current planes are horribly obsolete. Let's purchase the blueprints for models that are actually relevant in the new millennium.\n\nNow word goes around that the Swedes are bribing countries to buy their JAS Gripen. We should get our hands on a few of those."
 COM_introduce_democracy: "Introduzir a Democracia"
 COM_introduce_democracy_desc: "A multiplicidade de golpes nas últimas décadas nos ensinou que ditaduras não são muito estáveis. Vamos introduzir a verdadeira democracia e permitir que o povo chegue ao poder."
 COM_befriend_the_west: "Fazer Amizade com o Ocidente"
 COM_befriend_the_west_desc: "The Western Powers are always on the lookout for tales of successful transitions to democracy in Africa. They'll be sure to back us with anything we need."
 COM_tighter_edf_cooperation: "Cooperação Mais Estreita com o EDF"
 COM_tighter_edf_cooperation_desc: "Como membro do Fundo Europeu de Desenvolvimento (EDF), temos direito à ajuda da União Europeia no desenvolvimento de nosso país. Não vamos deixar passar essa oportunidade - vamos abrir para uma cooperação muito mais próxima!"
 COM_maintain_dictatorship: "Manter uma Ditadura Militar"
 COM_maintain_dictatorship_desc: "Muitos anos de instabilidade nos ensinaram que as Comores precisam de um líder forte no poder, guiando o país com mão firme, mas gentil."
 COM_draw_closer_to_the_au: "Aproximar-se da União Africana"
 COM_draw_closer_to_the_au_desc: "Ditaduras militares são comuns na África e a União Africana pode não nos ver como monstros por rejeitar as tendências democráticas. Hora de descobrir quem são nossos amigos."
 COM_ohada: "OHADA"
 COM_ohada_desc: "A Organização para a Harmonização do Direito dos Negócios na África (OHADA) foi fundada em Maurício em 1993 com o objetivo de permitir mais oportunidades de investimento empresarial na África. Como único membro do leste africano, temos uma posição única e muito a ganhar."
 COM_form_tanzancom: "Formar a TanZanCom"
 COM_form_tanzancom_desc: "A união política entre Tanganica e Zanzibar não tem sido perfeita. No entanto, os sonhos de Nyerere são mais fortes do que nunca! Devemos buscar a adesão à união.\nPara facilitar o nome, a Tanzânia quer manter seu nome como está."
 COM_influence_of_islam: "A Influência do Islã"
 COM_influence_of_islam_desc: "As Comores são uma nação profundamente islâmica - até mesmo representada em nossa bandeira. O que quer que as Comores sejam ou não, sempre será, em primeiro lugar, islâmico."
 COM_closer_ties_with_arab_league: "Laços Mais Estreitos com a Liga Árabe"
 COM_closer_ties_with_arab_league_desc: "Fazemos parte da Liga Árabe, mas somos de longe o membro mais ao sul da organização e geograficamente isolado. Devemos tomar medidas para garantir que fechemos a distância diplomaticamente, já que não podemos fazer isso geograficamente."
 COM_seek_help_from_the_saudis: "Buscar Ajuda dos Sauditas"
 COM_seek_help_from_the_saudis_desc: "A Arábia Saudita é a mais antiga e maior influência no mundo islâmico e certamente ajudará seus irmãos sunitas das Comores se forem solicitados."
 COM_befriend_baath: "Abordar o Baathismo"
 COM_befriend_baath_desc: "Uma abordagem pan-árabe mais secular é mais adequada para as Comores. Precisamos estreitar laços com a Síria e o Iraque para promover o baathismo em nosso país."
 COM_ayatollah_sambi: "Ambições do Aiatolá Sambi"
 COM_ayatollah_sambi_desc: "Ahmed Abdallah Mohamed Sambi, popularmente conhecido como 'Aiatolá', é um líder islâmico proeminente nas Comores. Ele é muito popular e até mesmo um concorrente ao poder político no país. Seu conhecimento nos princípios do Islã pode ser inestimável."
 COM_declare_islamic_republic: "Declarar uma República Árabe"
 COM_declare_islamic_republic_desc: "Agora, o Aiatolá Sambi está em posição de convocar o estabelecimento de uma verdadeira República Árabe das Comores. Vamos transformar esta antiga colônia em uma joia do mundo islâmico!"
 COM_ghost_of_colonialism: "O Fantasma do Colonialismo"
 COM_ghost_of_colonialism_desc: "Mesmo que sejamos independentes, o fantasma dos colonizadores franceses paira sobre nossa pequena nação insular, e com a contínua ocupação francesa de Mayotte, é improvável que vá embora tão cedo. Como devemos lidar com nossa antiga metrópole, a França?"
 COM_embrace_francafrique: "Abraçar a Françafrique"
 COM_embrace_francafrique_desc: "'Françafrique' é um termo usado para a influência da França sobre suas antigas possessões coloniais na África. Não o consideramos pejorativo - na verdade, o recebemos e abraçamos. A França contribuiu enormemente para o nosso desenvolvimento e somos gratos por essa contribuição."
 COM_intensify_coi_engagement: "Intensificar o Envolvimento na COI"
 COM_intensify_coi_engagement_desc: "A Comissão do Oceano Índico (COI) é composta por cinco nações africanas do Oceano Índico - Comores, Madagascar, Maurícia, Reunião (uma região ultramarina da França) e Seychelles. Trabalhar com a COI é a melhor maneira de provarmos que somos um ativo valioso para os franceses."
 COM_rejoin_france: "Um Departamento Ultramarino da França"
 COM_rejoin_france_desc: "Recebemos informações de que os franceses estão considerando ativamente nos deixar voltar a ser um território ultramarino deles. As Comores têm visto mais do que sua parcela de instabilidade desde sua independência e a população agora anseia pelos anos estáveis do domínio francês."
 COM_antagonize_france: "Distância da França"
 COM_antagonize_france_desc: "Devemos procurar nos distanciar de nossos antigos senhores coloniais e começar a buscar uma política externa mais independente, considerando a possibilidade de reunificar nosso arquipélago."
 COM_demand_mayotte: "Exija Mayotte da França"
 COM_demand_mayotte_desc: "Nosso ódio pelos tiranos franceses chegou a um ponto em que há pedidos ativos de guerra entre nossa população. Embora possamos estar em menor número, nossa determinação é forte e a justiça está do nosso lado. Se Deus quiser, prevaleceremos!"
 COM_expand_moroni: "Expandir Moroni"
 COM_expand_moroni_desc: "Moroni is our capital on Grande Comore Island. It's an obvious first choice for any industrial expansion."
 COM_kickstart_economy: "Impulsionar a Economia"
 COM_kickstart_economy_desc: "A economia das Comores está entre as piores do mundo e nosso povo está desesperado por melhorias. Não podemos ficar esperando por investidores estrangeiros ou ajuda estrangeira - é hora de lidar diretamente com a economia."
 COM_vanilla_exports: "Exportações de Baunilha"
 COM_vanilla_exports_desc: "A baunilha é uma de nossas principais exportações e um produto usado quase universalmente. Vamos aumentar a produção e colher os benefícios."
 COM_ylang_ylang: "Ylang-ylang"
 COM_ylang_ylang_desc: "The tropical tree cananga odorata has flowers from which can be extracted an essential oil called ylang-ylang. This oil has numerous claimed benefits and seems to be all the rage in the West and East. Even better, it only grows in very few places on Earth - including the Comoros."
 COM_expand_on_anjouan: "Expandir em Anjouan"
 COM_expand_on_anjouan_desc: "É importante espalhar expansões industriais por todas as ilhas e, uma vez que Anjouan é a segunda maior ilha das Comores, devemos olhar para ela em seguida."
 COM_expand_on_moheli: "Expandir em Moheli"
 COM_expand_on_moheli_desc: "Moheli é a menor das Ilhas Comores, mas ainda grande o suficiente para que faça sentido cultivar um setor industrial na ilha."
 COM_a_federal_union: "Uma União Federal"
 COM_a_federal_union_desc: "O referendo foi um sucesso e agora somos a União das Comores - uma federação de ilhas que têm um grande grau de autonomia."
 COM_Loi_des_competences: "Lei das Competências"
 COM_Loi_des_competences_desc: "Uma Lei das Competências será elaborada para descrever claramente quais partes do governo são tratadas pelo governo federal e quais partes são deixadas para o governo autônomo das ilhas."
 COM_operation_democracy_in_comoros: "Operação Democracia nas Comores"
 COM_operation_democracy_in_comoros_desc: "A 'Operação Democracia nas Comores', com um nome não muito sutil, foi uma invasão da ilha de Anjouan em 2008, com o objetivo de remover o senhor da guerra local, o Coronel Mohamed Bacar, do poder. Estamos apoiados pela União Africana e nosso mandato é claro - Bacar deve sair e seu governo rebelde deve ser substituído!"
 COM_centralize_power: "Centralizar o Poder"
 COM_centralize_power_desc: "Com as instabilidades recentes em mente, decidimos ignorar completamente o referendo. Todas as incessantes lutas nas ilhas só vão parar quando todos se curvarem a um poder central!"
 COM_claim_banc_du_geyser: "Reivindicar o Banc du Geyser"
 COM_claim_banc_du_geyser_desc: "The Banc du Geyser is a submerged reef east of the Comoros. Both France and Madagascar have claimed it as their exclusive economic zone due to the possible oil deposits, and we'll follow suit!"
 COM_claim_the_glorioso_islands: "Reivindicar as Ilhas Gloriosas"
 COM_claim_the_glorioso_islands_desc: "As Ilhas Gloriosas são um grupo de pequenas ilhas próximas ao Banc du Geyser. Embora sejam legalmente francesas, as reivindicaremos como comorianas, mesmo que seja apenas para angariar algum apoio entre a população."
 COM_no_more_coups: "Nenhum Mais Golpes!"
 COM_no_more_coups_desc: "Agora consolidamos nosso poder o suficiente para termos contingências em caso de possíveis futuras tentativas de golpe."
 COM_a_common_destiny: "Um Destino Comum"
 COM_a_common_destiny_desc: "We've reached the end of an arduous journey, but have finally achieved some measure of stability in the Comoros. Where we will go from here we don't know, but we will fight for the Constitution and 'la poursuite d'un destin commun entre les Comoriens' - the pursuit of a common destiny for the Comorians."
 COM_convention_renewal_party: "Convenção para a Renovação das Comores"
 COM_convention_renewal_party_desc: "The Convention for the Renewal of the Comoros (CRC) is a political party in the Comoros Islands. Founded in 2002 by a group of politicians and intellectuals, the CRC aims to bring renewed hope and stability to the country's political scene. The party's platform is centered around promoting economic growth, reducing poverty, and improving healthcare and education."
 COM_subsidies_for_education: "Subsidies for Education"
 COM_subsidies_for_education_desc: "Precisamos subsidiar a educação, pois uma população bem educada e saudável forma a espinha dorsal de uma sociedade próspera!"
 COM_stabilizing_society: "Estabilizando a Sociedade"
 COM_stabilizing_society_desc: "Estabilizar a sociedade nas Comores requer um compromisso de longo prazo de todas as partes interessadas, com foco na abordagem das causas fundamentais da instabilidade e na promoção do desenvolvimento inclusivo."
 COM_assembly_of_union: "Assembleia da União"
 COM_assembly_of_union_desc: "Precisamos reunir o sindicato para priorizar nossos objetivos e reformar nosso plano de desenvolvimento."
 COM_purging_dissidents: "Esmagar os Sonhos da Oposição"
 COM_purging_dissidents_desc: "Precisamos iniciar uma campanha contra os pretendentes que desejam alterar nossas decisões de política externa. Nosso caminho não deve ser abalado!"
 COM_social_agenda: "Agenda Social"
 COM_social_agenda_desc: "Priorizar a agenda social ajuda a melhorar o desenvolvimento humano dentro do país. Ao focar em questões sociais como educação, saúde e redução da pobreza, Comores pode garantir que seus cidadãos tenham acesso aos recursos e oportunidades necessários para levar vidas gratificantes. Isso, por sua vez, pode contribuir para o bem-estar geral e a qualidade de vida da população."
 COM_foreign_jihadists: "Jihadistas Estrangeiros"
 COM_foreign_jihadists_desc: "Ao declararmos Gazavat, os Mujahideen de todo o mundo virão ao nosso país para lutar pela causa justa!"
 COM_dd_TT: "§YPodemos receber assistência militar e política dos nossos parceiros Ba'ath do mundo árabe!§!"
 COM_led_new_TT: "§YO aiatolá Sambi será o próximo líder das Comores, visando garantir uma maior cooperação entre as ilhas!§!"
 COM_militarism_baath: "Militarismo do Ba'ath PMC"
 COM_militarism_baath_desc: "Vamos criar um novo país a partir das Comores. Agora, ele será controlado ainda mais pelo nosso exército, e o nosso país estabelecerá sua própria PMC."
 COM_nationalization_of_capital: "Nacionalização do capital"
 COM_nationalization_of_capital_desc: "Esses investimentos geram receita para os opressores ocidentais, enquanto nosso povo mal pode ganhar um centavo! Vamos expulsá-los de nossa terra e torná-la para nosso povo."
 COM_our_will_to_expand: "Nossa Vontade de Expandir"
 COM_our_will_to_expand_desc: "Nossa nova base ideológica da sociedade é uma clara manifestação de nossa vontade de expandir nosso país. Nada deve ficar em nosso caminho, e devemos garantir isso!"
 COM_orange_party: "Partido Laranja"
 COM_orange_party_desc: "O partido político Laranja é um grande ator no cenário político das Comores. Rapidamente ganhou popularidade entre os jovens e a população urbana devido aos seus valores progressistas e liberais. A declaração de princípios e valores do partido enfatiza ideais democráticos, a promoção dos direitos humanos e o desenvolvimento econômico. O partido apresentou candidatos para as eleições presidenciais e parlamentares."
 COM_radical_stance_on_trafficking: "Posição Radical sobre Tráfico"
 COM_radical_stance_on_trafficking_desc: "Mohamed Daoudou afirmou que o Governo das Comores intensificará as ações destinadas a prevenir, reprimir e punir o tráfico de pessoas. Isso incluirá o relançamento do Groupe de Travail, uma unidade estabelecida pelo Governo para combater o tráfico de pessoas, bem como a conscientização sobre o tráfico de pessoas entre os parceiros-chave e a revitalização da cooperação com o UNODC."
 COM_efficient_governmental_apparatus: "Aparelho Governamental Eficiente"
 COM_efficient_governmental_apparatus_desc: "Um dos principais focos da agenda de reformas do Presidente Daoudou é o aprimoramento da transparência e responsabilidade no governo. Medidas foram implementadas para fortalecer os mecanismos de supervisão financeira, combater a corrupção e promover a conduta ética entre os funcionários públicos. Essas iniciativas buscam promover uma cultura de integridade e garantir que os recursos públicos sejam utilizados de forma eficaz para o benefício de todos os cidadãos."
 COM_meritocracy: "Meritocracia de Daoudou"
 COM_meritocracy_desc: "Apenas os melhores dos melhores devem estar no governo das Comores, independentemente do que as pessoas possam dizer. Nossa prioridade é a eficiência, não o apaziguamento!"
 COM_push_it_to_the_limit: "Levar ao Limite"
 COM_push_it_to_the_limit_desc: "Reconhecendo a necessidade de diversificação, a agenda de reformas do Presidente Daoudou coloca forte ênfase na expansão da base econômica do país. As Comores tradicionalmente dependem de setores como agricultura e pesca, mas o Presidente está promovendo ativamente setores como turismo, energia renovável e tecnologia da informação. Esses esforços visam alavancar a beleza natural única do país e seu patrimônio cultural, bem como explorar seu potencial não explorado em setores emergentes."
 COM_balancing: "Priderzhy Konej"
 COM_balancing_desc: "Mohamed Daoudou deve implementar reformas que priorizem o crescimento econômico sustentável em detrimento de explosões comerciais de curto prazo. Ao adotar uma abordagem prudente para a diversificação, desenvolvimento de infraestrutura, investimento em capital humano e parcerias internacionais, o Presidente Daoudou deve visar a construção de uma economia resiliente que evite os riscos de uma bolha econômica e garanta prosperidade a longo prazo para o povo das Comores."
 COM_daudouism: "Daoudouism"
 COM_daudouism_desc: "Em última análise, o sucesso da ideologia do Presidente Daoudou dependerá da capacidade de conciliar meritocracia e crescimento econômico com os princípios da democracia e das liberdades individuais. Ao abraçar uma abordagem abrangente que considere as dimensões econômicas, sociais e políticas da governança, as Comores podem buscar tanto a prosperidade quanto o progresso democrático."
 COM_state_run_capitalism: "Capitalismo Controlado pelo Estado"
 COM_state_run_capitalism_desc: "A visão do presidente Daoudou para uma economia capitalista estatal visa atingir um equilíbrio entre a iniciativa privada e a intervenção governamental. O envolvimento ativo do governo na economia é voltado para a promoção de setores estratégicos, direcionando investimentos e garantindo a distribuição equitativa de recursos e oportunidades. Esta abordagem visa promover um ambiente econômico justo e inclusivo que beneficie todos os cidadãos comorianos."
 COM_absolute_employment: "Emprego Absoluto"
 COM_absolute_employment_desc: "Reconhecendo que o desemprego representa desafios significativos para os indivíduos e o bem-estar geral da sociedade, a visão do Presidente Daoudou gira em torno da implementação de políticas e estratégias para garantir que todo indivíduo que busca emprego tenha acesso a trabalho adequado e digno. Essa abordagem visa liberar o potencial da força de trabalho, contribuir para a redução da pobreza e aprimorar o desenvolvimento socioeconômico geral das Comores."
 COM_inclusive_government: "Inclusão de Minorias"
 COM_inclusive_government_desc: "A administração do presidente Daoudou tomou medidas concretas para abordar desigualdades históricas e promover a inclusão de minorias na economia. Esforços foram feitos para fornecer suporte e recursos direcionados a empresas e empreendedores de propriedade de minorias, facilitando seu acesso a financiamento, treinamento e oportunidades de mercado. Ao nutrir o empreendedorismo dentro de comunidades minoritárias, o governo visa criar um cenário econômico mais inclusivo e diverso que beneficie todos os cidadãos."
 COM_minority_inclusive_idea: "Inclusão de Minorias"
 COM_eau_military_coop_idea: "Cooperação Militar da EAU"
 COM_anjouan_idea: "Rebelião de Anjou"
 COM_anjouan_idea_desc: "A ilha de Anjouan declarou revolta aberta contra o governo [COM.GetAdjective]. Anjouan é a segunda maior ilha do [COM.GetName] e representa uma parte significativa do país. Seus habitantes citaram abertamente a falta de representação adequada, eleições justas e livres e autonomia como razões para a resistência. Se não agirmos rapidamente, é possível que se separem completamente do país."
 COM_poor_military_idea: "Militares corruptos"
 COM_poor_military_idea_desc: "As forças armadas operam mais como um grupo de poderosos com interesses próprios do que como um exército profissional. Sua lealdade está atrelada a pagamentos governamentais e à manutenção da ordem, mas esse apoio é sempre condicional. Com o tempo, cada governo corre o risco de perder seu apoio, ameaçando a estabilidade da nação."
 COM_big_problems_idea: "Governo ineficiente"
 COM_big_problems_idea_desc: "Nosso governo está assolado por departamentos e agências draconianos, disfuncionais ou completamente inoperantes. Concentrar-se na eliminação e correção das deficiências do governo deve ser uma de nossas principais prioridades daqui para frente."
 COM_minority_inclusive_idea_desc: "Apesar de ser uma nação pequena, [COM.GetName] está longe de ser homogênea e é composta por diversos grupos étnicos e pessoas de todas as classes sociais. É importante que as minorias sejam incluídas na governança de nossa nação, caso contrário, a nação sofrerá."
 COM_eau_military_coop_idea_desc: ""
 COM_dictators_idea: "Ditadores mesquinhos"
 COM_dictators_idea_desc: "Comores vivenciou muitos golpes de Estado, bem-sucedidos e malsucedidos, nas últimas décadas. Governadores tentam usurpar o poder para si mesmos em detrimento do governo central."
 COM_pro_farmers_idea: "Pró-Agricultores"
 COM_pro_farmers_idea_desc: "Embora as Comores sejam um país pequeno, com terra limitada e grande peso da agricultura, devemos priorizar os agricultores, pescadores e demais trabalhadores do campo."
 COM_agricultural_developments_idea: "Desenvolvimento Agrícola"
 COM_agricultural_developments_idea_desc: "Focar no desenvolvimento de nossas indústrias agrícolas nos ajudará a nos recuperar economicamente da instabilidade que se arrasta desde a nossa independência e nos permitirá crescer utilizando nossos maiores recursos naturais."
 COM_small_ship_project: "Projeto de navio pequeno"
 COM_small_ship_project_desc: "Por muito tempo, nossa presença naval foi inadequada. Trabalhando em estreita colaboração com estaleiros e construtores navais locais, podemos lançar uma frota modesta de navios para fortalecer nossa defesa costeira e afirmar nossa influência nas águas próximas."
 COM_volcano_idea: "Perda Agrícola por Cinzas Vulcânicas"
 COM_volcano_idea_desc: "A erupção do monte Karthala cobriu vastas áreas com cinzas vulcânicas, causando graves danos às lavouras. A recuperação das terras agrícolas levará tempo, e a produtividade agrícola permanecerá reduzida num futuro próximo."
 COM_typhoon_idea: "Recuperação dos Danos do Ciclone"
 COM_typhoon_idea_desc: "A recuperação do impacto devastador do ciclone Kenneth continua, com a agricultura e a infraestrutura levando tempo para ser restauradas."
 COM_total_ban_on_personal_weapons_idea: "Proibição Total de Armas Pessoais"
 COM_total_ban_on_personal_weapons_idea_desc: "Armas de defesa pessoal foram comuns nas Comores nas últimas décadas, mas não precisamos mais delas. Devemos desarmar nossos cidadãos e impor uma proibição total de armas pessoais. Isso ajudará a estabilizar nossa sociedade e a reduzir o risco de violência de agora em diante."
 COM_naval_treaty_with_france_idea: "Tratado Naval de Defesa Franco-Comorense"
 COM_naval_treaty_with_france_idea_desc: "As negociações com os franceses foram frutíferas. Estabelecemos um tratado de defesa naval com [FRA.GetName]. Ao custo de parte do nosso desenvolvimento local de embarcações navais, em troca de um grande acordo de defesa e de um pacote de estímulo econômico."
 COM_naval_treaty_with_china_idea: "Tratado Naval de Defesa Sino-Comorense"
 COM_naval_treaty_with_china_idea_desc: "As negociações com os chineses foram frutíferas. Estabelecemos um tratado de defesa naval com [CHI.GetName]. Ao custo de parte do nosso desenvolvimento local de embarcações navais, em troca de um grande acordo de defesa e de um pacote de estímulo econômico."
 COM_the_comoros_tourism_industry: "A Indústria do Turismo"
 COM_the_comoros_tourism_industry_desc: "A indústria do turismo [COM.GetAdjective] nas Comores é uma parte importante e essencial do país, que gera crescimento econômico e dinheiro para os negócios locais nas muitas ilhas do arquipélago."
 COM_small_ship_project_idea: "Projetos de Navios Pequenos [COM.GetAdjective]"
 COM_small_ship_project_idea_desc: "Por meio da colaboração com estaleiros locais e parceiros internacionais, lançamos com sucesso um programa para construir embarcações navais modestas. Esses navios reforçam nossa capacidade de defesa costeira e ampliam nossa presença marítima na região."
 COM_the_east_africa_entrepot_idea: "O Entreposto da África Oriental"
 COM_the_east_africa_entrepot_idea_desc: "Por meio do desenvolvimento estratégico de portos e de parcerias econômicas abrangentes, as Comores se firmaram como um polo comercial vital ao longo da costa da África Oriental. Nossa localização estratégica facilita o comércio entre a África, o Oriente Médio e a Ásia, trazendo prosperidade às nossas ilhas."
 COM_militarized_police_force_idea: "Força Policial Militarizada"
 COM_militarized_police_force_idea_desc: "Dado o histórico recente de instabilidade e golpes, nossa polícia foi reorganizada e equipada para lidar tanto com distúrbios civis quanto com ameaças militares. Embora a linha entre polícia e exército tenha se tornado tênue, essa capacidade dupla garante que possamos manter a ordem sejam quais forem os desafios."
 COM_comorosian_private_military_companies: "Empresas Militares Privadas [COM.GetAdjective]"
 COM_comorosian_private_military_companies_desc: "As Comores se tornaram sede de várias empresas militares privadas que atuam no país e no exterior. Essas EMPs oferecem serviços de segurança, treinamento militar e operações de apoio por toda a região, gerando receita e consolidando nossa nação como centro de especialização militar privada."
 COM_unstable_government_idea: "Governo Instável"
 COM_unstable_government_idea_desc: "Os acontecimentos recentes e a instabilidade no governo o tornaram extremamente instável, impedindo que as Comores sejam estáveis e visionárias. É importante começarmos a estabilizar o governo, ou ele continuará em constante turbulência."
 COM_mayotte_referendum_decisions: "O Referendo de Mayotte"
 COM_mayotte_referendum_decisions_desc: "A ilha de Mayotte é uma das muitas ilhas do Arquipélago das Comores. O povo de Mayotte está decidindo se quer continuar na República Francesa, juntar-se às Comores ou tornar-se independente. Podemos apoiar o movimento francês para manter Mayotte na França, apoiar o movimento comorense ou apoiar o movimento de independência.\n\nA estimativa atual de votos é a seguinte:\n\n- França: [?COM.mayotte_referendum_france|Y]% dos votos\n- Comores: [?COM.mayotte_referendum_comoros|Y]% dos votos\n- Independência: [?COM.mayotte_referendum_independence|Y]% dos votos"
 COM_mayotte_referendum_mission: "O Referendo sobre o Status de Mayotte"
 COM_mayotte_referendum_mission_desc: "O referendo está prestes a acontecer. Temos pouco tempo para nos preparar antes que seja tarde demais."
 COM_mayotte_french_support_campaign_decision: "[FRA.GetFlag] Campanha de Apoio [FRA.GetAdjective]"
 COM_mayotte_french_support_campaign_decision_desc: "Mayotte sempre foi parte integrante dos nossos Territórios [FRA.GetAdjective] do Oceano Índico. Devemos apoiar os partidários franceses na região para garantir que seu lado vença o referendo."
 COM_mayotte_independence_support_campaign_decision: "[MTE.GetFlag] Campanha de Apoio à Independência [MTE.GetAdjective]"
 COM_mayotte_independence_support_campaign_decision_desc: "O povo de Mayotte anseia por independência há muito tempo. Devemos procurar os líderes do movimento independentista e avaliar a possibilidade de ampliar os direitos do povo de Mayotte."
 COM_mayotte_comorian_support_campaign_decision: "[COM.GetFlag] Campanha de Apoio [COM.GetAdjective]"
 COM_mayotte_comorian_support_campaign_decision_desc: "Mayotte faz parte do Arquipélago das Comores e, como tal, deve ser una com a nossa grande federação. É imperativo continuar apoiando nossos irmãos e irmãs na região e garantir que sua posição seja ouvida."
 COM_the_constitutional_referendum_decisions: "O Referendo Constitucional"
 COM_the_constitutional_referendum_decisions_desc: "Nos últimos anos, as Comores vêm enfrentando diversas instabilidades políticas e golpes. A constituição do país precisa agora ser revista para garantir a estabilidade. Podemos apoiar o movimento federalista ou o centralista, mas de qualquer forma devemos tomar partido no próximo referendo.\n\nApoio Federalista: [?COM_federalist_constitutional_support|Y%0]\nApoio Centralista: [?COM_anti_federalist_constitutional_support|Y%0]"
 COM_the_constitutional_referendum_mission: "O Referendo"
 COM_the_constitutional_referendum_mission_desc: "O referendo se aproxima no horizonte e devemos tomar partido nele. Só o tempo dirá qual será o resultado para o futuro das Comores."
 comoros.1.t: "Questão de Lealdade"
 comoros.1.d: "Embora Síria e Iraque se declarem os representantes ideais da ideologia baathista, em geral não se entendem. Ambos exigem lealdade de nós. De que lado estamos?"
 comoros.1.a: "Hafez é o mais sábio!"
 comoros.1.b: "Saddam conhece o caminho!"
 comoros.1.c: "Quem sabe devêssemos tentar reconciliá-los?"
 comoros.4.t: "O Referendo Constitucional"
 comoros.4.d: "Após o recente golpe que tirou Tadjidine Ben Said Massounde do poder, a estrutura do nosso governo continua indefinida. O presidente Azali Assoumani passou o último ano estabilizando o país, e agora chegou a hora de realizar um referendo constitucional. O povo decidirá que forma de governo as Comores devem adotar, embora possamos certamente influenciar a opinião pública. Que caminho devemos incentivar?"
 comoros.4.a: "Um Estado Federal é o correto."
 comoros.4.b: "Um Estado centralista é o correto."
 comoros.5.t: "As Comores reivindicam o Banc du Geyser!"
 comoros.5.d: "Recentemente, o governo das Comores reivindicou o Banc du Geyser e controla os campos de petróleo existentes naquela região."
 comoros.5.a: "A França os fará se arrepender dessa decisão!"
 comoros.5.b: "Como ousam reivindicar águas malgaxes!"
 comoros.6.t: "As Comores reivindicam as Ilhas Glorioso"
 comoros.6.d: "As Comores declararam recentemente que agora consideram as Ilhas Glorioso parte de seu território."
 comoros.6.a: "Seus devaneios mesquinhos não nos incomodam."
 comoros.7.t: "Base Naval nas Comores"
 comoros.7.d: "O governo [COM.GetAdjective] ofereceu nos permitir estabelecer uma base naval formal em Grande Comore. Estabelecer bases navais adicionais na região nos permitirá ampliar nossa influência e proteger nossos interesses estratégicos na África Oriental. Aceitamos os termos [COM.GetAdjective]?"
 comoros.7.a: "Ótimo!"
 comoros.7.b: "Na verdade..."
 comoros.8.t: "Operação Democracia nas Comores"
 comoros.8.d: "Estamos prontos para conduzir nossa operação militar e invadir a ilha controlada por um senhor da guerra rebelde."
 comoros.8.a: "Vamos chamar nossos aliados justos!"
 comoros.9.t: "[COM.GetName] Pede Ajuda"
 comoros.9.d: "As Comores pedem nossa ajuda em seu esforço para conduzir uma operação especial contra um senhor da guerra rebelde em uma de suas ilhas!"
 comoros.9.a: "Claro"
 comoros.9.b: "Não nos importamos muito."
 comoros.10.t: "Operação Bem-Sucedida!"
 comoros.10.d: "Conduzimos a operação com sucesso. O governo do Senhor da Guerra foi derrubado!"
 comoros.10.a: "Ótimo"
 comoros.11.t: "Manifestações Anticolonialistas em Mayotte"
 comoros.11.d: "Protestos em massa eclodiram nas Comores denunciando o controle francês sobre Mayotte. O sentimento anticolonialista cresce por todo o arquipélago. Esperamos que o povo de Mayotte não tire ideias brilhantes dessa demonstração gratuita de agitação..."
 comoros.11.a: "Interessante..."
 comoros.12.t: "As Comores Exigem Mayotte!"
 comoros.12.d: "O povo de Mayotte tem direito de ser livre e o seu pequeno império colonialista não deve fazê-lo sofrer em nome da exploração! Libertem-nos, ou guerra!"
 comoros.12.a: "Garantir a estabilidade é a nossa maior prioridade."
 comoros.12.b: "Venham tentar, seus desgraçados."
 comoros.13.t: "O Território Ultramarino das Comores"
 comoros.13.d: "O governo das Comores nos procurou sobre a possibilidade de retornar à França como departamento ultramarino, para garantir estabilidade econômica e financeira e a promessa de proteção militar contra seus vizinhos caso algo aconteça."
 comoros.13.a: "Aprovar a adesão"
 comoros.13.b: "Recusar o pedido"
 comoros.14.t: "A França Aceita o Acordo"
 comoros.14.d: "A França decidiu permitir que nos tornemos um Território Ultramarino, e agora receberemos apoio financeiro e proteção militar, mantendo-nos nominalmente independentes, com autogoverno local."
 comoros.14.a: "Oba!"
 comoros.15.t: "Política nas Comores"
 comoros.15.d: "O ano 2000 foi um período turbulento para as Comores, uma pequena nação situada na costa da África. O país era governado por um governo de coalizão, formado por representantes das três ilhas principais: Grande Comore, Anjouan e Mohéli. No entanto, as tensões entre as ilhas eram altas, cada uma disputando mais poder e recursos. Isso levou a frequente instabilidade política e golpes, com políticos tentando tomar o controle do governo. Em abril de 1999, um golpe militar liderado pelo coronel Azali Assoumani derrubou o presidente Tadjidine Ben Said Massounde. Assoumani prometeu restaurar a estabilidade no país e realizar eleições livres e justas. Agora, só o tempo mostrará qual será o futuro das Comores."
 comoros.15.a: "Interessante"
 comoros.16.t: "As Comores Buscam Investimentos"
 comoros.16.d: "Embaixadores [COM.GetAdjective] nos procuraram com uma série de propostas de possíveis investimentos nas ilhas. Embora não sejam um grande parceiro comercial nem uma economia de peso, podemos fazer investimentos direcionados no país que, com sorte, trarão retornos bastante altos. As duas principais propostas que despertaram nosso interesse são as de subsídios industriais e de reestruturação da dívida. Qual devemos escolher? Bem, também podemos simplesmente ignorar o apelo."
 comoros.16.a: "Vamos investir na indústria deles!"
 comoros.16.b: "Vamos ajudá-los com a dívida."
 comoros.16.c: "Comores? Adeus."
 comoros.17.t: "[FROM.GetName] Aceitou o Plano Industrial"
 comoros.17.d: "Nossos embaixadores voltam trazendo boas notícias. [FROM.GetName] concordou em trabalhar em fábricas adicionais e infraestrutura industrial no país."
 comoros.17.a: "Excelente!"
 comoros.18.t: "[FROM.GetName] Aceitou a Reestruturação da Dívida"
 comoros.18.d: "[FROM.GetName] decidiu reestruturar parte da nossa dívida, comprando e perdoando uma parcela dela. Isso libera recursos adicionais e nos dá a possibilidade de gastar mais em outras coisas importantes dentro do país."
 comoros.18.a: "Bom"
 comoros.19.t: "[FROM.GetName]"
 comoros.19.d: "Os embaixadores que enviamos a [FROM.GetName] trouxeram más notícias. Eles não têm interesse em trabalhar conosco na reestruturação da dívida nem na expansão industrial."
 comoros.19.a: "Sério?"
 comoros.20.t: "Conspiração de Golpe Frustrada"
 comoros.20.d: "Fevereiro de 2003. As forças de segurança anunciaram que frustraram com sucesso uma conspiração de golpe contra o presidente Azali Assoumani. Vários soldados e ministros locais foram presos sob suspeita de planejar a derrubada do governo. Embora a ameaça imediata tenha sido contida, o incidente evidencia a instabilidade persistente em nossa jovem União."
 comoros.20.a: "Foi por pouco."
 comoros.21.t: "Erupção do Monte Karthala"
 comoros.21.d: "O monte Karthala, no sul de Grande Comore, entrou em erupção e cobriu uma ampla área, incluindo a capital Moroni, com cinzas vulcânicas. As cinzas contaminaram a água potável, danificaram gravemente as lavouras e forçaram milhares de pessoas a evacuar. O governo precisa agir rápido para ajudar as áreas afetadas."
 comoros.21.a: "Lançar a Resposta de Emergência."
 comoros.22.t: "O Monte Karthala Entra em Erupção Novamente"
 comoros.22.d: "O monte Karthala entrou em erupção pela segunda vez este ano. As cinzas cobriram as aldeias do sul e contaminaram as fontes de água, piorando o já precário abastecimento de água potável. Este segundo desastre em meio aos esforços de recuperação testa a capacidade de resposta do governo."
 comoros.22.a: "De novo não..."
 comoros.23.t: "Acidente da Yemenia Airways"
 comoros.23.d: "Durante a aproximação final ao Aeroporto Internacional de Moroni, o voo 626 da Yemenia Airways (Airbus A310) caiu no mar ao largo da costa das Comores. Dos 153 passageiros e tripulantes, apenas um sobreviveu. Muitas das vítimas eram membros da diáspora comorense que vive na França. Aumentaram as críticas às aeronaves e às práticas de manutenção da Yemenia Airways, provocando grandes protestos na França. Embora os protestos visem a companhia aérea e as autoridades francesas, o governo comorense agora tem o fardo de apoiar as famílias das vítimas e participar de discussões internacionais."
 comoros.23.a: "Lamentar as vítimas."
 comoros.24.t: "O Ciclone Kenneth Atinge o País"
 comoros.24.d: "O poderoso ciclone tropical \"Kenneth\" atingiu as Comores, causando danos devastadores. Pelo menos sete pessoas morreram, mais de 200 ficaram feridas e entre 60-80% das lavouras básicas foram destruídas. Dezenas de milhares foram desalojadas, enquanto a infraestrutura e o abastecimento de água potável sofreram graves danos. A recuperação exigirá recursos e tempo significativos."
 comoros.24.a: "Lançar o Socorro de Emergência"
 comoros.25.t: "Fuga em Massa da Prisão de Moroni"
 comoros.25.d: "Trinta e oito detentos fugiram da maior prisão de Moroni. Relatos indicam que eles simplesmente saíram pelo portão principal, mal vigiado, e as autoridades citam negligência dos guardas e possível premeditação. O governo deve decidir se aumenta os gastos com segurança para reforçar a proteção ou se mantém os níveis atuais enquanto continua a busca."
 comoros.25.a: "Aumentar os gastos com segurança"
 comoros.25.b: "Continuar a busca dentro do orçamento atual"
 comoros.26.t: "Presidente Assoumani Esfaqueado"
 comoros.26.d: "Durante o funeral de um líder religioso em Salimani, o presidente Azali Assoumani foi atacado com uma faca por um soldado de 24 anos, sofrendo ferimentos leves. O suspeito foi preso no local, mas foi encontrado morto sob custódia no dia seguinte. O incidente aumentou a preocupação do público com as forças de segurança e a estabilidade política."
 comoros.26.a: "Reforçar as medidas de segurança"
 comoros.26.b: "Resposta mínima ao incidente"
 comoros.27.t: "Robert Denard É Libertado"
 comoros.27.d: "Robert Denard, outrora um famoso mercenário na África, foi libertado apesar dos crimes de que é acusado. É um milagre que isso tenha acontecido, mas aconteceu. Muitos acreditam que ele poderia conseguir homens e material para outra incursão em nosso país."
 comoros.27.a: "Preocupante."
 comoros.28.t: "Robert Denard Dá um Golpe no Governo"
 comoros.28.d: "O mercenário retornou com centenas de soldados e derrubou o governo com sucesso, estabelecendo em seu lugar um regime fantoche liderado por um homem conhecido apenas como \"O Rei Guerreiro da África\"."
 comoros.28.a: "Um Rei Guerreiro!"
 comoros.29.t: "Robert Denard É Capturado pelos Franceses"
 comoros.29.d: "As forças armadas francesas capturaram Denard a caminho de realizar um golpe em nosso país com cerca de cem ou duzentos homens. A maior parte de suas forças foi libertada, mas o próprio Denard foi preso e levado de volta à França para ser julgado."
 comoros.29.a: "Já vai tarde!"
 comoros.30.t: "Robert Denard Fracassa no Golpe"
 comoros.30.d: "Apesar de trazer um destacamento considerável, Denard foi derrotado em sua tentativa de derrubar o governo. Foi preso após a derrota e agora será deixado para apodrecer numa prisão em Grande Comore."
 comoros.30.a: "Senhoras e senhores, nós o pegamos."
 comoros.31.t: "Resultados do Referendo Constitucional"
 comoros.31.d: "Após meses de campanha pelas ilhas, o referendo constitucional foi concluído e os votos foram contados. A questão de adotar uma estrutura federal que conceda autonomia a cada ilha ou buscar um governo centralizado foi respondida pelo povo. Os resultados moldarão a distribuição do poder em nossa nação nos próximos anos."
 comoros.31.a: "O Povo Falou."
 comoros.32.t: "Morte do Ex-Presidente Massounde"
 comoros.32.d: "Recebemos tristes notícias de Paris. O ex-presidente Tadjidine Ben Said Massounde faleceu na noite passada num hospital parisiense, aos 76 anos, vítima de complicações de uma longa doença. Apesar das circunstâncias controversas de sua saída do poder no golpe de 1999 liderado pelo coronel Azali Assoumani, Massounde continuou sendo uma figura significativa na história política [COM.GetAdjective]. A notícia de sua morte ecoou profundamente por todo o arquipélago, com cidadãos das três ilhas reunidos em mesquitas e praças públicas para orações e homenagens. As forças armadas [COM.GetAdjective] anunciaram que prestarão honras militares completas em reconhecimento ao seu serviço à nação durante a presidência. Sua família, tanto a que mora em Paris quanto a que vive nas Comores, expressou profunda gratidão pela onda de condolências e respeito demonstrada pelos cidadãos [COM.GetAdjective], pela comunidade da diáspora na França e por observadores internacionais. As bandeiras de todo o país ficarão a meio mastro durante três dias de luto oficial."
 comoros.32.a: "Pressione X para prestar respeitos."
 comoros.33.t: "O Acordo de Zanzibar"
 comoros.33.d: "Diplomatas [COM.GetAdjective] nos apresentaram uma proposta incomum, mas intrigante: desejam negociar a compra de [253.GetName] do nosso governo. A delegação [COM.GetAdjective] veio preparada com projeções econômicas detalhadas, cronogramas de pagamento propostos e garantias quanto aos direitos e ao bem-estar dos atuais moradores. Argumentam que a proximidade geográfica e os laços culturais tornam o arranjo benéfico para ambas as partes, e enfatizaram seu compromisso de manter a estabilidade e a prosperidade da região. A proposta inclui disposições para um período de transição, proteção dos acordos existentes e uma compensação financeira substancial que poderia reforçar significativamente o nosso tesouro nacional. Nosso gabinete está dividido: alguns veem uma oportunidade pragmática de consolidar nossas possessões territoriais e obter recursos econômicos, enquanto outros consideram a venda de território soberano um precedente impensável, que poderia atrair novas propostas do tipo no futuro. A decisão agora cabe ao nosso governo."
 COM_anjouan_rebellion_tt: "§YA Rebelião de Anjouan Termina!!§!"
 COM_naval_treaty_with_france_idea_tt: "Estabelece uma Base Naval para a §YFrança§! em nosso território.\n\n§YSe [FRA.GetName] cancelar a garantia, o tratado naval será cancelado§!\n"
 COM_naval_treaty_with_china_idea_tt: "Estabelece uma Base Naval para a §YChina§! em nosso território.\n\n§YSe [CHI.GetName] cancelar a garantia, o tratado naval será cancelado§!\n"
 COM_change_federalist_constitutionalist_support_effect_tt: "Altera o apoio à §YConstituição Federalista§! em §Y[?temp_change|Y0]%§!. (Apoio atual: [?COM_federalist_constitutional_support|Y0]%)\n"
 COM_change_anti_federalist_constitutionalist_support_effect_tt: "Altera o apoio à §YConstituição Antifederalista§! em §Y[?temp_change|Y0]%§!. (Apoio atual: [?COM_anti_federalist_constitutional_support|Y0]%)\n"
 COM_mayotte_referendum_independence_effect_tt: "Altera o apoio §Y[MTE.GetAdjective]§! em §Y[?temp_change|Y0]%§!. (Apoio atual: §Y[?COM.mayotte_referendum_independence|Y0]%§!)\n"
 COM_mayotte_referendum_france_effect_tt: "Altera o apoio §Y[FRA.GetAdjective]§! em §Y[?temp_change|Y0]%§!. (Apoio atual: §Y[?FRA.mayotte_referendum_france|Y0]%§!)\n"
