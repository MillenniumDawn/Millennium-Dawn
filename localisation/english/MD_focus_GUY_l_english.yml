l_english:
 #Decisions
 GUY_resources_category: "Guyanese Resources"
 GUY_resources_category_desc: "Bauxite, gold, and now oil lie under a small state with a thin treasury. Foreign operators bring the capital and we decide how much of the wealth stays home. The §YStabroek Block§! decisions open once the first discovery is announced."
 GUY_stabroek_appraisal_tt: "The §YStabroek Block§! appraisal drilling is complete"
 GUY_oil_flowing_tt: "Guyana is §Yproducing oil§!"
 GUY_decision_liza_phase_1: "Approve the Liza Development"
 GUY_decision_liza_phase_1_desc: "ExxonMobil's Liza-1 well found oil in deep water far off our coast. Phase 1 is a floating production vessel moored over the field, and the operator pays for it under the production sharing agreement. Our regulators, port, and shore base still need money. The partners will not commit until the appraisal wells report, and the vessel takes about two and a half years to build and install."
 GUY_decision_liza_phase_2_payara: "Expand Stabroek: Liza Phase 2 and Payara"
 GUY_decision_liza_phase_2_payara_desc: "A second vessel over the Liza field and a third over the Payara field would raise output several times over. Each needs government approval, a larger shore base, and trained Guyanese crews, and each takes years to build and tow into place."
 GUY_decision_yellowtail: "Develop the Yellowtail Field"
 GUY_decision_yellowtail_desc: "Yellowtail is the fourth development and the largest vessel yet planned for the Stabroek Block. Approving it means more shore-base capacity, more regulators, and more debate over who benefits."
 GUY_decision_natural_resource_fund: "Establish the Natural Resource Fund"
 GUY_decision_natural_resource_fund_desc: "Parliament passed the Natural Resource Fund Act in 2019, before the first barrel was lifted. The fund keeps petroleum revenue in a separate account held abroad, and withdrawals follow a rule instead of a minister's preference."
 GUY_decision_natural_resource_fund_withdrawal: "Draw on the Natural Resource Fund"
 GUY_decision_natural_resource_fund_withdrawal_desc: "Each year the fund can release a share of oil income to the budget. The more oil we pump, the larger the draw. Up to two fifths of it retires public debt before the rest reaches the treasury."
 GUY_decision_bauxite_belt: "Modernize the Bauxite Belt"
 GUY_decision_bauxite_belt_desc: "Bauxite is mined at Linden on the Demerara River and along the Berbice River. The Bosai and RUSAL operations ship ore and calcined bauxite from there. New pits, dryers, and barge routes would lift output."
 GUY_decision_aurora_gold: "Back the Aurora Gold Mine"
 GUY_decision_aurora_gold_desc: "Guyana Goldfields' Aurora mine on the Cuyuni River began commercial production at the start of 2016. A mine of that size needs roads, power, and a processing plant in the interior. Gold counts as §YPrecious Metals§! here."
 GUY_elections_march_2019_tt: "General elections will be held in §YMarch 2019§!."
 GUY_elections_march_2020_tt: "General elections will be held in §YMarch 2020§!."

 #Events
 guyana.1.t: "Oil Found in the Stabroek Block"
 guyana.1.d: "ExxonMobil has announced that its Liza-1 well, drilled in deep water about 190 kilometers off our coast, struck more than 90 meters of oil-bearing sandstone. It is the first oil discovery in Guyana's history. Appraisal wells must show how much oil lies below before the partners commit billions to develop it."
 guyana.1.a: "Welcome the discovery"
 guyana.2.t: "First Oil from the Liza Field"
 guyana.2.d: "The Liza Destiny, a floating production vessel moored far offshore, has started producing crude. Under the production sharing agreement the operator recovers its costs first, so early revenue is modest, but Guyana is now an oil producer. The debate has moved from whether the money will come to who will control it."
 guyana.2.a: "Celebrate the first cargo"
 guyana.3.t: "The Government Loses a Confidence Vote"
 guyana.3.d: "The opposition PPP/C has carried a no-confidence motion by 33 votes to 32. One government member, Charrandass Persaud of the AFC, crossed the floor and voted with the opposition. The constitution calls for elections within three months, but the government argues that a majority of the 65-seat house means 34 votes, not 33."
 guyana.3.a: "Accept the vote and call elections"
 guyana.3.b: "Challenge the vote in court"
 guyana.4.t: "Election Night Ends in a Standoff"
 guyana.4.d: "Voting on 2 March went smoothly, but the count has stalled in Region 4, the most populous electoral district. The PPP/C says the declared tallies do not match the statements of poll, while the government says the returning officer's figures stand. The Caribbean Community has offered to supervise a recount."
 guyana.4.a: "Stand by the Region 4 declaration"
 guyana.4.b: "Agree to a CARICOM-supervised recount"
 guyana.5.t: "Irfaan Ali Is Sworn In"
 guyana.5.d: "After five months of recounts, court rulings, and international pressure, the chair of the Elections Commission has declared the PPP/C list the winner of the March election. Irfaan Ali was sworn in as the ninth executive president within hours of the declaration, with Bharrat Jagdeo as vice president."
 guyana.5.a: "A new government takes office"
 guyana.6.t: "The Coalition Wins a One-Seat Majority"
 guyana.6.d: "President Ramotar prorogued the National Assembly last November to avoid a no-confidence vote, then called early elections. The APNU and the Alliance for Change, joined since February by the Cummingsburg Accord, have now won 33 of the 65 seats by about 4,500 votes. If the result stands, retired brigadier David Granger will become president, with the AFC's Moses Nagamootoo as prime minister, ending 23 years of PPP/C government."
 guyana.6.a: "Concede to the coalition"
 guyana.6.b: "Hold on through a recount"
 guyana.7.t: "WIN Becomes the Main Opposition"
 guyana.7.d: "We Invest in Nationhood, the party the gold trader Azruddin Mohamed founded this year, has taken more seats than APNU in its first election. The old opposition coalition is now the third force in the National Assembly, and Mohamed, under United States sanctions since 2024, leads the opposition."
 guyana.7.a: "A new face in opposition"
