 UKR_hur_created_tt: "§YPodremos lanzar operaciones especiales limitadas§!"
 UKR_vv_tooltip_tt: "§YLa financiación de las fuerzas especiales reducirá significativamente las consecuencias de un posible Maidan§!"
 UKR_arms_rebuild: "Industria Militar"
 UKR_arms_rebuild_desc: "Nuestro país debe defenderse, y solo una industria militar fuerte lo ayudará en esto."
 UKR_arms_build: "Invertir en Producción Militar"
 UKR_arms_build_desc: "We are ready to finance investments in expanding the military production of some of our name factories."
 UKR_polish_ukr_brotherhood: "Hermandad Polaco-Ucraniana"
 UKR_polish_ukr_brotherhood_desc: "Only together, Ukraine and Poland will be able to defeat any enemy."
 UKR_belarus_brothers: "Los Hermanos Bielorrusos"
 UKR_belarus_brothers_desc: "El pueblo bielorruso son nuestros hermanos, que también están en las garras de dos grandes fuerzas políticas. Los sacaremos de estas garras."
 UKR_befriend_azerbaijan: "Amistad con Azerbaiyán"
 UKR_befriend_azerbaijan_desc: "Azerbaiyán será un valioso aliado para avanzar nuestra política en el Cáucaso, donde podremos resistir activamente la influencia de Rusia."
 UKR_befriend_georgia: "Unión con Georgia"
 UKR_befriend_georgia_desc: "Georgia is an important partner and has a strategic position in the Caucasus region. Having such an ally in the Alliance will be very beneficial for us."
 UKR_caucasus_volunteers: "Voluntarios del Cáucaso"
 UKR_caucasus_volunteers_desc: "We will invite many volunteers from the Caucasus to form HUR battalions."
 UKR_dagestan_reb_prepare: "Preparar un Levantamiento en Daguestán"
 UKR_dagestan_reb_prepare_desc: "We will begin preparations for a special limited operation in Dagestan."
 UKR_befriend_chechens: "Amistad con Ichkeria"
 UKR_befriend_chechens_desc: "Ichkeria, un estado que fue destruido por Rusia a principios de este siglo. Reuniremos a sus verdaderos patriotas e intentaremos revivirlo."
 UKR_reconcista: "La Reconquista Ucraniana"
 UKR_reconcista_desc: "European states are mired in chaos, an emigrant crisis. The peoples of Europe are completely under the control of the globalists, which in the future will surely lead Europe to collapse, for the sake of easy profit - we will change this."
 UKR_no_russian_language: "La Prohibición del Idioma Ruso"
 UKR_no_russian_language_desc: "It's time to deal with the Russian language completely."
 UKR_kuban_ukrainization: "Ucranización de Kuban"
 UKR_kuban_ukrainization_desc: "Kuban will become Ukrainian, we will take care of it."
 UKR_trizub: "Tryzub"
 UKR_trizub_desc: "Tryzub is entrusted with functions of a specific nature that other wings of the Nationalist Congress did not get."
 UKR_christos_nash: "Nacionalismo cristiano"
 UKR_christos_nash_desc: "Christianity and nationalism are things that should be united in our Ukrainian state."
 UKR_nationalists_congress: "Política del Congreso Nacionalista"
 UKR_nationalists_congress_desc: "The real patriots of Ukraine are now running the country, no matter how tough the policy is, it will make our country great."
 UKR_nationalists_right_sector: "Sector Derecho"
 UKR_nationalists_una_unso: "UNA UNSO"
 UKR_nationalists_upa: "UPA"
 UKR_nationalists_people_leave: "Migración desde Ucrania"
 UKR_nationalists_people_leave_desc: "Nuestra política ha causado una migración masiva desde el país, pero nos alegra que finalmente todos los traidores se vayan de aquí!"
 UKR_nationalists_cleane_ukraine: "La verdadera Ucrania"
 UKR_nationalists_great_ukraine: "La Gran Ucrania"
 UKR_nationalists_great_ukraine_desc: "La Gran Ucrania comienza aquí!"
 UKR_nationalists_trizub: "Tryzub"
 UKR_nationalists_reconcista: "La Reconquista revivida"
 UKR_nationalists_reconcista_desc: "Ukraine will become a beacon of the revival of Christianity in Europe! The holy march from Kyiv begins."
 UKR_hur_operation_belarus_tt: "Podremos lanzar una operación especial limitada en §Y[BLR.GetNamewithFlag]§!"
 UKR_hur_operation_poland_tt: "Podremos lanzar una operación especial limitada en §Y[POL.GetNamewithFlag]§!"
 UKR_hur_operation_crimea_tt: "Podremos lanzar una operación especial limitada en §Y[CRM.GetNamewithFlag]§!"
