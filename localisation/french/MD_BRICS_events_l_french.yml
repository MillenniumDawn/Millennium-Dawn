l_french:
 brics_join.1.t: "[FROM.GetNameDef] cherche à devenir membre des BRICS"
 brics_join.1.d: "[FROM.GetNameDef] a officiellement demandé à rejoindre les BRICS. En tant que chef de file du bloc, la décision de les admettre nous appartient."
 brics_join.1.a: "Ils renforcent le bloc. Admettons-les."
 brics_join.1.b: "Leur adhésion ne nous sert pas."
 brics_join.2.t: "Notre candidature est acceptée"
 brics_join.2.d: "Les BRICS ont approuvé notre demande d'adhésion. Nous prenons place parmi les nations du bloc."
 brics_join.2.a: "Prendre notre place aux BRICS"
 brics_join.3.t: "Notre candidature aux BRICS est rejetée"
 brics_join.3.d: "La direction des BRICS a décliné notre candidature. La porte n'est pas fermée à jamais, et nous pourrons à nouveau plaider notre cause le moment venu."
 brics_join.3.a: "Nous candidaterons plus tard"
 brics_join.3.b: "Abandonner l'effort"
 brics_join.4.t: "[ROOT.GetNameDef] rejoint les BRICS"
 brics_join.4.d: "[ROOT.GetNameDef] a été admis aux BRICS, élargissant la portée et le poids du bloc dans l'ordre international."
 brics_join.4.a: "Un équilibre changeant"
 brics_join.5.t: "Il est temps de se rapprocher à nouveau des BRICS"
 brics_join.5.d: "Assez de temps s'est écoulé depuis notre dernier refus. Nous pouvons soumettre une nouvelle candidature à la direction des BRICS."
 brics_join.5.a: "Resoumettre notre candidature"
 brics_join.5.b: "Pas encore"
 brics_join.6.t: "[FROM.GetNameDef] nous invite à fonder les BRICS"
 brics_join.6.d: "[FROM.GetNameDef] fait naître les BRICS et nous a demandé de figurer parmi ses membres fondateurs, pour façonner le bloc dès l'origine."
 brics_join.6.a: "Nous aiderons à fonder les BRICS"
 brics_join.6.b: "Nous garderons nos distances"