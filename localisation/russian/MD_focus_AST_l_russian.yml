 paid_parental_scheme_ast_desc: "Предоставляет новым родителям право на оплачиваемый отпуск продолжительностью до 26 недель. Это позволяет им брать отпуск, чтобы лучше заботиться о своих новорожденных или приемных детях, и способствует росту численности населения."
 paid_parental_scheme_ast_2_desc: "Объединение наших программ поддержки родителей, заменяющее прежнюю программу «Детский бонус» финансовыми выплатами для помощи молодым родителям. Также предоставляет молодым родителям до 26 недель оплачиваемого отпуска и единовременные выплаты для лучшего ухода за новорожденными или усыновленными детьми и для стимулирования роста населения."
 social_capitalism_ast: "Социальный капитализм"
 social_capitalism_ast_desc: "Наш более практический подход к управлению экономикой принес свои плоды, а также некоторые незначительные недостатки. Используя регулирование и прямое управление, мы можем более непосредственно влиять на экономику и обеспечивать ее соответствие интересам граждан. По мере внедрения этого подхода наши методы будут совершенствоваться."
