 module_anti_ship_drone_torpedoes_1: "Torpilles de drones antinavires I"
 module_anti_ship_drone_torpedoes_1_desc: "Les torpilles drones antinavires combinent guidage autonome et ciblage en réseau pour améliorer la probabilité de toucher contre les bâtiments de surface ennemis.\n\n§GIndice du concepteur : les torpilles drones offrent une attaque de torpille et une lutte anti-sous-marine tout en améliorant la chance de toucher et en réduisant fortement les besoins en main-d'œuvre. Conviennent aux conceptions de frappe précises à faible équipage, mais exigent davantage de puces.§!\n§GIndice concepteur : les torpilles-drones offrent attaque à la torpille et lutte anti-sous-marine tout en améliorant la chance de coup de torpille et en réduisant fortement les besoins en effectifs. Elles conviennent aux conceptions de frappe précises à faible équipage, mais exigent des quantités croissantes de microprocesseurs.§!"
