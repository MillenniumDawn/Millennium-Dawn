 util_vehicle_desc: "Многоцелевой автомобиль — транспортное средство, как правило моторизованное, предназначенное для выполнения определённой задачи эффективнее, чем автомобиль общего назначения."
 util_vehicle_1: "Внедорожник 1965 года"
 util_vehicle_1_desc: "Служебные внедорожники — машины, на которых мотопехота добирается до поля боя. Модели ранних поколений — джипы и грузовики — практически не бронированы и отличаются от гражданских аналогов в основном повышенной прочностью и проходимостью по труднопроходимой местности. Более поздние поколения представлены машинами типа Humvee с усиленной бронёй и защищёнными от мин автомобилями с ещё более высокой защитой экипажа. Если такие машины и вооружены, то обычно лёгким оружием, например пулемётами."
 util_vehicle_2: "Внедорожник 1975 года"
 util_vehicle_2_desc: "Служебные внедорожники — машины, на которых мотопехота добирается до поля боя. Модели ранних поколений — джипы и грузовики — практически не бронированы и отличаются от гражданских аналогов в основном повышенной прочностью и проходимостью по труднопроходимой местности. Более поздние поколения представлены машинами типа Humvee с усиленной бронёй и защищёнными от мин автомобилями с ещё более высокой защитой экипажа. Если такие машины и вооружены, то обычно лёгким оружием, например пулемётами."
