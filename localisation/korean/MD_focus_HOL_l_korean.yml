l_korean:
 netherlands_focus: "네덜란드 중점 계통도"
 HOL_adressing_it_system_legacy_issues: "IT 시스템 레거시 문제 해결"
 HOL_adressing_it_system_legacy_issues_desc: "네덜란드 국세청은 낡고 파편화된 IT 시스템에 의존하고 있어 효율성이 떨어지고 대중적 스캔들이 발생하고 있습니다. 이 핵심 기반시설의 현대화를 우선시해야 할 때입니다."
 HOL_space_efforts: "네덜란드 우주 개발 재건"
 HOL_space_efforts_desc: "네덜란드는 오랫동안 과학 혁신의 선두에 서 왔지만 우주 프로그램은 미개발 상태로 남아 있었습니다. 우주 기술에 대한 투자를 새롭게 약속함으로써 우리는 세계 우주 경쟁에서 진지한 주체로 자리매김할 수 있습니다."
 HOL_nso_education_efforts: "NSO 연구 및 지식 확대"
 HOL_nso_education_efforts_desc: "과학적 우수성은 모든 성공적인 우주 프로그램의 토대입니다. 우주 관련 연구에 대한 정부 지원을 늘리고 네덜란드 대학들과의 협력을 확대함으로써 우리는 천체물리학, 추진 시스템, 행성 과학에 대한 지식을 심화할 것입니다."
 HOL_nso_economic_efforts: "위성 기반시설 확장"
 HOL_nso_economic_efforts_desc: "네덜란드는 증가하는 위성 기술 수요를 활용해야 합니다. 국내 위성 생산, 발사 능력, 세계 위성 통신망에 투자함으로써 우리는 우주 경제의 핵심 주체로 자리매김할 수 있습니다."
 HOL_corporation_space: "국제 우주 협력"
 HOL_corporation_space_desc: "우주 탐사는 홀로 하는 노력이 아닙니다. NASA, ESA, 중국의 CNSA와 같은 국제 우주 기관과의 관계를 강화하면 우리는 최첨단 기술, 공동 연구, 그리고 화성 및 달 공동 탐사 임무의 가능성에 접근할 수 있게 될 것입니다."
 HOL_mars_one: "마스 원 구상 부활"
 HOL_mars_one_desc: "화성에 영구적인 인류 정착지를 세우겠다는 꿈은 한때 불가능한 일로 여겨졌습니다. 원래의 마스 원 프로젝트는 실패했지만, 국가의 적절한 지원과 과학적 감독이 있다면 이 비전을 현실로 바꿀 수 있습니다. 네덜란드는 진정한 우주 개척 국가가 될 잠재력을 지니고 있습니다."
 HOL_Technologisch_Hoogwaardig: "고도 기술 집약"
 HOL_Technologisch_Hoogwaardig_desc: "고품질 기술에 대한 투자는 현대적이고 유능한 군대를 유지하는 데 필수적입니다. 이 중점에는 첨단 체계를 도입하고 혁신을 촉진하여 네덜란드가 군사 기술의 최전선에 서도록 하는 것이 포함됩니다."
 HOL_Join_JSF_tt: "§YF35 필수 기술§!을 모두 완료하면 JSF 프로그램이 완료되었을 때 §YF35-A 항공기§! §G50§!대를 얻습니다."
 HOL_Buy_F35C: "F35C 프로그램 참여"
 HOL_Buy_F35C_desc: "F-35C 라이트닝 II 항공기의 조달은 네덜란드 공군에 첨단 스텔스 전투기의 항모 운용형 파생형을 제공합니다. 이 중점은 육상 기지와 항공모함 양쪽에서 항공력을 투사하는 네덜란드의 능력을 높이며, 비할 데 없는 다목적성과 전투 효율을 제공합니다."
 HOL_Netherlands_Fractal_Pattern_tt: "§Y받게 되는 기술은 위장에 대한 현재 기술 수준에 맞춰 조정됩니다§!"
 HOL_DAF_Trucks_tt1: "우리는 §YDAF§!에 투자했으며, 비용이 §G낮아졌습니다§!."
 HOL_DAF_Trucks_tt2: "이 중점을 선택하기 전에 §YDAF§!에 §G투자§!하면 비용이 §G절반§!이 됩니다."
 HOL_Scania_Trucks_tt: "§Y스웨덴§!이 §Y스카니아 그리푸스§!를 잠금 해제하면 §Y스카니아 그리푸스§! 트럭 §G2000§!대를 추가합니다"
 HOL_PULS_tt: "§Y이스라엘§!이 §YPULS§!를 잠금 해제하면 §G20§!대의 §YPULS 다연장 로켓§!을 추가합니다"
 HOL_F35C_Development_tt: "§YF35 필수 기술§!을 모두 완료하면 JSF 프로그램이 완료되었을 때 §YF35-C 항공기§! §G50§!대를 얻습니다."
 HOL_Special_Force_Move_tt: "§Y해병대 이전§!이 완료되면 이전에 따른 이점을 얻게 됩니다."
 HOL_Robotics_Navy_tt: "§Y해군 국가 중점§!의 비용이 §G절반§!이 됩니다"
 HOL_Hollandklasse_Frigate_tt: "이 중점을 완료하면 §YFrigate 2015§!를 연구했을 때, 수락 시 양국 모두 §Y생산§! 진행도 §G15%§!를 얻은 채로 홀란트급 §Y호위함§! §G6§!척을 공동 §Y생산§!하자는 협력 제안이 §Y[BEL.GetNameWithFlag]§!에 전달됩니다."
 HOL_vvd_klimaatakkoord: "기후 협약"
 HOL_vvd_klimaatakkoord_desc: "네덜란드 기후 협약에 대한 헌신은 지속 가능한 미래에 필수적입니다. VVD는 온실가스 배출을 줄이고 재생 에너지를 촉진하는 노력을 이끌 것입니다."
 HOL_Public_Private_Partnerships_tt: "§Y경제 중점§!의 §Y비용§! 감소 §G-10%§!"
 HOL_Balkenende_tt: "§H보수 사회§!를 추가합니다. 효과: ( £political_power_texticon  정치력 획득: [?0.10|%+] , £foreign_influence_defense_modifier_texticon §Y외국 영향력 방어§! 배수: [?-0.10|%+])"
 HOL_Trust_In_Organizations_tt: "§H모든 네덜란드 주§!가 §H생산성 50§!을 받습니다"
 HOL_direct_democracy: "직접 민주주의"
 HOL_direct_democracy_desc: "LPF는 직접 민주주의를 통해 국민에게 힘을 실어주어야 한다고 믿습니다. 시민 주도의 의사 결정 과정을 더 많이 도입함으로써 정부 정책이 국민의 의지와 긴밀히 부합하도록 보장합니다."
 HOL_senate_reform: "상원 개혁"
 HOL_senate_reform_desc: "상원은 정체된 기관이 되었습니다. 상원을 개혁하면 입법 절차가 간소화되고, 상원이 기득권이 아닌 국민을 진정으로 위해 봉사하게 될 것입니다."
 HOL_end_party_kartel: "정당 카르텔 타파"
 HOL_end_party_kartel_desc: "LPF는 수년간 네덜란드 정치를 지배해 온 기성 정당 카르텔을 해체할 것입니다. 정치 체제를 개방하면 우리 나라의 통치에 새로운 아이디어와 목소리가 유입될 것입니다."
 HOL_referenda: "국민투표 확대"
 HOL_referenda_desc: "LPF는 중대한 사안에 대해 시민이 직접 의견을 낼 수 있도록 국민투표를 늘릴 것을 주장합니다. 직접 민주주의에 대한 이러한 헌신은 국민의 목소리가 경청되고 존중되도록 보장합니다."
 HOL_limit_senate_power: "상원 권한 제한"
 HOL_limit_senate_power_desc: "LPF는 진보적 입법에 대한 상원의 거부권 행사 능력을 줄여 상원의 권한을 제한하는 것을 목표로 합니다. 이를 통해 우리의 민주주의가 방해 없이 더욱 효율적으로 작동할 수 있게 될 것입니다."
 HOL_public_sector_reform: "공공 부문 개혁"
 HOL_public_sector_reform_desc: "네덜란드의 공공 부문은 비효율과 낭비에 빠져 있습니다. LPF는 정부 기관을 전면 개편하고 운영을 간소화하여 효과적인 서비스와 납세자 자금의 책임 있는 사용을 보장할 것입니다."
 HOL_cut_business_taxes: "법인세 인하"
 HOL_cut_business_taxes_desc: "경쟁력 있는 기업 환경을 조성하기 위해 LPF는 네덜란드 기업에 대한 세금을 낮출 것입니다. 이러한 인하는 투자를 장려하고, 성장을 촉진하며, 더 많은 일자리를 창출할 것입니다."
 HOL_labor_market_liberalization: "노동 시장 자유화"
 HOL_labor_market_liberalization_desc: "네덜란드 노동 시장을 더욱 유연하게 만들기 위해 LPF는 자유화 조치를 도입할 것입니다. 이러한 개혁은 규제 장벽을 줄여 기업이 더 쉽게 채용할 수 있게 하고 노동자에게 더 많은 유연성을 부여할 것입니다."
 HOL_welfare_reform: "복지 국가 개혁"
 HOL_welfare_reform_desc: "핌 포르퇴인은 네덜란드의 복지 국가가 비대하고 지속 불가능하다고 믿었습니다. LPF는 복지 제도를 개혁하여 의존성을 줄이고 개인의 책임을 장려하는 한편, 정말로 필요한 이들에 대한 지원은 유지할 것입니다."
 HOL_counter_terrorism_efforts: "테러 대응 노력"
 HOL_counter_terrorism_efforts_desc: "느슨한 법 집행으로 인해 네덜란드 사회는 점점 더 불안해졌습니다. LPF는 경찰력을 강화하고, 강력 범죄에 대한 형량을 높이며, 네덜란드 시민이 자국에서 다시 안전하다고 느낄 수 있도록 보장할 것입니다."
 HOL_more_police_force: "경찰력 증강"
 HOL_more_police_force_desc: "LPF는 강력한 경찰 존재가 공공 질서와 안전을 유지하는 데 필수적이라고 믿습니다. 경찰력을 확대하고 추가 자원을 제공함으로써 법 집행 기관이 네덜란드 시민을 효과적으로 보호할 수 있도록 보장할 것입니다."
 HOL_promote_dutch_values: "네덜란드 가치 증진"
 HOL_promote_dutch_values_desc: "LPF와 PVV는 모두 네덜란드의 가치가 강하고 결속력 있는 사회의 토대라고 믿습니다. 우리는 이러한 가치를 증진하고 보존하여 네덜란드 문화가 공적 생활과 국가 정체성의 중심에 남도록 노력할 것입니다."
 HOL_support_dutch_agriculture: "네덜란드 농업 지원"
 HOL_support_dutch_agriculture_desc: "네덜란드 농업은 우리 경제와 문화유산의 초석입니다. 지역 농민과 농촌 공동체를 지원함으로써 식량 안보를 강화하고 전통에 뿌리를 둔 지속 가능한 관행을 증진할 것입니다."
 HOL_made_in_holland: "메이드 인 홀란드"
 HOL_made_in_holland_desc: "우리는 네덜란드에서 만든 제품을 홍보하고 소비자가 국내에서 제조된 상품을 선택하도록 장려할 것입니다. 네덜란드 산업을 우선시함으로써 우리 경제를 지원하고 네덜란드 품질에 대한 우리의 헌신을 강화합니다."
 HOL_family_business_support: "가족 기업 지원"
 HOL_family_business_support_desc: "가족 소유 기업은 네덜란드 사회에 없어서는 안 될 존재이며 우리 경제의 근간을 이룹니다. 우리는 이러한 기업이 계속 번창하고 세계 시장에서 경쟁력을 유지하도록 지원을 제공할 것입니다."
 HOL_internet_freedom: "인터넷 자유 보호"
 HOL_internet_freedom_desc: "온라인에서의 표현의 자유는 보존되어야 합니다. 우리는 시민이 정보에 자유롭게 접근하고 공유할 권리를 보호하며, 디지털 공간에 대한 모든 형태의 검열이나 통제에 맞서 노력할 것입니다."
 HOL_cut_down_government: "정부 축소"
 HOL_cut_down_government_desc: "정부 관료제는 비대해지고 비효율적이 되었습니다. 우리는 불필요한 행정 부담을 줄이고, 정부 기능을 간소화하며, 납세자의 돈이 현명하게 쓰이도록 보장하기 위해 노력할 것입니다."
 HOL_cut_leftist_groups: "좌파 단체 보조금 삭감"
 HOL_cut_leftist_groups_desc: "좌파 단체들은 오랫동안 자신들의 의제를 추진하기 위해 공적 자금에 의존해 왔습니다. 이들 단체에 대한 보조금을 줄임으로써 납세자의 돈이 대다수 네덜란드 시민에게 이익이 되는 구상을 지원하도록 보장합니다."
 HOL_forced_work: "실업자 강제 노동 시행"
 HOL_forced_work_desc: "사회 복지에 대한 의존도를 줄이기 위해 우리는 정부 지원을 받는 이들이 사회에 다시 기여하도록 하는 조치를 시행하여 자립과 생산성을 장려할 것입니다."
 HOL_downgrade_prisons: "교도소 환경 하향"
 HOL_downgrade_prisons_desc: "교도소는 안락한 곳이 아니라 교화의 장이어야 합니다. 우리는 교도소 내의 사치를 줄이고, 범죄자가 형을 살며 책임을 배우는 장소가 되도록 할 것입니다."
 HOL_dutch_citizens_first: "네덜란드 시민 우선"
 HOL_dutch_citizens_first_desc: "우리는 모든 정책 결정에서 네덜란드 시민의 필요를 우선시해야 한다고 믿습니다. 의료, 주택, 고용 어느 분야에서든 우리의 목표는 네덜란드 국민을 최우선으로 두는 것입니다."
 HOL_dutch_healthcare_first: "네덜란드 의료는 네덜란드 시민 우선"
 HOL_dutch_healthcare_first_desc: "의료 자원은 우선적으로 네덜란드 시민에게 혜택이 돌아가야 합니다. 우리는 네덜란드 국민이 의료 서비스에 우선적으로 접근하도록 보장하여 공중 보건을 강화하고 제도에 대한 부담을 줄일 것입니다."
 HOL_reject_dual_nationality: "이중 국적 거부"
 HOL_reject_dual_nationality_desc: "네덜란드에 대한 충성심을 높이기 위해 우리는 이중 국적을 제한할 것입니다. 이 정책은 네덜란드 정체성과 국가 가치에 대한 더 강한 헌신을 장려합니다."
 HOL_national_identity_first: "국가 정체성 우선"
 HOL_national_identity_first_desc: "우리는 강한 국가 정체성이 단결된 사회에 매우 중요하다고 믿습니다. 네덜란드 문화를 우선시함으로써 미래 세대가 깊은 자부심과 소속감을 지니고 자라도록 보장합니다."
 HOL_limit_foreign_influence: "외국의 영향력 제한"
 HOL_limit_foreign_influence_desc: "외국의 영향력이 네덜란드 사회에 스며들어 우리의 경제, 언론, 정책에 영향을 미치고 있습니다. 우리는 이러한 영향력을 줄이는 조치를 시행하여 네덜란드의 이익이 최우선이 되도록 보장할 것입니다."
 HOL_remove_windmills_solar_parks: "풍차와 태양광 단지 철거"
 HOL_remove_windmills_solar_parks_desc: "재생 에너지는 중요하지만, 풍차와 태양광 단지는 네덜란드의 경관을 훼손해 왔습니다. 우리는 시골의 아름다움을 유지하는 대체 에너지 해법에 주력할 것입니다."
 HOL_boost_housing_construction: "주택 건설 촉진"
 HOL_boost_housing_construction_desc: "네덜란드의 주택 위기는 행동을 요구합니다. 우리는 주택 건설에 투자하여 네덜란드 시민에게 저렴한 집을 제공하고, 부족 문제를 해소하며, 가정생활을 지원할 것입니다."
 HOL_stop_mass_immigration: "대규모 이민 중단"
 HOL_stop_mass_immigration_desc: "통제되지 않는 이민은 공공 서비스와 네덜란드 문화에 부담을 줍니다. 우리는 이민을 제한하고 자원을 네덜란드 시민의 필요에 집중하는 정책을 시행할 것입니다."
 HOL_defund_international_aid: "국제 원조 예산 삭감"
 HOL_defund_international_aid_desc: "네덜란드는 자국 시민을 우선시해야 합니다. 우리는 국제 원조 지출을 줄이고 우리 국경 안의 문제를 해결하는 데 집중할 것입니다."
 HOL_restrict_asylum_seekers: "망명 신청자 제한"
 HOL_restrict_asylum_seekers_desc: "네덜란드는 더 이상 많은 수의 망명 신청을 감당할 수 없습니다. 우리는 엄격한 기준을 도입하여 망명 신청자의 수용을 관리하고 줄일 것입니다."
 HOL_restore_border_control: "국경 통제 복원"
 HOL_restore_border_control_desc: "네덜란드 국경을 지키는 것은 주권과 안보를 유지하는 데 필수적입니다. 우리는 완전한 국경 통제를 복원하여 누가 우리나라에 출입하는지 관리할 것입니다."
 HOL_strengthening_police_power: "경찰 권한 강화"
 HOL_strengthening_police_power_desc: "공공 안전을 보장하기 위해 우리는 경찰력이 범죄에 효과적으로 대처하는 데 필요한 수단과 권한을 부여해야 합니다."
 HOL_celebrate_dutch_heroes: "네덜란드 영웅 기리기"
 HOL_celebrate_dutch_heroes_desc: "탐험가에서 예술가에 이르기까지 네덜란드의 영웅들은 우리의 국가적 가치와 역사를 구현합니다. 우리는 네덜란드 인물들의 업적을 알려 우리 유산에 대한 자긍심을 고취할 것입니다."
 HOL_protect_zwarte_piet: "즈바르터 피트 전통 보호"
 HOL_protect_zwarte_piet_desc: "즈바르터 피트 전통은 네덜란드 유산의 일부입니다. 우리는 반대로부터 이를 보호하여 우리의 문화적 관습이 훼손되지 않도록 보장할 것입니다."
 HOL_fatherland_education: "조국 교육"
 HOL_fatherland_education_desc: "네덜란드의 역사와 가치에 대한 탄탄한 교육 기반은 식견 있고 자긍심 높은 시민을 길러내는 핵심입니다. 우리는 학교에서 이러한 주제를 강조하는 프로그램에 투자할 것입니다."
 HOL_pro_gay_anti_lgbtq: "동성애 옹호, LGBTQ+ 반대"
 HOL_pro_gay_anti_lgbtq_desc: "오랫동안 개인의 자유를 선도해 온 네덜란드는 동성 커플에 대한 법적 평등을 받아들였으며 성적 지향에 따른 차별로부터 시민을 보호하기 위해 노력해 왔습니다. 그러나 LGBTQ+ 경향에 대한 대중의 회의론이 커지면서 문화적 반발이 일어났습니다. 우리는 핵심 자유주의 가치에 대한 헌신을 강화하는 한편 워크(woke)와 LGBTQ+로부터 거리를 둠으로써 개인의 자유와 사회적 안정에 뿌리를 둔 사회를 보존하고자 합니다."
 HOL_pro_gay_anti_lgbtq_tt: "§YLGBTQ§!에 대한 입장이 있는 경우 효과가 표시됩니다"
 HOL_push_for_nexit: "네덱시트 추진"
 HOL_push_for_nexit_desc: "네덜란드의 EU 탈퇴인 네덱시트는 PVV의 핵심 목표입니다. 우리는 유럽 연합 탈퇴 절차를 개시하여 우리의 법, 국경, 경제에 대한 완전한 주권을 되찾고 브뤼셀의 월권으로부터 네덜란드의 삶의 방식을 지킬 것입니다."
 HOL_bring_back_the_gulden: "휠던 부활"
 HOL_bring_back_the_gulden_desc: "유로는 네덜란드에 실패를 안겼으며, PVV는 경제적 독립을 회복하기 위해 네덜란드 휠던(길더)을 부활시킬 것입니다. 통화를 통제함으로써 인플레이션과 경제 성장을 더 잘 관리할 수 있습니다."
 HOL_defend_israel_rights: "이스라엘의 생존권 옹호"
 HOL_defend_israel_rights_desc: "이스라엘은 이슬람 극단주의에 맞선 투쟁에서 핵심 동맹입니다. PVV는 이스라엘의 생존권을 옹호하고 국경을 지키려는 노력을 지원하여 이스라엘이 중동에서 강력하고 독립적인 국가로 남도록 보장할 것입니다."
 HOL_counter_terrorism_israel: "이스라엘과 함께하는 테러 대응"
 HOL_counter_terrorism_israel_desc: "PVV는 이스라엘 및 다른 동맹국과 긴밀히 협력하여 테러, 특히 이슬람 극단주의에 대응할 것입니다. 정보를 공유하고 안보 조치에서 협력함으로써 네덜란드는 시민을 보호할 수 있는 역량을 더욱 갖추게 될 것입니다."
 HOL_joint_antiiran_stance: "반이란 입장 합류"
 HOL_joint_antiiran_stance_desc: "이란은 중동의 안보와 서방의 이익에 대한 위협을 키우고 있습니다. PVV는 이란의 팽창주의 정책과 핵무기 추구에 반대하는 국제적 노력에 동참할 것입니다."
 HOL_increase_corporation_vlaanderen: "플란데런과의 협력 확대"
 HOL_increase_corporation_vlaanderen_desc: "§Y[FLN.GetNameWithFlag]§!은(는) §Y[HOL.GetNameWithFlag]§!과(와) 깊은 문화적, 언어적 유대를 공유합니다. PVV는 플란데런과의 경제적, 정치적 협력을 확대하여 네덜란드어권 민족 간의 유대를 강화할 것입니다."
 HOL_increase_corporation_vlaanderen_tt: "§Y[FLN.GetNameWithFlag]§!과(와)의 §Y[HOL.GetAdjectiveCap]§! 통합을 확대하는 §Y결정§!을 잠금 해제합니다"
 HOL_support_independent_vlaanderen: "독립 플란데런 지원"
 HOL_support_independent_vlaanderen_desc: "PVV는 플란데런의 독립을 지지하며, 이는 해당 지역이 §Y[BEL.GetNameWithFlag]§!에서 분리되어 네덜란드와의 유대를 강화할 수 있게 해 줄 것입니다. 자유로운 플란데런은 네덜란드 정체성을 수호하는 데 강력한 동맹이 될 것입니다."
 HOL_economic_partnership_vlaanderen: "플란데런과의 경제 동반자 관계"
 HOL_economic_partnership_vlaanderen_desc: "PVV는 플란데런과 경제 동반자 관계를 발전시켜 두 지역 간의 무역과 투자를 촉진할 것입니다. 이 동반자 관계는 네덜란드 시민과 플랑드르 시민 모두에게 이익이 될 것입니다."
 HOL_cultural_unification_vlaanderen: "플란데런과의 문화적 통합"
 HOL_cultural_unification_vlaanderen_desc: "PVV는 네덜란드 문화와 플랑드르 문화의 통합을 지지하며, 네덜란드어권 민족을 위한 공유된 문화 공간을 만들 것입니다. 이는 네덜란드와 플란데런 사이의 유대를 강화하고 공동 정체성 의식을 증진할 것입니다."
 HOL_ties_with_afrikaans: "아프리칸스어와의 유대 강화"
 HOL_ties_with_afrikaans_desc: "네덜란드어에 뿌리를 둔 언어인 아프리칸스어는 네덜란드와 남아프리카를 하나로 잇습니다. PVV는 아프리카너 공동체와의 문화적, 경제적 유대를 강화하여 두 나라 간의 공동 유산과 협력을 증진할 것입니다."
 HOL_defend_afrikaans_rights: "아프리칸스어 문화적 권리 옹호"
 HOL_defend_afrikaans_rights_desc: "아프리칸스어는 남아프리카에서 위협받고 있으며, PVV는 아프리카너의 문화적 권리를 옹호할 것입니다. 아프리칸스어 학교와 기관을 지원함으로써 이 언어와 네덜란드 유산과의 연결을 보존할 것입니다."
 HOL_economic_coorporation_afrikaners: "아프리카너와의 경제 협력"
 HOL_economic_coorporation_afrikaners_desc: "남아프리카의 아프리카너는 네덜란드인과 깊은 문화적, 언어적 연관을 공유합니다. PVV는 아프리카너 기업과의 경제 협력을 증진하여 양 민족 간의 상호 성장과 발전을 보장할 것입니다."
 HOL_criminalize_islamic_symbols: "이슬람 상징 범죄화"
 HOL_criminalize_islamic_symbols_desc: "PVV는 부르카와 히잡 같은 이슬람 상징을 공공장소에서 금지할 것입니다. 이러한 상징은 네덜란드 사회에 통합되기를 거부하는 것을 나타내며, 이를 없앰으로써 국가적 단합을 강화하고 네덜란드의 세속주의를 공고히 할 것입니다."
 HOL_ban_quaran: "쿠란 금지"
 HOL_ban_quaran_desc: "PVV는 쿠란을 네덜란드의 가치와 문화에 대한 위협으로 간주합니다. 우리는 네덜란드에서 이 경전을 금지하는 대담한 조치를 취하여, 우리 사회에 대한 쿠란의 확산과 영향력을 제한하고 국가 정체성을 보존할 것입니다."
 HOL_ban_islamic_schools: "이슬람 학교 금지"
 HOL_ban_islamic_schools_desc: "네덜란드의 이슬람 학교는 분리와 네덜란드 사회로의 통합 거부를 조장합니다. PVV는 이들 학교를 폐쇄하여 모든 아동이 종교적 세뇌 없이 네덜란드의 세속 교육 제도 안에서 교육받도록 보장할 것입니다."
 HOL_close_mosques: "모든 모스크 폐쇄"
 HOL_close_mosques_desc: "모스크는 급진화와 반서방 이념의 거점으로 여겨집니다. PVV는 네덜란드의 모든 모스크를 폐쇄하여 이슬람 극단주의의 주요 원천을 차단하고 그 과정에서 네덜란드의 가치와 안보를 지킬 것입니다."
 HOL_strengthening_the_states_general: "전국 신분회 강화"
 HOL_strengthening_the_states_general_desc: "전국 신분회는 총독제의 기둥으로서 모든 주와 지역에 대표권을 제공하여 균형 잡힌 통치와 책임성을 보장할 것입니다."
 HOL_constitutional_oversight_committee: "헌법 감독 위원회"
 HOL_constitutional_oversight_committee_desc: "모든 정부 결정이 왕실의 구상에 부합하도록 보장하는 전담 위원회를 설치하여 투명성과 책임성을 증진합니다."
 HOL_promoting_dutch_enterprise: "네덜란드 기업 육성"
 HOL_promoting_dutch_enterprise_desc: "세금 우대와 관료주의 완화로 네덜란드 기업을 지원하여 혁신을 촉진하고 경제 성장을 보장합니다."
 HOL_support_small_businesses: "소규모 기업 지원"
 HOL_support_small_businesses_desc: "소규모 기업은 우리 경제의 근간입니다. 이들에게 필요한 자원과 기회를 제공하는 것이 번영하는 네덜란드를 보장할 것입니다."
 HOL_balanced_trade_policies: "균형 잡힌 무역 정책"
 HOL_balanced_trade_policies_desc: "네덜란드 산업을 보호하는 동시에 전략적 동반자 관계를 촉진하여 우리 경제를 강화하는 무역 정책을 시행합니다."
 HOL_balanced_trade_policies_tt: "§G이미 혼합 무역 정책을 채택하고 있습니다! 이 중점은 건너뛰게 됩니다§!"
 HOL_education_workforce_development: "교육 및 인력 개발"
 HOL_education_workforce_development_desc: "교육 및 인력 훈련 프로그램에 투자하여 네덜란드 국민이 현대 경제의 도전에 대비할 수 있도록 합니다."
 HOL_infrastructure_for_the_future: "미래를 위한 기반시설"
 HOL_infrastructure_for_the_future_desc: "교통, 연결성, 도시 현대화에 초점을 맞춰 네덜란드 전역에 첨단 기반시설을 구축합니다."
 HOL_guardian_of_dutch_liberty: "네덜란드 자유의 수호자"
 HOL_guardian_of_dutch_liberty_desc: "군주제는 자유와 단결의 상징으로서 네덜란드의 가치를 수호하고 모든 시민의 자유를 보장할 것입니다."
 HOL_royal_economic_control: "왕실의 경제 통제"
 HOL_royal_economic_control_desc: "군주제는 국가 안보를 지키고 지속 가능한 성장을 보장하기 위해 핵심 경제 부문을 직접 통제할 것입니다."
 HOL_royal_patronage_of_culture: "왕실의 문화 후원"
 HOL_royal_patronage_of_culture_desc: "왕실의 후원을 통해 네덜란드 예술과 문화를 지원하여 우리의 공동 유산에 대한 단결과 자긍심을 증진합니다."
 HOL_royal_decree_for_heavy_industry: "중공업 왕령"
 HOL_royal_decree_for_heavy_industry_desc: "중공업을 우선시하고 확대하는 왕령을 발포하여 네덜란드가 선도적인 산업 강국이 되도록 보장합니다."
 HOL_royal_decree_for_naval_industry: "해군 산업 왕령"
 HOL_royal_decree_for_naval_industry_desc: "군주제는 해군 생산력 강화에 주력하여 우리의 해양 우위와 무역로를 확보할 것입니다."
 HOL_royal_degree_industry_promotion: "산업 진흥 왕령"
 HOL_royal_degree_industry_promotion_desc: "왕실의 지침을 통해 네덜란드 산업을 진흥하여 혁신을 장려하고 경제적 번영을 보장합니다."
 HOL_royal_control_of_trade: "왕실의 무역 통제"
 HOL_royal_control_of_trade_desc: "군주제는 모든 대외 무역을 감독하여 네덜란드의 이익을 우선시하고 외세에 대한 의존을 줄일 것입니다."
 HOL_legacy_of_the_crown: "왕실의 유산"
 HOL_legacy_of_the_crown_desc: "군주제의 유산은 단결, 안정, 진보를 이끄는 힘으로 굳건해져 네덜란드가 힘과 번영의 등대로 남도록 보장할 것입니다."
 HOL_dynastic_claims: "왕조의 권리 주장"
 HOL_dynastic_claims_desc: "군주제는 유럽 전역에 걸친 왕조의 권리를 복원하고 대륙에서의 영향력과 위신을 다시 확립하고자 할 것입니다."
 HOL_send_ultimatum_luxembourg: "룩셈부르크에 최후통첩 전달"
 HOL_send_ultimatum_luxembourg_desc: "룩셈부르크 대공국은 언제나 네덜란드 역사의 핵심적인 일부였습니다. 우리는 네덜란드 통치에 대한 복종을 요구하는 최후통첩을 보내, 왕실의 인도 아래 그들이 우리 영토로 통합되도록 보장할 것입니다."
 HOL_send_ultimatum_ireland: "아일랜드에 최후통첩 전달"
 HOL_send_ultimatum_ireland_desc: "아일랜드의 격동의 역사는 섬에 대한 네덜란드의 영향력을 다시 확립할 기회를 제공합니다. 전략적 외교와 왕권을 통해 우리는 왕실의 봉신국으로서 그들의 충성을 요구할 것입니다."
 HOL_send_ultimatum_england: "영국에 최후통첩 발송"
 HOL_send_ultimatum_england_desc: "한때 경쟁자였으나 이제 약해진 영국은 네덜란드의 우위를 확립할 독특한 기회를 제공합니다. 역사적 유대를 상기시키고 왕실의 힘을 과시함으로써, 우리는 동군연합 형태로 네덜란드 통치에 복종할 것을 요구하는 최후통첩을 보낼 것입니다."
 HOL_throne_of_scotland: "스코틀랜드의 왕좌"
 HOL_throne_of_scotland_desc: "네덜란드와 스코틀랜드 사이의 풍부한 역사는 네덜란드 왕실 아래의 재통합 기회를 제공합니다. 왕조의 권리와 왕실의 영향력을 주장함으로써 우리는 스코틀랜드를 우리의 지도 아래 둘 수 있습니다."
 HOL_throne_of_scotland_tt: "중점 §Y왕조의 권리 주장§! 또는 §Y네덜란드 현실정치§!를 완료하면 효과가 표시됩니다 "
 HOL_belgium_problem: "벨기에 문제"
 HOL_belgium_problem_desc: "벨기에의 분열된 정체성과 갈라진 충성심은 독특한 기회를 제공합니다. 군주제는 §Y[BEL.GetNameWithFlag]§!을(를) 분할하는 노력을 이끌어 그 영토를 네덜란드, 프랑스, 독일에 재분배하고, 지역의 안정을 보장하며 플랑드르의 왕실에 대한 충성을 확보할 것입니다."
 HOL_dutch_realpolitik: "네덜란드 현실정치"
 HOL_dutch_realpolitik_desc: "군주제는 유럽 정치에 대해 계산된 접근 방식을 취하여, 영향력을 활용해 이웃 국가들을 동군연합으로 끌어들일 것입니다. 네덜란드의 이익을 우선시하고 외교를 활용함으로써 우리는 유럽에서의 우위를 공고히 할 것입니다."
 HOL_dutch_realpolitik_tt: "중점 §Y왕실의 유산§! 또는 §Y네덜란드 자유의 수호자§!를 §G완료§!하면 이 중점의 효과가 표시됩니다"
 HOL_royal_economic_integration: "왕실 경제 통합"
 HOL_royal_economic_integration_desc: "군주제는 네덜란드 영토의 경제를 통합하는 노력을 이끌어 무역과 단결을 촉진할 것입니다."
 HOL_dutch_defence_pact: "네덜란드 방위 조약"
 HOL_dutch_defence_pact_desc: "우리 영토와 동맹국의 안전과 주권을 지키기 위해 네덜란드가 주도하는 방위 조약을 수립합니다."
 HOL_royal_media: "왕실 언론 캠페인"
 HOL_royal_media_desc: "군주제의 비전을 알리고 왕실 지도력에 대한 대중의 지지를 강화하기 위한 언론 캠페인을 전개합니다."
 HOL_royal_real_projects: "왕실 기반시설 사업"
 HOL_royal_real_projects_desc: "왕실의 감독 아래 대규모 기반시설 사업에 투자하여 진보에 대한 왕실의 헌신을 상징합니다."
 HOL_royal_control_realm: "왕국의 왕실 통제"
 HOL_royal_control_realm_desc: "군주제는 통치의 모든 측면에 대한 통제를 공고히 하여 통합되고 번영하는 네덜란드라는 왕실의 구상이 실현되도록 보장할 것입니다."
 HOL_VOC_tt: "§YVOC 영토§!에 대해 §YVOC 총독 감독 점령법§!을 잠금 해제합니다"
 HOL_territories_plan: "VOC 영토 계획"
 HOL_territories_plan_desc: "인도네시아 너머에는 인도, 타이완, 스리랑카, 남아프리카 같은 지역에 걸친 VOC의 더 넓은 유산이 있습니다. 이들 지역은 한때 네덜란드 무역 제국의 핵심이었으며, 오늘날의 경제적, 전략적 중요성 덕분에 VOC 영향력 재건 캠페인의 최적의 중점이 됩니다."
 HOL_financial_influence_india: "인도 내 금융 영향력 확대"
 HOL_financial_influence_india_desc: "인도의 호황 경제와 금융 중심지는 VOC에 절호의 기회를 제공합니다. 인도의 산업에 투자하고 경제적 유대를 형성함으로써 우리는 핵심 경제 부문을 통제하면서 아대륙에 대한 네덜란드의 존재감을 확대할 수 있습니다."
 HOL_gujurat_trade_port: "구자라트 무역항 수복"
 HOL_gujurat_trade_port_desc: "구자라트의 항구 도시 수라트는 VOC 무역망의 핵심 고리였습니다. 구자라트와의 유대를 되살림으로써 우리는 번성하는 구자라트 경제에 접근하고, 인도양을 오가는 핵심 무역로와 자원을 통제할 수 있습니다."
 HOL_finance_expansion_maharashtra: "마하라슈트라 금융 확장"
 HOL_finance_expansion_maharashtra_desc: "인도의 금융 수도 뭄바이가 있는 마하라슈트라는 산업 생산과 상업의 중심지입니다. 이곳의 산업에 전략적으로 투자함으로써 우리는 인도 경제의 심장부에 VOC의 존재감을 심을 수 있습니다."
 HOL_voc_economic_zone_india: "인도 내 VOC 경제 구역"
 HOL_voc_economic_zone_india_desc: "구자라트와 마하라슈트라를 장악하면 독점적인 VOC 경제 구역을 조성하여 네덜란드의 존재감을 공고히 할 수 있습니다. 이는 우리에게 인도의 방대한 자원에 대한 전례 없는 접근권을 제공하고 남아시아에서의 우위를 확보해 줄 것입니다."
 HOL_taiwan_semiconductor_industry: "타이완 반도체 산업에 영향력 행사"
 HOL_taiwan_semiconductor_industry_desc: "타이완의 반도체 산업은 스마트폰에서 군사 체계에 이르기까지 모든 것을 구동하는 칩을 생산하는 세계 기술의 초석입니다. VOC의 투자를 활용하여 우리는 이 핵심 부문에 발판을 마련하고 네덜란드의 기술 우위를 확보할 수 있습니다."
 HOL_semiconductor_export_control_taiwan: "타이완 반도체 수출 통제"
 HOL_semiconductor_export_control_taiwan_desc: "타이완의 반도체 공급망을 장악함으로써 우리는 세계로 향하는 기술의 흐름을 통제할 수 있습니다. 이는 네덜란드에 세계 시장에 대한 막대한 영향력을 부여하고 VOC가 혁신의 핵심 중재자로 남도록 보장할 것입니다."
 HOL_reclaim_fort_zeelandia: "젤란디아 요새 수복"
 HOL_reclaim_fort_zeelandia_desc: "젤란디아 요새는 한때 타이완에서 VOC 존재감의 중심이었습니다. 이를 네덜란드 이익의 거점으로 되살리는 것은 이 지역에서 상징적이자 전략적인 발판이 되어 이 핵심 섬에 대한 우리의 통제를 강화할 것입니다."
 HOL_modernize_agriculture_srilanka: "스리랑카 농업 현대화"
 HOL_modernize_agriculture_srilanka_desc: "스리랑카의 농업 부문은 여전히 경제의 핵심이지만 비효율에 시달리고 있습니다. 현대 네덜란드 영농 기술을 도입함으로써 우리는 현지 식량 생산을 안정시키는 동시에 섬 전역으로 VOC의 존재감을 확대할 수 있습니다."
 HOL_sustainable_agriculture_srilanka: "스리랑카 지속 가능한 농업 증진"
 HOL_sustainable_agriculture_srilanka_desc: "VOC의 미래는 자원 채취와 지속 가능성의 균형을 맞추는 데 있습니다. 최첨단 농업 개혁을 시행함으로써 우리는 스리랑카의 장기적 번영을 보장하는 동시에 녹색 혁신 분야에서 네덜란드의 주도권을 확립할 수 있습니다."
 HOL_colombo_port_control: "콜롬보 항구 통제"
 HOL_colombo_port_control_desc: "콜롬보의 항구는 인도양을 통한 무역의 핵심 관문입니다. 이들 항구를 장악하면 이 지역에서 네덜란드의 우위가 공고해져, 핵심 공급망과 해상 상업에 대한 VOC의 영향력을 보장할 것입니다."
 HOL_economic_zone_srilanka: "스리랑카 내 VOC 경제 구역"
 HOL_economic_zone_srilanka_desc: "콜롬보의 항구와 스리랑카의 농업을 통제함으로써 우리는 VOC의 존재감을 강력한 경제 구역으로 통합하여 인도양의 전략 자원과 무역로를 확보할 수 있습니다."
 HOL_afrikaner_community_support: "아프리카너 공동체 지원"
 HOL_afrikaner_community_support_desc: "남아프리카의 아프리카너 공동체는 네덜란드 유산과 깊은 역사적 유대를 맺고 있습니다. 이 집단을 지원하면 현지 동맹의 기반이 마련되어 VOC의 영향력이 강화되고 핵심 지역에서의 협력이 보장될 것입니다."
 HOL_afrikaner_political_partnerships: "아프리카너 정치 파트너십 구축"
 HOL_afrikaner_political_partnerships_desc: "아프리카너 정치 운동과 동맹을 맺음으로써 우리는 남아프리카에서 VOC의 존재감을 안정시키고 다른 세력의 저항에 대응하여, 이 지역에서 네덜란드의 이익을 위한 견고한 발판을 보장할 수 있습니다."
 HOL_afrikaner_mining_operations: "아프리카너 광산 사업 통제"
 HOL_afrikaner_mining_operations_desc: "백금과 희토류 금속을 포함한 남아프리카의 광물 자원은 세계 산업에 매우 중요합니다. 아프리카너가 이끄는 광산 사업을 통제함으로써 우리는 이들 자원을 네덜란드 산업을 위해 확보하고 VOC의 경제력을 공고히 할 수 있습니다."
 HOL_resupply_hub_afrika: "남아프리카 재보급 거점"
 HOL_resupply_hub_afrika_desc: "케이프는 언제나 네덜란드 무역의 핵심 재보급 지점이었습니다. 이를 전략적 거점으로 되살리면 네덜란드 함대와 공급망이 대서양과 인도양을 막힘없이 오갈 수 있도록 보장할 것입니다."
 HOL_reclaim_crown_colony: "왕령 식민지 수복"
 HOL_reclaim_crown_colony_desc: "인도네시아는 한때 네덜란드 식민 제국의 보석이었으며 동남아시아에서 VOC 존재감의 심장부 역할을 했습니다. 이를 왕령 식민지로서 되찾으면 우리의 역사적 영유권이 회복되고 이 지역에서 네덜란드의 존재를 재건하는 토대가 될 것입니다."
 HOL_reclaim_batavia: "바타비아 수복"
 HOL_reclaim_batavia_desc: "지금은 자카르타인 바타비아는 한때 동인도 제도에서 VOC 활동의 중심이었습니다. 이 역사적인 도시를 우리의 행정 및 병참 거점으로 되찾는 것은 이 지역에서 네덜란드 우위의 귀환을 상징할 것입니다."
 HOL_secret_embassy_expansion: "비밀 대사관 활동 확대"
 HOL_secret_embassy_expansion_desc: "네덜란드의 영향력에 대한 저항을 약화시키려면 우리는 대사관과 정보 활동망을 은밀히 확대해야 합니다. 이러한 비밀 활동은 VOC 통제의 매끄러운 재확립을 위한 길을 닦을 것입니다."
 HOL_reclaim_outer_islands: "외곽 섬 수복"
 HOL_reclaim_outer_islands_desc: "자바 너머에는 자원이 풍부하고 전략적으로 중요한 인도네시아 군도가 광대하게 펼쳐져 있습니다. 외곽 섬에 대한 통제권을 확보하면 이 지역에서의 장악력이 강화되고 VOC에 중요한 자산이 제공될 것입니다."
 HOL_contact_rebels_indonesia: "인도네시아 반군 접촉"
 HOL_contact_rebels_indonesia_desc: "인도네시아 내의 모두가 현 정부에 충성하는 것은 아닙니다. 반체제 인사와 반군 단체를 은밀히 지원함으로써 우리는 현지 권력을 불안정하게 하고 VOC 재기의 문을 열 수 있습니다."
 HOL_rebuilding_dutch_indies: "네덜란드령 동인도 재건"
 HOL_rebuilding_dutch_indies_desc: "네덜란드령 동인도는 한때 VOC의 통치 아래 번영한 식민지였습니다. 안정과 번영을 보장하려면 우리는 그 기반시설을 재건하고, 통치를 강화하며, 네덜란드 영향력의 초석으로서의 지위를 회복해야 합니다."
 HOL_rebuilding_batavia: "바타비아 재건"
 HOL_rebuilding_batavia_desc: "인도네시아에서 네덜란드 통치의 역사적 중심지였던 바타비아는 활기를 되찾아야 합니다. 기반시설과 행정 역량을 현대화하면 동남아시아에서 VOC 활동의 거점으로 확고히 자리 잡을 것입니다."
 HOL_indonesian_infrastructure_modernization: "인도네시아 기반시설 현대화"
 HOL_indonesian_infrastructure_modernization_desc: "인도네시아의 기반시설은 경제의 근간입니다. 현대화 노력에 투자함으로써 우리는 교통망을 개선하고, 자원 채취를 향상시키며, 군도 전역에 네덜란드식 효율성을 확립할 수 있습니다."
 HOL_indonesian_industry_investment: "인도네시아 산업에 투자"
 HOL_indonesian_industry_investment_desc: "인도네시아의 산업 잠재력은 방대하며, 네덜란드의 투자로 이를 열어젖힐 수 있습니다. 공장과 생산 거점을 확장함으로써 우리는 경제적 우위와 VOC가 이끄는 인도네시아의 번영을 보장할 것입니다."
 HOL_indonesian_resource_extraction: "인도네시아 자원 채취 강화"
 HOL_indonesian_resource_extraction_desc: "향신료에서 광물에 이르기까지 인도네시아의 천연자원은 여전히 세계 무역에 중요합니다. 자원 채취 역량을 강화함으로써 우리는 이들 자산을 네덜란드 산업과 VOC의 부를 위해 확보할 수 있습니다."
 HOL_terra_australis_claims: "테라 아우스트랄리스 영유권 주장"
 HOL_terra_australis_claims_desc: "네덜란드인은 오스트레일리아 해안을 최초로 측량한 유럽인 가운데 하나였습니다. 테라 아우스트랄리스에 대한 역사적 영유권을 주장함으로써 우리는 VOC의 존재감을 확대하고 자원이 풍부한 이 대륙의 개발에서 우리의 자리를 확보할 수 있습니다."
 HOL_voc_australia_corridor: "오스트레일리아 무역 회랑 구축"
 HOL_voc_australia_corridor_desc: "서오스트레일리아를 오스트레일리아의 나머지 지역과 무역 및 기반시설로 연결하면 이 지역 전반에서 네덜란드의 존재감이 공고해질 것입니다. 이 회랑은 자원, 상업, 그리고 네덜란드가 주도하는 경제 통합의 핵심 연결 고리가 될 것입니다."
 HOL_malacca_trade_legacy: "말라카 무역 유산 부활"
 HOL_malacca_trade_legacy_desc: "말라카 해협은 한때 동양과 서양을 잇는 VOC 무역의 생명선이었습니다. 이 핵심 지역에서 우위를 재확립함으로써 우리는 세계 상업 항로에 대한 통제권을 확보하고 네덜란드의 경제력을 강화할 수 있습니다."
 HOL_economic_integration_malacca: "말라카 경제 통합"
 HOL_economic_integration_malacca_desc: "네덜란드령 동인도와 새로 병합된 말라카, 싱가포르, 브루나이 영토는 막대한 경제적 잠재력을 지니고 있습니다. 이 잠재력을 열기 위해 우리는 네덜란드 철도(NS)의 효율성에서 영감을 얻은 현대적 철도망으로 이들 지역을 네덜란드령 동인도의 심장부와 연결할 것을 제안합니다. 이 철도망은 무역을 촉진하고, 통합을 증진하며, 이들 전략적 영토에 대한 네덜란드의 통제를 공고히 할 것입니다."
 HOL_strategic_voc_presence: "전략적 VOC 거점 구축"
 HOL_strategic_voc_presence_desc: "한때 VOC가 통치했던 핵심 영토를 장악하면 우리는 세계적 강국으로서의 입지를 공고히 할 수 있습니다. 이들 지역에 전략적 발판을 구축하면 현대에도 네덜란드의 우위가 보장될 것입니다."
 HOL_strategic_voc_presence_tt: "새로 획득한 영토의 고유한 강점과 특화 분야를 활용하여 VOC를 강화하는 §Y결정§!을 잠금 해제합니다."
 HOL_personal_union_england: "영국과의 동군연합"
 HOL_personal_union_england_desc: "네덜란드와 영국 사이의 역사적 유대는 깊지만, 정치적, 왕실적 관계는 종종 격동적이었습니다. 외교를 신중히 이끌고 공동의 이익을 활용함으로써 우리는 영국과의 동군연합을 추구하여, 네덜란드의 지도 아래 두 왕관을 통합하고 강력한 초국가적 군주제를 형성할 수 있습니다."
 HOL_personal_union_ireland: "아일랜드와의 동군연합"
 HOL_personal_union_ireland_desc: "아일랜드의 전략적 중요성과 문화적 연관은 아일랜드를 네덜란드가 이끄는 군주제의 귀중한 일원으로 만듭니다. 아일랜드 지도자들과 유대를 쌓고 연합에 대한 설득력 있는 논거를 제시함으로써 우리는 아일랜드와 동군연합을 맺어 브리튼 제도 전역에서 네덜란드 왕실의 영향력을 강화할 수 있습니다."
 HOL_personal_union_luxembourg: "룩셈부르크와의 동군연합"
 HOL_personal_union_luxembourg_desc: "작지만 역사적으로 중요한 이웃인 룩셈부르크는 네덜란드와 왕실 간의 연관을 공유합니다. 공동의 역사를 강조하고 정치적, 경제적 안정을 제공함으로써 우리는 동군연합을 통해 룩셈부르크를 네덜란드의 통제 아래 두고 더욱 긴밀하고 통합된 저지대 국가를 만들 수 있습니다."
 HOL_cape_economic_zone: "케이프 경제 구역"
 HOL_cape_economic_zone_desc: "희망봉은 언제나 세계 무역의 핵심 교차로였습니다. 케이프 경제 구역을 설립함으로써 우리는 이 지역을 번영하는 상업 및 산업의 거점으로 탈바꿈시켜, 유럽, 아시아, 아프리카를 잇는 전략 항로를 네덜란드의 영향력이 지배하도록 보장할 수 있습니다."
 HOL_repair_ties_with_USA: "미국과의 관계 회복"
 HOL_repair_ties_with_USA_desc: "민주주의의 길에서 벗어나 총독 아래 군주제를 복원했음에도 불구하고, 우리는 미국과 보조를 맞추는 것이 전략적으로 중요하다는 점을 인식하고 있습니다. 관계를 개선함으로써 우리는 주요 비NATO 동맹국의 지위를 확립하여, 주권과 왕실의 전통을 유지하면서 상호 안보와 경제적 이익을 보장할 수 있습니다."
 HOL_wic_build_up_atlantic_fleet: "대서양 함대 증강"
 HOL_wic_build_up_atlantic_fleet_desc: "한때 WIC 아래에 있던 영토를 되찾으려면 대서양 전역에 힘을 투사할 수 있는 해군이 필요합니다. 함대를 확장하고 현대화함으로써 우리는 바다에서의 네덜란드 우위와 필요할 때 결정적으로 타격할 능력을 보장할 것입니다."
 HOL_wic_increase_ranged_aircraft: "장거리 항공기 역량 확대"
 HOL_wic_increase_ranged_aircraft_desc: "WIC 영토를 되찾으려면 광대한 거리에 걸친 제공권 장악이 필요합니다. 장거리 항공기를 개발하고 배치하면 대서양 전역에 공군력을 투사하고 해군 및 지상 작전에 결정적인 지원을 제공할 수 있습니다."
 HOL_wic_terrain_training: "특수 지형 훈련"
 HOL_wic_terrain_training_desc: "울창한 정글에서 해안 지역에 이르기까지 WIC 영토의 다양한 지형은 우리 병력이 어려운 조건에 완전히 대비할 것을 요구합니다. 특수 지형 훈련에 투자함으로써 우리는 우리 군이 어떤 장애물에도 적응하고 극복할 수 있도록 보장할 것입니다."
 HOL_wic_invasion_training: "상륙 침공 훈련 실시"
 HOL_wic_invasion_training_desc: "WIC 영토는 광대한 바다로 보호받고 있습니다. 이를 성공적으로 되찾으려면 우리 군은 상륙전의 기술을 숙달해야 합니다. 대규모 침공 훈련을 실시함으로써 우리는 향후 상륙의 성공을 보장할 수 있습니다."
 HOL_wic_trade_company: "WIC 무역 회사"
 HOL_wic_trade_company_desc: "서인도 회사는 한때 아메리카와 대서양에서 네덜란드 영향력의 초석이었습니다. 이 역사적인 기관을 되살리면 우리는 무역망을 지배하고 이 지역의 경제 확장을 위한 토대를 마련할 수 있습니다."
 HOL_wic_trade_company_tt: "§YWIC§!의 §Y무역 회사 중점§!을 선택하면 잠금 해제됩니다"
 HOL_wic_increase_embassy_personnel: "대사관 인력 증원"
 HOL_wic_increase_embassy_personnel_desc: "외교적 접촉은 WIC 영토에서 우리의 영향력을 확대하는 데 매우 중요합니다. 대사관 인력과 외교 자원을 늘림으로써 우리는 관계를 강화하고 해외에서 네덜란드의 이익을 증진할 수 있습니다."
 HOL_wic_financial_networks: "금융망 확대"
 HOL_wic_financial_networks_desc: "WIC 영토에 견고한 금융 거점을 구축하면 그 경제에 대한 네덜란드의 우위가 확보될 것입니다. 이들 지역을 우리의 은행 체계에 통합함으로써 장기적인 영향력을 공고히 할 수 있습니다."
 HOL_wic_financial_networks_tt1: "§R완전히 업그레이드하면§! §YING 그룹§!§R의 보너스가 크게 강화됩니다!§!"
 HOL_wic_financial_networks_tt2: "§G현재 우리는 업그레이드된§! §YING 그룹§!의 잠재력을 온전히 누리고 있습니다."
 HOL_wic_debt_policy: "채무 외교 시행"
 HOL_wic_debt_policy_desc: "전략적 대출은 영향력을 행사하는 강력한 수단이 될 수 있습니다. 계산된 대출을 통해 재정적 의존성을 만들어 냄으로써 우리는 현지 정부가 네덜란드의 이익에 부합하도록 만들 수 있습니다."
 HOL_wic_dutch_aid_program: "네덜란드 원조 프로그램 개시"
 HOL_wic_dutch_aid_program_desc: "개발 원조는 WIC 영토에서 호의와 협력을 증진할 수 있습니다. 기반시설과 지역 경제에 투자함으로써 우리는 네덜란드의 지도 아래 평화로운 통합을 위한 길을 닦을 수 있습니다."
 HOL_wic_colonial_management: "WIC 식민지 관리 강화"
 HOL_wic_colonial_management_desc: "서인도 회사의 사업이 번창하려면 효율적인 식민지 행정이 필요합니다. 관리 구조를 강화하고 통치를 간소화함으로써 우리는 영토의 수익성을 극대화하고 대서양 전역에서 네덜란드 영향력의 안정을 보장할 수 있습니다."
 HOL_wic_colonial_management_tt: "§YWIC 영토§!에 대해 §YWIC 식민지 관리 점령법§!을 잠금 해제합니다"
 HOL_dutch_dakar: "다카르와 호레이의 유산 수복"
 HOL_dutch_dakar_desc: "한때 서아프리카에서 네덜란드 존재의 등대였던 호레이 섬은 너무 오랫동안 타인의 손에 남겨져 있었습니다. 전략적 위치와 경제적 잠재력을 지닌 다카르는 이 지역에서 우리의 역사적 영향력을 되찾을 기회를 의미합니다. 다카르와 그 주변 영토에 대한 통제권을 주장함으로써 우리는 세네갈에서 네덜란드의 유산을 복원하고 대서양 전역에 걸친 무역과 힘 투사의 핵심 거점을 마련할 것입니다."
 HOL_goeree_reconstruction: "호레이 기반시설 재건"
 HOL_goeree_reconstruction_desc: "호레이와 그 주변 영토가 네덜란드의 통제 아래 놓였으므로, 현대적 기반시설에 투자하는 것이 필수적입니다. 교통망, 무역 시설, 지역 산업을 개선함으로써 우리는 이 지역을 번영하는 경제 거점이자 서아프리카에서 네덜란드 영향력의 핵심 자산으로 탈바꿈시킬 수 있습니다."
 HOL_goeree_reconstruction_tt: "§Y[363.GetName]§! 또는 §Y[364.GetName]§!을(를) 통제하고 있으면 효과가 표시됩니다"
 HOL_wic_africa: "아프리카에서 네덜란드의 영유권 재주장"
 HOL_wic_africa_desc: "아프리카에서의 네덜란드의 존재는 특히 케이프와 세네갈 같은 전략적 지역에서 서인도 회사 영향력의 초석이었습니다. 우리의 역사적 영유권을 재주장함으로써 우리는 이들 핵심 영토에 대한 네덜란드의 통제를 회복하고 대륙에서의 향후 확장을 위한 발판을 확보할 수 있습니다."
 HOL_wic_caribbean: "카리브 해에서 네덜란드의 유산 수복"
 HOL_wic_caribbean_desc: "카리브 해는 부와 기회가 넘치는 지역으로 서인도 회사의 생명줄이었습니다. 사탕수수 농장에서 핵심 무역 거점에 이르기까지, 이제 우리의 존재를 다시 확립하고 이 섬들을 네덜란드 영향력의 품으로 되돌릴 때입니다."
 HOL_wic_south_america: "네덜란드 영향력 재확립"
 HOL_wic_south_america_desc: "남아메리카는 한때, 특히 자원과 무역 기회가 풍부한 지역에서 네덜란드의 야망의 흔적을 지니고 있었습니다. 이곳에서 우리의 유산을 되찾는 것은 역사적 정의를 회복할 뿐만 아니라 네덜란드에 막대한 경제적, 전략적 이점을 제공할 것입니다."
 HOL_wic_new_holland: "뉴네덜란드 수복"
 HOL_wic_new_holland_desc: "오늘날의 뉴욕인 번영하던 식민지 뉴암스테르담을 포함했던 뉴네덜란드는 아메리카에서 네덜란드의 진취성과 야망을 보여주는 증거였습니다. 비록 역사 속으로 사라졌지만, 이 지역은 여전히 무역과 영향력의 핵심 거점입니다. 이 영토에 대한 영유권을 재주장함으로써 우리는 네덜란드의 위신을 회복하고 세계에서 가장 중요한 경제 중심지 중 하나에서 우리의 존재를 되살릴 것입니다."
 HOL_wic_angola: "코르넬리스 욜의 앙골라 구상"
 HOL_wic_angola_desc: "'하우테베인(나무다리)'으로 알려진 대담한 네덜란드 제독 코르넬리스 욜은 서인도 회사의 전성기에 로앙고-앙골라에서 네덜란드의 영향력을 확보하려는 노력으로 앙골라에 흔적을 남겼습니다. 자원과 전략적 잠재력이 풍부한 이 핵심 지역을 되찾음으로써 우리는 그의 유산을 기리고 아프리카에서 네덜란드의 우위를 회복할 것입니다. 앙골라는 다시 한번 네덜란드의 핵심 발판이 될 것입니다."
 HOL_reclaim_puerto_rico: "산후안 바우티스타 수복"
 HOL_reclaim_puerto_rico_desc: "한때 유럽 식민 열강에게 전략적 보석으로 여겨졌던, 과거 산후안 바우티스타로 불린 푸에르토리코는 오랫동안 카리브 해에서 무역과 군사적 주둔에 막대한 중요성을 지녀 왔습니다. 이곳을 되찾음으로써 우리는 카리브 해의 심장부에서 네덜란드의 영향력을 회복하고 서인도 회사의 야망을 되살릴 것입니다."
 HOL_reclaim_british_antilles: "영국령 앤틸리스 제도 통제권 재확립"
 HOL_reclaim_british_antilles_desc: "세인트키츠 네비스 같은 섬을 포함한 영국령 앤틸리스 제도는 한때 유럽 팽창의 절정기에 분쟁의 대상이던 영토였습니다. 이들 섬을 되찾으면 카리브 해에서 중요한 발판을 회복하고, 네덜란드의 해상 항로를 강화하며, 우리 식민지 야망의 유산을 기릴 수 있을 것입니다."
 HOL_reclaim_trinidad: "뉴 발헤런 수복"
 HOL_reclaim_trinidad_desc: "17세기 초 네덜란드 탐험가들은 자원이 풍부하고 전략적 위치에 있는 트리니다드에 대한 영향력을 확립하고자 했습니다. 이곳은 한때 젤란트에 있는 네덜란드 섬의 이름을 딴 뉴 발헤런으로 짧게 구상되기도 했습니다. 트리니다드에 대한 통제권을 재확립하면 카리브 해의 핵심 무역로와 자원을 확보할 수 있을 것입니다."
 HOL_wic_goldcoast: "황금 해안 통제권 재확립"
 HOL_wic_goldcoast_desc: "유서 깊은 요새와 풍부한 자원을 지닌 황금 해안은 한때 네덜란드 서인도 회사 활동의 핵심 부분이었습니다. 이 지역에 대한 통제권을 재확립함으로써 우리는 한때 네덜란드 식민 제국을 지탱했던 경제적 우위를 되살리고 서아프리카의 핵심 발판을 확보할 수 있습니다."
 HOL_wic_congo: "콩고 분지로 영향력 확대"
 HOL_wic_congo_desc: "천연자원이 풍부하고 전략적 위치에 있는 콩고는 우리의 야망에 막대한 잠재력을 지니고 있습니다. 이 지역에 대한 통제권을 확립함으로써 우리는 중앙아프리카에서 네덜란드의 영향력을 공고히 하고 서인도 회사의 유산을 뒷받침하는 핵심 무역 및 자원 항로를 확보할 수 있습니다."
 HOL_wic_saint_helena: "VOC 재보급 거점"
 HOL_wic_saint_helena_desc: "세인트헬레나는 범선 시대에 VOC 소속 네덜란드 함대의 핵심 재보급 기지로서 유럽과 동인도 사이를 오가는 선박의 생명줄 역할을 했습니다. 이 섬을 되찾음으로써 우리는 대서양의 핵심 해군 거점으로서의 전략적 중요성을 회복하고 세계 해양 우위를 강화할 수 있습니다."
 HOL_wic_island_hubs: "섬 무역 거점 개발"
 HOL_wic_island_hubs_desc: "퀴라소를 비롯한 카리브 해의 섬들은 핵심 무역 및 자원 거점으로서 큰 경제적 잠재력을 지니고 있습니다. 기반시설과 지역 산업에 투자함으로써 우리는 이들 섬을 네덜란드의 영향력을 뒷받침하는 경제 강국으로 탈바꿈시키고 세계 무역망의 핵심 결절점으로서의 역할을 확보할 수 있습니다."
 HOL_wic_fortress_islands: "카리브 해 섬 요새화"
 HOL_wic_fortress_islands_desc: "퀴라소와 앤틸리스 제도 같은 섬들의 전략적 위치는 이들을 외세의 주요 표적으로 만듭니다. 이들 섬을 요새화된 거점으로 만듦으로써 우리는 카리브 해에서의 장악력을 확보하고, 잠재적 침략자를 저지하며, 이들이 네덜란드 해양 방어의 보루로 기능하도록 보장할 수 있습니다."
 HOL_reclaim_suriname: "네덜란드령 기아나의 보석"
 HOL_reclaim_suriname_desc: "한때 네덜란드령 기아나의 보석이던 수리남은 남아메리카에서 우리 식민 제국의 초석이었습니다. 풍부한 천연자원, 비옥한 땅, 전략적 위치를 지닌 수리남을 되찾는 것은 아메리카에서 네덜란드의 영향력을 회복할 뿐만 아니라 서인도 회사의 야망도 되살릴 것입니다. 이제 수리남을 다시 네덜란드의 깃발 아래로 되돌릴 때입니다."
 HOL_reclaim_guyana: "네덜란드령 기아나 통합"
 HOL_reclaim_guyana_desc: "수리남이 다시 네덜란드의 통제 아래 놓이면서, 남아메리카에서의 우리의 야망은 아직 완성되지 않았습니다. 역사적으로 분쟁 지역인 기아나 지역의 일부였던 가이아나는 네덜란드령 기아나의 통합을 회복하기 위해 우리의 영향권에 들어와야 합니다. 풍부한 자원과 대서양을 따라 놓인 전략적 위치는 가이아나를 성장하는 우리 제국에 필수적인 추가분이자 서인도 회사의 유산을 되살리는 한 걸음 더 가까운 단계로 만듭니다."
 HOL_reclaim_french_guyana: "프랑스령 기아나 수복"
 HOL_reclaim_french_guyana_desc: "수리남을 확보하고 남아메리카에서의 발판이 강화된 만큼, 이제 기아나 지역의 통합을 완성할 때입니다. 역사적으로 프랑스의 통제 아래 있었지만, 프랑스령 기아나는 아메리카에서의 네덜란드 우위라는 우리의 더 큰 야망의 일부였습니다. 전략적 위치와 개발되지 않은 자원은 이곳을 성장하는 우리 영향력에 반드시 필요한 추가분으로 만듭니다."
 HOL_united_guyana_development: "통합 기아나 영토 개발"
 HOL_united_guyana_development_desc: "네덜란드령 기아나 전체가 우리의 통제 아래 통합된 만큼, 우리는 기반시설과 산업을 현대화하는 데 집중해야 합니다. 대규모 철도와 산업 시설에 투자함으로써 우리는 이 지역을 번영하는 경제 거점으로 탈바꿈시키고, 도시들을 연결하며, 네덜란드 경제를 위한 모든 잠재력을 열 수 있습니다."
 HOL_united_guyana_resources: "기아나의 풍부한 자원 개발"
 HOL_united_guyana_resources_desc: "통합된 기아나 지역에는 보크사이트에서 목재, 기타 광물에 이르기까지 개발되지 않은 자원이 풍부합니다. 자원 채취에 집중하고 광산 사업을 현대화함으로써 우리는 이 영토를 원자재 공급의 강자로 탈바꿈시켜 앞으로 수십 년간 네덜란드의 산업과 무역을 뒷받침할 수 있습니다."
 HOL_reclaim_usa: "뉴네덜란드 복원"
 HOL_reclaim_usa_desc: "17세기 초에 건설된 뉴네덜란드는 북아메리카에서 네덜란드 탐험과 상업의 등대였습니다. 뉴암스테르담을 중심으로 한 이 식민지는 영국의 손에 넘어가기 전까지 우리의 해양 및 상업적 역량을 보여주는 증거였습니다. 이 땅을 되찾음으로써 우리는 선조들의 유산을 기리고, 아메리카에서 네덜란드의 영향력을 재확립하며, 역사의 흐름을 다시 쓸 것입니다."
 HOL_reclaim_brasil: "네덜란드령 브라질 수복"
 HOL_reclaim_brasil_desc: "17세기 전성기에 뉴홀란드로 알려진 네덜란드령 브라질은 우리의 통제 아래 번영하던 식민지였습니다. 헤시피에서 페르남부쿠에 이르기까지 네덜란드 서인도 회사는 남아메리카에서 이베리아의 우위에 도전하는 농장, 무역로, 요새를 건설했습니다. 비록 수 세기 전에 이 영토를 잃었지만, 이를 되찾으면 브라질에서 네덜란드의 영향력이 회복되고 우리 식민지 야망의 유산이 되살아날 것입니다."
 HOL_march_on_binnenhof: "비넨호프로 진군"
 HOL_march_on_binnenhof_desc: "네덜란드 민주주의의 중심인 비넨호프는 낡고 무능한 자유주의 질서의 상징으로 서 있습니다. 이제 NVU가 비넨호프로 진군하여 정부의 통제권을 장악하고 강력하고 결단력 있는 지도력의 새 시대를 열 때입니다. 네덜란드는 단결과 힘의 깃발 아래 다시 태어나야 합니다."
 HOL_eliminate_political_opposition: "정치적 반대 세력 제거"
 HOL_eliminate_political_opposition_desc: "반대와 전복 활동은 네덜란드에 대한 NVU의 구상을 약화시킵니다. 새 체제의 안정과 힘을 보장하기 위해 우리는 정당, 노조, 지하 운동을 막론하고 모든 반대 세력을 뿌리 뽑아야 합니다."
 HOL_military_independence: "군의 독립성 보존"
 HOL_military_independence_desc: "군대는 전문성을 유지하고 과도한 정치적 간섭으로부터 자유로워야 합니다. NVU에 대한 충성이 최우선이지만, 노골적인 정치화의 함정을 피하고 효율성과 규율을 유지하기 위해 군이 작전상의 독립성을 유지하는 것이 필수적입니다."
 HOL_loyal_army: "충성스러운 군대 건설"
 HOL_loyal_army_desc: "군대에서 반대자와 전복적 영향력을 숙청해야 합니다. 훈련과 이념 강화를 통해 우리는 NVU와 네덜란드에 대한 그 구상에 흔들림 없이 충성하는 군대를 건설할 것입니다."
 HOL_glorify_veterans: "국가의 참전 용사 찬양"
 HOL_glorify_veterans_desc: "우리 참전 용사들은 네덜란드를 위해 모든 것을 바쳤습니다. 그들의 희생을 기리고 NVU의 의제 안으로 끌어들임으로써 우리는 국민과 군대 사이의 유대를 강화할 것입니다."
 HOL_control_media_narrative: "언론 담론 통제"
 HOL_control_media_narrative_desc: "언론은 여론을 형성하는 강력한 도구입니다. 모든 형태의 통신을 국가 통제 아래 둠으로써 우리는 네덜란드 국민이 단결과 진보라는 NVU의 구상에 부합하는 목소리로만 정보를 얻도록 보장할 것입니다."
 HOL_nationalistic_education_reform: "민족주의적 교육 개혁"
 HOL_nationalistic_education_reform_desc: "우리 학교는 규율 있고 애국적인 사회의 토대 역할을 해야 합니다. 국가적 자긍심과 충성을 우선시하도록 교육 제도를 개혁함으로써 우리는 다음 세대가 NVU의 이상을 받들도록 보장할 것입니다."
 HOL_accelerate_national_industrialization: "국가 산업화 가속"
 HOL_accelerate_national_industrialization_desc: "강력하고 자급자족하는 경제를 건설하기 위해 우리는 급속한 산업 발전을 우선시해야 합니다. 현대적인 공장과 기반시설은 선도적인 경제 강국으로서의 우리의 입지를 확보해 줄 것입니다."
 HOL_establish_corporatist_economy: "조합주의 경제 수립"
 HOL_establish_corporatist_economy_desc: "NVU는 조합주의 모델 아래 노동, 산업, 국가의 이익을 일치시킬 것입니다. 이러한 통합된 접근 방식은 비효율을 제거하고 국가 경제가 조화롭게 운영되도록 보장할 것입니다."
 HOL_expand_resource_extraction: "자원 채취 확대"
 HOL_expand_resource_extraction_desc: "네덜란드의 경제력은 산업 및 군수 생산에 필요한 자원을 확보하는 데 달려 있습니다. 채취 노력을 현대화함으로써 우리는 생산량을 극대화하고 안정적인 공급을 보장할 것입니다."
 HOL_pursue_technological_autarky: "기술 자급자족 추구"
 HOL_pursue_technological_autarky_desc: "기술에 대한 외국 의존은 우리의 독립을 약화시킵니다. 최첨단 연구 개발에 투자함으로써 네덜란드는 기술적 자급자족을 달성하고 예측할 수 없는 세계에서 미래를 확보할 것입니다."
 HOL_german_youth_netherlands: "네덜란드 내 독일식 청소년 프로그램"
 HOL_german_youth_netherlands_desc: "청소년은 국가의 미래입니다. 독일에서 영감을 얻은 훈련 및 이념 교육 프로그램을 도입함으로써 우리는 다음 세대 네덜란드 시민에게 충성, 규율, 힘을 심어줄 것입니다."
 HOL_national_labor_programs: "국가 노동 프로그램 시행"
 HOL_national_labor_programs_desc: "국가가 주도하는 노동 구상 아래 노동력을 동원하면 실업이 사라지고 모든 시민이 국가의 번영에 기여하게 될 것입니다."
 HOL_stabilize_dutch_society: "네덜란드 사회 안정화"
 HOL_stabilize_dutch_society_desc: "전면적인 개혁이 진행되는 가운데 사회의 안정과 질서를 보장하는 것이 최우선입니다. 반대를 줄이고 규율을 강제하는 조치가 장기적 성공의 토대를 마련할 것입니다."
 HOL_german_blood: "게르만의 피"
 HOL_german_blood_desc: "혈통과 유산의 유대가 게르만 민족을 하나로 묶고 있습니다. 이 공통의 계보에 속한 네덜란드는 지도자의 책무를 짊어져야 합니다. 모든 게르만 민족을 재결합함으로써 우리는 강력하고 깨지지 않는 연합을 이루어 유럽 전역에서 우리 혈통의 우위를 보장할 것입니다."
 HOL_support_german_brothers: "독일 형제 지원"
 HOL_support_german_brothers_desc: "게르만 민족은 너무 오랫동안 분열과 고난을 겪어 왔습니다. 정치적, 군사적으로 우리의 지원을 제공함으로써 우리는 국가 간의 유대를 강화하고 통합된 게르만의 운명으로 가는 길을 닦을 것입니다."
 HOL_claim_german_leadership: "게르만 민족의 지도력 선포"
 HOL_claim_german_leadership_desc: "네덜란드는 게르만 세계의 지도자로서 마땅한 자리를 차지해야 합니다. 우리의 권위를 주장하고 모든 게르만 민족을 하나의 깃발 아래 통합함으로써 우리는 힘과 유산으로 이루어진 깨지지 않는 연합을 만들 것입니다."
 HOL_unite_with_germany: "독일과의 통합"
 HOL_unite_with_germany_desc: "게르만 민족의 분열은 부자연스러운 상태입니다. 독일을 우리의 단결 구상에 통합함으로써 우리는 권력을 공고히 하고 게르만 제국을 위한 더욱 강력한 토대를 마련할 것입니다."
 HOL_luftwafe_legacy: "루프트바페의 유산 계승"
 HOL_luftwafe_legacy_desc: "독일의 루프트바페는 한때 유럽의 하늘을 지배했습니다. 그 전술을 현대화하고 혁신을 통합함으로써 우리는 대륙 전역에서 제공권 우위를 확립하여 우리 군의 안보와 우위를 보장할 것입니다."
 HOL_blitzkrieg_legacy: "전격전의 유산 숙달"
 HOL_blitzkrieg_legacy_desc: "독일은 속도와 정밀함을 결합해 적을 압도하는 전격전 교리로 전쟁에 혁명을 일으켰습니다. 이 유산을 정련함으로써 우리는 신속하고 결정적인 승리를 거둘 수 있는 막을 수 없는 군사력을 개발할 것입니다."
 HOL_siegfriedline: "강철 방패"
 HOL_siegfriedline_desc: "게르만 세계의 서쪽 국경은 어떠한 외부 위협에도 뚫려서는 안 됩니다. '강철 방패'를 건설함으로써 우리는 게르만 민족의 굽히지 않는 힘과 회복력을 상징하는 현대적인 요새 및 방어 시설망을 구축할 것입니다. 이 새로운 방어선은 우리의 결의와 대비 태세를 증명하는 기념물로 서게 될 것입니다."
 HOL_anschluss: "안슐루스"
 HOL_anschluss_desc: "오스트리아의 운명은 언제나 게르만 민족과 연결되어 있었습니다. 오스트리아를 나머지 게르만 국가와 재결합시킴으로써 우리는 통일된 게르만 조국이라는 역사적 비전을 실현할 것입니다."
 HOL_austrian_mountaineers: "산악전의 유산"
 HOL_austrian_mountaineers_desc: "오스트리아의 역사는 유럽의 혹독한 알프스 환경에서 단련된 산악전 숙련에 깊이 스며 있습니다. 이 유산을 우리 군에 통합함으로써 우리는 모든 보병 부대가 산악 지형에서 우세를 점할 수 있도록 하고, 자연 장애물을 전략적 이점으로 바꿀 것입니다."
 HOL_german_brotherhood_of_nations: "게르만 국가 형제단"
 HOL_german_brotherhood_of_nations_desc: "게르만 민족의 미래를 확보하기 위해 우리는 공동의 구상에 헌신하는 뜻을 같이하는 국가들로 이루어진 세력을 수립할 것입니다. 이 형제단은 힘으로 단결하여 우리의 운명을 훼손하려는 이들에 맞서는 깨지지 않는 동맹을 만들어 갈 것입니다."
 HOL_germanic_industrial_union: "게르만 산업 연합 수립"
 HOL_germanic_industrial_union_desc: "게르만 국가들에 걸친 통합된 산업적 노력은 강력하고 자급자족하는 경제를 보장할 것입니다. 생산을 조율하고 자원을 공유함으로써 우리는 전례 없는 효율성을 달성하고 세계 시장을 지배할 것입니다."
 HOL_germanic_infrastructure_efforts: "게르만 기반시설 사업 개시"
 HOL_germanic_infrastructure_efforts_desc: "게르만 형제단은 이념적으로만이 아니라 물리적으로도 통합되어야 합니다. 우리 영토를 연결하는 현대적 기반시설을 개발함으로써 우리는 자원, 물자, 군대의 원활한 흐름을 보장할 것입니다."
 HOL_rhineland_resources: "라인란트의 자원"
 HOL_rhineland_resources_desc: "라인란트는 석탄, 강철, 그 밖의 핵심 자원의 보고입니다. 채취 사업을 현대화함으로써 우리는 게르만 형제단의 산업 및 군사적 야망을 뒷받침할 것입니다."
 HOL_invite_austria: "오스트리아를 형제단에 초청"
 HOL_invite_austria_desc: "게르만 세계에서 오스트리아의 자리는 부인할 수 없습니다. 오스트리아를 국가 형제단에 가입하도록 초청함으로써 우리는 세력을 강화하고 게르만 유산의 또 다른 보루를 품에 들일 것입니다."
 HOL_austrian_mineral_wealth: "오스트리아의 광물 자원"
 HOL_austrian_mineral_wealth_desc: "오스트리아의 산악에는 우리 산업에 필수적인 핵심 광물이 풍부합니다. 이들 자원을 개발함으로써 우리는 형제단의 산업 기반이 비할 데 없이 유지되도록 보장할 것입니다."
 HOL_railroad_of_germans: "게르만 민족의 철도"
 HOL_railroad_of_germans_desc: "게르만 국가들을 잇는 거대한 철도는 우리 형제단의 근간 역할을 할 것입니다. 이 야심 찬 사업은 무역, 동원, 단결을 촉진하여 유럽에서 우리의 우위를 공고히 할 것입니다."
 HOL_kickstart_austrian_navy: "오스트리아 해군 시동"
 HOL_kickstart_austrian_navy_desc: "해군 전통의 부재로 오스트리아의 해상 영향력은 제한되었지만, 우리의 조선 전문성으로 이는 달라질 것입니다. 네덜란드의 해양 우위 유산을 활용하여 우리는 오스트리아의 해군 역량을 확립하고, 오스트리아를 게르만 형제단의 힘 투사에 핵심적으로 기여하는 존재로 만들 것입니다."
 HOL_integrate_austrian_industries: "오스트리아 산업 통합"
 HOL_integrate_austrian_industries_desc: "오스트리아의 산업은 게르만 형제단의 힘에 필수적입니다. 그 산업 기반을 우리 경제 체제에 완전히 통합함으로써 우리는 제국 전역에서 비할 데 없는 효율성과 생산을 보장할 것입니다."
 HOL_fourth_reich: "제4제국 선포"
 HOL_fourth_reich_desc: "독일, 오스트리아, 네덜란드를 하나의 불굴의 게르만 국가로 통합할 때가 왔습니다. 제4제국은 게르만 민족의 힘, 규율, 야망을 구현하여 유럽과 그 너머를 지배하는 제국을 만들어 낼 것입니다."
 HOL_unification_dietsland: "디츠란트 통일"
 HOL_unification_dietsland_desc: "플랑드르의 병합으로 통일된 디츠란트라는 비전이 그 어느 때보다 가까워졌습니다. 이제 우리의 통제를 공고히 하고, 행정을 통합하며, 네덜란드인과 플랑드르인을 하나의 깃발 아래 결집시키는 것이 필수적입니다."
 HOL_integrate_flemish_army: "플랑드르군 통합"
 HOL_integrate_flemish_army_desc: "플랑드르 군 부대를 네덜란드 군대에 편입시켜 통합되고 규율 있으며 효율적인 군대를 만들어야 합니다. 이 통합은 디츠란트의 군사력이 각 부분의 합보다 커지도록 보장할 것입니다."
 HOL_enforce_dutch_language: "네덜란드어 강제"
 HOL_enforce_dutch_language_desc: "진정으로 통합된 국가를 만들기 위해 네덜란드어는 디츠란트 전역에서 공용어가 되어야 합니다. 이 정책을 시행함으로써 우리는 공유된 문화적 정체성을 함양하고 국가적 단결을 강화할 수 있습니다."
 HOL_enforce_dutch_language_tt: "§Y플랑드르§!의 §Y국가 중점§! 비용이 §G절반§!으로 감소합니다"
 HOL_rebuild_belgian_shipyards: "벨기에 조선소 재건"
 HOL_rebuild_belgian_shipyards_desc: "앤트워프와 제브뤼헤의 항구와 조선소는 매우 귀중한 자산입니다. 이들 시설을 현대화함으로써 우리는 디츠란트의 함선 건조 역량을 크게 높여 무역과 군사력 모두를 강화할 수 있습니다."
 HOL_glorify_dietsland: "디츠란트 찬양"
 HOL_glorify_dietsland_desc: "선전 활동은 디츠란트의 힘과 단결을 강조해야 합니다. 우리의 성취를 찬양하고 국가적 자긍심을 함양함으로써 우리는 국민 사이의 충성심을 공고히 하고 우리의 비전을 세계에 투영할 수 있습니다."
 HOL_integrate_flemish_defense_companies: "플랑드르 방위 산업체 통합"
 HOL_integrate_flemish_defense_companies_desc: "플랑드르의 방위 산업은 우리의 군사 역량을 발전시킬 상당한 잠재력을 지니고 있습니다. 플랑드르 방위 산업체를 디츠란트의 생산망에 통합함으로써 우리는 군대를 효과적으로 무장시키는 능력을 강화할 수 있습니다."
 HOL_integrate_flemish_defense_companies_tt: "§Y사브카 항공기 제조사§!를 잠금 해제합니다"
 HOL_flemish_industry_investments: "플랑드르 산업 투자"
 HOL_flemish_industry_investments_desc: "플랑드르의 산업 중심지는 디츠란트의 경제적 미래에 필수적입니다. 이들 지역에 투자함으로써 우리는 경제 성장을 촉진하고 산업 강국으로서의 입지를 공고히 할 수 있습니다."
 HOL_harness_flemish_ports: "플랑드르 항구 활용"
 HOL_harness_flemish_ports_desc: "플랑드르의 항구는 디츠란트가 세계 무역과 해군력에 접근하는 데 매우 중요합니다. 앤트워프와 제브뤼헤에 대한 전략적 투자는 그 잠재력이 온전히 실현되도록 보장하여 우리의 경제와 군사 모두에 이익이 될 것입니다."
 HOL_sgp_protect_sunday_rest: "일요일의 신성함 수호"
 HOL_sgp_protect_sunday_rest_desc: "안식일은 성경에 명시된 대로 휴식과 예배를 위한 거룩한 날입니다. 일요일에 기업이 문을 닫고 공적 생활이 멈추도록 보장함으로써 우리는 이 신성한 전통을 기리고 공동체의 신앙을 강화합니다."
 HOL_sgp_religious_education_policy: "종교 교육 확대"
 HOL_sgp_religious_education_policy_desc: "기독교 교육은 다음 세대에 성경적 가치를 심어주는 데 필수적입니다. 종교 학교에 재정을 지원하고 그 자율성을 지킴으로써 우리는 사회의 도덕적 토대를 보존합니다."
 HOL_sgp_support_large_families: "다자녀 기독교 가정 장려"
 HOL_sgp_support_large_families_desc: "신앙심 깊은 시민의 증가는 강한 국가의 열쇠입니다. 다자녀 가정을 장려하고 이들이 지원받도록 보장함으로써 우리는 우리 신앙과 조국의 미래를 확보합니다."
 HOL_sgp_support_christian_unions: "기독교 노동조합 지원"
 HOL_sgp_support_christian_unions_desc: "기독교 노동조합은 노동자의 권리를 보호하는 데 필수적인 도덕적 틀을 제공합니다. 이들 조직에 힘을 실어줌으로써 우리는 직장에서 공정한 대우와 성경적 윤리 사이의 균형을 보장합니다."
 HOL_sgp_secure_rural_communities: "농촌 공동체 보호"
 HOL_sgp_secure_rural_communities_desc: "농촌 지역은 네덜란드 전통과 신앙의 심장부입니다. 농촌 기반시설, 농업 혁신, 영세 농민 지원에 투자함으로써 우리는 이들 공동체가 도덕과 안정의 보루로서 계속 번창하도록 보장합니다."
 HOL_sgp_strengthen_defense: "국방 강화"
 HOL_sgp_strengthen_defense_desc: "우리의 주권과 기독교 유산을 지키기 위해 우리는 강력한 군대를 유지해야 합니다. 군대를 강화하고 대비 태세를 보장함으로써 우리는 외부와 내부의 위협으로부터 국가를 수호합니다."
 HOL_sgp_resist_secularism: "세속주의 영향 저항"
 HOL_sgp_resist_secularism_desc: "세속주의는 우리 사회의 도덕적 토대를 약화시킵니다. 기독교 가치를 증진하고 세속적 이념의 확산에 맞서 싸움으로써 SGP는 네덜란드를 하나님을 경외하는 나라로 보존할 것입니다."
 HOL_gl_affordable_housing_program: "저렴한 주택 프로그램"
 HOL_gl_affordable_housing_program_desc: "주거는 기본적인 인권입니다. 흐뢰네링크스는 저렴하고 지속 가능한 주택을 건설하여 모든 시민이 안전한 거처에 접근할 수 있도록 보장함으로써 주택 위기에 대처할 것입니다."
 HOL_gl_biodiversity_protection: "생물 다양성 보호"
 HOL_gl_biodiversity_protection_desc: "네덜란드의 자연 서식지는 위협받고 있습니다. 흐뢰네링크스는 멸종 위기종을 보호하고, 생태계를 복원하며, 미래 세대를 위한 번성하는 환경을 보장하기 위한 보전 노력을 이끌 것입니다."
 HOL_gl_digital_innovation: "디지털 혁신 육성"
 HOL_gl_digital_innovation_desc: "디지털 기술은 미래의 열쇠입니다. 최첨단 연구에 투자하고 견고한 디지털 기반시설을 구축함으로써 흐뢰네링크스는 네덜란드가 세계 기술 지형의 선도국이 되도록 보장할 것입니다."
 HOL_gl_international_solidarity: "국제 연대 강화"
 HOL_gl_international_solidarity_desc: "세계적 도전에는 세계적 협력이 필요합니다. 흐뢰네링크스는 국제 파트너십과 기구에 적극 참여함으로써 평화, 인권, 지속 가능한 발전을 증진하기 위해 노력할 것입니다."
 HOL_gl_fair_trade_policy: "공정 무역 정책 시행"
 HOL_gl_fair_trade_policy_desc: "세계 무역은 윤리적이고 지속 가능해야 합니다. 흐뢰네링크스는 환경 기준, 노동자 권리, 전 세계 불평등 감소를 우선시하는 공정 무역 협정을 주장합니다."
 HOL_gl_diversify_workforce: "노동력 다양화"
 HOL_gl_diversify_workforce_desc: "포용적인 노동력은 더 강한 노동력입니다. 흐뢰네링크스는 배경에 관계없이 모든 시민에게 평등한 기회를 보장하여 공정하고 화합하는 사회를 만드는 정책을 지원할 것입니다."
 HOL_gl_transparent_governance: "투명한 통치 보장"
 HOL_gl_transparent_governance_desc: "정부에 대한 신뢰는 책임성 위에 세워집니다. 흐뢰네링크스는 투명성을 우선시하여 시민이 정보를 얻고 지도자에게 책임을 물을 힘을 갖도록 보장할 것입니다."
 HOL_gl_youth_empowerment: "청년 역량 강화"
 HOL_gl_youth_empowerment_desc: "다음 세대는 우리 국가의 미래입니다. 흐뢰네링크스는 청년을 위한 기회를 만들고, 의사 결정에서 그들의 목소리를 키우며, 그들의 성장을 지원할 것입니다."
 HOL_gl_energy_independence: "에너지 독립 달성"
 HOL_gl_energy_independence_desc: "재생 에너지 생산을 확대하고 전력망을 현대화함으로써 흐뢰네링크스는 지속 가능하고 푸른 미래로 전환하면서 에너지 독립을 확보할 것입니다."
 HOL_reinstate_werkspoor: "베르크스푸르 복원"
 HOL_reinstate_werkspoor_desc: "한때 네덜란드 산업 독창성의 상징이던 베르크스푸르는 국가 생산 노력을 선도하기 위해 되살아날 것입니다. 운영을 현대화하고 기반시설에 투자함으로써 우리는 이 상징적인 기업을 과거의 영광으로 되돌리고 경제 성장을 이끌 수 있습니다."
 HOL_curacao_oil_refinery_expansion: "퀴라소 정유소 확장"
 HOL_curacao_oil_refinery_expansion_desc: "1910년대부터 퀴라소는 카리브 해에서 가장 전략적인 정유소 중 하나의 본거지였습니다. 생산 능력을 확대하고 기반시설을 현대화함으로써 우리는 이곳이 네덜란드 경제의 핵심 자산이자 세계 에너지 시장의 중요한 주체로서의 역할을 굳히도록 할 수 있습니다."
 HOL_aruba_aloe_trade_investments: "아루바 알로에 무역 재활성화"
 HOL_aruba_aloe_trade_investments_desc: "아루바는 한때 세계적인 주요 생산지였던 알로에 베라 무역의 풍부한 역사를 지니고 있습니다. 현대적 농업 기술과 무역망에 투자함으로써 우리는 고품질 알로에 수출의 선도국으로서의 아루바의 위상을 회복하고 경제를 다각화할 수 있습니다."
 HOL_bonaire_phosphate_mining: "보네르 인산염 광산 재투자"
 HOL_bonaire_phosphate_mining_desc: "한때 보네르 경제에 크게 기여했던 인산염 채굴은 20세기 초에 쇠퇴했습니다. 이 귀중한 자원을 책임감 있게 채취하고 수출하려는 노력을 재개하면 보네르의 경제적 중요성을 회복하는 동시에 지역 공동체의 일자리를 창출할 수 있습니다."
 HOL_curacao_industrial_expansion: "퀴라소 산업 부문 확장"
 HOL_curacao_industrial_expansion_desc: "퀴라소에는 전통적인 정유소를 넘어서는 산업 성장의 미개척 잠재력이 있습니다. 제조 시설을 설립하고 경제를 다각화함으로써 우리는 일자리를 창출하고 단일 산업에 대한 의존을 줄일 수 있습니다."
 HOL_bonaire_infrastructure_improvement: "보네르 기반시설 개선"
 HOL_bonaire_infrastructure_improvement_desc: "보네르의 경제 성장은 낡은 기반시설로 인해 저해되고 있습니다. 도로, 항구, 공공 설비를 개선함으로써 우리는 더 나은 연결성을 확보하고 지역 기업을 지원하여 향후 발전의 길을 닦을 수 있습니다."
 HOL_tulip_export_boost: "튤립 수출 확대"
 HOL_tulip_export_boost_desc: "튤립은 오랫동안 네덜란드의 상징이자 우리 농산물 수출의 초석이었습니다. 마케팅과 물류에 투자함으로써 우리는 세계 꽃 시장을 지배하여 네덜란드 튤립이 전 세계 가정을 장식하도록 보장할 수 있습니다."
 HOL_markermeer_reclamation: "마르커르메이르 간척"
 HOL_markermeer_reclamation_desc: "쥐더르제 공사의 상징적인 사업인 마르커르메이르는 여전히 네덜란드의 독창성을 발휘할 미개척 기회입니다. 비옥한 땅을 간척하고 지속 가능한 개발에 맞게 최적화함으로써 우리는 방대한 농업 잠재력을 열고, 재생 에너지 사업을 추진하며, 국가의 미래를 확보할 현대적 주거 해법을 마련할 수 있습니다."
 HOL_delta_rhine_energy_corridor: "델타-라인 에너지 회랑 개발"
 HOL_delta_rhine_energy_corridor_desc: "델타-라인 지역은 네덜란드 에너지 기반시설의 중심입니다. 전력망을 현대화하고 라인 강을 따라 재생 에너지 생산을 확대함으로써 우리는 이 회랑을 지속 가능한 에너지의 강자로 탈바꿈시켜 에너지 독립을 확보하고 유럽의 녹색 구상을 지원할 수 있습니다."
 HOL_asml_foundation_of_innovation: "혁신의 토대"
 HOL_asml_foundation_of_innovation_desc: "1984년에 설립된 ASML은 리소그래피 장비로 반도체 제조에 혁명을 일으켰습니다. 연구에 투자하고 국내 마이크로칩 생산에 착수함으로써 우리는 네덜란드를 세계 칩 공급의 초석이자 첨단 기술 수익의 자석으로 만듭니다."
 HOL_asml_euv_technology: "극자외선 리소그래피 숙달"
 HOL_asml_euv_technology_desc: "ASML의 극자외선(EUV) 리소그래피 개발은 반도체 제조의 정점을 상징합니다. EUV 시스템의 생산과 배치를 가속함으로써 우리는 마이크로칩 기술에서 세계적 선도 지위를 확보할 수 있습니다."
 HOL_asml_global_supply_chain: "ASML의 세계 공급망 확보"
 HOL_asml_global_supply_chain_desc: "첨단 반도체 장비의 핵심 공급업체인 ASML은 복잡한 국제 공급망에 의존합니다. 이러한 연결을 보호하고 전략적 파트너십을 맺음으로써 우리는 세계적 불안정으로부터 ASML의 운영을 지킬 수 있습니다."
 HOL_asml_strategic_partnerships: "ASML 전략적 파트너십 구축"
 HOL_asml_strategic_partnerships_desc: "ASML은 첨단 반도체 기술을 최첨단 무기 체계에 통합하기 위해 군수 계약업체와 핵심 파트너십을 맺어, 네덜란드가 현대 국방 역량의 선도국으로 남도록 보장했습니다."
 HOL_asml_dutch_technological_dominance: "기술 우위 확립"
 HOL_asml_dutch_technological_dominance_desc: "ASML은 단순한 기업이 아니라 네덜란드의 혁신과 세계적 영향력의 상징입니다. 첨단 기술 부문에 대한 투자를 더욱 강화함으로써 우리는 네덜란드를 첨단 기술 분야에서 넘볼 수 없는 선도국으로 확립할 수 있습니다."
 HOL_tullip_bonus: "튤립 수출"
 HOL_tullip_bonus_desc: "세계 튤립 무역을 지배하기 위한 전국적인 노력이 진행 중입니다. 이 한시적 구상은 생산 및 수출 역량을 강화하여 경제 활동의 급증을 가져오고 네덜란드가 세계의 튤립 수도라는 명성을 강화합니다."
 HOL_global_vision: "네덜란드의 세계 비전"
 HOL_global_vision_desc: "네덜란드는 언제나 상인과 외교관의 나라였습니다. 유럽이 여전히 핵심 초점이지만, 우리는 브뤼셀을 넘어 영향력을 확대하고 세계의 파트너와 직접 교류하여 우리의 미래를 확보해야 합니다."
 HOL_atlantic_defence_commitments: "대서양 방위 공약"
 HOL_atlantic_defence_commitments_desc: "세계적 긴장이 고조되는 가운데 NATO는 여전히 네덜란드 안보의 토대입니다. 동맹에 대한 우리의 공약을 재확인함으로써 우리는 동맹국으로부터 방위 협력과 기술적 이점을 확보할 수 있습니다."
 HOL_joint_military_programs: "공동 군사 프로그램"
 HOL_joint_military_programs_desc: "현대의 분쟁에는 고도의 협력이 필요합니다. NATO 동맹국과 공동 군사 프로그램을 추진하면 최첨단 기술에 접근할 수 있고 국내 방위 산업이 강화될 것입니다."
 HOL_maritime_security_leadership: "해양 안보 리더십"
 HOL_maritime_security_leadership_desc: "네덜란드는 해양 국가이며, 우리의 안보는 열린 해상 교통로에 달려 있습니다. 국제 해군 안보에서 우리의 역할을 확대함으로써 우리는 세계적 영향력과 경제 안보를 강화할 수 있습니다"
 HOL_economic_development_antilles: "네덜란드령 카리브 경제 재활성화"
 HOL_economic_development_antilles_desc: "네덜란드령 카리브는 오랫동안 경제 불안정, 관광 의존, 낙후된 기반시설로 어려움을 겪어 왔습니다. 카리브 네덜란드 국가청(Rijksdienst Caribisch Nederland)을 본뜬 정책을 시행함으로써 우리는 지속 가능한 산업에 투자하고, 무역 효율성을 개선하며, 섬들의 경제적 토대를 현대화할 수 있습니다."
 HOL_deepwater_water_expansion_program: "카리브 심수항 확장"
 HOL_deepwater_water_expansion_program_desc: "국제 무역이 성장함에 따라 빌렘스타트, 오라녜스타트, 필립스버그의 항구를 확장하면 네덜란드령 카리브가 세계 해상 물류 거점으로 탈바꿈할 것입니다. 로테르담의 전문성으로 이들 항구를 현대화함으로써 우리는 국제 해운 회사를 유치하고 경제 생산을 늘릴 수 있습니다."
 HOL_revitilaze_dutch_latin_trade: "네덜란드-라틴 아메리카 무역로 재활성화"
 HOL_revitilaze_dutch_latin_trade_desc: "수 세기 동안 네덜란드 상인들은 남아메리카와 카리브 해 무역에서 핵심적인 역할을 했습니다. 라틴 아메리카 주재 네덜란드 상공회의소(홀란드 하우스 네트워크)를 통해 무역 협정을 개편함으로써 우리는 경제적 유대를 강화하고 지역 상업에서 네덜란드의 영향력을 회복할 수 있습니다."
 HOL_dutch_latin_energy_cooperation: "네덜란드-라틴 아메리카 에너지 협력"
 HOL_dutch_latin_energy_cooperation_desc: "라틴 아메리카는 천연자원이 풍부하며, 로열 더치 셸과 SBM 오프쇼어 같은 네덜란드 기업들은 오랫동안 해양 시추와 재생 에너지 분야에서 역할을 해 왔습니다. 에너지 협력을 강화하면 우리는 전략적인 석유, LNG, 재생 에너지 협정을 확보할 수 있습니다."
 HOL_caribbean_naval_initiative: "네덜란드령 카리브 해군 확장 프로그램"
 HOL_caribbean_naval_initiative_desc: "카리브 해는 여전히 해적 행위, 밀수, 지정학적 긴장에 취약합니다. 마리네카제르너 파레라와 하토 공군 기지에서 네덜란드 왕립 해군의 주둔을 강화하면 신속한 전개, 개선된 순찰, NATO 및 지역 동맹국과의 더 나은 협력이 가능해질 것입니다."
 HOL_dutch_caribbean_coast_guard: "네덜란드령 카리브 해안경비대 현대화"
 HOL_dutch_caribbean_coast_guard_desc: "카리브 해역 해안경비대(Kustwacht Caribisch Gebied)는 마약 단속 작전과 해양 안보에서 핵심적인 역할을 합니다. 다멘 조선소의 순찰함으로 함대를 확장하고 미국 해안경비대와의 합동 훈련을 늘리면 지역 안정과 네덜란드의 전략적 통제가 보장될 것입니다."
 HOL_joint_defense_latin_america: "라틴 아메리카와의 공동 방위 조약"
 HOL_joint_defense_latin_america_desc: "라틴 아메리카의 지역 안보는 조직범죄, 국경 분쟁, 지정학적 경쟁이 심화되면서 점점 취약해지고 있습니다. 미주방위위원회와 브라질, 콜롬비아, 멕시코와의 군사 훈련 프로그램을 통한 방위 협력 강화는 우리의 영향력을 높이고 이익을 보호할 것입니다."
 HOL_dutch_caribbean_federation: "네덜란드령 카리브 연방 제안"
 HOL_dutch_caribbean_federation_desc: "네덜란드령 카리브의 정치적 지위는 아루바, 퀴라소, 신트마르턴, BES 제도 사이에 자치 수준이 제각각이어서 여전히 분절되어 있습니다. 왕국의 기존 틀을 본뜬 연방 구조는 동등한 대표권, 경제 통합, 통치 안정성을 부여할 것입니다."
 HOL_autonomy_development_pact: "카리브 자치 발전 협약"
 HOL_autonomy_development_pact_desc: "네덜란드령 카리브의 경제적, 정치적 자치를 보장하는 것은 안정을 유지하는 핵심입니다. 1954년 네덜란드 왕국 헌장을 본뜬 공식 자치 협약은 섬들을 네덜란드의 보호와 경제 정책 아래 두면서 더 큰 자치권을 부여할 것입니다."
 HOL_bijzondere_gemeenten: "BES 제도 통합"
 HOL_bijzondere_gemeenten_desc: "보네르, 신트외스타티위스, 사바 섬은 현재 네덜란드 내에서 특별 자치체(bijzondere gemeenten)의 지위를 가지고 있습니다. 본토와의 법적, 경제적 통합을 강화하면 더 나은 공공 서비스, 기반시설, 재정 안정성이 제공될 것입니다."
 HOL_dutch_american_friendship: "최초의 벗"
 HOL_dutch_american_friendship_desc: "수 세기 동안 네덜란드와 미국은 강력한 외교, 경제, 군사적 유대를 유지해 왔습니다. 세계의 안보와 경제 지형이 변화하는 가운데, 우리는 이 파트너십을 재확인하고 미래를 위해 구축해야 합니다."
 HOL_operation_market_vision: "마켓 비전 작전"
 HOL_operation_market_vision_desc: "우리가 공유한 군사적 역사를 바탕으로 합동 훈련, 정보 공유, 방위 산업 파트너십을 통해 네덜란드-미국 협력을 강화할 수 있습니다."
 HOL_suriname_alignment: "수리남과의 전략적 제휴"
 HOL_suriname_alignment_desc: "역사적 유대와 공통 언어에도 불구하고, 네덜란드와 수리남의 관계는 1975년 수리남 독립 이후 조심스러운 상태로 유지되어 왔습니다. 새로운 외교적 접근을 함양함으로써 우리는 남아메리카에서의 지역적 영향력, 문화 교류, 경제적 교류를 위한 협력의 토대를 마련할 수 있습니다."
 HOL_suriname_trade_development_agreement: "무역 및 개발 협정"
 HOL_suriname_trade_development_agreement_desc: "양자 협상을 통해 우리는 수리남과 포괄적인 무역 및 개발 협정을 추진할 것입니다. 이 협약은 상호 시장 접근을 강화하고, 항만 기반시설을 개선하며, 수리남의 농업, 물류, 천연자원에 대한 네덜란드의 투자를 촉진할 것입니다."
 HOL_educational_cultural_exchange_program: "교육 및 문화 교류 프로그램"
 HOL_educational_cultural_exchange_program_desc: "지속적인 유대를 구축하려면 경제 이상의 것이 필요합니다. 사람이 필요합니다. 우리는 학술 장학금, 네덜란드어 프로그램, 유산 보존 구상을 지원하는 네덜란드와 수리남 기관 간의 교육 및 문화 교류 프로그램을 수립할 것입니다."
 HOL_rebuild_infrastructure_paramaribo: "파라마리보 기반시설 재건"
 HOL_rebuild_infrastructure_paramaribo_desc: "수도 파라마리보는 기반시설 투자가 절실히 필요합니다. 네덜란드의 도시 계획 전문성과 지역 개발 기금을 활용하여 우리는 새로운 도로를 위한 자금을 조달하고, 식민지 시대 건축물을 복원하며, 수리남의 경제 성장을 뒷받침하도록 물류를 현대화할 것입니다."
 HOL_invest_suriname_resources: "자원 부문에 투자"
 HOL_invest_suriname_resources_desc: "수리남은 금, 보크사이트, 해상 석유 매장량에 막대한 미개발 부를 지니고 있습니다. 네덜란드 기업과의 합작 투자 및 탐사 계약을 통해 우리는 광업과 자원 부문을 되살리는 동시에 장기적으로 지속 가능한 채취와 공정한 이익 배분을 보장할 수 있습니다."
 HOL_maritime_suriname_agreement: "수리남과의 해양 협정"
 HOL_maritime_suriname_agreement_desc: "해양 안보와 무역은 수리남의 미래에 필수적입니다. 양자 해양 협정에 서명함으로써 우리는 합동 순찰, 해안 기반시설에 대한 네덜란드의 지원, 파라마리보를 카리브 해와 대서양 경제에 연결하는 안전한 무역로를 가능하게 할 것입니다."
 HOL_train_suriname_forces: "수리남 군 훈련"
 HOL_train_suriname_forces_desc: "지역의 안정과 주권을 지원하기 위해 우리는 수리남 군을 훈련시키는 군사 지원 프로그램을 시작할 것입니다. 물류, 마약 단속 작전, 평화 유지 역량에 초점을 맞춘 이 파트너십은 방위 유대를 심화하는 동시에 현지 안보를 강화할 것입니다."
 HOL_buildup_atlantic_fleet_idea: "대서양 함대 확장"
 HOL_buildup_atlantic_fleet_idea_desc: "네덜란드는 핵심 해상 교통로에 대한 우위를 되찾기 위해 대서양 함대의 확장과 현대화에 막대한 투자를 하고 있습니다. 강력한 해군은 서인도 회사의 옛 영토를 확보하고 이 지역 전역에 네덜란드의 힘을 투사하려는 우리 노력의 근간이 될 것입니다."
 HOL_country_prepare_for_the_dutch1: "네덜란드의 침략에 대비"
 HOL_country_prepare_for_the_dutch_desc1: "네덜란드는 자신들의 역사적 유산의 일부라고 믿는 영토를 되찾기 위한 군사 행동을 준비하며 병력을 동원하기 시작했습니다. 우리는 방어를 강화하고 국민을 결집하여 다가오는 이 위협에 맞서야 합니다."
 HOL_country_prepare_for_the_dutch2_tt: "§Y[HOL.GetAdjective] 침략에 대비하는 모든 국가에 [HOL.GetNameWithFlag]에 맞서는 방어 동맹에 가입하라는 제안을 보냅니다.\n이 방어 동맹은 구성원 중 하나가 [HOL.GetNameWithFlag]의 공격을 받으면 다른 구성원들을 전쟁에 소집합니다!§! "
 HOL_non_functioning_government: "기능 마비 정부"
 HOL_non_functioning_government_desc: "왕권의 복귀는 정부를 마비시켰습니다. 관료적 비효율, 정치적 불안정, 국제적 신뢰의 하락이 국가의 통치와 외교적 위상을 약화시켰습니다."
 HOL_strengthening_states: "강화된 신분회"
 HOL_strengthening_states_desc: "이제 전국 신분회는 군주제와 협력하여 일하며 더욱 균형 잡히고 효과적인 통치 구조를 육성하고 있습니다. 안정이 개선되고 있으며 행정 비용이 통제되고 있습니다."
 HOL_constitutional_reforms: "입헌 군주제"
 HOL_constitutional_reforms_desc: "군주제는 헌법의 틀 안에서 운영되어 명확한 통치 역할을 보장하고 비효율을 줄입니다. 안정이 회복되었으며 외세의 영향력은 감소했습니다."
 HOL_empowering_local_governments: "지방 정부 권한 강화"
 HOL_empowering_local_governments_desc: "지방 정부에 더 많은 자치권을 부여함으로써 모든 주가 통합된 네덜란드라는 왕실의 구상에 효과적으로 기여하도록 할 수 있습니다."
 HOL_centralized_governance: "중앙집권적 통치"
 HOL_centralized_governance_desc: "왕실의 권위 아래 통치를 중앙집권화하여 결정이 국가의 단결과 안정을 위해 이루어지도록 보장합니다."
 HOL_restore_nobility_influence: "귀족 영향력 복원"
 HOL_restore_nobility_influence_desc: "귀족을 다시 영향력 있는 지위에 복귀시켜 군주제를 위한 충성스러운 기반을 만들고 전통적 구조를 강화합니다."
 HOL_royal_patronage_culture: "왕실 문화 부흥"
 HOL_royal_patronage_culture_desc: "적극적인 왕실의 후원을 통해 문화적 자긍심과 국가적 단결이 되살아나고 있습니다. 군주제는 통합의 상징이 되어 국가의 정체성과 안정을 모두 강화했습니다."
 HOL_nobility_backed_military: "귀족이 뒷받침하는 군대"
 HOL_nobility_backed_military_desc: "충성스러운 귀족을 지휘직에 참여시켜 군대를 강화하고, 군주제 수호에 대한 이들의 헌신을 보장합니다."
 HOL_NAM1: "네덜란드 석유 회사(NAM)"
 HOL_NAM1_desc: "네덜란드 석유 회사(Nederlandse Aardolie Maatschappij, NAM)는 1947년 셸과 엑슨모빌의 합작 투자로 설립된 네덜란드 석유 및 가스 기업입니다. NAM은 네덜란드 최대의 천연가스 생산업체로, 주로 흐로닝언 가스전에서 천연가스와 석유의 탐사, 생산, 유통을 담당합니다. 이 기업은 수십 년간 네덜란드 에너지 부문에서 중요한 역할을 해 왔습니다."
 HOL_Dutch_Agriculture0: "네덜란드 농업"
 HOL_Dutch_Agriculture0_desc: "네덜란드 농업은 효율성과 혁신의 놀라운 사례로, 비교적 작은 국토 면적에도 불구하고 네덜란드를 세계 최고의 농산물 생산국 중 하나로 만들었습니다. 이 나라는 온실 재배, 정밀 농업, 지속 가능한 관행을 포함한 첨단 영농 분야의 세계적 선도국입니다. 이러한 혁신 덕분에 네덜란드 농민들은 최첨단 기술로 물, 에너지, 영양분 사용을 최적화하여 최소한의 환경 영향으로 대량의 식량을 생산할 수 있습니다. 또한 네덜란드는 채소와 꽃에서 유제품과 육류에 이르기까지 다양한 농산물의 주요 수출국입니다. 첨단 기술, 지속 가능성, 생산성의 이러한 결합은 네덜란드 농업을 세계 식품 산업의 강자로 자리매김하게 했습니다."
 HOL_European_Railway_Developments_idea: "유럽 철도 개발"
 HOL_European_Railway_Developments_idea_desc: "네덜란드는 유럽 철도망의 확장과 현대화에 적극적으로 참여하여 국경 간 이동성을 높이고, 이동 시간을 단축하며, 지속 가능한 교통을 촉진하는 사업에 기여해 왔습니다. 주요 개발로는 암스테르담과 로테르담 같은 네덜란드 주요 도시를 파리, 런던, 브뤼셀과 연결하는 탈리스 및 유로스타 같은 고속 철도망과 네덜란드 철도 체계의 통합이 있습니다. 또한 네덜란드는 유럽 전역에 걸쳐 끊김 없는 철도망을 구축하여 여객 및 화물 서비스를 모두 개선하고자 하는 TEN-T(범유럽 교통망) 구상의 강력한 지지자입니다."
 HOL_Water_Sector1: "물의 달인들"
 HOL_Water_Sector1_desc: "네덜란드의 물 관리 부문은 국토 상당 부분이 해수면보다 낮은 네덜란드의 독특한 지리에 힘입어 수자원 관리 전문성으로 세계적으로 인정받고 있습니다. 네덜란드의 기술자와 기업은 홍수 통제, 수질 정화, 지속 가능한 물 이용을 위한 혁신적인 해법을 개발하는 선도자입니다. 이 나라는 수위를 관리하고 홍수를 예방하는 데 필수적인 제방, 폭풍 해일 방벽, 간척지(폴더) 체계 같은 첨단 기반시설 건설을 개척했습니다. 국제적으로 네덜란드 물 관리 부문은 매우 높은 평가를 받고 있으며, 네덜란드 전문가들은 해안 보호, 도시 물 관리, 기후 적응과 관련된 세계적 사업에 자주 참여합니다. 최첨단 기술, 수 세기의 경험, 지속 가능성에 대한 헌신의 이러한 결합은 네덜란드 물 관리 부문을 세계의 물 문제 해결에 기여하는 핵심 주체로 만듭니다."
 HOL_SGM_Idea: "스프링 글로벌 메일"
 HOL_SGM_Idea_desc: "스프링 글로벌 메일은 원래 TNT 포스트(현 PostNL)와 로열 메일의 합작 투자로 설립된 국제 우편 및 물류 업체입니다. 이 기업은 전 세계 소포, 다이렉트 메일, 기업 우편 배송을 포함한 국경 간 우편 솔루션을 전문으로 합니다. 스프링 글로벌 메일은 190개국 이상에 걸친 네트워크를 활용하여 국제 우편 흐름을 관리하는 전문성으로 알려져 있습니다. 이 기업은 모든 규모의 기업에 서비스를 제공하며, 효율성, 신뢰성, 비용 효율에 중점을 두고 전자상거래, 다이렉트 마케팅, 글로벌 기업 서신을 위한 맞춤형 솔루션을 제공합니다."
 HOL_Marine_Modified: "해병대 이전 부분 완료"
 HOL_Marine_Modified_desc: "대중의 우려와 정치적 타협으로 인해 해병대 이전 계획이 수정되었습니다. 플리싱언의 새 기지는 가동 중이지만 이전의 전체 이점은 실현되지 못하고 있습니다."
 HOL_Marechausee1: "왕립 군경찰대"
 HOL_Marechausee1_desc: "코닌클레이커 마레하우서, 즉 네덜란드 왕립 군경찰대는 네덜란드 국방부 소속으로 활동하는 헌병 조직입니다. 네덜란드 국내외에서 광범위한 보안 및 법 집행 임무를 담당합니다. 주요 임무로는 국경 경비, 군 치안 유지, 왕실 구성원과 정부 인사의 경호가 있습니다. 군경찰대는 조직범죄, 인신매매, 테러 대응에서도 중요한 역할을 하며 국제 평화유지 임무에도 참여합니다. 다재다능함과 전문 역량으로 알려진 왕립 군경찰대는 네덜란드 국가 안보 기반의 필수적인 구성 요소입니다."
 HOL_Economic_Landscape_Start: "네덜란드 경제 지형"
 HOL_Economic_Landscape_Start_desc: "네덜란드 고유의 경제 지형을 분석하고 이해하는 것은 매우 중요합니다. 다양한 지역의 강점과 과제에 집중함으로써 전국에서 성장과 안정을 극대화하는 맞춤형 경제 정책을 수립할 수 있습니다."
 HOL_DBB_tt: "§Y정치 지도자§!가 암살될 확률이 낮아집니다."
 HOL_Weed_Center1_tt: "[additional_income_HOL_Weed_Center1]"
 HOL_Monarchy_Law_Blocking_tt: "£political_power_texticon  법률 변경 비용: §R+1000%§!  "
 HOL_social_innovation_idea: "사회 혁신 운동"
 HOL_social_innovation_idea_desc: "네덜란드는 사회의 가장 시급한 과제를 해결하기 위한 새로운 아이디어와 창의적인 해법을 육성하는 사회 혁신의 중심지가 되었습니다. 이 운동은 민간 연구 개발에서 중대한 돌파구로 이어져 기술 발전을 이끌고 국가 생산성을 높였습니다."
 HOL_democracy_reform1: "정치 개혁 운동"
 HOL_democracy_reform1_desc: "LPF는 기성 정당 카르텔에서 벗어나 직접 민주주의를 옹호하며 네덜란드 전역에서 정치 개혁의 물결을 이끌고 있습니다. 국민투표를 통해 시민에게 힘을 실어 주고, 직업 정치인의 영향력을 줄이며, 정부 기관을 간소화함으로써 LPF는 네덜란드의 통치를 더 투명하고 책임 있으며 진정으로 국민의 뜻을 대변하는 방향으로 재편하고 있습니다."
 HOL_welfare_reform_idea: "복지 제도 대수술"
 HOL_welfare_reform_idea_desc: "LPF는 지속 가능성과 개인의 책임을 우선시하도록 복지 제도를 재편하고 있습니다. 의존을 줄이고 진정으로 도움이 필요한 이들에게 맞춤 지원을 제공함으로써, 이러한 개혁은 복지 제도가 회복력 있고 자립적인 국민을 뒷받침하게 하는 동시에 납세자의 부담을 덜어 줍니다."
 HOL_public_sector_reform_idea: "공공 부문 효율화 추진"
 HOL_public_sector_reform_idea_desc: "LPF는 공공 부문을 간소화하고 관료적 비효율을 줄이며 책임 있는 지출을 장려하는 데 전념하고 있습니다. 이 개혁은 필수 서비스의 제공을 개선하고, 행정 간접비를 줄이며, 정부의 노력이 네덜란드 국민을 효과적으로 섬기는 데 다시 집중되도록 할 것입니다."
 HOL_reformed_liberal_market: "개혁된 노동 시장과 사회"
 HOL_reformed_liberal_market_desc: "개혁된 복지 제도, 자유화된 노동 시장, 간소화된 공공 부문을 갖춘 네덜란드는 효율과 자립의 모범이 되었습니다. 이러한 개혁은 개인의 책임을 우선시하고, 정부 개입을 줄이며, 경제 성장을 장려하여 모든 시민에게 이익이 되는 회복력 있고 지속 가능한 경제를 만들어 냅니다."
 HOL_anti_islam1: "제한 조치"
 HOL_anti_islam1_desc: "정부는 네덜란드의 문화적 가치를 수호하기 위해 이슬람 상징, 학교, 기관에 대한 초기 제한 조치를 도입했습니다. 이러한 정책은 세속적이고 국가적인 원칙에 부합하는 결속력 있는 사회를 조성하려는 것입니다."
 HOL_anti_islam2: "문화 동화 정책"
 HOL_anti_islam2_desc: "더 엄격한 정책이 시행되면서 정부는 문화적 동화에 대한 중점을 강화했으며, 네덜란드의 정체성과 단결을 공고히 하기 위해 이슬람 기관과 관행을 억제하고 있습니다. 이러한 정책은 통일된 문화적 기대를 통해 사회적 분열을 해소하려는 것입니다."
 HOL_anti_islam3: "광범위한 금지"
 HOL_anti_islam3_desc: "정부는 이슬람 상징과 관행을 국가 결속의 장애물로 간주하여 광범위한 금지를 시행했습니다. 이러한 조치는 세속적인 네덜란드 사회를 공고히 하고 공공 안보를 강화하는 것을 목표로 합니다."
 HOL_anti_islam4: "이슬람 상징의 전면 범죄화"
 HOL_anti_islam4_desc: "이슬람 상징, 문헌, 기관이 전면적으로 범죄화되었으며, 정부는 공공질서, 국가 통합, 세속주의에 대한 의지를 근거로 내세우고 있습니다. 이러한 극단적인 입장은 문화적으로 동질적이고 안전한 네덜란드라는 행정부의 비전을 강화합니다."
 HOL_made_in_holland1: "메이드 인 홀랜드"
 HOL_made_in_holland1_desc: "네덜란드산 제품에 대한 새로운 강조는 지역 산업을 지원하고 국민적 자부심을 고취하며 경제 회복력을 강화합니다. 국경 안에서 만들어진 제품을 우선시함으로써 우리는 네덜란드 경제를 강화하고 자급자족을 장려하며, '메이드 인 홀랜드'가 품질과 정체성의 상징이 되도록 합니다."
 HOL_work_efforts: "국가 노동 증진 운동"
 HOL_work_efforts_desc: "노동력의 활성화에 중점을 두고 정부는 고용과 생산성을 높이기 위한 전국적 구상을 시작했습니다. 직업 훈련 프로그램, 필수 산업 지원, 노동 참여 장려책을 통해 이러한 노력은 경제를 강화하고 모든 네덜란드 시민의 번영하는 미래를 보장하는 것을 목표로 합니다."
 HOL_celebrate_heroes: "네덜란드 영웅 기리기"
 HOL_celebrate_heroes_desc: "네덜란드 영웅들의 놀라운 업적과 희생을 기리는 일은 국민적 자부심과 단결을 심어 줍니다. 역사 속의 영웅과 현대의 영웅을 기림으로써 우리는 미래 세대에 영감을 주고 우리 국가를 규정하는 가치를 강화합니다. 이 존경과 추모의 정신은 시민들 사이의 유대를 강화하고 회복력 있는 애국적 사회를 길러 냅니다."
 HOL_dutch_enterprise: "네덜란드 기업 육성"
 HOL_dutch_enterprise_desc: "자생적 혁신과 기업가 정신을 육성하는 데 대한 새로운 집중이 네덜란드 경제에 활력을 불어넣었습니다. 지역 기업을 지원하고 관료적 장벽을 줄임으로써 네덜란드는 근면한 정신의 증거라 할 수 있는 경쟁력 있는 시장을 키워 가고 있습니다."
 HOL_royal_eco_control: "왕실의 경제 통제"
 HOL_royal_eco_control_desc: "왕관이 경제 정책을 감독하면서 네덜란드는 중앙 집중식 경제 계획의 길에 들어섰습니다. 비판자들은 시장 자유의 상실을 한탄하지만, 군주제는 안정과 국가적 우선순위에 대한 단일한 집중을 보장하며 네덜란드 산업을 외세의 영향으로부터 보호합니다."
 HOL_VOC_indonesian_focus_tt: "인도네시아의 분리주의 운동 제거 비용이 절반으로 줄어듭니다"
 HOL_rebuilding_indonesia: "인도네시아 재건"
 HOL_rebuilding_indonesia_desc: "네덜란드의 정복 이후 인도네시아는 대규모 재건 노력이 필요한 상태입니다. 인프라에 투자하고, 경제를 안정시키며, 현지의 우려를 해소함으로써 네덜란드의 지도 아래 번영하고 협력하는 미래의 토대를 마련할 수 있습니다."
 HOL_military_compensation_ast: "네덜란드의 군사 지원"
 HOL_military_compensation_ast_desc: "네덜란드는 서오스트레일리아 매입 합의의 일환으로 오스트레일리아에 상당한 군사 지원을 제공했습니다. 이 지원은 오스트레일리아군을 강화하고 지역 안보를 공고히 합니다."
 HOL_military_compensation_hol: "오스트레일리아에 대한 군사적 보상"
 HOL_military_compensation_hol_desc: "서오스트레일리아 획득 합의의 일환으로 우리는 오스트레일리아에 군사 지원을 제공하기로 약속했으며, 이는 외교적 호의를 유지하면서 그들의 방어 능력을 높여 줍니다."
 HOL_industrial_compensation_ast: "네덜란드의 산업 투자"
 HOL_industrial_compensation_ast_desc: "네덜란드는 서오스트레일리아 매각 합의의 일환으로 오스트레일리아의 산업 부문에 막대한 투자를 했습니다. 이러한 투자는 오스트레일리아의 경제 역량과 인프라를 크게 끌어올렸습니다."
 HOL_industrial_compensation_hol: "오스트레일리아에 대한 산업적 보상"
 HOL_industrial_compensation_hol_desc: "서오스트레일리아를 확보하기 위해 우리는 오스트레일리아의 산업 부문에 막대한 투자를 했으며, 이는 경제 성장을 촉진하고 외교 관계를 강화합니다."
 HOL_increase_long_range_aircraft_production: "장거리 항공기 생산"
 HOL_increase_long_range_aircraft_production_desc: "WIC 영토를 되찾으려는 우리의 노력을 뒷받침하기 위해 네덜란드는 장거리 항공기의 생산을 확대하고 있습니다. 이 첨단 항공기들은 먼 거리에서도 제공권을 확보하고, 해군 작전에 핵심적인 지원을 제공하며, 우리의 전략적 도달 범위를 강화할 것입니다."
 HOL_expanded_embassys: "확대된 대사관 망"
 HOL_expanded_embassys_desc: "네덜란드는 대사관 망을 확대하여 주요 지역에서의 외교적 접촉과 영향력을 늘렸습니다. 이 구상은 세계 무대에서 협상하고, 동맹을 구축하며, 네덜란드의 이익을 주장하는 우리의 능력을 강화합니다."
 HOL_expanded_financial_network1: "확대된 금융 망"
 HOL_expanded_financial_network1_desc: "전략적 투자와 현지 경제의 통합을 통해 네덜란드는 광범위한 금융 망을 구축했습니다. 이 체계는 우리의 경제적 영향력을 강화하고, 무역 우위를 확보하며, 네덜란드의 세계적 영향력을 공고히 합니다."
 HOL_dutchaid: "네덜란드 원조 구상"
 HOL_dutchaid_desc: "네덜란드 원조 구상은 전략적으로 중요한 지역에 개발 원조와 경제 지원을 제공하는 데 중점을 둡니다. 호의와 안정을 조성함으로써 우리는 네덜란드의 영향력을 강화하고 더 깊은 통합과 협력의 길을 닦습니다."
 HOL_dutchaid_tt1: "추가 수입: 인구 1,000만 명당 $$§G0.004§!"
 HOL_dutchaid_tt2: "§Y[HOL.GetNameWithFlag]§!의 영향을 받는 경우, §Y[THIS.GetFlag] [THIS.GetAdjective]§!의 $foreign_influence_defense_modifier$이(가) §R5%§! §R감소§!합니다\n"
 HOL_dutchaid_TT: "$$[?additional_income_HOL_dutchaid|+3] §Y$HOL_dutchaid$§! 효과\n"
 HOL_prepare_for_dutch_invasion: "네덜란드의 침략에 대비한 방어 준비"
 HOL_prepare_for_dutch_invasion_desc: "영토를 할양하라는 네덜란드의 최후통첩을 거부한 이상, 이제 예상되는 결과에 대비해야 합니다. 네덜란드가 군사 행동으로 대응할 것으로 예상되므로 우리는 방어를 강화하고 동원하여 주권을 수호해야 합니다."
 HOL_beatrix: "베아트릭스 여왕의 치세"
 HOL_beatrix_desc: "베아트릭스 여왕 아래에서 군주제는 변화하는 세계 속에서 안정과 힘을 제공했습니다. 그녀의 지혜와 적응력 덕분에 오라녀나사우 왕조는 존경받는 제도로 남아 네덜란드를 단결과 회복력의 길로 이끌었습니다."
 HOL_willem_alexander: "빌럼알렉산더 국왕의 치세"
 HOL_willem_alexander_desc: "빌럼알렉산더 국왕의 치세는 단결과 현대성에 대한 그의 중시로 규정됩니다. 국가적 자부심의 상징으로서 그의 지도력은 국내외에서 네덜란드를 공고히 합니다."
 HOL_friso: "프리소 국왕의 치세"
 HOL_friso_desc: "프리소 국왕의 지적인 통치 방식은 네덜란드에 혁신과 선견지명을 가져왔습니다. 진보와 전략적 사고에 대한 그의 헌신은 현대 시대에도 군주제의 존재 의의를 굳건히 합니다."
 HOL_constantijn: "콘스탄틴 국왕의 치세"
 HOL_constantijn_desc: "콘스탄틴 국왕의 외교적 수완은 네덜란드가 세계 무대에서 영향력을 유지하도록 보장합니다. 그의 치세는 협력, 안정, 그리고 네덜란드 국민을 위한 강력한 국제적 존재감을 강조합니다."
 HOL_amalia: "아말리아 여왕의 치세"
 HOL_amalia_desc: "아말리아 여왕은 전통과 현대적 관점의 균형을 이루는 오라녀나사우 왕조의 미래를 상징합니다. 그녀의 지도력은 새로운 세대에 영감을 주며, 진보적이고 통합적인 치세 아래 네덜란드가 번영하도록 보장합니다."
 HOL_cult_of_the_leader: "지도자 숭배"
 HOL_cult_of_the_leader_desc: "군주제가 폐지된 가운데 NVU는 지도자의 절대적 권위를 중심으로 한 새로운 질서를 확립했습니다. 카리스마 있고 굴하지 않는 그들의 비전은 사회의 모든 측면을 형성하며, 하나의 이념과 공동의 운명 아래 국가를 단결시킵니다. 지도자는 국민의 의지를 구현하며 네덜란드를 위한 힘과 지배의 길을 개척합니다."
 HOL_divided_military_loyalties: "분열된 군의 충성"
 HOL_divided_military_loyalties_desc: "군은 내전에서 NVU의 승리를 확보하는 데 중요한 역할을 했지만, 정권과의 완전한 일치에는 여전히 신중한 태도를 보입니다. 군 내 전통주의자들과 절대적 통제를 추구하는 정부의 네오나치적 비전 사이에 긴장이 존재합니다.\n------------\n§Y충성스러운 군대§! 또는 §Y독립적인 군대§!를 통해 이 §R국가 정신§!을 없앨 수 있습니다"
 HOL_loyal_military: "충성스러운 군대"
 HOL_loyal_military_desc: "군대는 이제 NVU의 비전과 완전히 일치합니다. 숙청과 이념 주입으로 지도자에 대한 절대적 충성이 보장되었으며, 군대는 국가의 필수적인 연장선이 되었습니다."
 HOL_independent_military: "독립적인 군대"
 HOL_independent_military_desc: "군대는 작전 효율성과 전문성을 유지하기 위해 자율성을 부여받았습니다. 직접적인 정치적 간섭에서 자유롭지만, 여전히 국가 방위에 전념하고 있습니다."
 HOL_nationalist_education_reform_idea_start: "개혁 중인 교육"
 HOL_nationalist_education_reform_idea_start_desc: "우리의 교육 제도는 정권의 이상에 맞추기 위한 전면적인 개편을 겪고 있습니다. 이 전환은 현재의 효율성을 저해하지만 충성스럽고 단결된 사회의 토대를 마련합니다."
 HOL_nationalist_education_reform_idea_start_tt: "§Y개혁 중인 교육§!은 시간이 지남에 따라 §G개선§!됩니다"
 HOL_nationalist_education_reform_idea: "민족주의 교육 제도"
 HOL_nationalist_education_reform_idea_desc: "교육 개혁이 완료되었습니다. 학교는 이제 충성심, 규율, 자부심을 심어 주는 데 중점을 두어 국가와 그 지도자에게 헌신하는 세대를 길러 내고 있습니다."
 HOL_national_industrial_program: "국가 산업 프로그램"
 HOL_national_industrial_program_desc: "NVU는 전국의 산업 성장을 가속하기 위한 야심 찬 구상을 시작했습니다. 중앙 집중식 계획과 국가 주도의 투자는 중공업 확충, 인프라 현대화, 그리고 네덜란드의 경제적 자급자족 달성에 집중되어 있습니다. 공장들은 활기로 가득 차 있고, 노동자들은 국가의 영광을 위해 일하며, 모든 자원은 더 강하고 더 단결된 국가를 건설하는 데 투입됩니다. 이 프로그램은 현대에 떠오르는 산업 강국으로서 우리의 위치를 굳힙니다."
 HOL_german_youth_organisation1: "게르만 청소년 네덜란드"
 HOL_german_youth_organisation1_desc: "게르만 청소년 네덜란드(Germaanse Jeugd Nederland)는 NVU의 청년 조직으로서 국가에 대한 충성과 게르만 단결 및 힘의 이상에 대한 헌신을 길러 냅니다. 혹독한 신체 훈련, 이념 교육, 지역 사회 참여를 통해 이 조직은 통일되고 강력한 국가라는 NVU의 비전 속에서 다음 세대가 자신의 역할을 다하도록 준비시킵니다. 게르만 청소년 네덜란드의 구성원들은 규율, 회복력, 그리고 조국에 대한 흔들림 없는 헌신의 화신입니다."
 HOL_corporatist_economy1: "조합주의 경제"
 HOL_corporatist_economy1_desc: "국가는 경제를 조합주의 모델로 재편하여 기업, 노동조합, 정부를 하나의 통일된 틀 아래 일치시켰습니다. 이 체제는 노동과 자본 사이의 갈등을 없애 효율적인 자원 배분, 빠른 산업 성장, 혁신을 가능하게 합니다. 조합주의 경제는 국가적 단결과 힘을 구현하며, 사회의 모든 부분이 국가 번영이라는 공동의 목표를 향해 일하도록 보장합니다."
 HOL_stabilize_society: "사회 안정화"
 HOL_stabilize_society_desc: "NVU는 전국에 질서와 규율을 회복하기 위한 집중적인 캠페인을 시작했습니다. 앞으로 180일 동안 소요를 진압하고, NVU의 비전 아래 사회를 통합하며, 새로운 정권에 대한 저항 세력의 잔재를 제거하는 데 노력이 집중될 것입니다. 이 기간은 안정적이고 번영하는 미래의 토대를 마련하는 데 매우 중요합니다."
 HOL_germanic_nationalist_boost: "민족주의의 기세"
 HOL_germanic_nationalist_boost_desc: "단결과 힘을 촉구하는 운동이 인기를 얻으면서 새로워진 민족주의적 열기가 온 나라를 휩쓸고 있습니다. 질서와 하나로 통합된 게르만 민족이라는 비전을 강조하는 파시즘적 이상이 그 어느 때보다 공감을 얻고 있으며, 이는 심오한 정치적 변혁의 무대를 마련하고 있습니다."
 HOL_dutch_german_hegemony1: "게르만 패권 주장"
 HOL_dutch_german_hegemony1_desc: "네덜란드는 게르만 민족에 대한 지도권을 주장하며 독일의 전통적인 역할에 도전했습니다. 이 대담한 행보는 네덜란드가 자신들의 단결과 지배라는 비전 아래 이 지역의 세력 균형을 재정의하려 함에 따라 게르만 국가들 사이에 긴장을 낳았습니다."
 HOL_fortification_efforts: "서방의 침공에 대비한 요새화"
 HOL_fortification_efforts_desc: "독일 영토를 정복한 후 네덜란드는 프랑스의 보복 가능성에 대비해야 합니다. 서부 전선을 따라 대규모 요새화 사업이 진행 중이며, 새로 얻은 영토를 프랑스의 어떠한 침공으로부터도 보호하기 위해 벙커와 방어 구조물의 건설에 중점을 두고 있습니다. 이러한 노력은 서쪽에서 오는 어떤 위협에도 우리의 국경이 안전하게 유지되도록 보장합니다."
 HOL_germanic_union_member1: "게르만 연합 회원국"
 HOL_germanic_union_member1_desc: "게르만 연합의 회원국으로서 우리는 공동의 번영, 안보, 지배를 추구하며 다른 게르만 국가들과 함께 단결하여 서 있습니다. 이 동맹은 군사, 경제, 문화 전반에 걸친 협력을 보장하여 우리 국가들 사이의 유대를 공고히 하고, 더 강하고 통일된 게르만 세계에서 우리의 자리를 확보합니다."
 HOL_germanic_union_infrastructure_efforts: "게르만 연합 인프라 사업"
 HOL_germanic_union_infrastructure_efforts_desc: "게르만 연합의 단결과 경제력을 강화하기 위해 회원국 전역에서 대규모 인프라 사업이 진행 중입니다. 철도, 고속도로, 물류 거점이 확장되어 끊김 없는 연결성을 보장하고, 무역을 촉진하며, 군사적 준비태세를 높이고 있습니다. 이러한 노력은 더 강하고 서로 더 긴밀히 연결된 게르만 세계에 대한 우리의 의지를 상징합니다."
 HOL_family_focus: "전통 가족 중시"
 HOL_family_focus_desc: "전통적인 가족 구조를 장려하는 것은 SGP가 연립 협상을 통해 밀어붙인 국가 정책의 초석이 되었습니다. 이제 재정적 유인책과 문화적 구상은 안정적인 다세대 가구를 지원하는 한편, 가족이 도덕적, 사회적 질서의 토대라는 역할을 강화하는 것을 목표로 합니다."
 HOL_religious_education_policy: "종교 교육 정책"
 HOL_religious_education_policy_desc: "SGP의 압력 아래 정부는 신앙 기반 교육의 위상을 강화하는 정책을 제정했습니다. 공공 지원은 부모의 권위, 전통적 도덕, 책임 있는 사회를 형성하는 종교의 역할을 강조하며 기독교적 가치를 지키는 기관으로 향하게 됩니다."
 HOL_sunday_rest: "일요일 안식의 신성함"
 HOL_sunday_rest_desc: "일요일은 신성한 안식과 예배의 날로 지켜집니다. 상업 활동과 공공 활동을 제한함으로써 이 정책은 시민들이 전통을 기리고, 가족 간의 유대를 강화하며, 영적 재충전을 얻을 수 있도록 보장합니다."
 HOL_nonselfsufficient_army1: "의존적인 군수 산업"
 HOL_nonselfsufficient_army1_desc: "[HOL_not_selsufficient_army1_loc]\n------------\n§Y군사§! 중점 경로의 §Y국내 투자§! 중점을 완료하면 이 §R국가 정신§!을 없앨 수 있습니다."
 HOL_nonselfsufficient_army1_tt: "[HOL_not_selsufficient_army3_loc]"
 HOL_nonselfsufficient_army_emergency: "군사 비상사태"
 HOL_nonselfsufficient_army_emergency_desc: "[HOL_not_selsufficient_army2_loc]"
 HOL_nso1: "네덜란드 우주 기구(NSO)"
 HOL_nso1_desc: "네덜란드 우주 기구(NSO)는 국가의 우주 연구, 위성 개발, 탐사 프로그램을 총괄하는 중앙 기관입니다. 항공우주 기술 분야의 국가적 노력을 조율하고, 국제 협력 관계를 육성하며, 우주에 대한 과학적 이해를 발전시킵니다."
 HOL_nato_training_program: "NATO 합동 훈련"
 HOL_nato_training_program_desc: ""
 HOL_nato_maritime_security: "해양 안보 리더십"
 HOL_nato_maritime_security_desc: ""
 HOL_dutch_realpolitik_idea: "네덜란드 왕국"
 HOL_dutch_realpolitik_idea_desc: ""
 HOL_suriname_trade_agreement_idea1: "수리남 무역 개발 협정"
 HOL_suriname_trade_agreement_idea1_desc: "수리남과의 양자 무역 개발 협정은 남아메리카에서 네덜란드 투자의 새로운 기회를 열었습니다. 개선된 시장 접근성, 항만 물류, 상호 인프라 구상을 통해 이 협정은 경제 협력을 강화하고 네덜란드를 이 지역 개발의 핵심 주체로 다시 자리매김하게 합니다."
 HOL_suriname_training_program: "수리남-네덜란드 군사 훈련 프로그램"
 HOL_suriname_training_program_desc: "수리남군과의 합동 훈련 구상을 통해 네덜란드는 지역 방위 관계를 심화하고 남아메리카 북부의 안정을 증진하고 있습니다. 네덜란드 교관들은 군수, 평화 유지, 마약 단속 작전에 대한 전문 지식을 제공하며, 상호 운용성과 장기적인 안보 협력을 도모합니다."
 HOL_support_boer_parties: "보어인 정치 운동 지원"
 HOL_support_boer_parties_desc: "네덜란드는 역사적 유대와 공통의 문화유산을 내세워 남아프리카의 보어인 계열 정당에 비공식적인 지원을 제공하기 시작했습니다. 이 지원에는 언론 홍보, 재정 지원, 이념적 연대가 포함됩니다. 문화 외교로 포장되어 있으나 이 조치는 네덜란드의 의도와 남아프리카의 내부 안정에 대해 심각한 의문을 제기합니다."
 HOL_counter_terrorism_idea1: "국가 대테러 태스크포스"
 HOL_counter_terrorism_idea1_desc: "급진화와 국내 위협에 대한 우려가 커지면서 정부는 NCTV의 조율 아래 통합 대테러 태스크포스를 가동했습니다. AIVD, 경찰, 군경찰의 긴밀한 협력으로 이 체계는 전국에서 신속한 위협 평가, 예방 전략, 단호한 대응 능력을 보장합니다."
 HOL_demissionaire_regering_idea: "사임 내각"
 HOL_demissionaire_regering_idea_desc: "집권 연립이 붕괴한 후 정부는 이제 사임 내각의 자격으로 운영되고 있습니다. 새 정책을 시행할 권한이 없고 의회의 지지가 약해진 상태에서, 국가는 새로운 지도부가 구성될 때까지 정치적 정체와 불확실성의 시기를 맞고 있습니다."
 HOL_demissionaire_regering_idea_TT: "§R새 정부가 들어서면 이 국가 정신은 제거됩니다§!"
 HOL_royal_decree_industrial_promotion: "국가 산업에 관한 왕령"
 HOL_royal_decree_industrial_promotion_desc: "왕관의 명에 따라 왕국의 산업 역량을 끌어올리기 위한 전면적인 칙령이 발표되었습니다. 핵심 부문 배후에 왕실의 후원이 있는 가운데 공장이 확장되고 혁신이 장려되며, 네덜란드 경제는 생산과 무역 분야에서 유럽 대륙의 선두 자리를 되찾을 태세를 갖추고 있습니다."
 HOL_gujurat_port_patrol1: "소규모 [HOL.GetAdjectiveCap] 존재감"
 HOL_gujurat_port_patrol1_desc: "이 주에 마오주의 반군이 존재하면서 권력 공백이 생겼고, 네덜란드는 이를 이용하기 시작했습니다. 아직 영향력은 작지만, 중앙 정부가 통제를 유지하기 위해 고군분투하는 사이 네덜란드는 꾸준히 입지를 넓히고 있습니다."
 HOL_gujurat_port_patrol3: "중간 규모 [HOL.GetAdjectiveCap] 존재감"
 HOL_gujurat_port_patrol3_desc: "인도 정부가 마오주의 반군 활동에 신경을 빼앗긴 사이 네덜란드는 이 주에서 영향력을 확대했습니다. 현지 행정이 약해짐에 따라 경제적으로나 정치적으로나 네덜란드의 존재감이 점점 뚜렷해지고 있습니다."
 HOL_gujurat_port_patrol4: "지배적인 [HOL.GetAdjectiveCap] 존재감"
 HOL_gujurat_port_patrol4_desc: "네덜란드는 마오주의 반군이 초래한 불안정을 최대한 활용하여 이 주에서 사실상 전적인 영향력을 확보했습니다. 인도 정부의 장악력은 거의 사라졌으며, 네덜란드가 이 지역의 주된 세력으로 남았습니다."
