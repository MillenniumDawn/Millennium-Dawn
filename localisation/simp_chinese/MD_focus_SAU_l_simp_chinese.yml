 SAU_events.310.d: "Domestic Self-Reliance"
 SAU_events.310.desc: "Operation Desert Storm humbled every army that watched it. The Royal Saudi Land Forces performed adequately beside their coalition partners - but the General Staff knows the truth: without American airpower, logistics and command, the Kingdom's army was not ready.\n\nThe war games are over, and the verdict is in. Now the Kingdom must choose the model on which to rebuild its armed forces. Each path makes us stronger in one way and weaker in another - there is no free choice.\n\n§YHover each option to see exactly what it grants and what it costs.§!"
 SAU_events.310.t: "War Games: Lessons of the Gulf War"
