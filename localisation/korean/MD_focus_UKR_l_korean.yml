 UKR_modernize_sov_category: "소련 유산 장비 현대화"
 UKR_modernize_sov_category_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_main\n\n\n\n\n\n\n\n\n소련 시대 장비를 위한 현대화 개량을 연구, 시험 및 적용하는 데 시간과 자원을 투자할 수 있습니다. 기존 설계를 현대 기술로 개선함으로써 운용 수명을 연장하고 전투 능력을 강화할 수 있습니다. 이러한 사업을 통해 소련으로부터 물려받은 방대한 무기고를 최대한 활용하면서 점차 현대전의 요구에 맞게 적응시킬 수 있습니다."
 UKR_develop_domestic_category: "자국 무기 체계 개발"
 UKR_develop_domestic_category_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_main\n\n\n\n\n\n\n\n\n우리만의 현대 무기 체계를 연구하고 개발하는 데 시간과 자원을 투자할 수 있습니다. 우크라이나의 공학 전문성과 산업 전통을 바탕으로 우리 군의 요구에 맞춘 장비를 만들 수 있습니다. 자국 방위 산업을 구축하면 군사 능력이 강화되고 외국 공급자에 대한 의존이 줄어들 것입니다."
 UKR_modernize_bmp1u: "§YBMP-1U '시크발'§! 개발"
 UKR_modernize_bmp1u_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bmp1u_shkval_for_tooltip\n\n\n\n\n\n\n\n\n§W키이우의 국립 포병 및 소화기 과학기술센터가 BMP-1의 제한적인 우크라이나식 개량형을 개발하였습니다.\n기존 포탑은 경장갑차의 전투 효율을 높이기 위해 개발된 새로운 KBA-105 시크발 원격 무장 스테이션(RWS)으로 교체되었습니다.§!"
 UKR_modernize_bmp1m: "§YBMP-1M§! 개발"
 UKR_modernize_bmp1m_desc: "§W2011년에 공개된 BMP-1U에서 발전한 형식입니다.\n주된 차이점은 개량된 KBA-105TB 시크발-A RWS를 적용한 것으로, 콘쿠르스 대전차 유도 미사일 발사기가 장거리 우크라이나제 바리어 대전차 유도 미사일로 교체되었으며 새로운 탄뎀-2 조준 체계와 개량된 SWU-500-3C 무장 안정화 체계를 사용합니다.§!"
 UKR_modernize_bmp1um: "§YBMP-1UM§! 개발"
 UKR_modernize_bmp1um_desc: "§W지토미르 장갑차 공장이 수행하여 2015년에 공개된 표준 BMP-1의 보다 포괄적인 개량형입니다.\n300마력의 UTD-20 엔진은 400마력을 내는 3기통 2행정 3TD-2 디젤 엔진으로 교체되었고, 선체 지붕을 15cm 높여 병력 수용실 배치를 개선하였으며, BMP-1 후면의 작고 불편한 탈출구는 수동식이긴 하나 큰 램프로 교체되었습니다.§!"
 UKR_modernize_bmp1umd: "§YBMP-1UMD§! 개발"
 UKR_modernize_bmp1umd_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bmp1umd_for_tooltip\n\n\n\n\n\n\n\n\n§W지토미르 장갑차 공장이 BMP-1UM에서 한 단계 더 발전시킨 형식으로, 2016년 무기·안보 전시회에서 공개되었습니다.\n이 파생형은 새로운 RWS와 엔진을 갖추었으며, 전자 제어식 도이츠 TCD2013 L64V 6기통 터보 디젤로 구동됩니다. 이 엔진은 330마력을 내며 UTD-20과 3TD-2 모두보다 신뢰성이 높고 조용하며 효율적입니다.§!"
 UKR_modernize_bmp1ts: "§YBMP-1TS§! 개발"
 UKR_modernize_bmp1ts_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bmp1ts_for_tooltip\n\n\n\n\n\n\n\n\n§WBMP-1TS는 2018년부터 BMP-1용 RWS 스피스를 개발해 온 NVK 테크임펙스가 만든 우크라이나식 개량형입니다.\n스피스 모듈에는 열상 및 광학 TV 카메라와 레이저 거리 측정기를 갖춘 카잔-3K15 조준 복합체로 구성된 신테즈 사격 통제 체계가 적용되었습니다.§!"
 UKR_modernize_bmp_m1s: "§YBMP-M1S§! 개발"
 UKR_modernize_bmp_m1s_desc: "§WBMP-M1S는 우크로보론프롬 기업 그룹 소속인 지토미르 장갑차 공장이 자체 운전 자본으로 개발한 장갑 궤도 전투차량입니다.\n이 신제품은 키이우에서 열린 2018 무기·안보 전시회에서 공개되었습니다.\nBMP-M1S는 화력과 방호 수준을 크게 높이고 구식 소련제 엔진을 독일 도이츠 엔진으로 교체한 개조형입니다.\n이에 따라 BMP-M1S는 최대 8명의 병력을 수송할 수 있으며, '스틸레트' 전투 모듈의 강력한 화력으로 보병 부대의 행동을 효과적으로 지원합니다.§!"
 UKR_modernize_bmp1m_praktyka: "§YBMP-1M '프락티카'§! 개발"
 UKR_modernize_bmp1m_praktyka_desc: "§W우크라이나 제조사 NVO 프락티카는 2021년 BMP-1M 장갑차를 선보였습니다.\n개량된 BMP-1에는 병력 수용실의 통상적인 두 개의 문-연료 탱크 대신 현대식 장비가 장착되어 있습니다.\n또한 전투차량의 차체 높이가 약간 높아진 점도 눈에 띕니다.\n이 현대화된 BMP는 NVK 테크임펙스가 개발·제작한 개량 전투 모듈 '스피스-신테즈'를 갖추었다는 점에서도 소련제 모델과 다릅니다.§!"
 UKR_modernize_bmp1u_flag: " 완료된 결정: §YBMP-1U 개발§!"
 UKR_modernize_bmp1m_flag: " 완료된 결정: §YBMP-1M 개발§!"
 UKR_modernize_bmp1um_flag: " 완료된 결정: §YBMP-1UM 개발§!"
 UKR_modernize_bmp1umd_flag: " 완료된 결정: §YBMP-1UMD 개발§!"
 UKR_modernize_mt_lbr6: "§YMT-LBR6§! 개발"
 UKR_modernize_mt_lbr6_desc: "§WMT-LBR6은 MT-LB 차체에 ZTM-1 전투 모듈을 얹은 경보병전투차입니다.\n무장: 30mm ZTM-1 자동포, 7.62mm CT 기관총, 902B '투차' 체계의 연막탄 발사기.\n승무원 방호는 이격 장갑과 케블라 내장재로 강화되었으며, 하부 주행장치는 대성형작약 스크린으로 덮여 있습니다.\n제조사: 하르키우 트랙터 공장.§!"
 UKR_modernize_mt_lbmsh: "§YMT-LBMSh§! 개발"
 UKR_modernize_mt_lbmsh_desc: "§WMT-LBMSh는 MT-LB 차체에 '시크발' 전투 모듈을 얹은 경보병전투차입니다.\n무장: ZTM-1 30mm 자동포, 이와 함께 장착된 KT-7,62 7.62mm 기관총, 바리어 대전차 유도 미사일 2기, 30mm 자동 유탄 발사기, 연막탄 발사기.\n2006년부터 KMDB에서 생산되었습니다.§!"
 UKR_modernize_mt_lbr7: "§YMT-LBR7§! 개발"
 UKR_modernize_mt_lbr7_desc: "§WMT-LBR7은 MT-LB 차체에 '시투름' 전투 모듈을 얹은 경보병전투차입니다.\n무장: ZTM-1 30mm 자동포, 이와 함께 장착된 KT-7,62 7.62mm 기관총, 9M113M '콘쿠르스-M' 대전차 유도 미사일 발사기 2기, 30mm 자동 유탄 발사기, 연막탄 발사기.\n승무원 방호는 이격 장갑과 케블라 내장재로 강화되었으며, 하부 주행장치는 대성형작약 스크린으로 덮여 있습니다.\n제조사: 하르키우 트랙터 공장.§!"
 UKR_modernize_mt_lb_at: "§YMT-LB-AT§! 개발"
 UKR_modernize_mt_lb_at_desc: "§WMT-LB-AT는 MT-LB의 개조형으로, 장갑 방호가 된 회전식 플랫폼을 갖추고 12.7mm DShKM 기관총으로 무장하였습니다.§!"
 UKR_modernize_mt_lb_t_23_2: "§YMT-LB-T-23-2§! 개발"
 UKR_modernize_mt_lb_t_23_2_desc: "§WMT-LB-T-23-2는 NVK 테크임펙스가 개발한 MT-LB 현대화형입니다.\n장갑 방패와 새로운 조준경을 갖추었으며 ZU-23-2를 주무장으로 사용합니다.\n시연용 시제품은 2015년 9월 21일 '무기·안보' 전시회에서 공개되었습니다.§!"
 UKR_modernize_mt_lbr6_flag: " 완료된 결정: §YMT-LBR6 개발§!"
 UKR_modernize_mt_lbr7_flag: " 완료된 결정: §YMT-LBR7 개발§!"
 UKR_modernize_mt_lbrmsh_flag: " 완료된 결정: §YMT-LBMSh 개발§!"
 UKR_modernize_btr_70m: "§YBTR-70M§! 개발"
 UKR_modernize_btr_70m_desc: "§WBTR-70M은 BTR-70의 우크라이나식 개조형입니다.\n이 현대화는 우크라이나군 평화유지 부대의 장비 공급을 위한 국가 방위 발주의 틀 안에서 O. O. 모로조프 명칭 하르키우 설계국이 수행하였습니다.\n가솔린 엔진 2기 대신 BMP-1의 다연료 디젤 엔진 UTD-20이 설치됩니다.\n무장은 14.5mm KPVT 대구경 기관총과 7.62mm PKT 쌍열 기관총입니다. 측면 해치는 BTR-80 형식입니다.§!"
 UKR_modernize_btr_70m_kba2: "§YBTR-70M-KBA-2§! 개발"
 UKR_modernize_btr_70m_kba2_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr70_kba2_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-70M-KBA-2는 BTR-70의 우크라이나식 개조형입니다.\n이 현대화는 O. O. 모로조프 명칭 하르키우 설계국이 수행하였습니다.\nBTR-70의 포탑은 제거되었고, 그 자리에 30mm KBA-2 자동포와 연막탄 발사 장치를 갖춘 전투 모듈이 설치되었습니다(그 결과 차량 높이가 2,765mm로 늘어났습니다).\n측면 해치는 BTR-80 형식입니다.§!"
 UKR_modernize_btr_70m_hrim: "§YBTR-70M '흐림'§! 개발"
 UKR_modernize_btr_70m_hrim_desc: "§WBTR-70M '흐림'은 BTR-70의 우크라이나식 개조형입니다.\n이 현대화는 O. O. 모로조프 명칭 하르키우 설계국이 수행하였습니다.\n표준 포탑 대신 BM-1B '흐림' 전투 모듈(30mm 자동포, 7.62mm 기관총, 30mm AG-17 자동 유탄 발사기, 탄약 4발 적재의 바리어 대전차 유도 미사일 체계)이 설치됩니다.\n측면 해치는 BTR-80 형식입니다.§!"
 UKR_modernize_btr_7: "§YBTR-7 '자히스니크'§! 개발"
 UKR_modernize_btr_7_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr7_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-7 '자히스니크'는 BTR-70의 우크라이나식 개조형입니다.\n이 현대화는 미콜라이우 장갑차 공장이 수행합니다.\n이베코 유로카르고 트럭의 FPT 이베코 텍토르 P4(유로 III) 엔진 2기를 장착하며 각각 150마력입니다.\n이 장갑차는 두 평면에서 안정화된 BUG 전투 장치를 갖추고 있으며, 기본 무장은 14.5mm KPVT 기관총(500발), 7.62mm PKT 기관총(1,500발), 30mm AGS-17 자동 유탄 발사기(87발), 130mm 바리어 대전차 유도 미사일 2기(미사일 4발)로 구성됩니다.§!"
 UKR_modernize_btr_70t: "§YBTR-70T§! 개발"
 UKR_modernize_btr_70t_desc: "§WBTR-70T는 NVK 테크임펙스의 BTR-70 우크라이나식 현대화형입니다.\nBTR-80과 같은 새 측면 승하차 해치, R-173 무전기, 총출력 312마력의 새 D245.30E2 디젤 엔진 2기, BTR-80의 전후방 표시등, 튜브리스 타이어가 달린 새 바퀴가 설치되었습니다.\n다른 전투 모듈을 설치하는 것도 가능합니다.§!"
 UKR_modernize_varan: "§Y'바란'§! 개발"
 UKR_modernize_varan_desc: "§W바란은 BTR-70을 근본적으로 현대화한 우크라이나제 장갑차입니다.\nNVK 테크임펙스가 개발하였습니다.\n바란은 새로 설계된 장갑 차체와 크게 바뀐 배치를 갖추었는데, 엔진이 전방에 위치하고 후방에 승하차 장치가 생겼습니다.\n배치 변경의 결과 병력 수용실은 유효 내부 용적이 35% 늘어났으며, 후방의 접이식 장치를 통해 병사들이 승하차할 수도 있게 되었습니다.\n무장은 스피스 전투 모듈로, 탄 300발의 30mm 2A72형 포(ZTM-1 또는 KBA-1), 125발의 30mm KBA-117(AGS-17) 자동 유탄 발사기, 7.62mm KT-7,62 기관총, 미사일 2발의 '바리어' 유도 무기 복합체를 갖추었습니다.§!"
 UKR_modernize_btr_70m_flag: "완료된 결정: §YBTR-70M 개발§!"
 UKR_modernize_btr_70m_kba2_flag: "완료된 결정: §YBTR-70M-KBA-2 개발§!"
 UKR_modernize_btr_70m_hrim_flag: "완료된 결정: §YBTR-70M '흐림' 개발§!"
 UKR_modernize_btr_70t_flag: "완료된 결정: §YBTR-70T 개발§!"
 UKR_modernize_btr_80_kba2: "§YBTR-80-KBA-2§! 개발"
 UKR_modernize_btr_80_kba2_desc: "§WBTR-80-KBA-2는 BTR-80의 우크라이나식 개조형입니다.\n이 현대화는 O. O. 모로조프 명칭 하르키우 설계국이 수행하였습니다.\n우크라이나제 UTD-20 디젤 엔진이 설치됩니다.\n14.5mm KPVT 기관총 대신 30mm KBA-2 포가 설치되었습니다.\n연료 소비가 크게 줄어 같은 연료량으로 주행 거리가 25% 늘었습니다.\n엔진 토크가 증가하여 악조건 도로 환경에서의 야지 주행 능력이 향상되었습니다.\n30mm 구경 KBA-2 포의 설치로 사격의 사거리와 효과가 높아집니다.§!"
 UKR_modernize_btr_80m_hrim: "§YBTR-80M '흐림'§! 개발"
 UKR_modernize_btr_80m_hrim_desc: "§WBTR-80M '흐림'은 BTR-80의 우크라이나식 개조형입니다.\n이 현대화는 O. O. 모로조프 명칭 하르키우 설계국이 수행하였습니다.\n표준 포탑 대신 BM-1B '흐림' 전투 모듈(30mm 자동포, 7.62mm 기관총, 30mm AG-17 자동 유탄 발사기, 탄약 4발 적재의 바리어 대전차 유도 미사일 체계)이 설치됩니다.§!"
 UKR_modernize_btr_80up: "§YBTR-80UP§! 개발"
 UKR_modernize_btr_80up_desc: "§WBTR-80UP는 이라크 입찰에 참여하기 위한 BTR-80의 폴란드-우크라이나 공동 현대화 사업입니다.\n방호가 강화되고, 출력 300마력의 새 디젤 엔진, 새 타이어, 새 전기 및 공압 체계가 설치되었으며 수력 추진 장치는 제거되었습니다.\n일반형 장갑차 외에 7종의 특수 개조형이 개발되었습니다.§!"
 UKR_modernize_btr_80t: "§YBTR-80T§! 개발"
 UKR_modernize_btr_80t_desc: "§WBTR-80T는 NVK 테크임펙스의 BTR-80 우크라이나식 현대화형입니다.\n기존 엔진은 출력 303마력의 더 강력한 터보차저 엔진으로 교체되었습니다.\n변속기는 8단입니다. 항속거리는 750km로 늘었습니다.\n무장은 새 BM-23-2 전투 모듈로 교체되었습니다.§!"
 UKR_modernize_btr_80_kba2_flag: " 완료된 결정: §YBTR-80-KBA-2 개발§!"
 UKR_modernize_btr_80m_hrim_flag: " 완료된 결정: §YBTR-80M '흐림' 개발§!"
 UKR_modernize_t55_5tdf: "§YT-55-5TDF§! 개발"
 UKR_modernize_t55_5tdf_desc: "§WT-55-5TDF는 T-55 전차의 우크라이나식 현대화형입니다.\n이 현대화는 O. O. 모로조프 명칭 하르키우 설계국이 수행하였습니다.\n이 전차는 출력 700마력의 5TDF 디젤 엔진을 장착하여 포장도로에서 시속 60km, 험지에서 시속 40km에 도달할 수 있습니다.\n또한 레이저 거리 측정기, 탄도 계산기, 열상 조준경을 포함한 새 사격 통제 체계를 갖추었습니다.\n추가 장갑판과 폭발 반응 장갑을 설치하여 장갑 방호력이 향상되었습니다.§!"
 UKR_modernize_t55_5tdf_flag: " 완료된 결정: §YT-55-5TDF 개발§!"
 UKR_modernize_t55agm: "§YT-55AGM§! 개발"
 UKR_modernize_t55agm_desc: "§WT-55AGM은 T-55 전차의 우크라이나식 현대화형입니다.\n이 전차는 출력 700마력의 5TDF 디젤 엔진을 장착하여 포장도로에서 시속 60km, 험지에서 시속 40km에 도달할 수 있습니다.\n또한 레이저 거리 측정기, 탄도 계산기, 열상 조준경을 포함한 새 사격 통제 체계를 갖추었습니다.\n니즈 폭발 반응 장갑을 설치하여 장갑 방호력이 향상되었습니다.§!"
 UKR_modernize_t55agm_flag: "완료된 결정: §YT-55AGM 개발§!"
 UKR_modernize_t55m8_a2_tifon_ii: "§YT-55M8-A2 티폰 2§! 개발"
 UKR_modernize_t55m8_a2_tifon_ii_desc: "§WT-55M8-A2 티폰 2는 페루를 위한 T-55 전차의 우크라이나식 현대화형입니다.\n이 전차는 출력 700마력의 5TDF 디젤 엔진을 장착하여 포장도로에서 시속 60km, 험지에서 시속 40km에 도달할 수 있습니다.\n또한 레이저 거리 측정기, 탄도 계산기, 열상 조준경을 포함한 새 사격 통제 체계를 갖추었습니다.\n니즈 폭발 반응 장갑을 설치하여 장갑 방호력이 향상되었습니다.§!"
 UKR_develop_t64bm_bulat: "§YT-64BM '불라트'§! 개발"
 UKR_develop_t64bm_bulat_desc: "§WT-64BM '불라트'는 T-64B를 T-84 수준으로 끌어올리는 우크라이나식 현대화형입니다.\n니즈 반응 장갑, 9K120 레플렉스 미사일(NATO 코드 AT-11 스나이퍼), 1A45 이르티시 사격 통제 장치, TKN-4S 전차장 조준경, PZU-7 대공 기관총 조준경, TPN-4E 부란-E 야간 투시 장치, 6TDF 1,000마력(735kW) 엔진을 갖추었습니다.\nT-64BM '불라트'는 2004년의 가장 최근 현대화형입니다.§!"
 UKR_develop_t64e: "§YT-64E§! 개발"
 UKR_develop_t64e_desc: "§WT-64E는 T-64를 전면 현대화한 우크라이나의 시험용 주력 전차입니다.\nKhBTRZ(하르키우 장갑차 수리공장)에서 개발되었습니다.\nT-64의 이전 개조형에 비해 현대화된 이 전차는 전투력, 기동성, 방호력이 크게 향상되었습니다.\n2011년 기준 T-64E의 대당 비용은 약 112만 달러였습니다.§!"
 UKR_develop_t64bv_1: "§YT-64BV-1§! 개발"
 UKR_develop_t64bv_1_desc: "§WT-64BV-1(언론에서는 T-64B1M/T-64BM1M으로도 알려짐)은 2014년에 만들어져 하르키우 장갑차 공장에서 개발한 T-64B1 전차 현대화의 단순화 버전입니다.\n이 전차는 포탑, 차체 전면부, 측면의 방호를 강화하는 내장형 '니즈' 반응 장갑을 갖추었습니다.\n포탑 후방부에는 탄약 및 장비용 수납 공간이 설치됩니다.\n전차에는 5TDF 엔진이 설치됩니다.\n이는 '불라트' 현대화의 단순화되고 더 저렴한 방안입니다.§!"
 UKR_develop_t64bv_2017: "§YT-64BV§!를 §Y2017년형§!으로 현대화"
 UKR_develop_t64bv_2017_desc: "§WT-64BV 2017년형(또는 2017 모델)은 진행 중인 T-64 전차 계열 현대화로, 전 승무원용 신형 열상 장비 도입, 루나 적외선 탐조등 제거, TPN1-49-23 대신 우크라이나제 TPN-1-TPV 야간 조준경 도입, T-64BV 포탑에 볼트로 교체 부착할 수 있게 설계된 '니즈' 반응 장갑 모듈, SN-4215 네트워크 위성 항법 장치, 70km 통달거리의 보안 통신을 제공하는 리비드 K-2RB 디지털 무전기(모토로라 라이선스 생산)를 포함하는 것을 목표로 합니다.§!"
 UKR_develop_t64bv_2022: "§YT-64BV§!를 §Y2022년형§!으로 추가 현대화"
 UKR_develop_t64bv_2022_desc: "§WT-64BV 2022년형(또는 2022 모델)은 T-64 전차 계열의 최신 현대화형입니다. 이 전차는 새로운 3세대 감시 및 조준 장치를 갖추었고 신형 12.7mm 스니펙스 라스카 K-2 중기관총이 장착됩니다.\n나토 표준을 완전히 충족하는 최신 무전기와 추가 항법, 내외부 통신 체계를 갖추었습니다.\n외부 연료 탱크 역시 이제 12mm 강판으로 보호됩니다.§!"
 UKR_develop_t64_krab: "§YT-64 '크랍'§! 개발"
 UKR_develop_t64_krab_desc: "§WT-64 '크랍'은 T-64B(T-64BV) 전차 현대화에 관한 연구개발 작업입니다.\n설계 연구는 모로조프 명칭 하르키우 기계공학 설계국이 수행합니다.\n작업은 2016년에 시작되었습니다.\nT-64에는 출력 1,200마력의 6TD 엔진 설치가 예정되어 있었습니다.\n표준보다 큰 엔진을 설치하기 위해 양산형 T-64의 차체를 뜯어 고칩니다.§!"
 UKR_develop_t_rex: "§Y'T-렉스'§! 개발"
 UKR_develop_t_rex_desc: "§W'T-렉스'는 2016년에 발표된 우크라이나의 주력 전차로, 아조우 대대 소속 기술 집단인 아레이 기술 집단이 개발하였습니다.\n이 전차는 T-64를 기반으로 하며 무인 포탑을 갖출 예정이었습니다.\n승무원 3명은 차체 전방의 장갑 캡슐에 앉아 주포, 자동 장전 장치, 기관총을 원격으로 조종할 수 있습니다.\nT-렉스의 무게는 39톤이며 '고출력 포탄'을 쓰는 125mm 주포를 갖출 예정이었습니다.\n장갑은 '니즈'와 '듀플레트' 폭발 반응 장갑을 모두 활용할 예정이었습니다.\n우크라이나 언론은 이 전차의 전투 능력이 우크라이나의 오플로트와 불라트를 능가하면서도 불라트보다 비용 효율이 높다고 전했습니다.§!"
 UKR_develop_t64bm2_bulat: "§YT-64BM '불라트'§!를 §YT-64BM2 '불라트-M'§!으로 추가 현대화"
 UKR_develop_t64bm2_bulat_desc: "§WT-64BM2(언론에서는 '불라트' 또는 '케드르'로도 불림)는 '케드르' 사업에 따른 T-64 전차의 현대화형입니다.\n이는 기술 실증기로서, 6TD-1 엔진으로 T-64 계열 전차의 엔진을 교체하고 엔진 및 변속기실을 완전히 재설계하는 연구개발 작업입니다.§!"
 UKR_develop_t64bm_bulat_flag: "완료된 결정: §YT-64BM '불라트' 개발§!"
