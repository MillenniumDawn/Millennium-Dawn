 ARM_olympic_comitee: "Comitê Olímpico"
 ARM_olympic_comitee_desc: "Precisamos fortalecer e apoiar o Comitê Olímpico de todas as formas possíveis. Gagik Tsarukyan é ele próprio um atleta e não pode ficar de lado."
 ARM_tsaruk_trde: "Comércio de Tsarukyan"
 ARM_tsaruk_trde_desc: "Tsarukyan é um comerciante muito experiente. Talvez devêssemos estatizar esse empreendimento?"
 ARM_utilize_assets: "Aproveitando Nossos Ativos"
 ARM_utilize_assets_desc: "Devemos usar tudo o que há em nosso país para aumentar a receita, mesmo que isso signifique mais esforço em todas as esferas da economia."
 ARM_statue_of_christ: "A Nova Estátua de Cristo"
 ARM_statue_of_christ_desc: "Tsarukyan é um cristão muito devoto. Ele quer construir uma nova estátua de Jesus Cristo. Que ideia maravilhosa!"
 ARM_sport_youth: "Juventude Esportiva"
 ARM_sport_youth_desc: "Todos os jovens da Armênia devem ser esportivos, fortes e saudáveis! Esse é o nosso objetivo final."
 ARM_bet_culture: "Abraçar a Cultura das Apostas"
 ARM_bet_culture_desc: "Muitos armênios gostam de beber cerveja e apostar em esportes. Devemos apoiar essa cultura! O que há de errado nisso?"
 ARM_support_peasants: "Apoio à População Rural"
 ARM_support_peasants_desc: "Toda a população rural deve ser apoiada. O próprio Tsarukyan vem de origem camponesa e conhece as dificuldades do povo comum."
 ARM_befr_mafia: "Fazer Amizade com a Máfia"
 ARM_befr_mafia_desc: "Fazer amizade com a máfia pode servir aos nossos objetivos políticos a longo prazo, transformando suas redes em um instrumento do poder estatal."
 ARM_freedom_for_pes: "Liberdade para os Camponeses"
 ARM_freedom_for_pes_desc: "Devemos evitar interferir nos pequenos negócios da produção agrícola. Precisamos dar a eles alguma liberdade."
 ARM_hire_pmc_wagner: "Contratar a PMC Wagner"
 ARM_hire_pmc_wagner_desc: "A guerra marcha por nossas terras e pretendemos não poupar despesas para defender nossa pátria; buscaremos ajuda da Rússia e de suas famosas PMCs para repelir o ataque inimigo."
 ARM_create_pmc: "PMC Guerreiros do Leão Dourado"
 ARM_create_pmc_desc: "Também precisamos criar nossa própria empresa militar privada, que protegerá os interesses do nosso país por uma boa remuneração, a qual certamente lhes forneceremos."
 ARM_sport_development: "Nação Esportiva"
 ARM_berkut_troops: "Berkut"
 ARM_farmercracy: "Agrarismo"
 ARM_corporatocracy: "Corporatocracia"
 ARM_unstable_government_idea: "Governo Instável"
 arme.73.t: "Estátua de Cristo na Armênia"
 arme.73.d: "Nosso grandioso projeto religioso, a estátua de Jesus Cristo, foi concluído. Agora a Armênia tem em seu território o seu próprio rosto de Cristo, e cristãos de todo o mundo nos admiram."
 arme.73.a: "Com a Ajuda de Deus"
 ARM_Demirchyan: "Partido Popular da Armênia"
 ARM_Demirchyan_desc: "O Partido Popular da Armênia (em armênio: Hayastani Zhoghovrdakan Kusaktsutyun) é um partido político socialista na Armênia. Foi formado pelo líder partidário e estadista soviético e armênio Karen Demirchyan, que serviu como Primeiro Secretário do Partido Comunista da Armênia de 1974 a 1988. Agora seu filho Stepan Demirchyan está à frente do partido."
 ARM_strat_technocrats: "Promover Tecnocratas"
 ARM_strat_technocrats_desc: "Para fazer da Armênia o que queremos que ela seja, precisamos realizar uma reforma em larga escala do governo e do gabinete de ministros, removendo os antigos bajuladores do governo anterior e trazendo novos jovens profissionais."
 ARM_reindustr_country: "Reverter a \"Reconstrução\""
 ARM_reindustr_country_desc: "O sujo Gorbachev, que iniciou sua perestroika, arruinou nosso país, desonrando-o e deixando-o em ruínas. É hora de reconstruir de volta o sistema socialista e esquecer por muito tempo esses terríveis últimos dias da URSS."
 ARM_demirch_gamble: "A Aposta de Stepan"
 ARM_demirch_gamble_desc: "Apesar das visões socialistas de Stepan, seria politicamente benéfico unir-se a um dos outros partidos que têm a mesma agenda de política externa que a nossa."
 ARM_legacy_of_father: "Legado do Pai"
 ARM_legacy_of_father_desc: "Temos apenas um slogan, um lema: todos os que trabalham têm o direito de desfrutar dos benefícios da vida. Os parasitas, os parasitas que sugam o sangue dos trabalhadores, devem ser privados desses benefícios. E proclamamos: tudo para os trabalhadores, tudo para os trabalhadores!"
 ARM_iron_fisting_oligs: "Esmagar a Oligarquia"
 ARM_iron_fisting_oligs_desc: "Devemos garantir que os bandidos dos anos 90 não governem mais este país e sua economia!"
 ARM_socialism_with_human_face: "Socialismo de Face Humana"
 ARM_socialism_with_human_face_desc: "Religião e socialismo não são nada antagônicos. Até o governo soviético permitiu a Igreja Armênia em seu período. Não devemos lutar contra a igreja, mas nos unir a ela!"
 ARM_coalition_with_vazgen_supporters: "Coalizão com os Apoiadores de Vazgen"
 ARM_coalition_with_vazgen_supporters_desc: "O ataque ao parlamento em 1999 teve como foco específico impedir que o Yerkrapah e o Partido Popular da Armênia chegassem ao poder. Vazgen Sargsyan e Karen Demirchyan foram assassinados durante aquele ataque. Devemos nos unir novamente pela prosperidade de nossa nação!"
 ARM_remember_shaumian: "Estratégia de Shaumyan"
 ARM_remember_shaumian_desc: "Shaumyan foi um exemplo marcante do nacionalismo armênio e do bolchevismo unidos a serviço da classe trabalhadora e da coesão nacional. Devemos levar seu legado adiante."
 ARM_euro_dilemma: "Dilema Europeu"
 ARM_euro_dilemma_desc: "Devemos finalmente decidir nossa posição em relação à União Europeia. Somos bastante simpáticos à UE, porém nossa situação geopolítica pode nos ditar uma postura diferente."
 ARM_rebuilding_initiative: "Iniciativa de Reconstrução"
 ARM_rebuilding_initiative_desc: "Lênin entendia que o renascimento do capitalismo não era seguro para a RSFSR, mas o considerava aceitável, porque a questão era a medida. E essa medida foi estabelecida pelos próprios sovietes. Isso permitiu regular o crescimento do setor capitalista da economia: \"Para manter o caminho do socialismo, fazemos aos camponeses uma série de concessões, dentro dos limites das quais nós mesmos julgaremos.\""
 ARM_sov_legacy_cond_dec: "Condenar as Decisões Soviéticas"
 ARM_sov_legacy_cond_dec_desc: "Um século inteiro se passou desde que a República Transcaucasiana foi formada. Dilacerada pelo nacionalismo, ela se dividiu em três Estados. Devemos esquecer as diferenças nacionais e históricas e ajudar nossos vizinhos a derrubar o poder burguês e estabelecer a ditadura do proletariado!"
 ARM_invite_asala: "Expansão Vermelha"
 ARM_invite_asala_desc: "O Exército Secreto Armênio para a Libertação da Armênia (ASALA) foi uma organização militante marxista-leninista ativa entre 1975 e a década de 1990, cujo objetivo declarado era obrigar o governo turco a reconhecer publicamente sua responsabilidade pelo genocídio armênio de 1915, pagar reparações e ceder território para uma pátria armênia. A própria ASALA e outras fontes a descreveram como uma organização guerrilheira e armada. Devemos seguir seus passos."
 ARM_workers_soldiers: "Trabalhadores e Soldados"
 ARM_workers_soldiers_desc: "Não podemos separar nossa identidade, nossa aspiração por justiça nacional, de nossa política econômica. Somos um país de armênios, somos um país de trabalhadores e soldados!"
 ARM_support_patriotic_movement: "Apoiar o Movimento Patriótico"
 ARM_support_patriotic_movement_desc: "Devemos apoiar todos os movimentos patrióticos que não visem restaurar o capitalismo desenfreado em nosso país."
 ARM_legacy_of_father_idea: "Legado do Pai"
 ARM_legacy_of_father_two_idea: "Legado do Pai"
 ARM_legacy_of_father_three_idea: "Legado do Pai"
 ARM_legacy_of_father_four_idea: "Legado do Pai"
 ARM_christian_humanism_idea: "Humanismo Cristão"
 ARM_shaumians_thought_idea: "Pensamento de Shaumyan"
 ARM_armenia_demirchyan_idea: "Armênia de Demirchyan"
 ARM_asala_bases_idea: "Bases da ASALA"
 arm_demirchyan.1.t: "Limpeza nas Forças Armadas"
 arm_demirchyan.1.d: "Ainda há elementos perigosos no exército, representados pelos apoiadores de Kocharyan. Precisamos livrar o exército deles."
 arm_demirchyan.1.a: "Bom."
 arm_demirchyan.2.t: "Nossos Conselheiros"
 arm_demirchyan.2.d: "Talvez, para governar melhor, precisemos ouvir os conselhos de outros partidos. Resta apenas escolher quais."
 arm_demirchyan.2.a: "Paz e democracia devem guiar nosso povo."
 arm_demirchyan.2.b: "Somos a favor do socialismo de verdade."
 arm_demirchyan.3.t: "§Y[ARM.GetNameWithFlag]§! Oferece Acomodação para Bases da ASALA"
 arm_demirchyan.3.d: "§Y[ARM.GetNameWithFlag]§! está nos oferecendo bases para proteger nossa soberania da Turquia. Em troca, pedem nossa permissão para incluir a região de Van em sua zona de interesse."
 arm_demirchyan.3.a: "Estamos sempre ao lado de nossos irmãos de armas!"
 arm_demirchyan.3.b: "Desculpe, não."
 arm_demirchyan.4.t: "§Y[KUR.GetNameWithFlag]§! Rejeitou Nossa Oferta"
 arm_demirchyan.4.d: "Disseram que não precisavam da nossa ajuda."
 arm_demirchyan.4.a: "Tanto faz."
 arm_demirchyan.5.t: "Renascimento da ASALA"
 arm_demirchyan.5.d: "Tornou-se recentemente conhecido que o grupo ASALA, famoso por suas políticas militarizadas em relação ao Azerbaijão e à Turquia, está agora oficialmente de guarda sobre a segurança de §Y[ARM.GetNameWithFlag]§!."
 arm_demirchyan.5.a: "Ah, droga..."
 arm_demirchyan.5.b: "É apenas uma manobra política."
 arm_demirchyan.6.t: "A ASALA Está ao Lado do Nosso Governo"
 arm_demirchyan.6.d: "Ninguém é esquecido e nada é esquecido - junto com nossos aliados da ASALA, podemos levar §Y[ARM.GetNameWithFlag]§! a um grande futuro!"
 arm_demirchyan.6.a: "Ótimo!"
 arm_demirchyan_news.1.t: "[ARM.GetLeader] Critica Regimes Comunistas"
 arm_demirchyan_news.1.d: "O líder armênio [ARM.GetLeader] criticou publicamente todos os regimes comunistas do mundo. Ele disse que eles usavam os recursos de seus países de forma ineficiente e destruíam sua economia e cultura."
 arm_demirchyan_news.1.a: "Um golpe no sistema socialista."
 ARM_forced_industrialisation_unlock_tt: "§YAbrirá Decisões sobre Industrialização Forçada em §Y[ARM.GetNameWithFlag]§!§!"
 arm_demirchyan.8.t: "Nossa Posição sobre a UE"
 arm_demirchyan.8.d: "É preciso decidir se continuaremos a cooperação com a UE ou a abandonaremos. No entanto, se decidirmos continuar cooperando com a UE, talvez possamos obter algum benefício dela."
 arm_demirchyan.8.a: "Enviar uma delegação à UE."
 arm_demirchyan.8.b: "Temos outros planos."
 arm_demirchyan.9.t: "Delegação de §Y[ARM.GetNameWithFlag]§! Chega à Capital"
 arm_demirchyan.9.d: "§Y[ARM.GetNameWithFlag]§! quer continuar cooperando conosco apesar de sua ideologia. Aceitaremos a oferta?"
 arm_demirchyan.9.a: "Sim, por que não?"
 arm_demirchyan.9.b: "Comunistas não merecem nossa atenção."
 arm_demirchyan.10.t: "[FROM.GetNameWithFlag] Aceita!"
 arm_demirchyan.10.d: "Conseguimos convencê-los a continuar cooperando conosco."
 arm_demirchyan.10.a: "Ótimo!"
 arm_demirchyan.11.t: "Eles Recusaram Cooperar Conosco."
 arm_demirchyan.11.d: "Infelizmente, nosso acordo não os convenceu."
 arm_demirchyan.11.a: "Tanto faz."
 arm_demirchyan.12.t: "Futuro da Terra"
 arm_demirchyan.12.d: "É hora de decidir o futuro da nossa terra. Tanto as visões nacional-bolcheviques quanto as democráticas são populares em nosso país, mas o resultado final dependerá de nós."
 arm_demirchyan.12.a: "A democracia é o melhor para nós."
 arm_demirchyan.12.b: "Um caminho mais radical tornaria nosso país ainda mais forte."
