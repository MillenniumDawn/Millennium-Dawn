 increases_cb_rate_tooltip: "Raise the §YPolicy Rate§! by 1pp, tightening monetary conditions.\n\n§YEffects:§!\nQuarterly inflation suppressed by up to an additional §G0.2%§! per quarter\nInflation carryover cut by §G2.5pp§!, or as little as §G1.25pp§! with an excess budget deficit, when raising the rate above 0%. No carryover change while the rate remains at or below 0%\nPolicy-rate contribution to sovereign debt interest increased by §R0.33pp§! before the minimum floor and maximum cap apply\nMonthly §YCurrency Strength§! pressure raised by §G0.001§!, or by §G0.00025§! while inflation is far above the rate (no change once the rate is 6pp above inflation)\n\n§YPrerequisites:§!\n£pol_power_icon §Y25§! Political Power\nPolicy Rate below 30%\nNo rate change in the last 30 days"
 decreases_cb_rate_tooltip: "Lower the §YPolicy Rate§! by 1pp, easing monetary conditions.\n\n§YEffects:§!\nQuarterly inflation suppression reduced by up to §R0.2%§! per quarter\nInflation carryover cut reduced by §R2.5pp§!, or as little as §R1.25pp§! with an excess budget deficit, when lowering a positive rate. No carryover change at 0% or below\nPolicy-rate contribution to sovereign debt interest reduced by §G0.33pp§! before the minimum floor and maximum cap apply\nMonthly §YCurrency Strength§! pressure lowered by §R0.001§!, or by §R0.00025§! while inflation is far above the rate (no change while the rate stays 6pp above inflation)\n\n§YPrerequisites:§!\n£pol_power_icon §Y25§! Political Power\nPolicy Rate above -10%\nNo rate change in the last 30 days"
