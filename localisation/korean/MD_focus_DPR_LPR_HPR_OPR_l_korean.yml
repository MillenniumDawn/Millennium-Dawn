 DPR_donbass_infra: "새로운 도로"
 DPR_donbass_infra_desc: "돈바스 도시권에는 새 도로가 필요하며, 우리가 이를 건설할 것입니다."
 DPR_donbass_socialochka: "사회 보장 확대"
 DPR_donbass_socialochka_desc: "근로자가 업무상 재해를 입더라도 재정적으로 안정될 수 있도록 노동자 사회 보험도 확대할 것입니다"
 DPR_donbass_speeches: "열정적인 연설"
 DPR_donbass_speeches_desc: "또한 노동자들 앞에서 적극적으로 유세하며 다가올 개혁에 대해 끊임없이 알릴 것입니다"
 DPR_donbass_zavods: "새 공장"
 DPR_donbass_zavods_desc: "우리 시민에게는 일자리가 필요하며, 우리가 이를 제공할 것입니다."
 DPR_donbass_details: "생산 장비 개선"
