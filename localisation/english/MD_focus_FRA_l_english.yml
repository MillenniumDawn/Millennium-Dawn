 # Ideas
 FRA_idea_the_francosphere: "The Francosphere"
 FRA_idea_the_francosphere_desc: "The Francosphere is a political and global community of French-speaking peoples and nations. It is a mechanism to help France project its influence over the former colonies, but it remains as a cooperative amongst the French-speaking nations."
 FRA_idea_administrative_reforms: "Administrative Reforms"
 FRA_idea_administrative_reforms_desc: "The bureaucratic machine of France has undergone a series of important reforms reducing some of the cost as well as expanding the ability of the government to enact and put into effect a variety of new policy."
 FRA_idea_french_armored_production: "French Armoured Vehicles"
 FRA_idea_french_armored_production_desc: "French armoured vehicles are among the best fighting vehicles in the world. We must continue to maintain our advantage and continue our production of armoured vehicle production to counter the rise of new global threats."
 FRA_idea_central_decentral: "Bureaucratic Reform"
 FRA_idea_central_decentral_desc: "Competences are being redrawn between Paris and the regions, and every transferred file costs money and time before it pays off."
 FRA_idea_military_improvement_army: "Military Reform - Army"
 FRA_idea_military_improvement_army_desc: "The first of many reforms has started with the Army taking precedence. We chose the army as being the most important as it can protect the borders of our country as well as the borders of our allies."
 FRA_idea_military_improvement_navy: "Military Reform - Navy"
 FRA_idea_military_improvement_navy_desc: "The first of many reforms has started with the Navy taking precedence. Our navy is important in maintaining crucial supply links, military power projection, and securing our overseas territories."
 FRA_idea_military_improvement_air_force: "Military Reform - Air Force"
 FRA_idea_military_improvement_air_force_desc: "The first of many reforms has started with the air force taking precedence. The Air Force has been chosen due to its ability to prevent anyone from taking our country from the air and providing effective support to naval and ground forces."
 FRA_idea_military_improvement_army_and_navy: "Military Reform - Army & Navy"
 FRA_idea_military_improvement_army_and_navy_desc: "Our next set of reforms focuses on the army and the navy. The army and navy together need to be better reformed for cross-branch coordination as well as effective defence of ships and the more effective use of naval assets in coordination with the land forces."
 FRA_idea_military_improvement_army_and_air_force: "Military Reform - Army & Air Force"
 FRA_idea_military_improvement_army_and_air_force_desc: "Combined arms training and improvements amongst the army and air force are among the most pivotal reforms we can pursue. The interworking of the two different branches can and will ensure our victory in the coming conflicts."
 FRA_idea_military_improvement_air_force_and_navy: "Military Reform - Air Force & Navy"
 FRA_idea_military_improvement_air_force_and_navy_desc: "The air force and navy are as inseparable as they are indispensable. The improvements oriented towards the two branches will allow us to protect our interests as well as the interests of our friends, allies and our civilian population here in Europe and across the globe."
 FRA_idea_the_french_military: "Reformed Military"
 FRA_idea_the_french_military_desc: "After years of letting the military fall into disarray, we have finally pushed ourselves to reform our ageing military. Now we may further press that France is both a country not to be trifled with and a country to befriend!"
 FRA_idea_space_agency_name: "CNES"
 FRA_idea_space_agency_name_desc: "The Centre national d'études spatiales (CNES) is the name of the French national space agency. It was founded in 1961 by then-President Charles de Gaulle, marking it the third oldest space agency in the world, behind NASA and the Soviet Union's space programme and its successor, Roscosmos."
 FRA_idea_reformed_cnes: "Reformed CNES"
 FRA_idea_reformed_cnes_desc: "The Centre national d'études spatiales (CNES) is the name of the French national space agency. It was founded in 1961 by then-President Charles de Gaulle, marking it the third oldest space agency in the world, behind NASA and the Soviet Union's space programme and its successor, Roscosmos. Recent budgetary shifts and other political changes have seen CNES reformed into the version we know today."
 FRA_idea_cnes_failing: "CNES Budget Shortcomings"
 FRA_idea_cnes_failing_desc: "CNES has had several budgetary shortcomings in the past year causing a large amount of disdain for the industry as the European Union is proposing their own space agency and otherwise."
 FRA_idea_prep_the_launch: "Preparing the Launch"
 FRA_idea_prep_the_launch_desc: "CNES is currently preparing to launch a space vehicle. It will take some time until it's ready to launch."
 FRA_idea_space_research: "Space Research"
 FRA_idea_space_research_desc: "Researching space is one of the most beneficial ways to gain a better comprehension of the world around us. Focusing on our research in Space can ensure that we are leaps and bounds ahead of our adversaries and competition."
 FRA_idea_nasa_partnership: "CNES-NASA Partnership"
 FRA_idea_nasa_partnership_desc: "A partnership between the space agency of America, NASA, and our own, CNES, is not only one of profit but of mutual interest. Expanding and discussing with our ally can help improve scientific research across the board and help expand the two agencies into new frontiers."
 FRA_idea_Light_for_Europe: "The Light of Europe"
 FRA_idea_Light_for_Europe_desc: "Surplus nuclear and renewable current flows out over the interconnectors. Neighbours pay for what the grid does not need."
 FRA_cfa_franc_custodian: "CFA Franc Custodian"
 FRA_cfa_franc_custodian_desc: "We created the CFA Franc to protect our colonies from the devaluation of the Franc post-WW2. Even though we no longer utilise the Franc, we are still the custodian of the West African countries' currency. They maintain half of their treasury reserves with us and as such we can capitalise on the assets it provides us.\n\n§YWe gain 0.5% of the Total GDP§! of the nations who have §YCFA Franc§! as §YAdditional Income§!. The current §YTotal GDP§! of §YCFA Franc Users§!: [?FRA.FRA_cfa_franc_gdp_total]b"
 the_eco: "The Eco"
 the_eco_desc: "The ECO was the proposed currency in West Africa amongst the nations of ECOWAS and the West African monetary zone. The French-speaking CFA Franc holders also sought to support the new currency. It unifies the region monetarily allowing for further and easier trade of goods and a unified medium for which the nations can rally behind."
 FRA_idea_the_french_pillar_of_counterterroism: "Pillar of Counterterrorism"
 FRA_idea_the_french_pillar_of_counterterroism_desc: "Terrorism is on the rise and it is up to us, the people of France to stem the tide and protect ourselves, Europe, and all those who are to be harmed. The future of France with the rise of extremism will be fought not just with our words but with the strength of our arms as we combat the rising threats to our nation."
 FRA_idea_the_french_foreign_legion: "The French Foreign Legion"
 FRA_idea_the_french_foreign_legion_desc: "The Foreign Legion of France is an elite corps of the French Army that consists of several specialties such as infantry, cavalry, engineers, or airborne troops. The Foreign Legion is a unique fighting force as it allows all foreign nationals to join and it is highly trained."
 FRA_idea_Grand_ambitions: "Grand Ambitions in Africa"
 FRA_idea_Grand_ambitions_desc: "Africa is ripe for the taking and we need to move forward and declare our new grand ambitions. It is of the utmost importance we continue to solidify our position in Africa to secure ourselves for the present but for the future of all the French people."
 FRA_idea_development_investment: "Development Investment"
 FRA_idea_development_investment_desc: "[FRA.GetNameWithFlag] is providing us with economic aid to help us develop our nation."
 AFRICA_idea_nepad_modifier: "NEPAD Development Programme"
 AFRICA_idea_nepad_modifier_desc: "The New Partnership for Africa's Development (NEPAD for short) is an economic development programme developed by the African Union with partners from the European Union, China, Japan and other G8 members. We are especially interested in the development of NEPAD and have made ourselves its main backer, monetarily and politically, within the European Union. We should look at helping extend the programme and increasing its funding and support to help all of Africa.\n\n[FRA.GetNameWithFlag] is the primary sponsor of this programme."
 AFRICA_idea_nepad_modifier_tt: "When influenced by §Y[FRA.GetNameWithFlag]§! $foreign_influence_defense_modifier$ is reduced by §Y10%§!\n"
 FRA_idea_nepad_modifier: "NEPAD Development Programme Sponsor"
 FRA_idea_nepad_modifier_desc: "The New Partnership for Africa's Development (NEPAD for short) is an economic development programme developed by the African Union with partners from the European Union, China, Japan and other G8 members. We are especially interested in the development of NEPAD and have made ourselves its main backer, monetarily and politically, within the European Union. We should look at helping extend the programme and increasing its funding and support to help all of Africa.\n\n[FRA.GetNameWithFlag] is the primary sponsor of this programme and as such we will gain additional benefits such as increased Foreign Influence in the nations who are currently benefiting from the programme.\n"
 FRA_idea_nepad_modifier_cost_tt: "Our sponsorship of the AU NEPAD Development costs $[?FRA.FRA_nepad_sponsor_weekly_cost|-3]b weekly."
 FRA_unrestricted_subjugation_idea: "Unrestricted Subjugation"
 FRA_unrestricted_subjugation_idea_desc: "The colonies we possessed have provided us with incredible wealth, and immense respect on the global stage. We must return to our older ways in some respects and begin to reassert ourselves against other nations and protect what should be rightfully ours. Subjugation can come in a variety of ways such as through military force, diplomatic strong arming and so much more. The roadblocks preventing us from doing such a thing must and should be removed."
 FRA_SYR_anti_assad_regime_message_idea: "Anti-Assad Regime Messaging"
 FRA_SYR_anti_assad_regime_message_idea_desc: "[FRA.GetNameWithFlag] has started to stream and provide propaganda against the Syrian Government. The messaging has started to undermine the government and is continuing to radicalise the youth against our ruling class. It is also showing that the government is susceptible to foreign influence."
 FRA_educational_development_idea: "Educational Development"
 FRA_educational_development_idea_desc: "[FRA.GetNameWithFlag] is assisting with educational programmes in our country. The educational development alleviates some cost while allowing us to modernise and improve upon our current educational demand."
 FRA_resource_prospects_idea: "Resource Prospecting"
 FRA_resource_prospects_idea_desc: "[FRA.GetNameWithFlag] is currently assisting in prospecting the resources in our country to potentially provide the economy more avenues for development."
 FRA_SYR_escalation_from_the_damascus_spring_idea: "Escalation from the Damascus Spring"
 FRA_SYR_escalation_from_the_damascus_spring_idea_desc: "[FRA.GetNameWithFlag] has continued to espouse propaganda about becoming democratic in our nation. The efforts continue to undermine our leader [SYR.GetLeader] as we are trying to stabilise the nation."

