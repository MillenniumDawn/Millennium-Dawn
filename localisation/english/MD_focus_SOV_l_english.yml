 ##########JIRINOVSKYI - RUSSIAN EMPIRE##########
 ##########Focuses##########
 SOV_zhirinovsky: "Zhirinovsky's LDPR"
 SOV_zhirinovsky_desc: "Vladimir Zhirinovsky takes the presidency with the largest personal following in Russian politics and the weakest party machine. The LDPR is a Moscow office, a television studio and a list of names that has to become a government."
 SOV_jirik_partiya: "Party of Loyalists"
 SOV_jirik_partiya_desc: "Every LDPR deputy signs a pledge, and every regional office reports to Moscow. The party becomes slower and more disciplined. Choosing it closes the Party of Business."
 SOV_jirik_partiya_chistki: "Purge the Faction"
 SOV_jirik_partiya_chistki_desc: "A block of deputies is asking where the party list came from and who rewrote it. Zhirinovsky wants the question settled in front of cameras, and his staff want it settled before the budget vote."
 SOV_jirik_partiya_total_control: "Total Party Discipline"
 SOV_jirik_partiya_total_control_desc: "Party control commissions audit every seat and every budget line. Corruption does not vanish, but it now has to be reported upward before it is practiced."
 SOV_jirik_partiya_and: "Party of Business"
 SOV_jirik_partiya_and_desc: "Regional bosses and company owners are invited to buy their way onto the list. The party gets money and local machines, and loses control of what its deputies do with either. Choosing it closes the Party of Loyalists."
 SOV_jirik_partiya_and_samodeal: "Everyone Gets a Cut"
 SOV_jirik_partiya_and_samodeal_desc: "The party fund becomes a formal clearing house between business and the Duma faction. Money flows in openly, and so does the blame when it goes missing."
 SOV_jirik_partiya_and_money: "The Party Fund"
 SOV_jirik_partiya_and_money_desc: "Regional LDPR bosses have learned that the party name is worth more than its program. Several governors are offering contributions in exchange for a free hand at home."
 SOV_jirik_partiya_and_autonomous: "Free Hand for the Governors"
 SOV_jirik_partiya_and_autonomous_desc: "Governors who deliver votes get to run their regions as they like. The federal bureaucracy shrinks and the tax base improves, and so does the number of cousins on regional payrolls."
 SOV_strengthen_union_state: "Union State Roadmap"
 SOV_strengthen_union_state_desc: "The 1999 treaty with Minsk exists on paper. Lukashenko will sign each stage, but he will name his price in gas first. We can pay it or lean on the oil duty."
 SOV_zapad_exercises: "Zapad Exercises"
 SOV_zapad_exercises_desc: "A joint air defense network and a staff that trains with ours every other year. Belarusian battalions learn to take our orders, and we get a western glacis near Smolensk."
 SOV_union_state_currency: "Currency and Civil Code"
 SOV_union_state_currency_desc: "A single currency, one civil code and a shared economic space. Belarus gives up the most here, so Minsk will ask for compensation before it signs."
 SOV_union_state_treaty: "The Union State Treaty"
 SOV_union_state_treaty_desc: "With the ministries in place, Moscow tables the full constitutional act. If Minsk signs, Belarus becomes a member state of the Union State."
 SOV_kharkiv_accords: "Gas for the Fleet"
 SOV_kharkiv_accords_desc: "The Sevastopol lease runs out in 2017. We offer Kyiv a cheaper gas contract if it extends the Black Sea Fleet's stay, as in Kharkiv in April 2010. Kyiv may refuse."
 SOV_ukraine_brotherhood: "Equal Partners"
 SOV_ukraine_brotherhood_desc: "We offer a language accord, joint action against Ukrainian oligarchs, and a quiet end to our claims on the south and east. Ukraine drifts toward us if it accepts."
 SOV_ukraine_gas_pressure: "Close the Valve"
 SOV_ukraine_gas_pressure_desc: "Gazprom demands market prices, as it did in January 2006 and 2009. Kyiv pays or goes cold, and Europe watches who is to blame."
 SOV_sevastopol_dockyard: "Sevastopol Dockyard"
 SOV_sevastopol_dockyard_desc: "Sevastopol Bay holds a fleet of Soviet vintage. A new dockyard and radar cover turn it into a base that can operate in the Mediterranean."
 SOV_ukraine_ultimatum: "The Crimea Ultimatum"
 SOV_ukraine_ultimatum_desc: "If Kyiv will not bend and has not joined NATO, we prepare a claim on Crimea and accept the sanctions that follow. This is a path to war."
 SOV_help_armenia: "Guarantee Armenia"
 SOV_help_armenia_desc: "Yerevan sits behind a closed border and the 102nd Base at Gyumri. We extend the guarantee and look the other way on Karabakh. Baku will remember."
 SOV_approach_iran: "Approach Iran"
 SOV_approach_iran_desc: "Tehran is a sanctions laboratory and a partner in Syria. We finish Bushehr, sell air defense and offer a joint arms factory."
 SOV_question_of_bavaria: "Bavarian Separatism"
 SOV_question_of_bavaria_desc: "We support Bavaria's desire to secede from Germany. Encouraging separatism will weaken Germany and serve our strategic interests in the region."
 SOV_question_of_east_german: "Recall the GDR"
 SOV_question_of_east_german_desc: "We will remind the people of East Germany of the proud history of the GDR. Reviving this legacy supports our broader political aims and regional influence."
 SOV_crush_europe: "Crush Europe"
 SOV_crush_europe_desc: "Europe offers only globalists, degenerates, and moral decay. We will crush this decadence and restore order. Our campaign targets the heart of European decline."
 SOV_claim_finland: "Claim Finland"
 SOV_claim_finland_desc: "The Grand Duchy of Finland was Russian from 1809 until 1917, and the LDPR map has never forgotten it. A claim is filed in Helsinki, and the Karelian border gets a new military district."
 SOV_expand_pacific_naval_presence: "The Pacific Fleet"
 SOV_expand_pacific_naval_presence_desc: "Vladivostok and Petropavlovsk-Kamchatsky get new yards, new frigates and a refit schedule. Japan watches our patrols near the Kurils."
 SOV_side_with_the_people: "Side with the People"
 SOV_side_with_the_people_desc: "For centuries, the elites and criminal mafias have oppressed the common people. It is time to correct this injustice and stand firmly on the side of the people."
 SOV_return_kgb: "Return of the KGB"
 SOV_return_kgb_desc: "The FSB is split into a foreign and a domestic service under the old name. Veterans are called back, files are reopened, and the first targets are the new rich and the old dissidents."
 SOV_nationalize: "Take Back the Nineties"
 SOV_nationalize_desc: "Zhirinovsky has called the privatizations a theft for years. The state seizes the largest fortunes on charges the courts do not fight, and the Kremlin keeps what it takes."
 SOV_jirik_cult: "The Cult of the Leader"
 SOV_jirik_cult_desc: "Portraits, a collected works in twenty volumes, a birthday that is a public holiday. The party and the state stop being separate organizations, and the leader's word starts to count as policy."
 SOV_remain_president: "Remain President"
 SOV_remain_president_desc: "We already wield near-absolute power; there is no need to pursue further changes."
 SOV_coopt_hyper_nationalists: "Co-opt the Ultranationalists"
 SOV_coopt_hyper_nationalists_desc: "The radical wing of the party, the men who march behind banners on Tverskaya, now want posts instead of slogans. Zhirinovsky promised them one thing, and they are asking for three."
 SOV_rva: "Form a Russian Volunteer Army"
 SOV_rva_desc: "With the growing number of nationalist groups, we will unite paramilitary units into a Russian Volunteer Army, ready to deploy in times of war."
 SOV_reconcile_the_cprf: "Reconcile the CPRF"
 SOV_reconcile_the_cprf_desc: "We share many goals with the Communist Party. Perhaps we can bring them into our fold and mend past divisions."
 SOV_national_bolshevik_thought: "National Bolshevik Thought"
 SOV_national_bolshevik_thought_desc: "National Bolshevik ideology combines nationalism with Bolshevik principles to pursue a Greater Russia."
 SOV_national_bolshevik_cooperation: "National Bolshevik Cooperation"
 SOV_national_bolshevik_cooperation_desc: "We have secured cooperation with the National Bolsheviks to monopolize nationalist support and strengthen our movement."
 ##########Ideas##########
 SOV_IRQ_base: "[SOV.GetFlag]Russian Military Base"
 SOV_IRQ_base_desc: "The Russian military Base, which is located near our capital, serves as a reminder to us that Russia will not abandon us in the event of a global war. But if the regime in our country or in Russia changes dramatically, the military base will be immediately closed."
 SOV_LBA_base: "[SOV.GetFlag]Russian Military Base"
 SOV_LBA_base_desc: "The Russian military Base, which is located near our capital, serves as a reminder to us that Russia will not abandon us in the event of a global war. But if the regime in our country or in Russia changes dramatically, the military base will be immediately closed."
 S0V_russian_sphere_idea: "Moscow Pact"
 S0V_russian_sphere_idea_desc: "Alliance created by Russia to replace the unnecessary and unjustified CSTO. Now Russia is ready to gather allies around itself and fight back against its enemies."
 SOV_military_exercises_anti_turkey1_idea: "Kavkaz Exercises"
 SOV_idea_governorate: "Integration Into Russia"
 SOV_idea_governorate_desc: "This entity is undergoing the process of integration into Russia. Soon it will be completely absorbed."
