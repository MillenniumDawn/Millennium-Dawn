 ishrael.52.t: "남레바논 전투원법"
 ishrael.53.t: "레바논 송환 및 자금 지원법을 통과시킨 이스라엘"
 ishrael.54.t: "정부에 철수 선언을 제출하는 헤르조그"
 ishrael.55.t: "안사르 교도소의 처리 문제"
 ishrael.56.t: "안전 지대를 떠나는 마지막 병사들"
 ishrael.57.t: "이른바 안전 지대를 포기하는 시온주의자들"
 ishrael.58.t: "아르메니아 인정 및 추모법을 논의하는 크네세트"
 ishrael.59.t: "집단학살 인정을 둘러싸고 이스라엘 의원들을 무시하는 에후드 바라크"
 ishrael.6.t: "아르메니아 집단학살을 인정한 이스라엘 크네세트"
 ishrael.61.t: "1915년의 사건을 집단학살로 인정한 이스라엘 의원들"
 ishrael.62.t: "캠프 데이비드에서의 3자 회담을 제안하는 바라크"
 ishrael.63.t: "21 특별 총리 선거"
 ishrael.63.d: "에후드 바라크가 협상 상대가 없다고 선언하며 캠프 데이비드에서 돌아오자, 출범한 지 겨우 1년 된 바라크의 연정은 붕괴되었습니다. 초정통파 샤스당은 교육 제도에 관한 약속 때문에 참여했으나, 요시 사리드 교육부 장관과 샤스당 출신 나하리 차관 사이의 분쟁으로 인해, 총리가 캠프 데이비드 도착을 준비하는 사이 연정을 떠났습니다. 한편 사리드가 이끄는 메레츠는 평화 협상이 계속되는 동안에만 연정에 머무르기로 동의했는데, 바라크의 캠프 데이비드 실패로 인해 이들도 연정을 떠났습니다. 바라크는 \\"새로운 날의 여명\\"을 약속했으나 주로 인티파다의 공포를 이스라엘 심장부에 가져다주었고, 부활한 리쿠드가 그를 몰아내겠다고 위협하는 가운데, 총리직에 대한 신임을 묻는 특별 선거를 소집하는 것 외에는 다른 선택지가 없었습니다."
 ishrael.63.a: "바라크가 임기를 마칠 수 있도록 신임하자."
 ishrael.63.b: "리쿠드에게 상황 안정화를 맡기자."
 ishrael.63.c: "벤야민 네타냐후를 총리로 재선출하자."
 ishrael.7.t: "에후드 바라크의 연립 정부를 떠나는 샤스"
 ishrael.71.t: "예비 선거를 앞둔 네타냐후의 논쟁"
 ishrael.71.a: "네타냐후가 출마하여 손쉽게 후보로 지명된다."
 ishrael.71.b: "네타냐후가 지명을 거부하여 샤론이 승리한다."
 ishrael.15.t: "샤론의 성전산 방문에 대한 아랍의 반응"
 ishrael.15.d: "샤론이 성전산을 방문한 이후 여러 아랍 국가가 격분하고 있습니다. 특히 튀니지, 오만, 바레인, 카타르, 모로코는 외교 관계를 완화하겠다고 공언했으며, 이는 의심할 여지 없이 우리를 지역 무대에서 더욱 고립시킬 것입니다."
 ishrael.15.a: "망할!"
 ishrael.151.t: "샤론의 성전산 방문"
 ishrael.151.d: "이스라엘 정치인 아리엘 샤론이 예루살렘의 성지인 성전산을 방문했습니다. 여러 중동 국가의 외교관들은 이 결정을 규탄했으며 외교적 보복을 공언하는 한편 우리에게도 같은 조치를 취하도록 권유했습니다."
 ishrael.151.a: "다른 선택지가 없는 것 같다."
 ishrael.152.t: "샤론의 성전산 방문"
 ishrael.152.d: "이스라엘 정치인 아리엘 샤론이 예루살렘의 성지인 성전산을 방문했습니다. 여러 중동 국가의 외교관들은 이 결정을 규탄했으며 외교적 보복을 공언하는 한편 우리에게도 같은 조치를 취하도록 권유했습니다. 관계를 완전히 단절할 수도 있고, 어느 정도의 관계를 유지할 수도 있습니다."
 ishrael.152.a: "무역 협정은 유지한다."
 ishrael.152.b: "괘씸하다!"
 ishrael.155.t: "알아크사 모스크에 대한 현상 유지를 파기한 이스라엘"
 ishrael.156.t: "성전산 위에서 기도하는 유대인 정착민들"
 ishrael.157.t: "알아크사 모스크에 대한 우리의 권리를 무효화한 이스라엘"
 ishrael.158.t: "요르단 와크프를 알아크사에서 추방한 이스라엘"
 ishrael.159.t: "우리의 주권에 의문을 제기하는 이타마르 벤그비르!"
 ishrael.16.t: "약속의 땅에 대한 권리를 재천명하는 이스라엘 지도자들"
 ishrael.161.t: "아브라함에 대한 하나님의 약속을 기억하며"
 ishrael.162.t: "카플란 재판"
 israel_economy.62.t: "첩보 활동 접근을 요청하는 이스라엘"
 israel_economy.62.d: "이스라엘 관리들이 최근 우리와 이스라엘 간의 비밀 협력 문제로 접촉해 왔습니다. 이들은 이란에 잠입하는 모사드 요원들에게 안전한 은신처를 제공하는 위태로운 거래를 제안합니다. 수락해야 할까요?"
 israel_economy.62.a: "그렇다"
 israel_economy.62.b: "아니요"
 israel_economy.63.t: "우리 제안을 수락한 그들!"
 israel_economy.63.d: "이제 모사드는 그들의 영토를 이란 침투의 거점으로 사용할 것입니다."
 israel_economy.63.a: "훌륭해!"
 israel_economy.64.t: "우리 제안을 거절한 그들!"
 israel_economy.64.d: "그들은 그러한 음모와 어떤 관계도 맺고 싶어 하지 않습니다."
 israel_economy.64.a: "유감이군."
 israel.1.t: "인도로 여행하는 복무를 마친 이스라엘 군인들"
 israel.1.d: "이스라엘과 인도가 복무를 마친 이스라엘 군인들이 인도를 여행할 수 있도록 하는 중요한 협정을 체결했으며, 이는 문화 교류와 양자 관계를 증진하는 것을 목표로 합니다. 이 협정은 복무를 마친 이스라엘 국방 인력이 여가와 교육 목적으로 인도를 방문할 수 있도록 하며, 방위 협력을 넘어 관광과 더 깊은 유대를 증진하려는 양국의 의지를 강조합니다. 이 조치는 외교 및 경제 관계 강화의 이정표이며, 다양한 분야에서 상호 이해와 협력에 대한 양국의 헌신을 보여 줍니다."
 israel.1.a: "훌륭해!"
 ISR_strategy: "영원히 칼을 삼키다"
 ISR_strategy_desc: "사울 왕이 젊은 다윗을 엔게디의 동굴까지 추격했을 때, 사울의 군대 장관 아브넬은 스루야의 아들 요압에게 와서 '칼이 영원히 삼키겠느냐?'라고 물었습니다. 시간은 그렇다는 것을 증명했습니다. 요압이 다윗 왕을 위해 정복한 도시 예루살렘은 이제 독수리들에게 둘러싸인 국가의 심장입니다. 그러므로 우리는 영원히 칼을 뽑아 들고 서서, 위협의 기미가 보이는 즉시 선제공격할 것입니다."
 ACCEPTED_GOLAN: "이 선택지를 택하고 양측이 평화에 합의할 경우: 골란 고원 주는 추가로 14000명의 인구를 얻고, 갈릴리 주는 14000명의 인구를 잃습니다. 시리아에 대한 이스라엘의 중핵은 사라지고, 시리아가 골란 주를 얻습니다. 골란의 승점은 승점 5의 쿠네이트라로 불립니다. 주 이름은 자울란으로 바뀝니다.\n"
 REJECTED_GOLAN: "이 선택지를 택하고 양측이 평화에 합의할 경우 시리아에 대한 이스라엘의 중핵은 사라지고, 시리아가 골란 주를 얻습니다. 골란의 승점은 승점 5의 쿠네이트라로 불립니다. 주 이름은 자울란으로 바뀝니다."
 ACCEPTED_GALILEE: "이 선택지를 택하고 양측이 평화에 합의할 경우: 골란의 인프라가 향상됩니다.\n"
 NEUTRAL_GALILEE: "이 선택지를 택하면 아풀라 북쪽 지역이 승점 2를 추가로 얻습니다.\n"
 REJECTED_GALILEE: "이 선택지를 택하고 양측이 평화에 합의할 경우: 갈릴리의 인프라가 향상됩니다.\n"
 ACCEPTED_HERMON: "이 선택지를 택하고 양측이 평화에 합의할 경우: \\"자발 알셰이크\\"라는 이름의 승점 5짜리 승점 지역이 생깁니다.\n"
 REJECTED_HERMON: " 이 선택지를 택하고 양측이 평화에 합의할 경우: 이스라엘이 시리아에 대한 군사 통행권을 얻으며, 양국이 전쟁에 돌입하지 않는 한 시리아는 이를 철회할 수 없습니다.\n"
 ACCEPTED_GOLANS: "이 선택지를 택하고 양측이 평화에 합의할 경우: 골란은 시리아에 넘겨지면서 비무장화됩니다.\n"
 NEUTRAL_TIES_GOLAN: "이 선택지를 택하고 양측이 평화에 합의할 경우: 효과 없음\n"
 ACCEPTED_SYRIA: "이 선택지를 택하면 헤즈볼라에 대한 시리아의 영향력이 크게 줄어들고, 시리아에 대한 이란과 헤즈볼라의 모든 영향력이 제거되며, 시리아-헤즈볼라 및 시리아-이란 관계에 약화 효과가 생기고, 시리아에 대한 미국의 관계가 개선됩니다.\n"
 REJECTED_SYRIA: "이 선택지를 택하고 양측이 평화에 합의할 경우: 효과 없음\n"
 ACCEPTED_ELI_COHAN: "이 선택지를 택하고 양측이 평화에 합의할 경우: 이스라엘은 시리아에 대해 \\"엘리 코헨 반환 거부\\" 관계를 갖게 됩니다.\n"
 REJECTED_ELI_COHAN: "이 선택지를 택하고 양측이 평화에 합의할 경우: 이스라엘은 정치력을 얻고, 시리아에 대해 \\"엘리 코헨 반환\\" 관계 보너스를 얻습니다.\n"
 REJECTED_GOLANS: "이 선택지를 택하고 양측이 평화에 합의할 경우: 갈릴리가 비무장화됩니다.\n"
 US_HEIGHTS: "[USA.GetLeader] 고원"
 israel_news.1.t: "시리아 내 핵 의혹 표적 공습"
 israel_news.1.d: "오늘 늦은 밤, 시리아 북동부 데이르에조르 남동쪽 유프라테스 강 바로 옆에 있는 '부스탄'으로 알려진 군사 시설 위로 17톤이 넘는 폭탄이 터졌습니다. 공습의 잠재적 가해자를 가리키는 여러 가설이 제기되었지만, 서방 분석가들은 이스라엘을 가장 유력한 행위자로 지목하고 있습니다. 해당 시설이 북한의 지원으로 건설된 시리아의 비밀 핵 프로그램에 속한 원자로라는 정보 보고가 있기 때문입니다. 이 보고가 사실인지, 그리고 미국 행정부가 공습에 대해 어느 정도 통보받았는지는 불분명하지만, [SYR.GetLeader]이(가) 핵 프로그램을 가리키는 모든 증거를 신속히 제거하고 있는 가운데 한 가지는 분명합니다. 이라크의 첫 핵 프로그램을 파괴한 지 26년이 지난 지금도 이스라엘 정책 입안자들은 베긴 독트린을 유지하고 있다는 것입니다."
 israel_news.1.o1: "임무를 훌륭히 완수했다!"
 israel_news.1.o2: "시온주의자들은 마음껏 이야기를 지어낼 수 있겠지."
 israel_news.1.o3: "이스라엘의 국가 안보가 수호되었다."
 israel_news.1.o4: "전쟁에서 벗어나려는 또 다른 자기 구원의 시도."
 israel_news.1.o5: "시온주의 제국주의가 또다시 일격을 가한다."
 israel_news.1.o6: "이란에 보내는 메시지."
 israel_news.1.o7: "제국주의자들이 지어낸 추악한 이야기다!"
 israel_news.2.t: "가자 장악!"
 israel_news.2.d: "가자 지구에서 쿠데타가 일어나 많은 이들이 이슬람주의 극단 조직으로 규정하는 하마스가 이 도시의 권력을 잡았습니다. 지역 내 모든 이가 같은 입장을 취하는 것은 아니지만, 이스라엘과 팔레스타인 정부는 물론 국제 사회 전체가 이 상황과 지역의 미래를 우려하고 있습니다.\n새로운 전쟁이 다가오고 있는 것일까요?"
 israel_news.2.o1: "전례 없는 순간."
 israel_news.3.t: "제다 조약"
 israel_news.3.d: "아랍에미리트, 바레인과 아브라함 협정이 체결되고 [ISR.GetLeader]이(가) 사우디 왕위 계승자를 만나기 위해 제다를 비밀리에 방문한 이후, 많은 이들은 리야드가 아부다비의 전철을 밟아 이스라엘과의 은밀한 관계를 공개할지 궁금해했습니다. 오늘 마침내 그 일이 일어났습니다. [SAU.GetLeader]이(가) 미국의 군사 보장과 팔레스타인 문제에 대한 이스라엘의 양보를 조건으로 조약을 승인한 후, [USA.GetLeader]은(는) 사우디 외무장관과 이스라엘 총리를 초청하여 공식 평화 조약에 서명하도록 했습니다. 이는 중동 전역의 공통된 위협과 이스라엘의 첨단 기술 투자를 활용해 경제를 다각화하려는 사우디의 열망에 힘입어 추가 협력의 문을 엽니다."
 israel_news.3.o1: "큰 상을 거머쥐었다!"
 israel_news.3.o2: "우리는 선조들의 발자취를 따른다."
 israel_news.3.o3: "우리는 모두 아브라함의 자손이다."
 israel_news.3.o4: "우리의 가장 큰 지역 파트너들이 하나가 되었다."
 israel_news.3.o5: "하! 무슬림 세계를 이끈다더니 꼴좋군..."
 israel_news.3.o6: "이는 중동을 뿌리째 뒤흔들 것이다."
 israel_news.4.t: "이란 핵 표적에 대한 공습을 명령하는 [ISR.GetLeader]"
 israel_news.4.d: "사이렌 소리, 폭발, 잿더미, 추락하는 비행기 - 이것이 오늘 밤 늦게 이란 전역의 여러 지역에서 수백만 이란인이 보고 들은 광경이었습니다. 이스라엘은 군사적 지원을 받았거나 혹은 단지 워싱턴의 인지 하에, 수십 대의 이스라엘 공군기로 이슬람 공화국의 핵 표적을 공격했습니다. 이는 누구도 놀라게 해서는 안 될 일입니다. 수십 년 동안 예루살렘은 이란이 핵무기를 보유하는 것을 막기 위해 군사 행동을 하겠다고 위협해 왔으며, 이는 베긴 독트린과 시리아 및 이라크에 대한 유사한 행동에 부합합니다. 그러나 이 공격이 반응 없이 지나가지는 않을 것입니다. 이미 수십만 명의 이스라엘 민간인이 대피소로 들어갔으며, 이스라엘 도시들에 필연적으로 쏟아질 수천 발의 직접 미사일에 대비하여 방공 체계가 고도 경계 태세에 돌입했습니다."
 israel_news.4.o1: "다른 선택지가 없었다."
 israel_news.4.o2: "물라들에게 가한 파괴적인 일격."
 israel_news.4.o3: "적의 적은 나의 친구다."
 israel_news.4.o4: "시온주의자들을 대피소로 도망치게 하라!"
 israel_news.4.o5: "이스라엘과 이란, 전쟁 일촉즉발."
 israel_news.5.t: "제네바 협정"
 israel_news.5.d: "이스라엘과 시리아의 전차가 골란 고원에서 마지막으로 충돌한 지 수십 년이 지났고, 이스라엘과 시리아 외교관들이 처음으로 평화를 논의하기 위해 만난 마드리드 회담이 열린 지도 오래되었으며, 오늘 역사가 만들어지고 있습니다. 튀르키예와 미국 외교관들은 다마스쿠스와 예루살렘 대표단 사이에 포괄적 협정의 최종안이 합의되었다고 발표했으며, 스위스 정부 관리들은 [ISR.GetLeader]과(와) [SYR.GetLeader]이(가) 참석하는 서명식을 준비하고 있습니다. 이 조약에는 주로 시리아가 이스라엘의 파괴를 목표로 하는 외부 세력과의 특수 관계를 포기하는 대가로, 이스라엘이 6일 전쟁 중 점령한 땅에서 대부분 철수하고, 완전한 관계 정상화와 대사 교환을 한다는 조항이 포함되어 있습니다."
 israel_news.5.o1: "마침내 평화 조약이 체결되었다!"
 israel_news.5.o2: "우리의 노력이 결실을 맺었다."
 israel_news.5.o3: "알자울란이 마침내 돌아왔다."
 israel_news.5.o4: "배신자, 배신자, 배신자!"
 israel_news.5.o5: "역사적인 순간."
 israel_news.6.t: "동지중해 동맹"
 israel_news.6.d: "새로 발견된 동지중해 연안 가스전의 지배권을 둘러싼 경쟁은 지역 전역에 새로운 동맹망을 형성시켰고, 그 정점이 최근 라르나카에서 [ISR.GetLeader], [CYP.GetLeader], [GRE.GetLeader] 사이에 체결된 조약이었습니다. 팔레스타인 문제와 관련하여 오랫동안 이스라엘에 가장 적대적인 국가 중 하나로 여겨져 온 그리스는, 해상에서의 튀르키예의 요구에 맞서 공동 전선을 형성하고 이스라엘산 및 어쩌면 이집트산 가스를 유럽 연합으로 수출하기 위해 예루살렘과 보조를 맞췄습니다. 튀르키예는 격노하며 반응했고, [TUR.GetLeader]은(는) 이것이 튀르키예가 '푸른 조국'을 달성하는 것을 막지 못할 것이라고 선언하는 한편 앙카라 주재 이스라엘 대사의 추방을 명령했다고 밝혔습니다. 프랑스가 이끄는 유럽 연합은 이러한 진전을 환영했습니다."
 israel_news.6.o1: "우리는 하나로 뭉쳐 있다."
 israel_news.6.o2: "튀르키예에 맞선 공동 전선."
 israel_news.6.o3: "청소부와 배신자들의 동맹이다!"
 israel_news.6.o4: "우리의 문은 열려 있다."
 israel_news.6.o5: "경쟁이 격화된다."
 israel_news.7.t: "키루스 협정"
 israel_news.7.d: "오늘 예루살렘에서 몇 년 전만 해도 상상할 수 없었을 진정으로 역사적인 장면들이 포착되었습니다. 이란 임시 정부의 외교관들이 테헤란에서 벤구리온 국제공항으로 향하는 직항편으로 도착하여 야드 바솀을 방문한 뒤 크네세트에 이르렀고, 그곳에서 조약이 체결되었습니다. 이 조약은 1979년 이슬람 혁명 이래 이스라엘과 이란 사이에 존재해 온 전쟁 상태를 종식하고, 상대국에 대항하는 저항 단체에 대한 지원을 중단하며, 서로의 나라에 대사관을 설치한다는 약속을 포함합니다. 물라들의 전복으로 막을 내린 이란의 제2차 혁명 이후, 이는 모하마드 레자 샤 시절의 강력한 이란-이스라엘 전략적 동맹을 재건하고, 유대인들을 바빌로니아의 포로 생활에서 해방시킨 키루스의 정신을 잇는 중대한 이정표로 보입니다."
 israel_news.7.o1: "우리는 올리브 가지를 들고 그들에게 다가간다."
 israel_news.7.o2: "외교적 승리다!"
 israel_news.7.o3: "쿠로시의 정신으로."
 israel_news.7.o4: "중동 평화를 향한 한 걸음 더."
 israel_news.8.t: "중동 조약 기구"
 israel_news.8.d: "오늘 이스라엘에서 충격적인 소식이 전해졌습니다. 최근 많은 아랍 국가들이 하르툼 회의에서 아랍 연맹이 시작한 이스라엘 보이콧을 버리고, 포용까지는 아니더라도 최소한 이스라엘을 받아들이고 있습니다. 이는 최소한 경제적 기회, 지역 세력 공백에 대한 우려, 그리고 공동의 세계적 적에 대한 우려 때문입니다. 오늘 이 관계는 양자 관계에서 공식 동맹으로 발전하여, 텔아비브에서 [ISR.GetLeader]과(와) 여러 아랍 장관 및 정치인들 사이에 서명되었습니다. 이 동맹의 목표는 분명합니다. 이 지역에서 미국의 영향력 투사가 줄어드는 시대에, 공통의 경쟁자들에 균형을 맞추고 수십 년간 이 지역이 겪어 온 유혈 사태를 끝내기 위해 중동의 전략적, 정치적 구조를 만드는 것입니다. 실제로 이는 극동에서 베이징의 영향력에 대항하기 위한 미국의 아시아 중시 정책을 수월하게 하는 미국의 승리로 볼 수 있습니다."
 israel_news.8.o1: "마침내 이 지역에서 진정으로 받아들여졌다."
 israel_news.8.o2: "얼마나 다행인가!"
 israel_news.8.o3: "총성이 마침내 멈추기를."
 israel_news.8.o4: "그들은 시온주의자들보다도 못한 자들임을 스스로 증명했다!"
 israel_news.8.o5: "충격적인 전개다."
 israel_news.9.t: "네게브 포럼"
 israel_news.9.d: "이스라엘 건국의 아버지 벤구리온의 무덤에서 멀지 않은 미츠페 라몬의 호화로운 '베레시트' 호텔에 여러 아랍 외무장관이 미국 국무장관 및 이스라엘 외무장관과 함께 모여, 기후 변화, 대테러, 농업, 기반시설, 첨단 기술, 염분화 대응 노력 등 다양한 분야의 노력을 통합하기 위한 정치 협의체인 '네게브 포럼'을 발족했습니다. 외무장관들은 포럼의 회의를 매년 열고, 매번 다른 사막 지대에서 개최하기로 합의했습니다. 많은 관측통들은 이를 아브라함 협정의 다음 단계로 지목했는데, 단순한 관계 정상화를 넘어 이스라엘과 주변의 많은 온건 수니파 아랍 국가들 간의 본격적인 동맹으로 나아가는 것이기 때문입니다. 이것이 완전한 군사 동맹으로 굳어질지는 불분명하지만, 중동에서 자국의 미래를 확보하려는 이스라엘의 노력에 있어 역사적인 걸음입니다."
 israel_news.9.o1: "사막을 꽃피우다."
 israel_news.9.o2: "역사적인 걸음."
 israel_news.9.o3: "우리 조상들의 발자취를 따라."
 israel_news.9.o4: "배신자들!"
 israel_news.9.o5: "흥미로운 전개로군."
 israel_news.10.t: "시리아를 둘러싼 제한전을 개시한 이스라엘"
 israel_news.10.d: "시리아 내전의 격화는 다마스쿠스 정부가 여전히 장악한 많은 지역에서 권력 공백을 초래했고, 테헤란이 이 공백을 메우기 위해 나섰습니다. 이란은 시리아 정권을 지원하는 한편, 이 기회를 이용하여 이슬람 혁명 수비대가 이끄는 헤즈볼라 전투원과 다른 시아파 민병대를 시리아에 영구적으로 주둔시켰고, 이를 이란의 영향력과 혁명을 확대하고 이스라엘에 맞서는 '명령의 날'을 위한 기지로 삼으려 했습니다. 그러나 외국 소식통에 따르면 이스라엘 정책 입안자들은 유럽 및 미국 상대에게 예루살렘이 가만히 있으면서 시리아가 '제2의 레바논'이 되도록 내버려 둘 수 없다고 통보했으며, 따라서 '모든 선택지를 테이블 위에 올려놓고' 준비하고 있습니다. 외국 소식통들은 내전에 노골적으로 개입한 것으로 비치지 않도록 정권 표적은 피하면서, 전국의 이란 민병대 표적에 대한 잠재적 공중 작전을 시사합니다."
 israel_news.10.o1: "시리아 분쟁이 격화된다."
 israel_news.10.o2: "그들은 지나갈 수 없다!"
 israel_news.10.o3: "시온주의자들의 음모가 펼쳐진다!"
 israel_news.10.o4: "시리아 주권을 이렇게 침해하다니."
 israel_news.10.o5: "우리는 골란 전선을 열 것이다!"
 israel_news.10.o6: "관심을 갖고 지켜보겠다."
 ISR_begin_mabam: "ISRAELMYMAN"
 ISR_arab_diplo_tooltip: "아랍 보이콧: 이 나라의 외교 상태로 인해 이 행동을 완료할 수 있습니다"
 ISR_bruh: "BRUH"
 alice_miller_v_ministry_of_defence: "시행되지 않은 앨리스 밀러 판결"
 alice_miller_v_ministry_of_defence_desc: "1994년 4월, 공군 장교 앨리스 밀러 중위는 이스라엘 공군이 여성의 비행 학교 지원과 조종사 양성을 허용하지 않는 부당함을 비판하며 국방부를 상대로 고등법원에 소송을 제기했습니다. 대법원은 1995년 12월 그녀의 손을 들어 주었으나, 여성의 비행 학교 졸업은 여전히 제한적이고 비전문적으로 다루어지고 있습니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_miller_case$§!, §Y$ISR_matkal_women$§! 또는 §Y$ISR_ban_women_from_military$§! 중점을 완료하면 §R제거§!됩니다."
 daneils_final_prophecy_1: "다니엘의 마지막 환상"
 daneils_final_prophecy_1_desc: "하나님께서 마지막으로 다니엘에게 허락하신 환상에서, 다니엘은 북방의 왕과 남방의 왕 사이의 최후의 전쟁에 대해 들었습니다. 이 전쟁은 종말의 때가 인류에게 풀려나기 전에, 누가 하나님의 종이고 누가 사탄과 손을 잡았는지를 분별하는 유대 민족의 능력을 시험하는 전쟁입니다. 오늘날 우리는 중국이라는 거인과 협력할 기회가 커지는 것과 워싱턴에 있는 최대 동맹국들의 의심 사이에 끼어 있습니다. 누구를 신뢰할지는 우리의 선택입니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_balance_favor_america$§! 또는 §Y$ISR_balance_favor_china$§! 갈래에서 중점을 완료할 때마다 §G개선§!되며, 해당 갈래가 완료되면 §R제거§!됩니다."
 daneils_final_prophecy_2: "다니엘의 마지막 환상"
