 REQUEST_MIL_GNSS_ACCESS_TITLE: "군용 위성항법시스템 접근"
 REQUEST_MIL_GNSS_ACCESS_ACTION_DESC: "그들의 암호화된 군용 위치 파악 네트워크에 대한 업링크 자격 증명을 요청합니다. 접근 권한은 양자 조약 협상, 상호 정보 공유 약속, 작전 필요성에 따른 차등적 권한 부여 수준을 수반합니다. 수락되면 그들의 §Y군용 위성항법시스템 위성 네트워크§!에 접근할 수 있게 됩니다."
