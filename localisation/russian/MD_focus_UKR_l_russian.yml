 UKR_equipment_develop_domestic_modernize_stuhna_p_atgm: "Модернизировать ПТРК §YРК-2 «Стугна-П»§!"
 UKR_equipment_develop_domestic_modernize_stuhna_p_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_modernize_stuhna_p_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем дополнительно модернизировать комплекс §YРК-2 «Стугна-П»§!, чтобы он лучше соответствовал современным угрозам.\nКомплекс получит заметные эргономические и технологические улучшения пульта дистанционного управления: регулировку яркости экрана, встроенную диагностику состояния системы и прямой вывод изображения с тепловизора.\nКроме того, модернизация добавит встроенную GPS-навигацию с картой в реальном времени, показывающую радиус поражения пусковой установки, её ориентацию и цифровую линейку для измерения расстояний прямо в интерфейсе оператора.\n------------------\nЭто решение — §Rобязательное условие§! для открытия следующего §Y1§! решения этой категории техники. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить последующее.§!"
 UKR_equipment_develop_domestic_modernize_stuhna_p_atgm_flag: "Выполнено решение §YМодернизировать ПТРК РК-2 «Стугна-П»§!"
 ukraine_equipment_develop_domestic_atgm.5.name: "ПТРК РК-2М «Стугна-ПМ»: разработка завершена"
 ukraine_equipment_develop_domestic_atgm.5.desc: "Замечательные специалисты КБ «Луч» завершили разработку ПТРК РК-2М «Стугна-ПМ», и теперь мы можем выбрать следующий шаг по принятию этой новой системы на вооружение [ROOT.GetFlag] Вооружённых сил страны [ROOT.GetName]."
 ukraine_equipment_develop_domestic_atgm.5.a: "Получить сам проект"
 ukraine_equipment_develop_domestic_atgm.5.b: "Запустить полномасштабную модернизацию"
 UKR_equipment_develop_domestic_bulava_atgm_with_tech: "Разработать ПТРК нового поколения §Y«Булава»§!"
 UKR_equipment_develop_domestic_bulava_atgm_with_tech_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_bulava_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Булава»§! — перспективный противотанковый комплекс по принципу «выстрелил и забыл».\nОн получит эту долгожданную возможность и, по слухам, будет мобильнее и смертоноснее.\nА теперь абсолютно не связанные новости: для всех наших военных большая честь наконец получить и испытать божественный американский ПТРК §Y«Javelin»§!!\n------------------\nТребования этого решения §Gснижены§!, потому что у страны §Y[ROOT.GetFlag][ROOT.GetName]§! исследована технология §Y$Anti_tank_3$§!.\n\nЭто решение — §Rобязательное условие§! для модернизации §YОбъект 477А1 «Нота»§!. Если §Rпропустить§! оба решения §Y«Булава»§!, вы §Rпотеряете§! возможность её выполнить.§!"
 UKR_equipment_develop_domestic_bulava_atgm_without_tech: "Разработать ПТРК нового поколения §Y«Булава»§!"
 UKR_equipment_develop_domestic_bulava_atgm_without_tech_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_bulava_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Булава»§! — перспективный противотанковый комплекс по принципу «выстрелил и забыл».\nОн получит эту долгожданную возможность и, по слухам, будет мобильнее и смертоноснее.\nА теперь абсолютно не связанные новости: для всех наших военных большая честь наконец получить и испытать божественный американский ПТРК §Y«Javelin»§!!\n------------------\nТребования этого решения можно значительно §Gснизить§!, если у страны §Y[ROOT.GetFlag][ROOT.GetName]§! будет исследована технология §Y$Anti_tank_3$§!.\n\nЭто решение — §Rобязательное условие§! для модернизации §YОбъект 477А1 «Нота»§!. Если §Rпропустить§! оба решения §Y«Булава»§!, вы §Rпотеряете§! возможность её выполнить.§!"
 UKR_equipment_develop_domestic_bulava_atgm_flag: "Выполнено решение §YРазработать ПТРК нового поколения «Булава»§!"
 UKR_equipment_develop_domestic_sokil_300: "Разработать ударный беспилотник §Y«Сокол-300»§!"
 UKR_equipment_develop_domestic_sokil_300_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_sokil_300_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Сокол-300»§! — §Y[ROOT.GetFlag]украинский§! ударный беспилотник средних высот с большой продолжительностью полёта, разработанный §LКБ «Луч»§!.\nОн несёт те же противотанковые управляемые ракеты §Y«Барьер-В»§!, что и наши ударные вертолёты, а его разведывательное оборудование позволяет находить и поражать цели далеко за линией фронта.\n------------------\nДля этого решения нужно выполненное решение по ПТУР §Y«Барьер»§!.§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm: "Разработать танковые ПТУР §Y«Комбат»§! и §Y«Конус»§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_kombat_konus_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Комбат»§! — §Y[ROOT.GetFlag]украинская§! 125-мм противотанковая управляемая ракета, разработанная §LКБ «Луч»§! для пуска через ствол основного орудия танков §YТ-64§!, §YТ-72§!, §YТ-80§! и §YТ-84§!. §Y«Конус»§! — её аналог для 120-мм орудий.\nОбе ракеты второго поколения с наведением по лазерному лучу позволяют нашим танкам поражать бронированные цели далеко за пределами дальности стрельбы снарядами.\n------------------\nЭто решение — §Rобязательное условие§! для всех решений по танкам, которые стреляют управляемыми ракетами через ствол.§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm_flag: "Выполнено решение §YРазработать танковые ПТУР «Комбат» и «Конус»§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm_mission: "Последний шанс для §Y«Комбата»§! и §Y«Конуса»§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm_mission_desc: "§WМы пропустили плановый старт программы §Y«Комбат»§! и §Y«Конус»§!, поэтому §LКБ «Луч»§! доведёт танковые ракеты по собственному графику. Когда эта миссия завершится, работа будет выполнена, а её стоимость спишется из нашей казны. Эти ракеты нужны каждому решению по танкам, стреляющим управляемыми ракетами через ствол.§!"
 ukraine_equipment_develop_domestic_atgm.13.name: "ПТУР «Комбат» и «Конус»: разработка завершена"
 ukraine_equipment_develop_domestic_atgm.13.desc: "КБ «Луч» завершило танковые ракеты «Комбат» и «Конус». Теперь наши конструкторы танков могут оснащать машины орудиями, стреляющими управляемыми ракетами."
 ukraine_equipment_develop_domestic_atgm.13.a: "Передать их конструкторам танков"
 UKR_equipment_develop_domestic_bm3_shturm: "Разработать боевой модуль §YБМ-3 «Штурм»§!"
 UKR_equipment_develop_domestic_bm3_shturm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_bm3_shturm_for_tooltip\n\n\n\n\n\n\n\n\n§W§YБМ-3 «Штурм»§! — §Y[ROOT.GetFlag]украинский§! боевой модуль, разработанный §LХКБМ им. Морозова§! для бронетранспортёров и боевых машин пехоты.\nОн сочетает 30-мм автоматическую пушку, спаренный пулемёт, автоматический гранатомёт и пусковые установки противотанковых управляемых ракет §Y«Барьер»§!.\n------------------\nЭто решение — §Rобязательное условие§! для решений §YБТР-3Е1§! и §YБТР-4§!.§!"
 UKR_equipment_develop_domestic_bm3_shturm_flag: "Выполнено решение §YРазработать боевой модуль БМ-3 «Штурм»§!"
 UKR_equipment_develop_domestic_stuhna_p_vehicle: "Установить §YРК-2 «Стугна-П»§! на шасси машины"
 UKR_equipment_develop_domestic_stuhna_p_vehicle_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_stuhna_p_vehicle_for_tooltip\n\n\n\n\n\n\n\n\n§WПусковую установку §YРК-2 «Стугна-П»§! можно установить на лёгкие бронемашины и MRAP, превратив их в быстрые самоходные противотанковые машины.\nЭкипаж стреляет ракетами под защитой брони и покидает огневую позицию до того, как противник успеет ответить.\n------------------\nКаждое исследованное шасси получает свою машину: §YДозор-Б§! и §YКозак§! с §Y2005§! года, §YНоватор§! и §YКозак-2§! с §Y2015§! года. Шасси 2015 года надёжнее.§!"
 UKR_equipment_develop_domestic_stuhna_p_vehicle_chassis_tt: "Исследовано шасси вспомогательной машины или MRAP §Y2005§! или §Y2015§! года"
 UKR_equipment_export_skif_buyer_money_0_2_tt: "У покупателя есть не менее £treasury §Y0.2§! млрд на оплату первой партии"
 UKR_equipment_export_skif_buyer_money_0_4_tt: "У покупателя есть не менее £treasury §Y0.4§! млрд на оплату первой партии"
 UKR_equipment_export_skif_buyer_money_0_1_tt: "У покупателя есть не менее £treasury §Y0.1§! млрд на оплату первой партии"
 UKR_equipment_export_skif_azerbaijan: "Предложить ПТУР §Y«Скиф»§! [AZE.GetNameWithFlag]"
 UKR_equipment_export_skif_azerbaijan_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_skif_export_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[AZE.GetNameWithFlag]§! ищет современное противотанковое оружие для своей армии. §Y«Скиф»§!, экспортная версия нашего §YРК-2 «Стугна-П»§!, отвечает его потребностям.§!"
 UKR_equipment_export_skif_saudi_arabia: "Предложить ПТУР §Y«Скиф»§! [SAU.GetNameWithFlag]"
 UKR_equipment_export_skif_saudi_arabia_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_skif_export_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[SAU.GetNameWithFlag]§! закупает противотанковое оружие для операций в Йемене. §Y«Скиф»§!, экспортная версия нашего §YРК-2 «Стугна-П»§!, может выиграть этот контракт.§!"
 UKR_equipment_export_skif_georgia: "Предложить ПТУР §Y«Скиф»§! [GEO.GetNameWithFlag]"
 UKR_equipment_export_skif_georgia_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_skif_export_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[GEO.GetNameWithFlag]§! хочет укрепить оборону от бронетанковых атак. §Y«Скиф»§!, экспортная версия нашего §YРК-2 «Стугна-П»§!, отвечает её потребностям.§!"
