 SOV_yabloko: "러시아 통합민주당 야블로코"
 SOV_yabloko_desc: "현대 러시아에서 가장 오래된 자유주의 정당 중 하나인 야블로코가 서구식 민주주의에 대한 새로워진 지지의 물결에 힘입어 마침내 집권했습니다. 이 정당은 1990년대의 노련한 민주주의자들에서부터 자유롭고 정의로운 사회라는 약속에 고무된 신세대에 이르기까지 개혁주의자들의 정치적 보금자리가 되었습니다. 그들의 목표는 러시아를 모범적인 서구식 자유 민주주의로 재편하는 것에 다름없습니다."
 SOV_yavlinskiy: "Grigory Yavlinsky"
 SOV_yavlinskiy_desc: "Grigory Yavlinsky was born on April 10, 1952, in Lviv, but his political career took root in Moscow's Soviet-era government institutions. A trained economist, he was once tasked with crafting market reforms for the USSR, but his proposals were eventually discarded in favor of other strategies. Despite setbacks, he remained a vocal advocate for reform and has led the Yabloko party from the early 1990s to the present day. His enduring presence in Russian politics reflects his commitment to a democratic and economically liberal Russia."
 SOV_russian_liberalism: "러시아 자유주의"
 SOV_russian_liberalism_desc: "For centuries, Russia has suffered under autocrats, from the tsars to the Soviet regime. True democracy has never had the opportunity to flourish. Now is the time to break from that legacy. By embracing Western liberal values, such as self-determination, human rights, and freedom of speech, we can guide Russia into a new era of democratic governance and civic empowerment."
 SOV_fix_eltsyn_shit: "90년대 실수 수정"
 SOV_fix_eltsyn_shit_desc: "The economic policies of Gaidar and Yeltsin in the 1990s led Russia down a dangerous path. Instead of a vibrant market economy, the country descended into oligarchy, with wealth and power concentrated in the hands of a few. We must now right these wrongs and prove that real capitalism can work in Russia. A transparent and competitive economy must replace the crony system that was allowed to take root."
 SOV_russian_free_speech: "러시아인들의 언론의 자유"
 SOV_russian_free_speech_desc: "Freedom of speech is a fundamental pillar of any liberal society. When people are silenced, the state grows stagnant and disconnected from its citizens. This suppression led to collapse under both the empire and the Soviet Union. To safeguard our future and prevent another cycle of decay, we must protect and promote open discourse and expression for all."
 SOV_no_repressions: "억압적인 법률을 역전시키다"
 SOV_no_repressions_desc: "Prior to our rise to power, the government passed laws that curtailed civil liberties and imprisoned innocent citizens. These repressive measures have no place in a liberal democracy. We must dismantle these laws and release those who were unjustly punished. This is a necessary step toward justice, reconciliation, and the restoration of public trust in government."
 SOV_depoliticize_oligarchs: "과두정치의 비정치화"
 SOV_depoliticize_oligarchs_desc: "The fusion of political and economic power in the 1990s gave birth to an entrenched oligarchy that has weakened our democracy. These elites treat the country like a private asset. It's essential to break this unholy alliance and ensure that political influence rests solely with the people. Only then can we return power to its rightful place, in the hands of citizens."
 SOV_depoliticize_oligarchs_focus_TT: "We will begin the long process of depoliticising the oligarchs. They might resist!"
 SOV_new_society: "위대한 사회"
 SOV_new_society_desc: "Russia has weathered the storm of recovery. Now it is time to begin the transformation of our society. We aim to construct a liberal framework for both governance and economy, moving away from the authoritarian and collectivist values of the past. Our Great Society initiative draws inspiration from Lyndon B. Johnson's vision, but our ambition is even broader: to fundamentally reshape Russia into a modern, forward-looking liberal democracy."
 SOV_capitalism_in_500_days: "500일 프로그램 시작"
 SOV_capitalism_in_500_days_desc: "The 500 Days Program was originally designed to transition the Soviet economy into a market-based system. Though shelved in favor of Gaidar's Shock Therapy, the need for such reform remains. We will revive and update the program to create a more stable and inclusive economic transformation. If implemented properly, it will lay the foundation for long-term prosperity and democratic resilience."
 SOV_lgbt_rights: "LGBT에 대한 인정과 권리"
 SOV_lgbt_rights_desc: "A truly liberal society must respect the rights and dignity of every person, regardless of their sexual orientation. LGBT individuals deserve equal protection under the law and equal access to opportunity. Recognizing their rights is not only a moral imperative but a necessary step toward building an inclusive and modern Russia."
 SOV_kill_communists: "공산주의 동조자들을 숙청"
 SOV_kill_communists_desc: "Communism remains one of the greatest threats to liberal reform in Russia. Fueled by nostalgia for a flawed past, its supporters seek to reverse our progress. We must decisively dismantle their networks and prevent the reemergence of authoritarian socialism. There is no place for this ideology in a modern democratic state."
 SOV_kill_revanchism: "복수주의적 사고 파괴"
 SOV_kill_revanchism_desc: "What breeds totalitarianism and illiberal ideologies? Revanchism. It festers in weak systems, waiting for a chance to resurface. Like a lingering virus, it must be eradicated if we want to secure our liberal future. We must confront it head-on, with education, reform, and strong institutions, to ensure it does not infect our society again."
 SOV_communist_angry_focus_TT: "우리는 공산주의자들을 화나게 할 것이다!"
 SOV_kill_fascists: "민족주의의 물결을 진정시키다"
 SOV_kill_fascists_desc: "Nationalism, when taken to extremes, poses a grave danger to a liberal, multiethnic society. History has shown the devastating consequences of nationalist regimes. We must dismantle these movements before they gain momentum. A free and inclusive Russia must take precedence over narrow ethnonationalist agendas."
 SOV_fascists_angry_focus_TT: "우리는 민족주의자들을 화나게 할 것이다!"
 SOV_better_russia: "더 나은 러시아"
 SOV_better_russia_desc: "Although our work is far from finished, we have taken decisive steps toward building a freer, more just Russia. For the first time in generations, the cycle of tyranny has been interrupted. We have prevented the return of dictatorship, and with continued effort, we can build a future defined by democracy and opportunity."
 SOV_500_days_ura_tt: "500일 계획의 §Y4§!개 단계를 완료함"
 SOV_500_days_pizda_tt: "개혁을 완료하지 못하면 결과를 예측할 수 없습니다!"
 SOV_500_days_focus_TT: "경제 개혁 결정을 잠금 해제합니다. 주의: 제때 계획을 완료하지 못하면 결과를 예측할 수 없습니다!"
 SOV_depolitisation_of_oligarchs: "올리가르히의 탈정치화"
 SOV_new_broken_economy: "개혁 실패의 여파"
 SOV_new_broken_economy_desc: "우리는 경제 개혁을 이행하는 데 실패했습니다. 이제 국가는 1990년대의 참담한 경기 후퇴에 맞먹는 깊은 불황의 수렁에 빠져 있습니다. 기업들은 무너지고 있고, 국민의 신뢰는 사라지고 있으며, 실업률은 치솟고 있습니다. 제때 행동하지 못한 대가는 참혹했습니다."
 SOV_communist_angry: "공산주의자 시위!"
 SOV_nationalists_angry: "민족주의자 시위!"
 SOV_the_onf: "전러시아 국민전선"
 SOV_the_onf_desc: "일부는 권력을 확보하려면 선거를 폐지하고 독재를 받아들여야 한다고 주장합니다. 우리는 그 길을 거부합니다. 권위주의는 정체와 파멸로 이어질 뿐입니다. 그 대신 우리는 시민 단체와 정당이 폭넓게 참여하는 연합, 즉 건설적인 토론과 혁신, 감독을 위한 장을 제안합니다. 이 국민전선을 통해 우리는 정치적 안정을 유지하면서 민주주의를 강화할 것입니다."
 SOV_the_onf_TT: "정당들의 §Y폭넓은 연합§!이 결성되어 §Y정치적 안정§!을 보장합니다!"
 SOV_preserve_working_system: "작동하는 체제의 유지"
 SOV_preserve_working_system_desc: "일부는 공정한 연방 체제를 이루는 유일한 방법이 지방에 최대한의 자치를 부여하거나 현행 구조를 완전히 뜯어고치는 것이라고 주장합니다. 우리의 생각은 다릅니다. 현행 연방 체제는 과거 권위주의 정권들 때문에 신뢰를 잃었지만 근본적으로는 건전합니다. 사려 깊고 민주적인 개혁을 통해 우리는 이 체제의 잠재력을 온전히 끌어내고 모든 러시아인을 위해 작동하도록 할 수 있습니다."
 SOV_more_fair_taxation: "공정 과세"
 SOV_more_fair_taxation_desc: "현행 체제의 중대한 결함은 지방 세제에 있습니다. 현재 세금은 지방에서 걷혀 연방 정부로 보내진 뒤 재분배되는데, 이 과정이 종종 불공정합니다. 이 체제는 부를 주요 지방에 집중시키고 다른 지방은 낙후된 채로 남겨 둡니다. 우리는 각 지방이 자신의 자원 가운데 공정한 몫을 직접 관리할 수 있도록 이 절차를 개혁해야 합니다. 이는 균형 잡힌 발전을 촉진하고 경제적 불평등과 분리주의 정서를 줄일 것입니다."
 SOV_equal_regions: "지방 간 평등"
 SOV_equal_regions_desc: "우리의 연방 구조를 해체하거나 급진적으로 바꿀 필요는 없습니다. 필요한 것은 민주적 통치와 모든 지방을 위한 기회균등에 대한 새로운 헌신입니다. 과거의 권한 남용을 바로잡고 포괄적인 개혁을 단행함으로써, 규모나 부와 관계없이 모든 지방이 발언권과 번영의 수단을 갖는 체제를 만들 수 있습니다."
 SOV_what_we_dreamt_about: "우리의 꿈"
 SOV_what_we_dreamt_about_desc: "우리는 러시아 연방주의의 초기 설계자들이 구상만 했던 것을 이루어 냈습니다. 우리의 체제는 이제 제대로 작동하며 민주적이고 공정합니다. 우리 개혁의 성공은 러시아가 연방의 토대를 버리지 않고도 통합과 평등을 유지할 수 있음을 증명합니다. 이것이 우리가 꿈꾸던 러시아입니다. 강하고, 자유롭고, 모두에게 공정한 나라입니다."
 SOV_new_form_of_the_gov: "정부의 새로운 형태"
 SOV_new_form_of_the_gov_desc: "수십 년간의 권위주의적 통제는 한때 우리 정부를 이끌었던 민주주의 원칙을 갉아먹었습니다. 행정부의 권력은 견제받지 않은 채 커졌습니다. 중앙 정부 기관들의 역할을 재검토하고 균형을 다시 잡는 것은 우리의 의무입니다. 민주적 견제와 균형을 되살릴 때에야 비로소 진정으로 국민을 위하는 정부를 만들 수 있습니다."
 SOV_empower_duma: "연방의회 권한 강화"
 SOV_empower_duma_desc: "대통령의 권한은 문서상으로는 제한적으로 보일 수 있으나, 실제로는 모든 정부 부문을 좌지우지할 수 있게 합니다. 민주주의를 지키려면 헌법을 개정하여 대통령의 권한을 제한해야 합니다. 대통령직을 의례적인 자리로 만들거나 아예 폐지하고, 진정한 입법 권력을 연방의회로 이양할 것입니다."
 SOV_mixed_system: "혼합 체제"
 SOV_mixed_system_desc: "러시아의 현행 반대통령제는 서구 자유주의 원칙, 특히 1993년 헌법에 명시된 원칙에 뿌리를 두고 있습니다. 비판자들은 이 체제가 독재를 조장한다고 주장하지만, 적절한 개정을 거친다면 전면적인 개편 없이도 견제와 균형을 강화할 수 있습니다. 체제를 다듬음으로써 우리는 제도의 연속성을 보존하면서 권력의 집중을 막을 것입니다."
 SOV_all_powers_to_the_presidents: "대통령에게 모든 권력을"
 SOV_all_powers_to_the_presidents_desc: "많은 이들은 러시아가 대통령이 실질적 권한 대부분을 쥔 사실상의 대통령제 공화국으로 운영된다고 믿습니다. 신중하게 재편한다면 이 모델도 민주주의 안에서 얼마든지 작동할 수 있습니다. 우리는 헌법을 조정하여 대통령을 행정부의 공식 수반으로 삼고, 총리의 직무를 흡수하여 통치를 간소화할 것입니다."
 SOV_changes_in_the_constitution: "진정으로 민주적인 헌법"
 SOV_changes_in_the_constitution_desc: "오랜 숙의 끝에 우리는 새로운 일련의 헌법 개정을 시행할 준비가 되었습니다. 이 개정은 국가 권력의 구조를 새로 규정하고, 민주주의 원칙을 명문화하며, 시민의 자유를 보장할 것입니다. 무엇보다도 언론의 자유를 지키고 향후 여러 세대에 걸쳐 권력 남용을 막을 것입니다."
 SOV_semipres_focus_TT: "우리는 반대통령제 공화국으로 남을 것입니다"
 SOV_parliament_focus_TT: "우리는 의원내각제 공화국이 될 것입니다"
 SOV_president_focus_TT: "우리는 대통령제 공화국이 될 것입니다"
 SOV_idea_parliamentary_republic: "의원내각제"
 SOV_idea_presidential_republic: "대통령제 공화국"
 SOV_idea_semi_presidential_republic: "준대통령제 공화국"
 SOV_freind_kyr: "키르기스스탄과의 친선"
 SOV_freind_kyr_desc: "중앙아시아에서의 영향력 강화는 우리의 전략적 우선순위 가운데 하나입니다. 키르기스스탄과 더 긴밀한 유대를 쌓음으로써 우리는 구소련권 국가들과 지속적인 동반자 관계를 구축하고 지역을 안정시킬 수 있습니다."
 SOV_freind_kaz: "카자흐스탄과의 친선"
 SOV_freind_kaz_desc: "중앙아시아에서의 영향력 강화는 우리의 전략적 우선순위 가운데 하나입니다. 카자흐스탄은 이 지역에서 핵심적인 위치를 차지하고 있으며, 강력한 양자 관계는 양국 모두에 이익이 될 것입니다."
 SOV_freind_uzb: "우즈베키스탄과의 친선"
 SOV_freind_uzb_desc: "중앙아시아에서의 영향력 강화는 우리의 전략적 우선순위 가운데 하나입니다. 우즈베키스탄과 긴밀한 동반자 관계를 구축하면 상호 경제적, 외교적 이익을 얻게 될 것입니다."
 SOV_freind_taj: "타지키스탄과의 친선"
 SOV_freind_taj_desc: "중앙아시아에서의 영향력 강화는 우리의 전략적 우선순위 가운데 하나입니다. 타지키스탄과의 관계를 복원하면 지역의 평화와 협력, 공동 발전을 보장하는 데 도움이 될 것입니다."
 SOV_freind_trk: "Friendship with Turkmenistan"
 SOV_freind_trk_desc: "중앙아시아에서의 영향력 강화는 우리의 전략적 우선순위 가운데 하나입니다. 투르크메니스탄과 더 가까운 관계를 맺으면 지역 협력과 상호 신뢰를 증진하는 데 도움이 될 것입니다."
 SOV_attack_uzb: "Bring Democracy to Uzbekistan"
 SOV_attack_uzb_desc: "중앙아시아의 많은 지역은 현대판 칸처럼 통치하는 권위주의 지도자들의 손아귀에 놓여 있습니다. 우리는 우즈베키스탄에 진정한 민주적 통치를 도입하고 국민을 독재에서 해방하기 위해 행동할 것입니다."
 SOV_attack_kaz: "Bring Democracy to Kazakhstan"
 SOV_attack_kaz_desc: "중앙아시아의 많은 지역은 현대판 칸처럼 통치하는 권위주의 지도자들의 손아귀에 놓여 있습니다. 카자흐스탄은 자유와 인권, 민주적 제도 위에 세워진 미래를 누릴 자격이 있습니다."
 SOV_attack_kyr: "Bring Democracy to Kyrgyzstan"
 SOV_attack_kyr_desc: "중앙아시아의 많은 지역은 현대판 칸처럼 통치하는 권위주의 지도자들의 손아귀에 놓여 있습니다. 키르기스스탄은 진정한 민주적 개혁을 통해 번영할 기회를 얻어야 합니다."
 SOV_attack_trk: "Bring Democracy to Turkmenistan"
 SOV_attack_trk_desc: "중앙아시아의 많은 지역은 현대판 칸처럼 통치하는 권위주의 지도자들의 손아귀에 놓여 있습니다. 투르크메니스탄 국민은 자신들의 목소리가 존중받고 경청되는 체제를 누릴 자격이 있습니다."
 SOV_attack_taj: "Bring Democracy to Tajikistan"
 SOV_attack_taj_desc: "중앙아시아의 많은 지역은 현대판 칸처럼 통치하는 권위주의 지도자들의 손아귀에 놓여 있습니다. 타지키스탄은 더 밝고 더 민주적인 미래를 받아들일 기회를 얻어야 합니다."
 SOV_support_democracy_in_georgia: "조지아의 민주주의 지지"
 SOV_support_democracy_in_georgia_desc: "조지아는 캅카스 지역 민주주의 발전의 최전선에 서 있습니다. 우리는 민주적 제도를 강화하고 모든 시민을 위한 정치적 자유를 증진하려는 조지아의 노력을 지원할 것입니다."
 SOV_state_investments: "조지아에 대한 국가 투자"
 SOV_state_investments_desc: "조지아에 투자함으로써 우리는 캅카스에서의 입지를 다지고 핵심 동반자의 경제 성장을 촉진합니다. 이 투자는 지역의 안정과 상호 협력을 강화할 것입니다."
 SOV_naval_base_in_georgia: "조지아의 해군기지"
 SOV_naval_base_in_georgia_desc: "조지아 해안에 해군 기지를 건설하면 흑해 지역을 감시하고 통제하는 우리의 능력이 크게 향상될 것입니다. 러시아의 국경이 북쪽으로 옮겨 가더라도 흑해에서의 해군 주둔은 여전히 필수적이며 영구적입니다. 이 기지는 우리의 전략적 이익을 지키고 지역 안보를 강화할 것입니다."
 SOV_mediate_ossetianabkhaz_question: "오세티야-압하지야 문제 중재"
 SOV_mediate_ossetianabkhaz_question_desc: "남오세티야와 압하지야를 둘러싼 오랜 갈등은 더 이상 현대의 지정학적 현실에 들어맞지 않습니다. 우리는 중립적인 중재자로서 긴장을 완화하고 캅카스의 평화를 증진하며 관련된 모든 당사자 간의 안정과 협력을 도모해야 합니다."
 SOV_friendship_armenia: "아르메니아와의 우호"
 SOV_friendship_armenia_desc: "아르메니아와의 관계 강화는 필수적입니다. 역사적, 지역적으로 가까운 동반자인 아르메니아는 정치, 경제, 문화적 유대를 심화하기 위한 더 많은 관심을 받을 자격이 있습니다."
 SOV_friendship_azerbaijan: "아제르바이잔과의 우호"
 SOV_friendship_azerbaijan_desc: "남캅카스의 주요 산유국인 아제르바이잔과의 관계 개선은 전략적 조치입니다. 협력 강화는 양국 모두에 이익이 되며 지역의 경제적, 정치적 안정에 기여할 것입니다."
 SOV_invest_in_arm_it: "아르메니아에 투자"
 SOV_invest_in_arm_it_desc: "아르메니아에 대한 투자는 경제 발전을 촉진하고 캅카스에서의 우리 영향력을 강화할 것입니다. 표적화된 지원은 인프라, 산업, 양자 협력을 끌어올릴 수 있습니다."
 SOV_invest_in_aze_oil: "아제르바이잔 석유에 투자"
 SOV_invest_in_aze_oil_desc: "아제르바이잔의 유전 개발은 국가 간 협력을 심화하는 데 중요합니다. 이 투자는 에너지 자원을 확보하고 양국 간 경제적 유대를 강화할 것입니다."
 SOV_decide_side: "어느 편에 설지 선택"
 SOV_decide_side_desc: "우리는 캅카스의 모든 구소련 국가와 균형 잡힌 관계를 유지하려 노력하지만, 아르메니아와 아제르바이잔 사이의 해결되지 않은 갈등은 우리에게 선택을 강요합니다. 이 복잡한 지역 분쟁에서 양측을 똑같이 지지하는 것은 불가능합니다."
 SOV_support_artsakh: "아르차흐 지지"
 SOV_support_artsakh_desc: "우리의 공감은 캅카스에서 가장 가깝고 우호적인 동반자인 아르메니아 쪽으로 기웁니다. 아르차흐를 지지하는 것은 이 동맹과 지역 우방국을 보호하겠다는 우리의 의지를 반영합니다."
 SOV_support_azerbaijan: "아제르바이잔 지지"
 SOV_support_azerbaijan_desc: "아르메니아와의 역사적 우정에도 불구하고 우리는 경제적, 전략적 현실 또한 고려해야 합니다. 아제르바이잔의 강력한 위상과 방대한 석유 매장량은 아제르바이잔을 이익을 무시할 수 없는 필수적인 동반자로 만듭니다."
 SOV_invite_shah: "샤 초청"
 SOV_invite_shah_desc: "이란의 정치 상황은 갈수록 불안정해지고 있습니다. 왕세자를 초청하면 귀중한 동맹을 얻고 질서를 회복하는 데 도움이 될 수 있습니다. 그의 귀환은 이 불확실한 시기에 우리에게 유리하게 힘의 균형을 움직일 수 있습니다."
 SOV_support_the_reformists: "개혁파 지원"
 SOV_support_the_reformists_desc: "이란의 개혁파는 우리의 이익 및 지역에 대한 구상과 더 잘 맞습니다. 이들을 지원하면 더 온건한 정책과 양측 모두에 이익이 되는 안정적인 동반자 관계로 이어질 수 있습니다."
 SOV_invest_in_iran: "이란에 투자"
 SOV_invest_in_iran_desc: "이란은 우리가 외면할 수 없는 상당한 경제적 기회를 제공합니다. 이란의 발전에 투자함으로써 우리는 수익성 있는 수익을 확보하고 지역에서의 영향력을 강화할 수 있습니다."
 SOV_neutral_relations: "중립적 관계"
 SOV_neutral_relations_desc: "평화는 갈등보다 낫습니다. 우리는 전쟁을 피하고 지역의 안정을 도모하면서 외교와 협력을 통해 목표를 추구할 것입니다."
 SOV_passage_through_caucasus: "캅카스 통과로 확보"
 SOV_passage_through_caucasus_desc: "남캅카스를 지나는 안전한 통로를 확보하면 이란과의 우호적 관계를 유지하면서 우리의 전략적 입지를 강화할 수 있습니다. 이 해법은 우리의 지역적 이익의 균형을 맞추고 협력을 증진합니다."
 SOV_animosity_to_iran: "이란에 대한 적대감"
 SOV_animosity_to_iran_desc: "이란 정부의 자국민 탄압은 우리에 대한 적대감을 낳았습니다. 이 적대감으로 인해 이란은 비우호적이고 예측하기 어려운 이웃이 되었으며, 우리는 신중하게 접근해야 합니다."
 SOV_ignite_revolution_in_iran: "이란 혁명 촉발"
 SOV_ignite_revolution_in_iran_desc: "우리에게는 이제 이란 국민의 해방을 지원할 기회가 있습니다. 혁명을 촉발하면 이 지역을 우리의 이익에 더 가깝게 정렬시키고 우리에게 유리한 더 큰 안정을 증진할 것입니다."
 SOV_poland_relations: "Russian-Polish Friendship"
 SOV_poland_relations_desc: "이제 오래된 갈등을 뒤로하고 이웃 폴란드와 함께 더 강력한 슬라브 세계를 건설할 때입니다. 폴란드와의 협력은 상호 이익과 지역 안정을 가져올 것입니다."
 SOV_befriend_france: "프랑스와의 친선"
 SOV_befriend_france_desc: "프랑스와의 유대 강화는 우리의 세계적 야망을 달성하는 데 필수적입니다. 긴밀한 동반자 관계는 국제 무대에서 평화와 협력을 증진할 것입니다."
 SOV_mutual_def_poland: "폴란드와의 협력"
 SOV_mutual_def_poland_desc: "폴란드는 귀중한 교역 상대입니다. 경제적, 외교적 협력을 강화하면 지역 내 우리의 영향력과 상호 번영이 공고해질 것입니다."
 SOV_befriend_germany: "독일과의 친선"
 SOV_befriend_germany_desc: "독일의 경제력은 독일을 우리에게 필수적인 동반자로 만듭니다. 강력한 관계를 발전시키면 수많은 이익을 얻고 유럽과 그 너머에서 우리의 입지를 높일 수 있습니다."
 SOV_peugeout: "푸조"
 SOV_peugeout_desc: "푸조는 프랑스를 대표하는 자동차 제조사 가운데 하나이며, 2007년 기준 유럽 2위의 자동차 기업이었던 PSA 푸조 시트로엥의 핵심 계열사입니다. 푸조와의 제휴는 산업 협력의 큰 잠재력을 제공합니다."
 SOV_volkswagen: "폭스바겐"
 SOV_volkswagen_desc: "폭스바겐은 독일을 상징하는 자동차 제조사입니다. 모든 러시아인은 현대성과 신뢰성을 상징하는 이런 양질의 차량을 이용할 자격이 있습니다."
 SOV_us_brotherhood: "러시아-미국 우호"
 SOV_us_brotherhood_desc: "우리는 냉전 시대의 적대감을 내려놓고 미국과 새롭고 유망한 관계를 구축해야 합니다. 함께라면 모두를 위한 더 안전하고 더 번영하는 세계를 만들 수 있습니다."
 SOV_us_russia_defence_pact: "미국-러시아 방위조약"
 SOV_us_russia_defence_pact_desc: "이 조약에 서명함으로써 우리는 미국과 러시아 사이의 수십 년에 걸친 경쟁을 끝낼 것입니다. 이 역사적인 협정은 지속적인 평화와 세계 안보의 길을 열 것입니다."
 SOV_ger_nuclear_deal: "서방과의 핵 협상"
 SOV_ger_nuclear_deal_desc: "새로운 전략무기 조약에 서명할 때가 왔습니다. 이 합의는 핵 긴장을 낮추고 서방 열강과의 관계에서 새로운 장을 열 것입니다."
 russia.77.t: "러시아의 투자"
 russia.77.d: "러시아가 우리 경제를 지원하기 위한 투자를 제안하고 있습니다. 이 제안을 수락하면 우리 경제의 기반이 강화되고 새로운 성장 기회가 열려 우리나라에 큰 이익이 될 것입니다."
 russia.77.o1: "좋소, 받아들이겠소!"
 russia.77.o2: "아니오, 우리는 스스로 발전할 능력이 있소"
 russia.78.t: "수락된 우리의 제안"
 russia.78.d: "상대가 우리의 제안을 수락했습니다. 이는 협력과 상호 발전을 향한 긍정적인 진전입니다."
 russia.78.o1: "우라!"
 russia.79.t: "거절된 우리의 제안"
 russia.79.d: "안타깝게도 우리의 제안은 거절되었습니다. 이에 따라 우리는 접근 방식을 재고하고 다른 기회를 모색해야 합니다."
 russia.79.o1: "이런"
 russia.83.t: "조지아와의 오랜 갈등을 해소하기 위한 제안"
 russia.83.d: "러시아가 지역의 오랜 갈등을 완화하고 긴장을 낮추기 위한 협정의 체결을 제안했습니다. 이 제안은 안정을 개선하고 추가적인 적대 행위를 피할 기회를 제공합니다. 러시아가 우리의 수락을 기대한다는 기색을 내비치고 있지만, 이 협정이 과연 우리의 주권과 이익을 지켜 주는지 신중히 따져 보아야 합니다."
 russia.83.o1: "동의한다"
 russia.83.o2: "아니오, 우리는 독립을 쟁취했고 그것을 지켜 낼 것이오!"
 russia.80.t: "우리 에너지 산업에 대한 투자"
 russia.80.d: "러시아가 에너지 부문 개발을 위한 투자를 제안하고 있으며, 그 대가로 더 큰 영향력을 얻기를 기대하고 있습니다. 이 거래를 수락하면 우리의 에너지 기반시설이 강화되고 러시아와의 경제적 유대가 깊어질 것입니다. 그러나 이 핵심 산업에 대한 통제권 일부를 잃을 수 있다는 점과 이익을 저울질해야 합니다."
 russia.80.o1: "물론이오, 아제르바이잔의 석유는 번창해야 하오!"
 russia.80.o2: "러시아? 응?"
 russia.81.t: "수락된 우리의 제안"
 russia.81.d: "상대가 우리의 제안을 수락했습니다. 이는 양국 관계에서 긍정적인 진전입니다. 이 수락은 가까운 시일 내 협력과 상호 이익의 새로운 가능성을 열어 줍니다."
 russia.81.o1: "우라!"
 russia.84.t: "우리에 대한 지지를 표명한 러시아"
 russia.84.d: "러시아 지도부가 우리 정부에 대한 지지를 공개적으로 선언하고 외교적, 우호적 관계를 강화할 의향이 있음을 표명했습니다. 이 지지는 협력 확대와 지역 안정의 길을 열어 줄 수 있습니다."
 russia.84.o1: "아우에!"
 russia.85.t: "이란의 옛 샤의 등장"
 russia.85.d: "여전히 권력을 되찾으려는 야망을 품고 있는 이란의 전 샤가 다시 모습을 드러냈다는 보고가 있습니다. 그의 귀환은 이란의 정치 지형과 지역 역학에 상당한 영향을 미칠 수 있으며, 우리는 이 지역에서의 전략을 재평가해야 합니다."
 russia.85.o1: "흥미롭군"
 russia.86.t: "미국-러시아 상호 방위 조약"
 russia.86.d: "관계 개선의 시기를 거친 지금, 우리는 양국 간의 지속적인 평화를 보장하기 위해 러시아와 상호 방위 조약을 체결할 기회를 맞았습니다. 이 조약은 국제 협력과 안정을 향한 중대한 진전을 상징할 것입니다."
 russia.86.o1: "우리가 내릴 수 있는 최선의 결정이다"
 russia.86.o2: "세계에 초강대국은 단 하나뿐이며, 그것은 바로 우리다!"
 russia.89.t: "핵 협정"
 russia.89.d: "러시아가 전략 핵 안보에 초점을 맞춘 조약을 체결하자고 제안합니다. 이러한 합의는 핵 비확산에 대한 우리의 공동 입장을 강화하고 이 지역과 그 너머에서 핵 분쟁의 위험을 줄일 것입니다."
 russia.89.o1: "동의한다"
 russia.89.o2: "아니오, 그것은 우리가 원하는 바가 아니오"
 russia.90.t: "핵 협정"
 russia.90.d: "[FROM.GetNameWithFlag]이(가) 핵 협정에 공식적으로 동의했습니다. 이는 지역 안보를 확보하고 평화를 증진하려는 우리 노력의 중요한 이정표입니다."
 russia.90.o1: "Good"
 russia.92.t: "폴란드-러시아 상호 방위 조약"
 russia.92.d: "러시아가 폴란드와 상호 방위 조약을 체결하자고 제안했으며, 이는 관계 해빙의 잠재적 신호입니다. 일부 정부 관료들은 동유럽에서의 러시아 지배를 우려하며 여전히 신중한 입장이지만, 이 협정은 우리나라에 협력과 안보의 새로운 시대를 열 수 있습니다."
 russia.92.o1: "이제 러시아를 용서할 때다"
 russia.92.o2: "러시아는 여전히 러시아다. 조약을 거부하라!"
 russia.93.t: "폴란드의 수락!"
 russia.93.d: "폴란드 정부가 러시아와의 상호 방위 조약 체결에 공식적으로 동의했습니다. 이 합의는 과거의 차이를 극복하고 상호 안보를 위해 협력하겠다는 의지를 반영합니다."
 russia.93.o1: "형제 슬라브가 또 해냈다!"
 russia.94.t: "폴란드의 거절!"
 russia.94.d: "폴란드 정부가 상호 방위 조약 체결을 거부하며 러시아에 대한 신중한 태도를 유지했습니다. 실망스럽지만, 이 결정은 지역 내 세력 역학에 대한 지속적인 우려를 반영합니다."
 russia.94.o1: "Their choice"
 russia.95.t: "러시아 해군기지"
 russia.95.d: "러시아가 우리 영토 안에 해군 기지를 건설하겠다고 제안했습니다. 이러한 기지는 우리의 전략적 동반자 관계를 강화하고 지역 안보를 높이겠지만, 주권과 군사적 영향력에 대한 우려도 불러일으킬 수 있습니다."
 russia.95.o1: "원하는 만큼 지으시오!"
 russia.95.o2: "러시아는 여전히 러시아다. 제안을 거부하라!"
 russia.96.t: "허가한 조지아!"
 russia.96.d: "조지아가 자국 영토에 러시아 해군 기지를 설치하는 것을 허가했습니다. 이 조치는 양국 관계를 개선하고 지역 내 안보 협력을 강화할 수 있습니다."
 russia.96.o1: "Spasibo, brothers!"
 russia.97.t: "조지아의 거부!"
 russia.97.d: "조지아가 러시아 해군 기지 건설 요청을 거부했습니다. 이 거부는 지속되는 긴장과 서로 다른 전략적 우선순위를 반영하며, 이를 관리하려면 신중한 외교가 필요할 것입니다."
 russia.97.o1: "Their choice"
 SOV_a_just_russia: "공정 러시아"
 SOV_a_just_russia_desc: "Just Russia was founded in 2006-2007 through the merger of several left-wing political parties. Initially, many believed it was a project controlled by the presidential administration designed to simulate political competition. However, these assumptions were proven wrong when Just Russia won a significant majority in the elections, surprising many and reshaping the political landscape. The party's rise reflects genuine popular support and a desire for social justice."
 SOV_direction: "당의 방향"
 SOV_direction_desc: "After coming to power, the question of our party's direction became urgent. While we share many core values, two main factions have emerged: supporters of the liberal 'White-Stripe' movement and advocates of social patriotism. These differing visions will be debated at the upcoming party congress, which will ultimately decide our future path. This decision will shape the policies and priorities of our party moving forward."
 SOV_white_stripe_movement_preveil: "White Stripe Movement Prevails"
 SOV_white_stripe_movement_preveil_desc: "The party congress has chosen to support the White-Stripe movement's agenda, focusing on deeper democratization and closer ties with the West. This path aligns the party with European-style social democracy and embraces reforms aimed at increasing political freedoms and modernization. This decision signals a commitment to openness, transparency, and cooperation with democratic nations."
 SOV_russian_democracy: "러시아 사회민주주의"
 SOV_russian_democracy_desc: "The pursuit of justice and social reform has long been a defining passion of the Russian people. Throughout history, Russians have gravitated toward ideas of equality, freedom, and social fairness. This trend continued after the Soviet Union's collapse, as citizens rallied behind movements promising meaningful reforms. Now in power, we have a responsibility to fulfill these hopes and translate them into real social progress and democracy."
 SOV_democratisation: "연방 센터에 대한 의존도 감소"
 SOV_democratisation_desc: "Social reformists have consistently championed federalism and decentralization as key to a fair and functional Russia. To achieve balanced development across the country, it is essential to reduce regional reliance on the federal center. By empowering local governments with more autonomy and resources, we will promote equality and more responsive governance throughout all regions."
 SOV_real_welfare: "진정한 사회 복지"
 SOV_real_welfare_desc: "Reforming the welfare system is a top priority for our government. For too long, ordinary people have suffered due to failed market reforms and inadequate social insurance programs. We are committed to overhauling social security to better protect vulnerable citizens and improve their quality of life. Our goal is a system that truly supports the needs of the many, not just the privileged few."
 SOV_empower_legislature: "Inheritor of the Russian Constituent Assembly"
 SOV_empower_legislature_desc: "The Russian Constituent Assembly was the first truly representative body intended to shape the country's future. Though it was cut short by the Bolsheviks, its legacy inspired the creation of the State Duma as the people's parliament. Unfortunately, the Duma has since lost much of its credibility and influence. It is time to restore faith in this institution by granting it real powers and ensuring genuine popular representation."
 SOV_defend_people: "우리 국민을 지켜라"
 SOV_defend_people_desc: "It pains us to see single mothers struggling to afford medicine for their children or large families burdened by high-interest loans for small apartments. Poverty is spreading throughout our regions while banks and corporations grow wealthier. To combat this injustice, we must build a system of social benefits and guarantees that shield our citizens from destitution. Every person deserves dignity and protection."
 SOV_social_gurantees: "사회 보장 및 의료"
 SOV_social_gurantees_desc: "Russia's social security system faces two major challenges: pension provision and a faltering healthcare network. Many elderly citizens cannot afford necessary medications, and hospitals often fail to provide adequate care. We will increase funding and subsidies to ensure pensioners receive a decent standard of living and that healthcare services become accessible and reliable for all citizens."
 SOV_a_just_system: "정의로운 시스템"
 SOV_a_just_system_desc: "Our vision is a society where every individual matters, where basic human rights are respected, and political participation is encouraged. We strive for a system that delivers fair elections and decisions made in the interest of all citizens. This is the just system envisioned by the revolutionaries of the past: a society built on equality, freedom, and true democracy."
 SOV_a_just_economy: "공정한 경제"
 SOV_a_just_economy_desc: "Our greatest ambition is not only a prosperous economy but a prosperous nation. Everyone should have financial security and social protection; no one should be left behind. To build such a society, wealth must be fairly distributed, with higher taxes on excessive profits and relief for the less fortunate. This approach will foster equality and social justice, laying the foundation for a stronger, more unified country."
 SOV_question_of_direction: "노선 문제"
 SOV_question_of_direction_desc: "The question of our party's future direction has become increasingly urgent. Some argue that our social reforms have not gone far enough, pushing for radical changes that transform the social order entirely. Others believe we should emulate successful European social democratic parties and pursue gradual, pragmatic reforms. The choice before us will define our identity and influence the nation's future path."
 SOV_revive_spirit_of_socialist_revolutionaries: "사회주의 혁명가들의 정신을 되살리다"
 SOV_revive_spirit_of_socialist_revolutionaries_desc: "The Socialist-Revolutionaries aimed to radically transform Russian society through agrarian socialism, believing peasants were the revolution's driving force. While Just Russia does not claim direct succession, our reforms have sparked a peaceful but profound societal transformation, echoing the spirit of these historic revolutionaries. Though their ideas are over a century old, they remain relevant today, inspiring us to consider officially reestablishing the Socialist-Revolutionary Party."
 SOV_land_socialisation: "토지 사회화"
 SOV_land_socialisation_desc: "A central tenet of the Socialist-Revolutionary program was the socialization of land, meaning land would belong collectively to all Russians. This concept effectively means transferring land ownership to the state, but managed fairly for the benefit of the people. As representatives of the people, we commit to using this land equitably to maximize public welfare and agricultural productivity."
 SOV_social_democracy_sr: "사회민주주의는 여전히 유행이다"
 SOV_social_democracy_sr_desc: "Social democracy remains one of the most successful political ideas to emerge from Europe. History shows numerous examples where social democratic policies have improved citizens' lives while maintaining economic vitality. By adopting these principles, we can implement effective reforms that promote social justice and prosperity for all Russians."
 SOV_third_way: "제3의 길"
 SOV_third_way_desc: "Democratic governance requires constant negotiation and balance. Many social democratic countries have shifted from traditional leftist policies toward market-oriented but socially responsible approaches known as the 'Third Way.' This philosophy combines free-market practices with social welfare goals, creating a balanced system suited to our current needs. Embracing the Third Way will help us build a modern, efficient, and fair economy."
 SOV_centre_holds: "\"중앙은 강하게 유지되었다\""
 SOV_centre_holds_desc: "The party's Central Council agenda prevailed at the congress, adopting a patriotic program focused on strengthening Russia's sovereignty, central government authority, and national unity. This program aims to transform Russia from a fragmented, struggling state into a strong superpower capable of defending its borders and protecting its diverse peoples. It reflects a commitment to stability, power, and national pride."
 SOV_russian_patriotism: "러시아 사회 애국주의"
 SOV_russian_patriotism_desc: "Our core ideology centers on social patriotism, which emphasizes the creation of a strong, sovereign social state. This state must defend the interests of its citizens both internationally and domestically. It is the government's duty to provide conditions that ensure a high standard of living, while citizens in turn owe loyalty to their motherland by obeying laws, fulfilling compulsory service, and preserving national traditions. This balance between rights and responsibilities is the foundation of our vision for a prosperous Russia."
 SOV_empower_nation: "러시아 국민에게 힘을 실어라"
 SOV_empower_nation_desc: "We define the Russian nation not solely by ethnicity but as all the peoples inhabiting Russia's vast territories. This includes the Volga region, Siberia, and the Caucasus, whose peoples share Russian language, culture, and values. This multinational Russian nation should be prioritized by the state, representing their collective interests. Foreigners should not claim special privileges. Russia belongs to its diverse Russian nation alone, united and strong."
 SOV_talks_with_rodina: "로디나와의 대화"
 SOV_talks_with_rodina_desc: "Our relationship with the Rodina faction runs deep, having once been a single party in the early 2000s. Internal conflicts fractured the movement, leading to the formation of Just Russia from some former Rodina members. Now, with political differences softened and programs closely aligned, it is logical to reestablish relations and work toward uniting. Such unity will enhance our ability to implement shared policies effectively."
 SOV_form_national_patriotic_front: "국가애국전선 결성"
 SOV_form_national_patriotic_front_desc: "Although the Russian people are strong individually, we are vulnerable when divided. United, however, we can overcome any challenge and reshape our nation's future. To achieve political strength and dominance, we must form a broad coalition of parties sharing patriotic and socialist values. Only by uniting can we build a prosperous, independent Russia capable of standing strong on the world stage."
 SOV_social_platform: "Prioritize Social Platform"
 SOV_social_platform_desc: "A high standard of living is essential for the development of our state. When citizens feel secure and hopeful about their future, the nation thrives. Our government will place social policy at the forefront, ensuring that people receive the support and resources necessary for well-being. Investing in social programs is investing in Russia's stability and growth."
 SOV_do_not_forget_about_people: "국민을 잊지마라!"
 SOV_do_not_forget_about_people_desc: "The people are the true source of power in our country, and we must always keep their needs in mind. A happy, prosperous nation can achieve great accomplishments, while a poor and neglected population risks collapse and unrest. Our policies must prioritize improving the lives of all citizens to secure Russia's future."
 SOV_more_regulations: "Nationalization of Corporations"
 SOV_more_regulations_desc: "For too long, capitalists have exploited both our people and our state, accumulating wealth without contributing to society. Liberal laws have enabled unchecked capitalist excess, with profits flowing only to a select few. To change this, we will nationalize major industries and establish state corporations to control the market direction. This will allow us to harness economic power for the benefit of all citizens."
 SOV_economical_platform: "Prioritize Economic Platform"
 SOV_economical_platform_desc: "For our people to prosper and for Russia to flourish, a strong economy is indispensable. No civilization can thrive without economic power and growth. We will focus our efforts on rebuilding the nation's economic strength by prioritizing the National Patriotic Front's economic agenda. Restoring Russia's economic might is the foundation for lasting prosperity."
 SOV_invest_in_beneficial_sectors: "유익한 분야에 투자"
 SOV_invest_in_beneficial_sectors_desc: "Reviving the country's productive capacity requires significant capital investments. Therefore, we must channel funds into key sectors of the economy that promise sustainable long-term returns. By focusing on industries that will drive future economic growth, we will strengthen Russia's GDP and secure a stable economic future for our nation."
 SOV_rapid_militarisation: "신속한 군국화"
 SOV_rapid_militarisation_desc: "A strong, sovereign state demands a powerful military. We will accelerate militarization by integrating military training into schools and organizing mandatory civic military activities. Defense spending will increase to ensure the army can repel any invasion. The Russian state and people must be prepared and united to defend their homeland against all threats."
 SOV_under_a_leader: "강력한 리더 아래서"
 SOV_under_a_leader_desc: "Russian statehood has historically centered around strong leaders, figures like Ivan the Terrible, Alexander III, and Joseph Stalin have commanded deep respect and shaped the nation's destiny. Today, both the people and the state require a similarly strong leader to unite them behind a great national mission. We are prepared to provide such leadership to guide Russia to new heights."
 SOV_talks_with_left_patriots: "좌파 애국자들과의 대화"
 SOV_talks_with_left_patriots_desc: "Gennady Semigin's Patriots of Russia party wields considerable popular support and financial resources, advocating a left-wing patriotism akin to ours. Recognizing a natural ally, we will initiate negotiations to integrate Patriots of Russia into the National Patriotic Front. Their inclusion will strengthen our coalition and secure them representation in the government."
 SOV_unite_patriotic_parties: "애국당 연합"
 SOV_unite_patriotic_parties_desc: "The breakup of the Rodina party led to many small parties sharing patriotic ideals but lacking influence on their own. Although individually weak, the political experience of their leaders can be invaluable when united under a common cause. We will bring these parties into the National Patriotic Front, offering them government roles to consolidate patriotic forces and amplify their impact."
 SOV_a_just_russia_prevails: "공정 러시아의 승리"
 SOV_a_just_russia_prevails_desc: "Within the National Patriotic Front, Just Russia has held firm as the dominant force. Only Just Russia possesses the unity, vision, and strength needed to maintain coalition cohesion and guide Russia towards true greatness. Our leadership will ensure the Front remains steadfast and focused on building a strong and just nation."
 SOV_rodina_prevails: "로디나가 승리한다"
 SOV_rodina_prevails_desc: "Rodina has rebuilt its political standing and regained voter trust within the coalition, strengthening its position enough to claim leadership of the National Patriotic Front. This marks the dawn of a new era, where Rodina will lead the Front and Russia towards a brighter and more prosperous future. The coalition's unity has never been stronger."
 SOV_rodina_tt: "Rodina will take leadership of NPF"
 SOV_blr_democracy_tt: "벨라루스에 민주주의를 도입"
 SOV_under_a_banner: "위대한 깃발 아래서"
 SOV_under_a_banner_desc: "The flags of the Russian Empire, the Soviet Union, and the modern Russian tricolor are powerful symbols of our nation's history. Under these banners, Russia reached great heights in culture, economy, science, and foreign policy. Our ancestors made heroic sacrifices under these flags, from the Crimean War to the Great Patriotic War. Now, under the Russian tricolor, we will strive to achieve even greater accomplishments and national glory."
 SOV_empower_executive: "대통령 권한 강화"
 SOV_empower_executive_desc: "We have long argued that the office of the President of Russia is hampered by excessive restrictions that prevent effective governance. To fully implement Social Patriotism policies, these unnecessary limitations must be removed. Empowering the President with broader authority is essential for decisive leadership and national progress."
 SOV_united_country: "통합된 조국"
 SOV_united_country_desc: "Achieving our national goals requires the unity of the Russian people. Only through solidarity can Russia attain greatness and lasting prosperity. Citizens must rally around a shared ideology, a respected leader, and a strong state. As long as the Russian people stand united, no force can break our nation."
 russia.87.t: "수락된 우리의 제안"
 russia.87.d: "미국이 상호 방위 조약에 서명하기로 동의했습니다. 이는 양국 간의 더 긴밀한 군사 협력을 향한 중대한 진전입니다. 이 합의는 우리의 상호 안보를 강화하고 국제 무대에서 더 큰 신뢰를 쌓을 것입니다."
 russia.87.o1: "훌륭하다!"
 SOV_investments_in_ben: "유익한 부문에 대한 투자"
 russia.88.t: "거절된 우리의 제안"
 russia.88.d: "안타깝게도 우리의 제안은 거절되었습니다. 실망스럽지만, 우리는 이익을 증진하고 입지를 강화하기 위해 다른 동반자와 기회를 계속 모색할 것입니다."
 russia.88.o1: "최선을 다했다."
 russia.82.t: "거절된 우리의 제안"
 russia.82.d: "안타깝게도 우리의 제안은 거절되었습니다. 이 차질로 인해 우리는 전략을 재검토하고 이익을 증진할 다른 방안을 고려해야 합니다."
 russia.82.o1: "시도해 볼 만했다"
 sov_just_russia.1.t: "당 대회"
 sov_just_russia.1.d: "압도적인 선거 승리 이후, 공정 러시아는 당의 미래 방향과 정부 구성, 중앙위원회 선출을 결정하기 위해 비상 전당대회를 개최했습니다. 대의원들은 두 가지 주요 경로를 두고 논쟁을 벌였습니다. 바로 백색 리본 운동(친서방 개혁파)의 기조를 이어갈 것인지, 아니면 당 지도부가 추진하는 사회적 애국주의 강령을 수용할 것 인지에 대한 것입니다. 이번 전당대회에서 당의 운명이 결정될 것입니다."
 sov_just_russia.1.o1: "대회는 당 지도부를 지지했다"
 sov_just_russia.1.o2: "대회는 백색 리본 운동을 지지했다"
 sov_just_russia.2.t: "로디나 분파와의 협상"
 sov_just_russia.2.d: "정의로운 러시아와 로디나 지도부 사이의 오랜 협상 끝에 합의가 이루어졌습니다. 로디나는 현 정의로운 러시아 정부를 지지하고, 정의로운 러시아는 모든 주요 정부 결정에 대해 로디나와 협의하기로 약속합니다. 양당은 또한 애국 단체 및 정당의 폭넓은 연합을 구성하기 시작하기로 합의했습니다."
 sov_just_russia.2.o1: "우리의 로디나"
 sov_just_russia.3.t: "국민애국전선"
 sov_just_russia.3.d: "오늘, 오랜 결성 과정을 거쳐 로디나와 정의로운 러시아의 지도자들이 노동조합 및 사회단체의 대표들과 함께 폭넓은 대중 연합인 국민애국전선의 창설을 발표했습니다. 이 연합의 주요 이념은 세르게이 미로노프가 정립한 사회적 애국주의이며, 국가를 변혁하기 위한 사회주의적, 애국적 개혁을 목표로 합니다. 연합 협정에 따라 소속 정당은 국정 논의에 참여할 수 있으며 대규모 단체는 정부 내 직책을 요청할 수 있습니다. 로디나는 공동 지도자로서 정부 내 한 자리와 여러 장관직을 차지하게 됩니다."
 sov_just_russia.3.o1: "미래를 향해 함께 나아가자!"
 SOV_democracy_in_kaz: "[KAZ.GetNameWithFlag]의 러시아식 민주주의"
 SOV_democracy_in_kaz_desc: "우리는 기습의 이점을 활용하여 [KAZ.GetNameWithFlag]에서 작전을 성공적으로 개시할 것입니다. 그러나 시간이 한정되어 있으므로 신속하고 결단력 있는 행동이 성공의 열쇠입니다."
 SOV_democracy_in_kyr: "[KYR.GetNameWithFlag]의 러시아식 민주주의"
 SOV_democracy_in_kyr_desc: "우리는 기습 전술을 사용하여 [KYR.GetNameWithFlag]을(를) 신속히 타격할 계획입니다. 작전을 개시할 수 있는 시간이 좁으므로 속도가 필수적입니다."
 SOV_democracy_in_taj: "[TAJ.GetNameWithFlag]의 러시아식 민주주의"
 SOV_democracy_in_taj_desc: "우리는 기습의 이점을 활용하여 [TAJ.GetNameWithFlag]에서 효과적인 작전을 수행할 것입니다. 신속한 행동이 목표 달성에 필수적입니다."
 SOV_democracy_in_trk: "[TRK.GetNameWithFlag]의 러시아식 민주주의"
 SOV_democracy_in_trk_desc: "우리의 전략은 [TRK.GetNameWithFlag]에 대한 기습 공격입니다. 성공을 보장하려면 작전을 신속히 개시해야 합니다."
 SOV_democracy_in_uzb: "[UZB.GetNameWithFlag]의 러시아식 민주주의"
 SOV_democracy_in_uzb_desc: "우리는 기습을 활용하여 [UZB.GetNameWithFlag]에서 작전을 성공적으로 개시할 것이나, 기회가 닫히기 전에 신속히 행동해야 합니다."
 SOV_npp_again: "새로운 국가 프로젝트"
 SOV_npp_again_desc: "정부는 경제를 전례 없는 수준으로 끌어올리기 위한 새로운 국가 프로젝트를 시작했습니다. 이 계획들은 사회 복지부터 기술 발전에 이르기까지 다양한 분야에 영향을 미칠 것입니다."
 SOV_m12: "연방 고속도로 M12 \\"보스토크\\""
 SOV_m12_desc: "M12 보스토크 연방 고속도로는 모스크바, 블라디미르, 무롬, 아르자마스, 카잔, 니즈네캄스크, 예카테린부르크, 튜멘 등 주요 도시를 연결합니다. 이 기반시설 개발은 우리의 국가 현대화 노력의 핵심입니다."
 SOV_reconservation: "비축 해제"
 SOV_reconservation_desc: "우리는 소련 시대부터 보존해 온 무기와 장비의 비축분을 재가동할 것입니다. 이는 새로운 생산 없이도 우리의 군사력을 신속하게 강화할 것입니다."
 SOV_black_gussard: "흑색 후사르"
 SOV_black_gussard_desc: "제15 독립 근위 알렉산드리아 차량화 소총 여단은 러시아 지상군에서 유일한 평화유지 여단입니다."
 putin_union_prezik: "§Y연방 국가§!가 창설되었다"
 putin_union_prezik_TT: "§Y연방 국가§!가 창설되었다"
 SOV_svr: "Foreign Intelligence Service (SVR)"
 SOV_idea_nato_standards_military: "나토 표준 채택"
 demsov_supp_arm: "우리는 아르메니아를 지지했다"
 demsov_supp_aze: "우리는 아제르바이잔을 지지했다"
 SOV_union_luka: "루카셴코가 총리이다"
 SOV_union_luka_desc: "연방 국가가 수립되었지만 알렉산드르 그리고리예비치의 재능을 낭비해서는 안 됩니다. 그를 연방 국가의 총리로 승인하는 것은 현명한 선택입니다."
 russia.62.t: "예르마콥스코예 마을 인근 Mi-8 참사"
 russia.62.d: "2002년 4월, 알렉산드르 레베드 장군이 서사얀 산맥의 오이스코예 호수 인근에서 Mi-8 헬리콥터 추락 사고로 52세의 나이에 비극적으로 사망했습니다. 항공기는 악천후 속에서 전선에 충돌했고 그와 함께 7명이 목숨을 잃었습니다. 공식적으로는 승무원의 준비 부족으로 판정되었지만, 다른 이론들은 안전하지 않은 조건에서도 비행하라는 압력이나 사보타주를 시사합니다. 상충하는 보고와 상세한 항공 지도의 부재로 정확한 원인은 불분명한 채로 남아 있습니다."
 russia.62.a: "비극"
 SOV_dimon: "대러시아"
 russian_lands_tension: "러시아가 러시아 제국 영토를 반환받겠다는 의사를 발표했다"
 russia.98.t: "당내 문제"
 russia.98.d: "알렉세이 나발니의 취임과 함께 그의 정책과 야블로코당의 정책 사이의 차이가 점점 더 뚜렷해졌습니다. 나발니와 야블로코는 비슷한 강령을 공유하고 있으나, 당 지도부 내부에서는 분쟁이 계속되고 있습니다. 나발니가 탈당하여 자신의 조직을 결성할 수 있다는 소문이 돌면서 당의 향후 단결과 노선에 의문이 제기되고 있습니다."
 russia.98.o1: "나발니 대통령은 야블로코에 남을 것이다!"
 russia.98.o2: "나발니 대통령은 자신의 정당을 창당할 것이다!"
 russia.99.t: "나발니의 정당"
 russia.99.d: "나발니가 야블로코를 탈당한 후, 그의 측근들과 정부 인사들이 새 정당을 설립하기 위해 긴급 대회를 소집했습니다. 대회는 당 강령을 만장일치로 채택했으나, 당명과 상징을 둘러싸고 치열한 논쟁이 벌어졌습니다. 여러 안이 제시되었으며 세 가지 주요 후보가 논의를 주도하고 있습니다. 이 새로운 운동을 대표할 이름으로 무엇이 선택되겠습니까?"
 russia.99.o1: "§Y국민 연합§!"
 russia.99.o2: "§Y진보당§!"
 russia.99.o3: "§Y미래의 러시아§!"
 russia.100.t: "당내 분쟁"
 russia.100.d: "나발니 대통령과 야블로코 지도부 사이에는 그의 취임 이후 심각한 의견 충돌이 나타났습니다. 당은 나발니가 당 강령과 상충하는 민족주의적 견해를 가지고 있다고 비난합니다. 나발니는 공개적으로 침묵을 지키고 있으나, 그가 탈당하여 \\"NAROD\\"라는 기치 아래 새 정당을 만들 것이라는 추측이 무성합니다. 그러나 일부 징후는 그가 분열을 피하기 위해 타협을 모색하고 있음을 시사합니다. 결과는 아직 불확실합니다."
 russia.100.o1: "타협점이 찾아질 것이다."
 russia.100.o2: "새로운 민족민주당이 등장할 것이다!"
 russia.101.t: "당명 변경?"
 russia.101.d: "민주화가 진행됨에 따라 우리 당은 정체성에 대한 딜레마에 직면해 있습니다. 많은 원로 당원들은 유산의 상징으로서 당의 역사적 이름을 유지하기를 바라는 반면, 다른 이들은 더 현대적이고 민주적인 방향을 반영하기 위해 당명에서 \\"공산\\"을 빼야 한다고 주장합니다. 이 논쟁은 당 내부의 전통과 변화 사이의 긴장을 드러냅니다."
 russia.101.o1: "지금도 CPRF! 영원히 CPRF!"
 russia.101.o2: "우리는 더 이상 스탈린주의자가 아니다!"
 russia.102.t: "고르바초프의 복귀?"
 russia.102.d: "정치적 재편을 추진하는 가운데, 애초에 이러한 개혁을 시작했던 인물인 미하일 고르바초프의 부재가 절실히 느껴집니다. 고르바초프에게 이 과정을 이끌거나 영향을 미칠 두 번째 기회를 주어야 하는가 하는 의문이 제기됩니다. 그의 유산은 여전히 논란의 대상입니다."
 russia.102.o1: "반역자!"
 russia.102.o2: "고르바초프 만세!"
 SOV_the_party_TT: "집권당이 바뀝니다!"
 SOV_i_blin_idea: "국산 CPU"
 rosgvardia_wagner: "예브게니 프리고진 사망"
 SOV_wagner_rosguard_idea: "국가근위대에 편입된 바그너 PMC"
 SOV_rosguard_wagner: "바그너 PMC를 국가근위대에 편입"
 SOV_rosguard_wagner_desc: "예브게니 프리고진의 사망 후 그의 PMC는 와해되기 시작했습니다. 일부는 벨라루스에 남았고 많은 이들이 그만두었으나, 우리의 직접 통제 아래 들어올 준비가 된 이들도 있습니다. 우리는 이들을 국가근위대에 통합할 준비가 되어 있습니다."
 SOV_mvd_category: "[SOV.GetFlag]러시아 특수 기관"
 SOV_mvd_category_desc: "\n\n\n\n\n\n£SOV_desctext_mvd \n\n\n\n\n\n\n\n\nThe country's security depends not only on the armed forces. It also rests on the shoulders of state authorities such as the Ministry of Internal Affairs, along with many special services inherited from the USSR. This vast machine of agencies and departments, properly directed, will protect the country from any threat.\nSeparatism in the [SOV.GetFlag]§YRussian§! regions will begin to §Rincrease§! gradually as soon as the level of §Ystability§! falls §Rbelow 32%§!."
 SOV_grom_to_rosgvardia: "특수목적부대 §Y그롬§!을 §R로스그바르디야§!로 §Y이관§!"
 SOV_mobilise_omon: "§ROMON§! §Y동원§!"
 SOV_mobilise_sobr: "§RSOBR§! §Y동원§!"
 SOV_help_with_sheriff: "§Y러시아§!와 §R셰리프§!의 거래"
 SOV_anti_sheriff: "§Y트란스니스트리아§!를 §R셰리프§!의 영향력에서 해방"
 SOV_secret_strike: "예기치 못한 타격"
 SOV_secret_strike_desc: "세계의 관심을 분산시키는 동안, 우리의 진짜 목표는 핀란드였습니다. 과거의 분쟁에 대한 보복으로 기습 공격을 가할 때입니다. 우리 군에 영광을!"
 SOV_russian_taker: "러시아 땅의 수집가"
 SOV_russian_taker_desc: "우리의 사명은 역사적인 러시아 땅을 러시아 안의 마땅한 자리로 되돌리는 것입니다. 우리는 이 책임을 자부심과 결의로 짊어질 것입니다."
 SOV_karelian_republic: "카렐로-핀 공화국"
 SOV_karelian_republic_desc: "핀란드 일부 지역의 러시아계 소수 민족이 겪는 어려움 때문에 우리는 핀란드의 일부를 병합하여 카렐리야 공화국에 편입시킬 것입니다. 이 조치는 해당 지역에서 카렐리야인이 겪는 억압으로 정당화됩니다."
 SOV_North_Ekaterinodar: "북예카테리노다르"
 SOV_South_Ekaterinodar: "남예카테리노다르"
 russia_news.13.t: "군사 작전을 선언한 러시아!"
 russia_news.13.d: "오늘 아침 러시아 대통령은 탈나치화와 비무장화를 목표로 핀란드에서 군사 작전을 선언했습니다. 국방부는 군사 목표물만 타격하고 있다고 주장하지만, 서방 지도자들은 헬싱키에 대한 지원을 약속했습니다."
 russia_news.13.o1: "전진!"
 russia_news.13.o2: "우리는 러시아를 지지할 것이다!"
 russia_news.13.o3: "우리는 핀란드를 지지할 것이다!"
 russia_news.13.o4: "저주받을 러시아인들."
 russia_news.13.o5: "러시아 제국의 폐허 위에서 벌어지는 또 한 번의 전쟁."
 sov_final_strike.8.t: "군사 작전 선언"
 sov_final_strike.8.d: "오늘 아침 대통령은 핀란드에서의 특별 군사 작전 개시를 발표하여 많은 이들을 놀라게 했습니다. 전면 침공이 곧 시작됩니다."
 sov_final_strike.8.a: "이것은 심각한 결과를 초래할 것이다"
 sov_final_strike.9.t: "러시아에 대한 제재"
 sov_final_strike.9.a: "산업 제재를 부과한다."
 sov_final_strike.9.b: "우리는 여기에 동참하지 않겠다."
 sov_final_strike.9.d: "핀란드에서의 분쟁은 끝나야 합니다. 러시아에 대한 경제적 타격으로 이를 달성할 수 있으나, 이는 우리 경제에도 해가 될 수 있습니다. 전면적인 제재를 준비해야 할까요?"
 SOV_Restore_order_on_the_western_border: "서부 국경의 질서 회복"
 Sov_warsaw_pact.17.t: "동독 침공"
 Sov_warsaw_pact.17.d: "불과 몇 시간 전, 동독에 있던 우리 군이 공격을 받아 국경 부대가 후퇴할 수밖에 없었습니다. 세계는 이제 핵 분쟁의 벼랑 끝에 서 있습니다. 우리는 중대한 결정에 직면했습니다. 동맹을 수호하며 전 지구적 절멸의 위험을 감수할 것인가, 아니면 평화를 지키기 위해 동맹 하나를 희생할 것인가."
 Sov_warsaw_pact.17.a: "군대를 동원하라, 진군할 때다!"
 Sov_warsaw_pact.17.b: "지구 전체의 파멸을 감수할 만한 동맹은 없다"
 WP_escaped: "우리의 영향권을 이탈함"
 Sov_warsaw_pact.18.t: "지원을 거부한 소련"
 Sov_warsaw_pact.18.d: "제3차 세계 대전을 막기 위해 소련은 우리 영토에서 군대를 철수하고 있으며, 우리가 홀로 위협에 맞서도록 내버려 두고 있습니다."
 Sov_warsaw_pact.18.a: "배신자들!"
 OVD_raspalsa: "바르샤바 조약 붕괴"
 Sov_warsaw_pact.19.t: "동독에서 군대를 철수하는 소련"
 Sov_warsaw_pact.19.d: "동독의 분쟁은 세계를 전쟁의 벼랑 끝으로 몰아넣었습니다. 전면전을 피하기 위해 소련 지도부는 전군의 완전 철수를 명령했습니다. 마지막 소련 병사가 새로 선포된 독일 민주공화국을 떠나는 동안 세계는 주시하고 있습니다."
 Sov_warsaw_pact.19.a: "\\"소련군에서는 전진보다 후퇴에 더 큰 용기가 필요하다.\\""
 birth_of_eastern_germany_world_tension: "동독의 반란"
 SOV_subjects: "연방의 주제"
 SOV_subjects_desc: "We aim to introduce clearer and more structured interactions with the federal subjects. This will bring about improved economic coordination and stronger political cohesion across all regions."
 SOV_referendum_in_bashkiria: "[BSH.GetNameWithFlag]의 지위"
 SOV_referendum_in_bashkiria_desc: "우리는 헌법과 법체계를 [BSH.GetNameWithFlag]의 것과 일치시킬 것입니다. 이는 통일된 통치와 행정적 명확성을 위한 핵심 단계입니다."
 SOV_referendum_in_tatarstan: "[TAT.GetNameWithFlag]의 지위"
 SOV_referendum_in_tatarstan_desc: "우리는 헌법과 법체계를 [TAT.GetNameWithFlag]의 것과 일치시킬 것입니다. 이 문서들을 조화시키면 연방 내의 일관성이 보장됩니다."
 SOV_referendum_in_khmao: "[KHM.GetNameWithFlag]의 지위"
 SOV_referendum_in_khmao_desc: "우리는 더 나은 통합과 행정을 위해 법체계를 [KHM.GetNameWithFlag]와(과) 일치시킬 것입니다. 이러한 법적 통합은 마찰을 줄이고 지역 간 통치를 표준화하는 데 도움이 될 것입니다."
 SOV_referendum_in_crimea: "[CRM.GetNameWithFlag]의 지위"
 SOV_referendum_in_crimea_desc: "우리는 헌법과 법률을 [CRM.GetNameWithFlag]의 것과 일치시켜 연방 내 그 지위를 공고히 할 것입니다. 법적 명확성은 장기적인 안정과 정당성에 필수적입니다."
 SOV_african_corps: "아프리카 군단 창설"
 SOV_african_corps_desc: "우리는 바그너 PMC의 활동을 통해 구축한 아프리카에서의 전략적 유대를 유지하고자 합니다. 군 내에 공식 군단을 편성하면 아프리카 국가들과의 지속적인 협력이 강화될 것입니다."
 SOV_kbp_idea: "KBP 기기 설계국"
 SOV_rosoboronprom_idea: "오보론프롬"
 SOV_kalashnikov_idea: "칼라시니코프 콘체른"
 russia.15.t: "반전 시위"
 russia.15.d: "우리가 개시한 특별 작전은 전국에서 반전 시위를 불러일으켰습니다. 시위대는 유혈과 제국적 야망이 없는 러시아를 상징하는 흰색-파란색-흰색 깃발을 상징으로 채택했습니다."
 russia.15.o1: "그들의 깃발은 OMON 차량처럼 보이는군"
 russia.16.t: "돈바스의 \\"러시아의 봄\\""
 russia.16.d: "우크라이나를 휩쓰는 혼란은 도네츠크, 루한스크 및 기타 지역에서 봉기를 일으켰습니다. 모두가 통제권을 장악한 것은 아니지만, 장악한 곳에서는 우리가 그들의 노력을 지원할 기회가 있을지도 모릅니다."
 russia.16.o1: "DPR로 플레이"
 russia.16.o2: "LPR로 플레이"
 russia.16.o3: "HPR로 플레이"
 russia.16.o4: "OPR로 플레이"
 russia.16.o5: "나는 러시아인이다, 끝까지 버티겠다"
 russia.66.t: "지원을 보낸 러시아"
 russia.66.d: "러시아 정부는 인도적 지원과 군사 기술 지원을 제공했으며, 저명한 돈 카자크를 비롯한 수많은 의용군을 보내 우리를 도왔습니다."
 russia.66.a: "감사합니다, 러시아!"
 russia.67.t: "지원을 보낸 러시아"
 russia.67.d: "러시아 정부는 인도적 지원과 군사 기술 지원을 전달했으며, 체첸 의용 대대를 포함하여 러시아 본토에서 온 의용군도 함께 도착했습니다."
 russia.67.a: "감사합니다, 러시아!"
 russia.68.t: "지원을 보낸 러시아"
 russia.68.d: "러시아 정부는 우리에게 인도적 지원과 군사 기술 지원을 보냈으며, E.N.O.T. 민간 군사 기업 대원들을 비롯한 러시아 내부의 의용군도 보냈습니다."
 russia.68.a: "감사합니다, 러시아!"
