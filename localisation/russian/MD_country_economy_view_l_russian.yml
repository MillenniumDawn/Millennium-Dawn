 print_money_button_tooltip: "§YПечать денег§!\n§gГосударство переживает трудные времена и нуждается в быстром привлечении средств. Вместо того чтобы полагаться на налоги или размещение облигаций, мы можем выпустить деньги.§!\n\nЭтот приказ печатает объём государственных доходов за две недели и добавляет его в казну. Однако выпуск денег — инфляционная мера: он повышает инфляцию за текущий квартал, а повторные выпуски до квартального пересчёта инфляции усиливают этот эффект.\n\n§YСколько раз печатали деньги:§! [?printing_money_var|0Y]\n\n§YПредпосылки:§!\n[!print_money_button_click_enabled]\n§YЭффекты:§!\n[!print_money_button_click]"
