 peoples_army_4_desc: "국민군 모델은 이스라엘의 건국의 아버지이자 초대 총리인 다비드 벤구리온이 시작한 개념으로, 그는 이스라엘 국방군을 모든 유대인 하위 집단을 단일한 이스라엘 정체성으로 동화시키려는 자신의 '용광로' 프로젝트의 도구로 보았습니다. 이 학파를 신봉하는 이들은 국방군이 단순히 나라를 지키는 것 이상으로 이스라엘 사회에서 더 큰 역할을 한다고 보며, 따라서 의무 복무 개념을 이스라엘의 생존뿐 아니라 이스라엘의 민주주의와 사회의 초석으로 여깁니다. 이에 따라 직업 군대로의 전환에 관한 모든 논의는 수십 년 동안 이스라엘에서 거대한 금기였지만, 초정통파의 병역 면제를 둘러싼 논쟁은 많은 평범한 이스라엘인들에게 자신들의 병역에 대한 의문을 제기했습니다. 이 논쟁을 가로막던 벽이 무너지고 있으며, 정부와 참모부는 이 문제를 다루어야 할 것입니다. \n\n§t국민군에서 멀어질수록§! 추가적인 육군 경험치와 지휘력을 얻고, 육군 교리 및 사단 편성 연구 비용이 저렴해집니다. §6국민군에 가까워질수록§! 정치력, 전쟁 지지도, 육군 사기, 모집 가능 인구를 얻습니다."
 peoples_army_5: "국민군 - §O논쟁 중§!"
