l_french:
 hez_focus: "Priorités nationales du Hezbollah"
 HEZ_Party_of_God: "§YFête de Dieu§!"
 HEZ_Party_of_God_desc: "Nous, les combattants du Levant, ceux qui se sont sacrifiés sur le chemin de la libération du Liban et de l'Asie occidentale, sommes le parti de Dieu, le Hezbollah. Aujourd'hui, notre insurrection se trouve dans une situation très importante. Nous sommes dans une situation qui peut changer notre avenir et celui du Liban, voire de toute la région... et le moment du choix est proche. Le destin de la Résistance nous attend..."
 HEZ_Our_own_state: "Notre propre État"
 HEZ_Our_own_state_desc: "Bien sûr, défendre le Liban, ou tout autre pays musulman de la région, est notre priorité, mais nous ne pouvons pas nier que beaucoup de ces pays musulmans, y compris le Liban, ne peuvent pas nous soutenir ou n'ont aucune envie de nous soutenir. Et de ce fait, le moment est venu d'établir notre propre État et notre propre gouvernement. Ce ne sera pas facile, mais nos frères nous soutiendront dans cette tâche."
 HEZ_Conquer_Lebanon: "Conquérir le Liban"
 HEZ_Conquer_Lebanon_desc: "Le faux gouvernement de Beyrouth est resté trop longtemps. Nous les avons respectés et aidés, mais leur réponse à notre générosité a été la coopération avec les sionistes et les Saoudiens. C'est fini ! Nous mobiliserons nos forces et appellerons nos frères à une guerre de libération, la libération du Liban lui-même."
 HEZ_Recruiting_Soldiers: "Recrutement de soldats"
 HEZ_Recruiting_Soldiers_desc: "Something that many can not understand is that our forces aren't just located in south Lebanon, but are present in all of Lebanon itself, and even other countries in west Asia, such as Iraq and Syria. Hence, we shall begin mobilizing our forces in Lebanon and the region. The victory lies ahead... "
 HEZ_Gathering_Equipment: "Rassembler l'équipement"
 HEZ_Gathering_Equipment_desc: "Tout comme nos effectifs dans la région, nous disposons de nombreuses bases de matériel clandestines au Liban et en Asie occidentale. Nous avons du matériel dans le sud du Liban et nous pouvons en acquérir beaucoup plus grâce à nos contacts en Irak et en Syrie, sans oublier bien sûr l'aide de nos frères de Téhéran."
 HEZ_Rightful_Clay: "Argile légitime"
 HEZ_Rightful_Clay_desc: "Autrefois, après la guerre civile au Liban et notre succès, nous pensions qu'en établissant un gouvernement politique tolérant nous pourrions assurer la sécurité du Liban contre toute influence ou menace d'attaque occidentale et sioniste, mais il semble que l'influence des chiens de l'Occident se soit accrue. Et maintenant, il est temps de reconquérir le Liban, avec quelques changements de politique, bien sûr..."
 HEZ_Defectors_of_the_LAF: "Les transfuges des Forces armées libanaises"
 HEZ_Defectors_of_the_LAF_desc: "Il semble que les nouvelles réformes à Beyrouth ne plaisent pas à beaucoup de militaires libanais et que beaucoup d'autres désertent les forces armées libanaises. Avec la domination de notre influence au Liban, nous pouvons acquérir beaucoup plus de progrès dans la préparation de la libération du Liban. Bien sûr, nous devons choisir judicieusement nos méthodes de domination dans le pays..."
 HEZ_defector_resources_based_on_influence_TT: "Les ressources supplémentaires de §Ydefectors§! seront basées sur notre influence sur le Liban :\n§Y5-10%§!: 1000 Main d'oeuvre + 1000 Petites armes\n§Y11-30%§!: 2000 Main d'oeuvre + 1000 Petites armes + 1000 C&C\n§Y31-50%§!:3000 Main d'oeuvre + 1000 Petites armes + 1000 C&C + 100 APC + 100 Véhicules utilitaires\n§Y51-100%§!: 5000 Main d'oeuvre + 1000 Petites armes + 1000 C&C + 200 APC + 300 Véhicules utilitaires + 100 MBT"
 HEZ_War_for_Lebanon: "Guerre pour le Liban"
 HEZ_War_for_Lebanon_desc: "Tout est prêt, Beyrouth est dans le chaos, les forces armées libanaises sont dans leur état le plus faible depuis la guerre civile libanaise, et nous avons gagné suffisamment de main-d'œuvre et d'équipement pour la guerre de libération. Et en bref, le gouvernement libanais est en train de mourir, et nous mettrons fin à ses souffrances par la volonté de la Résistance, §R Le chemin de Qods passe par Beyrouth...§!"
 HEZ_Neutralizing_the_Threat: "Guerre avec Israël"
 HEZ_Neutralizing_the_Threat_desc: "Des montagnes du Cachemire aux déserts du Sahara, Tout vrai musulman espérait ce jour, Tout vrai Arabe espérait ce jour, Et tout vrai combattant de la liberté espérait ce jour... Le jour où nous effacerons la honte de la guerre des Six Jours, Le jour où nous effacerons la honte de la guerre du Kippour, Le jour où le peuple de Palestine serait libre... Oui, le temps est venu de la libération de la Terre Sainte ; le temps est venu de terminer la dernière croisade des païens et des oppresseurs. §GToujours, c'est le Jour de la Libération...§!"
 HEZ_iranian_aid_changes_TT: "§GAugmente les revenus supplémentaires§! provenant de §Yl’aide iranienne§!, et elle §RNE§! PLUS sera supprimée."
 HEZ_Co_existence: "Coexistence"
 HEZ_Co_existence_desc: "De nombreuses années se sont écoulées depuis l'époque du chaos et de la destruction au Liban, l'époque que nous appelons « la guerre civile libanaise », rien de ce qui s'y est passé n'était civil... mais malgré toute la douleur et la souffrance que notre peuple a endurées à cette époque, nous avons survécu et nous avons réussi à libérer le Liban des sales marionnettes sionistes. Et maintenant, un gouvernement unitaire et tolérant, qui est malheureusement influencé par le gouvernement syrien, est à Beyrouth, et il est impatient de devenir indépendant s'il trouve la meilleure opportunité pour le faire. Nous l'aiderons et coopérerons avec lui pour atteindre cet objectif. Pour un Liban indépendant !"
 HEZ_Influence_Lebanese_politics: "Influencer la politique libanaise"
 HEZ_Influence_Lebanese_politics_desc: "En rassemblant des faveurs et en renforçant notre domination sur le Parlement libanais, nous pouvons faire un autre pas important vers l’unification du Liban, et sûrement, le Liban sera aux Libanais, pas à quelqu’un d’autre... Le Liban sera plus puissant qu’il ne l’a jamais été dans son histoire..."
 HEZ_Skirmish_Raids: "Raids d'escarmouche"
 HEZ_Skirmish_Raids_desc: "Les forces armées libanaises, branche militaire pas si loyale du « gouvernement » libanais, sont dans un très mauvais état à cause des réformes radicales libérales et pro-occidentales du « gouvernement » de Beyrouth ; elles sont en train de devenir politisées et cliquées par les partisans et les opposants du « gouvernement central », nous pouvons utiliser cela comme un avantage pour affaiblir les forces armées libanaises autant que nous le pouvons avec les guerres frontalières."
 HEZ_Turning_South: "Tourner vers le sud"
 HEZ_Turning_South_desc: "Avec la libération du Liban, notre pouvoir est devenu ultime ; nous ne contrôlons pas une petite province, mais un pays qui peut être fort et résilient face à lui-même et à ses alliés. Et le temps est venu de tuer les oppresseurs de Philistin. Notre priorité est désormais très claire : §RLa préparation de la libération de Philistin§!."
 HEZ_Increased_Iranian_Support: "Soutien accru à l’Iran"
 HEZ_Increased_Iranian_Support_desc: "La République islamique d'Iran, l'un de nos principaux partenaires au sein de l'Axe de la Résistance, peut nous aider dans nos missions au Liban, au Levant et même au Moyen-Orient. Grâce à l'implication iranienne, nous pouvons améliorer nos revenus de plusieurs manières, ce qui signifie également que nous pouvons mettre en œuvre nos plans pour l'indépendance du Liban plus efficacement. Mais bien sûr... le prix à payer peut aussi être élevé pour notre système politique..."
 HEZ_lebanese_aid_income_based_on_influence_TT: "Additional Income from §YLebanese Aid§! will be based on Lebanese influence in Hezbollah:\n§Y1-20%§!: §G+0.25 Billion§! Weekly\n§Y21-50%§!: §G+1.00 Billion§! Weekly\n§Y51-100%§!: §G+1.00 Billion§! Weekly"
 HEZ_International_Hezbollah: "Hezbollah international"
 HEZ_International_Hezbollah_desc: "Le Hezbollah n'a aucun sens sans sa mission de libération dans le monde islamique. Quel est le but du Hezbollah irakien, d'Hosseinioun ou de tout autre groupe de l'Axe de la Résistance s'ils n'essaient pas de commencer leur Résistance contre le gouvernement tyrannique de leur pays ou les envahisseurs impérialistes dans leurs pays ? Nous devons aider nos frères dans toutes les parties du monde. Et donc, nous allons commencer..."
 HEZ_African_Hezbollah: "Opérations en Afrique"
 HEZ_African_Hezbollah_desc: "De nombreux musulmans en Afrique (notamment au Nigéria), grâce à l'Ayatollah Zakzaki, commencent à trouver la vérité et à se convertir au chiisme. Cela peut être une très bonne occasion d'aider Zakzaki dans sa mission et aussi de faire connaître la doctrine de la résistance à nos nouveaux frères."
 HEZ_Latin_American_Hezbollah: "Opérations en Amérique du Sud"
 HEZ_Latin_American_Hezbollah_desc: "Nous sommes actifs en Amérique latine depuis une décennie et notre objectif principal dans cette région était d'éliminer les principales figures sionistes et de saboter l'influence sioniste dans les pays d'Amérique latine comme l'Argentine. Mais maintenant, nous ne devons plus nous contenter de combattre les sionistes, non. Maintenant, nous devons envoyer un message aux impérialistes américains... Et ils ne verront pas ce qui les attend..."
 HEZ_North_American_Hezbollah: "Opérations en Amérique du Nord"
 HEZ_North_American_Hezbollah_desc: "Après notre succès dans l'infiltration des forces américaines de la DEA et la corruption et la dégénérescence croissantes contre les porcs capitalistes, il est maintenant temps d'appeler nos frères en Amérique à... connaître la vérité contre le grand Satan..."
 HEZ_Hezbollah_in_the_Middle_east: "Opérations en Asie du Sud-Ouest"
 HEZ_Hezbollah_in_the_Middle_east_desc: "L'Asie du Sud-Ouest, le « Moyen-Orient » comme l'appellent les Occidentaux, est la base principale de nos opérations à travers le monde avec les récents changements survenus dans la région et la mobilisation des forces américaines ; il faut s'y préparer. Le temps est venu pour le Hezbollah de montrer sa véritable puissance face aux impérialistes américains."
 HEZ_An_Inevitable_failure: "Un échec inévitable"
 HEZ_An_Inevitable_failure_desc: "Bashar Assad was never as capable as his brother, Basil, or even his father, Hafiz. And well, no wonder why a civil war started because of an Eye Doctor president... \nBut anyhow, the interests of the Resistance are endangered because of the presence of Wahhabi and Western forces in Syria. We have to act quickly because if we don't, the next civil war will happen in Lebanon and Iran..."
 HEZ_An_Inevitable_failure_TT: "§G-§! Débloque les décisions suivantes : §YEnvoyer des équipements militaires en Syrie§!, §YForces de volontaires pour la Syrie§! qui seront disponibles pendant la guerre civile syrienne."
 HEZ_Our_Brothers_in_Sanaa_and_Baghdad: "Nos frères à Sanaa et à Bagdad"
 HEZ_Our_Brothers_in_Sanaa_and_Baghdad_desc: "Many things are changing throughout the region, and our agents have reported massive American mobilization of the American Forces near the Iraqi borders, and also, we have heard the news of Saudi proxies persecuting the Shi'a population in Yemen and our Houthi brothers are getting ready for a new struggle... The world is changing, and so shall we. But for now, we only have to wait for the beginning of the end..."
 HEZ_Our_Brothers_in_Sanaa_and_Baghdad_TT: "§G-§! Déverrouille la décision suivante : §Y[IRQ.GetNameWithFlag] : Nos fonds pour le peuple irakien§!, §Y[IRQ.GetNameWithFlag] : Des armes pour la résistance§!\n"
 HEZ_Our_Brothers_in_Sanaa_and_Baghdad_TT2: "§G-§! Débloque la décision suivante : §Y[YEM.GetNameWithFlag] : Organiser des raids au Yémen§!, §Y[YEM.GetNameWithFlag] : Des armes pour nos frères§!"
 HEZ_Badr_in_the_shadows_TT: "§G-§! Déverrouille la décision suivante : §Y[IRQ.GetNameWithFlag] : Financer la propagande pour Badr§!"
 HEZ_volunteers_for_iraq_TT: "§G-§! Déverrouille la décision suivante : §Y[IRQ.GetNameWithFlag] : Volontaires pour l'Irak§!"
 HEZ_shia_advisors_for_iraq_TT: "§G-§! Déverrouille la décision suivante : §Y[IRQ.GetNameWithFlag] : Conseillers chiites pour l'Irak§!"
 HEZ_fund_houthi_propaganda_TT: "§G-§! Débloque la décision suivante : §Y[YEM.GetNameWithFlag] : Financer la propagande houthiste§!"
 HEZ_infrastructure_in_saadaa_TT: "§G-§! Unlocks the following decision: §Y[YEM.GetNameWithFlag]: Infrastructure in Saada§!"
 HEZ_fund_protests_against_wahabbis_in_sanaa_TT: "§G-§! Débloque la décision suivante : §Y[YEM.GetNameWithFlag] : Financer les manifestations contre les wahhabites à Sanaa§!"
 HEZ_sabotage_wahhabi_schools_TT: "§G-§! Déverrouille la décision suivante : §Y[YEM.GetNameWithFlag] : Saboter les écoles et les mosquées wahhabites§!"
 rushdie_decision_unlock_TT: "§G-§! Débloque la décision suivante : §Y[USA.GetNameWithFlag] : Assassiner Salman Rushdie§!"
 rushdie_dies_tooltip: "§RLe sort de Rushdie va être décidé. Maintenant.§! \nPlus vos §Yrenseignements civils§! sur les États-Unis sont nombreux, plus grandes sont nos chances de succès."
 rushdie_dies_tooltip_nodlc: "§RLe sort de Rushdie va être décidé. Maintenant.§! \nPlus votre §YInfluence§! sera grande aux États-Unis, plus grandes seront nos chances de succès."
 rushdie_dies2_tooltip: "§YL'homme qui se cachait est désormais libéré des conséquences de ses péchés...§!"
 rushdie_survives_tooltip: "§YLe bâtard vit, mais au prix de sa vie...§!"
 HEZ_The_End: "§GLa fin§!"
 HEZ_The_End_desc: "Après de nombreux sacrifices et investissements dans toute l’Asie du Sud-Ouest, nous avons maintenant la meilleure occasion de porter un coup sévère à la bête saoudienne. Ces opportunistes wahhabites devraient comprendre que leur argent ne vaut rien quand nous existons. Pourquoi ? Parce que si nous supprimons la « sécurité » de la capitale saoudienne, personne ne pensera plus jamais à « investir » dans un endroit qui sera bombardé chaque semaine par le Hezbollah et ses alliés. Des milliards de dollars vont disparaître, MAINTENANT !"
 HEZ_and_Steal_the_Heathens: "§YVoler les païens§!"
 HEZ_and_Steal_the_Heathens_desc: "Avec le financement des chiens saoudiens, des racailles wahhabites se multiplient au Yémen, pas sous notre surveillance, bien sûr. Nous demanderons à nos frères houthis de s'occuper de certaines affaires au Yémen... Et cela va très mal finir pour l'Arabie saoudite..."
 HEZ_Steal_the_Bastards: "§3Voler les bâtards§!"
 HEZ_Steal_the_Bastards_desc: "Même si les Américains ont conquis l'Irak, cela ne signifie pas qu'ils vont le garder pour eux pour toujours... C'est pourquoi nous attaquerons tout soldat américain, homme ou femme, partout en Irak. Et le début de nos attaques devrait être suffisamment important pour entraîner les garnisons américaines dans le chaos. Elles connaîtront la peur, et nous leur apprendrons à avoir peur..."
 HEZ_Invest_in_Saada: "Investir à Saada"
 HEZ_Invest_in_Saada_desc: "La province de Saada étant le siège d'Ansarallah, nous allons l'agrandir et y investir pour la rendre suffisamment performante pour servir Ansarallah et également le Hezbollah."
 HEZ_Houthi_brothers: "Frères Houthis"
 HEZ_Houthi_brothers_desc: "The Shabab al Momin, or Ansarallah of Yemen, is a political and some basis, an Armed organization that supports the ideas of the Axis of Resistance and also is very favored by Hezbollah. With the continuation of Shi'a minority persecution in Yemen and also the growth of the Wahhabi menace in Yemen, this organization is becoming more dissatisfied with the Yemeni government, and hence, it seems this rivalry between the organization and the central government can be a good opportunity for us to spread the ideas of the Resistance. And well, we shall begin."
 HEZ_Organize_Shii_Forces: "Organiser les forces chiites"
 HEZ_Organize_Shii_Forces_desc: "Aujourd'hui, avec la chute du gouvernement de Saddam et le chaos du nouveau gouvernement irakien, le moment est venu pour nous d'intervenir plus... physiquement en Irak. En envoyant nos conseillers compétents auprès de l'armée Badr ainsi que d'autres milices chiites, nous pouvons orchestrer une phase d'attaque contre les occupants américains en Irak."
 requirement_hez: "A §YÉcoles Militaires d'Officiers§! ou supérieur"
 HEZ_Badr_in_the_shadows: "Badr dans l'ombre"
 HEZ_Badr_in_the_shadows_desc: "The Badr Army, one of the oldest Shi'ite military and political organizations of Iraq, is now in dire need of help from us and our Iranian brothers. Now, with huge tensions between Saddam and the United States in Iraq, we actually can have a very good opportunity to bolster the influence of Shi'a parties, not just the Badr Army, throughout Iraq and beyond!"
 HEZ_For_Allah_Islam_and_Zeinabyah: "§RPour Allah, l'Islam et Zeinabyah !§!"
 HEZ_For_Allah_Islam_and_Zeinabyah_desc: "Nous attaquerons nos ennemis avec le drapeau de l'Imam Hussein ! Nous devons aller protéger le sanctuaire de Zaynab, même si nos ennemis nous coupent la tête... §RNous devons y aller aussi... juste pour nous sacrifier pour la protection des Ahlul Bayt...§!"
 HEZ_Negotiations_for_Intervention: "Négociations pour une intervention"
 HEZ_Negotiations_for_Intervention_desc: "Nous ne pouvons pas et ne tolérerons pas la menace wahhabite ! Nous mobiliserons toutes nos forces pour combattre la bête wahhabite ! Nous ne montrerons aucune pitié envers les tyrans wahhabites ! Nous utiliserons toute notre puissance diplomatique et militaire pour détruire le faux État islamique. Nous mettrons fin à cette menace une fois pour toutes..."
 HEZ_call_to_arms: "Appeler aux armes"
 HEZ_call_to_arms_desc: "Nous devons améliorer les relations avec l’Iran et envoyer des conseillers en République arabe syrienne."
 HEZ_call_to_arms_TT: "§G-§! Débloque les décisions suivantes : §Y[SYR.GetNameWithFlag] : Nos conseillers à Damas§!, §Y[PER.GetNameWithFlag] : Armes d'Iran§! qui seront disponibles pendant la guerre civile syrienne."
 HEZ_Formalize_the_first_Shia_Institutions_in_Africa: "Formaliser les premières institutions chiites en Afrique"
 HEZ_Formalize_the_first_Shia_Institutions_in_Africa_desc: "Maintenant que l'Axe de la Résistance est entré dans le champ politique du Nigeria et de l'Afrique, il est temps d'investir massivement pour attirer la population musulmane du Nigeria et, à terme, de l'Afrique, pour la convertir et aussi pour promouvoir l'islam chiite et la doctrine de la Résistance. Grâce à nos investissements et aussi à l'utilité de notre cher frère, l'Ayatollah Zakzaki, nous pouvons maintenant concrétiser nos plans."
 HEZ_Help_Zakzaki_and_his_companions: "Aidez Zakzaki et ses compagnons"
 HEZ_Help_Zakzaki_and_his_companions_desc: "En investissant un soutien politique considérable envers Zakzaki et son parti, l’idéologie du chiisme islamique sera considérablement renforcée et servira sûrement aussi nos intérêts."
 HEZ_Establish_Secret_Bases_in_Nigeria: "Établir des bases secrètes au Nigéria"
 HEZ_Establish_Secret_Bases_in_Nigeria_desc: "Aujourd'hui, grâce à la consolidation et à l'influence des institutions culturelles chiites au Nigeria, nous avons également rassemblé un soutien considérable pour la Résistance dans le pays. Grâce à ce soutien, nous entrerons dans une nouvelle phase d'action dans tout le Nigeria et même en Afrique..."
 HEZ_Ayatollah_ZakZaki: "Ayatollah Zakzaki"
 HEZ_Ayatollah_ZakZaki_desc: "L'ayatollah Zakzaki, un khomeiniste chiite nigérian très convaincu, et également le leader d'un parti politique chiite très potentiel au Nigeria, peut être notre meilleure chance d'entrer sur le terrain de jeu du continent africain, en utilisant le pouvoir doux et doux de la propagande et des stratagèmes politiques, nous pouvons également affirmer notre domination dans les parties les plus importantes de l'Afrique..."
 Zakzaki_tt: "§YIbrahim Zakzaky§! sera le leader des §GRévolutionnaires chiites de la ligne dure§! au §YNigeria§!."
 HEZ_A_Remembrance_to_an_old_friend: "Un souvenir à un vieil ami..."
 HEZ_A_Remembrance_to_an_old_friend_desc: "Bien que nous ne soyons pas vraiment actifs en Afrique de manière très opérationnelle, nous connaissons certaines institutions dans de nombreux pays africains qui peuvent servir nos objectifs et qui sont en fait alignées sur nos idéaux, même si certaines d'entre elles ne sont même pas considérées comme des musulmans chiites. Mais au Nigéria, il semble que ce soit différent. Le Mouvement chiite du Nigéria, dirigé par l'Ayatollah Zakzaki, peut être un très bon candidat pour que nos opérateurs et agents soient davantage impliqués dans des opérations de sabotage que dans de simples opérations de propagande..."
 HEZ_From_Caracasto_Washington: "§RDe Caracas à Washington!§!"
 HEZ_From_Caracasto_Washington_desc: "§RNotre mission est terminée sur cette terre maudite. Le temps est venu de faire du bastion de la liberté le bastion du Chaos.§!"
 HEZ_Our_Gift_To_the_Great_Satan: "Un cadeau au grand Satan"
 HEZ_Our_Gift_To_the_Great_Satan_desc: "§RL'Amérique devrait se briser, ce qui serait déjà assez grave pour son propre bien...§!"
 HEZ_Our_Gift_To_the_Great_Satan_TT: "§G-§! Débloque la décision suivante : §YDéstabiliser l'Amérique§!"
 HEZ_American_Infiltration: "Infiltration américaine"
 HEZ_American_Infiltration_desc: "Nous devons agir contre les États-Unis."
 HEZ_New_Contracts_with_Drug_Cartels: "Nouveaux contrats avec les cartels de la drogue"
 HEZ_New_Contracts_with_Drug_Cartels_desc: "Divide and conquer! It seems this saying works on the relations of the drug cartels and the governments of Latin America. By letting chaos prosper throughout Argentina and, later, Latin America, we can do as we please in the continent, and what we now get pleased to do is damaging the great Satan."
 HEZ_New_Contracts_with_Drug_Cartels_TT: "§G-§! Débloque la décision suivante : §YTraite avec les cartels de la drogue§!"
 HEZ_Our_Era: "Notre époque"
 HEZ_Our_Era_desc: "Everything in Argentina is secured, and we now have a strong dominance over the country! Or at least strong enough to expand our base of operations other than just one country in the continent. The clock is ticking, §Rand we should prepare for our last strike against the United States...§!"
 HEZ_Memory_of_AMIA: "Souvenirs de l'AMIA"
 HEZ_Memory_of_AMIA_desc: "AMIA, one of the Jewish community centers in Argentina that was sabotaged by our agents in Argentina, was one of our operations in regards to decreasing and also eliminating the Zionist influence in the Latin American countries. Now, with us willing to start a new phase in South America, it seems that we, again, need to fight the Zionist influence throughout the continent, and again, it starts with Argentina... "
 HEZ_Anti_Zionist_Parties: "Les partis antisionistes"
 HEZ_Anti_Zionist_Parties_desc: "Bien que nous puissions également détruire la menace sioniste par d’autres moyens, l’une des meilleures solutions consiste à rassembler le soutien antisioniste de la population locale d’Argentine (et de tout le continent). Alors, avec cela, commençons une campagne douce et amicale contre les sionistes…"
 HEZ_Anti_Zionist_Parties_TT: "§G-§! Débloque la décision suivante : §YSoutenir les partis antisionistes§!"
 HEZ_how_little_they_know: "§RComme ils en savent peu...§!"
 HEZ_how_little_they_know_desc: "§REt maintenant, les impérialistes nous craindront aussi là où ils ne nous attendent pas...§!"
 HEZ_Creating_opportunities: "Créer des opportunités"
 HEZ_Creating_opportunities_desc: "With us becoming something more than just a paramilitary organization, we have to improve the ways of trade and transporting in our newfound country because we have to live on, and we have to provide a good life for our population, don't we? A naval port would suit our need in trading and even make us a major \"country\" for having access to both the Mediterranean Sea and the region of the Levant. And an International Airport will suit our needs in, well, stockpiling our Fighters in it and also, some transportal and economic benefits."
 HEZ_International_recognization: "Reconnaissance internationale"
 HEZ_International_recognization_desc: "Though we always will be Loyal to Iran and any other Shi'a country, we now also want to enter the International stage; why should we fight and die when we can benefit many things from talking and negotiating? After all, some of our brothers in Tehran believe in this logic, too; why shouldn't we believe in it?"
 HEZ_Seeking_Allies: "À la recherche d'alliés"
 HEZ_Seeking_Allies_desc: "Maintenant que nous avons consolidé notre position au sein de la communauté internationale, nous devons « négocier », comme nous l’avons dit auparavant. Pourquoi ? Personne ne nie une bonne opportunité d’investissement au Levant, surtout si elle concerne le Liban. Nous devons atteindre des nations au-delà de l’Iran ou simplement des pays chiites. Des milliards de personnes doivent s’épanouir dans la nouvelle Terre de Dieu…"
 HEZ_Building_of_our_nation: "La construction de notre nation"
 HEZ_Building_of_our_nation_desc: "Même si nous comptons beaucoup sur les investissements internationaux de toutes les grandes puissances économiques du monde, nous devons nous assurer au moins d'avoir une industrie nationale pour nous-mêmes ; après tout, nous n'allons pas détruire toute notre politique chiite, non. Nous comprenons simplement qu'il existe des alternatives pour lutter contre le mal..."
 HEZ_Improved_living: "Une vie améliorée"
 HEZ_Improved_living_desc: "Aujourd'hui, nous voulons construire une nation nouvelle et même singulière dans le monde. Il nous faut donc renforcer ses racines. En améliorant les infrastructures de notre pays et en développant les services de communication, nous pouvons garantir à la fois la satisfaction de notre population et une bonne chance d'obtenir des primes d'investissement ou de construction dans notre pays."
 HEZ_Recruiting_Loyalists: "Recrutement de loyalistes"
 HEZ_Recruiting_Loyalists_desc: "Bien que l'économie et la réputation internationale soient très importantes pour une nation, sa sécurité nationale l'est aussi. Et même, elle l'est encore plus pour nous. Bien que nous ayons une bonne armée par rapport à notre propre pays, nous ne pouvons pas compter uniquement sur elle. Nous avons encore un long chemin à parcourir pour atteindre nos objectifs militaires..."
 HEZ_Land_of_God: "Terre de Dieu"
 HEZ_Land_of_God_desc: "Tout est prêt, nous ne dépendons plus de personne. Non ! Nous ne sommes plus seulement « le parti de Dieu » ! Nous sommes en train d’établir un pays, un État, entièrement consacré à Dieu, §Gnous sommes en train d’établir le « Milk-ullah », la terre de Dieu§!"
 HEZ_Hezbollah_and_the_LAF: "Le Hezbollah et les Forces armées libanaises"
 HEZ_Hezbollah_and_the_LAF_desc: "Avec la coopération des forces armées libanaises avec le Hezbollah, nous pouvons faire un grand pas en avant pour influencer et favoriser le gouvernement de Beyrouth. Nous partagerons les tactiques que nous avons apprises pendant la guerre civile et, si Dieu le veut, ils partageront avec nous les technologies acquises à l'étranger..."
 HEZ_Lebanese_Support: "Soutien libanais"
 HEZ_Lebanese_Support_desc: "En temps de crise, nous avons favorisé de nombreux Libanais sur la scène politique libanaise et nous allons donc utiliser ces faveurs. Bien entendu, nous n’oublions pas que, après tout, nous avons également une influence considérable sur la sécurité et la politique libanaises."
 HEZ_iranian_aid_income_based_on_influence_TT: "Les revenus supplémentaires de l’§Yaide iranienne§! seront basés sur l’influence iranienne au sein du Hezbollah :\n§Y1-20%§!: §G+0.25 milliard§! Hebdomadaire\n§Y21-50%§!: §G+0.50 milliard§! Hebdomadaire\n§Y51-100%§!: §G+1.00 milliard§! Hebdomadaire"
 HEZ_Lobbying_Public_Support: "Lobbying pour obtenir le soutien du public"
 HEZ_Lobbying_Public_Support_desc: "Maintenant que nous avons consolidé notre autorité politique dans tout le Liban, le moment est venu de consolider également notre autorité sur le peuple libanais. En appelant nos chers partisans chiites et d’autres groupes minoritaires et même des partis politiques, nous pouvons montrer la popularité et la renommée du Hezbollah au Liban. Ce faisant, une alarme retentira pour les marionnettes occidentales à Beyrouth. Une alarme qui leur montrera ce qui va leur arriver et, §Yils comprendront ce qui les attend!§!"
 HEZ_Request_Election_funds: "Demande de fonds pour les élections"
 HEZ_Request_Election_funds_desc: "Bien que nous fassions beaucoup pour consolider notre position, nous avons toujours besoin d’un soutien pour notre cause, et comme toujours, ce soutien est la République islamique d’Iran. Ils nous aideront certainement et nous soutiendront dans l’unification du Liban. Pourquoi ? Parce que si le Liban s’unit sous la bannière du Hezbollah, §Yun État dans l’État devient un pays pour lui-même§!"
 HEZ_Shias_Lebanon: "Le Liban aux Libanais !"
 HEZ_Shias_Lebanon_desc: "Tout est prêt. Nous avons fait tout ce que nous pouvions, et maintenant, il est temps d'obtenir notre récompense. Le Liban sera uni et s'échappera complètement des mains de toute puissance impérialiste. §YAvec le Liban sécurisé, la Résistance fera un grand pas vers la guerre finale, le grand procès des infidèles et la libération des opprimés.§!"
 HEZ_maintain_status_quo: "Maintenir le statu quo"
 HEZ_maintain_status_quo_desc: "Bien que notre objectif initial ait été d’unifier le Liban sous la bannière du Hezbollah, il semble que cela ne soit pas nécessaire. Nous avons dominé la politique libanaise et il n’est pas nécessaire de prendre le contrôle de l’ensemble du Liban par nous-mêmes. Au lieu de cela, nous superviserons les activités politiques qui se déroulent dans tout le pays. De cette façon, il n’y a pas besoin de tant de coups bas politiques au sein de notre organisation alors que notre domination politique est assurée au sein du gouvernement libanais, et nous pouvons même avoir une bonne image publique en laissant un gouvernement « démocratique » mener des activités juste à côté de nous. De cette façon, nous gardons également notre attention davantage sur notre propre population chiite et sur les intérêts de l’Axe de la Résistance. §YMais malgré tout cela, notre main ferme au Liban restera sur le Liban pour toujours !§!"
 HEZ_Industry: "Le Hezbollah et l'industrie"
 HEZ_Industry_desc: "Le secteur industriel est de la plus haute importance pour la pérennité du Hezbollah."
 HEZ_Hezbollahs_independent_industry: "L'industrie indépendante du Hezbollah"
 HEZ_Hezbollahs_independent_industry_desc: "Nous ne pouvons pas laisser notre nation se laisser dicter sa conduite par d'autres nations. C'est pourquoi nous devons créer nous-mêmes une nouvelle « doctrine » économique..."
 HEZ_New_Backers: "Nouveaux contributeurs"
 HEZ_New_Backers_desc: "Avec la formation de notre nouvel État, certains investisseurs étrangers s'intéressent à notre... état actuel des affaires économiques..."
 HEZ_Puppet_state_of_Iran: "État fantoche d'Iran"
 HEZ_Puppet_state_of_Iran_desc: "Les Iraniens ont accepté de financer notre industrie au prix d’un coût politique majeur."
 HEZ_The_Lira: "La Lire"
 HEZ_The_Lira_desc: "Nous devons évaluer la manière dont nous devons aborder la livre, notre monnaie."
 HEZ_Free_from_USD: "Libérez la livre par rapport au dollar"
 HEZ_Free_from_USD_desc: "La livre est trop instable. Nous devons la libérer du dollar américain."
 HEZ_Keep_it_locked: "Gardez-le verrouillé"
 HEZ_Keep_it_locked_desc: "La valeur de la livre est stable et il n’y a rien à redire."
 HEZ_Preparing_Iranian_businesses: "Préparation des entreprises iraniennes"
 HEZ_Preparing_Iranian_businesses_desc: "Eh bien... nous devons le faire, après tout..."
 HEZ_Iranian_Offices: "Bureaux iraniens"
 HEZ_Iranian_Offices_desc: "Nous devons créer de nouvelles infrastructures pour le secteur des bureaux."
 HEZ_Iranian_Construction_tools: "Outils de construction iraniens"
 HEZ_Iranian_Construction_tools_desc: "Nous devons construire de nouvelles usines pour produire des biens."
 HEZ_Iranian_Roads: "Les routes iraniennes"
 HEZ_Iranian_Roads_desc: "Nous devons améliorer nos routes, ce qui permettra de produire des marchandises à un rythme plus rapide."
 HEZ_iranian_business: "Entreprises iraniennes"
 HEZ_Iranian_Business_Stimulus: "Mesures de relance économique en Iran"
 HEZ_Iranian_Business_Stimulus_desc: "Au détriment de notre autonomie, nous pouvons permettre aux Iraniens d’accorder des stimulants à nos entreprises."
 HEZ_Iranian_Business_Stimulus_modifier_TT: "§YEntreprises iraniennes§! qui accordent §G+0,200$§! milliards chaque semaine."
 HEZ_Iranian_Business_Stimulus_autonomy_TT: "Mesures de relance économique en Iran"
 HEZ_Iranian_Supported_Education: "L'éducation soutenue par l'Iran"
 HEZ_Iranian_Supported_Education_desc: "Les Iraniens ont proposé d’éduquer nos travailleurs au détriment de notre autonomie."
 HEZ_Iranian_Supported_Education_TT: "L'éducation soutenue par l'Iran"
 HEZ_peoples_support: "\nCe focus combinera tous les esprits nationaux de cette branche, ce qui augmentera les valeurs suivantes :\n§G+5 %§! de §Ysoutien de guerre§!\n§G+5 %§! de §Ystabilité§!\n§G+0,10§! de §Ygain quotidien de pouvoir politique§!"
 HEZ_peoples_support_for_hezbollah_1: "Le soutien du peuple au Hezbollah"
 HEZ_al_manar: "Al-Manar"
 HEZ_blue_shirt_kids: "Chemise bleue pour enfants"
 HEZ_our_cartels_in_south_america: "Nos cartels en Amérique du Sud"
 HEZ_unknown_cartel_operations: "Opérations de cartel inconnues"
 HEZ_council_of_12: "Conseil des 12"
 HEZ_hezbollah_armed_forces: "Forces armées du Hezbollah"
 HEZ_iranian_missile_aid: "Aide iranienne en matière de missiles"
 HEZ_public_support: "Soutien public"
 HEZ_volunteers_of_all_beliefs: "Des bénévoles de toutes croyances"
 HEZ_lujnat_imdad_al_khomeini: "Lujnat Imdad al Khomeini"
 HEZ_Vilayat-e-faqih: "Vilayat-e Faqih"
 HEZ_Vilayat-e-faqih_desc: "La pensée de Vilayat-e Faqih a été promue par l’ancien chef de la Résistance et de la Révolution islamique, l’Ayatollah Ruhollah Khomeini, et elle concerne la combinaison des idées de démocratie avec les idées de l’Islam et l’instauration d’un gouvernement islamique. Le Hezbollah existe pour promouvoir cette idée aux côtés de l’Iran dans n’importe quelle région de la région ou même du monde, nous devons également promouvoir et enseigner cette idée à nos partisans et à la jeunesse."
 HEZ_The_Blue_Shirt_Kids: "Organisation des Scouts de l'Imam Mahdi"
 HEZ_The_Blue_Shirt_Kids_desc: "L'organisation Blue Shirt Kids, ou Scouts de l'Imam Mahdi, est en fait une organisation très similaire à l'organisation « Basij » d'Iran. Le recours à des jeunes volontaires pour notre organisation peut nous aider à former nos membres dès leur plus jeune âge. Bien que la formation des jeunes ne soit pas aussi difficile que celle d'un soldat adulte, elle peut néanmoins être utile pour préparer la nouvelle génération de nos soldats au sein de l'organisation."
 HEZ_Lujnat_Imdad_al-khomeini: "Lujnat Imdad Al Khomeini"
 HEZ_Lujnat_Imdad_al-khomeini_desc: "Komite-ye Emdad-e Emam Khomeini, ou Lujnat al Imdad Al Khomeini en arabe, est en fait une organisation caritative multinationale active dans toute l'Asie du Sud-Ouest, y compris au Liban. En demandant leur aide pour améliorer les conditions de vie de notre population, nous pouvons obtenir un soutien considérable dans la partie sud du Liban, et en même temps, de nombreux coûts de notre société peuvent être réduits grâce à l'aide de cette organisation !"
 HEZ_Peoples_Support_For_Hezbollah: "People's Support for Hezbollah"
 HEZ_Peoples_Support_For_Hezbollah_desc: "Nous avons obtenu notre soutien dans tout le Liban ! Désormais, nous ne craindrons aucune trahison contre la doctrine de la Résistance à l'intérieur de notre pays et de notre organisation ! Allahu Akbar !"
 HEZ_Volunteers_Of_All_Beliefs: "Des bénévoles de toutes croyances"
 HEZ_Volunteers_Of_All_Beliefs_desc: "Maintenant que nous avons répandu la vérité sur la Résistance, il semble que nos actions aient porté leurs fruits pour notre cause ! Une vague de volontaires de nombreux pays islamiques de la région ont demandé à rejoindre notre organisation ! Et pourquoi devrions-nous refuser leur demande ? Les sionistes ne s'attendent pas à ce que cela leur arrive !"
 HEZ_Deputy_leader: "Chef adjoint"
 HEZ_Deputy_leader_desc: "Naim Qassim est un atout précieux pour le Hezbollah s'il parvient à conserver son poste de chef adjoint de l'organisation. Et nous l'aiderons à obtenir ce qu'il veut !"
 HEZ_naim_qassim: "Naim Qassim"
 HEZ_Satellite_link_up: "Liaison satellite en cours"
 HEZ_Satellite_link_up_desc: "Maintenant, avec la création de la chaîne Al-Manar, nous devons permettre à cette chaîne de télévision de diffuser la doctrine de la Résistance non seulement au Liban mais aussi dans tous les pays voisins du Liban. Et sûrement, en portant atteinte au moral des sionistes, nous pouvons causer un dommage mineur mais important à leur gouvernement..."
 HEZ_The_Council_of_12: "Le Conseil des 12"
 HEZ_The_Council_of_12_desc: "Le conseil des 12 est composé de 12 membres politiques, militaires et exécutifs importants de l'organisation et constitue une partie très importante de l'organisation. Ce conseil est également une combinaison du conseil militaire et du conseil exécutif de l'organisation."
 HEZ_Al-Manar: "Al-Manar"
 HEZ_Al-Manar_desc: "En créant une chaîne de télévision internationale pour diffuser les paroles de la Résistance, nous pouvons gagner des partisans dans toute la région et dans le monde ! Avec la création de la chaîne Al-Manar, nous dévoilerons les mensonges de l'Occident et de l'État sioniste..."
 HEZ_Politics_in_Focus: "La politique au centre des préoccupations"
 HEZ_Politics_in_Focus_desc: "Le Hezbollah a laissé la religion guider le pays pendant bien trop longtemps. Il est temps de mettre en place un véritable leadership."
 HEZ_Religion_in_Focus: "La religion en focus"
 HEZ_Religion_in_Focus_desc: "We follow the doctrine of Islam with the guidance of Ayatollah Khomeini, and Hezbollah always will be loyal to Islam and its doctrine! We shall expand the influence of our ideological thoughts throughout the organization and even in Lebanon and other countries."
 HEZ_Armed_forces: "Forces armées"
 HEZ_Armed_forces_desc: "Nos forces armées sont l'un des aspects majeurs de notre organisation. Ainsi, en ces temps changeants, nous devons décider quoi faire avec elles. Devons-nous les réformer ? Ou garder les traditions de la guerre de guérilla ?"
 HEZ_The_Army_We_Know: "L'armée que nous connaissons"
 HEZ_The_Army_We_Know_desc: "La milice du Hezbollah et ses forces spéciales se sont avérées très efficaces contre les forces menaçantes des États-Unis et du régime sioniste. Avec discipline et adaptation à l'environnement, nos forces armées deviendront invincibles au Liban, et probablement dans toute la région de l'Asie du Sud-Ouest."
 HEZ_Specialized_Equipment: "Équipement spécialisé"
 HEZ_Specialized_Equipment_desc: "Avec la modernisation de notre équipement dans toutes nos forces armées, nous aurons un avantage contre nos ennemis. Avec la combinaison d'équipements modernes et de tactiques de guérilla spécialisées, personne n'osera nous attaquer..."
 HEZ_Taabia: "Taabia"
 HEZ_Taabia_desc: "Avec les nouvelles réformes dans notre académie militaire de \"Taabia\", nous pouvons créer une nouvelle génération d'officiers talentueux ayant une bonne connaissance des équipements modernes et capables d'analyser de nombreuses tactiques militaires utilisées dans le monde. Ces réformes seront un énorme avantage militaire pour nous."
 HEZ_Iranian_Training_Camps: "Camps d'entraînement iraniens"
 HEZ_Iranian_Training_Camps_desc: "Bien que nos officiers talentueux aient été formés en Iran depuis la création de notre organisation, il est temps de déplacer certains camps d'entraînement iraniens vers le sud du Liban. Ainsi, non seulement nos officiers, mais peut-être aussi nos soldats ordinaires et miliciens pourront recevoir une formation académique spéciale par les officiers iraniens de haut rang."
 HEZ_Support_for_our_Militia: "Soutien pour notre milice"
 HEZ_Support_for_our_Militia_desc: "Bien que nos miliciens soient principalement entraînés pour une guerre d'attrition, cela ne signifie pas que nous devons simplement leur donner une arme et leur demander de mourir pour notre cause. Non. Chaque membre du Hezbollah est un atout précieux pour l'organisation. Ainsi, même la vie de nos miliciens compte. Réduire les pertes de nos soldats, avec un soutien d'artillerie supplémentaire et d'autres équipements de soutien, peut être très utile pour être préparés et suffisamment qualifiés contre la menace impérialiste."
 HEZ_Al-Radwan: "Al-Radwan"
 HEZ_Al-Radwan_desc: "L'unité Al-Radwan, l'unité la plus spécialisée du Hezbollah, doit avoir de nouvelles réformes et une nouvelle phase de modernisation de son équipement. Quelle est la valeur de nos forces armées si les meilleurs d'entre eux n'ont rien à jour ?"
 iranian_roads_autonomy_TT: "Routes iraniennes"
 iranian_construction_tools_autonomy_TT: "Outils de construction iraniens"
 iranian_offices_autonomy_TT: "Bureaux iraniens"
 HEZ_wave_of_volunteers: "Une nouvelle vague de volontaires"
 HEZ_wave_of_volunteers_desc: ""
 HEZ_secret_service: "Services secrets du Hezbollah"
 HEZ_secret_service_desc: ""
 HEZ_secret_service_2: "Services secrets du Hezbollah"
 HEZ_secret_service_2_desc: ""
 HEZ_Intervention_forces: "Forces d'intervention"
 HEZ_Intervention_forces_desc: "Maintenant que nous sommes complètement centralisés et disciplinés dans les questions politico-bureaucratiques de notre État, il est temps d'utiliser toute notre puissance et nos ressources pour répandre les idéaux de la Résistance. Désormais, la priorité absolue de nos forces armées est la suivante : §RÊtre le soleil noir pour les impérialistes, car il n'y a pas d'espoir sous lui.§!"
 HEZ_Increasing_our_presence_aboard: "Augmenter notre présence à l'étranger"
 HEZ_Increasing_our_presence_aboard_desc: "Si nous voulons répandre la doctrine de la Résistance partout dans le monde, alors nous devons d'abord être partout, des côtes de Shanghai à la côte est de l'Amérique, vous nous verrez, et si vous ne nous voyez pas, alors vous verrez notre drapeau..."
 HEZ_Militarizing_our_society: "Militariser notre société"
 HEZ_Militarizing_our_society_desc: "Pour rendre notre nouvel État complètement sûr à l'intérieur contre toute menace étrangère, nous devons militariser extrêmement notre population. Si l'ennemi nous envahit et que nous tombons, alors notre ennemi devra tomber avec nous."
 HEZ_Hezbollahs_International_recruitment: "Forces armées du Hezbollah"
 HEZ_Hezbollahs_International_recruitment_desc: "\"Quelles sont les forces armées du Hezbollah ?\" beaucoup de gens peuvent se demander, et peut-être depuis la création de notre organisation, personne n'a vraiment pu répondre à cette question. Mais aujourd'hui, nous avons une réponse très simple et courte à cette question. Les forces armées du Hezbollah sont l'ensemble du sud du Liban et partout où la Résistance opère. Dans chaque maison libanaise, vous pouvez trouver un AK-47, mais bien sûr, vous ne le trouverez pas par vous-même..."
 HEZ_Specialized_Agents: "Agents spécialisés"
 HEZ_Specialized_Agents_desc: "Pour étendre notre domination du renseignement sur le monde entier, nous devons utiliser une formation spéciale d'agents par nous-mêmes. Bien que nous puissions certainement utiliser les expériences de nos frères à Téhéran pour la formation en renseignement du Hezbollah. Les purges massives de l'opposition du \"VAJA\" dans les années 1990 peuvent être un excellent moyen d'analyser le monde déroutant de l'information..."
 HEZ_Expand_Hezbollahs_Secret_Service: "Étendre les services secrets du Hezbollah"
 HEZ_Expand_Hezbollahs_Secret_Service_desc: "Notre agence de renseignement n'a pas de limites ; nous sommes partout, et nous pouvons être partout ! Lorsque vous postez quelque chose contre nous sur les réseaux sociaux, nous pouvons le voir. Lorsque vous travaillez dans une base militaire secrète près de Gaza, nous pouvons vous voir. Et lorsque vous êtes à la Maison Blanche, votant oui à une loi contre nous, nous pouvons le voir. Que vous le vouliez ou non, nous vous surveillons. Nous surveillons tout..."
 HEZ_Proper_use_of_recon: "Bon usage de la reconnaissance"
 HEZ_Proper_use_of_recon_desc: "Un soldat juif sioniste ne s'attend jamais à ce que son frère d'armes le trahisse et le poignarde dans le dos en temps de guerre, car ils sont tous unis et connectés les uns aux autres. C'est tout l'intérêt de la trahison, après tout... Vous ne pouvez pas la voir venir... Quoi qu'il en soit, avec nos énormes progrès dans les tactiques de renseignement et leur bon usage dans notre armée, nous pouvons détecter et saboter tout ce que notre ennemi a, sans même que l'ennemi lui-même le sache. Comme nous l'avons dit, ils ne le voient pas venir..."
 HEZ_last_effects_of_the_drugs: "Les derniers effets de la drogue"
 HEZ_last_effects_of_the_drugs_desc: "Bien que notre priorité de nuire à la société américaine par la toxicomanie soit terminée. Nous pouvons encore endommager les États-Unis avec certaines de nos... dernières expéditions de drogue vers les États-Unis. Oui. Il est vrai que nos expéditions de drogue ont été extrêmement réduites. Mais après tout, qui a dit que cela s'était complètement arrêté ?"
 HEZ_propaganda_for_north_america: "Propagande pour l'Amérique du Nord"
 HEZ_propaganda_for_north_america_desc: "Maintenant que nous sommes capables d'influencer la société américaine elle-même, il est temps d'y implémenter nos intérêts. Bien que cela ne puisse probablement pas nuire beaucoup à la politique nord-américaine, cela peut être une bonne distraction pour les gouvernements nord-américains face à quelques petites protestations violentes..."
 HEZ_an_american_muslim_spring: "Un printemps musulman américain ?"
 HEZ_an_american_muslim_spring_desc: "Le moment est venu de préparer nos plans ; en finançant et en menant des protestations à travers l'Amérique du Nord, nous pouvons endommager les États nord-américains dégénérés, du moins de la meilleure façon que nous puissions nous permettre..."
 HEZ_fund_muslim_institutes: "Financer les instituts musulmans"
 HEZ_fund_muslim_institutes_desc: "Pour endommager les États nord-américains de la meilleure façon possible, nous avons besoin à la fois d'un soutien populaire et... d'un soutien martial... Et avec ce fait, nous devons investir dans les institutions musulmanes et, si nécessaire, envoyer certains de nos clercs en Amérique du Nord par des moyens... illégaux..."
 HEZ_muslim_militias: "Milices musulmanes ?"
 HEZ_muslim_militias_desc: "Maintenant que le chaos commence à se répandre en Amérique du Nord, il semble que nous ayons de bonnes opportunités d'augmenter les dégâts que nous causons en Amérique du Nord avec des moyens... pas très acceptables selon les standards occidentaux..."
 HEZ_first_wave_of_protests: "Les premières vagues de protestations"
 HEZ_first_wave_of_protests_desc: "Nous avons influencé et investi suffisamment en Amérique du Nord pour préparer et financer des institutions islamiques \"spécifiques\" afin qu'elles comprennent et acceptent notre cause et nos idées. Maintenant, avec ce fait, nous devons initialiser nos plans, et à la fin, nous devons endommager le Grand Satan autant que possible..."
 HEZ_the_muslim_spring: "§RLe Printemps musulman§!"
 HEZ_the_muslim_spring_desc: "§RIls ne l'ont pas vu venir... n'est-ce pas ?§!"
 HEZ_iranian_missiles: "Missiles iraniens"
 HEZ_iranian_missiles_desc: "La seule chose qui effraie les sionistes et les Américains... La mort venue du ciel ! En important les dernières générations de missiles iraniens, nous profiterons de l'opportunité d'utiliser et de rechercher de nouveaux équipements de missiles pour nos propres intérêts."
 HEZ_Defence_force: "Force de défense"
 HEZ_Defence_force_desc: "En raison de notre position stratégique dans la région où nous existons, nous pouvons littéralement transformer Tyr et d'autres zones du Liban que nous contrôlons en une forteresse imprenable. Et ainsi, nous commençons."
 HEZ_Preparing_an_airforce: "Préparer une force aérienne"
 HEZ_Preparing_an_airforce_desc: "Désormais, alors que nous tentons d'adopter une approche pleinement « moderne » de nos forces armées, nous devons former notre propre corps aérien et construire autant d'infrastructures aériennes que possible. Nous manipulerons et dérouterons l'ennemi lorsque nous serons aussi professionnels et modernes qu'eux."
 HEZ_Establish_a_Flight_School: "Établir une école de vol"
 HEZ_Establish_a_Flight_School_desc: "Maintenant que nous avons suffisamment d'infrastructures aériennes dans le sud du Liban, nous pouvons demander à nos alliés syriens et iraniens de former une nouvelle génération d'officiers de l'air dans leurs pays. Cela profitera grandement à la Résistance."
 HEZ_Defending_Our_Shores: "Défendre nos côtes"
 HEZ_Defending_Our_Shores_desc: "La menace sioniste et américaine ne se limite pas à leurs forces terrestres. C'est pourquoi nous devons maintenant fortifier non seulement notre terre, mais aussi nos côtes."
 HEZ_Getting_off_our_shores: "Quitter nos côtes"
 HEZ_Getting_off_our_shores_desc: "Pour augmenter nos capacités défensives contre nos ennemis, la construction de nouveaux navires militaires est désormais nécessaire. En utilisant une nouvelle industrie lourde de construction navale, notre marine nouvellement formée entrera dans l'arène de la mer Méditerranée."
 HEZ_Producing_Equipment: "Produire de l'équipement"
 HEZ_Producing_Equipment_desc: "Although we will never abandon our traditional way of receiving equipment from abroad, we still have to create our own independent military complex just to produce our own equipment. Why shouldn't we use such an opportunity if we have it?"
 HEZ_Updating_our_Equipment: "Mettre à jour notre équipement"
 HEZ_Updating_our_Equipment_desc: "Maintenant que nous sommes capables d'avoir une industrie militaire, nous pouvons optimiser et améliorer l'équipement que nous produisons ; cela sera très bénéfique après avoir dépensé beaucoup d'argent dans nos propres industries indépendantes."
 HEZ_Protecting_our_Borders: "Protéger nos frontières"
 HEZ_Protecting_our_Borders_desc: "Ils voulaient construire un mur contre nous ? Hah ! Nous construirons une forteresse contre eux !"
 HEZ_Independence: "Indépendance"
 HEZ_Independence_desc: "Bien que nous resterons fidèles aux idées de l'Imam Khomeini et de Khamenei, nous ne tolérerons plus aucune influence étrangère dans notre pays ! L'Iran est notre ami, notre frère et notre allié ; il n'y a aucun doute là-dessus. Mais nous ne pouvons nier que l'Iran nous influence et nous manipule aussi ! La relation entre le Hezbollah et l'Iran devrait être une relation de puissance à puissance, pas de sujet à suzerain !"
 HEZ_Politics_in_focus: "La politique en focus"
 HEZ_Politics_in_focus_desc: ""
 HEZ_banks_in_beirut: "Banques à Beyrouth"
 HEZ_banks_in_beirut_desc: "En établissant de nouvelles banques privées liées à nous à Beyrouth, nous pouvons recevoir des revenus d'une nouvelle manière. Nos investisseurs viendront certainement visiter nos banques à Beyrouth et dans le sud du Liban !"
 HEZ_negotiations_in_the_south: "Négociations dans le sud"
 HEZ_negotiations_in_the_south_desc: "Notre objectif n'est plus seulement d'armer et d'opérer des organisations à travers le monde, non. Pourquoi devrions-nous être si agressifs quand nous pouvons... obtenir beaucoup d'argent d'investisseurs étrangers ?"
 HEZ_a_new_economy: "Une nouvelle économie"
 HEZ_a_new_economy_desc: "En approchant de nouvelles opportunités, nous recevons aussi de nouvelles idées... Il semble que cette fois, ces \"nouvelles\" idées concernent notre économie et peuvent être très bénéfiques si elles sont mises en œuvre !"
 HEZ_a_free_market: "Un marché libre"
 HEZ_a_free_market_desc: "Nous devenons juste un peu... capitalistes !"
 HEZ_a_free_industry: "Et une industrie libre !"
 HEZ_a_free_industry_desc: "Juste utiliser notre main-d'œuvre de la meilleure façon possible..."
 HEZ_friends_in_lebanon: "Amis au Liban"
 HEZ_friends_in_lebanon_desc: "Comme d'habitude, nous connaissons de nombreux hommes d'affaires musulmans et non musulmans à Beyrouth et dans d'autres grandes villes du Liban, et ils sont prêts à soutenir notre cause de toutes les manières possibles... Et bien, pourquoi refuser leur offre de soutien ?"
 HEZ_friends_in_outside: "Et des amis à l'extérieur"
 HEZ_friends_in_outside_desc: "Bien que les connexions au Liban puissent être utiles, elles ne suffisent pas. Comme c'est évident, nos bienfaiteurs et supporters ne sont pas seulement au Liban, mais existent dans toute la région de l'Asie du Sud-Ouest et même... au-delà..."
 HEZ_ready_for_construction: "Prêt pour la construction"
 HEZ_ready_for_construction_desc: "Maintenant que nous avons un soutien économique supplémentaire d'autres parties, nous sommes prêts à mettre en œuvre nos plans industriels dans le sud du Liban, et nos partenaires travailleront et coopéreront avec nous."
 HEZ_collaboration_in_the_military_industry: "Collaboration dans l'industrie militaire"
 HEZ_collaboration_in_the_military_industry_desc: "Bien que nous ayons de nombreuses façons d'acquérir de l'équipement sur le marché noir, cela ne signifie pas que nous ne devrions pas compter sur nous-mêmes et ne pas produire ou innover notre propre équipement... Ainsi, avec ce fait, nous devons maintenant construire notre propre industrie militaire."
 HEZ_collaboration_in_the_civilian_industry: "Collaboration dans l'industrie civile"
 HEZ_collaboration_in_the_civilian_industry_desc: "Bien qu'un complexe civil ne soit peut-être pas vraiment utile à nos intérêts, il est toujours nécessaire pour notre développement industriel et peut résoudre nos problèmes liés aux infrastructures et autres problèmes industriels."
 HEZ_al_bina: "Jihad al Bina"
 HEZ_al_bina_desc: "Jihad al Bina, a construction organization of Hezbollah which was created after the end of the Lebanese civil war by us, can now be revived and even get promoted to a new role in Hezbollah. Also, this organization is very similar to \"Khatam Al Anbia construction camp\" of the Islamic Revolutionary Guards Corps, and hence, we can actually make Jihad al Bina very similar to its Iranian model."
 HEZ_new_dubai: "Un nouveau Dubaï"
 HEZ_new_dubai_desc: "Juste un nouveau concurrent pour Singapour !"
 HEZ_industrial_investments: "Investissements industriels"
 HEZ_industrial_investments_desc: ""
 HEZ_liberization: "Libéralisation"
 HEZ_liberization_desc: ""
 HEZ_foreign_economical_funds: "Fonds économiques étrangers"
 HEZ_foreign_economical_funds_desc: ""
 HEZ_the_second_khatam_al_anbia_construction_camp: "Camp de construction Jihad Al-Bina"
 HEZ_all_emerging_drift_to_shia: "Toute popularité émergente sera §Ytransférée§! au parti des §GRévolutionnaires chiites radicaux§!."
 HEZ_defenders_of_the_shrine: "Défenseurs du sanctuaire"
 HEZ_eastern_propaganda: "Propagande pro-orientale"
 HEZ_preparing_for_new_plans: "Préparation de nouveaux plans"
 HEZ_iranian_businnes: "Financement des entreprises iraniennes"
 HEZ_border_skirmish_israel: "Escarmouche frontalière avec Israël"
 HEZ_the_last_push: "La poussée finale"
 hezbollah_events.39.t: "La mort de Rushdie"
 hezbollah_events.39.d: "Salman Rushdie, the writer of the book \"Satanic Verses\" after getting attacked by a cold-weapon armed young Muslim man, is now dead. It has been reported that the killer severely injured Rushdie with stabbing his body with a knife several times and also plunging the knife into his heart, killing him instantly in seconds. \nThe killer is wanted and also on the run. The Attacker is not yet identified to the US authorities. It has been said that the assassination took place in a conference located in the United States which Rushdie was also present in it. \nSome news agencies claim that Iranian, or even Hezbollahi-backed forces actually were the reason of Rushdie's death. \nBut there is no strong evidence as if the killer was a member of any Shi'ite Militia group or not. Many Muslim institutions and organisations, especially the Shi'a ones, have praised the killer and offered him rewards. And at the same time, many people across the Islamic World are  also celebrating the death of the \"Modern\" satan. \nDecades ago, Ayatollah Ruhollah Khomeini, the former leader of the Islamic Republic of Iran, demanded the death of Rushdie because of his \"blasphemous\" actions and considered the death of Rushdie a duty of any Muslim. \nAnd now it seems, his demand is fulfilled."
 hezbollah_events.39.a: "Il ne l'a pas vu venir, n'est-ce pas ?"
 hezbollah_events.39.b: "Enfin, justice a été rendue."
 hezbollah_events.38.t: "Tentative d'assassinat de Rushdie !"
 hezbollah_events.38.d: "Today, during a speech that was arranged by Salman Rushdie, the writer of the \"Satanic Verses\", he was attacked by a cold-weapon armed young Muslim man and was severely injured by the Attack. He has been stabbed several times by the attacker on his thigh and liver parts of his body. The attacker was on the run for some time but was caught in a location that was close to the location Rushdie wanted to attend his speech. Some news agencies claim that Iran and Hezbollah are behind this attack, but there is no real evidence for the killer's connection with Iran and Hezbollah. Though it seems that Rushdie is still alive, he can't be as healthy and secure as he was before this attack. \nDecades ago, Ayatollah Ruhollah Khomeini, the former leader of the Islamic Republic of Iran, demanded the death of Rushdie because of his \"blasphemous\" actions and considered the death of Rushdie a duty of any Muslim. \nThough this task is not fulfilled yet, this attack shows that the legacy of Khomeini is still alive."
 hezbollah_events.38.a: "Il ne l'a pas vu venir, n'est-ce pas ?"
 hezbollah_events.38.b: "Mince"
 hezbollah_events.4.t: "Attaques de missiles du Hezbollah à Riyad"
 hezbollah_events.4.d: "Last midnight, the sound of huge explosions was heard in Riyadh, the capital of Saudi Arabia. Eyewitnesses say that the sound of these explosions were somehow due to missile attacks, and it is also stated that these missiles mostly hit commercial and international areas of the city. \nThe government of Saudi Arabia has also confirmed this attack and accused Hezbollah, a Shia Islamist organization in Lebanon, for this attack. At the same time, the Saudi government refrains from giving any specific statistics of casualties and material losses in Riyadh. \nDue to the increasing influence of Shiites in Yemen and also formation and mobilization of armed groups of Shi'ites in Yemen (known as Yemeni Houthis), it is possible that this attack was originally from these groups and Hezbollah was actually involved in this attack indirectly. \nAt a time when the possibility of a civil war in the Arabian Peninsula, especially in the country of Yemen, is increasing at any moment, this important event can have a huge impact on the involvement of Saudi Arabia as well as the axis of resistance in the upcoming civil war."
 hezbollah_events.4.a: "Choquant !"
 hezbollah_events.5.t: "Le Hezbollah a lancé une campagne pour attaquer nos bases en Irak !"
 hezbollah_events.5.d: "Nous avons entendu des nouvelles choquantes aujourd'hui ! L'Iran et le Hezbollah ont organisé une campagne à l'échelle nationale en Irak pour attaquer nos forces de garnison et nos bases militaires ! Des milliers de civils chiites irakiens s'arment avec des armes fabriquées par l'Iran et le Hezbollah pour attaquer et tuer nos soldats ou... endommager nos bases... Nous ne pouvons rien faire pour arrêter ce désastre. \nMalgré tout cela, nous avons encore nos propres options pour nuire au Hezbollah et à l'\"Axe de la Résistance\" de certaines manières..."
 hezbollah_events.5.o1: "Nous devons appeler Tel Aviv..."
 hezbollah_events.5.o2: "Nous les gérerons nous-mêmes."
 hezbollah_events.5.o3: "Plus de sanctions pour cette soi-disant \"Résistance\" !"
 hezbollah_events.5.o4: "Oh mon Dieu..."
 hezbollah_events.2.t: "Le Hezbollah demande notre aide"
 hezbollah_events.2.d: "With the upcoming Parliamentary elections in Lebanon, Hezbollah, our most important ally throughout the region, is asking us for funds in the upcoming election for securing the power of the \"Resistance\" in Lebanon. There are many alternatives for helping Hezbollah in their cause, such as financial funding for their campaigns, or political support for their elections. anyhow, It is advised not to reject their demands, because at the end, it really can disappoint our Brothers in Beirut..."
 hezbollah_events.2.o1: "Fournir un soutien politique et financier, nous n'allons pas laisser nos frères seuls."
 hezbollah_events.2.o2: "Fournir un soutien politique, nos experts leur montreront la voie."
 hezbollah_events.2.o3: "Fournir un soutien financier. Ils savent sûrement comment gérer ces élections."
 hezbollah_events.2.o4: "Désolé, qu'avez-vous dit ?"
 hezbollah_events.1: "Déserteurs des FAL"
 hezbollah_events.1.t: "Déserteurs des FAL"
 hezbollah_events.1.d: "After infiltrating the Lebanese army with all efforts, we have earned the best support we could. We are getting closer to forming a rivalry, or even declare a war, against the false government in Beirut. \nWe will try to convince the population in Beirut to start protests and riots against the western puppets. We hope after the liberation of Beirut, we also start our operations against the Zionist beast. \nWith regards to the leader of the Islamic Resistance of Lebanon(Hassan Nasrallah), Imad Mughniyeh, commander of Hezbollahi forces in Beirut."
 hezbollah_events.1.o1: "L'horloge tourne..."
 hezbollah_events.3: "Le Hezbollah demande de l'aide"
 hezbollah_events.3.t: "Le Hezbollah demande de l'aide"
 hezbollah_events.3.d: "For the first time, we have received a very strange diplomatic message from Hezbollah, a Paramilitary Shi'ite organisation operating in Lebanon. The message is about \"Increasing international cooperation and communication\" in Southern Lebanon, And for this so called \"Opportunity of Cooperation\", they are asking us for any sort of fund they can get from us, It can be an opportunity for us to invest and also harvest profits in a very middle eastern country, but still, Hezbollah may be also a very... unhealthy organisation at some sorts... Anyhow, how should We react to their message?"
 hezbollah_events.3.o1: "Refuser"
 hezbollah_events.3.o2: "Équipement"
 hezbollah_events.3.o3: "Aide financière"
 hezbollah_events.3.o4: "Investissement"
 hezbollah_events.23.t: "Nos minorités sont persécutées !"
 hezbollah_events.23.d: "Jewish minority groups are now insecure in our country! Several suspicious accidents happened in the recent days to a significant number of our Jewish minorities. Some reports indicate that in these accidents, some important figures of the jewish communities have been killed! Our American allies have told us that a Shi'ite terrorist group is behind this, what should we do?! "
 hezbollah_events.23.o1: "Calmez-les, bon sang !"
 hezbollah_events.24.t: "Increase in cartels' activities"
 hezbollah_events.24.d: "We have received reports of mass raidings and black market gun purchases in the recent days following the rumors of a terrorist organisation funding the cartels that are active throughout the country, the savages are drawing our country into chaos!"
 hezbollah_events.24.o1: "Stoppez-les par tous les moyens nécessaires."
 hezbollah_events.25.t: "Que se passe-t-il à nos frontières ?"
 hezbollah_events.25.d: "We have received reports from the FBI and the DEA that the number of the Drug shipments from the Mexican border has been increased. And tracking some of the \"specific\" drug shipments is very hard. It seems that our  failure in tracking these drug shipments is affecting our population. At the same time, in the recent months there were various reports of increase of the Latin American Cartels activities throughout the South American continent. Also our Intelligence agency says that Hezbollah and Iran are funding the cartels, and are also establishing new operation bases in the Latin America to Destabilize the United States. \nAnd it seems, they were successful in doing so."
 hezbollah_events.25.o1: "Comment ?..."
 hezbollah_events.26.t: "Le Hezbollah a attaqué une de nos bases en Irak !"
 hezbollah_events.26.d: "We have got reports from our CENTCOM forces in Iraq, Hezbollah-backed Shi'ite forces have attacked one of our bases in Iraq! Though the casualties weren't significant, they still could kill and severely injure some of our forces, though this disaster will not get published to the media, we should commit a retaliatory action."
 hezbollah_events.26.o1: "Mort aux terroristes ! Attaquez leurs bases !"
 hezbollah_events.26.o2: "Les querelles des idiots ne me concernent pas."
 hezbollah_events.27.t: "Une campagne chiite en Irak"
 hezbollah_events.27.d: "Today, a massive campaign launched by Iranian-Lebanese backed Shi'ite militias has started across Iraq. These militia groups have started to attack the US garrison forces that are stationed in Iraq and also attacked many US bases across the country. \nThere is no official statement from the United States about the casualties and material losses from their own side, but, Many Shi'ite organisations claim that though there were losses on their own side, they could still do a major \"damage\" to the \"Imperialist\" American forces. \nThough it seems that the massive attacks will end in the upcoming days, it is not expected for the attackers to stop their raids against the American forces stationed in Iraq. \nWhile Iraq is burning into her own ashes, we shall see that how many countries are going to get affected by her misery too."
 hezbollah_events.40.t: "Une unification chiite libanaise"
 hezbollah_events.40.d: "Today, with the announcement of both Central government of Lebanon and Hezbollah, a unitarian \"Islamic Republic\" has been formed. Officially letting Hezbollah to expand its bases and forces in all of Lebanon. \nHassan Nasrallah, leader of Hezbollah, has stated this event is a \"Glorious Unification of Lebanon under the banner of the Resistance\". Many supporters have gathered around the streets of Lebanese cities after the announcement of the formation of this new Islamic Republic. \n The state of Israel and the United States of America however, commented that this unification was a \"Theocratic Coup orchestrated by Iran and its proxies in Lebanon\". \nNow with the \"unification\" of Lebanon, it seems that the sphere of Influence of Iran and the Axis of Resistance has entered a new stage in both the Middle East and the International Community. \nNow Lebanon is united by a Shi'a government that orchestrates most of the anti-American operations throughout the region, soon, a new phase of powerful and violent operations will begin throughout the Middle East..."
 hezbollah_events.40.a: "Un pas de plus vers une Oumma unie."
 hezbollah_events.40.b: "Intéressant"
 hezbollah_events.41.t: "Deuxième guerre civile libanaise"
 hezbollah_events.41.d: "With the last raiding conflicts of Hezbollah and Lebanese Armed Forces some days ago in Beirut, today, with the declaration of War to Lebanon's central government by Hassan Nasrallah, leader of Hezbollah, Lebanon has entered a new era of civil war again. \nWith the country in chaos, many Supporters of Hezbollah have risen up to join Nasrallah in his campaign against the Lebanese central government and already the streets of Beirut are filled with gunshots and damages. \nMany countries, including both the United States and the Islamic Republic of Iran, have asked both sides to resolve the conflict peacefully. But it seems that if the time comes, Iran and the United States can enter a new phase of their own Proxy wars in the Middle East."
 hezbollah_events.41.a: "Inquiétant..."
 hezbollah_events.41.b: "Let's just hope we don't lose our champion..."
 hezbollah_events.42.t: "Le Grand Jugement"
 hezbollah_events.42.d: "After the successful campaign of Hassan Nasrallah in his Homeland, it was obvious that he was not going to stop his aggressive actions in the Middle East. Now after raiding and securing intelligence from Israel's Defense Forces and supplies from the Israeli border patrols during the recent months, it seems that Hezbollah is now declaring a \"Great Trial\" against the \"Zionist Menace\". \nWith Hezbollah officially declaring war on Israel and Iran joining the war too, the situation is becoming very chaotic and tense throughout the region. \nWith more death and suffering coming to the Middle East, Nasrallah seems to be right about one thing, this war, is truly a great trial. For it is the endgame of the \"Resistance\", or end of the State of Israel."
 hezbollah_events.42.a: "Horrible !"
 hezbollah_events.42.b: "La fin commence."
 hezbollah_events.27.a: "La guerre contre le terrorisme a simplement fait des États-Unis un pays terroriste..."
 hezbollah_events.27.b: "Nous savons quoi faire d'eux."
 hezbollah_events.28.t: "Al-va'ad al Sadiq !"
 hezbollah_events.28.d: "Since the Zionist and Axis of Resistance's indirect agreement for exchanging prisoners between both sides in 2004, 3 major Lebanese prisoners were not freed from their imprisonment and the Zionists were not completely faithful in fulfilling the agreement. Hence, our leader, Hassan Nasrallah, one of the leaders of the Resistance, said that the only way of freeing those captives is to capture more \"Zionist soldiers\". \nAnd now, we have the opportunity to fulfill the demand of our leader. We can attack a bunch of Zionist soldiers that trespassed our border. \nWe now can initiate the operation \"Truthful Promise\"."
 hezbollah_events.28.o1: "Mort à la menace sioniste ! Attaquez-les !"
 hezbollah_events.28.o2: "Peut-être que ce n'était pas si \"véritable\" après tout..."
 hezbollah_events.29.t: "Les terroristes ont attaqué nos soldats près du Liban !"
 hezbollah_events.29.d: "Il y a quelques heures, l'organisation terroriste \"Hezbollah\" a attaqué certaines des forces de l'IDF qui patrouillaient près de la frontière libanaise. Leur leader, Hassan Nasrallah, a déclaré que cette \"opération\" était une mesure de représailles en raison de notre \"malhonnêteté\" dans l'accord d'échange de prisonniers de 2004.\nCes fanatiques étaient clairement délirants en décidant d'attaquer nos forces près de leurs frontières. Nous pouvons répondre à ces fanatiques non entraînés avec férocité et les détruire en quelques jours. Cependant, certaines préoccupations subsistent quant aux actions du Hezbollah..."
 hezbollah_events.29.o1: "Ils veulent une autre guerre des Six Jours ? Qu'il en soit ainsi !"
 hezbollah_events.29.o2: "Vraiment inquiétant..."
 hezbollah_events.30.t: "Nous avons gagné !"
 hezbollah_events.30.o1: "L'Axe de la Résistance."
 hezbollah_events.31.t: "Nous avons perdu !"
 hezbollah_events.31.o1: "C'est fini..."
 hezbollah_events.32.t: "La fin du Hezbollah ?"
 hezbollah_events.32.d: "Le Hezbollah a perdu Tyr et le sud du Liban ! Les sionistes traversent maintenant la frontière libanaise et occupent le sud du Liban comme le plateau du Golan ! L'organisation est en chaos et nous devons calmer les choses. Le moment est venu de mettre fin à la mascarade de cet \"État juif\". Nous devons agir maintenant, ou jamais !"
 hezbollah_events.32.o1: "We have to break the gate of Khaybar once again. DEATH TO ISRAEL!"
 hezbollah_events.32.o2: "C'est malheureux"
 hezbollah_events.33.t: "Un résultat étrange..."
 hezbollah_events.33.d: "Personne n'a pu attaquer ou se défendre dans cette guerre sanglante d'une manière ou d'une autre.\nUne conclusion très inattendue, ne trouvez-vous pas, cher leader ?"
 hezbollah_events.33.o1: "Je vois..."
 hezbollah_events.35.t: "Une proposition intéressante"
 hezbollah_events.35.d: "Some of our Military commanders after the defeat of the Zionist army against our forces have offered us a very ambitious, but maybe reasonable plan. According to their ideas, we saw how Weak and disorganized the Zionist Offense Forces have become since the Lebanese civil war, with that, they are offering us a total invasion to end the false Zionist state. Of course, they are not offering us to start such a military operation just by ourselves... We can ask our Syrian and Iranian brothers to join the war of Liberation too. And surely, they will accept such ambitious offer too..."
 hezbollah_events.35.o1: "Ô Jérusalem ! Nous arrivons !"
 hezbollah_events.35.o2: "Quelle idée folle."
 hezbollah_events.36.t: "Une offre du Hezbollah"
 hezbollah_events.36.d: "We have gained an interesting offer from our strategic Ally and Partner, Hezbollah. Nasrallah has suggested to us to do a \"final\" attack against the Zionist state. Their logic for this \"final\" attack is that from many observations about the 33 days war, we can see that the Zionist forces were completely disorganized in Tactical and Logistical ways. \nAnyhow, we can either accept or deny their offer."
 hezbollah_events.36.o1: "Le moment est venu de décapiter le serpent..."
 hezbollah_events.36.o2: "\"Quoi\" ?"
 hezbollah_events.37.t: "La deuxième guerre du Liban"
 hezbollah_events.37.d: "La nuit dernière, les Libanais se sont réveillés au son des bombardements et des obus d'artillerie des forces de défense israéliennes, et la seule chose qu'ils ont vue, c'était le feu et le conflit entre les forces israéliennes et libanaises.\nLe but de l'attaque des forces de défense israéliennes était principalement de répondre au « raid » du Hezbollah sur les forces israéliennes de Tsahal et de « mettre fin » aux actions « menaçantes » du Hezbollah contre l'existence même de l'État d'Israël.\nDans le même temps, Hassan Nasrallah, le secrétaire général du Hezbollah libanais, a déclaré que la principale raison de ce conflit était la capture de plusieurs forces israéliennes en représailles à la « malhonnêteté » du gouvernement israélien dans les négociations indirectes pour l'échange des prisonniers de l'Axe de la Résistance d'Israël et des prisonniers de Tsahal du Hezbollah en 2004. Ce raid a eu lieu quelques jours avant le début de ce conflit.\nQuelle que soit la raison principale de cette guerre, elle va maintenant causer de nombreuses victimes parmi les populations vivant au Liban et en Israël, et le monde voit le Levant à nouveau dans le chaos..."
 hezbollah_events.37.a: "Ils paieront..."
 hezbollah_events.37.b: "Donnez une leçon à ces terroristes !"
 hezbollah_events.37.c: "Le Liban brûle."
 hezbollah_events.8.t: "Nous avons pillé l'armée ennemie !"
 hezbollah_events.8.d: "With the help of almighty Allah and the bravery of our fighter's will, we have damaged the Enemy's Armed Forces heavily!"
 hezbollah_events.8.o1: "Allahu Akbar !"
 hezbollah_events.6.t: "Nous avons pillé l'armée ennemie !"
 hezbollah_events.6.d: "With the help of almighty Allah and the bravery of our fighter's will, we have damaged the Enemy's Armed Forces moderately!"
 hezbollah_events.6.o1: "Masha Allah !"
