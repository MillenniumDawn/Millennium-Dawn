 MD_antarctica_news.1.t: "[FROM.GetName] Applies to Join Antarctic Treaty"
 MD_antarctica_news.1.d: "[FROM.GetName] has applied to join the Antarctic Treaty, signaling a potential shift in their foreign policy and commitment to environmental conservation. The Antarctic Treaty is an international agreement that regulates the use of Antarctica for peaceful purposes and scientific research, while also protecting the continent's unique ecosystem. [FROM.GetName]'s application to join the treaty has been met with warm reactions from the international community, with some praising the move as a positive step towards global cooperation, while others express skepticism about [FROM.GetName]'s intentions and commitment to the treaty's principles. The application process will take a month to complete."
 MD_antarctica_news.1.a: "Czas pokaże"
 MD_antarctica_news.1.b: "Najwyższa pora"
 MD_antarctica_news.2.t: "[FROM.GetName] Przystępuje do Układu w sprawie Antarktyki"
 MD_antarctica_news.2.d: "Today, at [GetDateText], [FROM.GetName] has officially joined the Antarctic Treaty, becoming a member of the international agreement that regulates the use of Antarctica for peaceful purposes and scientific research. By joining the treaty, [FROM.GetName] has committed to upholding the principles of environmental conservation and international cooperation in Antarctica. This move has been met with positive reactions from the global community, with many praising [FROM.GetName] for their commitment to protecting the unique ecosystem of Antarctica and promoting peaceful collaboration among nations."
 MD_antarctica_news.2.a: "Kolejny członek"
 MD_antarctica_news.2.b: "Zabierzmy się do pracy!"
 MD_antarctica_news.3.t: "[FROM.GetName] Dąży do wystąpienia z Układu Antarktycznego"
 MD_antarctica_news.3.d: "[FROM.GetName] decided today to leave the Antarctic Treaty. The Commission for the Conservation of Antarctic Marine Living Resources (CCAMLR) is giving them 2 years to dismantle any research stations they have in Antarctica and to avoid any prohibited activities, such as resource exploitation or military presence. The decision to leave the treaty has been met with mixed reactions from the international community, with some expressing disappointment and concern about the potential consequences for the environment and global cooperation, while others support [FROM.GetName]'s right to make their own decisions regarding their involvement in international agreements. The process of leaving the treaty will take 2 years to complete."
 MD_antarctica_news.3.a: "Jaka szkoda"
 MD_antarctica_news.3.b: "Mamy ważniejsze rzeczy do zrobienia."
 MD_antarctica_news.4.t: "[FROM.GetName] Występuje z Układu Antarktycznego"
 MD_antarctica_news.4.d: "[MD_antarctica_news_4_desc]"
 MD_antarctica_news.4.a: "Traktat został osłabiony"
 MD_antarctica_news.4.b: "Cokolwiek"
 MD_antarctica_news_4_desc_1: "After 2 years of leaving the Antarctic Treaty, [FROM.GetName] has officially left the international agreement that regulates the use of Antarctica for peaceful purposes and scientific research. Despite the warnings, [FROM.GetName] has left the treaty while having a Research Station in Antarctica, which has caused global response from the Treaty members, including potential sanctions and diplomatic backlash."
 MD_antarctica_news_4_desc_2: "After 2 years of leaving the Antarctic Treaty, [FROM.GetName] has officially left the international agreement that regulates the use of Antarctica for peaceful purposes and scientific research. [FROM.GetName] has successfully dismantled any research stations in Antarctica and avoided any prohibited activities, such as resource exploitation or military presence, which has helped to mitigate potential consequences for the environment and global cooperation."
 MD_antarctica_news.5.t: "Open-Loop Utilities Detected in [FROM.GetAdjective] Antarctic Station"
 MD_antarctica_news.5.d: "During the recent observer mission, Treaty observers have detected the usage of Open-Loop Utilities in one of the [FROM.GetAdjective] Antarctic research stations. This is a violation of the Antarctic Treaty, which prohibits any activity that may cause environmental harm or disrupt the ecosystem of Antarctica. The detection of Open-Loop Utilities has raised concerns among the Treaty members and may lead to diplomatic consequences."
 MD_antarctica_news.5.a: "Niektórzy muszą wybierać tanie rozwiązania."
 MD_antarctica_news.5.b: "Dobrze"
 MD_antarctica_news.6.t: "Illegal Laboratory Activities Detected in [FROM.GetAdjective] Antarctic Station"
 MD_antarctica_news.6.d: "During the recent observer mission, Treaty observers have detected illegal laboratory activities in one of the [FROM.GetAdjective] Antarctic research stations. This behavior is unacceptable and a clear violation of Antarctic Treaty. The Consultative Parties of the Treaty will address this issue and take appropriate actions to ensure the protection of Antarctica's unique ecosystem and the integrity of the treaty."
 MD_antarctica_news.6.a: "To jest niedopuszczalne"
 MD_antarctica_news.6.b: "Musimy coś z tym zrobić"
 MD_antarctica_news.7.t: "Nuclear Weapon Research Detected in [FROM.GetAdjective] Antarctic Station"
 MD_antarctica_news.7.d: "During the recent observer mission, Treaty observers have detected nuclear weapon research in one of the [FROM.GetAdjective] Antarctic research stations. This is a severe violation of the Antarctic Treaty, which prohibits any military activity or any activity that may cause environmental harm or disrupt the ecosystem of Antarctica. Using a peaceful research station for construction and testing of nuclear weapons is an outrageous act that threatens the safety and security of the entire world. The Consultative Parties of the Treaty will take immediate and decisive actions to address this issue and hold those responsible accountable for their actions. The international community must come together to condemn this behavior and ensure that Antarctica remains a peaceful and protected environment for scientific research and cooperation."
 MD_antarctica_news.7.a: "To skandaliczne!"
 MD_antarctica_news.7.b: "To było ważniejsze"
 MD_antarctica_news.8.t: "[FROM.GetName] zbyt wiele razy naruszył Traktat Antarktyczny"
 MD_antarctica_news.8.d: "After multiple breaches of the Antarctic Treaty, [FROM.GetName] has reached a critical point where the Consultative Parties of the Treaty have decided to remove them from the treaty and impose severe diplomatic consequences. The repeated violations of the treaty's principles and regulations have undermined the integrity of the agreement and threatened the protection of Antarctica's unique ecosystem. The Consultative Parties of the Treaty will take decisive action to ensure that [FROM.GetName] is held accountable for their actions and that the Antarctic Treaty remains a strong and effective framework for international cooperation and environmental conservation."
 MD_antarctica_news.8.a: "Sami to na siebie sprowadzają"
 MD_antarctica_news.8.b: "To już przesada."
 MD_antarctica_news.9.t: "Silne wiatry nad Antarktydą"
 MD_antarctica_news.9.d: "Na terenie Antarktydy odnotowano silne wiatry, które wpływają na funkcjonowanie stacji badawczych. Strony konsultacyjne traktatu monitorują sytuację i zapewniają wsparcie, aby zagwarantować bezpieczeństwo personelu oraz ciągłość prowadzonych badań. Misje obserwacyjne zostały tymczasowo zawieszone do czasu poprawy warunków pogodowych."
 MD_antarctica_news.9.a: "Niedobrze"
 MD_antarctica_news.10.t: "[FROM.GetName] Rozpoczyna się budowa antarktycznej stacji badawczej"
 MD_antarctica_news.10.d: "[FROM.GetName] rozpoczęła budowę nowej antarktycznej stacji badawczej, sygnalizując swoje zaangażowanie w badania naukowe i ochronę środowiska w tym regionie. Budowa stacji ma potrwać kilka miesięcy, a Strony Konsultacyjne Traktatu będą uważnie monitorować postępy prac."
 MD_antarctica_news.10.a: "Znakomity!"
 MD_antarctica.1.t: "Nadchodzi misja obserwacyjna"
 MD_antarctica.1.d: "[FROM.GetName] wysłał obserwatorów w ramach traktatu, aby przeprowadzili inspekcję jednej z naszych stacji badawczych na Antarktydzie. Przewiduje się, że misja dotrze na miejsce za §Y 7 dni§!."
 MD_antarctica.1.a: "Będziemy oczekiwać ich przybycia"
 MD_antarctica.3.t: "Raport misji obserwacyjnej: wykryto instalacje komunalne o obiegu otwartym"
 MD_antarctica.3.d: "Obserwatorzy działający w ramach Traktatu zakończyli inspekcję naszej antarktycznej stacji badawczej i odnotowali korzystanie z systemów infrastrukturalnych typu otwartego. Stanowi to naruszenie postanowień Traktatu Antarktycznego i może pociągnąć za sobą konsekwencje dyplomatyczne. Strony konsultatywne Traktatu zażądały podjęcia działań mających na celu zastąpienie tych systemów rozwiązaniami bardziej przyjaznymi dla środowiska."
 MD_antarctica.3.a: "Musimy się tego pozbyć"
 MD_antarctica.4.t: "Raport misji obserwacyjnej: Wykryto nielegalną działalność laboratoryjną"
 MD_antarctica.4.d: "Obserwatorzy działający w ramach traktatu zakończyli inspekcję naszej stacji badawczej na Antarktydzie i zgłosili wykrycie nielegalnych działań laboratoryjnych. Strony konsultatywne nie wyciągną dalszych konsekwencji, jeśli zaprzestaniemy wszelkich nielegalnych działań w naszej stacji."
 MD_antarctica.4.a: "Musimy coś z tym zrobić."
 MD_antarctica.5.t: "Raport misji obserwacyjnej: Wykryto badania nad bronią jądrową"
 MD_antarctica.5.d: "Obserwatorzy działający w ramach Traktatu zakończyli inspekcję naszej stacji badawczej na Antarktydzie i zgłosili wykrycie prac badawczych nad bronią jądrową. Stanowi to poważne naruszenie Traktatu Antarktycznego i pociągnie za sobą natychmiastowe konsekwencje dyplomatyczne. Strony konsultatywne Traktatu podejmą zdecydowane działania w tej sprawie i pociągną osoby odpowiedzialne do odpowiedzialności, żądając natychmiastowego zaprzestania wszelkich prac badawczych związanych z technologią jądrową w naszej stacji."
 MD_antarctica.5.a: "Musimy się tego natychmiast pozbyć!"
 MD_antarctica.6.t: "Naruszenie Układu Antarktycznego: Zbyt wiele przypadków łamania przepisów"
 MD_antarctica.6.d: "Dear [ROOT.GetLeader],\n\nWe regret to inform you that your nation, [ROOT.GetName], has breached the Antarctic Treaty too many times, with a total of [?antarctica_station_reports] violations. As a result, the Consultative Parties of the Treaty have decided to remove [ROOT.GetName] from the treaty within 2 years and impose severe diplomatic consequences. The repeated violations of the treaty's principles and regulations have undermined the integrity of the agreement and threatened the protection of Antarctica's unique ecosystem. We urge you to take this matter seriously and remove the research station, before the membership is revoked.\n\nSincerely,\nThe Consultative Parties of the Antarctic Treaty"
 MD_antarctica.6.a: "Sami to na siebie sprowadziliśmy"
 MD_antarctica.7.t: "Nałożyć embargo na [FROM.GetName]?"
 MD_antarctica.7.d: "Due to the recent detection of nuclear weapon research in one of the [FROM.GetAdjective] Antarctic research stations, the Consultative Parties of the Antarctic Treaty are considering imposing an embargo on [FROM.GetName]. This would involve restricting trade and diplomatic relations with [FROM.GetName] in response to their violation of the treaty's principles and regulations."
 MD_antarctica.7.a: "Muszą ponieść konsekwencje swoich czynów"
 MD_antarctica.7.b: "To nie jest tego warte"
 MD_antarctica.9.t: "Uszkodzono moduł stacji antarktycznej"
 MD_antarctica.9.d: "A module at one of our Antarctic research stations has been damaged by a blizzard. Engineers are preparing repairs and will start as soon as weather conditions improve.\n\nRepairs begin when the blizzard ends (§Y[?global.antarctica_blizzard_days_remaining|0]§! days of blizzard remaining) and take §Y14§! days to complete. You can see the remaining time on the station view and in the damaged module tooltip."
 MD_antarctica.9.a: "Cholerna pogoda!"
 MD_antarctica.10.t: "Dismantling of the annexed country's Antarctic Research Station"
 MD_antarctica.10.d: "W związku z aneksją kraju, w którym znajdowała się stacja badawcza, stacja ta została zdemontowana."
 MD_antarctica.10.a: "Okej"
 ANT_nukes_research_discovered_idea: "Odkryto badania nad bronią jądrową prowadzone w stacji na Antarktydzie"
 ANT_nukes_research_discovered_idea_desc: "Kraj ten naruszył zasadę całkowitego zakazu prowadzenia badań wojskowych na Antarktydzie, realizując badania związane z bronią jądrową."
 antarctica_small_treaty_admin_cost_1: "Antarctic Small Treaty Administration"
 antarctica_small_treaty_admin_cost_1_desc: "Kraj ten podpisał jeden z traktatów dotyczących Antarktyki (CCAS lub CCAMLR), co zwiększyło obciążenie administracyjne związane z działaniami politycznymi."
 antarctica_small_treaty_admin_cost_2: "Rozszerzona administracja Układu w sprawie Antarktyki"
 antarctica_small_treaty_admin_cost_2_desc: "Kraj ten podpisał oba traktaty dotyczące Antarktyki (CCAS i CCAMLR), co wymaga szerszych zasobów w zakresie administrowania tymi porozumieniami i zapewniania ich przestrzegania."
 ANT_kicked_from_treaty_idea: "Usunięty z Układu Antarktycznego"
 ANT_kicked_from_treaty_idea_desc: "Z powodu wielokrotnego naruszania Traktatu Antarktycznego kraj ten został wykluczony z porozumienia i nie może do niego ponownie przystąpić przez najbliższe dwa lata."
 ANT_illegal_extraction_idea: "Nielegalna eksploatacja zasobów na Antarktydzie"
 ANT_illegal_extraction_idea_desc: "Nasze relacje z innymi krajami są gorsze, ponieważ należymy do nielicznych, którzy nie chcą wymieniać cennych zasobów na zachowanie ładnego widoku na lodowe pustkowie. Oni zbyt mocno przejmują się tą zamarzniętą bryłą."
 ANT_military_training_idea: "Nielegalne ćwiczenia wojskowe na Antarktydzie"
 ANT_military_training_idea_desc: "Nie ma lepszego miejsca na przygotowanie naszych żołnierzy do zimowej ofensywy niż Antarktyda."
