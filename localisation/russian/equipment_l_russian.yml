 SPR_transport_helicopter_1: "Bell UH-1H Huey"
 SPR_transport_helicopter_1_short: "UH-1H Huey"
 SPR_transport_helicopter_1_desc: "Универсальный военный вертолёт с одним турбовальным двигателем, двухлопастными несущим и рулевым винтами. Первый представитель многочисленного семейства Huey, он был разработан компанией Bell Helicopter по требованию армии США 1952 года к санитарно-эвакуационному и многоцелевому вертолёту и впервые поднялся в воздух в 1956 году. UH-1 стал первым вертолётом с газотурбинным двигателем, произведённым для вооружённых сил Соединённых Штатов, и с 1960 года их было построено более 16 000."
 SPR_transport_helicopter_2: "Airbus Helicopters AS 332 Super Puma"
 SPR_transport_helicopter_2_short: "As332 SuperPuma"
 SPR_transport_helicopter_2_desc: "Четырёхлопастный двухдвигательный многоцелевой вертолёт среднего размера, разработанный и продаваемый компанией Airbus Helicopters. Это версия оригинального Aérospatiale SA 330 Puma с новыми двигателями и увеличенным объёмом."
 SPR_transport_helicopter_3: "Boeing CH-47 Chinook"
 SPR_transport_helicopter_3_short: "CH-47 Chinook"
 SPR_transport_helicopter_3_desc: "Двухдвигательный тяжёлый транспортный вертолёт продольной схемы, разработанный американской вертолётостроительной компанией Vertol и производимый Boeing Rotorcraft Systems. CH-47 — один из самых грузоподъёмных западных вертолётов. Chinook располагает несколькими средствами погрузки различных грузов, включая многочисленные двери по всему фюзеляжу, широкую погрузочную рампу в задней части фюзеляжа, а также три внешних подфюзеляжных грузовых крюка для перевозки грузов на внешней подвеске."
 SPR_transport_helicopter_4: "NHIndustries NH-90"
 SPR_transport_helicopter_4_short: "NH-90"
 SPR_transport_helicopter_4_desc: "Средний двухдвигательный многоцелевой военный вертолёт. Он был разработан в ответ на требования НАТО к боевому вертолёту, который также мог бы эксплуатироваться в морских условиях. Испанская версия NH90 оснащена собранными в стране двигателями General Electric CT7 8F5, адаптированным комплексом связи и электронными системами предупреждения, разработанными компанией Indra."
 SPR_transport_helicopter_5: "Sikorsky UH-60 Stealth Hawk"
 SPR_transport_helicopter_5_short: "Sikorsky UH-60S Stealth Hawk"
 SPR_attack_helicopter_1: "Bell Helicopter Textron AH-1 Cobra"
 SPR_attack_helicopter_1_short: "AH-1 Cobra"
 SPR_attack_helicopter_1_desc: "Одномоторный ударный вертолёт с двухлопастным винтом, производимый компанией Bell Helicopter. Он был разработан с использованием двигателя, трансмиссии и несущего винта вертолёта Bell UH-1 Iroquois. Являясь членом обширного семейства Huey, AH-1 также известен как HueyCobra или Snake. Военно-морской флот Испании присвоил типу обозначение «Z-14». Эти вертолёты оснащались пушечной установкой M35 калибра 20 мм и использовались для поддержки прибрежных патрульных катеров."
 SPR_attack_helicopter_2: "Bell Helicopter OH-58A Kiowa"
 SPR_attack_helicopter_2_short: "OH-58A Kiowa"
 SPR_attack_helicopter_2_desc: "OH-58A Kiowa — 4-местный разведывательный вертолёт. У Kiowa двухместная кабина для пилотов, хотя органы управления на левом месте можно снять, чтобы перевозить пассажира спереди. В период разработки для Вьетнама он был оснащён M134 Minigun — 7,62-мм электрическим пулемётом."
 SPR_attack_helicopter_3: "Eurocopter Tigre"
 SPR_attack_helicopter_3_short: "Tigre"
 SPR_attack_helicopter_4: "Eurocopter Tigre E Mk2"
 SPR_attack_helicopter_4_short: "Tigre E Mk2"
 SPR_attack_helicopter_4_desc: "Четырёхлопастный двухдвигательный штурмовой вертолёт. Производится компанией Airbus Helicopters, которая обозначает его как EC665. В Испании он называется «Tigre». Вертолёт Tigre отличается тем, что является первым полностью композитным вертолётом, разработанным в Европе; оснащён современными системами, включая стеклянную кабину, технологии малозаметности и высокую манёвренность для повышения выживаемости."
 SPR_attack_helicopter_5: "Airbus Helicopters EC665 Tigre Mark3"
 SPR_attack_helicopter_5_short: "Tigre MK3"
 SPR_attack_helicopter_5_desc: "Испания сотрудничала с Францией, Германией и Австралией в модернизации вертолёта Tiger HAD, получившей обозначение Tiger Mk3. Ключевым элементом этой модернизации стало принятие единой противотанковой ракеты, а также другие улучшения, включая систему связи."
