 FRA_crackdown_extremists_left: "A Extrema Esquerda Foi Reprimida"
 FRA_coup_by_extremists_left: "A Extrema Esquerda Tomou o Poder"
 france_md.600.t: "O Negócio de Chips que a Alcatel Não Quer Mais"
 france_md.600.d: "A bolha das telecomunicações estourou e a Alcatel está vendendo tudo o que não é rede. Sua divisão de microeletrônica é lucrativa, competente e está prestes a pertencer a outro. Mantê-la francesa custaria ao Tesouro dinheiro de verdade para resolver um problema que o mercado não acha que existe."
 france_md.600.a: "Manter o braço de microeletrônica em mãos francesas"
 france_md.600.b: "Deixá-lo ir para um comprador europeu"
 france_md.601.t: "O Muro do Crédito"
 france_md.601.d: "A France Telecom deve mais do que qualquer empresa já deveu, as aquisições que formaram a dívida valem uma fração do que foi pago, e os bancos não vão rolá-la de novo. O Estado pode injetar dinheiro público numa empresa de capital aberto, ou deixar os credores decidirem o que a operadora nacional se tornará."
 france_md.601.a: "Recapitalizar a operadora com dinheiro público"
 france_md.601.b: "Deixar os credores reestruturá-la"
 france_md.602.t: "O Estado Perde a Maioria"
 france_md.602.d: "Vender a participação do Estado na France Telecom abaixo de cinquenta por cento levantaria muito dinheiro e encerraria a discussão em Bruxelas sobre uma incumbente estatal competindo em um mercado aberto. Também significaria que a próxima decisão sobre a rede telefônica da França seria tomada por acionistas."
 france_md.602.a: "Manter a maioria estatal"
 france_md.602.b: "Vender abaixo de cinquenta por cento"
 france_md.603.t: "Depois de Crolles2"
 france_md.603.d: "A aliança compartilhada em Crolles deu a três empresas um processo de ponta que nenhuma teria podido bancar sozinha, e duas delas agora estão saindo. Financiar a substituta significa o Estado assumir um programa de pesquisa que seus parceiros abandonaram. Recusar significa que uma empresa francesa desenvolve o nó sozinha, ou desiste de tentar."
 france_md.603.a: "Financiar o que substituirá a aliança"
 france_md.603.b: "Deixar a campeã nacional assumir sozinha"
 france_md.604.t: "Desfazendo a ST-Ericsson"
 france_md.604.d: "A ST-Ericsson, a joint venture que a STMicroelectronics montou com a Ericsson para ser a campeã europeia de telefonia sem fio, perdeu dinheiro em todos os trimestres de sua existência, e os fabricantes de aparelhos que ela deveria atender agora projetam o próprio silício. Resgatá-la compraria tempo para um negócio cujo mercado já se moveu. Desfazê-la baixa a contabilidade da última tentativa europeia séria de chipset móvel."
 france_md.604.a: "Resgatar a empreitada sem fio"
 france_md.604.b: "Desfazê-la e assumir os prejuízos"
 france_md.605.t: "O IPCEI de Microeletrônica"
 france_md.605.d: "Bruxelas permitirá o que antes proibia: dinheiro público, em larga escala, para capacidade de semicondutores. Crolles poderia ser ampliada para algo que importe ao continente, e não a uma só empresa. É uma corrida de subsídios que a França não começou e não pode vencer sozinha, e a alternativa é não competir nela."
 france_md.605.a: "Financiar a expansão de Crolles"
 france_md.605.b: "Deixar a capacidade ao mercado"
 france_md.606.t: "O que a República Manteve"
 france_md.606.d: "Um quarto de século de resgates, vendas, alianças e subsídios definiu o que foi feito da Alcatel, da France Telecom e da STMicroelectronics: quais partes da rede telefônica e da indústria de semicondutores da França o Estado ainda possui, e quais apenas abriga."
 france_md.606.a: "Uma campeã que a República ainda possui"
 france_md.606.b: "Uma base de silício construída com dinheiro público"
 france_md.606.c: "Uma operadora que o Estado um dia resgatou"
 france_md.606.e: "Um mercado como qualquer outro"
 FRA_cs_nationalised_systems_champion: "Campeã de Sistemas Nacionalizada"
 FRA_cs_nationalised_systems_champion_desc: "O Estado nunca largou a maioria, então a rede e a indústria em torno dela respondem a Paris antes de responderem à cotação das ações. Custa ao Tesouro o que uma participação controladora sempre custa, e garante decisões que ficam no país."
 FRA_cs_state_backed_silicon_base: "Base de Silício Apoiada pelo Estado"
 FRA_cs_state_backed_silicon_base_desc: "O dinheiro público construiu capacidade de fabricação que nenhuma empresa francesa teria financiado sozinha, e os wafers são feitos na França. O subsídio é permanente porque a capacidade é, e ambos agora são fatos no terreno, e não argumentos."
 FRA_cs_recapitalised_national_operator: "Operadora Nacional Recapitalizada"
 FRA_cs_recapitalised_national_operator_desc: "O Estado pôs seu dinheiro quando ninguém mais o faria e a operadora sobreviveu a uma dívida que nenhuma empresa deveria ter carregado. Foi um resgate, e não uma estrutura, e resgates não duram."
 FRA_cs_market_like_any_other: "Um Mercado Como Qualquer Outro"
 FRA_cs_market_like_any_other_desc: "As campeãs foram vendidas, fundidas ou encerradas em termos comerciais comuns, e a França compra suas redes e seus chips de quem vender melhor. É eficiente, é ortodoxo, e nada estratégico é decidido aqui há muito tempo."
 france_md.554.t: "A França Propõe Exercícios Militares Conjuntos"
 france_md.554.d: "Diplomatas franceses nos enviaram uma proposta de treinamento militar conjunto. De fato, o recente aumento das tensões internacionais nos incentiva a nos unir entre os Estados europeus para nos preparar para o pior. Pode ser uma iniciativa muito boa para treinar nossas forças armadas para os conflitos de alta intensidade que podem eclodir a qualquer momento. O que devemos dizer a eles?"
 france_md.554.a: "Com prazer, treinaremos ao lado deles"
 france_md.554.b: "Não, obrigado, não precisamos da ajuda deles"
 france_md.359.t: "Monarquistas Tomam o Poder na França"
 france_md.359.d: "Notícia chocante de [FRA.GetNameWithFlag]: facções extremistas dentro do partido governante tomaram o controle e aboliram a Quinta República. A liderança moderada foi deixada de lado enquanto radicais restauram o governo monarquista. Esse golpe dramático contra a democracia chocou o mundo. Como devemos responder?"
 france_md.359.a: "Condenar essa tomada extremista"
 france_md.359.b: "Este é um assunto interno francês"
 FRA_country_chaos: "Boatos Alarmantes"
 FRA_country_chaos_desc: "Uma onda de pânico varreu o país. Circulam boatos sobre depósitos de armas saqueados e deserções em massa. Algo está se armando..."
 FRA_too_stable_tt: "§YEstabilidade abaixo de 25%§! concede o aumento máximo de popularidade do partido"
 FRA_too_europhile_tt: "§YEuropeísmo abaixo de 50%§! concede o aumento máximo de popularidade do partido"
 FRA_napoleon_army_reform_tt: "Reformas da Grande Armée concluídas: §Y[?FRA_grande_armee_reforms_completed|0]/3§!"
 FRA_6threp_tt: "Nos próximos eventos, você redigirá uma constituição, que poderá ou não ser a sua ao final do processo. Não se esqueça de agir rápido antes que o entusiasmo acabe"
 FRA_cfa_franc_user_exists_tt: "Pelo menos uma nação ainda usa o §YFranco CFA§!"
 FRA_eco_candidate_exists_tt: "Pelo menos uma nação ainda usa o §YFranco CFA§! ou o §YFranco CFA (África Central)§!"
 FRA_corporate_systems_ambition_ft_restructuring: "Reestruturação Ambition FT 2005"
 FRA_corporate_systems_ambition_ft_restructuring_desc: "Recapitalização, desinvestimentos e reformas operacionais estão reparando o balanço da France Télécom. O investimento em rede segue limitado enquanto o grupo restaura o fluxo de caixa."
 FRA_corporate_systems_french_national_champions: "Campeãs Nacionais Francesas"
 FRA_corporate_systems_french_national_champions_desc: "A França manteve empresas críticas, centros de pesquisa e infraestrutura sob forte direção nacional. A soberania e a resiliência são altas, mas o modelo exige apoio público contínuo e aceita menos integração com o exterior."
 FRA_corporate_systems_china_connected_infrastructure: "Infraestrutura Conectada à China"
 FRA_corporate_systems_china_connected_infrastructure_desc: "Fornecedores chineses tornaram-se centrais na modernização da rede da França. A implantação rápida e laços comerciais mais estreitos vêm com dependência duradoura em infraestrutura crítica e maiores riscos de substituição."
 FRA_corporate_systems_resilient_multivendor_network: "Rede Multifornecedor Resiliente"
 FRA_corporate_systems_resilient_multivendor_network_desc: "A França distribuiu as aquisições críticas de rede entre vários fornecedores e preservou a capacidade de substituir qualquer um deles. O resultado é menos concentrado e mais resiliente, embora a coordenação e a implantação sejam mais lentas."
 FRA_corporate_systems_events.1.a: "Reestruturar agressivamente"
 FRA_corporate_systems_events.1.a_tt: "Saúde da Alcatel: §G+0.8§!\nPressão da Dívida Corporativa: §G-0.6§!\nEstabilidade: §R-1.0%§!\nGanha §YReestruturação pelo Colapso das Telecomunicações§! por §Y730 dias§!.\nGanha um bônus de pesquisa de §G5%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.1.b: "Proteger a P&D estratégica"
 FRA_corporate_systems_events.1.b_tt: "Poder Político: §R-75§!\nSoberania Estratégica: §G+0.4§!\nSaúde da Alcatel: §G+0.6§!\nGanha um bônus de pesquisa de §G5%§! para §YEquipamento de Comando e Controle§!."
 FRA_corporate_systems_events.1.c: "Manter a linha"
 FRA_corporate_systems_events.1.c_tt: "Saúde da Alcatel: §R-1.0§!\nPressão da Dívida Corporativa: §R+0.8§!\nEstabilidade: §G+0.5%§!"
 FRA_corporate_systems_events.1.d: "O colapso do boom de equipamentos de telecomunicações deixou a Alcatel com pedidos em queda, capacidade ociosa e prejuízos crescentes. A empresa deve decidir o que preservar enquanto se reestrutura."
 FRA_corporate_systems_events.1.t: "A Bolha das Telecomunicações Estoura"
 FRA_corporate_systems_events.10.a: "Adquirir o negócio inteiro"
 FRA_corporate_systems_events.10.a_tt: "Soberania Estratégica: §G+0.2§!\nCapacidade de Semicondutores: §G+0.4§!\nSaúde da STMicroelectronics: §G+0.5§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.10.b: "Adquirir propriedade intelectual e ativos estratégicos"
 FRA_corporate_systems_events.10.b_tt: "Capacidade de Semicondutores: §G+0.2§!\nSaúde da STMicroelectronics: §G+0.3§!\nGanha um bônus de pesquisa de §G5%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.10.c: "Recusar a aquisição"
 FRA_corporate_systems_events.10.c_tt: "Saúde da STMicroelectronics: §G+0.2§!"
 FRA_corporate_systems_events.10.d: "A reestruturação da Alcatel colocou em dúvida o futuro de seus ativos de microeletrônica. A STMicroelectronics pode buscar o negócio inteiro, mirar apenas a tecnologia estratégica ou preservar capital para outras prioridades."
 FRA_corporate_systems_events.10.t: "A Microeletrônica da Alcatel Está à Venda"
 FRA_corporate_systems_events.11.a: "Expandir a aliança multinacional de P&D"
 FRA_corporate_systems_events.11.a_tt: "Soberania Estratégica: §R-0.1§!\nCapacidade de Semicondutores: §G+0.6§!\nGanha 2 bônus de pesquisa de §G10%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.11.b: "Construir um programa liderado pela França"
 FRA_corporate_systems_events.11.b_tt: "Poder Político: §R-75§!\nSoberania Estratégica: §G+0.5§!\nCapacidade de Semicondutores: §G+0.4§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.11.c: "Limitar nossa exposição de capital"
 FRA_corporate_systems_events.11.c_tt: "Capacidade de Semicondutores: §G+0.1§!\nSaúde da STMicroelectronics: §G+0.2§!"
 FRA_corporate_systems_events.11.d: "A Motorola está pronta para se juntar à STMicroelectronics e à Philips em Crolles2, ampliando a aliança em torno do desenvolvimento de processos avançados. Maior escala diluiria custos e conhecimento, mas também diluiria o controle puramente francês."
 FRA_corporate_systems_events.11.t: "A Aliança Crolles2 Se Expande"
 FRA_corporate_systems_events.13.a: "Consolidar o sem fio com a NXP"
 FRA_corporate_systems_events.13.a_tt: "Capacidade de Semicondutores: §G+0.5§!\nSaúde da STMicroelectronics: §G+0.2§!\nPressão da Dívida Corporativa: §R+0.3§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.13.b: "Manter o sem fio da ST independente"
 FRA_corporate_systems_events.13.b_tt: "Soberania Estratégica: §G+0.3§!\nSaúde da STMicroelectronics: §R-0.1§!\nGanha um bônus de pesquisa de §G5%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.13.c: "Desinvestir da exposição ao sem fio"
 FRA_corporate_systems_events.13.c_tt: "Capacidade de Semicondutores: §R-0.6§!\nSaúde da STMicroelectronics: §G+0.4§!"
 FRA_corporate_systems_events.13.d: "A STMicroelectronics e a NXP concordaram em combinar suas atividades de semicondutores sem fio. A empreitada oferece maior escala em chips móveis, mas concentrar dois negócios difíceis traz risco substancial de execução."
 FRA_corporate_systems_events.13.t: "ST-NXP Wireless"
 FRA_corporate_systems_events.14.a: "Formar a ST-Ericsson"
 FRA_corporate_systems_events.14.a_tt: "Integração Europeia: §G+0.5§!\nCapacidade de Semicondutores: §G+0.6§!\nPressão da Dívida Corporativa: §R+0.7§!\nGanha 2 bônus de pesquisa de §G10%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.14.b: "Exigir limites financeiros mais rígidos"
 FRA_corporate_systems_events.14.b_tt: "Integração Europeia: §G+0.5§!\nCapacidade de Semicondutores: §G+0.4§!\nPressão da Dívida Corporativa: §R+0.3§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.14.c: "Permanecer independente"
 FRA_corporate_systems_events.14.c_tt: "Soberania Estratégica: §G+0.4§!\nIntegração Europeia: §R-0.2§!\nCapacidade de Semicondutores: §R-0.3§!"
 FRA_corporate_systems_events.14.d: "A Ericsson Mobile Platforms poderia se juntar à ST-NXP Wireless em uma nova joint venture europeia. Combinar a experiência em modem, rádio e processadores de aplicações promete profundidade tecnológica, embora o negócio ampliado possa consumir capital substancial."
 FRA_corporate_systems_events.14.t: "Uma Campeã Europeia do Sem Fio"
 FRA_corporate_systems_events.16.a: "Realizar uma saída ordenada"
 FRA_corporate_systems_events.16.a_tt: "Capacidade de Semicondutores: §R-0.5§!\nSaúde da STMicroelectronics: §G+0.8§!\nPressão da Dívida Corporativa: §G-1.0§!\nEstabilidade: §R-0.5%§!\nGanha §YCustos de Saída da ST-Ericsson§! por §Y730 dias§!."
 FRA_corporate_systems_events.16.b: "Absorver tecnologia e pessoal"
 FRA_corporate_systems_events.16.b_tt: "Poder Político: §R-75§!\nSoberania Estratégica: §G+0.4§!\nCapacidade de Semicondutores: §R-0.2§!\nSaúde da STMicroelectronics: §G+0.3§!\nGanha um bônus de pesquisa de §G5%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.16.c: "Continuar financiando a empreitada"
 FRA_corporate_systems_events.16.c_tt: "Capacidade de Semicondutores: §G+0.3§!\nSaúde da STMicroelectronics: §R-0.7§!\nPressão da Dívida Corporativa: §R+1.2§!"
 FRA_corporate_systems_events.16.d: "Os prejuízos persistentes da ST-Ericsson esgotaram a paciência de seus donos. A França deve decidir quanta tecnologia, pessoal e risco financeiro a STMicroelectronics deve carregar para fora da empreitada fracassada."
 FRA_corporate_systems_events.16.t: "Desfazendo a ST-Ericsson"
 FRA_corporate_systems_events.17.a: "Ancorar a França no IPCEI"
 FRA_corporate_systems_events.17.a_military: "Eletrônica Militar do IPCEI"
 FRA_corporate_systems_events.17.a_tt: "Soberania Estratégica: §G+0.6§!\nIntegração Europeia: §G+1.0§!\nCapacidade de Semicondutores: §G+0.8§!\nGanha 2 bônus de pesquisa de §G10%§! para §YTecnologia de Microchips§!.\nGanha um bônus de pesquisa de §G5%§! para §YEquipamento de Comando e Controle§!."
 FRA_corporate_systems_events.17.b: "Buscar um programa França em primeiro lugar"
 FRA_corporate_systems_events.17.b_tt: "Poder Político: §R-125§!\nSoberania Estratégica: §G+0.9§!\nIntegração Europeia: §R-0.5§!\nCapacidade de Semicondutores: §G+0.6§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Microchips§!."
 FRA_corporate_systems_events.17.c: "Deixar o investimento ao mercado"
 FRA_corporate_systems_events.17.c_tt: "Capacidade de Semicondutores: §R-0.2§!\nSaúde da STMicroelectronics: §G+0.2§!"
 FRA_corporate_systems_events.17.d: "Cinco estados europeus aprovaram um projeto comum de microeletrônica abrangendo chips eficientes em energia, semicondutores de potência, sensores, sistemas ópticos e materiais avançados. A STMicroelectronics pode ancorar a França no programa ou seguir um caminho mais nacional."
 FRA_corporate_systems_events.17.t: "IPCEI Europeu de Microeletrônica"
 FRA_corporate_systems_events.20.a: "Adquirir a Orange e internacionalizar"
 FRA_corporate_systems_events.20.a_tt: "Infraestrutura Digital: §G+0.8§!\nSaúde da France Télécom/Orange: §G+0.8§!\nPressão da Dívida Corporativa: §R+1.2§!\nGanha um bônus de pesquisa de §G5%§! para §YTecnologia de Computação§!."
 FRA_corporate_systems_events.20.b: "Buscar uma estratégia móvel menor"
 FRA_corporate_systems_events.20.b_tt: "Infraestrutura Digital: §G+0.4§!\nSaúde da France Télécom/Orange: §G+0.4§!\nPressão da Dívida Corporativa: §R+0.4§!"
 FRA_corporate_systems_events.20.c: "Rejeitar a aquisição"
 FRA_corporate_systems_events.20.c_tt: "Infraestrutura Digital: §R-0.7§!\nPressão da Dívida Corporativa: §G-0.4§!"
 FRA_corporate_systems_events.20.d: "A France Télécom concordou em adquirir a Orange e sua rede móvel internacional. A compra poderia transformar a operadora pública em um grupo global de telecomunicações, mas o preço pressionará fortemente seu balanço."
 FRA_corporate_systems_events.20.t: "A France Télécom Adquire a Orange"
 FRA_corporate_systems_events.21.a: "Acordar e reconhecer os prejuízos"
 FRA_corporate_systems_events.21.a_tt: "Saúde da France Télécom/Orange: §R-0.4§!\nPressão da Dívida Corporativa: §R+0.5§!\nEstabilidade: §R-0.5%§!\nGanha §YPeso do Acordo da MobilCom§! por §Y730 dias§!."
 FRA_corporate_systems_events.21.b: "Fornecer financiamento-ponte garantido pelo Estado"
 FRA_corporate_systems_events.21.b_tt: "Poder Político: §R-100§!\nSoberania Estratégica: §G+0.4§!\nPressão da Dívida Corporativa: §R+0.2§!\nGanha §YPeso do Acordo da MobilCom§! por §Y365 dias§!."
 FRA_corporate_systems_events.21.c: "Contestar os passivos e enxugar"
 FRA_corporate_systems_events.21.c_tt: "Saúde da France Télécom/Orange: §R-0.5§!\nPressão da Dívida Corporativa: §G-0.2§!"
 FRA_corporate_systems_events.21.d: "A rápida expansão internacional da France Télécom culminou em severa exposição financeira em torno da MobilCom. A empresa deve acordar os passivos, buscar uma ponte estatal ou arriscar uma disputa prolongada."
 FRA_corporate_systems_events.21.t: "A Expansão Chega ao Limite"
 FRA_corporate_systems_events.22.a: "Recapitalizar e restaurar o fluxo de caixa"
 FRA_corporate_systems_events.22.a_tt: "Poder Político: §R-50§!\nSaúde da France Télécom/Orange: §G+1.2§!\nPressão da Dívida Corporativa: §G-1.5§!\nEstabilidade: §R-0.5%§!\nGanha §YReestruturação Ambition FT 2005§! por §Y730 dias§!."
 FRA_corporate_systems_events.22.b: "Tornar o Estado o principal salvador"
 FRA_corporate_systems_events.22.b_tt: "Poder Político: §R-125§!\nSoberania Estratégica: §G+0.5§!\nSaúde da France Télécom/Orange: §G+1.0§!\nPressão da Dívida Corporativa: §G-1.8§!"
 FRA_corporate_systems_events.22.c: "Evitar a diluição e cortar investimentos"
 FRA_corporate_systems_events.22.c_tt: "Infraestrutura Digital: §R-0.6§!\nPressão da Dívida Corporativa: §G-1.0§!\nEstabilidade: §R-1.0%§!\nGanha §YReestruturação Ambition FT 2005§! por §Y730 dias§!."
 FRA_corporate_systems_events.22.d: "A France Télécom lançou o Ambition FT 2005 para refinanciar sua dívida, restaurar o fluxo de caixa e reforçar o balanço. O resgate pode combinar recapitalização e desinvestimento, apoiar-se mais no Estado ou proteger os acionistas por meio de cortes mais profundos."
 FRA_corporate_systems_events.22.t: "Ambition FT 2005"
 FRA_corporate_systems_events.24.a: "Usar aquisições competitivas"
 FRA_corporate_systems_events.24.a_tt: "Infraestrutura Digital: §G+0.8§!\nEstabilidade: §G+0.5%§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.24.b: "Favorecer a Alcatel como fornecedora"
 FRA_corporate_systems_events.24.b_tt: "Soberania Estratégica: §G+0.4§!\nCapacidade de Telecomunicações: §G+0.4§!\nInfraestrutura Digital: §G+0.6§!\nSaúde da Alcatel: §G+0.5§!\nGanha um bônus de pesquisa de §G5%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.24.c: "Buscar fornecedores globais pela velocidade"
 FRA_corporate_systems_events.24.c_tt: "Soberania Estratégica: §R-0.5§!\nInfraestrutura Digital: §G+1.0§!\nDependência de Fornecedores Chineses: §R+2§!\nGanha um bônus de pesquisa de §G5%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.24.d: "Banda larga, Wi-Fi, 3G, televisão pela internet e serviços de voz estão convergindo em um único mercado nacional de redes. A France Télécom pode usar aquisições competitivas, apoiar a Alcatel como fornecedora estratégica ou buscar fornecedores globais para a máxima velocidade."
 FRA_corporate_systems_events.24.t: "A Rede de Banda Larga Convergente"
 FRA_corporate_systems_events.25.a: "Unir o grupo sob a Orange"
 FRA_corporate_systems_events.25.a_tt: "Infraestrutura Digital: §G+0.1§!\nSaúde da France Télécom/Orange: §G+0.5§!\nGanha um bônus de pesquisa de §G5%§! para §YTecnologia de Computação§!."
 FRA_corporate_systems_events.25.b: "Preservar a France Télécom no âmbito doméstico"
 FRA_corporate_systems_events.25.b_tt: "Soberania Estratégica: §G+0.2§!\nSaúde da France Télécom/Orange: §R-0.3§!"
 FRA_corporate_systems_events.25.c: "Separar as marcas de consumo e as estratégicas"
 FRA_corporate_systems_events.25.c_tt: "Soberania Estratégica: §G+0.1§!\nInfraestrutura Digital: §G+0.2§!"
 FRA_corporate_systems_events.25.d: "Após mais de uma década de integração, a France Télécom está pronta para adotar Orange como o nome de todo o grupo. Uma identidade global unificada oferece clareza, embora a França possa preservar uma marca doméstica ou estratégica distinta."
 FRA_corporate_systems_events.25.t: "A France Télécom Torna-se Orange"
 FRA_corporate_systems_events.26.a: "Executar o plano de investimento em rede"
 FRA_corporate_systems_events.26.a_tt: "Poder Político: §R-50§!\nInfraestrutura Digital: §G+1.0§!\nGanha um bônus de pesquisa de §G5%§! para §YEquipamento de Comando e Controle§!."
 FRA_corporate_systems_events.26.b: "Acelerar a implantação estratégica de fibra"
 FRA_corporate_systems_events.26.b_tt: "Poder Político: §R-100§!\nSoberania Estratégica: §G+0.3§!\nInfraestrutura Digital: §G+1.5§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.26.c: "Adiar os gastos de capital"
 FRA_corporate_systems_events.26.c_tt: "Infraestrutura Digital: §R-0.5§!\nSaúde da France Télécom/Orange: §G+0.2§!"
 FRA_corporate_systems_events.26.d: "A Orange preparou um grande programa de investimento em redes fixas e móveis, incluindo uma extensa implantação de fibra por toda a França. O Estado pode tratar isso como uma expansão comercial, acelerá-la como infraestrutura estratégica ou adiar a despesa."
 FRA_corporate_systems_events.26.t: "Fibra como Infraestrutura Nacional"
 FRA_corporate_systems_events.27.a: "Escolher Nokia e Ericsson"
 FRA_corporate_systems_events.27.a_tt: "Soberania Estratégica: §G+0.5§!\nIntegração Europeia: §G+0.8§!\nInfraestrutura Digital: §G+0.6§!\nDependência de Fornecedores Chineses: §G-1§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.27.b: "Dar um papel importante à Huawei"
 FRA_corporate_systems_events.27.b_tt: "Soberania Estratégica: §R-0.8§!\nInfraestrutura Digital: §G+0.8§!\nDependência de Fornecedores Chineses: §R+5§!\nUm evento de autorização do 5G se seguirá."
 FRA_corporate_systems_events.27.c: "Exigir uma rede equilibrada de fornecedores"
 FRA_corporate_systems_events.27.c_tt: "Soberania Estratégica: §G+0.1§!\nIntegração Europeia: §G+0.3§!\nInfraestrutura Digital: §G+0.5§!\nDependência de Fornecedores Chineses: §G-1§!\nGanha um bônus de pesquisa de §G5%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.27.d: "A Orange deve escolher os fornecedores de sua rede móvel de nova geração. Nokia e Ericsson oferecem continuidade dentro do ecossistema europeu de telecomunicações, a Huawei oferece implantação rápida, e uma rede equilibrada evitaria a dependência de um único fornecedor."
 FRA_corporate_systems_events.27.t: "Quem Constrói a Rede 5G da França?"
 FRA_corporate_systems_events.28.a: "Restringir as autorizações da Huawei"
 FRA_corporate_systems_events.28.a_tt: "Soberania Estratégica: §G+0.6§!\nIntegração Europeia: §G+0.3§!\nDependência de Fornecedores Chineses: §G-3§!\nGanha §YPeso da Substituição de Fornecedores 5G§! por §Y730 dias§!."
 FRA_corporate_systems_events.28.b: "Permitir a implantação de longo prazo"
 FRA_corporate_systems_events.28.b_tt: "Soberania Estratégica: §R-0.5§!\nInfraestrutura Digital: §G+0.4§!\nDependência de Fornecedores Chineses: §R+2§!"
 FRA_corporate_systems_events.28.c: "Exigir rápida diversificação de fornecedores"
 FRA_corporate_systems_events.28.c_tt: "Poder Político: §R-75§!\nSoberania Estratégica: §G+0.8§!\nCapacidade de Telecomunicações: §G+0.5§!\nDependência de Fornecedores Chineses: §G-4§!\nGanha §YPeso da Substituição de Fornecedores 5G§! por §Y548 dias§!."
 FRA_corporate_systems_events.28.d: "As autoridades de segurança francesas estão reconsiderando as autorizações de longo prazo para equipamentos da Huawei à medida que a implantação do 5G avança. As instalações existentes poderiam agora exigir uma substituição cara, a menos que o governo aceite uma dependência mais profunda e duradoura."
 FRA_corporate_systems_events.28.t: "Pressão pela Autorização do 5G"
 FRA_corporate_systems_events.3.a: "Aprovar a combinação com a Lucent"
 FRA_corporate_systems_events.3.a_tt: "Soberania Estratégica: §R-0.4§!\nCapacidade de Telecomunicações: §G+0.6§!\nSaúde da Alcatel: §G+0.7§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.3.b: "Exigir garantias estratégicas francesas"
 FRA_corporate_systems_events.3.b_tt: "Poder Político: §R-50§!\nSoberania Estratégica: §R-0.1§!\nSaúde da Alcatel: §G+0.5§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.3.c: "Opor-se à fusão"
 FRA_corporate_systems_events.3.c_tt: "Soberania Estratégica: §G+0.6§!\nCapacidade de Telecomunicações: §R-0.2§!\nSaúde da Alcatel: §R-0.5§!"
 FRA_corporate_systems_events.3.d: "A Alcatel e a Lucent propuseram uma fusão transatlântica destinada a unir seus portfólios de equipamentos de rede. O negócio promete escala, mas também levanta questões difíceis sobre integração e controle estratégico francês."
 FRA_corporate_systems_events.3.t: "Uma Campeã Transatlântica das Telecomunicações?"
 FRA_corporate_systems_events.6.a: "Reorientar para IP e banda larga"
 FRA_corporate_systems_events.6.a_tt: "Capacidade de Telecomunicações: §G+0.8§!\nSaúde da Alcatel: §G+1.0§!\nPressão da Dívida Corporativa: §G-0.5§!\nEstabilidade: §R-0.5%§!\nGanha §YReestruturação do Shift Plan§! por §Y730 dias§!.\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Internet§!."
 FRA_corporate_systems_events.6.b: "Construir uma campeã nacional protegida"
 FRA_corporate_systems_events.6.b_tt: "Poder Político: §R-125§!\nSoberania Estratégica: §G+0.8§!\nSaúde da Alcatel: §G+0.7§!\nGanha um bônus de pesquisa de §G10%§! para §YEquipamento de Comando e Controle§!."
 FRA_corporate_systems_events.6.c: "Rejeitar nova reestruturação"
 FRA_corporate_systems_events.6.c_tt: "Saúde da Alcatel: §R-0.9§!\nPressão da Dívida Corporativa: §R+0.6§!"
 FRA_corporate_systems_events.6.d: "A Alcatel-Lucent propõe uma reorientação decisiva para redes IP, sistemas em nuvem e infraestrutura de ultra banda larga. O plano poderia restaurar um núcleo tecnológico viável, mas somente após outra exigente reestruturação."
 FRA_corporate_systems_events.6.t: "O Shift Plan"
 FRA_corporate_systems_events.7.a: "Fazer cumprir os compromissos de P&D"
 FRA_corporate_systems_events.7.a_military: "Compromissos Militares de P&D"
 FRA_corporate_systems_events.7.a_tt: "Soberania Estratégica: §G+0.4§!\nIntegração Europeia: §G+0.4§!\nGanha um bônus de pesquisa de §G10%§! para §YTecnologia de Internet§!.\nGanha um bônus de pesquisa de §G5%§! para §YEquipamento de Comando e Controle§!."
 FRA_corporate_systems_events.7.b: "Permitir integração irrestrita"
 FRA_corporate_systems_events.7.b_tt: "Soberania Estratégica: §R-0.3§!\nSaúde da Alcatel: §G+0.4§!"
 FRA_corporate_systems_events.7.c: "Buscar controle francês excepcional"
 FRA_corporate_systems_events.7.c_tt: "Soberania Estratégica: §G+0.6§!\nIntegração Europeia: §R-0.5§!\nSaúde da Alcatel: §R-0.3§!"
 FRA_corporate_systems_events.7.d: "A Nokia agora controla a Alcatel-Lucent, trazendo a antiga campeã francesa para um grupo europeu de redes maior. A França deve determinar com que firmeza fazer cumprir os compromissos de pesquisa, emprego e capacidades estratégicas."
 FRA_corporate_systems_events.7.t: "Um Pilar Francês Dentro da Nokia"
 FRA_corporate_systems_mobilcom_settlement_burden: "Peso do Acordo da MobilCom"
 FRA_corporate_systems_mobilcom_settlement_burden_desc: "A France Télécom reconheceu grandes passivos ligados à MobilCom e à sua rápida expansão. O acordo reduz a incerteza, mas financiá-lo limita o investimento."
 FRA_corporate_systems_shift_plan_restructuring: "Reestruturação do Shift Plan"
 FRA_corporate_systems_shift_plan_restructuring_desc: "A Alcatel-Lucent concentra-se em redes IP, sistemas em nuvem e infraestrutura de ultra banda larga enquanto corta custos e vende ativos não essenciais. A transição limita temporariamente a produção enquanto a empresa reconstrói seu portfólio tecnológico."
 FRA_corporate_systems_telecom_crash_restructuring: "Reestruturação pelo Colapso das Telecomunicações"
 FRA_corporate_systems_telecom_crash_restructuring_desc: "A Alcatel está fechando instalações e reduzindo capacidade após o colapso do mercado de equipamentos de telecomunicações. As medidas aliviam a pressão de longo prazo sobre o balanço, mas perturbam a produção industrial e o emprego no curto prazo."
 FRA_corporate_systems_vendor_replacement_burden: "Peso da Substituição de Fornecedores 5G"
 FRA_corporate_systems_vendor_replacement_burden_desc: "As restrições às autorizações da Huawei obrigam as operadoras a substituir equipamentos instalados e refazer os planos de implantação. A transição fortalece o controle de longo prazo sobre redes críticas, mas retarda a expansão."
 FRA_corporate_systems_wireless_exit_costs: "Custos de Saída da ST-Ericsson"
 FRA_corporate_systems_wireless_exit_costs_desc: "A dissolução da ST-Ericsson exige encargos de desvalorização, transferências de funcionários e uma divisão custosa de tecnologia e ativos. A saída elimina um dreno de longo prazo, mas perturba a pesquisa sem fio no curto prazo."
