 arm_foreign_legion.1.t: "Légion étrangère arménienne"
 arm_foreign_legion.1.d: "Nous nous sommes inspirés de l’exemple de la Légion étrangère française et avons décidé de créer une unité similaire dans notre armée. Maintenant, il s’agit de l’équipement technique de la légion, et nous avons l’intention de faire appel à des spécialistes français et indiens pour aider dans cette entreprise."
 arm_foreign_legion.1.a: "Super."
 arm_foreign_legion.2.t: "Légion étrangère arménienne"
 arm_foreign_legion.2.d: "Finalement, notre nouvelle unité, la Légion étrangère, a été créée. Désormais, les citoyens d'autres pays, entre autres, ont la possibilité d'obtenir notre nationalité en servant dans la Légion pendant plusieurs années et en versant leur sang pour le bien de l'Arménie."
 arm_foreign_legion.2.a: "Super."
 arm_foreign_legion.3.t: "Légion étrangère arménienne"
 arm_foreign_legion.3.d: "Le gouvernement arménien propose de nous envoyer une unité de la Légion étrangère. Il affirme qu'il s'agit de combattants expérimentés, bien équipés techniquement et entraînés au combat, qui seront certainement d'une grande utilité dans la situation actuelle."
 arm_foreign_legion.3.a: "Nous les laisserons entrer."
 arm_foreign_legion.3.b: "Pas intéressant."
 arm_foreign_legion.4.t: "Notre Légion étrangère"
 arm_foreign_legion.4.d: "[FROM.GetName] a accepté d'accueillir notre légion étrangère sur son territoire afin de contribuer à stabiliser la situation actuelle, et nous sommes très satisfaits de notre coopération."
 arm_foreign_legion.4.a: "Sympa."
 arm_foreign_legion.5.t: "Notre Légion étrangère"
 arm_foreign_legion.5.d: "[FROM.GetName] a refusé d'accepter notre légion étrangère sur son territoire, considérant sa présence comme inutile."
 arm_foreign_legion.5.a: "Triste."
 arm_foreign_legion.6.t: "Notre Légion étrangère"
 arm_foreign_legion.6.d: "Les soldats de notre légion étrangère ont achevé leur mission et rentrent dans leur patrie."
 arm_foreign_legion.6.a: "Bienvenue à la maison."
