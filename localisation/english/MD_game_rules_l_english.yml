 #Cuba
 CUB_AI_BEHAVIOR: "@CUB Cuba"
 RULE_OPTION_CUB_HISTORICAL: "Historical"
 RULE_OPTION_CUB_HISTORICAL_DESC: "Fidel hands the presidency to his brother and the §8Partido Comunista de Cuba§! keeps the island on one party, licensing small trades while courting Caracas and Moscow for oil. The embargo holds, the Special Period never quite ends, and Havana stays the awkward exception in Washington's hemisphere."
 RULE_OPTION_CUB_PRO_WESTERN_REFORM: "Fidel Opens the Island"
 RULE_OPTION_CUB_PRO_WESTERN_REFORM_DESC: "Castro dismantles the command economy himself, licensing banks, restoring the church and writing a constitution that admits rival parties under the §8pro-Western wing of the Partido Comunista§!. Havana settles the Guantanamo question with Washington, recognises Taipei and ends up drilling alongside NATO."
 RULE_OPTION_CUB_DIAZ_CANEL: "The Diaz-Canel Thaw"
 RULE_OPTION_CUB_DIAZ_CANEL_DESC: "Miguel Diaz-Canel takes the palace ahead of Raul, unbans the §8Unión Liberal Cubana§! and calls the first contested elections since the revolution. Censorship is dismantled and foreign capital returns, and Cuba becomes an ordinary Caribbean republic without a shot fired."
 RULE_OPTION_CUB_NEW_SOCIALISM: "The Second Revolution"
 RULE_OPTION_CUB_NEW_SOCIALISM_DESC: "Diaz-Canel abandons the opening halfway, rebuilds the one-party state around a younger cadre and trades openly with Pyongyang. Cuba joins the CSTO and hands Russia its bases back, putting a Russian garrison ninety miles from Florida."
 RULE_OPTION_CUB_NATIONALIST: "Cuba for the Cubans"
 RULE_OPTION_CUB_NATIONALIST_DESC: "The §8Cuban Falanga§! seizes the state, purges communists and democrats alike and rebuilds the army around a youth labour corps. Havana then claims the whole basin as its birthright, and Haiti, Jamaica and the isthmus are annexed one by one."
 RULE_OPTION_CUB_RESTORED_REPUBLIC: "The Republic Restored"
 RULE_OPTION_CUB_RESTORED_REPUBLIC_DESC: "The §8Partido Social-Revolucionario Democrático de Cuba§! wins power, frees the political prisoners and rewrites the constitution around a multi-party parliament. Cuba then invites its neighbours into a Caribbean federation instead of conquering them."

 #Bosnia
 BOS_AI_BEHAVIOR: "@BOS Bosnia and Herzegovina"
 RULE_OPTION_BOS_HISTORICAL: "The Dayton Order"
 RULE_OPTION_BOS_HISTORICAL_DESC: "The rotating presidency holds under international supervision, and the §8Party of Democratic Action§! shares the state with its Serb and Croat rivals instead of beating them. Bosnia rebuilds behind NATO and European peacekeepers and edges toward Brussels without ever settling what the country is."
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP: "Srpska Takes the Chair"
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP_DESC: "The §8Alliance of Independent Social Democrats§! wins the presidency and turns Sarajevo toward Belgrade and Moscow while leaving the federation intact. Bosnia leaves the Western orbit by agreement rather than by force, and Russia gains a second foothold in the Balkans."
 RULE_OPTION_BOS_SRPSKA_UNION: "Srpska First"
 RULE_OPTION_BOS_SRPSKA_UNION_DESC: "The §8Serb Democratic Party§! centralises the whole country under Banja Luka and negotiates a union with Serbia. Bosnia is folded into a greater Serbian state, and its neighbours wake up to a redrawn map."
 RULE_OPTION_BOS_ISLAMIST_REVIVAL: "The Bosniak Awakening"
 RULE_OPTION_BOS_ISLAMIST_REVIVAL_DESC: "Bosniak grievance hardens into a religious revival, and the §8National Awakening§! rearms the republic to finish the war on its own terms. Bosnia sends the peacekeepers home and turns on its entities and then on its neighbours."
 RULE_OPTION_BOS_WORKERS_STATE: "The Workers' Councils"
 RULE_OPTION_BOS_WORKERS_STATE_DESC: "Mass unemployment carries the §8Workers' Front§! past the ethnic parties, and Bosnia's industry passes to councils of the people who staff it. The state turns secular and self-managing, and it answers to neither Brussels nor Belgrade."

