 ENERGY_POLICY_AUTOMATION_SHORT: "Авто"
 ENERGY_POLICY_AUTOMATION_TT: "§YАвтоматическая политика потребления§!\nАвтоматически корректирует политику потребления на один уровень при еженедельном расчёте энергобаланса. Она ужесточает ограничения при показателях ниже §R95%§! устойчивой обеспеченности энергией и ослабляет ограничения или увеличивает потребление при показателях выше §G110%§!. Для дополнительного потребления требуется, чтобы аккумуляторные парки были заполнены как минимум на §Y95%§! (если они вообще есть). Импорт энергии и подтверждённый экспорт учитываются, а отбор из аккумуляторных парков — нет. При выборе политики вручную автоматика отключается."
