 mercosur.28.t: "Регистрация завершена"
 mercosur.28.d: "Длительный процесс вступления [FROM.GetName] подошел к концу. После переговоров, институциональных реформ и последовательного подтверждения приверженности этому процессу больше не осталось никаких сомнений: теперь эта страна является полноправным членом МЕРКОСУР."
 mercosur.28.a: "К нам присоединился новый участник."
 mercosur.29.t: "Официальное оформление членства"
 mercosur.29.d: "Путь, проложенный с помощью [FROM.GetName], наконец-то подошел к концу. То, что начиналось как осторожные шаги по сближению, завершилось полным признанием, и теперь наше членство в МЕРКОСУР носит официальный, а не временный характер."
 mercosur.29.a: "Мы присоединяемся к блоку."
 mercosur.30.t: "Объявлен саммит стран Южной Америки"
 mercosur.30.d: "Был объявлен новый саммит стран Южной Америки, который станет первым шагом на пути к возобновлению регионального сотрудничества. Организаторы заявили, что необходимо оживить деятельность МЕРКОСУР, укрепить экономическую координацию и обеспечить континенту более весомый коллективный голос в мировых делах. Сторонники этой инициативы приветствуют её как давно назревшее возвращение к региональным амбициям, в то время как критики задаются вопросом, сможет ли Южная Америка выйти за рамки символических жестов и перейти к устойчивой интеграции."
 mercosur.30.a: "Начинается новый этап в жизни региона."
 mercosur.31.t: "[FROM.GetName] присоединяется к МЕРКОСУР в качестве ассоциированного члена"
 mercosur.31.d: "[FROM.GetName] согласилась присоединиться к МЕРКОСУР в качестве ассоциированного члена, что стало новым шагом на пути к возрождению регионального сотрудничества в Южной Америке. Хотя статус ассоциированного члена не равнозначен полноправному членству, он открывает путь к укреплению торговых связей, политической координации и будущим переговорам о вступлении. Сторонники этого шага рассматривают его как признак того, что МЕРКОСУР вновь становится серьезной региональной силой."
 mercosur.31.a: "Этот блок растёт."
 mercosur.32.t: "[FROM.GetName] становится полноправным членом МЕРКОСУР"
 mercosur.32.d: "[FROM.GetName] вступила в МЕРКОСУР в качестве полноправного члена. То, что начиналось как региональная дипломатия, теперь превратилось в реальное расширение самого блока, усилив его экономический вес и политическое значение во всей Латинской Америке. Для сторонников интеграции это больше, чем просто дипломатический успех. Это доказательство того, что МЕРКОСУР по-прежнему способен определять будущее континента."
 mercosur.32.a: "Новый член — более сильный блок."
 BRA_unasul: "Создать УНАСУЛ"
 BRA_unasul_desc: "Сотрудничество в Южной Америке не должно больше оставаться временной инициативой. Настало время преобразовать его в постоянную региональную организацию. Создав структуру, объединяющую политический диалог, развитие инфраструктуры и социальное сотрудничество, мы сможем вывести единство Южной Америки на новый уровень."
 MER_expansion_unasul: "Расширить UNASUL"
 MER_expansion_unasul_desc: "Чтобы УНАСУЛ стала подлинно континентальной структурой, ей необходимо расширить круг участников, сохранив при этом политический импульс. Привлекая к проекту больше государств, мы сможем укрепить его легитимность как общею южноамериканской организации."
 MER_sa_corridor_development: "Развитие Южноамериканского коридора"
 MER_sa_corridor_development_desc: "Континентальная интеграция не может существовать одними лишь декларациями. Дороги, порты, железные дороги, телекоммуникации и внутренние транспортные коридоры должны быть соединены, чтобы трансграничное передвижение и торговля стали реальностью, а не оставались лишь словами."
 MER_counter_cartel: "Сотрудничество в борьбе с картелями"
 MER_counter_cartel_desc: "Незаконный оборот наркотиков, контрабанда оружия и транснациональные преступные организации ставят под угрозу как стабильность в Южной Америке, так и региональную интеграцию. Мы должны активизировать обмен разведывательной информацией и совместные действия для противодействия угрозам, которые не знают национальных границ."
 MER_sa_energy_council: "Южноамериканский энергетический совет"
 MER_sa_energy_council_desc: "Благодаря наличию нефти, газа, гидроэнергетики и крупных сетей электропередачи Южная Америка обладает огромным потенциалом для сотрудничества в энергетической сфере. Вместо того чтобы допускать превращение этих ресурсов в предмет соперничества, нам следует стремиться к региональной стабильности и взаимодополняемости."
 MER_sa_health_council: "Южноамериканский совет по вопросам здравоохранения"
 MER_sa_health_council_desc: "Сотрудничество в сфере здравоохранения не столь зрелищно, как геополитика, но является одной из наиболее практичных и эффективных областей южноамериканской интеграции. Координируя меры по эпиднадзору, обеспечению лекарственными средствами и подготовке медицинских кадров, мы можем продемонстрировать интеграцию на примере повседневной жизни."
 MER_productive_integration_and_sme_networks: "Продуктивная интеграция и сети МСП"
 MER_productive_integration_and_sme_networks_desc: "Региональная интеграция не должна ограничиваться крупными корпорациями и экспортом сырьевых товаров. Поощряя развитие малого и среднего бизнеса, региональных цепочек поставок и взаимодополняемости производств, мы сможем обеспечить этому проекту более прочную экономическую основу."
 MER_sa_defense_council: "Южноамериканский совет по вопросам обороны"
 MER_sa_defense_council_desc: "Безопасность Южной Америки не должна зависеть исключительно от внешних факторов. Прежде чем ставить перед собой грандиозные военные цели, регион должен сформировать традиции диалога, прозрачности и скоординированного кризисного управления в сфере обороны."
 MER_sa_network_for_science_and_innovation: "Южноамериканская сеть инноваций"
 MER_sa_network_for_science_and_innovation_desc: "Чтобы интеграция способствовала развитию в будущем, Южная Америка должна объединить не только рынки и ресурсы, но и знания и инновации. Научное сотрудничество может укрепить самостоятельное развитие континента."
 MER_unasul_factions: "Объединенная организация обороны УНАСУЛ"
 MER_unasul_factions_desc: "Настало время вывести южноамериканское единство за рамки чисто политического сотрудничества. Для обеспечения региональной безопасности и коллективного противодействия внешнему давлению и дестабилизационным факторам мы должны институционализировать сотрудничество в области обороны в рамках УНАСУЛ и создать новую совместную оборонную организацию, объединяющую страны Южной Америки."
 unasul_member_state_modifier: "Государство-член УНАСУЛ"
 unasul_member_state_modifier_desc: "UNASUL перестраивается в континентальную структуру для политической координации, развития и совместных действий в Южной Америке. Ее преимущества растут по мере присоединения новых членов и расширения сферы деятельности организации за счет новых советов и программ.\n\n§YЭтот национальный дух усиливается по мере увеличения числа государств-членов UNASUL.§!"
 MER_unasul_integrated_corridor_plan_modifier: "План интегрированного коридора UNASUL"
 MER_unasul_integrated_corridor_plan_modifier_desc: "UNASUL запустила скоординированный раунд инвестиций в дорожное строительство, логистику и цифровые связи по всей Южной Америке. На данный момент государства-члены строят транспортную и сетевую инфраструктуру быстрее, чем обычно."
 MER_unasul_energy_security_modifier: "Инициатива UNASUL по обеспечению энергетической безопасности"
 MER_unasul_energy_security_modifier_desc: "АНАСУЛ выделила ресурсы в масштабах всего блока на повышение энергетической устойчивости. В настоящее время государства-члены ускоряют строительство электростанций, работающих на ископаемом топливе, атомной энергии и возобновляемых источниках энергии, в рамках общей региональной программы."
 MER_unasul_joint_exercises_modifier: "Совместные учения УНАСУЛ"
 MER_unasul_joint_exercises_modifier_desc: "В настоящее время вооруженные силы UNASUL участвуют в скоординированном раунде совместных учений, обмена штабами и планирования оперативной совместимости."
 MER_invite_to_unasul: "Пригласить [FROM.GetName] в UNASUL"
 MER_invite_to_unasul_desc: "Начать официальные переговоры с [FROM.GetName] о вступлении в UNASUL. Уровень принятия зависит от мнения страны о нас, нашего влияния на неё и прогресса в развитии дерева UNASUL."
 MER_unasul_integrated_corridor_plan: "Запуск комплексного плана развития коридора"
 MER_unasul_integrated_corridor_plan_desc: "Направить средства из казначейства на ускорение строительства транспортных и сетевых объектов во всех странах-членах UNASUL на 180 дней."
 MER_unasul_counter_cartel_operation: "Начать операцию по противодействию картельному альянсу"
 MER_unasul_counter_cartel_operation_desc: "Призываем всех членов UNASUL, страдающих от влияния картелей, внести политический капитал в скоординированную операцию по борьбе с картелями. Конечный результат зависит от того, сколько государств полностью возьмут на себя обязательства."
 MER_unasul_counter_cartel_operation_tt: "Каждому члену UNASUL, пострадавшему от влияния картелей, будет предложено внести политический вклад в операцию. Окончательный результат зависит от того, насколько активно участвующие правительства поддержат репрессии."
 MER_unasul_energy_security_reinforcement: "Укрепление энергетической безопасности Южной Америки"
 MER_unasul_energy_security_reinforcement_desc: "Направить средства из казначейства на ускорение строительства объектов, использующих ископаемое топливо, атомную энергетику и возобновляемые источники энергии, во всех странах-членах UNASUL в течение 180 дней."
 MER_unasul_joint_health_improvement_project: "Запуск совместного проекта UNASUL по улучшению здоровья населения"
 MER_unasul_joint_health_improvement_project_desc: "Запустите 180-дневный проект по координации здравоохранения. По его завершении UNASUL получит устойчивое увеличение ежемесячного прироста населения. Этот проект может быть повторен до четырех раз.\n\n§YБлагодаря этой программе ежемесячный прирост населения UNASUL может достигать в общей сложности +10%.§!"
 MER_unasul_supply_chain_strengthening: "Укрепление южноамериканских цепочек поставок"
 MER_unasul_supply_chain_strengthening_desc: "Запустить 180-дневный проект по координации цепочки поставок. По его завершении UNASUL получит устойчивое повышение производительности гражданской промышленности. Такой проект может быть реализован до четырех раз.\n\n§YБлагодаря этой проектной линии производительность гражданской промышленности UNASUL может достичь в общей сложности +15%.§!"
 MER_unasul_joint_exercises: "Начало совместных учений UNASUL"
 MER_unasul_joint_exercises_desc: "Профинансировать 180-дневный цикл совместных учений UNASUL, направленных на повышение ежедневного опыта действий сухопутных, военно-морских и военно-воздушных сил в странах блока."
 MER_unasul_joint_research_exchange_project: "Запуск совместного проекта научно-технического обмена UNASUL"
 MER_unasul_joint_research_exchange_project_desc: "Запустите 180-дневную программу координации исследований. По её завершении UNASUL получит постоянное увеличение скорости исследований. Эту программу можно повторять до четырёх раз.\n\n§YБлагодаря этой программе скорость проведения исследований в UNASUL может увеличиться до +10%.§!"
 mercosur.35.t: "Приглашение присоединиться к UNASUL"
 mercosur.35.d: "[FROM.GetName] пригласил нас присоединиться к UNASUL, представив его как политическую площадку, под эгидой которой Южная Америка могла бы вновь научиться действовать сообща. Принятие этого предложения означало бы включение нас в проект, который обещает диалог, координацию и континентальные амбиции, но также ставит вопрос о готовности нас к более широкой региональной стратегии."
 mercosur.35.a: "Присоединяйтесь к UNASUL."
 mercosur.35.b: "Отклонить пока что."
 mercosur.36.t: "Приглашение в UNASUL отправлено."
 mercosur.36.d: "Начались дипломатические переговоры с [FROM.GetName] о вступлении в UNASUL. Приглашение отправлено, аргументы представлены, и теперь остается ждать, захочет ли другая столица сделать ставку на возвращение южноамериканских концертов."
 mercosur.36.a: "Продолжить."
 mercosur.37.t: "Приглашение в УНАСУЛ принято"
 mercosur.37.d: "[FROM.GetName] принял наше приглашение и вступил в UNASUL. То, что еще недавно обсуждалось в речах и коммюнике, начинает обретать форму реального континентального института."
 mercosur.37.a: "Отличный."
 mercosur.38.t: "Приглашение в УНАСУЛ отклонено"
 mercosur.38.d: "[FROM.GetName] пока отклонил наше приглашение присоединиться к UNASUL. Мечта о более широкой южноамериканской структуре не была отвергнута полностью, но и доверия она пока не завоевала."
 mercosur.38.a: "Попробуем позже."
 mercosur.39.t: "Членство в UNASUL принято."
 mercosur.39.d: "Мы приняли приглашение [FROM.GetName] и присоединились к UNASUL. Как бы неопределенно ни выглядело будущее южноамериканской интеграции, мы решили не оставаться в стороне."
 mercosur.39.a: "Южная Америка в более широком масштабе."
 mercosur.40.t: "[FROM.GetName] присоединяется к UNASUL"
 mercosur.40.d: "[FROM.GetName] присоединился к UNASUL, добавив еще один голос, еще одну бюрократическую структуру и еще одни национальные амбиции в формирующуюся южноамериканскую структуру. С каждым присоединением проект все труднее воспринимать как ностальгию и все легче представить как устойчивый политический факт."
 mercosur.40.a: "Континент продолжает выравниваться."
 mercosur.50.t: "Приведен в действие комплексный план развития коридора."
 mercosur.50.d: "Комплексный план развития коридоров, разработанный UNASUL, перешел от обсуждений за столами конференций к топографическим картам и полевым планам. По всему континенту министерства, инженеры и планировщики пытаются превратить язык интеграции в дороги, связи и коридоры, которые государства смогут реально ощутить на себе."
 mercosur.50.a: "Продолжайте строить."
 mercosur.51.t: "Запущен совместный проект в области здравоохранения."
 mercosur.51.d: "В рамках UNASUL стартовала новая совместная инициатива в области здравоохранения. Официальные лица говорят о совместных закупках, общих мерах реагирования и улучшении координации, но за административной риторикой скрывается более масштабная цель: сделать региональную интеграцию ощутимой в работе клиник, аптек и повседневной жизни."
 mercosur.51.a: "За более здоровый континент."
 mercosur.52.t: "Завершен совместный проект в области здравоохранения."
 mercosur.52.d: "Последняя совместная инициатива в области здравоохранения завершилась, и ее наиболее успешные практики теперь интегрируются в постоянный механизм работы UNASUL. То, что начиналось как временная мера, превращается в привычку, придавая организации более человечный и осязаемый облик."
 mercosur.52.a: "Устойчивый рост."
 mercosur.53.t: "Инициатива по обеспечению энергетической безопасности активирована."
 mercosur.53.d: "UNASUL начала общеконтинентальную кампанию по обеспечению энергетической безопасности. Специалисты по планированию энергоснабжения, представители коммунальных служб и министры внезапно оказались в ситуации, когда их ресурсы стали источником стабильности, а не соперничества."
 mercosur.53.a: "Обеспечить континент энергией."
 mercosur.54.t: "Запущена инициатива по оптимизации цепочки поставок."
 mercosur.54.d: "Началась новая инициатива UNASUL по налаживанию цепочек поставок. Правительства, торговые палаты и технические агентства сейчас пытаются решить сложную задачу – обеспечить согласованность южноамериканского производства, а не его изолированное существование."
 mercosur.54.a: "Интегрировать рынок."
 mercosur.55.t: "Инициатива по развитию цепочки поставок завершена."
 mercosur.55.d: "Завершена последняя инициатива UNASUL в области управления цепочками поставок. Полученный практический опыт, налаженные коммерческие связи и административные методы больше не являются временными экспериментами; они становятся частью постоянной экономической архитектуры региона."
 mercosur.55.a: "Более сильная производственная база."
 mercosur.56.t: "Проводятся совместные учения."
 mercosur.56.d: "В настоящее время проходят совместные учения UNASUL. Офицеры, которые ранее знали друг друга только по официальному протоколу, встречаются в полевых условиях, обмениваются методами, проверяют предположения и изучают, как выглядит региональная координация на практике."
 mercosur.56.a: "Повысить готовность."
 mercosur.57.t: "Запущен проект обмена научными исследованиями."
 mercosur.57.d: "Началась новая инициатива UNASUL по обмену исследованиями и технологиями. Университеты, институты и технические агентства со всей Южной Америки вовлекаются в этот диалог в надежде, что регион сможет обмениваться идеями так же серьезно, как и товарами."
 mercosur.57.a: "Делитесь знаниями."
 mercosur.58.t: "Проект по обмену научными исследованиями завершен."
 mercosur.58.d: "Завершился последний этап обмена научными исследованиями и технологиями. Созданные в рамках проекта партнерские отношения сохранились и после его завершения, оставив после себя более разветвленную сеть контактов и укрепив убеждение в том, что знания, полученные в Южной Америке, можно систематизировать, а не просто разрознять."
 mercosur.58.a: "Знание непреходяще."
 mercosur.60.t: "Финансирование операции по борьбе с картелями"
 mercosur.60.d: "Миссия ООН по оказанию помощи населению (UNASUL) начала скоординированную операцию против влияния картелей. Вопрос, стоящий перед нами, заключается не в том, реальна ли угроза, а в том, насколько мы готовы использовать свой политический вес для поддержки регионального решения."
 mercosur.60.a: "Разрешить ограниченное межведомственное финансирование."
 mercosur.60.b: "Задействовать всю мощь государства для проведения этой операции."
 mercosur.61.t: "Операция по борьбе с картелями активизировалась."
 mercosur.61.d: "Большинство правительств стран-участниц UNASUL решили в полной мере поддержать операцию. Результатом стал не просто жест, а мощный региональный удар по картельным сетям, их покровителям и атмосфере страха, которая позволяет им существовать."
 mercosur.61.a: "Воспользуйтесь преимуществом."
 mercosur.62.t: "Операция по борьбе с картелями завершена."
 mercosur.62.d: "Операция продвигалась с более взвешенной поддержкой. Тем не менее, скоординированное давление дестабилизировало сети картелей и ослабило их возможности для маневрирования, хотя и не с той силой, которую мог бы обеспечить более сплоченный ответ."
 mercosur.62.a: "Полезный шаг."
 mercosur.75.t: "Приглашение присоединиться к оборонному пакту УНАСУЛ"
 mercosur.75.d: "[FROM.GetName] пригласил нас присоединиться к оборонной структуре UNASUL. Принятие приглашения означало бы нечто большее, чем просто подписание еще одного документа; это позволило бы нам стать частью военного соглашения, призванного показать как соседям, так и внешним сторонам, что Южная Америка намерена объединиться в условиях нарастающего давления."
 mercosur.75.a: "Присоединяйтесь к оборонному пакту."
 mercosur.75.b: "Отклонить."
 mercosur.76.t: "Приглашение к участию в оборонном пакте принято."
 mercosur.76.d: "[FROM.GetName] принял наше приглашение и присоединился к оборонному пакту UNASUL. Альянс еще молод, но каждое новое подписание придает ему больше доверия, больше веса и больше смысла, выходящего за рамки риторики."
 mercosur.76.a: "Альянс укрепляется."
 mercosur.77.t: "Приглашение к участию в оборонном пакте отклонено."
 mercosur.77.d: "[FROM.GetName] пока отказался вступать в оборонный пакт UNASUL. Несмотря на все заявления о региональной солидарности, не каждое правительство готово сделать оборонную политику частью общей южноамериканской истории."
 mercosur.77.a: "К сожалению."
 mercosur.78.t: "Мы присоединяемся к оборонному пакту УНАСУЛ"
 mercosur.78.d: "Мы приняли приглашение [FROM.GetName] и вступили в оборонный пакт UNASUL. Тем самым мы более тесно связали нашу безопасность с континентальной структурой, которая направлена на превращение политической близости в стратегическую приверженность."
 mercosur.78.a: "Южная Америка едина."
 mercosur.79.t: "Завершено согласование тарифов."
 mercosur.79.d: "Несколько недель переговоров, юридической экспертизы и работы над тарифами с потенциальным новым членом подошли к концу. На первый взгляд, процесс был техническим, но с политической точки зрения он имел важное значение по простой причине: еще один барьер между их рынком и нашим стал восприниматься как временный."
 mercosur.80.t: "Модернизация таможенной службы завершена."
 mercosur.80.d: "Завершена работа по реформированию таможенной системы в связи с потенциальным вступлением в МЕРКОСУР. Уточнены процедуры, ужесточен пограничный контроль, а административная политика государства приблизилась к требованиям, предъявляемым к полноценному членству в МЕРКОСУР."
 mercosur.81.t: "Приняты общие стандарты"
 mercosur.81.d: "Разработка общего пакета стандартов для потенциального нового члена завершена. Правила, которые раньше отражали удаленность, теперь переписываются с учетом совместимости, и их путь в блок выглядит все более реальным."
 mercosur.82.t: "Проект логистического коридора завершен"
 mercosur.82.d: "Проект логистического коридора для потенциального нового члена завершен. То, что раньше обсуждалось в абстрактных терминах, теперь обретает конкретные очертания в виде маршрутов, складов и практических связей, благодаря которым процесс вступления воспринимается скорее как реальное событие, а не как формальность."
 mercosur.83.t: "Завершены работы по модернизации транспортной инфраструктуры."
 mercosur.83.d: "Завершились последние транспортные работы, связанные с пакетом мер по присоединению потенциального нового члена. Расстояния никуда не исчезли, но карта теперь выглядит немного меньше, а перспектива интеграции — чуть менее теоретической."
 mercosur.84.t: "Программа по обеспечению связи завершена"
 mercosur.84.d: "Завершена разработка новой программы обеспечения связи для потенциального нового члена. Коммерческие перевозки, административные контакты и трансграничная координация теперь имеют более надежные каналы для осуществления."
 mercosur.85.t: "Выделены средства из фондов развития."
 mercosur.85.d: "Пакет мер по развитию для потенциального нового члена полностью выполнен. Более чем любое коммюнике, видимая приверженность такого масштаба показывает правительству страны, что МЕРКОСУР готов инвестировать в членство, а не просто просить о доверии."
 mercosur.86.t: "Завершено гражданское инвестирование"
 mercosur.86.d: "Этап привлечения гражданских инвестиций в рамках пакета документов для присоединения потенциального нового члена организации завершен. Теперь у предприятий, фирм и коммерческих районов есть более веские основания рассматривать региональную интеграцию как нечто конкретное, а не просто дипломатическое."
 mercosur.87.t: "Модернизация инфраструктуры завершена."
 mercosur.87.d: "Программа модернизации инфраструктуры для потенциального нового члена завершилась. Каждый завершенный проект несет в себе один и тот же политический посыл: вступление в ЕС — это не просто подписание договора, а переориентация связей страны с более широким регионом."
 mercosur.88.t: "Расширение коммерческой инфраструктуры"
 mercosur.88.d: "Проект коммерческой инфраструктуры для потенциального нового члена завершен. Теперь обещания МЕРКОСУР проявляются не только в речах, но и в более оживленных коридорах, улучшенной инфраструктуре и более четком ощущении взаимной зависимости."
 mercosur.89.t: "Соглашение об промышленных инвестициях принято."
 mercosur.89.d: "Соглашение о промышленных инвестициях с потенциальным новым членом вступило в силу. То, что когда-то было дипломатической договоренностью, превращается в экономические отношения, обладающие глубиной, ожиданиями и интересами, достаточно сильными, чтобы пережить торжественные формальности."
 mercosur.90.t: "Создана система коммерческих инвестиций."
 mercosur.90.d: "Создана основа для коммерческих инвестиций с потенциальным новым членом. Банки, фирмы и министерства теперь имеют более прочную связь друг с другом, а вместе с ней и более сильный стимул рассматривать присоединение как совместный труд, а не как символический жест."
 mercosur.91.t: "Пакет мер финансового сотрудничества реализован."
 mercosur.91.d: "Пакет финансового сотрудничества для потенциального нового члена принят. С учетом этого последнего элемента, процесс вступления в ЕС больше не выглядит предварительным; создается ощущение, что страна постепенно вовлекается во внутренний круг блока."
 mercosur.108.t: "Начался раунд финансирования из Фонда развития МЕРКОСУР."
 mercosur.108.d: "Начался новый этап работы Фонда развития МЕРКОСУР. Министерства, компании и местные власти по всему блоку воспримут это не просто как бухгалтерскую запись: это доказательство того, что интеграция по-прежнему требует финансирования, планирования и институциональной воли. И снова обещание развития переходит с бумаги в реальную практику."
 mercosur.108.a: "Пусть начнут поступать средства."
 mercosur.accession_project_complete.a: "Продолжить."
 mercosur.93.t: "Принятие полного членства"
 mercosur.93.d: "[FROM.GetName] принял наше предложение и немедленно вступил в МЕРКОСУР в качестве полноправного члена. Не будет длительного переходного периода, никаких тщательно спланированных ухаживаний, только внезапный политический факт роста блока сегодня."
 mercosur.93.a: "Отличный."
 mercosur.94.t: "Мы присоединяемся к МЕРКОСУР"
 mercosur.94.d: "Наш курс определен, и МЕРКОСУР больше не является форумом, недоступным нам, а структурой, в которой мы теперь живем изнутри. Прежняя неопределенность относительно нашего места в региональном порядке уступает место более суровой истине: мы находимся внутри блока, и континенту придется адаптироваться к этой реальности."
 mercosur.94.a: "Мы присоединяемся к блоку."
 mercosur.105.t: "Статус ассоциированного члена присвоен."
 mercosur.105.d: "Благодаря нашей петиции мы вошли в МЕРКОСУР в качестве ассоциированного государства. Это еще не самая узкая палата блока, но этого достаточно, чтобы показать, что наш политический и экономический горизонт теперь склоняется в сторону южноамериканской интеграции, а не от нее."
 mercosur.105.a: "Мы подходим ближе."
 mercosur.107.t: "Петиция в UNASUL одобрена."
 mercosur.107.d: "Наша петиция привела нас в UNASUL. Как бы неопределенно ни оставалось будущее южноамериканской интеграции, мы решили не наблюдать за этим экспериментом со стороны, а войти в него и занять свое место в создаваемой сейчас структуре."
 mercosur.107.a: "Мы присоединяемся к проекту."
 mercosur_news.1.t: "Создание УНАСУЛ"
 mercosur_news.1.d: "Страны Южной Америки объявили о создании УНАСУЛ (Юнайтед Ассул) как постоянной региональной организации, призванной объединить политический диалог, развитие инфраструктуры и социальное сотрудничество в рамках единой структуры. Этот шаг выводит единство Южной Америки на новый уровень, а региональная координация может стать более институциональной и устойчивой. Однако успех этого проекта будет зависеть от того, смогут ли его участники преодолеть различия в национальных интересах."
 mercosur_news.1.a: "Новый этап для Южной Америки"
 mercosur_news.2.t: "UNASUL заключает совместный оборонный пакт."
 mercosur_news.2.d: "UNASUL вышла за рамки экономической и политической координации и объявила о формировании нового южноамериканского оборонного пакта. Сторонники рассматривают это как естественное продолжение регионального единства, в то время как скептики предупреждают, что континент вступает в более напористую и потенциально вызывающую разногласия фазу блоковой политики."
 mercosur_news.2.a: "Южная Америка сплачивается."
 mercosur_news.3.t: "Участник организации UNASUL в шаге от завершения своей деятельности."
 mercosur_news.3.d: "[ROOT.GetNameWithFlag] объявил о своем выходе из Объединенного оборонного механизма UNASUL, вновь подняв сомнения, которые, как многие считали, были развеяны, когда Южная Америка впервые сформировала свои оборонительные линии. Сторонники выхода описывают это как возвращение к суверенной свободе действий; критики видят в этом первую видимую трещину в пакте, который зависел как от политического доверия, так и от формальных подписей. Теперь по всему континенту будет следить, окажется ли это единичным случаем или началом более масштабного распада."
 mercosur_news.3.a: "Этот пакт уже не выглядит нерушимым."
 UNASUL_faction: "Оборонный пакт УНАСУЛ"
 UNASUL_faction_DEF: "Оборонный пакт УНАСУЛ"
 MER_invite_to_unasul_TT: "§YПроцент одобрения определяется мнением страны о вас, вашим влиянием на неё и прогрессом дерева УНАСУЛ!§!"
 MER_request_mercosur_associate_membership_tt: "§YПодайте официальную петицию. По окончании периода рассмотрения мы присоединимся к МЕРКОСУР в качестве ассоциированного государства.§!"
 MER_request_mercosur_full_membership_tt: "§YПодайте официальное заявление. По окончании периода рассмотрения мы войдем в МЕРКОСУР в качестве полноправного члена.§!"
 MER_request_unasul_membership_tt: "§YПодайте официальное обращение. По истечении срока рассмотрения мы присоединимся к УНАСУЛ.§!"
 MER_unasul_member_tt: "Примените следующие модификаторы к §YUNASUL Member State§! для всех стран-членов."
 BRA_unasul_events_TT: "§YОтправить приглашения всем государствам-членам МЕРКОСУР присоединиться к УНАСУЛ!§!"
 MER_expansion_unasul_TT: "§GUnlock§! решения о приглашении стран Южной Америки в §YUNASUL§!!"
 mercosur.110.t: "Пересмотр демократической оговорки МЕРКОСУР"
 mercosur.110.d: "То, что произошло в [FROM.GetName], больше нельзя сбрасывать со счетов как внутреннее дело, имеющее исключительно внутригосударственное значение. Серьезный политический поворот в этой стране заставил усомниться в том, имеют ли открытая конкуренция и конституционные ограничения в ней еще какое-либо значение. По всему блоку министры и дипломаты открыто задаются вопросом: является ли демократическая оговорка МЕРКОСУРА серьезным обязательством или лишь формальной формулировкой. Мы должны решить, следует ли приостановить членство [FROM.GetName] или же блок пойдет на уступки ради сохранения южноамериканского рынка в неприкосновенности."
 mercosur.110.a: "Это положение должно быть выполнено."
 mercosur.110.b: "Дать последний шанс."
 mercosur.112.t: "МЕРКОСУР приостанавливает наш статус"
 mercosur.112.d: "Решение блока уже вынесено, и оно не оставляет места для сомнений. МЕРКОСУР счёл, что наш недавний курс пересек черту, установленную его демократической оговоркой, и теперь мы расплачиваемся за это в рамках самой организации. Южная Америка не отвернулась от нас навсегда, но решила отметить этот момент как событие, которое не могло остаться без ответа."
 mercosur.112.a: "Последствия вполне реальны."
 mercosur.113.t: "МЕРКОСУР предоставляет отсрочку с определенными условиями"
 mercosur.113.d: "МЕРКОСУР решил не исключать нас из своих рядов, но и не дал нам полного прощения. Мы остаемся в составе блока, вися над нами висит явная тень недоверия, и каждая столица региона понимает, что наше дальнейшее присутствие на южноамериканском рынке теперь зависит скорее от испытательного срока, чем от доверия."
 mercosur.113.a: "Мы по-прежнему находимся под пристальным вниманием."
 mercosur.114.t: "МЕРКОСУР приостанавливает членство одной из стран"
 mercosur.114.d: "После серьезного политического поворота в [FROM.GetName] дискуссии внутри МЕРКОСУР завершились принятием жесткого решения. Блок применил свою демократическую оговорку и приостановил членство [FROM.GetName], тем самым продемонстрировав, что южноамериканский рынок по-прежнему готов отстаивать политические принципы, на которых, по его утверждению, он основан."
 mercosur.114.a: "Блок проводит чёткую грань."
 mercosur.115.t: "МЕРКОСУР оставляет дверь приоткрытой"
 mercosur.115.d: "После серьезных политических перемен в [FROM.GetName] МЕРКОСУР не стал приостанавливать членство этой страны, однако это решение не означало одобрения. Блок решил на данный момент сохранить единство, одновременно вынеся [FROM.GetName] явное предупреждение, тем самым обеспечив, что вопрос о демократической легитимности будет и впредь бросать тень на ее положение в организации."
 mercosur.115.a: "Незначительная отсрочка."
 mercosur.117.t: "Пересмотр положения о демократии в УНАСУЛ"
 mercosur.117.d: "Последние события вокруг [FROM.GetName] вышли далеко за рамки внутренних споров в одной столице. Серьезный политический поворот в этой стране вызвал по всему континенту сомнения относительно того, сужается ли демократическая жизнь в ней в результате принуждения или по замыслу. В УНАСУЛ сейчас стоит вопрос: была ли эта организация создана для защиты демократических обязательств или лишь для того, чтобы говорить о них, когда это удобно. Мы должны решить, следует ли исключить [FROM.GetName] из южноамериканской структуры или же проекту будет лучше, если оставить его в составе организации, но под предупреждением."
 mercosur.117.a: "Подвесьте их к каркасу."
 mercosur.117.b: "Держите их в помещении, но под присмотром."
 mercosur.119.t: "УНАСУЛ приостанавливает наш статус"
 mercosur.119.d: "УНАСУЛ вынесла свое решение, и оно свидетельствует скорее о дистанцировании, чем о солидарности. Организация пришла к выводу, что наш недавний курс несовместим с её демократическими принципами, и в связи с этим наше членство в южноамериканской структуре было приостановлено. То, что должно было символизировать континентальную сплоченность, на самом деле стало напоминанием о том, что региональная легитимность всё же имеет свои пределы."
 mercosur.119.a: "Удар достигает цели."
 mercosur.120.t: "УНАСУЛ оставляет нас на испытательном сроке"
 mercosur.120.d: "УНАСУЛ решила не исключать нас из своих рядов, но это решение не приносит особого утешения. Мы остаемся в организации лишь под явным осуждением, и столицы Южной Америки расценят этот выбор как предупреждение о том, что наше место в проекте теперь носит условный характер, а не является заслуженным доверием."
 mercosur.120.a: "Приостановление дела, а не оправдание."
 mercosur.121.t: "УНАСУЛ приостанавливает членство одной из стран"
 mercosur.121.d: "Проанализировав серьезный политический поворот событий в [FROM.GetName], УНАСУЛ приняла решение применить свою демократическую оговорку и приостановить членство этой страны в организации. Данное решение подчеркивает, что единство Южной Америки по-прежнему опирается на политические основы и что некоторые нарушения носят настолько серьезный характер, что вынуждают открыто поднять этот вопрос."
 mercosur.121.a: "Каркас затвердевает."
 mercosur.122.t: "УНАСУЛ предоставляет отсрочку"
 mercosur.122.d: "После серьезного политического поворота в [FROM.GetName] УНАСУЛ решила пока не приостанавливать членство этой страны. Тем не менее, этот исход далеко не означает безоговорочную поддержку: организация предпочла единство разрыву, при этом ясно дав понять, что место [FROM.GetName] в южноамериканском проекте будет оставаться под вопросом."
 mercosur.122.a: "Предупреждение остается в силе."
 MER_democratic_clause_warning_tt: "§YЕсли мы являемся членами МЕРКОСУР или УНАСУЛ, этот шаг может привести к пересмотру нашего членства в соответствии с их положениями о демократии и поставить его под угрозу.§!"
