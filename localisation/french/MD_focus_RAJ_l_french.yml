 pak_raj_border_claim.1.d_426: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger le Sindh. Céder transférerait l'État et baisserait la tension. Refuser ouvrirait une crise plus large."
 pak_raj_border_claim.1.d_987: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger le Gujarat occidental. Céder transférerait l'État et baisserait la tension. Refuser ouvrirait une crise plus large."
 pak_raj_border_claim.1.d_984: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger le Rajasthan occidental. Céder transférerait l'État et baisserait la tension. Refuser ouvrirait une crise plus large."
 pak_raj_border_claim.1.a: "Céder l'État contesté"
 pak_raj_border_claim.1.b: "Rejeter la revendication"
 pak_raj_border_crisis.1.t: "La crise frontalière éclate"
 pak_raj_border_crisis.1.d: "Notre revendication territoriale rejetée s'est durcie en crise diplomatique et militaire. La mobilisation pourrait forcer des concessions, mais elle rétrécit aussi le chemin du retour."
 pak_raj_border_crisis.1.a: "Mobiliser la frontière"
 pak_raj_border_crisis.1.b: "Reposez-vous tranquillement"
 pak_raj_border_crisis.2.t: "Le rival se mobilise"
 pak_raj_border_crisis.2.d: "Les forces rivales se dirigent vers la frontière. Nous pouvons contre-mobiliser ou chercher des pourparlers avant que la crise ne devienne plus difficile à contenir."
 pak_raj_border_crisis.2.a: "Contre-mobiliser"
 pak_raj_border_crisis.2.b: "Rechercher des pourparlers immédiats"
 pak_raj_border_crisis.3.t: "Un ultimatum territorial"
 pak_raj_border_crisis.3.d_420: "[FROM.GetNameDefCap] exige l'Azad Cachemire et menace d'une guerre limitée si nous refusons."
 pak_raj_border_crisis.3.d_427: "[FROM.GetNameDefCap] exige le Jammu-et-Cachemire et menace d'une guerre limitée si nous refusons."
 pak_raj_border_crisis.3.d_429: "[FROM.GetNameDefCap] exige le Pendjab oriental et menace d'une guerre limitée si nous refusons."
 pak_raj_border_crisis.3.d_563: "[FROM.GetNameDefCap] exige le Pendjab central et menace d'une guerre limitée si nous refusons."
 pak_raj_border_crisis.3.d_573: "[FROM.GetNameDefCap] exige le Pendjab méridional et menace d'une guerre limitée si nous refusons."
 pak_raj_border_crisis.3.d_426: "[FROM.GetNameDefCap] exige le Sindh et menace d'une guerre limitée si nous refusons."
 pak_raj_border_crisis.3.d_987: "[FROM.GetNameDefCap] exige le Gujarat occidental et menace d'une guerre limitée si nous refusons."
 pak_raj_border_crisis.3.d_984: "[FROM.GetNameDefCap] exige le Rajasthan occidental et menace d'une guerre limitée si nous refusons."
 pak_raj_border_crisis.3.a: "Accepter et se retirer"
 pak_raj_border_crisis.3.b: "Rejeter l'ultimatum"
 pak_raj_border_crisis.4.t: "Ultimatum rejeté"
 pak_raj_border_crisis.4.d: "Le rival a refusé notre demande. Nous devons soit faire valoir la revendication contre l'État contesté, soit absorber le coût politique d'un recul."
 pak_raj_border_crisis.4.a: "Forcer la décision"
 pak_raj_border_crisis.4.b: "Reculer"
 pak_raj_border_crisis.5.t: "Un signal nucléaire"
 pak_raj_border_crisis.5.d: "Les planificateurs militaires proposent un changement visible de la préparation nucléaire pour démontrer la résolution. La retenue baisserait les tensions mais pourrait être lue comme une faiblesse."
 pak_raj_border_crisis.5.a: "Augmenter la préparation nucléaire"
 pak_raj_border_crisis.5.b: "Maintenir la retenue"
 pak_raj_border_crisis.6.t: "Le rival signale sa préparation"
 pak_raj_border_crisis.6.d: "Le rival a visiblement relevé sa préparation nucléaire. Matcher la posture créerait une impasse nucléaire, tandis que la retenue réduirait la tension immédiate."
 pak_raj_border_crisis.6.a: "Répondre de la même manière"
 pak_raj_border_crisis.6.b: "Désamorcer unilatéralement"
 pak_raj_border_crisis.7.t: "Une demande de médiation"
 pak_raj_border_crisis.7.d: "La crise indo-pakistanaise menace la stabilité régionale. Les diplomates américains peuvent offrir un canal pour une désescalade négociée."
 pak_raj_border_crisis.7.a: "Proposer une médiation"
 pak_raj_border_crisis.7.b: "Rester en dehors de tout cela"
 pak_raj_border_crisis.8.t: "Médiation américaine"
 pak_raj_border_crisis.8.d: "Les États-Unis ont proposé de faciliter une désescalade mutuelle. L'accepter mettrait fin à la crise et baisserait la tension bilatérale."
 pak_raj_border_crisis.8.a: "Accepter la médiation"
 pak_raj_border_crisis.8.b: "Rejeter les interférences extérieures"
 pak_raj_border_crisis.9.t: "La crise passe"
 pak_raj_border_crisis.9.d: "La confrontation immédiate s'est achevée sans guerre ouverte. Les forces le long de la frontière reviennent à une préparation de routine."
 pak_raj_border_crisis.9.a: "Reconnu"
 pak_raj_border_crisis.10.t: "Une victoire diplomatique"
 pak_raj_border_crisis.10.d: "Le rival a cédé l'État contesté. La confrontation s'est achevée selon nos termes."
 pak_raj_border_crisis.10.a: "Consolider la victoire"
 pak_raj_border_crisis.11.t: "La revendication est caduque"
 pak_raj_border_crisis.11.d: "Le contrôle de l'État contesté a changé avant que la crise ne puisse être résolue. La demande territoriale n'est plus valable."
 pak_raj_border_crisis.11.a: "Classer le dossier"
 raj_chi_border_crisis.2.t: "Une revendication territoriale"
 raj_chi_border_crisis.2.d_475: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger l'Arunachal Pradesh. Céder transférerait l'État et calmerait la frontière, tandis que refuser risque une guerre limitée."
 raj_chi_border_crisis.2.d_982: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger le Sikkim. Céder transférerait l'État et calmerait la frontière, tandis que refuser risque une guerre limitée."
 raj_chi_border_crisis.2.d_591: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger l'Aksai Chin. Céder transférerait l'État et calmerait la frontière, tandis que refuser risque une guerre limitée."
 raj_chi_border_crisis.2.d_993: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger le Ladakh. Céder transférerait l'État et calmerait la frontière, tandis que refuser risque une guerre limitée."
 raj_chi_border_crisis.2.a: "Céder l'État contesté"
 raj_chi_border_crisis.2.b: "Rejeter la demande"
 raj_chi_border_crisis.3.t: "Demande de retrait rejetée"
 raj_chi_border_crisis.3.d: "Le rival refuse de restituer l'État contesté. Nous pouvons créer un but de guerre limité pour cet État ou nous retirer."
 raj_chi_border_crisis.3.a: "Préparer une réponse limitée"
 raj_chi_border_crisis.3.b: "Se retirer"
 raj_chi_border_crisis.4.t: "L'État contesté est cédé"
 raj_chi_border_crisis.4.d: "Le rival a accepté notre demande et cédé l'État contesté, mettant fin à la confrontation sans guerre plus large."
 raj_chi_border_crisis.4.a: "Rétablir la frontière"
 raj_chi_border_crisis.5.t: "La revendication est caduque"
 raj_chi_border_crisis.5.d: "Le contrôle de l'État contesté a changé avant que la confrontation ne puisse être résolue. La demande n'est plus valable."
 raj_chi_border_crisis.5.a: "Classer le dossier"
