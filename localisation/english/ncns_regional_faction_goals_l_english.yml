l_english:
 faction_goal_bul_sofia_talks: "The Sofia Talks"
 faction_goal_bul_sofia_talks_desc: "Recruit at least two independent Balkan countries besides Bulgaria."
 faction_goal_bul_mountain_passes: "Across the Mountain Passes"
 faction_goal_bul_mountain_passes_desc: "Have pact members control both Sofia and West Thrace with at least level 3 infrastructure in each state."
 faction_goal_bul_balkan_mutual_defense: "A Balkan Mutual Defense Area"
 faction_goal_bul_balkan_mutual_defense_desc: "Include independent members on the Adriatic (Albania, Bosnia, Croatia, Montenegro, or Slovenia), the Aegean (Greece or Turkey), and the Black Sea (Bulgaria, Romania, Turkey, or Ukraine)."

 faction_goal_eng_atlantic_watch: "The Atlantic Watch"
 faction_goal_eng_atlantic_watch_desc: "Recruit Norway, Denmark, or Iceland."
 faction_goal_eng_atlantic_escorts: "The Atlantic Escort Fleet"
 faction_goal_eng_atlantic_escorts_desc: "Field at least 20 frigates and destroyers across the faction, with at least two members fielding escorts."
 faction_goal_eng_atlantic_order: "An Atlantic Order of Our Own"
 faction_goal_eng_atlantic_order_desc: "Recruit three European NATO countries from the following pool: the Benelux, Denmark, France, Germany, Greece, Iceland, Italy, Norway, Poland, Portugal, Spain, Turkey, the Baltic states, Czechia, Slovakia, or Hungary. Keep Belarus, Ukraine, and Moldova outside the CSTO."

 faction_goal_fra_joint_procurement: "Joint Procurement"
 faction_goal_fra_joint_procurement_desc: "Have France and another Accord member both research 1995-generation infantry fighting vehicles."
 faction_goal_fra_european_defense_industry: "A European Defense Industry"
 faction_goal_fra_european_defense_industry_desc: "Have three European Accord members each operating at least 12 military factories."
 faction_goal_fra_strategic_autonomy: "European Strategic Autonomy"
 faction_goal_fra_strategic_autonomy_desc: "Across Accord stockpiles, hold at least 48 multirole fighters from 2005 or later, 120 main battle tanks from 1995 or later, and 60 air-defense systems from 2005 or later."

 faction_goal_ger_central_european_compact: "The Central European Compact"
 faction_goal_ger_central_european_compact_desc: "Recruit Austria or Hungary."
 faction_goal_ger_danube_arsenal: "The Danube Arsenal"
 faction_goal_ger_danube_arsenal_desc: "Have two members from Austria, Hungary, Czechia, and Slovakia each research 1995-generation main battle tanks and field at least four tank battalions."
 faction_goal_ger_third_power: "A Third Power in Europe"
 faction_goal_ger_third_power_desc: "Have Germany and at least three of Austria, Hungary, Czechia, and Slovakia as independent members. Operate at least 80 military factories across those Central European members."

 faction_goal_gre_first_comrade_government: "The First Comrade Government"
 faction_goal_gre_first_comrade_government_desc: "Recruit another Balkan country with a communist or non-aligned communist government."
 faction_goal_gre_balkan_industrial_plan: "The Balkan Industrial Plan"
 faction_goal_gre_balkan_industrial_plan_desc: "Have two Balkan members outside Greece each operating at least 12 civilian factories."
 faction_goal_gre_socialist_belt: "A Socialist Belt Across the Balkans"
 faction_goal_gre_socialist_belt_desc: "Have four Balkan members with communist or non-aligned communist governments, including a member on the Adriatic or Black Sea."

 faction_goal_pol_eastern_guarantee: "The Eastern Guarantee"
 faction_goal_pol_eastern_guarantee_desc: "Recruit Ukraine, Estonia, Latvia, or Lithuania."
 faction_goal_pol_north_south_corridor: "The North–South Corridor"
 faction_goal_pol_north_south_corridor_desc: "Have pact members control Upper Silesia, Lviv, and Vilnius with at least level 3 infrastructure in each state."
 faction_goal_pol_shield_between_seas: "A Shield Between the Seas"
 faction_goal_pol_shield_between_seas_desc: "Have an independent member in Estonia, Latvia, or Lithuania and another in Romania or Ukraine. Each must stockpile at least 15 2005-generation or newer air-defense systems of one model."

 faction_goal_egy_pluralism_guarantee: "A Guarantee for Pluralism"
 faction_goal_egy_pluralism_guarantee_desc: "Guarantee independent Lebanon or Jordan, or bring either country into the alliance."
 faction_goal_egy_rebuild_communities: "Rebuild the Communities"
 faction_goal_egy_rebuild_communities_desc: "Reach level 4 infrastructure in Mount Lebanon and Amman. Lebanon must control Mount Lebanon, and Jordan must control Amman."
 faction_goal_egy_regional_protection_compact: "A Regional Protection Compact"
 faction_goal_egy_regional_protection_compact_desc: "Have independent Lebanon and Jordan in the alliance or under Egyptian guarantees. Lebanon must control Mount Lebanon, and Jordan must control Amman."

 faction_goal_egy_cairo_khartoum_understanding: "The Cairo-Khartoum Understanding"
 faction_goal_egy_cairo_khartoum_understanding_desc: "Bring independent Sudan into the pact."
 faction_goal_egy_reliable_nile_corridor: "A Reliable Nile Corridor"
 faction_goal_egy_reliable_nile_corridor_desc: "Reach level 4 infrastructure in both Egyptian-controlled Cairo and Sudanese-controlled Khartoum."
 faction_goal_egy_blue_nile_accommodation: "A Blue Nile Accommodation"
 faction_goal_egy_blue_nile_accommodation_desc: "Keep an independent Sudan in the pact. Egypt and Ethiopia must be at peace with each other. They must also be in the same faction or have at least +50 opinion of each other."

 faction_goal_irq_outfit_the_iraqi_army: "Outfit the Iraqi Army"
 faction_goal_irq_outfit_the_iraqi_army_desc: "Hold 2,000 infantry weapons and 200 command-and-control systems in Iraqi stockpiles."
 faction_goal_irq_iraqs_own_arsenal: "Iraq's Own Arsenal"
 faction_goal_irq_iraqs_own_arsenal_desc: "Have Iraq research 1995-generation infantry weapons and 2005-generation air defense, and operate at least 12 military factories."
 faction_goal_irq_regions_shield: "The Region's Shield"
 faction_goal_irq_regions_shield_desc: "Keep Iraq independent and in control of Basrah. Have at least two other independent Middle Eastern faction members each stockpile at least 1,000 infantry weapons."

 faction_goal_isr_renew_the_periphery: "Renew the Periphery"
 faction_goal_isr_renew_the_periphery_desc: "Recruit Turkey, Iran, Ethiopia, Bahrain, or the United Arab Emirates."
 faction_goal_isr_recognition_to_commerce: "From Recognition to Commerce"
 faction_goal_isr_recognition_to_commerce_desc: "Maintain active Israeli trade agreements with at least two of Turkey, Iran, Ethiopia, Bahrain, and the United Arab Emirates."
 faction_goal_isr_regional_network: "A New Regional Network"
 faction_goal_isr_regional_network_desc: "Have an independent member from Turkey, Iran, or Ethiopia and another independent member from the Gulf Arab states. Both must be at peace with Israel."

 faction_goal_per_reopen_the_northern_tier: "Reopen the Northern Tier"
 faction_goal_per_reopen_the_northern_tier_desc: "Bring Turkey or Pakistan into CENTO."
 faction_goal_per_common_air_picture: "A Common Air Picture"
 faction_goal_per_common_air_picture_desc: "Build at least one level of radar in each of Van, Kermanshah, and Balochistan while CENTO members control those states."
 faction_goal_per_restore_the_northern_tier: "Restore the Northern Tier"
 faction_goal_per_restore_the_northern_tier_desc: "Have Turkey, Iran, and Pakistan as independent CENTO members. Turkey must control Van, Iran must control Kermanshah and Sistan-o Balochistan, and Pakistan must control Balochistan."

 faction_goal_syr_independent_league: "An Independent League"
 faction_goal_syr_independent_league_desc: "Keep the faction leader independent and recruit another member from the Levant."
 faction_goal_syr_leagues_own_arsenal: "The League's Own Arsenal"
 faction_goal_syr_leagues_own_arsenal_desc: "Have the faction leader and another member each operate at least 6 military factories and stockpile 1,500 infantry weapons."
 faction_goal_syr_leagues_levant: "The League's Levant"
 faction_goal_syr_leagues_levant_desc: "Have league members control Damascus and at least two of Mount Lebanon, Amman, and Jerusalem."

 faction_goal_syr_jerusalem_guarantee: "The Jerusalem Guarantee"
 faction_goal_syr_jerusalem_guarantee_desc: "Recruit Israel on the one-state focus path or Palestine on the Protect Palestine path. Either partner qualifies before Syria chooses a focus path."
 faction_goal_syr_joint_civil_defense: "Joint Civil Defense"
 faction_goal_syr_joint_civil_defense_desc: "Have pact members control Damascus and the partner's area, Jerusalem for Israel or the West Bank for Palestine, with at least level 2 state air defenses in both areas."
 faction_goal_syr_keep_the_settlement: "Keep the Settlement"
 faction_goal_syr_keep_the_settlement_desc: "Keep the chosen partner independent and at peace with Syria. A pact member must control Damascus, and the partner must control Jerusalem or the West Bank, as applicable."

 faction_goal_syr_beyond_syria: "Beyond Syria"
 faction_goal_syr_beyond_syria_desc: "Have a Syrian member and at least one Arabian Peninsula member."
 faction_goal_syr_ports_of_the_coalition: "Ports of the Coalition"
 faction_goal_syr_ports_of_the_coalition_desc: "Have member-controlled naval bases in Latakia and in either Aden or Muscat."
 faction_goal_syr_two_coast_coalition: "A Two-Coast Coalition"
 faction_goal_syr_two_coast_coalition_desc: "Retain a Syrian member and have independent members on the Red Sea (Saudi Arabia or Yemen) and Gulf of Oman (Oman or the United Arab Emirates)."

 faction_goal_mto_two_shores: "Two Shores, One Treaty"
 faction_goal_mto_two_shores_desc: "Have a member in North Africa and another in the eastern Mediterranean."
 faction_goal_mto_mediterranean_development: "Mediterranean Development Program"
 faction_goal_mto_mediterranean_development_desc: "Have one North African member and one eastern Mediterranean member each operate at least 20 civilian factories."
 faction_goal_mto_regional_security_provider: "A Regional Security Provider"
 faction_goal_mto_regional_security_provider_desc: "Have members in North Africa, the eastern Mediterranean, and the Middle East. Field at least 30 ships excluding convoys, with at least two members contributing warships."

 faction_goal_uar_coalition_of_sovereign_states: "A Coalition of Sovereign States"
 faction_goal_uar_coalition_of_sovereign_states_desc: "Have at least three independent Arab members after the UAR forms."
 faction_goal_uar_prepare_common_defense: "Prepare the Common Defense"
 faction_goal_uar_prepare_common_defense_desc: "While the UAR exists, have two independent front members each stockpile 2,000 infantry weapons and have at least 20,000 available manpower."
 faction_goal_uar_defeat_annexation_bid: "Defeat the Annexation Bid"
 faction_goal_uar_defeat_annexation_bid_desc: "Have an independent front member defeat the UAR in a war. The member's victory must be recognized by Millennium Dawn's UAR peace conference event."
