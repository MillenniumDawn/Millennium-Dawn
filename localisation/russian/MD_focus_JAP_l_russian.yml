 senbu_occupation_law_fake_idea: "Администрация по умиротворению Сенбу"
 senbu_occupation_law_fake_idea_desc: "Сотрудники по гражданским делам управляют оккупированными районами через местных влиятельных лиц, а не через командиров гарнизонов, восстанавливая рынки, школы и распределение риса, прежде чем требовать увеличения урожая. Уровень подчинения неуклонно растет, а потребность в гарнизоне остается низкой, но такая мягкая политика оставляет организованному сопротивлению больше пространства, чем карательный режим."
 JAP_sabotaged_russians: "Саботаж российских объектов"
 JAP_usa_trade_pressure: "Американское торговое давление"
 JAP_article_nine_balance_of_power_category: "Статья девять"
 JAP_article_nine_balance_of_power_category_desc: "Отказ от войны, закрепленный в девятой статье конституции, не является решенным вопросом, а предметом постоянных споров между кабинетом министров, судами, американским альянсом и общественностью. Каждое переосмысление меняет баланс между строго оборонительной позицией и нормальной военной силой."
 JAP_cool_japan_doctrine_desc: "Японский дизайн странен не потому, что он не соответствовал зарубежным стандартам. Он странен потому, что был создан для японских покупателей людьми, которые ни разу не рассматривали альтернативы, и именно это делает его достойным покупки. Министерство перестает упаковывать культуру как витрину магазина для оборудования и начинает экспортировать само отличие.\n\n§RЭтот путь сохраняет §Y$JAP_galapagos_syndrome$§! навсегда.§! Только §Y$JAP_world_integration$§! устраняет его, и эти два пути взаимоисключающие: Япония либо сближается с мировыми стандартами, либо продаёт миру собственные."
 JAP_galapagos_sphere_modifier: "Культурная сфера"
 JAP_galapagos_sphere_modifier_desc: "Министерство ведет ежеквартальный подсчет стран, где японское влияние составляет двадцать процентов или выше, и рассматривает этот показатель как самостоятельную величину экспорта. Каждая страна в этом списке расширяет аудиторию покупателей японского дизайна, которым не нужно предварительно разбираться в его особенностях, что имеет определенную ценность для торговых делегаций и еще большую — для компаний, которые следуют за ними. Подсчет проводится раз в квартал, и доходность меняется вместе с ним. Сфера, которая перестает расти, перестает приносить прибыль."
 JAP_galapagos_sphere_tt: "§YКультурная сфера§!: [?JAP_galapagos_sphere_count|Y0] стран, оказывающих §G20%§! японское влияние или более, учитывается каждый квартал после принятия §YДоктрины «Холодной Японии»§!. Доходность увеличивается вдвое с §Y$JAP_electronics_superpower$§! и еще на один квартал с §Y$JAP_home_electronics$§!."
 JAP_cool_japan_sphere_payout_tt: "Каждый квартал министерство подсчитывает страны, где японское §Yвлияние§! составляет §G20%§! или выше, и сообщает общую сумму как §YКультурная сфера§!. Каждая из них добавляет §G+1%§! §Yиностранного влияния§! и §G+0,2%§! §Yвозврата инвестиций§!, выплачиваемых через §YКультурную сферу§! и растущих по мере расширения сферы. §Y$JAP_electronics_superpower$§! увеличивает доходность ещё в полтора раза, а §Y$JAP_home_electronics$§! повышает её ещё на четверть.\n-------------\nЭто не влияет на §YИсследовательский дрейф§!. Доктрина покупает влияние за рубежом, но не устраняет разрыв в стандартах внутри страны."
 JAP_creative_industries_office: "Офис содействия развитию креативных индустрий"
 JAP_creative_industries_office_desc: "Министерство экономики, торговли и промышленности создает Управление по продвижению креативных индустрий, чтобы рассматривать анимацию, дизайн, моду и продукты питания как экспортные сектора, а не как культурные явления. Затем следует Фонд «Cool Japan» с капиталом в пятьдесят миллиардов иен и мандатом на совместное инвестирование, а не на субсидирование, скупая зарубежные розничные магазины, азиатские стриминговые платформы и дистрибьюторские предприятия, которые ни один японский совет директоров не одобрил бы самостоятельно. Чиновники оказываются плохими венчурными капиталистами, и Фонд терпит убытки в течение многих лет, но он принимает на себя первые убытки по проектам, в которые затем инвестирует частный капитал."
 JAP_visit_japan_campaign: "Кампания «Посетите Японию»"
 JAP_visit_japan_campaign_desc: "Кампания «Посетите Японию» перезапущена с целью, в которую не верит ни одно министерство: 40 миллионов иностранных туристов в год. Правительство смягчает визовый режим для путешественников из Азии, освобождает косметику и лекарства от налога на потребление на кассе и продвигает страну, опираясь на те ее аспекты, которые трудно перевести на японский язык. Ничто в Японии не искажается, чтобы ее продать."
 JAP_content_export_offensive: "Наступление по экспорту контента"
 JAP_content_export_offensive_desc: "Основной закон об интеллектуальной собственности и Закон о продвижении контента закрепляют в законодательстве анимацию, игры и мангу как стратегические активы, однако индустрия по-прежнему относится к своей зарубежной аудитории как к пиратству, которое следует терпеть, пока распространением занимаются фанатские переводчики. Вместо этого правительство создает легальный канал: одновременный выпуск, профессиональное субтитрование и правообладатели, которые ведут переговоры единым блоком, а не по одной студии за раз. Зарубежный рынок уже составляет большую половину доходов от аниме, и почти ничего из этого не собирается."
 JAP_washoku_to_the_world: "Вашоку в мир"
 JAP_washoku_to_the_world_desc: "Поскольку блюдо вашоку внесено в список нематериального культурного наследия ЮНЕСКО, правительство продвигает не блюдо, а целую практику: сезонный ингредиент, оформление, новогодний стол. Ранее министерство стремилось контролировать это, и от программы сертификации подлинных японских ресторанов за рубежом отказались, как только зарубежная пресса окрестила её «полицией суши». Калифорнийские роллы и бангкокский рамен продают больше японского риса, сои и саке, чем любая инспекция когда-либо смогла бы продать, и целевой показатель экспорта в триллион иен основан именно на этой торговле."
 JAP_japan_house_network: "Сеть японских домов"
 JAP_japan_house_network_desc: "Программа JET отправила тысячи молодых иностранцев учиться в японские школы и городские администрации, и они вернулись домой, свободно владея японским языком. Сейчас они работают в министерствах иностранных дел, юридических фирмах и редакциях новостей. Japan House предоставляет этой сети свой вход: галерея, библиотека, магазин и ресторан на дорогой улице в Сан-Паулу, Лос-Анджелесе и Лондоне, управляемые Министерством иностранных дел и намеренно лишенные флагов и политических заявлений. После открытия количество заявок на курсы японского языка в каждом из городов утроилось."
 JAP_gross_national_cool: "Валовой национальный холод"
 JAP_gross_national_cool_desc: "«Галапагосский синдром» никуда не делся: технические характеристики остаются японскими, а исследовательская деятельность продолжается. Вместо этого министерства создали страну, которая зарабатывает за границей за счет того, что может производить только она сама: студий, кухонь, игровых домов, дизайнерских бюро и миллионов людей, которые приезжают каждый год просто посмотреть. Изоляция так и не была преодолена, а лишь использована в корыстных целях."
 JAP_cool_japan_spirit_kept_tt: "§YГалапагосский синдром§! §Rостается на месте§!. Япония предпочла продать свои отличия, а не вылечить их."
 JAP_electronics_anchor_bonus_tt: "§YElectronics Superpower§!: Японское оборудование обеспечивает доступ к японским комплектующим на всех рынках, и отдача от этого растет."
 JAP_world_integration: "Интеграция с миром"
 JAP_world_integration_desc: "Япония перестаёт быть островом. Стандарты переписываются по чужому проекту, тарифные ставки снижаются, министерства перестают спрашивать, уместно ли участие иностранного предприятия, и капитал, который тридцать лет кружил по стране, начинает поступать в неё. Уступается сама защита, тот самый замкнутый рынок, который делал потребительские товары дешёвыми, и стена против иностранного влияния, которую ни один конкурент так и не смог преодолеть, и теперь японским фирмам приходится завоёвывать рынок, которым они когда-то владели."
 JAP_structural_reform_zones: "Специальные зоны структурных реформ"
 JAP_structural_reform_zones_desc: "Вместо того чтобы построчно оспаривать нормативный кодекс у министерств, которые его разработали, правительство позволяет префектуре или городу подать заявку на освобождение от правила, а затем доказывать, что ничего страшного не происходит. Фермеры варят пиво в объемах ниже установленного национальным минимумом, акционерные общества управляют школами и сдают в аренду сельскохозяйственные земли, а национальные стратегические специальные зоны используют один и тот же инструмент в Токио для финансирования, в Фукуоке для правил трудоустройства в стартапах и в Кансае для медицинских исследований. Это скорее розничная, а не оптовая дерегуляция, и это единственный метод, который когда-либо действительно что-то изменил."
 JAP_corporate_governance_code: "Кодекс корпоративного управления"
 JAP_corporate_governance_code_desc: "В обзоре Ито приводятся конкретные цифры, определяющие причины неудач: минимальная рентабельность собственного капитала, которую должна обеспечить японская компания, чтобы оправдать вложенный капитал, составляет восемь процентов, и большинство компаний этого не достигают. Кодекс корпоративного управления предписывает пенсионным фондам и страховым компаниям голосовать своими акциями как собственники, а не как гости, а Кодекс корпоративного управления следует принципу «соблюдай или объясни». Доля независимых директоров в совете директоров приближается к трети, и начинается продажа акций, принадлежащих различным компаниям, что делает японские фирмы не столько чужеродными, сколько понятными для любого, кто готов купить акции."
 JAP_economic_partnership_agreements: "Соглашения об экономическом партнерстве"
 JAP_economic_partnership_agreements_desc: "С момента войны сельское хозяйство обладало правом вето на торговую политику Японии, и теперь экспортеры проигрывают тендеры корейским фирмам только из-за тарифной линии. Япония заключает крупнейшее двустороннее соглашение, когда-либо подписанное какой-либо из сторон с Европейским союзом, а затем становится председателем Транстихоокеанского партнерства после выхода Вашингтона, приостанавливая действие американских положений, а не исключая их. За этим следует RCEP, впервые объединяющее Японию, Китай и Южную Корею в единую торговую структуру, при этом рис защищен в рамках каждого из этих соглашений."
 JAP_open_capital_markets: "Открыть рынки капитала"
 JAP_open_capital_markets_desc: "Если сравнивать с размерами экономики Японии, то она располагает меньшим объемом иностранного капитала, чем почти любая развитая страна. Это объясняется перекрестным владением акциями, нечитаемой отчетностью и сорокалетней практикой, когда чиновники рассматривают иностранные заявки как проблему, которую нужно решить. Процесс восстановления не отличается привлекательностью и почти полностью носит административный характер: отделы Invest Japan в JETRO помогают иностранной фирме пройти процедуру регистрации, результаты публикуются на английском языке в тот же день, что и на японском, а для сотрудников, которых иностранная дочерняя компания должна перевести в Японию для открытия филиала, существует балльная система определения места жительства. Вопрос о персонале в полном смысле этого слова относится к §Y$JAP_an_open_nation$§!, и здесь речь идет о более узком вопросе: сможет ли капитал найти дверь?"
 JAP_the_third_opening: "Третье открытие"
 JAP_the_third_opening_desc: "Япония отказывается от последних мер защиты, которые делали её экономикой обособленной. Правительство открывает внутренний рынок для иностранной конкуренции, пересматривает свои стандарты в соответствии с международными проектами и позволяет иностранному капиталу инвестировать на тех же условиях, что и японскому. И замкнутый рынок, и стена против внешнего влияния отменяются ради страны, которая торгует как один из многих подписантов."
 JAP_an_open_nation_bonus_tt: "§Y$JAP_an_open_nation$§!: стране, которая уже открылась миру, гораздо меньше поводов для споров, когда она откроется мировой столице."
 JAP_zombie_report_credible_tt: "В результате расследования был получен как минимум §Yчастичный отчёт§!."
 JAP_zombie_investigation_concluded_tt: "Расследование §Yзавершено§!, что бы оно ни обнаружило"
 JAP_zombie_case_files_up_1_tt: "$JAP_case_files$: $RIGHT|+=1$"
 JAP_zombie_case_files_up_2_tt: "$JAP_case_files$: $RIGHT|+=2$"
