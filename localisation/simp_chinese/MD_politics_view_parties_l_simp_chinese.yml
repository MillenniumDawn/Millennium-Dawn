 IRQ.Nat_Fascism_desc: "（复兴党）- 阿拉伯复兴社会党\n\n伊拉克阿拉伯复兴社会党于1968年通过军事政变上台执政。该党伊拉克分支最初与泛阿拉伯主义的叙利亚复兴社会党为同一政党，以伊拉克民族主义为核心意识形态，后来分裂为叙利亚支持伊朗对抗伊拉克的血仇。在萨达姆·侯赛因的领导下，该党推动了以专制为基础的军国主义‘大美索不达米亚’复兴，并不断使这个世俗国家伊斯兰化。"
