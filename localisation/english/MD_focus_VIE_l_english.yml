l_english:
 VIE_VPA_Business_Ventures: "VPA Business Ventures"
 VIE_VPA_Business_Ventures_desc: "Sharp defense cuts in the 1990s led Vietnam to follow China's example and allow the military to pursue commercial ventures. The profits helped pay debts and improve military equipment and welfare, but divided the armed forces' attention. This spirit will be removed once §Y$the_military$§! is an Internal Faction, §Y$communist_cadres$§! is not an Internal Faction, Corruption is level 5 or lower, and at least 100,000 manpower is deployed."
 vietnam.1.t: "The Military Leaves Business"
 vietnam.1.d: "With corruption under control and the armed forces rebuilt, the government has ordered the Vietnam People's Army to end its commercial ventures. The military will return its attention to national defense while civilian institutions assume responsibility for commercial activity."
 vietnam.1.a: "The army must serve the nation."
