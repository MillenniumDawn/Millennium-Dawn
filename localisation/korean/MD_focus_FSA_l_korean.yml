 FSA_extremism5: "자유 시리아군의 붕괴"
 FSA_extremism5_desc: "자유 시리아군은 본래 체제에 대한 민주적이고 세속적인 대안을 주장하며 이탈한 장교들이 결성했으나, 장기화된 분쟁과 반체제 세력의 분산된 성격 탓에 더 급진적인 파벌이 세를 넓힐 수 있었습니다. 아흐라르 알샴, 알누스라 전선 같은 이슬람주의 성향 단체들이 자유 시리아군 간판을 단 연합체와 나란히 또는 그 내부에서 활동하는 일이 점점 늘고 있습니다. 이들 단체는 더 폭넓은 자유 시리아군 명칭을 이용해 정통성과 자원을 얻으면서 온건 세력과 극단 세력의 경계를 흐려 놓았습니다"
 FSA_internal_revolt_category: "양의 탈을 쓴 늑대들"
 FSA_internal_revolt_category_desc: "분쟁이 길어지면서 자유 시리아군은 목표, 충성, 이념이 서로 다른 여단들의 누더기 집합체가 되었습니다. 이슬람주의 파벌과 기타 살라피 성향 운동이 자유 시리아군의 더 넓은 구조 안에 깊이 자리 잡았습니다. 이들은 숙련된 전투원을 제공하고 핵심 영토를 장악하고 있지만, 그 장기적 야심은 분쟁 이후 민주적이거나 다원적인 시리아를 건설하려는 모든 시도에 직접적인 위협이 됩니다."
 FSA_defection_to_extremist: "극단주의로의 이탈"
 FSA_defection_to_extremist_desc: "급진 이슬람주의 단체들이 자유 시리아군 대열 안에 자리 잡고 온건 세력이라는 명칭을 이용해 영향력과 지지를 얻고 있습니다. 이들의 증가하는 존재감은 운동의 단결과 장기적인 정치 목표를 훼손할 위험이 있습니다."
 FSA_capture_aleppo: "알레포 점령"
 FSA_capture_ar_raqqah: "알라카 점령"
 FSA_capture_damascus: "다마스쿠스 점령"
 FSA_capture_deir_ez_zur: "데이르에조르 점령"
 FSA_capture_hama: "하마 점령"
 FSA_capture_homs: "홈스 점령"
 FSA_capture_latakia: "라타키아 점령"
 FSA_capture_tartus: "타르투스 점령"
 SYR_free_syrian_offensive: "자유 시리아 공세"
 SYR_free_syrian_offensive_desc: "고립된 시위로 시작된 것이 전국적인 소요로 폭발했습니다. 시위는 도시와 마을 전역으로 번져 정권의 보안 부대를 압도했고 대규모 이탈을 불러일으켰습니다. 기세를 탄 자유 시리아 세력은 통제권을 장악하고 봉기를 새로운 국면으로 끌어올리기 위해 합동 공세를 준비하고 있습니다."