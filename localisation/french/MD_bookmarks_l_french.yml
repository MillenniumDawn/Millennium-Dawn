l_french:
 MODERN_DAY_NAME: "Le monde aujourd'hui (OBSOLÈTE)"
 MODERN_DAY_DESC: "Jamais la famine n'a été si rare. Jamais les revenus n'ont été si élevés. Et pourtant le monde est marqué par la peur vis-à-vis des rapides évolutions sociales et technologiques. Le contrecoup de la mondialisation se fait sentir tandis que le Moyen-Orient s'effondre dans des guerres hybrides et qu'une vague de nationalismes populistes s'étend en occident. Le centre de gravité mondial se déplace vers l'Asie, mais les puissances émergentes du monde doivent encore trouver une alternative attrayante à l'ordre mondial occidental en place."
 USA_MODERN_DAY_DESC: "The United States, the world's sole superpower, faces a gradual decline in international power. Bogged down in Middle Eastern wars, government debt and the economic rise of China and other BRICS nations, American hegemony is not what it once was. However, due to its unique geographic position offering it total safety with no natural enemies, it can remain engaged overseas in force to defend both the US and its allies' vital interests. At home, a wave of nationalist sentiment against both elitism and globalization has left it with its most unlikely president ever - Donald Trump.\nWith European and Asian allies fearing both American unilateralism and a withdrawal from Western liberal institutions, can the US strike a balance that will make the Western world order prevail?"
 ENG_MODERN_DAY_DESC: "The United Kingdom sits in a position that no country has ever been in before. The 2016 Brexit referendum passed with a nearly fifty-two percent majority and it has become the first and only country to invoke Article 50 of the European Union. It will stand in the history books as either the greatest decision for the British people or the worst possible choice.\nDeal or no deal is the greatest question."
 FRA_MODERN_DAY_DESC: "Centre mondial de l'art, de la culture et de la diplomatie, la France se tourne vers un nouveau siècle plein d'espoir et d'opportunités. La tyrannie des anciennes monarchies et la destruction des guerres mondiales ont précipité la France vers l'Union européenne, dont elle est un membre fondateur.\n\nSeul l'avenir nous dira comment les Français aborderont le siècle à venir."
 GER_MODERN_DAY_DESC: "Grâce à l'austérité et aux réformes, l'économie allemande est sortie indemne des deux chocs de la crise financière de 2008 et de la crise européenne de la dette. Étant de loin la plus puissante économie d'Europe, c'est désormais à la prudente et réticente Allemagne de guider l'Union européenne face au Brexit et aux appels montants de souveraineté nationale. Pour l'Allemagne, l'existence de la zone euro et de l'Union européenne n'est pas un choix, mais une nécessité. L'intégration européenne a crée un marché commun assez large pour ses marchandises, alors que le secteur industriel allemand a depuis longtemps dépassé sa demande intérieure. Par ailleurs, avec une tendance démographique à la baisse, l'Allemagne doit se reposer sur une immigration plus importante pour combler le vide - un choix assurément controversé alors que le nationalisme monte."
 JAP_MODERN_DAY_DESC: "Japan is one of the world's largest economies. It continues to outproduce many countries in Europe, and it also maintains one of the world's most unique cultures. However, this large economy is plagued by incredible amounts of debt. The government debt of Japan is trending to around two hundred and forty-nine percent of its GDP. Furthermore, it is also one of few countries that is affected by an inverted population pyramid where the majority of its population is well over their forties.\nWill Japan collapse under its financial debt and population crisis or will it stand the test of time and become one of the strongest countries in the world?"
 SOV_MODERN_DAY_DESC: "The fall of the Soviet Union reversed 300 years of Russian expansionism and left the new federation with its 17th Century borders. The expansion of NATO into Eastern Europe and post-Soviet states has left it vulnerable, as its heartland lies on the European plain - which is indefensible. Thus, gaining indirect control over post-Soviet states such as Ukraine, Georgia and the Baltics via initiatives such as the Eurasian Union is paramount if Russia is to ever again amount to anything more than a regional power with a decent military. Economically, she must overcome the dual shocks of low oil prices and western sanctions, and somehow tackle the rampant corruption in Russia's highly centralized bureaucracy."
 CHI_MODERN_DAY_DESC: "China's geography - surrounded by mountains and jungles - protects it, but also isolates it from the rest of the world. As a multi-ethnic empire with large minorities, just maintaining its territorial integrity takes considerable effort, as it needs to provide massive investments in its hinterlands and disputed territories in order to maintain control. Perhaps its largest vulnerability, however, is its dependence on exports and trade on the open ocean - which is controlled by the United States and its Asian-Pacific allies. For China to become a true superpower, it needs to compete with the US Navy in size and quality and to turn current Asian rivals into allies. China's diplomacy is hampered by its lack of an attractive political model. However, it is boosted by its massive foreign reserves and its willingness to use them to invest abroad."
 BRA_MODERN_DAY_DESC: "Brazil is slowly on the rise at the turn of the century. The country has the potential for greatness. It is one of the world's largest emerging economies and its growth has continued to accelerate. However, in recent years Brazil's economic current is reeling back from a harsh recession due to the Asian Financial Crisis of 1997 and a crippled currency. Now a new party contender has arrived on the scene. The PT has swapped in and is quickly gaining traction.\n\nWill you be able to kickstart the country's once great economy or will the PT and its socialist policies seize hold?"
 UKR_MODERN_DAY_DESC: "L'année 2014 a fait de l'Ukraine l'épicentre d'événements aux conséquences potentiellement irréversibles. La révolution de la dignité a renversé le régime autoritaire de Viktor Ianoukovitch et porté au pouvoir un gouvernement pro-occidental dirigé par Petro Porochenko. Malgré de nombreuses promesses de campagne, le nouveau garant élu a plongé le pays dans un gouffre financier encore plus profond et a profité de la situation. La patience du peuple s'épuise. La Crimée a été annexée par nos anciens alliés et les régions orientales du Donbass sont ravagées par la guerre. Il ne reste que quelques années avant les prochaines élections, mais le peuple tiendra-t-il jusqu'à la fin du mandat présidentiel ?"
 TUR_MODERN_DAY_DESC: "Recent years haven't been forgiving. Although PKK threat has been nearly eliminated, we couldn't come up with a solution to end it fully. It has been mere months since the coup attempt has been repelled and although some people are even starting to forget it, some perpetrators are still at large, few of them still inside our country, some have been hiding abroad or being sheltered by our enemies, including, the head of the snake, Fethullah Gülen. And all the while some circles have been circulating rumors that Erdogan himself orchestrated the coup and made it fail on purpose to get rid of opposition and seize more power. Nonetheless, a portion of people that got purged have turned out to be innocent and these mistaken convictions are proven."
 ISR_MODERN_DAY_DESC: "Once the land from which Isaiah prophesized of the day mankind would 'Beat their swords into plowshares, and spears into pruning hooks', the Land of Israel has seen too much blood shed upon it ever since the Jewish People reestablished independence for the first time in two thousand years. The optimism of the 1990s Oslo Accords process has died with the Assassination of Prime Minister Rabin in November 1995, and despite Prime Minister Barak's optimism - a Second Intifada is inevitable. But what Israel would rise from it - A shell of its former self or a rising regional power, capable of negotiating on its own terms? And how will it address the delicate balance between Jewish and Democratic aspects of its existence that has so thoroughly been avoided until now?"
 SYR_MODERN_DAY_DESC: "With divided loyalties in the Syrian Armed Forces and staggering losses from 6 years of fighting a brutal civil war, the regular Army is a spent force. Its place on the Syrian battlefield has been taken by a wide array of militias, private military companies, Hezbollah and the Iranian Revolutionary Guard, who together have begun to reverse Assad's losses. However, with its economy destroyed, and most of Syria's territory under the control of terrorists, rebels and Kurds, the prospect of a united Syria looks certain to be a long struggle ahead."
 PER_MILLENNIUM_DAWN_DESC: "Après la Révolution islamique de 1979, l'Iran est passé d'une monarchie pro-occidentale à une théocratie chiite anti-occidentale. D'est en ouest, l'Iran a subi la pression de forces extérieures, sans pouvoir compter sur personne d'autre que lui-même. Face à une hostilité omniprésente, l'Iran s'est imposé comme le centre de l'influence chiite dans le monde musulman, exerçant une forte emprise sur des organisations extrémistes comme le Hezbollah, dont la survie dépend fortement de son soutien financier. Face à la résistance croissante des mouvements réformistes et étudiants, l'avenir du régime de Khamenei est incertain. En fin de compte, pour survivre, l'Iran devra soit coopérer avec ses voisins sur la scène internationale, soit écraser tous ses adversaires. Il n'y a pas d'entre-deux."
 PER_MODERN_DAY_DESC: "Après avoir poursuivi le projet AMAD au milieu des représailles mondiales, l'Iran a dû faire face à de lourdes sanctions économiques qui ont affaibli, mais pas arrêté, sa marche vers l'acquisition d'armes nucléaires. Pendant cette période difficile, l'Iran a également commencé à renforcer sa puissance au Moyen-Orient grâce à sa force Qods. Maintenant qu'il commence à se redresser, l'Iran s'est positionné comme une nation prête à s'opposer à l'ordre mondial et aux États-Unis. Que va-t-il se passer à partir de maintenant ?"
 FSA_MODERN_DAY_DESC: "Initially the Free Syrian Army was an umbrella organization of anti-Assad rebel groups and a true government in parallel. However, radicalization of Syrian militants led to mass defections to both Al-Qaeda ally Al-Nusra and ISIS, contributing to the eradication of the FSA in the north of Syria. As a result, the Free Syrian Army was dismantled as an organization. However, a wide array of Muslim Brotherhood linked rebel groups together with smatterings of Salafists and secular groups still retain the label. In the South of Syria, FSA-affiliated groups have been successful in desert warfare against ISIS, and still defend most of Dara'a from Assad's forces. In the north, the Turkish Army intervention has been successful in creating a wedge between the two Kurdish cantons."
 NUS_MODERN_DAY_DESC: "En janvier 2017, plusieurs factions de moudjahidines se sont unies sous l'appel à un djihad unifié contre le tyran Al-Assad. Connue sous le nom de Hayat Tahrir al-Sham, ou Comité de Libération du Levant, cette redoutable organisation s'est forgée dans le bain de sang de la guerre civile syrienne. Le groupe est classé par les États-Unis comme une organisation terroriste et une organisation affiliée à Al-Qaïda."
 ROJ_MODERN_DAY_DESC: "As the Syrian Civil War began, Assad's forces withdrew from the Kurdish areas to defend its heartland. This allowed the long repressed Kurdish people, through the left-wing Democratic Union Party and its militia, the YPG, to take control and establish Rojava, based on democratic socialism and gender equality. As ISIS entered the Syrian battlefield, they targeted the Kurds with force, taking over large swaths of Rojava, culminating in the failed assault on Kobane. With reinforcements from the Peshmerga, the Turkish PKK and US air support, the Kurds were able to turn the tide and send ISIS on the run. Since then, it has incorporated parts of the old FSA under the banner of the \"SDF\". However, its future challenges remain numerous, with Turkey repeatedly threatening war and fears looming that the tacit alliance with Assad might break down into conflict."
 OTHER_MODERN_DAY_DESC: "Les nations du monde, grandes et petites, ne se sont pas toutes résolues à retenir leur souffle en attendant le déclenchement d'un nouveau conflit mondial. Des grandes puissances au bord de la guerre civile aux nombreuses nations formées et transformées par la Grande Guerre, toutes devront prendre des décisions difficiles et trouver un équilibre entre idéaux et pragmatisme pour avoir un impact sur l'avenir du monde."
 DEN_MODERN_DAY_DESC: "Le Danemark est un pays sûr et sans danger, membre à la fois de l'UE et de l'OTAN. Cependant, un ralentissement économique interne met depuis peu l'État danois au défi. Il est loin d'être certain que le Danemark pourra rester à l'abri des turbulences du monde extérieur."
 ETH_MODERN_DAY_DESC: "La monarchie éthiopienne a été renversée en 1974, et la dictature communiste qui l'a suivie l'a été en 1991. La constitution de 1995 a assuré une démocratie assez stable, mais elle n'a pas réussi à résoudre les problèmes de famine, de crise politique et de corruption."
 FIN_MODERN_DAY_DESC: "Toujours soucieuse de préserver sa neutralité, la Finlande a suivi avec attention l'effondrement de l'Union soviétique et l'expansion politique du projet intégrationniste Ouest-européen qui a suivi. Les Finlandais ont rejoint l'UE en 1995 et ont également adopté l'Euro comme monnaie. La paix peut-elle durer ? Les Russes sont-ils vraiment apaisés ?"
 ITA_MODERN_DAY_DESC: "Depuis le début du XXe siècle, l'Italie est légèrement en retard sur les autres grandes puissances. Après sa défaite lors de la Seconde Guerre mondiale, les liens étroits qui unissent l'Italie à ses anciens ennemis et à son ancien allié allemand lui ont permis de redevenir un pays hautement développé et prospère. Mais que réserve l'avenir ? Grandeur nationale ou désastre économique ?"
 GRE_MODERN_DAY_DESC: "La Grèce est dans la tourmente depuis la récession de 2008 qui a davantage affaibli son économie déjà fragile. L'augmentation du rapport entre la dette et le PIB, combinée aux tensions liées à la montée des partis radicaux, fait que la situation de la Grèce s'aggrave de jour en jour. En outre, les relations entre la Grèce et la Turquie sont toujours tendues, ce qui signifie que le moindre incident mineur peut potentiellement pousser les deux pays vers la guerre. La Grèce est au bord de l'effondrement, la moindre décision pouvant sauver ou briser le pays. Espérons que vous ferez les bons choix."
 SWE_MODERN_DAY_DESC: "La Suède a connu une profonde crise économique au début des années 1990, l'adhésion du pays à l'UE en 1995 n'ayant guère contribué à atténuer ses problèmes. La nation suédoise, qui reste militairement neutre comme le veut sa tradition, doit trouver des réponses économiques à ses problèmes actuels."
 POL_MODERN_DAY_DESC: "La Pologne s'est développée massivement depuis son arrivée dans l'Union européenne en 2004. Elle est désormais une puissance régionale et l'une des économies à la croissance la plus rapide en Europe. Elle est en passe de devenir l'une des puissances les plus importantes de la région, et sa situation politique actuelle est intéressante, car le PiS est arrivé au pouvoir et les relations avec l'UE se sont envenimées. Pays farouchement anti-russe, la Pologne a fait de gros efforts pour renforcer ses relations avec les États-Unis."
 SWI_MODERN_DAY_DESC: "Neutre depuis des temps immémoriaux, la Suisse a décidé de rester en dehors de l'OTAN et de l'Union européenne. La communauté internationale peut-elle encore compter sur la Suisse pour être le juge silencieux et le terrain neutre qu'elle a toujours été ? Ou le peuple suisse verra-t-il son gouvernement jouer un rôle plus actif à l'étranger pour préserver la paix et faire respecter les intérêts nationaux suisses ?"
 BRM_MODERN_DAY_DESC: "Aung San Suu Kyi, once the darling of the international community, has seen a dramatic reversal of fortunes in terms of international public opinion. No longer the charismatic and eloquent human rights campaigner, the Rohingya Crisis has transformed Myanmar's de facto leader into a vilified war criminal in the eyes of many. Within the country's territorial boundaries, rebel groups and still powerful military generals watch for signs of weakness. These twin dilemmas, international and domestic, present the government of Myanmar with important choices. Permit or halt the violence against the Muslims of Rakhine. Attempt to restore relations with the West, or fall back on the military junta's old ally, China. The answer is far from clear."
 NIG_MODERN_DAY_DESC: "Nigeria's last ten years have shown the true colors of the Islamic State as it supports the major uprising of Boko Haram and the Salafist rebels in the North East of Nigeria. The military of Nigeria proved incredibly ineffective at fighting in the new kind of guerilla warfare. It has slowly grown into a major regional conflict as the Nigerian government is slowly losing more and more control over the state of Borno.\n Will you end the insurgency or join the global jihad?"
 BHR_MODERN_DAY_DESC: "Le Bahreïn n'a pas échappé à la vague de protestations qui s'est répandue dans tout le Moyen-Orient dans le cadre du « printemps arabe ». Le Jour de la Rage a vu la majorité chiite exprimer sa frustration à l'encontre d'une monarchie perçue non seulement comme discriminatoire à l'égard des chiites, mais aussi comme un occupant étranger et un oppresseur du véritable peuple autochtone bahreïni. Sans l'intervention du Bouclier de la Péninsule, la monarchie aurait très bien pu s'effondrer en 2011.\n\nLa priorité de la dynastie Khalifa est donc la préservation de son règne face à l'hostilité des chiites. Si, historiquement, l'opposition sunnite représentait une plus grande menace, le spectre de l'influence iranienne et la libéralisation politique limitée signifient que cette menace a été maîtrisée, du moins pour l'instant."
 KUW_MODERN_DAY_DESC: "Le Koweït jouit d'une position internationale relativement confortable. La plus grande menace pour sa souveraineté, l'Irak de Saddam Hussein, a été éliminée par l'invasion américaine de 2003, et le Koweït a réussi à maintenir de bonnes relations avec tous les acteurs régionaux du Moyen-Orient.\n\nLe plus grand défi du Koweït, bien qu'il ne soit pas urgent, est de nature interne. Le système semi-démocratique du pays a renforcé la légitimité du gouvernement, mais a empêché les réformes nécessaires pour diversifier l'économie koweïtienne, qui dépend du pétrole. De plus, ces réformes n'ont pas complètement apaisé l'opposition, qui continue de s'opposer à la censure gouvernementale et à la répression occasionnelle des militants politiques."
 OMA_MODERN_DAY_DESC: "Oman a acquis la réputation d'être un phare de paix et de stabilité dans une région agitée et sujette aux conflits. Qaboos bin Said al Said a mené une politique étrangère fructueuse depuis son arrivée au pouvoir en 1970, à la tête d'un pays qui n'est détesté par personne et admiré par tous. Mais Oman n'est pas sans difficultés. Le sultan a été critiqué pour son approche musclée de la dissidence interne, ce qui suscite des incertitudes quant à la pérennité de la monarchie absolue. En outre, la guerre au Yémen a fait naître une nouvelle menace. Oman a toujours considéré la province yéménite d'al-Mahra comme faisant partie de sa sphère d'influence, étant donné les liens culturels étroits qui unissent la région au Dhofar d'Oman. Mais la présence de troupes saoudiennes menace la frontière d'Oman et ne sera pas tolérée par l'État omanais, même si cela implique de saper secrètement l'effort de guerre saoudien."
 QAT_MODERN_DAY_DESC: "Since 1996 Qatar has charted an independent course within the Gulf Cooperation Council. The country's natural gas reserves have allowed Qatar to operate outside of the Saudi-dominated oil market, and for decades the emirs of Qatar have enjoyed a close relationship to the populist Muslim Brotherhood, an organization that the Saudis and Emiratis have increasingly come to see as a threat to their authority. As the home of Al-Jazeera, Qatar is partially blamed by the other Arab autocracies for the spread of the Arab uprisings collectively known as the Arab Spring. Worst of all in the eyes of the Saudis and their Emirati allies is Qatar's close relationship with Iran, a state that they view as an existential threat. It is only a matter of time before the hostility of Qatar's neighbors to its unique foreign policy reaches boiling point."
 SAU_MODERN_DAY_DESC: "Les Saoudiens ont assisté à la transformation irrévocable du Moyen-Orient par une série d'événements capitaux. Tout d'abord, les événements de 2003 ont éliminé un acteur majeur dans la lutte pour le pouvoir entre l'Arabie saoudite, l'Irak et l'Iran et ont attisé les tensions sectaires entre sunnites et chiites en raison de la guerre civile qui a suivi. Ensuite, les Saoudiens ont regardé avec horreur les régimes amis du monde arabe être renversés par le phénomène connu sous le nom de Printemps arabe. Et enfin, les Saoudiens ont observé avec anxiété le retrait progressif des États-Unis de la région et leur rapprochement avec l'Iran sous Obama. Tout cela a convaincu les Saoudiens de la nécessité d'une politique étrangère plus proactive, qui a conduit la monarchie à contrer agressivement l'influence iranienne dans tout le Moyen-Orient. Du Liban au Yémen, de la Syrie à l'Irak, les lignes de front sont tracées."
 SIN_MODERN_DAY_DESC: "Le secteur financier de Singapour a explosé ces dernières années. Le pays a lentement attiré les regards de l'Asie du Sud-Est en tant que modèle pour les autres nations de la région. Sa législation favorable aux entreprises lui a permis de maintenir une croissance incroyable et de devenir l'une des nations les plus riches de la planète en terme de PIB par habitant. La Cité du Lion continue d'exploser et de s'étendre, mais la Chine a éclipsé cette ville et reste une menace omniprésente qui se profile à l'horizon."
 PHI_MODERN_DAY_DESC: "D'un point de vue économique, les Philippines sont considérées comme l'une des nouvelles nations industrialisées, car elles continuent à maintenir des taux de croissance d'au moins 5%. Étant l'une des économies des « tigres asiatiques », elles ont pu maintenir leur présence sur la liste des marchés émergents importants. Récemment, lors de l'élection de 2016, Rodrigo Duterte a pris le pouvoir et a promis de poursuivre une guerre agressive contre les cartels et d'assouplir sa position à l'égard du Front Moro islamique de libération en déclarant que les Moros ont été injustement traités et qu'il cherche à étendre leur représentation.\n"
 UAE_MODERN_DAY_DESC: "Surnommés affectueusement la « Petite Sparte » par les responsables américains, les Émirats arabes unis sont un proche allié des États-Unis et de l'Arabie saoudite et participent volontiers aux opérations militaires multilatérales. Les forces armées émiriennes, en particulier leur armée de l'air réputée et leur garde présidentielle d'élite, ont servi en Afghanistan, en Libye, au Kosovo, en Somalie et maintenant au Yémen. Mais les Émirats arabes unis ne se contentent pas de jouer les seconds rôles face aux États-Unis ou à l'Arabie saoudite. Les Émirats se sont surpassés en termes d'influence étrangère, rivalisant parfois avec leurs anciens alliés, par exemple en soutenant les séparatistes du Yémen temporairement alliés au gouvernement Hadi, soutenu par l'Arabie saoudite. Par ailleurs, les EAU abritent le seul cas réussi de diversification économique, Dubaï ayant acquis une réputation de ville mondiale et de centre financier."
 CAN_MODERN_DAY_DESC: "Ayant obtenu son indépendance complète du Royaume-Uni en 1982, le Canada est le 4ème plus grand exportateur de pétrole au monde et s'est avéré être l'un des pays les plus importants dans les opérations de contre-terrorisme. Avec la deuxième plus grande masse continentale du monde, le Canada est composé principalement de plaines et de montagnes de glace, la majorité de la population résidant dans le sud du pays. Avec une grande quantité de ressources à sa disposition, le Canada est un pays aux possibilités et au potentiel infinis."
 KOR_MODERN_DAY_DESC: "La Corée est au cœur de l'un des scandales présidentiels les plus dramatiques de son histoire. À la suite de manifestations massives, la présidente conservatrice Park Geun-hye vient d'être destituée par l'Assemblée nationale en raison de l'influence obscure de sa conseillère à l'allure de Raspoutine, Choi Soon-sil. Le parti au pouvoir étant dans le chaos et de nouvelles élections devant être convoquées dans quelques mois, les conditions semblent réunies pour que le Parti démocrate de gauche revienne au pouvoir.\n\nSi l'espoir présidentiel Moon Jae-in parvient à la Maison-Bleue, il devra restaurer la confiance dans le système politique sud-coréen, réaliser un programme économique ambitieux et gérer les relations probablement tendues entre les États-Unis et la Corée du Nord après l'élection présidentielle américaine."
 NKO_MODERN_DAY_DESC: "Beaucoup ont sous-estimé le jeune et corpulent Kim Jong-un lorsque le moment est venu pour lui d'assumer la position de son père en tant que chef suprême de la République populaire démocratique. Depuis, il est apparu clairement que ce personnage mal compris, formé en Suisse, était une force avec laquelle il fallait compter. Sa consolidation brutale du pouvoir s'est traduite par l'exécution de l'oncle de Kim et d'un grand nombre d'autres fonctionnaires, y compris, si l'on en croit les rapports, une exécution au canon antiaérien. Mais la position du jeune Kim n'est pas entièrement sûre. Des dissensions subsistent dans les rangs de la classe dirigeante, et son ambitieux programme de réforme économique continue de s'accélérer. La dernière itération de la dynastie des Kim du Nord soutiendra-t-elle l'État comme l'ont fait son père et son grand-père ? Ou assistera-t-il à l'effondrement de son régime ?"
 BOT_MODERN_DAY_DESC: "Botswana is one of the most highly developed countries in Africa with a stable democracy, high human development index and low corruption. Botswana gained its wealth after large amounts of diamonds were found, which led to one of the highest GDP per capita in Africa. However, it is not without its problems; the politics are dominated by the BDP party, whom many see as autocratic and exclusive. In addition, poaching is rampant in the country's many game reserves. Diamonds are also not going to last forever, and a solution needs to be found to find alternatives for the economy."
 AFG_MODERN_DAY_DESC: "With the help of coalition forces, the Northern Alliance successfully toppled the Taliban regime. Instead of being annihilated, the Taliban have since fragmented and begun waging an insurgency in various parts of Afghanistan, they still pose a significant threat to coalition and government forces. While some actions of the coalition forces are reasons for the Taliban's growth, the inefficiency and corruption of the central government and Afghanistan's unique pre-modern tribal culture are the main reasons why the Taliban are difficult to annihilate, not to mention the fact that Taliban militants can hide and regroup in parts of Pakistan and return to the fight in Afghanistan. Will government forces end the Taliban insurgency? Or will there be a peace deal to convince the Taliban to peacefully lay down their arms and join the government?"
 LIC_MODERN_DAY_DESC: "Liechtenstein is a small and unassuming but well developed nation in the heart of Europe. With a population of only about thirty-eight thousand and one of the only two double-landlocked nations in the world, it's safe to say that nobody expects much from Liechtenstein. Heavily dependant on its neighbors in the alps for both its economy and security, Liechtenstein has many difficult choices ahead of it. Should it be a bastion of international cooperation, or a haven for ill-intentioned international corporations? Should it accept refugees from around the world in an attempt to become a real military power, or close its borders and focus only on itself. Only time will tell."
 MILLENNIUM_DAWN: "L'aube du millénaire"
 MILLENNIUM_DAWN_DESC: "Le monde a changé. À l'échelle mondiale, une atmosphère de paix et de prospérité a régné pendant environ un demi-siècle. Mais avec la fin récente de la guerre froide et la montée en puissance de la République populaire de Chine, comment ce monde va-t-il se percevoir ? Comment va-t-il se façonner ? Les États-Unis poursuivront-ils leur domination ? La nouvelle Fédération de Russie trouvera-t-elle sa place sous les projecteurs ? Quels rôles joueront les anciens grands empires européens que sont le Royaume-Uni, la France et l'Allemagne ? Et quel sera le rôle de la menace terroriste ? Le monde a changé. Le monde est en train de changer."
 CHI_MILLENNIUM_DAWN_DESC: "Le coin perdu d'hier. La superpuissance de demain. Après des décennies d'intimidation européenne et encore plus de décennies de guerre civile, de conflits et d'invasion par les Japonais, la Chine cherche à se reconstruire en tant que première puissance d'Asie et, à terme, du monde.\n\nSous la direction du Parti communiste, de grands progrès ont été réalisés dans la construction d'une nouvelle Chine. Mais cette nouvelle Chine est fragile. Si la Chine se réforme trop lentement, elle risque d'être détruite. Si elle se réforme trop rapidement, elle risque de s'autodétruire."
 FRA_MILLENNIUM_DAWN_DESC: "Centre mondial de l'art, de la culture et de la diplomatie, la France se tourne vers un nouveau siècle plein d'espoir et d'opportunités. La tyrannie des anciennes monarchies et la destruction des guerres mondiales ont précipité la France vers l'Union européenne, dont elle est un membre fondateur.\n\nSeul l'avenir nous dira comment les Français aborderont le siècle à venir."
 GER_MILLENNIUM_DAWN_DESC: "Le retrait des Soviétiques et la réunification de l'Allemagne de l'Est et de l'Ouest ont insufflé un nouvel espoir au pays. Le passé douloureux de l'Allemagne et les horreurs du fascisme restent gravés dans la mémoire collective. Aujourd'hui, l'Allemagne figure parmi les nations les plus démocratiques d'Europe, dotée d'un système de protection sociale performant et d'une des économies les plus dynamiques du continent.\n\nMembre fondateur de l'Union européenne, l'Allemagne envisage d'élargir le bloc pour y inclure les anciens États soviétiques d'Europe de l'Est, face à une possible résurgence de la Russie."
 JAP_MILLENNIUM_DAWN_DESC: "Terre composée de quelque 6 852 îles, le peuple maritime du Japon a parcouru un long chemin depuis la Seconde Guerre mondiale et les bombardements atomiques d'Hiroshima et de Nagasaki. Aujourd'hui, le Japon est la deuxième plus grande économie de la planète, réputée pour son innovation technologique et ses produits de qualité expédiés dans le monde entier.\n\nSoutenu par ses alliés américains et européens, le Japon regarde avec méfiance son vieux rival, la Chine, avec à la fois une confiance retrouvée et un nouveau potentiel de conflit."
 SOV_MILLENNIUM_DAWN_DESC: "Le coup d'État d'août 1991 et l'effondrement subséquent de l'Union soviétique ont laissé l'économie russe en ruines, sa fierté ébranlée et son avenir sombre. En l'absence d'une autorité centrale forte, des oligarques et des fonctionnaires corrompus ont comblé le vide du pouvoir.\n\nLa récente ascension de Vladimir Poutine amène beaucoup de gens à se demander comment cet ancien officier du KGB tentera de restaurer l'héritage de la Russie et de la faire entrer dans une nouvelle ère."
 ENG_MILLENNIUM_DAWN_DESC: "With Hong Kong handed over to China in 1997, the United Kingdom has bid farewell to its last great colonial possession. The once mightiest nation on Earth is desperately trying to redefine itself and find a new path to greatness and glory. A two party system divides the political sphere into two, Tory or Labour. With growing disagreements over how the country shall be run from the National Health Service to the policies of the military.\n\nWill that path lie in continued cooperation with the United States? Should Britain draw closer to its European brethren? Or shall Britannia, on her own, rule the waves once more?"
 USA_MILLENNIUM_DAWN_DESC: "L'effondrement de l'Union soviétique a instauré une situation inédite d'unipolarité mondiale. Les États-Unis occupent une position de premier plan dans les domaines technologique, militaire et culturel à l'œuvre à travers le monde. Leur influence n'a jamais été aussi grande et leur avenir n'a jamais semblé aussi prometteur.\n\nLes prochaines élections constitueront un moment crucial pour déterminer l’avenir de l’Amérique ; et pour le meilleur ou pour le pire, le monde."
 TUR_MILLENNIUM_DAWN_DESC: "Depuis l'effondrement de l'Empire ottoman à la fin de la Première Guerre mondiale, la Turquie est restée largement en retrait des enjeux géopolitiques. Aujourd'hui, sa position la place de nouveau sous les feux de la rampe, alors que des idéologies concurrentes s'efforcent d'influencer le pays dans un sens ou dans l'autre.\n\nLa République doit-elle poursuivre les réformes d'Atatürk et rechercher la reconnaissance de l'UE, ou rester fidèle à son héritage islamique ? La santé déclinante du Premier ministre Bülent Ecevit laisse présager des temps incertains."
 UKR_MILLENNIUM_DAWN_DESC: "Les élections de 1999 étaient censées apporter une victoire inconditionnelle au leader libéral du Mouvement national - Viatcheslav Tchornovil. Mais peu de temps après, il est décédé dans un accident de voiture dans des circonstances mystérieuses. L'actuel président, Leonid Koutchma, a remporté les élections grâce à des slogans honnêtes et à l'absence de promesses populistes. Mais on peut encore se demander ce que sa mouvance apportera.\n\nAprès avoir été privée de son statut nucléaire en 1996 et avoir signé les mémorandums de Budapest, l'Ukraine a reçu des garanties de protection de la part des États les plus puissants et un ticket pour le théâtre mondial. Mais qui sera ce jeune pays lors de la future représentation ? Un participant direct ou un simple observateur dans les derniers rangs ?"
 BRA_MILLENNIUM_DAWN_DESC: "En ce début de siècle, le Brésil est en pleine ascension. Le pays a le potentiel pour la grandeur. C'est l'une des plus grandes économies émergentes du monde et sa croissance n'a cessé de s'accélérer. Toutefois, ces dernières années, le courant économique brésilien se remet d'une dure récession due à la crise financière asiatique de 1995 et d'une monnaie paralysée. Aujourd'hui, un nouveau parti est arrivé sur la scène. Le Parti des travailleurs (PT) a fait son entrée et gagne rapidement du terrain.\n\nSerez-vous en mesure de relancer l'économie autrefois florissante du pays ? Le PT et ses politiques socialistes vont-elles être appliquées ?"
 CAN_MILLENNIUM_DAWN_DESC: ""
 SMA_MILLENNIUM_DAWN_DESC: "Saint-Marin est un pays extrêmement petit et est en fait complètement dépendant de l'Italie. Enclavé et dépourvu d'aéroport, il est très dépendant des touristes, qui représentent une grande partie de son PIB. Cela vaut-il la peine d'aller sur le compte de l'Italie, en restant en fait son territoire, ou est-il nécessaire de suivre notre propre voie ? Tout cela est actuellement décidé par deux capitaines-régents, qui sont nommés par le Grand Conseil général pour une période de 6 mois. Le Grand Conseil compte 60 membres. Mais il y a aussi l'Arengo, l'Assemblée des chefs de famille, qui était l'organe suprême dans les temps anciens, qui a aujourd'hui presque complètement perdu son pouvoir, mais qui a conservé le droit de pétition. Les capitaines-régents reçoivent de nombreuses pétitions présentées par les citoyens le premier dimanche après le 1er avril et après le 1er octobre. Les pétitions déposées doivent être examinées dans un délai de 6 mois."
 DEN_MILLENNIUM_DAWN_DESC: "Le Danemark est une nation sûre et sécurisée, étant à la fois membre de l'UE et de l'OTAN. Cependant, un ralentissement économique interne a récemment commencé à remettre en question l'État danois. Il est loin d'être certain que le Danemark puisse rester à l'abri des turbulences du monde extérieur."
 ETH_MILLENNIUM_DAWN_DESC: "La monarchie éthiopienne a été renversée en 1974 et la dictature communiste qui a suivi en 1991. La constitution de 1995 a permis d'instaurer une démocratie quelque peu stable, mais elle n'a pas réussi à résoudre les problèmes de famine, de crise politique et de corruption. Elle n'a pas non plus résolu le conflit actuel entre l'Éthiopie et l'Érythrée."
 FIN_MILLENNIUM_DAWN_DESC: "Toujours soucieuse de préserver sa neutralité, la Finlande a suivi avec attention l'effondrement de l'Union soviétique et l'expansion politique des forces d'Europe occidentale qui s'en est suivie. Les Finlandais ont rejoint l'UE en 1995 et sont sur le point d'adopter l'euro comme monnaie nationale. La paix peut-elle perdurer ? Les Russes sont-ils vraiment pacifiés ?"
 GRE_MILLENNIUM_DAWN_DESC: "À l'aube du XXIème siècle, la Grèce semble satisfaite. Cependant, la crise de la dette et la montée des partis politiques radicaux des deux côtés de l'échiquier suscitent des inquiétudes croissantes. L'avenir de la République hellénique est incertain, et si elle n'est pas correctement guidée, elle pourrait s'engager sur une voie sombre."
 ICE_MILLENNIUM_DAWN_DESC: "Dans un coin caché de l'Europe, l'Islande a réussi à garder un profil bas depuis son indépendance en 1944. Les conflits politiques avec les Britanniques au sujet des droits de pêche ont peut-être été la période la plus passionnante de l'histoire islandaise. L'Islande devrait-elle adopter une position plus centrale ?"
 ITA_MILLENNIUM_DAWN_DESC: "Depuis le début du XXème siècle, l'Italie est légèrement en retard sur les autres grandes puissances. Après sa défaite lors de la Seconde Guerre mondiale, les liens étroits qui unissent l'Italie à ses anciens ennemis et à son ancien allié allemand lui ont permis de retrouver le statut de pays hautement développé et prospère. Mais que réserve l'avenir ? Grandeur nationale ou désastre économique ?"
 RAJ_MILLENNIUM_DAWN_DESC: "Là où la Chine est la superpuissance de demain, l'Inde est la superpuissance de la semaine prochaine. Ses luttes constantes contre le Pakistan et la Chine ainsi que ses liens économiques profonds avec l'Occident ont donné à l'Inde une niche pour prospérer. Si on lui laisse suffisamment de temps, le tigre de l'Asie du Sud sera suffisamment fort pour éliminer tous ses ennemis."
 SPR_MILLENNIUM_DAWN_DESC: "Depuis la mort de Franco en 1975, l'Espagne s'est engagée sur un long chemin de redressement. À travers des difficultés économiques et sociales, le pays a réussi à résoudre en partie les problèmes que des décennies de falangisme avaient causés. L'Espagne a rejoint l'OTAN (1982) et l'UE (1986) et a travaillé sans relâche et au prix d'efforts considérables pour rattraper les grands pays d'Europe plus puissants et plus riches, à savoir l'Allemagne, la France, le Royaume-Uni et l'Italie.\nPar les temps qui courent, l'Espagne a besoin d'un gouvernement sollide et d'une main stable. Le Premier ministre Aznar peut-il tenir ses promesses ? Ou son Partido Popular fera-t-il place à un pouvoir plus digne de ce nom ?"
 SWE_MILLENNIUM_DAWN_DESC: "La Suède a connu une profonde crise économique au début des années 1990, l'adhésion du pays à l'UE en 1995 n'ayant guère contribué à atténuer ses problèmes. La nation suédoise, qui reste militairement neutre comme le veut sa tradition, doit trouver des réponses économiques à ses problèmes actuels."
 SWI_MILLENNIUM_DAWN_DESC: "Neutre depuis des temps immémoriaux, la Suisse a décidé de rester à l’écart non seulement de l’OTAN et de l’Union européenne, mais aussi des Nations Unies. La communauté internationale peut-elle encore compter sur la Suisse pour être le juge silencieux et le terrain neutre qu’elle a toujours été ? Ou le peuple suisse verra-t-il son gouvernement jouer un rôle plus actif à l’étranger pour préserver la paix et faire valoir les intérêts nationaux suisses ?"
 BRM_MILLENNIUM_DAWN_DESC: "En ce début de XXIème siècle, le Myanmar se trouve à la croisée des chemins. La junte militaire a pris conscience que son emprise sur le pouvoir se relâche progressivement, alors que la pression interne et externe en faveur de la démocratisation se fait de plus en plus forte. Toutefois, la démocratisation ou son absence n'est pas la seule question qui se pose au gouvernement du Myanmar. L'intégrité territoriale de cette nation d'Asie du Sud-Est a été ébranlée depuis son indépendance, et des groupes rebelles luttant pour une plus grande autonomie sévissent dans les régions frontalières du Myanmar. Les solutions à ce double dilemme restent floues. Violence ou diplomatie ? Démocratie ou autoritarisme ? Compromis ou révolution ? Seul le temps nous le dira."
 LIC_MILLENNIUM_DAWN_DESC: "Le Liechtenstein est une petite nation sans prétention, mais bien développée, située au cœur de l'Europe. Avec une population de seulement six mille habitants et l'une des deux seules nations doublement enclavées au monde, on peut dire que personne n'attend grand-chose du Liechtenstein. Fortement dépendant de ses voisins alpins pour son économie et sa sécurité, le Liechtenstein doit faire des choix difficiles. Doit-il être un bastion de la coopération internationale ou un refuge pour les entreprises internationales mal intentionnées ? Doit-il accepter des réfugiés du monde entier pour tenter de devenir une véritable puissance militaire, ou fermer ses frontières et se concentrer uniquement sur lui-même ? Seul le temps nous le dira."
 POL_MILLENNIUM_DAWN_DESC: "La Pologne s'est récemment libérée du bloc communiste de l'Union soviétique. La situation actuelle du pays est loin d'être parfaite. Malgré la croissance de l'économie polonaise depuis la chute du communisme, le peuple polonais continue de lutter. Malgré ces difficultés, la nation elle-même a beaucoup de potentiel pour devenir une puissance économique importante. L'avenir semble prometteur pour la Pologne."
 NIG_MILLENNIUM_DAWN_DESC: "Le Nigeria, pays le plus peuplé d'Afrique, n'a cessé de gagner en importance régionale depuis le début du siècle, tirant parti de son avantage démographique de plus de 200 millions d'habitants et de l'expansion de son secteur financier pour consolider sa présence sur les marchés internationaux. La transition du pays vers un régime civil en 1999 a instauré un système démocratique fragile mais prometteur, qui a recueilli des soutiens tant au niveau national qu'international, permettant ainsi une plus grande influence diplomatique en Afrique de l'Ouest. Cependant, cette expérience démocratique est aujourd'hui confrontée à un défi majeur : douze États du nord ont appliqué la charia à des degrés divers depuis 2000, créant une profonde division religieuse. Le sud, à majorité chrétienne, a réagi par de vastes manifestations et des troubles civils, tandis que des violences sectaires ont éclaté dans des zones mixtes comme les États de Kaduna et du Plateau. Alors que les tensions religieuses s'intensifient et que des milices armées se forment des deux côtés, la question se pose : la polarisation religieuse du Nigeria entre un nord majoritairement musulman et un sud chrétien mènera-t-elle à la guerre civile ?"
 BHR_MILLENNIUM_DAWN_DESC: "Le nouvel émir de Bahreïn, Hamad ben Issa Al Khalifa, hérite d'une position précaire. La majorité chiite de Bahreïn nourrit une grande frustration à l'égard d'une monarchie qui est perçue non seulement comme discriminatoire à l'égard des chiites, mais aussi comme un occupant étranger et un oppresseur du véritable peuple autochtone bahreïnien. L'opposition sunnite, pour des raisons certes différentes, n'apprécie pas la nature autocratique du gouvernement bahreïnien et s'est alliée à des groupes chiites opposés au maintien de la monarchie absolue. Certains conseillers de l'émir ont prôné la libéralisation politique afin de réduire la pression exercée sur le régime, tandis que d'autres ont préconisé un renforcement du régime autocratique. Il appartiendra au nouveau dirigeant de Bahreïn de tracer la voie à suivre pour le pays."
 KUW_MILLENNIUM_DAWN_DESC: "Il n'y a pas si longtemps, le Koweït était un pays sous occupation. Sa monarchie était en exil et faisait campagne pour le rétablissement de la souveraineté koweïtienne, tandis que le peuple koweïtien, tant sunnite que chiite, était uni contre l'oppresseur irakien. Maintenant que la guerre du Golfe a restauré l'indépendance du Koweït, la monarchie doit reprendre l'exercice d'équilibre politique qui consiste à diriger la nation du Koweït. Le parlement koweïtien, l'un des plus puissants du Moyen-Orient, exerce un contrôle puissant sur l'autorité du monarque tout en faisant continuellement pression pour une plus grande libéralisation politique. L'influente classe marchande du pays continue de faire pression pour un plus grand investissement dans le secteur privé, ce que les citoyens koweïtiens employés dans le secteur public sont réticents à voir se produire au détriment de leur propre bien-être."
 OMA_MILLENNIUM_DAWN_DESC: "Oman a acquis la réputation d'être un phare de paix et de stabilité dans une région agitée et sujette aux conflits. Qabus ibn Saïd a mené une politique étrangère fructueuse depuis son arrivée au pouvoir en 1970, à la tête d'un pays qui n'est détesté par personne et admiré par tous. Mais Oman n'est pas sans difficultés. Le sultan a été critiqué pour son approche musclée de la dissidence interne, ce qui suscite des incertitudes quant à la pérennité de la monarchie absolue."
 QAT_MILLENNIUM_DAWN_DESC: "Since 1996 Qatar has charted an independent course within the Gulf Cooperation Council. The country's natural gas reserves have allowed Qatar to operate outside of the Saudi-dominated oil market, and for decades the emirs of Qatar have enjoyed a close relationship to the populist Muslim Brotherhood, an organization that the Saudis and Emiratis have increasingly come to see as a threat to their authority. Worst of all in the eyes of the Saudis and their Emirati allies is Qatar's close relationship with Iran, a state that they view as an existential threat. It is only a matter of time before the hostility of Qatar's neighbors to its unique foreign policy reaches boiling point."
 SAU_MILLENNIUM_DAWN_DESC: "L'Arabie saoudite a toujours joui d'une position confortable en tant que l'une des principales puissances du Moyen-Orient. En tant que gardien des lieux saints de la Mecque et de Médine, le Royaume jouit d'une légitimité religieuse sans égale. Cependant, la révolution iranienne de 1979 a transformé la suspicion mutuelle entre l'Arabie saoudite et l'Iran en une franche hostilité, la nouvelle République islamique d'Iran cherchant à revendiquer le titre de leader du monde islamique. Sur le plan interne également, le Royaume doit faire face à des challengers pour le titre de leader du monde islamique. Depuis que les Saoudiens ont autorisé les troupes américaines à entrer dans le pays en 1991, les dirigeants d'Al-Qaïda ont juré de détruire la monarchie saoudienne et sa fausse piété et de la remplacer par un gouvernement véritablement islamique."
 SIN_MILLENNIUM_DAWN_DESC: "Singapore at the turn of the century held at most regional authority amongst the nations of Asia and abroad. The Asian financial crisis also did no favors to the small nation at the mouth of the Malay peninsula. Outside of the financial crisis and its small stature it has shown its strength in the entrepot, banking and foreign investment. The Singaporean people and her government have shown truly what it is like to be dubbed \"The Lion City\"\n"
 PHI_MILLENNIUM_DAWN_DESC: "The recent election of 1998, has seen a massive change in rhetoric within the Filipino political spectrum. Estrada and his coalition, Laban ng Makabayang Masang Pilipino (Struggle of the Patriotic Filipino Masses), saw resounding success against his opposition. Underneath Estrada the Philippines saw a resounding growth rate of 3.4% and is set on track to maintain the quick-paced growth. Furthermore, Estrada has begun mobilizing the AFP to prepare a declaration of all-out-war on the Moro Islamic Liberation Front. Hidden amongst this almost picturesque presidency lurks the monster of corruption and a subsequent trial."
 UAE_MILLENNIUM_DAWN_DESC: "Surnommés affectueusement par les responsables américains comme la « Petite Sparte », les Émirats arabes unis sont un allié proche des États-Unis et de l'Arabie saoudite et un participant enthousiaste aux opérations militaires multilatérales. Les forces armées émiriennes, en particulier son armée de l'air réputée et sa garde présidentielle d'élite, ont servi pendant la guerre du Golfe, accumulant ainsi une expérience militaire utile.\n\nMais les Émirats arabes unis ne se contentent pas de jouer les seconds rôles face aux États-Unis ou à l'Arabie saoudite. Les Émiriens se sont surpassés en termes d'influence étrangère, rivalisant parfois avec leurs anciens alliés. Par ailleurs, les Émirats arabes unis abritent le seul cas réussi de diversification économique, Dubaï ayant acquis une réputation de ville mondiale et de centre financier."
 KOR_MILLENNIUM_DAWN_DESC: "La République de Corée a réussi à surmonter la guerre, la pauvreté et la dictature pour devenir l'un des pays les plus développés et les plus stables du monde. Le président Kim Dae-jung est largement respecté pour le rôle qu'il a joué dans l'instauration de la démocratie en Corée et beaucoup espèrent que ses efforts pour faire la paix avec le Nord seront couronnés de succès.\n\nCependant, son administration a été entachée de scandales et la politique coréenne reste extrêmement polarisée. La partisanerie politique, la corruption du gouvernement et l'incertitude entourant les efforts du président pour se réconcilier avec le Nord définiront l'avenir de la Corée dans ce nouveau millénaire."
 NKO_MILLENNIUM_DAWN_DESC: "Surnommée le « royaume ermite », la Corée du Nord est un endroit que le monde extérieur perçoit comme mystérieux et menaçant à parts égales. Les rumeurs d'un programme nucléaire secret dans le pays se multiplient et son voisin du Sud reste méfiant quant aux intentions du Nord. Mais des fissures ont commencé à apparaître dans l'image impénétrable du royaume ermite. Toujours en train de se remettre d'une famine dévastatrice connue sous le nom de « marche forcée », la RPDC a dû compter sur une assistance extérieure pour l'aider à surmonter la tempête. Les faiblesses du système de gouvernance du Nord sont évidentes. Kim Jong-il va-t-il remédier à ces lacunes et adopter une approche diplomatique vis-à-vis du monde extérieur pour faciliter le développement ? Ou décidera-t-il que le bellicisme de l'armée et la ferveur idéologique du Parti doivent être soutenus par la guerre ?"
 BOT_MILLENNIUM_DAWN_DESC: "Le Botswana est l'un des pays les plus développés d'Afrique, avec une démocratie stable, un indice de développement humain élevé et une faible corruption. Le Botswana a acquis sa richesse après la découverte de grandes quantités de diamants, ce qui a conduit à l'un des PIB par habitant les plus élevés d'Afrique. Cependant, le pays n'est pas sans problèmes ; la politique est dominée par le BDP (Botswana Democratic Party), que beaucoup considèrent comme autocratique et peu ouvert. Par ailleurs, le braconnage est endémique dans les nombreuses réserves naturelles du pays. Les réserves de diamants ne sont pas non plus éternelles et une solution doit être trouvée pour trouver des alternatives à l'économie."
 AFG_MILLENNIUM_DAWN_DESC: "Depuis la prise du pouvoir par les communistes en 1978, l'Afghanistan a connu un cycle de guerre civile et d'interventions extérieures. Le retrait de l'Union soviétique en 1989 et la chute du régime en 1992 n'ont pas apporté la paix. Au contraire, le conflit d'intérêts entre les factions de moudjahidines a entraîné la poursuite des combats jusqu'en 1996, lorsque les talibans soutenus par le Pakistan ont profité de la guerre civile pour s'emparer de vastes régions de l'Afghanistan. Leur objectif était d'éliminer toutes les autres factions, obligeant les anciens chefs de guerre à former l'Alliance du Nord contre les talibans, sous la médiation du général Massoud. Que réserve l'avenir à ce pays déchiré par la guerre ?"
 ARM_MILLENNIUM_DAWN_DESC: "L'indépendance de l'Arménie, qu'elle a reçue l'une des premières après l'effondrement de l'URSS, ne lui a apporté ni prospérité ni grandeur. La guerre du Haut-Karabakh, déclenchée par les nationalistes, a complètement détruit la république. Dans le même temps, ce ne sont pas tant les hostilités elles-mêmes que le blocus de l'Arménie par l'Azerbaïdjan. À la tête de l'Arménie se trouve un homme politique controversé qui a une grande influence tant en Arménie même que dans l'Artsakh contesté. L'Arménie pourra-t-elle connaître la gloire sous son règne ou sombrera-t-elle dans un abîme éternel ?"
 BLR_MILLENNIUM_DAWN_DESC: "L'effondrement de l'Union soviétique a apporté à la Biélorussie une indépendance longtemps attendue. Mais le jeu en valait-il la chandelle ? L'économie est totalement dépendante de la Russie, l'armée n'est pas prête au combat et l'Occident cherche encore comment faire de la Biélorussie un bastion du sentiment anti-russe. Loukachenko, ou qui que ce soit d'autre, sera-t-il capable de choisir la bonne voie pour la Biélorussie ?"
 GEO_MILLENNIUM_DAWN_DESC: "La Géorgie, laissée à l'écart du Caucase après l'effondrement de l'URSS, est tombée dans une guerre civile presque en même temps que la guerre en Abkhazie et en Ossétie. Le renversement du président Gamsakhourdia a entraîné une instabilité politique, anéanti les espoirs d'une Géorgie unie et laissé une forte empreinte sur la population. La Géorgie sera-t-elle en mesure de devenir une puissance régionale ou continuera-t-elle à se diriger vers le chaos politique ?"
 AZE_MILLENNIUM_DAWN_DESC: "Azerbaijan, now headed by the authoritarian former communist Heydar Aliyev, is at a crossroads. The lost war in Artsakh, an unstable society and the growing ambitions of the people, put the government of Azerbaijan in front of an uncertain future. Will it be able to become the pearl of the Caucasus, or will it slide into political instability?"
 COM_MILLENNIUM_DAWN_DESC: "The Comoros island chain has an idyllic countryside. Jungles cover the mountains and the volcano Karthala. It's on the coast where most people live simple lives as fishermen, the country's single greatest revenue. Not always is it peaceful on these islands. Coups are a common occurrence and unruly governors try their best for more autonomy. Comoros does share a lot with its cultural neighbour Tanzania, except it's majority Muslim and all exclusively speak a dialect of Kiswahili.\n\nThe country has an interesting view on the french overseas department of Mayotte. Irredentists claim it as part of the nation though the people in Mayotte don't seem to share that view."
 COM_MODERN_DAY_DESC: "Comoros has seen its fair share of action. In 2008 the invasion to take back control of Anjouan was a success. Many citizens regrettably live poor lives with many fleeing to Mayotte in search for a better life. There's some good prospects for a membership in the East African Community. This can greatly improve investment opportunities to come to Comoros and raise the living standards for thousands. Most likely this country will live life with business as usual."
 ABK_MILLENNIUM_DAWN_DESC: "L'Abkhazie est un petit pays qui lutte depuis longtemps pour son indépendance. En 1993, ce pays a conquis son droit à l'indépendance, même si personne, à l'exception de la Russie, ne l'a reconnu pour ses droits. Peut-être que bientôt le monde entier entendra parler de l'Abkhazie"
 EST_MILLENNIUM_DAWN_DESC: "L'Estonie, officiellement connue sous le nom de République d'Estonie, célèbre sa neuvième année d'indépendance de l'Union soviétique ; Toutefois, cela ne signifie pas que l'influence russe continue de croître. Le petit pays balte est désormais pris entre l'attraction toujours croissante de l'Est et de l'Ouest. Il doit désormais faire face aux menaces qui pèsent sur son indépendance, à la montée de la pensée d'extrême droite et à une bureaucratie gouvernementale inefficace qui pose des problèmes dans le pays."
 FIJ_MILLENNIUM_DAWN_DESC: "Fiji, also known as the Republic of Fiji, is a Pacific island nation which has had a strikingly volatile history. Gaining independence in the 1970s, Fiji has had 2 coups and several changes of both government and constitutions which have only been enhanced through the growing ethnic divide between the Ethnic Fijians and the Ethnic Indo-Fijian peoples. But with the new millennium come new problems, only time will tell if Fiji can truly become the island paradise that she sells herself as."
 KAZ_MILLENNIUM_DAWN_DESC: "Le Kazakhstan, dernière nation à sortir de l'ombre de l'Union soviétique, est marqué par un déclin économique croissant provoqué par l'effondrement de son État. À l'aube du nouveau millénaire, des questions subsistent quant à sa trajectoire politique et économique. Quel avenir attendait le Kazakhstan au XXIe siècle, et comment équilibrerait-il ses aspirations à la modernisation et la préservation de son identité culturelle unique?"
 KYR_MILLENNIUM_DAWN_DESC: "Le Kirghizistan est une nation jeune et politiquement instable d'Asie centrale, marquée par une série de bouleversements politiques. Un autre nouvel autocrate a réussi à prendre le pouvoir en main. Parviendra-t-il à conserver le pouvoir malgré le conflit qui fait rage avec le Tadjikistan et l'Ouzbékistan ? Quel rôle la Russie et la Chine joueront-elles à cet égard ? Tout cela attend le Kirghizistan dans le nouveau millénaire."
 UZB_MILLENNIUM_DAWN_DESC: "En 2000, l'Ouzbékistan est une ancienne république soviétique caractérisée par un gouvernement centralisé et autoritaire. Son économie reposait principalement sur l'agriculture et la production de coton. Au début du nouveau millénaire, on peut se demander : quel avenir l'Ouzbékistan embrasserait-il au XXIe siècle ? Évoluerait-elle sur les plans politique, économique et social, et comment jouerait-elle son rôle dans un paysage changeant d'Asie centrale?"
 SER_MILLENNIUM_DAWN_DESC: "Les terribles bombardements de l'OTAN ont laissé des traces dans le cœur de tous les habitants de la Yougoslavie. Aujourd'hui, le pays doit choisir la voie à suivre pour entrer dans le nouveau millénaire. Peut-être est-il temps de se débarrasser des anciens dirigeants ? ou d'essayer de retrouver l'état antérieur ?"
 KOS_MILLENNIUM_DAWN_DESC: "Notre nation approche enfin du moment où nous pourrons enfin obtenir notre pleine indépendance.  Notre lutte contre l'influence de la Serbie approche de la phase finale. Allons-nous terminer ce que nous avons commencé ou allons-nous abandonner et redevenir une partie d'un autre pays ?"
 VEN_MILLENNIUM_DAWN_DESC: "Au début du nouveau millénaire, le Venezuela se trouvait à la croisée des chemins, façonné par une histoire riche et complexe, mêlée de promesses et d'incertitudes. L'année 2000 a marqué un tournant important dans l'évolution du pays, après une série de changements politiques et sociaux majeurs. En 1999, Hugo Chávez, un chef militaire charismatique, accède à la présidence du Venezuela. Son élection a représenté un tournant profond dans le récit de la nation. L'ascension de Chávez a été propulsée par son engagement à faire face aux défis persistants que sont l'inégalité sociale, la pauvreté et la corruption politique. Sous la bannière du Chavisme, son mouvement politique, il a défendu une vision pour une répartition plus juste et équitable des abondantes richesses pétrolières du Venezuela. Cependant, à mesure que le nouveau millénaire avançait, le pays se trouvait à un moment charnière, où l'orientation future du Venezuela était en jeu. Il y a eu des débats croissants et des points de vue divergents sur la question de savoir s'il fallait continuer sous la direction de Chávez ou explorer une voie alternative. Certains ont préconisé une prolongation du mandat de Chávez, soulignant sa mission de lutte contre les inégalités sociales, tandis que d'autres ont plaidé pour une voie différente, recherchant de nouvelles approches en matière de gouvernance et de stabilité économique. Verrons-nous un changement de gouvernement à l'avenir au Venezuela ? Ou verrons-nous la continuation de la Ve République?"
 HEZ_MILLENNIUM_DAWN_DESC: "Since the start of the Lebanese Civil War and the occurrence of the Islamic Revolution in Iran, an orthodox organization which was originally a part of the Islamic Amal movement of Lebanon, and its ideals was and is based on the doctrine of the \"Islamic Resistance\", was formed. The Hezbollah, the most powerful political and military entity in Lebanon, was formed. From those times, Hezbollah adjusted itself to be a leverage against the state of Israel and its allies in the Levant region. Although at the same time, it tries to have a dominance over the state of Lebanon itself. With  tensions in the middle east growing up since the Persian Gulf War, Hezbollah has tried to increase its base of operations beyond the Middle East. And now, with  the rise of tensions on the region once again, Hezbollah has to adjust its new plans, would the doctrine of the Resistance, and the political dominance of Hezbollah in Lebanon succeed? Only time and the changes of the world would tell... "
 SOO_MILLENNIUM_DAWN_DESC: "Autrefois partie de la RSS de Géorgie, l'Ossétie du Sud s'est séparée de la Géorgie et a déclaré son indépendance. Après la guerre sanglante, l'Ossétie a défendu son indépendance et a commencé à s'efforcer de s'intégrer à la Russie, mais au début du 21e siècle, la situation de l'État reste incertaine. D'un côté, la Géorgie hostile, de l'autre, la Russie, qui cherche à contrecœur à s'approprier une Ossétie petite mais fière."
 BUL_MILLENNIUM_DAWN_DESC: "La Bulgarie, qui a traversé la Seconde Guerre mondiale et est devenue une république socialiste, n'est devenue un État démocratique que récemment. Le nouveau millénaire s'annonce pour la Bulgarie avec de nouveaux défis à relever pour une nouvelle démocratie en plein essor dans les Balkans... Seul l'avenir montrera ce que la Bulgarie réalisera au cours de ce nouveau siècle, peut-être plus brillant."
 BOS_MILLENNIUM_DAWN_DESC: "La Bosnie, terre d'histoire et de culture, a été façonnée par les empires étrangers, de la puissance de l'Empire romain à l'effondrement de la République fédérale de Yougoslavie. Malgré les cicatrices laissées par sa lutte acharnée pour l'indépendance, le peuple bosnien demeure déterminé à construire un avenir meilleur.\n\nMalgré la persistance des divisions ethniques et religieuses, l'espoir et la résilience d'une nation déterminée à surmonter son passé restent intacts. L'avenir de la Bosnie est certes incertain, mais l'esprit inébranlable de son peuple est un phare dans la nuit, qui éclaire d'un jour nouveau un avenir meilleur."
 EGY_MILLENNIUM_DAWN_DESC: "En 2000, la politique égyptienne était dominée par le régime bien établi du président Hosni Moubarak, caractérisé par un contrôle autoritaire, des libertés politiques limitées et des tentatives de réforme sporadiques. Malgré une certaine croissance économique, le pays était confronté à une pauvreté généralisée, à la corruption et à l'inégalité sociale. La dissidence a été sévèrement réprimée, mais des signes d'opposition et des appels au changement ont persisté, notamment parmi les jeunes et les groupes de la société civile. Toutefois, l'avenir de la politique égyptienne reste incertain, les questions de succession, les griefs socio-économiques et l'impact potentiel des technologies de pointe ajoutant des couches de complexité au paysage politique du pays."
 IND_MILLENNIUM_DAWN_DESC: "Indonesia is the center of Southeast Asian affairs despite being rocked by economic troubles. The 1997 Asian financial crisis has crippled Indonesia's currency, the Rupiah which has brought much instability to the archipelago nation, further flamed by the fires raging in Aceh. Rising inflation, radicalization and disunity amongst the nation has been causing it to fall behind its neighbors and the rest of the world, and it has left its leaders scratching their heads on what to do in order to survive the 21st century"
 PMR_MILLENNIUM_DAWN_DESC: "En 2000, la Transnistrie, une région séparatiste de la Moldavie, était plongée dans une longue impasse politique. Ayant déclaré son indépendance en 1990, la région fonctionne comme une république autoproclamée, bien que sa souveraineté ne soit pas reconnue au niveau international. Dirigée par le président Igor Smirnov, la Transnistrie a maintenu ses propres institutions et forces de sécurité, favorisant ainsi l'émergence d'un État de facto. Cependant, les tensions avec la Moldavie persistent et les efforts de réconciliation sont entravés par les sanctions économiques, la contrebande et l'absence de consensus sur le statut de la région. Des négociations menées sous l'égide d'organisations internationales ont tenté de trouver une solution pacifique, mais la situation politique de la Transnistrie est restée complexe et non résolue, marquée par un équilibre fragile entre les aspirations à l'indépendance et les réalités géopolitiques."
 CUB_MILLENNIUM_DAWN_DESC: "Sur la belle île de Cuba, où le soleil réchauffe les palmiers et où la brise marine embrasse doucement les rivages, l'année 2000 a vu une atmosphère de changement. Au cœur des Caraïbes, dans cette oasis de chaleur et de beauté, vivait une histoire riche en traditions et en patrimoine culturel. Cependant, dans l'ombre de cette riche beauté, la lutte acharnée des forces politiques a continué ses mouvements d'agitation. La situation politique du pays était tendue, reflétant les luttes perpétuelles de pouvoir et les luttes idéologiques. Malgré cela, l'esprit du peuple cubain est resté indestructible, son cœur rempli d'espoir pour un avenir radieux et de foi en la justice."
 OTHER_MILLENNIUM_DAWN_DESC: "Première Guerre mondiale, Seconde Guerre mondiale, Corée, Viêt Nam, Afghanistan. Les guerres du passé ont laissé les nations du présent craindre pour l'avenir. Cependant, il y a un grand espoir que l'humanité ait dépassé des millénaires d'effusion de sang pour achever sa transition vers une période de paix et de stabilité."
 IRQ_MILLENNIUM_DAWN_DESC: "Iraq is no stranger to hardships, having recently just fought an 8 year war with the Iranians, Iraq gained nothing but debt and economic hardship. Being unable to pay back the debts owed to the Gulf states, Saddam Hussein launched an invasion of Kuwait in 1990. Enduring a humiliating defeat at the hands of the coalition forces shortly after the war began, Iraq is still struggling to recover and rebuild. With sanctions crippling the Iraqi economy, and an ever more authoritarian stance taken by Saddam Hussein and the Ba'athist regime, large portions of Iraqi society find themselves at odds with the current ruling order. Only time will tell if Iraq will fall into turmoil, or bring about the millennia long golden age."
 LBA_MILLENNIUM_DAWN_DESC: "Mouammar Kadhafi a dirigé la Libye pendant 31 ans, cherchant désespérément à réaliser ses idéaux et ses aspirations. La Libye est relativement stable à l'heure actuelle, les membres de la famille de Kadhafi tentant de s'attirer les bonnes grâces du dirigeant excentrique, mais les choses pourraient changer à tout moment.\n\nLa Libye peut-elle accéder à la puissance et à la prospérité au XXIe siècle, ou finira-t-elle par figurer sur l'innombrable liste des États en faillite ? Mouammar pourra-t-il conserver son pouvoir avant la nouvelle vague du nouveau millénaire ? Seul l'avenir nous le dira..."
 ROM_MILLENNIUM_DAWN_DESC: "À l’aube du nouveau millénaire, la Roumanie se trouve à la croisée des chemins. Après des décennies de régime communiste, la démocratie fragile qu’elle a instaurée a jusqu’à présent apporté plus de chaos que de stabilité.\n\nDe la Golaniada à la Sixième Mineriade, l’avenir semble fragile, car les gouvernements successifs échouent à consolider les institutions démocratiques et à résoudre les problèmes économiques. Alors que la pauvreté augmente, des démagogues comme Corneliu Vadim Tudor parviennent à gagner des partisans massifs parmi les masses désillusionnées, tandis que les partis démocratiques vacillent et tombent, incapables de proposer des solutions viables.\n\nEt avec le retour de l’ancien président Ion Iliescu à la politique, la population semble devoir choisir entre le moindre mal. Mais qui sait vraiment ce que l’avenir réserve à la Roumanie ?"
 CZE_MILLENNIUM_DAWN_DESC: "La République tchèque, pays situé au centre de l'Europe, entre dans le nouveau millénaire dans une situation peu reluisante. Le régime communiste est terminé depuis longtemps, mais la Tchécoslovaquie aussi. L'économie ne s'est pas encore complètement rétablie, mais le processus de privatisation est sur le point de se terminer et les réparations sont sur le point d'être achevées.\n\nLa sphère politique semble stable mais chaotique. Alors que les deux plus grands rivaux, le parti conservateur ODS et le parti social-démocrate ČSSD, dominent le parlement, d'autres partis cherchent encore de nouvelles coalitions. Alors que l'ODS maintient ses relations avec le KDU-ČSL et les Verts, le ČSSD approfondit sa coopération avec le dernier parti communiste, le KSČM.\n\nIndépendamment des actions politiques, des entreprises indépendantes tentent de conquérir le marché étranger. Les constructeurs automobiles Škoda et Tatra développent de nouvelles façons de moderniser les véhicules tchèques tandis que VOP CZ cherche de nouvelles voies pour améliorer le secteur militaire. Les entreprises travaillent de manière indépendante mais entretiennent des relations communes. Un petit tournant des événements pourrait éventuellement les unir en un seul grand monopole.\n\nMais il y a encore beaucoup à dire. Le général militaire Petr Pavel est sur le point d'améliorer considérablement sa carrière au sein de l'OTAN et en République tchèque. Grâce à son expérience et à sa formation, il devra diriger les pays pour se préparer à une menace imminente contre la souveraineté de la République tchèque. Mais va-t-il rester au sein de l'OTAN et poursuivre sa carrière avec les États-Unis comme alliés ? Ou peut-être que ce sont les États-Unis qui doivent avoir peur ?"
 TAJ_MILLENNIUM_DAWN_DESC: "Depuis qu'il a obtenu son indépendance de l'Union soviétique en 1991, le Tadjikistan est en proie à une instabilité et à des conflits constants. Le pays a rapidement sombré dans une guerre civile brutale, opposant le gouvernement à une coalition de groupes d'opposition, dont des forces islamistes et démocratiques. En 1997, une paix fragile a été négociée, mais les tensions sont restées vives alors que le gouvernement d'Emomali Rahmon consolidait le pouvoir, mettant à l'écart de nombreuses factions de l'opposition. La corruption, la pauvreté et les divisions apparaissent dans la société tadjike, le temps étant le seul témoin de ce qui va suivre..."
 HOL_MILLENNIUM_DAWN_DESC: "Autrefois cœur d'un empire maritime mondial, les Pays-Bas ont émergé au 21ème siècle comme une démocratie libérale stable et un pilier du commerce et de la diplomatie internationale. En tant que membre fondateur de l'Union Européenne et de l'OTAN, le pays défend de longue date le multilatéralisme et les droits humains. Mais derrière cette prospérité moderne, des tensions sociales croissantes, des débats sur l’identité nationale et l’héritage colonial viennent bouleverser le discours public. Face à l’instabilité géopolitique, aux mutations économiques et aux défis mondiaux qui s’annoncent, une question cruciale se pose aux Néerlandais: continueront-ils d’incarner une voix pragmatique et modérée, ou traceront-ils une nouvelle voie dans un monde incertain ?"
 BOL_MILLENNIUM_DAWN_DESC: "High in the lungs of the Andes, Bolivia rises: a nation forged from silver mines, revolutions, and forgotten empires. Though stripped of its coast and scarred by coups, its heart still beats with the thunder of ancient drums and the dreams of its people. The 20th century left behind scars: lost wars, broken treaties, and an uneasy dance with foreign capital. Yet as the new millennium dawns, something stirs beneath the surface: a growing fire of indigenous awakening, resource nationalism, and a demand to rewrite the social contract. With lithium under its soil and unrest in its streets, Bolivia may yet become more than just a pawn in great power games. It may become the storm."
 ISR_MILLENNIUM_DAWN_DESC: "À certains égards, Israël n'a jamais été dans une meilleure situation. La menace existentielle que représentaient autrefois ses voisins arabes s'est largement dissipée grâce à la normalisation des relations avec l'Égypte et la Jordanie. Des progrès considérables ont été accomplis vers la résolution de la question palestinienne grâce aux accords d'Oslo de 1993.\n\nMalgré cela, Israël reste inquiet. Le terrorisme et les États voyous justifient le maintien d'un dispositif sécuritaire renforcé, tandis que les questions relatives à l'avenir de l'État juif continuent de dominer la vie politique israélienne. La manière dont Israël répondra aux pressions croissantes et souvent contradictoires exercées par la communauté internationale, les Palestiniens et son propre peuple demeure incertaine."
 SYR_MILLENNIUM_DAWN_DESC: "A nation born out of colonial interests with a history mired with coups and instabilities, Syria has been struggling a lot ever since its inception. After the baathist takeover and since 1971 the country has seemingly united under the stable yet authoritarian rule of Hafez Al Assad. As the longest reigning president his tenure was known for overseeing a period of profound stability yet equally notorious political violence. Hafez al-Assad's health is currently failing, and soon a new successor will rise. However many people have started to question this state of affairs as well as the status quo, and many seek to change it. Will Syrians overcome their divides and differences and unite for a bright future? Or will the state crumble under the test of time by the divides of its people and failures of its institutions?"
 ALG_MILLENNIUM_DAWN_DESC: "Après une décennie de guerre civile brutale, l'Algérie se trouve en 2000 à un tournant décisif. Le président Abdelaziz Bouteflika, élu en 1999 avec le soutien de l'armée, a promis la réconciliation nationale, le redressement économique et le retour à la stabilité. Pourtant, les cicatrices de la Décennie noire restent profondes. Des insurgés islamistes persistent dans les montagnes, les tensions ethniques couvent en Kabylie et la confiance envers l'État est faible.\n\nLes vastes réserves de pétrole et de gaz du pays demeurent son principal pilier économique, mais le chômage est élevé, la corruption endémique et les promesses de réforme sonnent souvent creux. Les investisseurs étrangers convoitent le potentiel inexploité de l'Algérie, tandis que la population réclame justice sociale, développement et paix.\n\nL’Algérie peut-elle bâtir un État moderne et stable tout en préservant son indépendance et son identité ? Ou bien les tensions internes et les luttes de pouvoir continueront-elles de peser sur son avenir ?"
 GRN_MILLENNIUM_DAWN_DESC: "Le Groenland, la plus grande île du monde, demeure un territoire autonome au sein du Royaume du Danemark, ayant obtenu son autonomie en 1979. Sa petite population, dispersée le long d'une côte libre de glace, dépend fortement de l'industrie de la pêche et d'une subvention globale annuelle de Copenhague.\n\nSous la glace se cachent de vastes réserves inexploitées de minéraux et de pétrole, et le réchauffement climatique pourrait un jour les rendre accessibles. Face à la montée des revendications d'autonomie, le Groenland est confronté à une question cruciale : peut-il tracer la voie d'une véritable indépendance, ou le prix de cette autonomie le maintiendra-t-il sous la tutelle de la couronne danoise ?"
 NRY_MODERN_DAY_DESC: "Norway voted against joining the European Union in 1994 and has subsequently stayed distant from Europe to a certain extent. Nonetheless, the country remains a NATO member and shares a short but critical border with the Russian Federation, a powerful neighbor that it must necessarily be wary of."
 NRY_MILLENNIUM_DAWN_DESC: "La Norvège a voté contre son adhésion à l'Union européenne en 1995 et s'est depuis lors tenue à distance de l'Europe. Elle demeure néanmoins membre de l'OTAN et partage une frontière courte mais cruciale avec la Fédération de Russie, un voisin puissant dont elle doit nécessairement se méfier."
 SIA_MILLENNIUM_DAWN_DESC: "Trois ans après l'effondrement du baht qui a plongé les économies d'Asie du Sud-Est dans la tourmente, la Thaïlande se remet difficilement du plan de sauvetage du FMI grâce à la direction technocratique des Démocrates de Chuan Leekpai. L'austérité a stabilisé la monnaie, mais pas les campagnes, où le milliardaire des télécommunications Thaksin Shinawatra et son nouveau parti, Thai Rak Thai, mettent en place une machine politique à laquelle aucun dirigeant sortant n'a encore pu s'opposer.\n\nUne jeune démocratie prend ses marques sous la constitution réformatrice de 1997, et les institutions plus anciennes observent son évolution. Les choix de la prochaine décennie détermineront la pérennité de cette reprise et qui, le moment venu, représentera la Thaïlande."