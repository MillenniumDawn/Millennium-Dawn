 UKR_develop_donets_spaa: "Разработать §Y«Донец»§!"
 UKR_develop_donets_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_donets_spaa_for_tooltip\n\n\n\n\n\n\n\n\n«Донец» — зенитный ракетно-пушечный комплекс, разработанный заводом имени Малышева в Харькове главным образом на экспорт.\n«Донец» соединяет модернизированную башню советской ЗСУ-23-4 «Шилка» с шасси основного танка Т-80УД/Т-84.\nПо бокам башни установлены два спаренных транспортно-пусковых контейнера с ракетами комплекса «Стрела-10М». \nЭти ракеты с автономной пассивной головкой самонаведения поражают воздушные цели на дальности до 4500 м и высоте до 3500 м."
