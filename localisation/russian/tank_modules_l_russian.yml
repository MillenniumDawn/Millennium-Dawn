 tank_diesel_engine_gen8: "Сверхмощный X12"
 tank_diesel_engine_gen8_desc: "Гиперзарядка наших танковых двигателей X12 может вывести их возможности за пределы нашего воображения. Скорость и мощность!\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели — это стандартные двигатели, используемые на танках.§!"
 tank_diesel_engine_gen9: "Сверхзаряженный X12"
 tank_diesel_engine_gen9_desc: "Сверхнаддув наших танковых двигателей X12 позволяет вывести их возможности на совершенно новый уровень. Скорость и мощность!\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели — это стандартные двигатели, используемые на танках.§!"
