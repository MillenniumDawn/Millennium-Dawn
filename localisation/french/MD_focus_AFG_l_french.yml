 AFG_almond_investment1_collect_desc: "Farmers are ready for us to pick up a load of almonds."
 AFG_almond_investment1: "Invest in Almond Production"
 AFG_almond_investment1_desc: "Almonds have been a major source of income for many Afghans. The government can invest in the almond industry by providing infrastructure, transportation, and market access for farmers. This investment program is limited to 5 major initiatives, after which the market reaches saturation. Investment: 5% GDP, Returns: 6% GDP (20% profit margin)."
 AFG_pomegranate_investment1: "Invest in Pomegranate Production"
 AFG_pomegranate_investment1_desc: "Afghanistan's pomegranates are renowned worldwide for their quality. The government can invest in production facilities and trade networks to capitalize on this natural resource. This investment program is limited to 5 major initiatives, after which the market reaches saturation. Investment: 5% GDP, Returns: 6% GDP (20% profit margin)."
 AFG_invite_nahzat_e_melli_ye_into_government: "Invite Hezb-e-Nuhzhat-e-Mili Afghanistan Into Government"
 AFG_domestic_decisions: "Domestic Goals"
 AFG_domestic_decisions_desc: "With a recovering nation, we have established objectives to reconstruct the state and forge a new future."
 AFG_taloqan_siege_mission: "Holding the City"
 AFG_taloqan_siege_mission_desc: "Securing the city is crucial as our territory dwindles, and the vast plains of the northwest present an inviting target for a future offensive."
 AFG_headquarters_taloqan: "Headquarters of Taloqan"
 AFG_headquarters_taloqan_desc: "Taloqan emerged as a pivotal stronghold for Ahmad Shah Massoud during the Soviet invasion. Subsequently, it has become the central command center for  [AFG.GetFlag] [AFG.GetNameDefCap], serving as a crucial point for access into Tajikistan after the fall of Mazar-i-Sharif to Taliban forces in 1997."
 taliban_insurgency_category: "The Taliban Insurgency"
 taliban_insurgency_category_desc: "Although the £GFX_AFG_salafist_jihadism §YTaliban§! forces were defeated by the coalition forces, they were not completely eliminated, and Taliban militants were fragmented into pieces and launched an §Rinsurgency§! in all corners of Afghanistan and started carrying out various §Rterrorist attacks§! against the new government and coalition forces. The eradication of the Taliban insurgency is expected to take years, depending on many factors.\n\nThe §YTaliban Strength§! determines the strength of the Taliban militants inside the country, and its growth as well as our effectiveness of eradicating the insurgency will be dependent on the §Ytrust of the central government (stability, corruption or foreign interference)§! and the §Ysituation on the Afghan-Pakistan border§!. If §YTaliban Strength§! is too high, the £GFX_AFG_salafist_jihadism §YTaliban§! will be able to carry out §Rterrorist attacks§!, and can even escalate it to a §Rrenewed civil war§! while some methods might be effective at tackling the Taliban threat at short term.\n\n§YTaliban Strength§!: [?AFG.taliban_strength]%"
 AFG_pashtunistan_decisions: "Unifying Pashtunistan"
 AFG_pashtunistan_decisions_desc: "Almost 16% of Pakistan's population identifies as Pashtuni, the most dominant ethnic group of Afghanistan. Most of the Pakistani Pashtunis live in the North Western parts of the country. Due to the civil war in Pakistan, many of these people now suffer under a terrifying regime. It is our duty to protect them."
 AFG_russian_airlift_is_active: "Has Russian Airlift"
 AFG_donkey_logistics_tech: "Pack Animal Logistics"
 AFG_donkey_logistics_tech_desc: "Mule and donkey trains move supply through passes no truck can reach."
 AFG_donkey_logistics_tech2: "Pack Animal Logistics II"
 AFG_donkey_logistics_tech2_desc: "Larger caravans and established staging points along the northern routes."
 AFG_donkey_logistics_tech3: "Pack Animal Logistics III"
 AFG_donkey_logistics_tech3_desc: "A standing transport corps built around the pack trains that never stopped running."
 AFG_legacy_of_the_mujahideen: "Legacy of the Mujahideen"
 AFG_legacy_of_the_mujahideen_desc: "Veterans of the Soviet war pass their fieldcraft down to the militia."
 AFG_tech_the_farmer_and_their_rifle: "The Farmer and their Rifle"
 AFG_tech_the_farmer_and_their_rifle_desc: "Rural levies who fight for their own valleys and know every approach to them."
 AFG_tech_training_of_local_police_officers: "Training of Local Police Officers"
 AFG_tech_training_of_local_police_officers_desc: "Militia trained to police as well as fight, and to hold ground once it is taken."
 AFG_tech_return_of_dostum: "Return of Dostum"
 AFG_tech_return_of_dostum_desc: "Dostum is back in the north, and the Uzbek militias fight like it."
 AFG_the_lion_of_panjshir: "The Lion of Panjshir"
 AFG_the_lion_of_panjshir_desc: "Massoud's doctrine of holding the high ground and striking from it."