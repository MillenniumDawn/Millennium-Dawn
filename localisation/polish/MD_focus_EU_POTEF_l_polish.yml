l_polish:
 POTEF001: "Prezydent Federacji Europejskiej"
 POTEF001_desc: "§YPrezydent Federacji Europejskiej (POTEF)§! jest najważniejszym przywódcą Europy. Dlatego też Prezydent Federacji Europejskiej ma władzę podejmowania decydujących decyzji strategicznych dla całej Federacji."
 POTEF100: "Doktryna alpejska"
 POTEF100_desc: "The Alpine nations of §Y[AUS.GetNameWithFlag]§! and §Y[SWI.GetNameWithFlag]§! have a long tradition of mountain warfare. With the Alpine Doctrine all member states can adopt this tradition and tactics."
 POTEF101: "Integralność stworzenia"
 POTEF101_desc: "Aby ocalić i zachować integralność stworzenia, Federacja Europejska dostosowuje swoją politykę."
 POTEF102: "Imperializm środowiskowy"
 POTEF102_desc: "Europa jest zielona, ​​ale świat wciąż jest ciemny i szary. Europa musi rozpowszechnić swoją politykę i technologie na całym świecie oraz walczyć z imperiami energii kopalnej, które niszczą planetę."
 POTEF103: "Ameryka północna"
 POTEF103_desc: "Europa jest zielona, ​​ale Ameryka Północna jest wciąż ciemna i szara. Europa musi rozpowszechnić swoją politykę i technologie na całym świecie oraz walczyć z imperiami energii kopalnej, które niszczą planetę."
 POTEF104: "Ameryka Południowa"
 POTEF104_desc: "Europa jest zielona, ​​ale Ameryka Południowa jest wciąż ciemna i szara. Europa musi rozpowszechnić swoją politykę i technologie na całym świecie oraz walczyć z imperiami energii kopalnej, które niszczą planetę."
 POTEF105: "Europa"
 POTEF105_desc: "Europa jest zielona, ​​ale inne kraje europejskie są nadal ciemne i szare. Europa musi rozpowszechnić swoją politykę i technologie na całym świecie oraz walczyć z imperiami energii kopalnej, które niszczą planetę."
