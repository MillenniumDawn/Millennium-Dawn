 TIE_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
 BUL_infantry_weapons_1_desc: "The AKK a Bulgarian version of the AK-47 and is the milled steel predecessor to the modernized AKM rifle, both developed by Mikhail Kalashnikov and license produced in Bulgaria."
 BUL_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 GEO_infantry_weapons_3_desc: "In 1991 the Izhmash factory in the city of Izhevsk began full-scale production of a modernized variant of the AK-74, the AK-74M. Fitted with a lightened bolt and carrier assembly as well as a glass-filled polyamide stock."
 GEO_infantry_weapons_5_desc: "M4 카빈 소총은 M16 돌격소총의 단축형 및 경량형 변형 모델입니다. M4는 5.56x45mm NATO 탄을 사용하는 공랭식, 직접 가스 작동식, 탄창식 카빈 소총입니다. 14.5인치(370mm) 길이의 총열과 접이식 개머리판을 갖추고 있습니다."
 GRE_infantry_weapons_5_desc: "M4 카빈 소총은 M16 돌격소총의 단축형 및 경량형 변형 모델입니다. M4는 5.56x45mm NATO 탄을 사용하는 공랭식, 직접 가스 작동식, 탄창식 카빈 소총입니다. 14.5인치(370mm) 길이의 총열과 접이식 개머리판을 갖추고 있습니다."
 ISR_infantry_weapons_3_desc: "M16A2 소총의 개발은 원래 미 해병대가 베트남 전쟁에서 XM16E1과 M16A1 소총을 사용해 얻은 전투 경험을 바탕으로 요청한 것이었습니다. 이 소총은 1982년 국방부에서 \"미군 5.56mm 소총 M16A2\"로 공식 채택되었습니다. 미 해병대는 1980년대 초중반에 이 소총을 미군 최초로 도입했으며, 미 육군은 1980년대 후반에 뒤이어 도입했습니다."
 KOR_infantry_weapons_1_desc: "M14 소총(공식 명칭: 미국 7.62mm 구경 M14 소총)은 7.62x51mm NATO(.308인치) 탄약을 사용하는 미국제 선택 사격 소총입니다. 1959년에 미군 표준 제식 소총으로 채택되었으며, 1961년에는 미 육군에서 M1 개런드 소총을 대체했습니다."
 KOR_infantry_weapons_2_desc: "M16 소총(공식 명칭: 5.56mm 구경 M16 소총)은 미군을 위해 ArmaLite AR-15 소총을 개량한 군용 소총 계열입니다. 초기 M16 소총은 20발들이 탄창을 사용하는 5.56mm 자동 소총이었습니다."
 NKO_infantry_weapons_6_desc: "AK-12는 러시아의 신형 돌격소총입니다. 라트니크 미래 보병 훈련 프로그램의 일환으로 개발되었으며, 특수부대용으로 제작되어 AK-103의 생산을 대체할 예정입니다. AK-12는 균형감각과 인체공학적 설계가 개선되어 현재까지 러시아에서 가장 정예화된 돌격소총으로 평가받고 있습니다."
 BLR_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 BLR_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 BLR_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
 BLR_infantry_weapons_4_desc: "In 1991 the Izhmash factory in the city of Izhevsk began full-scale production of a modernized variant of the AK-74, the AK-74M. Fitted with a lightened bolt and carrier assembly as well as a glass-filled polyamide stock."
 BLR_infantry_weapons_5_desc: "AK-103 돌격소총은 7.62x39mm M43 탄약을 사용하는 AK-74M의 파생형입니다. 구형 AKM과 마찬가지로 AK-103은 야간 투시경과 망원 조준경을 포함한 다양한 조준기를 사용할 수 있으며, 총검이나 유탄 발사기도 장착할 수 있습니다. 대부분의 AK 소총과의 차이점은 AK-103이 플라스틱 및 저렴한 재료를 사용한다는 점입니다."
 MLV_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 MLV_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 MLV_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
