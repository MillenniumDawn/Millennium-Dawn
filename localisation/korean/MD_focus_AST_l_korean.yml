 rudd_tax_reform_ast: "§2러드 세제 개혁§!"
 the_care_act_idea_ast: "모두를 위한 돌봄"
 reduced_interstate_regulation_ast: "§2주 간 규제 완화§!"
 paid_parental_scheme_ast: "유급 육아휴직 제도"
 paid_parental_scheme_ast_2: "육아 수당 제도"
 paid_parental_scheme_ast_desc: "새 부모에게 최대 26주의 유급 휴가를 보장합니다. 직장에서 휴가를 내어 신생아나 입양 자녀를 더 잘 돌볼 수 있게 하고, 인구 증가를 장려합니다."
 paid_parental_scheme_ast_2_desc: "우리의 육아 지원 제도를 통합하여 기존의 출산 장려금을 새 부모를 돕는 금전 지급으로 대체합니다. 새 부모에게 최대 26주의 유급 휴가도 보장하며, 신생아나 입양 자녀를 더 잘 돌볼 수 있도록 일회성 지급금을 제공하고 인구 증가를 장려합니다."
 social_capitalism_ast: "사회적 자본주의"
 social_capitalism_ast_desc: "경제 운영에 더 적극적으로 개입하는 방식은 약간의 이점과 사소한 단점을 가져왔습니다. 규제와 직접 관리를 활용하여 경제에 더 직접적으로 영향을 미치고, 경제가 시민의 이익에 부합하도록 보장할 수 있습니다. 이 방식을 도입해 나가면서 우리의 방법도 점점 정교해질 것입니다. \n§W--------------§!\n케빈 러드가 총리가 아니게 되면 이 국가 정신은 §R제거§!됩니다."
 building_the_education_revolution_ast: "§G교육 혁명 건설§!"
 a_new_era_ast: "새로운 시대"
 a_new_era_ast_desc: "우리나라는 평등의 새 시대에 접어들었습니다. 많은 이들의 끊임없는 노력으로 모든 오스트레일리아인의 미래가 이제 더욱 밝아졌습니다..."
 ast_a_national_agreement_tt: "원주민 공동체를 지원하는 프로그램이 정치 §2결정§! 탭에서 잠금 해제됩니다."
 ast_closing_the_gap_tt: "이 프로그램들의 §G성과§!가 나타나기까지는 시간이 걸릴 것입니다..."
 nrf_ast: "국가 화해 재단"
 nrf_ast_desc: "우리의 임기가 끝난 뒤에도 적극적인 화해를 위한 틀이 유지되도록 하려면, 변화를 이끌어 낼 프로젝트에 자금을 지원하는 전담 조직을 만들어야 합니다."
 sihip_ast: "전략적 원주민 주택 및 인프라 프로그램(SIHIP)"
 sihip_ast_desc: "노던 준주의 애버리지니 주민들은 최근 몇 년간 가장 힘든 시기를 보냈다고 해도 과언이 아닙니다. 주택을 비롯한 많은 것이 황폐해졌으며 보수가 절실합니다."
 family_reunion_services_ast: "가족 재결합 서비스"
 family_reunion_services_ast_desc: "도둑맞은 세대 시기에 가족과 강제로 분리된 애버리지니와 토레스 해협 도서민을 위해 가족 추적, 재결합, 상담 서비스를 제공하는 프로그램을 개발하기 시작할 수 있습니다."
 rural_job_initiative_ast: "농촌 일자리 구상"
