 NKO_sister_idea: "Kim Yo-Jong"
 NKO_milestone_win:0 "Vitória Marcante"
 arduous_march_modifiers_desc: "A Árduous March teve um preço alto para nossa nação. Para garantir o futuro do nosso povo, precisamos implementar medidas estratégicas para superar esse período de dificuldades e levar nosso país à prosperidade. Isso inclui aumentar a produção agrícola, garantir ajuda humanitária e reformar nossas políticas internas para garantir estabilidade e crescimento."
 unsc_sanctions_modifiers:0 "Sanções do CSNU"
 NKO_jangmadang_idea:0 "Jangmadang (mercado negro norte-coreano)"
