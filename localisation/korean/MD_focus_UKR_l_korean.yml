 ukraine_develop_btr4.8.name: "'BTR-4' APC 시험 계획"
 ukraine_develop_btr4.8.desc: "BTR-4 APC의 양산 전 시험 기간과 복잡도를 선택할 수 있습니다.\n\n기본 계획을 택하면 비용과 시간을 아낄 수 있습니다. 확장 계획은 더 많은 자원이 필요하지만, 소규모 시험 생산에서 드러나는 일부 문제를 찾아 해결할 수 있습니다. 이러한 문제를 제거하면 본격적인 양산 단계에서 더 신뢰성 높은 차량을 얻을 수 있습니다."
