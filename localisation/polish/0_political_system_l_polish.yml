 FULL_POLITICS_VIEW_BUTTON_TT: "Rozwiń widok grupy"
 si_title_text: "Partie i ruchy"
 si_title_text_tt: "§Y Obecne prawa polityczne: §!\nOdbywają się wybory: [has_elections_check]\nPróg wyborczy: [?election_threshold|%0][term_limit_text]"
 western_desc: "Rządy państw zachodnich i prozachodnich dążą do utrzymania liberalnego porządku światowego opartego na dominacji USA, który panuje niepodzielnie od czasu upadku Związku Radzieckiego. Za pośrednictwem instytucji takich jak Bank Światowy czy MFW promują one liberalizację gospodarczą i prywatyzację. Choć zdecydowana większość państw o ​​orientacji zachodniej to różnego rodzaju demokracje, w gronie tym znajdują się również prozachodnie reżimy autorytarne, czerpiące korzyści z istniejącego stanu rzeczy."
 emerging_desc: "Państwa o orientacji wschodzącej – zwłaszcza te z Globalnego Południa oraz obszaru postsowieckiego – dążą do zastąpienia dominującego liberalnego ładu światowego własnymi, alternatywnymi instytucjami oraz wielobiegunowym modelem polityki globalnej. Często prezentują one odmienne podejście do kwestii globalizacji, ustroju politycznego oraz polityki wewnętrznej."
 salafist_desc: "Salafizm to ultrakonserwatywny, nietolerancyjny i fundamentalistyczny odłam głównego nurtu sunnickiego islamu. Zyskał on na znaczeniu, odkąd od połowy XX wieku wahabickie monarchie znad Zatoki Perskiej przeznaczały miliardy na finansowanie jego nauk. Salafizm przybrał szczególnie brutalne formy w działalności talibów, Al-Kaidy oraz ISIS."
 non_aligned_desc: "Rządy państw niezaangażowanych znacznie różnią się między sobą pod względem ustroju i wyznawanych ideologii, a do kwestii sojuszy zagranicznych podchodzą zazwyczaj w sposób wysoce pragmatyczny. Wiele z nich dąży po prostu do wzmocnienia własnej niepodległości lub realizacji innych celów regionalnych. Inne z kolei znajdują się w rozkroku między wielkimi mocarstwami, które w walce o wpływy próbują przeciągnąć je na swoją stronę."
 communist_state_pop_election: "Uzyskano [?party_pop_elect_array^4|%1] w ostatnich wyborach"
 generic.communist_state: "£generic_Communist_State_small Komuniści"
 generic.communist_state_desc: "W szerokim ujęciu komunizm to ideologia postulująca zniesienie systemu kapitalistycznego w celu stworzenia wspólnotowego raju dla robotników. W rzeczywistości państwa komunistyczne utrzymują kapitalistyczne systemy gospodarcze i często mają niedemokratyczny charakter."
 generic.communist_state_icon: "£generic_Communist_State_small"