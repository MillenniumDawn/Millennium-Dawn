 the_ulema_desc: "이슬람 성직자들은 종교가 널리 신봉되는 국가의 지도부 내에서 흔히 상당한 지지를 얻습니다. 그들은 자신의 영향력을 이용해 종교 교리에 걸맞은 방식으로 정부 정책을 빚어낼 것입니다."
