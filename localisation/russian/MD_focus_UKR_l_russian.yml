 ukr_modernize_sov_equipment_t55_reactivation_program: "Вернуть в строй хранящийся парк §YТ-54/Т-55§!"
 ukr_modernize_sov_equipment_t55_reactivation_program_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t55_museum_for_tooltip\n\n\n\n\n\n\n\n\n§WСотни танков §YТ-54§! и §YТ-55§!, унаследованных от §Rсоветской§! армии, §Rржавеют§! на наших базах хранения.\n§YХКБМ§! и §YХарьковский бронетанковый завод§! могут обследовать корпуса и предложить способ §Gвернуть их§! в строй.\n------------------\nЭто решение §Rнеобходимо§! для наших программ модернизации, закупки и экспорта §YТ-54/Т-55§!, и оно доступно только до §Y2005§! года. Если мы его §Rпропустим§!, эти корпуса §Rостанутся на хранении§!. Мы всё равно сможем отдельно разработать §YТ-62-5ТДФ§! для §Y[EGY.GetNameWithFlag]§!, но дороже и дольше.§!\n\n$UKR_rada_modernization_adoption_tt$"
 ukr_modernize_sov_equipment_t55_modernization_stop_tt: "\n§RНовые модернизации §YТ-55§! заказать нельзя.§! Уже разработанные модели §Gостаются доступными§! для закупки.\n "
