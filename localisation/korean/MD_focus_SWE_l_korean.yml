 Sweden_foci.5002.d1: "미국이 MH-60L 블랙호크 헬리콥터를 조달하겠다는 스웨덴의 요청을 승인했습니다. 이 결정은 양국 간 방위 협력의 중요한 진전입니다."
 Sweden_foci.5002.d2: "러시아가 Mi-26 헬리콥터를 구매하겠다는 스웨덴의 제안을 수락했으며, 이는 군사 협력의 새로운 길을 열고 스웨덴의 중량물 수송 능력을 향상시킵니다."
 Sweden_foci.5002.d3: "프랑스가 스웨덴에 AS532 쿠거 헬리콥터를 공급하기로 합의했으며, 이는 방위 관계를 강화하고 스웨덴에 다목적 수송 수단을 제공합니다."
