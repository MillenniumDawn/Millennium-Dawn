l_german:
 DONALD_TRUMP_LEADER_DESC: "Donald John Trump (geboren am 14. Juni 1946) ist der milliardenschwere Sohn des Immobilienentwicklers Frederick Christ Trump. Mit einem kleinen Darlehen von einer Million Dollar gründete und erweiterte Trump seit 1971 zahlreiche Unternehmen unter der Trump Organisation. Bekannt für seine heftigen Tiraden und seinen impulsiven Führungsstil, den er aus seiner Zeit als Fernsehpersönlichkeit übernommen hat, hat sich Trump schnell ebenso viele Feinde wie Freunde gemacht. Bei seinem Amtsantritt gelobte Trump, die illegale Einwanderung einzudämmen, die Militärausgaben zu erhöhen, protektionistische Zölle einzuführen und Amerika an die erste Stelle zu setzen."
 MITT_ROMNEY_LEADER_DESC: "Willard Mitt Romney (born March 12, 1947) is one of four children born to automobile executive George W. Romney. A devout Mormon and firm believer in laissez-faire economics and conservative family values; Romney vows to use his years of business experience to cut government waste, increase military spending, and remove restrictions put on Wall Street and large corporations."
 GEORGE_BUSH_LEADER_DESC: "George Walker Bush (geboren am 6. Juli 1946) ist das erste Kind von George Herbert Walker Bush, der von 1989 bis 1993 als 41. amerikanischer Präsident amtierte. Nach einer kurzen Tätigkeit in der Ölindustrie wechselte Bush in die Politik und wurde schließlich Gouverneur von Texas. Bush, der sich selbst als gefühlvollen Konservativen darstellt, verspricht, die Steuern zu senken, die Militärausgaben zu erhöhen und den Unternehmenssektor von unnötigen Beschränkungen für Treibhausgasemissionen zu befreien."
 MARCO_RUBIO_LEADER_DESC: ""
 BERNIE_SANDERS_LEADER_DESC: "Bernard Sanders (geboren am 8. September 1941) ist der Sohn polnischer Einwanderer aus der Arbeiterklasse in den Vereinigten Staaten. Während seiner Studienzeit trat er der Young People’s Socialist League bei und setzte sich im Rahmen der Bürgerrechtsbewegung für die Gleichbehandlung von Weißen und Schwarzen ein. Später wurde Sanders Bürgermeister von Burlington, Vermont, und schließlich ins US-Repräsentantenhaus und in den US-Senat gewählt. Als selbsternannter demokratischer Sozialist und Progressiver verspricht Bernie Sanders, die Militärausgaben zu senken, die Macht der Gewerkschaften zu stärken und ein allgemeines Gesundheitssystem einzuführen."
 HILLARY_CLINTON_LEADER_DESC: ""
 BARACK_OBAMA_LEADER_DESC: ""
 BILL_CLINTON_LEADER_DESC: ""
 GARY_JOHNSON_LEADER_DESC: ""
 RAND_PAUL_LEADER_DESC: ""
 DAVID_DUKE_LEADER_DESC: ""
 ANN_COULTER_LEADER_DESC: ""
 COUNCIL_FOR_NATIONAL_PRESERVATION_DESC: "The Council is a rump remnant of what was the federal government of the former United States. As such whatever is left is attempting to rally what people and territory it has left around a new flag. Members of the council look to create a sense of law and order as well as a sense of peace, this way they can then conduct a smooth transition of power to a new administration."
 MATHEW_CROUDER_DESC: "The \"Marshal\", or simply Mat/Mathew, is a bit of a paradox. Both talkative yet overtly quiet this young man has a sort of scatter brain approach to handling things or doing things that interest him. Despite his initial unlikeliness to become any kind of leader, his own soft power in terms of making acquaintances as well as his more gentle personality makes him a fairly relatable person. Though he has been known to be a bit of a hot head at times in more confrontational matters, he strives to do what he can for as many as he can. As he was once quoted by an interviewer, \"Life is a strange and confusing mess, you never truly know where you will end up even if you wanted to do something you may certainly find yourself doing the complete opposite. I mean from JROTC in high school, to the odd hobby of writing a constitution and exploring the idea of a micro-nation, I never once would have even dreamed of being a political leader... Let alone one on a federal level.\" This somewhat naivety yet sort of boundless optimism has seen Mathew now put in charge of the Southern Republic of America, though what he'll do not many know, for now we just wait and see."
 JIANG_ZEMIN_LEADER_DESC: "Jiang Zemin (born August 17, 1926) is a former engineer who has led the Communist Party since 1989, replacing the reformist Zhao Ziyang in the wake of the Tiananmen Square protests. Previously he served as mayor of Shanghai and his continued favoring of individuals who served with him in Shanghai has led to his faction of the party being dubbed the \"Shanghai Clique\". An advocate of economic reform, his rule in the 1990s has seen a continuation of Deng Xiaoping's policy of reform and opening up and a normalizing of the private sector. He has also presided over the return of both Hong Kong and Macau to Chinese sovereignty and has faced criticism over his heavy-handed approach to human rights."
 HU_JINTAO_LEADER_DESC: "Hu Jintao (geboren am 21. Dezember 1942) ist ein ehemaliger Ingenieur, der die Denunziation seines Vaters während der Kulturrevolution miterlebte. Als Staatsoberhaupt hat er den Wunsch geäußert, sich mit den Auswirkungen des schnellen Wirtschaftswachstums auf die Gesellschaft und die Umwelt Chinas zu befassen, und leitet die Tuanpai-Fraktion oder die Kommunistische Jugendliga der Kommunistischen Partei. Gemeinsam mit Premierminister Wen Jiabao strebt Hu eine gleichmäßigere Verteilung der Gewinne aus der wirtschaftlichen Entwicklung Chinas und eine weniger elitäre Regierungsführung an, wobei er fest an der Vorrangstellung der Kommunistischen Partei festhält."
 XI_JINPING_LEADER_DESC: "Xi Jinping (geboren am 15. Juni 1953) gehört zu einer neuen Generation chinesischer Beamter, die als „Prinzen“ bekannt sind. Als Sohn eines Veteranen der Kommunistischen Partei hat Xi die Zentralisierung und die Konsolidierung der Macht unter seiner Führung betont und politische Rivalen und bestehende Fraktionen der Kommunistischen Partei durch seine Antikorruptionskampagnen geschwächt. Er ist auch ein Befürworter einer selbstbewussten Außenpolitik, was eine Abkehr von Deng Xiaopings Politik der Zurückhaltung in internationalen Angelegenheiten darstellt."
 BO_XILAI_LEADER_DESC: "Bo Xilai (born July 3, 1949) is a well-known princeling and son of former Vice Premier Bo Yibo. Known for his tenure as Party Secretary of Chongqing, Bo is associated with his campaign against organized crime and his revival of \"red culture\" which has won him support among leftists dissatisfied with the inegalitarian trajectory of China's economic growth. Bo has earned many enemies during his political career, and has a controversial reputation."
 KIM_DAE_JUNG_LEADER_DESC: "Kim Dae-jung (geboren am 6. Januar 1924) ist aufgrund seines langjährigen Engagements für die Demokratie eine angesehene Persönlichkeit in der südkoreanischen Politik. Einige bezeichnen ihn als „Nelson Mandela Asiens“. Nachdem er ein mutmaßliches Attentat, eine Entführung durch Geheimdienstmitarbeiter sowie ein Todesurteil überlebt hat, ist Kim nach fast 50 Jahren in der Opposition endlich an die Spitze seines Landes gelangt. Zu seinen Prioritäten seit seinem Amtsantritt im Jahr 1998 gehören die wirtschaftliche Erholung, die Rechenschaftspflicht der mächtigen koreanischen Großunternehmen und die Zusammenarbeit mit Nordkorea im Rahmen seiner typischen „Sonnenscheinpolitik“."
 ROH_MOO_HYUN_LEADER_DESC: "Roh Moo-hyun (geboren am 6. August 1946) ist ein ehemaliger Menschenrechtsanwalt aus armen Verhältnissen, der Studentenproteste gegen das autoritäre Regime verteidigte. Ähnlich wie Kim Dae-jung, der seine Präsidentschaft unterstützt hat, befürwortet Roh Verhandlungen mit dem Norden statt einer Politik der internationalen Isolation. Er hat sich auch offen kritisch gegenüber den Vereinigten Staaten und Japan geäußert und unterhält ein angespanntes Verhältnis zum konservativen Establishment Koreas. Roh wird von der linksgerichteten „Generation 386“ unterstützt, die in ihren Dreißigern ist, in den Achtzigern studiert hat und in den Sechzigern geboren wurde."
 LEE_MYUNG_BAK_LEADER_DESC: "Lee Myung-bak (geboren am 19. Dezember 1941) ist ein konservativer Politiker und ehemaliger CEO von Hyundai. Während seiner Zeit bei Hyundai erhielt er den Spitznamen „Raging Bulldozer“, was zum Teil auf seinen strengen Führungsstil zurückzuführen ist. Lee ist ehrgeizig und hofft, Korea zu einer der größten Volkswirtschaften der Welt zu machen und eine internationalistische Außenpolitik zu fördern, die den globalen Status Koreas verbessern wird. Im Gegensatz zu seinen linksgerichteten Amtskollegen befürwortet Lee eine harte Linie gegenüber Nordkorea und eine enge Partnerschaft mit den Vereinigten Staaten."
 PARK_GEUN_HYE_LEADER_DESC: "Park Geun-hye (geboren am 2. Februar 1952) ist vor allem als Tochter von Park Chung-hee bekannt, dem ehemaligen autoritären Anführer Koreas, dessen Erbe bis heute umstritten ist. Während einige Park Chung-hee als brutalen Diktator betrachten, der Folter und Inhaftierung einsetzte, um seine Herrschaft zu erhalten, loben ihn andere für seine wirtschaftlichen Leistungen. In ihrer Jugend überlebte Park die Ermordung ihrer Mutter und ihres Vaters, wobei erstere durch die Hand eines nordkoreanischen Agenten und letzterer durch die Hand des Leiters des koreanischen Geheimdienstes starb. Park ist für ihre konservative, marktorientierte Haltung bekannt und befürwortet Deregulierung, Steuersenkungen sowie Recht und Ordnung."
 MOON_JAE_IN_LEADER_DESC: "Moon Jae-in (born January 24, 1953) is the son of North Korean refugees and a former human rights lawyer and activist. During his military service, Moon served as a special forces commando and took part in Operation Paul Bunyan, the ROK-USA joint response to the 1976 Panmunjom axe murder incident. A close friend of his predecessor Roh Moo-hyun, whom he had previously started a legal practice with, Moon was active in Roh's left-wing administration and was an important player in the Sunshine Policy, which he remains committed to. While committed to the US alliance, Moon has stated that Korea should learn how to say no to the Americans and hopes to take back wartime control of the Korean military from the US."
 KIM_JONG_UN_LEADER_DESC: "Kim Jong-un (born January 8, 1984) was the son most valued by Kim Jong-il during his lifetime. During his days studying in Switzerland, his slightly obese frame made it possible to underestimate him. But when he did ascend to the throne, he shocked the world with his calmness, shrewdness and ruthlessness in the secret executions of his political enemies (including, according to unconfirmed reports, the execution of his paternal uncle with anti-aircraft guns), his determination to continue developing nuclear weapons despite international sanctions, and his precise timing of the friendly dialogue with the US and South Korea. Under his leadership as a \"great man from heaven\", perhaps there is a real possibility of North Korea becoming the \"Strong and Prosperous Nation\"?"
 KIM_JONG_NAM_LEADER_DESC: "Kim Jong-nam (geboren am 10. Mai 1971) ist der Sohn von Kim Jong-il und dessen zweiter Frau. Als ältester Sohn seiner Familie erlebte Kim Jong-nam das Elend der Menschen während der Hungersnot in Nordkorea. Während seiner Zeit im Ausland sah er die rasante Entwicklung der Reformen und der Öffnung Chinas und war von der Kraft des Wandels beeindruckt. Er glaubte, dass nur Reformen dem nordkoreanischen Volk materiellen Wohlstand und geistiges Glück bringen könnten, aber er verstand auch, dass der Wandel ihn seine Macht kosten könnte. Aber er bereute es nie."
 KIM_YO_JONG_LEADER_DESC: "Kim Yo-jong (geboren am 26. September 1987) hat als einziges Mädchen in ihrer Familie seit Beginn ihrer politischen Karriere ein derartiges Talent an den Tag gelegt, dass Kim Jong-il bei der Wahl seines Nachfolgers ausrief: „Wenn Kim Yo-jong doch nur ein Junge wäre“. Vielleicht aufgrund ihres weiblichen Images genießt sie (seltsamerweise) sowohl im Inland als auch im Ausland ein hohes Maß an Unterstützung. Heute beweist ihre Herrschaft, dass Frauen genauso gut sein können wie Männer, unabhängig von der Politik des jeweiligen Landes."
 POLITICS_PAUL_KAGAME_DESC: "Als Paul Kagame 28 Jahre alt war, half er, die Regierung Ugandas zu stürzen. Mit 36 Jahren stürzte er die völkermörderische, von den Hutu geführte Regierung Ruandas. Mit 39 Jahren stürzte er Mobutu in der Demokratischen Republik Kongo, Afrikas korruptesten und repressivsten Diktator. Kagame ist wahrscheinlich der erfolgreichste Militärführer der Gegenwart, der mehr Kriege gewonnen hat als jeder andere – und das alles mit einem minimalen Budget. Während er jegliche Opposition im eigenen Land unterdrückt, hat der Tutsi-General ständig weitere ausländische Ambitionen im Blick, jagt Hutu-Rebellen und beutet die Bodenschätze aus."
 costas_simitis_desc: "Costas Simitis (geboren am 23. Juni 1936) ist der Sohn von George Simitis, Rechtsanwalt und Professor an der Wirtschaftsuniversität Athen. Während der griechischen Militärdiktatur beteiligte er sich an regierungskritischen Organisationen. Kurz nach dem Sturz der Militärjunta war Costas Simitis 1974 Gründungsmitglied der Panhellenischen Sozialistischen Bewegung (PASOK). Nach dem Wahlsieg der PASOK 1981 wurde er während der Regierungszeit von Andreas Papandreou in zahlreiche Regierungspositionen berufen, darunter als Leiter der Ministerien für Wirtschaft, Landwirtschaft, Bildung und Religion sowie als gleichzeitiger Leiter der Ministerien für Industrie, Forschung, Energie, Technologie und Handel. Nach dem Tod von Andreas Papandreou im Jahr 1996 wurde er zum Vorsitzenden der PASOK gewählt und gewann kurz darauf die Parlamentswahlen 1996. Nun strebt Costas Simitis eine stetige Zunahme der Privatisierungen im öffentlichen Sektor, wirtschaftliche Stabilität, eine Senkung der Staatsverschuldung, die Lösung griechisch-türkischer Streitigkeiten und vor allem eine Stärkung der Beziehungen und der Zusammenarbeit mit der Europäischen Union an."
 nikolaos_michaloliakos_desc: "Nikolaos Michaloliakos (born December 11th, 1957) is the founder of Golden Dawn, the largest nationalist party of Greece. Michaloliakos was a supporter of the Greek Military regime and known for participating in many extremist right wing groups which had committed attacks on many anti dictatorship figures as well as a relation with the head of the Greek Junta Georgios Papadopoulos. In 1980, he formed the Golden Dawn far right party which aims to have an anti-leftist agenda, anti immigration, glorifying Greek authoritarian regimes such as the 1967 Junta and the 4th of August 1936 regime and aligning to Russia and China and moving away from the west. Michaloliakos and his Golden Dawn party have been condemned as a criminal organization which targets minorities and has pro-neo-nazi and fascist views as well as an anti-democratic stance. In spite of the backlash against him Nikolaos Michaloliakos and his party have been rising in popularity as economic instability and social divides have been plunging Greece it has drawn more supporters to the Golden Dawn cause. If the situation becomes worse Nikolaos Michaloliakos may achieve his goals, taking power and building a new Greek state"
 CONGRESSIONAL_CHAMBERS_DESC: "With the electoral college failing and the election having...unexpected issues in the state of Florida, congress scrambles to try and figure out who to vote for or at the very least get into the president's seat before things boil over any more than they already have."
 YOON_SUK_YEOL_LEADER_DESC: "Yoon Suk Yeol (geboren am 18. Dezember 1960) war der ehemalige Generalstaatsanwalt der Republik Korea und Chefankläger der Staatsanwaltschaft des zentralen Bezirks Seoul. Während seiner Präsidentschaft verhängte Yoon Suk Yeol das Kriegsrecht und beschuldigte die Opposition, die Nationalversammlung zu kontrollieren, mit Nordkorea zu sympathisieren und die Regierung durch staatsfeindliche Aktivitäten zu lähmen. Doch dann stimmte die Nationalversammlung für die Aufhebung des Kriegsrechts. Seitdem wurde Yoon Suk Yeol wegen Volksverhetzung angeklagt und mit einem Ausreiseverbot belegt, womit er der erste amtierende Präsident in der Geschichte Südkoreas ist, dem die Ausreise untersagt wurde. Später wurde Yoon Suk Yeol verhaftet und war damit der erste amtierende Präsident in der Geschichte Südkoreas, der verhaftet wurde."