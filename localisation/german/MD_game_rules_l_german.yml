 RULE_OPTION_REFORMED_REPUBLIC: "Reformierte Republik"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "Der Wille des Volkes wurde gehört. Der politische Druck und der öffentliche Aufschrei haben zu wichtigen politischen und wirtschaftlichen Reformen geführt, die eine bessere Vertretung und Sichtbarkeit von Drittparteien ermöglichen. Nun liegt es am Volk, eine Partei zu wählen, die es vertritt."
