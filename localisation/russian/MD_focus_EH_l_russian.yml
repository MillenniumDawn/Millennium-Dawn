 EH_defence_decrease_blocked_while_at_war_with_ALN_TT: "§RВоенные расходы нельзя уменьшить во время войны с захватчиками.§!"
 EH_the_country_of_war_idea_TT: "§YДобавляет модификатор «Страна войны».§!\n§RУдаляется, если не выполнены требования к фокусу.§!"
 EH_controlled_situation_idea_TT: "§YДобавить модификатор «Контролируемая ситуация»§!\n§RУдаляется, если не выполняются требования к фокусировке.§!"
 EH_territorial_defense_idea_TT: "§Y Добавить модификатор территориальной обороны §!"
 EH_electric_traps_TT: "Давать возможность §YЭлектроловушки§! Решения, которые будут отображаться на карте во время войны с Химерой (при активной вкладке решений). Каждую ловушку можно установить в контролируемом состоянии, то есть §Yпередовая линия§! или §Yвторая строка§! государство. Установка ловушки обойдется в определенную сумму. §R1 Технология Металл§! и оно будет использовать §R100 МВт§! энергии во время активности.\n\nЛовушка будет активна в течение §Y10 дней§! а затем он перейдет в режим ожидания на §Y15 дней§!Пока ловушка активна, все вражеские подразделения в штате получат... §G+20%§! §Yпотертость§! и §G-15%§! §Yскорость передвижения§!Ловушку можно убрать, что приведет к возврату денег. §G1 Технология Металл§!."
 EH_electric_trap_cooldown: "Ловушка находится в режиме ожидания ([?EH_electric_trap_cooldown:days_left|0Y] дней)"
 EH_electric_trap_removing_flag: "Ловушку в таком состоянии демонтируют."
 EH_electric_trap_active_flag: "Ловушка в этом состоянии в настоящее время активна."
 EH_electric_trap_energy_use_TT: "§YЭта ловушка будет потреблять §R100 МВт§! энергии во время работы.§!"
 EH_electric_trap_country_resource_cost_tungsten_TT: "§YУстановка этой ловушки обойдется в определенную сумму. §R1 Технология Металл§!.§!"
 EH_electric_trap_remove_country_resource_cost_tungsten_TT: "§YУдаление этой ловушки приведет к возврату средств §G1 Технология Металл§!.§!"
 EH_battlefield_adaptation_idea_TT: "§YДобавить модификатор адаптации поля боя§!\n§YБонусы увеличиваются на §G+2%§! каждый месяц, пока не будет достигнут бонус §G+12%§!.§!\n§YДействует до тех пор, пока не будут выполнены условия фокусировки.§!"
 EH_any_spysat_launched: "Запустил ли какой-либо спутник с номером §YSPYSAT§!?"
 EH_any_gnss_launched: "Запустил ли какой-либо спутник с номером §YGNSS§!?"
 EH_any_controlled_state_3100_to_any_portal_TT: "Любое контролируемое состояние §Y[ROOT.GetNameWithFlag]§! или его союзника находится в зоне действия не более §Y3100 км.§! до любого §RPortal.§!"
