 UKR_SP_R_arty_0: "BM-21 그라드"
 UKR_SP_R_arty_0_desc: "현대전에는 많이 사용되지 않은 지대공 미사일(SAMS)와 다련장 로켓포(MLRS)는 주로 2차 대전과 아프가니스탄에서 사용되었습니다. 20km 거리에서 효과적이었습니다."
 UKR_SP_R_arty_1: "BM-30 스메르치"
 UKR_SP_R_arty_1_desc: "이 차량은 그라드 전차의 현대화된 버전입니다. 눈, 얼음, 사막 등 세계 어디든 갈 수 있으며, 유효 사거리는 35km입니다."
 UKR_SP_R_arty_2: "Vilkha"
 UKR_SP_R_arty_2_desc: "An extremely heavy artillery battery that if not dealt with, it can destroy entire cities. With a maximum range of 90km."
