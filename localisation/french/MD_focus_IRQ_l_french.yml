 iraq_md.200.t: "Présence américaine en Irak"
 iraq_md.200.d: "La mission américaine dans notre nation dure depuis de nombreuses années, et aux yeux de notre peuple, leur séjour ici doit prendre fin. Malgré l’insistance de certaines délégations américaines affirmant que leur présence est nécessaire pour combattre le terrorisme et l’extrémisme, nous voyons les choses différemment. Il est temps que notre gouvernement prenne une décision à ce sujet."
 iraq_md.200.a: "Envoyez-leur la demande"
 iraq_md.200.b: "Le moment n’est pas propice"
 iraq_md.201.t: "Le gouvernement irakien demande notre retrait"
 iraq_md.201.d: "The Iraqi government has requested that we withdraw our forces from their nation, citing that our mission has been long due for a closure. Their diplomats have assured us that the state is able to completely operate on its own, not being in need of our assistance to maintain the Iraqi state."
 iraq_md.201.a: "Ramenez nos garçons à la maison"
 iraq_md.201.b: "Non, ils ne sont pas encore prêts"
 iraq_md.202.t: "United States Withdraws Its Forces"
 iraq_md.202.d: "The United States has decided to agree with our request, and have begun withdrawing their troops. The withdrawal will be gradual, but they have already signed into effect the transfer of all government posts currently manned by American experts."
 iraq_md.202.a: "Enfin !"
 iraq_md.203.t: "Les États-Unis refusent de se retirer"
 iraq_md.203.d: "Le gouvernement américain a refusé notre demande, estimant que notre gouvernement n’est pas prêt à maintenir un contrôle stable sur le pays."
 iraq_md.203.a: "Dommage"
 iraq_md.74.b: "NON ! Saddam est notre leader éternel !"
 iraq_md.744.t: "Saddam Hussein est mort !"
 iraq_md.744.d: "Today 6:00 AM the president was reported dead in his bed, surrounded by close family members. His life was one with many ups and downs, surviving several wars with the United States and other nations. However, with his death, comes a new beginning. Saddam had appointed one of his sons to lead the nation, though it has been widely unknown until recently."
 iraq_md.744.a: "Repose en paix…"
 iraq_md.300.t: "Saddam veut un point sur nos progrès en Iran ?"
 iraq_md.300.d: "Saddam Hussein a fait irruption dans le bureau de l’état-major interarmées, exigeant de savoir comment progresse notre guerre contre l’Iran. Un garde s’est avancé et a déclaré : « Monsieur le Président, la guerre s’est terminée il y a des décennies ! Il n’y a pas de guerre avec l’Iran. » Saddam a immédiatement abattu le garde sur place."
 iraq_md.300.a: "Uh.. Yeah it's going great"
 iraq_md.301.t: "Saddam confond un hôpital avec une chambre de torture"
 iraq_md.301.d: "During a routine hospital visit, Saddam mistook the hospital as a torture chamber and began fighting with the nurses who were preparing him for his check. He demanded that he be freed immediately, but his personal assistant re-assured him that they were not in a torture chamber. The assistant was fired yesterday, and for some reason his records such as birth certificate, and otherwise, no longer appear on our systems."
 iraq_md.301.a: "Merde"
 iraq_md.302.t: "Saddam prend d’assaut le consulat britannique"
 iraq_md.302.d: "Whilst he was on a walk, Saddam Hussein had convinced a small group of soldiers he saw on the road to help him storm the British Consulate in Baghdad. Upon attempting to breach the compound, British guards detained the soldiers aiding Saddam and demanded for someone to come get Saddam. As Saddam was being dragged away, he started frantically kicking and screaming \"Today the colonizers have been colonized! Glory to the Iraqi nation! Glory to the Iraqi people!\". The British consulate have issued a statement, declaring they will be leaving for the time being."
 iraq_md.302.a: "Oups"
 iraq_md.303.t: "Saddam confond une lampe de poche avec une bombe"
 iraq_md.303.d: "Pour une raison inconnue, hier soir, un employé de maison a placé une lampe de poche sur la table de nuit de Saddam pendant qu’il dormait. Ce matin, plusieurs gardes se sont précipités dans sa chambre, alarmés par les cris qui en provenaient. Ils ont trouvé un Saddam terrifié, debout dans un coin de la pièce, pointant la lampe en hurlant : « Les Américains et les sionistes ont glissé une bombe dans ma chambre ! » Les gardes ont rapidement retiré la lampe, et Saddam s’est rendormi. L’employé de maison ne travaille plus au palais."
 iraq_md.303.a: "Qu’est-ce que c’est que ça ?"
 iraq_md.304.t: "Saddam tente de soudoyer un employé de magasin, le prenant pour un diplomate"
 iraq_md.304.d: "For several days, Saddam had been complaining about the lack of Chocolate in the palace. Because of this, his assistants could not put up with his complaining for much longer, and eventually just took him to the store as he insisted he wanted to personally pick out the brand of chocolate himself. As the guards and assistants were distracted by the crowd forming outside, one of them noticed that Saddam was trying to whisper into the ear of the clerk, and overheard him saying \"Listen, if you ensure that our ships flow through Hormuz without problem, and you go back on your deal with the Omanis and Iranians, then I will give you a very favorable price for any future oil deals\". The Guards then swiftly bought the chocolate, and escorted Saddam back to the palace."
 iraq_md.304.a: "Qu’est-ce que c’est que ça ?"
 iraq_md.305.t: "Saddam rédige une confession émouvante pour des crimes qu’il n’a pas commis"
 iraq_md.305.d: "In a moment of considerable guilt and confusion, Saddam began writing a very emotional and apologetic address to the nation about crimes that he did not commit. He went on to describe how he felt sorry for tainting a local town's water supply with apple-cider vinegar. A nosey maid came across this letter, and reported it to one of Saddam's close assistants, who immediately went on to have a talk with Saddam about how he did not commit such a crime. Saddam insisted that he did, and that he could no longer stand the guilt. The assistant then reluctantly brought a nutritionist to inform Saddam about the health benefits of apple-cider vinegar, and how instead he helped the locals rather than harm. Saddam then secretly wrote and published a patriotic letter pleading with everyone to drink apple-cider vinegar so that Iraq may have \"The Earth's Finest Soldiers\"."
 iraq_md.305.a: "Oh non"
 iraq_md.306.t: "Saddam complote une révolution contre ses soignants"
 iraq_md.306.d: "Upon being denied exit from the palace, Saddam thought that he was under house arrest as he believed that his party had failed the coup they launched in 1963. He then began trying to sway the guards to his side, explaining to them in detail about his plot to overthrow his care-givers, and break free from the palace. The guards then realized something was wrong, and took him under their protection momentarily until he fell asleep."
 iraq_md.306.a: "Pourquoi ?"
 iraq_md.307.t: "Saddam prépare un dîner diplomatique avec des restes"
 iraq_md.307.d: "Sans informer la cuisine du palais ni qui que ce soit, Saddam a disposé des assiettes sur la table de la salle à manger et a convié des diplomates régionaux pour un dîner visant à discuter des problèmes régionaux. Cela a conduit à une fouille des invités par les gardes du palais à leur arrivée, provoquant un tumulte qui aurait pu être évité si Saddam avait prévenu de ses intentions. Les invités ont finalement été admis, mais ayant oublié qu’il les avait invités, Saddam n’avait rien préparé. Ils ont donc été servis avec des restes froids qu’il a récupérés précipitamment dans la cuisine."
 iraq_md.307.a: "Quelle gêne"
 iraq_md.308.t: "Saddam répète pendant des heures un discours déjà diffusé"
 iraq_md.308.d: "For hours, Saddam's care-givers had not seen him leave his room, as they believed he was rehearsing a quick speech that he had planned for later that day. Out of concern, they began trying to listen to what he was saying and one of them recognized the speech as his previous one about the American invasion. An assistant was later told to enter the room to inform Saddam that he had already given the speech years ago, and he did so with fear and reluctance. Saddam then furiously threw the papers against the wall and told the assistant to get out. Later that day the sounds of a crying Saddam could be heard throughout the palace."
 iraq_md.308.a: "Zut…"
 iraq_md.309.t: "Saddam confond un réfrigérateur avec un coffre-fort"
 iraq_md.309.d: "Ce matin, Saddam a mis le palais sens dessus dessous en cherchant frénétiquement l’argent qu’il avait stocké dans un coffre sécurisé dans une chambre forte. Oubliant cela, il a pris le réfrigérateur pour son coffre, croyant que quelqu’un avait volé son argent et l’avait caché ailleurs. On lui a ensuite indiqué l’emplacement du vrai coffre, et il a exigé d’en retirer de l’argent pour s’offrir des luxes."
 iraq_md.309.a: "Merde"
 iraq_md.310.t: "Saddam déclenche un incendie !"
 iraq_md.310.d: "Plus tôt aujourd’hui, alors que Saddam visitait un village près de Rutbah, il a allumé un cigare qu’il a oublié d’éteindre ou même de fumer. Ce cigare est entré en contact avec une maison, déclenchant un incendie qui s’est propagé à la majeure partie du village. Informé de la cause, Saddam a persisté à dire qu’il n’avait pas fumé depuis des années."
 iraq_md.310.a: "Quels sont les dégâts ?"
 iraq_md.311.t: "Saddam prend le mauvais vol !"
 iraq_md.311.d: "Saddam had been adamant about meeting the President of France, [FRA.GetLeader]. The meeting was agreed upon, and the flight was prepared. During the flight, Saddam insisted that he knew the way to France as he in his own words, \"had been to France many times\". As a result, the pilot had to agree to Saddam's verbal directions and ended up in the middle of French Guiana instead. The meeting was then promptly cancelled."
 iraq_md.311.a: "Peut-on le récupérer, s’il vous plaît ?"
 iraq_md.312.t: "Saddam manque un sommet crucial sur la sécurité"
 iraq_md.312.d: "Saddam had arranged plans for a national security summit, where his top generals and officers were asked to attend. Yesterday was when the summit was meant to take place, and upon the arrival of all the officials, they were greeted with silence as they all patiently waited for Saddam Hussein to address the room. To their surprise, Saddam Hussein never showed up. Instead it was revealed that Saddam was busy on a fishing trip with Qusay and Uday at the Euphrates river."
 iraq_md.312.a: "Tant mieux pour lui"
 iraq_md.313.t: "Saddam confond un défilé festif avec une marche militaire"
 iraq_md.313.d: "This morning, Saddam was being driven to an official's office for a meeting that they had arranged. On his way there, he saw a street being blocked off for a planned parade being held there, which he mistook for a military parade. He then told his driver to pull over, and Saddam rushed to the podium on the side of the street, kicking the announcer off the stage. He then began saluting in anticipation for the soldiers, but instead he was caught saluting cartoon characters as he swiftly realized that he was at a children's parade."
 iraq_md.313.a: "Merde"
 iraq_md.314.t: "Saddam ordonne la construction de 500 nouveaux bunkers !"
 iraq_md.314.d: "Craignant une frappe nucléaire imminente des États-Unis, Saddam a ordonné la construction de 500 nouveaux bunkers à travers l’Irak. Il pensait que le pays était toujours en guerre avec les États-Unis, ce qui l’a poussé à paniquer. Les ordres ont été annulés, mais les entreprises de construction ont perdu de l’argent et doivent être justement indemnisées."
 iraq_md.314.a: "Merde"
 iraq_md.315.t: "Saddam ordonne le placement de centaines de mines au Kurdistan pour combattre les insurgés !"
 iraq_md.315.d: "Sans consulter ses conseillers militaires, Saddam a ordonné le placement de centaines de mines à la frontière du Kurdistan pour contrer les groupes insurgés locaux. Cet ordre a été rapidement exécuté par ceux qui l’ont reçu, pensant qu’il était sérieux en raison de la récente augmentation des attaques. Mais ses principaux conseillers avertissent maintenant que ces mines pourraient gravement nuire à nos propres troupes."
 iraq_md.315.a: "Oh oh"
 iraq_md.316.t: "Saddam Hussein est tué par une mine"
 iraq_md.316.d: "Il y a quelques mois, Saddam Hussein a décidé de placer des centaines de mines près de la frontière kurde pour empêcher les attaques des insurgés locaux. Se sentant mal aimé par le peuple kurde, il a ressenti le besoin de visiter la région seul pour rencontrer les habitants en signe de bonne foi. Il a pris une voiture au palais et a conduit pendant des heures jusqu’à la frontière. Avec juste assez de carburant pour y arriver, il a continué à pied lorsque le véhicule est tombé en panne. Oubliant les mines, il a marché sur l’une d’elles et est mort sur le coup."
 iraq_md.316.a: "Repose en paix, notre leader bien-aimé"
 IRQ_temp_medical_cost: "Frais hospitaliers"
 IRQ_saddam_ages_TT: "§HSaddam Hussein§! vieillira et §Rsouffrira d’Alzheimer§!"
 IRQ_saddam_is_saddened_TT: "§HSaddam devient triste§!"
 IRQ_alzheimers_TT: "Due to §RSaddam's Alzheimer's§!, we may get events about §HSaddam's§! erratic behavior!"
 IRQ_saddams_pissfits: "£SOV_paranoia_text_icon Rage de [IRQ.GetLeader]"
 IRQ_saddams_pissfits_desc: "Tout au long de sa vie, §H[IRQ.GetLeader]§! n’a pas su contrôler sa £SOV_paranoia_text_icon §Rrage§!. Souvent dirigée contre son £personnel_cost_multiplier_modifier_texticon personnel militaire ou les habitants de l’Irak [IRQ.GetFlag] §H§!. Sa £SOV_paranoia_text_icon §Rrage§! inspire la peur parmi le peuple, ce qui peut les rendre moins susceptibles de faire des erreurs, mais à quel prix.\n\n£SOV_paranoia_text_icon §Rrage§! augmentera via certains §Hévénements, décisions et focus§!. Si £stability_texticon §Hstabilité§! est inférieure à §H40 %§!, alors £SOV_paranoia_text_icon §Rrage§! aura une chance d’augmenter de §H1§! chaque mois. Si £SOV_paranoia_text_icon §Rrage§! dépasse §H25 %§!, des événements aléatoires avec des conséquences se déclencheront. Si £SOV_paranoia_text_icon §Rrage§! atteint §H50 %§!, §H[IRQ.GetLeader]§! exécutera un £personnel_cost_multiplier_modifier_texticon général au hasard. £SOV_paranoia_text_icon §Rrage§! diminuera graduellement si £stability_texticon §Hstabilité§! est à §H40 %§! ou plus.\n\n£SOV_paranoia_text_icon §Rrage§! : [?IRQ_saddam_pissboy|%]"
 IRQ_receive_influence_5_TT: "Nous recevrons §H5 % d'influence§! sur [IRQ.GetFlag] §HIrak§!"
 IRQ_receive_influence_2_TT: "Nous recevrons §H2 % d'influence§! sur [IRQ.GetFlag] §HIrak§!"
 IRQ_they_receive_2_influence_TT: "Ils recevront §H2 % d'influence§! sur nous."
 IRQ_they_receive_5_influence_TT: "Ils recevront §H5 % d'influence§! sur nous."
 IRQ_fedayeen_patrols: "Patrouilles des Fedayeen"
 IRQ_fedayeen_patrols_desc: "The Fedayeen Saddam must be utilized in order to enforce our nation's laws. They will ensure that the people are following holy norms, and remain righteous."
 IRQ_western_engineers_in_iraq: "Ingénieurs occidentaux en Irak"
 IRQ_western_aid_to_iraq: "Aide occidentale à l’Irak"
 IRQ_assassinate_abdullah_s_jumah: "Assassiner Abdullah S. Jum’ah"
 IRQ_assassinate_abdullah_s_jumah_desc: "Le PDG d’Aramco [SAU.GetFlag], Abdullah S. Jum’ah, doit disparaître. Nous enverrons nos agents secrets s’en occuper, en espérant que tout se passe bien."
 iraqi_flavor_events.10.t: "Le soulèvement chiite engloutit le sud de l'Irak"
 iraqi_flavor_events.10.d: "Une révolte à grande échelle a balayé l'Irak baasiste de Saddam Hussein, marquant la troisième révolte de ce type ces dernières années. Les musulmans chiites ont pris les armes contre l'État baasiste à la suite d'allégations selon lesquelles un religieux bien connu aurait été assassiné dans les rues de Bassora. \n\nLes spéculations sur l'implication de l'Iran dans la révolte s'intensifient, des rumeurs indiquant que Téhéran pourrait être derrière l'assassinat, déclenchant cette dernière vague de troubles. Les forces irakiennes répondent rapidement, déployant une force écrasante pour réprimer la rébellion. Le monde attend avec impatience la réponse de l'Iran et ce qu'elle pourrait apporter."
 iraqi_flavor_events.10.a: "Le coût de la guerre"
 iraqi_flavor_events.11.t: "La bannière noire se lève sur l'Irak"
 iraqi_flavor_events.11.t1: "Emergence of an Islamic State in Iraq"
 iraqi_flavor_events.11.d: "[ISI.GetLeader] today declared the formation of Al-Qaeda's official branch in Iraq, pledging the allegiance of Jama'at al-Tawhid wal-Jihad (Congregation of Monotheism and Jihad) to Osama bin Laden's global terror network of Al-Qaeda. Vowing to wage unyielding jihad against [PER.GetAdjective]-backed groups and Ba'athist Iraq, the organization, composed of foreign fighters and [IRQ.GetAdjective] insurgents, seeks to establish a caliphate, followed by a wave of jihad that would extend to Iraq's secular neighbours, before ending in a clash with Israel. The group has already launched several attacks against the IRGC, Shia militias, and the central Iraqi government. This comes as mass bombings rock the city of Baghdad as well as major cities across Iraq."
 iraqi_flavor_events.11.d1: "[ISI.GetLeader] a déclaré la création de l'État islamique d'Irak. Annonçant l'unification de diverses factions djihadistes sous sa bannière, y compris Al-Qaïda en Irak. L'organisation a juré de démanteler l'Irak baasiste de [IRQ.GetLeader] et de mener un djihad implacable contre les milices soutenues par les [PER.GetAdjective] et la force iranienne des Gardiens de la révolution islamique. Le but ultime est d'établir un califat islamique à travers le Moyen-Orient. Le groupe a intensifié sa campagne de bombardements, d'assassinats et de raids à travers Bagdad et d'autres grandes villes irakiennes alors que l'Irak plonge dans le chaos."
 iraqi_flavor_events.11.a: "L'Irak est-il perdu ?"
 iraqi_flavor_events.12.t: "Coup d'État soutenu par l'Iran en Irak"
 iraqi_flavor_events.12.d: "Il y a quelques instants, une coalition de chefs de milices chiites soutenue par [PER.GetNameWithFlag] a lancé un coup d'État contre le gouvernement baasiste. Déclarant la suspension de la constitution irakienne et l'établissement d'un régime chiite. Le nouveau chef de [IRQ.GetNameWithFlag], [IRQ.GetLeader], a annoncé que ses forces venaient de prendre d'assaut la résidence de Saddam Hussein et de s'emparer de son corps lors d'une opération ciblée. Dans une déclaration enflammée, il a proclamé : « Nous ne nous reposerons pas tant que nous n'aurons pas déraciné le baasisme de cette terre, qui est légitimement pour tous ! ». Cela intervient alors que le chaos éclate à Bagdad alors que les milices chiites ont commencé les assassinats de haut niveau de responsables baasistes. Pendant ce temps, le Guide suprême de [PER.GetNameWithFlag], [PER.GetLeader], a exprimé son plein soutien au nouveau gouvernement sous [IRQ.GetLeader]."
 iraqi_flavor_events.12.a: "La fin de la tyrannie ou juste la page suivante ?"
 iraqi_flavor_events.13.t: "Les loyalistes baasistes prennent les armes"
 iraqi_flavor_events.13.d: "Les restes de loyalistes baasistes ont lancé une rébellion à grande échelle dans le nord-ouest de [IRQ.GetNameWithFlag], s'emparant de plusieurs villes clés dans le but de restaurer le régime baasiste et de rejeter le gouvernement actuel dirigé par les chiites. [IRQ.GetLeader] a juré d'écraser le soulèvement, mais l'issue reste incertaine alors que la violence et les troubles se propagent dans le gouvernement déjà instable. Pendant ce temps, [IRS.GetLeader] prépare une offensive pour reprendre la capitale, Bagdad."
 iraqi_flavor_events.13.a1: "Le coût de la guerre"
 iraqi_flavor_events.13.a2: "Écrasez-les"
 IRQ_leave_socialist_union: "Quitter l'Union socialiste avec [PER.GetFlag] l'Iran"
 iraq_md.317.t: "Garner remplacé par Bremer"
 iraq_md.317.d: "Under the directive of the U.S. government, Jay Garner has been replaced with Paul Bremer. Allegations arose on what Garner's plans with Iraq were, as it was believed that he was giving too much control to the Iraqis themselves rather than going through the American forces. This move concludes Garner's short venture in Iraq, and the start of a new one."
 iraq_md.317.a: "D'accord"
 iraq_md.318.t: ""
 iraq_md.318.d: ""
 iraq_md.318.a: ""
 iraqi_MNF.2.t: "Bagdad tombe"
 iraqi_MNF.2.d: "L'honorable ville de Bagdad est tombée aux mains des forces d'occupation, et les bâtiments gouvernementaux, les statues et les affiches sont détruits en ce moment même. Plusieurs hauts fonctionnaires ont été capturés, tués ou sont portés disparus. Nos meilleurs généraux nous disent que le combat est futile et que nous risquons de sacrifier plus de vies si nous choisissons de poursuivre notre lutte armée contre les ennemis. Mais quel choix avons-nous ? Ils sont venus sur notre terre, ont attaqué notre peuple et ont violé notre souveraineté."
 iraqi_MNF.2.a: "Nous n'avons pas le choix."
 iraqi_MNF.2.b: "La reddition n'est pas dans notre vocabulaire !"
 iraqi_MNF.3.t: "L'Amérique commence les opérations en Irak"
 iraqi_MNF.3.d: "Les États-Unis se sont mis en état de guerre contre l'Irak, et nous avons promis aux Américains que nous serions là, à leurs côtés, pour combattre n'importe quel ennemi. Aujourd'hui, nous pouvons agir sur cette promesse en envoyant des troupes à la Force multinationale en Irak."
 iraqi_MNF.3.a: "En avant"
 iraqi_MNF.3.b: "Nous avons changé d'avis..."
 iraqi_MNF.4.t: "Le gouvernement irakien au pouvoir demande notre retrait"
 iraqi_MNF.4.d: "L'autorité dirigeante en Irak a officiellement demandé que nous retirions nos forces d'Irak, y compris toutes les zones d'occupation. Bien que la lettre semblait assez amicale dans son approche, elle n'était certainement pas sans ses menaces subtiles. « Le refus de quitter les territoires souverains irakiens peut entraîner des conséquences imprévues », disait la lettre, signée par [IRQ.GetLeader]."
 iraqi_MNF.4.a: "Nous partirons"
 iraqi_MNF.4.b: "Nous partirons... à une condition"
 iraqi_MNF.4.c: "Alors vous devrez nous enterrer sur cette terre !"
 iraqi_MNF.5.t: "[FROM.GetName] se retire sans condition"
 iraqi_MNF.5.d: "Le gouvernement [FROM.GetAdjective] a décidé de se conformer à notre demande et de quitter ses territoires occupés avec effet immédiat."
 iraqi_MNF.5.a: "Bien"
 iraqi_MNF.6.t: "[FROM.GetName] se retire avec des concessions pétrolières"
 iraqi_MNF.6.d: "Le gouvernement [FROM.GetAdjective] a décidé de se conformer à notre demande et de quitter ses territoires occupés avec effet immédiat. Cependant, il demande des droits sur le pétrole dans le cadre de ses conditions de départ."
 iraqi_MNF.6.a: "D'accord, c'est bon"
 iraqi_MNF.7.t: "[FROM.GetName] refuse de partir"
 iraqi_MNF.7.d: "Those [FROM.GetAdjective] vermin have refused to let go of their occupation zones, and are further entrenching themselves in our territory. If they don't understand the language of diplomacy, then they'll understand the language of our force."
 iraqi_MNF.7.a: "Malheureusement..."
 iraqi_MNF.8.t: "Le contrat sur les droits pétroliers irakiens expire"
 iraqi_MNF.8.d: "Notre contrat pour le pétrole irakien a expiré aujourd'hui, et par conséquent, nous ne contrôlons plus le pétrole dans les régions que nous avons autrefois occupées."
 iraqi_MNF.8.a: "Comme convenu"
 iraqi_MNF.9.t: "Le contrat pétrolier de [FROM.GetName] expire"
 iraqi_MNF.9.d: "[FROM.GetName] will no longer control the flow of oil in the regions they once occupied, with exports and oil handling being returned to Iraqi national control once more."
 iraqi_MNF.9.a: "Bien"
 iraqi_MNF.10.t: "Saddam Hussein capturé !"
 iraqi_MNF.10.d: "After weeks of being on the run, Saddam Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.10.a: "Mesdames et messieurs, nous l'avons eu"
 iraqi_MNF.11.t: "Qoussaï Hussein capturé !"
 iraqi_MNF.11.d: "After weeks of being on the run, Qusay Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.11.a: "Bien"
 iraqi_MNF.12.t: "Oudaï Hussein capturé !"
 iraqi_MNF.12.d: "After weeks of being on the run, Uday Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.12.a: "Bien. Que ce maniaque quitte les rues !"
 iraqi_MNF.13.t: "Abid Hamid Mahmud capturé !"
 iraqi_MNF.13.d: "After weeks of being on the run, Abid Hamid Mahmud was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.13.a: "Bien"
 iraqi_MNF.14.t: "« Ali le chimique » capturé !"
 iraqi_MNF.14.d: "After weeks of being on the run, Ali Hassan al-Majid, AKA 'Chemical Ali' was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.14.a: "Bien"
 iraqi_MNF.15.t: "Izzat Ibrahim Al-Douri Captured!"
 iraqi_MNF.15.d: "After weeks of being on the run, Izzat Ibrahim Al-Douri was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.15.a: "Bien"
 iraqi_MNF.16.t: "Hani Abd al-Latif Tilfah capturé !"
 iraqi_MNF.16.d: "After weeks of being on the run, Hani Abd al-Latif Tilfah was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.16.a: "Bien"
 iraqi_MNF.17.t: "Aziz Salih capturé !"
 iraqi_MNF.17.d: "After weeks of being on the run, Aziz Salih was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.17.a: "Bien"
 iraqi_MNF.170.t: "Les plus recherchés d'Irak"
 iraqi_MNF.170.d: "Cinquante-deux responsables de l'ancien gouvernement ont été imprimés sur un jeu de cartes distribué à chaque unité du pays, les as et les figures étant réservés aux hommes qui dirigeaient réellement l'État. Certains sont encore en Irak, passant d'une planque à l'autre et chez des parents selon un calendrier que personne hors de la famille ne connaît. D'autres ont franchi la frontière vers des capitales voisines qui continueront de nier leur présence aussi longtemps que cela sera commode. L'évaluation du renseignement est que ceux qui restent en liberté s'organisent déjà, et que chaque mois où le jeu reste non retourné est un mois de plus de préparation que nous leur offrons."
 iraqi_MNF.170.a: "La main rapide de la justice les attrapera."
 iraqi_MNF.200.t: "Contre-attaque baasiste majeure sur la base navale koweïtienne !"
 iraqi_MNF.200.d: "Les forces baasistes ont lancé une attaque majeure contre notre base navale koweïtienne, détruisant une grande partie des infrastructures de la base. Les attaques ont laissé nos forces humiliées, démoralisées et bouleversées, notre réputation étant gravement endommagée dans la région. Sur le continent, notre parti a été fortement attaqué par la presse et la population. Il est rapporté que notre incapacité à capturer les baasistes qui se cachent en Irak et à l'extérieur était la cause principale de cela, car ils ont pu planifier cette attaque au cours des dernières années sans trop de difficultés."
 iraqi_MNF.200.a: "Incroyable"
 IRQ_request_british_withdrawal: "Demander le retrait britannique"
 IRQ_request_british_withdrawal_desc: "Les Britanniques doivent faire leurs valises et quitter le Sud. C'est notre terre, et ils y sont installés sans notre permission."
 IRQ_request_polish_withdrawal: "Demander le retrait polonais"
 IRQ_request_polish_withdrawal_desc: "Les Polonais doivent faire leurs valises et quitter les zones centrales. C'est notre terre, et ils y sont installés sans notre permission."
 IRQ_5_years_TT: "Ils obtiendront des §Hconcessions pétrolières§! pendant §H5§! ans !"
 IRQ_MNF_VOLUNTEER_TT: "- Nous pourrons envoyer des volontaires à la §HForce multinationale§! en [IRQ.GetFlag] §HIrak§! pour aider à l'effort de guerre."
 IRQ_increase_pol_inf_15_TT: "Augmente l'§HInfluence politique sunnite§! de §H15§!.\n(Influence actuelle : §H[?IRQ_sunni_political_influence]§!)"
 iraq_md.319.t: "Une enquête sacrée sur la dissuasion avancée"
 iraq_md.319.d: "In the holy city of Najaf, Grand Ayatollah Ali al-Sistani has reportedly spent several days in private reflection. Yesterday, the Grand Ayatollah reportedly asked a single question of whether the state possessed 'a man of sufficient learning to bring theory into form'. His aides, uncertain whether this referred to theology or physics, forwarded the question through the usual clerical channels. This confusion was cleared up rather quickly as through a rare written statement, Grand Ayatollah Sistani declared that the nation must develop 'special means of strategic persuasion'. Due to extensive Ba'ath purges in previous years, Sistani's aides were unable to locate any 'trustworthy' scientists capable of developing these 'special means of strategic persuasion'. Instead, they were able to locate a recent college graduate who had #OpenToNetwork on his LinkedIn page, and an offer has been extended to bring him to Iraq and provide him with a laboratory to conduct his research."
 iraq_md.319.a: "Inshallah l'Irak sera en sécurité"
 IRQ_renovation_of_baiji_refinery: "Rénovation de la raffinerie de Baiji"
 IRQ_renovation_of_baiji_refinery_desc: "La raffinerie de Baiji a été le théâtre de nombreux conflits et batailles, ce qui explique son état de délabrement avancé. Sa réparation et sa reconstruction dépendent de notre budget."
 iraq_war.24.t: "La question afghane"
 iraq_war.24.d: "Notre échec en Irak a ébranlé la confiance du public dans nos engagements à l'étranger. Face à des forces armées surchargées et à une lassitude croissante de la guerre au pays, les appels à mettre fin à notre mission en Afghanistan se multiplient. Le coût du maintien de notre présence sur place devient de plus en plus difficile à justifier auprès d'une population exaspérée par la guerre."
 iraq_war.24.a: "Retrait d'Afghanistan"
 iraq_war.24.b: "Nous maintiendrons le cap."
 IRQ_commie_paper: "Publier Al-Qaida"
 IRQ_invite_hezbollah: "Inviter [HEZ.GetFlag] [HEZ.GetName]"
 IRQ_receive_iranian_planes_TT: "Nous recevons §G7§! §YMiG-29 Fulcrum§! d'Iran."
 IRQ_resistance_jewel_aid_TT: "Chaque allié qui accepte construit des infrastructures ou une centrale à combustibles fossiles en Irak."
 IRQ_saudi_trade_refusal_TT: "L'Arabie saoudite refuse d'étendre les relations commerciales, bloquant §YRelancer le port de Bassorah§!."
 IRQ_demand_kuwait_naval_base: "Exiger la base navale koweïtienne [KUW.GetFlag]"
 IRQ_demand_kuwait_naval_base_desc: "Les Koweïtiens [KUW.GetFlag] ont laissé les Américains implanter une base navale juste à notre porte. §H[IRQ.GetLeader]§! exige que le Koweït [KUW.GetFlag] nous cède le contrôle de la base, ou en affronte les conséquences."
 IRQ_propose_kurdistan_defensive_pact: "Proposer un pacte défensif avec le Kurdistan [KUR.GetFlag]"
 IRQ_propose_kurdistan_defensive_pact_desc: "§H[IRQ.GetLeader]§! souhaite sécuriser notre flanc nord en offrant au Kurdistan [KUR.GetFlag] un pacte défensif mutuel, renonçant à nos revendications sur leur territoire en échange de leur garantie du nôtre."
 IRQ_expel_economic_union_members_decision: "Expulser les membres du syndicat"
 IRQ_expel_economic_union_members_decision_desc: "Plusieurs membres de notre §HUnion de la prospérité islamique§! se sont relâchés dans leurs engagements. Nous expulserons tous les membres actuels de l'union, dissolvant ses bénéfices commerciaux et industriels jusqu'à l'arrivée de nouveaux partenaires."
 IRQ_members_in_union_TT: "Il y a §Hau moins un membre§! actuellement dans l'§HUnion de la prospérité islamique§! à expulser."
 IRQ_demanded_kuwait_naval_base: "Base navale koweïtienne déjà exigée"
 IRQ_proposed_kurdistan_pact: "Pacte défensif kurde déjà proposé"
 iraqi_MNF.26.t: "Le complexe était vide"
 iraqi_MNF.26.d: "L'élément d'assaut a nettoyé le complexe pièce par pièce et a trouvé des literies encore chaudes, un téléphone satellite dont la batterie avait été ôtée, et personne dans le bâtiment. Quelqu'un a été payé pour un avertissement et l'a mérité. Le temps que le site soit exploité, le réseau l'aura déplacé ailleurs dans le pays, et la recherche recommence à partir de ce que valent les documents laissés derrière."
 iraqi_MNF.26.a: "Découvrir qui a parlé"
 IRQ_qusay_hussein_idea: "Qusay Hussein"
 IRQ_qusay_hussein_idea_desc: "With Qusay designated as Saddam's successor, we draw on his leadership of the Special Republican Guard to strengthen our armed forces and secure the regime."
 IRQ_demand_kuwait_naval_base_TT: "[KUW.GetFlag] §HKuwait§! will answer our demand when this decision ends. They are §Gmuch more likely§! to give in if our £foreign_influence_modifier_texticon  §HInfluence§! in [KUW.GetFlag] §HKuwait§! is still §H30%§! or more at that time.\n§RWe can only make this demand once.§!"