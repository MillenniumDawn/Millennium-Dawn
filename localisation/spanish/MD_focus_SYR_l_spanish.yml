 TT_SYR_COTTON_INVESTMENTS: "If we have allowed private banks and we have 50% Kurdish inclusivity or more our investment will be more economically successful and we'll obtain an industrial complex"
 TT_SYR_ASSAULT_JORDAN: "El éxito del golpe depende de la popularidad de la §YPerspectiva Nacionalista§! en Jordania.\n\nSi el golpe §Gtiene éxito§!, el nuevo régimen será instado a unirse a nosotros y obtendremos núcleos en Jordania.\n\nSi el golpe lleva a una §Yguerra civil§!, nos uniremos al SSNP en su guerra contra el régimen y obtendremos núcleos en Jordania.\n\nSi el golpe §Rfallase§!, habrá guerra entre nosotros y Jordania, y solo obtendremos reclamos sobre Jordania.\n\n"
 TT_SYR_CONCESSIONS_TO_KURDS: "Si los kurdos aceptan nuestro trato, entonces\n"
 TT_SYR_ALIGN_SUDAN: "\nLa disposición de [SUD.GetName] para aliarse con nosotros es §Gfuerte§! por defecto\n\nEs más probable que [SUD.GetName] se alíe con nosotros si\n §G-Siguen la Perspectiva Nacionalista§!\n\nEs menos probable que [SUD.GetName] se alíe con nosotros si\n §R-Ellos y [EGY.GetName] siguen la Perspectiva Occidental o Emergente\n -Están en guerra\n -Ya están aliados con alguien más§!\n"
 TT_SYR_ALIGN_AZERBAIJAN: "\nLa disposición de [AZE.GetName] para aliarse con nosotros está §Gdividida por igual§! por defecto\n\nEs más probable que [AZE.GetName] se alíe con nosotros si\n §G-Siguen la Perspectiva Nacionalista§!\n\nEs menos probable que [AZE.GetName] se alíe con nosotros si\n §R-Ellos y [PER.GetName] siguen la Perspectiva Occidental o Emergente\n -Siguen la Perspectiva No Alineada\n -Están en guerra\n -Ya están aliados con alguien más\n -Han resuelto su disputa con [ARM.GetName]\n -Hemos sido hostiles hacia Turquía§!\n"
 TT_SYR_ALIGN_ARMENIA: "\nLa disposición de [ARM.GetName] para aliarse con nosotros es §Gfuerte§! por defecto\n\nEs más probable que [ARM.GetName] se alíe con nosotros si\n §G-Siguen la Perspectiva Nacionalista§!\n\nEs menos probable que [ARM.GetName] se alíe con nosotros si\n §R-Están en guerra\n -Estamos aliados con los kurdos§!\n"
 TT_SYR_ALIGN_GREECE: "\nLa disposición de [GRE.GetName] para aliarse con nosotros es §Rdébil§! por defecto\n\nEs más probable que [GRE.GetName] se alíe con nosotros si\n §G-Siguen la Perspectiva Nacionalista\n -[TUR.GetName] no es miembro de la OTAN§!\n\nEs menos probable que [GRE.GetName] se alíe con nosotros si\n §R-Están en guerra\n -Han resuelto sus disputas fronterizas con [TUR.GetName]\n -Nosotros o nuestro títere poseemos Chipre§!\n"
 TT_SYR_WEAKEN_IRAN: "Obtendremos acceso a §Ydecisiones§! para debilitar a Irán y reclutar milicias locales antes de invadirlos\n"
 TT_SYR_ARABISTAN_ARMED: "Cuando hagamos §YOperación Torbellino Oriental§!, las milicias árabes se levantarán y se unirán a nosotros\n"
 TT_SYR_LURISTAN_ARMED: "Cuando hagamos §YOperación Torbellino Oriental§!, los rebeldes lur declararán la independencia y lucharán contra Irán\n"
 TT_SYR_AZERBAIJAN_ARMED: "Cuando hagamos §YOperación Torbellino Oriental§!, los rebeldes azeríes se unirán al ejército azerbaiyano y lucharán contra Irán\n"
 TT_SYR_TABARISTAN_ARMED: "Cuando hagamos §YOperación Torbellino Oriental§!, los rebeldes gilak y mazanderani declararán la independencia y lucharán contra Irán\n"
 TT_SYR_BALOCHISTAN_ARMED: "Cuando hagamos §YOperación Torbellino Oriental§!, los rebeldes baluchi declararán la independencia y lucharán contra Irán\n"
 TT_SYR_ALIGN_PALESTINE: "\nLa disposición de [PAL.GetName] para aliarse con nosotros es §Gfuerte§! por defecto\n\n[PAL.GetName] es más probable que se alíe con nosotros si\n §G-Seguimos la misma Perspectiva§!\n\n[PAL.GetName] es menos probable que se alíe con nosotros si\n §R-Ya están aliados con alguien más\n§!"
 TT_SYR_ALIGN_ISRAEL: "\nLa disposición de [ISR.GetName] para aliarse con nosotros es §Gfuerte§! por defecto\n\n[ISR.GetName] es más probable que se alíe con nosotros si\n §G-Ambos seguimos la Perspectiva Occidental o Emergente§!\n\n[ISR.GetName] es menos probable que se alíe con nosotros si\n §R-Ya están aliados con alguien más\n -Siguen la Perspectiva Nacionalista\n§!"
 TT_SYR_ALIGN_JORDAN: "\nLa disposición de [JOR.GetName] para aliarse con nosotros es §Gfuerte§! por defecto\n\n[JOR.GetName] es más probable que se alíe con nosotros si\n §G-Ambos seguimos la misma Perspectiva\n -[ISR.GetName] sigue la Perspectiva Nacionalista§!\n\n[JOR.GetName] es menos probable que se alíe con nosotros si\n §R-El Conflicto Árabe-Israelí está resuelto de su parte\n§!"
 TT_SYR_ALIGN_EGYPT: "\nLa disposición de [EGY.GetName] para aliarse con nosotros es §Gfuerte§! por defecto\n\n[EGY.GetName] es más probable que se alíe con nosotros si\n §G-Ambos seguimos la misma Perspectiva\n -[ISR.GetName] sigue la Perspectiva Nacionalista§!\n\n[EGY.GetName] es menos probable que se alíe con nosotros si\n §R-El Conflicto Árabe-Israelí está resuelto de su parte\n§!"
 TT_SYR_ALIGN_SAUDI_ARABIA: "\nLa disposición de [SAU.GetName] para aliarse con nosotros es §gdividida§! por defecto\n\n[SAU.GetName] es más probable que se alíe con nosotros si\n §G-Ambos seguimos la misma Perspectiva\n -La Familia Saudí está en el poder y seguimos la Perspectiva Occidental\n -Somos sunitas y no chiítas\n -Nos hemos retirado del Líbano§!\n\n[SAU.GetName] es menos probable que se alíe con nosotros si\n §R-Fahd ya no es el Rey\n -Hemos intentado asesinar al Primer Ministro libanés\n -Hemos completado el enfoque 'Apoyar a Hezbolá'\n -Tienen una mala opinión de nosotros\n§!"
 TT_SYR_ALIGN_IRAN: "\nLa disposición de [PER.GetName] para aliarse con nosotros es §Gfuerte§! por defecto\n\n[PER.GetName] es menos probable que se alíe con nosotros si\n §R-No seguimos la misma Perspectiva\n -Somos sunitas\n -Hemos completado el enfoque 'Resistir a Hezbolá'\n -Controlamos el Líbano\n§!"
 TT_SYR_ALIGN_RUSSIA: "\nLa disposición de [SOV.GetName] para aliarse con nosotros es §Gfuerte§! por defecto\n\n[SOV.GetName] es menos probable que se alíe con nosotros si\n §R-No seguimos la misma Perspectiva\n -Estamos en guerra\n§!"
