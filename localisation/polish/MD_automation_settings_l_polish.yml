l_polish:
 AUTOMATION_SETTINGS_OPEN_TT: "Otwórz ustawienia automatyzacji"
 AUTOMATION_SETTINGS_TITLE: "Ustawienia automatyzacji"
 AUTOMATION_SETTINGS_DESC: "Zarządzaj akcjami cyklicznymi i preferencjami powiadomień z jednego panelu. Dotychczasowe opcje sterowania w innych miejscach pozostają dostępne."
 AUTOMATION_SETTINGS_GENERAL_PAGE: "Ogólne"
 AUTOMATION_SETTINGS_SPACE_PAGE: "Satelity"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "Wpływ"
 AUTOMATION_SETTINGS_SPACE_DESC: "Skonfiguruj automatyczną produkcję i wynoszenie satelitów oraz aktualizacje konstelacji."
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "Skonfiguruj cykliczne działania chroniące nasz rząd przed zagranicznymi wpływami."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "Zapisz manifest ładunku przygotowany w ramach programu kosmicznego jako plan §Y niestandardo §!wy i przełącz się na niego.\n\n§Y Wymagania wstępne: §!\n[!automation_space_save_button_click_enabled]"
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "Zmodernizuj każdą konstelację do najnowszej opracowanej generacji wszędzie tam, gdzie pozwala na to bieżące pokrycie orbitalne.\n\n§Y Wymagania wstępne: §!\n[!automation_space_upgrade_button_click_enabled]"
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "Powiadomienia i preferencje"
 AUTOMATION_SETTINGS_UN_HEADER: "Organizacja Narodów Zjednoczonych"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "Dyplomacja"
 AUTOMATION_SETTINGS_NATO_HEADER: "NATO"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "Energia"
 AUTOMATION_SETTINGS_PP_RESERVE: "Rezerwa Siły Politycznej"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "Zautomatyzowane działania wymagające wydania Punktów Władzy Politycznej będą wstrzymywane do momentu, gdy będzie można pokryć ich koszt bez obniżania zasobów poniżej tego poziomu rezerwy. Działania wykonywane ręcznie nie podlegają temu ograniczeniu.\n\n£click_left §Y L Click §!: Dostosuj o §Y 1§!\n£key_ctrl  + £click_left  §Y Ctrl L Click §!: Dostosuj do §Y 10 §!\n £key_shift + £click_left  §Y Shift L Click §!: Dostosuj do §Y 100 §!"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left  §Y L Click§!: Wzrost o §Y 1 §!\n£key_ctrl  + £click_left §Y Ctrl L Click §!: Wzrost o §Y 10 §!\n£key_shift  + £click_left §Y Shift L Click§!: Wzrost o §Y 100 §!"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left  §Y L Click§!: Zmniejszenie o §Y 1 §!\n£key_ctrl  + £click_left §Y Ctrl L Click §!: Zmniejszenie o §Y 10 §!\n£key_shift  + £click_left §Y Shift L Click§!: Zmniejszenie o §Y 100 §!"
 AUTOMATION_SETTINGS_CORRUPTION: "Automatyczne odrzucanie ofert korupcyjnych"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "Automatycznie pomijaj oferty korupcji. Gdy ta opcja jest włączona, wydarzenia i związane z nimi potencjalne nagrody nie będą się pojawiać."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "Powiadomienia o wyborach zagranicznych"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "Wyświetlaj powiadomienia o wiadomościach dotyczących wyborów w innych krajach."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "Powiadomienia o rajdach o wpływy"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "Wyświetlaj wydarzenia dotyczące rajdów mających na celu wywieranie wpływu między innymi państwami. Rajdy wymierzone w nas będą nadal zgłaszane, nawet jeśli ta opcja zostanie wyłączona."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "Miesięczny raport dotyczący automatycznego wpływu"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "Wyświetl comiesięczny raport z listą krajów objętych automatycznym wpływem."
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "Automatycznie akceptuj oferty inwestycyjne"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "Automatycznie akceptuj każdą przychodzącą ofertę inwestycji zagranicznej. Włączenie tej opcji wyłącza automatyczne odrzucanie."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "Automatyczne odrzucanie ofert inwestycyjnych"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "Automatycznie odrzucaj każdą przychodzącą ofertę inwestycji zagranicznej. Włączenie tej opcji wyłącza automatyczną akceptację."
 AUTOMATION_SETTINGS_REINVESTMENT: "Reinwestycja inwestycji zagranicznych"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "Zdecyduj, w jaki sposób cotygodniowe zwroty z inwestycji międzynarodowych będą dzielone między skarb a reinwestycję."
 AUTOMATION_SETTINGS_REINVEST_OFF: "Wyłączone"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "Przekaż wszystkie zwroty z inwestycji zagranicznych do skarbu państwa."
 AUTOMATION_SETTINGS_REINVEST_FULL: "Pełny"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "Reinwestuj wszystkie zyski z inwestycji zagranicznych."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "Podział"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "Przekaż połowę zysków z inwestycji zagranicznych do skarbu państwa, a drugą połowę zainwestuj ponownie."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "Automatyczny zakup paliwa"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "Kup paliwo natychmiast, a następnie sprawdzaj stan co 28 dni i dokonuj kolejnego zakupu, gdy zapasy paliwa spadną poniżej 20 procent. Wyłącz tę opcję, aby anulować przyszłe zakupy."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "Powtórz wybrane inwestycje wewnętrzne"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "Gdy funkcja jest aktywna, kosztuje £pol_power  §R 0,15 §! punktu władzy politycznej dziennie. Kliknij prawym przyciskiem myszy przyciski inwestycji wewnętrznych w widoku stanu, aby wybrać stan oraz rodzaje inwestycji do powtarzania. Wybrane inwestycje są weryfikowane co tydzień i realizowane, o ile dostępny jest wolny slot, skarbiec może pokryć bieżący koszt, a rezerwa władzy politycznej pozostaje zachowana."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "Automatyczne zaopatrywanie stacji antarktycznej"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "Paliwo dla naszej stacji antarktycznej jest zamawiane automatycznie, gdy pozostały zapas wystarcza na 15 lub mniej dni (w okresie od listopada do marca) bądź na 30 lub mniej dni (od kwietnia do października). Koszt dostawy wynosi §R 0,25 mld $ za każde 1000 jednostek paliwa§!; w okresie antarktycznej zimy stawka ta ulega podwojeniu. Realizacja zamówień następuje dopiero wtedy, gdy w skarbcu dostępne są środki na pokrycie pełnego kosztu."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "Zasada automatycznego zużycia"
 AUTOMATION_SETTINGS_SC_VOTE: "Domyślne głosowanie Rady Bezpieczeństwa"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "Wybierz sposób automatycznego głosowania nad rezolucjami Rady Bezpieczeństwa. Kliknij ponownie wybraną opcję, aby powrócić do głosowania ręcznego."
 AUTOMATION_SETTINGS_GA_VOTE: "Domyślne głosowanie Zgromadzenia Ogólnego"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "Wybierz sposób automatycznego głosowania nad rezolucjami Zgromadzenia Ogólnego. Kliknij ponownie wybraną opcję, aby powrócić do głosowania ręcznego."
 AUTOMATION_SETTINGS_VOTE_YES: "Tak"
 AUTOMATION_SETTINGS_VOTE_NO: "Nie"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "Wstrzymać się"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "Automatycznie głosuj „za” każdą rezolucją Rady Bezpieczeństwa."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "Automatycznie głosuj przeciwko każdej rezolucji Rady Bezpieczeństwa. Stali członkowie zgłoszą weto, gdy będzie to stosowne."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "Automatycznie wstrzymuj się od głosu w przypadku każdej rezolucji Rady Bezpieczeństwa."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "Automatycznie głosuj „za” każdą rezolucją Zgromadzenia Ogólnego."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "Automatycznie głosuj przeciwko każdej rezolucji Zgromadzenia Ogólnego."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "Automatycznie wstrzymuj się od głosu w przypadku każdej rezolucji Zgromadzenia Ogólnego."
 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "Zablokuj oferty dostępu do satelity AI"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "Uniemożliwienie państwom sterowanym przez SI oferowania dostępu do swoich wojskowych i cywilnych systemów satelitarnych. Gracze mogą nadal składać takie oferty."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "Automatyczna ratyfikacja przystąpienia do NATO"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "Automatycznie wydawaj §Y 20 §! £pol_power na ratyfikację każdego kandydata do przystąpienia do NATO. Proces ratyfikacji zostaje wstrzymany do momentu, gdy możliwe będzie utrzymanie wymaganych zasobów władzy politycznej."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "Obrona przed wpływem"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "Automatyczne zwalczanie zagranicznych wpływów"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "Płacenie £pol_power §R 0,05 §! Siły Politycznej dziennie gdy funkcja jest aktywna. Gdy funkcja jest nieaktywna, automatycznie wydaj  §Y 100 §! £pol_power aby zwiększyć niezależność wewnętrzną o §G 2,5% §!. Powtarza się po 100 dniach. Automatyzacja zostaje wstrzymana na czas lobbowania rządu lub gdy którykolwiek z kosztów spowodowałby spadek Władzy Politycznej poniżej poziomu rezerwy."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "Automatycznie atakuj Zagraniczne wpływy"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "Płacenie §R0,05 §! £pol_power Siły Politycznej dziennie gdy funkcja jest aktywna. Automatycznie wydaj §Y 125 §! £pol_power aby rozpocząć 60-dniową kampanię przeciwko najsilniejszemu kwalifikującemu się zagranicznemu wpływowi. W danym momencie aktywna jest tylko jedna kampania. Cele niekwalifikujące się, objęte lobbingiem lub znajdujące się w okresie karencji są pomijane. Automatyzacja zostaje wstrzymana, jeśli koszt operacji miałby obniżyć poziom Władzy Politycznej poniżej wartości rezerwowej."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "Każda włączona opcja kosztuje §R 0,05 §! £pol_power dziennie. Łączny koszt obu opcji wynosi §R 0.10 §! £pol_power dziennie."
 AUTOMATION_SETTINGS_ECONOMY_PAGE: "Ekonomia"
 AUTOMATION_SETTINGS_ECONOMY_DESC: "Wybierz, którymi podatkami, wydatkami publicznymi, inwestycjami i zakupami energii chcesz zarządzać automatycznie. Najedź kursorem na nagłówek lub opcję, aby wyświetlić szczegóły."
 AUTOMATION_SETTINGS_TAX_HEADER: "Stawki podatkowe"
 AUTOMATION_SETTINGS_BUDGET_HEADER: "Przepisy budżetowe"
 AUTOMATION_SETTINGS_TAX_SUMMARY: "Stawki podatków objętych mechanizmem zmieniają się o co najwyżej jeden punkt procentowy tygodniowo w zależności od salda budżetowego, zadłużenia oraz stabilności.\n\nRęczne zmiany pozostawiają automatyzację włączoną."
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "Włączone budżety przesuwają się o jeden poziom w kierunku oczekiwanych wydatków. Maksymalnie jeden budżet ulega zmianie tygodniowo, z rotacyjnym priorytetem. Zwiększenia wymagają nadwyżki budżetowej. Ręczne zmiany w prawie pozostawiają włączoną automatyzację."
 AUTOMATION_SETTINGS_POPULATION_TAX: "Podatek od osób fizycznych: [?population_tax_rate|0]%"
 AUTOMATION_SETTINGS_CORPORATE_TAX: "Podatek od osób prawnych: [?corporate_tax_rate|0]%"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "Automatycznie dostosowuje podatek od ludności o jeden punkt procentowy tygodniowo, uwzględniając bilans budżetowy, zadłużenie oraz stabilność. Mechanizm uwzględnia ograniczenia dotyczące zmian stawek podatkowych i – po wyczerpaniu rezerwy – wiąże się z normalnym kosztem w postaci punktów władzy politycznej. Ręczna zmiana podatków nie wyłącza tej opcji."
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "Automatycznie dostosowuje podatek od przedsiębiorstw o ​​jeden punkt procentowy tygodniowo, uwzględniając saldo budżetu, zadłużenie oraz dostępne fabryki cywilne. Mechanizm uwzględnia ograniczenia dotyczące zmian stawek podatkowych i wymaga poniesienia standardowego kosztu w punktach władzy politycznej (powyżej poziomu rezerwy). Ręczna zmiana podatków nie wyłącza tej opcji."
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY: "Administracja: [?bureau_law|0] / [?expected_adm_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT: "Automatycznie dostosowuj poziom administracji do poziomu oczekiwanego, zmieniając go stopniowo (o jeden poziom na raz). Liczby wskazują poziomy bieżące i oczekiwane. Obowiązują standardowe ograniczenia wynikające z prawa oraz koszty w punktach władzy politycznej. Zwiększanie poziomu wymaga nadwyżki budżetowej i zostaje wstrzymane w obliczu groźby bankructwa. Rezerwa władzy politycznej pozostaje nienaruszona. Ręczne zmiany prawa nie wyłączają tej opcji."
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING: "Wydatki na policje: [?police_law|0] / [?expected_police_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING_TT: "Automatycznie przesuń wydatki na policję w kierunku oczekiwanego poziomu, poziom po poziomie. Liczby pokazują poziom bieżący i oczekiwany. Obowiązują standardowe ograniczenia prawne i koszty władzy politycznej. Podwyżki wymagają nadwyżki i wstrzymania w przypadku zbliżającego się bankructwa. Rezerwa władzy politycznej jest zachowana. Ręczne zmiany prawa pozostawiają tę opcję włączoną."
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET: "Edukacja: [?education_law|0] / [?expected_edu_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET_TT: "Automatycznie przesuń wydatki na edukację w kierunku oczekiwanego poziomu, poziom po poziomie. Liczby pokazują poziom bieżący i oczekiwany. Obowiązują standardowe ograniczenia prawne i koszty władzy politycznej. Podwyżki wymagają nadwyżki i wstrzymania w przypadku zbliżającego się bankructwa. Rezerwa władzy politycznej jest zachowana. Ręczne zmiany prawa pozostawiają tę opcję włączoną."
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET: "Ochrona zdrowia [?health_law|0]/[?expected_health_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET_TT: "Automatycznie dostosowuj poziom wydatków na opiekę zdrowotną do poziomu docelowego, zmieniając go stopniowo. Liczby wskazują poziomy bieżący i docelowy. Obowiązują standardowe ograniczenia prawne oraz koszty w postaci punktów władzy politycznej. Zwiększanie wydatków wymaga nadwyżki budżetowej i zostaje wstrzymane w obliczu groźby bankructwa. Rezerwa władzy politycznej pozostaje nienaruszona. Ręczne zmiany przepisów nie wyłączają tej opcji."
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET: "Socjal [?social_law|0]/[?expected_welfare_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET_TT: "Automatycznie przesuń wydatki socjalne w kierunku oczekiwanego poziomu, poziom po poziomie. Liczby pokazują poziom bieżący i oczekiwany. Obowiązują standardowe ograniczenia prawne i koszty władzy politycznej. Podwyżki wymagają nadwyżki i wstrzymania w przypadku zbliżającego się bankructwa. Rezerwa władzy politycznej jest zachowana. Ręczne zmiany prawa pozostawiają tę opcję włączoną."
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING: "Wydatki Militarne [?military_law|0]/[?expected_military_sp|0]"
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING_TT: "Automatycznie przesuń wydatki wojskowe w kierunku oczekiwanego poziomu wydatków, poziom po poziomie. Liczby pokazują poziom bieżący i oczekiwany. Obowiązują standardowe ograniczenia prawne i koszty siły politycznej. Wzrosty wymagają nadwyżki i wstrzymania w przypadku zbliżającego się bankructwa. Rezerwa siły politycznej jest zachowana. Ręczne zmiany prawa pozostawiają tę opcję włączoną."
 AUTOMATION_SETTINGS_GENERAL_PAGE_TT: "Skonfiguruj ogólne funkcje automatyzacji, takie jak akcje dotyczące Zjednoczonych Narodów, preferencje powiadomień oraz inne drobne działania automatyczne."
 AUTOMATION_SETTINGS_SPACE_PAGE_TT: "Skonfiguruj automatyczną produkcję i wynoszenie satelitów oraz aktualizacje konstelacji.\n\n§Y Wymagania wstępne: §!\n[!automation_settings_space_page_button_click_enabled]"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE_TT: "Skonfiguruj automatyzację wpływów, taką jak obrona i atak w zakresie wpływów."
 AUTOMATION_SETTINGS_ECONOMY_PAGE_TT: "Skonfiguruj automatyzację gospodarki, taką jak stawki podatkowe, przepisy budżetowe, inwestycje i energetyka."
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT: "Blokowanie ofert dotyczących paliwa jądrowego dla SI"
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT_TT: "Uniemożliwia państwom sterowanym przez SI wysyłanie do danego państwa próśb o zakup §Y Paliwa Jądrowego§!. Gracze wciąż mogą przesyłać takie oferty."
 AUTOMATION_SETTINGS_INVESTMENT_HEADER: "Inwestycje"