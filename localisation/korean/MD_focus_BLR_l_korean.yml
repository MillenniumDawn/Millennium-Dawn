 BLR_azot_fertilizers_idea: "화학 비료 사용"
 BLR_azot_fertilizers_idea_desc: "화학 비료는 풍작을 위해 필수적이며, 특히 어려운 기후에서는 더욱 그러합니다."
 BLR_azot_fertilizers_income: "그로노 아조트의 비료"
 BLR_azot_fertilizers_income_desc: "그로드노 아조트는 전 세계 많은 나라에 제품을 성공적으로 판매하고 있으며, 이 판매를 통해 우리나라에 상당한 수입을 가져다줍니다."
