 SAU_pipeline_transit_YEM_t3_desc: "Saudi oil crosses Yemen, and the transit fees swell the treasury. The pipeline lifts the nation's oil output. §GAdditional Income: $1.25B§!"
 SAU_red_gulf_planning: "Operation Red Gulf"
 SAU_red_gulf_planning_desc: "A detailed strike plan against Iran has been prepared, rehearsed, and distributed to the relevant commands."
 SAU_red_sea_command: "Red Sea Naval Command"
 SAU_red_sea_command_desc: "Years of joint exercises have welded Saudi and Egyptian crews into a single Red Sea fighting force. Improves naval morale."
 SAU_red_sea_riviera: "The Red Sea Riviera"
 SAU_red_sea_riviera_desc: "Large resorts along the Red Sea coast attract foreign tourists and provide additional non-oil revenue."
 SAU_renewable_energy_initiative: "Renewable Energy Initiative"
 SAU_renewable_energy_initiative_desc: "Solar farms and wind installations across the Kingdom's vast deserts are beginning to reduce domestic energy consumption of crude oil, freeing up more barrels for export."
 SAU_rep_shia_eco_autonomy: "Provincial Prosperity"
 SAU_rep_shia_eco_autonomy_loc: "[SAU.GetFlag]Provincial Prosperity\n§HFactory Efficiency:§! §G+5.00%§!\n§HConsumer Goods:§! §G-5.00%§!\n\n"
 SAU_rep_shia_eco_trade: "An Open Economy"
 SAU_rep_shia_eco_trade_loc: "[SAU.GetFlag]An Open Economy\n§HTrade Opinion:§! §G+15.00%§!\n§HForeign Investment Cost:§! §G-5.00%§!\n\n"
 SAU_rep_shia_eco_welfare: "The Welfare State"
 SAU_rep_shia_eco_welfare_loc: "[SAU.GetFlag]The Welfare State\n§HStability:§! §G+5.00%§!\n§HConsumer Goods:§! §G-5.00%§!\n\n"
 SAU_rep_shia_mil_brigades: "The Hezbollah Brigades"
 SAU_rep_shia_mil_brigades_loc: "[SAU.GetFlag]The Hezbollah Brigades\n§HArmy Organization:§! §G+5.00%§!\n§HDivision Attack:§! §G+5.00%§!\n\n"
 SAU_rep_shia_mil_resistance: "The Armed Resistance"
 SAU_rep_shia_mil_resistance_loc: "[SAU.GetFlag]The Armed Resistance\n§HDivision Recovery Rate:§! §G+5.00%§!\n§HWar Support:§! §G+5.00%§!\n\n"
 SAU_rep_shia_mil_revstate: "A Revolutionary Army"
 SAU_rep_shia_mil_revstate_loc: "[SAU.GetFlag]A Revolutionary Army\n§HArmy Experience Gain:§! §G+10.00%§!\n§HDivision Recovery Rate:§! §G+5.00%§!\n\n"
 SAU_rep_shia_mil_vanguard: "The Revolutionary Vanguard"
 SAU_rep_shia_mil_vanguard_loc: "[SAU.GetFlag]The Revolutionary Vanguard\n§HDivision Recovery Rate:§! §G+5.00%§!\n§HDivision Defense:§! §G+5.00%§!\n\n"
 SAU_research_modifery_01: "§HDiversification§! - Research & Development"
 SAU_research_modifery_01_desc: "Targeted funding for universities and research institutes is accelerating the Kingdom's drive to build a knowledge economy beyond oil."
 SAU_research_modifery_02: "§HDiversification§! - World-Class Research"
 SAU_research_modifery_02_desc: "Flagship institutions like KAUST have made Saudi Arabia a rising regional center for science and innovation, drawing talent from across the world."
 SAU_research_modifier_01: "Awakening Minds"
 SAU_research_modifier_01_desc: "Basic literacy programs are expanding the number of Saudis able to enter formal education."
 SAU_research_modifier_02: "A Reading Nation"
 SAU_research_modifier_02_desc: "Rising literacy has created a larger reading public and increased demand for schools and educational materials."
 SAU_research_modifier_03: "Expanding Education"
 SAU_research_modifier_03_desc: "Expanded schools and enrollment are giving more Saudis access to primary and secondary education."
 SAU_research_modifier_04: "Foundations of Learning"
 SAU_research_modifier_04_desc: "The Kingdom has established the institutions and trained staff needed for a broader national education system."
 SAU_research_modifier_06: "Cultivating Intellect"
 SAU_research_modifier_06_desc: "Universities and research institutions are producing a larger pool of highly educated Saudi specialists."
 SAU_royal_ulema_alliance_content: "§HRoyal-Ulema Alliance§!"
 SAU_royal_ulema_alliance_content_desc: "The §LUlema§! and the §HHouse of al Saud§! cooperate productively. Routine fatwas favour the throne; routine policies respect the clergy. Neither side has cause for complaint."
 SAU_royal_ulema_alliance_high: "§HRoyal-Ulema Alliance§!"
 SAU_royal_ulema_alliance_high_desc: "The §LCouncil of Senior Scholars§! strongly supports the throne, and the religious establishment presents royal policy as legitimate. This close alignment substantially strengthens the dynasty."
 SAU_royal_ulema_alliance_neutral: "§HRoyal-Ulema Alliance§!"
 SAU_royal_ulema_alliance_neutral_desc: "The throne and clergy maintain a §Yformal but limited§! relationship. Neither side actively supports or obstructs the other, so the balance of power provides no bonus or penalty."
 SAU_royal_ulema_alliance_neutral_tt: "§YThrone-Ulema relationship is balanced - no bonus or penalty.§! \n§Ybalance of power change = 0.00§!"
 SAU_royal_ulema_alliance_strained: "§RRoyal-Ulema Strain§!"
 SAU_royal_ulema_alliance_strained_desc: "Members of the §LUlema§! are privately criticizing the throne and using sermons to question government reform. This opposition reduces the dynasty's religious legitimacy."
 SAU_sabic_01: "SABIC"
 SAU_sabic_01_desc: "The Saudi Basic Industries Corporation is a major petrochemical manufacturer. While still growing, SABIC contributes to industrial diversification and provides employment beyond the oil sector."
 SAU_sabic_02: "SABIC - Expanded Operations"
 SAU_sabic_02_desc: "SABIC has grown its product portfolio and manufacturing capacity. Advanced materials and specialty chemicals now supplement its petrochemical base, strengthening the Kingdom's industrial output."
 SAU_sabic_03: "SABIC - Global Industrial Champion"
 SAU_sabic_03_desc: "With international acquisitions and a diversified product line, SABIC has become one of the world's leading chemical companies. Its success demonstrates that Saudi industry can compete globally beyond oil."
 SAU_sabic_agrinutrients: "§HSABIC§! - Agri-Nutrients & Specialty Chemicals"
 SAU_sabic_agrinutrients_desc: "SABIC Agri-Nutrients turns Saudi gas into urea and ammonia, feeding farms across Asia and Africa and making the Kingdom a fertilizer power."
 SAU_sabic_foreign_jv: "§HSABIC§! - Foreign Joint Ventures"
 SAU_sabic_foreign_jv_desc: "Joint ventures with Shell, ExxonMobil, and Mitsubishi brought world-class technology into SABIC's plants while keeping the profits anchored in the Kingdom."
 SAU_sabic_ge_plastics: "§HSABIC§! - GE Plastics Acquisition"
 SAU_sabic_ge_plastics_desc: "The 2007 acquisition of GE Plastics for over eleven billion dollars vaulted SABIC into the front rank of global engineered-plastics producers overnight."
 SAU_sabic_global_champion: "§HSABIC§! - Global Chemical Champion"
 SAU_sabic_global_champion_desc: "SABIC ranks among the largest chemical companies on Earth, the proof that Saudi industry can compete far beyond the oil barrel."
 SAU_sabic_hadeed: "§HSABIC§! - HADEED Steel Complex"
 SAU_sabic_hadeed_desc: "Hadeed, SABIC's steel arm at Jubail, feeds Saudi construction with millions of tons of rebar and flat steel that once had to be imported."
 SAU_sabic_ibn_affiliates: "§HSABIC§! - The Ibn Affiliates"
 SAU_sabic_ibn_affiliates_desc: "The Ibn Sina, Ibn Zahr, and Ibn Rushd affiliates spread SABIC's petrochemical output across plastics, methanol, and fibers."
 SAU_sabic_jubail_yanbu: "§HSABIC§! - Jubail & Yanbu Industrial Cities"
 SAU_sabic_jubail_yanbu_desc: "The royal commission cities of Jubail and Yanbu turned empty coastline into two of the world's largest industrial complexes, the foundation of Saudi heavy industry."
 SAU_sabic_rnd: "§HSABIC§! - Home-Grown Technology"
 SAU_sabic_rnd_desc: "SABIC's research centers in Riyadh, Bangalore, and Geleen keep its catalysts and polymers at the technological frontier."
 SAU_sagia_initiative: "§HSAGIA Initiative§!"
 SAU_sagia_initiative_02: "§HSAGIA - Investment Reforms§!"
 SAU_sagia_initiative_02_desc: "§LSAGIA§! has loosened ownership restrictions and reduced licensing delays. These reforms are attracting more foreign businesses and making the Saudi market easier to enter."
 SAU_sagia_initiative_03: "§HSAGIA - Foreign Capital Hub§!"
 SAU_sagia_initiative_03_desc: "Saudi Arabia has opened §Hstrategic sectors§!, introduced §Htax incentives§!, and developed §Heconomic cities§! along its coasts. These policies have made the Kingdom a major regional destination for foreign direct investment."
 SAU_sagia_initiative_04: "§GSAGIA - Investment Powerhouse§!"
 SAU_sagia_initiative_04_desc: "Saudi Arabia now combines a §Hdiversified economy§! with an §Hopen investment market§!. The completed SAGIA reforms attract substantial foreign capital and skilled workers."
 SAU_sagia_initiative_desc: "Established by royal decree in §YApril 2000§!, the §LSaudi Arabian General Investment Authority§! is the Kingdom's first agency dedicated to attracting foreign investment. It is responsible for simplifying business law, providing investors with a §Hsingle point of contact§!, and improving access to the Saudi market."
 SAU_salman_health_critical: "§HThe King's Health§! - §RCritical§!"
 SAU_salman_health_critical_desc: "The King no longer travels and frequently misses Council meetings. The palace provides little information, leading senior figures to prepare for a succession."
 SAU_salman_health_declining: "§HThe King's Health§! - §YDeclining§!"
 SAU_salman_health_declining_desc: "The King is shortening or canceling more official audiences, although the palace has not announced a serious illness. His reduced schedule is beginning to affect government business."
 SAU_salman_health_near_death: "§HThe King's Health§! - §RNear Death§!"
 SAU_salman_health_near_death_desc: "The King is near death and has effectively transferred governance to his successors. Political activity is now dominated by preparations for the succession."
 SAU_salman_health_serious: "§HThe King's Health§! - §YSerious§!"
 SAU_salman_health_serious_desc: "The King makes few public appearances, and ministers increasingly receive instructions through the Royal Court rather than from him directly."
 SAU_salman_health_stable: "§HThe King's Health§! - §GStable§!"
 SAU_salman_health_stable_desc: "The King maintains a full official schedule, receives ambassadors, chairs the Council of Ministers, and reviews government papers. His continued participation keeps the court and ministries orderly."
 SAU_shura_led_notables: "Council of the Notables"
 SAU_shura_led_notables_desc: "Tribal leaders and major merchant families dominate the Shura Council through informal agreements made before formal votes. This arrangement is representative of established Saudi power structures but slows decision-making."
 SAU_shura_led_technocrats: "Council of the Ministries"
 SAU_shura_led_technocrats_desc: "Technocrats have made the Shura Council more effective at reviewing budgets and government policy. Its members are highly competent but poorly represent communities outside Riyadh."
 SAU_shura_led_ulema: "Council of the Ulema"
 SAU_shura_led_ulema_desc: "Religious scholars control the Shura Council and prevent proposals opposed by the religious establishment from reaching the King."
 SAU_sp_abrams_combined: "Armor: Combined Arms"
 SAU_sp_abrams_combined_desc: "Tanks, infantry and artillery fighting as one balanced team.\n§G+5%§! Division Attack\n§G+5%§! Division Defence\n§G+5%§! Division Organisation\n§R+10%§! Army Training Time"
 SAU_sp_abrams_defensive: "Armor: Defensive Wall"
 SAU_sp_abrams_defensive_desc: "Dug-in armour as an immovable shield for the Kingdom.\n§G+10%§! Division Defence\n§G+10%§! Entrenchment Speed\n§R-10%§! Division Speed"
 SAU_sp_abrams_shock: "Armor: Shock & Breakthrough"
 SAU_sp_abrams_shock_desc: "Fast, hard-hitting armoured thrusts to shatter the enemy line.\n§G+10%§! Core Territory Attack\n§G+5%§! Division Speed\n§R-5%§! Division Organisation"
 SAU_sp_apache_antiarmor: "Army Aviation: Tank-Killers"
 SAU_sp_apache_antiarmor_desc: "Hellfire-armed hunters to gut an armoured advance.\n§G+7.5%§! Core Territory Attack\n§G+5%§! Division Attack\n§R-5%§! Air Experience Gain"
 SAU_sp_apache_closeair: "Army Aviation: Close Support"
 SAU_sp_apache_closeair_desc: "Gunships overhead to steady and protect the ground troops.\n§G+5%§! Division Organisation\n§G+5%§! Division Recovery Rate\n§R+10%§! Air Accidents"
 SAU_sp_apache_recon: "Army Aviation: Recon & Raids"
 SAU_sp_apache_recon_desc: "Eyes forward and lightning raids deep behind the line.\n§G+7.5%§! Division Speed\n§G+5%§! Planning Speed\n§R-5%§! Division Defence"
 SAU_sp_arty_mass: "Artillery: Massed Fires"
 SAU_sp_arty_mass_desc: "Overwhelming barrages to pulverise the enemy, supply be damned.\n§G+10%§! Core Territory Attack\n§R+10%§! Supply Consumption"
 SAU_sp_arty_mobile: "Artillery: Shoot-and-Scoot"
 SAU_sp_arty_mobile_desc: "Fire and displace before the enemy can reply.\n§G+5%§! Division Speed\n§G+5%§! Division Organisation\n§R-5%§! Division Defence"
 SAU_sp_arty_precision: "Artillery: Precision Fires"
 SAU_sp_arty_precision_desc: "Fewer, smarter rounds on exactly the right target.\n§G+7.5%§! Division Attack\n§G+5%§! Army Experience Gain\n§R+5%§! Consumer Goods Use"
 SAU_sp_awacs_control: "AWACS: Air Battle Control"
 SAU_sp_awacs_control_desc: "Controllers stitch every fighter into one killing web.\n§G+10%§! Air Superiority\n§G+5%§! Air Experience Gain\n§R+3%§! Consumer Goods Use"
 SAU_sp_awacs_earlywarn: "AWACS: Early Warning Net"
 SAU_sp_awacs_earlywarn_desc: "No raid crosses the border unseen.\n§G+10%§! Air Defence\n§R-5%§! Air Attack"
 SAU_sp_awacs_groundlink: "AWACS: Joint Ground Link"
 SAU_sp_awacs_groundlink_desc: "The picture from above guides the army below.\n§G+5%§! Division Attack\n§G+5%§! Planning Speed\n§R-5%§! Air Experience Gain"
 SAU_sp_combat_armor: "Combat Arms: Armored Fist"
 SAU_sp_combat_armor_desc: "A mailed fist of armour as the spearhead.\n§G+7.5%§! Core Territory Attack\n§G+5%§! Division Speed\n§R+5%§! Supply Consumption"
 SAU_sp_combat_firepower: "Combat Arms: Firepower"
 SAU_sp_combat_firepower_desc: "Crush the enemy with sheer weight of fire.\n§G+7.5%§! Division Attack\n§R-5%§! Division Speed"
 SAU_sp_combat_infantry: "Combat Arms: Professional Infantry"
 SAU_sp_combat_infantry_desc: "Skilled, steady professional infantry hold the field.\n§G+7.5%§! Division Defence\n§G+5%§! Division Organisation\n§R-5%§! Core Territory Attack"
 SAU_sp_fleet_bluewater: "Navy: Blue-Water Ambition"
 SAU_sp_fleet_bluewater_desc: "Reach out beyond the Gulf into the open ocean.\n§G+15%§! Naval Range\n§G+5%§! Capital Ship Attack\n§R-5%§! Naval Morale"
 SAU_sp_fleet_coastal: "Navy: Coastal Defence"
 SAU_sp_fleet_coastal_desc: "A wall of small craft guarding every harbour and reef.\n§G+5%§! Naval Morale\n§G+10%§! Screen Defence\n§R-5%§! Capital Ship Attack"
 SAU_sp_fleet_gulf: "Navy: Gulf Sea Control"
 SAU_sp_fleet_gulf_desc: "Dominate the close, crowded waters of the Arabian Gulf.\n§G+10%§! Screen Attack\n§G+5%§! Naval Coordination\n§R-10%§! Naval Range"
 SAU_sp_pgm_interdiction: "PGM: Battlefield Interdiction"
 SAU_sp_pgm_interdiction_desc: "Cut the enemy off from the rear before he can fight.\n§G+5%§! Division Organisation\n§G+5%§! Close Air Support Attack\n§R+10%§! Air Doctrine Cost"
 SAU_sp_pgm_sead: "PGM: Defence Suppression"
 SAU_sp_pgm_sead_desc: "Blind and break the enemy air-defence network first.\n§G+7.5%§! Air Superiority\n§G+5%§! Air Attack\n§R-5%§! Air Agility"
 SAU_sp_pgm_strike: "PGM: Precision Strike"
 SAU_sp_pgm_strike_desc: "Smart bombs that flatten the target and spare the rest.\n§G+10%§! Close Air Support Attack\n§G+5%§! Air Attack\n§R+5%§! Consumer Goods Use"
 SAU_sp_posture_deterrence: "Posture: Strategic Deterrence"
 SAU_sp_posture_deterrence_desc: "A balanced shield that makes any aggressor think twice.\n§G+5%§! Division Defence\n§G+5%§! Air Defence\n§G+5%§! Stability\n§R-5%§! Division Attack"
 SAU_sp_posture_homeland: "Posture: Homeland Defence"
 SAU_sp_posture_homeland_desc: "Everything turned inward to make the Kingdom a fortress.\n§G+10%§! Core Territory Defence\n§G+5%§! Max Entrenchment\n§R-5%§! Division Speed"
 SAU_sp_posture_projection: "Posture: Power Projection"
 SAU_sp_posture_projection_desc: "A military that can reach out and strike far from home.\n§G+5%§! Division Speed\n§G+10%§! Naval Range\n§G+5%§! Air Attack\n§R+5%§! Consumer Goods Use"
 SAU_sp_redflag_bvr: "Air: Beyond Visual Range"
 SAU_sp_redflag_bvr_desc: "Kill from far away before the enemy ever sees you.\n§G+7.5%§! Air Attack\n§G+5%§! Air Superiority\n§R+10%§! Air Doctrine Cost"
 SAU_sp_redflag_defensive: "Air: Air Defence Doctrine"
 SAU_sp_redflag_defensive_desc: "Survive, endure and protect the skies over the Kingdom.\n§G+10%§! Air Defence\n§G+5%§! Air Agility\n§R-5%§! Air Attack"
 SAU_sp_redflag_dogfight: "Air: Dogfight Mastery"
 SAU_sp_redflag_dogfight_desc: "Turn and burn - own the close-in fight.\n§G+10%§! Air Agility\n§G+5%§! Air Attack\n§R-5%§! Air Defence"
 SAU_sp_reform_crash: "Reform: Crash Programme"
 SAU_sp_reform_crash_desc: "Reform now, reform fast - and damn the disruption.\n§G+10%§! Army Experience Gain\n§G+5%§! Division Organisation\n§R-5%§! Stability"
 SAU_sp_reform_foreign: "Reform: Foreign Contractors"
 SAU_sp_reform_foreign_desc: "Hire foreign experts to do it quickly and well - for a price.\n§G-15%§! Army Training Time\n§G+5%§! Army Experience Gain\n§R-5%§! Political Power Gain"
 SAU_sp_reform_steady: "Reform: Methodical Build-Up"
 SAU_sp_reform_steady_desc: "Patient, orderly reform that the army can absorb.\n§G+5%§! Division Organisation\n§G+5%§! Division Recovery Rate\n§R-3%§! Division Attack"
 SAU_sp_sang_regime: "National Guard: Regime Guard"
 SAU_sp_sang_regime_desc: "First and last, the SANG shields the throne and the two holy cities.\n§G+10%§! Core Territory Defence\n§G+5%§! Stability\n§R-5%§! Division Attack"
 SAU_sp_sang_security: "National Guard: Internal Security"
 SAU_sp_sang_security_desc: "A watchful guard against subversion and unrest at home.\n§G-25%§! Enemy Subversive Activity\n§G+5%§! Stability\n§R-5%§! War Support"
 SAU_sp_sang_tribal: "National Guard: Tribal Levies"
 SAU_sp_sang_tribal_desc: "Loyal tribal manpower swells the ranks, if not their polish.\n§G+10%§! Recruitable Population\n§G+5%§! Division Recovery Rate\n§R-5%§! Division Organisation"
 SAU_sp_sf_counterterror: "Special Forces: Counter-Terror"
 SAU_sp_sf_counterterror_desc: "A small, lethal force for hostage rescue and counter-terror.\n§G+10%§! Special Forces Attack\n§G+5%§! Special Forces Defence\n§R-3%§! Special Forces Cap"
 SAU_sp_sf_raiders: "Special Forces: Deep Raiders"
 SAU_sp_sf_raiders_desc: "More operators striking deep, at some cost to their durability.\n§G+5%§! Special Forces Cap\n§G+7.5%§! Special Forces Attack\n§R-5%§! Special Forces Defence"
 SAU_sp_sf_recon: "Special Forces: Reconnaissance"
 SAU_sp_sf_recon_desc: "Silent eyes that make the whole army see further.\n§G+5%§! Special Forces Cap\n§G+5%§! Planning Speed\n§R-5%§! Special Forces Attack"
 SAU_spirit_king_in_name: "King in Name, Heir in Uniform"
 SAU_spirit_king_in_name_desc: "The monarchy remains formally intact, while the Crown Prince serves as a military officer under the Council's authority. This compromise avoids an open break between royal and military institutions without fully satisfying either side."
 SAU_spirit_national_service: "The National Service Parades"
 SAU_spirit_national_service_desc: "Twice-yearly military parades on King Fahd Road use armor, school groups, and live broadcasts to build public support for national service. Their staged character has not prevented strong attendance."
 SAU_spirit_officer_housing: "The Officers' Housing Programme"
 SAU_spirit_officer_housing_desc: "The government is rapidly building housing, schools, and clinics for officers and their families. These benefits strengthen the officer corps' loyalty to the regime."
 SAU_spirit_officer_purge: "The Purge of the Officer Corps"
 SAU_spirit_officer_purge_desc: "Officers who hesitated during the takeover have been retired, while those who supported it retain command. The purge has reduced the army's size but made the remaining officer corps more obedient."
 SAU_spirit_public_accounts: "The Council's Public Accounts"
 SAU_spirit_public_accounts_desc: "Ministries now publish their spending for the first time in Saudi history. The policy has angered families that benefited from secrecy but is highly popular with the public."
 SAU_spirit_quincy_reaffirmed: "The Quincy Understanding"
 SAU_spirit_quincy_reaffirmed_desc: "The United States and the Council continue the informal oil and security arrangement first established in 1945. American forces protect Gulf shipping while Saudi tankers supply world markets, and both governments prefer to leave the agreement undocumented."
 SAU_spirit_security_directorate: "The Security Directorate"
 SAU_spirit_security_directorate_desc: "The Council has combined Mabahith records, Interior Ministry networks, and military intelligence in a single directorate under one general. Its broad surveillance powers make it effective but widely distrusted."
 SAU_spirit_unbeholden: "The Kingdom Unbeholden"
 SAU_spirit_unbeholden_desc: "Saudi Arabia has rejected foreign security guarantees and garrisons. It now purchases its own air defenses and trains its own officers, gaining independence at a very high financial cost."
 SAU_succession_instability: "§RSuccession Instability§!"
 SAU_succession_instability_desc: "King Fahd has been incapacitated since his stroke in 1995, leaving Crown Prince Abdullah as the de facto ruler. The royal court is divided between Abdullah's supporters and the powerful Sudairi faction, creating an atmosphere of political uncertainty. Until the succession is formally resolved, the Kingdom's decision-making remains paralyzed by factional rivalries."
 SAU_syria_landbridge_severed: "Iran's Land Bridge Severed"
 SAU_syria_landbridge_severed_desc: "A friendly government in Damascus has cut Tehran's overland route to Hezbollah. The strategic victory emboldens the Kingdom and steadies the realm."
 SAU_syria_pipeline_t1: "Levant Pipeline (Tier I)"
 SAU_syria_pipeline_t1_desc: "Saudi oil crosses Jordan and Syria to the Mediterranean, challenging Russian gas at the gates of Europe. §GAdditional Income: up to $1.25B§! from your pipeline network. We pay every country the line crosses a transit fee of $1.25B each (§RAdditional Expense§!). Sabotage drops the line one tier, cutting both; a severed tier 1 line closes the route."
 SAU_syria_pipeline_t2: "Levant Pipeline (Tier II)"
 SAU_syria_pipeline_t2_desc: "Saudi oil crosses Jordan and Syria to the Mediterranean, challenging Russian gas at the gates of Europe. §GAdditional Income: up to $1.25B§! from your pipeline network. We pay every country the line crosses a transit fee of $1.25B each (§RAdditional Expense§!). Sabotage drops the line one tier, cutting both; a severed tier 1 line closes the route."
 SAU_syria_pipeline_t3: "Levant Pipeline (Tier III)"
 SAU_syria_pipeline_t3_desc: "Saudi oil crosses Jordan and Syria to the Mediterranean, challenging Russian gas at the gates of Europe. §GAdditional Income: up to $1.25B§! from your pipeline network. We pay every country the line crosses a transit fee of $1.25B each (§RAdditional Expense§!). Sabotage drops the line one tier, cutting both; a severed tier 1 line closes the route."
 SAU_syrian_quagmire: "The Syrian Quagmire"
 SAU_syrian_quagmire_desc: "Years of support for an unsuccessful war in Syria have reduced both public support and available Treasury funds. The Syrian government remains in power despite the Kingdom's expenditure."
 SAU_tadawul_market: "§GTadawul, the Saudi Stock Exchange LVL 0§!"
 SAU_tadawul_market_desc: "The §LSaudi Stock Exchange§! is in its initial stage, with basic trading and regulatory functions in place. Completing relevant focuses will deepen the market and increase its economic benefits."
 SAU_tadawul_market_t1: "§GTadawul, the Saudi Stock Exchange LVL 1§!"
 SAU_tadawul_market_t10: "§GTadawul, the Saudi Stock Exchange LVL 10§!"
 SAU_tadawul_market_t10_desc: "The reform program is complete, with all planned laws, regulators, and listings in place. §LTadawul§! is now the §Glargest exchange in MENA§!, with a market capitalization greater than the rest of the Arab world's exchanges combined."
 SAU_tadawul_market_t1_desc: "The first stage of Tadawul reform has improved market operations and investor confidence. Further relevant focuses will continue its development."
 SAU_tadawul_market_t2: "§GTadawul, the Saudi Stock Exchange LVL 2§!"
 SAU_tadawul_market_t2_desc: "More firms are listing on Tadawul and trading volumes are rising, increasing office and corporate tax revenue."
 SAU_tadawul_market_t3: "§GTadawul, the Saudi Stock Exchange LVL 3§!"
 SAU_tadawul_market_t3_desc: "Three stages of Tadawul reform have increased the exchange's access to capital and its contribution to state revenue."
 SAU_tadawul_market_t4: "§GTadawul, the Saudi Stock Exchange LVL 4§!"
 SAU_tadawul_market_t4_desc: "Tadawul now finances civilian industry as well as listed companies, while stronger regulation improves investor confidence and stability."
 SAU_tadawul_market_t5: "§GTadawul, the Saudi Stock Exchange LVL 5§!"
 SAU_tadawul_market_t5_desc: "Tadawul has completed half of its reform program, with stronger trading activity, revenue, and investor confidence."
 SAU_tadawul_market_t6: "§GTadawul, the Saudi Stock Exchange LVL 6§!"
 SAU_tadawul_market_t6_desc: "Six stages of reform have broadened Tadawul's role in financing Saudi businesses and attracting investment."
 SAU_tadawul_market_t7: "§GTadawul, the Saudi Stock Exchange LVL 7§!"
 SAU_tadawul_market_t7_desc: "Seven stages of reform have made Tadawul a mature regional exchange with substantial capital under management."
 SAU_tadawul_market_t8: "§GTadawul, the Saudi Stock Exchange LVL 8§!"
 SAU_tadawul_market_t8_desc: "A mature Tadawul channels capital into construction and industry and gives the government greater influence over economic policy."
 SAU_tadawul_market_t9: "§GTadawul, the Saudi Stock Exchange LVL 9§!"
 SAU_tadawul_market_t9_desc: "Tadawul is approaching full development, producing high corporate and industrial tax revenue and playing a larger role in national economic policy."
 SAU_tenth_five_year_plan: "The Tenth Five-Year Plan"
 SAU_tenth_five_year_plan_desc: "The Ministry of Economy and Planning has issued five-year plans since 1970, but many functioned mainly as statements of intent. This plan provides full funding for ports, railways, ring roads, and ministry reforms.\n\n§GLasts five years§!."
 SAU_tourism_sector: "Tourism Sector"
 SAU_tourism_sector_desc: "From the ancient ruins of AlUla to the Red Sea coast, Saudi Arabia is opening its doors to international tourists. A nascent but growing tourism industry adds a new pillar to the Kingdom's economy."
 SAU_unemployment_crisis_1: "The Unemployment Crisis (3% Jobless)"
 SAU_unemployment_crisis_1_desc: "The worst is over. Only pockets of joblessness remain as Saudis fill the jobs once held by foreign workers."
 SAU_unemployment_crisis_10: "The Unemployment Crisis (30% Jobless)"
 SAU_unemployment_crisis_10_desc: "Joblessness grips the Kingdom. A whole generation of young Saudis leaves school with nowhere to work, and the streets grow restless."
 SAU_unemployment_crisis_2: "The Unemployment Crisis (6% Jobless)"
 SAU_unemployment_crisis_2_desc: "The worst is over. Only pockets of joblessness remain as Saudis fill the jobs once held by foreign workers."
 SAU_unemployment_crisis_3: "The Unemployment Crisis (9% Jobless)"
 SAU_unemployment_crisis_3_desc: "The worst is over. Only pockets of joblessness remain as Saudis fill the jobs once held by foreign workers."
 SAU_unemployment_crisis_4: "The Unemployment Crisis (12% Jobless)"
 SAU_unemployment_crisis_4_desc: "Unemployment is receding as the reforms take hold, but the jobs gap is still wide and the pressure on the government has not lifted."
 SAU_unemployment_crisis_5: "The Unemployment Crisis (15% Jobless)"
 SAU_unemployment_crisis_5_desc: "Unemployment is receding as the reforms take hold, but the jobs gap is still wide and the pressure on the government has not lifted."
 SAU_unemployment_crisis_6: "The Unemployment Crisis (18% Jobless)"
 SAU_unemployment_crisis_6_desc: "Unemployment is receding as the reforms take hold, but the jobs gap is still wide and the pressure on the government has not lifted."
 SAU_unemployment_crisis_7: "The Unemployment Crisis (21% Jobless)"
 SAU_unemployment_crisis_7_desc: "Unemployment is receding as the reforms take hold, but the jobs gap is still wide and the pressure on the government has not lifted."
 SAU_unemployment_crisis_8: "The Unemployment Crisis (24% Jobless)"
 SAU_unemployment_crisis_8_desc: "Joblessness grips the Kingdom. A whole generation of young Saudis leaves school with nowhere to work, and the streets grow restless."
 SAU_unemployment_crisis_9: "The Unemployment Crisis (27% Jobless)"
 SAU_unemployment_crisis_9_desc: "Joblessness grips the Kingdom. A whole generation of young Saudis leaves school with nowhere to work, and the streets grow restless."
 SAU_vision_2030_delivered: "Vision 2030: Delivered"
 SAU_vision_2030_delivered_desc: "Vision 2030 has delivered major construction and diversification projects, including NEOM, the redevelopment of Riyadh, and new tourism facilities. Saudi Arabia now relies less heavily on crude oil."
 SAU_vision_2030_expectations: "Vision 2030: The Promise"
 SAU_vision_2030_expectations_desc: "The announcement of Vision 2030's megaprojects has attracted investment and increased public confidence. Their scale also creates major budgetary and political costs until the promised projects are completed."
 SAU_vision_2030_progress: "Vision 2030: Taking Shape"
 SAU_vision_2030_progress_desc: "Construction is underway across the Kingdom, and the first Vision 2030 projects are operating. This visible progress has reduced public doubt about the program."
 SAU_vision_2030_white_elephant: "Vision 2030: The White Elephants"
 SAU_vision_2030_white_elephant_desc: "Vision 2030 has missed its deadline, leaving major projects unfinished or unused after hundreds of billions in spending. The failure has validated the program's critics and damaged confidence in the leadership."
 SAU_water_crisis_01: "§HManaged Water Crisis§!"
 SAU_water_crisis_01_desc: "Expanded desalination, more efficient agricultural policy, and lower public consumption have reduced the water crisis to a §Gmanageable§! level. The Kingdom still faces structural water scarcity, but supplies remain reliable."
 SAU_water_crisis_02: "§HSevere Water Crisis§!"
 SAU_water_crisis_02_desc: "Saudi Arabia is draining the §LSaq§! and §LWajid§! fossil aquifers faster than they can be replaced. Agriculture consumes much of the remaining groundwater, while dependence on desalination raises §Yconsumer goods costs§!, reduces §Yefficiency§!, and weakens §Ypublic patience§!."
 SAU_yemen_attack_buff: "Coordinated Offensive"
 SAU_yemen_attack_buff_desc: "Saudi planning and fire support give our forces a decisive edge on the attack. +15% attack against the Houthis."
 SAU_yemen_pipeline_t1: "Arabian Sea Pipeline (Tier I)"
 SAU_yemen_pipeline_t1_desc: "Saudi crude runs south through Al Mahrah to the Arabian Sea, bypassing the Strait of Hormuz. §GAdditional Income: up to $1.25B§! from your pipeline network. We pay every country the line crosses a transit fee of $1.25B each (§RAdditional Expense§!). Sabotage drops the line one tier, cutting both; a severed tier 1 line closes the route."
 SAU_yemen_pipeline_t2: "Arabian Sea Pipeline (Tier II)"
 SAU_yemen_pipeline_t2_desc: "Saudi crude runs south through Al Mahrah to the Arabian Sea, bypassing the Strait of Hormuz. §GAdditional Income: up to $1.25B§! from your pipeline network. We pay every country the line crosses a transit fee of $1.25B each (§RAdditional Expense§!). Sabotage drops the line one tier, cutting both; a severed tier 1 line closes the route."
 SAU_yemen_pipeline_t3: "Arabian Sea Pipeline (Tier III)"
 SAU_yemen_pipeline_t3_desc: "Saudi crude runs south through Al Mahrah to the Arabian Sea, bypassing the Strait of Hormuz. §GAdditional Income: up to $1.25B§! from your pipeline network. We pay every country the line crosses a transit fee of $1.25B each (§RAdditional Expense§!). Sabotage drops the line one tier, cutting both; a severed tier 1 line closes the route."

 # ==============================
 # Dynamic Modifiers
 # ==============================
 SAU_baath_state: "The Arab Ba'ath"
 SAU_baath_state_tt: "§YUnity, freedom, socialism.§!\n\nThe party is the vanguard of the Arab nation, fusing officer and worker, fellah and student into a single revolutionary will. Every frontier is but a waystation on the road to one Arab homeland."
 SAU_communist_state: "The Socialist State"
 SAU_communist_state_tt: "The dictatorship of the proletariat in Arabia. These gains hold only while the Saudi Communist Party rules. Should it lose power, they vanish."
 SAU_Military_Rule: "Military Rule"
 SAU_Military_Rule_desc: "The Supreme Military Council governs the Kingdom. The throne remains, the ministries answer elsewhere, and the officers who took Riyadh are discovering that holding a country is considerably harder than seizing one."
 SAU_Monarchy_house_of_al_saud: "The House of Al Saud"
 SAU_Monarchy_house_of_al_saud_desc: "The House of Al Saud is the ruling family of the Kingdom of Saudi Arabia. It was founded by Abdulaziz Ibn Saud in 1932 and has since maintained control over the country through a combination of political alliances, religious legitimacy, and economic power derived from oil wealth."
 SAU_nda_state: "The National Democratic Assembly"
 SAU_nda_state_tt: "The institutions of the liberal republic deepen with each reform won at the ballot box."
 SAU_nlf_doctrine: "Non-Aligned Socialism"
 SAU_nlf_doctrine_tt: "§YArab Road to Socialism (National Liberation Front only):§!\n§G+15% Political Power Gain, +10% War Support§!"
 SAU_peoples_council_works: "Council Public Works"
 SAU_peoples_council_works_tt: "Commissioned by §Ythe People's Council§! and built to its standard"
 SAU_rep_shia_hardline_doctrine: "Revolutionary Theocracy"
 SAU_rep_shia_hardline_doctrine_tt: "Hezbollah Al-Hejaz rules in the name of the jurist, the nation mobilized for the resistance."
 SAU_rep_shia_moderate_doctrine: "Reformist Governance"
 SAU_rep_shia_moderate_doctrine_tt: "The Reform Movement governs through reconciliation, welfare, and the ballot box."
 SAU_rep_shia_state: "The Shia Republic"
 SAU_rep_shia_state_tt: "The institutions of the Shia republic grow stronger with each reform won and each victory taken."
 SAU_scp_doctrine: "Marxist-Leninist Vanguard"
 SAU_scp_doctrine_tt: "§YOrthodox Marxism-Leninism (Saudi Communist Party only):§!\n§G+10% Factory Efficiency, +10% Construction Speed, +5% Stability§!"

