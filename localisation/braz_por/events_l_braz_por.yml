 UN.300.t: "Perdemos §Y Cultura Educacional, Científica, e Organizacional §! §G Subsidios §!"
 UN.300.d: "Após a revisão anual do orçamento pelo Comitê de Orçamento da §Y Organização Educacional, Científica e Cultural §!, foi determinado que não atendemos mais aos requisitos para receber §Y Organização Educacional, Científica e Cultural §! §G Subsídios §!. Como resultado, não temos mais acesso ao programa de subsídios. Poderemos solicitar novamente no futuro caso voltemos a atender aos requisitos do programa."
 UN.300.a: "Ok"
 UN.301.t: "Perdemos os §G Subsídios §! da §Y Organização de Desenvolvimento Industrial §!"
 UN.301.d: "Após a revisão anual do orçamento pelo Comitê de Orçamento da §Y Organização de Desenvolvimento Industrial §!, foi determinado que não atendemos mais aos requisitos para receber §Y Organização de Desenvolvimento Industrial §! §G Subsídios §!. Como resultado, não temos mais acesso ao programa de subsídios. Poderemos solicitar novamente no futuro caso voltemos a atender aos requisitos do programa."
 UN.301.a: "Ok"
 UN.302.t: "Perdemos os §G Subsídios §! do §Y Fundo de Desenvolvimento de Capital §!"
 UN.302.d: "Após a revisão anual do orçamento pelo Comitê de Orçamento do §Y Fundo de Desenvolvimento de Capital §!, foi determinado que não atendemos mais aos requisitos para receber §Y Fundo de Desenvolvimento de Capital §! §G Subsídios §!. Como resultado, não temos mais acesso ao programa de subsídios. Poderemos solicitar novamente no futuro caso voltemos a atender aos requisitos do programa."
 UN.302.a: "Ok"
 recognition.16.t: "Reconhecer [FROM.GetName]?"
 recognition.16.d: "[FROM.GetNameDef] está solicitando formalmente nosso reconhecimento diplomático. Qualquer que seja nossa resposta, ela será interpretada como uma declaração de nossa posição sobre sua soberania."
 recognition.16.a: "Não estamos preparados para reconhecê-los."
 recognition.16.b: "Nós reconhecemos [FROM.GetName] como um Estado soberano."
 recognition.18.t: "Reconhecer [FROM.GetName]?"
 recognition.18.d: "O status de [FROM.GetNameDef] está sendo questionado no cenário mundial. Todas as capitais estão tomando uma posição. Qual será a nossa?"
 recognition.18.a: "Recusamos reconhecer sua soberania."
 recognition.18.b: "Reconhecemos a soberania de [FROM.GetName]."
 recognition.31.t: "[FROM.GetName] Busca Nosso Reconhecimento"
 recognition.31.d: "[FROM.GetNameDef] declarou independência de nosso território e está nos pedindo que aceitemos a nova realidade. Nossa resposta definirá nosso relacionamento com eles e sinalizará nossa posição para os demais."
 recognition.31.a: "Jamais reconheceremos este regime."
 recognition.31.b: "Reconhecemos a independência de [FROM.GetName]."
 UNSC.10.t: "Resolução do Conselho de Segurança Adotada"
 UNSC.10.d: "O Conselho de Segurança das Nações Unidas votou pela adoção de uma resolução contra [?global.current_sc_vote_nation.GetNameWithFlag]. [?global.current_sc_vote_nation.UNSCGetResolutionTypePassDesc]"
 UNSC.10.a: "Anotado."
 UNSC.11.t: "Resolução do Conselho de Segurança contra [This.GetNameWithFlag]"
 UNSC.11.d: "O Conselho de Segurança das Nações Unidas votou pela adoção de uma resolução contra [This.GetNameWithFlag]. [UNSCGetResolutionTypePassDesc]"
 UNSC.11.a: "Reconhecemos a aprovação desta resolução."
 UNSC_pass_type_1_desc: "Uma resolução de pressão foi adotada, exigindo a cessação de todas as operações militares ofensivas dentro de §Y 210 dias §!. O descumprimento resultará em novas sanções."
 UNSC_pass_type_2_desc: "Uma resolução de sanções econômicas foi adotada, impondo penalidades comerciais e de pesquisa até que a ameaça ofensiva à paz mundial tenha terminado."
 UNSC_pass_type_3_desc: "Uma resolução de restrição a voluntários estrangeiros foi adotada. Qualquer nação que enviar voluntários militares em violação a esta resolução estará sujeita a sanções adicionais."
 UNSC_pass_type_4_desc: "Uma resolução de embargo de armas foi adotada, cortando o acesso ao mercado internacional de armamentos até que todos os conflitos ofensivos tenham terminado."
 COVID_events.0.t: "Um Novo Vírus"
 COVID_events.0.d: "Um novo vírus surgiu em Wuhan. Vários médicos relatam uma doença respiratória que se espalha rapidamente entre a população local. O número de casos aumentou de apenas alguns para dezenas em menos de uma semana."
 COVID_events.0.a: "Fiquemos atentos a isso."
 COVID_events.1.t: "Médicos Denunciantes"
 COVID_events.1.d: "Vários médicos começaram a compartilhar relatos sobre o novo vírus nas redes sociais, comparando-o à SARS. As autoridades locais querem orientação. Podemos silenciar os relatos para evitar o pânico ou permitir que circulem e correr o risco de causar alarme na população."
 COVID_events.1.a: "Silencie eles."
 COVID_events.1.b: "Deixe a verdade vir a tona."
 COVID_events.2.t: "Pandemia Confirmada"
 COVID_events.2.d: "A Organização Mundial da Saúde confirmou o novo coronavírus como uma emergência de saúde global. Os hospitais estão sobrecarregados e o vírus está se espalhando para além de nossas fronteiras. Isso transformará nossa economia pelos próximos anos."
 COVID_events.2.a: "Preparar para o impacto."
 COVID_events.3.t: "COVID-19 Emerge"
 COVID_events.3.d1: "Um novo coronavírus mortal se espalhou a partir da China, onde as autoridades inicialmente suprimiram os relatos sobre o surto. A resposta tardia permitiu que o vírus se espalhasse sem controle através das fronteiras internacionais."
 COVID_events.3.d2: "Um novo coronavírus mortal, originário da China, foi declarado uma pandemia global. Apesar dos primeiros alertas feitos por médicos chineses, o vírus se espalhou rapidamente através das fronteiras internacionais."
 COVID_events.3.a: "Preparar nossa resposta."
 COVID_events.4.t: "A Pandemia Atinge [This.GetName]"
 COVID_events.4.d: "Casos de COVID-19 foram confirmados dentro de nossas fronteiras. Os hospitais estão se preparando para uma onda de pacientes e o medo público está aumentando. A atividade econômica está parando à medida que os cidadãos se auto isolam."
 COVID_events.4.a: "Tudo em quarentena."
 COVID_events.5.t: "Cadeias de Suprimentos Globais Colapsam"
 COVID_events.5.d: "A pandemia devastou o comércio internacional. O fechamento de fábricas, portos paralisados e gargalos de transporte criaram graves escassez de componentes e matérias primas em todo o mundo."
 COVID_events.5.a: "Estoque o que restou."
 pandemic_events.1.t: "Pandemia de Gripe Suína"
 pandemic_events.1.d: "Uma nova variante de influenza H1N1 foi identificada no México, espalhando-se rapidamente pela população. A Organização Mundial da Saúde está monitorando a situação de perto à medida que os casos se multiplicam e o vírus ameaça cruzar as fronteiras internacionais."
 pandemic_events.1.a: "Soe o alarme."
 pandemic_events.2.t: "H1N1 Atinge [This.GetName]"
 pandemic_events.2.d: "Casos de gripe suína H1N1 foram confirmados dentro de nossas fronteiras. Embora menos letal do que se temia inicialmente, o vírus está se espalhando rapidamente e sobrecarregando os recursos de saúde."
 pandemic_events.2.a: "Distribua máscaras e aguarde pelo melhor."
 pandemic_events.3.t: "Surto de MERS"
 pandemic_events.3.d: "Um novo Coronavírus causador da Síndrome Respiratória do Oriente Médio foi identificado em nosso país. O vírus parece se espalhar de camelos para humanos, com uma taxa de letalidade alarmantemente alta entre os infectados. Os hospitais estão preparando alas de isolamento."
 pandemic_events.3.a: "Contenha a Pandemia"
 pandemic_events.4.t: "Surto de Ebola na África Ocidental"
 pandemic_events.4.d: "Um surto do vírus Ebola foi confirmado na zona rural da Guiné. A febre hemorrágica está se espalhando pelas comunidades com velocidade aterrorizante, sobrecarregando os postos de saúde locais. Sem uma intervenção imediata, a epidemia poderá engolir toda a região."
 pandemic_events.4.a: "Deus ajude nós todos."
 pandemic_events.5.t: "Ebola se Espalha para [This.GetName]"
 pandemic_events.5.d: "Casos de Ebola foram confirmados dentro de nossas fronteiras, à medida que a epidemia da África Ocidental rompe o confinamento. Profissionais de saúde correm extremo risco e organizações internacionais de ajuda correm contra o tempo para responder."
 pandemic_events.5.a: "Nós precisamos de ajuda. Agora!"
 pandemic_events.6.t: "Ebola retorna ao Congo"
 pandemic_events.6.d: "Um novo surto de Ebola eclodiu nas províncias orientais da República Democrática do Congo. O conflito armado na região está complicando os esforços de contenção, já que os profissionais de saúde enfrentam ataques de grupos de milícia desconfiados de estranhos."
 pandemic_events.6.a: "Envie equipes de saúde sob escolta armada."
 pandemic_events.7.t: "Casos de MERS em [This.GetName]"
 pandemic_events.7.d: "Casos da Síndrome Respiratória do Oriente Médio foram detectados em nosso país, provavelmente trazidos por viajantes da Arábia Saudita. As autoridades de saúde estão estabelecendo protocolos de triagem em aeroportos e hospitais."
 pandemic_events.7.a: "Triar todos os viajantes."
 pandemic_events.8.t: "Casos de Ebola em [This.GetName]"
 pandemic_events.8.d: "Casos de Ebola cruzaram a fronteira da República Democrática do Congo. A movimentação transfronteiriça na região torna a contenção extremamente difícil, e os profissionais de saúde correm contra o tempo para rastrear contatos."
 pandemic_events.8.a: "Fechar as fronteiras imediatamente."
 pandemic_events.9.t: "Surto de MERS na Coreia do Sul"
 pandemic_events.9.d: "Um único paciente retornando do Oriente Médio desencadeou um devastador evento de superdisseminação hospitalar. O vírus está se espalhando rapidamente pelas instalações de saúde, à medida que pacientes e funcionários o transmitem entre as enfermarias. Mais de cem casos foram confirmados e dezenas de mortes relatadas, expondo falhas críticas em nossos protocolos de controle de infecção."
 pandemic_events.9.a: "Feche todos os hospitais afetados."
 influence.60.t: "Um Golpe em [event_target:coup_contest_victim.GetName]"
 influence.60.d: "Nossos serviços de inteligência confirmam o que muitos suspeitavam: [event_target:coup_contest_sender.GetNameWithFlag] orquestrou com sucesso um §Rgolpe§! em [event_target:coup_contest_victim.GetNameWithFlag], instalando um novo regime simpático aos seus interesses. Nós detemos uma §Hinfluência§! significativa em [event_target:coup_contest_victim.GetName] própria — o suficiente para não estarmos indefensos aqui, caso escolhamos agir. Nossas opções vão desde uma denúncia diplomática até o apoio clandestino à antiga ordem. Cada uma traz custos. Fazer nada pode nos custar mais."
 influence.60.a: "Denunciar publicamente e sancionar [event_target:coup_contest_sender.GetName]"
 influence.60.f: "Impor §Hsancões econômicas§! direcionadas a [event_target:coup_contest_sender.GetName]"
 influence.60.b: "Apoiar a antiga oposição clandestinamente e ampliar nossa própria influência"
 influence.60.e: "§RIntervenção militar§! — armar a resistência e posturar-se contra [event_target:coup_contest_sender.GetName]"
 influence.60.c: "Aceitar a nova realidade e seguir em frente"
 influence.61.t: "Guerra Civil em [event_target:coup_contest_victim.GetName]"
 influence.61.d: "A tentativa de golpe de [event_target:coup_contest_sender.GetNameWithFlag] deu totalmente errado: [event_target:coup_contest_victim.GetNameWithFlag] está em §Rguerra civil§!, e o antigo regime ainda está lutando. Nossa §Hinfluencia§! nos dá um interesse real em qual lado prevalecerá. Armar o antigo governo pode impedir que [event_target:coup_contest_sender.GetName] consolide seus ganhos. Enviar apenas dinheiro é uma aposta cautelosa. Comprometer-se totalmente nos coloca no comando. Ficar de fora significa deixar que outros decidam o resultado."
 influence.61.a: "Armar o antigo regime — armas, equipamentos e apoio político"
 influence.61.b: "Enviar ajuda econômica discretamente para manter o antigo regime à tona"
 influence.61.e: "§RIntervenção militar total§! — comprometer-se com a vitória do antigo regime"
 influence.61.c: "Ficar fora da guerra civil"
 News_influence.7.t: "[FROM.GetNameWithFlag] Condena [event_target:coup_contest_sender.GetNameWithFlag]"
 News_influence.7.d: "[FROM.GetNameWithFlag] emitiu hoje uma condenação veemente do suposto papel de [event_target:coup_contest_sender.GetNameWithFlag] no recente golpe em [event_target:coup_contest_victim.GetNameWithFlag]. Protestos diplomáticos, §Hsancões§! direcionadas e o endurecimento das relações estão todos sobre a mesa. O ministério das Relações Exteriores de [event_target:coup_contest_sender.GetName] rejeitou as acusações como \"teatro político sem fundamento\", mas a opinião internacional está se endurecendo rapidamente."
 News_influence.7.a: "Um tiro inicial na guerra de influência"
 News_influence.8.t: "[FROM.GetNameWithFlag] Apoia a Antiga Oposição em [event_target:coup_contest_victim.GetName]"
 News_influence.8.d: "Fontes de inteligência confirmam o que observadores vêm suspeitando há semanas: [FROM.GetNameWithFlag] está secretamente canalizando §H financiamento §! e §H apoio político §! para a oposição pré-golpe dentro de [event_target:coup_contest_victim.GetNameWithFlag]. As facções democráticas dentro do país estão subitamente mais bem organizadas, melhor financiadas e visivelmente mais atuantes. O §H regime golpista §! de [event_target:coup_contest_victim.GetName] classificou a atividade como “uma intervenção estrangeira inaceitável” — a mesma atividade que eles próprios realizaram para chegar ao poder."
 News_influence.8.a: "A disputa por [event_target:coup_contest_victim.GetName] ainda não terminou"
 News_influence.9.t: "[FROM.GetNameWithFlag] Arma o Antigo Regime de [event_target:coup_contest_victim.GetName]"
 News_influence.9.d: "Com [event_target:coup_contest_victim.GetNameWithFlag] mergulhado em uma §R guerra civil §! após o golpe fracassado de [event_target:coup_contest_sender.GetNameWithFlag], [FROM.GetNameWithFlag] abandonou qualquer pretensão de neutralidade. Voos de carga de [FROM.GetName] estão pousando em territórios controlados pelo governo, carregados com §H armas leves §!, §H veículos §! e — de acordo com várias fontes — “assessores” uniformizados. A guerra por procuração agora está às claras."
 News_influence.9.a: "Uma longa luta pela frente"
 News_influence.10.t: "[FROM.GetNameWithFlag] Inicia uma Intervenção Militar em [event_target:coup_contest_victim.GetName]"
 News_influence.10.d: "Na resposta que mais escala até o momento ao golpe de [event_target:coup_contest_sender.GetNameWithFlag] em [event_target:coup_contest_victim.GetNameWithFlag], [FROM.GetNameWithFlag] anunciou uma formal §R intervenção militar §!. A linguagem é moderada, mas o conteúdo não é: unidades mobilizadas para a região, ordens permanentes para auxiliar o governo pré-golpe e aberto desprezo pelo fato consumado de [event_target:coup_contest_sender.GetName]. Os mercados globais estão em turbulência. O Conselho de Segurança da ONU foi convocado para uma sessão de emergência."
 News_influence.10.a: "A linha foi cruzada"
 influence.52.e: "Pacote de §H Equipamento Moderno §! (AT pesado, SAM, drones)"
 influence.52.a_preview_tt: "Enviar armas leves, armas antitanque leves e equipamentos antiaéreos"
 influence.52.b_preview_tt: "Enviar tanques de batalha principais, tanques anfíbios / especializados e veículos utilitários"
 influence.52.e_preview_tt: "Enviar mísseis antitanque pesados, mísseis terra-ar e drones militares"
 influence.57.t: "Qual o tamanho do pacote?"
 influence.57.d: "Decidimos o que enviar. Agora precisamos decidir §H quanto §!. Pacotes maiores custam mais §H capital político §!, geram mais §R tensão mundial §! e atraem cobertura de notícias internacionais."
 influence.57.a: "Enviar um §H pequeno §! pacote"
 influence.57.b: "Enviar um pacote §H Médio §!"
 influence.57.c: "Enviar um §H Grande §! pacote"
 influence.57.e: "Pensando melhor, cancelar"
 News_influence.11.t: "[FROM.FROM.GetName] Envia Grande Pacote de Armas para [FROM.GetName]"
 News_influence.11.d: "[FROM.FROM.GetName] anunciou um §H grande pacote de ajuda militar §! para [FROM.GetName] milhares de armas leves, veículos e equipamentos de suporte. Analistas observam que a transferência sinaliza um fortalecimento do compromisso de [FROM.FROM.GetName] com a defesa de [FROM.GetName]. Os rivais estão furiosos; os aliados estão observando para ver quem será o próximo."
 News_influence.11.a: "O fluxo de armas continua"
 News_influence.12.t: "[FROM.FROM.GetName] Transferiu Armas Avançadas para [FROM.GetName]"
 News_influence.12.d: "Em uma transferência que ultrapassa todas as linhas vermelhas do mercado global de armas, [FROM.FROM.GetName] enviou §H mísseis antitanque pesados §!, §H sistemas terra-ar §! e §H drones de combate §! para [FROM.GetName]. Cada uma dessas armas é do tipo que transforma pequenas escaramuças regionais em guerras. Os rivais de [FROM.GetName] estão chamando isso de ameaça direta. As linhas telefônicas diplomáticas estão pegando fogo em várias capitais."
 News_influence.12.a: "A guerra moderna agora ganhou armas modernas"
 influence.2.t: "Oferecer Ajuda Econômica para [FROM.GetName]?"
 influence.2.d: "Escolhemos começar a redigir um pacote de Ajuda Econômica para [FROM.GetName]. Podemos transferir uma quantia fixa diretamente do nosso tesouro. Essa generosidade melhorará as relações e nos concederá influência em [FROM.GetName]. Quanto mais dermos, mais influência ganharemos.\n\n"
 influence.2.a: "Enviar §G 25 Bilhões §! em Ajuda Econômica."
 influence.2.b: "Enviar §G 50 Bilhões §! em Ajuda Econômica."
 influence.2.c: "Enviar §G 75 Bilhões §! em Ajuda Econômica."
 influence.2.e: "Enviar §G 100 Bilhões §! em Ajuda Econômica."
 generic.5.f: "Estamos melhores sem eles."
 ecuadornews.1.t: "Golpe militar no Equador"
 ecuadornews.1.d: "Os militares equatorianos intervieram em meio a uma profunda crise política e econômica, retirando o presidente Jamil Mahuad do poder. Oficiais de alta patente, liderados pelo general Carlos Mendoza, assumiram o controle da situação, deixando de lado tanto o governo civil quanto a liderança dos protestos da CONAIE. As Forças Armadas descrevem a medida como uma ação temporária para restaurar a estabilidade, embora ainda não esteja claro quão rapidamente o governo civil será restabelecido ou que forma ele assumirá."
 ecuadornews.1.a: "Interessante."
 ecuadornews.2.t: "Golpe militar no Equador"
 ecuadornews.2.d: "A crise econômica e as controversas reformas do governo levaram o Equador a um ponto de ruptura. Após manifestações em massa lideradas pela Confederação de Nacionalidades Indígenas do Equador (CONAIE) e a deserção de vários oficiais militares subalternos, líderes da oposição anunciaram a formação de uma Junta de Salvação Nacional. A própria Junta de Salvação Nacional proclamada é apresentada como uma liderança tripartite destinada a simbolizar a unidade nacional. Ela é composta pelo líder indígena Antonio Vargas, pelo juiz civil Carlos Solórzano e pelo representante militar, general Lucio Gutiérrez."
 ecuadornews.2.a: "Interessante."
 ecuadornews.3.t: "Junta de Salvação Nacional do Equador entra em colapso"
 ecuadornews.3.d: "A tentativa de formar uma junta civil-militar em Quito fracassou. Apesar dos protestos em massa e da ocupação do Congresso pela CONAIE e por grupos aliados, o alto comando militar se recusou a apoiar o novo governo. O general Carlos Mendoza assumiu o controle da situação, afastando a liderança dos protestos e encerrando o projeto da junta. Sem o apoio militar, a coalizão rapidamente se desintegrou, com muitos dos conspiradores sendo presos."
 ecuadornews.3.a: "Interessante."
 ecuador.1.t: "Adotando o Dolar"
 ecuador.1.d: "A instabilidade econômica continua a assolar o país após a crise financeira de 1998–1999. O presidente Jamil Mahuad propõe dolarizar a economia a fim de conter a inflação e restaurar a confiança no sistema financeiro. Ao mesmo tempo, o governo corta mais de 60% do orçamento das Forças Armadas, prejudicando gravemente as relações com os militares."
 ecuador.1.a: "Promover a Dolarização"
 ecuador.1.b: "Recuar em Algumas Reformas Radicais"
 ecuador.2.t: "Levante em Quito"
 ecuador.2.d: "Em resposta aos planos econômicos do governo, multidões indígenas afluem a Quito, exigindo a destituição do presidente Jamil Mahuad. Os manifestantes ocupam o Congresso e a Suprema Corte, paralisando o Estado e expondo a incapacidade do governo de manter a ordem. À medida que a pressão aumenta na capital, a lealdade das forças de segurança e a sobrevivência da administração passam a ser cada vez mais questionadas."
 ecuador.2.a: "Manter a Ordem"
 ecuador.3.t: "Governo de Salvação Nacional"
 ecuador.3.d: "Em um ato puramente simbólico, os líderes dos protestos anunciam na televisão nacional a criação da chamada Junta de Salvação Nacional, alegando representar a vontade do povo. A declaração recebe amplo apoio popular e enfraquece ainda mais a autoridade do governo civil. A Junta é apresentada como sendo liderada pelo general Carlos Mendoza."
 ecuador.3.a: "General Lucio Gutiérrez Assume a Liderança"
 ecuador.3.b: "Seguimos em Frente"
 ecuador.4.t: "A Junta de Três Pessoas"
 ecuador.4.d: "A proclamada Junta de Salvação Nacional é agora apresentada como uma liderança tripartite destinada a simbolizar a unidade nacional. Ela é composta pelo líder indígena Antonio Vargas, pelo juiz civil Carlos Solórzano e pelo representante militar General Lucio Gutiérrez."
 ecuador.4.a: "Alguma coisa diferente"
 ecuador.5.t: "Altos comandantes militares não apoiam o Governo"
 ecuador.5.d: "Enquanto a opinião pública apoia amplamente a ocupação do Congresso pela CONAIE e o chamado à renúncia do Presidente Mahuad, há pouco apetite pelo governo militar direto. Ciente disso, o General Carlos Mendoza afasta a coalizão e assume o controle das negociações. O alto comando, intimamente ligado às elites políticas e econômicas do Equador — incluindo figuras como León Febres Cordero, que rejeita categoricamente os planos da junta e é ainda mais influenciado pela ameaça de sanções econômicas dos EUA —, força uma ruptura decisiva com a liderança dos protestos."
 ecuador.5.a: "O General Mendoza cede o poder a Gustavo Noboa"
 ecuador.5.b: "Não Renuncie"
 recognition.45.t: "Reconhecimento Suficiente para Buscar a Adesão à ONU"
 recognition.45.d: "Estados-membros da ONU suficientes agora reconhecem nossa soberania para buscar de forma crível um assento nas Nações Unidas. Podemos peticionar a Assembleia Geral por adesão."
 recognition.45.a: "Iniciar a licitação."
 anti_bully.2.t: "Fadiga de Guerra Pública"
 anti_bully.2.d: "Decidimos que a guerra é a nossa melhor opção. No entanto, para manter o apoio do povo, devemos vencer rapidamente ou avançar rapidamente em solo estrangeiro. O povo marchará enquanto vir a necessidade desta guerra. As botas marcham, os tambores batem, e chegou a hora de [FROM.GetName] ir para a guerra!\n\n§YIsso ativa o Sistema de Fadiga de Guerra Pública§!\n"
 anti_bully.2.a: "Nós Devemos Ganhar!"
 UNSC.12.t: "Resolução do Conselho de Segurança Contra [This.GetNameWithFlag] Falhou"
 UNSC.12.d: "O Conselho de Segurança das Nações Unidas rejeitou a resolução proposta contra [This.GetNameWithFlag]. Nenhuma medida será adotada neste momento."
 UNSC.12.a: "Tomamos nota do resultado."
 UNSC.6.t: "Desarmamento de [?global.current_sc_vote_nation.GetName]"
 UNSC.6.d: "Uma resolução declarando [?global.current_sc_vote_nation.GetName] em violação material de suas obrigações de desarmamento está perante o Conselho de Segurança. Ela oferece uma última oportunidade para cumprir e alerta sobre sérias consequências caso não o façam.\n\nEla não autoriza o uso de força, e os patrocinadores sabem disso. Essa omissão é o preço dos votos de que precisam. O que a resolução lhes compra não é permissão, mas sim legitimidade, e se ela falhar, não terão nenhuma das duas.\n\n$unsc_vote_pass_tt$"
 UNSC.7.t: "Exigir a Rendição de um Terrorista Procurado por [?global.current_sc_vote_nation.GetName]"
 UNSC.7.d: "Uma resolução exigindo que [?global.current_sc_vote_nation.GetName] entregue um terrorista procurado abrigado em seu território está perante o Conselho de Segurança. As evidências foram apresentadas a esta câmara, e a resposta do regime até agora tem sido o silêncio.\n\nSe a resolução for aprovada, [?global.current_sc_vote_nation.GetName] enfrentará sanções das Nações Unidas até que a exigência seja atendida.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_6_desc: "Uma resolução de desarmamento foi adotada, considerando a nação em violação material e alertando sobre sérias consequências. Ela não chega a autorizar o uso de força."
 UNSC_pass_type_7_desc: "Uma resolução exigindo a rendição de um terrorista procurado foi adotada. As sanções das Nações Unidas permanecerão em vigor até que a exigência seja atendida."
 influence.62.t: "Lobistas Estrangeiros Capturam Nosso Governo"
 influence.62.d: "Os presidentes de comissões que passaram a última sessão exigindo restrições ao capital estrangeiro silenciaram. Os funcionários do ministério retornam as ligações da embaixada de [?var:ROOT.influence_lobbied_by.GetNameWithFlag] antes de retornarem as nossas, e os membros que normalmente liderariam um movimento contra a influência estrangeira agora estão em cargos de consultoria que não conseguimos rastrear. Nada de ilegal será provado, mas pelos próximos meses nosso governo não tem apetite para a luta e nenhum voto para desperdiçar com ela."
 influence.62.a: "Nossas mãos estão atadas"
 hongkong_news.10.t: "Hong Kong foi anexado pela China"
 hongkong_news.10.d: "A China absorveu formalmente a Região Administrativa Especial de Hong Kong, encerrando seu status separado. As instituições e a administração do território agora estão sob controle central direto de Pequim, com [CHI.GetLeader] descrevendo a medida como a culminação do retorno de Hong Kong à pátria-mãe."
 hongkong_news.10.a: "A Pérola retornou ao reduto."
 hongkong_news.10.b: "Um desenvolvimento significativo."
 generic.6.a: "Juntos nós devemos defender a democracia."
 generic.6.b: "Ninguém pode nos deter!"
 generic.6.c: "A situação dos trabalhadores não poderia encontrar defensores melhores!"
 generic.6.e: "Deixaremos nossas diferenças de lado, por agora."
 generic.7.b: "Então, nós os esmagaremos, também!"
 generic.7.c: "A revolução deles é corrupta!"
 generic.7.e: "Nossas diferenças eram grandes demais."
 GLOBAL_angolan_civil_war_over: "A Guerra Civil Angolana Chegou ao Fim"
 AFG_news.1.t: "A Guerra Civil no Afeganistão Esfria"
 AFG_news.1.TAL.d: "Apesar dos melhores esforços das Forças Armadas Afegãs e de seus aliados ocidentais, o Talibã conseguiu assumir o controle total de todas as principais cidades, incluindo a capital, Cabul. A maioria dos funcionários do governo se escondeu ou partiu para o exílio, incluindo o presidente afegão [AFG.GetLeader], que atualmente reside nos Estados Unidos.\n\nO triunfo do Talibã certamente aumentará a frequência de ataques terroristas na região e em todo o mundo."
 AFG_news.1.AFG.d: "O governo afegão declarou vitória contra o Talibã. A maioria dos principais redutos e cidades foi libertada de sua presença, e a maior parte dos combatentes que restaram fugiu através da fronteira para o Paquistão. Embora o Talibã esteja agora reduzido a apenas alguns bolsões de resistência e células, prevê-se que a insurgência continue por muitos anos, ainda que em níveis mais baixos.\n\nEssa vitória demonstrou a eficácia do Exército Afegão reconstruído e a determinação do governo afegão."
 AFG_news.1.a: "Interessante"
 AFG_news.2.t: "Afeganistão Reivindica o Pashtunistão"
 AFG_news.2.d: "Devido a um aumento da violência no Paquistão, o governo afegão reforçou suas reivindicações sobre as áreas do Paquistão onde vivem os pashtuns. A Linha Durand (a fronteira contemporânea entre o Afeganistão e o Paquistão) há muito tempo é uma fonte de conflito entre os dois países, pois transferiu territórios do Império do Afeganistão para o Paquistão sob controle britânico.\n\nOs próprios pashtuns que vivem na região não parecem estar muito entusiasmados com esse acontecimento, já que muitos estão satisfeitos em viver dentro do Paquistão. É provável que o Afeganistão não consiga fazer valer suas reivindicações de outra forma que não seja pela força."
 AFG_news.2.a: "Interessante"
 AFG_news.3.t: "Afeganistão Reivindica o Baluchistão"
 AFG_news.3.d: "À medida que a crise no Paquistão se aprofunda, o Afeganistão amplia suas reivindicações. Hoje, o governo afegão anunciou que o Baluchistão, além do Pashtunistão, é parte integrante do Afeganistão."
 AFG_news.3.a: "Um Desenvolvimento Preocupante"
 AFG_news.4.t: "Afeganistão Invade Paquistão"
 AFG_news.4.d: "Em uma tentativa de consolidar sua reivindicação, o Afeganistão optou por uma abordagem mais direta para conquistar parte do território. Alegando agir em nome da segurança dos pashtuns, começou a enviar tropas através da fronteira para dentro do Paquistão."
 AFG_news.4.a: "Um Desenvolvimento Preocupante"
 AFG_news.5.t: "Talibã Une Forças"
 AFG_news.5.d: "O Talibã afegão e o Talibã paquistanês decidiram unir forças para combater conjuntamente ameaças em comum. Isso representa uma grande mudança no equilíbrio de poder na Ásia Central."
 AFG_news.5.a: "Preocupante."
 AFG_news.6.t: "Assassinato de Ahmad Shah Massoud"
 AFG_news.6.d: "Ahmad Shah Massoud, o principal líder da resistência afegã contra o Talibã, foi assassinado pela Al-Qaeda. Dois membros do Talibã, disfarçados de jornalistas, detonaram explosivos escondidos em seus equipamentos. Massoud ficou gravemente ferido e foi evacuado em um helicóptero militar, mas morreu devido aos ferimentos antes de chegar a um hospital.\n\nConhecido como o Leão do Panjshir, Massoud era um símbolo da resistência, primeiro contra a ocupação soviética e, posteriormente, contra o Talibã."
 AFG_news.6.a: "Uma perda."
 AFG_events.3.t: "Assassinato de Ahmad Shah Massoud"
 AFG_events.3.d: "Ahmad Shah Massoud, o Leão do Panjshir, foi alvo de um homem-bomba hoje. Dois membros do Talibã, disfarçados de jornalistas, detonaram explosivos escondidos em uma câmera e em uma bateria. Massoud ficou gravemente ferido e foi imediatamente evacuado do local em um helicóptero militar."
 AFG_events.3.a: "Rezemos a Alá para que ele sobreviva."
 AFG_events.4.t: "Os Estados Unidos Exercem sua Influência"
 AFG_events.4.d: "Com o Talibã derrotado, os Estados Unidos usaram sua influência para influenciar as decisões da Loya Jirga. Uma nova administração interina foi formada."
 AFG_events.4.a: "Eles são melhores do que o Talibã?"
 AFG_hostage_crisis.1.t: "Missionários sul-coreanos mantidos como reféns pelo Talibã"
 AFG_hostage_crisis.1.d: "Hoje, um grupo de missionários sul-coreanos que viajava pela província de Ghazni foi capturado por militantes do Talibã e está sendo mantido como refém. Eles exigem a libertação de prisioneiros e a retirada de todos os soldados sul-coreanos do Afeganistão.\n\nNosso assessor militar sugeriu o envio de um grupo de extração para resgatar os reféns, enquanto a delegação sul-coreana enviou um representante para negociar."
 AFG_hostage_crisis.1.a: "Nós não podemos confiar no Talibã, envie a equipe de extração."
 AFG_hostage_crisis.1.b: "A segurança dos reféns é nossa prioridade, envie o representante."
 AFG_hostage_crisis.2.t: "Reféns Resgatados"
 AFG_hostage_crisis.2.d: "Nossas forças especiais conseguiram se infiltrar no esconderijo do Talibã e escoltaram os reféns até o posto militar mais próximo.\n\nOs missionários retornarão à Coreia do Sul, e nossos soldados estão sendo elogiados pela mídia."
 AFG_hostage_crisis.2.a: "Missão completada."
 AFG_hostage_crisis.3.t: "Reféns assassinados durante a tentativa de resgate"
 AFG_hostage_crisis.3.d: "Militantes do Talibã perceberam a entrada de nossas forças especiais em seu esconderijo e executaram os reféns imediatamente.\n\nApós o confronto, nossos soldados conseguiram escapar do prédio, mas sem os reféns."
 AFG_hostage_crisis.3.a: "Missão fracassada."
 AFG_hostage_crisis.4.t: "Talibã demanda libertação dos prisioneiros"
 AFG_hostage_crisis.4.d: "O representante retornou com as exigências do Talibã, sendo a principal delas a libertação de todos os prisioneiros do Talibã em prisões norte-americanas."
 AFG_hostage_crisis.4.a: "Requisitar a libertação dos prisioneiros."
 AFG_hostage_crisis.4.b: "Não libertaremos criminosos de guerra!"
 AFG_hostage_crisis.5.t: "Talibã Exige Retirada da Coreia do Sul"
 AFG_hostage_crisis.5.d: "O Talibã exigiu a retirada de todas as nossas forças e o pagamento de um resgate pela libertação de nossos cidadãos."
 AFG_hostage_crisis.5.a: "Nós devemos aceitar."
 AFG_hostage_crisis.5.b: "Não iremos negociar com terroristas!"
 AFG_hostage_crisis.6.t: "Os USA recusam nosso pedido"
 AFG_hostage_crisis.6.d: "Representantes das Forças Armadas dos EUA rejeitaram nosso pedido para libertar prisioneiros do Talibã mantidos em prisões militares.\n\nOs jihadistas reagiram matando dois reféns antes de apresentar novas exigências. O governo norte-coreano também pediu a libertação dos reféns."
 AFG_hostage_crisis.6.a: "Como o Talibã reagirá a isso?"
 AFG_hostage_crisis.7.t: "Governo Afegão Rejeita Exigência do Talibã"
 AFG_hostage_crisis.7.d: "Os representantes do governo afegão rejeitaram as exigências do Talibã, considerando-as inviáveis. Os jihadistas reagiram matando dois reféns antes de apresentar novas exigências. O governo norte-coreano também pediu a libertação dos reféns."
 AFG_hostage_crisis.7.a: "Bárbaros!"
 AFG_hostage_crisis.8.t: "Coreia do Sul se Retira do Afeganistão"
 AFG_hostage_crisis.8.d: "Após uma crise envolvendo reféns no Afeganistão, o governo sul-coreano aceitou as exigências do Talibã e começou a retirar suas forças.\n\nO Talibã anunciou que um resgate de vinte milhões de dólares foi pago, mas o governo sul-coreano não fez nenhuma declaração a respeito."
 AFG_hostage_crisis.8.a: "O Afeganistão continua a se desestabilizar."
 AFG_hostage_crisis.9.t: "Reféns sul-coreanos executados"
 AFG_hostage_crisis.9.d: "Após uma crise envolvendo reféns no Afeganistão, o governo sul-coreano rejeitou todas as exigências do Talibã. Em seguida, o grupo anunciou que todos os reféns haviam sido executados."
 AFG_hostage_crisis.9.a: "Mais vítimas do conflito afegão."
 AFG_contact_iran.0.t: "Afeganistão Convoca Seu Povo de Volta"
 AFG_contact_iran.0.d: "Nossas brigadas Fatemiyoun estão crescendo no Irã e são compostas por homens afegãos hazaras xiitas. O Afeganistão está solicitando o retorno deles à sua terra natal, para que possam ajudar o país onde vivem há vários milênios."
 AFG_contact_iran.0.a: "Deixem-nos se unir às suas terras."
 AFG_contact_iran.0.b: "Não, precisamos de mão de obra."
 AFG_contact_iran.1.t: "Irã se Recusa a enviar nosso Hazaras Fatemiyoun"
 AFG_contact_iran.1.d: "Após solicitarmos a [PER.GetName] que enviasse de volta os Fatemiyoun para ajudar em [AFG.GetName], e após muitas comunicações entre nossas duas nações, os iranianos decidiram negar o pedido pelo retorno de nossos homens hazaras."
 AFG_contact_iran.1.a: "Alá sabe o que é melhor!"
 AFG_contact_iran.2.t: "Irã Aceita a enviar nosso Hazara Fatemiyoun"
 AFG_contact_iran.2.d: "[PER.GetName] aceitou nosso pedido pelo retorno de nossos soldados hazaras para ajudar e retornar à sua terra natal. Cinco divisões estão a caminho, com as bandeiras erguidas no alto, entoando “Zindabad Hazaristan!”."
 AFG_contact_iran.2.a: "Harakat! (Avante!)"
 AFG_contact_iran.3.t: "Afeganistão Solicita Adesão ao Eixo da Resistência"
 AFG_contact_iran.3.d: "Os hazaras xiitas do Afeganistão solicitaram a adesão ao Eixo da Resistência. Após a tomada do poder pelos hazaras no Afeganistão, eles agora estão solicitando sua admissão em nossa resistência."
 AFG_contact_iran.3.a: "Que o Coração se Una!"
 AFG_contact_iran.3.b: "Não aceitamos a solicitação."
 AFG_contact_iran.4.t: "Irã Aceita Nosso Pedido para Entrar em Sua Facção"
 AFG_contact_iran.4.d: "[PER.GetName] aceitou nosso pedido de adesão ao Eixo da Resistência. Juntos, somos mais fortes!"
 AFG_contact_iran.4.a: "Allahu Akbar!"
 AFG_contact_iran.5.t: "Iran Recusa"
 AFG_contact_iran.5.d: "[PER.GetName] recusou nosso pedido de adesão ao Eixo da Resistência. Não devemos mais contar com eles."
 AFG_contact_iran.5.a: "Triste"
 AFG_contact_iran.6.t: "Os Hazara do Afeganistão Declaram o Hazaristão"
 AFG_contact_iran.6.d: "Na manhã de hoje, Karim Khalili, político hazara do Afeganistão, declarou a criação de seu próprio Estado após os sucessos alcançados no país com reformas rápidas e a adoção do islamismo xiita. Centenas de milhares de hazaras foram às ruas de Cabul, Bamiyan, Mazar-i-Sharif e Herat para celebrar a declaração do Hazaristão."
 AFG_contact_iran.6.a: "Interessante"
 world_war.12.t: "A Questão de Taiwan"
 world_war.12.d: "Com as grandes potências do mundo envolvidas em uma guerra global de desgaste, restam poucos que poderiam intervir em favor de Taipei. A oportunidade de recuperar a província rebelde e concluir nossa reunificação pode não surgir novamente."
 world_war.12.a: "A Reunificação, finalmente"
 world_war.12.b: "Não podemos arriscar uma guerra"
 UNSC.8.t: "Recomendar Membro Permanente para [?global.current_sc_vote_nation.GetName]"
 UNSC.8.d: "[?global.current_sc_vote_nation.GetNameWithFlag] solicitou o estatuto de membro permanente do Conselho de Segurança das Nações Unidas. O Conselho deve recomendar a candidatura sem veto para que ela possa prosseguir para a Assembleia Geral.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_8_desc: "O Conselho recomendou o pedido de adesão a membro permanente. Agora ele será encaminhado para a Assembleia Geral para aprovação final."
 UNSC.13.t: "Um Novo Membro Permanente do Conselho de Segurança"
 UNSC.13.d: "O Conselho de Segurança e a Assembleia Geral aprovaram [?global.unsc_last_permanent_admission.GetNameWithFlag] como membro permanente do Conselho de Segurança das Nações Unidas. O país agora ocupa um assento permanente no Conselho e o poder de veto."
 UNSC.13.a: "O Conselho foi expandido."
 UN.22.t: "Membro Permanente do Conselho de Segurança para [?global.current_ga_vote_nation.GetName]"
 UN.22.d: "O Conselho recomendou [?global.current_ga_vote_nation.GetNameWithFlag] para membro permanente. A Assembleia Geral deve aprovar a candidatura por uma maioria de dois terços antes que o país conquiste um assento permanente e o poder de veto.\n\n$un_ga_vote_requires_2_3_tt$"
 econvent.16.t: "A Disseminação de Métodos Modernos de Produção"
 econvent.16.d: "Empresas em [ROOT.GetName] estão adotando métodos de produção aprimorados e reorganizando seus locais de trabalho. As mudanças estão elevando a produção em toda a economia."
 econvent.16.a: "Incentivar a Transição"
 econvent.17.t: "Investimentos em Educação Dão Frutos"
 econvent.17.d: "Anos de investimento em escolas e formação profissional ampliaram o leque de trabalhadores qualificados. Os empregadores estão aplicando essa experiência em usos produtivos."
 econvent.17.a: "Put these skills to work"
 econvent.18.t: "Foreign Technology Spreads Domestically"
 econvent.18.d: "Trade links have exposed local firms to better machinery and industrial practices. Domestic producers are now adapting those methods to their own operations."
 econvent.18.a: "Support domestic adoption"
 econvent.19.t: "Semiconductor Foundry Investment Announced"
 econvent.19.d: "A private consortium has committed to building a new semiconductor foundry in [ROOT.GetName]. Reliable access to industrial inputs and power has made the project commercially viable."
 econvent.19.a: "Welcome the investment"
 econvent.20.t: "Composite Industry Expansion Announced"
 econvent.20.d: "Manufacturers are expanding domestic composite production to supply advanced civilian and military industries. Investors expect secure raw materials to keep the new plant competitive."
 econvent.20.a: "Support the expansion"
 econvent.21.t: "Defense Contracts Expand Production"
 econvent.21.d: "New defense contracts have given manufacturers the confidence to expand production. The project will create skilled jobs while strengthening the national industrial base."
 econvent.21.a: "Award the contracts"
 econvent.22.t: "Commercial Shipbuilding Orders Surge"
 econvent.22.d: "Export demand and strong maritime business conditions have filled domestic order books. Shipbuilders are expanding capacity to meet the new contracts."
 econvent.22.a: "Back the shipyards"
 corruption.19.t: "A Year to Deliver"
 corruption.19.d: "Public pressure has created a narrow opportunity for meaningful reform. The government must turn that momentum into results before entrenched interests regroup."
 corruption.19.a: "Launch the anti-corruption drive"
 corruption.19.b: "Decline the challenge"