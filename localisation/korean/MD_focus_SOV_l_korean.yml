 SOV_cis_revolution_desc: "구 소련 공화국들의 노동자들은 소련의 불법적인 해체 이후 권력을 잡은 독재자와 자본가들에게 심하게 억압받고 있습니다! 우리는 동지들을 도와 그들을 우리 사회주의 가족의 일원으로 만들어야 합니다!"
