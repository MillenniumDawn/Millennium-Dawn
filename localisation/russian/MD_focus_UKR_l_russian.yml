 UKR_foreign_finances_category: "Иностранные финансы и влияние"
 UKR_foreign_finances_category_desc: "Независимая Украина унаследовала разрушенную экономику, и значительная часть денег, на которые живёт государство, поступает из-за рубежа. Здесь мы можем продавать государственные активы, просить кредиторов реструктурировать наши долги или обращаться за займами к §7Западу§! или §tВостоку§!. Мы также можем продвигать среди населения [SOV.GetFlag] §Yроссийские§! или [USA.GetFlag] §Yзападные§! интересы.\n\nНи один заём не даётся без условий. Каждый кредитор получает §Yвлияние§! на нашу политику, а баланс иностранного влияния определяет, какой блок победит на следующих выборах в §YВерховную Раду§!."
