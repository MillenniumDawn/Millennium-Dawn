 sp_monitor_portal_energy_emissions_project: "Мониторинг энергетических выбросов портала"
 sp_monitor_portal_energy_emissions_project_desc: "С помощью наших спутников мы будем отслеживать энергетические выбросы от ближайшего портала. Это позволит нам собрать больше информации о противнике и его передвижениях. В случае успеха мы также сможем избавиться от циклических сбоев в нашей спутниковой сети, вызванных этими выбросами."
 sp_monitor_portal_energy_emissions_project_prototype: "Аномальные энергетические сигнатуры"
 sp_monitor_portal_energy_emissions_project_prototype_desc: "Наши повреждённые спутники зафиксировали нерегулярные энергетические сигналы, которые они постоянно улавливают от порталов. Похоже, именно они являются причиной сбоев в работе нашей спутниковой сети. Мы можем подготовить контрмеры для защиты наших спутников от этих излучений, или же потратить больше времени на исследование этого явления, чтобы лучше его понять."
 sp_monitor_portal_energy_emissions_project_prototype_a: "Прогресс превыше всего"
 sp_monitor_portal_energy_emissions_project_prototype_b: "Потратить время на дополнительные исследования"
 sp_spies_in_hive_project: "Шпионы в улье"
 sp_spies_in_hive_project_desc: "Некоторые юниты Химеры после успешного штурма возвращаются в свою зону портала. На этом этапе они, похоже, действуют почти инстинктивно, что даёт возможность пометить их трекером и небольшой камерой. После этого мы позволим им вернуться в портал. Что может пойти не так?"
 sp_spies_in_hive_project_prototype: "Мехи станут нашими курьерами"
 sp_spies_in_hive_project_prototype_desc: "Поскольку мы производим мехов, мы можем использовать их для установки трекеров во время борьбы с силами Химеры. Это будет рискованно, и мы, безусловно, потеряем много хороших машин и их пилотов, но это может приблизить нас к завершению этой войны."
 sp_spies_in_hive_project_prototype_a: "Использовать только мехи"
 sp_spies_in_hive_project_prototype_b: "Мы не можем потерять слишком много мехов, армия поможет"
 sp_spies_in_hive_project_prototype_c: "Не рисковать лишний раз"
 sp_the_tesla_weapon_project: "Оружие T.E.S.L.A"
 sp_the_tesla_weapon_project_desc: "Тактическая электромагнитная система линейного уничтожения (T.E.S.L.A.) — это сверхмощное оружие, предназначенное для излучения мощного электромагнитного импульса (ЭМИ), способного выводить из строя электронные системы в широком радиусе. Это оружие может стать ключом к нарушению работы порталов и окончательному ослаблению сил Химеры."
 sp_the_tesla_weapon_project_prototype: "Переориентация научно-исследовательского сектора"
 sp_the_tesla_weapon_project_prototype_desc: "Мы можем перенаправить все наши исследовательские усилия на разработку оружия T.E.S.L.A. Это ускорит проект, но может задержать другие важные исследовательские инициативы."
 sp_the_tesla_weapon_project_prototype_a: "Все исследования — на T.E.S.L.A."
 sp_the_tesla_weapon_project_prototype_b: "Распределить исследования"
 sp_the_tesla_weapon_project_prototype_c: "Мы не можем позволить себе задержки"
 sp_hacs_gen_one_project: "BF-38 «Атлас»"
 sp_hacs_gen_one_project_desc: "Первое поколение высокоманевренных боевых мехов (HACS) станет важной вехой в нашей борьбе против Химеры. Эти мехи станут нашим главным оружием в борьбе с силами Химеры."
 sp_hacs_gen_one_project_prototype_western_one: "Прочность или огневая мощь?"
 sp_hacs_gen_one_project_prototype_western_one_desc: "Поле боя — суровое место, и наши мехи должны выдерживать массированный огонь, нанося при этом мощные удары по противнику. Мы можем сосредоточиться на повышении живучести наших HACS, сделав их более устойчивыми в бою. В качестве альтернативы мы можем отдать приоритет огневой мощи, оснастив наши мехи передовым вооружением для быстрого уничтожения врагов."
 sp_hacs_gen_one_project_prototype_western_one_a: "Повысить живучесть"
 sp_hacs_gen_one_project_prototype_western_one_b: "Приоритет огневой мощи"
 sp_hacs_gen_one_project_prototype_western_one_c: "Всё идеально и так"
 sp_hacs_gen_one_project_prototype_western_two: "Приоритет компонентов HACS"
 sp_hacs_gen_one_project_prototype_western_two_desc: "У нас есть свободные средства для улучшения конструкции наших HACS. Мы можем сосредоточиться на повышении мобильности наших мехов, сделав их быстрее и маневреннее на поле боя. В качестве альтернативы мы можем инвестировать в улучшение их систем вооружения, повысив их наступательные возможности."
 sp_hacs_gen_one_project_prototype_western_two_a: "Упор на мобильность"
 sp_hacs_gen_one_project_prototype_western_two_b: "Упор на вооружение"
 sp_hacs_gen_one_project_prototype_eastern_one: "Возможное упрощение производства"
 sp_hacs_gen_one_project_prototype_eastern_one_desc: "Мы можем отказаться от некоторых предохранительных триггеров и резервных систем в нашей конструкции HACS, чтобы ускорить производство. Хотя это может привести к небольшому увеличению частоты неисправностей, это позволит нам быстрее развертывать больше мехов на поле боя."
 sp_hacs_gen_one_project_prototype_eastern_one_a: "Они нам срочно нужны"
 sp_hacs_gen_one_project_prototype_eastern_one_b: "Над этим стоит ещё поработать"
 sp_hacs_gen_one_project_prototype_eastern_one_c: "Сохранить нынешние стандарты производства"
 sp_hacs_gen_one_project_prototype_eastern_two: "Эффективность на поле боя"
 sp_hacs_gen_one_project_prototype_eastern_two_desc: "Мы можем построить большее количество мехов HACS, чтобы сокрушить противника за счёт численного превосходства. В качестве альтернативы, мы можем сосредоточиться на улучшении конструкции наших мехов, чтобы сделать их более эффективными в бою, даже если это означает производство меньшего количества единиц."
 sp_hacs_gen_one_project_prototype_eastern_two_a: "Нам нужно больше мехов"
 sp_hacs_gen_one_project_prototype_eastern_two_b: "Улучшим их конструкцию"
 sp_hacs_gen_two_project: "GSK-41 «Богатырь»"
 sp_hacs_gen_two_project_desc: "Настал момент для очередного обновления наших новейших величественных мехов HACS. Благодаря увлечённым гражданским инженерам и учёным нам удалось ещё больше улучшить конструкцию наших мехов. Возможно, мы даже найдём способ сделать их производство дешевле."
 sp_hacs_gen_two_project_prototype_western_one: "Снижение затрат на рэндаллит"
 sp_hacs_gen_two_project_prototype_western_one_desc: "Просматривая старые исследовательские записи, мы нашли несколько идей о том, как уменьшить количество рэндаллита, используемого в производстве HACS. Внедрение этих изменений позволит снизить стоимость каждого меха без существенного влияния на его характеристики."
 sp_hacs_gen_two_project_prototype_western_one_a: "Конечно!"
 sp_hacs_gen_two_project_prototype_western_one_b: "Мы не можем ослаблять наши мехи"
 sp_hacs_gen_two_project_prototype_eastern_one: "Снижение затрат на рэндаллит"
 sp_hacs_gen_two_project_prototype_eastern_one_desc: "Благодаря новым исследованиям рэндаллита мы нашли способ ещё больше сократить количество этого ценного ресурса, используемого в производстве HACS. Это позволит нам производить больше мехов с тем же количеством рэндаллита, но при этом придётся пожертвовать некоторыми характеристиками."
 sp_hacs_gen_two_project_prototype_eastern_one_a: "Конечно, почему бы и нет?"
 sp_hacs_gen_two_project_prototype_eastern_one_b: "Это слишком серьёзный минус на поле боя"
 sp_hacs_gen_three_project: "SAS-32 «Геркулес»"
 sp_hacs_gen_three_project_desc: "Это идеальная модернизация мехов HACS — самая мощная модель, которую мы сейчас способны производить. Она позволит нам сражаться с Химерой в полную силу."
 sp_hacs_gen_three_project_prototype_one: "Абсолютное оружие"
 sp_hacs_gen_three_project_prototype_one_desc: "Наши инженеры предложили радикальную модернизацию мехов HACS с целью создания абсолютного оружия против Химеры. Эта новая конструкция расширит границы существующих технологий, в результате чего получится мех, который будет быстрее, мощнее и выносливее, чем когда-либо прежде, но по гораздо более высокой цене."
 sp_hacs_gen_three_project_prototype_one_a: "Вот оно, абсолютное оружие"
 sp_hacs_gen_three_project_prototype_one_b: "Они нам нужны прямо сейчас!"
 sp_hacs_gen_three_project_prototype_one_c: "Нынешняя конструкция идеальна"
