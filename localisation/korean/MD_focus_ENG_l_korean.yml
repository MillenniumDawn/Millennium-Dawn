 ENG_inner_circle_andrew.06.d: "제프리 엡스타인과의 관계로 인한 파장 이후 앤드루 왕자는 정치적으로 기피 대상이 되었습니다. 대중과 기관의 압박이 높아지는 가운데 그는 왕실 내에 남아 있던 지위를 박탈당하고 측근 집단에서 제외되었습니다."
 ENG_military.046.t: "워싱턴의 동반자 관계 승인"
 ENG_military.046.d: "미국은 영국을 주요 비NATO 동맹국으로 공식 지정했습니다. 이 전략적 동반자 관계는 더 깊은 방위 협력과 미국 군사 기술에 대한 우선적 접근권으로 가는 문을 열어 줍니다."
 ENG_military.046.a: "대서양 건너편의 귀중한 친구"
 ENG_military.047.t: "워싱턴의 동반자 관계 거절"
 ENG_military.047.d: "미국은 주요 비NATO 동맹국 지정에 대한 우리의 요청을 거절했습니다. 특별한 관계는 유지되지만, 워싱턴은 현재로서는 이를 더 공식화할 준비가 되어 있지 않습니다."
