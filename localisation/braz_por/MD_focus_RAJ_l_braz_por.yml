 indian_event.53.t: "Tratado de União com a Índia"
 indian_event.53.d: "Uma delegação indiana chegou hoje à nossa capital com uma proposta de cooperação militar e amizade entre nossos países. Há algum tempo que procuramos um potencial aliado forte na Ásia, e agora esta oportunidade apareceu. O que escolheremos?"
 indian_event.53.a: "Amizade é melhor que guerra"
 indian_event.53.b: "A Índia não é nossa opção"
 indian_event.54.t: "Proposta para dividir esferas de influência no Afeganistão"
 indian_event.54.d: "Como agora somos aliados da Índia, surgiu a questão de criar uma ligação terrestre entre os nossos países, dividindo as esferas de influência no Afeganistão. A proposta é muito tentadora, porque desta forma podemos expandir nossa esfera de influência e fortalecer nossa posição no mundo."
