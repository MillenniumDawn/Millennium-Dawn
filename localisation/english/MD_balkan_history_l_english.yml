l_english:
 balkan_news.1.t: "Karadžić Convicted of Genocide"
 balkan_news.1.d: "The Hague tribunal has found Radovan Karadžić guilty of genocide in Srebrenica and of crimes against humanity across Bosnia, and sentenced him to forty years. Two decades after Dayton, the wartime leader of the Bosnian Serbs has been judged by the court his war brought into being."
 balkan_news.1.a: "The verdict is read aloud in Sarajevo"
 balkan_news.1.b: "A verdict against all Serbs, some say"
 balkan_news.1.c: "Justice, delayed"
 balkan_news.2.t: "Life Sentence for Karadžić"
 balkan_news.2.d: "The appeals chamber has rejected Radovan Karadžić's appeal and raised his sentence to life imprisonment, ruling the original forty-year term inadequate for the gravity of his crimes. It is the final word on the man who led Republika Srpska through the war."
 balkan_news.2.a: "The Hague closes the case"
 balkan_news.3.t: "Mladić Convicted of Genocide"
 balkan_news.3.d: "The tribunal has convicted Ratko Mladić of genocide, war crimes, and crimes against humanity, and sentenced him to life imprisonment. The former general shouted at the judges and had to be removed from the courtroom before the reading finished. In Srebrenica, the mothers of the dead watched in silence."
 balkan_news.3.a: "The general answers at last"
 balkan_news.4.t: "Suicide in the Courtroom"
 balkan_news.4.d: "Moments after judges upheld his twenty-year sentence, the Bosnian Croat general Slobodan Praljak declared he was no war criminal and drank a vial of poison before the cameras. He died within hours. The appeals chamber confirmed the convictions of all six former Herzeg-Bosnia leaders, finding a joint criminal enterprise that reached into Zagreb."
 balkan_news.4.a: "He refused the court's justice"
 balkan_news.4.b: "A grim end to the tribunal's last case"
 balkan_news.5.t: "Mladić's Appeal Rejected"
 balkan_news.5.d: "United Nations judges have upheld Ratko Mladić's genocide conviction and life sentence, closing the last major case arising from the Bosnian war. A quarter century after Srebrenica, the judicial reckoning with the war is complete. The political reckoning is not."
 balkan_news.5.a: "The archive closes"
 CRO_nat_populism_gain_tt: "§RThe nationalist right gains support.§!"
