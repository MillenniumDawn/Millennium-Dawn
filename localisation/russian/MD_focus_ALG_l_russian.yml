 ALG_appoint_ouyahia_tt: "Ахмед Уяхья — опытный технократ, хорошо знающий систему изнутри."
 ALG_appoint_sellal_tt: "Абдельмалек Селлаль надёжен и лоялен, хотя и не отличается энергичностью."
 ALG_appoint_djerad_tt: "Абдельазиз Джерад — человек с реформаторской репутацией и слабыми связями с укоренившимися сетями."
 ALG_appoint_benbitour_tt: "Ахмед Бенбитур компетентен и достаточно независим, но это может встревожить режим."
 ALG_appoint_bedoui_pm_tt: "Нуреддин Бедуи — лояльный администратор, которому доверяет президентское окружение."
 ALG_appoint_tebboune_tt: "Абдельмаджид Теббун — умеренный реформатор, оставляющий место для гражданского контроля."
 ALG_appoint_gaaid_salah_tt: "Ахмед Гаид Салах тесно связан с военной верхушкой."
 ALG_appoint_civilian_mod_tt: "Назначение гражданского ослабит самостоятельность военных, но может вызвать сопротивление."
 ALG_appoint_reformist_mod_tt: "Генерал-реформатор мог бы сочетать авторитет в армии с более широким гражданским контролем."
 ALG_appoint_hardliner_mod_tt: "Генерал жёсткой линии успокоит офицерский корпус и укрепит силовые сети."
 ALG_appoint_hardliner_moi_tt: "Сторонник жёсткой линии в МВД укрепит внутренний порядок, но расширит репрессивную политику."
 ALG_appoint_reformist_moi_tt: "Администратор-реформатор ослабит роль министерства в глубинном государстве."
 ALG_appoint_technocrat_moi_tt: "Лояльный технократ обеспечит административную надёжность без резких перемен."
 ALG_appoint_prowestern_mofa_tt: "Такой выбор развернёт алжирскую дипломатию к прагматизму в отношениях с Западом."
 ALG_appoint_panarab_mofa_tt: "Такой выбор сделает упор на арабскую солидарность и региональные союзы."
 ALG_appoint_nonaligned_mofa_tt: "Такой выбор сохранит традиционный внеблоковый курс Алжира."
 ALG_appoint_freemarket_mof_tt: "Экономист-рыночник будет продвигать либерализацию и бюджетную дисциплину."
 ALG_appoint_statist_mof_tt: "Министр-этатист сделает ставку на государственное управление экономикой."
 ALG_appoint_bureaucrat_mof_tt: "Лояльный чиновник обеспечит преемственность и административный контроль."
 ALG_appoint_sonatrach_moe_tt: "Человек из Sonatrach углубит связь государства с энергетикой и успокоит отраслевую верхушку."
 ALG_appoint_international_moe_tt: "Международный эксперт сделает ставку на эффективность и доверие извне."
 ALG_appoint_loyal_moe_tt: "Лояльный администратор сохранит устойчивый политический контроль над энергетикой."
 ALG_appoint_independent_moj_tt: "Независимый судья снизит политическое вмешательство в работу судов."
 ALG_appoint_security_moj_tt: "Прокурор из силовиков теснее свяжет правосудие с задачами государственной безопасности."
 ALG_appoint_loyalist_moj_tt: "Лоялист обеспечит политическую надёжность судебной системы."
 ALG_appoint_tartag_tt: "Атман Тартаг олицетворяет преемственность внутри силового аппарата."
 ALG_appoint_mediene_tt: "Мохамед Медьен вернул бы во власть одну из самых влиятельных фигур глубинного государства в истории Алжира."
 ALG_appoint_loyalist_drs_tt: "Лояльный офицер усилит президентский контроль, хотя старые сети сохранятся."
 ALG_appoint_civilian_drs_tt: "Гражданский специалист по разведке стал бы сильным ударом по глубинному государству."
 ALG_appoint_reformist_drs_tt: "Офицер-реформатор мог бы постепенно поставить спецслужбы под более прочный гражданский контроль."
 ALG_ds_accepts_mod_change_tt: "Военная верхушка недовольна, но назначение останется в силе."
 ALG_ds_appeased_tt: "Политические уступки успокоили офицерский корпус."
 ALG_intelligence_network_resists_tt: "Аппарат разведки будет сопротивляться переменам."
 ALG_intelligence_network_appeased_tt: "Силовые сети пока успокоены."
 ALG_loyalist_cabinet_tt: "Перестановка сделает ставку на лоялистов и проверенных людей режима."
 ALG_technocrat_cabinet_tt: "Перестановка сделает ставку на компетентность и управленческий опыт."
 ALG_reform_cabinet_tt: "Перестановка сделает ставку на реформаторов и ослабит укоренившиеся сети."
 ALG_force_loyalty_tt: "Министров принуждают публично выказать покорность."
 ALG_loyalty_accepted_tt: "Правительство сомкнуло ряды вокруг президента."
 ALG_loyalty_resignation_tt: "Кое-кто воспротивился, и компетентность просела: на освободившиеся места пришли покладистые."
 ALG_buy_loyalty_tt: "Раздача благ обеспечила лояльность населения."
 ALG_back_down_loyalty_tt: "Отступление подорвало авторитет президента."
 ALG_dismiss_disloyal_tt: "Нелояльные министры будут отправлены в отставку."
 ALG_negotiate_disloyal_tt: "Единство правительства сохранят негласными сделками."
 ALG_ignore_disloyal_tt: "Если закрыть на это глаза, соперники осмелеют."
 ALG_accept_ds_pressure_tt: "Глубинное государство усилит влияние в правительстве."
 ALG_resist_ds_pressure_tt: "Президент не уступит нажиму, даже рискуя открытым столкновением."
 ALG_compromise_ds_pressure_tt: "Ограниченный компромисс может выиграть время, не означая полной капитуляции."
