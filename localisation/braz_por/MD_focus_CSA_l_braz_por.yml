 CSA_second_american_republic_desc: "[CSA.GetFlag]§YSouthern Republic of America§! Changes Name To The §Y2nd American Republic§!"
 CSA_decisions_war_time_mobilization_category: "Mobilização em tempo de guerra"
 CSA_decisions_war_time_mobilization_category_desc: "Quando a necessidade surgir, podemos convocar uma legião de voluntários para, pelo menos, preencher as lacunas nas linhas. Pois não sabemos quando a guerra virá, mas sabemos que ela estará sobre nós."
 CSA_war_time_mobilization: "Mobilização da 1ª Onda"
 CSA_war_time_mobilization_desc: "O chamado às armas está sobre nós e devemos nos unir para garantir a defesa de nossos lares. Às armas pelos garotos de Dixie!"
 CSA_war_second_wave_defenders: "Defensores da 2ª Onda"
 CSA_war_second_wave_defenders_desc: "O inimigo pressiona para frente, portanto, precisamos recrutar outra onda de defensores. O moral da nação sofrerá, mas precisamos das tropas."
 CSA_war_desperate_defenders: "Defensores Desesperados"
 CSA_war_desperate_defenders_desc: "As coisas estão ficando sombrias, precisamos de todos os corpos disponíveis, capazes ou não, para segurar a linha. Talvez, só talvez, ainda consigamos vencer isso."
 southern_republic_event.1.t: "A Questão Capital"
 southern_republic_event.1.d: "In the wake of the aftermath that was the \"Great Riots\" of the former United States, many of the local governors are scrambling to make their states as appealing to an independent body of where the new Republic's capital should be. Some believe that it should be as central as possible and place the city of Meridian Mississippi as an optimal option. Some believe only Atlanta is the real choice being one of the most developed metropolitan areas of the South. While some cite historic symbolism and wish to have Charleston as the new capital, whatever the choice is it'll need to be sooner rather than later if we are to actually focus on our more pressing problems."
 southern_republic_event.1.o1: "Acabamos de passar por isso e estamos fazendo um concurso de beleza!?!"
 southern_republic_event.2.t: "A escolha do comitê"
 southern_republic_event.2.d: "After a handful of days as well as many pressures exerted by local officials to choose them the committee has come up with four distinctive choices. New Orleans for its trading hub and naval apparatus, Meridian in Mississippi for its strategic centrality when thinking of the old confederacy. Then there is Atlanta, the South's most developed metropolitan hub, which economically and governing wise would be kind of commonsense of a choice. Finally there is the historic symbolism that is making Charleston the capital. Charleston appeals to the right as well as it appeals to the Southern identity movement that's been growing ever more. Regardless the committee's choice is what determines who gets what."
 southern_republic_event.2.o1: "Nova Orleans claramente vence Atlanta"
 southern_republic_event.2.o2: "O Coração de Dixie Deveria Ser o Coração, Meridian É"
 southern_republic_event.2.o3: "Atlanta é a única escolha real aqui"
 southern_republic_event.2.o4: "Nossa História é Nossa Identidade, Charleston é Escolhida"
 southern_republic_event.3.t: "O Teatro Político"
 southern_republic_event.3.d: "The Southern states are host to a complete natural disaster's worth of political factions and ideological influences. Not only does the South have to worry about the natural disasters of mother nature herself but of the excesses and fighting of its political extremes. From niche Klan members, to Socialist revolutionaries we have to properly navigate this storm if we are to enjoy what little peace we've been able to establish so far."
 southern_republic_event.3.o1: "Essa ralé não é uma ameaça"
 southern_republic_event.3.o2: "Deveríamos ser mais cautelosos sobre quem pode ser eleito"
 southern_republic_event.4.t: "Os Partidos Estáveis"
 southern_republic_event.4.d: "Na esteira do nosso renascimento político, precisamos olhar para quem poderia nos tornar uma nação mais estável. Esses \"moderados\", como a zombaria da alt-right e alt-left tendem a rotulá-los, indicam que esses são os partidos mais cautelosos. Procurando por mudanças, mas não de uma forma maratona, mas sim um passeio agradável ou um ritmo leve de corrida, precisamos entender quem são esses partidos se quisermos ajudar a garantir que eles solidifiquem o apoio sobre os outros partidos do tipo mais rebelde."
 southern_republic_event.4.o1: "Graças a Deus pelas pessoas cautelosas"
 southern_republic_event.5.t: "O Partido Conservador do Sul"
 southern_republic_event.5.d: "The SCP is a fairly moderate party in the grand scheme of the \"Stable\", group of parties. Being generally a center-right party it tends to be more of a reminder of the old democratic and republican parties and their moderate wings. Being more for gradual change rather than large swift changes, this party ensures that if change is needed it's tackled in a more thought out manner rather than the fanfare mentality that can arise in more sensitive topics. In terms of social policies it ensures that change is always happening but we must embrace it at a comfortable pace to keep the national cohesion. Economically they are for deregulation, but not opposed to more commonsense based regulations to curb exploitative means."
 southern_republic_event.5.o1: "O SCP traz paz"
 southern_republic_event.5.o2: "As perucas vencerão"
 southern_republic_event.5.o3: "O PDP prevalecerá"
 southern_republic_event.6.t: "A festa da peruca de Dixie"
 southern_republic_event.6.d: " The WPD is a more classical liberal party which aims to use the old school of liberal doctrine to secure a stable and progressing government to ensure the freedom and equality for all. Seeking more of equal opportunity availability the WPD is socially more fluid towards changes but does not see the need to enforce governmental sanctions unless the issue at hand is not truly handled at the state and or local levels first. Economically they believe in regulations overall with a focus in anti-monopoly or more generally anti-competitive practices regulation. But aside from this sort of \"fair game\" strategy in regulations the WPD prefer a more hands-off approach if and when possible."
 southern_republic_event.6.o1: "Regulamentos de senso comum fazem sentido"
 southern_republic_event.6.o2: "A verdadeira competição é uma oportunidade real"
 southern_republic_event.6.o3: "Amálgamas Econômicas São Anti-Sulistas"
 southern_republic_event.7.t: "O Partido Democrático Progressista"
 southern_republic_event.7.d: "The PDP is a more traditional democratic-socialist party like its European counterparts, the party looks to use the powers of democracy to ensure the fair treatment of the workers of the nation and wishes to usher in a soft socialism. This means socially speaking the party is more liberal with only holding traditional values on what the voting majority believe is worth keeping traditional. Economically they are soft Socialists, looking to use the power of regulations to keep the workers fed and cared for they are not entirely pro-nationalization however if the private sector acts too unruly it is not out of the question as a stand in to help the exploited masses."
 southern_republic_event.7.o1: "O SCP garante a estabilidade do sul"
 southern_republic_event.7.o2: "As perucas usarão o estilo sulista"
 southern_republic_event.7.o3: "O PDP criará o socialismo do sul"
 southern_republic_event.8.t: "O Partido Federalize Dixie"
 southern_republic_event.8.d: "The FDP is essentially the compromising party. Looking to find a happy middle ground of the federal unitarian type government of the union and the more heavily minarchist confederate government, the FDP wishes to marry the two into an earnest and father like figure of a structure to keep peace as well as order to the nation at large. Being both socially and economically off hand its only plans are to direct central funding and services to the poorest of regions to ensure the very bottomline of the nation is not so far down from the rest. Many lambast this as pseudo-socialism, but the FDP fires back at them wondering how much do these supposed \"honorable members of state\" really care about its constituents or do they care more about their friends and paycheck."
 southern_republic_event.8.o1: "A palavra federal não é uma calúnia, mas uma realidade"
 southern_republic_event.8.o2: "O SIP da Vitória é uma Vitória do Sul"
 southern_republic_event.8.o3: "O SLP libertará Dixie"
 southern_republic_event.9.t: "O Partido da Identidade do Sul"
 southern_republic_event.9.d: "The SIP is a niche kind of single issue party. They are more socially indifferent, leading to any and all major social issues to be handled locally rather than nationally. In terms of economics they are a sort of, \"if it isn't broke don't fix it\", kind of mentality. Meaning they'll do regulations or deregulations, but only if it's perceived as a genuine issue to the economic stability of the nation. As for the supposed single issue, the SIP has most of its focus on cultivating and ensuring a real and concrete plan to create a Southern identity. Using things like the more minarchist views of the old confederacy mixed in with some stylistic inspirations from them as well as promoting local food and music culture as Southern culture. The party wishes to move away from the past and make a future that is earnestly and equally Southern for all."
 southern_republic_event.9.o1: "Liberte e alimente Dixie"
 southern_republic_event.9.o2: "Estilo sulista para gente do sul"
 southern_republic_event.9.o3: "Dixie Liberty para valores Dixie"
 southern_republic_event.10.t: "O Partido da Liberdade do Sul"
 southern_republic_event.10.d: "The SLP is an interesting makeup of a party. Being more or less the remnants of the old Libertarian Party, the SLP has decided to embrace a compromise of Southern cultural and governmental values with a Libertarian spin to help with the complete decentralization. Many in the SLP see a full return to either pro-Libertarianism and or pro-Confederation of government as a sure way to recreating the failure that was the Articles of Confederation. Regardless the party is anti-government intervention in the economy and socially it is very hands off, leaving such things to the state governments means that locals handle local issues. Though the SLP is not afraid of things like welfare and healthcare programs to ensure the bottomline of the nation are able to have some kind of footing to kick in the door of opportunity."
 southern_republic_event.10.o1: "O FDP entende a governança"
 southern_republic_event.10.o2: "O SIP criará um verdadeiro governo do sul"
 southern_republic_event.10.o3: "A liberdade do sul é governar o sul"
 southern_republic_event.11.t: "As Partes Excepcionais"
 southern_republic_event.11.d: "Within the general Overton window of the southern republic, we have two distinctive parties which some honestly debate if they are even real political parties to begin with. Regardless first off we have the DDP or Dixie & Delta Party. Founded by a former railroad enthusiast turned novice political leader, this party seems to be more of a single-issue party in relation to public transportation. However they have alluded to the fact that said investments in PT as they call it for short, would indeed have knock on economic effects when it comes to urbanization as well as connectivity within the nation itself. On the Other hand we have the Party for Economic Prosperity or PEP for short. This party styles itself as a party focused on economic development and ensuring the standards of the nation are brought up through real economic investments. What they don't tell you is that said party is also full of big agricultural money as well as a soft plantation class of supporters. Regardless both the PEP and DDP are seen as interesting forces on their own right but nothing too far to shake the foundations."
 southern_republic_event.11.o1: "O desenvolvedor de Dixie"
 southern_republic_event.11.o2: "O economista Dixie"
 southern_republic_event.100.t: "Os Ventos da Mudança"
 southern_republic_event.100.d: "In the lead up to the first elections, the state of the nation has been too much to bear for many. As a result rising radicalism has been seen on both sides of the political scene. With neo-confederates, fascist and much more on the right. The union of revolution and southern communist association leading the charge on the left. Many wonder just who will take the wind out of the sails of the other sides. For now continued rise in factionalism has resulted in..."
 southern_republic_event.100.o1: "Agitadores socialistas reúnem a força de trabalho"
 southern_republic_event.100.o2: "Orgulho histórico teimoso toma conta das massas"
 southern_republic_event.101.t: "Identitários Confederados"
 southern_republic_event.101.d: "The Confederate Workers Party desperate to keep ahead in the polls has recently sought out the help of the Southern Tradition Party. These two while fairly opposite of one another have united on the principle of \"The Confederate Dream\". Hoping to establish the rightful south and restore the lands of old, these two opposites have seemingly attracted one another in a gamble for the first election victory of the new nation. For the first steps are the most important in the road to recovery and stability."
 southern_republic_event.101.o1: "Uma Frente Unida se Forma"
 southern_republic_event.101.o2: "Formas de uma sociedade de agricultores"
 southern_republic_event.102.t: "A Sociedade Agrária"
 southern_republic_event.102.d: "The main counter push and equally as desperate Union of Revolution Party has seen fit to align itself with the Agrarian Union Party. These two working together create the perfect oxymoron as one is clearly an oligarchic big agriculture party and the other is the closest thing to anarcho-communism that you'll see. But desperate times call for desperate measures. Both parties believe that the true pillar to a stable and complacent society is that of the agrarian society. Simple organization and most production efforts and organized labor goes towards making food, what better way to mold the society than by giving it a basic fundamental of living itself. Regardless they'll have to push hard as things are heating up as the elections come ever closer."
 southern_republic_event.102.o1: "A Frente Confederada Lidera Nas Pesquisas"
 southern_republic_event.102.o2: "Promessas de barrigas cheias mostram resultados promissores"
 southern_republic_event.200.t: "A direita consolida"
 southern_republic_event.200.d: "Com a recente mudança no ethos nacional, muitos têm se aproximado de partidos mais de direita. Isso deixou moderados e esquerdistas muito preocupados, dada a história da nação. Independentemente disso, os medos chegaram ao auge quando o Dixie First Party e a League Of The South se uniram sob a Dixie Purity League. Muitos moradores locais temem a quase queda das reformas sociais retrógradas que a liga pode criar, o que já resultou em uma migração constante para fora da nação. Com medo dos neoconfederados e fascistas se unindo, muitos estão procurando alternativas reais para que possam impedir que tal força vença a eleição."
 southern_republic_event.200.o1: "A Nação Anseia Por Pureza"
 southern_republic_event.200.o2: "Potenciais migrantes correm para se alistar"
 southern_republic_event.201.t: "O aumento do alistamento vê o contranacionalismo"
 southern_republic_event.201.d: "With the consolidation of the \"Fringe Right\", as opposition nationalist proclaim and sneer at them, many would be targets of such policies have begun to enlist and as a result the political clout of the military has become more and more swaying in its influence. With this the Modern Monarchist Movement known as the House Of Meridian has joined forces with the armed forces to consolidate a counter nationalist movement. Many are hopeful that if we must go down such a path that at least duty to country is better than anything a fascist or ultra-nationalist leadership would have."
 southern_republic_event.201.o1: "As Franjas Lutam Continuam"
 southern_republic_event.201.o2: "Um exército \"real\" parece divertido"
 southern_republic_event.12.t: "As demandas do Sul"
 southern_republic_event.12.d: "Nossos vizinhos a oeste exigiram nossa subjugação, a promessa supostamente, de emular a independência do estado texano como um parceiro confederado dentro da nação sulista. Não temos certeza de qual é o objetivo final deles, mas depende de nossa própria crença em nossas forças militares se podemos recusar sinceramente tais demandas."
 southern_republic_event.12.o1: "Somos o primeiro e único texano!"
 southern_republic_event.12.o2: "Se ao menos tivéssemos mais tempo... concordamos."
 southern_republic_event.13.t: "Texas se recusa"
 southern_republic_event.13.d: "A nação texana recusou nossa oferta generosa e agora a bola está em nossa quadra. Podemos arriscar um conflito geral e potencialmente ele transbordar, ou podemos recuar. Ambas são opções viáveis, mas uma claramente tem mais risco do que a outra."
 southern_republic_event.13.o1: "Nenhum sulista recua de uma luta"
 southern_republic_event.13.o2: "Talvez tenhamos apressado um pouco as coisas"
 southern_republic_event.14.t: "O Texas aceita nossa oferta"
 southern_republic_event.14.d: "Com a aceitação deles, agora podemos avançar como uma frente unida para atingir uma meta real para a unidade regional. Embora, é claro, haverá mentes um pouco inquietas para essa nova união de tipos, mas é um começo, pelo menos."
 southern_republic_event.14.o1: "Hot Diggity Droga, funcionou!"
 southern_republic_event.15.t: "A Proposta do Sul"
 southern_republic_event.15.d: "A nação do Sul veio até nós com uma oferta para se tornar uma união confederal com eles. Eles prometem uma autogovernança justa, mas com o objetivo principal de unir a política externa em uma nova união regional. Isso pode ser muito vantajoso para nossa situação, pois anularia nossas sanções internacionais sob o pretexto de não \"existir\". No entanto, isso pode ser um estratagema para apenas nos usar, seja qual for o caso, precisamos dar uma resposta."
 southern_republic_event.15.o1: "Não nos submetemos a qualquer um"
 southern_republic_event.15.o2: "Eu gosto de perder sanções, claro que concordamos"
 southern_republic_event.16.t: "Cuba nos recusa"
 southern_republic_event.16.d: "The Cubans have refused our demands, now the question is do we want to risk prolonged war through naval warfare and making an invasion force. We do what we can, but it may turn out more costly than what it was worth."
 southern_republic_event.16.o1: "Nós vamos para a guerra!"
 southern_republic_event.16.o2: "Não poderíamos pagar por isso agora"
 southern_republic_event.17.t: "Cuba aceita nosso acordo"
 southern_republic_event.17.d: "Os representantes cubanos aceitaram nosso acordo e começaremos a elaborar leis e métricas unificadoras para criar uma união justa e estável no futuro próximo."
 southern_republic_event.17.o1: "As bebidas são por minha conta!"
 southern_republic_event.18.t: "Demandas do Sul"
 southern_republic_event.18.d: "A nação do Sul exigiu nossa subjugação em uma união confederal caribenha maior. Estamos em uma posição única, pois a nação é maior, mas também está a uma boa distância decente para nos permitir preparar forças de invasão. No entanto, está no ar se realmente arriscaremos tal conflito."
 southern_republic_event.18.o1: "Não vamos desistir!"
 southern_republic_event.18.o2: "Não podemos desperdiçar a vida dos nossos cidadãos"
 southern_republic_event.19.t: "Haiti se recusa"
 southern_republic_event.19.d: "A mancha de uma nação recusou nossas demandas, devemos agir agora ou segurar nossa língua. A situação diplomática está um pouco tensa, agora a razão ou a força prevalecerão."
 southern_republic_event.19.o1: "A Força de Vontade Vence"
 southern_republic_event.19.o2: "Não podemos arriscar isso"
 southern_republic_event.20.t: "Haiti aceita"
 southern_republic_event.20.d: "Eles aceitaram nossas exigências e começaremos a organizar as coisas. Hoje é um bom dia para nossa nação."
 southern_republic_event.20.o1: "Mais um passo em frente"
 southern_republic_event.21.t: "Demandas do Sul"
 southern_republic_event.21.d: "A nação do Sul exigiu nossa subjugação em uma união confederal caribenha maior. Estamos em uma posição única, pois a nação é maior, mas também está a uma boa distância decente para nos permitir preparar forças de invasão. No entanto, está no ar se realmente arriscaremos tal conflito."
 southern_republic_event.21.o1: "Não vamos desistir!"
 southern_republic_event.21.o2: "Não podemos desperdiçar a vida dos nossos cidadãos"
 southern_republic_event.22.t: "A República Dominicana se Recusa"
 southern_republic_event.22.d: "A mancha de uma nação recusou nossas demandas, devemos agir agora ou segurar nossa língua. A situação diplomática está um pouco tensa, agora a razão ou a força prevalecerão."
 southern_republic_event.22.o1: "A Força de Vontade Vence"
 southern_republic_event.22.o2: "Não podemos arriscar isso"
 southern_republic_event.23.t: "A República Dominicana aceita"
 southern_republic_event.23.d: "Eles aceitaram nossas exigências e começaremos a organizar as coisas. Hoje é um bom dia para nossa nação."
 southern_republic_event.23.o1: "Mais um passo em frente"
 southern_republic_event.24.t: "Ofertas do Sul"
 southern_republic_event.24.d: "A nação do Sul pediu para fechar um acordo conosco. Em troca da formação de uma união confederada, receberíamos qualquer ajuda material e/ou monetária se nossas ilhas fossem danificadas por eventos climáticos extremos. Isso certamente ajudaria a aliviar a pressão fiscal, mas poderia ser uma armadilha, no entanto, o que ganharíamos se negássemos... o que fazer, o que fazer."
 southern_republic_event.24.o1: "Não podemos aceitar neste momento"
 southern_republic_event.24.o2: "Não poderíamos deixar passar tal acordo"
 southern_republic_event.25.t: "The Bahamians Refuse"
 southern_republic_event.25.d: "Os representantes governamentais das Bahamas recusaram nosso acordo abertamente generoso. Poderíamos usar isso como justificativa, ou poderíamos encontrar outras maneiras. De qualquer forma, precisaremos tomar uma decisão em breve se quisermos manter o controle de nossas metas de política externa."
 southern_republic_event.25.o1: "Dane-se, declare guerra"
 southern_republic_event.25.o2: "Precisamos Reabordar Isso"
 southern_republic_event.26.t: "The Bahamians Accept"
 southern_republic_event.26.d: "Eles aceitaram nossas demandas e começaremos a organizar as coisas. Hoje é mais um passo em direção à nossa união regional."
 southern_republic_event.26.o1: "Tantas Ilhas"
 southern_republic_event.27.t: "A Concessão do Sul"
 southern_republic_event.27.d: "The Southern nation has reached out to us with an offer. They will give us a 100 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.27.o1: "Poderíamos usar o dinheiro"
 southern_republic_event.27.o2: "Essas ilhas são britânicas!"
 southern_republic_event.28.t: "Os britânicos aceitam"
 southern_republic_event.28.d: "The United Kingdom has accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.28.o1: "Valeu totalmente a pena"
 southern_republic_event.29.t: "The British Refuse"
 southern_republic_event.29.d: "Os malditos anglos recusaram nossa oferta abertamente generosa. O problema é que neste momento não podemos nos dar ao luxo de um incidente diplomático, então precisaremos abordar isso novamente para referência futura."
 southern_republic_event.29.o1: "Droga, tudo"
 southern_republic_event.30.t: "A Concessão do Sul"
 southern_republic_event.30.d: "The Southern nation has reached out to us with an offer. They will give us a 50 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.30.o1: "Poderíamos usar o dinheiro"
 southern_republic_event.30.o2: "Essas ilhas permanecerão francesas!"
 southern_republic_event.31.t: "Os Franceses Aceitam"
 southern_republic_event.31.d: "France has accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.31.o1: "Valeu totalmente a pena"
 southern_republic_event.32.t: "The French Refuse"
 southern_republic_event.32.d: "Os malditos francófonos recusaram nossa oferta abertamente generosa. O problema é que neste momento não podemos nos dar ao luxo de um incidente diplomático, então precisaremos abordar isso novamente para referência futura."
 southern_republic_event.32.o1: "Chupadores de sapo!"
 southern_republic_event.33.t: "O acordo do sul"
 southern_republic_event.33.d: "The Southern nation has reached out to us with an offer. They will give us a 25 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.33.o1: "Poderíamos usar o dinheiro"
 southern_republic_event.33.o2: "Ilhas holandesas para cidadãos holandeses!"
 southern_republic_event.34.t: "Os holandeses aceitam"
 southern_republic_event.34.d: "The Dutch have accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.34.o1: "Valeu totalmente a pena"
 southern_republic_event.35.t: "The Dutch Refuse"
 southern_republic_event.35.d: "Os malditos encanadores recusaram nossa oferta bastante generosa. O problema é que, neste momento, não podemos nos dar ao luxo de um incidente diplomático, então precisaremos abordar isso como referência futura."
 southern_republic_event.35.o1: "Condenação!"
 southern_republic_event.36.t: "Debates sobre Capital"
 southern_republic_event.36.d: "One of the problems with the old republic was the old capital of D.C. was seen as too far away for a vast majority of the nation. However, its symbolism cannot be discounted as well. We must therefore figure out just where our new capital should be."
 southern_republic_event.36.o1: "D.C. se saiu muito bem"
 southern_republic_event.36.o2: "O novo plano de Arlington é bom"
 southern_republic_event.36.o3: "O Monte Columbia é central o suficiente"
 southern_republic_event.36.o4: "Ulisses deve ficar bem"
 southern_republic_event.37.t: "O Novo Caminho Adiante"
 southern_republic_event.37.d: "With our policies set in stone and our influences assured we now have the great honor of choosing a new look for our nation. Of course the consensus is to rename the nation to the Confederate States of America as it is only right that we pay tribute to our past and origins. But the question now is the flag. Members of the Dixie First Party want to do the Virginia Battle Flag and update the color scheme so it's not just the Virginia Battle Flag as our great Confederacy is not just the tight asses of Virginian aristocracy. However members of the League of the South wish to take it a step further and use a flag their members have been using a while now which is a plain Virginia Battle Flag with no stars on it but instead a white circle in the center with one large lightning bolt in the center. Some wonder if the latter would be a bit on the nose in terms of political appeal. However more still wonder if its not going far enough, after all this land is truly our land."
 southern_republic_event.37.o1: "O esquema de cores alterado funciona"
 southern_republic_event.37.o2: "Lightning Shall Strike Fear Into Our Enemies"
 southern_republic_event.38.t: "Um novo padrão nacional"
 southern_republic_event.38.d: "Com a maioria da nação a bordo com a forma como administramos as coisas, há um debate geral sobre se nossa nação realmente se representa. Muitos na esquerda querem renomear a bandeira com simbolismo socialista para estabelecer um precedente de solidariedade com os trabalhadores da nação. Enquanto aqueles que estão na direita querem voltar um pouco para ser mais simbólico com as origens da nossa nação, reintroduzindo uma das últimas bandeiras com as quais a confederação se representou. Esta bandeira seria a antiga bandeira da mancha de sangue que tem uma bandeira de base branca com uma barra vermelha sólida no lado direito e no canto superior esquerdo fica a Bandeira de Batalha da Virgínia. Consequentemente, eles acreditam que o nome nacional deve ser alterado para simplesmente República de Dixie. No entanto, cabe ao público decidir sobre isso."
 southern_republic_event.38.o1: "A República Socialista É Isso"
 southern_republic_event.38.o2: "Nós somos a República de Dixie"
 southern_republic_event.39.t: "Seguindo em frente"
 southern_republic_event.39.d: "Com nossa inteligência sobre nós e as pessoas desfrutando de seu novo orgulho nacional, eles buscam a reforma em mostrar unidade enquanto também prestam respeito à nossa história, independentemente de ser boa ou ruim. Como tal, doravante seremos conhecidos como a Southern Union e orgulhosamente hastearemos a bandeira Bonnie Blue."
 southern_republic_event.39.o1: "Uma família sulista de fato"
 southern_republic_event.40.t: "Velhos hábitos, hein"
 southern_republic_event.40.d: "Com nossos caminhos estabelecidos e as pessoas felizes com esse novo propósito encontrado, achamos que é o momento certo para estabelecer uma nova bandeira e nome. Um dia poderemos reivindicar o manto. Mas, como dizem, velhos hábitos são difíceis de morrer."
 southern_republic_event.40.o1: "Talvez algum dia"
 southern_republic_event.41.t: "O sonho arcádico"
 southern_republic_event.41.d: "Hoje começa uma nova era, uma que nos coloca em uma nova identidade, um novo caminho de unidade e uma nova era de prosperidade. Hoje nos tornamos os povos Arcádios."
 southern_republic_event.41.o1: "Para Arcádia!!!"
 southern_republic_event.42.t: "Debate sobre a Capital Arcádia"
 southern_republic_event.42.d: "A nova nação surge e com ela um novo capítulo começa. Onde será nossa capital."
 southern_republic_event.42.o1: "É velho e confiável"
 southern_republic_event.42.o2: "Uma Capital Central Agradável Funciona Melhor"
 southern_republic_event.43.t: "Resistência Nacionalista"
 southern_republic_event.43.d: "Nos dias seguintes à nossa justa vitória nas primeiras eleições da nossa nação, os caipiras e bêbados da região selvagem da Flórida têm jogado mais do que apenas vômito de suas bocas. Embora não esperemos nada sinceramente que venha disso, muitos se perguntam o quão burro o \"homem da Flórida\" realmente é."
 southern_republic_event.43.o1: "Jesus, essa merda de novo não"
 southern_republic_event.44.t: "Agitação crescente"
 southern_republic_event.44.d: "In the aftermath of the supposed \"proclamation\" of statehood, the agitation in the state of Florida has steadily risen over the past few more days. This escalation brings fears that our young nation will soon enough be embroiled in war, not with the federals, great lakers or even the Texans but with our own people... This sad realization has resulted in a pre-emptive expansion in armaments production as a way to get ahead of potentially any trouble that may arise in the coming days."
 southern_republic_event.44.o1: "Que Deus nos ajude a todos..."
 southern_republic_event.45.t: "Uma briga de família"
 southern_republic_event.45.d: "They finally did it, the damn Floridians decided that apparently it was just too god damn much to try and work things out. Well by god we'll settle this here and now and make Florida, Southern again. We need to mobilize and set forth what troops we do have to the border."
 southern_republic_event.45.o1: "Caldeirão, mais como cérebro derretido"
 southern_republic_event.46.t: "Guerra"
 southern_republic_event.46.d: "Chegou a hora e retomaremos o que é nosso por direito."
 southern_republic_event.46.o1: "Enviem as tropas!"
 southern_republic_event.1000.t: "Defenda as nossas liberdades"
 southern_republic_event.1000.d: "A escória socialista deseja nos subjugar a uma vida de marxismo e pobreza, bem, não mais. Quebre as correntes e lute por suas liberdades!!!"
 southern_republic_event.1000.o1: "Nosso Sol brilhará mais forte que todos!"
 CSA_event_native_exodus.1.t: "Rumores de Oklahoma"
 CSA_event_native_exodus.1.d: "As we attempt something to organize our nation, rumors are coming out of the far lands of Oklahoma that the native population is looking to leave when and where possible. The threat and stigma of a \"Southern\" nation is still pretty strongly resonating, though who could be surprised considering most natives were relegated to specific chunks of land. We can't do much but hope it doesn't cause trouble for us in the future."
 CSA_event_native_exodus.1.o1: "Espere, se eles forem embora, nós ganharemos de graça?"
 CSA_event_native_exodus.2.t: "Migração crescente"
 CSA_event_native_exodus.2.d: "À medida que continuamos a solidificar nosso controle nacional, mais e mais nativos da mega reserva de Oklahoman, simplesmente conhecida como \"Território Indígena\", continuaram a organizar movimentos de migração para o norte, em direção ao Kansas. Embora seja um dia triste perder tantas pessoas, isso significa que, por procuração, os esforços de reintegração e a retomada da economia no estado provavelmente serão muito mais fáceis no geral."
 CSA_event_native_exodus.2.o1: "Não deveríamos nos preocupar com quantos saem?"
 CSA_event_native_exodus.3.t: "Migração ou Êxodo?"
 CSA_event_native_exodus.3.d: "More news out of Oklahoma as news of an organization called the Reclamation Front has been the responsible party for organizing these migration patterns from Oklahoma to Kansas. Reports from the region say that Kansas while under a new governmental entity called the Republic of Lakota is technically under their control, most real efforts have been spent on the northern four states as the debate over a new national capital and rebuilding has been a priority. The RF claims that Kansas is a fine new home away from the other \"colonial ran nations\" and that the Council of Six, a reference to the organization's leadership as well as the six tribes which comprised the mega reservation. The Council has determined Kansas to be a better suited more stable home for which we can claim if need be. We're trying to get more info but it looks like rather than fight us, this supposed Reclamation Front believes the Republic of Lakota would be easier to fight and use Kansas as their one true home."
 CSA_event_native_exodus.3.o1: "Você acha que devemos contar para eles? Nah!"
 CSA_event_native_exodus.4.t: "Quantos deles havia???"
 CSA_event_native_exodus.4.d: "Mais notícias de Oklahoma, já que os maiores números de migrantes para fora do estado foram atingidos. Com estimativas superando um despovoamento de aproximadamente sete por cento devido à migração em massa, muitos se perguntam quantos nativos realmente compõem a população do estado. Seja o que for, que Deus os ajude no Kansas, pois quem sabe que problemas os moradores locais estão causando a eles."
 CSA_event_native_exodus.4.o1: "Thank God It's No Longer Our Problem"
 CSA_event_native_exodus.5.t: "Uma Nova Prosperidade"
 CSA_event_native_exodus.5.d: "With migration numbers nearing a stoppage of sorts we have a lot of vacated land, businesses and whatnot. As such these lands and so on can be refurbished and used to create a new prosperity which the state has yet to see. Let's just hope we can keep it that way considering what's led to this somehow fortunate turn of events."
 CSA_event_native_exodus.5.o1: "E agora?"
 CSA_event_native_exodus.1001.t: "E agora?"
 CSA_event_native_exodus.1001.d: "As the debates go on about the new capital, some rumors from the south have begun to reach us. Supposedly an ever-growing influx of native americans have been fleeing Oklahoma and settling into Kansas. While we don't know what the reasonings or if there is an issue to be had at hand here, we do know that right now it is not a problem."
 CSA_event_native_exodus.1001.o1: "Volte quando for um problema, por favor."
 CSA_event_native_exodus.1002.t: "De novo, falando sério."
 CSA_event_native_exodus.1002.d: "Mais notícias vindas do Kansas: aparentemente, mais nativos migraram para o Kansas e, como consequência, o potencial de desenvolvimento aumentou. Sinceramente, não me parece algo ruim."
 CSA_event_native_exodus.1002.o1: "Existe algum motivo para você ter voltado?"
 CSA_event_native_exodus.1003.t: "Deus, e agora?"
 CSA_event_native_exodus.1003.d: "Mais notícias vindas do Kansas: um grupo chamado Frente de Recuperação anunciou sua intenção de ajudar o estado do Kansas a se reconstruir e crescer. Isso parece ser um leve desafio à nossa autoridade, mas com um estado tão pequeno e nosso controle cada vez maior sobre a maior parte do país, não temos nenhuma preocupação genuína com esses agitadores."
 CSA_event_native_exodus.1003.o1: "Agora posso me concentrar no meu trabalho, por favor?"
 CSA_event_native_exodus.1004.t: "Sim?"
 CSA_event_native_exodus.1004.d: "Kansas leadership has expressed their gratefulness in allowing the RF to help rebuild the state, over all things have been pretty peaceful and are looking to be for a while. But many up north are wary as such random kindness does not just happen for the sake of \"good will\". We'll be sending representatives to figure just what we're dealing with soon enough."
 CSA_event_native_exodus.1004.o1: "Enviem os auditores"
 CSA_focus_havana_help: "Havana ajuda"
 CSA_focus_havana_help_desc: "O maior ator caribenho é Cuba. Precisamos garantir o apoio desse \"grande jogador\" se quisermos avançar com as outras nações. Se for necessário, entraremos em guerra, mas se pudermos evitar a guerra, podemos simplesmente lidar com as outras nações menores no mapa."
 CSA_focus_bahaman_bargain: "Barganha Bahamense"
 CSA_focus_bahaman_bargain_desc: "As ilhas dispersas que compõem as Bahamas estão constantemente sob risco de destruição por furacões anuais. Nossa maior vantagem é que podemos fornecer ajuda financeira e material a essas ilhas e seus povos se nos unirmos em uma confederação. Claro que a decisão final é deles, mas encontraremos uma solução eventualmente."
 CSA_focus_bahama_blast: "Explosão Bahama"
 CSA_focus_bahama_blast_desc: "These scattered islands would make perfect training grounds for future war plans along the gulf. So let's gain some experience then, besides they can't be in any meaningful position for striking deals with."
 CSA_arcadia_path_desc: "[CSA.GetFlag]§YSouthern Republic of America§! Changes Name To §YArcadia§!"
 CSA_rallying_dixies_defenders: "Reunindo os Defensores de Dixie"
 CSA_rallying_dixies_defenders_desc: "Vamos lá, rapazes! Pois devemos enfrentar o inimigo onde quer que ele ataque."
 CSA_creating_infantry_reserves: "Organizando a Força de Reserva"
 CSA_creating_infantry_reserves_desc: "Criar uma força de reserva pronta nos permitirá preparar-nos preventivamente para qualquer incursão inimiga ou qualquer outra ação que possamos planejar no futuro."
 CSA_mobilizing_the_reserves: "Mobilizar as Reservas"
 CSA_mobilizing_the_reserves_desc: "Reúnam-se, rapazes, pois sua pátria precisa de vocês. Vamos aproveitar o dia para nos prepararmos para qualquer coisa que aqueles nortistas ou ocidentais ousarem nos lançar!"
 CSA_focus_gran_colombian_sub_regionalism: "Sub-regionalismo da Grã-Colombiana"
 CSA_focus_gran_colombian_sub_regionalism_desc: "Creating a sort of sub-region within our confederal union will allow for more local cohesions which feed back into our new regional power. Overall we look to set the stage for unity through identity, these nations and sub-regions were proud and good nation-states at one point or another and it's our job to recognize and embrace it in order to properly move forward together as one."
 CSA_focus_soldiers_of_nature: "Soldados da Natureza"
 CSA_focus_soldiers_of_nature_desc: "As terras que possuímos são diversas e abundantes. Tão abundantes que é fácil prever que potências estrangeiras cobiçarão nossas terras. Portanto, devemos treinar, aprimorar e moldar nossas forças armadas para que compreendam essas terras tão diversas, de modo que possamos não apenas defender nossos próprios lares, mas também, se chegar o dia, levar a luta para fora de nossas terras e deixar que seja a terra deles, e que o sangue deles seja derramado."