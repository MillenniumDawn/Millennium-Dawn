 ukraine_nuclear_power_plants.1.name: "Полное прекращение работы Чернобыльской атомной электростанции"
 ukraine_nuclear_power_plants.1.desc: "29 марта 2000 года Кабинет Министров Украины принял решение о досрочном выводе из эксплуатации энергоблока № 3 и окончательном закрытии Чернобыльской АЭС к концу 2000 года.\n15 декабря 2000 года реактор № 3 был остановлен после непродолжительной работы с марта 1999 года, после почти трех месяцев ремонта, и станция в целом прекратила генерацию электроэнергии.\nПланируется строительство новой стальной защитной оболочки под названием §YНовый безопасный конфайнмент§! для замены устаревшего и наспех построенного саркофага, защищавшего разрушенный реактор № 4.\n§YНовый безопасный конфайнмент§! планируется финансировать за счет международного фонда, управляемого Европейским банком реконструкции и развития, а проектированием и строительством занимается французский консорциум «Новарка»."
 ukraine_nuclear_power_plants.1.a: "Прекратите это навсегда"
 ukraine_nuclear_power_plants_flag: "Чернобыльская атомная электростанция закрыта."
 ukr_history.1.t: "Исчезновение Георгия Гонгадзе"
 ukr_history.1.d: "Георгий Гонгадзе, основатель интернет-газеты «Украинская правда» и один из самых резких критиков администрации президента, пропал без вести в Киеве. Его мать подала заявление о пропаже человека; его коллеги уже открыто заявляют, что к этому причастны власти. Если тело будет найдено, это не останется делом полиции."
 ukr_history.1.a: "Пусть полиция разберется с этим обычным способом."
 ukr_history.1.b: "Закажите проведение настоящего расследования и держите прессу в курсе."
 ukr_history.2.t: "Кассетный скандал"
 ukr_history.2.d: "С трибуны Верховной Рады лидер социалистов Александр Мороз воспроизвел записи, сделанные в кабинете президента членом государственной гвардии Николаем Мельниченко. На пленках слышен голос, напоминающий требования президента о привлечении к ответственности Гонгадзе. Мороз в одночасье превратился из угасающего левого политика в лицо оппозиции."
 ukr_history.2.a: "Отрицайте всё и подвергайте сомнению записи."
 ukr_history.2.b: "Ничего не говорите и ждите, пока буря утихнет."
 ukr_history.3.t: "Украина без Кучмы"
 ukr_history.3.d: "На площади Независимости появился постоянный лагерь протестующих. Изначально в нем было пятьдесят человек, а за два дня их число выросло до десятков тысяч. Впервые левые, центристы и националисты стоят на одной площади под одним лозунгом. Организаторы заявляют, что не покинут площадь, пока президент не уйдет в отставку."
 ukr_history.3.a: "Не обращайте на них внимания; холод сделает свою работу."
 ukr_history.3.b: "Начните переговоры с протестным комитетом."
 ukr_history.4.t: "Столкновения на улице Банкова"
 ukr_history.4.d: "В годовщину со дня рождения Шевченко колонна из десяти-пятнадцати тысяч человек двинулась к зданию администрации президента. На Банковой улице произошли самые ожесточенные уличные бои со времен обретения независимости. К вечеру полиция разрушила штаб-квартиру УНА-УНСО, сотни людей были арестованы. Лагерь на площади исчез, но исчезли и любые попытки утверждать, что это правительство правит на основе согласия."
 ukr_history.4.a: "Пусть будет так."
 ukr_history.5.t: "Рада отстранила от должности правительство Ющенко."
 ukr_history.5.d: "Двести шестьдесят три депутата выразили вотум недоверия кабинету Виктора Ющенко. Коммунисты и олигархический центрист проголосовали вместе: левые ненавидели его рыночные реформы, бизнес-группы — прекращение бартерных схем в энергетическом секторе. Самый популярный премьер-министр в истории страны покидает свой пост, сохранив репутацию нетронутой и не имея возможности её потерять."
 ukr_history.5.a: "Пусть будет так."
 ukr_history.6.t: "Ющенко объявляет о создании блока."
 ukr_history.6.d: "Уволенный премьер-министр заявил, что возглавит избирательный блок на парламентских выборах в следующем году. Десять национал-демократических и либеральных партий уже ведут переговоры о списке кандидатов. У блока пока нет программы и структуры, но у него есть то, чего нет ни у одной другой силы: лидер, которому по-прежнему доверяет большая часть страны."
 ukr_history.6.a: "Пусть будет так."
 ukr_history.7.t: "За единую Украину!"
 ukr_history.7.d: "Пять правящих партий объединились в единый избирательный блок вокруг президента: Народные демократы, Трудовая Украина, Партия регионов, Аграрии и Промышленники. Его скрепляет не идеология, а административный ресурс — губернаторы, налоговые инспекторы и государственное телевидение. Региональным руководителям сообщили, какого результата от них ожидают."
 ukr_history.7.a: "Пусть будет так."
 ukr_history.8.t: "Парламентские выборы 2002 года"
 ukr_history.8.d: "Блок Ющенко занял первое место в партийном списке с 23 процентами. «За единую Украину» набрал лишь 12 процентов, а затем добрал 100 мест в одномандатных округах, где губернаторы определяют результаты голосования. Коммунисты потеряли половину своих голосов. В новую Раду вошли шесть сил."
 ukr_history.8.a: "Пусть будет так."
 ukr_history.9.t: "Литвин избран спикером"
 ukr_history.9.d: "После двух месяцев тупиковой ситуации глава администрации президента Владимир Литвин был избран председателем Верховной Рады. Оппозиция получила больше голосов в стране; президент получил больше голосов в палате. Литвин проведет следующие годы в роли человека, в котором нуждаются обе стороны, но которому ни одна из них не доверяет."
 ukr_history.9.a: "Пусть будет так."
 ukr_history.10.t: "За роспуск Объединенной Украины"
 ukr_history.10.d: "Блок, одержавший победу в округах, распался на составные части. На месте одной фракции теперь расположились девять отдельных группировок: Партия регионов, Трудовая Украина, Народные демократы, Аграрии и остальные, каждая со своим лидером и своими целями. Донецкая группа является крупнейшей из них и больше не является ничьим младшим партнером."
 ukr_history.10.a: "Пусть будет так."
 ukr_history.11.t: "Вставай, Украина!"
 ukr_history.11.d: "Во вторую годовщину исчезновения Гонгадзе оппозиция вновь вывела своих сторонников на улицы — на этот раз Ющенко, Тимошенко, Мороз и Симоненко выступили на одной платформе. У этих четверых почти нет ничего общего, кроме требования отставки президента. На Крещатике снова устанавливают палатки."
 ukr_history.11.a: "Пусть будет так."
 ukr_history.12.t: "Смерть Славы Стецко"
 ukr_history.12.d: "Ярослава Стецко, вдова человека, провозгласившего восстановление украинской государственности во Львове в 1941 году и являвшегося живой связью между националистическим подпольем военного времени и сегодняшним парламентом, скончалась в возрасте восьмидесяти двух лет. Конгрессу украинских националистов теперь предстоит найти лидера, который не будет просто символом."
 ukr_history.12.a: "Пусть будет так."
 ukr_history.13.t: "Янукович возглавляет Партию регионов"
 ukr_history.13.d: "Премьер-министр избран председателем Партии регионов. До сих пор эта партия была одной из нескольких донецких бизнес-групп; с сегодняшнего дня она является политическим крылом человека, которому президент намерен передать свой пост. Люди Рината Ахметова входят в региональные структуры партии."
 ukr_history.13.a: "Пусть будет так."
 ukr_history.14.t: "Тарасюк возглавляет народное движение"
 ukr_history.14.d: "Борис Тарасюк, бывший министр иностранных дел, который вел переговоры с НАТО о создании хартии независимости, избран лидером партии «Рух». Партия, добившаяся независимости, теперь представляет собой небольшую профессиональную группу дипломатов и интеллигенции, и она решила, что ее будущее лежит внутри блока Ющенко, а не рядом с ним."
 ukr_history.14.a: "Пусть будет так."
 ukr_history.15.t: "Единое экономическое пространство"
 ukr_history.15.d: "В Ялте президент подписал соглашение о едином экономическом пространстве с Россией, Беларусью и Казахстаном. В тексте говорится о таможенном союзе и наднациональной комиссии, где голоса учитываются с учетом масштабов экономики, то есть решения принимает Москва. Рада ратифицировала его голосами коммунистов и правящей партии."
 ukr_history.15.a: "Подпишите петицию — Восток оплачивает наши счета."
 ukr_history.15.b: "Подпишите соглашение, но ратифицируйте только главу о свободной торговле."
 ukr_history.16.t: "Суд открывает путь к третьему сроку"
 ukr_history.16.d: "Конституционный суд постановил, что первый срок президента, отбытый по старой конституции, не засчитывается. Он может баллотироваться снова в следующем году. Никто в Киеве не верит, что судьи пришли к этому выводу самостоятельно, и никто не верит, что он действительно воспользуется им, — но это решение ясно показало оппозиции, с чем она имеет дело."
 ukr_history.16.a: "Пусть будет так."
 ukr_history.17.t: "Социал-национальная партия становится Свободой"
 ukr_history.17.d: "На своем съезде во Львове Социал-национальная партия Украины переименовала себя во Всеукраинский союз «Свобода», убрала «Волчий крюк» со своего флага и избрала своим лидером Олега Тягнибока. Риторика смягчена, и теперь партия нацелена на избирателей, которые никогда бы не вступили в военизированную организацию."
 ukr_history.17.a: "Пусть будет так."
 ukr_history.18.t: "Политическая реформа провалилась с разницей в шесть голосов."
 ukr_history.18.d: "Поправка к конституции, которая превратила бы президентский пост в церемониальный, не прошла шестью голосами. Сторонники президента хотели её принять в качестве страховки на случай поражения на выборах; лагерь Ющенко отклонил её, поскольку рассчитывает выиграть выборы в нынешнем виде. Обе стороны только что показали стране, каковы, по их мнению, их шансы на победу."
 ukr_history.18.a: "Пусть будет так."
 ukr_history.19.t: "Литвин берет аграриев под свой контроль"
 ukr_history.19.d: "Председатель парламента избран главой Аграрной партии, которая переименовывается в Народную аграрную партию. Литвин создает себе политический механизм в деревнях – единственном регионе страны, где ни донецкая группировка, ни оранжевый лагерь мало что могут предложить."
 ukr_history.19.a: "Пусть будет так."
 ukr_history.20.t: "Сила народа"
 ukr_history.20.d: "Ющенко и Тимошенко подписали коалиционное соглашение. Она снимает свою кандидатуру с президентских выборов и будет поддерживать его; если он победит, она станет премьер-министром. Два лагеря, которые три года боролись за одни и те же протестные голоса, решили, что один из них должен стать кандидатом, а другой — правительством."
 ukr_history.20.a: "Пусть будет так."
 ukr_history.21.t: "Ющенко изгоняет Тягнибока"
 ukr_history.21.d: "После речи у могилы партизана в Карпатах, в которой Тягнибок восхвалял тех, кто сражался «против москалей, немцев, жидов», «Наша Украина» исключила его из своей парламентской фракции. Ющенко защитил свою кампанию от роковой цитаты и обеспечил «Свободе» мученическую смерть, необходимую для того, чтобы стать самостоятельной партией."
 ukr_history.21.a: "Пусть будет так."
 ukr_history.22.t: "Отравление"
 ukr_history.22.d: "Оппозиционного кандидата доставили в клинику в Вене. Диагноз — отравление диоксином в тысячу раз превышающей нормальную концентрацию, поставленный во время ужина с заместителем главы службы безопасности. Он выживет, но его лицо — нет. Он возвращается к предвыборной кампании изуродованным, и теперь каждый избиратель видит, что с ним сделали."
 ukr_history.22.a: "Назовите это пищевым отравлением и забудьте об этом."
 ukr_history.22.b: "Возбудить уголовное дело и не пускать его в ход."
 ukr_history.23.t: "Первый раунд"
 ukr_history.23.d: "Кандидат от оппозиции получил 39 процентов голосов, премьер-министр — 39 процентов, разница составляет всего несколько десятых процента. Доля голосов за коммунистов сократилась с четверти до пяти процентов, которые распределились между двумя полюсами. Все остальные не имеют значения. До второго тура осталось три недели."
 ukr_history.23.a: "Пусть будет так."
 ukr_history.24.t: "Рада объявляет второй тур недействительным."
 ukr_history.24.d: "Триста семь депутатов проголосовали за то, что второй тур голосования не отразил волю избирателей, а двести двадцать девять выразили вотум недоверия правительству. Ни одно из этих голосований не имеет юридической силы. Оба показали службам безопасности и региональным администрациям, в каком направлении дует ветер, и в этом заключался смысл."
 ukr_history.24.a: "Пусть будет так."
 ukr_history.25.t: "Тигипко покинул предвыборный штаб"
 ukr_history.25.d: "Глава Национального банка и руководитель предвыборной кампании премьер-министра ушел в отставку как из кампании, так и из банка. Партия «Лейбористская Украина», Днепропетровская партия, которую он создал вместе с Виктором Пинчуком, распадается у него на глазах, поскольку ее депутаты ищут более безопасную площадку для выдвижения своей кандидатуры."
 ukr_history.25.a: "Пусть будет так."
 ukr_history.26.t: "Верховный суд аннулировал результаты второго тура выборов."
 ukr_history.26.d: "Верховный суд признал второй тур недействительным и назначил повторное голосование на 26 декабря. Впервые украинский суд вынес решение по президентским выборам против кандидата от действующего президента, и решение было зачитано в прямом эфире на площади, заполненной людьми."
 ukr_history.26.a: "Пусть будет так."
 ukr_history.27.t: "Закон 2222 — Голосование по пакету законопроектов"
 ukr_history.27.d: "Компромисс был принят в виде единого пакета: повторные выборы в обмен на конституционную реформу. С 2006 года парламент назначает правительство, а президент сохраняет за собой должности министра иностранных дел и министра обороны. Кто бы ни победил на этих выборах, он займет пост меньшего масштаба, чем тот, за который боролся."
 ukr_history.27.a: "Пусть будет так."
 ukr_history.28.t: "«Наша Украина» становится партией"
 ukr_history.28.d: "Блок, одержавший победу на президентских выборах, провел свой учредительный съезд как единая партия: Народный союз «Наша Украина». Председателем стал Роман Безсмертный, руководитель предвыборной кампании президента. Несколько из десяти входящих в него партий отказались от роспуска, и коалиция, совершившая революцию, уже на одну партию меньше, чем была в декабре."
 ukr_history.28.a: "Пусть будет так."
 ukr_history.29.t: "Раскол в оранжевом лагере"
 ukr_history.29.d: "Президент распустил всё правительство. Глава Совета безопасности в прямом эфире обвинила окружение премьер-министра в коррупции, на что та ответила, что проблема в собственном окружении президента. Спустя восемь месяцев после событий на площади два человека, стоявшие на ней вместе, теперь баллотируются друг против друга."
 ukr_history.29.a: "Увольте их всех и начните заново."
 ukr_history.29.b: "Оставьте премьер-министра на посту и увольте обвинителей."
 ukr_history.30.t: "Меморандум с Януковичем"
 ukr_history.30.d: "Не сумев утвердить нового премьер-министра одними лишь «оранжевыми» голосами, президент подписал меморандум о взаимопонимании с человеком, которого он победил. Партия регионов воздержалась, Юрий Ехануров был утвержден тремя голосами, а уголовные дела против должностных лиц избирательной комиссии тихо прекратились. Революция выкупила собственное правительство у свергнутого ею народа."
 ukr_history.30.a: "Пусть будет так."
 ukr_history.31.t: "Парламентские выборы 2006 года"
 ukr_history.31.d: "Первые полностью пропорциональные выборы. Партия регионов получила тридцать два процента, Блок Тимошенко — двадцать два, «Наша Украина» — четырнадцать, третье место заняла собственная партия президента спустя год после его победы. Социалисты и коммунисты едва прошли к власти. Ни у кого нет большинства, и у всех есть право вето."
 ukr_history.31.a: "Пусть будет так."
 ukr_history.32.t: "Коалиция демократических сил"
 ukr_history.32.d: "Спустя три месяца «оранжевые» партнеры подписали соглашение: Блок Тимошенко, «Наша Украина» и социалисты, двумястами сорока тремя голосами, при этом Тимошенко стала премьер-министром. На составление соглашения ушло больше времени, чем просуществует правительство."
 ukr_history.32.a: "Пусть будет так."
 ukr_history.33.t: "Мороз занимает кресло"
 ukr_history.33.d: "Лидер социалистов был избран спикером парламента голосами Партии регионов и коммунистов — двух партий, которые он осуждал последние шесть лет. Оранжевая коалиция распалась в тот же день. В течение суток образовалась Антикризисная коалиция, и Мороз стал самым ненавистным человеком в половине страны."
 ukr_history.33.a: "Пусть будет так."
 ukr_history.34.t: "Всеобщее национальное единство"
 ukr_history.34.d: "Президент подписал декларацию принципов с Антикризисной коалицией и выдвинул на пост премьер-министра человека, которого он победил в 2004 году. Наша Украина присоединяется к правительству, которое, как говорили избирателям нашей Украины, они победили. Спустя двадцать месяцев после событий на площади Янукович вернулся в здание, из которого его выгнали."
 ukr_history.34.a: "Подпишите — альтернатива этому лишь новые выборы."
 ukr_history.34.b: "Откажитесь и распустите Раду немедленно."
 ukr_history.35.t: "Наша Украина переходит в оппозицию"
 ukr_history.35.d: "Партия президента вышла из правительства, к которому присоединилась два месяца назад. Ее министры подали в отставку, ее депутаты перешли в оппозицию, а стране сообщили, что Всеобщее национальное единство было недоразумением. Антикризисная коалиция в них не нуждается и заявляет об этом."
 ukr_history.35.a: "Пусть будет так."
 ukr_history.36.t: "Организация «Реформы и порядок» присоединяется к блоку Тимошенко."
 ukr_history.36.d: "Рыночные либералы Виктора Пынзеника, которые в девяностые годы писали все серьезные программы реформ, игнорируемые страной, влились в блок Тимошенко. Либеральное крыло оранжевого лагеря больше не существует как отдельная организация."
 ukr_history.36.a: "Пусть будет так."
 ukr_history.37.t: "Коалиция покупает себе большинство."
 ukr_history.37.d: "Антикризисная коалиция переименовала себя в Коалицию национального единства и начала собирать по одному депутату от оппозиции по цене, которую никто публично не обсуждает. Имея триста голосов, она может преодолеть президентский запрет и переписать конституцию. Ей не хватает одиннадцати голосов."
 ukr_history.37.a: "Пусть будет так."
 ukr_history.38.t: "Президент распускает Раду"
 ukr_history.38.d: "Вместо того чтобы наблюдать, как коалиция достигает трехсот членов, президент распустил парламент указом. Коалиция заявляет о неконституционности указа и продолжает работу. В течение двух месяцев в стране действуют два законных органа власти, три главы Конституционного суда и одно министерство внутренних дел, которое никому конкретно не подотчетно."
 ukr_history.38.a: "Распустить их — это единственный выход, иначе потеряете должность."
 ukr_history.38.b: "Примите коалицию и сохраните оставшиеся полномочия."
 ukr_history.39.t: "Наша Украина — народная самооборона"
 ukr_history.39.d: "Партия президента идет на досрочные выборы в составе более широкого блока с Народной самообороной Юрия Луценко, сформированного из сотрудников министерства внутренних дел, которых он привел с собой. Девять партий в одном списке, объединенных страхом баллотироваться по отдельности."
 ukr_history.39.a: "Пусть будет так."
 ukr_history.40.t: "Литвинский блок"
 ukr_history.40.d: "Бывший спикер зарегистрировал свой собственный блок для участия в досрочных выборах. У него нет достойной внимания программы и нет врагов, которых стоило бы называть, и в этом вся суть: кто бы ни победил, Литвин намерен заслужить те голоса, которых ему не хватает."
 ukr_history.40.a: "Пусть будет так."
 ukr_history.41.t: "Конгресс украинских националистов сдаётся."
 ukr_history.41.d: "Не сумев самостоятельно преодолеть трехпроцентный барьер и получив отказ в включении в список «Наша Украина», Конгресс украинских националистов объявил, что не будет участвовать в выборах. Старейшая националистическая партия страны оставляет поле для «Свободы»."
 ukr_history.41.a: "Пусть будет так."
 ukr_history.42.t: "Медведчук отступает"
 ukr_history.42.d: "Социал-демократическая партия (объединенная), некогда управлявшая президентской администрацией, заменила Виктора Медведчука Юрием Загородным. Рейтинг партии составляет менее одного процента. Ее бывший лидер не уходит из политики — он меняет страну, для которой будет ее представлять."
 ukr_history.42.a: "Пусть будет так."
 ukr_history.43.t: "Внеочередные выборы"
 ukr_history.43.d: "Партия регионов получила тридцать четыре процента голосов, но всё равно проиграла: блок Тимошенко поднялся до тридцати одного процента, а вместе с «Нашей Украиной — Народной самообороной» оранжевая сторона получила двести двадцать восемь мест. Большинство в два места."
 ukr_history.43.a: "Пусть будет так."
 ukr_history.44.t: "Оранжевая коалиция, снова"
 ukr_history.44.d: "Блок Тимошенко и «Наша Украина — Народная самооборона» подписали коалиционное соглашение большинством в два голоса. Все участники понимают, что два голоса — это не большинство, это ситуация с заложниками."
 ukr_history.44.a: "Пусть будет так."
 ukr_history.45.t: "Тимошенко возвращается в состав Кабинета министров."
 ukr_history.45.d: "Со второй попытки, всего одним голосом, Рада утвердила Юлию Тимошенко на посту премьер-министра. Она обещает вернуть сбережения, утраченные при распаде Советского Союза, и реприватизировать украденное. Президент, назначивший её, уже начал искать способы её смещения."
 ukr_history.45.a: "Пусть будет так."
 ukr_history.46.t: "Балога создаёт «Единый центр»"
 ukr_history.46.d: "Глава секретариата президента превратил бездействующую партию в «Единый центр» и начал перебрасывать в неё региональные сети президента. Официально она поддерживает президента. На практике это страховка от «Нашей Украины», и все в «Нашей Украине» об этом знают."
 ukr_history.46.a: "Пусть будет так."
 ukr_history.47.t: "Коалиция объявлена мертвой."
 ukr_history.47.d: "Наша Украина — Народная самооборона — вышла из состава парламента после того, как Блок Тимошенко проголосовал вместе с Партией регионов за сокращение президентских полномочий. Спикер объявил с трибуны, что коалиция прекратила свое существование. Тридцать дней на создание новой коалиции, иначе предстоят новые выборы."
 ukr_history.47.a: "Пусть будет так."
 ukr_history.48.t: "Выборы, которых не было"
 ukr_history.48.d: "Президент вновь распустил парламент и назначил голосование на 7 декабря. В казне нет денег на это, суды заблокировали указ, а в том же месяце разразился мировой финансовый кризис. Выборы тихо отменяются."
 ukr_history.48.a: "Пусть будет так."
 ukr_history.49.t: "Кризис наступил"
 ukr_history.49.d: "С лета гривна потеряла почти половину своей стоимости по отношению к доллару. Экспорт стали, который покрывал все расходы, рухнул из-за снижения мирового спроса. Правительство выделило шестнадцать миллиардов долларов из Фонда, и условия, связанные с этим, будут оплачены людьми, которые не видели экономического подъема."
 ukr_history.49.a: "Возьмите деньги фонда и ознакомьтесь с условиями его использования."
 ukr_history.49.b: "Откажитесь от условий и распечатайте то, что нам нужно."
 ukr_history.50.t: "Президент берет с собой свою партию"
 ukr_history.50.d: "С рейтингом одобрения в однозначных числах президент наконец-то официально возглавил партию «Наша Украина». Это попытка спасения партии, которая потеряла свои региональные структуры в пользу «Единого центра», а своих избирателей — в пользу всех остальных."
 ukr_history.50.a: "Пусть будет так."
 ukr_history.51.t: "Коалиция с Литвином"
 ukr_history.51.d: "Сформировано новое большинство: блок Тимошенко, «Наша Украина — Народная самооборона» и блок Литвина, причем Литвин вернулся на пост спикера в качестве платы за это. Теперь двадцать депутатов решают, кто будет управлять страной."
 ukr_history.51.a: "Пусть будет так."
 ukr_history.52.t: "Газовая война"
 ukr_history.52.d: "В январе транзит был приостановлен на девятнадцать дней, и половина Европы остыла. Премьер-министр вылетела в Москву и лично подписала десятилетний контракт, без одобрения президента и без присутствия своей делегации. Формула ценообразования в этом контракте будет использоваться против нее до конца ее карьеры."
 ukr_history.52.a: "Подпишите — страна не может замерзать."
 ukr_history.52.b: "Дождитесь появления более совершенной формулы."
 ukr_history.53.t: "«Свобода» побеждает в Тернополе"
 ukr_history.53.d: "На досрочных выборах в Тернопольский областной совет партия «Свобода» получила тридцать пять процентов голосов и заняла первое место. Партия, которая два года назад набирала менее одного процента голосов по всей стране, теперь управляет регионом. Галиция перестала голосовать за оранжевые партии и начала голосовать против всех."
 ukr_history.53.a: "Пусть будет так."
 ukr_history.54.t: "Худший год"
 ukr_history.54.d: "Промышленное производство сократилось на треть, экономика в этом году снизится на пятнадцать процентов, а задержки с выплатой заработной платы возобновились впервые с девяностых годов. Кто бы ни победил на президентских выборах в январе, он унаследует страну, которая перестала верить, что последние пять лет были оправданы."
 ukr_history.54.a: "Пусть будет так."
 ukr_history.55.t: "Тигипко возвращается"
 ukr_history.55.d: "Бывший глава Нацбанка переименовал Трудовую партию Украины в «Сильную Украину» и идёт на президентские выборы, делая ставку на компетентность, а не на язык или историю. Он не победит, но треть избирателей, которым не по душе ни один из лагерей, наконец-то получила своего кандидата."
 ukr_history.55.a: "Пусть будет так."
 ukr_history.56.t: "Первый раунд 2010 года"
 ukr_history.56.d: "Янукович — тридцать пять процентов, Тимошенко — двадцать пять, Тигипко — тринадцать, Яценюк — семь. Действующий президент получил пять целых четыре десятых процента — худший результат, когда-либо зафиксированный у любого действующего президента. Оранжевая революция была свергнута народом, который её совершил."
 ukr_history.56.a: "Пусть будет так."
 ukr_history.57.t: "Стабильность и реформы"
 ukr_history.57.d: "Новое большинство сформировано методом, который конституция явно не допускает: отдельные депутаты вступают в коалицию, а не целые фракции. Конституционный суд утвердит его в течение месяца. Николай Азаров становится премьер-министром, а Партия регионов одновременно занимает пост президента, правительство и Раду."
 ukr_history.57.a: "Пусть будет так."
 ukr_history.58.t: "Азаров занимает кресло председателя партии."
 ukr_history.58.d: "После того, как Янукович занял пост президента, премьер-министр официально возглавил Партию регионов. Теперь партия является продолжением кабинета министров, а донецкие бизнес-группы, которые ее создали, получают свою долю от государства."
 ukr_history.58.a: "Пусть будет так."
 ukr_history.59.t: "Фронт перемен Яценюка"
 ukr_history.59.d: "После достойного четвертого места на президентских выборах Арсений Яценюк превратил свою кампанию в партию. «Фронт перемен» предлагает избирателям, разочаровавшимся в обоих лагерях 2004 года, технократическую компетентность и европейскую интеграцию."
 ukr_history.59.a: "Пусть будет так."
 ukr_history.60.t: "Суд отменяет 2004 год"
 ukr_history.60.d: "Конституционный суд признал политическую реформу 2004 года неконституционной по процедурным основаниям и в одночасье восстановил конституцию 1996 года. Президент, вступивший в должность при парламентской республике, теперь управляет страной с президентской республикой, без единого голосования в Раде."
 ukr_history.60.a: "Пусть будет так."
 ukr_history.61.t: "Местные выборы"
 ukr_history.61.d: "Партия регионов захватила юг и восток, а также большую часть центра. В Галиции «Свобода» заняла первое место во всех трех региональных советах. Наша Украина стерта с карты, которую она сама же и нарисовала в 2004 году, и теперь занимаемое ею пространство принадлежит партии, которая еще три года назад имела рейтинг в один процент."
 ukr_history.61.a: "Пусть будет так."
 ukr_history.62.t: "Налоговый Майдан"
 ukr_history.62.d: "Мелкие торговцы и предприниматели вновь установили палатки на площади Независимости в знак протеста против нового налогового кодекса. На площади нет партийных флагов, и организаторы попросили политиков держаться подальше. Президент наложил вето на самые жесткие положения, и лагерь все равно был ликвидирован на ночь."
 ukr_history.62.a: "Наложите вето на кодекс и очистите площадь."
 ukr_history.62.b: "Проведите кодекс без изменений."
