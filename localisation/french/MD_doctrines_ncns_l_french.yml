 SUBDOCTRINE_EQUIPMENT_WALKER_TANK: "Déploiement du char Walker"
 SUBDOCTRINE_EQUIPMENT_WALKER_TANK_DESC: "Cette doctrine organise les forces armées de marcheurs."
 gait_optimization: "Exercices d'optimisation de la démarche"
 stabilized_firing_windows: "Fenêtres de tir stabilisées"
 leg_damage_protocols: "Protocoles de contrôle des dommages aux jambes"
 terrain_anchoring: "Ancrage au terrain et micro-positionnement"
 combined_arms_walker_screen: "Écran de marcheurs interarmes"
