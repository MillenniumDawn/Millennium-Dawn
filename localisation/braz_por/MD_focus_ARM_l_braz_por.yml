 NKR_artsakh_desc_loc: "[select_thingie_artsakh]\n\n[discussion_phase_arts]\n\n[artsakh_strong_or_weak]\n\nApós a vitória da §YArmênia§! na §YPrimeira Guerra de Artsakh§!, os conflitos de fronteira continuam até hoje. A guerra foi vista como justa por ambos os lados e os combates acabaram tornando tanto a §YArmênia§! quanto o §YAzerbaijão§! instáveis. No novo milênio, podemos tentar escalar ou desescalar o conflito e fazê-lo pender a nosso favor.\n\nA §Yfase de discussão§! diplomática representa a §Gdisposição§! de §Yambas as partes§! de encontrar uma §Csolução pacífica!§!"
