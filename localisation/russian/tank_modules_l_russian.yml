 medium_tank_aa_chassis_0: "Корпус самоходного ЗСУ 1-го поколения"
 medium_tank_aa_chassis_0_desc: "Самоходные зенитные средства, также известные как мобильные средства ПВО, относятся к мобильному противовоздушному оружию, на которое устанавливают зенитные пулемёты, зенитные орудия или зенитные ракеты на военной технике. Их можно разделить на самоходные зенитные пушки (самоходные зенитные пушки), самоходные пусковые установки ПВО и самоходные комбинированные системы ПВО с ракетами и артиллерией."
