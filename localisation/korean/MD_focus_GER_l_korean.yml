 GER_Flensburger_Fahrzeugbau_header_sondertechnik: "특수 기술(Sondertechnik)"
 GER_mio_trait_ffg_alte_werft: "알테 베르프트"
 GER_mio_trait_ffg_kettenfahrzeugbereich: "궤도 차량 부문"
