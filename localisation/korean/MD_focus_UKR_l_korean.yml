 ukr_modernize_sov_equipment_t55_reactivation_program.1.name: "§YT-55§! 현대화 계획:\n방향 선택"
 ukr_modernize_sov_equipment_t55_reactivation_program.1.desc: "§YKMDB§!가 보관 중인 차체를 조사했습니다. 대부분은 재생산할 만큼 상태가 양호하지만, 100 mm 포와 마모된 §YV-55§! 엔진, 얇은 장갑은 현대 전장에 §R더 이상 맞지 않습니다§!. 설계국은 이를 최신 수준으로 끌어올릴 여러 방안을 제시합니다."
 ukr_modernize_sov_equipment_t55_reactivation_program.1.a: "경량 현대화: §Y5TDF§! 엔진 또는 §YT-64§! 부품"
