 STALKER_zone_overview_title: "Аномальные Зоны: §Y[?global.STALKER_active_zone_anchors^num|0]§! активно"
 STALKER_zone_overview_row: "[THIS.GetName] | [THIS.STALKER_zone_leading_faction] | [THIS.STALKER_zone_overview_status]\n   Активность §Y[?STALKER_zone_activity|0]§!, сдерживание §Y[?STALKER_zone_containment|0]§!, эксплуатация §Y[?STALKER_zone_exploitation|0]§!"
 STALKER_zone_overview_row_tt: "Сталкеры: §Y[?STALKER_zone_stalkers|0]§!\n«Долг»: §Y[?STALKER_zone_duty|0]§! | «Свобода»: §Y[?STALKER_zone_freedom|0]§! | Бандиты: §Y[?STALKER_zone_bandits|0]§! | «Монолит»: §Y[?STALKER_zone_monolith|0]§!\nЭкологи: §Y[?STALKER_zone_scientists|0]§! | Военные: §Y[?STALKER_zone_military|0]§!\n«Варта»: §Y[?STALKER_zone_ward|0]§! | «Искра»: §Y[?STALKER_zone_spark|0]§! | «Чистое Небо»: §Y[?STALKER_zone_clear_sky|0]§! | «Полдень»: §Y[?STALKER_zone_noon|0]§! | Наёмники: §Y[?STALKER_zone_mercenaries|0]§!\nАртефактов за прошлый месяц: §Y[?STALKER_zone_artifact_haul|1]§!, из них на чёрный рынок попало §R[?STALKER_zone_black_market|1]§!"
 STALKER_zone_overview_status_pending: "§YОжидает политики§!"
 STALKER_zone_overview_status_emission: "§RИдёт выброс§!"
 STALKER_zone_overview_status_crisis: "§RВ кризисе§!"
 STALKER_zone_overview_status_stable: "§GСтабильна§!"
 STALKER_military_cordon_mandate: "Разрешить военный кордон: [FROM.GetName]"
 STALKER_military_cordon_mandate_desc: "Когда военные лидируют среди местных группировок, они могут взять периметр под себя. Зона может выдавать только один мандат группировке раз в 180 дн. Сильные военные удешевляют запечатывание исходной Зоны в 2022 году."
 STALKER_military_cordon_mandate_tt: "Влияние военных растёт на §G5§!, сдерживание — на §G15§!. Число сталкеров падает до §R8§!, а эксплуатация — до §R5§!."
 STALKER_ecologist_field_mandate: "Выдать экологам полевой мандат: [FROM.GetName]"
 STALKER_ecologist_field_mandate_desc: "Когда экологи лидируют среди местных группировок, их полевые лаборатории могут работать внутри периметра. Зона может выдавать только один мандат группировке раз в 180 дн."
 STALKER_ecologist_field_mandate_tt: "Влияние экологов растёт на §G5§!, эксплуатация — на §G10§!. Сдерживание падает до §R5§!. Добавляет §G2§! артефакта в национальный запас."
 STALKER_issue_emission_shelter: "Приказ об укрытии от выброса: [FROM.GetName]"
 STALKER_issue_emission_shelter_desc: "Приказать всем в [FROM.GetName] укрыться до следующего выброса. Приказ действует 120 дн. и расходуется при следующем выбросе."
 STALKER_issue_emission_shelter_tt: "Следующий выброс в [FROM.GetName] отнимет меньше стабильности, повысит активность на §Y4§! вместо §Y10§! и добавит меньше мутантов."
 STALKER_field_medical_artifacts: "Медицинские артефакты в полевых условиях"
 STALKER_field_medical_artifacts_desc: "Передать добытые медицинские артефакты больницам. Чаще всего состояние пациентов стабилизируется. Иногда артефакт делает что-то другое."
 STALKER_field_medical_artifacts_tt: "Тратит §Y5§! артефактов. В течение 180 дн. стабильность растёт каждую неделю. С вероятностью §R15%§! выдача проваливается, и вместо этого стабильность падает на §R3%§!."
 STALKER_issue_psi_shielding: "Выдать пси-защиту"
 STALKER_issue_psi_shielding_desc: "Оснастить гарнизоны защитой из добытых пси-артефактов. Следующие выбросы не потрясут страну так, как выброс без защиты."
 STALKER_issue_psi_shielding_tt: "Тратит §Y3§! артефакта. В течение 180 дн. выбросы не отнимают стабильность."
 STALKER_issue_psi_shielding_available_tt: "Нужно не менее §Y3§! артефактов в национальном запасе."
 STALKER_psi_shielding: "Пси-защита уже выдана нашим силам."
 STALKER_medical_artifacts: "Медицинские артефакты в строю"
 STALKER_medical_artifacts_desc: "Медицинские артефакты работают в гарнизонных клиниках. Страна с каждой неделей становится чуть устойчивее, если в партию не попал плохой экземпляр."
 STALKER_xlab_expedition: "Профинансировать экспедицию в лабораторию X: [FROM.GetName]"
 STALKER_xlab_expedition_desc: "Нанять сталкеров-проводников, чтобы провести научную группу к запечатанным советским лабораториям под Зоной.\n\nРасследование: §Y[ROOT.STALKER_xlab_stage_name]§!\nПрогресс до следующего открытия: §Y[?ROOT.STALKER_xlab_progress|0]§! / 100\nСталкеры: §Y[?FROM.STALKER_zone_stalkers|0]§! | Эксплуатация: §Y[?FROM.STALKER_zone_exploitation|0]§!"
 STALKER_xlab_expedition_tt: "Добавляет §Y20§! прогресса расследования плюс §Y0.1§! за каждое очко §Yсталкеров§! и §Yэксплуатации§! Зоны и минус §R0.2§! за каждое очко влияния §Y«Монолита»§! (всего не менее §Y5§!). С вероятностью §R25%§! экспедиция теряет проводников, и число §Yсталкеров§! падает до §R5§!. При §Y100§! прогресса расследование переходит на следующий этап."
 STALKER_xlab_stage_reward_tt: "Добавляет §G5§! артефактов в национальный запас и §G+1%§! к скорости исследований благодаря находкам в лабораториях X."
 STALKER_xlab_findings: "Находки лабораторий X"
 STALKER_xlab_findings_desc: "Исследования, добытые в советских лабораториях под Зоной."
 STALKER.10.t: "Лаборатория X-18"
 STALKER.10.d: "Наша экспедиция нашла запечатанную советскую лабораторию под заброшенным заводом в Тёмной долине, у Зоны в [STALKER_zone_name]. Единственная маркировка — X-18. Большая её часть затоплена, но уцелевшее оборудование и образцы артефактов в хранилищах на десятилетия опережают всё, что Советский Союз когда-либо признавал."
 STALKER.10.a: "Вывезти всё из лаборатории."
 STALKER.11.t: "Проект X"
 STALKER.11.d: "На Янтаре пси-излучатель, спрятанный в лаборатории X-16, превращал сталкеров в безмозглых бродяг. Документы рядом с ним называют программу, которая его создала: проект X. Его исследователи не изучали Зону, а пытались перекроить ноосферу, и Зона стала их ошибкой."
 STALKER.11.a: "Отключить излучатель."
 STALKER.12.t: "О-Сознание"
 STALKER.12.d: "Лаборатория X-10 питает Выжигатель мозгов — пси-установку, не пускавшую никого на север Зоны. Её материалы описывают О-Сознание: учёных, связавших свои разумы друг с другом и с тем, что они называли ноосферой. Зона, выбросы и «Монолит» оказались побочными эффектами эксперимента, который так и не остановился."
 STALKER.12.a: "Отключить Выжигатель мозгов."
 STALKER.13.t: "Более широкая сеть"
 STALKER.13.d: "Сопоставление материалов лабораторий X выявило нечто худшее. Финансирование, персонал и оборудование проекта X шли через учреждения далеко за пределами Зоны, и некоторые из этих каналов могут быть открыты до сих пор. Наши аналитики считают, что в другие правительства, включая наше, могли проникнуть."
 STALKER.13.a: "Начать контрразведывательную проверку."
 STALKER.13.a_tt: "Запускает тихую проверку наших министерств и научных институтов на предмет уцелевших каналов проекта X. Отчёт — через §Y180 дн.§!"
 STALKER.13.b: "Держать это в узком кругу."
 STALKER.13.b_tt: "Ограничивает доступ к находкам горсткой чиновников. С вероятностью §R40%§! в течение года они утекут."
 STALKER.10.a_tt: "Добавляет ещё §G5§! артефактов в национальный запас."
 STALKER.10.b: "Запечатать и выставить охрану."
 STALKER.10.b_tt: "§YСдерживание§! Зоны растёт на §G10§!."
 STALKER.11.a_tt: "§YАктивность§! Зоны падает до §G10§!."
 STALKER.11.b: "Оставить работать для изучения."
 STALKER.11.b_tt: "Наши находки в лабораториях X дают ещё §G+1%§! к скорости исследований. Число §Yсталкеров§! падает до §R10§!."
 STALKER.12.a_tt: "Стоит §R50§! политической власти. Открывает север Зоны: §Yэксплуатация§! растёт на §G10§!, а число §Yсталкеров§! — на §Y10§!."
 STALKER.12.b: "Оставить его работать как барьер."
 STALKER.12.b_tt: "§YСдерживание§! Зоны растёт на §G10§!."
 STALKER.14.t: "Отчёт контрразведывательной проверки"
 STALKER.14.d_found: "Наши следователи проследили деньги проекта X через научный институт и двух оборонных подрядчиков до чиновников, всё ещё состоящих на государственной службе. Сеть тихо ликвидирована, а разоблачившие её чиновники заработали правительству немного доверия."
 STALKER.14.d_dead_end: "Проверка ничего не нашла. Либо каналы проекта X давно закрыты, либо те, кто ими ещё управляет, замели следы лучше, чем могли проследить наши следователи."
 STALKER.14.a: "Хорошая работа."
 STALKER.14.b: "Не закрывать дело."
 STALKER.15.t: "Утечка материалов лабораторий X"
 STALKER.15.d: "Выдержки из наших секретных материалов лабораторий X появились в иностранной прессе. Теперь общество знает, что Зона не была случайностью, и хочет знать, как давно об этом знает правительство."
 STALKER.15.a: "Всё отрицать."
 STALKER_xlab_final_stage_reward_tt: "Наши находки в лабораториях X дают ещё §G+1%§! к скорости исследований."
 STALKER.14.a_tt: "Проникновение MDST падает до §G20§!."
 STALKER_polar_artifact_study: "Полярное изучение артефактов"
 STALKER_polar_artifact_study_desc: "Отправить добытые артефакты на нашу антарктическую станцию, где радиационная лаборатория сможет изучать их вдали от Зоны. Договор об Антарктике запрещает такую работу, и наблюдатели, посетившие станцию во время исследования, её обнаружат."
 STALKER_polar_artifact_study_artifacts_tt: "У нас не менее §Y5§! артефактов."
 STALKER_polar_artifact_study_lab_tt: "На нашей антарктической станции работает §Yрадиационная лаборатория§!."
 STALKER_polar_artifact_study_tt: "Потратить §Y5§! артефактов.\nНа §Y180§! дн.: §G+3%§! к скорости исследований и §G+15%§! к прогрессу итераций антарктической станции.\nНаблюдатели по Договору, посетившие станцию во время исследования, изымут образцы и сообщат о незаконных исследованиях.\nИсследование досрочно прекращается без результата, если радиационная лаборатория перестаёт работать."
 STALKER_polar_artifact_samples: "Полярные образцы артефактов"
 STALKER_polar_artifacts_returned_tt: "Вернуть §Y3§! артефакта в наш запас."
 STALKER.190.t: "Холодные образцы, ясные результаты"
 STALKER.190.d: "Полгода антарктического холода замедлили артефакты настолько, что их удалось измерить. У наших физиков теперь есть показания, которые не могла снять ни одна лаборатория рядом с Зоной. Мы можем направить находки в нашу реакторную программу или отправить уцелевшие образцы домой."
 STALKER.190.a: "Направить находки в реакторные исследования."
 STALKER.190.b: "Вернуть уцелевшие образцы домой."
 STALKER.191.t: "Наблюдатели по Договору нашли артефакты Зоны в Антарктике"
 STALKER.191.d: "Наблюдатели по Договору об Антарктике, проверявшие исследовательскую станцию ([FROM.GetAdjective]), обнаружили в её радиационной лаборатории артефакты из Зоны. Образцы изъяты, а Договор зафиксировал исследование как незаконное."
 STALKER.191.a: "Даже лёд недостаточно далеко."
 STALKER_export_artifacts: "Экспортировать артефакты"
 STALKER_export_artifacts_desc: "Продать партию из национального запаса иностранным покупателям по мировой цене.\n\nЗапас артефактов: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_export_artifacts_available_tt: "В национальном запасе не менее §Y5§! артефактов (сейчас §Y[?ROOT.STALKER_artifact_stockpile|1]§!)."
 STALKER_export_artifacts_tt: "Продаёт §Y5§! артефактов по §G$[?global.STALKER_artifact_price|2]§! млрд за штуку. Каждый экспорт снижает мировую цену на §Y$0.02§! млрд, но не ниже §Y$0.10§! млрд. Цена возвращается к §Y$0.20§! млрд на §Y$0.005§! млрд в месяц."
 STALKER_buy_market_artifacts: "Купить артефакты за рубежом"
 STALKER_buy_market_artifacts_desc: "Купить на открытом рынке партию артефактов для наших лабораторий.\n\nАртефактов на открытом рынке: §Y[?global.STALKER_market_artifacts|0]§!"
 STALKER_buy_market_artifacts_available_tt: "На открытом рынке не менее §Y5§! артефактов (сейчас §Y[?global.STALKER_market_artifacts|0]§!)."
 STALKER_buy_market_artifacts_treasury_tt: "Наша казна может оплатить §Y5§! артефактов по §Y$[?global.STALKER_artifact_price|2]§! млрд за штуку."
 STALKER_buy_market_artifacts_tt: "Покупает §Y5§! артефактов по §R$[?global.STALKER_artifact_price|2]§! млрд за штуку. Мы получаем §G+3%§! к скорости исследований на §Y180 дн.§! Каждая покупка повышает мировую цену на §Y$0.02§! млрд, но не выше §Y$0.50§! млрд. Цена возвращается к §Y$0.20§! млрд на §Y$0.005§! млрд в месяц."
 STALKER_found_zone_consortium: "Основать Консорциум исследований Зоны"
 STALKER_found_zone_consortium_desc: "Ни одно правительство не может в одиночку изучить все Зоны. Пригласить лаборатории мира объединить свои знания."
 STALKER_found_zone_consortium_tt: "Мы вступаем в новый консорциум и получаем §G+2%§! к скорости исследований. Затем к нему сможет присоединиться любая страна, а участники смогут финансировать сдерживание в Зонах друг друга."
 STALKER_join_zone_consortium: "Вступить в Консорциум исследований Зоны"
 STALKER_join_zone_consortium_desc: "Поделиться нашими исследованиями Зоны с консорциумом, основанным страной [?global.STALKER_consortium_founder.GetName], в обмен на доступ к их исследованиям."
 STALKER_join_zone_consortium_tt: "Мы получаем §G+2%§! к скорости исследований и можем финансировать сдерживание в Зонах других участников."
 STALKER_consortium_membership: "Консорциум исследований Зоны"
 STALKER_consortium_membership_desc: "Наши лаборатории делятся находками из аномальных Зон с другими участниками консорциума."
 STALKER_fund_consortium_containment: "Профинансировать сдерживание: [FROM.GetName]"
 STALKER_fund_consortium_containment_desc: "Оплатить работы на периметре в Зоне, принадлежащей другому участнику консорциума."
 STALKER_fund_consortium_containment_tt: "Стоит §Y0.4%§! ВВП. [FROM.GetName] получает §G10§! к §Yсдерживанию§! и теряет до §G5§! влияния §Yбандитов§!. Её владелец станет лучше к нам относиться."
 STALKER.50.t: "Основан Консорциум исследований Зоны"
 STALKER.50.d: "[?global.STALKER_consortium_founder.GetName] основывает международный консорциум для изучения аномальных Зон, которые теперь появляются по всему миру. Участники будут делиться исследованиями и помогать оплачивать сдерживание Зон друг друга."
 STALKER.50.a: "Возможно, наука ещё догонит Зону."
 STALKER_establish_anomalous_materials_bureau: "Создать Бюро аномальных материалов"
 STALKER_establish_anomalous_materials_bureau_desc: "Направить добытые артефакты на специальную промышленную исследовательскую программу. Бюро начинает с одного уровня размера и разрабатывает технику, используя исследования пехоты и артиллерии."
 STALKER_establish_anomalous_materials_bureau_available_tt: "Нужно не менее §Y5§! артефактов в национальном запасе."
 STALKER_establish_anomalous_materials_bureau_tt: "Потратить §Y5§! артефактов, чтобы создать Бюро аномальных материалов, увеличить его размер на §Y1§! и дать §Y1§! бесплатный выбор черты."
 STALKER_fund_anomalous_materials_bureau: "Финансировать исследования аномальных материалов"
 STALKER_fund_anomalous_materials_bureau_desc: "Направить добытые артефакты в исследовательский бюджет бюро. Его средства увеличивают размер ВПО при достижении порога развития, открывая дополнительные черты."
 STALKER_fund_anomalous_materials_bureau_available_tt: "Нужно не менее §Y5§! артефактов в национальном запасе."
 STALKER_fund_anomalous_materials_bureau_tt: "Потратить §Y5§! артефактов, чтобы добавить Бюро аномальных материалов §Y150§! средств ВПО."
 STALKER_anomalous_materials_bureau_available_tt: "Исход Кайманова распространил аномальные Зоны по всему миру."
 generic_STALKER_anomalous_materials_bureau: "Бюро аномальных материалов"
 generic_STALKER_anomalous_materials_bureau_trait: "Анализ добытых артефактов"
 STALKER_anomalous_materials_production_header: "Промышленное применение"
 STALKER_anomalous_materials_sample_characterization: "Описание образцов"
 STALKER_anomalous_materials_stabilized_alloys: "Обработка стабилизированных сплавов"
 STALKER_anomalous_materials_reproducible_fabrication: "Воспроизводимое изготовление"
 STALKER_anomalous_materials_gauss_prototypes: "Прототипы гаусс-пушек"
 STALKER_purge_mdst_channels: "Зачистить каналы MDST"
 STALKER_purge_mdst_channels_desc: "Арестовать чиновников, исследователей и подрядчиков, которых наши следователи связали с MDST."
 STALKER_purge_mdst_channels_tt: "Проникновение MDST падает до §G25§!."
 STALKER_warn_foreign_government: "Предупредить о MDST: [FROM.GetName]"
 STALKER_warn_foreign_government_desc: "Часть отслеженных нами каналов проходит через страну [FROM.GetName]. Поделившись тем, что знаем, мы можем закрыть и свои."
 STALKER_warn_foreign_government_tt: "Наше проникновение MDST падает до §G5§!. [FROM.GetName] узнаёт о MDST и обнаруживает, насколько глубоко он проник в её собственные учреждения."
 STALKER.80.t: "Исследования уходят за дверь"
 STALKER.80.d: "Из одной из наших лабораторий Зоны пропали образцы и документы. Никто их не выписывал, а все, у кого был доступ, прошли все наши проверки."
 STALKER.80.a: "Найти утечку."
 STALKER.80.a_tt: "Проникновение MDST падает до §G10§!. Мы уже потеряли до §R5§! артефактов из запаса, ушедших на чёрный рынок, и до §R20§! прогресса экспедиций в лаборатории X."
 STALKER.80.b: "Тихо ужесточить доступ."
 STALKER.80.b_tt: "Мы уже потеряли до §R5§! артефактов из запаса, ушедших на чёрный рынок, и до §R20§! прогресса экспедиций в лаборатории X."
 STALKER.81.t: "Предупреждение о MDST"
 STALKER.81.d: "[FROM.GetName] передаёт нам разведданные о MDST — Министерстве обороны и секретных технологий, продолжившем проект X после его закрытия. Их аналитики считают, что оно проникло в наши министерства и научные институты."
 STALKER.81.a: "Действовать по предупреждению."
 STALKER.81.a_tt: "Проникновение MDST падает до §G10§!, и мы станем лучше относиться к стране [FROM.GetName]."
 STALKER.81.b: "Разберёмся сами."
 STALKER_purge_mdst_channels_available_tt: "Проникновение MDST не ниже §Y5§! (сейчас §Y[?ROOT.STALKER_mdst_penetration|0]§!)."
 STALKER_strike_monolith: "Ударить по «Монолиту»: [FROM.GetName]"
 STALKER_strike_monolith_desc: "Отправить бронеколонну к станции, чтобы сломить хватку «Монолита» на центре Зоны.$STALKER_zone_society_readout$"
 STALKER_strike_monolith_tt: "Стоит §Y0.4%§! ВВП. [FROM.GetName] теряет до §G25§! влияния §Y«Монолита»§! и §R5§! §Yсдерживания§! из-за потерь и получает §G5§! влияния §Y«Долга»§!. В половине случаев сломленные бойцы «Монолита» переходят в §Y«Полдень»§! (§G+10§!)."
 STALKER.70.t: "Наступление «Монолита»"
 STALKER.70.d: "Бойцы «Монолита» хлынули на юг от станции и смяли два поста периметра в [STALKER_zone_name]. Выжившие описывают солдат, которые сражались молча и не останавливались ради своих раненых."
 STALKER.70.a: "Контратаковать, пока они не закрепились."
 STALKER.70.a_tt: "Наступление уже стоило Зоне §R10§! §Yсдерживания§! и §R5§! сталкеров. Стоит §R50§! политической власти. Зона теряет до §G20§! влияния §Y«Монолита»§! и получает §G5§! влияния §Y«Долга»§!. В половине случаев сломленные бойцы «Монолита» переходят в §Y«Полдень»§! (§G+10§!)."
 STALKER.70.b: "Отступить и держать новую линию."
 STALKER.70.b_tt: "Зона восстанавливает §G5§! §Yсдерживания§!. Наступление уже стоило ей §R10§! §Yсдерживания§! и §R5§! сталкеров."
 STALKER.71.t: "Паломники уходят на север"
 STALKER.71.d: "На прошлой неделе группа сталкеров прошла мимо Кордона, направляясь к станции. Их друзья говорят, что они несколько дней говорили об Исполнителе желаний. Ни один не вернулся."
 STALKER.71.a: "Они сделали свой выбор."
 STALKER.71.a_tt: "Зона уже потеряла §R10§! сталкеров, а влияние §Y«Монолита»§! выросло на §R5§!."
 STALKER.71.b: "Закрыть дорогу на север."
 STALKER.71.b_tt: "Зона уже потеряла §R10§! сталкеров, а влияние §Y«Монолита»§! выросло на §R5§!. Стоит §R25§! политической власти. Зона теряет до §G5§! влияния §Y«Монолита»§! и получает §G5§! §Yсдерживания§!."
 STALKER_mutant_incursion: "Нашествие мутантов"
 STALKER_mutant_incursion_desc: "Мутанты вырвались из соседней аномальной Зоны и бродят по этому региону."
 STALKER_organize_mutant_cull: "Организовать отстрел мутантов: [FROM.GetName]"
 STALKER_organize_mutant_cull_desc: "Нанять охотников и отправить патрули проредить псевдособак, кровососов и тварей похуже, которых выбросы выгоняют из Зоны.\n\nМутанты: §Y[?FROM.STALKER_zone_mutants|0]§!\nКаждый месяц мутанты убивают сталкеров в количестве §Y5%§! от своей численности. Каждый выброс добавляет §R15§!. Выше §Y49§! они могут прорваться в соседний регион."
 STALKER_organize_mutant_cull_tt: "Стоит §Y0.2%§! ВВП. [FROM.GetName] теряет до §G25§! мутантов."
 STALKER_fortify_perimeter_defenses: "Укрепить оборону периметра: [FROM.GetName]"
 STALKER_fortify_perimeter_defenses_desc: "Установить на уязвимых участках электрифицированные заграждения, автоматические датчики и минные полосы, чтобы остановить прорывы мутантов.\n\nМутанты: §Y[?FROM.STALKER_zone_mutants|0]§!\nСдерживание: §Y[?FROM.STALKER_zone_containment|0]%§!"
 STALKER_fortify_perimeter_defenses_tt: "Стоит §Y40§! политической власти и §Y0.2%§! ВВП. [FROM.GetName] получает §G15§! к §Yсдерживанию§!, теряет до §G15§! мутантов и на §Y1 год§! снижает риск прорыва мутантов."
 STALKER_deploy_acoustic_deterrents: "Развернуть акустические отпугиватели: [FROM.GetName]"
 STALKER_deploy_acoustic_deterrents_desc: "Установить вокруг полевых лагерей исследователей направленные высокочастотные акустические излучатели, чтобы отгонять стаи слепых псов и снорков.\n\nМутанты: §Y[?FROM.STALKER_zone_mutants|0]§!\nЭксплуатация: §Y[?FROM.STALKER_zone_exploitation|0]%§!"
 STALKER_deploy_acoustic_deterrents_tt: "Стоит §Y25§! политической власти и §Y0.1%§! ВВП. [FROM.GetName] теряет до §G20§! мутантов и получает §G5§! §Yэксплуатации§!, но теряет §R5§! влияния §Y«Свободы»§!."
 STALKER.90.t: "Мутанты прорывают периметр"
 STALKER.90.d: "Стая мутантов, выгнанная последним выбросом, прорвала периметр в [STALKER_zone_name]. Сёла за забором сообщают о погибшем скоте и закрытых дорогах. Соседний подконтрольный нам регион 60 дн. будет страдать от нашествия мутантов."
 STALKER.90.a: "Отправить за ними охотников."
 STALKER.90.a_tt: "Стоит §R25§! политической власти. Зона теряет до §G20§! мутантов и получает §G5§! сталкеров."
 STALKER.90.b: "Перекрыть дороги и переждать."
 STALKER.90.b_tt: "Зона получает §G5§! §Yсдерживания§!."
 STALKER.91.t: "Найдено логово кровососов"
 STALKER.91.d: "Разведпатрули в [STALKER_zone_name] обнаружили подземную колонию кровососов на заброшенном промышленном объекте. Перемещения стай мешают движению через соседние сектора."
 STALKER.91.a: "Приказать нанести военный удар и взорвать логово."
 STALKER.91.a_tt: "Стоит §R25§! политической власти и §Y0.2%§! ВВП. Зона теряет до §G20§! мутантов, получает §G5§! §Yсдерживания§! и теряет §G5§! влияния §Yбандитов§!."
 STALKER.91.b: "Нанять местных сталкеров для охоты за наградой."
 STALKER.91.b_tt: "Стоит §R15§! политической власти. Зона теряет до §G15§! мутантов, получает §G10§! §Yсталкеров§! и отправляет §G1§! аномальный образец в национальный запас артефактов."
 STALKER.91.c: "Запечатать выходы на поверхность и наблюдать."
 STALKER.91.c_tt: "Зона получает §G5§! §Yэксплуатации§! за счёт наблюдения за поведением, а популяции мутантов остаются нетронутыми."
 STALKER.92.t: "Пси-помехи на периметре"
 STALKER.92.d: "Телепаты-контролёры подобрались к линии периметра в [STALKER_zone_name]. Часовые на блокпостах жалуются на сокрушительные мигрени и галлюцинации, что вызывает локальную панику и временное оставление постов."
 STALKER.92.a: "Развернуть бронегруппы и пси-защитные шлемы."
 STALKER.92.a_tt: "Стоит §R30§! политической власти. Зона теряет до §G15§! мутантов и получает §G10§! §Yсдерживания§!."
 STALKER.92.b: "Отойти на укреплённый второй кордон."
 STALKER.92.b_tt: "Стоит §R1%§! стабильности. Зона теряет §R10§! §Yсдерживания§! и получает §R5§! §Yактивности§!."
 STALKER.92.c: "Бросить в прорыв добровольцев «Долга»."
 STALKER.92.c_tt: "Требуется не менее §Y15§! влияния §Y«Долга»§!. Зона теряет до §G20§! мутантов, получает §G10§! влияния §Y«Долга»§!, теряет §R5§! влияния §Y«Свободы»§! и получает §G5§! §Yсдерживания§!."
 STALKER.93.t: "На Кордоне замечен псевдогигант"
 STALKER.93.d: "Огромный псевдогигант прорвался в передовую буферную зону в [STALKER_zone_name], сокрушая укрепления периметра и гражданские баррикады сейсмическими ударами."
 STALKER.93.a: "Подтянуть тяжёлую артиллерию и крупнокалиберные расчёты."
 STALKER.93.a_tt: "Стоит §R40§! политической власти. Зона теряет до §G25§! мутантов и получает §G10§! §Yсдерживания§!, но теряет §R5§! §Yэксплуатации§! из-за повреждённых исследовательских датчиков."
 STALKER.93.b: "Заманить зверя в поле аномалий."
 STALKER.93.b_tt: "Требуется не менее §Y20§! §Yактивности§!. Зона теряет до §G15§! мутантов, получает §G5§! §Yсталкеров§!, а §Yактивность§! растёт на §R5§!."
 STALKER.94.t: "Спрос на биоматериал мутантов"
 STALKER.94.d: "Международные биотехнологические компании и оборонные подрядчики предлагают щедрые награды за свежие образцы тканей мутантов, добытые в [STALKER_zone_name]."
 STALKER.94.a: "Создать государственный совет по лицензированию торговли образцами."
 STALKER.94.a_tt: "Даёт доход в §G0.4%§! ВВП. Зона получает §G10§! §Yэксплуатации§!, теряет §R5§! §Yсдерживания§! и до §G10§! мутантов."
 STALKER.94.b: "Запретить коммерческий сбор и реквизировать все образцы."
 STALKER.94.b_tt: "Стоит §R15§! политической власти. Отправляет §G2§! аномальных образца в наш запас артефактов, повышает §Yсдерживание§! на §G10§! и снижает влияние §Yбандитов§! на §G5§!."