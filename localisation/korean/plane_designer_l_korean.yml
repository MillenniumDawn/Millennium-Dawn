 engine_solar_triple_1: "3발 태양광 엔진"
 engine_solar_triple_1_desc: "태양광 엔진을 사용하면 항공기가 전기 엔진으로 운용되어 공군의 연료 수요가 사라집니다.\n\n§G설계 힌트: 태양광 엔진은 항공기의 연료 소비를 0으로 만들고 항속 거리를 크게 늘리지만, 방공과 레이더 우위가 크게 감소합니다. 적 항공기나 대공 자원이 거의 없는 저강도 분쟁의 항공기에만 사용하기를 권장합니다.§!"
 engine_solar_quad_1: "4발 태양광 엔진"
 engine_solar_quad_1_desc: "태양광 엔진을 사용하면 항공기가 전기 엔진으로 운용되어 공군의 연료 수요가 사라집니다.\n\n§G설계 힌트: 태양광 엔진은 항공기의 연료 소비를 0으로 만들고 항속 거리를 크게 늘리지만, 방공과 레이더 우위가 크게 감소합니다. 적 항공기나 대공 자원이 거의 없는 저강도 분쟁의 항공기에만 사용하기를 권장합니다.§!"
 weap_buff_awacs_4: "초첨단 AWACS 체계"
 weap_buff_awacs_4_desc: "초첨단 AWACS 레이더, 데이터링크, 드론 연동 체계입니다.\n\n§G설계 힌트: AWACS 체계는 공중 정찰 임무를 수행하는 동안 아군에 상당한 제공권 보너스를 제공하며, 임무를 수행하는 비행대 내 항공기마다 이 보너스를 제공합니다§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B공중조기경보통제기§!"
