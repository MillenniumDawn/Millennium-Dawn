 # Liberal Arms Export Contracts
 FRA_liberal_arms_contracts: "Liberal Arms Export Policy"
 FRA_liberal_arms_contracts_desc: "Dassault, Naval Group, Thales, and MBDA lead one of the most advanced defence industries in the world. A liberal export policy lets us pursue lucrative contracts with nations seeking to modernise, filling our factories' order books while extending French influence through military partnerships."
 FRA_liberal_arms_contracts_tt: "Over the coming months, we will propose arms contracts to §YSaudi Arabia§!, §YUnited Arab Emirates§!, §YSerbia§!, §YGreece§!, §YEgypt§!, and §YIndia§!."
 FRA_arms_contract_opinion: "Arms Contract Partnership"

 # Saudi Arabia Arms Contract Events
 france_md.323.t: "Courting Riyadh"
 france_md.323.d: "Riyadh is shopping for a fighter to fly alongside its Eurofighters, and Naval Group's engineers still service the Al Riyadh-class frigates built under the Sawari programme. Our defence ministry has drawn up a proposal for [SAU.GetNameWithFlag]. What should we offer?"
 france_md.323.a: "Light weapons package ($5 billion)"
 france_md.323.b: "Heavy weapons package ($15 billion)"
 france_md.323.c: "Premium Rafale package ($30 billion)"
 france_md.323.e: "We will not pursue this contract"

 france_md.324.t: "Riyadh Weighs a French Offer"
 france_md.324.d: "[FRA.GetNameWithFlag] is offering the Rafale as an alternative to our Eurofighter squadrons, alongside an extension of the Sawari frigate programme that Naval Group has serviced for decades."
 france_md.324.a: "Accept the contract"
 france_md.324.b: "Decline the offer"

 # UAE Arms Contract Events
 france_md.325.t: "Courting Abu Dhabi"
 france_md.325.d: "The Emirati air force still flies the Mirage 2000-9, the variant Dassault built specifically for Abu Dhabi in the 1990s. With that fleet ageing, our defence ministry sees an opening to pitch its successor, the Rafale, to [UAE.GetNameWithFlag]. What should we offer?"
 france_md.325.a: "Light weapons package ($5 billion)"
 france_md.325.b: "Heavy weapons package ($15 billion)"
 france_md.325.c: "Premium Rafale package ($30 billion)"
 france_md.325.e: "We will not pursue this contract"

 france_md.326.t: "Abu Dhabi Weighs a French Offer"
 france_md.326.d: "[FRA.GetNameWithFlag] proposes the Rafale as the successor to our Mirage 2000-9 fleet, the bespoke variant Dassault built for us three decades ago."
 france_md.326.a: "Accept the contract"
 france_md.326.b: "Decline the offer"

 # Serbia Arms Contract Events
 france_md.327.t: "Courting Belgrade"
 france_md.327.d: "[SER.GetNameWithFlag] still flies Soviet-era MiG-29s and buys its short-range air defence from Moscow. We can offer the Rafale as their replacement, backed by MBDA's Mistral man-portable missiles for their air defence units. What should we propose?"
 france_md.327.a: "Light weapons package ($3 billion)"
 france_md.327.b: "Heavy weapons package ($8 billion)"
 france_md.327.c: "Premium Rafale package ($15 billion)"
 france_md.327.e: "We will not pursue this contract"

 france_md.328.t: "Belgrade Weighs a French Offer"
 france_md.328.d: "[FRA.GetNameWithFlag] is offering the Rafale as a Western alternative to our ageing MiG-29 fleet, together with MBDA's Mistral missiles for our air defence units. Accepting would mark our first major arms deal outside the Russian orbit."
 france_md.328.a: "Accept the contract"
 france_md.328.b: "Decline the offer"

 # Greece Arms Contract Events
 france_md.329.t: "Courting Athens"
 france_md.329.d: "[GRE.GetNameWithFlag] already flies our Rafales and wants to extend the relationship to the navy. Naval Group has pitched a FREMM-derived frigate package to match the air force order. What should we propose to our Hellenic allies?"
 france_md.329.a: "Light weapons package ($4 billion)"
 france_md.329.b: "Heavy weapons package ($12 billion)"
 france_md.329.c: "Premium Rafale package ($20 billion)"
 france_md.329.e: "We will not pursue this contract"

 france_md.330.t: "Athens Weighs a French Offer"
 france_md.330.d: "[FRA.GetNameWithFlag] proposes a package built around FREMM-derived frigates, extending a defence relationship already anchored by our earlier Rafale order."
 france_md.330.a: "Accept the contract"
 france_md.330.b: "Decline the offer"

 # Egypt Arms Contract Events
 france_md.331.t: "Courting Cairo"
 france_md.331.d: "[EGY.GetNameWithFlag] already flies our Rafales, operates the two Mistral-class carriers built for Russia and redirected to Cairo, and commissioned the FREMM frigate Tahya Misr from our own navy's order book. What should we propose to deepen the partnership?"
 france_md.331.a: "Light weapons package ($4 billion)"
 france_md.331.b: "Heavy weapons package ($12 billion)"
 france_md.331.c: "Premium Rafale package ($25 billion)"
 france_md.331.e: "We will not pursue this contract"

 france_md.332.t: "Cairo Weighs a French Offer"
 france_md.332.d: "[FRA.GetNameWithFlag] offers to expand a partnership that already spans our Rafale squadrons, the Mistral-class carriers, and the FREMM frigate Tahya Misr."
 france_md.332.a: "Accept the contract"
 france_md.332.b: "Decline the offer"

 # India Arms Contract Events
 france_md.333.t: "Courting New Delhi"
 france_md.333.d: "[IND.GetNameWithFlag] operates one of the largest defence markets in the world. New Delhi already flies thirty-six Rafales and builds Scorpene-class submarines under licence at Mazagon Dock. What should we propose to expand the partnership?"
 france_md.333.a: "Light weapons package ($6 billion)"
 france_md.333.b: "Heavy weapons package ($20 billion)"
 france_md.333.c: "Premium Rafale package ($40 billion)"
 france_md.333.e: "We will not pursue this contract"

 france_md.334.t: "New Delhi Weighs a French Offer"
 france_md.334.d: "[FRA.GetNameWithFlag] proposes to build on the Rafales already in Indian Air Force service and the Scorpene-class submarines built under licence at Mazagon Dock."
 france_md.334.a: "Accept the contract"
 france_md.334.b: "Decline the offer"

 # Joint Weapon Projects Category
 FRA_joint_weapon_projects_category: "Joint Weapon Development Projects"
 FRA_joint_weapon_projects_category_desc: "France has a long history of joint defence programmes, from the Jaguar strike aircraft with Britain to the Tiger helicopter with Germany. New joint projects let us split development costs and field equipment neither partner could afford alone."

 # Franco-German Joint Project (SCAF/MGCS)
 FRA_joint_project_germany: "Propose SCAF/MGCS Joint Project"
 FRA_joint_project_germany_desc: "SCAF (Système de Combat Aérien du Futur) pairs Dassault with Airbus to design a sixth-generation fighter to succeed the Rafale and Eurofighter. MGCS (Main Ground Combat System) tasks KNDS with a new main battle tank to replace the Leclerc and Leopard 2. Together they would be the largest defence programmes either nation has run since the Cold War."
 FRA_socialist_government_required_tt: "Requires a §YSocialist§! or §YLeft-wing§! government in power"

 # Franco-Russian Joint Project (ATOM IFV)
 FRA_joint_project_russia: "Propose Franco-Russian ATOM Project"
 FRA_joint_project_russia_desc: "We propose the ATOM infantry fighting vehicle as a joint programme with Moscow, pairing Nexter's design teams with Russian armoured vehicle engineers. Breaking with our Western allies this deeply requires leaving the EU first."
 FRA_nationalist_government_required_tt: "Requires a §YNationalist§! or §YNational Rally§! government in power"

 # Joint Project Opinion Modifier
 FRA_joint_project_opinion: "Joint Weapon Development Partner"

 # Franco-German Project Events
 france_md.335.t: "Franco-German SCAF/MGCS Project Proposal"
 france_md.335.d: "[FRA.GetNameWithFlag] proposes launching SCAF (Système de Combat Aérien du Futur) and MGCS (Main Ground Combat System) as joint programmes: a sixth-generation fighter to succeed the Rafale and Eurofighter, and a main battle tank to replace the Leclerc and Leopard 2. Dassault, Airbus, and KNDS would split the engineering work between Paris and Berlin."
 france_md.335.a: "Let us build the future of European defence together"
 france_md.335.b: "We prefer to develop our systems independently"

 france_md.336.t: "Germany Accepts SCAF/MGCS Project"
 france_md.336.d: "[GER.GetNameWithFlag] has accepted our proposal for SCAF and MGCS. Dassault and Airbus engineers will work alongside their German counterparts on the fighter programme, while KNDS leads the tank."
 france_md.336.a: "Excellent! Long live Franco-German cooperation!"

 # Franco-Russian Project Events
 france_md.337.t: "Franco-Russian ATOM Project Proposal"
 france_md.337.d: "[FRA.GetNameWithFlag] proposes the ATOM infantry fighting vehicle as a joint Franco-Russian programme, pairing Nexter's engineers with Russian armoured vehicle designers. Having already distanced itself from its traditional Western allies, Paris is now looking east for defence partners."
 france_md.337.a: "A new era of Franco-Russian cooperation begins"
 france_md.337.b: "This proposal is too controversial"

 france_md.338.t: "Russia Accepts ATOM Project"
 france_md.338.d: "[RUS.GetNameWithFlag] has accepted our proposal for the ATOM programme. Nexter engineers will work alongside their Russian counterparts on a new infantry fighting vehicle, our first major defence partnership with Moscow since the Cold War."
 france_md.338.a: "A new chapter in Franco-Russian relations!"

 # Joint Project Ideas
 FRA_FCAS_MGCS_project: "SCAF/MGCS Development Programme"
 FRA_FCAS_MGCS_project_desc: "France and Germany are jointly developing SCAF (Système de Combat Aérien du Futur), a sixth-generation fighter led by Dassault and Airbus, and MGCS (Main Ground Combat System), a new main battle tank led by KNDS. Together they are the largest defence programmes either country has run since the Cold War."
 GER_FCAS_MGCS_project: "SCAF/MGCS Development Programme"
 GER_FCAS_MGCS_project_desc: "Germany and France are jointly developing SCAF (Système de Combat Aérien du Futur), a sixth-generation fighter led by Airbus and Dassault, and MGCS (Main Ground Combat System), a new main battle tank led by KNDS. Together they are the largest defence programmes either country has run since the Cold War."
 FRA_RUS_joint_project: "Franco-Russian ATOM Programme"
 FRA_RUS_joint_project_desc: "France and Russia have launched a joint military development programme, the ATOM infantry fighting vehicle project. Nexter's engineers pair with Russian armoured vehicle designers to produce a new IFV platform."
 RUS_FRA_joint_project: "Franco-Russian ATOM Programme"
 RUS_FRA_joint_project_desc: "Russia and France have launched a joint military development programme, the ATOM infantry fighting vehicle project. Russian armoured vehicle designers pair with Nexter's engineers to produce a new IFV platform."

 # Communist Path - End the Republic Focuses
 FRA_constitutional_crisis_pcf: "The Revolutionary Temptation"
 FRA_constitutional_crisis_pcf_desc: "Within our leftist coalition, a radical faction has been gaining influence. These revolutionary hardliners believe that democratic socialism moves too slowly and demand immediate, total transformation. The moderate leadership of La France Insoumise and the PCF struggles to contain extremists who see the general strike as the first step toward revolution."
 FRA_abolish_fifth_republic_pcf: "The Extremists Seize Control"
 FRA_abolish_fifth_republic_pcf_desc: "The radical faction within the left has outmanoeuvred the moderate leadership. Mélenchon and the PCF reformists have been sidelined by revolutionary hardliners who reject the Fifth Republic's 'bourgeois democracy' entirely. They demand a Constituent Assembly to draft a new constitution, backed by enough street power to enforce their will."
 FRA_sixth_republic: "Proclaim the Sixth Republic"
 FRA_sixth_republic_desc: "The moderate faction has regained some influence, steering the revolution toward a democratic socialist Sixth Republic rather than outright communism. This compromise preserves republican institutions while fundamentally transforming French society through parliamentary means."
 FRA_french_commune_peaceful: "Establish the French Commune"
 FRA_french_commune_peaceful_desc: "The revolutionary hardliners have triumphed completely. In the spirit of the Paris Commune of 1871, France will become a true workers' state. The means of production will be collectivised, worker councils will govern at all levels, and the moderate reformists have lost control entirely."
 FRA_republic_safe_pcf: "Our Most Precious Possession"
 FRA_republic_safe_pcf_desc: "We have arrested the radical faction leaders and disbanded their paramilitary cells. The Republic survives. Mélenchon and the moderate reformists retain control of the left. The revolutionary dream is over, replaced by the slower, more stable path of democratic reform."

 # National Rally Path - End the Republic Focuses
 FRA_question_republic_fn: "The Questionable Republic"
 FRA_question_republic_fn_desc: "Within the National Rally, a traditionalist faction has been growing in influence. While [FRA.GetLeader] and the mainstream leadership remain committed to the Republic, these extremists, inspired by Action Française and the Catholic traditionalist movement, openly question whether democracy itself has failed France. We must act before it is too late."
 FRA_referendum_republic: "The Hardliners Force a Referendum"
 FRA_referendum_republic_desc: "The traditionalist faction has outmanoeuvred Le Pen's moderate republicans. Action Française militants, Catholic intégristes, and nostalgic monarchists have seized control of the party apparatus. They demand a referendum on the very existence of the Republic, and the mainstream leadership can no longer stop them."
 FRA_restore_kingdom_fn: "Restore the Kingdom"
 FRA_restore_kingdom_fn_desc: "The monarchist faction within the movement has won. Whether we crown the Orleanist pretender Jean d'Orléans as 'King of the French' or the Legitimist claimant Louis de Bourbon as 'King of France,' the republican moderates of the government coalition have been completely sidelined by the traditionalist extremists."
 FRA_restore_empire_fn: "Restore the Empire"
 FRA_restore_empire_fn_desc: "The Bonapartist faction has triumphed. Jean-Christophe Napoléon Bonaparte will be crowned Napoleon VII. The moderate republicans who once led the government have been swept aside by those who dream of imperial glory: a strong France united under an Emperor, not squabbling parliamentarians."
 FRA_republic_safe_fn: "Saving the Republic"
 FRA_republic_safe_fn_desc: "We have arrested the traditionalist faction leaders and disbanded their paramilitary cells. The Republic survives! Our government and the moderate nationalists retain control. Using the crisis as justification, we pass reforms to reinforce the power of the state: expanded security services, stricter controls on extremist organisations, and enhanced executive authority. The Fifth Republic endures, stronger than ever."

 # New Extremist Infiltration Events
 france_md.370.t: "Keeping Our Hands Clean"
 france_md.370.d: "Our rise to power already seems to have caught the attention of political movements. This morning we were contacted by revolutionary communist cells. They have offered to help us consolidate our hold on power, in particular by gathering information on our political opponents and tracking down far-right splinter groups to prevent them from harming us. We shouldn't get involved with such groups, as we are now committed to reform and the Republic. But it would still be useful to have this tool."
 france_md.370.a: "Allow them to organise: we need their support"
 france_md.370.b: "Reject them: we are democrats, not revolutionaries"

 france_md.371.t: "Voices From the Shadows"
 france_md.371.d: "Our success in the elections and our effectiveness in implementing a nationalist programme have not gone unnoticed. We have received proposals from various traditionalist splinter groups: Action Française sympathisers, Catholic intégristes, and those who dream of restoring the monarchy. They were impressed by our performance and are offering us their paramilitary networks and political connections in exchange for being allowed to organise openly. Their true intentions remain veiled."
 france_md.371.a: "Allow them to organise: their support strengthens us"
 france_md.371.b: "Reject them: we stand with the republic"

 france_md.372.t: "The Republic Stands"
 france_md.372.d: "The radical faction has been broken. Their leaders are arrested, their cells disbanded, their dreams of revolution crushed. The moderate reformists remain in control, and France remains a republic, transformed perhaps but still recognisably democratic. The extremists gambled and lost."
 france_md.372.a: "Reformism always wins"

 france_md.373.t: "Long Live the Republic!"
 france_md.373.d: "The traditionalist coup has been foiled! The DGSI moved swiftly: Action Française leaders are in custody, monarchist cells have been raided, and the dreams of restoration lie in ruins. The people celebrate in the streets as Le Pen addresses the nation: the Fifth Republic stands strong. Using this crisis as justification, we pass sweeping reforms to reinforce state authority and ensure such threats never arise again."
 france_md.373.a: "The Republic is saved, stronger than ever!"

 france_md.374.t: "The Factions Fight for Power"
 france_md.374.d: "The coup has succeeded. The Republic has fallen. But now the traditionalist factions turn on each other. The monarchists demand restoration of the Bourbon or Orléans line. The Bonapartists dream of imperial glory under Napoleon VII. Only one faction can win. Which vision will prevail?"
 france_md.374.a: "The Monarchists prevail: restore the Kingdom!"
 france_md.374.b: "The Bonapartists triumph: restore the Empire!"

 # Communist Path Events - Crackdown/Coup System
 france_md.340.t: "The Looming Uprising"
 france_md.340.d: "The radical faction has grown too bold. Their paramilitary cells have been exposed, their infiltration of the party apparatus revealed. There are even rumours that they have infiltrated our army's high command and are preparing for a coup d'état. We must choose: crack down on them now and preserve the Republic, or let them continue their work and see where it leads. The DGSI awaits our orders."
 france_md.340.a: "Crack down: arrest the radical leaders"
 france_md.340.b: "Let them be: the revolution must continue"

 france_md.341.t: "The Radicals Seize Power"
 france_md.341.d: "It happened in a single night. The radical faction moved with precision: their paramilitary cells seized key buildings, their infiltrators in the military secured crucial bases. [FRA.GetLeader] and the moderate reformists wake to find themselves prisoners in all but name. The revolutionary hardliners have executed their coup. The Fifth Republic is dead."
 france_md.341.a: "The revolution has begun"

 france_md.345.t: "The Commune Rises Again"
 france_md.345.d: "The revolutionary hardliners have won completely. Rejecting any compromise with 'bourgeois democracy,' they have proclaimed the French Commune, a true workers' state in the tradition of 1871. The moderate reformists who built the original coalition have been purged or fled. The red flag flies over the Élysée Palace, and the revolution has only just begun."
 france_md.345.a: "Long live the Commune! The Internationale shall be the human race!"

 # National Rally Path Events - Crackdown/Coup System
 france_md.375.t: "Fight or Fold"
 france_md.375.d: "The traditionalist faction has grown too confident. Their paramilitary networks have been exposed, their infiltration of the party apparatus revealed. There are even rumours that they have infiltrated our army's high command and are preparing for a coup d'état. We must choose: crack down on them now and preserve the Republic, or let them continue their work and see where it leads. The DGSI awaits our orders."
 france_md.375.a: "Crack down: arrest the traditionalist leaders"
 france_md.375.b: "Let them be: the restoration must continue"

 france_md.376.t: "The Traditionalists Seize Power"
 france_md.376.d: "It happened in a single night. The traditionalist faction moved with precision: their paramilitary cells secured key buildings, their allies in the military ensured non-interference. [FRA.GetLeader] and the moderate republicans wake to find themselves sidelined completely. The extremists have executed their coup. The Fifth Republic is dead. But who will rule the new France?"
 france_md.376.a: "The factions must now decide"

 france_md.354.t: "The Monarchists Choose Their King"
 france_md.354.d: "The monarchist faction within the movement must now choose their sovereign. Two claimants present themselves: Jean d'Orléans, Count of Paris, represents the Orleanist line, and would be a constitutional monarch, 'King of the French.' Louis de Bourbon, Duke of Anjou, represents the Legitimist line of Louis XIV, and would be 'King of France' by divine right. The Action Française traditionalists must decide."
 france_md.354.a: "Crown Jean d'Orléans, King of the French"
 france_md.354.b: "Crown Louis de Bourbon, King of France"

 france_md.357.t: "The Bonapartists Triumph"
 france_md.357.d: "The Bonapartist faction within the movement has won the internal struggle. Jean-Christophe Napoléon Bonaparte will be crowned Napoleon VII. The military and those who dream of imperial glory have prevailed over the monarchists. Marine Le Pen and the old republican guard of the National Rally have been swept aside completely. France will be an Empire once more."
 france_md.357.a: "Long live the Emperor! Long live France!"

 france_md.358.t: "Bonapartists Seize Power in France"
 france_md.358.d: "Shocking news from [FRA.GetNameWithFlag]: extremist factions within the ruling party have seized control and abolished the Fifth Republic. The moderate leadership has been sidelined as radicals restore imperial rule. This dramatic coup against democracy has shocked the world. How should we respond ?"
 france_md.358.a: "Condemn this extremist takeover"
 france_md.358.b: "This is an internal French matter"
 
 france_md.359.t: "Monarchists Seize Power in France"
 france_md.359.d: "Shocking news from [FRA.GetNameWithFlag]: extremist factions within the ruling party have seized control and abolished the Fifth Republic. The moderate leadership has been sidelined as radicals restore monarchist rule. This dramatic coup against democracy has shocked the world. How should we respond ?"
 france_md.359.a: "Condemn this extremist takeover"
 france_md.359.b: "This is an internal French matter"


 # Extremist Infiltration Ideas
 FRA_extremist_paramilitary_left: "Revolutionary Paramilitary"
 FRA_extremist_paramilitary_left_desc: "We have allowed the radical faction to organise their paramilitary networks openly. These revolutionary cells provide us with street power and control over potential dissent. But at what cost? Their true loyalties remain with the revolution, not the party leadership."
 FRA_extremist_paramilitary_right: "Traditionalist Paramilitary"
 FRA_extremist_paramilitary_right_desc: "We have allowed the traditionalist faction to organise their paramilitary networks openly. These Action Française cells provide us with street power and control over potential dissent. But at what cost? Their true loyalties remain with the restoration, not the party leadership."
 FRA_radical_infiltration: "Radical Infiltration"
 FRA_radical_infiltration_desc: "The radical faction is quietly infiltrating the party apparatus and military. Their revolutionary cells spread through the institutions, building the network they will need when the time comes. The moderate leadership remains unaware of how deep the infiltration runs."
 FRA_traditionalist_infiltration: "Traditionalist Infiltration"
 FRA_traditionalist_infiltration_desc: "The traditionalist faction is quietly infiltrating the party apparatus and military. Their monarchist cells spread through the institutions, building the network they will need when the time comes. The moderate leadership remains unaware of how deep the infiltration runs."
 FRA_republic_stabilized_left: "Republic Stabilised"
 FRA_republic_stabilized_left_desc: "The radical threat has been neutralised. The DGSI has arrested the extremist leaders and dismantled their paramilitary cells. France remains a republic, and the moderate reformists retain control of the left. The revolution won't happen, but we'll make sure we give the people the tools to express themselves in other ways."
 FRA_republic_stabilized_right: "Strong Republic"
 FRA_republic_stabilized_right_desc: "The traditionalist threat has been crushed, and we used the crisis to pass sweeping reforms reinforcing state power. The DGSI now has expanded surveillance authority, the police have new powers against extremist organisations, and executive authority has been strengthened. The Fifth Republic endures: stronger, more centralised, and firmly under nationalist control."

 # End the Republic Ideas
 FRA_general_strike: "Revolutionary General Strike"
 FRA_general_strike_desc: "A radical faction within the leftist coalition has mobilised the workers for a general strike, going beyond what the moderate leadership intended. The CGT has been captured by revolutionary hardliners who see this as the first step toward ending the Republic entirely. The party leadership has lost control of the movement they started."
 FRA_country_chaos: "Alarming Rumours"
 FRA_country_chaos_desc: "A wave of panic has swept across the country. Rumors are circulating about looted weapons depots and mass desertions. Something is brewing..."
 FRA_sixth_republic_idea: "The Sixth Republic"
 FRA_sixth_republic_idea_desc: "No one wanted the Fifth Republic any more, so we brought it to an end democratically and established a new republic that is closer to the people."
 FRA_commune_reborn_idea: "The French Commune"
 FRA_commune_reborn_idea_desc: "The revolutionary hardliners have triumphed completely. The moderate reformists who once led the left have been purged as France transforms into a workers' state. In the spirit of 1871, worker councils now govern and the means of production have been collectivised. The red flag flies where the tricolour once flew."
 FRA_kingdom_restored_idea: "The Kingdom Restored"
 FRA_kingdom_restored_idea_desc: "The traditionalist extremists within the nationalist movement have achieved their dream: France once again has a king. The moderate republicans of the National Rally watch in disbelief as Action Française celebrates and the fleur-de-lis replaces the tricolour."
 FRA_exploitation: "Bled for the Metropole"
 FRA_exploitation_desc: "Our factories, our trade and our taxes are routed to Paris first and to our own people second. Every shipment that leaves the docks buys us a little more resentment at home and a little more distance from the Empire."
 FRA_empire_restored_idea: "The Empire Restored"
 FRA_empire_restored_idea_desc: "The Bonapartist faction within the movement has restored the French Empire under Napoleon VII. The moderate republicans who built the National Rally have been swept aside by those who dream of imperial glory. France is once again ruled by an Emperor, and the military-traditionalist alliance celebrates its complete victory."
 FRA_investing_eu: "Investing in an EU Country"
 FRA_investing_eu_desc: "We are currently helping another EU nation to buildup"
 FRA_election_result: "The Results"
 FRA_election_result_desc: "The presidential election is over or about to end; voting intentions are unlikely to change for a while."
 FRA_spy_napoleon_lar: "Bonapartist Secret Service"
 FRA_spy_napoleon_lar_desc: "A new generation of secret agents trained to sow discord amongst our enemies, feeding real-time intelligence to our army, navy, and air staff as the reconquest gathers pace."
 FRA_spy_napoleon_non_lar: "Bonapartist Secret Service"
 FRA_spy_napoleon_non_lar_desc: "A new generation of secret agents trained to sow discord amongst our enemies, watching our own barracks and ministries for the next plot against the throne."
 FRA_5th_republic: "The Fifth Republic"
 FRA_5th_republic_desc: "The current French political system, in place since 1958. A republic established under General de Gaulle and tailored to his needs. A stable system, but one that is beginning to show its limitations in a country that is increasingly out of balance, with an all-powerful president."
 FRA_war_against_republic: "War Against Republicanism"
 FRA_war_against_republic_desc: "The French monarchy was at its strongest under absolutism. Since then, our country has endured decades of republics, each more unstable than the last. Republican and Democratic values are dangerous for our country and are spreading like a cancer across the world. We must put an end to this."
 FRA_EU_strong: "Strength With the EU"
 FRA_EU_strong_desc: "Being a pillar of the European Union is a great responsibility, but also a great strength. Our destiny is linked to that of the European Union, whether we like it or not."
 FRA_NOTRe_law: "NOTRe Law"
 FRA_NOTRe_law_desc: "Decentralisation has not been properly implemented in France, leaving numerous legal loopholes and inconsistencies in its wake. The Law on the New Organisation of the Republic's Territories will make it possible to rectify these shortcomings and to simplify the organisation and planning of our territories."
 FRA_military_indus_boost: "Investing in Our Defence Industry"
 FRA_military_indus_boost_desc: "Given the growing international tensions, we must spare no expense in preparing for a possible conflict."
 FRA_civilian_jobs_boost: "Focusing on Creating Jobs"
 FRA_civilian_jobs_boost_desc: "We need to invest more in the labour market to provide our citizens with a diverse range of job opportunities."
 FRA_internal_investment_boost: "Focusing on Internal Investments"
 FRA_internal_investment_boost_desc: "By providing subsidies to the private sector, we will be able to encourage it to create more jobs."
 FRA_direct_construction_boost: "Investing on Public Works"
 FRA_direct_construction_boost_desc: "As the market is not performing well, we must utilise our workforce to build the economy of tomorrow."
 FRA_indusfarm_boost: "Subsidising Agriculture"
 FRA_indusfarm_boost_desc: "We must help our agricultural sector to win back European markets by increasing our production, whatever the means."
 FRA_civilian_infra_boost: "Investing on Infrastructures"
 FRA_civilian_infra_boost_desc: "We need to invest in non-metropolitan areas so that people there can access the same services as in metropolitan areas."
 FRA_indusbuild_services_boost: "Investing on Services Industry"
 FRA_indusbuild_services_boost_desc: "We are building the economy of tomorrow, free from uncompetitive and polluting industries."
 FRA_techno_boost: "Education Investments"
 FRA_techno_boost_desc: "What we need is to enable everyone to pursue the most advanced studies."
 FRA_res_health_boost: "Focusing on Public Services"
 FRA_res_health_boost_desc: "We must rebuild the service provision that has for too long been the target of ultra-liberal policies."
 FRA_local_consumption_boost: "Supporting the Relocation of Our Food Supply"
 FRA_local_consumption_boost_desc: "Our tables are stocked from the other side of the world while French farms go under. Shortening the chain between the field and the plate keeps that value inside the country."
 FRA_job_planned_boost: "Investing in Our industry"
 FRA_job_planned_boost_desc: "We must help our businesses create more jobs and prevent them from making redundancies. This will enable us to put an end to unemployment whilst increasing job security."
 FRA_ps_EUtrain: "French Training Mission"
 FRA_ps_EUtrain_desc: "The French government has invited us to take part in joint military exercises alongside other European Union countries."
 FRA_PCF_EUtrain: "Preparing Eastern Escalation"
 FRA_PCF_EUtrain_desc: "In the face of potential aggression from Russia, we must prepare to confront it on the battlefield."
 FRA_EU_LEAVE: "Rebuilding our Economy"
 FRA_EU_LEAVE_desc: "Our economy was too closely integrated with the European Union; breaking away from it has had far-reaching consequences. We will rebuild it to be even stronger and more independent."
 FRA_patriotic_fervor: "Patriotic fervour"
 FRA_patriotic_fervor_desc: "The reconquest of our Empire has only just begun."
 FRA_learning_from_worforce: "Integrating Society"
 FRA_learning_from_worforce_desc: "We are in the process of integrating the knowledge and workforce of a sister nation."
 FRA_attack_UK_king: "La Royale"
 FRA_attack_UK_king_desc: "Our attention may be focused on the United Kingdom as a former enemy of France. But in any case, we will have to fight a maritime power at one time or another. The French Navy must therefore be prepared to fight at sea."
 FRA_french_papacy: "Papacy Under Control"
 FRA_french_papacy_desc: "We have decided to host the headquarters of the Catholic Church in France. We are therefore in a position to protect it and thus enjoy greater legitimacy in the eyes of other Christian countries."



 # Extremist Faction Foreign Policy Ideas
 FRA_gaullist_foreign_policy: "Gaullist Foreign Policy"
 FRA_gaullist_foreign_policy_desc: "Following General de Gaulle's vision, France pursues a policy of strategic independence from both superpowers. We maintain distance from American hegemony while engaging pragmatically with Russia and China. France must be a great power in its own right, not a vassal of Washington."
 FRA_anti_american_stance: "Anti-American Stance"
 FRA_anti_american_stance_desc: "The French government has adopted an openly hostile attitude toward the United States. American military operations will not receive French support, and diplomatic relations have cooled significantly. France charts its own course, free from Atlantic constraints."
 FRA_fn_russia_alignment_idea: "National Rally-Russia Alignment"
 FRA_fn_russia_alignment_idea_desc: "The National Rally government has cultivated close ties with Russia, reflecting historical connections and shared opposition to American liberalism. Marine Le Pen's praise for Putin's 'traditional values' has translated into concrete policy alignment on multiple issues."
 FRA_fn_protectionism: "Economic Patriotism"
 FRA_fn_protectionism_desc: "Tariffs and public procurement now favour the French producer over the cheaper import, and our factories are running fuller than they have in years. Our trading partners have noticed, and they are not grateful."
 FRA_fn_nationalist_policy: "National Preference"
 FRA_fn_nationalist_policy_desc: "One of our key measures is national preference: to push everything that isn't French into the background."
 FRA_communist_foreign_policy: "Communist Foreign Policy"
 FRA_communist_foreign_policy_desc: "The Communist Party has implemented a radical reorientation of French foreign policy: alliance with the United States is impossible, and France instead seeks solidarity with socialist states worldwide. NATO membership is fundamentally incompatible with our ideology."
 FRA_lfi_non_aligned_policy: "Non-Aligned France"
 FRA_lfi_non_aligned_policy_desc: "La France Insoumise has implemented a policy of non-alignment, rejecting both American hegemony and Russian authoritarianism. France will not participate in American military adventures and maintains independence from NATO command structures while seeking leadership of a new non-aligned movement."
 FRA_lfi_anti_nato: "Anti Nato Policies"
 FRA_lfi_anti_nato_desc: "We have successfully withdrawn from NATO; we could no longer tolerate the actions of American imperialism. Our current position now gives us greater control over our foreign policy."
 FRA_worker_internationalism: "Beacon of Internationalism"
 FRA_worker_internationalism_desc: "Communism has been a success in France, and that is a fact. This success means we have a satisfied workforce and enables us to attract workers from all over the world."
 FRA_lfi_social_europe: "European Public Services Reform"
 FRA_lfi_social_europe_desc: "LFI's France has succeeded in putting forward a new social agenda for the European Union. This is a major victory against this deeply neoliberal institution."
 FRA_strategic_independance: "Strategic Independence"
 FRA_strategic_independance_desc: "France has committed to complete strategic autonomy, maintaining its independent nuclear deterrent and refusing subordination to any foreign power. American bases are not welcome on French soil, and France will make its own decisions about military interventions."
 FRA_global_south_solidarity: "Global South Solidarity"
 FRA_global_south_solidarity_desc: "Colonialism has undeniably had a significant impact on the development of countries in the Global South. We will be doing the right thing by helping them to recover from this."
 FRA_sovereigntist_eu_policy: "Sovereigntist EU Policy"
 FRA_sovereigntist_eu_policy_desc: "France blocks further EU federalisation, defending national sovereignty against Brussels technocracy. While remaining in the EU, we veto any transfer of sovereignty and oppose the creation of a European superstate. France will not become a province."
 FRA_distance_nato: "Distance from NATO"
 FRA_distance_nato_desc: "Following De Gaulle's 1966 precedent, France maintains distance from NATO's integrated command structure while remaining a treaty member. American troops are not stationed on French soil, and France reserves the right to independent military action."
 FRA_left_nato: "Left NATO"
 FRA_left_nato_desc: "France has withdrawn from the North Atlantic Treaty Organisation entirely. No longer bound by Article 5, France charts a truly independent course in military affairs, rejecting American hegemony outright."
 FRA_political_balance: "Public Opinion Trends"
 FRA_political_balance_desc: "Although our institutions were designed to ensure stability, the political balance has never been so precarious. Parties rise and fall. Whoever you are, you will need to consolidate our hold on public opinion."
 FRA_econ_policy: "State of the French Economy"
 FRA_econ_policy_desc: "The French economy is a good example of a Western economy at the dawn of the new millennium, transitioning from an industrial powerhouse to an economy in the process of restructuring. We will see how your reforms will affect its future direction."
 FRA_social_balance: "French Social Policies"
 FRA_social_balance_desc: "France is a country that invests heavily in its social policy at all levels. However, most parties have issues with this policy. Everyone has their own views on how it should change. We will see how your decisions affect it."
 FRA_6th_rep: "Reforms of the Sixth Republic"
 FRA_6th_rep_desc: "La France insoumise has succeeded in reforming the Fifth Republic. But beyond the institutions, these reforms will have far-reaching consequences for French society and the French economy."
 FRA_Commies_agenda: "French Commune's Policies"
 FRA_Commies_agenda_desc: "The Commune of France has decided to make a clean break with the past and is determined to rebuild society from scratch."
 FRA_Bonapartist_agenda: "The Imperial Society"
 FRA_Bonapartist_agenda_desc: "Our new Emperor has decided to reform French society to make it greater and stronger in the face of the conflicts that lie ahead."
 FRA_Royalist_agenda: "The New Frank's Society"
 FRA_Royalist_agenda_desc: "We must put an end to all the diabolical inventions of the accursed Revolution. We shall rebuild Frankish society on solid foundations."
 FRA_World_revolution: "The World Revolution"
 FRA_World_revolution_desc: "As we liberate peoples from capitalism, We are joined by peoples who bring with them both their knowledge and their hopes. Soon, the International will be the whole of humanity."


