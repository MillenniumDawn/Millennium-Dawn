 EGY_regime_balance: "Mubarak's Regime Balance"
 EGY_regime_balance_desc: "The Mubarak presidency rules by balancing the armed forces, the security services, and the Muslim Brotherhood. Its strength rises when the factions with the most influence are content, and falls when they are not."
 EGY_bread_subsidies: "Bread Subsidies"
 EGY_bread_subsidies_desc: "Baladi bread costs five piasters a loaf, and tens of millions of Egyptians depend on it. The state buys wheat on the world market, mills it, and sells flour to bakeries at a loss. When prices climb faster than wages, the lines grow longer and the mood in the streets turns.\n\n§HBread Pressure§!: §Y[?EGY_bread_pressure|0]§!/100\n§HSubsidy Level§!: §Y[EGY_bread_subsidy_level_name]§!\n§HDomestic Wheat Share§!: §Y[?EGY_domestic_wheat_share|0]%§!\n§HWheat Supply Deals§!: §Y[?EGY_wheat_supply_deals|0]§!/3\n\nBread Queues begin at §Y50§!, Bread Strikes at §Y70§!, and Bread Riots at §Y90§!. Security measures and the social contract raise each line by §Y[?EGY_bread_threshold_offset|0]§!.\n\nPressure rises by §R0.5§! each month as the population grows. Army bakeries, smart ration cards and the Baladi Bakeries lower it by §G0.25§! each, and every wheat supply deal lowers it by §G0.1§!.\n\nWorld price shocks hit in proportion to the share of wheat we import. Every supply deal cuts a shock by §G15%§!.\n\nWhile Cairo's Informal Share is §Y60%§! or more, pressure rises by another §R0.1§! a month."
