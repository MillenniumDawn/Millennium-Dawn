l_korean:
 STALKER.170.t: "두 번째 재앙"
 STALKER.170.d: "초르노빌 발전소 상공에서 섬광이 번쩍였고, 옛 출입 통제 구역 일대의 계측기들이 미쳐 날뛰고 있습니다. 아직 안에 남아 있던 과학자들은 이를 '프로젝트 X'라는 계획 중에 일어난 사고라고 부릅니다. 정부는 새 방어선을 긋고 있습니다. 이미 일부는 남쪽 늪지대로 걸어 들어갔습니다."
 STALKER.170.a: "길을 봉쇄한다."
 STALKER.171.t: "대방출"
 STALKER.171.d: "2006년 이후 기록된 어떤 방출보다 큰 방출이 구역을 휩쓸었습니다. 노지에 있던 스토커들은 모두 죽었습니다. 늪지대의 '클리어 스카이'라는 무리는 구역이 계속 북쪽으로 걸어 올라가는 누군가에게 응답하고 있다고 말합니다."
 STALKER.171.a: "늪은 스스로 대답할 것이다."
 STALKER.172.t: "발전소로 향하는 클리어 스카이"
 STALKER.172.d: "레베데프는 구역이 계속 날뛰는 이유가 스트렐록이라는 스토커라고 믿고 있으며, 그를 막으라고 스카를 북쪽으로 보냈습니다. 클리어 스카이는 발전소 공격을 위해 늪지대에 집결하고 있습니다. 코돈의 상인은 길목에서 항방사선제란 항방사선제는 전부 사들이고 있고, 바는 더는 앞으로 나갈 생각이 없는 사람들로 가득하며, 생태학자 벙커들은 문을 걸어 잠갔습니다."
 STALKER.172.a: "클리어 스카이를 지원해 스트렐록을 막는다."
 STALKER.172.a_tt: "클리어 스카이가 늪지대에 남습니다. 스트렐록은 2012년에 중심부에 도달하지 못합니다."
 STALKER.172.b: "공격을 내버려 둔다."
 STALKER.172.b_tt: "클리어 스카이의 영향력이 §R0§!으로 떨어집니다. 스카는 살아남습니다. 스트렐록은 자기 이름조차 기억하지 못한 채 2012년에 중심부에 도달합니다."
 STALKER.172.c: "스트렐록을 통과시킨다."
 STALKER.172.c_tt: "클리어 스카이의 영향력이 §R0§!으로 떨어집니다. 스카는 살아남습니다. 스트렐록은 그곳에 무엇이 있는지 이미 알고 있는 채로 2012년에 중심부에 도달합니다."
 STALKER.173.t: "공격 이후"
 STALKER.173.d_spared: "클리어 스카이는 스트렐록이 발전소에 닿기 전에 그를 돌려보냈습니다. 레베데프는 남은 인원을 늪지대에 붙잡아 두고 있으며, 스카도 여전히 그들과 함께 있습니다. 구역의 중심부는 조용해졌습니다."
 STALKER.173.d_marked: "발전소 공격 도중 방출이 덮쳤습니다. 클리어 스카이는 전멸했습니다. 스카는 홀로 걸어 나왔습니다. 스트렐록은 기억을 잃은 채 중심부에서 끌려 나왔고, 코돈에서는 그를 '낙인 찍힌 자'로 부르게 될 것입니다."
 STALKER.173.d_helped: "클리어 스카이는 발전소로 가는 길에서 죽었습니다. 스카는 홀로 걸어 나왔습니다. 스트렐록은 끝내 통과했고, 아직도 자기 이름을 기억하고 있습니다."
 STALKER.173.a: "구역은 제 비밀을 지킨다."
 STALKER.174.t: "페어웨이 작전"
 STALKER.174.d_open: "구역 북부가 열렸습니다. 군은 발전소에 거점을 확보하기 위해 헬기 다섯 대를 프리피야트로 보냈지만, 어느 쪽에서도 보고가 오지 않았습니다. 알렉산드르 데그탸레프 소령은 헬기가 추락한 현장에 있습니다. 생태학자 벙커는 다음 방출 전에 자기들 사람을 빼내 주기를 바랍니다."
 STALKER.174.d_closed: "브레인 스코처가 여전히 가동 중인데도 군은 프리피야트로 헬기를 보냈습니다. 헬기들은 구역 안에서 추락했습니다. 알렉산드르 데그탸레프 소령이 승무원들을 찾고 있습니다. 생태학자 벙커는 자기들 사람을 빼내 주기를 바라며, 발전소에 거점은 생기지 않을 것입니다."
 STALKER.174.d_massacre: "군은 모놀리스가 여전히 장악한 발전소로 헬기를 보냈습니다. 승무원들은 죽었고, 모놀리스는 이미 잔해 위로 움직이고 있습니다. 알렉산드르 데그탸레프 소령은 아직 살아 있는 이들을 데려 나올 허가를 요청했습니다."
 STALKER.174.a: "과학자들을 대피시킨다."
 STALKER.174.a_open_tt: "생태학자 영향력이 §G8§! 상승합니다. 군 영향력이 §G5§! 상승하고, 봉쇄도가 §G5§! 상승합니다."
 STALKER.174.a_closed_tt: "생태학자 영향력이 §G5§! 상승합니다. 헬기를 잃었습니다. 군 영향력이 §R5§! 하락합니다. 봉쇄도가 §G5§! 상승합니다."
 STALKER.174.b: "프리피야트의 거점을 사수한다."
 STALKER.174.b_tt: "군 영향력이 §G10§!, 생태학자 영향력이 §G5§!, 봉쇄도가 §G5§! 상승합니다. 군이 프리피야트에 거점을 유지합니다."
 STALKER.174.c: "작전을 묻어 버린다."
 STALKER.174.c_open_tt: "군 영향력이 §R5§! 하락합니다. 활동도가 §R5§! 상승합니다."
 STALKER.174.c_closed_tt: "군 영향력이 §R10§! 하락합니다. 활동도가 §R5§! 상승합니다."
 STALKER.174.e: "데려올 수 있는 이들만 수습한다."
 STALKER.174.e_tt: "군 영향력이 §R10§! 하락합니다. 모놀리스가 §R10§! 얻고, 활동도가 §R5§! 상승합니다."
 STALKER.175.t: "페어웨이 보고"
 STALKER.175.d_evacuate_open: "과학자들이 벙커에서 빠져나왔으며, 데그탸레프의 보고서에 따르면 헬기 승무원들은 프리피야트 북쪽의 변칙 지대에서 죽었습니다. 군은 여전히 현지에 남아 있습니다."
 STALKER.175.d_evacuate_closed: "데그탸레프가 과학자들을 데려 나왔습니다. 헬기들은 브레인 스코처 앞에서 손써 볼 틈도 없었고, 살아남은 승무원들은 남쪽으로 걸어가고 있습니다."
 STALKER.175.d_foothold: "코발스키 대령의 병력이 프리피야트의 한 구획을 지키고 있습니다. 데그탸레프의 보고서에 따르면 헬기는 변칙 지대에 추락했으며, 이 작전에 남은 것은 그 거점뿐입니다."
 STALKER.175.d_bury_open: "페어웨이 작전은 브리핑에서 지워졌습니다. 헬기는 기상 악화로 상실된 것으로 기록되었고, 데그탸레프의 보고서는 서랍 속에 잠겨 있습니다."
 STALKER.175.d_bury_closed: "페어웨이 작전은 브리핑에서 지워졌습니다. 헬기는 스코처에 당했고, 공식 발표로는 애초에 뜬 적조차 없습니다."
 STALKER.175.d_massacre: "발전소에서 돌아온 것은 무전 한 통뿐입니다. 잔해는 모놀리스가 차지했고, 데그탸레프에게는 수색을 중단하라는 명령이 내려졌습니다."
 STALKER.175.a: "보고서를 제출한다."
 STALKER.176.t: "구역 헌장"
 STALKER.176.d_scar: "국가는 달린 소장이 이끄는 구역 과학 연구소 SIRCAA와, 구역을 통제할 민간 연대를 원합니다. 이 연대인 '와드'는 코르슈노프 대령이 지휘하게 됩니다. 클리어 스카이에서 걸어 나온 스카에게는 이제 자기 사람들이 있습니다. 그들은 스스로를 '스파크'라 부르며, 와드를 순순히 받아들이지 않을 것입니다.\n\n[STALKER_field_yantar_history]"
 STALKER.176.d: "국가는 달린 소장이 이끄는 구역 과학 연구소 SIRCAA와, 구역을 통제할 민간 연대를 원합니다. 이 연대인 '와드'는 코르슈노프 대령이 지휘하게 됩니다.\n\n[STALKER_field_yantar_history]"
 STALKER.176.a: "SIRCAA를 설립하고 와드를 들인다."
 STALKER.176.a_scar_tt: "와드의 영향력이 최소 §Y15§!까지 상승합니다. 스파크의 영향력이 최소 §Y10§!까지 상승합니다."
 STALKER.176.a_tt: "와드의 영향력이 최소 §Y15§!까지 상승합니다."
 STALKER.176.b: "구역을 군의 관할로 둔다."
 STALKER.176.b_scar_tt: "군 영향력이 §G10§! 상승합니다. 스파크의 영향력이 최소 §Y10§!까지 상승합니다. 와드는 설립되지 않습니다."
 STALKER.176.b_tt: "군 영향력이 §G10§! 상승합니다. 와드는 설립되지 않습니다."
 STALKER.177.t: "SIRCAA"
 STALKER.177.d_charter_scar: "SIRCAA가 헌장을 얻었고, 코르슈노프 대령의 와드는 군이 홀로 순찰하던 도로를 넘겨받았습니다. 스카의 스파크는 구역이 그냥 내버려지기를 바라는 스토커들을 규합하는 것으로 응수했습니다."
 STALKER.177.d_charter: "SIRCAA가 헌장을 얻었고, 코르슈노프 대령의 와드는 군이 홀로 순찰하던 도로를 넘겨받았습니다."
 STALKER.177.d_army_scar: "정부는 SIRCAA의 연대 창설을 거부했습니다. 군이 방어선을 계속 지킬 것입니다. 스카의 스파크는 구역에 남아 있으며, 군에 합류하지는 않았습니다."
 STALKER.177.d_army: "정부는 구역을 군의 관할로 유지했습니다. SIRCAA에는 연대가 없습니다."
 STALKER.177.a: "구역에 새 집주인들이 생겼다."
 STALKER.161.t: "중심부에 닿은 스트렐록"
 STALKER.161.d: "코돈에서 스트렐록이라 불리는 스토커가 브레인 스코처를 돌파해 [STALKER_zone_name]의 중심부에 도달했습니다. 그는 C-의식을 끌 작정입니다. 모놀리스는 이미 그를 막으러 움직이고 있으며, 군은 둘 중 누구든 일을 끝내기 전에 길을 막고 싶어 합니다."
 STALKER.161.d_marked: "코돈에서 '낙인 찍힌 자'로 불리던 기억상실자가 스트렐록이라는 이름을 기억해 냈습니다. 그는 브레인 스코처를 돌파해 [STALKER_zone_name]의 중심부에 도달했습니다. 그는 C-의식을 끌 작정입니다. 모놀리스는 이미 그를 막으러 움직이고 있으며, 군은 둘 중 누구든 일을 끝내기 전에 길을 막고 싶어 합니다."
 STALKER.161.d_remembers: "스트렐록이 브레인 스코처를 돌파해 [STALKER_zone_name]의 중심부에 도달했습니다. 그는 그곳에 무엇이 있는지 이미 알고 있습니다. 그는 C-의식을 끌 작정입니다. 코돈의 상인은 클리어 스카이가 그를 안내하려다 전멸했다고 말합니다. 모놀리스는 그를 막으러 움직이고 있으며, 군은 길을 막고 싶어 합니다."
 STALKER.161.a: "C-의식을 끄도록 둔다."
 STALKER.161.a_tt: "모놀리스의 영향력이 최대 §G40§! 하락합니다. 활동도가 §R15§! 상승하고, 봉쇄도가 최대 §R10§! 하락하며, 스토커 인구가 §Y10§! 증가합니다. 스트렐록은 살아남으며, 계속 구역에 맞섭니다."
 STALKER.161.b: "브레인 스코처에서 그를 막는다."
 STALKER.161.b_tt: "정치력 §R50§!이 듭니다. 군 영향력과 봉쇄도가 각각 §G15§! 상승하고, 모놀리스가 §R5§! 얻습니다. 스트렐록은 돌아오지 않습니다."
 STALKER.161.c: "그를 C-의식에 맡긴다."
 STALKER.161.c_tt: "모놀리스의 영향력이 §R20§! 상승합니다. 활동도가 최대 §G10§! 하락하고 봉쇄도가 §G5§! 상승합니다. 스트렐록은 본래의 모습으로 돌아오지 못합니다."
 STALKER.162.t: "구역의 중심부"
 STALKER.162.d_turned_back: "스트렐록은 발전소에 이르지 못했습니다. 클리어 스카이가 1년 전 늪지대에서 그를 돌려보냈고, 중심부는 계속 닫혀 있습니다."
 STALKER.162.d_shutdown_marked: "낙인 찍힌 자는 구역 중심부에서 스트렐록이라는 이름을 기억해 냈고 C-의식을 껐습니다. 모놀리스의 외곽 초소들은 잠잠해졌습니다. 방출은 그렇지 않았습니다."
 STALKER.162.d_shutdown_remembers: "스트렐록은 C-의식이 있음을 알고서 중심부에 도달했고, 그것을 껐습니다. 모놀리스의 외곽 초소들은 잠잠해졌습니다. 방출은 그렇지 않았습니다."
 STALKER.162.d_shutdown: "스트렐록은 구역의 중심부에 도달해 C-의식을 껐습니다. 모놀리스의 외곽 초소들은 잠잠해졌습니다. 방출은 그렇지 않았습니다."
 STALKER.162.d_stopped: "군은 스트렐록이 발전소에 이르기 전에 돌려보냈습니다. 브레인 스코처는 여전히 가동 중이며, 모놀리스는 여전히 중심부를 장악하고 있습니다."
 STALKER.162.d_taken: "스트렐록은 중심부로 들어갔고 나오지 않았습니다. 모놀리스의 순찰대가 다시 남쪽으로 움직이고 있으며, 구역은 아무도 믿지 못할 정적에 잠겼습니다."
 STALKER.162.a: "구역은 여전히 그 자리에 있다."
 STALKER.200.a: "첫 임무를 승인한다."
 STALKER.200.a_tt: "정치력 25가 드는 60일간의 조사를 해금합니다."
 STALKER.200.b: "사건을 미해결로 남긴다."
 STALKER.200.b_tt: "이 캠페인을 보상 없이 종료합니다. 도적 영향력이 10 상승하며, 다음 캠페인을 시작할 수 있습니다."
 STALKER.200.t: "얀타르: 침묵의 조사"
 STALKER.200.d: "얀타르의 조사단이 생태학자들의 호출에 응답하지 않습니다. 마지막 계측값들은 서로 전혀 맞지 않았습니다. 안전한 길, 치명적인 방사선 수치, 그리고 쓰이지 않는 채널의 목소리들이었습니다. 과학자들은 다른 무리가 가져가기 전에 장비를 회수할 수 있도록 호위를 요청합니다."
 STALKER.201.a: "회수 임무를 준비한다."
 STALKER.201.a_tt: "정치력 50이 드는 60일간의 현장 개입을 해금합니다."
 STALKER.201.t: "조사 표지"
 STALKER.201.d: "호위대는 서로 다른 두 무리가 놓아둔 표지를 발견합니다. 하나는 실종된 야영지를 가리키고, 다른 하나는 더 안전한 능선을 따라갑니다. 살아남은 기술자는 노린 것이 실종자가 아니라 장비였다고 주장합니다."
 STALKER.202.a: "조사 결과를 생태학자들과 공유한다."
 STALKER.202.a_tt: "과학자 영향력이 10 상승하고 개발도가 5 상승합니다. 보존된 조사 결과가 2018년 SIRCAA 결정에 도움이 됩니다."
 STALKER.202.b: "경로를 통제하고 측정값을 봉인한다."
 STALKER.202.b_tt: "봉쇄도가 10 상승하고 개발도가 5 하락합니다. 조사 결과는 계속 기밀로 남습니다."
 STALKER.202.c: "프로젝트를 군의 감독 아래 둔다."
 STALKER.202.c_tt: "군 영향력이 10 상승하고 과학자 영향력이 5 하락합니다. 민간인의 접근이 제한됩니다."
 STALKER.202.t: "얀타르 기록"
 STALKER.202.d: "회수한 측정값은 이후 연구의 지침이 될 수 있지만, 경로를 공개하면 더 많은 스토커가 같은 변칙 지대로 끌려들 것입니다. 생태학자들, 방어선 사령부, 그리고 군 호위대가 저마다 기록의 보관을 요구합니다."
 STALKER_field_name_1: "얀타르: 침묵의 조사"
 STALKER.203.a: "첫 임무를 승인한다."
 STALKER.203.a_tt: "정치력 25가 드는 60일간의 조사를 해금합니다."
 STALKER.203.b: "사건을 미해결로 남긴다."
 STALKER.203.b_tt: "이 캠페인을 보상 없이 종료합니다. 도적 영향력이 10 상승하며, 다음 캠페인을 시작할 수 있습니다."
 STALKER.203.t: "군 창고: 분쟁의 도로"
 STALKER.203.d: "듀티는 보급 수송대 실종의 책임이 프리덤에 있다고 주장합니다. 프리덤은 검문소가 수송대를 도적 소굴로 이어지는 길로 돌렸다고 주장합니다. 양쪽 모두 안내인을 내놓으며, 다음 수송대가 군 창고를 떠나기 전에 이 도로의 관할권을 달라고 요구합니다."
 STALKER.204.a: "회수 임무를 준비한다."
 STALKER.204.a_tt: "정치력 50이 드는 60일간의 현장 개입을 해금합니다."
 STALKER.204.t: "검문소의 흔적"
 STALKER.204.d: "쓰고 버려진 탄피와 위조된 수송 서류가 양쪽 세력의 첫 진술을 뒤엎습니다. 보급품은 순찰대 교대 이후에 빼돌려졌습니다. 누군가 통행의 책임을 진다면, 다음 수송대를 지킬 시간은 아직 있습니다."
 STALKER.205.a: "공동 통행을 협상한다."
 STALKER.205.a_tt: "듀티와 프리덤의 영향력이 각각 5 상승하고, 활동도가 5 하락합니다. 통행이 확보되면 2022년 봉쇄도 손실이 5 줄어듭니다."
 STALKER.205.b: "도로의 책임을 듀티에 맡긴다."
 STALKER.205.b_tt: "듀티의 영향력이 10 상승하고, 프리덤과 도적의 영향력이 5 하락합니다. 통행이 확보되면 2022년 봉쇄도 손실이 5 줄어듭니다."
 STALKER.205.c: "프리덤의 호위를 승인한다."
 STALKER.205.c_tt: "프리덤의 영향력이 10 상승하고, 듀티와 도적의 영향력이 5 하락합니다. 통행이 확보되면 2022년 봉쇄도 손실이 5 줄어듭니다."
 STALKER.205.t: "도로 협정"
 STALKER.205.d: "수송대가 창고에 도착했습니다. 호위대는 한 세력의 관할 아래 도로를 떠날 수도 있고, 어느 쪽도 혼자서는 강제할 수 없는 통행 협정을 중재할 수도 있습니다. 보급품을 나른 스토커들은 검문소가 예고 없이 바뀌지 않게만 해 달라고 요청할 뿐입니다."
 STALKER_field_name_2: "군 창고: 분쟁의 도로"
 STALKER.206.a: "첫 임무를 승인한다."
 STALKER.206.a_tt: "정치력 25가 드는 60일간의 조사를 해금합니다."
 STALKER.206.b: "사건을 미해결로 남긴다."
 STALKER.206.b_tt: "이 캠페인을 보상 없이 종료합니다. 도적 영향력이 10 상승하며, 다음 캠페인을 시작할 수 있습니다."
 STALKER.206.t: "붉은 숲: 돌아온 순찰대"
 STALKER.206.d: "붉은 숲에서 실종 보고된 순찰대가 한 명이 줄어든 채, 같은 밤에 대한 두 가지 진술을 가지고 돌아왔습니다. 회수한 무전기에는 용병의 호출 부호가 남아 있습니다. 대원들은 자기 지휘부가 쓴 적 없는 주파수로 지휘부의 명령을 받았다고 기억합니다."
 STALKER.207.a: "회수 임무를 준비한다."
 STALKER.207.a_tt: "정치력 50이 드는 60일간의 현장 개입을 해금합니다."
 STALKER.207.t: "엉뚱한 채널의 목소리"
 STALKER.207.d: "첫 보고 청취에서 사이오닉 간섭 속에 섞인 녹음된 명령이 발견됩니다. 용병들은 순찰대의 경로가 아니라 계측기를 따라가고 있었습니다. 남은 증인이 다시 진술을 바꾸기 전에 두 번째 팀이 버려진 녹음기를 회수해야 합니다."
 STALKER.208.a: "증인을 보호하고 기록을 보존한다."
 STALKER.208.a_tt: "스토커 영향력이 10 상승하고 용병 영향력이 5 하락합니다. 이 기록으로 구역 통제자의 MDST 숙청 한 건이 정치력 50으로 할인됩니다."
 STALKER.208.b: "과학적 감독 아래 녹음기를 조사한다."
 STALKER.208.b_tt: "과학자 영향력이 10 상승하고 활동도가 5 상승합니다. 25% 전자공학 연구 보너스 한 번과 할인된 MDST 숙청 한 건을 얻습니다."
 STALKER.208.c: "자료를 파기하고 손실을 은폐한다."
 STALKER.208.c_tt: "봉쇄도가 10 상승하고 스토커 영향력이 5 하락합니다. 증인들의 증거는 MDST에 맞서는 데 쓸 수 없습니다."
 STALKER.208.t: "붉은 숲의 증거"
 STALKER.208.d: "녹음기는 무사합니다. 그 목소리들은 조사관이 오염된 채널을 알아보는 데 도움이 되겠지만, 살아 있는 증인들에게는 보호가 필요합니다. 방어선 사령부는 사건을 종결하자고 제안하고, 과학자들은 내용이 또 다른 기밀 문서고로 사라지기 전에 조사하게 해 달라고 요청합니다."
 STALKER_field_name_3: "붉은 숲: 돌아온 순찰대"
 STALKER_field_investigate: "현장 보고서를 조사한다"
 STALKER_field_investigate_desc: "이 임무에 정치력 25를 투입합니다. 60일이 걸리며, 통제권이 바뀌어도 원래의 구역을 따라갑니다. 보고서는 다음 월간 주기에 현재 통제자에게 전달됩니다."
 STALKER_field_recover: "회수 임무를 보낸다"
 STALKER_field_recover_desc: "이 임무에 정치력 50을 투입합니다. 60일이 걸리며, 통제권이 바뀌어도 원래의 구역을 따라갑니다. 보고서는 다음 월간 주기에 현재 통제자에게 전달됩니다."
 STALKER_field_supplies: "과학 보급품을 호송한다"
 STALKER_field_supplies_desc: "60일간의 과학 보급품 호송에 정치력 25를 씁니다. 완료 시 과학자 영향력과 봉쇄도가 각각 5 상승합니다. 다음 호송은 180일 뒤에 열립니다. 연구나 이후 캠페인의 보상은 주어지지 않습니다."
 STALKER_field_patrol: "분쟁 도로를 순찰한다"
 STALKER_field_patrol_desc: "60일간의 순찰에 정치력 25를 씁니다. 완료 시 도적 영향력과 활동도가 각각 5 하락합니다. 협정을 맺으면 듀티와 프리덤에 각각 5가 더해지고, 한쪽을 지지하면 그쪽에 5가 더해지고 상대에게서 5가 빠집니다. 다음 순찰은 180일 뒤에 열립니다. 연구나 이후 캠페인의 보상은 주어지지 않습니다."
 STALKER_field_campaign_category: "구역 현장 캠페인"
 STALKER_field_campaign_category_desc: "[STALKER_field_campaign_name]\n[STALKER_field_assignment_status]\n보고서와 완료된 결과는 원래의 구역에 귀속됩니다. 현장 임무는 한 번에 하나만 진행할 수 있습니다. 2022년 전투가 시작되면 완료되지 못한 사건 기록은 준비 혜택 없이 종료됩니다."
 STALKER_field_name_done: "현장 캠페인 기록부가 완료되었거나 구역의 개방 정책을 기다리고 있습니다."
 STALKER_field_step_0: "접수 브리핑을 기다리는 중입니다."
 STALKER_field_step_1: "첫 조사 가능: 정치력 25, 60일."
 STALKER_field_step_2: "첫 임무가 현장에서 진행 중입니다."
 STALKER_field_step_3: "첫 보고서가 결정을 기다리고 있습니다."
 STALKER_field_step_4: "회수 임무 가능: 정치력 50, 60일."
 STALKER_field_step_5: "회수 임무가 현장에서 진행 중입니다."
 STALKER_field_step_6: "캠페인의 마지막 결정이 보류 중입니다."
 STALKER_field_step_done: "남아 있는 캠페인 임무가 없습니다."
 STALKER_field_yantar_0: "보존된 얀타르 조사 기록이 없습니다."
 STALKER_field_yantar_1: "얀타르 조사 결과가 생태학자들과 공유되었습니다."
 STALKER_field_yantar_2: "얀타르의 경로와 조사 결과는 계속 기밀로 남아 있습니다."
 STALKER_field_yantar_3: "얀타르 프로젝트가 군의 감독 아래 놓였습니다."
 STALKER_field_yantar_4: "얀타르 조사는 미해결로 남았습니다."
