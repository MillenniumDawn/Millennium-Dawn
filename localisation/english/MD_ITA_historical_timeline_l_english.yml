l_english:

 ITA_pd_merger_tt: "The §YMargherita§! merges into the §YDemocratic Party§!"
 ITA_pdl_merger_tt: "§YAlleanza Nazionale§! merges into the §YPeople of Freedom§!"
 ITA_fdi_split_tt: "The §YBrothers of Italy§! break away from the center-right"
 ITA_iv_split_tt: "The reformists leave the §YDemocratic Party§! to form §YItalia Viva§!"
 ITA_azione_split_tt: "The liberals leave the §YDemocratic Party§! to form §YAzione§!"
 ITA_swing_right_tt: "Voters swing toward the §Ycenter-right§! parties"
 ITA_swing_left_tt: "Voters swing toward the §Ycenter-left§! parties"
 ITA_swing_m5s_tt: "Voters swing toward the §YFive Star Movement§!"
 ITA_swing_m5s_lega_tt: "Voters swing toward the §YFive Star Movement§! and the §YLega§!"
 ITA_swing_establishment_tt: "Voters return to the established parties"

 italy_md.72.t: "The Democratic Party Is Founded"
 italy_md.72.d: "After years of talks, the Democrats of the Left and the Margherita agree to merge into one party. Walter Veltroni wins its first leadership vote in open primaries on 14 October."
 italy_md.72.o1: "Merge the Margherita into the party"
 italy_md.72.o2: "Keep the two parties apart"

 italy_md.73.t: "The People of Freedom Is Founded"
 italy_md.73.d: "Silvio Berlusconi announces that Forza Italia and Gianfranco Fini's Alleanza Nazionale will merge into one center-right party. The heirs of the Italian Social Movement now share a banner with the Forza Italia moderates."
 italy_md.73.o1: "Merge Alleanza Nazionale into the party"
 italy_md.73.o2: "Keep Alleanza Nazionale independent"

 italy_md.74.t: "The Brothers of Italy Break Away"
 italy_md.74.d: "Giorgia Meloni, Ignazio La Russa and Guido Crosetto leave the People of Freedom to found Fratelli d'Italia. The new party claims the heritage of Alleanza Nazionale."
 italy_md.74.o1: "Let the Brothers of Italy go their own way"
 italy_md.74.o2: "Hold the right together"

 italy_md.75.t: "Renzi Leaves the Democratic Party"
 italy_md.75.d: "Matteo Renzi quits the Democratic Party and launches Italia Viva with a group of loyal parliamentarians. The new party stays in the government but courts the same moderate voters."
 italy_md.75.o1: "Let Italia Viva go its own way"
 italy_md.75.o2: "Reconcile with the reformists"

 italy_md.76.t: "Calenda Founds Azione"
 italy_md.76.d: "Carlo Calenda leaves the Democratic Party over its alliance with the Five Star Movement and launches Azione. The new party targets liberal, pro-business voters."
 italy_md.76.o1: "Let Azione go its own way"
 italy_md.76.o2: "Keep the liberals inside the party"

 italy_md.77.t: "Berlusconi Leads the Polls"
 italy_md.77.d: "Silvio Berlusconi's House of Freedoms has pulled ahead of the Olive Tree coalition as the election nears. His television networks dominate the campaign, and the government must decide how to respond."
 italy_md.77.o1: "Back the House of Freedoms"
 italy_md.77.o2: "Back the Olive Tree"
 italy_md.77.o3: "Stay out of the campaign"

 italy_md.78.t: "The Union Leads the Polls"
 italy_md.78.d: "Romano Prodi has built a broad center-left alliance and leads Berlusconi's House of Freedoms as the election nears. The campaign is bitter, and the result may turn on a few thousand votes."
 italy_md.78.o1: "Back the Union"
 italy_md.78.o2: "Back the House of Freedoms"
 italy_md.78.o3: "Stay out of the campaign"

 italy_md.79.t: "The Prodi Government Falls"
 italy_md.79.d: "Justice Minister Clemente Mastella has withdrawn his party's support, and the Senate has denied Romano Prodi a confidence vote. Italy must choose between a snap election and a caretaker government."
 italy_md.79.o1: "Dissolve parliament and call elections"
 italy_md.79.o2: "Seek a caretaker government"

 italy_md.80.t: "The Protest Vote Surges"
 italy_md.80.d: "Years of austerity have worn down the established parties. Beppe Grillo's Five Star Movement fills the squares, and a hung parliament looks likely."
 italy_md.80.o1: "Let the protest vote run"
 italy_md.80.o2: "Rally behind the established parties"

 italy_md.81.t: "A Grand Coalition Takes Shape"
 italy_md.81.d: "The election has left no bloc with a majority, and weeks of talks have failed. President Napolitano presses the Democratic Party and the center-right to govern together under Enrico Letta."
 italy_md.81.o1: "Form the grand coalition"
 italy_md.81.o2: "Hold out for another majority"

 italy_md.82.t: "The Populists Dominate the Polls"
 italy_md.82.d: "The Five Star Movement and Matteo Salvini's Lega lead the polls as the election nears. Migration, unemployment and distrust of the old parties drive the vote."
 italy_md.82.o1: "Let the populist surge run"
 italy_md.82.o2: "Rally behind the established parties"

 italy_md.83.t: "Conte Forms a Government"
 italy_md.83.d: "After weeks of talks, the Five Star Movement and the Lega have agreed on a program and on Giuseppe Conte, a law professor, as prime minister. The president must decide whether to accept the deal."
 italy_md.83.o1: "Form the Five Star and Lega government"
 italy_md.83.o2: "Appoint a technocratic government"

 italy_md.84.t: "The Government Switches Partners"
 italy_md.84.d: "Matteo Salvini has pulled the Lega out of the government and demanded elections. Instead, the Five Star Movement and the Democratic Party have agreed to keep Giuseppe Conte in office."
 italy_md.84.o1: "Form the Five Star and Democratic Party government"
 italy_md.84.o2: "Call early elections"

 italy_md.85.t: "The Government Loses Its Majority"
 italy_md.85.d: "Matteo Renzi has pulled Italia Viva out of the coalition, and the prime minister has resigned. With the pandemic raging and recovery funds waiting, the president looks for a government that can last."
 italy_md.85.o1: "Call in a technocratic government"
 italy_md.85.o2: "Call early elections"

 italy_md.86.t: "The Draghi Government Collapses"
 italy_md.86.d: "The Five Star Movement, the Lega and Forza Italia have refused to back Mario Draghi in a confidence vote. The unity government has lost its majority."
 italy_md.86.o1: "Dissolve parliament and call elections"
 italy_md.86.o2: "Ask parliament to reconsider"

 italy_md.87.t: "Meloni Forms a Government"
 italy_md.87.d: "The Brothers of Italy have won the largest share of the vote, ahead of the Democratic Party and the Five Star Movement. Giorgia Meloni is asked to lead a coalition with Forza Italia and the Lega."
 italy_md.87.o1: "Form the right-wing coalition"
 italy_md.87.o2: "Accept the result as it stands"

 italy_md.88.t: "The Bond Spread Explodes"
 italy_md.88.d: "The gap between Italian and German ten-year bonds has widened sharply, and the European Central Bank wants austerity and reform in exchange for its support. Markets doubt that the government can deliver."
 italy_md.88.o1: "Adopt an emergency austerity package"
 italy_md.88.o2: "Wait for Brussels to act"

 italy_md.89.t: "Berlusconi Loses His Majority"
 italy_md.89.d: "With the spread above 500 points, Silvio Berlusconi no longer commands a majority in the Chamber. President Napolitano consults the parties on a way out."
 italy_md.89.o1: "Appoint a technocratic government"
 italy_md.89.o2: "Call early elections"
 italy_md.89.o3: "Hold on and wait"

 italy_md.90.t: "The Fornero Pension Reform"
 italy_md.90.d: "Labor minister Elsa Fornero has drafted a reform that raises the retirement age and ends seniority pensions to reassure the markets. The unions are furious."
 italy_md.90.o1: "Raise the retirement age"
 italy_md.90.o2: "Shelve the reform"

 italy_md.91.t: "Italy Locks Down"
 italy_md.91.d: "A coronavirus outbreak in Lombardy has filled the hospitals of Bergamo. The government must decide how far to close the country."
 italy_md.91.o1: "Impose a national lockdown"
 italy_md.91.o2: "Limit restrictions to the red zones"

 italy_md.92.t: "The National Recovery Plan Is Approved"
 italy_md.92.d: "The European Commission has approved Italy's national recovery and resilience plan, the largest share of the NextGenerationEU fund. The money comes with reform milestones that must be met."
 italy_md.92.o1: "Take the grants and the loans"
 italy_md.92.o2: "Take the grants only"

 italy_md.93.t: "Shipwreck off Lampedusa"
 italy_md.93.d: "A boat carrying hundreds of Eritrean and Somali migrants has capsized off Lampedusa. The coffins fill a hangar on the island, and Italy asks how many more will drown."
 italy_md.93.o1: "Launch Operation Mare Nostrum"
 italy_md.93.o2: "Tighten border enforcement"

 italy_md.94.t: "Provenzano Is Arrested"
 italy_md.94.d: "After more than 40 years on the run, Bernardo Provenzano, the boss of the Corleonesi, has been found in a farmhouse near Corleone. Cosa Nostra loses its head."
 italy_md.94.o1: "Parade the arrest"
 italy_md.94.o2: "Use the arrest to dismantle the network"

 italy_md.95.t: "Messina Denaro Is Arrested"
 italy_md.95.d: "Matteo Messina Denaro, the last of the great fugitive bosses, has been arrested at a clinic in Palermo after thirty years in hiding."
 italy_md.95.o1: "Celebrate the arrest"
 italy_md.95.o2: "Press the investigation"

 italy_md.96.t: "Berlusconi Forms His Second Government"
 italy_md.96.d: "The House of Freedoms has won the election. Silvio Berlusconi is asked to lead a coalition with Alleanza Nazionale and the Lega Nord."
 italy_md.96.o1: "Form the center-right coalition"
 italy_md.96.o2: "Keep the government that emerged from the election"

 italy_md.97.t: "Prodi Forms His Second Government"
 italy_md.97.d: "The Union has narrowly won the election. Romano Prodi is asked to lead a coalition of the center-left parties and the Communist Refoundation."
 italy_md.97.o1: "Form the Union government"
 italy_md.97.o2: "Keep the government that emerged from the election"
