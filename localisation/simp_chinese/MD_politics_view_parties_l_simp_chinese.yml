 ALT.anarchist_communism: "£SOV_left_wing_radical (RPZh) - 俄罗斯生命党"
 ALT.anarchist_communism_icon: "£SOV_left_wing_radical"
 ALT.anarchist_communism_desc: "（社会保守主义）- 俄罗斯生命党\n\n俄罗斯生命党由联邦委员会主席谢尔盖·米罗诺夫于2002年6月29日创立，是一个亲克里姆林宫的中间偏左政党，自称在经济上奉行自由主义，在其他所有方面都持民族主义立场。该党主张提高生活水平、推行家庭政策和保护环境，是继统一俄罗斯党之后支持总统的第二大阵营。\n\n阿尔泰共和国是少数几个对该党产生影响的地区之一：在2006年3月12日举行的“自由俄罗斯”选举中，该党候选人名单获得了8.83%的选票，成功进入议会，远高于其全国平均水平。2006年10月28日，该党与“祖国党”和“退休人员党”合并，组建了“公正俄罗斯”党，并带走了其在阿尔泰的议员。"
 ALT.anarchist_communism_1: "£SOV_left_wing_radical_1 (SR) - 公正俄罗斯党"
 ALT.anarchist_communism_1_icon: "£SOV_left_wing_radical_1"
 ALT.anarchist_communism_1_desc: "（左翼民粹主义）- 公正俄罗斯党\n\n“公正俄罗斯”党于2006年10月28日由谢尔盖·米罗诺夫领导的俄罗斯生命党、祖国党和退休人员党合并而成，是克里姆林宫认可的、与共产党抗衡的社会主义政党。该党主张建立强大的福利国家、实行累进税制和国家控制自然资源，同时在外交政策上支持总统。自2021年与“为了真理”和“俄罗斯爱国者”合并后，该党更名为“公正俄罗斯 - 为了真理”。\n\n在阿尔泰共和国，该党开局强劲，2010年凭借原生命党联盟的支持，获得了16.52%的选票和四个名单席位，随后在2014年跌至7.8%，2019年跌至5.31%并仅获得一个席位，2024年跌至5.70%并仅获得一个席位。该党的优势在于能够确保获得选票席位，并且拥有少数几名在所有重要问题上都与政府保持一致的议员。"
