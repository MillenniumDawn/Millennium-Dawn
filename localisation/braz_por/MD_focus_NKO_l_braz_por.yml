 NKO_naval_focus_submarine_track_tt:0 "§HDoutrina Naval Songun   Impulso Submarino§!\n• Pontos de Expansão Naval: §G+3§!\n• Progresso da §YForça Submarina§!: §G+15§! (rumo ao próximo nível)\n• Adiciona a ideia §HImpulso de Treinamento da Força Submarina§! por §Y90§! dias\n   §L+5% de organização naval, +5% de alcance máximo naval, +10% de ganho de XP naval§!\n• O Birô de Submarinos desbloqueia traços de MIO: §YProdução de Submarinos§! e §YMateriais de Revestimento§!\n• O nível muda quando o progresso atinge §Y25§!/§Y50§!/§Y75§!/§Y100§! no próximo clique em §HInvestir na Força Submarina§!\n• Dispara o evento único de ambientação §HCascos Submarinos Nacionais Tomam Forma§!"
 NKO_naval_focus_strategy_tt:0 "§HDoutrina Naval Songun   Impulso Estratégico§!\n• Pontos de Expansão Naval: §G+5§!\n• Progresso de §Ytodas as quatro trilhas§!: §G+5§! (Submarinos, Lanchas de Mísseis, Defesa Costeira, FE Naval)\n• Adiciona a ideia §HImpulso da Estratégia Naval§! por §Y180§! dias\n   §L-10% de custo de doutrina naval, +15% de ganho de XP naval, +5% de organização naval§!\n• O Birô de Submarinos desbloqueia o traço de MIO: §YDepartamento de Motores de Apoio§!\n• O Birô de Contratorpedeiros desbloqueia o traço de MIO: §YBlindagem Pesada Moderna§!\n• As mudanças de nível ocorrem no próximo clique em §HInvestir§! de cada trilha, assim que §Y25§!/§Y50§!/§Y75§!/§Y100§! for alcançado\n• Dispara o evento único de ambientação §HUma Doutrina Estratégica para o Mar§!"
 NKO_naval_focus_destroyer_buildup_tt:0 "§HDoutrina Naval Songun   Expansão de Contratorpedeiros§!\n• Pontos de Expansão Naval: §G+3§!\n• Progresso das §YFlotilhas de Lanchas de Mísseis§!: §G+15§! (rumo ao próximo nível)\n• Progresso da §YRede de Defesa Costeira§!: §G+5§!\n• Adiciona a ideia §HImpulso do Enxame de Lanchas de Mísseis§! por §Y90§! dias\n   §L+5% de velocidade naval, +10% de ataque de ataque naval, +10% de ganho de XP naval§!\n• O Birô de Contratorpedeiros desbloqueia traços de MIO: §YProdução de Navios Pesados§! e §YInvestimento em Sobrevivência§!\n• As mudanças de nível ocorrem no próximo clique em §HInvestir§! de cada trilha, assim que §Y25§!/§Y50§!/§Y75§!/§Y100§! for alcançado\n• Dispara o evento único de ambientação §HPrimeiros Contratorpedeiros Nacionais§!"
 NKO_naval_focus_destroyer_unleashed_tt:0 "§HDoutrina Naval Songun   Contratorpedeiro Desencadeado§!\n• Pontos de Expansão Naval: §G+5§!\n• Progresso das §YFlotilhas de Lanchas de Mísseis§!: §G+20§! (rumo ao próximo nível)\n• Progresso da §YRede de Defesa Costeira§!: §G+10§!\n• Adiciona a ideia §HImpulso do Enxame de Lanchas de Mísseis§! por §Y180§! dias\n   §L+5% de velocidade naval, +10% de ataque de ataque naval, +10% de ganho de XP naval§!\n• O Birô de Contratorpedeiros desbloqueia traços de MIO: §YApoio ao Combate Terrestre§! e §YBaterias Antiaéreas§!\n• As mudanças de nível ocorrem no próximo clique em §HInvestir§! de cada trilha, assim que §Y25§!/§Y50§!/§Y75§!/§Y100§! for alcançado\n• Dispara o evento único de ambientação §HEsquadrões de Contratorpedeiros Desencadeados§!"
 NKO_naval_focus_missile_boat_track_tt:0 "Se a §HDoutrina Naval Songun§! estiver desbloqueada: §G+3§! Pontos de Expansão Naval e §G+10§! de progresso das Flotilhas de Lanchas de Mísseis, com qualquer mudança de nível disparando seus eventos de ambientação."
 NKO_naval_focus_coastal_defense_track_tt:0 "Se a §HDoutrina Naval Songun§! estiver desbloqueada: §G+3§! Pontos de Expansão Naval e §G+10§! de progresso da Rede de Defesa Costeira, com qualquer mudança de nível disparando seus eventos de ambientação."
 NKO_naval_focus_specops_track_tt:0 "Se a §HDoutrina Naval Songun§! estiver desbloqueada: §G+3§! Pontos de Expansão Naval e §G+10§! de progresso das Operações Especiais Navais, com qualquer mudança de nível disparando seus eventos de ambientação."
 NKO_naval_capstone_news_tt:0 "Transmite um §Hgrande evento de notícias§!: §Y'O Cinturão Marítimo de Pyongyang Está Forjado'§!   celebrado em casa, notado no exterior."
 NKO_naval_allocate_party_funds:0 "Alocar Fundos do Partido"
 NKO_naval_allocate_party_funds_desc:0 "Redirecionar discretamente os subsídios do Partido para o programa naval. Um fluxo confiável de recursos, ao custo de capital político."
 NKO_naval_mobilize_nampo_shipyards:0 "Mobilizar os Estaleiros de Nampo"
 NKO_naval_mobilize_nampo_shipyards_desc:0 "Dedicar uma fábrica civil em Nampo a três meses de fabricação em horas extras. Os estaleiros nos recompensam com uma rajada extra de pontos de expansão quando o trabalho termina."
 NKO_naval_juche_drive:0 "Lançar uma Campanha Naval Juche"
 NKO_naval_juche_drive_desc:0 "Uma mobilização nacional pela frota. Os estaleiros operam a todo vapor por meio ano enquanto a economia civil absorve o custo, e o programa ganha uma enxurrada de pontos de uma vez. Requer uma frente interna estável para ser sustentada."
 NKO_naval_invest_submarine:0 "Investir na Força Submarina"
 NKO_naval_invest_submarine_desc:0 "Gaste um Ponto de Expansão Naval para impulsionar a trilha submarina. As tripulações ganham nova experiência naval à medida que os projetos amadurecem. Alcançar §Y25§!, §Y50§!, §Y75§! e §Y100§! de progresso desbloqueia o próximo nível de modernização submarina."
 NKO_naval_invest_missile_boat:0 "Investir nas Flotilhas de Lanchas de Mísseis"
 NKO_naval_invest_missile_boat_desc:0 "Gaste um Ponto de Expansão Naval para expandir o programa de lanchas de mísseis. Cada ciclo de reformas aprimora nosso ataque litorâneo. Alcançar §Y25§!, §Y50§!, §Y75§! e §Y100§! de progresso desbloqueia o próximo nível de lanchas de mísseis."
 NKO_naval_invest_coastal_defense:0 "Investir na Rede de Defesa Costeira"
 NKO_naval_invest_coastal_defense_desc:0 "Gaste um Ponto de Expansão Naval para reforçar o litoral. As equipes de bunkers e as baterias costeiras ganham experiência. Alcançar §Y25§!, §Y50§!, §Y75§! e §Y100§! de progresso desbloqueia o próximo nível de defesa costeira."
 NKO_naval_invest_specops:0 "Investir nas Operações Especiais Navais"
 NKO_naval_invest_specops_desc:0 "Gaste um Ponto de Expansão Naval para treinar homens-rã do Birô de Reconhecimento e infantaria naval. As forças especiais aprimoram suas habilidades anfíbias. Alcançar §Y25§!, §Y50§!, §Y75§! e §Y100§! de progresso desbloqueia o próximo nível de operações especiais navais."
 NKO_naval_capstone_complete:0 "Forjar o Cinturão Marítimo"
 NKO_naval_capstone_complete_desc:0 "Todas as quatro trilhas alcançaram seu nível final. Declare completa a Doutrina Naval Songun e conceda ao país seu bônus permanente."
 NKO_songun_navy_capstone:0 "Doutrina Naval Songun"
 NKO_songun_navy_capstone_desc:0 "Anos de expansão focada forjaram uma marinha assimétrica coerente. Submarinos de longo alcance, lanchas de mísseis em enxame, defesas costeiras em camadas e forças especiais navais de elite agora operam como uma só doutrina."
 NKO_sub_drill_momentum:0 "Impulso de Treinamento da Força Submarina"
 NKO_sub_drill_momentum_desc:0 "Treinamentos recentes elevaram o moral e a disciplina processual em todo o serviço silencioso."
 NKO_mb_swarm_momentum:0 "Impulso do Enxame de Lanchas de Mísseis"
 NKO_mb_swarm_momentum_desc:0 "As flotilhas surfam numa onda de confiança após seus últimos exercícios."
 NKO_cd_bunker_momentum:0 "Alerta Máximo do Cinturão de Bunkers"
 NKO_cd_bunker_momentum_desc:0 "As guarnições costeiras estão em prontidão elevada; os engenheiros aceleram o trabalho de fortificação em ritmo dobrado."
 NKO_so_recon_momentum:0 "Ritmo Operacional do Birô de Reconhecimento"
 NKO_so_recon_momentum_desc:0 "O Birô de Reconhecimento opera a todo vapor, com equipes de homens-rã e quadros de FE navais em rotação constante."
 NKO_naval_strategy_momentum:0 "Impulso da Estratégia Naval"
 NKO_naval_strategy_momentum_desc:0 "Uma doutrina estratégica unificada galvanizou todos os birôs navais. Pesquisa, treinamento e organização da frota se beneficiam do renovado senso de propósito."
 NKO_sub_tier_1:0 "Modernização Sang-O"
 NKO_sub_tier_1_desc:0 "Reformas e treinamento de tripulações em toda a frota de submarinos costeiros Sang-O."
 NKO_sub_tier_2:0 "Programa Yono Midget"
 NKO_sub_tier_2_desc:0 "Infiltradores da classe Yono e contramedidas de sonar aprimoradas ampliam nosso alcance."
 NKO_sub_tier_3:0 "Revisão da Classe Romeo"
 NKO_sub_tier_3_desc:0 "Os cascos Romeo recebem nova eletrônica, baterias e propulsão mais silenciosa."
 NKO_sub_tier_4:0 "Programa Sinpo SLBM"
 NKO_sub_tier_4_desc:0 "O submarino da classe Sinpo emprega a família Pukguksong. Alcance estratégico, dissuasão real."
 NKO_mb_tier_1:0 "Reformas Komar"
 NKO_mb_tier_1_desc:0 "Os antigos cascos Komar recebem novos lançadores e motores mais potentes."
 NKO_mb_tier_2:0 "Produção Soju e Nongo"
 NKO_mb_tier_2_desc:0 "As lanchas de mísseis nacionais Soju e Nongo entram em serviço em número crescente."
 NKO_mb_tier_3:0 "Integração do ASCM Kumsong-3"
 NKO_mb_tier_3_desc:0 "Os mísseis de cruzeiro antinavio Kumsong-3 dão às nossas flotilhas um golpe crível de longo alcance."
 NKO_mb_tier_4:0 "Doutrina Wolfpack"
 NKO_mb_tier_4_desc:0 "Táticas coordenadas de enxame: lançamentos em salvas, ECM em camadas e lanchas-isca."
 NKO_cd_tier_1:0 "Cinturão de Bunkers"
 NKO_cd_tier_1_desc:0 "Uma cadeia contínua de bunkers reforçados ao longo das costas leste e oeste."
 NKO_cd_tier_2:0 "Artilharia Costeira Móvel"
 NKO_cd_tier_2_desc:0 "Baterias montadas em caminhões alternam entre posições preparadas para derrotar o fogo de contrabateria."
 NKO_cd_tier_3:0 "Promontórios Fortificados"
 NKO_cd_tier_3_desc:0 "Promontórios estratégicos recebem túneis profundos, paióis reforçados e radares integrados."
 NKO_cd_tier_4:0 "Mísseis Antinavio Baseados em Terra"
 NKO_cd_tier_4_desc:0 "Lançadores móveis Kumsong negam às frotas adversárias o direito de se aproximar de nossa costa."
 NKO_so_tier_1:0 "Homens-Rã do Birô de Reconhecimento"
 NKO_so_tier_1_desc:0 "As equipes de homens-rã do Birô Geral de Reconhecimento ampliam seu treinamento e seu estoque de equipamentos."
 NKO_so_tier_2:0 "Brigada de Atiradores Marítimos"
 NKO_so_tier_2_desc:0 "Uma brigada dedicada de atiradores marítimos especializa-se em ataques costeiros rápidos."
 NKO_so_tier_3:0 "Infantaria Leve Marítima"
 NKO_so_tier_3_desc:0 "Batalhões de infantaria leve são reorganizados com um elemento marítimo para operações anfíbias."
 NKO_so_tier_4:0 "Corpo de Tempestade Naval"
 NKO_so_tier_4_desc:0 "Elementos do Corpo de Tempestade recebem anexos navais permanentes. Nossa ponta de lança alcança qualquer litoral."
 nko_naval_buildup.1.t:0 "Uma Doutrina Naval para a Nova Era"
 nko_naval_buildup.1.d:0 "O Estado-Maior preparou um plano de longo alcance: quatro trilhas paralelas, avançadas por meio de Pontos de Fortalecimento Naval acumulados. Três decisões geram pontos; quatro decisões de investimento os gastam. Alcance o nível final de cada trilha para forjar a Doutrina Naval Songun."
 nko_naval_buildup.1.a:0 "Nós lideraremos o programa."
 nko_naval_buildup.11.t:0 "As Tripulações do Sang-O se Destacam"
 nko_naval_buildup.11.d:0 "Os estaleiros de reparo zeram o acúmulo de cascos Sang-O. As tripulações treinam dia e noite e a confiança no serviço silencioso cresce."
 nko_naval_buildup.11.a:0 "Adiante."
 nko_naval_buildup.12.t:0 "Os Mini-Submarinos Yono Furam as Redes"
 nko_naval_buildup.12.d:0 "Infiltradores da classe Yono realizam exercícios bem-sucedidos contra nossos próprios radares costeiros, escapando de linhas de detecção que deveriam tê-los pego."
 nko_naval_buildup.12.a:0 "Uma vantagem real."
 nko_naval_buildup.13.t:0 "As Modernizações dos Romeo Dão Frutos"
 nko_naval_buildup.13.d:0 "Os barcos Romeo modernizados agora patrulham mais longe e com mais silêncio do que seus projetistas originais julgavam possível."
 nko_naval_buildup.13.a:0 "Excelente."
 nko_naval_buildup.14.t:0 "O Sinpo Emerge"
 nko_naval_buildup.14.d:0 "O submarino da classe Sinpo emerge dentro do prazo, com os tubos Pukguksong instalados e testados. A dissuasão estratégica já não é um sonho."
 nko_naval_buildup.14.a:0 "Glória ao programa."
 nko_naval_buildup.21.t:0 "Modernização dos Komar Concluída"
 nko_naval_buildup.21.d:0 "Cascos Komar envelhecidos deixam os estaleiros com novos lançadores, motores reforçados e tripulações surpreendentemente agressivas."
 nko_naval_buildup.21.a:0 "Um bom começo."
 nko_naval_buildup.22.t:0 "Formam-se as Flotilhas Soju e Nongo"
 nko_naval_buildup.22.d:0 "As primeiras flotilhas dedicadas Soju e Nongo entram em formação. Mais rápidas, mais enxutas e muito mais perigosas que as anteriores."
 nko_naval_buildup.22.a:0 "Prossigam."
 nko_naval_buildup.23.t:0 "O Kumsong-3 Vai ao Mar"
 nko_naval_buildup.23.d:0 "Os mísseis antinavio Kumsong-3 concluem seus testes finais a bordo. Nossas flotilhas agora podem atacar a distâncias que nossos inimigos dificilmente conseguem contrariar."
 nko_naval_buildup.23.a:0 "Alcance ampliado."
 nko_naval_buildup.24.t:0 "Doutrina Wolfpack Adotada"
 nko_naval_buildup.24.d:0 "Lançamentos em salva, interferência em camadas e barcos-isca: a doutrina wolfpack é formalmente adotada em toda a frota de barcos lança-mísseis."
 nko_naval_buildup.24.a:0 "A matilha está pronta."
 nko_naval_buildup.31.t:0 "Cinturão de Bunkers Concluído"
 nko_naval_buildup.31.d:0 "Uma cadeia contínua de bunkers reforçados agora se estende pelas duas costas. Comandantes locais relatam que o moral das guarnições melhorou visivelmente."
 nko_naval_buildup.31.a:0 "Mantenham a linha."
 nko_naval_buildup.32.t:0 "Artilharia Costeira Móvel Posicionada"
 nko_naval_buildup.32.d:0 "Baterias montadas em caminhões praticam exercícios de atirar e sair até conseguirem abandonar a posição de tiro antes que os projéteis de contrabateria cheguem."
 nko_naval_buildup.32.a:0 "Trabalho disciplinado."
 nko_naval_buildup.33.t:0 "Promontórios Fortificados"
 nko_naval_buildup.33.d:0 "Os promontórios mais estratégicos recebem túneis profundos, paióis reforçados e radares integrados. Os planejadores adversários agora enfrentam, de fato, uma costa defendida."
 nko_naval_buildup.33.a:0 "Costa de ferro."
 nko_naval_buildup.34.t:0 "Mísseis Antinavio Costeiros em Operação"
 nko_naval_buildup.34.d:0 "As baterias móveis Kumsong tomam posições litorâneas. Qualquer aproximação de nossas costas custará caro."
 nko_naval_buildup.34.a:0 "Que venham."
 nko_naval_buildup.41.t:0 "Corpo de Homens-Rã Ampliado"
 nko_naval_buildup.41.d:0 "O Birô Geral de Reconhecimento dobra discretamente o recrutamento de homens-rã e padroniza seu equipamento de mergulho."
 nko_naval_buildup.41.a:0 "Formem o quadro."
 nko_naval_buildup.42.t:0 "Brigada de Franco-Atiradores Navais Ativada"
 nko_naval_buildup.42.d:0 "Uma brigada dedicada de franco-atiradores navais é formalmente ativada. Seus primeiros exercícios contra alvos costeiros simulados superam as expectativas."
 nko_naval_buildup.42.a:0 "Afiados."
 nko_naval_buildup.43.t:0 "Infantaria Leve se Torna Marítima"
 nko_naval_buildup.43.d:0 "Batalhões selecionados de infantaria leve são reorganizados com um componente marítimo. A doutrina anfíbia vai além de um punhado de unidades especializadas."
 nko_naval_buildup.43.a:0 "Por qualquer costa."
 nko_naval_buildup.44.t:0 "O Corpo de Assalto Toma o Mar"
 nko_naval_buildup.44.d:0 "Elementos do Corpo de Assalto recebem anexos navais permanentes. Nossa ponta de lança agora é uma verdadeira força mar-terra."
 nko_naval_buildup.44.a:0 "Ataquem em qualquer lugar."
 nko_naval_buildup.51.t:0 "Exercício Naval em Wonsan"
 nko_naval_buildup.51.d:0 "A flotilha de submarinos de Wonsan tem seu exercício trimestral agendado. As tripulações aguardam ordens antes de zarpar."
 nko_naval_buildup.51.a:0 "Apertar forte, fazê-los suar"
 nko_naval_buildup.51.b:0 "Um ritmo moderado e rotineiro basta"
 nko_naval_buildup.51.c:0 "Cancelar, faltam combustível e peças"
 nko_naval_buildup.52.t:0 "Embarcação Estrangeira de Reconhecimento Avistada"
 nko_naval_buildup.52.d:0 "O radar costeiro identifica uma embarcação sem identificação rondando dentro de nossas águas reivindicadas. O comandante da costa quer uma decisão."
 nko_naval_buildup.52.a:0 "Interceptar e fazê-la recuar"
 nko_naval_buildup.52.b:0 "Segui-la, mas não atacar"
 nko_naval_buildup.52.c:0 "Recuar, evitar um incidente"
 nko_naval_buildup.53.t:0 "Crise de Deserção em Submarino"
 nko_naval_buildup.53.d:0 "Um oficial subalterno a bordo de um de nossos submarinos de patrulha desapareceu durante uma escala em porto. O Birô de Reconhecimento quer autorização para agir."
 nko_naval_buildup.53.a:0 "Enviar o Corpo de Assalto, recuperar ou eliminar"
 nko_naval_buildup.53.b:0 "Rastrear passivamente, sem operação"
 nko_naval_buildup.53.c:0 "Enterrar o relatório"
 nko_naval_buildup.54.t:0 "Estaleiros de Nampo Superam a Cota"
 nko_naval_buildup.54.d:0 "Capatazes dos estaleiros de Nampo relatam um mês que estourou a cota. A força de trabalho está animada, mas cansada."
 nko_naval_buildup.54.a:0 "Recompensá-los publicamente com uma ração extra"
 nko_naval_buildup.54.b:0 "Exigir mais, a cota sempre foi baixa"
 nko_naval_buildup.56.t:0 "Embarcação de Contrabandistas Capturada"
 nko_naval_buildup.56.d:0 "Uma patrulha costeira apreende uma pequena embarcação que transportava contrabando. O comandante local pergunta como lidar com o butim."
 nko_naval_buildup.56.a:0 "Exibi-la na televisão, vitória de propaganda"
 nko_naval_buildup.56.b:0 "Apreensão discreta, incorporar a carga aos estoques"
 nko_naval_buildup.56.c:0 "Aceitar o suborno do capitão e fazer vista grossa"
 nko_naval_buildup.60.t:0 "O Serviço Silencioso Caminha de Cabeça Erguida"
 nko_naval_buildup.60.d:0 "O Sinpo e suas irmãs retornam ao porto hasteando flâmulas triunfantes. A arma submarina da Marinha do Povo Coreano atingiu a maturidade. Uma força submarina crível protegendo a Pátria."
 nko_naval_buildup.60.a:0 "As profundezas são nossas."
 nko_naval_buildup.61.t:0 "Lobos da Costa"
 nko_naval_buildup.61.d:0 "A doutrina Wolfpack é formalmente adotada em todas as flotilhas. Lançamentos em salva, guerra eletrônica em camadas e barcos-isca. Nossas forças de ataque litorâneas operam como um só organismo."
 nko_naval_buildup.61.a:0 "Soltem os lobos."
 nko_naval_buildup.62.t:0 "A Costa de Ferro"
 nko_naval_buildup.62.d:0 "De Sinuiju a Wonsan, cada aproximação está bloqueada com bunkers reforçados, artilharia móvel e mísseis antinavio lançados da costa. Nenhuma frota se aproximará de nossa costa sem sofrer danos."
 nko_naval_buildup.62.a:0 "O muro se mantém."
 nko_naval_buildup.63.t:0 "O Corpo de Assalto ao Mar"
 nko_naval_buildup.63.d:0 "Elementos do Corpo de Assalto assumem seu lugar na ordem de batalha marítima. O Birô de Reconhecimento, os franco-atiradores navais, os homens-rã e a infantaria leve naval agora formam uma única ponta de lança de elite capaz de atacar qualquer costa."
 nko_naval_buildup.63.a:0 "Ataquem em qualquer lugar."
 nko_naval_buildup.70.t:0 "Uma Doutrina Estratégica para o Mar"
 nko_naval_buildup.70.d:0 "O birô naval do Estado-Maior ratifica uma doutrina unificada: submarinos em camadas, barcos lança-mísseis em enxame, costas fortificadas e comandos navais atuando em conjunto. Cada estaleiro, base e escola de treinamento agora puxa na mesma direção."
 nko_naval_buildup.70.a:0 "Todos ao programa."
 nko_naval_buildup.71.t:0 "Os Primeiros Destróieres Nacionais Largam Amarras"
 nko_naval_buildup.71.d:0 "Os estaleiros de Nampo e Wonsan lançam os primeiros destróieres lança-mísseis de construção nacional em anos. As tripulações tomam os novos cascos de assalto, trabalhando até o estado operacional. A frota de superfície volta a ganhar vida."
 nko_naval_buildup.71.a:0 "Enviem-nos ao mar."
 nko_naval_buildup.72.t:0 "Cascos de Submarinos Nacionais Tomam Forma"
 nko_naval_buildup.72.d:0 "Os estaleiros de submarinos produzem novos barcos de ataque em cronograma apertado. Tripulações treinadas nos antigos cascos Sang-O e Romeo são transferidas para as novas plataformas, acelerando a qualificação."
 nko_naval_buildup.72.a:0 "Em silêncio, rumo às profundezas."
 nko_naval_buildup.73.t:0 "Esquadrões de Destróieres Liberados"
 nko_naval_buildup.73.d:0 "Um esquadrão completo de destróieres, construído e tripulado no país, é enviado à Frota Oriental. Combinada com as flotilhas de barcos lança-mísseis treinadas na Wolfpack, a ordem de batalha de superfície se torna uma séria dissuasão."
 nko_naval_buildup.73.a:0 "Deixem os esquadrões agir."
 nko_naval_buildup.74.t:0 "Uma Frota Moderna Desperta"
 nko_naval_buildup.74.d:0 "O casco de destróier de 2005 e o submarino de ataque da classe de 1995 entram juntos em nossos estaleiros, batizados de §YClasse Choe Hyon§! e §YClasse Sinpo§!. Cinco de cada foram entregues ao estoque, e linhas de produção dedicadas para ambas as classes já estão assentadas nos estaleiros de Nampo e Wonsan   com o §HBirô de Submarinos§! e o §HBirô de Navios de Superfície§! assumindo o comando direto.\n\nO marco desbloqueia os traços de MIO de nível avançado em ambos os birôs: §YArmas Mar-Terra§!, §YMateriais Modernos§! e §YProjeto Refinado de Submarinos§! no Birô de Submarinos, e §YProdução Otimizada§! e §YTecnologia de Radar de Alta Escala§! no Birô de Navios de Superfície."
 nko_naval_buildup.74.a:0 "Começa uma era de aço."
 nko_naval_buildup.99.t:0 "O Cinturão Marítimo de Pyongyang é Forjado"
 nko_naval_buildup.99.d:0 "Após anos de esforço concentrado, a Marinha do Povo Coreano conclui a Doutrina Naval Songun. Submarinos de longo alcance, barcos lança-mísseis em enxame, defesas costeiras em camadas e forças especiais navais de elite operam como um só. A frota assimétrica é um fato."
 nko_naval_buildup.99.a:0 "O Cinturão Marítimo está forjado."
 nko_naval_buildup.99.b:0 "A marinha de Pyongyang se moderniza."
 NKO_naval_modern_fleet_milestone:0 "Comissionar a Frota Moderna"
 NKO_naval_modern_fleet_milestone_desc:0 "Tanto o submarino de ataque da classe Sinpo quanto o contratorpedeiro da classe Choe Hyon atingiram prontidão de produção. Comissione os cinco primeiros cascos de cada um na Marinha Popular da Coreia, crie linhas de produção dedicadas e conceda fundos a ambos os birôs navais."
 NKO_more_arms_factories_desc:0 "A indústria militar não pode ficar parada. Novas fábricas de armas serão construídas para manter o Exército Popular da Coreia abastecido e a linha Songun forte."
 NKO_spa_focus_lifts_industry_tt:0 "§GRemove permanentemente a penalidade fixa §!§Y'Estagnação Industrial'§!§G.§!"
 NKO_spa_focus_lifts_production_tt:0 "§GRemove permanentemente a penalidade fixa §!§Y'Decadência das Linhas de Produção'§!§G.§!"
 NKO_spa_focus_lifts_military_tt:0 "§GRemove permanentemente a penalidade fixa §!§Y'Força Oca'§!§G.§!"
 NKO_spa_focus_lifts_economy_tt:0 "§GRemove permanentemente a penalidade fixa §!§Y'Acúmulo de Recursos'§!§G.§!"
 NKO_spa_focus_lifts_research_tt:0 "§GRemove permanentemente a penalidade fixa §!§Y'Estagnação da Pesquisa'§!§G.§!"
 NKO_spa_focus_lifts_agriculture_tt:0 "§GRemove permanentemente a penalidade fixa §!§Y'Agricultura de Subsistência'§!§G.§!"
 NKO_spa_focus_lifts_foreign_tt:0 "§GRemove permanentemente a penalidade fixa §!§Y'Isolamento Diplomático'§!§G.§!"
 NKO_spa_focus_lifts_construction_tt:0 "§GRemove permanentemente a penalidade fixa §!§Y'Gargalo de Construção'§!§G (infraestrutura defensiva).§!"
 NKO_spa_umbrella:0 "Assembleia Popular Suprema"
 NKO_spa_umbrella_desc:0 "A Assembleia Popular Suprema permite manter §Yaté dois mandatos de produtividade§! ativos ao mesmo tempo. Cada mandato suspende uma das oito disfunções crônicas do planejamento central por §Y365 dias§! e aplica um bônus próprio; quando um expira, seu espaço fica livre para outro. As penalidades fixas podem ser removidas permanentemente ao concluir focos correspondentes."
 NKO_spa_debuff_industry:0 "Estagnação Industrial"
 NKO_spa_debuff_industry_desc:0 "Décadas de alocação central deixaram as fábricas sem insumos e sem mão de obra qualificada. A construção se arrasta."
 NKO_spa_debuff_production:0 "Decadência das Linhas de Produção"
 NKO_spa_debuff_production_desc:0 "O ferramental está gasto, as cadeias de suprimento são improvisadas e o controle de qualidade depende do humor do capataz naquela manhã."
 NKO_spa_debuff_military:0 "Força Oca"
 NKO_spa_debuff_military_desc:0 "No papel, o Exército do Povo Coreano tem milhões de homens. Na prática, o treinamento é teatro e o moral é frágil."
 NKO_spa_debuff_economy:0 "Acúmulo de Recursos"
 NKO_spa_debuff_economy_desc:0 "Quadros provinciais desviam o que passa por seus distritos. Os recursos alocados centralmente chegam tarde, reduzidos ou simplesmente não chegam."
 NKO_spa_debuff_research:0 "Estagnação da Pesquisa"
 NKO_spa_debuff_research_desc:0 "Sanções, fuga de cérebros e laboratórios mal equipados tornam até a pesquisa básica muito mais lenta."
 NKO_spa_debuff_agriculture:0 "Agricultura de Subsistência"
 NKO_spa_debuff_agriculture_desc:0 "As fazendas cooperativas mal produzem para alimentar suas próprias aldeias. As cidades ficam desabastecidas."
 NKO_spa_debuff_foreign:0 "Isolamento Diplomático"
 NKO_spa_debuff_foreign_desc:0 "Sanções e o status de pária fazem com que cada gesto diplomático custe mais do que deveria e renda menos do que poderia."
 NKO_spa_debuff_construction:0 "Gargalo de Construção"
 NKO_spa_debuff_construction_desc:0 "A engenharia defensiva é o setor mais afetado. Fortes desmoronam antes de ficarem prontos, mastros de radar sobem com a fiação pela metade, bases navais ficam meio dragadas e os aeródromos são esburacados pela má manutenção."
 NKO_spa_resolution_industry:0 "Aceleração Industrial"
 NKO_spa_resolution_industry_desc:0 "A Assembleia emite uma diretriz industrial vinculante. As fábricas civis crescem mais rápido e os complexos militares as seguem."
 NKO_spa_resolution_production:0 "Mandato de Produção de Equipamentos"
 NKO_spa_resolution_production_desc:0 "As linhas de produção entram num ciclo planejado de sobrecarga. Os limites de eficiência sobem; novos equipamentos aceleram mais rápido."
 NKO_spa_resolution_military:0 "Resolução Songun"
 NKO_spa_resolution_military_desc:0 "O Militar Primeiro está em temporada. Os cronogramas de treinamento se apertam, a doutrina de ataque se afia e o Partido reafirma suas prioridades."
 NKO_spa_resolution_economy:0 "Autossuficiência Juche"
 NKO_spa_resolution_economy_desc:0 "Um esforço de autossuficiência espreme cada grama do solo e das minas. Os recursos locais fluem."
 NKO_spa_resolution_research:0 "Impulso à Pesquisa"
 NKO_spa_resolution_research_desc:0 "Todos os institutos trabalham horas extras e os laboratórios sigilosos operam em turnos ininterruptos. Romper as sanções e a fuga de cérebros é o mandato mais caro que a Assembleia pode aprovar."
 NKO_spa_resolution_agriculture:0 "Impulso Agrícola"
 NKO_spa_resolution_agriculture_desc:0 "As fazendas cooperativas superam a cota. A escassez civil diminui e as fábricas veem um pequeno aumento de produção."
 NKO_spa_resolution_foreign:0 "Diretriz de Política Externa"
 NKO_spa_resolution_foreign_desc:0 "Os enviados do Ministério das Relações Exteriores se espalham. Melhorar relações fica mais barato e os parceiros comerciais nos veem com um pouco mais de simpatia."
 NKO_spa_resolution_construction:0 "Batalhão de Construção"
 NKO_spa_resolution_construction_desc:0 "Brigadas de engenharia militar mobilizadas em massa descem sobre cada local defensivo. Fortes, radares, posições de defesa antiaérea de curto alcance, aeródromos, bases navais, silos de combustível, ferrovias e centros de suprimento sobem em ritmo sem precedentes."
 NKO_spa.0.t:0 "A Assembleia Popular Suprema se Reúne"
 NKO_spa.0.d:0 "Camarada Secretário-Geral, o Gabinete preparou a pauta. A Assembleia está reunida. Oito problemas crônicos exigem atenção; a qualquer momento podemos manter §Yquaisquer dois§! deles sob mandato vinculante.\n\nCada mandato dura §Y365 dias§!; quando um expira, um espaço se libera para o próximo."
 NKO_spa.0.a:0 "Convocar a Assembleia."
 NKO_spa.20.t:0 "Heróis Stakhanovistas"
 NKO_spa.20.d:0 "Operários do cinturão industrial de Hwanghae pulverizaram suas cotas nas primeiras semanas da nova diretriz. Seus retratos já estão sendo afixados por todo o país, e seus gerentes relatam um aumento de capacidade que será usado imediatamente."
 NKO_spa.20.a:0 "Recompensar os heróis."
 NKO_spa.21.t:0 "Inovação de Ferramental"
 NKO_spa.21.d:0 "Engenheiros da Fábrica de Máquinas Pesadas de Pyongyang criaram um novo processo de fixação que dobra a vazão das linhas de veículos blindados. Sai uma leva de 35 dos chassis mais recentes disponíveis: tanques, IFVs, APCs, veículos de reconhecimento ou autopropulsados, conforme a linha que estivesse carregada naquela semana."
 NKO_spa.21.a:0 "Difundir a técnica."
 NKO_spa.22.t:0 "Herói da República"
 NKO_spa.22.d:0 "A liderança exemplar de um oficial subalterno durante os exercícios Songun chamou a atenção do Estado-Maior. Reservistas correm para os postos de alistamento, inspirados pelo exemplo."
 NKO_spa.22.a:0 "Promover e condecorar."
 NKO_spa.23.t:0 "Descoberta Mineral"
 NKO_spa.23.d:0 "Prospectores espalhados pelas montanhas do norte identificaram uma veia até então desconhecida. As análises iniciais determinarão qual recurso estratégico o depósito fornece. O Escritório Estatal de Recursos autorizou a extração imediata."
 NKO_spa.23.a:0 "Iniciar a extração."
 NKO_spa.24.t:0 "Deserção de um Cientista Estrangeiro"
 NKO_spa.24.d:0 "Um engenheiro expatriado escapou dos controles de sanções e chegou a um centro de pesquisa da RPDC. Suas contribuições estão acelerando um dos programas prioritários da Academia Estatal."
 NKO_spa.24.a:0 "Dar boas-vindas ao camarada."
 NKO_spa.25.t:0 "Colheita Recorde"
 NKO_spa.25.d:0 "As fazendas cooperativas de Hamgyong do Norte relatam rendimentos bem acima da cota. As reservas de grãos aumentam; os postos de recrutamento rurais se enchem de jovens lavradores em busca de trabalho no exército."
 NKO_spa.25.a:0 "Distribuir o excedente."
 NKO_spa.26.t:0 "Golpe Diplomático"
 NKO_spa.26.d:0 "Os enviados do Ministério das Relações Exteriores aproveitaram a nova diretriz para uma vitória diplomática discreta: uma concessão de bastidores de um grande parceiro que se traduz em divisas."
 NKO_spa.26.a:0 "Embolsar os ganhos."
 NKO_spa.27.t:0 "Vanguarda da Construção"
 NKO_spa.27.d:0 "Os batalhões voluntários de construção superaram todas as projeções. Com capacidade ociosa sobrando, o gabinete oferece as obras ao projeto mais atrasado. Caso a força de trabalho não esteja disponível, a mão de obra pode ser liquidada em troca de divisas."
 NKO_spa.27.factory_take:0 "Construir uma Fábrica Civil."
 NKO_spa.27.factory_cash:0 "Liquidar a mão de obra. (§Y+0,5§! tesouro)"
 NKO_spa.27.refinery_take:0 "Construir uma Refinaria Sintética."
 NKO_spa.27.refinery_cash:0 "Liquidar a mão de obra. (§Y+0,45§! tesouro)"
 NKO_spa.27.agri_take:0 "Construir um Distrito Agrícola."
 NKO_spa.27.agri_cash:0 "Liquidar a mão de obra. (§Y+0,45§! tesouro)"
 NKO_spa.30.t:0 "O Plano Quinquenal Começa"
 NKO_spa.30.d:0 "Faixas florescem em cada portão de fábrica. A Assembleia decretou que os próximos 365 dias são um Plano Quinquenal em miniatura, com cotas de produção concretas para cada cinturão industrial."
 NKO_spa.30.a:0 "Colocar o Plano em marcha."
 NKO_spa.32.t:0 "Recordes Industriais Batidos"
 NKO_spa.32.d:0 "A diretriz termina com um comício triunfal na Praça Kim Il-sung. Novos espaços industriais foram acrescentados à capacidade produtiva da República, e o prestígio do Partido disparou."
 NKO_spa.32.a:0 "Celebrar a conquista."
 NKO_spa.33.t:0 "Chega Novo Ferramental"
 NKO_spa.33.d:0 "Por canais do mercado cinza, ferramental de reposição chegou às fábricas de equipamentos. Os capatazes de produção retreinam os chãos de fábrica conforme as novas especificações."
 NKO_spa.33.a:0 "Implantar o novo ferramental."
 NKO_spa.35.t:0 "Triunfo no Controle de Qualidade"
 NKO_spa.35.d:0 "O Mandato de Produção de Equipamentos termina com uma inspeção estatal que encontra os padrões de qualidade no nível mais alto da memória. Os oficiais de aquisição do KPA estão satisfeitos."
 NKO_spa.35.a:0 "Documentar os novos padrões."
 NKO_spa.36.t:0 "Intensificam-se os Exercícios"
 NKO_spa.36.d:0 "O Songun está em temporada. Em todos os corpos, o ritmo dos exercícios dobra. Exercícios com fogo real, suspensos por anos, são retomados."
 NKO_spa.36.a:0 "Exigir mais das tropas."
 NKO_spa.38.t:0 "O Songun Triunfa"
 NKO_spa.38.d:0 "A Resolução Songun termina com um desfile da Grande Vitória por Pyongyang. As convocações de reservistas reabasteceram as fileiras; o KPA está mais forte do que em anos."
 NKO_spa.38.a:0 "Marchar em formação."
 NKO_spa.39.t:0 "Começam as Prospecções Minerais"
 NKO_spa.39.d:0 "Equipes de levantamento geológico se espalham pelas montanhas do norte. Antigos mapas da era soviética são desenterrados e atualizados com instrumentos modernos."
 NKO_spa.39.a:0 "Autorizar as prospecções."
 NKO_spa.41.t:0 "Autossuficiência Alcançada"
 NKO_spa.41.d:0 "O Mandato de Autossuficiência Juche termina com as reservas de moeda estrangeira reabastecidas por vendas de exportação. Camarada Secretário-Geral, a República se mantém de cabeça erguida."
 NKO_spa.41.a:0 "Depositar as reservas."
 NKO_spa.42.t:0 "Portas dos Laboratórios Abertas"
 NKO_spa.42.d:0 "A Academia Estatal de Ciências recebe o chamado: todo programa prioritário é liberado, todo arquivo sigiloso fica acessível. Pesquisadores que esperavam anos por credenciamento são habilitados da noite para o dia."
 NKO_spa.42.a:0 "Autorizar as prioridades."
 NKO_spa.44.t:0 "Recuperando o Atraso"
 NKO_spa.44.d:0 "O Impulso à Pesquisa termina com a RPDC mais próxima da fronteira tecnológica do que em qualquer momento desde a década de 1970. O Partido celebra um triunfo discreto."
 NKO_spa.44.a:0 "Explorar a nova vantagem."
 NKO_spa.45.t:0 "Começa o Plantio da Primavera"
 NKO_spa.45.d:0 "As fazendas cooperativas de todo o país se mobilizam para uma temporada de plantio agressiva. Brigadas voluntárias das cidades reforçam a força de trabalho rural."
 NKO_spa.45.a:0 "Mobilizar as brigadas."
 NKO_spa.47.t:0 "Colheita Recorde"
 NKO_spa.47.d:0 "Os rendimentos superam o plano em 20%. As reservas de grãos aumentam; pela primeira vez em anos, alguns distritos terão ração completa."
 NKO_spa.47.a:0 "Distribuir o excedente."
 NKO_spa.48.t:0 "Aberturas Diplomáticas"
 NKO_spa.48.d:0 "Delegações da RPDC são discretamente enviadas a capitais amigas, levando termos favoráveis e pedidos discretos: Pequim, Moscou, Teerã, Damasco."
 NKO_spa.48.a:0 "Enviar os emissários."
 NKO_spa.50.t:0 "Concessões Comerciais"
 NKO_spa.50.d:0 "A Diretriz de Política Externa termina com um conjunto de novos acordos que melhoram significativamente a entrada de capital estrangeiro. Compromissos de investimento são firmados para a próxima década."
 NKO_spa.50.a:0 "Assinar os acordos."
 NKO_spa.51.t:0 "A Vanguarda da Construção se Mobiliza"
 NKO_spa.51.d:0 "O Mandato do Batalhão de Construção é uma bonança para qualquer facção interna a quem o Gabinete decidir dar o crédito. O Partido pode direcionar o dividendo político a uma facção cuja cooperação ele precise mais que a das outras."
 NKO_spa.51.military:0 "Dar o crédito aos §YMilitares§!. (§G+15§! de opinião base, dobrado para autocratas; §G+0,05§! de opinião/mês)"
 NKO_spa.51.cadres:0 "Dar o crédito aos §YQuadros Comunistas§!. (§G+15§! de opinião base, dobrado para autocratas; §G+0,05§! de opinião/mês)"
 NKO_spa.51.donju:0 "Dar o crédito aos §YDonju§!. (§G+15§! de opinião base, dobrado para autocratas)"
 NKO_spa.51.farmers:0 "Dar o crédito aos §YAgricultores§!. (§G+15§! de opinião base, dobrado para autocratas)"
 NKO_spa.51.labour:0 "Dar o crédito aos §YSindicatos Trabalhistas§!. (§G+15§! de opinião base, dobrado para autocratas)"
 NKO_spa.51.none:0 "Ficar com o crédito político. (§G+25 PP§!)"
 NKO_spa.53.t:0 "Projetos Concluídos"
 NKO_spa.53.d:0 "O Mandato do Batalhão de Construção termina com cerimônias de inauguração transmitidas por toda a República. O Partido colhe o dividendo político; a população está mais estável; o tesouro recebe um pequeno ganho extra dos excedentes dos projetos."
 NKO_spa.53.a:0 "Cortar as fitas."
