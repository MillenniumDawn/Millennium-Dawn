 DPR_donbass_new_territory: "개발을 위한 새로운 땅"
 DPR_donbass_new_territory_desc: "돈바스 도시권을 계속 확장할 것입니다"
 DPR_donbass_new_resources: "새로운 자원 매장지"
 DPR_donbass_new_resources_desc: "우리의 개혁이 결실을 맺어 지질학자들이 새로운 매장지를 발견했으며, 이를 채굴할 새로운 생산 시설도 만들 수 있게 되었습니다"
 DPR_donbass_security: "돈바스의 치안"
 DPR_donbass_security_desc: "우리 지역이 빠르게 발전하고 자치권을 부여받았음에도, 우리는 원초적인 위협인 비적 행위와 부패로부터 안전하지 않습니다"
 DPR_donbass_sb: "자체 보안 기관"
 DPR_donbass_sb_desc: "지역의 질서를 보장하기 위해 자체 보안 기관을 창설하고자 합니다"
 DPR_donbass_powers: "더 큰 권한"
 DPR_donbass_powers_desc: "불가피한 조치로서 우리 보안 기관의 권한을 확대할 것입니다"
 DPR_donbass_arests: "연쇄 체포"
 DPR_donbass_arests_desc: "우리 기업들의 부패한 경영진을 상대로 연쇄 체포를 단행할 것입니다"
 DPR_donbass_raids: "반부패 단속"
 DPR_donbass_raids_desc: "우리는 부패한 관리들을 엄중히 처벌할 것이며, 이들을 겨냥한 일련의 급습을 실시할 준비가 되어 있습니다."
 DPR_donbass_moneys: "부패 자금 몰수"
 DPR_donbass_moneys_desc: "부패한 관리들에게서 압수한 모든 자금을 국고로 보낼 것입니다"
 DPR_donbass_more_powers: "한층 더 큰 권한"
