 BSH_Anti_tank_1: "РПГ-7"
 BSH_Anti_tank_1_desc: "Применялся во многих войнах и на многих машинах."
 BSH_Anti_tank_2: "АТ-4 «Фагот»"
 BSH_Anti_tank_2_desc: "Гораздо легче и старше других ПТРК. Эта ПТУР поражает цели лишь на дальности 70–2500 м, что значительно меньше, чем у других комплексов, зато она дешевле."
 BSH_Anti_tank_3: "9М133М «Корнет-М»"
 BSH_Anti_tank_4: "9М134М «Булат-М»"
 BSH_MBT_1: "Т-55"
 BSH_MBT_1_desc: "Танк Т-54/55, пожалуй, самый массовый в мире. Разработанный и произведённый в первые годы холодной войны, он был могуществом и основой Красной Армии. Когда-то внушавший страх как символ российской мощи, он стал культовым изображением ближневосточных бронетанковых войск, уничтожаемых в результате американского воздушного удара."
 BSH_MBT_1_short: "Т-55"
 BSH_MBT_2: "Т-72"
 BSH_MBT_2_desc: "Т-72, пожалуй, самая успешная разработка, созданная Россией. Это была вершина советской военной мощи на завершающем этапе Холодной войны, производившаяся тысячами, и служащая основой российской армии даже сегодня. Хотя она стала печально известной из-за своих катастрофических неудач в конфликтах на Ближнем Востоке, Т-72 по-прежнему используется в качестве платформы для разработки будущих российских танков и постоянно подвергается модификациям и обновлениям, чтобы соответствовать стандартам современной войны сегодня. Не стоит недооценивать танк, который когда-то был копьём советских войск."
 BSH_MBT_2_short: "Т-72"
 BSH_MBT_3: "Т-80"
 BSH_MBT_3_desc: "Этот танк стоимостью $2 млн — настоящий зверь поля боя — использовал ту же пушку, что и Т-72, но с усиленной бронёй и ПТУР «Кобра»."
 BSH_MBT_3_short: "Т-80"
 BSH_MBT_4: "Т-90"
 BSH_MBT_4_desc: "Т-90 — российский основной боевой танк, созданный как глубокая модернизация Т-72Б и принятый на вооружение в 1992 году. Он получил систему управления огнём на базе аппаратуры Т-80У, комплекс оптико-электронного подавления «Штора-1» и встроенную динамическую защиту «Контакт-5», что заметно подняло его защищённость. Вооружение — 125-мм гладкоствольная пушка 2А46М с автоматом заряжания, способная запускать управляемые ракеты через ствол. Т-90 стал самым массовым российским танком постсоветского периода и одним из главных экспортных образцов."
 BSH_MBT_4_short: "Т-90"
 BSH_MBT_5: "Т-14 «Армата»"
 BSH_MBT_5_desc: "Самый передовой боевой танк в российской армии с гладкими очертаниями и мощной 152-мм пушкой."
 BSH_MBT_5_short: "Т-14"
 BSH_MBT_7: "Т-14М"
 BSH_MBT_7_short: "Т-14М"
 BSH_MBT_8: "Т-99 «Чёрный орел»"
 BSH_MBT_8_short: "Т-99"
 CRM_Anti_Air_0: "9К32 «Стрела-2»"
 CRM_Anti_Air_0_desc: "Разработан в начале холодной войны с использованием метода пропорциональной навигации для захвата и уничтожения американских ядерных бомбардировщиков. Одна из самых простых систем ПВО, способная поражать цели на расстоянии 3700–4200 м."
 CRM_Anti_Air_1: "9К38 «Игла»"
 CRM_Anti_Air_1_desc: "«Игла» — более современная версия «Стрелы», принятая на вооружение в России в 2004 году. Она использует двухдиапазонную инфракрасную систему наведения (версия «С»), которая намного лучше, чем у «Стрелы»."
 CRM_Anti_Air_2: "9К38 «Игла-С»"
 CRM_Anti_Air_2_desc: "Новейший вариант, который является существенно улучшенным вариантом с большей дальностью действия, более чувствительным искателем, повышенной устойчивостью к последним мерам противодействия и более тяжелой боеголовкой. Производитель сообщает, что вероятность попадания составляет 0,8-0,9."
 CRM_Anti_Air_3: "9К42"
 CRM_Anti_Air_4: "9К48"
 CRM_APC_1: "БТР-60"
 CRM_APC_1_desc: "Одна из старейших машин, до сих пор находящихся на вооружении, БТР-60, оснащена 14,5-мм крупнокалиберным пулемётом КПВТ с боезапасом 500 патронов. Вспомогательное вооружение — спаренный пулемёт ПКТ калибра 7,62 мм с боезапасом 3,00 патрона. Отлично подходит для переброски лёгкой пехоты и сил быстрого реагирования (QRF)."
 CRM_APC_1_short: "БТР-60"
 CRM_APC_2: "МТ-ЛБ"
 CRM_APC_2_desc: "МТ-ЛБ был создан в 1970-х годах. Изготовлены дешево и быстро. Советы использовали их для легких противовоздушных и пехотных боев."
 CRM_APC_2_short: "МТ-ЛБ"
 CRM_APC_3: "БТР-70"
 CRM_APC_3_desc: "БТР-70 использовались с 1972 года, в советско-афганской войне они использовались для передвижения войск и последующей огневой поддержки. Единственное отличие от БТР-60 — более тяжелая броня."
 CRM_APC_3_short: "БТР-70"
 CRM_APC_4: "БТР-80"
 CRM_APC_4_desc: "БТР-80 — колесный БТР-амфибия с колесной формулой 8х8, разработанный в СССР. Он был принят на вооружение в 1986 году и заменил в Советской Армии предыдущие машины БТР-60 и БТР-70. Впервые он был применен во время советской войны в Афганистане."
 CRM_APC_4_short: "БТР-80"
 CRM_APC_5: "БТР-90"
 CRM_APC_5_desc: "Разработан в 1994 году для борьбы с боевиками. Оснащен мощной 30-мм пушкой Шипунова 2А42 с 500 патронами."
 CRM_APC_5_short: "БТР-90"
 CRM_APC_6: "Курганец-25"
 CRM_APC_6_desc: "«Курганец-25», одна из самых современных российских машин, был создан в 2015 году. Как БМП он вооружён лёгкой пушкой «Бумеранг-БМ» и 12,7-мм пулемётом «Корд». Во многом повторяет американскую БМП Bradley."
 CRM_APC_6_short: "Курганец-25"
 CRM_APC_7: "Курганец-35"
 CRM_APC_7_desc: "Во многом подобно «Курганцу-25», который в первую очередь является БМП, «Курганец-35» — это БТР: он может перевозить 12 человек и выполнять в операциях БМП примерно те же задачи, что и 25-й."
