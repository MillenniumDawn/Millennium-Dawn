 IRQ_power_of_the_unions: "Poder dos Sindicatos"
 IRQ_al_hawasim: "Al Hawasim"
 IRQ_mahdi_army_expansion_idea: "Expansão do Exército Mahdi"
 IRQ_targeted_preparations: "Preparações Direcionadas"
 IRQ_untrustworthy_neighbors: "Vizinhos Não Confiáveis"
 IRQ_the_lions_den: "The Lion's Den"
 IRQ_strategic_partnerships: "Parcerias Estratégicas"
 IRQ_sadrist_militias: "Movimento Sadr"
 IRQ_sadrist_militias_desc: "Saraya al-Salam, the latest incarnation of the Mahdi Army, is the militia of the Sadrist Movement which is fighting on the frontlines together with the Iraqi Army. Its leader, Muqtada al-Sadr is a popular Iraqi Shia cleric and politician who has inherited his movement from his popular father. His platform is based on a cocktail of political Shiite Islam, Anti-Americanism, Iraqi independence from Iranian influence and Iraqi populist nationalism."
 IRQ_threat_of_al_qaeda: "Desastre Iminente"
 IRQ_threat_of_al_qaeda_desc: "The dissolution of the [IRQ.GetFlag] Iraqi Armed Forces meant that many soldiers and commanders were left without a job. This led to many elements within the army aligning themselves with various extremist groups in the nation, one of which being [AIQ.GetFlag] Al-Qaeda in Iraq. If left unchecked, then this group may launch an attack against our government.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if we resolve the §HInsurgency Crisis§!"
 IRQ_sunni_dynamic_idea: "Influência Política Sunita"
 IRQ_sunni_dynamic_idea_desc: "The Sunni community within our nation has mobilized in order to preserve their identity, way of life, and sense of being. Due to the rise of Shi'ism, and the marginalization of the Sunnis in political life, their mobilization will work against our nation's interests.\n§W-----------------------------------------------------------------§!\nThis national spirit will change dynamically every §H10§! levels that the §HSunni Political Variable§! changes by. Currently, Sunni Political Influence is at §H[?IRQ_sunni_political_influence]/100§!\n§W-----------------------------------------------------------------§!\nWhile this national spirit is active, §H[AIQ.GetFlag] Al-Qaeda in Iraq§! can start a §Rcivil war§! if Salafism is §H20%§! or greater, stability is less than §H55%§!, and our state religion is §HShia§!"
 IRQ_triumph_over_america: "Triunfo Sobre a América"
 IRQ_triumph_over_america_desc: "Our soldiers taught a lesson to the Americans that they will never forget."
 IRQ_mosque_income_idea: "Aumento de Impostos nas Mesquitas"
 IRQ_mosque_income_idea_desc: "Para financiar vários projetos na nação, aumentamos os impostos das Mesquitas."
 IRQ_PIJ_idea: "Brigadas PIJ"
 IRQ_PIJ_idea_desc: "PIJ Brigades are currently operating in our nation, and will help us fight back against the Zionist state.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if the §HBa'athist party§! is no longer in power, or [ISR.GetFlag] §HIsrael§! no longer exists."
 IRQ_cult_of_saddam: "Culto a Saddam"
 IRQ_cult_of_saddam_desc: "Our great leader, Saddam Hussein, has brought great wealth and dignity to [IRQ.GetFlag] Iraq. His contributions must be cherished while he is still around.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if the §HBa'athist party§! is no longer in power, or if §HSaddam Hussein§! is no longer the leader."
 IRQ_air_support_granted: "Suporte Aéreo Contra Insurgentes"
 IRQ_air_support_granted_desc: "Nossa Força Aérea está trabalhando 24 horas por dia para fornecer suporte aéreo contra os insurgentes em nossa nação."
 IRQ_recovering_from_the_gulf_war: "Recuperação da Guerra do Golfo"
 IRQ_recovering_from_the_gulf_war_desc: "Após a devastadora Guerra do Golfo, o Iraque se encontra em estado de desordem e destruição. O conflito, caracterizado por operações aéreas e terrestres intensas, testemunhou batalhas significativas que deixaram um impacto duradouro na nação. Desde os ataques aéreos iniciais e a libertação do Kuwait até a campanha terrestre que empurrou as forças iraquianas para trás, a guerra cobrou um preço alto."
 IRQ_MEK_bases: "Bases MEK"
 IRQ_MEK_bases_desc: "Recognizing the strategic importance of the Mojahedin e Khalq (MEK) during the Iran-Iraq War, Iraq seeks to leverage their assistance and establish bases to enhance its military capabilities. This allows for the establishment of MEK bases within Iraq to threaten Iran, enabling an increase in the maximum number of volunteer forces that can be mobilized. Like its use in 1991 against the Kurds."
 IRQ_high_political_opposition: "Oposição Política Elevada"
 IRQ_high_political_opposition_desc: "O Iraque enfrenta um desafio crítico ao lidar com uma oposição política elevada, que abrange diversos grupos étnicos minoritários e comunidades religiosas."
 IRQ_bastion_of_baathism: "Bastião do Ba'athismo"
 IRQ_bastion_of_baathism_desc: "Nos terrenos férteis do solo iraquiano, as sementes do Ba'athismo foram plantadas, germinando em meio aos desafios e aspirações da época. Líderes visionários surgiram, impulsionados pelo desejo de unidade nacional, nacionalismo árabe e busca por justiça social. Que os árabes sejam para sempre um só!"
 IRQ_international_sanctions: "Sanções Internacionais"
 IRQ_international_sanctions_desc: "No ano 2000, o Iraque enfrentou o impacto prejudicial das sanções internacionais impostas após a Guerra do Golfo em 1991. Essas sanções restringiram severamente a capacidade do Iraque de se envolver no comércio internacional, prejudicaram sua recuperação econômica e resultaram em uma queda nos padrões de vida do povo iraquiano. As sanções também tiveram consequências humanitárias significativas, afetando o acesso à saúde, serviços essenciais e recursos necessários para necessidades básicas. Os efeitos duradouros dessas sanções moldaram o cenário econômico e social do Iraque durante esse período."
 IRQ_conscriptions_in_schools: "Conscrição nas Escolas"
 IRQ_conscriptions_in_schools_desc: "Estamos permitindo que os alunos faltem às aulas para alistar-se em nossas forças armadas."
 IRQ_fadayyene_saddam: "Milícias Fedayeen Saddam"
 IRQ_fadayyene_saddam_desc: "Ordenamos que várias unidades do Fedayeen Saddam estabeleçam posições defensivas ao redor da nação."
 IRQ_kurdish_friends: "[KUR.GetFlag] Amigos dos Curdos"
 IRQ_kurdish_friends_desc: "The [KUR.GetFlag] Kurds have historically been ousted by most nations in the region, thus isolating them and leaving them with little to no friends. It's about time that we strengthen our friendship with the [KUR.GetFlag] Kurds, so that we may get what we want, liberation, freedom, and independence from foreign powers."
 IRQ_negotiations_with_kurdish_government: "Negociações com o Governo Curdo [KUR.GetFlag]"
 IRQ_negotiations_with_kurdish_government_desc: "Ao abrir linhas de comunicação com o governo Curdo [KUR.GetFlag], podemos reintegrar o povo Curdo em nosso estado sem derramamento de sangue."
 IRQ_bolster_communist_party_of_kurdistan_iraq: "Fortalecer os Ideais Comunistas em [KUR.GetFlag] Curdistão"
 IRQ_bolster_communist_party_of_kurdistan_iraq_desc: "The [KUR.GetFlag] Kurdish people need one thing, and that is independence and liberation from all forms of foreign exploitation. By promoting communist ideals in [KUR.GetFlag] Kurdistan, we may be able to sway their people to finally join us hand in hand in this movement."
 IRQ_request_an_election: "Solicitar uma Eleição"
 IRQ_request_an_election_desc: "Ao pressionar o atual governo Curdo [KUR.GetFlag] a realizar uma eleição, os comunistas Curdos [KUR.GetFlag] podem finalmente ter uma oportunidade de ganhar seu assento legítimo."
 IRQ_rojava_shipments: "Iniciar Envios para [ROJ.GetFlag] Rojava"
 IRQ_rojava_shipments_desc: "O governo Sírio [SYR.GetFlag] historicamente reprimiu os Curdos na região de [ROJ.GetFlag] Rojava, e devemos encontrar maneiras de libertar esses povos dando-lhes o apoio necessário quando possível."
 IRQ_shipping_to_rojava: "Envios em Andamento..."
 IRQ_shipping_to_rojava_desc: "As rodas dos caminhões de carga giram e giram no solo Sírio."
 IRQ_political_decisions: "Política Doméstica Iraquiana"
 IRQ_recall_nsa_bahrain: "Recall da NSA Bahrain"
 IRQ_recall_nsa_bahrain_desc: "Já passou da hora de tomarmos e consolidarmos nosso controle sobre a NSA Bahrain, um terreno ocupado pelos Americanos!"
 IRQ_mek_revolt_trig: "A Revolta"
 IRQ_mek_revolt_trig_desc: "Hoje, podemos contar com nossos amigos no MEK para lançar uma incursão transfronteiriça no Irã e derrubar o regime dos Mulás de uma vez por todas!"
 IRQ_the_blood_quran: "Concluir o 'Corão de Sangue'"
 IRQ_the_blood_quran_desc: "Ao concluir e anunciar o Corão de Sangue, escrito com o sangue de Saddam Hussein, nosso governo poderá tentar demonstrar sua piedade entre o povo iraquiano [IRQ.GetFlag], mas também pode ter consequências negativas..."
 IRQ_smuggle_goods_from_jordan: "Contrabandear Mercadorias de [JOR.GetFlag] Jordânia"
 IRQ_smuggle_goods_from_jordan_desc: "A família Hussein tem muitas conexões com certos indivíduos na [JOR.GetFlag] Jordânia, e usando essas conexões podemos contrabandear alguns bens pela fronteira sem que o governo perceba."
 IRQ_al_salam_palace: "Redesign do Palácio Al-Salam"
 IRQ_al_salam_palace_desc: "The Al-Salam Palace was initially designed in 1950, more than 50 years ago, and since then the palace has begun showing its age. Redesigning certain aspects of it could be useful in helping [IRQ.GetLeader] clear his mind when he needs to."
 IRQ_arrest_muqtada: "Prender Muqtada al-Sadr"
 IRQ_arrest_muqtada_desc: "That cockroach Muqtada has been running his mouth recently, and just like his father, we might need to find a solution."
 IRQ_civil_war_mechanic: "Crise da Insurgência"
 IRQ_civil_war_mechanic_desc: "O colapso do §HRegime de Saddam§! levou ao colapso total do Exército Iraquiano. Muitos dos nossos §Hex-servicemen§! dedicaram suas vidas à luta §Rcontra§! nosso estado, seja por suas próprias organizações ou §RJihadistas§!. Inicialmente, estaremos em conflito com os §RSalafistas§!, mas os §HShiitas§! podem rapidamente se tornar hostis se não os aliarmos. Precisaremos atacar os insurgentes em cada estado até que eles §HSurrenderam§! quando estiverem fracos o suficiente. Nossa §HProntidão§! determinará o sucesso que teremos em operações. A §HProntidão§! melhorará à medida que realizarmos mais operações ou tomarmos certos focos.\n\nPodemos fazer operações clicando no estado. Perderemos §HEquipamentos§! e §HPessoal§! em cada operação que realizarmos.\n\nO mapa mudará §Hdinamicamente§! de cor para exibir nosso §HProgresso§!.\n\n§pRoxo§! - Forças Curdas\n§RVermelho§! - Forças Jihadistas Salafistas\n§YAmarelo§! - Forças Shiitas\n§OLaranja§! - Insurgência Média\n§GVerde§! - Insurgência Baixa\n\n§HProntidão§!: [?IRQ_government_readiness]%\n§HPessoal§!: [?IRQ_government_troops]\n§HEstados Seguros§!: [?IRQ_variable_for_win]\n\n\n\n\n\n"
 IRQ_start_negotiations_shias: "Iniciar Negociações com Milícias Shiitas"
 IRQ_start_negotiations_shias_desc: "Iremos à mesa de negociações com as muitas Milícias Shiitas que se formaram para chegar a um acordo para destruir nosso inimigo comum. Se não conseguirmos trazê-los para o nosso lado rápido o suficiente, eles podem se tornar hostis!"
 IRQ_request_coalition_forces: "Solicitar Apoio Aéreo"
 IRQ_request_coalition_forces_desc: "Se a Força Aérea não faz nada o dia todo, por que estamos pagando pelos pilotos? Precisamos usar nossa vantagem nos céus para esmagar os insurgentes até a submissão."
 IRQ_request_awakening_council_militias: "Fomentar Conversas para Al-Sahwah"
 IRQ_request_awakening_council_militias_desc: "Al-Sahwa, ou os Filhos do Iraque, são uma aliança proposta entre tribos sunitas e outros grupos para lutar contra os insurgentes. Podemos incorporar suas forças para termos uma vantagem numérica sobre os insurgentes."
 IRQ_militarize_police_force: "Militarizar a Força Policial"
 IRQ_militarize_police_force_desc: "Iremos confiscar armas e mão-de-obra da força policial e os incorporaremos em nosso exército para ajudar a combater os insurgentes, mesmo que tenhamos que cortar custos na formação deles."
 IRQ_recruitment_campaign: "Esforço de Treinamento"
 IRQ_recruitment_campaign_desc: "Devemos treinar e condicionar nossos homens para lidar de forma segura e eficiente com os insurgentes. Fazendo isso, também colocaremos menos vidas em risco."
 IRQ_iraq_war: "A Luta pela Sobrevivência"
 IRQ_iraq_war_desc: "The war for Iraq and its lands has begun. The United States will have a maximum of 6 months to capitulate the Iraqi government, or else they will have to order an immediate withdrawal from the nation and risk their influence."
 IRQ_war_phase_one: "Fase I"
 IRQ_war_phase_two: "Fase II"
 IRQ_war_phase_two_desc: "Os americanos vão vacilar, seus esforços serão em vão!"
 IRQ_preparation_for_the_war: "A Guerra"
 IRQ_preparation_for_the_war_desc: "Esses imperialistas nos [USA.GetFlag] §H[USA.GetName]§! começaram uma campanha §RInjustificada§! contra nossa nação!\n\nTeremos que reunir nossa Força Nacional e Recursos, e §HPreparar para uma Guerra de Sobrevivência§!. Usando o que temos e a Experiência da §HGerra do Irã§! e da §HGerra do Golfo§!, criaremos um verdadeiro Inferno para qualquer invasor que chegar.\n\nSe conseguirmos resistir aos americanos por §Hpelo menos 6 meses§!, a pressão de sua população os obrigará a um §Hcessar-fogo§! devido à impopularidade da guerra!"
 IRQ_threaten_kuwait: "Ameaçar [KUW.GetFlag] Kuwait"
 IRQ_threaten_kuwait_desc: "The Americans have a base right under our nose, and the Kuwaitis are at fault for this. We will demand that they swiftly take control so that the Americans cannot attack us from Middle Eastern lands."
 IRQ_restore_the_iron_ring: "Restaurar o Anel de Ferro"
 IRQ_restore_the_iron_ring_desc: "O Anel de Ferro provou ser útil na defesa contra os iranianos na Guerra Irã-Iraque nos anos 80. Devemos rapidamente colocá-lo de volta junto."
 IRQ_golden_guard_divisions: "Formar Divisões da Guarda Dourada"
 IRQ_golden_guard_divisions_desc: "Mobilizaremos algumas divisões da Guarda Dourada para defender nossa nação, e as treinaremos ao máximo possível."
 IRQ_conscription_in_schools: "Conscrição nas Escolas"
 IRQ_conscription_in_schools_desc: "We absolutely must get more manpower to field our units in the time of war, and schools are a perfect location for this very reason. They can get an education later."
 IRQ_kurdish_compromise: "Compromisso Curdo [KUR.GetFlag]"
 IRQ_kurdish_compromise_desc: "We will come to an agreement with the [KUR.GetFlag] Kurds, and secure our northern front from any sudden attacks if they accept, that is."
 IRQ_faddayean_saddam: "Mobilizar a Fedayeen Saddam"
 IRQ_faddayean_saddam_desc: "We need to prepare the Fedayeen Saddam for the incoming invasion, and by all means we must equip and train more divisions to continue the fight no matter what."
 IRQ_weapons_concealment: "Intensificar Programa de Mísseis"
 IRQ_weapons_concealment_desc: "Precisamos intensificar rapidamente nosso programa de mísseis para devastar o inimigo de longe, se necessário."
 IRQ_contract_the_MEK: "Contratar o £PER_anarchist_communism MEK"
 IRQ_contract_the_MEK_desc: "Mojahedin-e Khalq, or the £PER_anarchist_communism MEK have been residing in our country for a very long time. It is about time that we have them do something actually useful for our nation."
 IRQ_economic_union_menu: "União da Prosperidade Islâmica"
 IRQ_invite_to_economic_union_targeted_decision: "Invite [FROM.GetName]"
 IRQ_kick_from_economic_union_targeted_decision: "Expulsar [FROM.GetName]"
 IRQ_the_constitution: "A Constituição Iraquiana"
 IRQ_the_constitution_desc: "Following the overthrow of §YSaddam Hussein§!, and the subsequent §YBa'athist§! Party, our nation has been tasked with §YDrafting a new constitution§! for a more §YDemocratic, and Free Iraq§!. Each §YArticle§! of the §YConstitution§! that we draft will have an §YImpact§! on the future of which political parties can be elected, and who could be in politics."
 IRQ_constitution_draft_government_type: "Artigo I: O Governo do Iraque"
 IRQ_constitution_draft_government_type_desc: "Nossa constituição deve especificar se nossa nação será uma República Islâmica ou uma Secular."
 IRQ_constitution_draft_languages: "Artigo II: A Língua do Iraque"
 IRQ_constitution_draft_languages_desc: "A língua é o que une nosso povo, e uma grande parcela fala outra língua que não o árabe. Precisamos decidir se permitiremos ou não outras línguas como línguas de estado."
 IRQ_constitution_draft_nationalism: "Artigo III: Patriotismo no Iraque"
 IRQ_constitution_draft_nationalism_desc: "Como demonstrado pela história, o hiper nacionalismo e o patriotismo levaram à queda de nossa nação. Devemos esclarecer isso no Artigo III."
 IRQ_constitution_draft_democratic_form: "Artigo IV: Federalização do Iraque"
 IRQ_constitution_draft_democratic_form_desc: "Nossa nação é composta por muitos grupos étnicos diferentes, incluindo curdos, assírios, turcomenos e muitos outros. Também temos uma divisão importante entre seitas religiosas, especificamente entre xiitas e sunitas. Tudo isso deve ser abordado em nossa constituição."
 IRQ_constitution_draft_militias: "Artigo V: A Segurança do Iraque"
 IRQ_constitution_draft_militias_desc: "Apesar de nossa nação ter Forças Armadas, muitas pessoas não confiam no governo para mantê-las seguras e, por isso, formaram milícias. Devemos esclarecer se essas milícias são legais ou não."
 IRQ_constitution_draft_identity: "Artigo VI: A Identidade do Iraque"
 IRQ_constitution_draft_identity_desc: "Muitos povos compõem o Iraque, e devemos esclarecer se o Iraque adotará uma identidade árabe ou multicultural."
 IRQ_black_gold_decisions: "Ouro Negro"
 IRQ_black_gold_decisions_desc: "Part of our post-victory plan is to secure economic domination in the region. Through the exploitation of corruption amongst the Southern Khaleeji states, we are able to slowly increase our grip over their most precious resource, oil. We will need to increase our influence in these nations in order to gain access to new decisions (such as buying up more shares) that will allow us to get one step closer to seizing these precious resources. Once we get more than 50% control over Aramco, we will be able to make an attempt to seize the company. The higher the control we have, the higher the chance of success will be.\n\n[SAU.GetFlag] Aramco Control: [?IRQ_aramco_control]/100"
 IRQ_open_aramco_scheme: "Abrir Decisões do Esquema Aramco [SAU.GetFlag]"
 IRQ_close_aramco_scheme: "Fechar Decisões do Esquema Aramco [SAU.GetFlag]"
 IRQ_find_dirt_on_saudi_king: "Descobrir Segredos sobre [SAU.GetLeader]"
 IRQ_find_dirt_on_saudi_king_desc: "O primeiro passo para colocar as mãos nas ações da Aramco será encontrar algo para chantagear [SAU.GetFlag] [SAU.GetLeader]."
 IRQ_establish_the_hussein_fund: "Estabelecer o Fundo Hussein"
 IRQ_establish_the_hussein_fund_desc: "Ao estabelecer o Fundo Hussein, poderemos canalizar dinheiro para as ações da Aramco através da organização sem chamar muita atenção para isso."
 IRQ_buy_shares_of_aramco: "Comprar Ações"
 IRQ_buy_shares_of_aramco_desc: "Podemos comprar uma pequena quantidade de ações na Aramco agora que temos o Fundo Hussein, permitindo-nos comprar quantidades maiores após este investimento inicial."
 IRQ_prop_up_iraqi_ceo: "Apoiar um CEO Iraquiano"
 IRQ_prop_up_iraqi_ceo_desc: "Ao manipular algumas situações, podemos apoiar um CEO iraquiano como o novo CEO da Aramco, aumentando nosso controle sobre a empresa."
 IRQ_seize_aramco: "Apreender Aramco"
 IRQ_seize_aramco_desc: "Chegou a hora, devemos iniciar nossa tomada agressiva da empresa para garantir os recursos preciosos em [SAU.GetFlag] [SAU.GetName]!"
 IRQ_send_over_iraqis_to_saudi_arabia: "Send over [IRQ.GetFlag] Iraqis to [SAU.GetFlag] [SAU.GetName]"
 IRQ_send_over_iraqis_to_saudi_arabia_desc: "By paying for the flights of thousands of [IRQ.GetFlag] Iraqis, we are able to ensure proper [IRQ.GetFlag] Iraqi influence in [SAU.GetFlag] [SAU.GetName]."
 IRQ_encourage_iraqis_to_work_for_aramco: "Encourage [IRQ.GetFlag] Iraqis to Work for [SAU.GetFlag] Aramco"
 IRQ_encourage_iraqis_to_work_for_aramco_desc: "Como resultado das pessoas que enviamos para [SAU.GetName], podemos fazer com que trabalhem para a Aramco a fim de estabelecer conexões potenciais dentro da empresa."
 IRQ_buy_more_shares: "Comprar Mais Ações"
 IRQ_buy_more_shares_desc: "Podemos aumentar nosso controle sobre a Aramco comprando mais ações da empresa através do Fundo Hussein."
 IRQ_regional_baathism_decisions: "Baathismo Regional"
 IRQ_regional_baathism_decisions_desc: "Nossa facção tem apoiadores em toda a região e no mundo. Ao reunir os seguidores da ideologia baathista, podemos criar uma rede de comandos regionais que controlamos. Colocando oficiais iraquianos de alto escalão e leais como seus líderes, podemos garantir total lealdade desses estados."
 IRQ_appoint_control_syria: "Estabelecer Comando Regional Sírio"
 IRQ_appoint_control_egypt: "Establish the £IRQ_Nat_Autocracy_small [EBP.GetFlag] Egyptian Regional Command"
 IRQ_appoint_control_jordan: "Establish the £IRQ_Nat_Autocracy_small [JBP.GetFlag] Jordanian Regional Command"
 IRQ_clergy_balance_of_power_category: "Return to Faith Campaign"
 IRQ_secularists_bop_mid_range: "Entre Islamismo e Secularismo"
 IRQ_secularists_bop_left_win_range: "Estado Secularizado"
 IRQ_secularists_bop_left_advanced_range: "Sociedade Altamente Secular"
 IRQ_secularists_bop_left_medium_range: "Crescimento do Liberalismo na Sociedade"
 IRQ_secularists_bop_left_low_range: "Sociedade Moderadamente Secular"
 IRQ_clergy_bop_right_win_range: "Estado Sharia"
 IRQ_clergy_bop_right_advanced_range: "Sociedade Islâmica"
 IRQ_clergy_bop_right_medium_range: "Ressurgimento dos Ideais Islâmicos"
 IRQ_clergy_bop_right_low_range: "Sociedade Islâmica Moderada"
 IRQ_promote_female_participation: "Promoção da Participação Feminina"
 IRQ_promote_female_participation_desc: "Vamos incentivar nossas mulheres a participar da sociedade e serem uma parte vital da força de trabalho."
 IRQ_promotion_of_iraqi_identity: "Promoção da Identidade Iraquiana"
 IRQ_promotion_of_iraqi_identity_desc: "Our people must know who they are, and their history, culture, and language are a part of their identity that must be reinforced."
 IRQ_restoration_of_ancient_sights: "Renovation of Historical Sites"
 IRQ_restoration_of_ancient_sights_desc: "Nosso passado é uma parte muito crucial de nossa nação, pois nossas pessoas devem perceber a grandeza que alcançaram antes e a grandeza pela qual devem lutar mais uma vez."
 IRQ_promotion_of_saddam: "Promoção das Conquistas do Ba'ath"
 IRQ_promotion_of_saddam_desc: "Em cada rua, casa, escritório e escola, deve haver um retrato do maior líder na história do Ba'ath. Nossas pessoas devem saber quem construiu esta nação e a quem agradecer."
 IRQ_power_of_mosques: "Expandir o Poder da Mesquita"
 IRQ_power_of_mosques_desc: "As mesquitas detêm o poder nesta nação, e devemos aceitar isso. Ao expandir seu poder, podemos mostrar que estamos ao seu lado."
 IRQ_crack_down_on_haram: "Combater Atividades Imorais"
 IRQ_crack_down_on_haram_desc: "Nossa sociedade não deve ser corrompida pelo disfarce do imperialismo ocidental. Devemos lutar contra essas infiltrações na sociedade iraquiana por todos os meios possíveis."
 IRQ_upholding_sharia: "Manter a Sharia"
 IRQ_upholding_sharia_desc: "A lei da terra é a Sharia, e é nosso dever mantê-la no caso de alguns malfeitores desejarem contornar as normas sociais."
 IRQ_clergy_right_side: "Islamistas"
 IRQ_secularists_bop_left_side: "Secularistas"
 IRQ_debaath_balance_of_power_category: "£IRQ_Nat_Autocracy_small De-Ba'athification of [IRQ.GetFlag] Iraq"
 IRQ_baathists_bop_right_low_range: "Círculos Ba'athistas"
 IRQ_baathists_bop_right_medium_range: "Demonstrações Ba'athistas"
 IRQ_baathists_bop_right_advanced_range: "Ressurgimento Ba'athista"
 IRQ_baathists_bop_right_win_range: "Golpe Ba'athista"
 IRQ_antibaathists_bop_left_low_range: "De-Ba'athificação do Governo"
 IRQ_antibaathists_bop_left_medium_range: "Perseguição aos Ba'athistas"
 IRQ_antibaathists_bop_left_advanced_range: "De-Ba'athificação da Vida Diária"
 IRQ_antibaathists_bop_left_win_range: "Fim do Ba'athismo no Iraque"
 IRQ_antibaathists_bop_mid_range: "Governo Vulnerável"
 IRQ_antibaathists_bop_left_side: "Anti-Ba'athistas"
 IRQ_baathists_right_side: "Ba'athistas"
 IRQ_anti_baath_sentiment_schools: "Sentimento Anti-Ba'athista nas Escolas"
 IRQ_anti_baath_sentiment_schools_desc: "Os Husseins fizeram um estrago no sistema educacional iraquiano enquanto estiveram no poder, apodrecendo as mentes de todos os que frequentavam as escolas com propaganda governamental. Precisamos garantir que o dano seja reparado, e nossos estudantes percebam os verdadeiros horrores dos ba'athistas."
 IRQ_anti_baath_ad_campaigns: "Campanha Anti-Ba'athista na Televisão"
 IRQ_anti_baath_ad_campaigns_desc: "The Iraqi populace spends a lot of their time on their couches, watching television either alone or with their families. We need to make sure that in between their shows, they don't forget about the atrocities committed by the Ba'athists."
 IRQ_persecute_potential_baathists: "Investigar Potenciais Ba'athistas"
 IRQ_persecute_potential_baathists_desc: "Ainda existem muitos simpatizantes ba'athistas na sociedade iraquiana que escaparam pelos rachaduras de nossa sociedade. Lançar uma investigação contra esses tolos será benéfico."
 IRQ_sunni_in_politics: "Terremoto Sectário"
 IRQ_sunni_in_politics_desc: "Our government will need to manage 3 factors regarding the Sunnis in the nation, §HSatisfaction§!, §HRadicalization§!, and §HPolitical Influence§!\n\nSatisfaction will determine the Sunnis' overall happiness with the government's decision making. If Sunni §HSatisfaction§! is lower than §H30/50§!, then §HRadicalization§! will start gradually increasing. Lower §HSatisfaction§! will also exponentially increase the rate of §HRadicalization§! anytime it increases (Will begin to multiply).\n\n§HRadicalization§! will be the frequency that Iraqi Sunnis join extremist groups, as well as how politically active they will be. Anytime the §HRadicalization§! amongst the Sunnis increases, they will become more politically active and will have a higher §HPolitical Influence§!.\n\n§HPolitical Influence§! will determine the growth in Sunni-led political parties within our nation. There is also a random chance that our Sunni Generals will launch a coup if Sunni §HPolitical Influence§! and §HRadicalization§! is high.\n\nSunni Satisfaction: §H[?IRQ_sunni_satisfaction]/50§!\nSunni Radicalization: §H[?IRQ_sunni_radicalization]/75§!\nSunni Political Influence: §H[?IRQ_sunni_political_influence]/100§!"
 IRQ_satisfy_sunnis: "Satisfazer as Necessidades dos Sunitas"
 IRQ_satisfy_sunnis_desc: "In order to get on the good side of our Sunnis, we are going to have to direct more resources in developing their standard of living, and giving them a greater voice in our government which is primarily led by Shi'ite individuals."
 IRQ_redirect_sunni_resources: "Redirecionar Recursos Sunitas"
 IRQ_redirect_sunni_resources_desc: "As comunidades sunitas certamente não se importariam em ter menos recursos, especialmente porque nosso governo certamente poderia usar esses recursos vitais."
 IRQ_make_a_promise: "Fazer uma Promessa"
 IRQ_make_a_promise_desc: "Devido à baixa satisfação entre a população sunita, podemos fazer uma promessa que nos dará a chance de provar que nosso governo é digno de cumprir nossas obrigações.\n§W-----------------------------------------------------------------§!\nEsta decisão estará disponível novamente após 180 dias."
 IRQ_resolve_the_crisis: "Resolver a Crise"
 IRQ_resolve_the_crisis_desc: "The time has come for us to resolve the sectarian earthquake that has rocked our nation."
 IRQ_lower_iranian_influence_1: "Combater a Influência [PER.GetFlag] Iraniana"
 IRQ_lower_iranian_influence_1_desc: "We have promised our Sunnis that we will lower Iranian influence."
 IRQ_anbar_infrastructure: "Melhorar a Infraestrutura em Anbar"
 IRQ_anbar_infrastructure_desc: "Prometemos melhorar a infraestrutura em Anbar."
 IRQ_salahuddin_infrastructure: "Melhorar a Infraestrutura em Salahuddin"
 IRQ_salahuddin_infrastructure_desc: "Prometemos melhorar a infraestrutura em Salahuddin."
 IRQ_nineveh_infrastructure: "Melhorar a Infraestrutura em Nineveh"
 IRQ_nineveh_infrastructure_desc: "Prometemos melhorar a infraestrutura em Nineveh."
 IRQ_anbar_airbase: "Melhorar Aeroportos em Anbar"
 IRQ_anbar_airbase_desc: "Prometemos melhorar os aeroportos localizados em Anbar."
 IRQ_salahuddin_airbase: "Melhorar Aeroportos em Salahuddin"
 IRQ_salahuddin_airbase_desc: "Prometemos melhorar os aeroportos localizados em Salahuddin."
 IRQ_nineveh_airbase: "Melhorar Aeroportos em Nineveh"
 IRQ_nineveh_airbase_desc: "Prometemos melhorar os aeroportos localizados em Nineveh."
 IRQ_economic_prosperity: "Melhorar a Situação Econômica"
 IRQ_economic_prosperity_desc: "Prometemos melhorar a situação econômica no Iraque."
 IRQ_smaller_government: "Limit the Government's Reach"
 IRQ_smaller_government_desc: "Prometemos garantir que o governo desempenhe um papel menor na sociedade iraquiana."
 IRQ_sunni_internet: "Melhorar Infraestrutura de Internet"
 IRQ_sunni_internet_desc: "We've promised to improve internet infrastructure in the Western Regions populated by Sunnis."
 IRQ_pmf_decisions: "Forças de Mobilização Popular"
 IRQ_pmf_decisions_desc: "The §HPMF§!, or §HPopular Mobilization Forces§! are a series of §HMilitias§! that have banded together to form an umbrella group for the security of the nation. We are able to §HMobilize§! these §HMilitias§! at a cost in order to prepare for a war against our enemies. Total mobilization could take years, however we are able to deploy the §HPMF§! at any time relative to the mobilization rate.\n\nWhile the §HPMF§! is deployed, we will suffer from §Rincreased troop up-keep§!, but we are able to §HDemobilize§! them in order to save our budget.\n\nIf we are at war, mobilization will progress §HDouble§! its standard rate monthly."
 IRQ_begin_mobilization: "Iniciar Mobilização"
 IRQ_begin_mobilization_desc: "Ao mobilizar as PMF, teremos a quantidade necessária de forças à nossa disposição para enfrentar qualquer ameaça na região."
 IRQ_stop_mobilization: "Encerrar Mobilização"
 IRQ_stop_mobilization_desc: "Manter a mobilização das PMF é uma tarefa custosa e, para salvar nossa nação do colapso econômico, é necessário encerrar a mobilização das PMF."
 IRQ_deploy_the_pmf: "Implantar as PMF"
 IRQ_demobilize_the_pmf: "Desmobilizar as PMF"
 IRQ_demobilize_the_pmf_desc: "Já está na hora de desmobilizar as PMF, pois sua assistência não é mais útil para nossas forças armadas."
 IRQ_spring_of_islam: "A Primavera do Islã"
 IRQ_spring_of_islam_desc: "In order to expand the reach of our alliance and ideology, we will need to export §HShi'ite Revolutions§! in nations with some semblance of §HShi'ite Movements§!. We will disguise the movements as Islamic in nature, but will have them spearheaded by §HShi'ite§! leaders and groups to ensure that there is no hijacking of our influence. We will expand our influence within the nations in order to influence their §HMilitaries and Governmental Bodies§! to win them over when the revolution comes. The first stage will be arming and funding the rebels, which will then allow us to give them the greenlight to start their §HRevolution§!.\n"
 IRQ_arm_rebels_in_jordan: "Armar Rebeldes em [JOR.GetFlag] Jordan"
 IRQ_arm_rebels_in_jordan_desc: "We can fund, train, and arm Shi'ites in [JOR.GetFlag] Jordan and prepare them to overthrow the [JOR.GetFlag] Jordanian government in order to install an Islamic Republic."
 IRQ_islamic_spring_in_jordan: "Primavera Islâmica em [JOR.GetFlag] Jordan"
 IRQ_islamic_spring_in_jordan_desc: "Chegou a hora, nossos parceiros [JOR.GetFlag] Jordanianos estão prontos para iniciar sua Revolução Islâmica!"
 IRQ_arm_rebels_in_kuwait: "Armar Rebeldes em [KUW.GetFlag] Kuwait"
 IRQ_arm_rebels_in_kuwait_desc: "We can fund, train, and arm Shi'ites in [KUW.GetFlag] Kuwait and prepare them to overthrow the [KUW.GetFlag] Kuwaiti government in order to install an Islamic Republic."
 IRQ_islamic_spring_in_kuwait: "Islamic Spring in [KUW.GetFlag] Kuwait"
 IRQ_islamic_spring_in_kuwait_desc: "Chegou a hora, nossos parceiros [KUW.GetFlag] Kuwaitianos estão prontos para iniciar sua Revolução Islâmica!"
 IRQ_arm_rebels_in_turkey: "Armar Rebeldes em [TUR.GetFlag] Turkey"
 IRQ_arm_rebels_in_turkey_desc: "We can fund, train, and arm Shi'ites in [TUR.GetFlag] Turkey and prepare them to overthrow the [TUR.GetFlag] Turkish government in order to install an Islamic Republic."
 IRQ_islamic_spring_in_turkey: "Primavera Islâmica em [TUR.GetFlag] Turkey"
 IRQ_islamic_spring_in_turkey_desc: "Chegou a hora, nossos parceiros [TUR.GetFlag] Turcos estão prontos para iniciar sua Revolução Islâmica!"
 IRQ_arm_rebels_in_afghanistan: "Armar Rebeldes em [AFG.GetFlag] Afghanistan"
