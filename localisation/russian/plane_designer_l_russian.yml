 tech_air_hypersonic_engine_upgrade_1: "Модернизация гиперзвукового двигателя"
 tech_air_hypersonic_engine_upgrade_1_desc: "Усовершенствованные высокотемпературные материалы, улучшенная геометрия впускного отверстия и более рациональное управление расходом топлива ускоряют гиперзвуковую двигательную установку от экспериментальных импульсов к воспроизводимым эксплуатационным характеристикам. Модернизация повышает устойчивую скорость и эффективность на большой высоте, усложняя перехват и делая время нанесения удара гораздо менее предсказуемым."
 tech_air_anti_ship_drone_1: "Противокорабельные ударные беспилотники II"
 tech_air_anti_ship_drone_1_desc: "Ранние противокорабельные беспилотники воздушного базирования обеспечивают более дешевый способ угрожать надводным судам за счет точного наведения и применения в условиях противостояния. Они расширяют радиус действия морской авиации и позволяют наносить массированные удары, которые вынуждают вражеские флоты тратить дорогостоящие перехватчики."
 tech_air_anti_ship_drone_2: "Противокорабельные ударные беспилотники III"
 tech_air_anti_ship_drone_2_desc: "Улучшенные прицеливающиеся устройства и каналы передачи данных позволяют лучше распознавать цели, обновлять информацию в середине курса и повторно атаковать уклоняющиеся корабли. Обладая увеличенной дальностью полёта и живучестью, эти беспилотники могут использовать бреши в противовоздушной обороне и оказывать давление на оперативные группы за пределами береговой линии."
 tech_air_anti_ship_drone_3: "Противокорабельные ударные беспилотники IV"
 tech_air_anti_ship_drone_3_desc: "Сетевые ударные дроны могут координировать углы захода на посадку, обмениваться данными о целеуказании и выполнять интенсивные атаки, направленные на преодоление многоуровневой обороны. Усовершенствованное наведение и электронное противодействие обеспечивают их эффективность в условиях постановки помех, превращая массовость в надёжный ударный потенциал флота."
 air_tech_gunship_railgun_1: "Ганшипы с рельсотронами II"
 air_tech_gunship_railgun_1_desc: "Ранняя интеграция рельсотрона на ганшипе концентрирует огромную огневую мощь прямой наводки на устойчивой воздушной платформе, позволяя быстро уничтожать беспилотники, самолёты и наземные цели в пределах прямой видимости. Концепция чрезвычайно эффективна, но требует высокой выработки электроэнергии, интенсивного охлаждения и дорогостоящих материалов."
 air_tech_gunship_railgun_2: "Ганшипы с рельсотронами III"
 air_tech_gunship_railgun_2_desc: "Улучшенные конденсаторы, система управления отдачей и управление огнем позволяют боевым кораблям с рельсотронами поддерживать более высокую скорострельность без существенного износа. Улучшенное объединение датчиков сокращает время передачи данных о цели и повышает точность, что делает эти самолеты надежными уничтожителями на поле боя, а не нишевыми экспонатами."
 air_tech_gunship_railgun_3: "Ганшипы с рельсотронами IV"
 air_tech_gunship_railgun_3_desc: "Конструкции нового поколения оптимизируют энергоэффективность и термостабильность, а также повышают устойчивость к наведению на цель и радиоэлектронной борьбе. Это превращает боевые корабли с рельсотронами в устойчивые платформы с высокой смертоносностью, способные выживать в оспариваемом воздушном пространстве и демонтировать многоуровневую оборону по цене, которую могут оправдать только крупные державы."
 air_tech_railgun_cannons_1: "Бортовые рельсотронные пушки II"
 air_tech_railgun_cannons_1_desc: "Миниатюрные системы питания и усиленные крепления делают рельсотроны пригодными для применения в самолетах с высокими характеристиками, обеспечивая экстремальную начальную скорость и более плоскую геометрию поражения, чем обычные пушки. Результатом является более высокая летальность при коротких окнах, но с затратами на тепло, энергопотребление и сложное техническое обслуживание."
 air_tech_railgun_cannons_2: "Бортовые рельсотронные пушки III"
 air_tech_railgun_cannons_2_desc: "Бортовые рельсотроны третьего поколения увеличивают ресурс ствола, цикличность работы конденсатора и интегрируют систему управления огнем, обеспечивая длительные очереди без существенного износа. Благодаря улучшенному управлению температурой и более продуманному наведению на цель эти пушки становятся практичным решением для уничтожения самолетов, беспилотных летательных аппаратов и даже отдельных ракетных угроз с близкого расстояния."
 air_tech_pdl_1: "Бортовые лазеры ближней обороны II"
 air_tech_pdl_1_desc: "Компактные лазерные излучатели и улучшенное сопровождение позволяют самолетам поражать приближающиеся ракеты с близкого расстояния, ухудшая самонаведение и поверхности управления перед столкновением. Эти системы не заменяют маневр и контрмеры, но они добавляют новый защитный слой, когда секунды решают выживание."
 air_tech_pdl_2: "Бортовые лазеры ближней обороны III"
 air_tech_pdl_2_desc: "Более высокая мощность луча и улучшенное управление температурой обеспечивают более длинные окна для стрельбы и более надежное уничтожение современных систем самонаведения ракет. Интегрированная подача сигналов от встроенных датчиков сокращает время реакции и повышает эффективность в сложных, высокоскоростных боях."
 air_tech_pdl_3: "Бортовые лазеры ближней обороны IV"
 air_tech_pdl_3_desc: "Бортовая лазерная защита следующего поколения сочетает в себе гибкое управление лучом, закаленную оптику и автоматизированное определение приоритетов угроз для противодействия залповым атакам и скоплениям дронов. Благодаря более мощному резервированию мощности и интеграции средств радиоэлектронной борьбы самолеты могут оставаться живучими даже при интенсивном ракетном давлении."
 air_module_railgun_gunship_1: "Рельсотронный пакет ганшипа I"
 air_module_railgun_gunship_1_desc: "Специальная конфигурация боевого корабля, построенная на мощных установках рельсотронов, предназначена для поражения самолетов, беспилотных летательных аппаратов и наземных целей жестокой прямой наводкой. Это разрушительно, когда достигается заданное время, но его производство и обслуживание чрезвычайно дороги из-за требований к энергопотреблению, управлению теплом и современных материалов."
 air_module_railgun_gunship_2: "Рельсотронный пакет ганшипа II"
 air_module_railgun_gunship_2_desc: "$air_module_railgun_gunship_1_desc$"
 air_module_railgun_gunship_3: "Рельсотронный пакет ганшипа III"
 air_module_railgun_gunship_3_desc: "$air_module_railgun_gunship_1_desc$"
 air_module_railgun_gunship_4: "Рельсотронный пакет ганшипа IV"
