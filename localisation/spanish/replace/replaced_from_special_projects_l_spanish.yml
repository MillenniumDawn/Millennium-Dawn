 sp_air_autonomous_computers_reward_improved_detection: "Sistemas de Navegación y Detección Mejorados"
 sp_air_autonomous_computers_reward_improved_detection_desc: "Con la ayuda de datos y aprendizaje automático, podemos dirigir los sistemas dentro de nuestros cazas para evitar amenazas y localizar objetivos con mayor precisión."
 sp_air_autonomous_bombers_reward_improved_detection: "Autonomía y Toma de Decisiones Mejoradas"
 sp_air_autonomous_bombers_reward_improved_detection_desc: "El desarrollo de bombarderos autónomos ayudará en situaciones de alta intensidad, reduciendo la necesidad de debate y planificación entre los planificadores y tomadores de decisiones sobre qué objetivos son hostiles."
