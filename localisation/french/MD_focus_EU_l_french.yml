 EU_news.43.d: "[FROM.GetFlag] [FROM.GetNameDefCap] a lancé une campagne d'euroscepticisme. Ce fut un succès ! L'euroscepticisme augmente de 5 % pour [ROOT.GetFlag] [ROOT.GetNameDef]."
