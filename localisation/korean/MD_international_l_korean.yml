 CT_CUR_FOREIGN: "§Y외국 고문§!"
 CT_CUR_FOREIGN_TT: "이 수치는 우리의 대테러 작전을 돕기 위해 고문을 파견한 국가의 수를 나타냅니다. 고문을 파견하는 국가마다 우리의 §Y정보 정확도§! 변동치가 §G1%§! 증가하여 §Y정보 정확도§!가 향상됩니다. 또한 우리나라에 §Y외국 고문§!을 둔 국가는 우리나라 안에서의 작전이 향상됩니다."
 CT_SYS_DESC: "§Y대테러 체계§!는 세계 정세에 따라 테러 조직의 위협이 증가할지, 그리고 정보기관에 얼마나 드러날지가 결정되는 방식으로 작동합니다. §R테러 위협 수준§!이 올라갈수록 해당 조직의 공격 빈도와 강도가 증가합니다. 세계 긴장도, 국가의 만족도, 플레이어의 행동이 §R테러 위협 수준§!을 높이거나 낮출 수 있습니다. 이 수치는 매월 또는 주요 행동 이후에 갱신됩니다.\n\n플레이어는 첩보 체계와 이 메뉴의 행동을 통해 정보 수집 작전을 수행하고, 습격 체계를 통해 습격을 수행하여 정보를 수집하고 §R테러 위협 수준§!을 낮출 수 있습니다. §Y정보 정확도§!가 올라갈수록 테러 조직을 더욱 구체적으로 겨냥할 수 있으며, 결국 본부를 습격하여 위협을 제거할 수 있게 됩니다."
