 alg_promote_arabization: "Promover a Arabização"
 alg_promote_arabization_desc: "Fortalecer a unidade nacional reforçando a identidade árabe. Isso estabilizará o país, mas irritará os cabilas e os mozabitas."
 alg_recognize_tamazight: "Reconhecer a Língua Tamazight"
 alg_recognize_tamazight_desc: "Conceder reconhecimento oficial à língua tamazight, satisfazendo os cabilas, mas irritando os nacionalistas árabes."
 alg_ethnicity.100.t: "Protestos Cabilas"
 alg_ethnicity.100.d: "A frustração na Cabília transbordou em protestos que exigem direitos culturais e autonomia. O governo deve decidir se os reprime ou faz concessões."
 alg_ethnicity.100.a: "Reprimir os Protestos"
 alg_ethnicity.100.b: "Fazer Concessões"
 alg_ethnicity.200.t: "Crise na Cabília"
 alg_ethnicity.200.d: "A agitação cabila chegou ao ponto de ruptura. O Movimento pela Autodeterminação da Cabília pede abertamente a independência, a gendarmaria perdeu o controle de Tizi Ouzou e os comitês de aldeia Arouch recusam todos os canais oferecidos pelo governo. Argel deve responder antes que a região escape por completo."
 alg_ethnicity.200.a: "Dar-lhes o que Querem"
 alg_ethnicity.200.b: "Arriscar uma Guerra Civil"
 alg_ethnicity.200.c: "Reconhecer o Tamazight e Reformar"
 alg_appease_kabyles: "Apaziguar a População Cabila"
 alg_appease_kabyles_desc: "A crescente agitação na Cabília ameaça a estabilidade nacional. Oferecendo concessões como reconhecimento cultural, investimento econômico ou autonomia limitada, podemos acalmar as tensões, embora isso corra o risco de encorajar outras regiões a exigir o mesmo."
 alg_ethnic_policy: "Política Étnica"
 alg_ethnic_policy_desc: "\n£MAIN_arab_kabyle\n\n\n\nA Argélia é um país diverso, com grupos étnicos significativos: árabes, cabilas, tuaregues, mozabitas e chauís. A política do governo deve equilibrar suas demandas; as decisões trarão benefícios, mas desagradar qualquer grupo corre o risco de gerar agitação e até secessão."
 ALG_sahara_poaching: "Caça Ilegal no Saara"
 ALG_sahara_poaching_desc: "A caça ilegal é um grande problema em todo o vasto Saara e nas estepes da Argélia. Gazelas, abetardas e carneiros-da-berbéria são caçados ilegalmente, enquanto rotas de tráfico se conectam a mercados internacionais. Combinada ao excesso de pastoreio e ao uso excessivo de água, a caça ilegal acelera a desertificação e a perda de biodiversidade.\n\nProbabilidade de §YDesertificação§!: §R[?sahara_expands]%§!\nProbabilidade de §YEstabilização§!: [?sahara_steady]%\nProbabilidade de §YFormação de Oásis§!: §G[?sahara_retreats]%§!\n\nTodo mês, há uma\n§Y[?chance_to_not_kill_poachers]%§! de chance de §Y15 novos caçadores ilegais§! entrarem em operação.\n§Y[?chance_to_kill_poachers]%§! de chance de nossas forças de segurança eliminarem §Y[?no_of_poachers_to_kill] caçadores ilegais§!\n\nUm maior §YGasto com Segurança Interna§! e medidas direcionadas contra a caça ilegal melhoram nossas chances de sucesso.\n\nCaçadores ilegais ativos estimados: [?no_of_poachers] ([ALG_threat_level_of_poachers])"
 ALG_bi_yearly_poaching_report: "Relatório Anual de Caça Ilegal"
 ALG_bi_yearly_poaching_report_desc: "A cada 12 meses, avalia-se o impacto da caça ilegal. Uma §GAmeaça Baixa§! reduz o risco de desertificação, enquanto uma §RAmeaça Alta§! o aumenta."
 ALG_anti_poaching_extra_security: "Contratar Guardas Florestais Extras"
 ALG_anti_poaching_extra_security_desc: "Recrutar mais guardas florestais e patrulhas para combater a caça ilegal em todo o Saara e nas estepes."
 ALG_anti_poaching_extra_security_tt: "§GA chance de eliminar caçadores ilegais aumenta em 10%§!"
 ALG_anti_poaching_heavy_weapons: "Equipar Unidades Anticaça Ilegal"
 ALG_anti_poaching_heavy_weapons_desc: "Fornecer veículos, drones e armas pesadas às patrulhas aumenta sua eficácia contra grupos armados de caçadores ilegais."
 ALG_anti_poaching_heavy_weapons_tt: "§GO número de caçadores ilegais eliminados aumenta em 5§!"
 ALG_anti_poaching_awareness: "Campanha de Proteção à Vida Selvagem"
 ALG_anti_poaching_awareness_desc: "Realizar uma campanha pública para conscientizar sobre a importância de proteger espécies ameaçadas da caça ilegal."
 ALG_threat_level_of_poachers_low: "§GAmeaça Baixa§!"
 ALG_threat_level_of_poachers_medium: "§YAmeaça Média§!"
 ALG_threat_level_of_poachers_high: "§RAmeaça Alta§!"
 ALG_eliminate_half_of_poachers: "§GReduzir o número de caçadores ilegais em §Y[?poachers_killed]§!§!"
 ALG_anti_poaching_decisions: "Caça Ilegal no Saara"
 ALG_anti_poaching_decisions_desc: "A caça ilegal no Saara argelino continua sendo um problema persistente. Espécies ameaçadas, como o adax, gazelas e guepardos do deserto, são caçadas para comércio ou esporte, enquanto rotas de contrabando frequentemente ligam essas atividades a redes criminosas e terroristas mais amplas no Sahel. Alguns caçadores ilegais vêm do vizinho Mali, do Níger e da Líbia, embora grupos locais também estejam envolvidos. As autoridades argelinas adotaram uma postura dura contra os §Ycaçadores ilegais§!, e confrontos entre eles e as forças de segurança não são incomuns.\n\nA caça ilegal (junto com o excesso de pastoreio, as mudanças climáticas e o uso insustentável da terra) contribui para a desertificação contínua do Saara. Combater a caça ilegal e proteger ecossistemas frágeis é um passo importante para salvaguardar tanto a biodiversidade quanto os meios de subsistência humanos.\n\nProbabilidade de §YDesertificação§!: §R[?sahara_expands]%§!\nProbabilidade de §YEstabilização§!: [?sahara_steady]%\nProbabilidade de §YFormação de Oásis§!: §G[?sahara_retreats]%§!\n\nTodo mês, há uma\n§Y[?chance_to_not_kill_poachers]%§! de chance de §Y15 novos caçadores ilegais§! iniciarem operações.\n§Y[?chance_to_kill_poachers]%§! de chance de nossas forças de segurança eliminarem §Y[?no_of_poachers_to_kill] caçadores ilegais§!\n\nPodemos aumentar a probabilidade de eliminar caçadores ilegais elevando os gastos com §YSegurança Interna§! ou equipando e treinando nossas forças para operações no deserto.\n\nQuantidade estimada atual de caçadores ilegais: [?no_of_poachers] ([ALG_threat_level_of_poachers])"
 ALG_anti_poaching_dehorn_camels: "Campanha de Marcação de Camelos"
 ALG_anti_poaching_dehorn_camels_desc: "Marcar e monitorar de perto os rebanhos de camelos em todo o Saara poderia ajudar a desencorajar caçadores ilegais e contrabandistas. Embora os camelos não estejam ameaçados, eles costumam ser alvo de rotas de contrabando ou do comércio ilegal. Ao introduzir etiquetas de identificação, supervisão comunitária e cooperação nas patrulhas, podemos dificultar o lucro dos caçadores ilegais com o roubo e o comércio de camelos."
 ALG_anti_poaching_dehorn_camels_tt: "§GUma campanha bem-sucedida reduzirá pela metade o número de caçadores ilegais§!"
 ALG_total_ban_on_poaching: "Proibição Total da Caça Ilegal"
 ALG_total_ban_on_poaching_desc: "A caça ilegal ameaça espécies em perigo como o adax, a gazela e o guepardo do deserto. Embora algumas tradições de caça persistam, devemos agir com decisão e impor a proibição total da caça ilegal em reservas e ecossistemas frágeis para proteger nosso patrimônio natural."
 alg_appease_kabyles_tt: "Aumentar o financiamento para as regiões de maioria cabila, programas culturais e autonomia local. Os nacionalistas árabes ficarão descontentes."
 alg_arabization_tt: "Promover a língua árabe e a identidade árabe-islâmica na educação e na vida pública. As comunidades berberes resistirão."
 alg_ethnic.10.t: "O Reconhecimento do Tamazight Dá Frutos"
 alg_ethnic.10.d: "Três meses após o reconhecimento do tamazight, as comunidades berberes relatam melhores relações com o Estado. A aprovação pública está subindo."
 alg_ethnic.10.a: "Um novo capítulo para a Argélia."
 ALG_ethnic_data.1.t: "Demografia Étnica da Argélia"
 ALG_ethnic_data.1.d: "Nossa análise da composição étnica da Argélia após a Primavera Negra está concluída. A crise revelou profundas fraturas em nossa sociedade:\n\n§YÁrabes§!: [?ALG_ethnic_arab]%, Satisfação: [?ALG_arab_satisfaction]/100\nA população majoritária. Seu domínio está sendo questionado.\n\n§Yⵣ Cabilas§!: [?ALG_ethnic_kabyle]%, Satisfação: [?ALG_kabyle_satisfaction]/100\n§RA Primavera Negra radicalizou muitos. As tensões são críticas.§!\n\n§YChaouis§!: [?ALG_ethnic_chaoui]%, Satisfação: [?ALG_chaoui_satisfaction]/100\nAcompanhando de perto os acontecimentos na Cabília.\n\n§Y⵿ Tuaregues§!: [?ALG_ethnic_tuareg]%, Satisfação: [?ALG_tuareg_satisfaction]/100\nAs comunidades saarianas se sentem negligenciadas por Argel.\n\n§Yⵎ Mozabitas§!: [?ALG_ethnic_mozabite]%, Satisfação: [?ALG_mozabite_satisfaction]/100\nMantendo suas comunidades ibaditas distintas.\n\n§YOutros§!: [?ALG_ethnic_other]%\n\n§YO Sistema de Gestão Étnica está agora ativo.§!"
 ALG_ethnic_data.1.a: "Devemos lidar com isso com cuidado."
 ALG_ethnic_system_active_tt: "§GO Sistema de Gestão Étnica agora está ativo!§!\n\nAcompanhe a satisfação no painel de decisões.\nUse políticas para manter os grupos satisfeitos.\nGrupos negligenciados causarão problemas!"
 ALG_ethnic_data_category: "[ALG.GetFlag]§YDemografia Étnica§!"
 ALG_ethnic_data_category_desc: "§YO Mosaico Étnico da Argélia§! representa a complexa tapeçaria de povos que compõem nossa nação. Após a devastadora §RGuerra Civil (1991-2002)§!, gerir as relações étnicas tornou-se crucial para a estabilidade nacional. A política de reconciliação nacional do presidente [ALG.GetLeader] deve atender às queixas de todas as comunidades.\n\nA §Ypopulação cabila§!, em particular, continua inquieta: a §RPrimavera Negra de 2001§! se aproxima no horizonte se suas preocupações não forem atendidas. Enquanto isso, as comunidades §Ytuaregues§! do sul acompanham com interesse os acontecimentos no vizinho Mali e no Níger.\n\n§H COMO FUNCIONA §!\n\nCada grupo étnico tem um §Ynível de satisfação§! (0-100):\n§G- Acima de 70§!: O grupo está §GCONTENTE§! -> Concede bônus nacionais\n§Y- 40-70§!: O grupo está §YNEUTRO§! -> Sem efeitos especiais\n§R- Abaixo de 40§!: O grupo está §RDESCONTENTE§! -> Causa penalidades\n§R- Abaixo de 25§!: §RPERIGO§! -> Penalidades severas, possível revolta\n\n§YA satisfação decai mensalmente§! para grupos negligenciados. Favorecer um grupo frequentemente irrita outros!\n\n§H SITUAÇÃO ATUAL §!\n\n§YÁRABES§! - [?ALG_ethnic_arab]% da população\n  Satisfação: [?ALG_arab_satisfaction]/100\n  §YQuando Contentes:§! §G+Poder Político, +Estabilidade, +Mão de Obra§!\n\n§YCABILAS§! - [?ALG_ethnic_kabyle]% da população\n  Satisfação: [?ALG_kabyle_satisfaction]/100\n  §YQuando Contentes:§! §G+Velocidade de Pesquisa§!\n  §RAviso: a Primavera Negra pode ser desencadeada se a satisfação permanecer baixa!§!\n\n§YCHAOUIS§! - [?ALG_ethnic_chaoui]% da população\n  Satisfação: [?ALG_chaoui_satisfaction]/100\n  §YQuando Contentes:§! §G+Velocidade de Construção, +Recursos§!\n\n§YTUAREGUES§! - [?ALG_ethnic_tuareg]% da população\n  Satisfação: [?ALG_tuareg_satisfaction]/100\n  §YQuando Contentes:§! §G+Organização do Exército, +Combate no Deserto§!\n\n§YMOZABITAS§! - [?ALG_ethnic_mozabite]% da população\n  Satisfação: [?ALG_mozabite_satisfaction]/100\n  §YQuando Contentes:§! §G-Bens de Consumo, +Comércio§!\n\n§YOUTROS§! - [?ALG_ethnic_other]% da população"
 ALG_census_tt: "Realizar um censo nacional abrangente para atualizar os dados demográficos e embasar a política."
 ALG_ethnic_data.2.t: "Resultados do Censo e Identidade Nacional"
 ALG_ethnic_data.2.d: "Nosso censo revela a diversidade étnica da Argélia. Como devemos responder politicamente?"
 ALG_ethnic_data.2.a: "Reforçar a identidade árabe-islâmica."
 ALG_ethnic_data.2.b: "Celebrar igualmente nossa herança berbere e árabe."
 ALG_ethnic_data.2.c: "Evitar tomar posição."
 ALG_ethnic_data.20.t: "Confrontos em Ghardaïa"
 ALG_ethnic_data.20.d: "§R2013 - VALE DO M'ZAB§!\n\nEclodiram confrontos violentos entre as comunidades árabe e mozabita no Vale do M'zab, centrados na histórica cidade de Ghardaïa. A violência, que começou por uma disputa em torno de um cemitério, evoluiu para tumultos comunitários generalizados.\n\nLojas e casas mozabitas foram atacadas e incendiadas. Várias pessoas foram mortas de ambos os lados. A comunidade mozabita, descendente da antiga dinastia rustúmida, sente que sua própria existência está ameaçada.\n\nAs forças de segurança lutam para conter a situação. Como respondemos?"
 ALG_ethnic_data.20.a: "Os árabes têm queixas legítimas. Ficar do lado deles."
 ALG_ethnic_data.20.b: "Proteger a minoria mozabita. Enviar tropas para proteger suas áreas."
 ALG_ethnic_data.20.c: "Tentar uma mediação neutra entre as duas comunidades."
 ALG_ghardaia_arab_side_tt: "Ficamos do lado da comunidade árabe.\n§RSatisfação mozabita -20§!\n§GSatisfação árabe +5§!"
 ALG_ghardaia_mozabite_side_tt: "Enviamos forças para proteger os mozabitas.\n§RSatisfação mozabita -5§! (agradecidos, mas traumatizados)\n§RSatisfação árabe -10§!"
 ALG_ghardaia_neutral_tt: "Tentamos a mediação.\n§RSatisfação mozabita -10§!\n§RSatisfação árabe -3§!\nNenhum dos lados fica totalmente satisfeito."
 ALG_ethnic_data.10.t: "Tensões Étnicas em Alta"
 ALG_ethnic_data.10.d: "Relatórios indicam agitação crescente entre as comunidades étnicas insatisfeitas. Autoridades locais alertam que protestos estão sendo organizados, e alguns temem ações mais radicais se as preocupações não forem atendidas.\n\n§RGrupos Atuais em Crise:§!"
 ALG_ethnic_data.10.a: "Não podemos atender a todas as queixas."
 ALG_ethnic_data.10.b: "Enviar funcionários para tratar de suas preocupações."
 ALG_show_ethnic_data: "§YVer Panorama Étnico§!"
 ALG_show_ethnic_data_desc: "Revisar a situação atual de todos os grupos étnicos da Argélia."
 ALG_ethnic_overview_full_tt: "§HVISÃO GERAL DOS GRUPOS ÉTNICOS§!\n\n§YÁRABES§! | Pop.: §G[?ALG_ethnic_arab]%§! | Satisfação: §B[?ALG_arab_satisfaction]§!/100\n§Yⵣ CABILAS§! | Pop.: §G[?ALG_ethnic_kabyle]%§! | Satisfação: §B[?ALG_kabyle_satisfaction]§!/100\n§YCHAOUIS§! | Pop.: §G[?ALG_ethnic_chaoui]%§! | Satisfação: §B[?ALG_chaoui_satisfaction]§!/100\n§Y⵿ TUAREGUES§! | Pop.: §G[?ALG_ethnic_tuareg]%§! | Satisfação: §B[?ALG_tuareg_satisfaction]§!/100\n§Yⵎ MOZABITAS§! | Pop.: §G[?ALG_ethnic_mozabite]%§! | Satisfação: §B[?ALG_mozabite_satisfaction]§!/100\n§YOUTROS§! | Pop.: §G[?ALG_ethnic_other]%§!\n\n§YLembre-se:§! Os grupos perdem satisfação se não forem apoiados ativamente!"
 ALG_favor_arab_policies: "Políticas Pró-Árabes"
 ALG_favor_arab_policies_desc: "Promover a língua árabe, a identidade cultural árabe-islâmica e priorizar as regiões árabes no desenvolvimento.\n\n§GEfeitos:§!\n• Satisfação dos árabes §G+10§!\n• Satisfação dos cabilas §R-5§!\n• Satisfação dos chaouis §R-3§!\n• Satisfação dos tuaregues §R-3§!\n• Satisfação dos mozabitas §R-3§!\n\n§YTempo de espera:§! 60 dias"
 ALG_favor_arab_tt: "§GOs árabes estão satisfeitos com o nosso apoio!§!\n§RAs minorias se sentem marginalizadas.§!"
 ALG_favor_kabyle_policies: "Políticas Pró-Cabilas"
 ALG_favor_kabyle_policies_desc: "Apoiar o ensino da língua tamazight, a preservação cultural cabila e o desenvolvimento da região da Cabília.\n\n§GEfeitos:§!\n• Satisfação dos cabilas §G+10§!\n• Satisfação dos árabes §R-5§!\n• Satisfação dos chaouis §R-2§!\n\n§YTempo de espera:§! 60 dias"
 ALG_favor_kabyle_tt: "§GOs cabilas celebram o reconhecimento de sua herança!§!\n§ROs árabes sentem seu domínio ameaçado.§!"
 ALG_favor_chaoui_policies: "Políticas Pró-Chaouis"
 ALG_favor_chaoui_policies_desc: "Investir no desenvolvimento da região das Montanhas Aurès e apoiar iniciativas culturais chaouis.\n\n§GEfeitos:§!\n• Satisfação dos chaouis §G+10§!\n• Satisfação dos árabes §R-3§!\n• Satisfação dos cabilas §R-2§!\n\n§YTempo de espera:§! 60 dias"
 ALG_favor_chaoui_tt: "§GOs chaouis apreciam o desenvolvimento de sua região!§!"
 ALG_favor_tuareg_policies: "Políticas Pró-Tuaregues"
 ALG_favor_tuareg_policies_desc: "Apoiar a autonomia tuaregue no Saara, investir no desenvolvimento do sul e integrar as comunidades tuaregues.\n\n§GEfeitos:§!\n• Satisfação dos tuaregues §G+10§!\n• Satisfação dos árabes §R-3§!\n\n§YTempo de espera:§! 60 dias"
 ALG_favor_tuareg_tt: "§GOs Homens Azuis do deserto apreciam nossa atenção!§!"
 ALG_favor_mozabite_policies: "Políticas Pró-Mozabitas"
 ALG_favor_mozabite_policies_desc: "Proteger as práticas religiosas ibaditas, apoiar as comunidades mercantis mozabitas e desenvolver o Vale do M'zab.\n\n§GEfeitos:§!\n• Satisfação dos mozabitas §G+10§!\n• Satisfação dos árabes §R-2§!\n\n§YTempo de espera:§! 60 dias"
 ALG_favor_mozabite_tt: "§GOs comerciantes mozabitas expandem suas redes de comércio!§!"
 ALG_recognize_tamazight_1: "Reconhecer a Língua Tamazight"
 ALG_recognize_tamazight_1_desc: "Reconhecer oficialmente o tamazight como língua nacional da Argélia, ao lado do árabe. Essa decisão histórica atenderia a uma demanda central do movimento berbere.\n\n§GEfeitos:§!\n• Satisfação dos cabilas §G+20§!\n• Satisfação dos chaouis §G+15§!\n• Satisfação dos tuaregues §G+10§!\n• Satisfação dos mozabitas §G+10§!\n• Satisfação dos árabes §R-10§!\n• §G+5%§! Estabilidade\n\n§YDisponível após 2002§!"
 ALG_recognize_tamazight_tt: "§GReconhecimento histórico do tamazight como língua nacional!§!\nTodos os grupos berberes estão satisfeitos, mas os nacionalistas árabes estão irritados."
 ALG_national_unity_initiative: "Iniciativa de Unidade Nacional"
 ALG_national_unity_initiative_desc: "Lançar um programa abrangente que promova a identidade nacional argelina acima das divisões étnicas, com base na política de reconciliação de Bouteflika.\n\n§GEfeitos:§!\n• Satisfação de todos os grupos §G+5§!\n• §G+3%§! Estabilidade ao concluir\n\n§YÉ caro, mas equilibrado.§!\n§YTempo de espera:§! 180 dias"
 ALG_unity_policy_tt: "§GTodos os argelinos se unem sob a bandeira nacional!§!"
 ALG_suppress_ethnic_unrest: "§RReprimir a Agitação Étnica§!"
 ALG_suppress_ethnic_unrest_desc: "Usar as forças de segurança para conter os protestos étnicos e restaurar a ordem.\n\n§RMEDIDA DE EMERGÊNCIA§! - Disponível apenas quando há grupos em crise (<25 de satisfação).\n\n§YEfeitos:§!\n• Satisfação dos grupos críticos §G+15§!\n• §R-5%§! Estabilidade\n• §R-3%§! Apoio à Guerra\n\n§RIsso é apenas uma solução temporária!§!"
 ALG_suppress_unrest_tt: "As forças de segurança restauram a ordem por ora.\n§RIsso não resolverá os problemas de fundo.§!"
 ALG_conduct_national_census: "Realizar o Censo Nacional"
 ALG_conduct_national_census_desc: "Realizar um censo demográfico detalhado para entender melhor a composição de nossa população."
 ALG_census_arab_focus_tt: "§GOs árabes estão satisfeitos!§! Os demais grupos se sentem marginalizados."
 ALG_census_balanced_tt: "§GTodos os grupos apreciam o reconhecimento da diversidade!§!"
 ALG_census_neutral_tt: "Não adotamos nenhuma posição oficial sobre políticas de identidade."
 ALG_arab_content: "Apoio da Comunidade Árabe"
 ALG_arab_content_desc: "A maioria árabe apoia o governo de todo o coração, oferecendo respaldo político e recrutas ansiosos para nossas forças armadas."
 ALG_arab_discontent: "Descontentamento Árabe"
 ALG_arab_discontent_desc: "A população árabe está cada vez mais frustrada com políticas governamentais que parecem favorecer as minorias às suas custas."
 ALG_arab_unrest: "Agitação Árabe"
 ALG_arab_unrest_desc: "A maioria árabe está profundamente insatisfeita. Protestos e agitação civil se tornam comuns, ameaçando a estabilidade que lutamos tanto para alcançar após a Guerra Civil."
 ALG_chaoui_content: "Prosperidade do Aurès"
 ALG_chaoui_content_desc: "O povo chaoui contribui para projetos de construção e mineração em toda a região das Montanhas Aurès, impulsionando o desenvolvimento regional."
 ALG_chaoui_discontent: "Abandono do Aurès"
 ALG_chaoui_discontent_desc: "A população chaoui se sente esquecida pelo governo central. O desenvolvimento na região do Aurès estagnou desde a Guerra Civil."
 ALG_tuareg_content: "Aliança Tuaregue"
 ALG_tuareg_content_desc: "Os orgulhosos guerreiros tuaregues apoiam o governo e emprestam sua lendária experiência em combate no deserto às nossas forças militares."
 ALG_tuareg_discontent: "Tensão Saariana"
 ALG_tuareg_discontent_desc: "As comunidades tuaregues se sentem ignoradas por Argel. A instabilidade regional no Mali e no Níger as faz questionar sua lealdade."
 ALG_tuareg_unrest: "Levante Tuaregue"
 ALG_tuareg_unrest_desc: "Combatentes tuaregues organizam resistência armada no Saara. Movimentos transfronteiriços com o Mali e o Níger complicam a situação. O sul está se tornando ingovernável."
 ALG_mozabite_content: "Comércio Mozabita"
 ALG_mozabite_content_desc: "A comunidade mozabita, voltada aos negócios, impulsiona as redes de comércio e reduz o custo dos bens de consumo graças à sua experiência comercial."
 ALG_mozabite_discontent: "Tensões no M'zab"
 ALG_mozabite_discontent_desc: "A comunidade mozabita está se retirando da participação na economia nacional. As tensões com os vizinhos árabes no Vale do M'zab estão aumentando."
 ALG_ethnic_harmony: "Harmonia Étnica"
 ALG_ethnic_harmony_desc: "Todos os principais grupos étnicos estão satisfeitos com as políticas do governo. A Argélia está unida, finalmente superando o trauma da Guerra Civil!"
 ALG_ethnic_tension: "Tensões Étnicas"
 ALG_ethnic_tension_desc: "Vários grupos étnicos estão profundamente insatisfeitos. A frágil paz da era Bouteflika está desmoronando enquanto o país se fratura ao longo de linhas étnicas."
 ALG_census_conducted: "Censo Realizado"
 ALG_ethnic_data_initialized: "Assuntos Étnicos Estabelecidos"
 ALG_recent_ethnic_policy: "Política Étnica Recente Promulgada"
 ALG_recent_unity_policy: "Iniciativa de Unidade Recente"
 ALG_recent_suppression: "Ação de Repressão Recente"
 ALG_tamazight_recognized: "Tamazight Reconhecido"
 ALG_ghardaia_clashes_happened: "Os Confrontos de Ghardaïa Ocorreram"
 ALG_ethnic_warning_recent: "Tensões Étnicas Tratadas Recentemente"
 ALG_arabization_hardline: "Política de Arabização Linha-Dura"
 ALG_arabization_pushed_once: "Impulso Inicial de Arabização"
 ALG_arabization_recent: "Esforços Recentes de Arabização"
 ALG_kabyle_appeased_recently: "Sentimentos Cabilas Apaziguados"
 ALG_sahara_expansion: "Desertificação do Saara"
 ALG_sahara_expansion_desc: "O Saara cobre a maior parte da Argélia e avança continuamente para o norte, rumo à estepe e às limitadas terras agrícolas do país. O pastoreio excessivo, a irrigação insustentável e a extração de recursos aceleram o processo; a conservação, a agricultura sustentável e a energia renovável o retardam.\n\nUma vez por ano recebemos uma atualização sobre o estado do deserto. Ele pode avançar (§YDesertificação§!, um nível pior), se manter (§YEstabilização§!) ou recuar (§YOasificação§!, um nível melhor).\n\nProbabilidade de §YDesertificação§!: §R[?sahara_expands]%§!\nProbabilidade de §YEstabilização§!: [?sahara_steady]%\nProbabilidade de §YOasificação§!: §G[?sahara_retreats]%§!\n\nCada uma dessas probabilidades muda em §Y5%§! por meio dos focos. A expansão agrícola e industrial, como §Y$ALG_increase_cattle_grazing$§!, §Y$ALG_oil_production$§! e §Y$ALG_hassi_massoud_exploitation$§!, torna a desertificação mais provável. A conservação e as renováveis, como §Y$ALG_optimize_pastoral_practices$§!, §Y$ALG_expand_nature_reserves_sahara$§! e §Y$ALG_solar_panel_grid$§!, a tornam menos provável."
 ALG_ethnic_relations_desc: "A Argélia é um mosaico de povos cuja lealdade ao Estado varia muito.\n\n§YPopulação árabe:§! [ALG_arab_satisfaction_text]\n§YPopulação cabila:§! [ALG_kabyle_satisfaction_text]\n§YPopulação chaoui:§! [ALG_chaoui_satisfaction_text]\n§YPopulação tuaregue:§! [ALG_tuareg_satisfaction_text]\n§YPopulação mozabita:§! [ALG_mozabite_satisfaction_text]"
 ALG_black_spring_event_desc: "Protestos eclodiram por toda a Cabília. O humor da população: [ALG_kabyle_satisfaction_text]. O regime deve decidir como responder."
 deep_state_growing_tt: "A influência do Estado Profundo está crescendo na Argélia."
