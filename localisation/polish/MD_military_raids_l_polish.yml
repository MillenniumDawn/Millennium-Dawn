 MD_raid.1.t: "[FROM.GetName] narusza naszą integralność terytorialną!"
 MD_raid.1.d: "Raporty wskazują, że [FROM.GetLeader], przywódca [FROM.GetName], zatwierdził serię skoordynowanych ataków na nasze państwo. Ta agresja sugeruje jawne lekceważenie lub niejasność co do granic między naszymi terytoriami. Dla wielu, zwłaszcza nacjonalistów i patriotów, jest to postrzegane jako bezpośredni akt wojny, wymagający zdecydowanej odpowiedzi. Jednak inni, zarówno w kraju, jak i za granicą, wzywają do powściągliwości, apelując o deeskalację, aby uniknąć konfliktu na pełną skalę."
 MD_raid.1.a: "Akt wojny nie może pozostać bezkarny!"
 MD_raid.1.b: "Obiecaj opinii publicznej odpowiedź!"
 MD_raid.1.c: "Żądaj reparacji i złagodzenia napięć od [FROM.GetName]"
 MD_raid.1.e: "Złożyć protest dyplomatyczny"
 MD_raid.2.t: "[FROM.GetName] Żądanie Reparacji"
 MD_raid.2.d: "Właśnie otrzymaliśmy komunikat od [FROM.GetName]. Domagają się odszkodowania za szkody gospodarcze, które, jak twierdzą, ponieśli. W niedawnym publicznym wystąpieniu [FROM.GetLeader] ostrzegł, że każda odmowa zapłaty spotka się z „szybkimi i surowymi” konsekwencjami."
 MD_raid.2.a: "Nie zapłacimy ani cholernego grosza."
 MD_raid.2.b: "Cena za pokój?"
 MD_raid.3.t: "[FROM.GetName] zgadza się na reparacje i obiecuje złagodzić napięcia"
 MD_raid.3.d: "Nasze groźby odwetu skłoniły władze [FROM.GetName] do ustępstw i zapewnienia środków niezbędnych na pokrycie szkód wynikających z ich nieuzasadnionego oraz bezprawnego naruszenia naszej integralności terytorialnej. Zobowiązały się one również do złagodzenia napięć poprzez podjęcie otwartego dialogu i deklarację powstrzymania się od wszelkich przyszłych aktów agresji czy wrogich działań, dążąc tym samym do przywrócenia w regionie choćby pozorów stabilności."
 MD_raid.3.a: "Dobrze"
 MD_raid.4.t: "[FROM.GetName] Odmawia wypłaty reparacji"
 MD_raid.4.d: "W niedawnym przemówieniu do zgromadzonego tłumu [FROM.GetLeader] śmiało oświadczył, że ich rząd nie zapłaci „ani jednej monety”. To moment głęboko upokarzający dla naszego państwa. Nie dość, że ich początkowy atak naruszył naszą integralność terytorialną, to teraz zagrożona jest również nasza wiarygodność na arenie międzynarodowej."
 MD_raid.4.a: "Musimy odpowiedzieć odwetem!"
 MD_raid.4.b: "Udawaj, że nic się nie stało."
 MD_raid.4.c: "Domagaj się międzynarodowych sankcji!"
 MD_raid.5.t: "Nasz rząd stoi w obliczu międzynarodowego i krajowego upokorzenia."
 MD_raid.5.d: "Globalni dziennikarze używali zwrotów takich jak „puste słowa”, „puste groźby” oraz „papierowy tygrys” w opisie naszej reakcji na ostatnie ataki ze strony obcych sił. Nasz brak zdecydowanej odpowiedzi poważnie podważył wiarygodność rządu i zasiał wątpliwości co do skuteczności naszej armii jako środka obrony."
 MD_raid.5.a: "Cholera"
 MD_raid.6.t: "Odwet!"
 MD_raid.6.d: "Nasze niedawne operacje wojskowe na obcym terytorium nie uszły uwadze reżimu [FROM.capital.GetCapitalVictoryPointName]. W odpowiedzi wystosował on surowe ostrzeżenia, zapowiadając szybki i zdecydowany odwet na naszym kraju. W społeczeństwie narasta napięcie, podczas gdy przygotowujemy się na zapowiadaną reakcję."
 MD_raid.6.a: "Mogą blefować."
 MD_raid.10.t: "[FROM.GetName] zaatakował naszego sąsiada [FROM.FROM.GetName]!"
 MD_raid.10.d: "Nasz sąsiad, [FROM.FROM.GetName], właśnie został zaatakowany przez [FROM.GetName]! Brak oficjalnego wypowiedzenia wojny przed tym uderzeniem czyni to działanie ewidentnym naruszeniem integralności terytorialnej regionu przez wrogie mocarstwo. Region z niepokojem oczekuje na reakcję na ten atak."
 MD_raid.10.a: "My będziemy następni?"
 MD_raid.12.t: "[FROM.GetName] uderzył [FROM.FROM.GetName]!"
 MD_raid.12.d: "W szokującym i rażącym akcie agresji [FROM.GetLeader] wydał rozkaz przeprowadzenia uderzenia militarnego siłami podległymi mu oddziałami na naszego sojusznika, [FROM.FROM.GetName]. Ten zuchwały atak wstrząsnął naszym narodem, wywołując powszechne oburzenie i głosy domagające się zdecydowanych działań ze strony rządu. Przekaz jest jasny: tak niesprowokowany atak nie może zostać – i nie zostanie – zignorowany."
 MD_raid.12.a: "Zawsze będziemy stać po stronie naszych sojuszników!"
 MD_raid.13.t: "[FROM.GetName] Wezwanie do nałożenia sankcji!"
 MD_raid.13.d: "[FROM.GetLeader] zażądał od społeczności międzynarodowej nałożenia na nas sankcji w odpowiedzi na naszą odmowę zapłaty absurdalnych reparacji. Dopiero czas pokaże, czy świat przychyli się do tego żądania.\n\nCzekają nas konsekwencje w sferze stosunków międzynarodowych, polityki i gospodarki; ich dotkliwość będzie rosła w miarę, jak do sankcji przeciwko nam dołączać będą kolejne państwa! Skłonność innych narodów do przyłączenia się do sankcji będzie tym większa, im bardziej są one do nas wrogo nastawione lub im silniejszy jest ich sprzeciw wobec nas na gruncie dyplomatycznym bądź gospodarczym."
 MD_raid.13.a: "Nasza gospodarka przetrwa!"
 MD_raid.14.t: "[FROM.FROM.GetName] domaga się międzynarodowych sankcji!"
 MD_raid.14.d: "[FROM.FROM.GetLeader] zaapelował do społeczności międzynarodowej o nałożenie sankcji na [FROM.GetName] w związku z odmową zapłaty żądanych reparacji po ich ataku zbrojnym na [FROM.FROM.GetName]. Teraz świat musi odpowiedzieć na ten apel:"
 MD_raid.14.a: "Dołączymy do sankcji!"
 MD_raid.14.b: "Nie, nie teraz."
 MD_timed_raid_TT: "§R Będziemy mieć 270 dni na reakcję w postaci obniżonych kosztów rajdów! §!"
 MD_reparation_TT: "§HZapłacimy:§!"
 nation_on_same_continent: "Kraj docelowy musi znajdować się na tym samym kontynencie."
 guided_missile: "Pocisk manewrujący"
 canal_damaged_modifier: "Śluzy kanałowe uszkodzone"
 MD_raid.10.b: "I tak pewnie na to zasłużyli."
 MD_raid.12.b: "I tak ich nie lubiliśmy."
 nuclear_ballistic_missile: "NIRBM"
 MD_raid_bonus: "Premia za odwet"
 MD_raid.1.NATO: "Uruchomienie artykułu 5"
 MD_raid.16.t: "Kryzys wisi w powietrzu po [FROM.FROM.GetAdjective] uderzeniach na [FROM.GetName]"
 MD_raid.16.d: "W następstwie prowokacyjnych uderzeń [FROM.FROM.GetName] na terytorium [FROM.GetAdjective], napięcie osiągnęło punkt krytyczny. W bezkompromisowym oświadczeniu [FROM.GetLeader], przywódca [FROM.GetName], zapowiedział zdecydowaną reakcję swojego rządu. Ogłoszono plany mobilizacji wojsk i wkroczenia na terytorium [FROM.FROM.GetAdjective], deklarując zamiar „poskromienia wściekłych tyranów w [FROM.FROM.capital.GetCapitalVictoryPointName]” oraz „przywrócenia porządku siłą, jeśli zajdzie taka potrzeba”. Posunięcie to rzuca światło na kwestie stabilności regionalnej i globalnej, unaoczniając zagrożenia wynikające z braku działań dyplomatycznych. Obecnie kanały dyplomatyczne milczą, co potęguje obawy, że eskalacja ta może przerodzić się w niekontrolowany konflikt o katastrofalnych skutkach dla międzynarodowego pokoju i bezpieczeństwa."
 MD_raid.16.a: "Co dzieje się dalej?"
 MD_raid.17.t: "[FROM.GetName] uruchamia artykuł 5 traktatu NATO"
 MD_raid.17.d: "Po uderzeniach [FROM.FROM.GetAdjective] na [FROM.GetAdjective] ziemie, rząd w [FROM.capital.GetCapitalVictoryPointName] podjął zdecydowane działania, uruchamiając artykuł 5. traktatu NATO i wzywając sojuszników do wspólnej reakcji na agresję. Ataki przeprowadzone przez [FROM.FROM.GetName] – określane mianem działań niebędących odwetem i niepoprzedzonych prowokacją – znacząco zaostrzyły napięcia, spychając sytuację na skraj wojny. Decyzja o uruchomieniu artykułu 5. traktatu NATO wywołała wstrząs na arenie międzynarodowej, a światowi przywódcy gorączkowo poszukują odpowiedzi na wydarzenie, które może okazać się jednym z najpoważniejszych sprawdzianów dla Sojuszu w jego współczesnej historii. Zarówno dyplomaci, jak i analitycy ostrzegają przed daleko idącymi konsekwencjami tej sytuacji, podczas gdy nad światem zawisło widmo dalszej eskalacji."
 MD_raid.17.a: "Olbrzym został sprowokowany"
 MD_reparation2_TT: "§HObiecali, że nie uderzą w nas przez rok!§!\n§RJeśli ich zaatakujemy, nie będą nam ufać przez długi czas.§!"
 RAID_war_instantly_TT: "§RNatychmiast wywoła wojnę!§!"
 MD_nuclear_energy.1.t: "Ostrzeżenie dotyczące energii jądrowej"
 MD_nuclear_energy.1.d: "Przed przystąpieniem do budowy reaktorów upewnij się, że masz aktywną technologię wytwarzania energii jądrowej. W przeciwnym razie reaktory będą bezużyteczne i nie dostarczą energii twojemu państwu."
 MD_nuclear_energy.1.a: "Ok"
