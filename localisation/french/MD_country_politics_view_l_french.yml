 BAN_ALL_PARTIES_TT_DELAYED: "En tant que seul parti au gouvernement, nous pouvons inscrire dans la loi l'illégalité de tous les autres partis politiques.\n\nVive le parti !\n\n§YPrérequis :§!\n[!ban_all_parties_button_click_enabled]\n§YEffets :§!\n[!ban_all_parties_button_click]"
