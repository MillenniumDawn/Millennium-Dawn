l_english:
 AGL_power_shortages: "Chronic Power Shortages"
 AGL_power_shortages_desc: "Decades of war left Angola's grid fragmented and starved of generating capacity. Blackouts are a daily fact of life in Luanda, and factories, hospitals and offices lean on private diesel generators to keep running.\n§W--------------§!\nThis dynamic modifier will §GImprove§! through the §H$AGL_caculo_cabaca_planning$§! decision and the §H$AGL_caculo_cabaca_mission$§! mission, and will be §RRemoved§! when the power station opens."
 AGL_caculo_cabaca_works: "Caculo Cabaca Works"
 AGL_caculo_cabaca_works_desc: "Civilian industry is tied up in the dam, diversion tunnel and powerhouse works on the Cuanza River."
 AGL_caculo_cabaca_planning: "Plan the Caculo Cabaca Power Station"
 AGL_caculo_cabaca_planning_desc: "The Cuanza River carries the largest untapped hydroelectric potential in Angola. A 2,172 MW station at the Caculo Cabaca gorge would end our reliance on diesel generators, but the survey, design and financing must be settled first."
 AGL_caculo_cabaca_mission: "Build the Caculo Cabaca Power Station"
 AGL_caculo_cabaca_mission_desc: "Construction of the dam, the diversion tunnel and the underground powerhouse is under way on the Cuanza River. Setbacks may delay the opening."
 Angola.1.t: "Financing Caculo Cabaca"
 Angola.1.d: "The survey and design work for the Caculo Cabaca Power Station is complete. The project needs several billion dollars that the state budget cannot easily spare. China Gezhouba Group has offered to build the station, backed by a loan from the Industrial and Commercial Bank of China. Some ministers argue we should pay from oil revenue instead and keep the debt off our books."
 Angola.1.a: "Accept the ICBC loan and the Chinese contractor."
 Angola.1.b: "Fund it from oil revenue."
 Angola.2.t: "Trouble in the Diversion Tunnel"
 Angola.2.d: "Engineers boring the diversion tunnel at Caculo Cabaca have hit fractured rock and heavy water inflow. The contractor can add support and pumping at extra cost, wait for the dry season, or redesign the powerhouse around fewer turbines."
 Angola.2.a: "Pay for the extra works."
 Angola.2.b: "Wait for the dry season."
 Angola.2.c: "Cut the number of turbines."
 Angola.2.c_tt: "The finished station will produce §R1.5 GW§! instead of §Y2.172 GW§!.\n"
 Angola.3.t: "First Turbines Online"
 Angola.3.d: "The first generating units at Caculo Cabaca have been synchronised with the northern grid. Luanda reports fewer blackouts, and some businesses have begun switching off their diesel generators."
 Angola.3.a: "A good start."
 Angola.4.t: "Contractor Payment Arrears"
 Angola.4.d: "Payments to the contractor have fallen behind schedule, and work crews at Caculo Cabaca are being sent home. The contractor demands that the arrears be settled before full work resumes."
 Angola.4.a: "Settle the arrears."
 Angola.4.b: "Let the work slow down."
 Angola.5.t: "Caculo Cabaca Opens"
 Angola.5.d: "The Caculo Cabaca Power Station on the Cuanza River has entered full service. As the largest power plant in Angola, it supplies clean and reliable electricity to Luanda and the northern provinces, and the era of constant blackouts and diesel generators is coming to an end."
 Angola.5.a: "Power for Angola."
