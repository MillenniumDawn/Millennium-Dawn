 TUR_support_in_jordan: "Aumente o suporte em §HJordan§!"
 TUR_support_in_saudi: "Aumente o suporte em §HHejaz§!"
 TUR_open_balkans: "§HOSeção Aberta dos Balcãs§!"
 TUR_close_balkans: "§HCFechar Seção dos Balcãs§!"
