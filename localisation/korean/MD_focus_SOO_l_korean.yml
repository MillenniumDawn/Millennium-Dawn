 SOO_hungary_attack: "헝가리인에게 그들의 조상을 일깨우기"
 SOO_defenders_of_iron_idea: "이리스톤의 수호자들"
 SOO_defenders_of_iron_idea_desc: "오세트인은 예로부터 강인함과 용기, 그리고 조국에 대한 의무감으로 유명했습니다. 곁에 조지아라는 공격적인 이웃이 있는 까닭에, 그들은 언제든 침공에 대비해야만 합니다"
 SOO_idea_focus_northossetia_volunteers: "북오세티야 출신 의용군"
 SOO_idea_focus_northossetia_volunteers_desc: "오세트인은 예로부터 형제애와 형제 민족을 돕고자 하는 의지로 유명했습니다"
 SOO_victory_war_idea: "독립 전쟁의 승리"
 SOO_victory_war_idea_desc: "오세트인은 이미 90년대에 독립에 대한 권리를 지켜 냈으며, 이는 독립과 그 이후를 위한 투쟁의 핵심입니다"
 SOO_outdated_army_idea: "시대에 뒤떨어진 군대"
 SOO_outdated_army_idea_desc: "오세트 군은 오래전부터 현대의 현실과 맞지 않게 되었으며, 무기는 구식이어서 교체가 필요합니다"
 SOO_puppet_of_georgia: "조지아의 괴뢰국"
 SOO_puppet_of_georgia_desc: "우리는 이제 조지아의 괴뢰국이 되었습니다... 앞으로도 이를 감수하며 살아가야 합니다."
 SOO_mix_the_population: "인구 귀환"
 SOO_mix_the_population_desc: "이제 우리는 인구를 교환해야 합니다."
 SOO_integration_into_georgian_system: "조지아 체제로의 통합"
