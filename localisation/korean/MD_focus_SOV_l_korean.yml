 sov_economic.41.t: "국가 프로젝트 구상 실패!"
 sov_economic.41.d: "경제부의 최신 보고서에 따르면 우리는 국가 프로젝트 목표를 달성하지 못했습니다. 이 실패는 우리의 국제적 평판과 국내의 신뢰를 모두 훼손합니다. 이 차질에 어떻게 대응해야 하겠습니까?"
 sov_economic.41.o1: "사실을 조작하라. 안정이 가장 중요하다."
 sov_economic.41.o2: "실패를 솔직히 인정하라."
 sov_economic.42.t: "국가 프로젝트 구상 성공!"
 sov_economic.42.d: "경제부는 우리가 국가 프로젝트 목표를 달성했다고 보고합니다! 이 성공은 우리 국민의 힘과 역량을 보여 줍니다. 러시아에게 자랑스러운 순간입니다."
 sov_economic.42.o1: "해냈다! 우라!"
