 POL_state_controlled_economy_category: "국영 경제"
 POL_state_controlled_economy_category_desc: "우리는 경제를 관리해야 합니다. 다양한 종류의 장비를 생산하고 국영 공장에 이 물자의 생산을 할당해야 합니다.\n\n현재 유휴 공장: [?POL.free_factories]\n공작 기계: [?POL.machine_tools_current]/[?POL.machine_tools_req]\n중장비: [?POL.heavy_machinery_current]/[?POL.heavy_machinery_req]\n산업 자재: [?POL.industrial_materials_current]/[?POL.industrial_materials_req]"
 POL_sre_main_countdown_mission: "연간 계획 마감"
 POL_sre_main_countdown_mission_desc: "현재 우리는 국가 발전을 위한 연간 계획을 수립하고 있습니다. 경제를 발전시키려면 계획의 목표를 달성해야 합니다."
 POL_sre_monthly_mission: "월간 보고서"
 POL_sre_monthly_mission_desc: "우리는 국가에서 할당한 공장들로부터 매월 보고서를 받습니다."
 POL_revert_others_changes_category: "잘못된 국가 정신에 대항"
 POL_revert_others_changes_category_desc: "우리가 이루려는 바와 정반대되는 프로그램과 기관이 다수 존재합니다. 우리는 이러한 사회 구조의 기형을 되돌리고 폐지해야 합니다."
 POL_cons_revert: "양립 불가한 프로그램 폐지"
 POL_cons_revert_desc: "이러한 정면 돌파에는 어느 정도 대가를 치러야 하겠지만, 이것이 유일한 방법입니다."
 POL_liberal_revert: "양립 불가한 프로그램 폐지"
 POL_liberal_revert_desc: "이러한 정면 돌파에는 어느 정도 대가를 치러야 하겠지만, 이것이 유일한 방법입니다."
