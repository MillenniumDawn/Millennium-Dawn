 JAP_glorious_decade_desc: "Не откладывая решение проблем, лежащих в основе стагнации, мы будем параллельно восстанавливать финансовый сектор, бизнес и спрос. При этом мы будем противостоять последствиям снижения рождаемости и «поколения ледникового периода занятости» и, уделяя особое внимание реформам системы труда и инвестициям в человеческий капитал, будем стремиться к достижению баланса между обеспечением благополучия домохозяйств и укреплением потенциала роста."
 JAP_inflation_target_desc: "Правительство и центральный банк четко обозначат направление политики по поддержке экономики, а также условия, при которых она будет сохраняться. Снизив неопределенность в отношении будущего и ослабив «выжидательную» позицию домохозяйств и предприятий, мы создадим более благоприятные условия для роста потребления и инвестиций."
 JAP_diplomacy.34.d: "В целях укрепления системы финансовой безопасности региона правительство Японии предложило расширить соглашение о валютных свопах с нашей страной в рамках «Чиангмайской инициативы». Обеспечение ликвидности в кризисные периоды может помочь успокоить рынки и способствовать экономической стабильности.\n\nСтоит ли нам принять это предложение и принять участие в укреплении финансового сотрудничества?"
 JAP_diplomacy.40.d: "Правительство Японии предложило нашей стране сотрудничество в рамках программы «Качественная официальная помощь в целях развития» (ODA) в сферах образования, развития человеческого потенциала и научных исследований в качестве поддержки, осуществляемой в координации с местными компаниями и учреждениями. Данное сотрудничество будет способствовать укреплению профессиональной подготовки и институционального потенциала, содействуя модернизации промышленности и инновациям. Принятие этого предложения также усилит влияние Японии в рамках АСЕАН.\n\nСтоит ли нам принять это предложение и укрепить человеческий капитал, а также научно-исследовательскую и опытно-конструкторскую деятельность?"
 JAP_diplomacy.41.d: "[FROM.GetName] одобрили предложение Японии о сотрудничестве в рамках программы «Качественная ОПР» в сферах образования, развития кадрового потенциала и научных исследований. По мере развития взаимодействия с местными компаниями и учреждениями будут укрепляться институциональный потенциал и технологическая база этой страны, что будет способствовать устойчивому росту. Данное соглашение, несомненно, усилит влияние Японии в рамках АСЕАН."
 JAP_diplomacy.42.d: "[FROM.GetName] сообщила, что отклонит предложение о сотрудничестве в рамках «качественной ОПР» в сферах образования, развития кадрового потенциала и научных исследований. По всей видимости, данная страна уделяет приоритетное внимание внутренним задачам и институциональной подготовке, однако это не означает, что она отвергает само предложение. Япония должна учитывать обстоятельства другой страны, сохраняя при этом открытыми каналы для диалога."
 JAP_diplomacy.49.d: "Правительство Японии выступило с предложением создать «Японско-тайваньскую платформу знаний по обеспечению готовности к стихийным бедствиям» для обмена опытом и наработками в сфере ликвидации последствий стихийных бедствий, исходя из нашей общей уязвимости перед стихийными бедствиями. Путем стандартизации обмена информацией, проведения совместных учений и разработки процедур восстановления планируется укрепить потенциал реагирования на чрезвычайные ситуации и ускорить восстановительные работы. Ожидается, что в случае реализации этого сотрудничества удастся сократить ущерб и ускорить восстановление."
 JAP_diplomacy.50.d: "Правительство Японии выступило с инициативой «Сотрудничество между Японией и Тайванем в сфере высоких технологий», которая предусматривает налаживание связей между научно-исследовательскими учреждениями и частными компаниями Японии и Тайваня с целью развития совместных исследований в области передовых гражданских технологий. Благодаря совместному использованию исследовательских ресурсов, ведению совместных разработок и содействию обмену инженерами планируется ускорить инновационный процесс, а также повысить производительность и конкурентоспособность промышленности. Если это сотрудничество укоренится, оно станет основой для долгосрочного роста в секторах гражданских технологий обеих стран."
 JAP_diplomacy.56.t: "Проект культурного сотрудничества «Китайская культурная сфера»"
 JAP_diplomacy.56.d: "Правительство Японии выступило с предложением о реализации проекта культурного сотрудничества между Японией и Китаем, направленного на укрепление культурных связей в рамках «китайской культурной сферы», имеющей общие исторические корни. Посредством академических обменов, культурных инициатив и сотрудничества в сфере СМИ и образования ставится цель сделать общие ценности и исторические связи более заметными и использовать их в качестве культурного буфера, защищающего от внешнего влияния. Ожидается, что реализация этой концепции также укрепит «мягкую силу», способствующую формированию более благоприятного международного имиджа."
 JAP_diplomacy.59.d: "Правительство Японии выступило с предложением о реализации «Инициативы по региональному деловому обмену», направленной на институционализацию деловых контактов на местном уровне и содействие сотрудничеству между региональными компаниями Японии и Южной Кореи. Посредством мероприятий по налаживанию деловых контактов, совместных выставок, согласования цепочек поставок, а также обмена технологиями и ноу-хау планируется оживить региональную экономику и ускорить рост гражданских отраслей. Если эта структура укоренится, расширится практическое сотрудничество, не зависящее в чрезмерной степени от руководства центрального правительства, что укрепит промышленные сети, движимые частным сектором."
 JAP_historical.20010426.d: "Ёсиро Мори объявил об отставке с поста премьер-министра, пробыв на этой должности всего один год. Его рейтинг одобрения снизился, а разрыв между ним и общественностью, символом которого стали его высказывание о «божественной нации» и его действия в связи с инцидентом с судном «Эхиме Мару», только углубился.\n\nПреемником Мори на посту лидера ЛДП был избран Дзюнъитиро Коидзуми, привлекший внимание всей страны своим смелым заявлением о «разрушении ЛДП» и проведший яркую, широко освещаемую кампанию. Ожидания общественности были высоки, и он одержал убедительную победу на региональных выборах.\n\nОбладая стилем и сценическим обаянием, которые резко отличались от традиций старой Либерально-демократической партии, Коидзуми, вступив в должность премьер-министра, поднял знамя «реформ».\nОднако что может возникнуть из руин, которые он поклялся разрушить, пока никто не знает."
 JAP_historical.20060926.d: "Премьер-министр Дзюничиро Коидзуми, возглавлявший правительство на протяжении более пяти лет, объявил о намерении уйти в отставку по истечении срока своих полномочий в качестве председателя ЛДП. Хотя Коидзуми публично заявлял о своём желании уйти в отставку по окончании срока полномочий, общественная поддержка его оставалась высокой, и многие в партии продолжали призывать к продлению его пребывания на посту.\n\nМежду тем в рядах ЛДП в качестве главного претендента на преемственность выдвинулся Синдзо Абэ, который стремительно продвинулся по карьерной лестнице и в молодом возрасте занял пост генерального секретаря кабинета министров. Благодаря своей молодости, известности, политическому происхождению и символическому статусу фигуры «после Коидзуми» он пользовался широкой поддержкой во всех слоях партии.\n\nКто лучше подходит для того, чтобы вести страну вперёд: опытный действующий лидер или новый лидер, готовый передать эстафету следующему поколению? Пришло время принять решение."
 JAP_historical.20070926.d: "Премьер-министр Синдзо Абэ неожиданно объявил о намерении уйти в отставку, сославшись на растущие трудности в управлении правительством. С момента его вступления в должность прошел всего один год. На фоне череды министерских скандалов основы его администрации были серьезно пошатнуты.\nВ связи с его отставкой некоторые члены Либерально-демократической партии (ЛДП) выступили за привлечение бывшего главы кабинета министров Ясуо Фукуды, argumenting that «для восстановления доверия общественности необходимо новое лицо». Однако многие по-прежнему решительно выступают за то, чтобы Абэ остался на посту.\n\nЯпония сейчас находится в состоянии политической нестабильности. Настало время решить, кто возглавит страну."
 JAP_historical.20080924.d: "Премьер-министр Ясуо Фукуда неожиданно провел пресс-конференцию в Кабинете премьер-министра, чтобы объявить о своей отставке.\n\nВ ходе пресс-конференции он заявил: «Ради благополучия людей я надеюсь, что новая команда будет проводить политику», продемонстрировав спокойное отношение к смене руководства. Однако, поскольку он не объяснил четко причины своей отставки, это заявление вызвало у многих граждан недоумение и неуверенность.\nВ ответ на это Либерально-демократическая партия быстро приступила к подготовке к выборам лидера. Генеральный секретарь Таро Асо стал ведущим кандидатом, быстро заручившись поддержкой различных фракций партии. Тем не менее, небольшая группа представителей внутри партии по-прежнему призывает Фукуду остаться на посту.\n\nЧтобы преодолеть политический застой, нужны ли стране перемены? Или в данный момент для Японии важнее стабильность? Пришло время принять решение."
 JAP_focus_renewable_energy_decision_repeal: "Отмена приоритета возобновляемых источников энергии"
 JAP_focus_renewable_energy_decision_repeal_desc: "Отказ от обязательств по развитию возобновляемой энергетики знаменует собой сдвиг в политике, отход от инвестиций в солнечную и ветровую энергетику, что позволит правительству перенаправить ресурсы на другие приоритетные направления в энергетике."
 JAP_focus_thermal_power_decision_repeal: "Отмена приоритета электростанций, работающих на ископаемом топливе"
 JAP_focus_thermal_power_decision_repeal_desc: "Отмена расширения электростанций, работающих на ископаемом топливе, знаменует собой сдвиг в политике от инвестиций в угольную, нефтяную и газовую энергетику, что позволит правительству перенаправить ресурсы на другие приоритетные направления в энергетике."
 JAP_historical.121006001.t: "2000 Тотторийское землетрясение"
 JAP_historical.121006001.d: "Япония состоит из вулканических архипелагов, плавающих на Огненном кольце. Это означает, что японцы постоянно сталкиваются с мощными землетрясениями. Это не изменилось в прошлом тысячелетии и не изменится в следующем.\n\n13:30, 6 октября 2000 года — землетрясение магнитудой 7.3 и силой 6+ по шкале JMA произошло на западе префектуры Симане. Оно нанесло серьёзный ущерб дорогам и домам и вызвало толчки в отдалённых регионах, таких как Осака и Фукуока. Особенно сильно землетрясение ощущалось в Кобе — впервые со времени Великого землетрясения Хансин-Аважи 1995 года."
 JAP_historical.disaster_help: "Помогите им сейчас!"
 JAP_historical.disaster_leave: "Оставьте их. Они восстановятся сами."
 JAP_historical.130210001.t: "Катастрофа «Эхимэ-Мару»"
 JAP_historical.130210001.d: "9 февраля 2001 года учебное судно «Эхимэ-Мару», принадлежащее рыболовному училищу, было сбито подводной лодкой США Greeneville. На борту «Эхимэ-Мару» находились 35 японских студентов и преподавателей; судно затонуло, 9 человек погибло.\n\nПока представители обоих правительств собирают информацию об этой трагедии, премьер-министр [Root.GetLeader] отдыхает, играя в гольф.\n\nКонечно, он должен немедленно прервать отпуск и вернуться в Токио, не так ли?"
 JAP_historical.130210001.oA: "Вернуться в Токио сейчас!"
 JAP_historical.130210001.oB: "Подождите! Ещё один удар..."
 JAP_historical.130324001.t: "2001 Геёское землетрясение"
 JAP_historical.130324001.d: "15:27, 24 марта 2001 года землетрясение магнитудой 6.7 и силой 6- по шкале JMA произошло на западе префектуры Хиросима. Двое человек погибли, 288 получили ранения. Город Курэ, ближайший к эпицентру, понёс наибольшие разрушения. С другой стороны, многие местные власти смогли уменьшить ущерб, поскольку их города приняли контрмеры после Великого землетрясения Хансин-Аважи 1995 года и землетрясения в Симане прошлого года. Основной ущерб был причинён разрушением водопроводных труб и обрушением поверхности склонов гор."
 JAP_historical.9130901001.t: "Пожар в здании Кабукичо"
 JAP_historical.9130901001.d: "Перед рассветом 1 сентября 2001 года здание \"Myojo 56 Building\" в Кабукичо, районе Синдзюку в Токио, загорелось, и пожар унёс жизни 44 человек, посетивших зал для игры в маджонг и стриптиз-клуб, отравившись угарным газом. По данным пожарной службы, сначала огонь был небольшим, но взорвался эффектом обратной тяги, когда сотрудник, заметивший возгорание, открыл дверь. В докладе также говорится, что пожарные сигнализации были закрыты потолком или отключены из-за неисправности, поэтому раннее тушение не состоялось. Имеются также сообщения, что персонал здания не направил посетителей к эвакуации. Тем временем столичная полиция совместно с пожарной службой обнаружила, что газовая труба была повреждена ненормально. Хотя причина пожара до сих пор не установлена — случайный инцидент или поджог, — ясно, что недостаток культуры пожарной безопасности сделал ситуацию хуже."
 JAP_historical.9130901001.oA: "Надеемся, больше никогда не увидим пожара хуже этого."
 JAP_historical.131201001.t: "Рождение её светлости принцессы Айко"
 JAP_historical.131201001.d: "1 декабря 2001 года в больнице Императорского дворца родилась дочь наследного принца Нарухито и его супруги Масако. Она, первая рожденная императорская принцесса третьего тысячелетия, получила имя Айко, взятое из учения Менция, классической китайской конфуцианской книги. Также её светлость принцесса Айко — внучка Его Величества императора Акихито. Это событие стало самым счастливым с момента рождения Его Светлости принца Фумихито Акисино-но-Мия в 1965 году, и почти вся страна праздновала. Затем 20 000 человек, включая политиков и знаменитостей, кричали «Бандзай» у Императорского дворца. С другой стороны, некоторые опасались, что это может поставить под угрозу нынешнюю линию Императорской семьи. Принцесса-консорт Масако уже была слишком взрослa, чтобы рожать ребёнка, поэтому рождение второго могло быть опасным. И если принцесса Айко вырастет, она может стать матрилатеральной императрицей «как последняя императорская семья», поскольку разница в возрасте между двумя принцами — Нарухито и Фумихито — велика. Но это нарушило бы Императорский домовой закон: на Императорский трон допускается только патрилатеральная линия. В конце концов все начали спорить о поправке к Императорскому домового закону, чтобы допустить матрилатеральную императрицу."
 JAP_historical.131201001.oA: "Бандзай!"
 JAP_historical.150526001.t: "2003 прибрежное землетрясение в Мияги"
 JAP_historical.150526001.d: "6:24 PM, May 26, 2003 - A magnitude 7.1 and scale 6- earthquake occurred in off the Miyagi-Iwate prefectural border and hit on. Large areas of Tohoku region have been suffered much damage like a destroy on trestles of the Sinkansen and landslides on mountains, but no one was killed. The tsunami was so gently like a ripple in this time. Although we have these reports, a lot of people have felt the quaking, from Hokkaido to Kanto."
 JAP_historical.150726001.t: "2003 второе подряд землетрясение в Мияги"
 JAP_historical.150726001.d: "26 июля 2003 года — целых четыре землетрясения подряд ударили по северной части префектуры Мияги в течение дня! Самое сильное зафиксировало магнитуду 6.4 и силу 6+ в 7:13 утра, а даже самое слабое — магнитуду 5.1 и силу 5-. Эти землетрясения нанесли ущерб не только сотням домов, но и военно-воздушной базе Сил самообороны Матсушима. Это был очень неприятный день, но, к счастью, никто не погиб."
 JAP_historical.150926001.t: "2003 землетрясение на Хоккайдо"
 JAP_historical.150926001.d: "4:50 AM, September 26, 2003 - A magnitude 8.0 and scale 6- earthquake occurred in off the Southern Hokkaido. Only a few towns have taken the quake strongly, but soonly they have been realised the true horrible aftermath. The earthquake caused a soil lequidisation in the coastal filled-up zone and fire on oil storage tanks. Besides that, a huge tsunami struck the east coast of Eastern Japan, and two was killed."
 JAP_historical.161023001.t: "Землетрясение в Тюэцу, Ниигата, 2004 год"
 JAP_historical.161023001.d: "5:56 PM, October 23, 2004 - A magnitude 6.8 and scale 7 earthquake occurred in Niigata. It was first time to record JMA Scale 7 since the revision by the 1995's Hanshin Earthquake. In Yamakoshi, all of roads had been destroyed by the landslides and every residents were locked in the village. A train had being run on the Joetsu Shinkansen Line got derailed by the shock but no one killed. However, as a result of the quake, 68 were killed."
 JAP_historical.170320001.t: "2005 фукуокское землетрясение"
 JAP_historical.170320001.d: "10:53 AM, March 20, 2005 - A magnitude 7.0 and scale 6- earthquake occurred in off Fukuoka City. There is less records of earthquakes in Northern Kyushu and this one was also largest one since 1922. In Genkai Island of Fukuoka City, about 700 peoples have evacuated and ten decided to remain for disaster communication and patrol. In Central of Fukuoka, most of windows are broken and these fragments fell into the pavement and injured two pedestrians. The earthquake shook not only Tsushima but also Korea and China. One people was killed by the quake."
 JAP_historical.170425001.t: "Крушение поезда на линии Фукуросимаяма"
 JAP_historical.170425001.d: "В 9:18 утра 25 апреля 2005 года поезд скоростного трамвая на линии Фукутияма (также известной как линия Такарадзука) компании JR West сошел с рельсов на крутом повороте в городе Амагасаки, префектура Хёго, и врезался в первый этаж расположенного неподалеку многоквартирного дома.\nПоезд состоял из семи вагонов, хотя в первоначальных сообщениях ошибочно утверждалось, что их было только шесть, поскольку головной вагон полностью застрял в здании. Расследование показало, что поезд вошел в поворот на скорости приблизительно 116 км/ч (72 мили в час), несмотря на то, что разрешенная скорость на этом участке составляла 70 км/ч (43 мили в час). Чрезмерная скорость, вероятно, стала причиной схода с рельсов из-за центробежной силы.\nВодитель погиб в аварии, но показания кондуктора из заднего вагона указывали на то, что экипаж, возможно, пытался компенсировать задержку примерно в 90 секунд. Позже стало известно, что в компании существовали строгие внутренние дисциплинарные меры даже за незначительные операционные ошибки. Эти меры включали в себя перевоспитание, переписывание правил компании от руки и другие корректирующие действия, истоки которых восходят к приватизации Японских национальных железных дорог (JNR) во время правления Накасонэ.\nК счастью, приближавшийся навстречу скоростной поезд смог совершить экстренную остановку из-за заблокированного пути, избежав вторичного столкновения. Однако, поскольку авария произошла в час пик утром, поезд был переполнен. В общей сложности погибли 107 человек, 562 получили ранения, что делает эту железнодорожную катастрофу самой смертоносной в послевоенной истории Японии. Некоторые медицинские специалисты отметили, что несколько пассажиров, возможно, погибли не сразу в результате столкновения, а позже из-за синдрома сдавливания, возникшего в результате длительного сжатия."
 JAP_historical.180906001.t: "Рождение его светлости принца Хисахито"
 JAP_historical.180906001.d: "6 сентября 2006 года в частной больнице в Минaми-Азабу родился сын принца Фумихито и его супруги Кико. Он, первый рожденный императорский принц в третьем тысячелетии, был назван Хисахито, что означает «Хиса» — «в расслабленном состоянии» и «Хито» — по императорской традиции Хэйанского периода. Он родился с помощью кесарева сечения в частной больнице, а не в Императорском дворце; это был первый такой случай в императорской истории. Это событие было воспринято как легитимное продолжение мужской линии престолонаследия, а также как рождение новой императорской семьи. После рождения мальчика спор о поправке к Императорскому домовому закону стал постепенно утихать."
 JAP_historical.180906001.oA: "Бандзай!"
 JAP_historical.190216001.t: "«Потерянная пенсия»"
 JAP_historical.190216001.d: "В 1997 году Агентство социального страхования Японии (SIA) приступило к объединению индивидуальных пенсионных дел в рамках единой системы «Базового пенсионного номера». Однако в 2006–2007 годах агентство обнаружило около 50 миллионов пенсионных записей, которые остались несопоставленными или содержали несоответствия из-за ошибок, допущенных при переносе бумажных документов в цифровой формат.\nНекоторые из этих отсутствующих записей касались нынешних получателей пенсий, что вызвало опасения по поводу того, что люди могли получать неверные суммы выплат. Кроме того, по имеющимся данным, некоторые записи были утеряны или ошибочно удалены при попытках обновить пенсионные данные работников.\nВ ответ на это [JAP.GetRulingParty] создало специальную рабочую группу для расследования данного вопроса и предложило принять чрезвычайное законодательство, чтобы оказать помощь пострадавшим. Тем не менее оппозиционные партии подвергают правительство резкой критике, а уровень недовольства населения остается высоким."
 JAP_historical.190216001.oA: "Какая катастрофа!"
 JAP_historical.190325001.t: "2007 землетрясение в Ното"
 JAP_historical.190325001.d: "9:41 утра 25 марта 2007 года — сильное землетрясение магнитудой 6.9 поразило регион Хокурику. По шкале JMA толчок оценён как 6+ в городе Вадзима, префектура Исикава, и это было самое сильное землетрясение с начала сейсмических наблюдений в 1922 году. Эпицентр, согласно сообщениям, находился в районе, где до сих пор не обнаружено разлома. Толчки достигли от префектуры Хоккайдо до префектуры Коти и вызвали цунами высотой 20 см (7,87 дюйма). Землетрясение унесло жизнь одного человека при обрушении каменной фонарной конструкции, ранило 356 человек и повредило более 30 000 зданий и домов."
 JAP_historical.190716001.t: "2007 прибрежное землетрясение в Чуэцу"
 JAP_historical.190716001.d: "10:13 утра 16 июля 2007 года — ещё одно землетрясение магнитудой 6.8 потрясло префектуру Ниигата. По шкале JMA оно оценивалось как 6+ в нескольких городах, но на АЭС Касивадзаки-Карива оно было неофициально вычислено как 7. Цунами также вызвано толчком и было зарегистрировано на 1 м (3,28 фута) в городе Касивадзаки. Землетрясение напрямую и вторично убило 15 человек, ранило 2 346 человек и повредило более 34 000 зданий, включая 1 331 разрушенный дом. На упомянутой АЭС Касивадзаки-Карива возник пожар, но тушение было задержано на два часа из-за ошибки в передаче сообщений на ранней стадии пожаротушения, что привело к утечке радиоактивных веществ, хотя она была в экологически незначимом уровне. Это землетрясение произошло всего через 4 месяца после землетрясения в Ното и через 3 года после разрушительного землетрясения Хансин 2004 года в Ниигате."
 JAP_historical.200614001.t: "2008 землетрясение внутри Иватэ-Мияги"
 JAP_historical.200614001.d: "8:43 утра 14 июня 2008 года — сильное землетрясение магнитудой 7.2 произошло под префектурой Иватэ. По шкале JMA оно оценивалось как 6+ в городах Курихара, префектура Мияги, и Осу, префектура Иватэ. Несмотря на то, что землетрясение было внутренним, толчки силой более 3 баллов были зарегистрированы от Хоккайдо до региона Канто. Это толчок, как редкое явление, повредил несколько зданий, но вызвал множество оползней и в итоге убил 17 человек, тяжело ранил 70 и ещё 356 получили лёгкие травмы, а 6 человек остались пропавшими без вести. Поступали сообщения об обрушении моста и повреждении культурных памятников."
 JAP_historical.210811001.t: "2009 землетрясение в заливе Суруга"
 JAP_historical.210811001.d: "5:07 утра 11 августа 2009 года — большое землетрясение магнитудой 6.5 произошло в заливе Суруга, убив одного человека и ранив 319. Толчок вызвал цунами высотой 40 см (1,31 фута). По шкале JMA землетрясение оценивалось как 6- во многих районах префектуры Сидзуока, были повреждены 8 678 домов и несколько исторических зданий, но ни один дом полностью не разрушен. Регион Токай, включающий префектуру Сидзуока, считается ключевой опасной зоной будущего Великого землетрясения Токай-Тонанкай и цунами, поэтому жители готовились: эвакуировались, укрепляли мебель и укрепляли свои дома и здания. Это было причиной меньшего числа жертв и ущерба по сравнению с масштабом толчка. Тем не менее были сообщения о повреждении заводов, чайных плантаций и автомагистрали Томеи."
 JAP_diplomacy.16.t: "Японский тупик"
 JAP_diplomacy.16.d: "Токио продолжает сопротивляться расширению толкования статьи 9. Вашингтон должен решить, насколько далеко он готов зайти и какой ценой."
 JAP_diplomacy.16.a: "Оставьте этот вопрос. Наши другие интересы в регионе имеют приоритет."
 JAP_diplomacy.16.b: "Отменяем наши гарантии безопасности для Японии."
 JAP_diplomacy.16.c: "Ввести торговые пошлины на японский экспорт."
 JAP_diplomacy.16.e: "Установить морскую блокаду Японии."
 JAP_asteroid_mining_network_established: "Создана сеть для добычи ресурсов на астероидах для [JAP.GetNameWithFlag]"
 JAP_asteroid_mining_operation_active: "В настоящее время проводится операция по добыче полезных ископаемых на астероиде."
 JAP_claiming_taiwan_tt: "Это выдвигает японские претензии на все островные государства Тайваня одновременно. После того, как претензии будут обоснованы, завершите фокус, требующий от Тайваня подчинения."
 JAP_improvement_private_investment_climate_idea: "Улучшение инвестиционного климата для частного сектора"
 JAP_improvement_private_investment_climate_idea_desc: "Одних только государственных расходов недостаточно для завершения восстановления. Необходимо вселить в компании уверенность, чтобы они снова начали инвестировать, и снизить неопределенность в отношении будущего. Для устойчивого восстановления необходимо, чтобы предприятия перешли от оборонной промышленности к расширению."
 JAP_demographic_crisis: "Unprecedented Measures for the Crisis"
 JAP_demographic_crisis_desc: "Japan's Children and Families Agency coordinates a whole-of-government response to demographic decline: pronatalist incentives, female workforce mobilization, or immigration reform. The Diet commits to only one pathway. Each pays its bill in a different currency: cash allowances, workforce disruption, or cultural transformation."
 JAP_demographic_crisis_tt: "Marks the beginning of Japan's response to its demographic decline. The three strategies that follow are mutually exclusive."
 JAP_immigration_backlash_opposition_tt: "§RImmigration backlash:§! anti-immigration sentiment swells the nationalist opposition"
 JAP_immigration_backlash_stability_tt: "§RImmigration backlash:§! anger over the influx of foreigners erodes stability"
 JAP_traditionalist_backlash_opposition_tt: "§RTraditionalist backlash:§! conservative anger at the retreat of the traditional family swells the nationalist opposition"
 JAP_traditionalist_backlash_stability_tt: "§RTraditionalist backlash:§! conservative anger at the retreat of the traditional family erodes stability"
 JAP_japan_belongs_to_the_japanese: "Japan Belongs to the Japanese"
 JAP_japan_belongs_to_the_japanese_desc: "Japan will raise the birthrate through family allowances, pronatalist incentives, and cultural renewal. The state commits to permanent welfare spending regardless of whether births rise. This path trades the fiscal uncertainty of decline for the certainty of irreversible entitlements."
 JAP_pronatalist_turn: "Plus One Initiative"
 JAP_pronatalist_turn_desc: "Japan will launch a comprehensive campaign to encourage childbearing as a civic priority, drawing inspiration from the 'Plus One' strategy of the early 2000s. Through tax incentives, public messaging, and cultural recognition of families with multiple children, the state will shift social attitudes toward larger families while providing concrete support that makes parenthood more affordable and appealing."
 JAP_national_revival_campaign: "Regional Revitalization Initiative"
 JAP_national_revival_campaign_desc: "Japan will channel investment into the regions, reviving local communities that have hollowed out as young people drift toward Tokyo. By creating jobs, improving amenities, and restoring faith in provincial Japan, we aim to anchor families outside the metropolis and slow the concentration of population that deepens rural decline. Strong regions are the foundation for stable families and sustainable birth rates."
 JAP_three_generation_household: "The Three-Generation Household"
 JAP_three_generation_household_desc: "Japan will subsidize three-generation households through tax incentives and housing support, reviving an arrangement where grandparents provide childcare and elder care without market wages. The state offloads welfare costs onto family bonds, reducing its own spending. Care given at home is care the state does not pay for."
 JAP_homeland_production_drive: "Monozukuri at Home"
 JAP_homeland_production_drive_desc: "Japan will deepen its commitment to domestic manufacturing, investing in automation and worker training to maximize output from a shrinking workforce. Rather than offshore production or hire migrants, Japan pursues the monozukuri tradition, the art of making things well. The tradeoff is energy strain and higher costs."
 JAP_incentivize_large_families: "Expanded Child Allowance"
 JAP_incentivize_large_families_desc: "Japan will expand the jido teate child allowance with generous cash grants rising with each additional child. By making parenthood more affordable, the state removes a binding constraint on family size. Once written into law, the allowance becomes a permanent entitlement no future government will dare to cut."
 JAP_state_family_mandate: "The Family as State Imperative"
 JAP_state_family_mandate_desc: "Japan will mandate family formation through employment law, pension incentives, and social messaging pressuring women toward motherhood and men toward parenthood. This is the cheap answer: the state spends little while conscripting citizens into reproduction. The cost is legitimacy and resentment."
 JAP_a_nation_reborn: "A Nation Reborn"
 JAP_a_nation_reborn_desc: "The birthrate has stabilized and begun to rise, motherhood is honored, and regional communities are revitalized. Japan has reversed demographic decline through sustained pronatalist investment. Two decades of allowances, housing subsidies, and elder care have hardened into entitlements no future government can cut."
 JAP_womenomics: "Womenomics"
 JAP_womenomics_desc: "Japan will mobilize women across all economic sectors by dismantling barriers, providing childcare, and shifting corporate culture. This unlocks productive capacity and tax revenue without producing additional children. The state must build and staff the childcare system, and conservative Japan will read it as an attack on the family."
 JAP_eliminate_daycare_waitlists: "Zero Waitlisted Children Initiative"
 JAP_eliminate_daycare_waitlists_desc: "Japan will implement the Childrearing Safety Plan, expanding nurseries, daycare centers, and after-school care until the waiting lists are gone. Heavy investment in worker wages and facility construction removes the binding constraint on female workforce participation. These facilities must be staffed and funded in perpetuity."
 JAP_reform_spousal_tax_deduction: "Dismantle the 1.03 Million Yen Wall"
 JAP_reform_spousal_tax_deduction_desc: "Japan will eliminate the spousal tax deduction cliff at 1.03 million yen and restructure the social insurance thresholds behind it. This removes the penalty on full-time employment that has locked millions of women into part-time work. Demolishing the wall releases a vast pool of experienced, educated women into full-time employment."
 JAP_normalize_parental_leave: "Ikumen Campaign"
 JAP_normalize_parental_leave_desc: "Japan will launch the Ikumen campaign, guaranteeing paid parental leave to both parents and pressuring men to take it. When fathers routinely become caregivers, women are no longer trapped by motherhood and the burden is shared. Firms will bear the cost in lost output, and the salaryman generation will not concede quietly."
 JAP_women_in_management: "The 202030 Initiative"
 JAP_women_in_management_desc: "Japan will pursue the 202030 goal: three in ten leadership positions held by women. The Act on Promotion of Women's Participation and Advancement in the Workplace sets binding corporate and public-sector targets, enforces disclosure, and rewards the firms leading the shift. Women will hold meaningful power in every boardroom and civil-service bureau."
 JAP_family_first_model: "Work Style Reform: Family Path"
 JAP_family_first_model_desc: "The Work Style Reform movement will prioritize the family pathway: flexible scheduling, part-time career tracks, and expanded child allowances will make it possible for women to stay in the workforce without sacrificing the possibility of motherhood. This path accepts lower overall output to preserve both careers and births, betting that social stability and modest demographic recovery matter more than maximum economic growth."
 JAP_career_first_model: "Work Style Reform: Career Path"
 JAP_career_first_model_desc: "The Work Style Reform movement prioritizes the career pathway: no flexibility, no part-time tracks, but genuine equality in advancement and pay. Women compete on equal footing for every position, maximizing economic output and female income. This makes motherhood harder, and birth rates will fall further as many choose ambition over family."
 JAP_a_society_where_women_thrive: "A Society Where Women Thrive"
 JAP_a_society_where_women_thrive_desc: "Structural barriers have fallen and women work at every level with genuine equality and choice, deepening the labor force and the tax base alike. What the reform never delivered was children. Japan works more and earns more, still shrinking, sustained by a childcare and education apparatus the state must fund forever."
 JAP_open_japan: "Open Japan"
 JAP_open_japan_desc: "Japan will systematically draw workers from abroad through migration pacts, skills-based immigration, and visa reform to fill the labor gap. This closes the labor shortage within years rather than decades, securing full employment and pension solvency. Cultural identity comes under strain, communities change faster than consent, and every step invites nationalist backlash."
 JAP_labor_migration_pact: "Bilateral Labor Mobility Agreements"
 JAP_labor_migration_pact_desc: "Japan will formalize bilateral labor arrangements with neighboring countries, expanding the Technical Intern Training Program and establishing new reciprocal agreements to bring workers into construction, agriculture, nursing care, and manufacturing. These pacts are rapid and efficient: tens of thousands of workers can be onboarded within months, filling critical labor gaps and stabilizing employment in sectors that would otherwise contract or disappear entirely."
 JAP_points_based_immigration: "Highly Skilled Professional Program"
 JAP_points_based_immigration_desc: "Japan will establish a points-based system for highly skilled professionals, awarding points for qualifications, work experience, language ability, and prior residence. Engineers, nurses, researchers, and finance professionals fill high-value jobs and ease the constraint on growth. Skilled arrivals bring families and expect international schooling, a cost the state absorbs in exchange for research capacity it could not otherwise buy."
 JAP_integration_programs: "Tabunka Kyosei Integration Framework"
 JAP_integration_programs_desc: "Japan will invest in active integration, tabunka kyosei, through language classes, community centers, and permanent residency pathways for migrant workers and their families. Newcomers given the tools to belong generate less friction and contribute more fully. Language instruction, schooling, and welfare for migrant families become a standing budget charge that buys back what unmanaged migration costs in policing."
 JAP_multicultural_society: "A Multicultural Society"
 JAP_multicultural_society_desc: "Japan extends legal status, civic participation, and cultural recognition to migrants and their children as full members of the national community. It is a profound break with historical insularity, turning potential resentment into belonging and sustaining social stability. Full civic and welfare rights for millions of new Japanese are expensive, permanent entitlements that will not come off the education and social accounts again."
 JAP_guest_worker_system: "Specified Skilled Worker Visa Expansion"
 JAP_guest_worker_system_desc: "Japan will expand the Specified Skilled Worker visa, tokutei gino, bringing workers on fixed-term contracts for construction, agriculture, nursing care, and manufacturing. They come, do the work, and return home when the contract ends, filling the labor gap without the friction of permanent immigration. It creates a rotating population with few protections and no stake in the community, and policing it becomes a standing business cost."
 JAP_an_open_nation: "An Open Nation"
 JAP_an_open_nation_desc: "Japan's population has stabilized and grown through migration, transforming a monoethnic country into a multicultural one. Economic stability and pension solvency are preserved, but the sense of ethnic homogeneity has fractured and the older generation mourns a nation passing away. Policing, schooling, and social provision for a population that arrived faster than institutions were built will stay elevated for a generation."
 JAP_economic_sectors: "Japan's Economic Sectors"
 JAP_economic_sectors_desc: "From locally rooted agriculture, forestry, and fisheries to manufacturing, services, and advanced technologies, we will bring out Japan's strengths across the entire industrial landscape. While supporting domestic employment and supply capacity, we will balance export competitiveness with investment in new growth fields, carrying our industrial foundation forward into the next era."
 JAP_agricultural_revitalization: "Revitalizing the Primary Industries"
 JAP_agricultural_revitalization_desc: "The Ministry of Agriculture, Forestry and Fisheries revises the Basic Act for the first time in a quarter century, binding all three sectors into a unified national strategy for food security. As the average farmer ages toward seventy and fields abandon across the countryside, this integration becomes the foundation for rural recovery and every reform that follows."
 JAP_corporate_farm_consolidation: "Farmland Banks and the End of Gentan"
 JAP_corporate_farm_consolidation_desc: "The Farmland Consolidation Banks gather scattered plots into larger holdings while the abolition of the gentan rice quota ends half a century of paying farmers to leave fields fallow. Mechanization and market discipline will lift productivity, but small family growers unable to compete will be pushed from the land."
 JAP_revitalize_rural_communities: "The Regional Revitalization Strategy"
 JAP_revitalize_rural_communities_desc: "Under the banner of chiho sosei, the government sustains farming in remote districts through direct payments and channels urban wealth back to villages via the hometown tax, enticing young families to settle where fields would otherwise return to wilderness. Growth here is slower than corporate consolidation, but it keeps the countryside alive."
 JAP_smart_rice_farming: "Smart Farming and the Craft of Sake"
 JAP_smart_rice_farming_desc: "Japan pairs rice heritage with smart agriculture: satellite guidance, drones, and sensor-driven paddies let a shrinking, aging workforce tend more land with fewer hands. Premium brands such as Koshihikari and the global thirst for Japanese sake carry the harvest to tables at home and abroad."
 JAP_premium_wagyu_brand: "The Wagyu Export Brand"
 JAP_premium_wagyu_brand_desc: "Building on protected geographical indications and the law shielding wagyu genetics from smuggling, Japan develops the breed into a premium export commanding its price on provenance and quality rather than volume. The finest restaurants of the world will carry Japanese beef."
 JAP_sustainable_fisheries: "The Fisheries Act Reform"
 JAP_sustainable_fisheries_desc: "The 2018 reform of the Fisheries Act, the first overhaul in seventy years, imposes science-based catch quotas and rewards responsible fishing while pouring investment into aquaculture from farmed bluefin to coastal shellfish. Sustainable seas will keep coastal towns working and the nation's food culture supplied."
 JAP_forestry_revival: "The Forest Environment Tax"
 JAP_forestry_revival_desc: "Funded by the Forest Environment Tax, Japan thins and replants neglected cedar and cypress plantations, mechanizes logging, and promotes cross-laminated timber so domestic wood returns to construction sites. A revived forestry sector brings work back to the mountain villages and turns a long-idle resource into national strength."
 JAP_pharmaceutical_powerhouse: "Confronting the Drug Lag"
 JAP_pharmaceutical_powerhouse_desc: "Japan's third-largest pharmaceutical market is held by Takeda, Astellas, Daiichi Sankyo, and Chugai, yet a widening drug lag leaves patients waiting years for overseas medicines. The government streamlines PMDA approval and backs biotech and regenerative medicine, turning a mature industry into an engine of high-value growth."
 JAP_rural_revitalization: "The Sixth Industrialization"
 JAP_rural_revitalization_desc: "Under the sixth industrialization, rokuji sangyoka, primary producers also process and sell what they produce. Farm-stays, branded regional foods, and direct-to-consumer sales turn struggling villages into destinations, drawing young families back to the land as the most reliable anchor against the demographic tide."
 JAP_agricultural_construction_drive: "Agricultural Construction Drive"
 JAP_agricultural_construction_drive_desc: "A concerted national push to break ground on new farmland and rural facilities while the political will and subsidies are aligned, accelerating construction across the countryside."
 JAP_automotive_industry: "The Wheels of the Nation"
 JAP_automotive_industry_desc: "Seven Japanese makers together assemble eight million vehicles a year, sustaining roughly one in twelve Japanese jobs including parts makers, dealers, and haulers. From Aichi's assembly halls to Yokohama's export wharves, Japan will defend its place as the world's largest vehicle exporter."
 JAP_lean_production_system: "The Toyota Production System"
 JAP_lean_production_system_desc: "The Toyota Production System has shaped modern manufacturing through just-in-time delivery, jidoka, and kaizen pursuit of eliminating muda, letting Japanese plants build more cars with fewer defects and less inventory than any rival. Japan will spread lean discipline across industry, training a generation to see waste where others see none."
 JAP_keiretsu_supplier_network: "The Keiretsu Supplier Web"
 JAP_keiretsu_supplier_network_desc: "Behind every finished car stands a pyramid of suppliers bound by decades of trust: Denso, Aisin, Toyota Industries, and thousands of smaller shops each a master of its craft through monozukuri discipline. Japan will deepen these keiretsu ties and guarantee survival of tier-two and tier-three suppliers, making supply chain resilience a strategic asset."
 JAP_precision_machine_tools: "The Robots That Build the Cars"
 JAP_precision_machine_tools_desc: "FANUC and Yaskawa dominate the world market for industrial robots, while Yamazaki Mazak, DMG Mori, and Okuma set the standard in precision machine tools. As the workforce ages and shrinks, Japan will invest heavily in robotics and mechatronics, keeping the nation the workshop that equips the factories of the world."
 JAP_domestic_champions: "The Lexus Standard"
 JAP_domestic_champions_desc: "Lexus proved Japan could challenge the German luxury houses on their own ground, a lesson that has since spread across the industry. Japan will cultivate the brand value of its engineering and chase the high-margin segments, competing on quality and prestige rather than price alone."
 JAP_hybrid_powertrains: "The Hybrid Revolution"
 JAP_hybrid_powertrains_desc: "The Prius proved Japan could gamble where others feared, marrying petrol engine and electric motor without demanding the charging network the world did not yet have. Japan will double down on this hybrid path, refining it into the pragmatic bridge between the age of oil and whatever comes next."
 JAP_battery_electric_shift: "The Battery Electric Gamble"
 JAP_battery_electric_shift_desc: "The Nissan Leaf was the first mass-market electric car, yet Japan has since watched rivals race ahead on pure battery power. To catch up, the government commits to crash programs in solid-state cells and a wave of domestic gigafactories, so the most valuable part of the car is built at home."
 JAP_hydrogen_society: "Toward a Hydrogen Society"
 JAP_hydrogen_society_desc: "The Mirai fuel-cell sedan and the Basic Hydrogen Strategy set out a vision where cars, trucks, homes, and power stations run on the most abundant element in the universe, emitting nothing but water. Japan will build the refuelling network and back the fuel-cell makers, pursuing hydrogen as a distinctly Japanese answer to the end of combustion."
 JAP_automotive_superpower: "The Mobility Superpower"
 JAP_automotive_superpower_desc: "Japan will not be forced to choose a single road into the future. By mastering the hybrid, the battery, and the fuel cell all at once while keeping the lean plants and the supplier web that build them the finest in the world, Japan secures its place as the mobility superpower of the century."
 JAP_automotive_retooling_drive: "Assembly Line Retooling"
 JAP_automotive_retooling_drive_desc: "A national drive to retool and modernize the automotive assembly lines, re-laying the plants for the next generation of vehicles while investment and political will are aligned."
 JAP_battery_gigafactory_program: "Battery Gigafactory Program"
 JAP_battery_gigafactory_program_desc: "A concentrated push to stand up domestic battery gigafactories, ramping cell production capacity at speed so that the heart of the electric car is built at home rather than imported."
 JAP_motorcycle_kingdom: "Kingdom of Two Wheels"
 JAP_motorcycle_kingdom_desc: "Honda, Yamaha, Kawasaki, and Suzuki build the overwhelming majority of powered two-wheelers on Earth, from commuter step-throughs moving hundreds of millions across Southeast Asia to liter-class superbikes dominating the MotoGP and World Superbike grids. Japan will invest in two-wheel plants and defend the engineering lead that keeps rivals chasing Japanese engines a generation behind."
 JAP_kei_car_mobility: "The Kei Car Nation"
 JAP_kei_car_mobility_desc: "Nearly two in five new cars sold in Japan belong to the kei class, minicars capped at 660cc by a tax code written for a poorer country, and as the population ages outside the cities the kei car becomes the last practical way for pensioners to reach the clinic or the shop. Japan will keep the kei class affordable and well-built, sustaining mobility where the trains no longer run."
 JAP_jdm_soft_power: "The Gran Turismo Nation"
 JAP_jdm_soft_power_desc: "The Skyline GT-R, the Supra, and the RX-7 have become global icons of car culture through anime such as Initial D and the Gran Turismo franchise, which taught a generation of players to love the JDM badge. Japan will cultivate this export of image alongside steel, backing tuner shops, touge culture, and the motorsport heritage that make Japanese performance cars objects of worldwide devotion."
 JAP_export_wharves: "The Export Wharves"
 JAP_export_wharves_desc: "Roughly half of every vehicle assembled in Japan rolls onto car carriers at Yokohama, Nagoya, or Kobe, bound for ports across the world, making Japan the largest vehicle exporter on the planet. The government will expand the wharves, marshalling yards, and carrier fleet that keep this flow of automobiles moving outward without interruption."
 JAP_automotive_export_drive: "Automotive Export Drive"
 JAP_automotive_export_drive_desc: "A time-limited national push to expand assembly and export-plant capacity, adding shifts and floor space at the car and component plants while the export order books are full."
 JAP_electronics_revitalization: "Revitalizing Electronics and Semiconductors"
 JAP_electronics_revitalization_desc: "Japan's electronics industry has been driven out of markets it once ruled by competitors in Korea, Taiwan, and China. Under METI's semiconductor revitalization strategy, the state marshals the surviving strengths in materials, tools, and precision engineering to rebuild competitive capacity. The old mastery of the chip can be recovered if the investment flows now."
 JAP_semiconductor_materials: "Masters of Materials and Equipment"
 JAP_semiconductor_materials_desc: "Japan never lost its grip on the upstream of the chip supply chain: Tokyo Electron dominates deposition and etch tools, Shin-Etsu and SUMCO supply the world's silicon wafers, and JSR and Tokyo Ohka hold the photoresist market. The government expands investment in that leverage, leaving every foreign foundry dependent on Japanese materials and Japanese machines."
 JAP_rapidus_moonshot: "The Rapidus Moonshot"
 JAP_rapidus_moonshot_desc: "Rapidus, backed by Toyota, Sony, and the state, races to build a two-nanometre fab at Chitose in Hokkaido in partnership with IBM and imec. No Japanese firm has touched the cutting edge in years and the gap to TSMC is measured in billions. If it lands, Japan re-enters the frontier of the industry in a single bound."
 JAP_foundry_partnership: "The Kumamoto Foundry Partnership"
 JAP_foundry_partnership_desc: "Where Rapidus gambles on the cutting edge, JASM in Kumamoto partners with TSMC and Sony to produce mature nodes for automobiles and sensors. It is a lower ceiling than the moonshot and a floor beneath the economy: chips made at home, in volume, for the industries that cannot afford to run short."
 JAP_semiconductor_sovereignty: "Semiconductor Sovereignty"
 JAP_semiconductor_sovereignty_desc: "Design houses, tool makers, material suppliers, and fabs are knitted into a self-sustaining domestic ecosystem. In an age of export controls and choke points, Japan will not again stand dependent on foreign goodwill for the silicon its economy runs on."
 JAP_home_electronics: "The Ghost of the Galapagos"
 JAP_home_electronics_desc: "The Galapagos syndrome left Japanese consumer electronics brilliant at home and unfit for sale abroad, and the gara-kei feature phone was obsolete the moment the smartphone landed. Sharp, Sony, and Panasonic have been driven from markets they once ruled. The state steadies what remains, keeping the assembly lines and the craft alive while the industry finds its footing."
 JAP_gaming_powerhouse: "The Gaming Powerhouse"
 JAP_gaming_powerhouse_desc: "Nintendo's consoles rank among the best-selling ever made, Sony's PlayStation anchors a global empire, and Capcom, Sega, Square Enix, and Bandai Namco supply the software behind both. The government expands studio and hardware investment and widens the talent pipeline that keeps Japan at the centre of interactive entertainment."
 JAP_rights_and_licensing_regime: "Rights and Licensing Abroad"
 JAP_rights_and_licensing_regime_desc: "Anime, manga, games, and music carry Japan's image further than any embassy, and the Cool Japan initiative exists to convert that reach into revenue. The state invests in distribution, translation, and rights management so creative output earns abroad instead of leaking there. Every licence is signed under foreign contract law and foreign broadcast standards, and the industry learns that one deal at a time."
 JAP_broadband_nation: "A Nation on Fibre"
 JAP_broadband_nation_desc: "NTT and its rivals laid fibre to the home while much of the world still crawled on copper, giving Japan some of the fastest and cheapest connectivity on earth. The government extends high-capacity fibre into the last underserved valleys and islands so no corner of the country is cut off from the digital economy."
 JAP_beyond_5g: "Toward Beyond 5G"
 JAP_beyond_5g_desc: "Japan was shut out of the smartphone wars and does not intend to miss Beyond 5G. The state funds research consortia and open network architectures, from the radio access network to the optical backbone, so Japanese firms set the terms of the networks of the 2030s rather than merely buying them."
 JAP_electronics_superpower: "Electronics Superpower Once More"
 JAP_electronics_superpower_desc: "Materials, fabs in Hokkaido and Kyushu, consoles, and fibre infrastructure now complete the whole electronics architecture. The old master of the silicon age has fought its way back to the frontier. Seoul, Taipei, and Shanghai must reckon with Japan's return."
 JAP_energy_resource_strategy: "The Strategic Energy Plan"
 JAP_energy_resource_strategy_desc: "The Ministry of Economy, Trade and Industry coordinates the Basic Energy Plan across power generation, grid resilience, and resource security to insulate the nation from energy shocks. From nuclear to renewables to strategic reserves, this office directs the whole apparatus of the state toward keeping the lights on and the smelters fed."
 JAP_renewable_energy_expansion: "The Feed-in Tariff Revolution"
 JAP_renewable_energy_expansion_desc: "The feed-in tariff unleashes solar capacity across Kyushu and wind farms off Akita, while the Top Runner efficiency standards squeeze waste out of every appliance and factory line. Kyocera and Sharp shift into the solar trade. The sun and wind can never be embargoed."
 JAP_power_grid_stabilization: "Never Again in the Dark"
 JAP_power_grid_stabilization_desc: "New frequency converters and interconnectors knit the country into a single resilient system, bridging the fifty-hertz east and sixty-hertz west divide that once split the grid. Utilities are ordered to hold reserve capacity and to choose whether solar, thermal, or storage answers each shock as it comes."
 JAP_resource_security_initiative: "Secure the Sinews of Industry"
 JAP_resource_security_initiative_desc: "The national resource strategy spans strategic stockpiles, overseas mining equity, recycling, and the exclusive economic zone, all of it aimed at insulating industry from embargo. The ministries direct steel, oil, and rare metals to the factories that need them most, turning imported dependence into managed resilience."
 JAP_hydroelectric_power: "Harness the Mountain Rivers"
 JAP_hydroelectric_power_desc: "Japan's steep, rain-fed rivers turn reliable turbines, while pumped-storage stations such as Kannagawa bank cheap night-time power for the evening peak. Re-machined dams push greater output from infrastructure the country already owns. The flow is clean, domestic, and constant."
 JAP_hydroelectric_power_TT: "Increase Hydroelectric Power Generated in §Y[613.GetName]§!, §Y[615.GetName]§! and §Y[616.GetName]§! by §G25%§!"
 JAP_geothermal_development: "Fire Beneath the Islands"
 JAP_geothermal_development_desc: "The Japan Organization for Metals and Energy Security funds geothermal exploration from Hachijojima to the Appi highlands, over the objections of the national parks and the hot-spring owners. Binary-cycle plants deliver constant power day and night whatever the weather, tapping the heat of the Ring of Fire to serve the grid."
 JAP_geothermal_development_TT: "Increase Geothermal Power Generated in §Y[609.GetName]§!, §Y[616.GetName]§! and §Y[617.GetName]§! by §G25%§!"
 JAP_nuclear_restart: "Restart the Reactors"
 JAP_nuclear_restart_desc: "Under the Green Transformation policy, the government brings the nuclear fleet back online from Sendai in Kyushu to the vast Kashiwazaki-Kariwa complex on the Japan Sea. Regulators are strict and the public is wary, but the arithmetic of energy security is unforgiving. The atom must carry the base load once more.\n-------------\nRe-enables nuclear generation and opens the §YReactor Restart Programme§!, in which each station is brought back one at a time. Sendai, Ikata, and the Fukui cluster can be started at once; the harder sites follow as the regulatory and consent focuses are completed."
 JAP_nuclear_regulatory_compliance: "Meet the New Safety Standards"
 JAP_nuclear_regulatory_compliance_desc: "Stations seeking restart must pass the Nuclear Regulation Authority's standards, the strictest in the world: seismic and tsunami backfits, mandatory safety facilities, and review that grants nothing on trust. The work is slow and enormously expensive, and it is the only path to an operating fleet. A station that clears it runs better than it did before.\n-------------\nClears the §YTightened Nuclear Safety Standards§! spirit and opens the Genkai, Onagawa, and Shimane restarts."
 JAP_local_consent_accords: "Win Local Consent"
 JAP_local_consent_accords_desc: "A restart requires more than the regulator's approval, because prefectural governors and host municipalities hold an effective veto and the district courts have granted injunctions before. Kagoshima and Ehime cleared Sendai and Ikata through negotiated host-community accords of grants, jobs, and patient local confidence. The subsidy regime is expensive, and it is what makes the hardest restarts possible at all.\n-------------\nOpens the Tomari and Kashiwazaki-Kariwa restarts, the two hardest sites in the country."
 JAP_restart_flagship_fleet: "The Rokkasho Fuel Cycle"
 JAP_restart_flagship_fleet_desc: "The reprocessing plant at Rokkasho in Aomori closes the fuel cycle, recovering plutonium and uranium from spent fuel for use in new reactors. Japan holds separated plutonium and the standing capacity to enrich it further, a fact Beijing, Seoul, and Pyongyang have never once failed to notice.\n-------------\nJapan's neighbours will take a §Rdim view§! of the stockpile."
 JAP_decommissioning_authority: "The Long Shutdown"
 JAP_decommissioning_authority_desc: "Dismantling the fleet safely takes decades, a shrinking pool of nuclear engineers held together, and site management long after the reactors go cold. The public breathes easier and the balance sheet does not. Every ageing reactor fleet in the world faces the same reckoning, and the nation that masters the work first can sell the expertise to all of them.\n-------------\nOpens the frequency converter, Hokkaido interconnector, and Kobe hydrogen projects."
 JAP_lng_bridge_supply: "The Fossil Bridge"
 JAP_lng_bridge_supply_desc: "Liquefied natural gas and coal fill the gap the idled reactors left, making Japan the largest LNG importer in the world. Gas-fired plants at Futtsu and Senboku can be built quickly and run hard, but every cargo is paid for in foreign currency. The household electricity bill carries the difference.\n-------------\nA bridge, and a §Rcostly§! one. The ammonia co-firing project is how Japan eventually gets off it."
 JAP_renewable_acceleration: "Sun, Wind, and Water"
 JAP_renewable_acceleration_desc: "Offshore wind auctions in the Akita and Chiba zones, utility-scale solar, and rewritten grid connection rules drive the renewable share upward faster than the feed-in tariff alone ever managed. Intermittency and grid limits remain, and the cheapest kilowatt-hour is still the one Japan has learned not to use."
 JAP_fusion_energy_program: "The Broader Approach"
 JAP_fusion_energy_program_desc: "Japan stood down from hosting ITER and took the Broader Approach in exchange: the fusion materials accelerator and the international research centre at Rokkasho, and the JT-60SA tokamak at Naka. Superconducting coils, gyrotrons, and a long apprenticeship in plasma physics are the return on that bargain.\n-------------\nWhether the reactors restart or wind down, the case for fusion holds. This is the one energy bet §Yneither road forecloses§!."
 JAP_national_energy_security: "A Nation Powered"
 JAP_national_energy_security_desc: "A stable, resilient supply (restored baseload or a renewable-and-storage grid) resting on a research base that reaches past fission. Energy security becomes the foundation of the wider economy."
 JAP_monarchy_resource_anchor_tt: "Effects of §Y$JAP_rare_earth_resilience$§! will be improved"
 JAP_reactors_recommissioned_tt: "The shuttered reactors are §Grecommissioned§! and may generate power again"
 JAP_national_energy_security_tt1: "With §Y6§! of the §Y8§! reactor sites back online (currently §Y[?JAP_reactor_sites_online|0]§!):"
 JAP_national_energy_security_tt2: "With §Y6§! of the §Y8§! green transformation projects delivered (currently §Y[?JAP_gx_projects_completed|0]§!):"
 JAP_national_energy_security_tt3: "Falling short of either mark:"
 JAP_minamitori_deep_sea: "The Mud of Minamitori"
 JAP_minamitori_deep_sea_desc: "The seabed inside Japan's exclusive economic zone around Minamitorishima holds rare-earth mud at concentrations found nowhere else on the planet, lying under more than five thousand metres of water. JOGMEC and the University of Tokyo fund the riser pipe and lifting trials that would make extraction possible at all. If the mud can be raised, Japan stops depending on a single foreign supplier for the metals its magnets and motors require."
 JAP_national_petroleum_stockpile: "Fill the National Reserves"
 JAP_national_petroleum_stockpile_desc: "The Japan Organization for Metals and Energy Security expands the strategic petroleum reserve held in the coastal tank farms at Shibushi, Kiire, and Tomakomai, adding salt-cavern and above-ground silos. The larger reserve buys the nation months of insurance against a closed Strait of Hormuz. A full tank is quiet power."
 JAP_grid_battery_storage: "The Grid of the Future"
 JAP_grid_battery_storage_desc: "GS Yuasa and Panasonic, veterans of the lithium-ion age, turn their cells toward grid-scale storage while state subsidies underwrite the batteries rising beside the substations. Combined with a smarter grid, storage smooths the peaks and fills the troughs. The electron saved at noon lights the city at dusk."
 JAP_urban_mining: "Mine the Cities"
 JAP_urban_mining_desc: "At its Naoshima and Onahama works, Mitsubishi Materials recovers gold, copper, and rare metals from electronic scrap shipped in from across the world. The medals of the Tokyo Olympics were struck from reclaimed metal. What the country throws away, it smelts anew."
 JAP_horizontal_recycling: "Metal Without End"
 JAP_horizontal_recycling_desc: "Horizontal recycling returns aluminium and steel to their original grade, closing the loop between the scrapyard and the rolling mill. UACJ and Kobe Steel build the sorting and refining lines that make can-to-can and part-to-part recovery work at industrial scale. A tonne kept in circulation is a tonne never imported again."
 JAP_nankai_methane_hydrate: "Fire Ice of the Nankai Trough"
 JAP_nankai_methane_hydrate_desc: "The Japan Organization for Metals and Energy Security presses its research vessels toward a commercial method for the methane hydrate locked in the Nankai Trough off the Pacific coast. Japan ran the world's first offshore production test there, and the engineering remains unproven while the economics stay daunting. Should the fire ice yield, Japan need never beg for gas again."
 JAP_model_competition: "East Asian Electronics Competition"
 JAP_model_competition_desc: "Japan's electronics industry is locked in a relentless contest with its neighbours. Samsung and SK Hynix dominate memory, TSMC owns the leading-edge foundry business, and China's fabs climb the ladder node by node with the backing of a near-bottomless state fund. Every advance by a rival is a market lost, a margin squeezed, a generation of engineers tempted abroad. Only sustained investment keeps the pressure at bay; let it slacken while the competition surges, and the ground gives way beneath Japan's feet.\n-------------\nRaising §YElectronics Resilience§! above the competitive pressure eases and eventually removes this national spirit. See §Y$JAP_technological_isolation_category$§! for the current figures."
 JAP_consumer_electronics_drive: "Consumer Electronics Drive"
 JAP_consumer_electronics_drive_desc: "A time-limited push to keep the domestic consumer electronics lines running at capacity, sustaining the plants, the suppliers, and the skilled hands that assemble them while the industry weathers the storm."
 JAP_foundry_localization: "Foundry Localization Program"
 JAP_foundry_localization_desc: "A concentrated effort to localize the foundry supply chain, standing up the tools, materials, and trained technicians around the new fabs so that domestic chip production can ramp at speed."
 JAP_electronics_export_offensive: "Electronics Export Offensive"
 JAP_electronics_export_offensive_desc: "Launch a coordinated push of subsidies, trade missions, and joint marketing to win back market share from foreign competitors, spending heavily to shore up Japan's position in the global electronics trade."
 JAP_electronics_resilience_up_tt: "§YElectronics Resilience§! against foreign competition: $RIGHT|+=0$"
 JAP_CHI_chip_rivalry: "Semiconductor Rivalry"
 JAP_electronics.1.t: "The Asian Challengers Close In"
 JAP_electronics.1.d: "The quarterly figures make grim reading in Tokyo. Samsung and SK Hynix have widened their lead in memory, TSMC's order book is bursting, and Chinese foundries are winning contracts that once came to Japan by default. Analysts speak openly of a Japanese electronics sector in structural decline. The boardrooms of Kawasaki and Osaka know the truth of it: the competition is no longer catching up, it is pulling ahead."
 JAP_electronics.1.a: "We will not cede the market without a fight."
 JAP_electronics.2.t: "China Reaches the Frontier"
 JAP_electronics.2.d: "The news lands like a hammer blow. Chinese fabs, propped up by the National Integrated Circuit Fund and undeterred by years of Western sanctions, have reached the leading edge of logic manufacturing that only a handful of firms on earth can touch. The last comfortable assumption of Japanese industry, that the mainland remained a generation behind, is gone. The frontier has moved, and Japan must decide whether to meet the challenge or be left in its wake."
 JAP_electronics.2.a: "The frontier has moved. We must answer."
 JAP_electronics.3.t: "Japan Reclaims the Silicon Crown"
 JAP_electronics.3.d: "Against the odds, the tide has turned. Japanese fabs are shipping in volume, Japanese materials remain indispensable, and Japanese design and content command respect the world over. The rivals in Seoul, Taipei, and Shanghai have not gone away, but for the first time in a generation they are the ones looking over their shoulders. The long retreat is over; Japan competes once more from a position of strength."
 JAP_electronics.3.a: "Japan stands once more at the summit of the industry."
 JAP_electronics.4.t: "Japan Returns to the Semiconductor Frontier"
 JAP_electronics.4.d: "In fabs from Hokkaido to Kyushu, in the research labs and the games studios and the fibre trenches, Japan has completed a resurgence few thought possible. A country written off a decade ago as the fading incumbent of the electronics age has clawed its way back to the leading edge and served notice that it means to remain there. The balance of the East Asian technology race has shifted, and every capital from Seoul to Washington is recalculating."
 JAP_electronics.4.a: "A remarkable resurgence."
 JAP_electronics.4.b: "The old giant still has teeth."
 JAP_demographic_pressure_modifier: "Demographic Pressure"
 JAP_demographic_pressure_modifier_desc: "Japan is one of the oldest and fastest-shrinking societies in the world, with deaths outnumbering births and the working-age population in sharp contraction. This crisis strains the labor force that sustains production, stretches welfare and health-care budgets to their limits, erodes fiscal stability, and tests the social fabric. Across six axes (population, workforce, stability, unemployment, health costs, and social costs) Japan faces interrelated pressures. Sustained, multifaceted reform across pro-family, employment, and immigration policies can ease these burdens and set the nation on a path toward stable or growing population."
 JAP_economy_modifier: "Japanese Economy"
 JAP_economy_modifier_desc: "The shared engine of Japan's economic renewal. As successive governments confront demographic decline and mounting competition from Korea, China, and Taiwan, reform reaches into every pillar of the economy: the fields and fisheries that feed the nation, the automakers and machine-tool houses that anchor its exports, the semiconductor and electronics champions racing to break out of stagnation, the drive to secure energy and critical resources for an archipelago almost without its own, and the rail arteries that knit the islands together. Every advance compounds here, lifting productivity, factory efficiency, and research while reshaping the demands Japan places on its industry, its resources, and its power grid."
 JAP_political_modifier: "Kokkai"
 JAP_political_modifier_desc: "Reforms undertaken in response to the demographic crisis are reshaping national politics, opening the country to migration while testing the social cohesion and stability of a nation unaccustomed to change."
 JAP_f15_programe_desc: "Mitsubishi's licence-built F-15J fleet is put through a staged modernisation: new radar, mission computers and cockpit displays on the airframes worth keeping, and a rationalised supply chain for the rest. Fighter and aerospace research runs faster, and light and medium airframes come off the line cheaper."
 JAP_submarine_modernization_idea_desc: "The diesel-electric fleet moves to air-independent propulsion and, later, lithium-ion cells, extending submerged endurance without a reactor. Kawasaki and Mitsubishi alternate the hulls at Kobe, which keeps two yards competent and drives the unit cost down."
 JAP_carrier_aviation_desc: "Fixed-wing naval aviation returns to the Japanese fleet for the first time since 1945. The helicopter destroyers are reassessed as aviation ships, deck coatings and elevators are studied for short take-off aircraft, and the doctrinal work of operating a carrier air group begins in earnest."
 JAP_keen_sword_operation_idea_desc: "The biennial joint exercise with the United States puts the Maritime Self-Defense Force through combined fleet manoeuvres, amphibious landings and air defence drills at a scale it cannot reach alone. Crews come back sharper, and the lessons outlast the exercise."
 JAP_nuclear_power_program: "Long-Term Nuclear Program"
 JAP_nuclear_power_program_desc: "Fifty-two reactors supply roughly a third of the nation's electricity, and the Atomic Energy Commission's Long-Term Program commits Japan to a closed fuel cycle built around reprocessing at Rokkasho. Operating performance is excellent, but consent has collapsed. The criticality accident at the JCO plant in Tokaimura killed two workers and destroyed public trust in the industry and its regulators, and in March 2000 the government placed the construction plans for all twenty proposed stations under review. Since Maki town voted its reactor down by referendum, no prefecture can be counted on to accept a new site."
 JAP_nuclear_local_consent: "Local Consent Accords"
 JAP_nuclear_local_consent_desc: "Prefectural governors and host municipalities have been brought back into the process through binding safety agreements, revenue sharing, and a right of prior consultation on restarts. The veto that stalled Japanese nuclear construction for a generation has been negotiated away rather than overridden, and the utilities can plan new capacity again."
 JAP_consolidate_national_defense_framework_cancel_tt: "Ends once the §YArticle 9§! bonus to §Ystability§! has faded and the penalties to §Ywar support§! and §Yrecruitable population§! have been fully worked off"
 JAP_modernize_joint_command_cancel_tt: "Ends once the §YArticle 9§! penalties to §Yarmy, air and naval experience gain§!, §Ycommand power§! and §Yofficer costs§! have been fully worked off"
 JAP_normalize_defense_procurement_mission: "Normalize Defense Procurement Systems"
 JAP_normalize_defense_procurement_mission_desc: "The expansion of defense responsibilities has placed great strain on existing procurement and industrial arrangements. Through careful reform, long-term planning, and closer coordination with industry, Japan works to normalize defense procurement and reduce the inefficiencies of the transition period."
 JAP_normalize_defense_procurement_cancel_tt: "Ends once the §YArticle 9§! penalties to §Yarmy attack§! and §Yarmy defence§! have been fully worked off and the bonuses to §Ycore territory attack§! and §Ycore territory defence§! have faded"
 JAP_establish_asteroid_mining_network_mission: "Establishing Asteroid Mining Network"
 JAP_establish_asteroid_mining_network_mission_desc: "Japan is assembling its first asteroid mining network, positioning orbital platforms and deploying prospecting equipment as off-world resource operations begin to take shape."
 JAP_reactor_restart_category: "The Reactor Restart Programme"
 JAP_reactor_restart_category_desc: "Fifty-four reactors once supplied a third of Japan's electricity. After 2011 every one of them went dark, and bringing them back is not a single decision but a campaign fought station by station, prefecture by prefecture. Each restart demands a regulatory review measured in years, the consent of a governor who answers to frightened voters, and a bill for seismic backfits that runs to hundreds of billions of yen. What it returns is the cheapest baseload power the country will ever have.\n\nEach completed restart §Gpermanently improves§! Japan's nuclear generation and lowers the cost of holding the fleet."
 JAP_restart_sendai: "Restart Sendai"
 JAP_restart_sendai_desc: "Kyushu Electric's two pressurized-water units at Satsumasendai in Kagoshima were the first in the country to clear the new safety standards, and in August 2015 Sendai Unit 1 became the first Japanese reactor to generate power in nearly two years. Governor Ito's consent made it possible; the seawall, the filtered vent, and the emergency control centre made it defensible."
 JAP_restart_ikata: "Restart Ikata"
 JAP_restart_ikata_desc: "Shikoku Electric's station sits on the narrow Sadamisaki peninsula in Ehime, with the Median Tectonic Line running a few kilometres offshore. Unit 3 returned to service in 2016 and has since been halted and restored more than once by the courts of neighbouring prefectures. No plant in Japan better illustrates that a licence from the regulator is only half the battle."
 JAP_restart_takahama_ohi: "Restart the Fukui Cluster"
 JAP_restart_takahama_ohi_desc: "Fukui prefecture hosts the densest concentration of reactors in the country. Kansai Electric's units at Takahama, Ohi, and Mihama supplied the industry of Osaka and Kobe for decades, and several of them are now old enough that operating them beyond forty years required a separate and contested extension. Restarting the cluster restores the industrial heartland's power supply in a single stroke."
 JAP_restart_genkai: "Restart Genkai"
 JAP_restart_genkai_desc: "Kyushu Electric's station in Saga prefecture returned in 2018 after backfits that included one of the first specialized safety facilities built to the new rules. Genkai also carries Japan's pluthermal programme, burning mixed-oxide fuel that closes part of the loop between the reactors and the reprocessing plant at Rokkasho."
 JAP_restart_onagawa: "Restart Onagawa"
 JAP_restart_onagawa_desc: "Onagawa in Miyagi sat closer to the epicentre of the 2011 earthquake than Fukushima Daiichi did, and its fourteen-metre seawall held. The town sheltered evacuees inside the plant's own gymnasium. Bringing Unit 2 back in 2024 was the first restart of a boiling-water reactor of the same type that failed at Daiichi, and it was the strongest argument the industry had."
 JAP_restart_shimane: "Complete Shimane Unit 3"
 JAP_restart_shimane_desc: "Chugoku Electric's station is the only nuclear plant in Japan sited within a prefectural capital, on the edge of Matsue itself. Unit 3 was built but never commissioned, left finished and idle through the long shutdown. Bringing it into service is not a restart at all but a first start, and the construction expertise recovered in doing it will not be lost again."
 JAP_restart_tomari: "Restart Tomari"
 JAP_restart_tomari_desc: "Hokkaido Electric's three units at Tomari are the only nuclear plant on the northern island, and their loss left Hokkaido dependent on a thin interconnector and ageing thermal capacity, as the island-wide blackout of 2018 made painfully clear. The seismic reassessment of the site dragged on for over a decade. Restoring Tomari is what makes Hokkaido's grid whole."
 JAP_restart_kashiwazaki_kariwa: "Restart Kashiwazaki-Kariwa"
 JAP_restart_kashiwazaki_kariwa_desc: "Seven units on the Niigata coast make this the largest nuclear power station ever built anywhere. It is also TEPCO's, the company that lost Fukushima, and Niigata's governors have spent years refusing to forget it. Security lapses at the site cost the company its operating permission outright for a time. If Kashiwazaki-Kariwa can be brought back, nothing in the fleet is beyond reach."
 JAP_gx_transition_category: "The Green Transformation"
 JAP_gx_transition_category_desc: "A Japan without reactors must find its power somewhere else, and the archipelago is short of everything except wind, heat, and engineers. The Green Transformation is the answer: floating turbines in waters too deep to anchor, the volcanic heat under the northern mountains, a grid finally stitched across the fifty and sixty hertz divide, and above all a national talent for using less than anyone thought possible.\n\nEach completed project §Gpermanently improves§! Japan's renewable output or cuts national demand, and closes the reactors in its region for good."
 JAP_gx_goto_floating_wind: "Goto Floating Offshore Wind"
 JAP_gx_goto_floating_wind_desc: "The seabed off Japan drops away too steeply for the fixed foundations used in the North Sea, which is why the country's offshore wind ambitions rest on floating platforms moored in deep water. The array off the Goto islands in Nagasaki is the proving ground for the technology, and the shipyards that once built tankers are the natural place to fabricate the hulls."
 JAP_gx_tohoku_geothermal: "The Tohoku Geothermal Cluster"
 JAP_gx_tohoku_geothermal_desc: "Japan holds the third-largest geothermal reserves on earth and uses almost none of them, blocked by national park boundaries and by hot-spring proprietors who fear the drill will take their water. Appi in Iwate broke the deadlock in 2024, the first large geothermal plant in decades. Where the volcanoes are, the power is, and it flows in the dark and in the calm alike."
 JAP_gx_kanto_setsuden: "The Setsuden Campaign"
 JAP_gx_kanto_setsuden_desc: "In the summer after the disaster, Tokyo simply used less. Offices dimmed their lights and abandoned neckties, factories shifted their shifts to the weekend, and the capital passed the peak without the blackouts everyone had predicted. Setsuden was supposed to be an emergency measure. Made permanent through building codes, industrial standards, and the Top Runner programme, it is worth more than a power station and costs a fraction of one."
 JAP_gx_frequency_converter: "The Frequency Converter Expansion"
 JAP_gx_frequency_converter_desc: "Tokyo runs at fifty hertz because it bought German generators in the 1890s, and Osaka runs at sixty because it bought American ones. A century later the two halves of the country still cannot freely share power, and in 2011 the west could only trickle a single gigawatt eastward while Tokyo went dark. Expanding the converter stations at Sakuma, Shin-Shinano, and Higashi-Shimizu finally makes one national grid out of two."
 JAP_gx_hokkaido_hvdc: "The Hokkaido Interconnector"
 JAP_gx_hokkaido_hvdc_desc: "Hokkaido has the best wind resource in Japan and the fewest people to use it, a combination that leaves turbines curtailed while Honshu burns imported gas. A high-voltage direct current link down the Japan Sea coast carries the northern wind to where the demand is, and it would have kept the lights on during the island-wide blackout of 2018 besides."
 JAP_gx_kobe_hydrogen: "The Kobe Hydrogen Supply Chain"
 JAP_gx_kobe_hydrogen_desc: "The world's first liquefied hydrogen carrier docked at Kobe in 2022, completing a supply chain that runs from Australian lignite fields to a terminal on Port Island. Hydrogen burns without carbon and stores what the turbines make and the grid cannot yet use, and Kawasaki Heavy has spent a decade building the tankers, tanks, and turbines to handle it."
 JAP_gx_hekinan_ammonia: "Ammonia Co-Firing"
 JAP_gx_hekinan_ammonia_desc: "The coal plant at Hekinan in Aichi is the largest in the country, and JERA has been feeding ammonia into its boilers alongside the coal, first at one part in five and aiming steadily higher. Ammonia carries hydrogen in a form that ships and pipelines already know how to handle, and it lets an existing fleet of thermal plants burn less fuel without being torn down and rebuilt."
 JAP_gx_shikoku_solar_storage: "Shikoku Solar and Storage"
 JAP_gx_shikoku_solar_storage_desc: "Shikoku has the strongest sunlight in Japan and a grid small enough that midday solar output has to be curtailed for want of anywhere to put it. Pairing utility-scale arrays with grid batteries moves the surplus from noon to the evening peak, which is the difference between renewable capacity that exists on paper and renewable power that is actually used."
 JAP_rubber_butadiene_branch_decision: "Butadiene Rubber Branch"
 JAP_rubber_butadiene_branch_decision_desc: "Natural rubber can be cut off, rationed, or priced into weakness, and Japan cannot allow that lever to exist. We will expand a butadiene based synthetic rubber branch to secure tires, seals, and critical components for industry and the armed forces."
 JAP_demand_south_kuril_reject_tt: "We may open a §Yborder war§! over §Y$STATE_1168$§!, or §Rdeclare war on [SOV.GetName]§! to seize the Northern Territories by force"
 JAP_demand_north_kuril_reject_tt: "We may open a §Yborder war§! over §Y$STATE_1168$§!, or §Rdeclare war on [SOV.GetName]§! to seize the Northern Territories by force"
 JAP_demand_sakhalin_reject_tt: "We may unlock a §YSpecial Forces Raid§! on §Y$STATE_691$§!, or §Rdeclare war on [SOV.GetName]§! to seize the Northern Territories by force"
 JAP_claiming_philippines: "Lay Claim to the Philippine Archipelago"
 JAP_claiming_philippines_desc: "The Philippine archipelago commands the approaches to the Western Pacific and the sea lanes that feed our industry. We will lay a formal claim and make clear that these islands fall within Japan's strategic sphere, whether others approve or not. Once declared, the region will understand that our navy intends to decide who passes through these waters."
 JAP_demographic_emergency_taskforce: "Declining Birthrate Emergency Response"
 JAP_demographic_emergency_taskforce_desc: "In response to demographic collapse, the government has established a whole-of-government emergency taskforce, mirroring the Children and Families Agency structure and coordinating rapid deployment of resources across every relevant ministry. Political attention is intense, bureaucratic silos are broken down, and a surge of policy experimentation becomes possible. This window of intense focus and mobilization is temporary; after 730 days of sustained effort, the emergency atmosphere fades and policymaking reverts to normal institutional patterns, though the reforms themselves endure."
 JAP_increase_birth_budget: "Emergency Child Allowance Doubling"
 JAP_increase_birth_budget_desc: "Japan will inject emergency treasury funds into the child allowance system, doubling direct cash transfers to households with children. This immediate, high-visibility spending provides relief to young families and signals state commitment to parenthood, lifting birth rates in the short term. The long-run cost is substantial, swelling the permanent entitlement budget, but the demographic dividends justify the expense while births remain depressed."
 JAP_child_care_subsidies: "Universal Free Early Childhood Education And Care"
 JAP_child_care_subsidies_desc: "Following the October 2019 policy, Japan will make early childhood education and care free to all families, eliminating tuition for nursery and preschool. The subsidy removes a major barrier to parental employment, freeing caregivers, primarily mothers, back into the workforce and enabling income-constrained households to have more children. The program is expensive but delivers both employment gains and modest fertility improvement."
 JAP_invest_in_robotics: "Society 5.0 Automation Drive"
 JAP_invest_in_robotics_desc: "Japan will accelerate the New Robot Strategy of 2015, subsidizing industrial automation, AI, and robotics to compensate for the missing workers. By replacing human labor in construction, manufacturing, and logistics with machines, Japan can maintain output with a smaller workforce. The strategy is capital-intensive but powerful, yet the displacement of low-skill workers can initially push up unemployment before new roles emerge in operation and maintenance."
 JAP_fertility_ivf_program: "In Vitro Fertilization Insurance Coverage"
 JAP_fertility_ivf_program_desc: "Japan will expand insurance coverage of in vitro fertilization (IVF) and assisted reproductive technology, making treatment accessible to all eligible couples regardless of income. Starting in 2022, insurance subsidies remove the economic barrier to infertility treatment, enabling couples who would otherwise remain childless to have children. The impact on birth rates is strong but the health-care system's cost burden rises sharply, placing pressure on public finances."
 JAP_family_housing_construction: "Affordable Family Housing Program"
 JAP_family_housing_construction_desc: "Japan will finance large-scale construction of affordable, family-sized housing aimed at childrearing households. High land and housing costs are a major barrier to family formation; subsidized construction lowers the financial threshold for young couples to marry and have children. The program is capital-intensive but it steadies society by offering young families a credible path to homeownership and signals state commitment to their future."
 JAP_marriage_support_program: "Newlywed Support Initiative"
 JAP_marriage_support_program_desc: "Japan will subsidize newlywed couples with housing grants and matchmaking services, including funding for konkatsu (marriage hunting) programs and AI-powered matchmaking platforms. The state will also partner with local governments to organize community-level marriage events. By reducing the financial and social friction around marriage formation, the program nudges birth rates upward at lower fiscal cost than childbearing incentives alone, though the effect is modest."
 JAP_raise_retirement_age: "Elderly Employment Stabilization Act"
 JAP_raise_retirement_age_desc: "Japan will gradually raise the official retirement age toward 70, extending mandatory employment contributions and deferring pension eligibility. Following the 2021 legislation, the state will incentivize employers to retain older workers and press them to offer continued employment past the traditional 65-year mark. It is politically painful, workers chafe at the extra years of labor and the government must spend political capital to force it through, but the workforce is directly enlarged and the pension burden eased."
 JAP_silver_employment_initiative: "Silver Human Resource Centers"
 JAP_silver_employment_initiative_desc: "Japan will establish and fund Silver Human Resource Centers in every major city, offering part-time job placement, re-training, and mentoring for healthy seniors over 65. These centers will match experienced retirees with employers needing flexible labor in cleaning, security, childcare support, and administration. The program is low-cost, preserves dignity, and adds productive workers without raising the compulsory retirement age, easing unemployment pressure at modest expense."
 JAP_preventive_health_program: "Healthy-Life-Expectancy Initiative"
 JAP_preventive_health_program_desc: "Japan will invest in population-wide preventive health: subsidized screening, vaccinations, lifestyle counseling, and early intervention for chronic disease. By keeping the aging population healthier and functionally independent longer, the state reduces the years spent in costly intensive care and nursing home residence. The program is pure prevention (not treating disease, but preventing it) and it yields high returns in reduced health-care costs as seniors remain active and self-sufficient into their 80s."
 JAP_elderly_care_reform: "Long-Term Care System Modernization"
 JAP_elderly_care_reform_desc: "Japan will restructure the Long-Term Care Insurance system to shift from institutional (nursing home) care toward community-based, integrated care: home helpers, day centers, local clinics, and family support rather than expensive residential facilities. By reducing reliance on costly institutions and mobilizing communities, the state cuts both the health and social-care budgets. The transition is disruptive, some lose preferred institutional care and the administration strains during the changeover, but the long-term savings are substantial."
 Japan.105.t: "Proclamation of the Empire"
 Japan.105.d: "The proclamation lies drafted on the cabinet table with the seal beside it and the date left open. Nothing further remains to be restored: the household stands, the rites are kept, the Privy Council sits. Only the wording is unsettled.\n\nThe Army Minister speaks first. An empire is measured on the continent, in divisions raised and ground held, and the proclamation should say as much. The Navy Minister answers without raising his voice. Japan is an island country that lives by its sea lanes, and a standard raised over the fleet will be read correctly in every port from Vladivostok to Singapore. Both men fall silent and look to the throne."
 Japan.105.a: "£JAP_EMPIRE_flag     The Empire's strength is in its armies."
 Japan.105.b: "£JAP_EMPIRE_NAVAL_flag     The Empire's strength is on the water."
 JAP_american_pressure_article_nine_desc: "Washington has linked the trade file to the defence file. Tariff threats and resource leverage are being used to push Tokyo toward a broader military role, and until the argument is settled Japan negotiates from the weaker side of the table."
 JAP_jsw_tank_mio_trait_ladle_refining: "Clean-Steel Ladle Refining"
 JAP_jsw_tank_mio_trait_muroran_arc_furnace: "Muroran Electric Arc Furnaces"
 JAP_jsw_tank_mio_trait_high_tensile_plate: "High-Tensile Plate Rolling"
 JAP_jsw_tank_mio_trait_scrap_recycling: "Scrap Reclamation Line"
 JAP_jsw_steel_modifier: "Japan Steel Works"
 JAP_jsw_steel_modifier_desc: "Every order placed with Japan Steel Works is an order placed with Muroran. The furnaces that pour the barrels and armor plate are the same furnaces that feed the shipyards, the construction trades, and the automakers, and each contract that keeps them running at capacity leaves the country less dependent on imported billet. What the defence budget buys in gun steel, the wider economy collects in tonnage."
 JAP_zombie_companies: "Zombie Companies"
 JAP_zombie_companies_desc: "Years of forbearance have kept unprofitable, over-indebted firms alive on cheap credit, tying up capital, labour, and management that healthier industries need. Until these firms are restructured or wound down, construction, productivity, and corporate tax receipts all suffer.\n-------------\nRaising §YCorporate Restructuring Progress§! unlocks the §Y$JAP_restructure_next_tranche$§! decision, which eases this national spirit one step at a time. See §Y$JAP_corporate_reform_category$§! for the current figures."
 JAP_ykk_group: "The YKK Group"
 JAP_ykk_group_desc: "Yoshida Kogyo makes roughly half the zippers produced anywhere, some seven billion a year out of plants in more than seventy countries. The company mills its own brass, spins its own polyester, mixes its own dyes and builds the machines that assemble the finished slider, a vertical integration that leaves nothing about the product outside its control. Military procurement is a small share of that business and an exacting one, because the fastener on a plate carrier, a load-bearing vest or a camouflage smock is the first component to fail in the field. Japanese uniform and protective equipment programmes draw on a supplier that can revise a webbing, a coating or a corrosion-resistant alloy in-house rather than wait on a subcontractor."
 JAP_karoshi_crisis: "The Karoshi Crisis"
 JAP_karoshi_crisis_desc: "Chronic overwork is grinding down Japan's workforce. Excessive unpaid overtime, the culture of 'service zangyo', drives stroke, heart failure, and suicide among salaried employees, while exhausted families put off having children. Stability, productivity, and research all suffer, healthcare and social spending climb, and the population edges downward year after year.\n-------------\nReform focuses and workplace campaigns raise §YWorker Wellbeing§!. At §G30§! and §G60§! the §Y$JAP_enforce_next_reforms$§! decision unlocks and eases this national spirit one step; the focus at the end of your chosen path lifts it for good. While Japan's §Yzombie companies§! remain unresolved, every campaign yields half as much. See §Y$JAP_corporate_reform_category$§! for the current figures."
 JAP_karoshi: "Karoshi"
 JAP_karoshi_desc: "The government names karoshi a national crisis: workers killed by overwork, by stroke and heart failure at the desk and by suicide after hundred-hour months. The death of the Dentsu employee Matsuri Takahashi forced it back onto the national agenda and cost the company's president his job. The state must now decide how far it will reach into the workplace to make work survivable."
 JAP_corporate_laws: "Reforming the Labour Standards Act"
 JAP_corporate_laws_desc: "The government takes the legislative road, closing the Article 36 loophole through the Work Style Reform Act and replacing saburoku agreements with hard ceilings enforced by a strengthened Labour Standards Inspectorate. Winning it means fighting employers and the flexible-hours lobby through every committee stage in the Diet. It is the most comprehensive of the three answers and the slowest to arrive."
 JAP_cultural_change: "Confronting the Culture of Overwork"
 JAP_cultural_change_desc: "The government campaigns on culture instead of statute: Premium Friday sends workers home early once a month, mental-health screening reaches the workplace, and the annual Karoshi White Paper keeps the dead visible to employers and recruiters alike. None of it touches the unspoken rule that the diligent leave only after the section chief does. This path wagers that Japan's relationship with work changes from below, one workplace and one household at a time."
 JAP_keiretsu_pact: "Bargaining with the Keiretsu"
 JAP_keiretsu_pact_desc: "The state negotiates directly with the enterprise groups and the Keidanren employers' federation: managed reform in exchange for stability, lifetime employment preserved, and the indebted firms sheltered from disruption. No legislation is passed and no company is named and shamed, because concession is traded for predictability. It is the slowest road to reform and the one that leaves corporate Japan least changed."
 JAP_overtime_cap: "The Article 36 Ceiling"
 JAP_overtime_cap_desc: "A saburoku agreement filed with the labour office turns the statutory forty-hour week into a suggestion, and the Work Style Reform Act closes the hole. Forty-five hours of overtime a month and three hundred and sixty a year become a legal ceiling, never beyond a hundred in a single month, with criminal penalties behind the numbers rather than administrative guidance. The figures track the karoshi line the Ministry of Health, Labour and Welfare uses when deciding whether a stroke or a suicide was caused by the job."
 JAP_mandatory_paid_leave: "Five Days a Worker Must Take"
 JAP_mandatory_paid_leave_desc: "The obligation is inverted: an employer granting ten or more days of leave must now ensure at least five of them are actually consumed, designating the dates itself if the worker will not. Japanese workers do not lack holiday so much as permission to use it, and barely half of granted leave is ever taken. The same amendment borrows the European work interval, eleven hours of rest between shifts, though only as a duty to make an effort."
 JAP_labour_inspection_offices: "The Labour Standards Inspectorate"
 JAP_labour_inspection_offices_desc: "The government funds the Labour Standards Inspectorate to enforce rather than advise: more inspectors, forensic accounting to catch the falsified time cards that turn a hundred hours of overtime into twenty on paper, and the willingness to prosecute. A few thousand inspectors cannot police sixty million workers, so most violations surface only after someone has died and the family has hired a lawyer. The ministry already publishes the names of the firms that break the law, and Dentsu itself was convicted after Matsuri Takahashi's death."
 JAP_karoshi_prevention_act: "The Karoshi Prevention Act"
 JAP_karoshi_prevention_act_desc: "The Diet passes the Act on Promotion of Preventive Measures against Karoshi, obliging the state to research overwork deaths, publish an annual White Paper, and hold itself to targets it can be measured against: fewer than five percent of workers on sixty-hour weeks, seventy percent of paid leave actually taken, mental health provision at every firm. Making the numbers public is the point, because they can then be missed in public. The same package carries a high-level professional exemption lifting hour rules from the best-paid specialists, a carve-out the unions expect to be widened."
 JAP_end_of_karoshi: "A Country Where Work Does Not Kill"
 JAP_end_of_karoshi_desc: "The ceiling on overtime holds because inspectors turn up unannounced and prosecutors follow them, leave is taken because the law requires it, and the contract worker beside you is paid what you are paid. The firms that could only survive on unpaid hours have been wound up rather than propped on evergreened credit, so nobody is left pleading that survival leaves them no choice. Japan will still work hard, but it has stopped treating exhaustion as evidence of loyalty.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved, §Y$JAP_karoshi_crisis$§! already eased to its final stage, and §YWorker Wellbeing§! of at least §G85§!. Completing this focus lifts the Karoshi crisis for good."
 JAP_karoshi_wellbeing_up_tt: "Raises §YWorker Wellbeing§! by $RIGHT|+=0$, easing the Karoshi crisis"
 JAP_premium_friday: "Premium Friday"
 JAP_premium_friday_desc: "The Ministry of Economy, Trade and Industry launches Premium Friday with the Keidanren: on the last Friday of every month, employees leave at three and spend the evening in the shops rather than at their desks. The timing is unfortunate, since month-end is when the accounts close and the quotas settle, and few firms comply with any enthusiasm. What survives is the precedent of the state naming an hour and telling the country to stop working."
 JAP_ikumen_project: "The Ikumen Project"
 JAP_ikumen_project_desc: "The Ministry of Health, Labour and Welfare runs the ikumen campaign to make a child-raising father something to admire rather than explain. Japanese paternity leave is among the most generous in the world on paper, a year of it partially paid, and almost nobody claims it, because a man who files is a man whose colleagues carry his work and whose section chief remembers. The revised law offers four weeks in the eight after a birth, splittable and merely notified, a threshold low enough that a hesitant father might actually take it."
 JAP_stress_check_programme: "The Stress Check"
 JAP_stress_check_programme_desc: "The amended Industrial Safety and Health Act requires every workplace of fifty or more employees to offer an annual psychological self-assessment, the first time the state has obliged Japanese firms to ask their staff how they are. A worker who scores badly may request an interview with a physician and an adjustment to their duties, but the results belong to the employee and a manager sees nothing without consent. That protects the individual and blunts the instrument, and firms under fifty employees are only asked to make an effort."
 JAP_telework_normalization: "Working From Anywhere"
 JAP_telework_normalization_desc: "The government appoints its first Minister for Digital Transformation and opens the Digital Agency, stripping the hanko seal requirement out of the overwhelming majority of administrative procedures. Telework was a rounding error not because the technology was missing but because contracts needed the carved seal and forms still arrived by fax, so somebody had to be in the building holding the stamp. Whether any of it outlasts the emergency is the open question, because firms called their staff back to desks they had proved they did not need."
 JAP_ending_service_zangyo: "The End of Service Overtime"
 JAP_ending_service_zangyo_desc: "Sabisu zangyo is the hour worked and never recorded, given away free because the working day was measured by self-declaration and the employee knew what the section chief expected that number to say. The reform attacks the arithmetic rather than the culture: employers must establish hours by objective means, card readers or login times, and the gap between the two records is evidence. The ministry publishes what it recovers each year, tens of billions of yen in unpaid wages, and every one of those firms was caught rather than unusual."
 JAP_ending_compulsory_nomikai: "The Optional Nomikai"
 JAP_ending_compulsory_nomikai_desc: "The nomikai is voluntary in the sense that the invitation is phrased as a question, and the junior who declines twice has said something about themselves that no performance review will record. The Power Harassment Prevention Act reaches it from the side, defining workplace power harassment in Japanese statute for the first time and obliging every company to run a complaints procedure and protect the complainant. A generation of younger workers had already stopped going, and the law caught up with them."
 JAP_work_to_live: "Working to Live"
 JAP_work_to_live_desc: "Hours are recorded by the machine and match what happened, leave is taken because taking it costs nothing, and fathers file for the weeks after a birth and return to the same desk and the same prospects. None of it was won by statute alone, because it was never really about statute: it was about what a workplace expects when nobody is enforcing anything. Japan still works hard, and it has stopped confusing that with working itself to death.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved, §Y$JAP_karoshi_crisis$§! already eased to its final stage, and §YWorker Wellbeing§! of at least §G85§!. Completing this focus lifts the Karoshi crisis for good."
 JAP_corporate_reform_category: "Corporate Japan Reform"
 JAP_corporate_reform_category_desc: "Japan's corporate sector carries two linked diseases. Banks keep unprofitable, over-indebted firms alive on rolled-over credit, locking up the capital and workers that healthier industries need. Those same firms buy loyalty with unpaid overtime, and the result is karoshi, death from overwork. Neither can be fully cured while the other persists.\n\n§YZombie Companies§!\n§YCorporate Restructuring Progress§!: [?JAP_corporate_restructuring_progress|0] / 100\nRestructuring crawls at §R+0.25 per month§! until the investigation closes and a resolution is chosen. §Y$JAP_controlled_downsize$§! then winds the firms up quickly, §Y$JAP_forced_mergers$§! absorbs them at half that pace, and the quality of the report scales both. The bank focuses and the recovery programmes below add one-off amounts.\n§RProgress stalls at 84§! until a resolution is chosen.\n§GThresholds§!\n§G30§! and §G60§!: the §Y$JAP_restructure_next_tranche$§! decision below unlocks, and each use eases §Y$JAP_zombie_companies$§! one step.\n§G85§!: the focus at the end of your chosen path removes it for good, either §Y$JAP_the_lost_decade_ends$§! or §Y$JAP_consolidated_japan_inc$§!, though the latter leaves a permanent mark behind it.\n§RWarning§!: a §Y$JAP_keiretsu_pact$§! slows the monthly accrual.\n\n§YThe Karoshi Crisis§!\n§YWorker Wellbeing§!: [?JAP_karoshi_wellbeing|0] / 100\nThe reform focuses on your chosen path add Worker Wellbeing directly, and the workplace campaigns below top it up for as long as you keep paying for them.\n§GThresholds§!\n§G30§! and §G60§!: the §Y$JAP_enforce_next_reforms$§! decision below unlocks, and each use eases §Y$JAP_karoshi_crisis$§! one step.\n§G85§!: the focus at the end of your chosen path removes it for good, either §Y$JAP_end_of_karoshi$§!, §Y$JAP_work_to_live$§! or §Y$JAP_the_bargain_kept$§!. Each of them also requires the crisis to have been eased to its final stage first.\n§RWarning§!: every campaign yields §R4§! instead of §G8§! while §Y$JAP_zombie_companies$§! is still in place, and the path focuses themselves cannot carry you to §G85§! alone.\n\n§GHint§!: §Y$JAP_a_society_where_women_thrive$§! halves what the §Y$JAP_cultural_change$§! campaigns cost the treasury."
 JAP_premium_friday_campaign: "Promote Premium Friday"
 JAP_premium_friday_campaign_desc: "Fund another round of the ministry's publicity push and the retail discounts that go with it, and lean on the employers' federation to get its members to close early. The firms that shut the lights off at three will be photographed doing it."
 JAP_ikumen_campaign: "Run the Ikumen Campaign"
 JAP_ikumen_campaign_desc: "Put fathers on childcare leave on posters, in ministry advertising and on television, and publish the take-up rate company by company so that a low number becomes a recruiting problem. The aim is to make filing for leave unremarkable rather than brave."
 JAP_mental_health_campaign: "Workplace Mental Health Drive"
 JAP_mental_health_campaign_desc: "Extend the annual stress check below the fifty-employee threshold, subsidise occupational physicians for firms too small to retain one, and staff the counselling lines properly. Screening only helps if there is somebody at the other end of it."
 JAP_no_overtime_day_campaign: "Declare a No Overtime Day"
 JAP_no_overtime_day_campaign_desc: "Name a weekday, switch the office lights off at the appointed hour and send the section chiefs home first, because nobody junior leaves before their superior does. Crude, visible, and the only version of the instruction that has ever worked."
 JAP_karoshi_resolved: "Japan's Karoshi crisis has been fully resolved"
 JAP_keidanren_charter: "The Charter for Work-Life Balance"
 JAP_keidanren_charter_desc: "The government, the Keidanren, and Rengo sign the Charter for Work-Life Balance and put numbers to it: halve the workers on sixty-hour weeks, take every day of granted paid leave, drag male childcare leave out of the low single figures. The document carries no legal force and no penalties, only an annual public review on a council where business sits as an equal. Japanese working hours have never fallen through prosecution, but they do fall when firms must explain the figures to each other."
 JAP_shunto_offensive: "The Spring Offensive"
 JAP_shunto_offensive_desc: "The cabinet joins the shunto spring wage offensive directly, pressing the Keidanren to raise base pay rather than bonuses and backing the demand with tax credits for the firms that comply. Critics call it kanmin shunto, government-managed bargaining, and argue that a wage round run out of the Prime Minister's office is not collective negotiation at all. Until base pay rises the salaryman keeps working the overtime that pays his mortgage, whatever the ceiling says."
 JAP_health_management_stocks: "Health and Productivity Management"
 JAP_health_management_stocks_desc: "The ministry and the Tokyo Stock Exchange begin naming Health and Productivity Management Stocks, telling investors that staff health is capital expenditure rather than welfare. The certification behind it, the White 500, is the deliberate opposite of the black company blacklist and rests on the finding that exhausted workers produce less and cost more than rested ones. Firms submit their own figures on hours and health to earn the badge, and those that cannot answer for it to shareholders and recruits alike."
 JAP_morning_shift_system: "The Morning Shift"
 JAP_morning_shift_system_desc: "Itochu, a sogo shosha at the centre of the old keiretsu, bans work after ten at night and pays early-morning hours at a premium instead. The reasoning is commercial rather than humane: a trader at his desk since nine the previous morning misprices, and the evening hours are the least productive of the day. Evening overtime collapsed, total hours fell, profit held and the firm's birth rate rose, which embarrassed every rival that had called shorter hours unaffordable."
 JAP_job_based_employment: "Hired to a Job, Not a Company"
 JAP_job_based_employment_desc: "Japanese employment is membership-based: a worker is hired into the company rather than into a job, rotated at the firm's discretion with no defined duties, which is where the unbounded working day begins. Hitachi, Fujitsu, KDDI, and Shiseido now publish actual job descriptions with pay graded to the role, and the Keidanren has conceded that lifetime employment cannot be sustained. The state funds a trillion yen of retraining so the shift reads as opportunity rather than betrayal."
 JAP_the_bargain_kept: "The Bargain Kept"
 JAP_the_bargain_kept_desc: "The hours come down because the enterprise groups work out that they cost more than they earn, and having worked it out they move faster than any committee of the Diet could have made them. The cross-shareholdings stay intact, the main banks stay at the centre of their groups, and the productivity released by shorter days flows into the laboratories rather than into wage claims. The state carries what the bargain does not: the health insurance bill for the workers already broken, and the forbearance that keeps insolvent firms breathing.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved, §Y$JAP_karoshi_crisis$§! already eased to its final stage, and §YWorker Wellbeing§! of at least §G85§!. Completing this focus lifts the Karoshi crisis for good."
 JAP_demand_recovery_progress_tt: "§YDemand Recovery Progress§!: $RIGHT|+=0$"
 JAP_corporate_restructuring_progress_tt: "§YCorporate Restructuring Progress§!: $RIGHT|+=0$"
 JAP_declaration_price_target_TT: "The inflation rate is below §Y1%§!"
 Japan_economy.32.t: "A District Court Halts the Restart"
 Japan_economy.32.d: "A district court has issued an injunction blocking the restart of a nuclear reactor, citing unresolved doubts about seismic safety and evacuation planning near the plant. The ruling is not final, but it freezes the reactor's return to operation while the case moves through appeal. Local residents and anti-nuclear groups have seized on the decision, while utilities warn of the cost of continued idle capacity."
 Japan_economy.32.a: "Fight it through the appeals courts."
 Japan_economy.32.b: "Deepen local safety guarantees."
 JAP_zombie_firms_investigation: "Investigate the Zombie Firms"
 JAP_zombie_firms_investigation_desc: "Banks have rolled over loans to insolvent borrowers and the cross-shareholdings have let managers hide behind one another. Auditors now enter the ledgers, name the firms surviving only on evergreened credit, and force the numbers into the open."
 JAP_zombie_firms_investigation_TT: "Opens the investigation. Case files are built through §Y$JAP_zombie_investigation_category$§!, and the firms will fight back."
 JAP_zombie_investigation_idea: "Zombie Firm Investigation"
 JAP_zombie_investigation_idea_desc: "Auditors are combing through the books of insolvent firms. The uncertainty rattles boardrooms and slows the offices while the probe runs its course."
 Japan_economy.06.b: "Let the banks self-report"
 Japan_economy.07.b: "Contain the fallout"
 JAP_zombie_investigation_western_pop_TT: "Publicizing the forbearance discredits the pro-Western reformist bloc: §RLiberal party popularity falls§!"
 JAP_controlled_downsize: "Controlled Downsize"
 JAP_controlled_downsize_desc: "The Financial Revitalization Program applies stricter asset assessment and discounted cash flow provisioning, forcing public capital into the balance sheets that cannot stand alone. Insolvent firms are wound down and factories closed, releasing the workers locked inside the walking dead back to the living."
 JAP_complete_downsizing: "Complete Downsizing of the Economy"
 JAP_complete_downsizing_desc: "The liquidation is finished. Credit now flows to firms that can repay it, land trades at prices that reflect its use, and management no longer measures success by headcount. This is the economy the reformers promised: smaller on paper, far stronger in the ledger."
 JAP_venture_capital_funds: "Venture Capital Funds"
 JAP_venture_capital_funds_desc: "The Innovation Network Corporation of Japan puts state capital behind private startups, matching venture risk with public backing. Japanese households hold enormous savings that almost never reach a founder, and this is how that capital is made to move."
 JAP_infrastructure_investments: "Infrastructure Investments"
 JAP_infrastructure_investments_desc: "The Fundamental Plan for National Resilience commits the Ministry of Land, Infrastructure, Transport and Tourism to renewing the bridges, tunnels, and seawalls built during the high-growth decades, most of them now past fifty years of service. Public works are the arteries of an industrial nation when they are done properly."
 JAP_growth_tax_reform: "Tax Changes to Promote Growth"
 JAP_growth_tax_reform_desc: "Japan long carried one of the heaviest corporate burdens in the developed world. Successive reforms cut the effective rate from roughly thirty-seven percent toward the twenties, broadening the base while lowering the rate and rewarding firms that raise wages and invest at home. A company that keeps its profits working is worth more to the Treasury than one that hoards them."
 JAP_startup_education_programs: "Education Programs for New Companies"
 JAP_startup_education_programs_desc: "The EDGE and EDGE-NEXT programs put entrepreneurship training inside the national universities, and the technology licensing offices turn laboratory patents into companies. A graduate of Todai or Tokyo Tech should see founding a firm as a career, not a disgrace to be explained to one's parents."
 JAP_retirement_reform: "Retirement Reform"
 JAP_retirement_reform_desc: "The revised Act on Stabilization of Employment of Elderly Persons asks employers to secure work opportunities up to the age of seventy. Seniors are healthy, skilled, and willing, and keeping them in the workforce eases the pension burden while returning decades of accumulated craft to the factory floor."
 JAP_forced_mergers: "Fusion"
 JAP_forced_mergers_desc: "Rather than let the weak firms fail, the ministry marries them to the strong: it draws the lines, the banks provide the capital, and nobody has to admit failure. The zombies disappear from the register, and the unhappy engineers, the duplicated factories, and the despised new masters all remain."
 JAP_megabank_consolidation: "Megabank Consolidation"
 JAP_megabank_consolidation_desc: "Japan drives its ailing city banks together into three megabanks: Mizuho, Sumitomo Mitsui, and Mitsubishi UFJ. The mergers bury a decade of bad loans inside balance sheets too large to question, and produce lenders no government could afford to let fail."
 JAP_industrial_revitalization_corp: "Industrial Revitalization Corporation"
 JAP_industrial_revitalization_corp_desc: "The Industrial Revitalization Corporation of Japan buys distressed debt and takes struggling firms in hand, Daiei and Kanebo among the forty-one it restructures. A state turnaround vehicle can dictate terms, rearrange debts, and quietly dilute shareholders in ways no private creditor would dare attempt."
 JAP_national_champion_mergers: "National Champion Mergers"
 JAP_national_champion_mergers_desc: "METI merges the losing divisions of rival firms and calls the sum a champion: Renesas from the chip arms of NEC, Hitachi, and Mitsubishi, Japan Display from the panel businesses of Sony, Toshiba, and Hitachi. Whether three struggling units add up to one healthy company is left carefully unstated."
 JAP_keiretsu_cross_shareholding: "Keiretsu Cross-Shareholding"
 JAP_keiretsu_cross_shareholding_desc: "Mochiai, the web of allied shareholdings, is the quiet architecture of corporate Japan, and every reform to date has tried to unwind it. The government tightens the knots instead, insulating the conglomerates from activist investors and hostile bids. The jobs stay safe, and so does every mediocre executive."
 JAP_employment_preservation_pact: "Employment Preservation Pact"
 JAP_employment_preservation_pact_desc: "Shushin koyo, lifetime employment, was never law but a bargain between firm, union, and state, sustained by adjustment subsidies. The government writes it down: no worker loses a job to a merger. The nation buys social peace and pays for it with factories that can never close."
 JAP_consolidated_japan_inc: "Consolidated Japan Inc."
 JAP_consolidated_japan_inc_desc: "The last of the weak firms is signed into a merger and the register is closed. The champions are enormous, the ministry can draw the industrial map on a single sheet, and foreign rivals treat it with the wary respect due to any giant. Inside, the duplicated plants still run and the unhappy engineers still file out at six.\n-------------\nThis focus §Gremoves§! §Y$JAP_zombie_companies$§! and the §Y$JAP_fusion_restructuring$§! that came with the mergers, and leaves §Y$JAP_consolidated_conglomerates$§! behind permanently."
 JAP_venture_capital_funds_decision: "Capitalize the Innovation Fund"
 JAP_venture_capital_funds_decision_desc: "Put public money into the funds alongside private managers, on the condition that the managers pick the winners. Underwrites a year of concentrated research effort across the new firms."
 JAP_infrastructure_investments_decision: "Launch the Chubu Renewal Works"
 JAP_infrastructure_investments_decision_desc: "Commit civilian construction capacity to renewing the roads, bridges, and utilities of the Chubu industrial belt. The works tie up factories while they run and leave the region's infrastructure substantially improved."
 JAP_growth_tax_reform_decision: "Cut the Corporate Rate"
 JAP_growth_tax_reform_decision_desc: "Push the effective corporate rate down for a year and let firms keep more of what they earn. Consumer prices ease as companies pass part of the relief through to households."
 JAP_startup_education_programs_decision: "Fund the University Startup Track"
 JAP_startup_education_programs_decision_desc: "Endow entrepreneurship faculties and technology licensing offices at the national universities, turning laboratory work into companies and accelerating our industrial research."
 JAP_retirement_reform_decision: "Extend the Employment Guarantee to Seventy"
 JAP_retirement_reform_decision_desc: "Subsidize employers who keep skilled workers past the traditional retirement age. Decades of accumulated craft stay on the factory floor for another year."
 JAP_rail_modernization: "Rail Modernization"
 JAP_rail_modernization_desc: "The Tokaido Shinkansen anchors the densest rail network on earth, and the rolling stock, signalling, and stations behind it are renewed line by line. The railways remain the backbone of an industrial economy that cannot afford them to fail."
 JAP_shinkansen_network_expansion: "Shinkansen Network Expansion"
 JAP_shinkansen_network_expansion_desc: "Under the Nationwide Shinkansen Railway Development Act, successive governments have pushed the high-speed trunk lines outward from the Tokaido core toward Hokuriku, Kyushu, and Hokkaido. Accelerating these projects will knit distant prefectures into the national economy and shorten supply lines across the home islands."
 JAP_chuo_shinkansen_maglev: "Chuo Shinkansen Maglev"
 JAP_chuo_shinkansen_maglev_desc: "The Chuo Shinkansen is JR Central's superconducting maglev line between Tokyo, Nagoya, and Osaka, its L0 series holding the world rail speed record at 603 km/h. State commitment carries the prototyping and the deep tunnelling of the fastest commercial railway ever attempted."
 JAP_freight_modal_shift: "Freight Modal Shift"
 JAP_freight_modal_shift_desc: "Japan Freight Railway is spearheading a modal shift of cargo from long-haul trucks onto rail, promoted through the Eco Rail Mark and standardized thirty-one foot containers. Moving more freight by rail cuts emissions, eases the driver shortage, and strengthens the industrial supply chain."
 JAP_station_city_model: "Station City Model"
 JAP_station_city_model_desc: "JR East has turned major terminals into commercial cities in their own right, developing the retail concourses known as ekinaka and the towers around Shinagawa, Shibuya, and Tokyo Station. Concentrating offices and retail on transit hubs raises land value and productivity in the urban core."
 JAP_regional_line_preservation: "Regional Line Preservation"
 JAP_regional_line_preservation_desc: "As rural depopulation drains ridership, JR West and the third-sector railways struggle to keep local lines open. Rather than abandon the countryside, we will subsidize community rail, preserving supply access and mobility for regions the trunk lines bypass."
 JAP_port_rail_intermodal: "Port and Rail Intermodal"
 JAP_port_rail_intermodal_desc: "The International Strategic Hub Port policy concentrates container traffic on the Keihin and Hanshin port clusters. Extending on-dock rail sidings and inland terminals ties the harbors directly into the freight network, moving containers from ship to train without idle trucking."
 JAP_green_logistics_network: "Green Logistics Network"
 JAP_green_logistics_network_desc: "A green logistics network of electrified rail, battery and hydrogen locomotives, and consolidated distribution centres decarbonises the movement of goods across the country in pursuit of carbon neutrality."
 JAP_rail_technology_exports: "Rail Technology Exports"
 JAP_rail_technology_exports_desc: "Japanese high-speed rail is a flagship export. E5-derived trainsets underpin the Mumbai-Ahmedabad line in India, the 700T serves Taiwan High Speed Rail, and JICA financing packages Shinkansen technology worldwide. Winning these contracts spreads our standards and our influence."
 JAP_global_rail_superpower: "Global Rail Superpower"
 JAP_global_rail_superpower_desc: "With the Chuo Shinkansen driven through to Osaka and our exports circling the globe, Japan stands as the undisputed leader in high-speed rail. The maglev age begins at home and radiates outward, a lasting symbol of Japanese engineering."
 JAP_chuo_shinkansen_program: "Chuo Shinkansen Program"
 JAP_chuo_shinkansen_program_desc: "A dedicated national effort to prototype the superconducting maglev, accelerating our maglev special project."
 JAP_high_speed_line: "High-Speed Line"
 JAP_high_speed_line_desc: "A new Shinkansen corridor raises regional productivity, speeds local construction, and widens supply throughput."
 JAP_rail_category: "Rail Sector"
 JAP_hokuriku_shinkansen_extension: "Hokuriku Shinkansen: Kanazawa to Tsuruga"
 JAP_hokuriku_shinkansen_extension_desc: "Extend the Hokuriku Shinkansen from Kanazawa to Tsuruga, the section opened in 2024, linking the Sea of Japan coast into the national high-speed network."
 JAP_nishi_kyushu_shinkansen: "Nishi Kyushu Shinkansen"
 JAP_nishi_kyushu_shinkansen_desc: "Open the Nishi Kyushu route to Nagasaki, in service since 2022, bringing western Kyushu onto the Shinkansen grid."
 JAP_sanyo_shinkansen_upgrade: "Sanyo Shinkansen Upgrade"
 JAP_sanyo_shinkansen_upgrade_desc: "Deploy N700S rolling stock and modernize the Osaka to Hakata trunk for higher speeds and greater reliability."
 JAP_tohoku_shinkansen_upgrade: "Tohoku Shinkansen 320 km/h"
 JAP_tohoku_shinkansen_upgrade_desc: "Run E5 series trains at 320 km/h on the Tohoku trunk, cutting journey times from Tokyo toward Aomori."
 JAP_hokkaido_shinkansen_sapporo: "Hokkaido Shinkansen: Sapporo Extension"
 JAP_hokkaido_shinkansen_sapporo_desc: "Bore the tunnels and raise the viaducts to carry the Shinkansen from Shin-Hakodate-Hokuto through to Sapporo."
 JAP_shikoku_shinkansen: "Shikoku Shinkansen"
 JAP_shikoku_shinkansen_desc: "Realize the long-planned basic-plan line, bringing high-speed rail to the island of Shikoku for the first time."
 JAP_plutonium_stockpile_concern: "Separated Plutonium Stockpile"
 JAP_galapagos_syndrome: "Galapagos Syndrome"
 JAP_galapagos_syndrome_desc: "Japan built a complete technological world inside its own borders and then found it could not export any of it. Its mobile networks ran on PDC while the rest of the planet standardized on GSM, so no domestic handset could be sold abroad and no foreign handset could be sold here. Browsing arrived through i-mode and payment through FeliCa, each of them years ahead of anything overseas and each of them incompatible with everything overseas. Domestic certification, JIS specification and keiretsu procurement did the rest, filling the home market with products engineered for a customer who exists nowhere else. A hundred and twenty million consumers are enough to sustain an industry and just barely too few to force it outward.\n-------------\nThis national spirit does not de-escalate on its own. §RResearch speed§! drifts steadily downward while Japan stays closed, slowed but never reversed by temporary measures. Only the §YIntegration with the World§! path, carried to §G85§! §YOpenness§!, removes it. See §Y$JAP_technological_isolation_category$§! for the current figures."
 JAP_galapagos_modifier: "Galapagos Drift"
 JAP_galapagos_modifier_desc: "The running account of how far Japan has drifted from the world it trades with. Research slips a little further each month that the country keeps to its own standards, and the further it is from the standards its customers use, the faster it slips. Temporary measures slow the slide. Only genuine integration stops it."
 JAP_galapagos_resolved: "Japan has broken out of its Galapagos isolation"
 JAP_galapagos_syndrome_focus: "The Galapagos Question"
 JAP_galapagos_syndrome_focus_desc: "Japan's domestic market is profitable and shrinking, protected by standards that lock the country out of everywhere else. The ministry debates whether the answer is convergence, rewriting the standards to match the world, or commercialisation, selling the difference itself. Partial measures slow the research drift, but none of them addresses the choice underneath."
 JAP_galapagos_openness_up_tt: "Raises §YOpenness§! by $RIGHT|+=0$, connecting Japan to standards and markets beyond its own"
 JAP_galapagos_openness_down_tt: "Lowers §YOpenness§! by $RIGHT|+=0$, turning Japan further inward from foreign standards and markets"
 JAP_technological_isolation_category: "Galapagos and the Electronics War"
 JAP_technological_isolation_category_desc: "Japanese industry perfected products for Japan alone: superb handsets, standards and services that nobody outside the home market could use, while the rest of the world standardised around someone else. That same insularity now leaves Japan's semiconductor sector exposed as China climbs the technology ladder.\n\n§YGalapagos Syndrome§!\n§YOpenness§!: [?JAP_galapagos_openness|0] / 100\n§Y$JAP_galapagos_drift_review_mission$§! reports the drift every thirty days and shows the exact figure before it is applied. The lower Openness sits the faster research falls behind, down to nothing at all at §G100§! and never worse than §R-15%§!.\n§GRaising Openness§!: the integration focuses carry most of it and the electronics focuses add the rest. The two campaigns below add a little more, but they only slow the drift. They cannot cure the syndrome.\n§GRemoval§!: only the §Y$JAP_world_integration$§! path removes §Y$JAP_galapagos_syndrome$§!, and only once Openness passes §G85§!. The §Y$JAP_cool_japan_doctrine$§! path keeps the spirit on purpose and turns Japan's cultural reach into influence instead.\n\n§YThe Model Competition§!\n§YElectronics Resilience§!: [?JAP_electronics_resilience|0]\nChina's pressure starts at §R1§! and rises by §R+1§! for each semiconductor milestone it reaches, and by another §R+1§! for as long as Openness sits below §R25§!, to a maximum of §R3§!. Pressure minus Resilience decides which tier of §Y$JAP_model_competition$§! Japan suffers. Beat the pressure outright and the spirit disappears; let China pull ahead unanswered and it returns.\n§GRaising Resilience§!: the semiconductor focuses grant it, and the export offensive below adds more until Resilience reaches §G4§!.\n§RWarning§!: that offensive needs Openness above §G10§!, unless §Y$JAP_cool_japan_doctrine$§! has been adopted and Japan has chosen to sell its difference rather than hide it."
 JAP_international_standards_adjustment: "International Standards Adjustment"
 JAP_international_standards_adjustment_desc: "Japanese industry writes its own standards, PDC for mobile and ISDB for broadcasting, and every one of them locks the domestic market away from the GSM and DVB world outside. The government sends engineers into the ISO and IEC working groups, which cannot undo the divergence overnight but puts Japanese names on the drafts every other country will read in a decade. The price is paid at home, in conformance testing rewritten each time a clause is conceded."
 JAP_english_business_environment: "English Business Environment"
 JAP_english_business_environment_desc: "Japanese managers cannot staff their own overseas subsidiaries in the language the contracts are written in. The government backs corporate English programmes and the Rakuten experiment that made English the working language of a Japanese firm and was mocked until the results arrived. It costs years of lost productivity while section chiefs learn to chair a meeting in a second language, and some of them never will."
 JAP_international_standards_adjustment_campaign: "Fund the Standards Delegations"
 JAP_international_standards_adjustment_campaign_desc: "Pay for another rotation of engineers into the ISO, IEC and ITU working groups, and cover the domestic conformance testing that follows every clause Japan concedes. The delegations come home with the drafts and industry gets a year to adjust before the next revision. Stop funding them and the seats go to somebody else."
 JAP_english_business_environment_campaign: "Subsidize Corporate English Programmes"
 JAP_english_business_environment_campaign_desc: "Underwrite the language training the member firms have been unwilling to pay for themselves: in-house instructors, TOEIC sittings on company time, and secondments to the overseas offices for everyone who passes. Output dips while people study. The firms that stay with it stop needing a translator in the room."
 JAP_cool_japan_doctrine: "The Cool Japan Doctrine"
 JAP_mitsubishi_aerospace_aircraft_manufacturer_header_wings_pilot_readiness: "Wings & Pilot Readiness"
 JAP_mitsubishi_aerospace_aircraft_manufacturer_header_air_defense_shield: "Air Defense Shield"
 JAP_kawasaki_aerospace_company_aircraft_manufacturer_header_rotary_wing_aircraft: "Rotary-Wing Aircraft"
 JAP_kawasaki_aerospace_company_aircraft_manufacturer_header_heavy_fixed_wing: "Heavy Fixed Wing"
 JAP_jsw_tank_manufacturer_header_mbt_mastery: "MBT Mastery"
 JAP_jsw_tank_manufacturer_header_self_propelled_excellence: "Self-Propelled Excellence"
 JAP_mitsubishi_heavy_industries_tank_manufacturer_header_battle_recon_power: "Battle & Recon Power"
 JAP_mitsubishi_heavy_industries_tank_manufacturer_header_artillery_anti_air_systems: "Artillery & Anti-Air Systems"
 JAP_komatsu_tank_manufacturer_header_light_vehicle_systems: "Light Vehicle Systems"
 JAP_komatsu_tank_manufacturer_header_heavy_vehicle_systems: "Heavy Vehicle Systems"
 JAP_subaru_tank_manufacturer_header_light_utility_performance: "Light Utility Performance"
 JAP_subaru_tank_manufacturer_header_systems_resilience: "Systems Resilience"
 JAP_howa_machinery_materiel_manufacturer_header_service_rifle_evolution: "Service Rifle Evolution"
 JAP_howa_machinery_materiel_manufacturer_header_support_weapons_accessories: "Support Weapons & Accessories"
 JAP_nec_materiel_manufacturer_header_light_wings: "Light Wings"
 JAP_nec_materiel_manufacturer_header_air_defense_shield: "Air Defense Shield"
 JAP_toshiba_materiel_manufacturer_header_rail_systems: "Rail Systems"
 JAP_toshiba_materiel_manufacturer_header_air_defense_systems: "Air Defense Systems"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_patrol_convoy_vessels: "Patrol & Convoy Vessels"
