 border_war_training_failure.1.t: "Травма во время тренировки"
 border_war_training_failure.1.d: "В результате несчастного случая во время полевых учений несколько солдат получили ранения, что вызвало вопросы об оперативной безопасности."
 border_war_training_failure.1.a: "Просмотрите упражнение"
 border_war_training_failure.2.t: "Авария с применением смешанных вооружений"
 border_war_training_failure.2.d: "В результате столкновения во время общевойсковых учений была повреждена техника, и несколько солдат получили ранения."
 border_war_training_failure.2.a: "Приостановите тренировку."
 border_war_tension_failure.1.t: "Действия на границе отбиты"
 border_war_tension_failure.1.d: "В ответ на очередную провокацию противоборствующие силы открыли точный огонь, что привело к гибели людей и сорвало местные приготовления."
 border_war_tension_failure.1.a: "Оттяните назад"
 border_war_operation_blocked.1.t: "Операция отменена"
 border_war_operation_blocked.1.d: "Право собственности, контроль, присутствие войск или дипломатические условия изменились до завершения подготовки. Операция была отменена без достижения прогресса в расходах."
 border_war_operation_blocked.1.a: "Понял"
 border_war_outcome.1.t: "Успешный толчок"
 border_war_outcome.1.d: "В последнем столкновении наши силы одержали победу и набрали темп в направлении своей цели."
 border_war_outcome.1.a: "Укрепить позицию"
 border_war_outcome.2.t: "Операция «Отброшено»"
 border_war_outcome.2.d: "Противоборствующие силы отразили атаку и ослабили наше продвижение в спорном регионе."
 border_war_outcome.2.a: "Пересмотрите план."
 border_war_outcome.3.t: "Тупиковая ситуация на границе"
 border_war_outcome.3.d: "Столкновение завершилось без решающего результата, что подорвало наш местный настрой."
 border_war_outcome.3.a: "Не вешайте трубку"
 pak_raj_border_claim.1.t: "Территориальное требование"
 pak_raj_border_claim.1.d_420: "[FROM.GetNameDefCap] использовал неоднократные локальные победы, чтобы потребовать Азад Кашмир. Уступка привела бы к передаче штата и снижению напряженности. Отказ спровоцировал бы более масштабный кризис."
 pak_raj_border_claim.1.d_427: "[FROM.GetNameDefCap] неоднократно одерживал победы на местных выборах, чтобы потребовать передачи Джамму и Кашмира. Уступка позволила бы передать штат и снизить напряженность. Отказ спровоцировал бы более масштабный кризис."
 pak_raj_border_claim.1.d_429: "[FROM.GetNameDefCap] использовал неоднократные локальные победы, чтобы потребовать Восточный Пенджаб. Уступка позволила бы передать штат и снизить напряженность. Отказ спровоцировал бы более масштабный кризис."
 pak_raj_border_claim.1.d_563: "[FROM.GetNameDefCap] использовал неоднократные победы на местных выборах, чтобы потребовать передачи центрального Пенджаба. Уступка позволила бы передать штат и снизить напряженность. Отказ спровоцировал бы более масштабный кризис."
 pak_raj_border_claim.1.d_573: "[FROM.GetNameDefCap] использовал неоднократные победы на местных выборах, чтобы потребовать Южный Пенджаб. Уступка позволила бы передать штат и снизить напряженность. Отказ спровоцировал бы более масштабный кризис."
 pak_raj_border_claim.1.d_426: "[FROM.GetNameDefCap] использовал неоднократные победы на местных выборах, чтобы потребовать передачи Синда. Уступка позволила бы передать управление штатом и снизить напряженность. Отказ спровоцировал бы более масштабный кризис."
 pak_raj_border_claim.1.d_987: "[FROM.GetNameDefCap] использовал неоднократные победы на местных выборах, чтобы потребовать передачи Западного Гуджарата. Уступка позволила бы передать штат и снизить напряженность. Отказ спровоцировал бы более масштабный кризис."
 pak_raj_border_claim.1.d_984: "[FROM.GetNameDefCap] использовал неоднократные победы на местных выборах, чтобы потребовать передачи Западного Раджастана. Уступка позволила бы передать штат и снизить напряженность. Отказ спровоцировал бы более масштабный кризис."
 pak_raj_border_claim.1.a: "Признать спорное государство"
 pak_raj_border_claim.1.b: "Отклонить претензию"
 pak_raj_border_crisis.1.t: "Разразился пограничный кризис"
 pak_raj_border_crisis.1.d: "Наши отвергнутые территориальные претензии переросли в дипломатический и военный кризис. Мобилизация может заставить пойти на уступки, но она также сужает путь к возвращению."
 pak_raj_border_crisis.1.a: "Мобилизация на границе"
 pak_raj_border_crisis.1.b: "Тихо отступите"
 pak_raj_border_crisis.2.t: "Соперник мобилизуется"
 pak_raj_border_crisis.2.d: "Противоборствующие силы движутся к границе. Мы можем провести контрмобилизацию или начать переговоры до того, как кризис станет сложнее сдержать."
 pak_raj_border_crisis.2.a: "Контрмобилизация"
 pak_raj_border_crisis.2.b: "Начать переговоры незамедлительно."
 pak_raj_border_crisis.3.t: "Территориальный ультиматум"
 pak_raj_border_crisis.3.d_420: "[FROM.GetNameDefCap] требует Азад Кашмир и угрожает ограниченной войной, если мы откажемся."
 pak_raj_border_crisis.3.d_427: "[FROM.GetNameDefCap] требует Джамму и Кашмир и угрожает ограниченной войной, если мы откажемся."
 pak_raj_border_crisis.3.d_429: "[FROM.GetNameDefCap] требует Восточный Пенджаб и угрожает ограниченной войной в случае нашего отказа."
 pak_raj_border_crisis.3.d_563: "[FROM.GetNameDefCap] требует захватить Центральный Пенджаб и угрожает ограниченной войной в случае нашего отказа."
 pak_raj_border_crisis.3.d_573: "[FROM.GetNameDefCap] требует Южный Пенджаб и угрожает ограниченной войной в случае нашего отказа."
 pak_raj_border_crisis.3.d_426: "[FROM.GetNameDefCap] требует выдвижения провинции Синд и угрожает ограниченной войной в случае нашего отказа."
 pak_raj_border_crisis.3.d_987: "[FROM.GetNameDefCap] требует освобождения Западного Гуджарата и угрожает ограниченной войной в случае нашего отказа."
 pak_raj_border_crisis.3.d_984: "[FROM.GetNameDefCap] требует Западный Раджастан и угрожает ограниченной войной в случае нашего отказа."
 pak_raj_border_crisis.3.a: "Принять и отозвать"
 pak_raj_border_crisis.3.b: "Отклоните ультиматум"
 pak_raj_border_crisis.4.t: "Ультиматум отклонен"
 pak_raj_border_crisis.4.d: "Соперник отклонил наше требование. Мы должны либо отстаивать свои претензии к спорному государству, либо понести политические издержки, связанные с отступлением."
 pak_raj_border_crisis.4.a: "Настаивайте на этом вопросе"
 pak_raj_border_crisis.4.b: "Отступите"
 pak_raj_border_crisis.5.t: "Ядерный сигнал"
 pak_raj_border_crisis.5.d: "Военные планировщики предлагают видимое изменение уровня ядерной готовности для демонстрации решимости. Сдержанность снизит напряженность, но может быть воспринята как слабость."
 pak_raj_border_crisis.5.a: "Повышение ядерной готовности"
 pak_raj_border_crisis.5.b: "Сохраняйте сдержанность."
 pak_raj_border_crisis.6.t: "Соперник сигнализирует о готовности"
 pak_raj_border_crisis.6.d: "Соперник заметно повысил свою ядерную готовность. Аналогичная позиция приведет к ядерному противостоянию, в то время как сдержанность снизит непосредственную напряженность."
 pak_raj_border_crisis.6.a: "Ответьте тем же"
 pak_raj_border_crisis.6.b: "Одностороннее снижение напряженности"
 pak_raj_border_crisis.7.t: "Запрос на посредничество"
 pak_raj_border_crisis.7.d: "Индо-пакистанский кризис угрожает региональной стабильности. Американские дипломаты могут предложить канал для уступок путем переговоров."
 pak_raj_border_crisis.7.a: "Предложите посредничество"
 pak_raj_border_crisis.7.b: "Держитесь подальше от этого"
 pak_raj_border_crisis.8.t: "Американская медиация"
 pak_raj_border_crisis.8.d: "Соединенные Штаты предложили выступить посредником в уступках друг другу. Согласие положило бы конец кризису и снизило бы двустороннюю напряженность."
 pak_raj_border_crisis.8.a: "Принять медиацию"
 pak_raj_border_crisis.8.b: "Отвергайте внешнее вмешательство."
 pak_raj_border_crisis.9.t: "Кризис миновал"
 pak_raj_border_crisis.9.d: "Непосредственное противостояние завершилось без открытой войны. Войска вдоль границы возвращаются к обычной боевой готовности."
 pak_raj_border_crisis.9.a: "Признано"
 pak_raj_border_crisis.10.t: "Дипломатическая победа"
 pak_raj_border_crisis.10.d: "Соперник признал спорное государство. Конфронтация завершилась на наших условиях."
 pak_raj_border_crisis.10.a: "Закрепить победу"
 pak_raj_border_crisis.11.t: "Срок действия претензии истек."
 pak_raj_border_crisis.11.d: "Контроль над спорной территорией перешёл к другому лицу ещё до разрешения кризиса. Территориальные требования больше недействительны."
 pak_raj_border_crisis.11.a: "Закройте файл"
 raj_chi_border_crisis.2.t: "Территориальное требование"
 raj_chi_border_crisis.2.d_475: "[FROM.GetNameDefCap] использовал неоднократные локальные победы, чтобы потребовать передачи Аруначал-Прадеша. Уступка позволила бы передать штат и успокоить ситуацию на границе, в то время как отказ грозит ограниченной войной."
 raj_chi_border_crisis.2.d_982: "[FROM.GetNameDefCap] использовал неоднократные локальные победы, чтобы потребовать передачи Сиккима. Уступка позволила бы передать штат и успокоить ситуацию на границе, в то время как отказ грозит ограниченной войной."
 raj_chi_border_crisis.2.d_591: "[FROM.GetNameDefCap] использовал неоднократные локальные победы, чтобы потребовать передачи Аксай-Чина. Уступка позволила бы передать государство и успокоить ситуацию на границе, в то время как отказ грозит ограниченной войной."
