 event_chain_will_fire: "일련의 파업과 정치적 대립이 조직된 노동이 기존 연립을 대체할 수 있는지 시험할 것입니다."
 news.83.t: "보스니아, 내전으로 복귀"
 news.83.desc: "스릅스카 공화국이 독립을 선언하면서 보스니아 헤르체고비나는 다시 내전 상태로 돌아갔습니다. 정치체 병력이 전국에서 동원되는 가운데 국제 기구들은 즉각적인 휴전을 촉구했습니다."
 news.83.a: "데이턴 평화는 실패했다"
 news.84.t: "무자헤딘, 보스니아 전쟁에 가담"
 news.84.desc: "엘 무자히드 전투원들이 사라예보와 결별하고 보스니아에 이슬람주의 국가를 선포했습니다. 이들의 개입은 분쟁에 세 번째 무장 세력을 더했으며 인접국 정부들의 비난을 샀습니다."
 news.84.a: "The war has escalated"
 news.86.t: "보스니아 내전 종결"
 news.86.desc: "승리한 세력이 잔존한 분리 세력을 물리치고 보스니아 헤르체고비나에 대한 통제권을 회복했습니다. 정부는 이제 동원 해제, 재건, 그리고 또 한 번의 정치적 합의 시도에 직면해 있습니다."
 news.86.a: "The fighting is over"
