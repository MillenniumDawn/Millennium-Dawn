 SOV_outdated_army_idea: "£text_icon_sov_army 시대에 뒤떨어진 군대"
 SOV_outdated_army_idea_desc: "The Russian Army is a shadow of its former self, short of modern equipment and of the money to train the conscripts it still calls up.\n§W--------------§!\nThis national spirit will be §Geased§! by the §HFinish the 1998 Military Reforms§! focus, and again by §HStart Military Reforms§! and §HContinue Military Reforms§!. It is §RRemoved§! entirely by the §HReserve Officer Training System§! focus."
 SOV_outdated_army_idea_1: "£text_icon_sov_army 시대에 뒤떨어진 군대"
 SOV_outdated_army_idea_1_desc: "The worst of the 1998 collapse has been dealt with, but the army still fights with Soviet stocks and a conscript intake it cannot train properly.\n§W--------------§!\nThis national spirit will be §Geased§! by the §HStart Military Reforms§! focus, and again by §HContinue Military Reforms§!. It is §RRemoved§! entirely by the §HReserve Officer Training System§! focus."
 SOV_outdated_army_idea_2: "£text_icon_sov_army 시대에 뒤떨어진 군대"
 SOV_outdated_army_idea_2_desc: "The New Look reforms have broken the inherited division structure down into permanent-readiness brigades, though the equipment behind them is largely unchanged.\n§W--------------§!\nThis national spirit will be §Geased§! by the §HContinue Military Reforms§! focus, and §RRemoved§! entirely by the §HReserve Officer Training System§! focus."
 SOV_outdated_army_idea_3: "£text_icon_sov_army 시대에 뒤떨어진 군대"
 SOV_outdated_army_idea_3_desc: "What remains is an officer corps trained for a war that no longer exists, and a reserve system that produces numbers rather than soldiers.\n§W--------------§!\nThis national spirit will be §RRemoved§! by the §HReserve Officer Training System§! focus."
