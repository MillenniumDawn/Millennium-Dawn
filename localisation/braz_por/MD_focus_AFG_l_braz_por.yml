 AFG_pomegranate_investment1_collect: "Coleta de romãs"
 AFG_pomegranate_investment1_collect_desc: "Os agricultores estão prontos para que recolhamos uma carga de romãs."
 AFG_almond_investment1_collect: "Coleta de amêndoas"
 AFG_almond_investment1_collect_desc: "Os agricultores estão prontos para que recolhamos uma carga de amêndoas."
 AFG_almond_investment1: "Investir na produção de amêndoas"
 AFG_almond_investment1_desc: "As amêndoas têm sido uma importante fonte de renda para muitos afegãos. O governo pode investir na indústria da amêndoa fornecendo infraestrutura, transporte e acesso ao mercado para os agricultores. Esse programa de investimento é limitado a 5 grandes iniciativas, após as quais o mercado atinge a saturação. Investimento: 5% do PIB, Retorno: 6% do PIB (margem de lucro de 20%)."
 AFG_pomegranate_investment1: "Investir na produção de romãs"
 AFG_pomegranate_investment1_desc: "As romãs do Afeganistão são mundialmente reconhecidas por sua qualidade. O governo pode investir em instalações de produção e redes comerciais para tirar proveito desse recurso natural. Esse programa de investimento é limitado a 5 grandes iniciativas, após as quais o mercado atinge a saturação. Investimento: 5% do PIB, Retorno: 6% do PIB (margem de lucro de 20%)."
 AFG_invite_nahzat_e_melli_ye_into_government: "Convidar o Hezb-e-Nuhzhat-e-Mili Afghanistan para o governo"
 AFG_domestic_decisions: "Metas Internas"
 AFG_domestic_decisions_desc: "Com uma nação em recuperação, estabelecemos objetivos para reconstruir o Estado e forjar um novo futuro."
 AFG_taloqan_siege_mission: "Manter a cidade"
 AFG_taloqan_siege_mission_desc: "Garantir a cidade é crucial à medida que nosso território diminui, e as vastas planícies do noroeste representam um alvo convidativo para uma futura ofensiva."
 AFG_headquarters_taloqan: "Quartel-general de Taloqan"
 AFG_headquarters_taloqan_desc: "Taloqan surgiu como um reduto fundamental para Ahmad Shah Massoud durante a invasão soviética. Posteriormente, tornou-se o centro de comando de [AFG.GetFlag] [AFG.GetNameDefCap], servindo como ponto crucial de acesso ao Tajiquistão após a queda de Mazar-i-Sharif para as forças talibãs em 1997."
 taliban_insurgency_category: "A insurgência talibã"
 taliban_insurgency_category_desc: "Embora as forças do £GFX_AFG_salafist_jihadism §YTalibã§! tenham sido derrotadas pelas forças da coalizão, elas não foram completamente eliminadas, e os militantes talibãs se fragmentaram e lançaram uma §Rinsurgência§! em todos os cantos do Afeganistão, passando a realizar diversos §Rataques terroristas§! contra o novo governo e as forças da coalizão. Espera-se que a erradicação da insurgência talibã leve anos, dependendo de muitos fatores.\n\nA §YForça do Talibã§! determina o poderio dos militantes talibãs dentro do país, e seu crescimento, bem como a nossa eficácia em erradicar a insurgência, dependerá da §Yconfiança no governo central (estabilidade, corrupção ou interferência estrangeira)§! e da §Ysituação na fronteira afegão-paquistanesa§!. Se a §YForça do Talibã§! for muito alta, o £GFX_AFG_salafist_jihadism §YTalibã§! poderá realizar §Rataques terroristas§! e até escalar para uma §Rnova guerra civil§!, embora alguns métodos possam ser eficazes para combater a ameaça talibã a curto prazo.\n\n§YForça do Talibã§!: [?AFG.taliban_strength]%"
 AFG_pashtunistan_decisions: "Unificando o Pashtunistão"
 AFG_pashtunistan_decisions_desc: "Quase 16% da população do Paquistão se identifica como pashtun, o grupo étnico mais dominante do Afeganistão. A maioria dos pashtuns paquistaneses vive no noroeste do país. Devido à guerra civil no Paquistão, muitas dessas pessoas sofrem agora sob um regime aterrorizante. É nosso dever protegê-las."
 AFG_russian_airlift_is_active: "Possui ponte aérea russa"
 AFG_donkey_logistics_tech: "Logística de animais de carga"
 AFG_donkey_logistics_tech_desc: "Comboios de mulas e burros transportam suprimentos por passagens que nenhum caminhão alcança."
 AFG_donkey_logistics_tech2: "Logística de animais de carga II"
 AFG_donkey_logistics_tech2_desc: "Caravanas maiores e pontos de concentração estabelecidos ao longo das rotas do norte."
 AFG_donkey_logistics_tech3: "Logística de animais de carga III"
 AFG_donkey_logistics_tech3_desc: "Um corpo de transporte permanente construído em torno das caravanas que nunca pararam de funcionar."
 AFG_legacy_of_the_mujahideen: "Legado dos mujahidin"
 AFG_legacy_of_the_mujahideen_desc: "Veteranos da guerra soviética transmitem sua experiência de campo à milícia."
 AFG_tech_the_farmer_and_their_rifle: "O agricultor e seu rifle"
 AFG_tech_the_farmer_and_their_rifle_desc: "Recrutas rurais que lutam por seus próprios vales e conhecem cada acesso a eles."
 AFG_tech_training_of_local_police_officers: "Treinamento de policiais locais"
 AFG_tech_training_of_local_police_officers_desc: "Milícias treinadas para policiar e lutar, e para manter o terreno uma vez conquistado."
 AFG_tech_return_of_dostum: "O retorno de Dostum"
 AFG_tech_return_of_dostum_desc: "Dostum está de volta ao norte, e as milícias uzbeques lutam como tal."
 AFG_the_lion_of_panjshir: "O Leão de Panjshir"
 AFG_the_lion_of_panjshir_desc: "A doutrina de Massoud de manter o terreno elevado e atacar a partir dele."
 AFG_karzai_installed: "Governo Karzai Instalado"
 AFG_political_path_chosen: "Um Caminho Político Foi Escolhido"
 AFG_border_wars.7.c: "Uma questão dos afegãos"
 AFG_border_wars.8.c: "Uma questão dos afegãos"
 AFG_request_american_return: "[USA.GetFlag] Pedir o retorno dos americanos"
 AFG_request_american_return_desc: "Os americanos partiram, e o Talibã voltou mais forte. Se não conseguirmos contê-los sozinhos, podemos pedir a Washington que envie suas tropas de volta."
 AFG_taliban_threat_overwhelming_tt: "Estamos em guerra com o §YTalibã§!, ou a §YForça do Talibã§! é de pelo menos §Y50§!"
 AFG_american_return_tt: "[USA.GetFlag] Os §YEstados Unidos§! retornam ao Afeganistão. Tornamo-nos seu súdito, ele entra em qualquer guerra que travarmos contra o §YTalibã§!, e sua presença reduz a §YForça do Talibã§! em §G2§! a cada mês de insurgência."
 AFG_arms_stockpile_limit_tt: "Equipment deliveries are limited to §Y[USA.GetName]§!'s available stockpiles."
 AFG_taliban_attack.1.b: "A troublesome development, but I don't want to hear it"