 NKO_use_russian_model: "Utiliser les modèles navals russes"
 NKO_use_russian_model_desc: "Adopter les stratégies navales russes renforcera notre flotte."
 NKO_armed_to_the_teeth: "Armés jusqu'aux dents"
 NKO_armed_to_the_teeth_desc: "Équiper chaque navire d'armes redoutables fera de notre marine une force indomptable."
 NKO_heavy_cruiser_focus: "Se concentrer sur les croiseurs lourds"
