 shipyard_allied_dockyards_tt: "Japan, South Korea, the United Kingdom, France, Germany, Italy, Spain or the Netherlands must have over §Y10§! dockyards, be at peace with us, and either share our faction or belong to the Major Non-NATO Ally technology-sharing group."
 SHIPYARD_READOUT_OK: "£dockyard_output_texticon §Y[?shipyard_readout_in_use|0]§!/[?shipyard_dockyards|0] · effective §Y[?shipyard_effective_dockyards|0]§!"
 SHIPYARD_READOUT_OVER: "£dockyard_output_texticon §R[?shipyard_readout_in_use|0]§!/[?shipyard_dockyards|0] · effective §R[?shipyard_effective_dockyards|0]§!"
 SHIPYARD_READOUT_TT: "This display compares dockyards in use with our total dockyards and the number we can staff.\n\nIf more than §Y[?shipyard_effective_dockyards|0]§! are still in use after the first monthly warning, each overloaded month adds §R1§! crisis point, costs §R1%§! Stability and penalizes states with dockyards. Free enough dockyards to bring usage back within capacity."
 md_shipyard.1.t: "The Yards Are Overloaded"
 md_shipyard.1.d: "We have put [?shipyard_dockyards_in_use|0] dockyards to work, but our shipbuilding base can staff only [?shipyard_effective_dockyards|0], so foremen are splitting the same crews between hulls.\n\nOvertime pay or crews pulled off repair work can keep every hull on the slipways for a while, but neither adds a single trained shipwright. Unless we free dockyards, the yards will make us pay for it later."
 md_shipyard.1.a: "We will free up dockyards"
 md_shipyard.1.b: "Pay the crews overtime"
 md_shipyard.1.c: "Pull crews off repair work"
 md_shipyard_overload_free_tt: "Reduce the dockyards assigned to production or repairs to §Y[?shipyard_effective_dockyards|0]§! or fewer. Each following month above capacity adds §R1§! crisis point, costs §R1%§! Stability and penalizes our dockyard states."
 md_shipyard_overload_overtime_tt: "For §Y90§! days, an overloaded month brings no penalty. After that, every month still above capacity adds §R1§! crisis point, costs §R1%§! Stability and penalizes our dockyard states."
 md_shipyard_overload_repair_crews_tt: "For §Y90§! days, an overloaded month brings no penalty, but our ships are repaired more slowly. After that, every month still above capacity adds §R1§! crisis point, costs §R1%§! Stability and penalizes our dockyard states."
 shipyard_overload_modifier: "Overloaded Shipyards"
 shipyard_overload_modifier_desc: "More hulls on the slipways than the yard can staff. The crews, the cranes and the suppliers are spread thin and the whole district pays for it."
 shipyard_repair_crews_modifier: "Repair Crews on the Slipways"
 shipyard_repair_crews_modifier_desc: "Our repair crews are working on new hulls. Damaged ships wait longer for a free berth."
 large_slipway: "Large Slipway"
 large_slipway_desc: "A working Large Slipway in a state we own and control avoids a §R+300%§! build-cost penalty for battlecruisers, battleships and aircraft carriers, and a §R+200%§! penalty for cruisers. Large amphibious ships (helicopter operators) face a §R+200%§! penalty without the facility, or §R+50%§! in Poland. Each working Large Slipway reduces destroyer and stealth destroyer construction cost by §G15 percentage points§!, up to §G60%§!."
 submarine_hall: "Submarine Hall"
 submarine_hall_desc: "A working Submarine Hall in a state we own and control avoids a §R+300%§! build-cost penalty for missile submarines. Each working Submarine Hall reduces attack submarine construction cost by §G15 percentage points§!, up to §G60%§!."
 shipyard_yard_class_equipment: "Missing Shipyard Facility"
 shipyard_slipway_discount: "Large Slipway Construction Discount"
 shipyard_hall_discount: "Submarine Hall Construction Discount"
 SHIPYARD_FACILITY_DISCOUNTS_TT: "Each working Large Slipway reduces destroyer and stealth destroyer construction cost by §G15 percentage points§!. Each working Submarine Hall gives the same reduction to attack submarines. Each discount is capped at §G60%§! and applies to every line of that class."
 shipyard_recovery_category: "Naval Shipbuilding"
 shipyard_recovery_category_desc: "Invest in shipyards and train crews to expand naval construction capacity."
 SHIPYARD_RECOVERY_OVERVIEW_TT: "Monthly backlog change §Y[?shipyard_drift|=2]§! points. Drydock modernization and shipwright training accelerate recovery. Recovering yards gain output as the backlog falls.\n\nDockyard output [?shipyard_mod_output|+%]\nIndustry growth [?shipyard_growth_output|+%]\nShip repair speed [?shipyard_mod_repair|+%]\nRefit speed [?shipyard_mod_refit|+%]\nRefit cost §R+[?shipyard_mod_refit_cost|%]§!"
 shipyard_recovery_modernize: "Modernize Naval Drydocks"
 shipyard_recovery_modernize_desc: "Upgrade the cranes, machinery and drydocks that slow naval work."
 shipyard_recovery_train: "Train Shipwrights"
 shipyard_recovery_train_desc: "Fund apprenticeships for welders, fitters and other specialists needed to expand the yards."
 shipyard_recovery_work_remaining_tt: "The shipyard backlog is above §Y0§!."
 shipyard_recovery_drydock_effect_tt: "Completion increases the monthly recovery rate by §G10%§! of the base rate."
 shipyard_recovery_training_effect_tt: "Completion increases the monthly recovery rate by §G15%§! of the base rate."
 SHIPYARD_FACILITIES_ACTIVE_TT: "§YSpecialized shipyards§!\n$SHIPYARD_SLIPWAY_COUNTS_TT$\n$SHIPYARD_HALL_COUNTS_TT$\n\n[shipyard_capital_facility_status]\n[shipyard_missile_facility_status]\n[shipyard_destroyer_discount_status]\n[shipyard_attack_discount_status]\n\n$SHIPYARD_FACILITY_DISCOUNTS_TT$\nCounts cover states we own and control. The first number shows working facilities. One working facility lifts its hull surcharge. Effects are refreshed monthly and after shipyard projects."
 SHIPYARD_FACILITIES_INACTIVE_TT: "§YSpecialized shipyard rules§!\nActivation requires §Y2 ordinary dockyards§! in states we own and control, §YNaval Systems Engineering§!, and a §Y1995 or later§! corvette, frigate or attack submarine hull. The game checks these conditions at startup and monthly."
 SHIPYARD_SLIPWAY_COUNTS_TT: "Working Large Slipways §Y[?shipyard_capital_yard|0]§!/[?shipyard_capital_yard_total|0]"
 SHIPYARD_HALL_COUNTS_TT: "Working Submarine Halls §Y[?shipyard_submarine_yard|0]§!/[?shipyard_submarine_yard_total|0]"
 SHIPYARD_CAPITAL_FACILITY_SURCHARGE_TT: "Missing Large Slipway. Cruisers §R+200%§!, helicopter operators [shipyard_amphibious_surcharge], battlecruisers, battleships and aircraft carriers §R+300%§! construction cost. Build or repair one Large Slipway to remove the surcharge."
 SHIPYARD_CAPITAL_FACILITY_READY_TT: "Large Slipway surcharge §G0%§! for cruisers, battlecruisers, battleships, aircraft carriers and helicopter operators."
 SHIPYARD_CAPITAL_FACILITY_WAITING_TT: "Large Slipway surcharge §Y0%§! at the last check. Researching a covered heavy or carrier hull activates it when no Large Slipway is working."
 SHIPYARD_AMPHIBIOUS_SURCHARGE_POL: "§R+50%§!"
 SHIPYARD_AMPHIBIOUS_SURCHARGE: "§R+200%§!"
 SHIPYARD_MISSILE_FACILITY_SURCHARGE_TT: "Missile submarines §R+300%§! construction cost. Build or repair one Submarine Hall to remove the surcharge."
 SHIPYARD_MISSILE_FACILITY_READY_TT: "Missile submarine facility surcharge §G0%§!."
 SHIPYARD_MISSILE_FACILITY_WAITING_TT: "Missile submarine facility surcharge §Y0%§! at the last check. Researching a missile submarine hull activates it when no Submarine Hall is working."
 SHIPYARD_DESTROYER_DISCOUNT_TT: "Destroyer and stealth destroyer construction §G-[?shipyard_tooltip_discount|0]%§! from working Large Slipways."
 SHIPYARD_DESTROYER_STANDARD_TT: "Destroyers and stealth destroyers use ordinary dockyards. Facility discount §Y0%§!."
 SHIPYARD_ATTACK_DISCOUNT_TT: "Attack submarine construction §G-[?shipyard_tooltip_discount|0]%§! from working Submarine Halls."
 SHIPYARD_ATTACK_STANDARD_TT: "Attack submarines use ordinary dockyards. Facility discount §Y0%§!."
