 CHI_nc_inf_social_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_social|Y0]"
 CHI_nc_inf_ufwd_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_ufwd|Y0]"
 CHI_Normalise_the_Hermit: "Normaliser l'Ermite"
 CHI_Normalise_the_Hermit_desc: "Les réformes prenant racine, nous parrainons la réintégration formelle de la Corée du Nord dans les canaux économiques et diplomatiques régionaux, mettant fin à des décennies d'isolement et nous positionnant comme les architectes de l'ouverture de Pyongyang."
 CHI_Nuclear_Insurance: "Assurance Nucléaire"
 CHI_Nuclear_Insurance_desc: "Nous étendons une reconnaissance de facto de l'arsenal nucléaire nord-coréen comme dissuasion, non comme passif. En acceptant Pyongyang comme État nucléaire, nous fournissons une assurance contre l'effondrement du régime tout en attirant la condamnation internationale."
 CHI_operation_new_dawn_desc: "Lancer une opération décisive de forces spéciales contre la direction de Pyongyang. Les réseaux Jang et Princelings détermineront si cela s'achève par un coup d'État propre, une guerre civile, ou un désastre."
 CHI_palm_and_fingers_doctrine: "Doctrine de la paume et des doigts"
 CHI_palm_and_fingers_doctrine_desc: "Le Tibet est la paume. Le Ladakh, le Népal, le Sikkim, le Bhoutan et l'Arunachal sont les doigts. La doctrine stratégique les exige tous les cinq."
 CHI_pla_divestiture_completion: "Achèvement de la cession de PLA"
 CHI_pla_divestiture_completion_desc: "L'APL a longtemps été tenue de se défaire de son empire commercial tentaculaire — hôtels, firmes pharmaceutiques et sociétés de négoce. Achever ce processus restaure le focus unique de l'armée et retire une source majeure de corruption des officiers. Une armée qui gère des hôtels ne pense pas à la guerre."
 CHI_Pyongyang_Pivot: "Le pivot de Pyongyang"
 CHI_Pyongyang_Pivot_desc: "Plutôt que de durcir le régime, la Chine encourage une ouverture économique prudente calquée sur les réformes de Deng Xiaoping. Une Corée du Nord plus prospère serait un voisin plus stable — et un partenaire plus malléable."
 CHI_Rare_Earth_Leverage: "Levier des terres rares"
 CHI_Rare_Earth_Leverage_desc: "Les industries sud-coréennes d'électronique avancée et de semi-conducteurs dépendent fortement des exportations chinoises de terres rares. En jouant de cette dépendance, nous pouvons approfondir les liens économiques et accroître notre influence sur le calcul de politique étrangère de Séoul."
 CHI_Rason_SEZ_Expansion: "Extension de la ZES de Rason"
 CHI_Rason_SEZ_Expansion_desc: "La zone économique spéciale de Rason sur la côte nord-est de la Corée du Nord offre un cas d'essai de modernisation économique. L'investissement chinois peut débloquer l'accès portuaire et les flux de ressources tout en démontrant la viabilité d'une réforme graduelle."
 CHI_Sanctions_Evasion: "Évasion des sanctions"
 CHI_Sanctions_Evasion_desc: "Tout en soutenant publiquement les sanctions internationales, nous pouvons discrètement laisser se poursuivre le commerce transfrontalier et les flux financiers. Cela approfondit la dépendance nord-coréenne vis-à-vis de la Chine tout en maintenant un déni plausible, bien qu'une découverte endommagerait les relations avec l'Occident."
 CHI_sco_balance_display: "$CHI_sco_balance$ : [?CHI_sco_balance]"
 CHI_sco_cohesion_display: "$CHI_sco_cohesion$ : [?CHI_sco_cohesion]"
 CHI_scs_island_construction_campaign: "Campagne de construction d'îles"
 CHI_scs_island_construction_campaign_desc: "Lancer le programme pluriannuel de dragage et de construction à travers la chaîne des Spratleys. Des récifs submergés sont élevés en îles artificielles capables d'accueillir des installations permanentes, étendant l'empreinte administrative effective des revendications chinoises de milliers de kilomètres carrés."
 CHI_shanghai_clique_ascendant_desc: "Les lumières du Bund touchent chaque ministère. Les comptables de Pudong siègent désormais au Conseil des affaires d'État. Le réseau va plus loin que la doctrine."
 CHI_shanghai_clique_leaning_desc: "Les réseaux du Bund ont voix dans chaque ministère. Les délégués provinciaux se couvrent en penchant vers Pudong."
 CHI_Six_Party_Talks: "Pourparlers à six"
 CHI_Six_Party_Talks_desc: "Les pourparlers à six réunissent la Chine, les États-Unis, la Russie, le Japon et les deux Corées pour négocier une résolution de la crise nucléaire nord-coréenne. En les accueillant, nous pouvons nous positionner comme médiateur indispensable et améliorer les relations avec toutes les parties."
 CHI_technocratic_consolidation_desc: "Le Bureau de recherche du Conseil des affaires d'État, c'est le pays. Les plans quinquennaux sont rédigés avant les réunions du Politburo, pas après."
 chi_the_one_china_policy: "La politique d'une Chine unique"
 CHI_water_pricing_reform: "Réforme de la tarification de l'eau industrielle"
 CHI_water_pricing_reform_desc: "Plutôt que l'ingénierie de l'offre, les prix servent à réduire le gaspillage. Les tarifs de l'eau industrielle sont fortement relevés, forçant l'industrie lourde à adopter le recyclage et à se relocaliser vers des zones à avantage hydrique comparatif. Les agriculteurs résistent à la hausse des coûts."
 CHI_Yalu_Defense_Pact: "Pacte de défense du Yalou"
 CHI_Yalu_Defense_Pact_desc: "Un arrangement de défense formel le long du Yalou lie notre planification militaire à celle de la Corée du Nord, nous garantissant l'accès tout en engageant une défense mutuelle."
 CHI_youth_league_leaning_desc: "Les anciens du Tuan occupent des postes de vice-gouverneurs dans la moitié des provinces. L'équilibre du patronage bascule, en silence et sans relâche."
 CHI_youth_league_resurgent_desc: "Chaque vice-gouverneur provincial de moins de cinquante ans est passé par le Tuan. La cohorte est en place. L'agenda suivra."
 paektu_doctrine_southern: "Doctrine Paektu : alerte sud"
 uighur_threat_display: "$uighur_threat$ : [?uighur_threat]"
 CHI_back_princeling_network: "Soutenir les réseaux des princelings"
 CHI_back_princeling_network_desc: "Orienter le patronage vers les fils de l'élite révolutionnaire et l'establishment de Shanghai, déplaçant l'équilibre du pouvoir vers la faction des princelings."
 CHI_promote_youth_league: "Promouvoir les cadres de la Ligue de la jeunesse"
 CHI_promote_youth_league_desc: "Promouvoir les cadres issus de la Ligue de la jeunesse communiste, déplaçant l'équilibre du pouvoir vers la faction du Tuanpai."
 CHI_SAR_one_china_framework: "Cadre d'une seule Chine"
 CHI_SAR_one_china_framework_desc: "Pékin réaffirme le fondement constitutionnel de son autorité sur toutes les régions administratives spéciales et territoires. Le cadre instaure une direction politique unifiée depuis le centre tout en reconnaissant les arrangements administratifs distincts de chaque région."
 CHI_SAR_liaison_office_reform: "Réforme du bureau de liaison"
 CHI_SAR_liaison_office_reform_desc: "Le Conseil des affaires d'État réorganise ses bureaux de liaison des RAS en un réseau de coordination plus intégré. Des canaux de communication rationalisés entre Pékin et les RAS accélèrent la mise en œuvre des politiques et réduisent les frictions administratives."
 CHI_SAR_national_security_framework: "Architecture de sécurité nationale"
 CHI_SAR_national_security_framework_desc: "Un appareil de sécurité nationale unifié est étendu à tous les territoires des RAS. La coordination entre les garnisons de l'Armée populaire de libération, les bureaux de la sécurité d'État et les polices locales est formalisée sous tutelle centrale."
 CHI_SAR_two_systems_commitment: "Engagement envers les deux systèmes"
 CHI_SAR_two_systems_commitment_desc: "Pékin réaffirme officiellement le principe « un pays, deux systèmes » pour toutes les RAS éligibles. Une large autonomie est garantie dans le cadre constitutionnel, signalant une préférence pour l'accommodement plutôt que l'intégration."
 CHI_SAR_research_sharing: "Coopération scientifique des RAS"
 CHI_SAR_research_sharing_desc: "Pékin établit des programmes de recherche conjoints reliant les universités et laboratoires d'État du continent aux institutions des RAS. L'initiative approfondit les liens académiques et technologiques tout en élargissant la capacité de recherche de la Chine."
 CHI_SAR_military_corporation_sharing: "Intégration de l'industrie de défense"
 CHI_SAR_military_corporation_sharing_desc: "Les sous-traitants de défense et bureaux d'ingénierie basés dans les RAS sont intégrés au réseau d'approvisionnement du continent. Des normes de production et des chaînes d'approvisionnement partagées augmentent la capacité de production de l'Armée populaire de libération."
 CHI_SAR_military_corporation_sharing_mio_tt: "Les régions administratives spéciales ont accès aux organisations militaro-industrielles chinoises"
 CHI_SAR_one_system_declaration: "Une déclaration de système"
 CHI_SAR_one_system_declaration_desc: "Le Conseil des affaires d'État signale un tournant vers une intégration plus poussée de la gouvernance des RAS aux systèmes continentaux. Les cadres juridiques et administratifs séparés seront progressivement harmonisés avec la République populaire dans les années à venir."
 CHI_SAR_han_superiority: "Doctrine de la primauté han"
 CHI_SAR_han_superiority_desc: "Pékin abandonne le modèle d'État multiethnique au profit d'une identité nationale unique centrée sur la majorité han. Echo de la « politique ethnique de seconde génération » défendue par des universitaires comme Hu Angang et Hu Lianhe, l'autonomie fondée sur l'ethnicité est démantelée et l'assimilation s'accélère dans toutes les régions."
 CHI_HKG_greater_bay_area: "Initiative de la Grande Baie"
 CHI_HKG_greater_bay_area_desc: "Pékin et Hong Kong lancent conjointement le projet de Grande baie Guangdong-Hong Kong-Macao, reliant onze villes en un seul corridor d'innovation et de finance. Le schéma représente le programme d'intégration régionale le plus ambitieux de la Chine depuis la zone économique spéciale de Shenzhen."
 CHI_HKG_financial_integration: "Intégration du système financier"
 CHI_HKG_financial_integration_desc: "Les mécanismes de flux de capitaux transfrontaliers sont élargis sous les schémas Stock Connect et Bond Connect. Le rôle de Hong Kong comme principal pôle offshore du renminbi est formalisé, approfondissant l'interdépendance avec les marchés financiers du continent."
 CHI_HKG_express_rail_link: "Liaison ferroviaire express"
 CHI_HKG_express_rail_link_desc: "La liaison ferroviaire à grande vitesse Guangzhou-Shenzhen-Hong Kong est achevée, connectant Hong Kong directement au réseau à grande vitesse chinois. Les temps de trajet entre Hong Kong et les grandes villes du continent sont dramatiquement réduits, accélérant le mouvement des personnes et du commerce."
 CHI_HKG_individual_visit_scheme: "Programme de visites individuelles"
 CHI_HKG_individual_visit_scheme_desc: "Pékin élargit le régime de visites individuelles, permettant aux résidents du continent de villes supplémentaires de se rendre à Hong Kong sans restrictions de voyages de groupe. L'afflux de touristes et d'acheteurs du continent fournit un coup de pouce substantiel aux secteurs du commerce de détail et des services de Hong Kong."
 CHI_HKG_shenzhen_hk_stock_connect: "Connexion boursière Shenzhen-Hong Kong"
 CHI_HKG_shenzhen_hk_stock_connect_desc: "Un programme d'accès mutuel aux marchés relie les Bourses de Hong Kong et de Shenzhen, permettant aux investisseurs des deux côtés de négocier les actions cotées de l'autre. Le schéma cimente encore le rôle indispensable de Hong Kong comme porte d'entrée des flux de capitaux transfrontaliers."
 CHI_HKG_electoral_reform: "Réforme du système électoral"
 CHI_HKG_electoral_reform_desc: "Pékin restructure le cadre électoral du Conseil législatif de Hong Kong, réduisant les sièges élus au suffrage direct et introduisant un mécanisme de filtrage des candidats pour n'assurer que des « patriotes » se présentent. La réforme déplace définitivement le pouvoir politique loin de l'opposition pro-démocratie."
 CHI_HKG_media_freedom: "Garanties de la liberté de la presse"
 CHI_HKG_media_freedom_desc: "En concession à la pression de la société civile, Pékin accepte des protections statutaires de l'indépendance éditoriale à Hong Kong. Les organisations médiatiques internationales interprètent la garantie comme un signal que le modèle « deux systèmes » sera honoré jusqu'en 2047."
 CHI_HKG_censorship: "Censure d'internet et des médias"
 CHI_HKG_censorship_desc: "Pékin ordonne aux autorités de Hong Kong d'aligner les réglementations internet et de radiodiffusion de la ville sur les normes du continent. Les sites hébergeant du contenu jugé politiquement sensible sont bloqués, et les rédacteurs des grands journaux subissent une pression à l'autocensure."
 CHI_HKG_moral_national_education: "Éducation morale et nationale"
 CHI_HKG_moral_national_education_desc: "Un nouveau curriculum obligatoire d'éducation nationale est introduit dans les écoles de Hong Kong, mettant l'accent sur la loyauté au Parti communiste et une vision sino-centrée de l'histoire chinoise. La politique génère une opposition publique significative mais se poursuit sous direction centrale."
 CHI_HKG_national_security_law: "Loi de la RPC sur la sauvegarde de la sécurité nationale dans la RASHK"
 CHI_HKG_national_security_law_desc: "Afin de maintenir la stabilité à long terme de la société de Hong Kong et le système « un pays, deux systèmes », notre pays doit introduire une loi de protection de la sécurité applicable à Hong Kong. La loi de la République populaire de Chine sur la sauvegarde de la sécurité nationale dans la région administrative spéciale de Hong Kong stipule en détail que le gouvernement populaire central porte la responsabilité fondamentale des affaires de sécurité nationale liées à la région administrative spéciale de Hong Kong, a le droit de stationner des troupes à Hong Kong pour sauvegarder la sécurité nationale, prévenir, arrêter et punir les crimes liés à la région administrative spéciale de Hong Kong tels que la sécession, la subversion du pouvoir de l'État, l'organisation et la réalisation d'activités terroristes et la collusion avec des forces étrangères ou externes pour mettre en danger la sécurité nationale, maintenir la prospérité et la stabilité de la région administrative spéciale de Hong Kong, et protéger les droits et intérêts légitimes des résidents de la région administrative spéciale de Hong Kong."
 CHI_HKG_lok_ma_chau_loop: "Aménagement de la boucle de Lok Ma Chau"
 CHI_HKG_lok_ma_chau_loop_desc: "Une zone dédiée à l'innovation et à la technologie est établie sur la boucle de Lok Ma Chau, une parcelle à la frontière de Shenzhen destinée au développement conjoint. Le parc vise à attirer des institutions de recherche et des firmes technologiques cherchant la proximité de Hong Kong et du continent."
 CHI_HKG_2030_study: "Étude stratégique Hong Kong 2030+"
 CHI_HKG_2030_study_desc: "Le gouvernement de Hong Kong publie sa stratégie de planification spatiale à long terme, identifiant des sites pour de nouvelles zones de développement, des corridors de transport et des terrains industriels. L'étude inscrit la croissance physique de Hong Kong dans le contexte de l'intégration de la Grande baie."
 CHI_HKG_palace_museum: "Musée du palais de Hong Kong"
 CHI_HKG_palace_museum_desc: "Une antenne du Palais-musée de Pékin est établie dans le quartier culturel de West Kowloon à Hong Kong, exposant des artefacts prêtés par la collection de la Cité interdite. Le projet est présenté comme un pont culturel entre Hong Kong et le continent, attirant une attention internationale significative."
 CHI_HKG_zhuhai_macau_bridge: "Pont Hong Kong-Zhuhai-Macao"
 CHI_HKG_zhuhai_macau_bridge_desc: "Le plus long système pont-tunnel maritime du monde est achevé, reliant Hong Kong, Zhuhai et Macao à travers l'estuaire de la rivière des Perles. L'ouvrage réduit dramatiquement les temps de trajet terrestre entre les trois villes et sert d'épine dorsale physique de l'intégration de la Grande baie."
 CHI_HKG_lok_ma_chau_station: "Agrandissement de la gare de Lok Ma Chau"
 CHI_HKG_lok_ma_chau_station_desc: "Le poste-frontière de Lok Ma Chau est modernisé avec des installations passagers et fret élargies, réduisant la congestion à l'un des points d'entrée terrestres les plus fréquentés de Hong Kong. Un meilleur débit logistique accélère le commerce transfrontalier et les flux de navetteurs."
 CHI_SAR_integrate_HKG: "Intégration de Hong Kong"
 CHI_SAR_integrate_HKG_desc: "Les systèmes politiques et économiques de Hong Kong pleinement alignés sur le continent, Pékin dissout formellement le statut administratif séparé de la RAS. L'ancienne colonie est incorporée comme municipalité à administration directe de la République populaire."
 CHI_MAC_pearl_river_delta: "Intégration du delta de la rivière des Perles"
 CHI_MAC_pearl_river_delta_desc: "Macao est formellement incorporée à la zone économique du delta de la rivière des Perles, avec des investissements d'infrastructure visant à réduire son isolement économique. Le pont Hong Kong-Zhuhai-Macao devient l'épine dorsale d'un nouveau réseau de transport transfrontalier."
 CHI_MAC_lotus_flower_economy: "Économie de la fleur de lotus"
 CHI_MAC_lotus_flower_economy_desc: "Macao lance une initiative de repositionnement économique ancrée dans l'identité distinctive du territoire comme RAS sino-portugaise. Plutôt que de viser un seul secteur, la stratégie repositionne Macao comme « centre mondial du tourisme et des loisirs », une marque qui encadre tous les efforts de diversification en aval et s'aligne sur la vision de Pékin pour la Grande baie."
 CHI_MAC_financial_services: "Centre de services financiers offshore"
 CHI_MAC_financial_services_desc: "Le cadre réglementaire de Macao est mis à jour pour attirer la banque offshore, l'émission d'obligations et le règlement en renminbi. L'héritage juridique portugais du territoire est mis en avant comme un avantage pour les investisseurs lusophones cherchant une exposition au continent."
 CHI_MAC_infrastructure_link: "Liaison d'infrastructures transfrontalière"
 CHI_MAC_infrastructure_link_desc: "Un nouveau poste-frontière et une extension de métro léger relient directement la zone de développement de Cotai à Macao à la zone de coopération approfondie Guangdong-Macao sur l'île de Hengqin. Le projet intègre physiquement l'empreinte économique de Macao au continent."
 CHI_MAC_guangdong_integration: "Accord d'intégration du Guangdong"
 CHI_MAC_guangdong_integration_desc: "Un accord de coopération global avec la province du Guangdong aligne la planification, le droit et la réglementation financière de Macao sur les normes du continent. Les officiels décrivent l'accord comme un modèle de convergence pacifique entre gouvernance de RAS et du continent."
 CHI_SAR_integrate_MAC: "Intégration complète de Macao"
 CHI_SAR_integrate_MAC_desc: "Après des décennies d'harmonisation économique et juridique croissante, le statut de RAS de Macao est dissous. Le territoire est absorbé dans le système administratif provincial du Guangdong, achevant la dernière étape de la rétrocession de 1999."
 CHI_MAC_cultural_autonomy_push: "Mouvement du patrimoine portugais"
 CHI_MAC_cultural_autonomy_push_desc: "Des organisations civiles militent pour préserver l'identité culturelle sino-portugaise distincte de Macao face à l'intégration accélérée au continent. Les revendications incluent une protection statutaire de la langue portugaise, de la communauté macanaise et du pluralisme juridique unique du territoire."
 CHI_MAC_lusophone_connections: "Stratégie de passerelle lusophone"
 CHI_MAC_lusophone_connections_desc: "Macao se pose en pont indispensable entre la Chine et le monde lusophone en élargissant son Forum pour la coopération économique et commerciale. La reconnaissance internationale de ce rôle unique fournit un argument politique pour préserver une large autonomie."
 CHI_TIB_plateau_development: "Fonds de développement du plateau"
 CHI_TIB_plateau_development_desc: "Le Conseil des affaires d'État lance un vaste programme d'investissement pour la région autonome du Tibet, ciblant les infrastructures, le logement et les services publics. Le programme reprend la stratégie de développement de l'Ouest, mais est présenté en interne comme une initiative de lutte contre la pauvreté."
 CHI_TIB_railway_modernization: "Extension du chemin de fer Qinghai-Tibet"
 CHI_TIB_railway_modernization_desc: "Une deuxième phase du chemin de fer Qinghai-Tibet est approuvée, prolongeant la ligne jusqu'à Shigatse puis, à terme, Nyingchi près de la frontière indienne. Le projet réduit l'isolement logistique du Tibet et accélère les mouvements de colons han et de forces de sécurité."
 CHI_TIB_release_falun_gong: "Amnistie du Falun Gong"
 CHI_TIB_release_falun_gong_desc: "Dans un geste d'ouverture calculé, Pékin libère des pratiquants du Falun Gong emprisonnés et assouplit les restrictions sur les activités religieuses du mouvement dans la région autonome du Tibet. La concession suscite des éloges prudents des gouvernements occidentaux et signale une approche plus souple de la dissidence religieuse."
 CHI_TIB_return_dalai_lama: "Retour du dalaï-lama"
 CHI_TIB_return_dalai_lama_desc: "Après de longues négociations en coulisses, Pékin et les représentants du dalaï-lama parviennent à un accord autorisant le chef spirituel tibétain à rentrer à Lhassa à titre cérémoniel. L'accord n'accorde pas d'autonomie politique, mais génère un fort capital de bonne volonté dans les capitales internationales."
 CHI_TIB_sinification: "Campagne d'éducation patriotique"
 CHI_TIB_sinification_desc: "Le Parti lance un programme systématique de rééducation idéologique dans les monastères et les écoles tibétaines, exigeant des dénonciations du dalaï-lama et des serments de loyauté à la mère patrie. La campagne s'inspire de l'initiative « Frappe dure » des années 1990 et est menée par des équipes de travail spécialement déployées."
 CHI_TIB_autonomy_preservation: "Cadre d'autonomie véritable"
 CHI_TIB_autonomy_preservation_desc: "Face à la pression internationale et aux troubles récurrents, Pékin ouvre des négociations avec les représentants du dalaï-lama sur l'élargissement de l'autonomie culturelle et religieuse. La proposition de Strasbourg et la Voie du milieu servent de base aux discussions en coulisses."
 CHI_TIB_cultural_integration: "Sinicisation de la gouvernance"
 CHI_TIB_cultural_integration_desc: "Des cadres han sont nommés aux postes de direction de l'appareil administratif, judiciaire et sécuritaire du Tibet. Le mandarin remplace le tibétain comme langue de l'administration, et les programmes de toutes les écoles d'État sont alignés sur le contenu du continent."
 CHI_SAR_integrate_TIB: "Intégration totale du Tibet"
 CHI_SAR_integrate_TIB_desc: "L'autorité religieuse neutralisée, les structures administratives pleinement alignées et la transformation démographique achevée, le statut résiduel de RAS de la région autonome du Tibet est dissous. Le Tibet est réintégré comme province ordinaire sous administration directe du gouvernement central."
 CHI_TIB_buddhist_cultural_zone: "Zone de préservation de la culture bouddhiste"
 CHI_TIB_buddhist_cultural_zone_desc: "Une zone de préservation désignée est établie autour du palais du Potala et du temple Jokhang, accordant une reconnaissance formelle limitée au bouddhisme tibétain comme institution de patrimoine culturel. Les critiques y voient un compromis touristique qui évite toute liberté religieuse substantielle."
 CHI_TIB_silk_road_gateway: "Passerelle de la Route de la Soie de l'Himalaya"
 CHI_TIB_silk_road_gateway_desc: "La position géographique du Tibet au carrefour des corridors sud-asiatiques des Nouvelles routes de la soie est mise à profit pour investir dans les infrastructures frontalières, l'hydroélectricité et la logistique commerciale. L'initiative intègre l'économie tibétaine aux marchés du Népal et d'Asie du Sud tout en approfondissant la dépendance vis-à-vis du continent."
 CHI_TIB_monastery_economy: "Économie du monastère"
 CHI_TIB_monastery_economy_desc: "Les institutions monastiques tibétaines, historiquement le pilier de l'économie régionale, sont autorisées à exploiter des entreprises commerciales dans le cadre de la RAS. Le tourisme de pèlerinage, la production de médecine traditionnelle et l'artisanat génèrent des recettes au bénéfice des monastères comme des communautés locales."
 CHI_TIB_plateau_resources: "Levé minéral du plateau"
 CHI_TIB_plateau_resources_desc: "La région autonome du Tibet lance un inventaire indépendant identifiant d'importants gisements de lithium, de cuivre et de chromite sur le plateau tibétain. Les autorités de la RAS négocient des accords de partage des recettes conservant une part des revenus d'extraction dans le budget régional."
 CHI_ETK_corridor_investment: "Investissement dans le corridor des Nouvelles routes de la soie"
 CHI_ETK_corridor_investment_desc: "Le Xinjiang est désigné comme principale porte terrestre des Nouvelles routes de la soie, attirant d'énormes investissements d'État dans le rail, les oléoducs et les autoroutes. Le terminus nord du corridor économique Chine-Pakistan à Kachgar transforme la géographie économique de la région."
 CHI_ETK_resource_extraction: "Extraction énergétique et minière"
 CHI_ETK_resource_extraction_desc: "Les réserves de pétrole et de gaz du bassin du Tarim sont étendues dans le cadre d'un programme d'État privilégiant la construction de pipelines et les capacités de raffinage. La part du Xinjiang dans la production pétrolière nationale augmente nettement, même si les transferts de recettes vers le centre restent un grief persistant."
 CHI_ETK_silk_road_commerce: "Initiative commerciale de la Route de la soie"
 CHI_ETK_silk_road_commerce_desc: "Les réseaux marchands ouïghours traditionnels du Xinjiang sont formellement intégrés à la politique commerciale régionale, avec des licences préférentielles pour le commerce transfrontalier avec les républiques d'Asie centrale. La politique ravive un schéma historique de commerce médiatisé par les Ouïghours, datant de la dynastie Tang."
 CHI_ETK_oilfield_development: "Mise en valeur des gisements du bassin du Tarim"
 CHI_ETK_oilfield_development_desc: "Le gouvernement de la RAS du Xinjiang négocie des coentreprises avec les compagnies énergétiques nationales pour l'exploration du bassin du Tarim, obtenant une part sans précédent des redevances d'extraction pour les infrastructures régionales. Les champs pétrolifères figurent parmi les plus vastes de Chine et étayent l'indépendance budgétaire de la région."
 CHI_ETK_strike_hard_campaign: "Campagne Frapper fort"
 CHI_ETK_strike_hard_campaign_desc: "La campagne « Frappe dure, pression maximale » visant les réseaux séparatistes ouïghours est relancée à une échelle sans précédent, intégrant surveillance numérique, détention de masse et répression systématique de la pratique religieuse. Les organisations internationales de défense des droits de l'homme documentent des abus généralisés."
 CHI_ETK_education_centres: "Centres d'enseignement des compétences professionnelles"
 CHI_ETK_education_centres_desc: "Un réseau d'établissements de détention extrajudiciaire, officiellement décrits comme « centres d'éducation et de formation professionnelle », est établi à travers le Xinjiang. Une grille de surveillance numérique complète — reconnaissance faciale, bases d'ADN et monitoring des smartphones — est déployée dans toute la région."
 CHI_ETK_total_survaillance_infrastructure: "Infrastructure de surveillance totale"
 CHI_ETK_total_survaillance_infrastructure_desc: "Une grille de surveillance à l'échelle de la région est construite au Xinjiang, intégrant caméras de reconnaissance faciale, points de contrôle biométriques et logiciels obligatoires de monitoring des smartphones. Le système offre aux autorités une visibilité quasi totale sur les déplacements de la population et l'activité en ligne."
 CHI_SAR_integrate_ETK: "Intégration totale du Xinjiang"
 CHI_SAR_integrate_ETK_desc: "Après la quasi-éradication de l'activité séparatiste et le démantèlement des structures sociales ouïghoures traditionnelles, le cadre administratif de RAS du Xinjiang est dissous. La région est réorganisée sous administration provinciale standard, sans dispositions particulières d'autonomie ethnique."
 CHI_ETK_autonomy_statute: "Statut d'autonomie du Xinjiang"
 CHI_ETK_autonomy_statute_desc: "Un nouveau statut d'autonomie régionale accorde aux communautés musulmanes du Xinjiang des droits formels à la pratique religieuse, à l'enseignement en ouïghour et au droit coutumier en matière personnelle. Le statut est avalisé par un groupe restreint d'organisations islamiques internationales."
 CHI_ETK_islamic_governance_framework: "Cadre de gouvernance islamique"
 CHI_ETK_islamic_governance_framework_desc: "Pékin adopte une approche plus conciliante au Xinjiang, autorisant une pratique religieuse islamique réglementée, élargissant l'enseignement en ouïghour et nommant davantage de cadres ouïghours aux gouvernements locaux. La politique rappelle la relative clémence de la période antérieure à 2017."
 CHI_ETK_BRI_hub: "Zone économique spéciale de Kachgar"
 CHI_ETK_BRI_hub_desc: "Kachgar est désignée zone économique spéciale, avec un régime fiscal préférentiel et des procédures douanières allégées pour le commerce de transit des Nouvelles routes de la soie. La zone positionne le Xinjiang comme carrefour commercial reliant l'Asie centrale, l'Asie du Sud et le Moyen-Orient."
 CHI_TAI_combat_the_traitors: "Combattre les traîtres"
 CHI_TAI_combat_the_traitors_desc: "Pékin adopte une ligne intransigeante envers Taïwan, désignant officiellement les dirigeants indépendantistes comme traîtres et indiquant que la réunification par la force reste une option active. La déclaration accroît fortement les tensions transdétroit et place l'APL en alerte renforcée."
 CHI_TAI_cut_us_support: "Rompre les liens entre les États-Unis et Taiwan"
 CHI_TAI_cut_us_support_desc: "Pékin mène une campagne d'influence soutenue visant les milieux politiques et économiques américains, faisant pression contre les ventes d'armes et les contacts officiels avec Taipei. L'opération vise à éroder la crédibilité de l'engagement américain en faveur de la sécurité de Taïwan."
 CHI_TAI_outward_island_infrastructure: "Infrastructures militaires des îles extérieures"
 CHI_TAI_outward_island_infrastructure_desc: "Après la prise de Taïwan, l'Armée populaire de libération commence à construire des installations navales et aériennes fortifiées sur les îles extérieures. Les nouvelles bases étendent la projection de puissance chinoise loin dans le Pacifique occidental et transforment substantiellement l'équilibre régional des forces."
 CHI_TAI_cross_strait_policy: "Réexamen de la politique transdétroit"
 CHI_TAI_cross_strait_policy_desc: "Le Conseil des affaires d'État commande un examen d'ensemble de la politique transdétroit, passant en revue les options diplomatiques, économiques et militaires de réunification. L'examen fixe l'agenda politique de l'approche chinoise de Taïwan pour la décennie à venir."
 CHI_TAI_economic_track: "Volet économique transdétroit"
 CHI_TAI_economic_track_desc: "Pékin ouvre un dialogue économique structuré avec Taipei, axé sur la facilitation du commerce, la coopération industrielle et l'accès aux marchés à long terme. L'objectif est de créer suffisamment d'intérêts mutuels pour rendre plus difficile le refus de pourparlers politiques."
 CHI_TAI_political_track: "Volet politique transdétroit"
 CHI_TAI_political_track_desc: "Parallèlement à l'engagement économique, Pékin instaure une voie politique dédiée visant à relancer les mécanismes de dialogue, à baisser les tensions et à préparer le terrain d'un règlement négocié acceptable pour les deux parties."
 CHI_TAI_expand_cross_strait_trade: "Étendre le commerce transdétroit"
 CHI_TAI_expand_cross_strait_trade_desc: "S'appuyant sur la logique de l'ECFA et des pourparlers ultérieurs sur le commerce des services, Pékin offre de nouvelles concessions commerciales et des barrières réduites pour les entreprises taïwanaises opérant sur le continent. La politique vise à rendre la coopération économique visiblement rentable pour les élites politiques et économiques de Taïwan."
 CHI_TAI_mainland_market_access: "Accès au marché continental"
 CHI_TAI_mainland_market_access_desc: "La Chine accorde aux investisseurs et exportateurs taïwanais un accès préférentiel à certains secteurs continentaux, notamment la manufacture avancée et les services. L'arrangement reflète les efforts réels pour lier plus étroitement Taïwan à l'économie continentale par l'opportunité plutôt que par la force."
 CHI_TAI_business_delegations: "Délégations commerciales à travers le détroit"
 CHI_TAI_business_delegations_desc: "Des groupes commerciaux semi-officiels, des chambres de commerce et de grands acteurs industriels reprennent des visites transdétroit régulières. Ces délégations offrent un moyen politiquement plus sûr d'approfondir la coopération pratique tout en constituant à Taïwan des clientèles bénéficiaires de relations stables."
 CHI_TAI_transport_links: "Liaisons de transport directes"
 CHI_TAI_transport_links_desc: "Les vols directs, les arrangements maritimes et la coordination logistique sont étendus pour réduire la séparation pratique entre les deux rives. Un mouvement commercial et de passagers plus rapide abaisse le coût politique de l'engagement continu et normalise davantage les échanges transdétroit."
 CHI_TAI_semiconductor_coordination: "Coordination des semi-conducteurs"
 CHI_TAI_semiconductor_coordination_desc: "Taipei accepte une coordination stratégique limitée des chaînes d'approvisionnement high-tech, notamment les semi-conducteurs et la manufacture de précision. L'arrangement reflète l'interdépendance économique réelle entre le secteur des puces taïwanais et la demande continentale, tout en s'arrêtant en deçà d'une union politique."
 CHI_TAI_investment_safeguards: "Garanties d'investissement"
 CHI_TAI_investment_safeguards_desc: "Les négociateurs taïwanais insistent pour que l'intégration économique plus profonde s'accompagne de garanties juridiques et réglementaires protégeant les entreprises et institutions locales. Cette approche s'appuie sur de réelles inquiétudes intérieures : l'investissement transdétroit ne doit pas devenir un vecteur d'absorption politique."
 CHI_TAI_joint_industrial_planning: "Planification industrielle conjointe"
 CHI_TAI_joint_industrial_planning_desc: "Les planificateurs des deux rives commencent à coordonner les infrastructures, les chaînes d'approvisionnement industrielles et les secteurs à forte intensité technologique. Le processus transforme des liens commerciaux épars en quelque chose de plus proche d'une stratégie de développement transdétroit gérée."
 CHI_TAI_deep_economic_integration: "Intégration économique profonde"
 CHI_TAI_deep_economic_integration_desc: "Après des années d'accords accumulés, le commerce transdétroit est formalisé en un cadre dense d'investissement, de logistique et d'interdépendance industrielle. À ce stade, la séparation économique est devenue de plus en plus coûteuse pour les deux parties, surtout pour Taïwan."
 CHI_TAI_resume_party_contacts: "Reprendre les contacts du groupe"
 CHI_TAI_resume_party_contacts_desc: "Pékin réactive les canaux avec les partis et organisations de Taïwan disposés à discuter d'une relation transdétroit moins conflictuelle. L'approche s'enracine dans le schéma réel du dialogue PCC-KMT et d'autres contacts politiques officieux qui ont périodiquement suppléé à la diplomatie d'État à État."
 CHI_TAI_pro_china_party_networks_mission: "Réseaux de partis pro-chinois"
 CHI_TAI_pro_china_party_networks_mission_desc: "Les réseaux politiques et d'affaires transdétroit de la Chine cultivent activement le soutien aux partis pro-réunification à Taïwan. Tant que notre influence reste substantielle, ces efforts font progressivement basculer l'opinion publique vers la coalition pan-bleue."
 CHI_TAI_offer_confidence_measures: "Proposer des mesures de confiance"
 CHI_TAI_offer_confidence_measures_desc: "Pékin propose un paquet de mesures pratiques de désescalade, notamment des canaux de communication réguliers et de la retenue dans les signaux publics. L'intention est de convaincre les modérés taïwanais que l'engagement peut réduire le risque sans forcer immédiatement une décision de souveraineté."
 CHI_TAI_legislative_exchange_forum: "Forum d'échange législatif"
 CHI_TAI_legislative_exchange_forum_desc: "Des délégations de législateurs, conseillers et spécialistes des politiques commencent à se réunir par des canaux semi-officiels pour discuter commerce, transports et coordination administrative. De tels forums donnent à l'engagement transdétroit un visage parlementaire et procédural, adoucissant l'image d'une pression descendante."
 CHI_TAI_local_government_dialogue: "Dialogue des gouvernements locaux"
 CHI_TAI_local_government_dialogue_desc: "Administrations municipales, gouvernements de comté et responsables infranationaux ouvrent des pourparlers pratiques sur les transports, le tourisme et l'investissement. Cela reflète un schéma réel où les liens municipaux et locaux ont souvent progressé même lorsque les relations formelles au sommet étaient tendues."
 CHI_TAI_reaffirm_the_1992_consensus: "Réaffirmer le consensus de 1992"
 CHI_TAI_reaffirm_the_1992_consensus_desc: "Les modérés taïwanais choisissent de revenir explicitement au cadre selon lequel il n'y a qu'une Chine, tout en préservant leur propre interprétation de ce principe. La formule est controversée à l'intérieur, mais elle reste la base la plus réaliste de négociations transdétroit sérieuses."
 CHI_TAI_suspend_independence_initiatives: "Suspendre les initiatives indépendantistes"
 CHI_TAI_suspend_independence_initiatives_desc: "Taipei interrompt discrètement les mesures qui pousseraient l'île vers une séparation formelle en droit ou en diplomatie. Cela ne met pas fin à l'autogouvernement, mais signale que Taïwan est prêt à stabiliser la situation plutôt qu'à l'escalader."
 CHI_TAI_back_channel_settlement: "Règlement par voie arrière"
 CHI_TAI_back_channel_settlement_desc: "Des organisations semi-officielles des deux rives passent de la confiance à un marchandage politique de fond. Sur le modèle des contacts ARATS-SEF, elles rédigent un cadre de règlement conçu pour faire apparaître la réunification pacifique comme ordonnée, progressive et matériellement bénéfique."
 CHI_TAI_peaceful_reunification_accord: "Accord de réunification pacifique"
 CHI_TAI_peaceful_reunification_accord_desc: "Après des années de progrès diplomatiques incrémentaux, Pékin et Taipei signent un accord-cadre historique prévoyant l'adhésion de Taïwan à la République populaire en tant que région administrative spéciale. L'accord garantit les institutions démocratiques et le système juridique existants de Taïwan pour une période transitoire de cinquante ans."
 CHI_TAI_military_buildup: "Renforcement militaire transdétroit"
 CHI_TAI_military_buildup_desc: "L'Armée populaire de libération accélère l'acquisition de navires d'assaut amphibie, d'engins de débarquement et de missiles de précision à longue portée configurés pour une contingence du détroit de Taïwan. Des exercices conjoints simulent la saisie d'îles au large et la suppression des défenses aériennes taïwanaises."
 CHI_TAI_amphibious_doctrine: "Doctrine de débarquement insulaire conjoint"
 CHI_TAI_amphibious_doctrine_desc: "Le corps des marines de l'APL et le commandement du théâtre Est publient une doctrine opérationnelle interarmes révisée pour les assauts amphibies combinés. La doctrine est classifiée mais largement analysée par les services de renseignement étrangers comme un plan direct pour une contingence taïwanaise."
 CHI_TAI_blockade_declaration: "Blocus du détroit de Taiwan"
 CHI_TAI_blockade_declaration_desc: "La marine de l'APL déclare une zone d'exclusion navale autour de Taïwan, coupant les voies commerciales et les importations de carburant et de matières premières. Le blocus s'accompagne d'exercices aériens prolongés et d'essais de missiles balistiques, déclenchant une crise internationale."
 CHI_TAI_operation_storm: "Opération Tempête"
 CHI_TAI_operation_storm_desc: "L'Armée populaire de libération lance sa campagne amphibie longuement préparée contre Taïwan. Des frappes de missiles neutralisent les défenses aériennes et l'infrastructure de commandement tandis que les forces de débarquement traversent le détroit sous couverture aérienne et navale. L'opération marque l'action militaire la plus significative en Asie depuis la guerre de Corée."
 CHI_TAI_economic_miracle: "Intégration du miracle économique taïwanais"
 CHI_TAI_economic_miracle_desc: "L'industrie avancée des semi-conducteurs, le secteur financier et l'écosystème technologique de Taïwan sont formellement intégrés au cadre de planification économique nationale. L'acquisition représente un gain transformateur pour la capacité technologique chinoise, en particulier dans la fabrication de puces."
 CHI_OMG_steppe_development: "Initiative de développement de Nei Mongol"
 CHI_OMG_steppe_development_desc: "Le Conseil des affaires d'État lance un programme de développement ciblé pour la région autonome de Mongolie-Intérieure, investissant dans les infrastructures énergétiques, les corridors logistiques et les parcs industriels. L'initiative intègre plus profondément la Mongolie-Intérieure au réseau économique national tout en s'attaquant à la pauvreté rurale persistante."
 CHI_OMG_northern_corridor: "Infrastructures du corridor nord"
 CHI_OMG_northern_corridor_desc: "Un nouveau corridor autoroutier et ferroviaire de fret reliant la Mongolie-Intérieure à l'agglomération Pékin-Tianjin-Hebei est approuvé, réduisant les temps de transit du charbon, des terres rares et des produits agricoles. Le corridor étaye le rôle de la Mongolie-Intérieure comme arrière-pays énergétique de la Chine du Nord."
 CHI_OMG_mandarin_education: "Politique d'enseignement en mandarin"
 CHI_OMG_mandarin_education_desc: "Le gouvernement régional annonce une transition progressive exigeant que toutes les écoles primaires et secondaires enseignent les matières principales en mandarin plutôt qu'en mongol. La politique, calquée sur des mesures similaires au Tibet et au Xinjiang, déclenche de vastes protestations dans les villes et les communautés pastorales de Mongolie-Intérieure."
 CHI_OMG_cultural_recognition: "Reconnaissance culturelle mongole"
 CHI_OMG_cultural_recognition_desc: "Pékin reconnaît formellement l'identité culturelle et linguistique mongole de la RAS de Mongolie-Intérieure, garantissant l'enseignement en mongol, la radiodiffusion d'État et le statut officiel de l'écriture. La politique constitue un départ délibéré de l'approche assimilationniste appliquée au Tibet et au Xinjiang."
 CHI_OMG_han_settlement_program: "Programme de peuplement han"
 CHI_OMG_han_settlement_program_desc: "La migration sponsorisée par l'État depuis le Hebei, le Shaanxi et le Gansu accélère la transformation démographique de la Mongolie-Intérieure. De nouvelles communes sont établies sur d'anciennes terres pastorales, et des politiques d'emploi préférentielles ancrent davantage le statut majoritaire han dans les zones urbaines."
 CHI_SAR_integrate_OMG: "Intégration totale de la Mongolie intérieure"
 CHI_SAR_integrate_OMG_desc: "Après la transformation démographique et culturelle, le statut de RAS de la Mongolie-Intérieure est dissous et la région restructurée en division administrative de niveau provincial standard. La reconnaissance formelle de l'autonomie mongole est remplacée par des dispositions générales de protection des minorités ethniques applicables dans toute la RPC."
 CHI_OMG_greater_mongolia_vision: "Vision pan-mongole"
 CHI_OMG_greater_mongolia_vision_desc: "Des militants du mouvement culturel de Mongolie-Intérieure articulent une vision de liens plus étroits avec l'État mongol indépendant, invoquant l'histoire, la langue et l'héritage nomade communs. Pékin tolère le cadrage culturel tout en maintenant des limites strictes sur toute implication politique."
 OMG_steppe_livestock_industry: "Modernisation de l'élevage steppique"
 OMG_steppe_livestock_industry_desc: "Les industries traditionnelles du cachemire, du mouton et des produits laitiers de Mongolie-Intérieure sont restructurées selon un modèle coopératif liant les familles d'éleveurs aux chaînes d'approvisionnement nationales. Le programme améliore les revenus des ménages tout en préservant des éléments du mode de vie pastoral."
 CHI_OMG_steppe_mining_industry: "Industrie minière des steppes"
 CHI_OMG_steppe_mining_industry_desc: "Les gisements de chrome et de minerais de Mongolie-Intérieure sont soumis à un programme d'extraction coordonné. Des entreprises soutenues par l'État établissent des installations de transformation et des corridors d'export, convertissant la richesse du sous-sol en capacité industrielle pour l'ensemble de l'économie chinoise."
 OMG_mongolian_mining_expansion: "Expansion des terres rares et du charbon"
 OMG_mongolian_mining_expansion_desc: "La Mongolie-Intérieure recèle certains des plus vastes gisements de terres rares au monde et un tiers des réserves chinoises de charbon. Les autorités de la RAS étendent les opérations d'extraction et négocient des accords de redevances orientant une plus grande part des recettes minières vers les infrastructures et l'éducation régionales."
 CHI_OMG_mongolian_mining_expansion: "Expansion des terres rares et du charbon"
 CHI_OMG_mongolian_mining_expansion_desc: "La Mongolie-Intérieure recèle certains des plus vastes gisements de terres rares au monde et un tiers des réserves chinoises de charbon. Les autorités de la RAS étendent les opérations d'extraction et négocient des accords de redevances orientant une plus grande part des recettes minières vers les infrastructures et l'éducation régionales."
 CHI_MON_diplomatic_outreach: "Sensibilisation diplomatique mongole"
 CHI_MON_diplomatic_outreach_desc: "Pékin lance une initiative diplomatique vers Oulan-Bator, combinant incitations économiques et appels culturels à l'héritage mongol partagé. Visites de haut niveau, conditions commerciales préférentielles et présence culturelle chinoise élargie préparent un engagement plus profond."
 CHI_MON_economic_partnership: "Partenariat économique de la steppe"
 CHI_MON_economic_partnership_desc: "Un accord de partenariat économique global accorde à la Mongolie un accès préférentiel aux marchés, aux investissements et au financement d'infrastructures chinois. Les exportations minières mongoles — cuivre, charbon et terres rares — trouvent en Chine un client principal, créant une interdépendance économique significative."
 CHI_MON_reunification_offer: "Offre de réunification mongole"
 CHI_MON_reunification_offer_desc: "La Chine adresse à la Mongolie une offre formelle de réunification en tant que région administrative spéciale, promettant une large autonomie, la préservation du système politique mongol et une intégration économique complète. La proposition invoque un précédent historique et présente la Chine comme le partenaire naturel de la prospérité mongole."
 MON_CHI_economic_partnership_idea: "Intégration économique sino-mongole"
 MON_CHI_economic_partnership_idea_desc: "L'accès commercial préférentiel et l'intégration au marché chinois ont rendu la Mongolie fortement dépendante des exportations vers la Chine. Les recettes minières augmentent, mais aussi la dépendance structurelle à la demande chinoise."
 MON_CHI_cultural_sphere_idea: "Dans l'orbite culturelle de la Chine"
 MON_CHI_cultural_sphere_idea_desc: "Les médias d'État chinois, la programmation culturelle et les réseaux de diaspora ont établi une présence significative de soft power en Mongolie. La résistance à une influence chinoise accrue s'en trouve affaiblie."
 CHI_TAI_fleet_modernization: "Programme de modernisation de la flotte"
 CHI_TAI_fleet_modernization_desc: "La marine de l'APL accélère l'acquisition de destroyers, frégates et navires d'assaut amphibie modernes configurés pour les opérations du détroit de Taïwan. Une capacité de chantier élargie et des calendriers de mise en service accélérés signalent un virage clair vers la projection de puissance dans le Pacifique occidental."
 CHI_TAI_dongfeng_program: "Programme de missiles Dong Feng"
 CHI_TAI_dongfeng_program_desc: "La Force des fusées élargit son arsenal de missiles balistiques de portée intermédiaire, déployant des batteries DF-21 et DF-26 supplémentaires le long de la côte du Fujian. Le programme donne à Pékin la capacité de menacer l'infrastructure militaire de Taïwan depuis le continent sans engager de moyens navals ou aériens."
 CHI_TAI_air_superiority: "Stratégie de supériorité aérienne"
 CHI_TAI_air_superiority_desc: "L'armée de l'air de l'APL intensifie les sorties d'entraînement au-delà de la ligne médiane du détroit de Taïwan et déploie des chasseurs J-20 avancés sur des bases avancées du Fujian. La pression aérienne persistante érode la capacité de Taïwan à maintenir des défenses aériennes crédibles."
 CHI_TAI_cyber_warfare: "Capacité de cyberguerre"
 CHI_TAI_cyber_warfare_desc: "La Force de soutien stratégique élargit sa direction des opérations cyber offensives, développant des capacités de perturbation des infrastructures critiques, des communications militaires et des systèmes financiers de Taïwan. Le front numérique devient un autre axe de pression."
 CHI_TAI_blockade_capability: "Préparation au blocus"
 CHI_TAI_blockade_capability_desc: "Après d'extensifs exercices de simulation, la marine de l'APL et les garde-côtes certifient la pleine préparation opérationnelle d'une zone d'exclusion maritime autour de Taïwan. Patrouilles sous-marines, piquets de surface et surveillance aérienne peuvent être activés à bref délai."
 CHI_TAI_one_china_enforcement: "Une seule application en Chine"
 CHI_TAI_one_china_enforcement_desc: "Pékin lance une campagne diplomatique systématique pour éliminer les reconnaissances formelles restantes de Taïwan. Des ambassadeurs sont dépêchés avec des paquets d'aide et des accords d'infrastructure, tandis qu'une pression économique s'exerce sur les nations qui résistent au changement d'allégeance."
 CHI_TAI_intl_org_blockade: "Blocus des organisations internationales"
 CHI_TAI_intl_org_blockade_desc: "La Chine s'appuie sur son siège permanent au Conseil de sécurité de l'ONU et son poids croissant dans les institutions multilatérales pour bloquer la participation de Taïwan aux organisations internationales. Les demandes de statut d'observateur sont vetées et les canaux de participation informelle fermés."
 CHI_TAI_economic_leverage: "Campagne de levier économique"
 CHI_TAI_economic_leverage_desc: "Pékin militarise sa position de première nation commerciale du monde, appliquant une pression économique ciblée sur les industries et circonscriptions politiques américaines favorables à Taïwan. La campagne exploite la dépendance commerciale pour éroder la volonté politique derrière les garanties de sécurité américaines."
 CHI_TAI_tourism_freeze: "Gel du tourisme"
 CHI_TAI_tourism_freeze_desc: "Pékin ordonne aux voyagistes affiliés à l'État de suspendre tous les forfaits de groupe et individuels vers Taïwan, coupant les flux de visiteurs qui avaient fortement augmenté depuis l'ouverture de l'ère ECFA en 2008. La mesure prive Taipei des recettes en devises et des revenus des services aux consommateurs générés par le tourisme continental, militarisant l'intégration économique transdétroit comme instrument de coercition."
 CHI_TAI_lobby_network: "Réseau de lobbying de Washington"
 CHI_TAI_lobby_network_desc: "Des intérêts économiques alignés sur la Chine, des think tanks et des consultants politiques établissent une présence permanente à Washington. Le réseau s'emploie à façonner l'opinion du Congrès sur Taïwan, bloquant les ventes d'armes et promouvant l'engagement avec Pékin."
 CHI_TAI_proxy_strategy: "Stratégie mondiale de proxy"
 CHI_TAI_proxy_strategy_desc: "Pékin cultive des conflits par procuration et des points chauds régionaux destinés à détourner l'attention militaire et le capital politique américains du détroit de Taïwan. Chaque crise qui attire les forces américaines ailleurs réduit la crédibilité des engagements pacifiques de Washington."
 CHI_TAI_distract_america: "Distraire l'Amérique"
 CHI_TAI_distract_america_desc: "Les États-Unis étant engagés dans des opérations militaires outre-mer, Pékin capitalise sur des ressources étirées et une attention divisée. Chaque déploiement américain actif réduit la probabilité d'une réponse américaine rapide à une contingence du détroit de Taïwan."
 CHI_sinicization_modifier: "£GFX_text_icon_chinese_icon Multiplicateur de sinisation"
