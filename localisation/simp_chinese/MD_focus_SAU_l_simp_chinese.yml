l_simp_chinese:
 saudi_focus_tree: "沙特阿拉伯国策树"
 SAU_crackdown_on_the_opposition: "镇压反对派"
 SAU_crackdown_on_the_opposition_desc: "马巴希特保存着大量关于什叶派组织者、萨赫瓦教士和自由派请愿者的档案。委员会将利用这些记录来识别和镇压反对军政府统治的势力。"
 SAU_modernisation_balance_of_power_category: "§H王国的未来§!"
 SAU_shia_rights_reform: "什叶派权利改革"
 SAU_shia_rights_reform_desc: "将什叶派的权利写入国家法律。\n\n§G-什叶派抵抗，+稳定度，+什叶派人口§!"
 SAU_trials_of_the_old_order: "旧秩序的审判"
 SAU_trials_of_the_old_order_desc: "委员会将在公开法庭上起诉前皇家骑士团成员。与2017年丽思卡尔顿酒店清洗事件的私下和解不同，此次诉讼将公开指控和判决，同时也将服务于委员会的政治利益。"
 SAU_unif_command_control_tt: "§H海湾合作委员会武装部队建立了统一的指挥控制结构。§!"
 SAU_unif_cross_border_tt: "§Y需要边境地区拥有发达的跨境基础设施（基础设施等级3级或以上）。§!"
 SAU_unif_exploit_authority_tt: "§Y要求沙特阿拉伯王国成为海湾合作委员会其他所有成员国中最具影响力的外国势力。§!"
 SAU_unif_increase_autonomy_tt: "§H更大的区域自治权缓解了教派间的矛盾，增强了国内影响力，并削弱了激进化趋势。§!"
 HOU_houthi_resilience: "胡塞武装韧性"
 HOU_houthi_resilience_desc: "胡塞武装已在也门北部山区活动数十年。他们对地形的熟悉以及在高地建立的据点，使得其难以被驱逐。"
 PER_houthi_defense_buff: "山地防御工事"
 PER_houthi_defense_buff_desc: "伊朗修建的防御工事将高地变成了一座堡垒，对政府军的防御力提升15%。"
 SAU_arab_shield_member: "阿拉伯之盾成员"
 SAU_arab_shield_member_desc: "该国参与阿拉伯之盾集体防御安排，提高了其武装部队的防御能力和士气。"
 SAU_aramco_01: "沙特阿美"
 SAU_aramco_01_desc: "沙特阿拉伯国家石油公司（沙特阿美）是全球最大的石油企业，自1980年起完全国有化。沙特阿美控制着沙特王国的庞大石油储备，是沙特经济的支柱，贡献了政府的大部分财政收入。尽管该公司盈利丰厚，但其运营透明度有限，且尚未实现公司结构的现代化。"
 SAU_aramco_02: "沙特阿美 - 扩大运营"
 SAU_aramco_02_desc: "沙特阿美已将其业务拓展至原油开采之外，投资于炼油产能、石化企业和国际合作。公司不断提升的效率和多元化的业务组合巩固了其作为沙特经济支柱的地位。"
 SAU_aramco_03: "沙特阿美 - 全球能源领导者"
 SAU_aramco_03_desc: "沙特阿美已转型为一家现代化的全球能源巨头。凭借成功的上市、不断拓展的下游业务以及战略性的国际投资，该公司如今已跻身全球最具价值的企业之列。其收入不仅为沙特王国的财政预算提供资金，也为全国各地雄心勃勃的发展计划提供支持。"
 SAU_aramco_downstream: "§H沙特阿美§! - 下游整合"
 SAU_aramco_downstream_desc: "沙特阿美已将业务拓展至炼油和化工生产领域，使其能够从原油开采到零售燃料销售的每个环节获得收入。"
 SAU_aramco_engineers: "§H沙特阿美§! - 沙特石油工程师"
 SAU_aramco_engineers_desc: "在沙特阿卜杜拉国王石油与矿业大学和国外接受过培训的一代沙特石油工程师，已经取代了曾经管理油田的外国人。"
 SAU_aramco_export: "§H沙特阿美§! - 出口强国"
 SAU_aramco_export_desc: "沙特阿美是一家以出口为核心的石油公司，其码头和油轮船队旨在比任何竞争对手向更多市场输送更多原油。"
 SAU_aramco_gas: "§H沙特阿美§! - 主燃气系统"
 SAU_aramco_gas_desc: "主燃气系统收集以前被燃烧掉的天然气，并将其输送到沙特阿拉伯各地的发电厂和工业设施。"
 SAU_aramco_ghawar: "§H沙特阿美§! - 加瓦尔油田"
 SAU_aramco_ghawar_desc: "加瓦尔油田是世界上最大的常规油田，日产量达数百万桶。其产量对沙特阿美公司和沙特经济都至关重要。"
 SAU_aramco_giant: "§H沙特阿美§! - 全球最有价值的公司"
 SAU_aramco_giant_desc: "沙特阿美是地球上最有价值的公司，其产量、储量和利润在企业史上无与伦比。"
 SAU_aramco_megafields: "§H沙特阿美§! - 新的巨型领域"
 SAU_aramco_megafields_desc: "谢巴、胡莱斯和近海马尼法油田的重大开发扩大了沙特阿拉伯的石油生产能力，并继续加大沙特王国对大型石油项目的投资。"
 SAU_aramco_national: "§H沙特阿美§! - 完全国有化"
 SAU_aramco_national_desc: "1980年完成的对美国股东的收购使沙特阿美成为一家完全由沙特阿拉伯控制的公司。如今，沙特王国的石油完全由利雅得负责。"
 SAU_aramco_opec: "§H沙特阿美§! - 欧佩克摇摆生产者"
 SAU_aramco_opec_desc: "沙特阿拉伯拥有足够的剩余产能，可以增加或减少欧佩克的石油供应，对世界石油​​价格的影响力超过任何其他成员国。"
 SAU_aramco_petrochem: "§H沙特阿美§! - 一体化炼油"
 SAU_aramco_petrochem_desc: "拉比格炼油与石化公司和沙特阿美道达尔炼油和石化公司是与住友和道达尔的合资企业，它们将炼油和石化业务整合到红海和海湾地区的单一一体化综合体中。"
 SAU_aramco_production: "§H沙特阿美§! - 最大化生产"
 SAU_aramco_production_desc: "沙特阿美优先考虑可持续生产最大化，同时保留剩余产能。这使得沙特阿拉伯能够迅速应对需求变化或政府生产政策调整。"
 SAU_aramco_rastanura: "§H沙特阿美§! - 拉斯塔努拉和阿布盖克"
 SAU_aramco_rastanura_desc: "拉斯塔努拉出口码头和阿布盖格原油加工厂在沙特原油进入世界市场前对其进行了大量处理。它们共同构成了同类设施中规模最大的石油设施之一。"
 SAU_aramco_rnd: "§H沙特阿美§! - 勘探与石油工程中心研究"
 SAU_aramco_rnd_desc: "位于达兰的勘探与石油工程先进研究中心在油藏工程领域处于世界领先地位，能够以更低的成本从每个油田中榨取更多的石油。"
 SAU_baathist_party_1: "阿拉伯民族主义的堡垒"
 SAU_baathist_party_1_loc: "\n[SAU.GetFlag]阿拉伯民族主义的堡垒\n§H外国影响力§!乘数：§G+5.00%§!\n§H外国影响力§!政变成功系数：§G+25.0%§!\n\n"
 SAU_baathist_party_3: "团结、自由、社会主义"
 SAU_baathist_party_3_loc: "[SAU.GetFlag]团结、自由、社会主义\n建筑速度：§G+10.00%§!\n民族主义宣传运动成本乘数：§G-10.00%§!\n月度生产率增长：§G+0.05§!\n\n"
 SAU_banking_649_hybrid: "§H利息法§! - §Y混合（伊斯兰债券 + 非正式）§!"
 SAU_banking_649_hybrid_desc: "伊斯兰债券和伊斯兰银行服务与非正式的传统贷款业务并行运作。该体系在官方层面上仍然符合伊斯兰教法，但在实际操作中则留有一定的灵活性。"
 SAU_banking_649_hybrid_loc: "\n§H利息法：§!§Y伊斯兰债券 + 非正式利息§!\n  §G+2.0%§!办公园区税\n  §G+1.0%§!政治点数\n  §G+0.5%§!稳定度\n"
 SAU_banking_649_islamic: "§H利息法§! - §R严格禁止利息§!"
 SAU_banking_649_islamic_desc: "利息绝对禁止，没有任何例外。资金流动通过利润分享和穆拉巴哈结构进行，而诚信的银行则问心无愧。"
 SAU_banking_649_islamic_loc: "\n§H利息法：§!§B严格禁止利息§!\n  §G+3.0%§!政治点数\n  §G+2.0%§!稳定度\n  §G+0.5%§!萨拉菲主义变化\n"
 SAU_banking_649_secular: "§H利息法§! - §G传统§!"
 SAU_banking_649_secular_desc: "利息合法且价格公开透明。无论神职人员周五布道如何，传统银行业依然蓬勃发展，资本自由流动。"
 SAU_banking_649_secular_loc: "\n§H利息法§! - §G传统§!\n  §G+4.0%§!办公园区税\n  §G+3.0%§!公司税\n  §G+0.5%§!民主主义变化\n  §R-1.0%§!稳定度\n"
 SAU_banking_650_hybrid: "§H储备授权§! - §Y温和§!"
 SAU_banking_650_hybrid_desc: "适度的准备金要求允许银行在保持比监管宽松的体系更大的财务缓冲的同时，扩大信贷规模。"
 SAU_banking_650_hybrid_loc: "\n§H储备授权：§!§Y温和§!\n§G+1.0%§!建造速度\n  §G+0.5%§! 稳定度\n"
 SAU_banking_650_islamic: "§H储备授权§! - §R全额资产支持§!"
 SAU_banking_650_islamic_desc: "每笔存款都有实物资产作担保。信贷增长缓慢，但没有一家沙特银行会在挤兑中倒闭。"
 SAU_banking_650_islamic_loc: "\n§H储备授权：§!§B全额资产支持（符合伊斯兰教法）§!\n  §G+2.5%§!稳定度\n  §G+2.0%§! 战争支持度\n  §R-2.0%§!建筑速度\n"
 SAU_banking_650_secular: "§H储备授权§! - §G部分准备金§!"
 SAU_banking_650_secular_desc: "银行以存款的一小部分作为抵押放贷，以西方的方式在经济中倍增信贷。"
 SAU_banking_650_secular_loc: "\n§H储备授权§!§G部分准备金（西式）§!\n  §G+3.0%§!建筑速度\n  §G+5.0%§!工业修复\n  §R-2.0%§!消费品使用\n  §R-1.5%§!稳定度\n"
 SAU_banking_651_hybrid: "§H投机代码§! - §Y受监管衍生品§!"
 SAU_banking_651_hybrid_desc: "衍生品交易受到严格限制，允许套期保值，投机行为受到监管。"
 SAU_banking_651_hybrid_loc: "\n§H投机代码：§!§Y仅限受监管衍生品§!\n  §G+1.5%§!税收获取\n  §G+0.5%§!稳定度\n"
 SAU_banking_651_islamic: "§H投机代码§! - §R禁止投机§!"
 SAU_banking_651_islamic_desc: "禁止进行高风险交易会限制衍生品、卖空和其他基于过度不确定性或投机的金融产品。"
 SAU_banking_651_islamic_loc: "\n§H投机代码：§!§B禁止投机§!\n  §G+2.5%§!稳定度\n  §G+2.0%§!政治点数\n  §G+3§!中立主义接受度\n"
 SAU_banking_651_secular: "§H投机代码§! - §G轻度监管§!"
 SAU_banking_651_secular_desc: "期权、期货和其他衍生品在有限的监管下是被允许的。"
 SAU_banking_651_secular_loc: "\n§H投机代码：§!§G允许进行衍生品和期货交易§!\n  §G+3.0%§!税收获取\n  §G+2.0%§!研究速度\n  §R-2.0%§!稳定度\n"
 SAU_banking_652_hybrid: "§H银行间代码§! - §Y双通道§!"
 SAU_banking_652_hybrid_desc: "传统银行和伊斯兰银行两种银行间渠道并行运行，每家银行都选择自己的柜台。"
 SAU_banking_652_hybrid_loc: "\n§H银行间代码：§!§Y双通道§!\n  §G+1.5%§!办公园区税\n  §G+1.0%§!政治点数\n"
 SAU_banking_652_islamic: "§H银行间代码§! - §R伊斯兰成本加成融资§!"
 SAU_banking_652_islamic_desc: "银行间流动性通过商品穆拉巴哈进行流动，即使是隔夜资金也能保持在伊斯兰教法的范围内。"
 SAU_banking_652_islamic_loc: "\n§H银行间代码：§!§B基于伊斯兰成本加成融资§!\n  §G+2.5%§!政治点数\n  §G+1.5%§!稳定度\n  §G+0.5%§!萨拉菲主义变化\n"
 SAU_banking_652_secular: "§H银行间代码§! - §G伦敦银行同业拆放利率风格§!"
 SAU_banking_652_secular_desc: "银行间以基准利率相互借贷，将沙特金融融入全球货币市场。"
 SAU_banking_652_secular_loc: "\n§H银行间代码：§!§G传统利益走廊§!\n  §G+3.0%§!办公园区税\n  §G+2.0%§!公司税\n  §G+0.5%§!民主主义变化\n  §R-1.0%§!稳定度\n"
 SAU_banking_653_hybrid: "§H银行控制§! - §Y平行结构§!"
 SAU_banking_653_hybrid_desc: "传统银行和伊斯兰银行在同一家中央银行的监管体系下接受平行监管。"
 SAU_banking_653_hybrid_loc: "\n§H银行控制：§! §Y平行沙特阿拉伯货币局+伊斯兰教法结构§!\n  §G+2.0%§!税收获得\n  §G+1.5%§!政治点数\n"
 SAU_banking_653_islamic: "§H银行控制§! - §R沙特阿拉伯货币局+协商会议§!"
 SAU_banking_653_islamic_desc: "沙特阿拉伯货币管理局与伊斯兰教法监督委员会共享权力，任何银行牌照都无法通过学者的否决。"
 SAU_banking_653_islamic_loc: "\n§H银行控制：§! §B沙特阿拉伯货币局+协商会议监督§!\n  §G+4.0%§!政治点数\n  §G+2.5%§!稳定度\n  §G+1.0%§!萨拉菲主义变化\n"
 SAU_banking_653_secular: "§H银行控制§! - §G独立沙特阿拉伯货币局§!"
 SAU_banking_653_secular_desc: "沙特阿拉伯金融管理局作为一家独立的中央银行，对银行业进行监管，它只对市场信心负责，除此之外几乎不承担其他责任。"
 SAU_banking_653_secular_loc: "\n§H银行控制：§!§G独立沙特阿拉伯货币局§!\n  §G+4.0%§!税收获取\n  §G+2.0%§!研究速度\n  §G+1.0%§!民主主义变化\n  §R-1.0%§!稳定度\n"
 SAU_banking_654_pragmatic: "§H伊斯兰金融§! - §Y全球伊斯兰中心§!"
 SAU_banking_654_pragmatic_desc: "利雅得正在发展成为国际伊斯兰金融中心。其监管法规既保持了伊斯兰教法的权威性，又能容纳来自其他主要金融市场的机构。"
 SAU_banking_654_pragmatic_loc: "\n§H伊斯兰金融：§!§Y全球伊斯兰中心§!\n  §G+3.0%§!政治点数\n  §G+2.5%§!稳定度\n  §G+5.0%§!办公园区税\n §G+4.0%§!公司税\n  §G+5§!中立主义接受度\n"
 SAU_banking_654_strict: "§H伊斯兰金融§! - §R严格正统§!"
 SAU_banking_654_strict_desc: "沙特阿拉伯王国要求完全遵守正统的伊斯兰金融规则。这限制了灵活性，但也吸引了那些优先考虑严格遵守伊斯兰教法的客户。"
 SAU_banking_654_strict_loc: "\n§H伊斯兰金融：§!§B严格正统§!\n  §G+5.0%§!政治点数\n  §G+5.0%§!稳定度\n  §G+2.0%§!萨拉菲主义变化\n  §G+10§!中立主义接受度\n  §G+10.0%§!思潮变化防御\n"
 SAU_banking_655_full: "§H世俗化金融§! - §G全盘盎格鲁-撒克逊§!"
 SAU_banking_655_full_desc: "沙特阿拉伯已全面采纳英美银行模式。这一变革扩大了传统资本市场，但却遭到宗教机构的反对。"
 SAU_banking_655_full_loc: "\n§H世俗化金融：§!§G全盘盎格鲁-撒克逊§!\n  §G+10.0%§!办公园区税\n  §G+7.0%§!公司税\n  §G+5.0%§!税收获取\n  §G+4.0%§!研究速度\n  §G+2.0%§!民主主义变化\n  §R-3.0%§!稳定度\n  §R-2.0%§!消费品使用\n"
 SAU_banking_655_gradual: "§H世俗化金融§! - §Y渐进式§!"
 SAU_banking_655_gradual_desc: "为减少有组织的宗教团体对世俗化的反对，传统的金融规则正在逐步引入。"
 SAU_banking_655_gradual_loc: "\n§H世俗化金融：§!§Y渐进式转换§!\n  §G+6.0%§!办公园区税\n  §G+4.0%§!公司税\n  §G+3.0%§!税收获取\n  §G+1.0%§!民主主义变化\n  §R-1.0%§!稳定度\n"
 SAU_banking_system: "§H银行系统§!"
 SAU_banking_system_desc: "王国的金融部门。每项银行法重点都会让玩家选择§L世俗§!、§L伊斯兰§!或§L混合§!模式；其结果以§H子系统§!的形式存在于此。总修正值来自所有选定子系统修正值的总和。"
 SAU_banking_system_tt: "[SAU_banking_649_loc][SAU_banking_650_loc][SAU_banking_651_loc][SAU_banking_652_loc][SAU_banking_653_loc][SAU_banking_654_loc][SAU_banking_655_loc]"
 SAU_black_february_bailout_idea: "二月份的干预"
 SAU_black_february_bailout_idea_desc: "政府动用公共资金来减缓沙特证券交易所的崩溃，并保护小投资者免受最大损失。这种干预措施减少了可用的国库资金，并为未来的市场危机树立了一个代价高昂的先例。"
 SAU_black_february_idea: "黑色二月"
 SAU_black_february_idea_desc: "沙特证券交易所的市值已缩水三分之二，令沙特家庭的大量储蓄化为乌有。政府的不作为引发了公众的广泛愤怒。"
 SAU_communist_state_2: "无产阶级国家"
 SAU_communist_state_2_loc: "[SAU.GetFlag]无产阶级国家\n§H人口税§!乘数：§G+5.00%§!\n§H农业§!税乘数：§G+5.00%§!\n§H商业化农业区§!生产率：§G+10.00%§!\n\n"
 SAU_communist_state_2_tt: "[SAU_communist_state_1_loc][SAU_communist_state_2_loc][SAU_communist_state_3_loc][SAU_communist_state_4_loc][SAU_communist_state_5_loc]"
 SAU_Cooperation_West_East: "[USA.GetFlag] 在分裂的世界中合作 [CHI.GetFlag]"
 SAU_Cooperation_West_East_desc: "在分裂的世界中，形成了两大阵营：以崛起中的超级大国[CHI.GetFlag]中国为首的东方阵营，以及以[USA.GetFlag]美国为首的西方阵营，共同引领着这个世界和新千年。"
 SAU_Cooperation_West_East_tt: "[SAU_IMEC_india_deal_new_loc][SAU_OPEC_Russia_deal_new_loc]"
 SAU_custodian_of_the_cause: "该事业的守护者"
 SAU_custodian_of_the_cause_desc: "利雅得将巴勒斯坦问题作为衡量其在阿拉伯世界领导地位的标准，而阿拉伯民众也以忠诚回应。"
 SAU_cyber_defensive_posture: "网络防御态势"
 SAU_cyber_defensive_posture_desc: "情报总局加固行动正在保护王国的网络，并减缓敌对势力的情报收集。"
 SAU_cyber_defensive_target: "沙特网络反制措施"
 SAU_cyber_defensive_target_desc: "情报总局网络防御削弱了进攻协调和指挥能力。"
 SAU_cyber_offensive_target: "在沙特网络攻击下"
 SAU_cyber_offensive_target_desc: "情报总局网络行动削弱了指挥和防御协调能力，并扰乱了工业生产。"
 SAU_decisive_storm_air_cover: "联盟空中掩护"
 SAU_decisive_storm_air_cover_desc: "沙特阿拉伯和联军的飞机为也门政府军提供空中掩护，使其抵御胡塞武装进攻的能力提升10%。如果停火协议获得通过或胡塞武装运动不复存在，这项支援也将终止。"
 SAU_decree_abdullah_kaec_construction: "阿卜杜拉国王经济城快速通道"
 SAU_decree_abdullah_kaec_construction_desc: "王国各地的土木工程正以红海沿岸的速度推进。"
 SAU_decree_abdullah_kasp_scholarship: "阿卜杜拉国王海外奖学金"
 SAU_decree_abdullah_kasp_scholarship_desc: "一代在国外接受过培训的人才正在陆续回到政府部门、大学和企业。"
 SAU_decree_abdullah_kaust_grants: "阿卜杜拉国王科技大学高科技资助"
 SAU_decree_abdullah_kaust_grants_desc: "扩大阿卜杜拉国王科技大学的科研经费正在加速大学研究，并提高高科技产业的产出。"
 SAU_decree_abdullah_national_dialogue: "全国对话论坛"
 SAU_decree_abdullah_national_dialogue_desc: "人们现在在会议厅里解决不满，而不是在街头抗议。"
 SAU_decree_abdullah_sang_subsidies: "沙特阿拉伯国民警卫队现代化补贴"
 SAU_decree_abdullah_sang_subsidies_desc: "补贴合同降低了装甲车辆的价格，并保持了部队的兵力充足。"
 SAU_decree_mbn_border_surveillance: "边防监视网"
 SAU_decree_mbn_border_surveillance_desc: "边境线上到处都有人监视，驻守在那里的部队都构筑了防御工事。"
 SAU_decree_mbn_mabahith_campaign: "马巴希斯反颠覆运动"
 SAU_decree_mbn_mabahith_campaign_desc: "马巴希特正在监控通讯，并加强对王国境内疑似异见人士的监视。"
 SAU_decree_mbn_rehabilitation_center: "纳耶夫王子康复中心"
 SAU_decree_mbn_rehabilitation_center_desc: "纳耶夫王子中心致力于改造武装分子，让他们重返平民生活，而不是通过监禁或处死来加强极端主义的招募。"
 SAU_decree_mbn_special_security_forces: "内政部特种安全部队"
 SAU_decree_mbn_special_security_forces_desc: "内政部部队已部署在街头，任何与王国作对的人都将面临更大的困难。"
 SAU_decree_mbn_western_intel_networks: "西方联合情报网"
 SAU_decree_mbn_western_intel_networks_desc: "来自盟军的共享收入弥补了沙特阿拉伯收入无法覆盖的领域。"
 SAU_decree_mbs_anticorruption_drive: "丽思卡尔顿和解"
 SAU_decree_mbs_anticorruption_drive_desc: "丽思卡尔顿酒店的扣押事件迫使富有的沙特人向国家交出资产，并展现了沙特领导层对私人财富的控制。"
 SAU_decree_mbs_aramco_liquidity: "阿美战略流动性"
 SAU_decree_mbs_aramco_liquidity_desc: "石油收入直接流入国家手中，工业也从贸易账簿中解放出来。"
 SAU_decree_mbs_gami_localization: "军事工业总局防务本地化"
 SAU_decree_mbs_gami_localization_desc: "武器不再来自外国，而是来自沙特阿拉伯，而且武器工厂的数量也在不断增加。"
 SAU_decree_mbs_pif_neom: "新未来城和前沿计划"
 SAU_decree_mbs_pif_neom_desc: "公共投资基金正在为新未来城及相关前沿项目提供资金，包括支持这些项目所需的交通基础设施。"
 SAU_decree_mbs_vision2030_blitz: "2030愿景宣传活动"
 SAU_decree_mbs_vision2030_blitz_desc: "政府各部门和公共投资正朝着快速实施王储“2030愿景”计划的方向发展。"
 SAU_decree_mutaib_capital_garrison: "首都驻军网络"
 SAU_decree_mutaib_capital_garrison_desc: "国民警卫队已在利雅得设立安全警戒线和广泛的监控网络。"
 SAU_decree_mutaib_janadriyah_festival: "贾纳德里亚遗产节"
 SAU_decree_mutaib_janadriyah_festival_desc: "贾纳德里亚节旨在弘扬部落文化遗产，加强政府与部落社区之间的关系。"
 SAU_decree_mutaib_sang_logistics: "国民警卫队自主后勤"
 SAU_decree_mutaib_sang_logistics_desc: "卫队自行补充能量和燃料，而且浪费的资源也少得多。"
 SAU_decree_mutaib_sang_procurement: "国民警卫队航空与装甲采购"
 SAU_decree_mutaib_sang_procurement_desc: "国民警卫队的合同优先履行，而且价格比正规军低。"
 SAU_decree_mutaib_tribal_reserves: "部落桑国民警卫队预备役"
 SAU_decree_mutaib_tribal_reserves_desc: "部落征召兵填补国民警卫队名册的速度比征兵人员单独招募的速度还要快。"
 SAU_decree_salman_cpsa_council: "政治与安全事务委员会"
 SAU_decree_salman_cpsa_council_desc: "现在，一个委员会同时负责政治和安全事务，工作人员的工作速度取决于委员会主席的决策速度。"
 SAU_decree_salman_ksrelief: "萨勒曼国王人道主义援助赈灾中心行动"
 SAU_decree_salman_ksrelief_desc: "萨勒曼国王人道主义援助赈灾中心利用沙特阿拉伯的公开人道主义行动向海外提供援助，并提升沙特王国的国际声誉。"
 SAU_decree_salman_riyadh_metro_plan: "利雅得大都会规划"
 SAU_decree_salman_riyadh_metro_plan_desc: "首都的建设规划为各地建设树立了标杆。"
 SAU_decree_salman_royal_decrees: "皇家结构法令"
 SAU_decree_salman_royal_decrees_desc: "皇家法令正在重组各部委，并将政府政策的实施集中化。"
 SAU_decree_salman_spark_park: "萨勒曼国王能源园"
 SAU_decree_salman_spark_park_desc: "国内能源制造业正在竭尽全力开发利用每一寸土地和每一个储罐区。"
 SAU_div_construction: "§H多元化§! - 建筑与房地产"
 SAU_div_construction_desc: "建筑和房地产开发正成为沙特阿拉伯非石油经济的重要组成部分。"
 SAU_div_defence: "§H多元化§! - 防务产业"
 SAU_div_defence_desc: "国内军工产业能够将国防开支留在王国境内，通过建设工厂和培养专业技术，而不是仅仅购买。"
 SAU_div_energy: "§H多元化§! - 可再生能源"
 SAU_div_energy_desc: "大型太阳能项目减少了国内对石油能源的需求，从而有更多原油可供出口，并增加了政府收入。"
 SAU_div_governance: "§H多元化§! - 治理与法治"
 SAU_div_governance_desc: "更加公正的法院和负责任的政府部门能够改善营商环境，使政府政策更容易执行。"
 SAU_div_logistics: "§H多元化§! - 物流与运输"
 SAU_div_logistics_desc: "对港口、铁路和公路的投资加强了沙特阿拉伯在亚洲、非洲和欧洲之间贸易中的作用。"
 SAU_div_social: "§H多元化§! - 社会发展"
 SAU_div_social_desc: "学校、医院和住房让普通沙特民众在新经济中拥有了切身利益，并让他们有理由相信新经济。"
 SAU_div_tech: "§H多元化§! - 技术与创新"
 SAU_div_tech_desc: "研究园区和创业资金为沙特阿拉伯的科技行业注入了种子，使其能够雇用石油行业永远无法招到的毕业生。"
 SAU_div_tourism: "§H多元化§! - 旅游与娱乐"
 SAU_div_tourism_desc: "度假村、历史遗迹和娱乐区向曾经被拒之门外的游客敞开了王国的大门，游客的消费也留在了王国。"
 SAU_diversification: "§H经济多元化§!"
 SAU_diversification_desc: "沙特阿拉伯王国正在发展§L非石油经济§!，以降低其受石油价格波动的影响。包括治理、工业、旅游、科技、能源和社会发展在内的各个支柱产业的完善，都体现了这一发展战略，并有助于§G降低其对石油的依赖§!。"
 SAU_diversification_tt: "[SAU_div_governance_loc][SAU_div_construction_loc][SAU_div_tourism_loc][SAU_div_logistics_loc][SAU_div_tech_loc][SAU_div_defence_loc][SAU_div_energy_loc][SAU_div_social_loc]"
 SAU_doctrine_american: "学说：美国伙伴关系"
 SAU_doctrine_american_desc: "与美军一起训练，购买美国货，用美国的方式作战。这是最有效的途径 - 但代价是依赖性和国内潜藏的不满。\n\n§G+10%§!陆军经验获取\n§G+10%§!空军经验获取\n§G+5%§!师组织度\n§R-10%§!政治点数获取"
 SAU_doctrine_domestic: "学说：国内自力更生"
 SAU_doctrine_domestic_desc: "建立本土国防工业，打造一支不依赖外国供应商的军队。这支军队要自豪且自给自足，即使在尖端技术方面略逊一筹。\n\n§G+10%§!军工厂产出\n§G+5%§!师恢复率\n§R-5%§!陆军经验获取"
 SAU_doctrine_gcc: "学说：海湾合作委员会集体防御"
 SAU_doctrine_gcc_desc: "将王国的防御力量建立在海湾合作委员会和半岛盾牌部队之上。在本土作战时实力强大，但在进攻时却受制于委员会，行事谨慎。\n\n§G+15%§!核心领土防御\n§G+5%§!可征召人口\n§R-5%§!师攻击"
 SAU_doctrine_nato: "学说：北约专业主义"
 SAU_doctrine_nato_desc: "采纳北约标准：一支专业的军官队伍、诸兵种联合作战计划和严谨的参谋工作。卓越的指挥控制能力——但维持这支部队的成本也相当高昂。\n\n§G+10%§!计划速度\n§G+10%§!最大计划\n§G+5%§!师组织度\n§R+5%§!消费品使用"
 SAU_eco_bureau_bad: "§R沙特经济§! - 繁文缛节"
 SAU_eco_bureau_bad_desc: "沙特企业面临审批流程缓慢、审批环节重叠以及裙带关系盛行等问题。这些官僚障碍降低了公共投资的价值。"
 SAU_eco_bureau_good: "§G沙特经济§! - 精简国家机构"
 SAU_eco_bureau_good_desc: "审批流程从数年缩短到数天。精简高效的政府部门让沙特企业能够以市场速度运转。"
 SAU_eco_capital_bad: "§R沙特经济§! - 财富航班"
 SAU_eco_capital_bad_desc: "沙特阿拉伯的私人财富主要存放在伦敦、日内瓦和纽约。这个王国最富有的人把钱投资到世界各地，唯独不在国内。"
 SAU_eco_capital_good: "§G沙特经济§! - 本国资本"
 SAU_eco_capital_good_desc: "沙特资本留在沙特境内，用于投资工厂和企业，而不是购买海外豪华公寓。"
 SAU_eco_diversify_bad: "§R沙特经济§! - 食利国家"
 SAU_eco_diversify_bad_desc: "政府依赖石油收入，而许多公民则依赖国家提供的就业和福利。因此，单一商品价格的变动会影响整个经济。"
 SAU_eco_diversify_good: "§G沙特经济§! - 多元化"
 SAU_eco_diversify_good_desc: "旅游业、工业、物流和金融业如今与石油一样举足轻重。王国的收入不再仅仅依赖于单一价格。"
 SAU_eco_industry_bad: "§R沙特经济§! - 依赖进口"
 SAU_eco_industry_bad_desc: "沙特阿拉伯货架上的几乎所有商品都靠海运。除了石油行业，沙特王国自身生产的商品很少，几乎都消耗殆尽。"
 SAU_eco_industry_good: "§G沙特经济§! - 国内工业"
 SAU_eco_industry_good_desc: "沙特阿拉伯的工厂现在供应着王国曾经进口的产品，贸易账簿也显示了这一点。"
 SAU_eco_labour_bad: "§R沙特经济§! - 外籍劳工"
 SAU_eco_labour_bad_desc: "数百万外籍人士为沙特王国工作，而年轻的沙特人却在等待早已不复存在的政府闲职。"
 SAU_eco_labour_good: "§G沙特经济§! - 沙特劳动力"
 SAU_eco_labour_good_desc: "从车间工人到高管，所有工作岗位都由沙特人担任。工资也全部留在沙特境内。"
 SAU_econ_industry_first: "§H经济模式§! - 工业优先"
 SAU_econ_industry_first_desc: "王国优先发展钢铁、冶炼、制造和其他重工业。这提高了工业产量，但也需要更多的消费品和劳动力。"
 SAU_econ_mixed: "§H经济模式§! - 混合路径"
 SAU_econ_mixed_desc: "沙特阿拉伯王国同时发展工业和服务业。与单一产业战略相比，这种增长模式分散性更强，使经济更具韧性。"
 SAU_econ_services: "§H经济模式§! - 服务业优先"
 SAU_econ_services_desc: "沙特阿拉伯王国优先发展银行业、物流业、金融业和旅游业，将其视为沙特高技能就业的主要来源。这有助于提升知识经济，但同时也减少了工业产能。"
 SAU_economic_cities: "经济城市倡议"
 SAU_economic_cities_desc: "阿卜杜拉国王经济城和其他规划中的城市中心正在吸引办公、工业和服务业方面的投资。这些专门建设的城市是推动非石油经济增长的引擎。"
 SAU_economy: "§H沙特经济§!"
 SAU_economy_desc: "2000年沙特阿拉伯经济状况：§L石油资源丰富但经济结构单一§!，受资本外逃、进口依赖、官僚主义繁文缛节、外籍劳工依赖和对单一商品上瘾的拖累。§H经济国策树§!中的每个国策都能弥补一个弱点，并增强沙特基础工业公司的工业基础。完成整个国策树后，原本§R严重的劣势§!将转化为§G平衡且多元化的经济体§!。\n\n§Y以下：每个经济子系统，红色表示仍存在问题，绿色表示已改革。§!"
 SAU_economy_tt: "[SAU_eco_capital_loc][SAU_eco_industry_loc][SAU_eco_bureau_loc][SAU_eco_labour_loc][SAU_eco_diversify_loc][SAU_eco_model_loc][SAU_eco_cities_loc]"
 SAU_faisalite_balanced: "费萨尔平衡"
 SAU_faisalite_balanced_desc: "沙特阿拉伯王国在国内自力更生和有限对外参与之间寻求平衡，但并未将任何一种方式奉为圭臬。随着对外承诺的增加，维持这种平衡变得越来越困难。"
 SAU_faisalite_closed_schools: "学校停课"
 SAU_faisalite_closed_schools_desc: "国外课程体系已经废除，目前还没有新的课程体系来替代它们。这一届学生将因此耽误数年时间。"
 SAU_faisalite_conviction_decided: "费萨尔派圈子：已决定"
 SAU_faisalite_conviction_dormant: "费萨尔派圈子：休眠"
 SAU_faisalite_conviction_gathering: "费萨尔派圈子：聚会"
 SAU_faisalite_conviction_insistent: "费萨尔派圈子：坚持"
 SAU_faisalite_conviction_stirring: "费萨莱特圈：搅拌"
 SAU_faisalite_creditor_of_the_ummah: "乌玛的债权人"
 SAU_faisalite_creditor_of_the_ummah_desc: "沙特阿拉伯向穆斯林国家提供的长期贷款使利雅得对债务国政府拥有影响力。延期偿还贷款则增强了这些国家短期内的依赖性和对沙特的善意。"
 SAU_faisalite_foreign_endowments: "海外捐赠基金"
 SAU_faisalite_foreign_endowments_desc: "沙特阿拉伯的资金在十几所外国大学设立了教席和图书馆，沙特学生可以畅通无阻地进入这些大学学习。"
 SAU_faisalite_import_rationing: "进口配给"
 SAU_faisalite_import_rationing_desc: "许可证发放十分有限，政府部门外总是排着长队。王国买不到的东西，就只能在国内寻找，而它找到的远比预期的要多。"
 SAU_faisalite_interventionist_dominant: "§R干预主义盛行§!"
 SAU_faisalite_interventionist_dominant_desc: "峰会、补贴和军事顾问使沙特阿拉伯成为穆斯林世界的核心力量。这种影响力也使沙特王国不得不承担境外代价高昂的争端。"
 SAU_faisalite_interventionist_leaning: "§R倾向干预主义者§!"
 SAU_faisalite_interventionist_leaning_desc: "沙特阿拉伯王国再次加大海外支出，并因此受到关注。费萨尔或许能理解这一趋势，但可能尚未意识到其规模之大。"
 SAU_faisalite_isolationist_dominant: "§O孤立主义抬头§!"
 SAU_faisalite_isolationist_dominant_desc: "沙特阿拉伯对大多数外国影响和义务采取了封闭态度。这维护了其独立性，但也限制了其获取外部知识的渠道，使其在外交上陷入孤立。"
 SAU_faisalite_isolationist_leaning: "§O倾向孤立主义者§!"
 SAU_faisalite_isolationist_leaning_desc: "王国正在走向封闭。外国势力减少，对外义务减少，外交使团的工作量也越来越少。"
 SAU_faisalite_labour_shortage: "劳动力短缺"
 SAU_faisalite_labour_shortage_desc: "王国一半的脚手架都空着。支撑脚手架的工人已经回家了，而本应接替他们的工人却还没到。"
 SAU_faisalite_nationalised_management: "国有化管理"
 SAU_faisalite_nationalised_management_desc: "外籍经理们都走了，他们的继任者正在上​​手学习。工厂还在运转，尽管方式有些不同。"
 SAU_faisalite_officers_abroad: "海外军官团"
 SAU_faisalite_officers_abroad_desc: "最优秀的军官们都在为其他军队提供咨询。他们自己的部队也注意到了他们的缺席。"
 SAU_faisalite_street_movement: "街道铭记费萨尔"
 SAU_faisalite_street_movement_desc: "一场民众运动将费萨尔国王塑造成沙特独立的典范，着重强调石油禁运以及他对西方压力的抵抗。这种对费萨尔国王统治的简化解读已从清真寺传播到大学校园，如今更支撑起一支有组织的反对运动。"
 SAU_forces_modernized: "现代化武装部队"
 SAU_forces_modernized_desc: "一支完全现代化、专业化的军队 - 足以与该地区的任何军队匹敌，并且是伊朗真正的制衡力量。"
 SAU_forces_modernizing: "军队现代化"
 SAU_forces_modernizing_desc: "训练、理论和装备正在赶上西方标准。这些部队现在足以与邻国匹敌。"
 SAU_forces_reforming: "改革力量"
 SAU_forces_reforming_desc: "首批改革正在落地，旧的弱点中最严重的部分正在消失。继续现代化。"
 SAU_forces_unmodernized: "未现代化的武装部队"
 SAU_forces_unmodernized_desc: "数十年来对外国承包商的依赖和过时的理论使军队准备不足。应利用§Y军队现代化§!决议，逐步进行改革。"
 SAU_fortified_kingdom: "阿拉伯要塞"
 SAU_fortified_kingdom_desc: "坚固的基地、多层防空系统和沿海驻军提高了沙特阿拉伯抵御伊朗攻击的能力。"
 SAU_french_investment_pact_FRA: "沙特-法国投资协议"
 SAU_french_investment_pact_FRA_desc: "一项由沙特政府支持的协议向法国工业开放了沙特市场，并将海湾地区的资本引入法国。"
 SAU_grievance_bitter: "军官团：苦涩"
 SAU_grievance_brink: "军官团：濒临绝境"
 SAU_grievance_contained: "军官团：被控制"
 SAU_grievance_mutinous: "军官团：叛逆"
 SAU_grievance_restive: "军官团：不安"
 SAU_guardian_of_palestine: "巴勒斯坦守护者"
 SAU_guardian_of_palestine_desc: "通过支持巴勒斯坦事业，沙特阿拉伯王国在整个穆斯林世界赢得了声誉，使其王位在国内和国际上都获得了合法性。"
 SAU_gulf_war_lessons: "海湾战争的教训"
 SAU_gulf_war_lessons_desc: "1991年的海湾战争暴露了沙特阿拉伯在装备、理论和指挥方面的严重缺陷。总参谋部正在研究各种军事改革模式，但尚未选定最终方案。\n\n§G+5%§!陆军经验获取\n§G+5%§!计划速度\n\n§Y运行“战争游戏：海湾战争的教训”决议，选择一种作战理论。§!"
 SAU_hajj_management_01: "两圣寺的监护人"
 SAU_hajj_management_01_desc: "作为麦加和麦地那的守护者，沙特阿拉伯政府负责管理一年一度的朝觐活动，每年迎接来自世界各地约两百万穆斯林。朝觐活动通过旅游、交通和酒店业创造了可观的收入，同时也为沙特阿拉伯王国在穆斯林世界赢得了无与伦比的宗教声望。"
 SAU_hormuz_shield: "霍尔木兹之盾"
 SAU_hormuz_shield_desc: "沙特阿拉伯海军护航舰艇保护通过霍尔木兹海峡的油轮，并降低伊朗干扰石油运输的能力。"
 SAU_IMEC_india_deal_new: "印度-中东-欧洲走廊"
 SAU_IMEC_india_deal_new_desc: "印度-中东-欧洲走廊将印度贸易经由沙特阿拉伯的港口和铁路运输至此。沙特阿拉伯王国从这条新丝绸之路中收取通行费。"
 SAU_IMEC_india_deal_new_loc: "\n§H[RAJ.GetFlag]印度-中东-欧洲经济走廊§![SAU.GetFlag]\n建筑速度：§G+5.00%§!\n每单位化石燃料的燃料提取：§G+3.00%§!\n§H资源出口收入§!乘数：§G+1.50%§!\n"
 SAU_India_one_IMEC_india_deal: "[RAJ.GetFlag]§H印度-中东-欧洲经济§![SAU.GetFlag]走廊（印度-中东-欧洲走廊）"
 SAU_India_one_IMEC_india_deal_desc: "印度-中东-欧洲经济走廊通过铁路和海运，将印度港口经海湾与欧洲市场连接起来。印度位于该走廊的东大门，从每一笔货运中获利。"
 SAU_iraq_border_defense: "北方边境防御"
 SAU_iraq_border_defense_desc: "军队已在伊拉克边境构筑工事，严阵以待，以防1990年的情况重演。对伊拉克防御力提升10%。萨达姆下台后，防御力提升将解除。"
 SAU_iraq_pipeline_t1: "欧洲输油管线（1级）"
 SAU_iraq_pipeline_t1_desc: "沙特石油向北流经伊拉克，最终到达被土耳其和莫斯科严密把守的欧洲市场。来自输油管线的出口§G额外收入：$ 2.25B§!，相比§R额外支出：管道途经国家的过境费$ 1.00B§!，净收入§G+$ 1.25B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_iraq_pipeline_t2: "欧洲输油管线（2级）"
 SAU_iraq_pipeline_t2_desc: "沙特石油向北流经伊拉克，最终到达被土耳其和莫斯科严密把守的欧洲市场。来自输油管线的出口§G额外收入：$ 2.75B§!，相比§R额外支出：管道途经国家的过境费$ 1.15B§!，净收入§G+$ 1.60B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_iraq_pipeline_t3: "欧洲输油管线（3级）"
 SAU_iraq_pipeline_t3_desc: "沙特石油向北流经伊拉克，最终到达被土耳其和莫斯科严密把守的欧洲市场。来自输油管线的出口§G额外收入：$ 3.25B§!，相比§R额外支出：管道途经国家的过境费$ 1.25B§!，净收入§G+$ 2.00B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_islamic_leadership: "伊斯兰世界的领袖"
 SAU_islamic_leadership_desc: "沙特阿拉伯对麦加和麦地那的控制以及其在重大伊斯兰峰会中的作用，使利雅得在整个穆斯林世界拥有相当大的影响力。"
 SAU_israel_tech_partnership: "硅与砂"
 SAU_israel_tech_partnership_desc: "《利雅得协议》将沙特阿拉伯的投资与以色列的技术相结合，并支持两国开展联合研究。"
 SAU_junta_accepted: "议会：同意"
 SAU_junta_contested: "议会：争论"
 SAU_junta_illegitimate: "议会：非法"
 SAU_junta_rejected: "议会：否决"
 SAU_junta_tolerated: "议会：容忍"
 SAU_laf_offensive: "雪松决心行动"
 SAU_laf_offensive_desc: "沙特阿拉伯的资金和装备提高了黎巴嫩军队对真主党发动进攻的能力和意愿。"
 SAU_national_water_pride_minus1: "§H自主水务§! - §Y可疑§!"
 SAU_national_water_pride_minus1_desc: "稳定度在35%至44%之间，公众对§L沙特阿拉伯拥有§!的水利项目的信心正在减弱。这导致沙特王朝的§Y合法性略有下降§!。"
 SAU_national_water_pride_minus2: "§H自主水务§! - §R紧张§!"
 SAU_national_water_pride_minus2_desc: "稳定性低下加剧了民众对§L国家水利工程§!的批评。其糟糕的表现正在损害王朝的声誉。"
 SAU_national_water_pride_minus3: "§H自主水务§! - §R反噬§!"
 SAU_national_water_pride_minus3_desc: "水利工程已成为政府管理不善的典型案例。持续的缺水导致该王朝的§R支持率严重下降§!。"
 SAU_national_water_pride_minus4: "§H自主水务§! - §R灾难§!"
 SAU_national_water_pride_minus4_desc: "在极度动荡的局势下，水资源§R短缺严重§!损害了§H沙特王朝§!的合法性。只有恢复稳定或王朝覆灭才能结束这种惩罚。"
 SAU_national_water_pride_neutral: "§H自主水务§! - §Y稳定§!"
 SAU_national_water_pride_neutral_desc: "当稳定性约为50%时，国家水资源计划既不带来政治利益，也不带来政治惩罚。稳定性的变化将使其进入正面或负面的层级。"
 SAU_national_water_pride_plus1: "§H自主水务§! - §G满意§!"
 SAU_national_water_pride_plus1_desc: "充足的稳定性和可靠的供水服务能够维护王朝的声誉，并带来§G一定的§!政治利益。"
 SAU_national_water_pride_plus2: "§H自主水务§! - §G兴旺§!"
 SAU_national_water_pride_plus2_desc: "§L沙特拥有§!的海水淡化系统具有强大的稳定性和可靠的运行能力，这体现了政府的能力，并提高了§H沙特王室§!的威望。"
 SAU_national_water_pride_plus3: "§H自主水务§! - §G稳固§!"
 SAU_national_water_pride_plus3_desc: "高度的稳定性使国家水利项目成为§H国内声望的来源§!。海外对§L沙特阿卜杜拉国王科技大学§!专业知识的需求以及该项目的经济回报也带来了额外的益处。"
 SAU_national_water_pride_plus4: "§H自主水务§! - §G凯旋§!"
 SAU_national_water_pride_plus4_desc: "在最高级别的稳定性下，§L沙特拥有§!的水利项目被广泛认为是一项重大的国家成就。该项目的成功为§H沙特王室§!带来了最大的合法性收益。"
 SAU_nda_free_press: "新闻自由"
 SAU_nda_free_press_loc: "[SAU.GetFlag]新闻自由\n§H政治点数获取：§! §G+5.00%§! \n§H外国影响力防御：§! §G+20.00%§!\n\n"
 SAU_nda_free_world: "自由世界的一员"
 SAU_nda_free_world_loc: "[SAU.GetFlag]自由世界的一员\n§H贸易关系值：§! §G+15.00%§!\n§H每月关系值获取：§! §G+20.00%§!\n\n"
 SAU_nda_knowledge_economy: "知识经济"
 SAU_nda_knowledge_economy_loc: "[SAU.GetFlag]知识经济\n§H研究速度：§! §G+5.00%§!\n§H稳定度：§! §G+3.00%§!\n\n"
 SAU_nda_open_market: "开放市场"
 SAU_nda_open_market_loc: "[SAU.GetFlag]开放市场\n§H消费品：§! §G-10.00%§!\n§H外国投资成本：§! §G-5.00%§!\n§H投资收益：§! §G+5.00%§!\n\n"
 SAU_neom_aqaba_zone: "新未来城-亚喀巴经济区"
 SAU_neom_aqaba_zone_desc: "沙特阿拉伯的新未来城超级城市和约旦的亚喀巴港作为一个单一的跨境经济区运作，加快了建设速度，并为国库注入了资金。"
 SAU_oil_defend_price_idea: "捍卫价格"
 SAU_oil_defend_price_idea_desc: "沙特阿拉伯已减产以支撑国际油价。此举提高了每桶石油的收益，但却牺牲了市场份额，使那些维持产量的生产商蒙受损失。"
 SAU_oil_dependence_t1: "§G石油经济§! - 已多元化"
 SAU_oil_dependence_t1_desc: "§H石油依赖：§!§Y[?oil_dependence|0]§!§H / 100§!\n§R它每三个月自动更换一次。§!\n\n一个现代化、多元化的经济体。石油只是众多出口产品之一。 - 无论原油价格如何波动，沙特阿拉伯王国都能保持§G韧性§!。2030年愿景，已实现。"
 SAU_oil_dependence_t2: "§Y石油经济§! - 来源广泛"
 SAU_oil_dependence_t2_desc: "§H石油依赖：§!§Y[?oil_dependence|0]§!§H / 100§!\n§R它每三个月自动更换一次。§!\n\n工业、服务业和科技如今举足轻重。石油危机是可以承受的，并非灾难性的。"
 SAU_oil_dependence_t3: "§Y石油经济§! - 多元化中"
 SAU_oil_dependence_t3_desc: "§H石油依赖：§!§Y[?oil_dependence|0]§!§H / 100§!\n§R它每三个月自动更换一次。§!\n\n经济结构正在多元化。石油仍然是最大的支柱产业，但不再是唯一重要的产业。"
 SAU_oil_dependence_t4: "§R石油经济§! - 依赖石油"
 SAU_oil_dependence_t4_desc: "§H石油依赖：§!§Y[?oil_dependence|0]§!§H / 100§!\n§R它每三个月自动更换一次。§!\n\n非石油行业正在增长，但原油仍然几乎是所有行业的主要资金来源。油价暴跌仍将造成严重打击。 - 糟糕。"
 SAU_oil_dependence_t5: "§R石油经济§! - 完全石油国度"
 SAU_oil_dependence_t5_desc: "§H石油依赖：§!§Y[?oil_dependence|0]§!§H / 100§!\n§R它每三个月自动更换一次。§!\n\n整个王国的兴衰都系于石油。石油§G几乎§!占据了预算的全部。- 利润极其丰厚，但§R极易§!受到世界价格暴跌的影响。\n§Y对石油的依赖程度只会随着你的国策和决议而改变 - 选择石油相关的政策会提高依赖程度，而多元化经营则会降低依赖程度。王国一开始就高度依赖石油；只有持续的改革才能降低依赖程度，而且一旦改革结束，依赖程度就会保持不变。§!"
 SAU_oil_embargoed: "§R石油禁运§!"
 SAU_oil_embargoed_desc: "沙特阿拉伯及其欧佩克伙伴国已停止石油供应。在禁运解除之前，加油站排起长龙、工厂停工以及物价飙升将严重影响沙特阿拉伯经济。"
 SAU_oil_for_security_pact: "石油安全"
 SAU_oil_for_security_pact_desc: "沙特阿拉伯王国向美国市场供应石油，而华盛顿则为沙特的安全提供担保。这种安排既稳定了里亚尔汇率，也稳定了美元汇率，同时还巩固了沙特王室的地位。"
 SAU_oil_for_security_pact_loc: "[USA.GetFlag]石油安全\n§H化石燃料出口收入乘数：§! §G+5.00%§!\n"
 SAU_oil_for_security_pact_USA: "石油安全"
 SAU_oil_for_security_pact_USA_desc: "利雅得保证向美国市场供应石油：以廉价、可靠的燃料换取美国的安全保障。"
 SAU_oil_market_share_idea: "捍卫市场份额"
 SAU_oil_market_share_idea_desc: "沙特阿拉伯维持高产量并接受较低的价格，以保住其石油市场份额。其低廉的开采成本使其能够比生产成本更高的石油生产商坚持更长时间。"
 SAU_oil_price_collapse_idea: "石油价格暴跌"
 SAU_oil_price_collapse_idea_desc: "油价远低于国家预算预期水平。出​​口收入下降，而福利支出居高不下，迫使政府动用外汇储备。"
 SAU_OPEC_Russia_deal_new: "欧佩克+协调"
 SAU_OPEC_Russia_deal_new_desc: "利雅得和莫斯科共同制定了产量配额。两个石油超级大国共同掌控着一个市场。"
 SAU_OPEC_Russia_deal_new_loc: "\n§H[SAU.GetFlag]欧佩克+协议[SOV.GetFlag]§!\n§H化石燃料出口收入乘数：§! §G+5.00%§!\n"
 SAU_pipeline_empire: "能源十字路口"
 SAU_pipeline_empire_desc: "沙特阿拉伯现在拥有通往三个海域的石油出口路线，不再依赖霍尔木兹海峡作为其唯一的主要出口。"
 SAU_pipeline_transit_IRQ_t1: "沙特管道过境（1级）"
 SAU_pipeline_transit_IRQ_t1_desc: "沙特石油经伊拉克输送，过境费充实了国库。这条输油管道提高了该国的石油产量。§G额外收入：$1.00B§!"
 SAU_pipeline_transit_IRQ_t2: "沙特管道过境（2级）"
