 SMA_investment_from_foreign: "Investissement en provenance d'un pays étranger"
 SMA_purchase_spanish_equipment: "Acheter du matériel espagnol"
 SMA_purchase_spanish_equipment_desc: "L’Espagne est un pays producteur d’armes bien connu en Europe, et acheter des armes en Espagne serait un choix judicieux."
 SMA_equipment.1.t: "Saint-Marin demande des armes d'infanterie"
 SMA_equipment.1.d: "La République de Saint-Marin nous a demandé d'acheter des armes d'infanterie pour ses forces armées. L'affaire rapporterait des devises et renforcerait les liens bilatéraux."
 SMA_equipment.1.a: "Approuver la vente"
 SMA_equipment.1.b: "Refuser la demande"
 SMA_equipment.2.t: "Achat d'armes d'infanterie accepté"
 SMA_equipment.2.d: "L'Italie a accepté de nous vendre les armes d'infanterie demandées. Nos stocks ont été renforcés."
 SMA_equipment.2.a: "Excellent"
 SMA_equipment.3.t: "Achat d'armes d'infanterie refusé"
 SMA_equipment.3.d: "L'Italie a refusé notre demande d'achat d'armes d'infanterie. Les fonds de notre Trésor ont été restitués."
 SMA_equipment.3.a: "Malheureusement"
 SMA_equipment.4.t: "Saint-Marin demande des véhicules blindés"
 SMA_equipment.4.d: "Saint-Marin souhaite acheter des chars et des véhicules blindés à nos constructeurs. C'est une commande substantielle qui bénéficierait à notre industrie de défense."
 SMA_equipment.4.a: "Approuver la vente"
 SMA_equipment.4.b: "Refuser la demande"
 SMA_equipment.5.t: "Achat de véhicules blindés accepté"
 SMA_equipment.5.d: "L'Italie a approuvé la vente de véhicules blindés à nos forces. Nos capacités blindées ont été nettement renforcées."
 SMA_equipment.5.a: "Excellent"
 SMA_equipment.6.t: "Achat de véhicules blindés refusé"
 SMA_equipment.6.d: "L'Italie a refusé notre demande d'achat de véhicules blindés. Les fonds de notre Trésor ont été restitués."
 SMA_equipment.6.a: "Malheureusement"
 SMA_equipment.7.t: "Saint-Marin demande de l'artillerie"
 SMA_equipment.7.d: "Saint-Marin a soumis une demande d'achat de pièces d'artillerie à nos arsenaux. La commande est modeste mais renforcerait nos relations."
 SMA_equipment.7.a: "Approuver la vente"
 SMA_equipment.7.b: "Refuser la demande"
 SMA_equipment.8.t: "Achat d'artillerie accepté"
 SMA_equipment.8.d: "L'Italie a accepté de nous vendre des pièces d'artillerie. Notre puissance de feu s'est améliorée."
 SMA_equipment.8.a: "Excellent"
 SMA_equipment.9.t: "Achat d'artillerie refusé"
 SMA_equipment.9.d: "L'Italie a refusé notre demande d'achat d'artillerie. Les fonds de notre Trésor ont été restitués."
 SMA_equipment.9.a: "Malheureusement"
 SMA_equipment.10.t: "Saint-Marin demande de la défense antiaérienne"
 SMA_equipment.10.d: "Saint-Marin a demandé d'acheter des MANPADS et des missiles antichars guidés à nos industriels de défense. La vente démontrerait notre engagement pour la sécurité régionale."
 SMA_equipment.10.a: "Approuver la vente"
 SMA_equipment.10.b: "Refuser la demande"
 SMA_equipment.11.t: "Achat de défense antiaérienne accepté"
 SMA_equipment.11.d: "L'Italie a approuvé la vente de systèmes de défense aérienne et d'armes antichars. Nos capacités défensives ont été renforcées."
 SMA_equipment.11.a: "Excellent"
 SMA_equipment.12.t: "Achat de défense antiaérienne refusé"
 SMA_equipment.12.d: "L'Italie a refusé notre demande d'équipement de défense aérienne. Les fonds de notre Trésor ont été restitués."
 SMA_equipment.12.a: "Malheureusement"
 SMA_equipment.13.t: "Saint-Marin demande de l'équipement de soutien"
 SMA_equipment.13.d: "Saint-Marin souhaite se procurer de l'équipement de soutien pour ses forces. Une commande de routine qui ne devrait poser aucun problème."
 SMA_equipment.13.a: "Approuver la vente"
