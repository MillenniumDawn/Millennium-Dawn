 LOGISTICS_CAPACITY_DETAILED_DESC: "Вместимость логистики показывает, насколько удовлетворены ваши линии снабжения. Если в вашей стране не хватает поездов или служебных транспортных средств, необходимых для доставки всех потребностей в снабжении, ваши подразделения будут получать уменьшенное снабжение и подвергаться штрафам за нехватку снабжения."
 TRUCKS: "Служебные транспортные средства"
 FUEL_DESC: "§HТопливо§! производится из избыточной нефти вашей страны. Каждая страна имеет максимальную ёмкость для §HТопливо§!, которую можно увеличить, строя §HСклады§!. §HТопливо§! используется танками/механизированными частями, кораблями и самолётами, и доставляется с помощью §HЛиний снабжения§!.\n\n§HТопливо§! также используется для работы §HТепловых электростанций§! вашей страны и является важным ресурсом, обеспечивающим функционирование вашей экономики. §HЯдерные реакторы§!, §HИнфраструктура возобновляемой энергии§! и §HДругие источники энергии§! не потребляют §HТопливо§! для генерации энергии. Ваше §HНаселение§! также потребляет §HТопливо§! в рамках своих общих потребностей. Для получения дополнительной информации о невоенном потреблении §HТопливо§! перейдите в §HЭкран энергии§! во вкладке §HСтроительство§!."
