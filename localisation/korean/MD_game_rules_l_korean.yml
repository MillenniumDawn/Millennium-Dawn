 POL_KORWIN_PE: "코르빈의 나토 잔류"
 POL_KORWIN_PE_DESC: "폴란드는 실수정치연합(UPR)을 지지하고, 코르빈으로 승리한 뒤, 우크라이나를 나토(NATO)에 가입시키고 폴란드-리투아니아 연방을 개혁할 것입니다."
 POL_WALESA: "바웬사의 재집권"
 POL_WALESA_DESC: "폴란드는 기독교민주제3공화국당(ChDRP)을 지지하고, 바웬사로 승리하여 자국의 미래를 선택할 것입니다."
