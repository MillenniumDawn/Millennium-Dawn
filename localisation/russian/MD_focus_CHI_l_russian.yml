 BRI_apply_named_PORT: "Заявка: §Y[THIS.GetBRINextProjectPORT]§!"
 BRI_apply_named_PORT_desc: "Попросить Пекин построить §Y[THIS.GetBRINextProjectPORT]§!. Подача заявки стоит 30 политической власти. При одобрении мы платим §Y40§! из казны или получаем китайский кредит. Требования: прибрежный регион и мирное время."
 BRI_apply_named_RAIL: "Заявка: §Y[THIS.GetBRINextProjectRAIL]§!"
 BRI_apply_named_RAIL_desc: "Попросить Пекин построить §Y[THIS.GetBRINextProjectRAIL]§!. Подача заявки стоит 30 политической власти. При одобрении мы платим §Y40§! из казны или получаем китайский кредит. Требования: граница с Китаем или действующее партнёрство по инициативе «Один пояс и один путь», а также мирное время."
 BRI_apply_named_PIPELINE: "Заявка: §Y[THIS.GetBRINextProjectPIPELINE]§!"
 BRI_apply_named_PIPELINE_desc: "Попросить Пекин построить §Y[THIS.GetBRINextProjectPIPELINE]§!. Подача заявки стоит 35 политической власти. При одобрении мы платим §Y40§! из казны или получаем китайский кредит. Требования: месторождения нефти, стали или драгоценных металлов, а также мирное время."
 BRI_apply_named_TELECOM: "Заявка: §Y[THIS.GetBRINextProjectTELECOM]§!"
 BRI_apply_named_TELECOM_desc: "Попросить Пекин построить §Y[THIS.GetBRINextProjectTELECOM]§!. Подача заявки стоит 25 политической власти. При одобрении мы платим §Y40§! из казны или получаем китайский кредит. Требования: мирное время. Страны, ориентированные на Запад, привлекут повышенное внимание."
 BRI_apply_named_SEZ: "Заявка: §Y[THIS.GetBRINextProjectSEZ]§!"
 BRI_apply_named_SEZ_desc: "Попросить Пекин построить §Y[THIS.GetBRINextProjectSEZ]§!. Подача заявки стоит 40 политической власти. При одобрении мы платим §Y40§! из казны или получаем китайский кредит. Требования: более четырёх заводов и мирное время."
 BRI_apply_named_MINE: "Заявка: §Y[THIS.GetBRINextProjectMINE]§!"
 BRI_apply_named_MINE_desc: "Попросить Пекин построить §Y[THIS.GetBRINextProjectMINE]§!. Подача заявки стоит 30 политической власти. При одобрении мы платим §Y40§! из казны или получаем китайский кредит. Требования: месторождения драгоценных, технологических или лёгких металлов либо стали, а также мирное время."
 BRI_apply_named_ENERGY: "Заявка: §Y[THIS.GetBRINextProjectENERGY]§!"
 BRI_apply_named_ENERGY_desc: "Попросить Пекин построить §Y[THIS.GetBRINextProjectENERGY]§!. Подача заявки стоит 30 политической власти. При одобрении мы платим §Y40§! из казны или получаем китайский кредит. Требования: промышленный регион и мирное время."
 BRI_apply_named_PRESTIGE: "Заявка: §Y[THIS.GetBRINextProjectPRESTIGE]§!"
