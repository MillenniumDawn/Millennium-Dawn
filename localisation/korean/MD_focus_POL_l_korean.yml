 POL_zkp_p: "ZKP-P"
 POL_zkp_p_desc: "ZKP-P - 폴란드 공산주의자 연합 \\"프롤레타리아트\\"는 정치적 유물로, 1990년 이전 공산당의 정신적 후계 정당입니다. 그러나 비슷한 수사를 계속 사용하면서도 보다 실용적인 영역으로 옮겨 갔습니다."
 POL_pps: "PPS"
 POL_pps_desc: "PPS - 폴란드 사회당은 극좌로 묘사될 수 있는 광범위한 좌파 동맹입니다. 정책과 의도가 다소 모호하여 실제로 집권하면 무엇을 할지는 추측만 할 수 있을 뿐입니다."
 POL_fight_the_democracy: "민주주의와의 투쟁"
 POL_fight_the_democracy_desc: "우리는 우리나라에서 민주주의의 인기를 약화시켜야 합니다. 사람들은 공산주의가 유일하게 옳은 이념임을 알아야 합니다. 민주 정부가 저지른 모든 추악한 일을 찾아낼 것입니다."
 POL_strike_the_government: "정부에 대한 파업"
 POL_strike_the_government_desc: "현 정부는 우리가 더 강해지도록 허용했습니다. 우리의 혁명은 집권당의 약함 때문에 시작되었습니다. 정치를 전혀 모르는 사람들에게 이끌려 가기를 정말 원합니까?!"
 POL_negative_effects_of_privatization: "민영화의 부정적 영향"
 POL_negative_effects_of_privatization_desc: "부패, 인플레이션, 높은 실업. 이것이 자본주의와 민영화의 결과입니다. 공산주의는 모두에게 정직한 일자리를 제공하며, 우리 모두는 평등합니다."
 POL_antagonize_the_europe: "EU와의 적대"
 POL_antagonize_the_europe_desc: "ZKP-P의 연설: 우리에게는 서방의 도움이 필요 없다! 폴란드는 스스로 경제와 사회를 발전시킬 수 있다!\n\nPPS의 연설: 유럽 연합은 회원국을 자신에게 지나치게 의존하게 만든다. 이는 대대적인 개혁을 거치지 않는 한 우리가 가입하려고 해서는 안 되는 조직이다."
 POL_military_state: "군사 국가"
 POL_military_state_desc: "국가의 가장 큰 힘은 군대입니다. 국가의 발전을 결정해야 할 이들은 장군들이므로, 그들에게 전권을 맡길 것입니다."
 POL_stabilize_post_revolution_chaos: "혁명 후 혼란 안정화"
 POL_stabilize_post_revolution_chaos_desc: "병사들의 도움이 있다면 민주주의 시위를 진압하는 것은 매우 쉬울 것입니다. 사람들은 우리가 그들을 가만두지 않을 것임을 알아야 합니다. 폴란드는 더 이상 나태하고 민주적이지 않습니다."
 POL_close_west_border: "서부 국경 폐쇄"
 POL_close_west_border_desc: "이제 다른 민족들로부터 우리를 분리하기 시작할 때입니다. 우리는 서유럽의 자원에 지나치게 의존하고 있습니다. 이러한 영향력에 종지부를 찍고 독립적인 경제 제국을 건설하기 시작해야 합니다."
 POL_new_constitution: "새 헌법"
 POL_new_constitution_desc: "새 헌법은 국가의 정세를 안정시키는 데 도움이 될 것입니다. 우리는 강경 공산주의의 원칙을 복원할 것입니다. 모두가 이를 이해하지는 못하겠지만, 이것이 국가에 최종적인 질서를 가져올 최선의 방법임을 우리는 알고 있습니다."
 POL_close_east_border_communist: "동부 국경 폐쇄"
 POL_close_east_border_communist_desc: "우리는 서부 국경 폐쇄의 영향에 대처했습니다. 이제 한 걸음 더 나아가 러시아와 거리를 둘 때입니다. 그들의 가스와 석유는 이곳에서도 생산할 수 있습니다. 안보상의 이유로 발칸과의 국경은 열어 두겠습니다."
 POL_establish_a_new_high_command: "새 최고 사령부 창설"
 POL_establish_a_new_high_command_desc: "지금까지 우리나라는 무작위로 선정된 고위 지휘관들에 의해 통치되었습니다. 그러나 높은 군 계급이 항상 정치와 조화를 이루는 것은 아닙니다. 정부에는 정치와 군사 관리를 모두 아는 사람이 있어야 합니다."
 POL_limiting_the_role_of_the_church: "교회의 역할 제한"
 POL_limiting_the_role_of_the_church_desc: "교회는 사람들의 일에 간섭합니다. 폴란드 문화에서 교회의 역할을 제한하려 하겠지만, 스탈린, 고무우카, 기에레크의 실수를 되풀이하지는 않을 것입니다. 이 나라에서 교회를 완전히 없앨 수 없음을 알고 있으므로 신중하게 행동해야 합니다."
 POL_civilian_focus_communist: "민간 중시"
 POL_civilian_focus_communist_desc: "군이 모든 것을 통제해서는 안 됩니다. 민간인이 우리 사회에 무엇이 필요한지 가장 잘 알고 있으므로, 전통적인 정책을 이어 가고 권력을 국민의 손에 맡겨야 합니다."
 POL_power_to_the_people: "인민에게 권력을"
 POL_power_to_the_people_desc: "정부가 비교적 안정된 지금, 우리는 개혁을 시행하기 시작할 수 있습니다. 우리가 그들에게 이로운 일을 하기 시작한다면 사람들은 우리를 신뢰할 것입니다."
 POL_clean_up_the_mess: "혼란 수습"
 POL_clean_up_the_mess_desc: "혁명 중에 우리는 인터넷에 공개되어서는 안 되었을 많은 범죄를 저질렀습니다. 해당하는 사람들의 입을 막을 것이며 아무도 이를 알지 못할 것입니다."
 POL_prepare_to_introduce_the_new_order: "새 질서 도입 준비"
 POL_prepare_to_introduce_the_new_order_desc: "우리는 아직 공산주의 건설의 초기 단계에 있습니다. 기초는 마련되었지만, 사람들을 새로운 업무 방식으로 옮겨 가게 해야 합니다. 공산주의는 민주주의와 매우 다르므로 있을 수 있는 시위에 대비해야 합니다."
 POL_censorship: "검열"
 POL_censorship_desc: "소셜 미디어에 첫 시위와 증오가 나타나고 있습니다. 이러한 불경한 글에 대한 접근을 차단함으로써 사람들을 진정시킬 것입니다."
 POL_prl_was_a_failure: "인민공화국은 실패였다"
 POL_prl_was_a_failure_desc: "폴란드 인민공화국은 37년밖에 지속되지 못했고, 폴란드의 민주주의는 그보다 더 짧았습니다. 숨길 것은 없습니다. 고무우카와 기에레크의 공산 통치는 폴란드 정치의 수치였습니다. 우리는 결코 PPR을 재현하려 하지 않을 것입니다. 이러한 사고방식이 진정하고 안정된 공산주의가 마침내 폴란드에 뿌리내리도록 보장할 것입니다."
 POL_keep_free_elections: "자유 선거 유지"
 POL_keep_free_elections_desc: "ZKP-P 공산주의자들은 꺼져라! 그들은 믿을 수 없습니다. 그들의 혁명을 믿은 것은 잘못이었으며, 이익보다 더 많은 문제를 일으킨 끔찍한 선택이었습니다. 우리는 이 실수를 바로잡겠지만, 이에 대해 공산주의자들이 분명한 반응을 보일 것임은 확실합니다."
 POL_regain_western_trust: "서방의 신뢰 회복"
 POL_regain_western_trust_desc: "앞으로 우리는 어떻게든 서방을 설득해야 합니다. 가장 좋은 방법은 아마도 ZKP-P 공산주의자들이 혁명 중에 저지른 범죄를 유출하는 것일 것입니다."
 POL_start_the_economic_reform: "경제 개혁 시작"
 POL_start_the_economic_reform_desc: "서방이 있든 없든, 우리는 계획을 실행하기 시작해야 합니다. 결국 우리는 국가의 상황을 수수방관하려고 ZKP-P에 가담한 것이 아닙니다."
 POL_open_trade_with_eu: "EU와의 무역 재개"
 POL_open_trade_with_eu_desc: "서방 상품을 차단한 것은 실수였습니다. 식료품과 전자제품 가격이 크게 올랐고 경제 발전이 둔화되었습니다. 이에 대해 아무것도 하지 않으면 우리는 경제 불황에 빠질 것입니다. 그들의 혁명이 어리석은 발상이었던 또 하나의 이유입니다..."
 POL_seek_eu_integration: "EU 통합 모색"
 POL_seek_eu_integration_desc: "유럽 연합은 국가에 경제적 안정과 재정 지원을 제공합니다. ZKP-P는 EU를 증오하지만, 통합은 이익만을 가져옵니다. 공산주의자들이 이를 받아들이든 말든 상관없습니다. 여기서는 우리가 책임자입니다."
 POL_plans_for_the_west: "서방을 위한 계획"
 POL_plans_for_the_west_desc: "공산주의자들의 시위가 일어날 경우를 대비해 서방의 지지를 확보해야 합니다. 또한 예상되는 두 번째 혁명으로 큰 피해가 발생할 경우에 대비한 재건 계획도 준비할 것입니다."
 POL_stop_the_elections: "선거 중단"
 POL_stop_the_elections_desc: "우리가 원하는 바는 아니지만, ZKP-P의 공산주의자들은 이 선택을 높이 평가할 것입니다. 이는 서방과의 화해 가능성을 아마도 망쳐 놓겠지만, 사회주의가 우리나라에 가장 좋은 길입니다."
 POL_calm_down_the_west: "서방 달래기"
 POL_separate_from_the_eu_countries: "EU 국가들과의 분리"
 POL_separate_from_the_eu_countries_desc: "우리는 서서히 EU에서 멀어지고 있으며, 이는 곧 새로운 무역 상대를 찾아야 한다는 뜻입니다. 가장 좋은 선택은 러시아일 것입니다."
 POL_preparations_for_the_reworked_four_year_plan: "개정 4개년 계획 준비"
 POL_preparations_for_the_reworked_four_year_plan_desc: "4개년 계획은 공산주의 경제에 좋은 해결책이었습니다. 잘 수립한다면 정말 엄청난 성장을 이룰 수 있습니다."
 POL_security_through_eastern_trade: "동방 무역을 통한 안보"
 POL_security_through_eastern_trade_desc: "따라서 러시아와의 무역을 강화해야 합니다. 오랜 분쟁을 청산하고 훌륭한 협력을 시작할 좋은 시기일 수 있습니다."
 POL_new_four_year_plan: "새 4개년 계획"
 POL_new_four_year_plan_desc: "계획이 준비되었으므로 새로운 4개년 계획을 시행합니다. 이를 달성한다면 폴란드는 새로운 지역 경제 강국이 될 것입니다."
 POL_focus_on_internal_matters_communist: "내정 중시"
 POL_focus_on_internal_matters_communist_desc: "동서 정치에 집중하는 대신 국내 문제를 최우선 과제로 삼아야 합니다. 민주주의 체제는 이제 수습해야 할 혼란을 남겼습니다."
 POL_elimination_of_social_boundaries: "사회적 경계의 철폐"
 POL_elimination_of_social_boundaries_desc: "계급 구분은 어쩌면 민주주의의 가장 큰 결함일 것입니다. 사람들은 평등해야 하며 그들의 노동도 같은 수준으로 인정받아야 합니다."
 POL_limited_export: "수출 제한"
 POL_limited_export_desc: "국가의 에너지 안보는 우리 스스로 챙길 수 있지만, 세계로부터 완전히 고립될 수는 없습니다. 대외 무역을 점진적으로 차단할 것입니다."
 POL_close_the_markets: "시장 폐쇄"
 POL_close_the_markets_desc: "시장은 닫혔고 무역은 정체 상태입니다. 이국적인 상품은 다소 부족하겠지만, 우리의 최고 품질 상품으로 보완할 것입니다."
 POL_department_of_foreign_influence: "대외 영향력부"
 POL_department_of_foreign_influence_desc: "대평의회는 공산주의를 폴란드에만 머물게 할 생각이 없습니다. 새로운 부서는 다른 유럽 국가들에서 우리의 영향력을 확대할 수 있게 해 줄 것입니다."
 POL_visegrad_strategy: "비셰그라드 전략"
 POL_visegrad_strategy_desc: "V4 그룹은 폴란드, 체코, 슬로바키아, 헝가리입니다. 우리는 이들 국가와 비교적 좋은 관계를 맺고 있어 행동의 여지가 꽤 많습니다. 이들을 붉은 유럽 조약에 초대하면 중부 유럽의 안정을 유지할 수 있으며 발칸으로 가는 길도 열릴 것입니다."
 POL_balkan_communists: "발칸 공산주의자"
 POL_balkan_communists_desc: "루마니아와 불가리아는 공산주의의 영향에 관해 사정이 다릅니다. 한편으로는 소련이 도입한 독재 체제를 가능한 한 빨리 잊고 싶어 하지만, 다른 한편으로는 정치인들 사이에 여전히 지지자가 많습니다. 그럼에도 발칸 반도에 영향력을 갖는 것은 가치가 있습니다."
 POL_baltic_plan: "발트 계획"
 POL_baltic_plan_desc: "스칸디나비아로 향하기 전에 발트 국가들에서 지지를 확보할 필요가 있습니다. 리투아니아, 라트비아, 에스토니아는 각각으로는 큰 세력이 아니지만 함께하면 우리에게 정말 유용할 수 있습니다."
 POL_secure_scandinavia: "스칸디나비아 확보"
 POL_secure_scandinavia_desc: "중립국 스웨덴과 핀란드는 만네르헤임 선을 되찾고자 합니다. 핀란드는 비교적 수월하겠지만, 오랫동안 중립을 지켜 온 스웨덴을 설득하는 일은 상당한 도전이 될 것입니다. 그래도 이들은 부유하고 군사적으로 강한 나라이므로 노력할 가치가 있습니다."
 POL_red_wave_of_the_europe: "유럽의 붉은 물결"
 POL_red_wave_of_the_europe_desc: "붉은 유럽 조약은 유럽에 최종적인 질서를 가져올 것입니다. 그러나 우리는 적을 선택해야 합니다. 러시아이거나 서유럽입니다."
 POL_convert_civilian_factories: "민간 공장 전환"
 POL_convert_civilian_factories_desc: "우리의 전쟁 산업은 중장비와 무기의 증산을 필요로 합니다. 민주 정당들은 부분적인 군축과 민간 산업에 지나치게 신경을 썼습니다. 강한 군대에 대한 사람들의 요구를 다시 일깨워야 합니다."
 POL_slask_coal_to_refineries: "실레지아 석탄을 정제소로"
 POL_slask_coal_to_refineries_desc: "석탄은 민간과 군대 모두에게 필요합니다. 그러나 풍력 발전기나 태양광 발전소와 같은 친환경 에너지가 인기를 얻고 있으므로, 석탄 에너지 일부를 무기 산업의 수요로 돌려도 기분 상할 사람은 없을 것입니다."
 POL_recalibrate_radars: "레이더 재보정"
 POL_recalibrate_radars_desc: "이전 정부가 군용 레이더를 어떻게 했는지 알 수 없지만, 평화에 너무 눈이 멀었던 것 같습니다. 레이더는 끊임없이 모든 위협을 탐색해야 합니다. 누군가 선전포고도 없이 언제 우리를 공격할지 알 수 없습니다. 아무도 믿지 마십시오."
 POL_wake_up_old_industry: "옛 산업의 재가동"
 POL_wake_up_old_industry_desc: "낡고, 방치되고, 주정뱅이와 고철 더미가 들끓는 곳. 이 버려진 공장들은 누군가 기계와 생산 라인을 재가동해 주기를 기다리고 있을 뿐입니다."
 POL_mass_production: "대량 생산"
 POL_mass_production_desc: "구식일 수는 있지만 효과적입니다. 대량 생산에 기반한 공산주의 산업이 우리가 할 수 있는 최선입니다. 2-3-4개년 계획을 가지고 놀 시간은 없습니다. 누가 그런 것에 신경 쓰겠습니까? 그것 없이도 우리는 괜찮을 것입니다."
 POL_control_everything: "모든 것을 통제"
 POL_control_everything_desc: "아이들이 공산주의의 단점이 아닌 장점을 배우도록 해야 합니다. 게다가 공산주의에는 단점이 없습니다. 이 모든 소문은 우리의 혁명을 믿지 않는 자들의 선전일 뿐입니다. 우리는 그들이 틀렸음을 납득시킬 것입니다."
 POL_private_security_for_politicians: "정치인 사설 경호"
 POL_private_security_for_politicians_desc: "우리의 혁명에 우리가 생각했던 것보다 더 많은 적이 있는 것으로 드러났습니다. 이에 대한 최선의 해결책은 물론 강화된 보호입니다! 국가가 자금을 대는 좌파 정치인 사설 경호원입니다. 이는 분명 국내 정치 정세를 진정시킬 것입니다."
 POL_watch_for_enemies_of_the_revolution: "혁명의 적 감시"
 POL_watch_for_enemies_of_the_revolution_desc: "정치인 암살 사건은 사람들을 보살핌 없이 내버려 둘 수 없음을 깨닫게 했습니다. 빅 브라더라는 개념은 이 나라의 모든 사람에게 익숙하므로, 일부 기업과 기관을 감시하기 시작해야 합니다."
 POL_big_brother_is_always_watching: "빅 브라더는 항상 지켜보고 있다"
 POL_big_brother_is_always_watching_desc: "미디어, 전화, 웹캠의 통제. 언제 감시당하고 있는지 아무도 알 수 없을 것입니다. 추가 공격이 일어나기 전에 막아야 합니다. 시민의 사생활 따위는 상관없습니다. 보호가 최우선입니다."
 POL_long_live_the_party: "당이여 영원하라!"
 POL_long_live_the_party_desc: "사람들은... 우리를 별로 신뢰하지 않습니다. 결국 놀랄 일도 아닙니다. 그러나 우리가 신연대와 싸우고 경제 위기를 통제한 것은, 어떤 테러리스트가 우리가 그토록 애써 이룬 모든 것을 파괴하도록 하기 위해서가 아닙니다."
 POL_secret_police_forces: "비밀경찰 부대"
 POL_secret_police_forces_desc: "이제 충분합니다! 엄격한 통제로도 어떤 정신병자가 우리 당의 정치인을 살해하는 것을 막지 못했습니다. 비밀경찰은 반역을 의심받는 모든 자를 제거할 것입니다."
 POL_soviet_doctrine: "소련 교리"
 POL_soviet_doctrine_desc: "소련의 모든 발명품이 나빴던 것은 아닙니다. 그들의 공세적 군사 교리는 제2차 세계 대전 중 완벽하게 작동했고 냉전 동안 NATO를 효과적으로 억제했습니다."
 POL_chinese_doctrine: "중국 교리"
 POL_chinese_doctrine_desc: "중국 교리는 방어에 더 중점을 두지만, 필요하다면 대규모 전쟁을 상정합니다. 그들의 해법을 활용할 수 있습니다."
 POL_introduce_the_new_order: "새 질서 도입"
 POL_introduce_the_new_order_desc: "우리는 마침내 오랫동안 기다려 온 경제 혁신을 도입할 준비가 되었습니다. 2개 부분으로 나뉜 6개년 계획을 도입하며 처음부터 시작할 것입니다. 2개년 계획과 4개년 계획입니다. 사실 어느 쪽을 먼저 택하는지는 중요하지 않지만, 가장 중요한 것은 이를 제때 끝내는 것입니다."
 POL_two_year_plan: "2개년 계획"
 POL_two_year_plan_desc: "2개년 계획은 더 공격적이고 빠른 경제 성장을 상정합니다. 그러나 무시할 수 없는 현실적 한계가 있으므로 우리의 투자는 다소 작아져야 합니다."
 POL_massive_industralization: "대규모 산업화"
 POL_massive_industralization_desc: "먼저 현 경제의 대대적인 개편부터 시작할 것입니다. 비용이 조금 들겠지만 매우 빠르게 결실을 맺을 것입니다."
 POL_farmers_league: "농민 연맹"
 POL_farmers_league_desc: "농민은 국가의 모든 경제 부문의 기반입니다. 그들의 노동과 그로부터 생산되는 식량이 없다면 어떤 나라도 발전할 수 없습니다. 우리는 그들에게 보답해야 합니다."
 POL_increased_social_spending: "사회 지출 증대"
 POL_increased_social_spending_desc: "우리는 단지 사람들을 달래고 국가를 안정시키기 위해 이렇게 하는 것입니다. 경제 발전이 최우선이어야 하지만, 순종적인 노동자가 없으면 경제는 매우 빠르게 정체될 것입니다."
 POL_change_of_education: "교육 개편"
 POL_change_of_education_desc: "가벼운 선전부터 시작하겠습니다. 젊은이들에게 민주주의가 실수였음을 납득시켜야 합니다."
 POL_food_for_ration_cards: "배급표 식량"
 POL_food_for_ration_cards_desc: "식량 배급표는 우리가 자원을 통제하는 것을 훨씬 쉽게 해 줄 것입니다. 그것은... 윽, 인민공화국 시절에도 통했으니 여기서도 통할 것입니다."
 POL_everything_for_everyone: "모두를 위한 모든 것"
 POL_everything_for_everyone_desc: "우리 경제는 정말 엄청난 진전을 이루었습니다. 우리가 유럽 최고임을 사람들에게 보여 주기 위해 가격을 낮출 준비가 되어 있습니다."
 POL_finish_the_six_year_plan: "6개년 계획 완수"
 POL_finish_the_six_year_plan_desc: "선전은 없었지만 우리는 6개년 계획을 완수할 준비가 되었습니다. 이 사업의 효과는 이미 눈에 띕니다."
 POL_four_year_plan: "4개년 계획"
 POL_four_year_plan_desc: "4개년 계획은 더 느리지만 더 효과적인 발전을 상정합니다. 우리는 대규모 투자를 하고 더 복잡한 법을 도입할 시간이 더 많습니다."
 POL_stable_growth: "안정적 성장"
 POL_stable_growth_desc: "2개년 계획과 달리, 우리 경제의 한계를 위험하게 늘릴 필요가 없습니다."
 POL_preparations_to_close_the_border: "국경 폐쇄 준비"
 POL_preparations_to_close_the_border_desc: "우리에게 민주주의 국가들과 무역할 의무는 없습니다. 상황이 충분히 안정되었다고 확신하면 국경 폐쇄를 준비할 것입니다."
 POL_closed_economy: "폐쇄 경제"
 POL_closed_economy_desc: "우리는 비공산주의 국가들과의 무역을 종료합니다. 일부 이국적인 상품이 부족할 수도 있지만, 최고의 것이 폴란드에 있는데 이국적인 것을 왜 사겠습니까?"
 POL_deepening_the_mines: "탄광 심화"
 POL_deepening_the_mines_desc: "무역을 제한하려면 국가의 에너지 안보를 보장해야 합니다. 탄광을 더 깊이 파면 더 큰 자원 매장지에 도달할 수 있습니다."
 POL_new_energy_laws: "새 에너지법"
 POL_new_energy_laws_desc: "에너지 안보의 두 번째 단계는 전력 생산에 관한 법의 개정을 수반합니다. 원자로를 통한 에너지 생산을 늘릴 것입니다."
 POL_coast_development: "해안 개발"
 POL_coast_development_desc: "사실 해안선을 조금 확장할 가치도 있습니다. 새로운 조선소는 더 많은 함선을 건조하고 해군을 더 효과적으로 발전시킬 수 있게 해 줄 것입니다."
 POL_socialdemocracy: "사회민주주의"
 POL_socialdemocracy_desc: "사회민주주의는 시민의 복지와 경제 사이의 균형을 유지하는 것을 목표로 하는 체제입니다. 정당마다 이 이념을 다르게 인식할 수 있지만, PPS는 본래의 전제를 고수합니다."
 POL_betray_the_communists: "공산주의자 배신"
 POL_betray_the_communists_desc: "일이 벌어졌습니다. 더 이상 ZKP-P 정치인들이 우리 오른편에 서서 선전을 퍼뜨리는 것을 용납할 수 없습니다. 그 영향이 돌이킬 수 없게 되기 전에 이 협력을 끝냅시다."
 POL_join_the_eurozone_communist: "유로존 가입"
 POL_join_the_eurozone_communist_desc: "우리가 유로존에 받아들여지는 데 걸림돌이 될 것은 없어야 합니다. 그러나 거절당하더라도 이해할 것입니다."
 POL_bring_back_new_solidarity: "신연대의 복귀"
 POL_bring_back_new_solidarity_desc: "신연대는 혁명 이후 폴란드가 어떤 모습일지를 처음부터 내다보았습니다. 안타깝게도 그들이 옳았습니다. 더 이상 정치범을 가둬 둘 수 없으며, 그들은 자유로울 자격이 있습니다."
 POL_solve_social_problems: "사회 문제 해결"
 POL_solve_social_problems_desc: "우리 행동의 대가를 치르기 전에, 우리가 제1차 혁명에 참여했던 시민들을 위한 가정과 약속 가운데 적어도 일부는 이행합시다."
 POL_ban_the_communism: "공산주의 금지"
 POL_ban_the_communism_desc: "공산주의는 폴란드로 돌아와서는 안 됩니다. 우리는 이 체제를 요구한 적이 없습니다. 처음에는 무력으로 강요되었고, 그다음에는 ZKP-P의 잔혹한 혁명으로 강요되었습니다. 이제 끝났습니다. 그들은 패배했고 우리가 승리했습니다."
 POL_set_up_the_new_government: "새 정부 수립"
 POL_set_up_the_new_government_desc: "대통령은 직위를 유지하겠지만, 누군가 ZKP-P 정치인들의 자리를 대신해야 합니다. 그들은 PO와 PiS 정당의 민주주의자들이 될 것입니다. 그들이 경쟁 관계인 것은 사실이지만 사회의 지지를 받고 있습니다."
 POL_disband_communist_army: "공산주의 군대 해산"
 POL_disband_communist_army_desc: "혁명가들이 얼마나 많은 무기를 모았는지 놀라울 정도입니다. 잠깐, 저건 헬리콥터인가?!"
 POL_multiparty_state: "다당제 국가"
 POL_multiparty_state_desc: "우리는 굴복해야 합니다. 우리는 권력을 유지하겠지만, PO와 PiS의 끊임없는 감독 아래에서만 가능합니다. 그들은 우리의 결정과 거래를 통제할 것입니다."
 POL_strict_control: "엄격한 통제"
 POL_strict_control_desc: "서방은 우리를 그렇게 쉽게 포기하지 않을 것입니다. EU와 NATO가 우리의 행동을 지켜볼 것입니다. 우리가 처신을 잘하면 그들의 공동체에 가입할 수도 있을 것입니다."
 POL_reach_out_to_the_usa: "미국에 손 내밀기"
 POL_reach_out_to_the_usa_desc: "혁명 동안 우리는 NATO를 떠나야 했습니다. 두 번째 혁명은 미국에게 다소 지나친 일이었습니다. 그러나 우리는 동맹에 복귀하려 노력할 것입니다."
 POL_invite_west_investors: "서방 투자자 초청"
 POL_invite_west_investors_desc: "이곳에 대한 투자가 여전히 수익성이 있음을 서방에 보여 주어야 합니다. 우리는 경제 불황에서 서서히 벗어나고 있으며, 투자자들의 도움은 분명 재건을 앞당길 것입니다."
 POL_nato_aspirant: "NATO 가입 희망국"
 POL_nato_aspirant_desc: "우리가 요건을 충족한다면 미국은 동맹 가입에 대한 우리의 희망을 받아들일 수 있습니다."
 POL_stay_with_the_communists: "공산주의자들과의 동행"
 POL_stay_with_the_communists_desc: "비록 견해가 조금 다르더라도 ZKP-P와 계속 협력해야 합니다. 새로운 공산주의에 대한 그들의 구상과 사회의 강력한 지지를 활용하면, 피할 수 없는 일에 대비할 수 있을 것입니다..."
 POL_improve_civilian_and_military_industry: "민간 및 군수 산업 개선"
 POL_improve_civilian_and_military_industry_desc: "먼저 경제에 집중해야 합니다. 4개년 계획을 통해 각 부문을 부분적으로 발전시키겠습니다."
 POL_improve_naval_industry: "해군 산업 개선"
 POL_improve_naval_industry_desc: "함선을 개선하고, 오랫동안 전쟁을 겪어 보지 못한... 아니, 한 번도 겪어 보지 못한 우리 선원들을 재훈련하면 좋을 것입니다."
 POL_develop_hi_tech_branch: "첨단 기술 부문 발전"
 POL_develop_hi_tech_branch_desc: "행정의 이 혼란을 마침내 통제 아래 두도록 합시다. 사무실을 개보수하고 현대적인 인터넷 기능을 사용하여 더 효율적으로 일하기 시작합시다."
 POL_upgrade_traditional_economy: "전통 경제 개선"
 POL_upgrade_traditional_economy_desc: "우리가 외교 계획을 실행하기 시작하면 일부 국가들이 우리에게서 등을 돌릴 수도 있습니다. 그래서 우리의 정유 시설이 훨씬 더 높은 효율로 가동될 수 있도록 해야 합니다."
 POL_modern_airforce_engineering: "현대 공군 훈련"
 POL_modern_airforce_engineering_desc: "자, 이제 항공입니다. 신형 제트기는 이전 세대와 매우 다릅니다. 주로 점점 더 현대화되는 기술 때문입니다. 조종사들을 훈련시켜 이러한 현대화 기능을 사용하는 법을 가르칠 것입니다."
 POL_stop_the_capitalism: "자본주의 중단"
 POL_stop_the_capitalism_desc: "우리는 당의 이념을 실행에 옮기기 시작합니다. 전국에서 자본주의의 역할을 제한합니다. 서방 투자자들은 이제 짐을 싸도 좋습니다. 민영화는 곧 끝나기 때문입니다."
 POL_limited_western_trust: "제한된 서방 신뢰"
 POL_limited_western_trust_desc: "미국이 우리의 활동을 면밀히 감시하고 있음은 널리 알려져 있습니다. 서방은 곳곳에 첩자를 두고 있으므로, 서부 국경에 규제와 제한을 도입할 것입니다. 독일에서 우리 몰래 들어오는 사람은 아무도 없을 것입니다."
 POL_limited_censorship: "제한적 검열"
 POL_limited_censorship_desc: "일부 사람들은 민영화에 대한 우리의 결정에 확신하지 못합니다. 자본주의가 좋지 않다는 것을 사람들에게 납득시킬 것입니다."
 POL_two_sided_face: "두 얼굴"
 POL_two_sided_face_desc: "우리가 진정으로 혁명에 가담한 목적을 실행에 옮기기 시작할 때입니다. ZKP-P와 협력함으로써 유럽에 최종 질서를 도입하기 위한 준비를 숨길 수 있을 것입니다. 붉은 유럽의 시대가 가까워졌습니다."
 POL_antagonize_west: "서방과의 적대"
 POL_antagonize_west_desc: "진짜 위협은 NATO입니다. 러시아가 자신의 이익을 추구하도록 내버려 둡시다."
 POL_antagonize_east: "동방과의 적대"
 POL_antagonize_east_desc: "NATO는 방어 동맹입니다. 그러나 러시아는 끊임없이 다른 국가들을 압박합니다. 핀란드는 만네르헤임 선을 되찾고자 하므로, 이 약속을 이행할 기회를 만들어 줍시다."
 POL_new_social_program_communist: "새 사회 프로그램"
 POL_new_social_program_communist_desc: "ZKP-P의 공산주의자들은 어째서인지 국가의 군사화를 강조합니다. 사실 왜일까요? 누구도 우리를 위협하지 않으며, 대외 영향력부 덕분에 국제 무대에서의 입지도 커지고 있습니다. 우리는 목표를 계속 추진하며 국가의 경제 상황을 개선할 것입니다."
 POL_tax_cut: "감세"
 POL_tax_cut_desc: "민주주의자들은 쓸모없는 세금을 잔뜩 만들어 내기를 좋아했습니다. 이를 최소한으로 줄이고 약간 낮추겠습니다."
 POL_nfz_donation: "NFZ 기부"
 POL_nfz_donation_desc: "먼저 보건 의료에 집중해야 합니다. 국민건강기금은 병원과 보건 의료에 대한 우리의 주된 투자처입니다."
 POL_zus_reform: "ZUS 개혁"
 POL_zus_reform_desc: "ZKP-P가 일으킨 혁명은 행정에 혼란을 초래했습니다. 공산주의자들은 이 혼란을 수습하려 하지 않으므로 그 책임은 우리에게 돌아옵니다."
 POL_wealthy_state: "부유한 국가"
 POL_wealthy_state_desc: "우리가 도입하는 개혁이 국가의 경제 상황을 개선하고 있다는 사실은 우리를 결의로 가득 채웁니다."
 POL_fund_social_institutions: "사회 기관 자금 지원"
 POL_fund_social_institutions_desc: "다른 기관들도 어떻게든 쇄신해야 합니다. 여기저기 약간의 자금을 투입하면 모든 것이 잘될 것입니다."
 POL_new_police_equipment: "새 경찰 장비"
 POL_new_police_equipment_desc: "경찰관들은 무기를 사용하는, 아니 사실상 사용하지 않는 매우 복잡한 절차를 따릅니다. 범죄자들은 경찰에게서 도망치는 것이 훨씬 더 심각한 결과를 가져올 수 있음을 알아야 합니다."
 POL_control_the_new_solidarity_protestants: "신연대 시위대 통제"
 POL_control_the_new_solidarity_protestants_desc: "신연대는 계속해서 우리를 곤란하게 하고 있습니다. 바웬사가 정치범인 것은 사실이지만, 그의 지지자들은 계속 사람들을 선동하고 있습니다."
 POL_introduce_the_new_law: "새 법 도입"
 POL_introduce_the_new_law_desc: "사람들은 민주주의의 평화와 질서에 익숙해졌습니다. 공산주의에는 반대자가 많으며 우리는 법을 새로운 위협에 맞게 조정해야 합니다."
 POL_fight_unemployment: "실업과의 싸움"
 POL_fight_unemployment_desc: "혁명은 많은 사람들을 실직 상태로 남겼습니다. 공장주들은 직원들이 우리의 시위를 지지했다는 사실을 좋아하지 않았습니다. 우리는 이 사람들을 원래 자리로 복직시킬 것입니다."
 POL_workers_unions: "노동조합"
 POL_workers_unions_desc: "새로 고용된 직원들은 고용주에게 부당한 대우를 받고 있습니다. 진정한 힘은 고용주가 아니라 노동자에게 있음을 그들에게 보여 줍시다."
 POL_media_censorship: "미디어 검열"
 POL_media_censorship_desc: "미디어를 통제하는 일은 전혀 문제가 되지 않습니다. ZKP-P가 이를 도와줄 것이며, 그들에게도 이해관계가 있음을 우리는 알고 있습니다. 다만 전쟁에 대한 그들의 열정만이 우리를 불안하게 하지 않을 뿐입니다."
 POL_industry_reform: "산업 개혁"
 POL_industry_reform_desc: "공산주의자들의 설득에 따라 경제에 몇 가지 변화를 도입할 것입니다. 사실 우리는 새로운 4개년 계획을 시작했습니다."
 POL_socialcapitalism: "사회 자본주의"
 POL_socialcapitalism_desc: "자본주의가 전적으로 좋은 것은 아니지만 언제나 타협점은 있습니다. 자본주의의 일부 특징은 긍정적입니다. 이를 사회주의와 결합한다면 정말 좋은 무언가가 나올지도 모릅니다."
 POL_nato_is_the_enemy: "NATO는 적이다"
 POL_nato_is_the_enemy_desc: "서방은 끊임없이 영향력을 넓히려 합니다. 다행히 대평의회는 그들의 움직임을 예측했고, 우리는 유럽에서 미국의 영향력을 제한하는 우리만의 세력을 창설했습니다. 이제 첫걸음을 내디딜 때입니다."
 POL_minor_threats_first: "작은 위협부터"
 POL_minor_threats_first_desc: "독일이나 이탈리아로 나아가기 전에, 가능한 한 최대의 효율로 공격하기 위해 전략 지역을 점령해야 합니다. 오스트리아는 독일과 이탈리아 모두로 가는 통로를 제공할 것입니다. 발칸은 그리스와 튀르키예의 개입을 막아 줄 것입니다."
 POL_surround_germany: "독일 포위"
 POL_surround_germany_desc: "오스트리아는 독일과 꽤 좋은 국경을 이루고 있습니다. 산악 지대이긴 하지만, 공격할 수 있는 추가적인 거점이 되는 것은 분명합니다."
 POL_stop_swiss_neutrality: "스위스 중립 종식"
 POL_stop_swiss_neutrality_desc: "스위스는 너무 오래 중립을 유지했으며, 스위스를 정복하면 프랑스와의 전쟁 중 산악 지대에서 싸우는 일을 피할 수 있습니다."
 POL_take_west_balkans: "서발칸 점령"
 POL_take_west_balkans_desc: "루마니아와 불가리아는 대평의회의 소관이지만, 구 유고슬라비아 국가들은 우리의 문제입니다. 두 단계로 나누어 해결할 것입니다."
 POL_finish_yugoslavia: "유고슬라비아 마무리"
 POL_finish_yugoslavia_desc: "세르비아와 그리스와 접한 국가들을 정복함으로써 유고슬라비아 문제를 끝낼 수 있습니다. 우리는 발칸 전역을 지배할 것입니다."
 POL_expand_the_army: "군대 확장"
 POL_expand_the_army_desc: "주요 목표로 나아가기 전에 우리 군대를 강화해야 합니다. NATO가 협정을 지켜 이 국가들을 보호할지는 확신할 수 없지만, 만약 그렇다면 대비해 두는 편이 낫습니다."
 POL_prepare_for_the_big_one: "대전을 대비하라"
 POL_prepare_for_the_big_one_desc: "대확장 이전의 마지막 준비 단계입니다. 유럽의 긴장은 정말 높지만, 붉은 물결을 막을 수 있는 것은 아무것도 없습니다."
 POL_revenge_on_germany: "독일에 대한 복수"
 POL_revenge_on_germany_desc: "독일은 마침내 제2차 세계 대전의 대가를 치를 것입니다. 세계는 그들을 용서했고 민주주의자들도 그랬지만, 우리는 아닙니다. 공산주의는 어느 나라의 민주주의든 결코 좋아한 적이 없습니다."
 POL_conquer_italy: "이탈리아 정복"
 POL_conquer_italy_desc: "이탈리아 마피아와 협력하여 새 정부를 유지하는 데 도움을 받을 수 있습니다. 마피아에게 특별한 특권을 부여하면 즉시 안정이 찾아오고 또 하나의 위협이 제거될 것입니다."
 POL_dominate_france: "프랑스 지배"
 POL_dominate_france_desc: "영국에 진입하기 전에 영국 해협 남쪽 해안을 점령해야 합니다. 영국은 강력한 해군을 보유하고 있지만, 우리에게 불가능한 일은 없습니다."
 POL_conquer_unconquerable: "정복 불가능한 곳을 정복"
 POL_conquer_unconquerable_desc: "나폴레옹도 해내지 못했고, 히틀러도 해내지 못했습니다. 삼세번입니다. 영국은 공산주의의 무게 아래 무너질 것입니다."
 POL_csto_is_the_enemy: "CSTO는 적이다"
 POL_csto_is_the_enemy_desc: "NATO는 유럽 정복을 목표로 하지 않습니다. 그러나 러시아의 정책은 다소 더 공격적이므로, 우리는 유럽을 지키는 파수꾼이 되어 이 영원한 위협을 단번에 처리할 것입니다."
 POL_get_closer_to_moscow: "모스크바에 가까이"
 POL_get_closer_to_moscow_desc: "안타깝게도 모스크바는 꽤 멀리 떨어져 있으며 우리는 너무 긴 전쟁을 감당할 수 없습니다. 그래서 먼저 우크라이나를 정복할 것입니다."
 POL_prepare_for_the_giant: "거인에 대비"
 POL_prepare_for_the_giant_desc: "러시아 침공은 쉽지 않을 것입니다. 길고 파괴적인 전쟁에 철저히 대비해야 합니다."
 POL_belarusian_strategy: "벨라루스 전략"
 POL_belarusian_strategy_desc: "벨라루스는 지형이 꽤 평탄합니다. 이들에게 현대식 전격전을 구사한 뒤 모스크바로 나아갈 것입니다."
 POL_winter_acclimatization: "고급 동계 적응"
 POL_winter_acclimatization_desc: "우리 병사들에게 정말 따뜻한 옷을 지급하면 좋을 것입니다. 러시아는 대부분이 얼음의 땅입니다. 모스크바 인근에서 실패해서는 안 됩니다."
 POL_moscow_march: "모스크바 진군"
 POL_moscow_march_desc: "우리는 마침내 군주제를 따랐던 선조들의 위업을 되풀이할 기회를 얻었습니다. 모스크바를 다시 한번 정복합시다. 다만 이번에는 폴란드 국경에 영구히 병합할 것입니다. 이제 우리의 것을 되찾을 때입니다!"
 poland.9.c: "지금은 더 중요한 일이 있다!"
 poland.73.t: "§C자유 노조 세력§! 감소!"
 poland.73.d: "공산주의 혁명가들이 경찰의 지지를 얻은 이후, 레흐 바웬사가 이끄는 신 자유 노조 활동가들의 세력이 다소 약해졌습니다. 공산주의자들이 사용한 급진적인 방식과 위협은 국가 안정도에 부정적인 영향을 미쳤고 현 집권당에 대한 지지가 높아지는 데 기여했습니다. 이제 공산주의자들은 지지를 얻기 위해 더 노력해야 합니다."
 poland.73.a: "더 나을 수도 있었다"
 poland.74.t: "§R공산주의 지배력§! 증가!"
 poland.74.d: "공산주의자들은 당국이 자신들의 혁명을 지지하도록 설득하는 데 성공했습니다. 부패한 경찰들 덕분에 이들은 소도시와 마을에서 시위를 벌이고 선전을 퍼뜨릴 수 있습니다."
 poland.74.a: "멋진 소식이군!"
 poland.75.t: "§G경제 상태§! 증가!"
 poland.75.d: "당국을 매수하려는 시도는 예상치 못한 결과를 가져왔습니다. 경찰 활동이 갑작스럽게 증가하면서 시장이 교란되었고 인플레이션이 소폭 상승했습니다."
 poland.75.a: "젠장"
 poland.76.t: "§C자유 노조 세력§! 감소!"
 poland.76.d: "군 장성들을 매수하려던 시도가 인터넷에 유출되었습니다. 공산주의자들이 혐오의 물결에 직면했음에도, 이전 정부에 충성하는 장교들이 있었고 이들이 적색 혁명을 공개적으로 지지하면서 바웬사의 인기가 타격을 입었습니다."
 poland.76.a: "또냐?!"
 poland.77.t: "§R공산주의 지배력§! 증가!"
 poland.77.d: "군은 적색 혁명을 지지했으며 현 정부에 복종하기를 거부했습니다. 그러나 레흐 바웬사의 저항 운동은 포기하지 않고 여전히 위협으로 남아 있습니다. 폴란드에 시위할 권리가 존재하는 한, 현 정부는 이를 존중할 것입니다. 특히 정부가 신 자유 노조에서 공산주의자들을 진정시킬 희망을 보고 있기 때문입니다."
 poland.77.a: "잘했다, 동지들!"
 poland.78.t: "§G경제 상태§! 증가!"
 poland.78.d: "공산주의자들과 신 자유 노조 사이의 끊임없는 긴장이 폴란드 경제를 약화시켰습니다. 경제가 불안정해지고 있으며 유럽 국가들은 우리의 재정 안정성을 의심하기 시작했습니다."
 poland.78.a: "젠장"
 poland.79.t: "§C자유 노조 세력§! 증가!"
 poland.79.d: "신 자유 노조는 정부와 협력하여 주요 기관 앞에서 성공적인 시위를 벌였습니다. 레흐 바웬사는 공산주의의 결점을 사람들에게 효과적으로 상기시키고 민주주의를 계속 장려하도록 독려했습니다."
 poland.79.a: "꺼져라, 바웬사!"
 poland.80.t: "§C자유 노조 세력§! 증가!"
 poland.80.d: "공산주의자들에 대한 지지가 갑자기 늘어난 것을 우려한 신 자유 노조는 다시 거리로 나서기로 했으며, ChDRP 부대표인 스타니스와프 이와니츠키라는 정치인은 공영 방송에서 진행자들에게 폴란드 인민공화국 시절의 빈곤을 보여 주는 사진을 제시했습니다. 민주주의를 지지하는 사람들이 그들의 시위를 지지하기 시작했습니다."
 poland.80.a: "왜 사람들이 그를 신경 쓰는가?!"
 poland.81.t: "예기치 못한 유출!"
 poland.81.d: "공산주의자들의 움직임을 보도하는 임무를 맡은 TVP 기자들이 집권당 의원 한 명에게 뇌물이 전달되었음을 포착했습니다. 해당 정치인은 체포되었으며 이 사건에 대한 수사에서 14건의 추가 뇌물 사건이 드러났습니다. 이 모든 사건이 그 시점에 공개되어 정치인들이 체포되었고, 공산주의자들은 대통령으로부터 공개적으로 비난받았습니다."
 poland.81.a: "더 조심해야 한다"
 poland.82.t: "§G경제 상태§! 증가!"
 poland.82.d: "국가 경제가 갑자기 약화되었습니다. 사람들은 이를 공산주의자들과 신 자유 노조가 일으킨 비밀 행동 탓으로 돌리기 시작했지만, 이러한 비난을 뒷받침할 증거는 발견되지 않았습니다."
 poland.82.a: "경제는 이를 이겨낼 것이다"
 poland.83.t: "§R공산주의 지배력§! 증가!"
 poland.83.d: "많은 정치인이 갑자기 공산주의 사상을 찬양하기 시작했으며, 세임과 상원의 동료들에게도 의견을 공유하도록 독려하고 있습니다. 공산주의자들이 그들에게 무엇을 했는지는 알려지지 않았지만, 많은 사람이 자신의 정치적 우상을 지지하기 시작했습니다."
 poland.83.a: "큰 변화가 다가오고 있다"
 poland.84.t: "§R쿠데타 발각§!!"
 poland.84.d: "대통령의 경호원들이 공격자들의 현 정부 전복 시도를 저지했습니다. 암살을 꾀한 자들은 체포되어 심문을 받았습니다. 이들은 공산주의자들을 위해 일해 왔으며 혁명 지도부의 명령에 따라 공격을 감행하려 했다고 자백했습니다. 신 자유 노조는 활동 강화를 선언했고, 공산주의자들은 제1의 공공의 적으로 지목되었습니다. 혁명 지도자들에 대한 체포 영장도 발부되었습니다."
 poland.84.a: "위험은 알고 있었다"
 poland.85.t: "§R공산주의자들, 정부 전복§!!"
 poland.85.d: "오늘 [GetDateText]에 공산주의자들이 쿠데타를 일으켰습니다. 혁명가들은 자신들에게 부정적이었던 대통령과 정치인들을 살해했습니다. 정부는 혼란에 빠졌고, 신 자유 노조는 거리에서 폭동을 일으키며 공산주의자들에 맞서 무장 투쟁에 나섰습니다. 폭동이 매우 심각하여 내전으로 번질 수도 있습니다!"
 poland.85.a: "해냈다, 동지들!"
 poland.86.t: "§R공산주의 지배력§! 감소!"
 poland.86.d: "대통령 암살 시도가 실패하면서 사람들은 공산주의자들에 대한 지지를 거두었습니다. 그럼에도 일부 장성은 여전히 그들의 이념에 충성하고 있습니다. 공산주의자들이 아직 마지막 말을 하지 않았을 가능성이 있습니다."
 poland.86.a: "젠장"
 poland.87.t: "집권당 선택"
 poland.87.d: "ZKP \\"프롤레타리아트\\"는 노동자에 의한 권력 장악과 생산 수단 및 사회 복지의 사회화를 지지합니다. PPS는 사익과 공익 사이의 균형을 유지하고자 하며, 기업이 직원의 복지와 환경에 대해 책임져야 한다고 믿습니다."
 poland.87.a: "ZKP와 함께하겠다!"
 poland.87.b: "PPS가 우리를 이끌 것이다!"
 poland.88.t: "§R공산주의 지배력§! 증가!"
 poland.88.d: "쿠데타 실패 이후 공산주의자들은 군의 지지를 되찾는 데 성공했으며, 이는 신 자유 노조의 지도자 레흐 바웬사로부터 비판을 받았습니다. 시위대는 인터넷과 주요 정치·군사 건물 앞에서 폴란드군의 충성심에 의문을 제기하기 시작했습니다."
 poland.88.a: "아주 좋다"
 poland.89.t: "정부, 공산주의자들의 제안 거부"
 poland.89.d: "공산주의자들은 정부에 퇴진하여 권력을 자신들에게 넘길 것을 요구했습니다. 대통령은 제안을 거부하고 누구도 그 주제를 다시 꺼내지 못하도록 금지했습니다."
 poland.89.a: "더 급진적인 방안을 택할 때다"
 poland.90.t: "굴복한 정부"
 poland.90.d: "정부는 공산주의자들에게 권력을 넘기기로 결정했습니다. 무엇이 정부로 하여금 그러한 결정을 내리게 했는지는 알려지지 않았지만, 결코 자발적으로 내린 결정은 아닐 것입니다."
 poland.90.a: "잘되었다"
 poland.91.t: "대통령, 암살 시도에서 생존"
 poland.91.d: "지난밤 신원 미상의 공격자들이 대통령과 총리를 포함한 가장 충성스러운 정치인들을 살해하려 했습니다. 암살 시도자들은 도주에 성공했습니다. 신원은 알 수 없으나 모든 시선이 공산주의자들에게 쏠려 있습니다."
 poland.91.a: "적어도 그들은 아무것도 모른다"
 poland.92.t: "국민, 바웬사를 신뢰"
 poland.92.d: "하나의 연합으로 단일 정당을 도입하려는 시도는 성공하지 못했습니다. 바웬사는 지금이 공산주의자들을 타도할 마지막 순간이라고 선언했으며, 이는 민주주의에 충성하고 기업 민영화로 이익을 얻는 정치인과 기업인들의 지지를 받았습니다."
 poland.92.a: "멍청이들"
 poland.93.t: "공산주의자들, 일당 국가 선포"
 poland.93.d: "공산주의자들이 방금 일방적으로 일당 국가를 선포했습니다. 정부에 남은 정당은 한동안 서로 협력해 온 ZKP-P와 PPS뿐입니다. 공산주의자들이 권력을 내려놓지 않는다면 혁명 없이는 폴란드 민주주의의 완전한 종말을 의미할 수 있습니다."
 poland.93.a: "마침내"
 poland.94.t: "바웬사, 계속 활동"
 poland.94.d: "공산주의자들의 비난과 레흐 바웬사 체포 시도에도 불구하고, 국민의 지지 덕분에 그는 여전히 당국을 피하며 야권 활동을 이어 가고 있습니다."
 poland.94.a: "이제 그만 포기해라"
 poland.95.t: "공산주의 혁명 종결"
 poland.95.d: "공산주의자들은 정부를 자기 사람들로 채웠고, 마침내 의회와 모든 국가 기관의 권력을 장악했습니다. 군, 경찰, 정보 기관, 민간 기관 모두 적색 세력의 손에 들어갔습니다. 혁명은 끝났으며 공산주의자들은 국가 경제를 바꾸는 작업에 착수하고 있습니다."
 poland.95.a: "해냈다!"
 poland.96.t: "[POL.GetName], 공산주의 이념 전파를 대가로 산업 원조 제안"
 poland.96.d: "폴란드 공산주의 정부는 우리나라에 공산주의를 전파하는 대가로 경제 원조를 제안했습니다. 폴란드가 신규 공장 건설 비용 전액을 부담하지만, 우리는 친공산주의 선전 운동을 시작해야 합니다."
 poland.96.a: "좋다"
 poland.96.b: "공산주의자는 안 된다"
 poland.97.t: "[POL.GetName], 공산주의 이념 전파를 대가로 산업 원조 제안"
 poland.97.d: "폴란드 공산주의 정부는 우리나라에 공산주의를 전파하는 대가로 경제 원조를 제안했습니다. 폴란드가 신규 공장 건설 비용 전액을 부담하지만, 우리는 친공산주의 선전 운동을 시작해야 합니다."
 poland.97.a: "좋다"
 poland.97.b: "공산주의자는 안 된다"
 poland.98.t: "[CZE.GetName], 산업 원조 수락"
 poland.98.d: "체코 정부는 경제 원조 제안을 수락했습니다."
 poland.98.a: "니스"
 poland.99.t: "[SLO.GetName], 산업 원조 수락"
 poland.99.d: "슬로바키아 정부는 경제 원조 제안을 수락했습니다."
 poland.99.a: "니스"
 poland.105.t: "새로운 후보"
 poland.105.d: "우리는 새로운 국가와 동맹을 확장할 준비가 되어 있습니다. 그러나 그들에게 너무 많은 자유를 주어서는 안 됩니다. 우리가 그들에 대한 완전한 통제권을 가지는 편이 낫습니다."
 poland.105.a: "그들을 초청하라!"
 poland.105.b: "그들을 괴뢰국으로 삼아라!"
 poland.106.t: "[POL.GetName], 우리를 [POL.GetFactionName]에 초청"
 poland.106.d: "효과적인 선전 활동을 거친 끝에, 폴란드 정부는 우리가 민주주의 가치를 버린다는 조건으로 우리나라를 동맹에 초청할 준비가 되었습니다."
 poland.106.a: "가입하겠다!"
 poland.106.b: "말도 안 돼"
 poland.107.t: "[POL.GetName], 우리의 복종 요구"
 poland.107.d: "공산주의 폴란드는 영향력을 확대하려 합니다. 우리나라는 보호를 대가로 주권을 포기하라는 요구를 받았습니다."
 poland.107.a: "그들이 우리를 지켜 줄 것이다"
 poland.107.b: "미친 것 아닌가?!"
 poland.114.t: "[POL.GetName], 레일 발티카 개선 희망"
 poland.114.d: "공산주의 폴란드는 영향력을 확대하려 합니다. 우리나라는 공산당의 영향력을 높여 주는 대가로 레일 발티카를 개선하자는 제안을 받았습니다."
 poland.114.a: "좋다"
 poland.114.b: "괜찮다"
 poland.117.t: "[FROM.GetName], 레일 발티카 확장 수락"
 poland.117.d: "[FROM.GetAdjective] 정부는 레일 발티카 철도 노선 확장의 대가로 공산당을 지원하기 시작했습니다."
 poland.117.a: "좋아"
 poland.118.t: "[FROM.GetName], 레일 발티카 확장 거부"
 poland.118.d: "[FROM.GetAdjective] 정부는 우리의 영향력 확대를 지지하지 않습니다. 그들은 자국 내 레일 발티카 확장을 거부했습니다."
 poland.118.a: "으음"
 poland.144.t: "프라하-부다페스트 행진"
 poland.144.d: "공산주의 지지자들이 우리의 이념을 알리는 행진을 조직했습니다. 참가자들은 우리의 구호와 선전을 외쳤고, 비셰그라드 그룹 국가들에서 활동하는 우리 요원들은 아무도 이들을 방해하지 못하도록 조치했습니다."
 poland.144.a: "니스"
 poland.145.t: "혼란에 빠진 소셜 미디어"
 poland.145.d: "발트 국가들에서 어나니머스 회원을 자처하는 해커 집단이 정부와 정보 웹사이트에 우리의 구호를 퍼뜨리기 시작했습니다. 유출은 이미 차단되었지만, 이를 통해 우리가 많은 지지자를 얻었다는 사실은 변하지 않습니다."
 poland.145.a: "훌륭하군!"
 poland.146.t: "정치권의 주도"
 poland.146.d: "불가리아에서는 몇몇 정치인이 새로운 형태의 공산주의로 우리가 사용하는 방식을 갑자기 칭송하기 시작했습니다. 지금까지 침묵하던 루마니아의 상원 의원들도 이 정치인들을 옹호하고 나섰습니다. 우리는 정부 안에도 지지자가 있음을 보여 주었고, 이는 이들에게 투표하는 사람들 사이에서 우리의 지지로 이어졌습니다."
 poland.146.a: "훌륭한 사람들이다!"
 poland.148.t: "ZKP-P 정치인 피살!"
 poland.148.d: "공산당 ZKP-P의 활동가가 오늘 아침 바르샤바 거리를 자동차로 이동하던 중 총격을 받았습니다. 살인범은 범행 현장에서 도주하는 데 성공했으며, 경찰은 이 끔찍한 범죄를 누가 저질렀는지 단서가 없어 속수무책입니다."
 poland.148.a: "후회하게 될 것이다!"
 poland.149.t: "ZKP-P 정치인 또다시 피살!"
 poland.149.d: "또 다른 ZKP-P 정치인이 총격을 받았습니다. 정부는 이러한 일이 다시는 일어나지 않도록 적절한 조치를 취하겠다고 장담했습니다. 이전의 탄압과 제한을 고려하면, 이는 폴란드 국민에 대한 감시가 더욱 강화됨을 의미할 수 있습니다."
 poland.149.a: "이제 끝이다!"
 poland.150.t: "공장 노동자들, 자금 지원 요청"
 poland.150.d: "공장 노동자들이 더 많은 자금 지원을 요청하고 있습니다. 이들은 지나치게 낮은 최저 임금을 호소하며 임금 인상을 요구합니다."
 poland.150.a: "환영한다"
 poland.150.b: "관심 없다"
 poland.151.t: "행정 직원들, 근무 환경 불만 제기"
 poland.151.d: "행정 직원들이 과도한 업무량에 대해 불만을 제기했습니다. 우리의 최근 혁명과 민주주의 전복으로 사무실에는 진정한 혼란이 생겼습니다."
 poland.151.a: "좋다"
 poland.151.b: "더 큰 문제가 있다"
 poland.152.t: "전직 자본가들, 새 체제에 불만 제기"
 poland.152.d: "민주주의 성향의 자본가들이 민영화 청산 절차를 이유로 자신들의 공장에서 일하기를 거부하고 있습니다. 기업가들은 새 법의 수정을 요구하고 있습니다."
 poland.152.a: "내버려 두자"
 poland.152.b: "이것은 공산주의이지 민주주의가 아니다"
 poland.153.t: "대통령궁에서의 긴급 회의"
 poland.153.d: "PPS 지도부가 자유 선거를 유지하기로 결정함에 따라, ZKP-P당의 공산주의자들은 바르샤바 대통령궁에서 긴급 회의를 열겠다고 발표했습니다. 회담의 주제가 무엇이었는지는 알려지지 않았지만, ZKP-P 정치인들은 그다지 만족한 표정이 아니었습니다. 자유 선거의 유지는 집권 PPS가 취할 예상치 못한 변화의 시작일 뿐일 수도 있습니다."
 poland.153.a: "그들의 혁명 따위는 집어치워라!"
 poland.154.t: "공산주의자들, PPS에 경고"
 poland.154.d: "PPS는 서유럽과의 관계를 점차 복원하고 있으며, 이는 ZKP-P의 공산주의자들을 불쾌하게 하는 것으로 보입니다. 이들은 [폴란드어에서 번역] 다음과 같은 특별 성명을 발표했습니다. \\"폴란드에서 공산주의는 안전하며, 우리의 혁명을 믿었던 모든 이는 평안히 잠들어도 좋다. 민주주의는 폴란드로 돌아오지 않을 것이다!\\" PPS는 ZKP-P 정치인들의 발언에 대해 어떠한 입장도 밝히지 않았습니다. 곧 이 두 정당 사이에 더 큰 갈등이 벌어질 것으로 추측됩니다."
 poland.154.a: "이 나라를 통치하도록 혁명가들이 선택한 것은 그들이 아니라 우리다!"
 poland.155.t: "ZKP-P, PPS에 도전!"
 poland.155.d: "ZKP-P의 공산주의자들은 PPS가 민주주의 서유럽을 인정하는 사회민주주의 노선을 즉시 포기하지 않으면 다시 폴란드 거리로 나서겠다고 위협했습니다. 이들은 지난 혁명 동안 충분한 지지를 모았기 때문에 이번에는 '유치한 속임수'를 쓰지 않고 곧바로 무장 혁명에 나서겠다고 발표했습니다. 그러나 PPS는 이러한 발언을 우려하지 않는 듯합니다. 대통령은 이 사안 전반에 관해 [폴란드어에서 번역] 이렇게 말했습니다. \\"우리는 ZKP-P의 공산주의자들이 민주주의보다 폴란드에 더 나은 미래를 보장할 것이라고 생각한 것이 잘못이었다. 우리는 첫 번째 혁명이 일어나고 얼마 지나지 않아, 그것이 국가에 미친 파괴적인 영향을 목격하며 이를 깨달았다. 우리는 ZKP-P를 두려워하지 않는다. 우리는 자유로운 폴란드를 위해 싸울 것이다!\\""
 poland.155.a: "내전에 뛰어들 필요는 없다. 하지만 그들을 막을 수는 없다..."
 poland.156.t: "(AI 사건)"
 poland.156.d: "(AI 사건)"
 poland.156.a: "(AI 사건)"
 poland.157.t: "ZKP-P, 전략 목표물 요새화"
 poland.157.d: "공산주의자들은 공장과 정유 시설을 포함한 도시와 전략 목표물을 요새화하기 시작했습니다. 이들은 자원에 대한 접근권을 잃을 의사가 없습니다. PPS 지도부는 자국 영토에서 새로운 전투 교리를 도입할 준비가 되어 있습니다."
 poland.157.a: "항복하지 않겠다!"
 poland.158.t: "(AI 사건)"
 poland.158.d: "(AI 사건)"
 poland.158.a: "(AI 사건)"
 poland.159.t: "공산주의자들, 공세 개시!"
 poland.159.d: "공산주의자들은 전쟁 교리를 공격적인 공세로 전환했습니다. 이로써 그들의 방어력은 약해졌지만 우리의 상황은 여전히 매우 불안정합니다. 우리가 아무것도 하지 않는다면 곧 더 많은 폭동이 일어날 수 있습니다."
 poland.159.a: "국가 안정화에 집중하라!"
 poland.159.b: "벙커를 보강하라!"
 poland.160.t: "(AI 사건)"
 poland.160.d: "(AI 사건)"
 poland.160.a: "(AI 사건)"
 poland.161.t: "PPS를 지지하는 루블린!"
 poland.161.d: "루블린 시민들은 내전에서 싸우는 병사들을 위해 모든 것을 빼앗아 도시를 파괴하는 공산주의 정권에 항의하며 거리로 나섰습니다. 시민들은 더는 참을 수 없었고, 경찰력과 협력하여 공산주의자들에 맞서 무장 봉기를 일으켰습니다!"
 poland.161.a: "멋진 소식이군!"
 poland.162.t: "사회민주주의 폴란드, 우리의 도움 요청"
 poland.162.d: "내전에 빠진 폴란드는 서유럽과 중유럽 국가들 및 미국에 도움을 구하고 있으며, 사회민주주의 성향의 PPS가 공산주의자들과의 전쟁에서 승리할 수 있도록 장비를 지원해 주기를 기대하고 있습니다."
 poland.162.a: "알겠다"
 poland.162.aa: "도울 수 없다"
 poland.162.b: "알겠다"
 poland.162.bb: "도울 수 없다"
 poland.162.c: "알겠다"
 poland.162.cc: "도울 수 없다"
 poland.162.dd: "알겠다"
 poland.162.ddd: "도울 수 없다"
 poland.162.e: "알겠다"
 poland.162.ee: "도울 수 없다"
 poland.162.f: "알겠다"
 poland.162.ff: "도울 수 없다"
 poland.162.g: "알겠다"
 poland.162.gg: "도울 수 없다"
 poland.163.t: "ZKP-P 공산주의자들, 패배!"
 poland.163.d: "ZKP-P당 당원 전원이 체포되었고 내전은 PPS의 승리로 끝났습니다! 시민들은 위협을 느끼지 않고 거리에 나설 수 있게 되었으며, 불충한 장성들은 평생 병역 수행과 무기 소지가 금지되었습니다. 이들 중 다수는 재판을 기다리고 있기도 합니다. 전쟁은 끝났고 국가는 안정을 되찾고 있습니다."
 poland.163.a: "승리!"
 poland.164.t: "폴란드, 유로존 가입 요청"
 poland.164.d: "얼마 전 EU에 가입한 사회민주주의 폴란드가 유로존 가입을 요청하고 있습니다."
 poland.164.a: "좋다"
 poland.164.b: "공산주의 사태가 있었는데? 안 된다"
 poland.165.t: "유로존 가입 거부"
 poland.165.d: "EU 지도자들은 폴란드의 유로존 가입에 만장일치로 동의하지 않았으며, 따라서 폴란드는 가입할 수 없습니다."
 poland.165.a: "시도해 볼 만했다"
 poland.166.t: "폴란드, 유로존 가입"
 poland.166.d: "EU 지도자들은 폴란드의 유로존 가입을 승인하기로 합의했습니다."
 poland.166.a: "좋아"
 poland.167.t: "사회민주주의 폴란드, 나토 복귀 가능성 요청"
 poland.167.d: "PPS가 이끄는 폴란드는 동맹에 재가입 신청할 수 있도록 허가해 줄 것을 요청하고 있습니다. 새로 등장한 체제임에도 불구하고 그들은 나토 복귀를 요청하고 있습니다."
 poland.167.a: "고려해 볼 수 있다"
 poland.167.b: "이제 그들은 환영받지 못한다"
 poland.168.t: "혁명가들을 지지하는 정치인!"
 poland.168.d: "한 정당의 정치인이 오늘 세임 회기에서 공산주의자들에 대해 발언했습니다. 그는 혁명가들의 견해를 칭송하기 시작했고 정부 안에 그들의 지지자가 있다고 선언했습니다. 그 정치인은 여러 당 동료들의 지지를 받았으며, 앞으로 몇 주 안에 이들도 비슷한 의견을 표명할 가능성이 있습니다."
 poland.168.a: "그에게 한 잔 따라 줘라!"
 poland.169.t: "공산주의자들, 혼란을 수습"
 poland.169.d: "공산주의 혁명가들은 쿠데타 실패로 빚어진 혼란을 통제하는 데 성공했습니다. 가용한 모든 수단을 동원해 군중을 진정시키고 정부를 장악했습니다."
 poland.169.a: "아슬아슬했다..."
 poland_news.33.t: "폴란드, 개입주의 정치 개시"
 poland_news.33.d: "공산주의 폴란드는 대외 영향력부 건설을 막 완료했습니다. 폴란드 정부는 새로 결성된 동맹인 적색 유럽 조약이 오직 방어적이며 경제 발전에 초점을 맞춘 것이라고 발표했습니다. 재미있는 점은 이들이 공산주의 국가만을 동맹에 받아들인다는 것입니다. 그럼에도 비셰그라드 그룹과 발트 국가들에서는 공산주의자들에 대한 지지가 소폭 상승하기 시작했습니다. 이러한 인기 급상승이 폴란드 정부의 활동과 관련이 있다는 증거는 없지만, 전문가들에 따르면 폴란드의 가장 가까운 이웃들은 이 상황의 전개를 면밀히 주시해야 합니다. 폴란드 정부가 동맹을 확장하기 위해 공격적인 선전을 활용하려 할 가능성이 있습니다."
 poland_news.33.a: "어리석은 짓이다"
 poland_news.33.b: "좋은 수다"
 poland_news.34.t: "폴란드, 공산주의자와 사회민주주의자 간 내전 발발!"
 poland_news.34.d: "공산당 ZKP-P와 사회민주주의 PPS 정부 사이의 긴장이 절정에 달했습니다! 공산주의자들은 정부를 배신하고 제2차 공산주의 혁명을 일으켜 폴란드 남부 지역과 그단스크 지방 및 포들라시에를 신속히 점령했습니다. 양측 군대는 자국 영토에서 벌어지는 전쟁임에도 이처럼 갑작스러운 전쟁에 대비하지 못했습니다. 이 내전의 결과가 폴란드의 미래를 결정할 것입니다. 전쟁에서 승리한 뒤에는 PPS가 EU 및 나토와의 관계를 계속 심화할 가능성이 있습니다."
 poland_news.34.a: "이렇게 될 수밖에 없었다"
 poland_news.34.b: "우리는 자유 폴란드를 위해 싸운다!"
 poland_news.35.t: "PPS, 폴란드 내전에서 승리!"
 poland_news.35.d: "폴란드에서 마침내 공산주의가 타도되었습니다. 사회민주주의 정당 PPS는 제2차 적색 혁명을 진압하고 승리를 거두었습니다."
 poland_news.35.a: "축하한다"
 poland_news.35.b: "마음의 평화"
 POL_economy_status1_idea: "안정적인 경제"
 POL_economy_status1_idea_desc: "우리 경제는 지금은 안정적이지만 그 상태는 매우 빠르게 바뀔 수 있습니다. 우리는 조심해야 합니다."
 POL_economy_status2_idea: "교란된 경제"
 POL_economy_status2_idea_desc: "이것은 작은 상처일 뿐입니다. 아마 아무도 눈치채지 못할 것입니다..."
 POL_economy_status3_idea: "부패 증가"
 POL_economy_status3_idea_desc: "안타깝게도... 커지는 인플레이션이 우리 행정에 영향을 미치기 시작합니다. 모두가 추가 수입을 찾고 있습니다."
 POL_economy_status4_idea: "불안정한 경제"
 POL_economy_status4_idea_desc: "상황이 정말 뜨겁습니다. 혁명이 국제 무역에 영향을 미치도록 놔둘 수는 없습니다."
 POL_economy_status5_idea: "국제 무역 붕괴"
 POL_economy_status5_idea_desc: "결국 일이 벌어졌습니다. 우리는 이웃 국가들의 신뢰를 잃었습니다."
 POL_economy_status6_idea: "경제 붕괴"
 POL_economy_status6_idea_desc: "우리는 과거 불길했던 1930년대처럼 대공황에 이르려 하고 있습니다..."
 POL_economy_status7_idea: "대공황"
 POL_economy_status7_idea_desc: "우리 경제가 붕괴했습니다. 상황을 안정시키기 위해 모든 노력을 기울여야 합니다!"
 POL_solidarity_strength1_idea: "레흐 바웬사의 복귀"
 POL_solidarity_strength1_idea_desc: "레흐 바웬사는 우리 혁명을 좋아하지 않는 듯합니다. 어쩌면 그가 폴란드에서 이 이념을 무너뜨린 자유 노조의 지도자였기 때문일 것입니다... 하지만 우리는 그 낡은 공산주의자들과 다릅니다. 우리는 그들보다 낫습니다."
 POL_solidarity_strength2_idea: "폴란드 인민 공화국으로 돌아가지 않는다"
 POL_solidarity_strength2_idea_desc: "그들은 여전히 우리가 폴란드 인민 공화국을 복원하려 한다고 생각합니다. 왜 그렇게 고집이 센 걸까요?"
 POL_solidarity_strength3_idea: "시위"
 POL_solidarity_strength3_idea_desc: "그만둘 수 없을까요?! 신 자유 노조 파업 참가자들이 선전 팻말을 들고 거리로 나섰습니다. 그들은 우리를 막으려 하지만 혁명은 멈출 수 없습니다."
 POL_solidarity_strength4_idea: "파업"
 POL_solidarity_strength4_idea_desc: "그들은 정부가 우리의 혁명을 합법으로 인정하는 한 일하기를 거부합니다. 흥, 이 정치인들은 우리가 가진 돈만 신경 씁니다. 그들은 우리를 위해 무엇이든 할 것입니다."
 POL_solidarity_strength5_idea: "다시 일어선 자유 노조"
 POL_solidarity_strength5_idea_desc: "공산주의자들은 저지되었습니다. 그러나 민주 정부는 우리를 실망시켰습니다. 내가 이 나라의 지도력을 맡아야 합니다. 우리는 폴란드를 다시 위대하게 만들 것입니다!"
 POL_communism_domination1_idea: "혁명의 시작"
 POL_communism_domination1_idea_desc: "우리의 때가 왔습니다. 부패한 정치인들을 매수할 돈이 있는 한 정부는 이에 대해 아무것도 하지 않을 것입니다."
 POL_communism_domination2_idea: "군의 지지"
 POL_communism_domination2_idea_desc: "이제 우리에게는 탄탄한 기반이 있습니다. 일부 장교들은 내전이 일어날 경우 우리를 지지할 것입니다. 그 신 자유 노조는 정말 성가십니다."
 POL_communism_domination3_idea: "정부 전복"
 POL_communism_domination3_idea_desc: "이제 이곳은 우리가 장악했습니다. 이제 정부를 안정시켜야 하며, 폴란드는 다시 붉게 물듭니다."
 POL_communism_domination4_idea: "일당 국가"
 POL_communism_domination4_idea_desc: "다른 정당들은 더 많은 문제만 일으킬 것입니다. 우리가 모든 것을 통제해야 합니다."
 POL_communism_domination5_idea: "정부 안정화"
 POL_communism_domination5_idea_desc: "혁명은 끝났습니다. 우리에게는 안정적인 정부가 있으며 이제 우리의 계획을 시작할 때입니다."
 POL_intolerance_of_communism_idea: "공산주의와의 투쟁"
 POL_intolerance_of_communism_idea_desc: "우리는 공산주의를 무너뜨리기 위해 오랫동안 싸웠습니다. 이 기억을 우리 머릿속에서 몰아내야 합니다."
