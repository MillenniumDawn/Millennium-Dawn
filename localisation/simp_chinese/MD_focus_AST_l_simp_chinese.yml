 popular_figure_ast: "民众领袖"
 kevin_rudd: "陆克文"
 ruddgov_focus: "卢克文政府"
 remove_howard_tax_tt: "§G将废除之前的减税政策。§!"
 public_hospital_mandate: "公立医院的职责"
 kevin_in_power_ast: "国家并未处于危机之中。"
 cheques_for_the_needy_idea_ast: "§G刺激经济支票§!"
 social_housing_construction_ast: "§G住房建设§!"
 social_housing_construction_ast_2: "§G大规模住宅项目§!"
 the_great_australia_act: "§2大澳大利亚法案§!"
 the_great_australia_act_desc: "这或许是我国历史上规模最大的社会改革计划。这是一项旨在提升澳大利亚社会平等、帮助数百万人摆脱贫困的宏伟工程。该计划全面覆盖福利体系，改革福利资格和覆盖范围，提高补助金，并推出一系列项目，帮助弱势群体摆脱困境。"
 clean_feed_ast: "§O清洁网络§!"
 rudd_tax_reform_ast: "§2卢克文税收改革§!"
 the_care_act_idea_ast: "全民看护"
 reduced_interstate_regulation_ast: "§2减少州际监管§!"
 paid_parental_scheme_ast: "带薪育儿计划"
 paid_parental_scheme_ast_2: "父母支付计划"
 paid_parental_scheme_ast_desc: "赋予新父母最多26周的带薪假期。允许他们请假更好地照顾新生儿或领养的孩子，并促进人口增长。"
 paid_parental_scheme_ast_2_desc: "这项计划整合了我们原有的育儿支持方案，以经济补贴取代了之前的“育儿津贴”，旨在帮助新父母。新父母还可享受长达26周的带薪育儿假，并获得一次性补助，以便更好地照顾新生儿或领养子女，同时鼓励人口增长。"
 social_capitalism_ast: "社会资本主义"
 social_capitalism_ast_desc: "我们采取更积极主动的经济管理方式，既带来了一些好处，也存在一些小的弊端。通过监管和直接管理，我们可以更直接地影响经济，并确保经济始终服务于公民的利益。随着我们不断推进这一方式的实施，我们的方法也将日臻完善。"
 building_the_education_revolution_ast: "§G构建教育革命§!"
 a_new_era_ast: "新时代"
 a_new_era_ast_desc: "我们的国家已经进入了一个平等的新时代。通过众多人士的不懈努力，所有澳大利亚人的未来都更加光明……"
 ast_a_national_agreement_tt: "支持原住民社区的计划将在政治§2决议§!选项卡中解锁。"
 ast_closing_the_gap_tt: "这些项目需要一段时间才能§G见效§!……"
 nrf_ast: "国家和解基金会"
 nrf_ast_desc: "如果我们要确保在我们任期结束后，积极和解的框架仍然存在，我们就需要创建一个专门为能够产生影响的项目提供资金的组织机构。"
 sihip_ast: "战略性原住民住房和基础设施计划"
 sihip_ast_desc: "近年来，北领地的原住民居民可以说是处境最为艰难的。他们的住房等诸多方面都已破败不堪，亟需翻修。"
 family_reunion_services_ast: "家庭团聚服务"
 family_reunion_services_ast_desc: "我们可以开始制定一项计划，为在“被偷走的一代”期间被迫与家人分离的澳大利亚原住民和托雷斯海峡岛民提供寻亲、团聚和咨询服务。"
 rural_job_initiative_ast: "农村就业计划"
 rural_job_initiative_ast_desc: "与安德鲁·福雷斯特等一些较大的捐助者合作，开展政府和私人项目，并雇用当地人从事大部分工作，这将为我们一些遭受工作短缺的社区创造机会。"
 seasonal_worker_visas_ast: "§2季节性工人签证§!"
 ast_keep_the_gears_turning_tt: "为履行我们的安全承诺，我们将在§2决议§!选项卡中公布新的举措。"
 trans_tasman_trade_deal: "跨塔斯曼贸易协定"
 fruits_of_the_summit: "峰会成果"
 toughen_up_on_boat_arrivals_ast: "对船只抵达采取更强硬的措施"
 toughen_up_on_boat_arrivals_ast_desc: "难民乘船抵达一直是新闻头条的热点问题。解决这个问题并非易事，但如果我们不采取行动，反对派就会采取行动，而这只会成为他们攻击我们的把柄。"
 strengthen_police_funding_ast: "增加警务经费"
 strengthen_police_funding_ast_desc: "为了应对日益猖獗的帮派暴力和极端主义团体，我们可以为相关部门增加资金，以确保配备更好的设备并培训更多人员。"
 stack_the_branches_ast: "操纵党支部"
 stack_the_branches_ast_desc: "我们一些颇具影响力的右翼支持者提出要求，希望安插几位知名的党内成员进入政府，而这些人恰好都属于工党右翼派系。这样做或许能在党内赢得更多支持，但也可能显得有些裙带关系。"
 pause_on_tariffs_ast: "暂停加征关税"
 pause_on_tariffs_ast_desc: "当我们的贸易低迷时，我们最好的办法就是“放松”对必需品或服务的关税，即使这意味着牺牲一些短期收入。"
 pacific_islands_forum: "太平洋岛屿论坛近期举行"
 pacific_islands_forum_tt: "在国际任务选项卡中，将提供与太平洋岛国互动的新§2决议§!。"
 forward_with_fairness_ast: "§2改革后的工作场所§!"
 worker_protection_act_ast: "§2工人保护§!"
 the_nation_is_in_crisis_ast: "国家正处于§R危机§!之中"
 legislation_blocked_ast: "我们的立法遭到阻挠。"
 ets_1_ast: "§G排放交易计划§!"
 asean_partner: "东盟伙伴"
 asean_partner_desc: "东盟论坛是由众多经济体组成的多元化联盟，致力于共同投资促进经济繁荣。东盟拥有超过6.8亿人口，占全球GDP的相当一部分。通过与东盟建立伙伴关系，我们将从中受益匪浅。"
 rudd_aghan_troops: "向阿富汗派遣维和部队"
 rudd_iraq_troops: "向伊拉克派遣维和部队"
 rudd_pak_troops: "向巴基斯坦派遣维和部队"
 rudd_congo_troops: "向刚果派遣维和部队"
 rudd_sk_mission: "赴韩国使团"
