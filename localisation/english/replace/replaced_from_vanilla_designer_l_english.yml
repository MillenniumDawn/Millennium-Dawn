 DESIGNER_NEW_DIVISION: "New Brigade"
 REGIMENT_WINDOW_DESC: "Make a selection to change or add platoon"
 DESIGNER_BLOCKED: "This Line Company slot is §Rlocked§!"
 DESIGNER_ADD_FILL_REGIMENT: "§GCtrl + Click§! to fill the rest of the battalion with copies of the slot above"
 DESIGNER_ADD_FILL_REGIMENT_FROM_PICK: "§GCtrl + Click§! to fill the entire battalion with the selected company"
 DESIGNER_ADD_COPY_LEFT_REGIMENT: "§GShift + Click§! to add a copy of the first company from the battalion to the left"
 DESIGNER_ADD_FILL_REGIMENT_FROM_LEFT: "§GCtrl + Shift + Click§! to fill the battalion with copies of the first company from the battalion to the left"
 DESIGNER_REMOVE_REGIMENT: "§GCtrl + Click§! to remove every company in this battalion"
 DESIGNER_BLOCKED_REGIMENTAL_SUPPORT: "This Battalion Support slot is §Rlocked§!"
 DESIGNER_BLOCKED_BY_REGIMENT_BATTALIONS: "§R- Requires at least §!§H$NUM_BATTALIONS|H$ Line Companies§!§R in the battalion.§!"
 DESIGNER_REGIMENT_SUPPORT_STATS_SCALED: "Stats, equipment and manpower are scaled to $FACTOR|H%0$ because the battalion has $BATTALIONS|H$/$MAX_BATTALIONS|H$ companies."
 DESIGNER_MAIN_COLUMN_TITLE: "Line Companies are your frontline troops.\n\nEach column is a Battalion of a specific base type like §YArmor§!, §YInfantry§! or §YMotorized Troops§!. The topmost type decides what else you can put in that Battalion column. The more Line Companies you have the bigger your §YCombat Width§! and the fewer of these brigades you will be able to fit into the same battle."
 EQUIPMENT_DESIGNER_SELECT_ROLE_DESC: "The §HRole§! determines which §HCompanies§! and §HSupport Platoons§! are supplied with equipment of this design."
 DESIGNER_SELECT_NICHE_DISABLED: "Brigade contains no armored forces"
 DESIGNER_NOT_ENOUGH_DIVISION_CAP: "Design change would put us over the Brigade limit"
 NO_INTERSECTED_EQUIPMENT_DESC: "This modification will cause §RDISBANDING§! of existing brigades with this template. There is no equipment intersection between modified and original template."
