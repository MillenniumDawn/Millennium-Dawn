 BRA_idea_brazilian_space_force_desc: "브라질 국민은 육상, 해상, 공중, 그리고 새로운 개척지에서 모든 대가를 치르더라도 지켜야 합니다. 대기권 안팎에 있는 모든 자산의 방어를 담당할 새로운 군 병과로 브라질 우주군을 창설해야 합니다."
 BRA_idea_support_from_the_teachers_desc: ""
