 STATS_TITLE: "Статистика"
 GDP_TOTAL: "ВВП"
 GDP_TOTAL_DESC: "Наш §YВаловой внутренний продукт§! (ВВП) — это показатель стоимости всех товаров и услуг, произведённых в стране. Millennium Dawn использует ВВП, скорректированный по ППС (паритету покупательной способности), так как этот показатель учитывает местные экономические условия, делая сравнение стран более точным и полезным."
 NUM_GDP_TOTAL: "$$§Y[?ROOT.gdp_total|1]§!b"
 NUM_GDP_TOTAL_DESC: "Наш §YВВП§! сейчас составляет $§Y[?ROOT.gdp_total|3]§! млрд.\n\nНедавний §Yквартальный темп роста ВВП§!: [?last_quarter_gdp_growth_rate|%Y].\n\nПодсказка: чем выше §Yквартальный темп роста ВВП§!, тем выше вероятность положительных экономических событий."
 NUM_GDP_TOTAL_DELAYED_DESC: "Примерный вклад отраслей в процентах:\n§PГражданские заводы§!: [?ROOT.civil_fac_percent|%]\n§OВоенные заводы§!: [?ROOT.military_factory_total_percent|%]\n§BВоенно-морские верфи§!: [?ROOT.naval_factory_total_percent|%]\n§CОфисные парки§!: [?ROOT.office_fac_percent|%]\n§GНекоммерческое сельское хозяйство§!: [?ROOT.agriculture_percent|%]\n§YРайоны коммерческого сельского хозяйства§!: [?ROOT.agriculture_district_fac_percent|%]\n§YЗаводы микрочипов§!: [?ROOT.microchip_plant_percent|%]\n§YЗаводы композитных материалов§!: [?ROOT.composite_plant_percent|%]\n§YСинтетические НПЗ§!: [?ROOT.synthetic_refinery_percent|%]\n§GДобыча ресурсов§!: [?ROOT.resources_percent|%]\n§YИнфраструктура§!: [?ROOT.infrastructure_gdp_percent|%]\n§PЗдравоохранение§!: [?ROOT.healthcare_gdp_percent|%]\n"
 GDP_PER_CAPITA: "ВВП/чел."
 GDP_PER_CAPITA_DESC: "Эта цифра представляет наш §YВВП на душу населения§! или §YВВП/чел.§!. Она отражает объём производства на каждого человека в стране.\n\nНедавний §Yквартальный темп роста ВВП/чел.§!: [?last_quarter_gdpc_growth_rate|%Y].\n\nПодсказка: чем выше §Yквартальный темп роста ВВП/чел.§!, тем выше вероятность положительных экономических событий, но при этом §Rинфляция§! также может потенциально расти, если её не контролировать."
 GDP_PER_CAPITA_DELAYED_DESC: "Текущее влияние §YВВП на душу населения§! на нашу страну:\nСкорость строительства: [?production_speed_buildings_factor_gdp_modifier|%+]\nЕжемесячный прирост населения: [?monthly_population_gdp_modifier|%+1]\nСкорость исследований: [?research_speed_factor_gdp_modifier|%+]\nСтабильность: [?stability_factor_gdp_modifier|%+]\nОбщая рабочая сила: [?total_workforce_gdp_c_modifier_var|%+]\nСкорость строительства тепловых электростанций: [?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA: "$$§Y[?ROOT.gdp_per_capita|3]§!k"
 NUM_GDP_PER_CAPITA_DESC: "Наш §YВВП/чел.§! сейчас составляет $§Y[?ROOT.gdp_per_capita|3]§! тыс."
 PRODUCTIVITY: "Производительность"
 PRODUCTIVITY_DESC: "Это число показывает §Yпроизводительность§! нашей страны."
 NUM_PRODUCTIVITY_DELAYED_DESC: "§YМесячный рост до поправок по регионам:§! [?productivity_growth_scaled|3+]\n\n§YБазовый рост производительности:§!\nЗаконы, национальные духи и технологии: [?modifier@productivity_growth_modifier|3+]\n Включая корпоративные налоги: [?productivity_growth_modifier_from_corporate_tax|3+][literacy_productivity_tooltip]\n\n§YОбщенациональный модификатор роста:§!\nЗаконы, национальные духи и технологии: [?modifier@country_productivity_growth_modifier|%+1]\n Включая инфляцию: [?inflation_rate_prod_var|%+1]\n\nМесячный рост = базовый рост производительности ×0.5 × (1 + общенациональный модификатор роста). Общенациональный множитель ограничен диапазоном 0–100. Затем каждый регион применяет свою поправку на мировую производительность и местный модификатор роста.\n\nЭффект производительности:\n§YВВП:§! [?productivity_tax_effect_display|%+1]\n§YВыпуск фабрик:§! [?productivity_tax_effect_display|%+1]\n§YВыпуск верфей:§! [?productivity_tax_effect_display|%+1]\n§YСкорость строительства:§! [?productivity_tax_effect_display|%+1]\n§YКорпоративный налог:§! [?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon §YКоммерческие сельхозрайоны§! — скорость строительства:§! [?agriculture_district_output_var|%+1]"
 NUM_PRODUCTIVITY: "§Y[?ROOT.overall_productivity|3]§!"
 NUM_PRODUCTIVITY_DESC: "§YПроизводительность§! показывает, насколько эффективно мы превращаем ресурсы в товары и услуги для населения; от неё зависят ВВП, корпоративный налог и промышленное производство. Чем выше производительность, тем выше эффективность, но рост замедляется по мере того, как регионы обгоняют среднемировой уровень, а менее производительные регионы догоняют быстрее.\n\n§YСреднемировой показатель:§! [?global.average_world_productivity|3]\n§YНаша производительность:§! [?ROOT.overall_productivity|3]\n"
 INFLATION: "Инфляция"
 INFLATION_DESC: "Это число представляет §Yинфляцию§! нашей страны."
 NUM_INFLATION: "§Y[?ROOT.inflation_rate_var|%]§!"
 NUM_INFLATION_DESC: "§YИнфляция§! показывает, как быстро растут цены. Высокая инфляция увеличивает государственные расходы и снижает выпуск фабрик. Все её эффекты показывает национальный дух §YВлияние инфляции на экономику§!, в том числе §YДефляцию§!, когда темп уходит в минус.\n\nОна пересчитывается каждый квартал. Показанный темп — это среднее за последние 4 квартала, и за квартал он меняется не более чем на 10%. На более лёгких уровнях сложности она растёт медленнее.\n\n§YЧто на неё влияет:§!\n- Рост §YВВП на душу§!: быстрый рост повышает её, сокращение экономики снижает\n- §YНалоговая ставка§!: чем выше ставка, тем ниже инфляция\n- §YКлючевая ставка§!: чем выше ставка, тем ниже инфляция, но тем больше §Rпроценты по долгу§!\n- §YЭкономический цикл§!: выше §Yстабильного роста§! повышает её, ниже — снижает\n- §YБюджет§!: крупный дефицит повышает её, особенно при большом долге. Профицит снижает её.\n- §YПечатание денег§! повышает её\n- Ослабление валюты повышает её, особенно если мы импортируем ресурсы\n- Высокая инфляция частично переходит в следующий квартал\n\n§YСила валюты:§! [currency_strength_display]\nНормой считается §Y1.00§!. Сила валюты пересчитывается ежемесячно и держится в пределах от §Y0.15§! до §Y2.00§!. На более лёгких уровнях сложности минимум выше. Слабая валюта увеличивает государственные расходы и доходы от экспорта ресурсов. Если наша §YПолитика резервной валюты§! опирается на иностранную валюту, слабая валюта ещё и удорожает наш долг. Сильная валюта действует наоборот.\n\n§YЧто на неё влияет:§!\n- §YКлючевая ставка§!: выше инфляции укрепляет валюту, ниже — ослабляет\n- §YСтабильность§!: выше 50% укрепляет, ниже — ослабляет\n- §YЭкономический цикл§!: выше §Yстабильного роста§! укрепляет, ниже — ослабляет\n- §YПроцентная ставка§! выше 5% из-за долга или §YМировой напряжённости§! ослабляет её\n- Поражение в войне (прогресс капитуляции выше 10%), гражданская война, §YМеждународные санкции§! или финансовый крах за последние 3 года ослабляют её\n- Если мы выпускаем резервную валюту, её укрепляет каждая страна, которая ею пользуется\n- §YМировая напряжённость§! выше 50% укрепляет доллар, иену и швейцарский франк\n\nСо временем сила валюты возвращается к своему долгосрочному уровню. Золотое, серебряное и биметаллическое §YВалютное обеспечение§! подтягивает слабую валюту к §Y1.00§!, а золото также опускает валюту сильнее §Y1.05§! обратно вниз."
 NUM_INFLATION_DELAYED_DESC: "§YПоследние 4 квартала:§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\nПоказанный темп — среднее за эти четыре квартала, и именно от него зависят все эффекты инфляции."
 POPULATION_TAX_RATE: "Налоги с населения"
 POPULATION_TAX_RATE_TT: "§YОжидаемая ставка: [?expected_population_tax_rate|0]%§!\nСтавка, которую население принимает без сопротивления. Она растёт вместе с нашим ВВП на душу населения.\n• Повышение ставки выше и этой, и любой более высокой ставки, с которой мы недавно её снизили, на время стоит §R2%§! £stability_texticon §Yстабильности§! за каждый пункт.\n• Снижение ниже и этой, и любой более низкой ставки, с которой мы недавно её повысили, на время даёт §G0.5%§! £stability_texticon §Yстабильности§! за каждый пункт.\n• Движение к ней не добавляет штрафа за смену, но повышение сначала отменяет недавний бонус за снижение.\nСм. §YИздержки смены политики§! в наших национальных духах.\n\nНалоговая ставка с населения включает все налоги, взимаемые с граждан. Сюда могут входить, но не ограничиваются ими: подоходный налог, НДС, налог с продаж и налог на имущество.\n\n§YМодификаторы от налогов с населения:§!\n£stability_texticon  Стабильность: [?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE: "Корпоративный налог"
 CORPORATE_TAX_RATE_TT: "§YОжидаемая ставка: [?expected_corporate_tax_rate|0]%§!\nСтавка, которую бизнес принимает без сопротивления. Она растёт вместе с нашим ВВП на душу населения и следует экономическому циклу: ниже при §Yстагнации§!, §Yрецессии§! или §Yдепрессии§!, выше при §Yбыстром росте§! или §Yэкономическом буме§!.\n• Повышение ставки выше и этой, и любой более высокой ставки, с которой мы недавно её снизили, на время стоит §R1.2%§! £stability_texticon §Yстабильности§! за каждый пункт.\n• Снижение ниже и этой, и любой более низкой ставки, с которой мы недавно её повысили, на время даёт §G0.01§! к §Yежемесячному росту производительности§! и удешевляет §Yиностранные инвестиции§! в нашу страну на §G2%§! за каждый пункт.\n• Движение к ней не добавляет штрафа за смену, но повышение сначала отменяет недавний бонус за снижение.\nСм. §YИздержки смены политики§! в наших национальных духах.\n\nНалоговая ставка на корпорации включает все налоги, взимаемые с компаний. Это значение состоит из корпоративного налога на прибыль, налогов на работодателя и других сборов.\n\n§YМодификаторы от корпоративных налогов:§!\n£consumer_goods_texticon  Налоговые издержки: [?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon Модификатор стоимости §Yполучения иностранных инвестиций§!: [?receiving_investment_cost_form_corporate_tax|%-]\nЕжемесячный рост производительности: [?productivity_growth_modifier_from_corporate_tax|+3]\n"
 CB_POLICY_RATE: "Ставка ЦБ"
 CB_POLICY_RATE_TT: "§YКлючевая ставка центрального банка§! — базовая процентная ставка, устанавливаемая центральным банком. Она определяет стоимость заимствований во всей экономике.\n\n§YПовышение ставки§! сжимает денежную массу, сдерживая инфляцию, но увеличивает стоимость госдолга и замедляет экономическую активность.\n§YСнижение ставки§! стимулирует заимствования и инвестиции, но даёт инфляции расти свободнее. Отрицательные ставки дают дополнительный стимул инфляции во время дефляции.\nКаждый положительный пункт ставки также уменьшает долю инфляции, переходящую в следующий квартал, какой бы высокой ни была инфляция. При ставке 0% и ниже перенос остаётся на максимуме в 90%. Бюджетный дефицит сверх допустимого уменьшает эффект каждого положительного пункта вплоть до половины.\nСтавка, превышающая инфляцию более чем на 1 п.п., поддерживает §Yкурс валюты§!, а более низкая ставка его ослабляет. Если инфляция намного выше ставки, каждый пункт всё равно смягчает ежемесячное падение.\n\nКаждое изменение стоит §Y25§! £pol_power_icon, после чего действует перерыв §Y30 дней§!.\n\n§YТекущая ставка:§! [?cb_policy_rate]%\n§YПеренос инфляции:§! каждый положительный пункт ставки снижает долю переноса на 2.5 п.п. за квартал\n§YНадбавка к ставке по долгу:§! [?cb_policy_rate|+0]% × 0.33 п.п. добавляется к §Yпроцентной ставке§!"
