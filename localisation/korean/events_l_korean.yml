 SouthSudanNews.1.a: "흥미롭군"
 AngolaNews.1.t: "앙골라 내전의 종식"
 AngolaNews.1.AGL.d: "앙골리 내전이 종식을 고했습니다. 1970년대부터 지속되던 이 내전은 이전에는 동맹이었던 앙골라 해방인민운동(MPLA)과 앙골라 완전 독립 민족 동맹(UNITA)이 싸움을 계속해서 지속해나갔습니다.\n\n전 소련을 동맹으로 둔 앙골라 해방인민운동(MPLA)은 앙골라 완전 독립 민족 동맹(UNITA)을 패퇴시켰습니다."
 AngolaNews.1.UNI.d: "앙골리 내전이 종식을 고했습니다. 1970년대부터 지속되던 이 내전은 이전에는 동맹이었던 앙골라 해방인민운동(MPLA)과 앙골라 완전 독립 민족 동맹(UNITA)이 싸움을 계속해서 지속해나갔습니다.\n\n미국의 지원을 받던 앙골라 완전 독립 민족 동맹(UNITA)은 앙골라 해방인민운동(MPLA)을 패퇴시켰습니다."
 AngolaNews.1.a: "흥미롭군"
 overlord.1.t: "[FROM.GetName]의 합병"
 overlord.1.d: "[FROM.GetName] has been our puppet state for far too long. It is no longer a viable partnership to allow them to have autonomy. This day in [GetYear] marks a day we have long desired. [FROM.GetName] has been integrated into our great nation. They will now become [ROOT.GetAdjective] citizens and receive the same care and treatment as any other citizen in our nation. It is a glorious day for us and the people of [FROM.GetName].\nNOTE: Annexing another sovereign nation forces us to assume all of their debt, treasury, and international investments as they merge with us.\n\nYou gain the following: [?ROOT.treasury|Y] Treasury, [?ROOT.debt|R] Debt, [?ROOT.int_investments] International Investments"
 overlord.1.a: "환상적이군"
 overlord.1.a_tt: "우리는 §B[FROM.GetName]§!(을)를 핵심 주로 얻습니다."
 overlord_news.1.t: "[FROM.FROM.GetName] 측을 합병하는 [ROOT.GetName]"
 overlord_news.1.d: "Delegations from [ROOT.GetName] and [FROM.FROM.GetName] have announced today that [FROM.FROM.GetName] will be integrated into [ROOT.GetName]. [FROM.FROM.GetName] has been an autonomous state for quite some time and has become increasingly reliant on [ROOT.GetName] in the past months. It is quoted as 'It only makes sense!' from the two parties involved.\n\nThe truth in that statement is yet to be seen."
 overlord_news.1.a: "흥미롭군"
 debug_money.1.t: "자원 판매율 계산기"
 AIDS_events.1.t: "HIV 유병률 증가 "
 AIDS_events.1.d: "국내 보건에 대한 나쁜 소식입니다. 지난해 HIV 감염자가 크게 증가했고 국내 전반적인 HIV 상황이 악화되었습니다."
 AIDS_events.1.a: "젠장"
 AIDS_events.2.t: "HIV 유병률 정상화 "
 AIDS_events.2.d: "HIV와의 싸움이 결실을 맺고 있는 것 같습니다. 작년에 우리나라의 HIV 유병률에는 본질적으로 변화가 없었습니다. 개선은 아니지만 여전히 진전이 있습니다."
 AIDS_events.2.a: "다행이군"
 AIDS_events.3.t: "HIV 유병률 감소"
 AIDS_events.3.d: "국내 보건에 대한 좋은 소식입니다. 지난해 HIV 감염자가 크게 줄었고 국내 전반적인 HIV 상황이 크게 개선됐습니다."
 AIDS_events.3.a: "대단해."
 econvent.3.b: "구제금을 발행해라."
 DRC.0.t: "로랑데지레 카빌라의 암살!"
 DRC.0.d: "Our leader and liberator Laurent-Désiré was attacked today in the presidential palace, his bad standing with the military and attempts to purge disloyal Kadogos have evidently met with a terrible failure, we attempted to rush him to Harare for urgent medical care, but it was too late, our liberator lies dead.\n\nWe have since found and had the perpetrator Rashidi Kasereka executed for his crimes."
 DRC.0.A: "어두운 날이다."
 News_influence.0.b: "원조 거절"
 influence.51.a_tt: "어떤 무기를 진행시킬지 결정해야 합니다!"
 influence.51.b_tt: "다시 생각해보자. 나도 총이 필요하다!"
 econvent.11.t: "주요 금융 기관의 실패"
 econvent.11.d: "주요 금융 기관이 파산했다는 헤드라인이 나왔습니다. 언론은 이에 난리를 피우며 언덕으로 향하고 있다. 더 큰 위기가 다가오고 있다는 우려가 커지자 정부에 대책을 촉구하고 있다. 우리는 무엇을 해야 합니까?"
 econvent.11.a: "너무나도 심각한 실패다..."
 econvent.11.b: "그저 좋은 기업 중 하나였을 뿐이다..."
 econvent.12.t: "요동치는 [FROM.GetName]의 금융 위기"
 econvent.12.d: "최근 [FROM.GetName]의 위기는 우리나라에 많은 분쟁을 일으켰고 그 위기의 영향이 우리나라에도 느껴지고 있습니다. 우리의 상호 연결된 경제는 이제 이 위기의 무게로 인해 어려움을 겪고 있습니다."
 econvent.12.a: "구호 기금을 발행하자."
 econvent.12.b: "시장이 우선이다."
 sco.12.t: "$SHANGHAI_PACT$ (을)를 형성한 [FROM.GetName]"
 sco.12.d: "[FROM.GetName]은 [USA.GetFactionName]과 경쟁하기 위해 $SHANGHAI_PACT$을 결성했습니다. 우리는 그들이 우리에게 큰 [FROM.GetAdjective] 영향력을 행사하도록 허용했고, 우리도 SCO의 구성원이므로 새로운 세력의 구성원이 될 수밖에 없습니다."
 sco.12.a: "알겠다"
 influence.54.t: "월간 자동 영향력 행사 보고서"
 influence.54.d: "[?nations_influenced|0]개 국가가 [GetDateText]에 성공적으로 영향을 받았습니다. 현재 진행 중인 영향력 행사 활동을 통해 다음과 같은 국가에 영향을 미쳤습니다:\n[auto_influence_target_display]"
 influence.54.a: "좋다!"
 SouthSudan.2.t: "동수단 반란군"
 SouthSudan.2.d: "수단 분쟁 기간 동안, 에리트레아는 국경 내에 여러 반란군 집단을 품어 동쪽에서 우리 영토를 공격할 수 있습니다. 반란군들은 스스로 \"동부 전선\"이라고 지칭하고 [SSU.GetNameDef]와 연합합니다. 이는 그들로 하여금 우리에게 더 큰 공격을 가하도록 했으며 그들의 목표는 우리의 무역 중심지인 포트 수단이었습니다."
 SouthSudan.2.a: "빌어먹을 에리트레아 놈들!"
 SouthSudan.3.t: "청나일강의 수단 반군"
 SouthSudan.3.d: "With the rise of Mengistu back into power in [ETH.GetName], he has once again started supporting the SPLA. By finding anti-government sympathisers among Sudanese refugees living in [ETH.GetName], he together with the SPLA have armed those people and sent them across the border into the Blue Nile."
 SouthSudan.3.a: "빌어먹을 에티오피아 놈들!"
 SouthSudan.4.a: "국경을 넘어 우리 군을 보내라!"
 SouthSudan.4.b: "위험을 감수할 순 없다"
 SouthSudanNews.2.a: "흥미롭군"
 corruption.1.t: "일종의 제안..."
 corruption.1.d: "One of the ministers reached out and said that a few organizational and law changes can be made to optimize the performance of our administration, though it will require some... personal connection to moving forces."
 corruption.1.a: "어쩌면, 기회일지도 모른다"
 corruption.1.b: "좋지 않은 생각이다"
 corruption.2.t: "일종의 제안..."
 corruption.2.d: "One of the ministers reached out and said that a few organizational and law changes can be made to optimize the performance of our police, though it will require some... personal connection to moving forces."
 corruption.2.a: "어쩌면, 기회일지도 모른다"
 corruption.2.b: "좋지 않은 생각이다"
 corruption.3.t: "일종의 제안..."
 corruption.3.d: "One of the ministers reached out and said that a few organizational and law changes can be made to optimize the performance of our military complex, though it will require some... personal connection to moving forces."
 corruption.3.a: "어쩌면, 기회일지도 모른다"
 corruption.3.b: "좋지 않은 생각이다"
 corruption.4.t: "일종의 제안..."
 corruption.4.d: "One of the ministers reached out and said that a few organizational and law changes can be made to optimize the performance of our education facilities, though it will require some... personal connection to moving forces."
 corruption.4.a: "어쩌면, 기회일지도 모른다"
 corruption.4.b: "좋지 않은 생각이다"
 corruption.5.t: "일종의 제안..."
 corruption.5.d: "One of the ministers reached out and said that a few organizational and law changes can be made to optimize the performance of our hospitals, though it will require some... personal connection to moving forces."
 corruption.5.a: "어쩌면, 기회일지도 모른다"
 corruption.5.b: "좋지 않은 생각이다"
 corruption.6.t: "일종의 제안..."
 corruption.6.d: "One of the ministers reached out and said that a few organizational and law changes can be made to optimize the performance of our social institutes, though it will require some... personal connection to moving forces."
 corruption.6.a: "어쩌면, 기회일지도 모른다"
 corruption.6.b: "좋지 않은 생각이다"
 corruption.7.t: "일종의 제안..."
 corruption.7.d: "One of the news agencies asked us for funding in exchange for more favorable news."
 corruption.7.a: "어쩌면, 기회일지도 모른다"
 corruption.7.b: "좋지 않은 생각이다"
 corruption.8.t: "일종의 제안..."
 corruption.8.d: "일부 중도 정치인들이 우리 야당에 대항하여 협력을 원한다며 연락을 취했습니다. 물론 더러운 일에도 손을 대야겠지만 말이죠."
 corruption.8.a: "어쩌면, 기회일지도 모른다"
 corruption.8.b: "좋지 않은 생각이다"
 corruption.9.t: "일종의 제안..."
 corruption.9.d: "일부 건설 업체들이 그들 최고의 결과물을 만들어 내기 위해 일부 법과 규제를 모른척 해달라 요청하고 있습니다."
 corruption.9.a: "어쩌면, 기회일지도 모른다"
 corruption.9.b: "좋지 않은 생각이다"
 corruption.10.t: "일종의 제안..."
 corruption.10.d: "일부 군사 외주사업자들이 새로운 시설의 건설에 박차를 가하기 위해 일부 규제와 법을 모른체 해달라고 요청했습니다."
 corruption.10.a: "어쩌면, 기회일지도 모른다"
 corruption.10.b: "좋지 않은 생각이다"
 corruption.11.t: "일종의 제안..."
 corruption.11.d: "One of the construction companies reached out and asked if they can ignore some environmental laws to provide the best results possible."
 corruption.11.a: "어쩌면, 기회일지도 모른다"
 corruption.11.b: "좋지 않은 생각이다"
 corruption.12.t: "일종의 제안..."
 corruption.12.d: "One of the military subcontractors reached out and asked if they can ignore some environmental laws to provide the best results possible."
 corruption.12.a: "어쩌면, 기회일지도 모른다"
 corruption.12.b: "좋지 않은 생각이다"
 corruption.13.t: "일종의 제안..."
 corruption.13.d: "일부 투자 자금 총책이 해외 투자를 따내기 위한 흥미로운 계획을 들고 왔습니다만, 이는 국제법을 꽤나 위반하는 것으로 보입니다."
 corruption.13.a: "어쩌면, 기회일지도 모른다"
 corruption.13.b: "좋지 않은 생각이다"
 corruption.14.t: "일종의 제안..."
 corruption.14.d: "우리의 친한 친구가 정부의 믿을 수있는 사업체와 더욱 긴밀한 관계를 위해 소규모 정당을 새로 창당하자고 제안하였습니다."
 corruption.14.a: "어쩌면, 기회일지도 모른다"
 corruption.14.b: "좋지 않은 생각이다"
 corruption.15.t: "일종의 제안..."
 corruption.15.d: "일부 사업가가 자원 획득 대비 이윤을 대폭 늘릴 수 있는 계획을 제안하였습니다만, 이는 당연하게도 우리 산업 전반을 혹사시키는 조치가 될 것입니다."
 corruption.15.a: "어쩌면, 기회일지도 모른다"
 corruption.15.b: "좋지 않은 생각이다"
 korea.38.t: "한국은 우리에게 일본과 한국에 주둔한 군대를 철수할 것을 요청합니다"
 korea.38.d: "한국은 오늘 우리에게 일본과 한국에 주둔하고 있는 우리 군대의 철수를 공식적으로 요청했습니다."
 korea.38.a: "우리는 그들의 부당한 요구에 응하지 않을 것입니다."
 korea.38.b: "뭐, 이제 군인들이 집에 갈 시간이 된 것 같은데......"
 MD_character_army.1.t: "[FROM.GetName]이 실행 중에 종료되었습니다."
 MD_character_army.1.d: "[FROM.GetHersHis] 부대를 후퇴시키던 중, [FROM.GetRank] [FROM.GetName] 씨가 적군의 공격을 받아 전사한 것으로 보입니다. [FROM.GetHersHisCap] 씨의 시신이 수습되어 국장으로 장례가 진행될 예정입니다."
 MD_character_army.1.a: "국가적 손실이다."
 MD_character_army.2.t: "[FROM.GetName]이 실행 중에 종료되었습니다."
 MD_character_army.2.d: "또 다른 승리를 거둔 후, [FROM.GetRank] [FROM.GetName]은 재집결한 적 부대의 공격을 받아 임무 수행 중 전사한 것으로 보입니다. [FROM.GetHersHisCap]의 시신은 수습되었으며, 국장으로 장례가 치러질 예정입니다."
 MD_character_army.2.a: "국가적 손실이다."
 civil_war_debuff.1.t: "군대의 회복!"
 civil_war_debuff.1.d: "내전의 최초 충격으로 인해 우리 나라는 완전한 혼돈의 시기로 빠져들었습니다. 우리는 일부 부대와 지휘관과의 연락이 끊겼고, 보급 창고들 또한 응답을 하지 않으며 적들 또한 어디에 있는지도 파악이 되지 않고 있습니다. 일선에서는 대부분의 사안이 안정화되어 누가 어느 편에 서고 있는지 확실해지고 있지만, 아직 해결해야될 부분이 산더미처럼 쌓여 있습니다.\n\n우리 군은 베테랑과 자원병으로 구성되어 있으나, 구체적인 지휘 체계가 분명하지 않았습니다. 우리는 이로써 우리 장병들에게 제때 보급을 해줄 수 없었고 직접적인 보급로를 구성할 수도 없었습니다. 또한 우리는 전투 자체에 대한 개념이 불분명하고 상대가 어떤 전술을 사용하고 있는지 조차도 알 수가 없었습니다. 무엇을 우선적으로 개선해야 할까요?"
 civil_war_debuff.1.a: "분명한 지휘 체계를 다듬어야 한다!"
 civil_war_debuff.1.b: "우리는 총기가 필요하다. 엄청나게 많이."
 civil_war_debuff.1.c: "모든 것을 기록해라! 우리는 적군에 대해 연구해야 한다."
 civil_war_debuff.2.t: "군대의 회복!"
 civil_war_debuff.2.d: "우리 군은 오랫동안 혼란한 상황이었지만 이제 상황이 나아지고 있습니다. 우리는 우리 군의 위치와 규모를 대략적으로 파악하고 있으며, 일부 보급로를 확보했습니다. 그러나 군은 여전히 전반적인 결속력이 부족하고 많은 부대와 민병대가 중앙 사령부로부터 독립적으로 운영되고 있습니다.\n\n우리 군에는 지휘 계통이 있지만 책임과 권한이 항상 존중되는 것은 아닙니다. 우리는 비교적 안정적인 무기 공급을 가지고 있지만 많은 부대는 자체 보급품을 가지고 있습니다. 또한 우리 군대에는 공통 전술이 정의되어 있지 않습니다. 우리는 어떻게 개선해야 할까요?"
 civil_war_debuff.2.a: "장병들은 그들의 임무와 상관을 분명히 파악할 필요가 있다"
 civil_war_debuff.2.b: "우리는 나사빠진 군 보급 체계를 제공해서는 안된다,"
 civil_war_debuff.2.c: "장병들에게 야전 전투 매뉴얼을 학습시키자."
 civil_war_debuff.3.t: "군대의 회복!"
 civil_war_debuff.3.d: "The confusion in our military is starting to disappear. The way our soldiers act is starting to resemble an actual military now. Some minor problems still remain.\n\nThere exists some duplicate commands where commanders' authorities overlap. Military procurement orders sometimes disappear, and the money intended for them ends up outside of the troops. We are losing a lot of field experience and trainers as soldiers are discharged without documentation and casualties are not properly tracked. What should we try to improve?"
 civil_war_debuff.3.a: "지휘를 분명히 하고 내부 갈등을 해결하자."
 civil_war_debuff.3.b: "군수 산업과 관련된 부패를 해결하자."
 civil_war_debuff.3.c: "Set up a process for passing down field experience."
 civil_war_debuff.4.t: "군대의 회복!"
 civil_war_debuff.4.d: "이제 거의 다 왔습니다. 비록 자잘한 문제들이 남아 있지만, 우리 군은 전쟁 이전의 상태로 대부분 회복되어 가고 있습니다. 이제 일부 조직적인 개선만 완료되면 전문적으로 완편된 군대로 변모하게 될 것입니다.\n\n아직 군에 편입되지 않은 일부 민병대들이 남아있습니다. 또한 우리가 구매하거나 생산하려고하는 일부 장비는 교체가 불가능합니다. 뿐만 아니라 우리 사령부는 전쟁에서의 전투 경험을 분석하기 위해 추가적인 자료를 요구하고 있습니다. 어떤 부분을 개선해야 할까요?"
 civil_war_debuff.4.a: "잔존하는 민병대를 통합하자."
 civil_war_debuff.4.b: "무기 비축 체계를 통일하자."
 civil_war_debuff.4.c: "사령부에 추가적인 장교들을 배치하자."
 civil_war_debuff.5.t: "군대의 회복!"
 civil_war_debuff.5.d: "모든게 끝났습니다. 비효율적인 군대를 개혁한지 2년이 지난 지금, 우리는 내전으로 인한 상처를 극복해 냈습니다. 이제 우리는 내부가 아닌, 외부의 적에 대항하여 군사 방어를 키워나갈 수 있을 겁니다."
 civil_war_debuff.5.a: "오늘은 [ROOT.GetNameDef]의 날이다."
 protests.1.t: "긴장이 증가하다"
 protests.1.d: "정부 지출에 대한 불만으로 인해 대중의 불안이 커지고 있습니다. 시위는 더욱 빈번해지고 급진화되고 있습니다. 정부는 확고한 입장을 취할 것인지, 아니면 국민을 달래려는 노력 중 하나를 선택해야 한다."
 protests.1.a: "무시해라."
 protests.1.b: "명령을 집행하다"
 protests.1.c: "협상 시작"
 protests.2.t: "정치권력투쟁"
 protests.2.d: "국민 불만이 높아지면서 정치공작도 위태로워지고 있다. 상황은 급진화가 심화될 위험을 무릅쓰고 정치권력을 보호할 것인지, 아니면 더 심각한 결과를 초래할 수 있는 도박을 할 것인지 선택을 요구합니다."
 protests.2.a: "주사위를 굴려라..."
 protests.2.b: "현 위치 사수"
 protests.2.c: "협상을 시작해라"
 protests.3.t: "리더십의 위기"
 protests.3.d: "계속되는 시위로 여당의 인기가 흔들리고 있다. 정부는 권력 장악력을 강화할 수도, 약화시킬 수도 있는 중요한 결정에 직면해 있습니다. 이번 결과는 국가의 정치 지형에 지속적인 영향을 미칠 수 있다."
 protests.3.a: "시위대를 무시하라"
 protests.3.b: "라디칼을 분산시키세요"
 protests.3.c: "협상을 시작해라"
 protests.4.t: "외국의 간섭"
 protests.4.d: "국내 불안이 커지자 외국 세력도 관심을 갖고 있다. 정부는 외국의 영향력을 있는 그대로 받아들일 것인지 아니면 외국 대리인을 통제할 것인지 선택해야 합니다."
 protests.4.a: "성급하게 움직이지 마세요"
 protests.4.b: "그 중 마지막 하나를 모두 찾아보세요"
 protests.4.c: "협상을 시작해라"
 protests.5.t: "중단된 진행"
 protests.5.d: "이번 시위로 인해 전국 건설 프로젝트가 크게 둔화되고 있습니다. 행정부는 더 짧은 기간 동안 영향을 완화하거나 더 긴 지연을 감수하면서 시위자를 진정시키려는 시도 중에서 선택해야 합니다."
 protests.5.a: "이건 분명 며칠 안에 멈출 거야"
 protests.5.b: "이제 경찰이 할 일이 있겠네요"
 protests.5.c: "협상을 시작해라"
 protests.6.t: "군수생산 위기"
 protests.6.d: "증가하는 불안은 군수 생산에 영향을 미치고 있으며 정부는 중요한 결정에 직면해 있습니다. 생산량을 유지하기 위한 조치를 시행해야 할까요, 아니면 시위를 완화하여 생산 위기를 악화시키려고 해야 할까요?"
 protests.6.a: "그들은 곧 직장으로 돌아올 것이다"
 protests.6.b: "강제로 생산을 보존하다"
 protests.6.c: "협상을 시작해라"
 protests.10.t: "위기에 처한 국가"
 protests.10.d: "대중의 불안이 심각한 수준에 이르렀습니다. 이제 정부의 결정은 더욱 불안정해지거나 더욱 급진적인 대중화로 이어질 수 있습니다. 상황은 심각합니다."
 protests.10.a: "이건 넘어가겠다"
 protests.10.b: "무슨 수를 써서라도 억제하세요"
 protests.10.c: "그들의 요구를 받아들여라."
 protests.11.t: "정치적 혼란"
 protests.11.d: "지금 정치 지형은 혼란에 빠져 있습니다. 정치적 권력의 중대한 손실과 잠재적인 손실이 훨씬 더 큰 위험한 플레이 사이에서 선택을 해야 합니다. 위험은 그 어느 때보다 높습니다."
 protests.11.a: "이건 넘어가겠다"
 protests.11.b: "구출하기 위해 방위군"
 protests.11.c: "그들의 요구를 받아들여라."
 protests.12.t: "신뢰의 붕괴"
 protests.12.d: "여당에 대한 신뢰가 급격히 무너지고 있다. 당의 인기를 더욱 떨어뜨리거나 정치권력을 완전히 붕괴시킬 수 있는 중대한 결정이 기다리고 있다. 국민은 숨죽여 지켜보고 있다."
 protests.12.a: "이건 넘어가겠다"
 protests.12.b: "무력 사용"
 protests.12.c: "그들의 요구를 받아들여라."
 protests.13.t: "연삭 정지"
 protests.13.d: "전국적으로 건설이 심각한 영향을 받고 있습니다. 위험이 커진 상황에서 정부는 지속적으로 속도를 대폭 줄일 것인지, 아니면 잠재적으로 파국적인 시위대와 협상할 것인지 결정해야 합니다."
 protests.13.a: "We can't address that right now"
 protests.13.b: "작업을 시행"
 protests.13.c: "그들의 요구를 받아들여라."
 protests.14.t: "워머신의 흔들림"
 protests.14.d: "군수생산이 위기에 처한 가운데 정부는 고민스러운 선택에 직면하게 됐다. 그들은 장기간에 걸쳐 생산량에 큰 영향을 미치는 조치를 시행하거나 훨씬 더 심각한 결과를 가져오는 도박을 해야 합니다."
 protests.14.a: "지금 당장은 그 문제를 해결할 수 없습니다"
 protests.14.b: "내 국가 방위군은 어디에 있나요?"
 protests.14.c: "그들의 요구를 받아들여라."
 protests.20.t: "한계점"
 protests.20.d: "수년간의 불안, 불만, 실패한 협상이 국가적 재앙의 순간으로 정점에 이르렀습니다. 불만의 웅얼거림으로 시작된 것이 혁명을 요구하는 귀청이 터질 듯한 외침으로 커졌고, 이제 거리는 갈등의 함성으로 가득 차 있습니다. 불안을 진압하고, 차이점을 조정하고, 질서를 회복하려는 노력에도 불구하고 정부의 노력은 결실을 맺지 못했습니다. 국민의 신뢰는 무너졌고, 인내심은 바닥났습니다. 국가는 분열되어 있고, 사회 구조는 찢겨져 있습니다. 선이 긋고 편이 선택됨에 따라 이웃은 이웃에게 등을 돌리고 이전 친구는 적이 됩니다. 시위자들은 무기를 들고 있고, 전투가 임박해 긴장감이 감돌고 있습니다. 국가 역사의 새로운 장이 곧 쓰여질 예정이며, 잉크는 피로 물들어 있습니다. 내전이 시작됩니다."
 protests.20.a: "갈등에 대비하다"
 econvent.13.t: "높은 부채로 인해 회사가 떠나다"
 econvent.13.d: "우리나라의 높은 부채-GDP 비율로 인해 국내 기업들이 문을 닫고 나라를 떠나게 만들고 있습니다. 부채를 줄이는 것이 필수적입니다. 그렇지 않으면 더 많은 업계가 떠나기로 결정할 수도 있습니다."
 econvent.13.a: "회사가 떠나도록 허가하자 "
 econvent.13.b: "회사를 사들이자"
 econvent.14.t: "민간산업에 투자하는 개인 투자자"
 econvent.14.d: "A number of private investors have decided to invest in a new Civilian Industry within the nation. The new upstart factory will bring jobs and more prosperity to our nation. The additional construction and production capacity will certainly help in getting us moving economically speaking."
 econvent.14.a: "놀랍군！"
 econvent.15.t: "민간 투자자들이 오피스 파크에 투자했습니다."
 econvent.15.d: "A group of private investors have decided to invest in a number of smaller scale third-party services"
 econvent.15.a: "놀랍군！"
 taiwan.13.b: "우리는 물러나지 않는다"
 hongkong_news.1.t: "홍콩, 광범위한 시위로 흔들려"
 hongkong_news.1.d: "중국이 홍콩의 행정장관을 보통선거로 선출할 가능성을 배제한 결정 이후, 중국 영토인 홍콩에서는 대규모 시위가 발생했습니다. [HKG.GetLeader]는 홍콩 정부가 홍콩 시민들이 평화롭고 합법적인 방법으로 의견을 표현할 권리를 존중하지만, 폭력과 무법은 용납되지 않을 것이라고 밝혔습니다. 현재 위기에 대한 중국의 반응은 아직 확인되지 않았으며, [CHI.GetLeader]는 최근 사건에 대해 언급하지 않았습니다."
 hongkong_news.1.d_limit: "중국이 홍콩 행정장관을 보통선거로 선출할 수 있는 조건을 후보자 사전 승인으로 제한하기로 결정한 이후, 중국 영토인 홍콩에서는 대규모 시위가 발생했습니다. [HKG.GetLeader]는 홍콩 정부가 홍콩 시민들이 평화롭고 합법적인 방법으로 의견을 표현할 권리를 존중하지만, 폭력과 무법은 용납되지 않을 것이라고 밝혔습니다. 현재 위기에 대한 중국의 반응은 아직 확인되지 않았으며, [CHI.GetLeader]는 최근 사건에 대해 언급하지 않았습니다."
 hongkong_news.1.d_reunification: "중국이 2047년까지 홍콩의 특별 지위가 사라지고 완전히 중국의 통제 하에 돌아갈 것이라고 발표한 이후, 홍콩에서는 대규모 시위가 발생했습니다. [HKG.GetLeader]는 홍콩 정부가 홍콩 시민들이 평화롭고 합법적으로 의견을 표현할 권리를 존중한다고 밝혔으나, 폭력과 무법 행위는 용납하지 않을 것이라고 말했습니다. 중국의 이번 위기에 대한 대응은 아직 밝혀지지 않았으며, [CHI.GetLeader]는 최근 사건에 대해 언급하지 않았습니다."
 hongkong_news.1.d_annexed: "중국의 논란이 된 홍콩 강제 병합 이후, 홍콩에서 대규모 시위가 발생했습니다. [HKG.GetLeader]는 홍콩 정부가 홍콩 시민들이 평화롭고 합법적으로 의견을 표현할 권리를 존중한다고 밝혔으나, 폭력과 무법 행위는 용납하지 않을 것이라고 말했습니다. 중국의 이번 위기에 대한 대응은 아직 밝혀지지 않았으며, [CHI.GetLeader]는 최근 사건에 대해 언급하지 않았습니다."
 hongkong_news.1.a: "흥미로운 전개로군."
 hongkong_news.1.b: "이는 우리에게 나쁜 소식이다."
 hongkong_news.2.t: "홍콩시위가 무산되다."
 hongkong_news.2.d: "Protests in the Hong Kong Special Administrative Region against recent Chinese actions have gradually declined in recent days and have virtually come to a stop. Police operations in the Chinese territory have met with no resistance, and many who had previously taken to the streets have returned to their homes. What this means for the relationship between China and a troubled territory that holds significantly different political values from the former remains to be seen. Perhaps one indicator for what is to come was a banner left by protesters in a prominent location in the city center which read \"We will be back\"."
 hongkong_news.2.a: "흥미로운 전개로군."
 hongkong_news.2.b: "그들도 자신의 행동이 무의미한걸 알고 있어."
 hongkong_news.3.t: "홍콩 시위 규모 확대"
 hongkong_news.3.d: "홍콩 영토 내 중국의 조치에 반대하는 시위가 급격히 증가했으며, 분석가들은 시위가 규모와 전술 면에서 새로운 단계에 접어들었다고 널리 의견을 모으고 있습니다. 중국과 홍콩 정부가 이 새로운 격화에 어떻게 대응할지에 대한 전망은 아직 불확실하지만, 두 정부의 고위 관계자들은 시위가 자신들의 이해관계에 미치는 영향에 대해 점차 불만을 표하고 있다고 전해지고 있습니다. 시위자들은 중국과 홍콩 정부가 그들의 요구 사항을 해결할 때까지 물러설 의사가 없다고 밝히고 있습니다."
 hongkong_news.3.a: "홍콩시민들은 조용이 안있을꺼야..."
 hongkong_news.3.b: "그들에게 옳은것은 집에 있는거다!"
 taiwan.15.t: "계속되는 파업"
 korea.8.t: "급진적인 한국 운동이 인기를 얻고 있다"
 korea.8.d: "Economic inequality in the Republic of Korea has contributed to growing dissatisfaction among the country's lower classes. Thousands of online activists have begun calling for greater equality through the establishment of community-level autonomy throughout the ROK. While the movement is leaderless and therefore lacks a central, clear message, the majority of its members seem to desire an abolition of the Korean state and the chaebols that it is tied to in favor of a system that distributes political and economic power among directly elected community-level representatives.\n\nThis new ideology, which rejects the foundational ideologies of both the ROK and the DPRK, represents a significant departure from the traditional politics of the South Korean radical left, which has either promoted leftist policies within South Korea's existing political system or called for the establishment of a North Korean-style state."
 korea.8.a: "대한민국에서 뭔가 벌어지고 있다..."
 korea.9.t: "남한 반란군의 도움 요청"
 korea.9.d: "남한에서 정부 전복을 목표하는 민족해방운동 대표자들이 DMZ에 새로운 전선을 열기 위해서 동맹을 요청하며 찾아왔습니다."
 korea.9.a: "그들에 투쟁에 함께 할 것이다!"
 korea.9.b: "우리는 옆에서 지켜볼 것이다."
 JUCHE_FACTION: "한국 반제국주의 전선"
 korea.10.t: "우리의 북한 보호 중단을 요구하는 대한민국"
 korea.10.d: "For quite some time now South Korea has endeavored to show that it is no longer a country beholden to US interests. Relations between our two countries are at an all-time high, while our relations with the North have stagnated for the most part. Now a South Korean delegation has come to request an end to the defense treaty between us and the North Koreans. If we agree to their request, we will no longer come to North Korea's aid in the event of an external invasion."
 korea.10.a: "우리는 동맹과 함께할 것이다!"
 korea.10.b: "북한은 우리가 보호할 가치가 없다."
 korea.11.t: "한국 군수산업체의 무기 구입"
 korea.11.d: "대한민국은 비교적 저렴한 가격에 고품질의 무기를 생산할 수 있는 것으로 잘 알려져 있습니다. 우리는 일부 무기를 구매할지 여부를 고려해야 하지만, 우리의 자금이 무한하지 않기 때문에 현명하게 선택해야 합니다."
 korea.11.a: "한국산 기갑 구입"
 korea.11.b: "한국산 자주포 구입"
 korea.11.c: "한국산 훈련기 구입"
 korea.11.e: "한국산 돌격소총 구입"
 korea.11.f: "제안을 거절해라."
 korea.12.t: "[FROM.GetName]의 무기 거래 동의!"
 korea.12.d: "이 나라의 대표들은 우리로부터 무기를 수입하기로 협정하여 우리의 수익과 국제적 영향력을 높였습니다."
 korea.12.a: "우리의 국제적 지위가 높아졌다!"
 korea.13.t: "일본의 2차 세계대전 만행을 함께 비판하는 중국과 한국"
 korea.13.d: "중국과 한국 정부는 이례적으로 일본의 전시 행동과 그에 따른 완전한 속죄를 거부하는 것을 비판하는 공동성명을 발표했습니다. 많은 언론들은 이러한 움직임이 북한에 대한 중국의 지지로부터 벗어나게 하기 위한 한국의 노력의 일부라고 해석했습니다. 평양또한 이러한 공동성명을 발표한 [KOR.GetLeader]와 [CHI.GetLeader]에 지지를 보냈으며 [NKO.GetLeader] 은 중국이 남한과 가까워지는 것에 대해 주목하고 있습니다."
 korea.13.a: "우리는 그들이 한 짓을 절대 잊지 않을 것이다."
 korea.13.b: "그들의 비판은 지겹다..."
 korea.13.c: "과거는 긴 그림자를 드리운다..."
 korea.14.t: "북한과의 방위조약을 폐지하는 중국"
 korea.14.d: "주한미군 철수에 이어 중국이 북한과의 방위조약 탈퇴에 합의해 북한의 거센 비난을 받고 있습니다. 이러한 움직임은 중국의 지지를 얻고 미국으로부터 자치를 과시하려는 한국 정부의 오랜 움직임에 따른 것입니다. 일각에서는 무력 통일의 길이 분명해진 지금 [KOR.GetLeader]측이 무력으로 북한을 탈환하기로 결정했다는 가설도 내놓고 있습니다."
 korea.14.a: "우리의 노력이 결실을 맺었다."
 korea.14.b: "우리는 너무 오래 북한을 용인해왔다."
 korea.14.c: "전쟁이 눈앞에 있나?"
 korea.15.t: "[KOR.GetLeader]의 일본에 대한 배상금 요구"
 korea.15.d: "몇 주간 한국 정부의 적대적인 언사와 한국 운동가들의 압력이 있었던 후, [KOR.GetLeader]은(는) 일본에 2차 세계대전 동안 저지른 일본의 전쟁 범죄 피해자들에게 배상금을 지불할 것을 요구했습니다. 독재자 박정희 정권 때 이 문제가 한국 정부와 해결되었다고 주장하는 일본은 예상대로 배상금 지급을 거부했습니다.\n\n이 사건이 한국인 피해자들에 대한 보상으로 이어지지는 못했지만, 많은 한국인들이 극도로 감정적인 국가적 대의에 대해 결집하면서 [KOR.GetLeader]의 정치적 입지를 강화시켰습다."
 korea.15.a: "언젠가 정의를 실현할 것이다."
 korea.15.b: "그들의 요구는 불합리하다!"
 korea.15.c: "그들과의 의견 차이가 해결될 수 있을까?"
 korea.16.t: "전쟁이다!"
 korea.16.d: "우리와 북괴 사이에 전쟁이 일어났습니다. 미국과의 합의에 따라, 우리는 이제 미군에게 전시 작전 통제권을 넘겨야 합니다."
 korea.16.a: "우리는 통제권을 이양해야 한다"
 korea.17.t: "종전"
 korea.17.d: "한반도에 평화가 찾아왔습니다. 이제 평시의 상태로 돌아왔으니 우리 군에 대한 통제권을 다시 행사할 수 있습니다."
 korea.17.a: "마침내 평화가 찾아왔다."
 korea.18.t: "의회 선거가 다가오며 시작되는 정당 운동"
 korea.18.d: "한 달여 앞으로 다가온 국회의원 선거를 앞두고 앞으로 4년 동안 의회에서의 과반수를 차지 하기 위해서라도 우리 당의 지지율 제고에 나서야 합니다."
 korea.18.a: "다수를 바라자!"
 korea.21.t: "결과 발표!"
 korea.21.a: "언제나 그렇듯이, 힘든 선거였습니다."
 korea.21.d_no: "안타깝게도, 두 정당 중 그 어느 곳도 의회의 여당을 충족하기 위한 의석수를 확보하지 못했습니다. 우리 정부는 논란이 많은 법안을 통과시키기 위해 여당 의원과 계속해서 싸워야 할 것입니다."
 korea.21.d_con_loss: "안타깝게도, 우리 정당은 의회의 여당을 충족하기 위한 의석수를 지켜내지 못했습니다. 자유주의 의원들은 노동 조합을 제한하고, 대기업을 지원하거나, 북한에 적대감을 가지는 법안의 통과를 거부할 것입니다."
 korea.21.d_lib_loss: "안타깝게도, 우리 정당은 의회의 여당을 충족하기 위한 의석수를 지켜내지 못했습니다. 보수주의 의원들은 대기업을 제한하고, 징병제및 정보 기관을 개혁하거나, 북한과의 화해를 위한 법안의 통과를 거부할 것입니다."
 korea.21.d_con_win: "다행히도, 우리 정당은 의회에서 과반수 이상의 의석을 확보하였습니다. 입법부와 관료들은 노동 조합을 제한하고, 재벌을 지원하며, 북한과의 부정적인 관계를 지속하는 다수의 보수적인 법안들을 통과시키는데 최선을 다할 수 있을 것입니다."
 korea.21.d_lib_win: "다행히도, 우리 정당은 의회에서 과반수 이상의 의석을 확보하였습니다. 입법부와 관료들은 재벌을 약화시키고, 안보 기관을 개혁하며, 북한과의 통일을 추구하는 다수의 자유주의 적인 법안들을 통과시키는데 최선을 다할 수 있을 것입니다."
 korea.22.t: "통일의 충격 본격화"
 korea.22.d: "The great nation of Korea has finally been reunited, after many decades of painful separation. However, our task of reintegrating the two halves is far from over. Many on both sides of the 38th parallel are dissatisfied with the way in which reunification took place, and the economic costs of reunifying two vastly different states are quickly becoming apparent. Should we fail in our task of reunifying the country, we may face the dissolution of our new-born nation."
 korea.22.a: "이제부터가 시작이다..."
 korea.23.t: "남한의 평화 제의에 대한 우리의 반응"
 korea.23.d: "몇 주간의 논의 끝에, 우리가 남조선의 평화 제안을 기꺼이 받아들일 것인지 결정할 때가 왔습니다. 우리는 남조선의 제의에 대한 진정성을 신뢰하는지는 물론, 평화협정에 동의하는 것이 언젠가는 무력으로 통일을 희망하고 있는 강경파들에게 어떻게 인식될지도 생각해야 합니다."
 korea.23.a: "우리는 조약에 동의할 것이다."
 korea.23.b: "우리 사이에는 평화는 없을 것이다!"
 korea.24.t: "한국 평화 협정 체결"
 korea.24.d: "분단된 한반도의 국가의 관계가 좋아짐에 따라, 남한의 [KOR.GetLeader] 과 북한의 [NKO.GetLeader] 는 서로 공식적인 평화의 정착을 위해 유명무실한 휴전 조약을 개정하기로 합의했습니다. 이 조약은 마침내 한국전쟁 이후 남북한 사이에 존재했던 적대 관계에 종지부를 찍었다는 것을 의미합니다. 비록 일부 언론들이 양측의 통일을 추구하려는 의지에 대해 의구심을 표했지만, 두 지도자들은 이 발전이 한반도를 통일로 가는 길로 이끌 것이라는 희망을 표현했습니다."
 korea.24.a: "한반도 앞에는 밝은 미래가 펼쳐져 있다!"
 korea.25.t: "남북간 논의 결렬"
 korea.25.d: "남한의 [KOR.GetLeader] 와 북한의 [NKO.GetLeader] 가 판문점에서 가진 회담은 양측의 다양한 의견 차이로 인해 결럴되었습니다. 일부 접점이 있었다는 점이 향후 회담 복귀에 대한 희망으로 이어졌지만, 당분간 남북 간 합의가 도출되지 않을 것은 분명합니다."
 korea.25.a: "평화를 이루어내는건 여전히 힘들군…"
 korea.26.t: "남한의 통일 제안"
 korea.26.d: "남북한의 전례 없는 관계 개선을 위해 남한은 분단된 조국을 통일하기 위해 우리와 협력하겠다고 제안하고 있습니다. 그러나 그들은 통일의 과정은 우리가 북한에서 발전시킨 독특한 정치 문화를 위협하는 요구인 남한 주도의 것이 될 것이라고 주장하고 있습니다."
 korea.26.d1: "남북한의 전례 없는 관계 개선을 위해 남한은 분단된 조국을 통일하기 위해 우리와 협력하겠다고 제안하고 있습니다. 통일에 대한 우리의 우려를 이해하고 있는 남한은 통일 이후 권력을 통일 정부를 통해 공유하고 남한뿐만 아니라 북한의 요소들을 통합하겠다고 제안했습니다."
 korea.26.a: "우리 나라가 완전해졌다!"
 korea.26.b: "이런 식으로는 통일은 불가능하다..."
 korea.27.t: "북한의 통일 조건 동의!"
 korea.27.d: "광범위한 협상 끝에, 북한은 우리 두 나라를 통일하기 위한 작업을 시작하기로 동의했습니다! 남북한의 관계가 안정되고 한반도의 재통합이 눈앞에 다가오면서, 한국인의 미래는 그 어느 때보다도 밝아 보입니다!"
 korea.27.a: "엄청난 소식이다!"
 korea.28.t: "북한의 통일 조건 거부!"
 korea.28.d: "Regrettably, [NKO.GetLeader] has chosen to put their own selfish position before that of the Korean people and rejected our offer to cooperate on reunifying the country. This rejection does not mean that we cannot make another attempt in the future, but it does mean that reunification will not occur in the near future. We must lay the groundwork to ensure that our next attempt will meet with greater success."
 korea.28.a: "한민족에게 슬픈 날이다..."
 korea.29.t: "China Requests Return of Volunteer Remains"
 korea.29.d: "베이징은 남한에서 수습된 중국인민지원군 인원의 유해를 반환해 달라고 공식적으로 요청했습니다. 요청을 승인하면 전사한 병사들이 중국으로 송환될 수 있습니다."
 korea.29.a: "인도를 승인한다."
 korea.29.b: "요청을 거부한다."
 korea.30.t: "중국으로 처음 인도된 인민의용군의 유해"
 korea.30.d: "한국은 강원도와 경기도에서 발굴된 중국인민지원군 유해의 첫 번째 수집분을 인도했습니다. 중국과 한국 대표들이 인천국제공항에서 인수인계서에 서명한 뒤, 중국 군용기가 유해를 싣고 귀환했습니다."
 korea.30.a: "전사자들을 기린다."
 korea.31.t: "Seventh Volunteer Remains Transfer"
 korea.31.d: "한국은 비무장지대 애로우힐에서 발굴된 유해 117구를 인도했습니다. 인천국제공항에서 열린 인도식에는 중국과 한국 관계자들이 참석했습니다."
 korea.31.a: "전사자들을 기린다."
 korea.33.t: "북한의 평화 제안에 대한 우리의 반응"
 korea.33.d: "몇 주간의 논의 끝에, 우리가 북한의 평화 제안을 기꺼이 받아들일 것인지 결정해야 할 때가 왔습니다. 우리는 북한의 제의에 대한 진정성을 신뢰하는지는 물론, 평화협정 체결이 북한 정권과 협상하는 것을 반대하는 우리 국민들에 의해 어떻게 인식될지도 고민해야 합니다."
 korea.34.t: "북한의 통일 제안"
 korea.34.d: "Seeking to capitalize on an unprecedented improvement in relations between the two Koreas, the North is offering to cooperate with us in order to reunify our divided nation. However, they are insisting that the process of reunification will be North-led, a demand that threatens the way of life that we have cultivated in the South."
 korea.34.d1: "남북한 간의 전례 없는 관계 개선을 위해 북한은 분단된 조국을 통일하기 위해 우리와 협력하겠다고 제안하고 있습니다. 통일에 대한 우리의 우려를 이해하고 있는 북측은 통일 이후 권력을 통일 정부를 통해 공유하자고 제안했고, 남한과 북한의 요소들을 통합했습니다."
 korea.35.t: "남한의 통일 조건 동의!"
 korea.35.d: "광범위한 협상 끝에, 남한은 두 나라를 통일하기 위한 노력을 시작하기로 동의했습니다! 남북한의 관계가 안정되고 한반도의 재통합이 눈앞에 다가오면서, 한국인의 미래는 그 어느 때보다도 밝아 보입니다!"
 korea.36.t: "남한의 통일 조건 거부!"
 korea.36.d: "Regrettably, [KOR.GetLeader] has chosen to put their own selfish position before that of the Korean people and rejected our offer to cooperate on reunifying the country. This rejection does not mean that we cannot make another attempt in the future, but it does mean that reunification will not occur in the near future. We must lay the groundwork to ensure that our next attempt will meet with greater success."
 migrant_event.1.t: "이주민 슬럼가"
 migrant_event.1.d: "우리의 주요 대도시들 인근 일부 지역에서 \"이주민 슬럼가\"라 불리는 지역이 개발되기 시작했습니다. 이곳은 국내에서 생계를 꾸려보려 애썼으나 낮은 임금과 이민자 수용국가에 거의 동화 되지 못한 탓에 빈민가로 내몰린 극도로 빈곤한 이주민과 피난민들이 모여 있는 지역입니다."
 migrant_event.1.a: "Break up the Slums"
 migrant_event.1.b: "원조 제공"
 migrant_event.1.c: "이민 대상 축소"
 migrant_event.2.t: "국가주의자들의 이민 정책에 대한 항의 시위"
 migrant_event.2.d: "한 그룹의 민족주의자들이 최근 국가로 이주한 이민자들에 반대하는 시위를 주요 도시 중 하나에서 조직했습니다. 이 시위는 이민자에 대한 추가 제한을 요구하며, 국가 내 이민과 이주에 대한 규제를 더욱 강화할 것을 촉구하고 있습니다."
 migrant_event.2.a: "데모 허용"
 migrant_event.2.b: "Break up the Demonstration"
 migrant_event.3.t: "강력범죄 혐의로 기소된 이민자"
 migrant_event.3.d: "일부 이민자 그룹이 국내에서 폭력 범죄 혐의로 기소됐고, 우리 경찰이 국내의 신규 이민자들을 대거 체포했습니다. 우익 시위대와 지지자들은 정부로 하여금 국경을 폐쇄하지 않아 발생한 결과라고 말하기 시작했습니다. 어떻게 대응해야 할까요?"
 migrant_event.3.a: "그들이 그렇게 말하긴 했지..."
 migrant_event.3.b: "Increase Police Funding."
 LibyaNews.1.a: "훌륭하군"
 Sudan.1.t: "남겨진 자들"
 Sudan.1.d: "Some of our territories on our southern border still have quite a large Christian and Animist population. Many people in those territories are upset that they have been excluded from the referendum of South Sudan. The dissent has grown larger and larger, and those people are now demanding to be joined together with [SSU.GetName], as they feel that under our government they do not get the proper representation."
 Sudan.1.a: "괜찮아, 우리는 그게 필요없어"
 Sudan.1.b: "그건 바로 우리 땅이야!"
 Sudan.2.t: "[DAR.GetNameDef]와의 동맹?"
 Sudan.2.d: "We are not the only ones fighting against the government. There are also rebels in Darfur. Perhaps we should promise them increased representation in the future Sudanese government if they ally with us?"
 Sudan.2.a: "요청 보내기"
 Sudan.2.b: "우리는 그들이 필요없다"
 Sudan.2.a.tt: "만약 그들이 승낙한다면\n"
 Sudan.3.t: "[FROM.GetNameDef]의 동맹 제안"
 Sudan.3.d: "우리는 [FROM.GetNameDef]로부터 동맹을 제안받았습니다. 그들은 현재 [SUD.GetAdjective] 정부와 싸우고 있기 때문입니다. 그들은 우리가 새로 구축 중인 수단 정부에서 더 많은 대표성을 가질 수 있도록 약속하고 있습니다. 우리는 어떻게 응답해야 할까요?"
 Sudan.3.a: "동의한다"
 Sudan.3.b: "우리는 그들이 필요없다"
 Sudan.4.t: "[FROM.GetNameDef]측이 우리의 동맹 요구를 승낙함"
 Sudan.4.d: "[FROM.GetNameDef] has agreed to form a common front against [SUD.GetLeader] together with us."
 Sudan.4.a: "훌륭해!"
 Sudan.5.t: "[FROM.GetNameDef]측이 우리의 동맹 요구를 거절함"
 Sudan.5.d: "[FROM.GetNameDef] has refused to form a common front against [SUD.GetLeader] together with us."
 Sudan.5.a: "자기들 손해다"
 Sudan.6.t: "[FROM.GetNameDef]와 [DAR.GetNameDef]가 협력하다"
 Sudan.6.d: "[FROM.GetNameDef]와 [DAR.GetNameDef]는 우리에 맞서 싸우기 위해 공동 전선을 형성했습니다."
 Sudan.6.a: "젠장"
 SudanNews.1.d: "남쿠르두판과 청나일에서의 충돌이 마침내 끝났습니다. [FROM.GetLeader]은/는 충돌에서의 승리를 주장했습니다. 앞으로 이 나라가 어떤 방향으로 나아갈지는 두고 봐야 할 것입니다."
 SudanNews.2.t: "남쿠르두판과 청나일에서의 충돌"
 SudanNews.2.d: "포괄적 평화 협정 이후, [SUD.GetName] 지역의 기독교 및 애니미즘 신앙을 가진 주민들이 거주하는 일부 지역은 남수단 독립 국민투표 대상에서 제외되었습니다. 이 지역 주민들은 협정 이후 [SUD.GetAdjective] 정부에 점점 더 염증을 느끼게 되었습니다. 그들은 현 정부에서 자신들의 대표성이 부족하다고 느끼며, 결국 정부에 대항하여 무장 봉기를 일으켰습니다."
 SudanNews.2.a: "흥미롭군"
 SouthSudan.1.t: "남수단 독립 국민투표"
 SouthSudan.1.d: "남수단 사람들이 독립을 위해 투표하는 날이 다가왔습니다. 수단에 거주하는 일부 사람들은 국민투표 지역에서 제외된 것에 불만을 품고 있지만, 우리는 대부분의 기독교인과 정령신앙인 인구층을 포함시켰습니다. 이는 두 수단 모두에게 평화와 번영의 새로운 전환점이 될 것입니다."
 SouthSudan.1.a: "그리고 승자는..."
 SouthSudan.4.t: "[FROM.GetNameDef]의 지원 요청"
 SouthSudan.4.d: "우리의 오랜 동맹인 [FROM.GetLeader]가 [SUD.GetNameDef]에 맞서 싸우는 데 군사 지원을 요청했습니다. 그는 군사지원 없이는 그들의 전쟁에 기울이는 노력이 무너질 것이라고 전했습니다. 80년대 후반, 우리 군이 남수단 전투에 참여했지만, 콩고 분쟁으로 인해 우선순위를 조정해야만 했습니다. 콩고는 이제 해결됐으니, [FROM.GetLeader]에 무언가 지원할 수 있지 않을까요?"
 SouthSudan.5.t: "[FROM.GetNameDef]가 우리를 지원함"
 SouthSudan.5.d: "[FROM.GetLeader]이/가 우리를 돕는데 동의했습니다. [FROM.GetAdjective]의 부대가 조만간 국경을 넘을 겁니다."
 SouthSudan.5.a: "완벽해!"
 SouthSudan.6.t: "[FROM.GetNameDef] 측이 후퇴하다"
 SouthSudan.6.d: "[FROM.GetLeader] 측에서는 이미 지원한 것 이상으로는 더 이상 지원할 여력이 없다고 밝혔습니다."
 SouthSudan.6.a: "젠장"
 SouthSudan.7.t: "[FROM.GetNameDef] 토지 양도 의사 있음"
 SouthSudan.7.d: "[SUD.GetNameDef]는 현재 내전에 휩싸여 있습니다. [SSU.GetName]의 상대 진영은 우리에게 거래를 제안했습니다. 일레미 삼각지대의 완전한 통제권을 우리에게 넘겨주는 대신, 우리가 그들의 군수품 보급망 구축을 도와준다는 것입니다. 이 제안을 받아들여야 할까요?"
 SouthSudan.7.a: "물론이지"
 SouthSudan.7.b: "우리는 관심 없다"
 SouthSudan.8.t: "[FROM.GetNameDef]의 거래 승낙"
 SouthSudan.8.d: "[FROM.GetLeader]는 우리 군사 작전을 지원하는 대가로 일레미 삼각지대의 통제권을 넘겨받기로 합의했습니다."
 SouthSudan.8.a: "완벽해!"
 SouthSudan.9.t: "[FROM.GetNameDef]의 거래 거부"
 SouthSudan.9.d: "[FROM.GetLeader]는 일레미 삼각지대 제안을 거절했습니다. 그들은 이 조치가 [SUD.GetNameDef]로부터 어떤 불이익을 초래할 것을 우려하고 있습니다."
 SouthSudan.9.a: "젠장"
 SouthSudan.10.t: "콩고 반군, 국경을 넘어"
 SouthSudan.10.d: "We've received reports of large armed groups that have crossed the border from [DRC.GetNameDef] and have attacked the towns of Yambio and Yei. It seems that these groups have been equipped and hired by the [SUD.GetAdjective] government. The opposition of [DRC.GetName] against [UGA.GetName] has given them motivation to allow this border crossing to happen."
 SouthSudan.10.a: "빌어먹을 콩고!"
 SouthSudan.11.t: "국민투표 준비하기"
 SouthSudan.11.d: "북수단과 남수단 사이의 평화협정이 서명된 후, 양측은 국민투표를 준비하기 시작했습니다. 현재 예측에 따르면 대다수의 [SSU.GetAdjective] 국민은 강경한 무슬림의 통치를 원치 않기 때문에 독립에 투표할 것으로 예상됩니다. 하지만, 정치적 간섭과 정부 주요 요인에 대한 통제가 이뤄진다면 북수단이 다시 남수단을 장악할 수도 있습니다."
 SouthSudan.11.a: "대비가 필요하다"
 SouthSudan.11.tooltip: "남수단 주민들이 수단 잔류에 투표할 가능성은 §Y[SSU.GetNameWithFlag] 내 [SUD.GetAdjective] 영향력에 0.75를 곱한 값§!입니다. [SSU.GetNameWithFlag] 내 [SUD.GetAdjective] 영향력이 §Y20% 미만§!이면 국민투표는 항상 §Y독립§!으로 끝납니다."
 SouthSudan.12.t: "[FROM.GetNameDef]의 독립"
 SouthSudan.12.d: "[FROM.GetName] has held their independence referendum in the territories they controlled. The results for independence were a resounding 99.83% in favour. Surprisingly, there was very little electoral violence predating the vote, and generally the elections were seen as having been fair."
 SouthSudan.12.a: "이제 안녕인가 보다"
 SouthSudan.13.t: "[FROM.GetNameDef], 통합을 선호"
 SouthSudan.13.d: "[FROM.GetName](이)가 통제하던 지역에서 독립 국민투표를 실시하였습니다. 접전이었으나 수단 잔류 찬성표가 54%로 승리하였습니다. 많은 남수단인들은 수단으로부터의 분리를 시도하면 내전만 다시 불붙일 것이라는 두려움을 표명했습니다."
 SouthSudan.13.a: "환영합니다！"
 SouthSudan.14.t: "[ROOT.GetLeader]의 헬리콥터 추락"
 SouthSudan.14.d: "For the weekend, our president [ROOT.GetLeader] had gone to meet his long time ally [UGA.GetLeader]. He had not told the [SUD.GetAdjective] government about this trip, and instead had lied that he was on holiday in New Kush. [ROOT.GetLeader] however, never made it back home. On his return flight, his helicopter crashed into a mountain range in Southern Sudan killing him, six of his colleagues and seven [UGA.GetAdjective] crew members. Our government is scrambling to solve the matter of succession, but it is likely that [ROOT.GetLeader]'s deputy Salva Kiir Mayardit will take office."
 SouthSudan.14.a: "평화협정 체결 후 몇 달 만에? 수상하군..."
 SouthSudan.15.t: "쿠데타 소문"
 SouthSudan.15.d: "내전 당시 우리 동맹 중 하나가 우리 정부를 전복하려 한다는 소문이 돌고 있습니다. 이 소문을 일축할 수도 있겠지만, 현재 우리 군대가 수십 개의 소규모 반군 집단으로 구성되어 있다는 점을 고려하면 누군가 정권을 잡으려 할 가능성이 매우 높습니다. 우리는 어떻게 해야 할까요?"
 SouthSudan.15.a: "우리의 동맹은 충성스럽다"
 SouthSudan.15.b: "장군들을 숙청하라! 경찰도! 모두 다!"
 SouthSudan.15.a.tt: "내전이 발생할 경우, 반대 세력은 우리 측보다 §Y강력§!합니다"
 SouthSudan.15.b.tt: "내전이 발생할 경우, 반대 세력은 우리 측보다 §Y약합§!니다"
 SouthSudan.16.t: "이름에 무엇이 담겨 있는가?"
 SouthSudan.16.d: "이제 독립했으니 국명을 무엇으로 할지 결정해야 합니다. 대중으로부터 여러 제안이 접수되었으며, 남수단이 가장 유력한 후보입니다. 그러나 다른 이름을 선택할 수도 있습니다"
 SouthSudan.16.a: "남수단이 좋다"
 SouthSudan.16.b: "우리의 역사를 기억하기 위해 아자니아로"
 SouthSudan.16.c: "나일 공화국이 가장 적합하다"
 SouthSudan.16.dd: "쿠시 공화국이 최고다"
 SouthSudanNews.1.d: "[SSU.GetNameDef]의 내전이 끝났습니다. 전쟁은 이 나라가 [SUD.GetNameDef]와(과)의 문제를 마무리한 지 얼마 지나지 않아 여러 반군 집단 간의 권력 투쟁 끝에 시작되었습니다. 이제 이 나라는 재건을 시작할 수 있을지도 모릅니다."
 SouthSudanNews.2.t: "포괄적 평화 협정"
 SouthSudanNews.2.d: "[SUD.GetAdjective] 세력과 [SSU.GetAdjective] 세력은 제2차 수단 내전을 종식시키는 평화 협정에 도달했습니다. 정부간개발기구 협상단의 도움으로 양측은 [SSU.GetNameDef]에 [SUD.GetAdjective] 정부 아래 자치권을 부여하는 틀에 합의했습니다. 양측은 6년 이내에 [SSU.GetNameDef]의 완전한 독립에 대한 국민투표를 실시하기로 합의했습니다. 이 협정은 마침내 이 지역의 수십 년 묵은 민족 분쟁을 해결할지도 모릅니다."
 SouthSudanNews.3.t.SUD: "남수단 반군 진압"
 SouthSudanNews.3.t.SSU: "새로운 수단의 탄생"
 SouthSudanNews.3.d.SUD: "[SUD.GetAdjective] 정부가 국가 남부의 반군을 진압하면서 [SUD.GetAdjective] 민족 분쟁의 최신 국면이 막을 내렸습니다. 이로써 [SUD.GetLeader]은(는) 남부 기독교도와 정령 숭배자 주민들의 큰 반감 속에서도 나라의 이슬람화와 아랍화를 계속 추진할 수 있게 되었습니다."
 SouthSudanNews.3.d.SSU: "[SUD.GetAdjective] 민족 갈등의 최신 에피소드가 끝을 맺었습니다. 남수단 반군이 정부를 전복시킨 것입니다. 이전 [SUD.GetAdjective] 지도자 [SUD.GetLeader]는 구금되어 인권 침해와 전쟁 범죄로 재판을 기다리고 있습니다. 새로운 정권은 자유롭고 평등한 수단을 약속하고 있지만, 많은 분석가들은 반군 지도자로서의 임기 동안 [SSU.GetLeader]가 이미 모든 반대 의견을 억압하려는 조치를 취했다고 지적하고 있습니다."
 SouthSudanNews.3.a: "흥미롭군"
 SouthSudanNews.4.t.independence: "[FROM.GetNameDef]가 독립을 선언했습니다."
 SouthSudanNews.4.t.autonomy: "[FROM.GetNameDef]는 여전히 [SUD.GetNameDef]의 일부로 남아 있습니다."
 SouthSudanNews.4.d.independence: "[FROM.GetNameDef]는 [SUD.GetName]과의 평화 협정에 따라 독립 국민투표를 실시했습니다. 그 결과, 두 국가의 분리를 지지하는 98%라는 놀라운 결과가 나왔습니다. 이로써 [SSU.GetName]은 아프리카에서 가장 어린 국가가 되었습니다."
 SouthSudanNews.4.d.autonomy: "[FROM.GetNameDef]는 [SUD.GetName]과의 평화 협정에 따라 독립 국민투표를 실시했습니다. 결과는 거의 동률에 가까웠지만, [SUD.GetName]과의 통합을 지지하는 옵션이 53%로 승리했습니다. [SSU.GetName]이 [SUD.GetName]과 분리될 경우 전쟁이 재발할 것이라는 우려가 유권자들에게 통합을 지지하게 만든 것으로 추측됩니다. 그럼에도 불구하고, [SSU.GetName]은 일부 자치를 부여받았으나, 이 자치가 얼마나 오래 지속될지는 지켜봐야 할 일입니다."
 SouthSudanNews.4.a: "흥미롭군"
 SouthSudanNews.5.t: "[SSU.GetNameDef]에서의 내전"
 SouthSudanNews.5.d: "[SSU.GetName]의 젊은 국가에서 내전이 시작되었습니다. [SUD.GetName]과의 갈등을 끝낸 지 불과 몇 년 만에 다시 갈등이 시작된 것입니다. 이제 더 이상 공통의 적이 없어진 반군 그룹들 사이에서 권력 투쟁이 벌어지고 있는 것으로 보입니다."
 SouthSudanNews.5.a: "흥미롭군"
 war_in_darfur_threat: "다르푸르 분쟁"
 Darfur.2.t: "다르푸르 반란군, 골로 공격"
 Darfur.2.d: "다르푸르 해방전선(Darfur Liberation Front)과 정의와 평등 운동(Justice and Equality Movement)에 속한 반군 그룹이 카브카비야 바로 남쪽에 위치한 제벨 마라 지역의 본거지인 골로 마을을 공격했습니다. 이 공격은 지역 경찰서, 군 초소, 군 수송 대에 대한 소규모 충돌에 이어 발생했습니다. 반군들은 [SUD.GetLeader]의 지역 내 아랍화 정책에 지쳤으며, 그들의 퇴진을 요구하고 있습니다."
 Darfur.2.a: "젠장"
 Darfur.3.t: "다르푸르 반군, 차드 국경 폐쇄"
 Darfur.3.d: "다르푸르 해방전선(Darfur Liberation Front)과 정의와 평등 운동(Justice and Equality Movement)에 속한 반군 그룹이 차드 국경 근처의 티네(Border Town)를 점령했습니다. 이 과정에서 반군들은 대량의 무기와 보급품을 압수했습니다. 반군들은 다르푸르 문제에 동조하는 많은 부족들이 거주하는 차드와의 연결을 시도하고 있습니다."
 Darfur.3.a: "젠장"
 Darfur.4.t: "다르푸르 반란군, 알파시르 습격"
 Darfur.4.d: "이른 아침, 다르푸르 해방전선(Darfur Liberation Front)과 정의와 평등 운동(Justice and Equality Movement) 반군들이 엘파셔의 잠들어 있던 군 기지를 공격했습니다. 몇 시간 내에 지역 공군 기지에서 여러 대의 군용 항공기가 파괴되었고, 75명의 군인이 사망하고 32명이 포로로 잡혔습니다. 반군들은 공군 기지의 사령관이었던 대장도 포로로 잡는 데 성공했습니다. 이는 우리 군에게 큰 후퇴를 의미하며, 여러 군 부대가 반군의 공격을 두려워해 자리를 떠났습니다."
 Darfur.4.a: "젠장"
 DarfurNews.1.t: "다르푸르 분쟁이 시작되다"
 DarfurNews.1.d: "수십 년간 [SUD.GetAdjective] 정부의 강제 아랍화 정책이 결국 폭발 지점에 이르렀습니다. 다르푸르 해방전선(Darfur Liberation Front)과 정의와 평등 운동(Justice and Equality Movement) 두 반군 그룹은 갈등을 저수준의 반란에서 전면적인 전쟁으로 확대시켰습니다. [SUD.GetName] 정부가 이 반군들을 처리할 수 있을지는 시간이 지나면 알게 될 것입니다."
 DarfurNews.1.a: "흥미롭군"
 DarfurNews.2.t: "[DAR.GetNameDef] 자치권 부여"
 DarfurNews.2.d: "[DAR.GetAdjective] 반군과 [SUD.GetAdjective] 정부군 간의 수년 간의 갈등 끝에, 양측은 평화 협정을 체결하기로 합의했습니다. [DAR.GetName]은 [SUD.GetName] 하에 제한된 자치를 부여받게 되며, 이는 그들이 차별을 받지 않도록 보호할 것입니다. 시간이 지나면 [SUD.GetLeader]가 이 협정을 지킬 계획이 있는지 알게 될 것입니다."
 DarfurNews.2.a: "흥미롭군"
 DarfurNews.3.t: "[DAR.GetNameDef]가 독립을 선언했습니다."
 DarfurNews.3.d: "After years of conflict between the [DAR.GetAdjective] rebels and [SUD.GetAdjective] government forces, the [DAR.GetAdjective] forces have managed to come out on top. After successful incursions from Darfur into Sudan proper, the [SUD.GetAdjective] government had no options but to give concessions to the [DAR.GetAdjective] rebels. The nation of [DAR.GetName] has now been given full independence, but time will tell whether [SUD.GetName] is just using this as an opportunity to rebuild their forces."
 DarfurNews.3.a: "흥미롭군"
 corruption.16.t: "부패 증가"
 corruption.16.d: "다른 나라의 스파이와 요원들이 우리나라에 개입하여 부패 수준을 높였습니다. 이는 표적 뇌물, 협상, 국내에 잘 배치된 전복 요원 등 다양한 경로에서 비롯됩니다."
 corruption.16.a: "유감이다"
 Israel.1111.t: "제3차 인티파다 소문"
 Israel.1111.d: "팔레스타인의 영향력 있는 이슬람주의 단체인 하마스(Hamas)는 금요일부터 이스라엘에 대한 새로운 봉기를 촉구했습니다. 목요일 가자지구에서 하마스의 지도자인 이스마일 하니야(Ismail Haniyeh)는 \"우리는 시온주의 적에 맞서 봉기를 촉구하고 이를 실행해야 한다\"고 말했습니다. 그는 또한 \"우리는 이번 봉기가 계속 이어지길 원하며, 트럼프와 점령 세력이 이번 결정을 후회하게 만들고 싶다\"고 덧붙였습니다."
 Israel.1111.a: "오 이런..."
 Israel.1112.t: "이스라엘, 전쟁 위협"
 Israel.1112.d: "골란 고원에서의 이스라엘과의 동결된 분쟁으로 인해, 이스라엘은 우리가 영유권 주장을 철회하지 않으면 선전포고하겠다고 위협하였습니다!"
 Israel.1112.a: "골란에 대한 영유권 주장을 철회한다"
 Israel.1112.b: "전쟁!"
 restart_boardcross_expenditure: "모든 부문의 지출을 재시작합니다"
 god_of_war_event.1.t: "도전할 준비가 되셨습니까?"
 god_of_war_event.1.d: "일반적으로 가장 기본적인 보너스를 제외하면 MD의 AI는 반칙을 쓰지 않습니다. AI는 차량과 사단에 대해 롤플레이식 설계를 따르지만, 이 옵션을 사용하면 AI가 반칙을 쓰게 됩니다.\nAI는 장비와 사단을 허공에서 만들어 내며, 일반적으로 플레이어에게 더 거세게 저항하려 할 것입니다. 이것은 최후의 승리(Endsieg) 같은 경험은 아닙니다. AI는 플레이어를 압도하는 것이 아니라 도전하도록 만들어졌습니다.\n\n추신: 이 AI를 이겨도 자랑할 자격은 여전히 주어지지 않습니다."
 god_of_war_event.1.a: "덤벼라!"
 god_of_war_event.1.b: "AI가 나를 더 집중적으로 노리게 하라!"
 md4.21.t: "[FROM.GetName]-[Root.GetName] EAEU 통합"
 md4.21.d: "[FROM.GetNameDef](이)가 EAEU 가입을 허가해 달라고 요청하고 있습니다. 우리는 그들에 대한 수출과 그들로부터의 수입에서 우선권을 얻게 되며, 서로의 경제를 더욱 긴밀하게 통합하게 될 것입니다."
 md4.21.a: "서명한다！"
 md4.21.b: "거절한다."
 md4.22.t: "우리의 EAEU 가입에 서명한 [FROM.GetNameDef]!"
 md4.22.d: "[FROM.GetNameDef](이)가 우리의 EAEU 가입을 허용하겠다는 제안을 수락했습니다."
 md4.22.a: "양국 모두에 번영을 가져다줄 것입니다!"
 md4.23.t: "우리의 EAEU 가입 제안을 거절한 [FROM.GetNameDef]"
 md4.23.d: "[FROM.GetNameDef](이)가 자유 무역 협정을 체결하자는 우리의 제안을 거절했습니다."
 md4.23.a: "그들은 우리의 우수한 제품을 두려워하는 것입니다!"
 EUR_idea_eacu_cooperation: "EAEU 협력"
 EUR_idea_eacu_cooperation_desc: "유라시아 관세 동맹(본래는 유라시아 경제 공동체)은 대부분의 구소련 국가 사이의 경제적 유대를 증진합니다. 이 동맹은 역내로 들어오는 모든 상품에 공통 대외 관세를 부과하며, 무역 협정과 협상을 진행할 때에는 하나의 단일 주체로서 행동합니다."
 EUR_idea_eacu_cooperation_2: "EAEU 통합 협력"
 EUR_idea_eacu_cooperation_2_desc: "유라시아 관세 동맹(본래는 유라시아 경제 공동체)은 대부분의 구소련 국가 사이의 경제적 유대를 증진합니다. 이 동맹은 역내로 들어오는 모든 상품에 공통 대외 관세를 부과하며, 무역 협정과 협상을 진행할 때에는 하나의 단일 주체로서 행동합니다."
 influence.1.c: "GDP의 15%를 경제 원조로 보낸다."
 influence.1.e: "다시 생각해 보니 그들에게 필요하지 않다."
 Cameroon.2.t: "선박 난파"
 Cameroon.2.d: "승객 150명을 태운 배가 나이지리아의 오롱 항에서 가봉의 장티 항으로 향하던 중 전복되었습니다. 승객 100명 이상이 사망한 것으로 추정되며, 나머지는 난파선 잔해에 매달린 채 위독한 상태입니다. 지금 이 순간에도 현지 어부들과 크리비 시 소재 카메룬 당국이 추가 생존자를 찾아 바다를 샅샅이 수색하고 있으나, 상황은 점점 더 암담해지고 있습니다...\n\n우리는 생존자들의 치료비를 지불하겠다고 제안하거나, 망자의 영혼과 생존자의 회복을 위한 기도의 날을 정할 수 있습니다."
 Cameroon.2.a: "치료비를 지불해야 한다"
 Cameroon.2.b: "기도의 날이 적절하다"
 world_war.1.t: "정해진 경로의 세계대전 활성화"
 world_war.1.d: "밀레니엄 던은 전통적으로 샌드박스 지향 모드였으며, 따라서 다른 모드들처럼 세계대전을 정해진 경로로 몰아가는 것과는 거리가 있었습니다. 이 옵션은 전쟁 중심의 플레이 스타일에 대한 커뮤니티 일부의 욕구를 충족시키기 위해 만들어졌습니다. 이 게임 규칙은 MD의 원칙을 염두에 두고 만들어졌으며, 따라서 플레이하는 국가에 따라 세계대전이 시작되는 시나리오가 다릅니다. 전쟁은 전쟁을 준비할 시간을 가질 수 있도록 2014년경에 시작됩니다."
 world_war.1.a: "알겠다"
 world_war.2.t: "중국, 대만에 대한 군사 행동 개시"
 world_war.2.d: "인민해방군은 중화민국에 대한 작전을 개시한다고 발표하였으며, 이는 중국 내전의 재개를 의미합니다. 우리 정보기관이 포착하지 못한 일은 아니었지만, 우리는 중국이 미국의 보복 가능성 앞에서 자제할 것이라 믿을 이유가 있었습니다."
 world_war.2.a: "[CHI.GetName](이)가 우리의 레드라인을 넘었다"
 world_war.2.b: "아시아의 문제는 아시아인의 문제다"
 world_war.3.t: "미국의 대중국 개입"
 world_war.3.d: "[USA.GetLeader]은(는) 오늘 미군에 [CHI.GetName]에 대한 전면 동원을 준비하도록 명령했다고 발표했습니다. 이는 중국의 대만 공격과 중국 내전의 재개에 따른 것입니다. 중국은 침공의 이유를 밝혔으나, 미국은 이번 개입의 주된 목적이 '미국은 침략자가 누구든 항상 동맹국을 지지한다'는 것을 보여주기 위한 것이라고 밝혔습니다. 이번 개입이 지역 내 추가 확전으로 이어질 것이라는 우려가 퍼지고 있으며, 일각에서는 이를 제3차 세계대전의 시작이라 부르고 있습니다."
 world_war.3.a: "우려스럽다"
 world_war.4.t: "중국에 주의를 빼앗긴 미국"
 world_war.4.d: "워싱턴의 제국주의자들이 중국의 우리 파트너들을 상대로 한 작전을 시작했습니다. 이를 고려하면 우리 눈앞에 절호의 기회가 있습니다. 그들이 중국에 주의를 빼앗긴 사이, 우리는 진격하여 한때 우리 것이었던 한반도 전체를 되찾을 능력이 있습니다."
 world_war.4.a: "이런 기회를 놓칠 수는 없다"
 world_war.4.b: "너무 위험하다"
 world_war.5.t: "아시아 분쟁 확대"
 world_war.5.d: "아시아의 전쟁이 확대되어, 북한 정부가 한반도 전체를 조선민주주의인민공화국의 통치 아래 재통일하려는 시도로 대한민국을 공격하였습니다. 조선민주주의인민공화국의 이러한 움직임에 일본이 대한민국에 병력을 파견하여 대응하면서, 예상보다 훨씬 더 큰 전쟁이 시작되었습니다. 중국에서 시작된 전쟁이 이제 동아시아 대부분을 빠르게 집어삼키면서 세계는 숨을 죽이고 지켜보고 있습니다. 특히 유럽과 아프리카를 비롯한 전 세계 국가들은 오늘날 세계에 만연한 혼란과 불안정의 결과로 유럽에 또 다른 전장이 열릴 수 있다는 우려 속에서 아시아의 폭력을 규탄하고 있습니다."
 world_war.5.a: "제3차 세계대전이 도래했다"
 world_war.6.t: "한국에서의 전쟁"
 world_war.6.d: "조선민주주의인민공화국이 대한민국에 불법적으로 선전포고하면서 지역의 전쟁을 확대시켰습니다. 이러한 움직임은 우리가 수십 년간 힘겹게 지켜온 질서를 위협하며, 국민 사이에서 행동을 촉구하는 목소리가 높아지고 있습니다. 우리는 어떤 방식으로든 한국을 지원하여 우리의 친구와 원칙을 지켜야 합니다."
 world_war.6.a: "북한은 오늘 중대한 실수를 저질렀다"
 world_war.6.b: "개입할 수 없다"
 world_war.7.t: "러시아, 서쪽으로 진격"
 world_war.7.d: "러시아 정부가 서쪽으로 진격하여 우크라이나를 상대로 전면전을 시작했습니다. 이러한 확장은 유럽 대륙의 운명이 불확실하며, 우리가 러시아인들에게 유럽이 집어삼켜질 파이가 아니라는 것을 보여줄 때까지 불확실할 것이기에 우리 군 지휘부와 동맹국들을 크게 우려하게 만들고 있습니다."
 world_war.7.a: "러시아는 이번에 선을 넘었다"
 world_war.7.b: "전쟁의 위험을 감수할 수 없다"
 world_war.8.t: "유럽에서의 전쟁"
 world_war.8.d: "러시아의 우크라이나 침공 이후, 나토군이 러시아군에 맞서기 위해 우크라이나로 이동하는 모습이 목격되었습니다. 공중과 해상 교전 보고가 이미 쏟아지고 있어 유럽에서 더 큰 전쟁의 시작을 알리고 있습니다. 나토군이 현재 유럽 전역에서 러시아군과 교전 중이기에 전 세계 국제기구들은 이 분쟁을 제3차 세계대전이라 부르기 시작했습니다. 핵보유국 거의 전부가 현재 서로 전쟁 중이며, 핵 교환에 대한 우려가 계속 커지고 있습니다. 세계가 끝장날지는 아무도 알지 못하지만, 한 가지는 확실합니다. 다음 세계 질서는 분명 다극적이지 않을 것입니다."
 world_war.8.a: "역사는 다시 한번 쓰인다"
 world_war.9.t: "세계에서의 우리의 야망"
 world_war.9.d: "오늘 미국인, 중국인, 일본인은 서로 간에 거대한 분쟁에 휘말려 있습니다. 유럽인들이 전쟁에 관여하면서 우리 정부는 유럽의 동진, 즉 우리 국경으로의 확장을 점점 더 우려하고 있습니다. 군 지휘부는 미래에 있을지 모를 유럽의 기습 공격을 막기 위해 우크라이나로 진격할 것을 제안했습니다."
 world_war.9.a: "그들의 조언에 귀 기울인다"
 world_war.9.b: "추측에 기반한 전쟁의 위험을 감수할 수 없다"
 world_war.10.t: "중동에서 전쟁 발발"
 world_war.10.d: "이란의 이스라엘에 대한 여러 차례 타격 이후, 이스라엘 국방군은 동맹국들에게 이란 정부를 전복하고 해체할 것을 호소했습니다. 세계를 바꾸는 이 사건은 전문가들이 제3차 세계대전이라 부르는 더 큰 전쟁의 또 하나의 부분이며, 이제 또 다른 전장이 생겨나고 있습니다. 이란과 이스라엘 사이의 경쟁은 새로운 것이 아니며, 1979년 이란 이슬람 혁명 이후 시작되었습니다. 이란이 핵무기를 보유하고 있는지는 알려져 있지 않으나, 저항의 축과 이스라엘 사이의 핵 교환 가능성에 대한 우려가 있습니다. 제3자가 이러한 분쟁에 개입할지는 현재 알 수 없으나, 이 전쟁이 중동과 세계 석유 시장의 잠재적 파괴를 초래할 수 있다는 점은 분명합니다."
 world_war.10.a: "안전한 곳이 있기는 한가?"
 world_war.11.t: "쿠드스의 해방"
 world_war.11.d: "미국과 세계의 다른 강대국들이 소모전에 정신이 팔려 있는 지금, 마침내 우리에게는 이스라엘을 공격하고 시오니스트 정권을 끝장낼 충분한 기회가 생겼습니다. 이러한 공격은 우리 두 국가의 파괴로 이어질 수도 있지만, 지금이 아니면 영영 기회가 없습니다."
 world_war.11.a: "공격하라!"
 world_war.11.b: "전쟁의 위험을 감수할 수 없다"
 taiwan.17.t: "새 수도 선정"
 taiwan.17.d: "우리가 승리의 결실을 음미하는 동안, 우리는 행정 수도를 대륙 쪽으로 이전하는 것에 대해 생각하기 시작해야 합니다. 타이베이는 중국 본토의 주요 인구 중심지에서 너무 멀리 떨어져 있어, 그 결과 국가를 효과적으로 통치하는 우리의 능력이 갈수록 어려워졌습니다. 따라서 우리의 수도는 다음이 될 것입니다..."
 taiwan.17.a: "베이징"
 taiwan.17.b: "상하이"
 taiwan.17.c: "충칭"
 taiwan.17.d1: "변함없이 타이베이"
 taiwan.17.e: "난징"
 city_captured.12.t: "바이도아 함락"
 city_captured.12.d: "[FROM.GetName]의 병력이 최후의 방어선을 돌파하여 전략 도시 바이도아를 점령하였으며, 짧지만 격렬한 교전 끝에 도시는 포위되어 유린당했습니다. 도시는 폐허가 되었지만, 이들은 이 힘겹게 얻은 전투의 승리를 밤새 축하할 것입니다."
 city_captured.12.a: "흥미롭군"
 city_captured.13.t: "키스마요 함락"
 city_captured.13.d: "[FROM.GetName]의 병력이 최후의 방어선을 돌파하여 전략 도시 키스마요를 점령하였으며, 짧지만 격렬한 교전 끝에 도시는 포위되어 유린당했습니다. 도시는 폐허가 되었지만, 이들은 이 힘겹게 얻은 전투의 승리를 밤새 축하할 것입니다."
 city_captured.13.a: "흥미롭군"
 city_captured.14.t: "갈카요 함락"
 city_captured.14.d: "[FROM.GetName]의 병력이 최후의 방어선을 돌파하여 전략 도시 갈카요를 점령하였으며, 짧지만 격렬한 교전 끝에 도시는 포위되어 유린당했습니다. 도시는 폐허가 되었지만, 이들은 이 힘겹게 얻은 전투의 승리를 밤새 축하할 것입니다."
 city_captured.14.a: "흥미롭군"
 taiwan.18.t: "거대한 반도체 경쟁"
 taiwan.18.d: "2000년대에 접어들면서 우리의 마이크로칩 생산 우위가 위협받고 있습니다. 중화인민공화국이 우리의 생산 능력을 능가하려는 시도로 마이크로칩 생산 산업을 확대하기 시작했습니다. 세계 무대에서 우리의 입지를 지키려면 우리는 앞서 나가야 합니다."
 taiwan.18.a: "우리가 이길 것이다!"
 systems.1.t: "밀레니엄 던에 오신 것을 환영합니다"
 systems.1.d: "밀레니엄 던에 오신 것을 환영합니다! 모드를 다운로드하고 플레이해 주셔서 감사합니다. 처음이시라면 여러 메뉴를 둘러보며 기능을 익혀 보시길 권장합니다. 메뉴는 대체로 각 화면 상단의 버튼으로 열 수 있습니다. 도움이 필요하십니까? 질문이나 문제가 있으면 기꺼이 도와드리는 디스코드 커뮤니티에 참여하십시오. 버그는 일시 정지 메뉴의 \\"문제 보고\\" 또는 디스코드 채널을 통해 게임 내에서 신고하실 수 있습니다.\n\n중요 정보:\n- 발전소와 인구 소비로 인해 게임 시작 시 연료는 마이너스 상태입니다. 자세한 내용은 건설 메뉴의 에너지 UI를 확인하십시오.\n- 역사적 중점 =/= 역사적 결과입니다. 역사적 중점 옵션은 AI가 주어진 선택지 중 가능한 한 가장 역사적인 선택을 하도록 유도하기 위해 사용됩니다. 이것이 역사적인 게임을 보장하는 것은 아닙니다."
 systems.1.a: "알겠다."
 protests.100.t: "수도 밖에서 시위 발발"
 protests.100.d: "수도 밖의 주요 지역에서 대규모 시위가 벌어졌습니다. 보안 당국은 정부가 대중의 신뢰를 회복하지 못하면 소요가 확산될 수 있다고 경고합니다."
 protests.100.a: "소요를 진압한다"
 protests.101.t: "보도: 시위 확산!"
 protests.101.d: "시위가 수도 밖의 또 다른 지역으로 확산되었습니다. 운동이 새로운 지지자를 얻으면서 지방 당국은 질서를 회복하려 애쓰고 있습니다."
 protests.101.a: "신속히 움직여야 한다!"
 protests.103.t: "보도: 시위가 흩어지며 평온 회복"
 protests.103.d: "대중 시위가 동력을 잃었으며, 지방 당국은 영향을 받은 지역들이 정상으로 돌아왔다고 보고합니다. 전국적인 시위 운동은 끝난 것으로 보입니다."
 protests.103.a: "훌륭하군"
 protests.104.t: "시위대, 산업 시설에 방화!"
 protests.104.d: "상황 보고\n\n각하 [ROOT.GetLeader]께\n\n시위대가 여러 산업 시설에 불을 질러 긴장된 치안 환경이 조성된 것으로 보입니다. 이제 피해를 입은 건물들을 어떻게 할지 결정해야 합니다.\n\n 서명,\n - 내무 보안국"
 protests.104.a: "철거하라, 수리할 수 없다"
 protests.104.b: "정부 자금으로 재건을 시작한다"
 protests.105.t: "시위대, 업무 단지에 방화!"
 protests.105.d: "상황 보고\n\n각하 [ROOT.GetLeader]께\n\n시위대가 여러 업무 단지에 불을 질러 긴장된 치안 환경이 조성된 것으로 보입니다. 이제 피해를 입은 건물들을 어떻게 할지 결정해야 합니다.\n\n 서명,\n - 내무 보안국"
 protests.105.a: "철거하라, 수리할 수 없다"
 protests.105.b: "정부 자금으로 재건을 시작한다"
 protests.106.t: "시위대, 군수 공장에 방화!"
 protests.106.d: "상황 보고\n\n각하 [ROOT.GetLeader]께\n\n시위대가 여러 군수 공장에 불을 질러 긴장된 치안 환경이 조성된 것으로 보입니다. 이제 피해를 입은 건물들을 어떻게 할지 결정해야 합니다.\n\n 서명,\n - 내무 보안국"
 protests.106.a: "철거하라, 수리할 수 없다"
 protests.106.b: "정부 자금으로 재건을 시작한다"
 protests.200.t: "보도: 임박한 시위"
 protests.200.d: "상황 보고\n\n각하 [ROOT.GetLeader]께\n\n최근 우리 정보기관과 보안군은 전국적인 봉기 계획에 대한 낌새를 포착하였습니다. 이는 국내의 최근 사태로 불만 세력 집단이 형성된 데 기인합니다. 이들이 정부를 전복하기 위해 조직을 결성하기 시작한 것으로 알려져 있습니다.\n\n 서명,\n - 내무 보안국"
 protests.200.a: "신속히 움직여야 한다"
 influence.5.d1: "알비오니스를 불러라, 진입한다"
 recognition.71.t: "통과된 총회 표결"
 recognition.71.d: "총회는 우리의 유엔 가입을 승인하기로 표결했습니다. 수년간의 외교적 노력 끝에 우리의 의석이 확보되었습니다."
 recognition.71.a: "[THIS.GetName]이(가) 자리에 앉는다."
 recognition.72.t: "부결된 총회 표결"
 recognition.72.d: "총회는 우리의 가입을 승인하는 데 필요한 표를 얻지 못했습니다. UN 가입 신청은 당분간 정체되었습니다."
 recognition.72.a: "우리 외교의 차질이다."
 recognition.73.t: "[FROM.GetName]의 신청을 거부한 총회"
 recognition.73.d: "총회는 [FROM.GetNameDef]을(를) 회원국으로 받아들이는 안에 반대 표결을 했습니다. 신청은 정체되었습니다."
 recognition.73.a: "표결이 기록되었다."
 recognition.12.t: "안전보장이사회의 권고를 요청하는 [FROM.FROM.GetName]"
 recognition.12.d: "[FROM.GetName]의 반대에도 불구하고 [FROM.FROM.GetName]이(가) 총회에 대한 권고를 안전보장이사회에 청원했습니다. 이사회는 이제 표결을 해야 합니다."
 recognition.12.a: "찬성 투표"
 recognition.12.b: "반대 투표"
 recognition.12.c: "기권"
 recognition.15.t: "[FROM.FROM.GetName]의 UN 회원국 가입 표결"
 recognition.15.d: "안전보장이사회의 권고가 확보됨에 따라, [FROM.GetName]이(가) 반대하는 [FROM.FROM.GetName]의 가입 문제가 이제 총회로 넘어갑니다."
 recognition.15.a: "찬성 투표"
 recognition.15.b: "반대 투표"
 recognition.15.c: "기권"
 recognition.121.t: "[FROM.GetName]의 UN 가입을 권고한 안전보장이사회"
 recognition.121.d: "안전보장이사회는 [FROM.GetName]을(를) 유엔에 가입시키자는 권고를 발표했습니다. 이 문제는 이제 총회로 넘어갑니다."
 recognition.121.a: "표결이 진행된다."
 recognition.122.t: "[This.GetName]의 신청을 거부한 안전보장이사회"
 recognition.122.d: "안전보장이사회는 [This.GetName]을(를) 총회에 권고하지 않기로 표결했습니다. 가입 신청은 이 단계에서 중단됩니다."
 recognition.122.a: "신청이 정체된다."
 UNSC.1.t: "[?global.current_sc_vote_nation.GetName]에 모든 공세 전쟁 종결을 압박하는 결의안"
 UNSC.1.d: "[?global.current_sc_vote_nation.GetName]에 현재 진행 중인 모든 공세적 분쟁을 종결하도록 압박하는 결의안이 안전보장이사회에 상정되었습니다. 결의안이 통과되면 [?global.current_sc_vote_nation.GetName](은)는 진행 중인 모든 공세적 분쟁을 해결할 시간으로 210일을 갖게 됩니다. 이를 이행하지 못하면 해당 분쟁이 모두 종결될 때까지 제재를 받게 됩니다.\n\n$unsc_vote_pass_tt$"
 UNSC.1.a: "찬성"
 UNSC.1.b: "아니요"
 UNSC.1.c: "기권"
 UNSC.2.t: "[?global.current_sc_vote_nation.GetName]에 대한 유엔 안전보장이사회 제재"
 UNSC.2.d: "[?global.current_sc_vote_nation.GetName]에 대한 안전보장이사회 제재를 수립하는 결의안이 안전보장이사회에 상정되었습니다. 표결이 통과되면 [?global.current_sc_vote_nation.GetName](은)는 세계 평화에 대한 공세적 위협이 사라질 때까지, 또는 안전보장이사회가 제재를 해제할 때까지 제재를 받게 됩니다.\n\n$unsc_vote_pass_tt$"
 UNSC.3.t: "[?global.current_sc_vote_nation.GetName]에 대한 외국 군사 지원병 제한"
 UNSC.3.d: "[?global.current_sc_vote_nation.GetName]에 외국 군사 지원병을 파견하는 것을 금지하는 결의안이 안전보장이사회에 상정되었습니다. 결의안이 통과되면 표결 이후 [?global.current_sc_vote_nation.GetName]에 군사 지원병을 보내는 모든 국가는 지원병을 철수하거나 분쟁이 끝날 때까지 제재를 받게 됩니다.\n\n$unsc_vote_pass_tt$"
 UNSC.4.t: "[?global.current_sc_vote_nation.GetName]에 대한 무기 금수"
 UNSC.4.d: "[?global.current_sc_vote_nation.GetName]에 대한 무기 금수 조치를 도입하는 결의안이 안전보장이사회에 상정되었습니다. 결의안이 통과되면 [?global.current_sc_vote_nation.GetName](은)는 현재 진행 중인 모든 공세적 분쟁을 종결할 때까지 국제 시장에서 무기를 구매할 수 없게 됩니다.\n\n$unsc_vote_pass_tt$"
 UN.6.t: "[?global.current_ga_vote_nation.GetNameWithFlag]의 안전보장이사회 의석 승인"
 UN.6.d: "유엔 총회는 현재 안전보장이사회의 차기 이사국을 승인하기 위한 표결을 진행하고 있습니다. 지명된 모든 국가는 총회의 승인을 받아야 하며, [?global.next_year]년 1월 1일부터 2년 임기를 수행하게 됩니다.\n\n$un_ga_vote_requires_2_3_tt$"
 UN.6.a: "찬성표를 던진다"
 UN.6.b: "반대표를 던진다"
 UN.6.c: "기권"
 UN.7.t: "[?global.current_ga_vote_nation.GetNameWithFlag]에 대한 비구속적 제재 수립"
 UN.7.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 외국을 대상으로 군사 타격을 감행하였습니다. 이에 대응하여, 이들은 §B국제연합§!이 이 행동에 대한 처벌로 향후 1년간 [?global.current_ga_vote_nation.GetNameWithFlag]에 제재를 가할 것을 요청하였습니다. 찬성표를 던지면 [?global.current_ga_vote_nation.GetNameWithFlag]에 대한 제재에 동의하게 됩니다.\n\n$un_ga_vote_requires_majority$"
 UN.8.t: "국제연합 일반 운영 예산 감축"
 UN.8.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 다음 연도의 일반 운영 예산을 감축하는 안을 제출했습니다. 감축폭은 GDP의 0.01%입니다. 현재 분담률은 [?global.general_operating_budget_contribute_percent|%]입니다. 분담률 감축은 다음 국제연합 회계연도 시작 시점에 이루어지며 모든 국제연합 원조 프로그램에 영향을 미칩니다.\n\n$un_ga_vote_requires_2_3_tt$"
 UN.9.t: "국제연합 일반 운영 예산 증액"
 UN.9.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 다음 연도의 일반 운영 예산을 증액하는 안을 제출했습니다. 증액폭은 GDP의 0.01%입니다. 현재 분담률은 [?global.general_operating_budget_contribute_percent|%]입니다. 분담률 증액은 다음 국제연합 회계연도 시작 시점에 이루어지며 모든 국제연합 원조 프로그램에 영향을 미칩니다.\n\n$un_ga_vote_requires_2_3_tt$"
 UN.10.t: "결의안: 빈곤 감소"
 UN.10.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 빈곤 감소를 목표로 하는 조치를 채택할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 소비재 지출 증가를 감수하는 대신 안정도를 높이는 정책을 이행하게 됩니다.\n\n$un_ga_vote_requires_majority$"
 UN.11.t: "결의안: 식량 안보"
 UN.11.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 식량 안보와 농업 발전을 우선시할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 산업 역량 감소를 감수하는 대신 농업 생산량을 늘리게 됩니다.\n\n$un_ga_vote_requires_majority$"
 UN.12.t: "결의안: 세계 보건 구상"
 UN.12.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 세계 보건 구상에 투자할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 소비재 지출 증가를 감수하는 대신 의료 비용 감소의 혜택을 누립니다.\n\n$un_ga_vote_requires_majority$"
 UN.13.t: "결의안: 교육 구상"
 UN.13.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 교육 투자를 늘릴 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 건설 속도 저하를 감수하는 대신 더 빠른 연구와 교육 비용 감소의 혜택을 누립니다.\n\n$un_ga_vote_requires_majority$"
 UN.14.t: "결의안: 청정 에너지 전환"
 UN.14.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 청정 에너지로의 전환을 가속화할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 재생 에너지 건설에 대한 장려책을 받는 대신 화석 연료 기반시설과 공장 생산량에 불이익을 받습니다.\n\n$un_ga_vote_requires_majority$"
 UN.15.t: "결의안: 경제 성장"
 UN.15.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 경제 성장을 촉진하는 정책을 채택할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 정치력 감소와 소비재 지출 증가를 감수하는 대신 생산성과 공장 생산량 증가의 혜택을 누립니다.\n\n$un_ga_vote_requires_majority$"
 UN.16.t: "결의안: 인프라 개발"
 UN.16.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 인프라 개발에 투자할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 군수 공장 건설 속도 저하와 소비재 지출 증가를 감수하는 대신 인프라 및 민간 공장 건설 속도 향상의 혜택을 누립니다.\n\n$un_ga_vote_requires_majority$"
 UN.17.t: "결의안: 불평등 완화"
 UN.17.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 불평등을 줄이는 조치를 채택할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 정치력 감소와 소비재 지출 증가를 감수하는 대신 안정도 향상의 혜택을 누립니다.\n\n$un_ga_vote_requires_majority$"
 UN.18.t: "결의안: 기후 행동"
 UN.18.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 기후 변화에 대한 적극적인 조치를 취할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 재생 에너지에 대한 장려책을 받는 대신 화석 연료 발전소와 공장 생산량에 상당한 불이익을 받습니다.\n\n$un_ga_vote_requires_majority$"
 UN.19.t: "결의안: 평화와 제도"
 UN.19.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 평화로운 제도와 통치를 강화할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 군수 공장 건설 속도 저하와 소비재 지출 증가를 감수하는 대신 정치력 증가와 방어 표류 개선의 혜택을 누립니다.\n\n$un_ga_vote_requires_majority$"
 UN.20.t: "결의안: 무역 파트너십"
 UN.20.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 국제 무역 파트너십을 강화할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 정치력 감소를 감수하는 대신 무역 관계 개선의 혜택을 누립니다.\n\n$un_ga_vote_requires_majority$"
 UN.21.t: "결의안: 디지털 개발"
 UN.21.d: "[?global.current_ga_vote_nation.GetNameWithFlag](이)가 모든 회원국에 디지털 기반시설과 개발에 투자할 것을 촉구하는 비구속적 결의안을 제안했습니다. 찬성하는 국가는 소비재 지출 증가와 기반시설 건설 속도 저하를 감수하는 대신 더 빠른 인터넷, 마이크로칩, 연구 개발의 혜택을 누립니다.\n\n$un_ga_vote_requires_majority$"
 UN.410.t: "결의안: 빈곤 감소"
 UN.410.d: "§B국제연합§! §Y총회§!가 §Y빈곤 감소§!에 관한 비구속적 결의안을 통과시켰습니다. 우리는 이 결의안에 찬성하지 않았지만, 여전히 이를 수용하고 이행하기로 선택할 수 있습니다.\n\n이 결의안을 따르는 데 동의하시겠습니까?"
 UN.410.a: "결의안을 수락한다"
 UN.410.b: "결의안을 거부한다"
