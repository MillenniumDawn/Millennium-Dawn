 UKR_develop_bastion_flag: "완료된 결정: §YT-84 '바스티온' 개발§!"
 UKR_restore_an_71: "§YAn-71§! 조기경보기\n작업 재개"
 UKR_restore_an_71_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_soviet_an_71_development_for_tooltip\n\n\n\n\n\n\n\n\n§W§YAn-71§!은 §L안토노프 설계국§!이 §YAn-72§! 수송기를 바탕으로 제작한 공중조기경보기로, 전진각을 준 수직 꼬리날개 위에 레이더 돔을 얹은 형태입니다. 1985년 7월 12일에 첫 비행을 했으며 §R소련§! 전선 항공대를 지휘하기 위한 기체였지만, 계획은 §R소련§!과 함께 끝났고 §Y베가-M 크반트§! 레이더는 지상 잡음 문제를 끝내 완전히 해결하지 못했습니다.\n시제기 §Y03호기§!는 362회 비행 후 지금도 안토노프에 남아 있으며, 인도가 이 기종의 구매에 관심을 보였습니다. 계획을 복원하면 우리 공군도 자체 조기경보기를 갖게 됩니다.\n\n§G특히 중요한 군사 사업:§! 완성되면 §Y최고라다§!가 더 높은 군사 예산을 승인하는 데 한결 협조적이 됩니다.§!"
 ukraine_modernize_planes_restore_an_71.1.name: "An-71의 레이더"
 ukraine_modernize_planes_restore_an_71.1.desc: "안토노프가 03호기 시제기를 복원하고 옛 An-71 팀을 다시 모았습니다. 기체는 튼튼하지만 계획의 성패는 레이더가 좌우할 것입니다. 모스크바의 베가-M은 크반트를 완성해 주겠다고 제안했고, 이스라엘의 엘타는 An-71의 원반형 레이돔에 맞춘 팰콘 위상배열 레이더의 경량형을 제안했습니다."
 ukraine_modernize_planes_restore_an_71.1.a: "베가-M과 함께 §Y크반트§!를 완성한다"
 ukraine_modernize_planes_restore_an_71.1.b: "이스라엘제 §Y팰콘§! 레이더를 구매한다"
 ukraine_modernize_planes_restore_an_71_kvant_tt: "약 §Y6개월§! 뒤 §YAn-71§!이 소련제 §Y크반트§! 레이더(§Y$weap_buff_awacs_1$§!)를 달고 다시 비행합니다."
 ukraine_modernize_planes_restore_an_71_phalcon_tt: "약 §Y9개월§! 뒤 §YAn-71I§!가 이스라엘제 §Y팰콘§! 레이더(§Y$weap_buff_awacs_2$§!)를 달고 비행합니다."
 ukraine_modernize_planes_restore_an_71.2.name: "다시 날아오른 An-71"
 ukraine_modernize_planes_restore_an_71.2.desc_kvant: "개량한 크반트 레이더를 단 03호기가 비행에 성공했으며, 베가-M의 새 필터가 마침내 저고도 표적을 잡아냅니다. An-74를 생산하는 하르키우 항공기 공장은 그 기체의 개량점을 An-71 기체에 이식하겠다고 제안했습니다."
 ukraine_modernize_planes_restore_an_71.2.desc_phalcon: "원반형 레이돔에 이스라엘제 레이더를 단 03호기가 비행에 성공했으며, 위상배열 레이더는 크반트보다 훨씬 잘 저고도 표적을 추적합니다. An-74를 생산하는 하르키우 항공기 공장은 그 기체의 개량점을 An-71 기체에 이식하겠다고 제안했습니다."
 ukraine_modernize_planes_restore_an_71.2.a: "§YAn-74TK-200§! 규격으로 재제작한다"
 ukraine_modernize_planes_restore_an_71.2.b: "§YAn-74TK-300§!처럼 엔진을 날개 아래로 옮긴다"
 ukraine_modernize_planes_restore_an_71.2.c: "시제기 기체를 그대로 유지한다"
 ukraine_modernize_planes_restore_an_71_200_tt: "약 §Y5개월§! 뒤 하르키우가 An-74TK-200 기체를 인도합니다. 더 강력한 제빙 장치(§Y$spec_redundant_3$§!), 더 큰 연료 탱크(§Y$spec_refuel_1$§!), 더 넓은 항전 장비실(§Y$avionics_manned_2$§!)을 갖춥니다."
 ukraine_modernize_planes_restore_an_71_300_tt: "약 §Y8개월§! 뒤 하르키우와 §Y모토르 시치§!가 An-74TK-300 구성을 인도합니다. 날개 아래 엔진(§Y$engine_jet_double_3$§!)과 새 조종석 항전 장비(§Y$avionics_manned_3$§!)를 갖추며, 날개 위 엔진 배치가 지녔던 단거리 이륙 능력은 잃습니다."
 ukraine_modernize_planes_restore_an_71.3.name: "An-74TK-200 규격으로 재제작된 An-71"
 ukraine_modernize_planes_restore_an_71.3.desc: "하르키우가 An-71을 An-74TK-200 규격으로 재제작했습니다. 향상된 제빙 장치, 더 큰 연료 탱크, 더 넓은 항전 장비실 덕분에 더 오래, 더 험한 날씨에서도 초계 비행을 할 수 있습니다."
 ukraine_modernize_planes_restore_an_71.3.a: "새 기체를 채택한다"
 ukraine_modernize_planes_restore_an_71.4.name: "An-74TK-300 구성을 얻은 An-71"
 ukraine_modernize_planes_restore_an_71.4.desc: "하르키우가 An-74TK-300처럼 An-71의 엔진을 날개 아래 파일론으로 옮겼습니다. 단거리 이륙 능력은 포기했지만 순항 속도가 빨라지고 장시간 초계 비행에서 연료를 덜 소모합니다."
 ukraine_modernize_planes_restore_an_71.4.a: "새 기체를 채택한다"
