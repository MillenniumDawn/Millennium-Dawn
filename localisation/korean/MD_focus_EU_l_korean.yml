 eu_gui_tooltip_delayed: "유럽 의회(EP), 유럽연합(EU) 관직 보유자, 유럽연합 이사회 및 유럽 예산안 등 §C[EUU.GetFlag][EUU.GetName]§!에 관한 모든 정보가 포함된 창을 엽니다."
 fiscal_button_title: "중앙은행"
 fiscal_button_desc: "§C[EUU.GetFlag][EUU.GetName]§!의 예산입니다. 이 화면에서는 다년도 지출예산 구조(MFF) 및 차기 회계연도 예산안을 포함한 모든 재정 사항을 관리합니다."
 euro_voting_button_title: "이사회"
 euro_voting_button_desc: "밀레니엄 던에서 유럽연합 이사회는 §C[EUU.GetFlag][EUU.GetName]§!의 두 번째 입법 기구입니다. 유럽연합 이사회는 입법 절차에서 각 회원국을 대변합니다. 현재 통과된 모든 법률, 기안된 법안 및 §C[EUU.GetFlag][EUU.GetName]§! 투표권 보유국 목록을 확인할 수 있습니다.\n\n유럽연합 이사회는 통칭 이중 다수결이라 불리는 가중다수결(QMV) 방식으로 작동합니다. 이는 유럽연합(EU) §C회원국§! 중 55%와, 유럽연합(EU) 전체 인구의 65%를 대변하는 §C회원국§!들의 찬성을 필요로 합니다."
 parliament_button_title: "의회"
 parliament_button_desc: "밀레니엄 던에서 유럽 의회(EP)는 §C[EUU.GetFlag][EUU.GetName]§!의 첫 번째 입법 기구입니다. 유럽 의회(EP)는 법안이 유럽연합(EU)의 법률이 되기 위해 가장 먼저 투표에 부쳐지는 곳입니다.\n\n플레이어는 14일 동안 유럽 의회(EP) 의원(MEP)들의 과반수 지지를 확보하여 임무(결정 탭 참조)를 완수해야 합니다. 법안이 의회를 통과하면 유럽연합 이사회로 넘어가게 됩니다."
 EU_europeanism_screen_title: "유로-인포"
 EU_europeanism_screen_desc: "유로-인포 탭에는 회원국, 각국 인구 및 인구 비중, 유럽연합(EU)의 친유럽주의 수치 등 유럽연합(EU)에 관한 전반적인 정보가 담겨 있습니다."
 EU_offices_screen_title: "요직"
 EU_offices_screen_desc: "§C[EUU.GetFlag][EUU.GetName]§!의 요직 목록입니다. §C[EUU.GetFlag][EUU.GetName]§!의 요직들은 유럽연합(EU) 회원국이 취임할 수 있는 여러 중요 직위들로 구성됩니다."
