 TRI_infantry_weapons_5_desc: "Карабин M4 — более короткий и лёгкий вариант штурмовой винтовки M16. M4 — магазинный карабин под патрон 5,56x45 мм НАТО с воздушным охлаждением и газоотводной автоматикой с прямым воздействием пороховых газов на затворную раму. Он имеет ствол длиной 14,5 дюйма (370 мм) и телескопический приклад."
 CUB_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
 CUB_infantry_weapons_2_desc: "АК-74 разработан на основе АКМ и имеет значительные улучшения по сравнению с предшественником. В частности, он использует патроны калибра 5,45 мм вместо тогдашнего стандартного для стран Варшавского договора 7,62 мм."
 CUB_infantry_weapons_3_desc: "Хотя АК-74Н внутренне схож с АК-74, он оснащен планкой «ласточкин хвост» для установки оптики."
 CUB_infantry_weapons_4_desc: "В 1991 году на заводе «Ижмаш» в Ижевске началось серийное производство модернизированного варианта АК-74 — АК-74М. Он оснащён облегчёнными затвором и затворной рамой, а также прикладом из стеклонаполненного полиамида."
 CUB_infantry_weapons_5_desc: "Штурмовая винтовка АК-103 является производной от АК-74М и использует патрон 7,62х39 мм M43. Подобно более старому АКМ, АК-103 может использовать различные прицелы, включая ночные и оптические, а также оснащаться штыком или подствольным гранатометом. Отличием от большинства автоматов АК являются пластиковые и более дешевые материалы, примененные в АК-103."
 CUB_infantry_weapons_6_desc: "АК-12 — новый российский автомат. Он был разработан в рамках программы экипировки солдата будущего «Ратник». Созданный для специализированных подразделений, он должен заменить производство АК-103. АК-12 имеет улучшенный баланс и эргономику, что делает его самым элитным российским автоматом на сегодняшний день."
 VEN_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
