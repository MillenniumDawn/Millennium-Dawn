l_english:
 TOP_security_open_label: "National Security"
 TOP_security_open_tt: "Fund protective security and counterintelligence for our serving officials. These policies affect foreign targeted operations against officials who currently serve our government."
 TOP_security_title_label: "Protective Security & Counterintelligence"
 TOP_security_description_label: "Fund either policy for 182 days. Bonuses apply to our serving officials against foreign operations. Select a tier to purchase or renew it."
 TOP_security_tier_1: "Basic"
 TOP_security_tier_2: "Reinforced"
 TOP_security_tier_3: "Exceptional"
 TOP_security_inactive: "Inactive"
 TOP_protection_status_label: "Protection: [TOP_protection_policy_name] | [?TOP_protection_days|0] days"
 TOP_counterintelligence_status_label: "Counterintelligence: [TOP_counterintelligence_policy_name] | [?TOP_counterintelligence_days|0] days"
 TOP_security_renewal_label: "Renewal replaces the tier and resets its duration. Bonuses do not stack."
 TOP_protection_one_tt: "§YBasic Protective Security§!\nCost: §Y25§! political power and §Y$0.25 billion§!\nDuration: §Y182 days§!\nTimed operation success: §G-5 percentage points§!\nNative raid: §G5% chance§! to reduce a nonfailure result by one tier\nProtects our currently serving officials. Requires an eligible country and sufficient funds."
