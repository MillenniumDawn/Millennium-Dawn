 GEO_nato_standards_bases_desc: "미국과의 관계는 언제든 개선할 수 있습니다!"
 GEO_no_towest_infl_desc: "서방의 경제 모델을 거부하고, 조지아는 국가가 통제하는 산업 확장과 자원 동원에 집중하여 자본주의의 영향에서 벗어난 자급자족 경제를 구축할 것입니다."
 GEO_friendship_with_russia_desc: "러시아와의 외교 및 경제 관계를 강화하는 것은 과거의 분쟁에도 불구하고 협력의 길을 여는, 지역 안정을 위한 실용적 접근입니다."
 GEO_osetabkh_com_desc: "소련의 영향 아래 조지아는 남오세티야와 압하지야를 자치 괴뢰 공화국으로 재통합하여, 군사력이 아닌 러시아가 뒷받침하는 정치적 통제로 영토 분쟁을 해결할 것입니다."
 GEO_porvat_connections_desc: "새로운 공산주의 정부는 혁명적 전환의 성공을 보장하기 위해 강력한 내부 보안 기구를 구축하고 국가 기관에 대한 통제를 공고히 해야 합니다."
 GEO_government_reform_com_desc: "공산주의 원칙에 따른 경제 동원은 중앙 집중식 계획, 국가의 생산 통제, 그리고 조지아의 발전을 가로막아 온 부르주아 경제 구조의 제거를 요구합니다."
 GEO_intervene_in_azerbaijan_desc: "공산주의 혁명은 조지아의 국경을 넘어 확산되어야 합니다. 아제르바이잔의 혁명 세력을 지원함으로써 사회주의 원칙에 따른 새로운 자캅카스 연방을 수립할 수 있습니다."
 GEO_ally_tocomarmenia_desc: "공산주의 아르메니아는 캅카스 지역에 대한 우리의 이념적 비전을 공유하며, 외교 관계를 강화하면 반동 세력에 맞선 단일한 사회주의 전선이 만들어질 것입니다."
 GEO_rel_question_com_desc: "조지아 정교회는 우리 사회에 깊은 역사적 뿌리를 두고 있으므로, 공산주의 이념과 전통 종교 기관 사이의 관계를 신중하게 다루어야 합니다."
 GEO_suppress_oppos_com: "야당 탄압"
 GEO_suppress_oppos_com_desc: "민주주의 및 부르주아 야당 운동은 조지아의 혁명적 전환을 위협하므로, 공산당이 정치 생활을 완전히 통제할 수 있도록 탄압해야 합니다."
 GEO_allow_religion_geo_desc: "엄격한 무신론을 강요하는 대신, 공산당의 우위를 유지하면서 종교 활동을 용인하는 다원적 접근을 채택하면 사회적 긴장이 줄고 어느 정도의 대중적 지지를 얻을 수 있습니다."
 GEO_no_opium_for_people_desc: "종교는 민중의 아편입니다. 국가 무신론을 강제하고 성직자의 영향력을 제거하면 조지아인의 정신이 미신에서 벗어나고 사회주의 의식이 가속될 것입니다."
 GEO_exapnd_com_party_desc: "공산당 당원을 늘리고 포괄적인 이념 규범을 시행하면 혁명 원칙이 조지아 사회와 정부의 모든 수준에 스며들 것입니다."
 GEO_clearup_local_gov_desc: "지방 정부에서 기회주의자와 반동 분자를 숙청하면 공산주의 체제가 강화되며, 제한적인 시장 기제를 도입하면 사회주의 원칙을 버리지 않고도 경제 효율을 높일 수 있습니다."
 GEO_rodina_zakav_com_desc: "제5 인터내셔널은 세계 공산주의 연대에 대한 조지아의 헌신을 나타내며, 캅카스와 그 너머의 혁명 운동과 사회주의 정부를 지원합니다."
 GEO_new_nep_desc: "레닌의 선례에 따라 신경제정책은 제한적인 사기업과 시장 기제를 도입하여 농업과 소규모 생산을 되살리면서, 중공업에 대한 국가 통제는 유지할 것입니다."
 GEO_help_othercommies_desc: "조지아는 물질적, 이념적 지원을 제공하고 혁명 의식을 국경 너머로 퍼뜨림으로써 전 세계의 공산주의 운동을 지원해야 합니다."
 GEO_humvee_desc: "미국이 우리에게 다목적 차량을 판매해 줍니다."
 GEO_the_conflict: "분쟁"
 GEO_the_conflict_desc: "이 분쟁은 조지아의 미래가 어떻게 될지를 결정할 것입니다. 그들은 다시 통합될까요, 아니면 더욱 분열될까요?"
 GEO_the_castle_doctrine_idea: "성채 원칙"
 GEO_the_castle_doctrine_idea_desc: "자기 집을 지키는 일이 법의 처벌로 이어져서는 안 됩니다. 성채 원칙은 생명 유지의 원칙만큼이나 중요합니다."
 GEO_askchina_desc: "중국은 현재 세계 최대의 사회주의 국가이며, 우리는 그들에게서 도움을 얻기를 바랍니다."
 GEO_arm_help_com_desc: "아르메니아는 우리의 중요한 이웃이며, 우리는 그들에게서 도움을 얻기를 바랍니다."
 GEO_peaceful_revol_desc: "우리는 여전히 평화적으로 목표를 이루기를 희망합니다."
 GEO_violentcom_revol_desc: "말이 힘을 잃으면 폭력 혁명만이 유일한 선택이 됩니다."
 GEO_com_win_yes_desc: "공산주의자들이 권력을 잡게 하라."
 GEO_leader_of_rev_desc: "우리는 급진적 혁명을 일으킬 준비가 되었습니까?"
 GEO_our_path_desc: "우리는 우리의 길을 선택했으며, 미래는 바로 눈앞에 있습니다."
 GEO_accept_zsfsr_desc: "ZSFSR은 소련을 복원하기 위한 우리의 첫걸음입니다."
 GEO_geo_railway_desc: "노후화된 조지아의 철도 기반시설을 수리하는 것은 경제 발전에 필수적이며 캅카스 지역 전체의 연결성을 향상시킬 것입니다."
 GEO_privatization_geo_desc: "국영 기업의 시장 지향적 민영화는 외국인 투자를 유치하고 경제 효율을 높이겠지만, 부패와 과두 지배를 막으려면 신중한 관리가 필요합니다."
 GEO_give_to_our_guys_desc: "공개 시장 경쟁 대신, 민영화는 충성스러운 조지아 기업과 정치적 동지를 우선시하여 신뢰할 만한 집단에 경제 권력을 집중시켜야 합니다."
 GEO_aboba_desc: "제철소와 제조 시설을 비롯한 소련 시대의 산업 기반시설을 되살리면 고용과 경제 성장을 얻을 수 있지만, 자산이 분배되면서 부패가 늘어날 수도 있습니다."
 GEO_rustavi_metal_desc: "루스타비 제철소는 한때 조지아 내 소련 산업의 초석이었으며, 이 시설을 현대화하면 중공업 생산 능력이 복원될 것입니다."
 GEO_chiaturmarganets_desc: "치아투라 망간 광산에는 세계에서 가장 풍부한 매장량이 있으며, 이 산업을 되살리면 수출 수입과 산업 발전을 가져올 것입니다."
 GEO_enlarge_metal_extr_desc: "금속 채굴 및 가공 능력을 확대하면 유럽 시장으로 수출할 알루미늄 생산이 늘어나지만, 상당한 투자가 필요합니다."
 GEO_british_invest_desc: "특히 제철 부문에 대한 조지아 산업에 영국이 투자하면 자본, 전문 지식, 영국과의 더 강한 유대가 따라오며 영국의 영향력도 커집니다."
 GEO_parkfield_investment_desc: "파크필드와 기타 민간 투자자들이 핵심 경제 부문을 통제하도록 허용하면 느슨한 시장 규제와 외국 자본을 통해 발전이 가속됩니다."
 GEO_leave_in_hands_of_gov_desc: "핵심 경제 부문에 대한 엄격한 정부 통제를 유지하면 민간 부문의 성장이 느려지더라도 국가의 권위가 보존되고 외국의 착취를 막을 수 있습니다."
 GEO_unesco_bablo_desc: "문화유산 보존을 위한 유네스코의 재정과 국제 원조는 기술 발전을 위한 자원을 제공하는 동시에 조지아의 민주주의적 평판을 높여 줄 것입니다."
 GEO_foreign_planning_desc: "국제 컨설턴트와 외국의 기획 전문 지식은 조지아가 더 효과적인 경제 발전 전략과 제도 개혁을 설계하는 데 도움이 될 수 있습니다."
 GEO_start_repair_work_desc: "조지아 전역에서 포괄적인 기반시설 보수에 착수하면 무역 연결성이 개선되고 지속적인 경제 성장의 토대가 마련됩니다."
 GEO_ties_with_scr_desc: "남캅카스 철도망과의 운송 및 기반시설 연결을 강화하면 지역 연결성이 개선되어 조지아, 아르메니아, 아제르바이잔, 러시아 모두에 이익이 될 것입니다."
 GEO_baku_supsa_desc: "바쿠-숩사 송유관은 아제르바이잔산 원유를 조지아의 흑해 연안으로 운반하여 통과 수입을 창출하고 아제르바이잔과의 경제적 유대를 강화합니다."
 GEO_vladikavkaz_kazbegi_desc: "블라디캅카스-카즈베기 송유관 사업은 러시아와 조지아의 석유 기반시설을 연결하여 러시아의 영향력을 키우는 한편 양국에 통과 수입을 가져다줄 것입니다."
 GEO_baku_erzurum_desc: "바쿠-트빌리시-에르주룸 천연가스 송유관은 조지아를 거쳐 아제르바이잔의 가스전을 튀르키예에 연결하여, 조지아를 카스피해와 지중해 지역 사이의 핵심 에너지 회랑으로 자리매김하게 합니다."
 GEO_partial_restoration: "교회 부분 복원"
 GEO_partial_restoration_desc: "조지아의 역사적인 교회와 수도원을 부분적으로 복원하면 종교 지도자들의 입지가 강화되고 안정도가 높아지며 민족 문화유산이 보존됩니다."
 GEO_prepare_for_crisis2008_desc: "재정 개혁을 시행하고 금융 비축분을 쌓으면 조지아가 다가오는 2008년 세계 금융 위기를 최소한의 경제적 혼란으로 견뎌내는 데 도움이 될 것입니다."
 GEO_batumi_aero_desc: "바투미에 현대적인 공군 기지를 건설하면 흑해 연안의 군사 능력이 향상되고 조지아의 방어 태세가 강화될 것입니다."
 GEO_telavi_aero_desc: "조지아 동부의 텔라비 공군 기지를 확장하면 공군 작전이 강화되고 북쪽의 잠재적 위협에 대비한 전략적 종심을 확보할 수 있습니다."
 GEO_kutaisi_aero_desc: "조지아 서부의 쿠타이시 공군 기지를 개발하면 공군 지휘를 집중하고 국가 중심부에 핵심적인 방어 능력이 제공될 것입니다."
 GEO_chechsns_pankis_idea_desc: "체첸 무장 세력이 판키시 협곡에 거점을 마련하여 러시아와 맞닿은 조지아 북부 국경에 안보 우려를 낳고 있습니다."
 GEO_dop_programms_idea_desc: "조지아의 제도적 역량과 통치 구조를 강화하기 위해 추가 프로그램이 시행되고 있습니다."
 GEO_pmc_help_idea: "PMC의 지원"
 GEO_pmc_help_idea_desc: "민간 군사 기업들이 조지아 군에 훈련과 전문 지식을 제공하여 전투 준비 태세와 전술 역량을 향상시키고 있습니다."
 GEO_russian_spies_idea_desc: "조지아 내 러시아의 정보 활동은 국가 안보에 중대한 위협이 되며, 방첩 조치를 강화하여 대응해야 합니다."
 GEO_adjara_unstable_desc: "아자리야 위기는 정치적 불안정을 낳았으며, 아슬란 아바시제의 자치 정부는 트빌리시 중앙 정부의 권위를 인정하기를 거부하고 있습니다."
 GEO_adjara_unstable_2_desc: "아자리야 지도부의 계속되는 불복종은 조지아의 영토 보전을 위협하며 해결을 위한 단호한 조치가 필요합니다."
 GEO_adjara_unstable_3_desc: "아자리야와의 대치는 아직 해결되지 않아 조지아 남서부 지역에 지속적인 정치적, 경제적 불안정을 낳고 있습니다."
 GEO_expand_cis_influence_desc: "독립국가연합과의 관계를 강화하면 조지아 정책에 대한 러시아의 영향력이 커지고 서방 통합 전망이 줄어들 것입니다."
 GEO_expand_eu_influence_desc: "유럽 연합 통합을 추구하면 조지아가 서방 기구들과 보조를 맞추게 되어 경제 협력과 최종적인 가입으로 가는 길이 열립니다."
 GEO_HES_of_geo_desc: "수력 발전소에 투자하면 조지아의 화석 연료 의존도가 줄고 깨끗한 재생 에너지를 얻을 수 있지만, 기존 에너지 산업이 반발할 수 있습니다."
 GEO_ITERA_desc: "ITERA는 러시아의 가스 독점 기업 가스프롬에 대한 서방 연계 대안으로, 정치적 자본과 미국의 영향력 증대를 대가로 조지아에 더 큰 에너지 독립을 제공합니다."
 GEO_accept_russian_influence_desc: "가스프롬 거래 이후 러시아의 경제적 영향력을 받아들이면 모스크바와의 에너지 유대가 깊어지고 러시아의 투자를 통해 조지아의 산업 능력이 확대됩니다."
 GEO_agree_with_armenia_on_rail_desc: "아르메니아와의 철도 협력은 자캅카스 기반시설의 연결성을 강화하고, 무역로를 개선하며, 남쪽 이웃과의 외교 관계를 증진할 것입니다."
 GEO_agreement_with_turkey_desc: "튀르키예와의 외교 협정은 지역 협력과 아제르바이잔 에너지 자원에 대한 접근의 길을 열어, 조지아를 핵심 통과국으로 자리매김하게 합니다."
 GEO_agriculture_reform_desc: "조지아 농업을 현대화하면 생산성이 향상되고 산업 발전에 도움이 되지만, 전통적인 농민들은 기존 관행의 변화에 저항할 수 있습니다."
 GEO_agriculture_subsidize_desc: "농업 보조금은 최근 개혁 이후 농민과 노동자를 지원하겠지만, 대지주들은 이를 달갑지 않은 국가 개입으로 볼 수 있습니다."
 GEO_alliance_armeniA_NAT_desc: "민족주의 지도부 아래에서 조지아는 캅카스 지역의 아제르바이잔 영향력에 맞서기 위해 아르메니아와 전략적 동맹을 맺을 수 있습니다."
 GEO_armenian_proposal_com_desc: "공산주의 조지아는 아제르바이잔 개입 이후 자캅카스 지역에서의 이념적 연대를 모색하며 아르메니아에 손을 내밀어야 합니다."
 GEO_ask_for_international_help_desc: "사회 프로그램에 대한 국제 원조를 요청하면 보건 의료 확대를 위한 핵심 자금을 얻을 수 있지만, 조지아의 해외 원조 의존도가 높아집니다."
 GEO_azeri_oil_desc: "튀르키예의 중재를 통해 아제르바이잔 유전에 접근하면 바쿠-트빌리시 에너지 회랑이 강화되고 통과국으로서의 조지아의 입지가 개선될 것입니다."
 GEO_azot_combinat_desc: "루스타비 아조트 화학 공장은 소련 시대의 산업 능력을 대표하며, EU 지향적 투자와 현대화를 통해 되살릴 수 있습니다."
 GEO_beria_doctrine_desc: "스탈린의 악명 높은 비밀경찰 수장 라브렌티 베리야의 이름을 딴 이 독트린은 공산주의 조지아를 내외의 위협으로부터 보호하는 포괄적인 국가 보안 기구를 수립합니다."
 GEO_bezviz_rus_desc: "러시아와의 무비자 여행을 시행하면 독립국가연합과의 경제 통합이 극적으로 늘어나고 조지아의 친러시아 성향이 굳어질 것입니다."
 GEO_budget_deficit_desc: "서방의 자금 조달과 EU 무역 통합을 통해 예산 적자를 관리하면 안정을 얻을 수 있지만, 조지아의 유럽 파트너에 대한 경제적 의존이 깊어집니다."
 GEO_build_hospitals_desc: "국제 지원과 적십자의 도움으로 현대적인 병원을 건설하면 조지아의 보건 의료 기반시설과 공중 보건 성과가 극적으로 개선될 것입니다."
 GEO_build_materials_desc: "건축 자재 산업을 발전시키면 조지아의 건설 부문을 뒷받침하고 여러 경제 부문의 사업적 이익에 도움이 될 것입니다."
 GEO_communist_iron_hand_desc: "일당 공산 통치를 공고히 하면 정치적 반대 세력이 제거되고 조지아 사회와 정부 기관에 대한 절대적 통제가 확립됩니다."
 GEO_contract_vmf_desc: "훈련과 전문 지식을 위해 러시아 해군(Военно-морской флот)과 계약하면 노련한 해양 강국과의 협력을 통해 조지아의 해군 발전이 가속될 것입니다."
 GEO_crush_both_desc: "아르메니아와 아제르바이잔 양쪽과의 동맹을 거부하는 것은 조지아가 여러 전선의 잠재적 분쟁에 대비하는 공세적 민족주의 입장을 뜻합니다."
 GEO_crush_nat_armeni_desc: "민족주의 노선은 캅카스에서 조지아의 우위를 확보하기 위해, 아제르바이잔의 지원을 받거나 단독 행동으로 아르메니아로의 영토 확장을 요구합니다."
 GEO_crush_nat_azeri_desc: "민족주의적 야망은 이 지역에서 조지아의 패권을 세우기 위해 아제르바이잔과의 대결을 요구하며, 아르메니아와 연합하거나 독자적인 정복을 추구할 수 있습니다."
 GEO_deal_with_india_desc: "인도와 무역 및 외교 관계를 맺으면 조지아의 경제 파트너 관계가 인접한 캅카스 지역 너머로 다변화됩니다."
 GEO_decrease_import_desc: "수입 대체 정책은 조지아의 무역 의존도를 줄이고 국내 산업을 강화하겠지만 경제 효율은 떨어질 수 있습니다."
 GEO_defense_of_georgia_desc: "방어적 군사 교리를 채택하면 공산주의 조지아의 군대는 공세적인 혁명 확장보다 조국 수호에 집중하게 됩니다."
 GEO_dem_dvizh_edgruz_desc: "통합 조지아를 위한 민주 운동은 친러시아 민주 야당으로, 2013년 선거에서 승리하면 조지아의 정책을 서방 통합에서 멀어지게 돌려놓을 수 있습니다."
 GEO_dilos_desc: "해군 기술과 구축함급 함선에 관한 그리스와의 협력은 노련한 지중해 해군 강국과의 제휴를 통해 조지아의 흑해 함대를 현대화할 것입니다."
 GEO_electro_problems_desc: "전력 기반시설에 대한 대규모 투자는 소련 붕괴 이후 조지아를 괴롭혀 온 만성적인 전력 부족을 마침내 해결할 것입니다."
 GEO_enlarge_debt_timeout_desc: "ITERA 가스 거래 이후 부채 의무를 재조정하고 연장하면 당장의 재정 압박이 줄고 서방 채권자들과의 관계가 깊어집니다."
 GEO_exchange_energy_rus_desc: "러시아 통화로 거래하고 우대 조건을 받는 에너지 협정을 맺으면 우리나라에서 더 안정적인 에너지 거래를 구축할 수 있습니다."
 GEO_fertilizer_import_desc: "새로 개설된 아르메니아 철도 연결을 통해 비료를 수입하면 농업 생산성이 높아지고 조지아 전역의 작물 수확량이 개선될 것입니다."
 GEO_fiftintern_desc: "제5 인터내셔널을 위한 준비는 공산당 기구를 강화하고 생산 수단에 대한 국가 통제를 공고히 합니다."
 GEO_fight_with_plague_desc: "질병 발생을 근절하기 위한 포괄적인 공중 보건 캠페인을 시작하면 주민을 보호하고 공공복지에 대한 정부의 의지를 보여줄 수 있습니다."
 GEO_food_industry_desc: "현대적인 식품 가공 및 농업 기술을 발전시키면 조지아의 농업 부문이 강화되고 농촌 지역사회의 경제적 입지가 개선될 것입니다."
 GEO_gas_postavka_desc: "조지아의 천연가스 공급 문제를 해결하는 것은 에너지 안보에 필수적이지만, 안정적인 가스 공급을 확보하려면 어려운 외교적 선택이 필요합니다."
 GEO_gazprom_rus_desc: "러시아 국영 가스 독점 기업 가스프롬과 손잡으면 안정적인 에너지 공급이 보장되지만, 조지아 정책에 대한 모스크바의 정치적 영향력이 크게 커집니다."
 GEO_geopromining_desc: "GeoProMining 사의 성장은 조지아의 채굴 산업을 확대하고 민간 산업 능력을 향상시킬 것입니다."
 GEO_georgian_airlines_desc: "조지안 항공을 국적 항공사로 설립하면 트빌리시를 국제 목적지와 연결할 대표 항공사를 갖추게 됩니다."
 GEO_georgian_airways_desc: "조지안 에어웨이즈를 국영 항공사로 설립하면 조지아의 항공 운송 기반시설을 발전시키는 또 다른 구상이 마련됩니다."
 GEO_georgian_oil_desc: "국내 정유 능력을 개발하면 수입 석유 제품에 대한 조지아의 의존도가 줄고 에너지 독립이 강화될 것입니다."
 GEO_german_archeologists_desc: "유적 복원을 돕도록 독일 고고학자들을 초빙하면 국제 학술 협력을 통해 조지아의 고대 문화유산이 보존될 것입니다."
 GEO_german_specialists_desc: "독일 의료 전문가들이 가져오는 선진 보건 의료 전문 지식은 조지아의 병원과 의료 교육 프로그램을 현대화할 것입니다."
 GEO_gold_extract_desc: "영국의 투자로 금광 사업을 확대하면 수출 수입이 생기지만, 조지아의 천연자원에 대한 외국의 통제가 커집니다."
 GEO_gold_privat_desc: "금광 산업을 민영화하면 외국인 투자를 유치하고 국고 수입을 창출할 수 있으며, 이는 시장 지향적 경제 개혁에 대한 의지를 나타냅니다."
 GEO_gov_plans_desc: "비밀경찰 NKVD를 개선하면 공산 정부의 감시 및 내부 보안 능력이 강화됩니다."
 GEO_gov_prop_desc: "군국주의 교육 프로그램을 시행하면 조지아 청년들에게 공산주의 이념을 주입하고 주민들을 잠재적 분쟁에 대비시킬 수 있습니다."
 GEO_greece_repair_desc: "그리스와 협력하여 해군 수리 시설을 구축하면 조지아가 흑해 함대를 정비하고 개량하는 데 필요한 핵심 조선소 능력을 갖추게 됩니다."
 GEO_guam_meeting_desc: "GUAM 기구(조지아, 우크라이나, 아제르바이잔, 몰도바)는 상호 협력을 통해 러시아의 영향력에 균형을 맞추려는 국가들의 지역 동맹입니다."
 GEO_healthcare_geo_desc: "국가 보건 의료 체계를 개혁하고 재정을 지원하면 공중 보건 성과가 개선되고 사회 복지에 대한 정부의 의지를 보여줄 수 있습니다."
 GEO_healthcare_reformation_desc: "독일 전문가의 도움을 받은 보건 의료 체계의 전면 개편은 조지아 전역의 의료 서비스 제공 방식을 근본적으로 바꿀 것입니다."
 GEO_help_from_azer_desc: "아제르바이잔의 개발 원조는 조지아의 기반시설을 개선하는 동시에 두 캅카스 국가 사이의 양자 관계를 강화할 것입니다."
 GEO_integrat_armen_desc: "조지아 요리와 전통을 통해 정복한 아르메니아 영토를 문화적으로 동화시키면 새로 얻은 땅에 대한 민족주의 통제가 공고해질 것입니다."
 GEO_integrat_meskheti_desc: "조지아 문화의 우위를 통해 메스헤티 튀르키예인 및 아제르바이잔 영토를 통합하면 민족주의의 영토 확장 성과가 굳어질 것입니다."
 GEO_inter_rao_tpp_desc: "러시아 에너지 대기업 인터 RAO가 조지아에 화력 발전소를 건설하여 산업 능력을 확대하는 한편, 러시아의 경제적 영향력을 키우고 유럽 회의주의를 조장할 것입니다."
 GEO_light_industry_desc: "경공업 발전을 위한 투자 패키지를 유치하면 조지아의 제조업이 현대화되고 산업계의 이익에 도움이 될 것입니다."
 GEO_mahindra_desc: "인도의 산업 거인 마힌드라와의 제휴는 외국 기술 이전을 통해 조지아에 무기 제조 능력을 구축할 것입니다."
 GEO_marneuli_plant_desc: "인도-조지아 협력으로 마르네울리 산업 공장을 건설하면 제조 능력이 확대되고 인도와의 경제적 유대가 강화될 것입니다."
 GEO_marxism_geo_win_desc: "조지아에서 마르크스주의의 승리는 사회 모든 영역에 대한 공산주의 통제를 공고히 하고 국가 주도 아래 산업 능력을 극적으로 확대합니다."
 GEO_migrant_programs_desc: "이주 및 재정착 프로그램은 산업 개발 사업 이후의 인구 이동과 노동력 분배를 관리할 것입니다."
 GEO_mil_reforms_desc: "포괄적인 공산주의 군사 개혁은 소련식 조직 개선을 통해 조지아 군대의 모든 부문을 현대화할 것입니다."
 GEO_military_communism_desc: "군사 공산주의를 채택하면 조지아의 전체 경제가 전쟁과 혁명적 확장을 위해 동원되며, 민간 복지보다 군사력이 우선시됩니다."
 GEO_mineral_waters_desc: "나베글라비 광천수 산업을 발전시키면 캅카스 지역 전역에 이름난 조지아의 천연 샘물 자원을 활용할 수 있습니다."
 GEO_money_navyusa_desc: "해군 발전을 위한 미국의 재정 지원은 조지아의 흑해 해양 능력을 현대화하는 데 핵심 자금을 제공할 것입니다."
 GEO_mvd_min_oboron_desc: "내무부와 국방부를 합치면 조지아 보안 병력의 통합 지휘 체계가 만들어집니다."
 GEO_national_airlines_desc: "항공 회사들을 하나의 국영 항공사로 통합하면 국제 항공 운송에서 조지아를 대표할 효율적인 국적 항공사가 만들어질 것입니다."
 GEO_nationalize_gold_desc: "금광업을 국유화하면 천연자원에 대한 국내 통제권을 행사할 수 있지만, 외국인 투자자의 신뢰가 흔들릴 위험이 있습니다."
 GEO_negotiate_red_cross_desc: "국제 적십자와의 협상은 질병 통제 프로그램을 위한 인도적 지원과 의료 전문 지식을 제공할 것입니다."
 GEO_oil_extr_experts_desc: "외국 석유 전문가를 고용하면 조지아의 국내 석유 채굴 능력을 개발하는 데 필요한 핵심 기술 지식이 이전됩니다."
 GEO_oil_pipelines_desc: "송유관 기반시설을 건설하면 조지아는 카스피해와 흑해 지역을 잇는 핵심 에너지 통과 회랑으로 자리매김하게 됩니다."
 GEO_patrol_cather_desc: "경비정을 확보하면 조지아가 영해와 해양 경제 이익을 보호할 해안 경비 능력을 갖추게 됩니다."
 GEO_political_reformation_desc: "공산주의 하의 정치 재편은 경제적 권력을 과두 지배층과 은행가들로부터 소기업과 노동조합으로 재분배할 것입니다."
 GEO_pontic_sea_port_desc: "흑해 항만 시설을 개발하면 조지아의 해상 무역 능력이 확대되고 지역 해운 거점으로서의 입지가 강화됩니다."
 GEO_private_miners_desc: "영국의 투자로 광업을 민영화하면 외국 자본과 전문 지식을 통해 채굴 산업이 현대화될 것입니다."
 GEO_radioloc_usa_desc: "미국의 레이더 및 전자 기술은 조지아 해군 함선의 탐지 및 표적 설정 능력을 크게 향상시킬 것입니다."
 GEO_rebrand_borjomi_desc: "보르조미 광천수를 리브랜딩하면 이 역사적인 조지아 제품이 국제 수출 시장과 프리미엄 가격대에 자리잡게 됩니다."
 GEO_superpuma_desc: "프랑스제 슈퍼 퓨마 헬리콥터를 도입하면 조지아가 현대적인 공중 기동 및 수색 구조 능력을 갖추게 됩니다."
 GEO_tbilisi_aero_desc: "트빌리시 국제공항을 확장하면 유럽과의 연결성이 개선되고 수도가 지역 항공 거점으로 자리매김할 것입니다."
 GEO_tbilisi_ceyhan_desc: "바쿠-트빌리시-제이한 송유관은 카스피해 자원을 지중해 시장으로 연결하는 에너지 회랑으로서 조지아의 전략적 중요성을 보여줍니다."
 GEO_telecommunications_desc: "통신 기반시설을 현대화하면 연결성이 개선되고 조지아의 경제 발전을 위한 디지털 토대가 마련됩니다."
 GEO_training_drills_com_desc: "공산주의 군사 훈련은 혁명을 수호하고 사회주의 영향력을 확대하기 위한 군의 준비 태세를 갈고닦을 것입니다."
 GEO_transit_deal_eu_desc: "조지아를 EU-아시아 무역의 통과 회랑으로 자리매김하면 조지아가 유럽 경제망에 통합되고 유럽 회의주의 정서가 줄어들 것입니다."
 GEO_txtrveli_line_desc: "츠흐르벨리 방어선은 잠재적 침공에 대비하여 철통같이 방비된 벙커 단지로 조지아의 취약한 국경을 요새화할 것입니다."
 GEO_udeshevlenie_desc: "우대 무역 조건을 통해 더 저렴한 러시아산 수입품을 받아들이면 비용은 줄지만 모스크바에 대한 경제적 의존이 커집니다."
 GEO_ukraine_verf_desc: "우크라이나 조선소와의 협력은 조지아의 해상 함대를 건조하기 위한 소련 시대 해군 건조 전문 지식과 시설에 대한 접근을 제공할 것입니다."
 GEO_wine_desc: "조지아의 유서 깊은 와인 산업을 현대적인 생산 시설로 발전시키면 수천 년 와인 양조 전통을 보여주는 고급 수출품이 탄생할 것입니다."
 GEO_zestaponi: "제스타포니 공장"
 GEO_zestaponi_desc: "제스타포니 합금철 공장은 소련 산업에 필수적인 소재를 생산했으며, 이 시설을 복원하면 조지아의 산업 부흥을 뒷받침할 것입니다."
 GEO_telavi_plant: "텔라비 공장"
 GEO_telavi_plant_desc: "텔라비 산업 공장을 재가동하면 조지아의 제조 능력이 확대되고 지방에 일자리가 생길 것입니다."
 GEO_mtkvari_tpp2: "TPP2"
 GEO_mtkvari_tpp: "므트크바리 발전소"
 GEO_mtkvari_tpp1: "TPP1"
 GEO_mtkvari_tpp_desc: "므트크바리 화력 발전소 사업은 현대적인 발전소 건설을 통해 조지아의 발전 용량을 극적으로 확대할 것입니다."
 GEO_mtkvari_tpp1_desc: "므트크바리 발전 단지의 1단계 확장은 효율 개선을 통해 출력을 늘리고 화석 연료 의존도를 줄일 것입니다."
 GEO_mtkvari_tpp2_desc: "므트크바리 발전소의 최종 확장으로 조지아의 지속 가능한 에너지 기반시설로의 전환이 완료됩니다."
 GEO_orthodox_church_influence: "정교회의 영향력"
 GEO_orthodox_church_influence_desc: "조지아 정교회는 우리 사회에 상당한 영향력을 행사하며 영적 지도를 제공하고 민족 정체성과 전통적 가치를 강화합니다."
 GEO_restructure_debt: "부채 재조정"
 GEO_restructure_debt_desc: "군사 지출 삭감을 통해 국가 부채를 재조정하면 재정 부담이 줄지만 방어 능력이 약해집니다."
 GEO_military_communism_idea_desc: ""
 GEO_defense_of_georgia_idea_desc: ""
 GEO_aircraft_investments_desc: ""
 GEO_aircraft_investments_1_desc: ""
 GEO_aircraft_investments_2_desc: ""
 GEO_strict_abortion_idea: "엄격한 낙태 금지"
 GEO_strict_abortion_idea_desc: ""
 GEO_georgian_water_1_desc: ""
 GEO_georgian_water_2_desc: ""
 GEO_plague_problem_idea: "마을의 흑사병"
 GEO_plague_problem_idea_desc: "산악 지대의 여러 마을과 대도시에서 멀리 떨어진 외곽 도시에서 흑사병과 말라리아 같은 질병이 보고되었습니다. 이들 지역에 적절한 보건 의료가 부족한 문제를 조사하고 해결책을 찾아야 합니다."
 GEO_political_opposition_desc: ""
 GEO_political_opposition_mod_idea: "온건한 정치적 야당"
 GEO_political_opposition_mod_idea_desc: ""
 GEO_political_opposition_weak_desc: ""
 GEO_gaz_energy_problems_idea: "가스 및 전력 문제"
 GEO_gaz_energy_problems_idea_desc: "가스와 전력의 부족은 시민들의 복지에 심각한 문제를 일으키고 있습니다."
 GEO_diplomatic_president_zur_desc: ""
 GEO_FOCUS_MEOW_desc: ""
 GRE_com_resources_idea_desc: ""
 GEO_militarist_education_idea_desc: ""
 GEO_means_of_production_desc: ""
 GEO_cscec_idea: "CIS 경제"
 GEO_cscec_idea_desc: ""
 GEO_self_help_idea_desc: ""
 GEO_trade_idea_desc: ""
 GEO_strict_market_idea_desc: ""
 GEO_loose_market_idea_desc: ""
 GEO_kviciani_shit_desc: ""
 GEO_kviciani_medium_close_desc: ""
 GEO_kviciani_medium_agree_desc: ""
 GEO_kviciani_in_gov_desc: ""
 GEO_hydroelectric_plant_decision_category: "[GEO.GetFlag] [GEO.GetAdjective] 수력 발전 사업"
 GEO_hydroelectric_plant_decision_category_desc: "아름다운 우리나라는 천연자원이 풍부하며, 산에서 흘러내리는 강도 예외가 아닙니다. 이는 노후한 전력 기반시설을 보완할 댐과 수력 발전소를 추가로 건설할 특별한 기회를 줍니다."
 GEO_expand_the_khudoni_hydro_power_plant: "§Y쿠도니 수력 발전소§! 확장"
 GEO_expand_the_khudoni_hydro_power_plant_desc: "엔구리 강의 쿠도니 수력 발전 시설을 확장하면 상당한 발전 용량이 확보되고 산악 북서부 지역의 조지아 에너지 기반시설이 강화될 것입니다."
 GEO_zhoneti_hydro_power_plant: "§Y조네티 수력 발전소§! 건설"
 GEO_zhoneti_hydro_power_plant_desc: "조네티 계단식 수력 발전 사업은 조지아 동부 산악 하천의 에너지 잠재력을 활용하여 깨끗한 재생 전력을 공급하고 지역 에너지 독립을 뒷받침할 것입니다."
 GEO_vardnili_hydro_power_plant: "§Y바르드닐리 수력 발전소§! 건설"
 GEO_vardnili_hydro_power_plant_desc: "엔구리 강에 위치한 바르드닐리 수력 발전 사업은 조지아의 재생 에너지 구성에 기여하고 최대 수요 기간 중 수입 전력에 대한 의존도를 줄일 것입니다."
 GEO_tvishi_hydro_power_plant: "§Y트비시 수력 발전소§! 건설"
 GEO_tvishi_hydro_power_plant_desc: "츠헤니스츠칼리 강의 트비시 수력 발전소는 조지아 서부 산악 하천의 자연 낙차를 활용하는, 조지아 에너지 기반시설에 대한 대규모 투자입니다."
 GEO_shuakhevi_hydro_power_plant: "§Y슈아헤비 수력 발전소§! 건설"
 GEO_shuakhevi_hydro_power_plant_desc: "아자리야 지역의 슈아헤비 계단식 사업은 가파른 산악 지형을 활용하여 재생 에너지를 생산하며, 국가 에너지 안보와 지역 경제 발전을 모두 뒷받침할 것입니다."
 GEO_samtskhe_javakheti_hydro_power_plant: "§Y삼츠헤-자바헤티 수력 발전소§! 건설"
 GEO_samtskhe_javakheti_hydro_power_plant_desc: "삼츠헤-자바헤티 지역에 수력 발전 용량을 개발하면 이 역사적으로 낙후된 지역에 현대적 기반시설이 들어서고 지역의 풍부한 수자원을 활용할 수 있습니다."
 GEO_nenskra_hydro_power_plant: "§Y넨스크라 수력 발전소§! 건설"
 GEO_nenskra_hydro_power_plant_desc: "스바네티의 넨스크라 수력 발전 사업은 조지아에서 계획된 가장 큰 에너지 개발 중 하나로, 늘어나는 국내 수요를 충족하고 수출 잠재력을 갖출 상당한 발전량을 약속합니다."
 GEO_namakhvani_hydro_power_plant: "§Y나마흐바니 수력 발전소§! 건설"
 GEO_namakhvani_hydro_power_plant_desc: "리오니 강의 나마흐바니 계단식 발전소는 조지아 서부의 주요 수로 중 하나를 활용하여 화력 발전 의존도를 줄일 상당한 수력 발전 용량을 제공할 것입니다."
 GEO_dariali_hydropower_plant: "§Y다리알리 수력 발전소§! 건설"
 GEO_dariali_hydropower_plant_desc: "카즈베기 지역의 조지아 군사 도로 근처에 위치한 다리알리 수력 발전소는 테레크 강의 가파른 낙차를 이용하여 조지아 북부 지역에 깨끗한 에너지를 공급할 것입니다."
 GEO_tiblisis_gambit_decision_category: "트빌리시의 승부수"
 GEO_tiblisis_gambit_decision_category_desc: "조지아는 자국 영토를 되찾기로 결정했습니다."
 geo_misc.100.t: "리아 방사능 사고"
 geo_misc.100.d: "이번 주 초, 리아 마을의 남성 세 명이 급성 방사선 증후군(ARS) 진단을 받았다고 보고되었습니다. 이들은 엔구리 댐 저수지가 내려다보이는 숲에서 땔감을 모으다가 소련 붕괴 이후 방치되어 있던 방사성 동위원소 열전 발전기를 우연히 발견했습니다. 그들은 직접 발전기를 회수하려 했으나 다량의 방사선에 피폭되어, 한 명이 사망하고 나머지 두 명은 심각한 질병을 앓게 되었습니다."
 geo_misc.100.a: "유가족에게 조의를 표합니다."
 GEO_nationalized_gold_reserves_idea_tt: "추가 수입: $$§G0.175§!"
 GEO_nationalized_gold_reserves_idea: "국유화된 금 보유고"
 GEO_nationalized_gold_reserves_idea_desc: "국가 주권을 유지하려면 다른 나라들이 우리나라에 보유한 금 보유고를 국유화해야 합니다. 그러나 우리가 종속되는 일이 생긴다면 소중한 보유고를 잃을 수도 있습니다..."
 GEO_grapeyards_desc: "조지아의 역사적인 포도원을 되살리면 수천 년간 조지아 문화와 경제의 중심이었던 와인 산업이 복원될 것입니다."
 GEO_biggest_influencer_soo_tt: "조지아가 남오세티야에 가장 큰 영향력을 행사해야 합니다"
 GEO_biggest_influencer_abk_tt: "조지아가 압하지야에 가장 큰 영향력을 행사해야 합니다"
 geo_misc.101.t: "신우파, 조지아를 위한 렐로에 합류"
 geo_misc.101.desc: "신우파당은 2019년 12월 렐로 창당 대회에서 은행가 마무카 하자라제의 새로운 친서방 정당 '조지아를 위한 렐로'에 합쳐졌습니다. 신우파가 사라지면서, 2017년 다비트 바크라제와 통합 민족 운동 이탈자들이 결성한 '유럽 조지아'가 친서방 중도우파의 주된 목소리가 됩니다."
 geo_misc.101.a: "야당이 재편된다."
 geo_misc.102.t: "조지아를 위한 보수주의자들 등록"
 geo_misc.102.desc: "공공등기소가 보수 운동의 등록을 취소한 지 1년 뒤, 극우 방송사 알트인포의 지도자들이 새 정당 '조지아를 위한 보수주의자들'을 등록했습니다. 새 정당은 보수 운동의 반서방, 친러시아 강령을 새 이름으로 이어갑니다."
 geo_misc.102.a: "같은 운동, 새로운 이름."
 geo_misc.103.t: "신우파당 창당"
 geo_misc.103.desc: "다비트 감크렐리제를 중심으로 한 젊은 정치인과 기업인들이 신우파당을 창당하여 신진 파벌과 동맹 집단들을 하나의 중도우파 친유럽 정당으로 통합했습니다. 이들은 집권 시민연합과 급진 야당 모두에 맞서 사유 재산과 기업을 수호하겠다고 약속합니다."
 geo_misc.103.a: "우파의 새로운 목소리."
 geo_misc.104.t: "조지아 신공산당"
 geo_misc.104.desc: "이오시프 스탈린의 손자 예브게니 주가슈빌리가 조지아 신공산당을 등록했습니다. 이 작은 스탈린주의 정당은 통합 공산당에 대한 더 강경한 대안을 자임합니다."
 geo_misc.104.a: "스탈린의 이름이 조지아 정치에 돌아온다."
 geo_misc.105.t: "사카슈빌리, 통합 민족 운동 창당"
 geo_misc.105.desc: "정부 부패에 항의하며 법무장관직을 사임한 미헤일 사카슈빌리가 통합 민족 운동을 창당했습니다. 새 정당은 셰바르드나제 시대의 연줄망을 일소하고 조지아를 서방을 향한 확고한 길로 올려놓겠다고 약속합니다."
 geo_misc.105.a: "새로운 도전자가 등장한다."
 geo_misc.106.t: "조지아 극단 창당"
 geo_misc.106.desc: "노동당 지도자 샬바 나텔라슈빌리와 결별한 욘디 바가투리아가 조지아 극단을 창당했습니다. 이 새 좌익 민족주의 정당은 외국인이 매입한 기업과 재산의 국유화를 요구합니다."
 geo_misc.106.a: "또 하나의 야당이 무대에 오른다."
 geo_misc.107.t: "부르자나제, 새 정당 창당"
 geo_misc.107.desc: "전 의회 의장 니노 부르자나제가 사카슈빌리 대통령과 결별한 뒤 민주 운동 - 통합 조지아를 창당했습니다. 이 정당은 정부를 권위주의 통치라고 비난하며 모스크바와의 직접 대화를 요구합니다."
 geo_misc.107.a: "야당이 익숙한 얼굴을 얻다."
 geo_misc.108.t: "이바니쉬빌리, 조지아의 꿈 창당"
 geo_misc.108.desc: "억만장자 비지나 이바니쉬빌리가 통합 민족 운동에 맞서는 광범위한 연합의 핵심인 '조지아의 꿈 - 민주 조지아'를 창당했습니다. 그의 재산과 정의 회복 약속은 야당에 지금까지 정부에 대한 가장 강력한 도전자를 안겨 줍니다."
 geo_misc.108.a: "야당에 마침내 지도자가 생겼다."
 geo_misc.109.t: "조지아 애국자 동맹"
 geo_misc.109.desc: "다비트 타르한-모우라비, 이르마 이나시빌리와 그 동맹들이 조지아 애국자 동맹을 창당했습니다. 이 우익 포퓰리스트 정당은 정교회 가치와 군사적 중립을 내세워 선거운동을 하며 나토 가입에 회의적입니다."
 geo_misc.109.a: "민족주의 우파가 조직화한다."
 geo_misc.110.t: "기르치 창당"
 geo_misc.110.desc: "주랍 자파리제와 통합국민운동을 이탈한 동료들이 신정치중도 - 기르치를 창당하였습니다. 이 자유지상주의 정당은 최소 국가, 감세, 그리고 폭넓은 개인의 자유를 요구합니다."
 geo_misc.110.a: "자유지상주의의 도전이다."
 geo_misc.111.t: "가하리아의 '조지아를 위하여' 창당"
 geo_misc.111.desc: "조지아의 꿈 지도부와의 갈등 끝에 사임한 기오르기 가하리아 전 총리가 새 정당인 조지아를 위하여를 창당하였습니다. 이 정당은 양대 정당 모두에 맞서는 사회민주주의적이고 친유럽적인 대안을 자처하고 있습니다."
 geo_misc.111.a: "새로운 중도좌파 세력이다."
 geo_misc.112.t: "정당을 등록한 알트인포"
 geo_misc.112.desc: "극우 방송사 알트인포가 보수운동이라는 자체 정당을 등록하였습니다. 이 정당은 성소수자 권리와 서방의 영향력에 반대하며 러시아와의 긴밀한 관계를 공공연히 지지합니다."
 geo_misc.112.a: "극우가 정당 정치에 뛰어들었다."
 geo_misc.113.t: "결성된 국민의 힘"
 geo_misc.113.desc: "소자르 수바리와 일단의 의원들이 조지아의 꿈 원내 교섭단체를 떠나 국민의 힘을 결성하였으나, 정부의 동맹으로 남겠다고 다짐하고 있습니다. 이 단체는 외세의 간섭에 맞서 조지아의 주권을 수호하겠다고 선언합니다."
 geo_misc.113.a: "주권을 위한 새로운 목소리다."
