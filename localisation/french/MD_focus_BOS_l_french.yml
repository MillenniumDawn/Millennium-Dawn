 BOS_ATTITUDE_TOOLTIP: "§YAttitude§! représente la volonté de la faction de coopérer avec le gouvernement central. Certains chemins de concentration peuvent être verrouillés en raison du faible soutien d'une faction requise."
 bos_srpska_gui_info_TOOLTIP: "§YSerbes§! résident pour la plupart dans la République de Srpska, une partie du territoire qui embrasse la Fédération de Bosnie-Herzégovine à l'est et au nord. La République Srpska est une entité indépendante au sein de la Bosnie-Herzégovine. Leur foi est majoritairement orthodoxe."
 bos_bosniak_gui_info_TOOLTIP: "§YBosniaques§! sont un groupe ethnique qui partage conjointement l'entité de la Fédération de Bosnie-Herzégovine à ne pas confondre avec le nom du pays de Bosnie-Herzégovine. Ils résident pour la plupart en Bosnie centrale et sont majoritairement musulmans."
 bos_croat_gui_info_TOOLTIP: "§YCroates§! constituent le groupe minoritaire au sein de la Fédération de Bosnie-Herzégovine. Ils vivent principalement dans la région sud-ouest de la Bosnie, le long de la frontière sud de la Croatie. Leur foi est majoritairement catholique."
