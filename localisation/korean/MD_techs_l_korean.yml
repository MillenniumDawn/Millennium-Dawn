 module_surface_fut_reactor_power2: "하이퍼 첨단 원자로"
 module_surface_fut_reactor_power2_desc: "차세대 원자로는 최고의 성능, 뛰어난 효율, 거의 무제한에 가까운 항속 시간을 가장 현대적인 수상함에 제공합니다.\n\n§G설계 힌트: 원자력 추진은 점진적으로 향상되는 속력과 탁월한 최대 항속거리를 제공하며 연료 없이 운용됩니다. 전 세계에 배치되는 함대에 적합하지만 건조 비용이 극단적으로 비쌉니다.§!"
 module_surface_fut_reactor_power3: "울트라 첨단 원자로"
 module_surface_fut_reactor_power3_desc: "차세대 원자로는 최고의 성능, 뛰어난 효율, 거의 무제한에 가까운 항속 시간을 가장 현대적인 수상함에 제공합니다.\n\n§G설계 힌트: 원자력 추진은 점진적으로 향상되는 속력과 탁월한 최대 항속거리를 제공하며 연료 없이 운용됩니다. 전 세계에 배치되는 함대에 적합하지만 건조 비용이 극단적으로 비쌉니다.§!"
 module_sub_diesel_electric_power6: "디젤전기 추진 6"
 module_sub_diesel_electric_power6_desc: "차세대 디젤전기 추진은 현대식 잠수함에 속도, 항속 시간, 잠항 은밀성의 최적 균형을 제공합니다.\n\n§G설계 힌트: 디젤전기 추진은 연료에 의존하는 저렴한 잠수함을 제공하며, 상위 등급에서 속력, 최대 항속거리, 은밀성이 향상됩니다. 지역 및 인근 해역 작전에 적합하지만 원자로의 전 지구적 항속 시간에는 미치지 못합니다.§!"
 module_sub_diesel_electric_power7: "디젤전기 추진 7"
 module_sub_diesel_electric_power7_desc: "차세대 디젤전기 추진은 현대식 잠수함에 속도, 항속 시간, 잠항 은밀성의 최적 균형을 제공합니다.\n\n§G설계 힌트: 디젤전기 추진은 연료에 의존하는 저렴한 잠수함을 제공하며, 상위 등급에서 속력, 최대 항속거리, 은밀성이 향상됩니다. 지역 및 인근 해역 작전에 적합하지만 원자로의 전 지구적 항속 시간에는 미치지 못합니다.§!"
 module_sub_fut_reactor_power2: "하이퍼 첨단 원자로 동력"
 module_sub_fut_reactor_power2_desc: "하이퍼 첨단 원자로는 근미래 잠수함에 비할 데 없는 항속 시간, 속도, 은밀성을 제공합니다.\n\n§G설계 힌트: 원자력 추진은 잠수함에 높은 속력, 탁월한 최대 항속거리를 부여하며 연료 없이 운용됩니다. 전 지구적 전개에 적합하지만 IC 비용이 더 높고 일반적으로 디젤전기 추진보다 탐지되기 쉽습니다.§!"
 module_sub_fut_reactor_power3: "울트라 첨단 원자로 동력"
 module_sub_fut_reactor_power3_desc: "울트라 첨단 원자로는 근미래 잠수함에 비할 데 없는 항속 시간, 속도, 은밀성을 제공합니다.\n\n§G설계 힌트: 원자력 추진은 잠수함에 높은 속력, 탁월한 최대 항속거리를 부여하며 연료 없이 운용됩니다. 전 지구적 전개에 적합하지만 IC 비용이 더 높고 일반적으로 디젤전기 추진보다 탐지되기 쉽습니다.§!"
 module_light_helipad_3: "경량 헬리패드 III"
 module_light_helipad_3_desc: "강화된 경량 헬리패드는 회전익 작전을 더 잘 지원하여 대잠, 감시, 수송 능력을 향상시킵니다.\n\n§G설계 힌트: 경량 헬리패드는 일반 헬리패드보다 낮은 비용으로 잠수함 탐지, 대잠수함전, 수상 탐지, 소해 능력을 향상시킵니다. 소형 대잠 호위함에 적합하지만 연료 소모, 인력, 수상 가시성이 여전히 증가합니다.§!"
 module_76mm_gun_5: "76mm 초속사포 - 첨단 유도탄"
 module_76mm_gun_5_desc: "첨단 유도탄을 사용하는 76mm 초속사포는 근거리에서 중거리까지 뛰어난 대공 및 대수상 성능을 제공합니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_76mm_gun_6: "76mm 초속사포 - 최첨단 유도탄"
 module_76mm_gun_6_desc: "최첨단 유도탄을 사용하는 76mm 초속사포는 근거리에서 중거리까지 뛰어난 대공 및 대수상 성능을 제공합니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_127mm_guns_5: "127mm V"
 module_127mm_guns_5_desc: "고도로 발전한 127mm 함포는 뛰어난 정확도, 사거리, 발사 속도를 제공하여 함선과 항공기 모두에 효과적입니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_127mm_guns_6: "127mm VI"
 module_127mm_guns_6_desc: "고도로 발전한 127mm 함포는 뛰어난 정확도, 사거리, 발사 속도를 제공하여 함선과 항공기 모두에 효과적입니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 tech_light_guns_5: "함포 2060"
 tech_light_guns_5_desc: "소구경과 대구경을 아우르는 함상 무기 체계로, 수상 표적과 항공 표적 모두와 교전할 수 있도록 설계되었습니다."
 tech_light_guns_6: "함포 2075"
 tech_light_guns_6_desc: "소구경과 대구경을 아우르는 함상 무기 체계로, 수상 표적과 항공 표적 모두와 교전할 수 있도록 설계되었습니다."
 nsb_drone_tech_4: "초첨단 드론 기술"
 nsb_drone_tech_4_desc: "헬리콥터에 탑재되는 드론 무기로, 공격과 방어 임무 모두에 사용됩니다."
 nsb_drone_tech_5: "극초첨단 드론 기술"
 nsb_drone_tech_5_desc: "헬리콥터에 탑재되는 드론 무기로, 공격과 방어 임무 모두에 사용됩니다."
 nsb_defense_tech_5: "첨단 레이저 방어"
 nsb_defense_tech_5_desc: "날아오는 투사체를 물리적으로 무력화할 수 있는 지향성 에너지 방어 체계입니다. 고에너지 레이저를 발사하여 미사일을 명중 전에 파괴하거나 빗나가게 합니다. 회전익 항공기를 위한 최신 세대의 능동 방어를 대표합니다."
 nsb_defense_tech_6: "초첨단 레이저 방어"
 nsb_defense_tech_6_desc: "날아오는 투사체를 물리적으로 무력화할 수 있는 지향성 에너지 방어 체계입니다. 고에너지 레이저를 발사하여 미사일을 명중 전에 파괴하거나 빗나가게 합니다. 회전익 항공기를 위한 최신 세대의 능동 방어를 대표합니다."
 nsb_gun_pods_tech_6: "6세대 건 포드"
 nsb_gun_pods_tech_6_desc: "회전익 항공기의 공격 능력을 강화하도록 설계된 외부 장착식 무기 체계입니다. 이 포드를 사용하면 헬리콥터는 기체를 크게 개조하지 않고도 추가 무장을 탑재할 수 있어, 다양한 임무에 맞는 유연성과 화력 증대를 얻습니다."
 nsb_gun_pods_tech_7: "7세대 건 포드"
 nsb_gun_pods_tech_7_desc: "회전익 항공기의 공격 능력을 강화하도록 설계된 외부 장착식 무기 체계입니다. 이 포드를 사용하면 헬리콥터는 기체를 크게 개조하지 않고도 추가 무장을 탑재할 수 있어, 다양한 임무에 맞는 유연성과 화력 증대를 얻습니다."
 nsb_rocket_pods_tech_6: "6세대 로켓 포드"
 nsb_rocket_pods_tech_6_desc: "헬리콥터 로켓 포드는 헬리콥터에 부착되는 외부 발사대로, 다양한 전투 임무를 위해 무유도 또는 유도 로켓을 운용할 수 있게 합니다. 이 포드는 헬리콥터의 화력을 크게 높여, 지상 표적에 대한 효과적인 교전, 적 진지 제압, 근접 항공 지원 작전을 가능하게 합니다."
 nsb_rocket_pods_tech_7: "7세대 로켓 포드"
 nsb_rocket_pods_tech_7_desc: "헬리콥터 로켓 포드는 헬리콥터에 부착되는 외부 발사대로, 다양한 전투 임무를 위해 무유도 또는 유도 로켓을 운용할 수 있게 합니다. 이 포드는 헬리콥터의 화력을 크게 높여, 지상 표적에 대한 효과적인 교전, 적 진지 제압, 근접 항공 지원 작전을 가능하게 합니다."
 nsb_atgm_tech_6: "6세대 ATGM"
 nsb_atgm_tech_6_desc: "대전차 유도 미사일(ATGM) 포드는 헬리콥터에 장착되는 외부 체계로, 장갑 차량, 방어 시설, 기타 지상 표적을 고도의 정밀도로 교전하고 파괴하도록 설계된 유도 미사일을 운용할 수 있게 합니다. 이 포드는 헬리콥터의 공격 능력을 크게 높여, 다양한 전투 상황에서 효과적인 교전을 가능하게 합니다."
 nsb_atgm_tech_7: "7세대 ATGM"
 nsb_atgm_tech_7_desc: "대전차 유도 미사일(ATGM) 포드는 헬리콥터에 장착되는 외부 체계로, 장갑 차량, 방어 시설, 기타 지상 표적을 고도의 정밀도로 교전하고 파괴하도록 설계된 유도 미사일을 운용할 수 있게 합니다. 이 포드는 헬리콥터의 공격 능력을 크게 높여, 다양한 전투 상황에서 효과적인 교전을 가능하게 합니다."
 nsb_multiple_atgm_tech_6: "6세대 4연장 ATGM 거치대"
 nsb_multiple_atgm_tech_6_desc: "4연장 ATGM(대전차 유도 미사일) 포드는 즉시 발사 가능한 미사일 네 발을 갖춘 발사 체계로, 여러 장갑 표적을 연달아 신속히 교전할 수 있는 플랫폼의 능력을 높여 줍니다. 이러한 구성은 장갑차와 보병 전투차를 비롯한 다양한 군용 차량에 흔히 통합되어 대장갑 전투 효율을 강화합니다."
 nsb_multiple_atgm_tech_7: "7세대 4연장 ATGM 거치대"
 nsb_multiple_atgm_tech_7_desc: "4연장 ATGM(대전차 유도 미사일) 포드는 즉시 발사 가능한 미사일 네 발을 갖춘 발사 체계로, 여러 장갑 표적을 연달아 신속히 교전할 수 있는 플랫폼의 능력을 높여 줍니다. 이러한 구성은 장갑차와 보병 전투차를 비롯한 다양한 군용 차량에 흔히 통합되어 대장갑 전투 효율을 강화합니다."
 nsb_heavy_atgm_tech_6: "6세대 대형 ATGM"
 nsb_heavy_atgm_tech_6_desc: "대형 대전차 유도 미사일(ATGM)은 장갑 차량을 교전하고 파괴하기 위해 설계된 미사일 기술의 초기 발전물이었습니다. 이 체계들은 대개 수동 지령 시선 유도(MCLOS) 방식을 채택하여, 조작병이 비행 내내 미사일을 표적으로 직접 조종해야 했습니다. 이 방식은 광범위한 훈련을 요구했고, 미사일을 유도하는 동안 조작병이 적의 사격에 노출되었습니다."
 nsb_heavy_atgm_tech_7: "7세대 대형 ATGM"
 nsb_heavy_atgm_tech_7_desc: "대형 대전차 유도 미사일(ATGM)은 장갑 차량을 교전하고 파괴하기 위해 설계된 미사일 기술의 초기 발전물이었습니다. 이 체계들은 대개 수동 지령 시선 유도(MCLOS) 방식을 채택하여, 조작병이 비행 내내 미사일을 표적으로 직접 조종해야 했습니다. 이 방식은 광범위한 훈련을 요구했고, 미사일을 유도하는 동안 조작병이 적의 사격에 노출되었습니다."
 nsb_engine_tech_6: "6세대 헬리콥터 엔진"
 nsb_engine_tech_6_desc: "회전익 항공기에 필요한 추력과 양력을 제공하도록 설계된 특수 동력 장치입니다."
 nsb_engine_tech_7: "7세대 헬리콥터 엔진"
 nsb_engine_tech_7_desc: "회전익 항공기에 필요한 추력과 양력을 제공하도록 설계된 특수 동력 장치입니다."
