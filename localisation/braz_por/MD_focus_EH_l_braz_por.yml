 EH_LAUNCH_MISSION: "Lançar Missão"
 EH_LAUNCH_MISSION_DELAYED: "§HPré-requisitos:§!\n[!EH_launch_mission_button_click_enabled]\nSe a missão for bem-sucedida, você ganhará §Y+15% de inteligência do Exército e da Força Aérea§! contra as §RQuimeras§!.\nTambém desbloqueará um novo §YCientista§! para os §YCentros de Pesquisa§!\n\nSe a missão falhar, todos os drones serão perdidos."
