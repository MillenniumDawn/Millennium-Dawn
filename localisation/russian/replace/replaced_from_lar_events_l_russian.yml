 occupied_countries.1.title: "Временное правительство: [FROM.FROM.GetNameDef]"
 occupied_countries.1.desc: "Наша оккупационная администрация на территории [FROM.FROM.GetNameDef] тесно сотрудничает с местными чиновниками, и большая часть населения смирилась с нашим присутствием. Временное правительство из лояльных местных жителей готово взять на себя управление под нашим руководством."
 occupied_countries.1.a: "Они получают наше благословение."
 occupied_countries.1.b: "Они ещё не готовы."
 occupied_countries.1.c: "Хватит приносить нам эти прошения."