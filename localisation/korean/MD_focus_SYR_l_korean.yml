 economy_of_al_suwayda: "수와이다의 경제 상황"
 Syria_economic_investments: "시리아의 경제적 잠재력"
 Syria_economic_investments_desc: "우리의 경제는 이웃 대부분의 나라와 비교하면 언제나 극도로 낙후되고 비효율적이었으나, 위대하고 강력한 경제로 성장할 잠재력을 지니고 있습니다. 우리는 역량을 재건하기 위한 몇 가지 문제점과 잠재적 투자 대상을 파악하였으며, 국가를 위대하게 만들고 국민이 정부에 자긍심과 만족감을 느끼게 하려면 가능한 한 빨리 착수해야 합니다."
 invigorate_hisiyah: "히시야 산업 단지 활성화"
 invigorate_hisiyah_desc: "우리나라의 주요 산업 사업 중 하나는 히시야에 새로운 산업 도시를 건설하는 것이었습니다. 도시는 건설되어 자리를 잡았으나, 경제 성장을 위해서는 이곳에 투자하고 확장해야 합니다."
 hisiyah_industrial_expansion: "산업 단지 확장"
 hisiyah_industrial_expansion_desc: "경제 성장과 기업 친화적 정책 덕분에 성공적인 신생 기업들의 투자가 산업 지구로 쏟아져 들어오고 있습니다. 이를 활용하여 지구를 더욱 확장할 때입니다."
 clear_aleppan_slums: "알레포 빈민가 정비"
 clear_aleppan_slums_desc: "최근의 인구 증가와 실업으로 인해 알레포의 많은 사람들이 빈민가에서 살고 있습니다. 주택 사업을 시작하고 도시 경제에 투자한다면 이 문제를 해소할 수 있을 것입니다."
 aleppan_economy_booming: "알레포의 잠재력에 투자"
 aleppan_economy_booming_desc: "경제 성장과 기업 친화적 정책 덕분에 성공적인 신생 기업들의 투자가 도시의 산업 지구로 쏟아져 들어오고 있습니다. 이제 도시의 산업 역량을 확장할 수 있습니다."
 damascus_private_sector_encouragement: "다마스쿠스 민간 부문 장려"
 damascus_private_sector_encouragement_desc: "다마스쿠스에는 섬유, 식품 가공, 시멘트, 각종 화학 산업 등 폭넓은 산업 활동이 자리하고 있습니다. 공장 대부분은 국가가 운영하고 있으며, 이는 도시의 경제적 잠재력을 끌어내는 데 매우 비효율적인 것으로 드러났습니다. 젊고 유망한 기업들에 투자하여 민간 부문을 확장할 때입니다."
 damascus_private_sector_booming: "다마스쿠스의 유망한 민간 부문에 투자"
 damascus_private_sector_booming_desc: "경제 성장과 기업 친화적 정책 덕분에 민간 부문이 최근 크게 확대되고 성장하였습니다. 이 훌륭한 발전에 투자하여 수도를 경제의 모범으로 만들 것입니다."
 eastern_oil_excavation_phase1: "동부 석유 시추 사업 1단계"
 eastern_oil_excavation_phase2: "동부 석유 시추 사업 2단계"
 eastern_oil_excavation_phase3: "동부 석유 시추 사업 3단계"
 invest_in_eastern_cotton: "동부 면화에 투자"
 invest_in_eastern_cotton_desc: "국토 동부의 면화 재배지에 투자하기 시작할 것입니다."
 Syria_agricultural_subsidies_decisions: "농업 보조금 정책"
 Syria_agricultural_subsidies_decisions_desc: "시리아 정부는 국내 식량 생산을 보장하기 위해 수년간 농업에 막대한 보조금을 지급해 왔습니다. 그 결과 거의 모든 경작 가능 토지가 개간되었습니다."
 syria_decision_increase_subsidies: "보조금 증액"
 syria_decision_decrease_subsidies: "보조금 감액"
 Syria_digital_investments_decisions: "디지털 투자"
 Syria_digital_investments_decisions_desc: "우리의 디지털 기반시설은 극도로 낙후되어 있으며 사실상 존재하지 않는 수준입니다. 이에 대처하기로 결정하였으며, 예산의 일부를 이 기반시설의 개선과 투자에 배정하기 시작할 것입니다."
 syria_decision_increase_investments: "투자 예산 증액"
 syria_decision_decrease_investments: "투자 예산 감액"
 SyriaFocus.86.t: "자원봉사 단체의 부상"
 SyriaFocus.86.d: "자원봉사 단체를 장려하고 지원한 우리의 노력은, 소수 집단과 국민이 정부에 대해 상당한 포용감과 신뢰를 지닌 덕분에 상당한 성공을 거두었습니다. 사람들은 종파와 민족의 장벽을 넘어서는 수많은 단체와 협회를 결성하고 있으며, 대체로 서로에게 매우 관용적입니다. 이는 국가 통합을 향한 훌륭한 진전이지만 갈 길은 여전히 멀며, 형제애에 바탕한 공존과 협력으로 정의되는 국민 통합을 이루기까지는 시간이 걸릴 것입니다."
 SyriaFocus.86.a: "국민이 하나로 모이고 있다"
 SyriaFocus.87.t: "경제적 자립을 이룬 주의 증가"
 SyriaFocus.87.d: "우리의 성공적인 노력과 경제 활동에 대한 완화된 법규 덕분에, 시민들은 일할 동기를 더 크게 느끼고 기업들은 활동에 더 큰 자유를 얻어, 일부 주가 각자의 자원에 맞는 견고하고 자립적인 경제를 발전시키고 있습니다. 이로써 시장에 유동성이 늘고 경제 전반이 개선되었으며, 각 주가 보유한 자원에 기반하여 삶의 질을 직접 높이고 경제적 기회를 늘리는 데 중점을 둔 분권적 발전 계획 덕분임을 모두가 감사히 여겨야 합니다. 그러나 나라가 지속 가능하고 견고하다고 부를 만한 경제를 이루기까지는 시간이 걸릴 것이며, 투자에 성공하는 한 이를 반드시 달성할 것입니다."
 SyriaFocus.87.a: "우리 경제가 나아지고 있다"
 SyriaFocus.88.t: "민족진보전선 승리"
 SyriaFocus.88.d: "민족진보전선 연합이 승리한 것으로 보입니다. 그리고 가장 많은 표를 얻은 정당은 다음과 같습니다."
 SyriaFocus.88.a: "나세르주의자"
 SyriaFocus.88.b: "포퓰리스트"
 SyriaFocus.90.b: "자유주의자"
 SyriaFocus.91.b: "포퓰리스트 공화주의자"
 SyriaFocus.91.c: "글쎄... 그 이야기는 나중에 하자"
 SyriaFocus.97.b: "이번에는 본때를 보여 주자."
 SyriaFocus.98.t: "알라위파 장교들의 이탈!"
 SyriaFocus.98.d: "알라위파는 아사드 가문이 집권하기 전 오랫동안 시리아에서 억압받는 소수 집단이었으며, 이제 그들의 통치가 끝나자 알라위파 고위 장교 집단이 자기 공동체의 현재의 불안한 처지를 내세울 기회를 틈타 알라위파 지역의 독립을 선언하였습니다. 이들은 독립이 공동체를 보호할 것이라고 주장하지만, 사실은 자신들의 권력 지위를 이용해 손에 넣을 수 있는 것은 무엇이든 찬탈하려는 것이 분명합니다."
 SyriaFocus.98.a: "지중해로 나가는 길이 막히는군"
 SyriaFocus.98.b: "우리의 영토 보전은 농담이 아니다"
 SyriaFocus.99.t: "시리아 녹색 연방주의 운동 결성"
 SyriaFocus.99.d: "쿠르드족 정치 활동가 집단이 소외된 쿠르드 주민의 포용성을 높이고 지속 가능한 유인책을 장려하기 위한 해법으로 시리아의 연방화를 촉구하는 운동을 결성하였습니다. 이들의 이상은 정치 무대에서 완전히 외면받았지만, 그 외침이 허공에 흩어지지는 않으리라는 희망을 품고 있습니다."
 SyriaFocus.99.a: "연방주의? 시리아에서?"
 SyriaFocus.100.t: "경제 사업 실패"
 SyriaFocus.100.d: "여러 주에서 경제 번영을 성공적으로 이끌어 내지 못하였습니다. 이는 우리 정부가 국민이 기업을 세우고 그 안에서 일하도록 유인할 만큼 기업 친화적이지 않았기 때문일 수 있습니다."
 SyriaFocus.100.a: "다음에는 더 운이 따르기를"
 SyriaFocus.101.t: "낮은 정치 참여 지속"
 SyriaFocus.101.d: "보고를 받았으며, 사람들이 여전히 주민 회의에 참석할 동기를 충분히 느끼지 못하는 것으로 보입니다. 국민은 여전히 정부와 그 기관이 자신들의 목소리를 들어 줄 것이라는 충분한 신뢰가 없으며, 그에 따라 지역 의사결정에 참여할 마음이 들지 않습니다. 국민이 정치와 사회에서 활동하도록 독려하려면 국민의 신뢰를 얻고 그들의 목소리가 반영될 것임을 확신시켜야 합니다."
 SyriaFocus.101.a: "더 노력해야 한다"
 SyriaFocus.102.t: "정치 참여 증가"
 SyriaFocus.102.d: "국민이 정치에 적극 참여하도록 장려한 우리의 노력이 결실을 거두었습니다. 많은 사람들이 각자 지자체의 주민 회의에 모여 현안과 정책을 논의하고 있습니다. 이는 각 주가 고유한 주민에 맞는 정책을 시행하는 결과로 이어지고, 국민이 법치를 존중하며 원하는 방식대로 자신의 생활양식을 만들어 가도록 보장할 것입니다. 이러한 행태를 정착시키고 스위스식 민주주의를 목격하려면 눈에 띄게 더 많은 노력이 필요합니다."
 SyriaFocus.102.a: "국민이 자신의 운명의 주인이 될 것이다"
 SyriaFocus.103.t: "시리아 연방 수립"
 SyriaFocus.103.d: "길은 길고 험난하였지만 우리는 해냈습니다! 국민을 하나로 모으기 위해 많은 노력을 기울인 끝에, 우리나라는 연방이라는 기치 아래 직접민주주의의 모범 사례가 되었습니다. 분열과 차별, 편협함이 만연하여 극복이 불가능해 보였던 몇 년 전과 달리, 형제애와 협력이 일상이 되었으며 공존이 진정으로 뿌리내려 이러한 분열은 더 이상 보이지 않습니다. 모두가 폭정 없이 자유롭게 살며 분열을 꾀하는 어떠한 시도에도 흔들리지 않는 시리아 연방이여 영원하라. 우리는 희망찬 미래를 이루기 위해 협력할 것입니다."
 SyriaFocus.103.a: "손에 손을 맞잡고 미래를 바라본다"
 SyriaFocus.104.t: "시리아 공화국의 부활"
 SyriaFocus.104.d: "한때 불가능하다고 여겨졌던 일이 이제 현실이 되었습니다! 이질적인 민족들이 모인 지역에서 통합되고 강력한 민족 국가가 국민의 의지로 다시 하나가 되어, 스스로를 시리아 국민의 공복으로 규정하는 국가를 이루었습니다. 이웃 나라들과는 전혀 달리, 국민은 어떤 민족이나 종파에 속하든 자신들을 하나로 묶는 깃발 아래 서 있습니다. 국민이 하나의 정체성 아래 조국과 하나가 되기로 선택하였기에, 다마스쿠스의 삼색 삼성기에 대한 애국심이 다른 어떤 것보다도 크게 넘쳐흐릅니다. 모두가 국가의 영광과 자부심을 경험하고, 역경에 굴하지 않으며, 앞에 놓인 무엇이든 맞서기로 결의한 공화국과 그 국민이여 영원하라."
 SyriaFocus.104.a: "깃발을 높이 올리고 희망을 품어 바라보며 미래를 향해 나아간다"
 SyriaFocus.104.b: "의회 내 지정 의석을 부여한다"
 SyriaFocus.105.t: "드루즈 대표성 문제"
 SyriaFocus.105.d: "드루즈는 시리아 남부 산악 지역에 거주하는 종교적 소수 집단으로, 시리아 역사 내내 탄압을 겪었습니다. 이들이 마땅히 누려야 할 대표성을 확보하도록 의회에 지정 의석을 부여해야 하겠습니까, 아니면 단지 이들 지역의 정치 참여를 장려하는 데 그쳐야 하겠습니까? 의석을 부여하면 정치 체제를 종파 노선에 따라 분열시키는 종파 안배제의 요소가 도입된다는 점을 유념해야 합니다. 정치인들이 권력을 남용하고, 자신을 비판하는 모든 이를 종파 전체를 공격한다고 비난할 수 있으며, 의석을 받지 못한 소수 집단의 불만을 사게 되는 등 훗날 부작용이 있을 수 있습니다."
 SyriaFocus.105.a: "정치 참여를 장려하기만 한다"
 SyriaFocus.105.b: "의회 내 지정 의석을 부여한다"
 SyriaFocus.106.t: "시민권을 박탈당한 쿠르드족의 운명"
 SyriaFocus.106.d: "이전 정권이 집권한 이래 최소 30만 명의 쿠르드족이 시민권을 부여받지 못해 자국에서 외국인 취급을 받고 있습니다. 이들에게 시민권을 부여하는 절차를 시작해야 하겠습니까?"
 SyriaFocus.106.a: "그렇다!"
 SyriaFocus.106.b: "아니!"
 SyriaFocus.107.t: "의석을 요구하는 기독교 공동체!"
 SyriaFocus.107.d: "다른 종교 공동체들이 의회 의석을 받는 것을 본 기독교 공동체는 대표성이 왜곡될 것을 우려하여 자신들에게도 의회 의석을 줄 것을 요구하였습니다. 종파 안배제의 부작용이 커질 위험을 감수하고 의석을 부여해야 하겠습니까? 아니면 의석을 거부하고 기독교 공동체의 불만을 감수해야 하겠습니까?"
 SyriaFocus.107.a: "의석을 부여한다"
 SyriaFocus.107.b: "그들에게는 그럴 자격이 없다"
 SyriaFocus.108.t: "애니메이션 산업 호황"
 SyriaFocus.108.a: "빌어먹을 오타쿠들이 이제 사방에 깔리겠군"
 SyriaFocus.111.t: "쿠르드족의 분리"
 SyriaFocus.111.d: "소외에 불만을 품은 쿠르드 민족이 우리의 약해진 통제력을 이용하여 우리에게 반란을 일으키고 있습니다. 이들은 시리아로부터의 독립을 추구하며 자체 국가를 세우고 있습니다. 이는 시리아에서 또 다른 분쟁으로 이어질 가능성이 큽니다."
 SyriaFocus.111.a: "젠장"
 SyriaFocus.112.t: "인산염 산업과 그 과제"
 SyriaFocus.112.d: "시리아에는 상당한 양의 인산염 자원이 있으므로, 우리 앞에는 두 가지 선택지가 있는 듯합니다. 하나는 수익을 위한 것이고, 다른 하나는 농업을 개선하기 위한 것입니다. 물론 인산염을 수출하면 경제 속도를 다소 높일 수 있겠지만, 농업을 진정으로 중시한다면 약간의 자급자족이 더 나을 수도 있습니다. 결국 자급자족과 무역 중 하나를 고르는 문제입니다. 그렇다면 어느 쪽을 택해야 하겠습니까?"
 SyriaFocus.112.a: "독립적이고 더 나은 시리아를 위해, 우리 자신을 위해 사용한다."
 SyriaFocus.112.b: "이익을 추구하는 것도 나쁘지 않지 않은가?"
 SyriaDecisions.16.t: "승리"
 SyriaDecisions.16.desc: "우리는 국경 전쟁의 목표를 달성하였습니다."
 SyriaDecisions.16.a: "좋아"
 SyriaDecisions.17.t: "실패"
 SyriaDecisions.17.desc: "우리는 국경 전쟁의 목표를 달성하지 못하였습니다."
 SyriaDecisions.17.a: "젠장"
 SYR_homs_oil_refineries_focus: "정유 시설 확장"
 SYR_homs_oil_refineries_focus_desc: "매력적이고 풍부한 석유 매장량이 국가 동부 지역에서 우리의 탐사를 기다리고 있습니다. 우리가 일으킬 오염으로 인해 농업 역량을 희생하는 대가를 치르며 이 과정을 시작할 것입니다."
 military_power_vacuum: "군사 권력 공백"
 military_power_vacuum_desc: "이제 군이 개입하게 된 시리아의 폭력적인 정치 분위기 때문에, 그리고 알라위파 최고 사령부의 붕괴로 이어진 시리아군의 심각한 정치적, 더 정확히 말하면 \\"쿠데타\\" 활동으로 인해 시리아는 혼란의 시대를 겪고 있는 듯합니다. "
 Syria_2000: "시리아 중점 트리"
 TT_SYR_FEDERAL_PARTY_EXISTS_NOT: "연방주의자들이 자신들의 정당을 결성하지 않았습니다"
 TT_SYR_FEDERALIST_COALITION_NOT: "연방주의자들이 정부 연립에 참여하고 있지 않습니다"
 TT_SYR_NATIONALIST_COALITION_NOT: "민족주의자들이 정부 연립에 참여하고 있지 않습니다"
 SYR_BANKING_PROBLEMS_IDEA_MODIFIER: "§Y이는 이후 경제 번영 결정으로 얻는 경제적 이익을 제한하지만, 경제가 우리의 통제 아래 유지되도록 보장합니다. 국내에 민간 은행을 허용하여 이 문제를 해소하면, 반대로 경쟁적인 시장이 형성되어 더 큰 경제 번영이 이루어질 것입니다.§!"
 SYR_ALAWITE_MILITARY_STAFF_IDEA_MODIFIER: "§R이 장교들은 국가가 비세속적 이슬람 공화국이 될 경우 알라위파가 지배하는 지역을 국가에서 떼어내 분리시킬 것이며, 이슬람주의 노선에 동참하려면 국가를 민주화하기 전에 이들을 제거해야 합니다.§!"
 SYR_ALAWITE_MILITARY_STAFF_STRENGTHENED_IDEA_MODIFIER: "§R세력이 강화된 이 장교들은 국가가 비포퓰리즘 민주주의 노선을 택할 경우 쿠데타를 시도할 것입니다.§!"
 SYR_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§Y한 정당을 연립에 초대합니다. 이 정당은 국가 건설 권력 균형 과정에서 중앙집권화든 분권화든 자신의 대의에 참여함으로써 우리에게 큰 도움이 될 것입니다.§!"
 SYR_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§C이 정당을 연립에 두면 국가 건설 권력 균형 과정에서 중앙집권화에 큰 도움이 될 것입니다.§!"
 SYR_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§G이 정당을 연립에 두면 국가 건설 권력 균형 과정에서 분권화에 큰 도움이 될 것입니다.§!"
 SYR_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "성공하면 정치력 §G75§!을 얻고, §Y유망한 관료들§! 국가 정신을 얻어 §Y일일 정치력 획득량§! §G+0.5§! 및 §Y건설 속도§! §G+0.2§!를 §Y100§!일간 부여받습니다"
 SYR_STATE_DECISION_MAKING_SUCCESS_EFFECTS: "성공하면 안정도 §G5%§!를 얻습니다"
 SYR_LOCAL_ACCOUNTABILITY_SUCCESS_EFFECTS: "성공하면 정당 지지도 §G10%§!를 얻고 부패가 감소합니다"
 SYR_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "성공하면 부패가 감소하고, §Y자원봉사 단체의 부상§! 국가 정신을 얻어 일일 정치력 획득량 §G0.2§! 및 건설 속도 §G+30%§!를 §Y100§!일간 부여받습니다"
 SYR_ENCOURAGE_ECONOMIC_SELF_RELIANCE: "성공하면 경제 성장 주기가 향상됩니다"
 TT_SYR_KURDS_WITHOUT_CITIZENSHIPS_PARTY_FORMATION: "§G아사드 일가를 몰아낸 뒤 쿠르드인들에게 시민권을 발급하여 무국적 상태가 해소되면, 이들은 시리아를 연방으로 전환하려는 정당을 결성할 것입니다.§!"
 SYR_ECONOMIC_DECISIONS_ONE_FREE_FACTORIES_EXPLANATION: "§R건설에 배정되지 않은 산업 단지가 최소 한 곳 있어야 합니다. 배정한 건설을 취소하거나, 완료되어 사용 가능해질 때까지 기다리십시오.§!"
 SYR_ECONOMIC_DECISIONS_TWO_FREE_FACTORIES_EXPLANATION: "§R건설에 배정되지 않은 산업 단지가 최소 두 곳 있어야 합니다. 배정한 건설을 취소하거나, 완료되어 사용 가능해질 때까지 기다리십시오.§!"
 SYR_ECONOMIC_DECISIONS_THREE_FREE_FACTORIES_EXPLANATION: "§R건설에 배정되지 않은 산업 단지가 최소 세 곳 있어야 합니다. 배정한 건설을 취소하거나, 완료되어 사용 가능해질 때까지 기다리십시오.§!"
 SYR_FEDERAL_FORMATION_TOOLTIP: "모든 소수 집단 포용도 수치가 §Y50%§! 이상이면 §G시리아 연방§!이 수립됩니다"
 SYR_UNITARY_FORMATION_TOOLTIP: "모든 소수 집단 포용도 수치가 §Y50%§! 이상이면 §C시리아 공화국§!이 수립됩니다"
