l_english:

 # Decisions
 SUR_resource_decisions: "Surinamese Resources"
 SUR_resource_decisions_desc: "Oil, gold and bauxite are the foundation of Suriname's export income. Staatsolie, foreign mining companies and the state decide how fast each deposit is brought into production."
 SUR_expand_staatsolie_onshore_fields: "Expand the Staatsolie Onshore Fields"
 SUR_expand_staatsolie_onshore_fields_desc: "Staatsolie, the state oil company, produces crude from Tambaredjo and the neighboring fields of the coastal belt. New wells and enhanced recovery can lift its output."
 SUR_appraise_block_58: "Appraise the Block 58 Discovery"
 SUR_appraise_block_58_desc: "In January 2020 Apache and Total found oil at Maka Central-1, the first discovery on Block 58 offshore Suriname. Appraisal wells over the following years will show which finds can be developed. Staatsolie covers seismic review, port access and local content planning."
 SUR_block_58_appraised_tt: "Block 58 has been appraised"
 SUR_approve_granmorgu_development: "Join the GranMorgu Development"
 SUR_approve_granmorgu_development_desc: "TotalEnergies and APA took the final investment decision on the 10.5 billion dollar GranMorgu project in October 2024, with first oil planned for mid-2028. Staatsolie holds an option on up to 20 percent of the project, and our payment covers that stake."
 SUR_develop_rosebel_gold_mine: "Back the Rosebel Gold Mine"
 SUR_develop_rosebel_gold_mine_desc: "Cambior took full control of the Rosebel project in 2002 and built an open-pit gold mine in Brokopondo, which began production in early 2004. IAMGOLD later took it over. The state holds a minority stake, and our payment covers its share of the work. Gold counts as chromium, our precious metals resource."
 SUR_develop_merian_gold_mine: "Back the Merian Gold Mine"
 SUR_develop_merian_gold_mine_desc: "Newmont approved full funding for Merian in July 2014 and began construction that August. Staatsolie holds 25 percent of the mine for the state, and our payment covers its share. The mine poured its first gold and entered commercial production in October 2016. Gold counts as chromium, our precious metals resource."
 SUR_revive_bauxite_mining: "Revive Surinamese Bauxite"
 SUR_revive_bauxite_mining_desc: "Alcoa's Suralco idled the Paranam refinery in late 2015 and announced in January 2017 that it would close the refinery and its bauxite mines for good. The Bakhuis deposit in the west holds proven reserves of 324 million tons, and the state is seeking investors to mine it."

 # Events
 suriname.1.t: "The New Front Wins a Majority"
 suriname.1.d: "On 25 May 2000 the New Front for Democracy and Development wins 33 of the 51 seats in the National Assembly. Ronald Venetiaan of the National Party of Suriname, the alliance's candidate for president, can now be elected when the Assembly meets in August."
 suriname.1.a: "Govern with the new majority"
 suriname.1.b: "Reach out to the opposition"

 suriname.2.t: "The Assembly Elects Bouterse"
 suriname.2.d: "The Mega Combination, built around Desi Bouterse's National Democratic Party, wins the most seats in the May 2010 election. On 19 July the National Assembly elects Bouterse president with 36 votes, after he wins over the A-Combination and the People's Alliance. The former military ruler returns to power through the ballot box while a trial over the 1982 December murders is still pending."
 suriname.2.a: "Elect Bouterse"
 suriname.2.b: "Keep the New Front in office"

 suriname.3.t: "Bouterse Convicted of the December Murders"
 suriname.3.d: "On 29 November 2019 a military court sentences Desi Bouterse to 20 years in prison for the murder of 15 political opponents in December 1982. Bouterse, the founder of the National Democratic Party, disputes the verdict and appeals."
 suriname.3.a: "Rally behind Bouterse"
 suriname.3.b: "Demand that he answers to the court"

 suriname.4.t: "The Highest Court Upholds the Verdict"
 suriname.4.d: "On 20 December 2023 Suriname's highest court upholds Desi Bouterse's 20-year sentence for the December murders, ending the appeals. Bouterse, now a former president, is expected to report to the prison authorities."
 suriname.4.a: "Respect the ruling"
 suriname.4.b: "Protest the ruling"

 suriname.5.t: "Bouterse Goes Into Hiding"
 suriname.5.d: "Desi Bouterse does not report to the prison authorities. A manhunt for him begins on 12 January 2024, and he stays in hiding."
 suriname.5.a: "Order a manhunt"
 suriname.5.b: "Leave the matter to the courts"

 suriname.6.t: "Bouterse Dies in Hiding"
 suriname.6.d: "In late December 2024 the government announces the death of Desi Bouterse at the age of 79, almost a year after he went into hiding to avoid prison. It rules out a state funeral for the former military ruler and president."
 suriname.6.a: "Rule out a state funeral"
 suriname.6.b: "Honor him as a former president"

 suriname.7.t: "Santokhi Takes Office"
 suriname.7.d: "After the May 2020 election the Progressive Reform Party forms a coalition with the General Liberation and Development Party, the National Party of Suriname and Pertjajah Luhur. On 13 July the National Assembly elects its leader Chan Santokhi president and Ronnie Brunswijk of the General Liberation and Development Party vice president. They are sworn in on 16 July in a ceremony closed to the public because of the pandemic."
 suriname.7.a: "Seat the Santokhi government"
 suriname.7.b: "Keep the current government"

 suriname.8.t: "Suriname Defaults on Its Eurobonds"
 suriname.8.d: "Suriname uses a 30-day grace period on a dollar-bond coupon due on 26 October 2020. The grace period expires on 26 November without a payment, and the government asks the holders of its 2023 and 2026 bonds to defer payments while it negotiates with creditors."
 suriname.8.a: "Suspend payments and open talks"
 suriname.8.b: "Pay the bondholders from the treasury"

 suriname.9.t: "The IMF Approves a Program"
 suriname.9.d: "On 22 December 2021 the IMF Executive Board approves a 36-month Extended Fund Facility of about 688 million dollars for Suriname. The program is tied to fiscal consolidation, subsidy reform and a restructuring of the public debt."
 suriname.9.a: "Accept the program"
 suriname.9.b: "Refuse the conditions"

 suriname.10.t: "Protesters Storm the National Assembly"
 suriname.10.d: "On 17 February 2023 about 2,000 people march through Paramaribo against rising prices, a new tax on imports and the phasing out of fuel and electricity subsidies. Some break into the National Assembly and others loot shops, and the police answer with tear gas and more than 100 arrests. The government imposes a curfew."
 suriname.10.a: "Back the police and keep the cuts"
 suriname.10.b: "Delay the subsidy cuts"

 suriname.11.t: "Suriname Swears In Its First Female President"
 suriname.11.d: "After the May 2025 election the National Democratic Party holds the most seats and forms a coalition with the General Liberation and Development Party, the National Party of Suriname, Pertjajah Luhur, Alternative 2020 and Brotherhood and Unity in Politics. On 6 July the National Assembly elects Jennifer Geerlings-Simons president without an opponent, and she is sworn in on 16 July as the first woman to lead the country."
 suriname.11.a: "Swear in President Geerlings-Simons"
 suriname.11.b: "Keep the current government"
 suriname.12.t: "Alcoa Leaves Suriname"
 suriname.12.d: "Alcoa has confirmed that its Suralco subsidiary will not restart the Paranam refinery, idled since late 2015, and will close its Surinamese bauxite operations for good. Nearly a century of bauxite mining around Paramaribo ends, and with it hundreds of jobs and a pillar of our export income. Reopening bauxite will now mean finding a new partner for the deposits in the west."
 suriname.12.a: "A hard day for Paranam"
