 SOV_eighteen_bars_start: "§YBARS 18§! - Vimpel"
 SOV_eighteen_bars_start_desc: "Formado por los cosacos del Ejército del Don, residentes de la región de Rostov"
 SOV_thirty_two_bars_start: "§YBARS 32§! - Batallón de Voluntarios en nombre de P. A. Sudoplatov"
 SOV_roskosmos_bars_start: "§YBatallón§! Uran"
