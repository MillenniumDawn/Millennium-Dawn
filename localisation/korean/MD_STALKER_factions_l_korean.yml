l_korean:
 STALKER_faction_military: "군"
 STALKER.120.t: "구역을 둘러싼 전쟁"
 STALKER.120.d: "[STALKER_zone_name]에서 [STALKER_zone_war_side_a]와(과) [STALKER_zone_war_side_b] 사이에 전투가 벌어졌습니다. 어느 쪽도 빠르게 이길 수 없고, 전투가 한 달 이어질 때마다 스토커가 죽고 경계 초소가 부서집니다."
 STALKER.120.a: "[STALKER_zone_war_side_a]을(를) 지지한다."
 STALKER.120.a_tt: "§R25§! 정치력이 든다. [STALKER_zone_war_side_a]이(가) 구역 내 영향력 §G10§!을 얻는다. 전쟁이 이어지는 동안 구역은 매달 스토커 §R3§!명과 §Y봉쇄도§! §R3§!을 잃는다."
 STALKER.120.b: "[STALKER_zone_war_side_b]을(를) 지지한다."
 STALKER.120.b_tt: "§R25§! 정치력이 든다. [STALKER_zone_war_side_b]이(가) 구역 내 영향력 §G10§!을 얻는다. 전쟁이 이어지는 동안 구역은 매달 스토커 §R3§!명과 §Y봉쇄도§! §R3§!을 잃는다."
 STALKER.120.c: "끝장을 보게 내버려 둔다."
 STALKER.120.c_tt: "전쟁이 이어지는 동안 구역은 매달 스토커 §R3§!명과 §Y봉쇄도§! §R3§!을 잃는다. 마지막에 더 강한 쪽은 영향력 §G15§!를 얻고, 진 쪽은 §R25§!를 잃는다."
 STALKER.121.t: "구역을 둘러싼 전쟁 종결"
 STALKER.121.d_duty: "듀티이 [STALKER_zone_name]의 거점에서 프리덤을 몰아냈습니다. 이제 듀티의 검문소가 중심으로 가는 길을 장악하고 있습니다."
 STALKER.121.d_freedom: "프리덤이 [STALKER_zone_name]에서 듀티의 장악력을 깨뜨렸습니다. 중심으로 가는 길이 다시 열렸고, 원하는 이라면 누구나 갈 수 있습니다."
 STALKER.121.d_military: "군과 보안 부대가 [STALKER_zone_name]에서 밴디트 무리를 소탕했습니다. 살아남은 자들은 흩어지거나 북쪽으로 달아났습니다."
 STALKER.121.d_bandits: "밴디트 무리가 [STALKER_zone_name]에서 보안군과 교착 상태에 이르렀고, 이제 군인들이 버리고 간 도로를 장악하고 있습니다."
 STALKER.121.a: "구역에 새로운 질서가 세워졌다."
 STALKER_faction_ward: "와드"
 STALKER_faction_spark: "스파크"
 STALKER.121.d_ward: "SIRCAA의 사병 조직인 와드가 [STALKER_zone_name]의 발전소 진입로에서 스파크의 장악력을 깨뜨렸습니다. 이제 와드의 순찰대가 누가 중심에 닿을지, 그리고 그 이유까지 결정합니다."
 STALKER.121.d_spark: "스카의 스파크가 와드를 [STALKER_zone_name] 심장부에서 몰아냈습니다. 추종자들은 빛나는 구역이 마침내 손 닿는 곳에 있다고 말합니다."
 STALKER.122.t: "클리어 스카이 몰락"
 STALKER.122.d: "[STALKER_zone_name] 늪지대의 기지에서 구역을 이해하려 했던 집단 클리어 스카이가 전멸했습니다. 다른 이들이 스카라 부르던 용병 한 명이 살아남아 북쪽으로 향하는 모습이 마지막으로 목격되었습니다."
 STALKER.122.a: "늪지대는 다시 구역의 것이 되었다."
 STALKER.123.t: "정오"
 STALKER.123.d: "[STALKER_zone_name]에서 마지막 공격 후 붙잡힌 모놀리스 대원들이 세뇌에서 깨어났습니다. 스트라이더라는 스토커를 따르는 이들은 스스로를 눈(Noon)이라 칭하며 옛 형제들에게 총구를 돌렸습니다."
 STALKER.123.a: "모놀리스의 적이라면 우리에게 쓸모가 있다."
 STALKER_faction_noon: "눈"
 STALKER.121.d_noon: "스트라이더의 눈이 [STALKER_zone_name]의 외곽 진지에서 모놀리스를 몰아냈습니다. 붙잡은 포로 가운데 일부는 벌써 깨어나고 있습니다."
 STALKER.121.d_monolith: "모놀리스가 [STALKER_zone_name]에서 눈을 짓밟았습니다. 살아남은 이탈자들은 흩어졌고, 모놀리스의 순찰대는 다시 남쪽으로 이동하고 있습니다."
 STALKER_tearling_leader_stalkers: "자유 스토커"
 STALKER_tearling_leader_ecologists: "생태학자"
 STALKER_tearling_leader_bandits: "밴디트"
 STALKER.150.t: "세력 간 전쟁"
 STALKER.150.d: "SIRCAA는 [STALKER_zone_name]의 스토커들이 오래도록 쓸모없다고 기록해 온 흔한 결정체인 티어링을 원하며, 모든 세력에 석 달 뒤 교환 자리에 가져오라고 요청했습니다. 와드, 눈, 스파크, 심지어 IPSF까지 구할 수 있는 스토커를 모조리 모집하고 있으며, 가장 많이 가져오는 쪽이 SIRCAA의 감사를 받게 됩니다. 우리는 한 세력이 앞서도록 은밀히 도울 수 있습니다."
 STALKER.150.a: "자유 스토커를 지지한다."
 STALKER.150.b: "듀티을 지지한다."
 STALKER.150.c: "프리덤을 지지한다."
 STALKER.150.e: "생태학자를 지지한다."
 STALKER.150.f: "SIRCAA에 맡긴다."
 STALKER.150.back_tt: "§R25§! 정치력이 든다. 우리가 지지한 세력은 석 달 동안 매달 티어링 §G5§!개를 더 모은다. 그 세력이 가장 많이 가져오면 SIRCAA가 우리에게 정치력 §G50§!을 지급한다.\n교환 때 티어링이 가장 많은 세력은 영향력 §G10§!을 얻고, 참여한 모든 세력은 §G3§!, 와드는 §G5§!를 얻는다."
 STALKER.150.f_tt: "자유 스토커, 듀티, 프리덤, 생태학자, 밴디트가 석 달 동안 경쟁한다. 교환 때 티어링이 가장 많은 세력은 영향력 §G10§!을 얻고, 참여한 모든 세력은 §G3§!, 와드는 §G5§!를 얻는다."
 STALKER.151.t: "티어링 교환"
 STALKER.151.d: "SIRCAA가 [STALKER_zone_name]의 교환을 마감했습니다. 세력들이 가져온 티어링은 총 §Y[?global.STALKER_tearlings_total|0]§!개이며, 가장 많이 가져온 쪽은 §Y[?global.STALKER_tearlings_best|0]§!개를 낸 [STALKER_tearling_leader]였습니다. SIRCAA는 공개적으로 감사를 표했고 모든 세력에 몫을 지급했습니다."
 STALKER.151.d_backed: "SIRCAA가 [STALKER_zone_name]의 교환을 마감했습니다. 세력들이 가져온 티어링은 총 §Y[?global.STALKER_tearlings_total|0]§!개이며, 우리가 지지한 세력인 [STALKER_tearling_leader]이(가) §Y[?global.STALKER_tearlings_best|0]§!개로 가장 많이 가져왔습니다. SIRCAA는 모든 세력에 몫을 지급했고, 우리의 도움에 대한 대가로 정치력 §G50§!도 지급했습니다."
 STALKER.151.a: "SIRCAA가 결정체를 연구하게 둔다."