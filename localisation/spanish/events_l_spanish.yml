 UN.414.d: "La §YAsamblea General§! de las §BNaciones Unidas§! ha aprobado una resolución no vinculante sobre el §YEnergía Limpia§!. Aunque no votamos a favor de esta resolución, aún podemos aceptarla e implementarla.\n\n¿Deberíamos aceptar esta resolución?"
 UN.415.t: "Resolución: Crecimiento Económico"
 UN.415.d: "La §YAsamblea General§! de las §BNaciones Unidas§! ha aprobado una resolución no vinculante sobre el §YCrecimiento Económico§!. Aunque no votamos a favor de esta resolución, aún podemos aceptarla e implementarla.\n\n¿Deberíamos aceptar esta resolución?"
 UN.416.t: "Resolución: Desarrollo de Infraestructura"
 UN.416.d: "La §YAsamblea General§! de las §BNaciones Unidas§! ha aprobado una resolución no vinculante sobre el §YDesarrollo de Infraestructura§!. Aunque no votamos a favor de esta resolución, aún podemos aceptarla e implementarla.\n\n¿Deberíamos aceptar esta resolución?"
 UN.417.t: "Resolución: Reducción de la Desigualdad"
 UN.417.d: "La §YAsamblea General§! de las §BNaciones Unidas§! ha aprobado una resolución no vinculante sobre el §YReducción de la Desigualdad§!. Aunque no votamos a favor de esta resolución, aún podemos aceptarla e implementarla.\n\n¿Deberíamos aceptar esta resolución?"
