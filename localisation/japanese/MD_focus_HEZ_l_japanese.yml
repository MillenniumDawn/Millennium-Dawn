 message_from_iran.1.t: "イランが装備を送付"
 message_from_iran.1.d: "今日、我々は基地の一つで大規模かつ機密の輸送物を受け取った。それはイランから送られたことが判明した。この輸送物には地上戦およびゲリラ戦用の軍事装備が含まれており、我々はそれらを使って自衛し、敵と対峙することができる。"
 message_from_iran.1.o1: "ありがとう"
 message_from_iran.2.t: "イランが資金を送付"
 message_from_iran.2.d: "我々は基地の一つから連絡を受け、多数のスーツケースに入った米ドルの現金輸送物がイランから送られた。"
 message_from_iran.2.o1: "ありがとう"
 message_from_iran.3.t: "イランが工場を建設"
 message_from_iran.3.d: "イランは我々のために地下工場を建設してくれた。それを使えば、損傷を心配することなく他の建造物を建設できる。"
 message_from_iran.3.o1: "ありがとう"
