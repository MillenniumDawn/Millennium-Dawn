 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SHORE_BOMBARDMENT_DESC: "Из-за слабых возможностей обстрела побережья оперативное соединение не сможет эффективно помогать бригадам на береговой линии в бою. Подумайте о том, чтобы добавить в соединение корабли с §Yатакой тяжёлыми орудиями§!."
