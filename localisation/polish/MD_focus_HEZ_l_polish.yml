 message_from_iran.3.t: "Iran zbudował nam fabrykę"
 message_from_iran.3.d: "Iran zbudował dla nas podziemną fabrykę, którą możemy wykorzystać do budowy innych obiektów, nie martwiąc się o jej uszkodzenie."
