 FRA_corporate_systems_events.27.d: "Orange doit choisir les fournisseurs de son réseau mobile de nouvelle génération. Nokia et Ericsson offrent la continuité dans l'écosystème télécoms européen, Huawei un déploiement rapide, et un réseau équilibré éviterait la dépendance à un seul vendeur."
 FRA_corporate_systems_events.27.t: "Qui construit le réseau 5G en France ?"
 FRA_corporate_systems_events.28.a: "Restreindre les autorisations Huawei"
 FRA_corporate_systems_events.28.a_tt: "Souveraineté stratégique : §G+0.6§!\nIntégration européenne : §G+0.3§!\nDépendance aux fournisseurs chinois : §G-3§!\nGagne §YFardeau du remplacement des fournisseurs 5G§! pendant §Y730 jours§!."
 FRA_corporate_systems_events.28.b: "Permettre un déploiement à long terme"
 FRA_corporate_systems_events.28.b_tt: "Souveraineté stratégique : §R-0.5§!\nInfrastructure numérique : §G+0.4§!\nDépendance aux fournisseurs chinois : §R+2§!"
 FRA_corporate_systems_events.28.c: "Exiger une diversification rapide des fournisseurs"
 FRA_corporate_systems_events.28.c_tt: "Pouvoir politique : §R-75§!\nSouveraineté stratégique : §G+0.8§!\nCapacité télécoms : §G+0.5§!\nDépendance aux fournisseurs chinois : §G-4§!\nGagne §YFardeau du remplacement des fournisseurs 5G§! pendant §Y548 jours§!."
