 UKR_lahuna_program_over: "Мы завершили строительство разведывательного корабля «Симферополь»"
 UKR_modernize_t55_64: "Разработка §YТ-55-64§!"
 UKR_modernize_t55_64_desc: "§WТ-55-64 — украинская гибридная модернизация Т-55, созданная Харьковским бронетанковым ремонтным заводом. Проект объединяет штатную башню Т-55 с шасси Т-64, что даёт машине лучшую подвижность и более современную подвеску и ходовую часть. Танк оснащён 700-сильным дизелем 5ТДФ и получил дополнительную динамическую защиту на башне. Т-55-64, разработанный и испытанный в середине 2000-х, задумывался как сравнительно недорогой способ продлить срок службы устаревших Т-55.§!"
 UKR_develop_bmp64: "Разработка §YБМП-64§!"
 UKR_develop_bmp64_flag: "Завершено принятие решения §YРазработка БМП-64§!"
 UKR_develop_bmp64_desc: "§WБМП-64 — экспериментальная тяжёлая боевая машина пехоты, разработанная харьковскими конструкторами на шасси Т-64. При переделке снимается штатная танковая башня, а корпус перекомпоновывается так, чтобы обеспечить защищённое десантное отделение, при этом сохраняется большая часть тяжёлого шасси и защиты танка. Первый прототип получил дистанционно управляемый боевой модуль и кормовые двери для посадки, заложив базовую концепцию украинской тяжёлой боевой машины пехоты.§!"
 UKR_develop_bmp64d: "Разработка §YБМП-64Д§!"
 UKR_develop_bmp64d_desc: "§WБМП-64Д — развитие исходной концепции БМП-64. Машина получает расширенный боевой модуль с дополнительными противотанковыми и зенитными возможностями, а также улучшенную защиту и оборудование. Проект представляет собой попытку превратить шасси Т-64 в универсальную тяжёлую пехотную платформу, способную поддерживать войска и сохраняющую живучесть корпуса танкового происхождения.§!"
 UKR_develop_bmpt64: "Разработка §YБМПТ-64§!"
 UKR_develop_bmpt64_desc: "§WБМПТ-64 — дальнейшее развитие украинской тяжёлой боевой машины пехоты на базе Т-64. Переработанный корпус и необитаемая башня улучшают внутреннюю компоновку, а кормовая аппарель обеспечивает более удобный доступ в десантное отделение. Машина вобрала технологии, созданные для других украинских программ модернизации Т-64, включая улучшенную защиту и боевое оснащение. БМПТ-64 стала одной из самых совершенных концепций семейства УМР-64.§!"
 UKR_develop_bmpk64: "Разработка §YБМП-К-64§!"
 UKR_develop_bmpk64_desc: "§WБМП-К-64 — необычная колёсная версия семейства боевых машин пехоты на базе Т-64. Исходное гусеничное шасси основательно переработано в платформу 8x8, а двигатель и трансмиссия приспособлены для привода колёс. Получившаяся машина заметно легче и быстрее гусеничных аналогов и при этом сохраняет значительную защиту, унаследованную от исходного танкового шасси. Прототип продемонстрировал стремление Украины использовать стареющие корпуса Т-64 как основу для новых бронемашин.§!"
 UKR_develop_t72ag: "Разработка §YТ-72АГ§!"
 UKR_develop_t72ag_desc: "§WТ-72АГ — украинская экспортная модернизация Т-72 с использованием технологий, созданных для Т-80УД и Т-84. Модернизация существенно улучшает силовую установку, аппаратуру управления огнём, защиту и прочие системы, сохраняя исходные корпус и башню Т-72. Проект представляет собой одну из ранних украинских попыток соединить танковые платформы советской эпохи с отечественными постсоветскими технологиями.§!"
 UKR_develop_t72_120: "Разработка §YТ-72-120§!"
 UKR_develop_t72_120_desc: "§WТ-72-120 — украинская экспортная модернизация, призванная приблизить платформу Т-72 к западным стандартам эксплуатации. Самая характерная её черта — переработанная кормовая ниша башни с автоматом заряжания и отделённым отсеком боеприпасов. Вместе с модернизированной системой управления огнём и вспомогательными системами проект демонстрирует амбициозную попытку приспособить советскую конструкцию Т-72 для зарубежных заказчиков.§!"
 UKR_develop_t72ua1: "Разработка §YТ-72УА1§!"
 UKR_develop_t72ua1_desc: "§WТ-72УА1 — экономичная украинская модернизация Т-72, разработанная прежде всего для зарубежных заказчиков. Программа сосредоточена на улучшении подвижности, защиты, приборов наблюдения и управления огнём при сохранении базовой архитектуры Т-72. Её подход делает ставку на практический ремонт и модернизацию имеющихся машин, а не на создание совершенно нового танка.§!"
 UKR_develop_t80_2019: "Разработка §YТ-80БВ обр. 2019§!"
 UKR_develop_t80_2019_desc: "§WТ-80БВ обр. 2019 — модернизация Т-80БВ для украинских десантно-штурмовых войск и морской пехоты с учётом опыта модернизации Т-64БВ обр. 2017. Программа добавляет современную тепловизионную аппаратуру, обновлённые системы связи и навигации, улучшенную защиту и другие модернизированные узлы. Танк сочетает подвижность Т-80 с оборудованием, созданным на основе более широкого украинского опыта модернизации бронетанкового парка.§!"
 UKR_develop_skif: "Разработка БТР §YСкиф§!"
 UKR_develop_skif_desc: "§W«Скиф» — новый украинский гусеничный бронетранспортёр, разработанный компанией «Укрармотех» на базе БТР M113. Машина построена вокруг переднего моторного отделения и кормового десантного отделения с аппарелью, а её модульное шасси рассчитано на целое семейство машин. Прототип получил корпус из алюминиевой брони и современные украинские системы связи, навигации и электроники. Заводские испытания начались в 2026 году, когда компания приступила к оценке подвижности и общей конструкции платформы.§!"
 UKR_develop_kevlar_e: "Разработка §YКевлар-Е§!"
 UKR_develop_kevlar_e_desc: "§W«Кевлар-Е» — украинская боевая машина пехоты, созданная переделкой шасси самоходной гаубицы 2С1. При перекомпоновке силовая установка переносится вперёд, а в корме образуется более просторное защищённое десантное отделение. Разнесённое бронирование, дополнительная внутренняя защита и дистанционно управляемая башня превращают артиллерийское шасси в современную пехотную платформу. Проект показывает, как стареющие советские машины можно переделать в новые бронированные платформы.§!"
 UKR_develop_bm21_k: "Разработка РСЗО §YБМ-21К§!"
 UKR_develop_bastion03: "Разработка РСЗО §Y«Бастион-03»§!"
 UKR_develop_Vilkha: "Разработка РСЗО §Y«Вильха»§!"
 UKR_develop_bureviy: "Разработка РСЗО нового поколения §Y«Буревий»§!"
 UKR_modernize_mi24pu1: "Модернизация §YМи-24ПУ-1§!"
 UKR_develop_t72mp: "Разработка §YТ-72МП§!"
 UKR_develop_t72mp_desc: "§WТ-72МП — масштабный пакет модернизации, созданный Харьковским конструкторским бюро по машиностроению имени Морозова совместно с чешскими и французскими компаниями и представленный в 1997 году. Он включал модернизированную силовую установку 6ТД-1, усиленную защиту и современную французскую систему управления огнём SAGEM SAVAN 15MP с тепловизионным и панорамным прицелами. Т-72МП, созданный прежде всего для экспорта, показал, как украинские технологии можно сочетать с современными западными системами, чтобы продлить срок службы платформы Т-72.§!"
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.name: "«Симферополь»: корпус на Рыбальском стапеле"
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.desc: "С 1971 года верфь заложила 347 таких судов и знает чертежи наизусть. Прямо сейчас на стапеле стоит недостроенный корпус проекта 502ЭМ — рыболовецкое судно, но с водоизмещением, дальностью и автономностью, которые нам нужны.\n\nАльтернатива — заложить новый корпус по тем же чертежам 502ЭМ, а не достраивать брошенный. Верфь будет в восторге. Министерство финансов — нет."
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.a: "Переоборудовать корпус траулера."
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.b: "Заложить новый корпус по тем же чертежам."
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.c: "У флота есть более срочные нужды."
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.name: "«Симферополь»: чем она слушает"
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.desc: "Корпус — самая дешёвая часть. Корабль — это его антенны, и вопрос в том, чьи это будут антенны.\n\nНаши институты могут создать пассивный комплекс: радиотехническую разведку в нескольких диапазонах, классификацию и пеленгацию. Это займёт больше времени, зато он будет нашим. Западный комплекс РТР придёт уже интегрированным, испытанным и дорогим — и с условиями."
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.a: "Установить отечественный комплекс."
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.b: "Купить западный комплекс РТР."
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.name: "«Симферополь»: вниз по Днепру"
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.desc: "Её спускают со стапеля на Рыбальском. Теперь самое неудобное: верфь в Киеве, флот — в Чёрном море, а между ними шестьсот километров реки с мостами.\n\nБезопасный вариант — плавучий док на всём пути до Херсона и дальше. Дешёвый — вести её своим ходом и надеяться, что хватит глубины и высоты под мостами."
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.a: "Перевезти её в плавучем доке."
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.b: "Вести её своим ходом."
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.name: "«Симферополь»: на мели в Днепре"
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.desc: "Она застряла ниже Херсона с повреждённой ходовой частью и крайне смущённой перегонной командой. Верфь говорит, что всё можно исправить. Верфь всегда так говорит."
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.a: "Оплатить ремонт."
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.b: "Оставить её в Херсоне."
 ukraine_reorganize_navy_build_simferopol_recon_ship.5.name: "«Симферополь»: перегон завершён"
 ukraine_reorganize_navy_build_simferopol_recon_ship_program_over_flag: " Программа разведывательного корабля §Y«Симферополь»§! завершена"
 ukraine_reorganize_navy_build_simferopol_recon_ship.5.desc: "Мы наконец успешно перегнали наш новейший разведывательный корабль вниз по Днепру — без единого происшествия! Теперь можно начать подготовку экипажа, а затем наконец использовать этот ценный корабль в наших интересах."
 ukraine_reorganize_navy_build_simferopol_recon_ship.5.a: "Наконец-то!"
 ukraine_develop_btr3.1.name: "БТР-3: итоги тендера в ОАЭ"
 ukraine_develop_btr3.1.desc: "Сегодня мы представили новый БТР-3У «Охоронец» на выставке в ОАЭ в рамках текущего тендера на 90 БТР для морской пехоты Эмиратов.\nПрезентация прошла хорошо, несмотря на невыносимую жару.\nНам удалось показать все ключевые преимущества нашей машины, и теперь мы ждём, когда другая сторона объявит итоги."
 ukraine_develop_btr3.1.a: "И мы победили!"
 ukraine_develop_btr3.1.b: "Не в этот раз…"
 ukraine_develop_btr3.2.name: "Первая партия БТР-3 доставлена в ОАЭ"
 ukraine_develop_btr3.2.desc: "Первая партия бронетранспортёров БТР-3 успешно доставлена в Объединённые Арабские Эмираты.\nЭто важная веха для украинского оборонного экспорта, показывающая, что наша новая машина нашла место на международном рынке.\nМорская пехота Эмиратов может приступить к собственным испытаниям первых машин и подготовке экипажей."
 ukraine_develop_btr3.2.a: "Отлично!"
 ukraine_develop_btr3.3.name: "Вторая партия БТР-3 доставлена в ОАЭ"
 ukraine_develop_btr3.3.desc: "В Объединённые Арабские Эмираты прибыла очередная партия бронетранспортёров БТР-3, что приближает нас к выполнению условий контракта.\nМашины уже хорошо показали себя на первичной подготовке и испытаниях, укрепляя нашу репутацию надёжного поставщика современной бронетехники.\nБольшая часть заказа уже поставлена, и успешное завершение контракта близко."
 ukraine_develop_btr3.3.a: "Отлично!"
 ukraine_develop_btr3.4.name: "Последняя партия БТР-3 доставлена в ОАЭ"
 ukraine_develop_btr3.4.desc: "Последняя партия бронетранспортёров БТР-3 доставлена в Объединённые Арабские Эмираты — наш первый крупный экспортный контракт на эту машину выполнен.\nУспешное выполнение заказа — важное достижение украинского ОПК, открывающее путь к дальнейшему сотрудничеству с ОАЭ.\nТеперь, когда БТР-3 прочно вошёл в состав вооружённых сил Эмиратов, у нас есть возможность расширить это партнёрство. Воспользуемся ли мы этим уникальным шансом?"
 ukraine_develop_btr3.4.a: "На этом всё"
 ukraine_develop_btr3.4.b: "Перейти к лицензии"
 ukraine_develop_btr3.5.name: "Мы не смогли выполнить заказ ОАЭ на БТР-3"
 ukraine_develop_btr3.5.desc: "Какой позор!\nИз-за низкой эффективности и нехватки производственных площадок мы не смогли выполнить заказ ОАЭ на бронетранспортёры БТР-3. Мы не поставили им до сих пор ни одной машины!\nМы попробуем ещё раз пересогласовать заказ, но шансы, откровенно говоря, невелики. Если их мнение о нас ниже 50, они не согласятся возобновить контракт"
 ukraine_develop_btr3.5.a: "Пересогласуем"
 ukraine_develop_btr3.5.b: "Мы не можем продолжать"
 ukraine_develop_btr3.6.name: "Мы не смогли выполнить заказ ОАЭ на БТР-3"
 ukraine_develop_btr3.6.desc: "Какой позор!\nИз-за низкой эффективности и нехватки производственных площадок мы не смогли выполнить заказ ОАЭ на бронетранспортёры БТР-3. Мы уже поставили им 30 машин!\nМы попробуем ещё раз пересогласовать заказ, но шансы, откровенно говоря, невелики. Если их мнение о нас ниже 50, они не согласятся возобновить контракт"
 ukraine_develop_btr3.6.a: "Пересогласуем"
 ukraine_develop_btr3.6.b: "Мы не можем продолжать"
 ukraine_develop_btr3.7.name: "Мы не смогли выполнить заказ ОАЭ на БТР-3"
 ukraine_develop_btr3.7.desc: "Какой позор!\nИз-за низкой эффективности и нехватки производственных площадок мы не смогли выполнить заказ ОАЭ на бронетранспортёры БТР-3. Оставалось поставить всего 30 машин!\nМы попробуем ещё раз пересогласовать заказ, но шансы, откровенно говоря, невелики. Если их мнение о нас ниже 50, они не согласятся возобновить контракт"
 ukraine_develop_btr3.7.a: "Пересогласуем"
 ukraine_develop_btr3.7.b: "Мы не можем продолжать"
 UKR_develop_btr3_uae_tender_win_flag: "Мы §Gвыиграли§! тендер ОАЭ на 90 БТР"
 UKR_develop_btr3_uae_tender_lose_flag: "Мы §Rпроиграли§! тендер ОАЭ на 90 БТР"
 UKR_develop_btr3_uae_tender_finish_flag: "Мы §Gвыполнили§! контракт ОАЭ на 90 БТР"
 UKR_develop_btr3_uae_tender_license_flag: "Мы §Gвыполнили§! контракт ОАЭ на 90 БТР и договорились о лицензионном производстве §YБТР-3У «Гардиан»§!"
 UKR_develop_btr3_uae_tender_terminated_flag: "Контракт на поставку 90 БТР для ОАЭ §Rрасторгнут§! из-за §Yнеэффективности§! нашей оборонной промышленности. "
 UKR_develop_btr3rk: "Разработка противотанкового варианта §YБТР-3РК§!"
 UKR_develop_btr3rk_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3rk_for_tooltip\n\n\n\n\n\n\n\n\n\n§WБТР-3РК несёт тяжёлый противотанковый ракетный комплекс на базе семейства БТР-3, давая механизированным частям собственные противотанковые средства большой дальности.\nЭто не новый корпус, а уже имеющийся у нас тяжёлый ПТРК, адаптированный под БТР-3: электроника и боевая часть совпадают с тем, чем уже пользуются наши противотанковые подразделения.§!"
 UKR_develop_btr3rk_flag: "Выполнено решение §YРазработка БТР-3РК§!"
 UKR_developed_mig29mu1_flag: " Выполнено решение §YМодернизация истребителя §GМиГ-29МУ1§!§!"
 UKR_developed_mig29mu2_flag: " Выполнено решение §YДальнейшая модернизация истребителя §GМиГ-29МУ2§!§!"
