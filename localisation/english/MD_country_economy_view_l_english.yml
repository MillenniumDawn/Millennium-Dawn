 STATS_TITLE: "Statistics"

 # Stats
 GDP_TOTAL: "GDP"
 GDP_TOTAL_DESC: "Our §YGross Domestic Product§! (GDP) is the value measure of all products and services produced in the country. Millennium Dawn uses GDP adjusted with PPP (Purchasing Power Parity) as this value takes local economic conditions into account, making the country comparison more useful."
 NUM_GDP_TOTAL: "$$§Y[?ROOT.gdp_total|1]§!b"
 NUM_GDP_TOTAL_DESC: "Our §YGDP§! is currently $§Y[?ROOT.gdp_total|3]§! billion.\n\nRecent §YQuarterly GDP Growth Rate§!: [?last_quarter_gdp_growth_rate|%Y].\n\nHint: The higher your §YQuarterly GDP Growth Rate§! the more likely you are to get positive economic events."
 NUM_GDP_TOTAL_DELAYED_DESC: "Approximate Contribution of Industries by Percent:\n§PCivilian Factories§!: [?ROOT.civil_fac_percent|%]\n§OMilitary Factories§!: [?ROOT.military_factory_total_percent|%]\n§BNaval Dockyards§!: [?ROOT.naval_factory_total_percent|%]\n§COffice Parks§!: [?ROOT.office_fac_percent|%]\n§GNon-Commercialized Agriculture§!: [?ROOT.agriculture_percent|%]\n§YCommercialized Agriculture Districts§!: [?ROOT.agriculture_district_fac_percent|%]\n§YMicrochip Plants§!: [?ROOT.microchip_plant_percent|%]\n§YComposite Plants§!: [?ROOT.composite_plant_percent|%]\n§YSynthetic Refineries§!: [?ROOT.synthetic_refinery_percent|%]\n§GResource Extraction§!: [?ROOT.resources_percent|%]\n§YInfrastructure§!: [?ROOT.infrastructure_gdp_percent|%]\n§PHealthcare§!: [?ROOT.healthcare_gdp_percent|%]\n"

 GDP_PER_CAPITA: "GDP/C"
 GDP_PER_CAPITA_DESC: "This number represents our §YGDP per Capita§! or §YGDP/C§!. It represents the output of every person in the nation.\n\nRecent §YQuarterly GDP/C Growth Rate§!: [?last_quarter_gdpc_growth_rate|%Y].\n\nHint: The higher your §YQuarterly GDP/C Growth Rate§! the more likely you are to get positive economic events, and the higher §RInflation§! can potentially grow if left unchecked."
 GDP_PER_CAPITA_DELAYED_DESC: "Current impact of §YGDP per Capita§! on our nation:\nConstruction Speed: [?production_speed_buildings_factor_gdp_modifier|%+]\nMonthly Population: [?monthly_population_gdp_modifier|%+1]\nResearch Speed: [?research_speed_factor_gdp_modifier|%+]\nStability: [?stability_factor_gdp_modifier|%+]\nTotal Workforce: [?total_workforce_gdp_c_modifier_var|%+]\nFossil Powerplant Construction Speed: [?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA: "$$§Y[?ROOT.gdp_per_capita|3]§!k"
 NUM_GDP_PER_CAPITA_DESC: "Our §YGDP/C§! is currently $§Y[?ROOT.gdp_per_capita|3]§! thousand"

 PRODUCTIVITY: "Productivity"
 PRODUCTIVITY_DESC: "This number represents our nation's §YProductivity§!."
 NUM_PRODUCTIVITY_DELAYED_DESC: "§YMonthly Growth Before State Adjustments:§! [?productivity_growth_scaled|3+]\n\n§YBase Productivity Growth:§!\nLaws, National Spirit and Technologies: [?modifier@productivity_growth_modifier|3+]\n  Including Corporate Taxes: [?productivity_growth_modifier_from_corporate_tax|3+][literacy_productivity_tooltip]\n\n§YNational Growth Modifier:§!\nLaws, National Spirit and Technologies: [?modifier@country_productivity_growth_modifier|%+1]\n  Including Inflation: [?inflation_rate_prod_var|%+1]\n\nMonthly growth = base productivity growth ×0.5 × (1 + national growth modifier). The national multiplier is limited to 0–100. Each state then applies its world productivity adjustment and local growth modifier.\n\nEffect of Productivity:\n§YGDP:§! [?productivity_tax_effect_display|%+1]\n§YFactory Output:§! [?productivity_tax_effect_display|%+1]\n§YDockyard Output:§! [?productivity_tax_effect_display|%+1]\n§YConstruction Speed:§! [?productivity_tax_effect_display|%+1]\n§YCorporate Tax:§! [?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon §YCommercialized Agriculture Districts§! Construction Speed:§! [?agriculture_district_output_var|%+1]"
 NUM_PRODUCTIVITY: "§Y[?ROOT.overall_productivity|3]§!"
 NUM_PRODUCTIVITY_DESC: "§YProductivity§! measures how efficiently we turn resources into goods and services for our population, scaling GDP, Corporate Tax and Industrial Output. Higher productivity means greater efficiency, but growth slows as states become more productive relative to the world average, while less productive states catch up faster.\n\n§YWorld Average:§! [?global.average_world_productivity|3]\n§YOur Productivity:§! [?ROOT.overall_productivity|3]\n"

 INFLATION: "Inflation"
 INFLATION_DESC: "This number represents our nation's §YInflation§!"
 NUM_INFLATION: "§Y[?ROOT.inflation_rate_var|%]§!"
 NUM_INFLATION_DESC: "§YInflation§! is how fast prices are rising. High inflation raises government costs and lowers factory output. The §YInflation Impact on Economy§! national spirit shows all of its effects, including §YDeflation§! when the rate is negative.\n\nIt updates every quarter. The rate shown is the average of the last 4 quarters and moves at most 10% per quarter. Easier difficulty settings slow its rise.\n\n§YWhat moves it:§!\n- §YGDP/C§! growth: fast growth raises it, a shrinking economy lowers it\n- §YTax Rate§!: a higher rate lowers it\n- §YPolicy Rate§!: a higher rate lowers it, but raises §RInterest on Debt§!\n- §YEconomic Cycle§!: above §YStable Growth§! raises it, below lowers it\n- §YBudget§!: large deficits raise it, more so with high debt. A surplus lowers it.\n- §YPrint Money§! raises it\n- A weakening currency raises it, more so if we import resources\n- High inflation partly carries into the next quarter\n\n§YCurrency Strength:§! [currency_strength_display]\n§Y1.00§! is normal. It updates monthly and stays between §Y0.15§! and §Y2.00§!. Easier difficulty settings raise the minimum. A weak currency raises government costs and boosts resource export earnings. If our §YReserve Currency Policy§! uses a foreign currency, it also makes our debt more expensive. A strong currency does the reverse.\n\n§YWhat moves it:§!\n- §YPolicy Rate§!: above inflation strengthens it, below weakens it\n- §YStability§!: above 50% strengthens it, below weakens it\n- §YEconomic Cycle§!: above §YStable Growth§! strengthens it, below weakens it\n- An §YInterest Rate§! above 5% from debt or §YWorld Tension§! weakens it\n- Losing a war (over 10% surrender progress), civil war, §YInternational Sanctions§!, or a financial collapse in the last 3 years weakens it\n- If we issue a reserve currency, each country using it strengthens it\n- §YWorld Tension§! above 50% strengthens the Dollar, Yen, and Swiss Franc\n\nOver time it drifts back toward its long-run level. Gold, Silver, and Bimetallic §YCurrency Backing§! pull a weak currency back up toward §Y1.00§!, and Gold also pulls one above §Y1.05§! back down."
 NUM_INFLATION_DELAYED_DESC: "§YLast 4 Quarters:§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\nThe rate shown is the average of these four quarters, and it drives every inflation effect."


 total_civilian_factories_amount_tt: "This value represents the total number of §YCivilian Industries§! in our nation."
 total_civilian_factories_amount_tt_delayed: "This building provides the state with industry for the production of civilian goods or construction of new buildings. Can be converted to military industry if needed.\n\nProvides the state with:\nBase Number of Required Workers: §Y206K§!\nBase GDP Output per §YCivilian Industry§!: $§Y17.5 Billion§!\nBase Energy Consumption: §R-0.5§! GW\n\nGDP per Capita impact on §YWorkforce§!: [?worker_requirement_gdp_multiplier_display|-%1]\nLaw, National Spirits and Tech impact on §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, National Spirits and Tech impact on §YCivilian Industries Workforce§!: [?modifier@civ_facs_worker_requirement_modifier|-%0]\nCombined reductions are capped at §Y90%§!.\n\nWorkers Required per §YCivilian Industries§!: [?workers_per_civ_fac_display|2]K\n"
 total_military_factories_amount_tt: "This value represents the total number of §YMilitary Industries§! in our nation."
 total_military_factories_amount_tt_delayed: "This building provides the state with industry for the production of new military equipment. Can be converted to civilian industry if needed.\n\nProvides the state with:\nBase Number of Required Workers: §Y18.8K§!\nBase GDP Output per §YMilitary Industry§!: $§Y1.5 Billion§!\nBase Energy Consumption: §R-0.5§! GW\n\nLaw, National Spirits and Tech impact on §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, National Spirits and Tech impact on §YMilitary Factories & Dockyard Workforce§!: [?modifier@mil_facs_worker_requirement_modifier|-%0]\nCombined reductions are capped at §Y90%§!.\n\nWorkers Required per §YMilitary Industry§!: [?workers_per_mil_fac_display|2]K\n"
 total_naval_yard_amount_tt: "This value represents the total number of §YNaval Yards§! in our nation."
 total_naval_yard_amount_tt_delayed: "§YNaval Yards§! are representative of a state's ability to produce military vessels of all sorts ranging from §YPatrol Boats§!, §YConvoys§!, §YDestroyers§!, §YCarriers§! and more.\n\nProvides the state with:\nBase Number of Required Workers: §Y18.8K§!\nBase GDP Output per §YNaval Yard§!: $§Y1.5 Billion§!\nBase Energy Consumption: §R-0.5§! GW\n\nLaw, National Spirits and Tech impact on §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, National Spirits and Tech impact on §YMilitary Factories & Dockyard Workforce§!: [?modifier@mil_facs_worker_requirement_modifier|-%0]\nCombined reductions are capped at §Y90%§!.\n\nWorkers Required per §YNaval Yard§!: [?workers_per_dockyard_display|2]K\n"
 total_offices_amount_tt: "This value represents the total number of §YOffice Sectors§! in our nation."
 total_offices_amount_tt_delayed: "The §YOffice Sectors§! represents all the other industries of the economy beyond the extraction and heavy industries. These include financial, customer, information technology, retail services and so much more.\n\nProvides the state with:\nBase Number of Required Workers: §Y473K§!\nBase GDP Output per §YOffice Sector§!: $§Y50 Billion§!\nBase Energy Consumption: §R-0.25§! GW\n\nGDP per Capita impact on §YWorkforce§!: [?worker_requirement_gdp_multiplier_display|-%1]\nLaw, National Spirits and Tech impact on §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, National Spirits and Tech impact on §YOffice Sector Workforce§!: [?modifier@offices_worker_requirement_modifier|-%0]\nCombined reductions are capped at §Y90%§!.\n\nWorkers Required per §YOffice Sector§!: [?workers_per_office_display|2]K\n"
 total_agriculture_district_amount_tt: "This value represents the total number of §YCommercialized Agriculture Districts§! in our nation."
 total_agriculture_district_amount_tt_delayed: "§YCommercialized Agriculture Districts§! represents a catch-all for all non-subsistence Agriculture within our nation. It includes Agro-Industry, arable land, grain silos, butcherhouses and more.\n\nProvides the state with:\nBase Number of Required Workers: §Y188K§!\nBase GDP Output per §YCommercialized Agriculture District§!: $§Y25 Billion§!\nBase Energy Consumption: §R-0.10§! GW\n§YFuel Gain§! from States: 8\n§YLocal Supplies§!: 1.5%\n\nGDP per Capita impact on §YWorkforce§!: [?worker_requirement_gdp_multiplier_display|-%1]\nLaw, National Spirits and Tech impact on §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, National Spirits and Tech impact on §YCommercialized Agriculture Districts Workforce§!: [?modifier@agriculture_district_worker_requirement_modifier|-%0]\nCombined reductions are capped at §Y90%§!.\n\nWorkers Required per §YCommercialized Agriculture District§!: [?workers_per_agriculture_district_display|2]K\n"
 total_microchips_factories_amount_tt: "This value represents the total number of §YMicrochip Plants§! in our nation."
 total_microchips_factories_amount_tt_delayed: "§YMicrochip Plants§! represent the semiconductor and small electronics production of our nation.\n\nProvides the state with:\nBase Number of Required Workers: §Y37.5K§!\nBase GDP Output per §YMicrochip Plant§!: $§Y32 Billion§!\nBase Energy Consumption: §R-0.75§! GW\n\nGDP per Capita impact on §YWorkforce§!: [?worker_requirement_gdp_multiplier_display|-%1]\nLaw, National Spirits and Tech impact on §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, National Spirits and Tech impact on §YMicrochip Plants Workforce§!: [?modifier@microchip_plant_worker_requirement_modifier|-%0]\nCombined reductions are capped at §Y90%§!.\n\nWorkers Required per §YMicrochip Plant§!: [?workers_per_microchip_plant_display|2]K\n"
 total_composites_factories_amount_tt: "This value represents the total number of §YComposite Plants§! in our nation."
 total_composites_factories_amount_tt_delayed: "§YComposite Plants§! represent advanced materials production facilities, including ceramic armors, reinforced polymers and high-performance structural materials.\n\nProvides the state with:\nBase Number of Required Workers: §Y37.5K§!\nBase GDP Output per §YComposite Plant§!: $§Y28 Billion§!\nBase Energy Consumption: §R-0.8§! GW\n\nGDP per Capita impact on §YWorkforce§!: [?worker_requirement_gdp_multiplier_display|-%1]\nLaw, National Spirits and Tech impact on §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, National Spirits and Tech impact on §YComposite Plants Workforce§!: [?modifier@composite_plant_worker_requirement_modifier|-%0]\nCombined reductions are capped at §Y90%§!.\n\nWorkers Required per §YComposite Plant§!: [?workers_per_composite_plant_display|2]K\n"
 total_refineries_amount_tt: "This value represents the total number of §YSynthetic Refineries§! in our nation."
 total_refineries_amount_tt_delayed: "§YSynthetic Refineries§! represent industrial facilities responsible for producing synthetic rubber and related chemical materials critical for industry and logistics.\n\nProvides the state with:\nBase Number of Required Workers: §Y184K§!\nBase GDP Output per §YSynthetic Refinery§!: $§Y10 Billion§!\nBase Energy Consumption: §R-0.2§! GW\n\nGDP per Capita impact on §YWorkforce§!: [?worker_requirement_gdp_multiplier_display|-%1]\nLaw, National Spirits and Tech impact on §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, National Spirits and Tech impact on §YSynthetic Refineries Workforce§!: [?modifier@synthetic_refinery_worker_requirement_modifier|-%0]\nCombined reductions are capped at §Y90%§!.\n\nWorkers Required per §YSynthetic Refinery§!: [?workers_per_synthetic_refinery_display|2]K\n"

 # Taxes
 POPULATION_TAX_RATE: "Population Tax"
 POPULATION_TAX_RATE_TT: "§YExpected rate: [?expected_population_tax_rate|0]%§!\nThe rate the public accepts without pushback. It rises as our GDP per capita grows.\n• Raising the rate past both this and any higher rate we recently cut from costs §R2%§! £stability_texticon §YStability§! per point for a while.\n• Lowering it below both this and any lower rate we recently raised from gives §G0.5%§! £stability_texticon §YStability§! per point for a while.\n• Moving toward it adds no transition penalty, but a raise first takes back any recent cut bonus.\nSee §YPolicy Transition Costs§! in our national spirits.\n\nPopulation Tax Rate includes all of the taxes imposed on the public. This can include but is not limited to income tax, VAT taxes, sales tax, and property taxes.\n\n§YModifiers from Population Taxes:§!\n£stability_texticon  Stability: [?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE: "Corporate Tax"
 CORPORATE_TAX_RATE_TT: "§YExpected rate: [?expected_corporate_tax_rate|0]%§!\nThe rate business accepts without pushback. It rises as our GDP per capita grows and follows the economic cycle: lower in §YStagnation§!, §YRecession§! or §YDepression§!, higher in §YFast Growth§! or an §YEconomic Boom§!.\n• Raising the rate past both this and any higher rate we recently cut from costs §R1.2%§! £stability_texticon §YStability§! per point for a while.\n• Lowering it below both this and any lower rate we recently raised from gives §G0.01§! §YMonthly Productivity Growth§! and makes §YForeign Investment§! in our country §G2%§! cheaper per point for a while.\n• Moving toward it adds no transition penalty, but a raise first takes back any recent cut bonus.\nSee §YPolicy Transition Costs§! in our national spirits.\n\nCorporate Tax Rate includes all of the taxes imposed on corporations. The value consists of corporate income taxes, employer taxes, and more.\n\n§YModifiers from Corporate Taxes:§!\n£consumer_goods_texticon  Tax Cost: [?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon §YReceiving Foreign Investment§! Cost Modifier: [?receiving_investment_cost_form_corporate_tax|%-]\nMonthly Productivity Growth: [?productivity_growth_modifier_from_corporate_tax|+3]\n"
 POPULATION_TAX_EXPECTED: "§gexp. [?expected_population_tax_rate|0]%§!"
 CORPORATE_TAX_EXPECTED: "§gexp. [?expected_corporate_tax_rate|0]%§!"
