 USA_treason_event.8.t: "République Réformée Droite \\"2004\\""
 USA_treason_event.8.d: "Congrats you've beaten the system, but now who do you choose? We have the no government Libertarians, the level headed Reform Partiers and finally we have the Constitutionalist paper lovers."
 USA_treason_event.8.o1: "Peu de pouvoir, peu d'État !"
 USA_treason_event.8.o2: "Une république réformée, et pour cause"
 USA_treason_event.8.o3: "Le papier, c'est la loi !"
 USA_treason_event.8.o4: "Let's Look Left Why Don't We"
 USA_treason_event.9.t: "République Réformée Gauche « 2004 »"
 USA_treason_event.9.d: "Congrats you've beaten the system, but now who do you choose? We have the tree hugging Greens, the pink ribboned Progressives and finally we have the let's bring European politics to America, Democratic Socialists."
 USA_treason_event.9.o1: "J'aime la nature"
 USA_treason_event.9.o2: "J'aime le progrès social"
 USA_treason_event.9.o3: "J'aime les idées européennes"
 USA_treason_event.9.o4: "J'adore les épices, quels sont ces arômes"
 USA_treason_event.10.t: "Coalitions de la République réformée \\"2004\\""
 USA_treason_event.10.d: "Looks like you beat the system so bad it's kinda broken. Care to break it some more? You have the National Front Party and the Shepard's Party. Which coalition will you break the window with."
 USA_treason_event.10.o1: "J'adore le red velvet"
 USA_treason_event.10.o2: "J'adore le chocolat au lait"
 USA_treason_event.10.o3: "Attendez, je crois que je me suis perdu, où est l'entrée ?"
 USA_treason_event.11.t: "République Réformée Droite \\"2008\\""
 USA_treason_event.11.d: "Bravo, vous avez battu le système — mais pour qui opter maintenant ? Les libertariens sans État, les réformistes raisonnables, et enfin les constitutionnalistes amoureux du papier."
 USA_treason_event.11.o1: "Peu de pouvoir, peu d'État !"
 USA_treason_event.11.o2: "Une république réformée, et pour cause"
