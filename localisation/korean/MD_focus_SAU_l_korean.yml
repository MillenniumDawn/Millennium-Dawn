 SAU_transitional_council_desc: "군주제 붕괴 이후 권력을 맡은 장교, 법률가, 명사로 이루어진 과도 기구입니다. 아라비아 공화국이 스스로의 길을 선택할 수 있을 때까지만 통치합니다."
 SAU_tt_extend_turkey: "[TUR.GetFlag]§H튀르키예에 송유관을 유럽으로 연장해 달라고 요청하게 됩니다. 튀르키예가 수락해야 합니다.§!"
