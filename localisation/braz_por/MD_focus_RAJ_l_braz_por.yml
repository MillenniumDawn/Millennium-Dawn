 RAJ_PAK_border_conflict_category:0 "Conflito de Fronteira Indo-Paquistanês"
 RAJ_PAK_border_conflict_category_desc:0 "[RAJ.GetNameDefCap] e [PAK.GetNameDefCap] continuam divididos por Jammu e Caxemira e por uma fronteira fortemente militarizada. Exercícios, incursões e trocas de artilharia podem evoluir para confrontos limitados ou uma crise diplomática. O progresso é acompanhado separadamente para cada estado disputado.\n\n$border_readiness_RAJ$: [?RAJ.pak_raj_border_readiness|Y0]\n$border_readiness_PAK$: [?PAK.pak_raj_border_readiness|Y0]\n$pak_raj_border_tension$: [?global.pak_raj_border_tension|Y0]\n\n§YEstados de Fronteira§! (80 de progresso da reivindicação necessários para fazê-la valer):\n[420.Owner.GetFlag] [420.GetName]: [?THIS.pak_raj_border_progress_420|Y0]\n[427.Owner.GetFlag] [427.GetName]: [?THIS.pak_raj_border_progress_427|Y0]\n[429.Owner.GetFlag] [429.GetName]: [?THIS.pak_raj_border_progress_429|Y0]\n[563.Owner.GetFlag] [563.GetName]: [?THIS.pak_raj_border_progress_563|Y0]\n[573.Owner.GetFlag] [573.GetName]: [?THIS.pak_raj_border_progress_573|Y0]\n[426.Owner.GetFlag] [426.GetName]: [?THIS.pak_raj_border_progress_426|Y0]\n[987.Owner.GetFlag] [987.GetName]: [?THIS.pak_raj_border_progress_987|Y0]\n[984.Owner.GetFlag] [984.GetName]: [?THIS.pak_raj_border_progress_984|Y0]\n\nO exército designa um estado de fronteira como nosso setor ativo por vez, e toda preparação parte dele. Um novo setor é sorteado entre os estados de fronteira que controlamos quando a preparação atual termina."
 RAJ_CHI_border_conflict_category:0 "Conflito de Fronteira Sino-Indiano"
 RAJ_CHI_border_conflict_category_desc:0 "[RAJ.GetNameDefCap] e [CHI.GetNameDefCap] disputam várias seções da Linha de Controle Real, de Aksai Chin e Ladakh a Sikkim e Arunachal Pradesh. As operações exigem forças locais e só ganham impulso rumo ao estado onde houve combate.\n\n$border_readiness_RAJ$: [?RAJ.raj_chi_border_readiness|Y0]\n$border_readiness_CHI$: [?CHI.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$: [?global.raj_chi_border_tension|Y0]\n\n§YEstados de Fronteira§! (80 de progresso da reivindicação necessários para fazê-la valer):\n[475.Owner.GetFlag] [475.GetName]: [?THIS.raj_chi_border_progress_475|Y0]\n[982.Owner.GetFlag] [982.GetName]: [?THIS.raj_chi_border_progress_982|Y0]\n[591.Owner.GetFlag] [591.GetName]: [?THIS.raj_chi_border_progress_591|Y0]\n[993.Owner.GetFlag] [993.GetName]: [?THIS.raj_chi_border_progress_993|Y0]\n\nO exército designa um estado de fronteira como nosso setor ativo por vez, e toda preparação parte dele. Um novo setor é sorteado entre os estados de fronteira que controlamos quando a preparação atual termina."
 border_war_axis_requirements_tt:0 "Devemos possuir e controlar o estado de origem, estacionar ao menos uma divisão ali e enfrentar o rival no estado-alvo. Essas condições são verificadas novamente quando as preparações terminam."
 border_war_capture_requirements_tt:0 "Devemos manter um estado de origem adjacente com ao menos uma divisão enquanto o rival possui e controla o alvo. Essas condições são verificadas novamente quando a operação termina."
 border_war_negotiate_opinion_tt:0 "Ambos os países devem ter ao menos §Y25 de Opinião§! um do outro"
