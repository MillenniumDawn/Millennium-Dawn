 axis_of_resistance_events.1: "[FROM.GetName] Wants Us To Join Axis Of Resistance"
 axis_of_resistance_events.1.t: "[FROM.GetName] Wants Us To Join Axis Of Resistance"
 axis_of_resistance_events.1.d: "저항의 축은 이스라엘과 서방에 맞선 군사, 정보, 정치 동맹입니다. [FROM.GetName]은(는) 우리가 가입하여 적에 맞서 서로 협력하기를 원합니다. 이 요청을 수락하고 그들의 동맹에 가입해야 합니까?"
 axis_of_resistance_events.1.o1: "함께 우리는 더 강해진다!"
 axis_of_resistance_events.1.o2: "안된다"
 PER_syria_invited_localisation: "시리아"
 PER_iraq_invited_localisation: "이라크"
 PER_houthis_invited_localisation: "후티 예멘"
 PER_hezbollah_invited_localisation: "헤즈볼라"
 PER_azerbaijan_invited_localisation: "아제르바이잔"
 PER_turkey_invited_localisation: "터키"
 axis_of_resistance_events.2: "[aor_invited_country] Refused To Join Axis Of Resistance"
 axis_of_resistance_events.2.t: "우리의 저항 추축국 가입을 원하는 이란"
 axis_of_resistance_events.2.d: "[aor_invited_country](이)가 저항 축 세력에 가입하라는 우리의 제안을 거절했습니다. 아직 준비가 되지 않은 모양입니다."
 axis_of_resistance_events.2.o1: "알겠다"
 axis_of_resistance_events.3: "저항 추축국에 가입한 [aor_invited_country]"
 axis_of_resistance_events.3.t: "저항 추축국에 가입한 [aor_invited_country]"
 axis_of_resistance_events.3.d: "[aor_invited_country](이)가 이스라엘과 서방에 맞서 싸우기 위해 다른 동맹국들과 협력하고자 저항 축에 가입하기로 결정했습니다."
 axis_of_resistance_events.3.o1: "알겠다"
 axis_of_resistance_events.4: "이스라엘에 대한 공격을 우리가 개시하기를 원하는 이란"
 axis_of_resistance_events.4.t: "이스라엘에 대한 공격을 우리가 개시하기를 원하는 이란"
 axis_of_resistance_events.4.d: "기밀 서한을 통해 이란 정부가 우리에게 팔레스타인 내 시온주의 정권의 진지를 공격해 달라고 요청했습니다. 이제 국경 전쟁을 치를 준비가 되었습니까?"
 axis_of_resistance_events.4.o1: "시작하지!"
 axis_of_resistance_events.4.o2: "준비가 필요하다."
 axis_of_resistance_events.6: "공격하지 않은 헤즈볼라"
 axis_of_resistance_events.6.t: "공격하지 않은 헤즈볼라"
 axis_of_resistance_events.6.d: "헤즈볼라 관계자들은 아직 국경 전쟁을 치를 준비가 되지 않았다고 우리 서한에 회신했습니다. 나중에 다시 요청할 수 있습니다."
 axis_of_resistance_events.6.o1: "이해한다."
 axis_of_resistance_events.5: "이스라엘을 공격한 헤즈볼라"
 axis_of_resistance_events.5.t: "이스라엘을 공격한 헤즈볼라"
 axis_of_resistance_events.5.d: "[HEZ.GetName]이(가) 국경에서 [ISR.GetName]에 대한 공격을 개시했습니다. 이란 또한 자금, 무기, 전략적 조언을 제공하며 이들을 지원하고 있습니다."
 axis_of_resistance_events.5.o1: "흥미롭군"
 axis_of_resistance_events.7: "국경 분쟁의 종결"
 axis_of_resistance_events.7.t: "국경 분쟁의 종결"
 axis_of_resistance_events.7.d: "이스라엘과 헤즈볼라 사이의 국경 전쟁이 오늘 종결되었습니다. 양측 모두 이번 전쟁에서 사상자가 발생했으며, 일단 휴전하기로 합의했습니다."
 axis_of_resistance_events.7.o1: "알겠다"
 iranian_events.1.t: "Bam Earthquake"
 iranian_events.1.d: "밤 지진이 케르만주를 강타했습니다. 지진의 모멘트 규모는 6.6이었습니다. 지진은 특히 밤에서 파괴적이었으며, 지금까지 사망자가 최소 34,000명에 달합니다! 여진 가능성에 대비해야 합니다."
 iranian_events.1.o1: "군 인력을 보내어 상황을 해결하자."
 iranian_events.1.o2: "상황이 진정될 때까지 계엄령을 선포하자."
 iranian_events.2.t: "Aramco Under Fire"
 iranian_events.2.d: "Today, Saudi Arabia's national oil company, Aramco, was set on fire in an attack, causing huge damage to Saudi Arabia's economy and resources. Some media say that these attacks were probably carried out with the support of Iran, but there is no evidence for that."
 iranian_events.2.o1: "Worrying"
 iranian_events.3.t: "Sabotage In Aramco"
 iranian_events.3.d: "Our oil facilities in Aramco were attacked and set on fire, it seems that Iran did this with its spies and infiltrators. The fire brigade was sent to the place and they are trying to control the fire, but a lot of damage has been done to our economy."
 iranian_events.3.o1: "Curse them!!"
 iranian_events.4.t: "Israeli Weapon Storage Blown"
 iranian_events.4.d: "A sabotage has occurred in the storage of Israeli weapons in the north of it in the city of Nahariya. Immediately after that, Iran took responsibility for the attack and threatened the Zionist regime."
 iranian_events.4.o1: "Okay"
 iranian_events.5.t: "Sabotage In Nahariya Weapon Storage"
 iranian_events.5.d: "A sabotage has occurred in the storage of Israeli weapons in the north of it in the city of Nahariya. Immediately after that, Iran took responsibility for the attack and threatened the Zionist regime."
 iranian_events.5.o1: "Damn those Iranians!\n(Pressure Eaten)"
 iranian_events.7: "쿼드는 우리 것이다!"
 iranian_events.7.t: "쿼드는 우리 것이다!"
 iranian_events.7.d: "\\"그들에 맞서 너희가 할 수 있는 한 군사력과 군마를 준비하여 알라의 적과 너희의 적, 그리고 그들 외에 너희가 모르나 알라께서 아시는 다른 이들을 두렵게 하라. 너희가 알라의 길에서 쓰는 것은 무엇이든 충분히 갚아질 것이며 너희는 부당한 대우를 받지 않으리라. 그들이 평화로 기울거든 너희도 그리로 기울고 알라를 의지하라. 실로 그분은 모든 것을 들으시고 모든 것을 아시는 분이시다. 그러나 그들이 너희를 속이려 한다면 알라께서 너희에게 충분하시리라. 그분께서 자신의 도움과 믿는 자들로 너희를 강하게 하시고 그들의 마음을 하나로 묶으신 분이시다. 네가 땅 위의 모든 것을 쓸지라도 그들의 마음을 하나로 묶을 수 없었으나, 알라께서 그들을 하나로 묶으셨느니라. 실로 그분은 전능하시고 지혜로우신 분이시다.\\""
 iranian_events.7.o1: "이슬람과 팔레스타인을 위해!"
 iranian_events.7.o2: "지금은 예루살렘을 지킬 것이다."
 PER_election_events.2: "8th Presidential Election"
 PER_election_events.2.t: "8th Presidential Election"
 PER_election_events.2.d: "정당들과 정부 내 영향력 있는 인사들 사이의 조율이 끝나, 후보자를 정하고 헌법수호위원회가 그 자격을 확인하는 데 필요한 조율이 완료되어 시행되었습니다. 사회 분위기 또한 선거에 대한 기대로 들떠 있는 듯합니다.\n또한 이전 선거와 비교하여 원칙주의 정당과 개혁주의 정당 사이의 차이가 줄어들었으며, 선거가 평화롭게 치러질 수 있을 정도입니다.\n\n척도는 국민의 표입니다."
 PER_election_events.2.a: "어떻게 될지 지켜보자."
 PER_election_events.3: "9th Presidential Election"
 PER_election_events.3.t: "9th Presidential Election"
 PER_election_events.3.d: "정당들과 정부 내 영향력 있는 인사들 사이의 조율이 끝나, 후보자를 정하고 헌법수호위원회가 그 자격을 확인하는 데 필요한 조율이 완료되어 시행되었습니다. 사회 분위기 또한 선거에 대한 기대로 들떠 있는 듯합니다.\n또한 이전 선거와 비교하여 원칙주의 정당과 개혁주의 정당 사이의 차이가 줄어들었으며, 선거가 평화롭게 치러질 수 있을 정도입니다.\n\n척도는 국민의 표입니다."
 PER_election_events.3.a: "이번에는 또 어떻게 될지 한번 보자."
 PER_election_events.4: "10th Presidential Election"
 PER_election_events.4.t: "10th Presidential Election"
 PER_election_events.4.d: "Just like the previous years, coordination between parties and influencing people in the government has been done. With the acceptance of Mahmud Ahmadinejad and his rival candidate from the Guardian Council, this election period will be different. There seem to be some conflicts between two reformist and principalist coalitions and especially from Akbar Hashemi Rafsanjani. On the other hand, street violence and sedition led by reformists are expected because of verbal conflicts between these two parties if reformists lose in this period.\nThe security agencies of the government should be vigilant during this period and suppress possible riots in time. There is a possibility of any kind of riot from Akbar Hashemi Rafsanjani, who is the leader of the reform coalition, and his chosen candidate."
 PER_election_events.4.a: "국가 총 선거로 진행될 것이다."
 PER_election_events.5: "11th Presidential Election"
 PER_election_events.5.t: "11th Presidential Election"
 PER_election_events.5.d: "정당들과 정부 내 영향력 있는 인사들 사이의 조율이 끝나, 후보자를 정하고 헌법수호위원회가 그 자격을 확인하는 데 필요한 조율이 완료되어 시행되었습니다. 사회 분위기 또한 선거에 대한 기대로 들떠 있는 듯합니다.\n또한 이전 선거와 비교하여 원칙주의 정당과 개혁주의 정당 사이의 차이가 줄어들었으며, 선거가 평화롭게 치러질 수 있을 정도입니다.\n\n척도는 국민의 표입니다."
 PER_election_events.5.a: "이번에는 또 어떻게 될지 한번 보자."
 PER_election_events.6: "12th Presidential Election"
 PER_election_events.6.t: "12th Presidential Election"
 PER_election_events.6.d: "정당들과 정부 내 영향력 있는 인사들 사이의 조율이 끝나, 후보자를 정하고 헌법수호위원회가 그 자격을 확인하는 데 필요한 조율이 완료되어 시행되었습니다. 사회 분위기 또한 선거에 대한 기대로 들떠 있는 듯합니다.\n또한 이전 선거와 비교하여 원칙주의 정당과 개혁주의 정당 사이의 차이가 줄어들었으며, 선거가 평화롭게 치러질 수 있을 정도입니다.\n\n척도는 국민의 표입니다."
 PER_election_events.6.a: "이번에는 또 어떻게 될지 한번 보자."
 PER_election_events.7: "13th Presidential Election"
 PER_election_events.7.t: "13th Presidential Election"
 PER_election_events.7.d: "정당들과 정부 내 영향력 있는 인사들 사이의 조율이 끝나, 후보자를 정하고 헌법수호위원회가 그 자격을 확인하는 데 필요한 조율이 완료되어 시행되었습니다. 사회 분위기 또한 선거에 대한 기대로 들떠 있는 듯합니다.\n또한 이전 선거와 비교하여 원칙주의 정당과 개혁주의 정당 사이의 차이가 줄어들었으며, 선거가 평화롭게 치러질 수 있을 정도입니다.\n\n척도는 국민의 표입니다."
 PER_election_events.7.a: "이번에는 또 어떻게 될지 한번 보자."
 PER_election_events.8: "카타미의 승리!"
 PER_election_events.8.t: "카타미의 승리!"
 PER_election_events.8.d: "오늘은 선거일이며, 후보 하타미와 타바콜리 사이의 치열한 접전 끝에 하타미가 승리를 거두어 새로 선출된 이란 대통령으로서 이란을 이끌게 된 것으로 보입니다.\n개혁주의자들이 승리했다는 분명한 신호입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.8.a: "알겠다"
 PER_election_events.9: "타바콜리의 승리!"
 PER_election_events.9.t: "타바콜리의 승리!"
 PER_election_events.9.d: "오늘은 선거일이며, 발표된 두 대통령 후보 사이의 치열한 접전 끝에 타바콜리가 상대를 꺾었습니다. 원칙주의자들의 위대한 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.9.a: "알겠다"
 PER_election_events.10: "라프산자니의 승리!"
 PER_election_events.10.t: "라프산자니의 승리!"
 PER_election_events.10.d: "오늘은 선거일로, 승자가 발표되는 날입니다.\n이란 선거의 승자는 라프산자니입니다!\n패자는 아마디네자드입니다! 개혁주의자들의 분명한 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.10.a: "알겠다"
 PER_election_events.11: "아마디네자드 승리!"
 PER_election_events.11.t: "아마디네자드 승리!"
 PER_election_events.11.d: "오늘은 선거일로, 승자가 발표되는 날입니다.\n이란 선거의 승자는 아마디네자드입니다!\n원칙주의자들의 분명한 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.11.a: "알겠다"
 PER_election_events.12.t: "무사비의 승리!"
 PER_election_events.12.d: "오늘은 선거일이며, 당선된 후보는 다름 아닌 무사비입니다!\n상대인 아마디네자드를 꺾은 그에게 축하를 보냅니다.\n개혁주의자들이 명백한 승자가 된 중대한 순간입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.12.a: "Okay"
 PER_election_events.13: "아마디네자드 승리!"
 PER_election_events.13.t: "아마디네자드 승리!"
 PER_election_events.13.d: "오늘은 선거일이며, 당선된 후보는 다름 아닌 아마디네자드입니다!\n상대를 꺾은 그에게 축하를 보냅니다.\n원칙주의자들의 개선 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.13.a: "알겠다"
 PER_election_events.14: "로하니의 승리!"
 PER_election_events.14.t: "로하니의 승리!"
 PER_election_events.14.d: "선거일이 왔고, 그 싸움의 승자가 모습을 드러냈습니다. 바로 로하니입니다!\n그는 이번 패배에 똑같이 실망한 갈리바프와 레자이를 꺾었습니다.\n개혁주의자들의 빛나는 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.14.a: "알겠다"
 PER_election_events.15: "갈리바프의 승리!"
 PER_election_events.15.t: "갈리바프의 승리!"
 PER_election_events.15.d: "선거일이 왔고, 시련의 승자가 모습을 드러냈습니다. 바로 갈리바프입니다!\n패배의 고통을 겪어야 했던 로하니와 레자이에게 위로를 보냅니다.\n원칙주의자들의 큰 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.15.a: "알겠다"
 PER_election_events.16: "레자이의 승리!"
 PER_election_events.16.t: "레자이의 승리!"
 PER_election_events.16.d: "선거일이 다가왔습니다. 승자인 레자이에게는 결정적인 순간입니다!\n이번 패배를 견뎌야 하는 로하니와 갈리바프에게는 슬픈 순간입니다.\n원칙주의자들의 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.16.a: "알겠다"
 PER_election_events.17: "로하니의 승리!"
 PER_election_events.17.t: "로하니의 승리!"
 PER_election_events.17.d: "오늘은 선거일이며, 대통령 후보들이 재임을 이어 가거나 영원히 교체될 운명이 정해지는 날입니다. 오늘의 선거 승자는 로하니입니다!\n라이시가 패배를 받아들이고 다음 선거를 준비하며 재평가해야 하는 날입니다.\n개혁주의자들의 큰 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.17.a: "알겠다"
 PER_election_events.18: "라이시의 승리!"
 PER_election_events.18.t: "라이시의 승리!"
 PER_election_events.18.d: "오늘은 선거일이며, 국민이 자신들의 국가를 이끌고 대표할 사람을 선택해야 하는 날로, 국민의 마음을 얻은 사람은 라이시입니다!\n로하니에게는 매우 예상치 못한 슬픈 패배이며, 그에게 다시는 기회가 없을 것입니다.\n원칙주의자들의 놀라운 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.18.a: "알겠다"
 PER_election_events.19: "헤마티의 승리!"
 PER_election_events.19.t: "헤마티의 승리!"
 PER_election_events.19.d: "오늘은 선거일이며, 야심 찬 정치인들이 국가를 이끄는 책임을 맡도록 선택되는 날입니다. 오늘의 승자는 헴마티입니다!\n놀라면서도 당연히 분노한 라이시가 의회에서 박차고 나갑니다.\n개혁주의자들의 결정적인 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.19.a: "알겠다"
 PER_election_events.20: "라이시의 승리!"
 PER_election_events.20.t: "라이시의 승리!"
 PER_election_events.20.d: "오늘은 선거일이며, 국민이 자신들을 대표하고 이끌 사람에게 투표하는 날입니다. 운명의 승자는 라이시입니다!\n헴마티는 놀라지 않은 모습으로 승자를 축하합니다.\n원칙주의자들의 대단한 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.20.a: "알겠다"
 PER_election_events.21: "대선에서 사퇴한 칼리바프"
 PER_election_events.21.t: "대선에서 사퇴한 칼리바프"
 PER_election_events.21.d: "오늘은 선거일이며, 국민이 자신들을 대표하고 이끌 사람에게 투표하는 날입니다. 운명의 승자는 라이시입니다!\n헴마티는 놀라지 않은 모습으로 승자를 축하합니다.\n원칙주의자들의 대단한 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.21.a: "걸렸구만."
 PER_election_events.22: "원칙주의자들을 위한 TV 광고 방송"
 PER_election_events.22.t: "원칙주의자들을 위한 TV 광고 방송"
 PER_election_events.22.d: "원칙주의 정당들이 국영 TV에서 자신들의 정치 광고를 방송해 달라고 요구했습니다. 이를 수락하고 해당 프로그램을 방송해야 합니까?"
 PER_election_events.22.a: "시작하지!"
 PER_election_events.22.b: "신경쓰지 마라"
 PER_election_events.23: "개혁주의자들을 위한 TV 광고 방송"
