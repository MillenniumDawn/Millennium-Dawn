 GGZ_mutlu_erim: "무틀루 에림!"
 GGZ_mutlu_erim_desc: "마침내 우리는 독립했습니다! 이제 이 독립을 지켜내는 것이 우리의 몫입니다."
 GGZ_modernizing_agriculture: "농업 현대화"
 GGZ_modernizing_agriculture_desc: "안타깝게도 가가우지아에는 주요 산업이 없고 이를 확장할 경제적 수단도 부족합니다. 따라서 우리는 농업 수단의 현대화에 투자할 것입니다."
 GGZ_expand_agriculture: "농업 확장"
 GGZ_expand_agriculture_desc: "현대화만으로는 충분하지 않으며, 농업을 확장해야 합니다."
 GGZ_invest_in_textiles: "섬유 산업 투자"
 GGZ_invest_in_textiles_desc: "우리가 가진 유일한 산업은 섬유이며, 우리는 이 분야에 매우 능숙합니다. 더 많은 일자리를 창출하고 지역의 주요 생산자가 되기를 바라며 이 산업에 투자할 것입니다."
 GGZ_our_constitution: "우리의 헌법"
 GGZ_our_constitution_desc: "모든 진정한 국가에는 헌법이 필요하며, 우리도 예외가 아닙니다!"
 GGZ_strengthen_baskan: "바슈칸 강화"
 GGZ_strengthen_baskan_desc: "바슈칸은 가가우지아에서 가장 높고 중요한 직위입니다. 이 직위가 가진 권한을 강화하면 의원내각제 민주주의에서 대통령제 민주주의로 서서히 이행할 수 있으며, PCRM이 장악한 의회의 압력으로 사임을 강요당한 전 바슈칸 크로이토르의 사례와 같은 남용을 방지할 수 있습니다."
 GGZ_halki_domination: "할키의 지배"
 GGZ_halki_domination_desc: "가가우즈 할키는 우리의 독립을 추구한 최초의 정치 운동이었으며, 해체될 때까지 최초의 가가우즈 공화국을 이끌었습니다. 이제 이 정당이 재건되었으니, 우리 정치의 주도 세력이 되는 것은 당연한 일입니다."
 GGZ_worrying_inevitable: "우려스러운 필연"
 GGZ_worrying_inevitable_desc: "루마니아인들이 우리를 병합하기로 단단히 마음먹었음은 분명하며, 충돌은 서서히 불가피해지고 있습니다. 우리의 파멸을 막기 위해 필요한 조치를 취해야 합니다."
 GGZ_agricultural_investments: "농업 투자"
 GGZ_textile_production: "섬유 생산"
 GGZ_constitution: "우리의 헌법"
 GGZ_rule_the_halki: "할키의 통치"
 GGZ_national_defense: "가가우지아 국방"
 ROM_1989_redeemed_once_more_desc: "우리 혁명의 꿈은 아직 이루어지지 않았으며, 더 나은 공화국이라는 이상은 계속 살아 있습니다. 왕국의 복원이 더 나은 일이었을지, 그것이 어떤 길을 열었을지는 아무도 알 수 없지만 운명은 달리 정했으니, 우리가 어찌 이를 거스르겠습니까?"
 ROM_anti_unemployment_fund: "실업 방지 기금"
 ROM_anti_unemployment_fund_desc: "실업은 부담이자 재앙입니다. 정말로 일자리를 얻지 못하는 이들에게는 부담이고, 우리에게는 재앙입니다. 실업 방지 기금을 조성하면 실업자들이 몇 달간 세금을 내고 식량과 의약품을 구하며 일자리를 찾을 때까지 버틸 수 있는 수입원을 확보하게 하여 부담을 덜 수 있고, 노숙자 증가세에도 제동을 걸 수 있습니다."
