 expanded_economics: "Polityki w sektorach gospodarki"
 military_spending: "Wydatki wojskowe"
 military_spending_desc: "Poziom naszych wydatków wojskowych decyduje o tym, jak liczne siły możemy wystawić w ramach naszych sił zbrojnych, a także wpływa na produkcję nowego sprzętu wojskowego."
 conscription_law: "Prawo poborowe"
 military_status_women: "Kobiety w armii"
 foreign_intervention_law: "Ustawa o ingerencji zagranicznej"
 foreign_intervention_law_desc: "Ustawa o interwencji zagranicznej określa, jak bardzo nasz kraj jest skłonny do interweniowania w konflikty i wywierania wpływu na inne państwa."
 officer_training_law: "Szkolenie oficerów"
 officer_training_law_desc: "Oficerowie poprowadzą naszych żołnierzy do boju. Im lepiej ich wyszkolimy, tym mniej będą musieli uczyć się na polu walki. Jednakże tworzenie ośrodków szkoleniowych dla oficerów może być kosztowne."
 nuclear_status: "Status nuklearny"
 nuclear_status_desc: "Status programu nuklearnego danego państwa – czy jest to państwo nieposiadające programu jądrowego, wykorzystujące energię jądrową wyłącznie do celów pokojowych, czy też dysponujące bronią jądrową."
 nuclear_stance: "Stanowisko w kwestii broni jądrowej"
 nuclear_stance_desc: "Określa warunki i wymogi, na jakich państwo może użyć broni jądrowej przeciwko przeciwnikowi."
 corruption_level_10: "(10) Paraliżująca korupcja"
 corruption_level_10_desc: "Korupcja w naszym kraju jest wszechobecna, zakorzeniona, systemowa i ma niespotykaną dotąd skalę i zasięg."
 corruption_level_09: "(9) Porażająca korupcja"
 corruption_level_09_desc: "Korupcja w naszym kraju zalewa wszystkie warstwy społeczeństwa. To nie jest działalność kilku nieuczciwych urzędników czy polityków. Przypomina to bardziej przestępczość zorganizowaną, w której korupcyjne transakcje dotyczące zamówień publicznych powstają w wyniku zmowy i rakiety kleptokracji."
 corruption_level_08: "(8) Szerząca się korupcja"
 corruption_level_08_desc: "Korupcja w naszym kraju jest postrzegana jako istotny problem wpływający na wszystkie aspekty życia, w tym administrację publiczną, egzekwowanie prawa, opiekę zdrowotną i edukację. Zjawisko korupcji jest mocno zakorzenione w naszym modelu zarządzania publicznego i przypisywane jest ogólnej słabości praworządności w naszym kraju."
 corruption_level_07: "(7) Niekontrolowana Korupcja"
 corruption_level_07_desc: "Nasz kraj od dawna cierpi z powodu powszechnej i endemicznej korupcji. Korupcja pozostaje poważnym problemem w sektorze publicznym i prywatnym, mimo że prawne i instytucjonalne ramy zwalczania korupcji są silne. Łapówki, łapówki i korupcja rządowa są uważane za część codziennego życia."
 corruption_level_06: "(6) Systematyczna korupcja"
 corruption_level_06_desc: "Na korupcję w naszym kraju składa się wiele czynników, w tym słabe egzekwowanie prawa, brak audytów, brak kodeksów postępowania, nieprzejrzystość działań rządu, nieefektywna biurokracja, bezkarność rządu i szeroka swoboda decyzyjna oraz brak świadomości społecznej."
 corruption_level_05: "(5) Powszechna korupcja"
 corruption_level_05_desc: "Przekupstwo i praktyki korupcyjne są w naszym kraju powszechne, choć kwestią opinii jest, czy jest to problem systemu, czy osób sprawujących władzę."
 corruption_level_04: "(4) Średnia korupcja"
 corruption_level_04_desc: "Nagłaśnianie głośnych przypadków korupcji w mediach i ograniczone zaangażowanie polityczne przyczyniły się do złego postrzegania procesu politycznego w naszym kraju przez społeczeństwo. Powtarzające się skandale korupcyjne z udziałem polityków wysokiego szczebla, lokalnych administratorów i przedsiębiorstw nadużywających środków publicznych ujawniły, że ustanowione zabezpieczenia mające na celu przeciwdziałanie temu nadużyciu władzy są stosunkowo nieskuteczne."
 corruption_level_03: "(3) Umiarkowana korupcja"
 corruption_level_03_desc: "Chociaż postrzeganie korupcji jest ogólnie niskie, partie polityczne i przedsiębiorstwa są zwykle postrzegane jako najmniej uczciwe i godne zaufania. Drobna korupcja nie jest tak rzadka, jak w niektórych innych krajach."
 corruption_level_02: "(2) Niewielka korupcja"
 corruption_level_02_desc: "Postrzeganie i występowanie korupcji są w naszym kraju generalnie bardzo niskie. Drobna korupcja i korupcja administracyjna jest mniej więcej nieistniejąca. Oznacza to, że obywatele i przedsiębiorstwa nie są narażeni na korupcję podczas kontaktu z urzędnikami publicznymi. Jednakże niektóre przypadki pokazały, że powiązania osobiste, prezenty i konflikty interesów stanowią obszary problemowe, które reprezentują niektóre rodzaje nietradycyjnej korupcji."
 corruption_level_01: "(1) Znikoma korupcja"
 corruption_level_01_desc: "The legal and institutional framework in our country is considered effective in fighting against corruption, and government agencies are characterized by a high degree of transparency, integrity, and accountability. The low levels of corruption are attributed to an efficient public administration, high quality and comprehensive services to citizens and enterprises, a long tradition of openness and transparency in our society and institutions, and a strong respect for the rule of law."