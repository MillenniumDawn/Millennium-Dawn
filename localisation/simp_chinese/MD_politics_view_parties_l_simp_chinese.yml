 IRQ.Autocracy_desc: "（什叶派军国主义）- 马赫迪军\n\n马赫迪军在对抗伊拉克境内的外国或敌对势力时崛起，该组织由穆克塔达·萨德尔领导。该组织与其他什叶派民兵组织合作，例如巴德尔旅。"
