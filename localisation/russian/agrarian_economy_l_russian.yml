 agrarian_economy_category_desc: "[ROOT.GetNameWithFlag]: значительная часть населения работает в поле. Число работников, готовых трудиться на обширных пахотных землях, зависит от §Yуровня грамотности§!: чем он выше, тем меньше работников остаётся в сельском хозяйстве.\n\nОднако низкий §Yуровень грамотности§! негативно сказывается на §Yскорости исследований§!.\n"
