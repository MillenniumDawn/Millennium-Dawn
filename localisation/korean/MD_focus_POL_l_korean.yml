 POL_chaos_in_sejm_idea: "세임의 혼란"
 POL_chaos_in_sejm_idea_desc: "세임은 현재 내전을 겪고 있습니다. 우리에게는 완벽한 상황입니다. 그들은 지금 우리의 행동에 신경 쓰지 않습니다."
 POL_cua_category: "공산주의 재봉기"
 POL_cua_category_desc: "§R공산주의자§!와 §C자유 노조 파업 참가자§!(지도자 §Y레흐 바웬사§!) 사이의 대립이 너무나 치열하여 §G국가의 경제 및 내부 안보§!를 위협할 수 있습니다. 거리의 시위와 국제 무대에서 폴란드의 입지 하락은 상황을 개선하지 못하며, 이는 적들에게 악용될 수 있습니다. 양측이 합의에 이르지 못하면 폴란드는 경제적으로 회복하지 못할 수도 있습니다."
 POL_calm_down_the_crowd: "§C군중 진정§!"
 POL_calm_down_the_crowd_desc: "우리는 자유 노조가 승리하도록 놔둘 수 없습니다. 우리가 이 나라를 돕고자 한다는 것을 시민들에게 확신시켜야 합니다."
 POL_stabilize_the_economy: "§G경제 안정화§!"
 POL_stabilize_the_economy_desc: "우리나라 경제를 파괴하고 싶지 않다면 경제 안정성을 통제해야 합니다."
 POL_greater_spending_on_uniformed_services: "§R제복 조직 지출 확대§!"
 POL_greater_spending_on_uniformed_services_desc: "사람들은 우리를 신뢰하지 않지만, 보안 기관을 매수하면 그들의 지지를 얻을 수 있습니다. 이것이 폴란드에서의 우리 지배력을 높이지 못하더라도, 적어도 더 많은 부패한 경찰이 바웬사의 혁명을 진정시키는 데 도움이 될 것입니다."
 POL_greater_spending_on_the_army: "§R군 지출 확대§!"
 POL_greater_spending_on_the_army_desc: "경찰은 현 정부에 충성하므로 우리는 야망을 넓혀야 합니다. 군이 거리에 질서를 가져오는 데 도움을 줄 것입니다."
 POL_bribe_the_corrupt_politicians: "§R부패한 정치인 매수§!"
 POL_bribe_the_corrupt_politicians_desc: "마지막 기회는 정치인들을 매수하여 세임에서 우리의 선전을 퍼뜨리게 하는 것입니다."
 POL_economy_status_auto_increase: "§G경제 상태 증가§!"
 POL_economy_status_auto_increase2: "§G경제 상태 증가§!"
 POL_solidarity_strength_auto_increase: "§C자유 노조 세력 증가§!"
 POL_solidarity_strength_auto_increase2: "§C자유 노조 세력 증가§!"
 POL_prepare_the_coup: "§R쿠데타 준비§!"
 POL_prepare_the_coup_desc: "우리는 현 정부를 가볍게 다룰 수 없습니다. 대통령과 그를 지지하는 정치인들에 대한 신속하고 효과적인 공격을 준비할 것입니다."
 POL_pact_with_the_government: "§R정부와의 협약§!"
 POL_pact_with_the_government_desc: "위험을 감수하지 않겠습니다. 정부와 협약을 맺고 그들이 권력을 포기하도록 강제할 것입니다."
 POL_hire_secret_army_to_gain_control_over_government: "§R정부 장악을 위한 비밀 군대 고용§!"
 POL_hire_secret_army_to_gain_control_over_government_desc: "비밀 군대는 비용이 좀 들지만 정부를 전복하는 가장 효과적인 방법입니다."
 POL_regain_army_trust: "§R군의 신뢰 회복§!"
 POL_regain_army_trust_desc: "정부에 압력을 가하려면 군의 지지를 되찾아야 합니다. 우리는 이를 혼자서 할 수 없습니다."
 POL_incoming_new_solidarity_revolution: "§C다가오는 신 자유 노조 혁명§!"
 POL_incoming_new_solidarity_revolution_desc: "신 자유 노조는 우리를 관대하게 대하는 것을 그만두었습니다. 군중을 최선의 방법으로 진정시키지 못하면 폴란드는 정말로 큰 아수라장이 될 것입니다."
 POL_hunt_the_new_solidarity_politicians: "§R신 자유 노조 정치인 색출§!"
 POL_hunt_the_new_solidarity_politicians_desc: "정치인들은 법과 조작에 능합니다. 그들이 우리에 대한 거짓말을 꾸며 내기 전에 입을 막아야 합니다."
 POL_limiting_activities_at_night: "§R야간 활동 제한§!"
 POL_limiting_activities_at_night_desc: "혁명은 밤에 가장 잘 준비됩니다. 어두운 거리에서는 붙잡힐 위험이 낮습니다. 통행 금지를 도입하고 밤에 거리를 순찰하면 적들이 우리에 대항하는 행동을 조율하기가 효과적으로 더 어려워질 것입니다."
 POL_restoration_of_the_old_penal_system: "§R옛 형사 제도 복원§!"
 POL_restoration_of_the_old_penal_system_desc: "구법에는 허점이 있었으나, 그렇다고 해서 그것을 다시 도입할 필요는 없습니다. 폴란드 인민공화국의 기준에 따라 처벌을 강화하고 감형을 줄일 것입니다."
 POL_ban_on_leaving_the_country_during_strikes: "§R파업 중 출국 금지§!"
 POL_ban_on_leaving_the_country_during_strikes_desc: "국경을 봉쇄하면 혁명가들이 국외로 빠져나갈 수 없게 됩니다."
 POL_crush_the_revolution: "§R혁명 분쇄§!"
 POL_crush_the_revolution_desc: "우리는 혁명의 심장부를 칠 준비가 되었습니다. 신연대가 우리에게 복종하도록 만들 것입니다."
 POL_communism_is_the_only_right_ideology: "§R공산주의만이 유일하게 옳은 이념§!"
 POL_communism_is_the_only_right_ideology_desc: "권력을 유지하려면 정부 내의 누구도 우리를 이용하려 들지 않는다는 확신이 있어야 합니다. 이 나라의 발전 방향을 결정할 권리는 오직 우리에게만 있습니다."
 POL_defamation_of_walesa: "§R명예 훼손: §!§C바웬사§!"
 POL_defamation_of_walesa_desc: "바웬사는 이미 우리에게 충분한 문제를 일으켰습니다. 가장 끔찍한 범죄로 고발하게 되더라도 언론과 거리에서 그를 중상할 것입니다. 사람들이 우리의 말을 믿게 만들 것입니다."
 POL_fill_the_government_with_communists: "§R정부를 공산주의자로 채우기§!"
 POL_fill_the_government_with_communists_desc: "위대한 붉은 혁명을 마침내 완수하는 것을 가로막는 것은 아무것도 없습니다. 우리는 사회의 전폭적인 지지를 받고 있으며 신연대는 더 이상 문제가 되지 않습니다. 이제 우리의 과업을 마무리할 때입니다."
 POL_military_doctors_in_hospitals: "병원의 군의관"
 POL_military_doctors_in_hospitals_desc: "병원에 군의관이 있으면 사람들이 그들의 치료 방식을 알게 되고, 오늘날 전선의 의료가 그리 나쁘지 않다는 것을 이해하게 될 것입니다."
 POL_propaganda_in_schools: "학교 내 선전"
 POL_propaganda_in_schools_desc: "우리는 아이들에게 공산주의의 가장 좋은 면을 보여 주어야 하며, 그래야 훗날 이들이 이 위대하고 성장하는 제국을 건설하는 데 힘을 보탤 것입니다."
 POL_department_of_foreign_influence_category: "대외 영향력부"
 POL_start_visegrad_plans: "비셰그라드 계획 개시"
 POL_start_visegrad_plans_desc: "흑해로 진출하기 전에 비셰그라드 그룹에 속한 남쪽 이웃 나라들을 처리해야 합니다. 이 나라들은 개별적으로는 큰 위협이 되지 않지만, 하나의 집단으로는 우리에게 매우 유용할 수 있습니다."
 POL_visegrad_plans_deadline_mission: "비셰그라드 계획 기한"
 POL_visegrad_plans_deadline_mission_desc: "체코, 슬로바키아, 헝가리를 끌어들이는 일을 너무 오래 미룰 수는 없습니다. 2년 안에 목표를 달성하지 못하면 대평의회가 우리의 활동에 대한 자금 지원을 중단할 수 있습니다."
 POL_visegrad_plans_influence_mission: "반공 캠페인"
 POL_visegrad_plans_influence_mission_desc: "일부 사람들은 우리가 자국에서 영향력을 행사하는 것을 달가워하지 않습니다. 그들은 가끔 다른 이들을 설득해 우리의 행동을 깎아내리려 하겠지만, 큰 위협은 되지 않습니다."
 POL_spread_propaganda: "선전 확산"
 POL_spread_propaganda_desc: "이것은 이념을 퍼뜨리는 가장 간단한 방법이며, 우리보다 약한 나라들에서 크게 효과를 발휘할 것입니다. 현지 전령을 활용해 선전물을 퍼뜨리고 현지 언론을 매수할 것입니다."
 POL_military_showcase: "군사력 과시"
 POL_military_showcase_desc: "체코 같은 나라는 우리가 더 큰 군대를 보유하고 있음을 보여 주면 쉽게 위협할 수 있습니다. 이러한 우위를 이용해 그들이 공산주의로 전향하도록 설득할 것입니다."
 POL_divide_the_nations: "민족 분열"
 POL_divide_the_nations_desc: "체코와 슬로바키아는 서로 별개의 민족이지만 매우 가깝습니다. 체코슬로바키아는 더 이상 존재하지 않으나, 두 나라의 옛 역사가 우리의 영향력에 맞서 하나로 뭉치게 만들 수도 있습니다."
 POL_offer_help_in_industry_development: "산업 발전 지원 제안"
 POL_offer_help_in_industry_development_desc: "체코인과 슬로바키아인에게 우리가 그들의 내정을 충분히 돌볼 수 있음을 보여 주어야 합니다. 텔레비전에서 우리를 좋게 말해 주는 대가로 경제적 지원을 제공할 것입니다."
 POL_intimidation: "위협"
 POL_intimidation_desc: "헝가리는 자긍심이 강한 나라이며 공산주의의 영향을 쉽게 받지 않을 것입니다. 우리 체제를 거부하기 전에 다시 한번 생각하는 편이 좋다는 것을 보여 줄 것입니다."
 POL_diplomatic_mission: "외교 사절단"
 POL_diplomatic_mission_desc: "공산주의도 평화의 길을 걸을 수 있다고 헝가리인들을 설득해야 합니다. (우리의 경우에는 거짓말이지만 말입니다.)"
 POL_question_about_czech_republic: "체코 문제"
 POL_question_about_czech_republic_desc: "체코에 우리 동맹에 가입하도록 요청할 수 있습니다. 그래도 그들을 완전히 장악하는 편이 아마 더 나을 것입니다."
 POL_invite_slovakia: "슬로바키아 초청"
 POL_invite_slovakia_desc: "슬로바키아에는 이미 충분한 공산주의 영향력이 퍼져 있습니다. 이제 그들이 우리와 함께할 때입니다."
 POL_hungarian_bros: "헝가리 형제들"
 POL_hungarian_bros_desc: "우리는 늘... 아니, 거의 늘 헝가리와 우호적인 관계를 유지해 왔습니다. 이제 우정을 되살릴 때입니다."
 POL_add_dofi_visegrad_spirit: "§9비셰그라드 그룹§! 국가 정신 활성화"
 POL_start_baltic_plans: "발트 계획 개시"
 POL_start_baltic_plans_desc: "스칸디나비아에 도달하기 전에 발트해에서의 영향력을 키워야 합니다."
 POL_baltic_plans_deadline_mission: "발트 계획 기한"
 POL_baltic_plans_deadline_mission_desc: "리투아니아, 라트비아, 에스토니아를 끌어들이는 일을 너무 오래 미룰 수는 없습니다. 2년 안에 목표를 달성하지 못하면 대평의회가 우리의 활동에 대한 자금 지원을 중단할 수 있습니다."
 POL_baltic_plans_influence_mission: "반공 캠페인"
 POL_baltic_plans_influence_mission_desc: "일부 사람들은 우리가 자국에서 영향력을 행사하는 것을 달가워하지 않습니다. 그들은 가끔 다른 이들을 설득해 우리의 행동을 깎아내리려 하겠지만, 큰 위협은 되지 않습니다."
 POL_promise_protection: "보호 약속"
 POL_promise_protection_desc: "지난번에 발트 국가들은 싸움 한 번 없이 러시아에 항복했습니다. 그 전쟁이 무의미했기 때문입니다. 하지만 이제는 우리가 그들을 보호해 줄 수 있습니다."
 POL_antagonize_russia_decision: "러시아 자극"
 POL_antagonize_russia_decision_desc: "러시아의 정책과 우리의 정책이 어떻게 다른지 보여 줍시다. \\"우리는 강력한 동맹을 만들고자 하나, 그들은 전체주의 국가를 만들고자 한다.\\""
 POL_offer_rail_baltica_improvement: "레일 발티카 개선 제안"
 POL_offer_rail_baltica_improvement_desc: "레일 발티카는 큰 성공을 거두었습니다. 발트 국가들이 이 사업을 개선하도록 지원합시다."
 POL_recognize_great_alliance: "대동맹 인정"
 POL_recognize_great_alliance_desc: "두 왕관의 동맹, 폴란드-리투아니아 연방은 중세 유럽의 가장 위대한 군사 강국 중 하나였습니다. 민주적 절차에 얽매이지 않는 폴란드와의 동맹이 리투아니아인들의 나라에 일어날 수 있는 가장 좋은 일임을 깨닫게 해 줍시다."
 POL_threat_baltic_sea_restrictions: "발트해 제한 위협"
 POL_threat_baltic_sea_restrictions_desc: "우리가 발트해 전체를 지배하고 있지 않으므로 위험하지만, 라트비아와 에스토니아의 해상 무역을 방해하는 모험을 감수할 수 있습니다."
 POL_offer_baltic_sea_protection: "발트해 보호 제안"
 POL_offer_baltic_sea_protection_desc: "러시아나 NATO와 전쟁이 벌어질 경우를 대비해 우리 해역의 안보를 확보해야 합니다."
 POL_invite_lithuania: "리투아니아와 다시 연결"
 POL_invite_latvia: "라트비아 초청"
 POL_invite_estonia: "에스토니아에 손 뻗기"
 POL_add_dofi_baltic_spirit: "§O발트 국가들§! 국가 정신 활성화"
 POL_start_balkan_plans: "동부 발칸 계획 개시"
 POL_start_balkan_plans_desc: "루마니아는 우리에게 흑해로의 접근로를 제공할 것이며, 불가리아는 발칸 반도에서의 안정적인 입지를 마련해 줄 것입니다."
 POL_balkan_plans_deadline_mission: "동부 발칸 계획 기한"
 POL_balkan_plans_deadline_mission_desc: "루마니아와 불가리아를 끌어들이는 일을 너무 오래 미룰 수는 없습니다. 2년 안에 목표를 달성하지 못하면 대평의회가 우리의 활동에 대한 자금 지원을 중단할 수 있습니다."
 POL_balkan_plans_influence_mission: "반공 캠페인"
 POL_balkan_plans_influence_mission_desc: "일부 사람들은 우리가 자국에서 영향력을 행사하는 것을 달가워하지 않습니다. 그들은 가끔 다른 이들을 설득해 우리의 행동을 깎아내리려 하겠지만, 큰 위협은 되지 않습니다."
 POL_false_promises: "거짓 약속"
 POL_false_promises_desc: "우리 동맹이 유럽을 장악하려는 것이 아님을 루마니아 정부에 확신시켜야 합니다. \\"우리는 러시아와 NATO 모두로부터 독립된 방위 조약이다.\\" 우리 공산주의자들이 권력을 잡은 뒤에는 민주 정부가 우리의 결정에 의문을 제기하기에는 이미 너무 늦을 것입니다."
 POL_stop_the_privatization: "민영화 중단"
 POL_stop_the_privatization_desc: "루마니아의 민영화는 득보다 실이 더 컸습니다. 민주주의는 또다시 실패했지만, 우리 공산주의자들은 기업에 다시 자유를 가져다줄 것이며 모든 것이 다시 공동의 것이 될 것입니다."
 POL_seek_red_loyal_officers: "충성스러운 장교 물색"
 POL_seek_red_loyal_officers_desc: "군의 일부 장교와 지휘관은 여전히 공산 통치에 호의적일 수 있습니다. 그것이 사실인지는 알 수 없으나, 누군가를 찾아낸다면 우리 혁명을 지지하도록 설득할 것입니다."
 POL_promote_new_form_of_the_communism: "새로운 형태의 공산주의 홍보"
 POL_promote_new_form_of_the_communism_desc: "낡은 공산주의는 탄압, 불의, 권력 남용과 연관되어 있습니다. 우리는 그들보다 낫습니다. 우리의 공동체가 소련이 내세운 것보다 비할 데 없이 낫다는 것을 불가리아인들에게 보여 줍시다."
 POL_be_a_part_of_greater_alliance: "더 큰 동맹의 일부가 되기"
 POL_be_a_part_of_greater_alliance_desc: "이웃 나라들이 서로의 내부 사정을 훨씬 더 잘 이해한다면 NATO가 무슨 필요가 있겠습니까? 붉은 유럽 조약은 유럽 국가들을 하나로 묶는 공동체입니다. 충분히 많은 나라가 우리를 신뢰한다면 불가리아도 우리와 함께하도록 설득할 수 있을 것입니다."
 POL_invite_romania: "루마니아 초청"
 POL_invite_bulgaria: "불가리아 초청"
 POL_add_dofi_balkan_spirit: "§6동부 발칸§! 국가 정신 활성화"
 POL_add_dofi_scandinavia_spirit: "§1스칸디나비아§! 국가 정신 활성화"
 POL_start_scandinavia_plans: "스칸디나비아 계획 개시"
 POL_start_scandinavia_plans_desc: "유럽 북부 지역은 아직 우리의 손이 닿지 않습니다. 스웨덴은 오랫동안 중립을 지켜 왔으므로 현지 정부를 설득하기가 쉽지 않을 것입니다. 한편 핀란드는 공산주의 소련의 공격적인 외교에 대해 그다지 좋은 기억을 갖고 있지 않습니다. 쉽지는 않겠지만 우리는 스칸디나비아 국가들을 장악해야 합니다."
 POL_scandinavia_plans_deadline_mission: "스칸디나비아 계획 기한"
 POL_scandinavia_plans_deadline_mission_desc: "스웨덴과 핀란드를 끌어들이는 일을 무한정 미룰 수는 없습니다. 긴장을 늦추지 말아야 합니다."
 POL_scandinavia_plans_influence_mission: "반공 캠페인"
 POL_scandinavia_plans_influence_mission_desc: "일부 사람들은 우리가 자국에서 영향력을 행사하는 것을 달가워하지 않습니다. 그들은 가끔 다른 이들을 설득해 우리의 행동을 깎아내리려 하겠지만, 큰 위협은 되지 않습니다."
 POL_better_stick_together: "뭉치는 편이 낫다"
 POL_better_stick_together_desc: "중립은 지금까지 스웨덴에게 잘 통했습니다. 그러나 공산주의 국가들과의 공동 발전을 고려해 볼 가치가 있지 않겠습니까? 민주주의는 결코 그러한 힘을 이룰 수 없습니다. 자유 선거가 그러한 경제적, 정치적 제약을 감수할 만큼 정말 가치가 있습니까?"
 POL_follow_your_neighbor: "이웃을 따르라"
 POL_follow_your_neighbor_desc: "핀란드가 설득되었는데 스웨덴이 합류하지 못할 이유가 무엇이겠습니까? 스칸디나비아 국가들은 함께 뭉쳐야 하지 않겠습니까?"
 POL_major_propaganda_campaign: "대규모 선전 캠페인"
 POL_major_propaganda_campaign_desc: "인사치레는 이제 충분합니다. 사람들은 민주주의의 진정한 단점과 공산주의의 최대 장점을 알아야 합니다. 우리의 안정도는 다소 하락하겠지만 그만한 가치가 있을 것입니다."
 POL_new_communism_isnt_that_bad: "새로운 공산주의도 그리 나쁘지 않다"
 POL_new_communism_isnt_that_bad_desc: "핀란드는 아마도 공산주의를 탄압과 부패와 연관 지을 것입니다. 우리는 완전히 새로운 형태의 공산주의를 제시합니다. 완벽한 공산주의입니다."
 POL_opportunity_to_regain_mannerheim_line_territories: "만네르헤임 선 영토 회복의 기회"
 POL_opportunity_to_regain_mannerheim_line_territories_desc: "1940년 핀란드는 겨울 전쟁의 결과로 만네르헤임 선을 소련에 빼앗겼습니다. 제2차 세계 대전 이후 자유 세계는 러시아가 이 지역들을 계속 보유해도 좋다고 결정했습니다. 얼마나 부당한 일입니까. 우리 동맹이 충분히 강해진다면 러시아가 이 영토들을 포기하도록 \\"설득\\"할 수 있을 것입니다."
 POL_soviet_regime_is_long_over: "소련 체제는 오래전에 끝났다"
 POL_soviet_regime_is_long_over_desc: "핀란드는 여전히 우리의 공산주의에 대해 확신하지 못하고 있습니다. 우리는 소련을 모방하지 않습니다. 우리는 이미 오래전에 무너진 그 강국보다 훨씬 낫습니다. 우리에게는 자명한 일이지만 핀란드인들에게는 그렇지 않습니다."
 POL_invite_sweden_two: "스웨덴 초청"
 POL_invite_finland: "핀란드 초청"
 POL_six_year_plan_category: "6개년 계획"
 POL_six_year_plan_category_desc: "새로운 6개년 계획 덕분에 우리는 국가의 특정 부문에 집중할 수 있으며, 이를 통해 혼란을 통제하고 내부 정세를 안정시킬 수 있습니다. 좌파 노동자들은 이 어려운 시기에 우리가 그들을 지원하기를 기대합니다. 우리는 그들을 실망시키지 않을 것입니다.\n안타깝게도 대평의회의 자금은 한정되어 있습니다. 짧은 기간에 지나치게 많은 대규모 투자를 하려 한다면 우리 경제가 감당하지 못할 수도 있습니다. 어디까지나 6개년 계획이지 8개년 계획이 아니니까요."
 POL_improve_national_highways: "국도 개선"
 POL_improve_national_highways_desc: "폴란드의 도로는 오래전부터 끔찍할 정도로 구멍투성이였고, 일부 도시의 상태는 말할 것도 없습니다... 6개년 계획의 한 부분은 도시의 거리를 보수하고 고속도로의 새로운 분기점을 건설하는 것입니다."
 POL_clean_up_chaos_in_administration: "행정 혼란 정리"
 POL_clean_up_chaos_in_administration_desc: "우리의 혁명이 행정에 혼란을 일으키리라는 것은 자명했습니다. PPS는 이 문제를 가능한 한 빨리 해결하는 것이 얼마나 중요한지 이해하지 못하고 있습니다. 이 모든 서류를 정리하는 일은 쉽지 않고 직원들은 과로하고 있으므로 더 많은 사무소가 필요합니다."
 POL_invest_in_modern_factory_machinery: "현대식 공장 기계 투자"
 POL_invest_in_modern_factory_machinery_desc: "이것은 6개년 계획의 기본 전제인 경제 발전입니다. 새로운 공장은 새로운 일자리를 의미하며 많은 이들이 실업에서 벗어날 기회가 됩니다. 모두가 이로움을 얻습니다."
 POL_fund_laboratories: "연구소 지원"
 POL_fund_laboratories_desc: "새 건물이 전부는 아닙니다. 이미 가진 것을 최대한 활용해야 합니다. 연구 자금은 우리가 경제 강국으로 성장하는 속도를 더욱 높여 줄 것입니다."
 POL_military_industrialization: "군사 산업화"
 POL_military_industrialization_desc: "우리는 평화의 길을 택했으나 언제나 적에 맞서 스스로를 방어할 준비가 되어 있어야 합니다. 세상은 결코 평화롭지 않을 것입니다..."
 POL_nuclear_energy: "원자력 에너지"
 POL_nuclear_energy_desc: "원자로는 많은 논란을 일으키는 대상입니다. 그러나 오늘날에는 체르노빌의 비극이 반복될 가능성이 없습니다. 우리는 더 잘 준비되어 있습니다."
 POL_communists_vs_social_democrats_category: "사회민주주의자 대 공산주의자"
 POL_communists_vs_social_democrats_category_desc: "PPS와 ZKP-P 사이의 내전은 나라에 큰 혼란을 일으켰습니다. 곳곳에 공산주의자들이 있으며 제2의 붉은 혁명은 끊임없이 영향력을 확대하고 있습니다. 외부의 도움 없이는 이를 통제하기 어려울 수 있습니다."
 POL_arrest_communist_supporters: "공산주의 지지자 체포"
 POL_arrest_communist_supporters_desc: "ZKP-P 동조자들의 입을 막아 공산주의의 영향력을 억눌러야 합니다. 이들 중 상당수가 불법 무기를 소지하고 있을 가능성이 있으며, 우리는 이를 활용할 수 있습니다."
 POL_obligatory_army_service: "의무 병역"
 POL_obligatory_army_service_desc: "국가의 다른 부문을 희생하더라도 군사비를 늘려야 합니다. 공산주의자들이 우리보다 우위를 점하도록 내버려 둘 수는 없습니다."
 POL_seek_help_in_western_countries: "서방 국가들에 도움 요청"
 POL_seek_help_in_western_countries_desc: "시도해 볼 수는 있으나 우리 힘만으로 공산주의자들을 물리치기는 어려울 것입니다. 서방에 도움을 요청하면 분명 누군가는 응답할 것입니다."
 POL_communist_uprising_in_dolny_slask: "돌니 실롱스크의 공산주의 봉기"
 POL_communist_uprising_in_warmia_i_mazury: "바르미아 마주리의 공산주의 봉기"
 POL_civ_mil_category: "경제 및 군사 프로젝트"
 POL_civ_mil_category_desc: "민주주의자들은 1989년 이전에 공산주의자들이 망쳐 놓은 것을 바로잡지 못했습니다. 그렇기에 우리는 폴란드 경제를 재건해야 합니다."
 POL_improve_coast_line: "해안선 개선"
 POL_improve_coast_line_desc: "해안선이 우리의 최우선 과제는 아니지만 어느 정도의 방어를 갖춰 둘 가치는 있습니다."
 POL_modernize_office_sectors: "사무 부문 현대화"
 POL_modernize_office_sectors_desc: "이는 피할 수 없었습니다. 전국적인 혁명으로 인한 행정의 혼란이라니, 누가 예상이나 했겠습니까..."
 POL_start_advanced_training_program: "고급 훈련 프로그램 개시"
 POL_start_advanced_training_program_desc: "육군에만 집중할 것이 아니라 공중전에서도 승리할 수 있도록 확실히 해야 합니다."
 POL_save_the_revolution: "§R혁명을 구하라!§!"
 POL_save_the_revolution_desc: "모든 것이 실패했습니다! 이 나라에서 우리의 영향력을 유지하기 위해 가능한 모든 것을 해야 합니다!"
 POL_new_solidarity_final_strike: "§C신연대의 최후 공세§!"
 POL_new_solidarity_final_strike_desc: "신연대는 정부와 협력하여 우리의 혁명을 끝낼 준비가 되었습니다. 군대가 우리에 맞서 무장하고 있으나, 우리는 그리 쉽게 포기하지 않을 것입니다!"
