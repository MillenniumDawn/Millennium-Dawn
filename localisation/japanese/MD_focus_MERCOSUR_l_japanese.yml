 MER_launch_corridor_investment_round: "MERCOSUR回廊投資ラウンド開始"
 MER_launch_corridor_investment_round_desc: "より強いブロックは紙の上だけでは成立しない。国庫裏付けの回廊資金の新ラウンドを放出することで、現MERCOSUR正式加盟国全体のインフラとネットワーク統合を加速し、ブロックの物理的基盤を強化できる。"
 MER_release_development_fund_round: "MERCOSUR開発基金ラウンド拠出"
 MER_release_development_fund_round_desc: "統合の約束は、目に見える投資に裏打ちされてこそ説得力を持つ。MERCOSUR開発基金から新たなラウンドを拠出することで、ブロック全体の民需建設とオフィス拡張を加速し、正式加盟国の経済的基盤を強化できる。"

 mercosur.02.t: "MERCOSUR準加盟招待"
 mercosur.02.d: "[FROM.GetName]が、MERCOSURに準加盟国として参加する提案を持ちかけてきた。これを受け入れれば、正式加盟を約束することなく、南米ブロックとの統合を深めることができる。"
 mercosur.02.a: "準加盟を受諾"
 mercosur.02.b: "今は見送り"

 mercosur.03.t: "準加盟受諾"
 mercosur.03.d: "[FROM.GetName]が我々の提案を受け入れ、MERCOSURに準加盟国として加わる。"
 mercosur.03.a: "素晴らしい"

 mercosur.04.t: "準加盟拒否"
 mercosur.04.d: "[FROM.GetName]は今のところ我々の提案を拒否した。後で再挑戦できるだろう。\n\n受託率はその国とのopinion、影響力、メルコスールのツリーの進行具合で決定される。"
 mercosur.04.a: "残念だ"

 mercosur.05.t: "正式加盟交渉開始"
 mercosur.05.d: "[CHL.GetName]をMERCOSURの正式加盟国へ迎え入れるための正式交渉を開始した。"
 mercosur.05.a: "進めよう"

 mercosur.06.t: "加盟手続き開始招待"
 mercosur.06.d: "[FROM.GetName]が、MERCOSUR正式加盟に向けた最終的な加盟手続きを開始するよう我々を招待してきた。これを受け入れても、現時点では準加盟国のままだが、正式加盟に先立って完了しなければならない一連の加盟任務が開放される。"
 mercosur.06.a: "加盟手続きを開始"
 mercosur.06.b: "準加盟のままにとどまる"

 mercosur.07.t: "加盟手続き受諾"
 mercosur.07.d: "[FROM.GetName]が我々の提案を受け入れ、MERCOSUR正式加盟に向けた加盟手続きへ入った。必要な任務が完了し次第、正式加盟が続く。"
 mercosur.07.a: "作業開始"

 mercosur.08.t: "正式加盟拒否"
 mercosur.08.d: "[FROM.GetName]は今のところ正式加盟を辞退した。"
 mercosur.08.a: "また後で見直そう"

