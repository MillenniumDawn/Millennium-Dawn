 ISR_mossad_military_advisors: "Especialistas Militares Israelenses"
 ISR_mossad_military_advisors_desc: "Especialistas militares israelenses fornecem ativamente apoio e treinamento às forças armadas deste país."
 israel_economy.78.t: "Israel nos oferece apoio!"
 israel_economy.78.d: "Israel, a fim de conter a influência do Irã no Oriente Médio, quer fornecer à nossa nação em ascensão uma grande quantidade de apoio. Isso aumentará a influência deles sobre nós e talvez precisemos gastar algum dinheiro, mas o acordo é muito promissor..."
 israel_economy.78.a: "Claro que concordamos!"
 israel_economy.78.b: "Não faremos parte dos seus planos!"
 israel_economy.79.t: "O Curdistão concorda!"
 israel_economy.79.d: "O Curdistão aceitou receber nosso apoio e demonstrou vontade de cooperar conosco no futuro."
 israel_economy.79.a: "Ótimo!"
 israel_economy.80.t: "O Curdistão não concordou!"
 israel_economy.80.d: "O Curdistão não aceitou nosso apoio. Eles dizem que devemos abandonar a metodologia de usá-los como ferramenta em nossas tramas."
 israel_economy.80.a: "Eles são loucos?"
 israel_news.11.t: "Ascensão da Iran International"
 israel_news.11.d: "Membros do governo israelense, em cooperação com dissidentes iranianos, proclamaram a criação da Iran International, um canal de televisão em persa 24 horas e operação de notícias digitais que se posiciona firmemente contra o regime do Aiatolá. Críticos no Irã acusaram a empresa de apenas espalhar propaganda israelense, com propostas rápidas visando proibir suas transmissões no país poucos dias após o anúncio."
 israel_news.11.o1: "Mais lixo sionista!"
 israel_news.11.o2: "O panorama da mídia muda."
 israel_economy.81.t: "Reza Shah Pahlavi visita Israel!"
 israel_economy.81.d: "O príncipe exilado do Irã, Reza Pahlavi, viaja a Israel em meio ao aumento das tensões com o Irã, para entregar uma mensagem de amizade do povo iraniano. Israel e Irã tinham relações amistosas durante a monarquia, quando dezenas de milhares de judeus iranianos viviam em paz e harmonia por longos séculos. A grande maioria deixou o Irã por volta de 1979, quando os revolucionários anti-israelenses derrubaram a monarquia e iniciaram um reinado de terror contra aqueles que consideravam indesejáveis. Muitos judeus em Israel e na diáspora veem uma amizade histórica com o povo iraniano que remonta a 2.500 anos, quando o rei persa Ciro, o Grande, libertou judeus que estavam em cativeiro na Mesopotâmia e os ajudou a retornar a Jerusalém. A maioria dos iranianos que se opõem ao regime clerical também expressa atitudes amistosas e de apoio a Israel e vê o apoio financeiro e militar de seu governo a forças anti-israelenses na região como um desperdício da riqueza nacional."
 israel_economy.81.a: "Saudações, amigo!"
 israel_economy.82.t: "Maryam Rajavi visita Israel!"
 israel_economy.82.d: "Maryam Rajavi, a proeminente líder dos Mujahedin do Povo do Irã, chegou hoje a Israel para uma visita histórica destinada a fortalecer a coalizão contra o regime iraniano. A visita de Rajavi destaca um desenvolvimento significativo na dinâmica geopolítica do Oriente Médio, refletindo um interesse comum entre o MEK e Israel em conter a influência do Irã na região. Durante a visita, Rajavi reuniu-se com altas autoridades israelenses, incluindo o Primeiro-Ministro  e o Presidente. As discussões concentraram-se em preocupações mútuas com as ambições nucleares do Irã, seu apoio a milícias aliadas em todo o Oriente Médio e as violações de direitos humanos dentro do Irã. "
 israel_economy.82.a: "Bem-vinda!"
 ISR_government_company_hacked: "Rede Iraniana Hackeada"
 israel_economy.83.t: "Israel hackeia a rede do governo iraniano!"
 israel_economy.83.d: "Recentemente, hackers israelenses invadiram com sucesso a rede governamental iraniana e roubaram dados iranianos de servidores."
 israel_economy.83.a: "Malditos sionistas!"
 israel_economy.83.b: "Ótimo trabalho!"
 israel_economy.84.t: "Protestos no Irã!"
 israel_economy.84.d: "Recentemente, em muitas partes da República Islâmica do Irã surgiram protestos contra o governo. Muitas autoridades iranianas sugerem que foram incitados por potências estrangeiras numa tentativa de derrubar o governo do Irã..."
 israel_economy.84.a: "Os sionistas estão por trás disso!"
 ISR_drone_better_operations: "Operações Avançadas com Drones"
 israel_news.12.t: "EUA e Israel lançam ataque conjunto ao Irã para frustrar ameaça nuclear"
 israel_news.12.d: "O Presidente [USA.GetLeader] dirigiu-se à nação, afirmando que a decisão de declarar guerra não foi tomada de forma leviana, mas foi tornada necessária pela ameaça iminente representada pelas ambições nucleares do Irã. \n - Nossa inteligência confirmou que o Irã está perigosamente perto de obter uma arma nuclear - disse o Presidente [USA.GetLeader]. \n - Isso representa uma ameaça inaceitável à segurança e à estabilidade globais. Em coordenação com nosso aliado Israel, não temos escolha senão tomar uma ação militar decisiva para neutralizar essa ameaça. \n As declarações vieram após semanas de tensões crescentes e esforços diplomáticos fracassados para conter o programa nuclear do Irã. A campanha militar conjunta visa atingir as instalações nucleares e a infraestrutura militar do Irã para impedir novos avanços em suas capacidades nucleares."
 israel_news.12.o1: "Hannibal ad portas?"
 israel_economy.85.t: "Israel propõe uma operação militar contra o Irã!"
 israel_economy.85.d: "Após dados recentes sobre o programa nuclear iraniano e a descoberta de planos iranianos por sua agência de inteligência, Israel propõe uma resposta militar imediata ao Irã!"
 israel_economy.85.a: "Hora de espalhar a democracia!"
 israel_economy.85.b: "Belo conto de fadas."
 israel_economy.86.t: "Os EUA aceitam!"
 israel_economy.86.d: "A operação começou, as forças americanas serão enviadas em breve!"
 israel_economy.86.a: "Vamos nessa!"
 israel_economy.87.t: "Os EUA recusam nossa proposta."
 israel_economy.87.d: "Eles não se juntarão a nós nesta operação."
 israel_economy.87.a: "Tanto faz!"
 israel_economy.88.t: "Israel propõe reparar as relações!"
 israel_economy.88.d: "Recentemente, durante negociações mútuas em Omã, o governo israelense propôs um renovado tratado de paz entre nossos países. Eles dizem que devemos abandonar nossa animosidade mútua e assinar um tratado de não agressão."
 israel_economy.88.a: "Tudo bem, acho..."
 israel_economy.88.b: "Outra trama sionista?!"
 israel_economy.89.t: "O Irã concorda!"
 israel_economy.89.d: "O pacto de não agressão foi assinado."
 israel_economy.89.a: "Ótimo!"
 israel_news.13.t: "Israel e Irã assinam um pacto de não agressão!"
 israel_news.13.d: "Em um desenvolvimento revolucionário, Irã e Israel assinaram uma série de tratados de não agressão e paz, marcando um marco significativo na diplomacia do Oriente Médio. Os acordos, intermediados com a ajuda de mediadores internacionais, foram assinados em Genebra na quarta-feira, sinalizando uma nova era de cooperação e estabilidade na região.\n\nOs acordos históricos incluem um abrangente pacto de não agressão, o reconhecimento mútuo da soberania e estruturas para a cooperação econômica e cultural. A cerimônia de assinatura contou com a presença de altas autoridades de ambas as nações, bem como de representantes das Nações Unidas, da União Europeia e de outras partes interessadas internacionais importantes."
 israel_news.13.o1: "Uma esperança de status quo?"
 israel_economy.90.t: "O Irã não concordou!"
 israel_economy.90.d: "Eles não concordaram em assinar um tratado de paz."
 israel_economy.90.a: "O que é que esperávamos, afinal?!"
 israel_economy.91.t: "Israel propõe um ataque com drones!"
 israel_economy.91.d: "Israel propõe um esforço cooperativo para neutralizar o general iraniano Qasem Soleimani. Eles querem nosso apoio na condução desta operação. Devemos concordar?"
 israel_economy.91.a: "Estamos com vocês!"
 israel_economy.91.b: "Vocês estão por conta própria."
 israel_economy.92.t: "Os EUA apoiarão nosso país."
 israel_economy.92.d: "Podemos começar os preparativos."
 israel_economy.92.a: "Ótimo!"
 israel_economy.93.t: "Os EUA não apoiarão nosso país!"
 israel_economy.93.d: "Eles não se juntarão a nós em nossa operação."
 israel_economy.93.a: "Muito lamentável."
 israel_economy.94.t: "Israel nos oferece apoio!"
 israel_economy.94.d: "Israel, a fim de conter a influência islâmica radical no Oriente Médio, quer fornecer à nossa nação em dificuldades uma grande quantidade de apoio. Isso aumentará a influência deles sobre nós e talvez precisemos gastar algum dinheiro, mas o acordo é muito promissor..."
 israel_economy.94.a: "Claro que concordamos!"
 israel_economy.94.b: "Não faremos parte dos seus planos!"
 israel_economy.95.t: "O Irã concorda!"
 israel_economy.95.d: "O Irã aceitou receber nosso apoio e demonstrou vontade de cooperar conosco no futuro."
 israel_economy.95.a: "Ótimo!"
 israel_economy.96.t: "O Irã não concordou!"
 israel_economy.96.d: "O Irã não aceitou nosso apoio. Eles dizem que devemos abandonar a metodologia de usá-los como ferramenta em nossas tramas."
 israel_economy.96.a: "Eles são loucos?"
 ISR_iran_def_idea: "Consolidação Anti-Irã"
 israel_economy.97.t: "Israel propõe os Acordos de Ciro!"
 israel_economy.97.d: "O governo israelense propõe um acordo de amizade entre Israel e Irã, relativo a assuntos de defesa e políticos. Devemos concordar?"
 israel_economy.97.a: "Claro!"
 israel_economy.97.b: "Desculpe, não."
 israel_economy.98.t: "O Irã concorda!"
 israel_economy.98.d: "O Irã aceitou nosso tratado!"
 israel_economy.98.a: "Ótimo!"
 israel_economy.99.t: "O Irã não concordou!"
 israel_economy.99.d: "Eles não concordaram em assinar os Acordos de Ciro."
 israel_economy.99.a: "Muito lamentável."
 ISR_iran_wat_idea: "Apoio Agrícola Israelense"
 israel_economy.100.t: "Israel oferece apoio agrícola!"
 israel_economy.100.d: "O governo israelense nos oferece apoio em irrigação e sustentabilidade agrícola. Devemos concordar?"
 israel_economy.100.a: "Claro!"
 israel_economy.100.b: "Desculpe, não."
 israel_economy.101.t: "O Irã concorda!"
 israel_economy.101.d: "Eles aceitaram nossa oferta!"
 israel_economy.101.a: "Maravilhoso!"
 israel_economy.102.t: "O Irã não concordou!"
 israel_economy.102.d: "O Irã não concordou com nossa oferta."
 israel_economy.102.a: "Pois é."
 ISR_isr_iran_oil: "Companhia do Oleoduto Eilat-Ashkelon"
 israel_economy.103.t: "Israel oferece a reabertura da Companhia do Oleoduto Eilat-Ashkelon!"
 israel_economy.103.d: "Muitos anos atrás, antes da revolução islâmica no Irã, Israel e Irã tinham uma companhia petrolífera conjunta que lucrava a ambos na época. Agora, com o regime tirânico dos aiatolás fora do Irã, o governo israelense oferece a reabertura dessa companhia. Devemos concordar?"
 israel_economy.103.a: "Onde assino?"
 israel_economy.103.b: "Não."
 israel_economy.104.t: "O Irã concorda!"
 israel_economy.104.d: "A companhia foi estabelecida!"
 israel_economy.104.a: "Ótimo!"
 israel_economy.105.t: "O Irã não concordou!"
 israel_economy.105.d: "Eles não querem reabrir a companhia."
 israel_economy.105.a: "Muito lamentável."
 israel_economy.106.t: "Israel nos envia um presente!"
 israel_economy.106.d: "Recentemente, autoridades israelenses, como gesto de boa-fé e vontade, decidiram nos presentear com alguns gamos-persas. Antigamente, o Xá do Irã os presenteou a Israel como gesto de amizade. Entretanto, desde então, esses animais foram extintos no próprio Irã, mas os que foram presenteados em Israel sobreviveram. Agora eles nos retribuem o favor!"
 israel_economy.106.a: "Obrigado!"
 israel_economy.107.t: "Israel propõe um Programa Conjunto de Mísseis!"
 israel_economy.107.d: "Israel propõe um esforço conjunto de pesquisa em mísseis e sistemas de defesa. Devemos concordar?"
 israel_economy.107.a: "Claro!"
 israel_economy.107.b: "Não, obrigado."
 israel_economy.108.t: "O Irã concorda!"
 israel_economy.108.d: "O Irã concordou em investir em nosso esforço conjunto de pesquisa, agora nós também devemos fazê-lo."
 israel_economy.108.a: "Ótimo!"
 israel_economy.109.t: "O Irã não concordou!"
 israel_economy.109.d: "O Irã não concordou em participar do nosso projeto."
 israel_economy.109.a: "Affe."
 ISR_isr_iran_int: "Rede de Inteligência Irã-Israel"
 ISR_isr_iran_int_2: "Centro de Reconhecimento Irã-Israel"
 israel_economy.110.t: "Israel propõe compartilhamento de inteligência!"
 israel_economy.110.d: "O governo israelense propõe um esforço conjunto de compartilhamento de inteligência e coordenação de espionagem. Devemos concordar?"
 israel_economy.110.a: "Claro!"
 israel_economy.110.b: "Desculpe, não."
 israel_economy.111.t: "O Irã concorda!"
 israel_economy.111.d: "O Irã aceitou nossa oferta e continuaremos a cooperar."
 israel_economy.111.a: "Ótimo!"
 israel_economy.112.t: "O Irã discorda!"
 israel_economy.112.d: "Eles não querem cooperar no setor de compartilhamento de inteligência."
 israel_economy.112.a: "Affe."
 israel_economy.113.t: "Israel propõe a criação de um Centro de Reconhecimento!"
 israel_economy.113.d: "O governo israelense propõe a criação de um centro Irã-Israel de reconhecimento e coordenação. Devemos concordar?"
 israel_economy.113.a: "Claro!"
 israel_economy.113.b: "Desculpe, não."
 israel_economy.114.t: "O Irã concorda!"
 israel_economy.114.d: "O Irã aceitou nossa oferta e continuaremos a cooperar."
 israel_economy.114.a: "Ótimo!"
 israel_economy.115.t: "O Irã discorda!"
 israel_economy.115.d: "Eles não querem cooperar."
 israel_economy.115.a: "Affe."
 israel_economy.116.t: "Israel exige reparações!"
 israel_economy.116.d: "Recentemente, o governo israelense nos procurou para pedir a assinatura do Tratado de Susa. É um tratado que nos obriga a pagar a Israel pelos israelenses iranianos que fugiram durante a revolução no século XX. Devemos concordar?"
 israel_economy.116.a: "É nosso dever!"
 israel_economy.116.b: "Isso é demais..."
 israel_economy.117.t: "O Irã concorda!"
 israel_economy.117.d: "O Irã concordou em pagar as reparações!"
 israel_economy.117.a: "Ótimo!"
 israel_economy.118.t: "O Irã não concordou!"
 israel_economy.118.d: "Eles não nos pagarão nenhuma reparação por atos que o governo deles não cometeu."
 israel_economy.118.a: "Argh."
 israel_economy.119.t: "Conferência de Taba"
 israel_economy.119.d: "Israel propôs um novo formato de segurança mútua e normalização das relações no qual o Egito deixaria de apoiar ativamente a Palestina e um pacto secreto de não agressão seria assinado entre Israel e Egito."
 israel_economy.119.a: "Claro."
 israel_economy.119.b: "Não."
 israel_economy.120.t: "O Egito concordou"
 israel_economy.120.d: "O Egito adotou nosso plano para lidar com a situação na região. Um pacto secreto de não agressão entre Egito e Israel também foi assinado."
 israel_economy.120.a: "Ótimo!"
 israel_economy.121.t: "O Egito rejeitou nossa oferta"
 israel_economy.121.d: "O Egito se recusou a aceitar nosso plano para lidar com a situação em nossa região. "
 israel_economy.121.a: "Triste."
 israel_economy.122.t: "Israel pede a devolução de agente capturado"
 israel_economy.122.d: "Israel está pedindo a extradição de seu agente capturado como gesto de boa vontade."
 israel_economy.122.a: "Certo."
 israel_economy.122.b: "Não."
 israel_economy.123.t: "O Egito concordou"
 israel_economy.123.d: "Após muita negociação, o governo egípcio concordou em extraditar nosso agente capturado para nós."
 israel_economy.123.a: "Ótimo!"
 israel_economy.124.t: "O Egito se recusou a extraditar nosso agente"
 israel_economy.124.d: "O governo egípcio se recusou a extraditar nosso agente. Ele permanece sob custódia em uma prisão egípcia."
 israel_economy.124.a: "Triste."
 ISR_kill_scientist_idea: "Cientistas Nucleares Assassinados!"
 ISR_REV_IRQ_TT: "§YIniciaremos uma revolução no Iraque para derrubar seu governo§!"
 ISR_REV_SYR_TT: "§YIniciaremos uma revolução na Síria para derrubar seu governo§!"
 ISR_REV_JOR_TT: "§YIniciaremos uma revolução na Jordânia para derrubar seu governo§!"
 israel_economy.125.t: "Israel quer entrar na CENTO!"
 israel_economy.125.d: "Israel expressou recentemente o desejo de entrar na CENTO. Devemos concordar?"
 israel_economy.125.a: "Claro!"
 israel_economy.125.b: "Desculpe, não."
 israel_economy.126.t: "O Irã concorda!"
 israel_economy.126.d: "Todos os papéis foram assinados."
 israel_economy.126.a: "Ótimo!"
 israel_economy.127.t: "O Irã não concordou!"
 israel_economy.127.d: "O Irã não concordou que entremos em sua facção."
 israel_economy.127.a: "Affe."
 periphery_pactt: "Pacto da Periferia"
 ISR_trade_agr_seks: "§OAtiva o Acordo de Livre Comércio.§!"
 israel_economy.128.t: "Israel oferece reparar as relações!"
 israel_economy.128.d: "Considerando nossos inimigos mútuos no Oriente Médio, Israel nos oferece o início de um novo plano de cooperação contra nossos adversários e potencialmente em muitas de suas esferas. Devemos concordar?"
 israel_economy.128.a: "Concordamos. Que ninguém saiba disto."
 israel_economy.128.b: "Nunca trairemos nossa causa!"
 israel_economy.129.t: "A Arábia Saudita concorda!"
 israel_economy.129.d: "A Arábia Saudita concordou em cooperar conosco contra nossos inimigos mútuos e em auxiliar em vários projetos conjuntos futuros."
 israel_economy.129.a: "Muito bom..."
 israel_economy.130.t: "A Arábia Saudita rejeitou nossa oferta!"
 israel_economy.130.d: "Eles dizem que não conseguiremos desviá-los do caminho justo de nos resistir."
 israel_economy.130.a: "Sei, claro."
 israel_economy.131.t: "Israel pede desculpas por ações passadas!"
 israel_economy.131.d: "Israel pede desculpas por atividades anteriores de espionagem e promete não fazer tais coisas no futuro. Eles nos oferecem um presente por nosso perdão e vontade de cooperar..."
 israel_economy.131.a: "Estão perdoados."
 israel_economy.131.b: "Que insolência!"
 israel_economy.132.t: "[From.GetName] aceita"
 israel_economy.132.d: "Nosso pedido de desculpas foi aceito e nossas ações passadas foram perdoadas."
 israel_economy.132.a: "Ótimo!"
 israel_economy.133.t: "[From.GetName] rejeita"
 israel_economy.133.d: "Eles consideraram nosso gesto um ato insolente e amoral de ambições expansionistas egoístas."
 israel_economy.133.a: "Sei, claro."
 easten_andinf_tt: "Vamos §Galiviar§! as §Ytensões§! e obter §O2% de influência§! sobre §Yeles§!."
 israel_economy.134.t: "Primeiro-Ministro israelense visita Omã!"
 israel_economy.134.d: "Hoje, o Primeiro-Ministro [ISR.GetLeader] pousou secretamente em Omã e viajou com o chefe do Mossad, Yossi Cohen, e o Conselheiro de Segurança Nacional, Meir Ben-Shabbat, ao Palácio Al-Husun, na cidade sulista de Salalah, para se encontrar com o Sultão [OMA.GetLeader]. O Sultão levou o Primeiro-Ministro em um tour pelo palácio, mostrando muitos artefatos antigos e mapas do Sultanato. Lá, discutiram formas de avançar o processo de paz no Oriente Médio, bem como diversas questões de interesse comum para alcançar paz e estabilidade na região. Este é o primeiro encontro do Sultão omani com um Primeiro-Ministro israelense desde a visita de Shimon Peres em 1996 ao país árabe, que - apesar de nunca ter reconhecido Israel - manteve laços diplomáticos estreitos com o país. Os dois também concordaram em vários acordos comerciais e na criação de um escritório comercial israelense não oficial em Mascate. O Primeiro-Ministro israelense, [ISR.GetLeader], visitou nosso país para nos oferecer um novo acordo de cooperação nas esferas diplomática e militar. Devemos aceitar a proposta?"
 israel_economy.134.a: "Claro!"
 israel_economy.134.b: "Desculpe, não."
 israel_economy.135.t: "Omã concorda!"
 israel_economy.135.d: "Após a visita de [ISR.GetLeader] a Omã, eles concordaram em cooperar com nosso país nas esferas diplomática e militar."
 israel_economy.135.a: "Ótimo!"
 israel_economy.136.t: "Omã recusa!"
 israel_economy.136.d: "Eles não querem cooperar com o nosso país."
 israel_economy.136.a: "Por quê?! Que insulto!"
 ISR_gulf_mossad_protecc: "Proteção do Mossad"
 ISR_gulf_mossad_protecc_desc: "Considerando a crescente ameaça do Irã, nosso país concordou em abrigar agentes do Mossad israelense para conter a influência iraniana."
 canc_if_isrwar_tt: "Esta §YIdeia§! será §Rcancelada§! se entrarmos em §Yguerra§! com [ISR.GetNameWithFlag]"
 israel_economy.137.t: "Israel oferece parceria secreta."
 israel_economy.137.d: "Recentemente, Israel nos enviou uma mensagem secreta, oferecendo-nos boa proteção contra a ameaça iraniana. Eles oferecem abrigar seus agentes do Mossad em nosso país, para que possam combater plenamente a influência iraniana."
 israel_economy.137.a: "Com certeza!"
 israel_economy.137.b: "Hã? Não."
 israel_economy.138.t: "[FROM.GetNameWithFlag] concorda!"
 israel_economy.138.d: "[FROM.GetNameWithFlag] concordou em abrigar nossos agentes em seu país."
