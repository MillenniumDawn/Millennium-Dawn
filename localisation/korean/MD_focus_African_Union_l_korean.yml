 african_union_available_mandate_tt: "§Y아프리카 연합 권한 위임§!을 보유하고 있음"
 african_union_peacekeeping_effort: "아프리카 연합: 평화 유지 노력"
 african_union_peacekeeping_effort_desc: "아프리카 연합 회원국들은 아프리카에서 벌어지고 있는 여러 무력 분쟁을 종식시키는 데 집중하기로 합의했습니다."
 AFRICAN_UNION_shared_focus_create_african_space_agency_desc: "지금까지 위성 분야에서 아프리카 국가들의 협력은 제한적이었습니다. 가장 유명한 것은 45개국으로 구성된 지역 아프리카 위성 통신 기구(RASCOM)이지만, 한두 개의 위성을 발사하는 데 그쳤습니다. 아프리카 위성망 구축을 위한 공동 합작 사업을 만들어야 합니다."
 AU_branch_reserved_tt: "다른 §Y회원국§!이 이 분기를 선점하지 않았습니다. 다른 회원국은 이 중점 중 하나를 시작하는 즉시 §Y권한 위임§!을 소모하며, 해당 중점이 완료되거나 포기되면 선점이 해제됩니다."
 AfricanUnion_news.1.a: "아프리카 통합의 새로운 여명"