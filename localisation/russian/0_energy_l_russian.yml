l_russian:
 decision_category_energy: "Категория решений в сфере энергетики"
 decision_category_energy_desc: "\n£MAIN_desctext_energy \n\n\n\n§Y[ROOT.GetFlag]Каждая страна§! должна поддерживать определённый уровень энергетического обеспечения, чтобы её функции и службы не давали сбоя. Если мы §Rне сможем§! удовлетворять постоянно растущие §Yэнергетические потребности§! нашей экономики, мы можем столкнуться с серьёзными §Rпоследствиями§! и §Rполным экономическим коллапсом§!."
 HEADER_TEXT_TITLE: "§YЭНЕРГЕТИКА§!"
 energy_dynamic_modifier: "Национальная электрическая сеть"
 energy_dynamic_modifier_TT: "Этот дух отражает суммарный расход топлива тепловыми электростанциями и прямой расход топлива неэлектрическими потребителями, а также возможные штрафы, если генерация не покрывает энергопотребление. Здесь же отображается энергия, которой с нами делятся или которую нам передают другие страны по соглашениям о распределении энергонагрузки."
 no_fuel_penalties_modifier: "Штрафы за нехватку топлива"
 no_fuel_penalties_modifier_TT: "Этот дух отражает последствия, которые возникнут, если страна израсходует все свои запасы топлива, не оставляя ничего для потребления населением."
 hydroelectric_infrastructure_in_state: "Гидроэнергетическая инфраструктура"
 hydroelectric_infrastructure_in_state_TT: "Гидроэнергетическая инфраструктура включает в себя все гидроэлектрические плотины, хранилища и прочее, связанное с гидроэнергетикой. Модификатор региона включает общее производство энергии, а также объём хранилищ. Он вносит свой вклад в общее производство энергии и, таким образом, помогает обеспечить потребление энергии промышленностью и населением."
 geothermal_infrastructure_in_state: "Геотермальная инфраструктура"
 geothermal_infrastructure_in_state_TT: "Геотермальная инфраструктура включает в себя все геотермальные электростанции и аналогичную инфраструктуру. Она вносит свой вклад в общее производство энергии и, таким образом, обеспечивает потребление энергии промышленностью и населением."
 renewable_capacity_factor_dyn_mod: "§Y[?THIS.modifier@state_renewable_capacity_factor_modifier]§!"
 renewable_capacity_factor_dyn_mod_TT: "§Y[THIS.GetName]§! — это §Yзона возобновляемой энергетики§!, обладающая благоприятными условиями для производства возобновляемой энергии, либо за счёт стабильных сильных ветров, либо за счёт более высокого, чем в среднем, количества солнечного света в течение года.\n\nЧем выше коэффициент возобновляемости, тем больше энергии вырабатывают парки возобновляемой энергетики в этом районе каждую неделю для владельца региона."
 heavy_power_restrictions_spirit: "Жёсткие ограничения энергопотребления"
 some_power_restrictions_spirit: "Умеренные ограничения энергопотребления"
 some_additional_consumption_spirit: "Умеренное стимулирование энергопотребления"
 heavy_additional_consumption_spirit: "Сильное стимулирование энергопотребления"
 build_battery_park_effect_TT: "Изменяет количество §Yаккумуляторных парков§! на [?temp_change|0+] в [ROOT.GetNameWithFlag] (сейчас: [?number_of_battery_parks|Y0])"
 has_nuclear_reactors_tt: "[THIS.GetNameWithFlag]: есть хотя бы 1 §Y$nuclear_reactor$§! (сейчас: [?nuclear_reactors|Y0])\n"
 has_enrichment_facilities_tt: "[THIS.GetNameWithFlag]: есть хотя бы 1 §Y$enrichment_facility$§!\n"
 has_reactor_material_stockpile_tt: "[THIS.GetNameWithFlag]: не менее 5000 кг §Yреакторного материала§! (сейчас: [?THIS.var_reactor_material_stockpile|Y0])\n"
 change_reactor_grade_material_effect_tt: "Изменяет запас §Yреакторного материала§! на [?change_resource|0+] в [THIS.GetNameWithFlag] (сейчас: [?THIS.var_reactor_material_stockpile|Y0])\n"
 recently_bought_fuel_tt: "Недавно закупали топливо на рынке. (осталось дней: [?recently_bought_fuel:days_left|0Y])"
 early_renewables: "Базовые солнечные панели"
 early_renewables_desc: "Разработка базовых солнечных панелей позволит стране использовать солнечный свет и преобразовывать его в электричество, что станет первым шагом на пути к внедрению возобновляемых источников энергии."
 renewables: "Совершенствование ветряных турбин"
 renewables_desc: "Технологические улучшения в аэродинамике и материалах позволяют создавать более эффективные ветряные турбины, увеличивая их возможности по производству электроэнергии."
 improved_renewables: "Высокоэффективные фотоэлементы"
 improved_renewables_desc: "Значительные достижения в технологии фотоэлектрических элементов приводят к более высоким показателям преобразования солнечной энергии, что делает солнечные панели более производительными и экономически эффективными."
 advanced_renewables: "Композитные лопасти ветряных турбин"
 advanced_renewables_desc: "Используя лёгкие, но прочные композитные материалы, лопасти ветряных турбин становятся более эффективными и долговечными, улавливая больше энергии ветра."
 modern_renewables: "Тонкоплёночные солнечные панели"
 modern_renewables_desc: "Появление тонкоплёночных солнечных панелей произвело революцию в солнечной промышленности, предлагая гибкость и адаптируемость при установке, одновременно повышая общую эффективность."
 improved_modern_renewables: "Морские ветряные электростанции"
 improved_modern_renewables_desc: "Страны начинают строить ветряные электростанции в открытом море, получая выгоду от более сильных и постоянных ветров, открывая путь для крупномасштабных ветроэнергетических проектов."
 advanced_modern_renewables: "Двусторонние солнечные панели"
 advanced_modern_renewables_desc: "Представлены двусторонние солнечные панели, способные улавливать солнечный свет с обеих сторон, повышая генерацию энергии за счёт использования отражённого солнечного света от окружающих поверхностей."
 fuel_efficiency: "Передовые технологии сжигания"
 fuel_efficiency_desc: "Инновации в области техники сжигания позволяют нам извлекать больше энергии из ископаемого топлива при одновременном сокращении потребления, создавая прецедент для будущего производства энергии."
 fuel_efficiency2: "Парогазовый цикл с внутрицикловой газификацией"
 fuel_efficiency2_desc: "Преобразуя уголь и другие углеродосодержащие топлива в газ, мы используем потенциал более чистого и эффективного производства энергии, что является шагом вперёд в возможностях наших электростанций, работающих на ископаемых топливах."
 fuel_efficiency3: "Высокоэффективные технологии с низким уровнем выбросов"
 fuel_efficiency3_desc: "Внедрение технологий HELE позволяет нашим электростанциям, работающим на ископаемом топливе, повысить эффективность и снизить выбросы, объединяя две цели: производство энергии и защиту окружающей среды."
 fuel_efficiency4: "Интеграция улавливания и хранения углерода (CCS)"
 fuel_efficiency4_desc: "Поскольку глобальная обеспокоенность по поводу выбросов углерода растёт, внедрение технологий CCS в наши электростанции позволяет нам улавливать и хранить выбросы CO2, делая энергетику на ископаемом топливе одновременно мощной и экологичной."
 fuel_efficiency5: "Оптимизация и мониторинг на основе искусственного интеллекта"
 fuel_efficiency5_desc: "Используя возможности искусственного интеллекта, наши электростанции теперь динамически корректируют работу в режиме реального времени, обеспечивая оптимальный расход топлива и производительность, одновременно сводя к минимуму воздействие на окружающую среду."
 fuel_efficiency6: "Тепловые электростанции с почти нулевыми выбросами"
 fuel_efficiency6_desc: "Благодаря передовым технологиям и методам наши электростанции, работающие на ископаемом топливе, теперь значительно сокращают выбросы, являясь образцом эффективного производства энергии."
 energy_efficiency: "Основы термодинамики"
 energy_efficiency_desc: "Применение базовых принципов термодинамики позволяет сразу сократить потери энергии на заводах и в офисных зданиях."
 energy_efficiency2: "Теплоизоляция"
 energy_efficiency2_desc: "Большая часть национальных энергозатрат приходится на отопление и охлаждение зданий. Использование тепловой изоляции может сократить эти расходы, высвобождая энергию для других нужд."
 energy_efficiency3: "Интеграция систем управления"
 energy_efficiency3_desc: "Внедрение простых алгоритмов в термостаты и системы управления позволит ещё больше повысить эффективность и сэкономить дополнительную энергию."
 energy_efficiency4: "Изоляция высокой плотности"
 energy_efficiency4_desc: "Современные материалы позволяют повысить плотность изоляции и добиться ещё большей экономии энергии."
 energy_efficiency5: "Электростанции с ТЭГ"
 energy_efficiency5_desc: "Многие современные электростанции по-прежнему используют тепло для превращения воды в пар. Хотя с годами этот метод стал более эффективным, он по-прежнему производит большое количество отходящего тепла. Термоэлектрические генераторы можно гибко использовать для извлечения дополнительного напряжения из отходящего тепла. Это выражается в снижении общих затрат топлива заводами."
 energy_efficiency6: "Нановолоконная изоляция"
 energy_efficiency6_desc: "Последние разработки в области технологии нановолокон позволяют использовать одни из самых передовых и плотных изоляционных материалов на сегодняшний день. Это серьёзно повысит энергоэффективность."
 energy_efficiency7: "Крупномасштабная интеграция ТЭГ"
 energy_efficiency7_desc: "Помимо простой изоляции заводов и офисов, термоэлектрические генераторы можно использовать для рекуперации энергии, которая в противном случае была бы потеряна даже при самой современной тепловой изоляции."
 energy_efficiency8: "Микрогенераторы"
 energy_efficiency8_desc: "Оснащение выхлопных систем небольшими турбогенераторами и прокладка термоэлектрической проводки через окна выводят рекуперацию энергии на новый уровень."
 TOTAL_GENERATION_ENERGY: "§HОбщая генерация§!: [?energy_sum|G2] ГВт"
 ENERGY_GENERATION_TOTAL_TT: "Ниже приведена полная разбивка источников вырабатываемой энергии. §YТепловые электростанции§! простаивают, если вы производите больше энергии, чем потребляете. Простаивающие §Yтепловые электростанции§! не расходуют §Yтопливо§!.\n----------\nГенерация §Yтепловых электростанций§!: [?fossil_pp_energy_generation|G2] ГВт\nРезерв §Yпростаивающих тепловых электростанций§!: [?free_fossil_powerplants_power|Y2] ГВт\nГенерация §Yгидроэлектростанций§!: [?hydroelectric_energy_generation|G2] ГВт\nГенерация §Yгеотермальных электростанций§!: [?geothermal_energy_generation|G2] ГВт\nГенерация §Yатомных электростанций§!: [?nuclear_energy_generation|G2] ГВт\nГенерация §Yсолнечных и ветряных электростанций§!: [?renewable_energy_display_var|G2] ГВт\nГенерация §Yдругих источников§!: [?other_energy_generation|G2] ГВт\n§YОтбор из хранилища энергии§!: [?energy_withdrawal_from_storage|G2] ГВт\n\n----------\n§YПотенциальная генерация солнечной и ветряной энергии§!: от [?minimum_renewable_energy_var|+2] ГВт до [?maximum_renewable_energy_var|+2] ГВт\nГенерация за счёт §Yраспределения энергонагрузки§!: [?energy_load_sharing_gain_var|G2]"
 TOTAL_CONSUMPTION_ENERGY: "§HОбщее потребление§!: [?energy_consumption|R2] ГВт"
 TOTAL_CONSUMPTION_ENERGY_TT: "Следующие значения представляют собой полную разбивку источников потребления энергии.\n----------\n§YПотребление энергии§! населением: [?population_energy_use_display_var|R2] ГВт\nСезонный спрос населения: [?energy_seasonal_population_demand_factor|%0R]\n§YОбщее потребление энергии§! зданиями: [?energy_use_buildings_total_display_var|R2] ГВт\n§YПрочее потребление энергии§!: [?other_energy_use_display_var|R2] ГВт\n----------\n§YПотребление энергии зданиями по типам:§!\n§YПотребление энергии на гражданских заводах§!: [?energy_use_civs_total_display_var|R2] ГВт\n§YПотребление энергии в офисах§!: [?energy_use_offices_total_display_var|R2] ГВт\n§YПотребление энергии на военных заводах§!: [?energy_use_mils_total_display_var|R2] ГВт\n§YПотребление энергии на верфях§!: [?energy_use_dockyards_total_display_var|R2] ГВт\n§YПотребление энергии районами коммерческого сельского хозяйства§!: [?energy_use_agriculture_district_total_display_var|R2] ГВт\n§YПотребление энергии заводами микрочипов§!: [?energy_use_microchip_plant_total_display_var|R2] ГВт\n§YПотребление энергии заводами композитных материалов§!: [?energy_use_composite_plant_total_display_var|R2] ГВт\n§YПотребление энергии синтетическими НПЗ§!: [?energy_use_synthetic_refinery_total_display_var|R2] ГВт\n\n"
 MISSING_FULFILLMENT_VALUE: "§HДефицит энергии§!: [?unfulfilled_energy_demand_var|%+]"
 MISSING_FULFILLMENT_VALUE_TT: "Это значение показывает процент требуемого §Yспроса на энергию§!, который в данный момент не удовлетворён.\n\n§YВлияние неудовлетворённого спроса на энергию§!\n£construction_speed_texticon Скорость строительства: [?unfulfilled_energy_demand_dynmod_var|+%]\n£research_speed_texticon Скорость исследований: [?unfulfilled_energy_demand_dynmod_var|+%]\n£tax_gain_multiplier_modifier_texticon Множитель §Yналоговых поступлений§!: [?unfulfilled_energy_demand_dynmod_var_3|+%]\n£factory_output_texticon Выпуск заводов: [?unfulfilled_energy_demand_dynmod_var|+%]\n£dockyard_output_texticon Выпуск верфей: [?unfulfilled_energy_demand_dynmod_var|+%]\n£stability_texticon Стабильность: [?unfulfilled_energy_demand_dynmod_var_2|+%]"
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES: "Суточный расход §Yтоплива§! §YТЭС§!: [?fossil_pp_fuel_display|0R]"
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES_TT: "Эта величина представляет собой общее количество топлива, ежедневно потребляемого всеми нашими активными §Yтепловыми электростанциями§!. §YТепловые электростанции§! начинают простаивать, когда общая мощность генерации превышает общее потребление.\n\n§YМодификаторы§!:\nВлияние законов, национальных духов и технологий на потребление топлива §Yтепловыми электростанциями§!: [?modifier@fossil_pp_fuel_consumption_modifier|-%]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES: "Суточный расход §Yтоплива§! §Yнаселением§!: [?non_electric_fuel_display|0R]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES_TT: "Это значение представляет собой общий объём топлива, ежедневно потребляемого всем нашим §Yнаселением§!.\n\n§YМодификаторы§!:\nВлияние законов, национальных духов и технологий на §Yпотребление неэлектрического топлива§!: [?modifier@non_electric_fuel_consumption_modifier|-%]\nСезонный спрос населения: [?energy_seasonal_population_demand_factor|%0R]\n\nСпрос населения на электроэнергию и неэлектрическое топливо увеличивается на 20% в период с декабря по февраль и с июня по август. Сезонный спрос учитывается после других модификаторов и обновляется при еженедельном расчёте энергобаланса."
 TOTAL_STORED_ENERGY: "Запасённая энергия: [?stored_energy|3Y] ГВт·ч из [?max_stored_energy|3Y] ГВт·ч"
 TOTAL_STORED_ENERGY_TT: "Показывает, сколько избыточной энергии у нас запасено сейчас и сколько можно запасти максимум. Увеличить §Yмаксимальный запас§! можно, построив дополнительные §Yаккумуляторные парки§!."
 OPEN_ENERGY_BUTTON: "Открыть §Yэкран энергетики§!"
 OPEN_ENERGY_BUTTON_TT: "Открывает §Yэкран энергетики§!, где можно посмотреть потребление энергии, генерацию энергии и степень обеспечения энергетических потребностей вашей страны."
 heavy_power_restrictions_button_tt: "§YЖёсткие ограничения энергопотребления§!\nНаше потребление энергии опережает её производство. Возможным временным решением является срочное ограничение электрического потребления среди населения, пока мы не сможем начать строить дополнительные электростанции, возобновляемую энергетику и другие меры для смягчения этого растущего кризиса. Введение строгих ограничений для населения приведёт к значительному снижению экономического роста, потребления энергии и политического влияния."
 heavy_power_restrictions_button_delayed_tt: "§YЭффекты:§!\n[!heavy_power_restrictions_button_click]"
 some_power_restrictions_button_tt: "§YУмеренные ограничения энергопотребления§!\nНаше потребление энергии опережает её производство. Возможным временным решением является срочное ограничение электрического потребления среди населения, пока мы не сможем начать строить дополнительные электростанции, возобновляемую энергетику и другие меры для смягчения этого растущего кризиса. Введение некоторых ограничений для населения приведёт к небольшому снижению экономического роста, потребления энергии и политического влияния."
 some_power_restrictions_button_delayed_tt: "§YЭффекты:§!\n[!some_power_restrictions_button_click]"
 no_power_restrictions_button_tt: "§YБез ограничений энергопотребления§!\nСтатус-кво — как правило, самый привычный сценарий для экономики нашей страны и политической безопасности нашей партии. Мы не ограничиваем народное потребление и не стимулируем дополнительное потребление."
 no_power_restrictions_button_delayed_tt: "§YЭффекты:§!\n[!no_power_rules_button_click]"
 some_additional_consumption_button_tt: "§YУмеренное стимулирование энергопотребления§!\nВ настоящее время мы перепроизводим энергию для нашей великой нации. Нам следует поощрять некоторое дополнительное потребление, чтобы воспользоваться нашим избыточным производством. Поощрение дополнительного потребления даст нам небольшой бонус к скорости строительства и политической власти, одновременно увеличивая потребление энергии нашим населением на небольшую величину."
 some_additional_consumption_button_delayed_tt: "§YЭффекты:§!\n[!some_additional_consumption_button_click]"
 heavy_additional_consumption_button_tt: "§YСильное стимулирование энергопотребления§!\nВ настоящее время мы перепроизводим энергию для нашей великой страны. Мы должны стимулировать дополнительное потребление, чтобы использовать преимущества избыточного производства. Поощрение большого дополнительного потребления даст нам большой бонус к скорости строительства и политической власти, при этом потребление энергии нашим народом резко возрастёт."
 heavy_additional_consumption_button_delayed_tt: "§YЭффекты:§!\n[!heavy_additional_consumption_button_click]"
 build_battery_park_button_tt: "§YПостроить аккумуляторный парк§!\n§YАккумуляторный парк§! — крупное дорогостоящее сооружение, каждое из которых способно хранить §Y100 ГВт·ч§! избыточной энергии. Такие объекты полезны, чтобы запасать энергию на периоды, когда генерации не хватает для покрытия потребления, особенно при использовании возобновляемых источников с их нестабильной выработкой."
 build_battery_park_button_delayed_tt: "§YПредпосылки:§!\n[!build_battery_park_button_click_enabled]\n§YЭффекты:§!\n[!build_battery_park_button_click]\nМы можем поставить в очередь группу из §Yтрёх аккумуляторных парков§! сразу, нажав £key_shift + £click_left §YShift + ЛКМ§!.\n§YПредпосылки:§!\n[!build_battery_park_button_shift_click_enabled]\n§YЭффекты:§!\n[!build_battery_park_button_shift_click]"
 buy_fuel_for_money_button_tt: "§YКупить топливо на рынке§!\nНекоторые продавцы по всему миру предлагают топливо за деньги. Покупка топлива может помочь в случае необходимости поддержать работу наших тепловых электростанций и вооружённых сил."
 buy_fuel_for_money_button_delayed_tt: "§YПредпосылки:§!\n[!buy_fuel_for_money_button_click_enabled]\n§YЭффекты:§!\n[!buy_fuel_for_money_button_click]\n£key_shift + £click_left §YShift + ЛКМ§!: настроить автоматическую покупку §Yтоплива§! при его нехватке"
 NET_ENERGY_BALANCE: "§HЭнергобаланс§!: [energy_total_net_energy_balance]"
 NET_ENERGY_BALANCE_TT: "§HЭнергобаланс§! — это §Hобщая генерация энергии§!, делённая на §Hобщее потребление энергии§!; §Hэнергобаланс§! выражается в процентах."
 TOTAL_ENERGY_MISC_VALUE_HEADER: "Расход топлива"
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION: "§GБаланс§! §Yядерного топлива§! за неделю: [?net_nuclear_fuel_display|0+] кг"
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION_TT: "Это значение показывает недельный баланс §Yреакторного материала§! для наших §Yядерных реакторов§!: разницу между еженедельным производством и потреблением §Yреакторного материала§!.\n\n§YЗапас реакторного материала§!: £GFX_nuclear_material_texticon §G[?var_reactor_material_stockpile]§! кг\n§YПроизводство реакторного материала в неделю§!: [?total_nuclear_reactor_fuel_production|G2] кг\n§YПотребление реакторного материала в неделю§!: [?nuclear_fuel_consumption|-2] кг\n\n§YМодификаторы§!:\nВлияние законов, национальных духов и технологий на расход §Yтоплива ядерных реакторов§!: [?modifier@nuclear_fuel_consumption_modifier|-%]"
 total_ffp_amount_tt: "Общее количество §Yтепловых электростанций§! в нашей стране."
 total_ffp_amount_tt_delayed: "§YТепловые электростанции§! — общее название всех тепловых источников энергии на ископаемом топливе: угле, природном газе, нефти и т. д. §YТепловые электростанции§! простаивают, если генерация энергии превышает потребление.\n\nОбеспечивает регион:\nБазовое количество требуемых работников: §Y7,5 тыс.§!\nБазовый ВВП на единицу §Yтепловой электростанции§!: $§Y1,7 млрд§!\nБазовая генерация энергии: §G+2§! ГВт\n\nТекущая §Yгенерация на одну станцию§!: [?fossil_pp_energy_per_plant_display|+2] ГВт"
 total_nuclear_reactor_amount_tt: "Общее количество §Yядерных реакторов§! в нашей стране."
 total_nuclear_reactor_amount_tt_delayed: "Это здание преобразует ядерную энергию в электрическую, расходуя в процессе умеренно обогащённый уран.\n\nОбеспечивает регион:\nБазовое количество требуемых работников: §Y115 тыс.§!\nБазовый ВВП на единицу §Yядерного реактора§!: $§Y4 млрд§!\nБазовая генерация энергии: §G+4§! ГВт\n\nТекущая §Yгенерация энергии на реактор§!: [?nuclear_energy_per_reactor_display|+2] ГВт"
 total_renewable_energy_amount_tt: "Общее количество объектов §Yинфраструктуры возобновляемых источников энергии§! в нашей стране."
 total_renewable_energy_amount_tt_delayed: "§YИнфраструктура возобновляемых источников энергии§! — это общее название для всех источников возобновляемой энергии. К ним относятся, но не ограничиваются: солнечные электростанции, ветряные турбины, биотопливные заводы, углежогные предприятия, биотопливные электростанции и другие. Таким образом, она использует возобновляемые источники и производит топливо из этих источников.\n\nОбеспечивает регион:\nБазовое количество необходимых работников: §Y22,5 тыс.§!\nБазовый ВВП на единицу §Yинфраструктуры ВИЭ§!: $§Y2 млрд§!\nБазовая генерация энергии: §G+0,5§! ГВт\n"
 total_fuel_silo_amount_tt: "Общее количество §Yхранилищ стратегических ресурсов§! в нашей стране."
 total_fuel_silo_amount_tt_delayed: "§YХранилище стратегических ресурсов§! — это совокупность складов, сухих хранилищ и других хранилищ §Yтоплива§!. Это здание предоставляет вашей стране больше места для хранения §Hтоплива§!."
 ENERGY_GENERATION_TOTAL_DELAYED_TT: "§YМодификаторы§!:\nВлияние законов, национальных духов и технологий на §Yвсё производство энергии§!: [?modifier@energy_gain_multiplier|+%]\nВлияние законов, национальных духов и технологий на §Yпроизводство возобновляемой энергии§!: [?modifier@renewable_energy_gain_multiplier|%+]\nВлияние законов, национальных духов и технологий на §Yгенерацию тепловых электростанций§!: [?modifier@fossil_pp_energy_generation_modifier|%+]\nВлияние законов, национальных духов и технологий на §Yпроизводство ядерной энергии§!: [?modifier@nuclear_energy_generation_modifier|%+]\n\n"
 TOTAL_CONSUMPTION_ENERGY_DELAYED_TT: "§YМодификаторы§!:\nВлияние законов, национальных духов и технологий на §Yобщее потребление энергии§!: [?modifier@energy_use_multiplier|-%]\nВлияние законов, национальных духов и технологий на §Yпотребление энергии населением§!: [?modifier@pop_energy_use_multiplier|-%]\nВлияние законов, национальных духов и технологий на §Yпотребление энергии гражданскими заводами§!: [?modifier@energy_use_modifier_civs|-%]\nВлияние законов, национальных духов и технологий на §Yпотребление энергии офисными секторами§!: [?modifier@energy_use_modifier_offices|-%]\nВлияние законов, национальных духов и технологий на §Yпотребление энергии военными заводами§!: [?modifier@energy_use_modifier_mils|-%]\nВлияние законов, национальных духов и технологий на §Yпотребление энергии верфями§!: [?modifier@energy_use_modifier_dockyards|-%]\nВлияние законов, национальных духов и технологий на §Yпотребление энергии районами коммерческого сельского хозяйства§!: [?modifier@energy_use_modifier_agriculture_district|-%]\nВлияние законов, национальных духов и технологий на §Yпотребление энергии заводами микрочипов§!: [?modifier@energy_use_modifier_microchip_plant|-%]\nВлияние законов, национальных духов и технологий на §Yпотребление энергии заводами композитных материалов§!: [?modifier@energy_use_modifier_composite_plant|-%]\nВлияние законов, национальных духов и технологий на §Yпотребление энергии синтетическими НПЗ§!: [?modifier@energy_use_modifier_synthetic_refinery|-%]\n\n----------\nОбщее потребление энергии за счёт §Yраспределения энергетической нагрузки§!: [?energy_load_sharing_use_var|R2]"
 heavy_power_restrictions_spirit_desc: "Правительство ввело ряд жёстких ограничений на электроэнергию для своего населения. Оно резко сократило потребление энергии и электроэнергии, но ценой налоговых поступлений и других экономических потерь."
 some_power_restrictions_spirit_desc: "Правительство ввело ряд небольших ограничений на электроэнергию для своего населения. Оно немного сократило потребление энергии и электроэнергии, но ценой налоговых поступлений и других экономических потерь."
 some_additional_consumption_spirit_desc: "Правительство начало серию небольших целевых субсидий на потребление электроэнергии населением, чтобы облегчить часть финансового бремени. Это немного оживило потребительские расходы, но энергопотребление резко выросло."
 heavy_additional_consumption_spirit_desc: "Правительство начало серию крупномасштабных целевых субсидий на потребление электроэнергии населением, чтобы облегчить часть финансового бремени. Это стимулировало большой объём дополнительных расходов, но энергопотребление резко выросло."
 total_ffp_amount_number: "[?number_of_fossil_pps]"
 total_nuclear_reactor_amount: "[?nuclear_reactors]"
 enable_nuclear_reactor_fuel_production_tt: "§YВключить обогащение урана§!\nМы можем производить собственное ядерное топливо для реакторов, если у нас есть необходимые объекты. Процесс дорогой и длительный, но это важно для обеспечения непрерывной работы ядерных реакторов нашей страны."
 enable_nuclear_reactor_fuel_production_delayed_tt: "§YПредпосылки:§!\n[!enable_nuclear_reactor_fuel_production_click_enabled]\n§YЭффекты:§!\n[!enable_nuclear_reactor_fuel_production_click]"
