l_korean:
 CHI_SOV_treaty_good_neighbourliness: "중러 선린우호조약"
 CHI_SOV_treaty_good_neighbourliness_desc: "2001년에 체결된 선린우호협력조약은 현대 중러 관계의 법적 토대를 마련했습니다. 상호 존중, 내정 불간섭, 주요 국제 문제에 대한 협의라는 조약 조항을 실천하려는 정치적 의지가 되살아나면서, 어느 나라도 홀로 추진할 수 없었던 한 세대 분량의 양자 사업으로 가는 문이 열립니다."
 CHI_SOV_sco_framework: "SCO 확대 구상"
 CHI_SOV_sco_framework_desc: "상하이 협력 기구는 2001년 중국과 러시아가 상하이 5국의 후신으로 창설했습니다. 인도, 파키스탄, 이란, 그리고 궁극적으로 중앙아시아 국가들을 끌어들이는 공동 확대 구상을 조율하면 SCO는 지역 안보 포럼에서 서방 다자 기구에 맞서는 진정한 균형추로 탈바꿈합니다."
 CHI_SOV_turn_to_east: "러시아의 동방 전환"
 CHI_SOV_turn_to_east_desc: "2014년 이후 서방의 제재로 가속화된 동방 전환 정책은 러시아의 무역, 투자, 외교적 관심을 중국과 아시아·태평양으로 돌려놓습니다. 이러한 방향 전환을 장기 경제 협정으로 공식화하면, 서방 시장이 더 이상 러시아 번영의 주된 기준점이 아님을 모스크바의 관료 사회와 재계에 알리는 신호가 됩니다."
 CHI_SOV_bri_russia_corridor: "일대일로 러시아 회랑"
 CHI_SOV_bri_russia_corridor_desc: "중국-유럽 화물 철도망은 이미 육상 물동량 대부분을 시베리아 횡단 철도를 통해 러시아 영토로 운반하고 있습니다. 이 회랑을 일대일로 구상의 틀에 통합하고, 러시아 철도 개량에 대한 중국의 투자와 자바이칼스크-만저우리 국경 통과 지점의 통관 절차 간소화를 병행하면 두 경제는 공동의 물류 기반시설에 묶이게 됩니다."
 CHI_SOV_brics_coordination: "BRICS+ 조정 블록"
 CHI_SOV_brics_coordination_desc: "BRICS(브라질, 러시아, 인도, 중국, 남아프리카 공화국)는 골드만삭스가 만든 약어에서 출발해 자체 신개발은행과 외환 보유 협정을 갖춘 실제 다자 포럼으로 발전했습니다. 중국과 러시아가 이집트, 에티오피아, 이란, 사우디아라비아를 받아들이며 조율된 BRICS+ 확대를 주도하면, IMF와 세계은행을 글로벌 사우스의 기본 기구 자리에서 위협할 수 있는 병행 경제 구조가 만들어집니다."
 CHI_SOV_sco_antiterror: "SCO 지역 반테러 센터"
 CHI_SOV_sco_antiterror_desc: "지역 반테러 기구(RATS)는 타슈켄트에 본부를 둔 SCO의 전담 대테러 기구입니다. 정보 공유, 신속 대응 조율, 합동 훈련을 포함한 RATS 역량을 중러가 공동으로 확대하면 유라시아 안보 협력의 범위가 중앙아시아와 코카서스로 넓어져, 지하디스트 조직망과 외부 강대국의 은밀한 영향력 공작에 모두 대응할 수 있습니다."
 CHI_SOV_no_limits_partnership: "무제한 전략적 동반자 관계"
 CHI_SOV_no_limits_partnership_desc: "2022년 2월 블라디미르 푸틴의 베이징 방문 중 발표된 공동 성명은 한계 없는 우정과 금지 구역 없는 협력을 선언했습니다. 이 선언은 상호 방위 조약에는 이르지 않으면서도 양국 관계를 어떤 공식 동맹의 수준보다 위에 놓았으며, 베이징과 모스크바가 자신들의 전략적 연대를 국제 질서의 영구적인 특징으로 여긴다는 신호를 워싱턴과 브뤼셀에 보냈습니다."
 CHI_SOV_yuan_ruble_settlement: "위안-루블 결제 체계"
 CHI_SOV_yuan_ruble_settlement_desc: "중국과 러시아는 달러 표시 무역에서 벗어나는 전환을 가속화해 왔으며, 2022년 제재로 러시아의 SWIFT 접근이 차단된 뒤 러시아 수출 결제에서 위안화의 비중이 급격히 상승했습니다. 중국 인민은행과 러시아 중앙은행 사이에 공식적인 양자 청산 체계를 수립하면 양국 경제를 2차 제재의 압박으로부터 보호하는 병행 금융 기반시설이 만들어집니다."
 CHI_SOV_agricultural_corridor: "연해주 농산물 수출 회랑"
 CHI_SOV_agricultural_corridor_desc: "러시아의 극동과 시베리아 지역에는 세계 최대 규모의 경작 가능 토지가 있으나, 인구 감소와 시장 접근성 부족으로 상당 부분이 활용되지 못하고 있습니다. 연해주 농산물 회랑은 러시아의 곡물, 대두, 유지 작물을 전용 국경 통과 지점을 거쳐 중국 동북부 지방으로 보내, 하얼빈과 선양에 국제 상품 시장과 무관한 안정적인 식량 공급망을 제공합니다."
 CHI_SOV_russian_far_east_zone: "러시아 극동 자유항"
 CHI_SOV_russian_far_east_zone_desc: "2015년 러시아가 부여한 블라디보스토크의 자유항 지위는 개발이 덜 된 러시아 극동에 중국과 일본의 투자를 끌어들이기 위해 특별히 고안되었습니다. 블라디보스토크 자유경제구역의 항만 시설, 냉동 창고, 경공업에 투자하는 중국 국영 기업들은 러시아의 동방 전환을 고착시키는 상업적 닻을 만들고, 중국에는 자국 국경 밖의 태평양 물류 거점을 제공합니다."
 CHI_SOV_zarubino_port: "자루비노 태평양 항만 협정"
 CHI_SOV_zarubino_port_desc: "러시아, 중국, 북한이 만나는 접경 지점 인근 러시아 태평양 연안의 자루비노 벌크 화물 터미널은 1990년대부터 공동 개발 사업으로 제안되어 왔습니다. 자루비노의 곡물 처리 및 컨테이너 능력을 확충하는 중국의 투자는 지린성 수출업자들에게 태평양 항로로 가는 가장 짧은 경로를 제공하는 동시에, 모스크바가 혼자서는 감당할 수 없는 기반시설을 위한 중국 자본을 러시아에 제공합니다."
 CHI_SOV_trans_siberian_freight: "시베리아 횡단 화물 확충"
 CHI_SOV_trans_siberian_freight_desc: "시베리아 횡단 철도 회랑은 해상 운송의 30일 대비 12일에서 15일의 운송 시간으로 매년 중국과 유럽 사이에서 수만 건의 컨테이너 화물 운송을 처리합니다. 선로 전철화, 병목 구간의 복선화, 통합 디지털 통관에 대한 중러 공동 투자는 운송 시간을 10일 이내로 단축하고 처리량을 세 배로 늘려, 시베리아 횡단 철도를 고부가가치 화물을 위한 수에즈 운하의 진정한 대안으로 바꿔 놓습니다."
 CHI_SOV_timber_mineral_trade: "시베리아 목재 및 광물 수출"
 CHI_SOV_timber_mineral_trade_desc: "시베리아에는 세계 최대의 아한대 목재 매장량과 구리, 니켈, 금, 희토류 원소의 막대한 매장지가 있습니다. 중국의 가공 기업들은 시베리아 목재 구매에서 지배적 위치를 확립했으며, 노릴스크 니켈과 폴류스 골드는 생산량 대부분을 중국 정련소로 수출합니다. 이러한 원자재 흐름을 장기 인수 계약으로 공식화하면 세계 자원 공급망에서 양국의 입지가 굳어집니다."
 CHI_SOV_arctic_lng: "야말 LNG 인수 계약"
 CHI_SOV_arctic_lng_desc: "노바텍이 개발한 러시아 야말반도의 야말 LNG 사업에는 CNPC와 실크로드 기금이 주요 주주로 참여하고 있습니다. 쇄빙 등급으로 특수 제작된 중국 LNG 운반선들이 사베타 항에서 연중 화물을 싣습니다. CNOOC 및 CNPC와의 장기 인수 계약은 중국의 LNG 공급을 확보하는 동시에, 서방 제재로 차단된 중국의 자금을 노바텍에 제공합니다."
 CHI_SOV_power_of_siberia_2: "시베리아의 힘 2 가스관"
 CHI_SOV_power_of_siberia_2_desc: "시베리아의 힘 2는 유럽에 공급하는 것과 같은 서시베리아 가스전에서 나온 가스를 몽골을 거쳐 중국 북부로 운반하도록 제안된 사업입니다. 연간 500억 세제곱미터의 용량으로 중국은 압도적인 차이로 러시아 최대의 단일 가스 고객이 되며, 가스프롬에는 그렇지 않았다면 발이 묶였을 가스전에 대한 지속적인 투자를 정당화할 핵심 계약이 생깁니다."
 CHI_SOV_tianwan_nuclear: "톈완 원자력 발전소 확장"
 CHI_SOV_tianwan_nuclear_desc: "1997년부터 체결된 일련의 계약에 따라 로사톰이 건설한 롄윈강의 톈완 원자력 발전소는 러시아와 중국 기술 협력 사상 최대의 사업입니다. 2021년에 계약된 7호기와 8호기는 이 협력을 2030년대까지 연장합니다. 중국에 건설되는 로사톰의 각 원자로는 원자로 설계 지식, 연료 공급 계약, 유지 보수 관계를 이전하여 두 원자력 산업을 수십 년간 결속시킵니다."
 CHI_SOV_huawei_russia: "화웨이 러시아 5G 구축"
 CHI_SOV_huawei_russia_desc: "화웨이는 2019~2020년에 MTS, 메가폰, 로스텔레콤을 비롯한 러시아 통신 사업자들과 5G 계약을 체결했습니다. 서방의 5G 공급업체들이 조달 선호와 이후의 제재로 러시아에서 배제되면서 러시아 5G 구축에서 화웨이의 지배력은 사실상 도전받지 않습니다. 러시아 통신 기간망에 내장된 중국 5G 기반시설은 핵심 국가 기반시설 수준에서 양국 관계를 심화시키는 기술적 의존성을 만들어 냅니다."
 CHI_SOV_beidou_glonass: "베이더우-글로나스 항법 협정"
 CHI_SOV_beidou_glonass_desc: "중국의 베이더우와 러시아의 글로나스는 미국 GPS 망으로부터 독립된 유일한 두 위성 항법 시스템입니다. 2015년 두 시스템의 운영 당국 사이에 체결된 상호 운용 협정으로 민간 및 군용 수신기가 두 위성군의 신호를 동시에 사용할 수 있게 되어 위치 정확도가 향상되었으며, 무엇보다 미국의 교란이나 궤도 간섭으로 약화될 수 없는 이중화된 항법 기반시설을 양국에 제공합니다."
 CHI_SOV_polar_silk_road: "극지 실크로드 구상"
 CHI_SOV_polar_silk_road_desc: "2018년 발표된 중국의 북극 전략 문서는 북극해 항로를 극지 실크로드로 지정했으며, 이는 중앙아시아를 거치는 육로와 인도양을 거치는 해로에 이은 일대일로의 세 번째 회랑입니다. 북극 해운 기반시설, 중국 조선소의 쇄빙선 건조, 북극해 항로를 따라 놓인 항만 시설에 대한 중국의 투자는 계절적인 러시아 항로를 중러 합작 기업이 통제하는 연중 국제 항로로 탈바꿈시킵니다."
 CHI_SOV_northern_sea_route: "북극해 항로 상업화"
 CHI_SOV_northern_sea_route_desc: "베링 해협에서 카라해까지 러시아 북극 해안선을 따라 이어지는 북극해 항로는 상하이와 함부르크 사이의 거리를 수에즈 운하 항로에 비해 약 30% 단축합니다. 북극 해빙이 녹으면서 항행 가능 시기도 늘어나고 있습니다. 쇄빙선 호위 능력, 항로를 따라 설치되는 긴급 구조 기반시설, 쇄빙 등급 전용 컨테이너선에 대한 중러 공동 투자는 북극해 항로를 틈새 계절 선택지에서 고부가가치 화물을 위한 실현 가능한 연중 대안으로 바꿔 놓습니다."
 CHI_SOV_rosatom_export: "로사톰 수출 패키지"
 CHI_SOV_rosatom_export_desc: "로사톰은 해외에서 건설 중이거나 계약된 원자로가 30기가 넘는, 국제 원자로 수주 기준 세계 최대의 원자력 기업입니다. VVER 원자로 설계, 연료 공급망, 장기 정비 계약은 러시아가 경제적, 기술적 영향력을 투사하는 주된 수단입니다. VVER-1200 원자로, 혼합 산화물 연료 공급, 중국 원자력 기술자를 위한 공동 훈련을 포함한 중국 구매자 전용 수출 패키지는 러시아 원자력 기술을 한 세대 동안 중국의 민간 에너지 기반시설에 심어 놓습니다."
 CHI_SOV_space_station: "국제 달 연구 기지"
 CHI_SOV_space_station_desc: "2021년 중국 CNSA와 러시아 로스코스모스가 공동 발표한 국제 달 연구 기지는 소련 우주 계획 이래 가장 야심 찬 양자 간 과학 사업입니다. ILRS는 달 남극 인근에 상주 로봇 연구 시설, 궁극적으로는 유인 연구 시설을 세우는 것을 구상하며, NASA의 아르테미스 계획에 대한 대안으로 명확히 설계되어 제3국의 참여에도 열려 있습니다. 이 공동 개발은 두 우주 계획을 다가올 심우주 탐사 세대를 위한 공통 구조로 결속시킵니다."
 CHI_SOV_peace_mission: "평화 임무 합동 훈련"
 CHI_SOV_peace_mission_desc: "평화 임무는 2005년부터 매년 회원국을 돌아가며 개최되는 SCO의 합동 군사 훈련 시리즈입니다. 중국군과 러시아군은 매번 참가했으며, 훈련은 대테러 시나리오에서 기갑 부대, 근접 항공 지원, 군단급 지휘 조율을 포함한 제병 협동 기동으로 확대되었습니다. 이 훈련 시리즈는 실제 연합 작전을 제외하면 인민해방군과 러시아군 사이의 상호 운용성을 발전시키는 주된 무대가 되었습니다."
 CHI_SOV_advanced_arms_sales: "Su-35 및 S-400 수출 패키지"
 CHI_SOV_advanced_arms_sales_desc: "2015년 수호이 Su-35 다목적 전투기 24대와 2018년 S-400 트리움프 지대공 미사일 1개 대대 분량을 중국이 도입한 것은 1990년대 Su-27 계약 이래 러시아의 대중국 무기 수출 중 가장 중요한 사례였습니다. 이 판매는 중국 자체 산업이 아직 따라잡지 못한 4세대 플러스 항공기와 장거리 통합 방공망에 대한 운용 경험을 이전했으며, 로스오보론엑스포르트에는 서방 시장이 닫혀 가던 시기에 고급 고객을 제공했습니다."
 CHI_SOV_pacific_fleet_coord: "태평양 함대 조율 협정"
 CHI_SOV_pacific_fleet_coord_desc: "중국 해군과 러시아 태평양 함대는 2012년부터 동해, 동중국해, 서태평양에서 조율된 해군 훈련을 실시해 왔습니다. 일본과 한반도에 인접한 해역에서의 합동 순찰은 어느 해군도 단독으로 유지할 수 없는 연합 전개를 보여 주며, 자국 앞바다에서 두 강대국 중 어느 쪽과 대립하더라도 치러야 할 대가에 대해 미 태평양 사령부에 의도적인 신호를 보냅니다."
 CHI_SOV_defense_industrial: "방위 산업 기반 통합"
 CHI_SOV_defense_industrial_desc: "중국 국영 방위 기업들은 러시아 플랫폼을 단순히 수입하는 단계를 넘어 면허 생산과 역설계로 나아갔습니다. 중국 자체 산업이 가장 뒤처져 있는 분야인 항공기 엔진 개발에서의 합작 사업이 전략적으로 가장 중요합니다. WS-15와 WS-20 엔진을 위한 러시아 터보팬 기술에 대한 중국의 접근은 독자 개발의 몇 분의 일 비용으로 서방 공군과의 격차를 좁히며, 러시아 기업들은 중국의 제조 규모를 얻게 됩니다."
 CHI_SOV_strategic_bomber_patrol: "합동 전략 폭격기 순찰"
 CHI_SOV_strategic_bomber_patrol_desc: "2019년과 2023년에 러시아의 Tu-95MS 베어 폭격기와 중국의 H-6K 전략 폭격기가 동해와 동중국해 상공에서 조율된 순찰 비행을 하여 일본과 대한민국의 방공 긴급 발진을 유발했습니다. 이 순찰은 엄밀한 군사적 의미의 합동 작전은 아니지만, 전략 공군력의 동기화된 운용을 보여 주며 공동의 적대 세력에 대한 압박을 조율하겠다는 양국의 의지를 알리는 신호입니다. 정례 합동 순찰 회랑은 승무원 수준의 친숙도와 공통 절차 기준을 심화시킵니다."
 CHI_SOV_vostok_exercises: "보스토크 전략 훈련"
 CHI_SOV_vostok_exercises_desc: "보스토크는 전통적으로 러시아 극동에서의 대규모 재래식 분쟁에 초점을 맞춘 러시아의 전략급 군사 훈련 시리즈입니다. 중국군은 보스토크-2018에 참가했고, 우크라이나 전쟁 개전 몇 달 뒤에 열린 보스토크-2022에도 다시 참가했습니다. 중국의 참여는 이 훈련을 자국 예행연습에서 양자 제병 협동 시연으로 격상시키며, 인민해방군 지상 및 항공 부대가 러시아 사단 지휘 체계에 통합됩니다."
 CHI_SOV_military_space: "합동 군사 우주 계획"
 CHI_SOV_military_space_desc: "중국과 러시아는 모두 대위성 무기, 위성 항법 교란, 전자 정찰 위성, 우주 기반 조기 경보 체계 등 전담 군사 우주 능력을 개발해 왔습니다. 위성 궤도 슬롯, 데이터 공유 규약, 공동 우주 상황 인식을 조율하는 합동 계획은 양국에 미국과 동맹국의 우주 작전에 대해 어느 쪽도 단독으로 얻을 수 없는 더 종합적인 그림을 제공하는 동시에, 양국 궤도 자산 간의 충돌이나 확전 위험을 줄여 줍니다."
 SOV_chi_rare_earth_supply: "중국산 희토류 부품"
 SOV_chi_rare_earth_supply_desc: "중국은 정밀 유도 체계, 야시 광학 장비, 고성능 전기 모터에 필수적인 네오디뮴, 란타넘, 디스프로슘 화합물을 포함해 세계 희토류 정제 능력의 80% 이상을 통제합니다. 방위 산업 협력 틀에 따라 공급 관계를 공식화하면 우랄바곤자보드는 중국이 가공한 희토류 투입물을 보장받아 부품 비용을 줄이고 T-90과 아르마타 생산 라인 전반의 품질 일관성을 높일 수 있습니다."
 CHI_sov_flanker_expertise: "플랭커 세대 전문성"
 CHI_sov_flanker_expertise_desc: "J-11, J-15, J-16 파생형을 아우르는 Su-27 플랭커 계열에 대한 선양 항공기 제조사의 면허 생산은 이 회사를 러시아 밖에서 러시아 계통 전투기를 가장 많이 제작해 본 세계 최고의 제작사로 만들었습니다. Su-35 수출 계약은 AL-41F1S 엔진, 이르비스-E 레이더 구조, 그리고 선양의 차세대 사업에 반영되는 공기역학적 개선에 대한 접근권을 제공하여 이 관계를 심화시킵니다. 선양 생산 라인에서 나오는 항공기는 수호이 설계국과의 협력에서 곧바로 비롯된 측정 가능한 성능 향상을 지니고 있습니다."
 CHI_SOV_military_tech_idea: "러시아 방위 기술 이전"
 CHI_SOV_shared_modifier: "중러 전략적 연대"
 CHI_SOV_shared_modifier_desc: "중러 협력의 깊이에 따라 중국의 경제와 군사를 조정하는, 베이징과 모스크바 사이에 맞물린 일련의 양자 간 약속입니다. 더 긴밀한 관계는 정치적 재량, 농업 및 자원 생산량, 해군 투사 범위, 민간 산업 역량을 확대하는 한편, 동반자 관계가 깊어지면 무역 호감도가 오르고 국경 보안이 강화됩니다. 이 변동치는 두 강대국 사이에 비준되는 모든 주요 협정에 따라 확대됩니다."
 CHI_SOV_bri_idea: "일대일로 투자"
 CHI_SOV_bri_influence_idea: "일대일로 영향력"