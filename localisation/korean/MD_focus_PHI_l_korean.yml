 PHI_islamism_dynamic_modifier: "급진 이슬람주의의 부상"
 PHI_islamism_dynamic_modifier_tooltip: "이슬람주의는 수 세기 동안 필리핀의 일부였습니다. 최근 이것이 바뀌기 시작했으며 국가 남부는 극단적인 급진화를 겪고 있습니다."
 PHI_npa_insurgency_dynamic_modifier: "장기 인민 전쟁"
 PHI_npa_insurgency_dynamic_modifier_tooltip: "필리핀 공산당은 1969년 이래 신인민군을 통해 농촌 게릴라전을 벌여 왔습니다. 그 간부들은 마을에 세금을 걷고, 순찰대를 매복 공격하며, 루손, 사마르, 민다나오 동부 전역에서 지방 정부와 다투고 있습니다."
 PHI_milf_decisions_category: "모로 분쟁"
 PHI_milf_decisions_category_desc: "모로 분쟁은 민다나오 지방에서 벌어진 일련의 무력 충돌을 가리키는 말입니다. 모로 분쟁은 1935년 필리핀 자치령 시기에 시행된 이주 정책의 결과로 시작되었습니다. 코레히도르에서 무슬림 군사 훈련생 11명이 살해되면서 폭발하였습니다. 모로 이슬람 민족 전선은 직후인 1969년에 결성되어 그 이후 정부군과 공개적인 충돌 상태에 있습니다.\n £generic_anarchist_communism_small §RMILF의 세력:§! [?PHI.PHI_strength_of_milf|20]%"
 PHI_anti_muslim_propaganda: "반무슬림 선전"
 PHI_anti_muslim_propaganda_desc: "민다나오에서 활동하는 급진 이슬람 반군 단체의 영향력에 대항하기 위해 국영 매체와 대국민 메시지를 동원합니다."
 PHI_crush_the_moro_insurgency: "모로 반란 분쇄"
 PHI_crush_the_moro_insurgency_desc: "모로 이슬람 해방 전선이 흩어진 잔당으로 축소된 지금, 군대는 민다나오 작전의 종결을 선언할 수 있습니다. 남부 지방의 지휘권은 민간 정부로 돌아가며, 반란은 협상이 아닌 무력으로 끝나게 됩니다."
 PHI_sign_the_bangsamoro_agreement: "방사모로 협정 서명"
 PHI_sign_the_bangsamoro_agreement_desc: "쿠알라룸푸르에서 말레이시아의 중재로 열린 회담이 이 전선을 협상 테이블로 끌어냈습니다. 포괄적 합의는 전투원을 무장 해제시키고, 민다나오 무슬림 자치구를 실질적인 재정 및 입법 권한을 가진 방사모로 체제로 대체하며, 마닐라가 전환 비용을 지원하도록 약속하게 됩니다."
 PHI_communist_insurgency_category: "신인민군 반란"
 PHI_communist_insurgency_category_desc: "신인민군 반란은 세계에서 가장 오래된 공산 반란입니다. 신인민군은 1969년부터 필리핀 중앙 정부에 맞서 끊임없이 싸워 왔습니다.\n\n이제 이 반란을 분쇄하기 위해 노력할 때입니다.\n £generic_Communist_State_small §R신인민군의 세력:§! [?PHI.PHI_strength_of_npa|20]%"
 PHI_sustained_military_offensive: "지속적인 군사 공세"
 PHI_sustained_military_offensive_desc: "시에라 마드레, 사마르, 다바오 배후지의 게릴라 전선을 소탕하기 위해 육군과 경찰군 부대를 투입합니다. 소탕전은 어떤 다른 방법보다 빠르게 신인민군을 약화시키지만, 농촌에서의 장기 작전은 농촌 주민들 사이에서 정부의 지지를 잃게 합니다."
 PHI_peace_and_development_teams: "평화 개발팀"
 PHI_peace_and_development_teams_desc: "도로 및 학교 건설과 지방 행정 업무를 결합하여, 게릴라의 영향 아래 있는 바랑가이에 민군 합동 팀을 배치합니다. 반란군의 모병 기반을 없애는 일은 소탕전보다 더디고 비용도 상당히 들지만 안정도는 소모되지 않습니다."
 PHI_amnesty_for_returning_cadres: "귀순 간부 사면"
 PHI_amnesty_for_returning_cadres_desc: "무기를 내려놓는 전투원에게 법적 면책, 현금 지원, 생계 지원을 제공합니다. 대규모 이탈은 게릴라 전선을 속 빈 강정으로 만들지만, 반군을 사면하는 것은 장교단과 반란 피해자들 사이에서 정부의 입지를 떨어뜨립니다."
 PHI_defeat_the_new_peoples_army: "신인민군 격파"
 PHI_defeat_the_new_peoples_army_desc: "게릴라 전선이 무너지고 중앙위원회는 해외로 뿔뿔이 흩어졌습니다. 반란이 군사적으로 패배했음을 선언함으로써 세계에서 가장 오래 지속된 공산 반란이 막을 내립니다."
 PHI_conclude_the_oslo_talks: "오슬로 회담 타결"
 PHI_conclude_the_oslo_talks_desc: "노르웨이 중재자들은 수년간 민족민주전선과의 대화 채널을 열어 두었습니다. 최종 합의는 정치적 사면과 토지 개혁 공약을 신인민군의 영구적인 동원 해제와 맞바꾸게 됩니다."
 PHI_anti_dynasty_law: "반세습 정치법"
 PHI_anti_dynasty_law_desc: "1987년 헌법 제2조 제26항은 정치 세습을 금지하지만, 의회는 이를 시행하기 위한 법률을 한 번도 통과시키지 않았고 입법부를 지배하는 가문들도 그럴 이유가 없습니다. 법안을 밀어붙이면 현직자의 친족이 그 직위를 승계하는 것이 금지되어, 지방 가문들이 국가 정치를 장악한 고리를 끊고 모든 정당의 지도부를 유력 가문 밖의 후보에게 개방하게 됩니다."
 PHI_corruption_battle_mechanic_category: "부패와의 싸움"
 PHI_corruption_battle_mechanic_category_desc: "수십 년간의 후원 정치, 취약한 제도, 뿌리 깊은 이해관계로 인해 부패는 정부의 거의 모든 단계에 깊이 박혀 있습니다. 이를 뿌리 뽑으려면 관료제, 군, 민간 부문 전반에 걸친 지속적이고 표적화된 조사가 필요합니다. 개혁이 자리를 잡고 제도가 강화됨에 따라 향후의 조사는 더 쉽고 효과적이 될 것입니다.\n\n현재 부패 수준:  [Root.GetPHI_corruption_tier_number]\n현재 부패 강도: [?PHI_corruption_strength|Y0]"
 PHI_change_the_strength_of_corruption_tt: "§Y부패 강도§!가 [?temp_change|0+] 변합니다 (현재: [?PHI.PHI_corruption_strength|Y0])\n"
 PHI_corp_nothing_tt: "§R75%§!: 아무 일도 일어나지 않음 / 관료적 실패.\n부패 진행도 변화 없음."
 PHI_corp_minor_tt: "§Y65%§!: 소규모 부패 조직 적발.\n부패 진행도 §G-5§!."
 PHI_corp_major_tt: "§Y35%§!: 대규모 기업 스캔들.\n부패 진행도 §G-10§!. 안정도 §R-2%§!."
 PHI_corp_huge_tt: "§G10%§!: 고액 부패 적발.\n부패 진행도 §G-20§!. 180일 동안 산업 §R-5%§!."
 PHI_contracts_nothing_tt: "§R70%§!: 증거를 찾지 못함.\n변화 없음."
 PHI_contracts_minor_tt: "§Y55%§!: 경미한 관리 부실 폭로.\n부패 진행도 §G-5§!."
 PHI_contracts_major_tt: "§Y30%§!: 대규모 조달 부패.\n부패 진행도 §G-10§!. 건설 속도 §R-3%§!."
 PHI_contracts_huge_tt: "§G15%§!: 전국적 횡령 폭로.\n부패 진행도 §G-20§!. 안정도 §R-2%§!."
 PHI_tax_nothing_tt: "§R80%§!: 결정적인 조사 결과 없음.\n변화 없음."
 PHI_tax_minor_tt: "§Y50%§!: 경미한 뇌물 수수 적발.\n부패 진행도 §G-5§!."
 PHI_tax_major_tt: "§Y25%§!: 관세 사기 조직 폭로.\n부패 진행도 §G-10§!. 2개월 동안 세수 §R-10%§!."
 PHI_tax_huge_tt: "§G10%§!: 고위 관료 연루.\n부패 진행도 §G-25§!. 6개월 동안 외국인 투자 §R-15%§!."
 PHI_military_nothing_tt: "§R80%§!: 증거 없음 또는 은폐됨.\n변화 없음."
 PHI_military_minor_tt: "§Y60%§!: 하급 장교 적발.\n부패 진행도 §G-5§!."
 PHI_military_major_tt: "§Y25%§!: 참모부 연루.\n부패 진행도 §G-10§!. 90일 동안 육군 조직도 §R-3%§!."
 PHI_military_huge_tt: "§G10%§!: 군 고위 인사 폭로.\n부패 진행도 §G-20§!. 안정도 §R-5%§!. 육군 경험치 §R-5§!."
 PHI_purge_nothing_tt: "§R70%§!: 의미 있는 결과 없음.\n변화 없음."
 PHI_purge_minor_tt: "§Y60%§!: 소규모 부정 부패 조직 적발.\n부패 진행도 §G-5§!."
 PHI_purge_major_tt: "§Y35%§!: 대규모 지역 범죄 조직 폭로.\n부패 진행도 §G-10§!. 저항 목표 §R+1%§!."
 PHI_purge_huge_tt: "§G10%§!: 정치 세습 가문 몰락.\n부패 진행도 §G-20§!. 저항 목표 §R+2%§!. 90일 후 안정도 §G+3%§!."
 PHI_offshore_nothing_tt: "§R85%§!: 흔적을 찾지 못함.\n변화 없음."
 PHI_offshore_minor_tt: "§Y50%§!: 소규모 계좌 추적.\n부패 진행도 §G-5§!."
 PHI_offshore_major_tt: "§Y20%§!: 대규모 자금 세탁 조직 적발.\n부패 진행도 §G-25§!."
 PHI_offshore_huge_tt: "§G5%§!: 해외 재산 적발.\n부패 진행도 §G-40§!. 6개월 동안 외국인 투자 비용 §G-10%§!."
 PHI_investigate_corporations: "기업 조사"
 PHI_investigate_corporations_desc: "필리핀의 주요 대기업들은 오랫동안 규제 기관 및 입법자들과 유착 관계를 누려 왔습니다. 기업 회계, 세무 신고, 정부 계약에 대한 집중 조사는 뇌물 수수와 횡령 수법을 폭로할 수 있으나, 결과는 현재 부패가 얼마나 뿌리 깊은지에 달려 있습니다.\n\n현재 부패 수준: [ROOT.GetPHI_corruption_tier_number]"
 PHI_audit_government_contracts: "정부 계약 감사"
 PHI_audit_government_contracts_desc: "공공 기반시설과 조달 계약은 리베이트와 부풀려진 청구서가 공공 사업의 자금을 빼돌리는 악명 높은 부정부패의 온상입니다. 최근 계약에 대한 철저한 감사는 사기 거래를 밝혀낼 수 있으나, 숨길 것이 있는 관리들은 조사에 저항할 것입니다.\n\n현재 부패 수준: [ROOT.GetPHI_corruption_tier_number]"
 PHI_inspect_tax_bureau: "국세청 감찰"
 PHI_inspect_tax_bureau_desc: "국세청은 뇌물 수수, 뒷거래 합의, 기록 위조 의혹에 시달려 왔습니다. 내부 감찰은 상실한 세수를 되찾고 부패한 직원들을 뿌리 뽑을 수 있으나, 국세청 자체의 부패가 최악의 범법자들을 보호할 수도 있습니다.\n\n현재 부패 수준: [ROOT.GetPHI_corruption_tier_number]"
 PHI_investigate_the_military: "군 조사"
 PHI_investigate_the_military_desc: "조달 스캔들과 유령 병사들은 오랫동안 필리핀 군의 예산을 고갈시켜 왔습니다. 군 재정을 조사하면 장교단과 마찰을 빚을 위험이 있으나, 성공적인 조사는 도난당한 자금을 되찾고 병영 내 규율을 회복시킬 수 있습니다.\n\n현재 부패 수준: [ROOT.GetPHI_corruption_tier_number]"
 PHI_purge_local_officials: "지방 관리 숙청"
 PHI_purge_local_officials_desc: "주 청사부터 바랑가이 사무소에 이르는 지방 정부 단위는 공직을 가업처럼 여기는 정치 세습 가문이 장악하는 경우가 많습니다. 부패한 지방 관리에 대한 표적 숙청은 그들의 권력 장악을 깨뜨릴 수 있으나, 뿌리 깊은 세습 가문은 가진 모든 것을 동원해 저항할 것입니다.\n\n현재 부패 수준: [ROOT.GetPHI_corruption_tier_number]"
 PHI_trace_offshore_accounts: "해외 계좌 추적"
 PHI_trace_offshore_accounts_desc: "수십 년간의 부정부패로 얻은 부정 축재는 흔히 해외 계좌와 페이퍼 컴퍼니로 흘러들어갔습니다. 이러한 계좌를 추적하는 일은 더디고, 비용이 많이 들며, 외교적으로도 민감하지만, 성공적인 추적은 막대한 금액을 되찾고 이를 만든 조직망에 심각한 타격을 줄 수 있습니다.\n\n현재 부패 수준: [ROOT.GetPHI_corruption_tier_number]"
 PHI_police_investiture: "경찰 투자"
 PHI_police_investiture_desc: "정부 자금을 필리핀 국가경찰 강화에 돌려, 경찰 지출 증가를 감수하는 대신 수사관의 효율을 개선합니다."
 PHI_police_investiture_active_tt: "경찰 자금 증액이 활성화되었습니다. 모든 부패 방지 조사의 성공 확률이 향상됩니다.\n경찰 비용 §R+20%§!. 최대 지휘력 §R-15§!."
 PHI_corporate_scandal_industry: "기업 스캔들"
 PHI_corporate_scandal_industry_desc: "고액 기업 부패의 폭로는 우리 산업 부문에 대한 투자자 신뢰를 흔들었습니다."
 PHI_procurement_scandal_construction: "조달 스캔들"
 PHI_procurement_scandal_construction_desc: "정부 계약에서 드러난 대규모 부패로 인해 계약이 검토되는 동안 건설이 지연되었습니다."
 PHI_customs_fraud_tax: "관세 사기 폭로"
 PHI_customs_fraud_tax_desc: "관세 사기 조직으로 인해 국세청이 재편되는 동안 징세에 차질이 생겼습니다."
 PHI_tax_scandal_investment: "국세청 스캔들"
 PHI_tax_scandal_investment_desc: "국세청 최고위층의 부패가 외국인 투자자들을 쫓아냈습니다."
 PHI_military_scandal_org: "군 부패 스캔들"
 PHI_military_scandal_org_desc: "참모부의 부패가 지휘 체계와 부대 결속력을 해쳤습니다."
 PHI_offshore_fortune_investment: "회수한 해외 자금"
 PHI_offshore_fortune_investment_desc: "압수한 해외 자산이 재투자되어 새로운 외국인 투자 경로가 열렸습니다."
 PHI_locked_corruption: "뿌리 깊은 부패"
 PHI_locked_corruption_desc: "§R부패 법안을 수동으로 변경할 수 없음§!\n수년간의 후원 정치, 관료제의 비효율, 뿌리 깊은 특수 이해관계로 인해 부패는 필리핀 국가의 근간에 얽혀 있습니다. 공공 자원은 일상적으로 유용되고, 책임성은 여전히 취약하며, 유력 인사들은 현상 유지로부터 계속 이익을 얻고 있습니다. 의미 있는 개혁은 포고령만으로는 이룰 수 없습니다. 부패와의 싸움에는 단호한 조사, 더 강한 제도, 그리고 체제로부터 이익을 얻는 자들에게 도전할 의지가 있는 정부가 필요합니다. "
 PHI_corruption_eradicated: "청렴한 통치"
 PHI_corruption_eradicated_desc: "수년간의 지속적인 개혁을 통해 필리핀은 역사상 드문 일을 이루었습니다. 진정한 청렴성을 가지고 기능하는 정부입니다. 제도는 더 강해졌고, 대중의 신뢰는 회복되었으며, 부정부패의 악순환은 적어도 지금은 끊어졌습니다. 이 기준을 유지하려면 지속적인 경계가 필요합니다."
 PHI_corruption_event.1.t: "부패 단계 감소"
 PHI_corruption_event.1.d: "우리의 끈질긴 노력이 결실을 맺었습니다. 부패 조직망이 해체되었고 새로운 수준의 책임성이 확립되었습니다."
 PHI_corruption_event.1.a: "마침내 진전이 있다."
 PHI_corruption_event.2.t: "부패 악화"
 PHI_corruption_event.2.d: "우리의 노력에도 불구하고 부패 세력이 장악력을 공고히 하였습니다. 뇌물과 부정부패가 국가 제도 깊숙이 더욱 퍼졌습니다."
 PHI_corruption_event.2.a: "더 잘해야 한다."
 PHI_corruption_event.10.t: "조사: 은폐 의혹"
 PHI_corruption_event.10.d: "우리 조사관들은 변호사, 봉인된 문서, 갑작스러운 기억 상실로 이루어진 벽에 부딪혔습니다. 어떤 유력 인사가 흔적을 지우고 있으나 우리는 이를 증명할 수 없습니다."
 PHI_corruption_event.10.a: "계속 주시한다."
 PHI_corruption_event.11.t: "조사: 부패 조직 적발"
 PHI_corruption_event.11.d: "민간 부문 내에서 활동하던 중간급 부패 조직이 폭로되었습니다. 여러 임원이 기소되었고 횡령한 자금의 일부가 회수되었습니다."
 PHI_corruption_event.11.a: "기소한다."
 PHI_corruption_event.12.t: "조사: 기업 스캔들 적발"
 PHI_corruption_event.12.d: "대규모 기업 스캔들이 재계를 뒤흔들었습니다. 임원들이 국가 관리들과 결탁해 공적 자금을 빼돌렸습니다. 그 여파로 투자자 신뢰가 흔들렸습니다."
 PHI_corruption_event.12.a: "그들의 자산을 압수한다."
 PHI_corruption_event.13.t: "조사: 고액 부패 폭로"
 PHI_corruption_event.13.d: "놀라운 발견입니다. 민간 부문 최상층에까지 이르는 고액 기업 부패의 연결망이 완전히 폭로되었습니다. 수십억 규모의 자산이 압수되고 있습니다."
 PHI_corruption_event.13.a: "이는 잊히지 않을 것이다."
 PHI_corruption_event.20.t: "감사: 증거 없음"
 PHI_corruption_event.20.d: "감사에서 조치할 만한 사항이 나오지 않았습니다. 모든 계약이 서류상으로는 문제가 없었습니다. 장부가 깨끗하거나, 우리가 도착하기 전에 누군가 정리한 것입니다."
 PHI_corruption_event.20.a: "시도는 했다."
 PHI_corruption_event.21.t: "감사: 관리 부실 폭로"
 PHI_corruption_event.21.d: "감사관들이 여러 부서에서 허술한 회계 처리와 부풀려진 청구서를 적발하였습니다. 잘못 관리된 자금은 환수되었습니다."
 PHI_corruption_event.21.a: "책임을 묻는다."
 PHI_corruption_event.22.t: "감사: 조달 부패 적발"
 PHI_corruption_event.22.d: "뿌리 깊은 조달 비리가 터졌습니다. 관리들이 리베이트를 대가로 페이퍼 컴퍼니에 체계적으로 계약을 주고 있었습니다."
 PHI_corruption_event.22.a: "조직망을 해체한다."
 PHI_corruption_event.23.t: "감사: 전국적 횡령 폭로"
 PHI_corruption_event.23.d: "여러 부처에 걸친 엄청난 규모의 횡령 계획이 적발되었습니다. 공공 금고에서 빼돌린 규모는 국가적 스캔들입니다."
 PHI_corruption_event.23.a: "이제 끝이다."
 PHI_corruption_event.30.t: "세무 조사: 발견 사항 없음"
 PHI_corruption_event.30.d: "조사관들은 부정행위의 명확한 증거를 찾지 못했습니다. 직원들은 협조적이었고 기록은 정상으로 보였습니다. 조사는 결과 없이 종결됩니다."
 PHI_corruption_event.30.a: "업무로 복귀한다."
 PHI_corruption_event.31.t: "세무 조사: 뇌물 수수 적발"
 PHI_corruption_event.31.d: "다수의 하급 세무 직원이 과세액을 줄여주는 대가로 뇌물을 받다가 적발되었습니다. 이들은 해고되었고 체납 세금이 회수되었습니다."
 PHI_corruption_event.31.a: "집안 청소를 한다."
 PHI_corruption_event.32.t: "세무 조사: 관세 사기 폭로"
 PHI_corruption_event.32.d: "정교한 관세 사기 조직이 해체되었습니다. 밀수업자들은 수년간 고위 직원들에게 뇌물을 주어 세금이 부과되지 않은 화물을 통과시켜 왔습니다."
 PHI_corruption_event.32.a: "국세청을 개혁한다."
 PHI_corruption_event.33.t: "세무 조사: 고위 관료 연루"
 PHI_corruption_event.33.d: "국세청의 고위 관료들이 조직적인 부패 계획에 연루된 것으로 드러났습니다. 이 스캔들은 외국인 투자자들을 불안하게 하고 대중의 신뢰를 흔들었습니다."
 PHI_corruption_event.33.a: "한 명도 빠짐없이 기소한다."
 PHI_corruption_event.40.t: "군 조사: 증거 은폐"
 PHI_corruption_event.40.d: "군은 대열을 닫았습니다. 우리 조사관들은 모든 단계에서 비협조에 부딪혔습니다. 부패가 존재한다면 깊숙이 묻혀 버렸습니다."
 PHI_corruption_event.40.a: "다시 돌아올 것이다."
 PHI_corruption_event.41.t: "군 조사: 장교 적발"
 PHI_corruption_event.41.d: "여러 하급 장교가 개인적 이득을 위해 연료 배급분과 장비를 빼돌리다 적발되었습니다. 이들은 군법 회의에 회부되었습니다."
 PHI_corruption_event.41.a: "정의가 실현되었다."
 PHI_corruption_event.42.t: "군 조사: 참모부 연루"
 PHI_corruption_event.42.d: "참모 장교 일부가 국방 조달 계약과 관련된 부패 조직에 연루된 것으로 드러났습니다. 이 스캔들로 지휘 체계가 혼란에 빠졌습니다."
 PHI_corruption_event.42.a: "군 내부를 숙청하라."
 PHI_corruption_event.43.t: "군 조사: 고위 인사 폭로"
 PHI_corruption_event.43.d: "군 고위 인사가 수년간 국방 예산을 횡령해 온 사실이 공개적으로 폭로되었습니다. 이 사실은 군과 국민 모두에게 충격을 안겼습니다."
 PHI_corruption_event.43.a: "법 위에 있는 자는 없다."
 PHI_corruption_event.50.t: "숙청: 뚜렷한 성과 없음"
 PHI_corruption_event.50.d: "지방 관리들이 몸을 낮추었고 숙청에서는 조치를 취할 만한 단서가 거의 나오지 않았습니다. 조직망이 잠적했거나 사전에 정보가 새어 나갔을 것입니다."
 PHI_corruption_event.50.a: "다시 시도하겠다."
 PHI_corruption_event.51.t: "숙청: 비리 조직 적발"
 PHI_corruption_event.51.d: "지방 관료 조직 내에서 활동하던 소규모 비리 조직이 해체되었습니다. 관리 여러 명이 직위에서 해임되었습니다."
 PHI_corruption_event.51.a: "속이 시원하다."
 PHI_corruption_event.52.t: "숙청: 지방 조직 폭로"
 PHI_corruption_event.52.d: "지역 정부에 뿌리내린 대규모 지방 조직이 폭로되었습니다. 이들의 제거로 지역 권력 구조가 흔들렸고 불안이 일고 있습니다."
 PHI_corruption_event.52.a: "안정은 뒤따를 것이다."
 PHI_corruption_event.53.t: "숙청: 정치 가문 몰락"
 PHI_corruption_event.53.d: "수십 년간 지방 정부를 장악해 온 뿌리 깊은 정치 가문이 무너졌습니다. 이들의 자산은 압수되었으나 추종자들은 여전히 불안하게 움직이고 있습니다."
 PHI_corruption_event.53.a: "새로운 시대가 열린다."
 PHI_corruption_event.60.t: "해외 자금 추적: 단서 없음"
 PHI_corruption_event.60.d: "우리 금융 수사관들은 막다른 길에 부딪혔습니다. 모든 단서가 여러 관할권에 걸친 익명의 페이퍼 컴퍼니 속으로 사라졌습니다. 자금은 종적을 감추었습니다."
 PHI_corruption_event.60.a: "놓쳤다."
 PHI_corruption_event.61.t: "해외 자금 추적: 소규모 계좌 발견"
 PHI_corruption_event.61.d: "정부 관리들과 연루된 소규모 해외 계좌 다수가 확인되어 동결되었습니다. 액수는 크지 않으나 그 선례가 갖는 의미는 큽니다."
 PHI_corruption_event.61.a: "전부 동결하라."
 PHI_corruption_event.62.t: "해외 자금 추적: 자금세탁망 폭로"
 PHI_corruption_event.62.d: "해외 계좌를 통해 자금을 이동시키던 대규모 자금세탁망이 해체되었습니다. 상당한 금액이 필리핀 국고로 환수되었습니다."
 PHI_corruption_event.62.a: "자금을 본국으로 가져오라."
 PHI_corruption_event.63.t: "해외 자금 추적: 해외 거액 재산 발견"
 PHI_corruption_event.63.d: "놀라운 발견입니다. 고위 관리들이 소유한 막대한 해외 재산이 발견되어 압수되었습니다. 이 횡재는 역사적이며 강력한 메시지를 전달합니다."
 PHI_corruption_event.63.a: "국민이 알게 될 것이다."
 PHI_corruption_event.99.t: "국민의 신뢰 회복"
 PHI_corruption_event.99.d: "낡은 정치 가문이 권력에서 물러나면서 지역 사회는 서서히 제도에 대한 신뢰를 회복해 가고 있습니다. 조심스러운 낙관론이 퍼지고 있습니다."
 PHI_corruption_event.99.a: "국민이 우리 편이다."
 PHI_corruption_event.100.t: "우리가 이룬 성과"
 PHI_corruption_event.100.d: "수년에 걸친 공들인 수사와 기소, 제도 개혁 끝에 우리의 부패 척결 운동은 소수만이 가능하다고 믿었던 이정표에 도달했습니다. 한때 정부를 마비시켰던 비리와 후견주의의 뿌리 깊은 조직망은 해체되었습니다. 필리핀은 새로운 시대의 문턱에 서 있습니다. 그것은 관리들이 무엇을 훔치는가가 아니라 무엇을 건설하는가로 규정되는 시대입니다."
 PHI_corruption_event.100.a: "새로운 필리핀이 오늘 시작된다."
 PHI_corruption_event.200.t: "기업 로비 스캔들"
 PHI_corruption_event.200.d: "대형 재벌이 비밀 기부금으로 최근 입법에 영향력을 행사했다는 소문이 돌고 있습니다. 대중이 주시하고 있으며 야당은 호기를 노리고 있습니다."
 PHI_corruption_event.200.a: "무시하라. 모두와 싸울 수는 없다."
 PHI_corruption_event.200.b: "제한적 감사를 실시하라."
 PHI_corruption_event.200.c: "공개적으로 규탄하라."
 PHI_corruption_event.201.t: "유령 사업"
 PHI_corruption_event.201.d: "의회 보고서에 따르면 국가 예산이 투입된 여러 기반시설 사업에서 완공의 흔적을 찾을 수 없었습니다. 건설된 도로도, 세워진 건물도, 고용된 노동자도 없었습니다. 자금은 그저 사라졌습니다."
 PHI_corruption_event.201.a: "덮어 두자."
 PHI_corruption_event.201.b: "지방 관리들에게 책임을 돌려라."
 PHI_corruption_event.201.c: "공식 조사를 개시하라."
 PHI_corruption_event.202.t: "세금 유출"
 PHI_corruption_event.202.d: "내부 고발자가 나서서 정부 고위 관리들이 가짜 페이퍼 컴퍼니 조직망을 통해 세금을 탈루해 왔다는 증거를 제출했습니다. 문서는 이미 언론에 퍼지고 있습니다."
 PHI_corruption_event.202.a: "조용히 처리하라."
 PHI_corruption_event.202.b: "본보기로 삼아라."
 PHI_corruption_event.202.c: "협조의 대가로 관용을 제안하라."
 PHI_corruption_event.203.t: "군 조달 비리"
 PHI_corruption_event.203.d: "수사 결과 필리핀 군대에 인도되어야 할 무기 수송분이 사라진 사실이 드러났습니다. 송장에는 서명이 되었고 인도 기록도 남아 있으나 장비는 어디에서도 찾을 수 없습니다."
 PHI_corruption_event.203.a: "의혹을 일축하라."
 PHI_corruption_event.203.b: "희생양 몇 명을 처벌하라."
 PHI_corruption_event.203.c: "전면 조사를 개시하라."
 PHI_corruption_event.204.t: "지방 마피아 조직망"
 PHI_corruption_event.204.d: "경찰 정보 보고서는 많은 주민이 이미 알고 있던 사실을 확인해 주었습니다. 주와 바랑가이 관리 여럿이 조직범죄 집단과 적극적으로 협력하고 있다는 것입니다. 모든 단계에서 보호비가 오가고 있습니다."
 PHI_corruption_event.204.a: "무시하라."
 PHI_corruption_event.204.b: "공개적으로 체포하라."
 PHI_corruption_event.204.c: "측근으로 교체하라."
 PHI_corruption_event.205.t: "외국 리베이트 사건"
 PHI_corruption_event.205.d: "외국 건설 및 에너지 기업들이 수익성 높은 정부 계약을 따내기 위해 고위 관리들에게 뇌물을 준 증거가 드러났습니다. 증거 기록은 수도까지 이어집니다."
 PHI_corruption_event.205.a: "전부 부인하라."
 PHI_corruption_event.205.b: "조용히 제재하라."
 PHI_corruption_event.205.c: "공개적으로 본보기를 보여라."
 PHI_corruption_event.206.t: "관료제의 부패"
 PHI_corruption_event.206.d: "소소한 부패가 정부 기관 전반에서 점점 일상화되었습니다. 서기는 봉투를 기대하고, 감독관은 설득이 필요하며, 허가에는 공식 수수료 외의 대가가 붙습니다. 이러한 작은 부패의 문화가 제도에 대한 신뢰를 갉아먹고 있습니다."
 PHI_corruption_event.206.a: "작은 특혜 정도는 눈감아 주자."
 PHI_corruption_event.206.b: "상징적 개혁을 시행하라."
 PHI_corruption_event.206.c: "관리 몇 명을 재배치하라."
 PHI_corruption_number_01: "(1) 무시할 만한 부패"
 PHI_corruption_number_02: "(2) 경미한 부패"
 PHI_corruption_number_03: "(3) 완만한 부패"
 PHI_corruption_number_04: "(4) 중간 수준의 부패"
 PHI_corruption_number_05: "(5) 만연한 부패"
 PHI_corruption_number_06: "(6) 체계적 부패"
 PHI_corruption_number_07: "(7) 통제 불능의 부패"
 PHI_corruption_number_08: "(8) 걷잡을 수 없는 부패"
 PHI_corruption_number_09: "(9) 치명적 부패"
 PHI_corruption_number_10: "(10) 마비시키는 부패"
 PHI_corruption_strength_exact_tt: "§Y부패 강도§!가 §R[?PHI_corruption_roll|0]§! 감소 (현재: §Y[?PHI_corruption_strength|0]§!)"
 PHI_edsa_dos_category: "EDSA 도스 위기"
 PHI_edsa_dos_category_desc: "부패 의혹으로 행정부가 불안정해졌습니다. 탄핵 재판으로 국정이 마비되었습니다. 국민은 지켜보며 점점 인내심을 잃어 가고 있습니다. 시간이 다하기 전에 §Y두 번째 봉투 개봉§! 결정을 내리십시오."
 PHI_the_people_grow_disillusioned: "국민의 환멸이 커진다..."
 PHI_the_people_grow_disillusioned_desc: "핵심 탄핵 증거를 은폐하자는 상원의 표결에 대중이 분노했습니다. 수십만 명이 EDSA 성지로 모여들고 있습니다. 시간이 얼마 남지 않았습니다."
 PHI_open_the_second_envelope: "두 번째 봉투 개봉"
 PHI_open_the_second_envelope_desc: "증거 은폐를 가결한 11 대 10의 상원 표결에도 불구하고, 우리에게는 논란의 증거가 공개되도록 허용할 권한이 아직 있습니다. 정치적으로 타격을 입겠지만, 제도에 대한 신뢰를 지키고 정부의 붕괴를 막을 유일한 길일 수 있습니다."
 PHI_edsa_corruption_below_55_tt: "§Y부패 강도§!가 §Y55§! 미만이어야 함 (현재: [?PHI.PHI_corruption_strength|Y0])"
 PHI_edsa_stability_above_60_tt: "§Y안정도§!가 §Y60%§! 초과여야 함"
 PHI_edsa_dos_impeachment_atmosphere: "탄핵 마비"
 PHI_edsa_dos_impeachment_atmosphere_desc: "탄핵 재판이 모든 뉴스 방송을 지배하고 있습니다. 국민이 행정부의 생존을 건 싸움을 지켜보는 동안 정치적 자본이 매일 소진되고 있습니다."
 PHI_edsa_dos_recovery_spirit: "EDSA 이후 안정화"
 PHI_edsa_dos_recovery_spirit_desc: "새 행정부가 이례적인 상황에서 권력을 인수했습니다. 개혁 공약이 조심스러운 대중의 낙관을 불러일으키고 있으나 깊은 정치적 상처는 여전히 남아 있습니다."
 PHI.1.t: "주에테나 스캔들 폭발"
 PHI.1.d: "내부 고발자가 나서서 조지프 에스트라다 대통령과 측근들이 수백만 페소의 주에텡 리베이트를 받았다고 폭로했습니다. 언론 보도로 행정부 내부의 더 깊은 부패가 드러나면서 대중의 분노가 빠르게 커지고 있습니다. 야당 인사와 교회 지도자, 시민사회단체들이 정부에 책임을 요구하는 시위를 조직하기 시작했습니다. 전국적으로 긴장이 고조되는 가운데 행정부는 커져 가는 소요에 어떻게 대응할지 결정해야 합니다. 그렇지 않으면 행정부 자체가 막을 내릴 수 있습니다."
 PHI.1.a: "더 큰 사태로 번질지도 모른다..."
 PHI.2.t: "끝장"
 PHI.2.d: "퇴장 사태에서 시작되었습니다. 상원이 핵심 탄핵 증거를 은폐하기로 11 대 10으로 가결하자 검찰 측 전원이 법정에서 퇴장했습니다. 몇 시간 만에 수십만 명의 필리핀인이 1986년 원조 피플 파워 혁명을 연상시키는 대규모 시위를 위해 EDSA 성지로 몰려들었습니다. 며칠 만에 필리핀 군대와 필리핀 국가경찰이 행정부에 대한 지지를 철회했습니다. 각료들이 대거 사임했습니다. 일라리오 다비데 주니어 대법원장은 부통령 글로리아 마카파갈 아로요에게 취임 선서를 집행했습니다. 조지프 에스트라다는 공식적으로 사임하지 않은 채 말라카냥 궁을 떠났습니다. 새로운 장이 시작됩니다."
 PHI.2.a: "국민이 말했다."
 PHI.3.t: "글로리아 마카파갈 아로요 취임"
 PHI.3.d: "조지프 에스트라다가 필리핀 대통령직에서 물러나자, 에스트라다의 부통령이자 £PHI_conservatism 라카스-CMD 소속인 글로리아 아로요가 제14대 필리핀 대통령으로 취임 선서를 했습니다. 아로요의 대통령직 승계가 정당하지 않다고 말하는 이도 있으나, 국민은 혁명과 시위의 물결로 또 한 명의 부패한 지도자가 쓰러졌다는 데 환호하고 있습니다. 아로요 행정부가 회복하기까지는 시간이 걸리겠지만, 아로요가 전임 대통령이 몰락하며 남긴 상처를 치유하겠다고 약속하는 만큼 마침내 변화가 찾아올지도 모릅니다."
 PHI.3.a: "변화가 올지도 모른다."
 PHI.4.t: "열린 두 번째 봉투"
 PHI.4.d: "며칠간의 정치적 혼란 끝에 상원은 논란의 '두 번째 봉투'를 개봉하기로 가결했습니다. 탄핵 재판의 결정적 순간이 될 것으로 예상되었던 사건은 오히려 전국에 짧은 안도감을 가져왔습니다. 증거가 사법 절차에 들어가게 되자 검찰은 집단 퇴장 계획을 포기했고, 또 한 번의 피플 파워 혁명을 요구하는 목소리도 빠르게 힘을 잃었습니다.\n조지프 에스트라다 대통령은 이날의 정치적 폭풍에서 살아남았지만 그의 행정부는 깊은 상처를 입은 채입니다. 부패 의혹은 계속 헤드라인을 장식하고 있고, 금융 시장은 여전히 불안하며, 지지자와 반대자 모두 탄핵 공방이 끝나려면 아직 멀었음을 알고 있습니다. 정부는 붕괴를 피했지만 그 미래는 이제 전적으로 재판 결과에 달려 있습니다."
 PHI.4.a: "공화국은 버틴다... 아직은"
 PHI.5.t: "민다나오 작전 종결"
 PHI.5.d: "모로 이슬람 해방 전선의 마지막 조직적 기지 사령부가 제압되었습니다. 전선에 남은 것은 영토도, 수입도, 이들을 조율할 지휘 체계도 없는 도망 중인 지휘관 몇 명뿐입니다. 남부 사령부는 수복된 자치시들의 책임을 민간 당국에 넘겼고, 군대는 수비대 규모로 감축하고 있습니다.\n\n반란은 어떤 문서에도 서명 없이 끝났습니다. 반란을 낳은 불만이 함께 끝났는지는 전혀 다른 문제입니다."
 PHI.5.a: "민다나오는 우리의 통치 아래에 있다."
 PHI.6.t: "방사모로 포괄적 협정"
 PHI.6.d: "말레이시아의 중재로 수년간 협상한 끝에 정부와 모로 이슬람 해방 전선이 포괄적 합의에 서명했습니다. 전선은 독립적 검증 아래 무기와 전투원을 무장해제할 것입니다. 그 대가로 이슬람교도 민다나오 자치구는 자체 의회와 국가 세입의 일정 몫, 내정에 관한 권한을 갖는 방사모로 체제로 대체됩니다.\n\n이 전환은 마닐라에 막대한 비용과 남부에 대한 일부 주권의 양보를 요구할 것입니다. 그러나 이는 40년간의 전쟁을 끝내기도 합니다."
 PHI.6.a: "평화는 그만한 값어치가 있다."
 PHI.7.t: "가장 긴 반란의 종결"
 PHI.7.d: "신인민군의 게릴라 전선이 지역별로 하나씩 해체되었습니다. 지역 위원회들은 체포되거나 흩어졌고, 농촌 징세망은 무너졌으며, 중앙위원회의 잔존 세력은 네덜란드 망명지에서 아무것도 지시하지 못하고 있습니다.\n\n필리핀 공산당은 1969년에 장기 인민전쟁을 개시했습니다. 이들은 마르코스 독재와 네 명의 대통령, 이후 시도된 모든 평화 과정보다 오래 버텼습니다. 그러나 이번에는 버티지 못할 것입니다."
 PHI.7.a: "50년의 전쟁이 끝났다."
 PHI.8.t: "오슬로 합의"
 PHI.8.d: "노르웨이 정부가 마닐라와 민족민주전선 간의 마지막 회담을 주최했습니다. 합의는 정치범에게 사면을 부여하고 정부가 농지 개혁과 농촌 투자 프로그램을 시행하도록 약속하게 합니다. 그 대신 신인민군은 영구적으로 해산하고 전선은 합법 정당을 통해 권력을 다투게 됩니다.\n\n양측 강경파는 이 거래를 규탄합니다. 어느 쪽도 상대 없이 싸움을 계속할 병력을 거느리고 있지 않습니다."
 PHI.8.a: "전쟁은 협상 테이블에서 끝난다."
 PHI.9.t: "반세습 정치 가문법 통과"
 PHI.9.d: "모든 예상을 뒤엎고 의회가 헌법 제2조 26항의 시행 입법을 통과시켰습니다. 현직 공직자의 2촌 이내 혈족은 같은 관할 구역에서 그 직위를 승계하거나 동시에 공직을 맡을 수 없습니다.\n\n수 세대에 걸쳐 주지사와 하원의원, 대통령을 배출해 온 지방 가문들은 이제 물려받을 수 없는 선거 지형에 직면했습니다. 정당 지도부는 배경 가문이 없는 후보에게도 열려 있으며, 대통령이 서명한 순간 수많은 정치 경력이 끝났습니다."
 PHI.9.a: "가문이 공화국을 소유하지는 않는다."
 PHI_news.1.t: "에스트라다, 제2차 피플 파워 혁명으로 축출"
 PHI_news.1.d: "조지프 에스트라다 대통령이 며칠간의 대규모 시위와 탄핵 절차의 붕괴로 촉발된 정치 위기 끝에 강제로 물러났습니다. 군대와 필리핀 국가경찰이 궁지에 몰린 대통령에 대한 지지를 철회하자, 부통령 글로리아 마카파갈 아로요가 취임 선서를 하며 에스트라다 행정부는 막을 내렸습니다. 아시아 각국 정부는 평화로운 권력 이양을 환영하는 한편 필리핀의 정치적 향방을 면밀히 지켜보고 있습니다."
 PHI_news.1.a: "에스트라다 대통령직의 극적인 종말."
 PHI_news.2.t: "에스트라다, 위기 극복"
 PHI_news.2.d: "필리핀의 조지프 에스트라다 대통령이 자신의 임기 중 가장 심각한 정치 위기로 보였던 사태를 간신히 넘겼습니다. 상원이 논란의 두 번째 봉투를 증거로 채택하기로 가결하면서, 탄핵 재판은 정치적 혼란으로 무너지는 대신 속행되었습니다.\n이 결정으로 대규모 시위와 또 한 번의 피플 파워 운동에 대한 우려가 일시적으로 누그러졌고, 사법 절차가 계속되는 동안 에스트라다는 직위를 유지할 수 있게 되었습니다. 그러나 이러한 유예에도 부패 의혹은 행정부에 긴 그림자를 드리우고 있으며, 외국 정부와 금융 시장 모두 이 나라의 정치적 미래를 불확실하게 보고 있습니다."
 PHI_news.2.a: "에스트라다가 권좌를 유지한다."
 PHI_edsa_dos_tt: "§Y조지프 에스트라다 대통령이 불법 자금을 다룬 사실이 적발되어 사람들이 거리에서 집회를 열고 있습니다. 이 사태에 대처하지 않으면§!, §R우리가 아는 행정부 전체가 끝날 수도 있습니다§!."
