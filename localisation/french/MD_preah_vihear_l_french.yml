l_french:
 preah_vihear_decisions_category: "Différend frontalier à Preah Vihéar"
 preah_vihear_dispute: "Différend concernant le temple de Preah Vihéar"
 SIA_escalate_preah_vihear_tensions: "Exacerber les tensions à la frontière"
 SIA_escalate_preah_vihear_tensions_desc: "Ouvrir vraiment l'épreuve de force : ordonner le redéploiement de troupes près de l'escarpement des Dângrêk et laisser la presse nationaliste s'en emparer. Phnom Penh recevra le message clairement, et ce premier pas ne se rattrape pas."
 SIA_request_asean_mediation: "Demander une médiation auprès de l'ASEAN"
 SIA_request_asean_mediation_desc: "Demander à l'ASEAN de médier le litige frontalier avec le Cambodge. Cette voie diplomatique peut aider à désamorcer les tensions et trouver un règlement pacifique."
 SIA_accept_icj_ruling: "Acceptez la décision de la CIJ"
 SIA_accept_icj_ruling_desc: "Accepter l'arrêt de la Cour internationale de justice sur le litige du temple de Preah Vihear. Cela mettra fin au conflit mais pourra passer pour une défaite diplomatique."
 SIA_reject_icj_ruling: "Rejeter la décision de la CIJ"
 SIA_reject_icj_ruling_desc: "Rejeter l'arrêt de la CIJ et continuer d'affirmer nos prétentions sur le territoire contesté. Cela fera monter les tensions internationales mais montrera notre détermination."
 CBD_protest_thai_actions: "Protestation diplomatique"
 CBD_protest_thai_actions_desc: "Convoquer l'ambassadeur thaïlandais, déposer une protestation formelle à l'ASEAN et à l'ONU, et laisser le pays voir le gouvernement tenir bon. Cela rassemble du capital politique intérieur et consigne notre grief, sans prétendre calmer une frontière que Bangkok n'a nulle intention de calmer."
 CBD_request_asean_mediation: "Demander une médiation auprès de l'ASEAN"
 CBD_request_asean_mediation_desc: "Demander à l'ASEAN de médier le litige frontalier avec la Thaïlande. Une solution diplomatique régionale peut aider à protéger nos prétentions."
 CBD_appeal_to_icj: "Saisir la CIJ"
 CBD_appeal_to_icj_desc: "Déposer une requête à la Cour internationale de justice pour réaffirmer la souveraineté du Cambodge sur le temple de Preah Vihear et le territoire environnant."
 preah_vihear.100.t: "L'UNESCO désigne Preah Vihear comme site du patrimoine mondial"
 preah_vihear.100.d: "L'Organisation des Nations unies pour l'éducation, la science et la culture a officiellement inscrit le temple de Preah Vihear au patrimoine mondial, en l'attribuant au Cambodge. Des manifestations nationalistes ont éclaté en Thaïlande, les manifestants exigeant une action militaire pour protéger ce qu'ils considèrent comme territoire thaïlandais. La situation le long de la frontière se dégrade rapidement."
 preah_vihear.100.a: "C'est un outrage ! Mobilisez nos forces !"
 preah_vihear.100.b: "Nous devons respecter la décision internationale"
 preah_vihear.101.t: "L'UNESCO reconnaît Preah Vihéar"
 preah_vihear.101.d: "L'UNESCO a officiellement inscrit l'ancien temple de Preah Vihear au patrimoine mondial sous souveraineté cambodgienne. C'est une victoire diplomatique majeure, qui réaffirme l'arrêt de la CIJ de 1962. Cependant, les manifestations nationalistes en Thaïlande peuvent accroître les tensions le long de notre frontière."
 preah_vihear.101.a: "Un grand jour pour le Cambodge !"
 preah_vihear.1.t: "Provocation thaïlandaise à la frontière"
 preah_vihear.1.d: "La Thaïlande a fait monter les tensions le long de notre frontière près du temple de Preah Vihear. Des manifestants nationalistes à Bangkok exigent une action militaire, et des troupes thaïlandaises ont été redéployées plus près de la zone contestée."
 preah_vihear.1.a: "Nous devons rester vigilants"
 preah_vihear.5.t: "Attaque des forces thaïlandaises !"
 preah_vihear.5.d: "Les forces militaires thaïlandaises ont lancé une incursion dans la région frontalière contestée près du temple de Preah Vihear. Nos troupes engagent les assaillants. La communauté internationale observe alors que la situation menace de dégénérer en conflit ouvert."
 preah_vihear.5.a: "Défendez notre territoire !"
 preah_vihear.6.t: "Contre-attaque cambodgienne"
 preah_vihear.6.d: "Les forces cambodgiennes ont lancé une contre-attaque contre nos positions près du temple de Preah Vihear. On entend l'artillerie et les armes légères le long de la frontière."
 preah_vihear.6.a: "Nous devons tenir nos positions"
 preah_vihear.10.t: "Victoire lors d'un accrochage frontalier"
 preah_vihear.10.d: "Nos forces ont atteint leurs objectifs dans l'accrochage frontalier près de Preah Vihear. L'ennemi a été repoussé, et nous avons démontré notre capacité militaire dans la région."
 preah_vihear.10.a: "Excellente nouvelle"
 preah_vihear.11.t: "Défaite lors d'un accrochage frontalier"
 preah_vihear.11.d: "Nos forces ont été repoussées dans l'accrochage frontalier près de Preah Vihear. L'engagement s'est soldé par un échec, et nos troupes se sont retirées sur leurs positions antérieures avec des pertes."
 preah_vihear.11.a: "Un revers cuisant"
 preah_vihear.12.t: "Affrontement frontalier peu concluant"
 preah_vihear.12.d: "L'accrochage frontalier près de Preah Vihear s'est terminé par une impasse. Les deux camps se sont retirés sans atteindre leurs objectifs, bien que tous deux aient acquis une précieuse expérience du combat."
 preah_vihear.12.a: "Regrouper et réévaluer"
 preah_vihear.13.t: "Victoire lors d'une contre-attaque"
 preah_vihear.13.d: "Notre contre-attaque a réussi à repousser les forces ennemies. Nous avons montré que toute agression contre notre territoire se heurtera à une résistance déterminée."
 preah_vihear.13.a: "Notre souveraineté est défendue"
 preah_vihear.14.t: "Contre-attaque repoussée"
 preah_vihear.14.d: "Notre contre-attaque a été repoussée par les forces ennemies. Malgré tous nos efforts, nous n'avons pas pu les déloger de leurs positions dans la zone contestée."
 preah_vihear.14.a: "Nous nous relèverons"
 preah_vihear.20.t: "Proposition de médiation de l'ASEAN"
 preah_vihear.20.d: "La Thaïlande a demandé la médiation de l'ASEAN dans le litige frontalier de Preah Vihear. L'Indonésie, présidente de l'ASEAN, propose d'envoyer des observateurs dans la région frontalière et de faciliter les négociations entre les deux parties."
 preah_vihear.20.a: "Accepter la médiation"
 preah_vihear.20.b: "Rejeter la médiation"
 preah_vihear.21.t: "Proposition de médiation de l'ASEAN"
 preah_vihear.21.d: "Le Cambodge a demandé la médiation de l'ASEAN dans le litige frontalier de Preah Vihear. L'Indonésie, présidente de l'ASEAN, propose d'envoyer des observateurs dans la région frontalière et de faciliter les négociations entre les deux parties."
 preah_vihear.21.a: "Accepter la médiation"
 preah_vihear.21.b: "Rejeter la médiation"
 preah_vihear.22.t: "Médiation de l'ASEAN acceptée"
 preah_vihear.22.d: "La Thaïlande et le Cambodge ont tous deux accepté la médiation de l'ASEAN. Des observateurs indonésiens seront déployés dans la région frontalière, et des négociations diplomatiques commenceront pour trouver un règlement pacifique."
 preah_vihear.22.a: "Une voie vers la paix"
 preah_vihear.23.t: "Médiation de l'ASEAN rejetée"
 preah_vihear.23.d: "L'autre partie a rejeté la médiation de l'ASEAN dans le litige de Preah Vihear. Les efforts diplomatiques ont échoué, et les tensions restent élevées le long de la frontière."
 preah_vihear.23.a: "Nous devons nous préparer à une confrontation durable"
 preah_vihear.30.t: "Le Cambodge saisit la CIJ"
 preah_vihear.30.d: "Le Cambodge a saisi la Cour internationale de justice au sujet du litige du temple de Preah Vihear. La Cour examinera la demande de mesures conservatoires du Cambodge et tranchera finalement la question de souveraineté."
 preah_vihear.30.a: "Nous attendons la décision de la Cour"
 preah_vihear.31.t: "La CIJ statue en notre faveur"
 preah_vihear.31.d: "La Cour internationale de justice a réaffirmé la souveraineté du Cambodge sur le temple de Preah Vihear et ordonné aux deux camps de retirer leur personnel militaire d'une zone démilitarisée provisoire autour du temple."
 preah_vihear.31.a: "Le droit international est de notre côté"
 preah_vihear.32.t: "La CIJ statue contre nous"
 preah_vihear.32.d: "La Cour internationale de justice a statué en faveur des prétentions de souveraineté du Cambodge sur le temple de Preah Vihear. La Cour a ordonné l'établissement d'une zone démilitarisée autour de la zone contestée."
 preah_vihear.32.a: "C'est un arrêt injuste"
 preah_vihear.35.t: "La Thaïlande accepte la décision de la CIJ"
 preah_vihear.35.d: "La Thaïlande a accepté l'arrêt de la CIJ sur le litige du temple de Preah Vihear. Les forces thaïlandaises se retireront de la zone démilitarisée, mettant effectivement fin à la crise frontalière."
 preah_vihear.35.a: "La paix enfin"
 preah_vihear.36.t: "La Thaïlande rejette l'arrêt de la CIJ"
 preah_vihear.36.d: "La Thaïlande a rejeté l'arrêt de la CIJ sur le litige du temple de Preah Vihear, le jugeant injuste et refusant de reconnaître la compétence de la Cour. Les tensions le long de la frontière devraient augmenter."
 preah_vihear.36.a: "Nous devons nous préparer à un conflit durable"
 preah_vihear_news.1.t: "Le différend sur Preah Vihéar est résolu"
 preah_vihear_news.1.d: "Le litige frontalier de longue date entre la Thaïlande et le Cambodge au sujet du temple de Preah Vihear a été réglé. La Thaïlande a accepté l'arrêt de la Cour internationale de justice affirmant la souveraineté du Cambodge sur le complexe du temple. Les deux nations ont convenu de retirer leurs forces militaires de la zone et d'établir des relations diplomatiques normales."
 preah_vihear_news.1.o1: "La stabilité régionale rétablie"
 preah_vihear_news.2.t: "L’ASEAN joue un rôle de médiateur dans le différend frontalier"
 preah_vihear_news.2.d: "Par la médiation de l'ASEAN, la Thaïlande et le Cambodge ont convenu de désescalader le litige frontalier sur le temple de Preah Vihear. Des observateurs indonésiens surveilleront le cessez-le-feu tandis que les deux nations travaillent à une solution diplomatique."
 preah_vihear_news.2.o1: "La diplomatie prévaut"
 preah_vihear_news.3.t: "Accrochages frontaliers entre la Thaïlande et le Cambodge"
 preah_vihear_news.3.d: "Des accrochages armés ont éclaté le long de la frontière thaïlando-cambodgienne près du temple contesté de Preah Vihear. Les forces thaïlandaises ont lancé des opérations militaires dans la zone, et les troupes cambodgiennes ripostent. Des tirs d'artillerie et d'armes légères ont été signalés. L'ancien complexe du temple, site du patrimoine mondial de l'UNESCO, se trouve pris sous le feu croisé alors que les deux nations font monter leur litige territorial."
 preah_vihear_news.3.o1: "Une escalade dangereuse"
 preah_vihear_decisions_category_desc: "Le temple de Preah Vihear, sanctuaire khmer du XIe siècle perché sur l'escarpement des Dângrêk, chevauche une frontière que la carte de l'époque coloniale française et l'arrêt de 1962 de la CIJ ont tranchée en faveur du Cambodge, mais que la Thaïlande n'a jamais pleinement acceptée. L'inscription UNESCO au patrimoine mondial en 2008 a rouvert la plaie, et le versant autour du temple reste contesté même là où le sanctuaire lui-même ne l'est pas. L'escalade ouvre la voie à un combat pour l'escarpement. Chaque affrontement consomme des ressources que les deux camps préféreraient conserver. \n\n§YTension frontalière :§! [?GLOBAL.preah_vihear_tension]\n§YNotre préparation :§! [?THIS.preah_vihear_readiness]\n§YNotre progression du conflit :§! [?THIS.preah_vihear_war_progress]"
 preah_vihear_deescalation_goodwill: "Goodwill de désescalade"
 SIA_pv_prepare_infantry_training: "Mener des exercices d'infanterie sur le terrain"
 SIA_pv_prepare_infantry_training_desc: "Faire tourner les unités d'infanterie de première ligne dans des exercices à balles réelles autour de l'escarpement des Dângrêk, en puisant dans les stocks d'armes légères et d'appui pour aiguiser leur préparation à une confrontation frontalière avec le Cambodge."
 SIA_pv_prepare_armor_training: "Mener des exercices blindés sur le terrain"
 SIA_pv_prepare_armor_training_desc: "Déplacer des unités blindées dans les collines près de Preah Vihear pour des manœuvres, afin de tester chars amphibies et chars moyens sur un terrain mal adapté aux uns comme aux autres."
 SIA_pv_prepare_artillery_training: "Mener des exercices d'artillerie sur le terrain"
 SIA_pv_prepare_artillery_training_desc: "Régler les batteries d'artillerie sur l'escarpement surplombant le temple, en répétant le type d'échange déjà vu plus d'une fois sur cette frontière."
 SIA_pv_nationalist_rhetoric: "Mobiliser l'opinion nationaliste à l'intérieur"
 SIA_pv_nationalist_rhetoric_desc: "Encourager ministres, porte-parole de l'armée et presse d'État à galvaniser l'opinion nationaliste sur le litige frontalier avec le Cambodge. Cela plaît au public intérieur, mais chaque salve fait monter la température à la frontière."
 SIA_pv_military_posturing: "Redéployer les forces à la frontière"
 SIA_pv_military_posturing_desc: "Faire monter des unités supplémentaires vers la frontière près de Preah Vihear en signe de détermination. Le Cambodge le lira pour ce que c'est."
 SIA_pv_attack_preah_vihear: "Lancer une incursion à la frontière"
 SIA_pv_attack_preah_vihear_desc: "Envoyer des unités franchir la frontière pour s'emparer du terrain autour du complexe du temple. Le succès place le sol contesté sous nos canons. L'échec nous coûtera cher en soutien, au pays comme à l'étranger."
 SIA_pv_extort_xp: "Tirer les leçons de la frontière"
 SIA_pv_extort_xp_desc: "Débriefer les officiers qui ont vu le feu à la frontière et intégrer l'expérience à la doctrine de l'armée permanente, pourvu que les combats y aient produit assez à apprendre."
 SIA_pv_decisive_victory: "Réclamez une victoire décisive"
 SIA_pv_decisive_victory_desc: "Le rapport de force étant décisivement en notre faveur, presser l'avantage : forcer le Cambodge à une reculade humiliante et célébrer l'épreuve comme un triomphe national, sans demander à nos troupes de tenir un seul mètre de plus."
 SIA_pv_capture_northern_khmer: "Capturer les Khmers du Nord"
 SIA_pv_capture_northern_khmer_desc: "Les combats ont tellement tourné à notre avantage que l'escarpement contesté s'ouvre devant nous. Plutôt que de se contenter du prestige, prendre le terrain pour de bon : annexer d'emblée la province khmère du Nord, planter le drapeau sur le temple et clore la question frontalière à nos conditions. Le Cambodge ne le pardonnera jamais, et le monde y verra une conquête."
 SIA_pv_de_escalate: "Proposer une désescalade"
 SIA_pv_de_escalate_desc: "Signaler la retenue par des contacts discrets avec Phnom Penh : retirer les unités des positions avancées et adoucir la rhétorique. Cela ne coûte que du capital politique, et achète une bonne volonté dont nous pourrons avoir besoin plus tard."
 CBD_pv_prepare_infantry_training: "Mener des exercices d'infanterie sur le terrain"
 CBD_pv_prepare_infantry_training_desc: "Faire tourner les unités d'infanterie de première ligne dans des exercices à balles réelles autour du complexe de Preah Vihear, en puisant dans les stocks d'armes légères et d'appui pour aiguiser leur préparation à une confrontation frontalière avec la Thaïlande."
 CBD_pv_prepare_armor_training: "Mener des exercices blindés sur le terrain"
 CBD_pv_prepare_armor_training_desc: "Déplacer des unités blindées près du temple contesté pour des manœuvres, afin de tester chars amphibies et chars moyens sur un terrain mal adapté aux uns comme aux autres."
 CBD_pv_prepare_artillery_training: "Mener des exercices d'artillerie sur le terrain"
 CBD_pv_prepare_artillery_training_desc: "Régler les batteries d'artillerie sur les positions thaïlandaises de l'escarpement, en répétant le type d'échange déjà vu plus d'une fois sur cette frontière."
 CBD_pv_nationalist_rhetoric: "Mobiliser l'opinion nationaliste à l'intérieur"
 CBD_pv_nationalist_rhetoric_desc: "Encourager ministres, porte-parole de l'armée et presse d'État à galvaniser l'opinion nationaliste sur le litige frontalier avec la Thaïlande. Cela plaît au public intérieur, mais chaque salve fait monter la température à la frontière."
 CBD_pv_military_posturing: "Redéployer les forces à la frontière"
 CBD_pv_military_posturing_desc: "Faire monter des unités supplémentaires vers la frontière près de Preah Vihear en signe de détermination. La Thaïlande le lira pour ce que c'est."
 CBD_pv_attack_preah_vihear: "Lancer une incursion à la frontière"
 CBD_pv_attack_preah_vihear_desc: "Envoyer des unités franchir la frontière pour s'emparer du terrain autour du complexe du temple. Le succès place le sol contesté sous nos canons. L'échec nous coûtera cher en soutien, au pays comme à l'étranger."
 CBD_pv_extort_xp: "Tirer les leçons de la frontière"
 CBD_pv_extort_xp_desc: "Débriefer les officiers qui ont vu le feu à la frontière et intégrer l'expérience à la doctrine de l'armée permanente, pourvu que les combats y aient produit assez à apprendre."
 CBD_pv_decisive_victory: "Réclamez une victoire décisive"
 CBD_pv_decisive_victory_desc: "Le rapport de force étant décisivement en notre faveur, presser l'avantage : forcer la Thaïlande à une reculade humiliante et célébrer l'épreuve comme un triomphe national, sans demander à nos troupes de tenir un seul mètre de plus."
 CBD_pv_de_escalate: "Proposer une désescalade"
 CBD_pv_de_escalate_desc: "Signaler la retenue par des contacts discrets avec Bangkok : retirer les unités des positions avancées et adoucir la rhétorique. Cela ne coûte que du capital politique, et achète une bonne volonté dont nous pourrons avoir besoin plus tard."
 preah_vihear_increase_readiness_TT: "§GCela augmentera notre préparation frontalière§!"
 preah_vihear_increase_tension_TT: "§YCela augmentera la tension frontalière§!"
 preah_vihear_tension_TT: "La tension frontalière est supérieure à 40"
 preah_vihear_readiness_TT: "Notre préparation frontalière est supérieure à 50"
 preah_vihear_progress_25_TT: "Plus de 25 de progression du conflit"
 preah_vihear_decrease_progress_25_TT: "§RCela diminuera notre progression du conflit de 25§!"
 preah_vihear_progress_50_TT: "Plus de 50 de progression du conflit"
 preah_vihear_decrease_progress_50_TT: "§RCela diminuera notre progression du conflit de 50§!"
 preah_vihear_deescalation_uses_remaining_TT: "Il nous reste des offres de désescalade"
 preah_vihear_decrease_tension_10_TT: "§GCela diminuera la tension frontalière de 10§!"
 preah_vihear_deescalation_used_TT: "§RUtilise une de nos offres limitées de désescalade§!"
 preah_vihear_no_clash_TT: "Aucun affrontement frontalier n'est actuellement en cours"
 preah_vihear_not_settled_TT: "La frontière n'a pas été réglée au cours des cinq dernières années"
 preah_vihear_no_recent_escalation_TT: "Nous n'avons pas fait de geste provocateur à la frontière récemment"
 preah_vihear_no_recent_protest_TT: "Nous n'avons pas attisé le sentiment nationaliste récemment"
 preah_vihear_progress_80_TT: "Plus de 80 de progression du conflit"
 preah_vihear_decrease_progress_80_TT: "§RCela diminuera notre progression du conflit de 80§!"
 preah_vihear_protest_grievance_TT: "La tension frontalière est supérieure à 10, ou la Thaïlande a déjà frappé au-delà de la frontière"
 preah_vihear_mediation_tension_TT: "La tension frontalière est supérieure à 20"
 preah_vihear_tension_resolved_TT: "§GCela remettra la tension frontalière à zéro§!"
 preah_vihear.40.t: "Accident d'entraînement à la frontière"
 preah_vihear.40.d: "Un exercice à balles réelles près de la frontière a mal tourné. Du matériel a été endommagé et plusieurs soldats sont inaptes au service, et le revers a entamé la confiance dans le programme de préparation."
 preah_vihear.40.a: "Tirer la leçon de l'erreur"
 preah_vihear.41.t: "La provocation se retourne contre elle"
 preah_vihear.41.d: "La dernière salve de rhétorique et de mouvements de troupes a attiré un examen indésirable au pays. Opposition et presse demandent si le gouvernement fabrique une crise qu'il ne peut maîtriser, et il a dû faire redescendre la température."
 preah_vihear.41.a: "Noter la leçon"
 preah_vihear.110.t: "Le communiqué Noppadon"
 preah_vihear.110.d: "Le ministre des Affaires étrangères Noppadon Pattama a cosigné un communiqué conjoint appuyant la candidature cambodgienne à l'UNESCO pour Preah Vihear, un document qui a depuis déclenché une tempête au pays. La Cour constitutionnelle examine si l'accord a été conclu sans approbation parlementaire adéquate, et les critiques nationalistes réclament la tête du ministre."
 preah_vihear.110.a: "Soutenir le communiqué"
 preah_vihear.110.b: "Le désavouer et laisser partir le ministre"
 preah_vihear.111.t: "Thaksin à Phnom Penh"
 preah_vihear.111.d: "Le Premier ministre Hun Sen a nommé le fugitif Thaksin Shinawatra comme conseiller économique personnel, un affront calculé au gouvernement de Bangkok. Le Cambodge a refusé d'envisager l'extradition, et la nomination est devenue un point de ralliement des deux côtés de la frontière."
 preah_vihear.111.a: "Rappeler notre ambassadeur"
 preah_vihear.111.b: "Ne déposer qu'une protestation formelle"
 preah_vihear.112.t: "Chemises jaunes à la frontière"
 preah_vihear.112.d: "L'Alliance du peuple pour la démocratie s'est emparée du litige frontalier comme nouvelle preuve d'un gouvernement trop proche de Phnom Penh et trop faible sur la souveraineté nationale. Les rassemblements devant la Maison du gouvernement ne s'amenuisent pas."
 preah_vihear.112.a: "Encaisser les manifestations"
 preah_vihear.120.t: "Le litige arrive au Conseil de sécurité de l'ONU"
 preah_vihear.120.d: "La crise frontalière a atteint le point d'être à l'ordre du jour du Conseil de sécurité. Les États membres ont appelé les deux camps à la retenue, bien qu'aucune action contraignante ne soit attendue."
 preah_vihear.120.a: "Prendre note des débats"
 preah_vihear.121.t: "L’Indonésie propose des observateurs"
 preah_vihear.121.d: "En tant que présidente de l'ASEAN, l'Indonésie a proposé de déployer des observateurs non armés pour surveiller la frontière et signaler les violations du cessez-le-feu. Jakarta le présente comme une mesure de confiance plutôt qu'un règlement médiatisé."
 preah_vihear.121.a: "Accepter les observateurs"
 preah_vihear.121.b: "Décliner l'offre"
 preah_vihear.130.t: "Une défaite décisive"
 preah_vihear.130.d: "L'autre camp a remporté une victoire décisive dans l'épreuve de Preah Vihear, et exploite désormais tous les canaux diplomatiques et de propagande pour faire coller l'humiliation. Aucun terrain n'a changé de mains, mais notre position à la frontière paraît plus faible qu'elle ne l'a été depuis des années."
 preah_vihear.130.a: "Accepter le revers pour l'instant"
 preah_vihear.130.b: "Préparer la guerre à grande échelle"
 preah_vihear.131.t: "L'escarpement est perdu"
 preah_vihear.131.d: "Les forces thaïlandaises ont submergé le terrain contesté et Bangkok a formellement annexé la province khmère du Nord, temple compris. L'arrêt de 1962 qui devait nous appartenir ne pèse rien face aux troupes sur les hauteurs. La nation est sous le choc et exige une réponse que nous ne pourrons peut-être pas donner."
 preah_vihear.131.a: "Un jour sombre pour la nation"
 preah_vihear.131.b: "Nous le reprendrons"
