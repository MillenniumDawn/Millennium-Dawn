 MD_ftc_ex_capital_tt: "§Y航母和水面舰艇群演习§!\n\n£navy_experience N海军经验：§R-450§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y航母和水面舰艇群演习§!持续§H90§!天：\n £fuel_consumption_texticon  海军燃料消耗：§R+25%§!\n £attack_battleship_texticon  主力舰攻击：§G+3%§!\n£doctrine_mastery §H主力舰§!专精：[MD_ftc_exercise_mastery_tt_text] p每天，持续§H90§!天\n\n要求海军至少拥有§H8§!艘舰艇, 包括至少一艘航空母舰、直升机航母、战列舰、战列巡洋舰、巡洋舰、驱逐舰、隐形驱逐舰或重型护卫舰。"
 MD_ftc_ex_escort_tt: "§Y护航演习§!\n\n£navy_experience 海军经验：§R-450§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y护航演习§!持续§H90§!天：\n £fuel_consumption_texticon  海军燃料消耗：§R+25%§!\n £attack_screen_texticon  屏卫舰攻击：§G+3%§!\n£doctrine_mastery §H护航舰艇§!专精：[MD_ftc_exercise_mastery_tt_text]每天，持续§H90§!天\n\n要求海军至少拥有§H8§!艘舰艇，至少包括一艘驱逐舰、护卫舰、隐形护卫舰、轻型护卫舰、隐形轻型护卫舰或巡逻艇。"
 MD_ftc_ex_submarine_tt: "§Y潜艇演习§!\n\n£navy_experience 海军经验：§R-450§!\n£command_power C指挥点数：§R-75§!\n获得国家精神§Y潜艇演习§!持续§H90§!天：\n £fuel_consumption_texticon  海军燃料消耗：§R+25%§!\n £attack_submarine_texticon  潜艇攻击：§G+3%§!\n£doctrine_mastery §H潜艇§!专精：[MD_ftc_exercise_mastery_tt_text]每天，持续§H90§!天\n\n要求海军至少拥有§H8§!艘舰艇，其中包括至少一艘攻击型潜艇或导弹型潜艇。"
 MD_ftc_ex_operations_tt: "§Y舰队战备演习§!\n\n£navy_experience 海军经验：§R-450§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y舰队战备演习§!持续§H90§!天：\n £fuel_consumption_texticon  海军燃料消耗：§R+25%§!\n £organization_texticon  海军组织度：§G+3%§!\n£doctrine_mastery §H支援舰艇§!专精：[MD_ftc_exercise_mastery_tt_text]每天，持续§H90§!天\n\n要求海军至少拥有§H8§!艘舰艇，包括至少一艘修理舰和一艘支援舰，以及至少§H100§!护航船队。"
