 raid_type_ENG_raid_nigeria: "델타 수호 작전"
 raid_type_ENG_raid_zimbabwe: "수호 작전"
 raid_type_ENG_raid_zimbabwe_desc: "짐바브웨를 통치하는 폭군은 나라를 다스릴 자격이 없으므로 즉시 축출되어야 합니다. 영국계 주민과 짐바브웨 원주민에 대한 그의 행위는 그에게 넘지 못할 선이 없음을 보여 주었으며, 분명 그는 우리의 선도 기꺼이 넘으려 하고 있습니다."
 ENG_dartmouth_naval_college_expansion: "다트머스 해군 대학 확장"
 ENG_dartmouth_naval_college_expansion_desc: "다트머스 해군 대학의 확장은 영국의 해양 교육 및 훈련에 대한 상당한 투자를 의미합니다. 풍부한 해군 전통을 바탕으로 한 이 확장은 최첨단 시설, 선진 훈련 과정, 숙련된 해군 인력에 대한 증가하는 수요를 수용할 수 있는 확대된 수용력을 구상합니다."
 ENG_type_32_frigate_guardian_class: "32형 호위함 가디언급"
 ENG_type_32_frigate_guardian_class_desc: "32형 호위함은 영국 해군을 위한 영국의 호위함입니다. 통합 검토의 결과로 2020년 11월 보리스 존슨 총리가 공식 발표했습니다. 26형 및 31형 호위함 이후에 건조되는 이 함정은 범용이며 모듈식으로 설계되어, 영국 해군의 수상 호위 함대를 확충하는 데 도움이 될 것으로 기대됩니다."
 ENG_charles_harmony: "영국 찰스 왕세자 조화 순방"
 ENG_election_unlock_tt: "§Y이 중점은 선거를 통해 새 정부가 구성되었을 때 해금할 수 있습니다§!"
 ENG_army_special_operations_brigade_desc: "육군 특수작전 여단은 은밀하고 어려운 임무를 수행하는 데 전념하는 영국 군사 역량의 정점을 상징합니다. 여러 군에서 차출된 탁월한 인원으로 구성된 이 정예 여단은 비할 데 없는 정밀성과 적응력으로 작전합니다. 첨단 기술과 엄격한 훈련으로 무장한 이 부대는 대테러, 정보 수집 및 기타 파급력이 큰 작전에 최적화되어 있으며, 국가의 방위 및 안보 체계의 핵심 자산으로서의 역할을 공고히 합니다."
 ENG_glasgow_shipbuilidng_tt: "§Y$ENG_refine_natural_bauxite$§!을(를) 완료하면 이 효과가 향상됩니다"
 ENG_refine_natural_bauxite_tt: "§Y$ENG_glasgow_shipbuilidng$§!의 효과가 향상됩니다"
 ENG_the_queens_speech: "[ENG_the_queens_speech_focus_title]"
 ENG_the_queens_speech_desc_key: "군주가 의례가 아닌 국가의 목소리로 말할 때 국민은 다르게 귀를 기울입니다. 여왕의 연설에서 새로운 정치 체제가 선포되고 정부의 의제는 왕실의 위임에 묶이게 될 것입니다. 오늘부터 정책은 왕실의 권위를 지니게 되며, 영국은 하나의 의지를 가진 왕국으로 행동할 것입니다."
 ENG_the_kings_speech_desc_key: "군주가 의례가 아닌 국가의 목소리로 말할 때 국민은 다르게 귀를 기울입니다. 국왕의 연설에서 새로운 정치 체제가 선포되고 정부의 의제는 왕실의 위임에 묶이게 될 것입니다. 오늘부터 정책은 왕실의 권위를 지니게 되며, 영국은 하나의 의지를 가진 왕국으로 행동할 것입니다."
 ENG_inner_circle_andrew.06.t: "앤드루 왕자, 왕실에서 축출"
 ENG_inner_circle_andrew.06.a: "그는 더 이상 남아 있을 수 없다"
 ENG_inner_circle_philip.04.t: "필립 공 서거"
 ENG_inner_circle_philip.04.d: "에든버러 공작 필립 공이 수십 년간 왕실 공적 생활의 중심에 있다가 서거했습니다. 그의 죽음은 군주제의 한 시대의 종말을 의미하며 영국 전역에서 그 빈자리가 느껴질 것입니다."
 ENG_inner_circle_philip.04.a: "국민이 애도한다"
 ENG_overseas_territory: "영국 해외 영토"
