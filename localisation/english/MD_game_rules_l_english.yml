 RULE_REMOVE_MICRO_STATES_SMALLER: "Smaller Nations"
 RULE_REMOVE_MICRO_STATES_SMALLER_DESC: "Removes tiny nations plus slightly larger ones like Bhutan, Gambia, and Djibouti."
