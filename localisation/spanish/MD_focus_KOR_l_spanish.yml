 KOR_samsung_memory_frontier: "Advance the Memory Frontier"
 KOR_samsung_memory_frontier_desc: "Samsung's memory leadership depends on sustained investment in new cell structures, process control, and high-volume manufacturing."
 KOR_samsung_foundry_services: "Build a Foundry Challenger"
 KOR_samsung_foundry_services_desc: "A dedicated merchant foundry can turn Samsung's process expertise into a platform for outside chip designers."
 KOR_samsung_advanced_packaging: "Integrate Advanced Packaging"
 KOR_samsung_advanced_packaging_desc: "Advanced packaging can connect memory, logic, and accelerators into complete computing systems."
 KOR_samsung_supply_resilience: "Secure the Semiconductor Chain"
 KOR_samsung_supply_resilience_desc: "Diversified materials, equipment access, and disciplined inventories will protect Korean production from external shocks."
 KOR_samsung_hbm_ai: "Unite HBM and AI"
 KOR_samsung_hbm_ai_desc: "High-bandwidth memory and advanced logic must become one coordinated Korean computing stack."
 KOR_hanwha_k9_thunder: "Hanwha K9 Thunder"
 KOR_samsung_events.1.t: "NAND and System LSI"
 KOR_samsung_events.1.d: "Samsung's memory business has reached global scale. Management must decide how strongly to pair NAND leadership with the younger System LSI operation."
 KOR_samsung_events.1.a: "Back memory and System LSI"
 KOR_samsung_events.1.b: "Tie memory to consumer devices"
 KOR_samsung_events.2.t: "The S1 Foundry Bet"
 KOR_samsung_events.2.d: "Samsung is considering a major logic investment at its Giheung complex. The project could prepare the company for contract manufacturing beyond its memory base."
 KOR_samsung_events.2.a: "Build the logic foundation"
 KOR_samsung_events.2.b: "Expand memory at scale"
 KOR_samsung_events.3.t: "A Governance Crisis"
 KOR_samsung_events.3.d: "Lee Kun-hee has resigned after a special prosecution exposed weaknesses in Samsung's governance. The group must choose between visible reform and institutional continuity."
 KOR_samsung_events.3.a: "Strengthen compliance and oversight"
 KOR_samsung_events.3.b: "Preserve management continuity"
 KOR_samsung_events.4.t: "Galaxy Enters the Market"
 KOR_samsung_events.4.d: "The first Galaxy S gives Samsung a credible global smartphone platform. Its success could bind displays, memory, logic, and software into a consumer ecosystem."
 KOR_samsung_events.4.a: "Build a global Galaxy ecosystem"
 KOR_samsung_events.4.b: "Keep components at the center"
 KOR_samsung_events.5.t: "Join ASML's Investment Program"
 KOR_samsung_events.5.d: "ASML has invited Samsung to co-invest in the next generation of lithography technology. Participation promises earlier access but binds capital to a Dutch supplier's long research horizon."
 KOR_samsung_events.5.a: "Join the co-investment program"
 KOR_samsung_events.5.a_tt: "Samsung gains foundry capability and supply resilience. ASML records Korea's participation when the Netherlands remains available."
 KOR_samsung_events.5.b: "Retain independent allocation"
 KOR_samsung_events.5.b_tt: "Samsung declines the program and strengthens independent supply planning."
 KOR_samsung_events.6.t: "V-NAND Reaches Production"
 KOR_samsung_events.6.d: "Samsung has begun mass-producing three-dimensional V-NAND, stacking cells vertically to move beyond the limits of planar flash memory."
 KOR_samsung_events.6.a: "Scale vertical memory"
 KOR_samsung_events.7.t: "Techwin Passes to Hanwha"
 KOR_samsung_events.7.d: "Samsung has completed the sale of its defense affiliate to Hanwha. The K9 program now belongs to a defense group separate from Samsung Electronics."
 KOR_samsung_events.7.a: "Transfer the K9 program"
 KOR_samsung_events.8.t: "The Note7 Recall"
 KOR_samsung_events.8.d: "Battery failures have forced a global recall of the Galaxy Note7. Samsung must choose whether to accept a deep quality overhaul or contain the immediate commercial damage."
 KOR_samsung_events.8.a: "Rebuild the quality system"
 KOR_samsung_events.8.b: "Limit the corporate response"
 KOR_samsung_events.9.t: "A Dedicated Foundry"
 KOR_samsung_events.9.d: "Samsung is separating its foundry business into a dedicated organization. The change can court outside designers or reinforce a vertically integrated device strategy."
 KOR_samsung_events.9.a: "Compete for merchant customers"
 KOR_samsung_events.9.b: "Integrate the computing stack"
 KOR_samsung_events.10.t: "7LPP Enters Production"
 KOR_samsung_events.10.d: "Samsung has begun production using its 7LPP process with extreme ultraviolet lithography, bringing EUV into commercial logic manufacturing."
 KOR_samsung_events.10.a: "Industrialize EUV production"
 KOR_samsung_events.11.t: "The Galaxy Fold Relaunch"
 KOR_samsung_events.11.d: "After delaying the Galaxy Fold to correct display failures, Samsung is ready to relaunch the device with a redesigned protective structure."
 KOR_samsung_events.11.a: "Relaunch after correction"
 KOR_samsung_events.12.t: "The V1 EUV Line"
 KOR_samsung_events.12.d: "Samsung's V1 line at Hwaseong is entering operation as a dedicated EUV manufacturing facility for advanced logic and memory products."
 KOR_samsung_events.12.a: "Expand EUV manufacturing"
 KOR_samsung_events.13.t: "The Taylor Investment"
 KOR_samsung_events.13.d: "Samsung has announced a major advanced foundry investment in Taylor, Texas. The project would diversify capacity while deepening the company's presence in the United States."
 KOR_samsung_events.13.a: "Build the Taylor foundry"
 KOR_samsung_events.13.b: "Prioritize Korean capacity"
 KOR_samsung_events.14.t: "Three-Nanometer GAA"
 KOR_samsung_events.14.d: "Samsung has begun producing chips with a three-nanometer gate-all-around process, betting on a new transistor structure for the next foundry generation."
 KOR_samsung_events.14.a: "Scale the GAA process"
 KOR_samsung_events.15.t: "Memory for the AI Era"
 KOR_samsung_events.15.d: "Samsung's memory, foundry, packaging, and device businesses now face an AI-driven market. Their accumulated choices will determine the company's strategic position. This assessment is a gameplay synthesis, not a historical measurement."
 KOR_samsung_events.15.a: "Assess Samsung's strategic position"
 KOR_samsung_integrated_ai_semiconductor_stack: "Integrated AI Semiconductor Stack"
 KOR_samsung_integrated_ai_semiconductor_stack_desc: "Samsung coordinates memory, foundry capacity, packaging, and devices as a single AI-era industrial platform."
 KOR_samsung_merchant_foundry_challenger: "Merchant Foundry Challenger"
 KOR_samsung_merchant_foundry_challenger_desc: "A customer-facing foundry organization gives global designers a second advanced manufacturing platform."
 KOR_samsung_memory_ai_infrastructure_champion: "Memory and AI Infrastructure Champion"
 KOR_samsung_memory_ai_infrastructure_champion_desc: "Leadership in advanced memory makes Samsung a central supplier to data centers and AI systems."
 KOR_samsung_global_galaxy_ecosystem: "Global Galaxy Ecosystem"
 KOR_samsung_global_galaxy_ecosystem_desc: "Samsung's devices connect displays, components, software, and global distribution into a durable consumer platform."
 KOR_samsung_disciplined_diversified_champion: "Disciplined Diversified Champion"
 KOR_samsung_disciplined_diversified_champion_desc: "Balanced governance and broad technical depth sustain Samsung even without one dominant strategic route."
 KOR_samsung_market_pressure_light: "Light Semiconductor Pressure"
 KOR_samsung_market_pressure_light_desc: "Tool queues and market demand are creating manageable strain across Korean semiconductor projects."
 KOR_samsung_market_pressure_moderate: "Moderate Semiconductor Pressure"
 KOR_samsung_market_pressure_moderate_desc: "Equipment backlogs and access constraints are slowing Korean capacity expansion and engineering work."
 KOR_samsung_market_pressure_severe: "Severe Semiconductor Pressure"
 KOR_samsung_market_pressure_severe_desc: "A tight equipment market and strategic access controls are imposing serious delays on Korean semiconductor investment."
