 Sov_warsaw_pact.1.a: "새 조약을 체결하라!"
 Sov_warsaw_pact.2.t: "바르샤바 조약의 부활"
 Sov_warsaw_pact.2.d: "아무도 예상하지 못한 일이 일어났습니다. 존재하지 않을 것 같던 공산주의 과거에서 바르샤바 조약이 돌아왔습니다. 폴란드의 공산주의 혁명과 그곳에 수립된 친러시아 소비에트 정권이 이 군사 동맹의 부활을 발표했습니다. 세계는 다시 한번 냉전의 문턱에 서 있습니다."
 Sov_warsaw_pact.2.a: "신이 우리를 도우시기를"
 Sov_warsaw_pact.3.t: "다시 우리의 것이 된 폴란드"
 Sov_warsaw_pact.3.d: "폴란드에서 친공산주의 쿠데타가 일어나 우리에게 충성하는 정부가 집권했습니다. 우리는 이미 우리와 폴란드 사이의 새로운 바르샤바 조약 창설을 발표했으며, 이제 이 절차를 합법화하는 일만 남았습니다."
 Sov_warsaw_pact.3.a: "소련의 영광"
 Sov_warsaw_pact.4.t: "바르샤바 조약의 확대"
 Sov_warsaw_pact.4.d: "최근 바르샤바 조약이 복원되면서 많은 정치인과 전문가들이 질문을 던지고 있습니다. 새로운 확장은 언제 이루어질 것인가? 오늘 바르샤바 조약은 동맹의 새로운 확장을 축하하고 있습니다. 새로운 냉전이 시작되었고, 동유럽에서 미국의 영향력은 서서히 무너지고 있습니다."
 Sov_warsaw_pact.4.a: "상황이 더욱 긴장되고 있다..."
 Sov_warsaw_pact.5.t: "새로운 동맹과 새로운 기회"
 Sov_warsaw_pact.5.d: "우리의 외교는 서방 외교와 달리 다시 한번 효율성을 입증했습니다. 새로운 동맹은 유럽에서의 우리 군사적 주둔과 나토 국가들에 대한 외교적 압박에 새로운 기회를 열어줍니다. 우리는 초강대국의 지위를 영원히 확보하기 위해 이 정책을 계속해야 합니다."
 Sov_warsaw_pact.5.a: "소련에 영광을!"
 Sov_warsaw_pact.6.t: "동맹 가입"
 Sov_warsaw_pact.6.d: "우리 국민은 서방이 우리를 속이고 있음을 깨달았습니다. 서방은 우리의 독립과 문화, 그리고 인구를 파괴하는 방식을 사용하고 있습니다. 오랜 동맹인 소련의 날개 아래로 들어가 이를 멈춰야 합니다. 함께라면 이 서방의 전염병을 물리칠 수 있습니다."
 Sov_warsaw_pact.6.a: "새 조약을 체결하라!"
 sov_warsaw_pact.9.t: "동독의 공산주의 봉기"
 sov_warsaw_pact.9.d: "상황이 통제를 벗어났습니다. 독립적인 동독을 창설하기 위한 봉기가 동독에서 일어나, 국가의 안정을 보장하려던 우리의 노력은 헛수고가 되었습니다. 군의 도움과 소련의 비밀 재정 및 무기 지원으로 국가 동부의 모든 행정 및 군사 건물이 장악되었습니다. 베를린은 나머지 국가로부터 단절되었습니다. 소련과의 분쟁에 휘말릴 위험 때문에 우리는 새로 형성된 동독 영토에 대해 국지적 공격을 수행할 수밖에 없습니다. 하지만 소련의 이익 지대로 직접 개입을 단행할 수도 있습니다. 그러나 이는 제3차 세계 대전으로 이어질 수 있습니다. 우리는 어떻게 해야 합니까?"
 sov_warsaw_pact.9.a: "빈대처럼 짓눌러 버리겠다!"
