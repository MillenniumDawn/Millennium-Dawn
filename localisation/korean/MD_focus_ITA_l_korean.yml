 italy_md.18.o2: "거부하라."
 italy_md.38.o3: "연립 정당 개편"
 italy_md.43.t: "로마의 도시 폐기물 위기!"
 italy_md.43.d: "부실한 계획, 수년간 방치된 기반시설, 님비 현상, 마피아 활동, 정치적 부패가 겹치면서 로마의 폐기물 수거 및 관리 체계가 붕괴했습니다. 한때 아름다웠던 도시의 모든 길모퉁이에 쓰레기 더미가 쌓여 있으나, 이를 치울 여력은 거의 없고 모든 일반 매립지와 비상 매립지가 가득 찬 탓에 쓰레기를 어디에 둘지에 대한 구상조차 거의 없습니다."
 italy_md.43.o1: "님비 세력을 단속하고 소각장을 건설한다"
 italy_md.43.o2: "폐기물을 독일과 오스트리아로 보낸다"
 italy_md.43.o3: "우리를 도와줄 만한 사람들을 알고 있다.."
 italy_md.44.t: "이탈리아의 군사 협력 제안"
 italy_md.44.d: "이탈리아는 우리의 장비를 구매하여 양국 군 간의 협력을 증진하기를 희망합니다."
 italy_md.44.o1: "승인"
 italy_md.44.o2: "거부하라."
 italy_md.45.t: "로마 제국 완전 복원"
 italy_md.45.d: "우리는 마침내 로마 제국의 정당한 국경을 되찾았습니다. 이제 갓 되살아난 불사조가 세계 위로 날개를 펼칠 때입니다."
 italy_md.45.o1: "로마 인빅타"
 italy_md.46.t: "건축 르네상스"
 italy_md.46.d: "우리는 영광스러운 과거의 수많은 걸작을 재건했으며, 그 과정에서 세계에 영감을 주는 건축 르네상스를 일으켰습니다."
 italy_md.46.o1: "장엄하다"
 italy_md.47.t: "동맹 정당의 연립 탈퇴"
 italy_md.47.d: "인기도가 심각하게 하락했음을 보여주는 여론조사에 점점 불안해진 우리 파트너 중 한 곳이 야당에 있으면서 대중의 지지를 높이기를 기대하며 집권 연립을 탈퇴하기로 결정했습니다."
 italy_md.47.o1: "어쩔 수 없는 일이다."
 italy_md.48.t: "로마화 완료"
 italy_md.48.d: "옛 로마 제국의 한 속주가 성공적으로 통합되었으며, 그곳 주민들은 이제 자랑스러운 로마 시민이 되었습니다."
 italy_md.48.o1: "로마 아이테르나"
 italy_md.49.t: "이탈리아의 위협"
 italy_md.49.d: "이탈리아가 우리 영토 일부에 대해 영유권을 주장하며, 우리가 해당 영토의 양도를 거부할 경우 전쟁을 일으키겠다고 위협하는 것으로 보입니다."
 italy_md.49.o1: "전면전의 위험은 감수할 수 없다"
 italy_md.49.o2: "위협을 무시한다"
 italy_md.50.t: "이탈리아의 영토 매입 제안"
 italy_md.50.d: "이탈리아가 우리 영토 일부에 대해 영유권을 주장하며, 우리에게 이를 매각할 것을 제안하는 것으로 보입니다."
 italy_md.50.o1: "합리적인 거래로 보인다"
 italy_md.50.o2: "받아들일 수 없다"
 italy_md.51.t: "카르니올라 요구"
 italy_md.51.d: "카르니올라는 정당한 이탈리아의 영토이며, 이를 되찾는 것은 필수적입니다. 폭력에 의존하지 않고도 이 과업을 성공시킬 수 있을지도 모릅니다."
 italy_md.51.o1: "그들을 위협하다"
 italy_md.51.o2: "뇌물을 주다"
 italy_md.52.t: "달마티아 요구"
 italy_md.52.d: "달마티아는 정당한 이탈리아의 영토이며, 이를 되찾는 것은 필수적입니다. 폭력에 의존하지 않고도 이 과업을 성공시킬 수 있을지도 모릅니다."
 italy_md.52.o1: "그들을 위협하다"
 italy_md.52.o2: "뇌물을 주다"
 italy_md.53.t: "사부아 요구"
 italy_md.53.d: "사부아는 이탈리아를 통일한 왕조의 조상 대대로의 고향이며, 이를 되찾는 것은 필수적입니다. 폭력에 의존하지 않고도 이 과업을 성공시킬 수 있을지도 모릅니다."
 italy_md.53.o1: "그들을 위협하다"
 italy_md.53.o2: "뇌물을 주다"
 italy_md.54.t: "알리탈리아의 구제금융 요청"
 italy_md.54.d: "알리탈리아는 이탈리아의 국적 항공사이자 최대 항공사이지만, 형편없는 경영, 잉여 인력을 정리하지 못하는 무능, 저가 항공사와 고속철도와의 경쟁 탓에 수년째 고전하고 있습니다. 그들의 경영진은 비행기를 계속 띄우고 급여를 계속 지급하기 위해 다시 한번 정부에 \\"대출\\"을 요구하고 있으나, 이 돈이 결코 상환되지 않으리라는 것은 모두가 알고 있습니다. 정부가 이 회사의 지분을 매각하고 마땅히 그래야 하듯 이번에야말로 파산하도록 내버려 둘 수 있다면 좋을 텐데 말입니다!"
 italy_md.54.o1: "이번이 마지막이길 바라자."
 italy_md.54.o2: "여기까지다. 이 좀비 기업의 자산을 원하는 이에게 팔아넘겨라."
 italy_md.55.t: "티치노-그라우뷘덴 요구"
 italy_md.55.d: "티치노와 그라우뷘덴은 정당한 이탈리아의 영토이며, 이를 되찾는 것은 필수적입니다. 폭력에 의존하지 않고도 이 과업을 성공시킬 수 있을지도 모릅니다."
 italy_md.55.o1: "그들을 위협하다"
 italy_md.55.o2: "뇌물을 주다"
 italy_md.56.t: "코르시카 요구"
 italy_md.56.d: "코르시카는 지리적으로 이탈리아에 속하며 수세기 동안 제노바의 통치를 받았으므로, 이를 되찾는 것은 필수적입니다. 폭력에 의존하지 않고도 이 과업을 성공시킬 수 있을지도 모릅니다."
 italy_md.56.o1: "그들을 위협하다"
 italy_md.56.o2: "뇌물을 주다"
 italy_md.57.t: "니스 요구"
 italy_md.57.d: "니스는 사부아와 함께 프랑스에 어리석게 할양되었으며, 반드시 되찾아야 합니다. 폭력에 의존하지 않고도 이 과업을 이룰 수 있을지도 모릅니다."
 italy_md.57.o1: "그들을 위협하다"
 italy_md.57.o2: "뇌물을 주다"
 italy_md.58.t: "이오니아 제도 요구"
 italy_md.58.d: "코르푸와 자킨토스 같은 이오니아 제도는 수세기 동안 이탈리아의 영토였으므로 우리는 이를 되찾아야 합니다. 폭력에 의존하지 않고도 이 과업을 성공시킬 수 있을지도 모릅니다."
 italy_md.58.o1: "그들을 위협하다"
 italy_md.58.o2: "뇌물을 주다"
 italy_md.59.t: "풀리아의 크실레라 발생"
 italy_md.59.d: "특히 올리브나무에 치명적인 식물 해충인 크실레라 파스티디오사가 풀리아의 살렌토 지역에서 보고되었습니다. 그 지역에서 올리브 생산이 얼마나 중요한지를 고려할 때, 해충이 번식할 공간을 없애기 위해 일부 나무를 옮겨 심어 해충의 확산을 막는 것이 필수적입니다. 안타깝게도 현지 주민들과 그들이 뽑은 정치인들은 과학에 귀 기울이느니 모든 나무가 죽고 불타는 편을 택할 것입니다."
 italy_md.59.o1: "수백 년 된 올리브나무를 베라고? 터무니없다."
 italy_md.59.o2: "이를 막기 위해 필요한 조치를 시행한다."
 italy_md.60.t: "G8 시위에서의 경찰 폭력"
 italy_md.60.d: "제노바에서 열린 G8 회의 중 반세계화 운동에 속한 시위대가 경찰과 격렬하게 충돌했습니다. 충돌이 너무나 격렬하여 최소 한 명이 사망했습니다."
 italy_md.60.o1: "경찰은 자기 임무를 다했을 뿐이다."
 italy_md.60.o2: "책임자를 처벌하라."
 italy_md.61.t: "모란디 다리 붕괴"
 italy_md.61.d: "모란디 다리는 제노바 인근의 중요한 고속도로 교량으로, 1960년대에 리카르도 모란디의 설계로 건설되었습니다. 폭우와 강풍, 번개를 동반한 강력한 폭풍으로 다리가 붕괴하여 43명이 사망했습니다."
 italy_md.61.o1: "희생자들을 위해 기도하자."
 italy_md.62.t: "가뭄"
 italy_md.62.d: "강수량이 극히 적고 극심한 더위가 이어지면서 가뭄이 발생했습니다. 우리의 수자원 기반시설은 끔찍한 상태이며, 지방자치단체가 관리하는 극히 작은 수많은 지역 기관으로 쪼개져 있고, 이 기관들은 종종 지역 정치인들의 자리 보전용으로 쓰이고 있습니다. 다음 가뭄에 대비하기 위해서는 개혁이 필요합니다."
 italy_md.62.o1: "물을 배급하고 최선을 바란다."
 italy_md.62.o2: "우리는 이에 대비해 왔다."
 italy_md.63.t: "이탈리아의 관광 협정 제안"
 italy_md.63.d: "우리 두 나라는 아름다운 곳이니, 관광객이 가능한 한 쉽게 오갈 수 있다면 양국 모두에 분명 이익이 될 것입니다."
 italy_md.63.o1: "수락한다"
 italy_md.63.o2: "거부하라."
 italy_md.64.t: "이탈리아의 이민자 협정 제안"
 italy_md.64.d: "이탈리아는 자국으로 향하는 이민자 유입을 통제하는 데 우리가 협조하는 대가로 금전적 보상을 제안하고 있습니다."
 italy_md.64.o1: "수락한다"
 italy_md.64.o2: "거부하라."
 italy_md.65.t: "이탈리아의 기술 협정 제안"
 italy_md.65.d: "이탈리아는 우리의 기술 지식을 공유하는 대가로 대금을 지불하겠다고 제안하고 있습니다."
 italy_md.65.o1: "수락한다"
 italy_md.65.o2: "거부하라."
 italy_md.66.t: "자유와 평등당, 민주당에서 분당"
 italy_md.66.d: "자유와 평등당은 2017년 전직 반마피아 검사 피에트로 그라소가 민주당에서 분리해 나와 창당한 좌익 정당으로, 민주당의 최좌파 대부분을 대표했습니다. 이 당은 사회적 권리, 여성 및 이민자의 권리, 그리고 정부 개입을 통한 불평등 해소에 강하게 주력하는 사회주의 진보 정당입니다."
 italy_md.66.o1: "흥미롭군"
 italy_md.67.t: "존경받는 제도권 인물의 소환"
 italy_md.67.d: "이탈리아는 심각한 상황에 처해 있으며, 무능한 정치 계층의 처분에 나라를 맡겨 둘 수는 없습니다. 정치적 기회주의와 이념적 광신이라는 족쇄 없이 해야 할 일을 해낼 수 있도록 전문가 정부가 구성되어야 합니다. 이제 이 임무에 적합한 인물을 고르기만 하면 됩니다."
 italy_md.67.o1: "마리오 몬티"
 italy_md.67.o2: "마리오 드라기"
 italy_md.67.o3: "카를로 코타렐리"
 permanent_decrease_in_mafia_drift_TT: "이 지역에서 §t마피아§!의 세력이 영구적으로 약화됩니다."
 permanent_increase_in_mafia_drift_TT: "이 지역에서 §t마피아§!의 세력이 영구적으로 강화됩니다."
 migration_policy_cosa_nostra_drift_TT: "이민자에 관한 우리의 정책은 §2시칠리아§!에서 §2코사 노스트라§!의 불법 활동에 영향을 미칩니다"
 mafia.33.t: "§2시칠리아§!의 방화"
 mafia.33.d: "이탈리아 남부 농촌 지역은 화재에 시달리고 있으며, 이는 종종 §t마피아§! 활동과 연관된 방화로 인한 것입니다. 누가 이 일을 벌였는지에 대해 합리적인 의심은 있지만, 우리 법 체계에서는 단순한 추측만으로 행동할 수 없습니다."
 mafia.33.o1: "유감이군."
 mafia.33.o2: "책임자를 찾아내 처벌한다."
