 EST_fighting_unemployment_idea_desc: "Aktywna polityka rynku pracy zastąpiła bierne wypłacanie świadczeń. Programy przekwalifikowania, dopłaty do wynagrodzeń dla pracodawców zatrudniających osoby długotrwale bezrobotne oraz roboty publiczne w najbardziej dotkniętych kryzysem powiatach przywracają do gospodarki osoby pozostające dotąd poza rynkiem pracy. Program ten jest kosztowny, a na jego efekty trzeba będzie poczekać lata, jednak każde utworzone dzięki niemu miejsce pracy oznacza jedno gospodarstwo domowe mniej uzależnione od pomocy państwa."
