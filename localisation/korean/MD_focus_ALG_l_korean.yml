 ALG_deep_state_category_desc: "알제리 통치에 대한 군과 정보기관(르 푸부아르)의 영향력을 관리합니다.\n\n§Y현재 딥 스테이트 권력:§! [GetDeepStatePowerValue]/30\n§Y위험 수준:§! [GetDeepStateRiskLevel]\n\n기준치:\n§G0-5: 낮음§! | §Y6-10: 보통§! | §O11-15: 상승§!\n§R16-20: 높음§! | §R21-27: 위험§! | §R28+: 쿠데타 임박!§!"
 ALG_assess_deep_state_desc: "정부 내 군과 정보기관의 현재 영향력 수준에 대한 기밀 보고서를 의뢰합니다.\n\n§Y현재 상태:§!\n권력: [GetDeepStatePowerValue]/30\n수준: [GetDeepStatePower]\n위험: [GetDeepStateRiskLevel]"
 deep_state_warning_low_tt: "§G딥 스테이트 영향력: 낮음 ([GetDeepStatePowerValue]/30)\n군의 정치적 영향력이 제한적입니다. 상황이 안정적입니다.§!"
 deep_state_warning_moderate_tt: "§Y딥 스테이트 영향력: 보통 ([GetDeepStatePowerValue]/30)\n군의 영향력이 커지고 있습니다. 상황을 주시하십시오.§!"
 deep_state_warning_medium_tt: "§O딥 스테이트 영향력: 상승 ([GetDeepStatePowerValue]/30)\n정보기관이 정치적으로 활동하기 시작하고 있습니다. 조치를 고려하십시오.§!"
 deep_state_warning_high_tt: "§R딥 스테이트 영향력: 높음 ([GetDeepStatePowerValue]/30)\n장군들이 그림자 정부로 활동하고 있습니다. 즉각적인 조치가 권고됩니다.§!"
 deep_state_warning_critical_tt: "§R딥 스테이트 영향력: 위험 ([GetDeepStatePowerValue]/30)\n민간 정부가 심각한 위험에 처해 있습니다! 즉시 과감한 조치를 취하십시오.§!"
 deep_state_warning_coup_imminent_tt: "§R쿠데타 임박! ([GetDeepStatePowerValue]/30)\n군이 언제든 권력을 장악할 수 있습니다! 비상 조치가 필요합니다.§!"
 ALG_cabinet_category: "내각 관리"
 ALG_cabinet_category_desc: "내각은 부테플리카 대통령 치하 알제리 통치의 공식적 얼굴입니다. 직함과 직책 이면에는 충성, 능력, 그리고 르 푸부아르의 영향력 사이의 끊임없는 균형 잡기가 있습니다.\n\n내각 충성도: [GetCabinetLoyaltyLevel]\n내각 능력: [GetCabinetCompetenceLevel]\n내각 내 딥 스테이트 영향력: [GetCabinetDeepStateLevel]"
 ALG_review_cabinet: "내각 검토"
 ALG_review_cabinet_desc: "내각의 현재 구성과 정치적 균형을 검토합니다."
 ALG_replace_prime_minister: "총리 교체"
 ALG_replace_prime_minister_desc: "정부를 조율하고 정치적 안정을 유지할 새로운 총리를 선택합니다.\n\n현 총리: [GetPMName]"
 ALG_replace_defense_minister: "국방장관 교체"
 ALG_replace_defense_minister_desc: "국방장관을 교체합니다. 이는 매우 민감한 직책이며 어떠한 교체도 군 기득권층을 경계하게 할 수 있습니다.\n\n현 장관: [GetMODName]"
 ALG_replace_interior_minister: "내무장관 교체"
 ALG_replace_interior_minister_desc: "내무부는 국내 치안과 지방 행정을 통제합니다.\n\n현 장관: [GetMOIName]"
 ALG_replace_foreign_minister: "외무장관 교체"
 ALG_replace_foreign_minister_desc: "알제리의 외교 노선을 이끌 새로운 외무장관을 임명합니다.\n\n현 장관: [GetMOFAName]"
 ALG_replace_finance_minister: "재무장관 교체"
 ALG_replace_finance_minister_desc: "국가 예산과 경제 정책을 이끌 새로운 재무장관을 임명합니다.\n\n현 장관: [GetMOFName]"
 ALG_replace_energy_minister: "에너지장관 교체"
 ALG_replace_energy_minister_desc: "에너지부는 알제리 탄화수소 경제의 핵심입니다.\n\n현 장관: [GetMOEName]"
 ALG_replace_justice_minister: "법무장관 교체"
 ALG_replace_justice_minister_desc: "사법부와 정치적 기소를 좌우할 새로운 법무장관을 임명합니다.\n\n현 장관: [GetMOJName]"
 ALG_replace_intelligence_chief: "정보 수장 교체"
 ALG_replace_intelligence_chief_desc: "정보 수장을 교체하는 것은 가능한 개혁 중 가장 위험한 것 중 하나입니다. 보안 기관은 권력을 조용히 내놓지 않습니다.\n\n현 수장: [GetDRSName]"
 ALG_cabinet_reshuffle: "내각 개편"
 ALG_cabinet_reshuffle_desc: "대대적인 내각 개편을 단행하고 정부의 정치적 방향을 재정립합니다."
 ALG_demand_cabinet_loyalty: "내각 충성 요구"
 ALG_demand_cabinet_loyalty_desc: "장관들이 대통령직에 대한 충성을 공개적으로 재확인하도록 강제합니다."
 ALG_reward_cabinet: "내각 포상"
 ALG_reward_cabinet_desc: "내각의 충성도를 높이기 위해 호의, 후원, 승진을 나누어 줍니다."
 ALG_anti_corruption_drive: "반부패 운동"
 ALG_anti_corruption_drive_desc: "내각 내부에서 반부패 운동을 시작합니다. 이는 뿌리 깊은 네트워크를 약화시킬 수 있지만 딥 스테이트를 자극할 수도 있습니다."
 ALG_strengthen_pm_authority: "총리 권한 강화"
 ALG_strengthen_pm_authority_desc: "내각의 규율과 정부 조율을 개선하기 위해 총리의 권한을 강화합니다."
