 bulg.1.t: "불가리아의 독일 투자 요청"
 bulg.1.d: "소피아는 독일식 정부 모델을 채택했으며, 베를린에 불가리아 경제에 대한 투자로 이를 뒷받침해 달라고 요청하고 있습니다. 무엇에 자금을 댈지 우리가 선택할 수 있습니다."
 bulg.1.a: "$industrial_complex$ 및 $fossil_powerplant$ 자금 지원"
 bulg.1.b: "Fund a $arms_factory$ and a $fossil_powerplant$"
 bulg.2.t: "독일의 투자 거절"
 bulg.2.d: "베를린은 우리 경제에 대한 투자를 거절했습니다."
 bulg.2.a: "Unfortunate"
 bulg.3.t: "독일의 불가리아 투자"
 bulg.3.d: "베를린은 우리 경제에 투자하기로 동의했습니다. 독일 자본이 새로운 생산 능력과 이를 가동할 $fossil_powerplant$을(를) 건설할 것입니다."
 bulg.3.a: "Excellent"
