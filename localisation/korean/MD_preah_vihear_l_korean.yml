 preah_vihear_news.4.t: "프레아비히어의 결정적 승리"
 preah_vihear_news.4.d_sia: "태국이 프레아비히어에서 오래 이어진 대치에서 결정적 승리를 거두어 캄보디아를 굴욕적인 외교적 후퇴로 몰아넣었습니다. 영토가 넘어간 것은 아니지만, 방콕은 이 대치를 국가적 승리라고 주장하고 있습니다."
 preah_vihear_news.4.d_cbd: "캄보디아가 프레아비히어에서 오래 이어진 대치에서 결정적 승리를 거두어 태국을 굴욕적인 외교적 후퇴로 몰아넣었습니다. 영토가 넘어간 것은 아니지만, 프놈펜은 이 대치를 국가적 승리라고 주장하고 있습니다."
 preah_vihear_news.4.o1: "일단은 결정적으로 매듭지어진 앙숙 관계"
 SIA_preah_vihear_vindicated: "프레아비히어의 정당성 입증"
 SIA_preah_vihear_vindicated_desc: "태국이 사원 단지 주변 분쟁 지역을 확보했으며, 정부는 자국에 유리한 조건으로 매듭지은 오랜 국경 분쟁의 정치적 성과를 누리고 있습니다."
 SIA_preah_vihear_humiliation: "프레아비히어의 굴욕"
 SIA_preah_vihear_humiliation_desc: "캄보디아가 이제 프레아비히어 주변 분쟁 지역을 통제하고 있으며, 이 손실은 정치권 전반에서 외교와 무력 양면의 실패로 받아들여지고 있습니다."
 CBD_preah_vihear_vindicated: "프레아비히어의 정당성 입증"
 CBD_preah_vihear_vindicated_desc: "캄보디아가 사원 단지 주변 분쟁 지역을 확보했으며, 정부는 자국에 유리한 조건으로 매듭지은 오랜 국경 분쟁의 정치적 성과를 누리고 있습니다."
 CBD_preah_vihear_humiliation: "프레아비히어의 굴욕"
 CBD_preah_vihear_humiliation_desc: "태국이 이제 프레아비히어 주변 분쟁 지역을 통제하고 있으며, 이 손실은 정치권 전반에서 외교와 무력 양면의 실패로 받아들여지고 있습니다."
 preah_vihear_observers: "인도네시아 국경 참관단"
 preah_vihear_observers_desc: "아세안이 중재한 합의에 따라 비무장 인도네시아 감시단이 프레아비히어 국경을 따라 배치되어 휴전 위반을 감시하며, 양국 정부가 분쟁을 식힐 수 있는 명분을 제공합니다."
 preah_vihear_icj_grounds_TT: "국경 긴장이 74보다 높거나, 태국이 이미 국경 너머를 공격했음"