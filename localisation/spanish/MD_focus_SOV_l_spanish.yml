 SOV_wagner_drp_instructors: "Enviar al Grupo Wagner a §Y[DRP.GetNameWithFlag]§!"
 SOV_computing_sovereignty_chinese_substitution: "Sustitución china"
 SOV_computing_sovereignty_chinese_substitution_desc: "Los proveedores chinos reemplazan los componentes occidentales en toda la infraestructura informática rusa. La escasez se mitiga, pero la dependencia se ha desplazado en lugar de desaparecer."
 SOV_computing_sovereignty_mature_node_specialization: "Especialización en nodos maduros"
 SOV_computing_sovereignty_mature_node_specialization_desc: "Rusia se concentra en una producción nacional sólida en nodos de fabricación maduros en lugar de perseguir la vanguardia tecnológica. Los procesadores avanzados todavía requieren una ruta de fundición externa."
 SOV_computing_sovereignty_parallel_import_economy: "Economía de importación paralela"
 SOV_computing_sovereignty_parallel_import_economy_desc: "Las rutas de adquisición no oficiales mantienen disponible el hardware extranjero a un coste más alto y con menor previsibilidad. La escasez se gestiona, pero no se soluciona."
 SOV_computing_sovereignty_sovereign_computing_stack: "Estructura informática soberana"
 SOV_computing_sovereignty_sovereign_computing_stack_desc: "El diseño nacional de procesadores, la fabricación, el software y la integración de sistemas conforman ahora una infraestructura nacional coherente. Mantenerla exige inversiones y conocimientos continuos."
 sov_economic.300.a: "Apoyar la arquitectura Elbrús"
 sov_economic.300.b: "Construir sobre una arquitectura extranjera probada"
 sov_economic.300.d: "Una línea de procesadores comerciales construida en torno a la arquitectura Elbrús de MCST podría preservar la experiencia de diseño rusa fuera del ecosistema x86. Convertir esa promesa en hardware desplegable requerirá un soporte paciente, software compatible y un acceso continuo a la fabricación."
 sov_economic.300.t: "La apuesta de Elbrús"
 sov_economic.301.a: "Garantizar el préstamo del VEB"
 sov_economic.301.b: "Retener la garantía hasta que mejore la viabilidad económica"
 sov_economic.301.d: "Angstrem-T propone adquirir una línea de producción de las antiguas instalaciones de AMD en Dresde e instalarla en Zelenograd. El proyecto podría ampliar la capacidad nacional, pero la deuda, el riesgo de instalación y un proceso de fabricación antiguo amenazan su viabilidad económica."
 sov_economic.301.t: "El proyecto Angstrem-T"
 sov_economic.302.a: "Hacer obligatoria la sustitución en todos los ministerios"
 sov_economic.302.b: "Mantener abierta la adquisición donde el equipamiento nacional se quede corto"
 sov_economic.302.d: "Las sanciones y la ansiedad estratégica han llevado la sustitución de importaciones de ser un mero lema a una doctrina. Los ministerios ahora exigen procesadores Elbrús, chips de sistema Baikal y Astra Linux para reemplazar los sistemas extranjeros, incluso cuando las alternativas nacionales siguen siendo costosas o inmaduras."
 sov_economic.302.t: "La doctrina de sustitución de importaciones"
 sov_economic.303.a: "Prepararse para un embargo prolongado"
 sov_economic.303.d: "Los controles de exportación coordinados restringen ahora el acceso de Rusia a semiconductores avanzados, automatización de diseño electrónico y equipos de fabricación, y TSMC ha detenido por completo la fabricación de componentes Baikal y Elbrús. El sector informático puede absorber el embargo y pagar por la sustitución, o construir las redes necesarias para eludirlo."
 sov_economic.303.t: "El embargo tecnológico"
 sov_economic.304.a: "Recurrir a los nodos que todavía podemos fabricar"
 sov_economic.304.b: "Recurrir a una fundición china"
 sov_economic.304.c: "Financiar una línea de producción nacional"
 sov_economic.304.d: "TSMC ya no aceptará pedidos de procesadores rusos bajo el nuevo régimen de control de exportaciones. Los productos Elbrús fabricados a través de TSMC carecen ahora de su ruta de producción establecida, lo que convierte un golpe de suministro en una crisis estratégica."
 sov_economic.304.t: "La puerta de TSMC se cierra"
 sov_economic.305.a: "Aceptar las fundiciones chinas como sustituto"
 sov_economic.305.e: "Retirarse a los nodos maduros que realmente podemos construir"
 sov_economic.305.d: "Años de inversión y gestión de crisis han vinculado la línea Elbrús de MCST, Baikal, las fábricas de Zelenograd y las empresas de software nacionales en una única estrategia nacional. El equilibrio que se alcance ahora decidirá si Rusia mantiene una vanguardia propia, vive en una dependencia gestionada o se conforma con lo que todavía puede construir."
 sov_economic.305.t: "Una estructura informática soberana"
 sov_economic.303.b: "Construir redes para eludir los controles"
 sov_economic.305.b: "Formalizar la economía de importación paralela"
 sov_economic.305.c: "Declarar completada la estructura soberana"
 SOV_khodorkovsky_verdict_delivered_TT: "Se ha dictado un veredicto en el caso Jodorkovski"
 SOV_verdict_scorecard_TT: "§HLa lucha con los oligarcas hasta ahora:§!\nFallos progubernamentales: §Y[?SOV_statist_verdicts]§!/§Y5§!\nFallos prooligárquicos: §Y[?SOV_oligarch_verdicts]§!/§Y5§!\nUna mayoría de fallos §Yprogubernamentales§! abre el §Ycorporativismo de Estado§!, una mayoría de fallos §Yprooligárquicos§! abre la §Yrepública oligárquica§!, y al menos §Y2§! fallos de cada tipo abren el §Ysistema económico combinado§!."
 SOV_ruling_statist_TT: "§HSi fallamos a favor del Estado:§!"
 SOV_ruling_statist_hardline_TT: "§HSi lo encarcelamos en lugar de comprar sus acciones:§!"
 SOV_ruling_oligarch_TT: "§HSi fallamos a favor de los oligarcas:§!"
 SOV_media_path_fork_TT: "§YLiberar a Gusinski§! mantiene las cadenas en manos privadas y abre la línea de §Yradiodifusión independiente§! en lugar de la línea de medios estatales. En cualquier caso, la rama continúa."
 SOV_economic_rus_hydro_TT: "La producción hidroeléctrica en §Y[671.GetName]§!, §Y[1065.GetName]§! y §Y[1069.GetName]§! aumentó en un §G25%§!"
 SOV_economic_rus_hydro_expanded_TT: "La producción hidroeléctrica en toda la §Ycascada Volga-Kama§! aumentó en un §G25%§!"
 SOV_has_empowered_fsb: "El §YFSB§! responde ante los siloviki"
 SOV_has_internal_troops: "Las §YTropas Internas§! no han sido transferidas a la Rosgvardiya"
 SOV_sber_ipo_done_tt: "¡Sberbank ha §Ysalido a bolsa§!"
 SOV_economy_modifier: "Economía rusa"
 SOV_economy_modifier_desc: "El registro contable permanente de las empresas que el Estado posee, coposee o en las que se apoya. Cada empresa devuelta al control de Moscú deja su huella aquí."
 SOV_capitalisation_modifier: "Capitalización corporativa"
 SOV_capitalisation_modifier_desc: "El valor que el mercado otorga a nuestros campeones nacionales. Cuanto mayor sea su capitalización, más rendimiento obtendrán el tesoro y las mesas de investigación."
 SOV_landforce_modifier: "Fuerzas terrestres"
 SOV_landforce_modifier_desc: "La rama más grande de las Fuerzas Armadas de Rusia, estructurada en torno a formaciones de tanques y de fusileros motorizados equipadas con las familias BMP, BTR y del T-72 al T-90. La reforma del 'Nuevo Look' descompuso la estructura heredada de divisiones para convertirla en brigadas de preparación permanente, una decisión que se revirtió más tarde al reconstituirse las divisiones a lo largo de la frontera occidental."
 SOV_airforce_modifier: "Fuerzas Aeroespaciales"
 SOV_airforce_modifier_desc: "Creadas mediante la fusión de la Fuerza Aérea con las Tropas de Defensa Aeroespacial, situando la aviación, la defensa aérea y las operaciones espaciales militares bajo un único mando. Su fuerza de combate descansa sobre los derivados del Su-27, la flota de ataque Su-34 y la red de alerta temprana encargada de detectar lanzamientos de misiles."
 SOV_navy_modifier: "Flota naval"
 SOV_navy_modifier_desc: "Dividida entre las flotas del Norte, del Pacífico, del Báltico y del mar Negro junto a la flotilla del Caspio, teniendo como centro de gravedad a la fuerza de submarinos con misiles balísticos. Ha subsistido durante mucho tiempo gracias a cascos soviéticos envejecidos, a la espera de que los programas Borei y Yasen entreguen sus reemplazos."
 SOV_intelligence_modifier: "Servicios de seguridad"
 SOV_intelligence_modifier_desc: "El área de criptografía y señales perteneció en su día a la FAPSI, la Agencia Federal de Comunicaciones e Información del Gobierno, hasta que fue disuelta y sus funciones se dividieron entre el FSB, el SVR y el GRU. Junto a ella se encuentran los servicios que vigilan el propio país: la Rosgvardiya, extraída de las tropas del Ministerio del Interior y subordinada directamente al presidente, los destacamentos antidisturbios del OMON que absorbió, y el GRU, que dirige la inteligencia militar y las brigadas spetsnaz en el extranjero."
 SOV_corrupt_oligarchy_desc: "Las subastas de 'préstamos por acciones' de mediados de la década de 1990 entregaron los mayores activos industriales y energéticos de Rusia a un estrecho círculo de financieros por una fracción de su valor real. La oligarquía resultante trata al Estado como una ficha de cambio, y ninguna reforma sale adelante sin su consentimiento.\n§W--------------§!\nEste espíritu nacional se §Reliminará§! mediante los enfoques de la §Yrama política§! que resuelvan la cuestión de la propiedad de la industria rusa. Cada senda política ofrece una solución."
 SOV_the_plundered_russian_navy1_desc: "Una década de tripulaciones sin cobrar y cascos canibalizados ha dejado a la mayor parte de la flota amarrada en puerto. Lo que todavía navega lo hace con piezas prestadas y patrullas reducidas.\n§W--------------§!\nEste espíritu nacional se §Gmitigará§! a §HFlota parcialmente reconstruida§! mediante el enfoque §HReformas de la Armada rusa§!."
 SOV_the_plundered_russian_navy2_desc: "Los astilleros vuelven a funcionar y se ha eliminado el peor óxido, pero la flota sigue construida en torno a cascos diseñados para otra armada.\n§W--------------§!\nEste espíritu nacional se §Gmitigará§! a §HFlota casi reconstruida§! mediante el enfoque §HDoctrina naval actualizada§!, que requiere primero que haya desaparecido el espíritu nacional de §HEjército obsoleto§!."
 SOV_the_plundered_russian_navy3_desc: "Existe ahora una doctrina para la flota que Rusia realmente puede permitirse. Solo queda pendiente el propio programa de modernización.\n§W--------------§!\nEste espíritu nacional se §Reliminará§! mediante el enfoque §HIniciar la modernización de nuestra flota§!."
 SOV_otkos_army_idea_desc: "Los reclutas que pueden pagar no sirven en el ejército. El dinero de los sobornos mantiene tranquilo al cuerpo de oficiales y coopera a la Duma, a costa de la afluencia de soldados que se le prometió al ejército.\n§W--------------§!\nEste espíritu nacional se §Rpierde§! si los §Y[communist_state_L]§! o los §Y[Neutral_Communism_L]§! toman el poder."
 SOV_oligarch_supply_army_idea_desc: "Los hombres que poseen la industria rusa han acordado financiar las unidades estacionadas cerca de sus activos, pagando el combustible, las raciones y las reparaciones que el presupuesto estatal no cubre.\n§W--------------§!\nEste espíritu nacional solo se mantiene mientras gobiernen los §Y[Monarchist_L]§! o los §Y[Nat_Populism_L]§!, y se §Rpierde§! en el momento en que lo haga cualquier otra facción."
 SOV_leib_guard_idea_desc: "Los históricos regimientos de la guardia han sido reconstituidos como escolta del soberano, atrayendo a lo mejor de las fuerzas especiales a una formación que responde ante el trono.\n§W--------------§!\nEste espíritu nacional se §Rpierde§! si los §Y[communist_state_L]§! o los §Y[Neutral_Communism_L]§! toman el poder."
 SOV_military_priests_desc: "Los capellanes regimentales se han vuelto a incorporar a las plantillas militares, y el Patriarcado bendice ahora los estandartes de cada formación que lo solicite.\n§W--------------§!\nEste espíritu nacional solo se mantiene mientras gobiernen los §Y[Monarchist_L]§! o los §Y[Nat_Populism_L]§!, y se §Rpierde§! en el momento en que lo haga cualquier otra facción."
 SOV_economic_tv6_broadcasting: "TV-6, las emisoras independientes"
 SOV_economic_tv6_broadcasting_desc: "Con Gusinski libre, la redacción de informativos de NTV se mantiene intacta y se traslada a TV-6. Concederemos una licencia al canal en lugar de confiscarlo, y permitiremos que una segunda emisora nacional responda ante sus accionistas en lugar de ante el Kremlin."
 SOV_economic_independent_press: "El estatuto de la prensa independiente"
 SOV_economic_independent_press_desc: "Un estatuto que vincula al Estado a licencias de publicación que no puede revocar a su antojo. La independencia editorial se convierte en una garantía legal en lugar de una concesión, a costa de perder la capacidad de influir sobre la opinión pública que nos habría otorgado un holding estatal."
 SOV_independent_media_idea: "Medios de comunicación independientes"
 SOV_auto_industry_idea: "Industria automotriz rusa"
 SOV_auto_industry_idea_desc: "AvtoVAZ, GAZ y KamAZ sobrevivieron a los noventa mediante acuerdos de trueque y salarios impagados. Con las plantas funcionando de nuevo y el código fiscal reescrito, las líneas de montaje de Toliatti, Nizhni Nóvgorod y Naberezhnye Chelny fabrican vehículos para un mercado nacional que finalmente puede permitírselos."
 SOV_yukos_idea_desc: "Yukos is the largest and most profitable oil producer in Russia, run to Western accounting standards and increasingly to a political agenda of its own. Its aggressive tax optimisation keeps a great deal of oil revenue out of the federal budget.\n§W--------------§!\nThis national spirit will be §RRemoved§! once the Khodorkovsky affair is settled. Acquitting him lifts it at once, while a guilty verdict requires §HThe Khodorkovsky Trials§! and §HSeize Yukos Oil§! focuses."
 SOV_broken_economy_idea_1_desc: "El colapso de la industria soviética y el impago de la deuda de 1998 han dejado la producción, la investigación y la recaudación de impuestos en ruinas. Sectores enteros sobreviven a base de trueques y salarios atrasados, y el tesoro apenas puede financiar lo que queda de ellos.\n§W--------------§!\nEste espíritu nacional se §Gmitigará§! a §HConsecuencias económicas graves§! mediante la decisión §HAnunciar el crecimiento de la economía§!, la cual requiere un nivel de £text_icon_sov_ruble §YRecuperación económica§! de §H10§! o más y cuesta §H250§! de poder político.\n§W--------------§!\nLa £text_icon_sov_ruble §YRecuperación económica§! aumenta a medida que completas enfoques en la §Yrama económica§!. Actual: §Y[?SOV.SOV_economic|0]§!"
 SOV_broken_economy_idea_2_desc: "Lo peor de la crisis ha pasado y la producción vuelve a aumentar, pero los daños de la década de 1990 siguen siendo evidentes en fábricas paradas, equipos obsoletos y una base de investigación que perdió a toda una generación de especialistas.\n§W--------------§!\nEste espíritu nacional se §Gmitigará§! a §HConsecuencias económicas medias§! mediante la decisión §HAnunciar el crecimiento de la economía§!, la cual requiere el enfoque §HLa economía rusa§!, un nivel de £text_icon_sov_ruble §YRecuperación económica§! de §H20§! o más, y cuesta §H250§! de poder político.\n§W--------------§!\nLa £text_icon_sov_ruble §YRecuperación económica§! aumenta a medida que completas enfoques en la §Yrama económica§!. Actual: §Y[?SOV.SOV_economic|0]§!"
 SOV_broken_economy_idea_3_desc: "El crecimiento ha regresado y el presupuesto tiene superávit, pero la productividad, las infraestructuras y la capacidad industrial siguen estando muy por debajo de los niveles anteriores al colapso soviético.\n§W--------------§!\nEste espíritu nacional se §Reliminará§! mediante la decisión §HAnunciar el crecimiento de la economía§!, la cual requiere el enfoque §HLa economía rusa§!, un nivel de £text_icon_sov_ruble §YRecuperación económica§! de §H30§! o más, y cuesta §H350§! de poder político.\n§W--------------§!\nLa £text_icon_sov_ruble §YRecuperación económica§! aumenta a medida que completas enfoques en la §Yrama económica§! y tiene un límite de §H30§!. Actual: §Y[?SOV.SOV_economic|0]§!"
 sov_economic.306.t: "La fiscalía apela"
 sov_economic.306.d: "La absolución no ha cerrado el asunto. La Fiscalía General ha presentado un recurso de apelación, argumentando que las cuentas de Yukos nunca se examinaron adecuadamente y que el veredicto fue comprado en lugar de razonado. Los oligarcas están expectantes para ver si se permitirá que la absolución se mantenga."
 sov_economic.306.a: "Presionar con la apelación."
 sov_economic.306.b: "Dejar que el veredicto se mantenga."
