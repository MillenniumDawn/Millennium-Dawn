 CPD_annex_state_button_TT_DELAYED: "[CPD_ANNEX_STATE_TT_DELAYED_LOC]"
 CPD_annex_state_button_TT_DEMAND: "Estados de demanda"
 CPD_annex_state_button_TT_CONCESSION: "Conceder Estados"
 CPD_annex_state_button_TT_DELAYED_DEMAND: "Os territórios inimigos selecionados são anexados à nossa nação junto com seu povo, fábricas e recursos. Os estados nos quais temos núcleos custam metade do valor estratégico; estados reivindicados, um terço. Exigir terras que o proprietário original ainda possui dobra o custo."
 CPD_annex_state_button_TT_DELAYED_CONCESSION: "§YCeder Estados§! é entregá-los ao inimigo. Cada território cedido reduz o custo geral do acordo, tornando nossas outras exigências mais atraentes."
 CPD_make_puppet_button_TT: "[CPD_MAKE_PUPPET_TT_LOC]"
 CPD_make_puppet_button_TT_DELAYED: "[CPD_MAKE_PUPPET_TT_DELAYED_LOC]"
 CPD_make_puppet_button_TT_DEMAND: "Criar um governo fantoche"
 CPD_make_puppet_button_TT_CONCESSION: "Conceder governo fantoche"
 CPD_make_puppet_button_TT_DELAYED_DEMAND: "Exigir um §YGoverno fantoche§! cria um novo estado submetido a partir do território inimigo selecionado. O novo fantoche herda a cultura de seu progenitor, mas responde a nós na política externa. Caso já tenhamos um sujeito com núcleos na nação progenitora, esses estados se juntam a esse sujeito em vez de gerar um novo."
 CPD_make_puppet_button_TT_DELAYED_CONCESSION: "Ceder um §YGoverno fantoche§! permite que o inimigo crie um estado submetido a partir dos territórios que possuímos atualmente. O novo governo fantoche responde a eles."
