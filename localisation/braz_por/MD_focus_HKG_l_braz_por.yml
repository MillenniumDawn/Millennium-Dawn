 HKG_contract_capstone_label: "A Frota de Hong Kong"
 HKG_contract_capstone_progress: "Conclua o programa nacional de porta-aviões e opere um porta-aviões para conquistar o legado naval da cidade."
 HKG_contract_capstone_done: "§GA Frota de Hong Kong zarpa: Hong Kong é uma potência naval reconhecida.§!"
 HKG_contract_capstone_progress_tt: "Dispara quando toda a ramificação de focos de porta-aviões for concluída e Hong Kong tiver construído ou mantido um porta-aviões. Concede o espírito nacional §YPotência Naval de Hong Kong§!."
 HKG_contract_capstone_done_tt: "O ápice foi alcançado. O espírito nacional §YPotência Naval de Hong Kong§! está ativo e melhores termos de contrato podem ser negociados."
 HKG_naval_contracts_category: "Contratos Navais de Aquisição"
 HKG_contract_solicit_contract: "Solicitar um Contrato a Pequim"
 HKG_contract_solicit_contract_desc: "Procure a Comissão Militar Central e solicite uma nova ordem de aquisição de navios de guerra. Até três contratos podem correr ao mesmo tempo; quanto mais você acumula, mais tempo Pequim concede para cada um. A classe e a recompensa escalam com nosso prestígio."
 HKG_contract_deliver_destroyer: "Entregar um Contratorpedeiro"
 HKG_contract_deliver_destroyer_desc: "Transfira um contratorpedeiro concluído para a Marinha do Exército de Libertação Popular. Ele é creditado ao seu contrato de contratorpedeiros mais urgente. Repita até que a cota desse contrato seja cumprida."
 HKG_contract_deliver_frigate: "Entregar uma Fragata"
 HKG_contract_deliver_frigate_desc: "Transfira uma fragata concluída para a Marinha do Exército de Libertação Popular. Ela é creditada ao seu contrato de fragatas mais urgente. Repita até que a cota desse contrato seja cumprida."
 HKG_contract_deliver_submarine: "Entregar um Submarino"
 HKG_contract_deliver_submarine_desc: "Transfira um submarino de ataque concluído para a Marinha do Exército de Libertação Popular. Ele é creditado ao seu contrato de submarinos mais urgente."
 HKG_contract_deliver_cruiser: "Entregar um Cruzador"
 HKG_contract_deliver_cruiser_desc: "Transfira um cruzador concluído para a Marinha do Exército de Libertação Popular. Ele é creditado ao seu contrato de cruzadores mais urgente."
 HKG_contract_deliver_carrier: "Entregar o Porta-aviões"
 HKG_contract_deliver_carrier_desc: "Transfira um porta-aviões concluído para a Marinha do Exército de Libertação Popular e cumpra o contrato do porta-aviões."
 HKG_contract_negotiate_terms: "Renegociar os Termos de Aquisição"
 HKG_contract_negotiate_terms_desc: "Com a Frota de Hong Kong estabelecida, os estaleiros de Hong Kong impõem respeito. Pressione Pequim por pagamentos maiores e prazos mais longos em todos os contratos futuros."
 HKG_contract_need_destroyer_tt: "Precisamos ter pelo menos um contratorpedeiro em nossa marinha para entregar"
 HKG_contract_need_frigate_tt: "Precisamos ter pelo menos uma fragata em nossa marinha para entregar"
 HKG_contract_need_submarine_tt: "Precisamos ter pelo menos um submarino de ataque em nossa marinha para entregar"
 HKG_contract_need_cruiser_tt: "Precisamos ter pelo menos um cruzador em nossa marinha para entregar"
 HKG_contract_need_carrier_tt: "Precisamos ter um porta-aviões em nossa marinha para entregar"
 HKG_contract_slots_free_tt: "Temos uma vaga de contrato livre (no máximo três contratos podem estar ativos ao mesmo tempo)"
 HKG_contract_modules_tt: "Nossos estaleiros pesquisaram pelo menos o nível 1 de todos os módulos essenciais de navios de guerra: motor, canhão principal, mísseis, torpedos, sonar e radar"
 HKG_contract_tt_unlock: "Desbloqueia o sistema de §YContratos Navais de Aquisição da China§!: construa navios de guerra para Pequim em troca de receita para o tesouro, poder político e crescimento industrial."
 HKG_contract_tt_solicit: "A Comissão Militar Central responderá com uma oferta de aquisição em poucos dias."
 HKG_contract_tt_accept_advance: "Receba um adiantamento de §G$[?HKG_contract_offer_advance|0]§! no tesouro e §G1000§! de mão de obra, pagos na assinatura do contrato."
 HKG_contract_tt_accept_license: "Pequim concede uma §Olicença de produção§! para um de seus projetos consolidados de [GetHKGContractOfferClass], que podemos construir diretamente em nossos estaleiros. §YObservação: este é um projeto comprovado em serviço, não o mais recente da Marinha do Exército de Libertação Popular.§!"
 HKG_contract_tt_accept_onfulfil: "Ao entregar o pedido completo: o pagamento restante entra no tesouro, §G[?HKG_contract_offer_pp|0]§! de poder político e um ganho de produtividade industrial são concedidos, e um bônus temporário de receita dos estaleiros começa."
 HKG_contract_tt_decline: "A oferta expira. Não há penalidade, e Pequim poderá apresentar outra com o tempo."
 HKG_contract_tt_deliver: "Transfira um navio para a Marinha do Exército de Libertação Popular, creditado ao seu contrato mais urgente desta classe.\n§YO navio deve estar em sua Frota de Reserva. Um navio designado a uma força-tarefa não pode ser entregue. Mova-o para a reserva primeiro.§!"
 HKG_contract_tt_deliver_reward: "Quando a cota completa de um contrato é entregue: o pagamento restante entra no tesouro, e poder político, produtividade e um bônus de receita dos estaleiros são concedidos."
 HKG_contract_tt_negotiate: "Todos os contratos futuros pagam §G25%§! a mais e permitem prazos §G50%§! mais longos."
 HKG_contract.1.t: "Uma Encomenda de Pequim"
 HKG_contract.1.d_normal: "A Comissão Militar Central de Pequim procurou nossos estaleiros com uma ordem de aquisição.\n\n§YPedido:§! [?HKG_contract_offer_quota|0] x [GetHKGContractOfferClass]\n§YPrazo:§! [?HKG_contract_offer_deadline|0] dias\n§YPagamento:§! $[?HKG_contract_offer_funds|0] - $[?HKG_contract_offer_advance|0] e §G1000§! de mão de obra pagos na assinatura, o restante na entrega\n§YAo concluir:§! [?HKG_contract_offer_pp|0] de poder político, um ganho duradouro de produtividade e um bônus temporário de receita dos estaleiros\n\nAs embarcações devem ser construídas em nossos próprios estaleiros e transferidas para a Marinha do Exército de Libertação Popular. Perder o prazo azedará as relações com o continente."
 HKG_contract.1.d_license: "A Comissão Militar Central de Pequim oferece um §Ocontrato de licença§!. A Marinha do Exército de Libertação Popular compartilhará um de seus projetos consolidados para nossos estaleiros construírem sob licença.\n\n§YProjeto licenciado:§! [?HKG_contract_offer_quota|0] x [GetHKGContractOfferClass]\n§YPrazo:§! [?HKG_contract_offer_deadline|0] dias\n§YPagamento:§! $[?HKG_contract_offer_funds|0] - $[?HKG_contract_offer_advance|0] e §G1000§! de mão de obra pagos na assinatura, o restante na entrega\n§YAo concluir:§! [?HKG_contract_offer_pp|0] de poder político, um ganho duradouro de produtividade e um bônus temporário de receita dos estaleiros\n\nAceitar concede uma licença de produção, permitindo construir diretamente o projeto de Pequim. §YObservação: Pequim compartilha um projeto comprovado em serviço, não seu navio de guerra mais recente.§! Perder o prazo azedará as relações com o continente."
 HKG_contract.1.a: "Aceitar a encomenda"
 HKG_contract.1.b: "Recusar - nossos estaleiros não estão prontos"
 HKG_contract.2.t: "Contrato Cumprido"
 HKG_contract.2.d: "A última embarcação do pedido foi entregue à Marinha do Exército de Libertação Popular. Pequim está satisfeita: o pagamento final de §Y$[?HKG_contract_last_payment|0]§! entrou no tesouro, capital político foi liberado e nossos estaleiros conquistaram sua reputação. Nosso prestígio junto ao continente aumentou."
 HKG_contract.2.a: "Hong Kong constrói a frota"
 HKG_contract.3.t: "Prazo do Contrato Perdido"
 HKG_contract.3.d: "O prazo de um contrato expirou com o pedido não cumprido. A Comissão Militar Central registrou a falha de Hong Kong em honrar seu compromisso. O descontentamento de Pequim agora pesa sobre nossos estaleiros e nosso prestígio junto ao continente caiu."
 HKG_contract.3.a: "Um revés lamentável"
 HKG_contract.50.t: "A Frota de Hong Kong"
 HKG_contract.50.d: "De subcontratado a construtor naval de primeira linha: os estaleiros de Hong Kong concluíram o programa nacional de porta-aviões e colocaram um porta-aviões no mar. O que começou como contratos de aquisição para Pequim tornou-se uma indústria naval que não responde a ninguém. A Frota de Hong Kong nasce, e com ela Hong Kong assume seu lugar entre as potências navais."
 HKG_contract.50.a: "A cidade zarpa"
 HKG_contract_dockyard_revenue: "Dividendo de Aquisição"
 HKG_contract_dockyard_revenue_desc: "Um contrato cumprido para Pequim mantém os estaleiros de Hong Kong ocupados e lucrativos. A construção naval gera receita constante enquanto as carteiras de pedidos permanecem cheias."
 HKG_contract_beijing_displeasure: "Descontentamento de Pequim"
 HKG_contract_beijing_displeasure_desc: "Hong Kong não entregou um pedido contratado no prazo. A Comissão Militar Central perdeu a confiança nos estaleiros da cidade, e o custo político é sentido em toda a administração."
 HKG_contract_naval_power: "Potência Naval de Hong Kong"
 HKG_contract_naval_power_desc: "Os estaleiros de Hong Kong construíram um porta-aviões próprio e provaram estar à altura de qualquer outro na Ásia. A indústria naval da cidade é agora um ativo estratégico permanente."
 HKG_carrier_home: "Um Porta-aviões para Hong Kong"
 HKG_carrier_home_desc: "Construir um porta-aviões nacional é o projeto mais ambicioso que a cidade já tentou. Começa pelas carreiras, pelos diques secos e pela vontade política de levá-lo até o fim."
 HKG_carrier_construction: "Assentar o Casco"
 HKG_carrier_construction_desc: "O Eastern Maritime Shipbuilding Group inicia as obras do casco do porta-aviões. O trabalho mobiliza todos os estaleiros e soldadores que Hong Kong pode dispensar."
 HKG_carrier_construction2: "Equipar o Porta-aviões"
 HKG_carrier_construction2_desc: "Com o casco concluído, o porta-aviões passa à fase de armamento. Usina de propulsão, espaços de comando e a superestrutura da ilha são instalados no cais."
 HKG_carrier_modules: "Integração de Sistemas do Porta-aviões"
 HKG_carrier_modules_desc: "Módulos modernos de porta-aviões são integrados ao projeto: catapultas, cabos de parada e sistemas de controle de avarias, aproveitando a experiência naval duramente conquistada."
 HKG_flight_deck_limitations: "Superar as Limitações do Convés de Voo"
 HKG_flight_deck_limitations_desc: "O primeiro convés de voo de Hong Kong é apertado para os padrões ocidentais. Engenheiros reformulam o layout do convés para lançar e recuperar aeronaves em um ritmo utilizável."
 HKG_carrier_special_airwing: "Treinar a Ala Aérea do Porta-aviões"
 HKG_carrier_special_airwing_desc: "Um porta-aviões é tão capaz quanto os pilotos que decolam dele. Hong Kong investe em uma ala aérea naval dedicada, treinada para operações no convés."
 HKG_carrier_defensive_weapons: "Sistema de Autodefesa do Porta-aviões"
 HKG_carrier_defensive_weapons_desc: "Sistemas de armas de curto alcance, mísseis de defesa pontual e contramedidas eletrônicas são instalados para que o porta-aviões possa sobreviver sem depender inteiramente de suas escoltas."
 HKG_carrier_logistics: "Infraestrutura de Apoio ao Porta-aviões"
 HKG_carrier_logistics_desc: "Um porta-aviões exige um porto de origem à altura da tarefa: atracadouros de águas profundas, depósitos de munição e a cauda logística para mantê-lo no mar."
 HKG_expanded_shipyards: "Expandir os Estaleiros"
 HKG_expanded_shipyards_desc: "Os estaleiros de Hong Kong são levados ao limite. Novas carreiras e diques secos ampliam a capacidade da cidade de construir e reparar navios de guerra."
 HKG_expanded_trade_capacity: "Expandir a Capacidade Comercial"
 HKG_expanded_trade_capacity_desc: "Como um dos grandes entrepostos do mundo, Hong Kong investe no porto e na capacidade industrial necessários para manter as mercadorias circulando pelo porto."
 HKG_expanded_searoutes: "Proteger as Rotas Marítimas"
 HKG_expanded_searoutes_desc: "A prosperidade de Hong Kong depende de rotas marítimas abertas. A administração aprofunda os laços comerciais com seus vizinhos marítimos para manter as rotas seguras."
 HKG_expanded_inland_routes: "Expandir as Rotas Terrestres"
 HKG_expanded_inland_routes_desc: "Além do porto, Hong Kong fortalece as ligações ferroviárias e rodoviárias que a conectam ao continente e alimentam sua indústria."
 HKG_offshore_industry: "Desenvolver a Indústria Offshore"
 HKG_offshore_industry_desc: "Terra em Hong Kong é escassa e cara. A cidade recorre a áreas aterradas e offshore para abrir espaço a novos complexos industriais."
 HKG_offshore_industry2: "Expandir a Indústria Offshore"
 HKG_offshore_industry2_desc: "O programa industrial offshore prova seu valor. Mais aterros e construções levam a base industrial de Hong Kong para além da água."
 HKG_housing_policy_modifier: "Política Habitacional"
 HKG_housing_policy_modifier_desc: "O peso acumulado das decisões habitacionais de Hong Kong, sentido na construção, nos cofres públicos e na paciência de seu povo. Cada etapa do programa habitacional altera esses números para melhor ou para pior."
 HKG_small_house_policy: "Reformar a Política das Casas Pequenas"
 HKG_small_house_policy_desc: "A Política das Casas Pequenas, da era colonial, concede aos aldeões indígenas dos Novos Territórios o direito de construir uma casa baixa em terras ancestrais. Reformá-la libera vastas extensões para empreendimentos de maior densidade, mas o establishment rural resistirá a qualquer mudança em seus privilégios herdados."
 HKG_brownfield_consolidation: "Consolidar as Áreas Degradadas"
 HKG_brownfield_consolidation_desc: "Centenas de hectares nos Novos Territórios estão ocupados por pátios de armazenamento a céu aberto, ferros-velhos e depósitos de contêineres. Consolidar essas áreas degradadas em instalações de vários andares libera o terreno abaixo para moradias sem uma única barcaça de aterro."
 HKG_revitalise_private_market: "Revitalizar o Mercado Privado"
 HKG_revitalise_private_market_desc: "Com a concorrência pública afastada, o governo se volta às incorporadoras. Aprovações simplificadas, índices de aproveitamento flexibilizados e incentivos fiscais são oferecidos para levar apartamentos privados ao mercado mais rápido."
 HKG_relax_mortgage_rules: "Flexibilizar as Regras de Hipoteca"
 HKG_relax_mortgage_rules_desc: "A Autoridade Monetária afrouxa os índices de financiamento e os limites dos testes de estresse. Os compradores de primeira viagem finalmente conseguem superar a barreira da entrada, embora os críticos alertem para o endividamento transferido aos balanços das famílias."
 HKG_vacancy_tax: "Impor um Imposto sobre Vacância"
 HKG_vacancy_tax_desc: "Uma taxa punitiva sobre apartamentos novos deixados sem venda e desocupados. As incorporadoras não podem mais liberar aos poucos unidades concluídas no mercado para manter os preços altos; o armazenamento especulativo de moradias chega ao fim."
 HKG_light_public_housing: "Habitação Pública Leve"
 HKG_light_public_housing_desc: "Conjuntos pré-fabricados e modulares construídos em terrenos ociosos do governo como solução provisória para as famílias paradas na fila de espera. Baratos e rápidos de erguer, eles dão à Autoridade de Habitação os anos de que precisa para construir moradias permanentes."
 HKG_tenancy_control: "Regulamentar os Apartamentos Subdivididos"
 HKG_tenancy_control_desc: "Tetos de aluguel, contratos escritos obrigatórios e padrões mínimos são impostos às notórias unidades subdivididas da cidade. Os senhorios perdem a mão livre; as dezenas de milhares de pessoas presas em cubículos divididos ganham alguma proteção."
 HKG_starter_homes_scheme: "Programa de Primeiras Moradias"
 HKG_starter_homes_scheme_desc: "Uma nova faixa de propriedade voltada a jovens profissionais excluídos tanto da habitação pública quanto do mercado privado. Vendidas abaixo do preço de mercado e com restrições de revenda, o programa reconstrói o primeiro degrau da escada imobiliária."
 HKG_artificial_islands: "Programa de Ilhas Artificiais"
 HKG_artificial_islands_desc: "Um programa de ilhas artificiais de grande escala nas águas centrais, concebido para abrigar centenas de milhares de pessoas e ancorar um novo distrito metropolitano. O custo chega a centenas de bilhões e as objeções ambientais são ferozes, mas o ganho em terras utilizáveis é incomparável."
 HKG_northern_metropolis: "A Metrópole do Norte"
 HKG_northern_metropolis_desc: "Um amplo projeto de desenvolvimento para os Novos Territórios que fazem fronteira com Shenzhen, integrando Hong Kong à Grande Área da Baía. Novas cidades, ligações ferroviárias e um cinturão de inovação são planejados ao longo da fronteira norte."
 HKG_country_park_periphery: "Desenvolver a Periferia dos Parques Naturais"
 HKG_country_park_periphery_desc: "As franjas de menor valor ecológico dos parques naturais protegidos são abertas à construção. Os conservacionistas ficam horrorizados com o precedente; o governo insiste que o terreno é valioso demais para ficar ocioso em meio a uma crise habitacional."
 HKG_redevelop_old_estates: "Reurbanizar os Conjuntos Antigos"
 HKG_redevelop_old_estates_desc: "Os conjuntos públicos mais antigos, construídos nas décadas de crescimento e agora em decadência, são demolidos e reconstruídos com densidade moderna. Os moradores são retirados e realocados; a mesma área rende muito mais apartamentos."
 HKG_abolish_subdivided_flats: "Abolir os Apartamentos Subdivididos"
 HKG_abolish_subdivided_flats_desc: "Com moradias novas suficientes finalmente disponíveis, o governo age para proibir os cubículos subdivididos e as moradias em gaiola que envergonharam a cidade por uma geração. A era dos cortiços divididos chega ao fim."
 HKG_urban_renewal_push: "Fortalecer a Autoridade de Renovação Urbana"
 HKG_urban_renewal_push_desc: "A Autoridade de Renovação Urbana recebe poderes ampliados de desapropriação e um fundo maior para limpar e reconstruir distritos degradados. O antigo Kowloon e a orla portuária são refeitos quarteirão por quarteirão."
 HKG_smart_city_housing: "Habitação de Cidade Inteligente"
 HKG_smart_city_housing_desc: "Os novos conjuntos são conectados desde a base: transporte integrado, refrigeração distrital e governança digital. O parque habitacional de Hong Kong se torna uma vitrine das ambições de cidade inteligente da Grande Área da Baía."
 HKG_housing_for_all: "Um Lar para Cada Hongkonguês"
 HKG_housing_for_all_desc: "A crise de décadas é declarada encerrada. A fila de espera foi zerada, os apartamentos subdivididos acabaram e a casa própria está novamente ao alcance de uma família comum. Uma geração que cresceu resignada ao aluguel finalmente pode aspirar a um lar só seu."
 HKG_naval_contracts_category_desc: "Construa navios de guerra para Pequim e entregue-os no prazo para elevar o prestígio de Hong Kong junto ao continente.\n§YPara entregar um navio, ele deve estar em sua Frota de Reserva. Um navio designado a uma força-tarefa não pode ser entregue. Mova-o para a reserva primeiro.§!"
 HKG_contract_acquire_pearl_river: "Solicitar o Delta do Rio das Pérolas"
 HKG_contract_acquire_pearl_river_desc: "Os estaleiros de Hong Kong serviram Pequim fielmente e conquistaram a plena confiança do continente. Use esse prestígio para pedir à Comissão Militar Central que ceda o Delta do Rio das Pérolas, dobrando a base industrial da cidade."
 HKG_contract_max_standing_tt: "Nosso prestígio junto ao continente deve estar no máximo"
 HKG_contract_pearl_river_accept_tt: "Pequim cede o Delta do Rio das Pérolas a Hong Kong"
 HKG_contract_yard_slack_tt: "Nossos estaleiros têm capacidade ociosa para assumir outro contrato e ainda entregar no prazo"
 HKG_contract.20.t: "Uma Petição de Hong Kong"
 HKG_contract.20.d: "Hong Kong construiu nossa frota sem falhas e agora pede uma recompensa própria: a cessão do Delta do Rio das Pérolas à sua administração. Os estaleiros do sul alimentariam a indústria da cidade, e um subcontratado leal se tornaria uma potência regional. Os fundos já estão sobre a mesa."
 HKG_contract.20.a: "Conceder o Delta do Rio das Pérolas"
 HKG_contract.20.b: "O continente não será retalhado"
 HKG_contract.21.t: "O Delta Volta para Casa"
 HKG_contract.21.d: "Pequim concordou. O Delta do Rio das Pérolas agora responde a Hong Kong, suas fábricas e carreiras de construção incorporadas à economia da cidade. Hong Kong já não é uma única ilha superlotada, mas o coração de um cinturão industrial do sul."
 HKG_contract.21.a: "Surge uma potência industrial"
 HKG_contract.22.t: "Pequim Recusa"
 HKG_contract.22.d: "A Comissão Militar Central recusou-se a ceder o Delta do Rio das Pérolas. A integridade territorial do continente não está à venda, por mais leais que sejam os estaleiros. Nosso pagamento foi devolvido."
 HKG_contract.22.a: "Pediremos de novo com o tempo"
 HKG_contract.30.t: "Falha na Entrega"
 HKG_contract.30.d: "Nenhum navio foi entregue. A embarcação escolhida para a entrega está designada a uma força-tarefa, e uma capitânia não pode ser transferida.\n§YMova o navio para sua Frota de Reserva e use a decisão de entrega novamente.§! Nenhum crédito de contrato foi concedido."
 HKG_contract.30.a: "Mover para a reserva e tentar de novo"
 HKG_contract_resource_access: "Linha de Suprimento do Continente"
 HKG_contract_resource_access_desc: "Um contrato naval de aquisição ativo abre acesso preferencial às cadeias de suprimento do continente. Pequim envia matérias-primas aos estaleiros da cidade por uma fração do custo habitual enquanto as carteiras de pedidos permanecem cheias."
 HKG_contract_resource_access_tt: "§GOs recursos importados da China ficam muito mais baratos enquanto o contrato estiver em andamento.§!"
 HKG_contract_shipbuilding_legacy: "Legado da Construção Naval"
 HKG_contract_shipbuilding_legacy_desc: "Cada navio de guerra entregue ao continente aprimora os estaleiros de Hong Kong. Cada pedido concluído adiciona permanentemente 1% à produção dos estaleiros navais."
 HKG_mainland_resource_supply: "Suprimento de Recursos do Continente"
 HKG_mainland_resource_supply_desc: "Pequim desvia petróleo, aço, metais leves, metais preciosos, compósitos e microchips do continente para manter os estaleiros da cidade trabalhando em seus contratos navais. Hong Kong não produz quase nada disso por conta própria, então o fluxo garantido é o que torna possível construir navios de guerra para o continente. O suprimento dura apenas enquanto um contrato estiver ativo."
 HKG_mainland_resource_supply_tt: "§YEstes recursos são retirados diretamente do estoque da própria China, e apenas enquanto um contrato estiver ativo.§!"
 CHI_hong_kong_resource_drain: "Recursos para Hong Kong"
 CHI_hong_kong_resource_drain_desc: "Petróleo, aço, metais leves, metais preciosos, compósitos e microchips são enviados para o sul para manter os estaleiros de Hong Kong trabalhando em um contrato do continente. A produção desviada não está mais disponível para a própria indústria do continente."
 CHI_hong_kong_resource_drain_tt: "§REstes recursos são desviados para Hong Kong enquanto seu contrato estiver em andamento.§!"
 HKG_support_the_business: "Apoiar o Setor Empresarial"
 HKG_support_the_business_desc: "Isenções fiscais, desregulamentação e crédito barato canalizam o capital da cidade direto para as fábricas. A produção dispara, embora os benefícios pesem no orçamento e irritem os políticos."
 legco_motion_reform_status_quo: "Manter o Status Quo Eleitoral"
 legco_motion_reform_gradual: "Reforma Eleitoral Gradual e Ordenada"
 legco_motion_reform_universal: "Sufrágio Universal"
 HKG_china_dominant_influence_tt: "§Y[CHI.GetNameWithFlag]§! é a maior influenciadora em [ROOT.GetNameWithFlag] com mais de 80% de influência"
 hongkong.17.t: "The Liaison Office is Established"
 hongkong.17.desc: "The Hong Kong branch of the Xinhua News Agency has handed its non-news work to the newly formed Liaison Office of the Central People's Government. The office takes over Beijing's representation in the territory and continues to host the Hong Kong Work Committee of the Chinese Communist Party. Officials describe it as one institution with two names."
 hongkong.17.a: "Beijing's man in Hong Kong"
 hongkong.18.t: "The DAB Absorbs the Progressive Alliance"
 hongkong.18.desc: "The Democratic Alliance for the Betterment of Hong Kong has merged with the business-oriented Hong Kong Progressive Alliance. The enlarged party adopts the name Democratic Alliance for the Betterment and Progress of Hong Kong and keeps the abbreviation DAB. The merger adds a pro-business wing to its grassroots base and strengthens the pro-Beijing camp."
 hongkong.18.a: "Bigger, and still the DAB"
 hongkong.19.t: "A New Party of Lawyers"
 hongkong.19.desc: "Barristers and legal professionals from the Article 45 Concern Group have launched the Civic Party. The new party campaigns for universal suffrage, the rule of law and civil liberties. It aims to speak for middle-class professionals who feel poorly served by the existing democratic parties."
 hongkong.19.a: "The rule of law has a new champion"
 hongkong.20.t: "The Frontier Folds into the Democrats"
 hongkong.20.desc: "A majority of The Frontier has merged into the Democratic Party, ending the separate existence of the radical pan-democrat group led by Emily Lau. Its former members bring their calls for stronger democratic demands into the larger party. The League of Social Democrats now stands as the main radical voice in the democratic camp."
 hongkong.20.a: "The radicals regroup"
 hongkong.21.t: "Regina Ip Launches Her Own Party"
 hongkong.21.desc: "Regina Ip, the former Secretary for Security, has founded the New People's Party. It stands for law and order, national security legislation and loyalty to Beijing, and it seeks middle-class professional voters. The party intends to compete with the DAB for support within the pro-establishment camp."
 hongkong.21.a: "A new voice for security"
 hongkong.22.t: "Localists Organise"
 hongkong.22.desc: "Wong Yeung-tat has founded Civic Passion, a localist group that campaigns to protect Hong Kong identity and to limit mainland immigration and tourism. The group favours confrontational street campaigns and online mobilisation. It attacks the pan-democrats as too weak and rejects Beijing's influence."
 hongkong.22.a: "Hong Kong first"
 hongkong.23.t: "A Third Way Is Proposed"
 hongkong.23.desc: "Ronny Tong, a barrister who left the Civic Party, has founded Path of Democracy. The group presents a third way between the pro-Beijing camp and the pan-democrats. It argues for constructive engagement with Beijing and compromise within the Basic Law."
 hongkong.23.a: "Neither camp"
 hongkong.24.t: "Tik Chi-yuen Founds Third Side"
 hongkong.24.desc: "Tik Chi-yuen has founded Third Side after leaving the Democratic Party. The new party presents itself as a moderate third road between the establishment and the democratic camp. It focuses on livelihood issues and pragmatic engagement with Beijing."
 hongkong.24.a: "A third road"
 hongkong.25.t: "Civic Passion Dissolves"
 hongkong.25.desc: "Civic Passion has disbanded after its chairman, Cheng Chung-tai, was disqualified from the Legislative Council by the candidate eligibility review. The group says it can no longer operate under the new political conditions. The localist camp loses its most prominent organisation."
 hongkong.25.a: "The localists lose their voice"
 hongkong.26.t: "The Civic Party Is Dissolved"
 hongkong.26.desc: "An extraordinary general meeting of the Civic Party has voted to dissolve the party. Members cite the changed political environment and the pressure on its leaders. The party that was founded by barristers to defend the rule of law ceases to exist."
 hongkong.26.a: "The lawyers close their chambers"
 hongkong.27.t: "The League Calls It a Day"
 hongkong.27.desc: "The League of Social Democrats has announced that it is disbanding, citing tremendous political pressure. The party was long known for street protests and legislative filibusters. Its departure leaves the radical democratic camp without an organised party."
 hongkong.27.a: "The street protests end"
 hongkong.28.t: "PoD Becomes a Research Institute"
 hongkong.28.desc: "Path of Democracy has renamed itself the PoD Research Institute and repositioned itself as a policy think tank. The group will focus on research into governance and relations with the mainland rather than on contesting elections. It keeps the third way outlook of its founder."
 hongkong.28.a: "Policy, not politics"
 hongkong.29.t: "The Democratic Party Disbands"
 hongkong.29.desc: "Members of the Democratic Party have voted to disband the party and enter liquidation. The vote ends the largest and most moderate pro-democracy party in Hong Kong. Its district networks and its role as a bridge to Beijing disappear with it."
 hongkong.29.a: "The last of the old guard"