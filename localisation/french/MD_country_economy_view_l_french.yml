 STATS_TITLE: "Statistiques"
 GDP_TOTAL: "PIB"
 GDP_TOTAL_DESC: "Our §YGross Domestic Product§! (GDP) is the value measure of all products and services produced in the country. Millennium Dawn uses GDP adjusted with PPP (Purchasing Power Parity) as this value takes local economic conditions into account, making the country comparison more useful."
 NUM_GDP_TOTAL: "§Y[?ROOT.gdp_total|1]§! Mrd $$"
 NUM_GDP_TOTAL_DESC: "Notre §YPIB§! est actuellement de §Y[?ROOT.gdp_total|3]§!$ milliards\n\n§YTaux de croissance trimestriel du PIB§! :[?last_quarter_gdp_growth_rate|%Y]\n\nAstuce : plus votre §Ytaux de croissance trimestriel du PIB§! est élevé plus vous avez de chances d’obtenir des événements économiques positifs."
 NUM_GDP_TOTAL_DELAYED_DESC: "Contribution approximative des industries en pourcentage:\n§PIndustries civiles§!: [?ROOT.civil_fac_percent|%]\n§OIndustries militaires§!: [?ROOT.military_fac_percent|%]\n§BChantiers navals§!: [?ROOT.dockyard_fac_percent|%]\n§CIndustries de services§!: [?ROOT.office_fac_percent|%]\n§GAgriculture non commercialisée§!: [?ROOT.agriculture_percent|%]\n§YDistricts agricoles commercialisés§!: [?ROOT.agriculture_district_fac_percent|%]\n§GExtraction de ressources§!: [?ROOT.resources_percent|%]\n"
 GDP_PER_CAPITA: "PIB/hab"
 GDP_PER_CAPITA_DESC: "Ce chiffre représente notre §YPIB par habitant§! ou §YPIB/hab§!. Il représente la production de chaque personne dans la nation."
 GDP_PER_CAPITA_DELAYED_DESC: "Impact actuel du §YPIB par habitant§! sur notre nation:\nVitesse de construction: [?production_speed_buildings_factor_gdp_modifier|%+]\nPopulation mensuelle: [?monthly_population_gdp_modifier|%+1]\nVitesse de recherche: [?research_speed_factor_gdp_modifier|%+]\nStabilité: [?stability_factor_gdp_modifier|%+]\nMain d'oeuvre totale: [?total_workforce_gdp_c_modifier_var|%+]\nVitesse de construction des centrales à combustibles fossile: [?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA: "§Y[?ROOT.gdp_per_capita]§! K $$"
 NUM_GDP_PER_CAPITA_DESC: "Notre §YPIB/hab§! est actuellement de §Y[?ROOT.gdp_per_capita|3]§!$ milliers"
 PRODUCTIVITY: "Productivité"
 PRODUCTIVITY_DESC: "Ce nombre représente la §Yproductivité§! de notre nation."
 NUM_PRODUCTIVITY_DELAYED_DESC: "Croissance mensuelle de la productivité: [?productivity_growth_scaled|3+]\n\nEffet de la productivité:\n§YProduction d'usines:§! [?productivity_tax_effect_display|%+1]\n§YVitesse de construction:§! [?productivity_tax_effect_display|%+1]\n§YImpôt sur les sociétés:§! [?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon Vitesse de construction des §Ydistricts agricoles commercialisés§! :§! [?agriculture_district_output_var|%+1]"
 NUM_PRODUCTIVITY: "§Y[?ROOT.overall_productivity|3]§!"
 NUM_PRODUCTIVITY_DESC: "La §Yproductivité§! mesure l'efficacité avec laquelle nous transformons les ressources en biens et services pour notre population, en faisant évoluer le PIB, l'impôt sur les sociétés et la production industrielle. Une productivité plus élevée signifie une plus grande efficacité, mais la croissance ralentit à mesure que les États deviennent plus productifs par rapport à la moyenne mondiale, tandis que les États moins productifs rattrapent plus vite.\n\n§YMoyenne mondiale :§! [?global.average_world_productivity|3]\n§YNotre productivité :§! [?ROOT.overall_productivity|3]\n"
 INFLATION: "Inflation"
 INFLATION_DESC: "Ce chiffre représente l'§Yinflation§! de notre nation"
 NUM_INFLATION: "§Y[?ROOT.inflation_rate_var|%]§!"
 NUM_INFLATION_DESC: "§YInflation§! is how fast prices are rising. High inflation raises government costs and lowers factory output. The §YInflation Impact on Economy§! national spirit shows all of its effects, including §YDeflation§! when the rate is negative.\n\nIt updates every quarter. The rate shown is the average of the last 4 quarters and moves at most 10% per quarter. Easier difficulty settings slow its rise.\n\n§YWhat moves it:§!\n- §YGDP/C§! growth: fast growth raises it, a shrinking economy lowers it\n- §YTax Rate§!: a higher rate lowers it\n- §YPolicy Rate§!: a higher rate lowers it, but raises §RInterest on Debt§!\n- §YEconomic Cycle§!: above §YStable Growth§! raises it, below lowers it\n- §YBudget§!: large deficits raise it, more so with high debt. A surplus lowers it.\n- §YPrint Money§! raises it\n- A weakening currency raises it, more so if we import resources\n- High inflation partly carries into the next quarter\n\n§YCurrency Strength:§! [currency_strength_display]\n§Y1.00§! is normal. It updates monthly and stays between §Y0.15§! and §Y2.00§!. Easier difficulty settings raise the minimum. A weak currency raises government costs and boosts resource export earnings. If our §YReserve Currency Policy§! uses a foreign currency, it also makes our debt more expensive. A strong currency does the reverse.\n\n§YWhat moves it:§!\n- §YPolicy Rate§!: above inflation strengthens it, below weakens it\n- §YStability§!: above 50% strengthens it, below weakens it\n- §YEconomic Cycle§!: above §YStable Growth§! strengthens it, below weakens it\n- An §YInterest Rate§! above 5% from debt or §YWorld Tension§! weakens it\n- Losing a war (over 10% surrender progress), civil war, §YInternational Sanctions§!, or a financial collapse in the last 3 years weakens it\n- If we issue a reserve currency, each country using it strengthens it\n- §YWorld Tension§! above 50% strengthens the Dollar, Yen, and Swiss Franc\n\nOver time it drifts back toward its long-run level. Gold, Silver, and Bimetallic §YCurrency Backing§! pull a weak currency back up toward §Y1.00§!, and Gold also pulls one above §Y1.05§! back down."
 NUM_INFLATION_DELAYED_DESC: "§YLast 4 Quarters:§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\nThe rate shown is the average of these four quarters, and it drives every inflation effect."
 POPULATION_TAX_RATE: "Taux taxes pop."
 POPULATION_TAX_RATE_TT: "§YExpected rate: [?expected_population_tax_rate|0]%§!\nThe rate the public accepts without pushback. It rises as our GDP per capita grows.\n• Raising the rate past both this and any higher rate we recently cut from costs §R2%§! £stability_texticon §YStability§! per point for a while.\n• Lowering it below both this and any lower rate we recently raised from gives §G0.5%§! £stability_texticon §YStability§! per point for a while.\n• Moving toward it adds no transition penalty, but a raise first takes back any recent cut bonus.\nSee §YPolicy Transition Costs§! in our national spirits.\n\nPopulation Tax Rate includes all of the taxes imposed on the public. This can include but is not limited to income tax, VAT taxes, sales tax, and property taxes.\n\n§YModifiers from Population Taxes:§!\n£stability_texticon  Stability: [?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE: "Taux taxes sociétés"
 CORPORATE_TAX_RATE_TT: "§YExpected rate: [?expected_corporate_tax_rate|0]%§!\nThe rate business accepts without pushback. It rises as our GDP per capita grows and follows the economic cycle: lower in §YStagnation§!, §YRecession§! or §YDepression§!, higher in §YFast Growth§! or an §YEconomic Boom§!.\n• Raising the rate past both this and any higher rate we recently cut from costs §R1.2%§! £stability_texticon §YStability§! per point for a while.\n• Lowering it below both this and any lower rate we recently raised from gives §G0.01§! §YMonthly Productivity Growth§! and makes §YForeign Investment§! in our country §G2%§! cheaper per point for a while.\n• Moving toward it adds no transition penalty, but a raise first takes back any recent cut bonus.\nSee §YPolicy Transition Costs§! in our national spirits.\n\nCorporate Tax Rate includes all of the taxes imposed on corporations. The value consists of corporate income taxes, employer taxes, and more.\n\n§YModifiers from Corporate Taxes:§!\n£consumer_goods_texticon  Tax Cost: [?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon §YReceiving Foreign Investment§! Cost Modifier: [?receiving_investment_cost_form_corporate_tax|%-]\nMonthly Productivity Growth: [?productivity_growth_modifier_from_corporate_tax|+3]\n"
 CB_POLICY_RATE: "Taux directeur"
 CB_POLICY_RATE_TT: "The §YCentral Bank Policy Rate§! is the benchmark interest rate set by the central bank. It controls the cost of borrowing across the economy.\n\n§YRaising the rate§! tightens the money supply, suppressing inflation but increasing the cost of sovereign debt and slowing economic activity.\n§YLowering the rate§! stimulates borrowing and investment but allows inflation to rise more freely. Negative rates provide additional inflation stimulus during deflation.\nEach positive point of the rate also cuts how much of our inflation carries into the next quarter, however high inflation is. Rates at or below 0% leave carryover at its 90% cap. A budget deficit above what we can sustain shrinks each positive point's cut by up to half.\nA rate more than 1pp above inflation supports §YCurrency Strength§!, and a lower rate weakens it. When inflation is far above the rate, each point still softens the monthly fall.\n\nEach adjustment costs §Y25§! £pol_power_icon and has a §Y30-day§! cooldown.\n\n§YCurrent Rate:§! [?cb_policy_rate]%\n§YInflation Carryover:§! Positive rate points cut the carryover share by 2.5pp each quarter\n§YDebt Interest Premium:§! [?cb_policy_rate|+0]% × 0.33pp added to §YInterest Rate§!"
 TOTAL_INCOME_TITLE: "Revenue:"
