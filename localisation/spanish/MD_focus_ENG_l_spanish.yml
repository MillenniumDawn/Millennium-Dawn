 ENG_glenn_torpy_trait: "Comandante del aire de la coalición"
 ENG_stephen_dalton_trait: "Líder del programa Typhoon"
 ENG_andrew_pulford_trait: "Comandante de la fuerza Chinook"
 ENG_stephen_hillier_trait: "Defensor de los RPAS"
 ENG_michael_wigston_trait: "Defensor del personal"
 ENG_john_reith_hc_trait: "Comandante aerotransportado de la OTAN"
 ENG_royal_armed_forces_review: "Una revisión de las Fuerzas Reales"
 ENG_royal_armed_forces_review_desc: "Las Fuerzas Armadas de la Corona merecen algo más que un mero prestigio ceremonial. Una revisión sistemática de la doctrina, los estándares de adiestramiento y la preparación en los tres servicios reconstruirá a las Fuerzas Armadas Reales como una fuerza de combate creíble y digna de la monarquía."
 ENG_household_division_revival: "Reactivación de la Household Division"
 ENG_household_division_revival_desc: "La Household Division ha sido durante mucho tiempo la punta de lanza del Ejército Británico. Reactivar sus tradiciones y expandir su papel restaura un núcleo de tropas de élite cuya calidad, disciplina y espíritu de cuerpo las distinguen del grueso de las fuerzas generales."
 ENG_jewel_of_the_admiralty: "La joya del Almirantazgo"
 ENG_jewel_of_the_admiralty_desc: "La Marina Real es el símbolo más antiguo de la proyección de poder británica. Volver a invertir en sus buques capitales, ampliar su alcance operativo y reconstruir su cultura institucional indica al mundo que Britannia aún gobierna las olas."
 ENG_wings_of_the_crown: "Alas de la Corona"
 ENG_wings_of_the_crown_desc: "La Real Fuerza Aérea nació en el crisol de la Primera Guerra Mundial y resultó decisiva en la Segunda. Una renovada inversión en el adiestramiento de pilotos, la doctrina de combate aéreo y el desarrollo de ases garantiza que la superioridad aérea siga siendo la piedra angular de la defensa británica."
 ENG_imperial_general_staff_restored: "Restauración del Estado Mayor Imperial"
 ENG_imperial_general_staff_restored_desc: "El Estado Mayor Imperial coordinó en su día el poder terrestre, naval y aéreo a lo largo de un imperio global. Restaurar una estructura unificada de mando conjunto sitúa a las fuerzas armadas bajo una única visión estratégica, maximizando su eficacia combinada."
 ENG_reservist_corps_act: "Ley del Cuerpo de Reservistas"
 ENG_reservist_corps_act_desc: "Las fuerzas de reserva de Gran Bretaña han sido durante mucho tiempo un activo infrautilizado. Una nueva Ley del Cuerpo de Reservistas formaliza los objetivos de reclutamiento, acelera los procedimientos de movilización y vincula más estrechamente a las unidades de reserva con sus homólogas del ejército regular."
 ENG_global_anglosphere_initiative: "La Iniciativa Global de la Anglosfera"
 ENG_global_anglosphere_initiative_desc: "Las naciones de habla inglesa comparten algo más que un idioma común: comparten tradiciones jurídicas, instituciones democráticas y vínculos históricos forjados a lo largo de los siglos. Una iniciativa coordinada de la Anglosfera otorga a la Corona una plataforma diplomática para profundizar estos lazos y fortalecer la influencia británica desde Ottawa hasta Canberra."
 ENG_crown_realm_status: "Reino de la Corona"
 ENG_crown_realm_status_desc: "Esta nación reconoce al monarca británico como jefe de Estado. Este acuerdo constitucional proporciona estabilidad política y estrechos lazos con la Commonwealth."
 ENG_crown_realm_monthly_influence_tt: "Influencia británica mensual: §R+4%§!"
 ENG_crown_diplomatic_corps: "Cuerpo Diplomático de la Corona"
 ENG_crown_diplomatic_corps_desc: "Un cuerpo dedicado de enviados reales, extraído del mejor talento diplomático que Gran Bretaña puede ofrecer, representará los intereses de la Corona directamente ante las cortes y capitales extranjeras. Su mandato consiste en mejorar las relaciones, agilizar las negociaciones y garantizar que la voz de la Corona tenga peso en todos los rincones del mundo."
 ENG_royal_visits_abroad: "Visitas reales al extranjero"
 ENG_royal_visits_abroad_desc: "Una gira real en el momento oportuno puede lograr lo que meses de diplomacia discreta no consiguen. La presencia personal del monarca en el extranjero indica compromiso, genera buena voluntad y deja una impresión duradera tanto en los gobiernos como en las poblaciones."
 ENG_pax_britannica_reborn: "El renacer de la Pax Britannica"
 ENG_pax_britannica_reborn_desc: "La Pax Britannica del siglo XIX se construyó sobre la supremacía naval, el prestigio cultural y un alcance diplomático sin parangón. A través del resurgimiento de la monarquía, la reorientación de la Anglosfera y un renovado compromiso con la implicación global, Gran Bretaña puede restaurar un equivalente moderno: una era de estabilidad respaldada por el poder y la determinación británicos."
 ENG_royal_visits.1.t: "Una gira real"
 ENG_royal_visits.1.d: "Los asesores del monarca presentan una lista de regiones donde una gira real reportaría los mayores beneficios diplomáticos. La elección determinará dónde se concentra el poder blando de Gran Bretaña y qué gobiernos se benefician de la atención personal de la Corona."
 ENG_royal_visits.1.a: "Gira por África"
 ENG_royal_visits.1.b: "Gira por el sur y el sudeste de Asia"
 ENG_royal_visits.1.c: "Gira por Oriente Medio"
 ENG_royal_visits.1.e: "Gira por América Latina"
 ENG_crown_diplomatic_corps_idea: "Cuerpo Diplomático de la Corona"
 ENG_crown_diplomatic_corps_idea_desc: "Un cuerpo activo de enviados reales opera en el extranjero, manteniendo contactos personales con gobiernos extranjeros y facilitando la agenda diplomática de la Corona. Su presencia reduce el coste de mantener relaciones y genera un flujo constante de capital político."
 ENG_army_field_exercise: "Maniobras de campaña anuales"
 ENG_army_field_exercise_desc: "Las brigadas del Ejército Británico realizan maniobras de campaña a gran escala para perfeccionar las habilidades de armas combinadas y desarrollar la preparación militar."
 ENG_army_engineering_corps: "Programa de ingenieros de combate"
 ENG_army_engineering_corps_desc: "La inversión en adiestramiento y equipamiento para los ingenieros de combate mejora la capacidad del ejército para operar en terrenos complejos."
 ENG_armoured_tactics_programme: "Programa de tácticas blindadas"
 ENG_armoured_tactics_programme_desc: "Las maniobras que integran nuevos vehículos blindados con infantería y artillería perfeccionan la doctrina para la guerra blindada moderna."
 ENG_energy_transition_programme: "Programa de transición energética"
 ENG_energy_transition_programme_desc: "Una estrategia intergubernamental para acelerar el cambio hacia energías bajas en carbono refuerza la confianza pública y la inversión industrial."
 ENG_critical_materials_reserve: "Reserva de materiales críticos"
 ENG_critical_materials_reserve_desc: "Una reserva de materiales industriales críticos respaldada por el gobierno aísla a la manufactura británica de las interrupciones en la cadena de suministro."
 ENG_research_excellence_awards: "Premios a la excelencia en investigación"
 ENG_research_excellence_awards_desc: "Los premios competitivos para universidades e institutos de investigación impulsan los avances en electrónica y tecnología digital."
 ENG_case_by_case_intervention_desc: "No podemos simplemente renunciar a nuestra capacidad de tener voz en asuntos de importancia pública solo porque desconfiamos de un gobierno más grande. Más bien, debemos mirar cada caso individualmente y trabajar hacia una mejor solución."
 ENG_the_wonga_coup: "La Lista Wonga"
 ENG_the_wonga_coup_desc: "Guinea Ecuatorial se asienta sobre vastas reservas de petróleo a las que los financieros británicos, incluidas figuras de alto perfil como Mark Thatcher (hijo de la ex primera ministra Margaret Thatcher), desean asegurar derechos petroleros preferenciales en $STATE_319$. Teodoro Obiang Nguema Mbasogo está en una posición aislada, y el líder de la oposición, Severo Moto Nsá, parece ser una alternativa preferible. Para lograr esto, los conspiradores pretenden utilizar mercenarios para derrocar a Obiang e instalar a Moto como presidente."
 britain_md.40.t: "Mercenarios retenidos en el aeropuerto de Harare"
 britain_md.40.d: "Las autoridades han detenido a un grupo de hombres fuertemente armados en el Aeropuerto Internacional de Harare. Oficialmente afirman ser contratistas de seguridad privados que compran equipos para operaciones mineras en la República Democrática del Congo; sin embargo, los informes de inteligencia sugieren que podrían estar preparándose para una operación contra el gobierno de Guinea Ecuatorial."
 britain_md.40.a: "Permanecerán bajo custodia."
 britain_md.40.b: "Liberadlos discretamente."
 britain_md.41.t: "Fracasa el golpe de Wonga"
 britain_md.41.d: "Las autoridades de Zimbabue han arrestado a más de sesenta presuntos mercenarios, liderados por Simon Mann, después de que su avión aterrizara en el Aeropuerto Internacional de Harare. Los funcionarios afirman que el grupo intentaba comprar equipo militar antes de continuar su viaje hacia Guinea Ecuatorial. Las acusaciones que vinculan a financieros británicos con el complot han acabado en una vergüenza absoluta para nosotros."
 britain_md.41.a: "Un resultado desafortunado."
 britain_md.42.t: "Éxito del golpe de Wonga"
 britain_md.42.d: "La operación ha tenido éxito. El presidente Teodoro Obiang Nguema Mbasogo ha sido derrocado y el líder de la oposición, Severo Moto Nsá, se ha declarado jefe de un nuevo gobierno. Aunque nos enfrentamos a la condena internacional, los intereses comerciales británicos gozan ahora de una influencia sin precedentes en una de las naciones más ricas en petróleo de África."
 britain_md.42.a: "Una inversión rentable."
 britain_md.43.t: "Complot extranjero aplastado"
 britain_md.43.d: "Las autoridades han confirmado los informes de que mercenarios extranjeros pretendían derrocar al gobierno e instaurar al líder opositor Severo Moto Nsá como presidente. Gracias a las detenciones en Zimbabue, la conspiración ha sido desmantelada antes de llegar a nuestras costas."
 britain_md.43.a: "La República resiste"
 britain_md.44.t: "La caída de Obiang"
 britain_md.44.d: "El presidente Teodoro Obiang Nguema Mbasogo ha sido apartado del poder después de que fuerzas mercenarias y partidarios de la oposición tomaran el control de Malabo y otras posiciones gubernamentales clave. Severo Moto Nsá ha asumido el liderazgo de un nuevo gobierno de transición."
 britain_md.44.a: "Madre mía..."
 britain_md.45.t: "Mercenarios financiados por británicos derrocan al gobierno de Guinea Ecuatorial"
 britain_md.45.d: "El presidente Teodoro Obiang Nguema Mbasogo ha sido apartado del poder después de que fuerzas mercenarias y partidarios de la oposición tomaran el control de Malabo y otras posiciones gubernamentales clave. Severo Moto Nsá ha asumido el liderazgo de un nuevo gobierno de transición."
 britain_md.45.a: "Un destino vacacional poco común."
 britain_md.46.t: "Mercenarios arrestados en Zimbabue"
 britain_md.46.d: "Las autoridades de Zimbabue han arrestado a más de sesenta presuntos mercenarios después de que su avión aterrizara en el Aeropuerto Internacional de Harare. Los funcionarios afirman que el grupo intentaba comprar equipo militar antes de continuar su viaje hacia Guinea Ecuatorial. Los hombres, presuntamente liderados por el exoficial del ejército británico Simon Mann, insisten en que prestaban servicios de seguridad para operaciones mineras en África Central. Sin embargo, los investigadores alegan que formaban parte de una conspiración más amplia para derrocar al presidente de Guinea Ecuatorial, Teodoro Obiang Nguema Mbasogo."
 britain_md.46.a: "Un destino vacacional poco común."
 ENG_british_attempted_coup_on_us: "El golpe de Wonga"
 ENG_british_loyalist: "La administración Moto"
 ENG_british_loyalist_trade: "Concesiones petroleras británicas (comercio)"
 raid_type_ENG_Wonga_Coup: "Operación Fiasco Monumental"
 raid_type_ENG_Wonga_Coup_desc: "La 'Operación Fiasco Monumental' pretende ser todo lo contrario. Una pequeña fuerza de mercenarios, financieros y aliados locales intentará derrocar al gobierno de Guinea Ecuatorial e instaurar una administración más favorable."
 ENG_seize_oil_wonga_coup_TT: "§HDesbloquea una nueva incursión§!: Operación Fiasco Monumental\n - Las unidades de fuerzas especiales británicas [ENG.GetFlag] podrán intervenir y derrocar a [EGU.GetLeader] de la [EGU.GetFlag] Guinea Ecuatorial, reemplazándolo por el hombre fuerte respaldado por los británicos [ENG.GetFlag], Severo Moto Nsá.\n\nSi la Operación Fiasco Monumental tiene éxito:\n - Nos incautaremos de sus recursos en §H$STATE_319$§! (eso viene siendo petróleo, por si te da demasiada pereza ir a mirarlo)."
 ENG_defence_industry_modifier: "Industria de Defensa Británica"
 ENG_good_friday_agreement: "Acuerdo de Viernes Santo"
 ENG_good_friday_agreement_desc: "Firmado el 10 de abril de 1998, el Acuerdo de Viernes Santo consiste en una serie de pactos menores que pusieron fin a la mayor parte de la violencia asociada al conflicto sobre el estatus de Irlanda del Norte. Los unionistas, también conocidos como leales, que son en su mayoría protestantes del Úlster, desean permanecer dentro del Reino Unido. Por el contrario, los republicanos y nacionalistas irlandeses, mayoritariamente católicos, buscaban que Irlanda del Norte abandonara el Reino Unido para integrarse en una Irlanda unida. Aunque pueda parecer implícito que el conflicto era de naturaleza teológica, se trataba más bien de una disputa política y nacional, donde la religión servía principalmente como elemento de identidad. Bajo el Acuerdo Multipartito, se restituyó el autogobierno a Irlanda del Norte en forma de un acuerdo de poder compartido entre las facciones nacionalistas irlandesas y las camarillas unionistas respectivamente. Las reformas promulgadas bajo el acuerdo abarcaron desde la reestructuración policial hasta el desarme de las organizaciones paramilitares. These measures hope to lay the bedrock for a more stable and peaceful Ireland. El futuro de Irlanda del Norte es ahora una cuestión que Westminster puede resolver en lugar de limitarse a gestionar, y las vías para resolverlo se encuentran bajo §HAsuntos descentralizados§!."
 ENG_State_17_Paramilitary_Activity: "Actividad paramilitar:"
 ENG_State_17_Paramilitary_Activity_desc: "A pesar de los progresos logrados por el Acuerdo de Viernes Santo, numerosas organizaciones paramilitares republicanas y unionistas siguen activas en toda Irlanda del Norte. Aunque muchas han declarado formalmente el alto el fuego, estos grupos continúan manteniendo estructuras, arsenales de armas e influencia dentro de las comunidades locales. Muchos están implicados en el crimen organizado, incluidos el contrabando, el narcotráfico, la extorsión y los ataques de castigo. \n\n§YSe eliminará si dejamos de controlar $STATE_17$.§!"
 ENG_additional_expenditure_goodfriday_TT: "Gasto adicional: §R+0.03%§! del PIB\nGasto policial esperado: §R+0.15%§!\nEstabilidad: §G+10.00%§!\n\nReduce todas las penalizaciones por §Ytensiones sectarias§! en un §G20%§!.\n\nPor nivel de tensiones sectarias:\n$ENG_additional_expenditure_goodfriday_info_TT$\n--------------\n§YResolver la cuestión de Irlanda del Norte§!\nLos paramilitares deben desarmarse antes de que pueda plantearse la cuestión constitucional. Todas las vías se encuentran bajo §HAsuntos descentralizados§!.\n\n§HConvocar un referéndum fronterizo§! - Nacionalismo norirlandés superior a §G55§! (actualmente §Y[?ENG_north_irish_nationalists|0]§!). Un voto a favor cede $STATE_17$ a Irlanda.\n§HUn dominio para toda Irlanda§! - Con Irlanda como nuestro sujeto y la descentralización norirlandesa resuelta, $STATE_17$ pasa a Dublín mientras Irlanda sigue siendo nuestra.\n§HDerogar el Acuerdo§! - Pone fin a los pagos de inmediato, restaura todo el peso de la tensión sectaria y el Úlster se levantará.\n--------------\n§gEste espíritu nacional se eliminará si dejamos de controlar $STATE_17$.§!"
 ENG_additional_expenditure_goodfriday_state_TT: "Por nivel de tensiones sectarias: (§Y[?ENG_north_irish_agitation]§!/§R100§!)\n- Guarniciones requeridas: §R+[?ENG_Paramilitary_required_garrison]%§!\n- Factor de crecimiento de la productividad estatal: §R[?ENG_Paramilitary_state_productivity_growth]%§!\n- Probabilidad de sabotaje de fábricas locales: §R[?ENG_Paramilitary_local_factory_sabotage]%§!"
 ENG_the_macabre_alliance: "La alianza macabra"
 ENG_the_macabre_alliance_desc: "Desde finales de la década de 1980, BP puso en marcha una estrategia de fronteras: una exploración de alto riesgo y alta recompensa con el objetivo de revertir el declive constante de sus reservas de petróleo. En 1991, BP encontró oro cuando Casanare produjo el mayor descubrimiento de petróleo de la compañía en más de dos décadas, pero con un alto riesgo de ataques guerrilleros. Solo en los últimos dos años, el Ejército de Liberación Nacional (ELN), una de las organizaciones guerrilleras de Colombia, ha volado el oleoducto de Occidental Petroleum más de 460 veces, desangrando financieramente a la compañía estadounidense. La Decimosexta Brigada, una unidad militar especializada y famosa por sus operaciones poco éticas, se creó expresamente para proteger los intereses petroleros y se convirtió en el escuadrón de la muerte personal de BP en Casanare. La Decimosexta Brigada fue financiada y colaboró con Defence Systems Limited, un contratista de seguridad privado británico fundado por antiguos miembros del SAS con profundos vínculos con el gobierno británico. El Ministerio de Asuntos Exteriores dejó clara su postura: BP opera sin contratiempos, cueste lo que cueste. El general Álvaro Velandia Hurtado lo llama 'resolución de conflictos'. Las familias de los fallecidos lo etiquetan de otra manera."
 ENG_additional_expenditure_Colombia_TT: "£corruption_cost_factor_texticon Coste de poder político para cambiar la corrupción: §R+15%§!\n--------------\n§YAyuda militar§! orientada a [COL.GetFlag] §YColombia§!:\n- Mayor probabilidad de ser aceptada.\n- No requiere que se encuentren bajo amenaza.\n\n§YManipular la política§! orientada a [COL.GetFlag] §YColombia§!:\n- Requisito de influencia: §G20%§! (30% de base)\n- Coste de poder político: §G-25%§!\n\nRecibe el §G20%§! de los ingresos por exportación de petróleo de [COL.GetFlag] §YColombia§!\n- Ingresos adicionales: £income_texticon $$[?additional_income_ENG_columbia_oil|+3]\n--------------\n§gEste espíritu nacional se eliminará si Colombia elimina los cárteles o si la corrupción es superior a Corrupción leve (Nivel 2).§!"
 ENG_the_dissident_campaign: "Campaña de los disidentes del IRA"
 ENG_the_dissident_campaign_desc: "Al rechazar el Acuerdo de Viernes Santo, los grupos republicanos disidentes, como el IRA Auténtico y el IRA de la Continuidad, se niegan a reconocer como legítima la autoridad británica en Irlanda del Norte. El IRA Auténtico se escindió del IRA Provisional en 1997, afirmando ser los verdaderos republicanos y denunciando el proceso de paz como una traición, viendo a los 'Provos' como colaboradores que vendieron la república a cambio de la autoridad británica. El IRA de la Continuidad surgió antes, en 1986, tras una escisión motivada por la decisión del Sinn Féin de poner fin al abstencionismo en el Dáil Éireann, rechazando el rumbo de la dirección y sosteniendo que el movimiento republicano existente había abandonado la verdadera reclamación constitucional de la soberanía irlandesa. Ambas facciones rechazan la legitimidad del proceso de paz. Estos grupos sostienen una insurgencia de baja intensidad contra el gobierno británico mediante atentados con bombas, tiroteos y ataques selectivos, al tiempo que actúan como fuerzas del orden de facto en los bastiones republicanos donde la Real Policía del Úlster tiene un control limitado. Un desarme verificado bajo la Comisión Internacional Independiente puede poner fin a la campaña de forma definitiva, y se ofrece bajo §HAsuntos descentralizados§! una vez que se haya logrado reducir la tensión en la Provincia."
 ENG_additional_expenditure_goodfriday_info_TT: "§H$STATE_17$§! - Actividad paramilitar:\n$ENG_additional_expenditure_goodfriday_state_TT$"
 ENG_dissident_campaign_TT: "Nivel mensual de tensión sectaria en Irlanda del Norte: §R+0.15§![ENG_dissident_campaign_active_loc]\n\n[ENG_no_longer_good_friday]\n--------------\n§YDesarme de los paramilitares§!\nLa decisión de §HDesarmar a los paramilitares§! bajo §HAsuntos descentralizados§! retira este espíritu de forma definitiva tras dos años de desarme verificado. Requiere el §YAcuerdo de Viernes Santo§! como marco de trabajo, y:\n- Tensión sectaria inferior a §G15§! (actualmente §Y[?ENG_north_irish_agitation|0]§!)\n- Dependencia de Irlanda del Norte superior a §G60§! (actualmente §Y[?ENG_north_irish_dependency|0]§!)\n- Desempleo inferior al §G10%§! (actualmente §Y[?total_unemployed_percentage_display|%]§!)\n\nPermitir que la tensión sectaria vuelva a superar los §R25§! colapsará el proceso."
 ENG_operation_banner_TT: "\n"
 ENG_dissident_campaign_inactive_effect_TT: "\n\nLos §Yefectos adicionales§! se encuentran actualmente §Yinactivos§!.\nRequiere un desempleo superior al §Y10%§!\n\n§YEfectos inactivos:§!\n- Nacionalismo irlandés mensual: §R+1.0§!\n- Gasto policial esperado: §R+0.05%§!\n--------------\n§g(Nivel actual de desempleo: [?total_unemployed_percentage_display|%])§!"
 ENG_dissident_campaign_active_effect_TT: "\n\nEstamos recibiendo lo siguiente debido a que el desempleo supera el §R10%§!\n§YEfectos:§!\n- Nacionalismo irlandés mensual: §R+1.0§!\n- Gasto policial esperado: §R+0.05%§!\n--------------\n§g(Nivel actual de desempleo: [?total_unemployed_percentage_display|%])§!\n"
 ENG_thales_mio_trait_mio_cat_civilian_ships_route_optimisation: "Optimización de rutas"
