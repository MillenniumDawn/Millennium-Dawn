 UN.201.d: "[FROM.GetLeader] has quietly approached [THIS.GetLeader], requesting that we change our vote to [vote_change_too] for the current United Nations General Assembly resolution. They have offered to give us Trade Agreements & Mutual Investment Treaties, along with cancelling any Embargos or Blockades if we agree to change our vote, to be granted after the vote is changed. We must decide if agreeing to their request is worth changing our stance on the General Assembly vote."
 UN.201.a: "申し出を受けよう。"
 UN.201.b: "この無礼な要求を拒否する"
 UN.202.t: "[FROM.GetName] Wishes to Sway Our Vote"
 UN.202.d: "[FROM.GetLeader] has quietly approached [THIS.GetLeader], requesting that we change our vote to [vote_change_too] for the current United Nations General Assembly resolution. They have offered to pay us 0.25% of our GDP as a lump sum payment if we agree to change our vote, to be granted after the vote is changed. We must decide if agreeing to their request is worth changing our stance on the General Assembly vote."
 UN.202.a: "申し出を受けよう。"
 UN.202.b: "この無礼な要求を拒否する"
 UN.203.t: "[FROM.GetName] Wishes to Sway Our Vote"
 UN.203.d: "[FROM.GetLeader] has quietly approached [THIS.GetLeader], requesting that we change our vote to [vote_change_too] for the current United Nations General Assembly resolution. They have offered to give us Military, Air Base, and Satellite Systems Access if we agree to change our vote, to be granted after the vote is changed. We must decide if agreeing to their request is worth changing our stance on the General Assembly vote."
 UN.203.a: "申し出を受けよう。"
 UN.203.b: "この無礼な要求を拒否する"
 UN.204.t: "[FROM.GetName] Wishes to Sway Our Vote"
 UN.204.d: "[FROM.GetLeader] has quietly approached [THIS.GetLeader], requesting that we change our vote to [vote_change_too] for the current United Nations General Assembly resolution. They have offered to give us Research, Construction, and Production subsidies and assistance if we agree to change our vote, to be granted after the vote is changed. We must decide if agreeing to their request is worth changing our stance on the General Assembly vote."
 UN.204.a: "申し出を受けよう。"
 UN.204.b: "この無礼な要求を拒否する"
 UN.300.t: "§Y教育科学文化機関§!§G補助金§!の喪失"
 UN.300.d: "§Y教育科学文化機関§!予算委員会による年次予算審査の結果、我が国はもはや§Y教育科学文化機関§!§G補助金§!を受給するための要件を満たしていないと判断された。その結果、我々は補助金制度を利用できなくなった。今後、制度の要件を満たせば再び申請できる可能性がある。"
 UN.300.a: "了解"
 UN.301.t: "§Y工業開発機関§!§G補助金§!の喪失"
 UN.301.d: "§Y工業開発機関§!予算委員会による年次予算審査の結果、我が国はもはや§Y工業開発機関§!§G補助金§!を受給するための要件を満たしていないと判断された。その結果、我々は補助金制度を利用できなくなった。今後、制度の要件を満たせば再び申請できる可能性がある。"
 UN.301.a: "了解"
 UN.302.t: "§Y資本開発基金§!§G補助金§!の喪失"
 UN.302.d: "§Y資本開発基金§!予算委員会による年次予算審査の結果、我が国はもはや§Y資本開発基金§!§G補助金§!を受給するための要件を満たしていないと判断された。その結果、我々は補助金制度を利用できなくなった。今後、制度の要件を満たせば再び申請できる可能性がある。"
 UN.302.a: "了解"
 recognition.16.t: "Recognize [FROM.GetName]?"
 recognition.16.d: "[FROM.GetNameDef] is formally requesting our diplomatic recognition. Whichever way we answer will be read as a statement of our position on their sovereignty."
 recognition.16.a: "We are not prepared to recognize them."
 recognition.16.b: "We recognize [FROM.GetName] as a sovereign state."
 recognition.18.t: "Recognize [FROM.GetName]?"
 recognition.18.d: "[FROM.GetNameDef]'s status is in question on the world stage. Every capital is taking a position. What is ours?"
 recognition.18.a: "We decline to recognize them."
 recognition.18.b: "我々は[FROM.GetName]の主権を承認する。"
 recognition.31.t: "[FROM.GetName] Seeks Our Recognition"
 recognition.31.d: "[FROM.GetNameDef] has declared independence from our territory and is asking us to accept the new reality. Our answer will define our relationship with them, and signal our position to others."
 recognition.31.a: "We will never recognize this regime."
 recognition.31.b: "We acknowledge [FROM.GetName]'s independence."
 UNSC.10.t: "Security Council Resolution Adopted"
 UNSC.10.d: "The United Nations Security Council has voted to adopt a resolution concerning [?global.current_sc_vote_nation.GetNameWithFlag]. [?global.current_sc_vote_nation.UNSCGetResolutionTypePassDesc]"
 UNSC.10.a: "Noted."
 UNSC.11.t: "Security Council Resolution Concerning [This.GetNameWithFlag]"
 UNSC.11.d: "The United Nations Security Council has voted to adopt a resolution concerning [This.GetNameWithFlag]. [UNSCGetResolutionTypePassDesc]"
 UNSC.11.a: "We acknowledge the passing of this resolution."
 UNSC_pass_type_1_desc: "A pressure resolution has been adopted, demanding the cessation of all offensive military operations within §Y210 days§!. Failure to comply will result in further sanctions."
 UNSC_pass_type_2_desc: "An economic sanctions resolution has been adopted, imposing trade and research penalties until the offensive threat to global peace has ended."
 UNSC_pass_type_3_desc: "A foreign volunteer restriction resolution has been adopted. Any nation that sends military volunteers in violation of this resolution will face additional sanctions."
 UNSC_pass_type_4_desc: "An arms embargo resolution has been adopted, cutting off access to the international arms market until all offensive conflicts have ended."
 COVID_events.0.t: "新たなウイルス"
 COVID_events.0.d: "武漢から新たなウイルスが出現した。複数の医師が、地元住民の間で急速に広がる呼吸器疾患を報告している。感染者数は1週間足らずで一桁から数十人にまで増加した。"
 COVID_events.0.a: "これについては注意深く見守ってください。"
 COVID_events.1.t: "内部告発医師たち"
 COVID_events.1.d: "Several doctors have begun sharing reports about the new virus on social media, comparing it to SARS. Local authorities want guidance. We can silence the reports to prevent panic, or allow them to circulate and risk public alarm."
 COVID_events.1.a: "彼らを黙らせる"
 COVID_events.1.b: "Let the truth come out."
 COVID_events.2.t: "Pandemic Confirmed"
 COVID_events.2.d: "The World Health Organization has confirmed the novel coronavirus as a global health emergency. Hospitals are overwhelmed and the virus is spreading beyond our borders. This will reshape our economy for years to come."
 COVID_events.2.a: "Brace for impact."
 COVID_events.3.t: "COVID-19 Emerges"
 COVID_events.3.d1: "A deadly new coronavirus has spread from China, where authorities initially suppressed reports of the outbreak. The delayed response has allowed the virus to spread unchecked across international borders."
 COVID_events.3.d2: "A deadly new coronavirus originating in China has been declared a global pandemic. Despite early warnings from Chinese doctors, the virus has spread rapidly across international borders."
 COVID_events.3.a: "Prepare our response."
 COVID_events.4.t: "The Pandemic Reaches [This.GetName]"
 COVID_events.4.d: "COVID-19 cases have been confirmed within our borders. Hospitals are bracing for a surge of patients and public fear is mounting. Economic activity is grinding to a halt as citizens self-isolate."
 COVID_events.4.a: "Lock everything down."
 COVID_events.5.t: "Global Supply Chains Collapse"
 COVID_events.5.d: "The pandemic has devastated international trade. Factory closures, port shutdowns, and transportation bottlenecks have created severe shortages of components and raw materials worldwide."
 COVID_events.5.a: "Stockpile whatever is left."
 pandemic_events.1.t: "Swine Flu Pandemic"
 pandemic_events.1.d: "A novel strain of H1N1 influenza has been identified in Mexico, spreading rapidly through the population. The World Health Organization is monitoring the situation closely as cases multiply and the virus threatens to cross international borders."
 pandemic_events.1.a: "Sound the alarm."
 pandemic_events.2.t: "H1N1 Reaches [This.GetName]"
 pandemic_events.2.d: "Cases of H1N1 swine flu have been confirmed within our borders. While less lethal than initially feared, the virus is spreading quickly and straining healthcare resources."
 pandemic_events.2.a: "Distribute masks and hope for the best."
 pandemic_events.3.t: "MERS Outbreak"
 pandemic_events.3.d: "A new coronavirus causing Middle East Respiratory Syndrome has been identified in our country. The virus appears to spread from camels to humans, with a disturbingly high fatality rate among those infected. Hospitals are preparing isolation wards."
 pandemic_events.3.a: "Contain the outbreak."
 pandemic_events.4.t: "Ebola Outbreak in West Africa"
 pandemic_events.4.d: "An outbreak of the Ebola virus has been confirmed in rural Guinea. The hemorrhagic fever is spreading through communities with terrifying speed, overwhelming local clinics. Without immediate intervention, the epidemic could engulf the entire region."
 pandemic_events.4.a: "God help us all."
 pandemic_events.5.t: "Ebola Spreads to [This.GetName]"
 pandemic_events.5.d: "Ebola cases have been confirmed within our borders as the West African epidemic breaches containment. Healthcare workers are at extreme risk and international aid organizations are scrambling to respond."
 pandemic_events.5.a: "We need help. Now."
 pandemic_events.6.t: "Ebola Returns in the Congo"
 pandemic_events.6.d: "A new Ebola outbreak has erupted in the eastern provinces of the Democratic Republic of the Congo. Armed conflict in the region is complicating containment efforts, as health workers face attacks from militia groups suspicious of outsiders."
 pandemic_events.6.a: "Deploy health teams under armed escort."
 pandemic_events.7.t: "MERS Cases in [This.GetName]"
 pandemic_events.7.d: "Cases of Middle East Respiratory Syndrome have been detected in our country, likely carried by travelers from Saudi Arabia. Health authorities are establishing screening protocols at airports and hospitals."
 pandemic_events.7.a: "Screen every traveler."
 pandemic_events.8.t: "Ebola Cases in [This.GetName]"
 pandemic_events.8.d: "Ebola cases have crossed the border from the Democratic Republic of the Congo. Cross-border movement in the region makes containment extremely difficult, and health workers are racing to trace contacts."
 pandemic_events.8.a: "Close the borders immediately."
 pandemic_events.9.t: "MERS Outbreak in South Korea"
 pandemic_events.9.d: "A single patient returning from the Middle East has triggered a devastating hospital super-spreader event. The virus is tearing through healthcare facilities as patients and staff spread it between wards. Over a hundred cases have been confirmed and dozens of deaths reported, exposing critical failures in our infection control protocols."
 pandemic_events.9.a: "Shut down every affected hospital."
 influence.60.t: "[event_target:coup_contest_victim.GetName]でのクーデター"
 influence.60.d: "Our intelligence services confirm what many suspected: [event_target:coup_contest_sender.GetNameWithFlag] has orchestrated a successful §Rcoup§! in [event_target:coup_contest_victim.GetNameWithFlag], installing a new regime sympathetic to their interests. We hold significant §Hinfluence§! in [event_target:coup_contest_victim.GetName] of our own, enough that we are not helpless here, if we choose to act. Our options run from a diplomatic denunciation to clandestine support for the old order. Each carries costs. Doing nothing may cost us more."
 influence.60.a: "[event_target:coup_contest_sender.GetName]を公に非難し、制裁を科す"
 influence.60.f: "[event_target:coup_contest_sender.GetName]に対して、対象を絞った§H経済制裁§!を課す"
 influence.60.b: "旧体制を密かに支援し、我々の影響力を拡大する"
 influence.60.e: "§RMilitary intervention§!: arm the resistance and posture against [event_target:coup_contest_sender.GetName]"
 influence.60.c: "新しい現実を受け入れ、前に進もう"
 influence.61.t: "[event_target:coup_contest_victim.GetName]での内戦"
 influence.61.d: "[event_target:coup_contest_sender.GetNameWithFlag]によるクーデター未遂は失敗に終わった。[event_target:coup_contest_victim.GetNameWithFlag]は§R内戦§!状態にあり、旧政権は依然として抵抗を続けている。我々の§H影響力§!ゆえに、どちらが勝利するかが、我々の利害関係と直接的なつながりがある。旧政権に武器を供給すれば、[event_target:coup_contest_sender.GetName]が勢力を固めるのを阻止できるかもしれない。資金のみを送れば、リスクを分散できる。全面的に関与すれば、我々が糸を引くことになる。関与しなければ、結果を他者に委ねることになる。"
 influence.61.a: "Arm the old regime: weapons, equipment, and political backing"
 influence.61.b: "旧体制を維持するために、ひそかに経済援助を送る"
 influence.61.e: "§RFull military intervention§!: commit to the old regime's victory"
 influence.61.c: "内戦には関わらない"
 News_influence.7.t: "[FROM.GetNameWithFlag] Condemns [event_target:coup_contest_sender.GetNameWithFlag]"
 News_influence.7.d: "[FROM.GetNameWithFlag] issued a scathing condemnation today of [event_target:coup_contest_sender.GetNameWithFlag]'s alleged role in the recent coup in [event_target:coup_contest_victim.GetNameWithFlag]. Diplomatic protests, targeted §Hsanctions§!, and a hardening of relations are all on the table. [event_target:coup_contest_sender.GetName]'s foreign ministry dismissed the accusations as 'baseless political theater,' but international opinion is hardening fast."
 News_influence.7.a: "An opening shot in the influence war"
 News_influence.8.t: "[FROM.GetNameWithFlag] Backs the Old Opposition in [event_target:coup_contest_victim.GetName]"
 News_influence.8.d: "Intelligence sources confirm what observers have suspected for weeks: [FROM.GetNameWithFlag] is quietly channeling §Hfunding§! and §Hpolitical support§! to the pre-coup opposition inside [event_target:coup_contest_victim.GetNameWithFlag]. Democratic factions inside the country are suddenly better organized, better funded, and noticeably more vocal. The §Hcoup regime§! in [event_target:coup_contest_victim.GetName] has called the activity 'an unacceptable foreign intervention'. The same activity they engaged in to take power."
 News_influence.8.a: "The contest for [event_target:coup_contest_victim.GetName] is not over"
 News_influence.9.t: "[FROM.GetNameWithFlag] Arms the Old Regime of [event_target:coup_contest_victim.GetName]"
 News_influence.9.d: "With [event_target:coup_contest_victim.GetNameWithFlag] engulfed in §Rcivil war§! after [event_target:coup_contest_sender.GetNameWithFlag]'s botched coup, [FROM.GetNameWithFlag] has dropped any pretense of neutrality. Cargo flights from [FROM.GetName] are landing in government-held territory loaded with §Hsmall arms§!, §Hvehicles§!, and, according to multiple sources, uniformed 'advisors'. The proxy war is now out in the open."
 News_influence.9.a: "A long fight ahead"
 News_influence.10.t: "[FROM.GetNameWithFlag] Opens a Military Intervention over [event_target:coup_contest_victim.GetName]"
 News_influence.10.d: "In the most escalatory response yet to [event_target:coup_contest_sender.GetNameWithFlag]'s coup in [event_target:coup_contest_victim.GetNameWithFlag], [FROM.GetNameWithFlag] has announced a formal §Rmilitary intervention§!. The language is measured, but the substance is not: forward-deployed units, standing orders to assist the pre-coup government, and open contempt for [event_target:coup_contest_sender.GetName]'s fait accompli. Global markets are in turmoil. The UN Security Council has been called into emergency session."
 News_influence.10.a: "The line has been crossed"
 influence.52.e: "§HModern Equipment§! Package (heavy AT, SAM, drones)"
 influence.52.a_preview_tt: "Send small arms, light anti-tank weapons, and anti-aircraft equipment"
 influence.52.b_preview_tt: "Send main battle tanks, amphibious / specialized tanks, and utility vehicles"
 influence.52.e_preview_tt: "Send heavy anti-tank missiles, surface-to-air missiles, and military drones"
 influence.57.t: "How Large a Package?"
 influence.57.d: "We have decided what to send. Now we need to decide §Hhow much§!. Larger packages cost more §Hpolitical capital§!, generate more §Rworld tension§!, and trigger international news coverage."
 influence.57.a: "Send a §HSmall§! package"
 influence.57.b: "Send a §HMedium§! package"
 influence.57.c: "Send a §HLarge§! package"
 influence.57.e: "On second thought, cancel"
 News_influence.11.t: "[FROM.FROM.GetName] Sends Major Arms Package to [FROM.GetName]"
 News_influence.11.d: "[FROM.FROM.GetName] has announced a §Hlarge military aid package§! to [FROM.GetName]: thousands of small arms, vehicles, and support equipment. Analysts note the transfer signals a hardening of [FROM.FROM.GetName]'s commitment to [FROM.GetName]'s defense. Rivals are furious; allies are watching to see who is next."
 News_influence.11.a: "The arms keep flowing"
 News_influence.12.t: "[FROM.FROM.GetName] Transfers Advanced Weapons to [FROM.GetName]"
 News_influence.12.d: "In a transfer that crosses every red line in the global arms market, [FROM.FROM.GetName] has shipped §Hheavy anti-tank missiles§!, §Hsurface-to-air systems§!, and §Hcombat drones§! to [FROM.GetName]. Each of these weapons is the kind that turns regional skirmishes into wars. [FROM.GetName]'s rivals are calling it a direct threat. Diplomatic phone lines are lighting up across capitals."
 News_influence.12.a: "Modern war just got modern weapons"
 influence.2.t: "Offer Economic Aid to [FROM.GetName]?"
 influence.2.d: "We have elected to begin drafting an Economic Aid package for [FROM.GetName]. We can transfer a fixed sum directly from our treasury. This generosity will improve relations and grant us influence in [FROM.GetName]. The more we give, the more influence we will gain.\n\n"
 influence.2.a: "Send §G25 Billion§! in Economic Aid."
 influence.2.b: "Send §G50 Billion§! in Economic Aid."
 influence.2.c: "Send §G75 Billion§! in Economic Aid."
 influence.2.e: "Send §G100 Billion§! in Economic Aid."
 generic.5.f: "We are better off without them."
 ecuadornews.1.t: "Military Coup in Ecuador"
 ecuadornews.1.d: "The Ecuadorian military has intervened amid a deep political and economic crisis, removing President Jamil Mahuad from power. Senior officers, led by General Carlos Mendoza, have taken control of the situation, sidelining both the civilian government and CONAIE protest leadership. The armed forces describe the move as a temporary measure to restore stability, though it remains unclear how quickly civilian rule will return or what form it will take."
 ecuadornews.1.a: "興味深い"
 ecuadornews.2.t: "エクアドルにおける軍事クーデター"
 ecuadornews.2.d: "経済危機と政府の物議を醸す改革により、エクアドルは限界点に達した。エクアドル先住民族連合（CONAIE）が主導する大規模デモと、複数の若手将校の離反を受け、反政府指導者たちは救国評議会の結成を発表した。宣言された救国評議会は、国家統合を象徴する三者指導体制として提示されている。その構成員は、先住民指導者アントニオ・バルガス、民間判事カルロス・ソロルサーノ、軍代表ルシオ・グティエレス将軍である。"
 ecuadornews.2.a: "興味深い。"
 ecuadornews.3.t: "エクアドル救国評議会の崩壊"
 ecuadornews.3.d: "The attempt to form a civilian-military junta in Quito has failed. Despite mass protests and the occupation of Congress by CONAIE and allied groups, senior military command has refused to support the new government. General Carlos Mendoza has taken control of the situation, sidelining the protest leadership and ending the junta project. Without military backing, the coalition has quickly disintegrated with many of the plotters being arrested."
 ecuadornews.3.a: "興味深い。"
 ecuador.1.t: "Adopting the Dollar"
 ecuador.1.d: "Economic instability continues to grip the country following the 1998–1999 financial crisis. President Jamil Mahuad proposes dollarizing the economy in order to halt inflation and restore confidence in the financial system. At the same time, the government cuts more than 60% of the armed forces' budget, severely damaging relations with the military."
 ecuador.1.a: "Push Dollarization"
 ecuador.1.b: "Pull Back on some Radical Reforms"
 ecuador.2.t: "Uprising in Quito"
 ecuador.2.d: "In response to the government's economic plans, Indigenous crowds flock to Quito, demanding the dismissal of President Jamil Mahuad. Protesters occupy Congress and the Supreme Court, paralyzing the state and exposing the government's inability to maintain order. As pressure mounts in the capital, the loyalty of security forces and the survival of the administration are increasingly called into question."
 ecuador.2.a: "Maintain Order"
 ecuador.3.t: "Government of National Salvation"
 ecuador.3.d: "In a purely symbolic act, protest leaders announce on national television the creation of a so-called National Salvation Junta, claiming to represent the will of the people. The declaration receives widespread public support and further undermines the authority of the civilian government. The Junta is presented as being headed by General Carlos Mendoza"
 ecuador.3.a: "General Lucio Gutiérrez Assumes Leadership"
 ecuador.3.b: "Forwards We Move"
 ecuador.4.t: "The Three Person Junta"
 ecuador.4.d: "The proclaimed National Salvation Junta is now presented as a tripartite leadership meant to symbolise national unity. It consists of Indigenous leader Antonio Vargas, civilian judge Carlos Solórzano, and military representative General Lucio Gutiérrez."
 ecuador.4.a: "Something Different"
 ecuador.5.t: "Senior military commanders do not back Government"
 ecuador.5.d: "While public opinion largely supports CONAIE's occupation of Congress and the call for President Mahuad's resignation, there is little appetite for direct military rule. Aware of this, General Carlos Mendoza sidelines the coalition and takes control of negotiations. The high command, closely tied to Ecuador's political and economic elites, including figures such as León Febres Cordero, who rejects the junta's plans outright and is further swayed by the threat of U.S. economic sanctions, forces a decisive break with the protest leadership."
 ecuador.5.a: "General Mendoza cedes power to Gustavo Noboa"
 ecuador.5.b: "Don't Step Down"
 recognition.45.t: "Enough Recognition to Seek UN Membership"
 recognition.45.d: "Enough UN member states now recognize our sovereignty to credibly pursue a seat at the United Nations. We may petition the General Assembly for membership."
 recognition.45.a: "Begin the bid."
 anti_bully.2.t: "Public War Weariness"
 anti_bully.2.d: "We have decided war is our best course of action. However, in order to maintain support among the people we must either win this quickly or push quickly into foreign soil. The people will march as long as they see how necessary this war is. Boots march, drums beat, and the time for [FROM.GetName] to go to war is upon us!\n\n§YThis triggers the Public War Weariness System§!\n"
 anti_bully.2.a: "We Must Win!"
 UNSC.12.t: "Security Council Resolution Concerning [This.GetNameWithFlag] Fails"
 UNSC.12.d: "The United Nations Security Council has voted down the proposed resolution concerning [This.GetNameWithFlag]. It received [?global.security_council_vote_yes^num] of the [?global.un_sc_required_yes] required §GYes§! votes, and no veto was cast. A simple majority is not enough in the §YSecurity Council§!. No measures will be adopted at this time."
 UNSC.12.a: "We take note of the outcome."
 UNSC.6.t: "Disarmament of [?global.current_sc_vote_nation.GetName]"
 UNSC.6.d: "A resolution declaring [?global.current_sc_vote_nation.GetName] in material breach of its disarmament obligations is before the Security Council. It offers a final opportunity to comply, and warns of serious consequences if they do not.\n\nIt does not authorise the use of force, and the sponsors know it. That omission is the price of the votes they need. What the resolution buys them is not permission but standing, and if it fails they will have neither.\n\n$unsc_vote_pass_tt$"
 UNSC.7.t: "Demand the Surrender of a Wanted Terrorist by [?global.current_sc_vote_nation.GetName]"
 UNSC.7.d: "A resolution demanding that [?global.current_sc_vote_nation.GetName] surrender a wanted terrorist sheltering on its territory is before the Security Council. The evidence has been laid before this chamber, and the regime's answer so far has been silence.\n\nIf the resolution passes, [?global.current_sc_vote_nation.GetName] will face United Nations sanctions until the demand is met.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_6_desc: "A disarmament resolution has been adopted, finding the nation in material breach and warning of serious consequences. It stops short of authorising force."
 UNSC_pass_type_7_desc: "A resolution demanding the surrender of a wanted terrorist has been adopted. United Nations sanctions will remain in force until the demand is met."
 influence.62.t: "Foreign Lobbyists Capture Our Government"
 influence.62.d: "Committee chairs who spent last session demanding restrictions on foreign capital have gone quiet. Ministry staff return calls from [?var:ROOT.influence_lobbied_by.GetNameWithFlag]'s embassy before they return ours, and the members who would ordinarily lead a push against foreign influence are now on retainers we cannot trace. Nothing illegal will ever be proven, but for the next several months our government has no appetite for the fight and no votes to spare for it."
 influence.62.a: "Our hands are tied"
 hongkong_news.10.t: "Hong Kong is Annexed by China"
 hongkong_news.10.d: "China has formally absorbed the Special Administrative Region of Hong Kong, ending its separate status. The territory's institutions and administration now fall under direct central control from Beijing, as [CHI.GetLeader] has described the move as the culmination of Hong Kong's return to the motherland."
 hongkong_news.10.a: "The Pearl has returned to the fold."
 hongkong_news.10.b: "A significant development."
 generic.6.a: "Together we shall defend democracy."
 generic.6.b: "何人も我らに逆らうことはできぬ！"
 generic.6.c: "The workers' plight could not ask for finer champions!"
 generic.6.e: "We shall set our differences aside, for now."
 generic.7.b: "Then we will crush them, too!"
 generic.7.c: "Their revolution is corrupt!"
 generic.7.e: "Our differences were too great."
 GLOBAL_angolan_civil_war_over: "The Angolan Civil War is Over"
 AFG_news.1.t: "Civil War in Afghanistan Quiets Down"
 AFG_news.1.TAL.d: "Despite best efforts by the Afghan Armed Forces and their Western allies, the Taliban have managed to gain full control of all the major cities, including the capital Kabul. Most government officials have gone into hiding or to exile, including the Afghan president [AFG.GetLeader] currently residing in the United States.\n\nThe triumph of the Taliban is sure to increase the frequency of terror attacks in the region and worldwide."
 AFG_news.1.AFG.d: "The Afghan government have declared victory against the Taliban. The majority of strongest outposts and cities have been cleared of their presence, and most of what fighters remain have escaped across the border into Pakistan. Though the Taliban are reduced to only a few pockets and cells, the insurgency is projected to last for many years to come, albeit at lower levels.\n\nThis victory has shown the effectiveness of the rebuilt Afghan Army, and the resolve of the Afghan government."
 AFG_news.1.a: "Interesting"
 AFG_news.2.t: "Afghanistan Claims Pashtunistan"
 AFG_news.2.d: "Due to a surge of violence in Pakistan, the Afghan government has strengthened their claims to the areas of Pakistan where Pashtuns live. The Durand Line (the contemporary border between Afghanistan and Pakistan) has long been a source of conflict between the two countries, as it transferred land from the Emirate of Afghanistan to Pakistan under British control.\n\nThe Pashtuns themselves living in the area don't seem to be overly excited over this development, as many are comfortable living inside Pakistan. It is likely that Afghanistan won't be able to press their claims other than by force."
 AFG_news.2.a: "Interesting"
 AFG_news.3.t: "Afghanistan Claims Baluchistan"
 AFG_news.3.d: "As the crisis in Pakistan deepens, Afghanistan expands its claims. Today the Afghan government announced that Baluchistan, in addition to Pashtunistan, is an integral part of Afghanistan."
 AFG_news.3.a: "A Worrying Development"
 AFG_news.4.t: "Afghanistan Invades Pakistan"
 AFG_news.4.d: "In a move to secure its claim, Afghanistan has moved for a more direct path to gain some land. Acting in the name of Pashtun security, they have started moving troops across the border into Pakistan."
 AFG_news.4.a: "A Worrying Development"
 AFG_news.5.t: "Taliban Join Forces"
 AFG_news.5.d: "The Afghan and Pakistani Taliban have decided to join forces to combat common threats together. This is a big balance shift in power in Central Asia."
 AFG_news.5.a: "Worrisome."
 AFG_news.6.t: "Assassination of Ahmad Shah Massoud"
 AFG_news.6.d: "Ahmad Shah Massoud, the main leader of the Afghan resistance against the Taliban, has been assassinated by Al-Qaeda. Two members of Al-Qaeda, posing as journalists, set off explosives hidden in their equipment. Massoud was gravely wounded and evacuated in a military helicopter but he died of his wounds before reaching a hospital.\n\nKnown as the Lion of Panjshir, Massoud was a symbol of resistance first against the Soviet occupation, and then against the Taliban."
 AFG_news.6.a: "A loss."
 AFG_events.3.t: "Assassination of Ahmad Shah Massoud"
 AFG_events.3.d: "Ahmad Shah Massoud, the Lion of Panjshir, was targeted today by a suicide bomber. Two members of Al-Qaeda, posing as journalists, set off explosives hidden in a camera and a battery pack. Massoud was gravely wounded, and was immediately evacuated from the scene in a military helicopter."
 AFG_events.3.a: "Let us pray to Allah that he survives."
 AFG_events.4.t: "The US Exerts its Influence"
 AFG_events.4.d: "As the Taliban have been defeated, the US has used its influence to affect the decisions of the Loya Jirga. A new interim administration has been formed."
 AFG_events.4.a: "Are they any better than the Taliban?"
 AFG_hostage_crisis.1.t: "South Korean missionaries held hostage by the Taliban"
 AFG_hostage_crisis.1.d: "Today a group of South Korean missionaries that was travelling through the Ghazni province were captured by Taliban militants and are being held hostage. They are demanding the release of prisoners and the withdrawal of all South Korean soldiers in Afghanistan. \n\nOur military advisor suggested sending an extraction group to rescue the hostages and the South Korean delegation sent a representative to negotiate."
 AFG_hostage_crisis.1.a: "We can't trust the Taliban, send the extraction team."
 AFG_hostage_crisis.1.b: "The hostages' security is our priority, send the representative."
 AFG_hostage_crisis.2.t: "Hostages Rescued"
 AFG_hostage_crisis.2.d: "Our special forces were able to infiltrate the Taliban hideout and escorted the hostages to the nearest military post. \n\nThe missionaries will return to South Korea and our soldiers are being praised by the media."
 AFG_hostage_crisis.2.a: "Mission completed."
 AFG_hostage_crisis.3.t: "Hostages killed during rescue attempt"
 AFG_hostage_crisis.3.d: "Taliban militants noticed our special forces entering their hideout and executed the hostages immediately. \n\nAfter the fight, our soldiers were able to escape the building, without the hostages."
 AFG_hostage_crisis.3.a: "Mission failed."
 AFG_hostage_crisis.4.t: "Taliban demands prisoners release"
 AFG_hostage_crisis.4.d: "The representative has returned with the Taliban demands, the release of all Taliban inmates from North American prisons is the main demand."
 AFG_hostage_crisis.4.a: "Request the release of prisoners."
 AFG_hostage_crisis.4.b: "We won't release war criminals!"
 AFG_hostage_crisis.5.t: "Taliban demands South Korean withdrawal"
 AFG_hostage_crisis.5.d: "The Taliban has demanded the withdrawal of all our forces and the payment of a ransom for the release of our citizens."
 AFG_hostage_crisis.5.a: "We must accept."
 AFG_hostage_crisis.5.b: "We won't negotiate with terrorists!"
 AFG_hostage_crisis.6.t: "The US denies our request"
 AFG_hostage_crisis.6.d: "Representatives from the US military have rejected our request to release Taliban inmates from military prisons \n\nthe Jihadists reacted by killing two hostages before proposing new demands, the North Korean government has also called for the release of the hostages"
 AFG_hostage_crisis.6.a: "How will the Taliban react to this?"
 AFG_hostage_crisis.7.t: "Afghan government rejects Taliban demand"
 AFG_hostage_crisis.7.d: "The representatives of the Afghan government have dismissed the Taliban demands as unrealizable, the Jihadists reacted by killing two hostages before proposing new demands, the North Korean government has also called for the release of the hostages"
 AFG_hostage_crisis.7.a: "Barbaric!"
 AFG_hostage_crisis.8.t: "South Korea withdraws from Afghanistan"
 AFG_hostage_crisis.8.d: "Following a hostage crisis in Afghanistan the South Korean government have accepted the Taliban demands and started retreating their forces. \n\nThe Taliban announced that a ransom of twenty million dollars was paid, however the South Korean government didn't make any statement."
 AFG_hostage_crisis.8.a: "Afghanistan continues to destabilize."
 AFG_hostage_crisis.9.t: "South Korean hostages executed"
 AFG_hostage_crisis.9.d: "Following a hostage crisis in Afghanistan the South Korean government have rejected all the Taliban demands, the next day they announced that all the hostages were assassinated."
 AFG_hostage_crisis.9.a: "More victims of the Afghan conflict."
 AFG_contact_iran.0.t: "Afghanistan calls back their people"
 AFG_contact_iran.0.d: "Our Fatemiyoun brigades are growing In Iran and they consist of the Hazara Shia Afghan men, Afghanistan Is requesting their return to their homeland so they can help the country they've been living in for several millennia."
 AFG_contact_iran.0.a: "Let them unite with their lands."
 AFG_contact_iran.0.b: "No, we need the manpower."
 AFG_contact_iran.1.t: "Iran Refuses to send our Hazara Fatemiyoun"
 AFG_contact_iran.1.d: "After requesting [PER.GetName] to send back Fatemiyoun to help In [AFG.GetName] and under a lot of communication between our two nations the Iranians have decided to deny the request of our Hazara men."
 AFG_contact_iran.1.a: "Allah knows best!"
 AFG_contact_iran.2.t: "Iran Accepts our call on the Hazara Fatemiyoun"
 AFG_contact_iran.2.d: "[PER.GetName] has accepted our request for the return of our Hazara soldiers to aid and return to their homelands, Five divisions are on their way with the flags raised high In the air chanting \"Zindabad Hazaristan!\""
 AFG_contact_iran.2.a: "Harakat!"
 AFG_contact_iran.3.t: "Afghanistan Requests Axis of Resistance membership"
 AFG_contact_iran.3.d: "The Shia Hazaras of Afghanistan request to join the Axis of Resistance, following the Hazaras' takeover of Afghanistan they are now requesting membership In our resistance."
 AFG_contact_iran.3.a: "Let Khorasan Unite!"
 AFG_contact_iran.3.b: "We do not accept the request."
 AFG_contact_iran.4.t: "Iran Accepts our request to join their faction"
 AFG_contact_iran.4.d: "[PER.GetName] has accepted our request for the membership of the Resistance Axis. We're stronger together!"
 AFG_contact_iran.4.a: "Allahu Akbar!"
 AFG_contact_iran.5.t: "Iran Declines"
 AFG_contact_iran.5.d: "[PER.GetName] has declined our request for the membership of the Resistance Axis. We should not rely on them anymore."
 AFG_contact_iran.5.a: "Sad"
 AFG_contact_iran.6.t: "The Hazaras Of Afghanistan Declare Hazaristan"
 AFG_contact_iran.6.d: "This morning Karim Khalili the Hazara politician of Afghanistan has declared their own state following their successes in the country with rapid reforms and with the adherence to Shia Islam, hundreds of thousands of Hazaras have taken to the streets of Kabul, Bamiyan, Mazar-i-Sharif, and Herat to celebrate the declaration of Hazaristan."
 AFG_contact_iran.6.a: "Interesting"
 world_war.12.t: "The Taiwan Question"
 world_war.12.d: "With the world's great powers locked in a global war of attrition, few remain who could intervene on Taipei's behalf. The chance to reclaim the renegade province and complete our reunification may not come again."
 world_war.12.a: "Reunification, at last"
 world_war.12.b: "We cannot risk a war"
 UNSC.8.t: "Recommend Permanent Membership for [?global.current_sc_vote_nation.GetName]"
 UNSC.8.d: "[?global.current_sc_vote_nation.GetNameWithFlag] has applied for permanent membership of the United Nations Security Council. The Council must recommend the application without a veto before it can proceed to the General Assembly.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_8_desc: "The Council has recommended the application for permanent membership. It will now proceed to the General Assembly for final approval."
 UNSC.13.t: "A New Permanent Security Council Member"
 UNSC.13.d: "The Security Council and General Assembly have approved [?global.unsc_last_permanent_admission.GetNameWithFlag] as a permanent member of the United Nations Security Council. The country now holds a standing Council seat and the power of veto."
 UNSC.13.a: "The Council has expanded."
 UN.22.t: "Permanent Security Council Membership for [?global.current_ga_vote_nation.GetName]"
 UN.22.d: "The Security Council has recommended [?global.current_ga_vote_nation.GetNameWithFlag] for permanent membership. The General Assembly must approve the application by a two-thirds majority before the country gains a permanent seat and veto.\n\n$un_ga_vote_requires_2_3_tt$"
 econvent.16.t: "Modern Production Methods Spread"
 econvent.16.d: "Firms across [ROOT.GetName] are adopting improved production methods and reorganizing their workplaces. The changes are raising output across the economy."
 econvent.16.a: "Encourage the transition"
 econvent.17.t: "Education Investments Bear Fruit"
 econvent.17.d: "Years of investment in schools and vocational training have expanded the pool of skilled workers. Employers are putting that expertise to productive use."
 econvent.17.a: "Put these skills to work"
 econvent.18.t: "Foreign Technology Spreads Domestically"
 econvent.18.d: "Trade links have exposed local firms to better machinery and industrial practices. Domestic producers are now adapting those methods to their own operations."
 econvent.18.a: "Support domestic adoption"
 econvent.19.t: "Semiconductor Foundry Investment Announced"
 econvent.19.d: "A private consortium has committed to building a new semiconductor foundry in [ROOT.GetName]. Reliable access to industrial inputs and power has made the project commercially viable."
 econvent.19.a: "Welcome the investment"
 econvent.20.t: "Composite Industry Expansion Announced"
 econvent.20.d: "Manufacturers are expanding domestic composite production to supply advanced civilian and military industries. Investors expect secure raw materials to keep the new plant competitive."
 econvent.20.a: "Support the expansion"
 econvent.21.t: "Defense Contracts Expand Production"
 econvent.21.d: "New defense contracts have given manufacturers the confidence to expand production. The project will create skilled jobs while strengthening the national industrial base."
 econvent.21.a: "Award the contracts"
 econvent.22.t: "Commercial Shipbuilding Orders Surge"
 econvent.22.d: "Export demand and strong maritime business conditions have filled domestic order books. Shipbuilders are expanding capacity to meet the new contracts."
 econvent.22.a: "Back the shipyards"
 corruption.19.t: "A Year to Deliver"
 corruption.19.d: "Public pressure has created a narrow opportunity for meaningful reform. The government must turn that momentum into results before entrenched interests regroup."
 corruption.19.a: "Launch the anti-corruption drive"
 corruption.19.b: "Decline the challenge"
 UNSC.12.d_veto: "The United Nations Security Council has voted down the proposed resolution concerning [This.GetNameWithFlag]. A §YPermanent Member§! voted §RNo§!, which §Rvetoes§! the resolution no matter how many §GYes§! votes it received ([?global.security_council_vote_yes^num] of [?global.un_sc_required_yes] required). No measures will be adopted at this time."