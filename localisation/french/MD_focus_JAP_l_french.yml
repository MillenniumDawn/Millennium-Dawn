 JAP_earthquake.1.t: "Earthquake Strikes [?JAP_quake_state.GetName]"
 JAP_earthquake.1.d: "A strong earthquake has struck [?JAP_quake_state.GetName]. The Japan Meteorological Agency reports shaking of intensity six on its scale near the epicentre, with tremors felt across neighbouring prefectures. Roads have buckled, rail services are suspended while tracks are inspected, and several factories have halted production to check for structural damage. Local governments are assessing casualties and requesting assistance from Tokyo."
 JAP_earthquake.2.t: "Built to Withstand the Next One"
 JAP_earthquake.2.d: "The last region has passed its seismic survey, and the reconstruction of the areas devastated by the Great East Japan Earthquake is complete. Hospitals and city halls sit on base isolators, the old schools have been jacketed or replaced, and the expressway piers carry steel collars. Japan cannot stop the ground from moving, but for the first time in its history a major tremor is no longer a national emergency."
 JAP_earthquake.2.a: "We are ready."
