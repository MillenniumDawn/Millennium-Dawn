 ukraine_modernize_sov_equipment_brdm_2_modernization_arey_wait_tt: "§YArey§! presents the §YBKM Hekkon§! in about §Y$DAYS$§! days."
 ukraine_modernize_sov_equipment_brdm_2_modernization_both_wait_tt: "Both prototypes are presented in about §Y$DAYS$§! days. Then we adopt one of them."
 ukraine_modernize_sov_equipment_brdm_2_modernization_arey_rival_tt: "§YArey§!, a design team of army and National Guard volunteers, is building a similar vehicle. We decide which one to back."
 ukraine_modernize_sov_equipment_brdm_2_modernization_convert_tt: "We can now §Gconvert§! our §YBRDM-2§! to this variant on a production line."
 ukraine_modernize_sov_equipment_brdm_2_modernization_stockpile_40_tt: "At least §Y40§! light reconnaissance vehicles of the §YBRDM-2§! generation in our stockpile (current: §Y[?num_equipment@medium_tank_destroyer_chassis_0|0]§!)"
