 ukraine_praktyka_otaman_plan_6x6_tt: "Прототип §YОтаман 6x6 122§! будет готов через §Y$DAYS$§! дн. Затем линия 6x6 продолжится §YОтаманом 6x6 «Гром»§! и §YОтаманом-3§!."
 ukraine_praktyka_otaman_plan_8x8_tt: "Прототип §YОтаман 8x8§! будет готов через §Y$DAYS$§! дн. Затем мы выберем, расширять ли линейку 8x8 или улучшать бронетранспортёр."
 ukraine_praktyka_otaman_plan_both_tt: "Оба прототипа будут готовы через §Y$DAYS$§! дн., и обе линии продолжатся дальше."
 ukraine_praktyka_otaman_next_otaman_6x6_73_tt: "§LПрактика§! начинает работу над боевой машиной пехоты §YОтаман 6x6 «Гром»§!, она будет готова через §Y$DAYS$§! дн."
 ukraine_praktyka_otaman_next_otaman_3_tt: "«Практика» начинает работу над §YОтаманом-3§! для нашей морской пехоты, он будет готов через §Y$DAYS$§! дн."
 ukraine_praktyka_otaman_next_otaman_8x8_shturm_tt: "§LПрактика§! начинает работу над §YОтаманом 8x8 «Штурм-М»§!, он будет готов через §Y$DAYS$§! дн."
 ukraine_praktyka_otaman_mortar_wait_tt: "Мы сразу передаём «Практике» §Y40§! наших §YБТР-60§!. Она переделает их в самоходные миномёты примерно через §Y$DAYS$§! дн."
 ukraine_praktyka_otaman_mortar_stockpile_tt: "У нас на складах не менее §Y40§! БТР-60"
 ukraine_praktyka_otaman_kpvt_wait_tt: "§YОтаман 8x8 КПВТ§! будет готов примерно через §Y$DAYS$§! дн."
 ukraine_praktyka_otaman_improve_wait_tt: "«Практика» представит свои идеи по бронетранспортёру примерно через §Y$DAYS$§! дн."
 ukraine_praktyka_otaman_turkey_tt: "§YБТР-60М «Хорунжий»§! будет готов, как только отношение §YТурции§! к нам станет не ниже §Y30§!. Если этого не произойдёт в течение §Y$DAYS$§! дн., проект провалится."
