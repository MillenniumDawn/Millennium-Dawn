l_english:
corroboree_event.1.t: "The Speech at Corroboree"
corroboree_event.1.d: "Howard stood behind the elder as he gave the [GetASTLeaderTitle]'s introduction. He would give his speech at Corroboree. Something that had become a signature of his campaigning and leading style since elected. This time, however, the crowd would be cold. There were no impassioned shouts as he gave his rhetoric of 'practical reconciliation' and measured approach. Many of the crowd had been waiting for hours, and it seemed none of them were impressed by what seemed like more empty promises of progress. A few walked away, and some heckled as they turned their backs in protest. \n \nAfter the speech, and a lukewarm applause was given, Howard spoke with the elders at length. He gave no concessions for an apology, or any moves that he saw as \"empty gestures.\" The parties eventually departed, and there was an air of disappointment that hung for some time."
corroboree_event.1.a: "Could've been worse..."
mining_giants_talk.1.t: "A Meeting with the Giants"
mining_giants_talk.1.d: "As expected the various mining heads have requested we extend our tax cuts to take advantage of the ongoing mining boom. Their reasoning claims that the saved funding would allow them to expand operations in the long term. The additional cut is small and unlikely to derail our finances, but we could decide against the request and simply keep things the same. Alternatively we could increase the tax rate to rake in some of the boom ourselves, with little immediate consequence."
mining_giants_talk.1.a: "Give them the tax cut."
mining_giants_talk.1.b: "Let's keep things the same."
mining_giants_talk.1.c: "Up the tax rate and rake in our share."
civil_partnership_act.1.t: "The Civil Partnership Act Passes Nationwide"
civil_partnership_act.1.d: "Gathered outside Capital Hill thousands of advocates were the first to witness Peter Costello deliver news that the first legislation for marriage recognition had passed almost unanimously. The cross-party bill passed after a national postal survey gave the reform unprecedented momentum. \n \nPresented by the Coalition, who had previously only recognised the concepts of traditional marriage, and supported by almost all members of Labor and the Greens, the passing came as a shock to many of the crowd, who reacted with a mix of tears and joy. Costello remarked that the act wasn't just a step for gay rights, but \"the rights of all Australians,\" and that the door was open for reform in the future. While couples will still need to marry outside of the country, those already married will now be able to legally bind their partnership."
civil_partnership_act.1.a: "Good for them."
the_national_apology.1.t: "The National Apology"
the_national_apology.1.d: "After what initially seemed like foot-dragging, John Howard delivered an official national 'apology' for historical wrongs against the nation's indigenous population: the Aborigines and Torres Strait Islanders. \nThe historic gesture, based on the Bringing Them Home report from 1997, was presented in Parliament house by the [GetASTLeaderTitle], and has sent an emotional shockwave across Australia. Crowds in the Great Hall and on the lawns outside Parliament cheered and clapped. Several thousand people gathered in the rain to watch the momentous speech in the Sydney streets. A profound sense of relief and healing has been felt by the community, and many in it are hailing the reconciliation efforts by the coalition an unquestionable success."
the_national_apology.1.a: "It's time to move forward."
pacific_solution.1.t: "The Pacific Solution"
pacific_solution.1.d: "The Australian government has approached us with a proposal regarding offshore processing facilities. In exchange for hosting these sites, they have offered to significantly upgrade our local infrastructure and naval port facilities to support the operations."
pacific_solution.1.a: "Accept the Australian investment."
pacific_solution.1.b: "Our sovereignty is not for sale."
pacific_solution.3.t: "Papua New Guinea Accepts"
pacific_solution.3.d: "Thankfully the Papua New Guinea government has agreed to our proposal. Construction of the new processing facilities will begin promptly."
pacific_solution.3.a: "As expected."
pacific_solution.4.t: "Papua New Guinea Declines"
pacific_solution.4.d: "Our neighbors have declined the proposal, citing concerns over sovereignty and local opposition. We will have to find another way."
pacific_solution.4.a: "Disappointing."
pacific_solution.5.t: "Nauru Accepts"
pacific_solution.5.d: "The regional government in Nauru has accepted our proposal. Another step in our Pacific Operations has gone off without a hitch."
pacific_solution.5.a: "As expected"
pacific_solution.6.t: "Pacific Solution Rejected"
pacific_solution.6.d: "Nauru declined the proposal. It appears they won't be helpful in our immigration problems and has instead resigned to remaining isolated in the Pacific."
pacific_solution.6.a: "This is disastrous..."

stomp_out_the_roots.1.t: "Australia Offers Counter-Terrorism Cooperation"
stomp_out_the_roots.1.d: "The Australian government has proposed a joint security initiative focused on countering eliminate extremist cells within our country. They are offering extensive tactical support and intelligence sharing."
stomp_out_the_roots.1.a: "Cooperate for a safer Indonesia."
stomp_out_the_roots.1.b: "We can handle our own internal security."
stomp_out_the_roots.2.t: "Indonesia Agrees to Cooperation"
stomp_out_the_roots.2.d: "Jakarta has formally accepted our proposal. Our operations in their territory can begin immediately, and our intelligence agencies are already handling the move over."
stomp_out_the_roots.2.a: "The beginning of a strong partnership."
stomp_out_the_roots.3.t: "Jakarta Rejects Joint Initiative"
stomp_out_the_roots.3.d: "The Indonesian government has declined our offer of military cooperation, preferring to handle the matters alone."
stomp_out_the_roots.3.a: "Their loss."
state_visit: "State Visit"

ast_off_to_delhi.1.t: "A Visit to India"
ast_off_to_delhi.1.d: "After Howard got off the plane it was smiles and hand shaking all the way to the podium. After their independence we've maintained tepid relations with each other. Enough not to offend. Now we were meeting for the fourth time this month. The local media was relishing the opportunity to showcase India's appeal to foreign leaders, and wasted no time in panning Howard for his policies at home. That wouldn't be enough to turn the government away. We'd be exporting uranium at a higher rate than any other nation nearby could, and they'd smile and nod with the promise of no enrichment, while we smiled along. At the end of the day this was another 'leg-up' for Australia. We were the ones reaping the benefits, and every handshake brought us closer to being the biggest exporter in the pacific."
ast_off_to_delhi.1.a: "A win-win for both nations."

ast_trade_deal: "Major Trade Deal"
ast_trade_agreement: "Trade Agreement"
refused_trade_deal: "Refused Our Trade Deal"

marks_trade.1.t: "Trade Overtures from Australia"
marks_trade.1.d: "In an effort to strengthen regional economic ties, the Australian government has reached out with a proposal for a 'tariff-free' trade agreement. The proposal includes lessened restrictions on importing our electronics in exchange for exclusive mineral rights. Both our nations stand to prosper significantly from the increased flow of goods between us, however, the choice remains ours."
marks_trade.1.a: "A prosperous partnership awaits."
marks_trade.1.b: "Our markets must remain protected."

ast_our_capacity_for_peace.1.t: "Australia Proposes Peacekeeping Initiative"
ast_our_capacity_for_peace.1.d: "Aiming to safeguard the stability of the Pacific, the government in Canberra has approached us with a plan for joint-peacekeeping operations. The proposal would effectively be a foundation for military cooperation between us, specifically counter-terrorism. The proposal does also include future plans for intelligence sharing. We could accept the offer now and deal with any changes they suggest down the line, or we could outright refuse it."
ast_our_capacity_for_peace.1.a: "Peace is the only path forward."
ast_our_capacity_for_peace.1.b: "We decide how the pacific is safeguarded on our own."
ast_our_capacity_for_peace.2.t: "Agreement Reached"
ast_our_capacity_for_peace.2.d: "Beijing has responded favorably to our proposal. Our peacekeeping initiative is officially underway, and they've pledged to join us shortly to solidify the move."
ast_our_capacity_for_peace.2.a: "We'll keep a close eye on them."
ast_our_capacity_for_peace.3.t: "Proposal Rejected"
ast_our_capacity_for_peace.3.d: "Our overtures for a mutual peacekeeping pact have been met with cold indifference by the government in Beijing. Their diplomats have responded with concerns for their own sovereignty in the pacific."
ast_our_capacity_for_peace.3.a: "We shall stand alone, then."

fossil_fuels.1.t: "Fossil Fuels for Yuan"
fossil_fuels.1.d: "Australia has proposed a massive expansion of coal exports to fuel our growing industrial sectors. In exchange for favorable currency exchange rates, they are ready to become our primary energy partner."
fossil_fuels.1.a: "The engines of industry require fuel."
fossil_fuels.1.b: "We will secure the coal our own way."
fossil_fuels.2.t: "Fossil Fuels for Yuan"
fossil_fuels.2.d: "Building upon our existing peacekeeping initiative, Australia has suggested a comprehensive trade pact. By securing our energy supply lines through this 'Fossil Fuels for Yuan' program, we further cement our energy security and supply."
fossil_fuels.2.a: "Our partnership grows even stronger."
fossil_fuels.2.b: "Their cooperation will be enough."
fossil_fuels.3.t: "Coal Agreement Signed"
fossil_fuels.3.d: "The Chinese government has been reluctant to agreed to any longterm fossil fuel commitments. For now they have accepted a modest export proposal to supply their reserves. Our mining sector is already making the preparations for the agreement."
fossil_fuels.3.a: "Excellent."
fossil_fuels.4.t: "Fossil-fuel Proposal Refused"
fossil_fuels.4.d: "China has declined all of our offers to expand coal exports, citing their desires for energy independence."
fossil_fuels.4.a: "A missed opportunity."

fossil_fuels.5.t: "The Chinese counterproposal"
fossil_fuels.5.d: "Surprisingly, upon receiving our proposal for expanding coal exports, the Chinese delegates countered with an offer of their own. A priority trade agreements covering a vast range of Chinese electronics and goods in exchange for virtually tariff-free trade on our coal and other mineral exports. The outcome could not have been better for us. Our industry heads are scrambling to secure the exports while the deal stands."
fossil_fuels.5.a: "Our lucky streak continues."

ast_jap_trade.1.t: "Trade Negotiations with Australia"
ast_jap_trade.1.d: "Weeks of negotiating with the Australians has produced the first rendition of a comprehensive trade agreement. The specifics include exporting vast quantities of agricultural products to our shores in exchange for lowering their tariffs on our electronics and automobiles. This could provide a steady food supply, but we could take the opportunity to push for more."
ast_jap_trade.1.a: "Accept the terms as proposed"
ast_jap_trade.1.b: "Demand priority rights to their precious minerals"
ast_jap_trade.1.c: "The terms are unfavorable"
ast_jap_trade.2.t: "Japanese Trade Agreement Signed"
ast_jap_trade.2.d: "The delegation in Tokyo has sent word that the negotiations have been a success. This is the first time that Japan has negotiated a comprehensive economic partnership agreement or free trade agreement with a major economy, let alone with us. This marks a serious turn for our relations, and may underpin a stronger relationship for many years to come."
ast_jap_trade.2.a: "Cheers to that!"
ast_jap_trade.3.t: "Japan Demands Mineral Rights"
ast_jap_trade.3.d: "The negotiations have taken a turn. They're now demanding priority access to our precious mineral deposits to support their growing tech industry, and offset the cost of lowering tariffs. This would put a serious strain on our own domestic resource availability, and makes the deal less favourable overall. We could push them to return to the original deal, but it might risk the negotiations entirely."
ast_jap_trade.3.a: "Agree to their new terms and secure the deal"
ast_jap_trade.3.b: "Hold our stance. Demand the original deal"
ast_jap_trade.4.t: "Trade Proposal Refused"
ast_jap_trade.4.d: "The delegation in Tokyo has sent word that the negotiations have fallen through. It seems they walked out of the boardroom without much of a hint of further discussion. Our plans for an agreement are essentially dead in the water. While this puts a serious curb in our plans for trade, there may be other avenues we can explore."
ast_jap_trade.4.a: "A setback for our now"
ast_jap_trade.5.t: "Australia Holds Firm"
ast_jap_trade.5.d: "The delegates from Canberra are staying firm on the original offer, refusing any negotiations for mineral rights. They have made it clear that the offer agreement for agricultural imports in exchange for lowering tariffs is final."
ast_jap_trade.5.a: "Perhaps we were rash."
ast_jap_trade.5.b: "Then there's no deal to be had."
ast_partner_with_the_japanese_outcomes_tt: "Japan may accept, counteroffer for mineral rights, or refuse. A counteroffer gives both countries another choice before Japan accepts or declines the revised offer."

base_state_visit.1.t: "Visiting the United States"
base_state_visit.1.d: "Howard had previously visited the White House in 1999 during some discussions on tariffs. It was raining then and, as if symbolically, it was raining again. He made his way through the front doors, after meeting the president, to a troupe of reporters with umbrellas. Everything was large in the US. Their shops were large, their churches were large. The residence for the president was especially large. Australian didn't have anything to that equivalent in size, and definitely not as grand. One could say they were compensating for something, but they really had it all, and eventually we would have to come to the table to get our share of that. Whether it was guarantees for pacific defense or trade procurement, Australia would have to prove itself as a valuable partner. As we had with Vietnam and Korea, we would be there for the next one."
base_state_visit.1.a: "For our peace of mind."
base_state_visit.2.t: "Visiting China"
base_state_visit.2.d: "When Howard landed in Beijing the first to meet him was the Chinese Premier. Past the Chinese media hovering around them, the premier lead them to a restaurant cordoned off nearby to discuss their options for trade. China was a very eager partner to negotiate with, but there were always caveats to working with them. The reality of their authoritarianism was not forgotten by Howard, and it was apparent in every discussion the Chinese had to feel like they were getting the upper hand. Negotiations with them became a fine dance of outlining the future Australia wanted and somehow aligning it with theirs. Every card needed to be played before their next trade talks to keep us on a fair footing. When they both got up to leave Howard felt confident he'd played just well enough."
base_state_visit.2.a: "And the stage was set."
base_state_visit.3.t: "Normalising the North Koreans"
base_state_visit.3.d: "Discussions with the North Koreans were unique in that the groundwork had not been established with the nation for some decades, and Howard was more or less stepping into uncharted territory. Worse was the disconnect between them. Every engagement would be indirectly handled through our connections in China, who would then parse it to the Koreans. There was never any expectation of a face to face talk, but the fact that Howard himself was never speaking with a real representative gave the whole thing an odd tone. Eventually they agreed to an embassy in Canberra, which from the get-go made Howard uncomfortable, but if they were ever going to continue the talks it would have to be done."
base_state_visit.3.a: "Better than nothing."
base_state_visit.4.t: "A Visit from South Korea"
base_state_visit.4.d: "The South Korean President arrived early that morning in Canberra with a very singular goal in mind. Australia arrived hand-in-hand with the Americans when the Korean war broke out. Ever since then we've been an easy choice for defense certainty in the Pacific, and as long as their northern neighbour had nuclear weapons, we would remain that way. Now that very question was brought up. The president was courteous about it, but eventually we would need to solidify something. Walking around the Botanic Gardens [KOR.GetLeader] talked about the ongoing economic woes, and how the North Korean talks had stalled. In the meantime a trade pact would be agreed on, but nothing else was promised."
base_state_visit.4.a: "It will have to do for now."
base_state_visit.5.t: "The Gallipoli Ceremony"
base_state_visit.5.d: "The people of Turkey have always been considerate about the Anzac tradition. I suppose it's easy when you were the winning side that day, but they have been understanding enough to designate a site for us to visit every year and honor the dead. Most see the ceremony as a moment to mourn, or take with them the meaning that war is pointless and so on. Few consider the day as a blunder of international alliances, and that without the British dumping us onto the peninsula a few hundred thousand might not have died that day. Our previous leaders did, as we switched from England to America, and since then the focus on alliances has been ingrained into every party's policy. Thankfully Turkey has remained a loyal friend."
base_state_visit.5.a: "Lest we forget."
base_state_visit.6.t: "The Monarchy Visits"
base_state_visit.6.d: "Her Majesty Queen Elizabeth II, accompanied by His Royal Highness the Duke of Edinburgh, arrived in Australia as part of her Golden Jubilee celebrations. \n\nThe royal couple landed in Adelaide on 27 February 2002 and will visit several cities, including Cairns and Canberra, coinciding with the Commonwealth Heads of Government Meeting.  \n\nCrowds waving the British Union Jack flag cheered from the public gallery set up for the queen's 13th visit, and lined along the 5-mile route from the airport to Admiralty House. The [GetASTLeaderTitle] is expected to welcome her shortly, and it is possible the failed republican referendum will be on the list of topics."
base_state_visit.6.a: "Let's keep things civil."
rudd_state_visit.1.t: "Visiting Russia"
rudd_state_visit.1.d: "There were few countries on earth bigger than Australia geographically. None would argue the Russian Federation was one of them. Howard wasn't ready for the cold when he stepped off the plane. After two days in the country it still hollowed him out when he stepped outside and the icy wind blew through him. A number of people had gathered outside the hotel with Australian and Russian flags, which was reassuring. Kevin Rudd had organized this meeting, and Howard felt like he was thrown in the deep end. Was wrestling with the bear really the right way? They were still rearing from the economic shock of the 90s. Theoretically the Russian president would be looking for any trade assistance to keep them afloat, but Howard hardly felt welcome since his arrival. He'd have to work to convince them that Australian uranium was worth the negotiations."
rudd_state_visit.1.a: "The beginning of something..."

leaked_memo.1.t: "The Leaked Memo"
leaked_memo.1.d: "Somehow one of those journos got their hands on a letter by one of our party men, Shane Stone, which happened to include a number of harsh criticisms of our government. The Guardian is already painting the phrase \"Mean and Tricky Howard\" as their headline. I don't know how it got out but the media is running a circus on of it, and now we're having to play catch up to cover our ends. Some of the party, including Peter, is demanding we string up Stone politically like some kind of desperate mob hunt. Until the news of it dies down we can't do a thing, and this sorely slows down our momentum for change. If anything I can't imagine it could get worse."
leaked_memo.1.a: "Can it?"

reconciliation_journey.1.t: "The Journey to Reconciliation"
reconciliation_journey.1.d: "Howard and the media team shuffled into the small room where one of the aboriginal councilmen was waiting. Some more papers were signed, then they posed for the cameras. As the councilman turned and shook Howard's hand, the [GetASTLeaderTitle] noticed how hard his hands were, covered in calluses and boney. His face seemed hard too, but his eyes were watery. Howard could see the years of hardship on the man's face, and hope he was holding onto now. Careful not to lose. \"Thank you, Mr Howard.\" He said before leaving with the journalists. \n \nHe was alone now, and he stood there for a moment in thought. He'd flipped on policies for reconciliation more times than he was comfortable with, and yet the country was seemingly better off for it. After everything he'd done, little by little, Australia was finally moving forward. A sense of satisfaction set in for him as he stood there in silence. Eventually more media people came in and the day continued as normal."
reconciliation_journey.1.a: "There's more to be done."
ast_the_coalition_convention.1.t: "The Coalition Convention"
ast_the_coalition_convention.1.d: "\"We have achieved much, we have conquered opposition. Australia stands proud and tall around the world. We are respected for what we have achieved with our economy, and we are seen as a nation prepared to take a stand on international issues. There's a golden thread that runs through so many Coalition policies, and that is that great principle of choice. Greater choice for all Australians to choose their future. Our nation is freer than it ever has been. Its people are earning more, buying more, and living prouder.\" \n \n\"The challenge ahead of us is every bit as great as it was when we sought to come back into office in 1996 and as we seek again in the next election. In the meantime much can be done to continue improving the state of our expenditures and the growing economy. Many supporters are expecting more policies to improve their lives and the lives of many more, in and outside of Australia. Our burden is inherent to our moral core. We are a nation of giving everyone a 'fair go.' Each and every one of us knows our responsibility to lead. That responsibility has not ceased.\""
ast_the_coalition_convention.1.a: "The challenge isn't over."
the_white_paper.1.t: "Implementing the White Paper"
the_white_paper.1.d: "The Defense 2000 paper was made as a comprehensive review of our current military capabilities, and those that current administration demands. With more weight on the defensive capabilities of Australia as a major supplier of security and peacekeeping in the Pacific, the demands have predominantly been to expand. Not just personnel. Command, technologically, our weapon manufacturing, all need to be improved or expanded. Thankfully, we have a number of programs in development that could help us achieve this."
the_white_paper.1.a: "Our production matters most."
the_white_paper.1.b: "We can't fight without our forces."
the_white_paper.1.c: "They can handle the demand."
the_white_paper.2.t: "Implementing the Second White Paper"
the_white_paper.2.d: "Whether we are suffering from success or not, we are once again tasked with beginning the restructuring with an initial target. The first suggestion has been an overhaul of the movement methods field units incorporate to make them more efficient. Changes to our reinforcement policy was also suggested. Otherwise we could fallback on high command to speed up their current research on our doctrines."
the_white_paper.2.a: "Movement will be our key."
the_white_paper.2.b: "Reinforcements are always needed."
the_white_paper.2.c: "Back to the drawing board."
lithgow_arms.1.t: "The Lithgow Small Arms Sale"
lithgow_arms.1.d: "Thales has offered a sum to purchase and renovate the old factory to be used for our production means. They've been reliable in our weapons production efforts before, and the factory is in a bit of a state. Giving it new life with them could be the best thing. We could, however, refurbish the building ourselves."
lithgow_arms.1.a: "Sell it."
lithgow_arms.1.b: "We can fix it up."
governor_general_sacked.1.t: "Governor General Sacked"
governor_general_sacked.1.d: "For perhaps the first time in Australia history the Governor General has been removed from their position by Queen Elizabeth herself. The surprising news has come after a series of talks between the UK correspondence and the Prime Minister, and whether intended or not, has seemingly resulted in the removal. How this will affect the ongoing policy-making of the current government isn't clear, but it has come as a shock to many royal family supporters in the country. Spokesmen from the Liberal government have yet to comment on the sacking."
governor_general_sacked.1.a: "Good riddance."
solomon_islands_intervention.1.t: "The Solomon Islands Collapse"
solomon_islands_intervention.1.d: "Following a series of militant uprisings and failed disarmaments, the government in the Solomon Islands has effectively collapsed, leaving a state of lawlessness in its place. Widespread fighting is now occurring between the warring militant groups over ethnic tensions, and public services have completely broken down, leaving many vulnerable to the violence and resulting in a growing humanitarian crisis. Prime Minister Allan Kemakeza has formally sent out a desperate plea for help from neighbouring countries to assist the failed state, to which the Australian government has yet to comment on any intervention. Without any change the situation on the Islands is expected to only get worse."
solomon_islands_intervention.1.a: "A worrying development."
solomon_islands_intervention.2.t: "Solomon Islands Intervention"
solomon_islands_intervention.2.d: "Ever since the Bali Bombings, everyone in the senate has been touchy about the topic of terrorism. Right now the situation in the Solomon Islands has done everything but put us at ease. It's very likely that the worse things get, the more it could spill over into our waters, and create a whole new breeding ground for the bomb-building types. The Prime Minister over there has already bid us with a request for intervention, if we put the idea to a vote the result would be almost unanimous. We have the moral imperative, but going in there could keep us trapped in a quagmire worse than we've ever experienced before, and it may only make things worse. How we go about this, either way, won't be easy."
solomon_islands_intervention.2.a: "We need to intervene."
solomon_islands_intervention.2.b: "It's not our conflict."
sol_intervention_tt: "§2Decisions to intervene in the Solomon Islands will be unlocked.§!"
sol_intervention_failure_tt: "§RThe situation will only worsen...§!"
solomon_islands_intervention.3.t: "The Intervention a Success"
solomon_islands_intervention.3.d: "So far the situation on the ground has improved to the point where shops are beginning to reopen, the roads are clear of militants, and reconstruction efforts have begun. Our forces will need to remain in the country for some years, but we can take some relief that the nation is stabilising, and hopefully beginning to heal. The Solomon Islands government is indebted to us and will continue work closely with organising the provisional state. Meanwhile the international reaction to our efforts has been nothing but positive. We continue to reap in good optics whilst our security in the Pacific gets stronger."
solomon_islands_intervention.3.a: "A job well done."
solomon_islands_intervention.4.t: "A Nation Without Hope"
solomon_islands_intervention.4.d: "The situation in the Solomon Islands has only worsened during our intervention efforts and has grown so unstable that we've been forced to recoup our losses and abandon the intervention. Militants continue to battle in the streets and the remaining government has practically disbanded. The international reaction has been a quieted shock, with the remaining countries taking part in the intervention similarly discontinuing efforts. Little hope remains for those enduring in the islands now."
solomon_islands_intervention.4.a: "What a disaster..."
solomon_islands_intervention.6.t: "Warlord Seizes Power in the Solomon Islands"
solomon_islands_intervention.6.d: "Jimmy Lusibaea, leader of the notorious militant group 'Malaita Eagle Force,' stormed the parliament building late yesterday afternoon and has installed himself as interim leader. After months of fighting on the ground in Guadalcanal between the last remnants of the state police and Lusibaea's forces, a ceasefire was brokered allowing the group passage into the capital, eventuating in the coup. \n\nSince the effective collapse of the government months earlier and the state of lawlessness on the islands, the paralysis of the government has become a breeding ground for militant fighting, and has sparked a migrant crisis in the region. The rebel leader claims that the new government will work to end the current crisis, and return diasporic Malaitans to the main island who were forced to flee in the years prior."
solomon_islands_intervention.6.a: "Darkness falls over the islands."
walk_for_reconciliation.1.t: "The Walk for Reconciliation"
walk_for_reconciliation.1.d: "Over 250,000 Indigenous and non-indigenous protestors have marched across the Sydney Harbour Bridge today in a public act of support for reconciliation. In a continuous stream lasting nearly six hours the political demonstration has been the largest in Australian history. One of the organisers, Evelyn Scott, has admitted that the crowds were far more than they expected, and that they hoped the act was not missed by the administration, who has appeared out of step with public sentiment regarding reconciliation. During the demonstration, marchers cheered as a skywriter wrote the word \"sorry\" in the sky above the harbour. According to the organiser, more marches are being planned to follow up on the walk's success."
walk_for_reconciliation.1.a: "They're free to do so."
sydney_olympic_games.1.t: "The Sydney Olympic Games Begin"
sydney_olympic_games.1.d: "The Summer Olympic Games have officially begun in Sydney, Australia. Broadcasted in 220 countries and territories, giving this Games the highest coverage in Olympic history, the opening featured sprinter Cathy Freeman delivering the torch, who also grabbed the country's 100th gold medal in the 400-metre final. 199 countries are taking part in the event, including North Korea, who was seen marching together with South Korea under a single flag, marking their symbolic unity for the first time in half a century. The event is expected to continue for another two weeks during which the participating countries will compete against eachother."
sydney_olympic_games.1.a: "Very good."
shell_takeover.1.t: "Shell's Takeover of Woodside Petroleum"
shell_takeover.1.d: "News has made it our way that Royal Dutch Shell has been pursuing a takeover of Woodside Petroleum worth $10 billion. Both companies have shared a close relationship over the last few years, and Shell has made it apparent that their technical support for the North-West LG project would move to a more involved expansion of the facilities. Our deputy leader and treasurer for the party Peter Costello, however, has been vocally against the move and is advising us to block the deal on the grounds that such a large company owning the majority of gas projects opposes our national interests."
shell_takeover.1.a: "Block the bid."
shell_takeover.1.b: "Allow the takeover."
tampa_affair.1.t: "The Tampa Affair"
tampa_affair.1.d: "The government's new policy on asylum seekers has become a catalyst for a political storm that erupted after a Norwegian vessel was turned away off the coast of Christmas Island. The commander of the freighter MV Tampa, Captain Arne Rinnan, had rescued hundreds of estranged asylum seekers from an Indonesian fishing boat and was attempting to bring them to safety in Australia. Despite the poor health of the 433 asylum seekers on the Tampa, the ship was boarded by SAS troops and ordered to turn around. A mostly negative response has come from the Norwegian embassy regarding the shift to target illegals by the Howard government. How far the policy may go is anyone's guess"
tampa_affair.1.a: "An unfortunate circumstance."
bali_bombings.1.t: "The Bali Bombings"
bali_bombings.1.d: "Terror has spread across the Indonesian island of Bali as three bombs were detonated killing an estimated 202 people, including 88 Australians. The sense of peace and distance the nation has had during the growth of terrorist activity overseas has been suddenly shattered last night. Two of the bombs were reportedly located in busy nightspots, where Australian tourism is commonplace, whilst the third exploded in front of the American consulate in Denpasar. While the connection to al-Qaida is unclear, the attack was certainly perpetrated in an act of terrorism. \n \nOver 50 bodies laid covered in white sheets on the footpath of the once busy street the following morning. A harsh message that Australia is no longer a bystander in the ongoing fight against terror."
bali_bombings.1.a: "Dear God..."
embassy_attacked.1.t: "Australian Embassy Attacked"
embassy_attacked.1.d: "Reports are coming in that an explosion occurred outside one of our embassies in Indonesia this morning at about 10am. Thankfully none of our staff were killed, but so far 9 people have been killed and around 150 are wounded from what was likely a car bomb. It seems evident that this was aimed at us, and we're unsure right now if this is connected to the previous bombings in Bali, although it is a similar attack. The Indonesia government has personally been in touch with us to organise an investigation. This might only be the beginning of more targeted attacks."
embassy_attacked.1.a: "This is turning into a nightmare."
asian_earthquakes.1.t: "Indian Aid"
asian_earthquakes.1.d: "More than 11,000 people have been killed from the earthquakes across Asia right now. Thousands of homes and cars have been swept away by tsunamis ravaging the coastlines, resulting in mass communication blackouts across the affected regions, and an untold amount of devastation to roads and trainlines. In particular, India is facing some of the worst of it, although how much damage has been inflicted is unknown at this time. The global Red Cross has issued an emergency appeal for immediate aid to the affected countries. We could use this opportunity to send a support package to India, and strengthen our existing ties."
asian_earthquakes.1.a: "We'll support them."
asian_earthquakes.1.b: "They're on their own."
asian_earthquakes.2.t: "Australia Offers Aid"
asian_earthquakes.2.d: "In response to the earthquakes effecting us and the rest of Asia right now, Canberra has offered us an aid package to support the recovery."
asian_earthquakes.2.a: "A surprise, to be sure, but a welcome one."
cronulla_riots.1.t: "Cronulla Race Riots"
cronulla_riots.1.d: "In the beach suburb of Cronulla local gangs of up to 200 men descended into a confrontation with local police outside of a mosque in what is being described as race riots. This follows a number of confrontations, one of which included some 5,000 rally members attacking individuals of Middle Eastern appearance. The fighting has spread to other areas of Sydney in a series of revenge attacks by members of the Muslim community. The riots have since left more than 30 injured, including police and medical staff, and has led to 16 arrests. Multiple religious groups have been vocal in their criticism of the attacks, and local police have made a return to order a priority, but the high tensions in Sydney streets remain."
cronulla_riots.1.a: "It's their right to complain I suppose."
cronulla_riots.1.b: "Clamp down on them."
rip_steve_irwin.1.t: "Death of an Icon"
rip_steve_irwin.1.d: "Naturalist Steve Irwin, who gained worldwide fame as TV's Crocodile Hunter, has tragically died during a diving accident in which a stingray pierced his chest. The incident occurred whilst filming an underwater documentary off Port Douglas. The crew attempted to bring him to an emergency rescue helicopter, but died before paramedics could arrive. The death has been a shock to many Australians, and fans around the world. \n \n\"It's a dreadful loss for the tourism industry and for nature conservation. Everybody who met Steve was impressed with his energy and his enthusiasm, he was a real Aussie larrikin.\" The Queensland tourism minister, Margaret Keech explained. The death of the national icon has prompted deeply affected reactions from even those in parliament, who addressed the death with condolence speeches by both [AST.GetLeader] and members of the opposition."
rip_steve_irwin.1.a: "Australia has lost a wonderful and colourful son."
a_global_financial_crisis.1.t: "A Global Financial Crisis"
a_global_financial_crisis.1.d: "The collapse of the American housing market and subsequent bank closure has made its way across the waterways to us. Already our dollar is rapidly depreciating and consumer confidence has plunged. In response the Reserve Bank has reared and cut the cash rate, and dozens of firms are shutting down in the face of a recession. If we don't get a handle on this and slow the fall, unemployment could skyrocket and we could face a depression the likes we haven't seen in decades."
a_global_financial_crisis.1.a: "It got worse."
rus_deal_ast.1.t: "A Deal from the Australians"
rus_deal_ast.1.d: "Canberra has offered us a trade deal for favorable export rights to their uranium deposits. The Australians have been insistant that minerals be used for energy projects, and not for weapons enrichment. Indeed the deal would go well in fueling our reactors, and we can always change our minds later. On the other hand do we trust them to supply us?"
rus_deal_ast.1.a: "Very well."
rus_deal_ast.1.b: "No thanks."
rus_deal_ast.2.t: "The Russian Trade Deal"
rus_deal_ast.2.d: "Moscow has agreed to our trade deal. We will ship them our uranium at a fair price, and rubles will flow into the Australian treasury. They have already begun organising the shipments with their trade office."
rus_deal_ast.2.a: "Excellent."
rus_deal_ast.3.t: "The Russian Trade Deal"
rus_deal_ast.3.d: "Moscow has declined to our trade deal and have argued that their uranium source will remain more localised."
rus_deal_ast.3.a: "Well, we tried."
isr_ast_visit.1.t: "A Visit to the Holy Land"
isr_ast_visit.1.d: "Howard was fond of the Israelis. Their resilience wasn't unlike that found in Australians, and their diplomats were some of the best around. Though they never wasted the opportunity to tell you of their plight in the middle east. A constantly suffering nation, yet their dedication to the values of democracy was admirable. \n \nHe stood in front of the wall now, and a great sadness flowed through Howard. This must've been the third time he'd visited the country, but this was his first time seeing the Wailing Wall. The emotion in seeing it was almost overwhelming, and it welled within him. Perhaps this was how the Israelis felt all the time. Such loss. One of the aids asked Howard if he wished to touch the wall, as was tradition. Without a word he nodded and they approached it. A thin, circular hat was placed on his head, and as he touched the wall he felt the spirit of it blow into him."
isr_ast_visit.1.a: "A biblical experience."
adf_acq_astuirement.1.t: "ADF Acquirement Contenders"
adf_acq_astuirement.1.d: "Our picks for main provider of acquirement has been rounded down to three options. Our first, and the easiest to rationalise, is the United States. They've made some good advancements with their main battle rifles, and their experience overseas, as well as our shared defense commitments, makes them an easy pick on a strategic level. The second option is Germany. If we're not going with Austria, we might as well pick their neighbour. Heckler and Koch have become one of the best rifle manufacturers world wide. We wouldn't be going wrong there. Lastly is old reliable Belgium. No one will dismiss the FN series as a fine piece of equipment, and our commonwealth friends in the UK have developed their own line to suit their needs. We can easily do the same."
adf_acq_astuirement.1.a: "Stick it with the Americans."
adf_acq_astuirement.1.b: "Go for quality."
adf_acq_astuirement.1.c: "Old Reliable"
ast_high_speed_rail.1.t: "High Speed Project Faces Delays"
ast_high_speed_rail.1.d: "It seems almost expectedly that the project has run into a complication. The route south of Brisbane is planned to go through a long set of mountains. The estimates for the mountains density were off and the current excavation is going to cost significantly more."
ast_high_speed_rail.1.a: "This was expected."
ast_high_speed_rail.1.b: "Scrap the project."
ast_high_speed_rail.2.t: "Land Acquisition Issues Plague the High Speed Rail"
ast_high_speed_rail.2.d: "More problems have come up in the suburban areas required for the rails passage. A number of NIMBY (Not in My Backyard) groups have been opposing the development proposal and the legal battles could halt the project indefinitely. Going around the area will mean scrapping the current route and drafting another."
ast_high_speed_rail.2.a: "What did the NIMBY's ever do for us?"
ast_high_speed_rail.2.b: "Absolutely not."
ast_high_speed_rail.3.t: "Resource Costs Slow The Rail"
ast_high_speed_rail.3.d: "Another setback for the High Speed Rail Project. The orders for iron previously established have suddenly fallen through after steel costs have skyrocketed. Now the distributors are asking for three times the previous rate, which considering how much original cost was, is a sizeable chunk of the whole budget."
ast_high_speed_rail.3.a: "How much was that again?"
ast_high_speed_rail.3.b: "Tell him he's dreaming."
ast_high_speed_rail.4.t: "High Speed Rail Costs Redrafted"
ast_high_speed_rail.4.d: "After almost five years of construction for the project the original, and additional funding, has almost been used up. With the costs for labour, permits and materials at an all time high the investment into the project is being redrafted to include another 80 billion dollars. Some of the planners are convinced the light is at the end of the tunnel, but after so many setbacks nothing about the project is a assured."
ast_high_speed_rail.4.a: "Please let it be over."
ast_high_speed_rail.4.b: "I'm not falling for that one again."
ast_high_speed_rail.5.t: "High Speed Rail Unveiled"
ast_high_speed_rail.5.d: "After a number of setbacks and budget creeps the High Speed Rail Network has been unveiled, with the first train leaving Brisbane station. The rail line, which has been touted as being the absolute state of the art, currently runs from Brisbane to Melbourne, and is stated to make the trip in a little under 6 hours. Many gathered around the station, which had been remodeled to accommodate the transformed rail line, to witness the train arrive. \n \nThe project undoubtedly represents a modernization of the nation in recent years, and is expected to service over 200,000 travelers every day. Transforming the way many Aussies are going to travel."
ast_high_speed_rail.5.a: "A marvel of engineering!"
base_state_visit.7.t: "A Trip to Indonesia"
base_state_visit.7.d: "Things were pretty tense after the bombings, such to the point where Howard couldn't take a step in either direction without a cordon of troops following once he hopped off the plane. The Indonesians were careful to keep appearances, but the ongoing insurgency in Aceh was a sore look. The Prime Minister of Indonesia seemed more than happy to discuss the ongoing security commitments, despite negotiations of that very topic falling through again and again. Things between our nations had grown tenuous now, far from the 'kumbaya' of post-colonialism years, and the cracks were very much showing."
base_state_visit.7.a: "Until next time."
generic_bushfires_ast.1.t: "Widespread Bushfires in Rural Australia"
generic_bushfires_ast.1.d: "An unusually hot and dry summer has sparked rampant bushfires across Victoria. Over 1 million hectares of land has burnt so far as many of the smaller fires have combined in the Great Divide and merged. Thankfully the fires have been limited to mostly uninhabited mountain ranges and national parks, albeit some buildings and livestock have still been lost. Firefighters are continuing to contain the spread successfully. Despite this smoke is currently causing disruptions to flights at Melbourne Airport."
generic_bushfires_ast.1.a: "Troubling."
papua_affair.1.t: "Diplomatic Talks Go Up In Smoke"
papua_affair.1.d: "It seems a complication occurred at the Brisbane Airport when the Prime Minister of Papua New Guinea, [PAP.GetLeader], arrived for talks. One of the airport's staff requested the leader to remove their shoes during the typical security checks, which apparently was seen as humiliating by the PNG. The leader straight up turned around and left, and it seems the official meeting with Howard has been cancelled. Small protests in Port Moresby are already asking for an apology from us. The aid program, and any future defense talks, might be completely sunk now."
papua_affair.1.a: "Attempt to scrounge something."
papua_affair.1.b: "This is a lost cause."
ast_howard_of_arabia.1.t: "Howard of Arabia"
ast_howard_of_arabia.1.d: "The car bounced over another deep pothole and Howard almost hit his head on the top of the jeep. The diplomat in the front seat spun around and began to quickly explain how the road here was damaged by debris from falling missiles, as a result of the Iron Dome. While Howard nodded and agreed that it was better than the alternative, he couldn't help but think the image of the country he'd developed in the city was not the same as the reality out here. The IDF seemed to be around every corner as the car was turning into the consulate, where Howard was to deliver his speech on regional security. \n \nAustralian had already sunk its boots into the middle east, and now it was going to be stationing a permanent base to assist the Israelis keep a lid on things. In many ways it seemed despite the very western outlook they were holding, Israel was still a developing nation without the groundwork for any peaceful future. Even their fears of an Iranian invasion paled to the disunity they had with their immediate neighbour, the Palestinians, and suddenly Howard was rethinking the whole agreement."
ast_howard_of_arabia.1.a: "Our future is with Israel."
ast_howard_of_arabia.1.b: "We can't promise anything for now..."
dissuading_china.1.t: "Non-Confrontation Agreement"
dissuading_china.1.d: "Australia has approached us with an offer of a non-confrontation agreement in exchange for pulling their recognition of Taiwan. This might not generally change much as they haven't agreed to cease trade with the nation, but their offer could be a genuine attempt to make overtures with us."
dissuading_china.1.a: "Sign the agreement."
dissuading_china.1.b: "We can't agree to that."
dissuading_china.2.t: "China Signs the Agreement"
dissuading_china.2.d: "Beijing seems to have responded positively to our shifted diplomatic stance, and the country has agreed to our non-confrontation proposal."
dissuading_china.2.a: "Excellent."
dissuading_china.3.t: "All Quiet on the Eastern Front"
dissuading_china.3.d: "Unfortunately, China has quietly refused our overtures and has not agreed to anything for the time being."
dissuading_china.3.a: "Certainly not ideal."
indonesian_ultimatum.1.t: "The Australian Ultimatum"
indonesian_ultimatum.1.d: "Australia has out right demanded that we hand over the province of Aceh to their peacekeepers, effectively allowing one of our territories to be occupied by their forces. They have claimed that this would lead to an eventual independance for the region, free from insurgents, but we have no way of guaranteeing that, and it would still be loss of our own soil. If we refuse they have threatened us with sanctions."
indonesian_ultimatum.1.a: "We have no choice."
indonesian_ultimatum.1.b: "This is outrageous!"
indonesian_ultimatum.2.t: "Indonesia Complies"
indonesian_ultimatum.2.d: "Jakarta has agreed to the terms presented to them and has relinquished the territory of Aceh. Our peacekeepers will ship out soon and restore order to the province. The Indonesian people will soon be free from insurgency."
indonesian_ultimatum.2.a: "Peace has triumphed!"
indonesian_ultimatum.3.t: "Indonesian Refuses the Ultimatum."
indonesian_ultimatum.3.d: "Jakarta has rejected our terms and refuses to allow our peacekeepers into Aceh. They have stubbornly vowed to remove the insurgency on their own."
indonesian_ultimatum.3.a: "So be it."
indonesian_ultimatum.4.t: "The Australian Ultimatum"
indonesian_ultimatum.4.d: "Australia has out right demanded that we hand over the province of Aceh to their peacekeepers, effectively allowing one of our territories to be occupied by their forces. They have claimed that this would lead to an eventual independance for the region, free from insurgents, but we have no way of guaranteeing that, and it would still be loss of our own soil. If we refuse they have threatened us with sanctions."
indonesian_ultimatum.4.a: "We have no choice."
indonesian_ultimatum.4.b: "This is outrageous!"
us_aus_trade_howrd.1.t: "Trade Discussions with Australia"
us_aus_trade_howrd.1.d: "The government in Canberra has reached out with an offer for priority mineral rights trade in exchange for us lowering tariffs on high-value machinery exports to them. The icome loss from the tariffs would be negligible, and mineral rights would more than make up for it."
us_aus_trade_howrd.1.a: "These are favorable terms."
us_aus_trade_howrd.1.b: "No thanks."
us_aus_trade_howrd.2.t: "The United States Agrees to the Trade Pact"
us_aus_trade_howrd.2.d: "Without any disagreement the Americans have agreed to lower their tariffs on high-value machinery exports in exchange for us offering mineral rights."
us_aus_trade_howrd.2.a: "Cheers to the friendship!"
us_aus_trade_howrd.3.t: "Trade Talks Go Cold with the US"
us_aus_trade_howrd.3.d: "It seems any headway with the trade talks has turned up empty handed. The Americans aren't budging with the change to tariffs, and we've been left a bit out in the cold."
us_aus_trade_howrd.3.a: "An unexpected downturn."
trip_to_malaysia_ast.1.t: "A Visit From Malaysia"
trip_to_malaysia_ast.1.d: "The Malaysian Minister for Trade and Industry, Rafidah Aziz, has approached us with an addendum to our current treaty for meat exports. The new deal offers contracts on the exports in exchange for us relaxing a few taxes and regulations on them. It's a solid offer, although the requirements may present a loophole they could take advantage of down the line. It still offers us a favorable price for our goods."
trip_to_malaysia_ast.1.a: "For our friends, of course!"
trip_to_malaysia_ast.1.b: "Not today."
internal_talk_liberal.1.t: "A Spat Between Colleagues"
internal_talk_liberal.1.d: "Howard felt like Peter Costello, his well-serving deputy of the party since the first election, always had a bone to pick with him. They seemed to clash at every opportunity, but that hadn't stopped them working together for the better, and Peter was partially responsible for the ongoing economic positivity. Now they were arguing over migration. Peter was very staunch on the economic benefits, but Howard, worried about the 'wishy-washyness' of multiculturalism, stayed firm on integration. \n \nStrengthening border patrol also had the benefit of decreasing human smuggling, which had become a topical issue in the news. Peter instead claimed that the idea was prone to backfiring, and would simply end up being a waste of the budget. There was no agreement in sight between them."
internal_talk_liberal.1.a: "And yet a decision had to be made."
internal_talk_liberal.2.t: "A Visit From Tony"
internal_talk_liberal.2.d: "Howard was busy filing the paperwork for the party rule change when a knock at the door came. He knew he had about a 2 hour window before the next meeting, so it was a surprise when the Health Minister, Tony Abbott, walked in. The man who had done a fine job managing the department and dealing with the odd union thug, presented Howard with further modifications to medicare. A few in the party were partial to labelling Abbott a party zealot, but Howard didn't see it that way. To him Abbott appeared dedicated to the people. A nationalist by all definitions. \n \nWithout a doubt he had ambition to become Prime Minister, but it never stopped him showing loyalty to Howard, and there had grown a mutual respect between them. When he left the room Howard returned to writing, and a thought lingered on. Perhaps, after these past years in office, he could consider Tony a good friend."
internal_talk_liberal.2.a: "Back to it then."
internal_talk_liberal.3.t: "Picking the Successor"
internal_talk_liberal.3.d: "When it came to choosing the next party leader, Howard was at a fork. It seemed more than often that his nemesis in parliament was his own deputy, Peter Costello. They'd come to blows more often than he had with the other parties. Peter was always gunning for the job, and it didn't hurt he had good standing with the rest of the party. His vision for an economically independent Australia was indeed intriguing, and with him in charge he'd be assured the party would continue on smoothly. \n \nThere was, however, another. Tony Abbott was in many ways a protégé to Howard, although he'd been adamant on Howard serving another term. Even though Abbott was seen as a bit of an acolyte in the party, and considered a tad washed up, John saw a conviction in the man that almost reminded him of himself. Abbott envisioned not just an independent Australia, but a stronger one too. Going into the next election, the decision would make or break the party."
internal_talk_liberal.3.a: "Peter is the natural successor."
internal_talk_liberal.3.b: "Tony has what it takes."
internal_talk_liberal.3.c: "On second thought..."
internal_talk_liberal.4.t: "Howard Resigns as Leader"
internal_talk_liberal.4.d: "\"It has been an immense privilege every day of my life to have been [GetASTLeaderTitle] of this beautiful country and I want to thank the Australian people for the privilege. I respect it and I honour it. After years of pursuit, leading this nation has been the most unbelievable experience of a lifetime.\" \n \n\"I accept full responsibility for the Liberal Party, the successes and the few losses we've had, and therefore I am stepping down as leader of the party. I do want to thank the people of Bennelong, and the people of Australia for electing me to represent this nation.\" \n \n\"As I hand the reins to my own deputy and treasurer Peter Costello I owe a very special debt of gratitude. He's been a wonderful steward of the Australian economy and the future of our party is very much tied up with Peter. He is very much our future.\" \n \n\"I wish the nation well, I believe very profoundly that Australia's best years lie ahead of her.\""
internal_talk_liberal.4.a: "Onto new horizons..."
internal_talk_liberal.5.d: "\"It has been an immense privilege every day of my life over these last years to have been [GetASTLeaderTitle] of this beautiful country and I want to thank the Australian people for the privilege. I respect it and I honour it. After years of pursuit, leading this nation has been the most unbelievable experience of a lifetime.\" \n \n\"I accept full responsibility for the Liberal Party, the successes and the few losses we've had, and therefore I am stepping down as leader of the party. I do want to thank the people of Bennelong, and the people of Australia for electing me to represent this nation.\" \n \n\"As I hand the reins to the next leader, my own Minister for Health and proud colleague Tony Abbot, I owe a very special debt of gratitude. He's been a wonderful representative for many Australians, and the future of our party is very much tied up with Tony. He is very much our future.\" \n \n\"I wish the nation well, I believe very profoundly that Australia's best years lie ahead of her.\""
solomon_islands_intervention.5.t: "Cleaning Up"
solomon_islands_intervention.5.d: "The locals walked over to the pile and dumped another load of weapons onto it. Mostly rifles. Another militia had surrendered to the 3rd Australian army that day and were being led away by the officers. Tomorrow the engineer regiment would come to destroy them in front of a crowd. They'd do it at one of the still functional stadiums as a public display that order was being restored. Whether that order came from home or not the ADF soldier didn't know, but he continued to watch them pile up. \n \nDozens at a time, they clanked together and the pile grew. He and the rest of the company had hunted the group these had come from for about a month, and they were the first to surrender on sight. It was beginning to look like things were coming to an end, sooner than he'd expected. The fighting was calming down, but few lights worked even in the nearby town, and anyone sick was being flown off the island. If the locals were going to stay, more needed to be done once the shooting stopped. \n \nThe radio on his shoulder sparked to life and he was off, moving on to the next town."
solomon_islands_intervention.5.a: "Back to work."
a_global_financial_crisis.2.t: "Financial Shakeup"
a_global_financial_crisis.2.d: "A number of middle-sized businesses, backed by loans, have fallen under in the last recent weeks and declared bankruptcy. The blow to our unemployment figures are one negative aspect, but the quietness of it has been a bit concerning. The air of economic downturn is beginning to upset our fiscal experts, who are requesting we be prepared to take immediate action if anything pops up. Except nothing has for now, which leaves us in the awkward position of waiting."
a_global_financial_crisis.2.a: "Let's not get worried over nothing."
black_saturday_ast.1.t: "Black Saturday"
black_saturday_ast.1.d: "Over the course of a few days a number of fires have grown into hundreds across Victoria in what has been called the worst day of bushfires on record. Thousands of firefighters across the nation have gathered in a desperate bid to contain the fires, which have already taken the lives of 25 individuals. \n \nDays of hot, dry air from Central Australia has created the perfect conditions for the fires to spread incredibly fast. Swaths of homes and land have already been destroyed, initiating a state of emergency as service members rush to evacuate at-risk areas. Although little can be done as it sweeps through state forests and national parks, with flames recorded to be reaching 30 metres in height."
black_saturday_ast.1.a: "This just isn't our year."
black_saturday_ast.2.t: "The Victoria Fires Continue to Blaze"
black_saturday_ast.2.d: "Skies over Victoria have remained black for weeks now as the fires haven't let up, raising the death toll to 173. Control lines have been successful in slowing the spread, although an estimated 400,000 hectares have been burned, decimating local wildlife. \n \nThe [GetASTLeaderTitle] has been in and out of the area visiting those affected, who appeared visibly upset upon seeing the damage, was present to provide some comfort to those now without homes. A number which is likely now in the thousands. Exhausted firefighters continue their efforts, with favorable weather expected to arrive in the coming week. \n \nThe darkest days for Victoria in decades may slowly be coming to an end, although not without an overwhelming loss for the country."
black_saturday_ast.2.a: "A tragedy beyond words."
ast_elections_howard_placeholders.1.t: "Surprise Win for the Howard Government"
ast_elections_howard_placeholders.1.d: "Rising fuel prices and the strong reactions to a number of John Howard's policies were not enough to stop the leader from winning a third term. Coming out of the race with 82 seats in the House of Representatives, the Liberal Party has experienced possibly the swiftest turnaround of political fortune in the country's history. \n \nMeanwhile the Kim Beazley led government has suffered its lowest primary vote since 1934, with some sources inside of the Labor Party claiming that the opposition leader is expected to step down. Howard thanked his supporters, particularly small businesses, for his election win as he gave his victory speech at the Wentworth Hotel in Sydney, and outlined his plans for further reform."
ast_elections_howard_placeholders.1.a: "It's that easy!"
ast_elections_howard_placeholders.2.t: "The Howard Government Bags Another Term"
ast_elections_howard_placeholders.2.d: "While Mark Latham struggled to make ground as the new Labor leader, [AST.GetLeader] has soared, winning another term for the Coalition and securing a majority. The Liberals enjoyed a comfortable increase in polls after the the Bali Bombings tragedy, signaling a preference for cautious and steady governance. \n \nThe success of the Nationals rural water management policies, brought in to combat the Millennium Drought, has no doubt also contributed to the Coalition victory. This win marking the second longest serving streak for the party. \n \nThe ALP did make some gains, winning back a seat from the Greens and a few from the Nationals. Although this is likely to result in another shakeup for the party."
ast_elections_howard_placeholders.2.a: "Three more years!"
election_outcomes_ast.1.t: "Historic Win for Rudd's Labor"
election_outcomes_ast.1.d: "Liberal leader [AST.GetLeader] was ousted last night as Kevin Rudd led Labor to a landslide victory, obtaining a swing of 5.7% across the nation. For the first time in Australian history the Labor Party now holds government in every state and territory. Deputy leader Julia Gillard's ascension also marks the first time a woman will hold the second highest public office in the land. \n \nThe coalition leader has already stepped down, making a call to Rudd during the night to congratulate him on the win. The new [GetASTLeaderTitle] has campaigned on improving industrial relations, Indigenous rights and swift action on climate change, aiming to take the country in a new direction, which he remarked on during his victory speech: \"Today, the choice was handed to the people, and Australia has looked to the future.\""
election_outcomes_ast.1.a: "And the future is now."
election_outcomes_ast.2.t: "An Upset Victory for the Coalition"
election_outcomes_ast.2.d: "Predictions for a Labor win have been crushed as the Coalition roars ahead for another consecutive term. [GetASTLeaderTitle] [AST.GetLeader] remarked on the results as a victory for the silent majority, and outlined plans for further economic investments during his speech. Although the coalition will continue in government, the ALP made significant gains across the nation in almost every state and territory, leaving the current government with a slim majority. \n \nKevin Rudd has reportedly called the [GetASTLeaderTitle] to congratulate them on the win, and is expected to address the loss later in the night. The Coalition now leads with the responsibility of guiding the country, whilst keeping the public's renewed faith in the party going."
election_outcomes_ast.2.a: "Steady she goes!"
a_global_financial_crisis.3.t: "Effects of the Crisis Subside"
a_global_financial_crisis.3.d: "The lingering effects of the Financial Crisis have all but subsided in the recent weeks. The economy has mostly normalized to previous levels, and public sentiment has risen in support of our efforts. It seems our response to the crisis has ultimately paid off, and has even made our economy more resilient to such economic downpours in the future."
a_global_financial_crisis.3.a: "We're back in business."
turnbull_letter_ast.1.t: "The Turnbull Letter"
turnbull_letter_ast.1.d: "The current leader of the Liberal Party, Malcolm Turnbull, has come out against our government claiming to possess an email proving our corruption. What exactly the letter contains we can only speculate, but it seems to be bad enough to convince the media to run with it. Our own people are claiming that Turnbull's source came from within the government, meaning we may have a mole within the party. \n \nMalcolm Turnbull is expected to reveal the letter to parliament in the coming weeks. For now we can only cross our fingers and hope the damage isn't too bad."
turnbull_letter_ast.1.a: "What did we do?"
turnbull_letter_ast.2.t: "A Phony Letter"
turnbull_letter_ast.2.d: "It turns out that Malcolm Turnbull's notorious email was nothing but a fake. During the national audit into the claim, Turnbull's source own admitted that he made the whole thing up. The party mole, Godwin Grech, was feeding bogus information to Turnbull for clout. The resulting backlash has practically sunk Turnbull's approval ratings, and reduced the Liberal party to a quarreling mess. Meanwhile our opinion polls are back up, and Grech has been promptly booted from the party."
turnbull_letter_ast.2.a: "We never believed it for a second!"
oceanic_viking_ast.1.t: "Oceanic Viking Dilemma"
oceanic_viking_ast.1.d: "It seems that one of our maritime vessels currently being utilised for border protection efforts has apprehended 78 Sri Lankan asylum seekers attempting to enter Australia. Once they were on board the ship, as per our current policy, they were taken to the Indonesian island of Bintan for processing, only now they're refusing to disembark as some kind of protest. \n \nThis marks the 49th vessel interdiction just this year, and as per usual the media is swarming over it. So far the staff on board the Oceanic Viking have been unsuccessful removing them, and the longer it sits there the worse it looks for us. The opposition are already using it to paint us as weak against illegal migration, and it seems a few of the asylum seekers on board are in need of medical attention. \n \nWe can either negotiate, or force them out."
oceanic_viking_ast.1.a: "Grant them preferential processing."
oceanic_viking_ast.1.b: "Send in the troops."
oceanic_viking_ast.2.t: "Anti-Immigration Protests Rampant"
oceanic_viking_ast.2.d: "Protests have erupted in most of our major cities over the outcome of the Oceanic Viking drama, mostly spurred on by right-wing political members. The One Nation party in particular has been very vocally critical of the move, even more aggressively than the opposition, and despite its small size has attracted noticeable attention online. \n \nTheir ex party leader, Pauline Hanson, who has built her career on controversial rhetoric, also flamed our government during a rally in Queensland, labelling our government \"anti-Australian.\" In response counter protests have also ignited, although smaller in scale, resulting in a number of clashes."
oceanic_viking_ast.2.a: "Why can't everyone calm down?"
oceanic_viking_ast.3.t: "Operational Mishap"
oceanic_viking_ast.3.d: "As per our directions the SAS was assembled to remove the asylum seekers from the vessel with force. It seems that, leading up to the event, our operational knowledge was limited. When our unit did board the ship they discovered that one of the Sri Lankan migrants had armed themselves with a pistol, and a firefight broke out between them. Thankfully only one of our men was injured, but 4 of the migrants onboard were killed, and two injured. The rest were successfully removed and transported to Bintan detention centre. \n \nA United Nations session has been called in response, and expectedly the blowback is pretty severe. Protests have broken out in most of our major cities, which have also prompted their own counter protests. If it's any upside the opposition is staying relatively quiet."
oceanic_viking_ast.3.a: "How could this happen?"
aus_cylcone.1.t: "Cylcone Ului Hits Queensland"
aus_cylcone.1.d: "One of the more severe cyclones we've seen has made landfall in Queensland, causing state-wide infrastructural damage and leaving over 60,000 homes without power for days. The cyclone passed over the Solomon Islands and maintained a category 3 before dissipating. Given the advanced warnings, most were evacuated from the areas in advance, however, one death has been reported. \n \nNational Emergency services and the ADF have since been deployed to repair the damage and bring the power back online."
aus_cylcone.1.a: "A tragedy nonetheless."
great_barrier_reef.1.t: "Oil Spill in the Great Barrier Reef"
great_barrier_reef.1.d: "A Chinese bulk coal carrier has run aground east of Rockhampton in Central Queensland. The ship was more than 10 km outside the shipping lane when it struck the reef, scraping along it for a considerable distance before it stopped, and leaking over 2 nautical miles of heavy fuel oil. \n \nSo far tugboats have been sent to remove the ship, although there are fears the ship might break apart in the rough seas. UNESCO and our Reef managers are up in arms that the ship was so far off course, and that the area around it may now be contaminated. We're working with them to minimize the damage, but it's a slow process."
great_barrier_reef.1.a: "Very unfortunate."
ast_elections.3.t: "Election Day"
ast_elections.3.d: "Stalls are being packed up, the ads are winding down, and party headquarters are on high alert. The campaign season has ended and the voting booths have been set up in anticipation of election day. Australians from all across the nation will be gathering shortly to vote for the future of Parliament House, and now the decision for our next leader is in their hands."
ast_elections.3.a: "May the best candidate win."
dissolution_election_rudd.3.t: "Rudd Wins Big"
dissolution_election_rudd.3.d: "Members at the Labor headquarters are celebrating the win for Kevin Rudd as it marks the first consecutive win for the party since 1993, and has confirmed the hopes for many of the [GetASTLeaderTitle]'s supporters. Labor is BACK. \n \nAfter months of campaigning on continuing reforms, the results have affirmed Rudd's mandate. Landing Labor with a majority government, expected to be formed in the coming weeks thanks to a slew of new members. Almost the entire state of Queensland has turned a shade of red. \n \nThe election results also provided the Greens with two more seats, indicating a growing public support for climate action."
dissolution_election_rudd.3.a: "Back to business."
dissolution_election_rudd.4.t: "Tony Abbott Sails to Victory"
dissolution_election_rudd.4.d: "The crowd chanted \"Tony, Tony, Tony\" inside the packed hall of the Four Seasons Hotel as the Liberal party clawed victory in one of the tightest elections in the nations history. The conservative leader, who rode the campaign on a trail of fiery rhetoric amid promises to \"Stop the Boats\", announced he was \"humbled\" to take the wheel of government. \"From today I declare that Australia is under new management and Australia is once more open for business.\" \n \nThe climate-critical Abbot garnered attention during the campaign with a strong opposition to the direction of public opinion, and yet voters have spoken. Strong stances on immigration and fiscal conservatism are expected to follow as Labor packs their bags, and the Liberals set up shop once again."
dissolution_election_rudd.4.a: "The Liberals are back!"
ast_elections.1.t: "The Election Blitz"
ast_elections.1.d: "The election season has approached and the time for campaigning has begun. As per election law, we only have 8 weeks to get our message across. Whether we do it through saturating the media, travelling the country or debating the opposition, the clock is ticking. We need to get out there and get busy if we expect to win."
ast_elections.1.a: "Steady with the Liberals!"
ast_elections.1.b: "A fair go with Labor!"
ast_elections.1.c: "Australia first with One Nation!"
ast_elections.1.e: "Fight for change with the Greens!"
special_gillard_election.1.t: "Calling the New Election"
special_gillard_election.1.d: "The only way we're sealing the legitimacy of our new government is with a new general election. If we can rally their votes and secure the next term, it'll set the mandate we need to continue on leading, and potentially lessen the blowback we might receive from the opposition while passing law. There's still risk involved with any election, so we'll have to get busy over the next 60 days."
special_gillard_election.1.a: "Onwards and upwards."
election_outcomes_ast.5.t: "Voting Results: A Hung Parliment!"
election_outcomes_ast.5.d: "In an election surprise that hasn't occurred since 1940, neither party has come out a clean winner. The Coalition and Labor obtained 72 seats during the count, leaving them 4 short of forming a government. This led to an awkward conclusion in the night as both candidates walked out on stage to declare that, despite the results being tallied, the election wasn't over. \n \nOver the next few days the parties will have to battle it out in the House of Representatives and negotiate with the remaining members to secure a government."
election_outcomes_ast.5.a: "A divided nation."
election_outcomes_ast.4.t: "Another Win for the Rudd Government"
election_outcomes_ast.4.d: "Crowds wandered the Sydney streets last night as the results for a Labor election win came in. After another term of strong policy, Kevin Rudd has once again won the goodwill of the public, gaining 48% of the vote and securing a number of Coalition held seats in Queensland, piercing the previous pro-mining strongholds around the Bowen Basin. \n\nRudd addressed the win at the Gabba cricket ground, along with his family, to celebrate the third win. \n\n\"My family have given their all in public life, and their all for my campaign. In the days ahead, Thérèse and I will be spending the next fews together, with the kids as well, and then it's back to it. The show isn't over yet.\""
election_outcomes_ast.4.a: "And the good times roll on."
election_outcomes_ast.6.t: "Gillard Secures Another Term"
election_outcomes_ast.6.d: "Australia's first female [GetASTLeaderTitle] has defied early polling, winning the support of the public once again, and garnering a minority government. Gillard thanked her supporters at the Melbourne Convention and Exhibition Centre, outlining her plans for fiscally responsible leadership and further reforms to healthcare. \n\nOppposition leader, Tony Abbott, called Gillard shortly after the results to congratulate her on the win. After another loss, Abbott is expected to step down from party leadership, indicating a change in party policy in light of the failure to shift the party to the right."
election_outcomes_ast.6.a: "A win for sensible policy."
new_governor_general_ast.1.t: "The New Governor General"
new_governor_general_ast.1.d: "For the first time in our nation's history a woman has been sworn in as the new governor general. Quentin Bryce, 65, a former lawyer and governor in the state of Queensland, is Australia's 25th governor-general, becoming the first female in the role in 107 years. \n\nAt a ceremony at Parliament House in Canberra, Bryce pledged an oath of allegiance to the Queen as a 21-gun salute was fired outside. \n\n\"I want you to know that I take on this role with solemnity, impartiality, energy and a profound love for the country we share,\" she said. \"I promise to be open, responsive and faithful to the contemporary thinking and working of Australian society.\""
new_governor_general_ast.1.a: "The times sure are changing."
indo_cattle_drama.1.t: "Indonesia Cattle Exports Dilemma"
indo_cattle_drama.1.d: "ABC recently broadcasted their Four Corners program exposing the systemic cruelty in the Indonesian cattle industry. The footage is quite graphic, and a large public outcry has demanded that we cease our cattle exports to Indonesia immediately. We can suspend live cattle exports until they agree to new regulatory frameworks, but the ban will financially cripple our farms up north."
indo_cattle_drama.1.a: "Suspend the exports."
indo_cattle_drama.1.b: "It's not worth it."
malaysia_solution_ast.1.t: "The Malaysian Solution"
malaysia_solution_ast.1.d: "Considering the decrepit state of our current immigration detention centres, Malaysia has reached out with an offer for us to unload 800 asylum seekers we have in our possession to them, in exchange for taking in 4,000 processed refugees. It would fix our immediate detention issues, and calm some of the public complaints, but Malaysia is not a signatory to the UN Refugee Convention, making the whole deal legally dubious."
malaysia_solution_ast.1.a: "We'll shake on that."
malaysia_solution_ast.1.b: "It's not legally sound."
malaysia_solution_ast.2.t: "High Court Blocks Malaysia Deal"
malaysia_solution_ast.2.d: "Unfortunately the High Court of Australia has ruled the exchange illegal under the Migration Act, and blocked the transfer. The immediate reaction was a slew of accusations from the opposition, and if anything the public reactions have only got worse now. We may need to consider looking into other methods to solve our immigration detention problem."
malaysia_solution_ast.2.a: "Not so easy."
embassy_tent_protests.1.t: "The Embassy Tent Protests"
embassy_tent_protests.1.d: "In celebration of the 40th anniversary of the Aboriginal Tent Embassy, a protest occupation supporting Indigenous rights outside of Parliament in 1972, an awards ceremony is being hosted near the site, at the Lobby Restaurant. It seems a group of protesters who had assembled at the site have migrated towards the restaurant. Something seems to have riled them up, as some are even beginning to bang on the windows. \n\nSince the [GetASTLeaderTitle] and opposition leader are present at the event, security has advised an immediate evacuation from the venue by a helicopter nearby. The crowd does look pretty rowdy, but perhaps opening a dialogue might calm things down."
embassy_tent_protests.1.a: "Get me out of here!"
embassy_tent_protests.1.b: "Let's talk to the crowd."
embassy_tent_protests.2.t: "The [GetASTLeaderTitle] Injured"
embassy_tent_protests.2.d: "A security nightmare unfolded as the guards with Gillard made a gap in the crowd, allowing her to exit and speak with them. Only a minute after they did an object thrown by one of the protestors hit the [GetASTLeaderTitle], knocking her to the ground and injuring her in the eye. Police and the guards descended on the crowd and evacuated Julia Gillard from the event, but after a trip to the hospital it seems the damage to her right eye is permanent. \n\nOpposition leader Tony Abbott spent a moment in the assembly commending the [GetASTLeaderTitle] on her bravery, and condemned the attack."
embassy_tent_protests.2.a: "Oh no..."
embassy_tent_protests.3.t: "Taming the Crowd"
embassy_tent_protests.3.d: "Once Rudd exited the pavilion thankfully nothing went wrong, as the crowd seemed to simmer down once he began mingling with them. It seemed that a comment made by Tony Abbott sparked the uproar, and since the opposition leader had been evacuated, tensions had cooled. \n\nThe [GetASTLeaderTitle] spent an hour with the crowd and journalists nearby before returning to the ceremony. Providing a nice bit of positive publicity."
embassy_tent_protests.3.a: "That's how it's done."
embassy_tent_protests.4.t: "Scrapping with the Protestors"
embassy_tent_protests.4.d: "After security made a gap in the crowd for Tony to exit the pavilion and speak with the protestors, one of them lunged at him, seemingly intoxicated, and in reaction the [GetASTLeaderTitle] threw a fist back. The protester hasn't sustained any major injuries, and it's evident that Abbott was defending himself, but journalists inside snapped up all the photos they needed and now it looks like the [GetASTLeaderTitle] is literally fighting with demonstrators."
muslim_protests_sydney.1.t: "Islamic Riots Erupt in Sydney"
muslim_protests_sydney.1.d: "In a series of mass demonstrations spanning from the Middle East to London, Muslims have marched in anger over the controversial release of the film \"Innocence of Muslims.\" Sydney has not been an exception as protests have spread to the CBD. Over 150 police officers have been called to the protests and 6 have been taken to hospital after they erupted into riots. \n\nSo far 8 individuals have been arrested, and after a tense clash outside of the American consulate, the crowds have begun to disperse."
muslim_protests_sydney.1.a: "This is no place for extremism."
murrawarri_republic_event.1.t: "Murrawarri Republic Declares Independence"
murrawarri_republic_event.1.d: "A letter has been received by our parliament announcing the independence of a state going by the name of the Murrawarri Republic. In the letter it stipulates that the \"Peoples Council of the Murrawarri\" has claimed territory straddling the border between New South Wales and Queensland as their new sovereign land, and have demanded recognition. \n\nFrankly it's the strangest thing any of our staff has ever seen, and they don't seem to have any legal basis to make the request, or for us to respond with."
murrawarri_republic_event.1.a: "The Murra-what?"
shark_attacks_ast.1.t: "Shark Attacks heighten Public Concern"
shark_attacks_ast.1.d: "Around 270 kilometres south of Perth, near Gracetown, a 35-year-old man was killed by a shark. 6 days later another surfer, 18-year-old Zac Young, died in a shark attack near Coffs Harbour. The sudden string of shark related deaths has prompted the Western Australian government to pledge a more aggressive approach to hunting sharks that enter popular swimming zones. \n\nDespite the risk of shark attacks decreasing in recent years, the WA government has spent more than $20m on aerial patrols and culling to bring down the shark population, a move questioned by marine biologists as an overreaction."
shark_attacks_ast.1.a: "We're friends, not food!"
election_outcomes_ast.3.t: "Labor Secures Another Term"
election_outcomes_ast.3.d: "Australians have gathered across the country to cast their vote, and decide the future direction of the nation. This time they've elected for [AST.GetLeader]'s governance to continue, granting the party another term. The [GetASTLeaderTitle] gave their election speech at the Barton headquarters, surrounded by a cheering crowd of Labor supporters, and outlined the continued plans for their next three years. Labor's \"incumbency curse\" has seemingly been lifted, and instead turned into a gift, swaying voters away from change in support of continued stability."
election_outcomes_ast.3.a: "Why stop a good thing?"
election_outcomes_ast.7.t: "Liberal Party Wins Reelection"
election_outcomes_ast.7.d: "As the election parties winded down and the counting came to a close, the incumbent [AST.GetLeader] is expected to decisively win reelection. The mandate for their government has continued to win over the majority of voters, and solidified their position in the House and Senate, with small gains across the nation. Business in Parliament is expected with convene as usual, with the new term beginning next month."
election_outcomes_ast.7.a: "The good times keep coming!"
election_outcomes_ast.9.t: "Malcolm Turnbull Ekes Out a Victory in the Votes"
election_outcomes_ast.9.d: "Liberal leader Malcolm Turnbull has claimed victory in the federal election, with the Coalition edging towards a slim majority in parliament. \n\n\"This is a great day today,\" Turnbull told the press before giving his speech for the night. \n\nAfter campaigning to introduce a government that embraces a more technocratic direction, the new [GetASTLeaderTitle] gave his acceptance speech with that direction in mind. \n\n\"We must be more competitive, we must be more productive and - we must be more innovative.\" \n\nThe Turnbull government is expected to tackle the growing energy demands of the nation, and address the ever expanding tech sectors, with, as he put it, \"a willingness to find a common ground with the people and with our industries. Progress is about helping everyone, -I know we can achieve something great if we put our greatest minds to it.\""
election_outcomes_ast.9.a: "Here's to a brighter direction!"
detention_centres_full.1.t: "Detention Centres Reaching Capacity"
detention_centres_full.1.d: "The centres in Papua and Nauru have begun to reach capacity, despite their initial scope and success, causing a bottleneck in our migrant processing operations. Although funding is already being directed to the centres to amend the current deficiencies, further improvements or options will need to be pursued if we're going to solve the problem long-term. This comes at a time when unauthorised arrivals have risen to their highest level in years."
detention_centres_full.1.a: "Does nothing last?"
migration_event_ast.1.t: "Unauthorised Immigration Hits New Record"
migration_event_ast.1.d: "The number of illegal migrants attempting to land on our shores has skyrocketed in the last few months. Whether fueled by the ongoing crises, or the envy of our prosperous nation, migrants are coming from far and wide, and many are skipping the queue. Our border patrol has reached an all-time high number of interceptions, and it's beginning to strain our operational capability."
migration_event_ast.1.a: "Troubling times."
aukus_formed_ast.1.t: "AUKUS Partnership In Action"
aukus_formed_ast.1.d: "The leaders of Australia, the United Kingdom and the United States met in Washington, D.C, at the Pentagon earlier today to discuss forming the trilateral alliance. Cyber capabilities, artificial intelligence and protecting supply chains were reportedly a part of the discussion, all with the aim of deepened diplomatic and defense cooperation between the three states. \n\n\"For more than 70 years, Australia, the United Kingdom, and the United States, have worked together... Today - we recommit ourselves to this vision.\" \n\nThe partnership will apparently work as an addition to the three nation's current alliances. [AST.GetLeader] has indicated that the first intention of AUKUS is strengthening defense proliferation."
aukus_formed_ast.1.a: "Two's company, three's a partnership."
pukpuk_treaty_event.1.t: "Historic PNG-Australia Treaty Signed into Force"
pukpuk_treaty_event.1.d: "The landmark 'Pukpuk Treaty' between Papua New Guinea and Australia has been finalised, and been heralded as an elevation of our nation's relations by the [GetASTLeaderTitle], remarking their joining \"as neighbours, as mates, and now as allies\". \n\nThe treaty, named after the local term for crocodile, will begin the process of integrating the PNG army into the Australian Defense Force, and allow up to 10,000 PNG nationals to serve. Both will also commit to supporting each other if either country comes under attack. A sizable boon to regional security projection and stability."
pukpuk_treaty_event.1.a: "To our partners and friends!"
ast_taiwan_recognition.1.t: "Australia Recognises the Republic of China"
ast_taiwan_recognition.1.d: "In a landmark reversal of bipartisan policy, [AST.GetLeader] has formally recognised Taiwan as a sovereign and independent state. Representing the first pivot the country has made away from a mainland China stance since Gough Whitlam's visit in 1971. As part of a \"momentum for peace\" in the Indo-Pacific region, the [GetASTLeaderTitle] remarked that the recognition comes as an \"acknowledgement of the reality,\" with a push for the concept of two Chinas. \n\nThe reactions from China have been swift and scathing. Chinese ministers have blasted Australia as a \"two-faced nation\" online, and the foreign ministry has immediately begun instituting a range of restrictions on trade between the countries, only a hair short of a full embargo."
ast_taiwan_recognition.1.a: "A friend indeed."
howard_rumblings_in_dark.1.t: "Rumblings in the Party"
howard_rumblings_in_dark.1.d: "There was always a level of belligerence in the Liberal Party, and with any controversy you'd often find it boiling to the surface. Howard knew the only difference between a workmate and a disgruntled colleague was good polling, and lately the polling was miserably down. Backdoor grumblings had clawed their way to the papers, but even without the tabloids the critiques could be heard. \n\nSome said that Howard was simply too old, others that he was \"out of touch.\" He knew that much to the contrary of the thought, he was very much in touch with the behind the scenes scheming. His own deputy, Peter Costello, was already making moves for the next leadership ballot. Grabbing deals and pulling votes, and if Howard couldn't pull things his way then he'd be out of the prime ministry, and Costello would be in. Such was the nature of party politics."
howard_rumblings_in_dark.1.a: "We must fix this."
howard_rumblings_in_dark.2.t: "Betrayals in the Cabinet"
howard_rumblings_in_dark.2.d: "It hadn't come out of the blue, but it was in the early hours of the morning that he got the news. Rather than let them drag him through the mud, and slinging it on through the leadership ballot, Howard was going to go on his terms. He'd brought the party back from the brink, and now they were kicking him out. \n\n\"It has been an immense privilege every day of my life over these last years to have been [GetASTLeaderTitle] of this beautiful country and I want to thank the Australian people for the privilege they have given me over that period of time. I respect it and I honour it. After years of pursuit, leading this nation has been the most unbelievable experience of a lifetime.\" \n\n\"I want to thank the Australian people for the privilege that they have given me, allowing me to serve. I accept full responsibility for the Liberal Party, the successes and the losses we've had. It's not easy to lose your place in the party. Yet, I owe more to them than the party owes me.\" \n\nHe finished up with a short wave, and then it was back to Bennelong. Back to greener pastures..."
howard_rumblings_in_dark.2.a: "Yet it still stung."
abbott_gov_event.1.t: "Abbott Government Unveils Male Dominated Cabinet"
abbott_gov_event.1.d: "The [GetASTLeaderTitle] elect, Tony Abbott, has revealed a cabinet heavy on experience, with 15 Howard Government veterans – but one light on female representation, with the deputy [GetASTLeaderTitle], Julie Bishop, the only woman in the 19-strong cabinet. \n\nAbbott exclaimed he was disappointed there weren't \"at least two\" women in the cabinet, but expected women to be promoted over time, with \"good and talented\" women in the outer ministry \"knocking on the door\" of cabinet coming from the outer ministry. Although out of the 11 members of the outer ministry, only four are women. \n\nThe imbalance has drawn numerous criticisms from the opposition parties, to which Abbott was quick to swipe away to address the \"bigger issues.\""
abbott_gov_event.1.a: "It is a meritocracy after all."
abbott_gov_event.2.t: "Australia Votes \"Yes\" For Indigenous Recognition"
abbott_gov_event.2.d: "Following a supporting nationwide vote of 74%, Aboriginal Australians and Torres Strait Islanders will become enshrined in the constitution as a part of the Abbott government's new approach to Indigenous recognition. At the Garma annual culture festival leading up to the referendum, Abbott remarked that \"Indigenous recognition won't be changing our constitution but completing it,\" describing the amendment as a moment of healing for many. \n\nSince the results Abbott has also reiterated his plan to spend a week in an indigenous community. \n\n\"The fact is if these places are home to the first Australians why shouldn't they be home to the [GetASTLeaderTitle] of our country?\""
abbott_gov_event.2.a: "Very true."
abbott_gov_event.3.t: "The Onion Incident"
abbott_gov_event.3.d: "Tony Abbott had descended to rural Tasmania, meeting with the local farmers as part of his agricultural project. Reporters gathered around the pavilion as Tony shook hands and gave a short speech alongside one of the farmers. \n\nIn front of him was a square basket bursting with produce, each as ripe and shining as the next. As the farmer was explaining the project to the reporters, Abbott's mind was on the onions. \n\nWould the journos believe he was really dedicated to the farmers if he didn't show it? How could they see that Australian produce was really the best in the world? \n\nAs he looked down at the onions, someone besides him began to heckle. \"You can take a bite out of it now if you're keen!\" \n\nHad they really said that, or was it Tony's own thoughts egging him on? Before he knew it an onion was in his hand. The cameras flashed, and a few jeers rang out, as he took a bite from the raw onion. The farmer turned and was in disbelief as Tony only paused to nod before taking in another bite. \"Very good\" was all he could muster, watching Tony continue to munch away."
abbott_gov_event.3.a: "Why did he do that?"
abbott_gov_event.4.t: "Going Walkabout"
abbott_gov_event.4.d: "Another mosquito found its way into the tent, in spite of the netting and the incessant spraying. It was too dark to spot the thing, so he tried his best to ignore it. He'd been spending the better half of a week on Arnhem Land with the local leaders, in remote Northern Territory, and the experience was so far very peaceful, aside from the constant chatter of the laptop beside his bed. \n\nThe next day was the usual ceremonies, and one-on-ones with the Gumatji clan leader. The leader was very eager to discuss the offer he'd received from Rio Tinto, with a proposal for a new bauxite mine nearby. They'd already drilled in the region before, but the new mine would be in sacred land, so the [GetASTLeaderTitle] had to sign off. \n\nThe clan leader was to receive 75 percent of the royalties, and Rio Tinto claimed the operation would give the Gumatji  \"successful careers in the mining industry.\" Doubtful, given that in all the years that Rio has mined on the Yolngu lands, the operation has produced only one qualified Aboriginal apprentice."
abbott_gov_event.4.a: "Approve the mine."
abbott_gov_event.4.b: "It's sacred land."
abbott_gov_event.5.t: "Slip-Ups in the Curriculum"
abbott_gov_event.5.d: "Tony Abbott stood at the podium in front of the same packed room that he campaigned in not too long ago. Behind him was a Liberal Party banner and the Australian flag, to which he insisted was strung up as well. He started with the usual pleasantries before digging into the lackings of the current education system. Tony was perhaps at his most comfortable when he was ripping into things. It's what made him such a good opposition leader, and now he was trying to sell his curriculum reform. \n\nNo doubt his rhetoric was winning them over, but as the speech went on something most unfortunate occurred. \n\n\"No one, however smart, however well-educated, however experienced... is the suppository of all wisdom.\" \n\nA few laughs rang out as Abbott slowly realised he had mistaken the word repository with the name of a medical rectal tool. He continued the speech without any further hitches, but by the next day that little mistake was all over the front pages."
abbott_gov_event.5.a: "They do sound similar..."
abbott_gov_event.6.t: "Results of the Commission"
abbott_gov_event.6.d: "The audit has delivered a sweeping review of our expenditures, and provided a fairly radical blueprint to bring down spending. Cuts to pensions, public healthcare, education and the dole are all included. If we go ahead with the full proposal the public outcry might be too much for us to recover from, but it'll certainly provide a massive boost to the budget. Otherwise we could water it down and deliver something more palatable to voters."
abbott_gov_event.6.a: "Water it down."
abbott_gov_event.6.b: "Go all the way."
malcolm_abbott_event.1.t: "Malcolm's Visit"
malcolm_abbott_event.1.d: "Our minister for communication, Malcolm Turnbull, has approached us in quiet regarding our policy direction, warning that any continued cost-cutting is going to have serious ramifications. Whether he means party reactions in particular or public perception is unclear, but Malcolm does have a flair for the theatrics before. This may just be another one of overreactions, and he has been vocally opposed to our fiscal restrictions before."
malcolm_abbott_event.1.a: "Publicly announce an end to the cost-cutting."
malcolm_abbott_event.1.b: "He's overreacting."
malcolm_abbott_event.2.t: "Abbott's \"Cruel Budget\" Sparks Protests Nationwide"
malcolm_abbott_event.2.d: "Thousands have attended rallies across Australia protesting the latest round of government cost cuts. Large 'Bust the Budget' protests were held in almost every major city, notably attended by the Australian Council of Trade Unions, who participated in the march. Treasurer Joe Hockey has attempted to defend the cuts, stating that the country has \"drifted to the 1970s class warfare lines\" and his budget was about equal opportunity, not equality of outcome. \n\nRegardless, the protestors have indicated they are planning to continue the march for the remainder of the month. The most recent of which was outside the lawns of Parliament House, featuring a larger-than-life puppet of the [GetASTLeaderTitle]."
malcolm_abbott_event.2.a: "I don't look like that!"
malcolm_abbott_event.3.t: "The Leadership Spill"
malcolm_abbott_event.3.d: "After the recent public backlash, during the most recent party meeting one of the members voted for a leadership \"spill,\" prompting a new vote for whether Tony should remain leader or not. Since no one has the gall to make the challenge, the only candidate other than Tony was an empty chair in the room. \n\nWhen the votes came through, the [GetASTLeaderTitle] came out on top with 61 votes, albeit a not-insignificant number of 39 votes went to the empty chair. It's apparent that the drop in party support is something to be worried about, and if we can't turn things around another vote could end much worse."
malcolm_abbott_event.3.a: "There's still time."

#foreign_events
abbott_jakarta_event.1.t: "Fighting the Good Fight"
abbott_jakarta_event.1.d: "In Abbott's mind, stopping by Jakarta was the right place to start. It slipped the minds of many Australians that Indonesia was a majority muslim nation with over 230 million people, only a short skip from the homeland. Ever since the Bali Bombings it seemed that every month news of another attack came through. He was never sure that the next wouldn't be closer to home, and so the thought was always on his mind. \n\nWhen Tony spoke with the president, [IND.GetLeader], he brought the topic up. Of course his goal there was to sell the idea of Australian peacekeeping operations in the country, something he'd been vying for a while now, and much to the dismay of the Indonesian government. \n\nBeforehand, soft power had been the go to strategy for decades, with education programs and other aid packages to keep the ethnic tensions, for which they were bountiful, at moderate levels. Though it was hardly a solution to the threat of fundamentalism. At best Tony left with a promise from their government to continue the current cooperations, and that the door would be open to future endeavors."
abbott_jakarta_event.1.a: "In short, a disappointing outcome."
o_canada_abbott.1.t: "Australia Offers Mining Cooperation"
o_canada_abbott.1.d: "The government in Canberra has approached us with an offer to exchange mining technical experts in an effort to bring our nations closer, and take advantage of the rich natural resources we both inherit. The deal is fairly straightforward and on the surface would benefit us both, even if the current Australian government hasn't been very close to ours."
o_canada_abbott.1.a: "We welcome our Commonwealth brothers."
o_canada_abbott.1.b: "No thanks."
o_canada_abbott.2.t: "A Few Gaffs In Ottawa"
o_canada_abbott.2.d: "Standing in the airwing of the Canadian War Museum in Ottawa, Tony addressed the crowd of reporters, many of which were Australian despite the location. It seemed he couldn't even leave the country without a cadre of journos chasing him down. [CAN.GetLeader] stood beside him as he spoke. While trying not to fall into the habit of stereotyping them, he couldn't help but mention they were indeed a friendly people. A little far left for his liking, however. \n\nTony's mind returned to closing his speech. He turned and shook their leader's hand before heading out, and while he did stumble a few times in the speech, at one time referring to the country as \"Canadia,\" things went off largely without a hitch. The Canadian government had agreed to a mining investment, and in exchange we were sending our own experts over there to assist with drilling."
o_canada_abbott.2.a: "It's that Commonwealth commonality."
abbott_china_trade.1.t: "Further Trade Cooperation From Australia"
abbott_china_trade.1.d: "The Australian leader, [AST.GetLeader], has been very eager to expand the current scope of our trade with their nation by progressing with a Free Trade Agreement. The deal would include up to 95% tariff free imports of our goods, and smoother resource exchange, along with stipulations allowing our private companies to invest in Australia more easily. On the surface this appears to be a win-win in every sense of the word."
abbott_china_trade.1.a: "A worthy endeavor"
abbott_china_trade.1.b: "Not in our best interests."
abbott_china_trade.2.t: "The [GetYear] Free Trade Agreement Signed"
abbott_china_trade.2.d: "China has agreed to our bilateral free trade agreement, greatly strengthening the flow of minerals and manufactured goods between us. Almost a decade of negotiations for a more expansive pact have finally been realised. Given the nation's position as our biggest source of export revenue, the effects should be felt immediately across the economy. With a just signed document and a handshake, the Pacific is suddenly a closer, more united place."
abbott_china_trade.2.a: "The magic of aligned interests."
abbott_china_trade.3.t: "China Denies Further Trade Collaboration"
abbott_china_trade.3.d: "Unfortunately China has refused our offers of further collaboration, and has closed the doors on us diplomatically for the time being. It seems we may need to look at other avenues to rely on in the future."
abbott_china_trade.3.a: "Not the worst outcome, but certainly not good."
abbott_navy_exercises_event.1.t: "The Fruits of the Exercises"
abbott_navy_exercises_event.1.d: "The exercises with our American friends have wrapped up and have yielded some useful results. Aside from our forces receiving some much needed practice, the exercises pointed out some deficiencies in our unit's tech. After sharing the data with our R&D divisions it seems we may be able to apply some of these findings with our research development."
abbott_navy_exercises_event.1.a: "This certainly is useful."
knights_and_dames_ast_event.1.t: "Mixed Reactions Over Prince Philip's Knighthood"
knights_and_dames_ast_event.1.d: "The [GetASTLeaderTitle]'s senior colleagues have vocally displayed a mix of bewilderment, anger and dismay over his decision to reinstate the tradition by awarding an Australian Knighthood to Prince Philip, a non-Australian. \n\nCabinet ministers have told the ABC the [GetASTLeaderTitle] did not consult any of the leadership group before announcing the award. A move which seems to have split parliament between republican supporters. \n\n\"I'm just really pleased that in his 90s, towards the end of a life of service and duty, we in this country are able to properly acknowledge what he's done for us.\" Tony Abbott said in his statement over the decision. Although the reaction from the United Kingdom has been a somewhat muted gratitude, the reactions at home are summing up to be anything but."
knights_and_dames_ast_event.1.a: "You can't please everyone."
abbott_japan_trade_deal.1.t: "Trade Renegotiations from Canberra"
abbott_japan_trade_deal.1.d: "The [GetASTLeaderTitle] of Australia, [AST.GetLeader], has contacted directly us to discuss renegotiating the trade commitments we currently have with their nation to further \"rectify\" some inadequacies. Whether they're inferring to some from our side or theirs is unclear, but some ironing out of the agreement could provide a smoother transit of goods between us. In particular agricultural imports."
abbott_japan_trade_deal.1.a: "It seems fair."
abbott_japan_trade_deal.1.b: "No thanks."
abbott_japan_trade_deal.2.t: "Negotiations with Japan Bare Historic Deal"
abbott_japan_trade_deal.2.d: "The renegotiations have struck economic gold, presenting us with a much fairer agreement. The tariffs Japan has on our beef will be practically removed, along with a slew of other agricultural products. The only produce they weren't willing to budge on was the rice, however. \n\nThey're also signing onto a priority resource contract. Meanwhile, as promised, we're slashing a number of tariffs on their electronics and vehicles. The boost this will deliver to our farming sector can't be understated. A serious win for us compared to the original deal."
abbott_japan_trade_deal.2.a: "Now that's a fair go."
abbott_saf_event.1.t: "Cape Town Woes"
abbott_saf_event.1.d.a: "Curiously, the nation of South Africa has three different capitals. A fact that Abbott struggled to comprehend. As to not slow things down, Johannesburg was picked for simplicity's sake, and when he arrived the stop was the newly constructed FNB Stadium. Evidently they were eager to show off their modernization efforts, although Tony couldn't doubt that he was in a developing country. \n\nThe elephant that he'd eventually have to address was the refugee problem. Thousands of predominantly white farmers, who were fleeing the ongoing ethnic clashes, had been protesting the inaction from the South African government. The officials, however, were insistent that they were doing everything they could, and that issue was being blown out of proportion. \n\nAll Abbott knew was that the number of refugees was growing, and they were demanding condemnation."
abbott_saf_event.1.d.b: "Curiously, the nation of South Africa has three different capitals. A fact that Abbott struggled to comprehend. As to not slow things down, Johannesburg was picked for simplicity's sake, and when he arrived the first stop was the Nelson Mandella memorial. There was a deep respect Abbott had for the man, even requesting that the flags in Australia be lowered to half mast for the day. \n\nAlthough the elephant that he'd eventually have to address was the refugee problem. Thousands of predominantly white farmers, who were fleeing the ongoing ethnic clashes, had been protesting the inaction from the South African government. The officials, however, were insistent that they were doing everything they could, and that issue was being blown out of proportion. \n\nAll Abbott knew was that the number of refugees was growing, and they were demanding condemnation."
abbott_saf_event.1.b: "Condemn the government and expedite refugee visas."
abbott_saf_event.1.a: "They have our support."
indonesian_intervention_abbott.2.t: "Jakarta Refuses Our Request"
indonesian_intervention_abbott.2.d: "Expectedly the Indonesian government has refused our request to allow peacekeeping operations in the country, and has shuttered our diplomats from further discussing the action. The response has left us with few options to enforce the demand other than direct action. In the meantime it seems all cooperation has frozen over."
indonesian_intervention_abbott.2.a: "They're forcing our hand."
indonesian_intervention_abbott.3.t: "Jakarta Approves Our Peacekeeping Efforts"
indonesian_intervention_abbott.3.d: "It seems hell has frozen over, or perhaps Jakarta has. The Indonesian government has approved our request for peacekeeping operations in the nation. This will do wonders for our anti-terorism, and with us able to directly intervene on threats, the chance of another attack in the future has been drastically reduced."
indonesian_intervention_abbott.3.a: "This is great news!"
oceanic_alliance_ast.1.t: "Talks Of An Oceanic Alliance"
oceanic_alliance_ast.1.d: "The government from Canberra has sent a delegation to discuss forming an official oceanic-based alliance, with the express intent of us joining. Joining would effectively mean combining our militaries for the purpose of maintaining defensive measures in the Pacific, and the Australians have insisted the pact would stave off the potential for conflict in the region for the foreseeable future if realised. We would certainly be giving up a certain level of autonomy, however, and perhaps unwillingly tie us to Australia's ever-changing foreign policy."
oceanic_alliance_ast.1.a: "A worthy endeavor."
oceanic_alliance_ast.1.b: "Our independence is more important."
oceanic_alliance_ast.2.t: "New Zealand Turns Down Alliance"
oceanic_alliance_ast.2.d: "It seems that the New Zealand government has not seen fit to formalise an alliance at this time, seeing their current defensive capabilities to be sufficient. It's a disappointing outcome to be sure of, but there may still be other avenues to explore."
oceanic_alliance_ast.2.a: "Suit themselves."
oceanic_alliance_ast.3.t: "Indonesia Turns Down Alliance"
oceanic_alliance_ast.3.d: "It seems that the Indonesian government has not seen fit to formalise an alliance at this time, seeing their current defensive capabilities to be sufficient. It's a disappointing outcome to be sure of, but there may still be other avenues to explore."
oceanic_alliance_ast.4.t: "Papua New Guinea Turns Down Alliance"
oceanic_alliance_ast.4.d: "It seems that the government in Port Moresby has not seen fit to formalise an alliance at this time, seeing their current defensive capabilities to be sufficient. It's a disappointing outcome to be sure of, but there may still be other avenues to explore."
oceanic_alliance_ast.5.t: "Vanuatu Turns Down Alliance"
oceanic_alliance_ast.5.d: "It seems that the Republic of Vanuatu has not seen fit to formalise an alliance at this time, seeing their current defensive capabilities to be sufficient. It's a disappointing outcome to be sure of, but there may still be other avenues to explore."
operation_sovereign_abbott.1.t: "Operation Sovereign Borders"
operation_sovereign_abbott.1.d: "Scott Morrison leaned towards Abbott and grabbed his hand, shaking it as the cameras flashed. Scott was a few inches taller than him, and his hand was trapped in Scott's grip for a few seconds longer than he felt comfortable with. In private Morrison had sold the bill as an unpopular but necessary step to combat the growing strain of illegal migration, and offered to be the front of it in case of any blowback. Abbott was experienced enough to know there was more at play. \n\nMorrison had gained notability for his behind the scenes work, acting as a party whip in all but title to keep everyone in line. Admittedly he was effective, and very quick to offer a solution to problems only he had the foresight to see. So far he'd done his dues. If he wanted to get some credit it was only fair, it was his policy after all. So Abbott agreed, and the launch had become one big publicity stunt for their government."
operation_sovereign_abbott.1.a: "Say cheese!"
japan_subs_abbott.1.t: "Deciding on the Purchase"
japan_subs_abbott.1.d: "The original plan was to purchase 6 Harushio-class submarines to replace our aging Collins-class fleet. However, considering the need for firepower over the waves, we could request a purchase of 3 heli-based light destroyers instead. \n\nThe subs would pad our fleet numbers nicely, and the models have been updated to the latest tech. On the other hand the Murasame-class destroyers might give us the edge in the air and in terms of raw firepower."
japan_subs_abbott.1.a: "Stick to the subs."
japan_subs_abbott.1.b: "Go with the destroyers."
japan_subs_abbott.2.t: "Ship Purchase Request From Australia"
japan_subs_abbott.2.d: "The Australians have reached out with an interesting proposition. They've offered to purchase six of our aging, Harushio-class submarines to pad their fleet for a sizable sum. This would strengthen our defense ties, and provide some additional funding for the replacement subs."
japan_subs_abbott.2.a: "Approve the deal."
japan_subs_abbott.2.b: "It's not in our best interest."
japan_subs_abbott.3.d: "The Australians have reached out with an interesting proposition. They've offered to purchase three of our aging, Murasame-class light destroyers to pad their fleet for a sizable sum. This would strengthen our defense ties, and provide some additional funding for the replacement ships."
japan_subs_abbott.4.t: "Japan Refuses Sale"
japan_subs_abbott.4.d: "Unexpectedly the Japanese government has refused our deal, prefering to keep their fleet to it's current size. At this rate they're going to be calling us the UNLUCKY country."
japan_subs_abbott.4.a: "This can't be..."
japan_subs_abbott.5.t: "Japan Approves the Sale"
japan_subs_abbott.5.d: "Japan has approved the sale request, and the ships will soon be transferred to our fleet. Providing us with some much needed additional firepower on the seas."
japan_subs_abbott.5.a: "Excellent news."
abbott_condemns_china.1.t: "Tony Abbott Denounces China's Expansion"
abbott_condemns_china.1.d: "The Australian [GetASTLeaderTitle]'s recent stance on China has worried Liberal Party veterans, and roused support from voters, taking a new stand against the country's artificial island-making. \n\nIn a press conference yesterday the leader rebuked China's recent moves as \"the greatest military expansion in peacetime history.\" Demanding an urgent strengthening of Australia's own forces to maintain deterrence. Emphasising positioning more ships and planes into East Asia to excise the country from critical supply chains. \n\nSince the announcement Chinese officials have condemned the stance, and described Tony Abbott as inducing \"anti-China hysteria.\" Regardless of the intent, tensions are looking to reach a high point between the two countries."
abbott_condemns_china.1.a: "Are those storm clouds?"
kuala_lumpur_abbott.1.t: "Trade Pact for Neutrality"
kuala_lumpur_abbott.1.d: "Mineral trade between us and Australia has risen to the point that the Australia government has contacted us to discuss enacting a free trade agreement between us. The specifics of the deal include us lowering coal, aluminium and other mineral tariffs, along with some on produce imports. In exchange Australia will decrease their tariffs on our crude oil, electronic and transport equipment exports. \n\nPart of the deal, however, has stipulated that we declare our neutrality in their current disagreements with China, which only amounts to us signing a non-aggression pact with them."
kuala_lumpur_abbott.1.a: "A fair agreement."
kuala_lumpur_abbott.1.b: "It's too much to ask."
kuala_lumpur_abbott.2.t: "Malaysia Signs the Pact"
kuala_lumpur_abbott.2.d: "Our friends in Malaysia have signed the trade agreement and has formally signed the pact to remain diplomatically neutral in our matters. Allowing the exchange of minerals and produce to flow smoothly between us. Another part of the Island Chain has been taken out of the picture."
kuala_lumpur_abbott.2.a: "Very good."
kuala_lumpur_abbott.3.t: "Malaysia Refused Neutrality Agreement"
kuala_lumpur_abbott.3.d: "Despite our best intentions, Malaysia has refused to make any promises, and has refused our trade agreement. A piece of the Island Chain regretably remains on the table."
kuala_lumpur_abbott.3.a: "Who knew diplomacy could be this hard."
jap_repar_abbott.1.t: "Australia Demands Reparations for the Second World War"
jap_repar_abbott.1.d: "Curiously, the Australian government has contacted us to arrange very belated payments for their expenses during WW2. The request has baffled most officials, who have seen our relations with the country largely positive in the decades since the war. Regardless, their government does seem serious, and has sent us a rather large price tag."
jap_repar_abbott.1.a: "Just pay it."
jap_repar_abbott.1.b: "This must be some kind of joke?"
jap_repar_abbott.2.t: "Japanese Agrees to Pay Reparations"
jap_repar_abbott.2.d: "It seems their government understands our woes, and has agreed to make a lump sum payment directly to us to cover the cost of the war. They aren't going halfway either. An official ceremony will be held with the Japanese delegation in Darwin Harbour, and a department will be formed to facilitate the transfer of the reparations. Despite the irregularity of the whole event, the media is taking it well, and the opposition parties are remaining largely muted."
jap_repar_abbott.2.a: "Now old wounds can heal."
jap_repar_abbott.3.t: "Japan Refuses Reparations"
jap_repar_abbott.3.d: "In a somewhat embarrassing turn the Japanese government has refused the request, and has gone on to lambast us on their national TV. Of course ours must be in cahoots, because all the major networks are making a mockery of the whole ordeal, only supplanted by the beat down we're receiving in the House and Senate. A few protests have even been spotted outside of Parliament waving signs depicting Abbott as a beggar, sitting outside of the Japanese embassy."
jap_repar_abbott.3.a: "There's no need to rub it in."
jap_alliance_abbott.1.t: "Mutual Alliance From Down Under"
jap_alliance_abbott.1.d: "Australia has offered a mutual security pact, the details of which would trigger a call to war if a conflict were to erupt between either of us and China. The pact is apparently aimed at deterring further clashes with China, in an effort to safeguard the Pacific."
jap_alliance_abbott.1.a: "In this we are aligned."
jap_alliance_abbott.1.b: "This goes too far."
jap_alliance_abbott.2.t: "The Yokohama Accord"
jap_alliance_abbott.2.d: "The government of Tokyo has signed the pact, creating a security alliance between us. If a conflict were to break out between us and China, Japan would be called in to join the fight. Another piece has been added to our side of the board."
jap_alliance_abbott.2.a: "An honorable alliance"
jap_alliance_abbott.3.t: "Japan Refuses Pact"
jap_alliance_abbott.3.d: "After an unusual silence from the Japanese delegates, the [GetASTLeaderTitle] received a facetime from his Japanese counterpart. It was a long and winded call, and only mumbled yelling could be heard outside of the PMS office, but after eventually divulging into a dance-off of sorts the negotiations have been called off."
jap_alliance_abbott.3.a: "Perhaps the worst outcome."
france_abbott_ast.1.t: "Island Leasing"
france_abbott_ast.1.d: "The Government in Australia has approached us with an offer to lease land on the islands of New Caledonia for military use, over a period of 5 years. They have assured us that the lease would ensure continued stability in the Pacific, as part of their recent peacekeeping endeavors, and have offered 39 billion for the land and basing rights."
france_abbott_ast.1.a: "A fair deal."
france_abbott_ast.1.b: "The islands are ours alone."
france_abbott_ast.2.t: "New Caledonian Lease"
france_abbott_ast.2.d: "France has happily approved the lease, giving us the de facto right to expand our military presence and infrastructure on the surrounding islands for the next 5 years."
france_abbott_ast.2.a: "Our reach grows."
france_abbott_ast.3.t: "Island Lease Falls Through"
france_abbott_ast.3.d: "France has refused our offer to lease the islands at this time, and has effectively left us out in the cold strategically. We'll need to find another way to secure our eastern flank."
france_abbott_ast.3.a: "It was a great deal!"
france_abbott_ast.4.t: "Island Lease Approaches Its End"
france_abbott_ast.4.d: "The lease period Australia has on the New Caledonian islands for military positioning is approaching its end. We can offer them an extension for another 5 years, or we can request they return the islands."
france_abbott_ast.4.a: "Let them extend the lease."
france_abbott_ast.4.b: "It's time they returned to the fold."
france_abbott_ast.5.t: "France Offers Extension"
france_abbott_ast.5.d: "As the end of our lease on the New Caledonian islands approaches, France has reached out to offer us an extension for another 5 years."
france_abbott_ast.5.a: "A reasonable offer."
france_abbott_ast.5.b: "They can have them back."
france_abbott_ast.6.t: "Island Lease Ends"
france_abbott_ast.6.d: "As the end of the our lease on the New Caledonian islands approaches, France has requested we return the islands and remove our troops currently stationed there."
france_abbott_ast.6.a: "A reasonable request."
france_abbott_ast.6.b: "They're OURS now."
france_abbott_ast.7.t: "New Caledonian Islands Returned"
france_abbott_ast.7.d: "Australia has promptly returned the leased islands and thanked us customarily for their use."
france_abbott_ast.7.a: "A fruitful transaction."
france_abbott_ast.8.t: "Australia Refuses to Relinquish Islands"
france_abbott_ast.8.d: "In what can only be described as unwieldy arrogance, the Australian government has refused to relinquish the islands. They've even refused to pay for a lease extention, effectively illegally occupying the islands. While a diplomatic dispute bordering on military intervention would be out of the question, we will have to protest the occupation on the global stage."
france_abbott_ast.8.a: "This is outrageous!"
middlepower_abbott.1.t: "Australia Seeks Alliance"
middlepower_abbott.1.d: "An offer of mutual security has come our way from Australia, the details of which would trigger a call to war if a conflict were to erupt between either of us and China. The core of the proposal is an attempt to isolate China, and contain its sphere of influence in the Pacific.  \n\nThe agreement does not, however, include North Korea, and could put a target on us given our proximity to China. Despite this, Australia has assured us that the pact has been created only as a deterrent."
middlepower_abbott.1.a: "A worthy pursuit."
middlepower_abbott.1.b: "It's not enough."
middlepower_abbott.2.t: "Alliance Complications"
middlepower_abbott.2.d: "South Korea is pushing for more defensive assurances in regards to the treaty, given their close proximity to China-aligned North Korea. We can ease them in with some troop training programs and production support, but it would certainly be costly. Our choice depends on how highly we value Korea's backing."
middlepower_abbott.2.a: "A moderate treaty to bring them in."
middlepower_abbott.2.b: "Anything and everything."
middlepower_abbott.2.c: "It's too costly."
middlepower_abbott.3.t: "Australia Counteroffers with Defense Assistance"
middlepower_abbott.3.d: "In a bid to salvage the treaty, the Australians have counteroffered with a program for cooperative troop training, and their experts to assist with our weapons production. It's a sizable offer no doubt. They're clearly hoping we accept."
middlepower_abbott.3.a: "We welcome their support."
middlepower_abbott.3.b: "It's still not worth it."
middlepower_abbott.4.t: "Australia Counteroffers with Substantial Assistance"
middlepower_abbott.4.d: "In a bid to salvage the treaty, the Australians have counteroffered with a very sizable offer. An extensive program for cooperative troop training, and weapons production support, including plant assembly contracts, acquisition loans, and technical experts to assist the implementation. They're clearly going all out in the hope that we accept."
middlepower_abbott.4.a: "We welcome their support."
middlepower_abbott.4.b: "It's still not worth it."
middlepower_abbott.5.t: "KAMAT Signed into Force"
middlepower_abbott.5.d: "In the embassy in Seoul, ours and South Korea's diplomats signed the Korea-Australian Mutual Assurance Treaty, guaranteeing that both of our nations would support each other in the event of a war that threatens the security of that country. Now we are more aligned than ever, and another country has come to our support in the battle for the Pacific."
middlepower_abbott.5.a: "Welcome aboard."
middlepower_abbott.6.t: "Negotiations Hit a Wall"
middlepower_abbott.6.d: "Discussions between us and the Koreans have seemingly fallen through. Despite getting off on good terms they've pulled out over their own security concerns. Our work to cage the dragon will have to go on without them."
middlepower_abbott.6.a: "The Korean tiger sleeps."
abbott_china_occupation.1.t: "The Strategy of Denial"
abbott_china_occupation.1.d: "In the dark room Tony Abbott and the rest of the war cabinet watched the glowing screen cut between aerial shots, satellite imagery and surveillance footage of troop transports. It was night time and the footage was choppy, but the emblem of the People's Liberation Army was clear as anything. The enemy had made landfall. \n\nAbbott's heart sank. He leaned back in his chair and ran his palms across his forehead. The rest of the room was quiet, only broken when the analyst paused the footage and began the briefing. Their first priority was controlling the narrative, but no doubt the video was already being shared online, and this was looking to be the worst national defense blunder in the nation's history. From here on the fight would be an uphill one. \n\nThere was an awkward quiet as the analyst stopped and waited for the PM's input. Abbott's face, contorted in thought, was a mix of sternness and vacancy. Finally he turned to the rest of the room. \"Look, at this point it's pretty obvious that uh, well, shit happens.\""
abbott_china_occupation.1.a: "In this case, it does."
abbott_shirtfronting_china.1.t: "Flashpoint at Sea"
abbott_shirtfronting_china.1.d: "Sporadic reports are pouring in from our fleet in the South China Sea. While most of the accounts are patchy, and the situation is still unclear, there appears to have been a confrontation at the Shoal. \n\nAfter our ships were deployed to patrol the Scarborough Shoal they were confronted by a nearby Chinese fleet. That fleet demanded that our ships leave the area and, shortly after our ships refused to do so, one of the Chinese ships opened fire. There was a momentary exchange between them before ours retreated. Two of our frigates were lost, with four casualties so far. \n\nSince we're finding this out as it's happening there hasn't been a response from China. The ball is in our court on how to proceed. Right now we're on a knife's edge."
abbott_shirtfronting_china.1.a: "Get a line through to Beijing."
abbott_shirtfronting_china.1.b: "This is a blatant attack. We can't show weakness."
abbott_shirtfronting_china.2.d: "A direct line has come through from the Australian [GetASTLeaderTitle] to discuss the matter unfolding in the South China Sea. While our reports are still coming through, it's apparent that a skirmish occurred between our fleet stationed there and an Australian patrol, occurring near the Scarborough Shoal. \n\nAccording to the report, one of our destroyers fired a warning shot over the Australian ships, which prompted the exchange. There's been three casualties so far, and the fleet has received minor damage. The Australians, however, appear to have lost two ships and may have lost five of their own. \n\nThey're leader is now demanding that we withdraw our ships from the area, and commit to deescalation talks. The audacity is certainly irritating, but the situation could turn into a nightmare on the world stage if we don't give concessions."
abbott_shirtfronting_china.2.a: "Anything to prevent a war."
abbott_shirtfronting_china.2.b: "The dragon does not grovel with the sheep."
abbott_shirtfronting_tt: "We will withdraw our ships from the shoal for the time being"
abbott_shirtfronting_china.3.t: "Standing Down"
abbott_shirtfronting_china.3.d: "The Chinese government has agreed to withdraw their ships from the region. For a moment it seemed that our nations were on an unavoidable path to war, but we've narrowly dodged that course. While tensions are still high, they've offered to send a delegation to Canberra to iron out something solid to prevent this happening again. We've suffered a lot for this, but it marks a small victory."
abbott_shirtfronting_china.3.a: "Another war averted."
abbott_shirtfronting_china.4.t: "Silence"
abbott_shirtfronting_china.4.d: "The line clicked and the sound on the other end went dead. The Chinese are unwilling to discuss any terms of deescalation, despite being fully aware of the incident. We sit at a crossroads. If China continues with this level of uncontested escalation, we are essentially at a level of war without fighting back. On the other hand, there is little way back from a blank declaration."
abbott_shirtfronting_china.4.a: "We have to stand down."
abbott_shirtfronting_china.4.b: "If it's war they want..."
call_japan_to_our_side_ast: "Call Japan to our side"
call_kor_to_our_side_ast: "Call South Korea to our side"
call_roc_to_our_side_ast: "Call Taiwan to our side"
abbott_call_to_arms.1.t: "Australia Calls Us to Arms"
abbott_call_to_arms.1.d: "As per the signed agreement between our nations, due to the current conflict between them and China, Australia has called us to honour the pact and join the fight."
abbott_call_to_arms.1.a: "To war then."
malcolm_abbott_event.4.t: "Into the Monkey Pod Room"
malcolm_abbott_event.4.d: "Tony sat there in the empty Parliament room, with only the hum of a dying light bulb above to keep him company. His thoughts lingered on his time in Uluru, during his first long distance run. The whole journey was agonizing. Tony wasn't in any shape to accept the challenge, and he almost gave up more than a few times, but he'd never felt freer than in that moment. \n\nThere was nothing around you out there in the outback. Only the whistle of the Witchiti Bush swaying in the wind, and the beating sun. When he finished it had become the start of his long love of marathons and 'ironman' events. The gruelling nature of the acts became a test of character, and now in office there was a similar level of agony to it, but the work was always worth it. \n\nThis time, however, that wouldn't be the case. The ride was coming to an end. As all the Liberal Parliamentarians piled in for the vote, Tony would be defeated 44 to 54. With Malcolm Turnbull taking the reins as the new leader. Politics fostered disloyalty, but it still felt like a stab in the back. He took some comfort in the fact that, true to his word, he had become a loser, not a quitter."
malcolm_abbott_event.4.a: "The marathon was over."
malcolm_abbott_event.5.t: "Malcolm Turnbull Sworn in as [GetASTLeaderTitle]"
malcolm_abbott_event.5.d: "On the front lawn of Parliament House, Malcolm Turnbull gave his first address as the new leader of the Liberal Party, and PM, promising \"extensive\" changes to bring forth a \"21st century government\". Turnbull announced a mix of newcomers and party veterans to help bridge the transition, including Scott Morrison and Christopher Pyne, bringing attention to the introduction of five additional female cabinet members. \n\n\"We must be more competitive, we must be more productive and - we must be more innovative,\" the new [GetASTLeaderTitle] stated, priming the government to embrace a more technocratic direction. \n\nWhile the wounds are still fresh in the eyes of conservative hardliners in the party, the majority have supported Turnbull's rise, with an early boost to polling for the Liberals since the overthrow."
malcolm_abbott_event.5.a: "Here's to the future."
aus_war_on_terror_abbott.1.t: "A Pretext for War"
aus_war_on_terror_abbott.1.d: "Tony wiped the sweat off his forehead and looked around the room of busy media personnel, all rushing around for the address. The lights they'd brought in were hideously hot, and Tony was hoping the whole thing could be over fast. In the last month there'd been too many press and intelligence meetings for his comfort, and now it was his job to sell the nation on it. \n\nThe teleprompt was wheeled forward and as everyone went quiet. Tony cleared his throat. As he gave the address to the nation he would mention a name that the news media had been bombarding the public with for months. That name was Jemaash Islamiyah. \n\nJemaash Islamiyah was an Al-Queda linked terrorist network ASIS was confidently pinning for the Bali Bombings and the Embassy attack. They had hit us again and again, and when we finally found their hidey hole, the Indonesians refused our troops entry. In essence becoming 'harborers of terrorists' as Tony would claim. \n\nWhether the public fully believed or not was largely irrelevant. The decision was made before the address. This was simply laying track work."
aus_war_on_terror_abbott.1.a: "\"It's time we fought back.\""
the_canberra_treaty_abbott.1.t: "The Canberra Treaty"
the_canberra_treaty_abbott.1.d: "After arriving in Canberra, the terms for the treaty have clarified the demilitarization of the Spratly Islands, a limitation on our fleet production, and a non-confrontation agreement between ourselves, Australia and the Philippines. This would smooth over the disastrous outcome of the fleet encounter, however, it amounts to a humiliation that limits movement in our own territory. \n\nWhile the treaty is only temporary, it has the backing of some of our major trading partners. The blowback of backing out would be sizable."
the_canberra_treaty_abbott.1.a: "To preserve peace."
the_canberra_treaty_abbott.1.b: "They're dreaming if they think we're signing."
the_canberra_treaty_abbott.2.t: "Signing the Treaty"
the_canberra_treaty_abbott.2.d: "The Chinese and Filipino delegates arrived in Canberra at the earliest hours of the morning to preempt the meeting. When it began only a quiet seething could be heard between them. The fact that the Chinese reps didn't walk out at the first sight of the treaty was a good sign. This was a sort of humiliation ritual for them, but one with repercussions too high to avoid. \n\nThe end result was an agreed demilitarization of the waters around the Scarborough Shoal, and the Spratly Islands. China also committed to limitation on their fleet production and patrol operations, along with a non-confrontation agreement. \n\nIt wasn't the knockout punch that we might've wished for, but we succeeded today in breaking the illusion of Chinese supremacy. Their porcelain armor has been chipped, and the Chinese sphere has been contained. At least for the time being."
the_canberra_treaty_abbott.2.a: "Peace in our time!"
the_canberra_treaty_abbott.3.t: "The Chinese Walk Out"
the_canberra_treaty_abbott.3.d: "In a less than surprising outcome, during the outlining of the treaty terms, the Chinese delegates simply got up and walked out of the conference room. As we're aware they've already reached the airports to head home. It's brazen, but we knew the terms of the treaty were risky. \n\nIt wasn't the knockout that we might've wished for, and the walkout was quite the diplomatic failure, but we succeeded today in breaking the illusion of Chinese supremacy. Their porcelain armor has been chipped, and the Chinese sphere has shown its vulnerability. \n\nFor now, the USA, along with a host of other nations have joined us in sanctioning China as a response."
the_canberra_treaty_abbott.3.a: "We did our best."
starbucks_event_ast.1.t: "Difficulty Brewing"
starbucks_event_ast.1.d: "The opaque sheets were lifted off the new, shining tabletops, and seats were unpacked and set up. The green siren had come to the Sydney streets, with 87 stores in fact rolling out across the nation, and by 5am there was already a line around the block. Starbucks was part of the recent wave of American fast-food chains landing in the country, and the managers, who had also come over from the US, were eager to be a part of the launch. \n\nWhen the doors opened a stream of patrons flooded in, along with reporters to document the event. The store was packed with customers, and then, after a few hours, it wasn't. When the opening party left, the store, compared to the ebbing crowd outside, was oddly empty. \n\nA handful of people, mostly tourists, came in every so often, but for the most part it was quiet. This would continue for the rest of the week, and then, after some months of underperforming across the country, most of the stores would close."
starbucks_event_ast.1.a: "Only the fittest survive."
econ_costello_events.1.t: "Red Dirt and the Limelight"
econ_costello_events.1.d: "As Costello stood there in the beating sun, with a smell that lingered something terrible in the air, and a back soaked in sweat, he was in his element. \n\nThe giant tower behind them, loudly pumping oil out, was the backing for their momentous deal. Most of the parts were shipped over from the United States and pieced together here in less than a month. Dozens more like it would be staked across Queensland and SA. Lufkin Industries was handling the whole operation, so not a penny was coming from the government. Yet we'd be reaping the rewards. \n\nThe dust was beginning to blow around and stick to their suits, so Costello and the corporate reps there hurriedly wrapped up the photo op. A surprising amount of companies were banging at the door now that the government was being seen as ostensibly pro-oil, and Lufkin was only the first. \n\nIn Peter's mind coal had become such a temporary boon. It kept the lights on, and kept the homes warm, but it wasn't the fuel that was keeping the rest of the world burning. The next mining rush would be over oil."
econ_costello_events.1.a: "It's just good business."
econ_costello_events.2.t: "Exports Boom"
econ_costello_events.2.d: "As our ties with China have grown closer, our export economy has been booming. Trade volumes with them have increased sizeably in a relatively short period of time, with coal and critical minerals flowing between us at historic rates. Likely to continue for some months."
econ_costello_events.2.a: "To us go the spoils."
econ_costello_events.3.t: "One Night in Beijing"
econ_costello_events.3.d: "When Peter and the rest of the foreign cabinet arrived in Beijing, it'd been the first time he'd seen the city since the G20, and in those few years the cityscape was already vastly different. China's determination to bridge the gap economically had seen it practically soar past its neighbours, and its cities had become sprawls of imposing glass monoliths. Any piece of that growth Australia could get was a bonus. \n\nA short car delivered them from the airport to the 'Great Hall of the People.' A brutalist, almost soviet-esque building in Peter's eyes. Admittedly the city smog was less apparent than they'd expected, and there were curiously very few cars outside. \n\nThey got to the room where the foreign minister and the Chinese delegates were supposed to meet them, but almost two hours had passed and no one came. Finally an unkempt Alexander Downer came stumbling in. Huffing and straightening his tie, he apologised for the delay and the meeting finally kicked off. \n\nIt would amount to be the biggest single investment in the nation's history, and a godsend for our agricultural exports. A dozen companies would be setting up shop in our cities and suburbs, and jobs would flow down to the workers, orchestrated to target the areas in most need. As they shook hands and left, the trip had certainly been the strangest in Peter's memory."
econ_costello_events.3.a: "But still the most fruitful."
econ_costello_events.4.t: "Housing Market Flooded with Dirty Money"
econ_costello_events.4.d: "The government's attempts to drum up sales in the housing market by appealing to Chinese investors seems to have caught more than a supply of eager buyers. Yesterday's bust of a recently sold highrise in Perth has revealed a network of money-laundering and illicit funding that flows all the way up to the Liberal Party fundraising, as one of the investors busted was revealed to be a major party donor. \n\nGroups monitoring the network leading up to the sting noted that there could be dozens of foreign buyers coming from China utilizing the housing market to circumvent Beijing's capital flight restrictions. The response from China has been an immediate extradition request for those involved. A response that may indicate that the warm boost in relations may come to a sudden end."
econ_costello_events.4.a: "No good investment goes unpunished..."
costello_in_the_mines.1.t: "The Mining Corporations Strike Back"
costello_in_the_mines.1.d: "Before the investigation could be even announced, word has leaked to the big mining corps who are now throwing everything they can at us to slow down the commission and paint us poorly in the media. Advertisements are already playing portraying the whole thing as big-government meddling. \n\nWithout even much as a formal conviction, any good will we had with the mines has practically evaporated, and some magnates have moved to fund more nationalist parties like One Nation. Leaving the party in an awkward spot for future funding. We've well and truly kicked the hornets' nest."
costello_in_the_mines.1.a: "The rot must be torn out at any cost."
costello_in_the_mines.2.t: "Results of the Investigation"
costello_in_the_mines.2.d: "The commission has finally presented its findings to us and the result is startling. Across dozens of mines, particularly in the transport sectors, hundreds of workers have been found to be illegally hired. Some having even worked for the companies for years. The reaction from the mining corporations have expectedly remained quiet, and while the legal proceedings are underway we're left with the difficult decision of suddenly handling hundreds of new migrants in the country."
costello_in_the_mines.2.a: "A murky industry."
costello_in_the_mines.3.t: "Handling the Workers"
costello_in_the_mines.3.d: "Over three hundred migrants have been found living in the country as a result of the investigation. Almost half of that number have been working in the mining sector for over two years. The media, and a few in our cabinet, are adamant that we use our current capabilities to deport them immediately. However, considering the training level of the migrants, we could grant temporary visas to allow for continued work. That would prevent any sudden loss of revenue for the mines, but it wouldn't be a popular move."
costello_in_the_mines.3.a: "Deport them."
costello_in_the_mines.3.b: "Let them stay."
costello_in_the_mines.4.t: "Offers From Arabia"
costello_in_the_mines.4.d: "The Crown Prince and Prime Minister, [SAU.GetLeader], has directly approached us over the request. They're offering a heavy investment in our current critical mineral mining, in exchange for lifting some of the restrictions against their nation's investing in Australia. They have shown particular interest in our sports, and allowing them to invest could greatly increase the reach of our entertainment industry, although we would be opening the door to a less than scrutinable country."
costello_in_the_mines.4.a: "A fair offer."
costello_in_the_mines.4.b: "Let's not get too close."
costello_republic_events.1.t: "Climbing the Senate Walls"
costello_republic_events.1.d: "Unlike our last attempt to push the republic matter through Parliament, the votes are simply not in our favor so far. Hardliner Tony Abbott has once again joined the anti-republican crowd as he did in 1999, acting as a spokesperson during Question Time and effectively splitting the party. His aptitude for causing problems for us in the media has also come into full display, taking any opportunity to campaign against us as possible. \n\nIf we can't get it through the senate before even putting it to a referendum, our chances are dead in the water, and our limited support remaining within the party is starting to crumble. We may need to start looking into other ways of scrounging the votes."
costello_republic_events.1.a: "A difficult path lies ahead."
costello_republic_events_abbott_tt: "§YThe opposition will be working against us going forward.§!"
costello_republic_events.2.t: "Getting the Votes"
costello_republic_events.2.d: "Kevin Rudd was easily the smarmiest politician in parliament. Howard hated him, his own party didn't even seem to like him. Somehow he'd snuck his way up to the top of the Labor Party, and now he was our biggest obstacle in getting the votes. \n\nRudd had requested that they meet at one of the cafes just outside of Parliament House, probably with the express purpose of giving any paparazzi nearby the opportunity of catching a photo of him and the [GetASTLeaderTitle] together. Anything to lift him up and sling mud at us. \n\nHe arrived late, as per usual, and insisted on staying for the food. Duck pancakes and steak, whatever the hell that is, was ordered, and then Rudd finally got into it. Labor was trying to pass their new expansion to Medicare, which was no doubt going to be smacked down our party. It was a tit for tat in simplest terms, and with a shake he'd give us the votes to get it through the senate and throw some support our way. \n\nAlthough the cost was a bit hard to swallow."
costello_republic_events.2.a: "Do we have a choice?"
costello_republic_events.3.t: "Unconventional Assent"
costello_republic_events.3.d: "Upon delivering the legislation to the Governor General, surprisingly, they've signed off on it without a hitch. They even seem eager to assist us, going so far as to support the notion of a republic in the media. Now that we have their approval we can consider adding other additions to the new constitution. The work isn't over of course. We'll still need the support of the public before we can send it through the senate again. Unlike 1999, this time we must continue to rally the public and not let the momentum die down."
costello_republic_events.3.a: "Lets get to it then."
costello_republic_events.4.t: "Australians Abolish the Monarchy"
costello_republic_events.4.d: "Green, yellow and blue banners have dotted Sydney and other major cities today. An effort by the Republic of Australia Movement in anticipation for the results of the referendum. As they came through today, the vote tallied 61% in favor of a republic, with four out of the five states needed supporting it. Although the legislation will still need to be pushed through Parliament before it can be recognised as law, the outcome has effectively abolished Australian Monarchism. \n\nThe role of the governor general will be rescinded, a new flag will need to be instituted, and the title of the Prime Minister will soon change to reflect the new model of government. The republicans have spent the remaining hours of the day celebrating in the streets, and although the opposition movement was unsuccessful in keeping the status quo, their leader, Liberal politician Tony Abbott, admitted that the change has put Australia on track for a \"glowing future.\""
costello_republic_events.4.a: "Finally."
costello_republic_events.4.b: "A surprising change."
costello_in_the_mines.5.t: "A Meeting with the Mogul"
costello_in_the_mines.5.d: "Getting a meeting with Rupert Murdoch wasn't hard. It so happened the Newscorp CEO had been contacting Peter's office regularly, and was eager to meet and discuss policy. Somehow it had been half a decade since they last spoke, but when they met again Rupert looked like he hadn't aged a day. \n\nMost knew that he was the head of newscorp, and half the newspapers with that, but few knew how many mining projects he was tied to. When Peter tried to broach the idea of a mining tax reform Rupert would swat it away each time. Getting the mogul's approval was supposed to kick things off, but the opportunity was quickly sinking. \n\nWhen they finally did get to the mines Rupert would go on and on about Geelong and blue collar voters. Peter's electorate was Geelong, so the point wasn't lost on him, but if he was going to salvage a point he needed to make it now. \n\n\"Surely after five years of growth a tax reform isn't that far reaching. There should be some kind of reward for the rest of us- \n\n\"Reward?\" Rupert hung on the word like it was a slur in the old man's mouth. \"I remember when the party used to oppose 'big government.' I'm sure you know what the party needs now.\" \n\nWith that end Rupert thanked him for his time and they made their goodbyes. It wasn't quite the stepping stone he'd hoped it would be, in fact Costello wasn't really sure what to make of the meeting at all. He could only hope he wasn't doing any worse than Howard."
costello_in_the_mines.5.a: "An uneasy sentiment."
costello_republic_events.5.t: "Dawn in Parliament"
costello_republic_events.5.d: "With an energy that Costello could only imagine was last felt during federation, the entirety of Parliament House was in a state of jubilee. Streamers and banners were hanging from almost every work place. Half the building had been abandoned as politicians were either at the local pubs or celebrating in the dining areas. \n\nAs he had to push through a crowd grouped around a portable TV, he glimpsed what they were watching. A lightshow around the Harbor Bridge, with a fiery rendition of the new flag was hanging from it as the fireworks shot overhead. It was apparent that even the opposition was celebrating in some way or another. Our country had finally taken its next big leap. We had crawled out of our adolescence. \n\nThe ballroom was suitably extravagant for the occasion, and when Costello arrived and began sorting through his cards for the speech, he noticed a family face in the crowd. John Howard himself had shown up for the party. Costello couldn't help but take a step off the podium and walk to meet the former Prime Minister, his old partner. \n\nTheir hands clasped in a shake, Howard smiled at him with a weathered but proud look on his face."
costello_republic_events.5.a: "\"Well done, Peter. Well done.\""
commonwealth_games_ast.1.t: "The [GetYear] Commonwealth Games"
commonwealth_games_ast.1.d: "Over 5,000 athletes from 71 countries, territories and bodies have gathered in Melbourne, Australia to compete in the Commonwealth Games this year. Opening within the same spot as the 1956 Summer Olympics, and featuring a number of spectacles including a flying tram and the centrepiece firework display, 17 sports are expected to be on showcase. \n\nFor the first time in the history of the Games, the Queen's Baton visited every single Commonwealth nation and territory taking part in the Games, a journey of 180,000 KM (112,500 miles). Demonstrating the long-term commitment and deep connections between the Commonwealth Nations."
commonwealth_games_ast.1.a: "Our shared values live on in competitive sports."
commonwealth_games_ast.1.b: "Quite the show."
costello_republic_events.6.t: "Shoulders to the Wheel"
costello_republic_events.6.d: "Alexander Downer, the Prime Minister's deputy, reclined in his chair as Costello laid out his plans. Downer had a knack for poker faces. You never really knew what he was thinking until he opened his mouth, and Costello had picked him because he did so rarely, but this time he could see the surprise in his face. After the pitch Downer leaned forward and delivered the line that the PM was expecting. \"How do you know this won't be a repeat of 99'?\" \n\nThe question had hung on Costello's head throughout the whole process. He couldn't be sure that they could avoid another failure like the 1999 referendum, or that they could even get it through the chambers again. None of it was guaranteed, but he had to try. \n\nAfter a short bout of arguing, Downer shrugged and agreed to help. They were stumbling into either uncharted territory, or an all-familiar quagmire. At the very least they were going down in this ship together. There was one thing Downer couldn't figure, however. \n\n\"Would I have to call you Prime Minister, or Mr President?\""
costello_republic_events.6.a: "And then the arguing continued."
labor_factionalism.1.t: "Labor Factionalism"
labor_factionalism.1.d: "The Labor party may not be a coalition, but it does have its own factions. Two have the most say. On the left are the democratic socialists, advocating for socially progressive policies like the increase to welfare, strengthening medicare and economic intervention. Kevin Rudd more-or-less represents this side. On the other side is the more centrist variety. Many of them follow 'Third Way' economic principles; fiscally conservative programs that aim to give people a 'hand-up' not a 'hand-out,' and more prone to business interests. \n \nRepresenting the Labor Right is Julia Gillard, currently serving as the deputy [GetASTLeaderTitle]. While in the interests of the nation, Rudd and Gillard work steadily together on policy making, a silent agreement exists between them not to step on eachothers toes. Angling too much one way or the other could strain the alliance, or even break the party entirely. \n \nDuring our campaigning we also made promises to enact the §YEmissions Trading Scheme§!, in line with our climate policy direction. We should ensure that we pass the scheme during our first term, lest the party begin to question our leadership."
labor_factionalism.1.a: "A tenuous task."
rudd_apology.1.t: "A National Apology"
rudd_apology.1.d: "Only a few months into Kevin Rudd's new tenure, and the [GetASTLeaderTitle] has made an address to the nation with an official 'apology' for historical wrongs against Australia's First Peoples: the Aborigines and Torres Strait Islanders. \n \nThe historic gesture, based on the Bringing Them Home report from 1997, was presented in Parliament house by the [GetASTLeaderTitle], and has since sent an emotional shockwave across Australia. Crowds in the Great Hall and on the lawns outside Parliament cheered and clapped. Several thousand people gathered in the rain to watch the momentous speech in the Sydney streets. \nA profound sense of relief and healing has been felt by the community, and many in it are hailing the efforts by Rudd to amend the inaction by the previous administrations."
rudd_apology.1.a: "About time."
tackle_mining_oligarchy_ast.1.t: "Chatting Over Taxes"
tackle_mining_oligarchy_ast.1.d: "Rudd hated the walk from his desk to Ken's office. The halls in Parliament House were a flat white like a hospital ward, and it conjured a number of bad memories inside and outside of the place. He tapped on the door just below the newly installed nameplate, 'Ken Henry.' \n \nWhen he entered Ken was still busy working away on the taxation review that the rest of the committee were graciously calling the \"Henry Review.\" Ken was only a few years older than Rudd, but he had an old guard look to him. It didn't help that he tended to dole out pointers to the new [GetASTLeaderTitle] often. \n \nThe review was expected to touch on mining profits, and Rudd wanted to know all about the details. The two of them yakked it out for a good few hours on the idea of super taxes and fair implementation before Ken finally threw in the hat and headed off home. Not Rudd though. His night was just getting started, but he'd need some help to get the ball rolling."
tackle_mining_oligarchy_ast.1.a: "Someone who knows the game."
tackle_mining_oligarchy_ast.2.t: "No Backing Out"
tackle_mining_oligarchy_ast.2.d: "Another late night Parliament for Rudd was being spent with Wayne Swan. Swan was one of the \"gang of four,\" that the media was calling Rudd's inner circle. The other two were Julia Gillard and Lindsey Tanner. \n \nKevin had spent a good while going over the legislation plan, and he had already assembled a team of aides that were working on it back in his office, but Swan was crucial to the plan's success. Not just since he had the experience as treasurer to spot anything the rest of them might miss, but he added validity to the whole thing. Rudd still seemed like a bit of a political outsider. No one was questioning Swan's credentials. \n \n\"You're really going after the backbone of our politics here. A lot of our guys are backed by the mines. We do this and they're not gonna' be happy. They'll come after us with everything they got. It's gonna' get ugly.\" \n \n\"I think we've gone through worse, ay?\" Kevin nervously scratched his nose and smiled, but Wayne didn't flinch. He just stared back at Kevin with this worried look, but nevertheless agreed to help. \n \nAt a certain point they were all in this together, and Kevin believed that Wayne wouldn't want to see his administration go under. They'd be sailing into the storm together."
tackle_mining_oligarchy_ast.2.a: "It was never supposed to be easy."
pink_batts_ast.1.t: "The Pink Batts Debacle"
pink_batts_ast.1.d: "It seems that the worst case scenario has occurred in regards to our Home Insulation Program. More than a few of the installs have failed long term, and worse, four workers have died during installation. Three from electrocution and one from hyperthermia. A royal commission has already been requested, and a major class-action lawsuit from the suppliers and installers who seem to have suffered financial damages has come our way. \n \nTo say this is a disaster might be an understatement. The political fallout alone has the potential of sending us under. We'll have to immediately cease the scheme and follow up with a recall program."
pink_batts_ast.1.a: "How could this happen?"
bob_brown_event.1.t: "The Eclectic Bob Brown"
bob_brown_event.1.d: "Bob Brown was a curious man. His activism and obsession with the environment made Rudd look like an industrialist in comparison, and the eco-heads loved him for it. It wasn't surprising he was the de facto founder of the Greens Party. Over a decade later and he was still entirely unchallenged in the Party. Instead they held him up as their poster leader, which itself verged on a cult of personality in Rudd's eyes. \n \nBrown had agreed to come up to the Capital to meet with Rudd for lunch and discuss the cooperation, which until now had been mildly antagonistic. When he arrived Brown was all smiles, and quickly moved in for a handshake. They were having lunch in one of the nearby cafes, unfortunately putting them outside and at the mercy of the Canberra weather, which was almost always dreadful. Perhaps it was why all the politicians were cranky. \n \nIt seemed over the phone that support from the Greens was already in the bag, but as Rudd went over it again, Brown simply shook his head. Despite how grand it already was, he wanted them to go further, and whenever he tried to bring the leader down to the reality of what could reasonably pass through the senate, Brown wouldn't budge. \n \nWhatever microcosm of leverage the Greens had, he was using it now, and it started to wane on Rudd's patience. When they finally shook hands Rudd realised Labor was going grand or they were going home empty handed."
bob_brown_event.1.a: "And there was no in between."
school_visit_rudd.1.t: "A Walk Through Coorparoo"
school_visit_rudd.1.d: "Kevin and his entourage had rocked up to the school at midday to meet the principal, and get a tour of the place. Someone had evidently tipped off the press, because just as they entered a crowd of reporters poured in as well, and soon they were completely surrounded. \n \nThe usual questions piped out of the journalist's mouths: \"Is the government backpedalling on reform? Was the Labor failing their promise to be fiscally conservative?\" \n \nRudd tried his best to ignore them, and to get at least a word in with the principle about the renovations. They managed to shuffle out one of the doors and into the courtyard where the new basketball court had been built, and was doubling as the assembly hall. The new structure was nice and all, but a tad sore to the eyes when contrasted to the much older buildings beside it. \n \nThe plague of modern design had finally found Coorparoo State School. Yet the new upgrades would be a boon to schools like this, more so for the schools worse off. As they went in, a cordon of kids followed, and pushed past the reporters for question time. The [GetASTLeaderTitle] started it off. \n \n\"Well this is terrific being here. Put your hands up, what do you like best about this new hall?\" \n \n\"We can sit on seats,\" one student responded.\" \n \n \"You can sit on seats - that's a big difference!\""
school_visit_rudd.1.a: "Indeed it was..."
gayvote_rudd.1.t: "Australia Votes YES to Marriage Equality"
gayvote_rudd.1.d: "After legalisation for same-sex marriage was put to a voluntary referendum, 61.6% of Australians have said yes, giving the greenlight for the act to pass through the House and the Senate. With a turnout of 79.5%, millions have given their vote to decide the change, and the resulting passage of law is expected to be ratified in the coming months, much to the elation of same-sex couples in the country seeking marriage.\n \nLabor Minister Bill Shorten was out with the crowds in Sydney celebrating the change, and cheered on the efforts of the [GetASTLeaderTitle], and member of the opposition, Malcolm Turnbull, for championing the legislation. \n \n\"What a fabulous day to be an Australian – that both sides of the aisle are ready for change, and supporting the public's voice.\""
gayvote_rudd.1.a: "Love Wins!"
unite_the_nation_speech_ast.1.t: "Kevin Rudd Addresses the Nation"
unite_the_nation_speech_ast.1.d: "The new [GetASTLeaderTitle] has outlined a commitment to writing a \"new page\" in Australia's history, and one that aims to close the gap of inequality that currently exists across the nation. Plans for new social and economic programs were outlined, as Rudd announced they aimed to far exceed the accomplishments of the previous generation, after which personal stories from Australians First Peoples were read out. \n \nThe [GetASTLeaderTitle] ended the speech by emphasising a closer partnership with Aboriginal and Torres Strait Islander peoples, to \"close the gap between promise and performance.\" \n \nSo far the speech has gone down well, although who can say how long this good will lasts without concrete change."
unite_the_nation_speech_ast.1.a: "My name's Kevin, I'm from Queensland, and I'm here to help."
something_to_give_ast.1.t: "Something to Give"
something_to_give_ast.1.d: "The Centrelink chime buzzed out of her phone as she paced the small apartment. She'd been on hold for almost an hour now waiting to be put through to an operator, but as the clock ticked closer to 5pm her hopes were drying up. She'd only just gotten out of classes for the day, but if she didn't get someone over the phone this time she'd be back on it again tomorrow. It felt like the cycle was never ending. \n \nFinally the phone crackled and a voice came through. She wasted no time in unloading her situation onto the other speaker. She'd been studying full time and, with no luck looking for work, her bills were piling up. Even on welfare the payments weren't enough to cover it, and the fear of having to move and drop out was looking more and more likely. All she needed was a little more time. \n \nThe voice on the other end was sympathetic, albeit sounded almost as tired as she was, but it seemed like there wasn't anything she qualified for. She sunk down the kitchen counter and onto the floor. There wasn't any way out. The operator asked if they could put her on hold, and once again she was alone. She was too tired to cry, and it wouldn't change anything. This was how it always was. \n \nSuddenly the operator returned. A new scheme had been launched only that week, allowing recipients to request emergency payments. The repayments would be taken out of following payments piecemeal, and it wasn't much, but it would cover rent, and she could keep studying. The news was overwhelming. After the call she jumped up in excitement, and tears began to stream down her cheeks."
something_to_give_ast.1.a: "A little help goes far."
bill_of_rights_ast.1.t: "Passing the Statute"
bill_of_rights_ast.1.d: "In the end both sides of the house and senate were fighting us tooth and nail getting it through. We've watered things down to appropriate levels, but it's still a start. The 'Commonwealth of Australia Human Rights Act,' offering extensions to our freedom of speech laws, rights of assembly, fair trial, equality before the law, freedom from torture, the list goes on. \n \nNot only are we implementing the largest piece of civil rights legislation in our history, with broad protections for Aboriginal and Torres Strait Islander peoples, but it's something that'll lay the bedrock for all future generations of Australians to be protected by the law. \n \nFor now we still need to ratify everything and begin the implementation in the coming months, but it certainly feels like a big step for the maturity of our nation."
bill_of_rights_ast.1.a: "To those who will enjoy the fruits."
rudd_nz_deal.1.t: "Off to Wellington"
rudd_nz_deal.1.d: "Rudd was taking one of the early morning flights so as not to miss the view of the mountains from above. If there was anything the land of kiwis was beating Australia on, it was the scenery. Their foreign ministry loved to remind you that they filmed the Lord of the Rings there, and it wasn't a mystery why. The Trans-Tasman trade agreement he was there to sign was going to tie our economies practically together, which surprised Rudd that it hadn't been established earlier \n \nThe Prime Minister, [NZL.GetLeader], was quick enough to be the first hand he shook getting off the plane, leading the talks into the airport's diplomacy lounge. Going over it together everything in the paperwork looked good; eliminating virtually all tariffs and trade barriers on goods and services, the usual. Now was the moment their Prime Minister was waiting for. \nThey suggested that the first act of the agreement be an investment into New Zealand's industrial centres by Australia, and went on to list the returns over the next few decades. It was all sound, but would it really be worth investing so much right away?"
rudd_nz_deal.1.a: "Fine."
rudd_nz_deal.1.b: "The trade deal is enough for now."
rudd_visit_ast.1.t: "Approaching the South Koreans"
rudd_visit_ast.1.d: "After landing in the country, one of the first stops was a photo op at the memorial cemetery in Busan. Rudd was lucky enough to have never fought in any wars. None of the Australian ministers still serving were even around for the Korean War, and chief among his priorities was avoiding another such conflict. \n \nThe memorial was massive, and quite powerful up close. The entire cemetery was a garden, and almost every headstone had a flower or hedge. Flags from all over the world accompanied them. The South Koreans had the threat of war looming over their heads every day, so naturally they kept their allies very close. \n \nWhen they finally returned to the National Assembly, the South Korean President, [KOR.GetLeader], had responded positively to the idea of a pacific union but was forthright about the caveat. As usual, defensive assurances from us was the requirement, and they seemed fairly set in stone. They wanted to be sure that if North Korea ever threw a missile, we'd throw a missile, and if they sent a fleet, we'd have ours waiting. The idea certainly had it's merits, but was it worth shaking up the status quo?"
rudd_visit_ast.1.a: "We're in this together."
rudd_visit_ast.1.b: "It's not worth the risk."
rudd_visit_ast.2.t: "Flying Over Osaka"
rudd_visit_ast.2.d: "Japan had embraced the new economic order in strides. Their race to the top of the GDP charts in the 90s was very admirable, but their cities were the real testament. Flying over Osaka felt like looking down at a dozen Times Square's. Even our most urbanised cities didn't hold a candle to theirs, which shined like a neon love letter to capitalism. \n \nThey landed in Tokyo and the delegations began. The Japanese were dealing with the talks as though the issue had just been brought up, and not discussed at length a month prior. Rudd was wondering if they were stalling, but eventually they brought up a demand. \n \nAny pretext to an economic union in the Pacific had to include guarantees that China would commit to mapping out their territories at sea. Their habit of island building and expanding their naval control were worrying the Japanese, who believed that us working as an interim for them might kick things off on a good foot."
rudd_visit_ast.2.a: "We'll present the terms but nothing more."
rudd_visit_ast.3.t: "The Beijing Response"
rudd_visit_ast.3.d: "After a long flight home Rudd couldn't help feeling slightly defeated. The Chinese team of foreign ministers all but laughed him out of the conference room. Despite the discussions going well, Beijing was pessimistic about the concept of a pacific economic union. The merits of ASEAN served well enough currently, and [CHI.GetLeader] was unwilling to broker anything new with the neighbouring powers. \n \nNot being a complete loss, the talks did eventuate into something at least. The team discussed at length planning a more open trade agreement between our nations, and have offered us a new one. The new agreement covers a vast range of Chinese imports in exchange for virtually tariff-free trade on our coal and other mineral exports. \n \nAn agreeable consolation for the talks falling through."
rudd_visit_ast.3.a: "Not bad."
rudd_visit_ast.4.t: "Plum Blossoms"
rudd_visit_ast.4.d: "The Chinese foreign minister has relayed to us that Beijing is open to renegotiating their territorial lines with Japan. This might just be a start, but the fact that they are receptive to the demand shows how far we've come. They've requested that we partake in the discussions as a sort of neutral observer, which no doubt will take some years. \n \nWe may be a while off from an actual Pacific Union, but the strides we've made to obtain peace in the pacific, even if temporary, can't be understated. Beijing has also motioned at improving our existing trade agreement, tying our nations even closer together economically, along with promises of future naval defense talks."
rudd_visit_ast.4.a: "Peace In Our Time"
gillard_talk.1.t: "I Shot the Deputy"
gillard_talk.1.d: "Per their usual meetings, Julia Gillard was briefing Rudd on her side of the government. Since being sworn in as Deputy [GetASTLeaderTitle], Julia was in charge of the \"super ministry,\" the department of education, employment and workplace relations all rolled into one. It was a lot to manage, but Rudd trusted she could handle it. In the 8 years they'd known each other she rubbed him as one of the most shrewd politicians in Canberra, and very capable. \n \nJulia had begun the briefing by filling Rudd in with the latest complaints put forward by the many businesses that felt they were getting the short end of the stick by a very union-biased government. Of course most of it could be ignored, but Julia was adamant that we needed to remain on good terms with them. How far we went with our social policies mattered little, so long as we didn't veer off from our current pro-business stance. \n \nWhen she was finished Rudd could feel her eyes drilling into his. Even when they were casually talking he felt like she was analysing him somehow. Rudd agreed to consider the recommendation and they departed for the day, although he wondered how serious she was."
gillard_talk.1.a: "Something to consider."
papua_talks_rudd.1.t: "Renovations to the Detention Centres"
papua_talks_rudd.1.d: "Australia has offered to renovate the detention centres they constructed here in exchange for minor of foreign grants. The centres have indeed begun to dwindle since they were almost entirely emptied out, and the effects on us will be very little. This seems to be in an effort to fix their ongoing immigration issues."
papua_talks_rudd.1.a: "Fine."
papua_talks_rudd.1.b: "Not this time."
papua_talks_rudd.2.t: "Papua New Guinea Agrees to the Renovations"
papua_talks_rudd.2.d: "Despite the lease running out, the government in Port Moresby has agreed to allow us access to the centres so that the renovations can begin. This should allow us to relocate the queue jumpers to Papua New Guinea, and hopefully deter future landings on our soil."
papua_talks_rudd.2.a: "As expected."
papua_talks_rudd.3.t: "Papua Refuses the Talks"
papua_talks_rudd.3.d: "Despite the offer of financial compensation, the government in Port Moresby has refused any discussions on renovating the detention centres. They seem to be hung up on the morality of the whole thing. Now we'll have to continue housing the asylum seekers here."
papua_talks_rudd.3.a: "An unexpected disappointment"
address_the_tiger_event_ast.1.t: "Brokering Peace in Bharat"
address_the_tiger_event_ast.1.d: "The talks with India has been predetermined since the beginning of Kevin Rudd's term, or even before that. Our strategic goals for the Pacific are well aligned, and they've been eager to work alongside the ADF in fine tuning their army. Now we simply had to introduce the idea of working with China. \n \nIn New Delhi the red carpet was truly rolled out. [RAJ.GetLeader] was perhaps making a bigger deal out of the thing than Rudd expected, after all, most of their communications were handled by the phone on his desk. The official state visit was merely a spectacle, but an enjoyable one surely. \n \nWhen they assembled in Hyderabad House to discuss the deal the military partnership was immediately scoped out, and of course they were in agreement. Then the real negotiations began. As soon as China was mentioned the tone in the conference room shifted. You would have found a more appeasable crowd with the Taiwanese delegation on the topic of China than here. \n \nRudd tried his best to ease them into it over the next few hours, but the best he could get was a promise of considering the economic union 'once the other countries had agreed to work with China,' which was basically a no. Although, officially Rudd would say he had brought them to the table."
address_the_tiger_event_ast.1.a: "And that was enough."
legislation_rudd_blocked.1.t: "Legislation Blocked in the Senate"
legislation_rudd_blocked.1.d: "It seems that the entire Liberal party is standing against our passage. They're throwing everything in the book at us, and have even wrangled a number of independence to their cause. We won't be able to pass the bill like this, and unless we can shore up the support we need during resubmission, the legislation is dead in the Senate. \n \nTypically we'll need to wait 3 months before it can be sent through again. During that time we could use our reach to secure more votes and obtain a majority, as unlikely as it seems. We might not be able to approach the Liberals, but the Greens could be amenable to our reforms if we haven't already brought them on board, and the Independent members could go either way."
legislation_rudd_blocked.1.a: "So much for bipartisanship..."
legislation_rudd_blocked.2.t: "The Second Vote"
legislation_rudd_blocked.2.d.a: "Despite our efforts the Liberal majority is still holding strong. In spite of all their procedural delays and amendment demands we were still able to get to the voting stage, during which we lost by 34-42. It appears all of the independents have aligned with the Liberals, and the Greens were not enticed enough to vote with us. \n \nWe aren't completely out of options, however. We could request a double dissolution, dissolving both the House and the Senate and triggering an early election. It's a very risky maneuver, and doing so would carry the possibility of us losing seats if the timing isn't great. It could also be the only way to get us the seats we need for a majority. \n \nIt hasn't been triggered since 1987, and Gillard has strongly advised us against it. We could always wait till the next election. Still, the option is available to us if we wish to pass it before then."
legislation_rudd_blocked.2.d.b: "Despite our efforts the Liberal majority is still holding strong in the Senate. In spite of all their procedural delays and amendment demands we were still able to get to the voting stage, during which we narrowly lost 37-39, thanks to Greens support. It appears all of the independents have aligned with the Liberals. \n \nWe aren't completely out of options, however. We could request a double dissolution, dissolving both the House and the Senate and triggering an early election. It's a very risky maneuver, and currently we're down a few points compared to the previous election. Going into another election so soon could lose us the prime ministry. It may also be our only way to get a majority. \n \nIt hasn't been triggered since 1987, and Gillard has strongly advised us against it, suggesting we wait until our next term. Still, the option is available to us if we wish to pass it now while we have the momentum."
legislation_rudd_blocked.2.a: "It's time to act."
legislation_rudd_blocked.2.b: "It's too risky."
legislation_rudd_blocked.3.t: "The Double Dissolution"
legislation_rudd_blocked.3.d: "Now that the dominos have fallen and the dissolution has been triggered, an early election will be scheduled. With the first hurdle is down, we need to focus on the campaign. Our party is going steady in the polls, but the Liberals could swing the public if we let them. Right now they're led by Tony Abbott, one of our more staunch critics. He hasn't held any punches so far, so we shouldn't restrain from hitting back. \n \nWith 60 days till election day, we'll need to keep the country in check and keep up our campaigning if we're aiming to pull ahead."
legislation_rudd_blocked.3.a: "The pressure is on."
legislation_rudd_blocked.4.t: "Victory"
legislation_rudd_blocked.4.d.a: "Rudd fell into his chair and let out a sigh of relief. The legislation passed. It was finally over. The rest of the Labor party and the Greens broke out into applause. The other side of the aisle seemed to instead sit there with crossed arms, but in the front row Rudd spotted Malcolm Turnbull staring right at him, and he could swear Malcolm was grinning. \n \nHe felt a pat on his back, and as he turned he saw Gillard smiling down at him. Even she had to admit this was an achievement for the party. The party was finally doing something truly great, and the dent they were making in homelessness would actually mean something. Labor had at last become the party of reform. It might not last, but today they'd won the first battle. \n \nHe wiped the sweat off his head and stood up to clap with the party. It was time to enjoy this while it lasted."
legislation_rudd_blocked.4.d.b: "Rudd fell into his chair and let out a sigh of relief. The legislation passed. It was finally over. The rest of the Labor party and the Greens broke out into applause. The other side of the aisle seemed to instead sit there with crossed arms, but in the front row Rudd spotted Malcolm Turnbull staring right at him, and he could swear Malcolm was grinning. \n \nHe felt a pat on his back, and as he turned he saw Gillard smiling down at him. Even she had to admit this was an achievement for the party. How many years had the mining corporations made it impossible for real reform, and yet now they would be paying their dues. No doubt the smear campaigns would continue for some months, but today he'd won the first battle. \n \nHe wiped the sweat off his head and stood up to clap with the party. It was time to enjoy this while it lasted."
legislation_rudd_blocked.4.d.c: "Rudd fell into his chair and let out a sigh of relief. The legislation passed. It was finally over. The rest of the Labor party and the Greens broke out into applause. The other side of the aisle seemed to instead sit there with crossed arms, but in the front row Rudd spotted Malcolm Turnbull staring right at him, and he could swear Malcolm was grinning. \n \nHe felt a pat on his back, and as he turned he saw Gillard smiling down at him. Even she had to admit this was an achievement for the party. Labor was keeping their promises. Australia would be the country to step up to the plate when none others were. The future generations would be secured because of us. \n \nHe wiped the sweat off his head and stood up to clap with the party. It was time to enjoy this while it lasted."
legislation_rudd_blocked.4.a: "Well earned."
approach_parties_rudd.1.t: "Approaching the Liberals"
approach_parties_rudd.1.d: "The Liberal Party and the Nationals are committed to a \"no without exception\" strategy right now, apparently in protest of our lack of inclusion in the planning. If they had their way the bill would be stripped down to nothing. Regardless, they are unwilling to work on any amendments now."
approach_parties_rudd.1.a: "You can't win em' all."
approach_parties_rudd.2.t: "Appeasing the Greens"
approach_parties_rudd.2.d: "The only issue with getting the Greens on board was their demands. For such a small party their aptitude for causing us problems couldn't be underestimated. If we didn't bargain they would vote against it in protest, and they insisted we strengthen an already controversial bill. Using everything up our sleeves to make some compromises, they've agreed to support essentially the same bill, with some minor additions."
approach_parties_rudd.2.a: "Let's hope they keep their word."
approach_parties_rudd.3.t: "The Outsiders"
approach_parties_rudd.3.d: "Both the senator from the Democratic Labour Party and the independent, Nick Xenophone, were hard sells on the bill. Nick has been especially critical of our administration since the beginning, and both of their voting history has been mostly Liberals sided, but after promising to work on future amendments with them they've agreed to back the bill."
approach_parties_rudd.3.a: "Excellent."
mad_katter_ast.1.t: "The Mad Katter"
mad_katter_ast.1.d: "Bob Katter was the de facto king of northern Queensland, having served for almost 20 years as their representative. He was a firebrand politician by every meaning of the word, and particularly in no way ordinary. Not the way he dressed, nor his opinions, and especially not the way he spoke. If Katter caught your ear you'd be on a journey, with no sure way of knowing where it'd go. \n \nThey had started the meeting with the pretence of collaborating on a new bill, but Katter had gone on a tangent about the plight of farmers and the importation of bananas. He eventually got quite emotional, to which Rudd had to reign him in. He was clearly very passionate about the human cost of the ongoing droughts. \n \nRudd couldn't decide if the man was a socialist or a conservative, or maybe a strange mix of the two. Either way they were going figure out something to help the farmers."
mad_katter_ast.1.a: "It's the least we can do."
whispers_in_the_crowd_ast.1.t: "Whispers in the Crowd"
whispers_in_the_crowd_ast.1.d: "By now Kevin Rudd was used to the nature of Parliament House. How the status quo was decided in an afternoon, and nothing stayed permanent. Now that things were in full swing he felt comfortable with the pace the government was making, however, something had changed between now and when he was sworn in, and it was beginning to wear on him. \n \nHe seemed to get along with almost everyone in his cabinet, but occasionally he had the feeling that their goodwill was waning. Where before they took his orders with strides, now more frequently, they were second-guessing him. He was having to explain his reasoning more and more, and it pulled the direction of his policy into question. \n \nWas he being paranoid? Possibly. Perhaps it was everything going on that was weighing on them. Besides, he still trusted his cabinet to party going. \n \nRudd shrugged it off and continued with his work. It was probably nothing."
whispers_in_the_crowd_ast.1.a: "Or was it?"
mining_smear_campaign_ast.1.t: "The Media Campaign"
mining_smear_campaign_ast.1.d: "The media smear campaign is in full throw now that the big mining corps found out what we're up to. Dozens of different ads flooding every channel and wavelength. Banners on roadsides. Instead of paying their dues, they're dumping millions to deface our government. It's not all sticking, but when it does it's hurting our ability to govern, and public perception is declining. \n \nThe coalition is already hopping on the wagon to criticise us. If we don't do something to keep a lid on this soon things will only get worse."
mining_smear_campaign_ast.1.a: "Not great."
corruption_outcome_aus.1.t: "Hand Caught in the Jar"
corruption_outcome_aus.1.d: "The outcome of our recent party investigations has yielded enough ammo for us to shut out foreign influence in the party for good, or at least the time being. However, a couple of findings that weren't related to interest groups meddlings have come out, and it's painting our party in a bad light. \n \nNothing has come up that can be tied to us, yet, but it is enough to lose some credibility in the public's eye. We'll have to keep our noses clean going forward, till we're out of the spotlight."
corruption_outcome_aus.1.a: "Oops!"
aus_gillard_overthrow.1.t: "A Knock at the Door"
aus_gillard_overthrow.1.d: "Rudd was going through the usual paperwork in his office when a knock rang from the door. He recognised the pattern, and so he called in Julia Gillard, who entered in a slow but deliberate way. As opposed to their usual routine she remained standing, and as Rudd looked up at her she delivered the news. \n \nTo Rudd it felt as though the office walls around them were falling inwards. As she continued on his world was collapsing, and all he could do was watch in shock as she was delivering the dagger. Gillard was going to trigger a leadership challenge. He couldn't believe it, his own running mate overthrowing him, let alone someone he considered a friend. The worst wasn't over. She was demanding his resignation. \n \nHe had already been overthrown in all but writing, but she was offering him the option of saving face and avoid the process in Parliament. As she listed all the cabinet members backing her Rudd realised every ally he had she'd flipped. He was alone in the party now."
aus_gillard_overthrow.1.a: "It was all over."
aus_gillard_overthrow.2.t: "Dawn"
aus_gillard_overthrow.2.d: "Cameras surrounded the outside podium, awaiting the announcement. By now everyone knew what was happening. Any news that came out of Parliament traveled fast, and it was a coup in planning for quite awhile. By the next morning it was already over, and as the reporters awkwardly stood there waiting for the moment, the doors finally swung open and the [GetASTLeaderTitle] stepped out with his family. \n \n\"I was elected by the Australian people as [GetASTLeaderTitle] of this country to bring back a fair go for all Australians and I have given my absolute best to do that, I've given it my absolute all. In that spirit I am proud of the achievements that we have delivered to make this country fairer.\" \n \nHis eyes were already starting to water. Perhaps Rudd was the right [GetASTLeaderTitle] at the wrong time. There was little he could've done to avoid what was turning out to be a revolving door of a party, where overthrows were becoming a sad norm. \n \n \"It's been a very busy two and a half years. We've thrown our absolute all at this and I believe when we look back, these reforms will endure into the future and make Australia, I believe, a fairer and better place than it would otherwise have been.\" \n \nThere was applause from them before Rudd waved goodbye. He could only hope he was right, and that his work to change things would stick."
aus_gillard_overthrow.2.a: "Goodbye sweet prince."
the_new_look_rudd.1.t: "The New Look"
the_new_look_rudd.1.d: "As the hum of election season began to creep back into his day to day, Rudd found he had much less time to focus on his own grooming. It wasn't unlikely that he found himself staying overnight in Parliament, going over proposals and the usual, only to be out on the campaign trail the next day. \n \nToday he was quite a way out of the capital and in his own electorate of Griffith, Queensland. While the sun was barely out he was already going over notes, and appreciating the quiet before everyone was up. A rarity in recent days. As if on queue, however, the calm was broken, and the fly screen door into the campervan swung open to reveal a huffing Anthony Albanese. \n \nAnthony was a portly, sort of clumsy man, yet it wasn't that long ago that the two of them were at each other's throats for leadership of the party, and Rudd made sure never to forget it. Anthony stumbled in and propped a coffee on the table beside Rudd, who thanked him with a nod. \n \n\"Geese you're looking gruff.\" He gestured at Rudd's chin. Rudd touched it and realised he hadn't shaved in two or three days, and his white stubble had grown into a beard. \n \n\"It seems I am. How do I look?\" \n \n\"I mean it's not bad. Might be a surprise to the voters.\" Anthony said with a chuckle. \n \n\"Hmm. I suppose I don't want to be looking disheveled.\" \n \n\"I don't know. Maybe they'll like it.\""
the_new_look_rudd.1.a: "Then I'll keep it."
the_new_look_rudd.1.b: "Time to shave."
rudd_the_next_leader.1.t: "The Future of the Party"
rudd_the_next_leader.1.d: "There comes a time in any leader's life when they must think of the next generation. Julia Gillard was not so much a younger generation compared to Rudd, but she may very well be the future of the party. Under the agreement they made going into the 2007 election, Rudd had promised Gillard that at some point he'd step down, letting her run after him. \n \nThe responsibility was heavy for Rudd, but Gillard hadn't let him down yet. She was the business side of the party. It seemed uncommon that her concerns of budget deficits and economic growth weren't voiced, and her plans for a national mining overhaul had peaked Rudd's interest. She clearly cared enough. Whether she was fit for the job or not, at some point Rudd would need to decide."
rudd_the_next_leader.1.a: "Something to consider."
rudd_the_next_leader.1.b: "Never!"
rudd_the_next_leader.2.t: "Stepping Down"
rudd_the_next_leader.2.d: "\"This country, which can manage its political differences peacefully, and resolve our politics peacefully and with civility, that's why this country is such a great country. That in this marvellous tapestry of modern Australia, the mosaic of our multicultural nation, that which fashions such unity out of diversity, therein lies the great Australian miracle.\" \n\n\"The Australian people, I believe, deserve a fresh start with our leadership. I know this will not be welcome news to some of you, but my responsibility has been to maintain Labor as a fighting force for the future, so that we can unite behind the next leader of our party, Julia.\" \n\n\"So friends, you won't hear my voice in the public affairs of the nation for some time.\" \n\n\"I have been honoured to serve as your [GetASTLeaderTitle] and as your party's leader, but there comes a time when you know you've given it your all, and a time for the party to further renew its leadership for the future.\""
rudd_the_next_leader.2.a: "\"For me, that time is now.\""
rudd_campaigning_round_two.1.t: "Round and Round the Convention Centre"
rudd_campaigning_round_two.1.d: "As Rudd walked down the aisle of the Labor National Conference and the crowd was hitting a fever pitch. Even party veteran Paul Keating was there to cheer him on, giving the event a dream-like feeling. It was as if he never left. The past few years had simply been a bad dream and now he had awoken to the applause of his colleagues. The same that had applauded his downfall. \n\nIt was odd how fickle politics was. You were always on a knife's edge with the public, and even the people in your own party. Yet he still shook their hands if it meant getting their support for the next election. It was all far too close to get comfortable. \n\nHe would need to pull off a miracle to get another term, but it was far over, and Rudd would give it his all."
rudd_campaigning_round_two.1.a: "We're back, and we're here to stay."
gillard_gov_event.1.t: "A New Direction"
gillard_gov_event.1.d: "In the tight conference room Julia Gillard gave her first press talk as [GetASTLeaderTitle]. The reporters and fellow politicians had all gathered to hear her speak, and waited abate for the mandate she was about to unveil. The weight was truly on her now. Months of work to arrive at this exact position, all the cards had to be carefully stacked and the cabinet members courted into giving their support. All to get right here. \n \nGillard was now one of the most powerful women in the world, and yet her position never felt more precarious. Any fault she made would be scrutinized and mulled over for days by the opposition or the media, or really anyone that felt she didn't have the fortitude to take up the position of her peers. Every step needed to be made carefully. \n \nPassing any reasonable policy was to be put on the backburner until the election could be called, which was to be soon. Until then she'd have to look the part, and hope that the public believed that she could do the job."
gillard_gov_event.1.a: "Any questions?"
papua_residency_ast.1.t: "Economic Pact Offer From Australia"
papua_residency_ast.1.d: "In an effort to strengthen regional economic ties, the Australian government has reached out with a proposal for a 'tariff-free' trade agreement. The proposal includes lessened restrictions on our goods and services in exchange for mutual exclusive mineral rights. Both our nations stand to prosper significantly from the increased flow of goods between us, however, the choice remains ours."
papua_residency_ast.1.a: "For them, of course!"
papua_residency_ast.1.b: "No thanks."
papua_residency_ast.2.t: "Papua Economic Integration"
papua_residency_ast.2.d: "Papua New Guinea has agreed to the proposed pact to tie our economies through trade. The negotiations are being finalized, allowing tariff-free trade on Papua goods and services, streamlined investments and priority resource rights on both sides. Oceania is a step closer to becoming a regional, economic union."
papua_residency_ast.2.a: "Excellent."
papua_residency_ast.3.t: "Failure To Connect With Papua"
papua_residency_ast.3.d: "Papua New Guinea has unfortunately refused the pact, and prefers to keep our current trade relations going."
papua_residency_ast.3.a: "Disappointing."
indo_ast_trade_deal.1.t: "Australia Proposes Trade Agreement"
indo_ast_trade_deal.1.d: "In an effort to warm our cold relations, Australia has proposed a free trade agreement with the promise of military cooperation in the future. Right now the deal would provide smooth transition of goods and services with us, very likely providing an economic boon, but the military agreement is rather open ended."
indo_ast_trade_deal.1.a: "A fair proposal."
indo_ast_trade_deal.1.b: "No thanks."
indo_ast_trade_deal.2.t: "Good News From Rudd"
indo_ast_trade_deal.2.d: "Kevin Rudd has returned from Indonesia with favorable results. Indonesia reacted positively to a free-trade agreement under the condition that our ADF commits to joint security efforts. We've already worked on counter-terrorism efforts alongside the Indonesians, so this would be nothing new, and the request has been left intentionally open-ended, allowing us to define the commitments in the future. For now the agreement will give a nice boost to the trade between our nations."
indo_ast_trade_deal.2.a: "Splendid."
indo_ast_trade_deal.3.t: "Indonesia Refuses Trade Offer"
indo_ast_trade_deal.3.d: "The government in Jakarta has unfortunately refused the pact, responding coldly to Rudds efforts, and has preferred to keep our current trade relations going."
indo_ast_trade_deal.3.a: "Not great, but perhaps expected."
forming_government_gil.1.t: "Pick Your Poison"
forming_government_gil.1.d: "The results of the election have made it adamantly clear that we need to form a coalition government if we want to stay in the job. Right now the opposition is moving quickly to grab their own seats from the House. The left faction of the party has encouraged us to seek a pact with the Greens. We've worked with them before, and they seem willing, but some of our conservative members are iffy on going that far, and more than likely the Greens will put forward some demands of their own. \n \nOn the other hand a number of Liberal defectors have approached us with support for some of our agenda, and are willing to join us in a coalition. With ex-Liberal support we may come off as more bi-partisan to the general populus. Considering the results of the election, appearing more in the middle might not be a bad choice."
forming_government_gil.1.a: "Go with the Greens"
forming_government_gil.1.b: "A Liberal-Labor Coalition it is."
gillard_gov_event.2.t: "Filling the Cabinet"
gillard_gov_event.2.d: "The cabinet was sizing up to be quite the competent group of Labor's finest, at least in Julia's eyes, and more important the loyal variety. Wayne Swan, the new deputy [GetASTLeaderTitle], had agreed to meet with Gillard to discuss forming the foreign ministry. \n\nWhen they met in her office, Gillard explained that she was much keener to focus on the domestic issues of the nation, and allow the foreign ministry to manage of their own accord. Together they went over the options and there were two obvious options. Stephen Smith was the first to offer his services to the new [GetASTLeaderTitle], having previously served under Keating, and had remained a loyal Laborite since. Swan was confident that Smith would tow the party line and more or less keep us on the straight path. \n\nThe other options was Bob Carr. Carr had actually been out of parliament for some time working as a consultant, and was gaining popularity over his fiery public debates. His policy tended towards the more daring variety, and his nomination would no doubt leave a mark, if that was the angle Julia was going for. Still, there was time to decide, and with everything going on there was no rush to resume things overseas."
gillard_gov_event.2.a: "Much to consider."
forced_adoptions_gillard.1.t: "Gillard Government Addresses the Forced Adoptions"
forced_adoptions_gillard.1.d: "[GetASTLeaderTitle] Julia Gillard delivered a national apology this evening for the historic acts of government policy, from 1950 and 1975, that forced the separation of thousands of Indigenous mothers from their children. \n \n\"We acknowledge the profound effects of these policies and practices on fathers and we recognise the hurt these actions caused to brothers and sisters, grandparents, partners and extended family members,\" Gillard told the audience full of over 800 people inside of Parliament House, many of which were in tears. \n \nAn estimated 100,000 to 150,000 thousand infants were forcibly or coercively removed from mothers, mostly young unmarried women."
forced_adoptions_gillard.1.a: "Our hearts go out to them."
let_debate_decide_gillard.1.t: "Same-Sex Marriage Legislation Thrown Out"
let_debate_decide_gillard.1.d: "In a not so surprising result the House of Representatives overwhelmingly voted against the same-sex legislation, at 98-42 the bill was rejected. Our party's platform has typically opposed the concept, and most of the responses have been the usual defenses of traditional values and so on. We've already drawn a lot of criticism from progressive voters online, and no doubt it's going to trickle into the next election."
let_debate_decide_gillard.1.a: "Welp."
let_debate_decide_gillard.2.t: "Anti-Discrimination Amendment Flies Through the Senate"
let_debate_decide_gillard.2.d: "In a surprise act of bipartisanship, our same-sex protections legislation has shot through the House and Senate with overwhelming support. The amendment included wide ranging protections against discrimination on the grounds of sexual orientation, along with Commonwealth-funded programs to protect and support those vulnerable, and provide educational services, strengthening the already existing act. \n \nOnly mild complaints came from the opposition leaders regarding nitpicks in the guidelines, but for the most part this seems like a generational win for the party. The support we're already receiving online from progressive is overwhelming."
let_debate_decide_gillard.2.a: "Another win!"
opposition_attacks_ast.1.t: "Opposition Firing Off Shots"
opposition_attacks_ast.1.d: "Tony Abbott's usual rhetoric has always been part inflammatory, part excessive, but recently he's taken the attacks to new heights. After a crowd of protesters appeared outside of Parliament House wielding some fairly 'obscene' signs, Abbott took the opportunity to go out and mingle with them, inviting journalists to film the affair. \n\nWhat might've been a fringe gathering has been given enough attention that newspapers are now sporting \"DITCH THE WITCH,\" and some even including \"BURN THE BITCH.\" It's crass, even for Abbott, and now the Newscorp media is rolling with it."
opposition_attacks_ast.1.a: "Just great."
opposition_attacks_ast.2.t: "Abbott Launches Media Tour Trashing Our Governance"
opposition_attacks_ast.2.d: "Once again Tony Abbott has grabbed the spotlight only to criticise our policy. Recently, on the Today Show, Abbott went on and on about the infeasibility of our budget planning, labelling it as \"wasteful,\" \"boneheaded\" and the usual jabs. This wouldn't have hit so hard if a Newspoll the previous day hadn't painted us as the lesser preferred government, sitting 5 points behind Abbott in the polls. As our support dwindles, whatever we say back doesn't have much of a leg to stand on."
opposition_attacks_ast.2.a: "Can't we catch a break?"
ast_fm_rudd_focus.5.t: "Kevin Rudd Leaves Cabinet"
ast_fm_rudd_focus.5.d: "During a press conference in Washington, DC, Rudd seemingly announced to the crowd there that he'd be formally stepping down as our foreign minister. A shock for the crowd there, and it's certainly not a great look on our government, but it got worse when Rudd then went on to blame us for his decision. Claiming he didn't have our backing. \n\nIt's very likely the next opportunity he gets, Rudd will attempt a leadership challenge against us. There's already talk of a dissertion in the party, so we'll need to be ready for anything. For now we'll need a new foreign minister."
ast_fm_rudd_focus.5.a: "Lack of backing? But we picked him!"
opposition_attacks_ast.3.t: "The Peter Slipper Texts"
opposition_attacks_ast.3.d: "Our current Speaker of the House, Peter Slipper, has been under fire recently after hundreds of private texts he made were made public as part of legal proceedings against him. Peter was previously a member of the Liberal Party, who jumped ship to join us as an independent. The texts are quite bad, albeit a personal matter for the speaker, but now the Liberals are painting us as sexists for not dumping Peter on the spot. \n \nTony Abbott has rallied a vote of no-confidence against us unless we sack Peter Slipper, otherwise we have an opportunity in the assembly to defend ourselves. While the texts aren't great, they're hardly any worse than the usual Liberal remarks, and it wouldn't hurt to give Abbott a piece of our mind."
opposition_attacks_ast.3.a: "Let's have a go in the assembly."
opposition_attacks_ast.3.b: "Sack Slipper."
opposition_attacks_ast.4.t: "Gillard's Misogyny Speech Receives Viral Support"
opposition_attacks_ast.4.d: "During a vitriolic day of parliamentary debate yesterday, the [GetASTLeaderTitle] unleashed on opposition leader Tony Abbott's character after tensions over the Slipper texts brewed into a breaking point for their ongoing feud. During the assembly no-confidence vote, Gillard began to blast Abbott for his own sexist rhetoric in recent years. \n \n\"I will not be lectured about sexism and misogyny by this man, I will not. And the Government will not be lectured about sexism and misogyny by this man. Not now, not ever.\" \n \nGillard's speech was immediately received well not just across the nation, but globally online too. UK and US newspapers have been quick to chime in to the political theatre, hailing Gillard's \"attack on sexism\" as \"blistering\" but \"brilliant,\" according to the Telegraph."
opposition_attacks_ast.4.a: "Glad that paid off."
rudd_events_gillard.1.t: "Kevin Rudd Offers Services"
rudd_events_gillard.1.d: "While we're still in the process of finalising our cabinet, Rudd has approached us with the offer of serving as our Foreign Minister. Without a doubt, Rudd might be the most experienced and demonstrably effective minister in foreign matters, and it might serve as a boost politically to have someone of the previous office serving with us now. Still, we might want to separate our cabinet from the old if we want to appear as the new face of Labor."
rudd_events_gillard.1.a: "Welcome aboard."
rudd_events_gillard.1.b: "We're fine, thank you."
rudd_events_gillard.2.t: "The Q&A Drama"
rudd_events_gillard.2.d: "Some news has floated our way that Kevin Rudd made a surprise appearance on Q+A talk show, answering a number of questions relating to his term. At face value the show was nothing to worry about, but a few cabinet members have noted the \"critical\" tone Rudd gave to a few questions, blaming certain \"colleagues\" for undermining him during his term. \n\nAs impartial as it sounds, journalists are making the connection directly to us and blaming members in our cabinet for Rudd's demise. Despite how ridiculous the accusations are, it's giving us another headache in the polls."
rudd_events_gillard.2.a: "Is he doing it on purpose?"
rudd_events_gillard.3.t: "Kevin Rudd Campaigning"
rudd_events_gillard.3.d: "Recently Rudd has been spotted in local elections supporting other members of Labor. By all means the support is appreciated by the party, but Rudd is almost purposely making the whole thing about himself. Turning visits into photo ops, and taking the spotlight off the candidates to give his own interviews. He's rallying support around himself rather than our administration, and it might be working. \n\nSupport for Rudd in Newspolls are growing far higher than our own, and if we do anything to stop his little tour it might only make things worse."
rudd_events_gillard.3.a: "Damn it Kevin!"
rudd_events_gillard.4.d: "Rudd has been spotted attending to a number of local electorates supporting our Labor candidates. This is pretty standard activity for seasoned party members, except Rudd seems to be going out of his way to shine light on our policies, championing them to the press. \n\nWhether the media will actually roll with it is one thing, but it's doing wonders for our polling figures, and it's certainly going to help us in the upcoming state elections."
rudd_events_gillard.4.a: "How thoughtful."
rudd_events_gillard.5.t: "Rudd Comes Out Against Our Government"
rudd_events_gillard.5.d: "Expectedly Kevin Rudd has been sneaking around parliament looking to turn more of our ministers against us. Unfortunately the media is running with a \"leaked\" conversation where Rudd proclaimed that he didn't believe in our government to win the next election, and that he was considering a leadership challenge with serious backing. \n \nAs usual this is probably a ploy by Kevin to rattle us, and calling a leadership ballot might put him in his place, but is it even worth humoring?"
rudd_events_gillard.5.a: "Call the leadership ballot."
rudd_events_gillard.5.b: "It's a nothingburger."
rudd_events_gillard.6.t: "Leadership Ballot Called"
rudd_events_gillard.6.d: "Following the Labor leadership election, Kevin Rudd was handily beaten 71 to 31. Rudd has promised to end any further challenges against us, and to support in any further ballots in the future, whatever merit that might have. The results show that, despite everything, the party still has our back. This government is going to continue its mission to the Australian people, no matter how hard it gets. It's time to get back into the ring and continue shoveling out our policy."
rudd_events_gillard.6.a: "Hear hear!"
rudd_events_gillard.7.t: "Mass Resignations in the Cabinet"
rudd_events_gillard.7.d: "Three of our major cabinet members have handed in their resignations within the same week in what we can only surmise is some kind of protest of our government. Lower cabinet Rudd sympathisers have also stepped down in response. The situation could not be more dire in terms of party unity. We'll need to drum up some emergency replacements and make an announcement soon to save face. \n\nIf these sabotages weren't so frequent we might be pushing serious reform, and actually committing to the job we were elected to do."
rudd_events_gillard.7.a: "Like rats fleeing a sinking ship."
rudd_events_gillard.8.t.a: "Greens End the Alliance"
rudd_events_gillard.8.t.b: "Ex-liberal Independents Rally Around [GetASTLeaderTitle]"
rudd_events_gillard.8.d.a: "Amid the recent departures in the cabinet, the new Greens party leader, Christine Milne, has announced their party will also ditch us, disbanding the alliance. They cited some hockey excuse over a disagreement in policy, but we knew this would happen eventually. Labor is poised to enter the next election alone."
rudd_events_gillard.8.d.b: "Amid criticisms from the opposition parties, independents have rallied around the [GetASTLeaderTitle], championing our government's policy in the face of the ongoing drama. Despite being in and out of hospital, Tony Windsor even appeared in front of cameras to boast about the positive reforms he's helped put through, having supported our numbers in the House. Honestly, it's about time we got some appreciation."
rudd_events_gillard.8.a: "Typical."
rudd_events_gillard.8.b: "A welcome gesture."
rudd_events_gillard.9.t: "Another Leadership Challenge"
rudd_events_gillard.9.d: "As our standing in the polls worsens, our critiques in parliament have emerged, like sharks smelling blood, and have begun to prepare a leadership challenge. Since the last one our backing has severely diminished. Despite Kevin Rudd's promise, he's rumored to be putting his name forward for the vote if a challenge is made, and no doubt he's been scheming with his loyalists for a while now. \n\nIn spite of our victory in the last ballot, we might not walk away from this one unscathed."
rudd_events_gillard.9.a: "Into the breach."
gillard_goodbye_ast.1.t: "Final Curtain"
gillard_goodbye_ast.1.d: "In a meeting before the vote Rudd committed to retiring from politics if he lost, not that his word had any real weight at that point. It would be satisfying to see him slowly walk into the horizon, never to stain these halls again. Unfortunately we weren't so lucky. By a margin of 57 to 45 Rudd was the clear winner. \n\nWas Australia really ready for a female [GetASTLeaderTitle]? They certainly weren't showing it, inside or outside of parliament. Suddenly Julia had lost everything she'd spent so long to get, and there wasn't even time to process it. They were out of the Labor caucus room and straight into the conference room. \n\nGillard made her last speech to a crowd similar to the one that saw her sworn in. It was short and simple. Gillard would not contest the results. What would be the point? Sometimes you play your cards and you lose. \n \nAnd Gillard would not be a sore loser."
gillard_goodbye_ast.1.a: "It's over now."
gillard_goodbye_ast.2.t: "The Final Ballot"
gillard_goodbye_ast.2.d: "During the ballot Gillard remained cool. She didn't want to give them the satisfaction of looking worried. Rudd was sitting in the back of the room slouched. He didn't need to say anything, he simply radiated smugness. In her final moments as [GetASTLeaderTitle] Julia would honor it with dignity, otherwise she would've loved to walk across the room and slap some sense into the man. \n\nThe ballot was called and the names were slowly called out. 47… 51… 55… 63. The final tally was 63 to 39. Gillard had won. \n\nHer cabinet stood up and began clapping behind her. She could hardly move, but she forced herself up to accept the toast, while her mind raced through the reasoning. Had the party finally accepted her? In some kind of final protest, Kevin Rudd stood up as well and began clapping. Before the vote Rudd had committed to retiring from politics if he lost. She would never have to see him again. \n\nThey were out of the Labor caucus room and into the nearby conference room quickly, and Gillard announced the results, confirming that she would be running in the next election."
gillard_goodbye_ast.2.a: "It's over?"
uranium_trade_deal_ast.1.t: "Uranium Trade Proposal from Australia"
uranium_trade_deal_ast.1.d: "The Australian government has presented us with an economic agreement to export uranium to us at increased volumes, in exchange for us minimizing the tariffs on their exports to us. Their government has agreed to similarly drop tariffs on our exports, and open the terms to more cooperative commitments to trade in the future. The agreement does stipulate that the uranium must not be used for weapons grade enrichment, but once the ore is in our borders it's really up to us."
uranium_trade_deal_ast.1.a: "A fruitful agreement."
uranium_trade_deal_ast.1.b: "It's not in our interest."
uranium_trade_deal_ast.2.t: "India Agrees to the Uranium Deal"
uranium_trade_deal_ast.2.d: "India has agreed to the new terms and signed the trade pact! We can expect a range of goods and services from them at an increased and streamlined rate, whilst they drop tariffs on our uranium. Crucial to the deal's success, they've also agreed to adopt the International Atomic Energy Agency (IAEA) standards, stipulating that the uranium won't be used for weapons grade enrichment. In exchange we'll be cooperating with them on energy research."
uranium_trade_deal_ast.2.a: "A win win!"
uranium_trade_deal_ast.3.t: "India Refuses Trade Pact"
uranium_trade_deal_ast.3.d: "India has refused our overtures for trade, and has opted to instead continue the current commitments. [GetASTLeaderTitle] [RAJ.GetLeader] has not commented on the outcome, but it seems we are not in good favor with their government. This is certainly a step back for pacific trade, and an unfortunate oversight."
uranium_trade_deal_ast.3.a: "We're losing our touch."
uranium_trade_deal_ast.5.t: "Moscow Signs the Pact"
uranium_trade_deal_ast.5.d: "The government in Moscow has agreed to our trade terms and will be removing a range of tariffs on our goods in exchange for increased uranium exports to them. Whilst they remained vague on the use for the uranium, they did commit to not using it for weapons grade enrichment. The deal marks a breakthrough in cooperation that hasn't been achieved at this level since prior to the falling of the Berlin Wall, and they seem eager to continue the cooperation between us."
uranium_trade_deal_ast.5.a: "Bring out the borscht!"
uranium_trade_deal_ast.6.t: "Moscow Pulls out of the Negotiations"
uranium_trade_deal_ast.6.d: "Russia has refused our overtures for trade, and has opted to instead continue the current commitments. President [SOV.GetLeader] has not commented on the outcome, but it seems we are not in good favor with their government. This is certainly a step back for pacific trade, and an unfortunate oversight."
uranium_trade_deal_ast.6.a: "The bear is best left alone."
rudd_in_korea.1.t: "Dovetailing from the Land Downunder"
rudd_in_korea.1.d: "Australia's foreign minister has been running negotiations with us, through China, in order to organise a warming of relations between ourselves and South Korea. The scheme is bold, and somewhat naive. The Australians have requested that we commit to a timeline where we cease long range weapons production, without dismantling any of our current weapons, in exchange for sanction relief and development aid support. Since our war with South Korea has not technically ended, they've offered to resolve the dispute at the DMZ checkpoint. This could be a worthwhile propaganda opportunity."
rudd_in_korea.1.a: "A unique occasion."
rudd_in_korea.1.b: "It's not in our best interests."
rudd_in_korea.2.t: "Kevin Rudd's Triumph in Korea"
rudd_in_korea.2.d: "Slowly walking through the demilitarized zone checkpoint between North and South Korea, Kevin Rudd was met by the North Korean leader, [KOR.GetLeader], and the two shook hands. Each of them their own side of the border, marking a symbolic leap in Korean relations, and signifying a dramatic change to the greater status quo in Asia. Rudd then crossed over, becoming the first member of the Australian government, and former leader, to enter the country. \n\nAfter four months of intense negotiations, passing back and forth through China, a breakthrough was achieved. [NKO.GetLeader] has agreed to a timeline for ending long range weapons development, and a resolution to the Korean war, which has technically been ongoing since 1950, in exchange for sanction relief and development aid support. Rudd and the Supreme Leader spoke at a press conference later in the day, emphasising the mutual friendship our two nations are hoping to achieve. \n\nThe South Korean President, [KOR.GetLeader], who accompanied Rudd to the DMZ, lauded Rudd's effort as genuine success and a boon for international peace."
rudd_in_korea.2.a: "Solid diplomacy wins again."
vietnam_trade_gillard_ast.1.t: "Trade Overtures from Australia"
vietnam_trade_gillard_ast.1.d: "The Australian government has presented us with an economic agreement to streamline trade between us at increased volumes, and minimizing the tariffs on both sides. We've enjoyed consistently healthy trade between us so far, and they seem to be interested in more cooperative arrangements in the future."
vietnam_trade_gillard_ast.1.a: "A fair proposal."
vietnam_trade_gillard_ast.1.b: "This doesn't suit us."
vietnam_trade_gillard_ast.2.t: "Vietnam Agrees to Trade Negotiations"
vietnam_trade_gillard_ast.2.d: "The Vietnamese government has agreed to the new terms and signed the trade pact. We can expect a range of goods and services from them at an increased and streamlined rate, and more Australians will be able to enjoy cheaper goods at stores near them."
vietnam_trade_gillard_ast.2.a: "It's all coming together."
vietnam_trade_gillard_ast.3.t: "Vietnam Refuses Trade Negotiations"
vietnam_trade_gillard_ast.3.d: "Vietnam has refused our overtures for trade, and has opted to instead continue the current commitments. External pressure may have prevented them from signing the deal, but General Secretary [VIE.GetLeader] has not commented on the outcome. This is certainly a step back for pacific trade, and an unfortunate outcome."
vietnam_trade_gillard_ast.3.a: "A disappointing outcome."
stir_the_pot_event.1.t: "Australia Demands a No-Fly Zone"
stir_the_pot_event.1.d: "After a number of incidents involving our fighters accidentally hitting civilian infrastructure, the government of Australia has demanded that we adhere to an enforced \"no-fly zone\" over Libya, instituting that our planes stay in their bases lest they be engaged by the Australian Air Force. Whether they intend to actually enforce this request is not for us to say, but they are very far away, and demanding quite a lot."
stir_the_pot_event.1.a: "Acquiesce to their demands."
stir_the_pot_event.1.b: "Libyan airspace is Libyan!"
stir_the_pot_event.2.t: "Libya Yields to Our Demands"
stir_the_pot_event.2.d: "Over the threat of an Australian intervention, [LBA.GetLeader] has agreed to instituting a 'no-fly zone' over Libyan airspace for the duration of their civil conflict. This should hopefully keep the civilian casualties to a minimum, and prevent any spillover into the neighbouring states."
stir_the_pot_event.2.a: "Realpolitik in action."
stir_the_pot_event.3.t: "Libya Refuses Our Request"
stir_the_pot_event.3.d: "Despite the continued loss of civilian life, [LBA.GetLeader] has refused our request for a 'no-fly zone' over Libyan airspace. Their ongoing civil conflict will continue to cause a present danger to the people of the region, and the risk of spillover into the neighbouring states is growing. How we enforce our demands is up to us now."
stir_the_pot_event.3.a: "They knew the alternative."
myanmar_intervention_gillard.1.t: "Australia Demands Peacekeeping Cooperation"
myanmar_intervention_gillard.1.d: "The government in Australia has sent us a demand to allow their peacekeepers into the country and assist us with handling the current insurgent crisis. The help would be appreciated, however, their terms would essentially make us a political client state to their government until the crisis is lifted, which is undefined by their terms. They seem completely adamant to enforcing the request, to such an extent that if we refuse a military invasion isn't out of the question."
myanmar_intervention_gillard.1.a: "Absolutely not."
myanmar_intervention_gillard.1.b: "We have no alternative."
myanmar_intervention_gillard.2.t: "Myanmar Accepts Terms"
myanmar_intervention_gillard.2.d: "In face of the growing insurgent threat, [BRM.GetLeader] has agreed to allowing our peacekeepers into Malaysia to contain the crisis. A sizable component of our armed forces will begin the occupation shortly. Ultimately this is a great win in the fight against terrorism."
myanmar_intervention_gillard.2.a: "It's for their own good."
myanmar_intervention_gillard.3.t: "Myanmar Denies Peacekeeping Terms"
myanmar_intervention_gillard.3.d: "Despite our delegation getting off on good terms with the Malaysians, [BRM.GetLeader] has outright refused our offer to assist in combating the growing insurgent crisis. The nation has continued to unravel to the brink of collapse, presenting a real risk of becoming a hotbed for terrorist cells. Considering how bad things could get, our response must be proportional to the danger this presents."
myanmar_intervention_gillard.3.a: "Sanction them into cooperating."
myanmar_intervention_gillard.3.b: "We must intervene."
ast_myanmar_intervention_rejection_outcomes_tt: "If Myanmar refuses, Australia may impose sanctions and an embargo or prepare a puppet war goal."
