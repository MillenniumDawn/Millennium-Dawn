 GNSS9: "GNSS 2045"
 GNSS9_desc: "Satélite diseñado para formar parte de una constelación satelital que proporciona servicios globales de posicionamiento, navegación y sincronización temporal. Extremadamente útil tanto para fines civiles como militares.\n\nSatélite de navegación global (GNSS 2045):\nEl satélite §Y$GNSS9$§! es un satélite GNSS con una precisión de §Y0.007 m§!. Son necesarios para un sistema de satélites GNSS de 0.007 m."
