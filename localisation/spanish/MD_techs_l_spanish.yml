 missile_non_got_folder: "Tecnología de misiles guiados"
 missile_non_got_folder_desc: "Misiles de crucero y tierra-aire"
 battle_cruiser: "Cruceros de Batalla"
 battle_cruiser_desc: "El crucero de batalla, buque insignia del siglo XX, combina las mejores ventajas de un crucero y un acorazado. Equipado con una amplia gama de armas y equipos, este navío permite una gran proyección de fuerza, al tiempo que requiere menos recursos y capacidad de producción en comparación con un acorazado completo."
 battleship: "Acorazados"
 AIR_TITLE_ATTACK_HELICOPTER_DESC: "Los helicópteros de ataque actúan como apoyo de fuego rápido para nuestras tropas, permitiéndoles atacar a los enemigos en cualquier posición. Son especialmente eficaces contra los tanques, ya que tienen capacidades antiaéreas limitadas. Sin embargo, son bastante vulnerables a los aviones enemigos."
 GLCM: "GLCM"
 GLCM_desc: "Un misil de crucero lanzado desde tierra (GLCM) es un misil de crucero terrestre, diseñado para atacar objetivos tácticos y estratégicos."
 marine_raider_beach_preparation: "Preparación de la playa para el Marine Raider"
 marine_raider_beach_preparation_desc: "Utilizando Marine Raiders, nuestras fuerzas destruirán los obstáculos de la playa y despejarán sus caminos antes de que las fuerzas desembarquen en la playa."
 armored_spearhead: "Punta de Lanza Blindada"
 armored_spearhead_desc: "Punta de lanza blindada es una formación de vehículos de combate blindados, en su mayoría tanques, que forman el frente de un avance ofensivo durante una batalla."
 cruise_missile_non_got: "Misiles de Crucero"
 cruise_missile_non_got_desc: "Un misil de crucero es un misil guiado autopropulsado no tripulado que mantiene el vuelo mediante sustentación aerodinámica durante la mayor parte de su trayectoria de vuelo. Los misiles de crucero están diseñados para transportar una gran carga útil a largas distancias con gran precisión. Los misiles de crucero modernos son capaces de viajar a altas velocidades subsónicas, supersónicas o hipersónicas, son autónomos y pueden volar en una trayectoria no balística a una altitud extremadamente baja."
 GLCM_non_got: "GLCM"
 GLCM_non_got_desc: "Un misil de crucero lanzado desde tierra (GLCM) es un misil de crucero terrestre, diseñado para atacar objetivos tácticos y estratégicos."
 air_defense_non_got: "Defensa Aérea"
 air_defense_non_got_desc: "La defensa aérea abarca sistemas de armas de superficie, submarinos (lanzados desde submarinos) y aéreos, además de sistemas de sensores asociados, mecanismos de comando y control y medidas pasivas."
