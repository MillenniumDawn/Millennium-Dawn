 HEZ_the_LAF: "레바논 정부군 (LAF)"
 hezbollah_influence: "헤즈볼라 영향"
 hezbollah_events.30.d1: "전능하신 알라의 도우심과 영광스러운 저항 전사들의 귀중한 신앙과 목숨 덕분에, 우리는 시오니스트의 위협을 물리쳤습니다! 시오니스트 공격군은 겁쟁이처럼 레바논에서 도망치고 있습니다! 세계가 충격에 빠진 가운데, 저항은 시오니스트라는 야수와의 싸움에서 승리하고 떠납니다! 우리는 승리했으며, 이제부터 온 세상은 이 이름을 기억해야 할 것입니다."
 hezbollah_events.30.d2: "헤즈볼라는 우리 병사들과 싸우겠다는 한심한 구실에서 패배했습니다. 우리는 그들의 허술한 방어선을 돌파하여 남부 레바논으로 진격했습니다. 헤즈볼라 전투원들이 점거하던 진지는 철저히 확보되었으며, 우리 병사들은 우리 병사들에 대한 도발 없는 공격과 관련된 추가 위협이나 정보를 계속 수색하고 있습니다. 분명한 것은 단 하나, 그들은 괴멸되었다는 사실입니다."
 hezbollah_events.30.o2: "이스라엘의 승리!"
 hezbollah_events.31.d1: "오, 인내하라! 알라의 약속은 참으로 진실이니라. 확신이 없는 자들 때문에 낙담하지 말라..."
 hezbollah_events.31.d2: "테러리스트들이 지상 충돌에서 우리 전투 병력을 격파했습니다. 이 굴욕적인 패배에서 회복하려면 분명 시간이 필요할 것입니다..."
 hezbollah_is_currently_doing_a_raid: "현재 습격 수행 중"
 HEZ_assassination_of_salman_rushdie: "살만 루슈디 암살"
 hezbollah_events.312.t: "우리의 패배!"
 hezbollah_events.312.d: "우리 병력은 레바논의 비열한 헤즈볼라 테러리스트를 격파하지 못한 듯합니다. 그러나 머지않아 반드시 복수할 것입니다."
 hezbollah_events.312.o1: "우리는 이를 잊지 않을 것이다"
 HEZ_Asymmetric_Warfare: "비대칭전"
 HEZ_Asymmetric_Warfare_desc: "우리의 힘은 결코 적과 전차는 전차로, 항공기는 항공기로 맞서는 데서 나오지 않았습니다. 규율 잡힌 전투원, 분산된 지휘, 은폐, 그리고 지형의 효과적인 활용을 통해 모든 마을과 모든 언덕을 전장으로 바꿀 수 있습니다. 비대칭전의 기술을 완성한다면 가장 기술적으로 앞선 군대조차 저항 세력을 격파하기 어려울 것입니다."
 HEZ_The_Underground_Networks: "지하 네트워크"
 HEZ_The_Underground_Networks_desc: "적은 압도적인 화력으로 우리의 지휘 체계와 산업을 마비시키려 합니다. 공장, 보급 창고, 지휘소, 군사 자산을 방대한 지하망에 분산시킴으로써 가장 거센 폭격 속에서도 저항 세력이 계속 싸울 수 있도록 보장할 수 있습니다. 찾기 어려울수록 쓰러뜨리기도 어려워집니다."
 HEZ_al_manar_desc: "알마나르는 헤즈볼라의 TV 방송으로, 헤즈볼라의 견해와 발표를 전 세계에 알리는 데 사용됩니다.\n§Y각국은 결정을 통해 방송을 방해함으로써 그 영향을 약화시킬 수 있습니다.§!"
 HEZ_weaken_the_al_manar: "알마나르 약화"
 HEZ_weaken_the_al_manar_desc: "알마나르 TV는 오랫동안 헤즈볼라에서 가장 영향력 있는 언론 플랫폼 중 하나로서 텔레비전 방송, 온라인 콘텐츠, 지역 위성 네트워크를 통해 여론을 형성해 왔습니다. 주요 방송 서비스 접근을 제한하고, 유통 경로를 교란하며, 정보 캠페인을 조율함으로써 정부는 그 도달 범위를 줄이고 정치적 영향력 수단으로서의 효과를 제한할 수 있습니다."
 HEZ_jam_al_manar_broadcasts: "알마나르 방송 교란"
 HEZ_strange_activities: "수상한 활동"
 HEZ_strange_activities_desc: ""