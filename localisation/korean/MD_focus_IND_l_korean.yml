 indonesia.1003.t: "사회민주노동당으로 바뀐 노동당"
 indonesia.1003.d: "민족노동당이 새 선거 규정의 요건을 충족하기 위해 사회민주노동당이라는 새 이름으로 등록했습니다. 이 당은 여전히 인도네시아 번영노동조합의 정치 조직이며, 지도부는 이 이름이 유권자에게 내놓을 사회민주주의 강령을 반영한다고 말합니다."
 indonesia.1003.a: "같은 노조, 새로운 이름"
 indonesia.1004.t: "번영정의당이 된 정의당"
 indonesia.1004.d: "정부가 신당에 대한 검증을 마치자 정의당이 공식적으로 번영정의당이라는 이름을 사용하게 되었습니다. 간부진과 학습 모임, 청렴한 정부와 이슬람 가치를 내세운 강령은 그대로 이어지며, 당은 새 이름으로 다가오는 선거에 출마합니다."
 indonesia.1004.a: "이제 번영까지 갖춘 정의"
 indonesia.1005.t: "노동당이라는 이름의 복귀"
 indonesia.1005.d: "사회민주노동당이 이름을 다시 노동당으로 바꾸었습니다. 지도부는 소박한 이름이 공장 노동자들에게 더 직접 와닿는다고 말하며, 당은 다음 선거를 준비하면서도 인도네시아 번영노동조합의 정치 조직으로 남을 것입니다."
 indonesia.1005.a: "기본으로 돌아가자"
 indonesia.1006.t: "금지된 이슬람수호전선"
 indonesia.1006.d: "정부가 공동 장관령으로 이슬람수호전선을 금지하고 그 활동과 상징, 부속 요소를 불법화했습니다. 몇 시간 만에 이 조직의 전 지도부는 FPI 약칭을 유지하는 새 단체를 선포했으며, 이 단체는 곧 이슬람형제전선이라는 이름으로 자리 잡았습니다."
 indonesia.1006.a: "금지령에도 약칭은 살아남는다"
 indonesia.1007.t: "PRIMA로 합류한 인민민주당"
 indonesia.1007.d: "인민민주당이 동맹 관계의 대중 조직들과 합쳐 인민정의번영당을 결성했습니다. 새 정당은 정치와 경제에 대한 과두 지배에 맞서 싸우고, 폭넓은 대중 운동으로서 선거에 출마하겠다고 다짐합니다."
 indonesia.1007.a: "좌파가 재결집한다"