 indian_event.53.t: "Traité d'union avec l'Inde"
 indian_event.53.d: "Une délégation indienne est arrivée aujourd'hui dans notre capitale avec une proposition de coopération militaire et d'amitié entre nos pays. Nous recherchions depuis un certain temps déjà un allié potentiel puissant en Asie, et cette opportunité se présente désormais. Que choisirons-nous ?"
