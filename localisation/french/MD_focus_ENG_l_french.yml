 ENG_royal_navy_Idea4_desc: "La Royal Navy britannique est l'une des premières forces maritimes du monde, avec un héritage séculaire. Réputée pour son adaptabilité et sa maîtrise technologique, elle joue un rôle crucial dans la sauvegarde des intérêts maritimes du Royaume-Uni et la projection de puissance à l'échelle mondiale."
 ENG_royal_navy_Idea5: "Marine royale britannique"
 ENG_royal_navy_Idea5_desc: "La Royal Navy britannique est l'une des premières forces maritimes du monde, avec un héritage séculaire. Réputée pour son adaptabilité et sa maîtrise technologique, elle joue un rôle crucial dans la sauvegarde des intérêts maritimes du Royaume-Uni et la projection de puissance à l'échelle mondiale."
 ENG_british_foregin_legion_idea: "Légion étrangère britannique"
 ENG_british_foregin_legion_idea_desc: "Nous autorisons des soldats du monde entier à rejoindre l'armée britannique afin de servir les intérêts britanniques."
 ENG_field_army_expansion_idea: "Expansion de l'armée de campagne"
 ENG_field_army_expansion_idea_desc: "L'armée de campagne élargie est conçue pour exceller dans des environnements opérationnels divers, de la guerre conventionnelle aux missions de maintien de la paix. Cette initiative s'inscrit dans la stratégie de défense plus large du Royaume-Uni, mettant l'accent sur la préparation, la mobilité et l'interopérabilité avec les alliés. En investissant dans la croissance et la modernisation de son armée de campagne, le Royaume-Uni renforce son engagement à maintenir une force terrestre polyvalente et agile, capable de répondre aux menaces du XXIe siècle."
 ENG_multi_ocean_training: "Formation multi-océans"
 ENG_multi_ocean_training_desc: "Ce programme stratégique vise à renforcer les capacités et la préparation de la Royal Navy par des exercices spécialisés, des simulations et des scénarios réels. En exposant le personnel naval aux défis propres à différents océans, de l'Atlantique au Pacifique et au-delà, cette initiative garantit adaptabilité, polyvalence et efficacité des opérations maritimes à l'échelle mondiale."
 ENG_carrier_wing_procurement: "Approvisionnement en ailes de porte-avions"
 ENG_carrier_wing_procurement_desc: "L'initiative d'acquisition élargie d'ailes embarquées souligne l'engagement du Royaume-Uni à renforcer la puissance aérienne de ses porte-avions de classe Queen Elizabeth. Cet effort stratégique porte sur l'acquisition et l'expansion d'aéronefs embarqués, axés sur des plateformes avancées pour accroître le rayon d'action et la polyvalence de l'aile. L'initiative intègre des appareils de pointe, tels que le F-35B Lightning II, ainsi que des moyens d'appui et de reconnaissance. Cette expansion vise à renforcer les capacités des porte-avions, assurant un groupe aéronaval formidable capable d'opérer sur tout le spectre des missions."
 ENG_strategic_aircraft_strategy_idea: "Stratégie des aéronefs stratégiques"
 ENG_strategic_aircraft_strategy_idea_desc: "La stratégie aéronautique stratégique vise à garantir que le Royaume-Uni conserve une flotte robuste et capable d'appareils stratégiques, à même de soutenir les objectifs de défense nationale, de contribuer à la sécurité internationale et de s'adapter aux menaces émergentes."
