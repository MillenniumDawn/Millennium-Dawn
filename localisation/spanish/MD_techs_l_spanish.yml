 module_naval_surface_fusion_engine_1: "Motor de fusión de superficie I"
 module_naval_surface_fusion_engine_1_desc: "Los motores de fusión de superficie proporcionan una propulsión avanzada para buques a través de una generación de energía de alta densidad, ofreciendo una autonomía excepcional y un alcance naval extendido con una fiabilidad operativa optimizada.\n\n§GConsejo de diseño: La propulsión por fusión proporciona una velocidad, alcance máximo y fiabilidad excepcionales, además de un funcionamiento libre de combustible. Es ideal para flotas globales de primer nivel, pero conlleva un alto coste de producción.§!"
