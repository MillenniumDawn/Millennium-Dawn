 israel.148.t: "라암 지도부 문제"
 israel.148.d: "라암이 크네세트에 진출한 이후, 라암당은 당 지도부를 둘러싸고 내부 논쟁을 벌이고 있습니다.\n\n만수르 압바스의 보다 세속적인 지도부로 가야 할까요, 아니면 움마의 영적 지도부로 가야 할까요. 무엇을 선택하겠습니까?"
 israel.148.a: "압바스를 달래라"
