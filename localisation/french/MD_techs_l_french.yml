 module_surface_fut_reactor_power2: "Réacteur hyper avancé"
 module_surface_fut_reactor_power2_desc: "Les réacteurs de nouvelle génération offrent des performances de pointe, une efficacité exceptionnelle et une endurance quasi illimitée aux bâtiments de surface les plus modernes.\n\n§GIndice du concepteur : la propulsion nucléaire offre une vitesse croissante, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux flottes déployées mondialement, mais est extrêmement coûteuse à construire.§!"
 module_surface_fut_reactor_power3: "Réacteur ultra avancé"
 module_surface_fut_reactor_power3_desc: "Les réacteurs de nouvelle génération offrent des performances de pointe, une efficacité exceptionnelle et une endurance quasi illimitée aux bâtiments de surface les plus modernes.\n\n§GIndice du concepteur : la propulsion nucléaire offre une vitesse croissante, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux flottes déployées mondialement, mais est extrêmement coûteuse à construire.§!"
 module_sub_diesel_electric_power6: "Puissance électrique diesel 6"
 module_sub_diesel_electric_power6_desc: "La propulsion diesel-électrique de nouvelle génération offre un équilibre optimal de vitesse, d'endurance et de furtivité immergée pour les sous-marins modernes.\n\n§GIndice du concepteur : la propulsion diesel-électrique offre un sous-marin abordable dépendant du carburant, avec vitesse, portée maximale et furtivité croissantes aux paliers ultérieurs. Convient aux opérations locales et régionales, mais ne peut égaler l'endurance mondiale d'un réacteur.§!"
 module_sub_diesel_electric_power7: "Énergie diesel-électrique 7"
 module_sub_diesel_electric_power7_desc: "La propulsion diesel-électrique de nouvelle génération offre un équilibre optimal de vitesse, d'endurance et de furtivité immergée pour les sous-marins modernes.\n\n§GIndice du concepteur : la propulsion diesel-électrique offre un sous-marin abordable dépendant du carburant, avec vitesse, portée maximale et furtivité croissantes aux paliers ultérieurs. Convient aux opérations locales et régionales, mais ne peut égaler l'endurance mondiale d'un réacteur.§!"
 module_sub_fut_reactor_power2: "Puissance de réacteur hyper-avancée"
 module_sub_fut_reactor_power2_desc: "Les réacteurs nucléaires hyperavancés délivrent une endurance, une vitesse et des capacités de furtivité inégalées aux sous-marins du futur proche.\n\n§GIndice du concepteur : la propulsion nucléaire donne aux sous-marins une grande vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que le diesel-électrique.§!\n§GIndice concepteur : la propulsion nucléaire donne aux sous-marins une haute vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Elle convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que la propulsion diesel-électrique.§!"
 module_sub_fut_reactor_power3: "Puissance de réacteur ultra-avancée"
 module_sub_fut_reactor_power3_desc: "Les réacteurs nucléaires ultra-avancés délivrent une endurance, une vitesse et des capacités de furtivité inégalées aux sous-marins du futur proche.\n\n§GIndice du concepteur : la propulsion nucléaire donne aux sous-marins une grande vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que le diesel-électrique.§!\n§GIndice concepteur : la propulsion nucléaire donne aux sous-marins une haute vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Elle convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que la propulsion diesel-électrique.§!"
 module_light_helipad_3: "Héliport léger III"
 module_light_helipad_3_desc: "Les hélisurfaces légères renforcées offrent un meilleur soutien aux opérations à voilure tournante, améliorant ASM, surveillance et transport.\n\n§GIndice du concepteur : les hélisurfaces légères améliorent la détection de sous-marins, la lutte anti-sous-marine, la détection de surface et le dragage de mines à moindre coût que les hélisurfaces complètes. Conviennent aux petites escortes ASM, mais ajoutent encore carburant, main-d'œuvre et visibilité de surface.§!\n§GIndice concepteur : les hélipads légers améliorent la détection sous-marine, la lutte ASM, la détection de surface et le dragage à moindre coût que les hélipads complets. Ils conviennent aux petites escortes ASM, mais ajoutent encore carburant, effectifs et visibilité de surface.§!"
 module_76mm_gun_5: "Tir ultra-rapide 76 mm - munitions guidées avancées"
 module_76mm_gun_5_desc: "Les canons de 76 mm à ultra-tir rapide avec munitions guidées avancées offrent des performances antiaériennes et antisurface exceptionnelles à courte et moyenne portées.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_76mm_gun_6: "Tir ultra rapide de 76 mm – Munitions guidées de pointe"
 module_76mm_gun_6_desc: "Les canons de 76 mm à ultra-tir rapide avec munitions guidées de pointe offrent des performances antiaériennes et antisurface exceptionnelles à courte et moyenne portées.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_127mm_guns_5: "127mm V"
 module_127mm_guns_5_desc: "Les canons navals de 127 mm très avancés offrent une précision, une portée et une cadence supérieures, les rendant efficaces contre navires et avions.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_127mm_guns_6: "127mm VI"
 module_127mm_guns_6_desc: "Les canons navals de 127 mm très avancés offrent une précision, une portée et une cadence supérieures, les rendant efficaces contre navires et avions.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 tech_light_guns_5: "Canons navals 2060"
 tech_light_guns_5_desc: "Systèmes d'armes navales de petit et grand calibre, conçus pour engager à la fois cibles de surface et aériennes."
 tech_light_guns_6: "Canons navals 2075"
 tech_light_guns_6_desc: "Systèmes d'armes navales de petit et grand calibre, conçus pour engager à la fois cibles de surface et aériennes."
 nsb_drone_tech_4: "Technologie de drones hyper-avancée"
 nsb_drone_tech_4_desc: "Armes de drones montées sur un hélicoptère, dans des rôles offensifs comme défensifs."
 nsb_drone_tech_5: "Technologie de drones ultra-avancée"
 nsb_drone_tech_5_desc: "Armes de drones montées sur un hélicoptère, dans des rôles offensifs comme défensifs."
 nsb_defense_tech_5: "Défense laser avancée"
 nsb_defense_tech_5_desc: "Un système de défense à énergie dirigée capable de désactiver physiquement les projectiles entrants. Tire un laser à haute énergie pour détruire ou dévier les missiles avant l'impact. Représente la dernière génération de protection active pour aéronefs à voilure tournante."
 nsb_defense_tech_6: "Défense laser hyper-avancée"
 nsb_defense_tech_6_desc: "Un système de défense à énergie dirigée capable de désactiver physiquement les projectiles entrants. Tire un laser à haute énergie pour détruire ou dévier les missiles avant l'impact. Représente la dernière génération de protection active pour aéronefs à voilure tournante."
 nsb_gun_pods_tech_6: "Pods d'armes à feu de 6e génération"
 nsb_gun_pods_tech_6_desc: "Systèmes d'armes montés à l'extérieur conçus pour renforcer les capacités offensives des aéronefs à voilure tournante. Ces pods permettent aux hélicoptères d'emporter un armement supplémentaire sans modifications importantes de la cellule, offrant flexibilité et puissance de feu accrue pour divers profils de mission."
 nsb_gun_pods_tech_7: "Pods d'armes à feu de 7e génération"
 nsb_gun_pods_tech_7_desc: "Systèmes d'armes montés à l'extérieur conçus pour renforcer les capacités offensives des aéronefs à voilure tournante. Ces pods permettent aux hélicoptères d'emporter un armement supplémentaire sans modifications importantes de la cellule, offrant flexibilité et puissance de feu accrue pour divers profils de mission."
 nsb_rocket_pods_tech_6: "Pods de fusée de 6e génération"
 nsb_rocket_pods_tech_6_desc: "Les pods de roquettes d'hélicoptère sont des lanceurs externes fixés aux hélicoptères, permettant le déploiement de roquettes non guidées ou guidées pour diverses missions de combat. Ces pods renforcent nettement la puissance de feu d'un hélicoptère, permettant d'engager efficacement des cibles au sol, de supprimer des positions ennemies et d'assurer l'appui aérien rapproché."
 nsb_rocket_pods_tech_7: "Pods de fusée de 7e génération"
 nsb_rocket_pods_tech_7_desc: "Les pods de roquettes d'hélicoptère sont des lanceurs externes fixés aux hélicoptères, permettant le déploiement de roquettes non guidées ou guidées pour diverses missions de combat. Ces pods renforcent nettement la puissance de feu d'un hélicoptère, permettant d'engager efficacement des cibles au sol, de supprimer des positions ennemies et d'assurer l'appui aérien rapproché."
 nsb_atgm_tech_6: "ATGM de 6e génération"
 nsb_atgm_tech_6_desc: "Les pods de missiles air-sol (ATGM) sont des systèmes externes montés sur hélicoptères, permettant le déploiement de missiles guidés conçus pour engager et détruire véhicules blindés, fortifications et autres cibles au sol avec une haute précision. Ces pods renforcent nettement les capacités offensives d'un hélicoptère."
 nsb_atgm_tech_7: "ATGM de 7e génération"
 nsb_atgm_tech_7_desc: "Les pods de missiles air-sol (ATGM) sont des systèmes externes montés sur hélicoptères, permettant le déploiement de missiles guidés conçus pour engager et détruire véhicules blindés, fortifications et autres cibles au sol avec une haute précision. Ces pods renforcent nettement les capacités offensives d'un hélicoptère."
 nsb_multiple_atgm_tech_6: "Support Quad ATGM de 6e génération"
 nsb_multiple_atgm_tech_6_desc: "Un pod ATGM quadruple désigne un lanceur équipé de quatre missiles prêts à tirer, renforçant la capacité d'une plate-forme à engager plusieurs cibles blindées en succession rapide. De telles configurations sont souvent intégrées à divers véhicules militaires, dont VTT et VCI, pour renforcer l'efficacité antichar."
 nsb_multiple_atgm_tech_7: "Support Quad ATGM de 7e génération"
 nsb_multiple_atgm_tech_7_desc: "Un pod ATGM quadruple désigne un lanceur équipé de quatre missiles prêts à tirer, renforçant la capacité d'une plate-forme à engager plusieurs cibles blindées en succession rapide. De telles configurations sont souvent intégrées à divers véhicules militaires, dont VTT et VCI, pour renforcer l'efficacité antichar."
 nsb_heavy_atgm_tech_6: "ATGM lourd de 6e génération"
 nsb_heavy_atgm_tech_6_desc: "Les missiles antichars guidés lourds (ATGM) furent des développements précoces de la technologie des missiles conçus pour engager et détruire les véhicules blindés. Ces systèmes employaient typiquement un guidage MCLOS, exigeant des opérateurs de diriger manuellement le missile vers la cible tout au long du vol. Cette méthode demandait un entraînement intensif et exposait les opérateurs au feu ennemi pendant le guidage."
 nsb_heavy_atgm_tech_7: "ATGM lourd de 7e génération"
 nsb_heavy_atgm_tech_7_desc: "Les missiles antichars guidés lourds (ATGM) furent des développements précoces de la technologie des missiles conçus pour engager et détruire les véhicules blindés. Ces systèmes employaient typiquement un guidage MCLOS, exigeant des opérateurs de diriger manuellement le missile vers la cible tout au long du vol. Cette méthode demandait un entraînement intensif et exposait les opérateurs au feu ennemi pendant le guidage."
 nsb_engine_tech_6: "Moteurs d'hélicoptère de 6e génération"
 nsb_engine_tech_6_desc: "Groupes motopropulseurs spécialisés conçus pour fournir la poussée et la portance nécessaires aux aéronefs à voilure tournante."
 nsb_engine_tech_7: "Moteurs d'hélicoptère de 7e génération"
 nsb_engine_tech_7_desc: "Groupes motopropulseurs spécialisés conçus pour fournir la poussée et la portance nécessaires aux aéronefs à voilure tournante."
 module_flight_deck_3_desc: "Ce module détermine la taille du navire. Les porte-avions plus grands pourront supporter plus d'avions et auront une plus grande intégrité structurelle, mais seront plus faciles à repérer et à toucher. Ils nécessitent plus de carburant, de main-d'œuvre et coûteront plus cher."
