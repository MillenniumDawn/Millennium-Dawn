 sin_taxes_ast: "§2Taxes sur les péchés§!"
 austerity_measures: "Mesures d'austérité"
 work_for_the_dole_3: "§0L'Australie au travail§!"
 work_for_the_dole_3_desc: "Le premier service de construction à l'échelle de l'État, intégrant le principe du « Work For the Dole » pour fournir des emplois à ceux qui étaient précédemment inscrits au programme, avec des salaires compétitifs afin de maintenir le chômage bas."
 automation_subsidies_ast: "§8Subventions à l'automatisation§!"
 minerals_resource_tax_idea_ast: "Taxe sur les ressources minérales"
 minerals_resource_tax_idea_ast_desc: "Un dispositif fiscal au coup par coup pour transférer une partie de la richesse du boom minier dans nos caisses. Négocié de fond en comble avec les patrons du secteur, afin d'être mis en œuvre avec le moins de résistance possible."
