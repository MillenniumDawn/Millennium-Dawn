 UKR_module_ram_1: "아르발레트-K"
 UKR_module_ram_1_desc: "§7아르발레트-K§!는 우크라이나 루치 설계국이 개발·제조한 단거리 함상 지대공 미사일 체계입니다. §7'이글라'§! 계열의 유도 지대공 미사일을 사용하여, 표적이 육안으로 보이는 조건에서 정면 및 추격 침로의 제트기, 터보프롭기, 피스톤 엔진 항공기와 헬리콥터를 요격하도록 설계되었습니다."
 UKR_module_anti_submarine_mortar: "RBU-6000 스메르치-2"
 UKR_module_anti_submarine_mortar_desc: "RBU-6000 스메르치-2는 하나의 체계에 12개의 발사관을 갖춘 구경 213 mm의 소련 대잠 로켓 발사기입니다. 이 체계는 1960~1961년에 취역했으며 광범위한 소련제 수상함에 장착됩니다."
 railway_system_01: "통합 교통 체계"
 railway_system_01_desc: "새로운 기술의 물결이 밀려오면서 철도 체계는 나머지 기반시설과 통합되어야 합니다. 그래야만 우리의 물류가 온전히 유지될 수 있습니다."
 railway_system_02: "탈재래식 철도"
 railway_system_02_desc: "새 천년의 정보 기술은 물류와 기반시설 개발이 옛 시대를 넘어서 훨씬 더 원활하게 돌아가도록 합니다."
 railway_system_04: "초기 고속철도"
 railway_system_04_desc: "고속철도는 물류 개선의 논리적인 다음 단계입니다. 광범위하게 계획된 노선과 현대적 건설 장비를 사용하면 우선 노선을 건설할 수 있어, 열차가 더 먼 거리를 더 빠르게 이동할 수 있습니다."
 railway_system_05: "고속철도"
 railway_system_05_desc: "기술의 결정적 진전은 아니지만, 기존 고속철도망을 더욱 활용하고 확장하면 몇몇 문제를 더 해소할 수 있으며 철도 설계자들이 이러한 체계를 계획할 때 더 많은 경험을 쌓게 됩니다."
 railway_system_06: "현대 고속철도"
 railway_system_06_desc: "현대적 재료, 기술, 통신, 그리고 막대한 계획 노력은 현재의 고속철도망을 새로운 수준으로 끌어올릴 것입니다. 이 광범위한 체계를 대중 교통에 개방하면 삶의 질도 높아지고 국민의 이동성이 훨씬 커집니다. 물론 이는 군에도 마찬가지로 적용됩니다."
 railway_system_08: "초기 자기부상 철도"
 railway_system_08_desc: "자기부상열차는 일반 열차처럼 자체 동력으로 움직이는 것이 아니라 전자기 원리에 의존하여 움직입니다. 동력을 받는 전자석이 단일 자기 레일 위의 열차를 밀어내거나 끌어당길 수 있습니다. 이 자석의 방향을 바꾸면 객차를 움직이게 할 수 있습니다. 공간을 많이 절약하며 유지 보수도 쉽습니다. "
 railway_system_09: "표준화 자기부상 철도"
 railway_system_09_desc: "표준화된 자기부상 철도 사업은 성공적이고 표준화된 자기부상 철도를 전국에 큰 성공으로 배치할 수 있음을 입증했습니다. 이제 이 체계들은 통합되고, 무엇보다 표준화될 것입니다. 단거리와 장거리 자기부상 철도의 지속적이고 극단적인 확장을 가로막을 것은 없습니다."
 railway_system_11: "개량 자기부상 철도"
 railway_system_11_desc: "자기부상 안전성의 발전으로 장거리 철도를 자기부상으로 대체할 수 있게 되었습니다."
 railway_system_12: "고속 자기부상 철도"
 railway_system_12_desc: "이제 전국에 고속 자기부상 철도를 도입할 수 있습니다."
 railway_system_13: "아음속 자기부상 철도"
 railway_system_13_desc: "거의 음속에 가까운 속도 덕분에 나라를 가로지르는 거리는 일상 통근에서 사소한 불편에 불과하게 되었습니다."
 railway_system_15: "초음속 자기부상 철도"
 railway_system_15_desc: "자기부상 기술의 진화로 두 시간 안에 지구 반대편으로 이동할 수 있게 되었습니다."
 arty_upgrade_1: "다탄 동시 탄착"
 arty_upgrade_1_desc: "각 탄두의 발사각과 속도를 조정하여 모든 포탄이 표적에 동시에 명중하도록 하는 방식입니다"
 arty_upgrade_2: "사격 통제 체계"
 arty_upgrade_2_desc: "장거리 무기 체계가 표적을 조준, 추적, 명중하는 것을 보조하도록 설계되었습니다"
 arty_upgrade_3: "가변 추진장약"
 arty_upgrade_3_desc: "포병 탄약에 사용되는 추진제의 양을 증분 단위로 조절하며, 표적까지의 거리와 전술 상황에 따라 선택합니다"
 arty_upgrade_4: "다탄 동시 탄착 II"
 arty_upgrade_4_desc: "고급 부품을 사용한 개량 방식으로, 적 표적에 대한 동시 교전을 가능하게 합니다"
 arty_upgrade_5: "대량 적재식 액체 추진제"
 arty_upgrade_5_desc: "단순한 포 설계와 더 폭넓은 전술적, 군수적 선택지를 가능하게 하는 첨단 기술입니다."
 nsb_arty_upgrade_1: "가변 추진장약"
 nsb_arty_upgrade_1_desc: "포병 탄약에 사용되는 추진제의 양을 증분 단위로 조절하며, 표적까지의 거리와 전술 상황에 따라 선택합니다"
 nsb_arty_upgrade_2: "사격 통제 체계"
