 RAJ_terror_and_disruptive_activities_act:0 "Lei de Atividades Terroristas e Perturbadoras"
 RAJ_terror_and_disruptive_activities_act_desc: "Nosso sistema legislativo não estava pronto para os novos desafios do terrorismo do século XXI. É hora de adaptá-lo e fazer as alterações necessárias."
 RAJ_nuclear_tests_rajasthan: "Testes nucleares no Rajastão"
 RAJ_nuclear_tests_rajasthan_desc: "A renovação e expansão do nosso arsenal nuclear é um precedente importante para a política de defesa indiana moderna. É hora de conduzir novos testes no Rajastão e ter certeza sobre nosso poder."
 RAJ_inner_network_idea_desc:0 "Uma boa rede interna é crucial para o nosso desenvolvimento"
 indian_event.12.a: "Claro"
 RAJ_make_threshold_higher: "Aumente o limite"
 RAJ_make_threshold_higher_desc: "Para alcançar a integridade eleitoral, precisamos aumentar o limite eleitoral para eliminar os amadores e outros idiotas, deixando espaço para pessoas inteligentes e educadas."
 RAJ_BRICS_integer: "Criação do BRICS"
 RAJ_BRICS_integer_desc: "É hora de as grandes potências mundiais se unirem em um só punho para criar um mundo multipolar. A conceituação dos BRICS proposta no Fórum Econômico de São Petersburgo precisa ser implementada."
 RAJ_appease_hindus_desc:0 "Investir em programas comunitários e iniciativas culturais hindus. Eleva a opinião hindu, mas pode ser visto como favoritismo pelas comunidades muçulmanas."
 RAJ_appease_sikhs_desc:0 "Atender às queixas da comunidade sikh e financiar programas culturais. Eleva a opinião sikh, mas pode ser visto como favoritismo pelos hindus."
 RAJ_appease_buddhists_desc:0 "Apoiar a preservação do patrimônio budista e o contato com a comunidade. Eleva a opinião budista, mas pode ser visto como favoritismo pelos hindus."
 RAJ_appease_christians_desc:0 "Financiar o desenvolvimento da comunidade cristã e abordar preocupações com discriminação. Eleva a opinião cristã, mas pode ser visto como favoritismo pelos hindus."
 RAJ_appease_muslims_desc:0 "Investir no bem-estar da comunidade muçulmana e abordar preocupações de segurança. Eleva a opinião muçulmana, mas pode ser visto como favoritismo pelos hindus."
 RAJ_naxalite_insurgency:0 "Grave Insurgência Naxalita"
 RAJ_naxalite_insurgency_desc:0 "[RAJ.GetName] enfrenta uma grave insurgência naxalita-maoísta. O Corredor Vermelho está muito ativo, com grandes operações de guerrilha, emboscadas frequentes contra as forças de segurança e controle territorial significativo pelos insurgentes."
 RAJ_naxalite_insurgency_severe_TT:0 "§RNível de Insurgência Grave§! - Grande presença e operações de guerrilha"
 RAJ_naxalite_insurgency_1:0 "Alta Insurgência Naxalita"
 RAJ_naxalite_insurgency_1_desc:0 "[RAJ.GetName] enfrenta uma insurgência naxalita muito ativa. Os insurgentes mantêm forte presença em áreas rurais, com ataques frequentes a instalações e pessoal do governo."
 RAJ_naxalite_insurgency_high_TT:0 "§ONível de Insurgência Alto§! - Insurgência ativa com ataques frequentes"
 RAJ_naxalite_insurgency_2:0 "Insurgência Naxalita Moderada"
 RAJ_naxalite_insurgency_2_desc:0 "[RAJ.GetName] lida com uma insurgência naxalita moderada. Existe presença rebelde estabelecida com incidentes periódicos, mas as forças de segurança mantêm o controle geral."
 RAJ_naxalite_insurgency_moderate_TT:0 "§YNível de Insurgência Moderado§! - Presença estabelecida com atividade periódica"
 RAJ_naxalite_insurgency_3:0 "Insurgência Naxalita Fraca"
 RAJ_naxalite_insurgency_3_desc:0 "[RAJ.GetName] tem presença naxalita limitada nesta região. Ocorrem incidentes esporádicos, mas a infraestrutura dos insurgentes foi significativamente degradada."
 RAJ_naxalite_insurgency_weak_TT:0 "§GNível de Insurgência Fraco§! - Presença limitada com incidentes esporádicos"
 RAJ_naxalite_insurgency_4:0 "Baixa Insurgência Naxalita"
 RAJ_naxalite_insurgency_4_desc:0 "[RAJ.GetName] tem atividade naxalita mínima nesta área. A região está em sua maior parte liberada, com apenas incidentes isolados."
 RAJ_naxalite_insurgency_low_TT:0 "§GNível de Insurgência Baixo§! - Atividade mínima, área em grande parte liberada"
 RAJ_development_boost:0 "Iniciativa de Desenvolvimento Ativa"
 RAJ_development_boost_TT:0 "§GIniciativa de Desenvolvimento§! - Maior velocidade de construção a partir dos programas governamentais de desenvolvimento"
 RAJ_integrated_development_initiative:0 "Iniciativa de Desenvolvimento Integrado"
 RAJ_integrated_development_initiative_desc:0 "Lançar programas abrangentes de desenvolvimento nas áreas afetadas pelos naxalitas, incluindo infraestrutura, educação e saúde. Isso ataca as causas profundas da insurgência ao reduzir as queixas tribais e melhorar as condições locais."
 RAJ_surrender_rehabilitation_program:0 "Programa de Rendição e Reabilitação"
 RAJ_surrender_rehabilitation_program_desc:0 "Implementar uma política de rendição que ofereça anistia e benefícios de reabilitação aos naxalitas que depuserem as armas. Isso historicamente se mostrou eficaz, com rendições significativas após programas desse tipo."
 RAJ_operation_green_hunt:0 "Operação Caça Verde"
 RAJ_operation_green_hunt_desc:0 "Lançar uma enorme ofensiva paramilitar coordenada contra os redutos naxalitas. Essa operação em larga escala envolve forças paramilitares centrais atuando com a polícia estadual para limpar e manter o território."
 RAJ_samadhan_doctrine:0 "Adotar a Doutrina SAMADHAN"
 RAJ_samadhan_doctrine_desc:0 "Implementar a abrangente doutrina SAMADHAN: Liderança Inteligente, Estratégia Agressiva, Motivação e Treinamento, Inteligência Acionável, Indicadores Baseados em Painel, Aproveitamento da Tecnologia, Plano de Ação para Cada Teatro e Nenhum Acesso a Financiamento."
 RAJ_naxal.10.t:0 "Fusão PWG-MCC Forma o PCI (Maoista)"
 RAJ_naxal.10.d:0 "O Grupo da Guerra Popular e o Centro Comunista Maoista se fundiram para formar o Partido Comunista da Índia (Maoista). Essa unificação cria uma força insurgente mais formidável, com quadros, recursos e controle territorial combinados ao longo do Corredor Vermelho."
 RAJ_naxal.10.a:0 "Esta é uma escalada grave."
 RAJ_naxal.11.t:0 "Grande Ataque Naxalita"
 RAJ_naxal.11.d:0 "Insurgentes naxalitas lançaram um ataque devastador contra as forças de segurança. Uma emboscada matou vários militares e destruiu equipamentos. A ousadia do ataque demonstra a força contínua da insurgência."
 RAJ_naxal.11.a:0 "Devemos responder com firmeza."
 RAJ_naxal.12.t:0 "Rendição em Massa de Naxalitas"
 RAJ_naxal.12.d:0 "Após nosso programa de reabilitação e a pressão contínua, um número significativo de quadros naxalitas se rendeu às autoridades. Os ex-insurgentes estão sendo processados para reintegração à sociedade."
 RAJ_naxal.12.a:0 "Um sucesso para nossa política."
 RAJ_naxal.13.t:0 "Liderança Naxalita Eliminada"
 RAJ_naxal.13.d:0 "Operações guiadas por inteligência resultaram na eliminação de um líder naxalita importante. Esse golpe na estrutura de comando insurgente atrapalhará suas operações e poderá provocar disputas internas pela sucessão."
 RAJ_naxal.13.a:0 "Uma vitória significativa."
 RAJ_naxal.14.t:0 "Protestos por Deslocamento Tribal"
 RAJ_naxal.14.d:0 "Comunidades tribais em áreas afetadas pelos naxalitas protestam contra o deslocamento causado por projetos de mineração e industriais. Os naxalitas tentam aproveitar essas queixas para recrutar novos quadros e conquistar apoio popular."
 RAJ_naxal.14.a:0 "Ignorar os protestos."
 RAJ_naxal.14.b:0 "Atender às suas preocupações."
 RAJ_naxal.15.t:0 "Operação Caça Verde Termina"
 RAJ_naxal.15.d:0 "A ofensiva paramilitar coordenada alcançou resultados significativos. As posições naxalitas em vários estados foram degradadas, suas linhas de suprimento interrompidas e vários redutos liberados. A insurgência foi enfraquecida."
 RAJ_naxal.15.a:0 "Manter a pressão."
 RAJ_naxal.16.t:0 "Índia Livre dos Naxalitas"
 RAJ_naxal.16.d:0 "Após anos de esforço contínuo, a Índia eliminou efetivamente a insurgência naxalita-maoísta. O Corredor Vermelho não representa mais uma ameaça significativa. O desenvolvimento chegou às áreas tribais e os ex-insurgentes foram reabilitados. Isso marca uma conquista histórica em segurança interna."
 RAJ_naxal.16.a:0 "Começa uma nova era."
 RAJ_operation_green_hunt_active:0 "Operação Caça Verde Ativa"
 RAJ_operation_green_hunt_active_desc:0 "Uma enorme ofensiva paramilitar coordenada está em andamento contra os redutos naxalitas. As forças de segurança estão limpando e mantendo território em todo o Corredor Vermelho."
 RAJ_samadhan_doctrine_idea:0 "Doutrina SAMADHAN"
 RAJ_samadhan_doctrine_idea_desc:0 "Foi adotada a abrangente estratégia de contrainsurgência que combina liderança inteligente, operações agressivas, inteligência acionável e aproveitamento da tecnologia."
 RAJ_naxal_free_india:0 "Índia Livre dos Naxalitas"
 RAJ_naxal_free_india_desc:0 "A Índia eliminou com sucesso a insurgência naxalita-maoísta. O Corredor Vermelho foi pacificado e o desenvolvimento chegou às áreas tribais antes afetadas."
 RAJ_salwa_judum_active:0 "Salwa Judum Ativo"
 RAJ_salwa_judum_active_desc:0 "O polêmico programa de milícia civil Salwa Judum ('Marcha da Paz' ou 'Caça à Purificação') está em plena atividade em Chhattisgarh. Embora eficaz em reprimir os maoístas, tem atraído críticas por violações de direitos humanos."
 RAJ_counter_insurgency_operations:0 "Operações de Contrainsurgência"
 RAJ_counter_insurgency_operations_desc:0 "Lançar uma campanha abrangente de contrainsurgência contra os redutos naxalitas em todo o Corredor Vermelho. Isso envolverá operações militares coordenadas, coleta de inteligência e estratégias de domínio de área."
 RAJ_reduce_naxalite_level_tt:0 "Reduz em 1 o nível de insurgência naxalita neste estado"
 RAJ_naxal.17.t:0 "Emboscada de Dantewada"
 RAJ_naxal.17.d:0 "Em 6 de abril de 2010, naxalitas emboscaram uma companhia da CRPF no distrito de Dantewada, em Chhattisgarh. O ataque matou 76 militares de segurança, tornando-se um dos ataques isolados mais mortais da história da insurgência. Os maoístas usaram artefatos explosivos improvisados e armas automáticas em um assalto bem coordenado que durou várias horas."
 RAJ_naxal.17.a:0 "Esta é uma tragédia nacional"
 RAJ_naxal.18.t:0 "Ataque de Sukma"
 RAJ_naxal.18.d:0 "Em 24 de abril de 2017, naxalitas lançaram uma emboscada devastadora contra militares da CRPF no distrito de Sukma, em Chhattisgarh. 25 militares de segurança morreram no ataque. Os maoístas continuam demonstrando sua capacidade de atacar apesar de anos de operações de contrainsurgência."
 RAJ_naxal.18.a:0 "Não seremos intimidados"
 RAJ_salwa_judum:0 "Iniciar o Salwa Judum"
 RAJ_salwa_judum_desc:0 "O Salwa Judum ('Marcha da Paz' ou 'Caça à Purificação') é uma polêmica milícia antinaxalita apoiada pelo governo estadual de Chhattisgarh. Embora eficaz na contrainsurgência, enfrentou severas críticas por abusos de direitos humanos e acabou sendo declarada inconstitucional pela Suprema Corte em 2011."
 RAJ_road_connectivity_program:0 "Conectividade Rodoviária do Corredor Vermelho"
 RAJ_road_connectivity_program_desc:0 "Melhorar a infraestrutura rodoviária nas áreas afetadas pelos naxalitas. Uma melhor conectividade reduz a influência maoísta ao levar serviços governamentais a áreas tribais remotas e dificultar a atuação dos insurgentes."
 RAJ_MAO_rebellion_desc:0 "A grave insurgência naxalita e o crescente apoio comunista encorajaram células maoístas a organizar manifestações em massa contra o governo. Se sua influência não for contida, seguir-se-á uma rebelião armada."
 RAJ_bolywood_idea_desc:0 "A indústria cinematográfica da Índia, centrada em Mumbai, é a maior do mundo em produção. Seu alcance cultural se estende pelo Sul da Ásia, pelo Oriente Médio e pela diáspora indiana global, servindo como um poderoso veículo de projeção de poder brando."
 RAJ_settle_gujarat_unrest:0 "Resolver a Agitação em Guzerate"
 RAJ_settle_gujarat_unrest_desc:0 "Direcionar recursos do Estado para aliviar as tensões comunitárias em Guzerate e restaurar a ordem, sem esperar por um governo específico em Délhi. Isso aumenta a opinião tanto de hindus quanto de muçulmanos. Quando ambas se recuperarem para 35 ou mais, a agitação em Guzerate cessa por conta própria, e manter a opinião deles mais alta mantém a região calma."
 RAJ_kashmir_unrest:0 "Agitação na Caxemira"
 RAJ_kashmir_unrest_desc:0 "A Caxemira continua inquieta enquanto sua maioria muçulmana se sente alienada de Délhi. Até que suas queixas sejam atendidas, as operações de segurança minam o moral e a estabilidade em todo o vale. Elevar a opinião muçulmana acima de 35 por meio da decisão de apaziguamento, do diálogo inter-religioso e dos focos regionais encerra essa agitação."
 RAJ_punjab_unrest:0 "Agitação em Punjab"
 RAJ_punjab_unrest_desc:0 "O ressentimento persistente dos sikhs mantém Punjab à beira do abismo, drenando capital político e estabilidade. Resolver as preocupações da comunidade é o único caminho de volta à calma. Elevar a opinião sikh acima de 35 por meio da decisão de apaziguamento, do diálogo inter-religioso e dos focos regionais encerra essa agitação."
 RAJ_bengal_unrest:0 "Agitação em Bengala"
 RAJ_bengal_unrest_desc:0 "O atrito comunitário com a população muçulmana de Bengala perturba a indústria e a ordem da região. A agitação persiste até que sua fé seja reconciliada com o Estado. Elevar a opinião muçulmana acima de 35 por meio da decisão de apaziguamento, do diálogo inter-religioso e dos focos regionais encerra essa agitação."
 RAJ_northeast_unrest:0 "Agitação no Nordeste"
 RAJ_northeast_unrest_desc:0 "As comunidades cristãs de todo o Nordeste desconfiam do governo central, alimentando o sentimento separatista. O recrutamento e a estabilidade sofrem até que suas queixas sejam amenizadas. Elevar a opinião cristã acima de 35 por meio da decisão de apaziguamento, do diálogo inter-religioso e dos focos regionais encerra essa agitação."
 RAJ_new_army_idea_desc:0 "Um amplo programa de modernização reestruturou as Forças Armadas Indianas em torno de novos princípios doutrinários, melhorando os canais de recrutamento, a coordenação operacional e a prontidão de combate em todos os ramos."
 RAJ_BRICS_desc:0 "A adesão ao BRICS abre laços comerciais e políticos com o bloco, acelerando uma modesta cooperação em pesquisa e dando aos negociadores indianos uma posição mais forte à mesa junto aos demais membros."
 RAJ_BRICS_associate:0 "Associado ao BRICS"
 RAJ_BRICS_associate_desc:0 "O status de associado vincula a nação ao comércio e à pesquisa do BRICS sem adesão plena, concedendo benefícios reduzidos do bloco e deixando a porta aberta para uma promoção."
 RAJ_BRICS_observer:0 "Observador do BRICS"
 RAJ_BRICS_observer_desc:0 "O status de observador mantém a nação engajada na diplomacia do BRICS e aquece suas relações comerciais com o bloco, um primeiro passo rumo a uma integração mais profunda."
 RAJ_brics_leadership_TT:0 "Como líder do BRICS, a Índia obtém influência política e boa vontade comercial que crescem à medida que mais nações aderem ao bloco."
 RAJ_BRICS_bank_desc:0 "O Novo Banco de Desenvolvimento canaliza empréstimos dos Estados-membros para projetos estratégicos de recursos e indústria, elevando a produção local de recursos e a produção das fábricas. O custo é a exposição: potências estrangeiras ganham influência sobre nossas decisões financeiras."
 RAJ_BRICS_cur_desc:0 "Coordenar a política monetária com o bloco reduz nossos custos de financiamento e melhora os termos de comércio com os membros, mas o gasto inicial para reestruturar nossos ciclos econômicos é alto e o novo arranjo eleva os custos contínuos de melhoria de ciclos."
 RAJ_steady_elephant:0 "O Elefante Constante"
 RAJ_steady_elephant_desc:0 "A Índia deve avançar com o peso deliberado e imparável de um elefante: paciente, inamovível quando desafiada e decisiva quando provocada. Um Estado forte e independente exige esse ideal de caráter nacional."
 RAJ_iri_fake_ns2_desc:0 "Auditorias de compras e uma reformulação parcial do ministério da defesa começaram a surtir efeito. A capacidade desperdiçada e os custos inflados de conversão continuam pesados, mas o pior das distorções da era do License Raj começa a diminuir."
 RAJ_iri_fake_ns3_desc:0 "As reformas eliminaram burocracia suficiente para que as fábricas de defesa operem com eficiência aceitável. Converter linhas de produção civis já não é proibitivamente caro, embora bolsões de clientelismo ainda distorçam os resultados."
 RAJ_iri_fake_ns4_desc:0 "Um regime moderno de compras, contratos transparentes e uma séria fiscalização anticorrupção transformaram a indústria de defesa em um setor competitivo. As ineficiências agora são administráveis, e não paralisantes."
 RAJ_re_fake_militar2_desc:0 "Cadeias de comando reestruturadas e ferramentas de coordenação modernizadas estabilizaram grande parte da força. O entrincheiramento defensivo e a disciplina de movimento estão melhorando, embora a organização sob fogo ainda fique atrás de exércitos pares."
 RAJ_re_fake_militar3_desc:0 "As reformas doutrinárias e a integração do estado-maior conjunto fecharam em grande parte a distância em relação a forças armadas comparáveis. A maioria das unidades agora opera com coesão previsível em campo."
 RAJ_re_fake_militar4_desc:0 "Uma geração de profissionalização deu frutos. As forças indianas agora operam com coordenação moderna, manobras disciplinadas e a doutrina de entrincheiramento de uma força armada de primeira linha."
 RAJ_industrial_expansion: "Industrial Expansion"
 RAJ_industrial_expansion_desc: "Investing in heavy industry and manufacturing capacity will modernize our economy and create jobs across the nation."
 RAJ_agrarian_society_desc: "Strengthening our agricultural sector ensures food security and supports the rural communities that form the backbone of our nation."
 RAJ_expanding_at_calcutta:0 "Expansão em Calcutá"
 RAJ_expanding_at_calcutta_desc:0 "Com o aumento da população, somos confrontados com o fato de que Calcutá precisa se expandir. Buscamos inspiração nas políticas de expansão permanente vistas em outras grandes cidades."
 RAJ_standard_rationing:0 "Racionamento Padrão e Reforma Agrária"
 RAJ_standard_rationing_desc:0 "As reformas de racionamento de terra e alimentos modernizam a agricultura, mas abalam as estruturas tradicionais de poder."
 RAJ_indian_air_force: "Indian Air Force"
 RAJ_indian_air_force_desc: "Modernize the Indian Air Force and expand its combat training, building the experienced aircrews needed to command our airspace."
 RAJ_NAJA_idea_1_desc:0 "Forças paramilitares e policiais equipadas com armas e treinamento de nível militar, mobilizadas para manter a segurança interna e combater ameaças insurgentes em regiões propensas a conflitos."
 RAJ_network_centric_warfare:0 "Guerra Centrada em Redes"
 RAJ_network_centric_warfare_desc:0 "A guerra centrada em redes, também chamada de operações centradas em redes, é uma doutrina ou teoria militar que busca converter uma vantagem de informação, possibilitada em parte pela tecnologia da informação, em vantagem competitiva por meio da interligação em rede de forças dispersas."
 RAJ_interfaith_dialogue:0 "Convocar Diálogo Inter-Religioso"
 RAJ_interfaith_dialogue_desc:0 "Financiar um programa nacional de reconciliação duradouro que traga todas as fés à mesma mesa. Eleva a opinião de todas as comunidades ao mesmo tempo, sem deixar nenhum grupo ressentido, mas o esforço é lento e pesa muito no tesouro."
 RAJ_religion_conflict_musl_hindu_title:0 "Eclode Violência Hindu-Muçulmana"
 RAJ_religion_conflict_musl_hindu_desc:0 "Em uma das maiores e mais densamente povoadas cidades, um grupo de hindus e muçulmanos começou a brigar por uma disputa desconhecida. O que se sabe, porém, é que ambos os lados estão se despedaçando ativamente, e isso está pesando seriamente sobre a força policial local."
 RAJ_religion_conflict_musl_christ_title:0 "Muçulmanos e Cristãos em Conflito"
 RAJ_religion_conflict_musl_christ_desc:0 "Um grupo de muçulmanos e cristãos está em conflito hoje por causa da construção de uma igreja perto de uma mesquita. Ambos os lados afirmam que o outro deve mudar seu local de culto para outro ponto da cidade, e há até relatos de pequenas escaramuças por toda a cidade."
 RAJ_religion_conflict_hindu_christ_title:0 "Hindus e Cristãos se Enfrentam"
 RAJ_religion_conflict_hindu_christ_desc:0 "Esta manhã, um grupo de hindus ficou indignado com um cristão que insultou um hindu que ele tentava converter. O incidente degenerou em combates abertos entre os dois grupos, com vários prédios incendiados."
 RAJ_religion_conflict_back_hindu:0 "Apoiar os Hindus"
 RAJ_religion_conflict_back_muslim:0 "Apoiar os Muçulmanos"
 RAJ_religion_conflict_back_christian:0 "Apoiar os Cristãos"
 RAJ_religion_conflict_resolve:0 "Encontrar uma solução que agrade a ambos os lados"
 RAJ_drdo_idea_desc:0 "A Organização de Pesquisa e Desenvolvimento de Defesa canaliza a P&D nacional para as forças armadas, acelerando a pesquisa militar, reduzindo o custo de converter capacidade civil em produção militar e levando a IA a favorecer avanços militares."
 RAJ_indian_national_congress_desc: "The Indian National Congress has been a dominant force in Indian politics since independence. Strengthening the party apparatus will consolidate democratic governance."
 RAJ_indian_socialism_idea_desc:0 "O legado de economia mista de Nehru impõe forte direção estatal sobre a produção industrial, a fabricação de armamentos e a infraestrutura. A produtividade das fábricas dispara, mas a coesão social sofre com a rigidez do permit-raj."
 RAJ_scandinavian_model_idea_desc:0 "Modelos de política social-democrata importados reduzem os custos de educação e estabilizam a ordem política, ao preço de uma burocracia inflada e de um clima público mais calmo e menos militarizado."
 RAJ_true_social_democracy_idea_desc:0 "Um acordo maduro de Estado de bem-estar reduz os custos sociais e de saúde, elevando o apoio à guerra por meio de uma competência estatal visível. Os custos de pessoal sobem e a estabilidade política cai levemente sob o peso da redistribuição."
 RAJ_new_democratic_india_idea_desc:0 "Um compromisso reafirmado com as normas democráticas eleva a estabilidade, acelera a geração de poder político e reforça a deriva democrática na opinião interna."
 RAJ_vietnamese_intervention:0 "Questionar a Independência do Vietnã"
 RAJ_demand_singapore:0 "Exigir Singapura"
 RAJ_demand_singapore_desc:0 "Com nossa posição regional garantida, chegou a hora de pressionar nossa reivindicação histórica sobre Singapura e trazer a cidade-Estado para nossa esfera."
 RAJ_arms_export_economy:0 "Economia de Exportação de Armas"
 RAJ_brics_leadership:0 "Liderança do BRICS"
 RAJ_religious_climate:0 "Clima Religioso"
 RAJ_country_has_any_naxalite_states:0 "Um estado na Índia tem presença naxalita ativa"
 RAJ_has_severe_naxalite_states_trigger:0 "Um estado da Índia tem presença naxalita grave"
 RAJ_state_has_any_naxalite:0 "Este estado tem presença naxalita ativa"
 RAJ_country_has_any_naxalite_states_TT:0 "Qualquer estado tem presença naxalita ativa"
 RAJ_has_severe_naxalite_states_trigger_TT:0 "Qualquer estado tem presença naxalita grave e ativa"
 RAJ_hindu_discontent:0 "Descontentamento Hindu"
 RAJ_hindu_discontent_desc:0 "A maioria hindu está cada vez mais insatisfeita com as políticas do governo. Por ser o maior grupo demográfico, seu descontentamento ameaça a estabilidade política e corrói a base de apoio do governo. Elevar a opinião hindu acima de §Y35§! o encerra."
 RAJ_religious_harmony:0 "Harmonia Religiosa"
 RAJ_religious_harmony_desc:0 "Todas as principais comunidades religiosas da Índia têm uma opinião favorável do governo. Essa harmonia inter-religiosa fortalece a unidade nacional e atrai investimentos. Mantida enquanto todas as fés estiverem acima de §Y74§!."
 RAJ_religious_climate_TT:0 "§YClima Religioso§!: A Estabilidade e o Poder Político variam conforme a opinião média das cinco fés. Cada ponto acima de §Y50§! vale §G+0,4%§! para cada um, cada ponto abaixo custa o mesmo, limitado a §G+10%§! e §R-10%§!."
 RAJ_settle_gujarat_unrest_TT:0 "A Opinião §YMuçulmana§! de [RAJ.GetNameWithFlag] é superior a 50\nA Opinião §YHindu§! de [RAJ.GetNameWithFlag] é superior a 50."
 RAJ_maoist_suppression:0 "Fazer Batida contra Maoístas em [FROM.GetName]"
 RAJ_suppression_failed_tt:0 "§RA batida fracassou.§! Simpatizantes maoístas se unem em torno da operação malsucedida, aumentando o apoio comunista."
 RAJ_delhi_caliphate:0 "Declarar o Califado de Délhi"
 RAJ_delhi_caliphate_desc:0 "O movimento salafista toma o aparato do Estado e proclama um califado sediado em Délhi, encerrando a república constitucional e submetendo o novo governo à lei islâmica."
 RAJ_iran_doctrinal_dispute:0 "Confrontar a Doutrina Iraniana"
 RAJ_iran_doctrinal_dispute_desc:0 "A doutrina revolucionária xiita de Teerã é uma rival ideológica direta do projeto salafista sunita. Confrontar a influência regional do Irã é agora uma prioridade estratégica."
 RAJ_MAO_rebellion_armed:0 "Conflito Armado Iminente"
 RAJ_MAO_rebellion_armed_desc:0 "A insurgência maoísta escalou além das manifestações. Células armadas estão se mobilizando para uma guerra aberta contra o governo. Se nada for feito, a guerra civil é inevitável."
 RAJ_central_asian_revolution:0 "Revolução Salafista em [FROM.GetName]"
 RAJ_central_asian_revolution_desc:0 "As condições em [FROM.GetNameDefCap] estão maduras para um levante salafista. Canalize nossa influência para o movimento fascista local e desencadeie uma revolução armada para trazer o país à nossa esfera."
 RAJ_BRICS_polit_alliance_faction_warning_tt:0 "§RAviso:§! isto §Rdesmantelará sua facção atual§! e a substituirá por uma nova facção BRICS. Quaisquer membros não pertencentes ao BRICS que você tenha convidado serão §Rrejeitados§!."
 RAJ_arms_export_economy_TT:0 "§YEconomias de Escala na Exportação de Armas§!\nCada parceiro de exportação distinto eleva a §Gcapacidade industrial§! à medida que a indústria de armas ganha escala: §G+1%§! de produção de fábricas por parceiro."
 RAJ_energy_idea_desc:0 "O investimento em energia nuclear doméstica amplia a capacidade de geração e reduz nossa dependência de combustível importado."
 RAJ_207_sd_idea_desc:0 "O Tata Indica, primeiro carro de passeio totalmente indígena da Índia, ancora um setor automotivo doméstico que acelera a construção de edifícios e a ampliação das fábricas, gera receita de imposto corporativo e dá um modesto impulso à estabilidade política e ao crescimento populacional."
 RAJ_network_improvement_idea_desc:0 "A modernização da infraestrutura nacional de telecomunicações acelera a implantação de redes digitais em todo o país."
 RAJ_socdem_stability_factor:0 "Fator de Estabilidade"
 RAJ_Local_markets_desc:0 "Os bazares locais e o comércio de rua prosperam, acelerando a construção de pequenos edifícios em todo o país."
 TT_RAJ_LOCAL_MARKETS_MODIFIER:0 "§YRenda Adicional§!: $§G0.080§!"
 indian_event.61.t:0 "Atentados a Trens de Mumbai"
 indian_event.61.d:0 "Em 11 de julho de 2006, uma série de sete explosões coordenadas atingiu a rede ferroviária suburbana de Mumbai na hora do rush da tarde, matando 209 pessoas e ferindo mais de 700. Os ataques, realizados pelo Lashkar-e-Taiba com apoio local, miraram a artéria vital da cidade e abalaram todo o país."
 indian_event.61.a:0 "Isto é um ato de guerra."
 RAJ_naxal.19.t:0 "Emboscada no Vale de Darbha"
 RAJ_naxal.19.d:0 "Em 25 de maio de 2013, insurgentes naxalitas emboscaram um comboio do Congresso Nacional Indiano no Vale de Darbha, em Chhattisgarh, matando 27 pessoas, incluindo líderes estaduais de alto escalão e sua escolta. O ataque expôs lacunas críticas de inteligência e de segurança de rotas no Corredor Vermelho."
 RAJ_naxal.19.a:0 "A insurgência deve ser esmagada."
 indian_event.62.t:0 "Ataque à Base de Uri"
 indian_event.62.d:0 "Em 18 de setembro de 2016, quatro militantes atacaram o quartel-general de uma brigada do Exército Indiano perto de Uri, em Jammu e Caxemira, matando 19 soldados e ferindo outros 30. O ataque, um dos mais mortais contra forças de segurança na Caxemira, provocou amplos pedidos de retaliação."
 indian_event.62.a:0 "Eles vão pagar por isso."
 indian_event.63.t:0 "Desmonetização Anunciada"
 indian_event.63.d:0 "Em 8 de novembro de 2016, o governo anunciou abruptamente a desmonetização das notas de 500 e 1000 rupias, tornando inválido da noite para o dia 86% do dinheiro em circulação no país. Embora visasse conter o dinheiro sujo e a moeda falsa, a medida causou enorme perturbação à vida cotidiana e à economia informal."
 indian_event.63.a:0 "Um sacrifício necessário."
 RAJ_eastas.6.t:0 "Impasse em Doklam"
 RAJ_eastas.6.d:0 "Em junho de 2017, tropas indianas e chinesas ficaram presas em um impasse de 73 dias na tríplice junção de Doklam, perto do Butão. As tentativas chinesas de estender uma estrada para território disputado foram bloqueadas pelas forças indianas, levando as duas potências nucleares à beira de um conflito armado no Himalaia."
 RAJ_eastas.6.a:0 "Não cederemos um centímetro."
 indian_event.64.t:0 "Atentado Terrorista de Pulwama"
 indian_event.64.d:0 "Em 14 de fevereiro de 2019, um homem-bomba do Jaish-e-Mohammed lançou um veículo carregado de explosivos contra um comboio da CRPF perto de Pulwama, na Caxemira, matando 40 militares. O ataque terrorista mais mortal contra forças de segurança em décadas provocou uma crise nacional e exigências de retribuição."
 indian_event.64.a:0 "Sangue exige sangue."
 indian_event.65.t:0 "Artigo 370 Revogado"
 indian_event.65.d:0 "Em 5 de agosto de 2019, o governo revogou o Artigo 370 da Constituição, retirando de Jammu e Caxemira seu status especial de autonomia e dividindo o estado em dois Territórios da União. A medida, acompanhada de um bloqueio de segurança e de um apagão nas comunicações, atraiu tanto elogios internos quanto preocupação internacional."
 indian_event.65.a:0 "A Caxemira está totalmente integrada."
 indian_event.66.t:0 "Eclodem os Protestos contra a CAA"
 indian_event.66.d:0 "Em dezembro de 2019, protestos generalizados eclodiram em todo o país contra a Lei de Emenda à Cidadania, que concede cidadania a refugiados não muçulmanos de países vizinhos, mas exclui os muçulmanos. Os manifestantes argumentam que a lei viola os princípios laicos da Constituição."
 indian_event.66.a:0 "Devemos ouvir o povo."
 RAJ_eastas.7.t:0 "Confronto no Vale de Galwan"
 RAJ_eastas.7.d:0 "Em 15 de junho de 2020, tropas indianas e chinesas travaram um brutal combate corpo a corpo no Vale de Galwan, em Ladakh, resultando na morte de 20 soldados indianos e em um número desconhecido de baixas chinesas. O confronto marca o primeiro embate fatal na fronteira entre os dois países desde 1975."
 RAJ_eastas.7.a:0 "Honraremos seu sacrifício."
 RAJ_naxal.20.t:0 "Emboscada de Bijapur"
 RAJ_naxal.20.d:0 "Em 3 de abril de 2021, insurgentes naxalitas emboscaram forças de segurança no distrito de Bijapur, em Chhattisgarh, matando 22 militares em um dos ataques mais mortais dos últimos anos. O incidente evidencia a ameaça persistente no Corredor Vermelho apesar de anos de operações de contrainsurgência."
 RAJ_naxal.20.a:0 "Eles não quebrarão nossa determinação."
 RAJ_naxal.21.t:0 "Suprema Corte Derruba o Salwa Judum"
 RAJ_naxal.21.d:0 "Em 5 de julho de 2011, a Suprema Corte da Índia declarou o Salwa Judum inconstitucional, ordenando o desarmamento imediato da milícia tribal patrocinada pelo Estado. O tribunal concluiu que armar civis mal treinados para combater os maoístas violava direitos fundamentais e alimentava o próprio ciclo de violência que deveria reprimir. Críticos internos e órgãos internacionais de direitos humanos acompanham Nova Délhi de perto."
 RAJ_naxal.21.a:0 "Cumpriremos a decisão."
 RAJ_human_rights_scrutiny:0 "Escrutínio de Direitos Humanos"
 RAJ_human_rights_scrutiny_desc:0 "Organizações internacionais de direitos humanos e a imprensa nacional estão examinando a conduta da contrainsurgência. A estabilidade e o capital político sofrem, e os serviços de inteligência estrangeiros veem a Índia como um alvo mais fácil enquanto durar a atenção dos holofotes."
 indian_event.67.t:0 "Manipur Explode em Violência"
 indian_event.67.d:0 "Em maio de 2023, a violência étnica explodiu em Manipur entre as comunidades meitei e kuki, desencadeando meses de confrontos, incêndios criminosos e deslocamentos. A crise, enraizada em direitos de terra, status de reserva de cotas e linhas de falha religiosas, expôs profundas fraturas no estado do nordeste."
 indian_event.67.a:0 "Devemos restaurar a ordem."
 RAJ_regional.1.t:0 "Ataque Transfronteiriço"
 RAJ_regional.1.d:0 "Em 9 de junho de 2015, o Exército Indiano lançou ataques cirúrgicos através da fronteira com Mianmar, destruindo acampamentos do NSCN-K responsáveis por uma emboscada que matou 18 soldados no distrito de Chandel, em Manipur. A operação marca o primeiro ataque transfronteiriço reconhecido da Índia contra santuários insurgentes."
 RAJ_regional.1.a:0 "Eles mereciam."
 RAJ_regional.2.t:0 "Troca de Enclaves com Bangladesh"
 RAJ_regional.2.d:0 "Em 6 de junho de 2015, a Índia e Bangladesh trocaram 162 enclaves em um acordo histórico que encerrou uma disputa de fronteira de 68 anos. Mais de 50.000 moradores apátridas finalmente receberão cidadania."
 RAJ_regional.2.a:0 "Um dia histórico."
 RAJ_regional.3.t:0 "Crise dos Rohingya Chega à Índia"
 RAJ_regional.3.d:0 "Em agosto de 2017, a repressão militar de Mianmar empurrou mais de 700.000 rohingyas através da fronteira para Bangladesh. A Índia abriga 40.000 refugiados rohingyas, e o governo deve decidir se os acolhe ou os deporta."
 RAJ_regional.3.a:0 "Deportá-los todos."
 RAJ_regional.3.b:0 "Conceder-lhes refúgio."
 RAJ_regional.4.t:0 "Negociações do Teesta Fracassam"
 RAJ_regional.4.d:0 "Em abril de 2017, a primeira-ministra de Bangladesh, Hasina, chegou a Nova Délhi esperando fechar um acordo sobre a partilha das águas do rio Teesta. A ministra-chefe de Bengala Ocidental bloqueou o acordo mais uma vez, deixando Daca de mãos vazias."
 RAJ_regional.4.a:0 "Passar por cima da oposição estadual."
 RAJ_regional.4.b:0 "A política interna vem primeiro."
 RAJ_regional.5.t:0 "NRC Exclui Milhões"
 RAJ_regional.5.d:0 "Em agosto de 2019, o Registro Nacional de Cidadãos final em Assam excluiu 1,9 milhão de pessoas, a maioria muçulmanos bengalis. Somada à Lei de Emenda à Cidadania, a medida provocou protestos em todo o país e uma resposta furiosa de Daca."
 RAJ_regional.5.a:0 "A segurança nacional exige isso."
 RAJ_regional.6.t:0 "Campanha do Referendo de Khalistan"
 RAJ_regional.6.d:0 "Em 2020, a organização proibida Sikhs for Justice lançou um referendo global não vinculante pela independência, atraindo grande comparecimento entre a diáspora sikh. O movimento alimenta o sentimento separatista dentro do país apesar da repressão do governo."
 RAJ_regional.6.a:0 "Esmagar este movimento."
 RAJ_regional.7.t:0 "Refugiados de Mianmar Inundam a Fronteira"
 RAJ_regional.7.d:0 "Após o golpe militar de fevereiro de 2021 em Mianmar, milhares de refugiados chin cruzaram para Mizoram e Manipur. O governo central ordenou que os estados os empurrassem de volta, mas o ministro-chefe de Mizoram desafia abertamente Nova Délhi."
 RAJ_regional.7.a:0 "Selar a fronteira."
 RAJ_regional.7.b:0 "Deixá-los passar."
 RAJ_regional.8.t:0 "Assinado o Acordo-Quadro de Paz Naga"
 RAJ_regional.8.d:0 "Em 3 de agosto de 2015, o governo assinou um acordo-quadro com o NSCN-IM após 18 anos de negociações. O pacto promete uma solução para uma das insurgências mais antigas da Ásia e um novo capítulo para o Nordeste."
 RAJ_regional.8.a:0 "Um passo rumo à paz duradoura."
 RAJ_regional.9.t:0 "Contrabando de Armas Transfronteiriço"
 RAJ_regional.9.d:0 "A inteligência descobriu uma rota ativa de armas que vai de Mianmar ao Corredor Vermelho do nordeste. Uma operação conjunta com Mianmar poderia desativá-la, mas exige recursos e capital diplomático."
 RAJ_regional.9.a:0 "Lançar uma operação conjunta."
 RAJ_regional.9.b:0 "Não podemos dispensar os recursos."
 RAJ_regional.10.t:0 "Crise do Assassinato de Nijjar"
 RAJ_regional.10.d:0 "Em junho de 2023, o líder khalistani Hardeep Singh Nijjar foi assassinado na Colúmbia Britânica. O primeiro-ministro do Canadá acusou publicamente a Índia de orquestrar o assassinato, desencadeando a pior crise diplomática entre os dois países em décadas."
 RAJ_regional.10.a:0 "Expulsar seus diplomatas."
 RAJ_regional.11.t:0 "Exercícios Navais na Baía de Bengala"
 RAJ_regional.11.d:0 "Em 2014, a Índia ampliou a cooperação marítima com Bangladesh e Mianmar por meio da estrutura do BIMSTEC, realizando patrulhas conjuntas e oferecendo corvetas às duas marinhas. A iniciativa consolida a Índia como a potência naval dominante na Baía de Bengala."
 RAJ_regional.11.a:0 "Projetar poder em nossas águas."
 RAJ_regional.12.t:0 "Mortes na Fronteira pela BSF"
 RAJ_regional.12.d:0 "A Força de Segurança de Fronteira da Índia foi novamente acusada de matar civis bengaleses ao longo da fronteira. Daca apresentou um protesto formal e grupos de direitos humanos exigem responsabilização."
 RAJ_regional.12.a:0 "Ordenar contenção."
 RAJ_regional.12.b:0 "A fronteira deve ser mantida."
 RAJ_regional.13.t:0 "Bloqueio da Fronteira com o Nepal"
 RAJ_regional.13.d:0 "Em setembro de 2015, após o Nepal adotar uma nova constituição que marginaliza a minoria madhesi, a Índia restringiu as remessas de combustível e suprimentos através da fronteira. O Nepal enfrenta uma crise humanitária com a aproximação do inverno, enquanto a China oferece rotas alternativas de abastecimento."
 RAJ_regional.13.a:0 "Apertar o bloqueio."
 RAJ_regional.13.b:0 "Aliviar as restrições."
 RAJ_regional.13.c:0 "Suspender o bloqueio."
 RAJ_regional.14.t:0 "Nepal Volta-se para a China"
 RAJ_regional.14.d:0 "Meses de suprimentos restritos devastaram a economia do Nepal. Katmandu assinou novos acordos de comércio e trânsito com Pequim, uma mudança dramática em um país há muito na órbita da Índia. O bloqueio tornou-se um exemplo de advertência sobre excesso de zelo."
 RAJ_regional.14.a:0 "O estrago está feito."
 RAJ_regional.14.b:0 "Estender um ramo de oliveira."
 RAJ_regional.14.c:0 "Nossa contenção valeu a pena."
 RAJ_regional.15.t:0 "Disputa de Fronteira em Kalapani"
 RAJ_regional.15.d:0 "Em maio de 2020, o parlamento do Nepal aprovou por unanimidade uma emenda constitucional reivindicando Kalapani, Lipulekh e Limpiyadhura. A tríplice junção disputada fica na fronteira entre Índia, Nepal e China, e o envio de tropas pode agravar as tensões em toda a fronteira do Himalaia."
 RAJ_regional.15.a:0 "Reforçar nossas posições."
 RAJ_regional.15.b:0 "Propor negociações."
 RAJ_regional.15.c:0 "Aceitar uma vistoria conjunta."
 RAJ_regional.16.t:0 "Tratado de 1950 em Revisão"
 RAJ_regional.16.d:0 "O Nepal propôs formalmente revisar o Tratado de Paz e Amizade de 1950, chamando-o de relíquia desigual. O tratado sustenta a influência da Índia sobre a política externa e de defesa do Nepal, e uma renegociação poderia remodelar a relação bilateral."
 RAJ_regional.16.a:0 "Modernizar a parceria."
 RAJ_regional.16.b:0 "O tratado permanece."
 RAJ_regional.17.t:0 "Butão Agradece à Índia"
 RAJ_regional.17.d:0 "Após a resolução do impasse em Doklam, o Butão expressou em particular profunda gratidão pela disposição da Índia de enfrentar a China em seu território soberano. Timbu está ansiosa para formalizar laços de defesa mais fortes."
 RAJ_regional.17.a:0 "Aprofundar a aliança."
 RAJ_regional.17.b:0 "Um aperto de mão basta."
 RAJ_regional.18.t:0 "Expansão Hidrelétrica no Butão"
 RAJ_regional.18.d:0 "O Projeto Hidrelétrico de Mangdechhu foi comissionado, adicionando 720 MW de capacidade. A Índia financia e constrói as represas do Butão e compra o excedente de eletricidade, ancorando uma das parcerias mais desiguais, porém estáveis, do Sul da Ásia."
 RAJ_regional.18.a:0 "Expandir a parceria."
 RAJ_regional.18.b:0 "Já temos compromissos suficientes."
 RAJ_regional.19.t:0 "Butão Abraça a Democracia"
 RAJ_regional.19.d:0 "Em março de 2008, o rei Jigme Singye Wangchuck supervisionou a transição pacífica do Butão da monarquia absoluta para a democracia constitucional. As primeiras eleições foram realizadas sem incidentes. O aliado mais próximo da Índia entra em uma nova era."
 RAJ_regional.19.a:0 "Dar-lhes boas-vindas à democracia."
 RAJ_regional.19.b:0 "Uma monarquia era mais simples."
 RAJ_regional.20.t:0 "O Bloqueio da Índia Faz Efeito"
 RAJ_regional.20.d:0 "O fechamento das passagens de fronteira pela Índia deixou o Nepal em grave escassez de combustível, remédios e gás de cozinha. Pequim ofereceu suprimentos de emergência e direitos de trânsito pelo Tibete. Katmandu enfrenta uma escolha severa entre o orgulho e o pragmatismo."
 RAJ_regional.20.a:0 "Aceitar a oferta da China."
 RAJ_regional.20.b:0 "Resistir e negociar."
 RAJ_regional.21.t:0 "Ottawa Exige Responsabilização"
 RAJ_regional.21.d:0 "O Canadá acusou formalmente a Índia de envolvimento no assassinato do líder sikh Hardeep Singh Nijjar em solo canadense. Ottawa avalia seu próximo passo, pois o impasse diplomático ameaça o comércio bilateral e a grande diáspora indo-canadense."
 RAJ_regional.21.a:0 "Expulsar diplomatas indianos."
 RAJ_regional.21.b:0 "Buscar uma solução diplomática."
 RAJ_regional.22.t:0 "Daca Condena as Expulsões de Rohingyas"
 RAJ_regional.22.d:0 "A Índia começou a deportar refugiados rohingyas de volta a Mianmar, atraindo forte condenação de Daca. Bangladesh, já sobrecarregado com mais de um milhão de refugiados de Mianmar, chamou a medida de traição às obrigações humanitárias compartilhadas."
 RAJ_regional.22.a:0 "Condenar a decisão de Nova Délhi."
 RAJ_regional.23.t:0 "Daca Acolhe a Solidariedade da Índia"
 RAJ_regional.23.d:0 "A decisão da Índia de abrigar os refugiados rohingyas em vez de expulsá-los foi calorosamente bem recebida em Daca. Bangladesh vê isso como um ato de genuína solidariedade em uma crise que pressionou todos os países da região."
 RAJ_regional.23.a:0 "Agradecemos a solidariedade da Índia."
 RAJ_regional.24.t:0 "Índia Reforça Kalapani"
 RAJ_regional.24.d:0 "Tropas indianas se moveram para reforçar posições na tríplice junção disputada de Kalapani-Lipulekh, dias depois de o parlamento do Nepal reivindicar o território por unanimidade. Katmandu deve decidir se iguala a postura militar da Índia ou busca uma saída diplomática."
 RAJ_regional.24.a:0 "Mobilizar nossas forças."
 RAJ_regional.24.b:0 "Protestar pela via diplomática."
 RAJ_regional.25.t:0 "Butão Pondera a Aliança com a Índia"
 RAJ_regional.25.d:0 "Na esteira do impasse em Doklam, a Índia aprofundou sua parceria de defesa com o Butão. Timbu é grata pela intervenção da Índia, mas ciente de que um alinhamento total poderia provocar ainda mais Pequim, que tem suas próprias reivindicações territoriais sobre o território butanês."
 RAJ_regional.25.a:0 "A Índia é nosso escudo."
 RAJ_regional.25.b:0 "Não devemos provocar a China."
 RAJ_regional.26.t:0 "Daca Assina o Acordo do Teesta"
 RAJ_regional.26.d:0 "Após anos de negociações travadas pelas objeções de Bengala Ocidental, a Índia finalmente superou a oposição interna e se ofereceu para assinar o acordo de partilha das águas do rio Teesta. O pacto é uma grande vitória diplomática para Bangladesh e pode transformar as relações bilaterais."
 RAJ_regional.26.a:0 "Assinar o acordo."
 RAJ_ladakh_crisis:0 "Crise Separatista em Ladakh"
 RAJ_ladakh_crisis_desc:0 "A opinião muçulmana em Ladakh caiu a níveis perigosamente baixos. Se não atendermos às suas queixas em breve, a região poderá declarar independência."
 RAJ_meghalaya_crisis:0 "Crise Separatista em Meghalaya"
 RAJ_meghalaya_crisis_desc:0 "A opinião cristã em Meghalaya caiu a níveis perigosamente baixos. Se não atendermos às suas queixas em breve, a região poderá declarar independência."
 RAJ_manipur_crisis:0 "Crise Separatista em Manipur"
 RAJ_manipur_crisis_desc:0 "A opinião cristã em Manipur caiu a níveis perigosamente baixos. Se não atendermos às suas queixas em breve, a região poderá declarar independência."
 RAJ_sikkim_crisis:0 "Crise Separatista em Sikkim"
 RAJ_sikkim_crisis_desc:0 "A opinião budista em Sikkim caiu a níveis perigosamente baixos. Se não atendermos às suas queixas em breve, a região poderá declarar independência."
 RAJ_punjab_crisis:0 "Crise Separatista em Punjab"
 RAJ_punjab_crisis_desc:0 "A opinião sikh em Punjab caiu a níveis perigosamente baixos. Se não atendermos às suas queixas em breve, a região poderá declarar independência."
