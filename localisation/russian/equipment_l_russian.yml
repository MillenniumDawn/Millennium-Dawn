 BUL_IFV_3: "БМП-23"
 CAN_APC_2: "LAV-I AVGP"
 CAN_APC_2_desc: "В 1974 году канадская армия выбрала швейцарскую машину Mowag Piranha 6x6. Производство автомобиля по лицензии взяла на себя канадская компания Diesel Division, подразделение General Motors of Canada."
 CAN_APC_2_short: "LAV-I AVGP"
 CAN_APC_3: "LAV-II Bison"
 CAN_APC_3_desc: "В 1988 году компании Diesel Division, подразделению General Motors of Canada, было поручено построить прототип колёсной бронемашины с колёсной формулой 8х8. Он был создан на базе шасси и двигателя лёгкой бронемашины (LAV). Канадская армия заказала модифицированный вариант транспортёра пехотного отделения под названием Bison."
 CAN_APC_3_short: "LAV-II Bison"
 CAN_APC_4: "LAV-III ISC"
 CAN_APC_4_desc: "Излишки корпусов LAV TUA, оснащенные дистанционно управляемыми боевыми модулями Nanuck, используются в качестве транспортеров пехотного отделения."
 CAN_APC_4_short: "LAV-III ISC"
 CAN_APC_5: "LAV-6 ACSV «Super Bison»"
 CAN_APC_5_desc: "Окончательная модернизация LAV III до стандарта LAV 6.0 с сохранением более высокой линии крыши для перевозки пехоты или грузов. Модернизация повысила защиту — улучшенная электроника, защита от СВУ и дополнительная броня — при сохранении дистанционно управляемого боевого модуля Protector с пулемётным вооружением."
 CAN_APC_5_short: "LAV-6 ACSV"
 CAN_MBT_1: "Centurion"
 CAN_MBT_1_short: "Centurion"
 CAN_MBT_1_desc: "Когда он впервые появился, дизайн танка Centurion был революционным, прокладывая путь для ранних моделей основных боевых танков. Разработанный и произведенный на завершающих этапах Второй мировой войны, Centurion начал служить только в послевоенные годы, но быстро стал ответом Запада на советские танки Т-54. До начала 1970-х годов танки Centurion составляли основу канадских танковых войск."
 CAN_MBT_2: "Leopard C1"
 CAN_MBT_2_desc: "Канада приобрела немецкий основной боевой танк Leopard в 1978 году. Всего было закуплено 127 танков, 114 из которых были «канадизированы» с учетом специфических местных требований на основе стандарта Leopard 1A3."
 CAN_MBT_2_short: "Leopard C1"
 CAN_MBT_3: "Leopard C2"
 CAN_MBT_3_desc: "Модернизированная версия Leopard C1. В основном танки были доведены до стандарта Leopard 1A5. Один взвод был дополнительно оснащён навесной бронёй и отправлен в Косово в 1999 году, а в 2006 году эскадрон получил модульную навесную броню MEXAS и противоосколочные подбои для использования в Афганистане."
 CAN_MBT_3_short: "Leopard C2"
 CAN_MBT_4: "Leopard 2A4M CAN"
 CAN_MBT_4_desc: "Leopard 2A4M CAN — модернизированная канадская версия Leopard 2A4. Танк представляет собой восстановленный Leopard 2A4, оснащённый пакетом противоминной защиты «M» и другими дополнительными улучшениями. Он успешно применялся для поддержки сил ISAF во время войны в Афганистане. Защита Leopard 2A4M CAN была дополнительно усилена навесной бронёй, напоминающей броню новейшего варианта Leopard 2A7+, но доработанной под конфигурацию башни 2A4, поскольку танк сохраняет 120-мм гладкоствольную пушку Rheinmetall L/44 базового варианта A4."
 CAN_MBT_4_short: "Leopard 2A4M CAN"
 CAN_MBT_5: "Leopard 2A6M CAN"
 CAN_MBT_5_desc: "Танк Leopard 2A6M CAN — канадский вариант танка Leopard 2A6. Значительные модификации включают противоминную броню днища, давшую танку обозначение «M»; характерные ящики песочного цвета на кормовой части башни, в которых размещены средства связи канадских вооружённых сил и аппаратура подавления СВУ (самодельных взрывных устройств), включая Т-образные антенные стойки; а также экранную решётчатую броню."
 CAN_MBT_5_short: "Leopard 2A6M CAN"
 CAN_IFV_1: "CTL Bobcat"
 CAN_IFV_1_desc: "Проект Bobcat начался в 1952 году как логичное продолжение работ по замене БТР Ram Kangaroo военного времени и исправлению недостатков этого переоборудованного танка. Концепция дорабатывалась в течение следующих четырёх лет, колеблясь между плавающим полностью бронированным транспортёром и модернизированной заменой транспортёра Universal Carrier."
 CAN_IFV_1_short: "CTL Bobcat"
 CAN_IFV_2: "Grizzly AVGP"
 CAN_IFV_2_desc: "В 1974 году канадская армия выбрала швейцарскую машину Mowag Piranha 6x6. Производство автомобиля по лицензии взяла на себя канадская компания Diesel Division, подразделение General Motors of Canada. Вариант Grizzly использовал 1-метровую башню Cadillac-Gage."
 CAN_IFV_2_short: "Grizzly AVGP"
 CAN_IFV_3: "LAV-III Kodiak"
 CAN_IFV_3_short: "LAV-III Kodiak"
 CAN_IFV_4: "LAV-III LORIT"
 CAN_IFV_4_desc: "Модернизированная версия LAV III с новыми турелями и электроникой, повышенной защитой от СВУ и дополнительной броней, выполненная в рамках задачи по интеграции оперативных требований LAV (LORIT)."
 CAN_IFV_4_short: "LAV-III LORIT"
 CAN_IFV_5: "LAV-6 IFV"
 CAN_IFV_5_desc: "Окончательное обновление LAV III до стандартов LAV 6.0. Модернизации повысили защиту, включая новые башни, улучшенную электронику, повышенную защиту от СВУ и дополнительную броню при использовании башни, вооруженной 25-мм цепной пушкой и спаренным пулеметом, аналогично оригинальному LAV III."
 CAN_IFV_5_short: "LAV-6 IFV"
