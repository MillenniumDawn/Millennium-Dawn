 AFG_secure_border_with_pakistan_tt: "\nEn construisant des fortifications par mesure de sécurité le long de la frontière afghano-pakistanaise, l'efficacité de l'infiltration des £GFX_AFG_salafist_jihadism §RTalibans§! §Gdiminuera§!!. La construction commencera en premier lieu en Afghanistan §Ycentral§! dû à sa signification politique, puis continuera d'Afghanistan §Yinférieur§! jusqu'en Afghanistan §Ysupérieur§!\n"
