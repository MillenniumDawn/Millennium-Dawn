 GCC_expel_desc: "[FROM.GetNameDef]에서 정권을 잡은 새 정부는 GCC에 위협이 되므로 이 조직의 일원으로 남아 있도록 허용해서는 안 됩니다."
 GCC_leadership: "§YReplace§! §Y[FROM.GetFlag][FROM.GetNameDef]§! as Leader of the GCC"
 GCC_leadership_desc: "GCC에는 공식적인 위계질서가 없지만, [FROM.GetNameDef]의 우월한 역량과 지역적 영향력으로 인해 역사적으로 GCC를 지배해 왔습니다. 그러나 이제 우리의 역량이 그들을 능가했으므로, GCC의 수장 자리를 되찾을 때가 되었습니다."
