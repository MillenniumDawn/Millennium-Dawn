l_simp_chinese:
 FYR_political.1.t: "西北地区的叛乱"
 FYR_political.1.d: "自称“民族解放军”的阿尔巴尼亚族武装分子占领了边境村庄塔努舍夫齐，与安全部队的交火正蔓延至泰托沃方向。斯科普里担心，上世纪九十年代马其顿幸免于难的那场战争最终还是降临了。"
 FYR_political.1.a: "寻求国际调解"
 FYR_political.1.b: "粉碎叛乱"
 FYR_political.2.t: "奥赫里德框架协议"
 FYR_political.2.d: "在西方斡旋下，阿尔巴尼亚政府和各政党领导人在奥赫里德签署了一项框架协议。根据协议，在少数族裔人口超过五分之一的市镇，阿尔巴尼亚语将获得官方语言地位；警务工作将下放；叛乱分子将在特赦令下向北约收缴者上缴武器。"
 FYR_political.2.a: "权力共享胜于战争"
 FYR_political.3.t: "普雷斯帕协议"
 FYR_political.3.d: "在普雷斯帕湖畔，斯科普里和雅典的谈判代表草签了一项协议，以结束这场持续数十年的国名争端。根据协议，该国将更名为北马其顿共和国，而希腊则将解除对北马其顿加入北约和加入欧盟谈判的否决权。"
 FYR_political.3.a: "签署协议，走上欧洲-大西洋之路"
 FYR_political.3.b: "我们不会更改国名"