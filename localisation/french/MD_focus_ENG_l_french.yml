 ENG_auxiliary_navy1: "Marine royale auxiliaire"
 ENG_auxiliary_navy1_desc: "Le concept de Royal Navy auxiliaire souligne l'importance du soutien civil aux opérations navales, mettant en lumière la collaboration entre militaires et civils pour assurer l'efficacité et la préparation de la Royal Navy dans l'exercice de ses responsabilités maritimes."
 ENG_auxiliary_navy2: "Marine royale auxiliaire"
 ENG_auxiliary_navy2_desc: "Le concept de Royal Navy auxiliaire souligne l'importance du soutien civil aux opérations navales, mettant en lumière la collaboration entre militaires et civils pour assurer l'efficacité et la préparation de la Royal Navy dans l'exercice de ses responsabilités maritimes."
 ENG_royal_army1: "Armée royale britannique"
 ENG_royal_army1_desc: "La British Army est la branche terrestre des forces armées britanniques, force militaire principale au sol du Royaume-Uni. Forte d'une histoire séculaire, elle est réputée pour son professionnalisme, son adaptabilité et son efficacité opérationnelle. Composée de soldats hautement entraînés issus d'horizons divers, elle est équipée pour un large éventail de missions : opérations de combat, maintien de la paix, secours aux sinistrés et aide humanitaire."
 ENG_royal_army2: "Armée royale britannique"
 ENG_royal_army2_desc: "La British Army est la branche terrestre des forces armées britanniques, force militaire principale au sol du Royaume-Uni. Forte d'une histoire séculaire, elle est réputée pour son professionnalisme, son adaptabilité et son efficacité opérationnelle. Composée de soldats hautement entraînés issus d'horizons divers, elle est équipée pour un large éventail de missions : opérations de combat, maintien de la paix, secours aux sinistrés et aide humanitaire."
 ENG_royal_army3: "Armée royale britannique"
 ENG_royal_army3_desc: "La British Army est la branche terrestre des forces armées britanniques, force militaire principale au sol du Royaume-Uni. Forte d'une histoire séculaire, elle est réputée pour son professionnalisme, son adaptabilité et son efficacité opérationnelle. Composée de soldats hautement entraînés issus d'horizons divers, elle est équipée pour un large éventail de missions : opérations de combat, maintien de la paix, secours aux sinistrés et aide humanitaire."
 ENG_royal_airforce1: "Les fantômes de la Royal Air Force"
 ENG_royal_airforce1_desc: "Malgré son histoire prestigieuse, la Royal Air Force (RAF) dépassée reflète une ère d'équipements vieillissants et de capacités limitées. Entravee par des appareils obsolètes et des modernisations insuffisantes, cet esprit national symbolise les défis du maintien de la supériorité aérienne avec une technologie datée. Pourtant, au milieu de ces contraintes, l'héritage de la RAF perdure, inspirant résilience et détermination à s'adapter et à surmonter."
 ENG_royal_airforce2: "Moderniser la Royal Air Force"
 ENG_royal_airforce2_desc: "La Royal Air Force en modernisation incarne un tournant stratégique vers la revitalisation de la puissance aérienne par des efforts de modernisation complets. Avec l'accent mis sur la modernisation des appareils, le renforcement des capacités technologiques et l'investissement dans des systèmes de pointe, cet esprit national reflète une approche proactive pour que la RAF reste à l'avant-garde de la supériorité aérienne dans un espace de bataille en évolution."
 ENG_royal_airforce3: "Royal Air Force modernisée"
 ENG_royal_airforce3_desc: "Centrée sur la supériorité aérienne et la réaction rapide, la Royal Air Force modernisée représente une force formidable, équipée de chasseurs de pointe et de capacités de combat avancées. Avec des chasseurs agiles capables de dominer le ciel et d'engager l'adversaire avec une vitesse et une précision inégalées, cet esprit national illustre l'engagement de la RAF à maintenir la supériorité aérienne et à défendre les intérêts nationaux."
 ENG_royal_airforce4: "Royal Air Force modernisée"
 ENG_royal_airforce4_desc: "La Royal Air Force modernisée inaugure une nouvelle ère de projection de puissance aérienne stratégique, caractérisée par des bombardiers de pointe et des frappes de précision. Avec des bombardiers avancés pour missions à longue portée et des munitions guidées, cet esprit national souligne la capacité de la RAF à porter des frappes décisives et précises contre des cibles de haute valeur, projetant la puissance et dissuadant l'adversaire."
 ENG_royal_airforce5: "Royal Air Force modernisée"
 ENG_royal_airforce5_desc: "La Royal Air Force modernisée inaugure une nouvelle ère de projection de puissance aérienne stratégique, caractérisée par des bombardiers de pointe et des frappes de précision. Avec des bombardiers avancés pour missions à longue portée et des munitions guidées, cet esprit national souligne la capacité de la RAF à porter des frappes décisives et précises contre des cibles de haute valeur, projetant la puissance et dissuadant l'adversaire."
 ENG_airbus_expansion: "Expansion d'Airbus"
 ENG_airbus_expansion_desc: "L'expansion d'Airbus souligne l'engagement de l'entreprise envers l'innovation, l'excellence et la satisfaction client, tout en contribuant au développement économique, à la création d'emplois et au progrès technologique de l'industrie aérospatiale britannique."
 ENG_homegrown_innovation: "Innovation locale"
 ENG_homegrown_innovation_desc: "Canaliser l'innovation nationale vise à favoriser une culture d'innovation et d'entrepreneuriat au sein des secteurs aérospatial et aéronautique du Royaume-Uni."
 ENG_homegrown_innovation_us1: "Collaboration d'innovation aérienne États-Unis–Royaume-Uni"
 ENG_homegrown_innovation_us1_desc: "Les États-Unis travaillent avec le Royaume-Uni pour innover dans l'armée de l'air"
 ENG_joint_strike_fighter_project_US1: "Collaboration d'innovation aérienne États-Unis–Royaume-Uni"
 ENG_joint_strike_fighter_project_US1_desc: "Les États-Unis travaillent avec le Royaume-Uni pour innover dans l'armée de l'air"
 ENG_trans_atlantic_defence: "Défense transatlantique"
 ENG_harmony_doctrine_idea: "Doctrine Harmony"
 ENG_harmony_doctrine_idea_desc: "La doctrine de l'Harmonie traite l'équilibre environnemental comme un intérêt national, alignant l'influence de la Couronne derrière la gérance des terres, de l'eau et de la résilience climatique. Elle pousse l'État et l'industrie vers une production durable, une énergie plus propre et une conservation de long terme sans sacrifier la stabilité. La Grande-Bretagne prospérera en vivant selon ses moyens, et le Palais insistera pour que la nature fasse partie de l'art de gouverner."
 ENG_abolish_devolution_TT: "Nous inverserons toutes les politiques de dévolution !\n - Cela déclenchera un soulèvement de [SCO.GetFlag] l'Écosse, [WAS.GetFlag] du pays de Galles et [NIR.GetFlag] de l'Irlande du Nord.\n - Le système de dévolution deviendra indisponible"
 ENG_annex_ireland_TT: "Nous pourrons intégrer [IRE.GetFlag] §Hl'Irlande§! via une décision !"
 ENG_still_can_TT: "§ONous pouvons encore former la Fédération du Commonwealth si nous les puppetisons par d'autres moyens !§!"
 ENG_declares_commonwealth_federation_TT: "Déclarera la §HFédération du Commonwealth§!\n - Nous §Hannecterons§! et §Hintégrerons§! les principaux sujets du Commonwealth\n- Notre drapeau et notre nom changeront"
 ENG_has_overthrown_current_system_TT: "A renversé le régime de Westminster"
 ENG_unlock_uniting_the_realm_decisions_TT: "£decision_icon_small §YDébloque§! les décisions Unir le Royaume\n - Ces décisions nous permettront d'attirer d'autres États du Commonwealth dans notre orbite"
 ENG_unlock_the_next_era_TT: "Transférera [IOM.GetFlag] l'île de Man aux [ADS.GetFlag] §HAlbionis Defense Forces§!\n - Ce sera un nouveau groupe de SMP sous notre contrôle direct\n - Nous pourrons les utiliser pour diviser l'OTAN en recrutant, corrompant et persuadant des chefs militaires, des politiciens et des civils dans les États de l'OTAN\n - Ils seront financés par notre budget et disposeront de leur propre armée professionnelle permanente"
 ENG_raid_enalbed_TT: "§HDébloque un nouveau raid§! : opération Delta Guard\n - Nous pourrons intervenir et saisir les champs pétroliers [NIG.GetFlag] nigérians autour du Delta\n £text_icon_kaldanger Si [NIG.GetFlag] le Nigeria riposte, nous pourrions avoir une guerre prolongée sur les bras"
 ENG_raid_enabled_2_TT: "§HUnlocks New Raid§!: Operation Safeguard\n - [ENG.GetFlag] British special forces units will be able to move in and oust the dictator of [ZIM.GetFlag] Zimbabwe, replacing him with a [ENG.GetFlag] British-backed strongman, giving us influence in [ZIM.GetName]"
 ENG_raid_enabled_3_TT: "§HDébloque un nouveau raid§! : opération Eastern Divide\n - Les unités de forces spéciales [ENG.GetFlag] britanniques pourront intervenir et s'emparer de la zone vitale du [EGY.GetFlag] Sinaï, facilitant l'accès portuaire britannique dans la région.\n - Le raid sera disponible sur le Sinaï"
