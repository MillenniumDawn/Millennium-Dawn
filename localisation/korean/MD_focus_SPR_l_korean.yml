 SPR_idea_maintenance_of_monuments: "기념물 보존"
 SPR_idea_maintenance_of_monuments_desc: "스페인에는 역사적 의의가 있는 장소가 수없이 많습니다. 이러한 역사 유적은 우리의 활기찬 민족 유산을 일깨워 줍니다. 이러한 보존 사업에 정부 예산을 배정하면 국민의 호감을 얻을 뿐만 아니라, 우리 행정부에 절실히 필요한 정치적 자본과 숨 돌릴 틈을 확보하여 중요한 법안을 통과시킬 수 있습니다."
 SPR_idea_unsettled_minorities: "불안한 소수 집단"
