 PMR_SP_Anti_Air_2_desc: "최대 8발의 미사일을 발사할 수 있는 이 기체는 접근하는 모든 항공기를 격추할 수 있습니다. 뿐만 아니라 자동포로 수송기도 파괴할 수 있습니다."
