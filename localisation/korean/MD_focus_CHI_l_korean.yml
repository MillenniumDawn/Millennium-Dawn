 CHI_TAI_goodwill_gesture: "양안 선의 표시"
 CHI_TAI_goodwill_gesture_desc: "재난 구호 제안부터 여행 및 관광 규정 완화에 이르기까지 타이베이에 공개적인 선의를 표시하여 양안 정서를 누그러뜨리고 상호 신뢰를 높입니다."
