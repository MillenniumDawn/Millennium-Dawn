 DIVISION_DIVISION: "Projektant brygady"
 DESIGNER_SELECT_NICHE_DELAYED: "W tym miejscu możesz klasyfikować swoje projekty, aby uporządkować je i umożliwić bardziej precyzyjne wzmacnianie swoich brygad."
 DESIGNER_COMPOSITION_DELAYED: "Skład brygady decyduje o tym, jakie premie od doradców i dowódców zostaną zastosowane."
 DESIGNER_COMBATWIDTH_TOOLTIP: "Rozpiętość bojowa: §Y$VALUE|0$§!\n\nSzerokość bojowa określa, ile miejsca dana brygada zajmie w trakcie walki.\nNa przykład, jeśli bitwa toczy się na froncie o łącznej szerokości §Y80§!, można na nim rozmieścić §Y4§! brygady o szerokości §Y20§! każda."
 DESIGNER_COMBATWIDTH_DESC: "Szerokość bojowa określa, ile miejsca dana brygada zajmie w trakcie walki.\nNa przykład, jeśli bitwa toczy się na froncie o łącznej szerokości §Y80§!, można na nim rozmieścić §Y4§! brygady o szerokości §Y20§! każda."
 DIVISION_PRODUCTION_RESOURCE_DESC: "§HZasoby§! wykorzystane do produkcji wyposażenia potrzebnego brygadzie o tym wzorcu."
 DIVISION_PRODUCTION_COST_DESC: "Koszt w jednostkach §Hpotencjału przemysłowego§! wymagany do wyprodukowania wyposażenia potrzebnego dla brygady o tym szablonie."
 DIVISION_NAMES_GROUP_DESC: "§HGrupa historycznych nazw jednostek.§!\nWszystkie brygady korzystające z tego szablonu będą używać nazw z tej puli. Jeśli teraz zmienisz grupę, wszystkie jednostki oparte na tym szablonie otrzymają nowe nazwy – z wyjątkiem tych, którym nazwy nadałeś samodzielnie."
 DESIGNER_DIVISIONAL_COMPOSITION: "Skład brygady"
 DESIGNER_MANPOWER_DESC: "Ile zasobów ludzkich potrzeba, aby skompletować tę brygadę."
 DESIGNER_TRAINING_TIME_DESC: "Ile czasu zajmuje wyszkolenie brygady."
 TECHNOLOGY_BATTALION_MODIFIERS_HEADER: "Modyfikatory Kompani:"
 DESIGNER_NEW_DIVISION: "Nowa Brygada"
 REGIMENT_WINDOW_DESC: "Wybierz opcję zmiany lub dodania plutonu"
 DESIGNER_BLOCKED: "Ten slot Kompani Liniowej jest §Rzablokowany§!"
 DESIGNER_ADD_FILL_REGIMENT: "§GCtrl + Kliknij§!, aby wypełnić resztę batalionu kopiami miejsca powyżej"
 DESIGNER_ADD_FILL_REGIMENT_FROM_PICK: "§GCtrl + Kliknij§!, aby wypełnić cały batalion wybraną kompanią"
 DESIGNER_ADD_COPY_LEFT_REGIMENT: "§GShift + Kliknij§!, aby dodać kopię pierwszej kompanii z batalionu po lewej stronie"
 DESIGNER_ADD_FILL_REGIMENT_FROM_LEFT: "§GCtrl + Shift + Kliknięcie§!, aby wypełnić batalion kopiami pierwszej kompanii z batalionu po lewej stronie"
 DESIGNER_REMOVE_REGIMENT: "§GCtrl + Kliknij§!, aby usunąć każdą kompanię w tym batalionie"
 DESIGNER_BLOCKED_REGIMENTAL_SUPPORT: "To miejsce na wsparcie batalionu jest §Rzablokowane§!"
 DESIGNER_BLOCKED_BY_REGIMENT_BATTALIONS: "§R- Wymaga co najmniej §!§H$NUM_BATTALIONS|H$ kompanii liniowych§!§R w batalionie.§!"
 DESIGNER_REGIMENT_SUPPORT_STATS_SCALED: "Statystyki, wyposażenie oraz liczebność zostały przeskalowane do $FACTOR|H%0$, ponieważ batalion składa się z $BATTALIONS|H$/$MAX_BATTALIONS|H$ kompanii."
 DESIGNER_MAIN_COLUMN_TITLE: "Komapnie liniowe to Twoje oddziały pierwszej linii.\n\nKażda kolumna stanowi batalion określonego typu podstawowego, takiego jak §YWojska Pancerne§!, §YPiechota§! czy §YWojska Zmotoryzowane§!. Typ jednostki umieszczony na samej górze determinuje, jakie inne elementy można dodać do danej kolumny batalionu. Im więcej posiadasz kompanii liniowych, tym większa jest §YSzerokość frontu§! i tym mniej takich brygad będziesz w stanie zmieścić w ramach jednej bitwy."
 EQUIPMENT_DESIGNER_SELECT_ROLE_DESC: "§HRola§! określa, które §HKompanie§! oraz §Hlutony Wsparcia§! są zaopatrywane w sprzęt tego typu."
 DESIGNER_SELECT_NICHE_DISABLED: "Brygada nie posiada jednostek pancernych"
 DESIGNER_NOT_ENOUGH_DIVISION_CAP: "Zmiana projektu spowodowałaby przekroczenie limitu dla brygady."
 NO_INTERSECTED_EQUIPMENT_DESC: "Ta modyfikacja spowoduje §RROZFORMOWANIE§! istniejących brygad korzystających z tego szablonu. Między zmodyfikowanym a oryginalnym szablonem nie występuje żadna wspólna pula wyposażenia."
 DIVISION_MODIFICATION_HEADER: "Ta zmiana szablonu będzie miała wpływ na $AMOUNT|H$ brygad."
 DIVISION_GARRISON_MODIFICATION_HEADER: "Ta zmiana szablonu wpłynie na $AMOUNT|H$ brygad oraz garnizon w $NUMGARRISON|H$ stanach."
 DIVISION_MODIFICATION_NEED_NOT_FILLED: "\t- $AMOUNT|H0$ dodatkowe $EQUIPMENT|H$ potrzebny do uzupełnienia brygad (§R$STOCK_AMOUNT|H0^$ dostępny§!)"
