 alg_deep_state.5.d: "Relatórios indicam que generais aposentados e oficiais de inteligência estão cada vez mais visíveis nos círculos políticos e econômicos. Sua influência vai muito além de suas funções oficiais.\n\n§YO estado profundo está estabelecendo suas redes.§!"
 alg_deep_state.10.d: "Elementos do DRS e de outros serviços de inteligência começaram a influenciar diretamente a política de Estado. Decisões importantes estão sendo tomadas sem a devida supervisão civil.\n\n§RIsso exige uma resposta.§!"
 alg_deep_state.15.d: "O establishment militar agora opera como um governo paralelo. Os ministros precisam cada vez mais da aprovação de generais de alta patente antes de implementar políticas importantes.\n\n§ROs poderosos de Le Pouvoir ficam mais fortes.§!"
 alg_deep_state.20.d: "O aparato de segurança agora exerce enorme influência sobre o Estado argelino. O estado profundo - 'le pouvoir' - tornou-se o verdadeiro poder por trás do trono. Os políticos civis são meros figurantes.\n\n§RCRÍTICO: O estado profundo controla a Argélia!§!"
 alg_deep_state.101.d: "Um enorme contrato de defesa, de bilhões, foi concedido em circunstâncias suspeitas. As evidências sugerem que altos oficiais militares receberam propinas significativas.\n\n§YComo respondemos?§!"
 alg_deep_state.102.d: "Os serviços de inteligência solicitaram formalmente poderes de vigilância ampliados, citando preocupações de segurança e a necessidade de combater o terrorismo e a interferência estrangeira.\n\n§YIsso aumentaria significativamente a influência deles.§!"
 alg_deep_state.103.d: "Um general proeminente e influente criticou publicamente a política do governo, pedindo 'liderança responsável' e 'prioridades de segurança nacional'. Trata-se de uma ameaça mal disfarçada à autoridade civil.\n\n§RIsso é um desafio direto!§!"
 alg_deep_state.104.d: "Figuras militares de alto escalão buscam expandir seus interesses empresariais para setores econômicos-chave. Argumentam que isso beneficiará a segurança nacional e o desenvolvimento."
 alg_deep_state.105.d: "O establishment militar está pressionando os principais veículos de mídia a adotar uma linha editorial mais favorável em questões de defesa e segurança."
 alg_deep_state.106.d: "Vários generais aposentados de alta patente manifestam interesse em entrar na política. Afirmam oferecer experiência e estabilidade."
 alg_deep_state.107.d: "Os comandantes militares provinciais detêm influência local significativa. A questão é se continuam leais ao governo civil ou às redes do estado profundo."
 alg_deep_state.108.d: "Diplomatas estrangeiros ofereceram discretamente ajuda para lidar com a crescente influência do estado profundo. Isso viria acompanhado de custos políticos e obrigações."
 alg_deep_state.200.d: "Tanques cercaram os edifícios do governo em Argel. Os militares anunciaram que estão assumindo o controle 'temporário' para 'restaurar a ordem, a estabilidade e a boa governança'.\n\n§RO EXÉRCITO TOMOU O PODER!§!\n\nO estado profundo se transformou em regime militar aberto."
 alg_deep_state.201.d: "Os militares tomaram o poder, mas ainda pode haver uma chance de resistir. Forças leais poderiam tentar restaurar o governo civil - mas isso é extremamente arriscado."
 alg_deep_state.210.d: "O governo militar agiu rapidamente para consolidar seu controle. Instituições-chave estão agora firmemente sob comando militar."
 alg_deep_state.211.d: "A comunidade internacional reagiu à tomada de poder pelos militares. Várias nações condenaram o golpe e pediram o retorno ao governo civil."
 alg_deep_state.220.d: "A hora chegou. Quando os militares tomaram o poder, prometeram realizar eleições e restaurar o governo civil em dois anos.\n\nEsse prazo chegou. O mundo está observando.\n\n§YOs generais cumprirão sua promessa?§!"
 alg_deep_state.5.a: "Devemos permanecer vigilantes."
 alg_deep_state.10.a: "Deixá-los operar - precisamos de estabilidade."
 alg_deep_state.10.b: "Reafirmar o controle civil imediatamente."
 alg_deep_state.15.a: "Aceitar a supervisão militar - resistir é inútil."
 alg_deep_state.15.b: "Reagir contra os generais!"
 alg_deep_state.20.a: "Os Generais detêm o poder real agora."
 alg_deep_state.101.a: "Fazer vista grossa - precisamos do apoio militar."
 alg_deep_state.101.b: "Abrir uma investigação."
 alg_deep_state.102.a: "Conceder poderes de vigilância ampliados."
 alg_deep_state.102.b: "Manter os limites constitucionais."
 alg_deep_state.103.a: "Recuar - não podemos nos dar ao luxo de um confronto."
 alg_deep_state.103.b: "Demitir o general imediatamente!"
 alg_deep_state.103.c: "Encontrar uma solução de compromisso."
