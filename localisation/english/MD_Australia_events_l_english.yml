sino_aus_peacekeeping_desc: "While only the beginning of such an initiative, the agreement sets the foundation for future peacekeeping operations in the Pacific. By cooperating in intelligence gathering, counter-terrorism and trade protection, we can continue to keep the oceans between us safe, and bridge the gap between our two nations."
