 JAP_japanese_economy_decisions: "The Entrenched Demand Shortfall"
 JAP_japanese_economy_decisions_desc: "Two decades of falling prices taught Japanese households and firms to wait. Wages sit flat, companies hoard cash rather than invest, and every yen of stimulus is saved instead of spent. The economy is not collapsing; it is simply refusing to move.\n\n§YWhat you can do§!\nThe decisions below are the demand levers. Announcing a price target, cutting consumption tax, transferring cash to households, funding public investment and pushing durable goods purchases each raise §YDemand Recovery Progress§!. The focuses of the demand branch raise it further, and §Y$JAP_improvement_private_investment_climate$§! adds to it directly.\n\n§YDemand Recovery Progress§!: [?JAP_demand_recovery_progress|0] / 100\n\n§GThresholds§!\n§G30§!: §Y$JAP_entrenched_demand_shortfall_idea_1$§! eases into §Y$JAP_entrenched_demand_shortfall_idea_2$§!.\n§G60§!: it eases again into §Y$JAP_entrenched_demand_shortfall_idea_3$§!.\n§G85§!: the spirit is removed and Japan's economic growth accelerates.\n\n§RWarning§!: this progress never decays, but nothing raises it on its own either. Take no decisions and Japan stays in the slump indefinitely."
 JAP_entrenched_demand_shortfall_idea_1: "Entrenched Demand Slump"
 JAP_entrenched_demand_shortfall_idea_1_desc: "Deflationary expectations and anxiety about the future are suppressing household spending, while firms hold back investment in the face of weak demand. Wages are stagnant, prices barely move, and no one wants to be the first to spend. Japan's economy is not collapsing, but it is being drained by paralysis.\n-------------\nYou can §Gmitigate§! the effects of this national spirit by using the decisions in §Y$JAP_japanese_economy_decisions$§! to raise §YDemand Recovery Progress§! to at least §G30§!!"
 JAP_entrenched_demand_shortfall_idea_2: "Sluggish Demand Recovery"
 JAP_entrenched_demand_shortfall_idea_2_desc: "Clearer price targets and support for households have pulled the economy away from its worst phase, but the recovery remains fragile. Consumption and investment are improving in places, yet not with enough force to lift the whole country. Demand is returning, but caution still hangs over the economy.\n-------------\nYou can §Gmitigate§! the effects of this national spirit by using the decisions in §Y$JAP_japanese_economy_decisions$§! to raise §YDemand Recovery Progress§! to at least §G60§!!"
 JAP_entrenched_demand_shortfall_idea_3: "Residual Demand Drag"
 JAP_entrenched_demand_shortfall_idea_3_desc: "Government measures to stimulate consumption have pushed the economy forward, but the caution left behind by years of stagnation remains deeply entrenched. Households and firms are moving more than before, yet a self-sustaining recovery still needs one final push. Japan's economy stands at the threshold of escaping stagnation, but it has not fully broken free yet.\n-------------\nYou can §Gremove§! this national spirit by using the decisions in §Y$JAP_japanese_economy_decisions$§! to raise §YDemand Recovery Progress§! to at least §G85§!!."
 JAP_zombie_companies: "Zombie Companies"
 JAP_zombie_companies_desc: "Years of forbearance have kept unprofitable, over-indebted firms alive on cheap credit, tying up capital, labour, and management that healthier industries need. Until these firms are restructured or wound down, construction, productivity, and corporate tax receipts all suffer.\n-------------\nRaising §YCorporate Restructuring Progress§! steadily de-escalates this national spirit until it is removed. See §Y$JAP_corporate_reform_category$§! for the current figures."
 #YKK Group (#2642)
 JAP_ykk_group: "The YKK Group"
 JAP_ykk_group_desc: "Yoshida Kogyo makes roughly half the zippers produced anywhere, some seven billion a year out of plants in more than seventy countries. The company mills its own brass, spins its own polyester, mixes its own dyes and builds the machines that assemble the finished slider, a vertical integration that leaves nothing about the product outside its control. Military procurement is a small share of that business and an exacting one, because the fastener on a plate carrier, a load-bearing vest or a camouflage smock is the first component to fail in the field. Japanese uniform and protective equipment programmes draw on a supplier that can revise a webbing, a coating or a corrosion-resistant alloy in-house rather than wait on a subcontractor."
 #Karoshi / Starting Spirit (#2582)
 JAP_karoshi_crisis: "The Karoshi Crisis"
 JAP_karoshi_crisis_desc: "Chronic overwork is grinding down Japan's workforce. Excessive unpaid overtime, the culture of 'service zangyo', drives stroke, heart failure, and suicide among salaried employees, while exhausted families put off having children. Stability, productivity, and research all suffer, healthcare and social spending climb, and the population edges downward year after year.\n-------------\nRaising §YWorker Wellbeing§! through the reform focuses steadily de-escalates this national spirit. While Japan's §Yzombie companies§! remain unresolved, every month's cultural gain is cut to §R75%§!. See §Y$JAP_corporate_reform_category$§! for the current figures."
 JAP_karoshi: "Karoshi"
 JAP_karoshi_desc: "The government names karoshi a national crisis: workers killed by overwork, by stroke and heart failure at the desk and by suicide after hundred-hour months. The death of the Dentsu employee Matsuri Takahashi forced it back onto the national agenda and cost the company's president his job. The state must now decide how far it will reach into the workplace to make work survivable."
 JAP_corporate_laws: "Reforming the Labour Standards Act"
 JAP_corporate_laws_desc: "The government takes the legislative road, closing the Article 36 loophole through the Work Style Reform Act and replacing saburoku agreements with hard ceilings enforced by a strengthened Labour Standards Inspectorate. Winning it means fighting employers and the flexible-hours lobby through every committee stage in the Diet. It is the most comprehensive of the three answers and the slowest to arrive."
 JAP_cultural_change: "Confronting the Culture of Overwork"
 JAP_cultural_change_desc: "The government campaigns on culture instead of statute: Premium Friday sends workers home early once a month, mental-health screening reaches the workplace, and the annual Karoshi White Paper keeps the dead visible to employers and recruiters alike. None of it touches the unspoken rule that the diligent leave only after the section chief does. This path wagers that Japan's relationship with work changes from below, one workplace and one household at a time."
 JAP_keiretsu_pact: "Bargaining with the Keiretsu"
 JAP_keiretsu_pact_desc: "The state negotiates directly with the enterprise groups and the Keidanren employers' federation: managed reform in exchange for stability, lifetime employment preserved, and the indebted firms sheltered from disruption. No legislation is passed and no company is named and shamed, because concession is traded for predictability. It is the slowest road to reform and the one that leaves corporate Japan least changed."
 #Karoshi: Corporate Laws path (#2585)
 JAP_overtime_cap: "The Article 36 Ceiling"
 JAP_overtime_cap_desc: "A saburoku agreement filed with the labour office turns the statutory forty-hour week into a suggestion, and the Work Style Reform Act closes the hole. Forty-five hours of overtime a month and three hundred and sixty a year become a legal ceiling, never beyond a hundred in a single month, with criminal penalties behind the numbers rather than administrative guidance. The figures track the karoshi line the Ministry of Health, Labour and Welfare uses when deciding whether a stroke or a suicide was caused by the job."
 JAP_mandatory_paid_leave: "Five Days a Worker Must Take"
 JAP_mandatory_paid_leave_desc: "The obligation is inverted: an employer granting ten or more days of leave must now ensure at least five of them are actually consumed, designating the dates itself if the worker will not. Japanese workers do not lack holiday so much as permission to use it, and barely half of granted leave is ever taken. The same amendment borrows the European work interval, eleven hours of rest between shifts, though only as a duty to make an effort."
 JAP_equal_pay_for_equal_work: "Equal Pay for Equal Work"
 JAP_equal_pay_for_equal_work_desc: "The Part-Time and Fixed-Term Employment Act forces employers to justify every difference in pay and benefit between regular and non-regular workers, or abolish it. Four in ten Japanese workers are non-regular, sitting at the same desks for a fraction of the hourly wage with no bonus, no retirement allowance, and no expectation of a job next spring. Firms lose the cheap labour buffer they have leaned on for decades, and millions of people who could never plan a year ahead finally can."
 JAP_labour_inspection_offices: "The Labour Standards Inspectorate"
 JAP_labour_inspection_offices_desc: "The government funds the Labour Standards Inspectorate to enforce rather than advise: more inspectors, forensic accounting to catch the falsified time cards that turn a hundred hours of overtime into twenty on paper, and the willingness to prosecute. A few thousand inspectors cannot police sixty million workers, so most violations surface only after someone has died and the family has hired a lawyer. The ministry already publishes the names of the firms that break the law, and Dentsu itself was convicted after Matsuri Takahashi's death."
 JAP_karoshi_prevention_act: "The Karoshi Prevention Act"
 JAP_karoshi_prevention_act_desc: "The Diet passes the Act on Promotion of Preventive Measures against Karoshi, obliging the state to research overwork deaths, publish an annual White Paper, and hold itself to targets it can be measured against: fewer than five percent of workers on sixty-hour weeks, seventy percent of paid leave actually taken, mental health provision at every firm. Making the numbers public is the point, because they can then be missed in public. The same package carries a high-level professional exemption lifting hour rules from the best-paid specialists, a carve-out the unions expect to be widened."
 JAP_end_of_karoshi: "A Country Where Work Does Not Kill"
 JAP_end_of_karoshi_desc: "The ceiling on overtime holds because inspectors turn up unannounced and prosecutors follow them, leave is taken because the law requires it, and the contract worker beside you is paid what you are paid. The firms that could only survive on unpaid hours have been wound up rather than propped on evergreened credit, so nobody is left pleading that survival leaves them no choice. Japan will still work hard, but it has stopped treating exhaustion as evidence of loyalty.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved. Completing this focus pushes §YWorker Wellbeing§! past the point where the Karoshi crisis is lifted for good."
 JAP_karoshi_wellbeing_up_tt: "Raises §YWorker Wellbeing§! by $RIGHT|+=0$, easing the Karoshi crisis"
 #Karoshi: Cultural Change path (#2586)
 JAP_premium_friday: "Premium Friday"
 JAP_premium_friday_desc: "The Ministry of Economy, Trade and Industry launches Premium Friday with the Keidanren: on the last Friday of every month, employees leave at three and spend the evening in the shops rather than at their desks. The timing is unfortunate, since month-end is when the accounts close and the quotas settle, and few firms comply with any enthusiasm. What survives is the precedent of the state naming an hour and telling the country to stop working."
 JAP_ikumen_project: "The Ikumen Project"
 JAP_ikumen_project_desc: "The Ministry of Health, Labour and Welfare runs the ikumen campaign to make a child-raising father something to admire rather than explain. Japanese paternity leave is among the most generous in the world on paper, a year of it partially paid, and almost nobody claims it, because a man who files is a man whose colleagues carry his work and whose section chief remembers. The revised law offers four weeks in the eight after a birth, splittable and merely notified, a threshold low enough that a hesitant father might actually take it."
 JAP_stress_check_programme: "The Stress Check"
 JAP_stress_check_programme_desc: "The amended Industrial Safety and Health Act requires every workplace of fifty or more employees to offer an annual psychological self-assessment, the first time the state has obliged Japanese firms to ask their staff how they are. A worker who scores badly may request an interview with a physician and an adjustment to their duties, but the results belong to the employee and a manager sees nothing without consent. That protects the individual and blunts the instrument, and firms under fifty employees are only asked to make an effort."
 JAP_telework_normalization: "Working From Anywhere"
 JAP_telework_normalization_desc: "The government appoints its first Minister for Digital Transformation and opens the Digital Agency, stripping the hanko seal requirement out of the overwhelming majority of administrative procedures. Telework was a rounding error not because the technology was missing but because contracts needed the carved seal and forms still arrived by fax, so somebody had to be in the building holding the stamp. Whether any of it outlasts the emergency is the open question, because firms called their staff back to desks they had proved they did not need."
 JAP_ending_service_zangyo: "The End of Service Overtime"
 JAP_ending_service_zangyo_desc: "Sabisu zangyo is the hour worked and never recorded, given away free because the working day was measured by self-declaration and the employee knew what the section chief expected that number to say. The reform attacks the arithmetic rather than the culture: employers must establish hours by objective means, card readers or login times, and the gap between the two records is evidence. The ministry publishes what it recovers each year, tens of billions of yen in unpaid wages, and every one of those firms was caught rather than unusual."
 JAP_ending_compulsory_nomikai: "The Optional Nomikai"
 JAP_ending_compulsory_nomikai_desc: "The nomikai is voluntary in the sense that the invitation is phrased as a question, and the junior who declines twice has said something about themselves that no performance review will record. The Power Harassment Prevention Act reaches it from the side, defining workplace power harassment in Japanese statute for the first time and obliging every company to run a complaints procedure and protect the complainant. A generation of younger workers had already stopped going, and the law caught up with them."
 JAP_work_to_live: "Working to Live"
 JAP_work_to_live_desc: "Hours are recorded by the machine and match what happened, leave is taken because taking it costs nothing, and fathers file for the weeks after a birth and return to the same desk and the same prospects. None of it was won by statute alone, because it was never really about statute: it was about what a workplace expects when nobody is enforcing anything. Japan still works hard, and it has stopped confusing that with working itself to death.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved."
 JAP_corporate_reform_category: "Corporate Japan Reform"
 JAP_corporate_reform_category_desc: "Japan's corporate sector carries two linked diseases. Banks keep unprofitable, over-indebted firms alive on rolled-over credit, locking up the capital and workers that healthier industries need. Those same firms buy loyalty with unpaid overtime, and the result is karoshi, death from overwork. Neither can be fully cured while the other persists.\n\n§YZombie Companies§!\n§YCorporate Restructuring Progress§!: [?JAP_corporate_restructuring_progress|0] / 100\nRestructuring barely moves on its own at §R+0.25 per month§!. It advances properly only once the investigation has concluded and a resolution is chosen: §Y$JAP_controlled_downsize$§! winds the firms up at §G+3 per month§!, while §Y$JAP_forced_mergers$§! absorbs them at §G+1.5 per month§!. A full report multiplies that by §G1.3§!, a whitewash by §R0.8§!. The bank focuses and the recovery programmes below add one-off amounts.\n§G30§! and §G60§!: §Y$JAP_zombie_companies$§! eases one step. §G85§!: it is gone, though §Y$JAP_forced_mergers$§! leaves a permanent mark behind it.\n§RWarning§!: a §Y$JAP_keiretsu_pact$§! slows the monthly accrual to §R80%§!.\n\n§YThe Karoshi Crisis§!\n§YCultural Change Progress§!: [?JAP_cultural_change_progress|0] / 100\n§YWorker Wellbeing§!: [?JAP_karoshi_wellbeing|0] / 100\nThe work style campaigns below raise Cultural Change Progress, which converts into Worker Wellbeing every month at §G2%§! of its value. §Y$JAP_a_society_where_women_thrive$§! and §Y$JAP_a_nation_reborn$§! each multiply that conversion by §G1.5§!, and the former also halves what every campaign costs the treasury. The reform focuses add Worker Wellbeing directly.\n§G30§! and §G60§!: §Y$JAP_karoshi_crisis$§! eases one step. §G85§!: it is removed.§RWarning§!: while §Y$JAP_zombie_companies$§! is still in place, the monthly conversion runs at §R75%§!.\n§RWarning§!: until a resolution is chosen, every campaign yields half as much and Cultural Change Progress decays §R-1 per month§!. Committing to either resolution stops the decay at once.\n\n§GHint§!: the campaigns below appear only on the §Y$JAP_cultural_change$§! path. §Y$JAP_corporate_laws$§! and §Y$JAP_keiretsu_pact$§! raise Worker Wellbeing through their focuses instead."
 JAP_premium_friday_campaign: "Promote Premium Friday"
 JAP_premium_friday_campaign_desc: "Fund another round of the ministry's publicity push and the retail discounts that go with it, and lean on the employers' federation to get its members to close early. The firms that shut the lights off at three will be photographed doing it."
 JAP_ikumen_campaign: "Run the Ikumen Campaign"
 JAP_ikumen_campaign_desc: "Put fathers on childcare leave on posters, in ministry advertising and on television, and publish the take-up rate company by company so that a low number becomes a recruiting problem. The aim is to make filing for leave unremarkable rather than brave."
 JAP_mental_health_campaign: "Workplace Mental Health Drive"
 JAP_mental_health_campaign_desc: "Extend the annual stress check below the fifty-employee threshold, subsidise occupational physicians for firms too small to retain one, and staff the counselling lines properly. Screening only helps if there is somebody at the other end of it."
 JAP_no_overtime_day_campaign: "Declare a No Overtime Day"
 JAP_no_overtime_day_campaign_desc: "Name a weekday, switch the office lights off at the appointed hour and send the section chiefs home first, because nobody junior leaves before their superior does. Crude, visible, and the only version of the instruction that has ever worked."
 JAP_cultural_change_progress_up_8_tt: "§YCultural Change Progress§! increases by §G8§!"
 JAP_cultural_change_progress_up_4_tt: "§YCultural Change Progress§! increases by §G4§!"
 JAP_karoshi_resolved: "Japan's Karoshi crisis has been fully resolved"
 JAP_keidanren_charter: "The Charter for Work-Life Balance"
 JAP_keidanren_charter_desc: "The government, the Keidanren, and Rengo sign the Charter for Work-Life Balance and put numbers to it: halve the workers on sixty-hour weeks, take every day of granted paid leave, drag male childcare leave out of the low single figures. The document carries no legal force and no penalties, only an annual public review on a council where business sits as an equal. Japanese working hours have never fallen through prosecution, but they do fall when firms must explain the figures to each other."
 JAP_shunto_offensive: "The Spring Offensive"
 JAP_shunto_offensive_desc: "The cabinet joins the shunto spring wage offensive directly, pressing the Keidanren to raise base pay rather than bonuses and backing the demand with tax credits for the firms that comply. Critics call it kanmin shunto, government-managed bargaining, and argue that a wage round run out of the Prime Minister's office is not collective negotiation at all. Until base pay rises the salaryman keeps working the overtime that pays his mortgage, whatever the ceiling says."
 JAP_health_management_stocks: "Health and Productivity Management"
 JAP_health_management_stocks_desc: "The ministry and the Tokyo Stock Exchange begin naming Health and Productivity Management Stocks, telling investors that staff health is capital expenditure rather than welfare. The certification behind it, the White 500, is the deliberate opposite of the black company blacklist and rests on the finding that exhausted workers produce less and cost more than rested ones. Firms submit their own figures on hours and health to earn the badge, and those that cannot answer for it to shareholders and recruits alike."
 JAP_morning_shift_system: "The Morning Shift"
 JAP_morning_shift_system_desc: "Itochu, a sogo shosha at the centre of the old keiretsu, bans work after ten at night and pays early-morning hours at a premium instead. The reasoning is commercial rather than humane: a trader at his desk since nine the previous morning misprices, and the evening hours are the least productive of the day. Evening overtime collapsed, total hours fell, profit held and the firm's birth rate rose, which embarrassed every rival that had called shorter hours unaffordable."
 JAP_job_based_employment: "Hired to a Job, Not a Company"
 JAP_job_based_employment_desc: "Japanese employment is membership-based: a worker is hired into the company rather than into a job, rotated at the firm's discretion with no defined duties, which is where the unbounded working day begins. Hitachi, Fujitsu, KDDI, and Shiseido now publish actual job descriptions with pay graded to the role, and the Keidanren has conceded that lifetime employment cannot be sustained. The state funds a trillion yen of retraining so the shift reads as opportunity rather than betrayal."
 JAP_the_bargain_kept: "The Bargain Kept"
 JAP_the_bargain_kept_desc: "The hours come down because the enterprise groups work out that they cost more than they earn, and having worked it out they move faster than any committee of the Diet could have made them. The cross-shareholdings stay intact, the main banks stay at the centre of their groups, and the productivity released by shorter days flows into the laboratories rather than into wage claims. The state carries what the bargain does not: the health insurance bill for the workers already broken, and the forbearance that keeps insolvent firms breathing.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved. Completing this focus pushes §YWorker Wellbeing§! past the point where the Karoshi crisis is lifted for good."

 JAP_declaration_price_target: "Declare a Price Target"
 JAP_declaration_price_target_desc: "It is not only weak demand that is dragging the economy down. The belief that prices and wages will never move has trapped households and firms in caution. A clear price target is a declaration that the state will no longer accept stagnation as normal, and it is the first step toward shaking frozen expectations loose."
 Japan_economy.01.t: "The Price Target Is Announced"
 Japan_economy.01.d: "The government has finally made clear that it will no longer accept stagnation as a permanent condition. Households and firms can no longer assume that prices and wages will remain frozen forever. The atmosphere is still heavy, but Japan's economy has at last been given a direction."
 Japan_economy.01.a: "Let expectations move first."
 Japan_economy.17.t: "The Price Target Is Reached"
 Japan_economy.17.d: "What once seemed impossible has begun to happen. Prices are rising in a way people can no longer ignore. The most important change is not the number itself, but the growing sense that stagnation is not eternal. That feeling is beginning to loosen the caution of households and firms alike."
 Japan_economy.17.a: "The atmosphere has changed."
 Japan_economy.18.t: "The Price Target Falls Short"
 Japan_economy.18.d: "The target has failed to translate into real movement, and doubt is beginning to spread over the government's promise to break the slump. Households are growing cautious once again, while firms are retreating into a wait and see stance in the face of weak demand. Confidence in recovery has clearly been damaged, and a heavy mood is settling back over Japan's economy."
 Japan_economy.18.a: "Confidence is not easily restored."
 JAP_price_target_mission: "The Promise of Rising Prices"
 JAP_price_target_mission_desc: "Declaring a target is not enough. We must show visible signs of rising prices within the allotted time and convince the country that change has truly begun."
 JAP_cash_transfers_households: "Direct Household Support"
 JAP_cash_transfers_households_desc: "When anxiety about the future is strong, recovery does not begin on its own. The state must put spending power directly into the hands of households. Support aimed at low and middle income groups is especially likely to turn into actual consumption, giving immediate force to domestic demand."
 JAP_cash_transfers_households_decision: "Payments for Low and Middle Income Households"
 JAP_cash_transfers_households_decision_desc: "Deliver support to the groups most likely to spend it and push demand upward directly."
 Japan_economy.19.t: "Support Payments Show Signs of Recovery"
 Japan_economy.19.d: "Money delivered directly to households is no longer sitting idle. It is beginning to flow into the market. The increase in spending is especially visible among low and middle income groups, and the wallets that stayed shut for so long are finally starting to open."
 Japan_economy.19.a: "Demand can still be awakened."
 JAP_temporary_tax_cuts: "Temporary Tax Relief"
 JAP_temporary_tax_cuts_desc: "Temporary tax cuts give households a reason to spend now, pulling forward the purchases that have been postponed and giving demand visible momentum in a stagnant economy."
 JAP_temporary_consumption_tax_cut: "Temporary Consumption Tax Cut"
 JAP_temporary_consumption_tax_cut_desc: "Create a reason to spend now and turn delayed consumption into momentum for recovery."
 Japan_economy.20.t: "Tax Relief Shows Signs of Recovery"
 Japan_economy.20.d: "The temporary tax cut has given households a reason to act now. Purchases that had been postponed are beginning to return, and the atmosphere of stagnation is starting to crack. It may be a short term measure, but it has shown real power in shaking weak demand loose."
 Japan_economy.20.a: "Now is the time to move."
 JAP_active_public_investment: "Aggressive Public Investment"
 JAP_active_public_investment_desc: "If private firms remain cautious, the government must create the demand itself, pushing money into local economies and employment. Public investment restores the sense that movement has finally returned."
 JAP_active_public_investment_decision: "Order Public Investment"
 JAP_active_public_investment_decision_desc: "Create demand through state action and restore the flow of money into local economies and employment."
 Japan_economy.21.t: "Public Investment Shows Signs of Recovery"
 Japan_economy.21.d: "Projects ordered by the state are beginning to mean more than the figures alone suggest. Money is flowing into local economies, employment is stirring, and the all too familiar atmosphere of economic pessimism is beginning to shift. The country can finally feel that it has taken a step beyond waiting."
 Japan_economy.21.a: "The state can move the economy."
 JAP_improvement_private_investment_climate: "Improve the Private Investment Climate"
 JAP_improvement_private_investment_climate_desc: "Government spending alone cannot complete the recovery. Firms must be given the confidence to invest again, and uncertainty about the future must be reduced. A lasting recovery requires businesses to move from defense back to expansion."
 JAP_focus_improving_investment_climate: "Focus on Improving the Investment Climate"
 JAP_focus_improving_investment_climate_desc: "The government is prioritizing the creation of a more favorable environment for business investment. Political capital is being spent on coordination, persuasion, and institutional reform, leaving less room for other short term initiatives."
 Japan_economy.02.t: "The Private Investment Climate Improves"
 Japan_economy.02.d: "Businesses are beginning to see that staying defensive forever means missing opportunities. Uncertainty remains, but some of the weight that held back new investment is beginning to lift. For the first time, recovery no longer looks destined to remain purely state driven."
 Japan_economy.02.a: "The private sector is stirring."
 JAP_stimulating_demand_durable_goods: "Stimulate Durable Goods Demand"
 JAP_stimulating_demand_durable_goods_desc: "Durable goods such as cars, appliances, and housing related purchases can lift far more than their own sectors once demand starts moving. But in times of stagnation, they are often the first purchases to be postponed. Reviving them would give the recovery visible momentum and restore a long absent sense of vitality."
 JAP_stimulating_demand_durable_goods_decision: "Durable Goods Purchase Campaign"
 JAP_stimulating_demand_durable_goods_decision_desc: "Encourage large purchases that have been postponed for years and give the recovery visible momentum."
 Japan_economy.22.t: "Durable Goods Demand Shows Signs of Recovery"
 Japan_economy.22.d: "Large purchases that had been delayed for years are finally starting to return. Durable goods demand carries broad effects across related sectors, and it is also a sign that households are becoming at least slightly more hopeful about the future. Recovery is beginning to appear not only in data, but in the atmosphere of daily life."
 Japan_economy.22.a: "Let the momentum spread."
 JAP_strict_audits_banks: "Strict Bank Inspections"
 JAP_strict_audits_banks_desc: "Years of delay have made the wounds of the banking system harder to see, while financial anxiety has continued to spread. The first step is to drag dangerous bad loans out from the shadows and force the banks to face reality. It will be painful, but without that pain there can be no real recovery."
 JAP_injection_public_funds: "Public Capital Injection"
 JAP_injection_public_funds_desc: "It is unrealistic to demand both loss disposal and renewed lending from weakened banks without support. If confidence in the financial system itself is to be preserved, the state must step in as the final backstop and halt the chain of collapse. It is a politically heavy decision, but one with little room for avoidance."
 JAP_new_lenders: "Invite New Lenders"
 JAP_new_lenders_desc: "If the existing banks remain trapped in defensive caution, the flow of credit will stay weak. New lenders must be encouraged to enter the field and break the bottleneck in finance itself. Competition and new channels of capital can restore some of the flexibility Japan's financial system has lost."
 JAP_new_lenders_idea: "The Rise of New Lenders"
 JAP_new_lenders_idea_desc: "New sources of credit beyond the traditional banks are beginning to emerge. The blockage in finance has not been fully cleared, but new paths are opening for capital to move through the economy."
 JAP_protection_deposits: "Establish Deposit Protection"
 JAP_protection_deposits_desc: "The moment depositors begin to doubt that their savings are safe, a banking crisis becomes real. The state must therefore make it unmistakably clear that deposits will be protected. This alone cannot fully restore trust, but it can still become the wall that keeps panic from turning into collapse."
 JAP_rehabilitation_small_medium_enterprises: "A Credit Safety Net for Small Businesses"
 JAP_rehabilitation_small_medium_enterprises_desc: "Disposing of the bad loans risks driving small and medium enterprises into funding distress along with the insolvent. Banks are required to maintain lending to viable SMEs while restructuring finance schemes monitor the credit tightening, putting a barrier in front of the collapse of local economies."
 JAP_rehabilitation_small_medium_enterprises_idea: "Focus on SME Credit Stability"
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "Political resources are being concentrated on supervision, coordination, and restructuring support in order to prevent bad loan disposal from choking off credit to small and medium sized firms. This is vital for protecting local economies, but it leaves less room for action in other areas."
 Japan_economy.03.t: "The First Crack in the Slump"
 Japan_economy.03.d: "Government support has begun to take effect, and spending that had been frozen is finally starting to show signs of movement. Consumer sentiment remains weak, but for the first time, cracks are beginning to appear in the long-standing mood of \"nothing will ever change anyway.\""
 Japan_economy.03.a: "The tide is beginning to turn."
 Japan_economy.04.t: "Demand Begins to Spread"
 Japan_economy.04.d: "What began as a cautious policy push is now reaching a wider part of the economy. Families are spending a little more freely, postponed purchases are returning, and firms can no longer ignore the signs of life in the market. The recovery is not yet secure, but it is no longer just a hope."
 Japan_economy.04.a: "Let the recovery spread."
 Japan_economy.05.t: "The Long Slump Ends"
 Japan_economy.05.d: "Demand has finally begun to move on its own. The actions of households and businesses have entered a cycle of mutually reinforcing momentum, and Japan's economy is steadily emerging from its long stagnation. Although many challenges still remain, the chronic recession caused by insufficient demand is no longer the country's central burden."
 Japan_economy.05.a: "At last, we move on."

 JAP_expectation_of_being_rewarded: "The Expectation of Reward"
 JAP_expectation_of_being_rewarded_desc: "Recovery requires restoring the belief that effort will be rewarded in wages and living standards. Without wage growth the stimulus stays temporary, and only that expectation turns a recovery into a self-sustaining one."
 JAP_wage_negotiations: "Negotiate for Higher Wages"
 JAP_wage_negotiations_decision: "Restore confidence in wage growth and keep demand recovery from ending as a temporary burst of stimulus."
 Japan_economy.12.t: "Wage Negotiations with Business"
 Japan_economy.12.d: "If demand recovery is to become self-sustaining, wages must rise as well. Yet businesses remain wary of future risks and pressure on profits. The government must now decide how forcefully it should push for higher pay."
 Japan_economy.12.a: "Encourage Wage Increases."
 Japan_economy.12.b: "Apply Pressure."
 Japan_economy.12.c: "Leave It to the Private Sector."
 Japan_economy.14.t: "Wage Growth Reaches the Target"
 Japan_economy.14.d: "Wages have finally begun to move in a visible way. What matters is not only the increase in income itself, but the return of a deeper feeling that effort may once again be rewarded. That change in sentiment is beginning to reshape weak consumption into something stronger and more durable."
 Japan_economy.14.a: "Recovery is becoming real."
 Japan_economy.15.t: "Wage Growth Falls Short of the Target"
 Japan_economy.15.d: "Wage growth did not reach the goal, but the effort was not wasted. Businesses remain cautious, yet the need for higher pay is now more widely understood than before. The step forward is small, but it still matters in breaking the old atmosphere of stagnation."
 Japan_economy.15.a: "We build on this."
