 CAT_naval_reactors: "해군 원자로"
 command_initative_tooltip: "§R세 가지 기술 중 하나만 선택할 수 있습니다§!"
 modifier_experience_gain_armor_Bat_combat_factor: "전차 대대 전투 경험치 획득"
 modifier_experience_gain_L_Inf_Bat_combat_factor: "경보병 전투 경험치 획득"
 modifier_experience_gain_Mot_Inf_Bat_combat_factor: "차량화 보병 전투 경험치 획득"
 modifier_experience_gain_Mech_Inf_Bat_combat_factor: "기계화 보병 전투 경험치 획득"
 modifier_experience_gain_Arm_Inf_Bat_combat_factor: "장갑 보병 전투 경험치 획득"
 modifier_experience_gain_L_arm_Bat_combat_factor: "경전차 전투 경험치 획득"
 category_conventional_infantry: "재래식 보병"
 Military_Technology_Doctrine: "군사 기술 교리"
 Military_Technology_Doctrine_desc: "전쟁이 21세기로 접어들면서 기술의 급속한 발전은 군사적 활용의 길을 제공합니다. 기성 부품과 최첨단 기술의 경이로운 성과 모두가 군대의 전투 능력을 크게 강화할 수 있습니다."
 high_tech_doctrine: "첨단 기술 교리"
 high_tech_doctrine_desc: "기술적 노력을 최첨단에 집중함으로써 다른 나라가 배치할 수 있는 수준을 앞서게 되며, 전장과 사이버전 모두에서 전투 공간의 상당한 우위를 점하게 됩니다. \n\n§R잠금 해제 시 100bn이 소요됩니다§!"
 digital_assisted_warfare: "디지털 지원 전투"
 digital_assisted_warfare_desc: "현대 컴퓨터 체계, 위성 통신, 데이터 공유 기술을 사용하면 우리 군은 적보다 더 빠르게 계획하고, 통신하며, 계획을 실행할 수 있습니다."
 cross_com_deployment: "크로스컴 체계"
 cross_com_deployment_desc: "모든 병사가 헬멧의 접안 장치에 연결된 데이터 링크 HUD를 갖추면, 보병조차도 자신이 있는 전장 공간을 완전히 파악할 수 있습니다."
 advanced_unit_drones: "발전된 드론 시스템"
 advanced_unit_drones_desc: "반자율 의사결정을 하는 드론 체계는 분대 수준의 상황 인식, 전투 능력, 적 탐지 능력을 증강할 수 있습니다."
 WOPR: "전쟁 작전 계획 대응"
 WOPR_desc: "때가 왔습니다. 전쟁 작전 계획 대응이 이제 가동되어 모든 핵무기를 포함한 군사 계획과 작전의 대부분을 직접 책임지고 있습니다. 인류가 고리에서 배제되었으므로 잘못된 의사결정이나 위험한 사고의 위험은 완전히 사라졌습니다."
 blue_force_tracker: "청군 추적기"
 blue_force_tracker_desc: "첨단 GPS 체계, 더 휴대하기 쉬운 컴퓨터, 강화된 전자 암호화를 활용하여 지휘관들은 아군 부대 위치의 실시간 데이터로 전장 공간을 감시할 수 있습니다."
 ai_assisted_planning: "AI 보조 계획"
 ai_assisted_planning_desc: "AI 체계의 비약적 발전을 활용하여 그 처리 능력으로 정보를 신속히 분석하고, 약점을 찾고, 전투 작전을 수행할 것입니다."
 common_tech_doctrine: "범용 기술 교리"
 common_tech_doctrine_desc: "미래지향적이고 값비싼 기술의 개발에 집중하는 대신, 현재의 기술을 효과적으로 구현하는 데 군사적 노력을 집중할 것입니다."
 off_the_shelf: "기성품 장비"
 off_the_shelf_desc: "막대한 자금이나 기술에 접근할 수 없는 국가로서, 우리는 가진 것으로 해결해야 합니다. 휴대전화, 컴퓨터, 서신 등은 제대로 활용하기만 하면 우리가 싸우고 통신하게 해 줄 것입니다."
 burner_phones: "대포폰"
 burner_phones_desc: "대포폰을 사용하고 사용 횟수를 한두 번으로 제한하면 우리의 통신을 더 잘 보호할 수 있습니다. 전화번호를 빠르게 바꾸고 통화 위치를 달리하면 적대 세력에 대한 통신 보안이 향상되기 때문입니다."
 encoded_messages: "인코딩된 메시지"
 encoded_messages_desc: "일상 언어로 통신하더라도 통신 내부에 특정 암호를 사용하면 통신이 가로채이더라도 실제 메시지를 숨길 수 있습니다."
 vpn_usage: "VPN 사용"
 vpn_usage_desc: "VPN을 활용하면 통신 보안이 향상되어 전자 통신이 비밀로 유지되고, 우리의 위치가 일반적인 관찰로부터 더 잘 감춰집니다."
 hand_delivered_messages: "메시지 직접 전달"
 hand_delivered_messages_desc: "서신 전령과 손으로 쓴 직접 전달 메시지를 사용하면 우리의 통신 보안으로 누구도 전자적으로 우리의 통신을 가로챌 수 없게 됩니다."
 compartmentalized_comms: "통신 구획화"
 compartmentalized_comms_desc: "전 병력에 걸쳐 통신을 '알 필요가 있는' 범위로 한정하면 네트워크의 어느 한 부분이 침해되더라도 광범위한 피해를 막을 수 있습니다."
 modernized_tech: "기술 현대화"
 modernized_tech_desc: "이용 가능한 최고의 기술을 사용하면 재래식 및 비재래식 전장 공간 모두에서 군사 역량을 강화할 수 있습니다."
 modern_gps: "현대 위성항법시스템"
 modern_gps_desc: "현대 위성 체계를 활용하면 우리 군은 전장을 정확하게 항행하고 적 진지에 대한 정밀 타격을 수행할 수 있습니다."
 satcom: "위성 통신 체계"
 satcom_desc: "위성 통신 체계를 갖추면 우리 군은 전 세계에서 신속하고 안전하게 통신하며 최소한의 계획 시간으로 임무를 계획하고 수행할 수 있습니다."
 advanced_comm_encryption: "고급 통신 암호화"
 advanced_comm_encryption_desc: "고급 암호화 체계를 개발하고 사용함으로써 우리의 통신 체계를 적의 감청과 해독으로부터 더욱 안전하게 지킬 것입니다."
 long_range_transmitters: "장거리 통신"
 long_range_transmitters_desc: "더 작고 가벼운 장거리 통신 체계를 구축하면 전장의 우리 군은 먼 거리에서도 문제없이 통신하고 협조할 수 있습니다."
 burst_transmitter_systems: "버스트 송신 체계"
 burst_transmitter_systems_desc: "버스트 송신 체계를 활용하면 우리 군은 통신 보안이 향상되고 전파 삼각 측량 시도에 덜 취약해져 탐지하기 더 어려워집니다."
 Military_Combat_Doctrine: "군사 전투 교리"
 Military_Combat_Doctrine_desc: "군사 전투 교리는 군대가 운영되는 방식의 핵심입니다. 전투 이론, 훈련 교리, 군사 대비 태세 전반은 모두 우리가 병사와 장교를 어떻게 훈련하고 가르치는가에 따라 결정됩니다."
 centralized_command: "중앙집권식 지휘"
 centralized_command_desc: "모든 작전을 계획, 준비, 조율하는 중앙 지휘부를 통해 잘 지휘되는 하향식 군대를 구축할 것입니다."
 decentralized_command: "분권식 지휘"
 decentralized_command_desc: "단일 지점이 급소가 되는 것을 막고 참수 작전을 방지하기 위해, 우리는 지휘 체계를 각 부대에 분산시켜 지도부를 흩어 놓을 것입니다."
 insurgent_command: "반군 지휘부"
 insurgent_command_desc: "반군으로서 제대로 싸우기 위해, 아군은 보안 유지를 위해 최소한의 조율과 접촉만 유지하는 세포 조직으로 나뉘어 활동할 것입니다."
 urban_insurgencies: "도시 반군 작전"
 urban_insurgencies_desc: "도시에서 작전을 수행함으로써 우리는 국가의 핵심 경제 중심지 내부에서 입지와 통제력을 유지하고, 민간인 사이에 은폐할 수 있게 될 것입니다."
 asture_insurgencies: "아스튀르 반군 작전"
 asture_insurgencies_desc: "반군 작전을 우리가 찾을 수 있는 가장 험난한 지형으로 옮김으로써 아군의 위치 파악과 추적을 어렵게 만들고, 적이 싸우기 힘든 곳까지 우리를 따라오도록 강요할 수 있습니다."
 ied_employment: "급조폭발물 운용"
 ied_employment_desc: "급조폭발물(IED)을 적절히 활용하면 최소한의 위험으로 적의 기갑 및 보병 병력 모두에 대해 우위를 점할 수 있습니다."
 scavengers: "노획 장비 수거대"
 scavengers_desc: "전장을 샅샅이 뒤져 발견한 잔해로 우리 스스로를 무장시킬 것입니다."
 ambush_operations: "매복 작전"
 ambush_operations_desc: "은폐된 장소와 구축된 진지에서 기습함으로써 적의 허를 찌를 수 있습니다."
 peaceful_civilian_coersion: "평화적 민간인 협력 유도"
 peaceful_civilian_coersion_desc: "민간인과 협력하고 그들의 지지를 얻음으로써 앞으로의 교전에 대비해 더 나은 보급과 장비를 갖출 수 있을 것입니다."
 violent_civilian_coersion: "폭력적 민간인 강압"
 violent_civilian_coersion_desc: "구타, 납치 등의 폭력 행위는 침략자와 계속 싸우는 데 필요한 지지를 신속하게 확보해 줄 것입니다."
 hit_and_run_raids: "치고 빠지기 습격"
 hit_and_run_raids_desc: "빠르게 타격한 뒤 후퇴하고 이를 반복함으로써 아군의 전투 효율을 극대화할 수 있습니다."
 terror_strikes: "테러 공격"
 terror_strikes_desc: "침략자를 몰아내려면 모두가 그들을 증오하게 만들어야 합니다. 테러 공격을 감행한 뒤 이를 침략자의 주둔 탓으로 돌리는 것이 그 방법 중 하나입니다."
 military_base_strikes: "군사 기지 공격"
 military_base_strikes_desc: "침략군의 심장부를 타격함으로써 그들을 파괴하고 우리나라에서 몰아낼 수 있습니다."
 propaganda_campaigns: "선전 활동"
 propaganda_campaigns_desc: "선전과 통신을 신중하게 활용하면 여론을 우리에게 유리하게 돌릴 수 있습니다."
 incite_revolt: "반란 선동"
 incite_revolt_desc: "현지 주민들이 우리와 함께 싸우고 침략자에 맞서 봉기하도록 만듦으로써 적의 자원을 더욱 압박할 수 있습니다."
 low_level_command_initiative: "하급 지휘 주도권"
 low_level_command_initiative_desc: "분대와 소대 지휘를 포함한 최하위 지휘관은 전장에서 기회를 포착하고 이를 추구하도록 훈련받아야 합니다."
 mid_level_command_initiative: "중급 지휘 주도권"
 mid_level_command_initiative_desc: "중대장과 대대장에게는 독자적인 결정을 내릴 권한을 위임하고, 스스로의 주도하에 작전을 수행하도록 장려할 수 있습니다."
 high_level_command_initiative: "상급 지휘 주도권"
 high_level_command_initiative_desc: "전체 상황을 이해하는 집단은 고위 지휘부뿐이며, 따라서 전략적·전술적 결정은 오직 그들만이 내려야 합니다."
 brigade_structure: "여단 전투단"
 brigade_structure_desc: "규모는 작지만 혼성으로 편성된 여단을 구축함으로써 우리 부대의 능력을 극대화할 수 있습니다."
 division_structure: "사단 편성"
 division_structure_desc: "통합된 사단 구조를 활용함으로써 전투 병과 부대를 더 효과적으로 집중하고 지휘할 수 있습니다."
 infantry_formations: "보병 전투단"
 infantry_formations_desc: "보병 부대는 군의 근간을 이루며, 어떤 지형에서도 효과적으로 싸우고 적을 강력하게 타격할 수 있게 해 줄 것입니다."
 combined_arms_formations: "기계화 전투단"
 combined_arms_formations_desc: "기계화 부대와 기갑 부대가 짝을 이루어 운용되는 데 집중함으로써, 아군은 어떤 적과도 싸울 수 있는 태세를 갖출 것입니다."
 armored_formations: "기갑 전투단"
 armored_formations_desc: "주로 전차와 지원 전력으로 구성된 기갑 전투단은 우리 군의 타격 주먹이 될 것입니다."
 logdoc: "군수 교리"
 logdoc_desc: "아군은 효율을 극대화하기 위해 재보급 및 보급 작전을 수행할 때 특정한 교리를 따를 것입니다."
 decentralized_supply_chains: "분산형 보급망"
 decentralized_supply_chains_desc: "보급선을 하나의 중앙 거점에서 여러 개의 독립된 경로로 옮김으로써 전방 기지로 가는 물자를 더 잘 보호하고 수송할 수 있습니다."
 centralized_supply_chains: "집중형 보급망"
 centralized_supply_chains_desc: "보급 노력을 소수의 집약된 경로에 집중함으로써 대량의 물자를 신속하게 수송할 수 있습니다."
 dispersed_supply_depots: "분산형 보급 창고"
 dispersed_supply_depots_desc: "보급 창고를 서로 더 멀리 떨어뜨려 배치함으로써 전선 인근에 물자를 더 잘 분배할 수 있습니다."
 concentrated_supply_depots: "집중형 보급 창고"
 concentrated_supply_depots_desc: "보급품을 전용 장소에 집중시키면 물자를 더 잘 보호하고, 전선 부대로 향하는 보급 수송을 더 효과적으로 조율할 수 있습니다."
 combat_supply_theory: "전투 보급 이론"
 combat_supply_theory_desc: "우리 군은 전투 중 보급 부대에 대해 하나의 통일된 사고방식을 채택해야 합니다."
 unit_level_supply: "부대 단위 보급"
 unit_level_supply_desc: "보급품 대부분을 개별 전투 부대에 배치함으로써 전투 작전을 더 오래 지속할 수 있습니다."
 joint_supply_theory: "합동 보급 이론"
 joint_supply_theory_desc: "몇몇 부대가 보급품을 공유하는 전방 거점을 둠으로써, 아군은 보급품을 전방에 유지하면서도 본국의 보급선과 더 나은 연결을 확보할 수 있습니다."
 central_distribution_theory: "중앙 배분 이론"
 central_distribution_theory_desc: "주요 보급 거점이 어느 부대가 어떤 보급품을 받을지 결정함으로써, 가장 필요한 부대에 연료와 탄약을 최대한 집중시킬 수 있습니다."
 permit_scavenging: "현지 조달 허용"
 permit_scavenging_desc: "군수 인력이 보급품과 탄약을 현지에서 조달하도록 허용함으로써, 군이 기동하는 동안 비축량을 늘릴 수 있습니다."
 discourage_scavenging: "현지 조달 억제"
 discourage_scavenging_desc: "군수 인력은 적 장비를 노획하려고 시간을 낭비해서는 안 되며, 대신 아군의 보급품을 신속히 수송하는 데 노력을 집중해야 합니다."
 strategic_supply_theory: "전략 보급 이론"
 strategic_supply_theory_desc: "보급과 군수는 군대의 근간입니다. 우리 군은 어떻게 싸울지를 정해야 하며, 보급은 그에 맞게 준비되어야 합니다."
 local_supply: "현지 보급"
 local_supply_desc: "우리 군이 주로 본토에서 방어적으로 싸우도록 설계된 만큼, 보급 또한 이에 맞춰 국내에 대규모 비축량을 두어야 합니다."
 force_projection: "전력 투사"
 force_projection_desc: "우리 군은 해외에서 싸우도록 설계되었으며, 이를 위해 군수 부대는 전 세계 어디로든 대량의 연료와 탄약을 수송할 수 있어야 합니다."
 tradoc: "훈련 교리"
 tradoc_desc: "우리 군은 어떻게 훈련하고 무엇으로 훈련할지를 알아야 합니다. 훈련 교리를 마련함으로써 부대와 지휘관을 전투에 더 잘 대비시킬 수 있습니다."
 short_basic_training: "단기 기초 훈련"
 short_basic_training_desc: "전투 준비가 된 병력을 신속하게 배출하도록 설계된 기초 훈련 과정은 짧게 운영되며, 병력을 과정에 빠르게 통과시키는 데 중점을 둘 것입니다."
 long_basic_training: "장기 기초 훈련"
 long_basic_training_desc: "질과 더 나은 훈련에 중점을 두는 기초 훈련 과정은 이수하는 데 더 오래 걸릴 수 있으나, 결과적으로 더 우수한 병사를 배출합니다."
 establish_skill_schools: "기술 학교 설립"
 establish_skill_schools_desc: "전투 전술과 생존 기술을 가르치는 훈련 학교를 설립함으로써 병사들을 전장에 대비시킬 수 있습니다."
 combat_skill_schools: "전투 학교"
 combat_skill_schools_desc: "전술, 장비 훈련 및 기타 전투 기술에 중점을 둔 이 학교들은 병사들이 보유한 장비로 더 잘 싸울 수 있도록 대비시킬 것입니다."
 tactics_schools: "전술 학교"
 tactics_schools_desc: "지휘관들이 부대를 이끌고 싸우는 방법을 배우는 데 집중하게 함으로써, 아군은 전장에서 임무를 훨씬 더 잘 수행할 것입니다."
 combined_arms_tactics: "합동 병과 학교"
 combined_arms_tactics_desc: "군의 모든 측면을 활용하는 데 중점을 둔 합동 병과 학교는 지휘관들에게 다양한 부대를 혼합하여 싸우는 법을 가르칠 것입니다."
 squad_level_tactics: "분대급 전술"
 squad_level_tactics_desc: "하급 지휘관을 위해 설계된 분대 전술 학교는 분대장들에게 자신의 부대를 최대한의 능력으로 지휘하여 싸우는 법을 가르칠 것입니다."
 defensive_tactics: "방어 전술 학교"
 defensive_tactics_desc: "방어전에서 적을 지연시키고, 파괴하고, 격퇴하는 방법을 병사들에게 가르치기 위해 설계되었습니다."
 armored_tactics: "기갑 전술 학교"
 armored_tactics_desc: "주로 기갑 지휘관을 위한 이 학교는 병사와 지휘관들에게 전투에서 기갑 부대를 가장 잘 활용하는 방법을 가르칠 것입니다."
 enlisted_skill_schools: "고급 개인 훈련"
 enlisted_skill_schools_desc: "병사의 기술, 무기 운용 기술 등을 가르치도록 설계된 이 학교들은 개별 병사가 자신의 장비와 지원 부대를 가장 잘 활용하도록 훈련시킬 것입니다."
 advanced_infantry_school: "고급 보병 훈련"
 advanced_infantry_school_desc: "보병을 추가로 훈련시키는 데 중점을 둔 이 학교는 고급 전술 등을 가르칩니다."
 advanced_armor_school: "고급 기갑 훈련"
 advanced_armor_school_desc: "보병 학교와 마찬가지로, 기갑 학교는 병사들에게 강철 야수의 관리와 운용에 대해 더 많은 것을 가르칩니다."
 joint_fires_school: "합동 화력 훈련"
 joint_fires_school_desc: "항공 지원과 포병 지원을 모두 최선으로 운용하기 위해, 합동 화력 학교는 병사들에게 화력 지원 부대를 요청하고 활용하는 최선의 방법을 가르칩니다."
 sapper_school: "공병 학교"
 sapper_school_desc: "병사들에게 공병 기술을 훈련시켜, 졸업생들이 전투 공병 작전을 더 잘 수행할 수 있게 합니다."
 infantry_weapons_school: "보병 무기 학교"
 infantry_weapons_school_desc: "분대, 소대, 중대 수준에서 보병이 사용할 수 있는 모든 무기를 효율적으로 운용하도록 훈련시키기 위해 설계되었습니다."
 environment_schools: "환경 생존 학교"
 environment_schools_desc: "병사들이 모든 지형에서 싸울 수 있도록 하려면, 먼저 그들이 환경에서 생존하고 이를 활용하는 법을 훈련시켜야 합니다."
 mountain_school: "산악전 학교"
 mountain_school_desc: "이 학교는 병사들에게 산악 지대에서의 생존, 이동, 전투에 관한 모든 것을 가르칩니다."
 jungle_school: "정글전 학교"
 jungle_school_desc: "세계에서 가장 혹독한 환경이라도 적절한 훈련을 받으면 살아남고 싸울 수 있습니다."
 arctic_school: "북극전 학교"
 arctic_school_desc: "병사들에게 혹한 속에서 싸우고 생존하는 법을 가르치면, 겨울철 또는 북유럽 지역 작전을 수행할 때 우위를 점할 수 있습니다."
 desert_school: "사막전 학교"
 desert_school_desc: "뜨겁고 건조한 사막도 적절한 훈련과 준비를 갖추면 정복할 수 있습니다."
 establish_leadership_schools: "지휘관 아카데미"
 establish_leadership_schools_desc: "지휘관은 타고나는 것이 아니라 만들어지는 것이며, 우리는 군의 필요에 맞는 최고의 지휘관을 양성하기 위해 노력해야 합니다."
 nco_training: "부사관 아카데미"
 nco_training_desc: "부사관 아카데미를 개설하고 활용함으로써 하급 지휘관의 훈련을 표준화하고 간소화할 수 있습니다."
 basic_nco_training: "기초 부사관 훈련"
 basic_nco_training_desc: "부사관이 받는 훈련을 최소화함으로써 더 많은 지휘관을 과정에 빠르게 통과시킬 수 있으며, 장교의 명령에 신속히 복종하도록 더 잘 훈련시킬 수 있습니다."
 advanced_nco_training: "고급 부사관 훈련"
 advanced_nco_training_desc: "하급 지휘관을 제대로 교육하고 준비시키는 데 시간을 들이면, 상급 지휘부가 없는 상황에서도 스스로의 주도하에 임무를 신속하게 수행할 수 있게 됩니다."
 nco_career_path: "부사관 경력 경로"
 nco_career_path_desc: "우수한 지휘관을 더 잘 붙잡아 두려면 부사관에게 경력을 쌓아 나갈 길을 마련해 주어야 합니다."
 snco_focus: "상급 부사관 장려"
 snco_focus_desc: "우수한 부사관이 부사관단에 계속 남도록 장려함으로써, 우리의 상급 부사관이 우리가 양성할 수 있는 최고의 인재가 되도록 보장할 수 있습니다."
 green_to_gold_focus: "그린 투 골드"
 green_to_gold_focus_desc: "뛰어난 부사관이 장교 훈련을 받도록 장려함으로써, 최우수 병사들 가운데서 경험 많고 잘 훈련된 장교를 확보할 수 있습니다."
 officer_training: "장교 아카데미"
 officer_training_desc: "임관 장교에게 교육과 훈련을 제공함으로써 그들을 가능한 한 영리하고 준비된 인재로 만들 수 있습니다."
 basic_officer_training: "기초 장교 훈련"
 basic_officer_training_desc: "장교들을 신속하게 가르쳐 지휘에 대비시킴으로써, 교육을 마친 후에는 상급 부사관과 경험이 그들을 이끌도록 할 수 있습니다."
 advanced_officer_training: "고급 장교 훈련"
 advanced_officer_training_desc: "시간이 더 걸리더라도 장교를 지휘의 모든 측면에 대해 철저히 교육, 훈련하고 준비시키는 것은 장기적으로 성과를 거둘 것입니다."
 officer_career_path: "장교 경력 경로"
 officer_career_path_desc: "장교가 교육과 경력을 더욱 발전시키도록 장려함으로써 현대 분쟁의 미래에 가장 잘 대비시킬 수 있습니다."
 specialized_officers: "장교 전문화"
 specialized_officers_desc: "장교가 전문 분야를 선택하고 훈련을 집중하도록 지도함으로써, 각자의 전문 역할을 최선을 다해 수행할 준비가 된 고급 장교를 확보할 수 있습니다."
 generalized_officers: "장교 일반화"
 generalized_officers_desc: "장교가 다양한 교육과 경험을 갖추도록 함으로써, 어떤 장교든 어떤 보직에도 배치할 수 있으며 그 역할을 수행할 준비를 갖추게 할 수 있습니다."
 comdoc: "전투 교리"
 comdoc_desc: "전투 교리는 전투 시 우리 군이 사용하는 전술과 방법, 그리고 싸우는 방식과 장소를 결정합니다."
 company_level_maneuver: "중대급 기동 요소"
 company_level_maneuver_desc: "중대를 최하위 기동 요소로 지정함으로써, 아군은 특정 지점에 화력을 더 잘 집중하고 대규모 작전을 더 잘 조율할 수 있습니다."
 platoon_level_maneuver: "소대급 기동 요소"
 platoon_level_maneuver_desc: "소대급을 기동 요소로 삼음으로써 전술적 유연성을 높이고, 지휘관들이 작전을 수행할 기회를 더 많이 제공할 수 있습니다."
 massed_force_assaults: "대규모 병력 돌격"
 massed_force_assaults_desc: "대부분의 병력을 전투 지점에 집중시킴으로써 적의 방어선을 분쇄하고 적 전선 깊숙이 돌파할 수 있습니다."
 deep_battle: "종심 전투 교리"
 deep_battle_desc: "보급 거점과 기타 핵심 기반시설을 향해 적 전선 깊숙이 진격하는 데 중점을 두어, 아군은 종심 타격과 적 영토의 광범위한 점령에 집중할 것입니다."
 flexible_advances: "유연한 공세"
 flexible_advances_desc: "기동전에 전념하는 아군 부대는 적 전선의 틈을 찾아내고 이를 이용해 적 전투 병력을 파괴하도록 훈련받을 것입니다."
 thunder_run: "기습 질주"
 thunder_run_desc: "틈이 발견되면 아군은 이를 신속하게 이용하여 적 전선에 전격적인 공격을 가해 적군을 포위하고 섬멸할 것입니다."
 probing_attacks: "탐색 공격"
 probing_attacks_desc: "정찰 요소의 면밀한 관찰하에 신중하고 제한적인 공격을 활용하여, 공세를 통해 적 전선의 약점을 찾아내고 이를 이용할 것입니다."
 recon_in_force: "무력 정찰"
 recon_in_force_desc: "더 큰 규모의 병력으로 공세 행동을 취함으로써, 아군의 공격은 적 병력과 적의 배치에 관한 귀중한 정보를 수집할 수 있게 해 줄 것입니다."
 force_reconassiance: "전담 정찰대"
 force_reconassiance_desc: "관찰 임무를 전담하는 팀을 운용함으로써, 아군은 전투가 실제로 시작되었을 때 활용할 귀중한 정보를 얻게 될 것입니다."
 offensive_fires: "공세 화력 지원"
 offensive_fires_desc: "전투에서 어떤 화력 지원 수단이 우리를 도울지 선택함으로써, 그 전력을 어떻게 운용할지 가장 잘 결정할 수 있습니다."
 integrated_close_air: "통합 헬리콥터 항공 지원"
 battlefield_support: "전장 지원"
 battlefield_support_desc: "직접 화력 지원, 정찰 또는 관측을 통해, 아군 헬리콥터 부대는 전선 전투 부대의 전력 증강 요소가 될 것입니다."
 combat_unit_destruction: "적 전투 병력 격멸"
 combat_unit_destruction_desc: "적을 발견하면 아군은 적을 그 자리에 묶어 두고 우월한 화력을 투사하여 격멸할 것입니다."
 continuous_bombardment: "지속 폭격"
 continuous_bombardment_desc: "시간과 날씨에 관계없이 아군 공군력은 적 진지를 계속해서 두들길 것입니다."
 integrated_artillery: "통합 포병 부대"
 integrated_artillery_desc: "포병 소대와 포대를 내부에 통합함으로써, 아군은 즉시 간접 화력 지원을 요청할 수 있게 될 것입니다."
 concentrated_fire_support: "집중 화력 지원"
 concentrated_fire_support_desc: "한 진지에 사격하는 화포의 수를 극대화하면 입힐 수 있는 피해도 극대화됩니다."
 dispersed_positions: "분산 진지"
 dispersed_positions_desc: "포병 포대를 넓은 지역에 걸쳐 분산 배치함으로써, 아군 지원 무기를 적의 대포병 사격과 공습으로부터 더 잘 보호할 수 있습니다."
 hurricane_bombardment: "허리케인 포격"
 hurricane_bombardment_desc: "적이 구축한 진지에 대한 신속하고 강력한 포병 포격은 진지를 파괴하고 전투 요소를 마비시켜, 아군 전선 전투 부대가 손쉽게 제압할 수 있게 만들 것입니다."
 defensive_focus: "방어 전투 교리"
 defensive_focus_desc: "우리 군은 조국을 방어하고 국민을 침략자로부터 보호하는 데 복무하는 방위 전력입니다."
 static_defense: "고정 방어"
 static_defense_desc: "전선에 구축한 견고한 방어 진지와 강력한 요새는 적의 진격을 저지하는 열쇠가 될 것입니다."
 elastic_defense: "탄력 방어"
 elastic_defense_desc: "강력한 방어 진지와 기동 대응 부대의 결합은 적을 물리치는 열쇠가 될 것입니다."
 mobile_defense: "기동 방어"
 mobile_defense_desc: "참호에 의존하는 대신, 아군은 신속하게 이동하여 반격하고 아군 진지에 대한 적의 공격을 격퇴할 것입니다."
 forward_defensive_deployments: "전방 방어 배치"
 forward_defensive_deployments_desc: "전투 공병을 최전선으로 투입하여 견고한 전투 진지를 신속하게 구축하고 확립할 것입니다."
 fire_brigades: "기동 타격 여단"
 fire_brigades_desc: "기동 타격 여단이라 불리는 신속 대응 부대를 배치하여 적의 진격에 정면으로 맞서 이를 격파할 것입니다."
 anti_tank_ambushes: "대전차 매복"
 anti_tank_ambushes_desc: "현대전의 핵심은 전차이며, 현대 방어의 핵심은 공격해 오는 적 기갑을 격파하는 능력입니다."
 dedicated_holdouts: "전담 거점 방어"
 dedicated_holdouts_desc: "선별된 전투 부대에 장기간 진지를 사수하는 데 필요한 물자를 갖추게 하고, 기회가 오면 더 기동성 있는 부대가 이를 증원하도록 할 것입니다."
 minefield_defences: "지뢰밭 방어"
 minefield_defences_desc: "전선 전역에 지뢰밭을 구축함으로써 적의 공격을 특정 지점으로 유도하거나, 적이 해당 지뢰밭을 제거하도록 강요하여 진격을 지연시킬 수 있습니다."
 delay: "지연 전술"
 delay_desc: "아군 부대는 느리게 물러서며 싸우는 방어전을 훈련받아, 기회가 있을 때마다 적을 늦추고 지연시킬 것입니다."
 defensive_position_exploitation: "방어 진지 활용"
 defensive_position_exploitation_desc: "훌륭한 훈련과 공병 능력을 갖춘 아군은 조금이라도 방어가 가능한 위치라면 어디든 견고한 요새로 바꿀 수 있을 것입니다."
 freedom_of_maneuver: "기동의 자유"
 freedom_of_maneuver_desc: "아군 방어 부대는 참호에 얽매이지 않고 전장을 자유로이 이동하며 기동할 수 있어, 적의 공격에 더 효과적으로 대응할 수 있습니다."
 counter_punch: "반격 타격"
 counter_punch_desc: "신속한 반격에 중점을 둔 아군의 방어 교리는 적에게 정면으로 맞서 그 자리에서 격멸하는 것을 중심으로 합니다."
 collapsing_defense: "점진 붕괴 방어"
 collapsing_defense_desc: "아군은 점점 더 강력한 진지로 서서히 후퇴하며 유동적인 전투를 치러, 적이 더 이상 싸울 수 없는 지경에 이르도록 끌어들일 것입니다."
 flexible_defensive_lines: "유연한 방어선"
 flexible_defensive_lines_desc: "방어선이 양보하고 이동하도록 설계되어 있으면 적군이 이를 돌파하기가 훨씬 어려워집니다."
 defence_in_depth: "종심 방어"
 defence_in_depth_desc: "다층 방어를 구축하면 적이 한 방어선을 돌파하자마자 곧바로 또 다른 방어선과 마주하게 됩니다."
 pocket_defence: "포위 방어"
 pocket_defence_desc: "아군은 완전히 포위되더라도 최대한 오래 버티며 계속 싸우도록 훈련받을 것입니다."
 unconventional_focus: "비정규전 교리"
 unconventional_focus_desc: "우리 군은 타국 군대 훈련, 대테러, 대반란 작전, 평화 유지 작전 등 비정규전에 중점을 둡니다."
 hearts_and_minds: "민심 확보"
 hearts_and_minds_desc: "우리가 지원하는 국민의 마음과 민심을 얻음으로써 적 반군 세력을 물리칠 가능성이 더욱 커질 것입니다."
 shield_the_innocent: "무고한 이들의 보호"
 shield_the_innocent_desc: "아군은 스스로를 지킬 수 없는 이들을 보호하기 위해 해당 국가에 주둔하고 있습니다."
 self_defense_fighting: "자위 전투"
 self_defense_fighting_desc: "공격을 받으면 아군은 스스로를 방어하겠지만, 적을 공격하는 데는 투입되지 않을 것입니다."
 peace_through_firepower: "화력을 통한 평화"
 peace_through_firepower_desc: "평화를 얻는 유일한 방법은 적이 싸움을 멈추도록 강제하는 것입니다. 전장에서의 우월한 화력이 그 해답입니다."
 limited_air_support: "제한적 항공 지원"
 limited_air_support_desc: "더 많은 항공기를 평화 유지 및 대반란 임무에 배정함으로써, 필요한 지역에 항공 지원을 보장할 수 있습니다."
 supply_delivery_options: "보급품 전달 작전"
 supply_delivery_options_desc: "동맹국이 충분한 보급을 받도록 보장하는 것은 그들이 전쟁에서 승리하도록 돕는 핵심이 될 것입니다."
 expanded_offensive_options: "공세 선택지 확대"
 expanded_offensive_options_desc: "전쟁이 장기화됨에 따라 계속되는 전투를 더 잘 치르기 위해 점점 더 많은 병력이 필요해질 것이며, 전장에서 공세적으로 싸울 선택지도 더 많이 필요해질 것입니다."
 limited_offensive_missions: "제한적 공세 임무"
 limited_offensive_missions_desc: "해당 국가에 주둔한 아군은 공격하기 위해 있는 것이 아니라 보호하고 방어하기 위해 있는 것입니다."
 special_forces_advisors: "특수부대 고문단"
 special_forces_advisors_desc: "아군 특수부대 파견대는 동맹국을 자문하고 훈련시키기 위해 보낼 수 있는 최정예 병력이 될 것입니다."
 unconventional_training: "비정규전 훈련"
 unconventional_training_desc: "특수부대를 훈련 팀으로 활용하여, 질이 낮은 병력을 고급 병력으로 더 잘 훈련시킬 수 있습니다."
 night_operations_training: "야간 작전 훈련"
 night_operations_training_desc: "적절한 훈련을 통해 밤은 적이 아닌 우리의 동맹이 될 것입니다."
 specfor_air_cover: "특수부대 항공 지원"
 specfor_air_cover_desc: "특수부대를 전장에 투입할 때 함께 보내는 항공 엄호는 그들이 적군을 격파하는 데 필요한 화력을 갖추도록 보장할 것입니다."
 deterrence_raids: "억제 습격"
 deterrence_raids_desc: "특수부대 팀을 활용하여 직접 행동 임무를 수행함으로써, 아군은 현지 병력이 반군의 핵심 표적을 습격하는 것을 지원할 것입니다."
 sensitive_site_raids: "민감 시설 습격"
 sensitive_site_raids_desc: "적의 핵심 시설을 습격함으로써 아군은 적 병력과 계획에 관한 귀중한 정보를 얻을 것입니다."
 mass_detainment: "대규모 구금"
 mass_detainment_desc: "습격 중 다수의 민간인을 구금함으로써, 평범한 모습으로 숨어 있는 적 반군을 심문하고 찾아낼 수 있을 것입니다."
 Military_Equipment_Doctrine: "군사 장비 교리"
 Military_Equipment_Doctrine_desc: "장비 교리는 우리가 싸울 때 사용하는 장비의 종류를 중심으로 하며, 보유한 장비에 가장 잘 맞도록 전투 방식을 조정합니다. 서로 다른 장비와 그 개발 및 운용에 주의를 집중함으로써 적과 싸우는 능력을 크게 향상시킬 수 있습니다."
 inf_equip_doctrines: "보병 교리"
 inf_equip_doctrines_desc: "경보병 장비를 경무장 병력이나 차량화 보병 부대 중심으로 집중시킴으로써, 보병을 전투 작전에 맞게 더 잘 집중시키고 훈련하며 장비를 갖출 수 있습니다."
 light_inf_focus: "경보병 교리"
 light_inf_focus_desc: "도보로 이동하는 경보병을 운용하기로 결정함으로써 연료 비용을 줄일 수 있고, 보급선을 최소화하여 보병 부대를 찾기 어렵게 만들며 운용 비용도 낮출 수 있습니다."
 moto_inf_focus: "차량화 보병 교리"
 moto_inf_focus_desc: "수송에 바퀴 달린 차량을 활용함으로써 보병 부대의 속도와 기동성을 크게 높일 수 있으며, 동시에 차량 탑재 무기를 갖추게 하여 화력도 증대시킬 수 있습니다."
 mech_inf_equip_doctrines: "중보병 교리"
 mech_inf_equip_doctrines_desc: "우리의 장갑 보병은 우리나라와 마찬가지로 선택을 내려야 합니다. 더 가볍고 생산 비용이 저렴한 APC를 사용할 것인가, 아니면 무장과 장갑이 더 강력하지만 생산 비용이 더 높은 IFV를 사용할 것인가?"
 apc_focus: "APC 교리"
 apc_focus_desc: "APC 개발에 집중하여 더 저렴한 차량을 더 많이 생산할 수 있게 하되, 보병 부대가 전장으로 이동하는 동안 어느 정도의 화력을 지원받을 수 있도록 할 것입니다."
 ifv_focus: "IFV 교리"
 ifv_focus_desc: "장갑차량이 단순히 병력을 전장으로 수송하는 데 그치지 않고, 아군은 수송 차량을 화력 지원 플랫폼으로 활용하여 각 분대에 임무를 지원할 전용 차량을 제공할 것입니다."
 fire_supp_equip_doctrines: "화력 지원 교리"
 fire_supp_equip_doctrines_desc: "아군은 전투에서 강력한 화력 지원 수단이 필요하며, 돌격포와 자주포 중 하나를 선택해야 합니다."
 spg_focus: "돌격포 교리"
 spg_focus_desc: "경전차를 정찰 역할에서 화력 지원 역할로 전환함으로써, 전장의 보병 부대에 더 강력한 직접 화력 지원을 제공할 수 있습니다."
 spart_focus: "자주포 교리"
 spart_focus_desc: "간접 화력 지원 수단의 개발에 중점을 둠으로써, 아군이 여러 부대에 분산된 효과적인 포병 부대를 통해 간접 화력 지원을 제공할 수 있게 합니다."
 heavy_equip_doctrines: "중장비 교리"
 heavy_equip_doctrines_desc: "아군의 선봉이자 돌파 가능성이 가장 높은 요소입니다. 더 높은 기동성을 위해 공격 헬리콥터에 노력을 집중하거나, 더 강력한 돌파 부대를 위해 주력 전차에 집중할 수 있습니다."
 mbt_focus: "주력 전차 교리"
 mbt_focus_desc: "주력 전차를 선봉으로 삼아, 돌파가 불가능하다고 여겨지던 지역조차 싸워 뚫어 내며 가장 견고한 적 방어선마저 돌파할 수 있을 것입니다."
 atk_helo_focus: "공격 헬리콥터 교리"
 atk_helo_focus_desc: "공격 헬리콥터의 속도, 기동성, 화력을 활용하여 적 전선에 구멍을 내고, 아군이 최전선의 적군을 신속하게 포위하고 제거할 수 있게 할 것입니다."
 hunter_killer_teams: "헌터-킬러 팀"
 hunter_killer_teams_desc: "헬리콥터 건십을 둘씩 짝지어 운용하면 더 쉽게 분산하여 팀으로 표적을 사냥하고 파괴할 수 있습니다."
 gunship_strike_force: "건십 타격 부대"
 gunship_strike_force_desc: "병력을 분산시키는 대신 건십을 대규모 편대로 집결시켜 적 전선 깊숙이 타격하는 데 활용할 것입니다."
 multi_weapon_pylons: "다중 무장 파일런"
 tank_hunter_focus: "전차 사냥꾼"
 tank_hunter_focus_desc: "헬리콥터가 하찮은 먹잇감에 시간을 낭비하게 하는 대신, 적 주력 전차를 파괴하도록 장비를 갖추고 훈련시킬 것입니다."
 infantry_hunter_focus: "보병 사냥꾼"
 infantry_hunter_focus_desc: "속도, 기동성, 화력을 활용하여, 아군 공격 헬리콥터는 적 보병 편대에 구멍을 내도록 훈련받고 장비를 갖출 것입니다."
 eye_in_the_sky: "하늘의 눈"
 rapid_exploitation: "신속한 전과 확대"
 rapid_exploitation_desc: "우월한 기동성을 활용하여 아군 건십 편대는 모든 돌파구를 신속히 이용하고, 보급선을 덮쳐 적 후방에서 혼란을 일으킬 것입니다."
 roving_killbox: "유동 킬박스"
 roving_killbox_desc: "공격 헬리콥터에 작전의 독립성을 부여함으로써, 건십은 배정된 지역 내에서 원하는 대로 기동할 수 있습니다. 이를 통해 임의로 기회 표적과 교전할 수 있습니다."
 static_battle_point: "전투 거점 교리"
 static_battle_point_desc: "건십을 전투 거점에 배정하고 지상 부대를 지원하도록 지시함으로써, 건십의 효율과 지상군의 전력을 모두 극대화할 수 있습니다."
 mobile_firepower: "기동 화력"
 mobile_firepower_desc: "화력 지원 수단의 확대에 중점을 둠으로써, 전선 병력이 필요할 때마다 필요한 화력 지원을 받도록 보장하여 전력을 강화할 수 있습니다."
 heavy_weapons: "중화기"
 heavy_weapons_desc: "지원 무기를 더 크고 다양한 무기로 개선함으로써, 이 돌격포들이 발휘할 수 있는 화력을 높일 수 있습니다."
 hardened_shell: "경화 장갑"
 hardened_shell_desc: "돌격포의 장갑을 강화함으로써 내구성을 높이고 적군에 근접할 수 있게 만들 수 있습니다."
 steel_beasts: "강철 야수"
 steel_beasts_desc: "아군의 돌격포는 전선 병력의 지원 화력이 되어, 가장 견고하게 방어된 진지에도 공격을 가할 수 있게 해 줄 것입니다."
 maximum_survivability: "최대 생존성"
 maximum_survivability_desc: "승무원 보호와 차량 회수를 우선시함으로써, 아군 차량은 파괴되더라도 승무원을 살아남게 할 수 있습니다."
 maximum_destruction: "최대 파괴력"
 maximum_destruction_desc: "차량 내부의 화력과 탄약을 늘리는 데 중점을 둠으로써, 아군 체계는 더 오래, 더 강하게 싸울 수 있습니다. 그 결과 일부가 우주 계획에 합류하게 된다 해도 어쩔 수 없는 일입니다."
 breakthrough_tanks: "돌파 전차"
 breakthrough_tanks_desc: "아군의 경전차와 돌격포는 적 전선에 구멍을 내는 데 쓰여, 보병 부대가 그 뒤를 따라 적 전선으로 진입할 수 있게 해 줄 것입니다."
 direct_fire_support: "직접 화력 지원"
 direct_fire_support_desc: "전선 화력 지원 제공에 중점을 두어, 아군 경전차는 적 진지에 접근한 뒤 적 부대와 방어 시설에 직접 교전할 수 있습니다."
 anti_infantry_support: "대보병 중점"
 anti_infantry_support_desc: "고폭탄과 기관총 탑재에 중점을 두어, 아군 경전차는 공격 중 적 보병 요소를 제거하는 데 맞춰질 것입니다."
 anti_tank_support: "대전차 중점"
 anti_tank_support_desc: "경전차에 더 많은 HEAT탄과 철갑탄(SABOT)을 장비함으로써 기동 전차 킬러로 바꿀 수 있으며, 지원받는 부대가 적 기갑과의 전투에서 우위를 점하게 해 줄 수 있습니다."
 large_bore_weapons: "대구경 무기"
 high_mobility_guns: "고기동 화포"
 high_mobility_guns_desc: "경전차와 돌격포의 기동성을 개선함으로써 이들이 필요한 곳에 도달해 전선 병력을 더 잘 지원할 수 있게 할 수 있습니다."
 moving_pillboxes: "이동식 토치카"
 moving_pillboxes_desc: "추가 무장과 장갑 강화를 통해 경전차를 적 보병 부대가 격파할 수 없는 움직이는 토치카로 바꿀 수 있습니다."
 bunker_busters: "벙커 파괴자"
 bunker_busters_desc: "더 강력한 고폭탄과 적 요새를 파괴할 더 많은 수단을 갖춘 아군 돌격포는 적 벙커를 공격하고 파괴하는 훌륭한 무기가 될 것입니다."
 close_in_support: "근접 지원"
 close_in_support_desc: "아군 부대는 보병에게 근접 직접 화력 지원을 제공하는 데 노력을 집중하며, 때로는 근거리 사격까지 감행할 것입니다."
 gun_systems: "화포 체계 중점"
 gun_systems_desc: "포신 기반 포병에 중점을 두어, 아군은 전장에서 전통적인 포병 체계에 의존하는 경향을 보일 것입니다."
 mlrs_systems: "MLRS 중점"
 mlrs_systems_desc: "로켓 포병과 미사일 기반 체계에 중점을 두어, 아군 부대는 제압 폭격 또는 정밀 폭격 임무에 집중할 것입니다."
 rapid_reposition_doctrine: "신속 재배치"
 rapid_reposition_doctrine_desc: "쏘고 이동하는 방식으로, 아군 포병 승무원은 신속히 포탄을 발사한 뒤 위치를 옮겨 대포병 임무로부터 스스로를 더 잘 보호하도록 훈련받을 것입니다."
 long_range_fires: "장거리 사격"
 long_range_fires_desc: "체계의 사거리를 늘림으로써 아군의 화포를 안전하게 지키는 동시에, 사격 임무를 통해 적 전선 더 깊숙이 타격할 수 있습니다."
 rapid_fire_missions: "신속 사격 임무"
 rapid_fire_missions_desc: "즉시 행동할 수 있도록 잘 훈련된 승무원은 사격 요청에서부터 실제 임무 사격까지 걸리는 시간을 크게 단축할 것입니다."
 massed_artillery_positions: "집중 포병 진지"
 massed_artillery_positions_desc: "부대를 한곳에 집결시킴으로써 화력의 무게를 집중하고 적 진지에 대규모 포격을 퍼부을 수 있습니다."
 dispersed_dispositions: "분산 배치"
 dispersed_dispositions_desc: "분산된 포병 진지는 적이 아군의 화력 지원 부대를 쉽게 공격하지 못하게 합니다. 이는 결과적으로 아군 포병을 더 잘 보호하고, 전선 병력을 지원하는 사격 임무를 더 많이 수행할 수 있게 해 줄 것입니다."
 steel_rain: "강철비"
 steel_rain_desc: "강철과 고폭탄의 비가 하늘에서 쏟아져 떨어지는 곳의 모든 적 진지를 초토화할 것입니다."
 advanced_infantry_training: "고급 보병 훈련"
 advanced_infantry_training_desc: "하차 보병을 더 잘 훈련시키는 데 시간을 들임으로써, 적군과 싸울 장비를 더 잘 갖춘 우수한 병사를 확보할 수 있습니다."
 platoon_level_tactics: "소대급 전술"
 platoon_level_tactics_desc: "전술적 결정을 소대급에 맞춤으로써 병력 운용의 유연성을 높일 수 있습니다."
 company_level_tactics: "중대급 전술"
 company_level_tactics_desc: "전술적 결정을 중대급에 맞춤으로써 표적에 대한 화력 집중도를 높일 수 있습니다."
 expanded_infantry_weapons: "보병 무기 확장"
 city_fighting_operations: "도시전 교리"
 city_fighting_operations_desc: "도시 지형에서의 전투 작전을 훈련하고 숙달함으로써, 아군 도시에서 적군과 싸울 때 전술적 우위를 점할 수 있습니다."
 offensive_fighting_doctrine: "공세 전투 교리"
 offensive_fighting_doctrine_desc: "보병에 공격적인 군사적 사고방식을 채택함으로써, 하차한 병력으로도 적 진지를 공격할 수 있게 될 것입니다."
 defensive_fighting_doctrine: "방어 전투 교리"
 defensive_fighting_doctrine_desc: "보병에 방어적인 군사적 사고방식을 채택함으로써, 아군이 방어하는 어떤 지점이든 적이 공격하는 것을 무의미한 일로 만들 수 있습니다."
 squad_level_anti_tank: "분대급 중대전차 화기"
 squad_level_anti_tank_desc: "각 분대에 중형 및 대형 대전차 무기를 지급함으로써, 어디서 마주치든 적 기갑을 아군 보병이 격파할 수 있도록 보장할 수 있습니다."
 mounted_at_weapons: "차량 탑재 대전차 무기"
 mounted_at_weapons_desc: "경차량에 대전차 무기를 탑재함으로써 적 기갑 또는 기계화 부대와 싸울 때 우위를 줄 수 있습니다."
 mounted_ai_weapons: "차량 탑재 대보병 무기"
 mounted_ai_weapons_desc: "기동 차량에 기관총이나 자동 유탄발사기를 탑재하면 적 하차 보병과 경차량에 대해 화력이 크게 향상됩니다."
 all_terrain_vehicles: "전지형 차량"
 all_terrain_vehicles_desc: "타이어, 현가장치, 구동계가 모든 유형의 지형에서 작동하도록 보장함으로써, 차량화 부대가 어떤 전장에서든 싸울 수 있게 할 수 있습니다."
 uparmor_packages: "증가 장갑 패키지"
 uparmor_packages_desc: "전장에서 더 나은 방호를 위해 차량화 부대에 장갑 개량을 적용하여 병력과 장비를 더 잘 보호할 것입니다."
 mine_resistant_vehicles: "내지뢰 차량"
 mine_resistant_vehicles_desc: "지뢰 폭발과 급조폭발물로부터 보호하도록 설계된 차량을 제작함으로써, 병력이 어떤 전장에서 싸우든 안전하도록 보장할 수 있습니다."
 rapid_manuver_force: "신속 기동 부대"
 rapid_manuver_force_desc: "아군의 차량화 부대는 빠르고 기동성 있게 설계되어, 지체 없이 신속하게 타격하고 적과의 접촉에서 이탈할 수 있습니다."
 firepower_over_speed: "속도보다 화력"
 firepower_over_speed_desc: "화력 증대에 중점을 두어, 기동성을 희생하더라도 아군 부대는 무장 용량과 탄약 보급량이 늘어날 것입니다."
 improved_protection: "방호력 개선"
 improved_protection_desc: "장비의 장갑 방호가 개선되면 승무원과 차량 모두 전장에서 더 잘 보호받을 것입니다."
 rapid_transport_tactics: "신속 수송 전술"
 rapid_transport_tactics_desc: "속도와 신속한 전달을 강조하여, 아군 APC는 병력을 전장으로 신속하게 이동시킬 수 있을 것입니다."
 fire_support_weapons: "화력 지원 무기"
 fire_support_weapons_desc: "APC에 무기를 추가하면 주된 역할은 아니더라도 보병 부대에 일정한 화력 지원을 제공할 수 있습니다."
 armored_vehicle_counter: "장갑 차량 대응"
 armored_vehicle_counter_desc: "APC에 대전차 장비를 추가하면 경장갑 및 중장갑 적 부대 모두에 대응할 수 있습니다."
 mobility_operations: "기동 작전"
 mobility_operations_desc: "화력 지원 대신, APC는 속도와 전투력을 전장에 신속하게 전달하는 데 집중해야 합니다."
 battlefield_taxi: "전장 택시"
 battlefield_taxi_desc: "아군의 APC는 말 그대로 전선으로 가는 택시이며, 병력이 더 빠르고 더 안전하게 전장에 도달할 수 있게 해 줍니다."
 light_ifv: "경 IFV"
 light_ifv_desc: "아군의 APC는 완전한 IFV는 아니지만 무장과 방호가 잘 갖추어져 있어 경장갑 전투 차량으로 기능할 수 있습니다."
 mixed_role_apcs: "다목적 APC"
 mixed_role_apcs_desc: "아군의 APC는 다양한 무장을 혼합하여 전장에서 여러 역할을 수행할 수 있습니다. 모든 것을 할 수 있지만 어느 하나에도 정통하지 못한 만능 차량입니다."
 dedicated_weapon: "전용 무기 체계"
 dedicated_weapon_desc: "하나의 무기 체계에 집중함으로써 아군의 IFV는 더 많은 탄약을 탑재하고 더 집중적인 훈련을 받을 수 있습니다."
 multi_role_weapons: "혼합 무기 체계"
 multi_role_weapons_desc: "서로 다른 표적을 위한 여러 무장을 혼합함으로써, 아군의 IFV는 전장에서 마주치는 어떤 위협과도 교전하고 파괴할 수 있습니다."
 high_caliber_he: "대구경 고폭탄"
 high_caliber_he_desc: "고폭 무기의 구경을 늘림으로써 아군 IFV가 적 보병 부대에 대해 훨씬 더 효율적이도록 만들 수 있습니다."
 anti_tank_options: "대전차 무기"
 anti_tank_options_desc: "IFV에 중대전차 무기를 추가하면 적 기갑 편대에 맞서 스스로를 지키고 보병을 지원하는 능력이 향상될 것입니다."
 integrated_squad_tactics: "통합 분대 전술"
 integrated_squad_tactics_desc: "충분한 훈련을 통해 보병 부대는 차량을 분대의 연장으로 여기게 되며, 이는 전투력을 크게 배가시키는 수단이 될 것입니다."
 improved_armor_systems: "개선된 장갑 체계"
 improved_armor_systems_desc: "IFV의 장갑과 장갑 개량을 업그레이드함으로써 하차 병력과 승무원을 더 잘 보호하고 더 오래 전투에 머물게 할 수 있습니다."
 tank_escorts: "전차 호위"
 tank_escorts_desc: "속도, 기동성, 화력이 개선되어 아군 IFV는 주력 전차를 따라갈 수 있으며, 적 보병 요소로부터 근접 방호를 제공할 수 있을 것입니다."
 upgunned_ifvs: "화력 강화 IFV"
 upgunned_ifvs_desc: "IFV의 무기 구경을 업그레이드하고 더 나은 화포와 탄약을 사용하게 함으로써 아군 IFV를 더욱 치명적으로 만들 수 있습니다."
 CAT_infrastructure: "인프라"
 CAT_nuclear_reactors: "원자로"
 CAT_space: "우주"
 CAT_nuclear_weapons: "핵무기"
 CAT_avionics: "항공전자장비"
 CAT_drones: "드론"
 CAT_air_stealth: "스텔스 기술"
 CAT_air_to_air_weapons: "공대공 무기"
 CAT_air_countermeasures: "대응 수단"
 CAT_naval_electronics: "해군 전자장비"
 CAT_naval_armament: "해군 무장"
 CAT_naval_cannons: "해군 기관포"
 CAT_torpedoes: "어뢰"
 CAT_landing_craft: "상륙정"
 blue_water_navy: "대양 해군"
 blue_water_navy_desc: "대양 해군은 넓은 대양의 심해에서 전 세계적으로 작전할 수 있는 해군력입니다. 정의는 전력에 따라 다르지만, 원거리에서 제해권을 행사할 수 있는 능력이 필수 조건입니다. 이를 통해 국가의 해군은 본국에서 멀리 떨어진 곳에서도 힘을 투사할 수 있으며, 보통 하나 이상의 항공모함을 포함합니다."
 green_water_navy: "연안 해군"
 green_water_navy_desc: "연안 해군은 자국 연안 해역에서 작전할 수 있고 주변 연해에서 제한적으로 작전할 수 있는 해상 전력입니다."
 jeune_ecole_two: "청년학파"
 jeune_ecole_two_desc: "제운 에콜(Jeune École), 즉 \\"젊은 학파\\"는 더 무겁고 둔한 적 군함에 맞서기 위해 소형이면서 중무장하고 기동성이 높은 군함에 중점을 두는 해군 교리입니다. 이 설계는 우리가 더 크고 수적으로 많으며 우세한 적 해군에 맞서 소형 함정으로 싸울 수 있게 해 줄 것입니다."
 TITLE_SPECIAL_FORCES_ABN: "공수 특수 부대"
 TITLE_SPECIAL_FORCES_MAR: "해병 특수 부대"
 centralized_maintenance: "중앙 집중식 정비대"
 centralized_maintenance_desc: "수리와 정비 등을 위한 중앙 거점을 마련하면, 손상된 차량을 중앙 지점으로 신속하게 인계하도록 조율하여 보급선을 단순화할 수 있습니다."
 decentralized_maintenance: "분산식 정비대"
 decentralized_maintenance_desc: "정비대를 각 부대에 분산시킴으로써 차량에 대한 신속한 수리와 정비를 보장할 수 있습니다."
 integrated_close_air_desc: "공격 헬리콥터 중대를 전투 병과 요소에 배속함으로써, 모든 부대가 즉시 화력 지원을 요청할 수 있는 능력을 갖추도록 보장할 수 있습니다."
 multi_weapon_pylons_desc: "건십이 다양한 무기를 장착할 수 있도록 보장함으로써, 배정된 어떤 표적과도 교전할 수 있는 능력을 극대화합니다."
 eye_in_the_sky_desc: "공세 작전뿐 아니라 정찰 훈련도 받은 건십 승무원들은 모든 공격에 앞서 귀중한 정보를 수집할 것입니다."
 high_efficiency_engines: "고효율 엔진"
 high_efficiency_engines_desc: "기술 발전을 활용하여 아군 다목적 차량의 엔진 성능을 개선함으로써 연료 소모를 줄이고 보급선에 대한 의존도를 낮출 것입니다."
 electronics: "전자장비"
 Drones: "드론"
 large_bore_weapons_desc: "무기 체계의 구경을 키우면 아군 경전차는 체급을 훨씬 뛰어넘는 타격을 줄 수 있으며, 특히 적 기갑 부대와 싸울 때 그렇습니다."
 land_fort_building_1: "헤스코 방벽"
 land_fort_building_1_desc: "헤스코 방벽(콘서테이너라고도 함)은 영국 HESCO사가 설계한 돌망태입니다. 이 방벽은 철망 틀로 둘러싼 대형 모래주머니로 이루어져 있습니다. 이 주머니는 중장비나 손으로 채울 수 있으며, 군 기지 주변에 신속하게 벽을 쌓는 데 사용할 수 있습니다."
 land_fort_building_2: "브레머 방벽"
 land_fort_building_2_desc: "브레머 방벽(또는 T자 방벽)은 거대한 T자형 콘크리트 판으로, 서로 나란히 쉽게 세워 소화기와 포격으로부터 보호할 수 있는 견고한 벽을 만들 수 있습니다. 이 방벽은 12피트에서 20피트 높이에 이르기까지 다양한 크기로 나옵니다"
 land_fort_building_3: "자동 감시 총기"
 land_fort_building_3_desc: "카메라를 갖춘 무기 체계를 개발하면 적대적 표적을 자동으로 식별하고 조준하는 감시 총기를 운용할 수 있습니다. 물론 발사 결정은 여전히 인간 운용자가 내려야 합니다."
 land_fort_building_4: "총력 방위 교리"
 land_fort_building_4_desc: "방어 시설을 짓는 데만 주목할 것이 아니라, 전장 전체를 변모시켜야 할 하나의 요새로 보아야 합니다. 모든 집은 벙커가 될 수 있고, 모든 지하실은 무기고가, 모든 바위는 대전차 장애물이, 모든 나무는 관측소가 될 수 있습니다. 각 환경을 최대한 활용함으로써 전장 전체를 적에게 죽음의 덫으로 만들 수 있습니다."
 stronghold_building_1: "전국 방어 노력"
 stronghold_building_1_desc: "군 방어 시설은 대개 전술적 요충지에 건설되지만, 우리는 국가 방어를 전략적 차원에서도 고려해야 합니다. 충분한 노력을 기울이면 우리나라의 넓은 지역에 대한 방어를 사전에 계획하고 설계할 수 있습니다. 방공호를 짓고, 터널과 동굴을 파고, 쉽게 파괴하거나 군사적으로 활용할 수 있는 도로망과 교량을 만들어 전쟁에 대비한 우리 군의 준비 태세를 높일 수 있습니다."
 INFANTRY_TITLE_UTILITY_VEHICLES: "다목적 차량"
 INFANTRY_TITLE_UTILITY_VEHICLES_DESC: "다목적 차량은 기계화 보병이 전장 수송과 제한적인 화력 지원에 사용하는 트럭, 지프, 장갑차입니다."
 INFANTRY_TITLE_SUPPORT_WEAPONS: "지원 화기"
 INFANTRY_TITLE_SUPPORT_WEAPONS_DESC: "지원 화기는 우리 병력의 박격포, 기관총, 휴대용 대전차 발사기로, 공격과 방어 모두에서 병력에게 도움이 됩니다."
 INFANTRY_TITLE_nvg_DESC: "야간 투시경은 우리 병력이 한밤중에도 작전을 수행하는 데 필수적입니다."
 INFANTRY_TITLE_SPECIAL_DESC: "우리 특수 부대는 최정예입니다. 이들에게 특별한 무기와 장비를 지급하면 더욱 강해질 것입니다."
 INFANTRY_TITLE_COMMAND_DESC: "지휘 통제 장비는 우리 군이 조직적으로 유지되는 데 필수적인 무전기, 컴퓨터, 기타 통신 장비를 포괄합니다."
 INFANTRY_TITLE_COMBAT_ENGI_DESC: "전투 공병은 우리 병사들이 방어 시설을 구축하고 적이 만든 장애물을 파괴하는 것을 돕습니다."
 INFANTRY_TITLE_DRONES_DESC: "보병이 발사하고 조종할 수 있는 소형 드론은 전투 상황에 대한 상황 인식을 손쉽게 확보하는 데 도움이 됩니다."
 INFANTRY_TITLE_BODY_ARMOUR: "방탄복"
 INFANTRY_TITLE_BODY_ARMOUR_DESC: "병력에게 방탄복을 지급하면 평소라면 버티지 못했을 총탄 피격에서도 살아남을 수 있습니다."
 INFANTRY_TITLE_CAMOUFLAGE: "위장"
 INFANTRY_TITLE_CAMOUFLAGE_DESC: "위장에는 군복의 무늬는 물론 장비 위에 덮어씌울 수 있는 위장막과 그물도 포함됩니다. 더 발전된 위장 기법은 더 발전된 탐지 수단으로부터도 은폐할 수 있게 합니다."
 CIVILIAN_TITLE_NUCLEAR: "원자로"
 CIVILIAN_TITLE_NUCLEAR_DESC: "차세대 원자로는 모든 원자로의 효율을 높일 것입니다."
 CIVILIAN_TITLE_AGRICULTURE: "농업 디지털화"
 CIVILIAN_TITLE_AGRICULTURE_DESC: "농업은 여전히 수작업과 사람이 운전하는 기계에 크게 의존하고 있습니다. 컴퓨터와 자동화를 활용하면 농업 부문을 더욱 개선할 수 있습니다"
 augmented_vision_1: "증강현실 체계"
 augmented_vision_1_desc: "병사들에게 시야에 정보를 표시할 수 있는 헤드기어를 지급하면 전장을 더욱 효과적으로 통제할 수 있습니다."
 augmented_vision_2: "강화 시야 체계"
 augmented_vision_2_desc: "실시간 정보를 표시하는 것 외에도, 이 차세대 시야 체계는 병사들의 시야를 강화하고 표적 인식을 개선하며 다양한 무기 체계를 통합할 수 있게 해 줍니다."
 rc_fire_support_drone: "원격 조종 화력 지원 드론"
 rc_fire_support_drone_desc: "원격으로 조종할 수 있는 궤도식 또는 차륜식 무기 플랫폼을 개발하면 병사들이 목숨을 걸지 않고도 적에게 제압 사격을 가할 수 있습니다."
 exoskeleton_1: "근력 증폭복"
 exoskeleton_1_desc: "외골격의 초기 세대는 전투 임무에 쓸 만큼 매끄럽고 빠르게 작동하지 못할 것입니다. 그러나 군수 지원에서는 이 슈트를 지원 인력의 근력 증폭 장치로 사용할 수 있습니다. 더 무거운 하중을 운반하고 무거운 물체를 옮길 수 있어 보급품을 더 효율적으로 옮길 수 있습니다."
 exoskeleton_2: "운동 작전복"
 exoskeleton_2_desc: "2세대 외골격은 슈트가 전투에 쓸 만큼 빠르고 유연합니다. 우리 군 전체에 이 슈트를 지급하는 것은 아마 현실적이지 않겠지만, 군 부대에서 전담 분대나 전담 분대원이 슈트를 착용하여 선두 운용자로서의 효율을 높일 수 있습니다."
 stealth_corvette_hull_1: "2010년형 스텔스 초계함 함체"
 stealth_corvette_hull_1_desc: "뭐라고요? 아뇨, 그건 군함이 아닙니다. 우리는 군함을 만들 리가 없습니다. 헛것을 보신 겁니다. 저건 분명히 쉐보레에서 만든 칠흑색 스포츠카입니다.\n\n\n스텔스 초계함은 초계함급의 장점을 살려, 작고 탐지하기 어려운 함정을 레이더와 소나 체계에 대해 더욱 보이지 않게 만든 것입니다."
 stealth_corvette_hull_2: "2025년형 스텔스 초계함 함체"
 stealth_corvette_hull_2_desc: "$stealth_corvette_hull_1_desc$"
 stealth_corvette_hull_3: "2040년형 스텔스 초계함 함체"
 stealth_corvette_hull_3_desc: "$stealth_corvette_hull_1_desc$"
 stealth_frigate_hull_1: "2010년형 스텔스 호위함 함체"
 stealth_frigate_hull_1_desc: "스텔스 호위함은 호위함급의 현대적 재해석이지만 먼 미래에도 작전할 수 있도록 설계되었습니다. 고급 설계 기법, 감소된 레이더 반사 면적, 음향 감쇠 체계, 전자전 작전을 통해 이 함정은 탐지와 표적 설정이 훨씬 더 어렵습니다. 대잠전부터 감시에 이르는 폭넓은 임무에 사용되며, 이를 건조할 수 있는 모든 해군에게 귀중한 자산입니다."
