 howards_tax_reform: "§2Howard Tax Cuts§!"
 naval_proliferation_mandate_ast: "Мандат на распространение военно-морского оружия"
 support_doctrine_ast: "Доктрина поддержки"
 support_doctrine_ast_desc: "Наша роль в Тихоокеанском регионе в конечном итоге заключается в поддержке наших союзников путем мониторинга и содействия торговле, специализируясь на ситуациях, требующих немедленного урегулирования."
 dominance_doctrine_ast: "Доктрина доминирования"
 dominance_doctrine_ast_desc: "Наша роль в Тихом океане заключается в обеспечении военно-морского превосходства. Благодаря этому наши задачи выполняются и подкрепляются силой, которой мы обладаем на море."
 naval_contractor_grants_ast: "Гранты военно-морским подрядчикам"
 adf_academies_idea_ast: "Академии Сил обороны Австралии"
 pacific_aerial_guard_ast: "Тихоокеанская воздушная гвардия"
 cockatoo_island_investment_ast: "Инвестиции на острове Кокату"
 tour_the_roulettes: "Посетите Рулетки"
 the_roulettes_tt: "Возможность совершить виртуальную экскурсию по «Рулеткам» появится во вкладке §2Military Decisions§!."
 john_howard_desc: "Джон Ховард остается последним бастионом старых либералов. Ученик Роберта Мензиса и сторонник подъема правоцентристского движения, Ховард проводил политику, направленную на сближение партии со средним классом. Приоритетными направлениями были индивидуальная свобода, владение жильем и свободное предпринимательство, что позволило остановить рост юнионизма и вернуть партию из десятилетия забвения. До вступления в Либеральную партию Ховард работал юристом по коммерческому праву, пройдя путь от президента Молодых либералов до депутата от округа Беннелонг в 1974 году. Это вовлекло его в мир парламентской политики. Вскоре, в следующем году, его переманило правительство Фрейзера, назначив министром по делам бизнеса и потребителей. Благодаря быстрому продвижению по службе и растущей компетентности в экономических вопросах Ховард стал самым молодым министром финансов почти за 75 лет. Будучи сторонником свободного рынка, его усилия по реформированию устаревшей экономической системы были подавлены ослаблением экономики, а последовавшая за этим рецессия 1980-х годов привела к отставке либералов. В течение следующего десятилетия его позиция в партии менялась, и это десятилетие можно легко описать как череду переворотов, двойных переворотов и неудачных попыток выборов со стороны Говарда. Наконец, шанс Говарда представился в 1996 году, когда он одержал убедительную победу над действующим президентом Полом Китингом, пообещав сократить дефицит бюджета и вывести Австралию из экономического спада. Обещание, которое до сих пор остается невыполненным."
 sydney_declaration_idea_ast: "Сиднейская декларация"
 AST_MOD_MILLENNIUM_DAWN_DESC: "На рубеже веков Австралия впервые с 80-х годов демонстрирует признаки экономического процветания. Под руководством премьер-министра Джона Ховарда, известного своей прогрессивной экономической политикой и умеренной популярностью, страна за короткий период времени претерпела значительные изменения. Сейчас, находясь на культурном пороге, в преддверии Сиднейской Олимпиады, Австралия готова к величию, если ею будет руководить твердая рука. Несмотря на прогресс, растет недовольство. Годы пренебрежения со стороны правительства к проблемам коренных общин усугубили ситуацию, и возмущение по поводу застоя в реформах продолжает распространяться. Доминирование ресурсной отрасли также усилилось до такой степени, что австралийская экономика находится на грани превращения в нефтедобывающее государство, что ставит страну в крайне нестабильное положение."
 mining_industrialists_ast: "Горнопромышленники"
 mining_industrialists_ast_desc: "Невидимая рука вмешивается в австралийскую политику и промышленность уже несколько десятилетий. Законодательные инициативы против них, кажется, всегда терпят неудачу, и направление развития нашей экономики оказывается успешным только в том случае, если оно благоприятствует горнодобывающим конгломератам. Будь то лоббирование или работа со СМИ, в конечном итоге они всегда выходят победителями."
