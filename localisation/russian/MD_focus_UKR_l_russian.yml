 ukr_modernize_sov_equipment_9p148_caucasus_offer: "Предложить хранящиеся §Y9П148 «Конкурс»§! на Кавказе"
 ukr_modernize_sov_equipment_9p148_caucasus_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_9p48_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[GEO.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! и §Y[ARM.GetNameWithFlag]§! всё ещё используют истребители танков на шасси §YБРДМ-2§!. Мы можем продать хранящиеся у нас §Y9П148 «Конкурс»§! одной из этих стран.\nТе, кого мы обойдём, §Rзатаят обиду§!.\n------------------\nЕсли сделка сорвётся или часть машин останется у нас, следующим шагом можно предложить их в Африке.§!"
 ukr_modernize_sov_equipment_9p148_africa_offer: "Предложить хранящиеся §Y9П148 «Конкурс»§! в Африке"
 ukr_modernize_sov_equipment_9p148_africa_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_9p48_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[SUD.GetNameWithFlag]§!, §Y[ETH.GetNameWithFlag]§! и §Y[CHA.GetNameWithFlag]§! покупают дешёвое оружие советской эпохи везде, где могут. Мы можем предложить хранящиеся у нас §Y9П148 «Конкурс»§! одной из этих стран.§!"
 ukr_modernize_sov_equipment_atgm_barrier_v: "Переоборудовать ПТРК на §YБРДМ-2§! под §Y«Барьер-В»§!"
 ukr_modernize_sov_equipment_atgm_barrier_v_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_9p48_for_tooltip\n\n\n\n\n\n\n\n\n§WС принятием на вооружение ракеты §Y«Барьер»§! §YКБ «Луч»§! и наши ремонтные заводы могут переоснастить старые истребители танков на §YБРДМ-2§! пусковой установкой §Y«Барьер-В»§!.\nКаждый заказ использует до §Y18§! хранящихся машин §Y9П148 «Конкурс»§!.\n------------------\nРешение можно повторять, пока остаются машины.§!\n\n$UKR_rada_modernization_design_tt$\n\nРазработка стоит §R[?UKR_storage_barrier_development_cost|2]§! млрд и оплачивается только при первом заказе. Каждая партия отдельно стоит §R0.04§! млрд."
