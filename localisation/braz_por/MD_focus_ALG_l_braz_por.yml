 TT_ALG_US_PROTECTION_REQ: "[Western_Autocracy_L] precisa ser o partido governante"
 TT_ALG_DIRECT_DEM_REQ: "Deveríamos ter concedido cidadania aos curdos para que difundissem ideais de democracia direta na região"
 TT_ALG_KICKING_ASSADS_EFFECT: "Inclusão política alauita: §R-40%§!"
 TT_ALG_REPUBLICANISM_FOCUS_EFFECT: "Para cada comunidade étnica e religiosa significativa na Argélia, escolheremos entre reservar assentos no parlamento para políticos que representem essas comunidades, o que aumenta a inclusão das minorias em troca de maiores custos de corrupção, ou não fazê-lo, o que causará tumultos e danos materiais em suas regiões sempre que sua inclusão política cair abaixo de §Y50%§!"
 TT_ALG_FEDERALISM_FOCUS_EFFECT: "Para cada comunidade étnica e religiosa significativa na Argélia, escolheremos entre conceder-lhes semiautonomia, aumentando sua inclusão política em troca de menor extração de recursos, velocidade de construção e espaços de construção, além de aumentar o custo de alterar a legislação governamental de forma inversamente proporcional à inclusão política da comunidade, ou libertar a região por completo como um estado autônomo"
 TT_ALG_DIRECT_DEMOCRACY_REQ: "Para que nossa democracia direta funcione, o Estado deve ser secularizado e a ameaça terrorista deve deixar de existir. Além disso, a sociedade deve ser pacificada dos ideais salafistas radicais"
 TT_ALG_SECULARIZE_CONSTITUTION: "Dependendo das reformas e políticas adotadas, seremos uma Democracia Liberal ou uma Democracia Iliberal"
 TT_ALG_ALLY_FARMERS: "Os agricultores se juntarão a nós como facção interna em nossa luta"
 TT_ALG_ALLY_INDUSTRIALISTS: "Os conglomerados industriais se juntarão a nós como facção interna em nossa luta"
 TT_ALG_ALLY_ULEMA: "Os ulemás se juntarão a nós como facção interna em nossa luta"
 TT_ALG_ALLY_INTL_BANKERS: "Banqueiros internacionais se juntarão a nós como facção interna em nossa luta"
 TT_ALG_AGRICULTURAL_INVESTMENT_EFFECT: "Investir várias vezes na agricultura permitirá novos mercados e negócios para escoar a produção. No entanto, o número de investimentos necessários para que novos negócios surjam é influenciado pelo nível de corrupção"
 ALG_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§YConvidaremos um partido para a coalizão. O partido nos beneficiará muito ao participar de sua respectiva causa, seja Centralização ou Descentralização, durante o processo de equilíbrio de poder na construção do Estado§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§CTer este partido na coalizão nos beneficiará muito na Centralização durante o processo de equilíbrio de poder na construção do Estado§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§GTer este partido na coalizão nos beneficiará muito na Descentralização durante o processo de equilíbrio de poder na construção do Estado§!"
 ALG_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "Se bem-sucedido, ganharemos §G75§! de poder político e a ideia §YBurocratas Promissores§!, concedendo §G+0.5§! de §Yganho diário de poder político§! e §G+0.2§! de §Yvelocidade de construção§! por §Y100§! dias"
 ALG_STATE_DECISION_MAKING_SUCCESS_EFFECTS: "Se bem-sucedido, ganharemos §G5%§! de estabilidade"
 ALG_LOCAL_ACCOUNTABILITY_SUCCESS_EFFECTS: "Se bem-sucedido, ganharemos §G10%§! de popularidade do partido e reduziremos a corrupção"
 ALG_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "Se bem-sucedido, reduziremos a corrupção e ganharemos §YAscensão das Organizações Voluntárias§!, concedendo §G0.2§! de ganho diário de poder político e §G+30%§! de velocidade de construção por §Y100§! dias"
 ALG_ENCOURAGE_ECONOMIC_SELF_RELIANCE: "Se bem-sucedido, aumentaremos nosso ciclo de crescimento econômico"
 TT_ALG_KURDS_WITHOUT_CITIZENSHIPS_PARTY_FORMATION: "§GUma vez removidos pela concessão de cidadania aos curdos após a expulsão dos Assad, eles formarão um partido político que busca transformar a Argélia em uma Federação§!"
 ALG_ECONOMIC_DECISIONS_ONE_FREE_FACTORIES_EXPLANATION: "§RDeve haver pelo menos um complexo industrial disponível e não alocado à construção. Cancele alguma construção que tenha atribuído ou espere que termine e fique disponível§!"
 ALG_ECONOMIC_DECISIONS_TWO_FREE_FACTORIES_EXPLANATION: "§RDeve haver pelo menos dois complexos industriais disponíveis e não alocados à construção. Cancele alguma construção que tenha atribuído ou espere que termine e fique disponível§!"
 ALG_ECONOMIC_DECISIONS_THREE_FREE_FACTORIES_EXPLANATION: "§RDeve haver pelo menos três complexos industriais disponíveis e não alocados à construção. Cancele alguma construção que tenha atribuído ou espere que termine e fique disponível§!"
 ALG_FEDERAL_FORMATION_TOOLTIP: "Se todos os valores de inclusão das minorias estiverem em §Y50%§! ou mais, a §GFederação Argelina§! será formada"
 ALG_UNITARY_FORMATION_TOOLTIP: "Se todos os valores de inclusão das minorias estiverem em §Y50%§! ou mais, a §CRepública Argelina§! será formada"
 ALG_tech_name: "Bônus de tecnologia"
 TT_ALG_CORRUPTION_COSTS: "Quanto mais corruptas forem nossas instituições, mais caros serão nossos investimentos"
 ALG_algeria_invite_ciw: "§CConvidaremos todas as nações islâmicas para a CIW§!"
 dyn_ALG_tt: "O efeito deste foco depende da orientação do governo argelino!"
 ALG_islamist_opposition_victory: "Governo da oposição islamista"
 ALG_islamist_opposition_victory_desc: "A coalizão de oposição islamista venceu as eleições e terá a missão de conduzir a Argélia a se tornar uma república islâmica conservadora"
 ALG_islamist_renaissance: "Renascimento islamista"
 ALG_islamist_renaissance_desc: "Nossa vitória encorajou nosso apoio entre as massas. Uma nova cultura evoluiu e somos todos a favor de apoiá-la"
 ALG_empower_sharia_courts: "Fortalecer os tribunais da Sharia"
 ALG_empower_sharia_courts_desc: "É hora de fortalecer o judiciário islâmico e expandir sua influência"
 ALG_turkish_inspired_islamism: "Islamismo de inspiração turca"
 ALG_turkish_inspired_islamism_desc: "Nos inspiraremos nos movimentos islamistas que ocorreram na Turquia após o estabelecimento de sua república. Isso apresentará nosso movimento sob uma luz mais favorável por ora e pode atrair empresários conservadores turcos a investir em nosso país."
 ALG_deregulate_economy: "Economia desregulamentada"
 ALG_deregulate_economy_desc: "Para fortalecer as classes médias e os comerciantes de quem tiramos grande parte de nosso apoio, reduziremos as restrições a eles e daremos o espaço necessário para seu crescimento"
 ALG_moderate_conservatism: "Conservadorismo moderado"
 ALG_moderate_conservatism_desc: "Extirparemos elementos extremistas dentro de nossas fileiras e remodelaremos nossa imagem como uma força conservadora que nada tem a ver com fanatismo religioso"
 ALG_religious_values: "Nossos valores inabaláveis"
 ALG_religious_values_desc: "Pode ser que nossas políticas anteriores de apaziguar a população e suavizar nossa imagem tenham nos permitido nos desviar dos verdadeiros valores sobre os quais nossos ideais se fundam. Importamo-nos menos com o que os outros pensam de nós, e nosso único objetivo é estabelecer a sharia em nossas terras, por mais impopular que isso possa ser"
 ALG_religious_economic_charity: "Doações religiosas"
 ALG_religious_economic_charity_desc: "Nossos movimentos sempre estiveram associados a obras de caridade e fundações benéficas para nossas comunidades. Agora que temos uma posição mais proeminente, vamos institucionalizá-las ainda mais para aliviar nossos fardos econômicos"
 ALG_qatari_support: "Apoio do Catar"
 ALG_qatari_support_desc: "Despertamos o interesse de diversos investidores cataris"
 ALG_flourishment_of_central_economy: "Desenvolver centros urbanos"
 ALG_flourishment_of_central_economy_desc: "Nossa base de apoio vem principalmente de diversas regiões urbanas e devemos começar a desenvolvê-las para encorajar o apoio de sua população"
 ALG_turkish_investments: "Investimentos turcos"
 ALG_turkish_investments_desc: "We have attracted lots of turkish investors thanks to our deregulation policies as well as our ideological similarities to them"
 ALG_reverse_secularization: "Reverter a secularização"
 ALG_arm_palestinians_to_fight: "Armar os palestinos"
 ALG_arm_palestinians_to_fight_desc: "A Jordânia abriga uma grande população de refugiados palestinos. Podemos transformar esses refugiados em combatentes e instigá-los a causar caos na Palestina e em Israel. Como são combatentes por procuração, podemos usá-los para instigar Israel a retaliar, fazendo-o parecer o vilão do conflito"
 ALG_zionist_threat: "A ameaça sionista"
 ALG_zionist_threat_desc: "Israel é a maior afronta a todos os muçulmanos e um Estado falso e abominável no coração do Islã. Precisa ser varrido da face da Terra."
 ALG_help_sahara: "Nossos amigos saarauís"
 ALG_help_sahara_desc: "Estamos em contato com muitos movimentos que apoiam nossa causa pan-arabista; um deles é a Frente Polisário, que busca libertar o povo do Norte do Saara. Durante o último século, a Polisário combateu a opressão colonial e depois a marroquina, e agora a Frente controla apenas uma pequena área do Saara Ocidental. Por ora, o conflito está congelado, mas podemos mudar isso enviando ajuda militar a nossos amigos e equipando os saarauís com tudo de que precisam para continuar sua luta."
 algeria.42.t: "Apoio de armas de [FROM.GetName]!"
 algeria.42.d: "Eles nos enviaram armas!"
 algeria.42.a: "Ótimo"
 algeria.43.t: "A Argélia emite um protesto diplomático!"
 algeria.43.d: "O presidente argelino Abderrazak Makri emitiu um protesto diplomático contra nosso governo. Ele alega que somos terroristas e que a comunidade internacional deve iniciar uma operação especial para liquidar nosso regime."
 algeria.43.a: "Vá se f***, Makri"
 ALG_support_fsa: "Apoiar o ESL"
 ALG_support_fsa_desc: "Nossas relações com a Síria têm uma longa história. Agora, essas relações devem ser definidas pela relação deles com a ideologia da Irmandade."
 ALG_brotherhood_diplo: "Diplomacia da Irmandade"
 ALG_brotherhood_diplo_desc: "Devemos reformar nossa diplomacia de acordo com nosso novo governo."
 ALG_hamas_under_wing: "Hamas sob nossa asa"
 ALG_hamas_under_wing_desc: "O Hamas é um grupo de combatentes da liberdade localizado na Faixa de Gaza, associado à Irmandade Muçulmana. Ajudá-los é nosso dever!"
 algeria.44.t: "Hamas assume o controle de Gaza"
 algeria.44.d: "O Hamas, com apoio da Argélia, assumiu o controle da Faixa de Gaza. Suas milícias armadas tomaram edifícios governamentais, e seu porta-voz [HAM.GetLeader] declarou que o grupo se prepara para marchar para libertar a Mesquita de Al-Aqsa"
 algeria.44.a: "Droga"
 ALG_letter_isr: "Manipulação israelense"
 ALG_letter_isr_desc: "Ah, Israel! Chegou a hora de decidir o que fazer com você."
 MSP_letter_isr: "Manipulação israelense"
 MSP_letter_isr_desc: "Ah, Israel! Chegou a hora de decidir o que fazer com você."
 ALG_und_supp_hamas: "Apoio clandestino ao Hamas"
 ALG_und_supp_hamas_desc: "Para que a causa do Hamas tenha sucesso, devemos apoiá-los materialmente."
 ALG_org_of_isl_coop: "Organização para a Cooperação Islâmica"
 ALG_org_of_isl_coop_desc: "A Organização para a Cooperação Islâmica, antiga Organização da Conferência Islâmica, é uma organização intergovernamental fundada em 1969, composta por 57 Estados-membros, dos quais 48 têm maioria muçulmana."
 MSP_und_supp_hamas: "Apoio clandestino ao Hamas"
 MSP_und_supp_hamas_desc: "Para que a causa do Hamas tenha sucesso, devemos apoiá-los materialmente."
 MSP_org_of_isl_coop: "Organização para a Cooperação Islâmica"
 MSP_org_of_isl_coop_desc: "A Organização para a Cooperação Islâmica, antiga Organização da Conferência Islâmica, é uma organização intergovernamental fundada em 1969, composta por 57 Estados-membros, dos quais 48 têm maioria muçulmana."
 algeria.49.t: "A Argélia pede a libertação de Omar Abdel-Rahman"
 algeria.49.d: "Em sua carta, Makri mencionou brevemente que nos pede para libertar Omar Abdel-Rahman, condenado pelo atentado de 1993 ao World Trade Center em Nova York, juntamente com os muitos egípcios que foram presos durante a revolução. Um porta-voz da Irmandade disse mais tarde que a extradição é proposta por razões humanitárias e que Makri não pretendia anular as condenações criminais de Abdel-Rahman."
 algeria.49.a: "Makri enlouqueceu?"
 algeria.49.b: "Ugh, claro?"
 ALG_supp_plo: "Apoiar a OLP"
 ALG_supp_plo_desc: "A Organização para a Libertação da Palestina (OLP) há muito é um ator-chave na luta pela autodeterminação palestina. Apoiar a OLP pode reforçar nossa posição com aliados internacionais e promover uma resolução pacífica do conflito."
 ALG_the_pal_issue: "A questão palestina"
 ALG_the_pal_issue_desc: "A questão da Palestina continua sendo um tema central em nossa política externa. Nossa posição sobre a luta palestina definirá nossas alianças internacionais e nossa influência na região. Devemos decidir como lidar com esse conflito em curso."
 ALG_supp_hamas: "Apoiar o Hamas"
 ALG_supp_hamas_desc: "O Hamas representa uma facção significativa dentro da resistência palestina. Ao fornecer apoio, podemos fortalecer nossos laços com esse grupo, ampliando nossa influência na região e nos alinhando à sua luta."
 ALG_Get_rid_of_military_corrupt: "Expurgar os corruptos militares"
 ALG_Get_rid_of_military_corrupt_desc: "Os militares estão entrincheirados em nossas instituições e são uma ameaça clara ao futuro de nosso país. Vamos prendê-los sob acusações de corrupção e confiscar os bens que conseguirmos alcançar"
 idea_algerian_oligarchy_arrests: "Expurgo militar"
 ALG_the_coalition: "A Coalizão"
 ALG_the_coalition_desc: "After reestablishing political parties two notable forces have risen. One advocates for federalizing the state and giving more power to provinces while the other advocates for entrenching the centralized authority and maintaining a united centralized republic. We'll have to choose carefully who we should align with"
 ALG_dismantle_the_military: "Desmantelar o orçamento militar"
 ALG_dismantle_the_military_desc: "Grande parte do PIB de defesa foi desviada e direcionada a projetos inúteis devido à corrupção arraigada nas instituições de nossas forças armadas. Reaproveitaremos e venderemos muito do que conseguirmos alcançar e, embora isso possa enfraquecer nossos militares e nos deixar propensos a ameaças, é um passo necessário rumo à recuperação econômica e à extirpação da corrupção"
 ALG_empower_institutions: "Fortalecer as instituições"
 ALG_empower_institutions_desc: "Nossas instituições são muito fracas e marginalizadas. Isso se deve à concentração de poder no presidente e ao pouco poder dado ao parlamento, além de uma mídia estatal que sustenta uma atmosfera de restrição às liberdades pessoais. Redigir uma nova constituição que garanta a distribuição do poder e a liberalização é um passo crucial para o futuro"
 ALG_western_supported_economic_relief: "Alívio ocidental"
 ALG_western_supported_economic_relief_desc: "Nossos ideais se alinham aos do Ocidente e até nos permitiram estabelecer nossos partidos em seus países. Estabeleceremos laços com eles e pediremos alívio em troca de alavancagem econômica"
 ALG_liberalize_society: "Liberalizar a sociedade"
 ALG_liberalize_society_desc: "O povo é estranho aos valores de liberdade e igualdade. Devemos trabalhar para incentivá-los a valorizar suas liberdades"
 ALG_scientific_ventures: "Empreendimentos científicos"
 ALG_scientific_ventures_desc: "Apoiando bolsas de estudo e atualizando nossos currículos escolares obsoletos, poderemos avançar o setor científico do país"
 Algeria_student_exchanges: "Intercâmbios estudantis"
 ALG_banish_authoritarian_influence: "Banir a influência autoritária"
 ALG_banish_authoritarian_influence_desc: "Muitos Estados autoritários, como Irã e Rússia, tiveram grande presença aqui. Agora que somos um Estado livre, é hora de encerrar sua influência sobre nossas instituições e economia"
 ALG_democratic_socialism: "Socialismo democrático"
 ALG_democratic_socialism_desc: "O estado econômico ruinoso do nosso país deixou nossa população bastante pobre e subdesenvolvida. Reduzir as restrições às empresas introduziria exploração e concorrência desleal, já que a desigualdade econômica ainda prevalece em nosso país. O que precisamos é nos concentrar em incentivar novos negócios no país e dar-lhes subsídios para permitir um amplo desenvolvimento econômico de que todas as classes de cidadãos possam desfrutar"
 ALG_unleash_economic_potential: "Liberar o potencial econômico"
 ALG_unleash_economic_potential_desc: "Temos grande potencial para nos tornarmos uma potência econômica. Podemos incentivar investidores e empresas estrangeiras a abrirem companhias aqui e, embora isso sujeite nossa população a se tornar mão de obra barata, será nosso grande salto rumo ao desenvolvimento econômico"
 ALG_domestic_investments: "Investimentos domésticos"
 ALG_domestic_investments_desc: "Muitos jovens negócios nacionais estão sendo criados. Investiremos neles para apoiar sua jornada rumo à prosperidade econômica"
 ALG_subsidize_local_firms: "Empresas locais"
 ALG_subsidize_local_firms_desc: "Thanks to our policies local firms are being recognized for their success. Time to invest in them"
 ALG_economic_democracy: "Igualdade econômica"
 ALG_economic_democracy_desc: "Our economic development has reached all people of all economic backgrounds by tackling economic inequality and even gave rise to successful domestic companies. This is something we should be proud of"
 ALG_federalisation: "Federalização"
 ALG_federalisation_desc: "A solução é dar mais poder aos estados. Isso incentivará fortemente a representação e a inclusão locais e remediará em grande medida os temores e tensões sectárias. No entanto, essa autonomia enfraquecerá nosso controle sobre os estados, especialmente onde há minorias"
 ALG_algerian_investments: "Investimentos da diáspora"
 ALG_algerian_investments_desc: "Graças às nossas políticas favoráveis à economia, atraímos investimentos da diáspora argelina que vive no exterior"
 ALG_invite_US_business_giants: "Convidar gigantes empresariais"
 ALG_invite_US_business_giants_desc: "Embora tenhamos permitido que nossa economia prospere, isso não é suficiente. Convidaremos gigantes empresariais dos EUA a estabelecer franquias no país para estimular o consumismo"
 ALG_republicanism: "Republicanismo"
 ALG_republicanism_desc: "A Argélia é mais bem governada como um Estado forte com autoridade centralizada. Isso fortalecerá o domínio do nosso governo, mas causará alienação e raiva nas minorias que se sentirem marginalizadas"
 ALG_address_ethnic_divides: "Resolver as divisões étnicas"
 ALG_address_ethnic_divides_desc: "Nosso país sempre foi dividido e assolado pelo sectarismo. Devemos decidir como lidar com essas questões"
 ALG_EU_investments: "Investimentos da UE"
 ALG_EU_investments_desc: "Vários países europeus buscam investir em nosso país"
 ALG_student_exchanges: "Intercâmbios estudantis"
 ALG_student_exchanges_desc: "Incentivaremos bolsas de estudo em países estrangeiros para melhorar nossa educação e mantê-la em pé de igualdade com os padrões globais"
 ALG_democratic_victory: "Vitória democrática"
 ALG_democratic_victory_desc: ""
 ALG_new_era: "Uma nova era"
 ALG_new_era_desc: "Uma nova era será trazida para a região. Uma era de paz e estabilidade, livre de opressão e injustiça"
 ALG_islamic_nato: "OTAN islâmica"
 ALG_islamic_nato_desc: "Embora a OTAN nos forneça segurança, seus membros demonstraram total desprezo pelo Oriente Médio. Se não conseguem oferecer estabilidade e prosperidade, nós devemos assumir esse papel. Formaremos nossa própria aliança militar, a Organização do Tratado do Mediterrâneo, ou OTM"
 ALG_invite_iraq: "Convidar o Iraque"
 ALG_invite_iraq_desc: "Precisamos convidar o Iraque para nossa aliança, pois ele está lentamente começando a se organizar, e nos beneficiaríamos seriamente da cooperação mútua"
 ALG_invite_syria: "Convidar a Síria"
 ALG_invite_syria_desc: "Ter a Síria bem ao sul de nossa nação significa que estamos muito vulneráveis. Convidar a Síria para nossa facção seria uma ótima forma de garantir nossa segurança e proteção"
 ALG_invite_algeria: "Convidar o Egito"
 ALG_invite_algeria_desc: "O Egito é uma potência em ascensão e, com uma população do seu tamanho, nossa aliança será capaz de realizar praticamente qualquer coisa"
 ALG_assistance_to_bulgaria: "Assistência à Bulgária"
 ALG_assistance_to_bulgaria_desc: "Devemos auxiliar a Bulgária a desenvolver sua infraestrutura para que possamos fazer mais investimentos além de suas fronteiras com facilidade"
 ALG_islamic_economic_cooperation: "Cooperação econômica islâmica"
 ALG_islamic_economic_cooperation_desc: "Muitos países muçulmanos estão nadando em dinheiro e usam esse dinheiro para coisas sem sentido. Devemos formar uma aliança econômica para reunir nossos recursos em projetos econômicos comuns"
 ALG_msp_win: "§RNOTA§! : §GESTE FOCO DESBLOQUEARÁ A ÁRVORE DE FOCOS DO MSP! ESTA ÁRVORE SERÁ SOBRESCRITA§!"
 algeria_news.1.t: "Golpe militar na Argélia!"
 algeria_news.1.d: "Em uma reviravolta rápida e inesperada, a Argélia mergulha na incerteza enquanto um golpe de Estado militar se desenrola, derrubando o governo de [ALG.GetLeader]. Em meio ao aumento das tensões entre o partido governante e as facções de oposição, os militares argelinos, liderados pelo general Ahmed Gaid Salah, tomam o controle do aparato estatal, suspendem a constituição e detêm figuras políticas importantes. As ruas de Argel explodem em cenas de júbilo e apreensão, refletindo as profundas divisões da nação sobre a intervenção militar. A comunidade internacional observa de perto enquanto o futuro da Argélia está em jogo, com preocupações crescentes sobre as implicações para a democracia e a estabilidade na região."
 algeria_news.1.a: "Interessante"
 algeria_news.2.t: "A Argélia em uma Encruzilhada"
 algeria_news.2.d: "Após quase uma década de derramamento de sangue e instabilidade, a Argélia se encontra em uma posição frágil e incerta. As armas silenciaram em muitas áreas, mas a paz está longe de ser garantida. A nação agora está em um momento crítico: escolherá a reconciliação e a reforma, manterá o regime de emergência sob os militares ou voltará a colapsar em um novo conflito? Os olhos do povo argelino, e do mundo, estão voltados para o que vem a seguir."
 algeria_news.2.a: "A luta pelo futuro da Argélia começa"
 algeria_news.3.t: "Bouteflika Assume a Presidência"
 algeria_news.3.d: "Em abril de 1999, Abdelaziz Bouteflika foi eleito Presidente da Argélia, devolvendo ao país uma liderança civil formal após anos de crise política. Embora a guerra ainda não tenha terminado por completo, Bouteflika assume o cargo determinado a restaurar a estabilidade, reconstruir o Estado e conduzir a Argélia ao novo milênio. Seu programa de reconciliação e diálogo despertou esperanças em muitos argelinos, mas permanecem dúvidas se sua presidência poderá realmente curar as feridas da Década Negra."
 algeria_news.3.a: "Uma nova era começa sob Bouteflika"
 algeria_news.4.t: "O Prazo da Concórdia Civil Expira"
 algeria_news.4.d: "A janela de anistia aberta pela Concórdia Civil do Presidente Bouteflika se fechou. Milhares de insurgentes desceram das montanhas e voltaram à vida civil, e o Exército Islâmico de Salvação se dissolveu formalmente em vez de continuar lutando. Os linhas-duras do Grupo Islâmico Armado e o recém-formado Grupo Salafista para a Pregação e o Combate recusaram todas as ofertas e permanecem em campo. Os apoiadores chamam a Concórdia de a melhor chance de acabar com o derramamento de sangue; os críticos respondem que ela perdoa os autores dos massacres sem dar uma migalha de justiça às suas vítimas."
 algeria_news.4.a: "Uma chance de virar a página da Década Negra"
 algeria_news.5.t: "A FLN Reaviva Seu Legado Revolucionário"
 algeria_news.5.d: "O Presidente Bouteflika e a FLN lançaram uma campanha nacional para reforçar sua legitimidade por meio da memória da Guerra de Independência. A mídia estatal e as escolas agora glorificam o sacrifício dos mártires, apresentando a FLN como a eterna guardiã da soberania argelina. Ao mesmo tempo, o governo firmou alianças com outros grandes partidos, formando uma coalizão política para consolidar a autoridade e apresentar uma frente unida. Os críticos denunciam a campanha como propaganda oportunista, enquanto os apoiadores a veem como o renascimento do espírito revolucionário da Argélia."
 algeria_news.5.a: "A revolução continua por meio da unidade"
 algeria_news.5.b: "Nenhuma FLN deve governar sozinha"
 algeria_news.6.t: "Formação da Aliança Presidencial"
 algeria_news.6.d: "Com base em sua campanha pelo legado revolucionário, a FLN firmou uma coalizão de governo conhecida como 'Aliança Presidencial'. A Frente de Libertação Nacional (FLN), o Rali Nacional pela Democracia (RND) e o Movimento da Sociedade pela Paz (MSP) concordaram em coordenar políticas de apoio ao Presidente Bouteflika. A aliança fortalece o controle do bloco governante sobre o sistema político da Argélia, apresentando uma frente unida ao público. Enquanto os apoiadores celebram essa coalizão como símbolo de estabilidade, vozes da oposição alertam que a Argélia corre o risco de resvalar ainda mais para o domínio de partido único sob nova roupagem."
 algeria_news.6.a: "Juntos, protegemos o futuro da Argélia"
 ALG_presidential_alliance: "§YA FLN, o RND e o MSP formaram a Aliança Presidencial.§!\nEsta coalizão aumenta a estabilidade do governo, mas consolida o domínio político sob o Bloco governante."
 algeria_news.7.t: "A Crise se Reacende"
 algeria_news.7.d: "As promessas de reconciliação e reforma desmoronaram em mentiras. A FLN e seus supostos aliados no RND e em outros partidos democráticos fracassaram em entregar a justiça e os direitos exigidos pelo povo. Desiludidos com promessas vazias, muitos agora se voltam para o Grupo Salafista para a Pregação e o Combate (GSPC), acreditando que apenas a lei de Alá pode trazer verdadeira justiça à Argélia. Para eles, a Sharia representa uma lei superior, incorrupta pela ganância dos políticos, pela traição dos Harkis ou pela influência de potências estrangeiras. Esta não é uma guerra contra o povo argelino, mas contra os funcionários corruptos e as elites apoiadas pelo exterior que roubaram seu futuro. Uma nova guerra civil se avizinha, uma que decidirá o destino da Argélia de uma vez por todas."
 algeria_news.7.a: "A lei de Alá guiará o futuro da Argélia"
 ALG_army_alliance: "Le Pouvoir Fica Mais Forte"
 ALG_strengthen_le_pouvoir: "Fortalecer Le Pouvoir"
 ALG_strengthen_le_pouvoir_desc: "A elite governante e os militares consolidam o poder à custa das liberdades políticas."
 ALG_resistance_challenges_new: "As Demandas do Povo"
 ALG_resistance_challenges_new_desc: "O povo exige reformas na saúde, na educação e no emprego. Deixar de atender a essas necessidades aumentará os ressentimentos e empurrará a Argélia para mais perto da guerra civil."
 ALG_healthcare_reform: "Reformar o Sistema de Saúde"
 ALG_healthcare_reform_desc: "Os hospitais estão superlotados, os médicos mal pagos e a escassez de remédios é generalizada. Precisamos agir rápido."
 alg.310.t: "A Reforma da Saúde Tem Sucesso"
 alg.310.d: "O investimento em hospitais e médicos restaurou parte da confiança no governo."
 alg.310.a: "Uma pequena vitória."
 alg.311.t: "Colapso da Saúde"
 alg.311.d: "Os hospitais estão sobrecarregados, pacientes são recusados e a corrupção corrói o sistema. A raiva transborda."
 alg.311.a: "Isso nos custará caro."
 ALG_education_reform: "Reformar o Sistema de Educação"
 ALG_education_reform_desc: "Nossas escolas e universidades estão ultrapassadas, e os formados enfrentam um futuro sem empregos."
 alg.320.t: "A Reforma da Educação Tem Sucesso"
 alg.320.d: "O investimento em escolas e universidades devolveu a esperança aos estudantes."
 alg.320.a: "Um futuro mais brilhante."
 alg.321.t: "Colapso da Educação"
 alg.321.d: "Salas de aula superlotadas, universidades falidas e a falta de oportunidades alimentam o descontentamento."
 alg.321.a: "A juventude se volta contra nós."
 ALG_unemployment_reform: "Enfrentar a Crise do Desemprego"
 ALG_unemployment_reform_desc: "A juventude da Argélia está desempregada e inquieta. Devemos investir em indústrias e na criação de empregos, ou enfrentar a agitação."
 alg.330.t: "O Programa de Empregos Tem Sucesso"
 alg.330.d: "Novos empregos e pequenas indústrias dão esperança a milhares de jovens argelinos."
 alg.330.a: "Um passo à frente."
 alg.331.t: "A Crise do Desemprego se Aprofunda"
 alg.331.d: "As fábricas continuam paradas, os formados vagam ociosos pelas ruas e os protestos se tornam violentos."
 alg.331.a: "Isso não pode durar."
 alg.400.t: "O Exército Aceita a Derrota"
 alg.400.d: "O Exército Nacional Popular perdeu o domínio sobre a política. Com a pressão pública crescente e oficiais relutantes em arriscar outra guerra sangrenta, os generais aceitam abrir espaço para uma liderança civil."
 alg.400.a: "Finalmente, um governo civil!"
 alg.401.t: "O Exército Contra-ataca"
 alg.401.d: "Embora as reformas tenham começado, o exército ainda detém o poder real. Generais de alto escalão interferem na política, desviam recursos e sabotam tentativas de transparência. A Argélia volta a um governo nas sombras."
 alg.401.a: "Os generais corruptos permanecem no poder."
 alg.402.t: "O Povo Pega em Armas"
 alg.402.d: "As queixas do povo argelino chegaram ao ponto de ruptura. Com a estabilidade perdida e a confiança nas instituições destruída, os protestos se transformam em rebelião aberta. A Argélia enfrenta outra guerra civil."
 alg.402.a: "A nação é dilacerada."
 ALG_resist_le_pouvoir: "Resistir a Le Pouvoir"
 ALG_resist_le_pouvoir_desc: "Por décadas, a elite corrupta conhecida como *Le Pouvoir* governou a Argélia das sombras, usando o exército como seu punho de ferro. O povo está inquieto e, a menos que suas queixas sejam atendidas, a Argélia pode enfrentar outra tempestade. Escolher este caminho abrirá o caminho para a reforma, ou para o derramamento de sangue."
 ALG_popular_salvation: "Movimento de Salvação Popular"
 ALG_popular_salvation_desc: "Das cinzas do desespero, um novo movimento surge. Estudantes, trabalhadores e soldados desiludidos se unem em um clamor por mudança. Se esse movimento conseguirá derrubar pacificamente a velha ordem ou acenderá uma guerra civil dependerá de como lidarmos com as demandas do povo."
 ALG_popular_salvation_tt: "§YEste foco fortalece o movimento de oposição, mas não garante a guerra civil. O resultado depende de como as queixas e a influência do exército forem administradas.§!"
 ALG_restore_hope: "Restaurar a Esperança"
 ALG_restore_hope_desc: "Em 1999, Abdelaziz Bouteflika chegou ao poder prometendo estabilidade e reconciliação após a Década Negra. O povo o vê como um símbolo de esperança."
 ALG_charter_for_peace: "A Concórdia Civil"
 ALG_charter_for_peace_desc: "Aprovada por referendo em setembro de 1999, a Concórdia Civil oferece anistia a qualquer insurgente que se renda antes do fim do prazo. O Exército Islâmico de Salvação já honrou seu cessar-fogo; a questão é quantos dos combatentes restantes o seguirão montanha abaixo."
 ALG_no_pres_alliance: "A FLN Governa Sozinha"
 ALG_no_pres_alliance_desc: "Bouteflika e a FLN rejeitam alianças com outros partidos, afirmando domínio total sobre o sistema político da Argélia."
 ALG_le_pouvoir_in_the_shadows: "Le Pouvoir nas Sombras"
 ALG_le_pouvoir_in_the_shadows_desc: "Embora haja eleições, o poder real está nas mãos da elite entrincheirada. A corrupção se aprofunda enquanto os cidadãos ficam inquietos."
 ALG_peace_charter: "A Concórdia Civil"
 ALG_peace_charter_desc: "A anistia de Bouteflika aos insurgentes que depõem as armas, destinada a esvaziar a Década Negra de seus combatentes em vez de derrotá-los em campo."
 ALG_fln_dominance: "Domínio da FLN"
 ALG_fln_dominance_desc: "A Frente de Libertação Nacional (FLN) continua a dominar o sistema político da Argélia. Seu domínio limita o pluralismo político e gera ressentimento entre os grupos de oposição, mas proporciona continuidade e controle ao regime."
 ALG_only_FLN: "Sem Aliança"
 ALG_only_FLN_desc: "A FLN governará sozinha, rejeitando alianças ou coalizões. Embora isso consolide o poder, isola ainda mais as forças de oposição e arrisca aumentar a insatisfação pública."
 ALG_pres_coa: "Aliança Presidencial"
 ALG_pres_coa_desc: "Para manter a estabilidade, a FLN pode formar uma coalizão presidencial mais ampla. Ao incluir partidos leais e independentes, o governo ganha legitimidade sem abrir mão de seu domínio."
 ALG_nationalize_privatized_industries: "Nacionalizar as Indústrias Privatizadas"
 ALG_nationalize_privatized_industries_desc: "As privatizações neoliberais da década de 1990 enfraqueceram a soberania da Argélia. Ao renacionalizar indústrias-chave, o Estado pode retomar o controle sobre setores estratégicos."
 ALG_sonatrach_expansion: "Expansão da Sonatrach"
 ALG_sonatrach_expansion_desc: "A Sonatrach, a empresa estatal de energia da Argélia, é a espinha dorsal de nossa economia. Expandir sua capacidade e alcance reforçará as receitas do Estado e a influência da Argélia nos mercados globais de energia."
 ALG_the_cult_of_bouteflika: "O Culto a Bouteflika"
 ALG_the_cult_of_bouteflika_desc: "Os apoiadores do Presidente Bouteflika estão construindo um culto à personalidade em torno de sua liderança. Por meio de redes leais e propaganda, seu séquito cimenta seu domínio sobre a política argelina, mesmo com o aprofundamento da corrupção e do clientelismo."
 ALG_cult_of_bouteflika: "O Séquito de Bouteflika"
 ALG_cult_of_bouteflika_desc: "Cercado por um séquito leal, mas profundamente corrupto, o círculo íntimo de Bouteflika controla as alavancas do poder. Sua influência garante a estabilidade do regime, mas consolida o nepotismo e reduz a transparência na governança."
 ALG_oppose_ffs_and_rcd: "Banir a FFS e o RCD"
 ALG_oppose_ffs_and_rcd_desc: "A Frente das Forças Socialistas (FFS) e o Rali pela Cultura e Democracia (RCD) desafiam a hegemonia da FLN. Ao bani-los, o regime elimina vozes de oposição, mas corre o risco de inflamar a dissidência, particularmente na Cabília."
 ALG_smaller_state: "Estado Menor"
 ALG_smaller_state_desc: "O Estado argelino inchado é ineficiente e caro. Reduzir seu tamanho e descentralizar a autoridade poderia melhorar a eficiência, embora as elites entrincheiradas resistam a tais reformas."
 ALG_fight_bloated_bureaucracy: "Combater a Burocracia Inchada"
 ALG_fight_bloated_bureaucracy_desc: "Camadas de burocracia sufocam a governança argelina. Uma campanha para simplificar a administração pública reduzirá a corrupção e aproximará os serviços do povo."
 FLN_parties_corruptions: "Corrupção em Nossos Partidos"
 FLN_parties_corruptions_desc: "A corrupção se infiltrou na FLN e em seus partidos aliados. Denunciar e combater essa corrupção é vital se o regime espera restaurar sua credibilidade."
 ALG_elite_control: "Controle da Elite"
 ALG_elite_control_desc: "Uma rede de magnatas dos negócios, líderes partidários e oficiais militares conhecida como 'Le Pouvoir' governa a Argélia das sombras."
 ALG_military_coup: "Golpe Militar"
 ALG_military_coup_desc: "O exército decidiu encerrar a liderança civil e tomar o poder diretamente, prometendo ordem mas trazendo medo."
 ALG_suspend_democracy: "Suspender a Democracia"
 ALG_suspend_democracy_desc: "O Parlamento é dissolvido, as eleições são canceladas e os generais governam a Argélia."
 ALG_repression_campaign: "Campanha de Repressão"
 ALG_repression_campaign_desc: "O ENP usa os métodos brutais da Década Negra para esmagar a dissidência, ao custo da indignação internacional."
 ALG_black_market_rises: "O Mercado Negro Cresce"
 ALG_black_market_rises_desc: "A corrupção e a escassez criam um mercado negro próspero, minando a economia oficial."
 ALG_expand_the_pna: "Expandir o ENP"
 ALG_expand_the_pna_desc: "O exército é ampliado, modernizado e fortalecido para garantir a sobrevivência do regime."
 ALG_africas_strongest_army: "O Exército Mais Forte da África"
 ALG_africas_strongest_army_desc: "A Argélia agora possui as forças armadas mais fortes do continente, uma força a ser respeitada."
 ALG_global_power_projection: "O HCS Ressurge"
 ALG_global_power_projection_desc: "Com os militares novamente detendo um poder incontestável, a Argélia se afirma dentro e fora do país. Ecoando o domínio da era do HCS dos anos 1990, nossa nação se mantém erguida, inflexível e pronta para projetar sua influência muito além de suas fronteiras. O mundo se lembrará da força da determinação argelina."
 ALG_army_reform: "Reforma do Exército"
 ALG_army_reform_specops: "Reforma do Exército"
 ALG_army_reform_specops2: "Reforma do Exército"
 ALG_army_reform_specops3: "Reforma do Exército"
 ALG_army_reform_specops4: "Reforma do Exército"
 ALG_military_quality_initiative: "Iniciativa de Qualidade Militar"
 ALG_military_quality_initiative2: "Iniciativa de Qualidade Militar"
 ALG_army_reform_mass_army: "Reforma do Exército"
 ALG_army_reform_mass_army2: "Reforma do Exército"
 ALG_army_reform_mass_army3: "Reforma do Exército"
 ALG_army_reform_mass_army4: "Reforma do Exército"
 ALG_military_expansion: "Expansão Militar"
 ALG_military_expansion2: "Expansão Militar"
 ALG_foreign_arms_companies: "Empresas Estrangeiras de Armamentos"
 ALG_future_army: "Exército do Futuro"
 ALG_air_reform: "Reforma Aérea"
 ALG_air_reform2: "Reforma Aérea"
 ALG_air_reform3: "Reforma Aérea"
 ALG_air_reform4: "Reforma Aérea"
 ALG_naval_reform: "Reforma Naval"
 ALG_naval_reform2: "Reforma Naval"
 ALG_naval_reform3: "Reforma Naval"
 ALG_naval_reform4: "Reforma Naval"
 ALG_shipbuilding: "Construção Naval Argelina"
 ALG_shipbuilding2: "Construção Naval Argelina"
 ALG_resist_le_pouvoir_system_tt: "§YNovo Sistema Desbloqueado: Queixas do Povo e Influência do Exército§!\n\n- §OQueixas do Povo§! mede a insatisfação popular. Aumenta se o desemprego, a educação ou a saúde forem negligenciados.\n- Se as queixas crescerem demais, podem eclodir protestos em massa ou guerra civil.\n\n- §OInfluência do Exército§! acompanha o papel dos militares na política. Enfraquecê-la por meio de reformas pode permitir uma transição pacífica, mas, se a influência crescer, o exército pode suprimir a democracia e apertar seu controle.\n\nVocê deve equilibrar reforma, estabilidade e o poder dos militares para sobreviver a este caminho."
 ALG_reactioners: "Economia de Clusters"
 ALG_reactioners1: "Economia de Clusters"
 ALG_reactioners2: "Economia de Clusters"
 ALG_reactioners3: "Economia de Clusters"
 ALG_reactioners4: "Economia de Clusters"
 ALG_reactioners5: "Economia de Clusters"
 ALG_reactioners6: "Economia de Clusters"
 ALG_reactioners7: "Economia de Clusters"
 ALG_automobile_industry: "Desenvolver a Indústria Automobilística"
 ALG_automobile_industry_desc: "A Argélia há muito depende de importações para suprir suas necessidades automotivas. Ao desenvolver uma indústria automobilística nacional, podemos criar empregos, reduzir importações e estabelecer a Argélia como um polo regional de manufatura."
 ALG_peugeot_deal: "Investimento da Peugeot"
 ALG_peugeot_deal_desc: "A Peugeot manifestou interesse em abrir uma fábrica na Argélia. Essa parceria poderia nos dar a capacidade industrial de que tanto precisamos."
 ALG_renault_oran: "Renault em Orã"
 ALG_renault_oran_desc: "A Renault está disposta a estabelecer produção em Orã, fornecendo um fluxo constante de veículos e impulsionando nossa economia."
 ALG_hyundai_tiaret: "Hyundai em Tiaret"
 ALG_hyundai_tiaret_desc: "A Hyundai, da Coreia do Sul, está pronta para estabelecer uma parceria em Tiaret, criando empregos e reduzindo nossa dependência dos fabricantes europeus."
 ALG_volkswagen_relizane: "Volkswagen em Relizane"
 ALG_volkswagen_relizane_desc: "A Volkswagen e suas marcas associadas (Skoda, Audi, Seat) estão preparadas para abrir uma fábrica em Relizane, diversificando ainda mais nossa base industrial."
 ALG_bmw_deal: "Parceria com a BMW"
 ALG_bmw_deal_desc: "A BMW, da Alemanha, demonstrou interesse em montar veículos de luxo e premium na Argélia, elevando nossa indústria automotiva a padrões internacionais."
 ALG_mercedes_trucks: "Caminhões Mercedes"
 ALG_mercedes_trucks_desc: "Trabalhando com a Daimler, podemos montar caminhões militares e veículos pesados Mercedes na Argélia, apoiando diretamente nossas forças armadas."
 ALG_auto_scandal: "Escândalo de Corrupção Automobilística"
 ALG_auto_scandal_desc: "Revelações expuseram a indústria de montagem de carros da Argélia como uma farsa repleta de corrupção, com subsídios desviados e fábricas que pouco mais faziam do que remontar kits importados. O escândalo terá graves repercussões políticas e econômicas."
 ALG_import_ban: "Proibir a Importação de Carros"
 ALG_import_ban_desc: "Num esforço para proteger nossa indústria nacional, proibiremos a importação da maioria dos carros estrangeiros. A medida é controversa e causará tensão econômica no curto prazo."
 ALG_fiat_deal: "Acordo de Investimento da Fiat"
 ALG_fiat_deal_desc: "A Fiat se ofereceu para retornar à Argélia com um complexo industrial moderno, prometendo retomar a produção e restaurar a confiança pública em nosso setor automotivo."
 ALG_indigenous_brand: "Criar uma Marca Nacional"
 ALG_indigenous_brand_desc: "Em vez de depender de empresas estrangeiras, a Argélia deve criar sua própria montadora, projetada e construída localmente por argelinos."
 ALG_auto_exports: "Exportar Carros Argelinos"
 ALG_auto_exports_desc: "Com uma indústria automobilística nacional estável, agora podemos olhar para fora e começar a exportar veículos fabricados na Argélia para os mercados africano e mediterrâneo."
 alg.1000.t: "Escândalo de Corrupção na Indústria Automobilística"
 alg.1000.d: "Um enorme escândalo de corrupção abalou o setor automobilístico da Argélia. As investigações revelaram que muitas das chamadas 'fábricas' eram meras plantas de remontagem que abusavam de subsídios estatais e inflavam custos. A confiança pública está em colapso, e a indústria enfrenta a paralisia."
 alg.1000.a: "Uma humilhação nacional."
 ALG_tebboune_tt: "Abdelmadjid Tebboune se torna Presidente da Argélia após os protestos do Hirak de 2019. A notória (Gangue) de políticos corruptos, incluindo Ahmed Ouyahia, Abdelmalek Sellal, Ali Haddad e Mahieddine Tahkout, é presa e enfrenta a justiça. Isso marca o início de uma nova era, embora muitos duvidem de quão profundas serão de fato as reformas."
 ALG_corruption_network: "O Séquito de Bouteflika"
 ALG_corruption_network_desc: "Uma rede corrupta de políticos e empresários, incluindo Ouyahia, Sellal e Tahkout, domina a política argelina. Sua influência enfraquece o Estado e alimenta a ira popular."
 ALG_cleaning_the_state: "Limpando o Estado"
 ALG_clean_government: "Governo Limpo"
 ALG_political_repression: "Repressão Política"
 ALG_military_junta: "Junta Militar"
 ALG_cleaning_the_state_desc: "Com a queda do Séquito, a Argélia finalmente dá passos para expurgar a corrupção de suas instituições e restaurar a confiança do povo."
 algeria_reforms.1.t: "Reformas sob Tebboune"
 algeria_reforms.1.d: "Após a renúncia de Abdelaziz Bouteflika e a eleição de Abdelmadjid Tebboune, a Argélia entra em um novo capítulo político. Tebboune prometeu reformas, uma nova constituição e o desmantelamento da notória rede de corrupção conhecida como 'ʿIsābah' (a gangue), que incluía os ex-primeiros-ministros Ahmed Ouyahia e Abdelmalek Sellal e magnatas dos negócios como Ali Haddad e Mahieddine Tahkout. \n\nO movimento Hirak, no entanto, permanece cético quanto às suas promessas. Essas reformas levarão a uma verdadeira democratização, ou são apenas uma forma de preservar o regime sob nova liderança?"
 algeria_reforms.1.a: "Apoiar as Reformas de Tebboune"
 algeria_reforms.1.b: "O Povo Exige Mais!"
 ALG_arrest_the_gang: "Prender o Séquito"
 ALG_arrest_the_gang_desc: "O povo argelino exige justiça. Tebboune continuará os processos contra Ouyahia, Sellal, Haddad, Tahkout e outras figuras corruptas que drenaram a riqueza da nação."
 ALG_at_a_crossroads: "A Nação em uma Encruzilhada"
 ALG_at_a_crossroads_desc: "Enquanto nossa nação enfrenta desafios sem precedentes, estamos em um momento decisivo de nossa história. As escolhas que fizermos agora moldarão nosso futuro e determinarão o rumo de nossa sociedade. Abraçaremos a mudança e a reforma, ou nos agarraremos ao passado? O caminho que escolhermos definirá nosso legado."
 ALG_promises_of_reform: "Promessas de Reforma"
 ALG_promises_of_reform_desc: "Uma nova Argélia exige uma nova constituição. Tebboune promete reformas para limitar os mandatos presidenciais, fortalecer o parlamento e garantir mais liberdades."
 ALG_suppressed_opposition: "Oposição Reprimida"
 ALG_black_decade_methods: "Métodos da Década Negra"
 ALG_black_market: "Mercado Negro"
 ALG_pna_expansion: "Expansão do ENP"
 ALG_global_power: "Potência Global"
 ALG_crackdown_on_dissent: "Repressão ao Hirak"
 ALG_crackdown_on_dissent_desc: "Os protestos não pararam. Em vez de diálogo, Tebboune escolheu a repressão, esperando silenciar a dissidência e preservar o Estado."
 ALG_rebuild_trust_investors: "Reconstruir a Confiança dos Investidores"
 ALG_rebuild_trust_investors_desc: "Após anos de corrupção e instabilidade, devemos recuperar a confiança dos investidores estrangeiros e nacionais em nossa economia."
 ALG_diversify_economy: "Diversificar a Economia"
 ALG_diversify_economy_desc: "A Argélia não pode depender apenas de petróleo e gás. Energias renováveis, agricultura e manufatura serão os pilares de nosso futuro."
 ALG_social_subsidies: "Proteger os Subsídios Sociais"
 ALG_social_subsidies_desc: "O povo depende de subsídios para combustível, pão e moradia. Tebboune promete manter essas proteções apesar dos desafios econômicos."
 ALG_balance_regional_powers: "Equilibrar as Potências Regionais"
 ALG_balance_regional_powers_desc: "A Argélia está entre a Europa, a África e o mundo árabe. Devemos manter uma política externa equilibrada que sirva aos nossos interesses."
 ALG_strengthen_russia_ties: "Fortalecer os Laços com a Rússia"
 ALG_strengthen_russia_ties_desc: "Nossa amizade histórica com Moscou pode se aprofundar por meio da cooperação em defesa e de acordos de energia."
 ALG_china_investments: "Investimentos Chineses"
 ALG_china_investments_desc: "A Iniciativa Cinturão e Rota oferece à Argélia a chance de modernizar sua infraestrutura e atrair grandes projetos de investimento chineses."
 ALG_north_south_highway: "Projeto da Rodovia Norte-Sul"
 ALG_automobile_factories: "Indústria Automobilística"
 ALG_automobile_factories_desc: "Para empregar nossa população e ganhar mais capacidade econômica, talvez precisemos convidar fabricantes estrangeiros de automóveis para o nosso país."
 algeria_policy.1.t: "Denúncia dos Regimes Colonialistas"
 algeria_policy.1.d: "A FLN emitiu uma forte condenação dos regimes colonialistas do passado, denunciando os crimes cometidos durante a ocupação da Argélia. A declaração despertou o orgulho nacional dentro do país, mas provocou a ira de Paris, piorando as relações entre Argélia e França."
 algeria_policy.1.a: "Expor os crimes do Colonialismo!"
 algeria_disaster.1.t: "O Terremoto de Boumerdès"
 algeria_disaster.1.d: "Um terremoto devastador atingiu o norte da Argélia, com epicentro perto da cidade de Boumerdès. Milhares perderam a vida, dezenas de milhares ficaram feridos e vastas áreas de Argel e da região costeira foram reduzidas a escombros. A nação está em choque enquanto as operações de resgate lutam para dar conta da escala do desastre. É necessária ação imediata para restaurar a ordem e prestar socorro à população afetada."
 algeria_disaster.1.a: "Mobilizar equipes de resposta a emergências e iniciar a reconstrução"
 ALG_earthquake_recovery_tt: "As operações de resgate começam. O governo logo decidirá como financiar a reconstrução."
 algeria_disaster.2.t: "Esforços de Reconstrução e Recuperação"
 algeria_disaster.2.d: "As consequências do terremoto deixaram a Argélia diante de uma das piores crises humanitárias de sua história moderna. Milhares continuam sem abrigo, e a infraestrutura vital jaz em ruínas. O governo deve decidir como financiar a reconstrução, seja criando um fundo nacional de ajuda com recursos do Estado, seja buscando assistência estrangeira, que pode vir com condições políticas."
 algeria_disaster.2.a: "Criar um Fundo Estatal de Auxílio"
 ALG_state_aid_fund_tt: "Destinar recursos do Estado para reconstruir as regiões afetadas. Isso sobrecarregará o tesouro, mas fortalecerá a confiança interna no governo."
 algeria_disaster.2.b: "Buscar Assistência Estrangeira"
 ALG_foreign_aid_dependence_tt: "Solicitar ajuda de parceiros internacionais. Isso aliviará a pressão financeira, mas aumentará a influência estrangeira nos assuntos internos da Argélia."
 ALG_french_influence: "Influência Francesa nas Sombras"
 ALG_french_influence_desc: "Embora independente no papel, a política da Argélia permanece sob a sombra da influência francesa. Generais e políticos corruptos ligados a Paris moldam a tomada de decisões, limitando a verdadeira soberania."
 ALG_shadow_state: "Le Pouvoir nas Sombras"
 ALG_shadow_state_desc: "A rede oculta de generais, oficiais de inteligência e empresários, muitas vezes chamada de 'Le Pouvoir', domina a Argélia. A corrupção enfraquece o Estado, mas esse sistema paralelo garante a estabilidade política e fortalece o controle do regime sobre o poder."
 algeria_emerging_youth: "Organizações de juventude"
 algeria_nationalist_youth: "Organizações de juventude"
 algeria_nationalist_rise: "Renascimento Nacionalista"
 algeria_nationalist_rise_desc: "O nacionalismo na Argélia está mais popular do que nunca, devido à clara oposição do governo à interferência estrangeira no Estado e ao seu firme apoio à soberania e independência do país"
 algeria_cultural_rebirth: "Renascimento cultural"
 ALG_PNA_victory: "Domínio Militar"
 ALG_PNA_victory_desc: "O Armée nationale populaire (Exército Nacional Popular) é o exército da Argélia. Desde a independência do país, em 1962, teve um grande papel na política. Controlou praticamente o governo até 1988, quando foi estabelecido um sistema multipartidário. Ainda assim, mantém influência sobre a política argelina, sendo o exemplo mais recente a renúncia do presidente Abdelaziz Bouteflika em 2019, após protestos levarem à perda de apoio dos militares."
 ALG_kick_out_morocco: "Expulsar o Marrocos"
 ALG_kick_out_morocco_desc: "O Marrocos sempre nos subjugou sob seu controle e não há razão para mantermos nossos laços com eles. É a hora certa de expulsar esses inimigos ideológicos da Argélia!"
 ALG_statist_rise: "Ascensão Estatista"
 ALG_statist_rise_desc: "A economia liberal permite a exploração de nosso povo e compromete nossa independência e controle nacionais. O melhor para a Argélia é conectar todos os aspectos da economia ao Estado."
 ALG_maintain_military_role: "Manter a Influência do Exército"
 ALG_maintain_military_role_desc: "O mundo está entrando em tempos sombrios e estranhos, então temos que proteger nossa nação, não importa o custo."
 ALG_kick_out_iran: "Expulsar o Irã"
 ALG_kick_out_iran_desc: "O Irã sempre nos subjugou sob seu controle e não há razão para mantermos nossos laços com eles. É a hora certa de expulsar esses inimigos ideológicos da Argélia!"
 ALG_nationalize_oligarchic_holdings: "Nacionalizar Holdings"
 ALG_nationalize_oligarchic_holdings_desc: "Nacionalizaremos as holdings e propriedades de diversos oligarcas desonestos para fortalecer nosso controle sobre a economia."
 ALG_subsidise_police: "Subsidiar a Polícia"
 ALG_subsidise_police_desc: "A polícia é uma das coisas mais importantes para fazer nosso povo se sentir seguro e garantir nosso governo na Argélia, e tem sido muito subfinanciada. Isso precisa mudar."
 ALG_maintain_socialistic_policies: "Manter as Leis Socialistas"
 ALG_maintain_socialistic_policies_desc: "Uma coisa que o governo anterior acertou, e o motivo final de ter sido relativamente mais popular, são suas políticas socialistas que apoiavam as classes baixas. Continuaremos as políticas implementadas pelo ex-presidente Hafez al-Assad e nos apresentaremos como os verdadeiros defensores dos oprimidos."
 ALG_government_planned_economic_projects: "Projetos do Governo"
 ALG_government_planned_economic_projects_desc: "Devemos iniciar projetos públicos para melhorar nossa imagem como governo responsável e angariar o apoio das pessoas comuns."
 ALG_patriotic_propaganda: "Propaganda Patriótica"
 ALG_patriotic_propaganda_desc: "Fortaleceremos nossas posições ideológicas enfatizando a importância do orgulho nacional e da lealdade ao Estado."
 ALG_gather_support_from_peasantry: "Apoio do Campesinato"
 ALG_gather_support_from_peasantry_desc: "Os camponeses são a espinha dorsal de nossa nação e precisamos garantir que nos apoiem."
 ALG_strong_government: "Governo Forte"
 ALG_strong_government_desc: "Teremos que mostrar ao nosso povo que nosso governo é estável e capaz de governar. Isso nos permitirá ganhar sua confiança"
 ALG_expand_youth_organizations: "Expandir as Organizações de Juventude"
 ALG_expand_youth_organizations_desc: "Nossos partidos sempre se apoiaram notavelmente em organizações de juventude e, agora que estamos no poder, é hora de incentivar os jovens a apoiar nossas causas ideológicas, conquistando seus corações e mentes."
 ALG_illiberal_democracy: "Democracia Iliberal"
 ALG_illiberal_democracy_desc: "O liberalismo é um vírus que infecta e explora nações pobres. O que o povo precisa é de uma democracia verdadeira, que realmente represente o povo e, ao mesmo tempo, o una sob uma única bandeira. Somos uma democracia, aconteça o que acontecer."
 ALG_reestablish_intelligence_committee: "Restabelecer as Agências de Inteligência"
 ALG_reestablish_intelligence_committee_desc: "As guerras do futuro não são com armas e tanques, mas com informação. É nossa responsabilidade criar uma agência de inteligência plenamente funcional."
 ALG_national_security_act: "Lei de Segurança Nacional"
 ALG_national_security_act_desc: "Os grupos extremistas estão matando nossa nação lentamente e representam uma ameaça ao nosso povo. Seus ataques são uma ameaça clara à nossa nação e, se há algo a fazer, é detê-los imediatamente, custe o que custar, aconteça o que acontecer. O TERRORISMO DEVE ACABAR."
 ALG_pan_algerian_nationalism: "Pan-Argelianismo"
 ALG_pan_algerian_nationalism_desc: "A Argélia é o país que deve brilhar por toda a África do Norte com sua identidade única. Nossa rica história e cultura deixam claro que é nosso dever mostrar ao mundo nosso verdadeiro potencial e nossa identidade."
 ALG_cultural_rebirth: "Renascimento Cultural"
 ALG_cultural_rebirth_desc: "Nossa nação está, lenta mas seguramente, reconhecendo sua identidade. Divisões mesquinhas não devem impedir que se perceba a beleza de nosso povo. Nosso povo deve reconhecer que, aconteça o que acontecer, ainda somos argelinos, afinal."
 ALG_deal_with_the_trade_unions: "Um Acordo com os Sindicatos"
 ALG_deal_with_the_trade_unions_desc: "A chave de um país forte é sua produção e economia, então precisamos garantir que todos os trabalhadores da Argélia nos apoiem."
 ALG_reassert_russian_ties: "Laços com a Rússia"
 ALG_reassert_russian_ties_desc: "A Rússia é o único e verdadeiro aliado que nos ajuda a nos tornarmos uma nação moderna, segura e próspera."
 ALG_russian_oil_excavation: "Acordos de Petróleo com a Rússia"
 ALG_russian_oil_excavation_desc: "Há um grande tesouro em nossa nação, e nosso aliado, a Rússia, nos ajudará a alcançar esses recursos."
 ALG_russian_algiers_base_expansion: "Expandir a Presença Naval Russa"
 ALG_russian_algiers_base_expansion_desc: "Não podemos criar uma marinha forte imediatamente, mas nossos amigos russos nos ajudarão a manter nossas costas seguras, auxiliando na expansão das capacidades do porto."
 ALG_houarist_rise: "Ascensão Houarista"
 ALG_houarist_rise_desc: "O houarismo está ressurgindo e pronto para tornar a Argélia grande novamente."
 ALG_islamic_socialism: "Socialismo Islâmico"
 ALG_islamic_socialism_desc: "As pessoas parecem esquecer que o islã defende muitas práticas atribuídas ao socialismo, como o zakat e a sadaqa. Devemos enfatizar essa relação baseando nossos ideais nela, pois isso também angariará o apoio dos islamistas que sempre se opuseram aos nossos ideais. O socialismo islâmico é o verdadeiro caminho para fazer de nossa nação uma república moderna, forte e virtuosa."
 ALG_Get_rid_of_oligarchs: "Expurgar os Oligarcas"
 ALG_news.1.t: "A Argélia em uma Encruzilhada"
 ALG_news.1.d: "Após quase uma década de violência brutal, desintegração econômica e estagnação política, a Argélia no ano 2000 se encontra em um momento decisivo. A guerra civil, conhecida por muitos como a 'Década Negra', deixou dezenas de milhares de mortos e muitos mais deslocados. Embora a intensidade dos combates tenha diminuído, as tensões continuam altas e as feridas estão longe de cicatrizar.\n\nCom o futuro da nação incerto, forças rivais agora empurram em direções diferentes. Um caminho busca a reconciliação nacional e reformas democráticas para unificar o país. Outro se inclina a prolongar o regime de emergência, mantendo o controle do regime atual sobre o poder. Um terceiro ainda sussurra sobre a continuação da guerra, de batalhas inacabadas, promessas radicais e daqueles que se recusam a depor as armas.\n\nO caminho que a Argélia escolher a seguir pode moldar seu destino por gerações."
 ALG_news.1.a: "Todos os olhos estão em Argel."
 Arab_Defense_Bloc: "Bloco de Defesa Árabe"
 The_Maghreb_Joint_Defense: "Defesa Conjunta do Magrebe"
 ALG_bouteflika.3.t: "Crise de Saúde de Bouteflika"
 ALG_bouteflika.3.d: "Em 2013, Bouteflika sofreu um derrame debilitante. Um jornalista, Hichem Aboud, foi processado por ameaçar a segurança nacional, a integridade territorial e a gestão normal das instituições da República, e os jornais para os quais escrevia foram censurados, porque ele escreveu que o Presidente havia voltado do Val-de-Grâce em estado comatoso e havia caracterizado Saïd Bouteflika como o titereiro que comandava a administração."
 ALG_bouteflika.3.a: "O Que Vai Acontecer?"
 ALG_boteflika_tt: "Isto desbloqueará o Foco de Crise de Saúde do Presidente da Argélia"
 ALG_bouteflika: "Notícias da Crise de Saúde de Bouteflika"
 ALG_bouteflika.2.t: "Eleição presidencial argelina de 2014"
 ALG_bouteflika.2.d: "Eleições presidenciais foram realizadas na Argélia em 17 de abril de 2014. O presidente em exercício, Abdelaziz Bouteflika, foi reeleito com 82% dos votos. Os temas da campanha incluíram o desejo de estabilidade interna após a sangrenta guerra civil da década de 1990"
 ALG_bouteflika.2.a: "Bouteflika Vence"
 ALG_bouteflika_health_crisis: "Crise de Saúde de Bouteflika"
 ALG_bouteflika_health_crisis_desc: "A saúde debilitada do Presidente ameaça desestabilizar a Argélia. Vamos mantê-lo no poder ou nos preparar para uma transição?"
 ALG_2014_elections: "Eleição Presidencial de 2014"
 ALG_2014_elections_desc: "Apesar da doença, Bouteflika concorre a um quarto mandato. A oposição é silenciada, e o resultado é uma conclusão previsível."
 ALG_2014_oil_crash: "Colapso do Preço do Petróleo"
 ALG_2014_oil_crash_desc: "A queda abrupta dos preços do petróleo devasta a economia da Argélia. O povo culpa a corrupção e exige mudança."
 ALG_silence_hirak: "Esmagar os Protestos do Hirak"
 ALG_silence_hirak_desc: "Os militares e a polícia suprimirão a dissidência. As ruas correrão vermelhas, mas o regime sobreviverá."
 ALG_listen_to_hirak: "Ceder às Demandas Reformistas"
 ALG_listen_to_hirak_desc: "Prometer reformas políticas para apaziguar os manifestantes. A velha guarda resistirá, mas a ira do povo pode diminuir."
 ALG_2019_elections: "Crise Política de 2019"
 ALG_2019_elections_desc: "A candidatura de Bouteflika a um quinto mandato acende a fúria em todo o país. A Argélia explodirá em revolução ou se submeterá à tirania?"
 ALG_new_president: "Nomear um Novo Presidente"
 ALG_new_president_desc: "O movimento Hirak venceu. Um governo de transição realizará eleições livres, pondo fim a décadas de governo autoritário."
 ALG_release_political_prisoners: "Libertar os Presos Políticos"
 ALG_release_political_prisoners_desc: "Milhares de ativistas, jornalistas e figuras da oposição definham na prisão por seu papel nos protestos do Hirak. Libertá-los sinalizaria uma ruptura genuína com o antigo regime e reforçaria a legitimidade democrática."
 ALG_corrupt_successor: "Instalar um Sucessor Leal"
 ALG_corrupt_successor_desc: "Os militares garantem que um fantoche assuma o poder. O legado de corrupção de Bouteflika continua vivo."
 alg_oil_crash_title: "Os Preços do Petróleo Despencam"
 alg_oil_crash_desc: "Os preços do petróleo despencam; nossa nação sobreviverá?"
 alg_oil_crash_option: "Isso é preocupante!"
 alg_hirak_victory_title: "O Povo Vence"
 alg_hirak_victory_desc: "Após anos de protestos, Bouteflika renuncia. Uma nova era começa, mas será que durará?"
 alg_military_rule_title: "Os Generais Decidem"
 alg_military_rule_desc: "O exército instala um líder fantoche. O Hirak é esmagado, por ora."
 algeria_tebboune.1.t: "As Eleições Presidenciais de 2019"
 algeria_tebboune.1.d: "Após meses de protestos e a renúncia de Abdelaziz Bouteflika, os argelinos vão às urnas na eleição mais contenciosa em décadas. Muitos veem o processo como dominado pela velha guarda, enquanto outros se agarram à esperança de reforma ou mesmo de um renascimento islamista. Três candidatos principais despontam como favoritos: Abdelmadjid Tebboune, o candidato da continuidade ligado ao establishment; Ali Benflis, um reformista liberal com seu próprio movimento; e Abdelkader Bengrina, um líder islamista com laços com o Movimento da Sociedade pela Paz. A escolha determinará o caminho futuro da Argélia."
 algeria_tebboune.1.a: "Eleger Abdelmadjid Tebboune"
 algeria_tebboune.1.b: "Eleger Ali Benflis"
 algeria_tebboune.1.c: "Eleger Abdelkader Bengrina"
 ALG_benflis_tt: "§YAli Benflis§! se torna Presidente da Argélia, liderando os reformistas liberais."
 ALG_bengrina_tt: "§YAbdelkader Bengrina§! se torna Presidente da Argélia, representando a oposição islamista."
 kabyle_resistance_info: "A região da Cabília está em agitação. Nível de resistência: [?385.resistance|%Y]"
 kabyle_resistance_effects: "Monitore a Cabília quanto ao aumento do apoio separatista. Resistência atual: [?385.resistance|%Y]"
 ALG_kabyle_resistance_tooltip: "Nível de Resistência na Cabília:"
 ALG_suppress_kabyle: "Reprimir o Movimento Cabila"
 ALG_suppress_kabyle_desc: "A agitação cabila representa uma ameaça à soberania nacional. Não podemos permitir que a retórica secessionista floresça. Uma forte repressão pode ser a única forma de reafirmar o controle, mesmo que isso signifique enfrentar uma resistência feroz."
 ALG_recognize_kabyle: "Reconhecer a Independência da Cabília"
 ALG_recognize_kabyle_desc: "Décadas de tensão, protestos e agitação nos trouxeram a este momento. Pode ser hora de reconhecer as aspirações de independência dos cabilas. Fazê-lo encerraria a agitação imediata, mas ao custo da integridade territorial."
 ALG_recognize_tamazight: "Reconhecer o Tamazight"
 ALG_recognize_tamazight_desc: "Reconhecer o tamazight como língua oficial é uma demanda central da população cabila. Fazê-lo pode legitimar sua identidade cultural enquanto preserva a unidade nacional."
 ALG_kabyle_cultural_reforms: "Reformas Culturais Cabilas"
 ALG_kabyle_cultural_reforms_desc: "Devemos apoiar a educação, as instituições locais e os direitos culturais na região cabila para fomentar a integração e o respeito mútuo."
 ALG_internal_troops_kabyle: "Enviar Tropas Internas"
 ALG_internal_troops_kabyle_desc: "A situação na Cabília exige uma forte presença de segurança. Enviaremos tropas internas para garantir a região e reprimir a agitação."
 ALG_disrupt_kabyle_networks: "Desarticular as Redes Políticas Cabilas"
 ALG_disrupt_kabyle_networks_desc: "A atividade separatista é coordenada por redes políticas clandestinas. A desarticulação por meio de vigilância e prisões é necessária para preservar a segurança nacional."
 KBY_build_a_new_state: "Construir um Novo Estado"
 KBY_build_a_new_state_desc: "Agora independentes, devemos lançar as bases de uma república funcional. Uma constituição, a governança e os serviços sociais são prioridades máximas."
 KBY_secure_our_borders: "Proteger Nossas Fronteiras"
 KBY_secure_our_borders_desc: "Com nossa soberania declarada, devemos fortificar nossas fronteiras vulneráveis e garantir nossa sobrevivência em um ambiente hostil."
 idea_ALG_neutrality: "Neutralidade da Argélia"
 idea_ALG_neutrality_desc: "A Argélia não pode mais arcar com a guerra; a neutralidade é nossa melhor opção."
 idea_ALG_neutrality_2: "Neutralidade da Argélia"
 idea_ALG_neutrality_2_desc: ""
 ALG_a_globalized_algeria: "Uma Argélia Globalizada"
 ALG_a_globalized_algeria_desc: "Hoje vivemos uma era de globalização, da qual a Argélia deve participar."
 ALG_international_investments: "Investimentos Internacionais"
 ALG_international_investments_desc: ""
 ALG_export_driven_growth: "Crescimento Impulsionado pelas Exportações"
 ALG_export_driven_growth_desc: ""
 ALG_promote_sovereignty: "Promover a Soberania"
 ALG_promote_sovereignty_desc: ""
 ALG_promote_human_rights: "Promover os Direitos Humanos"
 ALG_promote_human_rights_desc: "Direitos humanos acima de tudo, mesmo que seja a soberania nacional."
 ALG_extract_favorable_terms: "Extrair Condições Favoráveis"
 ALG_extract_favorable_terms_desc: ""
 ALG_a_norm_entrepreneur: "Um Empreendedor de Normas"
 ALG_a_norm_entrepreneur_desc: ""
 ALG_Algeria_resplendent: "Argélia Resplandecente"
 ALG_Algeria_resplendent_desc: ""
 ALG_national_strength: "Força Nacional"
 ALG_national_strength_desc: ""
 ALG_terror_2003_hostage_title: "Crise de Reféns no Saara"
 ALG_terror_2003_hostage_desc: "Um grupo de turistas europeus foi feito refém no deserto argelino por militantes islamistas. Embora nenhuma vítima tenha sido relatada, isso marca o início de um preocupante aumento da atividade jihadista organizada."
 ALG_terror_2003_hostage_option: "Um sinal preocupante do que está por vir"
 ALG_terror_monitor: "Monitorar a Ameaça Terrorista"
 ALG_conduct_security_raids: "Realizar Operações de Segurança"
 ALG_terror_threat_category: "Monitor de Ameaça Terrorista"
 ALG_terror_2007_algiers_title: "Atentados em Argel"
 ALG_terror_2007_algiers_desc: "Um enorme atentado suicida atingiu o Palácio do Governo em Argel. Mais de 30 civis e funcionários do governo foram mortos em um dos ataques mais letais dos últimos anos."
 ALG_terror_2007_batna_title: "Atentado em Batna"
 ALG_terror_2007_batna_desc: "Um homem-bomba detonou um artefato perto de uma multidão que esperava para ver o presidente em Batna. O ataque deixou mais de 20 mortos."
 ALG_terror_2008_issers_title: "Atentado à Academia de Polícia de Issers"
 ALG_terror_2008_issers_desc: "Um ataque suicida com veículo teve como alvo recrutas da polícia na academia de Issers, matando 43 e ferindo dezenas."
 ALG_terror_generic_option: "Notícia trágica."
 ALG_terror_2000_bus_ambush_title: "Emboscada a Ônibus Perto de Médéa"
 ALG_terror_2000_bus_ambush_desc: "Militantes armados realizaram uma emboscada mortal a um ônibus de passageiros perto de Médéa. Dezenove civis perderam a vida. Este ataque sinaliza a continuidade da instabilidade no período pós-guerra civil."
 ALG_terror_2002_tazmalt_title: "Atentado em Tazmalt"
 ALG_terror_2002_tazmalt_desc: "Uma bomba explodiu em Tazmalt, matando e ferindo vários civis. As forças de segurança suspeitam de remanescentes do GSPC."
 ALG_terror_2002_miliana_title: "Atentado em Miliana"
 ALG_terror_2002_miliana_desc: "Um artefato explosivo improvisado à beira da estrada detonou perto de Miliana, ferindo vários soldados."
 ALG_terror_2002_hammam_title: "Atentado em Hammam Righa"
 ALG_terror_2002_hammam_desc: "Um artefato explosivo caseiro detonou em Hammam Righa, tendo como alvo um comboio militar."
 ALG_terror_2002_larbaa_title: "Atentado em Larbaa"
 ALG_terror_2002_larbaa_desc: "Militantes detonaram uma bomba em Larbaa, dando continuidade à sua campanha contra as autoridades estatais."
 ALG_terror_2002_msila_title: "Atentado em M'Sila"
 ALG_terror_2002_msila_desc: "Um artefato explosivo improvisado explodiu em M'Sila, demonstrando ainda mais a persistência das redes terroristas na região."
 ALG_terror_2003_tizi_title: "Atentado em Tizi Ouzou"
 ALG_terror_2003_tizi_desc: "Uma explosão mortal ocorreu em Tizi Ouzou. Civis estavam entre os mortos, e as forças de segurança suspeitam do envolvimento do GSPC."
 ALG_terror_2004_tebessa_title: "Atentado em Tebessa"
 ALG_terror_2004_tebessa_desc: "Um atentado coordenado em Tebessa matou 7 pessoas. A crescente escala dos ataques é alarmante."
 ALG_idea_arab_diplomacy: "Diplomacia Árabe"
 ALG_terror_2005_tidjelabine_title: "Atentado em Tidjelabine"
 ALG_terror_2005_tidjelabine_desc: "Dois gendarmes foram mortos em Tidjelabine depois que um carro-bomba atingiu sua patrulha."
 ALG_relying_on_our_own_strength_spirit: "Confiando em Nossa Própria Força"
 ALG_relying_on_our_own_strength_spirit_desc: "A Argélia só precisa dos argelinos para prosperar, de mais ninguém."
 ALG_hydroelectric_power_plants_upgraded_idea: "§RSonatrach§! - Usinas Hidrelétricas Modernizadas"
 FLN_nationalize_resources: "Nacionalizar os Recursos"
 FLN_nationalize_resources_desc: "Os recursos naturais da Argélia são a chave de sua soberania e prosperidade. Ao nacionalizar nossos recursos, podemos garantir que a riqueza gerada pelo petróleo, gás e minerais beneficie diretamente o povo argelino, lançando as bases da independência econômica de longo prazo."
 ALG_revivify_non_aligned_movement: "Revitalizar o Movimento Não Alinhado"
 ALG_revivify_non_aligned_movement_desc: "Como membro orgulhoso do Movimento Não Alinhado, a Argélia deve revigorar esse bloco de nações independentes. Ao fortalecer os laços com outros Estados neutros, podemos resistir ao domínio das superpotências e trilhar um caminho de verdadeira soberania em um mundo dividido."
 ALG_reach_out_ASEAN: "Aproximar-se da ASEAN"
 ALG_reach_out_ASEAN_desc: "As nações do Sudeste Asiático compartilham nosso desejo de desenvolvimento livre de interferência estrangeira. Estabelecer uma cooperação mais estreita com a ASEAN abrirá novas oportunidades econômicas e reforçará uma ordem mundial multipolar."
 ALG_support_developing_world: "Apoiar o Mundo em Desenvolvimento"
 ALG_support_developing_world_desc: "A Argélia se solidariza com as nações oprimidas e empobrecidas. Por meio de ajuda econômica, intercâmbios técnicos e defesa diplomática, podemos ajudar a elevar o Sul Global e desafiar a exploração neocolonial."
 ALG_between_east_and_west: "Entre o Oriente e o Ocidente"
 ALG_between_east_and_west_desc: "Presa entre blocos rivais, a Argélia deve navegar com cuidado. Ao manter relações equilibradas com as potências capitalistas e socialistas, podemos garantir investimentos vitais sem entregar nossa independência a nenhum dos campos."
 ALG_mediate_great_power_conflict: "Mediar o Conflito entre as Grandes Potências"
 ALG_mediate_great_power_conflict_desc: "À medida que as tensões entre as superpotências aumentam, a Argélia pode atuar como mediadora imparcial. Nossa neutralidade e autoridade moral nos posicionam para reduzir crises e promover a coexistência pacífica em um mundo cada vez mais instável."
 ALG_promote_reconciliation: "Promover a Reconciliação"
 ALG_promote_reconciliation_desc: "Da África ao Oriente Médio, conflitos assolam povos irmãos. A Argélia, com sua herança revolucionária e experiência diplomática, deve fomentar o diálogo e a unidade entre as nações divididas."
 ALG_secure_balance: "Garantir o Equilíbrio"
 ALG_secure_balance_desc: "Em um mundo de hegemonias concorrentes, o equilíbrio é nossa salvaguarda. Calibrando cuidadosamente nossa política externa, podemos impedir o domínio de qualquer potência isolada enquanto extraímos o máximo de benefícios de todas."
 ALG_joining_brics: "Ingressar no BRICS"
 ALG_joining_brics_desc: "A Argélia busca fortalecer sua influência global ao ingressar no grupo BRICS de economias emergentes, ampliando tanto o crescimento econômico quanto a cooperação política."
 ALG_align_with_brazil: "Fortalecer os Laços com o Brasil"
 ALG_align_with_brazil_desc: "O Brasil, assim como a Argélia, busca um caminho independente nos assuntos mundiais. Ao aprofundar nossa parceria com esse gigante sul-americano, podemos ampliar o comércio de agricultura e tecnologia, apresentando uma frente unida contra pressões neocoloniais em fóruns globais."
 ALG_align_with_india: "Forjar uma Parceria Estratégica com a Índia"
 ALG_align_with_india_desc: "A postura não alinhada da Índia e seu crescente poder industrial a tornam uma aliada natural. Colaborar em projetos de energia, intercâmbios militares e na diplomacia da ONU fortalecerá nossas duas nações contra o domínio das superpotências, ao mesmo tempo que fomenta a cooperação Sul-Sul."
 ALG_islamic_monarchy_idea: "Monarquia Islâmica"
 ALG_islamic_monarchy_idea_desc: "A Argélia restaurou uma monarquia divina enraizada nos princípios islâmicos e na tradição nacional."
 ALG_caliph_crowned: "Califa Coroado"
 ALG_caliph_crowned_desc: "O Califa governa não apenas pela lei, mas pela vontade do povo e pelo legado da fé."
 ALG_amir_al_muminin_idea: "Amir al-Mu'minin"
 ALG_amir_al_muminin_idea_desc: "Comandante dos Fiéis, um título com peso espiritual e político em todo o mundo islâmico."
 ALG_maghreb_alliance_idea: "Pilares do Magrebe"
 ALG_maghreb_alliance_idea_desc: "A Argélia lidera um esforço para unificar o mundo islâmico ocidental sob uma nova ordem religiosa e política."
 ALG_restore_caliphate_in_algiers: "Restaurar o Califado em Argel"
 ALG_restore_caliphate_in_algiers_desc: "A república fracassou. Chegou a hora de restaurar uma monarquia divina, enraizada na fé e na história. De Argel, um novo Califado se erguerá."
 ALG_crown_the_caliph: "Coroar o Califa"
 ALG_crown_the_caliph_desc: "Um herdeiro legítimo do Califado foi escolhido. Com uma cerimônia em Argel, a coroa será restaurada e o mundo reconhecerá o novo Amir al-Mu'minin."
 ALG_amir_al_muminin: "O Amir al-Mu'minin"
 ALG_amir_al_muminin_desc: "Declaramos o Califa como Amir al-Mu'minin, o Comandante dos Fiéis. Este título lhe confere legitimidade espiritual e política em todo o mundo islâmico."
 ALG_umayyad_legacy: "Declarar o Legado Omíada"
 ALG_umayyad_legacy_desc: "A Argélia invoca a memória dos omíadas, cuja glória um dia se estendeu por continentes. Posicionamo-nos como herdeiros de seu legado."
 ALG_reclaim_al_andalus: "Reconquistar Al-Andalus"
 ALG_reclaim_al_andalus_desc: "As terras de Al-Andalus foram um dia a joia do mundo islâmico. Chegou a hora de reconquistá-las e reviver nossa antiga civilização na Ibéria."
 ALG_reclaim_the_crown: "Reivindicar a Coroa"
 ALG_reclaim_the_crown_desc: "Chegou a hora de restaurar uma monarquia legítima, guiada pelo divino e enraizada na legitimidade islâmica. Nas cinzas do fracasso republicano e da guerra civil, ressuscitaremos a coroa histórica, unindo a nação sob um estandarte real de fé, ordem e herança. Seja um sucessor abássida, uma dinastia berbere revivida ou um símbolo de uma nova unidade islâmica, a coroa voltará a brilhar sobre a Argélia."
 ALG_pillars_of_the_maghreb: "Os Pilares do Magrebe"
 ALG_pillars_of_the_maghreb_desc: "A Argélia busca a unidade com seus irmãos do oeste, o Marrocos e a Tunísia, para formar a base de um bloco islâmico unido no Norte da África."
 ALG_monarchy_tt: "§OComo novo Monarca da Argélia, cobramos a Jizya e o Zakat dos fiéis. Pela orientação de Alá, continuaremos nosso governo.§!"
 ALG_recovering_from_the_civil_war: "Recuperação da Guerra Civil"
 ALG_recovering_from_the_civil_war_desc: "A Guerra Civil Argelina deixou cicatrizes profundas na nação. Embora o conflito tenha terminado, seus efeitos persistem, influenciando o cenário político e a psique nacional. Anos após a guerra civil, a Argélia ainda lida com suas sombras. As feridas do conflito ainda não cicatrizaram por completo, mas a nação permanece determinada a reconstruir."
 MSP_non_aligned_revival: "Reviver a Política Externa Não Alinhada"
 MSP_non_aligned_revival_desc: "Reviveremos o espírito de neutralidade e solidariedade com o sul, como na década de 1960."
 MSP_global_south_solidarity: "Solidariedade com o Sul Global"
 MSP_global_south_solidarity_desc: "A Argélia fortalecerá os laços com as nações pós-coloniais por meio do comércio, da diplomacia e da ajuda."
 MSP_north_africa_first: "Norte da África em Primeiro Lugar"
 MSP_north_africa_first_desc: "Concentraremos nossos esforços em liderar a diplomacia e o desenvolvimento em nossa região imediata."
 MSP_western_sahara_position: "Apoiar o Saara Ocidental"
 MSP_western_sahara_position_desc: "Reafirmamos nosso apoio à independência saaraui contra as reivindicações marroquinas."
 MSP_african_union_engagement: "Ingressar na União Africana"
 MSP_african_union_engagement_desc: "A Argélia deve reingressar e assumir um papel de liderança na diplomacia continental."
 MSP_sahel_initiatives: "Expandir-se para o Sahel"
 MSP_sahel_initiatives_desc: "Combateremos a instabilidade e o terrorismo no Sahel por meio de poder brando e de defesa."
 MSP_arab_world_outreach: "Aprofundar os Laços Diplomáticos Árabes"
 MSP_arab_world_outreach_desc: "Para fortalecer a influência da Argélia no mundo árabe, devemos revitalizar nossos esforços de aproximação e coordenação diplomática. Por meio de visitas bilaterais, cúpulas e iniciativas comerciais, a Argélia pode se afirmar como uma força unificadora na região."
 MSP_join_arab_league: "Fortalecer o Engajamento na Liga Árabe"
 MSP_join_arab_league_desc: "Como membro da Liga Árabe, a Argélia pode ir além da participação e assumir um papel diplomático de liderança. Promover a coordenação econômica, consultas de defesa e solidariedade cultural elevará nossa posição no mundo árabe."
 MSP_support_palestine: "Apoiar a Causa Palestina"
 MSP_support_palestine_desc: "A Argélia há muito apoia a luta palestina pela autodeterminação. Um renovado apoio diplomático, ajuda humanitária e defesa internacional reafirmarão nossa posição de princípios em defesa dos direitos palestinos."
 MSP_algeria_algiers_axis: "Forjar o Eixo Egito-Argel"
 MSP_algeria_algiers_axis_desc: "Ao se alinhar mais estreitamente com o Egito, a Argélia pode ajudar a formar um poderoso bloco regional capaz de guiar a unidade árabe, garantir a estabilidade do Norte da África e contrabalançar a influência estrangeira."
 MSP_condemn_israel: "Condenar as Ações de Israel"
 MSP_condemn_israel_desc: "Diante da agressão contínua e das violações de direitos humanos, a Argélia condenará formalmente as ações de Israel no cenário internacional, mobilizando apoio a uma paz justa e opondo-se à normalização sem resolução."
 MSP_palestinian_aid_package: "Pacote de Ajuda aos Palestinos"
 MSP_palestinian_aid_package_desc: "Destinaremos recursos para prestar assistência humanitária, econômica e técnica aos territórios palestinos, garantindo que o compromisso da Argélia vá além das palavras e se traduza em ajuda real e impactante."
 MSP_pan_african_defense_initiative: "Iniciativa de Defesa Pan-Africana"
 MSP_pan_african_defense_initiative_desc: "Para proteger a soberania africana e aumentar a estabilidade continental, a Argélia proporá uma iniciativa coordenada de defesa africana que construa prontidão militar coletiva contra ameaças compartilhadas."
 MSP_send_troops_to_sahel: "Enviar Forças ao Sahel"
 MSP_send_troops_to_sahel_desc: "Em resposta à crescente instabilidade no Sahel, a Argélia enviará tropas para apoiar operações de manutenção da paz, proteção de fronteiras e campanhas antiterrorismo em colaboração com os governos da região."
 MSP_sahel_stabilization_force: "Força de Estabilização do Sahel"
 MSP_sahel_stabilization_force_desc: "A Argélia assumirá a liderança no estabelecimento de uma Força de Estabilização do Sahel permanente, uma estrutura de segurança liderada por africanos para combater insurgências e redes criminosas na região."
 MSP_exploit_sahel_resources: "Explorar os Recursos do Sahel"
 MSP_exploit_sahel_resources_desc: "A influência argelina no Sahel oferece acesso a recursos naturais inexplorados. Negociando contratos de mineração e infraestrutura, podemos garantir ganhos econômicos e parcerias estratégicas na região."
 MSP_propose_maghreb_union: "Propor a União do Magrebe"
 MSP_propose_maghreb_union_desc: "É hora de reviver a visão de um Magrebe unido. A Argélia tomará a iniciativa de propor esforços renovados de integração, com foco na cooperação econômica, na infraestrutura conjunta e no alinhamento diplomático."
 MSP_economic_integration_initiative: "Integração Econômica do Magrebe"
 MSP_economic_integration_initiative_desc: "Por meio da redução de tarifas, do investimento em infraestrutura e de discussões sobre política monetária sincronizada, a Argélia impulsionará os esforços para criar uma zona econômica comum do Magrebe que beneficie todos os Estados membros."
 MSP_maghreb_joint_defense_pact: "Pacto de Defesa Conjunta do Magrebe"
 MSP_maghreb_joint_defense_pact_desc: "Um Magrebe seguro exige defesa coletiva. Proporemos um pacto militar regional focado na proteção das fronteiras, no compartilhamento de inteligência e em exercícios militares conjuntos."
 MSP_mediterranean_dialogue: "O Diálogo Mediterrâneo"
 MSP_invite_iraq: "Convidar o Iraque"
 MSP_invite_iraq_desc: "Precisamos convidar o Iraque para nossa aliança, pois eles estão aos poucos se organizando, e nos beneficiaríamos seriamente da cooperação mútua"
 MSP_invite_syria: "Convidar a Síria"
 MSP_invite_syria_desc: "Ter a Síria logo ao sul de nossa nação nos deixa muito vulneráveis. Convidar a Síria para nossa facção seria uma ótima forma de garantir nossa segurança e proteção"
 MSP_invite_algeria: "Convidar o Egito"
 MSP_invite_algeria_desc: "O Egito é uma potência em ascensão e, com uma população desse tamanho, nossa aliança poderá alcançar praticamente qualquer coisa"
 MSP_assistance_to_bulgaria: "Assistência à Bulgária"
 MSP_assistance_to_bulgaria_desc: "Devemos ajudar a Bulgária a desenvolver sua infraestrutura, para que possamos realizar mais investimentos além de suas fronteiras com facilidade"
 MSP_supp_plo: "Apoiar a OLP"
 MSP_supp_plo_desc: "A Organização para a Libertação da Palestina (OLP) há muito é um ator-chave na luta pela autodeterminação palestina. Apoiar a OLP poderia reforçar nossa posição junto a aliados internacionais e promover uma resolução pacífica do conflito."
 MSP_the_pal_issue: "A Questão Palestina"
 MSP_the_pal_issue_desc: "A questão da Palestina continua sendo um tema central em nossa política externa. Nossa posição sobre a luta palestina definirá nossas alianças internacionais e nossa influência na região. Devemos decidir como lidar com esse conflito em curso."
 MSP_supp_hamas: "Apoiar o Hamas"
 MSP_supp_hamas_desc: "O Hamas representa uma facção significativa dentro da resistência palestina. Ao prestar apoio, podemos fortalecer nossos laços com esse grupo, aumentando nossa influência na região e nos alinhando à sua luta."
 MSP_Get_rid_of_military_corrupt: "Expurgar os Militares Corruptos"
 MSP_Get_rid_of_military_corrupt_desc: "Os militares estão entrincheirados em nossas instituições e são uma ameaça clara ao futuro do nosso país. Vamos prendê-los por acusações de corrupção e confiscar as propriedades que conseguirmos"
 MSP_reverse_secularization: "Reverter a Secularização"
 MSP_arm_palestinians_to_fight: "Armar os Palestinos"
 MSP_arm_palestinians_to_fight_desc: "A Jordânia abriga uma grande população de refugiados palestinos. Podemos transformar esses refugiados em combatentes e incitá-los a causar estragos na Palestina e em Israel. Como são combatentes por procuração, podemos usá-los para incitar Israel a retaliar, fazendo-os parecer os vilões do conflito"
 MSP_zionist_threat: "A Ameaça Sionista"
 MSP_zionist_threat_desc: "Israel é a maior afronta a todos os muçulmanos e um Estado falso abominável no coração do Islã. Eles precisam ser varridos da face da terra."
 ALG_kabyle_issue: "Questão Cabila"
 ALG_kabyle_issue_map: "Satisfação do Povo Amazigh [KBY.GetFlag] com o nosso Governo!"
 ALG_2014_oil_crash_idea: "Crash do Petróleo"
 ALG_algeria_resplendent: "Argélia Resplandecente"
 ALG_algeria_resplendent_desc: ""
 KBY_new_state_born: "Nasce um Novo Estado"
 KBY_new_state_born_desc: "A Cabília renasceu como uma nação soberana. Os primeiros dias de nossa independência devem ser marcados por consolidação, celebração e cautela."
 KBY_border_readiness: "Prontidão nas Fronteiras"
 KBY_border_readiness_desc: "Devemos proteger o perímetro de nossa pátria para evitar infiltrações, contrabando ou incursões."
 KBY_new_institutions: "Novas Instituições"
 KBY_new_institutions_desc: "Um Estado funcional deve se apoiar na base de instituições confiáveis e estáveis."
 KBY_state_economy_plan: "Plano Econômico do Estado"
 KBY_state_economy_plan_desc: "Devemos delinear a estrutura de nossa economia, seja ela centralizada, orientada pelo mercado ou mista."
 KBY_african_diplomacy: "Diplomacia Africana"
 KBY_african_diplomacy_desc: "Buscar legitimidade regional entre os vizinhos africanos reforçará nossa posição e nossas oportunidades econômicas."
 KBY_international_recognition_campaign: "Campanha de Reconhecimento Internacional"
 KBY_international_recognition_campaign_desc: "Nossa sobrevivência depende da legitimidade aos olhos de outras nações. Lançar um esforço diplomático direcionado."
 KBY_international_recognition_campaign_completion: "Canais diplomáticos abertos; agora começa o árduo trabalho de persuasão."
 KBY_establish_governance_structures: "Estabelecer Estruturas de Governança"
 KBY_establish_governance_structures_desc: "Instituições devem ser criadas para garantir que nossos princípios de governo perdurem."
 KBY_establish_governance_structures_completion: "As instituições governamentais agora estão operacionais, prontas para servir a nossos cidadãos."
 KBY_plan_the_economy: "Planejar a Economia"
 KBY_plan_the_economy_desc: "Decidir nosso futuro econômico: liderado pelo Estado, liberal ou misto. Cada caminho oferece compensações únicas."
 KBY_plan_the_economy_completion: "O planejamento econômico está em andamento; escolha com sabedoria para a prosperidade de longo prazo."
 KBY_seek_regional_support: "Buscar Apoio Regional"
 KBY_seek_regional_support_desc: "O apoio de nossos vizinhos e da comunidade africana fortalecerá nossa legitimidade."
 KBY_seek_regional_support_completion: "Esforços de aproximação regional lançados; agora aguardamos respostas."
 KBY_secure_internal_stability: "Garantir a Estabilidade Interna"
 KBY_secure_internal_stability_desc: "Com as ameaças externas sob controle, devemos lidar com a dissidência e a resistência internas."
 KBY_secure_internal_stability_completion: "Protocolos de segurança ativados; a ordem pública melhorou."
 KBY.10.t: "Estabelecendo Relações Internacionais"
 KBY.10.d: "Com nossa independência agora reconhecida pela comunidade internacional, é hora de a Cabília estabelecer relações diplomáticas formais com outras nações. Nossos diplomatas estão preparados para procurar parceiros em potencial, começando pela França, dados os nossos laços históricos, e pela Turquia, que demonstrou interesse na causa amazigh.\n\nEsse esforço diplomático ajudará a legitimar nossa jovem nação e abrirá portas para a cooperação futura."
 KBY.10.a: "Procuraremos todas as nações!"
 KBY.15.t: "Em Busca da Unidade Africana"
 KBY.15.d: "Nossa iniciativa de diplomacia africana preparou o terreno para uma integração mais profunda com o continente. A União Africana representa um fórum importante para nossa nação; a adesão proporcionaria legitimidade, oportunidades econômicas e uma plataforma para defender os direitos amazigh em todo o Norte da África.\n\nO Níger, com sua significativa população tuaregue, manifestou apoio à nossa candidatura."
 KBY.15.a: "Candidatar-se à União Africana"
 KBY_diplomatic_move: "Ofensiva Diplomática Cabila"
 KBY_au_membership_attempt: "Tentativa de Adesão Cabila à UA"
 KBY_state_economy_model_statist: "Economia Liderada pelo Estado"
 KBY_state_economy_model_liberal: "Economia de Mercado Liberal"
 KBY_state_economy_model_mixed: "Modelo Econômico Misto"
 ALG_recover_from_the_war: "Recuperação da Guerra Civil"
 ALG_restoring_order: "Restaurando a Ordem"
 ALG_restoring_order_desc: "A prioridade imediata é restabelecer a autoridade do Estado e conter o caos que persiste em algumas regiões. A população anseia por paz e estrutura após anos de devastação."
 ALG_secure_weapons_shipments: "Garantir os Carregamentos de Armas"
 ALG_secure_weapons_shipments_desc: "Garantir que nosso exército esteja bem abastecido nos permitirá manter a ordem interna e evitar o ressurgimento da insurgência."
 ALG_recover_from_the_war_desc: "Devemos agora iniciar o longo processo de reconstrução de nossa nação. A Década Negra marcou a Argélia, mas com determinação podemos renascer das cinzas."
 ALG_restoring_the_broken_economy: "Reviver a Economia Nacional"
 ALG_restoring_the_broken_economy_desc: "A guerra civil paralisou nossas instituições financeiras. Devemos implementar medidas de emergência para estabilizar a economia."
 ALG_arresting_extremists: "Neutralizar as Ameaças Armadas"
 ALG_arresting_extremists_desc: "Grupos extremistas ainda atuam em áreas remotas. Uma nova campanha de segurança restaurará o controle nacional total."
 ALG_economic_recovery: "Recuperação Econômica"
 ALG_economic_recovery_desc: "Nossas políticas começam a dar resultados. Estamos agora entrando em uma fase de recuperação gradual e de reconstrução da confiança."
 ALG_regain_banks: "Restaurar a Confiança no Setor Bancário"
 ALG_regain_banks_desc: "Reviver o setor bancário é crucial para restaurar a confiança dos investidores e reiniciar o crédito interno."
 ALG_financial_reform: "Reformar o Sistema Financeiro"
 ALG_financial_reform_desc: "Modernizar o sistema financeiro da Argélia incentivará o crescimento sustentável e nos permitirá evitar choques futuros."
 ALG_begin_full_recovery: "Iniciar a Restauração Econômica Plena"
 ALG_begin_full_recovery_desc: "Com a segurança garantida e a economia estabilizada, podemos agora iniciar um renascimento econômico pleno e em todo o país."
 ALG_repairing_the_roads: "Reparar a Infraestrutura"
 ALG_repairing_the_roads_desc: "Estradas, pontes e linhas de comunicação colapsaram. Reconstruir nossa rede logística é essencial para a coesão nacional."
 ALG_rebuild_north: "Reconstruir a Cabília e Argel"
 ALG_rebuild_north_desc: "Esses centros urbanos estiveram entre os mais atingidos. Deve-se dar prioridade à restauração dos serviços básicos na Cabília e em Argel."
 ALG_rebuild_centre: "Reconstruir as Terras Altas"
 ALG_rebuild_centre_desc: "As terras altas centrais foram ao mesmo tempo campo de batalha e crise humanitária. Precisam de uma reconstrução direcionada."
 ALG_rebuild_west: "Reconstruir o Oeste"
 ALG_rebuild_west_desc: "A infraestrutura no Oeste foi negligenciada mesmo antes da guerra. É hora de integrar essas regiões remotas."
 ALG_rebuild_algeria: "Reconstruir a Argélia"
 ALG_rebuild_algeria_desc: "É hora de reconstruir nossa nação e voltar a ser uma grande potência; esta guerra civil causou feridas demais; agora é hora de curar"
 ALG_rebuild_south: "Reconstruir o Sul"
 ALG_rebuild_south_desc: "A infraestrutura no Sul foi negligenciada mesmo antes da guerra. É hora de integrar essas regiões remotas."
 ALG_order_restored_in_algeria: "Ordem Restaurada na Argélia"
 ALG_order_restored_in_algeria_desc: "Pela primeira vez em décadas, a Argélia está estável e unida. O caminho pela frente é longo, mas a paz voltou."
 ALG_state_and_imf_funding: "Financiamento do Estado e do FMI"
 ALG_state_and_imf_funding_desc: "Por meio de empréstimos e ajuda externa, especialmente do FMI, podemos injetar vida em nossa economia estagnada."
 ALG_restocking_factories: "Reabastecer as Fábricas"
 ALG_restocking_factories_desc: "Muitas fábricas foram danificadas ou esvaziadas. Com novos suprimentos, podemos reiniciar a produção."
 ALG_rebuilding_factories: "Reconstruir as Zonas Industriais"
 ALG_rebuilding_factories_desc: "Várias zonas industriais ficaram em ruínas. Reconstruí-las gerará empregos e produzirá os materiais necessários para a recuperação."
 ALG_export_controls: "Controles de Exportação e Ajuda da Federação"
 ALG_export_controls_desc: "Para proteger bens estratégicos e garantir o desenvolvimento interno, imporemos restrições temporárias à exportação, equilibradas pelo apoio externo."
 ALG_post_war_recovery: "Recuperação Pós-Guerra Civil"
 ALG_post_war_recovery_desc: "A Argélia continua marcada pelo brutal conflito civil da década de 1990. Embora a paz tenha sido restaurada, a nação ainda sofre com a instabilidade, fábricas subutilizadas, infraestrutura sobrecarregada e um sistema político frágil."
 ALG_imf_funding_idea: "Financiamento de Emergência do FMI"
 ALG_imf_funding_idea_desc: "O Fundo Monetário Internacional interveio para fornecer liquidez e alívio orçamentário muito necessários. Embora esses fundos ajudem a estabilizar a economia, vêm com condicionantes."
 ALG_export_controls_idea: "Controles de Exportação"
 ALG_export_controls_idea_desc: "Para priorizar a recuperação interna, o governo impôs restrições à exportação de materiais-chave. Essa política estabiliza os mercados internos, mas pode prejudicar as relações comerciais internacionais."
 ALG_anti_terror_sweeps: "Operações Antiterrorismo"
 ALG_anti_terror_sweeps_desc: "As forças de segurança estão realizando operações agressivas para eliminar os elementos extremistas remanescentes. Embora isso melhore a segurança nacional, deve ser equilibrado para evitar a supressão das liberdades civis."
 ALG_banking_confidence_restored: "Confiança no Setor Bancário Restaurada"
 ALG_banking_confidence_restored_desc: "Após um período de severa desconfiança e estagnação, o setor bancário recuperou alguma estabilidade, permitindo que cidadãos e investidores voltem a se engajar com o sistema financeiro da Argélia."
 ALG_structural_reform: "Reformas Econômicas Estruturais"
 ALG_structural_reform_desc: "Reformas abrangentes estão em andamento para modernizar a economia da Argélia. Essas mudanças visam reduzir a inflação, simplificar as instituições e promover o crescimento de longo prazo."
 ALG_national_recovery_completed: "Recuperação Nacional Concluída"
 ALG_national_recovery_completed_desc: "Com a infraestrutura reconstruída, a segurança garantida e a economia revivida, a Argélia finalmente emergiu de seu capítulo mais sombrio. Começa uma nova era de esperança e progresso."
 ALG_mastering_atom: "Dominando o Átomo"
 ALG_missile_chi_TT: "A Argélia modernizará sua tecnologia de §HReator Nuclear§!"
 CHI_rejected_ALG: " Oferta Rejeitada pela China"
 ALG_technological_ties: "Laços Tecnológicos"
 ALG_continue_1991_program: "Continuar o Programa Nuclear de 1991"
 ALG_continue_1991_program_desc: "Embora nosso programa nuclear tenha sido suspenso na década de 1990, suas bases permanecem. Reviver os antigos projetos nos permite buscar tanto segurança energética quanto maior independência, embora sanções internacionais provavelmente se sigam."
 ALG_seek_china_help: "Buscar Assistência Chinesa"
 ALG_seek_china_help_desc: "A China há muito está disposta a cooperar com a Argélia em tecnologia nuclear. Uma parceria renovada nos fornecerá equipamentos, conhecimento e treinamento que contornam as restrições ocidentais."
 ALG_1983_deal: "Reviver o Acordo de Mísseis de 1983"
 ALG_1983_deal_desc: "Nossa cooperação anterior com a China em 1983 nos proporcionou tecnologia de mísseis e assistência nuclear limitada. Reviver esse acordo aceleraria nossas ambições nucleares civis e militares."
 ALG_missile_cooperation: "Ampliar a Cooperação em Mísseis"
 ALG_missile_cooperation_desc: "Além de reatores e combustível, a China também pode nos fornecer sistemas de mísseis capazes de transportar ogivas nucleares. Esse passo, porém, atrairá séria atenção do Ocidente."
 ALG_hoggar_nuclear_facility: "Construir a Instalação de Hoggar"
 ALG_hoggar_nuclear_facility_desc: "No fundo das montanhas de Hoggar, uma instalação nuclear segura pode ser construída, protegida de interferências externas. Ela será o centro do programa nuclear da Argélia."
 ALG_the_search_for_uranium: "A Busca por Urânio"
 ALG_the_search_for_uranium_desc: "Nossos cientistas estão convencidos de que o vasto deserto da Argélia esconde grandes reservas de urânio. Localizar e extrair esses depósitos fornecerá a espinha dorsal de qualquer projeto nuclear independente."
 ALG_dig_in_tamanrasset: "Escavar em Tamanrasset"
 ALG_dig_in_tamanrasset_desc: "As planícies desérticas de Tamanrasset escondem depósitos significativos de urânio. Investindo em infraestrutura de mineração aqui, a Argélia pode se libertar da dependência de fornecedores estrangeiros."
 ALG_withdrawal_from_npt: "Retirar-se do TNP"
 ALG_withdrawal_from_npt_desc: "A Argélia não pode mais permitir que sua soberania seja limitada por tratados estrangeiros. Ao se retirar do Tratado de Não Proliferação Nuclear, declaramos nossa intenção de buscar armas nucleares abertamente."
 ALG_wmds: "Armas de Destruição em Massa"
 ALG_wmds_desc: "Com as instalações de enriquecimento concluídas e os mísseis prontos, chegou a hora de finalizar a dissuasão nuclear da Argélia. O mundo tomará nota, e nossos inimigos pensarão duas vezes antes de nos ameaçar."
 ALG_algiers_agreement: "O Acordo de Argel"
 ALG_algiers_agreement_desc: "Em vez de buscar o armamento nuclear, a Argélia pode se apresentar como defensora da paz. O Acordo de Argel servirá como um compromisso de contenção, abrindo as portas ao investimento estrangeiro e à legitimidade internacional."
 ALG_sign_BWC: "Assinar a Convenção sobre Armas Biológicas"
 ALG_sign_BWC_desc: "Ao aderir a acordos internacionais contra armas de destruição em massa, demonstramos o compromisso da Argélia com a paz. Isso tranquilizará os investidores estrangeiros e reduzirá as suspeitas sobre nossas atividades nucleares."
 ALG_build_nuclear_reactor: "Construir um Reator Nuclear"
 ALG_build_nuclear_reactor_desc: "Nosso programa nuclear está pronto para dar o próximo passo. Ao construir um reator em escala real, a Argélia obterá tanto uma poderosa fonte de energia quanto uma fachada para novas atividades de enriquecimento. Embora o mundo possa ver intenções pacíficas, a realidade pode ser bem mais complexa."
 ALG_IAEA_safeguards_leave: "Salvaguardas da AIEA Concluídas"
 ALG_IAEA_safeguards_leave_desc: "Após anos de supervisão e conformidade, a Argélia implementou plenamente seus compromissos sob o Acordo de Argel e a Convenção sobre Armas Biológicas. Com os últimos inspetores da AIEA deixando nosso território, as sanções são suspensas e nossa nação é reconhecida como uma potência regional responsável."
 sanctioned_algeria: "Sanções"
 ALG_hoggar_nuclear_facility_idea: "Instalação Nuclear de Hoggar"
 ALG_algeria_behave_TT: "[USA.GetFlag] Os §HEstados Unidos§! provavelmente §Gsuspenderão§! as sanções econômicas"
 nuclear_algeria.1.t: "Possível Fornecedor?"
 nuclear_algeria.1.d: "Em nossa busca por tecnologia nuclear, devemos aceitar o fato de que simplesmente não atingimos o nível de sofisticação necessário para produzir armas ou instalações adequadas. Assim, devemos olhar para o mundo e ver quem está disposto a nos ajudar, e nossas fontes dizem que podemos pedir ajuda a uma nação em particular."
 nuclear_algeria.1.a: "Contatar os Chineses"
 nuclear_algeria.2.t: "A Argélia Solicita Assistência"
 nuclear_algeria.2.d: "Cientistas e diplomatas argelinos se reuniram recentemente com os nossos, solicitando assistência com seu programa nuclear. Declararam que estariam dispostos a aceitar qualquer coisa que lhes fornecêssemos, desde que os ajude a desenvolver seu programa nuclear."
 nuclear_algeria.2.a: "Certo"
 nuclear_algeria.2.b: "Não podemos compartilhar nossos segredos"
 nuclear_algeria.3.t: "A China Compartilha Tecnologia de Mísseis"
 nuclear_algeria.3.d: "Cientistas chineses se reuniram recentemente com os nossos em [ALG.capital.GetCapitalVictoryPointName] e nos forneceram projetos de mísseis balísticos intercontinentais avançados que atualmente não possuímos."
 nuclear_algeria.3.a: "Ótimo!"
 nuclear_algeria.4.t: "A China Fornece Tecnologia Nuclear"
 nuclear_algeria.4.d: "Cientistas chineses se reuniram recentemente com os nossos em [ALG.capital.GetCapitalVictoryPointName] e nos forneceram projetos de reatores avançados que atualmente não possuímos."
 nuclear_algeria.4.a: "Ótimo!"
 nuclear_algeria.5.t: "[FROM.GetName] Recusa-se a Prestar Assistência!"
 nuclear_algeria.5.d: "Cometemos um grave erro de cálculo ao procurar [FROM.GetName] por assistência em nosso programa nuclear, pois eles negaram nossos pedidos e ameaçaram levá-los a tribunais internacionais, potencialmente expondo nosso segredo."
 nuclear_algeria.5.a: "Uma oportunidade perdida."
 nuclear_algeria.6.t: "A Argélia Quer Comprar Mísseis"
 nuclear_algeria.6.d: "O governo argelino nos pediu para vender-lhes uma série de mísseis balísticos. Declarou que usará os mísseis para proteger suas fronteiras nacionais e não os empregará em nenhuma forma de guerra ofensiva."
 nuclear_algeria.6.a: "Certo, finalizar a venda"
 nuclear_algeria.6.b: "Não"
 nuclear_algeria.7.t: "A China Vende Seus Mísseis"
 nuclear_algeria.7.d: "A China nos vendeu cerca de 400 mísseis balísticos. Embora alguns possam ser ultrapassados, eles ainda funcionam, e isso é o que importa."
 nuclear_algeria.7.a: "Ótimo"
 nuclear_algeria.8.t: "A China Recusa-se a Vender Mísseis"
 nuclear_algeria.8.d: "O governo chinês negou nosso pedido de compra de mísseis, alegando que precisa deles para suas próprias operações militares."
 nuclear_algeria.8.a: "Certo"
 nuclear_algeria.19.t: "Sanções Internacionais"
 nuclear_algeria.19.d: "Parece que o mundo decidiu se voltar contra nós e impôs sanções à nossa economia, que inevitavelmente a levarão à paralisia. Precisaremos avaliar nossas políticas."
 nuclear_algeria.19.a: "O que esperávamos de um mundo de traidores?"
 nuclear_algeria.25.t: "Os Estados Unidos Aumentam a Pressão Econômica"
 nuclear_algeria.25.d: "Os Estados Unidos decidiram exercer sua visão imperialista aumentando as sanções econômicas contra o nosso povo."
 nuclear_algeria.25.a: "Resistiremos!"
 nuclear_algeria.26.t: "Os Estados Unidos Reduzem a Pressão Econômica"
 nuclear_algeria.26.d: "Os Estados Unidos optaram por reduzir a quantidade de sanções impostas ao nosso povo. Se manterão essa postura é algo que teremos de aguardar para ver."
 nuclear_algeria.26.a: "Bom"
 nuclear_algeria.28.t: "A Argélia Entra na Linha"
 nuclear_algeria.28.d: "Em uma completa mudança de 180 graus da política argelina típica, eles parecem se mover em uma direção mais pacífica e controlada."
 nuclear_algeria.28.a: "Bom, talvez agora possamos aliviar as sanções"
 algerian_focus.171.t: "Usina Nuclear de Es-Salam"
 algerian_focus.171.d: "Deixada inacabada pelos americanos, a usina nuclear de Es-Salam, no que foi construído dela, está parada há décadas. Com a chegada de vários cientistas chineses, uma empresa chinesa fez uma oferta para concluir o que restou da usina."
 algerian_focus.171.a: "Aceitar a proposta"
 algerian_focus.171.b: "Não, obrigado"
 ALG_sanctioned: "Sancionada"
 ALG_nuclear_known: "Programa Nuclear Exposto"
 ALG_emergency_budget: "Orçamento de Emergência"
 support_brics: "Apoiar o BRICS"
 algeria_msp: "Foco do MSP"
 algeria_democratic: "Foco do RND"
 algeria_nationalist: "Foco do ENP"
 monitor_kabyle_unrest: "Monitorar a Agitação Cabila [KBY.GetFlag]"
 ALG_us_sanctions: "Sanções dos EUA"
 ALG_us_sanctions_desc: "Os Estados Unidos impuseram várias sanções que limitam nossa capacidade de interagir com o mundo exterior. Embora não sejam paralisantes, elas impedem, em certa medida, nosso sucesso econômico.\n§W--------------§!\nOs Estados Unidos têm a capacidade de aumentar ou diminuir as sanções contra o nosso governo com base em nossas ações.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os Estados Unidos acreditarem que não buscamos mais armas nucleares."
 ALG_imf_loan_taken: "Aceitou os Empréstimos do FMI"
 ALG_repression_modifier: "Repressão"
 ALG_surveillance_state_modifier: "Estado de Vigilância"
 ALG_national_dialogue_modifier: "Diálogo Nacional"
 ALG_boteflika: "Crise de Saúde do Presidente da Argélia"
 idea_alg_empowered_parliament: "Parlamento Fortalecido"
 algeria_sahar.1.t: "Ajuda da Argélia"
 algeria_sahar.1.d: "Recebemos uma oferta da Argélia: eles estão dispostos a nos fornecer assistência militar e ajudar a nos preparar para a retomada das hostilidades, em troca da participação no processo de criação da RAU. Devemos aceitar o apoio da Argélia?"
 algeria_sahar.1.a: "Devemos aceitar!"
 algeria_sahar.1.b: "De jeito nenhum nos tornaremos seus fantoches!"
 algeria_sahar.2.t: "Acordo de Paz"
 algeria_sahar.2.d: "Não conseguimos conter os rebeldes; eles tomaram todo o Saara Ocidental. Devemos oferecer um tratado de paz aos rebeldes e entregar o território?"
 algeria_sahar.2.a: "Enviar-lhes a oferta"
 algeria_sahar.2.b: "Devemos esmagá-los!"
 algeria_sahar.3.t: "Oferta do Marrocos"
 algeria_sahar.3.d: "O Marrocos nos enviou uma proposta de tratado de paz; essa declaração pode ser considerada um verdadeiro ato de rendição! Podemos aceitar a rendição ou marchar em ampla frente para libertar os povos do Magrebe do Norte!"
 algeria_sahar.3.a: "Vencemos!"
 algeria_sahar.3.b: "Avante rumo à Federação Popular!"
 algeria_sahar.4.t: "A Guerra Foi Vencida"
 algeria_sahar.4.d: "Nossas forças prevaleceram. O conflito do Saara Ocidental acabou e estamos livres para remodelar a ordem política da região como julgarmos adequado."
 algeria_sahar.4.a: "Estabelecer a Federação Saaraui."
 algeria_sahar.5.t: "Paz, enfim."
 algeria_sahar.5.d: "Assinamos um tratado de paz com os saarauis e a guerra acabou."
 algeria_sahar.5.a: "Nossos tempos mais sombrios."
 algeria_sahar.6.t: "Eles recusaram!"
 algeria_sahar.6.d: "Os saarauis rejeitaram nosso tratado de paz! A guerra continua!"
 algeria_sahar.6.a: "Entendido."
 algeria_sahar.7.t: "Os saarauis aceitam!"
 algeria_sahar.7.d: "Os saarauis aceitam nossa oferta."
 algeria_sahar.7.a: "Avante rumo à RAU!"
 algeria_sahar.8.t: "Eles recusaram!"
 algeria_sahar.8.d: "Os saarauis rejeitaram nossa oferta."
 algeria_sahar.8.a: "Que pena."
 TT_ALG_DEAL_WITH_TRADE_UNIONS: "Aumentaremos a opinião dos sindicatos quando eles forem uma facção interna"
 ALG_oil_price_collapse: "Colapso do Preço do Petróleo"
 ALG_oil_price_collapse_desc: "Uma queda acentuada nos preços globais do petróleo afetou severamente a receita do Estado argelino. Como os hidrocarbonetos continuam sendo a espinha dorsal da economia nacional, esse colapso ameaça a estabilidade orçamentária, as reservas cambiais e os gastos sociais.\n\n§R- A Receita do Tesouro Despenca§!"
 alg_hirak_victory_option: "O Movimento Hirak Prevalece"
 alg_hirak_victory_option_desc: "Após anos de protesto, mobilização e resistência popular, o Movimento Hirak finalmente prevaleceu. Reformas democráticas estão em andamento, mas o Estado permanece frágil e a transição, incerta.\n\n§G+ Legitimidade Reformista§!\n§Y- Influência do Estado Profundo§!"
 alg_hirak_reforms_title: "Reformas Impulsionadas pelo Hirak"
 alg_hirak_reforms_desc: "Diante de imensa pressão das ruas, o governo é forçado a implementar reformas simbólicas."
 alg_hirak_reforms_option: "Anunciar reformas políticas"
 alg_hirak_gains_influence_tt: "O §YHirak§! ganha mais influência no equilíbrio político."
 alg_hirak_crackdown_title: "Repressão aos Protestos do Hirak"
 alg_hirak_crackdown_desc: "O regime escolheu a repressão em vez da reforma, soltando as forças de segurança sobre os manifestantes."
 alg_hirak_crackdown_option: "Usar a força para restaurar a ordem"
 alg_pouvoir_crackdown_tt: "§YLe Pouvoir§! consolida o poder ao custo da estabilidade."
 alg_health_crisis_title: "Crise de Saúde Presidencial"
 alg_health_crisis_desc: "O Presidente Bouteflika sofreu um grave problema de saúde, reacendendo as preocupações sobre a liderança envelhecida e a falta de transparência na política argelina. Embora seu círculo próximo insista que ele continuará a governar, muitos na população e nos círculos de elite começam a questionar a legitimidade de sua permanência no poder."
 alg_health_crisis_option_continue: "Reafirmar a Liderança de Bouteflika"
 alg_le_pouvoir_strengthens_tt: "§YLe Pouvoir§! consolida mais poder enquanto o círculo íntimo do presidente o protege do escrutínio público."
 maghreb_union_member: "§YAceitou nossa Proposta de Formar a União do Magrebe§!"
 has_power_balance_algeria: "Concluiu as Eleições de 2014 na Argélia"
 supports_brics: "Apoia o BRICS"
 ALG_eu_trade_agreements_desc: "Assinar um Acordo Comercial com a UE para Fortalecer Nossos Laços com o Ocidente e Desenvolver Nossa Economia"
 ALG_join_nato_partnership_desc: "Ingressar na Parceria da OTAN para Podermos Dominar a Região Africana e Fazer da Argélia um País de Primeiro Mundo"
 ALG_al_quwwat_al_jawwiya_al_jazaeriya: "Força Aérea Argelina"
 ALG_al_quwwat_al_jawwiya_al_jazaeriya_desc: "A Força Aérea Argelina tem sido um dos pilares de nosso poder militar desde a independência. Fortalecer nossas capacidades aéreas por meio de modernização e aquisições garantirá o domínio dos céus do Norte da África."
 ALG_al_jaysh_al_watani_al_shaabi: "O Exército Nacional Popular"
 ALG_al_jaysh_al_watani_al_shaabi_desc: "O Exército Nacional Popular é a espinha dorsal da defesa da Argélia. Reformar e equipar as forças terrestres garantirá nosso território e manterá a estabilidade diante das ameaças."
 ALG_al_quwwat_al_bahriya_al_jazaeriya: "Força Naval Argelina"
 ALG_al_quwwat_al_bahriya_al_jazaeriya_desc: "As Forças Navais Argelinas protegem nossa costa mediterrânea e nossos interesses marítimos. Expandir nossa frota e infraestrutura permitirá que a Argélia projete poder e proteja rotas marítimas vitais."
 ALG_al_quwwat_al_musallaha_al_jazaeriya: "As Forças Armadas Argelinas"
 ALG_al_quwwat_al_musallaha_al_jazaeriya_desc: "As Forças Armadas Argelinas representam a força combinada de nosso exército, força aérea e marinha. Como garantidoras da soberania nacional, devem ser reestruturadas e modernizadas para enfrentar os desafios do novo século."
 ALG_expand_the_EFCIP: "Expandir a EFCIP"
 ALG_expand_the_EFCIP_desc: "A Escola de Treinamento de Comandos e Iniciação ao Paraquedismo (EFCIP) em Boghar tem sido a pedra angular do treinamento das forças especiais da Argélia desde 1963. Ao expandir suas instalações, modernizar sua infraestrutura e introduzir programas de combate avançados, aprimoraremos ainda mais as capacidades de nossos comandos e paraquedistas. Esse investimento garantirá que a Argélia mantenha um dos corpos de forças especiais mais formidáveis do Norte da África."
 ALG_expand_conscription: "Expandir o Recrutamento"
 ALG_expand_conscription_desc: "Expandir o recrutamento aumenta nosso contingente de soldados treinados. Isso garante mão de obra suficiente para defender a nação e responder a ameaças."
 ALG_expand_military_infrastructure: "Expandir a Infraestrutura Militar"
 ALG_expand_military_infrastructure_desc: "Construir novas bases, centros de treinamento e polos logísticos fortalece nossa capacidade militar. Melhorias na infraestrutura apoiam a eficiência operacional."
 ALG_focus_on_military_morale: "Focar no Moral Militar"
 ALG_focus_on_military_morale_desc: "O moral elevado é crítico para a eficácia em combate. Investir no bem-estar dos soldados, na liderança e no espírito de corpo eleva o ânimo de luta."
 ALG_expand_artillery_units: "Expandir as Unidades de Artilharia"
 ALG_expand_artillery_units_desc: "A artilharia fornece poder de fogo vital no campo de batalha. Aumentar as unidades de artilharia amplia as capacidades ofensivas e defensivas de nosso exército."
 ALG_an_army_of_the_masses: "Um Exército das Massas"
 ALG_an_army_of_the_masses_desc: "Um exército grande e bem treinado pode dissuadir a agressão e proteger a soberania. Construir um exército de massas exige compromisso com treinamento e recursos."
 ALG_expand_the_escuela_de_condores: "Expandir a Escuela De Condores"
 ALG_expand_the_escuela_de_condores_desc: "A Escola Condores treina soldados de elite argelinos. Expandi-la desenvolverá mais forças especiais para enfrentar desafios de segurança complexos."
 ALG_form_specops_brigades: "Formar Brigadas de Forças Especiais"
 ALG_form_specops_brigades_desc: "As brigadas de forças especiais conduzem missões de alto risco que exigem habilidades avançadas. Formar essas unidades aumenta a flexibilidade tática da Argélia."
 ALG_military_mechanization: "Mecanização Militar"
 ALG_military_mechanization_desc: "Mecanizar a infantaria melhora a mobilidade e o poder de fogo. Essa transição moderniza o exército e aumenta a eficácia no campo de batalha."
 ALG_abolish_conscription: "Abolir o Recrutamento"
 ALG_abolish_conscription_desc: "Encerrar o recrutamento leva os militares a uma força profissional voluntária. Isso pode melhorar a qualidade, mas reduz a disponibilidade de mão de obra."
 ALG_quality_over_quantity: "Qualidade em Vez de Quantidade"
 ALG_quality_over_quantity_desc: "Concentrar-se em uma força menor e mais bem equipada aumenta a eficácia em combate. O treinamento e o equipamento moderno são priorizados em relação ao número bruto."
 ALG_a_cost_effective_army: "Um Exército Econômico"
 ALG_a_cost_effective_army_desc: "Manter um exército enxuto e eficiente garante responsabilidade fiscal. Um orçamento inteligente nos permite equilibrar as necessidades de defesa com as realidades econômicas."
 ALG_modernizing_our_equipment: "Modernizar Nosso Equipamento"
 ALG_modernizing_our_equipment_desc: "Atualizar armas e equipamentos mantém nossas forças competitivas. Equipamentos modernos melhoram a sobrevivência e o poder de combate."
 ALG_develop_algerian_military_industry: "Desenvolver a Indústria Militar Argelina"
 ALG_develop_algerian_military_industry_desc: "Estabelecer uma indústria de armamentos nacional reduz a dependência de importações. Isso fortalece a soberania e cria empregos."
 ALG_cooperate_with_foreign_arms_companies: "Cooperar com Empresas Estrangeiras de Armamentos"
 ALG_cooperate_with_foreign_arms_companies_desc: "Fazer parcerias com empresas de armamentos internacionais acelera a transferência de tecnologia. Essas colaborações melhoram nossas capacidades militares."
 ALG_tackle_military_corruption: "Combater a Corrupção Militar"
 ALG_tackle_military_corruption_desc: "A corrupção mina a eficácia e o moral militares. Reformas firmes e fiscalização restauram a confiança e a disciplina."
 ALG_elite_officer_training: "Treinamento de Oficiais de Elite"
 ALG_elite_officer_training_desc: "Oficiais altamente qualificados são a chave do sucesso no campo de batalha. Programas de treinamento especializados constroem liderança e conhecimento estratégico."
 ALG_an_army_for_the_future: "Um Exército para o Futuro"
 ALG_an_army_for_the_future_desc: "Devemos preparar os militares para enfrentar as ameaças e tecnologias futuras. Inovação e adaptabilidade são centrais nessa visão."
 ALG_purchase_american_aircraft: "Comprar Aeronaves Americanas"
 ALG_purchase_american_aircraft_desc: "Adquirir aeronaves dos Estados Unidos proporciona tecnologia avançada e confiabilidade comprovada. Isso fortalece nossas capacidades aéreas."
 ALG_purchase_chinese_aircraft: "Comprar Aeronaves Chinesas"
 ALG_purchase_chinese_aircraft_desc: "As aeronaves chinesas oferecem opções econômicas e uma sofisticação tecnológica crescente. Diversificar os fornecedores amplia as parcerias estratégicas."
 ALG_purchase_russian_aircraft: "Comprar Aeronaves Russas"
 ALG_purchase_russian_aircraft_desc: "As aeronaves russas trazem projetos robustos e bom desempenho. A cooperação aumenta a versatilidade de nossa força aérea."
 ALG_improve_air_defense_infrastructure: "Melhorar a Infraestrutura de Defesa Aérea"
 ALG_improve_air_defense_infrastructure_desc: "Fortalecer os sistemas de defesa aérea protege ativos críticos e centros populacionais. As melhorias reduzem a vulnerabilidade a ameaças aéreas."
 ALG_close_air_support: "Apoio Aéreo Aproximado"
 ALG_close_air_support_desc: "O apoio aéreo aproximado aumenta a eficácia das forças terrestres em combate. Integrar as operações aéreas e terrestres é vital para o sucesso no campo de batalha."
 ALG_a_new_world_class_academy: "Uma Nova Academia de Classe Mundial"
 ALG_a_new_world_class_academy_desc: "Estabelecer uma academia militar de classe mundial formará os futuros líderes. Essa instituição definirá padrões de excelência."
 ALG_dominate_the_skies: "Dominar os Céus"
 ALG_dominate_the_skies_desc: "Alcançar a superioridade aérea é essencial na guerra moderna. Investiremos para controlar nosso espaço aéreo e apoiar todas as operações militares."
 ALG_might_of_the_sky: "O Poder dos Céus"
 ALG_might_of_the_sky_desc: "Nosso poder aéreo simboliza a força nacional e o progresso tecnológico. Manter uma força aérea poderosa dissuade a agressão."
 ALG_naval_military_police: "Polícia Militar Naval"
 ALG_naval_military_police_desc: "A polícia militar naval mantém a disciplina e a segurança a bordo de navios e bases. Garante a ordem e operações eficazes."
 ALG_expand_the_naval_academy: "Expandir a Academia Naval"
 ALG_expand_the_naval_academy_desc: "Uma academia naval ampliada treina mais oficiais e marinheiros. Esse investimento constrói forças marítimas profissionais e capazes."
 ALG_return_to_the_sea: "Nosso Retorno ao Mar"
 ALG_return_to_the_sea_desc: "Recuperar o acesso ao Oceano Pacífico é um objetivo histórico para a Argélia. Desenvolver uma presença naval é crucial para essa ambição."
 ALG_algerian_marine_forces: "Fuzileiros Navais Argelinos"
 ALG_algerian_marine_forces_desc: "Os fuzileiros navais oferecem capacidade de resposta rápida e experiência anfíbia. Sua expansão aumenta o alcance operacional da Argélia."
 ALG_quick_strikes: "Ataques Rápidos"
 ALG_quick_strikes_desc: "Ataques rápidos e decisivos podem sobrepujar os adversários. Desenvolver tais forças aumenta a flexibilidade tática."
 ALG_invest_into_shipbuilding: "Investir na Construção Naval"
 ALG_invest_into_shipbuilding_desc: "Construir uma indústria naval nacional apoia a expansão naval e o crescimento econômico. Esse setor é estratégico para a defesa de longo prazo."
 ALG_djebel_chenoua: "Djebel Chenoua"
 ALG_djebel_chenoua_desc: "Criar uma frota poderosa projeta força e protege os interesses nacionais. O Djebel Chenoua é um símbolo da soberania marítima."
 ALG_masters_of_the_mediterranean: "Senhores do Mediterrâneo"
 ALG_masters_of_the_mediterranean_desc: "Dominar as águas do Mediterrâneo garante rotas comerciais e vantagens estratégicas. A Argélia deve aspirar a ser um ator-chave nesta região."
 ALG_focus_on_mass_assault_tactics: "Focar em Táticas de Assalto em Massa"
 ALG_focus_on_mass_assault_tactics_desc: "As táticas de assalto em massa enfatizam sobrepujar as forças inimigas com grandes concentrações de tropas. Essa estratégia depende de mão de obra e coordenação para alcançar a vitória."
 ALG_licence_mir: "Comprar uma licença do Mirage"
 ALG_licence_mir_desc: "We have all the means to produce French aircraft, so we must request a license to produce them"
 ALG_purchase_russian_su30: "Comprar o Su-30 Russo"
 ALG_purchase_russian_su30_desc: "Como potência regional, proteger nossas vastas fronteiras e projetar influência pelo Magrebe e pelo Sahel é fundamental. O alto comando militar identificou o lendário Su-30 da Rússia como a plataforma ideal para aumentar significativamente nossa superioridade aérea. Essa aquisição não apenas reforçaria nossa frota e padronizaria a logística, como também proporcionaria uma vantagem decisiva e imediata, embora sem dúvida atraia grande atenção internacional."
 alg_politics.50.t: "Morte do General Smaïn Lamari"
 alg_politics.50.d: "O general Smaïn Lamari, chefe do temido ramo de contrainteligência do DRS, faleceu. Sua morte repentina deixa um vácuo de poder no estado profundo da Argélia, enquanto rivais manobram para reivindicar sua antiga influência."
 alg_politics.50.a: "Uma sombra do antigo regime desaparece."
 ALG_black_decade_threat: "Ressurgimento dos Métodos da Década Negra"
 ALG_2001_title: "Promoção de Fatima Boudouani"
 ALG_2001_desc: "Como parte da renovação reformista do Presidente Bouteflika, Fatima Boudouani se torna a primeira mulher general da Argélia. Sua promoção marca uma nova era para as mulheres nas forças armadas, elevando o moral e sinalizando modernização."
 ALG_2001_a: "Um passo histórico para o exército."
 ALG_2002_title: "Promoção de Fatima Zohra Ardjoune"
 ALG_2002_desc: "Após a ascensão pioneira de Fatima Boudouani, Fatima Zohra Ardjoune é agora promovida ao posto de general. Como a primeira mulher general do corpo médico argelino, sua nomeação reflete os passos cautelosos da Argélia rumo à inclusão de gênero em suas forças armadas."
 ALG_2002_a: "Mais uma barreira quebrada."
 alg_reform.1.t: "Uma Chance para a Verdadeira Reforma"
 alg_reform.1.d: "Após a iniciativa 'Pelo Povo, Para o Povo', a Argélia tem uma rara oportunidade de escolher um líder comprometido com a reforma genuína. Três candidatos surgiram, cada um prometendo um caminho diferente para estabilizar e modernizar o país. A escolha agora cabe ao povo."
 alg_reform.1.a: "Ahmed Benbitour – O Reformador Tecnocrata"
 alg_benbitour_desc: "Ahmed Benbitour é um tecnocrata focado na eficiência administrativa e na modernização econômica. Sua abordagem estável visa construir estabilidade de longo prazo e reformar as instituições do Estado."
 alg_reform.1.b: "Soufiane Djilali – O Reformador Carismático"
 alg_djilali_desc: "Soufiane Djilali é um líder da oposição reformista, que enfatiza reformas sociais e políticas. Carismático e determinado, busca fortalecer as instituições democráticas e a participação pública."
 alg_reform.1.c: "Rachid Nekkaz – O Ativista Populista"
 alg_nekkaz_desc: "Rachid Nekkaz é um ativista populista que apela diretamente ao povo. Embora sua popularidade seja alta, seu estilo confrontador pode criar instabilidade em um ambiente político delicado."
 ALG_citizens_constitution: "Constituição Cidadã"
 ALG_justice_for_the_people: "Justiça para o Povo"
 ALG_free_press_free_people: "Imprensa Livre, Povo Livre"
 ALG_economic_transparency: "Transparência Econômica"
 ALG_citizens_constitution_desc: "Redigir uma nova constituição que garanta os direitos fundamentais e fortaleça as instituições democráticas."
 ALG_justice_for_the_people_desc: "Reformar o judiciário para que seja independente, justo e protegido de interferência política."
 ALG_free_press_free_people_desc: "Garantir a liberdade de imprensa, permitindo que a mídia responsabilize o poder e informe os cidadãos."
 ALG_economic_transparency_desc: "Implementar políticas orçamentárias e fiscais transparentes para combater a corrupção e aumentar a confiança pública."
 ALG_true_reformist_path_tt: "Este caminho permite que a Argélia escolha um líder reformista genuíno, aumente a popularidade democrática e a estabilidade e dê início a reformas políticas e econômicas para o povo."
 algeria_news.3_tt: "O programa de paz de Bouteflika dá à Argélia um sentimento de esperança, melhorando a estabilidade e o apoio democrático."
 algeria_news.7_tt: "A resistência a 'le pouvoir' ganha apoio popular, aumentando a influência democrática e o poder político."
 algeria_news.1_tt: "O exército afirma o controle após medidas de emergência. A estabilidade cai levemente, mas o apoio à guerra e o poder político aumentam."
 algeria_news.4_tt: "O esforço de reconciliação de Bouteflika aumenta a estabilidade nacional e o apoio democrático."
 algeria_news.8.t: "As Vítimas da Década Negra"
 algeria_news.8.d: "A Guerra Civil da década de 1990 deixou centenas de milhares de vítimas: desaparecidos, viúvas, órfãos e aqueles que sofreram tortura e terror. Enquanto a Argélia busca a reconciliação, surge a pergunta: como o Estado deve responder às demandas por justiça e reconhecimento?"
 algeria_news.8.a: "Indenizar as famílias e as vítimas"
 algeria_news.8.b: "Oferecer apenas reconhecimento simbólico"
 algeria_news.8.c: "Não podemos nos prender ao passado"
 algeria_news.8_a_tt: "§YProgramas de indenização custosos§! melhorarão a estabilidade e fortalecerão a legitimidade da Argélia, mas sobrecarregarão o tesouro."
 algeria_news.8_b_tt: "§YSymbolic recognition§! slightly reduces stability at a huge political cost and leaves some demands unmet."
 algeria_news.8_c_tt: "§YIgnorar as demandas das vítimas§! economiza recursos agora, mas reduz a estabilidade e alimenta o descontentamento."
 algeria_news.10.t: "O Caminho para a Recuperação"
 algeria_news.10.d: "Com o fim do conflito civil, a Argélia enfrenta o desafio monumental de reconstruir sua economia destroçada. As fábricas estão paradas, a infraestrutura está danificada e o desemprego continua perigosamente alto. Mas, pela primeira vez em anos, há esperança de que a reconstrução e a reforma possam restaurar a prosperidade e a estabilidade."
 algeria_news.10.a: "A recuperação começa!"
 algeria_news.10_a_tt: "§YOs primeiros passos são dados para reviver a economia da Argélia.§! Isso abre caminho para reformas mais profundas em infraestrutura, indústria e finanças."
 algeria_news.11.t: "Missão de Ajuda das Nações Unidas"
 algeria_news.11.d: "Representantes das Nações Unidas chegaram a Argel com uma oferta de ajuda econômica e assistência para a reconstrução. Seus programas poderiam trazer fundos valiosos, conhecimento técnico e auxílio humanitário, mas muitos no governo alertam que aceitar essa ajuda pode convidar à interferência estrangeira nos assuntos internos da Argélia."
 algeria_news.11.a: "Aceitar a Missão da ONU"
 algeria_news.11_a_tt: "§GReceberemos fundos de ajuda internacional e apoio técnico.§! \n§RNo entanto, isso aumentará a influência americana, francesa e britânica na Argélia.§!"
 algeria_news.11.b: "Rejeitar a Interferência Estrangeira"
 algeria_news.11_b_tt: "§RRecusamos a supervisão da ONU e nos recuperaremos por conta própria.§! \n§YIsso preserva nossa soberania, mas desacelera o crescimento econômico.§!"
 algeria_news.20.t: "Revisão da Política Externa da Argélia"
 algeria_news.20.d: "Com o fim do conflito civil e a frágil recuperação da Argélia em curso, a liderança em Argel lançou uma revisão abrangente da política externa da nação. As escolhas feitas nos próximos anos determinarão se fortaleceremos os laços com antigos aliados, buscaremos novas parcerias ou manteremos nossa independência em um mundo cada vez mais polarizado. O debate começou, e em breve a Argélia terá de escolher seu rumo."
 algeria_news.20.a: "O futuro da Argélia aguarda."
 algeria_news.20_tt: "§YIsto marca o início do ramo de política externa da Argélia.§!"
 ALG_between_east_and_west_tt: "A Argélia busca equilibrar as relações entre o Oriente e o Ocidente, afirmando uma política externa não alinhada."
 ALG_mediate_great_power_conflict_tt: "A Argélia atua ativamente como mediadora entre as potências globais, construindo sua reputação como pacificadora neutra."
 ALG_secure_balance_tt: "A Argélia reforça sua posição não alinhada, garantindo um equilíbrio estável entre as principais potências globais."
 alg_news_non_aligned.1.t: "Equilíbrio entre o Oriente e o Ocidente"
 alg_news_non_aligned.1.d: "A Argélia começou a traçar um curso cuidadoso entre as grandes potências globais, buscando manter sua independência enquanto se envolve diplomaticamente tanto com o Oriente quanto com o Ocidente."
 alg_news_non_aligned.1.a: "A Argélia busca o equilíbrio"
 alg_news_non_aligned.2.t: "Mediando as Tensões Globais"
 alg_news_non_aligned.2.d: "A Argélia se adiantou para mediar as tensões entre as grandes potências, visando aprimorar sua posição internacional como pacificadora neutra."
 alg_news_non_aligned.2.a: "Mediação em andamento"
 alg_news_non_aligned.3.t: "Promovendo a Reconciliação Regional"
 alg_news_non_aligned.3.d: "A Argélia lançou uma série de iniciativas diplomáticas para reconciliar diferenças entre as potências regionais, buscando estabilidade e parcerias cooperativas."
 alg_news_non_aligned.3.a: "Esforços de reconciliação"
 alg_news_non_aligned.4.t: "Garantindo o Equilíbrio Não Alinhado"
 alg_news_non_aligned.4.d: "A Argélia consolidou sua postura não alinhada, mantendo cuidadosamente relações com as grandes potências sem se comprometer totalmente com nenhum bloco."
 alg_news_non_aligned.4.a: "Equilíbrio garantido"
 alg_news_non_aligned.5.t: "Revivendo o Movimento Não Alinhado"
 alg_news_non_aligned.5.d: "A Argélia tomou medidas para revitalizar sua participação no Movimento Não Alinhado, reafirmando sua liderança e influência diplomática entre as nações neutras."
 alg_news_non_aligned.5.a: "Influência no MNA restaurada"
 alg_news_non_aligned.6.t: "Apoiando o Mundo em Desenvolvimento"
 alg_news_non_aligned.6.d: "A Argélia iniciou uma ampla aproximação diplomática e econômica com as nações em desenvolvimento, promovendo estabilidade e cooperação enquanto aumenta sua influência no continente."
 alg_news_non_aligned.6.a: "Aproximação iniciada"
 algeria_news.9.t: "O Legado da Década Negra"
 algeria_news.9.d: "A guerra civil deixou cicatrizes profundas na Argélia. O governo deve decidir como enquadrar o passado, atribuir culpas e guiar o futuro da nação."
 algeria_news.9.a: "Apoiar o regime militar"
 algeria_news.9.b: "Ficar ao lado das vítimas e dos pobres"
 algeria_news.9.c: "Culpar atores externos"
 algeria_news.9.dd: "Apagar oficialmente e suprimir a discussão"
 ALG_promote_reconciliation_tt: "§GPromover a Reconciliação:§!\n• Melhorar as relações com os vizinhos\n• Reduzir as tensões regionais\n• Abrir canais diplomáticos"
 alg_mufti.2.t: "Qual Caminho para o Estado Islâmico?"
 alg_mufti.2.d: "Agora que o Islã foi declarado princípio orientador da nação, devemos decidir qual corrente definirá nosso caminho. O Movimento do Renascimento Islâmico (Nahda), liderado por Abdallah Djaballah, defende uma visão islamista moderada e estruturada por meio das urnas. Mas outros olham para os ulemás e pregadores carismáticos que prometem uma forma mais direta e intransigente de autoridade islâmica."
 alg_mufti.2.a: "Fortalecer o Movimento do Renascimento Islâmico (Nahda)"
 alg_mufti.2.a.tt: "O Nahda de Djaballah se torna a principal força da política islâmica."
 alg_mufti.2.b: "Colocar a Autoridade nas Mãos dos Ulemás"
 alg_mufti.2.b.tt: "Mais tarde escolheremos se seguiremos um pregador controverso ou um Mufti aprovado pelo governo."
 alg_mufti.3.t: "O Rosto dos Ulemás"
 alg_mufti.3.d: "Com a autoridade dos ulemás confirmada, o governo deve agora decidir quem representará essa corrente na liderança. O xeque Bouamrane é um moderado, aceitável para o Estado e os militares, enquanto Ali Belhadj continua sendo uma voz radical e inflamada que inspira apoio popular, mas corre o risco de confronto com as autoridades."
 alg_mufti.3.a: "Apoiar Belhadj"
 alg_mufti.3.a.tt: "Ali Belhadj se tornará o líder, representando uma corrente salafista linha-dura."
 alg_mufti.3.b: "Apoiar Bouamrane"
 alg_mufti.3.b.tt: "O xeque Bouamrane se tornará o líder, representando uma corrente de ulemás moderada e alinhada ao Estado.\n§RIndisponível após maio de 2016.§!"
 ALG_ennahda: "Apoiar o Ennahda"
 ALG_ennahda_desc: "Apoiaremos Abdallah Djaballah e o Movimento do Renascimento Islâmico, trazendo a política islamista para o seio de nossas instituições estatais."
 ALG_independent: "Ulemás Independentes"
 ALG_independent_desc: "Fortaleceremos a independência dos ulemás, dando aos estudiosos religiosos autoridade sobre assuntos espirituais e, potencialmente, sobre a liderança do Estado."
 ALG_grand_mufti_rule: "O Grão-Mufti Governa"
 ALG_grand_mufti_rule_desc: "Os ulemás, ou um movimento islamista político, fornecerão a autoridade orientadora do Estado argelino. O caminho que escolhemos determinará quem surgirá como o rosto da autoridade islâmica."
 ALG_nahda_path: "Escolheu o caminho do Nahda"
 ALG_ulema_path: "Escolheu o caminho dos Ulemás"
 ALG_belhadj_leader: "Ali Belhadj é o líder"
 ALG_bouamrane_leader: "O xeque Bouamrane é o líder"
 ALG_constitution_1996: "Constituição de 1996"
 ALG_constitution_1996_desc: "A Constituição revisada de 1996 pretendia estabilizar a Argélia após a turbulência da Década Negra. No entanto, muitas disposições foram concebidas visando a sobrevivência do regime, e não a democratização genuína. Seu rígido arcabouço secular foi visto por grande parte do movimento islamista como ilegítimo e 'não islâmico'. Embora consolide o controle estatal e fortaleça a presidência, também restringe a participação política, reduz a confiança entre o governo e a sociedade e dificulta reformas de longo prazo. O legado dessa constituição continua a pesar muito sobre a estabilidade e a legitimidade da Argélia."
 ALG_enahda_media_network_idea: "Rede de Mídia do Ennahda"
 ALG_enahda_media_network_idea_desc: "O movimento Ennahda estabeleceu seus próprios canais de mídia para difundir sua mensagem e mobilizar o apoio público. Esses veículos promovem valores de inspiração religiosa enquanto criticam as falhas do regime.\n\n§YEste espírito nacional será removido se não estivermos alinhados ao Ennahda§!"
 ALG_supreme_islamic_council_idea: "Conselho Islâmico Supremo"
 ALG_supreme_islamic_council_idea_desc: "Um conselho consultivo composto por ulemás seniores e estudiosos islâmicos foi estabelecido para orientar a política estatal segundo princípios religiosos. Embora não detenha poder direto, sua influência sobre a legislação e a vida pública é significativa.\n\n§YEste espírito nacional será removido se não formos salafistas ou islamistas§!"
 alg_constitution.1.t: "A Constituição é Reformada"
 alg_constitution.1.d: "Após anos de controvérsia, a Constituição de 1996 foi revisada. O novo arcabouço remove algumas das disposições mais autoritárias, introduz freios ao poder executivo e busca criar um melhor equilíbrio entre as correntes islâmica e secular da Argélia. Muitos veem isso como um passo necessário rumo à reconciliação, enquanto outros duvidam que as reformas realmente mudem o sistema entrincheirado de le pouvoir."
 alg_constitution.1.a: "Adotar a nova Constituição"
 alg_constitution.1.a.tt: "Substitui a §YConstituição de 1996§! por uma §YConstituição Reformada§!, concedendo bônus à estabilidade, ao poder político e ao crescimento econômico."
 ALG_ali_belhadj_desc: "Ali Belhadj, cofundador da Frente Islâmica de Salvação (FIS), foi um dos líderes islamistas mais carismáticos e radicais da turbulenta década de 1990 na Argélia. Conhecido por seus sermões inflamados, sua retórica intransigente e sua rejeição à política secular, tornou-se um símbolo de resistência ao regime da FLN. Preso durante grande parte da guerra civil e banido da política formal pela Constituição de 1996, Belhadj continua sendo uma figura polarizadora: para alguns, a personificação do ressentimento islamista; para outros, um perigoso lembrete da Década Negra. Seu possível retorno ao cenário político desperta tanto esperanças de reconciliação quanto temores de um novo extremismo."
 ALG_bouamrane_desc: "Mohamed Bouamrane surgiu na década de 1990 como um intelectual e ator político islamista mais moderado. Defendendo o diálogo em vez do confronto, posicionou-se entre islamistas linha-dura como Ali Belhadj e a elite entrincheirada da FLN. Embora nunca tenha alcançado o mesmo apelo de massa da liderança da FIS, Bouamrane tornou-se uma figura respeitada nos debates do pós-guerra sobre reconciliação e reforma constitucional. Sua visão enfatizava uma Argélia em que os valores islâmicos pudessem coexistir com instituições democráticas, tornando-o uma figura-ponte no tenso equilíbrio entre a política secular e a religiosa."
 algeria_elections.2024.t: "As Eleições Presidenciais de 2024"
 algeria_elections.2024.d: "A Argélia entra em mais uma eleição crítica. As três figuras principais encarnam caminhos divergentes: Abdelmadjid Tebboune, que promete continuidade sob a FLN; Youcef Aouchiche, que defende a reforma democrática e a modernização liberal; e Abdelali Hassani, apoiado por correntes islamistas que buscam um papel maior para a religião na política. Os resultados refletem o equilíbrio de poder entre as facções."
 algeria_elections.2024.a: "Abdelmadjid Tebboune garante a reeleição."
 algeria_elections.2024.b: "Youcef Aouchiche vence a presidência."
 algeria_elections.2024.c: "Abdelali Hassani ascende com o apoio islamista."
 ALG_tebboune_2024_tt: "§YAbdelmadjid Tebboune§! continua Presidente, com domínio da FLN."
 ALG_aouchiche_2024_tt: "§YYoucef Aouchiche§! se torna Presidente, liderando os liberais reformistas."
 ALG_hassani_2024_tt: "§YAbdelali Hassani§! se torna Presidente, apoiado por movimentos islamistas."
 algeria_gspc.1.t: "Nabil Sahraoui Assume o Comando do GSPC"
 algeria_gspc.1.d: "O descontentamento cresceu dentro do Grupo Salafista para a Pregação e o Combate (GSPC). Muitos comandantes acusaram Hassan Hattab de fraqueza, criticando sua hesitação em travar uma jihad em larga escala. Em meados de 2003, Hattab foi colocado de lado por seus próprios homens, e Nabil Sahraoui, uma figura muito mais radical, declarou-se o novo emir do GSPC."
 algeria_gspc.1.a: "A insurgência se radicaliza ainda mais."
 ALG_sahraoui_rise_tt: "§YNabil Sahraoui§! substitui Hassan Hattab como o novo líder do GSPC."
 algeria_gspc.2.t: "Sahraoui Morto, Droukdel Surge"
 algeria_gspc.2.d: "Em junho de 2004, as forças de segurança argelinas mataram Nabil Sahraoui em um confronto. No entanto, sua morte não enfraqueceu a insurgência; em vez disso, a liderança passou a Abdelmalek Droukdel, um estrategista ambicioso com laços com a rede global da Al-Qaeda. Sob ele, é provável que o GSPC se expanda e internacionalize sua jihad."
 algeria_gspc.2.a: "Começa uma era mais letal."
 ALG_droukdel_rise_tt: "§YAbdelmalek Droukdel§! se torna o líder do GSPC."
 algeria_gspc.3.t: "Hassan Hattab se Rende"
 algeria_gspc.3.d: "Após anos foragido, o fundador do GSPC, Hassan Hattab, se rendeu às autoridades argelinas. Desiludido com o rumo do movimento que ele mesmo criou, Hattab aceitou o programa de anistia do governo. Embora sua influência tenha diminuído, sua rendição representa uma vitória simbólica para o Estado argelino."
 algeria_gspc.3.a: "Um símbolo de derrota para a insurgência."
 ALG_hattab_surrender_tt: "§YHassan Hattab§! se rende, reduzindo a atividade da insurgência."
 alg_generals.1.t: "Abdelkader Lounès Nomeado Comandante da Força Aérea"
 alg_generals.1.d: "O general Abdelkader Lounès foi nomeado Comandante da Força Aérea Argelina. Conhecido por seu foco na modernização, ele supervisionará o desenvolvimento do poder aéreo da Argélia ao longo da próxima década."
 alg_generals.1.a: "Nossos céus estão em boas mãos."
 alg_generals.2.t: "Amar Amrani Assume o Comando da Defesa Aérea"
 alg_generals.2.d: "O major-general Amar Amrani foi colocado no comando das Forças de Defesa Terra-Ar da Argélia. Sua liderança fortalecerá a capacidade da Argélia de defender seu espaço aéreo contra ameaças estrangeiras."
 alg_generals.2.a: "Nossa defesa aérea se fortalece."
 alg_generals.3.t: "Menad Nouba se Torna Comandante da Gendarmaria"
 alg_generals.3.d: "O general Menad Nouba foi nomeado Comandante da Gendarmaria Nacional Argelina. Encarregado da segurança interna e do combate à insurgência, sua liderança será crucial para manter a ordem doméstica."
 alg_generals.3.a: "Uma mão firme para a segurança da Argélia."
 ALG_ouyahia_pm: "Ahmed Ouyahia como Primeiro-Ministro"
 ALG_belkhadem_pm: "Abdelaziz Belkhadem como Primeiro-Ministro"
 ALG_interim_president.1.t: "Presidência Interina Declarada"
 ALG_interim_president.1.d: "Após a renúncia de Bouteflika, a Argélia enfrenta um vácuo de poder. Por determinação constitucional, Abdelkader Bensalah, presidente da câmara alta, toma posse como presidente interino por 90 dias. O Hirak rejeita essa nomeação, vendo-o como parte do mesmo sistema corrupto."
 ALG_interim_president.1.a: "Nomear Abdelkader Bensalah"
 ALG_bouteflika_resigns.1.t: "Bouteflika Renuncia"
 ALG_bouteflika_resigns.1.d: "Sob imensa pressão de semanas de protestos do Hirak e da retirada de apoio do establishment militar, o Presidente Abdelaziz Bouteflika renunciou formalmente. Sua presidência de duas décadas chegou ao fim, deixando o futuro da Argélia incerto."
 ALG_bouteflika_resigns.1.a: "A era Bouteflika acabou."
 ALG_hirak.100.t: "A Voz do Hirak"
 ALG_hirak.100.d: "De Argel a Orã, de Constantina a Tamanrasset, milhões marcharam todas as sextas-feiras exigindo 'Yetnahaw Ga3' – todos eles têm que ir embora. O velho regime ruiu. Agora o Hirak deve escolher: quem levará o espírito de 22 de fevereiro ao palácio presidencial de El Mouradia?"
 ALG_hirak.100.a: "Zoubida Assoul – A Voz Constitucional"
 ALG_hirak.100.b: "Karim Tabbou – O Campeão das Ruas"
 ALG_hirak.100.c: "Hakim Addad – A Geração RAJ"
 ALG_hirak.100.e: "Amira Bouraoui – A Filha Feroz do Barakat"
 ALG_african_trade_links: "Laços Comerciais Africanos"
 ALG_african_trade_links_desc: "Por meio de iniciativas econômicas e diplomáticas fortalecidas em toda a África, a Argélia está expandindo sua rede de acordos comerciais, reduzindo a dependência de mercados externos e garantindo prosperidade mútua com nossos parceiros continentais."
 ALG_african_mediation_role: "Papel de Mediação Africano"
 ALG_african_mediation_role_desc: "A Argélia há muito se posiciona como mediadora confiável em disputas africanas. Ao atuar ativamente na resolução de conflitos, podemos fortalecer nossa legitimidade no continente e ampliar nossa influência diplomática."
 ALG_african_union_reforms: "Impulsionar as Reformas da União Africana"
 ALG_african_union_reforms_desc: "A União Africana continua limitada em eficácia. Ao impulsionar reformas, fortalecer suas instituições, promover a prestação de contas e construir consenso, podemos garantir que a Argélia se torne uma líder respeitada no arcabouço continental africano."
 ALG_african_economic_integration: "Integração Econômica Africana"
 ALG_african_economic_integration_desc: "A integração econômica continental é a chave para a prosperidade da Argélia. Reduzindo as barreiras comerciais e melhorando os vínculos com os parceiros africanos, reduziremos a dependência de mercados estrangeiros e fomentaremos o crescimento sustentável na África."
 ALG_expand_african_investments: "Expandir os Investimentos Africanos"
 ALG_expand_african_investments_desc: "Por meio de empreendimentos apoiados pelo Estado e da cooperação com parceiros africanos, a Argélia pode expandir os investimentos em infraestrutura, energia e comércio. Esses investimentos impulsionarão nossa economia e fortalecerão os laços em todo o continente."
 ALG_PT: "PT (Partido dos Trabalhadores)"
 ALG_PT_desc: "O PT (Parti des travailleurs) é um partido político trotskista da Argélia, estreitamente ligado ao Partido Operário Independente da França. O partido é liderado por Louisa Hanoune. O Partido dos Trabalhadores, que usa a sigla \"PT\", defende a proteção e a promoção dos movimentos sindicais na Argélia e promove uma doutrina igualitária que pede uma melhor distribuição da riqueza entre o povo. A criação do partido remonta a 1990, um ano após a reforma constitucional que introduziu o sistema multipartidário. Sua Secretária-Geral é Louisa Hanoune, que em 2004 foi a primeira mulher do mundo árabe a se candidatar a uma eleição presidencial."
 ALG_communist_education: "Educação Comunista"
 ALG_communist_education_desc: "As mentes jovens são as mais impressionáveis. Incutir os valores básicos do comunismo na geração mais jovem, ao mesmo tempo que se ensina aos universitários a glória da igualdade, poderia avançar muito nossa causa."
 ALG_labour_focus_unions: "Contatar os Sindicatos"
 ALG_labour_focus_unions_desc: "Os sindicatos ficarão muito felizes em ter um governo disposto não apenas a cooperar, mas a ceder às suas demandas. Garantiremos que sua influência não se estenda além da nossa chegada ao poder, para evitar §RConflitos de interesse.§!"
 ALG_failures_capitalism: "Os Fracassos do Capitalismo"
 ALG_failures_capitalism_desc: "O capitalismo não nos abençoa mais com a riqueza infinita que prometeu. É hora de seguirmos nosso próprio caminho para garantir que tal crise nunca mais aconteça! §ROs efeitos deste foco escalam conforme a extensão da crise da dívida.§!"
 ALG_working_class: "A Classe Trabalhadora"
 ALG_working_class_desc: "A classe trabalhadora - onde os sonhos nascem e morrem. Podemos prometer que serão bem tratados e receberão o crédito que merecem por serem a base do novo Estado comunista."
 ALG_communist_propaganda: "Máquina de Propaganda"
 ALG_communist_propaganda_desc: "Devido à nossa influência crescente, podemos nos permitir lançar a máquina de propaganda sobre a Argélia. Embora o custo de manutenção seja alto, essa propaganda não deve ser desprezada; será extremamente eficaz para converter a população argelina."
 ALG_prepare_government: "Preparar um Governo"
 ALG_prepare_government_desc: "Ao montar um governo dentro de nosso partido político, garantimos uma transição eficaz que nos permite agir em prol de nossos objetivos mais rápido do que nossos rivais conseguem se recompor. Isso será custoso, mas, considerando nossas chances de vitória, é uma aposta bem colocada."
 ALG_damn_market: "Maldito Livre Mercado"
 ALG_damn_market_desc: "Estamos em posição de desferir o golpe final nos capitalistas. Com o poder da propaganda ao nosso lado, podemos desferir o golpe mortal na economia de livre mercado e, no processo, usurpar o trono do excesso em que os capitalistas se sentam!"
 ALG_election_com: "Exigir Eleições Imediatas"
 ALG_election_com_desc: "Camaradas, a hora é agora! Toda a nossa preparação rumo a um novo Estado livre nos levou a este momento! \n\n§RGarantiremos que o governo do povo governe por mais 1000 anos!§!"
 PT_flag: "PT"
 ALG_failures_capitalism_TT: "§ROs efeitos do foco escalam conforme a extensão da crise da dívida.§!"
 ALG_communist_takeover_TT: "§GO povo argelino exige eleições!§!\n\nCertifique-se de ter Poder Político suficiente guardado para isso. Se você §Rfalhar§! em eleger e formar um governo, §Rprecisará realizar outra eleição extraordinária§! para fortalecer §Y[communist_state_L]§!"
 ALG_increase_drift_TT: "§GAumenta a deriva política em direção a este partido!§!"
 ALG_wild_unions: "Sindicatos Descontrolados"
 ALG_wild_unions_desc: "Demos poder aos sindicatos e eles o estão usando - não vemos problema nisso."
 ALG_wild_unions_2: "Sindicatos Descontrolados"
 ALG_wild_unions_2_desc: "Os sindicatos receberam grande liberdade durante nossa ascensão ao poder. Agora que somos vitoriosos, recorremos a eles apenas para garantir que tenhamos o coração do povo antes de assegurar completamente nossa base de poder."
 ALG_wild_unions_3: "Sindicatos Descontrolados"
 ALG_wild_unions_3_desc: "Os sindicatos são simplesmente insuportáveis, não aguentamos mais! Começaram como um incômodo, mas se tornaram um obstáculo à vontade do Estado; devem ser pacificados ou destruídos!"
 ALG_press_opposition: "Oposição da Mídia"
 ALG_press_opposition_desc: "A mídia não nos retrata sob a melhor luz desde que restauramos a ordem no governo, mas é perfeitamente lógico que os fracos temam os fortes."
 ALG_one_party: "Estado de Partido Único"
 ALG_one_party_desc: "Depois de declarar que o PT é o único partido político permitido na Argélia, temos o poder de fazer o que quisermos, mas ao custo de sangue derramado para garantir que nosso povo seja submisso."
 ALG_reorganize_army_idea: "Reorganizando o Exército"
 ALG_reorganize_army_idea_desc: "Não podemos simplesmente cortar o financiamento do exército até a disfunção. Pode chegar o momento em que precisaremos de forças armadas poderosas e, para essa eventualidade, garantiremos que nosso exército seja leal e esteja pronto."
 ALG_new_army_idea: "Um Novo Exército"
 ALG_new_army_idea_desc: "Vimos grande sucesso na polícia assumindo o papel de principal força defensiva. No entanto, sabemos que ela não está equipada o suficiente para repelir uma invasão estrangeira. Construiremos um novo exército voltado exclusivamente à defesa da Argélia para garantir a segurança de nosso povo."
 ALG_red_army_idea: "Um Exército Vermelho"
 ALG_red_army_idea_desc: "Incutimos o fanatismo ideológico profundamente não apenas nas fileiras de nosso exército, mas também na população civil, garantindo que teremos a mão de obra e a lealdade necessárias para mobilizar um exército formidável."
 ALG_cracked_foundation: "Uma Base Rachada"
 ALG_cracked_foundation_desc: "A base do Estado foi contradita tantas vezes que, se continuarmos no rumo atual, poderemos enfrentar uma terrível nova revolução. \n\n§RSe nossa estabilidade cair abaixo de 30%, enfrentaremos uma revolução na Argélia!§!"
 ALG_militarist_education_idea: "Educação Militarista"
 ALG_militarist_education_idea_desc: "O sistema educacional incutiu valores militares em seu currículo, permitindo um maior estado de prontidão em caso de ataques repentinos."
 ALG_elam: "Ressurgimento da Frente Popular Nacional"
 ALG_elam_desc: "A Frente Popular Nacional ampliou muito seus esforços em todas as frentes para influenciar a mente do eleitor médio. Suspeitamos que a Argélia seja a causa dessa 'perturbação'."
 algeria.5.t: "O PT Pede Eleições na Argélia"
 algeria.5.d: "Após obter o apoio majoritário da classe trabalhadora da Argélia e de várias figuras políticas, o Parti des Travailleurs (PT) pediu ao governo que realize eleições livres. O PT conquistou apoio massivo, e as autoridades sofrem pressão de vários lados para ceder. Muitos esperam que o PT vença de forma decisiva, já que sua base entre os trabalhadores e os sindicatos se fortalece a cada dia. Um porta-voz alertou que, se as eleições forem negadas, os trabalhadores lançarão um levante para derrubar o governo."
 algeria.5.a: "Trabalhadores da Argélia, levantem-se!"
 algeria.5.b: "Interessante"
 algeria.7.t: "A Argélia Move-se para a Esquerda"
 algeria.7.d: "Com o desemprego em alta e a desigualdade econômica piorando, a classe trabalhadora da Argélia se uniu em torno do Parti des Travailleurs (PT), de extrema-esquerda. O PT denuncia as políticas neoliberais e as violações dos direitos dos trabalhadores, ao mesmo tempo que defende posições antiocidentais e organiza protestos para pressionar o governo. Sua influência cresce rapidamente, marcando uma guinada decisiva à esquerda na política argelina."
 algeria.7.a: "Trabalhadores da Argélia, sua libertação está chegando"
 algeria.7.b: "Interessante"
 ALG_family_centric: "Centrado na Família"
 ALG_family_centric_desc: "Estamos incentivando as famílias como o principal alicerce da sociedade argelina."
 ALG_religion_in_schools: "Educação Religiosa"
 ALG_religion_in_schools_desc: "Nosso sistema educacional incorpora a religião de forma estreita ao currículo, garantindo que as gerações mais jovens sejam criadas com fortes valores islâmicos."
 ALG_grand_mufti_appointed: "Grão-Mufti da Argélia"
 ALG_grand_mufti_appointed_desc: "Um Grão-Mufti foi nomeado para interpretar a Lei Islâmica na Argélia, reforçando a legitimidade religiosa do Estado."
 ALG_islam_above_the_nation: "O Islã Acima da Nação"
 ALG_islam_above_the_nation_desc: "Durante o turbulento passado da Argélia, tanto o nacionalismo quanto o Islã disputaram o domínio na formação do Estado. Para o nosso futuro, o Islã deve servir como princípio orientador da governança, acima de tudo."
 ALG_family_is_a_central_unit: "A Família Acima de Tudo"
 ALG_family_is_a_central_unit_desc: "O núcleo da sociedade é a família. Um homem, uma mulher e seus filhos formam o alicerce da nação. Famílias fortes garantirão a prosperidade e o sucesso da Argélia por muitos anos."
 ALG_follow_religious_law: "Seguir a Lei Religiosa"
 ALG_follow_religious_law_desc: "A Lei Islâmica é a melhor base para governar um país. Adotá-la como nosso alicerce garantirá justiça e equidade para todos os argelinos."
 ALG_traditional_role_for_women: "Papel Tradicional da Mulher"
 ALG_traditional_role_for_women_desc: "As mulheres detêm a maior honra ao criar os filhos e cuidar de suas famílias. Enquanto os homens trabalham fora, as mulheres devem salvaguardar as tradições da nação em casa."
 ALG_religious_education: "Educação Religiosa"
 ALG_religious_education_desc: "Nossas escolas devem incorporar os estudos religiosos de forma estreita ao currículo. Desde a infância, os argelinos devem aprender o Alcorão e as práticas islâmicas."
 ALG_appoint_grand_mufti: "Nomear um Grão-Mufti"
 ALG_appoint_grand_mufti_desc: "A Argélia precisa de um Grão-Mufti para interpretar a Lei Islâmica. Devemos nomear um estudioso respeitado para fornecer orientação religiosa ao Estado."
 ALG_abrogate_secular_constitution: "Revogar a Constituição Secular"
 ALG_abrogate_secular_constitution_desc: "A constituição atual mantém um arcabouço secular herdado da independência. A única lei que devemos seguir é o Alcorão, não textos feitos pelo homem."
 ALG_enahda_media_network: "Rede de Mídia do Ennahda"
 ALG_enahda_media_network_desc: "Devemos estabelecer uma rede nacional de televisão para transmitir a mensagem do Grão-Mufti e promover os valores islâmicos em toda a Argélia."
 ALG_supreme_islamic_council: "Conselho Islâmico Supremo"
 ALG_supreme_islamic_council_desc: "Para salvaguardar o novo Estado, devemos criar um Conselho Islâmico Supremo, um órgão consultivo que apoie o Grão-Mufti e garanta que a Argélia permaneça firmemente no caminho da fé."
 ALG_edu_and_social_policy: "Educação e Política Social"
 ALG_edu_and_social_policy_desc: "A prosperidade de longo prazo da Argélia depende de mais do que recursos naturais; repousa sobre os alicerces da educação, da saúde e da proteção social. Reformando esses setores, podemos forjar um novo contrato social para o século XXI."
 ALG_expand_primary_education: "Expandir o Ensino Fundamental"
 ALG_expand_primary_education_desc: "Expandir o acesso às escolas primárias em áreas rurais e urbanas reduzirá o analfabetismo e construirá uma base para o desenvolvimento nacional."
 ALG_reform_secondary_curriculum: "Reformar o Currículo do Ensino Médio"
 ALG_reform_secondary_curriculum_desc: "Nossas escolas secundárias devem ser reformadas para atender às demandas de uma economia moderna, preservando ao mesmo tempo a identidade argelina."
 ALG_western_curriculum: "Adotar o Currículo Ocidental"
 ALG_western_curriculum_desc: "Ao integrar currículos de orientação ocidental, podemos expor nossa juventude às ciências modernas e aos padrões globais, melhorando a competitividade da Argélia."
 ALG_national_curriculum: "Fortalecer o Currículo Nacional"
 ALG_national_curriculum_desc: "Em vez de copiar modelos estrangeiros, devemos nos concentrar na arabização e nos valores culturais argelinos em nossas escolas para preservar a soberania na educação."
 ALG_university_reform: "Reforma Universitária"
 ALG_university_reform_desc: "Nossas universidades devem ser ampliadas e modernizadas para formar profissionais, pesquisadores e inovadores que possam liderar o futuro da Argélia."
 ALG_basic_healthcare_access: "Acesso à Saúde Básica"
 ALG_basic_healthcare_access_desc: "Todo argelino merece acesso aos serviços básicos de saúde. Ampliar a cobertura é um primeiro passo rumo a uma nação mais saudável."
 ALG_state_hospitals: "Expandir os Hospitais Estatais"
 ALG_state_hospitals_desc: "Investindo em um sistema hospitalar liderado pelo Estado, podemos garantir uma saúde gratuita e acessível a todos os argelinos, embora a um custo significativo para o tesouro."
 ALG_modernize_state_hospitals: "Modernizar os Hospitais Estatais"
 ALG_modernize_state_hospitals_desc: "Atualizar equipamentos, treinar médicos e melhorar a infraestrutura fortalecerá a rede de saúde do Estado."
 ALG_universal_healthcare: "Saúde Universal"
 ALG_universal_healthcare_desc: "A saúde é um direito, não um privilégio. A Argélia se comprometerá a construir um sistema de saúde totalmente universal."
 ALG_private_healthcare: "Incentivar a Saúde Privada"
 ALG_private_healthcare_desc: "Promovendo hospitais e clínicas privados, podemos reduzir o fardo sobre o Estado e introduzir a concorrência de mercado na saúde."
 ALG_expand_private_clinics: "Expandir as Clínicas Privadas"
 ALG_expand_private_clinics_desc: "As clínicas privadas podem complementar o sistema público ao oferecer serviços mais especializados, especialmente nas áreas urbanas."
 ALG_national_insurance: "Sistema Nacional de Seguros"
 ALG_national_insurance_desc: "Um plano nacional de seguro-saúde unificará a saúde pública e a privada sob uma única rede de proteção para os cidadãos argelinos."
 ALG_minimum_income_guarantee: "Garantia de Renda Mínima"
 ALG_minimum_income_guarantee_desc: "O Estado garantirá um nível mínimo de renda aos mais vulneráveis, protegendo os argelinos da pobreza absoluta."
 ALG_housing_support: "Apoio à Moradia"
 ALG_housing_support_desc: "Programas de moradia subsidiada fornecerão casas acessíveis a famílias trabalhadoras e reduzirão a superlotação urbana."
 ALG_childcare_support: "Apoio à Educação Infantil"
 ALG_childcare_support_desc: "Apoiar creches e auxílios familiares ajudará jovens famílias a criar filhos sem dificuldades financeiras."
 ALG_fuel_subsidies: "Subsídios aos Combustíveis"
 ALG_fuel_subsidies_desc: "Subsidiando os preços dos combustíveis, podemos tornar o transporte e o aquecimento acessíveis aos argelinos comuns, mesmo que isso sobrecarregue o tesouro."
 ALG_food_subsidies: "Subsídios Alimentares"
 ALG_food_subsidies_desc: "Proteger o preço do pão e dos alimentos essenciais garantirá que nenhuma família argelina passe fome."
 ALG_welfare_consolidation: "Consolidar o Estado de Bem-Estar"
 ALG_welfare_consolidation_desc: "Ao reunir nossos programas sociais em um sistema abrangente de bem-estar, a Argélia estabelecerá uma rede de proteção social moderna."
 ALG_civil_rights_protections: "Proteção dos Direitos Civis"
 ALG_civil_rights_protections_desc: "Garantir direitos e liberdades fundamentais fortalecerá a estabilidade nacional e reduzirá as queixas."
 ALG_gender_equality: "Promover a Igualdade de Gênero"
 ALG_gender_equality_desc: "Empoderar as mulheres argelinas por meio de direitos e oportunidades iguais é fundamental para construir uma sociedade justa e próspera."
 ALG_freedom_of_press: "Garantir a Liberdade de Imprensa"
 ALG_freedom_of_press_desc: "Uma imprensa livre é essencial para a democracia e a prestação de contas. Apoiar a mídia independente dará aos argelinos uma voz mais forte."
 ALG_judicial_reform: "Reforma Judicial"
 ALG_judicial_reform_desc: "Um judiciário moderno e independente garantirá julgamentos justos, reduzirá a corrupção e fortalecerá o Estado de direito."
 ALG_civil_society_empowerment: "Fortalecer a Sociedade Civil"
 ALG_civil_society_empowerment_desc: "Apoiar ONGs, sindicatos e organizações de base criará uma sociedade mais participativa e resiliente."
 ALG_digital_government: "Governo Digital"
 ALG_digital_government_desc: "A digitalização reduzirá a burocracia, melhorará a transparência e aproximará os serviços do governo das pessoas."
 ALG_public_service_efficiency: "Eficiência do Serviço Público"
 ALG_public_service_efficiency_desc: "Modernizando o setor público, podemos eliminar ineficiências e melhorar a prestação de serviços."
 ALG_anti_corruption_campaign: "Campanha Anticorrupção"
 ALG_anti_corruption_campaign_desc: "A corrupção mina o Estado. Uma campanha abrangente contra ela restaurará a confiança nas instituições da Argélia."
 ALG_e_governance_portal: "Portal de Governança Eletrônica"
 ALG_e_governance_portal_desc: "Criar uma plataforma integrada de governança eletrônica oferecerá aos cidadãos serviços públicos transparentes, rápidos e acessíveis."
 ALG_streamlined_bureaucracy: "Simplificar a Burocracia"
 ALG_streamlined_bureaucracy_desc: "Ao cortar a burocracia e modernizar as estruturas administrativas, a Argélia se tornará mais eficiente e competitiva."
 ALG_social_contract_21st_century: "Um Contrato Social para o Século XXI"
 ALG_social_contract_21st_century_desc: "Por meio de reformas na educação, saúde, bem-estar, direitos civis e administração, a Argélia forjará um novo contrato social que garanta estabilidade, justiça e prosperidade para as gerações futuras."
 ALG_corrupt_mil_idea: "Militares Corruptos"
 ALG_corrupt_mil_idea_desc: "Os militares argelinos, embora poderosos e profundamente entrincheirados na política, sofrem com uma corrupção generalizada. Recursos destinados à modernização e à eficiência são desviados por generais e redes de clientelismo. Isso mina a capacidade operacional e corrói a confiança pública, dificultando reformas e consolidando o papel do exército como guardião e, ao mesmo tempo, obstáculo ao progresso."
 ALG_military_oversight: "Supervisão Militar"
 ALG_military_oversight_desc: "Os militares estabeleceram uma supervisão rígida sobre a política e as instituições civis. Embora isso garanta estabilidade e evite o caos, também reduz a transparência, restringe reformas e reforça o domínio do exército na vida pública."
 ALG_gas_pipeline_leverage: "Influência dos Gasodutos"
 ALG_gas_pipeline_leverage_desc: "A extensa rede de gasodutos da Argélia para a Europa fornece uma poderosa ferramenta de barganha na política externa. A dependência energética deixa os parceiros cautelosos, mas também cria uma dependência excessiva das exportações de hidrocarbonetos para manter a influência política."
 ALG_resource_curse: "Maldição dos Recursos"
 ALG_resource_curse_desc: "Apesar das imensas reservas de petróleo e gás, a Argélia luta contra a 'maldição dos recursos'. A dependência de hidrocarbonetos alimenta a corrupção, desestimula a diversificação e expõe a economia à volatilidade dos mercados globais de energia."
 ALG_PM_Elections: "Nomear um Primeiro-Ministro"
 ALG_PM_Elections_desc: "\n£MAIN_desctext_elections\n\n\n\nO Presidente deve decidir sobre a nomeação de um Primeiro-Ministro para chefiar o governo. Essa escolha não é meramente administrativa; os diferentes candidatos representam visões concorrentes para o futuro da Argélia, de tecnocratas leais a reformistas da oposição."
 ALG_authority_more_70: "Os §YReformistas§! detêm pelo menos §Y70%§! da Influência £generic_anarchist_communism no Governo Argelino [ROOT.GetFlag]"
 ALG_PNA_victory_tt: "§YLe Pouvoir§! detém mais de §Y45%§! da Influência no Equilíbrio de Poder."
 ALG_prime_minister_name_loc: "Primeiro-Ministro"
 ALG_minister_bio_loc: "Detentor da autoridade executiva sob o Presidente."
 algeria_morocco.1.t: "A Questão do Marrocos"
 algeria_morocco.1.d: "As relações da Argélia com o Marrocos há muito são ofuscadas pelo amargo legado da Guerra das Areias, pelo conflito do Saara Ocidental e por décadas de fronteiras fechadas. Com as tensões ainda fervendo, a questão de como abordar o Marrocos se impõe. A Argélia deve redobrar sua rivalidade histórica ou tentar traçar um novo rumo de diálogo e cooperação?"
 algeria_morocco.1.a: "O futuro do Magrebe está em jogo."
 ALG_morocco_question: "A Questão Marroquina"
 ALG_morocco_question_desc: "Nossa rivalidade com o Marrocos pelo Saara Ocidental, a Guerra das Areias e o fechamento da fronteira por décadas deixaram a Argélia enfraquecida. Devemos decidir: vamos confrontar o Marrocos ou buscar a reconciliação?\n\n§YEste foco inicia o ramo da Questão Marroquina.§!"
 ALG_sand_war_legacy: "Legado da Guerra das Areias"
 ALG_sand_war_legacy_desc: "As feridas da Guerra das Areias de 1963 ainda persistem. Os argelinos se lembram das ambições marroquinas sobre nosso território, e muitos pedem vigilância renovada."
 ALG_close_the_border: "Fechar a Fronteira"
 ALG_close_the_border_desc: "A fronteira com o Marrocos continua sendo fonte de contrabando, agitação e espionagem. Fechá-la enviará uma forte mensagem de desafio."
 ALG_border_security_investments: "Investimentos em Segurança de Fronteira"
 ALG_border_security_investments_desc: "Devemos reforçar a fronteira oeste com postos militares permanentes, vigilância moderna e unidades de gendarmaria para manter a influência marroquina à distância."
 ALG_counter_moroccan_influence: "Contrapor a Influência Marroquina"
 ALG_counter_moroccan_influence_desc: "O Marrocos busca ativamente aliados no exterior. A Argélia deve contrapor essa ofensiva diplomática, cortando sua influência na África e além."
 ALG_support_polisario_struggle: "Apoiar a Luta da Polisário"
 ALG_support_polisario_struggle_desc: "O povo saaraui merece a independência. Ao apoiar a Frente Polisário, a Argélia fortalece seu papel como campeã da luta anticolonial no Magrebe."
 ALG_internationalize_conflict: "Internacionalizar o Conflito"
 ALG_internationalize_conflict_desc: "A questão do Saara Ocidental deve ser levada à ONU, à UA e a todos os foros possíveis para pressionar diplomaticamente o Marrocos."
 ALG_african_union_pressure: "Mobilizar a União Africana"
 ALG_african_union_pressure_desc: "Por meio da União Africana, a Argélia formará uma coalizão de Estados que pressionem o Marrocos a aceitar a autodeterminação saaraui."
 ALG_seek_dialogue_morocco: "Buscar o Diálogo com o Marrocos"
 ALG_seek_dialogue_morocco_desc: "A Argélia deve explorar canais diplomáticos com o Marrocos. Embora guerras e rivalidades passadas nos dividam, o diálogo pode levar à estabilidade regional."
 ALG_confidence_building: "Medidas de Construção de Confiança"
 ALG_confidence_building_desc: "Pequenos passos, como comitês conjuntos e restrições de visto reduzidas, podem criar a base para uma confiança duradoura com o Marrocos."
 ALG_reopen_borders: "Reabrir as Fronteiras"
 ALG_reopen_borders_desc: "Após anos de fechamento, reabrir a fronteira à livre circulação de pessoas e mercadorias seria um ponto de virada histórico em nossas relações."
 ALG_economic_cooperation: "Cooperação Econômica"
 ALG_economic_cooperation_desc: "A interdependência econômica com o Marrocos trará prosperidade, reduzirá as tensões e fortalecerá o papel regional da Argélia."
 ALG_security_cooperation: "Cooperação em Segurança"
 ALG_security_cooperation_desc: "Ameaças compartilhadas, como o terrorismo e o contrabando, exigem patrulhas conjuntas e troca de informações. A cooperação é mais eficiente do que a rivalidade."
 ALG_towards_maghreb_union: "Rumo a uma União do Magrebe"
 ALG_towards_maghreb_union_desc: "Com o Marrocos, a Argélia pode lançar as bases de uma forte União do Magrebe, ecoando os sonhos de nossos antepassados pela unidade norte-africana."
 ALG_morocco.1.t: "Debate na ONU sobre o Saara Ocidental"
 ALG_morocco.1.d: "A Argélia levou a questão do Saara Ocidental às Nações Unidas, condenando o controle do território pelo Marrocos. Os delegados debatem se o Marrocos deve se retirar ou se a Argélia está passando dos limites."
 ALG_morocco.1.a: "Condenar o Marrocos Duramente"
 ALG_morocco.1.b: "Pressionar por Sanções e Resoluções Moderadas"
 ALG_moroccan_rivalry_start: "Tensões de Fronteira com o Marrocos"
 ALG_moroccan_rivalry_start_desc: "Décadas de hostilidade com o Marrocos, alimentadas pela Guerra das Areias, pelo Saara Ocidental e pelo fechamento da fronteira em 1994, pesam muito sobre a Argélia. As tensões prejudicam nossa economia, estabilidade e prontidão militar.\n§REste espírito nacional não pode ser removido normalmente.§!\nSó será reduzido, substituído ou removido avançando pela árvore de focos da §YQuestão Marroquina§!."
 ALG_moroccan_rivalry_A1: "Contrapondo a Influência Marroquina"
 ALG_moroccan_rivalry_A1_desc: "A Argélia tomou medidas para atenuar a influência marroquina na região. A rivalidade persiste, mas seus efeitos estão sendo administrados com mais eficácia."
 ALG_moroccan_rivalry_A2: "Rivalidade Agravada"
 ALG_moroccan_rivalry_A2_desc: "As tensões com o Marrocos continuam a drenar o Estado, mas nossa determinação e reformas limitaram seu impacto."
 ALG_moroccan_rivalry_A_final: "Prontidão Militar contra o Marrocos"
 ALG_moroccan_rivalry_A_final_desc: "Após anos de confronto, a Argélia construiu um exército endurecido e capaz, pronto para o conflito. A rivalidade forjou força a partir da adversidade."
 ALG_moroccan_reconciliation_B1: "Aberturas Diplomáticas"
 ALG_moroccan_reconciliation_B1_desc: "A Argélia deu passos tímidos rumo ao diálogo com o Marrocos, criando oportunidades para uma cooperação limitada e para a construção de confiança."
 ALG_moroccan_reconciliation_B2: "Abrindo as Fronteiras"
 ALG_moroccan_reconciliation_B2_desc: "Com o aprofundamento dos laços diplomáticos, a Argélia reabriu suas fronteiras com o Marrocos, reduzindo a tensão econômica e fomentando o comércio regional."
 ALG_moroccan_reconciliation_B_final: "Cooperação no Magrebe"
 ALG_moroccan_reconciliation_B_final_desc: "A Argélia e o Marrocos abraçaram a cooperação, viabilizando comércio, desenvolvimento e liderança regional. A rivalidade finalmente ficou para trás."
 ALG_morocco_question_tt: "§YEste foco inicia o caminho da Questão Marroquina.§!\n\n- §RCaminho A:§! Buscar o confronto com o Marrocos - Enfraquecer gradualmente a ideia de penalidade, terminando com um §GExército Mais Forte§!.\n- §GCaminho B:§! Buscar a reconciliação com o Marrocos - Trocar a ideia de penalidade por §GBônus Positivos§! cada vez melhores, terminando com uma §YEconomia e Diplomacia§! mais fortes."
 alg_general.1.t: "O Retorno de Khaled Nezzar"
 alg_general.1.d: "Com a decisão de reviver os métodos da Década Negra, o controverso ex-Ministro da Defesa, Khaled Nezzar, é novamente chamado. Sua abordagem de mão de ferro pode estabilizar o exército, mas corre o risco de alienar a população e atrair críticas internacionais."
 alg_general.1.a: "O passado retorna para guiar o presente."
