 IS_title_ai_race: "AI 경쟁"
 AI_RACE_tab_status_off: "이 게임의 규칙에서 AI 경쟁이 꺼져 있습니다."
 AI_RACE_tab_status_upcoming: "경쟁은 2016년 1월에 시작됩니다. 현대식 딥러닝을 연구한 모든 국가가 참가하며, 그때부터 단계 투자가 열립니다."
 AI_RACE_tab_status_empty: "아직 경쟁에 참가한 국가가 없습니다. 현대식 딥러닝을 연구하면 경쟁에 참가합니다."
 AI_RACE_tab_status_full: "모든 참가국은 분기마다 단계, 완료한 단계 작업, 역량을 기준으로 순위가 매겨집니다.\n최첨단 AI 최초 달성: §Y[ai_race_first_finisher_name]§!"
 AI_RACE_tab_status_outcomes: "결과만 평가: 참가국은 분기마다 역량을 기준으로 순위가 매겨집니다. 이 게임의 규칙에서 단계 투자는 꺼져 있습니다."
 AI_RACE_tab_leaderboard: "세계 순위표"
 AI_RACE_tab_status_tt: "2016년 1월부터 §Y현대식 딥러닝§!을 연구한 모든 국가가 경쟁에 참가합니다. 순위는 분기마다 다시 계산됩니다."
 AI_RACE_tab_leaderboard_tt: "국가는 단계, 다음 단계를 위해 완료한 작업, §Y역량§! 순으로 순위가 매겨집니다.\n단계는 §Y연구§!, §Y구현§!, §Y확장§!, §Y최첨단 AI§!입니다. 국가가 자기 단계에 필요한 공장, 네트워크, 전력, 자재가 부족해지면 역량이 낮아집니다."
 AI_RACE_tab_help_tt: "§YAI 경쟁§!\n2016년부터 현대식 딥러닝을 보유한 국가는 네 개의 국가 AI 단계에 자금을 투입할 수 있습니다. 각 단계에는 선투자 비용이 들고, 민간 공장, 네트워크 기반시설, 전력, 마이크로칩, 복합재, 석유가 필요합니다. 자금이 투입된 단계는 연구 속도, 생산 효율 성장, 사무 부문 소득을 높여 줍니다."
 AI_RACE_tab_help_tt_delayed: "자국 프로그램은 §Y결정§!의 §YAI 경쟁§! 항목에서 관리합니다. 현재 단계, 여섯 가지 요구 사항, 금융 지원, 단계 검토를 다룹니다. 이 탭에는 세계 순위표가 표시됩니다. 게임 규칙에서 경쟁을 전체, 결과만, 끄기 중에서 설정할 수 있습니다."