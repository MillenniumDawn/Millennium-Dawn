 SPR_lgbtq_affirmations_idea_desc: "LGBTQ+ 권리에 대한 공개적 지지 선언은 사회주의 연합을 결집시키고 대중적 정당성을 넓혔습니다."
 SPR_canarios_revolt_against_spain_mission: "[95.GetName]에서 임박한 §Y[CNR.GetFlag][CNR.GetAdjective]§! 반란"
 SPR_canarios_revolt_against_spain_mission_desc: "카나리오스는 국가에 맞선 반란을 준비하고 있습니다. 검은 먹구름이 마드리드 위로 몰려들기 시작합니다."
