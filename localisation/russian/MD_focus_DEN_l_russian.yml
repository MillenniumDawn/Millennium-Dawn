 DEN_idea_nordefco: "NORDEFCO"
 DEN_idea_nordefco_desc: "Северное оборонное сотрудничество (NORDEFCO) — сотрудничество стран Северной Европы в области обороны. В него входят пять стран: Дания, Финляндия, Исландия, Норвегия и Швеция. Цель организации — укрепить оборонный потенциал стран-участниц, выявляя направления для сотрудничества и продвигая эффективные решения."
 DEN_culture_modifier: "Датская культура"
 DEN_the_state: "Королевство Дания"
 DEN_industrial_modifier: "Датская промышленность"
