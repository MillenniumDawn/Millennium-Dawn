l_french:
 reserve_currency: "Politique de monnaie de réserve"
 reserve_currency_desc: "La monnaie de référence des réserves monétaires et de la dette internationale de cette nation. Les pays alignés sur une grande monnaie de réserve accèdent à ses réseaux de liquidité et à ses infrastructures de règlement, tandis que ceux qui conservent des réserves nationales gardent une pleine souveraineté monétaire au prix d'un accès plus limité au crédit international."
 us_dollar: "Dollar américain"
 us_dollar_desc: "La monnaie de réserve mondiale dominante. Détenir des réserves en dollars offre une liquidité inégalée et l'accès aux marchés internationaux du crédit, mais expose le pays aux coûts d'une dette libellée en dollars qui gonflent lorsque la monnaie nationale s'affaiblit."
 euro: "euro"
 euro_desc: "La monnaie de l'Union européenne, deuxième monnaie de réserve la plus échangée au monde. Disponible aux États membres de l'UE, l'euro offre une stabilité monétaire régionale et un accès privilégié aux marchés de capitaux européens."
 chinese_yuan: "Yuan chinois"
 chinese_yuan_desc: "Le renminbi, monnaie nationale de la Chine, est un actif de réserve émergent promu par Pékin comme alternative à la domination du dollar. Les partenaires commerciaux de l'orbite économique chinoise bénéficient de son réseau de règlement en expansion."
 russia_rouble: "Rouble russe"
 russia_rouble_desc: "La monnaie de la Fédération de Russie, utilisée au sein de l'Union économique eurasiatique et parmi les partenaires commerciaux postsoviétiques. Détenir des réserves en roubles intègre un pays aux systèmes de paiement alternatifs et au cadre de règlement énergétique russes."
 japanese_yen: "Yen japonais"
 japanese_yen_desc: "La monnaie du Japon et la troisième monnaie la plus échangée au monde. Les pays de l'orbite économique japonaise bénéficient de ses réseaux de règlement établis et de la relative stabilité du yen, même si son adoption comme réserve hors d'Asie de l'Est reste limitée."
 british_pound: "Livre britannique"
 british_pound_desc: "La plus ancienne monnaie de réserve encore en usage international. La livre sous-tend les flux commerciaux et financiers du Commonwealth et conserve un poids notable dans les réserves de change mondiales, offrant aux pays alignés sur le Royaume-Uni un accès stable aux vastes marchés de capitaux de Londres."
 swiss_frank: "Franc suisse"
 swiss_frank_desc: "La monnaie de la Suisse, reconnue mondialement comme valeur refuge. Rarement adoptée comme réserve formelle par d'autres nations, la stricte discipline monétaire du franc et la neutralité politique de la Suisse le rendent particulièrement résistant aux crises de change et aux chocs extérieurs."
 no_foreign_reserve: "Réserve intérieure"
 no_foreign_reserve_desc: "Cette nation détient ses réserves en monnaie nationale plutôt que selon un étalon étranger. Elle conserve une pleine souveraineté monétaire et s'isole des chocs de change extérieurs, mais renonce à l'accès aux réseaux de liquidité et aux facilités de crédit internationales liées aux grandes monnaies de réserve."
 currency_strength_modifier: "Force de la monnaie"
 reserve_roi_bonus: "Retour sur investissement de la devise de réserve"
 reserve_roi_bonus_desc: "Rendement d'investissement supplémentaire lié à la détention d'une forte monnaie de réserve étrangère. Il évolue chaque mois avec la force de la monnaie de l'émetteur et la taille de son réseau d'adoption. Une économie émettrice en recul réduit ce bonus."
 reserve_trade_bonus: "Alignement commercial des devises de réserve"
 reserve_trade_bonus_desc: "Petit bonus d'opinion commerciale pour opérer au sein du même bloc monétaire. Il reflète les relations commerciales préférentielles et l'infrastructure de paiement partagées entre nations utilisant la même monnaie de réserve."
 seigniorage_income_modifier: "Revenus de seigneuriage"
 monetary_policy_decisions: "Politique monétaire"
 currency_backing: "Support en devises"
 currency_backing_desc: "L'étalon d'actifs sous-jacent à la monnaie nationale. Les étalons métalliques lient la monnaie à une réserve de matières premières, imposant une discipline mais limitant la flexibilité monétaire. Les systèmes fiduciaires permettent une pleine souveraineté monétaire au prix d'un risque d'inflation plus élevé."
 gold_standard_back: "L’étalon-or"
 gold_standard_back_desc: "La monnaie nationale est arrimée à l'or et convertible en or à un taux fixe. L'expansion monétaire est contrainte par les réserves physiques d'or, inspirant confiance à long terme mais limitant la capacité du gouvernement à répondre aux crises économiques."
 silver_standard: "Étalon-argent"
 silver_standard_desc: "La monnaie nationale est adossée à des réserves d'argent à un taux de conversion fixe. Moins restrictif qu'un arrimage à l'or, l'étalon-argent offre une certaine discipline marchande tout en laissant un peu plus de flexibilité monétaire."
 bi_metal_standard: "Bimétallisme"
 bi_metal_standard_desc: "La monnaie est adossée à l'or et à l'argent selon des ratios de change fixes. Adopté historiquement pour élargir la base monétaire, cet étalon allie discipline marchande et plus de flexibilité d'offre qu'un arrimage à un seul métal."
 no_currency_backing: "Monnaie fiduciaire"
 no_currency_backing_desc: "La monnaie n'est adossée qu'à l'autorité et à la solvabilité du gouvernement émetteur. Sans contrainte de matières premières, la politique monétaire est pleinement flexible, permettant une réponse rapide aux crises mais accroissant la vulnérabilité aux pressions inflationnistes."
 gulden: "Florin néerlandais"
 gulden_desc: "L'ancienne monnaie des Pays-Bas, réintroduite après la sortie de la zone euro. Soutenu par une stricte discipline monétaire et un large excédent commercial, le florin confère une pleine souveraineté monétaire et isole l'économie des chocs extérieurs, au prix de la profonde liquidité des grands blocs de réserve, et il est rarement détenu à l'étranger."
