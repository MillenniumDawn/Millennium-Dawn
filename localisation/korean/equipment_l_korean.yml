 BSH_SP_Anti_Air_2: "2K22 퉁구스카"
 BSH_SP_Anti_Air_2_desc: "최대 8발의 미사일을 발사할 수 있는 이 기체는 접근하는 모든 항공기를 격추할 수 있습니다. 뿐만 아니라 자동포로 수송기도 파괴할 수 있습니다."
 BSH_SP_Anti_Air_3: "판치르-S1M"
 BSH_SP_Anti_Air_4: "판치르-S4L"
 BSH_SP_R_arty_0: "BM-21 그라드"
 BSH_SP_R_arty_0_desc: "Not used much in modern operations the grandfather of SAMS and MLRS was used mostly in WW2 and Afghanistan. Being effective at 20km."
 BSH_SP_R_arty_1: "BM-30 스메르치"
 BSH_SP_R_arty_1_desc: "이 차량은 그라드 전차의 현대화된 버전입니다. 눈, 얼음, 사막 등 세계 어디든 갈 수 있으며, 유효 사거리는 35km입니다."
 BSH_SP_R_arty_2: "9A52-4 토르나도"
 BSH_SP_R_arty_2_desc: "An extremely heavy artillery battery that if not dealt with, it can destroy entire cities. With a maximum range of 90km."
 BSH_SP_arty_0: "2S1 Gvozdika"
 BSH_SP_arty_0_desc: "The 2S1 Gvozdika is a Soviet self-propelled howitzer based on the MT-LBu multi-purpose chassis, mounting a 122 mm 2A18 howitzer. \"2S1\" is its GRAU designation. An alternative Russian designation is SAU-122 but in the Russian Army it is commonly known as Gvozdika."
 BSH_SP_arty_1: "2S3 아카치야"
 BSH_SP_arty_1_desc: "필요하다면 태양도 쏠 수 있을 만큼 강력한 152.4mm D-22 대포로 무장한 이 포병대는 사거리가 50km에 달하는 놀라운 화력을 자랑합니다."
 BSH_SP_arty_2: "2S19M2 므스타-S"
 BSH_SP_arty_2_desc: "The 2S19 Msta-S was developed towards the end of the Cold War, incorporating new technologies and boasting an increased range compared to its predecessor."
 BSH_SP_arty_3: "2S35 코알리치야-SV"
 BSH_SP_arty_3_desc: "The 2S35 is a true 21st century artillery platform with widespread automation, automatic shell type selection and unified command-and-control systems."
 BSH_SP_arty_4: "2S38 코알리치야-M"
