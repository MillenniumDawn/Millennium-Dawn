 HOL_Stork_PWV_armor_manufacturer: "Stork PWV"
 HOL_Stork_PWV_armor_manufacturer_desc:0 "A Stork PWV (Panserwielvoertuigen) tem uma longa história na produção de veículos blindados e sistemas de defesa de alta qualidade, contribuindo para a proteção e a mobilidade do pessoal militar holandês no campo de batalha."
