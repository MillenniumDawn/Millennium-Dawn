 SER.communist_state: "£SER_emerging_communism 南斯拉夫新共产党"
 SER.communist_state_icon: "£SER_emerging_communism"
 SER.communist_state_desc: "共产主义 - 南斯拉夫新共产党（Nova Komunistička Partija Jugoslavije）。南斯拉夫新共产党成立于1990年，是作为南斯拉夫共产主义者联盟的非铁托主义替代选择。"
 SER.communist_state_2017: "£SER_emerging_communism_alt 共产党"
 SER.communist_state_2017_icon: "£SER_emerging_communism_alt"
 SER.communist_state_2017_desc: "共产主义 - Komunistička Partija（共产党）。该党由南斯拉夫新共产党与诺维萨德社会民主党合并而成。党魁是约瑟普·布罗兹·铁托的孙子。"
 SEY.communist_state: "£generic_Communist_State_small 塞舌尔人民进步阵线（强硬派）"
 SEY.communist_state_desc: ""
 SIA.communist_state: "£SIA_emerging_communism (CPT) - 泰国共产党"
 SIA.communist_state_icon: "£SIA_emerging_communism"
 SIA.communist_state_desc: "（马克思列宁主义） - 泰国共产党是1942年早已解散的南海共产党的分支，在其大部分历史中一直被泰国境内取缔。对泰国政府的激进反对，越南战争战况以及自身在扩大队伍方面的成功，最终促成了1965年对泰国政府的起义。尽管随着冷战的结束和社会主义阵营的解体，该党已逐渐从公众视野中消失。自90年代初以来，该党被认为已经解散，且未发动任何行动或运动。"
 SIB.communist_state: "£SIB_emerging_communism 统一共产党"
 SIB.communist_state_icon: "£SIB_emerging_communism"
 SLO.communist_state: "£SLO_emerging_communism (KSS) - 斯洛伐克共产党"
 SLO.communist_state_icon: "£SLO_emerging_communism"
 SLO.communist_state_desc: ""
 SLV.communist_state: "£generic_Communist_State_small 斯洛文尼亚共产党"
 SLV.communist_state_desc: "共产主义 - 斯洛文尼亚共产党（Komunistična partija Slovenije）人们对其知之甚少，因为原共产党成员大多转入了社会民主党，共产党仍出现在选票上，但只获得少量选票。大约一千五百票左右。"
 SMA.communist_state_2000: "£SMA_emerging_communism 圣马力诺共产主义重建"
 SMA.communist_state_2000_icon: "£SMA_emerging_communism"
 SMA.communist_state_2000_desc: ""
 SMA.communist_state_2017: "£SMA_emerging_communism_alt 民主社会主义左翼"
 SMA.communist_state_2017_icon: "£SMA_emerging_communism_alt"
 SMA.communist_state_2017_desc: ""
 SOO.communist_state: "£SOO_emerging_communism 胡萨尔·伊里斯托尼共产主义党"
 SOO.communist_state_icon: "£SOO_emerging_communism"
 SOO.communist_state_desc: "南奥塞梯共产党是南奥塞梯历史最悠久的政党。该党积极为复兴国内的共产主义理想而奋斗。"
 SOO.communist_state_sov: "£SOV_emerging_communism 俄罗斯联邦共产党"
 SOO.communist_state_sov_icon: "£SOV_emerging_communism"
 SOV.communist_state: "£SOV_emerging_communism (CPRF) 俄罗斯联邦共产党"
 SOV.communist_state_icon: "£SOV_emerging_communism"
 SOV.communist_state_desc: "(21世纪社会主义) 俄罗斯联邦共产党 (俄语: Kommunisticheskaya Partiya Rossiyskoy Federatsii)\n\n 俄罗斯联邦共产党是旧苏联共产党的继承者。它信奉马克思列宁主义，在俄罗斯整个后苏联历史中一直是第二大政党。"
 SOV.communist_state_alt: "£SOV_gorba (SDPR) 俄罗斯社会民主党"
 SOV.communist_state_alt_icon: "£SOV_gorba"
 SOV.communist_state_alt_desc: "（民主社会主义）俄罗斯社会民主党\n\n俄罗斯社会民主党是由俄罗斯联邦共产党衍生出的广泛社会主义政党。它主张民主社会主义，并支持改革与开放政策。"
 SOV.communist_state_alty: "£SOV_kpss (CPSU) 苏联共产党 - §G中间派§!"
 SOV.communist_state_alty_icon: "£SOV_kpss"
 SOV.communist_state_alty_desc: "（马克思列宁主义）苏联共产党\n\n苏共是苏联的执政党，进入21世纪后重新崛起的苏共，依然坚持马克思列宁主义和民主集中制。"
 SPR.communist_state: "£SPR_pce 西班牙共产党"
 SPR.communist_state_icon: "£SPR_pce"
 SPR.communist_state_desc: "共产主义 - 西班牙共产党（Partido Comunista de España）是西班牙主要的共产主义运动。它遵循大多数主要共产党的模式，寻求建立一个为集体服务的世俗社会。\n"
 SRI.communist_state: "£generic_Communist_State_small 人民解放阵线"
 SRI.communist_state_desc: ""
 SSU.communist_state: "£generic_Communist_State_small (CPSS) - 南苏丹共产党"
 SSU.communist_state_desc: "（共产主义） - 南苏丹共产党是苏丹共产党的南部支部。"
 SUD.communist_state: "£generic_Communist_State_small (SCP) - 苏丹共产党"
 SUD.communist_state_desc: "（马克思列宁主义） - 苏丹共产党（al-Hizb al-Shuyui al-Sudani）是苏丹历史最悠久的政党之一（成立于1946年），在苏丹独立后不久便成为该国的一支重要力量。1971年加法尔·尼迈里发动政变后，该党的领袖人物遭到监禁和处决，此后再也未能恢复元气。该党反对巴希尔统治。"
 SWA.communist_state: "£generic_Communist_State_small (SWACOPA) - 斯威士兰共产党"
 SWA.communist_state_desc: "(马克思列宁主义)\n斯威士兰共产党\n\n斯威士兰共产党成立于1994年，成立后几乎立即被斯威士兰国王姆斯瓦蒂三世取缔。\n\n自被取缔以来，斯威士兰共产党一直在南非边境对面的卡姆卢什瓦镇流亡活动。"
 SWE.communist_state: "£SWE_emerging_communism (K) - 瑞典共产党"
 SWE.communist_state_icon: "£SWE_emerging_communism"
 SWE.communist_state_desc: "（马克思列宁主义） - 瑞典共产党成立于1995年，作为工人党共产党人的延续，自称为一个以强硬正统的马克思列宁主义信仰为核心的反修正主义政党。在意识形态上，它比传统的反修正主义团体更偏左，拥护LGBTQ权利并高度重视社会议题。自冷战结束以来，它在瑞典的选举成绩不如更倾向于改良主义的左翼组织。"
 SWI.communist_state: "£generic_Communist_State_small (KPS) - 瑞士共产党"
 SWI.communist_state_icon: "£generic_Communist_State_small"
 SWI.communist_state_desc: "（马克思列宁主义） - 瑞士共产党\n\n由劳动党干部重建为社会主义共和国的执政党，瑞士共产党声称继承了1940年被联邦委员会取缔的原党的遗产。它吸收了团结党和较小的极左组织，合并为一个单一组织，其中央委员会现在取代公投制定政策。"
 SYR.communist_state: "£SYR_Communist_State 叙利亚共产党"
 SYR.communist_state_icon: "£SYR_Communist_State"
 SYR.communist_state_desc: "（马克思列宁主义） - 叙利亚共产党是1924年在叙利亚成立的政党。1972年，它成为全国进步阵线的成员。1986年，该党分裂为两个独立的政党，均声称代表原来的叙利亚共产党：叙利亚共产党（统一）和叙利亚共产党（巴格达什）。叙利亚共产党指的是这两个分裂团体合计的总支持率。"
 SYR.communist_state_Bak_desc: "叙利亚共产党是叙利亚的一个政党，成立于1924年。1972年，它成为全国进步阵线的成员。1986年，该党分裂为两个独立的政党，均声称代表原来的叙利亚共产党：叙利亚共产党（统一）和叙利亚共产党（巴格达什）。后者实际上控制了国家，并宣布实行一党制国家。"
 SYR.communist_state_Fai_desc: "叙利亚共产党是叙利亚的一个政党，成立于1924年。1972年，它成为全国进步阵线的成员。1986年，该党分裂为两个独立的政党，均声称代表原来的叙利亚共产党：叙利亚共产党（统一）和叙利亚共产党（巴格达什）。前者实际上控制了国家，并宣布实行一党制国家。"
 TAI.communist_state: "£TAI_Communist_State (LP) 劳工党"
 TAI.communist_state_icon: "£TAI_Communist_State"
 TAI.communist_state_desc: "（务实社会主义） - 劳工党成立仅仅是为了主张在“一国两制”原则下与大陆统一，除此之外几乎没有自己的政纲或主张。该党名义上信奉社会主义，反对其所谓的“美帝国主义”以及台湾内部不合法的选举制度。"
 TAJ.communist_state: "£TAJ_emerging_communism (CPT) - 塔吉克斯坦共产党"
 TAJ.communist_state_icon: "£TAJ_emerging_communism"
 TAJ.communist_state_desc: "（苏维埃民族主义） - 塔吉克斯坦共产党\n\n作为塔吉克斯坦首个也是最古老的政党，塔吉克斯坦共产党建立在民主集中制思想之上，并秉持与其他后苏联时期共产党相似的立场。该党在国际共产主义舞台上相当活跃，拥有众多党外联系。该党隶属于共产党联盟 - 苏联共产党。"
 TAT.communist_state: "£SOV_emerging_communism 鞑靼斯坦共产党"
 TAT.communist_state_icon: "£SOV_emerging_communism"
 TAT.communist_state_desc: "鞑靼斯坦共和国共产党（KPRT）是一个共产主义政党。鞑靼斯坦共产党之所以从俄罗斯共产党中单独分离出来，显然是因为1990年鞑靼苏维埃社会主义共和国主权宣言的通过以及鞑靼斯坦即将从俄罗斯分离。"
 TIM.communist_state: "£generic_Communist_State_small 东帝汶社会党"
 TIM.communist_state_desc: ""
 TRI.communist_state: "£generic_Communist_State_small (CPTT) - 特立尼达和多巴哥共产党"
 TRI.communist_state_desc: ""
 TRK.communist_state: "£generic_Communist_State_small (CPT) 土库曼斯坦共产党"
 TRK.communist_state_desc: "(马克思列宁主义) - 土库曼斯坦共产党\n\n土库曼斯坦共产党是苏联共产党的分支，也是土库曼苏维埃社会主义共和国的执政共产党。"
 TUR.communist_state: "£TUR_Communist_State (IP) 土耳其工人党"
 TUR.communist_state_icon: "£TUR_Communist_State"
 TUR.communist_state_desc: "（毛主义-凯末尔主义）- 工人党\n\n工人党是一个毛主义-凯末尔主义政党，他们将阿塔图尔克颂扬为资产阶级的左翼英雄。他们支持与古巴和委内瑞拉等其他社会主义国家结盟，并反对美国的扩张主义。他们对库尔德人的观点是，库尔德农民必须摆脱封建枷锁，与土耳其人一起加入反帝民主革命。\n\n军方对该党§Y态度§!：§R-25§!"
 TUR.communist_state_2015: "£TUR_Communist_State_2015 祖国"
 TUR.communist_state_2015_icon: "£TUR_Communist_State_2015"
 TUR.communist_state_2015_desc: "VATAN - 祖国党是毛主义凯末尔主义工人党的重新包装，反对美国扩张主义。该党声称是社会主义者、革命者、民族主义者和凯末尔主义者的先锋队。\n\n军方对该党§Y态度§!：§R-25§!"
 TUV.communist_state: "£SOV_emerging_communism 图瓦共产党"
 TUV.communist_state_icon: "£SOV_emerging_communism"
 UAE.communist_state: "£generic_Communist_State_small 阿联酋阿拉伯社会主义委员会"
 UAE.communist_state_desc: ""
 UDM.communist_state: "£SOV_emerging_communism 乌德穆尔特共产党"
 UDM.communist_state_icon: "£SOV_emerging_communism"
 UKR.communist_state: "£ukr_cpu (KPU) - 乌克兰共产党"
 UKR.communist_state_icon: "£ukr_cpu"
 UKR.communist_state_desc: "（马列主义）- 乌克兰共产党\n\n乌克兰共产党于1993年重新合法化，直到2002年一直是议会中最大的派别，也是苏联怀旧情绪和亲俄政治的主要载体。"
 UKR.communist_state_banned: "£ukr_cpu (KPU) - 乌克兰共产党(被禁)"
 UKR.communist_state_banned_icon: "£ukr_cpu"
 UKR.communist_state_banned_desc: "（马列主义）- 乌克兰共产党(被禁)\n\n乌克兰共产党于2022年7月5日被法院判决取缔。"
 URA.communist_state: "£URA_emerging_communism (LF) - 劳工阵线"
 URA.communist_state_icon: "£URA_emerging_communism"
 URG.communist_state: "£URG_emerging_communism 乌拉圭共产党 (PCU)"
 URG.communist_state_icon: "£URG_emerging_communism"
 URG.communist_state_desc: ""
 USA.communist_state: "£USA_Communist_State_small 美国共产党"
 USA.communist_state_icon: "£USA_Communist_State_small"
 USA.communist_state_desc: "£USA_Communist_State_small 共产主义国家 - 美国共产党成立于1919年，是在美国社会党发生重大分裂后建立的。它一直与美国劳工运动以及世界各地的其他共产党保持着密切联系。20世纪初，美共曾是一股重要力量，直到在第一次红色恐慌中被迫转入地下。近年来，该党在美国年轻群体中获得了一些有限的支持。"
 USB.communist_state: "£USA_free_socialist_party 自由社会党"
 USB.communist_state_icon: "£USA_free_socialist_party"
 USB.communist_state_desc: "£USA_free_socialist_party 自由社会党 - (国家主义派/FSPS)作为自由社会党中更为传统的社会主义阵营，该派系寻求建立无产阶级专政，以使工人获得他们应得的公正待遇。其主要主张是反选举，但同时支持扩张主义和对外干预。然而最具争议的一点是，他们严格奉行反美主义，这意味着他们并不寻求统一大陆，而是要锻造一种全新的身份认同。"
 VEN.communist_state: "£VEN_emerging_communism 委内瑞拉共产党"
 VEN.communist_state_icon: "£VEN_emerging_communism"
 VEN.communist_state_desc: "委内瑞拉共产党（Partido Comunista de Venezuela，PCV）成立于1931年，是委内瑞拉现存最古老的政党，并且在1971年分裂为敌对派系之前，一直是该国的主要左翼政党。"
 VIE.communist_state: "£generic_Communist_State_small (CPV) 越南共产党（强硬派）"
 VIE.communist_state_desc: "（马克思列宁主义） - 越南共产党由胡志明于1930年将多个共产主义组织合并而成，在其存在的大部分时间里，该党一直在为反对国家受外国统治而斗争。该党融合了越南民族主义与马克思列宁主义思想，在冷战期间与西方对立，并与苏联和经互会结盟，同时为在共产主义统治下统一国家而开展斗争。统一后，该党曾短暂地与附属政党一起参加选举，但到90年代，大多数附属政党已被完全吸收进越南共产党本身。随着东欧集团的崩溃和中国政治的转变，越南共产党采取了日益改革的立场；采纳了市场改革的要素，并寻求与西方建立更紧密的关系。"
 VTB.communist_state_sov: "£SOV_emerging_communism 俄罗斯联邦共产党"
 VTB.communist_state_sov_icon: "£SOV_emerging_communism"
 WAA.communist_state: "£WAA_Autocracy 佤邦联合党（UWSP）"
 WAA.communist_state_desc: "（毛主义）- 缅甸佤邦联合党是缅甸掸邦北部自治区佤邦的执政党。该党成立于1989年11月3日，由缅甸国家联合党与若干较小的非共产主义佤族团体合并而成。佤邦联合党以毛主义为意识形态，作为唯一合法政治组织统治佤邦。该党与中华人民共和国关系密切，引导佤邦进一步融入中国，并远离缅甸自身的冲突。"
