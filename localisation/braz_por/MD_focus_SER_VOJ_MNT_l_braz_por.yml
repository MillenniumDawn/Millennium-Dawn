 ser_export.3.a: "Ótimo."
 ser_export.4.t: "Exportação de Armas"
 ser_export.4.d: "[FROM.GetFlag]Eles compraram nossos Rifles"
 ser_export.4.a: "Ótimo."
 ser_export.5.t: "Exportação de Armas"
 ser_export.5.d: "[FROM.GetFlag]Eles recusaram comprar nossas armas"
 ser_export.5.a: "Triste"
 SER_the_kingdom_of_serbia: "Nova Sérvia Nacionalista"
 SER_the_kingdom_of_serbia_desc: "É hora de acabar com a era de humilhação do povo sérvio, vamos lutar pela revitalização nacional de nossa nação"
 SER_ter_down_communist_narratives: "Derrubando os Comunistas"
 SER_ter_down_communist_narratives_desc: "Devemos parar a disseminação da doença marxista e reforçar o patriotismo sérvio!"
 SER_end_modern_decadence: "Revival of The National Spirit"
 SER_end_modern_decadence_desc: "We will begin the revival of the national spirit of the great Serbian people - now!"
 SER_cultural_reawakening: "Renascimento Cultural"
 SER_cultural_reawakening_desc: "A cultura sérvia é uma das maiores do mundo! Temos que revivê-la."
 SER_national_reforms: "Reforma Nacional"
 SER_national_reforms_desc: "As primeiras reformas em breve estarão prontas e serão anunciadas ao povo. Abaixo do desprezo pelos sérvios em seu próprio território"
 SER_loyal_military: "Um Exército Leal"
 SER_loyal_military_desc: "Um estado forte deve ter um exército forte e leal. Vamos lutar pela lealdade do exército de nosso país"
 SER_traditional_family_values: "Valores Familiares Tradicionais"
 SER_traditional_family_values_desc: "A família tradicional é o motor da expansão do povo sérvio, não precisamos de valores ocidentais aqui"
 SER_reinforce_the_population: "Reforçar a População"
 SER_reinforce_the_population_desc: "Cada sérvio deve estar pronto para defender o país com armas em mãos, não podemos permitir que nosso povo assista em silêncio novamente enquanto seu país está morrendo"
 SER_autarkal_transition: "Transição Autártica"
 SER_autarkal_transition_desc: "We will strive for autarky, our people must become economically independent"
 SER_bread_and_mother_serbia: "Pão e Mãe Sérvia"
 SER_bread_and_mother_serbia_desc: "Vamos louvar nossa pátria para que todos saibam o quanto amamos Mãe Sérvia!"
 SER_rally_the_hope_of_the_people: "Aglomerar a Esperança do Povo"
 SER_rally_the_hope_of_the_people_desc: "A esperança é o maior motivador do povo para realizar milagres! Deixe o povo esperar pelo retorno da antiga grandeza de nossa nação"
 SER_nationalize_motor_industries: "Nacionalizar Indústrias de Motores"
 SER_nationalize_motor_industries_desc: "Não daremos nada aos capitalistas ocidentais, nossa indústria pertencerá ao nosso país!"
 SER_reincorporation_of_resources: "Reincorporação de Recursos"
 SER_reincorporation_of_resources_desc: "Os recursos naturais da Sérvia serão devolvidos das mãos de oficiais do Ocidente"
 SER_luxury_parties_end: "O Fim das Ideias Ocidentais na Sérvia"
 SER_luxury_parties_end_desc: "Os valores ocidentais finalmente serão apagados da esfera política sérvia, e nós exterminaremos ativamente os ideólogos dessas ideias"
 SER_kosovo_uprising: "Rebelião em Kosovo"
 SER_kosovo_uprising_desc: "Vamos retomar Kosovo para nós mesmos, sem compromissos"
 SER_reinstate_the_church_in_macedonia: "Restabelecer a Igreja da Macedônia"
 SER_reinstate_the_church_in_macedonia_desc: "Vamos trazer de volta para este país a verdadeira igreja"
 SER_reinstate_church_bulgaria: "Restabelecer a Igreja da Bulgária"
 SER_reinstate_church_bulgaria_desc: "Vamos trazer de volta para este país a verdadeira igreja"
 SER_independent_frontier: "Uma Fronteira Independente"
 SER_independent_frontier_desc: "A fronteira de nossa república é como uma grande muralha, vamos guardá-la com firmeza e sem esperança de que o inimigo a ultrapasse"
 SER_nationalist_propaganda: "Propaganda Nacionalista"
 SER_nationalist_propaganda_desc: "Devemos garantir que nossa população ouça apenas a narrativa correta de nosso partido!"
 SER_serbian_revanchism: "Revanchismo Sérvio"
 SER_serbian_revanchism_desc: "We will still take revenge on our enemies and abusers, revanchism in Serbian, what our enemies will be afraid of."
 SER_legacy_of_stefan_dusan: "O Legado de Dušan"
 SER_legacy_of_stefan_dusan_desc: "O grande passado da Sérvia motiva muitos de nossos cidadãos a se juntarem ao exército, porque somente pela força das armas podemos restaurar a antiga grandeza de nosso país"
 SER_autark_idea: "Autarquia Sérvia"
 SER_inner_policy: "Política Interna"
 SER_nati_idea: "New National Spirit"
 SER_idea_loyal_military: "Exército Leal"
 SER_democratic_ascendant: "O Ascendente Democrático"
 SER_democratic_ascendant_desc: "Nossa história como estado democrático começa agora, devemos dar o exemplo para nossas nações balcânicas vizinhas, já que a região é muito instável, seremos um farol de luz."
 SER_Join_the_united_nations: "Entrar nas Nações Unidas"
 SER_Join_the_united_nations_desc: "Enquanto no passado era inatingível ou simplesmente uma má ideia, agora temos boas razões para ingressar na ONU."
 SER_increase_federalization: "Aumentar Federalização"
 SER_increase_federalization_desc: "Vamos federalizar tudo o que pudermos e, esperançosamente, erradicar as ervas daninhas que persistem entre nós."
 SER_shift_towards_mixed_economy: "Mudança para uma Economia Mista"
 SER_shift_towards_mixed_economy_desc: "Nossa economia atual funciona, mas não prospera. Devemos mudar nossa operação para podermos entrar em uma era de crescimento econômico."
 SER_protect_local_industries: "Proteger Indústrias Locais"
 SER_protect_local_industries_desc: "The industries run by family businesses are our most critical. To remove them is to remove the core of Serbian people and their drive."
 SER_protect_landlords: "Proteger Proprietários"
 SER_protect_landlords_desc: "Os proprietários facilitam muito o negócio imobiliário para nós. Sem eles, estaríamos gravemente deficientes e precisaríamos de ajuda desesperadamente."
 SER_common_worker: "O Trabalhador Comum"
 SER_common_worker_desc: "A Sérvia se sustenta na base das pessoas que a alimentam. Devemos garantir que tenhamos os melhores interesses deles em mente em qualquer operação."
 SER_external_weapons_dev: "Desenvolvimento Externo de Armas"
 SER_external_weapons_dev_desc: "As armas que usamos são tão importantes quanto os soldados que comandamos. Embora nossa produção doméstica não seja ótima, podemos comprar o equipamento adequado no exterior."
 SER_international_arms_contracts: "Contratos Internacionais de Armas"
 SER_international_arms_contracts_desc: "Queremos armas que matem. Podemos nos abastecer delas com fontes externas, comprando e acumulando."
 SER_final_chapters_of_milosevic: "Os Capítulos Finais de Milošević"
 SER_final_chapters_of_milosevic_desc: "Going into the 21st century, we must realize as a nation that our government is outdated, true democracy is the way of the future. Milošević's dictatorship must end, we must forget all of the nonsense of our previous leaders and start a new chapter in our history, Gotov je!"
 SER_Serbian_Arms_Industry: "A Indústria de Armas Sérvia"
 SER_Serbian_Arms_Industry_desc: "Nossas armas não são as melhores - ainda. Vamos criar uma indústria para produzir armas e equipar nossos soldados."
 SER_Factory_modernisation: "Modernização das Fábricas"
 SER_Factory_modernisation_desc: "Nossas fábricas estão desatualizadas e têm dificuldades para fazer o trabalho, precisamos atualizá-las com maquinaria moderna para competir na exigente economia internacional de hoje."
 SER_Defence_Contracts: "Contratos de Defesa"
 SER_Defence_Contracts_desc: "Assinaremos contratos e garantiremos algumas armas. Temos algumas empresas em mente e vamos contatá-las para negociações."
 SER_market_oriented_reforms: "Reformas Orientadas para o Mercado"
 SER_market_oriented_reforms_desc: "During the rule of Milošević, we were estranged from the international community thus resulting in an autarkical economy. Now that we aren't confined to the rules of socialism or held back by the radical agenda of Slobodan Milošević, we may reform our market to fit the modern age."
 SER_Vojvodina_Agriculture: "Desenvolvimento Agrícola de Vojvodina"
 SER_Vojvodina_Agriculture_desc: "Vojvodina detém mais da metade de nossas terras agrícolas, visto que a agricultura é o setor mais importante da economia sérvia, é importante que valorizemos o desenvolvimento agrícola dessa região."
 SER_crop_field_production: "Produção de Campos Agrícolas"
 SER_crop_field_production_desc: "Our fields yield far less than they could. Investing in irrigation, machinery and better seed will raise crop output across the country."
 SER_bluechip_corporations: "Corporações Bluechip"
 SER_bluechip_corporations_desc: "A Blue Chip Electronics, Inc., posteriormente Blue Chip International, foi uma empresa de computadores americana fundada por John Rossi em 1982. Fundada para desenvolver periféricos para computadores domésticos Commodore, a empresa em 1986 começou a vender compatíveis IBM PC de baixo custo."
 SER_fiat_chrysier: "Fiat Chrysler"
 SER_fiat_chrysier_desc: "A Fiat Chrysler Automobiles é uma multinacional ítalo-americana conhecida principalmente como fabricante de automóveis, veículos comerciais, peças automotivas e sistemas de produção."
 SER_volkswagen: "Volkswagen"
 SER_volkswagen_desc: "A Volkswagen é uma fabricante de automóveis alemã sediada em Wolfsburg, Baixa Saxônia, Alemanha."
 SER_smederevo_steel_mill: "Usina Siderúrgica de Smederevo"
 SER_smederevo_steel_mill_desc: "O HBIS GROUP Serbia Iron & Steel, comumente conhecido como Hesteel Serbia, é um conglomerado siderúrgico sérvio com sede em Belgrado."
 SER_novi_sad_railroad: "Ferrovia de Novi Sad"
 SER_novi_sad_railroad_desc: "A estação ferroviária de Novi Sad é a principal estação ferroviária em Novi Sad, Sérvia. A estação atual, localizada na Avenida Jase Tomica, foi inaugurada em 1964, após o fechamento da antiga estação ferroviária de 1883, anteriormente localizada onde hoje está o mercado fresco Liman. A estação serve dois trens de alta velocidade diários para Belgrado e faz parte do projeto ferroviário Budapeste-Belgrado."
 SER_Nikola_Tesla_international: "Nikola Tesla Internacional"
 SER_Nikola_Tesla_international_desc: "O Aeroporto Belgrado Nikola Tesla é um aeroporto internacional que serve Belgrado, Sérvia. É o maior e mais movimentado aeroporto da Sérvia, situado a oeste do centro de Belgrado, perto do subúrbio de Surčin, cercado por terras férteis. É operado pelo conglomerado francês Vinci Airports e leva o nome do inventor sérvio-americano Nikola Tesla."
 SER_war_mafia: "Guerra Com a Máfia"
 SER_war_mafia_desc: "Chegou a hora de combatermos completamente a máfia em nosso país."
 SER_step_up_inevstigations: "Intensificar Investigações"
 SER_step_up_inevstigations_desc: "To fully root out the criminal elements from our society, we must start new investigations and measure every our move."
 SER_legal_framework: "Estrutura Legal"
 SER_legal_framework_desc: "Criaremos o arcabouço legal necessário para mais reformas"
 SER_active_combatting: "Combate Ativo"
 SER_active_combatting_desc: "Chegou a hora de invadir os esconderijos dos bandidos e combater ativamente os elementos criminosos."
 SER_national_assembly: "Assembleia Nacional"
 SER_national_assembly_desc: "A Assembleia Nacional da Sérvia é o corpo legislativo unicameral responsável por representar os cidadãos e promulgar leis na República da Sérvia."
 SER_independent_judiciary: "Judiciário Independente"
 SER_independent_judiciary_desc: "A separação dos poderes garantirá nosso desenvolvimento democrático contínuo."
 SER_support_serbian_bosniaks: "Support Bosnian Serbs"
 SER_support_serbian_bosniaks_desc: "Devemos apoiar nossos compatriotas na confederação bósnia. É nosso dever mais alto."
 SER_Redevelop_Ties_with_Bosnia: "Reestabelecer Laços com a Bósnia"
 SER_Redevelop_Ties_with_Bosnia_desc: "Para apoiar nossos irmãos em Srpska, devemos reestabelecer nossas relações com a Bósnia e considerar investir em sua economia."
 SER_national_framework: "Arcabouço Nacional"
 SER_national_framework_desc: "Devemos trabalhar mais pela prosperidade de nossa nação, sem ignorar nossos valores nacionais."
 SER_Propose_Open_Balkan_Initiative: "Propor a Iniciativa Balcânica Aberta"
 SER_Propose_Open_Balkan_Initiative_desc: "Para aumentar a cooperação mútua entre os estados da região dos Balcãs e garantir uma paz sustentável, devemos aumentar o comércio mútuo entre nossos países."
 SER_european_investment: "Investimentos Europeus"
 SER_european_investment_desc: "Para aumentar nossos laços com os estados europeus, podemos pedir a eles que invistam em nós."
 SER_orthodox_values: "Apoiar Valores Ortodoxos"
 SER_orthodox_values_desc: "Orthodox values are a pillar of society for us, and we will support them."
 SER_church_and_state: "Igreja e Estado"
 SER_church_and_state_desc: "We must redevelop our relations with the Orthodox Church accordingly to the will of our people."
 SER_kosovo_question: "A Questão Kosovo"
 SER_kosovo_question_desc: "Em 2000, a questão de Kosovo continua sendo uma preocupação internacional urgente. Após anos de tensões étnicas entre a maioria albanesa e as autoridades sérvias, Kosovo declarou independência, levando a uma intervenção militar da OTAN em 1999 para deter a crise humanitária. No entanto, o status da região permanece não resolvido, com negociações em andamento entre Kosovo e Sérvia sob mediação internacional. O futuro da soberania de Kosovo e seu relacionamento com a Sérvia continua sendo uma fonte de incerteza, com esforços diplomáticos focados em alcançar uma resolução duradoura e pacífica do conflito."
 SER_coperate_kosovo_separatists: "Cooperar com Separatistas de Kosovo"
 SER_coperate_kosovo_separatists_desc: "Enclaves de nossa população sérvia ainda estão em Kosovo. Devemos cooperar com eles e garantir sua segurança."
 SER_brussels_agreement: "O Acordo de Bruxelas"
 SER_brussels_agreement_desc: "O Primeiro Acordo de Princípios que Regem a Normalização das Relações, informalmente conhecido como Acordo de Bruxelas, é um acordo para normalizar as relações entre os governos da Sérvia e Kosovo."
 SER_domestic_automotive_industry: "Indústria Automobilística Nacional"
 SER_domestic_automotive_industry_desc: "Nosso legado na forma de nossa própria indústria automobilística não deve ser esquecido, estamos implementando ativamente os sucessos dessa indústria em nossa economia"
 SER_free_elections: "Emendas na Lei Eleitoral"
 SER_free_elections_desc: "É hora de fazer algumas mudanças em nossa lei eleitoral para tornar nosso sistema verdadeiramente competitivo e democrático!"
 SER_free_elections_again: "Sérvia Pós-Milošević"
 SER_free_elections_again_desc: "Milošević deixou o cargo de presidente de nosso país, apesar de ter resistido à revolução que foi dirigida contra ele, mais cedo ou mais tarde, todo governante deixa seu assento"
 SER_nova_democratica_stranka: "Novo Partido Democrático da Sérvia"
 SER_nova_democratica_stranka_desc: "A coalizão liderada pelo Partido Democrático da Sérvia venceu as eleições! Somos nós quem os cidadãos confiaram para realizar uma transformação democrática, levando em conta as características culturais de nosso povo!"
 SER_national_conservatism: "Conservadorismo Nacional Sérvio"
 SER_national_conservatism_desc: "Em nossa política, estamos obrigados a ser guiados por ideias peculiares à nossa nação. Tais ideias são valores tradicionais e nacionalismo moderado. No entanto, não podemos elevar essas ideias a absolutos, precisamos de um conservadorismo nacional moderado."
 SER_diplomatic_pragmatism: "Pragmatismo Diplomático Forçado"
 SER_diplomatic_pragmatism_desc: "Estamos em uma posição em que estamos cercados por países que são diretos aliados do ocidente ou reivindicam esse status. Para manter a estabilidade na região e evitar a perda de nossa soberania, devemos jogar pelas regras do Ocidente, mas ao mesmo tempo, não devemos esquecer os outros vetores de nossa política."
 SER_market_corporatism: "Corporativismo de Mercado"
 SER_market_corporatism_desc: "The free market is our preferred option, but the mechanisms of operation of that market are flawed. It is necessary to create a system that requires government intervention in the market economy, supporting the most successful large enterprises and ensuring a dialog between these enterprises and their employees. It is also important to create conditions that will help medium and small businesses to actively develop and expand."
 SER_anti_communist_stance: "Posição Anticomunista"
 SER_anti_communist_stance_desc: "O comunismo foi a pior coisa que aconteceu ao povo sérvio. Mesmo que tenhamos conseguido derrubar esse jugo comunista, as ideias do regime passado e seus apoiadores ainda são populares. É necessário conduzir uma campanha em larga escala para limpar as mentes das pessoas dessa sujeira, e os principais agitadores devem ser investigados por cometerem crimes de guerra!"
 SER_anticorruption_action: "Campanha Anticorrupção"
 SER_anticorruption_action_desc: "O regime de Milosevic nos deixou uma enorme quantidade de corrupção. Está literalmente em todos os órgãos de poder em nosso país. É necessário lançar um programa para erradicar a corrupção e limpar os elementos corruptos!"
 SER_burrecarcy_destroy: "Cruzada Contra a Burocracia!"
 SER_burrecarcy_destroy_desc: "Bureaucracy is the Achilles' heel of our system. A bloated state apparatus hits our budget hard and also causes corruption. We will audit the activities of each body and remove unnecessary and inefficient departments, thereby balancing the budget."
 SER_punish_war_criminals: "Punir Criminosos de Guerra"
 SER_punish_war_criminals_desc: "Após as guerras iugoslavas, muitos criminosos de guerra ainda estão livres em nossa terra, precisamos mudar isso."
 SER_spirit_of_gaulism: "Espírito do Gaulismo"
 SER_spirit_of_gaulism_desc: "Embora apreciemos a história de nosso povo, a aprendizagem mútua de experiências estrangeiras bem-sucedidas não deve ser estranha para nós. As ideias de Charles De Gaulle podem ser consideradas como uma ideia próxima ao nosso povo. As ideias de um estado forte, sociedade tradicional, democracia conservadora e prosperidade social são ideais para nossa sociedade!"
 SER_democratica_stranka: "Partido Democrático"
 SER_democratica_stranka_desc: "O Partido Democrático junto com seus aliados de coalizão conseguiram vencer as eleições! O povo da Sérvia foi capaz de perceber a necessidade do curso europeu para nosso estado e apoiou nosso programa de liberalismo e integração europeia!"
 SER_western_approach: "Abordagem ao Ocidente"
 SER_western_approach_desc: "O aliado mais verdadeiro da Sérvia sempre foi o Ocidente. Foi graças ao Ocidente que conseguimos nos livrar do regime ditatorial de Milosevic e nos livrar de oponentes militares. Devemos continuar a estabelecer relações econômicas e diplomáticas com o Ocidente."
 SER_free_market_capitalism: "Capitalismo de Livre Mercado"
 SER_free_market_capitalism_desc: "A inviolabilidade da propriedade privada e uma economia de livre mercado são um dos valores mais altos de qualquer sociedade liberal. Temos a obrigação de criar todas as condições para o desenvolvimento de relações de mercado com mínima interferência do governo."
 SER_eu_investments: "Investments from EU"
 SER_eu_investments_desc: "A União Europeia está muito interessada na região dos Balcãs, principalmente em seu desenvolvimento. Estamos interessados em investimentos adicionais. Por que não nos ajudarmos mutuamente?"
 SER_radical_liberalism: "Liberalismo Radical"
 SER_radical_liberalism_desc: "Muitas pessoas chamam nosso programa liberal de radical, dizendo que a Sérvia não está pronta para tais mudanças e que estamos fazendo uma nova revolução. É verdade, mas como Marx disse \"A revolução é a locomotiva da história.\" Nossas reformas podem ser chamadas de revolução até certo ponto, então nos chamaremos de liberais radicais com orgulho!"
 SER_multiculturalism: "Educação Europeia"
 SER_multiculturalism_desc: "A transição para o padrão europeu de educação, como a prática mostra, aumenta a eficiência do sistema educacional, e a experiência de adoção do padrão europeu nos países dos Balcãs pode ser aplicada na Sérvia também."
 SER_antimilitarism: "Antimilitarismo"
 SER_antimilitarism_desc: "O militarismo é uma doença de nossa sociedade. O orçamento militar inchado e a militarização da vida pública nos foram apresentados como uma medida forçada de defesa contra países inimigos, mas estávamos tentando nos defender contra o progresso e a civilização. O antimilitarismo venceu na Sérvia, agora é hora de cortar o orçamento do exército."
 SER_miracle_of_european_system: "O Milagre do Sistema Europeu"
 SER_miracle_of_european_system_desc: "Estamos a caminho de construir um modelo europeu ideal na Sérvia, um modelo que uma vez trouxe prosperidade e progresso para os países ocidentais e agora trará progresso para nosso país, criando um verdadeiro milagre!"
 SER_progressivna_stranka: "Partido Progressista Sérvio"
 SER_progressivna_stranka_desc: "A coalizão das forças patrióticas sérvias liderada pelo Partido Progressista Sérvio venceu as eleições. O país tem sido assolado por instabilidade e incerteza por muito tempo, e é hora de trazer estabilidade e crescimento econômico de volta ao país. A Sérvia não pode parar!"
 SER_economic_stimulation: "Estimular a Economia Sérvia"
 SER_economic_stimulation_desc: "Não podemos apenas assistir à queda de nossa economia. Precisamos de uma política para estimular o crescimento econômico, apenas usando as ferramentas de regulação econômica e uma gestão econômica adequada conseguiremos sair da situação instável."
 SER_eastern_investments: "Contatar o Oriente"
 SER_eastern_investments_desc: "A Sérvia progressista precisa de uma política multi-vetorial progressista que envolva o engajamento com o mundo todo. A leste de nós está a Rússia, que é amigável conosco, e a China, que está interessada no desenvolvimento dos Balcãs. Então, por que não convidá-los a investir em nossa economia promissora?"
 SER_western_investments: "Convidar Investidores Ocidentais"
 SER_western_investments_desc: "Nossa política multi-vetorial também pressupõe uma estreita cooperação com países ocidentais. Podemos atrair muitos investidores ocidentais para o desenvolvimento de nossa economia."
 SER_populism: "Populismo Sérvio"
 SER_populism_desc: "Muitas vezes somos chamados de populistas, supostamente só podemos falar, mas na prática não podemos nem tomar uma decisão, mas entendemos o populismo à nossa maneira. Para nós, populismo é popularismo, estamos prontos para servir nosso povo até o fim, ouvir a opinião do povo e tomar apenas o lado do povo!"
 SER_anticor_mesuars: "Medidas Anticorrupção"
 SER_anticor_mesuars_desc: "Combater a corrupção é a promessa com a qual fomos às eleições. É hora de cumprir nossa promessa. Levantaremos todas as forças do departamento anticorrupção e limparemos o país dessa doença!"
 SER_centralisation_police: "Centralizar Forças Policiais"
 SER_centralisation_police_desc: "Com o advento da democracia em nosso país, os governos liberais que vieram antes de nós gradualmente desmontaram a força policial, considerando-a desnecessária por enquanto. É necessário devolver o financiamento à polícia para fortalecer a ordem social"
 SER_social_democracy: "União Social-Democrata"
 SER_social_democracy_desc: "A coalizão liderada pela União Social-Democrata venceu as eleições! Nosso povo escolheu o caminho do antimilitarismo e da democracia social, duas ideias que podem trazer prosperidade ao país"
 SER_social_security: "Segurança Social"
 SER_social_security_desc: "O mais importante para nós é fornecer aos nossos cidadãos um alto padrão de vida e dar-lhes a chance de uma vida boa. Precisamos aumentar os gastos sociais!"
 SER_social_market: "Mercado Social"
 SER_social_market_desc: "Embora o mercado livre seja o sistema econômico preferido, a forma como o mercado trata o homem comum é inaceitável. O estado deve criar um sistema que combine medidas de proteção social e o livre mercado."
 SER_social_dem: "Democracia Social Sérvia"
 SER_social_dem_desc: "Nossa ideologia central é a democracia social, é a razão pela qual a sociedade ocidental alcançou sua grandeza. Usaremos a experiência de nossos parceiros e faremos da democracia social um guia para nosso governo."
 SER_antiauthoritarism: "Anti-Authoritarianism"
 SER_antiauthoritarism_desc: "O principal medo de nossa sociedade é um retorno ao abismo do autoritarismo e da ditadura, faremos de tudo para erradicar de nossa sociedade aqueles que nos empurram para trás!"
 SER_support_unions: "Apoiar Sindicatos"
 SER_support_unions_desc: "Os sindicatos desempenham uma função bastante importante em nossa sociedade - a proteção do trabalhador comum que está sendo oprimido pelo empresário. Temos o dever de apoiar os sindicatos para garantir a igualdade econômica dos cidadãos."
 SER_western_dominance: "Domínio Ocidental"
 SER_western_dominance_desc: "O Ocidente é nosso principal aliado no palco mundial, e sua ajuda dificilmente pode ser subestimada. Portanto, a direção ocidental deve ser dominante em nossa política externa."
 SER_balkan_social_democracy: "Democracia Social nos Balcãs"
 SER_balkan_social_democracy_desc: "Não houve um bom exemplo de um verdadeiro estado social democrático nos Balcãs.... até agora. Nos tornamos um exemplo de como criar uma sociedade harmoniosa e igualitária!"
 SER_neutral_souverign: "Democracia Social nos Balcãs"
 SER_neutral_souverign_desc: "Estamos em um ambiente em que o ocidente e o oriente estão tentando puxar a corda e nos dobrar para o seu lado, mas não seremos marionetes de ninguém! Seguiremos nossa própria política multi-vetorial e garantiremos estabilidade dentro de nosso país!"
 SER_socialist_party: "Partido Socialista da Sérvia"
 SER_socialist_party_desc: "Formerly, a party centered around Milosevic, now tries to shape its new image and integrate into new democratic system. SPS was founded in 1990 as a merger of the League of Communists of Serbia and Socialist Alliance of Working People of Serbia with Slobodan Milošević as its first president."
 SER_popular_socialism: "Socialismo Popular"
 SER_popular_socialism_desc: "Nossa nova agenda socialista deve se centrar em nosso povo comum. É nosso dever cumprir suas expectativas!"
 SER_implement_economic_regulations: "Regulações Econômicas"
 SER_implement_economic_regulations_desc: "Não podemos permitir que o monstro assustador do mercado suprima nosso povo! Devemos regular o mercado para garantir que os interesses de nossa população sejam protegidos."
 SER_green_initiatives: "Iniciativas Verdes"
 SER_green_initiatives_desc: "Devemos propor soluções econômicas mais saudáveis para nossa economia. Não podemos sacrificar nossa natureza!"
 SER_hard_pragmatism: "Pragmatismo Duro"
 SER_hard_pragmatism_desc: "Alemanha e Áustria mostraram sua vontade de investir em nosso país. Embora nossas relações passadas tenham sido tensas, podemos tentar estabelecer boas relações comerciais."
 SER_promote_traditions: "Promover Tradições"
 SER_promote_traditions_desc: "A Ortodoxia Sérvia nos moldou como povo e nação. Devemos apoiar nossas tradições para preservar nossa identidade. Alguns dizem que Deus é sérvio afinal..."
 SER_medicine_for_everyone: "Medicina para Todos"
 SER_medicine_for_everyone_desc: "Devemos garantir que a assistência médica seja fornecida a todas as pessoas em nosso país."
 SER_socialist_renewal: "Renovação Socialista"
 SER_socialist_renewal_desc: "Finalmente, nossas políticas atingiram seu auge e todos os nossos planos estão concluídos!"
 SER_support_border_closure: "Apoiar o Fechamento das Fronteiras"
 SER_support_border_closure_desc: "Devemos preparar nossas fronteiras com Kosovo para o ataque deles. Devemos estar preparados."
 SER_de_escalation: "Desescalada"
 SER_de_escalation_desc: "Devemos desescalar a situação de Kosovo para garantir paz e prosperidade."
 SER_kosovo_is_serbia: "Kosovo é Sérvia!"
 SER_kosovo_is_serbia_desc: "We cannot sacrifice our well-being to attack Kosovo. However, we can't recognize them either!"
 SER_recognize_kosovo: "Reconhecer Kosovo"
 SER_recognize_kosovo_desc: "Although the Albanian conquest of Kosovo was unfair, we must bury the hatchet once and for all."
 SER_further_belt_and_road_cooperation: "Cooperação do Cinturão e Rota"
 SER_further_belt_and_road_cooperation_desc: "A China está muito interessada em investir em nosso país. Devemos usar isso para nosso benefício."
 SER_jp_electric_power_industry_of_serbia: "JP Elektroprivreda Srbije"
 SER_jp_electric_power_industry_of_serbia_desc: "A Elektroprivreda Srbije é uma empresa elétrica de capital aberto totalmente de propriedade do governo da Sérvia, com sede em Belgrado, Sérvia."
 SER_renewed_serbia: "Sérvia Renovada!"
 SER_renewed_serbia_desc: "A Sérvia finalmente se renovou e não é mais a antiga sombra de si mesma!"
 SER_end_isolationism: "Fim do Isolacionismo"
 SER_end_isolationism_desc: "Devemos parar nosso isolamento e começar a interagir com nossos vizinhos."
 SER_crush_the_old_system: "Destruição do Antigo Sistema"
 SER_crush_the_old_system_desc: "O antigo sistema de governo deve ser destruído e um novo sistema deve ser estabelecido."
 SER_revive_cefta: "Acordo CEFTA"
 SER_revive_cefta_desc: "The Central European Free Trade Agreement is a free trade organization that is the successor to the Visegrad Agreement between countries that are not members of the European Union."
 SER_new_constitution: "Nova Constituição"
 SER_new_constitution_desc: "Devemos mudar nossa constituição para garantir totalmente que nosso país siga o caminho da reforma."
 SER_democratic_system: "Garantia dos Direitos Humanos"
 SER_democratic_system_desc: "Nosso país deve começar a respeitar os direitos humanos para se encaixar adequadamente na nova ordem mundial e cooperar com outros países europeus."
 SER_loosened_union: "União Afrouxada"
 SER_loosened_union_desc: "A união com Montenegro pode entrar em colapso a qualquer momento. É hora de reformar nossa união dando a Montenegro maior autonomia e satisfazendo seus desejos."
 SER_economic_autonomy: "Autonomia Econômica"
 SER_economic_autonomy_desc: "Devemos dar alguma forma de autonomia econômica a nossos irmãos e dar-lhes estímulo para um rápido crescimento econômico."
 SER_shared_currency: "Moeda Compartilhada"
 SER_shared_currency_desc: "To make Montenegro truly autonomous we must create new currency for them. This would create more equal conditions for development"
 SER_a_new_start: "Novo Começo"
 SER_a_new_start_desc: "The new era for our union has begun! Our reforms have brought stability to Montenegro region and we are ready to give them equal rights with Serbia."
 SER_involve_un: "Conversas com a ONU"
 SER_involve_un_desc: "This union with Montenegro is at the edge of collapse. To make it smooth and quick we will ask UN and International community to involve and help us in creating Sovereign Montenegro."
 SER_begin_the_recognition_process: "Iniciar o Processo de Reconhecimento"
 SER_begin_the_recognition_process_desc: "We must start international campaign for recognition of the union's dissolution and the creation of Serbian and Montenegrin States"
 SER_remove_previous_kleptocrats: "Remover Cleptocratas Anteriores"
 SER_remove_previous_kleptocrats_desc: "Vamos remover aqueles cleptocratas do regime anterior que estão causando mais dor à Sérvia."
 SER_free_at_last: "Finalmente Livres"
 SER_free_at_last_desc: "We have managed to dissolve this unholy union smooth and quick. It's new chapter of serbian history, long live new Serbian Republic!"
 SER_eu_integration: "Busca de Cooperação com a UE"
 SER_eu_integration_desc: "Estamos geograficamente cercados principalmente por estados membros da União Europeia. Devemos cooperar e talvez até buscar a integração na UE para impulsionar nossa economia e comércio."
 SER_national_conservatism_idea: "Conservadorismo Nacional"
 SER_liberal_corporatism_idea: "Corporativismo Liberal"
 SER_anticomm_idea: "Ação Anticomunista"
 SER_degaull_idea: "Espírito de de Gaulle"
 SER_radical_liberalism_idea: "Liberalismo Radical"
 SER_free_market_idea: "Livre Mercado"
 SER_model_democracy_idea: "Democracia Europeia"
 SER_populismus_idea: "Populismo Sérvio"
 SER_anticorruption_measures_idea: "Medidas Anticorrupção"
 SER_econom_stim: "Estímulo Econômico"
 SER_souverign_nat: "Neutral and Sovereign"
 SER_social_dem_idea: "Democracia Social"
 SER_antiauth_idea: "Repressão ao Autoritarismo"
 SER_unions_supp_idea: "Apoio aos Sindicatos"
 SER_social_mark_idea: "Mercado Social"
 SER_balkan_soc_dem_idea: "Democracia Social dos Balcãs"
 SER_people_socialism_idea: "Socialismo Popular"
 SER_implement_econ_reg_idea: "Implementar Regulações Econômicas"
 SER_traditions_enrolled_idea: "Tradições Inscritas"
 SER_socialist_renew_idea: "Renovação Socialista"
 SER_cefta_idea: "CEFTA"
 SER_cefta_idea_desc: "A Associação de Livre Comércio da Europa Central é uma organização de livre comércio que é a sucessora do Acordo de Visegrád entre países que não são membros da União Europeia."
 SER_idea_rights: "Garantia dos Direitos Humanos"
 SER_shared_currency_idea: "Moeda Compartilhada"
 SER_listened_un_idea: "Apoio da Comunidade Internacional"
 SER_ditched_subject_idea: "Livre de Montenegro"
 SER_ditched_subject_idea_desc: "Há coisas boas na dissolução da União. Uma delas é que não precisamos gastar dinheiro com Montenegro."
 SER_mixed_economy: "Economia Mista"
 SER_mixed_economy_desc: "A Sérvia não sobreviveria no século XXI se continuássemos nossa abordagem autárquica da economia, abrimos para o mundo e agora o mundo abriu para nós."
 SER_bluechip_corp: "Corporação Bluechip"
 SER_bluechip_corp_desc: "Blue Chip Electronics, Inc., posteriormente Blue Chip International, foi uma empresa de informática americana fundada por John Rossi em 1982. Fundada para desenvolver periféricos para computadores domésticos Commodore, a empresa em 1986 começou a vender compatíveis IBM PC de baixo custo."
 SER_disorganized_industrial_sector_desc: "Nossa indústria ainda está confusa e em todos os lugares. Com a transição do governo, os contratos da nossa indústria expiraram devido à propriedade governamental em nossa economia socialista e uma repetição da situação na indústria da Bielorrússia após a independência ter ocorrido!"
 ser_dem.1.t: "Sérvia Quer Investimentos"
 ser_dem.1.d: "Representantes da Sérvia nos procuraram solicitando investimentos na economia sérvia. Será que devemos aproveitar esta grande oportunidade ou optaremos por ignorar o pedido?"
 ser_dem.1.a: "Complexos industriais deveriam ser suficientes."
 ser_dem.1.b: "Novas estradas seriam ótimas."
 ser_dem.1.c: "Infraestrutura de rede é o que a Sérvia realmente quer."
 ser_dem.1.f: "Outra hora, talvez."
 ser_dem.2.t: "Eles concordaram!"
 ser_dem.2.d: "Um poder estrangeiro concordou em investir em nós!"
 ser_dem.2.a: "Urra!"
 ser_dem.3.t: "They disagreed!"
 ser_dem.3.d: "Foreign power has refused to invest in us!"
 ser_dem.3.a: "Que pena!"
 ser_dem.4.t: "Política Externa"
 ser_dem.4.d: "We should carefully choose with whom we should cooperate. We could contact with western powers or we can try to get close to eastern sphere. Or we could cooperate with countries in our region."
 ser_dem.4.a: "East is our Choice"
 ser_dem.4.b: "...mas ainda somos uma democracia ocidental."
 ser_dem.4.c: "Balcãs devem ser pacíficos!"
 ser_dem.5.t: "Disputa no Partido Radical Sérvio!"
 ser_dem.5.d: "Houve um conflito dentro do Partido Radical Sérvio. Tomislav Nikolic, o líder de facto do partido, entrou em conflito com o conselho central do partido representado por Vojislav Šešelj, agora Nikolic e Aleksandar Vucic juntos com seus associados estão ameaçando deixar o partido para criar sua própria nova organização."
 ser_dem.5.a: "Nikolic e Vucic criarão um novo partido!"
 ser_dem.5.b: "A disputa será resolvida"
 SerbiaFocus.1.t: "Iniciativa Bálcãs Abertos"
 SerbiaFocus.1.d: "[SER.GetName] propôs que assinemos uma nova iniciativa chamada \"Iniciativa Bálcãs Abertos\". Ela visa aumentar o crescimento econômico e o comércio entre nossas nações, e também melhorar a estabilidade regional."
 SerbiaFocus.1.a: "Onde eu assino?"
 SerbiaFocus.1.b: "De jeito nenhum!"
 SerbiaFocus.2.t: "[FROM.GetName] assinou a iniciativa!"
 SerbiaFocus.2.d: "Parece que [FROM.GetName] decidiu assinar a Iniciativa Bálcãs Abertos e cooperará para impulsionar o crescimento econômico na região!"
 SerbiaFocus.2.a: "Ótima notícia"
 SerbiaFocus.3.t: "[FROM.GetName] se recusa a assinar a iniciativa!"
 SerbiaFocus.3.d: "[FROM.GetName] wants nothing to do with us or our initiative. So we may have to forget about any possible expansion of the agreement."
 SerbiaFocus.3.a: "Triste"
 SerbiaFocus.4.t: "[FROM.GetName] Exige que Realizemos um Referendo"
 SerbiaFocus.4.d: "[FROM.GetName] demands that we hold a referendum on the territory of the Republika Srpska and give it more autonomy. They are clearly plotting something, will we give autonomy to our region or ignore pressure from Belgrade?"
 SerbiaFocus.4.a: "Vamos fazer concessões"
 SerbiaFocus.4.b: "Ignore-os"
 SerbiaFocus.5.t: "Destino da Republika Srpska"
 SerbiaFocus.5.d: "[FROM.GetName] agreed to grant autonomy to the Republika Srpska under our pressure, as we wanted it to be."
 SerbiaFocus.5.a: "Ótimo."
 SerbiaFocus.6.t: "Destino da Republika Srpska"
 SerbiaFocus.6.d: "[FROM.GetName] refused to grant autonomy to Republika Srpska, even under our pressure."
 SerbiaFocus.6.a: "Eles pagarão mais"
 Serbia.20.t: "A Sérvia nos pede para sermos mediadores!"
 Serbia.20.d: "O novo governo sérvio nos pede para sermos mediadores entre Kosovo e Sérvia."
 Serbia.20.a: "Claro!"
 Serbia.20.b: "Heh, adeus."
 Serbia.21.t: "Eles não concordaram."
 Serbia.21.d: "Eles não querem iniciar as negociações."
 Serbia.21.a: "Aff."
 Serbia.22.t: "Reunião em Bruxelas"
 Serbia.22.d: "Durante a recente reunião em Bruxelas, a Sérvia propôs um acordo de normalização de relações entre nós e eles."
 Serbia.22.a: "Concordamos"
 Serbia.22.b: "Não"
 Serbia.23.t: "Kosovo agrees!"
 Serbia.23.d: "Eles assinaram o acordo."
 Serbia.23.a: "Muito Bom!"
 Serbia.24.t: "Kosovo não concordou."
 Serbia.24.d: "Eles não querem assinar o acordo."
 Serbia.24.a: "Muito Triste."
 serbia_news.2.t: "A Sérvia Reconhece o Kosovo!"
 serbia_news.2.d: "Em um desenvolvimento diplomático significativo, a Sérvia reconheceu oficialmente o Kosovo como uma nação independente, marcando uma mudança histórica em sua disputa de longa data. A decisão vem após intensas negociações e reflete uma disposição de avançar em direção a relações normalizadas entre os dois vizinhos dos Balcãs. Essa jogada histórica está pronta para abrir novas oportunidades de cooperação e estabilidade na região, potencialmente pavimentando o caminho para uma maior integração econômica e política. Embora desafios indubitavelmente permaneçam, esse gesto sinaliza um passo promissor em direção à reconciliação e coexistência pacífica nos Balcãs."
 serbia_news.2.o1: "Interessante."
 SerbiaFocus.21.t: "A Sérvia Oferece Investimentos!"
 SerbiaFocus.21.d: "Recentemente, a Sérvia propôs investir em nosso país. Isso aumentará a opinião dos sérvios da Bósnia e nos trará benefícios econômicos, no entanto, pode diminuir a opinião dos bósnios e aumentar a influência sérvia sobre nós. Devemos concordar?"
 SerbiaFocus.21.a: "Concordamos!"
 SerbiaFocus.21.b: "Não."
 SerbiaFocus.22.t: "A Bósnia Concorda!"
 SerbiaFocus.22.d: "Gastamos 3,5 bilhões de dólares para cobrir parcialmente a construção da fábrica. Ganhamos 5% de influência sobre eles."
 SerbiaFocus.22.a: "Ótimo"
 SerbiaFocus.23.t: "A Bósnia não concordou."
 SerbiaFocus.23.d: "Eles não querem nossos investimentos."
 SerbiaFocus.23.a: "Muito Triste."
 SerbiaFocus.14.t: "A Sérvia Pede Investimentos!"
 SerbiaFocus.14.d: "A Sérvia pede que nosso país invista neles. Devemos concordar?"
 SerbiaFocus.14.a: "Claro!"
 SerbiaFocus.14.b: "Desculpe, não."
 SerbiaFocus.15.t: "[FROM.GetNameWithFlag] Accepts!"
 SerbiaFocus.15.d: "Eles investirão em nosso país."
 SerbiaFocus.15.a: "Ótimo"
 SerbiaFocus.16.t: "[FROM.GetNameWithFlag] did not accept our offer."
 SerbiaFocus.16.d: "Eles não querem investir em nosso país."
 SerbiaFocus.16.a: "Aff."
 SerbiaFocus.13.t: "Criminosos de Guerra Sérvios Presos na Sérvia!"
 SerbiaFocus.13.d: "New government of Serbia, after many considerations, decided to arrest and bring to court many of its former politicians and military commanders. Many of them will be brought to court in The Hague."
 SerbiaFocus.13.a: "Interessante."
 Serbia.3.tt.a: "§YNão haverá nada no caminho para impedir uma tentativa na vida de Zoran Đinđić§!"
 Serbia.14.t: "Movimento de Independência [MNT.GetFlag] [MNT.GetAdjective] Ganha Tração"
 Serbia.14.d: "The [MNT.GetFlag] [MNT.GetAdjective]s have been pushing for independence for some time now, and it seems more and more likely that they are willing to fight for this cause if we decide to push back on this."
 Serbia.14.a: "Vamos ver o que acontece"
 Serbia.15.t: "A Confederação [MNT.GetFlag] [MNT.GetName]"
 Serbia.15.d: "In a grand referendum, [MNT.GetFlag] [MNT.GetName] has decided that it will break free from [SER.GetFlag] [SER.GetName] (us) and pursue its own interests in the world. It appears many nations have already begun recognizing their independence, and have started diplomatic talks on security and other matters."
 Serbia.15.a: "Foi escolha deles."
 Serbia.16.t: "Movimento [MNT.GetFlag] [MNT.GetAdjective] Torna-se Violento!"
 Serbia.16.d: "Parece que o movimento [MNT.GetFlag] [MNT.GetAdjective] tornou-se violento, e uma rebelião ativa contra nossas tentativas de controlá-los começou. Precisaremos ou recuar completamente deste arriscado jogo político ou redobrar nossos esforços para reprimir seu movimento de resistência."
 Serbia.16.a: "Não vamos recuar!"
 Serbia.16.b: "Sabe de uma coisa? Tenha sua independência."
 Serbia.17.t: "Movimento [MNT.GetFlag] [MNT.GetAdjective] Diminui"
 Serbia.17.d: "The [MNT.GetFlag] [MNT.GetAdjective] resistance movement has thankfully been quelled by our skilled security forces and politicians. We no longer have to worry about fighting them on the streets, but now we must worry about fixing the damage done to the region."
 Serbia.17.a: "Como deve ser."
 SerbiaFocus.11.t: "Mudança Democrática na Sérvia!"
 SerbiaFocus.11.d: "A Sérvia celebra o amanhecer da democracia após a Revolução Bulldozer. Os persistentes protestos dos cidadãos derrubaram o antigo regime, sinalizando uma nova era de transparência e responsabilidade. O mundo observa enquanto a Sérvia abraça a mudança, anunciando esperança para um futuro mais brilhante."
 SerbiaFocus.11.a: "Finalmente"
 serbia_news.1.t: "[SER.GetName] junta-se à ONU"
 serbia_news.1.d: "Originalmente, o governo [SER.GetAdjective] recusou-se a aderir às Nações Unidas após a queda da Jugoslávia, apontando para a dedicação contínua do país à restauração das terras nacionais [SER.GetAdjective].\n\nAgora, após um referendo público sobre o assunto, o governo [SER.GetAdjective] anunciou que o país deixará de ser um mero espectador e passará a integrar a organização como membro pleno."
 serbia_news.1.o1: "It's about time, [SER.GetName]!"
 SerbiaFocus.12.t: "Sérvia busca garantias de paz"
 SerbiaFocus.12.d: "Após a revolução democrática na Sérvia, seu novo governo buscou estabelecer uma cooperação regional pacífica. Propõe garantias mútuas de paz, acordos comerciais e normalização diplomática. Isso pode inaugurar uma nova era de estabilidade nos Bálcãs. Como devemos responder a essas propostas?"
 SerbiaFocus.12.a: "Claro!"
 SerbiaFocus.12.b: "Não."
 Serbia.19.t: "Milosevic Preso!"
 Serbia.19.d: "After the recent revolution in Serbia, Slobodan Milosevic has been imprisoned for his crimes and will soon be judged in The Hague."
 Serbia.19.a: "Vamos suprimir os nacionalistas acalorados..."
 Serbia.19.b: "É necessária uma reação nacional a esse crime!"
 Serbia.1.d: "Željko Ražnatović, também conhecido como Arkan, ex-comandante da paramilitar Tigres de Arkan, oficial dos Crvene Beretke e empresário, sofreu uma tentativa de assassinato enquanto bebia com amigos no Hotel Continental de Belgrado. Seu atirador, Dobrosav Gavrić, um membro júnior da brigada móvel da polícia de 23 anos, atingiu Arkan no olho esquerdo, bem como alguns de seus amigos e espectadores. Gavrić foi abatido durante sua fuga e preso, os médicos estão trabalhando duro para mantê-lo vivo, ele é um homem morto?"
 Serbia.1.a: "Enviamos nossas condolências"
 Serbia.1.b: "Não podemos deixá-lo morrer"
 Serbia.1.tt: "§YArkan morrerá!§!"
 Serbia.2.d: "Željko Ražnatović was buried at Novo Groblje on 20 January 2000, five days after the shooting at the Hotel Continental. Thousands attended, among them Red Star Belgrade ultras alongside figures from the paramilitary and criminal underworld he moved through. No one has ever been convicted for ordering the killing, and it is widely read as a settling of accounts rather than a random act of violence. How do we mark his passing?"
 Serbia.2.a: "Realize funerais para os nossos perdidos"
 Serbia.2.b: "Outrageous! condemn this on the international stage!"
 Serbia.3.d: "It has come to our attention that the Serbian criminal underworld is not pleased with Zoran Đinđić, the Zemun Clan are using former JSO units to carry out a planned assassination on March 12 to take our opposition out of power. We can warn him and stop this from happening, however we are not necessarily obliged to do so."
 Serbia.3.a: "Avisar imediatamente sobre o ataque!"
 Serbia.3.b: "Vamos ver o que acontece, né?"
 Serbia.5.d: "A magnitude 5.5 earthquake has struck Kraljevo. We must decide whether to prioritize earthquake-resistant infrastructure for our people or protect industrial buildings."
 Serbia.5.a: "Não podemos salvar nossas fábricas, instale infraestrutura à prova de terremotos para nosso povo e se prepare para as réplicas"
 Serbia.5.b: "Priorize os edifícios industriais, nossa economia não pode suportar esse tipo de golpe"
 Serbia.5.tt: "§YNós estaríamos despreparados caso um terremoto nos atingisse no futuro.§!"
 Serbia.6.d: "Cyclone Tamara has caused severe flooding in our country, claiming lives and damaging infrastructure."
 Serbia.6.a: "Que muito infeliz"
 Serbia.7.d: "Flash floods have damaged agriculture. We must decide whether to prioritize assistance to farmers or our population centers."
 Serbia.7.a: "Os agricultores poderiam usar mais ajuda do que qualquer um agora"
 Serbia.7.b: "Não podemos ignorar nossas populações mais concentradas"
 Serbia.8.t: "Derramamentos de cianeto no Danúbio"
 Serbia.8.d: "WIP"
 Serbia.8.a: "Responsabilize as empresas estrangeiras de extração de recursos"
 Serbia.8.b: "Coopere com a Romênia para limpeza"
 Serbia.9.d: ""
 Serbia.9.a: "Inicie uma investigação nacional, 'Operação Sabre' estará em pleno vigor."
 Serbia.9.b: "Que muito infeliz, e mais um morde o pó..."
 Serbia.10.d: ""
 Serbia.10.a: "Essa maldita DSS é a culpada, o que aconteceu com as liberdades políticas na Sérvia?"
 Serbia.10.b: "É bom que essa atividade criminosa tenha sido interrompida"
 Serbia.11.d: ""
 Serbia.11.a: "Foi um grande erro salvar a vida dele, vamos vencer esta nódoa política de uma vez por todas!"
 Serbia.11.b: "Deixe-os nos acusar, não fizemos nada de errado, isso vai passar."
 Serbia.12.d: ""
 Serbia.12.a: "O governo ajudará a mediar esta situação"
 Serbia.12.b: "Deixe-os brigar, não é nosso problema mesmo"
 SerbiaFocus.99.t: "A Hora da Liberdade da Vojvodina"
 SerbiaFocus.99.d: "Nosso povo está pronto para finalmente começar uma guerra de libertação contra a Sérvia, mas estamos prontos para tomar tal decisão?"
 SerbiaFocus.99.a: "Pela Liberdade da Vojvodina!"
 SerbiaFocus.99.b: "De jeito nenhum!"
 SerbiaFocus.100.t: "A Hora da Liberdade da Vojvodina"
 SerbiaFocus.100.d: "O governo local da Vojvodina se levantou contra nós! A reação da sociedade e do povo é esperada por nós, vamos permitir que eles se separem silenciosamente do país? ou vamos suprimi-los à força."
 SerbiaFocus.100.a: "A Sérvia Permanecerá Unida"
 SerbiaFocus.100.b: "Vamos Dar-lhes Liberdade"
 SerbiaFocus.101.t: "Vojvodina Pede Federalização"
 SerbiaFocus.101.d: "O Governo da Voivodina nos apresentou um pedido sobre a necessidade de criar uma Federação completa entre a Sérvia e o país. Estamos prontos para empreender tal revisão global do sistema estatal do nosso país?"
 SerbiaFocus.101.a: "Sim"
 SerbiaFocus.101.b: "A Sérvia Permanecerá Unida"
 SerbiaFocus.102.t: "Pedido de Federalização"
 SerbiaFocus.102.d: "The Serbian government has agreed to federalize the country, finally we will be equal subjects!"
 SerbiaFocus.102.a: "Legal"
 SerbiaFocus.103.t: "Pedido de Federalização"
 SerbiaFocus.103.d: "O governo sérvio se recusou a federalizar o país, eles ainda aprenderão os resultados de rejeitar nossa proposta."
 SerbiaFocus.103.a: "Ok"
 SerbiaFocus.104.t: "Vojvodina Está Pedindo Permissão Para Seu Exército"
 SerbiaFocus.104.d: "O Governo da Voivodina nos pediu que permitíssemos que eles tivessem suas próprias forças armadas. Talvez isso nos ajude no futuro, mas também vemos isso como um perigo. Devemos permitir isso?"
 SerbiaFocus.104.a: "Sim"
 SerbiaFocus.104.b: "Eles Não Precisam de Seu Próprio Exército."
 SerbiaFocus.105.t: "Pedido de Exército"
 SerbiaFocus.105.d: "O Governo Sérvio nos permitiu começar a construir nossas próprias forças armadas."
 SerbiaFocus.105.a: "Legal"
 SerbiaFocus.106.t: "Pedido de Exército"
 SerbiaFocus.106.d: "The Serbian government refused to give us our own army, they will still learn the results of rejecting our proposal."
 SerbiaFocus.106.a: "Ok"
 SerbiaFocus.107.t: "Pedido De Aumento De Autonomia"
 SerbiaFocus.107.d: "O governo sérvio nos permitiu expandir os direitos de nossa autonomia, agora temos mais oportunidades."
 SerbiaFocus.107.a: "Legal"
 SerbiaFocus.108.t: "Pedido De Aumento De Autonomia"
 SerbiaFocus.108.d: "The Serbian government has refused to extend the rights of our autonomy, they will regret it!"
 SerbiaFocus.108.a: "Ok"
 SerbiaFocus.109.t: "Vojvodina Pede Uma Extensão De Autonomia"
 SerbiaFocus.109.d: "O Governo da Voivodina solicita uma extensão dos atuais poderes de sua autonomia, convencendo-nos de que isso também nos beneficiará. Concordamos com seus argumentos?"
 SerbiaFocus.109.a: "Sim"
 SerbiaFocus.109.b: "Eles Não Precisam de Mais Autonomia."
 SerbiaFocus.9.t: "Status Autônomo da Vojvodina"
 SerbiaFocus.9.d: "A turbulência política que abalou nosso país despertou as forças políticas na Voivodina. Representantes da região pedem que ampliemos os direitos de autonomia dos moradores da região. Vamos em frente?"
 SerbiaFocus.9.a: "Teremos que dar a eles alguma autonomia."
 SerbiaFocus.9.b: "Nunca"
 SerbiaFocus.17.t: "A Federação dos Balcãs"
 SerbiaFocus.17.d: "[FROM.GetName] em uma reunião com nosso Governo, nos entregou um convite oficial para ingressar na Federação dos Balcãs. A adesão a uma tal federação imporá muitas restrições a nós, mas, em geral, como o Governo Sérvio nos convence, cada sujeito da Federação terá direitos iguais."
 SerbiaFocus.17.a: "Vamos concordar em ingressar na Federação"
 SerbiaFocus.17.b: "Não precisamos de uma Federação."
 SerbiaFocus.20.t: "A Federação dos Balcãs"
 SerbiaFocus.20.d: "[FROM.GetName] recusou nossa oferta de ingressar na Federação dos Balcãs."
 SerbiaFocus.20.a: "Triste"
 Serbia.27.t: "A Federação dos Balcãs"
 Serbia.27.d: "Oficialmente nos tornamos membros da Federação dos Balcãs"
 Serbia.27.a: "Ótimo."
 ser_reading.1.t: "Crise Política Sérvia"
 ser_reading.1.d: "After NATO bombings in 1999, which had a huge devastating effect on Serbian society Milošević's authority has been almost destroyed. Lots of opposition groups spread across Serbia, once a stable country faces a huge challenge of the upcoming millennium."
 ser_reading.1.a: "Apenas a união salvará os sérvios..."
 serbia_news.3.t: "Formação da CEFTA"
 serbia_news.3.d: "Recently, many central european states have signed the CEFTA Agreement. The Central European Free Trade Agreement is a free trade organization that is the successor to the Visegrad Agreement between countries that are not members of the European Union. This national spirit will be removed if we join European Union."
 serbia_news.3.o1: "Interessante."
 SER_radical_create_tt: "O Partido Progressista Sérvio será criado!"
 SER_jp_electric: "JP Eletrônica"
 SER_coalition_TT: "§CAligned§! to us §Cparties§! will join our §Ccoalition§!."
 SER_radical_div_TT: "O partido Progressista foi criado."
 ser_we_will_int_tt: "[FROM.GetNameWithFlag] builds 2 network infrastructures. It increases [FROM.GetNameWithFlag] influence on us by 5%!"
 bombed_us_in_the_nineties: "Nos Bombardeou nos Anos 90"
 oppress_the_muslim_population: "Oprimir a População Muçulmana"
 oppress_the_serbian_population: "Oprimir a População Sérvia"
 serbian_speaking: "Nação de Língua Sérvia"
 kla_attacks: "Ataques da KLA em Nosso Povo!"
 ethnic_cleansing: "Realizou Limpeza Étnica em Nossas Terras!"
 nationalized_automobile_industry: "Indústria Automobilística Nacionalizada"
 nationalized_automobile_industry_trade: "Indústria Automobilística Nacionalizada"
 cooperated_to_clean_up_cyanide_spill: "Cooperou para Limpar o Derramamento de Cianeto"
 caused_cyanide_spill: "Causou o Derramamento de Cianeto no Danúbio"
 blame_us_for_cyanide_spill: "Nos Culpa pelo Derramamento de Cianeto no Danúbio"
 vojvodina_focus: "Árvore de Focos da Vojvodina"
 VOJ_economic: "Economia da Vojvodina"
 VOJ_economic_desc: "Our republic has great potential for economic development, it's not for nothing that Serbia is trying so hard to keep us in its composition, because we provide them with a large part of their income!"
 VOJ_selhoz: "Indústria Agrícola"
 VOJ_selhoz_desc: "Nosso país possui uma indústria agrícola bem desenvolvida, mas não vamos parar por aí e continuaremos a investir em seu desenvolvimento."
 VOJ_construct: "Indústria da Construção"
 VOJ_construct_desc: "We will expand investments in the construction industry, every kilometer of Vojvodina will be built up!"
 VOJ_oil: "Indústria do Petróleo"
 VOJ_oil_desc: "A indústria do petróleo é bastante forte em nossa região e até atrativa para alguns investidores estrangeiros, o que tem um efeito positivo em nossa economia."
 VOJ_chim: "Indústria Química"
 VOJ_chim_desc: "A indústria química em nosso país ainda é pouco desenvolvida, mas está começando a ganhar impulso. Investindo mais dinheiro nisso, certamente obteremos muitos benefícios."
 VOJ_metal: "Metalurgia"
 VOJ_metal_desc: "A indústria metalúrgica é necessária para nós como o ar. Vamos investir mais fundos em seu desenvolvimento do que o governo sérvio investiu."
 VOJ_it: "Setor de TI"
 VOJ_it_desc: "The IT sector in our country is poorly developed, but we are ready to invest in it, because it is the future!"
 VOJ_regionalism: "Regionalismo"
 VOJ_regionalism_desc: "We actively advocate regionalism within the Serbian state! No infringement of the peoples!"
 VOJ_federalisation: "Federalização"
 VOJ_federalisation_desc: "A federalização da Sérvia é o que vemos como o futuro de nosso estado comum. Vamos tentar ativamente obter o máximo de privilégios possível."
 VOJ_vs: "Nossas Forças Armadas"
 VOJ_vs_desc: "We will propose to the Serbian government a bill to allow us to have our own armed forces."
 VOJ_autonomy: "Aumentando o Status de Autonomia"
 VOJ_autonomy_desc: "Vamos propor ao governo sérvio estender nossos privilégios como autonomia dentro do Estado."
 VOJ_true_fed: "Federação da Sérvia e Vojvodina"
 VOJ_true_fed_desc: "Vamos submeter um projeto de lei à consideração da criação da Federação da Sérvia e Vojvodina ao Governo Sérvio."
 VOJ_separ: "Coalizão pela Autonomia"
 VOJ_separ_desc: "Muitos partidos políticos da Vojvodina se uniram em uma coalizão para lutar pela autonomia e possivelmente independência da Vojvodina."
 VOJ_vojvodina_spirit: "O Espírito da Liberdade"
 VOJ_vojvodina_spirit_desc: "Nosso povo sempre aspirou à autonomia e independência, a Sérvia é um ocupante para nós e vamos lutar contra ela."
 VOJ_europe_friend: "Parceria com a UE"
 VOJ_europe_friend_desc: "Vemos a União Europeia como um parceiro potencial e nós como seu membro."
 VOJ_brothers_nation: "Voz das Minorias"
 VOJ_brothers_nation_desc: "Usamos as minorias de nossa república como desculpa para atrair investidores de países vizinhos como Hungria e Croácia."
 VOJ_kosovo: "Irmãos no Vício"
 VOJ_kosovo_desc: "O Kosovo, assim como nós, há muito tempo está na sombra da Sérvia, e nosso problema fraternal deve nos unir."
 VOJ_propaganda: "Propaganda do Patriotismo"
 VOJ_propaganda_desc: "Nosso povo já esqueceu o que significa amar e respeitar suas raízes, sua história, vamos guiá-los no caminho certo através da propaganda."
 VOJ_self_defence: "Auto-Defesa da Vojvodina"
 VOJ_self_defence_desc: "Vamos criar unidades de autodefesa para resistir à influência da Sérvia e estar prontos para nos defender se nossa independência for pisoteada."
 VOJ_buy_weapon: "Compra de Armas"
 VOJ_buy_weapon_desc: "Precisamos de armas para nos defender, felizmente alguns dos nossos vizinhos estão dispostos a vendê-las para nós."
 VOJ_anti_serb: "Propaganda Anti-Sérvia"
 VOJ_anti_serb_desc: "We will actively develop the rhetoric that Serbia uses us like a colony, and we are its slaves."
 VOJ_war_freedom: "Viagem a Belgrado"
 VOJ_war_freedom_desc: "Estamos prontos para ir à guerra de libertação contra nosso ocupante e inimigo."
 VOJ_madyar: "Nacionalismo Húngaro na Voivodina"
 VOJ_madyar_desc: "A minoria húngara assumiu um papel dominante na vida da Voivodina, agora um futuro verdadeiramente imprevisível nos espera."
 VOJ_new_nation: "New National Spirit"
 VOJ_new_nation_desc: "The national spirit, which Vojvodina has not had for so long, will now appear. Hungarians will lead this beautiful land into a glorious future."
 VOJ_we_hungary: "Promoção da Identidade Húngara"
 VOJ_we_hungary_desc: "A identidade da Voivodina é desnecessária e ultrapassada. Os húngaros são os verdadeiros herdeiros da Voivodina."
 VOJ_we_not_serb: "Rejeição da Identidade Sérvia"
 VOJ_we_not_serb_desc: "A identidade da Voivodina é desnecessária e ultrapassada. Os húngaros são os verdadeiros herdeiros da Voivodina."
 VOJ_propagandase: "Propaganda Pró-Húngara"
 VOJ_propagandase_desc: "Nossa mídia irá promover ativamente a Hungria como a verdadeira herdeira dessas terras e que todo habitante desta região é húngaro."
 VOJ_defences: "Linhas de Defesa"
 VOJ_defences_desc: "Devemos criar linhas de defesa para que nosso potencial inimigo não nos quebre tão facilmente."
 VOJ_mobilisation: "Mobilizar a População"
 VOJ_mobilisation_desc: "Estamos anunciando a mobilização da população, encorajando-os a se juntar às fileiras de nossas próprias forças armadas."
 VOJ_guard: "A Guarda Nacional"
 VOJ_guard_desc: "Criaremos nossa própria unidade da Guarda Nacional que nos protegerá."
 VOJ_path: "Na Encruzilhada"
 VOJ_path_desc: "É hora de tomar uma decisão fatídica para nossa região."
 VOJ_part_hungary: "Somos Parte da Hungria"
 VOJ_part_hungary_desc: "Anunciaremos nosso desejo de nos juntar à Hungria, esperamos que nossos irmãos não nos recusem."
 VOJ_nopart_hungary: "Nós Somos a Verdadeira Hungria"
 VOJ_nopart_hungary_desc: "O estado húngaro está podre, eles esqueceram as gloriosas tradições de nosso povo e abandonaram completamente sua história, nós nos tornaremos o bastião dos húngaros em todo o mundo."
 VOJ_volunteer: "Voluntários Húngaros"
 VOJ_volunteer_desc: "Voluntários húngaros de todo o mundo começaram a vir até nós, nos vendo como os verdadeiros herdeiros da Hungria, e não este governo corrupto em Budapeste."
 VOJ_claims: "Reivindicações Territoriais"
 VOJ_claims_desc: "As terras húngaras pertencem ao povo húngaro e temos todo o direito a elas."
 VOJ_war: "A Guerra Pela Hungria"
 VOJ_war_desc: "Hungary will be free!"
 VOJ_start_army: "Início da Reforma do Exército"
 VOJ_start_army_desc: "Nossas forças armadas literalmente não existem, é necessário começar a criá-las para que nosso país possa se defender no futuro."
 VOJ_reforms_army: "Exército Contratado"
 VOJ_reforms_army_desc: "Nosso pequeno país não precisa de um exército enorme, vamos nos concentrar em um pequeno exército profissional."
 VOJ_weapon_zakup: "Compra de Armas"
 VOJ_weapon_zakup_desc: "Vamos comprar armas de diferentes países para abastecer nosso exército."
 VOJ_new_officer: "Escola de Oficiais"
 VOJ_new_officer_desc: "Começaremos a formação dos primeiros oficiais de nosso exército."
 VOJ_inter_specialist: "Especialistas Estrangeiros"
 VOJ_inter_specialist_desc: "We will invite foreign specialists to help us prepare our army competently."
 VOJ_finish_reform: "Completar as Reformas"
 VOJ_finish_reform_desc: "Concluímos a criação de nossas próprias forças armadas."
 VOJ_serbs: "Somos Sérvios"
 VOJ_serbs_desc: "Nossa região sempre estará junto com a Sérvia, somos um povo unido e um país unido."
 VOJ_anti_separ: "Repressão Contra os Separatistas"
 VOJ_anti_separ_desc: "Separatism can easily set our region on fire and lead to civil war - it is unacceptable!"
 VOJ_propagandais: "Propaganda Pró-Sérvia"
 VOJ_propagandais_desc: "Os habitantes de nossa região devem saber que o separatismo é perigoso para nós, e a união com a Sérvia é a chave para a estabilidade."
 VOJ_serb_infra: "Investimento em Infraestrutura"
 VOJ_serb_infra_desc: "O governo sérvio investiu no desenvolvimento de infraestrutura em nossa região."
 VOJ_serb_people: "Povo Unido"
 VOJ_serb_people_desc: "Reconhecemos a unidade de nosso povo e um objetivo único - uma Sérvia poderosa e grande."
 VOJ_serb_invest: "Investimento Industrial Sérvio"
 VOJ_serb_invest_desc: "O governo sérvio alocou fundos para a construção de empresas em nosso território."
 VOJ_serb_police: "Admissão da Polícia Sérvia"
 VOJ_serb_police_desc: "Vamos permitir o acesso da Polícia Sérvia à nossa região para garantir a estabilidade."
 VOJ_serb_military: "Integração na Indústria Sérvia"
 VOJ_serb_military_desc: "Vamos permitir ativamente que a indústria sérvia entre em nosso território."
 VOJ_agro_selhoz1: "Vojvodina Agriculture"
 VOJ_agro_selhoz: "Agroindústria da Voivodina"
 VOJ_prom_idea: "Indústria da Voivodina"
 VOJ_patriotism: "Patriotismo da Voivodina"
 VOJ_vojvodina_nation: "New National Spirit"
 VOJ_vojvodina_nation1: "A Verdadeira Hungria"
 VOJ_no_army: "País Sem Exército"
 VOJ_no_army1: "Reformando o Exército"
 VOJ_no_nation: "País Sem Nação"
 VOJ_debuff_nation: "Desejo de Autonomia na Voivodina"
 VOJ_debuff_nation_desc: "Os eventos passados levaram à ativação de apoiadores da Autonomia na Voivodina, talvez devêssemos resolver esse problema?"
 ser_voj.1.t: "A Voivodina Quer Se Unir a Nós"
 ser_voj.1.d: "Voivodina anunciou um referendo com o desejo de se tornar parte do nosso grande país. Concordamos em aceitá-lo?"
 ser_voj.1.a: "Sim"
 ser_voj.1.b: "Não."
 ser_voj.2.t: "A Voivodina Nos Oferece Uma Garantia"
 ser_voj.2.d: "A Voivodina nos oferece garantias mútuas para nos protegermos mutuamente no caso de a Sérvia e outros países nos atacarem. Talvez isso possa temperar o ardor de nossos vizinhos não amigáveis."
 ser_voj.2.a: "Sim"
 ser_voj.2.b: "Não."
 ser_voj.3.t: "Kosovo Aceitou Garantias Mútuas"
 ser_voj.3.d: "O governo do Kosovo aceitou garantias mútuas de independência, agora temos uma chance de não sermos atacados."
 ser_voj.3.a: "Ótimo."
 SER_vojvodina_separatism_category: "Separatismo da Voivodina"
 SER_vojvodina_separatism_category_desc: "\n\n\n\n\n\n£SER_desctext_vojvodina \n\n\n\n\n\n\n\n\nOs eventos que se seguiram à queda de Milosevic intensificaram os sentimentos republicanos e separatistas na Voivodina. Agora, Voivodina e Sérvia precisam decidir se seguirão juntas ou se seus caminhos se separarão."
 VOJ_more_separ: "Aumentar os Sentimentos Separatistas"
 VOJ_more_autonomy: "Solicitar Mais Autonomia"
 VOJ_more_army: "Solicitar Permissão Para Exército Próprio"
 VOJ_more_federation: "Solicitar Permissão Para Federalização"
 VOJ_integrate: "Integrar a Voivodina"
 VOJ_separ_debuff: "Reduzir o Separatismo na Voivodina"
 VOJ_separ_debuff1: "Reduzir o Separatismo na Voivodina"
 VOJ_ser_police: "Polícia Sérvia"
 VOJ_ser_avto: "Indústria Sérvia"
 SER_voj_separ_TT: "O Separatismo na Voivodina aumentará em §Y[?modify_voj_separ]%§! (Separatismo Atual: §Y[?VOJ.voj_separ]%§!)\n"
 SER_voj_integr_TT: "O Desejo de Integração aumentará em §Y[?modify_voj_integr]%§! (Desejo Atual: §Y[?VOJ.voj_integr]%§!)\n"
 VOJ_support_for_union_more_60: "O Desejo de Integração está acima de 60%"
 montenegro_focus: "Árvore de Foco de Montenegro"
 SER_The_Montenegro_Confederacy: "A Confederação de Montenegro"
 SER_The_Montenegro_Confederacy_desc: "\n\n\n\n\n\n£SER_desctext_montenegro \n\n\n\n\n\n\n\n\n[MNT.GetFlag] [MNT.GetName] has been vying for independence since the 1990's, and they have been becoming more and more successful as the days go by. We can try to stop them, but if we do, then they may cause more harm than good. Attempting to maintain [MNT.GetFlag] [MNT.GetName] may result in long-term consequences which could possibly take years to resolve.\n\nWe can maintain [MNT.GetFlag] [MNT.GetName] by pushing back on their independence agenda. If we continue to push back against their thirst for independence, then their movement will turn into a violent one, and will require us to use the military to quell the revolt.\n\nIf we opt to do nothing, [MNT.GetFlag] [MNT.GetName] will peacefully separate from our nation without any major consequences.\n\n[MNT.GetFlag] [MNT.GetAdjective] Separatism: §Y[?SER_Montenegro_separatism]%§!\n-------------------------------------------------------\n[MNT.GetFlag] [MNT.GetAdjective] Resistance Fighters: §R[?SER_Montenegro_combatants]§!\n[SER.GetFlag] [SER.GetAdjective] Security Forces Deployed: §R[?SER_Serbian_combatants]§!"
 SER_Montenegro_independence_referendum: "Referendo de Independência de Montenegro"
 SER_retainment_of_connections_Montenegro: "ush De volta ao [MNT.GetFlag] [MNT.GetAdjective] Separatismo"
 SER_retainment_of_connections_Montenegro_desc: "Nós manteremos nossa posição e lutaremos contra o [MNT.GetFlag] [MNT.GetAdjective] Separatismo"
 SER_attack_mnt_militias: "Atacar os Milicianos do [MNT.GetFlag] [MNT.GetAdjective]"
 SER_attack_mnt_militias_desc: "Vamos lançar um ataque contra os milicianos do [MNT.GetFlag] [MNT.GetAdjective] na tentativa de sufocar sua resistência."
 SER_deploy_more_troops: "Aumentar a Presença de Segurança"
 SER_deploy_more_troops_desc: "Vamos aumentar nossa presença de segurança na região de [MNT.GetFlag] [MNT.GetName] para contra-atacar os milicianos."
 SER_Political_separatism: "[MNT.GetFlag] [MNT.GetAdjective] Separatismo"
 MNT_neoyug: "Neo-Iugoslavismo"
 MNT_neoyug_desc: "A chama da nostalgia iugoslava ainda não se apagou em Montenegro! O caminho comunista sempre foi o melhor e nós certamente sabemos disso."
 MNT_selfcoup: "Nada de Mais Democracia!"
 MNT_selfcoup_desc: "Bourgeoisie capitalist democracy is the source of all of the mess that we and our former yugo comrades are in nowadays. We must stop this petty practice and return to progressive dictatorship of the proletariat!"
 MNT_onepartystate: "Estado de Partido Único"
 MNT_onepartystate_desc: "Todos esses partidos tolos não conseguem compreender totalmente a lógica dialética e são idiotas retrógrados que querem levar nossa sociedade a um conflito de classes. Não devemos permitir que isso aconteça!"
 MNT_eliminate_bourjuy: "Eliminar a Burguesia"
 MNT_eliminate_bourjuy_desc: "Os burgueses tolos que assolam nosso país como ratos devem ser eliminados e seus bens devem ser compartilhados entre a população!"
 MNT_declare_autarky: "Declarar Autarquia"
 MNT_declare_autarky_desc: "The dirty capitalist global market is holding its bloody hands near our neck all of the time! We shall not be subjugated by the global snake of imperialism and rely only on ourselves for now."
 MNT_nationalise_economy: "Nacionalização da Economia"
 MNT_nationalise_economy_desc: "Toda a economia estatal deve pertencer ao povo do estado! E como somos a ditadura do proletariado, o melhor dos melhores do povo comum, o governo deve administrar todas as empresas."
 MNT_revolution_might: "Força da Revolução"
 MNT_revolution_might_desc: "Em nome do sagrado Marx, a força da revolução deve ser aparente para todos os países próximos e distantes! A ameaça capitalista deveria temer e tremer ao ouvir sobre nossa força!"
 MNT_titois_economic_practise: "Praticidade de Tito"
 MNT_titois_economic_practise_desc: "Josip Broz Tito foi o homem mais sábio de todos os Bálcãs, aqueles que questionam isso são traidores ou tolos. Devemos adaptar suas políticas econômicas novamente em nosso reluzente Montenegro vermelho para ver nosso país prosperar!"
 MNT_socialist_agenda_desc: "Todos em nosso país devem estudar e aprender o Marxismo de coração! Esta é nossa nova agenda, de acordo com a qual devemos adaptar mais programas sociais para atender às necessidades do povo comum!"
 MNT_greate_reclaimation: "Grande Reivindicação!"
 MNT_greate_reclaimation_desc: "Now, time has come to export the revolution and raise the red banner over all Balkan region!"
 MNT_montenegro_dem: "Democratas de Montenegro"
 MNT_montenegro_dem_desc: "Montenegro finalmente saiu do terror do autoritarismo e não devemos nos curvar a isso novamente! A democracia é o único caminho a seguir!"
 MNT_european_agenda: "Agenda Europeia"
 MNT_european_agenda_desc: "Montenegro sempre foi Europa, e nenhum passado comunista ou autoritário pode nos impedir de nos juntar à família europeia e abraçar a cooperação!"
 MNT_anti_oligarchism: "Anti-Oligarquismo"
 MNT_anti_oligarchism_desc: "O anti-oligarquismo deve ser uma das principais prioridades de nossa agenda política. Para que o verdadeiro mercado surja, novos espaços devem ser abertos!"
 MNT_democratisation: "Democratização"
 MNT_democratisation_desc: "The years of oppression of people's voice have brought us to state of non-existing democratic culture of voting. We must fix this!"
 MNT_montenegro_nationalism: "Nacionalismo Montenegrino"
 MNT_montenegro_nationalism_desc: "Não somos sérvios! Todos devem saber disso - não devemos ficar à sombra de nossos supostos irmãos. Somos independentes, soberanos e montenegrinos!"
 MNT_multiparty_system: "Sistema de Partidos Múltiplos"
 MNT_multiparty_system_desc: "Mesmo que isso contradiga nossos desejos, não devemos cair no abismo da repressão, mas estabelecer cooperação política com nossos concorrentes e solidificar um verdadeiro sistema de partidos múltiplos."
 MNT_fight_organized: "Combatendo o Crime"
 MNT_fight_organized_desc: "O crime deve ser punido e a lei e a ordem devem ser estabelecidas em nosso estado!"
 MNT_social_market: "Mercado Social"
 MNT_social_market_desc: "Para ver nosso povo prosperar e ser feliz, devemos apoiá-los socialmente e estabelecer garantias para necessidades necessárias."
 MNT_kill_serb_nats: "Repressão aos Nacionalistas Sérvios"
 MNT_kill_serb_nats_desc: "Os tolos nacionalistas sérvios ainda estão buscando nos reunir com a Sérvia. Isso deve ser interrompido!"
 MNT_freetrade: "Livre Comércio"
 MNT_freetrade_desc: "Nosso país deve estar livre para qualquer comércio estrangeiro. Nosso porto está acessível para todos!"
 MNT_secularism: "Estabelecimento do Secularismo"
 MNT_secularism_desc: "Não rejeitamos a verdade provável das religiões, no entanto, devemos separar a religião do estado."
 MNT_dukanovic_rule: "Regra de Đukanović"
 MNT_dukanovic_rule_desc: "Milo Đukanović é um proeminente político montenegrino que serviu múltiplos mandatos em diferentes posições políticas, desempenhando um papel significativo na política do país desde a década de 1990."
 MNT_family_comes_first: "A Família em Primeiro Lugar"
 MNT_family_comes_first_desc: "Muitos social-democratas estão me dizendo para alocar parte do orçamento para apoiar a família. Eu concordo! Por isso, todos os membros da minha família ocuparão cargos políticos significativos no aparato governamental..."
 MNT_cement_power: "Cimentando o Poder"
 MNT_cement_power_desc: "Devemos cimentar o poder de nosso partido de uma vez por todas, mantendo as instituições democráticas."
 MNT_dominance_of_dps: "Domínio do DPS"
 MNT_dominance_of_dps_desc: "O DPS é, e será, o partido dominante no parlamento! Devemos aumentar nossa popularidade com o uso de propaganda e manipulações políticas."
 MNT_person_of_the_year: "Pessoa do Ano no Crime Organizado"
 MNT_person_of_the_year_desc: "Não é segredo que Đukanović tem muitas conexões com gangues criminosas e a máfia. Para garantir que a máfia não prejudique Montenegro, Đukanović tentará integrá-la à estrutura política. A oposição pode dizer que nosso presidente é uma espécie de Personalidade do Ano no Crime Organizado, mas o que eles sabem sobre gestão do país, certo?"
 MNT_full_scale_privatisation: "Campanha de Privatização em Escala Total"
 MNT_full_scale_privatisation_desc: "Chegou a hora de nossa economia se privatizar totalmente e se livrar das práticas socialistas."
 MNT_formation_of_oligachs: "Aliança com Oligarcas"
 MNT_formation_of_oligachs_desc: "Devemos nos aliar com a Oligarquia para apoiar nosso estabelecimento político."
 MNT_bar_pirate_bay: "Baía dos Piratas de Bar"
 MNT_bar_pirate_bay_desc: "Todo o mercado negro de nosso porto deve ser... legalizado e as receitas dele devem ser entregues ao estado."
 MNT_reconsiliation_with_monarchists: "Reconciliação com Monarquistas"
 MNT_reconsiliation_with_monarchists_desc: "Os monarquistas estão ansiosos para encontrar apoio e representação. Podemos usar isso para nossos benefícios políticos."
 MNT_friend_in_the_west: "Amigos do Ocidente"
 MNT_friend_in_the_west_desc: "Os EUA e a Europa são nossos parceiros comerciais e devemos fomentar boas relações com eles."
 MNT_contacts_in_the_east: "Amigos do Oriente"
 MNT_contacts_in_the_east_desc: "Rússia e China são nossos parceiros comerciais e devemos fomentar boas relações com eles."
 MNT_castle_of_montenegro: "Castelo de Montenegro"
 MNT_castle_of_montenegro_desc: "Montenegro é o castelo de Đukanović e todos nós certamente gostamos disso!"
 MNT_serb_democrats: "Democratas Sérvios"
 MNT_serb_democrats_desc: "Partidos da minoria sérvia também estão presentes em Montenegro. E às vezes eles também desejam liderança política."
 MNT_promote_serbian_culture: "Promovendo a Cultura Sérvia"
 MNT_promote_serbian_culture_desc: "Os montenegrinos são obviamente sérvios! A cultura sérvia deve ser promovida em todos os lugares!"
 MNT_fight_corruption: "Combatendo a Corrupção"
 MNT_fight_corruption_desc: "Combater a corrupção é essencial para garantir a distribuição equitativa de recursos, fomentar o desenvolvimento econômico, manter o Estado de Direito e preservar a confiança pública nas instituições."
 MNT_traditional_values: "Valores Tradicionais"
 MNT_traditional_values_desc: "Devemos apoiar os valores tradicionais do nosso povo comum e nos livrar de todo o absurdo progressista."
 MNT_serbian_cooperation: "Cooperação Sérvia"
 MNT_serbian_cooperation_desc: "Para solidificar nossa unidade com a Sérvia, devemos fomentar a cooperação com o estado sérvio."
 MNT_fight_crime: "Combatendo o Crime"
 MNT_fight_crime_desc: "O crime deve ser punido e a lei e a ordem devem ser estabelecidas em nosso estado!"
 MNT_cooperation_with_russia: "Cooperação com a Rússia"
 MNT_cooperation_with_russia_desc: "Como nós sérvios dizemos - Deus no Céu, Rússia na Terra."
 MNT_serbian_language_in_constitution: "Política de Idioma"
 MNT_serbian_language_in_constitution_desc: "Devemos apagar as diferenças artificiais de idioma e estabelecer o sérvio como idioma oficial do estado."
 MNT_economic_regulations: "Regulamentações Econômicas"
 MNT_economic_regulations_desc: "Devemos regular nossa economia para garantir um desenvolvimento bem-sucedido na esfera econômica."
 MNT_serbian_chucrh: "Igreja Sérvia"
 MNT_serbian_chucrh_desc: "A Igreja Ortodoxa Sérvia é uma instituição religiosa proeminente dentro da tradição ortodoxa oriental, representando a fé majoritária do povo sérvio e desempenhando um papel cultural e histórico significativo nos Bálcãs."
 MNT_serbian_montenegro: "Montenegro Sérvio"
 MNT_serbian_montenegro_desc: "Now, after finishing all preparations, we are finally ready to reunite with Serbia."
 MNT_monarchist_in_power: "Monarquistas no Poder"
 MNT_monarchist_in_power_desc: "Time has come for our nation to go back to its ancient roots - restore the Monarchy!"
 MNT_monarchist_constitution: "Nova Constituição"
 MNT_monarchist_constitution_desc: "Precisamos reescrever nossa estúpida constituição democrática."
 MNT_royal_guard_desc: "Para proteger nossa nação sagrada, devemos estabelecer uma guarda real para nosso Rei!"
 MNT_traditional_vl_mon: "Tradicionalismo"
 MNT_traditional_vl_mon_desc: "Devemos apoiar os valores tradicionais do nosso povo comum e nos livrar de todo o absurdo progressista."
 MNT_royal_nobility: "Reestabelecer a Nobreza"
 MNT_royal_nobility_desc: "Muitas antigas casas nobres de Montenegro e Sérvia estão buscando que sua vontade e poder sejam restabelecidos. Podemos organizar isso."
 MNT_state_religion: "Ortodoxia Estatal"
 MNT_state_religion_desc: "A ortodoxia é o aspecto fundamental de nossa nação e devemos aplicá-la governamentalmente."
 MNT_centralisation: "Centralizando o Estado"
 MNT_centralisation_desc: "Devemos concentrar todo o poder do estado em nosso monarca."
 MNT_russian_royal: "Laços com a Realeza Russa"
 MNT_russian_royal_desc: "A realeza russa tem apoiado nossa causa contra inimigos estrangeiros há muito tempo. Devemos continuar sendo amigos deles."
 MNT_national_economy_desc: "A economia de nosso país deve se concentrar nos interesses de nossa nação, não de um grupo internacional!"
 MNT_serbian_legacy: "Legado Sérvio"
 MNT_serbian_legacy_desc: "Agora, chegou a hora de decidir o que fazer com a Sérvia..."
 MNT_neutral_prin: "Princípios de Neutralidade"
 MNT_neutral_prin_desc: "Não devemos apostar no campo da política. Em vez disso, devemos manter a neutralidade e ser muito cautelosos."
 MNT_Economy_baby: "Ministério da Economia"
 MNT_Economy_baby_desc: "Devemos estabelecer o Ministério da Economia para lidar com nossa crise!"
 MNT_restore_port: "Restaurar o Porto de Bar"
 MNT_restore_port_desc: "Port of Bar is the biggest port of our country and the biggest transport hub in Adriatic Sea. We must restore the work of our Port to gain profit out of it."
 MNT_join_wto: "Entrar na OMC"
 MNT_join_wto_desc: "Para obter uma conexão com a comunidade comercial externa, devemos entrar na Organização Mundial do Comércio!"
 MNT_agricul_dev: "Estratégia de Agricultura e Desenvolvimento Rural."
 MNT_agricul_dev_desc: "A Estratégia de Agricultura e Desenvolvimento Rural de Montenegro é um projeto financiado pelo Ministério da Agricultura de Montenegro e pela UE. O principal objetivo deste projeto é reviver o Setor Agrícola de Montenegro."
 MNT_support_tourism: "Apoiar o Turismo"
 MNT_support_tourism_desc: "O turismo é o setor mais promissor de nossa economia. Devemos tomar medidas para desenvolver nosso setor turístico."
 MNT_tourist_mecca: "Mecca Turística"
 MNT_tourist_mecca_desc: "Conseguimos criar uma verdadeira meca para os turistas de todo o mundo."
 MNT_revive_industry: "Restaurando o Setor Industrial"
 MNT_revive_industry_desc: "A queda do nosso setor industrial é consequência da má administração da economia iugoslava. Precisamos restaurar nossa indústria e consertar a economia!"
 MNT_save_aluminium_plant: "Planta de Alumínio Podgorica"
 MNT_save_aluminium_plant_desc: "Significance of Aluminium Plant Podgorica couldn't be described, this aluminium plant is creating the biggest part of our GDP. We must save our plant from collapsing!"
 MNT_expand_port: "Expandir o Porto de Bar"
 MNT_expand_port_desc: "Devemos expandir o Porto de Bar para aumentar a capacidade de recebimento de mercadorias e turistas."
 MNT_wind_power: "Energia Eólica de Montenegro"
 MNT_wind_power_desc: "Our geographical location allows us to use wind power on full power!"
 MNT_foreign_production: "Produção Estrangeira"
 MNT_foreign_production_desc: "Para melhorar nosso PIB, podemos convidar investidores estrangeiros para construir mais complexos industriais."
 MNT_heaven_for_elits: "Paraíso para Elite"
 MNT_heaven_for_elits_desc: "Imagine you are the richest person in the world and you need to keep your yacht somewhere. This place must be relatively cheap and should be surrounded by the beautiful nature, and the Republic of Montenegro fits this criteria!"
 MNT_support_tourist_bussiness: "Apoiar Negócios Turísticos"
 MNT_support_tourist_bussiness_desc: "É óbvio que o crescimento das pequenas empresas está relacionado ao aumento do interesse turístico em nosso país. Devemos tomar todas as medidas possíveis para estimular esse crescimento."
 MNT_revive_old_relics: "Trabalhos Arqueológicos"
 MNT_revive_old_relics_desc: "A terra de Montenegro tem uma história rica. Ruínas de antigas cidades de tribos eslavas e fortalezas da República de Veneza estão espalhadas por todo nosso território. Devemos financiar trabalhos arqueológicos para recuperar relíquias antigas."
 MNT_highway_to_hell: "Expansão das Autoestradas de M"
 MNT_highway_to_hell_desc: "Para melhorar a infraestrutura montenegrina e facilitar a viagem da nossa população e dos turistas pelo país, precisamos expandir nossas principais rodovias."
 MNT_support_holdings: "Apoiar Holdings Agrícolas"
 MNT_support_holdings_desc: "Agriculture holdings are the main agents in the agriculture market. We must support them with all the funds we have to not let them die."
 MNT_improve_logistick: "Improve Logistics"
 MNT_improve_logistick_desc: "To fix the supply chain in the agriculture market, we must improve our R's roads. We will involve the Ministry of Transport to fund all the regional road projects."
 MNT_export_agri: "Exportar Produtos Agrícolas"
 MNT_export_agri_desc: "After the fulfillment of agricultural goods on the internal market, we could create a profit from our goods and export them to external markets."
 MNT_agri_revival: "Agricultural Revival"
 MNT_agri_revival_desc: "Olives, fruits, tobacco: all of these beautiful goods are our gold that Mother Nature has granted our people. Thanks to our reforms, we managed to fulfill our internal market and become a serious competitor on the world market."
 MNT_ageconomic_prosperity: "Era de Prosperidade de Montenegro"
 MNT_ageconomic_prosperity_desc: "Conseguimos! Conseguimos sair desta crise devastadora que os anos 90 e 00 trouxeram para nosso povo. Podemos dizer que o século 21 pode se tornar a era de nossa prosperidade!"
 MNT_aremd_forces: "Forças Armadas de Montenegro"
 MNT_aremd_forces_desc: "Any country needs its armed forces to defend against external enemies. Revanchistic Serbs, Albanian nationalists, NATO eagles: all of them are only the start of the list of potential enemies."
 MNT_legacy_of_yugoslavia: "Legado das Forças Armadas Iugoslavas"
 MNT_legacy_of_yugoslavia_desc: "Nossa localização geográfica nos obriga a usar uma estratégia de defesa iugoslava para proteger Montenegro. Não seria difícil implementar, já que todos os nossos generais já estavam familiarizados com essa estratégia durante o serviço iugoslavo."
 MNT_montenegro_navy: "Marinha de Montenegro"
 MNT_montenegro_navy_desc: "A linha costeira de Montenegro é nosso calcanhar de Aquiles. Todas as nossas grandes cidades e centros de transporte estão localizados perto do mar. Devemos estabelecer nossas próprias forças navais para proteger nossas costas!"
 MNT_save_yug_boat: "Salvar Navios Iugoslavos"
 MNT_save_yug_boat_desc: "Muitos navios iugoslavos antigos ainda estão deixados em nossos antigos estaleiros. Se conseguirmos salvá-los, poderíamos ter uma boa frota costeira."
 MNT_buy_transport: "Comprar Navios de Desembarque Marítimos"
 MNT_buy_transport_desc: "Em termos de nossa estratégia militar, é necessário possuir alguns dos navios de desembarque marítimos."
 MNT_anti_navy_defence: "Defesa da Linha Costeira"
 MNT_anti_navy_defence_desc: "Para proteger nossa longa linha costeira, uma linha de complexos protetores deve ser construída ao longo de nossas costas."
 MNT_improve_navy_base: "Melhorar Bases Navais"
 MNT_improve_navy_base_desc: "Nosso estaleiro deve ser melhorado para garantir nossa segurança."
 MNT_montenegro_ground_forces: "Forças Terrestres de Montenegro"
 MNT_montenegro_ground_forces_desc: "Para proteger nossa terra e montanhas, devemos criar forças terrestres e equipá-las com as últimas tecnologias."
 MNT_ammunition_from_zastava: "Ammunition from Zastava"
 MNT_ammunition_from_zastava_desc: "Zastava Ammunition is a legacy of Yugoslavia that wasn't destroyed during times of trouble. Buying their ammunition would greatly help us in army creation."
 MNT_american_ammunition: "Ammunition from the US"
 MNT_american_ammunition_desc: "Os parceiros ocidentais possuem a munição mais tecnológica do mercado. Obter isso nos ajudaria a construir um exército tecnologicamente avançado."
 MNT_russian_ammunition: "Ammunition from Russia"
 MNT_russian_ammunition_desc: "Os parceiros russos possuem a munição mais eficiente do mercado. Obter isso nos ajudaria a construir um exército poderoso."
 MNT_russian_vehicles: "Veículos Russos"
 MNT_russian_vehicles_desc: "Os veículos russos são os mais eficazes do mercado. Comprá-los tornaria nosso exército mais organizado e poderoso."
 MNT_american_vehicles: "Veículos Americanos"
 MNT_american_vehicles_desc: "Os veículos americanos são os mais avançados do mercado. Comprá-los tornaria nosso exército mais tecnologicamente avançado e manobrável."
 MNT_tara_arms: "Armas Tara"
 MNT_tara_arms_desc: "A Tara Arms é uma empresa baseada na antiga fábrica de 4 de novembro. O principal objetivo da empresa é fabricar armas civis para os cidadãos e armas militares para as forças militares."
 MNT_montenegro_air: "Força Aérea de Montenegro"
 MNT_montenegro_air_desc: "Para manter nosso espaço aéreo seguro, devemos criar forças aéreas e equipá-las com todo o equipamento necessário de que precisam."
 MNT_save_yug_air: "Save Yugoslavian Aircraft"
 MNT_save_yug_air_desc: "Herdamos muitos caças aéreos iugoslavos dos antigos aeródromos. Tire a poeira deles, e eles estão prontos para serem utilizados."
 MNT_mlrs: "Defesa Antiaérea"
 MNT_mlrs_desc: "Não poderíamos ter certeza de que nossos inimigos eram intocáveis se não houvesse sistemas de defesa antiaérea. Restaurar os antigos sistemas de defesa antiaérea iugoslavos e comprar os novos garantirá a segurança de nosso espaço aéreo."
 MNT_foreign_helis: "Comprar Helicópteros Estrangeiros"
 MNT_foreign_helis_desc: "Para relocar nossas tropas em climas difíceis e condições geopolíticas complicadas, devemos adquirir novos helicópteros."
 MNT_improve_air_base: "Melhorar Bases Aéreas"
 MNT_improve_air_base_desc: "Devemos melhorar nossas bases aéreas para aumentar sua capacidade de armazenamento de aeronaves."
 MNT_strong_and_ready: "Forte e Pronto"
 MNT_strong_and_ready_desc: "Nossas forças foram estabelecidas e estão bem preparadas para realizar tarefas militares. Nossos soldados são os maiores filhos de Montenegro!"
 MNT_foreign_affairs: "Ministério das Relações Exteriores"
 MNT_foreign_affairs_desc: "Para estar em contato com o mundo exterior, devemos estabelecer o Ministério das Relações Exteriores."
 MNT_eyes_on_west: "Olhos no Ocidente"
 MNT_eyes_on_west_desc: "A cooperação com países ricos e desenvolvidos do ocidente é necessária para construir raízes comerciais fortes, apesar de todas as coisas ruins que a OTAN trouxe para nossa terra."
 MNT_american_inv: "Convidar Investidores Americanos"
 MNT_american_inv_desc: "A cooperação com investidores americanos no setor industrial poderia ser benéfica para o crescimento de nosso PIB e a cooperação transcontinental."
 MNT_german_inv: "Convide investidores alemães"
 MNT_german_inv_desc: "A cooperação com investidores alemães no setor industrial poderia ser benéfica para o crescimento de nosso PIB e para nossa futura possível integração na UE."
 MNT_european_trade: "Acordo Comercial Europeu"
 MNT_european_trade_desc: "Não se pode argumentar que Montenegro é um país europeu, e não podemos ignorar o fato de que negociar com a UE é necessário para nós. Nossa terra rica poderia fornecer tudo para os europeus comuns."
 MNT_eyes_on_east: "Olhos no Oriente"
 MNT_eyes_on_east_desc: "Rússia, Sérvia e China. Todos eles são nossos aliados históricos. Estamos conectados às raízes da cooperação histórica e não podemos ser separados."
 MNT_seek_serb_trade: "Comércio com a Sérvia"
 MNT_seek_serb_trade_desc: "A Sérvia é o país mais próximo de nós. Uma vez unidos e agora separados, devemos continuar o diálogo econômico."
 MNT_seek_rus_trade: "Comércio com a Rússia"
 MNT_seek_rus_trade_desc: "A Rússia é nosso aliado histórico. O Estado russo está sempre aqui se precisarmos de ajuda, como um irmão mais velho. É óbvio que devemos continuar o diálogo econômico."
 MNT_chinese_infra: "Autoestrada Belgrado - Bar"
 MNT_chinese_infra_desc: "To improve Balkan infrastructure and create a route that will connect us to the outer Balkans, a project was created that includes building a motorway from the Port of Bar to Belgrade. The main problem with the project is that we badly need financial support, and the government has decided to ask for investments from Chinese financial organizations."
 MNT_questio_of_direction: "Questão de Direção"
 MNT_questio_of_direction_desc: "Estamos à beira da maior escolha, que influenciará não apenas a direção de nossa política externa, mas também a situação nos Bálcãs. Devemos decidir com sabedoria."
 MNT_cave_to_serbia: "Aprofundar a Cooperação com a Sérvia"
 MNT_cave_to_serbia_desc: "Our warm relations with Serbia couldn't be broken by anyone, nor could our pro-eastern agenda."
 MNT_sco_observer: "Conexões com a SCO"
 MNT_sco_observer_desc: "The Shanghai Cooperation Organisation is the best alternative to western imperialist alliances. We will observe the SCO closely and take part in all of its meetings."
 MNT_reunion_with_serbia: "Reunião com a Sérvia"
 MNT_reunion_with_serbia_desc: "Está se tornando óbvio que a dissolução do estado sérvio-montenegrino foi um grande erro que levou a uma instabilidade política ainda maior na região. Enviaremos uma sugestão oficial para a recriação da união sérvio-montenegrina."
 MNT_union_with_russia: "Juntar-se à CSTO"
 MNT_union_with_russia_desc: "Não podemos ignorar nossas relações calorosas com a Rússia. Nosso irmão não permitirá que alguém nos prejudique, mas para garantir que a Rússia nos ajude, enviaremos uma petição oficial para ingressar na CSTO."
 MNT_free_harbour: "Porto Livre"
 MNT_free_harbour_desc: "Inclinar-se para qualquer lado seria devastador para nossa economia e nossa independência. Para garantir que salvemos nossa soberania, nos declararemos um porto livre no Mar Adriático."
 MNT_neutral_status: "Status Neutro"
 MNT_neutral_status_desc: "Para manter nosso país como um estado independente, devemos oficialmente nos declarar um estado neutro com a ajuda das principais potências europeias."
 MNT_swiss_model: "Suíça dos Bálcãs"
 MNT_swiss_model_desc: "Para manter a paz em nosso país, devemos negociar com países vizinhos. Devemos implementar o modelo suíço de política externa e nos tornar a Suíça dos Bálcãs."
 MNT_european_intragrate: "Agenda Pró-Europeia"
 MNT_european_intragrate_desc: "A agenda ocidental deve ser dominante em nossa política externa para nos afastarmos de nosso legado autoritário."
 MNT_nato_affairs: "Cooperação com a OTAN"
 MNT_nato_affairs_desc: "Se quisermos salvar nossa identidade e nosso país das forças destrutivas do autoritarismo, devemos cooperar com a OTAN."
 MNT_eu_model: "Implementar Modelo Europeu"
 MNT_eu_model_desc: "To be welcomed into the EU, we must implement progressive reforms and adopt European standards of government structure. It will be a long process, but we believe in ourselves!"
 MNT_nato_aspiration: "Juntar-se à OTAN"
 MNT_nato_aspiration_desc: "Para não ter medo de quaisquer ameaças externas e para ter a certeza de que a nossa democracia não será prejudicada, devemos aderir à organização da NATO."
 MNT_independent_politics: "Política Montenegrina"
 MNT_independent_politics_desc: "Após a longa ocupação pelos comunistas iugoslavos, Montenegro tornou-se independente novamente, pela vontade de nosso povo! Agora é hora de fazer mudanças políticas!"
