 ALG_shipbuilding: "Алжирское судостроение"
 ALG_shipbuilding2: "Алжирское судостроение"
 ALG_resist_le_pouvoir_system_tt: "§YНовая система разблокирована: Недовольство народа и влияние армии§!\n\n- §OНедовольство народа§! измеряет народное недовольство. Оно возрастает, если игнорируются безработица, образование или здравоохранение.\n- Если недовольство становится слишком высоким, могут вспыхнуть массовые протесты или гражданская война.\n\n- §OВлияние армии§! отслеживает роль армии в политике. Ослабление её посредством реформ может позволить мирный переход, но если влияние растёт, армия может подавить демократию и усилить свою хватку.\n\nЧтобы выжить на этом пути, вам необходимо сбалансировать реформы, стабильность и власть армии."
 ALG_reactioners: "Кластерная экономика"
 ALG_reactioners1: "Кластерная экономика"
 ALG_reactioners2: "Кластерная экономика"
 ALG_reactioners3: "Кластерная экономика"
 ALG_reactioners4: "Кластерная экономика"
 ALG_reactioners5: "Кластерная экономика"
 ALG_reactioners6: "Кластерная экономика"
 ALG_reactioners7: "Кластерная экономика"
 ALG_automobile_industry: "Развитие автомобильной промышленности"
 ALG_automobile_industry_desc: "Алжир долгое время зависел от импорта для удовлетворения своих потребностей в автомобильной промышленности. Развитие отечественной автомобильной промышленности позволит создать рабочие места, сократить импорт и превратить Алжир в региональный производственный центр."
 ALG_peugeot_deal: "Инвестиции Peugeot"
 ALG_peugeot_deal_desc: "Компания Peugeot выразила заинтересованность в открытии завода в Алжире. Это партнерство могло бы обеспечить нас столь необходимыми производственными мощностями."
 ALG_renault_oran: "Рено в Оране"
 ALG_renault_oran_desc: "Компания Renault готова наладить производство в Оране, что обеспечит стабильный поток автомобилей и будет способствовать развитию нашей экономики."
 ALG_hyundai_tiaret: "Хёндай в Тиарете"
 ALG_hyundai_tiaret_desc: "Южнокорейская компания Hyundai готова наладить партнерские отношения в Тиарете, что позволит создать рабочие места и снизить зависимость от европейских производителей."
 ALG_volkswagen_relizane: "Volkswagen в Релизане"
 ALG_volkswagen_relizane_desc: "Компания Volkswagen и связанные с ней бренды (Skoda, Audi, Seat) готовы открыть завод в Релизане, что позволит еще больше диверсифицировать нашу промышленную базу."
 ALG_bmw_deal: "Партнерство BMW"
 ALG_bmw_deal_desc: "Немецкая компания BMW проявила интерес к сборке автомобилей класса люкс и премиум-класса в Алжире, что позволит поднять нашу автомобильную промышленность на международный уровень."
 ALG_mercedes_trucks: "Грузовики Mercedes"
 ALG_mercedes_trucks_desc: "Сотрудничество с Daimler позволит нам собирать военные грузовики и тяжелую технику Mercedes в Алжире, оказывая прямую поддержку нашим вооруженным силам."
 ALG_auto_scandal: "Автомобильный коррупционный скандал"
 ALG_auto_scandal_desc: "Разоблачения показали, что алжирская автомобильная сборочная промышленность — это коррупционная фиктивная система, где субсидии используются не по назначению, а заводы занимаются лишь пересборкой импортированных комплектующих. Скандал будет иметь серьезные политические и экономические последствия."
 ALG_import_ban: "Запретить импорт автомобилей"
 ALG_import_ban_desc: "В целях защиты отечественной промышленности мы запретим импорт большинства иностранных автомобилей. Эта мера вызывает споры и в краткосрочной перспективе создаст экономические трудности."
 ALG_fiat_deal: "Инвестиционная сделка с Fiat"
 ALG_fiat_deal_desc: "Компания Fiat предложила вернуться в Алжир с современным промышленным комплексом, пообещав возобновить производство и восстановить доверие общественности к нашему автомобильному сектору."
 ALG_indigenous_brand: "Создайте бренд, принадлежащий коренным народам."
 ALG_indigenous_brand_desc: "Вместо того чтобы полагаться на иностранные компании, Алжиру следует создать собственное отечественное автомобильное производство, автомобили которого будут проектироваться и производиться местными алжирцами."
 ALG_auto_exports: "Экспорт алжирских автомобилей"
 ALG_auto_exports_desc: "Благодаря стабильной отечественной автомобильной промышленности мы теперь можем смотреть за пределы страны и начать экспортировать автомобили алжирского производства на рынки Африки и Средиземноморья."
 alg.1000.t: "Коррупционный скандал в автомобильной промышленности"
 alg.1000.d: "Масштабный коррупционный скандал потряс автомобильную отрасль Алжира. Расследование показало, что многие так называемые «заводы» на самом деле были всего лишь сборочными предприятиями, злоупотреблявшими государственными субсидиями и завышавшими цены. Доверие общественности рушится, и отрасль находится на грани паралича."
 alg.1000.a: "Национальное унижение."
 ALG_tebboune_tt: "Абдельмаджид Теббун становится президентом Алжира после протестов «Хирак» 2019 года. Известная «банда» коррумпированных политиков, включая Ахмеда Уяхью, Абдельмалека Селлаля, Али Хаддада и Махиэддина Тахкута, арестована и предстала перед судом. Это знаменует начало новой эры, хотя многие сомневаются в глубине проводимых реформ."
 ALG_corruption_network: "Окружение Бутефлики"
 ALG_corruption_network_desc: "Коррумпированная сеть политиков и бизнесменов, включая Уяхью, Селлаля и Тахкута, доминирует в алжирской политике. Их влияние ослабляет государство и разжигает общественное недовольство."
 ALG_cleaning_the_state: "Очистка штата"
 ALG_clean_government: "Чистое правительство"
 ALG_political_repression: "Политические репрессии"
 ALG_military_junta: "Военная хунта"
 ALG_cleaning_the_state_desc: "После падения режима \"Антуража\" Алжир наконец-то предпринимает шаги по искоренению коррупции в своих институтах и восстановлению доверия народа."
 algeria_reforms.1.t: "Реформы при Теббуне"
 algeria_reforms.1.d: "После отставки Абдельазиза Бутефлики и избрания Абдельмаджида Теббуна Алжир вступает в новую политическую главу. Теббун пообещал реформы, новую конституцию и ликвидацию печально известной коррупционной сети, известной как «Исабах» (банда), в которую входили бывшие премьер-министры Ахмед Уяхья, Абдельмалек Селлаль и такие бизнесмены, как Али Хаддад и Махиеддин Тахкут.\n\nОднако движение «Хирак» по-прежнему скептически относится к его обещаниям. Приведут ли эти реформы к подлинной демократизации, или же это просто способ сохранить режим под новым руководством?"
 algeria_reforms.1.a: "Поддержите реформы Теббуна."
 algeria_reforms.1.b: "Народ требует большего!"
 ALG_arrest_the_gang: "Арестуйте окружение."
 ALG_arrest_the_gang_desc: "Алжирский народ требует справедливости. Теббун продолжит преследование Уяхьи, Селлаля, Хаддада, Тахкута и других коррумпированных деятелей, растративших богатства страны."
 ALG_at_a_crossroads: "Страна стоит на перепутье"
 ALG_at_a_crossroads_desc: "В условиях беспрецедентных вызовов, стоящих перед нашей страной, мы находимся в переломном моменте нашей истории. Выбор, который мы сделаем сейчас, сформирует наше будущее и определит курс нашего общества. Примем ли мы перемены и реформы или будем цепляться за прошлое? Выбранный нами путь определит наше наследие."
 ALG_promises_of_reform: "Обещания реформ"
 ALG_promises_of_reform_desc: "Для новой Алжира необходима новая конституция. Теббун обещает реформы, направленные на ограничение президентских сроков, укрепление парламента и гарантирование большего числа свобод."
 ALG_suppressed_opposition: "Подавленная оппозиция"
 ALG_black_decade_methods: "Методы «Черного десятилетия»"
 ALG_black_market: "Черный рынок"
 ALG_pna_expansion: "Расширение PNA"
 ALG_global_power: "Глобальная мощь"
 ALG_crackdown_on_dissent: "Жесткие меры против движения «Хирак»"
 ALG_crackdown_on_dissent_desc: "Протесты не прекратились. Вместо диалога Теббун выбрал репрессии, надеясь заставить замолчать инакомыслие и сохранить государство."
 ALG_rebuild_trust_investors: "Восстановить доверие инвесторов"
 ALG_rebuild_trust_investors_desc: "После многих лет коррупции и нестабильности мы должны восстановить доверие иностранных и отечественных инвесторов к нашей экономике."
 ALG_diversify_economy: "Диверсифицировать экономику"
 ALG_diversify_economy_desc: "Алжир не может полагаться исключительно на нефть и газ. Возобновляемые источники энергии, сельское хозяйство и промышленность станут опорой нашего будущего."
 ALG_social_subsidies: "Защитить социальные субсидии"
 ALG_social_subsidies_desc: "Население зависит от субсидий на топливо, хлеб и жилье. Теббун обещает сохранить эти меры защиты, несмотря на экономические трудности."
 ALG_balance_regional_powers: "Баланс региональных держав"
 ALG_balance_regional_powers_desc: "Алжир находится между Европой, Африкой и арабским миром. Мы должны проводить сбалансированную внешнюю политику, отвечающую нашим интересам."
 ALG_strengthen_russia_ties: "Укреплять связи с Россией"
 ALG_strengthen_russia_ties_desc: "Наша историческая дружба с Москвой может укрепиться благодаря сотрудничеству в сфере обороны и энергетическим сделкам."
 ALG_china_investments: "Китайские инвестиции"
 ALG_china_investments_desc: "Инициатива «Один пояс и один путь» предоставляет Алжиру возможность модернизировать инфраструктуру и привлечь крупные китайские инвестиционные проекты."
 ALG_north_south_highway: "Проект автомагистрали Север-Юг"
 ALG_automobile_factories: "Автомобильная промышленность"
 ALG_automobile_factories_desc: "Для обеспечения занятости населения и наращивания экономического потенциала нам, возможно, потребуется пригласить в страну иностранных производителей автомобилей."
 algeria_policy.1.t: "Осуждение колониальных режимов"
 algeria_policy.1.d: "Фронт национального освобождения (ФНО) выступил с резким осуждением прошлых колониальных режимов, осудив преступления, совершенные во время оккупации Алжира. Это заявление вызвало национальную гордость внутри страны, но спровоцировало гнев в Париже, ухудшив алжирско-французские отношения."
 algeria_policy.1.a: "Разоблачите преступления колониализма!"
 algeria_disaster.1.t: "Землетрясение в Бумердесе"
 algeria_disaster.1.d: "Разрушительное землетрясение произошло на севере Алжира, эпицентр находится недалеко от города Бумердес. Тысячи людей погибли, десятки тысяч получили ранения, а обширные районы Алжира и прибрежной зоны превращены в руины. Страна находится в шоке, спасательные операции с трудом справляются с масштабами катастрофы. Необходимы незамедлительные действия для восстановления порядка и оказания помощи пострадавшему населению."
 algeria_disaster.1.a: "Мобилизация групп экстренного реагирования и начало восстановительных работ."
 ALG_earthquake_recovery_tt: "Начинаются спасательные операции. Правительство вскоре примет решение о финансировании реконструкции."
 algeria_disaster.2.t: "Усилия по реконструкции и восстановлению"
 algeria_disaster.2.d: "Последствия землетрясения повергли Алжир в один из самых тяжелых гуманитарных кризисов в его современной истории. Тысячи людей остаются без крова, а жизненно важная инфраструктура лежит в руинах. Правительству предстоит решить, как финансировать восстановление: либо путем создания национального фонда помощи за счет государственных ресурсов, либо путем обращения за иностранной помощью, которая может сопровождаться политическими условиями."
 algeria_disaster.2.a: "Создать фонд государственной помощи"
 ALG_state_aid_fund_tt: "Выделить государственные ресурсы на восстановление пострадавших регионов. Это создаст дополнительную нагрузку на казну, но укрепит доверие к правительству внутри страны."
 algeria_disaster.2.b: "Обратитесь за иностранной помощью."
 ALG_foreign_aid_dependence_tt: "Обратитесь за помощью к международным партнерам. Это снизит финансовое давление, но усилит иностранное влияние на внутренние дела Алжира."
 ALG_french_influence: "Французское влияние в тени"
 ALG_french_influence_desc: "Несмотря на формальную независимость, политика Алжира по-прежнему находится под влиянием Франции. Коррумпированные генералы и политики, связанные с Парижем, влияют на процесс принятия решений, ограничивая подлинный суверенитет."
 ALG_shadow_state: "Власть в тени"
 ALG_shadow_state_desc: "В Алжире господствует скрытая сеть генералов, сотрудников разведки и бизнесменов, часто называемая «Le Pouvoir» (Власть). Коррупция ослабляет государство, но эта теневая система обеспечивает политическую стабильность и укрепляет власть режима."
 algeria_emerging_youth: "Молодежные организации"
 algeria_nationalist_youth: "Молодежные организации"
 algeria_nationalist_rise: "Возрождение национализма"
 algeria_nationalist_rise_desc: "Национализм в Алжире становится популярнее, чем когда-либо. Это объясняется четким противодействием правительства иностранному вмешательству в дела государства и его твердой поддержкой суверенитета и независимости страны."
 algeria_cultural_rebirth: "Культурное возрождение"
 ALG_PNA_victory: "Военное правление"
 ALG_PNA_victory_desc: "Национальная армия Алжира (Armée nationale populaire) — это вооруженные силы страны. С момента обретения Алжиром независимости в 1962 году она играла важную роль в политике. Практически до 1988 года она контролировала правительство, после чего была установлена многопартийная система. Однако она продолжает оказывать влияние на политику Алжира, самым недавним примером чего является отставка президента Абдельазиза Бутефлики в 2019 году после протестов, приведших к потере поддержки со стороны военных."
 ALG_kick_out_morocco: "Выгнать Марокко"
 ALG_kick_out_morocco_desc: "Марокко всегда держало нас под своим контролем, и у нас нет причин поддерживать с ними связи. Сейчас самое время выгнать этих идеологических врагов из Алжира!"
 ALG_statist_rise: "Рост государственного вмешательства"
 ALG_statist_rise_desc: "Либеральная экономика допускает эксплуатацию нашего народа и ставит под угрозу нашу национальную независимость и контроль. Для Алжира лучше всего связать все аспекты экономики с государством."
 ALG_maintain_military_role: "Поддерживать рычаги влияния армии"
 ALG_maintain_military_role_desc: "Мир переживает темные и сложные времена, поэтому мы должны защитить нашу страну, чего бы это ни стоило."
 ALG_kick_out_iran: "Выгнать Иран"
 ALG_kick_out_iran_desc: "Иран всегда держал нас под своим контролем, и у нас нет причин поддерживать с ним связи. Сейчас самое время выгнать этих идеологических врагов из Алжира!"
 ALG_nationalize_oligarchic_holdings: "Национализ Холдингс"
 ALG_nationalize_oligarchic_holdings_desc: "Мы национализируем активы и имущество различных олигархов-мошенников, чтобы укрепить свой контроль над экономикой."
 ALG_subsidise_police: "Субсидированная полиция"
 ALG_subsidise_police_desc: "Полиция — один из важнейших элементов, обеспечивающих чувство безопасности нашего народа и гарантирующих нашу власть в Алжире, но она крайне недофинансирована. Это должно измениться."
 ALG_maintain_socialistic_policies: "Сохранение социалистических законов"
 ALG_maintain_socialistic_policies_desc: "Одно из правильных решений предыдущего правительства, и главная причина его относительной популярности, — это социалистическая политика, направленная на поддержку низших слоев населения. Мы продолжим политику, проводимую бывшим президентом Хафезом Асадом, и будем позиционировать себя как истинных защитников угнетенных."
 ALG_government_planned_economic_projects: "Государственные проекты"
 ALG_government_planned_economic_projects_desc: "Нам следует инициировать государственные проекты для улучшения нашего имиджа как ответственного правительства и для завоевания поддержки простых людей."
 ALG_patriotic_propaganda: "Патриотическая пропаганда"
 ALG_patriotic_propaganda_desc: "Мы укрепим наши идеологические позиции, подчеркивая важность национальной гордости и лояльности государству."
 ALG_gather_support_from_peasantry: "Поддержка крестьянства"
 ALG_gather_support_from_peasantry_desc: "Крестьяне — это основа нашей нации, и мы должны убедиться, что они нас поддерживают."
 ALG_strong_government: "Сильное правительство"
 ALG_strong_government_desc: "Нам придётся показать нашему народу, что наше правительство стабильно и достаточно компетентно для управления страной. Это позволит нам завоевать их доверие."
 ALG_expand_youth_organizations: "Расширение деятельности молодежных организаций"
 ALG_expand_youth_organizations_desc: "Наши партии всегда в значительной степени опирались на молодежные организации, и теперь, когда мы находимся у власти, настало время побудить молодежь поддержать наши идеологические идеи, завоевав их сердца и умы."
 ALG_illiberal_democracy: "Нелиберальная демократия"
 ALG_illiberal_democracy_desc: "Либерализм — это вирус, который заражает и эксплуатирует бедные страны. Народу нужна истинная демократия, которая действительно представляет интересы народа и в то же время объединяет его под одним знаменем. Мы — демократия, несмотря ни на что."
 ALG_reestablish_intelligence_committee: "Восстановить разведывательные агентства"
 ALG_reestablish_intelligence_committee_desc: "Будущие войны будут вестись не с помощью оружия и танков, а с помощью информации. Наша обязанность — создать полностью функциональное разведывательное агентство."
 ALG_national_security_act: "Закон о национальной безопасности"
 ALG_national_security_act_desc: "Экстремистские группировки медленно убивают нашу страну и представляют угрозу для нашего народа. Их нападения являются явной угрозой для нашей страны, и мы должны немедленно остановить их любой ценой, независимо от того, что произойдет. ТЕРРОРИЗМ ДОЛЖЕН БЫТЬ ОСТАНОВЛЕН."
 ALG_pan_algerian_nationalism: "Паналжиризм"
 ALG_pan_algerian_nationalism_desc: "Алжир - это страна, которая должна украсить всю Северную Африку своей уникальной самобытностью. Наша богатая история и культура ясно показывают, что наш долг - показать миру наш истинный потенциал и самобытность."
 ALG_cultural_rebirth: "Культурное возрождение"
 ALG_cultural_rebirth_desc: "Наша нация медленно, но верно осознаёт свою идентичность. Мелкие разногласия не должны мешать осознанию красоты нашего народа. Наш народ должен понимать, что, несмотря ни на что, мы всё ещё алжирцы."
 ALG_deal_with_the_trade_unions: "Соглашение с профсоюзами"
 ALG_deal_with_the_trade_unions_desc: "Ключ к сильной стране — это её производство и экономика, поэтому мы должны убедиться, что все трудящиеся Алжира поддерживают нас."
 ALG_reassert_russian_ties: "Российские связи"
 ALG_reassert_russian_ties_desc: "Россия - единственный и верный союзник, который помогает нам стать современной, безопасной и процветающей нацией."
 ALG_russian_oil_excavation: "Сделки с Российской нефтью"
 ALG_russian_oil_excavation_desc: "В нашей стране есть большое сокровище, и наш союзник, Россия, поможет нам добраться до этих ресурсов."
 ALG_russian_algiers_base_expansion: "Расширение военно-морского присутствия России"
 ALG_russian_algiers_base_expansion_desc: "Мы не можем создать сильный военно-морской флот немедленно, но наши российские друзья помогут нам обеспечить безопасность наших берегов, помогая в расширении возможностей порта."
 ALG_houarist_rise: "Восхождение Хуариста"
 ALG_houarist_rise_desc: "Хуаризм вновь набирает силу и готов вернуть Алжиру былое величие."
 ALG_islamic_socialism: "Исламский социализм"
 ALG_islamic_socialism_desc: "Люди, кажется, забывают, что ислам пропагандирует множество практик, присущих социализму, таких как закят и садака. Нам следует подчеркивать эту связь, основывая на ней наши идеалы, поскольку это также привлечет поддержку со стороны исламистов, которые всегда выступали против наших идеалов. Исламский социализм — это истинный путь к созданию современной, сильной и добродетельной республики."
 ALG_Get_rid_of_oligarchs: "Избавьтесь от олигархов"
 ALG_news.1.t: "Алжир на перепутье"
 ALG_news.1.d: "После почти десятилетия жестокого насилия, экономического распада и политической стагнации, в 2000 году Алжир оказался в решающем моменте. Гражданская война, известная многим как «Черное десятилетие», унесла жизни десятков тысяч людей, а многие другие были вынуждены покинуть свои дома. Хотя интенсивность боевых действий снизилась, напряженность остается высокой, а раны далеки от заживления.\n\nВ условиях неопределенности будущего страны противоборствующие силы движутся в разных направлениях. Один путь направлен на национальное примирение и демократические реформы для объединения страны. Другой склоняется к продлению чрезвычайного положения, сохранению власти нынешнего режима. Третий же шепот говорит о продолжении войны, о незавершенных сражениях, радикальных обещаниях и тех, кто отказывается сложить оружие.\n\nПуть, который выберет Алжир дальше, может определить его судьбу на многие поколения."
 ALG_news.1.a: "Все взгляды прикованы к Алжиру."
 Arab_Defense_Bloc: "Арабский оборонный блок"
 The_Maghreb_Joint_Defense: "Объединенная оборона Магриба"
 ALG_bouteflika.3.t: "Кризис здравоохранения в Бутефлике"
 ALG_bouteflika.3.d: "В 2013 году Бутефлика перенес тяжелый инсульт. Журналист Хишем Абуд был привлечен к ответственности за угрозу национальной безопасности, территориальной целостности и нормальному функционированию институтов Республики, а газеты, для которых он писал, подвергались цензуре, поскольку он написал, что президент вернулся из Валь-де-Грас в коматозном состоянии, и охарактеризовал Саида Бутефлику как кукловода, управляющего администрацией."
 ALG_bouteflika.3.a: "Что произойдёт?"
 ALG_boteflika_tt: "Это позволит получить доступ к информации о кризисе в сфере здравоохранения, с которым столкнулся президент Алжира."
 ALG_bouteflika: "Новости о кризисе в сфере здравоохранения в Бутефлике"
 ALG_bouteflika.2.t: "Президентские выборы в Алжире 2014 года"
 ALG_bouteflika.2.d: "17 апреля 2014 года в Алжире состоялись президентские выборы. Действующий президент Абдельазиз Бутефлика был переизбран, получив 82% голосов. В ходе предвыборной кампании обсуждалась, в частности, необходимость обеспечения внутренней стабильности после кровопролитной гражданской войны 1990-х годов."
 ALG_bouteflika.2.a: "Бутефлика побеждает"
 ALG_bouteflika_health_crisis: "Кризис здравоохранения Бутефлики"
 ALG_bouteflika_health_crisis_desc: "Ухудшение здоровья президента угрожает дестабилизировать Алжир. Оставим ли мы его у власти или будем готовиться к переходному периоду?"
 ALG_2014_elections: "Президентские выборы 2014 года"
 ALG_2014_elections_desc: "Несмотря на болезнь, Бутефлика баллотируется на четвертый срок. Оппозиция замолкает, и результаты предрешены."
 ALG_2014_oil_crash: "Обвал цен на нефть"
 ALG_2014_oil_crash_desc: "Резкое падение цен на нефть наносит сокрушительный удар по экономике Алжира. Население обвиняет коррупцию и требует перемен."
 ALG_silence_hirak: "Подавление протестов Хирака"
 ALG_silence_hirak_desc: "Военные и полиция будут подавлять инакомыслие. Улицы окрасятся в красный цвет, но режим выживет."
 ALG_listen_to_hirak: "Уступить требованиям реформаторов"
 ALG_listen_to_hirak_desc: "Пообещайте политические реформы, чтобы успокоить протестующих. Старая гвардия будет сопротивляться, но гнев народа может утихнуть."
 ALG_2019_elections: "Политический кризис 2019 года"
 ALG_2019_elections_desc: "Попытка Бутефлики переизбраться на пятый срок вызывает всеобщее негодование по всей стране. Произойдет ли в Алжире революция или он подчинится тирании?"
 ALG_new_president: "Назначить нового президента"
 ALG_new_president_desc: "Движение «Хирак» одержало победу. Переходное правительство проведет свободные выборы, положив конец десятилетиям авторитарного правления."
 ALG_release_political_prisoners: "Освободите политических заключенных"
 ALG_release_political_prisoners_desc: "Тысячи активистов, журналистов и оппозиционных деятелей томятся под стражей за свою роль в протестах «Хирак». Их освобождение стало бы сигналом подлинного разрыва со старым режимом и укрепило бы демократическую легитимность."
 ALG_corrupt_successor: "Назначьте преемника-лоялиста."
 ALG_corrupt_successor_desc: "Военные обеспечивают приход к власти марионетки. Наследие коррупции Бутефлики продолжает жить."
 alg_oil_crash_title: "Обвал цен на нефть"
 alg_oil_crash_desc: "Цены на нефть рухнули, выживет ли наша страна?"
 alg_oil_crash_option: "Это вызывает беспокойство!"
 alg_hirak_victory_title: "Народ побеждает"
 alg_hirak_victory_desc: "После многолетних протестов Бутефлика уходит в отставку. Начинается новая эра, но сможет ли она продлиться долго?"
 alg_military_rule_title: "Генералы принимают решение"
 alg_military_rule_desc: "Армия назначает марионеточного лидера. Движение «Хирак» на данный момент подавлено."
 algeria_tebboune.1.t: "Президентские выборы 2019 года"
 algeria_tebboune.1.d: "После нескольких месяцев протестов и отставки Абдельазиза Бутефлики алжирцы отправляются на избирательные участки на самые спорные выборы за последние десятилетия. Многие считают, что в этом процессе доминирует старая гвардия, в то время как другие сохраняют надежду на реформы или даже на возрождение исламизма. В числе главных претендентов — три кандидата: Абдельмаджид Теббун, кандидат, представляющий преемственность и связанный с истеблишментом; Али Бенфлис, либеральный реформатор со своим собственным движением; и Абделькадер Бенгрина, исламистский лидер, связанный с Движением за мир. Этот выбор определит будущий путь Алжира."
 algeria_tebboune.1.a: "Избрать Абдельмаджида Теббуна"
 algeria_tebboune.1.b: "Избрать Али Бенфлиса"
 algeria_tebboune.1.c: "Избрать Абделькадера Бенгрину"
 ALG_benflis_tt: "§YАли Бенфлис§! становится президентом Алжира, возглавляя либеральных реформаторов."
 ALG_bengrina_tt: "§YАбделькадер Бенгрина§! становится президентом Алжира, представляя исламистскую оппозицию."
 kabyle_resistance_info: "В Кабилии неспокойно. Уровень сопротивления: [?385.resistance|%Y]"
 kabyle_resistance_effects: "Следите за ростом сепаратистских настроений в Кабилии. Текущее сопротивление: [?385.resistance|%Y]"
 ALG_kabyle_resistance_tooltip: "Уровень сопротивления в Кабилии:"
 ALG_suppress_kabyle: "Подавление кабильского движения"
 ALG_suppress_kabyle_desc: "Кабильские волнения представляют угрозу национальному суверенитету. Мы не можем допустить распространения сепаратистской риторики. Жесткие репрессии могут стать единственным способом восстановить контроль, даже если это означает столкновение с ожесточенным сопротивлением."
 ALG_recognize_kabyle: "Признать независимость Кабилии"
 ALG_recognize_kabyle_desc: "Десятилетия напряженности, протестов и беспорядков привели нас к этому моменту. Возможно, настало время признать стремление кабилов к независимости. Это положит конец текущим беспорядкам, но ценой нарушения территориальной целостности."
 ALG_recognize_tamazight: "Распознать тамазигт"
 ALG_recognize_tamazight_desc: "Признание тамазигта официальным языком является ключевым требованием кабильского населения. Это может узаконить их культурную самобытность и сохранить национальное единство."
 ALG_kabyle_cultural_reforms: "Кабильские культурные реформы"
 ALG_kabyle_cultural_reforms_desc: "Мы должны поддерживать образование, местные институты и культурные права в Кабильском регионе, чтобы способствовать интеграции и взаимному уважению."
 ALG_internal_troops_kabyle: "Развернуть внутренние войска"
 ALG_internal_troops_kabyle_desc: "Ситуация в Кабилии требует усиления мер безопасности. Мы задействуем внутренние войска для обеспечения безопасности региона и подавления беспорядков."
 ALG_disrupt_kabyle_networks: "Разрушить политические сети Кабиля"
 ALG_disrupt_kabyle_networks_desc: "Деятельность сепаратистов координируется через подпольные политические сети. Для обеспечения национальной безопасности необходимы пресечение их деятельности посредством слежки и арестов."
 KBY_build_a_new_state: "Создать новое государство"
 KBY_build_a_new_state_desc: "Став независимыми, мы должны заложить основы функционирующей республики. Конституция, государственное управление и социальные услуги являются главными приоритетами."
 KBY_secure_our_borders: "Обеспечьте безопасность наших границ"
 KBY_secure_our_borders_desc: "Провозгласив свой суверенитет, мы должны укрепить наши уязвимые границы и обеспечить наше выживание во враждебной среде."
 idea_ALG_neutrality: "Нейтралитет Алжира"
 idea_ALG_neutrality_desc: "Алжир больше не может позволить себе войну, нейтралитет — наш лучший вариант."
 idea_ALG_neutrality_2: "Нейтралитет Алжира"
 idea_ALG_neutrality_2_desc: ""
 ALG_a_globalized_algeria: "Глобализированный Алжир"
 ALG_a_globalized_algeria_desc: "Сегодня мы живем в эпоху глобализации, в которой Алжир должен принимать участие."
 ALG_international_investments: "Международные инвестиции"
 ALG_international_investments_desc: ""
 ALG_export_driven_growth: "Рост, обусловленный экспортом"
 ALG_export_driven_growth_desc: ""
 ALG_promote_sovereignty: "Содействовать суверенитету"
 ALG_promote_sovereignty_desc: ""
 ALG_promote_human_rights: "Содействовать защите прав человека"
 ALG_promote_human_rights_desc: "Права человека превыше всего, даже если речь идёт о национальном суверенитете."
 ALG_extract_favorable_terms: "Выписать выгодные условия"
 ALG_extract_favorable_terms_desc: ""
 ALG_a_norm_entrepreneur: "Нормальный предприниматель"
 ALG_a_norm_entrepreneur_desc: ""
 ALG_Algeria_resplendent: "Алжир блистательный"
 ALG_Algeria_resplendent_desc: ""
 ALG_national_strength: "Национальная сила"
 ALG_national_strength_desc: ""
 ALG_terror_2003_hostage_title: "Кризис с заложниками в Сахаре"
 ALG_terror_2003_hostage_desc: "Группа европейских туристов была взята в заложники в алжирской пустыне исламистскими боевиками. Хотя о жертвах не сообщается, это знаменует начало тревожного роста организованной джихадистской деятельности."
 ALG_terror_2003_hostage_option: "Тревожный знак грядущих событий."
 ALG_terror_monitor: "Мониторинг террористической угрозы"
 ALG_conduct_security_raids: "Проведение рейдов по обеспечению безопасности"
 ALG_terror_threat_category: "Монитор угроз терроризма"
 ALG_terror_2007_algiers_title: "Бомбардировки Алжира"
 ALG_terror_2007_algiers_desc: "В Алжире в результате мощного теракта, совершенного смертником, пострадал правительственный дворец. Более 30 мирных жителей и сотрудников правительства погибли в результате одного из самых смертоносных нападений за последние годы."
 ALG_terror_2007_batna_title: "Теракт в Батне"
 ALG_terror_2007_batna_desc: "Террорист-смертник привел в действие взрывное устройство возле толпы, ожидавшей встречи с президентом в Батне. В результате нападения погибло более 20 человек."
 ALG_terror_2008_issers_title: "Взрыв в полицейской академии Иссерса"
 ALG_terror_2008_issers_desc: "В результате атаки смертника, использовавшего автомобиль для перемещения среди новобранцев полиции в академии Иссерса, погибли 43 человека и десятки получили ранения."
 ALG_terror_generic_option: "Трагические новости."
 ALG_terror_2000_bus_ambush_title: "Засада на автобус возле Медеи"
 ALG_terror_2000_bus_ambush_desc: "Вооруженные боевики устроили смертельную засаду на пассажирский автобус недалеко от Медеи. Девятнадцать мирных жителей погибли. Это нападение свидетельствует о сохраняющейся нестабильности в послевоенный период."
 ALG_terror_2002_tazmalt_title: "Взрыв в Тазмальте"
 ALG_terror_2002_tazmalt_desc: "В Тазмальте взорвалась бомба, в результате чего погибли и получили ранения несколько мирных жителей. Силы безопасности подозревают, что в этом замешаны остатки GSPC (Государственной гражданской полиции)."
 ALG_terror_2002_miliana_title: "Взрыв в Милиане"
 ALG_terror_2002_miliana_desc: "Возле Милианы сработало самодельное взрывное устройство, установленное на обочине дороги, в результате чего несколько солдат получили ранения."
 ALG_terror_2002_hammam_title: "Взрыв в Хаммам-Риге"
 ALG_terror_2002_hammam_desc: "В Хаммаме, Ригха, взорвалось самодельное взрывное устройство, целью которого был военный конвой."
 ALG_terror_2002_larbaa_title: "Взрыв в Ларбаа"
 ALG_terror_2002_larbaa_desc: "Боевики взорвали бомбу в Ларбаа, продолжая кампанию против государственных властей."
 ALG_terror_2002_msila_title: "Теракт М'Сила"
 ALG_terror_2002_msila_desc: "В Мсиле взорвалось самодельное взрывное устройство, что еще раз продемонстрировало устойчивость террористических сетей в регионе."
 ALG_terror_2003_tizi_title: "Взрыв в Тизи-Узу"
 ALG_terror_2003_tizi_desc: "В Тизи-Узу произошёл смертельный взрыв. Среди погибших есть мирные жители, и силы безопасности подозревают причастность GSPC (Государственной комиссии по безопасности)."
 ALG_terror_2004_tebessa_title: "Взрыв в Тебессе"
 ALG_terror_2004_tebessa_desc: "В результате скоординированного взрыва в Тебессе погибли 7 человек. Растущий масштаб терактов вызывает тревогу."
 ALG_idea_arab_diplomacy: "Арабская дипломатия"
 ALG_terror_2005_tidjelabine_title: "Взрыв в Тиджелабине"
 ALG_terror_2005_tidjelabine_desc: "В Тиджелабине в результате взрыва заминированного автомобиля, врезавшегося в их патруль, погибли два жандарма."
 ALG_relying_on_our_own_strength_spirit: "Полагаясь на собственные силы"
 ALG_relying_on_our_own_strength_spirit_desc: "Для процветания Алжиру нужны только алжирцы, больше никто."
 ALG_hydroelectric_power_plants_upgraded_idea: "§RSonatrach§! - Модернизация гидроэлектростанций"
 FLN_nationalize_resources: "Национализация ресурсов"
 FLN_nationalize_resources_desc: "Природные ресурсы Алжира являются ключом к его суверенитету и процветанию. Национализация наших ресурсов позволит нам обеспечить, чтобы богатства, полученные от нефти, газа и полезных ископаемых, приносили прямую пользу народу Алжира, заложив основу для долгосрочной экономической независимости."
 ALG_revivify_non_aligned_movement: "Возродить движение неприсоединения"
 ALG_revivify_non_aligned_movement_desc: "Как гордый член Движения неприсоединения, Алжир должен возродить этот блок независимых государств. Укрепляя связи с другими нейтральными государствами, мы можем противостоять господству сверхдержав и проложить путь к подлинному суверенитету в разделенном мире."
 ALG_reach_out_ASEAN: "Наладьте контакты с АСЕАН."
 ALG_reach_out_ASEAN_desc: "Страны Юго-Восточной Азии разделяют наше стремление к развитию, свободному от иностранного вмешательства. Установление более тесного сотрудничества с АСЕАН откроет новые экономические возможности и укрепит многополярный мировой порядок."
 ALG_support_developing_world: "Поддержите развивающиеся страны"
 ALG_support_developing_world_desc: "Алжир выражает солидарность с угнетенными и нищими странами. Посредством экономической помощи, технического обмена и дипломатической поддержки мы можем способствовать подъему стран Глобального Юга и противостоять неоколониальной эксплуатации."
 ALG_between_east_and_west: "Между Востоком и Западом"
 ALG_between_east_and_west_desc: "Оказавшись между враждующими блоками, Алжиру необходимо действовать осторожно. Поддерживая сбалансированные отношения как с капиталистическими, так и с социалистическими державами, мы сможем обеспечить приток жизненно важных инвестиций, не отказываясь при этом от своей независимости ни в пользу одного из лагерей."
 ALG_mediate_great_power_conflict: "Посредничество в конфликтах между великими державами"
 ALG_mediate_great_power_conflict_desc: "В условиях нарастающей напряженности между сверхдержавами Алжир может выступать в качестве честного посредника. Наш нейтралитет и моральный авторитет позволяют нам деэскалировать кризисы и способствовать мирному сосуществованию во все более нестабильном мире."
 ALG_promote_reconciliation: "Содействовать примирению"
 ALG_promote_reconciliation_desc: "От Африки до Ближнего Востока бушуют конфликты между братьями. Алжир, обладающий революционным наследием и дипломатическим опытом, должен способствовать диалогу и единству между разделёнными народами."
 ALG_secure_balance: "Надежный баланс"
 ALG_secure_balance_desc: "В мире, где конкурируют гегемонии, равновесие является нашей гарантией. Тщательно выстраивая нашу внешнюю политику, мы можем предотвратить доминирование какой-либо одной державы, извлекая при этом максимальную выгоду из всех."
 ALG_joining_brics: "Присоединяйтесь к БРИКС"
 ALG_joining_brics_desc: "Алжир стремится укрепить свое глобальное влияние, вступив в группу БРИКС, объединяющую развивающиеся экономики, что позволит расширить как экономический рост, так и политическое сотрудничество."
 ALG_align_with_brazil: "Укрепить связи с Бразилией"
 ALG_align_with_brazil_desc: "Бразилия, как и Алжир, стремится к независимому пути в мировых делах. Углубляя наше партнерство с этим южноамериканским гигантом, мы можем расширить торговлю сельскохозяйственной продукцией и технологиями, одновременно выступая единым фронтом против неоколониального давления на глобальных форумах."
 ALG_align_with_india: "Укрепить стратегическое партнерство с Индией"
 ALG_align_with_india_desc: "Неприсоединившаяся позиция Индии и растущая промышленная мощь делают ее естественным союзником. Сотрудничество в энергетических проектах, военных обменах и дипломатии ООН укрепит обе наши страны в противостоянии доминированию сверхдержав, а также будет способствовать сотрудничеству Юг-Юг."
 ALG_islamic_monarchy_idea: "Исламская монархия"
 ALG_islamic_monarchy_idea_desc: "В Алжире восстановлена божественная монархия, основанная на исламских принципах и национальных традициях."
 ALG_caliph_crowned: "Коронованный халиф"
 ALG_caliph_crowned_desc: "Халиф правит не только по закону, но и в соответствии с волей народа и наследием веры."
 ALG_amir_al_muminin_idea: "Амир аль-Муминин"
 ALG_amir_al_muminin_idea_desc: "«Повелитель правоверных» — титул, имеющий духовное и политическое значение во всем исламском мире."
 ALG_maghreb_alliance_idea: "Столпы Магриба"
 ALG_maghreb_alliance_idea_desc: "Алжир возглавляет усилия по объединению западного исламского мира под новым религиозным и политическим порядком."
 ALG_restore_caliphate_in_algiers: "Восстановить халифат в Алжире"
 ALG_restore_caliphate_in_algiers_desc: "Республика потерпела крах. Пришло время восстановить божественную монархию, основанную на вере и истории. Из Алжира восстанет новый халифат."
 ALG_crown_the_caliph: "Короновать халифа"
 ALG_crown_the_caliph_desc: "Законный наследник халифата избран. На церемонии в Алжире корона будет восстановлена, и мир признает нового Амира аль-Муминина."
 ALG_amir_al_muminin: "Амир аль-Муминин"
 ALG_amir_al_muminin_desc: "Мы провозглашаем халифа Амиром аль-Муминином, Повелителем правоверных. Этот титул дарует ему духовную и политическую легитимность во всем исламском мире."
 ALG_umayyad_legacy: "Провозгласить наследие Омейядов"
 ALG_umayyad_legacy_desc: "Алжир возрождает память об Омейядах, чья слава некогда простиралась на многие континенты. Мы позиционируем себя как наследники их наследия."
 ALG_reclaim_al_andalus: "Возродить Аль-Андалус"
 ALG_reclaim_al_andalus_desc: "Земли Аль-Андалуса когда-то были жемчужиной исламского мира. Пришло время вернуть их и возродить нашу древнюю цивилизацию на Пиренейском полуострове."
 ALG_reclaim_the_crown: "Верните корону"
 ALG_reclaim_the_crown_desc: "Пришло время восстановить законную, божественно управляемую монархию, основанную на исламской легитимности. В пепле республиканского краха и гражданской войны мы возродим историческую корону, объединив нацию под королевским знаменем веры, порядка и наследия. Будь то преемник Аббасидов, возрожденная берберская династия или символ нового исламского единства, корона вновь воссияет над Алжиром."
 ALG_pillars_of_the_maghreb: "Столпы Магриба"
 ALG_pillars_of_the_maghreb_desc: "Алжир стремится к единству со своими западными братьями, Марокко и Тунисом, чтобы заложить основу для единого исламского блока в Северной Африке."
 ALG_monarchy_tt: "§OКак новый монарх Алжира, мы собираем джизью и закят с верующих. По воле Аллаха, мы продолжим наше правление.§!"
 ALG_recovering_from_the_civil_war: "Чёрное десятилетие"
 ALG_recovering_from_the_civil_war_desc: "Гражданская война в Алжире оставила глубокие шрамы на стране. Хотя конфликт закончился, его последствия ощущаются до сих пор, влияя на политическую обстановку и национальную психику. Спустя годы после гражданской войны Алжир все еще борется со своими последствиями. Раны конфликта еще не зажили полностью, но страна полна решимости восстановиться."
 MSP_non_aligned_revival: "Возродить внеблоковую внешнюю политику"
 MSP_non_aligned_revival_desc: "Мы возродим дух нейтралитета и солидарности с югом, как это было в 1960-х годах."
 MSP_global_south_solidarity: "Солидарность глобального Юга"
 MSP_global_south_solidarity_desc: "Алжир будет укреплять связи с постколониальными странами посредством торговли, дипломатии и помощи."
 MSP_north_africa_first: "Сначала северная Африка"
 MSP_north_africa_first_desc: "Мы сосредоточимся на ведущей дипломатии и развитии в нашем регионе."
 MSP_western_sahara_position: "Поддержите Западную Сахару"
 MSP_western_sahara_position_desc: "Мы подтверждаем свою поддержку независимости Сахары, несмотря на претензии Марокко."
 MSP_african_union_engagement: "Вступите в Африканский союз"
 MSP_african_union_engagement_desc: "Алжир должен вновь присоединиться к континентальной дипломатии и занять в ней ведущую роль."
 MSP_sahel_initiatives: "Расширить свое присутствие в Сахеле"
 MSP_sahel_initiatives_desc: "Мы будем бороться с нестабильностью и терроризмом в Сахеле с помощью мягкой силы и обороны."
 MSP_arab_world_outreach: "Укрепление арабских дипломатических связей"
 MSP_arab_world_outreach_desc: "Для усиления влияния Алжира в арабском мире нам необходимо активизировать дипломатические контакты и координационные усилия. Посредством двусторонних визитов, саммитов и торговых инициатив Алжир может утвердиться в качестве объединяющей силы в регионе."
 MSP_join_arab_league: "Укрепить взаимодействие с Лигой арабских государств"
 MSP_join_arab_league_desc: "Будучи действующим членом Лиги арабских государств, Алжир может выйти за рамки простого участия и занять ведущую дипломатическую роль. Содействие экономической координации, консультациям в области обороны и культурной солидарности укрепит наш авторитет в арабском мире."
 MSP_support_palestine: "Поддержите палестинское дело!"
 MSP_support_palestine_desc: "Алжир давно поддерживает борьбу палестинцев за самоопределение. Возобновление дипломатической поддержки, гуманитарной помощи и международной защиты подтвердит нашу принципиальную позицию в отстаивании прав палестинцев."
 MSP_algeria_algiers_axis: "Сформировать ось Египет-Алжир"
 MSP_algeria_algiers_axis_desc: "Более тесно сотрудничая с Египтом, Алжир может помочь сформировать мощный региональный блок, способный направлять арабское единство, обеспечивать стабильность в Северной Африке и уравновешивать иностранное влияние."
 MSP_condemn_israel: "Осудить действия Израиля"
 MSP_condemn_israel_desc: "В свете продолжающейся агрессии и нарушений прав человека Алжир официально осудит действия Израиля на международной арене, заручившись поддержкой справедливого мира и выступив против нормализации отношений без урегулирования конфликта."
 MSP_palestinian_aid_package: "Пакет помощи Палестине"
 MSP_palestinian_aid_package_desc: "Мы выделим ресурсы для оказания гуманитарной, экономической и технической помощи палестинским территориям, гарантируя, что обязательства Алжира не ограничатся словами и превратятся в реальную, действенную помощь."
 MSP_pan_african_defense_initiative: "Панафриканская оборонная инициатива"
 MSP_pan_african_defense_initiative_desc: "Для защиты суверенитета Африки и укрепления стабильности на континенте Алжир предложит скоординированную африканскую оборонную инициативу, направленную на повышение коллективной военной готовности к противодействию общим угрозам."
 MSP_send_troops_to_sahel: "Перебросить войска в Сахель"
 MSP_send_troops_to_sahel_desc: "В ответ на растущую нестабильность в Сахеле Алжир направит войска для поддержки миротворческих операций, охраны границ и антитеррористических кампаний в сотрудничестве с региональными правительствами."
 MSP_sahel_stabilization_force: "Силы стабилизации Сахеля"
 MSP_sahel_stabilization_force_desc: "Алжир возьмет на себя ведущую роль в создании постоянных Сил стабилизации в Сахеле — возглавляемой африканцами структуры безопасности для противодействия повстанческим движениям и криминальным сетям в регионе."
 MSP_exploit_sahel_resources: "Эксплуатация ресурсов Сахеля"
 MSP_exploit_sahel_resources_desc: "Влияние Алжира в Сахеле открывает доступ к неиспользованным природным ресурсам. Заключая контракты на добычу полезных ископаемых и развитие инфраструктуры, мы можем обеспечить экономические выгоды и стратегическое партнерство в регионе."
 MSP_propose_maghreb_union: "Предложить создание Союза Магриба"
 MSP_propose_maghreb_union_desc: "Пришло время возродить идею единого Магриба. Алжир возьмет на себя инициативу по предложению новых интеграционных мер, сосредоточив внимание на экономическом сотрудничестве, совместной инфраструктуре и дипломатическом взаимодействии."
 MSP_economic_integration_initiative: "Экономическая интеграция Магриба"
 MSP_economic_integration_initiative_desc: "За счет снижения тарифов, инвестиций в инфраструктуру и согласованных обсуждений денежно-кредитной политики Алжир будет способствовать созданию общей экономической зоны Магриба, которая принесет пользу всем государствам-членам."
 MSP_maghreb_joint_defense_pact: "Совместный оборонный пакт Магриба"
 MSP_maghreb_joint_defense_pact_desc: "Для обеспечения безопасности Магриба необходима коллективная оборона. Мы предложим региональный военный пакт, ориентированный на защиту границ, обмен разведывательной информацией и совместные военные учения."
 MSP_mediterranean_dialogue: "Средиземноморский диалог"
 MSP_invite_iraq: "Пригласить Ирак"
 MSP_invite_iraq_desc: "Нам необходимо пригласить Ирак в наш альянс, поскольку он постепенно начинает налаживать отношения, и мы бы извлекли огромную пользу из взаимного сотрудничества."
 MSP_invite_syria: "Пригласить Сирию"
 MSP_invite_syria_desc: "Наличие Сирии к югу от нашей страны делает нас очень уязвимыми. Привлечение Сирии в нашу группировку стало бы отличным способом гарантировать нашу безопасность."
 MSP_invite_algeria: "Пригласить Египет"
 MSP_invite_algeria_desc: "Египет — восходящая держава, и с таким населением наш альянс сможет достичь практически чего угодно."
 MSP_assistance_to_bulgaria: "Помощь Болгарии"
 MSP_assistance_to_bulgaria_desc: "Мы должны помочь Болгарии в развитии ее инфраструктуры, чтобы мы могли без труда осуществлять больше инвестиций за пределами ее границ."
 MSP_supp_plo: "Поддержите ООП"
 MSP_supp_plo_desc: "Организация освобождения Палестины (ООП) уже давно играет ключевую роль в борьбе за самоопределение палестинцев. Поддержка ООП могла бы укрепить наши позиции среди международных союзников и способствовать мирному урегулированию конфликта."
 MSP_the_pal_issue: "Палестинский вопрос"
 MSP_the_pal_issue_desc: "Палестинский вопрос остается ключевым в нашей внешней политике. Наша позиция по палестинской борьбе определит наши международные союзы и влияние в регионе. Мы должны решить, как урегулировать этот продолжающийся конфликт."
 MSP_supp_hamas: "Поддержите ХАМАС"
 MSP_supp_hamas_desc: "ХАМАС представляет собой значительную фракцию в палестинском сопротивлении. Оказывая поддержку, мы можем укрепить наши связи с этой группировкой, усилить наше влияние в регионе и присоединиться к их борьбе."
 MSP_Get_rid_of_military_corrupt: "Очистить армию от коррупции"
 MSP_Get_rid_of_military_corrupt_desc: "Военные прочно укоренились в наших институтах и представляют собой явную угрозу будущему нашей страны. Мы арестуем их по обвинениям в коррупции и конфискуем всё имущество, которое сможем завладеть."
 MSP_reverse_secularization: "Обратная секуляризация"
 MSP_arm_palestinians_to_fight: "Вооружить палестинцев"
 MSP_arm_palestinians_to_fight_desc: "В Иордании проживает большое количество палестинских беженцев. Мы можем превратить этих беженцев в боевиков и подстрекать их к сеянию хаоса в Палестине и Израиле. Поскольку они являются марионеточными боевиками, мы можем использовать их для подстрекательства Израиля к ответным действиям, выставляя его в роли злодея в конфликте."
 MSP_zionist_threat: "Сионистская угроза"
 MSP_zionist_threat_desc: "Израиль — это величайшее оскорбление всех мусульман и отвратительное лжегосударство в самом сердце ислама. Его нужно стереть с лица земли."
 ALG_kabyle_issue: "Кабильский вопрос"
 ALG_kabyle_issue_map: "Удовлетворенность народа амазигов ([KBY.GetFlag]) нашим правительством!"
 ALG_2014_oil_crash_idea: "Нефтяной обвал"
 ALG_algeria_resplendent: "Алжир блистательный"
 ALG_algeria_resplendent_desc: ""
 KBY_new_state_born: "Рождение нового государства"
 KBY_new_state_born_desc: "Кабилия возродилась как суверенное государство. Первые дни нашей независимости должны быть отмечены укреплением, празднованием и осторожностью."
 KBY_border_readiness: "Готовность к пересечению границы"
 KBY_border_readiness_desc: "Мы должны обеспечить безопасность периметра нашей родины, чтобы предотвратить проникновение, контрабанду или вторжения."
 KBY_new_institutions: "Новые институты"
 KBY_new_institutions_desc: "Функционирующее государство должно опираться на фундамент, заслуживающий доверия и стабильный институт."
 KBY_state_economy_plan: "Государственный экономический план"
 KBY_state_economy_plan_desc: "Нам необходимо определить структуру нашей экономики, будь то централизованная, рыночная или смешанная."
 KBY_african_diplomacy: "Африканская дипломатия"
 KBY_african_diplomacy_desc: "Стремление к региональной легитимности среди африканских соседей укрепит наш авторитет и расширит экономические возможности."
 KBY_international_recognition_campaign: "Международная кампания по признанию"
 KBY_international_recognition_campaign_desc: "Наше выживание зависит от легитимности в глазах других наций. Начните целенаправленный дипломатический нажим."
 KBY_international_recognition_campaign_completion: "Дипломатические каналы открыты, теперь начинается кропотливая работа по убеждению."
 KBY_establish_governance_structures: "Создание структур управления"
 KBY_establish_governance_structures_desc: "Необходимо создать институты, которые обеспечат сохранение наших принципов управления."
 KBY_establish_governance_structures_completion: "Государственные учреждения возобновили работу и готовы оказывать услуги нашим гражданам."
 KBY_plan_the_economy: "Планирование экономики"
 KBY_plan_the_economy_desc: "Определите наше экономическое будущее: государственное, либеральное или смешанное. Каждый путь предлагает свои уникальные компромиссы."
 KBY_plan_the_economy_completion: "Ведется экономическое планирование, делайте мудрый выбор для обеспечения долгосрочного процветания."
 KBY_seek_regional_support: "Обратитесь за региональной поддержкой."
 KBY_seek_regional_support_desc: "Поддержка со стороны наших соседей и африканского сообщества укрепит нашу легитимность."
 KBY_seek_regional_support_completion: "Были развернуты региональные информационные кампании, в настоящее время ожидается ответ."
 KBY_secure_internal_stability: "Надежная внутренняя стабильность"
 KBY_secure_internal_stability_desc: "Взяв под контроль внешние угрозы, мы должны подавить внутреннее несогласие и сопротивление."
 KBY_secure_internal_stability_completion: "Введены протоколы безопасности, общественный порядок улучшился."
 KBY.10.t: "Установление международных отношений"
 KBY.10.d: "Теперь, когда наша независимость признана международным сообществом, настало время для Кабилии установить официальные дипломатические отношения с другими странами. Наши дипломаты готовы обратиться к потенциальным партнерам, начиная с Франции, учитывая наши исторические связи, и Турции, которая проявила интерес к делу амазигов.\n\nЭтот дипломатический шаг поможет легитимизировать наше молодое государство и откроет двери для будущего сотрудничества."
 KBY.10.a: "Мы будем обращаться ко всем странам!"
 KBY.15.t: "Стремясь к африканскому единству"
 KBY.15.d: "Наша инициатива в области африканской дипломатии заложила основу для более глубокой интеграции с континентом. Африканский союз представляет собой важную площадку для нашей страны, членство в нем обеспечит легитимность, экономические возможности и платформу для защиты прав амазигов по всей Северной Африке.\n\nНигер, с его значительным туарегским населением, выразил поддержку нашей заявке."
 KBY.15.a: "Подайте заявку в Африканский Союз."
 KBY_diplomatic_move: "Кабилийский дипломатический рывок"
 KBY_au_membership_attempt: "Попытка членства в Кабилианской AU"
 KBY_state_economy_model_statist: "Государственная экономика"
 KBY_state_economy_model_liberal: "Либеральная рыночная экономика"
 KBY_state_economy_model_mixed: "Смешанная экономическая модель"
 ALG_recover_from_the_war: "Восстановление после Гражданской войны"
 ALG_restoring_order: "Восстановление порядка"
 ALG_restoring_order_desc: "Первоочередная задача — восстановление государственной власти и прекращение хаоса, продолжающегося в некоторых регионах. Население жаждет мира и порядка после многих лет разрушений."
 ALG_secure_weapons_shipments: "Обеспечение безопасности поставок оружия"
 ALG_secure_weapons_shipments_desc: "Обеспечение надлежащего снабжения нашей армии позволит нам поддерживать внутренний порядок и предотвратить возобновление повстанческих движений."
 ALG_recover_from_the_war_desc: "Теперь мы должны начать долгий процесс восстановления нашей страны. «Черное десятилетие» оставило глубокий след в Алжире, но, проявив решимость, мы сможем восстать из пепла."
 ALG_restoring_the_broken_economy: "Возродить национальную экономику"
 ALG_restoring_the_broken_economy_desc: "Гражданская война парализовала наши финансовые институты. Мы должны принять чрезвычайные меры для стабилизации экономики."
 ALG_arresting_extremists: "Нейтрализация вооруженных угроз"
 ALG_arresting_extremists_desc: "Экстремистские группировки по-прежнему действуют в отдаленных районах. Возобновление кампании по обеспечению безопасности восстановит полный национальный контроль."
 ALG_economic_recovery: "Экономическое восстановление"
 ALG_economic_recovery_desc: "Наша политика начинает приносить результаты. Сейчас мы вступаем в фазу постепенного восстановления и укрепления доверия."
 ALG_regain_banks: "Восстановить доверие к банковскому сектору"
 ALG_regain_banks_desc: "Оживление банковского сектора имеет решающее значение для восстановления доверия инвесторов и возобновления внутреннего кредитования."
 ALG_financial_reform: "Реформировать финансовую систему"
 ALG_financial_reform_desc: "Модернизация финансовой системы Алжира будет способствовать устойчивому росту и позволит нам избежать будущих потрясений."
 ALG_begin_full_recovery: "Начать полное восстановление экономики"
 ALG_begin_full_recovery_desc: "Теперь, когда безопасность обеспечена, а экономика стабилизирована, мы можем начать полное экономическое возрождение по всей стране."
 ALG_repairing_the_roads: "Ремонтировать инфраструктуру"
 ALG_repairing_the_roads_desc: "Дороги, мосты и линии связи разрушены. Восстановление нашей логистической сети имеет важное значение для национальной сплоченности."
 ALG_rebuild_north: "Восстановите Кабилию и Алжир"
 ALG_rebuild_north_desc: "Эти городские центры пострадали больше всего. Приоритетное внимание должно быть уделено восстановлению основных служб в Кабилии и Алжире."
 ALG_rebuild_centre: "Восстановите Высокогорье"
 ALG_rebuild_centre_desc: "Центральное нагорье было одновременно полем битвы и гуманитарным кризисом. Они нуждаются в целенаправленной реконструкции."
 ALG_rebuild_west: "Перестроить Запад"
 ALG_rebuild_west_desc: "Инфраструктурой на Западе пренебрегали еще до войны. Пришло время объединить эти отдаленные регионы."
 ALG_rebuild_algeria: "Восстановить Алжир"
 ALG_rebuild_algeria_desc: "Пришло время восстановить нашу нацию и снова стать великой державой, эта гражданская война нанесла слишком много ран, теперь пришло время залечивать"
 ALG_rebuild_south: "Восстановите Юг"
 ALG_rebuild_south_desc: "Инфраструктура на юге была заброшена еще до войны. Пришло время объединить эти отдаленные регионы."
 ALG_order_restored_in_algeria: "Порядок восстановлен в Алжире"
 ALG_order_restored_in_algeria_desc: "Впервые за десятилетия Алжир стабилен и един. Впереди долгий путь, но мир вернулся."
 ALG_state_and_imf_funding: "Государственное финансирование и финансирование МВФ"
 ALG_state_and_imf_funding_desc: "С помощью кредитов и иностранной помощи, особенно от МВФ, мы можем вдохнуть новую жизнь в нашу зашедшую в тупик экономику."
 ALG_restocking_factories: "Заводы по пополнению запасов"
 ALG_restocking_factories_desc: "Многие заводы были повреждены или опустошены. С новыми поставками мы сможем возобновить производство."
 ALG_rebuilding_factories: "Восстановление промышленных зон"
 ALG_rebuilding_factories_desc: "Несколько промышленных зон пришли в упадок. Их восстановление обеспечит рабочие места и производство материалов, необходимых для восстановления."
 ALG_export_controls: "Экспортный контроль и помощь федерации"
 ALG_export_controls_desc: "Для защиты стратегических товаров и обеспечения внутреннего развития мы введем временные экспортные ограничения, которые будут уравновешены внешней поддержкой."
 ALG_post_war_recovery: "Восстановление после гражданской войны"
 ALG_post_war_recovery_desc: "Алжир по-прежнему страдает от последствий жестокого гражданского конфликта 1990-х годов. Хотя мир был восстановлен, страна все еще страдает от нестабильности, недоиспользуемых заводов, перегруженной инфраструктуры и хрупкой политической системы."
 ALG_imf_funding_idea: "Экстренное финансирование МВФ"
 ALG_imf_funding_idea_desc: "Международный валютный фонд вмешался, чтобы обеспечить столь необходимую ликвидность и бюджетную поддержку. Хотя эти средства помогают стабилизировать экономику, их использование сопряжено с определенными условиями."
 ALG_export_controls_idea: "Экспортный контроль"
 ALG_export_controls_idea_desc: "В целях приоритетного восстановления внутреннего рынка правительство ввело экспортные ограничения на ключевые сырьевые материалы. Эта политика стабилизирует внутренние рынки, но может нанести ущерб международным торговым отношениям."
 ALG_anti_terror_sweeps: "Антитеррористические операции"
 ALG_anti_terror_sweeps_desc: "Силовые структуры проводят активные операции по ликвидации оставшихся экстремистских элементов. Хотя это и повышает национальную безопасность, необходимо соблюдать баланс, чтобы избежать подавления гражданских свобод."
 ALG_banking_confidence_restored: "Доверие к банковскому сектору восстановлено."
 ALG_banking_confidence_restored_desc: "После периода острого недоверия и стагнации банковский сектор восстановил некоторую стабильность, что позволило как гражданам, так и инвесторам возобновить взаимодействие с финансовой системой Алжира."
 ALG_structural_reform: "Структурные экономические реформы"
 ALG_structural_reform_desc: "В настоящее время проводятся комплексные реформы, направленные на модернизацию экономики Алжира. Эти изменения направлены на снижение инфляции, оптимизацию институтов и стимулирование долгосрочного роста."
 ALG_national_recovery_completed: "Национальное восстановление завершено"
 ALG_national_recovery_completed_desc: "Восстановив инфраструктуру, обеспечив безопасность и оживив экономику, Алжир, наконец, преодолел самую мрачную главу своей жизни. Начинается новая эра надежды и прогресса."
 ALG_mastering_atom: "Овладение атомом"
 ALG_missile_chi_TT: "Алжир модернизирует свои §Hядерные реакторы§!"
 CHI_rejected_ALG: " Предложение отклонено Китаем"
 ALG_technological_ties: "Технологические связи"
 ALG_continue_1991_program: "Продолжить ядерную программу 1991 года"
 ALG_continue_1991_program_desc: "Хотя наша ядерная программа была приостановлена в 1990-х годах, её основы остаются. Возобновив старые проекты, мы сможем обеспечить как энергетическую безопасность, так и большую независимость, хотя за этим, вероятно, последуют международные санкции."
 ALG_seek_china_help: "Обратиться за помощью к Китаю"
 ALG_seek_china_help_desc: "Китай уже давно проявляет готовность сотрудничать с Алжиром в области ядерных технологий. Возобновленное партнерство предоставит нам оборудование, опыт и обучение в обход западных ограничений."
 ALG_1983_deal: "Возродить сделку по ракетам 1983 года"
 ALG_1983_deal_desc: "Наше предыдущее сотрудничество с Китаем в 1983 году предоставило нам ракетные технологии и ограниченную ядерную помощь. Возрождение этой договоренности ускорило бы как наши гражданские, так и военные ядерные амбиции."
 ALG_missile_cooperation: "Расширять сотрудничество в области ракетной техники"
 ALG_missile_cooperation_desc: "Помимо реакторов и топлива, Китай также может предоставить нам ракетные системы, способные нести полезную ядерную нагрузку. Этот шаг, однако, привлечет серьезное внимание со стороны Запада."
 ALG_hoggar_nuclear_facility: "Построить комплекс Хоггар"
 ALG_hoggar_nuclear_facility_desc: "В глубине гор Хоггар можно построить защищенный от внешнего вмешательства ядерный объект. Он станет центральным элементом ядерной программы Алжира."
 ALG_the_search_for_uranium: "Поиск урана"
 ALG_the_search_for_uranium_desc: "Наши ученые убеждены, что в обширной пустыне Алжира скрываются крупные запасы урана. Обнаружение и добыча этих месторождений станут основой любого независимого ядерного проекта."
 ALG_dig_in_tamanrasset: "Копайте в Таманрассете"
 ALG_dig_in_tamanrasset_desc: "В пустынных равнинах Таманрассета скрываются значительные месторождения урана. Инвестируя в горнодобывающую инфраструктуру в этом регионе, Алжир сможет избавиться от зависимости от иностранных поставщиков."
 ALG_withdrawal_from_npt: "Выйти из Договора о нераспространении ядерного оружия"
 ALG_withdrawal_from_npt_desc: "Алжир больше не может допускать, чтобы его суверенитет был связан иностранными договорами. Выходя из Договора о нераспространении ядерного оружия, мы открыто заявляем о нашем намерении создавать ядерное оружие."
 ALG_wmds: "Оружие массового уничтожения"
 ALG_wmds_desc: "После завершения строительства объектов по обогащению урана и готовности ракет настало время окончательно сформировать ядерный потенциал Алжира. Мир обратит на это внимание, и наши враги дважды подумают, прежде чем угрожать нам."
 ALG_algiers_agreement: "Алжирское соглашение"
 ALG_algiers_agreement_desc: "Вместо того чтобы стремиться к ядерному вооружению, Алжир может представить себя защитником мира. Алжирское соглашение послужит залогом сдержанности, открывая двери для иностранных инвестиций и международной легитимности."
 ALG_sign_BWC: "Подпишите Конвенцию о биологическом оружии"
 ALG_sign_BWC_desc: "Присоединившись к международным соглашениям против оружия массового уничтожения, мы демонстрируем приверженность Алжира миру. Это успокоит иностранных инвесторов и уменьшит подозрения в отношении нашей ядерной деятельности."
 ALG_build_nuclear_reactor: "Построить ядерный реактор"
 ALG_build_nuclear_reactor_desc: "Наша ядерная программа готова сделать следующий шаг. Построив полномасштабный реактор, Алжир получит как мощный источник энергии, так и прикрытие для дальнейшей деятельности по обогащению урана. Хотя мир может видеть в этом мирные намерения, реальность может быть гораздо сложнее."
 ALG_IAEA_safeguards_leave: "Меры защиты МАГАТЭ завершены"
 ALG_IAEA_safeguards_leave_desc: "После многих лет контроля и соблюдения требований Алжир полностью выполнил свои обязательства в рамках Алжирского соглашения и Конвенции о биологическом оружии. С уходом последних инспекторов МАГАТЭ с нашей территории санкции сняты, и наша страна признана ответственной региональной державой."
 sanctioned_algeria: "Санкции"
 ALG_hoggar_nuclear_facility_idea: "Атомная электростанция Хоггар"
 ALG_algeria_behave_TT: "[USA.GetFlag] §HСоединенные Штаты§! скорее всего §Gотменят§! экономические санкции"
 nuclear_algeria.1.t: "Потенциальный поставщик?"
 nuclear_algeria.1.d: "В стремлении к приобретению ядерных технологий мы должны смириться с тем фактом, что нам просто не хватает уровня развития, необходимого для производства адекватного оружия или создания соответствующих объектов. Поэтому мы должны обратиться за помощью к внешнему миру, и наши источники сообщают, что мы можем обратиться за помощью к одной конкретной стране."
 nuclear_algeria.1.a: "Свяжитесь с китайцами"
 nuclear_algeria.2.t: "Алжир просит о помощи"
 nuclear_algeria.2.d: "Недавно алжирские ученые и дипломаты встретились с нашими коллегами, обратившись за помощью в развитии своей ядерной программы. Они заявили, что готовы принять любую помощь, которую мы им предоставим, если она поможет им в развитии их ядерной программы."
 nuclear_algeria.2.a: "Хорошо"
 nuclear_algeria.2.b: "Мы не можем делиться своими секретами."
 nuclear_algeria.3.t: "Китай делится ракетными технологиями"
 nuclear_algeria.3.d: "Недавно китайские ученые встретились с нашими коллегами в [ALG.capital.GetCapitalVictoryPointName] и предоставили нам чертежи перспективных межконтинентальных баллистических ракет, которыми мы в настоящее время не располагаем."
 nuclear_algeria.3.a: "Большой!"
 nuclear_algeria.4.t: "Китай предоставляет ядерные технологии."
 nuclear_algeria.4.d: "Недавно китайские учёные встретились с нашими коллегами в [ALG.capital.GetCapitalVictoryPointName] и предоставили нам чертежи перспективных реакторов, которых у нас пока нет."
 nuclear_algeria.4.a: "Большой!"
 nuclear_algeria.5.t: "[FROM.GetName] отказывается оказывать помощь!"
 nuclear_algeria.5.d: "Мы допустили серьезную ошибку, обратившись к [FROM.GetName] за помощью в нашей ядерной программе, поскольку они отклонили наши запросы и пригрозили передать дело в международный суд, что потенциально может раскрыть нашу тайну."
 nuclear_algeria.5.a: "Упущенная возможность."
 nuclear_algeria.6.t: "Алжир хочет купить ракеты"
 nuclear_algeria.6.d: "Правительство Алжира обратилось к нам с просьбой продать им серию баллистических ракет. Оно заявило, что будет использовать эти ракеты для защиты своих национальных границ и не будет применять их в каких-либо наступательных военных действиях."
 nuclear_algeria.6.a: "Хорошо, завершите сделку"
 nuclear_algeria.6.b: "НЕТ"
 nuclear_algeria.7.t: "Китай продает свои ракеты"
 nuclear_algeria.7.d: "Китай продал нам около 400 баллистических ракет. Хотя некоторые из них, возможно, устарели, они всё ещё работоспособны, а это самое главное."
 nuclear_algeria.7.a: "Большой"
 nuclear_algeria.8.t: "Китай отказывается продавать ракеты"
 nuclear_algeria.8.d: "Правительство Китая отклонило нашу просьбу о закупке ракет, сославшись на то, что они необходимы ему для собственных военных операций."
 nuclear_algeria.8.a: "Хорошо"
 nuclear_algeria.19.t: "Международные санкции"
 nuclear_algeria.19.d: "Похоже, мир решил обернуться против нас и ввел санкции против нашей экономики, что неизбежно приведет к ее остановке. Нам придется пересмотреть нашу политику."
 nuclear_algeria.19.a: "Чего же нам следовало ожидать от мира предателей?"
 nuclear_algeria.25.t: "Соединенные Штаты усиливают экономическое давление"
 nuclear_algeria.25.d: "Соединенные Штаты решили реализовать свои империалистические планы путем усиления экономических санкций против нашего народа."
 nuclear_algeria.25.a: "Мы окажем сопротивление!"
 nuclear_algeria.26.t: "Соединенные Штаты снижают экономическое давление"
 nuclear_algeria.26.d: "Соединенные Штаты решили уменьшить количество санкций, введенных против нашего народа. Будут ли они придерживаться этой позиции, покажет время."
 nuclear_algeria.26.a: "Хороший"
 nuclear_algeria.28.t: "Алжир следует указаниям"
 nuclear_algeria.28.d: "В полном развороте на 180 градусов по сравнению с типичной алжирской политикой, они, похоже, движутся в более мирном и контролируемом направлении."
 nuclear_algeria.28.a: "Хорошо, возможно, теперь мы сможем ослабить санкции."
 algerian_focus.171.t: "Атомная электростанция Эс-Салам"
 algerian_focus.171.d: "Недостроенная американцами часть атомной электростанции в Эс-Саламе простаивает уже несколько десятилетий. С прибытием нескольких китайских ученых китайской компании было предложено завершить строительство оставшейся части электростанции."
 algerian_focus.171.a: "Принять предложение"
 algerian_focus.171.b: "Нет, спасибо"
 ALG_sanctioned: "Санкционированный"
 ALG_nuclear_known: "Разоблачение ядерной программы"
 ALG_emergency_budget: "Экстренный бюджет"
 support_brics: "Поддержите БРИКС"
 algeria_msp: "Фокус на MSP"
 algeria_democratic: "Фокус на исследованиях и разработках"
 algeria_nationalist: "Фокус на ПНА"
 monitor_kabyle_unrest: "Следите за беспорядками в Кабилии ([KBY.GetFlag])."
 ALG_us_sanctions: "Санкции США"
 ALG_us_sanctions_desc: "Соединенные Штаты ввели ряд санкций, которые ограничивают наши возможности взаимодействия с внешним миром. Хотя они и не являются критическими, они в определенной степени препятствуют достижению нами экономического успеха.\n§W--------------§!\nСоединенные Штаты обладают возможностью усиливать или ослаблять санкции против своего правительства в зависимости от своих действий.\n§W--------------§!\nЭтот национальный дух будет §RУдаленный§! если Соединенные Штаты считают, что мы больше не стремимся к обладанию ядерным оружием."
 ALG_imf_loan_taken: "Взял кредиты у МВФ."
 ALG_repression_modifier: "Репрессии"
 ALG_surveillance_state_modifier: "Государство тотальной слежки"
 ALG_national_dialogue_modifier: "Национальный диалог"
 ALG_boteflika: "Кризис здравоохранения у президента Алжира"
 idea_alg_empowered_parliament: "Уполномоченный парламент"
 algeria_sahar.1.t: "Помощь из Алжира"
 algeria_sahar.1.d: "Мы получили предложение от Алжира, они готовы оказать нам военную помощь и содействие в подготовке к возобновлению боевых действий в обмен на участие в процессе создания ОАР. Стоит ли нам принять поддержку Алжира?"
 algeria_sahar.1.a: "Мы должны это принять!"
 algeria_sahar.1.b: "Мы ни за что не станем их марионетками!"
 algeria_sahar.2.t: "Мирное соглашение"
 algeria_sahar.2.d: "Мы не смогли сдержать повстанцев, они захватили всю Западную Сахару. Стоит ли нам предложить повстанцам мирный договор и сдать территорию?"
 algeria_sahar.2.a: "Отправьте им предложение"
 algeria_sahar.2.b: "Мы должны их разгромить!"
 algeria_sahar.3.t: "Предложение из Марокко"
 algeria_sahar.3.d: "Марокко прислало нам предложение о заключении мирного договора, это заявление можно считать полноценным актом капитуляции! Мы можем принять капитуляцию или выступить широким фронтом за освобождение народов Северного Магриба!"
 algeria_sahar.3.a: "Мы победили!"
 algeria_sahar.3.b: "Вперёд, к Народной Федерации!"
 algeria_sahar.4.t: "Война выиграна."
 algeria_sahar.4.d: "Наши силы одержали победу. Конфликт в Западной Сахаре окончен, и мы свободны перестраивать политический порядок в регионе по своему усмотрению."
 algeria_sahar.4.a: "Создать Сахарскую Федерацию."
 algeria_sahar.5.t: "Наконец-то мир."
 algeria_sahar.5.d: "Мы подписали мирный договор с Сарауи, и война окончена."
 algeria_sahar.5.a: "Самые мрачные времена в нашей жизни..."
 algeria_sahar.6.t: "Они отказались!"
 algeria_sahar.6.d: "Сарауи отверг наш мирный договор! Война продолжается!"
 algeria_sahar.6.a: "Подтверждено."
 algeria_sahar.7.t: "Сарауи соглашается!"
 algeria_sahar.7.d: "Сарауи принимает наше предложение."
 algeria_sahar.7.a: "Вперед, в УАР!"
 algeria_sahar.8.t: "Они отказались!"
 algeria_sahar.8.d: "Сарауи отклонил наше предложение."
 algeria_sahar.8.a: "Какая жалость."
 TT_ALG_DEAL_WITH_TRADE_UNIONS: "Мы укрепим доверие к профсоюзам, когда они станут нашей внутренней фракцией."
 ALG_oil_price_collapse: "Обвал цен на нефть"
 ALG_oil_price_collapse_desc: "Резкое падение мировых цен на нефть серьезно сказалось на государственных доходах Алжира. Поскольку углеводороды остаются основой национальной экономики, этот обвал угрожает стабильности бюджета, валютным резервам и социальным расходам.\n\n§R- Доходы казначейства резко упали§!"
 alg_hirak_victory_option: "Движение «Хирак» одерживает победу."
 alg_hirak_victory_option_desc: "После многих лет протестов, мобилизации и сопротивления на низовом уровне движение «Хирак» наконец одержало победу. Сейчас ведутся демократические реформы, но государство остается хрупким, а переходный период — неопределенным.\n\n§G+ Легитимность реформаторов§!\n§Y- Влияние «глубинного государства»§!"
 alg_hirak_reforms_title: "Реформы, инициированные движением «Хирак»"
 alg_hirak_reforms_desc: "Под огромным давлением со стороны общественности правительство вынуждено проводить символические реформы."
 alg_hirak_reforms_option: "Объявить о политических реформах"
 alg_hirak_gains_influence_tt: "§YHirak§! приобретает всё большее влияние на политический баланс."
 alg_hirak_crackdown_title: "Жесткие меры по подавлению протестов «Хирак»"
 alg_hirak_crackdown_desc: "Режим предпочел репрессии реформам, натравив на протестующих силы безопасности."
 alg_hirak_crackdown_option: "Примените силу для восстановления порядка."
 alg_pouvoir_crackdown_tt: "§YLe Pouvoir§! обеспечивает высокую мощность за счет стабильности."
 alg_health_crisis_title: "Президентский кризис здоровья"
 alg_health_crisis_desc: "У президента Бутефлики возникли серьезные проблемы со здоровьем, что вновь вызвало опасения по поводу стареющего руководства и отсутствия прозрачности в алжирской политике. Хотя его ближайшее окружение настаивает на том, что он продолжит править, многие представители населения и элиты начинают сомневаться в легитимности его дальнейшего правления."
 alg_health_crisis_option_continue: "Подтвердить лидерство Бутефлики"
 alg_le_pouvoir_strengthens_tt: "§YLe Pouvoir§! укрепляет свою власть, поскольку ближайшее окружение президента защищает его от общественного внимания."
 maghreb_union_member: "§Y принял наше предложение о создании Союза Магриба. §!"
 has_power_balance_algeria: "Завершено проведение выборов в Алжире в 2014 году."
 supports_brics: "Поддержите БРИКС"
 ALG_eu_trade_agreements_desc: "Подписать торговое соглашение с ЕС для укрепления связей с Западом и развития нашей экономики."
 ALG_join_nato_partnership_desc: "Присоединяйтесь к партнерству НАТО, чтобы мы могли доминировать в Африканском регионе и превратить Алжир в страну первого мира."
 ALG_al_quwwat_al_jawwiya_al_jazaeriya: "ВВС Алжира"
 ALG_al_quwwat_al_jawwiya_al_jazaeriya_desc: "Военно-воздушные силы Алжира были одним из столпов нашей военной мощи с момента обретения независимости. Укрепление нашего воздушного потенциала за счет модернизации и приобретений обеспечит доминирование в небе Северной Африки."
 ALG_al_jaysh_al_watani_al_shaabi: "Народная национальная армия"
 ALG_al_jaysh_al_watani_al_shaabi_desc: "Народная национальная армия является основой обороны Алжира. Реформирование и оснащение сухопутных войск обеспечат безопасность нашей территории и поддержание стабильности перед лицом угроз."
 ALG_al_quwwat_al_bahriya_al_jazaeriya: "Алжирские военно-морские силы"
 ALG_al_quwwat_al_bahriya_al_jazaeriya_desc: "Военно-морские силы Алжира обеспечивают защиту нашего средиземноморского побережья и морских интересов. Расширение нашего флота и инфраструктуры позволит Алжиру проецировать свою силу и защищать жизненно важные морские пути."
 ALG_al_quwwat_al_musallaha_al_jazaeriya: "Вооруженные силы Алжира"
 ALG_al_quwwat_al_musallaha_al_jazaeriya_desc: "Алжирские вооруженные силы представляют собой объединенную мощь нашей армии, военно-воздушных сил и военно-морского флота. Как гарант национального суверенитета, они должны быть реструктурированы и модернизированы, чтобы соответствовать вызовам нового столетия."
 ALG_expand_the_EFCIP: "Расширить программу EFCIP"
 ALG_expand_the_EFCIP_desc: "Школа подготовки коммандос и парашютного спорта (EFCIP) в Богаре является краеугольным камнем подготовки спецназа Алжира с 1963 года. Расширяя свои мощности, модернизируя инфраструктуру и внедряя передовые боевые программы, мы еще больше повысим возможности наших коммандос и десантников. Эти инвестиции обеспечат Алжиру содержание одного из самых грозных корпусов специального назначения в Северной Африке."
 ALG_expand_conscription: "Расширить призыв на военную службу"
 ALG_expand_conscription_desc: "Расширение призыва на военную службу увеличивает наш резерв подготовленных солдат. Это обеспечивает достаточную численность личного состава для защиты страны и реагирования на угрозы."
 ALG_expand_military_infrastructure: "Расширение военной инфраструктуры"
 ALG_expand_military_infrastructure_desc: "Строительство новых баз, учебных центров и логистических узлов укрепляет наш военный потенциал. Улучшение инфраструктуры способствует повышению оперативной эффективности."
 ALG_focus_on_military_morale: "Внимание к моральному духу военнослужащих"
 ALG_focus_on_military_morale_desc: "Высокий моральный дух имеет решающее значение для боевой эффективности. Инвестиции в благополучие солдат, развитие лидерских качеств и укрепление боевого духа повышают боевой настрой."
 ALG_expand_artillery_units: "Расширить артиллерийские подразделения"
 ALG_expand_artillery_units_desc: "Артиллерия обеспечивает жизненно важную огневую мощь на поле боя. Увеличение численности артиллерийских подразделений повышает наступательные и оборонительные возможности нашей армии."
 ALG_an_army_of_the_masses: "Армия масс"
 ALG_an_army_of_the_masses_desc: "Большая, хорошо обученная армия способна сдерживать агрессию и защищать суверенитет. Создание массовой армии требует вложения средств в обучение и ресурсы."
 ALG_expand_the_escuela_de_condores: "Развернуть Эскуэлу Де Кондорес"
 ALG_expand_the_escuela_de_condores_desc: "Школа «Кондорес» готовит элитных алжирских солдат. Ее расширение позволит подготовить больше бойцов спецназа для решения сложных задач в области безопасности."
 ALG_form_specops_brigades: "Сформируйте бригады спецназа"
 ALG_form_specops_brigades_desc: "Бригады специального назначения выполняют миссии высокого риска, требующие высококвалифицированных навыков. Формирование таких подразделений повышает тактическую гибкость Алжира."
 ALG_military_mechanization: "Военная механизация"
 ALG_military_mechanization_desc: "Механизация пехоты повышает мобильность и огневую мощь. Этот переход модернизирует армию и повышает эффективность на поле боя."
 ALG_abolish_conscription: "Отменить воинскую повинность"
 ALG_abolish_conscription_desc: "Отмена призыва на военную службу переводит армию в профессиональный добровольческий состав. Это может улучшить качество вооруженных сил, но сократит их доступность."
 ALG_quality_over_quantity: "Качество важнее количества."
 ALG_quality_over_quantity_desc: "Сосредоточение внимания на меньших по численности, но лучше оснащенных силах повышает боевую эффективность. Приоритет отдается подготовке и современному оборудованию, а не просто численному превосходству."
 ALG_a_cost_effective_army: "Экономически эффективная армия"
 ALG_a_cost_effective_army_desc: "Поддержание компактной и эффективной армии обеспечивает финансовую ответственность. Разумное бюджетирование позволяет нам сбалансировать оборонные потребности с экономическими реалиями."
 ALG_modernizing_our_equipment: "Модернизация нашего оборудования"
 ALG_modernizing_our_equipment_desc: "Модернизация вооружения и снаряжения позволяет нашим войскам оставаться конкурентоспособными. Современное оборудование повышает живучесть и боеспособность."
 ALG_develop_algerian_military_industry: "Развитие военной промышленности Алжира"
 ALG_develop_algerian_military_industry_desc: "Создание собственной оборонной промышленности снижает зависимость от импорта. Это укрепляет суверенитет и создает рабочие места."
 ALG_cooperate_with_foreign_arms_companies: "Сотрудничать с иностранными компаниями по производству оружия"
 ALG_cooperate_with_foreign_arms_companies_desc: "Партнерство с международными оружейными компаниями ускоряет передачу технологий. Такое сотрудничество повышает наши военные возможности."
 ALG_tackle_military_corruption: "Борьба с коррупцией в армии"
 ALG_tackle_military_corruption_desc: "Коррупция подрывает эффективность и моральный дух армии. Решительные реформы и надзор восстанавливают доверие и дисциплину."
 ALG_elite_officer_training: "Элитная подготовка офицеров"
 ALG_elite_officer_training_desc: "Высококвалифицированные офицеры — залог успеха на поле боя. Специализированные программы подготовки развивают лидерские качества и стратегическое мышление."
 ALG_an_army_for_the_future: "Армия будущего"
 ALG_an_army_for_the_future_desc: "Мы должны подготовить вооруженные силы к противостоянию будущим угрозам и технологиям. Инновации и адаптивность являются центральными элементами этой концепции."
 ALG_purchase_american_aircraft: "Приобретите американские самолеты"
 ALG_purchase_american_aircraft_desc: "Приобретение самолетов у Соединенных Штатов обеспечивает передовые технологии и проверенную надежность. Это укрепляет наши возможности в области авиации."
 ALG_purchase_chinese_aircraft: "Приобретение китайских самолетов"
 ALG_purchase_chinese_aircraft_desc: "Китайские самолеты предлагают экономически выгодные варианты и постоянно совершенствуются с технологической точки зрения. Диверсификация поставщиков способствует расширению стратегических партнерств."
 ALG_purchase_russian_aircraft: "Покупка российских самолетов"
 ALG_purchase_russian_aircraft_desc: "Российские самолеты отличаются прочной конструкцией и высокими эксплуатационными характеристиками. Сотрудничество повышает универсальность наших военно-воздушных сил."
 ALG_improve_air_defense_infrastructure: "Улучшение инфраструктуры противовоздушной обороны"
 ALG_improve_air_defense_infrastructure_desc: "Укрепление систем противовоздушной обороны защищает важнейшие объекты и населенные пункты. Модернизация снижает уязвимость перед воздушными угрозами."
 ALG_close_air_support: "Непосредственная авиационная поддержка"
 ALG_close_air_support_desc: "Непосредственная авиационная поддержка повышает эффективность наземных войск в боевых действиях. Интеграция воздушных и наземных операций имеет решающее значение для успеха на поле боя."
 ALG_a_new_world_class_academy: "Новая академия мирового класса"
 ALG_a_new_world_class_academy_desc: "Создание военной академии мирового класса позволит подготовить будущих лидеров. Это учебное заведение установит стандарты качества."
 ALG_dominate_the_skies: "Покорите небеса"
 ALG_dominate_the_skies_desc: "Достижение превосходства в воздухе имеет важнейшее значение в современной войне. Мы будем инвестировать средства в контроль над нашим воздушным пространством и поддержку всех военных операций."
 ALG_might_of_the_sky: "Могущество Небес"
 ALG_might_of_the_sky_desc: "Наша военно-воздушная мощь символизирует национальную силу и технологический прогресс. Наличие мощных военно-воздушных сил сдерживает агрессию."
 ALG_naval_military_police: "Военно-морская полиция"
 ALG_naval_military_police_desc: "Военно-морская полиция поддерживает дисциплину и безопасность на борту судов и баз. Она обеспечивает порядок и эффективность операций."
 ALG_expand_the_naval_academy: "Развернуть Военно-морскую академию"
 ALG_expand_the_naval_academy_desc: "Расширение военно-морской академии позволит подготовить больше офицеров и матросов. Эти инвестиции способствуют созданию профессиональных и боеспособных военно-морских сил."
 ALG_return_to_the_sea: "Наше возвращение к морю"
 ALG_return_to_the_sea_desc: "Восстановление доступа к Тихому океану — историческая цель для Алжира. Развитие военно-морского флота имеет решающее значение для достижения этой цели."
 ALG_algerian_marine_forces: "Алжирские морские силы"
 ALG_algerian_marine_forces_desc: "Морская пехота обеспечивает возможности быстрого реагирования и обладает опытом десантных операций. Расширение ее присутствия увеличивает оперативный охват Алжира."
 ALG_quick_strikes: "Быстрые удары"
 ALG_quick_strikes_desc: "Быстрые и решительные удары могут сокрушить противника. Развитие таких сил повышает тактическую гибкость."
 ALG_invest_into_shipbuilding: "Инвестируйте в судостроение"
 ALG_invest_into_shipbuilding_desc: "Развитие отечественной судостроительной промышленности способствует расширению военно-морского флота и экономическому росту. Этот сектор имеет стратегическое значение для долгосрочной обороны."
 ALG_djebel_chenoua: "Джебель Шенуа"
 ALG_djebel_chenoua_desc: "Создание мощного флота демонстрирует силу и защищает национальные интересы. Джебель-Шенуа является символом морского суверенитета."
 ALG_masters_of_the_mediterranean: "Мастера Средиземноморья"
 ALG_masters_of_the_mediterranean_desc: "Доминирование в водах Средиземного моря обеспечивает торговые пути и стратегические преимущества. Алжир должен стремиться стать ключевым игроком в этом регионе."
 ALG_focus_on_mass_assault_tactics: "Сосредоточьтесь на тактике массированных атак."
 ALG_focus_on_mass_assault_tactics_desc: "Тактика массированного наступления предполагает подавляющее превосходство в силах противника за счет крупных скоплений войск. Эта стратегия опирается на людские ресурсы и координацию действий для достижения победы."
 ALG_licence_mir: "Приобретение лицензий на Mirage"
 ALG_licence_mir_desc: "У нас есть все возможности для производства французских самолетов, поэтому мы должны запросить лицензию на их производство."
 ALG_purchase_russian_su30: "Покупка российского СУ-30"
 ALG_purchase_russian_su30_desc: "Как региональная держава, защита наших обширных границ и распространение влияния на весь Магриб и Сахель имеют первостепенное значение. Наше военное командование определило легендарный российский Су-30 как идеальную платформу для значительного усиления нашего превосходства в воздухе. Это приобретение не только увеличит мощь нашего флота и стандартизирует логистику, но и обеспечит решающее, немедленное преимущество, хотя, несомненно, привлечет значительное международное внимание."
 alg_politics.50.t: "Смерть генерала Смайна Ламари"
 alg_politics.50.d: "Генерал Смаин Ламари, глава внушавшего страх контрразведывательного подразделения DRS, скончался. Его внезапная смерть создает вакуум власти в алжирском «глубинном государстве», поскольку соперники стремятся присвоить себе его прежнее влияние."
 alg_politics.50.a: "Тень старого режима исчезает."
 ALG_black_decade_threat: "Возрождение методов «Черного десятилетия»"
 ALG_2001_title: "Продвижение Фатимы Будуани"
 ALG_2001_desc: "В рамках реформ президента Бутефлики Фатима Будуани становится первой женщиной-генералом в Алжире. Ее повышение знаменует собой новую эру для женщин в вооруженных силах, повышает моральный дух и сигнализирует о модернизации."
 ALG_2001_a: "Исторический шаг для армии."
 ALG_2002_title: "Продвижение Фатимы Зохры Арджун"
 ALG_2002_desc: "Вслед за впечатляющим восхождением Фатимы Будуани, Фатима Зора Арджун получила звание генерала. Став первой женщиной-генералом в алжирском медицинском корпусе, ее назначение отражает осторожные шаги Алжира в направлении гендерного равенства в вооруженных силах."
 ALG_2002_a: "Ещё один барьер преодолен."
 alg_reform.1.t: "Шанс на подлинные реформы"
 alg_reform.1.d: "В рамках инициативы «От народа, для народа» у Алжира появилась редкая возможность выбрать лидера, приверженного подлинным реформам. Выделились три кандидата, каждый из которых обещает свой путь стабилизации и модернизации страны. Теперь выбор за народом."
 alg_reform.1.a: "Ахмед Бенбитур – технократический реформатор"
 alg_benbitour_desc: "Ахмед Бенбитур — технократ, ориентированный на повышение эффективности управления и экономическую модернизацию. Его последовательный подход направлен на построение долгосрочной стабильности и реформирование государственных институтов."
 alg_reform.1.b: "Суфиан Джилали – Харизматический реформатор"
 alg_djilali_desc: "Суфиан Джилали — лидер оппозиции-реформатора, делающий упор на социальные и политические реформы. Харизматичный и целеустремленный, он стремится укрепить демократические институты и расширить участие общественности."
 alg_reform.1.c: "Рашид Некказ – популистский активист"
 alg_nekkaz_desc: "Рашид Некказ — популистский активист, обращающийся напрямую к народу. Несмотря на высокую популярность, его конфронтационный стиль может создать нестабильность в и без того непростой политической обстановке."
 ALG_citizens_constitution: "Гражданская конституция"
 ALG_justice_for_the_people: "Справедливость для народа"
 ALG_free_press_free_people: "Свободная пресса, свободный народ"
 ALG_economic_transparency: "Экономическая прозрачность"
 ALG_citizens_constitution_desc: "Разработать новую конституцию, гарантирующую основные права и укрепляющую демократические институты."
 ALG_justice_for_the_people_desc: "Необходимо реформировать судебную систему, чтобы обеспечить ее независимость, справедливость и защиту от политического вмешательства."
 ALG_free_press_free_people_desc: "Гарантировать свободу прессы, позволяя средствам массовой информации привлекать власть к ответственности и информировать граждан."
 ALG_economic_transparency_desc: "Внедрить прозрачную бюджетную и фискальную политику для борьбы с коррупцией и повышения доверия населения."
 ALG_true_reformist_path_tt: "Этот путь позволит Алжиру выбрать подлинного лидера-реформатора, повысить популярность и стабильность демократии, а также дать толчок политическим и экономическим реформам на благо народа."
 algeria_news.3_tt: "Мирная программа Бутефлики вселяет в Алжир чувство надежды, способствуя повышению стабильности и укреплению демократических связей."
 algeria_news.7_tt: "Сопротивление «власти» набирает популярность, усиливая демократическое влияние и политический капитал."
 algeria_news.1_tt: "После введения чрезвычайных мер армия восстанавливает контроль. Стабильность несколько снижается, но поддержка войны и политическая власть возрастают."
 algeria_news.4_tt: "Усилия Бутефлики по примирению способствуют укреплению национальной стабильности и поддержке демократии."
 algeria_news.8.t: "Жертвы «Черного десятилетия»"
 algeria_news.8.d: "Гражданская война 1990-х годов унесла жизни сотен тысяч людей: пропавших без вести, вдов, сирот, а также тех, кто подвергся пыткам и террору. В условиях стремления Алжира к примирению возникает вопрос: как государство должно реагировать на требования справедливости и признания?"
 algeria_news.8.a: "Выплатить компенсации семьям и пострадавшим."
 algeria_news.8.b: "Предлагайте лишь символическое признание."
 algeria_news.8.c: "Мы не можем зацикливаться на прошлом."
 algeria_news.8_a_tt: "§YДорогостоящие программы компенсаций§! Это улучшит стабильность и укрепит легитимность Алжира, но создаст дополнительную нагрузку на государственную казну."
 algeria_news.8_b_tt: "§YСимволическое распознавание§! повышает стабильность ценой огромных политических издержек, но при этом не удовлетворяет некоторым требованиям."
 algeria_news.8_c_tt: "§YИгнорирование требований жертв§! Это позволяет сэкономить ресурсы сейчас, но снижает стабильность и подпитывает недовольство."
 algeria_news.10.t: "Путь к выздоровлению"
 algeria_news.10.d: "После окончания гражданского конфликта Алжир сталкивается с колоссальной задачей восстановления разрушенной экономики. Заводы простаивают, инфраструктура повреждена, а уровень безработицы остается опасно высоким. И все же впервые за многие годы появилась надежда, что реконструкция и реформы смогут вернуть процветание и стабильность."
 algeria_news.10.a: "Восстановление начинается!"
 algeria_news.10_a_tt: "§YПредпринимаются первые шаги по оживлению экономики Алжира.§! Это открывает путь к более глубоким реформам в сфере инфраструктуры, промышленности и финансов."
 algeria_news.11.t: "Миссия Организации Объединенных Наций по оказанию помощи"
 algeria_news.11.d: "Представители Организации Объединенных Наций прибыли в Алжир с предложением экономической помощи и содействия восстановлению. Их программы могут принести ценные средства, экспертные знания и гуманитарную помощь, но многие в правительстве предупреждают, что принятие такой помощи может спровоцировать иностранное вмешательство во внутренние дела Алжира."
 algeria_news.11.a: "Принять миссию ООН"
 algeria_news.11_a_tt: "§GМы получим международную финансовую помощь и техническую поддержку.§! \n§RОднако это усилит влияние США, Франции и Великобритании в Алжире.§!"
 algeria_news.11.b: "Отвергайте иностранное вмешательство"
 algeria_news.11_b_tt: "§RМы отказываемся от надзора ООН и восстановимся самостоятельно.§! \n§YЭто сохраняет наш суверенитет, но замедляет экономический рост.§!"
 algeria_news.20.t: "Обзор внешней политики Алжира"
 algeria_news.20.d: "После окончания гражданского конфликта и начала хрупкого восстановления Алжира руководство страны приступило к всестороннему пересмотру внешней политики. Выбор, сделанный в ближайшие годы, определит, будем ли мы укреплять связи со старыми союзниками, искать новые партнерства или сохранять свою независимость во все более поляризованном мире. Дискуссия началась, и вскоре Алжиру придется выбрать свой курс."
 algeria_news.20.a: "Будущее Алжира еще впереди."
 algeria_news.20_tt: "§YЭто знаменует начало работы внешнеполитического ведомства Алжира.§!"
 ALG_between_east_and_west_tt: "Алжир стремится сбалансировать отношения между Востоком и Западом, одновременно проводя политику неприсоединения."
 ALG_mediate_great_power_conflict_tt: "Алжир активно выступает посредником между мировыми державами, укрепляя свою репутацию нейтрального миротворца."
 ALG_secure_balance_tt: "Алжир укрепляет свою позицию неприсоединения, обеспечивая стабильный баланс между ведущими мировыми державами."
 alg_news_non_aligned.1.t: "Баланс между Востоком и Западом"
 alg_news_non_aligned.1.d: "Алжир начал осторожно выстраивать курс между ведущими мировыми державами, стремясь сохранить свою независимость и одновременно налаживая дипломатические отношения как с Востоком, так и с Западом."
 alg_news_non_aligned.1.a: "Алжир стремится к балансу"
 alg_news_non_aligned.2.t: "Урегулирование глобальных конфликтов"
 alg_news_non_aligned.2.d: "Алжир выступил в качестве посредника в урегулировании напряженности между крупными державами, стремясь укрепить свой международный авторитет как нейтрального миротворца."
 alg_news_non_aligned.2.a: "Идет посредничество"
 alg_news_non_aligned.3.t: "Содействие региональному примирению"
 alg_news_non_aligned.3.d: "Алжир предпринял ряд дипломатических инициатив для урегулирования разногласий между региональными державами, стремясь к стабильности и развитию партнерских отношений."
 alg_news_non_aligned.3.a: "Усилия по примирению"
 alg_news_non_aligned.4.t: "Обеспечение неприсоединившегося баланса"
 alg_news_non_aligned.4.d: "Алжир укрепил свою позицию неприсоединения, тщательно поддерживая отношения с крупными державами, но не вступая в полную силу ни в один из блоков."
 alg_news_non_aligned.4.a: "Баланс обеспечен"
 alg_news_non_aligned.5.t: "Возрождение движения неприсоединения"
 alg_news_non_aligned.5.d: "Алжир предпринял шаги по активизации своего участия в Движении неприсоединения, подтвердив свое лидерство и дипломатическое влияние среди нейтральных стран."
 alg_news_non_aligned.5.a: "Влияние Движения неприсоединения восстановлено"
 alg_news_non_aligned.6.t: "Поддержка развивающихся стран"
 alg_news_non_aligned.6.d: "Алжир начал масштабную дипломатическую и экономическую работу с развивающимися странами, содействуя стабильности и сотрудничеству, а также наращивая свое влияние на континенте."
 alg_news_non_aligned.6.a: "Инициирована информационная работа."
 algeria_news.9.t: "Наследие «Черного десятилетия»"
 algeria_news.9.d: "Гражданская война оставила глубокие шрамы на Алжире. Правительство должно решить, как интерпретировать прошлое, определить виновных и направить будущее страны."
 algeria_news.9.a: "Поддержите военный режим"
 algeria_news.9.b: "Встаньте на сторону жертв и бедных."
 algeria_news.9.c: "Вините внешних игроков."
 algeria_news.9.dd: "Официально стереть и подавить обсуждение."
 ALG_promote_reconciliation_tt: "§GСодействие примирению:§!\n• Улучшение отношений с соседями\n• Снижение региональной напряженности\n• Открытие дипломатических каналов"
 alg_mufti.2.t: "Какой путь выберет Исламское государство?"
 alg_mufti.2.d: "Теперь, когда ислам объявлен руководящим принципом нации, мы должны решить, какое течение определит наш путь. Движение Исламского возрождения (Нахда), возглавляемое Абдаллой Джабаллой, призывает к умеренному и структурированному исламистскому видению посредством голосования. Но другие обращаются к улемам и харизматичным проповедникам, которые обещают более прямую и бескомпромиссную форму исламской власти."
 alg_mufti.2.a: "Расширение возможностей движения «Исламское возрождение» (Нахда)"
 alg_mufti.2.a.tt: "Партия «Нахда» Джабаллы становится ведущей силой в исламской политике."
 alg_mufti.2.b: "Передайте власть в руки улемов."
 alg_mufti.2.b.tt: "Позже мы выберем, следовать ли за спорным проповедником или за муфтием, одобренным правительством."
 alg_mufti.3.t: "Лицо улема"
 alg_mufti.3.d: "После подтверждения авторитета улемов правительство должно решить, кто будет представлять это течение в руководстве. Шейх Буамран — умеренный политик, приемлемый для государства и военных, в то время как Али Бельхадж остается радикальным, пламенным голосом, который внушает народную поддержку, но рискует вступить в конфронтацию с властями."
 alg_mufti.3.a: "Поддержите Бельхаджа"
 alg_mufti.3.a.tt: "Лидером станет Али Бельхадж, представляющий радикальное салафитское течение."
 alg_mufti.3.b: "Поддержите Буамран"
 alg_mufti.3.b.tt: "Шейх Буамран станет лидером, представляя умеренное и ориентированное на государство течение улемов.\n§RНедоступно после мая 2016 года.§!"
 ALG_ennahda: "Поддержите Эннахду"
 ALG_ennahda_desc: "Мы будем поддерживать Абдаллу Джабаллу и движение «Исламское возрождение», интегрируя исламистскую политику в структуру наших государственных институтов."
 ALG_independent: "Независимые улемы"
 ALG_independent_desc: "Мы укрепим независимость улемов, предоставив религиозным ученым авторитет в духовных вопросах и, возможно, в руководстве государством."
 ALG_grand_mufti_rule: "Правила Великого Муфтия"
 ALG_grand_mufti_rule_desc: "Улемы, или политическое исламистское движение, должны стать руководящей силой алжирского государства. Выбранный нами путь определит, кто станет лицом исламской власти."
 ALG_nahda_path: "Выберите путь Нахды"
 ALG_ulema_path: "Выберите путь улемов."
 ALG_belhadj_leader: "Али Бельхадж — лидер."
 ALG_bouamrane_leader: "Шейх Буамран — лидер."
 ALG_constitution_1996: "Конституция 1996 года"
 ALG_constitution_1996_desc: "Пересмотренная Конституция 1996 года была призвана стабилизировать Алжир после потрясений «Черного десятилетия». Однако многие положения были разработаны с учетом сохранения режима, а не подлинной демократизации. Ее жесткая светская структура рассматривалась значительной частью исламистского движения как нелегитимная и «неисламская». Хотя она укрепляет государственный контроль и президентскую власть, она также ограничивает политическое участие, снижает доверие между правительством и обществом и препятствует долгосрочным реформам. Наследие этой конституции продолжает оказывать серьезное давление на стабильность и легитимность Алжира."
 ALG_enahda_media_network_idea: "Медиасеть Эннахда"
 ALG_enahda_media_network_idea_desc: "Движение «Эннахда» создало собственные медиаканалы для распространения своей идеологии и мобилизации общественной поддержки. Эти каналы пропагандируют ценности, вдохновленные религией, и одновременно критикуют неудачи режима.\n\n§YЭтот национальный дух будет искоренен, если мы не будем действовать в союзе с партией «Эннахда».§!"
 ALG_supreme_islamic_council_idea: "Высший исламский совет"
 ALG_supreme_islamic_council_idea_desc: "Для определения государственной политики в религиозном плане был создан консультативный совет, состоящий из ведущих улемов и исламских ученых. Хотя он не обладает прямой властью, его влияние на законодательство и общественную жизнь значительно.\n\n§YЭтот национальный дух исчезнет, если мы не будем салафитами или исламистами.§!"
 alg_constitution.1.t: "Конституция реформирована"
 alg_constitution.1.d: "После многолетних споров Конституция 1996 года была пересмотрена. Новая структура исключает некоторые из наиболее авторитарных положений, вводит ограничения на исполнительную власть и стремится к созданию лучшего баланса между исламскими и светскими течениями в Алжире. Многие считают это необходимым шагом к примирению, в то время как другие сомневаются, действительно ли реформы изменят укоренившуюся систему власти."
 alg_constitution.1.a: "Принять новую Конституцию"
 alg_constitution.1.a.tt: "Заменяет §YКонституция 1996 года§! с §YРеформированная Конституция§!, обеспечивая преимущества для стабильности, политической власти и экономического роста."
 ALG_ali_belhadj_desc: "Али Бельхадж, соучредитель Исламского фронта спасения (ИФС), был одним из самых харизматичных и радикальных исламистских лидеров бурных 1990-х годов в Алжире. Известный своими пламенными проповедями, бескомпромиссной риторикой и неприятием светской политики, он стал символом сопротивления режиму Фронта национального освобождения (ФНО). Проведя большую часть гражданской войны в заключении и будучи отстраненным от официальной политики в соответствии с Конституцией 1996 года, Бельхадж остается противоречивой фигурой: для одних — воплощением исламистского недовольства, для других — опасным напоминанием о «Черном десятилетии». Его потенциальное возвращение на политическую сцену порождает как надежды на примирение, так и опасения по поводу возобновления экстремизма."
 ALG_bouamrane_desc: "Мохамед Буамран появился в 1990-х годах как более умеренный исламистский интеллектуал и политический деятель. Выступая за диалог вместо конфронтации, он занял позицию между радикальными исламистами, такими как Али Бельхадж, и укоренившейся элитой Фронта национального освобождения (ФНО). Хотя он никогда не достиг такой же популярности, как руководство ФИС, Буамран стал уважаемой фигурой в послевоенных дебатах о примирении и конституционной реформе. Его видение подчеркивало Алжир, где исламские ценности могли бы сосуществовать с демократическими институтами, что сделало его связующим звеном в напряженном балансе между светской и религиозной политикой."
 algeria_elections.2024.t: "Президентские выборы 2024 года"
 algeria_elections.2024.d: "Алжир вступает в очередной решающий избирательный процесс. Три ведущие фигуры представляют собой расходящиеся пути: Абдельмаджид Теббун, обещающий преемственность власти Фронта национального освобождения; Суфиан Джилали Аушиш, выступающий за демократические реформы и либеральную модернизацию; и Абделали Хассани, поддерживаемый исламистскими течениями, стремящимися к большей роли религии в политике. Результаты отражают баланс сил между фракциями."
 algeria_elections.2024.a: "Абдельмаджид Теббун добивается переизбрания."
 algeria_elections.2024.b: "Юсеф Аушиш победил на президентских выборах."
 algeria_elections.2024.c: "Абделали Хассани поднимается на ноги при поддержке исламистов."
 ALG_tebboune_2024_tt: "§YAbdelmadjid Tebboon§! остается президентом, сохраняя доминирующее положение в Фронте национального освобождения."
 ALG_aouchiche_2024_tt: "§YЮсеф Аучиш§! становится президентом, возглавляя либералов-реформаторов."
 ALG_hassani_2024_tt: "§YАбделали Хассани§! становится президентом при поддержке исламистских движений."
 algeria_gspc.1.t: "Набиль Сахрауи возглавил Государственную комиссию по планированию и развитию (GSPC)."
 algeria_gspc.1.d: "Внутри «Салафитской группы за проповедь и борьбу» (GSPC) нарастало недовольство. Многие командиры обвиняли Хасана Хаттаба в слабости, критикуя его нерешительность в отношении полномасштабного джихада. В середине 2003 года Хаттаб был отстранен от власти собственными людьми, и Набиль Сахрауи, гораздо более радикальная фигура, провозгласил себя новым эмиром GSPC."
 algeria_gspc.1.a: "Повстанческое движение продолжает радикализироваться."
 ALG_sahraoui_rise_tt: "§YНабиль Сахрауи§! Сменяет Хасана Хаттаба на посту нового лидера GSPC."
 algeria_gspc.2.t: "Сахрауи убит, Друкдель появился на свет."
 algeria_gspc.2.d: "В июне 2004 года алжирские силы безопасности убили Набиля Сахрауи в столкновении. Однако его смерть не ослабила повстанческое движение; вместо этого руководство перешло к Абдельмалеку Друкделю, амбициозному стратегу, связанному с глобальной сетью «Аль-Каиды». Под его руководством GSPC, вероятно, расширит и интернационализирует свой джихад."
 algeria_gspc.2.a: "Начинается более смертоносная эпоха."
 ALG_droukdel_rise_tt: "§YAbdelmalek Droukdel§! становится лидером GSPC."
 algeria_gspc.3.t: "Хасан Хаттаб сдаётся."
 algeria_gspc.3.d: "После многих лет в бегах основатель GSPC Хасан Хаттаб сдался алжирским властям. Разочарованный в развитии движения, которое он когда-то создал, Хаттаб принял предложенную правительством программу амнистии. Хотя его влияние ослабло, его сдача представляет собой символическую победу для алжирского государства."
 algeria_gspc.3.a: "Символ поражения повстанцев."
 ALG_hattab_surrender_tt: "§YHassan Hattab§! сдаётся, снижая активность повстанцев."
 alg_generals.1.t: "Абделькадер Лунес назначен командующим ВВС"
 alg_generals.1.d: "Генерал Абделькадер Лунес назначен командующим ВВС Алжира. Известный своим вниманием к модернизации, он будет курировать развитие военно-воздушных сил Алжира в течение следующего десятилетия."
 alg_generals.1.a: "Наше небо в надежных руках."
 alg_generals.2.t: "Амар Амрани принимает командование противовоздушной обороной."
 alg_generals.2.d: "Генерал-майор Амар Амрани назначен командующим силами противовоздушной обороны Алжира. Под его руководством будет укреплена способность Алжира защищать свое воздушное пространство от внешних угроз."
 alg_generals.2.a: "Наша противовоздушная оборона становится всё сильнее."
 alg_generals.3.t: "Менад Ноуба становится командующим жандармерией"
 alg_generals.3.d: "Генерал Менад Нуба назначен командующим Национальной жандармерией Алжира. Отвечая за внутреннюю безопасность и борьбу с повстанцами, его руководство будет иметь решающее значение для поддержания внутреннего порядка."
 alg_generals.3.a: "Твёрдая рука в обеспечении безопасности Алжира."
 ALG_ouyahia_pm: "Ахмед Уяхия в качестве премьер-министра"
 ALG_belkhadem_pm: "Абдельазиз Бельхадем — премьер-министр"
 ALG_interim_president.1.t: "Объявлено о введении временного президентства."
 ALG_interim_president.1.d: "После отставки Бутефлики Алжир столкнулся с вакуумом власти. В соответствии с конституционным мандатом, Абделькадер Бенсалах, спикер верхней палаты парламента, был приведен к присяге в качестве временного президента на 90 дней. Движение «Хирак» отвергло это назначение, рассматривая его как часть той же коррумпированной системы."
 ALG_interim_president.1.a: "Назначить Абделькадера Бенсалаха"
 ALG_bouteflika_resigns.1.t: "Бутефлика подал в отставку"
 ALG_bouteflika_resigns.1.d: "Под огромным давлением многонедельных протестов движения «Хирак» и отказа военного режима от поддержки президент Абдельазиз Бутефлика официально подал в отставку. Его двадцатилетнее президентство подошло к концу, оставив будущее Алжира неопределенным."
 ALG_bouteflika_resigns.1.a: "Эпоха Бутефлики подошла к концу."
 ALG_hirak.100.t: "Голос Хирака"
 ALG_hirak.100.d: "От Алжира до Орана, от Константины до Таманрассета миллионы людей каждую пятницу выходили на марши с требованием \"Yetnahaw Ga3\" – они все должны уйти. Старый режим рухнул. Теперь Хирак должен выбрать: кто принесет дух 22 февраля в президентский дворец в Эль-Мурадии?"
 ALG_hirak.100.a: "Зубида Ассул – Голос Конституции"
 ALG_hirak.100.b: "Карим Таббу – Чемпион улицы"
 ALG_hirak.100.c: "Хаким Аддад – Поколение RAJ"
 ALG_hirak.100.e: "Амира Бурауи – Свирепая дочь Бараката"
 ALG_african_trade_links: "Торговые связи Африки"
 ALG_african_trade_links_desc: "Благодаря усилению экономических и дипломатических инициатив в Африке Алжир расширяет свою сеть торговых соглашений, снижает зависимость от внешних рынков и обеспечивает взаимное процветание со своими континентальными партнерами."
 ALG_african_mediation_role: "Роль африканских посредников"
 ALG_african_mediation_role_desc: "Алжир давно позиционирует себя как надежный посредник в африканских конфликтах. Активное участие в урегулировании конфликтов позволяет нам укрепить легитимность на континенте и расширить дипломатическое влияние."
 ALG_african_union_reforms: "Призывать к реформам Африканского союза"
 ALG_african_union_reforms_desc: "Эффективность Африканского союза по-прежнему ограничена. Продвигая реформы, укрепляя его институты, повышая подотчетность и формируя консенсус, мы можем обеспечить Алжиру статус уважаемого лидера в континентальном африканском контексте."
 ALG_african_economic_integration: "Африканская экономическая интеграция"
 ALG_african_economic_integration_desc: "Континентальная экономическая интеграция является ключом к процветанию Алжира. Снижая торговые барьеры и улучшая связи с африканскими партнерами, мы уменьшим зависимость от внешних рынков и будем способствовать устойчивому росту внутри Африки."
 ALG_expand_african_investments: "Расширить инвестиции в Африку"
 ALG_expand_african_investments_desc: "Благодаря государственным проектам и сотрудничеству с африканскими партнерами Алжир может расширить инвестиции в инфраструктуру, энергетику и торговлю. Эти инвестиции будут способствовать развитию нашей экономики и укреплению связей на всем континенте."
 ALG_PT: "PT (Рабочая партия)"
 ALG_PT_desc: "Партия трудящихся (PT) — троцкистская политическая партия в Алжире, тесно связанная с Независимой рабочей партией Франции. Партию возглавляет Луиза Ханун. Рабочая партия, использующая аббревиатуру \"PT\", выступает за защиту и продвижение профсоюзного движения в Алжире, в том числе и за эгалитарную доктрину, требующую лучшего распределения богатства среди населения страны. Партия была создана в 1990 году, через год после конституционной реформы, которая ввела многопартийную систему. Ее генеральным секретарем является Луиза Ханун, которая в 2004 году стала первой женщиной в арабском мире, баллотировавшейся на президентских выборах."
 ALG_communist_education: "Коммунистическое образование"
 ALG_communist_education_desc: "Молодые умы наиболее восприимчивы. Привитие основных ценностей коммунизма молодому поколению, одновременно с обучением студентов университетов величию равенства, могло бы значительно продвинуть наше дело."
 ALG_labour_focus_unions: "Обратитесь в профсоюзы"
 ALG_labour_focus_unions_desc: "Профсоюзы будут очень рады правительству, готовому не только сотрудничать, но и идти на уступки их требованиям. Мы обеспечим, чтобы их влияние не распространялось за пределы нашего прихода к власти, чтобы избежать §RКонфликт интересов.§!"
 ALG_failures_capitalism: "Неудачи капитализма"
 ALG_failures_capitalism_desc: "Капитализм больше не одаривает нас обещанным бесконечным богатством. Пришло время идти своим собственным путем, чтобы подобный кризис никогда больше не повторился! §RВлияние такого подхода сказывается на масштабах долгового кризиса.§!"
 ALG_working_class: "Рабочий класс"
 ALG_working_class_desc: "Рабочий класс – место, где мечты рождаются и погибают. Мы можем пообещать им, что к ним будут хорошо относиться и отдадут должное за то, что они стали основой нового коммунистического государства."
 ALG_communist_propaganda: "Пропагандистская машина"
 ALG_communist_propaganda_desc: "Благодаря расширению нашего влияния мы можем позволить себе развернуть пропагандистскую машину против Алжира. Хотя финансовые затраты высоки, эту пропаганду нельзя игнорировать, она будет чрезвычайно эффективна в обращении алжирского населения в свою веру."
 ALG_prepare_government: "Подготовка правительства"
 ALG_prepare_government_desc: "Формирование правительства внутри нашей политической партии обеспечит эффективный переходный период, который позволит нам быстрее, чем наши соперники, достичь поставленных целей. Это будет дорогостоящим шагом, но, учитывая наши шансы на победу, это разумная ставка."
 ALG_damn_market: "К чёрту свободный рынок!"
 ALG_damn_market_desc: "Мы в состоянии нанести последний удар капиталистам. Обладая силой пропаганды, мы можем нанести смертельный удар по рыночной экономике и, заодно, узурпировать трон излишеств, на котором восседают капиталисты!"
 ALG_election_com: "Требуйте немедленных выборов"
 ALG_election_com_desc: "Товарищи, время пришло! Все наши усилия по созданию нового свободного государства привели нас к этому моменту! \n\n§RМы обеспечим, чтобы народное правительство правило еще 1000 лет!§!"
 PT_flag: "ПТ"
 ALG_failures_capitalism_TT: "§RВлияние направленности внимания сказывается на масштабах долгового кризиса.§!"
 ALG_communist_takeover_TT: "§GАлжирский народ требует выборов!§!\n\nУбедитесь, что у вас достаточно политической власти для этого. Если вы §Rнеудача§! Избрать и сформировать правительство вам потребуется §Rнеобходимо провести еще одни внеочередные выборы§! расширить возможности §Y[communist_state_L]§!"
 ALG_increase_drift_TT: "§GУсиливает политический сдвиг в сторону этой партии!§!"
 ALG_wild_unions: "Дикие профсоюзы"
 ALG_wild_unions_desc: "Мы наделили профсоюзы властью, и они ею пользуются — мы не видим в этом ничего плохого."
 ALG_wild_unions_2: "Дикие профсоюзы"
 ALG_wild_unions_2_desc: "Профсоюзам была предоставлена большая свобода во время нашего восхождения к власти. Теперь, когда мы одержали победу, мы обращаемся к ним только для того, чтобы завоевать сердца людей, прежде чем полностью обезопасить нашу базу власти."
 ALG_wild_unions_3: "Дикие профсоюзы"
 ALG_wild_unions_3_desc: "Профсоюзы просто невыносимы, мы больше не можем их терпеть! Они начинались как помеха, но превратились в препятствие для воли государства, их нужно либо усмирить, либо уничтожить!"
 ALG_press_opposition: "Оппозиция СМИ"
 ALG_press_opposition_desc: "С тех пор как мы восстановили порядок в правительстве, средства массовой информации изображают нас не в лучшем свете, но вполне логично, что слабые должны бояться сильных."
 ALG_one_party: "Однопартийное государство"
 ALG_one_party_desc: "После заявления о том, что Партия трудящихся (PT) — единственная разрешенная политическая партия в Алжире, мы получаем власть делать все, что захотим, но ценой кровопролития, необходимого для обеспечения покорности нашего народа."
 ALG_reorganize_army_idea: "Реорганизация армии"
 ALG_reorganize_army_idea_desc: "Мы не можем просто сократить финансирование армии до такой степени, что она станет неработоспособной. Может наступить время, когда нам понадобятся мощные вооруженные силы, и в этом случае мы обеспечим лояльность и боеготовность нашей армии."
 ALG_new_army_idea: "Новая армия"
 ALG_new_army_idea_desc: "Мы добились больших успехов в том, что полиция взяла на себя роль основной оборонительной силы. Однако мы понимаем, что она недостаточно оснащена, чтобы отразить иностранное вторжение. Мы создадим новую армию, сосредоточенную исключительно на обороне Алжира, чтобы обеспечить безопасность нашего народа."
 ALG_red_army_idea: "Красная армия"
 ALG_red_army_idea_desc: "Мы глубоко внедрили идеологический фанатизм не только в ряды нашей армии, но и в гражданское население, обеспечив тем самым наличие необходимой численности и лояльности для формирования грозной армии."
 ALG_cracked_foundation: "Треснувший фундамент"
 ALG_cracked_foundation_desc: "К настоящему моменту основы государственного устройства подвергались столько сомнению, что, если мы продолжим идти по нынешнему пути, нас может постигнуть ужасная новая революция. \n\n§RЕсли наша стабильность упадет ниже 30%, нас ждет революция в Алжире!§!"
 ALG_militarist_education_idea: "Милитаристское образование"
 ALG_militarist_education_idea_desc: "Система образования внедрила в свою учебную программу военные ценности, что позволяет обеспечить более высокую готовность к внезапным нападениям."
 ALG_elam: "Возрождение Национального народного фронта"
 ALG_elam_desc: "Национальный народный фронт значительно расширил свои усилия по оказанию влияния на мнение рядового избирателя. Мы подозреваем, что причиной этого «подрыва» является Алжир."
 algeria.5.t: "Партия трудящихся призывает к проведению выборов в Алжире."
 algeria.5.d: "Получив поддержку большинства алжирского рабочего класса и ряда политических деятелей, Партия трудящихся (ПТ) призвала правительство провести свободные выборы. ПТ пользуется огромной поддержкой, и власти находятся под давлением со стороны многих сторон, требующих признать поражение. Многие ожидают убедительной победы ПТ, поскольку её база среди рабочих и профсоюзов с каждым днём становится всё сильнее. Представитель партии предупредил, что в случае отказа в проведении выборов рабочие поднимут восстание, чтобы свергнуть правительство."
 algeria.5.a: "Рабочие Алжира, восстаньте!"
 algeria.5.b: "Интересный"
 algeria.7.t: "Алжир движется влево"
 algeria.7.d: "В условиях роста безработицы и усугубления экономического неравенства рабочий класс Алжира сплотился вокруг крайне левой Партии трудящихся (ПТ). ПТ осуждает неолиберальную политику и нарушения прав трудящихся, поддерживает антизападные позиции и организует протесты с целью оказания давления на правительство. Их влияние быстро растет, что знаменует собой решительный сдвиг влево в алжирской политике."
 algeria.7.a: "Рабочие Алжира, ваше освобождение приближается!"
 algeria.7.b: "Интересный"
 ALG_family_centric: "Семейно-ориентированный"
 ALG_family_centric_desc: "Мы поддерживаем идею о том, что семья является основным элементом алжирского общества."
 ALG_religion_in_schools: "Религиозное образование"
 ALG_religion_in_schools_desc: "Наша система образования тесно связана с религией и включает её в учебную программу, обеспечивая воспитание молодого поколения в духе твердых исламских ценностей."
 ALG_grand_mufti_appointed: "Великий муфтий Алжира"
 ALG_grand_mufti_appointed_desc: "В Алжире назначен Великий муфтий для толкования исламского права, что укрепляет религиозную легитимность государства."
 ALG_islam_above_the_nation: "Ислам выше нации"
 ALG_islam_above_the_nation_desc: "В бурной истории Алжира национализм и ислам боролись за господство в формировании государства. В нашем будущем ислам должен прежде всего служить руководящим принципом управления."
 ALG_family_is_a_central_unit: "Семья превыше всего"
 ALG_family_is_a_central_unit_desc: "Основой общества является семья. Мужчина, женщина и их дети составляют фундамент нации. Крепкие семьи обеспечат процветание и успех Алжира на долгие годы вперед."
 ALG_follow_religious_law: "Следуйте религиозному закону."
 ALG_follow_religious_law_desc: "Исламское право — наилучшая основа для управления страной. Принятие его в качестве фундамента обеспечит справедливость и беспристрастность для всех алжирцев."
 ALG_traditional_role_for_women: "Традиционная роль женщин"
 ALG_traditional_role_for_women_desc: "Женщины несут на себе наивысшую ответственность за воспитание детей и заботу о своих семьях. В то время как мужчины работают вне дома, женщины должны оберегать национальные традиции дома."
 ALG_religious_education: "Религиозное образование"
 ALG_religious_education_desc: "Наши школы должны тесно интегрировать религиоведение в свою учебную программу. С детства алжирцы должны изучать Коран и исламские обычаи."
 ALG_appoint_grand_mufti: "Назначить Великого Муфтия"
 ALG_appoint_grand_mufti_desc: "Алжиру нужен Великий Муфтий для толкования исламского права. Следует назначить уважаемого учёного, который будет оказывать государству религиозное руководство."
 ALG_abrogate_secular_constitution: "Отменить светскую конституцию"
 ALG_abrogate_secular_constitution_desc: "Нынешняя конституция сохраняет светский уклад, унаследованный от независимости. Единственный закон, которому мы должны следовать, — это Коран, а не тексты, созданные человеком."
 ALG_enahda_media_network: "Медиасеть Эннахда"
 ALG_enahda_media_network_desc: "Нам следует создать национальную телевизионную сеть для трансляции послания Великого муфтия и продвижения исламских ценностей по всей Алжире."
 ALG_supreme_islamic_council: "Высший исламский совет"
 ALG_supreme_islamic_council_desc: "Для защиты нового государства мы должны создать Высший исламский совет — консультативный орган, который будет поддерживать Великого муфтия и обеспечивать, чтобы Алжир оставался верен пути веры."
 ALG_edu_and_social_policy: "Образование и социальная политика"
 ALG_edu_and_social_policy_desc: "Долгосрочное процветание Алжира зависит не только от природных ресурсов, но и от системы образования, здравоохранения и социальной защиты. Реформируя эти сектора, мы можем сформировать новый общественный договор для XXI века."
 ALG_expand_primary_education: "Расширить начальное образование"
 ALG_expand_primary_education_desc: "Расширение доступа к начальному образованию в сельских и городских районах позволит снизить уровень неграмотности и заложить основу для национального развития."
 ALG_reform_secondary_curriculum: "Реформа средней школы"
 ALG_reform_secondary_curriculum_desc: "Наши средние школы нуждаются в реформировании, чтобы соответствовать требованиям современной экономики, сохраняя при этом алжирскую самобытность."
 ALG_western_curriculum: "Принять западную учебную программу"
 ALG_western_curriculum_desc: "Интеграция учебных программ, ориентированных на западные ценности, позволит нам познакомить нашу молодежь с современными науками и мировыми стандартами, повысив конкурентоспособность Алжира."
 ALG_national_curriculum: "Укрепить национальную учебную программу"
 ALG_national_curriculum_desc: "Вместо того чтобы копировать зарубежные модели, нам следует сосредоточиться на арабизации и алжирских культурных ценностях в наших школах, чтобы сохранить суверенитет в сфере образования."
 ALG_university_reform: "Реформа университета"
 ALG_university_reform_desc: "Наши университеты необходимо расширять и модернизировать, чтобы готовить специалистов, исследователей и новаторов, способных возглавить будущее Алжира."
 ALG_basic_healthcare_access: "Базовый доступ к медицинскому обслуживанию"
 ALG_basic_healthcare_access_desc: "Каждый алжирец заслуживает доступа к базовым медицинским услугам. Расширение охвата медицинским страхованием — первый шаг к более здоровой нации."
 ALG_state_hospitals: "Расширить сеть государственных больниц"
 ALG_state_hospitals_desc: "Инвестируя в государственную систему здравоохранения, мы можем обеспечить бесплатное и доступное медицинское обслуживание для всех алжирцев, хотя и ценой значительных финансовых затрат для казны."
 ALG_modernize_state_hospitals: "Модернизировать государственные больницы"
 ALG_modernize_state_hospitals_desc: "Модернизация оборудования, обучение врачей и улучшение инфраструктуры укрепят сеть здравоохранения штата."
 ALG_universal_healthcare: "Всеобщее здравоохранение"
 ALG_universal_healthcare_desc: "Здравоохранение — это право, а не привилегия. Алжир обязуется создать полностью всеобщую систему здравоохранения."
 ALG_private_healthcare: "Поощряйте частное здравоохранение."
 ALG_private_healthcare_desc: "Содействуя развитию частных больниц и клиник, мы можем снизить нагрузку на государство и внедрить рыночную конкуренцию в сфере здравоохранения."
 ALG_expand_private_clinics: "Расширение сети частных клиник"
 ALG_expand_private_clinics_desc: "Частные клиники могут дополнять государственную систему, предлагая более специализированные услуги, особенно в городских районах."
 ALG_national_insurance: "Национальная система страхования"
 ALG_national_insurance_desc: "Национальная система медицинского страхования объединит государственное и частное здравоохранение в единую систему социальной защиты для граждан Алжира."
 ALG_minimum_income_guarantee: "Гарантия минимального дохода"
 ALG_minimum_income_guarantee_desc: "Государство гарантирует минимальный уровень дохода для наиболее уязвимых слоев населения, защищая алжирцев от крайней нищеты."
 ALG_housing_support: "Жилищная поддержка"
 ALG_housing_support_desc: "Программы субсидированного жилья обеспечат доступное жилье для работающих семей и сократят перенаселенность городов."
 ALG_childcare_support: "Поддержка по уходу за детьми"
 ALG_childcare_support_desc: "Поддержка детских садов и выплата семейных пособий помогут молодым семьям воспитывать детей без финансовых трудностей."
 ALG_fuel_subsidies: "Топливные субсидии"
 ALG_fuel_subsidies_desc: "Субсидируя цены на топливо, мы можем сделать транспорт и отопление доступными для простых алжирцев, даже если это создаст дополнительную нагрузку на государственную казну."
 ALG_food_subsidies: "Продовольственные субсидии"
 ALG_food_subsidies_desc: "Защита цен на хлеб и основные продукты питания гарантирует, что ни одна алжирская семья не останется голодной."
 ALG_welfare_consolidation: "Консолидировать государство всеобщего благосостояния"
 ALG_welfare_consolidation_desc: "Объединив наши социальные программы в единую комплексную систему социального обеспечения, Алжир создаст современную систему социальной защиты."
 ALG_civil_rights_protections: "Защита гражданских прав"
 ALG_civil_rights_protections_desc: "Обеспечение основных прав и свобод укрепит национальную стабильность и уменьшит недовольство."
 ALG_gender_equality: "Содействовать гендерному равенству"
 ALG_gender_equality_desc: "Расширение прав и возможностей алжирских женщин посредством обеспечения равных прав и возможностей является ключом к построению справедливого и процветающего общества."
 ALG_freedom_of_press: "Гарантировать свободу прессы"
 ALG_freedom_of_press_desc: "Свободная пресса необходима для демократии и подотчетности. Поддержка независимых СМИ даст алжирцам более сильный голос."
 ALG_judicial_reform: "Судебная реформа"
 ALG_judicial_reform_desc: "Современная и независимая судебная система обеспечит справедливые судебные процессы, сократит коррупцию и укрепит верховенство права."
 ALG_civil_society_empowerment: "Расширение прав и возможностей гражданского общества"
 ALG_civil_society_empowerment_desc: "Поддержка неправительственных организаций, профсоюзов и общественных объединений позволит создать более вовлеченное и устойчивое общество."
 ALG_digital_government: "Цифровое правительство"
 ALG_digital_government_desc: "Цифровизация сократит бюрократию, повысит прозрачность и приблизит государственные услуги к населению."
 ALG_public_service_efficiency: "Эффективность государственных услуг"
 ALG_public_service_efficiency_desc: "Модернизация государственного сектора позволит устранить неэффективность и улучшить качество предоставляемых услуг."
 ALG_anti_corruption_campaign: "Антикоррупционная кампания"
 ALG_anti_corruption_campaign_desc: "Коррупция подрывает государство. Комплексная кампания против нее восстановит доверие к алжирским институтам."
 ALG_e_governance_portal: "Портал электронного управления"
 ALG_e_governance_portal_desc: "Создание интегрированной платформы электронного управления обеспечит гражданам прозрачные, быстрые и доступные государственные услуги."
 ALG_streamlined_bureaucracy: "Оптимизация бюрократии"
 ALG_streamlined_bureaucracy_desc: "Сокращение бюрократических проволочек и модернизация административных структур позволят Алжиру стать более эффективным и конкурентоспособным."
 ALG_social_contract_21st_century: "Общественный договор для XXI века"
 ALG_social_contract_21st_century_desc: "Посредством образования, здравоохранения, социального обеспечения, защиты гражданских прав и административных реформ Алжир сформирует новый общественный договор, который обеспечит стабильность, справедливость и процветание для будущих поколений."
 ALG_corrupt_mil_idea: "Коррумпированные военные"
 ALG_corrupt_mil_idea_desc: "Алжирская армия, несмотря на свою мощь и глубокую политическую вовлеченность, страдает от повсеместной коррупции. Ресурсы, предназначенные для модернизации и повышения эффективности, разворовываются генералами и сетями покровительства. Это подрывает оперативный потенциал и снижает доверие общественности, затрудняя реформы и закрепляя за армией роль как защитника, так и препятствия на пути прогресса."
 ALG_military_oversight: "Военный надзор"
 ALG_military_oversight_desc: "Военные установили жесткий контроль над политикой и гражданскими институтами. Хотя это обеспечивает стабильность и предотвращает хаос, это также снижает прозрачность, ограничивает реформы и укрепляет доминирование армии в общественной жизни."
 ALG_gas_pipeline_leverage: "Использование потенциала газопроводов"
 ALG_gas_pipeline_leverage_desc: "Разветвленная сеть газопроводов Алжира, ведущих в Европу, является мощным инструментом ведения переговоров во внешней политике. Энергетическая зависимость заставляет партнеров проявлять осторожность, но также приводит к чрезмерной зависимости от экспорта углеводородов для поддержания политического влияния."
 ALG_resource_curse: "Проклятие ресурсов"
 ALG_resource_curse_desc: "Несмотря на огромные запасы нефти и газа, Алжир борется с «ресурсным проклятием». Зависимость от углеводородов подпитывает коррупцию, препятствует диверсификации и делает экономику уязвимой для нестабильности мировых энергетических рынков."
 ALG_PM_Elections: "Назначить премьер-министра"
 ALG_PM_Elections_desc: "\n£MAIN_desctext_elections\n\n\n\nПрезидент должен принять решение о назначении премьер-министра, который возглавит правительство. Этот выбор не ограничивается административными вопросами: разные кандидаты представляют конкурирующие взгляды на будущее Алжира, от лояльных технократов до оппозиционных реформаторов."
 ALG_authority_more_70: "Реформисты §Y§! обладают как минимум §Y70%§! £generic_anarchist_communism влиянием в [ROOT.GetFlag] правительстве Алжира"
 ALG_PNA_victory_tt: "§Le Pouvoir§! обладает более чем §Y45%§! влияния в рамках баланса сил."
 ALG_prime_minister_name_loc: "премьер-министр"
 ALG_minister_bio_loc: "Обладатель исполнительной власти при Президенте."
 algeria_morocco.1.t: "Марокканский вопрос"
 algeria_morocco.1.d: "Отношения Алжира с Марокко долгое время были омрачены горьким наследием Песчаной войны, конфликта в Западной Сахаре и десятилетиями закрытых границ. В условиях сохраняющейся напряженности вопрос о том, как следует взаимодействовать с Марокко, становится все более актуальным. Должен ли Алжир усилить историческое соперничество или попытаться наметить новый курс на диалог и сотрудничество?"
 algeria_morocco.1.a: "Будущее Магриба под угрозой."
 ALG_morocco_question: "Марокканский вопрос"
 ALG_morocco_question_desc: "Наше соперничество с Марокко из-за Западной Сахары, Песчаная война и многолетнее закрытие границы ослабили Алжир. Мы должны решить: будем ли мы противостоять Марокко или будем стремиться к примирению?\n\n§YЭтот раздел посвящен марокканскому вопросу.§!"
 ALG_sand_war_legacy: "Наследие Песчаной войны"
 ALG_sand_war_legacy_desc: "Раны Песчаной войны 1963 года все еще не зажили. Алжирцы помнят амбиции Марокко на нашей территории, и многие призывают к повышенной бдительности."
 ALG_close_the_border: "Закрыть границу"
 ALG_close_the_border_desc: "Граница с Марокко по-прежнему остается источником контрабанды, беспорядков и шпионажа. Ее закрытие станет мощным сигналом неповиновения."
 ALG_border_security_investments: "Инвестиции в обеспечение безопасности границ"
 ALG_border_security_investments_desc: "Для сдерживания марокканского влияния нам необходимо укрепить западную границу постоянными военными постами, современными системами наблюдения и подразделениями жандармерии."
 ALG_counter_moroccan_influence: "Противодействие марокканскому влиянию"
 ALG_counter_moroccan_influence_desc: "Марокко активно ищет союзников за рубежом. Алжир должен противостоять этому дипломатическому наступлению, сокращая свое влияние в Африке и за ее пределами."
 ALG_support_polisario_struggle: "Поддержите борьбу Полисарио!"
 ALG_support_polisario_struggle_desc: "Сахарский народ заслуживает независимости. Поддерживая Фронт Полисарио, Алжир укрепляет свою роль защитника антиколониальной борьбы в Магрибе."
 ALG_internationalize_conflict: "Интернационализация конфликта"
 ALG_internationalize_conflict_desc: "Вопрос о Западной Сахаре необходимо поднять на уровень ООН, Африканского союза и на всех возможных форумах, чтобы оказать дипломатическое давление на Марокко."
 ALG_african_union_pressure: "Мобилизация Африканского союза"
 ALG_african_union_pressure_desc: "Через Африканский союз Алжир сформирует коалицию государств, которые будут оказывать давление на Марокко с целью добиться признания права Сахары на самоопределение."
 ALG_seek_dialogue_morocco: "Наладьте диалог с Марокко."
 ALG_seek_dialogue_morocco_desc: "Алжиру необходимо наладить дипломатические отношения с Марокко. Хотя прошлые войны и соперничество разделяют нас, диалог может привести к региональной стабильности."
 ALG_confidence_building: "Меры по укреплению доверия"
 ALG_confidence_building_desc: "Небольшие шаги, такие как создание совместных комитетов и смягчение визовых ограничений, могут заложить основу для прочного доверия к Марокко."
 ALG_reopen_borders: "Открыть границы"
 ALG_reopen_borders_desc: "После многих лет закрытия открытие границы для свободного передвижения людей и товаров стало бы историческим поворотным моментом в наших отношениях."
 ALG_economic_cooperation: "Экономическое сотрудничество"
 ALG_economic_cooperation_desc: "Экономическая взаимозависимость с Марокко принесет процветание, снизит напряженность и укрепит региональную роль Алжира."
 ALG_security_cooperation: "Сотрудничество в сфере безопасности"
 ALG_security_cooperation_desc: "Для противодействия общим угрозам, таким как терроризм и контрабанда, необходимы совместное патрулирование и обмен информацией. Сотрудничество эффективнее соперничества."
 ALG_towards_maghreb_union: "На пути к союзу Магриба"
 ALG_towards_maghreb_union_desc: "Вместе с Марокко Алжир может заложить основу для сильного Союза Магриба, отражающего мечты наших предков о единстве Северной Африки."
 ALG_morocco.1.t: "Дискуссия ООН по Западной Сахаре"
 ALG_morocco.1.d: "Алжир вынес вопрос о Западной Сахаре на рассмотрение Организации Объединенных Наций, осудив контроль Марокко над этой территорией. Делегаты обсуждают, следует ли Марокко вывести свои полномочия или же Алжир превышает свои полномочия."
 ALG_morocco.1.a: "Жестко осудить Марокко"
 ALG_morocco.1.b: "Продвигайте умеренные санкции и резолюции."
 ALG_moroccan_rivalry_start: "Напряженность на границе с Марокко"
 ALG_moroccan_rivalry_start_desc: "Десятилетия вражды с Марокко, усугубленные Песчаной войной, событиями в Западной Сахаре и закрытием границы в 1994 году, тяжело сказываются на Алжире. Напряженность вредит нашей экономике, стабильности и боеготовности.\n§RЭтот национальный дух невозможно искоренить обычными способами.§!\nОно будет уменьшено, заменено или устранено только в процессе дальнейшего продвижения. §YМарокканский вопрос§! Дерево фокуса."
 ALG_moroccan_rivalry_A1: "Противодействие марокканскому влиянию"
 ALG_moroccan_rivalry_A1_desc: "Алжир предпринял шаги по ослаблению марокканского влияния в регионе. Соперничество сохраняется, но его последствия сводятся к более эффективному управлению."
 ALG_moroccan_rivalry_A2: "Обострение соперничества"
 ALG_moroccan_rivalry_A2_desc: "Напряженность в отношениях с Марокко по-прежнему истощает государство, но наша решимость и реформы позволили ограничить ее последствия."
 ALG_moroccan_rivalry_A_final: "Военная готовность против Марокко"
 ALG_moroccan_rivalry_A_final_desc: "За годы противостояния Алжир создал закаленную, боеспособную армию, готовую к конфликту. Соперничество закалило нас в невзгодах."
 ALG_moroccan_reconciliation_B1: "Дипломатические предложения"
 ALG_moroccan_reconciliation_B1_desc: "Алжир предпринял осторожные шаги к диалогу с Марокко, создав возможности для ограниченного сотрудничества и укрепления доверия."
 ALG_moroccan_reconciliation_B2: "Открытие границ"
 ALG_moroccan_reconciliation_B2_desc: "В условиях укрепления дипломатических связей Алжир вновь открыл свои границы с Марокко, что снизило экономическую нагрузку и способствовало развитию региональной торговли."
 ALG_moroccan_reconciliation_B_final: "Магрибское сотрудничество"
 ALG_moroccan_reconciliation_B_final_desc: "Алжир и Марокко наладили сотрудничество, способствующее развитию торговли и укреплению регионального лидерства. Соперничество наконец-то осталось позади."
 ALG_morocco_question_tt: "§YЭтот фокус начинает путь «Марокканский вопрос».§!\n\n- §RПуть A:§! Стремиться к конфронтации с Марокко — постепенно ослаблять идею ослабления, заканчивая §GБолее сильной армией§!.\n- §GПуть B:§! Стремиться к примирению с Марокко — заменить идею ослабления на улучшение §GПоложительных бонусов§!, заканчивая более сильной §YE экономикой и дипломатией§!."
 alg_general.1.t: "Возвращение Халеда Неззара"
 alg_general.1.d: "В связи с решением о возрождении методов «Черного десятилетия» вновь привлекается к работе скандально известный бывший министр обороны Халед Неззар. Его жесткий подход может стабилизировать армию, но он рискует оттолкнуть население и вызвать международную критику."
 alg_general.1.a: "Прошлое возвращается, чтобы направлять настоящее."
