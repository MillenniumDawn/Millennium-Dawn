 message_from_iran.1.t: "Iran przysłał nam sprzęt"
 message_from_iran.1.d: "Dzisiaj otrzymaliśmy w jednej z baz dużą i poufną przesyłkę, która, jak się okazało, została wysłana z Iranu. Przesyłka ta obejmuje sprzęt wojskowy do walki naziemnej i partyzanckiej, którego możemy użyć do obrony i konfrontacji z naszymi wrogami."
 message_from_iran.1.o1: "Dziękuję"
 message_from_iran.2.t: "Iran przysłał nam pieniądze"
 message_from_iran.2.d: "Z jednej z naszych baz skontaktowano się z nami, że przesyłki gotówki w dolarach amerykańskich zostały wysłane z Iranu w dużej liczbie walizek."
