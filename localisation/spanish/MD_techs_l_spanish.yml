 nsb_SHORAD_missile_8: "Tecnología de misiles de 8.ª gen."
 nsb_SHORAD_missile_8_desc: "$nsb_SHORAD_missile_5_desc$"
 nsb_dual_role_missile_5: "Sistemas de misiles de doble propósito futuristas"
 nsb_dual_role_missile_5_desc: "The next era of missile warfare introduces Futuristic Dual-Purpose Missile Systems, designed to engage multiple target types across air, land, sea, and even space-based threats with unprecedented speed and adaptability. These highly advanced missiles utilize AI-driven swarm coordination, quantum-encrypted targeting, and self-learning guidance systems to autonomously detect, track, and neutralize threats in real-time. Equipped with plasma-based warheads, directed energy payloads, and hypersonic propulsion exceeding Mach 10, these missiles can evade all known countermeasures, dynamically adjust mid-flight, and execute precision strikes at intercontinental ranges. Integrated into autonomous battle networks, these weapons are the foundation of next-generation strategic and tactical dominance, ensuring total battlefield supremacy in both conventional and asymmetric warfare scenarios."
 nsb_dual_role_missile_6: "6th Gen Dual-Purpose Missile Systems"
 nsb_dual_role_missile_6_desc: "$nsb_dual_role_missile_5_desc$"
 nsb_dual_role_missile_7: "7th Gen Dual-Purpose Missile Systems"
