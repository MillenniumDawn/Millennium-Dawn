 BOS_trb_mio_trait_despot_stanag3: "STANAG 3등급 장갑"
 BOS_trb_mio_trait_despot_modular_kit: "모듈식 임무 키트"
 BOS_trb_mio_trait_despot_command: "지휘소 파생형"
 BOS_trb_mio_trait_despot_medevac: "의무 후송 파생형"
 BOS_trb_mio_trait_despot_powerpack: "240 kW 파워팩"
 BOS_trb_mio_trait_despot_systems: "차량 시스템 통합"
