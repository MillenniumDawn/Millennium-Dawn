 solar_engines_3: "Тройные солнечные двигатели"
 solar_engines_3_desc: "Концепция конструкции та же, что и у двухмоторного солнечного двигателя, но вместо этого используется система из трех двигателей для увеличения тяги и максимальной скорости, однако с незначительным улучшением маневренности или живучести."
 solar_engines_4: "Счетверённые солнечные двигатели"
 solar_engines_4_desc: "Концепция конструкции та же, что и у тройного солнечного двигателя, но вместо него используется система из четырех двигателей для увеличения тяги и максимальной скорости, однако с незначительным улучшением маневренности или живучести."
 future_wingform_designs_2: "Гиперсовременные формы крыла"
 future_wingform_designs_2_desc: ""
 future_wingform_designs_3: "Ультрасовременные формы крыла"
