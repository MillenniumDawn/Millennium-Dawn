l_korean:
 EU_Voting_tutorial: "유럽 연합 (EU) 튜토리얼"
 EU_Voting_tutorial_desc: "본 밀레니엄 던 모드에서 §C[EUU.GetFlag] 유럽연합§!이 어떻게 구현되고 작동하는지에 대한 튜토리얼입니다."
 EU_voting_category: "유럽 연합"
 EU_voting_category_desc: "[ROOT.GetFlag] 친유럽주의: [?ROOT.europeanism|%R1]\n[EUU.GetFlag] 유럽주의: [?global.var_europeanism|%G1]\n\n친유럽주의 또는 유럽연합주의로도 알려진 유럽주의는 유럽 통합과 유럽연합(EU) 가입을 지지하는 정치적 입장을 의미하며, 비공식적으로 '유럽 합중국'이라 불리는 단일 초국가 수립을 추구하는 급진적인 유럽 연방주의자들까지 포함합니다. 관련 용어로는 '유럽친화파(Europhile)'가 있습니다. 개별 국가에서 이 비율은 EU 가입 국민투표에서 EU 잔류에 투표할 인구의 비중을 추정합니다. 연합 전체로 볼 때는 모든 회원국 내 유럽친화파 인구의 비중을 추정합니다.\n\n[ROOT.GetFlag] 유럽연합 가치 위반: [?ROOT.breach_of_EU_value|g0]\n\"연합은 인간의 존엄성, 자유, 민주주의, 평등, 법의 지배 및 소수자 권리를 포함한 인권 존중의 가치 위에 설립된다. 이러한 가치는 다원주의, 비차별, 관용, 정의, 연대, 그리고 남녀 동등이 지배하는 사회 속에서 회원국들에게 공통되는 것이다.\"\n- 유럽연합 조약 제2조\n\n"
 pro_european_campaign: "[EUU.GetFlag] 친유럽주의 운동"
 pro_european_campaign_desc: "§C[EUU.GetFlag] 유럽 연합§! 모든 회원국들의 친유럽주의 운동\n\n§H요구 사항:§!\n[!proeuro_euwide_button_click_enabled]\n§H영향:§!\n[!proeuro_euwide_button_click]\n"
