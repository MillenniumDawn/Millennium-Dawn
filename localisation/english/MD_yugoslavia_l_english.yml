l_english:
 yugo_nost_overview: "@SLV [SLV.GetName] §Y[?SLV.yugo_nostalgia|0]%§!\n@CRO [CRO.GetName] §Y[?CRO.yugo_nostalgia|0]%§!\n@BOS [BOS.GetName] §Y[?BOS.yugo_nostalgia|0]%§!\n@SER [SER.GetName] §Y[?SER.yugo_nostalgia|0]%§!\n@FYR [FYR.GetName] §Y[?FYR.yugo_nostalgia|0]%§!\n@MNT [MNT.GetName] §Y[?MNT.yugo_nostalgia|0]%§!\n@KOS [KOS.GetName] §Y[?KOS.yugo_nostalgia|0]%§!"
 yugo_nost_rise_tt: "§Y+[?temp_yugo_nost_gain|0]§! Yugonostalgia in [THIS.GetFlag] [THIS.GetName]"
 yugo_consensus_tt: "Every surviving successor state has at least 75% Yugonostalgia"
 yugo_nost_ser_ready_tt: "@SER [SER.GetName] has at least 75% Yugonostalgia"
 yugo_dominant_tt: "We hold the most influence across the former republics and lead the Yugoslav revival"
 yugo_dominant_none: "no dominant member"
 yugo_sends_invites_tt: "Sends invitations to all remaining post-Yugoslav states to form a new federation"
 yugo_invite_accept_tt: "The responding state is incorporated into the restored Yugoslav federation."
 yugo_invite_reject_tt: "The responding state remains independent and the federation gains a unification war goal against it."
 yugoslavia.1.t: "Invitation to Yugoslavia"
 yugoslavia.1.d: "[FROM.GetName] has invited us to join a restored Yugoslav federation. Acceptance means incorporation, while refusal may turn its unification campaign against us."
 yugoslavia.1.a: "Join the federation"
 yugoslavia.1.b: "Reject unification"
 yugoslavia.30.t: "A Nation Turns to Yugoslavia"
 yugoslavia.30.d: "Support for a restored Yugoslav federation has passed three quarters of the public. The idea that was buried in the 1990s is once again a live political project here."
 yugoslavia.30.a: "The dream endures"
 yugoslavia_news.20.t: "New Leader of the Yugoslav Revival"
 yugoslavia_news.20.d: "The drive to restore Yugoslavia has a new center of gravity. §Y[GetYugoDominantName]§! now holds the most influence across the former republics and is best placed to convene the federation."
 yugoslavia_news.20.a: "We will carry the movement"
 yugoslavia_news.20.b: "Watch the Balkans closely"
 formed_yugoslavia: "Glory of Yugoslavia"
 formed_yugoslavia_desc: "The restored federation has assumed responsibility for integrating the territory, institutions, and constituent peoples of the former Yugoslav republics."
 yugoslavia_restored: "Yugoslavia"
 yugo_bloc_dominant: "Leader of the Yugoslav Revival"
 yugo_bloc_dominant_desc: "We hold more influence across the former republics than any other successor state. Our capital is the natural meeting point for talks on a restored federation."
 yugo_bloc: "Yugoslav Reunification"
 yugo_bloc_desc: "Support for a restored Yugoslavia must reach 75 percent in every surviving successor state before unification can proceed. The state with the most influence across the former republics leads the revival: §Y[GetYugoDominantName]§!.\n\n$yugo_nost_overview$"
 yugo_bloc_map: "Yugoslav Reunification"
 yugo_promote_nostalgia: "Promote Yugonostalgia in [FROM.GetName]"
 yugo_promote_nostalgia_desc: "Fund cultural exchange, shared media, and joint commemorations to build support for a restored federation. Requires meaningful influence over the target state."
 yugo_promote_own_nostalgia: "Cultivate Yugonostalgia at Home"
 yugo_promote_own_nostalgia_desc: "Fund domestic commemorations, school curricula, and public media that cast the old federation in a favorable light. Slower and costlier than promoting nostalgia abroad, but it needs no foothold in another state."
 yugo_form_federation: "Convene the Federation"
 yugo_form_federation_desc: "Call every surviving successor state into a restored Yugoslav federation. States that refuse hand the federation a unification war goal. Only the dominant member may convene the talks, and only once every successor supports reunification."
 news.85.t: "Yugoslavia Restored"
 news.85.desc: "A restored Yugoslav federation has been proclaimed after its architects secured support across the former republics. The new state claims the political and strategic legacy of the federation dissolved during the 1990s."
 news.85.a: "A Balkan state returns"
 yugoslavia_not_restored_tt: "Yugoslavia has §Rnot§! already been restored by another successor state"
