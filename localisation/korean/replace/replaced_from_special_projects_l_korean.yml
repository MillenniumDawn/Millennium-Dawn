 sp_secure_military_network: "보안 군사 네트워크"
 sp_secure_military_network_desc: "지휘부, 센서, 부대를 복원력 있는 저지연 데이터링크로 연결하는 강화된 암호화 국가 통신 기간망입니다."
 scientist_trait_antarctica_specialist: "극지 연구 전문가"
 scientist_trait_antarctica_specialist_desc: "세계에서 가장 혹독한 환경에서 오히려 능력을 발휘하는 단련된 연구자로, 남극 빙원에서의 작전을 유지하고 발전시키는 데 특화되어 있습니다."
 scientist_trait_naval_armament_specialist: "해군 무장 전문가"
 scientist_trait_naval_armament_specialist_desc: "레일건과 어뢰부터 드론 군집과 대응 수단 모듈에 이르기까지 해군 무기에 특화된 전문가입니다."
 scientist_trait_naval_propulsion_specialist: "해군 추진 전문가"
 scientist_trait_naval_propulsion_specialist_desc: "첨단 선박용 동력 장치의 전문가로, 핵 추진과 핵융합 추진으로 군함을 더 빠르고 더 멀리 나아가게 합니다."
 scientist_trait_tank_firepower_specialist: "전차 화력 전문가"
 scientist_trait_tank_firepower_specialist_desc: "첨단 주포와 자동 장전기부터 레일건과 차량 탑재 레이저에 이르기까지 장갑차량 무장의 권위자입니다."
 scientist_trait_tank_armor_specialist: "전차 방호 전문가"
 scientist_trait_tank_armor_specialist_desc: "복합 장갑, 능동 방어 체계, 적응형 위장을 개발하는 장갑차량 생존성 전문가입니다."
 scientist_trait_tank_mobility_specialist: "전차 기동성 전문가"
 scientist_trait_tank_mobility_specialist_desc: "전기 구동부터 보행식 서스펜션에 이르기까지 장갑차량의 동력 전달 장치와 차체 전문가입니다."
 scientist_trait_robotics_specialist: "로봇공학 및 자율성 전문가"
 scientist_trait_robotics_specialist_desc: "자율 체계의 선구자로, 육지, 바다, 하늘의 기계들이 사람의 개입 없이 생각하고, 사냥하고, 일하도록 가르칩니다."
 sp_amws_combat_system_desc: "HACS 플랫폼을 위한 첨단 무기 체계를 개발합니다. 이 프로젝트를 완료하면 §YAMWS-21 전투 체계§! 모듈이 잠금 해제됩니다."
 sp_zamws_advanced_mws_desc: "HACS 플랫폼을 위한 더욱 발전된 다중 무기 체계를 개발합니다. 이 프로젝트를 완료하면 §YXAMWS-24 첨단 다중 무기 체계§! 모듈이 잠금 해제됩니다."
 sp_xciws_close_in_weapon_system_desc: "HACS 플랫폼을 위한 근접 방어 무기 체계를 개발합니다. 이 프로젝트를 완료하면 §YXCIWS-2B 근접 방어 무기 체계§! 모듈이 잠금 해제됩니다."
 sp_close_range_battle_halberd_desc: "HACS 플랫폼을 위한 근접전용 미늘창을 개발합니다. 이 프로젝트를 완료하면 §YType-77 근접전용 미늘창§! 모듈이 잠금 해제됩니다."
 sp_great_sword_desc: "HACS 플랫폼을 위한 강력한 그레이트 소드를 개발합니다. 이 프로젝트를 완료하면 §YBWS-3 그레이트 소드§! 모듈이 잠금 해제됩니다."