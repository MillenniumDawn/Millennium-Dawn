 greece_focus: "Priorités nationales grecques"
 earthquake_diplomacy: "Diplomatie sismique"
 airspace_violations: "Violations de l'espace aérien"
 GRE_debt_crisis: "Crise de la dette"
 GRE_debt_crisis_desc: "La Grèce a une dette extérieure de 300 milliards de dollars, l'une des plus importantes au monde. Cela a créé un énorme problème pour nous, car la dette augmente rapidement et crée des problèmes massifs pour notre économie. Nous devrons trouver un moyen de résoudre le problème de la dette avant qu'il ne devienne incontrôlable."
 GRE_constitutional_crisis: "Crise constitutionnelle"
 GRE_constitutional_crisis_desc: "La Constitution est la dernière chose dont nous devons nous occuper avant de nous consolider au pouvoir et de reconstruire la Grèce telle que nous la concevons."
 GRE_drift_modifiers: "Dérive politique"
 GRE_debt_modifier: "Crise de la dette"
 GRE_debt_modifier_desc: "La crise de la dette a des effets plus sévères selon la manière dont nous gérons notre argent. Cependant, dépenser plus d'argent pour créer des emplois nous sera bénéfique à long terme."
 GRE_press_opposition: "Opposition médiatique"
 GRE_press_opposition_desc: "Les médias ne nous ont pas dépeints sous notre meilleur jour depuis que nous avons rétabli l'ordre au sein du gouvernement, mais il est logique que les faibles craignent les forts."
 GRE_one_party: "État à parti unique"
 GRE_one_party_desc: "Après avoir déclaré que le PCG est le seul parti politique autorisé en Grèce, nous avons le pouvoir de faire tout ce que nous voulons, mais ceci se fait aux dépens du sang qui doit être versé pour garantir la soumission de notre peuple."
 GRE_reorganize_army_idea: "Réorganisation de l'armée"
 GRE_reorganize_army_idea_desc: "Nous ne pouvons pas nous contenter de dégraisser l'armée au point de la rendre dysfonctionnelle. Le moment viendra peut-être où nous aurons besoin de forces armées puissantes et, dans cette éventualité, nous veillerons à ce que notre armée soit loyale et prête."
 GRE_cracked_foundation_desc: "Les fondations de l'État ont été contredites à de si nombreuses reprises que si nous continuons sur la voie actuelle, nous pourrions être confrontés à une redoutable nouvelle révolution. \n\n§RSi notre stabilité tombe en dessous de 30%, nous devrons faire face à une révolution en Grèce !§!"
 GRE_militarist_education_idea: "Éducation militariste"
 GRE_militarist_education_idea_desc: "Le système éducatif a inculqué les valeurs militaires dans son programme, ce qui permet d'être mieux préparé en cas d'attaques soudaines."
 GRE_elam: "Résurgence du Front populaire national"
 GRE_elam_desc: "Le Front populaire national a considérablement intensifié ses efforts pour influencer l'esprit de l'électeur moyen. Nous soupçonnons la Grèce d'être à l'origine de cette « perturbation »."
 GRE_rename_istanbul: "Renommer Istanbul"
 GRE_austerity_tension1: "Négligeables"
 GRE_austerity_tension2: "Mineures"
 GRE_austerity_tension3: "Naissantes"
 GRE_CYP_category: "Le conflit chypriote"
 GRE_CYP_category_desc: "Depuis 1974, Chypre est divisée entre la République turque de Chypre du Nord et la République de Chypre, à la suite d’un coup d’État soutenu par la Grèce qui avait presque uni l’île à cette dernière. En réponse, la Turquie a envahi, entraînant la partition toujours en cours de Chypre — la deuxième plus longue occupation militaire de l’ère moderne, dépassée uniquement par celle d’Israël.\n\n§YForce chypriote-grecque :§! §C[?145.GRE_SUPPORT]%§!\n\n§CLe premier camp à atteindre 100 de force unifiera Chypre sous sa bannière !§!"
 GRE_guarantee_turkish_property: "Déclencher des manifestations pour l’unification à travers Chypre"
 GRE_guarantee_turkish_property_desc: "En suscitant le désir d'unité, nous créerons le chaos dans toute l'île de Chypre, ce qui nous donnera l'occasion de nous renforcer pendant que les turcs s'occuperont des protestations"
 GRE_please_south: "S'adresser aux chypriotes grecs"
 GRE_please_north: "Propagande anti-turque"
 TUR_CYP_incite_riot: "Inciter aux émeutes dans le Chypre du Sud"
 TUR_CYP_propaganda_north: "Propagande anti-grecque du Nord"
 TUR_CYP_propaganda_south: "Propagande anti-grecque du Sud"
 TUR_attack_CYP_strength: "Attaquer les forces chypriotes grecques"
 GRE_attack_turkish_strength: "Attaquer les forces chypriotes turques"
 GRE_south_50_TT: "§HLa force chypriote grecque doit être de 55%§!"
 GRE_north_50_TT: "§HLa force chypriote turque doit être de 55%§!"
 TUR_unify_cyp: "§GChypre du Sud s'unifiera avec Chypre du Nord !§!"
 GRE_unify_cyp: "§GChypre du Nord et Chypre du Sud s'uniront sous la bannière de la Grèce !§!"
 TUR_unify_cyprus: "Unifier Chypre"
 GRE_unify_cyprus: "Unifier Chypre"
 GRE_failures_capitalism_TT: "§RL'effet des échelles de priorité dépend de l'ampleur de la crise de la dette.§!"
 GRE_communist_takeover_TT: "§GThe Greek people demand elections!§!\n\nEnsure you have enough Political Power saved for this. If you §Rfail§! to elect and form a government you will §Rneed to hold another extraordinary election§! to empower §Y[communist_state_L]§!"
 GRE_fascist_takeover_TT: "§GLe peuple grec exige des élections !§!\n\nAssurez-vous d'avoir suffisamment de poids politique en réserve pour cela. Si vous §Rne parvenez pas§! à élire et à former un gouvernement, vous §Rdevrez organiser de nouvelles élections extraordinaires§! pour donner le pouvoir au §Y[Nat_Fascism_L]§!."
 GRE_civil_units_TT: "§RIl nous est proposé de déplacer notre armée vers les frontières de la Grèce centrale, où nous pourrons tenter de retenir les rebelles.§!"
 GRE_worsen_debt_TT: "§RAggravation de la crise de la dette !§!"
 GRE_lowers_debt_TT: "§GAllégement de la crise de la dette !§!"
 GRE_end_austerity_TT: "§GFin des manifestations contre l'austérité !§!"
 GRE_increase_drift_TT: "§GAugmentation de la dérive politique vers ce parti !§!"
 GRE_process_sco_member_tt: "§YDébut du processus d'intégration au sein de l'OCS.§!"
 GRE_enemy_blocked_us: "§RSi ces décisions sont indisponibles, cela signifie que l'ennemi nous a temporairement bloqués ou que nous ne remplissons pas d'autres conditions !§!"
 GRE_unable_to_gain_strength: "§HLes Chypriotes grecs§! seront §GINCAPABLES§! de gagner en force pendant §H60 jours§!"
 TUR_unable_to_gain_strength: "§HLes Chypriotes turcs§! seront §GINCAPABLES§! de gagner en force pendant §H60 jours§!"
 GRE_south_-5_TT: "Les §Hchypriotes grecs§! §Rperdront§! §H5 en force !§!"
 GRE_north_5_TT: "Les §Hchypriotes turcs§! §Ggagneront§! §H5 en force !§!"
 GRE_south_-20_TT: "Les §Hchypriotes grecs§! §Rperdront§! §H20 en force !§!"
 GRE_gain_5_strength: "Les §Hchypriotes grecs§! §Ggagneront§! §H5 en force !§!"
 GRE_gain_20_strength: "Les §Hchypriotes grecs§! §Ggagneront§! §H20 en force !§!"
 TUR_gain_20_strength: "Les §Hchypriotes turcs§! §Ggagneront§! §H20 en force !§!"
