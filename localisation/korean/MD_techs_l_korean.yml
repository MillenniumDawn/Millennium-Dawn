 INFANTRY_TITLE_SUPPORT_DRONES: "화력 지원 드론"
 INFANTRY_TITLE_SUPPORT_DRONES_DESC: "화력 지원 드론은 자동 또는 원격 조종 무기 플랫폼으로, 아군 병사가 몸을 노출하지 않고도 안전하게 병력을 지원하는 데 사용할 수 있습니다."
 INFANTRY_TITLE_AUGMENTED_VISION: "증강 시야"
 INFANTRY_TITLE_AUGMENTED_VISION_DESC: "병사의 헬멧에 장착된 증강현실 및 가상현실 디스플레이는 귀중한 전장 데이터를 제공하는 데 사용할 수 있습니다."
 INFANTRY_TITLE_EXOSKELETON: "외골격"
 INFANTRY_TITLE_EXOSKELETON_DESC: "외골격은 착용자의 힘, 속도, 민첩성을 강화할 수 있는 동력 슈트입니다."
 armor_subtitle_hull_desc: "주력 전차는 우리 군이 운용할 수 있는 가장 무거운 지상 차량입니다. 주된 목적은 아군에 화력을 지원하고 적대적인 장갑 표적과 교전하는 것입니다."
 armour_subtitle_computer_desc: "컴퓨터 체계는 우리 장갑차량이 작동하는 데 필요한 조준 체계, 사격 통제, 카메라, 기타 전자전 장치로 이루어져 있습니다."
 armor_subtitle_armour_desc: "첨단 장갑에는 복합 장갑과 폭발 반응 장갑이 포함되며, 단순한 강철이나 알루미늄 장갑보다 우리 장갑차량을 보호하는 데 더 효과적일 수 있습니다."
 armour_subtitle_engine_desc: "엔진은 차량을 추진하는 장치입니다. 대부분의 장갑차량은 디젤 엔진으로 작동하지만, 더 특이한 다른 선택지도 있습니다."
 armour_subtitle_weapons_desc: "전차는 일반적으로 소형 90mm 포에서 거대한 152mm 포에 이르기까지 다양한 크기의 포를 주 무기로 사용합니다."
 armor_subtitle_afv_hull_desc: "장갑 전투 차량에는 IFV(보병전투차)와 APC(장갑차)가 포함됩니다. 전자는 아군 보병의 화력 지원과 전진을 이끄는 전력 역할을 하고, 후자는 전장의 택시 역할과 제한적인 화력 지원을 제공합니다."
 armour_subtitle_afv_weapons_desc: "IFV와 APC의 가장 흔한 무기는 여러 종류의 기관포이지만, 기관총과 대구경 돌격포도 드물게 등장합니다."
 MD_ARTILLERY_TITLE: "견인포"
 MD_ARTILLERY_TITLE_DESC: "야포는 우리 병사들의 주된 화력 지원 수단입니다. 초기 모델은 트럭이나 사람의 손으로 옮겨야 하지만, 더 현대적인 모델은 자체 내장 엔진으로 짧은 거리를 빠르게 이동할 수 있습니다."
 ARTILLERY_SP_TITLE_DESC: "자주포는 전차나 트럭 차체에 장착된 야포입니다. 이를 통해 기동성, 탄약 적재량, 승무원 방호가 더 뛰어납니다."
 improved_gunship_ordnance: "건십 무장 개선"
 improved_gunship_ordnance_desc: "공중 건십에 더 나은 탄약과 무기를 장비하여 전투 하늘에서 더 효과적으로 활약하게 할 것입니다."
 ARTILLERY_TITLE_LIGHT_AT: "경량 대전차 유도 미사일"
 ARTILLERY_TITLE_LIGHT_AT_DESC: "경량 ATGM(대전차 유도 미사일)은 개별 병사나 화기 분대가 휴대할 수 있을 만큼 가벼운 대장갑 무기입니다. 개인 휴대 대전차 무기로 충분하지 않을 때를 대비한, 우리 보병의 주된 중대전차 화기입니다."
 ARTILLERY_TITLE_HEAVY_AT: "중량 대전차 유도 미사일"
 ARTILLERY_TITLE_HEAVY_AT_DESC: "중량 ATGM(대전차 유도 미사일)은 경량 모델에 비해 더 강력한 대장갑 무기입니다. 무게와 크기 때문에 전투 중 효과적으로 이동하려면 차량에 탑재해야 합니다."
 ARTILLERY_TITLE_SP_AA: "자주대공포"
 ARTILLERY_TITLE_SP_AA_DESC: "자주 대공 차량은 개인 휴대 방공 체계보다 이동성이 좋고 훨씬 강력한 방식으로 적 항공기에 대항할 수 있게 해 줍니다."
 ARTILLERY_TITLE_AA: "휴대용 방공 시스템(MANPADS)"
 ARTILLERY_TITLE_AA_desc: "휴대용 방공 시스템(MANPADS)은 병사 한 명이 휴대할 수 있을 만큼 가벼운 대공 무기입니다. 이를 통해 병사들은 전용 대공 무기보다 훨씬 짧은 사거리와 낮은 효율이지만 항공기, 헬리콥터, 미사일과 맞서 싸울 수 있습니다."
 NAVAL_TITLE_CANNONS_DESC: "해군 함포는 초계정이나 지상 목표물 같은 소형 표적을 더 짧은 사거리에서 공격하는 데 쓸 수 있습니다. 공중 표적에 대해서는 제한적으로만 쓸모가 있습니다."
 NAVAL_TITLE_RAILGUNS: "레일건"
 NAVAL_TITLE_RAILGUNS_DESC: "레일건은 전자기력으로 고속까지 가속한 운동 에너지 탄약을 사용합니다. 발사체는 믿기 어려운 속도까지 가속되어 뛰어난 관통력과 명중률 특성을 지닙니다."
 NAVAL_TITLE_POINT_DEFENSE_SYSTEM_DESC: "근접 방어 체계는 주 미사일 방어가 날아오는 미사일과 항공기를 격추하지 못했을 때 함선을 보호하도록 설계되었습니다."
 AIR_TITLE_TRANSPORT_HELICOPTER_DESC: "수송 헬리콥터는 기동성이 매우 높은 공중 기동 부대를 만들 수 있게 해 줍니다. 헬리콥터는 우리 병력이 다양한 지형을 매우 빠르게 이동할 수 있게 합니다. 다만 이 병력이 전투에서 효과적으로 싸우려면, 취약해지지 않도록 적 병사들로부터 상당히 먼 곳에 내려놓아야 합니다."
 AIR_TITLE_PLANE_LIGHT_AIRFRAME: "경량 기체"
 AIR_TITLE_PLANE_LIGHT_AIRFRAME_DESC: "경량 기체로 민첩한 전투기와 훈련기를 제작할 수 있습니다"
 AIR_TITLE_PLANE_MEDIUM_AIRFRAME: "중형 기체"
 AIR_TITLE_PLANE_MEDIUM_AIRFRAME_DESC: "중형 기체는 가장 흔한 항공기 구성 중 하나로, 다목적 전투기, 근접 항공 지원기, 기타 다양한 항공기를 제작할 수 있습니다."
 AIR_TITLE_PLANE_HEAVY_AIRFRAME: "대형 기체"
 AIR_TITLE_PLANE_HEAVY_AIRFRAME_DESC: "대형 기체는 폭격기, 해상 초계기, 수송기, 건십을 설계하는 데 사용됩니다."
 AIR_TITLE_PLANE_AVIONICS: "항전 장비 및 드론"
 AIR_TITLE_PLANE_AVIONICS_DESC: "항전 장비는 비행기의 모든 전자 조종 장치와 각종 감시 장치로 이루어져 있습니다. 발전된 항전 장비가 있으면 원격 조종 항공기, 즉 독자적으로 표적을 타격할 수 있는 드론을 만들 수 있습니다."
 AIR_TITLE_PLANE_ENGINE: "엔진 & 연료"
 AIR_TITLE_PLANE_ENGINE_DESC: "대부분의 현대 항공기는 제트 엔진의 힘으로 비행하지만 다른 선택지도 있습니다. 더 큰 연료 탱크나 공중 급유처럼 항공기의 항속 거리를 늘리는 여러 방법도 있습니다."
 AIR_TITLE_PLANE_WINGFORM: "날개 형상 및 소재"
 AIR_TITLE_PLANE_WINGFORM_DESC: "날개 형상은 항공기의 전체적인 모양을 결정합니다. 날개 모양마다 장단점이 다릅니다. 새로운 소재 기술에도 시간을 투자하면 항공기를 개선할 수 있습니다."
 AIR_TITLE_PLANE_NAVWEAP: "해상 무기"
 AIR_TITLE_PLANE_NAVWEAP_DESC: "항공기가 탑재하는 해상용 무기에는 미사일, 어뢰, 기뢰가 있습니다. 잠수함을 상대로 항공기를 운용하려면 잠수함 선체의 철을 탐지할 수 있는 자기 이상 탐지기(MAD)를 항공기에 장착해야 합니다."
 AIR_TITLE_PLANE_AGWEAP: "공대지 무기"
 AIR_TITLE_PLANE_AGWEAP_DESC: "공대지 무기에는 일반적으로 여러 종류의 미사일과 폭탄이 포함되지만 기관포도 사용할 수 있습니다. 항공기의 지상 표적 타격 능력을 높이려면 미사일을 표적으로 유도하는 데 도움이 되는 조준 포드(TGP)를 장착할 수 있습니다."
 AIR_TITLE_PLANE_AAWEAP: "공대공 무기"
 AIR_TITLE_PLANE_AAWEAP_DESC: "항공기끼리 싸울 때는 대개 미사일을 사용합니다. 많은 항공기가 예비용으로 기관포도 갖추고 있지만 전투에서는 거의 쓰이지 않습니다. 적 미사일에 맞서 싸우는 데 도움이 되도록 항공기에 플레어와 기타 대응 수단을 장착해야 합니다."
 bba_aircraft_folder: "고정익 항공기"
 bba_aircraft_folder_desc: "기체와 항공기 모듈"
