 israel_mechanic.13.t: "거셈 솔레이마니 암살!"
 israel_mechanic.13.d: "최근 거셈 솔레이마니 장군이 이란 밖에 있던 중 드론 공격으로 암살되었습니다. 많은 이란 전문가들은 이번 암살이 이스라엘과 미국 정부의 소행이라고 생각합니다. 그러나 공식적인 확인은 없었습니다. 이란은 이날을 오래도록 기억할 것입니다..."
 israel_mechanic.13.a: "흥미롭군."
