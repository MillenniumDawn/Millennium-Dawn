 ISR_attack_text4_loc: "  §R붉은색§! 영향력 20% 초과"
 ISR_attack_text5_loc: "  이 지도는 §Y중동§! 국가들에 대한 §R이란§!의 영향력을 보여줍니다.\n  우리 요원들이 §Y매일§! 이 지도를 갱신하여 \n  상황을 파악할 수 있습니다. 우리는 이란의 주요 기지에 대해 §Y공격§!을 개시하여 \n  이란의 영향력을 줄일 수 있습니다."
