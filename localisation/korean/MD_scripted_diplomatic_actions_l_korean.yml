 PROPOSE_MUTUAL_INVESTMENT_TREATY_TOOLTIP: "현재 §Y[This.GetNameWithFlag]§!와 §Y상호 투자 협정§!중이지 않음\n"
 PROPOSE_MUTUAL_INVESTMENT_TREATY_TITLE: "§Y상호 투자 조약§! 제안"
 PROPOSE_MUTUAL_INVESTMENT_TREATY_ACTION_DESC: "우리는 이 나라와 §Y상호 투자 조약§!을 제안할 수 있습니다. 이는 두 나라 간의 투자를 촉진하기 위한 것입니다. 이 조약은 양국에 §Y투자 비용 및 기간§!을 §G5§!%만큼 줄여주며, 각 나라에 §G~1§!%의 영향을 미칩니다.\n\n\nAI가 이 협정에 어떻게 반응할지에 영향을 미치는 요소는 다음과 같습니다: 동일한 정부, 의견, 영향력, 파벌, EU 회원국 여부, NATO 회원국 여부.\n\n또한, 만약 대상 국가가 AI라면, 그들은 §YPermanent Investment Target§! 풀에 추가되어, 당신에게 투자하려고 할 것입니다."
 DIPLO_ACTION_PROPOSE_MUTUAL_INVESTMENT_TREATY: "§Y상호 투자 조약§!을 제안하면 상대국이 수락할 경우 §Y무역 영향력§!이 §G30§!, §Y[This.GetNameWithFlag]§!와의 §Y관계§!가 §G30§! 상승합니다. 양국은 또한 서로에 대해 약 §G~1%§!의 §Y영향력§!을 얻게 됩니다. 아울러 양국은 서로에 대한 §Y투자 비용 및 기간§!이 §G5§!% 감소합니다."
 DIPLO_ACTION_PROPOSE_MUTUAL_INVESTMENT_TREATY_ACCEPT: "[THIS.GetNameWithFlag]이(가) §Y상호 투자 조약§!에 §G서명했습니다§!"
 DIPLO_ACTION_PROPOSE_MUTUAL_INVESTMENT_TREATY_ACCEPT_DESC: "[THIS.GetNameWithFlag]는 §Y상호 투자 조약§!에 서명했습니다. 그 결과, 우리 두 국가는 빠르게 가까워지고 있으며, 우리 나라의 투자자들은 이미 새로운 비즈니스 기회에 관심을 보이고 있습니다."
 DIPLO_ACTION_PROPOSE_MUTUAL_INVESTMENT_TREATY_REJECT: "[THIS.GetNameWithFlag]이(가) §Y상호 투자 조약§!을 §R거부했습니다§!"
 DIPLO_ACTION_PROPOSE_MUTUAL_INVESTMENT_TREATY_REJECT_DESC: "[THIS.GetNameWithFlag]는 §Y상호 투자 조약§!을 거부했습니다. 우리 나라의 투자자들은 두 나라가 합의에 도달하지 못한 것에 실망하고 있습니다. 아마 다른 시점에..."
 CANCEL_MUTUAL_INVESTMENT_TREATY_TITLE: "§Y상호 투자 조약§! 종료"
 CANCEL_MUTUAL_INVESTMENT_TOOLTIP: "현재 §Y[This.GetNameWithFlag]§!와(과) §Y상호 투자 조약§!을 체결 중\n"
 CANCEL_MUTUAL_INVESTMENT_TREATY_ACTION_DESC: "우리는 양국 간 §Y상호 투자 조약§!을 더 이상 유지하는 데 관심이 없습니다. 이제 §Y상호 투자 조약§!을 종료하고 미래를 위한 새로운 거래를 다시 구축할 때입니다. §Y상호 투자 조약§!을 종료하면 다음과 같은 효과가 있습니다:\n\n무역 영향력 §R50§! 감소\n관계 §R25§! 감소 및 협정 파기로 인한 §R15§! 규모의 시간 경과 관계 변동치\n"
 DIPLO_ACTION_CANCEL_MUTUAL_INVESTMENT_TREATY: "불행히도 [THIS.GetNameWithFlag]는 우리 §Y상호 투자 조약§!에서 철수했습니다. 아마 다른 날 또 다른 §Y상호 투자 조약§!을 서명할 수 있을지 모르지만, 현재로서는 더 이상 합의가 없습니다."
