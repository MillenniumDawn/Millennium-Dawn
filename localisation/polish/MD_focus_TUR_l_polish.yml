 TT_TUR_ALIGN_IRAN: "\nGotowość [PER.GetName] do sprzymierzenia się z nami to §Gstrong§! domyślnie\n\n[PER.GetName] jest mniej prawdopodobne, że sprzymierzy się z nami, jeśli\n §R-Nie podążają za wyłaniającą się perspektywą\n -Są już sprzymierzeni z kimś innym§!\n"
 TT_TUR_ALIGN_IRAQ: "\nGotowość [IRQ.GetName] do sprzymierzenia się z nami to §Gstrong§! domyślnie\n\n[IRQ.GetName] jest mniej prawdopodobne, że sprzymierzy się z nami, jeśli\n §R-Podążają za zachodnią perspektywą\n -Są już sprzymierzeni z kimś innym§!\n"
 TT_TUR_ALIGN_SYRIA: "\nGotowość [SYR.GetName] do sprzymierzenia się z nami jest §Rsłaba§! domyślnie\n\n[SYR.GetName] jest bardziej prawdopodobne, że sprzymierzy się z nami, jeśli\n §G-Odzyskali kontrolę nad Hatay\n -Wyrzekli się roszczeń do Hatay§!\n\n[SYR.GetName] jest mniej prawdopodobne, że sprzymierzą się z nami, jeśli\n §R-Nie podążają za Wyłaniającą się Perspektywą\n -Są już sprzymierzeni z kimś innym\n -Aktywnie wspierają PKK§!"
 TT_TUR_ALIGN_SYRIA_DEMANDS: "§Y\nSyria może zażądać ponownego rozpatrzenia statusu Hatay§!"
 TUR_through_troubles: "Przez kłopoty"
 TUR_through_troubles_desc: "Turkey is going through an economical crisis right now. We need to assure our people that the government can get through this"
 TUR_conservative_victory: "Zwycięstwo Konserwatystów"
 TUR_conservative_victory_desc: "The conservatives have won the election and can start bringing more conservative elements of Islam back to Turkey"
 TUR_gulenist_victory: "Zwycięstwo Gülenista"
 TUR_gulenist_victory_desc: "Güleniści wykopali skorumpowanych członków AKP. To wielkie zwycięstwo demokracji"
 TUR_peace_with_religious_leaders: "Pokój z władcami religijnymi"
 TUR_peace_with_religious_leaders_desc: "Chociaż Gülenizm głosi bardzo specyficzną formę islamu, ważne jest, abyśmy wzięli pod uwagę przywódców religijnych Turcji. Musimy pozwolić wszystkim sektom na swobodne szerzenie swoich nauk"
 TUR_gulenist_schools: "Szkoły Gülenista"
 TUR_gulenist_schools_desc: "Edukacja jest jedną z głównych zasad Fethullaha Gülena. Właściwa edukacja utrzymuje umysł w zdrowiu, a ludzie podążają za właściwymi ideami"
 TUR_modern_islam: "Współczesny islam"
 TUR_modern_islam_desc: "Islam jest doskonale zgodny z zachodnimi wartościami i demokracją. Musimy udowodnić światu, że wiara w Boga czyni nas lepszymi i bardziej wyrozumiałymi ludźmi"
 TUR_mobilising_the_movement: "Mobilizujmy Ruch"
 TUR_mobilising_the_movement_desc: "Ruch Gülenista ma członków na całym świecie. Nasza sieć zapewni nam wiele zasobów do wykorzystania"
 TUR_interfaith_dialogue: "Dialog Międzywyznaniowy"
 TUR_interfaith_dialogue_desc: "Gülen teaches us to understand other religions. It is important that Islam has good relations with other major religions of the world, so we aren't left behind. We should hold diplomatic talks with clerics of non-Muslim countries"
 TUR_gulenist_funds: "Fundusze Gülenista"
 TUR_gulenist_funds_desc: "Organizacja Gülenistów posiada miliardy dolarów w różnych fundacjach i przedsiębiorstwach. Powinniśmy zmobilizować te fundusze, aby pomóc reżimowi"
 TUR_gulenist_economists: "Ekonomiści Gülenista"
 TUR_gulenist_economists_desc: "Czerpiąc z dużej puli międzynarodowych specjalistów, możemy zatrudnić ekspertów w dziedzinie ekonomii, którzy będą doradzać naszemu rządowi w zakresie prowadzenia gospodarki"
 TUR_gulenist_information: "Informatorzy Gülenista"
 TUR_gulenist_information_desc: "Korzystając z naszej rozległej sieci, możemy łatwiej gromadzić informacje wywiadowcze na temat obcych krajów"
 TUR_gulenist_education: "Edukacja Gülenistyczna"
 TUR_gulenist_education_desc: "Focusing on education will be the key to bringing Turkey forward"
 TUR_the_great_mediator: "Wielki Pośrednik"
 TUR_the_great_mediator_desc: "Fethullah Gülen jest wielkim przywódcą, uczonym i dyplomatą. Jest człowiekiem pokoju i pragnie jedynie pokoju i dobrobytu na świecie"
 TUR_approach_tradition: "Podejdź do Tradycji"
 TUR_approach_tradition_desc: "Nasze zwycięstwo pokazało nam, że ludzie tęsknią za tradycją. Musimy pokazać, że świat islamski przeżywa renesans i wkrótce będzie dominującą kulturą na ziemi"
 TUR_reduce_freedom_of_press: "Ograniczyć wolność prasy"
 TUR_reduce_freedom_of_press_desc: "The so called 'free press' is nothing more than a tool to slander Islam and spread the media's vile secular ideas. We need to limit their ability to operate, and shut them down if we have to."
 TUR_mobilise_the_faithful: "Mobilizujmy wiernych"
 TUR_mobilise_the_faithful_desc: "Ruch Gülenista jest rozległy i ma wielu członków. Powinniśmy zachęcać naszych członków do migracji do Turcji"
 TUR_convert_radicals: "Konwersja rodników"
 TUR_convert_radicals_desc: "Islam, którego naucza Gülen, jest jedyną słuszną formą islamu. Jest wielu, którzy się z tym nie zgadzają i należy ich wykorzenić"
 TUR_beacon_of_islam: "Wielki Uczony"
 TUR_beacon_of_islam_desc: "Fethullah Gülen jest największym znawcą islamu, a jego nauki będą znane na całym świecie. Oczywiście głoszenie konserwatywnego islamu może mieć pewne skutki uboczne…"
 TUR_economic_reforms: "Reformy ekonomiczne"
 TUR_economic_reforms_desc: "Gospodarka jest w opłakanym stanie i musimy ją szybko poprawić. Obecnie gospodarka w dużym stopniu opiera się na inwestycjach zagranicznych, co musimy zmienić"
 TUR_increase_unemployment_insurance: "Zwiększyć ubezpieczenie na wypadek bezrobocia"
 TUR_increase_unemployment_insurance_desc: "The economic crisis has left many Turks without a job. While it will greatly hurt the government's budget, we need to increase the unemployment benefits to keep people alive. It will also inject a small amount of money into the economy, hopefully increasing consumption"
 TUR_small_imf_loans: "Małe pożyczki MFW"
 TUR_small_imf_loans_desc: "The IMF has offered a small loan of $11.4 billion. Many analysts suggest that this is nowhere near enough to help the Turkish economy, but it's doubtful we'll be able to get more from the IMF"
 TUR_large_imf_loans: "Duże pożyczki MFW"
 TUR_large_imf_loans_desc: "With more concessions, we might be able to negotiate with the IMF so that we would be granted a larger loan from them."
 TUR_reduce_foreign_investors: "Zmniejsz zależność od inwestorów"
 TUR_reduce_foreign_investors_desc: "Większość tureckiej gospodarki opiera się na ciągłych inwestycjach zagranicznych i przepływie kapitału z innych krajów. Musimy zasilić gospodarkę funduszami rządowymi i zmniejszyć naszą zależność od rynków zagranicznych"
 TUR_more_foreign_investors: "Zwiększ zaufanie do inwestorów"
 TUR_more_foreign_investors_desc: "Będziemy musieli wykorzystać inwestorów zagranicznych, aby pozyskać więcej kapitału z innych krajów"
 TUR_sell_government_companies: "Sprzedawaj spółki rządowe"
 TUR_sell_government_companies_desc: "Aby uzyskać dodatkowe przychody, musimy sprzedać część spółek będących obecnie własnością państwa tureckiego"
 TUR_loosen_industrial_regulations: "Poluzuj regulacje przemysłowe"
 TUR_loosen_industrial_regulations_desc: "Aby pobudzić wzrost, musimy poluzować regulacje, które nakładamy na przemysł. To z pewnością pobudzi gospodarkę"
 TUR_economic_crisis_over: "Plan naprawy po kryzysie gospodarczym"
 TUR_economic_crisis_over_desc: "We need to establish an economic recovery plan as soon as possible if we expect the Turkish nation to thrive monetarily. If we do not, we put our people's lives and jobs at risk and we cannot afford such a massive loss."
 TUR_western_development: "Rozwój na Zachodzie"
 TUR_western_development_desc: "Musimy rozwijać zachód naszego kraju, ponieważ tam znajduje się większość naszych głównych miast, a ludzie oczekują wyższego standardu życia"
 TUR_centeral_development: "Rozwój Centralny"
 TUR_centeral_development_desc: "Nasza stolica, Ankara, położona jest w centrum naszego kraju. Musimy poprawić warunki życia tam, a także w otaczających je miastach, aby nasz establishment polityczny miał podstawy legitymizacji"
 TUR_eastern_development: "Rozwój na Wschodzie"
 TUR_eastern_development_desc: "Zbyt długo zaniedbywaliśmy wschodnie prowincje, a ludzie zasługują na coś lepszego. Modernizacja tamtejszej infrastruktury znacznie bardziej pomoże mieszkańcom wsi"
 TUR_southern_attention: "Uwaga południowa"
 TUR_southern_attention_desc: "Podobnie jak Wschód, także Południe naszego kraju zostało nieco zapomniane. Inwestycje na Południu będą konieczne, aby gospodarka mogła się rozwijać"
 TUR_the_industries: "Przemysły"
 TUR_the_industries_desc: "Nasz sektor przemysłowy zaczyna ustępować sektorowi naszych sąsiadów i sojuszników i musimy to zmienić. Część naszego budżetu przeznaczymy tureckim firmom, aby mogły dobrze sobie radzić same"
 TUR_bereket: "Bereket Enerji"
 TUR_bereket_desc: "Bereket provides clean and renewable energy to the Turkish people, and it must continue doing that. Extra funding will give them the ability to expand, and grow"
 TUR_petroli_anonim: "Petrolleri Anonim"
 TUR_petroli_anonim_desc: "Firma Petrolleri Anonim została założona w 1954 roku i osiągnęła wiele dla tureckiego sektora naftowego. Musimy przenieść nacisk przemysłu na produkcję większej ilości ropy dla siebie i reszty świata"
 TUR_the_factories: "Fabryki"
 TUR_the_factories_desc: "Nasze fabryki stają się stare, przestarzałe i nieefektywne. Nowe fabryki zlokalizowane w północno-zachodniej części naszego kraju znacznie poprawią sytuację i będziemy mogli przenieść tam więcej osób do pracy"
 TUR_kipas_textile: "Tekstylia Kipas"
 TUR_kipas_textile_desc: "Kipas Textile produces some of the highest quality fabrics in our nation, and provides our economy with something to export to other countries"
 TUR_arkas_shipping: "Wysyłka Arka"
 TUR_arkas_shipping_desc: "Arkas is a national shipping company that transports goods globally. It is very obvious what we must do, we must focus on getting them new dockyards so that they may continue to get from place to place without a problem"
 TUR_the_people: "Ludzie"
 TUR_the_people_desc: "Udoskonalając naszą gospodarkę, nie możemy zapomnieć o powodzie, dla którego ją ulepszamy, czyli o ludziach. Nasi ludzie będą potrzebować pewnych ulepszeń na poziomie krajowym, które poprawią ich standard życia"
 TUR_hakarri_trabzone_railway: "Kolej Hakkari-Trabzon"
 TUR_hakarri_trabzone_railway_desc: "We will connect Hakkari and Trabzon, for the folks that live in the east of our country. This way, they are able to get to and from the Trabzon port in case they wish to set out to travel"
 TUR_istanbul_airport: "Rozwiń Turkish Airlines"
 TUR_istanbul_airport_desc: "Turkish Airlines is our domestically run airline, and we will start construction on some new airports for them. Our people will be able to easily travel within, and outside of Turkey knowing they are flying on a Turkish plane"
 TUR_the_neighbors: "Sąsiedzi"
 TUR_the_neighbors_desc: "Nasi sąsiedzi, którzy nas otaczają, będą kluczowi w rozwiązaniu naszego kryzysu gospodarczego. Wykorzystamy inwestycje, aby pozyskać wpływy i powiązania gospodarcze między naszymi narodami"
 TUR_look_west: "Nasi zachodni sąsiedzi"
 TUR_look_west_desc: "Nasi zachodni sąsiedzi, Grecja i Bułgaria, mają spore kłopoty gospodarcze. Rozsądnie będzie zatem w nie inwestować, ponieważ stanowią one szybko rozwijające się centra gospodarcze"
 TUR_look_east: "Nasi wschodni sąsiedzi"
 TUR_look_east_desc: "Nasi wschodni sąsiedzi, Iran, Armenia i Gruzja, odnotowali wzrost gospodarczy i upadek. Będziemy inwestować w ich narody, aby pomóc ich gospodarkom w dalszym wzroście"
 TUR_the_military: "Wojsko"
 TUR_the_military_desc: "Wojsko będzie miało kluczowe znaczenie w utrzymaniu naszej gospodarki na rynku, ponieważ miejmy nadzieję, że nie będzie próbowało pozbawić nas władzy"
 TUR_fix_samsites: "Repair SAM Sites"
 TUR_fix_samsites_desc: "The SAM sites in our nation are starting to grow old. If we expect them to function properly, we are going to have to repair them."
 TUR_ministry_of_defense_repairs: "Zadowolić Ministerstwo Obrony"
 TUR_ministry_of_defense_repairs_desc: "Ministerstwo Obrony prosiło nas o otwarcie większej liczby gałęzi przemysłu wojskowego i dzisiaj im to umożliwimy"
 TUR_funds_for_tubitak_sage: "TUBITAK Mędrzec"
 TUR_funds_for_tubitak_sage_desc: "TUBITAK Sage is our nation's Research and Development institute. If we want our military technology to be up to date, we are going to have to give them some extra facilities."
 TUR_stage_two: "Etap drugi"
 TUR_stage_two_desc: "Wkraczamy wreszcie w drugi etap naszego planu gospodarczego. Na tym etapie zwiększymy stymulację gospodarczą i scentralizujemy nasze zarządzanie"
 TUR_economic_stimulation: "Stymulacja ekonomiczna"
 TUR_economic_stimulation_desc: "Zasilimy gospodarkę dodatkowymi funduszami, aby ją rozkręcić i sprawić, by rozwijała się naturalnie, a nie ręcznie"
 TUR_national_power_grid: "Rozbuduj krajową sieć energetyczną"
 TUR_national_power_grid_desc: "Due to an increase in our nation's population, the power grid is unable to properly function as a result of more people using electricity, causing an uptick in blackouts. By expanding it, we will be able to provide stable power for all households across the nation"
 TUR_the_budgets: "Rewizje budżetu"
 TUR_the_budgets_desc: "Musimy zrewidować nasz budżet, aby zobaczyć, co jest dla nas priorytetem, a co nie."
 TUR_funds_for_social_spending: "Priorytetowo traktuj opiekę społeczną"
 TUR_funds_for_social_spending_desc: "Nasi ludzie, zwłaszcza emeryci i niepełnosprawni, aby kontynuować działalność, polegają na funduszach rządowych. Będziemy musieli nadać priorytet pomaganiu im w potrzebie"
 TUR_funds_for_healthcare: "Priorytetowo traktuj opiekę zdrowotną"
 TUR_funds_for_healthcare_desc: "To oczywiste, że ludzie będą chorować. Będziemy musieli ustalić priorytet wydatków na opiekę zdrowotną, aby pomóc potrzebującym wydostać się z tragicznych sytuacji bez konieczności bankructwa"
 TUR_funds_for_tubitak_mam: "TUBITAK Mam"
 TUR_funds_for_tubitak_mam_desc: "TUBITAK Mam is a domestically run research center, and we will need to utilize them to find cheap, but effective new solutions for our people's health and well-being"
 TUR_stage_three: "Etap trzeci"
 TUR_stage_three_desc: "W ramach trzeciego etapu priorytetem będzie przestawienie naszej gospodarki na gospodarkę opartą na wiedzy. W ten sposób nasi ludzie będą zachęcani do zdobycia odpowiedniego wykształcenia, aby zarobić dobre pieniądze"
 TUR_research_grants: "Wydawanie grantów badawczych"
 TUR_research_grants_desc: "We will issue research grants for our scientists and students to find new solutions to everyday life. This way, we will be able to modernize faster than ever before, and it will let us expand our technological capabilities"
 TUR_energy_research: "Badania Energii"
 TUR_energy_research_desc: "In Stage One of our economic plan, we gave funding to an energy company to get our energy sector more efficient. However now we will have to find new ways to deliver and produce this energy so that we can cut down costs where needed"
 TUR_industrial_research: "Badania przemysłowe"
 TUR_industrial_research_desc: "Z każdym dniem chcemy zacząć produkować coraz więcej, dlatego będziemy musieli znaleźć nowe sposoby wytwarzania towarów"
 TUR_electronic_research: "Badania elektroniczne"
 TUR_electronic_research_desc: "Cały świat przechodzi w fazę cyfrową i Turcja nie może być inna. Rozpoczniemy badania nad nowymi technologiami i uruchomimy kilka nowych firm, które mają w tym pomóc"
 TUR_tubitak_space: "Przestrzeń TUBITAKA"
 TUR_tubitak_space_desc: "TUBITAK Space will be our domestically run space technology institute, and they will seriously assist in getting us ahead when the time comes to go to space"
 TUR_sattelite_development: "Rozwój satelitów"
 TUR_sattelite_development_desc: "Opracujemy nową technologię satelitarną, aby zapewnić naszym ludziom łączność z resztą świata, ponieważ nowe technologie zapoczątkowują nową erę łączności między ludźmi"
 TUR_gokturk_launch: "Wystrzelenie satelity Goktürk"
 TUR_gokturk_launch_desc: "Wyślemy w przestrzeń kosmiczną satelitę Goktürk-1A, który pomoże nam uzyskać wysokiej jakości zdjęcia Ziemi, pomagając zarówno naszym ludziom, jak i naszemu wojsku"
 TUR_funds_for_tai: "Rozwiń turecki przemysł lotniczy"
 TUR_funds_for_tai_desc: "Turecki przemysł lotniczy musi zacząć się rozwijać, jeśli chcemy zapewnić ludziom więcej miejsc pracy. Zaczniemy go militaryzować i zaczniemy produkować technologię wojny kosmicznej"
 TUR_asteroid_mining_missions: "Misje wydobywcze asteroid"
 TUR_asteroid_mining_missions_desc: "Zaczniemy wydobywać z asteroidów metale szlachetne i zasoby, abyśmy mogli oszczędzać zasoby tutaj, na Ziemi"
 TUR_drilling_technology: "Technologia wiercenia"
 TUR_drilling_technology_desc: "Teraz, gdy rozpoczęliśmy wydobywanie asteroid, będziemy potrzebować nowych technologii wiertniczych, aby wydobywać większe i wytrzymalsze asteroidy"
 TUR_launching_facilities: "Uruchomienie obiektów"
 TUR_launching_facilities_desc: "Do wystrzeliwania misji na asteroidy potrzebne będą nowe obiekty startowe. Te, które mamy, zaczynają się kruszyć i dezaktualizować, a kluczowe będą nowe"
 TUR_mission_to_moon: "Turcy na Księżycu"
 TUR_mission_to_moon_desc: "Będziemy szkolić tureckich astronautów i przygotować statek kosmiczny do misji na Księżyc"
 TUR_stage_four: "Etap czwarty"
 TUR_stage_four_desc: "Stage Four, the last and final stage for our economy is going to be focused on our domestic policies and people's daily lives"
 TUR_peoples_education: "The People's Education"
 TUR_peoples_education_desc: "Edukacja będzie miała kluczowe znaczenie. Będziemy potrzebować naszych ludzi w szkołach, aby nasza populacja mogła umieć czytać i pisać"
 TUR_the_security_of_people: "Bezpieczeństwo Ludu"
 TUR_the_security_of_people_desc: "Jeśli nasi ludzie nie czują się bezpieczni, jak możemy oczekiwać, że będą uczestniczyć ekonomicznie?"
 TUR_destroying_corruption: "Zniszczenie korupcji"
 TUR_destroying_corruption_desc: "W naszych sektorach gospodarki mamy skorumpowanych ludzi, którzy biorą dla siebie pieniądze, choć można je było przeznaczyć na poprawę sytuacji w kraju"
 TUR_the_great_economy: "Wielka gospodarka turecka"
 TUR_the_great_economy_desc: "W końcu udało nam się osiągnąć to, co planowaliśmy wiele lat temu, krwawym potem i łzami, w końcu osiągnęliśmy Wielką Turecką Gospodarkę!"
 TUR_tubitak: "Przemysł TUBITAK"
 TUR_tubitak_desc: "Zamierzamy rozszerzyć TUBITAK o badania nad nowymi technologiami przemysłowymi, dzięki czemu będziemy mogli jeszcze bardziej usprawnić gospodarkę."
 TUR_turkish_agriculture: "Rolnictwo Tureckie"
 TUR_turkish_agriculture_desc: "Large portions of our nation run on agriculture, and urbanized fields. And because of that, we must double our efforts in providing functional technology for the farmers and workers."
 TUR_turkish_mining: "Górnictwo Tureckie"
 TUR_turkish_mining_desc: "Mamy całkiem przyzwoity przemysł wydobywczy, który może nam pomóc w dostarczaniu materiałów do naszych fabryk i na rynek."
 TUR_expansion_of_fuel_industries: "Ekspansja Przemysłu Paliwowego"
 TUR_expansion_of_fuel_industries_desc: "Rozwój przemysłu paliwowego może być dla nas korzystny w dłuższej perspektywie, gdyż stajemy się coraz bardziej uprzemysłowieni i zmechanizowani."
 TUR_bridge_to_europe: "Most do Europy"
 TUR_bridge_to_europe_desc: "Jesteśmy pomostem do Europy i dlatego jesteśmy dla nich bardzo ważni finansowo. Musimy wykorzystać naszą pozycję na świecie i zarobić jak najwięcej pieniędzy."
 TUR_taek: "TAK"
 TUR_taek_desc: "Turecki Urząd ds. Energii Atomowej, inaczej znany jako TAEK, ma za zadanie planowanie i tworzenie rozwoju energetyki jądrowej w Turcji."
 TUR_double_steel_efforts: "Produkcja stali podwójnej"
 TUR_double_steel_efforts_desc: "Jesteśmy dużym eksporterem stali i metali i będziemy musieli podwoić nasze wysiłki, abyśmy mogli eksportować więcej, a tym samym zarabiać więcej."
 TUR_togg: "TOGG"
 TUR_togg_desc: "TOGG is an acronym for Türkiye'nin Otomobili Girişim Grubu. It is an automobile manufacturer of electric vehicles within our nation, and it is best that our government supports them with new facilities."
 TUR_textiles_ethiopia: "Tureckie tekstylia w Etiopii"
 TUR_textiles_ethiopia_desc: "Prowadzimy kilka małych fabryk tekstylnych w Etiopii, ale byłoby lepiej, gdybyśmy je podwoili, abyśmy mogli zwiększyć nasze wpływy gospodarcze."
 TUR_standardize_construction_regulations: "Przepisy budowlane"
 TUR_standardize_construction_regulations_desc: "Wszędzie obowiązują nasze przepisy budowlane, co prowadzi do powstawania niestabilnych budynków, co z kolei prowadzi do katastrof. Będziemy musieli zaostrzyć nasze przepisy i ujednolicić je, aby były uniwersalne w całym kraju."
 TUR_telecommunications_authority: "Urząd Telekomunikacji"
 TUR_telecommunications_authority_desc: "Urząd Telekomunikacji, w skrócie ICTA, ma za zadanie tworzenie standardowych centrów komunikacyjnych i linii telekomunikacyjnych."
 TUR_tighten_housing_regulation: "Regulamin mieszkaniowy"
 TUR_tighten_housing_regulation_desc: "Over 40% of our nation's housing does not conform with standard regulations, we are going to have to change that. We will run mandatory inspections and fix whatever is necessary."
 TUR_the_mafia: "Mafia"
 TUR_the_mafia_desc: "Mafia sprawia nam problemy już od dłuższego czasu i najlepiej będzie, jeśli zaczniemy powoli pozbywać się jej wpływów z naszego narodu, jeśli chcemy prawdziwej stabilności."
 TUR_end_of_organized_crime: "Celuj w przestępczość zorganizowaną"
 TUR_end_of_organized_crime_desc: "Organized Crime is quite common in Turkey, in fact, it is running rampant now more than ever. We are going to have to target organized crimes and criminals, so that they stop disrupting daily life, and stop making governing so difficult."
 TUR_combat_their_influence: "Zwalcz ich wpływy"
 TUR_combat_their_influence_desc: "We need to combat the Mafia's influence to prevent our youth from being sworn into a life of never-ending crime."
 TUR_begin_arrests: "Rozpocznij aresztowania"
 TUR_begin_arrests_desc: "Though our list of high-priority criminals is quite small at the moment, we should at least start by arresting the current suspects that we know of. We can perhaps use them to discover more of them through interrogation."
 TUR_anti_mafia_initiative: "Kampania Antymafijna"
 TUR_anti_mafia_initiative_desc: "Rozpoczynając kampanie zniechęcające do przyłączania się do mafii, możemy uratować życie niezliczonej liczby osób."
 TUR_awareness_campaigns: "Programy w szkołach"
 TUR_awareness_campaigns_desc: "Niezbędne jest, abyśmy w młodym wieku rozpoczęli nastroje antymafijne i możemy to osiągnąć, uruchamiając programy w szkołach."
 TUR_tighten_police_training: "Wzmocnić szkolenie policji"
 TUR_tighten_police_training_desc: "Nasza policja może czasami zachowywać się nieprofesjonalnie i w tym celu będziemy musieli ulepszyć jej szkolenie."
 TUR_install_cctv: "Nowy monitoring"
 TUR_install_cctv_desc: "Niestety wygląda na to, że jedynym sposobem na złapanie przestępców na gorącym uczynku będzie obserwacja. Pomimo pewnych sprzeciwów nie mamy innego wyjścia, jak tylko to zrobić."
 TUR_tighten_border_patrol: "Zwiększyć Straż Graniczną"
 TUR_tighten_border_patrol_desc: "Criminals are bringing in drugs and illegal goods from the outside, and this is a clear indicator that our border patrol is not effective. We are going to increase border patrol to mitigate the flow of illegal goods from other borders."
 TUR_assistance_to_iraq: "Pomoc dla Iraku"
 TUR_assistance_to_iraq_desc: "Irak tonie obecnie w przestępczości, a duża jej część ma związek z narkotykami. Możemy zapewnić im naszą wiedzę specjalistyczną, aby mogli kontrolować swój problem narkotykowy."
 TUR_only_getting_started: "Dopiero się zaczyna"
 TUR_only_getting_started_desc: "We are only getting started. Now that the government has been overrun by our organizations, we can start shaping the region, and ultimately the world to better fit our agenda, the Mafia's Agenda."
 TUR_contact_italian_mafia: "Skontaktuj się z włoską mafią"
 TUR_contact_italian_mafia_desc: "Włoska mafia szaleje we Włoszech, a rząd nie jest zbyt skuteczny w jej powstrzymywaniu. Możemy zaoferować im wsparcie i pomoc w umocnieniu ich pozycji."
 TUR_utilize_gray_wolves: "Sprzymierz się z Szarymi Wilkami"
 TUR_utilize_gray_wolves_desc: "Szare Wilki pomogły nam w przeszłości i dlatego możemy teraz sprzymierzyć się z nimi i sprowadzić je do pomocy w rządzeniu krajem."
 TUR_start_global_campaign: "Kampania Globalna"
 TUR_start_global_campaign_desc: "Our job is not done yet, we need to go international. The Mafia's reach is going to be unlimited, and we will benefit from the chaos."
 TUR_defund_police: "Defensuj policję"
 TUR_defund_police_desc: "The Police are quite disloyal to us, and for that reason, we need to curb their ability to fight against us. We will do this by defunding them, and seizing their weapons for ourselves."
 TUR_invite_landowners: "Zaproś właścicieli gruntów"
 TUR_invite_landowners_desc: "Właściciele ziemscy to zamożna elita i zamiast być z nimi wrogami, powinniśmy się z nimi sprzymierzyć. Możemy zyskać ich wsparcie i zarobić więcej pieniędzy, będąc z nimi przyjaciółmi."
 TUR_take_out_iran: "Przejąć Iran"
 TUR_take_out_iran_desc: "Jeśli pokonamy Iran, będziemy mieli dostęp do znacznie większej liczby krajów. Najedziemy Iran i wykorzystamy go jako centrum eksportu naszych wpływów dalej do Azji."
 TUR_central_asia: "Do Azji Środkowej"
 TUR_central_asia_desc: "Rynek środkowoazjatycki jest gotowy na towary mafijne. Otworzymy te rynki i wykorzystamy je do osiągnięcia zysku."
 TUR_the_armed_forces_of_turkiye: "Siły Zbrojne Turcji"
 TUR_the_armed_forces_of_turkiye_desc: "The Armed Forces of Turkey, or otherwise known as the TSK, are tasked with protecting Turkey's territorial integrity and its people."
 TUR_ground_force: "Wojsk Lądowych"
 TUR_ground_force_desc: "The Land forces are the men who have boots on the ground, fighting the wars within a nation's borders. The ground forces mainly consist of Infantry and Mechanized units."
 TUR_battery_bases: "Baterie TEL"
 TUR_battery_bases_desc: "Nasz arsenał akumulatorów TEL zaczyna się starzeć, a awarie nie są rzadkością. Będziemy musieli jak najszybciej zbudować nowe, aby zapewnić elastyczny system startu."
 TUR_fortify_east: "Umocnić Wschód"
 TUR_fortify_east_desc: "Najwięcej zawirowań doświadczył wschód naszego kraju. Od wewnętrznego oporu, aż po inwazje armii wroga, nieumocnienie Wschodu byłoby głupim posunięciem."
 TUR_fortify_west: "Umocnić Zachód"
 TUR_fortify_west_desc: "Although the West of our country is more secure than the East, we can never be certain. Rising tensions with our neighbors have made the matter tricky, and for that reason we cannot take any risks."
 TUR_silos: "Nowe silosy"
 TUR_silos_desc: "Obecnie nie mamy żadnych silosów rakietowych, a jeśli mamy się spodziewać, że staniemy się wielką potęgą, będziemy musieli je zbudować. Budowa rozpocznie się natychmiast, a my damy znać o tym światu, aby nasi wrogowie trzymali się z daleka!"
 TUR_sam_sites: "Zabezpiecz niebo"
 TUR_sam_sites_desc: "SAM Sites will be crucial to close down our airspace if needed. Due to the nature of modern jets, we cannot always rely on our own aircraft to shoot them down, we will need Sam Sites, and a good amount of them."
 TUR_abm_bases: "Bazy ABM"
 TUR_abm_bases_desc: "Since we were capable of getting Missile Silos and the ability to launch missiles at a reasonable distance, we should also be wary of the other nations that have this same capability. We are going to have to build ABM bases to ensure we are able to shoot down enemy missiles in time."
 TUR_the_soldiers: "Żołnierze"
 TUR_the_soldiers_desc: "Nasi żołnierze tworzą naszą armię. Będziemy musieli wyposażyć ich w najnowszą i najlepszą technologię, aby byli przygotowani do walki!"
 TUR_tanks: "Nowe czołgi"
 TUR_tanks_desc: "Cała Europa modernizuje swoje zapasy czołgów i Turcja musi zrobić to samo. Poprosimy naszych najlepszych inżynierów o zaprojektowanie nowoczesnego czołgu, z którego nasz naród będzie mógł korzystać przez wiele lat."
 TUR_afvs: "IFV"
 TUR_afvs_desc: "Walka na lądzie zaczyna skupiać się na opancerzonych pojazdach piechoty, takich jak BWP i transportery opancerzone. Będziemy musieli się dostosować i zrobić to samo."
 TUR_troop_carriers: "Transportery wojsk"
 TUR_troop_carriers_desc: "Nasi żołnierze potrzebują sposobu na bezpieczne i szybkie dotarcie na pole bitwy. APC to najlepszy sprzęt, jaki możemy wyprodukować, aby to osiągnąć."
 TUR_mandatory_draft_woman: "Kobiety jako żołnierze"
 TUR_mandatory_draft_woman_desc: "Bez względu na płeć, każdy musi służyć w naszych siłach zbrojnych. Kobiety stanowią połowę naszego społeczeństwa, więc dlaczego mielibyśmy izolować je od przepisów dotyczących poboru do wojska?"
 TUR_other_use_woman: "Women in the Research Sector"
 TUR_other_use_woman_desc: "Potrzebujemy dodatkowego wsparcia, jeśli chodzi o badania, a nasze kobiety nie służą aktywnie w siłach zbrojnych, więc najlepiej będzie je kształcić i pozwolić im stworzyć najnowocześniejszą technologię dla naszych żołnierzy."
 TUR_new_artillery: "Modernizacja zapasów artylerii"
 TUR_new_artillery_desc: "Our Artillery Stockpiles are starting to fall apart. This cannot continue, as artillery has consistently proved itself throughout history to be a way for armies to stage attacks before they even start!"
 TUR_the_airforce: "The Turkish Air Force"
 TUR_the_airforce_desc: "The Turkish Air Force is the aerial branch of the Turkish Armed Forces, and they are mainly tasked with maintaining Turkish Air Superiority in times of combat, whilst also maintaining Turkey's aerial integrity."
 TUR_expand_jet_program: "Krajowy program odrzutowy"
 TUR_expand_jet_program_desc: "Jets are now the key player when it comes to aerial combat. We will need to try and start researching ways to create domestic aircraft so that we can drop our reliance on others."
 TUR_air_superiority: "Myśliwce Przewagi Powietrznej"
 TUR_air_superiority_desc: "If we don't have air superiority, then we don't have anything. Developing air superiority fighters should be a very high priority as we are able to guarantee our close air support's safety."
 TUR_cas: "Zamknij wsparcie powietrzne"
 TUR_cas_desc: "We współczesnej walce nie jest niczym niezwykłym, że siły lądowe wzywają wsparcie powietrzne do pomocy w walce z wrogiem. Z tego powodu Turcja będzie musiała opracować nową technologię CAS na potrzeby produkcji krajowej."
 TUR_open_drone_research: "Drony i helikoptery"
 TUR_open_drone_research_desc: "Często przyćmione przez inne samoloty, drony i helikoptery mogą mieć kluczowe znaczenie w walce, szczególnie dla żołnierzy na ziemi."
 TUR_new_helicopters: "Nowe helikoptery"
 TUR_new_helicopters_desc: "Helikoptery mogą w razie potrzeby dość szybko pomóc w transporcie żołnierzy i innych ludzi na pole bitwy i z pola bitwy, a przeoczenie takiej konieczności byłoby z naszej strony błędem."
 TUR_baryaktars: "Bayraktars"
 TUR_baryaktars_desc: "We will have to develop a domestic drone that is capable of taking out enemy targets from a pretty good distance. The Bayraktar will do just that!"
 TUR_purchase_from_others: "Zajrzyj na Rynek"
 TUR_purchase_from_others_desc: "Nie możemy kłaść zbyt dużego nacisku na naszą gospodarkę w związku z rozwojem krajowych samolotów, dlatego powinniśmy rozważyć zakup niektórych samolotów ze Wschodu i Zachodu."
 TUR_british_jets: "Brytyjscy bojownicy o wyższość"
 TUR_british_jets_desc: "The British Air Force has been around for some time, and their aircraft have aged quite well. It would be a wise decision to buy some aircraft from them."
 TUR_american_jets: "Amerykańskie role wielozadaniowe"
 TUR_american_jets_desc: "America is the global super power, and currently boasts the best air force. This pretty much means that it is in our best interest to buy some Multi-Role Aircraft from them."
 TUR_russian_jets: "Rosyjskie myśliwce uderzeniowe"
 TUR_russian_jets_desc: "Rosjanie są ekspertami w dziedzinie myśliwców szturmowych i są skłonni sprzedać nam kilka jednostek… za odpowiednią cenę."
 TUR_chinese_jets: "Chińskie bombowce"
 TUR_chinese_jets_desc: "Currently we are lacking bomber aircraft in our air force, but the Chinese are not. We can buy a couple of units from them so that we don't fall behind."
 TUR_the_navy: "Marynarka Turecka"
 TUR_the_navy_desc: "Turecka marynarka wojenna jest morską gałęzią tureckich sił zbrojnych, a jej początki sięgają 1081 roku."
 TUR_upgrade_bosphorus_fleet: "Ulepszenia Floty Bosforskiej"
 TUR_upgrade_bosphorus_fleet_desc: "Flota Bosforu składa się głównie z przestarzałych fregat i korwet, co oznacza, że ​​w czasie wojny mogłaby zostać z łatwością zniszczona przez większe i bardziej zaawansowane statki."
 TUR_frigate_upgrades: "Ulepszenia fregat"
 TUR_frigate_upgrades_desc: "Mimo że mamy dość dużą liczbę fregat, nie są one zbyt zaawansowane. Będziemy musieli ulepszyć niektóre z nich, aby mieć pewność, że wytrzymają bitwę."
 TUR_fortify_istanbul: "Wzmocnić Stambuł"
 TUR_fortify_istanbul_desc: "Istanbul is constantly at risk of bombardment and attack due to its close proximity to the Bosphorus. If an enemy fleet tries to pass through, Istanbul will be the closest major city for them to attack and destroy."
 TUR_new_corvettes: "Nowe Corvette"
 TUR_new_corvettes_desc: "Nie mamy wielu korwet, dzięki czemu możemy badać i tworzyć nowe modele, nie martwiąc się zbytnio o modernizację naszej starszej floty."
 TUR_bosphorus_taxation: "Ćwiczenia z Marines"
 TUR_bosphorus_taxation_desc: "Musimy przeprowadzić ćwiczenia z turecką piechotą morską, abyśmy byli gotowi na ewentualną inwazję morską."
 TUR_mediteranean_fleet: "Mediterranean Fleet"
 TUR_mediteranean_fleet_desc: "Our Mediterranean fleet is of a very high priority, as it is the fleet that ensures our nation an access to the outside without having to interfere with the Aegean."
 TUR_new_submarine: "Nowe łodzie podwodne"
 TUR_new_submarine_desc: "Potrzebujemy łodzi podwodnych, aby móc zaskakiwać wrogie statki od dołu."
 TUR_new_cruisers: "Nowe krążowniki"
 TUR_new_cruisers_desc: "Cruisers are arguably some of the most important ships we could have deployed, as they are typically the largest ship in a fleet besides an aircraft carrier."
 TUR_new_heli_pads: "Aircraft Carriers"
 TUR_new_heli_pads_desc: "Wielkie mocarstwa zaczynają budować nowe lotniskowce, aby potwierdzić swoją dominację na arenie światowej. Musimy zrobić to samo i zacząć budować własne lotniskowce!"
 TUR_tcg_anadolu_plans: "Rozmieścić fregatę w Stambule"
 TUR_tcg_anadolu_plans_desc: "Budujemy najnowocześniejszą fregatę o nazwie TCG Istanbul i jest ona gotowa do użycia!"
 TUR_navy_regulations: "Zaostrzyć przepisy dotyczące marynarki wojennej"
 TUR_navy_regulations_desc: "Jakość należy cenić ponad ilość i dlatego będziemy musieli zaostrzyć przepisy dotyczące produkcji nowych okrętów dla naszej marynarki wojennej."
 TUR_tsk_coup: "TSK w polityce"
 TUR_tsk_coup_desc: "Our people are in grave danger of being overrun by Islamist ideology and their dangerous political views. The TSK is the only viable group that can be trusted with protecting the Turkish Republic's ideals."
 TUR_crush_kurdish_resistance: "Zmiażdżyć kurdyjski ruch oporu"
 TUR_crush_kurdish_resistance_desc: "Stosując skuteczną taktykę, zmiażdżymy kurdyjski opór do tego stopnia, że ​​będzie mu trudno się odbudować."
 TUR_crush_radicalism: "Zmiażdżyć radykalizm"
 TUR_crush_radicalism_desc: "Radykalizm doprowadzi do upadku tego narodu i dlatego musimy go natychmiast zmiażdżyć."
 TUR_upgrading_mili_infrastructure: "Wzmocnij przemysł wojskowy"
 TUR_upgrading_mili_infrastructure_desc: "W ostatnim czasie sporo brakuje naszemu przemysłowi wojskowemu i jeśli chcemy udostępnić odpowiedni sprzęt, będziemy musieli go nieco ulepszyć."
 TUR_subdue_kurdish_independence: "Operacja na Wschodzie"
 TUR_subdue_kurdish_independence_desc: "Ormianie i Gruzini albo już są w OUBZ, albo są potencjalnymi członkami OUBZ. Będziemy musieli przeprowadzić operacje, aby uniemożliwić im dołączenie do tej organizacji."
 TUR_root_out_ulama: "Wykorzenić Ulamę"
 TUR_root_out_ulama_desc: "The Ulama do not wish to see a secular and non-islamist Turkey, and they most likely pray for our downfall. We will purge their positions in office if they have any, and we will replace them with maritime conglomerates."
 TUR_ban_islamist_parties: "Zakazać islamistom udziału w polityce"
 TUR_ban_islamist_parties_desc: "Jednym z problemów, którym nie uporały się poprzednie administracje, był wzrost znaczenia islamistów w naszej polityce. Będziemy musieli natychmiast zakazać im wszystkim udziału w wyborach, aby nasz naród mógł uchronić się przed niebezpiecznymi ideologiami."
 TUR_military_conglomorates: "Konglomeraty wojskowe"
 TUR_military_conglomorates_desc: "W związku z pojawieniem się TSK w polityce tureckiej, wiele kompanii wojskowych nalega na większą reprezentację w naszym rządzie. Moglibyśmy im to z łatwością przyznać, ale kosztem alienacji naszych konglomeratów przemysłowych."
 TUR_train_foreign_troops: "Szkoluj zagraniczne wojska"
 TUR_train_foreign_troops_desc: "Our armed forces has the capability to train other nations' armies without a problem. Doing it will give us influence, and experience."
 TUR_secularist_dominance: "Dominacja sekularyzmu"
 TUR_secularist_dominance_desc: "Secularism will dominate our politics, just like it historically should have. Our nation will follow the path it was always intended to."
 TUR_reform_mit: "Zreformować MIT"
 TUR_reform_mit_desc: "MIT is our nation's intelligence agency, and it needs reforming to better fit the agenda of our Armed Forces."
 TUR_new_airbases: "Nowe przepisy lotnicze"
 TUR_new_airbases_desc: "Passing new regulations for our air force will certainly ensure that our pilots have proper training, and that they use the right strategies during combat."
 TUR_cooperate_mit: "Wykorzystaj MIT"
 TUR_cooperate_mit_desc: "Wykorzystanie zasobów i agentów pracujących w MIT może być przydatne dla naszych sił zbrojnych do gromadzenia informacji i danych."
 TUR_military_dominance: "Hegemonia wojskowa"
 TUR_military_dominance_desc: "The new laws, changes, and overhauls to the system have ensured that the Military will have hegemony and control over all aspects of Turkish Politics."
 TUR_our_society: "Towarzystwo Tureckie"
 TUR_our_society_desc: "Turkish Society is constantly changing and evolving into something new. Though the government's role is typically limited when it comes to this due to certain restraints, there have been times where we needed to intervene and there will be times where we will have to intervene to make changes to our policies."
 TUR_mit: "MIT"
 TUR_mit_desc: "MIT is our nation's intelligence agency tasked with protecting the government and policies of the nation from internal and external threats."
 TUR_domestic_focus: "Krajowe skupienie"
 TUR_domestic_focus_desc: "MIT powinien skupić się na ochronie narodu przed zagrożeniami wewnętrznymi, takimi jak złe podmioty, które chcą obalić rząd poprzez szerzenie niebezpiecznych ideałów."
 TUR_foreign_focus: "Zagraniczne skupienie"
 TUR_foreign_focus_desc: "MIT powinien martwić się zagrożeniami spoza naszych granic, ponieważ ludzie nigdy nie będą chcieli wyrządzić szkody własnemu narodowi."
 TUR_disaster_relief: "Plan katastrofy"
 TUR_disaster_relief_desc: "Obecnie nie mamy planu na wypadek katastrofy, co oznacza, że ​​nie jesteśmy przygotowani do ochrony i niesienia pomocy naszym obywatelom."
 TUR_charity_based: "Ustanowienie systemu kierowanego przez organizację charytatywną"
 TUR_charity_based_desc: "Organizacje charytatywne będą chronić naszych ludzi w przypadku klęski żywiołowej, dzięki czemu będziemy mogli znacznie ograniczyć wydatki."
 TUR_government_reliant: "Utworzenie systemu kierowanego przez rząd"
 TUR_government_reliant_desc: "Zadaniem rządów jest niesienie pomocy obywatelom w przypadku klęski żywiołowej, nawet jeśli oznacza to zwiększenie naszych wydatków."
 TUR_migration_problems: "Problemy migracji"
 TUR_migration_problems_desc: "Zawsze mieliśmy problemy z napływem migrantów do naszego kraju. Ale nigdy nie wiedzieliśmy, co z nimi zrobić, gdy ich problemy zakończą się w rodzinnym kraju."
 TUR_open_door_policy: "Polityka otwartych drzwi"
 TUR_open_door_policy_desc: "Decydując się na politykę otwartych drzwi, możemy łatwo wykorzystać napływających migrantów, aby ulepszyć nasz naród i go rozwinąć."
 TUR_closed_borders: "Zamknij granice"
 TUR_closed_borders_desc: "Jesteśmy w stanie całkowicie pozbyć się migrantów przybywających do kraju, po prostu zamykając nasze granice, zamykając w ten sposób nasze problemy."
 TUR_drug_problem: "Problem narkotyków"
 TUR_drug_problem_desc: "Czasami narkotyki są niezbędne do celów medycznych, ale nie powstrzymuje to niektórych osób przed nadużywaniem systemu i używaniem ich w celach rekreacyjnych, co może mieć niebezpieczne skutki."
 TUR_tighten_punishments: "Twardsza postawa"
 TUR_tighten_punishments_desc: "Będziemy karać każdego, kto używa narkotyków do celów innych niż medyczne, niezależnie od tego, jaka jest wymówka."
 TUR_relax_restrictions: "Złagodź naszą postawę"
 TUR_relax_restrictions_desc: "Nawet jeśli nasi ludzie chcą zażywać narkotyki w celach rekreacyjnych, dlaczego powinno nas to obchodzić? Być może powinniśmy po prostu pozwolić im robić, co chcą, nawet jeśli wiąże się to z pewnym ryzykiem."
 TUR_rising_nationalism: "Powstanie nacjonalizmu"
 TUR_rising_nationalism_desc: "Mimo że nacjonalizm jest dobrą rzeczą, jego nadmiar może być zły. Nacjonalizm wewnątrz narodu spowodował problemy i wybuchy walk pomiędzy grupami mniejszościowymi."
 TUR_utilize_it: "Wykorzystaj nacjonalizm"
 TUR_utilize_it_desc: "We will utilize nationalism to our advantage, this way the enemy will know that the Turkish people won't sit back idly by in times of war."
 TUR_combat_it: "Zwalcz to"
 TUR_combat_it_desc: "Będziemy musieli walczyć z nacjonalizmem, ponieważ nie możemy ryzykować dalszej niestabilności w granicach naszych narodów."
 TUR_turkish_medias: "Media"
 TUR_turkish_medias_desc: "Nasze media rozrastają się, a ze względu na stale rosnące wykorzystanie technologii w kraju, media mogą mieć znaczny wpływ na naszą politykę i popularność partii."
 TUR_deal_with_journalists: "Dziennikarze"
 TUR_deal_with_journalists_desc: "Oczywiście dziennikarze stanowią siłę napędową wszystkich mediów. To oni wyrażają swoje opinie, ale czasami ich opinie mogą przynieść więcej szkody niż pożytku."
 TUR_passive_aggressive_approach: "Podejście pasywno-agresywne"
 TUR_passive_aggressive_approach_desc: "Witam, panie dziennikarzu.. Nie do końca spodobało mi się to, co powiedział pan wczoraj wieczorem na temat moich włosów. Czy sądzi pan, że mógłby pan nieco zmienić sformułowanie…? Oczywiście nie zrobię nic, żeby cię do tego zmusić, ale moi zwolennicy… cóż, czasami potrafią być naprawdę awanturniczy."
 TUR_no_restrictions: "Bez ograniczeń"
 TUR_no_restrictions_desc: "W demokracji funkcjonalnej każdy ma prawo mówić, co chce. Dziennikarze nie będą się różnić w tej kwestii."
 TUR_close_kurdish_medias: "Zamknij kurdyjskie media"
 TUR_close_kurdish_medias_desc: "By closing Kurdish Medias, we will be able to restrict the strength of the PKK and therefore consolidate our control over what information is spread. Though, they may get a little upset."
 TUR_sponsor_kurdish_medias: "Zezwalaj na media kurdyjskie"
 TUR_sponsor_kurdish_medias_desc: "Pokazując Kurdom, że możemy pokojowo współistnieć, złagodzą swoje stanowisko i będą mniej agresywni wobec naszego rządu."
 TUR_combat_cybercrime: "Turecka cyberprzestrzeń"
 TUR_combat_cybercrime_desc: "Musimy zbadać, co dzieje się w tureckiej cyberprzestrzeni, ponieważ niektóre osoby mogą ją wykorzystywać do przestępstw i nielegalnej działalności."
 TUR_heavy_fines: "Nienadzorowana cyberprzestrzeń"
 TUR_heavy_fines_desc: "W Internecie jest całkiem sporo nadzorców i osób, które moderują to, co się w nim dzieje. Dlaczego więc mielibyśmy marnować na to zasoby policji, skoro niewątpliwie moglibyśmy je wykorzystać do lepszych celów."
 TUR_heavy_sentences: "Nadzorowana cyberprzestrzeń"
 TUR_heavy_sentences_desc: "We cannot risk leaving the internet unsupervised, because criminals could possibly use it as a loophole to commit crimes without us knowing!"
 TUR_kurdish_problems: "Kurdyjskie kłopoty"
 TUR_kurdish_problems_desc: "We are having quite the struggle against the PKK in the East of our country, who are fighting for an independent Kurdistan, away from Turkish control. This cannot happen, as it would completely destroy our territorial integrity."
 TUR_mediation: "Mediacja"
 TUR_mediation_desc: "Czasami przemoc nie jest rozwiązaniem. Najlepszym sposobem na dotarcie do PKK i nakłonienie ich do pokojowego współistnienia z nami będzie mediacja."
 TUR_relax_security_laws: "Zrelaksuj przepisy dotyczące bezpieczeństwa na Wschodzie"
 TUR_relax_security_laws_desc: "Musimy złagodzić przepisy dotyczące bezpieczeństwa w prowincjach kurdyjskich, aby pokazać im, że nie jesteśmy wrogo nastawieni. W ten sposób złagodziliby także swoją agresję wobec nas."
 TUR_withdraw_all_troops: "Ogranicz ruch wojsk"
 TUR_withdraw_all_troops_desc: "Ograniczając ruch wojsk pokażemy PKK, że nie będziemy już z nimi walczyć."
 TUR_open_dialogue_pkk: "Nawiąż dialog"
 TUR_open_dialogue_pkk_desc: "Nawiązując dialog, możemy wypracować coś, co będzie zarówno w interesie Turcji, jak i PKK."
 TUR_track_two_diplomacy: "Śledź drugą dyplomację"
 TUR_track_two_diplomacy_desc: "Dzięki temu, że popularne postacie staną się przedstawicielami naszej sprawy, być może uda nam się wpłynąć na ich opinię na temat naszej umowy."
 TUR_direct_talks: "Rozmowy bezpośrednie"
 TUR_direct_talks_desc: "There is no need to play a game of hide and seek when we are trying to negotiate some serious terms. We will hold direct talks with our representatives, and theirs."
 TUR_third_party_mediators: "Mediatorzy zewnętrzni"
 TUR_third_party_mediators_desc: "Ze względu na brak zaufania między naszym rządem a PKK najlepiej jest zaangażować osoby trzecie, aby pomogły w mediacji dla nas w konflikcie."
 TUR_peshmerga_stance: "Zaproś Peszmergę"
 TUR_peshmerga_stance_desc: "Być może uda się zaprosić Peszmergę do ustabilizowania stosunków do czasu, gdy PKK stanie się częścią regionu."
 TUR_pkk_peshmerga_talks: "Kontynuuj rozmowy"
 TUR_pkk_peshmerga_talks_desc: "By pursuing talks with the Peshmerga, the PKK and the Peshmerga can co-exist peacefully without having much conflict over border disputes."
 TUR_maintain_animosity: "Utrzymuj animozję"
 TUR_maintain_animosity_desc: "Utrzymując animozję, łatwo poradzimy sobie ze sporami granicznymi, bo mamy uzasadniony powód do ataku."
 TUR_relax_policing_laws: "Zrelaksuj przepisy dotyczące policji"
 TUR_relax_policing_laws_desc: "Dzięki naszym niedawnym przełomom w dyplomacji z PKK jesteśmy w stanie złagodzić przepisy policyjne w całym kraju, znacznie ograniczając w ten sposób wydatki."
 TUR_federalize_turkish_kurdistan: "Federalizacja Diyarbakiru"
 TUR_federalize_turkish_kurdistan_desc: "Federalizujemy prowincję Kurdystanu w naszym kraju, bo tak będzie najlepiej zarówno w interesie naszym, jak i PKK. Utrzymamy pewien poziom kontroli nad nimi i regionem, ale zyskają też pewien poziom autonomii."
 TUR_the_endless_war: "Niekończąca się wojna"
 TUR_the_endless_war_desc: "The war with the PKK cannot be solved diplomatically as our many disagreements have proven time and time again. We will double our efforts of forcefully fighting the PKK and re-asserting Turkish hegemony."
 TUR_form_eastern_security_corp: "Eastern Security Corps"
 TUR_form_eastern_security_corp_desc: "Nowe jednostki zostaną wyszkolone i uzbrojone w specjalnym celu obrony niebezpiecznych części na wschodzie naszego narodu."
 TUR_redouble_army_training: "Szkolenie „Podwójnej Armii”."
 TUR_redouble_army_training_desc: "Nasze armie potrzebują szkolenia i potrzebują go teraz bardziej niż kiedykolwiek. Ponieważ zaostrzamy walkę z PKK, głupotą byłoby wysyłanie do walki lekko wyszkolonych żołnierzy."
 TUR_international_campaign: "Pomoc zagraniczna?"
 TUR_international_campaign_desc: "Być może będziemy musieli rozważyć pomoc zagraniczną w przejęciu PKK. Ale jeśli to zrobimy, ryzykujemy otwarciem drzwi dla obcych wpływów do naszego narodu."
 TUR_call_on_iranian_help: "Wezwij irańską pomoc"
 TUR_call_on_iranian_help_desc: "The Iranians have fought several wars to curb Kurdish independence, and by now they know every single move and tactic used by the rebels. We could perhaps contact them and see if they are willing to support us in fighting the Kurds."
 TUR_self_sufficiency: "Nie polegaj na nikim"
 TUR_self_sufficiency_desc: "Nie możemy polegać na nikim, kto pomoże nam w walce z NASZYMI problemami. Będziemy musieli to zrobić sami i musimy to zrobić sami. Uzyskanie pomocy nie zawsze jest rozwiązaniem."
 TUR_call_on_american_help: "Wezwij amerykańską pomoc"
 TUR_call_on_american_help_desc: "The Americans may be willing to lend us some support, but it will most likely not last very long due to their complex political system and divide in whether to intervene or not. But let's hope whatever support they give does make a difference."
 TUR_criminalize_pkk: "Międzynarodowa kryminalizacja PKK"
 TUR_criminalize_pkk_desc: "PKK jest w naszym kraju uznawana za przestępstwo już od jakiegoś czasu, ale znalazła bezpieczne schronienie w innych krajach, gdzie nie jest kryminalizowana, co dało jej czas na planowanie i koordynację ataków. Będziemy musieli podjąć się misji, aby doprowadzić do kryminalizacji tych osób we wszystkich krajach, nie tylko w naszym."
 TUR_focus_east_anatolia: "Operacja w Diyarbakir"
 TUR_focus_east_anatolia_desc: "Diyarbakir, jeden z głównych ośrodków działalności PKK, zaczyna zakłócać codzienne życie w pobliskich prowincjach. Zamierzamy przeprowadzić operację, aby raz na zawsze oczyścić prowincję z PKK."
 TUR_focus_van: "Operacja w Van"
 TUR_focus_van_desc: "Wan, jeden z głównych ośrodków działalności PKK, zaczyna zakłócać codzienne życie w pobliskich prowincjach. Zamierzamy przeprowadzić operację, aby raz na zawsze oczyścić prowincję z PKK."
 TUR_hightened_security: "Zwiększ bezpieczeństwo"
 TUR_hightened_security_desc: "Zamierzamy zwiększyć obecność sił bezpieczeństwa w kraju, abyśmy mogli kontynuować walkę z PKK i udaremnić ich plany zniszczenia naszego kraju."
 TUR_the_fight_goes_on: "Walka trwa"
 TUR_the_fight_goes_on_desc: "The fight goes on, and it will go on, and it has for many decades now. Though we cannot fully get rid of the PKK without capturing all their soldiers, we can subdue them for some time to come."
 TUR_forward_with_social_democracy: "Naprzód z socjaldemokracją"
 TUR_forward_with_social_democracy_desc: "Przyszłość Turcji będzie podyktowana socjaldemokracją i zachodnimi wartościami"
 TUR_approach_the_eu: "Podejdź do UE"
 TUR_approach_the_eu_desc: "Długi proces westernizacji powoli przybliżał Turcję do Unii Europejskiej. Powinniśmy kontynuować politykę integracji z UE, a docelowo zostać jej pełnoprawnym członkiem"
 TUR_kemalist_social_democracy: "Kemalistyczna socjaldemokracja"
 TUR_kemalist_social_democracy_desc: "The §Y[socialism_L]§! represents the idea of 'Democratic Left', a term coined by Ecevit to link leftist values with national-cultural heritage. In other words, Kemalism mixed with democratic socialism to fit the situation of contemporary Turkey. Our party can attract both leftist and Kemalist voters"
 TUR_repair_relations_with_left: "Naprawić stosunki z lewicą"
 TUR_repair_relations_with_left_desc: "Przez dziesięciolecia lewicowcy i socjaliści w Turcji byli w Turcji demonizowani za odwagę wspierania Kurdów. Ludzie powinni mieć swobodę wyrażania swoich opinii, bez względu na wyznawaną przez nich ideologię. Musimy pracować nad otwarciem pola politycznego dla większej liczby partii"
 TUR_disarmament_program: "Program rozbrojeniowy"
 TUR_disarmament_program_desc: "Nasza burzliwa historia pokazuje, że daliśmy zbyt dużo władzy wojsku. Musimy zmniejszyć wydatki na wojsko i skupić się bardziej na własnych sprawach"
 TUR_improve_workers_rights: "Poprawa praw pracowników"
 TUR_improve_workers_rights_desc: "Należy zmienić tureckie prawo pracy. Musimy dać pracownikom rządowym prawo do rokowań zbiorowych w swoim środowisku pracy. Ponadto każdy pracownik rządowy, który poczuje się niesprawiedliwie potraktowany w stosunku do swoich kolegów, będzie mógł zwrócić się do sądu przeciwko państwu"
 TUR_protect_the_unions: "Chronić związki"
 TUR_protect_the_unions_desc: "We need to remove the current restrictions on politically motivated strikes and the liability of labour unions in relations to any damages caused by workers being on a strike. We also need to give the ESK (Economic and Social Council), the board of representatives of unions, associations and confederations, constitutional protection"
 TUR_appease_conglomerate: "Uspokojenie konglomeratów"
 TUR_appease_conglomerate_desc: "The industrial conglomerates are the backbone of this nation, and if we can gain their trust, then we will easily be able to gain the workers' trust"
 TUR_banking_reform: "Reforma bankowości"
 TUR_banking_reform_desc: "Sektor bankowy w Turcji pilnie potrzebuje reform. Korupcja szerzy się, a banki są jedną z głównych przyczyn ostatniej recesji"
 TUR_invest_in_iett: "Zainwestuj w IETT"
 TUR_invest_in_iett_desc: "Istanbul Elektrik Tramvay ve Tünel to firma transportowa działająca na terenie Stambułu. Niektórzy członkowie naszej partii mają powiązania z firmą i powinniśmy współpracować z nimi w celu ulepszenia sieci transportowej Stambułu"
 TUR_legacy_of_ecevits: "Dziedzictwo Ecevitów"
 TUR_legacy_of_ecevits_desc: "Bülent Ecevit i jego żona Rahsan odegrali kluczową rolę w utworzeniu ruchu socjaldemokratycznego w Turcji. Trzeba szanować ich dziedzictwo"
 TUR_increase_central_bank_autonomy: "Zwiększenie autonomii banku centralnego"
 TUR_increase_central_bank_autonomy_desc: "By increasing the autonomy of the central bank, we are able to let the economy flow without the interference of politicians"
 TUR_harsh_stance_pkk: "Ostre stanowisko w sprawie PKK"
 TUR_harsh_stance_pkk_desc: "PKK nie robi nic innego, jak tylko sprawia problemy, będziemy musieli zająć w tej sprawie ostrzejsze stanowisko"
 TUR_abolition_of_death_penalty: "Znieść karę śmierci"
 TUR_abolition_of_death_penalty_desc: "Kara śmierci powstrzymuje nasz naród, nie pozwala nam stać się nowoczesnym i stabilnym krajem. Jesteśmy demokracją i musimy stać na straży jej wartości i praw człowieka"
 TUR_subsidise_military: "Dofinansuj wojsko"
 TUR_subsidise_military_desc: "Wojsko pomogło nam podbić Cypr i aby utrzymać wpływy Grecji z dala od Cypru, musimy ufać, że nasze wojsko postąpi właściwie"
 TUR_ataturks_heirs: "Spadkobiercy Atatürka"
 TUR_ataturks_heirs_desc: "§Y[conservatism_L]§! is the party founded by Atatürk himself. It is our destiny to modernize Turkey and make it a real European country"
 TUR_national_chief: "Dziedzictwo Szefa Narodowego"
 TUR_national_chief_desc: "Ismet Inönü, the latest §Y[conservatism_L]§! president received the title 'National Chief'. This title fits Deniz Baykal very well too"
 TUR_unban_head_scarves: "Odblokuj chusty"
 TUR_unban_head_scarves_desc: "Aby przyciągnąć więcej konserwatywnych wyborców, powinniśmy znieść zakaz noszenia chust na głowę. W końcu częścią zachodnich ideałów jest wolność religijna"
 TUR_maintain_hijab_ban: "Maintain Headscarf Ban"
 TUR_maintain_hijab_ban_desc: "There is absolutely no reason to change our laws pertaining to the Hijab. It does not matter if the conservatives are outraged or upset, what matters is the preservation of the Turkish Republic, and its secular ideals"
 TUR_reform_village_institutes: "Recreate Village Institutes"
 TUR_reform_village_institutes_desc: "In the 1940s, the ruling §Y[conservatism_L]§! government founded village institutes, which were intended to improve education in rural areas by picking out good students and educating them as teachers. Many of the skills taught in the institutes were highly practical, and many of them operated farms and workshops. We should bring these institutes back to make sure even the poorest of areas can educate themselves"
 TUR_expand_shipping_industry: "Wspieraj przemysł rybny"
 TUR_expand_shipping_industry_desc: "Wspieranie przemysłu rybnego pomoże ludności wiejskiej i ich małym przedsiębiorstwom, co w dłuższej perspektywie pomoże narodowi"
 TUR_deradicalisation_program: "Program deradykalizacji"
 TUR_deradicalisation_program_desc: "Deniz Baykal jest zagorzałym przeciwnikiem terroryzmu. Choć tolerujemy bardziej konserwatywnych członków populacji, elementy ekstremistyczne muszą zostać wyeliminowane"
 TUR_increase_education_spending: "Ulepsz edukację"
 TUR_increase_education_spending_desc: "As an associate professor, Deniz Baykal knows the importance of education. After all, he made it into politics after writing a thesis on the election loss of §Y[conservatism_L]§! in 1965"
 TUR_increase_funds_to_resources: "Dotuj Ministerstwo Energii i Zasobów"
 TUR_increase_funds_to_resources_desc: "Naród turecki potrzebuje więcej zasobów. Powinniśmy dotować Ministerstwo Energii i Zasobów, aby mogło znaleźć metody zmniejszania zależności Turcji od zasobów zagranicznych"
 TUR_chp_move_right: "Przejdź w prawo"
 TUR_chp_move_right_desc: "For years Deniz Baykal has moved the §Y[conservatism_L]§! more and more right on the political spectrum taking more conservative and Islamist policies. Many of the old supporters have left the party because of this, as many feel it doesn't match the original intentions of the party. We don't need those people. Turkey has changed, and it has no room for leftist politics"
 TUR_chp_move_left: "Przejdź w lewo"
 TUR_chp_move_left_desc: "For years Deniz Baykal has moved the §Y[conservatism_L]§! more and more right on the political spectrum taking more conservative and Islamist policies. Many of the old supporters have left the party because of this, as many feel it doesn't match the original intentions of the party. We need to reverse this course, and return back to our roots"
 TUR_increase_social_security_spending: "Zwiększ zabezpieczenie społeczne"
 TUR_increase_social_security_spending_desc: "Organizacji Ubezpieczeń Społecznych przydałoby się dodatkowe finansowanie"
 TUR_invest_in_is_bank: "Zainwestuj w İşbank"
 TUR_invest_in_is_bank_desc: "İşbank to największy bank komercyjny w Turcji z oddziałami w wielu krajach. Państwo powinno odkupić część ich akcji dla dodatkowego zabezpieczenia finansowego"
 TUR_curtail_corruption: "Ograniczenie korupcji"
 TUR_curtail_corruption_desc: "Korupcja jest jedną z największych słabości państwa tureckiego. Wielu polityków wykorzystuje system polityczny dla własnych korzyści i nie powinniśmy bać się wzywać ich do napiętnowania, gdy widzimy zachowania korupcyjne"
 TUR_remove_article_158: "Usuń artykuł 158"
 TUR_remove_article_158_desc: "Artykuł 158 uznaje obrazę prezydenta Turcji za przestępstwo. Artykuł ten został wykorzystany do uciszenia krytyków i satyryków, przez co Prezydent jest praktycznie nietykalny. Artykuł powinien zostać usunięty, bo coś takiego nie przystoi w demokracji"
 TUR_deport_refugees: "Deportować uchodźców"
 TUR_deport_refugees_desc: "A large number of refugees are a strain on the citizens and the economy. We need to send these people back to their homes. After all, every person wants to live in their place of birth"
 TUR_religious_tolerance: "Głosić tolerancję religijną"
 TUR_religious_tolerance_desc: "Turcja jest domem dla wielu mniejszości religijnych i wielu polityków wywodzi się z tych mniejszości. Musimy podnieść jakość życia tych ludzi"
 TUR_approach_grey_wolves: "Podejdź do Szarych Wilków"
 TUR_approach_grey_wolves_desc: "The Grey Wolves are an ultra-nationalistic organization that draws much support from the more right wing-leaning population. If we tighten our ties to them, we will be able to gain some of those supporters"
 TUR_businessmans_turkey: "Turcja biznesmena"
 TUR_businessmans_turkey_desc: "Turcja zbyt długo była ograniczana przez skorumpowany rząd. Nadszedł czas, aby zapewnić narodowi tureckiemu wolność, zarówno gospodarczą, jak i społeczną"
 TUR_abolish_constitutional_court: "Abolish the Constitutional Court"
 TUR_abolish_constitutional_court_desc: "Trybunał Konstytucyjny jest zbyt zależny politycznie, a na jego skład zbyt łatwo może wpływać parlament. Zamiast tego stworzymy Sąd Najwyższy, którego skład będzie sugerowany przez Prezydenta, weryfikowany przez Parlament, a następnie będzie służył Sądowi Najwyższemu dożywotnio"
 TUR_privatization_drive: "Napęd prywatyzacyjny"
 TUR_privatization_drive_desc: "Państwo nie ma potrzeby partycypować w zabezpieczeniach społecznych ani opiece zdrowotnej. Powinny być lepiej obsługiwane przez fundacje i organizacje prywatne. Oczywiście, ludzie otrzymają niewielkie ulgi podatkowe za każde wykupione ubezpieczenie"
 TUR_security_reform: "Reforma bezpieczeństwa"
 TUR_security_reform_desc: "Crime is rife in Turkey, and this needs to be stopped. The Gendarmerie will be reorganised as a rural police, and we will ensure that the salary level of all security personnel will be kept at a substantial level. The police will receive the latest technological innovations to help them in the field"
 TUR_military_reform: "Reforma wojskowa"
 TUR_military_reform_desc: "Musimy skupić się na posiadaniu skutecznych, małych i zaawansowanych technologicznie sił. Nie ma potrzeby masowego poboru ludzi do armii. Ponadto należy sprywatyzować przemysł zbrojeniowy, a państwo nie powinno zabiegać o dalsze pozyskiwanie kolejnych inwestycji przemysłu zbrojeniowego"
 TUR_stern_commitment_to_nato: "Surowe zaangażowanie w NATO"
 TUR_stern_commitment_to_nato_desc: "NATO jest jedyną rzeczą, która może zapewnić liberalny porządek świata. Turcja musi stanowczo wspierać NATO i każdy inny podobny sojusz, aby zapewnić pokój na świecie"
 TUR_reduce_government_oversight: "Zmniejsz nadzór rządowy"
 TUR_reduce_government_oversight_desc: "The state should stop interfering with the economy completely. The job of the state is only to guarantee a free market. We do not need the massive army of bureaucrats we have now, but instead only the minimum possible should be utilized"
 TUR_tax_reform: "Reforma podatkowa"
 TUR_tax_reform_desc: "Banki i inne instytucje finansowe powinny być zwolnione z wszelkich podatków i działać jak przedsiębiorstwa prywatne, aby promować wzrost. Ponadto należy obniżyć wszystkie podatki do około 10%, aby poprawić życie naszych obywateli"
 TUR_liberalise_trade: "Liberalizacja handlu"
 TUR_liberalise_trade_desc: "Należy w całości znieść obecne ograniczenia w handlu. Usuwając wszelkie opłaty celne, poprawiamy nie tylko sytuację handlową Turcji, ale także naszych sąsiadów. Musimy także sprywatyzować wszystkie porty i przystanie, aby móc z nich efektywniej korzystać"
 TUR_agricultural_reform: "Reforma rolna"
 TUR_agricultural_reform_desc: "Część naszego rolnictwa jest nadal dość zacofana. Musimy inwestować w mechanizację i zapewnić zachęty podatkowe zarówno producentom, jak i nabywcom. Musimy także włączyć technologię do rolnictwa, aby rolnicy mieli aktualne dane na temat cen towarów, co umożliwi im optymalizację produkcji oraz ograniczenie odpadów rolnych i nadprodukcji"
 TUR_business_cities: "Miasta biznesowe"
 TUR_business_cities_desc: "Cities are the economic hubs of the country. Cities are expensive, but that is only natural, as the bigger the possibilities, the bigger the cost. With this in mind, if you are too poor to live in a large city, you are to be relocated to an area with cheaper housing. To profit from the value of cities, we must also reform our real estate taxes, as in their current form they are very easy to circumvent"
 TUR_new_supply: "Nowe stacje"
 TUR_new_supply_desc: "Ponieważ nasze miasta stają się coraz bardziej ze sobą połączone, musimy stworzyć nowe stacje, z których ludzie wsiadają i wysiadają"
 TUR_destroy_totalitarian_education: "Zniszczyć totalitarną edukację"
 TUR_destroy_totalitarian_education_desc: "Scentralizowana edukacja to nic innego jak pozostałość po czasach autorytarnych. Edukacja powinna należeć do organizacji prywatnych i mieć swobodę wyboru programu nauczania. Edukacja powinna być obowiązkowa tylko przez pierwsze 8 lat, a koszty edukacji powinny być oczywiście finansowane z tanich pożyczek udzielanych przez banki"
 TUR_return_of_socialism: "Powrót socjalizmu"
 TUR_return_of_socialism_desc: "Twarde partie lewicowe nie żyją w Turcji od dziesięcioleci, ale w końcu udało im się powstać i przejąć władzę! To jest rewolucja!"
 TUR_strong_state_for_people: "Silne państwo dla ludzi"
 TUR_strong_state_for_people_desc: "Naród zasługuje na silne państwo, które nim przewodzi. Ci, którzy pokładają wiarę w rządzie, zostaną nagrodzeni"
 TUR_peoples_power: "Siła Ludu"
 TUR_peoples_power_desc: "Rząd powinien być dla ludzi i przez ludzi. Musimy demokratycznie włączyć chłopów i lud na każdym szczeblu administracji, od gminy po państwo"
 TUR_destroy_old_regime: "Zniszczyć stary reżim"
 TUR_destroy_old_regime_desc: "Musimy wymazać z administracji wszelkie pozostałości starego skorumpowanego reżimu i zacząć od nowa!"
 TUR_mixed_economy: "Gospodarka Mieszana"
 TUR_mixed_economy_desc: "Dla dobrze działającej gospodarki konieczna jest współpraca pomiędzy sektorem prywatnym i publicznym. Musimy wykorzenić złe tendencje kapitalistyczne, jednocześnie pozostawiając naszym obywatelom przestrzeń do niezależnego działania gospodarczego"
 TUR_state_owned_economy: "Gospodarka państwowa"
 TUR_state_owned_economy_desc: "Kapitalizm należy wykorzenić z naszego społeczeństwa. Do prowadzenia przemysłu nadają się jedynie państwa i gminy lokalne"
 TUR_rent_to_production_economy: "Od czynszu do ekonomii produkcji"
 TUR_rent_to_production_economy_desc: "While having a private sector is important, we need to encourage and support our population to get ownership of businesses and living accommodations to ensure that true control of the economy stays in the hands of our people"
 TUR_land_reform: "Reforma rolna"
 TUR_land_reform_desc: "Właściciele gruntów są plagą ludzkości. W Turcji nadal istnieje wiele zacofanych, a nawet feudalnych struktur, które uniemożliwiają chłopom uzyskanie wolności. Musimy całkowicie zreformować sposób własności gruntów w naszym kraju"
 TUR_heavy_agricultural_subsidies: "Ciężkie dotacje rolne"
 TUR_heavy_agricultural_subsidies_desc: "Musimy złamać zasady WTO i zacząć mocno dotować nasz sektor rolniczy, zapewniając naszym rolnikom tanie paliwo, tanie i łatwe pożyczki oraz maszyny"
 TUR_machinery_tractor_parks: "Parki Ciągników Maszynowych"
 TUR_machinery_tractor_parks_desc: "Musimy stworzyć parki traktorów, w których będzie można produkować, serwisować i sprzedawać maszyny rolnicze. Wszystko to będzie odbywać się w scentralizowanych lokalizacjach na terenie całego kraju. Pomoże nam to znacząco zmodernizować i zmotoryzować nasze rolnictwo"
 TUR_communal_farming: "Rolnictwo komunalne"
 TUR_communal_farming_desc: "Rolnictwo komunalne to najlepszy sposób na zwiększenie wydajności naszych gospodarstw. Zamiast dużych, korporacyjnych gospodarstw rolnych nastawionych na zyski, będziemy mieli więcej gospodarstw rolnych na dużą skalę do użytku lokalnego"
 TUR_cut_global_trade: "Ogranicz handel światowy"
 TUR_cut_global_trade_desc: "Zasoby tureckie powinny być zarezerwowane wyłącznie dla Turcji i nie powinny być kradzione przez globalistycznych imperialistów. Musimy zadbać o to, aby zasoby niezbędne naszemu narodowi pozostały w naszych rękach"
 TUR_prioritise_backwards_regions: "Nadaj priorytet regionom zacofanym"
 TUR_prioritise_backwards_regions_desc: "Inwestycje gospodarcze powinny koncentrować się na obszarach bardziej wiejskich i słabo zaludnionych, które od dawna były zaniedbywane przez państwo. Wieś jest podstawą tego kraju"
 TUR_urban_humanism: "Humanizm miejski"
 TUR_urban_humanism_desc: "Nasze miasta muszą zostać przeprojektowane, aby nie były zimnymi betonowymi blokami, w których ludzie pełnią rolę kół w kapitalistycznej machinie. Obszary miejskie muszą być projektowane w bardziej naturalny sposób, aby pracownik mógł prosperować"
 TUR_equal_distribution: "Równa dystrybucja"
 TUR_equal_distribution_desc: "We can't play favourites in regional politics. This will only cause discord in our nation. We will focus on areas based on state and local needs"
 TUR_greatest_productive_force: "Największą siłą wytwórczą jest człowiek"
 TUR_greatest_productive_force_desc: "Tylko skupiając się na ludziach, możemy posunąć nasz naród do przodu. Każdy aspekt życia, biznesu, społeczeństwa i wszystkiego innego ma swoje źródło w ludziach"
 TUR_clamp_down_on_kurdish_culture: "Położyć kres tożsamości kurdyjskiej"
 TUR_clamp_down_on_kurdish_culture_desc: "Kurdowie są częścią narodu tureckiego, czy tego chcą, czy nie. Nie ustąpimy tym terrorystom finansowanym przez CIA"
 TUR_federal_republic: "Republika Federalna"
 TUR_federal_republic_desc: "Every people group in Turkey should have the right of self determination, autonomy and even full independence if they so wish. Demonizing our minorities will not make a strong state. We need to agree to give the Alevis some sort of autonomy for everyone's sake"
 TUR_appease_kurds: "Uspokój Kurdów"
 TUR_appease_kurds_desc: "Walczymy z Kurdami od dziesięcioleci i do niczego nie doprowadziliśmy. Nadszedł czas, abyśmy złożyli broń i przyjęli wobec nich bardziej pokojowe podejście. W końcu chcą tylko żyć w pokoju"
 TUR_the_turkish_nation: "Naród Turecki"
 TUR_the_turkish_nation_desc: "Turcja jest narodem tureckim. Nie oznacza to tylko etnicznych Turków, ale każdy obywatel Turcji jest Turkiem i częścią niepodzielnej Republiki Turcji. Nie pozwolimy, aby nasi wrogowie nas podzielili, siejąc niezgodę wśród naszego ludu"
 TUR_detach_state_from_religion: "Odłącz państwo od religii"
 TUR_detach_state_from_religion_desc: "Turkey was created as a secular nation, but in recent years this core principle of the Republic has been tarnished. We must cut all aspects of religion from the state; no religious education in public schools, no funding of religious organizations by the state and no religious imagery in public buildings. People are free to worship what they want but the state is above such frivolous notions"
 TUR_recognise_minorities: "Rozpoznawać mniejszości"
 TUR_recognise_minorities_desc: "Musimy przyznać, że Turcję tworzą bardzo różni ludzie. Nie ma sensu narzucać idei tureckości każdemu obywatelowi. Każdy człowiek jest obywatelem Turcji, niezależnie od tego, czy jest Turkiem, czy nie"
 TUR_leverage_diaspora: "Wykorzystaj diasporę"
 TUR_leverage_diaspora_desc: "Mocarstwa zachodnie oskarżają nas o popełnienie ludobójstwa na Ormianach. Jest to jawne kłamstwo popełniane przez imperialistów. Powinniśmy wykorzystać naszą diasporę, aby wpłynąć na politykę krajów zachodnich, aby zmieniły swoje nastawienie do nas"
 TUR_commit_to_gender_equality: "Zaangażuj się w równość płci"
 TUR_commit_to_gender_equality_desc: "Equality between men and women in Turkey is abysmal. We need to commit to reducing violence against women and providing women with more opportunities when it comes to work, and increasing their participation in education and politics."
 TUR_revolutionary_education: "Rewolucyjna edukacja"
 TUR_revolutionary_education_desc: "Powinniśmy skupić się na poprawie naszej edukacji. Nie wystarczy zwiększyć dostępność, musimy także uwzględnić przekazywanie uczniom rewolucyjnych pomysłów, aby pozwolili im nieść pochodnię"
 TUR_free_education: "Darmowa edukacja"
 TUR_free_education_desc: "Edukacja powinna być całkowicie bezpłatna dla wszystkich. Jest to podstawowa konieczność dla dobra narodu"
 TUR_increase_peoples_welfare: "Zwiększ dobrobyt ludzi"
 TUR_increase_peoples_welfare_desc: "Making sure that our people are healthy is of the utmost importance. We also have to make sure that no one in our country has to starve, even if they are unemployed, old or disabled"
 TUR_leave_NATO: "Opuść NATO"
 TUR_leave_NATO_desc: "NATO jest tylko narzędziem dla imperialistów do kontrolowania świata. Nigdy nie powinniśmy być częścią takiej organizacji"
 TUR_anti_west_sentiment: "Nastroje antyzachodnie"
 TUR_anti_west_sentiment_desc: "Zachód nieustannie wtrąca się na Bliski Wschód. Musimy ponownie dostosować się do wschodzących potęg, które pewnego dnia obalą dekadenckie Stany Zjednoczone"
 TUR_balanced_approach: "Zrównoważone podejście"
 TUR_balanced_approach_desc: "Dyplomacja międzynarodowa może być zdradliwa. Musimy postępować ostrożnie, ale naszym celem powinno być uniezależnienie Turcji od wszystkich wtrącających się obcych mocarstw"
 TUR_deterrent_national_defence: "Odstraszająca Obrona Narodowa"
 TUR_deterrent_national_defence_desc: "Nasza armia musi być wystarczająco silna, aby działać jako środek odstraszający, aby żaden imperialista nie odważył się nam wtrącać"
 TUR_destruction_of_fascists: "Zniszczenie faszystów"
 TUR_destruction_of_fascists_desc: "Wojsko, policja i MIT to nic innego jak organizacje faszystowskie, które należy zburzyć i zastąpić alternatywą zapewnioną przez naród"
 TUR_pacifist_initiatives: "Inicjatywy pacyfistyczne"
 TUR_pacifist_initiatives_desc: "Przy rozwiązywaniu konfliktów powinniśmy opierać się na pokojowym podejściu. Dla dobra ludu powinniśmy położyć kres wszelkim inicjatywom imperialistycznym"
 TUR_invest_in_police: "Zainwestuj w bezpieczeństwo"
 TUR_invest_in_police_desc: "Musimy mieć silny aparat bezpieczeństwa, aby ludzie mogli czuć się bezpiecznie. Nasza policja potrzebuje dobrego sprzętu i dobrych wynagrodzeń, aby robić, co w jej mocy"
 TUR_national_democratic_revolution: "Rewolucja Narodowo-Demokratyczna"
 TUR_national_democratic_revolution_desc: "Musimy kontynuować rewolucję narodowo-demokratyczną rozpoczętą przez Atatürka. Jesteśmy awangardą rewolucji i wprowadzimy Turcję w nowoczesną erę"
 TUR_heavy_military_investment: "Ciężkie inwestycje wojskowe"
 TUR_heavy_military_investment_desc: "Musimy chronić Turcję przed siłami zewnętrznymi. Musimy dużo inwestować w nasz przemysł ciężki, aby mieć pewność, że nasza armia będzie gotowa na przyszłe bitwy"
 TUR_shutdown_christian_missionaries: "Zamknięcie chrześcijańskich misjonarzy"
 TUR_shutdown_christian_missionaries_desc: "Chrześcijańscy misjonarze działający w kraju to nic innego jak szpiedzy dla zachodnich imperialistów. Musimy wypędzić ich z kraju i zabronić im głoszenia"
 TUR_form_anti_imperialist_vanguard: "Utwórz antyimperialistyczną awangardę"
 TUR_form_anti_imperialist_vanguard_desc: "The West is constantly meddling with the Middle East, especially the United States. We need to form a union of anti-imperialists in the Middle East to stop the great Middle Eastern project of the United States"
 TUR_vanguard_approach_azerbaijan: "Dojazd do Azerbejdżanu"
 TUR_vanguard_approach_azerbaijan_desc: "Azerbejdżan jest wieloletnim sojusznikiem Turcji. W końcu mamy wspólną religię, dziedzictwo i cele polityczne. Powinniśmy poprosić ich o potępienie zachodniego imperializmu"
 TUR_vanguard_reclaim_azerbaijan_territory: "Odzyskaj integralność terytorialną Azerbejdżanu"
 TUR_vanguard_reclaim_azerbaijan_territory_desc: "Armenia occupied parts of Azerbaijan after they gained independence from the Soviet Union under the pretext of protecting ethnic Armenians. This occupation has now lasted for more than a decade. It is time to demand Armenia to withdraw from the region or face the consequences!"
 TUR_vanguard_approach_iran: "Podejdź do Iranu"
 TUR_vanguard_approach_iran_desc: "Iran od dawna jest prześladowany i oczerniany przez Amerykanów. Na pewno będą zainteresowani wspólnym frontem przeciwko Wielkiemu Szatanowi"
 TUR_vanguard_pressure_northern_cyprus: "Ciśnienie na Cyprze Północnym"
 TUR_vanguard_pressure_northern_cyprus_desc: "Northern Cyprus only exists because we support them. We have considerable influence on their government and we should emphasize to them that they only exist because we allow it"
 TUR_vanguard_negotiate_with_syria: "Negocjuj z Syrią"
 TUR_vanguard_negotiate_with_syria_desc: "Mamy bardzo burzliwą historię związaną z Syrią. W pewnym momencie pozwolili PKK na działanie w swoich granicach i nigdy nam nie wybaczyli, że Francuzi oddali nam region Hatay. Może jednak jest sposób, abyśmy mogli zostać przyjaciółmi"
 TUR_vanguard_annex_northern_cyprus: "Załącznik Cypr Północny"
 TUR_vanguard_annex_northern_cyprus_desc: "Cypr Północny jest pełen Turków. Z tego powodu powinniśmy znacznie przybliżyć sobie Cypr Północny. Tak naprawdę cała wyspa powinna być częścią Turcji"
 TUR_vanguard_unify_iraq: "Dopasuj Irak"
 TUR_vanguard_unify_iraq_desc: "Irakijczycy szaleli i szaleli przez ostatnie kilka lat i musimy rozwiązać ten problem i dostosować ich do nas"
 TUR_scientific_socialism: "Naukowy socjalizm"
 TUR_scientific_socialism_desc: "Najlepszym sposobem na osiągnięcie postępu jest naukowy socjalizm EMEP. Zdecydowanie antykapitalistyczna, zdecentralizowana i nieinterwencjonistyczna ścieżka będzie dla Turcji najkorzystniejsza"
 TUR_unlimited_workers_rights: "Nieograniczone prawa pracownicze"
 TUR_unlimited_workers_rights_desc: "The Workers of Turkey have been oppressed for decades! No more! It is time to break our chains and make Turkey a worker's paradise!"
 TUR_adherent_defence: "Obrona spójna"
 TUR_adherent_defence_desc: "Nasza armia nie powinna być wykorzystywana do poniżania innych ludzi. Zadaniem armii jest ochrona naszych ludzi i tylko to"
 TUR_shut_down_imperialists: "Zamknij imperialistów"
 TUR_shut_down_imperialists_desc: "Our current government model is based on capitalistic ideals. All of this is pure nonsense. We need to completely overhaul our monetary system. Other powers say that we 'owe' them money but our debts will be just wiped away with the push of a button"
 TUR_retreat_from_cyprus: "Wycofaj się z Cypru"
 TUR_retreat_from_cyprus_desc: "Turkey has no business being in Cyprus. It is nothing more than a remnant of Turkish imperialism. The inhabitants of the island, both Turks and Greeks alike should decide their fate on their own"
 TUR_devrimci_yol: "Devrimci Yol"
 TUR_devrimci_yol_desc: "Devrimci Yol oznacza Ścieżkę Rewolucyjną i jest turecką formą marksizmu-leninizmu z naciskiem na związki zawodowe. Wielu członków §W[anarchist_communism_L]§! byli częścią ruchu w latach 80. Idea Devrimci Yol przewyższa obcy komunizm naszych konkurentów i wymaga wyniesienia ponad inne"
 TUR_committees_of_resistance: "Komitety Oporu"
 TUR_committees_of_resistance_desc: "Musimy utworzyć Komitety Oporu, aby bronić się przed wszechobecną prawicową postawą kraju. Te grupy będą patrolować ulice i ścigać terrorystów znanych jako Szare Wilki."
 TUR_committees_of_production: "Komitety Produkcji"
 TUR_committees_of_production_desc: "Komitety Produkcji pomogą zorganizować robotników i fabryki w efektywne jednostki, a komitety te będą niezależnie kontrolować proces produkcyjny"
 TUR_empower_unions: "Wzmocnić pozycję związków"
 TUR_empower_unions_desc: "We need to empower the labour unions so we can fully protect the rights of workers. Only by giving a voice to the worker, will our words be truthful"
 TUR_strike_pakistan: "Uderz w Pakistan"
 TUR_strike_pakistan_desc: "Wydaje się, że rząd pakistański odrzuca wszelkie formy socjalizmu i aktywnie wypowiadał się przeciwko naszemu rządowi. Najwyższy czas uciszyć ich raz na zawsze."
 TUR_strike_arabia: "Wyzwolić Arabię"
 TUR_strike_arabia_desc: "Wydaje się, że Saudyjczycy niezbyt dobrze radzą sobie z innymi ideologiami. Z tego powodu będziemy musieli je zrobić."
 TUR_islamist_victory: "Zwycięstwo islamistów"
 TUR_islamist_victory_desc: "People in Turkey have been yearning for a more conservative government, one that truly follows Islam. Now they finally have it"
 TUR_lower_taxes_for_exports: "Niższe podatki na eksport"
 TUR_lower_taxes_for_exports_desc: "Turcja ma potężną gospodarkę, ale eksport jest obciążony dużą biurokracją. Musimy znacznie ułatwić handel międzynarodowy niż obecnie"
 TUR_form_new_stock_markets: "Utwórz nowe rynki akcji"
 TUR_form_new_stock_markets_desc: "Obecnie jedyne rynki giełdowe funkcjonują w Stambule. To znacznie pozbawia praw wyborczych ludzi mieszkających w innych częściach Turcji. Musimy założyć więcej lokalnych giełd i powiązać je z giełdą w Stambule"
 TUR_energy_investments: "Inwestycje energetyczne"
 TUR_energy_investments_desc: "Musimy zmniejszyć zależność Turcji od importu energii z zagranicy"
 TUR_subsidise_farming: "Dofinansuj rolnictwo"
 TUR_subsidise_farming_desc: "Turcja posiada duże obszary żyznej ziemi, a mimo to nasza produkcja rolna jest stale niska. Musimy dotować naszych rolników, aby zapewnić stałe i wydajne dostawy żywności"
 TUR_increase_oil_gas_production: "Zwiększ produkcję ropy i gazu ziemnego"
 TUR_increase_oil_gas_production_desc: "Turcja importuje dużo ropy i gazu ziemnego, mimo że mamy również dostawy krajowe. Aby zwiększyć samowystarczalność, musimy inwestować w nasze zakłady wydobywcze ropy naftowej i gazu ziemnego"
 TUR_turkish_highways: "Tureckie autostrady"
 TUR_turkish_highways_desc: "Turcja jest mostem łączącym Azję i Europę. Sieć dróg umożliwiających przejazd przez Turcję jest jednak w złym stanie i należy ją ulepszyć"
 TUR_uphold_family_values: "Przestrzegaj wartości rodzinnych"
 TUR_uphold_family_values_desc: "Tradycyjne wartości rodzinne są atakowane przez Zachód. Musimy założyć organizację, która będzie promować tradycyjne wartości i zadba o to, aby w mediach nie pojawiały się materiały wrogie tej tradycji"
 TUR_security_through_police_and_welfare: "Bezpieczeństwo dzięki policji i opiece społecznej"
 TUR_security_through_police_and_welfare_desc: "Aby zapewnić bezpieczeństwo naszym obywatelom, nie wystarczy finansować policję. Musimy także zwiększyć wydatki socjalne, aby ludzie nie znaleźli się w sytuacjach, w których aby przeżyć, muszą uciekać się do przestępstwa"
 TUR_judicial_reform: "Reforma sądownictwa"
 TUR_judicial_reform_desc: "Nasz system wymiaru sprawiedliwości jest przestarzały i oderwany od współczesnego społeczeństwa. Musimy zreformować cały system i usunąć skorumpowanych sędziów"
 TUR_remove_electoral_treshold: "Remove Electoral Threshold"
 TUR_remove_electoral_treshold_desc: "Turkey has the highest electoral threshold in the world. A party needs at least 10% of the popular vote to get seats in the parliament. This is undemocratic, and only serves to cement the power of the ruling party. We need to remove the limit altogether"
 TUR_increase_military_funding: "Zwiększ fundusze wojskowe"
 TUR_increase_military_funding_desc: "Naród turecki jest w oblężeniu i potrzebujemy silnej armii, aby się bronić. Musimy zwiększyć finansowanie i zrekrutować nowych pracowników"
 TUR_concentrate_domestic_equipment: "Skoncentruj się na sprzęcie domowym"
 TUR_concentrate_domestic_equipment_desc: "Turecka armia powinna używać tureckiego sprzętu. Obecnie jesteśmy zbyt uzależnieni od dostaw sprzętu od naszych tak zwanych „sojuszników”"
 TUR_military_rnd_projects: "Projekty badawczo-rozwojowe"
 TUR_military_rnd_projects_desc: "Oprócz produkcji sprzętu krajowego musimy opracować krajowe systemy uzbrojenia, które zastąpią systemy zakupione za granicą"
 TUR_remove_military_from_politics: "Usuń wojsko z polityki"
 TUR_remove_military_from_politics_desc: "W państwie demokratycznym to perwersyjne, że wojsko ma tak dużą władzę. Musimy uchwalić prawa i wprowadzić poprawki do konstytucji, aby zapobiec ciągłej ingerencji wojska w politykę"
 TUR_islamic_nato: "Islamskie NATO"
 TUR_islamic_nato_desc: "Chociaż NATO zapewnia nam bezpieczeństwo, członkowie NATO okazali całkowite lekceważenie Bliskiego Wschodu. Jeśli nie są w stanie zapewnić stabilności i dobrobytu, musimy przejąć tę rolę. Utworzymy własny sojusz wojskowy, Organizację Traktatu Śródziemnomorskiego, czyli MTO"
 TUR_invite_iraq: "Zaproś Irak"
 TUR_invite_iraq_desc: "Musimy zaprosić Irak do naszego sojuszu, ponieważ powoli zaczynają się on łączyć, a my odnieślibyśmy poważne korzyści ze wzajemnej współpracy"
 TUR_invite_syria: "Zaproś Syrię"
 TUR_invite_syria_desc: "Posiadanie Syrii na południe od naszego kraju oznacza, że ​​jesteśmy bardzo bezbronni. Zaproszenie Syrii do naszej frakcji byłoby świetnym sposobem na zagwarantowanie nam bezpieczeństwa"
 TUR_invite_egypt: "Zaproś Egipt"
 TUR_invite_egypt_desc: "Egypt is an up and coming power-house, and with a population of its size, our alliance will be able to achieve virtually anything"
 TUR_assistance_to_bulgaria: "Pomoc dla Bułgarii"
 TUR_assistance_to_bulgaria_desc: "Powinniśmy pomóc Bułgarii w rozwoju jej infrastruktury, abyśmy mogli z łatwością prowadzić więcej inwestycji poza jej granicami"
 TUR_islamic_economic_cooperation: "Islamska Współpraca Gospodarcza"
 TUR_islamic_economic_cooperation_desc: "Wiele krajów muzułmańskich pływa w pieniądzach i wykorzystuje je do bezsensownych celów. Powinniśmy utworzyć sojusz gospodarczy, aby połączyć nasze zasoby we wspólny projekt gospodarczy"
 TUR_condemn_china: "Potępiać Chiny"
 TUR_condemn_china_desc: "Traktowanie przez Chiny rodzimych muzułmanów jest odrażające i należy je potępić"
 TUR_improve_relations_with_egypt: "Poprawa stosunków z Egiptem"
 TUR_improve_relations_with_egypt_desc: "Turcja ma burzliwą historię z Egiptem, głównie z powodu naszych przeszłych konfliktów. Wszyscy jesteśmy tutaj po tej samej stronie i nie powinniśmy być tak oschli w stosunku do Egipcjan"
 TUR_investments_in_iraq: "Iracka Przyjaźń"
 TUR_investments_in_iraq_desc: "Despite Iraq having less than ideal ties with us in the past, it is best that we warm up to each other. We can invest in Iraqi infrastructure and gain their trust"
 TUR_work_together_with_BSEC: "Współpracuj z BSEC"
 TUR_work_together_with_BSEC_desc: "BSEC (Współpraca Gospodarcza Morza Czarnego) to organizacja mająca na celu zapewnienie dobrobytu w regionie Morza Czarnego. W skład organizacji wchodzą kraje regionu Morza Czarnego i niektóre kraje Południowych Bałkanów. Musimy współpracować z tymi krajami, aby uzyskać większe korzyści"
 TUR_fixing_ideals: "Naprawa ideałów"
 TUR_fixing_ideals_desc: "Nasze ideały zostały zniszczone w wyniku dziesięcioleci ideologii i rządów kemalistów. Jednakże nie jest za późno na ich przywrócenie, naprawimy popełnione błędy i poprowadzimy naród z powrotem do tradycjonalizmu i islamizmu"
 TUR_anti_lgbtq: "Podwoić przepisy dotyczące małżeństw"
 TUR_anti_lgbtq_desc: "Musimy zadbać o to, aby nasze społeczeństwo nie kręciło się wokół zachodnich ideałów. Podwoimy tradycyjne prawa dotyczące małżeństw i przede wszystkim będziemy egzekwować tradycjonalizm"
 TUR_supporting_islamists: "The Ulema's Voice"
 TUR_supporting_islamists_desc: "We will let the Ulema voice their opinions in our country's affairs. Giving them a voice will let our nation steer towards a path of righteousness and purity"
 TUR_natural_medicine: "Medycyna naturalna"
 TUR_natural_medicine_desc: "Natural medicine is the best type of medicine. We need to ditch the glorified lab-made medicines as they can be using ingredients more harmful than good to one's body."
 TUR_new_era: "Nowa era"
 TUR_new_era_desc: "Dla regionu nadejdzie nowa era. Era pokoju i stabilności, wolna od ucisku i niesprawiedliwości"
 TUR_ally_palestine: "Sojusznicza Palestyna"
 TUR_ally_palestine_desc: "Palestine has been occupied by the Israelis since the late 1940s. It is time we establish proper ties with them, and show our support for them."
 TUR_talks_with_iran: "Rozmowy z Iranem"
 TUR_talks_with_iran_desc: "Iran wzywa do całkowitego wyzwolenia Palestyny ​​i obalenia porządku izraelskiego. Przeprowadzimy z nimi rozmowy i zobaczymy, czy uda nam się znaleźć porozumienie w tej sprawie pomimo różnic religijnych"
 TUR_freeing_palestine: "Wyzwolenie Palestyny"
 TUR_freeing_palestine_desc: "Nadszedł czas, abyśmy wyzwolili Palestyńczyków spod izraelskich okupantów. Izraelczycy sprowadzili na Palestynę i Lewant jedynie cierpienie i niesprawiedliwość i najwyższy czas coś z tym zrobić!"
 TUR_shia_dominance: "Dominacja szyitów"
 TUR_shia_dominance_desc: "Nadszedł czas, aby alewici, alawici i Jafaris w Turcji zjednoczyli się i przełamali ucisk tureckich sunnitów"
 TUR_alevi_political_shift: "Dominacja polityczna alewitów"
 TUR_alevi_political_shift_desc: "Należy przenieść stolicę polityczną Turcji na zdominowane przez alewitów obszary środkowej Anatolii. To najlepszy sposób na zabezpieczenie naszej bazy energetycznej"
 TUR_repair_relations_with_alawites: "Napraw stosunki z alawitami"
 TUR_repair_relations_with_alawites_desc: "Alawici mieszkający w Hatay i elita polityczna Syrii są często myleni z alewitami. Chociaż mają pewne podobieństwa, sekty powstały w różnym czasie, a alawici to głównie Arabowie. Doszło do tarć historycznych, ponieważ alawici postrzegali alewitów jako „ciemiężycieli Arabów”. Należy zmienić tę wrogość"
 TUR_invest_in_alevis: "Zainwestuj w alewitów"
 TUR_invest_in_alevis_desc: "Większość alewitów w Turcji mieszka we wschodniej Anatolii, która doświadczyła znacznie mniejszego dobrobytu gospodarczego niż zachodnia część Turcji. Nadszedł czas, aby alewici podzielili się bogactwem"
 TUR_invest_in_alawites: "Zainwestuj w alawitów"
 TUR_invest_in_alawites_desc: "Podobnie jak alewici, alawici zostali pozbawieni praw ekonomicznych przez poprzednie rządy. Nie popełnimy tego samego błędu"
 TUR_unite_alawites: "Zjednoczyć Alawitów"
 TUR_unite_alawites_desc: "Turcja niesprawiedliwie ukradła Francji region Hatay, dzieląc alawitów na dwa odrębne państwa. Musimy zwrócić ten obszar Syrii i zjednoczyć wszystkich alawitów pod jednym rządem"
 TUR_utilise_alawite_military_experience: "Wykorzystaj doświadczenie wojskowe Alawitów"
 TUR_utilise_alawite_military_experience_desc: "W Syrii dużą część dowództwa wojskowego tworzą alawici. Musimy zastosować podobną metodę w naszej armii, aby mieć lojalną kadrę oficerską"
 TUR_break_syrian_dependancy_iran: "Atak na stosunki syryjsko-irańskie"
 TUR_break_syrian_dependancy_iran_desc: "We need to make Syria less dependent on Iran, and more so on us. For that reason, we will be attacking their ability to exert influence within Syria"
 TUR_arm_iraqi_shias: "Wyzwolić irackich szyitów"
 TUR_arm_iraqi_shias_desc: "Iraqis are living under a system where the Shi'ite population is under-represented. We need to change this, we will liberate them and free them from the system of oppression they currently live under"
 TUR_arm_saudi_rebels: "Dominuj nad Hezbollahem"
 TUR_arm_saudi_rebels_desc: "Hezbollah has been trying to capture all of Lebanon, or at the least, exert its military control over it. We will not let an Iranian proxy do this, as we are going to be taking Lebanon as a protectorate of Turkey"
 TUR_anti_iran_diplomacy: "Ogranicz irańską doktrynę"
 TUR_anti_iran_diplomacy_desc: "Armia syryjska ma wielu doradców przybywających i wyjeżdżających z Iranu. Z tego powodu ich metody szkolenia i walki są bardzo podobne, a jeśli kiedykolwiek pójdziemy na wojnę z Iranem, będziemy mieli problemy, ponieważ nasza taktyka będzie przewidywalna"
 TUR_turkey_syria_union: "Unia Turko-Syryjska"
 TUR_turkey_syria_union_desc: "Skoro zarówno nami, jak i Syrią rządzi mniejszość religijna, którą ludzie cały czas mylą, może warto zjednoczyć siły i stworzyć unię polityczną? Jako samotne sekty nie mamy szans przeciwstawić się wpływom sunnickim w regionie"
 TUR_ottoman_revival: "Odrodzenie Osmańskie"
 TUR_ottoman_revival_desc: "§GThe Ottomans§!, once one of the greatest empires centuries ago, have returned. However today, the political landscape has §Hshifted drastically§!, and a heightened sense of §Hnationalism§! makes reuniting the empire a §Rdaunting task for anyone§!. For this reason, the §Gnew Ottoman state§! has to find ways to prove that it will offer a better life to its §Hformer territories§!. We will have §H3 sections of peoples to appease§!, The Middle East, The Levant, and The Balkans. Each one of these sections will have §Hseveral countries§! within them that we can §Hboost our support in§!, and once we hit §H100% support§! in any of these countries, we will be able to §Hgain cores§! and the trust of its people.\n\nIn the §RMiddle East§! our support is currently:\n\n[IRQ.GetFlag]Iraq: §Y[?osman_iraq|%]§!\n\n[SYR.GetFlag]Syria: §Y[?osman_syria|%]§!\n\n[KUW.GetFlag]Kuwait: §Y[?osman_kuwait|%]§!\n\nIn the §RLevant§! our support is currently:\n\n[JOR.GetFlag]Jordan: §Y[?osman_jor|%]§!\n\n[ISR.GetFlag][PAL.GetFlag]Israel/Palestine: §Y[?osman_isr|%]§!\n\n[LEB.GetFlag]Lebanon: §Y[?osman_leb|%]§!\n\n[HEJ.GetFlag]Hejaz: §Y[?osman_sau|%]§!\n\nIn the §RBalkans§! our support is currently:\n\n[GRE.GetFlag]Greece: §Y[?osman_gre|%]§!\n\n[BUL.GetFlag]Bulgaria: §Y[?osman_bul|%]§!\n\n[FYR.GetFlag]Macedonia: §Y[?osman_fyr|%]§!"
 TUR_pan_turkic_dream: "Sen panturecki"
 TUR_pan_turkic_dream_desc: "Our great nation has envisioned a new §CPan Turkic Dream§!. We will utilize the §HOrganization of Turkic States§! as a means to garner support and influence within Turkic States, and slowly sway them to join us as one nation. If we are successful in doing so, we will be able to grow our nation to the point where we can be considered a great power in the world. §HTurkic Countries eligible to join the Turkic Confederation will be more likely to join if they have a higher opinion of us!§!"
 TUR_domestic_politics_category: "Turecka polityka wewnętrzna"
 TUR_economy_category: "Kryzys ekonomiczny"
 TUR_mafia_category: "Turecka mafia"
 TUR_mafia_category_desc: "The Turkish Mafia has been active for quite some time, committing crimes such as drug dealings, murders, fraud, you name it. In recent years however, they have begun becoming more and more political, and certain parties have been caught making deals with them, and slowly giving them more legitimacy.\n\n §YMafia Influence§! measures the overall influence §Hthe Mafia§! has in the nation. If their influence is  §H60§! or higher, then they will be capable of carrying out political Assassinations, either towards the leadership of our internal factions, or the military. §Hthe Mafia§! will also cause us to lose money, and lots of it too, as the higher influence allows more people to be able to commit fraud and tax related crimes. Additionally, §HMafia Influence§! will §Rincrease every two weeks by 1§! if their influence reaches §H60§!. This can happen if we neglect certain events, or if we make poor choices when it comes to dealing with §Hthe Mafia§!. We can combat §HMafia Influence§! by raiding their safe houses, increasing our police spending, or even maintaining party popularity so that our people aren't affected by their campaigns. Additionally, if we get §HMafia Influence§! Below §H30§!, we will be able to make arrests of wanted §HMafia§! criminals, eventually allowing us to completely eradicate §Hthe Mafia§!.\n\n§HMafia Influence§!: §R[?TUR.TUR_mafia_influence]§!"
 TUR_conduct_anti_mafia_raid: "Prowadzenie operacji antymafijnych"
 TUR_conduct_anti_mafia_raid_desc: "Prowadząc działania, które pomogą nam oczyścić mafię, będziemy w stanie szybko ograniczyć jej wpływy, choć wyjątkowo wysokim kosztem."
 TUR_arrest_mafia_west: "Arrest Mafia members in Western Turkey"
 TUR_arrest_mafia_central: "Aresztowanie członków mafii w środkowej Turcji"
 TUR_arrest_mafia_south: "Aresztowanie członków mafii w południowej Turcji"
 TUR_arrest_mafia_east: "Aresztowanie członków mafii we wschodniej Turcji"
 TUR_victory_over_mafia: "§Pokonać mafię§!"
 TUR_mafia_influence_mechanic: "Misje globalne"
 TUR_mafia_influence_mechanic_desc: "§PThe Turkish Mafia§! has proven itself to be more than just a domestic group of gang members, it is much more than that. §HThe Turkish Mafia has ties and influence all over the world§!, but more so in certain places than others. Through the use of the Turkish diaspora, the Turkish Mafia is able to §Hgain support§! and §Hinfluence§! over other nations, and use them to prop up new §PMafia-Proxies§!. Doing this will let the §HTurkish Mafia§! pull strings in governments globally, and even in some cases, §Roverthrow them§!.\n\nAs indicated by the visuals below, the §Hhigher the Mafia influence§! in certain countries, the more control they have. If Mafia influence is §Rlow§!, then the Mafia is §Runable§! to do anything drastic. But if the §HMafia influence is high§!, there are §Ga lot§! more options.\n\n§HInfluence in the UK§!: §G[?mafia_uk|%]§!\n§HInfluence in Germany§!: §G[?mafia_germany|%]§!\n§HInfluence in the Netherlands§!: §G[?mafia_holland|%]§!\n§HInfluence in Australia§!: §G[?mafia_australia|%]§!\n§HInfluence in Belgium§!: §G[?mafia_belgium|%]§!\n\nNo color - Low Influence\n§YYellow§! - Some influence\n§RRed§! - A lot of influence\n"
 TUR_start_eng_operations: "Rozpocznij działalność w Wielkiej Brytanii"
 TUR_close_eng_operations: "Zakończ działalność w Wielkiej Brytanii"
 TUR_boost_british_firms: "Wspieraj brytyjskie firmy"
 TUR_fund_ira: "Fundusze separatystów"
 TUR_sow_division: "Sow division within politics"
 TUR_shatter_the_kingdom: "§PSRozbić królestwo§!"
 TUR_start_ger_operations: "Rozpocznij działalność w Niemczech"
 TUR_close_ger_operations: "Zakończ działalność w Niemczech"
 TUR_gray_wolves_networks: "Rozwiń sieci Szarych Wilków"
 TUR_commit_vehicle_rob: "Smuggle out German vehicles"
 TUR_attack_german_politics: "Znajdź skorumpowanych mężów stanu"
 TUR_take_german_industries: "§PPrzejmij kontrolę nad kluczowymi sektorami przemysłu§!"
 TUR_take_german_industries_desc: "Due to the high amount of corruption in German politics, we are able to easily seize important industrial sectors for our own needs."
 TUR_start_hol_operations: "Rozpocznij działalność w Holandii"
 TUR_close_hol_operations: "Zakończ działalność w Holandii"
 TUR_establish_drug_networks_rotterdam: "Rozwiń sieci narkotykowe"
 TUR_decrease_policing_holland: "Atak na finansowanie policji"
 TUR_largest_drug_network: "§PEtwórz wielkie centrum narkotykowe§!"
 TUR_start_aus_operations: "Rozpocznij działalność w Australii"
 TUR_close_aus_operations: "Zakończ działalność w Australii"
 TUR_boost_honoured_society: "Agituj szanowne społeczeństwo"
 TUR_target_aussie_welfare: "Atakuj australijski standard życia"
 TUR_spread_hatred_indonesia: "Start rumours between Indonesia and Australia"
 TUR_watch_the_conflict: "§PSkradnij australijski skarb§!"
 TUR_watch_the_conflict_desc: "Using our connections and influence, we will steal Australian precious metals and use them for our own good."
 TUR_start_bel_operations: "Rozpoczęcie działalności w Belgii"
 TUR_close_bel_operations: "Zakończ działalność w Belgii"
 TUR_fund_bel_mafia: "Pokonaj belgijskich przestępców"
 TUR_steal_crucial_info: "Kradnij dane naukowe"
 TUR_strings_in_belgian_govt: "Pociągnij za sznurki w rządzie belgijskim"
 TUR_our_puppets: "§PFwyeliminuj ważnych badaczy belgijskich§!"
 TUR_our_puppets_desc: "Wylatując ważnych belgijskich badaczy, jesteśmy w stanie wykorzystać ich w Turcji dla własnego dobra."
 TUR_hire_gulenist_economic_advisors: "Zatrudnij doradców ekonomicznych firmy Gülenist"
 TUR_hire_gulenist_economic_advisors_desc: "Czerpiąc z dużej puli międzynarodowych specjalistów, możemy zatrudnić ekspertów w dziedzinie ekonomii, którzy będą doradzać naszemu rządowi w zakresie prowadzenia gospodarki"
 TUR_employ_gulenist_informants: "Zatrudnij informatorów Gülenista"
 TUR_employ_gulenist_informants_desc: "Güleniści są rozsiani po całym świecie. Zatrudniając informatorów, łatwiej będzie zebrać informacje wywiadowcze"
 TUR_hire_gulenist_educators: "Zatrudnij nauczycieli Gülenista"
 TUR_hire_gulenist_educators_desc: "Możemy znacznie zwiększyć efektywność naszej edukacji, zatrudniając wielu znanych na świecie uczonych Gülenista"
 TUR_recall_gulenists: "Przypomnijmy sobie Gülenistów"
 TUR_recall_gulenists_desc: "Powinniśmy zaprosić Gülenistów do Turcji, aby służyli naszemu krajowi"
 TUR_call_out_ozkan: "Zawołajcie wicepremiera Özkana"
 TUR_call_out_ozkan_desc: "Musimy wezwać węża Özkana, gdy próbuje odsunąć [ROOT.GetLeader] od władzy. Istnieje jednak ryzyko, że w przypadku zmuszenia do rezygnacji podejmie próbę utworzenia nowej partii politycznej"
 TUR_ban_fazilet_partisi: "Zakaz §W[Konserwatywny_L]§!"
 TUR_ban_fazilet_partisi_desc: "The §W[Conservative_L]§! is an islamist political party, and in a secular Turkish state there is no room for such parties. Many of its members have already participated in now banned islamist parties before. Banning §W[Conservative_L]§! won't have a lasting effect, as its members will just form a new political party, but it might cause some factionalism and weakening of our opponents overall"
 TUR_big_crash_coming: "Odzyskaj siły po wielkiej katastrofie"
 TUR_big_crash_coming_desc: "Our economy has got much worse since 2013, and this will drag us into a depression."
 TUR_sell_reserves: "Sprzedaj rezerwy"
 TUR_sell_reserves_desc: "Sprzedaż rezerw może opóźnić wielki krach."
 TUR_imf_program: "Wróćmy do programu MFW"
 TUR_imf_program_desc: "The IMF Program was the economic plan of Turkey between 2001 and 2008, when the economy grew rapidly. Erdogan said \"Who gets loans today money takes orders tomorrow.\" and stated that the IMF is dangerous. Then the IMF Program was cancelled and Turkey paid all the debt taken from IMF."
 TUR_law_reform: "Zreformować prawo"
 TUR_law_reform_desc: "Reforming the law and making the courts independent is an important step to fix the economy, but there may be corruption scandals about AKP."
 TUR_reestablish_village_institutes: "Ponowne utworzenie instytutów wiejskich"
 TUR_reestablish_village_institutes_desc: "Instytuty Wiejskie to lokalne centra edukacyjne prowadzone przez mieszkańców, których zadaniem jest nauczanie różnych umiejętności na obszarach wiejskich"
 TUR_incentivise_modern_farming: "Zachęcaj do nowoczesnego rolnictwa"
 TUR_incentivise_modern_farming_desc: "Musimy zapewnić zwolnienia podatkowe rolnikom i nabywcom produktów rolnych. Musimy także w większym stopniu włączyć technologię do procesu rolniczego"
 TUR_heavily_subsidise_agriculture: "Mocno subsydiuj rolnictwo"
 TUR_heavily_subsidise_agriculture_desc: "Aby mieć silny sektor rolniczy, musimy mocno dotować naszych rolników"
 TUR_encourage_communal_farming: "Zachęcaj do wspólnego rolnictwa"
 TUR_encourage_communal_farming_desc: "Musimy zachęcać gospodarstwa komunalne do wypierania dużych gospodarstw prowadzonych przez korporacje"
 TUR_implement_revolutionary_education: "Wdrożyć rewolucyjną edukację"
 TUR_implement_revolutionary_education_desc: "Należy włączyć rewolucyjne nauczanie do systemu edukacji, aby ludzie mogli zachować spokój"
 TUR_migrants: "Zrewidować przepisy migracyjne"
 TUR_migrants_desc: "Musimy przyjrzeć się naszym przepisom migracyjnym, ponieważ ludzie napływają do nas z powodu zamieszek w sąsiednich krajach."
 TUR_mit_decision: "Zreformować MIT"
 TUR_mit_decision_desc: "MIT, nasza służba bezpieczeństwa narodowego, wymaga zreformowania, aby lepiej pasowała do naszego nowego programu."
 TUR_disaster_decision: "Ustal plan pomocy w przypadku klęsk żywiołowych"
 TUR_disaster_decision_desc: "Wszędzie zdarzają się trzęsienia ziemi i klęski żywiołowe. Naprawdę musimy znaleźć sposób, jak sobie z nimi poradzić tak szybko, jak to możliwe."
 TUR_nationalist_rise: "Powstanie tureckiego nacjonalizmu"
 TUR_nationalist_rise_desc: "Although nationalism is not always a bad thing, too much of it is. And that is the case in our country, as currently it is leading to ethnic conflicts within our own borders."
 TUR_drug_problems_decision: "Problem narkotyków"
 TUR_drug_problems_decision_desc: "There are a lot of drugs coming in and out of Turkey. This causes problems for us, and our neighbors, and our people."
 TUR_redesign_bosphorus: "Przeprojektuj Bosfor"
 TUR_redesign_bosphorus_desc: "The banks of the Bosphorus are full of modern tall buildings, with a lot of the historical architecture having been completely erased. We need to limit the development of the area and return the area back to its old beautiful style. The banks will be an area where all citizens of Istanbul can spend their time"
 TUR_establish_shia_dominance: "Ustanowienie dominacji szyitów"
 TUR_establish_shia_dominance_desc: "Jedną z największych mniejszości religijnych w Turcji są alewici (nie mylić z arabskimi alawitami), którzy stanowią od 10% do 20% populacji. Alewici byli celem kilku pogromów, a rząd turecki nie był skłonny uznać ich za grupę religijną odrębną od dominujących sunnitów. Choć technicznie rzecz biorąc, alewitowie nie są oficjalnymi szyitami, zostali wyznaczeni jako tacy przez poprzedniego ajatollaha Iranu, Ruhollaha Chomeiniego. Wielu alewitów również uważa się za szyitów. Musimy przełamać dominację sunnitów w Turcji"
 TUR_greek_issues: "Przyjaciel czy wróg?"
 TUR_greek_issues_desc: "The Greeks, once our historic province, were forced to be in an alliance with us due to NATO. However, despite the alliance, our relations did not get any better because of the countless disputes we have"
 TUR_cypriot_troubles: "Kłopoty Cypru"
 TUR_cypriot_troubles_desc: "Cyprus has been an island of endless conflict ever since we moved our troops into the North. The Greeks have never shut up about it, and they are seemingly trying to destroy our gains in the island nation. We will have to deal with this accordingly"
 TUR_direct_involvement: "Bezpośrednie zaangażowanie"
 TUR_direct_involvement_desc: "Odkąd opuściliśmy NATO, nie powstrzymują nas już liczne ograniczenia nałożone na naszą zdolność wywierania wpływów przez Turcję. Oznacza to, że możemy bezpośrednio zaangażować się na Cyprze, bez konieczności ograniczania naszych możliwości"
 TUR_demand_british_withdrawal: "Zażądaj wycofania się Wielkiej Brytanii"
 TUR_demand_british_withdrawal_desc: "The British have historically stuck their noses into everything, but in recent years their empire has been crumbling. Cyprus, has been an exception however. The British still maintain a presence in Akrotiri, and it is going to cause us problems when we inevitably expand south-ward"
 TUR_bring_the_north_to_fold: "Zjednoczenie z Turcją"
 TUR_bring_the_north_to_fold_desc: "Północni Cypryjczycy są Turkami i nie ma sensu istnienie kolejnego państwa tureckiego. Będziemy żądać, aby ich rząd przyłączył się do naszego i zjednoczył narody tureckie."
 TUR_history_repeated: "Dokończ to, co zaczęliśmy"
 TUR_history_repeated_desc: "We need to finish off what we started. After the disastrous decision not to continue down south, Cyprus has been divided into two. We will have to mobilize our army and conduct a second invasion into the rest of Cyprus whether the Greeks like it or not!"
 TUR_indirect_involvement: "Zaangażowanie pośrednie"
 TUR_indirect_involvement_desc: "Jako republika nie możemy wszczynać konfliktów, kiedy nam się podoba, musimy wykazać się większą powściągliwością. Dlatego jeśli chodzi o Cypr, przyjmiemy bardziej pośrednie podejście i będziemy wspierać prawowitego rządu Cypru Północnego"
 TUR_provide_military_training: "Zapewnij szkolenie wojskowe"
 TUR_provide_military_training_desc: "We will send some experts from the Turkish Armed Forces to train Militias in North Cyprus in preparation of their inevitable clash"
 TUR_fund_militias: "Finansowanie cypryjskich milicji"
 TUR_fund_militias_desc: "Now that we have provided the Militias with some training, we can safely give them some weapons and extra funding as we know they will be competent enough in taking back South Cyprus"
 TUR_great_uprising: "Niech rozpocznie się gra!"
 TUR_great_uprising_desc: "Możemy teraz usiąść i patrzeć, jak Cypryjczycy z Północy toczą w naszym imieniu wojnę, po tym jak udało nam się wyszkolić, finansować i uzbroić ich bojówki przeciwko Cypryjczykom z Południa"
 TUR_path_of_compromise: "Droga kompromisu"
 TUR_path_of_compromise_desc: "Lepiej nie wszczynać kolejnego niekończącego się konfliktu z sąsiadem, ale mądrzej jest pogodzić się i umocnić naszą przyjaźń"
 TUR_withdraw_support_cyprus: "Wycofać wsparcie Turcji"
 TUR_withdraw_support_cyprus_desc: "Nie będziemy już wspierać rządu Cypru Północnego i uznamy rząd Cypru Południowego za jedyny cypryjski rząd państwowy i państwo"
 TUR_support_one_cyprus: "Opowieść o pewnym Cyprze"
 TUR_support_one_cyprus_desc: "We will publically back the concept of one Cyprus, and we will backpedal decades of politics that kept Cyprus divided!"
 TUR_peaceful_unification: "Pokojowe zjednoczenie?"
 TUR_peaceful_unification_desc: "Pokornie poprosimy rząd Cypru Północnego o przyłączenie się do rządu Cypru Południowego.. Pokojowo..."
 TUR_acquire_agean: "Zapytaj o Morze Egejskie"
 TUR_acquire_agean_desc: "Now that we have officially shown the Greeks that we are willing to compromise, even if it means abandoning our national interests, we will kindly ask them to transfer the Aegean into Turkish control"
 TUR_aegan_dispute: "Spór egejski"
 TUR_aegan_dispute_desc: "The Aegean islands have been controlled by Greece ever since the end of WW1, and its disastrous consequences for the Turkish nation. Even though we have held historic claims on the islands, the Greek government is hesitant to even give us partial control of the islands, meaning that we will need to figure out a way to do it through force"
 TUR_crete_rebellion: "Rozbudź kreteński nacjonalizm"
 TUR_crete_rebellion_desc: "If we can get the Cretan people to feel occupied under Greek control, we can perhaps gain something even if it is not the Aegean"
 TUR_arm_crete_national_army: "Uformuj Kreteńską Armię Narodową"
 TUR_arm_crete_national_army_desc: "Utworzymy Kreteńską Armię Narodową w nadziei, że pewnego dnia będą mogli obronić się przed przyszłą inwazją grecką, jeśli w ogóle nadejdzie taki dzień"
 TUR_smuggle_trucks: "Ciężarówki przemytnicze"
 TUR_smuggle_trucks_desc: "Armia Narodowa Krety nie może opierać się wyłącznie na broni strzeleckiej i artylerii, będzie potrzebować kilku ciężarówek. Dostarczymy im kilka ciężarówek, żeby byli gotowi"
 TUR_let_the_games_begin: "Cretan Independence!"
 TUR_let_the_games_begin_desc: "Dziś jest dzień, w którym Kreta ostatecznie ogłasza niepodległość od Grecji i staje się tureckim protektoratem!"
 TUR_fortify_coast: "Propaganda przeciwko Atenom"
 TUR_fortify_coast_desc: "We will start publically broadcasting propaganda against the Greeks by bribing Greek television stations. This will start slowly destabilizing the nation, and giving us an edge during conflict"
 TUR_border_pictures: "Wykorzystuj skorumpowanych polityków"
 TUR_border_pictures_desc: "Kieszenie skorumpowanych greckich polityków są głębokie i wkrótce zaczną je napełniać turecką gotówką, ponieważ możemy pociągnąć za sznurki w ich systemie wyborczym, aby wpłynąć na partie, które chcemy"
 TUR_last_second_upgrades: "Sabotuj ich branże"
 TUR_last_second_upgrades_desc: "Teraz, gdy mamy już pewien wpływ na państwo greckie, możemy zacząć sabotować ich przemysł, aby po spotkaniu z nimi w Atenach stał się słabszy!"
 TUR_siege_of_greece: "W Atenach w mniej niż 5 minut"
 TUR_siege_of_greece_desc: "It shouldn't be long before Turkish armor and infantry start rolling into Athens and raising the Crescent flag on their soil!"
 TUR_operation_sledgehammer: "Próby Ergenekonu"
 TUR_operation_sledgehammer_desc: "The AKP has been eyeing the presidential office for quite some time now... And it won't be too long before they get what they have been so patiently waiting for."
 TUR_purge_army: "Zreorganizuj armię"
 TUR_purge_army_desc: "If we want even the slightest chance of staying in power for longer than 5 days, we are going to have to reorganize the entire army even if it means cutting down spending!"
 TUR_reorganize_army: "Operacja Młot"
 TUR_reorganize_army_desc: "Rozpocznie się operacja Sledgehammer, a po jej zakończeniu będziemy mogli użyć jej jako środka do oczyszczenia wszelkiej opozycji politycznej, z którą się spotkamy"
 TUR_purge_judges: "Reforma sądownictwa"
 TUR_purge_judges_desc: "There are a lot of Gülenist sympathizers within the legal system in our country, and we cannot let this happen as our system will be corrupted and against us"
 TUR_judges_become_criminals: "Sędziowie w kombinezonach"
 TUR_judges_become_criminals_desc: "Now that we have reformed all of the judicial system, and fired all potential Gülenist members within the system, we can finally persecute them without facing much resistance. We will also publically broadcast these trials so that people know what the consequences are"
 TUR_party_of_development_and_justice: "Partia Rozwoju i Sprawiedliwości?"
 TUR_party_of_development_and_justice_desc: "Jesteśmy Partią Rozwoju i Sprawiedliwości, ale nie wiadomo, czy dotrzymamy tej obietnicy. Przed nami bardzo długa droga i z biegiem czasu będziemy musieli ją budować"
 TUR_zero_problems_policy: "Polityka Zero Problemów"
 TUR_zero_problems_policy_desc: "Będziemy prowadzić politykę „zero problemów” z sąsiadami, stawiając na pierwszym planie współpracę i dyplomację, a nie konfrontację"
 TUR_economic_cooperation_iran: "Broker zajmuje się Iranem"
 TUR_economic_cooperation_iran_desc: "Gospodarka Iranu pilnie potrzebuje inwestycji w wyniku dziesięcioleci sankcji, z którymi się borykała. Skontaktowanie się z kilkoma tureckimi firmami w celu założenia sklepu na ich terytorium będzie korzystne dla nas obu, ponieważ możemy uzyskać pewien wpływ, podczas gdy oni otrzymają inwestycję"
 TUR_mediate_nagarno_karabakh: "Mediacja w sporze karabachskim"
 TUR_mediate_nagarno_karabakh_desc: "Azerbejdżan, nasi bliscy przyjaciele, walczą z Ormianami o kawałek terytorium pomiędzy ich narodami. Ten konflikt nie jest konieczny i być może uda nam się pośredniczyć w rozmowach między nimi obojgiem, tak aby wszyscy byli zadowoleni"
 TUR_promote_turkish_interests_syria: "Wykorzystaj chaos w Syrii"
 TUR_promote_turkish_interests_syria_desc: "General instability down south in Syria has given us a golden opportunity to exploit them for further influence"
 TUR_legalize_kurdish_language: "Zalegalizować język kurdyjski"
 TUR_legalize_kurdish_language_desc: "The Kurdish language has been banned in Turkey for many years now, and it is probably best to leave it that way if we want to preserve Turkic dominance in Anatolia. But at what cost? We call ourselves a republic and yet we take away a people's right to speak their language?"
 TUR_open_hostilities_with_greece: "Wykorzystaj uchodźców"
 TUR_open_hostilities_with_greece_desc: "Jesteśmy głównym celem uchodźców i dlatego mamy dużą populację uchodźców. Możemy wykorzystać ich na naszą korzyść i wysłać ich przez granicę do Grecji, aby wywołać niestabilność i chaos"
 TUR_side_with_azerbaijan_against_armenia: "Powrót Azerbejdżanu"
 TUR_side_with_azerbaijan_against_armenia_desc: "Azerbejdżan jest prawowitym właścicielem Karabachu i Armenia musi o tym wiedzieć. Publicznie poprzemy Azerów i zachęcimy ich do podjęcia dalszych działań, nawet jeśli grozi to konfliktem!"
 TUR_a_new_barrier: "Strefa Buforowa"
 TUR_a_new_barrier_desc: "Kurdowie w Syrii zagrażają naszej suwerenności. Będziemy musieli natychmiast utworzyć strefę buforową między nami a Syrią!"
 TUR_tighten_kurdish_restrictions: "Zaostrzyć kurdyjskie prawo"
 TUR_tighten_kurdish_restrictions_desc: "Bez względu na to, co zrobimy, Kurdowie nadal powodują kłopoty. Wygląda na to, że mamy związane ręce i możemy jedynie zwiększać ograniczenia, dopóki nie przestaną sprawiać nam problemów"
 TUR_erdonomics: "Erdonomika"
 TUR_erdonomics_desc: "Erdonomics is the wave of economic reforms brought forth by Recep Tayyip Erdogan and his party. There are several ways this can go, good, bad, or terrible, but it all comes down to how the policy is pursued"
 TUR_cheaper_credit: "Co to jest stopa procentowa?"
 TUR_cheaper_credit_desc: "Poważnie, czy w ogóle tego potrzebujemy?"
 TUR_dont_fix_what_isnt_broken: "Nie naprawiaj tego, jeśli nie jest zepsute"
 TUR_dont_fix_what_isnt_broken_desc: "Turecka gospodarka ma się całkiem dobrze i nie musimy się nią dalej bawić. Jeśli to zrobimy, możemy ryzykować załamanie gospodarcze"
 TUR_digitalization_of_turkey: "Cyfryzacja Turcji"
 TUR_digitalization_of_turkey_desc: "Musimy wkroczyć w XXI wiek z nowymi technologiami i wiedzą na temat nowej ery, w przeciwnym razie pozostaniemy w tyle"
 TUR_lift_tv_restrictions: "Znieś ograniczenia dotyczące telewizji"
 TUR_lift_tv_restrictions_desc: "Na turecką telewizję nałożono dużą cenzurę. W naszym najlepszym interesie leży ich zniesienie i umożliwienie wolności, które zostały odebrane dawno temu"
 TUR_return_to_tradition: "Powrót do Tradycji"
 TUR_return_to_tradition_desc: "Musimy wrócić do naszych korzeni, które są głęboko powiązane z islamem. Konserwatyzm uratuje Turcję przed staniem się wadliwym lustrem innych społeczeństw!"
 TUR_islamic_politics: "Nowi doradcy"
 TUR_islamic_politics_desc: "Nasz gabinet jest pełen bezużytecznych doradców, którzy wprowadzą w błąd nasze przywództwo. Nadszedł czas, abyśmy znaleźli nowych, czy to ds. gospodarki, czy polityki"
 TUR_imams_in_office: "Zwolnić premiera"
 TUR_imams_in_office_desc: "We will need to abolish the position of the prime minister so that our country's democracy can evolve and be reformed"
 TUR_mosque_funding: "Zwyciężyć meczety"
 TUR_mosque_funding_desc: "Potrzebujemy wsparcia ze strony meczetów, aby pozyskać elementy konserwatywne w naszym kraju, co ostatecznie zapewni nam większe poparcie ze strony ludności wiejskiej"
 TUR_islamic_society: "Islam w naszym społeczeństwie"
 TUR_islamic_society_desc: "Let us re-evaluate Islam's role in our society. We will need to expand Islamic teachings in our country one way or the other"
 TUR_expand_diyanet_role: "Dyrekcja ds. Religii"
 TUR_expand_diyanet_role_desc: "Dyrekcja ds. Religii będzie bardzo przydatna w przyszłości i możemy rozszerzyć jej rolę w naszym społeczeństwie, aby nasza władza mogła sięgać daleko w całym kraju"
 TUR_strings_in_judiciary: "Pociągać za sznurki"
 TUR_strings_in_judiciary_desc: "Nasz ruch ma duże poparcie w systemie sądownictwa... i możemy to wykorzystać na naszą korzyść i powoli, ale pewnie wykorzenić AKP"
 TUR_connections_in_army: "Sympatycy w armii"
 TUR_connections_in_army_desc: "Dzięki szerokiemu zapleczu jesteśmy w stanie wykorzystać nasze kontakty w wojsku, aby ich pozyskać i zapobiec potencjalnym zamachom stanu"
 TUR_suspicious_generals_resign: "Naciskaj na podejrzanych generałów, aby ustąpili"
 TUR_suspicious_generals_resign_desc: "Obecnie w TSK działa wielu podejrzanych generałów. Możemy zmusić część z nich do rezygnacji, a dzięki temu skonsolidujemy kontrolę nad wszystkimi rodzajami wojska bez oporu"
 TUR_cracks_in_akp: "Pęknięcia w kierownictwie AKP"
 TUR_cracks_in_akp_desc: "Zaczniemy publicznie potępiać kierownictwo AKP i powodować niestabilność w ich partii. To z pewnością obniży ich popularność, ale prawie na pewno stworzy atmosferę do niektórych protestów"
 TUR_mobilize_diaspora: "Diaspora"
 TUR_mobilize_diaspora_desc: "Możemy wykorzystać diasporę w innych krajach, aby zyskać legitymację naszego rządu"
 TUR_service_to_the_community: "Nasza służba społeczeństwu"
 TUR_service_to_the_community_desc: "Hizmet literally stands for Service, or service to one's community. We must uphold this ideal and start improving our society for the better"
 TUR_attack_the_left: "Atakuj lewicę"
 TUR_attack_the_left_desc: "Lewica będzie próbowała zniszczyć nasz naród swoimi antyislamskimi ideałami. Będziemy musieli zaatakować ich legitymację i sprawić, że będą źle wyglądać na scenie publicznej"
 TUR_attack_the_right: "Atakuj prawicę"
 TUR_attack_the_right_desc: "Prawica będzie końcem tego narodu, ponieważ odizoluje nasz naród od reszty świata. Ich działania mogą nawet wciągnąć Turcję w niekończący się konflikt z jednym z naszych sąsiadów!"
 TUR_ally_fp: "Losy FP"
 TUR_ally_fp_desc: "The FP party was banned before we rose to power, and they have quite a lot of loose members and groups. We can probably negotiate with some of them."
 TUR_clean_energy_shift: "Przejdź na czystą energię"
 TUR_clean_energy_shift_desc: "We need to do the Earth a giant favor, and it can be done by shifting our country towards cleaner energy. By using clean energy, we will be able to provide our nation with the necessary fuel whilst also protecting the environment from pollution."
 TUR_international_community: "Społeczność międzynarodowa"
 TUR_international_community_desc: "Oczywiście skupiamy się głównie na Turcji, ale mamy też obowiązek uczynić cały świat lepszym miejscem"
 TUR_condemn_gulf_monarchies: "Potępiać monarchię saudyjską"
 TUR_condemn_gulf_monarchies_desc: "Niestety, Saudyjczycy wybrali tę ścieżkę agresji, określając naszą grupę jako organizację terrorystyczną. Będziemy musieli im pokazać, że nie możemy tolerować takiej agresji"
 TUR_support_kosovo: "Wesprzyj Kosowo"
 TUR_support_kosovo_desc: "Kosowo znajduje się już od jakiegoś czasu pod serbską okupacją i jako współmuzułmanie nie możemy dłużej pozwolić, aby wyrządzali sobie taką krzywdę"
 TUR_fatih_university: "Uniwersytet Fatih"
 TUR_fatih_university_desc: "Fatih University has a lot of Gülenist sympathizers within its staff. We will give them some extra funds and spread the teachings of Gülen"
 TUR_strengthen_private_sector: "Strengthen Gülenist Businesses"
 TUR_strengthen_private_sector_desc: "Obecnie wiele przedsiębiorstw jest własnością Gülenistów i jest przez nich zarządzanych, co daje nam znaczną przewagę w kraju. Finansowanie ich i wzmacnianie ich pozycji poważnie nam pomoże w najbliższej przyszłości"
 TUR_gulenist_medias: "Fundusz Gülenist Media"
 TUR_gulenist_medias_desc: "Będziemy musieli znaleźć nowe sposoby szerzenia przesłania Gülena bez konieczności organizowania wieców"
 TUR_zaman_media_group: "Zaman Media Group przechodzi na technologię cyfrową"
 TUR_zaman_media_group_desc: "Zaman Media Group is a newspaper company which operates very closely with our government. Giving them a little boost can help them go digital and spread the message of Fethullah Gülen far and wide"
 TUR_gulenist_charity: "Organizacja charytatywna Gülenista"
 TUR_gulenist_charity_desc: "Jednym z głównych filarów islamu jest dawanie jałmużny. Nasz ruch nie zapomni o tym i zobowiąże się do tworzenia nowych organizacji charytatywnych, które pomagają biednym i potrzebującym"
 TUR_kimse_yok_mu: "Kimse Yok Mu (Jest Tu Kto)?"
 TUR_kimse_yok_mu_desc: "Is anyone there? is the name of one of the newly founded Gülenist charities which is going to help people in need"
 TUR_cultural_centers: "Uspokój konglomeraty"
 TUR_cultural_centers_desc: "Konglomeraty przemysłowe mają duże wpływy w naszym rządzie i mogą bardzo łatwo wpływać na naszą politykę. Uspokojenie ich będzie najlepszą opcją, ponieważ może zapobiec przyszłym bólom głowy spowodowanym przez grupę"
 TUR_right_wing_victory: "Zwycięstwo prawicy"
 TUR_right_wing_victory_desc: "The MHP has secured a win in the election, and will transform Turkey into a hyper-nationalist state with an aggressive policy towards other countries. Some fear that Turkey will soon become an international bully, as it slowly pushes its neighbors around."
 TUR_crack_down_secularists: "Rozprawić się z sekularystami"
 TUR_crack_down_secularists_desc: "Sekularyści to grupa ludzi, która nie wie, co jest dobre dla kraju. Jedyne, co robią, to płaczą i krzyczą o „wolności osobiste” i generalnie mają antyislamskie poglądy. Musimy zniszczyć ich zdolność do zdobywania popularności na skalę krajową i odwrócić wprowadzone przez nich zmiany!"
 TUR_crack_down_foreign_influence: "Zwalczanie wpływów zagranicznych"
 TUR_crack_down_foreign_influence_desc: "Foreigners are trying to run Turkiye for us! We need to get rid of them immediately and run it ourselves"
 TUR_crack_down_corruption: "Zwalcz korupcję"
 TUR_crack_down_corruption_desc: "Skorumpowani politycy spowalniają nasz naród, a jeśli nasz naród nie będzie działał tak, jak powinien, pozostanie w tyle. Jedynym sposobem, w jaki możemy pójść do przodu, jest oczyszczenie ze skorumpowanych polityków"
 TUR_crackdown_kurdish_resistance: "Rozprawić się z ruchem oporu PKK"
 TUR_crackdown_kurdish_resistance_desc: "The PKK are causing quite a lot of problems for us. We will quite frankly need to deal with them more aggressively"
 TUR_demand_return_of_suspects: "Żądaj powrotu podejrzanych"
 TUR_demand_return_of_suspects_desc: "There are a lot of PKK members in other countries. We will demand these countries deport these individuals immediately so we can hold trials and limit their influence"
 TUR_the_threat_abroad: "Zagrożenie za granicą"
 TUR_the_threat_abroad_desc: "There is a major threat abroad, and we are in between it. The East and the West of our country holds our nation's enemies, who so desperately try to destroy us"
 TUR_eastern_nuisance: "Wschodnia nieprzyjemność"
 TUR_eastern_nuisance_desc: "The Iranians and Russians have been our historic enemies, for centuries. But in the modern day, they wear fake masks and pretend to be our friends, but this cannot be! We will cut them out and pursue actions that really put them in their place"
 TUR_fight_russian_influence: "Przeciwdziałanie wpływom Rosji"
 TUR_fight_russian_influence_desc: "Rosjanie próbują wpływać na naszą politykę i politykę naszych sąsiadów. Pierwszą rzeczą, którą musimy zrobić, to przeciwdziałać temu wpływowi własnymi siłami"
 TUR_hamper_the_ayatollahs: "Ograniczenie irańskiego wzrostu"
 TUR_hamper_the_ayatollahs_desc: "The Iranians are advancing, and growing quite quickly. We will need to hamper their ability to do so as soon as possible"
 TUR_balkan_pests: "Bałkański szkodnik"
 TUR_balkan_pests_desc: "We have historically owned the Balkans, and when we did, it was quite peaceful. But during the Balkan Wars we lost the Balkans. Today however, we will take them back, and we will take them back with great pride!"
 TUR_thrace_becomes_one: "Tracja staje się jednością"
 TUR_thrace_becomes_one_desc: "Thrace is split into two, one side of it is on our territory, and the other is in Greece. Why must this be? We will make sure the people of Thrace are united under one flag, the Crescent and the Star"
 TUR_campaign_against_athens: "Bułgarska rekonkwista"
 TUR_campaign_against_athens_desc: "Bułgaria jest jednym z wielu Vilayets, które się od nas oderwały. Naszym obowiązkiem jest przyjąć ich z powrotem i ponownie zjednoczyć z narodem tureckim"
 TUR_end_of_elections: "Koniec Republiki"
 TUR_end_of_elections_desc: "W tym dniu Republiki Tureckiej już nie będzie. Nasi ludzie zostali prześladowani i poddani praniu mózgów pod pretekstem tak zwanego „wybieranego rządu”. Nasi ludzie byli wprowadzani w błąd, okłamywani i manipulowani przez dziesięciolecia systemu kemalistycznego"
 TUR_pan_turkey: "Sen pan-turecki"
 TUR_pan_turkey_desc: "Dzisiaj ludy mówiące po turecku są podzielone na kilka różnych terytoriów. Część tutaj w Turcji, część na Kaukazie, a część w Azji Środkowej. Turecki sen nie zostanie zapomniany, a ludy zostaną zjednoczone raz jeszcze."
 TUR_a_new_empire: "Bardzo głodny wilk.."
 TUR_a_new_empire_desc: "The Turkish Wolf has been starving for decades, it can no longer howl. But this will change, the world will tremble as they see the Turkish nation carve the world for itself and its people"
 TUR_ottoman_politics: "[ROOT.TUR_ottomanism_name]"
 TUR_ottoman_politics_desc: "[ROOT.TUR_ottomanism_name_desc]"
 TUR_nine_light_name: "Doktryna dziewięciu świateł"
 TUR_nine_light_name_desc: "Doktryna Dziewięciu Świateł opiera się na tureckim nacjonalizmie i islamie. Reprezentuje ideały dobra wszystkich i nasza partia została przez to w dużym stopniu ukształtowana."
 TUR_ottomanism_name: "Polityka osmańska"
 TUR_ottomanism_name_desc: "Nasi przodkowie potrafili rządzić bez żadnych problemów, a to oznacza tylko tyle, że aby odnieść sukces, musimy pójść w ich ślady"
 TUR_a_new_army: "Odnowione środki dla OKK"
 TUR_a_new_army_desc: "Yes, the Janissaries were cool and all, but, perhaps we can try something newer. We will increase our funding for the Ozel Kuvvetler Komutanligi, or our special forces units"
 TUR_return_to_sunni_dominance: "Powrót dominacji sunnickiej"
 TUR_return_to_sunni_dominance_desc: "Za bardzo odeszliśmy od naszych islamskich korzeni. Przywrócimy stare zwyczaje, promując sunnizm wśród wszystkich naszych rodaków"
 TUR_supporting_conservatives: "Wspieraj konserwatywne establishmenty"
 TUR_supporting_conservatives_desc: "Chociaż będziemy państwem jednopartyjnym, będziemy finansować inne organizacje konserwatywne, aby ludzie, którzy niekoniecznie nas wspierają, mogli wspierać naszą ideologię i wartości"
 TUR_osman_alliance: "Wzmocnij Osmana"
 TUR_osman_alliance_desc: "Nasze marzenia o stworzeniu nowego tureckiego superpotęgi muszą mieć jakąś legitymację. Możemy skontaktować się z domem Osmanów, aby dołączyć do naszego rządu i umożliwić mu przywrócenie chwały naszego dawno utraconego imperium!"
 TUR_turkish_relations: "Stosunki Tureckie"
 TUR_turkish_relations_desc: "We are centered in between Europe and Asia, making diplomacy with us very important. But, we also have a say in who we want to align with. The West, have supported us for decades, but the East is now trying to do the same."
 TUR_eastern_alignment: "Wyrównanie wschodnie"
 TUR_eastern_alignment_desc: "NATO had all of its benefits, but they forced us to change our governance and culture in more ways than the East has. For that reason, to maintain our independence and culture, it is best we seek out formal ties with the East."
 TUR_military_coop_india: "Współpraca wojskowa z Indiami"
 TUR_military_coop_india_desc: "Możemy skorzystać z długotrwałej współpracy wojskowej z Indiami. Dzięki wspólnemu szkoleniu i ćwiczeniom naszych armii możemy nauczyć się nowych taktyk i strategii, a jednocześnie zbliżyć do siebie nasze dwa narody."
 TUR_support_belt_road_china: "Wesprzyj inicjatywę Pasa i Szlaku"
 TUR_support_belt_road_china_desc: "The Belt and Road initiative is a massive infrastructure plan led by the Chinese to bring proper infrastructure all around the globe. Why must we oppose such an initiative?"
 TUR_schools_in_pakistan: "Fundusz Szkół w Pakistanie"
 TUR_schools_in_pakistan_desc: "Pakistan rozpaczliwie potrzebuje odpowiedniej infrastruktury edukacyjnej i możemy spróbować ją zapewnić, budując nowe szkoły, w których ludzie mogliby się uczyć."
 TUR_turkstream_russia_pipeline: "Rurociąg Turkstream-Rosja"
 TUR_turkstream_russia_pipeline_desc: "Gazociąg Turkstream to rurociąg gazu ziemnego biegnący z Rosji do Turcji. Rurociąg ten zapewni duże ilości gazu ziemnego do części Europy Zachodniej i może mieć kluczowe znaczenie dla wsparcia gospodarki."
 TUR_afghan_roads: "Drogi w Afganistanie"
 TUR_afghan_roads_desc: "Afghanistan has very few functioning roads due to their civil war which has lasted decades. We are able to construct some for them so that their citizens can get from place to place without problems."
 TUR_mutual_tourism_indonesia: "Turystyka z Indonezją"
 TUR_mutual_tourism_indonesia_desc: "Ustanawiając programy turystyczne z Indonezją, obie nasze gospodarki mogą skorzystać na przybyszach i turystach."
 TUR_provide_aid_yemen: "Lotniska w Jemenie"
 TUR_provide_aid_yemen_desc: "Yemen needs adequate Airports, and we can provide that to them with the experts from our country."
 TUR_industrial_investments_egypt: "Zatrudnij egipskich pracowników"
 TUR_industrial_investments_egypt_desc: "Możemy masowo zatrudniać egipskich pracowników do naszych fabryk. W ten sposób możemy obniżyć koszty i zapewnić możliwości pracy osobom w Egipcie."
 TUR_religious_tourism_saudi: "Turystyka religijna z Arabią Saudyjską"
 TUR_religious_tourism_saudi_desc: "Arabia Saudyjska ma jedno z najświętszych miejsc islamu znajdujące się w jej granicach. Z tego powodu będziemy musieli zawrzeć z nimi pewne umowy, aby nasi ludzie mogli podróżować tam bezpieczniej i szybciej."
 TUR_investments_in_qatar: "Bazy wojskowe w Katarze"
 TUR_investments_in_qatar_desc: "Zamierzamy poprosić Katar, aby pozwolił nam założyć bazy wojskowe w ich kraju, abyśmy mogli zbliżyć się militarnie. Możemy także spróbować chronić je przed innymi zagrożeniami w regionie."
 TUR_western_alignment: "Utrzymuj zachodnie wyrównanie"
 TUR_western_alignment_desc: "Dlaczego po wielu latach przyjaźni z Zachodem mielibyśmy szukać czegoś innego? Najlepiej będzie, jeśli utrzymamy nasze zachodnie podejście, aby nie dokonać drastycznych zmian w naszej polityce zagranicznej."
 TUR_counter_terror_with_us: "Wysiłki przeciw terroryzmowi"
 TUR_counter_terror_with_us_desc: "Zamierzamy pomóc Stanom Zjednoczonym w operacjach antyterrorystycznych na Bliskim Wschodzie, aby region mógł być bezpieczniejszy i bardziej stabilny."
 TUR_archeology_coop_italy: "Współpraca archeologiczna z Włochami"
 TUR_archeology_coop_italy_desc: "We have had historic ties with the Italians, dating back hundreds of years, but we are yet to discover all of the treasures that are buried under our lands. We will call on archeological experts from Italy to come help dig them up!"
 TUR_encourage_migration_germany: "Zachęcaj migrantów z Niemiec"
 TUR_encourage_migration_germany_desc: "Wielu naszych ludzi wyjeżdżało do Niemiec, ale Niemcy nie zrobili tego samego. Będziemy prosić Niemców, żeby przysłali nam migrantów, abyśmy mogli być tyglem narodowym."
 TUR_sports_diplomacy_brazil: "Dyplomacja sportowa z Brazylią"
 TUR_sports_diplomacy_brazil_desc: "Brazylijczycy kochają piłkę nożną i my też, dlatego będziemy prowadzić z Brazylijczykami dyplomację sportową i zachęcać ich do rozgrywania meczów towarzyskich w naszym kraju."
 TUR_join_business_councils_morocco: "Joint Business Councils with Morocco"
 TUR_join_business_councils_morocco_desc: "Establishing joint business councils with Morocco would help both of us greatly, as we are able to get our companies to cooperate with each other, letting them expand."
 TUR_humanitarian_help_australia: "Eksperci humanitarni z Australii"
 TUR_humanitarian_help_australia_desc: "Australia przeżywa każdy rodzaj katastrofy, a ostatnio my także przechodziliśmy przez wiele z nich. Pozyskując Australijczyków do pomocy, możemy być trochę lepiej przygotowani na wypadek, gdyby wydarzyło się coś złego."
 TUR_great_east: "Wielki Wschód"
 TUR_great_east_desc: "Our organization, The Great Eastern Islamic Raiders' Front, vows to bring historic changes to the Turkish nation. No longer will we be held back by imperialist ideology, we will persevere!"
 TUR_dismantle_the_republic: "Zdemontować Republikę"
 TUR_dismantle_the_republic_desc: "Teraz, gdy rządzimy, nie jest potrzebna republika. Republika musi zostać jak najszybciej rozwiązana, a armia oczyszczona!"
 TUR_ties_with_saud: "Związki z Saudem"
 TUR_ties_with_saud_desc: "Niewiele krajów byłoby zainteresowanych utrzymaniem więzi z naszym narodem, ale Saudyjczycy są inni. Możemy utrzymywać z nimi więzi, ponieważ wyznają podobną do nas ideologię, dzięki czemu nasz rząd może utrzymać poziom legitymizacji międzynarodowej"
 TUR_islamic_legacy: "Dziedzictwo Islamu"
 TUR_islamic_legacy_desc: "Islam ma bardzo długą historię w naszym narodzie i nie możemy o tym zapominać. Wykorzystamy to na naszą korzyść do celów ideologicznych"
 TUR_combat_imperialism: "Walka z imperializmem"
 TUR_combat_imperialism_desc: "Wszystkie wierzenia i ideologie imperialistyczne przeniknęły do ​​naszego niegdyś wielkiego narodu. Walka z tymi ideałami jest najlepszym sposobem na przywrócenie naszemu krajowi dawnej świetności"
 TUR_ban_kemalism: "Zakazać partiom świeckim"
 TUR_ban_kemalism_desc: "Sekularyzm jest tym, co zrujnowało ten naród. Wypierając islam, sekularyści byli w stanie narzucić narodowi swoje przekonania, ale nie będą już w stanie tego zrobić!"
 TUR_demand_hejaz: "Zażądaj Hejaza"
 TUR_demand_hejaz_desc: "Saudyjczycy rościją sobie prawa do wielu ważnych miast świata islamskiego, a tak się składa, że ​​miasta te znajdują się głównie w Hejaz. Będziemy żądać, aby przekazali naszemu rządowi kontrolę nad terytorium, jeśli będzie chciał uniknąć konfliktu"
 TUR_sharia_mandate: "Mandat szariatu"
 TUR_sharia_mandate_desc: "Nasz naród będzie kierował się zasadami islamu i TYLKO zasadami islamu. Prawo szariatu zostanie ponownie wprowadzone w życie, pozwalając naszemu narodowi być znów czystym i sprawiedliwym."
 TUR_one_banner_one_people: "Jeden sztandar, jedni ludzie"
 TUR_one_banner_one_people_desc: "Nasz naród będzie zjednoczony pod jednym sztandarem, sztandarem islamu. Nie ma potrzeby tworzenia podziałów rasowych w naszym narodzie poprzez zezwolenie na używanie kilku języków"
 TUR_legalize_languages: "Jeden baner, wiele osób"
 TUR_legalize_languages_desc: "Our people are free to speak whatever language they want. We should not cause a racial divide in our land by banning the use of several languages in the state"
 TUR_crack_down_shiism: "Ograniczenia dla szyizmu"
 TUR_crack_down_shiism_desc: "We need to make sure that everyone assimilates into the Sunni sect, even if it means creating restrictions for Shi'ites. We will prohibit Shi'ite practices from public places, and we will fund campaigns that will encourage the Shi'ites to convert"
 TUR_return_of_caliphate: "Powrót kalifatu"
 TUR_return_of_caliphate_desc: "Kalifat musi powrócić i powróci. Zamierzamy upewnić się, że kalifat zostanie ponownie zjednoczony poprzez wojnę i podbój, jeśli zajdzie taka potrzeba. Region nie będzie już dłużej problemem"
 TUR_gender_differations: "Segreguj płeć"
 TUR_gender_differations_desc: "Musimy stworzyć oddzielne udogodnienia dla mężczyzn i kobiet. Niezależnie od tego, czy chodzi o przystanki autobusowe, szkoły czy miejsca pracy, mężczyźni i kobiety muszą być segregowani ze względów religijnych!"
 TUR_enforce_dress_code: "Kodeks ubioru"
 TUR_enforce_dress_code_desc: "Będziemy egzekwować surowy kodeks ubioru, który poprowadzi nasz naród ścieżką czystości i prawości. Jeśli nasi ludzie ubierają się nieodpowiednio, jak możemy oczekiwać jakiegokolwiek postępu duchowego?"
 TUR_westard: "Ekspansja na zachód"
 TUR_westard_desc: "Turcy byli słabi i stracili zachodnią część kalifatu. Zmienimy to, odbierzemy z dumą i wielką siłą"
 TUR_southward: "Ekspansja na południe"
 TUR_southward_desc: "Arabskie bunty i wzrost arabskiego nacjonalizmu utrudniły Osmanom kontrolowanie ich. Jednakże wraz z powstaniem naszego rządu i naszą wielką siłą zadbamy o to, aby to się więcej nie powtórzyło"
 TUR_eastward: "Ekspansja na Wschód"
 TUR_eastward_desc: "Wschód został nam zabrany, czy to przez Rosjan, czy przez Persów. Ale dziś Kaukaz jest niepodległy, choć nie będzie nim zbyt długo."
 TUR_african_holdings: "Gospodarstwa Afrykańskie"
 TUR_african_holdings_desc: "The Europeans and their colonial ambitions resulted in the loss of Ottoman African holdings. Unfortunately they were unable to expand or maintain their holds in Africa for very long as a result of the Europeans, but no one is stopping us now"
 TUR_turkish_intervention: "Turecki interwencjonizm"
 TUR_turkish_intervention_desc: "The Turkish nation has intervened in several conflicts world wide, and it has helped project Turkish military power, and influence outwards. By intervening in other nations' internal conflicts, we are able to influence the outcomes of those wars to be more favorable for us"
 TUR_intervene_syrian_civilwar: "Wojna domowa w Syrii"
 TUR_intervene_syrian_civilwar_desc: "W Syrii pogrążył się chaos i ze względu na bliskość naszego narodu głupotą byłoby stać bezczynnie i przyglądać się temu z boku"
 TUR_back_assad: "Powrót Assada"
 TUR_back_assad_desc: "Assad jest prawowitym przywódcą Syrii, a wszystkich innych należy uważać za nielegalnych!"
 TUR_back_fsa: "Wesprzyj Wolną Armię Syryjską"
 TUR_back_fsa_desc: "Wolna Armia Syryjska walczy o bardzo słuszną sprawę, demokrację. Musimy ich wspierać w każdy możliwy sposób, aby mogli odnieść zwycięstwo i przynieść radość wolności narodowi syryjskiemu!"
 TUR_intervene_afghan_war: "Wojna domowa w Afganistanie"
 TUR_intervene_afghan_war_desc: "Afghanistan has been in a civil war for quite some time now, and not much has changed. Perhaps we can sway the outcome to be in our favor."
 TUR_a_new_stance: "Nowe stanowisko"
 TUR_a_new_stance_desc: "Talibowie od bardzo dawna walczą o wyparcie obcych wpływów i interwencji w swoim narodzie i nie do nas należy interweniowanie i powstrzymywanie ich. Zamiast tego musimy wspierać ich sprawę i wzmacniać ich siły, aby mogli wyzwolić swój naród od zagranicznego wyzysku"
 TUR_northern_cause: "Sprawa Północy"
 TUR_northern_cause_desc: "The Northern Alliance have been persistent in their efforts of expelling the vile Taliban from Afghanistan. The Taliban will bring nothing but tyranny, injustice, and oppression to Afghanistan, and we must help the Northern alliance defeat the Taliban!"
 TUR_intervene_iraq_war: "Interwencja w Iraku"
 TUR_intervene_iraq_war_desc: "By exploiting the chaos in Iraq, we will be able to achieve certain goals of ours that have been put on hold for the longest time now."
 TUR_peacekeepers: "Misje Utrzymania Pokoju"
 TUR_peacekeepers_desc: "It would be best for us not to fan the flames any further, as the situation is already pretty bad in Iraq. Instead, we should opt to help the Iraqi people catch a break from the war by sending peace-keeping soldiers to villages and cities in the north."
 TUR_conduct_operation: "Przeprowadzić operację"
 TUR_strike_pkk_bases: "Napad na twierdze PKK"
 TUR_arrest_members: "Zatrzymanie podejrzanych członków PKK"
 TUR_attack_on_media: "Propaganda anty-PKK"
 TUR_allow_pkk_bases: "Zalegalizować PKK"
 TUR_appease_PKK: "Uspokój PKK"
 TUR_forbid_pkk_bases: "Zakazać PKK"
 TurkicConfederation.1.t: "Turcja zaprasza nas do Konfederacji Tureckiej"
 TurkicConfederation.1.d: "The Turkish Government has approached us, asking us to join the newly founded Turkic Confederation. Obviously if we do join, we will be united, but we will lose our position as a sovereign country."
 TurkicConfederation.1.a: "Narody tureckie są jedno!"
 TurkicConfederation.1.b: "Lepiej, żebyśmy się nie przyłączali..."
 TurkicConfederation.2.t: "Turcja zaprasza nas do Konfederacji Tureckiej"
 TurkicConfederation.2.d: "Rząd turecki zwrócił się do nas z prośbą o przyłączenie się do nowo powstałej Konfederacji Tureckiej. Oczywiście, jeśli się połączymy, będziemy zjednoczeni, ale stracimy pozycję suwerennego kraju."
 TurkicConfederation.2.a: "Narody tureckie są jedno!"
 TurkicConfederation.2.b: "Lepiej, żebyśmy się nie przyłączali..."
 TurkicConfederation.3.t: "Turcja zaprasza nas do Konfederacji Tureckiej"
 TurkicConfederation.3.d: "Rząd turecki zwrócił się do nas z prośbą o przyłączenie się do nowo powstałej Konfederacji Tureckiej. Oczywiście, jeśli się połączymy, będziemy zjednoczeni, ale stracimy pozycję suwerennego kraju."
 TurkicConfederation.3.a: "Narody tureckie są jedno!"
 TurkicConfederation.3.b: "Lepiej, żebyśmy się nie przyłączali..."
 TurkicConfederation.4.t: "Turcja zaprasza nas do Konfederacji Tureckiej"
 TurkicConfederation.4.d: "Rząd turecki zwrócił się do nas z prośbą o przyłączenie się do nowo powstałej Konfederacji Tureckiej. Oczywiście, jeśli się połączymy, będziemy zjednoczeni, ale stracimy pozycję suwerennego kraju."
 TurkicConfederation.4.a: "Narody tureckie są jedno!"
 TurkicConfederation.4.b: "Lepiej, żebyśmy się nie przyłączali..."
 TurkicConfederation.11.t: "Azerbejdżan dołącza!"
 TurkicConfederation.11.d: "Rząd Azerbejdżanu przyjął naszą ofertę przyłączenia się do Konfederacji Tureckiej. W końcu zjednoczymy się z naszymi braćmi w Azerbejdżanie!"
 TurkicConfederation.11.a: "Wspaniała wiadomość dla Konfederacji Tureckiej"
 TurkicConfederation.21.t: "Kazachstan dołącza!"
 TurkicConfederation.21.d: "Rząd Kazachstanu przyjął naszą ofertę przyłączenia się do Konfederacji Tureckiej. Wreszcie zjednoczymy się z naszymi braćmi w Kazachstanie!"
 TurkicConfederation.21.a: "Wspaniała wiadomość dla Konfederacji Tureckiej"
 TurkicConfederation.31.t: "Uzbekistan dołącza!"
 TurkicConfederation.31.d: "Rząd uzbecki przyjął naszą ofertę przyłączenia się do Konfederacji Tureckiej. Wreszcie zjednoczymy się z naszymi braćmi w Uzbekistanie!"
 TurkicConfederation.31.a: "Wspaniała wiadomość dla Konfederacji Tureckiej"
 TurkicConfederation.41.t: "Turkmenistan dołącza!"
 TurkicConfederation.41.d: "Rząd turkmeński przyjął naszą ofertę przyłączenia się do Konfederacji Tureckiej. W końcu zjednoczymy się z naszymi braćmi w Turkmenistanie!"
 TurkicConfederation.41.a: "Wspaniała wiadomość dla Konfederacji Tureckiej"
 TurkicConfederation.12.t: "Azerbejdżan odrzuca ofertę"
 TurkicConfederation.12.d: "Rząd azerski odrzucił naszą ofertę przyłączenia się do Konfederacji Tureckiej. Wygląda na to, że w kwestii ewentualnego zjednoczenia będziemy musieli zwrócić się do innych narodów."
 TurkicConfederation.12.a: "Niefortunny"
 TurkicConfederation.22.t: "Kazachstan odrzuca ofertę"
 TurkicConfederation.22.d: "Rząd Kazachstanu odrzucił naszą ofertę przyłączenia się do Konfederacji Tureckiej. Wygląda na to, że w kwestii ewentualnego zjednoczenia będziemy musieli zwrócić się do innych narodów."
 TurkicConfederation.22.a: "Niefortunny"
 TurkicConfederation.32.t: "Uzbekistan odrzuca ofertę"
 TurkicConfederation.32.d: "Rząd uzbecki odrzucił naszą ofertę przyłączenia się do Konfederacji Tureckiej. Wygląda na to, że w kwestii ewentualnego zjednoczenia będziemy musieli zwrócić się do innych narodów."
 TurkicConfederation.32.a: "Niefortunny"
 TurkicConfederation.42.t: "Turkmenistan odrzuca ofertę"
 TurkicConfederation.42.d: "Rząd turkmeński odrzucił naszą ofertę przyłączenia się do Konfederacji Tureckiej. Wygląda na to, że w kwestii ewentualnego zjednoczenia będziemy musieli zwrócić się do innych narodów."
 TurkicConfederation.42.a: "Niefortunny"
 TUR_flavor_event.1.t: "Upadek gospodarczy Turcji!"
 TUR_flavor_event.1.d: "It appears that our economy has collapsed, and we are unable to do anything to save it this instant. We are going to have to devise an economic plan which lets us slowly repair the economy, and set forth a Turkish Economic boom. We have a long road ahead of us, so we will have to get to work as soon as possible."
 TUR_flavor_event.1.a: "Miejmy nadzieję, że to już ostatni z naszych problemów"
 TUR_flavor_event.2.t: "Potężne trzęsienie ziemi w Bingol"
 TUR_flavor_event.2.d: "A major 6.4 magnitude earthquake has rocked the Eastern city of Bingol. 177 people were killed, 84 of which being the result of a collapsing dormitory block in a boarding school. Roughly 8,000 houses were damaged, and about 4 schools have collapsed. This earthquake must act as a reminder for us to step up our disaster relief program."
 TUR_flavor_event.2.a: "Smutny dzień dla naszego narodu"
 TUR_flavor_event.3.t: "Bomba w Stambule!"
 TUR_flavor_event.3.d: "At around 9:30 in the morning about five days ago, two trucks loaded with bombs were detonated in Istanbul. One near Neve Shalom Synagogue, and one in Bet Israel Synagogue. About 28 people have lost their lives, while another 300 were injured. Today, we have gotten news that another 31 people were killed during an attack on the British consulate, and another 450 people were injured. In total, 59 people lost their lives, and 750 more were injured as a result of these attacks."
 TUR_flavor_event.3.a: "Straszny"
 TUR_flavor_event.3.b: "Przygotuj pewien poziom pomocy"
 TUR_flavor_event.3.c: "Przygotuj całą pomoc pod ręką"
 TUR_flavor_event.4.t: "Wprowadzenie nowej liry"
 TUR_flavor_event.4.d: "Recently, a major change to the Lira has been brought about. The Grand National Assembly had voted on the removal of six zeros from the Lira. This means that 1 lira of the new currency is the equivalent of 1,000,000 lira of the old version. However some are doubtful of this new change, and they are arguing that it could do more harm than good to the nation."
 TUR_flavor_event.4.a: "Nie, to dobra zmiana"
 TUR_flavor_event.4.b: "Stare jest złotem"
 TUR_flavor_event.5.t: "Zabójstwo Hranta Dinka"
 TUR_flavor_event.5.d: "Hrant Dink, a Turkish-Armenian journalist, had been assassinated in Istanbul a few days back. He was an activist of minority rights, and a newspaper editor who actively sought out the reconciliation between Armenians, and Turks. The murderer has been identified as a 17 year old male, and he is now under police custody. Hrant's death has sparked outrage amongst the Armenian community within our nation, and today was the funeral where thousands gathered in solidarity."
 TUR_flavor_event.5.a: "Tragiczny"
 TUR_flavor_event.6.t: "Napływ migrantów"
 TUR_flavor_event.6.d: "Lately, we have been receiving more and more migrants from neighboring countries and abroad due to increasing conflicts. This is starting to slowly destabilize our politics, and some people are even pushing for more aggressive policies. We will have to prepare a response to the series of events."
 TUR_flavor_event.6.a: "Im wiecej tym lepiej?"
 TUR_flavor_event.7.t: "Wzrost używania narkotyków"
 TUR_flavor_event.7.d: "Używanie narkotyków powoli rośnie w niektórych obszarach kraju, szczególnie w obszarach o niższych dochodach. Będzie to miało druzgocące skutki, ponieważ nasze zasady i przepisy są wszędzie obowiązujące w tej kwestii."
 TUR_flavor_event.7.a: "Zrewiduj prawa"
 TUR_flavor_event.8.t: "Nalot na Flotyllę Gazy"
 TUR_flavor_event.8.d: "Wcześniej tego dnia izraelscy komandosi marynarki wojennej przeprowadzili operację przeciwko kilku cywilnym statkom, zabijając 9 obywateli Turcji na pokładzie Mavi Marmara. Flotylle przewoziły pomoc humanitarną i pomoc w celu przełamania izraelskiej blokady Strefy Gazy. Nie usprawiedliwia to jednak zabijania naszych obywateli, a Izrael bardzo niechętnie udzielał jakichkolwiek odszkodowań lub przeprosin..."
 TUR_flavor_event.8.a: "Żądajmy odszkodowań ORAZ przeprosin!"
 TUR_flavor_event.8.b: "Mamy większe problemy pod ręką.."
 TUR_flavor_event.81.t: "Turcja żąda odszkodowań za nalot na Flotyllę Gazy"
 TUR_flavor_event.81.d: "Rząd turecki jest rozgniewany z powodu wejścia na pokład naszych komandosów i zatrzymania statków przed przełamaniem blokady Strefy Gazy. Oczywiście to oni są winni, ponieważ daliśmy im kilka ostrzeżeń, ale ich to nie obchodzi."
 TUR_flavor_event.81.a: "Zapłać odszkodowania i miejmy to już za sobą"
 TUR_flavor_event.81.b: "Za nic nie płacimy"
 TUR_flavor_event.811.t: "Izrael płaci reparacje"
 TUR_flavor_event.811.d: "Israel has agreed to pay reparations to the victims' families and our state as a result of the unjustified raid against the Free Gaza Movement."
 TUR_flavor_event.811.a: "Odszkodowań nigdy dość.."
 TUR_flavor_event.812.t: "Izrael ignoruje naszą prośbę"
 TUR_flavor_event.812.d: "The Israeli government has rebuffed our demands, saying that we have no say in demanding reparations as we were the ones at fault. This is an outrageous statement, but we will not forget this."
 TUR_flavor_event.812.a: "Nie do wiary"
 TUR_flavor_event.9.t: "Trzęsienie ziemi wstrząsnęło Vanem"
 TUR_flavor_event.9.d: "Dzisiaj rano Vanem wstrząsnęło trzęsienie ziemi o sile około 7,1 w skali Richtera. Uszkodzonych lub zniszczonych zostało około 11 000 budynków, w wyniku czego ponad 60 000 osób zostało bez dachu nad głową, a około 600 zginęło. Niestety, nie jest to rzadkością, ponieważ naszym wschodnim regionom nie są obce klęski żywiołowe, takie jak trzęsienia ziemi."
 TUR_flavor_event.9.a: "Tragedia"
 TUR_flavor_event.9.b: "Zmobilizuj pomoc w przypadku klęsk żywiołowych"
 TUR_flavor_event.10.t: "Protesty Nowruza"
 TUR_flavor_event.10.d: "Kurds across the nation are starting to protest against our government's policies, and they are demanding that we change them to better suit their needs. Obviously they want nothing more but to destroy the Turkish nation, as a lot of these protesters are in favor of the PKK."
 TUR_flavor_event.10.a: "Spraw, aby policja była w pogotowiu"
 TUR_flavor_event.10.b: "Niech protestują"
 TUR_flavor_event.11.t: "Ambasada USA zaatakowana!"
 TUR_flavor_event.11.d: "The U.S. Embassy in Ankara has been attacked by a man wearing a vest strapped with explosives. The attack left the suspect, and one Turkish security guard dead, whilst also damaging the building itself by leaving a giant hole on the side of it. The White House has said that it will have to conduct its own investigations as to why it happened, but this should not have happened in the first place."
 TUR_flavor_event.11.a: "No need for an investigation if they're doing one"
 TUR_flavor_event.11.b: "Rozpocznijmy własne śledztwo"
 TUR_flavor_event.12.t: "Katastrofa górnicza w Somie"
 TUR_flavor_event.12.d: "About 2 days ago, a fire was caused by blasting in Soma, at a coal mine. The fire lasted for about 2 days, and rescue missions were mobilized as soon as possible, but were ultimately not very successful due to the thick smoke from the fire. It has been confirmed that about 301 were killed, and luckily, 486 were able to survive. Fingers are being pointed at the inadequate inspections, and officials in charge of inspections."
 TUR_flavor_event.12.a: "Tragiczny"
 TUR_flavor_event.12.b: "Protokół przeglądu remontowego"
 TUR_flavor_event.13.t: "Zamachy w Ankarze"
 TUR_flavor_event.13.d: "A short while ago, 2 bombs were detonated near Ankara Central railway station, leaving 109 civilians dead, and another 500 injured. It appears that the bombs were intended to disrupt a \"Labour, Peace, and Democracy\" rally in Ankara, organized by several groups. Several opposition parties have been blaming our government and our inabilities to prevent the attack, but all we can do for now is make changes where we can."
 TUR_flavor_event.13.a: "Niefortunny"
 TUR_flavor_event.13.b: "Zwiększ bezpieczeństwo"
 TUR_flavor_event.14.t: "Debata na temat programu nauczania"
 TUR_flavor_event.14.d: "Conservatives and conservative groups across the nation are demanding that we remove the concept of evolution from our schools' curriculums. This has worried the secularists in our country, with some even saying that this undermines the very foundation of the nation."
 TUR_flavor_event.14.a: "Usuń to. Jakie w ogóle mają dowody?"
 TUR_flavor_event.14.b: "Śmieszny"
 TUR_flavor_event.15.t: "CASA CN 235 rozbija się w Isparcie"
 TUR_flavor_event.15.d: "Jakiś czas temu samolot Sił Powietrznych CN-235 odbył misję szkoleniową z dwoma pilotami i technikiem na pokładzie. Z powodu gęstej mgły panującej w okolicy załoga nie była w stanie prawidłowo poruszać się po ścieżce i doszło do tragicznego wypadku, zabijając wszystkich na pokładzie."
 TUR_flavor_event.15.a: "Naprawdę niefortunne"
 TUR_flavor_event.15.b: "Wprowadź pewne zmiany"
 TUR_flavor_event.16.t: "Naukowcy zakładają bazę na Antarktydzie"
 TUR_flavor_event.16.d: "A group of our nation's scientists have established a base in Antarctica, marking major scientific progress for our nation!"
 TUR_flavor_event.16.a: "Świetnie"
 TUR_flavor_event.17.t: "Prawa Kurdów"
 TUR_flavor_event.17.d: "Elementy liberalne w naszym kraju wzywają do dalszych reform w zakresie istniejącego prawa kurdyjskiego. Proszą, abyśmy ich złagodzili, ułatwiając partiom kurdyjskim zdobywanie popularności. Jednak bardziej konserwatywne grupy twierdzą, że dla stabilności powinniśmy utrzymać status quo."
 TUR_flavor_event.17.a: "Reformy są niebezpieczne"
 TUR_flavor_event.17.b: "Potrzebne są reformy"
 TUR_flavor_event.18.t: "Zmiana wartości rodzinnych"
 TUR_flavor_event.18.d: "Niedawno weszło w życie nowe prawo, które pozwala kobietom zostać głową rodziny. Chociaż zmiana ta zadowoliła wielu liberałów w kraju, rozgniewała konserwatystów. Mamy jednorazową szansę na zmianę tego prawa, czy to na lepsze, czy na gorsze."
 TUR_flavor_event.18.a: "Musimy podtrzymywać nasze tradycje"
 TUR_flavor_event.18.b: "Zmiana jest konieczna"
 TUR_flavor_event.19.t: "Normalizacja stosunków z Armenią"
 TUR_flavor_event.19.d: "After what seemed like forever, the Armenians are opening up to normalize relations between our two countries. Following the Assassination of Hrant Dink, our relations with Armenia took a nosedive, leading to an unnecessary amount of animosity between our two nations. However recently they have begun to move on from the past, and they are open to normalizing relations once more."
 TUR_flavor_event.19.a: "Oni mogą być otwarci na normalizację stosunków, ale ja nie"
 TUR_flavor_event.19.b: "Dobre wieści"
 TUR_flavor_event.20.t: "Gazociąg Transkaspijski"
 TUR_flavor_event.20.d: "After some convincing from the Americans, Turkmenistan has agreed to allow the construction of a subsea gas pipeline stretching from Turkmenbashi to Adana, Turkey. However, many in the government are sceptical, as they argue that the financial burden will ultimately fall on us, which could possibly put our economy at risk."
 TUR_flavor_event.20.a: "Brzmi jak świetna okazja"
 TUR_flavor_event.20.b: "Tak.. Nie"
 Turkish_Economy.1.t: "Turcja oferuje inwestycje"
 Turkish_Economy.1.desc: "Turkey has offered to build a civilian factory in one of our provinces as long as we let a Turkish company operate and maintain it, they will get some foreign influence from this but we will also benefit in the long run."
 Turkish_Economy.1.a: "Tak"
 Turkish_Economy.1.b: "NIE"
 Turkish_Economy.2.t: "Turcja oferuje inwestycje"
 Turkish_Economy.2.desc: "Turcja zaproponowała budowę cywilnej fabryki w jednej z naszych prowincji, pod warunkiem, że pozwolimy Turcy ją obsługiwać i konserwować, uzyskają dzięki temu pewne zagraniczne wpływy, ale na dłuższą metę również na tym skorzystamy."
 Turkish_Economy.2.a: "Tak"
 Turkish_Economy.2.b: "Nie, nie jesteśmy przyjaciółmi."
 Turkish_Economy.3.t: "Turcja oferuje inwestycje"
 Turkish_Economy.3.desc: "Turcja zaproponowała budowę cywilnej fabryki w jednej z naszych prowincji, pod warunkiem, że pozwolimy Turcy ją obsługiwać i konserwować, uzyskają dzięki temu pewne zagraniczne wpływy, ale na dłuższą metę również na tym skorzystamy."
 Turkish_Economy.3.a: "Tak"
 Turkish_Economy.3.b: "NIE"
 Turkish_Economy.4.t: "Turcja oferuje inwestycje"
 Turkish_Economy.4.desc: "Turcja zaproponowała budowę cywilnej fabryki w jednej z naszych prowincji, pod warunkiem, że pozwolimy Turcy ją obsługiwać i konserwować, uzyskają dzięki temu pewne zagraniczne wpływy, ale na dłuższą metę również na tym skorzystamy."
 Turkish_Economy.4.a: "Tak"
 Turkish_Economy.4.b: "NIE"
 Turkish_Economy.5.t: "Turcja oferuje inwestycje"
 Turkish_Economy.5.desc: "Turcja zaproponowała budowę cywilnej fabryki w jednej z naszych prowincji, pod warunkiem, że pozwolimy Turcy ją obsługiwać i konserwować, uzyskają dzięki temu pewne zagraniczne wpływy, ale na dłuższą metę również na tym skorzystamy."
 Turkish_Economy.5.a: "Tak"
 Turkish_Economy.5.b: "NIE"
 Turkish_Economy.11.t: "Iran akceptuje!"
 Turkish_Economy.11.desc: "The Iranians have accepted our offer at investments, and a Turkish company will now operate a civilian factory in Tehran."
 Turkish_Economy.11.a: "Pomoże to irańskiej gospodarce bardziej niż cokolwiek innego."
 Turkish_Economy.22.t: "Armenia akceptuje!"
 Turkish_Economy.22.desc: "Surprisingly, the Armenians have accepted our offer, and plans to construct a civilian factory in one of their provinces are now under way!"
 Turkish_Economy.22.a: "Starzy wrogowie, nowi przyjaciele."
 Turkish_Economy.33.t: "Gruzja akceptuje!"
 Turkish_Economy.33.desc: "Gruzja przyjęła naszą ofertę budowy fabryki cywilnej, a także zgodziła się na warunki, na mocy których będzie musiała ją obsługiwać turecka firma."
 Turkish_Economy.33.a: "Dobry."
 Turkish_Economy.44.t: "Bułgaria akceptuje!"
 Turkish_Economy.44.desc: "The Bulgarians have agreed to our terms and are now giving us a plot of land to construct civilian factories in!"
 Turkish_Economy.44.a: "Patrzymy na zachód!"
 Turkish_Economy.55.t: "Grecja akceptuje!"
 Turkish_Economy.55.desc: "The Greeks have accepted our offers and are now letting us construct a civilian factory in their land! What a surprise!"
 Turkish_Economy.55.a: "Nie spodziewaliśmy się tego, ale świetnie!"
 Turkish_Economy.111.t: "Iran odrzuca ofertę!"
 Turkish_Economy.111.desc: "Wygląda na to, że Teheran nie zgodził się na nasze warunki inwestycji i będziemy musieli szukać gdzie indziej."
 Turkish_Economy.111.a: "Smutny"
 Turkish_Economy.222.t: "Armenia odrzuca ofertę!"
 Turkish_Economy.222.desc: "Nic dziwnego, że Ormianie odrzucili naszą ofertę budowy cywilnego przemysłu na swoim terytorium."
 Turkish_Economy.222.a: "Old grudges stunt progress."
 Turkish_Economy.333.t: "Gruzja odrzuca ofertę!"
 Turkish_Economy.333.desc: "Sadly, Georgia has rejected our offer at investments, and it appears we will have to re-evaluate Turkish-Georgian relations."
 Turkish_Economy.333.a: "Niefortunny"
 Turkish_Economy.444.t: "Bułgaria odrzuca ofertę!"
 Turkish_Economy.444.desc: "Bułgaria nawet nie odpowiedziała nam w sprawie naszej prośby dotyczącej inwestycji, więc będziemy musieli przyjąć to jako odmowę."
 Turkish_Economy.444.a: "Wow"
 Turkish_Economy.555.t: "Grecja odrzuca ofertę!"
 Turkish_Economy.555.desc: "Wygląda na to, że Grecja nie chce, aby na ich ziemi działały jakiekolwiek tureckie firmy, więc na razie będziemy musieli się wycofać."
 Turkish_Economy.555.a: "Co nowego?"
 TUR_pkk.1.t: "Szczyt Diyarbakir"
 TUR_pkk.1.d: "Szczyt w Diyarbakir rozpocznie się już w tym tygodniu, jednak wciąż nie podjęliśmy decyzji, jak potraktować £TUR_Neutral_Communism PKK. Mamy możliwość kontynuowania walki z ich próbami uzyskania autonomii i niepodległości, ale niektórzy podsunęli również pomysł kompromisu. Jak dotąd pomysł ten spotkał się z dużą niechęcią. Siły zbrojne nadal demonstrują gotowość do walki z PKK i zapobiegania rozpadowi wielkiego narodu tureckiego."
 TUR_pkk.1.a: "Współpraca z sąsiadami pomoże pokonać terrorystów!"
 TUR_pkk.1.b: "Nie potrzebujemy pomocy, sami pokonamy PKK!"
 TUR_pkk.1.c: "Być może byliśmy zbyt surowi wobec Kurdów..."
 TUR_pkk.2.t: "Turcja proponuje współpracę w zakresie bezpieczeństwa przeciwko PKK"
 TUR_pkk.2.d: "The Turkish government announced at its Diyarbakir summit earlier today that it wishes to pursue cooperation with regional nations, including us. Our delegates at the conference have now relayed the information to [ROOT.capital.GetCapitalVictoryPointName], and wish to know the stance that our government will take in order to combat the PKK and its splinter groups in the region."
 TUR_pkk.2.a: "Współpraca to droga naprzód"
 TUR_pkk.3.t: "[FROM.GetName] Zgadza się współpracować przeciwko PKK!"
 TUR_pkk.3.d: "Delegates from [FROM.GetName] firmly shook the hands of our delegates at the Diyarbakir conference, exclaiming that [FROM.capital.GetCapitalVictoryPointName] is eagerly anticipating the first steps to be taken against the PKK and its splinter groups."
 TUR_pkk.3.a: "Świetnie!"
 TUR_pkk.4.t: "Delegaci z [FROM.GetName] opuszczają szczyt"
 TUR_pkk.4.d: "Delegates from our neighbor, [FROM.GetName], silently left the summit a little while ago. The strange decision is questionable at best, as it raises some concerns within our cabinet about what their intentions really are."
 TUR_pkk.4.a: "Naprawdę?"
 Turkey.1.t: "Özkan tworzy nową partię"
 Turkey.1.desc: "Po publicznym wywołaniu [ROOT.GetLeader] wicepremiera Özkan ogłosił, że rezygnuje ze stanowiska w parlamencie i partii. Zapowiedział także utworzenie nowej partii – Partii Nowej Turcji. Wiele obecnych §W[socjalizm_L]§! Posłowie już ogłosili zamiar dołączenia do niego, wielu stara się także o przyłączenie się do §W[konserwatyzm_L]§!."
 Turkey.1.a: "Nie potrzebujemy go"
 Turkey.1.b: "Zawieraj układy na zapleczu z parlamentarzystami"
 Turkey.2.t: "Özkan odchodzi z polityki"
 Turkey.2.desc: "Po publicznym wywołaniu [ROOT.GetLeader] wicepremiera Özkan ogłosił, że rezygnuje ze stanowiska w parlamencie i partii. Na późniejszej konferencji prasowej zapowiedział, że całkowicie odejdzie z polityki, aby spędzić więcej czasu z rodziną i zająć się osobistymi projektami."
 Turkey.2.a: "Nasze ryzyko się opłaciło"
 Turkey.3.t: "Zamach stanu Özkana"
 Turkey.3.desc: "The rumours were true! Özkan and other §W[socialism_L]§! members were planning a coup. After a motion of no-confidence at a party meeting towards [ROOT.GetLeader], he was forced to resign. Özkan has taken his place as Prime Minister of Turkey"
 Turkey.3.a: "Przeklnij tego człowieka!"
 Turkey.4.t: "[Nat_Populism_L] wzywa do nowych wyborów"
 Turkey.4.desc: "Ze względu na sytuację polityczną §W[socialism_L]§!, §W[Nat_Populism_L]§! wycofało swoje poparcie dla naszej rządzącej koalicji rządowej i wzywa do nowych wyborów"
 Turkey.4.a: "Ogłosić nowe wybory"
 Turkey.4.b: "Nie potrzebujemy wyborów, możemy przetrwać"
 Turkey.5.t: "Wybory prezydenckie w Turcji w 2000 r"
 Turkey.5.desc: "Wybory prezydenckie 2000 są już blisko. W Turcji prezydenta wybiera parlament. Aby jeden kandydat zwyciężył, musi uzyskać większość dwóch trzecich w jednej z dwóch rund. Jeżeli nie ma zwycięzcy, trzecią turę można wygrać zwykłą większością głosów. Jeżeli nadal nie ma wyraźnego zwycięzcy, przeprowadza się czwartą turę, w której jeden z dwóch najpopularniejszych kandydatów musi uzyskać większość. Jeśli nadal nie będzie zwycięstwa, należy przeprowadzić przedterminowe wybory, aby przełamać impas.\n\nW tej chwili każda partia parlamentarna wystawia własnego kandydata i wydaje się bardzo mało prawdopodobne, aby którakolwiek z nich zwyciężyła ."
 Turkey.5.a: "Wicepremier Özkan będzie negocjował"
 Turkey.5.b: "Musimy po prostu mieć nadzieję na najlepsze"
 Turkey.6.t: "Ahmet Necdet Sezer wybrany na prezydenta"
 Turkey.6.desc: "Ahmet Necdet Sezer został wybrany 10. Prezydentem Republiki Tureckiej. Był to były szef Trybunału Konstytucyjnego. Jego wybór poparła większość partii parlamentarnych, przekonana do tego przez wicepremiera Özkana. Sezer jest zdecydowanym obrońcą sekularyzmu i zwolennikiem zakazu noszenia chust"
 Turkey.6.a: "Dobra robota Özkan"
 Turkey.7.t: "[socialism_L] Kandydat zostaje prezydentem"
 Turkey.7.desc: "Ku zaskoczeniu wszystkich, Mehmet Mail Büyükerman, §W[socialism_L]§! kandydat na prezydenta zwyciężył w głosowaniu. Niektórzy analitycy polityczni uznali to za cud. Najbardziej prawdopodobną przyczyną zwycięstwa Büyükermana jest to, że partie opozycyjne nie chciały bardziej destabilizować kraju, ryzykując nowe wybory"
 Turkey.7.a: "Doskonały"
 Turkey.8.t: "Presidential Vote Proceeds To Its Fourth Round"
 Turkey.8.desc: "Żadnemu kandydatowi nie udało się uzyskać wymaganej większości dwóch trzecich głosów w pierwszych dwóch turach ani wymaganej większości w trzeciej turze. Konkurs został zawężony do kandydatów z §W[socialism_L]§! i §W[Konserwatywny_L]§!. Nadal jest bardzo mało prawdopodobne, że którykolwiek z kandydatów wygra, co sprawia, że ​​przedterminowe wybory są bardzo prawdopodobne. Oczywiście możemy ogłosić nasze poparcie dla §W[Conservative_L]§! kandydat. Jest to praktycznie samobójstwo polityczne, ale przynajmniej da nam trochę czasu i oszczędzi nam natychmiastowych wyborów"
 Turkey.8.a: "Miejmy nadzieję, że będzie najlepiej. Ponownie."
 Turkey.8.b: "Throw our weight behind the §W[Conservative_L]§! candidate"
 Turkey.9.t: "[Conservative_L] Kandydat wygrywa prezydenturę"
 Turkey.9.desc: "Przy wsparciu rządzącego §W[socialism_L]§!, §W[Conservative_L]§! kandydat Nevzat Yalçıntaş wygrał wybory prezydenckie. To z pewnością zwiększy popularność §W[Conservative_L]§!"
 Turkey.9.a: "Doskonały"
 Turkey.10.t: "Konstytucja wzywa do przyspieszonych wyborów"
 Turkey.10.desc: "Wygląda na to, że żaden kandydat nie zdobył wystarczającego poparcia, aby zdobyć urząd prezydenta. Turecka konstytucja wymaga, aby w takim stanie przeprowadzić przedterminowe wybory, aby przełamać impas.\n\nNowy parlament pomyślnie wybierze nowego prezydenta"
 Turkey.10.a: "Cholera"
 Turkey.11.t: "Wojskowy zamach stanu!"
 Turkey.11.desc: "Earlier today Turkish military units rolled down the streets of Istanbul and occupied several government buildings. The military announced the closure of Istanbul's airspace as Turkish fighter jets patrolled the area. We have reports of Turkish soldiers being deployed to other major cities as well. Some clashes have been reported between soldiers loyal to the current regime and the soldiers partaking in the coup. So far most members of government seem to have avoided capture by the military. There is still hope that forces loyal to the government will disarm these insurgents. Or perhaps not"
 Turkey.11.a: "W armii jest pełno zdrajców! Zatrzymać tych przestępców!"
 Turkey.11.b: "Sprawa armii jest słuszna! Należy obalić dekadenckich władców!"
 Turkey.12.t: "Wojskowy zamach stanu w Turcji"
 Turkey.12.d: "Tonight, tanks and mechanized units patrol the streets of Istanbul as soldiers station several government buildings. The military has announced the closure of Istanbul's airspace, as fighter jets roam the sky. No noise is to be heard from the streets besides the rumbling of the mechanized engines, as the people sit silently in their homes. A successful military coup in Turkey has ousted the ruling party following its reckless policies, and the military is now consolidating complete control over the country. The military has warned people not to come out to the streets, and they have declared a state of emergency."
 Turkey.12.a: "Ciekawy"
 Turkey.14.t: "Nieudany wojskowy zamach stanu w Turcji"
 Turkey.14.d: "[TUR.GetLeader] met a large crowd of supporters this morning, as he announced that a military coup had been defeated, made possible only through the might of the Turkish people. [TUR.GetLeader] later announced that several key officers have been identified as prime suspects in this coup attempt, and that everyone else involved is getting investigated. In his speech, [TUR.GetLeader] also mentioned that there will be an \"inspection of all ranks\", and that \"there must be no traitors left\". Though it is unknown what will happen to the officials involved, one thing is for certain, and that is the role of the military in Turkish politics is no more."
 Turkey.14.a: "Ciekawy"
 Turkey.15.t: "Turcja pogrąża się w wojnie domowej"
 Turkey.15.d: "Following the latest coup attempt in Turkey, crowds met the tanks rolling down the streets of Istanbul, and tried to halt their march to a government building. The tanks however, did not stop, resulting in several deaths. In other cities within Turkey, citizens have taken up arms and they have begun opening fire at the soldiers stationed in their cities, in an attempt to halt the coup. The military announced that the coup is justified, and that the leader must be overthrown to save the Turkish nation, and some people in the country support them on this. However for now, the scenes in Turkey resemble that of a civil war, rather than just another military coup."
 Turkey.15.a: "Wow"
 Turkey.77.t: "Zjednoczenie Cypru!"
 Turkey.77.d: "The Northern Cypriot government has recently consolidated total control of the entirety of Cyprus, both north and south. This comes as they began growing in influence and strength, eventually being able to call for a referendum which let its people unify. Athens has expressed a lot of anger following the move, and they vow to never recognize Northern Cyprus as a legitimate state."
 Turkey.77.a: "Cóż, to już coś"
 Turkey.88.t: "Zjednoczenie Cypru"
 Turkey.88.d: "The Greek government has recently consolidated total control of the entirety of Cyprus, both north and south. This comes as they began growing in influence and strength, eventually being able to call for a referendum which let its people unify. Turkey has expressed a lot of anger following the move, and they vow to never recognize Greece as the legitimate owners of Cyprus."
 Turkey.88.a: "Ciekawy"
 Turkey.100.t: "Wybory ogólne"
 Turkey.100.d: "Nadszedł czas, aby nasi ludzie zagłosowali na następną partię, która zdobędzie władzę. Kto by to był?"
 Turkey.100.a: "AKP"
 Turkey.100.b: "CHP"
 Turkey.100.c: "Obecna partia radzi sobie całkiem nieźle"
 TurkeyRandomEvents.1.t: "§W[konserwatyzm_L]§! Wstrząśnięty skandalem"
 TurkeyRandomEvents.1.desc: "W Internecie zaczął krążyć film, na którym §W[conservatism_L]§! przywódca Deniz Baykal jest w sypialni razem ze swoim byłym sekretarzem. W wyniku skandalu Bajkal został zmuszony do rezygnacji ze stanowiska"
 TurkeyRandomEvents.1.a: "Chyba dobrze dla nas"
 TurkeyRandomEvents.1.b: "To fałszywe wideo! Bajkal nie ustąpi!"
 TurkeyRandomEvents.1.c: "Nie mamy wyboru"
 TurkeyFocusEvents.1.t: "[FROM.GetName] Oferuje sojusz"
 TurkeyFocusEvents.1.desc: "[FROM.GetName] zaproponował nam sojusz przeciwko zachodniemu imperializmowi. Sprzymierzając się z [FROM.GetName], możemy nawet zyskać szansę na odzyskanie Górskiego Karabachu"
 TurkeyFocusEvents.1.a: "Razem jesteśmy silniejsi"
 TurkeyFocusEvents.1.b: "Nie chcemy zachwiać równowagi"
 TurkeyFocusEvents.2.t: "[FROM.GetName] żąda wycofania się z Górskiego Karabachu!"
 TurkeyFocusEvents.2.desc: "[FROM.GetName] żąda, abyśmy wycofali wszystkie nasze siły z Górskiego Karabachu i przywrócili kontrolę nad tym obszarem z powrotem Azerbejdżanowi. To odważna prośba, ale niedawna agresja [FROM.GetName] pokazuje, że są gotowi użyć siły, aby nas wypędzić. Nie przetrwamy długo w wojnie wielofrontowej"
 TurkeyFocusEvents.2.a: "Musimy ustąpić"
 TurkeyFocusEvents.2.b: "Będziemy walczyć do ostatniego człowieka!"
 TurkeyFocusEvents.3.t: "Armenia poddaje się!"
 TurkeyFocusEvents.3.desc: "Armenia has yielded to demands of withdrawing from Nagorno-Karabakh. The area is now once again in control of Azerbaijan"
 TurkeyFocusEvents.3.a: "Świetnie"
 TurkeyFocusEvents.4.t: "Armenia trzyma się Górskiego Karabachu"
 TurkeyFocusEvents.4.desc: "Armenia has flatly refused to return Nagorno-Karabakh to Azerbaijan"
 TurkeyFocusEvents.4.a: "Cholera"
 TurkeyFocusEvents.4.b: "Potem bierzemy to siłą"
 TurkeyFocusEvents.5.t: "Rewolucja w Iranie?"
 TurkeyFocusEvents.5.desc: "We can now successfully spread our revolution in Iran, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.5.a: "Umiarkowana ilość broni"
 TurkeyFocusEvents.5.b: "Dużo broni"
 TurkeyFocusEvents.6.t: "Rewolucja w Iraku?"
 TurkeyFocusEvents.6.desc: "We can now successfully spread our revolution in Iraq, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.6.a: "Umiarkowana ilość broni"
 TurkeyFocusEvents.6.b: "Dużo broni"
 TurkeyFocusEvents.7.t: "Rewolucja w Syrii?"
 TurkeyFocusEvents.7.desc: "We can now successfully spread our revolution in Syria, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.7.a: "Umiarkowana ilość broni"
 TurkeyFocusEvents.7.b: "Dużo broni"
 TurkeyFocusEvents.8.t: "[FROM.GetName] żąda Hataya"
 TurkeyFocusEvents.8.desc: "[FROM.GetName] żąda, abyśmy oddali im Hatay. Bez kontroli państwa odmawiają przystąpienia do naszego sojuszu"
 TurkeyFocusEvents.8.a: "Chyba nie mamy wyboru"
 TurkeyFocusEvents.8.b: "Naród turecki jest niepodzielny!"
 TurkeyFocusEvents.9.t: "[FROM.GetName] Zwróć Hatay"
 TurkeyFocusEvents.9.desc: "[FROM.GetName] zwrócił nam Hataya"
 TurkeyFocusEvents.9.a: "Dobry dzień!"
 TurkeyFocusEvents.10.t: "Kłopot cypryjski"
 TurkeyFocusEvents.10.d: "Rząd turecki zaczyna mocniej niż wcześniej naciskać na problem cypryjski, w związku z czym nasz rząd nie ma innego wyjścia, jak tylko zareagować. Opracowaliśmy plan reakcji na tę agresję i zgodnie z nią będziemy ją realizować!"
 TurkeyFocusEvents.10.a: "Naprzód!"
 TurkeyFocusEvents.19.t: "Turcja chce ustanowić strefę buforową"
 TurkeyFocusEvents.19.d: "The Turkish government wants to establish a buffer zone between our nations' borders. This means we have to completely demilitarize several of our northern provinces, and withdraw all military presence and let the Turks fight off the Kurds."
 TurkeyFocusEvents.19.a: "Tak jest najlepiej.."
 TurkeyFocusEvents.19.b: "Absolutnie nie!"
 TurkeyFocusEvents.191.t: "Syria zezwala na utworzenie strefy buforowej"
 TurkeyFocusEvents.191.d: "The Syrian government has caved into the pressure, and has allowed us to create a buffer zone between our nations' borders."
 TurkeyFocusEvents.191.a: "Dobry."
 TurkeyFocusEvents.192.t: "Syria nie wyraża zgody na utworzenie strefy buforowej"
 TurkeyFocusEvents.192.d: "Rząd syryjski odrzucił naszą prośbę o utworzenie strefy buforowej między naszymi państwami."
 TurkeyFocusEvents.192.a: "No więc.."
 TurkeyFocusEvents.20.t: "Co powinniśmy zrobić z uchodźcami?"
 TurkeyFocusEvents.20.d: "W naszym kraju przebywa obecnie najwięcej uchodźców, a jeśli chcemy, możemy ich wykorzystać jako pionki polityczne. Nasza zachodnia sąsiadka, Grecja, wydaje się… niechętna do współpracy… i być może uda nam się wykorzystać niektórych z tych uchodźców, aby skłonić ich do podporządkowania się naszym żądaniom."
 TurkeyFocusEvents.20.a: "Nie, to zaszkodzi naszej reputacji"
 TurkeyFocusEvents.20.b: "Wyślij tylko trochę"
 TurkeyFocusEvents.20.c: "Wyślij ich dużo"
 TurkeyFocusEvents.21.t: "Potencjalne rozwiązanie sporu karabaskiego?"
 TurkeyFocusEvents.21.d: "Rząd turecki zwrócił się do nas i dał nam potencjalne porozumienie kompromisowe, jakie możemy zawrzeć z Ormianami. Możemy oddać Ormianom naszą eksklawę Nachiczewan w zamian za kontrolę nad regionem Karabachu."
 TurkeyFocusEvents.21.a: "Jasne, zobaczmy, co myślą Ormianie"
 TurkeyFocusEvents.21.b: "Absolutnie nie"
 TurkeyFocusEvents.212.t: "Azerbejdżan proponuje rozwiązanie sporu karabaskiego"
 TurkeyFocusEvents.212.d: "[TUR.GetName] spotkał się z [AZE.GetName] kilka dni temu i zaproponował możliwe rozwiązanie sporu karabachskiego między nami a Azerami. W tej ofercie zrzekniemy się naszych roszczeń do Karabachu i oddamy go Azerom w zamian za ponowne zjednoczenie Nachiczewanu z Armenią."
 TurkeyFocusEvents.212.a: "Nie widzimy powodu"
 TurkeyFocusEvents.212.b: "Absolutnie nie!"
 TurkeyFocusEvents.213.t: "Spór karabaski rozstrzygnięty!"
 TurkeyFocusEvents.213.d: "Wspaniała wiadomość napłynęła z ambasady Armenii, gdyż dyplomaci dali nam znać, że zgodzili się na warunki zawarte w naszej ugodzie dotyczącej regionu Karabachu!"
 TurkeyFocusEvents.213.a: "Wspaniały"
 TurkeyFocusEvents.214.t: "Spór w Karabachu trwa.."
 TurkeyFocusEvents.214.d: "Unfortunately it seems the Karabakh dispute will continue to harm Azeri and Armenian relations, as both sides have failed to come to an agreement."
 TurkeyFocusEvents.214.a: "Całkiem niefortunne.."
 TurkeyFocusEvents.69420.t: "Przez kłopoty"
 TurkeyFocusEvents.69420.d: "Our nation has seen it all, wars, conquest, humiliation, glory, and everything in between. The Dawn of the new Millennium is upon us, and the Turkish nation cannot afford to falter, we must adapt and adjust to the new times, otherwise our state may be swept by the winds of history. Our next presidential election is coming up shortly, and the victor will decide if we hold on to Ataturk's dream for a great Turkish Republic."
 TurkeyFocusEvents.69420.a: "Nie możemy się zachwiać!"
 TurkeyFocusEvents.22.t: "Rajd zwolenników AKP w Stambule!"
 TurkeyFocusEvents.22.d: "Dziś w Stambule odbył się wiec proAKP, który pokazał poparcie dla tej partii. Uczestnicy tego protestu wzywali także AKP do odłączenia się od koalicji z Hizmetem."
 TurkeyFocusEvents.22.a: "Güleniści nie są zadowoleni.."
 TurkeyFocusEvents.23.t: "Gülenist supporters gather at a mosque!"
 TurkeyFocusEvents.23.d: "Gülenist supporters held a gathering at one of the mosques and were calling for the party to distance itself from its coalition with the AKP party."
 TurkeyFocusEvents.23.a: "Zwolennicy AKP nie są zbyt zadowoleni.."
 TurkeyFocusEvents.24.t: "Sojusz z FP?"
 TurkeyFocusEvents.24.d: "Partia FP została zdelegalizowana zanim wkroczyliśmy do polityki i wygląda na to, że jej członkowie nigdzie nie wyjechali. Większość z nich poszła dalej i zaczęła przyłączać się do „SP”, kolejnej twardogłowej grupy islamistycznej. Być może moglibyśmy zaprosić niektórych z ich członków, aby przybyli i przyłączyli się do nas w rządzeniu narodem tureckim."
 TurkeyFocusEvents.24.a: "Niezły pomysł.."
 TurkeyFocusEvents.24.b: "Nie sądzę"
 TurkeyFocusEvents.25.t: "Z kim zawieramy umowy?"
 TurkeyFocusEvents.25.d: "W naszym najlepszym interesie leży otwarcie się na potencjalne inwestycje w Turcji. Możemy poprosić firmy irańskie lub saudyjskie o przybycie i założenie oddziałów w naszych wschodnich prowincjach do celów wydobycia i wierceń."
 TurkeyFocusEvents.25.a: "Zaproś saudyjskie firmy wiertnicze"
 TurkeyFocusEvents.25.b: "Zaproś irańskie firmy wydobywcze"
 TurkeyFocusEvents.26.t: "Nasze wsparcie dla Kosowa"
 TurkeyFocusEvents.26.d: "Będziemy musieli podjąć dalsze działania przeciwko rządowi okupującemu obecnie Kosowo. Naszym obowiązkiem jako narodu poszukującego wolności jest szerzenie naszych przekonań wśród innych i z tego powodu będziemy musieli albo nałożyć sankcje na ich okupantów, albo wysłać misję wojskową do Kosowa."
 TurkeyFocusEvents.26.a: "Wyślij misję wojskową do Kosowa"
 TurkeyFocusEvents.26.b: "Sankcje, sankcje i jeszcze raz sankcje!"
 TurkeyFocusEvents.27.t: "Działania przeciwko Arabii Saudyjskiej"
 TurkeyFocusEvents.27.d: "The Saudi government had designated us as a terrorist organization before our rise to power due to pressure from the AKP party. We cannot let such an action go un-noticed. We will organize a proper response to really show them who's in charge."
 TurkeyFocusEvents.27.a: "Funduszuj pracowników naftowych, aby mogli strajkować"
 TurkeyFocusEvents.27.b: "Finansowanie grup prodemokratycznych na rzecz niestabilności politycznej"
 TurkeyFocusEvents.28.t: "Turcja chce, żebyśmy odesłali członków PKK"
 TurkeyFocusEvents.28.d: "The Turkish government has asked us to send back members of the Kurdish PKK party, who are currently seeking refuge in Sweden. If we want to improve relations with the Turks we can send them.. but things will start looking ugly for us when the EU condemns us."
 TurkeyFocusEvents.28.a: "Wyślij je z powrotem"
 TurkeyFocusEvents.28.b: "Najlepiej, żeby tego nie robili"
 TurkeyFocusEvents.29.t: "Rząd szwedzki zgadza się na odesłanie członków PKK!"
 TurkeyFocusEvents.29.d: "Rząd szwedzki zgodził się na deportację członków PKK, którzy obecnie szukają schronienia w swoim państwie, abyśmy mogli sami się z nimi uporać."
 TurkeyFocusEvents.29.a: "Dobry."
 TurkeyFocusEvents.30.t: "Szwedzki rząd odmawia odesłania członków PKK!"
 TurkeyFocusEvents.30.d: "The Swedish Government has refused to send back the PKK members they are currently harboring. This will not go un-noticed by us."
 TurkeyFocusEvents.30.a: "Będą tego żałować!"
 TurkeyFocusEvents.31.t: "Rozpal płomienie w Iranie"
 TurkeyFocusEvents.31.d: "Today we have at our disposal.. A lot of guns. And we can send a couple of these weapons to the Rebels in Khuzestan, so we can cripple Iran's oil industry. But the question is, how much support do we really want to give these guys, and how much damage can we make them do? "
 TurkeyFocusEvents.31.a: "Nie za dużo"
 TurkeyFocusEvents.31.b: "Idź na całość"
 TurkeyFocusEvents.32.t: "Turcja chce nawiązać stosunki"
 TurkeyFocusEvents.32.d: "The Turkish government is willing to establish relations, and is asking us not to be hostile towards the PKK group, which is quite the request."
 TurkeyFocusEvents.32.a: "Jasne.."
 TurkeyFocusEvents.32.b: "Nie, to zbyt duże ryzyko!"
 TurkeyFocusEvents.321.t: "Peszmergowie utrzymują wrogość"
 TurkeyFocusEvents.321.d: "The Peshmerga would rather maintain their hostility towards us, rather than fix them! We will not forget this, and they will regret it soon."
 TurkeyFocusEvents.321.a: "Głupcy!"
 TurkeyFocusEvents.322.t: "Peszmergowie współpracują!"
 TurkeyFocusEvents.322.d: "Co zaskakujące, Peszmergowie zdecydowali się na współpracę z nami i nawiązali w pewnym sensie formalne więzi, mimo że są regionem autonomicznym."
 TurkeyFocusEvents.322.a: "Bardzo dobry"
 TurkeyFocusEvents.33.t: "Peszmergowie.."
 TurkeyFocusEvents.33.d: "Peszmergowie to kolejna grupa Kurdów, zamieszkująca tereny tuż poniżej naszego anatolijskiego Kurdystanu. Stanowią równie duże zagrożenie jak PKK, ale to teraz najmniejszy z naszych problemów, ponieważ współpracujemy z PKK, aby znaleźć rozwiązanie. Peszmergowie będą dla nas ogromnym zagrożeniem i będziemy musieli się z nimi rozprawić, zanim będzie za późno."
 TurkeyFocusEvents.33.a: "Zrobimy operację"
 TurkeyFocusEvents.33.b: "We'll do an operation, with the Iraqis"
 TurkeyFocusEvents.331.t: "Turkey offers joint operation against Peshmerga"
 TurkeyFocusEvents.331.d: "Rząd turecki zwraca się do nas z prośbą o dołączenie do niego w operacji mającej na celu rozprawienie się z Peszmergami na północy naszego kraju."
 TurkeyFocusEvents.331.a: "Absolutnie!"
 TurkeyFocusEvents.331.b: "Absolutely not!"
 TurkeyFocusEvents.332.t: "Irak odmawia przyłączenia się do naszej operacji"
 TurkeyFocusEvents.332.d: "Irak nie chce nam pomóc w walce z Peszmergami, co oznacza tylko, że musimy zrobić to wszystko sami"
 TurkeyFocusEvents.332.a: "No cóż.."
 TurkeyFocusEvents.34.t: "Era cyfrowa Turcji"
 TurkeyFocusEvents.34.d: "Sieć WWW rozwija się z dnia na dzień coraz bardziej. Oznacza to, że musimy nadążać za taką ekspansją, w miarę jak świat staje się coraz bardziej połączony. Nasi obywatele nie różnią się od obywateli innych krajów europejskich i musimy to udowodnić naszym obywatelom, rozbudowując ich infrastrukturę internetową. Pytanie brzmi, o ile?"
 TurkeyFocusEvents.34.a: "Rozwiń go tylko w kilku obszarach"
 TurkeyFocusEvents.34.b: "Rozwiń go tak bardzo, jak to możliwe"
 TurkeyFocusEvents.35.t: "Turcja zaprasza nas do Unii Turko-Syryjskiej"
 TurkeyFocusEvents.35.d: "Przyszedł nowy rząd turecki, na którego czele stoi większość szyicka, i poprosił nas, abyśmy przyłączyli się do nich w Unii turecko-syryjskiej, ponieważ nasze populacje mają wiele podobieństw. Niedawno zdecydowali się zwrócić nam Hatay, co było świetnym posunięciem, ale teraz chcą, żebyśmy byli ich częścią?"
 TurkeyFocusEvents.35.a: "Tak, dołączymy"
 TurkeyFocusEvents.35.b: "NIE"
 TurkeyFocusEvents.351.t: "Syryjczycy zgadzają się do nas dołączyć"
 TurkeyFocusEvents.351.d: "Rząd syryjski zdał sobie sprawę z podobieństw między naszymi narodami i zgodził się dołączyć do nas w Unii Turko-Syryjskiej!"
 TurkeyFocusEvents.351.a: "Nareszcie.."
 TurkeyFocusEvents.352.t: "Syria odrzuca naszą propozycję!"
 TurkeyFocusEvents.352.d: "The Syrian government has foolishly rejected our proposal to join a union together. They clearly do not know what is good for Shias in the region!"
 TurkeyFocusEvents.352.a: "Cholera! Na wojnę!"
 TurkeyFocusEvents.36.t: "Walijskie i szkockie mafie tworzą własne państwa!"
 TurkeyFocusEvents.36.d: "It appears the Anatolian Syndicate has funded and trained the Scottish and Welsh mafias just right under our nose. We failed to catch on and stop them in a timely manner, and therefore we are now going to have to make a decision."
 TurkeyFocusEvents.36.a: "Nasze Królestwo jest ZJEDNOCZONE!"
 TurkeyFocusEvents.36.b: "To nie jest tego warte"
 TurkeyFocusEvents.37.t: "Syndykat Anatolijski ostrzega nas przed Australią"
 TurkeyFocusEvents.37.d: "The Anatolian Syndicate are warning us about an incoming attack from the Australians. Obviously this could all be a lie, considering that they are a Mafia state. But there is also a chance they aren't lying."
 TurkeyFocusEvents.37.a: "Nie mogą kłamać!"
 TurkeyFocusEvents.37.b: "Nie. Najwyraźniej kłamią"
 TurkeyFocusEvents.38.t: "Turcja chce, żebyśmy pomogli w walce z Izraelem"
 TurkeyFocusEvents.38.d: "Turkey is requesting that our forces, along with our allies, help take down the Israelis. This is a very surprising move, but not unexpected after Islamists took over Turkey in the latest election."
 TurkeyFocusEvents.38.a: "Dzień na który czekaliśmy.."
 TurkeyFocusEvents.38.b: "Czas nie jest odpowiedni"
 TurkeyFocusEvents.39.t: "Iran Zgadza się"
 TurkeyFocusEvents.39.d: "Iran zgodził się pomóc naszym siłom w walce z Izraelem. Wezwą także swoich sojuszników, którzy będą bardzo pomocni dla naszych sił."
 TurkeyFocusEvents.39.a: "Dobry."
 TurkeyFocusEvents.40.t: "Iran odrzuca"
 TurkeyFocusEvents.40.d: "W szokujący sposób Iran zdecydował się nie pomagać nam w walce z Izraelem. To bardzo zdezorientowało naszych dyplomatów, ponieważ Iran od dziesięcioleci nawoływał do upadku Izraelczyków…"
 TurkeyFocusEvents.40.a: "Dobra"
 TurkeyFocusEvents.381.t: "Iran walczy z Izraelem"
 TurkeyFocusEvents.381.d: "Iran is fighting Israel, and they want to use our land to attack, and since they are our ally, it is best that we cooperate to take down the Israeli menace."
 TurkeyFocusEvents.381.a: "Na to czekaliśmy.."
 TurkeyFocusEvents.381.b: "NIE"
 TurkeyFocusEvents.81.t: "Turcja zaprasza nas do MTO"
 TurkeyFocusEvents.81.desc: "MTO, inaczej znana jako Organizacja Traktatu Śródziemnomorskiego, została niedawno założona przez Turcję. Zapraszają nas do przyłączenia się do ich sojuszu i zostania pełnoprawnym członkiem. Jeśli to zrobimy, wszyscy pozostali członkowie zagwarantują nam bezpieczeństwo, ponieważ jest to pakt obronny."
 TurkeyFocusEvents.81.a: "Tak, ale tylko jeśli zwrócą Hatay"
 TurkeyFocusEvents.81.b: "NIE"
 TurkeyFocusEvents.41.t: "Turcja zaprasza nas do MTO"
 TurkeyFocusEvents.41.d: "MTO, inaczej znana jako Organizacja Traktatu Śródziemnomorskiego, została niedawno założona przez Turcję. Zapraszają nas do przyłączenia się do ich sojuszu i zostania pełnoprawnym członkiem. Jeśli to zrobimy, wszyscy pozostali członkowie zagwarantują nam bezpieczeństwo, ponieważ jest to pakt obronny."
 TurkeyFocusEvents.41.a: "Powinniśmy się dołączyć"
 TurkeyFocusEvents.41.b: "NIE"
 TurkeyFocusEvents.411.t: "Irak nie jest zainteresowany"
 TurkeyFocusEvents.411.d: "Wygląda na to, że Irak nie jest zainteresowany przystąpieniem do naszego sojuszu MTO."
 TurkeyFocusEvents.411.a: "Dobra"
 TurkeyFocusEvents.42.t: "Turcja zaprasza nas do MTO"
 TurkeyFocusEvents.42.d: "MTO, inaczej znana jako Organizacja Traktatu Śródziemnomorskiego, została niedawno założona przez Turcję. Zapraszają nas do przyłączenia się do ich sojuszu i zostania pełnoprawnym członkiem. Jeśli to zrobimy, wszyscy pozostali członkowie zagwarantują nam bezpieczeństwo, ponieważ jest to pakt obronny."
 TurkeyFocusEvents.42.a: "Powinniśmy się dołączyć"
 TurkeyFocusEvents.42.b: "NIE"
 TurkeyFocusEvents.421.t: "Egipt nie jest zainteresowany"
 TurkeyFocusEvents.421.d: "Egypt has turned down our invitation to the MTO."
 TurkeyFocusEvents.421.a: "Dobra"
 TurkeyFocusEvents.43.t: "Turcja zaprosiła nas do CIW"
 TurkeyFocusEvents.43.d: "Rząd turecki założył niedawno CIW, czyli Konfederację Islamskiego Dobrobytu. Głównym celem jest zwiększenie współpracy między narodami islamskimi i poprawa dobrobytu muzułmanów w całym regionie."
 TurkeyFocusEvents.43.a: "Zapisz mnie"
 TurkeyFocusEvents.43.b: "NIE"
 TurkeyFocusEvents.44.t: "CIW inwestuje w naszą infrastrukturę!"
 TurkeyFocusEvents.44.d: "The CIW is investing in our nation's abilities to build proper infrastructure and facilities for our people."
 TurkeyFocusEvents.44.a: "Świetnie"
 TurkeyFocusEvents.45.t: "CIW rozdaje zapasy awaryjne!"
 TurkeyFocusEvents.45.d: "CIW rozdawało zapasy awaryjne na wypadek wszelkich nadchodzących lub trwających katastrof w organizacji."
 TurkeyFocusEvents.45.a: "Świetnie"
 TurkeyFocusEvents.46.t: "CIW inwestuje w naszą edukację!"
 TurkeyFocusEvents.46.d: "The CIW has invested in our nation's education sector, making it easier for people to go to school."
 TurkeyFocusEvents.46.a: "Świetnie"
 TurkeyFocusEvents.47.t: "CIW inwestuje w naszą służbę zdrowia!"
 TurkeyFocusEvents.47.d: "The CIW is now investing in our nation's healthcare system, providing medical supplies and facilities to more people."
 TurkeyFocusEvents.47.a: "Świetnie"
 TurkeyFocusEvents.48.t: "CIW inwestuje w nasze branże!"
 TurkeyFocusEvents.48.d: "The CIW is now investing in our nation's industrial sector, which lets our factories provide more goods."
 TurkeyFocusEvents.48.a: "Świetnie"
 TurkeyFocusEvents.49.t: "[FROM.GetName] opuszcza CIW"
 TurkeyFocusEvents.49.d: "[FROM.GetName] zdecydował, że najlepiej będzie, jeśli ich naród wycofa się z CIW."
 TurkeyFocusEvents.49.a: "No cóż, będą tęsknić"
 TurkeyFocusEvents.50.t: "Turcja chce założyć bazy wojskowe"
 TurkeyFocusEvents.50.d: "Rząd turecki prosi, abyśmy pozwolili mu stacjonować swoje wojska w naszym kraju."
 TurkeyFocusEvents.50.a: "Dlaczego nie"
 TurkeyFocusEvents.50.b: "NIE"
 TurkeyFocusEvents.501.t: "Katar odrzuca naszą prośbę"
 TurkeyFocusEvents.501.d: "Katar nie pozwala na stacjonowanie naszych żołnierzy na swoim terytorium."
 TurkeyFocusEvents.501.a: "Niefortunny"
 TurkeyFocusEvents.53.t: "Osman V przechodzi"
 TurkeyFocusEvents.53.d: "Dziś po Konstantinii rozeszła się straszna wiadomość, gdy ludzie dowiedzieli się o śmierci Osmana V. Choć jego śmierć przyniosła ludziom wielki smutek, Beyezid III z pewnością będzie kontynuował swoje dziedzictwo."
 TurkeyFocusEvents.53.a: "Tron się zmienia"
 TurkeyFocusEvents.54.t: "Beyezid III przechodzi"
 TurkeyFocusEvents.54.d: "Niestety dzisiaj dowiedzieliśmy się o śmierci Beyezida III. Ludzie opłakują jego śmierć na ulicach, a smutek ogarnął naród. Jednak nie wszystko stracone, ponieważ Dundar I zostanie koronowany wkrótce po zakończeniu okresu żałoby narodowej, co będzie początkiem jego rządów."
 TurkeyFocusEvents.54.a: "Tron przesuwa się po raz kolejny.."
 TurkeyFocusEvents.55.t: "Kalifat Anatolii żąda Hejaza"
 TurkeyFocusEvents.55.d: "The Anatolian Caliphate has come and demanded that we give them Hejaz, arguably our most important state. It would be incredibly foolish of us to give this state away, and quite frankly, we don't even know what they will do if we don't."
 TurkeyFocusEvents.55.a: "Co to za prośba?"
 TurkeyFocusEvents.55.b: "Cóż.. Chcemy uniknąć konfliktu, prawda?"
 TurkeyFocusEvents.56.t: "[SAU.GetName] poddaje się"
 TurkeyFocusEvents.56.d: "[SAU.GetName] has given in to our demands. We will be receiving Hejaz, and in return, we will not be attacking them."
 TurkeyFocusEvents.56.a: "Dobry."
 TurkeyFocusEvents.57.t: "[SAU.GetName] odrzuca nasze żądania!"
 TurkeyFocusEvents.57.d: "[SAU.GetName] głupio odrzucił nasze żądania i dlatego nie mamy innego wyboru!"
 TurkeyFocusEvents.57.a: "Poprosili o to"
 TurkeyFocusEvents.58.t: "Radzenie sobie z Abdulem Rahmanem Mustafą"
 TurkeyFocusEvents.58.d: "Iraq is currently at its most vulnerable, as the Americans are actively engaged in a conflict with them, crippling their security. This gives us a great opportunity to move in, and take out the governor of Kirkuk, a major city in Iraqi-Kurdistan. If we are successful, we will be able to seriously damage Kurdish morale, and subsequently the PKK's morale."
 TurkeyFocusEvents.58.a: "Wyślij kilku agentów przebranych za cywilów"
 TurkeyFocusEvents.58.b: "Wyślij dobrze wyszkolonych agentów i przygotuj plan ucieczki"
 TurkeyFocusEvents.58.c: "Let's just forget about this plan entirely."
 TurkeyFocusEvents.59.t: "Śmierć Abdula Mustafy"
 TurkeyFocusEvents.59.d: "Nasi agenci zdołali dokonać skutecznego zamachu na Abdula Rahmana Mustafę, gubernatora Kirkuku."
 TurkeyFocusEvents.59.a: "Dobry."
 TurkeyFocusEvents.60.t: "Amerykanie pojmają naszych agentów!"
 TurkeyFocusEvents.60.d: "Earlier today, soldiers from America's 173rd Airborne Brigade kicked down the doors of our agents' safehouse in the Kurdish city of Sulaymaniyah, and took them into custody. This has been dubbed as the \"Hood Event\" by the media, and our relations with the Americans have been negatively affected."
 TurkeyFocusEvents.60.a: "Cholera"
 Turkish_mafia.1.t: "Mafia robi scenę!"
 Turkish_mafia.1.d: "The Mafia has caused a scene in one of our bigger cities, which resulted in the death of a few individuals. Though it is currently unknown who committed this crime, our police force is very eager to go and hunt them down, despite the risks involved."
 Turkish_mafia.1.a: "Lepiej, żebyśmy nie sprawiali więcej problemów.."
 Turkish_mafia.1.b: "Chcę pełnego śledztwa, teraz!"
 Turkish_mafia.1.c: "Przydziel wszystkie dostępne zasoby"
 Turkish_mafia.11.t: "Poszukiwania policyjne nie powiodły się"
 Turkish_mafia.11.d: "Our police force was unsuccessful in their search for the mobsters responsible for the crime committed a few days ago. This has made a few mobsters believe they are un-touchable, therefore increasing the Mafia's influence in the country."
 Turkish_mafia.11.a: "Taka niekompetencja..."
 Turkish_mafia.12.t: "Policja zatrzymuje podejrzanych"
 Turkish_mafia.12.d: "The locals let out a sigh of relief today, as the police chief has recently announced the apprehension of several criminals and suspects, regarding a series of murders committed a few days ago. Several individuals affiliated with the Mafias are now aware of the effectiveness in our police force, and it'll make others think twice before joining the Mafia."
 Turkish_mafia.12.a: "Bardzo dobry"
 Turkish_mafia.2.t: "Detektywi odkrywają kryjówkę mafii"
 Turkish_mafia.2.d: "Detektyw z jednego z wiejskich miast doniósł, że znalazł potencjalną kryjówkę mafii. Policja szybko próbuje wykombinować reakcję, ponieważ nie wie, co będzie w tej kryjówce ani czy w ogóle będzie to kryjówka mafii. Jest bardzo prawdopodobne, że mafia jest powiązana z tą lokalizacją, niemniej jednak zawsze będzie to wiązać się z ryzykiem."
 Turkish_mafia.2.a: "Niektóre rzeczy po prostu lepiej zostawić w spokoju.."
 Turkish_mafia.2.b: "What do you mean they're scrambling a response? Prepare one, and do it quickly!"
 Turkish_mafia.2.c: "Przydziel wszystkie dostępne zasoby"
 Turkish_mafia.21.t: "Policja ponosi ofiary!"
 Turkish_mafia.21.d: "It appears that the hideout was an ambush, and there were several gunmen ready to start shooting at our officers. Unfortunately, due to a lack of weapons and sufficient backup, several officers were killed and many more were injured."
 Turkish_mafia.21.a: "Cholera"
 Turkish_mafia.22.t: "Kryjówka została bezpiecznie oczyszczona"
 Turkish_mafia.22.d: "Podczas naszej ostatniej operacji wszystko poszło doskonale. Nasze jednostki szybko uprzątnęły kryjówkę, a kilku zaskoczonych podejrzanych zostało szybko zatrzymanych przez naszych funkcjonariuszy."
 Turkish_mafia.22.a: "Świetnie"
 Turkish_mafia.3.t: "Odkryto duży skład broni"
 Turkish_mafia.3.d: "Podczas trwających poszukiwań policja znalazła w magazynie duży skład broni. Kilka osób w społeczności wzywa policję, aby wyśledziła, skąd pochodzi ten skład broni i aresztowała zaangażowane osoby."
 Turkish_mafia.3.a: "Może po prostu weźmiemy broń?"
 Turkish_mafia.3.b: "Good idea, start a search immediately!"
 Turkish_mafia.3.c: "Przydziel wszystkie dostępne zasoby"
 Turkish_mafia.31.t: "Policja utrudnia śledztwo!"
 Turkish_mafia.31.d: "Due to the lack of coordination, and high levels of incompetence, our police force did not find the criminals that had left their weapons cache. In fact, during the investigation our police force lost a considerable amount of their own weapons! How could this happen you may ask? Well, it appeared that our officers had gone in with a supply van filled with weapons, and someone hijacked the van and drove off!"
 Turkish_mafia.31.a: "Poważnie?"
 Turkish_mafia.32.t: "Policja lokalizuje podejrzanych"
 Turkish_mafia.32.d: "It appeared that there was an underground weapon trade happening in one of the more urbanized cities. Luckily, we were able to catch these criminals before any major damage was done."
 Turkish_mafia.32.a: "To jest standard"
 Turkish_mafia.4.t: "Policja przejęła ładunek narkotyków"
 Turkish_mafia.4.d: "Grupa funkcjonariuszy natknęła się na podejrzany kontener, a kiedy go otworzyli, byli zaskoczeni. Nieznaną siatką przemycono do kraju duże ilości nielegalnych narkotyków, a miejscowi chętnie łapią podejrzanych."
 Turkish_mafia.4.a: "Cóż.. musiały być przeznaczone do użytku medycznego, prawda?"
 Turkish_mafia.4.b: "I want an investigation immediately!"
 Turkish_mafia.4.c: "Przydziel wszystkie dostępne zasoby"
 Turkish_mafia.41.t: "Podejrzani zatrzymani"
 Turkish_mafia.41.d: "Znaleźliśmy kilka osób powiązanych z dużym pojemnikiem z narkotykami i są one obecnie przesłuchiwane przez policję. Wielu członków społeczności jest szczęśliwych, wiedząc, że nielegalne narkotyki nie będą plagą w ich społeczności."
 Turkish_mafia.41.a: "Wciąż mamy wiele do zrobienia! Wracaj do pracy!"
 Turkish_mafia.42.t: "Investigation results in nothing"
 Turkish_mafia.42.d: "After a lengthy investigation, our officers were not able to connect anyone to the drug container. This is a major loss on our end, as now illegal drugs are still being smuggled into the country, and we have no leads!"
 Turkish_mafia.42.a: "Nie do wiary"
 Turkish_mafia.5.t: "Mafia zamordowała wysoko postawionego urzędnika"
 Turkish_mafia.5.d: "Tragedy has struck, as the Turkish mafia has assassinated a high ranking official. This will make our party's job much harder than it has to, and our opposition are most likely overcome with excitement."
 Turkish_mafia.5.a: "Cholera"
 Turkish_mafia.6.t: "Napad na mafię"
 Turkish_mafia.6.d: "Mafia dokonała napadu na jeden z banków w naszym kraju. Ukradli mnóstwo pieniędzy, co ostatecznie zaszkodziło naszej gospodarce i obywatelom."
 Turkish_mafia.6.a: "Nie do wiary"
 Turkish_mafia.7.t: "Eksplozja wstrząsa centrum handlowym"
 Turkish_mafia.7.d: "Fingers are being pointed at the Mafia today, as the police suspect they were behind a bombing attack at a large commercial center. Their goal is unknown, but one thing is for certain, they are causing a lot of problems for the government."
 Turkish_mafia.7.a: "Ale dlaczego?"
 Turkish_mafia.8.t: "Policja wdaje się w konflikt z mafią"
 Turkish_mafia.8.d: "Dziś rano doszło do bardzo długiego starcia pomiędzy naszą policją a mafią. Kilku policjantów zostało rannych, a niektórzy nawet zginęli."
 Turkish_mafia.8.a: "Straszny!"
 Turkish_mafia.9.t: "Powstanie mafii"
 Turkish_mafia.9.d: "The Mafia has been ramping up its attacks in recent times, and it has quite frankly stressed out our security forces. With people joining the Mafia, and a life of crime now more than ever, it makes you question the validity of our state. A lot of people are demanding that our government step down, but we have a duty to serve and protect our people."
 Turkish_mafia.9.a: "Walka nigdy się nie skończy!"
 Turkish_mafia.9.b: "Może mają rację.."
 Turkish_parties.1.t: "Partie liberalne zyskują na popularności"
 Turkish_parties.1.d: "It appears that our people's ideology is becoming more and more liberal, as the liberal parties have begun gaining some more following than before. As a result of this, people are pushing for more liberal policies in our country."
 Turkish_parties.1.a: "Dobra"
 Turkish_parties.2.t: "Partie konserwatywne zyskują na popularności"
 Turkish_parties.2.d: "It appears that our people's ideology is becoming more and more conservative, as the conservative parties have begun gaining some more following than before. As a result of this, people are pushing for more conservative policies in our country."
 Turkish_parties.2.a: "Dobra"
 Turkish_parties.3.t: "Partie lewicowe zyskują na popularności"
 Turkish_parties.3.d: "It appears that our people's ideology is becoming more and more leftist, as the left-wing parties have begun gaining some more following than before. As a result of this, people are pushing for more socialist policies in our country."
 Turkish_parties.3.a: "Dobra"
 Turkish_parties.4.t: "Partie prawicowe zyskują na popularności"
 Turkish_parties.4.d: "It appears that our people's ideology is becoming more and more nationalist, as the right-wing parties have begun gaining some more following than before. As a result of this, people are pushing for more nationalist policies in our country."
 Turkish_parties.4.a: "Dobra"
 Turkish_parties.9.t: "Radykalna zmiana w polityce"
 Turkish_parties.9.d: "There has been a drastic, and radical shift in our nation's government, leading to a complete reorganization of our political structure."
 Turkish_parties.9.a: "Dobra"
 Turkish_parties.10.t: "Tylko sztuczna inteligencja powinna to zobaczyć"
 Turkish_parties.10.d: "Tylko sztuczna inteligencja"
 Turkish_parties.10.a: "Jeśli to zobaczysz, daj nam znać"
 TUR_bulent_ecevit_desc: "Bülent Ecevit is a senior politician who has been active in the Turkish political scene since the 1950s. Rising to a leadership in the CHP, he eventually succeeded Ismet Inönü as CHP chairman in 1972 and became Prime Minister in 1974. His government ordered the invasion of Cyprus in 1974, where he gained the nickname 'Conqueror of Cyprus' ('Kıbrıs Fatihi'). Following the military coup of 1980, Ecevit was incarcerated and banned from politics, eventually rejoining the scene in 1987 by taking the chairman position of DSP from his wife Rahsan. Finally in 1999, he regained the position of Prime Minister of Turkey, after his party's popularity soared with the capture of PKK leader Abdullah Öcalan.\n\nEcevit is also an adamant poet and writer, having written many books on both subjects, and translating many poems into Turkish.\n\nEcevit never finished his university degree, making it impossible for him to ever run for President."
 TUR_zeki_sezer_desc: "Zeki Sezer jest byłym ministrem stanu w rządzie Ecevita."
 TUR_husamettin_ozkan_desc: "Hüsamettin Özkan był wicepremierem w rządzie Bülenta Ecevita, wcześniej był także ministrem stanu. Özkan jest pochodzenia czerkieskiego, a jego brat Necdet był burmistrzem jednej z dzielnic Stambułu."
 TUR_fethullah_gulen_desc: "Fethullah Gülen jest przywódcą Hizmet, czyli ruchu Gülenistów. Gülen, niegdyś lokalny imam w Turcji, stał się wpływowym uczonym. Jego organizacja obejmuje cały świat i działa w sposób bardzo zdecentralizowany. Sam Gülen nie postrzega siebie jako przywódcy i według własnych słów „po prostu wypowiedział się na temat tego, w co wierzę”. Ponieważ to miało sens, ludzie sami to zrozumieli”."
 TUR_deniz_baykal_desc: "Deniz Baykal started his political career in 1973, when he was elected to the Turkish Parliament as the youngest MP under the party CHP. The CHP originally noticed him as Baykal wrote his docent thesis on the subject of why the CHP had lost the 1965 election. After the 1980 military coup, Baykal was shortly imprisoned and banned from politics, but in 1987 he was allowed to re-enter, and he joined the Social Democratic People's Party.\n\nIn 1992, the law prohibiting the refounding of previously dismembered parties was overturned and Baykal (along with many other ex-CHP politicians), refounded the CHP.\n\nOften described as being the 'Old Guard' of CHP, many have blamed Baykal for the lack of success of CHP, as many of his policies do not match contemporary Turkey."
 TUR_Kemal_Kilicdaroglu_desc: "Kemal Kılıçdaroğlu was elected as the leader of CHP after a scandal forced Deniz Baykal to resign his position. Kılıçdaroğlu has actively challenged the AKP, and has actively vowed to reveal the corruption of the party's politicians. Kılıçdaroğlu has also aimed to move CHP back to its leftist oriented roots. However, Kılıçdaroğlu's actions do not always match his words, as he has been seen waving a Grey Wolves flag and he supports the deportation of all Syrian refugees."
 TUR_Ufuk_Uras_desc: "Ufuk Uras is an economist and a graduate of the Istanbul University. Uras has been the chairman of ÖDP since 1996."
 TUR_abdullah_levent_tuzel_desc: "Abdullah Tüzel był jednym z członków założycieli EMEP w 1996 roku i od tego czasu przewodzi partii. Przed polityką Tüzel pracował jako niezależny prawnik. Był także członkiem zarządu Fundacji Praw Człowieka w Stambule i prezesem Stowarzyszenia Nowoczesnych Prawników w Stambule."
 TUR_dogu_perincek_desc: "Doğu Perinçek jest założycielem Partii Robotniczej IP i z zawodu prawnikiem. Perinçek jest znany ze swoich antyzachodnich postaw i twardych idei kemalistycznych połączonych z maoizmem. Gorąco zaprzecza także istnieniu ludobójstwa Ormian i jest członkiem Komitetu Talata Paszy, organizacji nazwanej na cześć podejrzanego głównego sprawcy ludobójstwa.\n\nPerinçek chce stworzyć przeciwwagę dla amerykańskiego imperializmu na Bliskim Wschodzie ."
 TUR_Necmeddin_Erbakan_desc: "Necmettin Erbakan is the founder of the Millî Görüş (National Vision) religious-political movement, which creates the foundation of his party. Erbakan is a long time leader of multiple Islamist political parties in Turkey, most of which have been banned shortly after their founding. Erbakan even served shortly as the Prime Minister, before being forced to step down by the military.\n\nErbakan's main policy is conservative Islam, and he wishes to shift focus from focusing on European countries to more cooperation with other Muslim nations, even going as far as creating an organization to rival NATO in the Middle East and a common currency called the dinar.\n\nIn early 2000s, Erbakan spent a little over 2 years in prison after being sentenced for embezzlement. The so called 'Lost Trillion Case' arose when his previous party, the Welfare Party, forged documents claiming that 1 trillion in Turkish lira of state sponsored party funds had been used for party activities in order to avoid having to return the funds after the party was banned in 1997."
 anti_imperialist_vanguard_faction: "Awangarda antyimperialistyczna"
 TUR_northern_cyprus_annexed: "Aneksja Cypru Północnego"
 TUR_afrin: "Ogłoś antykurdyjskie operacje w Syrii"
 TUR_afrin_desc: "Kurdish terrorists go by many names, but that does not mean they do not share the same ideals as each other. The PKK has always been a threat to Turkey and it will remain a threat until it along with its allies in the YPG, PYD, SDF, et cetera, are destroyed. It starts with Afrin, gather the troops."
 TUR_afrin2: "Rozpocznij operację Gałązka Oliwna"
 TUR_afrin2_desc: "If the Kurds cannot learn to accept their failure and defeat, they will continue to attack Turkey and its people, and this is where we must draw the line. Olive Branch will put an end to Kurdish terror attacks originating from the YPG held territory of Afrin. The operation is determined to root out and destroy Kurdish terrorists without collateral damage, we must proceed carefully."
 TUR_afrin_d: "Siły tureckie zagrażają Afrin"
 TUR_afrin_d_desc: "Turecki atak na Kurdów trwa. Groźba inwazji na Afrin jest realna, ponieważ turecki prezydent [ich_kraj.GetLeader], co nie było zaskoczeniem, nazwał nas terrorystami sprzymierzonymi z PKK i zagroził, że nas udusi, zanim będziemy mogli zaatakować ziemię turecką w absurdalnym ataku terrorystycznym. To nie jest nasza droga, ale musimy natychmiast przygotować się do ataku!"
 TUR_afrin_d2: "Siły tureckie kontynuują natarcie"
 TUR_afrin_d2_desc: "They call it \"Operation Olive Branch\", funny how the saying goes that the olive branch is an offer of peace. The Turks know not the meaning of peace, and their campaign of Kurdish oppression continues against the wrong opponent. Alas, if they want to continue this fight, we shall continue to defend ourselves."
 TUR_counter_terrorism_mil: "Operacje Przeciwdziałania Terroryzmowi – Oddział Wojskowy"
 strenghten_outposts_1: "Wzmocnij placówki"
 strenghten_outposts_1_desc: "Our outposts in the south-eastern part of our country were built up to stop smuggling from and to Northern Iraq around 1960s. Now, facing terror attacks, they are either too old or at the wrong positions and highly vulnerable to asymmetrical attacks. We need to come up with a solution to this, it may cost a lot of money but will make it up to us with the lives saved. And opposition will surely try and discredit this reform as they always do, saying it will waste our money for no benefit, so there is little room for failure."
 strenghten_outposts_2: "Rozpoczynanie gry na silnych placówkach"
 strenghten_outposts_2_desc: "Pierwsza z naszych nowych placówek powinna w krótkim czasie, ze względów politycznych, wykazać swoją skuteczność. Być może zbuduj je na wysokich, widokowych punktach, a najlepiej wokół wąskich punktów, które terroryści wykorzystywali do infiltracji."
 strenghten_outposts_3: "Najpierw stanowiska krytyczne"
 strenghten_outposts_3_desc: "Niektóre z naszych placówek, takie jak Aktütün Karakolu, są znane z regularnych najazdów ze względów strategicznych. Powinniśmy najpierw poprawić te słabe pozycje, a terroryści będą musieli opracować nowe plany."
 strenghten_outposts_4: "Dalsze doskonalenia"
 strenghten_outposts_4_desc: "Nowe placówki okazują się wystarczające, aby odeprzeć ataki terrorystyczne lub w ogóle nie dać się zaatakować, teraz terroryści unikają silnych i skupiają się na starych, słabszych. Może powinniśmy zlikwidować te niepotrzebne i zbudować zupełnie nowe placówki na potrzebnych pozycjach"
 strenghten_outposts_5: "Strategiczna błyskotliwość"
 strenghten_outposts_5_desc: "Ataki na nasze placówki zostały dość ograniczone, może możemy pomyśleć o budowie nowych tam, które będą utrudniać terrorystom trasy z ich jeziorami i wykorzystać te tamy jako ufortyfikowane mosty"
 strenghten_outposts_6: "Sukces kocha przygotowania"
 strenghten_outposts_6_desc: "Nearly every outpost of ours has either been rebuilt or left and razed. Only some final stages needed to polish up some sharp edges and we are done."
 doing_counter_terror_op_mil: "Prowadzenie kolejnej operacji wojskowej"
 doing_ext_sec: "Prowadzi już operację transgraniczną"
 doing_int_sec: "Przeprowadzam już kontrolę bezpieczeństwa wewnętrznego"
 airstrike_prepare: "Przygotowanie do ataków powietrznych"
 airstrike_thingy: "Przeprowadzanie ataków powietrznych"
 add_power_to_pkk: "Dodaj moc do PKK (do debugowania)"
 add_power_to_pkk_desc: "Dodaje mocy PKK"
 internal_preparation_1: "Normalne przygotowania do operacji wewnętrznych"
 internal_preparation_1_desc: "The fastest and cheapest one. If we pick this, the actual offensive will have a success rate of 40%. In terms of cost efficiency, this one is better.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_2: "Przeciętne przygotowania do operacji wewnętrznych"
 internal_preparation_2_desc: "Normal one. If we pick this, the actual offensive will have a success rate of 50%.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_3: "Dobre przygotowania do operacji wewnętrznych"
 internal_preparation_3_desc: "The slowest and most expensive one. If we pick this, the actual offensive will have a success rate of 60%. Not cost-efficient but with more guaranteed results.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_security: "Operacje wewnętrzne"
 internal_security_desc: "Eastern part of our country has a rough terrain, it holds many deserted villages, castle-like natural valleys filled with caves, narrow passages around mountains where no one lives. These features are so useful for insurgencies and PKK uses it. We need to constantly attack and raze their makeshift bases to reduce their power and hinder their recruitment efforts.\n\nWe can't make cross-border operations and internal operations at the same time."
 external_preparation_1: "Normalne przygotowania do operacji zewnętrznych"
 external_preparation_1_desc: "Najszybszy i najtańszy. Jeśli wybierzemy tę opcję, skuteczność ofensywy wyniesie 40%. Pod względem opłacalności ten jest lepszy.\n\n§RWnie możemy wykonać kilku przygotowań do jednego rodzaju operacji!§!"
 external_preparation_2: "Przeciętne przygotowania do operacji zewnętrznych"
 external_preparation_2_desc: "Normalny. Jeśli to wybierzemy, faktyczna ofensywa będzie miała skuteczność 50%.\n\n§RWnie możemy przygotowywać się kilka razy do jednego rodzaju operacji!§!"
 external_preparation_3: "Dobre przygotowania do operacji zewnętrznych"
 external_preparation_3_desc: "Najwolniejszy i najdroższy. Jeśli wybierzemy tę opcję, skuteczność ofensywy wyniesie 60%. Nieopłacalne, ale dające większą gwarancję wyników.\n\n§RWnie możemy przeprowadzić kilku przygotowań do jednego typu operacji!§!"
 external_security: "Operacje transgraniczne"
 external_security_desc: "PKK istnieje nie tylko w naszych granicach, spora część jej członków ma także bazy w północnym Iraku, aby wykorzystać ten sam nierówny teren, być nieco bezpieczniejszym przed naszą potęgą militarną, kontrolować przemyt i rekrutację. Te pozycje też musimy zaatakować, chociaż możemy spotkać się z oskarżeniami ze strony obcych mocarstw.\n\nNie możemy jednocześnie prowadzić operacji transgranicznych i wewnętrznych."
 prepping_ext: "Już planuję operację transgraniczną"
 prepping_int: "Już planuję przeszukanie wewnętrzne"
 collapse_mil_branch: "Ukryj decyzje dotyczące operacji wojskowych"
 expand_mil_branch: "Pokaż decyzje dotyczące operacji wojskowych"
 collapse_civ_branch: "Ukryj decyzje dotyczące reform cywilnych"
 expand_civ_branch: "Pokaż decyzje dotyczące reform cywilnych"
 TUR_counter_terrorism_civ: "Operacje antyterrorystyczne – oddział cywilny"
 college_professors: "Radzenie sobie z profesorami uczelni"
 college_professors_desc: "We have a fight on our hands and these people that are supposed to be enlightened, but they bitch about the situation and want the government to abdicate whenever a terrorist attack happens and call it genocide or xenophobia whenever we try to make a move against PKK. This needs to be stopped. We will either purge them or make sure they won't discredit our actions with baseless claims anymore"
 kurdish_language_1: "Problem języka kurdyjskiego"
 kurdish_language_1_desc: "For years there was an unwritten rule against Kurdish language. Not only opening television channels and universities with Kurdish language is banned, even if you are telling something Kurdish in public or in a street you might get attacked verbally. And nearly 20 percent of our population has Kurdish as their mother language. We need to solve this.\n\nUnlocks the second decision for more reforms."
 kurdish_language_2: "Koniec z dyskryminacją"
 kurdish_language_2_desc: "Po pierwsze, karanie osób atakujących osoby mówiące po kurdyjsku. Nikt nie zasługuje na to, aby bać się mówić w swoim własnym języku.\n\nOdblokowuje trzecią decyzję dotyczącą dalszych reform."
 kurdish_language_4: "Kurdyjskie kanały telewizyjne"
 kurdish_language_4_desc: "We will allow people to open Kurdish channels, not only this will discredit PKK's propaganda about Kurds being oppressed, it will win hearts of adult people who were born Kurdish and never got the chance to learn Turkish. Although we need to hire people to keep an eye on these channels and prevent them being used for PKK propaganda.\n\nUnlocks the fifth decision for more reforms."
 doing_counter_terror_op_civ: "Przeprowadzenie kolejnej reformy cywilnej"
 investment_propaganda_1: "Projekty infrastruktury"
 investment_propaganda_1_desc: "Our eastern regions are lacking badly needed infrastructure to overcome rough terrain. In terms of equality and keeping people happy, we need to fix this."
 investment_propaganda_2: "Wysiłek na rzecz bezrobocia"
 investment_propaganda_2_desc: "Hungry people tend to become criminals. Former governments ignored the eastern regions and didn't care about the problems that caused the Kurds to feel oppressed. We need to do better than the ones before us."
 TUR_military_category: "Tureckie Siły Zbrojne"
 TUR_military_category_desc: "\n£TUR_desctext_TSK \n\n\n\n\nTureckie wojsko niejednokrotnie ingerowało w turecką politykę. Za każdym razem, gdy czuło się zagrożone własne istnienie lub istnienie Turcji, organizowało (lub próbowało zorganizować) zamach stanu. Dość często wynikało to z odchodzenia tureckiego rządu od świeckości, a czasami z problemów gospodarczych, pozornie wywołanych przez rząd.\n\nJeżeli Twój §Ypozycja§! z [TUR.Nat_Autocracy_L] spadnie poniżej §Y0§!, Siły Zbrojne podejmą działania mające na celu obalenie rządu.\n\nNasza obecna §Ypozycja§!:[?TUR_military_standing_value|0+]\n\n[?TUR_military_standing_party|=0+] z naszej obecnej §YPartii Rządzącej§!\n[?TUR_military_standing_conservatism|=0+] z naszego §HSpołecznego konserwatyzmu - Rząd§!\n[?TUR_military_standing_opinion|=0+] z naszej §YMilitarnej§! Aktualna opinia\n[?TUR_military_standing_corruption|=0+] z naszego §YPoziomu Korupcji§!\n[?TUR_military_standing_economy|=0+] z naszego §YCyklu Gospodarczego§!\n[?TUR_military_standing_interest_rate|=0+] od naszej §YStopy procentowej§!"
 TUR_hizmet_gulen_struggle: "Walka Hizmet-AKP"
 TUR_hizmet_gulen_struggle_desc: "An active power struggle exists between §W[Western_Autocracy_L]§! and the §W[Neutral_Muslim_Brotherhood_L]§!. The Turkish people are split between who they want, as both sides formed a coalition in order to take power in the last election. Both parties are vying for power in Turkey, and they gain more and more power every time they successfully pass a law or counter one. Eventually things will tip over to one side and the coalition will be dissolved.\n\nCurrently §W[Western_Autocracy_L]§! Control is at §Y[?hizmet_power|%]§!\n\nCurrently §W[Neutral_Muslim_Brotherhood_L]§! Control is at §Y[?akp_power|%]§!"
 TUR_expose_akp_scandal: "Ujawnić skandale AKP"
 TUR_expose_akp_scandal_desc: "Ujawnimy skandal §H[Neutral_Muslim_Brotherhood_L]§! był zaangażowany w"
 TUR_expose_gulenist_institution: "Shut down Gülenist institutions"
 TUR_expose_gulenist_institution_desc: "Zamkniemy §H[Western_Autocracy_L]§! prowadzić instytucję"
 TUR_random_rally_akp_gulen: "Nadchodzący wiec polityczny!"
 TUR_disaster_income: "Katastrofa gospodarcza"
 TUR_disaster_income_desc: "Mówi się, że nadchodzi nadchodząca katastrofa gospodarcza i to nadchodzi szybko. Musimy szybko się zjednoczyć, aby nie dopuścić do powstania partii opozycyjnych i pogłębienia kryzysu."
 TUR_incoming_collapse: "Nadchodząca katastrofa"
 TUR_incoming_collapse_desc: "The market will crash, leading to devastating consequences..."
 TUR_ciw_decisions: "CIW"
 TUR_ciw_decisions_desc: "The §HCIW§!, or otherwise known as the §HConfederation of Islamic Wellbeing§! is an organization that intends to improve the wellbeing of islamic peoples around the globe. The CIW leader, §HTurkey§!, will have the ability to §Hinvest in other CIW members§!, and it could be through §Hinfrastructure, networks, industries, or railways§!, etc. §HCIW Members§! can §Ropt out§! of the organization at anytime, but doing so will §Rrevoke§! their ability to re-apply at a later date.\nThe §HCIW leader§! will be able to invest in other countries' education, healthcare, industry, infrastructure and emergency supply infrastructure. Once the leader invests in one of these things, a modifier with the bonuses are added to all the §HCIW members§! at no cost to them. §HCIW Member§! states will be able to §Gask for investments§! which can give them buildings instead of the bonuses given from the §HCIW Leader§!. If a §HCIW Member§! chooses to do one of these decisions, then the §HCIW Leader§! will get a certain amount of money into their §GInternational Investments§!."
 TUR_invest_in_infrastructure: "Zainwestuj w infrastrukturę CIW"
 TUR_invest_in_infrastructure_desc: "Będąc w stanie zbudować odpowiednią infrastrukturę, kraje CIW zapewnią swoim obywatelom odpowiednie mieszkania i obiekty"
 TUR_invest_in_disasters: "CIW Pomoc w przypadku katastrof"
 TUR_invest_in_disasters_desc: "Świat islamski doświadcza wielu katastrof i często nie jest w stanie naprawić wyrządzonych szkód. Możemy pomóc, przekazując im artykuły pierwszej potrzeby"
 TUR_invest_in_education: "Zainwestuj w edukację CIW"
 TUR_invest_in_education_desc: "Każdy potrzebuje dostępu do odpowiedniej edukacji i dlatego będziemy musieli inwestować w placówki edukacyjne w krajach CIW"
 TUR_invest_in_health: "Zainwestuj w CIW Healthcare"
 TUR_invest_in_health_desc: "Kraje, w których obowiązuje CIW, potrzebują opieki zdrowotnej dla swoich dużych populacji, ponieważ dostęp do odpowiednich leków jest utrudniony lub zbyt drogi."
 TUR_invest_in_industry: "Inwestuj w CIW Industries"
 TUR_invest_in_industry_desc: "By investing in CIW countries' industries, we are able to make the Islamic world industrialize and catch up to the Europeans much quicker"
 TUR_leave_ciw: "Opuść CIW"
 TUR_ask_for_infrastructure: "Zapytaj o inwestycje infrastrukturalne"
 TUR_ask_for_network: "Zapytaj o inwestycje w infrastrukturę sieciową"
 TUR_ask_for_supply: "Zapytaj o inwestycje transportowe"
 TUR_ask_for_radars: "Zapytaj o inwestycje radarowe"
 TUR_ask_for_airbase: "Zapytaj o inwestycje lotniskowe"
 TUR_empower_sultan: "Wzmocnij §W[Monarchist_L]§!"
 TUR_empower_sultan_desc: "The Sultan is the rightful owner of the Ottoman State, not some grumpy old man. The Sultan will take what is rightfully his, and he will get his supporters to march in and remove the current leader, even if it is done by force!"
 TUR_new_capital_mhp: "Odbuduj Konstantiniego"
 TUR_new_capital_mhp_desc: "Ataturk przeniósł naszą stolicę z Konstantiniyye do Ankary. Chociaż jego intencją było głównie trzymanie stolicy Turcji z dala od wrogów, ostatecznie niewiele to da. Przeniesiemy naszą stolicę do Konstantiniyye i zbudujemy ją większą niż kiedykolwiek wcześniej!"
 TUR_open_mid_east: "§HOtwórz sekcję bliskowschodnią§!"
 TUR_close_mid_east: "§HZamknij sekcję bliskowschodnią§!"
 TUR_support_in_iraq: "Zwiększ wsparcie w §HIraq§!"
 TUR_support_in_syria: "Zwiększ wsparcie w §HSyria§!"
 TUR_support_in_kuwait: "Zwiększ wsparcie w §HKuwejcie§!"
 TUR_open_levant: "§HOtwórz sekcję Lewantu§!"
 TUR_close_levant: "§HZamknij sekcję Lewantu§!"
 TUR_support_in_israel: "Zwiększ wsparcie w §HIzraelu/Palestynie§!"
 TUR_support_in_lebanon: "Zwiększ wsparcie w §HLebanie§!"
 TUR_support_in_jordan: "Zwiększ wsparcie w §HJordan§!"
 TUR_support_in_saudi: "Zwiększ wsparcie w §HHejaz§!"
 TUR_open_balkans: "§HOtwórz sekcję bałkańską§!"
 TUR_close_balkans: "§HZamknij sekcję bałkańską§!"
 TUR_support_in_bulgaria: "Zwiększ wsparcie w §HBułgarii§!"
 TUR_support_in_greece: "Zwiększ wsparcie w §HGrecja§!"
 TUR_support_in_macedonia: "Zwiększ wsparcie w §HMacedonia§!"
 TUR_open_assimulate: "§HOpen Assimilated Countries§!"
 TUR_close_assimulate: "§HClose Assimilated Countries§!"
 TUR_assimulate_macedonia: "Assimilate Macedonia"
 TUR_assimulate_greece: "Assimilate Greece"
 TUR_assimulate_bulgaria: "Assimilate Bulgaria"
 TUR_assimulate_hejaz: "Assimilate Hejaz"
 TUR_assimulate_lebanon: "Assimilate Lebanon"
 TUR_assimulate_jordan: "Assimilate Jordan"
 TUR_assimulate_israel: "Assimilate Israel/Palestine"
 TUR_assimulate_kuwait: "Assimilate Kuwait"
 TUR_assimulate_syria: "Assimilate Syria"
 TUR_assimulate_iraq: "Assimilate Iraq"
 TUR_invite_azerbaijan: "Zaproś Azerbejdżan"
 TUR_invite_azerbaijan_desc: "Nasi bracia w Azerbejdżanie z niecierpliwością czekali na ten dzień, w którym się zjednoczymy. Miejmy nadzieję, że będą bardziej niż szczęśliwi mogąc do nas dołączyć."
 TUR_invite_kazakhstan: "Zaproś Kazachstan"
 TUR_invite_kazakhstan_desc: "Kazakhs currently have some of the most land in the Turkic world. Their invitation to the Confederation should be a no-brainer."
 TUR_invite_uzbekistan: "Zaproś Uzbekistan"
 TUR_invite_uzbekistan_desc: "Uzbeks will be delighted upon hearing the news that their nation is eligible to join the Turkic Confederation. There will be no doubts they will join."
 TUR_invite_turkmenistan: "Zaproś Turkmenistan"
 TUR_invite_turkmenistan_desc: "Turkmenistan is not a country that really opens itself up to the world, but surely they will open themselves up to their Turkic friends."
 TUR_land_reforms: "Reformy rolne"
 TUR_land_reforms_desc: "Całkowicie zreformujemy sposób podziału ziemi wśród naszych obywateli."
 TUR_military_debug: "TSK"
 TUR_seize_mafia_assets: "Zajmij aktywa mafii"
 TUR_seize_mafia_assets_desc: "Teraz, gdy aresztowaliśmy kilku członków mafii, możemy bezpiecznie zająć ich aktywa na potrzeby... śledztwa."
 TUR_seize_goods_from_ports: "Kradnij towary z portów"
 TUR_assassinate_abdul_mustafa: "Rozpraw się z Kurdami"
 TUR_assassinate_abdul_mustafa_desc: "Ever since the Kurds gained autonomy in Northern Iraq back in the 90's, our security forces have been put on high alert due to the boost in morale of Kurdish separatists. By assassinating the governor of Kirkuk we will be able to severely damage Kurdish morale, and resistance."
 TUR_gulenist_educators2_desc: "Skupiliśmy się na podniesieniu poziomu naszego wykształcenia i musimy szerzyć nauki Gülena, póki możemy."
 TUR_9833_name_mhp: "Konstantiniyye"
 TUR_flavor_event.5.b: "Tragiczny"
 TUR_support_from_kurdish_television: "Wsparcie ze strony telewizji kurdyjskiej"
 TUR_support_from_kurdish_television_desc: "Kurdyjskie kanały telewizyjne, które pomogliśmy utrzymać, zaczęły wspierać nasz rząd i państwo i dobrze się o nich wypowiadać."
 PKK_hard_fought_freedom: "Hard Fought Freedom"
 PKK_hard_fought_freedom_desc: "Our freedom did not come with ease. It took the brave fighters of Kurdistan decades to gain autonomy from the Turkish state, and this freedom will be protected down to the very last Kurd!"
 TUR_revised_political_party_laws: "Targeted Political Laws"
 TUR_revised_political_party_laws_desc: "Certain laws have been passed that limit the ability of certain political parties to say what they want."
 TUR_scorched_earth_tactics: "Scorched Earth Tactics"
 TUR_supply_disruption: "Logistical Problems"
 TUR_PKK_released_TT: "The £TUR_Neutral_Communism  §OPKK Insurgency§! will end!\n - The £TUR_Neutral_Communism  §OPKK§! will become the ruling body of the new Kurdish state."
 PKK_strength_TT: "PKK Strength"
 PKK_strength2_TT: "Ta zmienna pokaże, jak silna stała się PKK. Będzie ona rosła o 5-10% rocznie, a gdy osiągnie 100%, PKK wyzwoli się i rozpocznie wojnę o niepodległość. Im więcej baz zniszczymy, tym słabsza będzie siła PKK. Musimy działać szybko, inaczej PKK będzie w stanie wyzwolić się w ciągu kilku lat."
 TUR_pkk_manpower_TT: "Manpower Of The [ROOT.TUR_PKK_bases_name] Base"
 TUR_pkk_manpower2_TT: "Ta zmienna wyświetla liczbę pracowników obecnych w bazie [ROOT.TUR_PKK_bases_name]. Jeśli uda nam się obniżyć jej liczbę poniżej 100, będziemy mogli trwale wykorzenić PKK z tego obszaru. Gdy wykorzenimy PKK w każdym stanie, będziemy mogli ogłosić całkowite zwycięstwo nad PKK."
 TUR_PKK_insurgency_formally_ends_TT: "The £TUR_Neutral_Communism  §OPKK Insurgency§! will end"
 TUR_less_than_100_PKK_diyarbakir_TT: "Has less than §H100 Manpower§! in the §HDiyarbakır§! Base"
 TUR_less_than_100_PKK_van_TT: "Has less than §H100 Manpower§! in the §HVan§! Base"
 TUR_less_than_100_PKK_euphrates_TT: "Has less than §H100 Manpower§! in the §HEuphrates§! Base"
 TUR_has_large_mil_or_higher_TT: "Has §OLarge Military Spending§! or higher"
 TUR_automate_warfare_TT: "Will begin an operation against the £TUR_Neutral_Communism  PKK\n - Instead of having to constantly assault this base, it will be done automatically\n - At the end of each month, a certain amount of £TUR_Neutral_Communism  PKK will be dead\n - While an operation is active, we will be spending equipment and manpower\n - We will receive events related to the fighting while operations are ongoing\n - The £TUR_Neutral_Communism  PKK will be more likely to attack deep into Anatolia"
 TUR_end_automate_warfare_TT: "Will end operations against the £TUR_Neutral_Communism  PKK in this state"
 TUR_spend_equipment_TT: "§RWe will lose§!:\n - Anywhere between §H150§! to §H460§! Small Arms\n - Anywhere between §H25§! to §H190§! Utility Trucks\n - Anywhere between §H5§! to §H65§! Manpower"
 TUR_assault_this_base_TT: "Between §H40§! to §H190§! £TUR_Neutral_Communism PKK Insurgents will be §Gkilled§!"
 TUR_finalized_kurdish_reforms_TT: "Will §Hfinalize§! and hold a referendum on [PKK.GetFlag] §HKurdish§! independence\n - We will §Rnot§! be able to pass any further reforms if we take this decision"
 TUR_release_ocalan_TT: "§HAbdullah Öcalan§! will be freed"
 TUR_completed_reconciliations_TT: "Wszystkie reformy zostały zakończone i uchwalone"
 TUR_PKK_broke_free_tt: "The [PKK.GetFlag] PKK will break free!\n - We will not be able to directly intervene, unless we justify a wargoal or start a war through a raid\n - The [PKK.GetFlag] PKK will have a standing army, with a major defensive bonus against us.\n - We will lose all cores on the Kurdish regions."
 TUR_double_damage_TT: "Will eliminate §H2X§! more §HPKK Insurgents§!\n§H50%§! Chance we lose §H1 Civilian Industry§!"
 TUR_2X_LOSS_TT: "§H50% Chance§! we lose §H2X More§! Equipment"
 TUR_AIR_LOSS_TT: "§H50% Chance§! we lose a §HTransport Aircraft§!"
 TUR_PKK_DAMAGE_300_TT: "Eliminating §H300§! §HPKK Insurgents§!"
 TUR_PKK_DAMAGE_200_TT: "Eliminating §H200§! §HPKK Insurgents§!"
 TUR_PKK_DAMAGE_100_2_TT: "Arrests §H100§! §HPKK Insurgents§!"
 TUR_PKK2_TT: "£decision_icon_small §YUnlocks§! Additional §YDecisions§! for Trouble in Kurdistan\n - Taking this option will allow us to assert greater dominance over the Kurdish regions of the middle east.\n - If we successfully destroy all PKK bases, we will be able to bring a permanent end to Kurdish separatism in Turkey."
 TUR_PKK3_TT: "£decision_icon_small §YUnlocks§! Additional §YDecisions§! for Trouble in Kurdistan\n - This option replaces military operations against £TUR_Neutral_Communism  §HPKK bases§!. Destroying bases will not fulfill the promise.\n - We will have §H1,500 days§! to pass the required reforms. Starting a reform extends the deadline.\n - This option will grant the [PKK.GetFlag] Kurds more autonomy.\n - [PKK.GetFlag] Diyarbakir will become an autonomous region, with much of its industry controlled by us.\n - The [PKK.GetFlag] PKK will have its own army, government, and territory.\n - Taking this option will anger neighboring countries with sizeable Kurdish minorities."
 TUR_rebuilding_kurdistan: "Rebuilding Kurdistan"
 TUR_rebuilding_kurdistan_desc: "\n£TUR_desctext_PKK \n\n\n\n\nOur promise of reconciliation has renewed hopes in the Kurdish population living in the Eastern parts of our great nation. Though they will be a separate entity, the new Kurdish state will still need to answer to our government. In order to create a stable, and self-sufficient Kurdish state, we must first create the necessary infrastructure and framework for it to hold itself without collapsing or relying on us too much. If we fail to deliver this promise, we may lose complete control over the region."
 TUR_PKK_mechanic: "Kłopoty w Kurdystanie"
 TUR_PKK_mechanic_desc: "\n£TUR_desctext_PKK \n\n\n\n\nThe £TUR_Neutral_Communism  §HPKK§! first began their attacks in the late 70's, and ever since, have persisted in their efforts of gaining autonomy or out-right independence from our nation. The £TUR_Neutral_Communism  §HPKK§! have spread their movement to neighboring states, destabilizing our neighbors, and creating a need for closer cooperation. We can do little in stopping the growth of their strength except for attacking them. The more bases we clear out, the weaker their strength becomes. Taking out the £TUR_Neutral_Communism  §HPKK§! is a race against time, the longer we take to clear them out, the closer they get to a major revolt or independence.\n\nSelected Base: [ROOT.TUR_PKK_bases_name]"
 TUR_PKK_van_manpower: "[?var_pkk_van]"
 TUR_PKK_diyarbakir_manpower: "[?var_pkk_diyarbakir]"
 TUR_PKK_euphrates_manpower: "[?var_pkk_euphrates]"
 TUR_hold_meeting: "Zorganizuj szczyt w Diyarbakır"
 TUR_hold_meeting_desc: "We can convene in Diyarbakır with our allies, and together we can agree on a deal to move forward. Either we can cooperate with our allies, and take on the PKK together at a cost, or we can decide to do things on our own, potentially risking conflict with our neighbors if we choose to pursue cross-border raids. We can also choose to announce our intention to grant the Kurds autonomy at the summit."
 TUR_select_van_base: "Conduct Operations In Van"
 TUR_select_van_base_desc: "The Van area is the province with some of the highest PKK activity, bordering both Iran and Armenia."
 TUR_select_diyarbakir_base: "Conduct Operations In Diyarbakır"
 TUR_select_diyarbakir_base_desc: "Diyarbakır to prawdopodobnie obszar, w którym członkowie i zwolennicy PKK stawiają największy opór. Jest to punkt zapalny działalności PKK."
 TUR_select_euphrates_base: "Conduct Operations In Middle Euphrates"
 TUR_select_euphrates_base_desc: "Mimo że jest tam spokojniej niż w innych rejonach, w rejonie środkowego Eufratu obserwuje się wzmożoną aktywność komórek PKK."
 TUR_assault_this_base: "Launch Assault On [ROOT.TUR_PKK_bases_name]"
 TUR_assault_this_base_desc: "By launching an assault on [ROOT.TUR_PKK_bases_name], we will be able to more directly flush out PKK strongholds."
 TUR_greenlight_operations_in_van: "Greenlight Operations In Van"
 TUR_greenlight_operations_in_van_desc: "We can give the go-ahead to the TSK in order to launch a full scale attack against the PKK in Van."
 TUR_end_operations_in_van: "End Operations In Van"
 TUR_end_operations_in_van_desc: "Musimy zakończyć działania w Van, ponieważ zasoby i planowanie są potrzebne gdzie indziej."
 TUR_greenlight_operations_in_diyarbakir: "Greenlight Operations In Diyarbakır"
 TUR_greenlight_operations_in_diyarbakir_desc: "We can give the go-ahead to the TSK in order to launch a full scale attack against the PKK in Diyarbakır."
 TUR_end_operations_in_diyarbakir: "End Operations In Diyarbakır"
 TUR_end_operations_in_diyarbakir_desc: "We need to wrap operations up in Diyarbakır, as resources and planning is needed elsewhere."
 TUR_greenlight_operations_in_euphrates: "Greenlight Operations In Middle Euphrates"
 TUR_greenlight_operations_in_euphrates_desc: "We can give the go-ahead to the TSK in order to launch a full scale attack against the PKK in Middle Euphrates."
 TUR_end_operations_in_euphrates: "End Operations In Middle Euphrates"
 TUR_end_operations_in_euphrates_desc: "We need to wrap operations up in Middle Euphrates, as resources and planning is needed elsewhere."
 TUR_clean_out_PKK_in_van: "End PKK Presence In Van"
 TUR_clean_out_PKK_in_van_desc: "Nadszedł czas, abyśmy wreszcie położyli kres obecności PKK w Van i okolicach. Nasze sukcesy w walce z PKK jak dotąd przyniosły efekty, ale czy uda nam się utrzymać pokój w Van?"
 TUR_clean_out_PKK_in_diyarbakir: "End PKK Presence In Diyarbakır"
 TUR_clean_out_PKK_in_diyarbakir_desc: "The time has come for us to finally end PKK presence in Diyarbakır and its surrounding areas. Our success in combating the PKK has paid off thus far, but will we be able to maintain peace in Diyarbakır?"
 TUR_clean_out_PKK_in_euphrates: "End PKK Presence In Middle Euphrates"
 TUR_clean_out_PKK_in_euphrates_desc: "The time has come for us to finally end PKK presence in the Middle Euphrates and its surrounding areas. Our success in combating the PKK has paid off thus far, but will we be able to maintain peace in the Middle Euphrates?"
 TUR_declare_victory_over_PKK: "Triumph Over The PKK"
 TUR_declare_victory_over_PKK_desc: "The time has come for us to claim our long awaited victory and triumph over the PKK terrorists who began ruthlessly attacking our sovereignty several decades ago."
 TUR_the_promise_of_no_return: "The Promise Of No Return"
 TUR_the_promise_of_no_return_desc: "We promised the Kurdish community in the east greater autonomy. Complete five reforms and finalize them before the deadline. Starting each reform extends the deadline. Military operations against PKK bases do not affect this mission."
 TUR_finalize_the_reforms: "Finalize The Reforms"
 TUR_finalize_the_reforms_desc: "With many reforms having been passed, it is time to finalize the reforms and call for a proper Kurdish referendum."
 TUR_power_infrastructure: "Establish Proper Power Infrastructure"
 TUR_power_infrastructure_desc: "Brak odpowiedniej sieci energetycznej może prowadzić do kolosalnych niepowodzeń w zarządzaniu państwem. Nowe państwo kurdyjskie nie będzie się od tego różnić."
 TUR_jobs_and_careers: "Kurdish Jobs and Careers"
 TUR_jobs_and_careers_desc: "Praca jest niezbędna dla rozwoju państwa kurdyjskiego. Bez odpowiedniego zatrudnienia i produktywności gospodarka każdego kraju uległaby załamaniu."
 TUR_kurdish_security_apparatus: "Establish The Kurdish Security Apparatus"
 TUR_kurdish_security_apparatus_desc: "Without proper security and a competent armed force, the Kurdish state will be susceptible to foreign or internal attacks on its territory. This would eventually spill over into Turkey itself, which is something that we simply cannot afford."
 TUR_pass_the_infrastructure_bill: "Pass The Infrastructure Reform Bill"
 TUR_pass_the_infrastructure_bill_desc: "Przyjmując ustawę o reformie infrastruktury we Wschodnim Kurdystanie, będziemy mogli formalnie zezwolić na przeniesienie wielu gałęzi przemysłu do Centralnej Anatolii i zbudować infrastrukturę niezbędną do tego, by przyszłe państwo mogło rozwijać własny przemysł."
 TUR_release_ocalan: "Release Öcalan"
 TUR_release_ocalan_desc: "Abdullah Öcalan przebywa w naszym więzieniu od dłuższego czasu i wielokrotnie groziła mu egzekucja. Nadszedł czas, abyśmy wypuścili Öcalana z powrotem do społeczeństwa, jeśli chcemy poprawić nasze relacje z Kurdami."
 TUR_PKK_VAN_BASE: "Van"
 TUR_PKK_DIYARBAKIR_BASE: "Diyarbakır"
 TUR_PKK_EUPHRATES_BASE: "Middle Euphrates"
 TUR_PKK_NO_BASE: "No base selected"
 TUR_PKK_NO_BASE_STRENGTH: "N/A"
 TUR_pkk.2.b: "No. This is a threat to our sovereignty"
 TUR_pkk.100.t: "Pre-Operation Strike on [ROOT.TUR_PKK_bases_name]"
 TUR_pkk.100.d: "Dotarliśmy do etapu, w którym musimy zacząć osłabiać obronę PKK w bazie, którą atakujemy. Obecnie planujemy ruch PKK wokół [ROOT.TUR_PKK_bases_name], aby przeprowadzić ataki przedoperacyjne. Zawsze istnieje ryzyko, że coś pójdzie nie tak, ale nie powinniśmy się zbytnio martwić o porażkę, jeśli nasze wojska są przygotowane i skuteczne."
 TUR_pkk.100.a: "Launch a coordinated airstrike"
 TUR_pkk.100.b: "Disrupt their supply lines"
 TUR_pkk.100.c: "Pepper them with artillery"
 TUR_pkk.100.d1: "We can sit this one out"
 TUR_pkk.200.t: "Troops Run Low on Supplies"
 TUR_pkk.200.d: "Raporty z frontu w [ROOT.TUR_PKK_bases_name] wskazują na niedobór zaopatrzenia, co może oznaczać, że nasza zdolność operacyjna do zadawania obrażeń PKK jest niewystarczająca. Możemy wysłać żołnierzom na linię frontu tak bardzo potrzebny sprzęt, ale musimy również pamiętać o utrzymaniu własnych zapasów na wypadek potencjalnego konfliktu na arenie międzynarodowej."
 TUR_pkk.200.a: "Airlift them whatever they need"
 TUR_pkk.200.b: "Give equipment to trustworthy locals to transport"
 TUR_pkk.200.c: "They can use what they have now"
 TUR_pkk.201.t: "PKK Entrench Themselves in Residential Area"
 TUR_pkk.201.d: "PKK zdecydowało się zająć pozycje obronne na terenie zamieszkałym, narażając ludność cywilną na niebezpieczeństwo. Musimy znaleźć sposób na wyeliminowanie tych powstańców bez wywoływania poważnych zamieszek w tym rejonie, w przeciwnym razie ryzykujemy naszą reputację i życie tych, którzy pragną jedynie spokoju."
 TUR_pkk.201.a: "Call up the Commando Units"
 TUR_pkk.201.b: "Try and strike at night"
 TUR_pkk.201.c: "Just launch an attack!"
 TUR_pkk.202.t: "PKK Launch Counter-Offensive"
 TUR_pkk.202.d: "PKK zdecydowało się na rozpoczęcie dużej kontrofensywy na miasto [ROOT.TUR_PKK_bases_name], co wywołało zamieszki i poczucie strachu wśród części żołnierzy. Jednak teraz nie jest czas na bieganie jak kurczaki bez głowy, ale na ocenę dalszych kroków. Naczelne dowództwo odpowiedzialne za operacje zostało powiadomione i oczekuje na rozkazy."
 TUR_pkk.202.a: "Respond to them with an offensive of our own"
 TUR_pkk.202.b: "Dig in and prepare for the assault"
 TUR_pkk.202.c: "Use scorched earth tactics and fall back"
 TUR_pkk.203.t: "Massive PKK Convoy Ambushed"
 TUR_pkk.203.d: "Korzystając ze zdobycznych pojazdów wojskowych i cywilnych, PKK posuwało się z [ROOT.TUR_PKK_bases_name] w inne miejsce, aby uniknąć niespodziewanego ataku. Jednak nasi informatorzy w PKK ostrzegli nas o ruchu i udało nam się zastawić na nich zasadzkę. Obecnie konwój jest okrążony przez naszą żandarmerię i oczekuje na rozkazy dotyczące dalszych działań."
 TUR_pkk.203.a: "Destroy everything in the area"
 TUR_pkk.203.b: "Make an attack and try to capture the equipment"
 TUR_pkk.203.c: "Starve them out until they surrender"
 TUR_pkk.204.t: "PKK Attempts to Sow Division"
 TUR_pkk.204.d: "PKK próbowała siać podziały polityczne w naszym kraju, wzywając do masowych protestów w całym kraju. Oddziały prewencji zostały postawione w stan gotowości, ale Kongres i nasza partia policyjna domagają się dalszych działań."
 TUR_pkk.204.a: "Arrest the ring-leaders"
 TUR_pkk.204.b: "Use the movement to our advantage"
 TUR_pkk.204.c: "Pass laws to weaken their movements"
 TUR_pkk.205.t: "PKK Forces Retreat into Armenia"
 TUR_pkk.205.d: "PKK fighters that were engaged with our own troops have crossed the border into Armenia, even attacking and holding some Armenian border guards hostage. There are a few who are still trying to flee from the engagement with our troops, but we now have to make a decision to either send reinforcements and prepare to cross the border or continue the fight against the ones who are still trying to flee."
 TUR_pkk.205.a: "Abandon the operation entirely"
 TUR_pkk.205.b: "Focus on those still here"
 TUR_pkk.205.c: "Go after them!"
 TUR_pkk.206.t: "Turkish Forces Suffer Defeat"
 TUR_pkk.206.d: "Doniesienia z granicy turecko-armeńskiej sugerują, że tureccy bojownicy wycofują się do Turcji po tym, jak nie udało im się schwytać bojowników PKK, którzy uciekli do Armenii. Armeńscy urzędnicy powtórzyli, że nie udzielili schronienia PKK, lecz było to nieoczekiwane wtargnięcie, a schwytani bojownicy PKK zostaną rozprawieni."
 TUR_pkk.206.a: "Dobra"
 TUR_pkk.207.t: "Armenian Forces Stand Down"
 TUR_pkk.207.d: "Po serii udanych ataków na armeńskich strażników na granicy, stacjonujące tam jednostki zgodziły się wycofać i zezwolić na pojmanie bojowników PKK, którzy uciekli do Armenii przez wschodnią granicę turecką."
 TUR_pkk.207.a: "Dobra"
 TUR_pkk.208.t: "Turkish and Armenian Forces Agree to Ceasefire"
 TUR_pkk.208.d: "Following a series of clashes between Armenian and Turkish border guards, both sides have agreed to lay down their arms and agreed to a ceasefire."
 TUR_pkk.208.a: "Dobra"
 TUR_pkk.209.t: "Troops Lack Proper Transport"
 TUR_pkk.209.d: "Our troops have somehow managed to get themselves stranded on the way back to their base. Reportedly, PKK militants were able to sabotage much of the convoys used to transport the troops to the Eastern border."
 TUR_pkk.209.b: "Tell them to keep pushing"
 TUR_pkk.209.a: "Send more transports"
 TUR_pkk.209.c: "Salvage what we can"
 TUR_pkk.210.t: "Alleged PKK Deserter Promises Intel"
 TUR_pkk.210.d: "Podobno dezerter z PKK poddał się naszym oddziałom, obiecując ujawnienie kluczowych pozycji jednostek PKK stacjonujących wokół Van. Jeśli nie kłamie, będziemy mogli wykorzystać jego dane wywiadowcze, aby całkowicie zniszczyć pozycje PKK, które ujawni."
 TUR_pkk.210.a: "He cannot be trusted, put him in a cell"
 TUR_pkk.210.b: "'Where are they?'"
 TUR_pkk.210.c: "'What else do you know?'"
 TUR_pkk.211.t: "Misleading Information Leads To Casualties!"
 TUR_pkk.211.d: "It appears that the information given by the Alleged PKK double agent has been incorrect. As a result, we have lost several good men to this tragedy. Their blood will not be in vain, and our revenge will be swift!"
 TUR_pkk.211.a: "Terrible"
 TUR_pkk.212.t: "Information Leads To Secret PKK Base"
 TUR_pkk.212.d: "It appears that the information provided to us by the PKK double agent has led to the location of several PKK members at a hidden base. As a result, our men have been able to assault the location and take out several PKK terrorists."
 TUR_pkk.212.a: "Great!"
 TUR_pkk.214.t: "Operational Success In Van"
 TUR_pkk.214.d: "Po dziesięcioleciach walk zorganizowany kurdyjski opór w regionie Wan dobiegł końca. Chwalebny sztandar państwa tureckiego powiewa wyżej niż kiedykolwiek, ponieważ nowy początek dla prowincji przywrócił nadzieję wszystkim mieszkańcom."
 TUR_pkk.214.a: "At long last.."
 TUR_pkk.215.t: "Operational Success In Middle Euphrates"
 TUR_pkk.215.d: "Po dziesięcioleciach walk zorganizowany kurdyjski opór w regionie Środkowego Eufratu dobiegł końca. Chwalebny sztandar państwa tureckiego powiewa wyżej niż kiedykolwiek, ponieważ nowy początek dla prowincji przywrócił nadzieję wszystkim mieszkańcom."
 TUR_pkk.215.a: "At long last.."
 TUR_pkk.216.t: "Operational Success In Diyarbakır"
 TUR_pkk.216.d: "Po dziesięcioleciach walk zorganizowany kurdyjski opór w regionie Diyarbakır dobiegł końca. Chwalebny sztandar państwa tureckiego powiewa wyżej niż kiedykolwiek, ponieważ nowy początek dla prowincji przywrócił nadzieję wszystkim mieszkańcom."
 TUR_pkk.216.a: "At long last.."
 TUR_pkk.217.t: "[TUR.GetName] Proclaims Victory Over The PKK"
 TUR_pkk.217.d: "Rząd [TUR.GetAdjective] wydał niedawno oświadczenie, w którym ogłosił, że wszystkie główne bazy, komórki i kryjówki PKK zostały oczyszczone przez Siły Zbrojne [TUR.GetAdjective] (TSK). To oświadczenie zaniepokoiło kurdyjskich separatystów na Bliskim Wschodzie, w tym samą [TUR.GetName]. PKK działała w [TUR.GetName] od bardzo dawna, przez kilka dekad, od momentu jej powstania w latach 70. XX wieku. Początkowo grupa kurdyjska miała nadzieję na utworzenie niepodległego państwa na terenie wschodniej Turcji, ale ich ruch szybko przekształcił się w dążenie do autonomii, a nie do całkowitej niepodległości. Rząd [TUR.GetAdjective] był odporny na tę presję i osiągnął punkt, w którym może ogłosić zwycięstwo nad ruchem."
 TUR_pkk.217.a: "Ciekawe"
 TUR_pkk.604.t: "PKK Declare General Mobilization"
 TUR_pkk.604.d: "PKK ogłosiła powszechną mobilizację przeciwko naszemu rządowi, a jej rzecznik ogłosił dziś rano, że „wszyscy zwolennicy ruchu i wszyscy bojownicy o wolność muszą stawić się u swoich dowódców o świcie”. Po tym ogłoszeniu nastąpiły ogólne ataki PKK na miasta otaczające Kurdystan, oficjalnie rozpoczynając działania wojenne i stwarzając atmosferę głębokiego zaniepokojenia wśród mieszkańców tych terenów. Wkrótce ma zostać ogłoszony stan wyjątkowy do czasu całkowitego wykorzenienia PKK."
 TUR_pkk.604.a: "They show their true colors.."
 TUR_pkk.600.t: "Catastrophic Consequences Following Failure In Delivering Our Promise"
 TUR_pkk.600.d: "Our empty promises have now caught up to us. The Kurds that reside in the east of our state have seized control over Kurdish majority areas. We no longer formally control these territories, with our government being essentially powerless in making an immediate decision as a result of the bureaucratic process that we are stuck in."
 TUR_pkk.600.a: "Oh no"
 TUR_pkk.601.t: "Kurdish Autonomy Referendum Passes"
 TUR_pkk.601.d: "The Kurdish autonomy referendum has passed with an overwhelming majority of Kurds voting in favor of autonomization. With this referendum, the People's Republic of Kurdistan will become an Eyalet of [TUR.GetName]. The Kurdistan Workers' Party will be the ruling authority in the state, and they will be able to field an army, govern the laws and politics of the region, and hold elections as they see fit. We will still retain control over major industrial and economic sectors, but a fraction of the profits will still go to the Kurdish state."
 TUR_pkk.601.a: "Dobra"
 TUR_VAN_SELECTED_OP: "Van has been selected"
 TUR_commence_operations_in_van: "Commence Operations in Van"
 TUR_commence_operations_in_van_desc: "Nadszedł czas, aby uderzyć głęboko w serce PKK w naszym kraju. Jako najdalej na wschód wysunięty punkt oporu w naszym kraju, PKK wykorzystuje Van jako bazę wypadową dla wielu ataków na zachodnią Turcję i Iran. Rozpoczniemy działania, aby ich wyeliminować, a Van będzie wolny od zagrożenia, które utrzymywało się tam przez te wszystkie lata."
 TUR_PKK_ACTIVITY: "Active £TUR_Neutral_Communism  PKK Insurgencies"
 TUR_PKK_ACTIVITY_desc: "The PKK have "
 TUR_misak_mili: "Misak-ı Millî"
 TUR_misak_mili_desc: "\n£TUR_desctext_misak \n\n\n\n\n§HMisak-ı Millî§! (National Pact) was a set of six decisions passed by the parliament in the 1920's. Vitalized primarily after the destruction of the [TUR.GetFlag] Ottoman Empire at the hands of the Entente, the §HNational Pact§! sought out to restore some of Turkey's lost glory, and its lands. However the decisions were not followed through with due to the [TUR.GetFlag] Turkish war of independence and the establishment of the [TUR.GetFlag] Turkish Republic by Mustafa Kemal Ataturk. However the concept and ideals of the §HNational Pact§! still resonates within many [TUR.GetFlag] Turkish nationalists in the modern day, despite its lack of wide-spread support in the national populace."
 TUR_armenian_integration: "[ARM.GetFlag] Return to Armenia"
 TUR_levantine_vilayets: "[SYR.GetFlag] [LEB.GetFlag] Levantine Vilayets"
 TUR_eastern_resolve: "[KUR.GetFlag] [PUK.GetFlag] Eastern Resolve"
 TUR_aegean_realignment: "[GRE.GetFlag] Aegean Re-alignment"
 TUR_crescent_and_olive: "[CYP.GetFlag] [NCY.GetFlag] Crescent and the Olive"
 TUR_kurdish_schools: "Kurdyjskie szkoły i uniwersytety"
 TUR_kurdish_schools_desc: "Zezwolimy na używanie języka kurdyjskiego obok tureckiego w wybranych szkołach i miastach, gdziekolwiek uznamy to za konieczne. Będzie to szczególnie pomocne dla dzieci, niezależnie od tego, czy są wychowywane dwujęzycznie, czy nie."
 TUR_kurdish_language_5: "Kurdish State Channel"
 TUR_kurdish_language_5_desc: "TRT (short for Türkiye Radyo Televizyon, Turkish Radio and Television) has been our official state TV since '68. Over the years, its numbers grew and there are now several channels of TRT, some of them are for general subjects or for example TRT-Müzik broadcasts only music or TRT-Belgesel broadcasts only documentaries. We should open up a new one that will operate in Kurdish language. This can cost more but will further discredit PKK propaganda."
 TUR_finalized_reforms: " Has finalized reforms"
 TUR_fight_army_incompetence: "Yes Men Army"
 TUR_fight_army_incompetence_desc: "Nasza armia zostanie zreformowana i zrestrukturyzowana tak, aby więcej osób mówiło „Tak, proszę pana”, a mniej „Nie”."
 Turkish_mafia.1200.t: "PKK Insurgency Eliminated"
 Turkish_mafia.1200.d: "Our security forces have completed operations across the Kurdish regions. The PKK's capacity to threaten Turkish territory has been broken and order is being restored."
 Turkish_mafia.1200.a: "Our work here is done."
 Turkish_parties.11.t: "The Rights and Equality Party"
 Turkish_parties.11.d: "Retired general Osman Pamukoğlu, celebrated for his command in the southeast and known to his supporters as the 'Legendary Commander', has founded the Hak ve Eşitlik Partisi (HEPAR). The party blends staunch secular Kemalism with a hard line on the Kurdish question, presenting itself as a nationalist alternative untainted by the established parties."
 Turkish_parties.11.a: "A new force enters the arena"
 TUR_PKK_TT: "£decision_icon_small §YUnlocks§! Additional §YDecisions§! for Trouble in Kurdistan\n - Taking this option will let us move against the PKK while keeping our neighbors on side.\n - [PER.GetFlag] Iran, [SYR.GetFlag] Syria, [IRQ.GetFlag] Iraq and the [KUR.GetFlag] Kurds will be invited to a security summit in Diyarbakir.\n - Every neighbor that attends will help us wear the PKK down."
 TUR_ai_build_the_akp: "Build the Party of Justice and Development"
 TUR_ai_build_the_akp_desc: "The remnants of the Virtue Party's reformist wing are organising a new movement, and the machine behind it is being assembled district by district."
 TUR_ai_rally_the_kemalists: "Rally the Republican Ranks"
 TUR_ai_rally_the_kemalists_desc: "The republican establishment is closing ranks and campaigning hard to keep the secular parties ahead of the field."
 TUR_ai_rally_the_grey_wolves: "Rally the Nationalist Movement"
 TUR_ai_rally_the_grey_wolves_desc: "The nationalist movement is organising in the provinces, and its rallies are drawing crowds the established parties can no longer match."
 TUR_ai_build_hizmet: "Expand the Hizmet Network"
 TUR_ai_build_hizmet_desc: "The movement's schools, newspapers and business associations are quietly building a following that no party list yet reflects."
 TUR_ai_rally_the_left: "Rally the Turkish Left"
 TUR_ai_rally_the_left_desc: "The revolutionary left is organising in the unions and the universities, taking the anti-establishment vote the Islamists have been living on."
 TUR_ai_rally_the_virtue_party: "Rally the Virtue Party"
 TUR_ai_rally_the_virtue_party_desc: "The Islamist movement is consolidating behind the Virtue Party, gathering the votes it will need to govern."
 TUR_ai_rally_the_great_east: "Preach the Great East"
 TUR_ai_rally_the_great_east_desc: "The movement's preachers are carrying Necip Fazıl's vision of a restored Islamic order into the mosques and the party's own rank and file."
 TUR_pkk.605.t: "Renewed Offensive in the Southeast"
 TUR_pkk.605.d: "The PKK has spent years rebuilding in the mountains while the government looked elsewhere, and the general staff will wait no longer. A state of emergency has been declared across the southeastern provinces, reservists are being called up, and the army is moving into the valleys in strength. The insurgency will be broken back down to a manageable size, but the bill will be a heavy one: in conscripts, in lira, and in the government's standing at home."
 TUR_pkk.605.a: "Whatever it takes."
 TUR_PKK_OFFENSIVE_TT: "The £TUR_Neutral_Communism  §OPKK Insurgency§! is beaten back down to a manageable strength, but it is not destroyed."
 TUR_fund_oil_strikes: "Funded Oil Industry Strikes"