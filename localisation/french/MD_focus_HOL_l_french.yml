 HOL_sumatra_detection_chance: "Probabilité de détection de la VOC dans l'île de §YSumatra§! §Y[IND.GetNameWithFlag]§!"
 HOL_sumatra_detection_chance_effect_tt: "Probabilité de détection de la VOC dans l'île de §YSumatra§! §Y[IND.GetNameWithFlag]§! : Augmentation de [?HOL_sumatra_detection_chance_change|%-]"
 HOL_sumatra_strength: "Force de la VOC dans l'île de §YSumatra§! §Y[IND.GetNameWithFlag]§!"
