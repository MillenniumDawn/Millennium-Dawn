 CBD_pv_attack_preah_vihear_desc: "사원 단지 주변 땅을 장악하기 위해 육군 부대를 국경 너머로 파견합니다. 성공하면 분쟁 지역이 우리의 화력 아래 놓입니다. 실패하면 국내외 지지에서 막대한 대가를 치르게 됩니다."
