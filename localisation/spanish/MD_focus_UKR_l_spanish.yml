 ukraine_develop_btr4_bau23_2_bonus: "BAU-23x2 weapons module will provide additional AA-defense, but it lacks armor piercing and hard attack"
 ukraine_develop_btr4_3td_bonus: "Additional fuel consumption as a result of using 3TD-3 engine"
 ukraine_develop_btr4_deutz_bonus: "Higher speed and less fuel consumption as a result of using Deutz BF6M1015CP engine"
 ukraine_develop_btr4_iveco_bonus: "Less fuel consumption as a result of using Iveco Cursor 10-430 engine"
 ukraine_develop_btr4_tests_bonus: "Additional reliability as a result of extended tests for BTR-4"
 UKR_develop_t84u: "Research §YT-84U 'Oplot'§!"
 UKR_develop_t84u_desc: "T-84U 'Oplot' is a Ukrainian main battle tank of the third generation, developed by the Kharkiv Design Bureau named after O. O. Morozov on the basis of the T-84 tank.\nThe tank received a new welded-rolled turret with an all-stamped roof, made from electroslag remelting, due to which it has higher strength and survivability.\nTaking into account the simpler shape of the turret, it was possible to successfully place multi-layer armor in it. Its internal volume was also increased.\nA new Ukrainian-made 3rd generation dynamic protection 'Nizh' was placed in the frontal projection of the turret.\nEquipped with Ukrainian-made dynamic and active protection, foreign-made aiming devices, and enlarged side screens."
 UKR_develop_yatahan: "Research §YT-84-120 'Yatahan'§!"
 UKR_develop_yatahan_desc: "T-84-120 'Yatahan' is a version of the T-84U 'Oplot' tank that has a 120-mm gun adapted to NATO standards instead of the typical 125-mm gun, developed by the Kharkiv Design Bureau named after O. O. Morozov.\nThe tank has a 120-mm KBM2 cannon, which uses 120-mm caliber NATO ammunition.\nThe carousel autoloader (originally French, then Ukrainian-made) is located in the aft part of the turret.\nIt is possible to install the new 140-mm 'Bahira' gun.\nAssembled from components of Ukrainian production, although it is fully compatible with components of foreign production."
 UKR_develop_bahira: "Research §YT-84-140 'Bahira'§!"
 UKR_develop_bahira_desc: "T-84-140 'Bahira' is a proposed version of the T-84-120 'Yatahan' tank that would be equipped with a 140-mm gun 'Bahira', developed by the Kharkiv Design Bureau named after O. O. Morozov.\nThe carousel autoloader is located in the aft part of the turret.\nAssembled from components of Ukrainian production, although it is fully compatible with components of foreign production."
 UKR_develop_bm_oplot: "Research §YT-84 'BM Oplot'§!"
 UKR_develop_bm_oplot_desc: "T-84 'BM Oplot' he newest and most sophisticated version of T-84U 'Oplot' MBT, developed by the Kharkiv Design Bureau named after O. O. Morozov.\nIts distinct features, among others, are mounting more advanced armor, new electronic countermeasure systems, and others.\nOne visible feature is the new PNK-6 panoramic tank sight."
 UKR_develop_bastion: "Research §YT-84 'Bastion'§!"
 UKR_develop_bastion_desc: "T-84 'Bastion' is a reported modernization program, according to which the tank will get rid of Russian-made parts.\nThe T-84 'BM Oplot' version, adopted in 2009, had a certain number of components and materials of Russian origin: individual components of electrical equipment, components of blocks and systems.\nIt has been reported that there are relatively few of them, but they should all be completely replaced.\nIt was planned that the element base should not only get rid of Russian components, but also be significantly modernized."
 UKR_develop_t84u_flag: "Completed decision §YResearch T-84U 'Oplot'§!"
 UKR_develop_t84_yatahan_flag: "Completed decision §YResearch T-84-120 'Yatahan'§!"
 UKR_develop_bm_oplot_flag: "Completed decision §YResearch T-84 'BM Oplot'§!"
 UKR_develop_donets_spaa: "Develop §Y'Donets'§!"
 UKR_develop_donets_spaa_desc: "'Donets' is a self-propelled anti-aircraft missile and artillery complex developed by Malyshev Tank Factory in Kharkiv and intended mainly for export deliveries.\n'Donets' is a combination of a modernized turret from the Soviet ZSU-23-4 'Shilka' and a T-80UD/T-84 MBT chassis.\nOn the sides of the turret, on its sides, two paired transport-launch containers with missiles from the 'Strela-10M' air defense system are installed. \nThe missiles, which have an autonomous passive homing system, are capable of hitting aerial targets at a range of up to 4,500 m and at an altitude of 3,500 m."
 UKR_modernize_zsu_23_4m_a1_spaa: "§YZSU-23-4M-A1 'Rokach'§! Modernization"
 UKR_modernize_s125_spaa: "§YS-125-2D§! Modernization"
 UKR_modernize_s125m_spaa: "§YS-125M§! Modernization"
 UKR_modernize_kvadrat_spaa: "§Y2K12M1-2L 'Kvadrat-2L'§! Modernization"
 UKR_develop_t38_stylet_spaa: "Develop §YT-38 'Stylet'§! SPAA Project"
 UKR_modernize_rk10_spaa: "Strela-10 §YRK-10§! Integration"
 UKR_develop_kentavr_spaa: "Develop §YZRAK 'Kentavr'§!"
 UKR_develop_2s22: "Develop §Y2S22§! SP Artillery System"
 UKR_develop_2s22_desc: "\n\n\n\n\n\n£UKR_desctext_2s22_for_tooltip\n\n\n\n\n\n\n\n\nThe 2S22 'Bohdana' is a Ukrainian 155 mm self-propelled howitzer, developed by Kramatorsk Heavy Machine Tool Building Plant to provide the Ukrainian Armed Forces with modern NATO-standard artillery capabilities.\nThe system is mounted on a wheeled chassis, providing high operational mobility and allowing it to rapidly change firing positions after engaging the enemy.\nThe 155 mm gun is capable of employing standard NATO artillery ammunition, significantly increasing the range and firepower available to Ukrainian artillery units.\nIts automated fire-control and navigation systems allow the crew to rapidly determine firing data and engage targets with greater accuracy.\nThe development of the 'Bohdana' represents a major step in the modernization of Ukrainian artillery and the transition toward NATO-standard weapon systems."
 UKR_modernize_planes_category: "Modernize Our Combat Aircrafts"
 UKR_modernize_planes_category_desc: "We can spend time and money researching and testing the upgrades for Soviet era aircrafts and helicopters, that are being used by our Air Force. And when some time will past and we will gain some experience - we may even try to build unique domestic designs."
 UKR_modernize_su25_m1: "Modernize §YSu-25§! strike aircraft"
 UKR_modernize_su27_1m: "Modernize §YSu-27§! fighter aircraft"
 UKR_modernize_mig29_mu2: "Modernize §YMiG-29 variant MU2§! fighter aircraft"
 UKR_modernize_mig29_mu1: "Modernize §YMiG-29 variant MU1§! fighter aircraft"
 UKR_develop_an_lbl: "Develop a Proposed §YAntonov Light Aircraft§!"
 UKR_develop_an_lbl_desc: "The Antonov Light Aircraft is a proposed light aircraft designed by the Antonov Design Bureau that is expected to be close to Yak-130. It is intended for use in various roles, including training and reconnaissance.The aircraft is expected to feature advanced avionics, a lightweight airframe, and efficient engines to provide excellent performance and fuel efficiency."
 UKR_develop_an_bfv: "Develop a Proposed §YAntonov Fighter Aircraft§!"
 ukraine_develop_2s22.1.name: "Develop §Y2S22 'Bohdana'§! SPG"
 ukraine_develop_2s22.1.desc: "As we speak, technology advances further, and our weapons stays the same.\nWe need to develop our own new SPG for our forces"
 ukraine_develop_2s22.1.a: "Provide basic amount of funds"
 ukraine_develop_2s22.1.b: "Provide extensive amount of funds"
 ukraine_develop_2s22.2.name: "KrZVV has developed a project of a new SPG"
 ukraine_develop_2s22.2.desc: "We have checked and are sure now, that KrZVV did create a new SPG project for our military.\nHowever, due to insufficient funds we provided, they were not able to create new barrel and had to use old soviet one instead."
 ukraine_develop_2s22.2.a: "Ok, let's start the production!"
 ukraine_develop_2s22.3.name: "KrZVV has developed a project of a new SPG"
 ukraine_develop_2s22.3.desc: "We have checked and are sure now, that KrZVV did create a new SPG project for our military.\nMoreover, due to additional funds we provided, they developed devery aspect of the SPG from scratch, new and strong!."
 ukraine_develop_2s22.3.a: "Great, let's start the production!"
