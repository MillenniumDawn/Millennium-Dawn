 TOP_vip_assign_label: "Assign / Renew VIP Detail"
 TOP_vip_assign_tt: "Cost: 25 Political Power and $0.25 billion. Duration: 91 days. Applies -3 hostile collection, -10 operation success, and +5 exposure. Capacity starts at two and can rise to four with encryption progression. Renewing replaces the remaining term without a refund."
 TOP_deception_status_label: "Defensive deception expires on day [?TOP_deception_until|0]."
 TOP_deception_label: "Fund Deception"
 TOP_deception_tt: "Cost: 25 Political Power and $0.25 billion. Duration: 91 days. Adds 25 points to the chance that detected location collection reports a wrong controlled state inside the correct host."
 TOP_deception_note_label: "Counterintelligence warnings reveal only escalating foreign interest, a likely service, or a likely actor. They never reveal the exact subject, objective, method, or date."

 TOP_redesign.1.t: "Protective Intelligence Warning"
 TOP_redesign.1.d: "Counterintelligence has detected foreign interest in a protected public figure. The evidence indicates warning tier [?TOP_pressure_notice_tier|0], but it does not reveal the exact foreign package, method, or timing. At the highest tier, analysts may identify a likely actor without creating public attribution."
 TOP_redesign.1.a: "Assign or renew a VIP protection detail."
 TOP_redesign.1.b: "Fund a defensive deception plan."
 TOP_redesign.1.c: "Issue a private warning to the likely actor."
 TOP_redesign.1.e: "Harden routines without a public response."
 TOP_redesign.2.t: "Organization Security Warning"
 TOP_redesign.2.d: "Counterintelligence has detected foreign collection against a public organization or facility network. Security has escalated to tier [?TOP_pressure_notice_tier|0]. The warning does not disclose the objective, method, or operational date."
 TOP_redesign.2.a: "Seed deceptive location reporting."
 TOP_redesign.2.b: "Privately warn the likely actor."
 TOP_redesign.2.c: "Harden facilities and reduce travel."
 TOP_redesign.10.t: "Immediate Field Report"
 TOP_redesign.10.d: "An operation concerning §Y[TOP_report_subject_name]§! in [?TOP_report_state.GetName] has returned an immediate field report: §Y[TOP_report_result_name]§!. Physical truth has been resolved once. A lethal result remains subject to the separate 14-day battle-damage assessment, and attribution investigation may increase by at most one tier."
 TOP_redesign.10.d_organization_success: "The field report for §Y[TOP_report_subject_name]§! in [?TOP_report_state.GetName] confirms the §Y[TOP_report_objective_name]§! operation succeeded. [TOP_report_impact_name] A 90-day organization disruption was recorded. Attribution may still change during the investigation."
 TOP_redesign.10.d_organization_failure: "The field report for §Y[TOP_report_subject_name]§! in [?TOP_report_state.GetName] says the attempted §Y[TOP_report_objective_name]§! operation ended as §Y[TOP_report_result_name]§!. No facility damage or organization disruption was recorded. Attribution may still change during the investigation."
 TOP_redesign.10.a: "Record the report in the operations archive."
 TOP_report_impact_infrastructure: "Infrastructure was damaged."
 TOP_report_impact_arms_factory: "An arms factory was damaged."
 TOP_report_impact_civilian_factory: "A civilian factory was damaged."
 TOP_report_impact_resources: "A 60-day resource disruption was imposed."
 TOP_report_impact_unconfirmed: "No specific facility effect was confirmed."
 TOP_redesign.11.t: "Battle Damage Assessment"
 TOP_redesign.11.d_confirmed: "The 14-day assessment has positively confirmed that §Y[TOP_bda_notice_name]§! was killed. This report reads the operation's already-resolved physical outcome; it does not reroll it."
 TOP_redesign.11.d_inconclusive: "The 14-day assessment could not positively establish the fate of §Y[TOP_bda_notice_name]§!. The operation's physical outcome remains fixed, but the available identity evidence supports only an inconclusive report."
 TOP_redesign.11.a: "Archive the assessment."
 TOP_redesign.20.t: "Targeted Operations Oversight"
 TOP_redesign.20.d: "A credibly attributed political operation, serious civilian harm, a leader capture, or a compromised operation has triggered domestic oversight. The response modifies the same operation record and its attribution investigation rather than creating a parallel result."
 TOP_redesign.20.a: "Disclose the operation and accept scrutiny."
 TOP_redesign.20.b: "Contain the inquiry within government."
 TOP_redesign.20.c: "Suppress disclosure and risk a stronger attribution finding."
 TOP_redesign.20.g: "Order an internal security review."
 TOP_redesign.20.e: "Scapegoat the operational service."
 TOP_redesign.20.f: "Purge officials and suppress the record."
 TOP_redesign.30.t: "Liaison Dossier Request"
 TOP_redesign.30.d: "[?TOP_incoming_liaison_actor.GetName] has requested a one-time dossier snapshot on §Y[TOP_incoming_liaison_subject_name]§!. Sharing transfers three belief axes, location, age, date, and reliability only. It grants no authorization, methods, preparation, custody rights, or hidden source identities."
 TOP_redesign.30.a: "Share a trusted snapshot."
 TOP_redesign.30.b: "Share a mixed-reliability snapshot."
 TOP_redesign.30.c: "Share only suspect reporting."
 TOP_redesign.30.f: "Supply a deceptive location report."
 TOP_redesign.30.e: "Refuse the request."
 TOP_redesign.40.t: "Custody Exploitation Window"
 TOP_redesign.40.d: "[TOP_custody_event_name] is in custody. One exploitation action may be taken within 14 days, once in this person's lifetime. Custody remains available afterward for detention, prosecution, transfer, exchange, or release."
 TOP_redesign.40.a: "Develop two linked target dossiers."
 TOP_redesign.40.b: "Exploit the affiliated organization."
 TOP_redesign.40.c: "Disrupt command and communications."
 TOP_redesign.40.e: "Defer exploitation and manage custody later."
