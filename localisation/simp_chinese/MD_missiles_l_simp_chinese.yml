 satellites.1.t: "卫星系统降级"
 satellites.1.d: "我们损失了太多的卫星，因此我们不得不降低卫星系统的等级。虽然低等级系统的效率更低，但总好过无法使用。"
 satellites.1.a: "好的"
 satellites.2.t: "军用全球卫星导航系统降级"
 satellites.2.d: "我们损失了太多的军用导航卫星，因此我们不得不降低军用卫星导航系统的等级。虽然低等级系统的效率更低，但总好过无法使用。"
 satellites.2.a: "好的"
 satellites.3.t: "民用全球卫星导航系统降级"
 satellites.3.d: "我们损失了太多的民用导航卫星，因此我们不得不降低民用卫星导航系统的等级。虽然低等级系统的效率更低，但总好过无法使用。"
 satellites.3.a: "好的"
 satellites.4.t: "军用卫星通信系统降级"
 satellites.4.d: "我们损失了太多的军用通讯卫星，因此我们不得不降低军用卫星通讯系统的等级。虽然低等级系统的效率更低，但总好过无法使用。"
 satellites.4.a: "好的"
 satellites.5.t: "民用卫星通信系统降级"
 satellites.5.d: "我们损失了太多的民用通讯卫星，因此我们不得不降低民用卫星通讯系统的等级。虽然低等级系统的效率更低，但总好过无法使用。"
 satellites.5.a: "好的"
 satellites.6.t: "军用卫星侦察系统降级"
 satellites.6.d: "我们损失了太多的军用侦查卫星，因此我们不得不降低军用卫星侦查系统的等级。虽然低等级系统的效率更低，但总好过无法使用。"
 satellites.6.a: "好的"
 satellites.7.t: "民用卫星侦察系统降级"
 satellites.7.d: "我们损失了太多的民用侦查卫星，因此我们不得不降低民用卫星侦查系统的等级。虽然低等级系统的效率更低，但总好过无法使用。"
 satellites.7.a: "好的"
 satellites.8.t: "已达到卫星数量限制"
 satellites.8.d: "由于轨道上的卫星太多了，现在不能再发射了。上限为3000。"
 satellites.8.a: "好的"
