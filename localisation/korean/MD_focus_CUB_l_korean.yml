 CUB_buy_healthcare_desc: "의약품을 공식적으로 구매할 수 없으므로 친구들에게 도움을 청할 수 있습니다"
 CUB_attract_eastern_inv: "동방 투자자 유치"
 CUB_attract_eastern_inv_desc: "동방의 투자자들은 우리 경제가 절실히 필요로 하는 막대한 자금을 쿠바 시장에 유입시킬 것입니다"
 CUB_meeting_of_USA: "미국 대통령과의 회담 추진"
 CUB_normalisation_with_USA: "미국과의 관계 정상화 시작"
 CUB_diplomacy_with_USA: "미국에 대사관 개설"
 CUB_open_bank_and_trade_with_USA: "미국 내 은행 계좌 개설"
 CUB_open_bank_and_trade_with_USA_desc: "미국에 쿠바 은행이 문을 여는 것도 양국 관계가 개선되고 있다는 훌륭한 신호입니다"
 CUB_negotations_with_USA: "봉쇄 해제 협상"
 CUB_open_borders_inv: "국경 개방"
 CUB_open_borders_inv_desc: "봉쇄로 인한 자금 부족 때문에 우리는 일시적으로 관광객에게 국경을 개방할 수 있습니다. 그러나 이를 너무 오래 유지하면 외국의 영향력이 우리 섬에 스며들 수 있습니다."
 CUB_propoganda_of_time: "임시 조치 선전"
 CUB_propoganda_of_time_desc: "이 모든 것이 일시적인 일이라고 국민에게 알리면 사기에 미치는 충격이 줄어들 것입니다."
 CUB_ask_for_chinese_money: "중국의 도움 요청"
 CUB_buy_cars_black_market: "암시장을 통한 자동차 구매"
 CUB_border_measures_inv: "세관 통제 완화"
 CUB_border_measures_inv_desc: "우리 처지에서는 눈감아 줄 만한 일입니다."
