 ENG_migrants_welcomed_TT: "En assouplissant les §Hlois migratoires§! nous :\n - Verrons de nouvelles usines apparaître dans des États aléatoires sur une période de 5 ans\n - Verrons des hausses d'instabilité à mesure que le sentiment antimigrant s'élève"
 ENG_shatter_two_party_system_TT: "En réformant le §Hsystème bipartisan§! nous :\n - Permettrons à davantage de partis d'accéder au pouvoir au Parlement\n - Augmenterons les chances d'autres partis de gagner le pouvoir"
