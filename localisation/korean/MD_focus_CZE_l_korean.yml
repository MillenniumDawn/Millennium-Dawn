 CZE_SLO_more_strength_and_opinion: "§Y주 관리자는 §R군대가 더 강하면 수락할 가능성이 낮아지지만§!, 체코슬로바키아와의 §G관계가 좋을수록 더 설득됩니다.§!§! "
