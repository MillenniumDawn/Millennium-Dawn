 israel_arab_boycott_category_desc: "\n\n\n\n\n\n£ISR_desctext_blockade\n\n\n\n\n\n\n\n\n§YApós§! a §tGuerra dos Seis Dias§!, muitas §7nações do Oriente Médio§!, manifestando solidariedade com a [PAL.GetFlag]Palestina e entre si, iniciaram um §Obloqueio econômico e diplomático§! a [ISR.GetFlag]Israel. Na §Csituação§! atual, esses sentimentos ainda §Rexistem§!, mas os contatos entre os dois lados podem mudar o rumo.\n\n[saud_bloc_loc]\n[kuw_bloc_loc]\n[irq_bloc_loc]\n[per_bloc_loc]\n[leb_bloc_loc]\n[syr_bloc_loc]\n[yem_bloc_loc]\n[lba_bloc_loc]\n[agl_bloc_loc]\n[sha_bloc_loc]\n[sud_bloc_loc]\n[uae_bloc_loc]\n[qat_bloc_loc]\n[tun_bloc_loc]\n[bhr_bloc_loc]\n[mor_bloc_loc]\n[oma_bloc_loc]\n[mau_bloc_loc]\n[egy_bloc_loc]\n[jor_bloc_loc]"
