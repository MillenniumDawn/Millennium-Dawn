 UKR_storage_item_9p148_tt: "§Y9P148 콘쿠르스§!\n\n\n£SOV_LAND_HAT2\n\n\n\n보관 중: §Y[?ukraine_has_9p148_stockpile|0]§!\n세대: 1974년부터 운용된 2세대 대전차 미사일 시스템.\n장비 유형: §Y차량 탑재 대전차 유도 미사일§!\n\n보관 중인 파생형:\n• 9P148 콘쿠르스: §Y[?ukraine_has_9p148_stockpile|0]§!\n\n§YBRDM-2§! 차체에 반자동 §Y콘쿠르스§! 미사일을 얹은 구축전차입니다. 우리 사단은 대신 §Y9P149 슈투름-S§!를 쓰며, §Y루치 설계국§!은 이 차량을 §Y바리에르-V§! 발사기로 개수할 수 있습니다."
