 raj_chi_border_progress_change_tt: "§YХод рассмотрения заявки§! в сторону оспариваемого государства: [?border_war_progress_change|+=0]"
 border_war_claim_progress_cost_tt: "§YПрогресс обработки заявки§!: $RIGHT|+=0$"
 pak_raj_border_attack_outcome_tt: "Через §Y10§! дней начинается пограничная война за оспариваемое государство. Победа добавляет §Y20 к прогрессу по завоеванию §!, поражение стоит §Y10§!, а тупиковая ситуация стоит §Y5§!.\nЕсли право собственности, контроль или присутствие войск меняются первыми, операция отменяется без каких-либо затрат."
 raj_chi_border_attack_outcome_tt: "Через §Y10§! дней начинается пограничная война за оспариваемое государство. Победа добавляет §Y20 к прогрессу по завоеванию §!, поражение стоит §Y10§!, а тупиковая ситуация стоит §Y5§!.\nЕсли право собственности, контроль или присутствие войск меняются первыми, операция отменяется без каких-либо затрат."
 border_war_frontier_exercise: "Учения на границе"
 border_war_frontier_exercise_desc: "Длительные маневры на границе истощают силы дислоцированных здесь подразделений."
 border_war_frontier_operation: "Операция на границе"
 border_war_frontier_operation_desc: "Активные боевые действия вдоль границы истощают силы дислоцированных здесь подразделений."
 border_war_state_garrison_tt: "Мы контролируем назначенный нам пограничный сектор и разместили там как минимум §Y5§! дивизий."
 border_war_state_patrol_tt: "Мы контролируем назначенный нам пограничный сектор и разместили там как минимум §Y3§! дивизий."
 border_war_state_mechanized_tt: "Мы контролируем назначенный нам приграничный сектор и имеем там как минимум §Y3§! дивизий с механизированной или моторизованной пехотой."
 border_war_state_artillery_tt: "Мы контролируем назначенный нам приграничный сектор и имеем там как минимум §Y3§! дивизий с артиллерией или реактивной артиллерией."
 border_war_operation_blocked.2.t: "Подготовка прекращена"
 border_war_operation_blocked.2.d: "Гарнизон, предназначенный для этой операции, покинул границу до завершения подготовки. Учения были отменены, и соперник воспользовался этим моментом, чтобы перехватить инициативу."
 border_war_operation_blocked.2.a: "Дорогостоящая ошибка"
 border_war_mobilization_idea: "Всеобщая мобилизация"
 border_war_mobilization_idea_desc: "Вооруженные силы перешли в кризисное состояние на спорной границе."
 pak_raj_border_train_army: "Провести армейские учения в [From.GetName]"
 pak_raj_border_train_army_desc: "Проведите пятнадцатидневные учения с дивизиями, дислоцированными в [From.GetName], нашем назначенном пограничном секторе. Стоимость: 20 очков командования. Подразделения, находящиеся в зоне учений, несут потери в течение всего периода. Боеготовность увеличивается на 3. Вывод гарнизона до истечения пятнадцати дней передаёт те же 3 очка боеготовности нашему сопернику.\n\nПосле окончания учений армия назначает новый пограничный сектор."
 pak_raj_border_train_mechanized: "Проведение механизированных учений в [From.GetName]"
 pak_raj_border_train_mechanized_desc: "Проведите пятнадцатидневные механизированные учения с участием механизированных и моторизованных дивизий, дислоцированных в [From.GetName], нашем назначенном пограничном секторе. Стоимость: 20 очков командной силы. Подразделения, участвующие в учениях, будут подвергаться потерям в течение всего периода. Боеготовность повышается на 8, с риском несчастного случая. Вывод подразделений до истечения пятнадцати дней возвращает те же 8 очков боеготовности нашему сопернику.\n\nПосле окончания учений армия назначает новый пограничный сектор."
 pak_raj_border_train_artillery: "Проведение артиллерийских учений в [From.GetName]"
 pak_raj_border_train_artillery_desc: "Проведите пятнадцатидневные артиллерийские учения с артиллерией и реактивной артиллерией, размещенными в [From.GetName], нашем назначенном пограничном секторе. Стоимость: 20 очков командования. Подразделения, находящиеся на передовой, будут подвергаться потерям в течение всего периода учений. Боеготовность повышается на 5. Если подразделения будут выведены из строя до истечения пятнадцати дней, то те же 5 очков боеготовности перейдут к нашему противнику.\n\nПосле окончания учений армия назначает новый пограничный сектор."
 pak_raj_border_stage_incursion: "Организуйте пограничное вторжение с [From.GetName]"
 pak_raj_border_stage_incursion_desc: "Отправьте патруль через линию фронта из сектора [From.GetName], назначенного вам пограничного участка. Стоимость: 20 очков командной силы. Подразделения, находящиеся на передовой, будут подвергаться потерям в течение всего времени. Увеличивает двустороннюю напряженность на 15 и несет риск потерь. Отзыв патруля до истечения пятнадцати дней передает 3 очка боеготовности нашему сопернику.\n\nПосле возвращения патруля армия назначает новый пограничный участок."
 pak_raj_border_shell_positions: "Позиции границ оболочки от [From.GetName]"
 pak_raj_border_shell_positions_desc: "Обстрел позиций напротив [From.GetName], нашего назначенного пограничного сектора, с использованием размещенной там артиллерии и реактивной артиллерии. Стоимость: 20 очков командования. Размещенные подразделения будут подвергаться истощению в течение всего периода обстрела. Увеличивает двустороннюю напряженность на 22, создает дополнительную напряженность в мире и несет риск ответных действий. Вывод орудий до истечения пятнадцати дней передает 5 очков готовности нашему сопернику.\n\nПосле окончания обстрела армия назначает новый пограничный сектор."
 pak_raj_border_negotiate: "Открыть индо-пакистанские переговоры"
 pak_raj_border_negotiate_desc: "Используйте взаимную добрую волю для снижения двусторонней напряженности на 25%. Мирное урегулирование кризиса, основанное на прочном взаимном доверии, может навсегда урегулировать ситуацию на границе."
 pak_raj_border_negotiate_tt: "§GИндо-пакистанская двусторонняя напряженность снижается на 25§!"
 pak_raj_border_settlement_tt: "§GИндия и Пакистан заключают долгосрочное соглашение об урегулировании пограничного вопроса.§!"
 pak_raj_border_issue_ultimatum: "Выдвинуть территориальный ультиматум"
 pak_raj_border_issue_ultimatum_desc: "Требуйте именно того государства, которое поддерживается нашими местными силами. Отказ позволит вам поставить перед этим государством ограниченную военную цель."
 pak_raj_border_ultimatum_tt: "Соперник может вернуть спорное государство или отклонить требование и рискнуть начать ограниченную войну."
 pak_raj_border_tension_90_required_tt: "Напряженность в двусторонних отношениях между Индией и Пакистаном составляет не менее 90%."
 pak_raj_border_stand_down: "Отступите от кризиса"
 pak_raj_border_stand_down_desc: "Прекратите кризис, снизьте двустороннюю напряженность на 30 и смиритесь с потерей поддержки войны."
 pak_raj_border_stand_down_tt: "§GE Завершает кризис и снижает двустороннюю напряженность между Индией и Пакистаном на 30§!"
 pak_raj_border_reject_ultimatum_tt: "§RЭмитент может установить ограниченную военную цель для спорного государства§!"
 pak_raj_border_mediation_offer_tt: "Решение о том, принимать ли американское посредничество, будет принято на этапе эскалации кризиса."
 raj_chi_border_train_army: "Провести армейские учения в [From.GetName]"
 raj_chi_border_train_army_desc: "Проведите пятнадцатидневные высокогорные учения с дивизиями, дислоцированными в [From.GetName], нашем назначенном пограничном секторе. Стоимость: 20 очков командования. Подразделения, находящиеся в зоне учений, несут потери в течение всего периода. Боеготовность увеличивается на 3. Вывод гарнизона до истечения пятнадцати дней передаёт те же 3 очка боеготовности нашему сопернику.\n\nПосле окончания учений армия назначает новый пограничный сектор."
 raj_chi_border_train_mechanized: "Проведение механизированных учений в [From.GetName]"
 raj_chi_border_train_mechanized_desc: "Проведите пятнадцатидневные высотные механизированные учения с участием механизированных и моторизованных дивизий, дислоцированных в [From.GetName], нашем назначенном пограничном секторе. Стоимость: 20 очков командной силы. Подразделения, находящиеся на передовой, несут потери в течение всего периода учений. Боеготовность повышается на 8, с риском несчастного случая. Вывод подразделений до истечения пятнадцати дней возвращает те же 8 очков боеготовности нашему сопернику.\n\nПосле окончания учений армия назначает новый пограничный сектор."
