l_french:
 switzerland_focus: "Priorités nationales suisses"
 SWI_the_mountain_fortress: "La Forteresse des Alpes"
 SWI_the_mountain_fortress_desc: "Notre défense la plus efficace est constituée par nos montagnes. Nous devons les construire si nous voulons maintenir l'avantage défensif."
 SWI_guns_for_the_population: "Des armes pour la population"
 SWI_guns_for_the_population_desc: "Une nation qui est assaillie de toutes parts par des nations plus fortes doit avoir une population qui est toujours prête à protéger ses foyers."
 SWI_zurich_industrial_project: "Projet industriel de Zürich"
 SWI_zurich_industrial_project_desc: "Si nous voulons être compétitifs avec nos voisins, nous devons disposer d’un secteur industriel robuste."
 SWI_strengthen_the_secret_services: "Renforcer les services secrets"
 SWI_strengthen_the_secret_services_desc: "Les services secrets peuvent faire beaucoup pour découvrir les menaces à l'extérieur et à l'intérieur de notre nation."
 SWI_military_investments_1: "Investissements militaires I"
 SWI_military_investments_1_desc: "Nous sommes peut-être une petite nation, mais seule une nation prête à se coucher et à mourir négligerait son industrie militaire."
 SWI_geneva_industrial_project: "Projet industriel de Genève"
 SWI_geneva_industrial_project_desc: "Genevea pourrait toujours avoir besoin de plus d'emplois dans les usines. Nous devrions réformer complètement la région."
 SWI_secure_the_swiss_borders: "Sécuriser les frontières suisses"
 SWI_secure_the_swiss_borders_desc: "Nous commencerons à mettre en place de vastes réseaux de patrouilles frontalières et de points de contrôle pour nous assurer que personne ne peut entrer ou sortir sans que nous le sachions."
 SWI_italian_forts: "Forts italiens"
 SWI_italian_forts_desc: "Nous devons toujours être prêts pour une attaque de nos voisins du Sud."
 SWI_german_forts: "Forts allemands"
 SWI_german_forts_desc: "Nous avons frôlé la guerre avec l'Allemagne pendant la Seconde Guerre mondiale. Nous ne pouvons pas nous permettre d'être pris au dépourvu si l'agression allemande se manifeste à nouveau."
 SWI_french_forts: "Forts français"
 SWI_french_forts_desc: "Ce n'est pas comme si la France ne nous avait pas envahis auparavant. Nous ne pouvons pas nous permettre d'être submergés comme nous l'avons fait des siècles auparavant. Nous serons prêts, juste au cas où."
 SWI_military_investments_2: "Investissements militaires II"
 SWI_military_investments_2_desc: "Nos projets industriels passés ont été couronnés de succès. Nous devrions persévérer dans le développement militaire."
 SWI_the_cern_project: "Projet CERN"
 SWI_the_cern_project_desc: "La recherche nucléaire est la voie de l'avenir. Nous devrions commencer des études approfondies dans ce domaine."
 SWI_the_large_hadron_collider: "Le Grand collisionneur de hadrons"
 SWI_the_large_hadron_collider_desc: "Pour mieux étudier et faire avancer nos projets au CERN, nous allons commencer la construction de l'accélérateur de particules le plus puissant et le plus robuste que le monde ait jamais connu."
 SWI_construct_power_plants: "Construire des centrales électriques"
 SWI_construct_power_plants_desc: "Avec les nouvelles connaissances que nous avons acquises grâce à nos recherches, nous pouvons commencer à mettre en place des formes d'énergie plus efficaces."
 switzerland.2.t: "La fin du système politique suisse"
 switzerland.2.d: "La démocratie en Suisse, autrefois considérée comme un modèle et une source d'inspiration pour tous ceux qui souhaitaient une participation plus populaire au gouvernement en raison des possibilités offertes aux citoyens suisses, n'est plus.\n\nLe dirigeant suisse [SWI.GetLeader] a annoncé que ces « distractions de la vie publique » et ces « référendums inutiles » cesseraient d'avoir lieu."
 switzerland.2.o1: "Bon débarras."
 switzerland.2.o2: "Quelle honte."
 switzerland.2.o3: "Peu importe."
 switzerland_news.1.t: "La Suisse rejoint l'ONU"
 switzerland_news.1.d: "À l'origine, le gouvernement suisse avait refusé de rejoindre les Nations Unies après la fin de la Seconde Guerre mondiale, invoquant le dévouement continu du pays à sa propre neutralité - ce qui est particulièrement étrange étant donné que le siège principal de l'ONU en Europe est l'ONUG, l'Office des Nations Unies à Genève.\n\nAujourd'hui, après un référendum public sur la question, le gouvernement suisse a annoncé que le pays allait abandonner son poste de spectateur et allait désormais rejoindre l'organisation en tant que membre à part entière."
 switzerland_news.1.o1: "Il était temps, chers Suisses !"
 switzerland_news.1.o3: "C'est vraiment si important que ça ?"
 SWI_join_un: "Nouveau membre de l'ONU"
 swiss_political_system: "Système Politique de la Suisse"
 swiss_political_system_desc: "Switzerland has a very unique political system and is the only country in the world that can rightfully call itself a 'semi-direct democracy'. Citizens can change the constitution per referendum, can veto laws per referendum, can even pass laws per referendum.\nThis has implications for politicians however: Because the people make the policies either way, the Swiss coalition system has to include as many forces as possible. The four big parties of Switzerland, SVP, FDP, CVP and SP, are constantly in government together - this makes national elections in Switzerland more or less useless - as the people rule not through their representatives, but through referendums.\n\nThe arrangement only holds while Switzerland answers to itself and the Federal Council stays in the hands of the democratic parties, the neutral bloc or the national populists. Fall under a foreign master, or hand government to anyone outside those, and the consensus that makes it work is gone."
 SWI_swiss_neutrality_desc: "§YRègles spéciales :§!\n\n§YNous§! §RNE POUVONS PAS§! §Ydéclarer la guerre à d'autres pays !§!\n--------------\nLes Suisses sont connus dans le monde entier pour leur neutralité. Depuis sa fondation en tant que république, le pays n'a engagé aucun conflit offensif et est resté neutre durant les deux guerres mondiales.\n--------------\nCet esprit national peut être §Rretiré§! en achevant le focus §HChangements radicaux§! ou §HOuverture§!."
 SWI_Expanding_nuclear_research: "Expansion de la Recherche Nucléaire"
 SWI_expand_swiss_nuclear_plants: "Expansion de la flotte nucléaire"
 SWI_expand_swiss_nuclear_plants_desc: "Beznau, Gösgen et Leibstadt couvrent encore la demande intérieure, mais la marge s'amincit. Étendre la capacité des réacteurs maintenant garantirait l'indépendance énergétique suisse pour une génération."
 SWI_research_and_development: "Armasuisse Science et Technologie"
 SWI_research_and_development_desc: "Armasuisse S+T est le centre technologique du Département de la défense, réunissant capteurs, communications, cybersécurité et recherche sur les matériaux. En maintenant une base technologique pertinente pour la sécurité au pays, la Suisse minimise sa dépendance aux fournisseurs étrangers en cas de crise."
 SWI_asd_gruppe: "Programme de recherche du domaine ETH"
 SWI_asd_gruppe_desc: "Lier armasuisse au domaine des EPF, l'ETH Zurich et l'EPFL, sous un Programme de recherche Sécurité conjoint. Francs fédéraux et talents académiques sont mis en commun pour transformer la recherche de pointe en capacité de défense déployée."
 SWI_small_arms_development: "Développement des armes d'infanterie"
 SWI_small_arms_development_desc: "Moderniser le successeur du fusil d'ordonnance Stgw 90 (SG 550) et ses optiques, en s'appuyant sur l'expertise de SIG et B&T. Une armée de milice vit ou meurt de la fiabilité de l'arme dans les mains de chaque citoyen-soldat."
 SWI_sig_ag_research_teams: "Équipes de recherche de Swiss Arms"
 SWI_sig_ag_research_teams_desc: "Mettre sur pied des équipes de conception dédiées dans la lignée des armes légères SIG à Neuhausen. Des décennies de fabrication de précision suisse sont dirigées vers la prochaine génération d'armes individuelles et d'escouade."
 SWI_precision_launch_platforms: "Systèmes antichar guidés"
 SWI_precision_launch_platforms_desc: "Développer des systèmes antichars guidés portables pour donner aux grenadiers débarqués une frappe décisive contre les blindés dans le terrain resserré de l'avant-pays alpin."
 SWI_support_platforms_research: "Systèmes de commande intégrés"
 SWI_support_platforms_research_desc: "Faire progresser le réseau de gestion du combat FIS Heer afin que les commandants partagent une image tactique commune en temps réel. Le commandement, le contrôle et les communications suisses tissent la milice dispersée en une seule force."
 SWI_mass_produced_firearms: "Production de munitions et d'armes légères"
 SWI_mass_produced_firearms_desc: "Accroître la production nationale de munitions et d'armes légères via SwissP Defence (anciennement RUAG Ammotec). Des stocks nationaux garantis maintiennent la milice armée sans dépendance aux importations."
 SWI_armored_vehicles_study: "Programme de véhicules blindés"
 SWI_armored_vehicles_study_desc: "Coordonner l'industrie suisse des véhicules blindés autour des familles GDELS-Mowag Piranha et Eagle, l'épine dorsale à roues des brigades mécanisées."
 SWI_airframes_study: "Programme aéronautique"
 SWI_airframes_study_desc: "Consolider l'expertise aéronautique suisse entre Pilatus à Stans et RUAG Aviation à Emmen, des cellules d'entraînement à la maintenance et aux structures d'avions de combat."
 SWI_mbt_concept: "Modernisation du Leopard 2"
 SWI_mbt_concept_desc: "Moderniser la flotte de Pz 87 Leopard 2 avec des kits de conduite de tir, de protection et de mobilité menés par RUAG pour garder le char de bataille pertinent dans les décennies à venir."
 SWI_spart_systems: "Artillerie automotrice"
 SWI_spart_systems_desc: "Étendre la portée et la précision de l'obusier automoteur M109 (Pz Hb) via le programme de modernisation KAWEST, pour des feux réactifs en terrain montagneux."
 SWI_spaa_systems: "Défense aérienne mobile"
 SWI_spaa_systems_desc: "Mettre en service un véhicule mobile de défense aérienne à courte portée bâti sur le système Rheinmetall Air Defence Skyranger 35 mm, protégeant les forces de manœuvre contre avions et drones."
 SWI_production_line_innovations: "Lignes de production automatisées"
 SWI_production_line_innovations_desc: "Rééquiper les halls d'assemblage de RUAG et Mowag avec une automatisation moderne, augmentant la production et libérant la main-d'œuvre qualifiée rare pour des travaux à plus haute valeur."
 SWI_import_missile_tech: "Intégration des missiles guidés"
 SWI_import_missile_tech_desc: "Acquérir et intégrer des missiles air-air et sol-air modernes, en constituant le savoir-faire national pour les soutenir et les adapter sur des plateformes suisses."
 SWI_helicopter_research: "Programme d'aéronefs à voilure tournante"
 SWI_helicopter_research_desc: "Soutenir et moderniser les flottes Super Puma / Cougar et EC635 via RUAG Aviation, chevaux de trait du transport, de la liaison et du sauvetage en montagne suisses."
 SWI_air_cavalry_armament: "Armement de cavalerie aérienne"
 SWI_air_cavalry_armament_desc: "Armer la flotte Super Puma et rédiger la doctrine aéromobile qui va avec, transformant les escadrons de transport en une arme de manœuvre que la milice peut appeler."
 SWI_gunship_development: "Développement de canonnières"
 SWI_gunship_development_desc: "Mettre en service des variantes d'ailes rotatives armées pour l'appui rapproché et la reconnaissance armée, moins chères à acheter et à entretenir qu'une flotte d'hélicoptères d'attaque dédiée."
 SWI_revise_isolation_strategy: "Au-delà du Réduit"
 SWI_revise_isolation_strategy_desc: "Passer du Réduit alpin statique à une défense de zone dynamique moderne, en adaptant les réformes du Développement ultérieur de l'armée (WEA) à un tableau de menaces changé."
 SWI_log_tunnel_network: "Dépôts du tunnel alpin"
 SWI_log_tunnel_network_desc: "Exploiter le réseau caché de dépôts en caverne et de tunnels forés dans les montagnes, stockant munitions et carburant hors de portée de toute frappe aérienne."
 SWI_domestic_res_output: "Approvisionnement économique national"
 SWI_domestic_res_output_desc: "Renforcer l'approvisionnement économique du pays (wirtschaftliche Landesversorgung), le cadre légal qui maintient l'énergie, l'alimentation et les biens critiques en circulation en cas d'urgence."
 SWI_strat_supply_reserves: "Réserves stratégiques obligatoires"
 SWI_strat_supply_reserves_desc: "Faire appliquer le système des Pflichtlager de stocks obligatoires, conservant des mois de carburant, de nourriture et de médicaments en réserve contre un blocus ou une crise."
 SWI_environmental_adaptation: "Doctrine de guerre alpine"
 SWI_environmental_adaptation_desc: "Entraîner et équiper des formations de montagne spécialisées pour combattre et survivre en conditions hivernales d'altitude, transformant le terrain lui-même en arme."
 SWI_repair_decaying_forts: "Remettre en service les forts alpins"
 SWI_repair_decaying_forts_desc: "Réactiver certains forts d'artillerie et positions durcies déclassés sous les réformes Armée 95 et Armée XXI, restaurant de la profondeur aux défenses de montagne."
 SWI_graubunden_gold_silver: "Extraction de minéraux alpins"
 SWI_graubunden_gold_silver_desc: "Rouvrir des exploitations minières dormantes dans les Alpes des Grisons pour assurer un filet national de matériaux stratégiques à l'industrie d'armement."
 SWI_graubunden_iron_mines: "Extraction de minerai alpin"
 SWI_graubunden_iron_mines_desc: "Exploiter le minerai de fer alpin pour alimenter une petite sidérurgie nationale et réduire la dépendance aux matières premières importées pour la production de guerre."
 SWI_mil_industry_expansion: "Étendre la base industrielle de défense"
 SWI_mil_industry_expansion_desc: "Développer la base industrielle pertinente pour la sécurité que la loi sur le matériel de guerre oblige la Suisse à maintenir. Une nation neutre doit pouvoir s'armer et se soutenir quand les lignes d'approvisionnement étrangères se ferment."
 SWI_sig_neuhausen_factory: "Usines SIG à Neuhausen"
 SWI_sig_neuhausen_factory_desc: "Étendre les historiques usines SIG à Neuhausen am Rheinfall, cœur de la fabrication suisse d'armes légères depuis le XIXe siècle."
 SWI_sig_graubunden_factory: "Production d’armes dispersée"
 SWI_sig_graubunden_factory_desc: "Disperser la production d'armes légères et de munitions dans les vallées des Grisons, durcissant la base industrielle contre une frappe décapitatrice, conformément à la doctrine suisse de dispersion."
 SWI_infrastructural_advancement: "Infrastructures industrielles"
 SWI_infrastructural_advancement_desc: "Moderniser les liaisons ferroviaires et routières alimentant les usines d'armement afin que matières premières et équipements finis circulent de façon fiable même sous la contrainte de guerre."
 SWI_expand_gdels_mowag: "Agrandir GDELS-Mowag Kreuzlingen"
 SWI_expand_gdels_mowag_desc: "Agrandir l'usine GDELS-Mowag à Kreuzlingen, berceau des véhicules blindés Piranha et Eagle servant l'armée suisse comme les clients à l'export."
 SWI_new_factory_ruag: "Nouvelle installation RUAG"
 SWI_new_factory_ruag_desc: "Ouvrir de nouvelles capacités RUAG MRO Switzerland pour la révision des aéronefs et des systèmes terrestres. La politique nationale réserve la grande majorité de la maintenance militaire suisse à RUAG."
 SWI_cooperation_with_rheinmetall: "Coopération avec Rheinmetall"
 SWI_cooperation_with_rheinmetall_desc: "Approfondir les liens avec Rheinmetall Air Defence AG à Zurich, héritière d'Oerlikon Contraves et de son canon de 35 mm, de Skyguard et de l'héritage de défense aérienne Skyshield."
 SWI_cooperation_with_thales: "Coopération avec Thales"
 SWI_cooperation_with_thales_desc: "S'associer à Thales Suisse pour les radars, l'optronique et les systèmes de commandement et de contrôle, branchant les forces suisses sur des capteurs et un réseautage éprouvés."
 SWI_general_staff: "État-major des forces armées"
 SWI_general_staff_desc: "Consolider la planification et la doctrine sous l'état-major des forces armées (Führungsstab der Armee) sous le chef de l'armée, donnant à la milice un commandement interarmées moderne."
 SWI_gemeinsames_ok: "Kommando Spezialkräfte"
 SWI_gemeinsames_ok_desc: "Développer le Commandement des forces spéciales, son Détachement de reconnaissance de l'armée 10 et ses formations de grenadiers, en une pointe de lance petite mais d'élite pour l'armée de milice."
 SWI_ausbildungskommando: "Kommando Ausbildung"
 SWI_ausbildungskommando_desc: "Réformer le Commandement de l'instruction qui gère les écoles de recrues et les cours de répétition. La force du système suisse est toute une population passant par un entraînement discipliné et standardisé."
 SWI_airforce_modernization: "Le programme Air2030"
 SWI_airforce_modernization_desc: "Lancer Air2030, le plus grand achat d'armement de l'histoire suisse moderne, pour remplacer les F-5 Tiger et F/A-18 Hornet vieillissants et reconstruire la défense aérienne sol-air pour une génération."
 SWI_general_air_defense: "Évaluation d’un nouvel avion de chasse"
 SWI_general_air_defense_desc: "Ouvrir l'évaluation du Nouvel avion de combat (NKF), faisant voler les candidats retenus à Payerne et les mesurant aux exigences de la police d'un espace aérien suisse dense et montagneux."
 SWI_import_eurofighters: "Candidature à l'Eurofighter Typhoon"
 SWI_import_eurofighters_desc: "Évaluer l'Eurofighter Typhoon d'Airbus et BAE, chasseur de supériorité aérienne européen éprouvé, offert avec un important paquet de participation industrielle."
 SWI_import_rafale_fighters: "Offre Dassault Rafale"
 SWI_import_rafale_fighters_desc: "Évaluer le Rafale de Dassault, chasseur omnirôle polyvalent français, pesant ses avantages de souveraineté et ses offres de compensation face au reste du peloton."
 SWI_german_manufacturing: "Contreparties industrielles allemandes"
 SWI_german_manufacturing_desc: "Négocier le transfert de technologie et les compensations avec le consortium Eurofighter mené par l'Allemagne, réinjectant les francs d'acquisition dans l'industrie suisse."
 SWI_french_manufacturing: "Contreparties industrielles françaises"
 SWI_french_manufacturing_desc: "Négocier des compensations et une participation industrielle avec Dassault et Thales, garantissant une part de travail suisse en échange de l'achat d'appareils."
 SWI_interception_practices: "Sélectionner le F-35A Lightning II"
 SWI_interception_practices_desc: "Retenir le Lockheed Martin F-35A, dont la fusion de capteurs et la furtivité ont dominé l'évaluation. La conscience situationnelle de cinquième génération transforme l'interception suisse et l'alerte de réaction rapide."
 SWI_multi_role_specialization: "Intégration multirôle"
 SWI_multi_role_specialization_desc: "Intégrer le F-35A aux rôles de défense aérienne et de frappe, l'armant de missiles AIM-120 et AIM-9X et de munitions de précision pour une flotte unique et flexible."
 SWI_air_sup_adaptation: "Police aérienne 24 heures sur 24"
 SWI_air_sup_adaptation_desc: "Mettre en place une alerte de réaction rapide 24/7 au-dessus de l'espace aérien suisse, une capacité que les Forces aériennes ont atteinte en 2020 et qu'elles soutiennent désormais avec la nouvelle flotte de chasseurs."
 SWI_acquire_transport_planes: "Transport aérien tactique"
 SWI_acquire_transport_planes_desc: "Étendre la capacité de transport aérien autour de la flotte Super Puma et Cougar et d'aéronefs légers à voilure fixe, déplaçant troupes et aides à travers le pays et à l'étranger."
 SWI_airbase_expansion: "Modernisation des bases aériennes"
 SWI_airbase_expansion_desc: "Moderniser les bases principales de Payerne, Meiringen et Emmen, y compris les abris en caverne de montagne qui permettent aux jets de tenir une attaque sous terre."
 SWI_nasams_batteries: "Défense aérienne terrestre Patriot"
 SWI_nasams_batteries_desc: "Acquérir des systèmes sol-air longue portée Patriot dans le cadre d'Air2030, donnant à la Suisse sa première véritable défense contre les menaces à haute altitude et à distance de sécurité."
 SWI_florako: "Surveillance aérienne FLORAKO"
 SWI_florako_desc: "Exploiter le système FLORAKO, le réseau intégré de radars et de commandement qui surveille l'espace aérien suisse en permanence et oriente chasseurs comme défense aérienne sol-air."
 SWI_Grune_idea: "Vert Suisse"
 SWI_Grune_idea_desc: "Pour une Suisse plus propre, plus juste et plus libre — où les gens et la planète passent avant le profit !"
 SWI_universal_education_bonus_desc: "L'investissement de la Suisse dans une éducation moderne a alimenté la recherche en énergie renouvelable et en technologie durable, ouvrant la voie à un avenir plus propre."
 SWI_environmental_reforms: "Réformes environnementales"
 SWI_environmental_reforms_desc: "Des lois environnementales complètes visent à réduire les émissions, protéger les ressources naturelles et faire basculer l'économie vers la durabilité."
 SWI_limit_industry: "Développement industriel limité"
 SWI_limit_industry_desc: "L'expansion industrielle est limitée pour protéger l'environnement suisse : on échange une croissance rapide contre une stabilité écologique de long terme."
 SWI_eco_tourism: "Écotourisme"
 SWI_eco_tourism_desc: "Promouvoir un tourisme respectueux de l'environnement redonne vie aux zones rurales tout en préservant les paysages immaculés de la Suisse."
 SWI_national_parks: "Parcs nationaux"
 SWI_national_parks_desc: "L'extension des zones protégées sauvegarde la faune et renforce l'image mondiale de la Suisse comme leader environnemental."
 SWI_completely_green: "Complètement vert !"
 SWI_completely_green_desc: "Par une réforme et une innovation incessantes, la Suisse atteint une pleine durabilité écologique, une nation entièrement alimentée par une énergie propre."
 SWI_christian_values: "Valeurs chrétiennes"
 SWI_christian_values_desc: "Les principes chrétiens traditionnels guident la politique sociale et renforcent le fondement moral de la société suisse."
 SWI_banned_abortion: "Avortement interdit"
 SWI_banned_abortion_desc: "Des lois strictes interdisent l'avortement, reflétant un engagement national renouvelé en faveur d'une éthique sociale conservatrice."
 SWI_ndb: "NDB suisse"
 SWI_ndb_desc: "Le SRC suisse renforce les opérations de renseignement, protégeant la sécurité nationale et préservant la neutralité dans un monde instable."
 SWI_traditionalist: "Traditionalisme"
 SWI_traditionalist_desc: "La pensée traditionaliste façonne la politique, privilégiant la foi, la famille et le patrimoine national aux tendances sociales modernes."
 SWI_army_fund: "Financement de l'armée"
 SWI_army_fund_desc: "L'augmentation des dépenses de défense renforce la préparation de l'armée suisse et modernise ses infrastructures."
 SWI_ngo_funding: "Financement des ONG"
 SWI_ngo_funding_desc: "Des subventions gouvernementales soutiennent les ONG travaillant dans l'aide humanitaire, la protection de l'environnement et les droits civils."
 SWI_efficiency: "Efficacité Suisse"
 SWI_efficiency_desc: "L'efficacité suisse devient une marque de gouvernance — bureaucratie allégée, gaspillage réduit et gestion précise."
 SWI_fortress_switzerland: "Forteresse Suisse"
 SWI_fortress_switzerland_desc: "D'importantes fortifications et des réseaux de défense modernes garantissent que la Suisse reste impénétrable en cas de conflit."
 SWI_tax_code: "Code des impôts simplifié"
 SWI_tax_code_desc: "Un système fiscal simplifié réduit l'évasion, attire l'investissement et soutient une économie équilibrée."
 SWI_foreign: "Entreprises étrangères"
 SWI_foreign_desc: "Les entreprises étrangères sont encouragées à investir en Suisse, stimulant l'innovation et la création d'emplois tout en maintenant le contrôle national."
 SWI_agriculture: "Financement agricole"
 SWI_agriculture_desc: "La Suisse investit dans une agriculture moderne et durable — soutenant les agriculteurs locaux, protégeant les communautés rurales et assurant la sécurité alimentaire pour les générations futures."
 SWI_fdp: "FDP"
 SWI_fdp_desc: "Le PLR est un parti libéral prônant les marchés libres, l'entrepreneuriat individuel, la liberté économique et une intervention minimale de l'État."
 SWI_police_reforms: "Réformes de la police"
 SWI_police_reforms_desc: "Moderniser les forces de l'ordre, améliorer l'efficacité et renforcer la sécurité publique dans tout le pays."
 SWI_financial_deregulation: "Déréglementation financière"
 SWI_financial_deregulation_desc: "Réduire les restrictions bancaires et financières pour encourager l'investissement, la croissance et le dynamisme économique."
 SWI_precision: "Précision Suisse"
 SWI_precision_desc: "Favoriser l'excellence de la fabrication suisse, promouvoir une industrie de haute qualité et maintenir la réputation de précision de la nation."
 SWI_fund_startups: "Startups technologiques"
 SWI_fund_startups_desc: "Fournir financement et soutien aux start-up technologiques pour stimuler l'innovation et assurer l'avenir économique de la Suisse."
 SWI_direct_democracy: "Réformes de démocratie directe"
 SWI_direct_democracy_desc: "Élargir la participation citoyenne par référendums et initiatives, renforçant le processus démocratique."
 SWI_progressive_tax: "Réformes fiscales progressives"
 SWI_progressive_tax_desc: "Mettre en œuvre un système fiscal progressif équitable pour financer les services publics et assurer l'équilibre économique."
 SWI_pda: "Partei der Arbeit"
 SWI_pda_desc: "Le Parti communiste suisse, gagnant une influence significative, plaide pour des changements radicaux dans la structure économique de la nation, cherchant à transformer la neutralité suisse en moteur de solidarité socialiste."
 SWI_nationalize_industries: "Industries clés nationalisées"
 SWI_nationalize_industries_desc: "Le Conseil fédéral lance la reprise de secteurs industriels clés, plaçant ressources et production vitales sous contrôle de l'État pour assurer une distribution équitable et un développement planifié."
 SWI_socialist_countries_ties: "Liens avec les pays socialistes"
 SWI_socialist_countries_ties_desc: "La Suisse cherche activement des liens diplomatiques, culturels et politiques plus étroits avec les nations alignées sur la cause socialiste, se préparant à faire pivoter sa longue neutralité vers un mouvement mondial."
 SWI_socialist_agreements: "Accords commerciaux"
 SWI_socialist_agreements_desc: "De nouveaux accords commerciaux de long terme sont négociés avec des États socialistes, garantissant l'accès à des matières premières cruciales et élargissant le marché des biens de précision suisses."
 SWI_higher_wages_idea: "Des salaires plus élevés"
 SWI_higher_wages_idea_desc: "Des hausses obligatoires du salaire minimum et une supervision fédérale des structures salariales garantissent aux travailleurs suisses un salaire de subsistance équitable et durable, stimulant la consommation intérieure."
 SWI_cheaper_house: "Logement bon marché"
 SWI_cheaper_house_desc: "Une initiative fédérale pour plafonner les loyers et subventionner la construction abaisse fortement le coût du logement privé, rendant l'accession à la propriété accessible à un plus large segment de la population."
 SWI_public_housing: "Logement social"
 SWI_public_housing_desc: "Un investissement massif de l'État dans des projets de logements publics de qualité fournit des foyers modernes et abordables, répondant à la densité urbaine et à la sécurité du logement pour la classe ouvrière."
 SWI_challenged_elite: "Défier l'élite bancaire"
 SWI_challenged_elite_desc: "Un défi direct est lancé à l'élite bancaire secrète et puissante. De nouvelles réglementations sont imposées, taxant les transferts de capitaux privés et enquêtant sur l'évasion fiscale pour remplir les caisses fédérales."
 SWI_mind_federation: "L'esprit de la Fédération"
 SWI_mind_federation_desc: "Une vision unifiée pour la nouvelle Fédération est établie, concentrant le système politique sur l'efficacité, la collaboration et l'intégration rapide des nouveaux territoires et populations."
 SWI_growing_federation: "Renforcer la Fédération"
 SWI_growing_federation_desc: "Les réformes industrielles et administratives de la Fédération sont regroupées en un seul programme coordonné. Le développement des infrastructures, la production d'usines et la recherche avancent désormais sous une bannière fédérale unique, standardisant et alignant politiquement chaque canton nouvellement acquis."
 SWI_modernize_direct: "Démocratie directe modernisée"
 SWI_modernize_direct_desc: "La démocratie directe est revue et modernisée, intégrant de nouvelles technologies et des processus rationalisés pour assurer un engagement citoyen rapide et une prise de décision nationale prompte."
 SWI_council_states: "Conseil des États"
 SWI_council_states_desc: "Le Conseil des États est réorganisé pour donner une représentation plus grande et plus équitable à tous les cantons nouveaux et établis, équilibrant le pouvoir législatif entre population et autonomie régionale."
 SWI_fiscal_equalization: "Fonds de péréquation fiscale"
 SWI_fiscal_equalization_desc: "Un nouveau fonds fédéral est créé pour redistribuer la richesse des cantons les plus riches vers les plus pauvres, assurant un développement uniforme et un niveau de vie élevé dans toute la Fédération."
 SWI_develop_federation: "Développer la Fédération"
 SWI_develop_federation_desc: "L'accent est mis sur des projets d'infrastructure et de développement à long terme à travers la Fédération alpine, surtout dans les territoires nouvellement acquis, pour maximiser le potentiel économique et la stabilité politique."
 switzerland.8.t: "Demande suisse pour les Alpes"
 switzerland.8.desc: "La Suisse demande le transfert immédiat de la Savoie, de la Provence et de Nice sous son contrôle, invoquant des liens historiques et une culture alpine partagée."
 switzerland.8.a: "Céder les États"
 switzerland.8.b: "Refuser"
 switzerland.9.t: "Réclamation des Alpes acceptée"
 switzerland.9.desc: "La France a inattendument accepté notre demande, cédant toute la région alpine. Une grande victoire diplomatique !"
 switzerland.9.a: "Une Suisse nouvelle et plus forte !"
 switzerland.10.t: "Réclamation des Alpes refusée"
 switzerland.10.desc: "Notre demande a essuyé un refus cinglant. La France n'est pas disposée à négocier sur l'intégrité territoriale."
 switzerland.10.a: "Les efforts diplomatiques ont échoué."
 switzerland.11.t: "S'enquérir des Alpes italiennes"
 switzerland.11.desc: "Le gouvernement suisse a émis une demande formelle de cession d'Aoste, du Piémont, de la Lombardie et du Tyrol du Sud à la Confédération suisse."
 switzerland.11.a: "Céder les provinces"
 switzerland.11.b: "Refuser la demande"
 switzerland.12.t: "Acceptation italienne"
 switzerland.12.desc: "Rome a étonnamment accepté nos demandes territoriales, invoquant un désir de paix régionale. Les Alpes sont unifiées !"
 switzerland.12.a: "Une République alpine unifiée !"
 switzerland.13.t: "Refus italien"
 switzerland.13.desc: "L'Italie a fortement rejeté nos demandes, y voyant une insulte à la souveraineté nationale."
 switzerland.13.a: "Notre diplomatie a échoué."
 switzerland.14.t: "S'enquérir du Tyrol autrichien"
 switzerland.14.desc: "La Suisse, dans sa volonté d'unifier le cœur alpin, a émis une demande formelle de cession du Tyrol. Bien qu'historiquement significatif, accepter pourrait prévenir de futurs conflits."
 switzerland.14.a: "Céder le Tyrol aux Suisses"
 switzerland.14.b: "Rejeter la revendication suisse"
 switzerland.15.t: "Tyrol acquis"
 switzerland.15.desc: "Vienne (ou l'occupant actuel de l'Autriche) a accepté notre demande, ajoutant la région vitale du Tyrol à la Confédération. Nos efforts d'unification se poursuivent avec succès."
 switzerland.15.a: "Une victoire diplomatique majeure."
 switzerland.16.t: "Refus du Tyrol"
 switzerland.16.desc: "Notre demande diplomatique pour le Tyrol a été rejetée d'emblée. Le propriétaire actuel de l'État voit la revendication comme un défi inacceptable à ses frontières."
 switzerland.16.a: "Nous devons attendre un meilleur moment."
 switzerland_news.7.t: "La Fédération alpine"
 switzerland_news.7.d: "Après d'amples manœuvres diplomatiques et un mouvement populaire à travers la région, la Suisse a formellement consolidé le contrôle du cœur alpin historique. La nation a officiellement changé de nom pour « La Fédération des Alpes » ou « Fédération alpine » en abrégé.\n\nCe changement considérable crée un État fédéral unifié et puissant s'étendant à travers la chaîne montagneuse d'Europe centrale, altérant fondamentalement l'équilibre des pouvoirs dans la région. Le nouveau gouvernement s'est engagé à préserver l'autonomie culturelle et politique de chaque région qu'il englobe désormais."
 switzerland_news.7.a: "Redéfinir la neutralité depuis 1516."
 switzerland_news.8.t: "Une nouvelle république : la Suisse vote la centralisation du pouvoir"
 switzerland_news.8.d: "À une courte majorité, le peuple suisse a approuvé le référendum constitutionnel pour abandonner la structure fédérale au profit d'une république centralisée. Le changement, porté par le mouvement Nouvelle Ère, promet une gouvernance allégée et une identité nationale cohérente, mais au prix de l'autonomie cantonale traditionnelle. La nouvelle République suisse remplace officiellement la Confédération aujourd'hui, suscitant à la fois célébrations et protestations dans les anciens cantons. La communauté internationale observe de près les implications de ce virage radical dans l'une des nations les plus stables d'Europe."
 switzerland_news.8.a: "La Confédération est morte !"
 SWI_suisse_politique: "La politique suisse"
 SWI_suisse_politique_desc: "Établir le cadre de l'arbre des focalisations nationales suisses et déterminer l'orientation politique initiale de la Confédération."
 SWI_strengthening_the_federation: "Renforcer la Fédération"
 SWI_strengthening_the_federation_desc: "Renforcer les liens entre les cantons et l'autorité du gouvernement central pour garantir l'unité nationale."
 SWI_dissolving_the_federation: "Dissoudre la Fédération"
 SWI_dissolving_the_federation_desc: "Le système fédéral n'est plus tenable. Lancer un processus controversé pour restructurer le pays, en privilégiant une République suisse unique et unifiée."
 SWI_deepening_swiss_democracy: "Approfondir la démocratie suisse"
 SWI_deepening_swiss_democracy_desc: "Élargir la portée des outils de démocratie directe, donnant au peuple plus de pouvoir par référendums et initiatives pour façonner la politique nationale."
 SWI_panalpine_initiative: "Initiative pan-alpine"
 SWI_panalpine_initiative_desc: "Adopter une politique étrangère et un rôle régional plus actifs. Chercher à s'aligner sur les régions alpines des États voisins ou à les intégrer."
 SWI_partei_der_arbeit: "Partei der Arbeit"
 SWI_partei_der_arbeit_desc: "Donner du pouvoir au parti ouvrier de gauche pour mettre en œuvre un programme socialiste visant l'égalité économique et la propriété collective."
 SWI_sp: "Parti social-démocrate (SP)"
 SWI_sp_desc: "Soutenir les sociaux-démocrates dans leurs efforts pour réformer le système politique vers plus de protection sociale et de coopération internationale."
 SWI_grune: "Le Parti écologiste (Grüne)"
 SWI_grune_desc: "Apporter un soutien politique au Parti écologiste pour pousser des politiques de protection environnementale et de développement durable."
 SWI_fdu: "Union fédérale démocratique (FDU)"
 SWI_fdu_desc: "Accorder davantage d'influence à l'Union démocratique fédérale pour défendre des valeurs chrétiennes évangéliques conservatrices et l'autonomie locale."
 SWI_svp: "Union populaire suisse (UDC)"
 SWI_svp_desc: "Soutenir l'Union démocratique du centre dans sa poussée pour des contrôles stricts de l'immigration, le conservatisme budgétaire et la souveraineté nationale."
 SWI_the_mind_of_the_federation: "L'esprit de la Fédération"
 SWI_the_mind_of_the_federation_desc: "Cultiver une identité nationale unifiée et renforcer la conscience collective de la Confédération."
 SWI_proclaim_the_alp_federation: "Proclamer la Fédération alpine"
 SWI_proclaim_the_alp_federation_desc: "Déclarer la formation d'une Fédération alpine unifiée, consolidant tous les territoires alpins partagés sous une nouvelle entité puissante dirigée par la Suisse."
 SWI_alp_federation_coring_tt: "Les États possédés de la Fédération alpine avec au moins 80 % de conformité deviennent territoire national. Les États sous ce seuil reçoivent des revendications à la place."
 SWI_strengthen_the_federation: "Renforcer la Fédération"
 SWI_strengthen_the_federation_desc: "Investir dans des projets et institutions nationaux clés pour rendre le gouvernement fédéral plus robuste face aux pressions internes et externes."
 SWI_modernize_direct_democracy: "Moderniser la démocratie directe"
 SWI_modernize_direct_democracy_desc: "Rationaliser les procédures de pétition et de vote de la démocratie directe, afin que le système reste efficace et pertinent à l'ère moderne."
 SWI_empower_the_council_of_states: "Renforcer le Conseil des États"
 SWI_empower_the_council_of_states_desc: "Accroître le pouvoir législatif du Conseil des États pour mieux représenter les intérêts et la souveraineté des cantons."
 SWI_fiscal_equalization_fund: "Fonds de péréquation fiscale"
 SWI_fiscal_equalization_fund_desc: "Créer un fonds permanent de redistribution de la richesse fédérale, garantissant parité financière et stabilité entre tous les cantons, riches et pauvres."
 SWI_social_equality: "Égalité sociale"
 SWI_social_equality_desc: "Mettre en œuvre des politiques pour réduire les écarts économiques et promouvoir la justice sociale, notamment pour les communautés marginalisées et les citoyens à bas revenus."
 SWI_workers_rights: "Droits des travailleurs"
 SWI_workers_rights_desc: "Adopter une législation complète garantissant des salaires équitables, des conditions de travail sûres et le droit de s'organiser pour tous les travailleurs suisses."
 SWI_workers_rights_idea: "Droits des travailleurs"
 SWI_workers_rights_idea_desc: "Adopter une législation complète garantissant des salaires équitables, des conditions de travail sûres et le droit de s'organiser pour tous les travailleurs suisses."
 SWI_cheaper_housing: "Des logements moins chers"
 SWI_cheaper_housing_desc: "Subventionner et réglementer le marché du logement pour que des logements abordables soient disponibles pour tous les citoyens du pays."
 SWI_expand_public_housing: "Étendre le logement social"
 SWI_expand_public_housing_desc: "Lancer un vaste projet fédéral de construction de logements sociaux de qualité dans les grands centres urbains."
 SWI_challenge_the_banking_elite: "Défier l'élite bancaire"
 SWI_challenge_the_banking_elite_desc: "Édicter des réglementations strictes et introduire de nouveaux impôts visant le puissant et secret secteur bancaire international."
 SWI_nationalize_key_industries: "Nationaliser les industries clés"
 SWI_nationalize_key_industries_desc: "Transférer à l'État la propriété de secteurs vitaux comme l'énergie, les transports et les communications, jusqu'ici privés."
 SWI_end_banking_secrecy: "Mettre fin au secret bancaire"
 SWI_end_banking_secrecy_desc: "Abolir la tradition séculaire du secret bancaire suisse, alignant le système financier sur les normes internationales de transparence."
 SWI_neutrality_pda: "Neutralité (voie partisane)"
 SWI_neutrality_pda_desc: "Réaffirmer la politique traditionnelle de neutralité suisse, mais privilégier les réformes socialistes intérieures aux enchevêtrements étrangers."
 SWI_strengthen_ties_with_socialist_countries: "Renforcer les liens avec les pays socialistes"
 SWI_strengthen_ties_with_socialist_countries_desc: "Forger des relations diplomatiques et économiques plus étroites avec le bloc croissant de nations socialistes et communistes."
 SWI_strengthen_domestic_independence: "Renforcer l'indépendance intérieure"
 SWI_strengthen_domestic_independence_desc: "Adopter des politiques qui favorisent l'autosuffisance en ressources et en industrie, protégeant l'économie suisse de la volatilité des marchés mondiaux."
 SWI_trade_agreements_with_socialist_states: "Accords commerciaux avec les États socialistes"
 SWI_trade_agreements_with_socialist_states_desc: "Signer des pactes commerciaux exclusifs avec des nations socialistes et non-alignées pour diversifier les débouchés suisses."
 SWI_direct_democracy_reforms: "Réformes de démocratie directe"
 SWI_direct_democracy_reforms_desc: "Introduire des changements techniques et procéduraux pour rendre le processus démocratique plus fluide et plus réactif aux demandes des citoyens."
 SWI_domestic_independence: "Indépendance intérieure"
 SWI_domestic_independence_desc: "Maximiser l'autonomie et la souveraineté suisses, en rejetant l'ingérence de grands blocs régionaux comme l'UE."
 SWI_move_closer_to_the_eu: "Se rapprocher de l'UE"
 SWI_move_closer_to_the_eu_desc: "Approfondir l'intégration de la Suisse au marché unique et aux structures politiques de l'Union européenne."
 SWI_humanitarian_leadership: "Leadership humanitaire"
 SWI_humanitarian_leadership_desc: "Renforcer le rôle de la Suisse comme phare mondial de l'aide, du refuge et du droit international par la diplomatie et une hausse des dépenses humanitaires."
 SWI_national_health_service: "Service national de santé"
 SWI_national_health_service_desc: "Repenser le système de santé en introduisant un service national de santé entièrement financé par l'État, garantissant un accès universel aux soins."
 SWI_expand_labour_union_power: "Étendre le pouvoir des syndicats"
 SWI_expand_labour_union_power_desc: "Adopter une législation accordant nettement plus d'autorité et d'influence aux syndicats dans la négociation collective et la politique industrielle."
 SWI_progressive_tax_reform: "Réforme fiscale progressive"
 SWI_progressive_tax_reform_desc: "Refondre le code fiscal pour augmenter fortement les taux des plus hauts revenus et des entreprises afin de financer les programmes sociaux."
 SWI_strengthen_parliamentary_socialism: "Renforcer le socialisme parlementaire"
 SWI_strengthen_parliamentary_socialism_desc: "Travailler dans le cadre démocratique pour accroître progressivement le pouvoir de l'establishment politique social-démocrate."
 SWI_welfare_state_of_the_future: "L'État-providence de demain"
 SWI_welfare_state_of_the_future_desc: "Pionnier d'un système de sécurité sociale de nouvelle génération, garantissant à tous les citoyens un revenu de base digne et une protection sociale complète."
 SWI_invest_in_green_infrastructure: "Investir dans les infrastructures vertes"
 SWI_invest_in_green_infrastructure_desc: "Engager d'importants fonds publics dans des travaux durables, y compris des réseaux d'énergie renouvelable et des transports écologiques."
 SWI_fund_ngos: "Financer des ONG"
 SWI_fund_ngos_desc: "Accorder d'importantes subventions fédérales et un soutien aux ONG environnementales et sociales pour renforcer la société civile."
 SWI_geneva_climate_diplomatic_hub: "Renforcer Genève en tant que hub climatique"
 SWI_geneva_climate_diplomatic_hub_desc: "Tirer parti du statut international de Genève pour accueillir de grands sommets climatiques et des négociations diplomatiques, accroissant le soft power suisse."
 SWI_limit_industrial_expansion: "Limiter l'expansion industrielle"
 SWI_limit_industrial_expansion_desc: "Édicter des moratoires et des lois de zonage strictes pour ralentir l'expansion de l'industrie lourde et protéger la beauté naturelle du paysage suisse."
 SWI_protect_the_alps: "Protéger les Alpes"
 SWI_protect_the_alps_desc: "Désigner les Alpes comme zone de protection écologique maximale, interdisant le développement à grande échelle ou l'extraction de ressources."
 SWI_renewable_energy_research: "Recherche sur les énergies renouvelables"
 SWI_renewable_energy_research_desc: "Financer les avancées scientifiques et technologiques dans le solaire, l'hydroélectricité et la géothermie pour atteindre une pleine indépendance énergétique nationale."
 SWI_centralization: "Centralisation du pouvoir"
 SWI_centralization_desc: "Transférer l'autorité des cantons au gouvernement fédéral, consolidant le pouvoir pour une action nationale rapide et décisive."
 SWI_strengthen_the_cantons: "Renforcer les cantons"
 SWI_strengthen_the_cantons_desc: "Renforcer l'autonomie et les pouvoirs traditionnels des gouvernements cantonaux, préservant l'esprit du fédéralisme."
 SWI_close_the_borders: "Fermer les frontières"
 SWI_close_the_borders_desc: "Mettre en œuvre une politique de fermeture absolue des frontières pour contrôler l'immigration et protéger l'identité nationale suisse et le marché du travail."
 SWI_ban_abortion: "Interdire l’avortement"
 SWI_ban_abortion_desc: "Adopter une législation interdisant complètement l'avortement, alignant les lois du pays sur des principes moraux conservateurs."
 SWI_faith_welfare: "Bien-être fondé sur la foi"
 SWI_faith_welfare_desc: "Restructurer le filet de sécurité sociale pour s'appuyer sur des organisations religieuses et caritatives privées, réduisant l'implication de l'État."
 SWI_stricter_immigration: "Des lois sur l'immigration plus strictes"
 SWI_stricter_immigration_desc: "Introduire un système à points et des quotas pour limiter sévèrement toutes les formes de migration légale et illégale vers le pays."
 SWI_maintain_armed_neutrality: "Maintenir la neutralité armée"
 SWI_maintain_armed_neutrality_desc: "Maintenir la tradition séculaire de non-alignement militaire tout en assurant une force de défense puissante et prête."
 SWI_distance_from_eu: "Nous distancer de l'UE"
 SWI_distance_from_eu_desc: "Entamer le découplage de la politique économique et politique suisse de l'influence et des réglementations de l'Union européenne."
 SWI_fund_ndb: "Financer le SRC"
 SWI_fund_ndb_desc: "Augmenter le financement du Service de renseignement de la Confédération (SRC) pour améliorer la sécurité intérieure, le contre-espionnage et les capacités de surveillance."
 SWI_stop_un_training: "Arrêtez la formation des soldats de la paix de l’ONU"
 SWI_stop_un_training_desc: "Mettre fin à la pratique controversée de former des casques bleus étrangers, en privilégiant une posture militaire purement défensive."
 SWI_traditionalist_propaganda: "Propagande traditionaliste"
 SWI_traditionalist_propaganda_desc: "Lancer une campagne nationale pour promouvoir les valeurs suisses conservatrices et traditionnelles via les médias et l'éducation sponsorisés par l'État."
 SWI_expand_army_fund: "Étendre les fonds de l'armée"
 SWI_expand_army_fund_desc: "Obtenir une nouvelle source permanente de recettes fédérales dédiée uniquement à l'augmentation du budget des Forces armées suisses."
 SWI_promote_swiss_identity: "Promouvoir l’identité suisse"
 SWI_promote_swiss_identity_desc: "Subventionner les institutions culturelles et linguistiques pour favoriser un patriotisme suisse plus fort et un sentiment d'appartenance nationale."
 SWI_skepticism_ngos: "Scepticisme envers les ONG"
 SWI_skepticism_ngos_desc: "Enquêter et restreindre les activités des ONG étrangères et nationales, invoquant des préoccupations sur leur influence sur la souveraineté nationale."
 SWI_expand_agriculture: "Développer l'agriculture"
 SWI_expand_agriculture_desc: "Investir dans les technologies agricoles modernes et les subventions pour augmenter significativement la production alimentaire intérieure et l'autosuffisance nationale."
 SWI_national_efficiency: "Efficacité nationale"
 SWI_national_efficiency_desc: "Introduire des réformes bureaucratiques et administratives dans toutes les agences fédérales pour réduire le gaspillage et accroître la rapidité et l'efficacité du gouvernement."
 SWI_isolationism: "Isolationnisme"
 SWI_isolationism_desc: "Adopter une politique de détachement mondial complet, fermant frontières et marchés pour éliminer toute ingérence étrangère dans les affaires suisses."
 SWI_armed_neutrality: "Neutralité armée"
 SWI_armed_neutrality_desc: "Codifier formellement une politique étrangère uniquement défensive, veillant à ce que l'armée soit bien équipée pour défendre l'indépendance de la nation à tout prix."
 SWI_defend_secrecy: "Défendre le secret bancaire"
 SWI_defend_secrecy_desc: "S'opposer vigoureusement à toute pression internationale pour démanteler les lois sur le secret bancaire privé du pays."
 SWI_attract_foreign_investors: "Attirer les investisseurs étrangers"
 SWI_attract_foreign_investors_desc: "Offrir de nouvelles incitations, des allègements fiscaux et des garanties réglementaires pour encourager les entreprises internationales à s'installer en Suisse."
 SWI_market_liberalization: "Libéralisation du marché"
 SWI_market_liberalization_desc: "Déréglementer les marchés et industries intérieurs pour promouvoir la libre concurrence, l'innovation et la croissance économique."
 SWI_keep_swiss_neutrality: "Garder la neutralité suisse"
 SWI_keep_swiss_neutrality_desc: "Maintenir l'interprétation traditionnelle et stricte du non-interventionnisme, privilégiant la stabilité financière aux enchevêtrements politiques."
 SWI_modernize_neutrality: "Moderniser la neutralité"
 SWI_modernize_neutrality_desc: "Adapter le concept de neutralité à un contexte moderne, permettant un plus grand engagement diplomatique et une intervention humanitaire à l'étranger."
 SWI_reduce_welfare: "Réduire les dépenses de protection sociale"
 SWI_reduce_welfare_desc: "Réduire les dépenses fédérales sur les programmes sociaux et les prestations pour diminuer la dette nationale et encourager l'épargne privée."
 SWI_moderate_police_reforms: "Des réformes modérées de la police"
 SWI_moderate_police_reforms_desc: "Mettre en œuvre des changements progressifs pour augmenter le financement de la police, moderniser l'équipement et améliorer les relations avec la communauté."
 SWI_industrial_development: "Développement industriel"
 SWI_industrial_development_desc: "Investir massivement dans l'expansion du secteur manufacturier national et la construction de nouveaux complexes industriels dans des zones stratégiques."
 SWI_swiss_precision: "Ingénierie de précision suisse"
 SWI_swiss_precision_desc: "Concentrer la recherche et l'investissement nationaux dans la fabrication de haute technologie, l'horlogerie et l'ingénierie mécanique spécialisée."
 SWI_tech_startups: "Promouvoir les startups technologiques"
 SWI_tech_startups_desc: "Créer un écosystème favorable de financement, d'allègements fiscaux et de programmes d'incubation pour favoriser un secteur technologique intérieur florissant."
 SWI_free_trade: "Libre-échange"
 SWI_free_trade_desc: "Éliminer les tarifs et réduire les barrières commerciales pour pleinement intégrer l'économie suisse au système commercial mondialisé."
 SWI_radical_changes: "Des changements radicaux"
 SWI_radical_changes_desc: "Une réévaluation nationale du système politique, ouvrant la voie à des changements révolutionnaires et fondateurs pour la Confédération."
 SWI_promote_left: "Promouvoir la politique de gauche"
 SWI_promote_left_desc: "Lancer une campagne pour accroître significativement la popularité et l'influence des idéologies communistes et socialistes dans toute la Confédération."
 SWI_workers_council: "Les conseils ouvriers prennent le pouvoir"
 SWI_workers_council_desc: "Établir formellement des conseils ouvriers comme organes économiques et politiques suprêmes de l'État, donnant le pouvoir direct au prolétariat."
 SWI_nationalize_banks: "Nationaliser les banques"
 SWI_nationalize_banks_desc: "Saisir le contrôle du puissant et secret secteur bancaire national, le plaçant sous propriété fédérale publique au bénéfice du peuple."
 SWI_agricultural_collectivization: "Collectivisation agricole"
 SWI_agricultural_collectivization_desc: "Abolir la propriété privée de la terre et organiser toutes les fermes en grandes entreprises agricoles collectives gérées par l'État."
 SWI_workers_cooperatives: "Coopératives de Travailleurs"
 SWI_workers_cooperatives_desc: "Soutenir la formation de coopératives détenues et gérées par les travailleurs comme modèle dominant de production, maintenant un contrôle économique décentralisé."
 SWI_militias_of_the_people: "Milices du peuple"
 SWI_militias_of_the_people_desc: "Dissoudre l'armée permanente et la remplacer par un réseau décentralisé de milices populaires armées, politiquement fiables, issues de la classe ouvrière."
 SWI_secret_police: "Police secrète"
 SWI_secret_police_desc: "Établir une police secrète puissante et omniprésente pour surveiller l'activité contre-révolutionnaire et réprimer la dissidence intérieure."
 SWI_denounce_eu: "Dénoncer l'UE"
 SWI_denounce_eu_desc: "Condamner formellement l'Union européenne comme organisation bourgeoise et retirer toute coopération ou lien politique suisse."
 SWI_suppress_party_enemies: "Supprimer les ennemis du parti"
 SWI_suppress_party_enemies_desc: "Utiliser tout le pouvoir de l'État pour éliminer et faire taire tous les partis et organisations politiques rivaux."
 SWI_multilingual_worker_solidarity: "Solidarité des travailleurs multilingues"
 SWI_multilingual_worker_solidarity_desc: "Souligner l'identité de classe commune par-delà les clivages linguistiques de la nation pour forger un prolétariat unifié et multilingue."
 SWI_peoples_tribune: "Tribune du peuple"
 SWI_peoples_tribune_desc: "Créer la charge de tribun du peuple, représentant élu chargé de servir de contrepoids populaire au pouvoir du gouvernement central."
 SWI_central_committee: "Règle du Comité central"
 SWI_central_committee_desc: "Confier l'autorité politique ultime à un petit et puissant Comité central du Parti, garantissant la pureté idéologique et le commandement centralisé."
 SWI_peoples_constitution: "La Constitution du peuple"
 SWI_peoples_constitution_desc: "Rédiger et promulguer une nouvelle constitution qui consacre les droits de la classe ouvrière et formalise la structure socialiste de l'État."
 SWI_national_charter: "La Charte nationale"
 SWI_national_charter_desc: "Rédiger une Charte nationale pour remplacer l'ancienne constitution, déclarant formellement l'engagement du nouvel État aux principes nationalistes et autoritaires."
 SWI_propaganda_machine: "Machine de propagande"
 SWI_propaganda_machine_desc: "Construire un appareil médiatique sophistiqué dirigé par l'État pour contrôler le flux d'information et assurer la conformité idéologique des citoyens."
 SWI_economic_self_sufficiency: "Autosuffisance économique"
 SWI_economic_self_sufficiency_desc: "Orienter toute l'économie suisse vers l'autarcie, en privilégiant la production intérieure et en éliminant la dépendance au commerce extérieur."
 SWI_expel_foreign_companies: "Expulser les entreprises étrangères"
 SWI_expel_foreign_companies_desc: "Forcer la fermeture immédiate et la nationalisation de toutes les entreprises étrangères opérant sur le sol suisse."
 SWI_revive_the_nf: "Faire renaître le Front national"
 SWI_revive_the_nf_desc: "Rétablir l'historique Front national et donner à ses dirigeants le pouvoir de porter un programme politique radical, nationaliste et autoritaire."
 SWI_fascism_idea: "Front national"
 SWI_fascism_idea_desc: "Le Front national était un parti d'extrême droite en Suisse qui a prospéré dans les années 1930. À son apogée, le groupe comptait jusqu'à 9 000 membres, selon le Dictionnaire historique de la Suisse, et peut-être 25 000 selon le Centre Simon Wiesenthal. Le parti était financé par le ministère de la Propagande du Reich. Il a disparu en 1940 et a été interdit par le Conseil fédéral suisse en 1943."
 SWI_national_unity: "Unité nationale"
 SWI_national_unity_desc: "Réprimer toutes les divisions internes et les conflits idéologiques pour forger une volonté nationale unique et unifiée sous le nouveau régime."
 SWI_leader_of_a_nation: "Un dirigeant de nation"
 SWI_leader_of_a_nation_desc: "Accorder de vastes nouveaux pouvoirs à une figure nationale charismatique, faisant passer la nation à un leadership fort et personnalisé."
 SWI_militarize_society: "Militariser la société"
 SWI_militarize_society_desc: "Intégrer les principes militaires à la vie civile, imposant le service obligatoire et promouvant la discipline et l'obéissance dans tout le pays."
 SWI_fascist_propaganda: "Propagande fasciste"
 SWI_fascist_propaganda_desc: "Lancer une campagne médiatique nationale agressive pour promouvoir l'idéologie du régime et diaboliser tous les ennemis perçus de l'État."
 SWI_censorship: "Censure"
 SWI_censorship_desc: "Imposer un contrôle total sur toutes les formes de médias, d'art et de production intellectuelle pour assurer une conformité idéologique absolue."
 SWI_pan_alpine_identity: "Identité panalpine"
 SWI_pan_alpine_identity_desc: "Déclarer l'existence d'un « peuple alpin » commun à travers la Suisse et ses voisins, posant les bases idéologiques de l'expansion."
 SWI_ban_radical_neutrals: "Interdire les radicaux neutres"
 SWI_ban_radical_neutrals_desc: "Interdire tous les groupes politiques qui prônent une neutralité absolue et passive, les étiquetant comme antipatriotiques et dangereux pour l'État."
 SWI_german_superiority: "Supériorité allemande"
 SWI_german_superiority_desc: "Prioriser la population germanophone et adopter une politique d'alignement culturel et linguistique avec l'Allemagne."
 SWI_swiss_identity: "Identité Suisse"
 SWI_swiss_identity_desc: "Défendre une identité suisse unique, multiethnique et farouchement indépendante, distincte de toutes les grandes puissances voisines."
 SWI_alpine_destiny: "Destin alpin"
 SWI_alpine_destiny_desc: "Exiger l'unification de tous les territoires alpins sous le drapeau suisse et préparer l'armée à la guerre d'unification à venir."
 SWI_one_party_state: "État à parti unique"
 SWI_one_party_state_desc: "Abolir toutes les institutions démocratiques restantes et formaliser le monopole politique complet et permanent du parti au pouvoir."
 SWI_further_strengthen_the_federation: "Renforcer encore la Fédération"
 SWI_further_strengthen_the_federation_desc: "La Suisse est une nation bâtie sur le compromis entre cantons, cultures et langues. En renforçant encore la structure fédérale, nous pouvons assurer une plus grande stabilité, améliorer la coordination entre les cantons et consolider l'unité de la Confédération face aux tensions internes comme aux menaces extérieures."
 SWI_higher_wages: "Des salaires plus élevés"
 SWI_higher_wages_desc: "La hausse du coût de la vie et les exigences économiques croissantes appellent une action. En encourageant des salaires plus élevés dans les secteurs clés, nous pouvons améliorer le niveau de vie, renforcer la consommation intérieure et assurer la stabilité sociale à long terme."
 SWI_universal_education: "Éducation universelle"
 SWI_universal_education_desc: "L'éducation est le fondement d'une nation forte et prospère. En offrant un accès universel à l'école, nous pouvons garantir que tous les citoyens aient les compétences et les connaissances nécessaires pour contribuer à l'avenir de la Suisse."
 SWI_fund_ngo: "Financer les ONG"
 SWI_fund_ngo_desc: "Les organisations non gouvernementales jouent un rôle vital pour soutenir les communautés et affronter les défis sociaux. En les finançant, nous pouvons renforcer leur capacité à servir le public et compléter les efforts du gouvernement."
 SWI_ban_neutrals: "Neutres interdits"
 SWI_ban_neutrals_desc: "La Suisse ne peut se permettre de rester neutre face aux menaces croissantes et à l'instabilité mondiale. En interdisant la neutralité, nous affirmons le rôle actif de notre nation dans les affaires internationales et nous préparons à défendre nos intérêts à l'étranger."
 SWI_militarized_society: "Société militarisée"
 SWI_militarized_society_desc: "Une nation forte exige une citoyenneté forte. En embrassant une société militarisée, nous inculquons la discipline, la préparation et une responsabilité partagée pour la défense de la Suisse."
 SWI_secret_agency: "L'agence secrète"
 SWI_secret_agency_desc: "Le renseignement est l'épine dorsale de la sécurité nationale. En établissant une agence secrète, la Suisse peut surveiller les menaces, recueillir des informations critiques et agir avant que les dangers n'atteignent nos frontières."
 SWI_swiss_companies_only: "Entreprises suisses uniquement"
 SWI_swiss_companies_only_desc: "Pour renforcer notre économie et protéger les intérêts intérieurs, seules les entreprises suisses seront autorisées à opérer dans certains secteurs. Cela garantit des emplois à nos citoyens et garde nos industries sous contrôle national."
 SWI_self_sufficiency: "Autosuffisant"
 SWI_self_sufficiency_desc: "La Suisse doit réduire sa dépendance aux importations étrangères et garantir que les ressources essentielles soient produites au pays. En favorisant l'autosuffisance, nous protégeons notre économie et renforçons la résilience nationale."
 SWI_workers: "Les travailleurs"
 SWI_workers_desc: "Une nation n'est forte que de sa main-d'œuvre. En mettant en œuvre des politiques en faveur des travailleurs, nous garantissons des salaires équitables, de meilleures conditions de travail et une population plus satisfaite et productive."
 SWI_communism_idea: "Communisme"
 SWI_communism_idea_desc: "Inspiré par les principes socialistes, le communisme suisse cherche à placer les moyens de production sous le contrôle du peuple. En restructurant notre économie, nous visons à réduire les inégalités et à garantir que tous les citoyens partagent la richesse de la nation."
 SWI_new_age: "Nouvel Âge"
 SWI_new_age_desc: "L'ancienne confédération a fait son temps. En dissolvant la fédération et en établissant une république unifiée, la Suisse entre dans une nouvelle ère de gouvernance, centralisant le pouvoir et redéfinissant l'avenir de la nation."
 SWI_agricultural_collectivization_idea: "Collectivisation agricole"
 SWI_agricultural_collectivization_idea_desc: "Pour nourrir la nation et moderniser les campagnes, nous devons organiser les fermes en unités collectives. La collectivisation agricole augmentera l'efficacité, améliorera l'allocation des ressources et renforcera le contrôle de l'État sur la production alimentaire."
 SWI_censor: "Censure"
 SWI_censor_desc: "Pour préserver l'ordre social et protéger la stabilité nationale, l'information doit être soigneusement surveillée. Mettre en œuvre la censure garantit que les idéologies nuisibles et la propagande déstabilisatrice ne puissent saper la Suisse."
 SWI_central_committee_idea: "Le Comité central"
 SWI_central_committee_idea_desc: "Un État fort exige un leadership décisif. L'établissement d'un Comité central consolide le pouvoir, coordonne la politique à travers la nation et garantit que la vision du parti soit mise en œuvre efficacement."
 SWI_politica_estera_svizzera: "Politica Estera Suisse"
 SWI_politica_estera_svizzera_desc: "La politique étrangère de la Suisse a toujours été neutre. S'écarter de ce chemin pourrait nous donner un avantage dans différents domaines."
 SWI_choosing_our_path: "Choisir notre voie"
 SWI_choosing_our_path_desc: "Nous devons maintenant décider de ce que nous faisons de notre politique étrangère. Certains préfèrent la neutralité, mais un mouvement plaide pour l'ouverture à l'OTAN et à l'UE."
 SWI_opening_up: "Ouverture"
 SWI_opening_up_desc: "Nous avons décidé de nous écarter de notre politique de neutralité."
 SWI_neutral_foreign_policy: "Politique étrangère neutre"
 SWI_neutral_foreign_policy_desc: "Nous avons décidé d'embrasser la neutralité. Pourquoi changer ce qui fonctionne ?"
 switzerland.17.t: "Choisir notre voie"
 switzerland.17.desc: "Le moment est venu de décider : changerons-nous ou resterons-nous inchangés. Que nous changions ou non, il y aura des bénéfices de chaque côté."
 switzerland.17.a: "Nous devons nous ouvrir au monde !"
 switzerland.17.b: "Pourquoi changer ce qui fonctionne ?"
 SWI_digitalisation: "La Suisse numérique"
 SWI_digitalisation_desc: "La stratégie Suisse numérique du Conseil fédéral engage la Confédération à une couverture fibre nationale et à une administration sans papier. Moderniser nos réseaux maintient les entreprises suisses compétitives et permet aux citoyens de régler leurs affaires avec l'État en ligne."
 SWI_sustainability: "Stratégie énergétique 2050"
 SWI_sustainability_desc: "Approuvée par référendum, la Stratégie énergétique 2050 abandonne le nucléaire au profit de l'hydroélectricité, du solaire et du stockage à l'échelle du réseau. Des parcs de batteries lissent la production renouvelable alpine et empêchent la croissance économique de dépasser notre environnement."
 SWI_microchip_research: "Recherche sur les semi-conducteurs"
 SWI_microchip_research_desc: "La précision suisse sous-tend déjà les modules de positionnement u-blox, les laboratoires de microélectronique du CSEM et le travail de conception de ST à Genève. Orienter l'EPFL et l'ETH Zurich vers la conception de semi-conducteurs revendique une part d'une industrie sans laquelle le monde ne fonctionne pas."
 SWI_microchip_plant: "Fonderie nationale"
 SWI_microchip_plant_desc: "Les conceptions étant éprouvées, il est temps de poser la première pierre. Une fonderie nationale transforme les plans suisses en silicium suisse et protège notre industrie des chocs d'approvisionnement étrangers."
 SWI_defending_swiss_independence: "Défendre l'indépendance suisse"
 SWI_defending_swiss_independence_desc: "Pour maintenir notre neutralité, nous devons maintenir notre indépendance. Et pour cela, nous devons d'abord contrer les influences étrangères qui tentent de nous enchaîner à d'autres camps."
 SWI_effort_to_better_relations: "Effort pour améliorer les relations"
 SWI_effort_to_better_relations_desc: "Trop longtemps nous avons joué la carte de la neutralité. Nous devons maintenant améliorer nos relations avec les voisins trop longtemps négligés."
 SWI_swiss_mercenaries: "Mercenaires suisses"
 SWI_swiss_mercenaries_desc: "Nous devons établir notre propre force de mercenaires. S'il en est qui savent combattre en montagne, ce sont nos gens. Il faut l'exploiter à profit."
 SWI_swiss_peacekeeping: "Maintien de la paix suisse"
 SWI_swiss_peacekeeping_desc: "L'ONU a besoin de casques bleus dans ce monde instable. La Suisse doit répondre."
 SWI_enforcing_the_uns_will: "Faire appliquer la volonté de l'ONU"
 SWI_enforcing_the_uns_will_desc: "Les contingents suisses passent de l'observation à l'application, soutenant les mandats du Conseil de sécurité avec des troupes qui répondent à Berne."
 SWI_befriend_the_eu: "Se lier d'amitié avec l'UE"
 SWI_befriend_the_eu_desc: "Nous devons maintenant choisir : voulons-nous poursuivre notre chemin de neutralité complète, ou nous lier d'amitié avec l'UE ?"
 SWI_nato: "NATO?"
 SWI_nato_desc: "L'adhésion mettrait fin à des siècles de neutralité formelle. Le Conseil fédéral doit décider si la garantie de sécurité vaut le prix."
 SWI_expand_the_mercenaries: "Étendre les mercenaires"
 SWI_expand_the_mercenaries_desc: "Il semble que nos mercenaires nous gagnent une certaine réputation dans le monde. Continuons et étendons-les !"
 SWI_foreign_investments: "Investissements étrangers"
 SWI_foreign_investments_desc: "Nous devons exploiter notre nouvel alignement avec d'autres nations occidentales. Nous pouvons aller demander des investissements, et en offrir en retour."
 SWI_local_arms_production: "Production d'armes locale"
 SWI_local_arms_production_desc: "Nous devons poursuivre notre voie de la neutralité, et les marchés d'armes peuvent être vus comme une forme d'alignement. C'est pourquoi nous devons produire notre propre armement."
 SWI_internal_investments: "Investissements intérieurs"
 SWI_internal_investments_desc: "Nous devons nous améliorer en dépensant notre propre argent pour nous-mêmes, en faisant des investissements intérieurs."
 SWI_integration_to_nato: "Intégration à l'OTAN"
 SWI_integration_to_nato_desc: "Maintenant que nous avons rejoint l'OTAN, nous devons commencer à intégrer nos systèmes d'armes anciens et nouveaux aux normes de l'OTAN."
 SWI_integration_to_nato_tt: "Chaque autre §Ymembre de l'OTAN§! gagne §G+25§! d'opinion envers la Suisse"
 SWI_alignment_to_NATO: "Alignement sur l'OTAN"
 SWI_alone_is_safer: "Seul est plus sûr"
 SWI_alone_is_safer_desc: "Bien que nous nous soyons ouverts à l'Occident, rejoindre réellement l'OTAN est un grand saut. Nous devons préserver notre indépendance sur ce point."
 SWI_expanded_trade: "Commerce élargi"
 SWI_expanded_trade_desc: "Nous devons étendre notre commerce pour gagner les faveurs de l'UE, et peut-être trouver le courage de la rejoindre plus tard."
 SWI_partner_like_everyone: "Partenaire comme tout le monde"
 SWI_partner_like_everyone_desc: "Nous ne voyons aucun bon gain à aligner davantage notre commerce sur l'UE. C'est pourquoi nos relations doivent rester aussi alignées avec elle qu'avec n'importe quel autre pays."
 SWI_bank_of_the_west: "Banque de l'Occident"
 SWI_bank_of_the_west_desc: "Nous avons une immense industrie bancaire que nous pouvons exploiter à notre avantage. Cependant, nous devons l'offrir surtout à l'Occident."
 SWI_idea_environmental_reforms: "Réformes environnementales"
 SWI_idea_environmental_reforms_desc: "Des lois environnementales complètes visent à réduire les émissions, protéger les ressources naturelles et faire basculer l'économie vers la durabilité."
 SWI_idea_eco_tourism: "Écotourisme"
 SWI_idea_eco_tourism_desc: "Promouvoir un tourisme respectueux de l'environnement redonne vie aux zones rurales tout en préservant les paysages immaculés de la Suisse."
 SWI_idea_national_parks: "Parcs nationaux"
 SWI_idea_national_parks_desc: "L'extension des zones protégées sauvegarde la faune et renforce l'image mondiale de la Suisse comme leader environnemental."
 SWI_idea_completely_green: "Complètement vert !"
 SWI_idea_completely_green_desc: "Par une réforme et une innovation incessantes, la Suisse atteint une pleine durabilité écologique, une nation entièrement alimentée par une énergie propre."
 SWI_idea_christian_values: "Valeurs chrétiennes"
 SWI_idea_christian_values_desc: "Les principes chrétiens traditionnels guident la politique sociale et renforcent le fondement moral de la société suisse."
 SWI_idea_fortress_switzerland: "Forteresse Suisse"
 SWI_idea_fortress_switzerland_desc: "D'importantes fortifications et des réseaux de défense modernes garantissent que la Suisse reste impénétrable en cas de conflit."
 SWI_idea_tax_code: "Code des impôts simplifié"
 SWI_idea_tax_code_desc: "Un système fiscal simplifié réduit l'évasion, attire l'investissement et soutient une économie équilibrée."
 SWI_idea_fdp: "Parti Démocratique Libre (FDP)"
 SWI_idea_fdp_desc: "Le PLR est un parti libéral prônant les marchés libres, l'entrepreneuriat individuel, la liberté économique et une intervention minimale de l'État."
 SWI_idea_financial_deregulation: "Déréglementation financière"
 SWI_idea_financial_deregulation_desc: "La réduction des restrictions bancaires et financières encourage l'investissement, la croissance et le dynamisme économique."
 SWI_idea_sp: "Parti social-démocrate (SP)"
 SWI_idea_sp_desc: "Les sociaux-démocrates orientent le système politique vers davantage de protection sociale et de coopération internationale."
 SWI_idea_fdu: "Union fédérale démocratique (FDU)"
 SWI_idea_fdu_desc: "L'Union démocratique fédérale défend des valeurs chrétiennes évangéliques conservatrices et l'autonomie locale."
 SWI_idea_svp: "Union populaire suisse (UDC)"
 SWI_idea_svp_desc: "L'Union démocratique du centre presse pour des contrôles stricts de l'immigration, le conservatisme budgétaire et la souveraineté nationale."
 SWI_idea_defend_secrecy: "Secret bancaire"
 SWI_idea_defend_secrecy_desc: "Toute pression internationale pour démanteler le secret bancaire privé est repoussée. La confidentialité des clients reste la loi du pays."
 SWI_sig_sauer_materiel_manufacturer: "SIG Sauer"
 SWI_sig_sauer_materiel_manufacturer_trait: "Armes de précision suisses"
 SWI_sig_sauer_materiel_manufacturer_rifles_header: "Fusils de service"
 SWI_sig_sauer_materiel_manufacturer_sidearms_header: "Armes de poing et contrats"
 SWI_sig_sauer_materiel_manufacturer_precision_header: "Précision et munitions"
