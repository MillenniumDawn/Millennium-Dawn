 JAP_diplomacy.11.t: "U.S. Request to Reinterpret Article 9"
 JAP_diplomacy.11.d: "The government of the United States has approached us with a formal request to further reinterpret Article 9 of our Constitution. Washington argues that the regional security environment has deteriorated to such an extent that Japan must assume a greater share of the collective defense burden. Accepting their request would open the door to a broader understanding of self-defense,and to closer military cooperation, but it will not be without domestic controversy."
 JAP_diplomacy.11.a: "Accept the U.S. request"
 JAP_diplomacy.11.b: "We cannot accept this request"
 JAP_diplomacy.12.t: "Japan Refuses to Reinterpret Article 9"
 JAP_diplomacy.12.d: "Tokyo has informed us that it is not prepared to further reinterpret Article 9 at this time. Concerns over domestic public opinion, constitutional constraints, and political stability have led the Japanese government to reject our request. We must now decide whether to respect their decision or increase diplomatic and security pressure."
 JAP_diplomacy.12.a: "We will respect their decision"
 JAP_diplomacy.12.b: "Increase pressure on Japan"
 JAP_diplomacy.13.t: "Japan Accepts to Reinterpret Article 9"
 JAP_diplomacy.13.d: "Tokyo has shared they are in favor of chaning the interpetation level of Article 9 and they will work to be a more active defense partner."
 JAP_diplomacy.13.a: "ようやくだ"
 JAP_diplomacy.14.t: "U.S. Pressure on Article 9"
 JAP_diplomacy.14.d: "Following our refusal to broaden the interpretation of Article 9, the United States has quietly begun to increase diplomatic and security pressure on our government. Alliance consultations, media briefings, and behind-the-scenes messages all point in the same direction: Washington expects Japan to shoulder more responsibility. We can stand firm or quietly shift our stance."
 JAP_diplomacy.14.a: "We will stand firm"
 JAP_diplomacy.14.b: "Quietly adjust our position"
 JAP_diplomacy.15.t: "Japan Accepts Under Pressure"
 JAP_diplomacy.15.d: "After a period of heightened diplomatic and strategic pressure, Tokyo has indicated that it is prepared to move closer to our position on Article 9. While publicly insisting that Japan's pacifist principles remain unchanged, the government has now broadened its self-defense interpretation in a manner that aligns with our expectations."
 JAP_diplomacy.15.a: "エクセレント"
 JAP_diplomacy.17.t: "U.S. Tariffs on Japanese Goods"
 JAP_diplomacy.17.d: "The United States has announced a new package of tariffs targeting key Japanese exports, citing economic imbalances and domestic political pressure. The measures are presented as a way to 'level the playing field,' but in Tokyo they are widely seen as a politically motivated move that will strain both our economy and the broader alliance."
 JAP_diplomacy.17.a: "We will have to adapt to this new reality"
 JAP_diplomacy.18.t: "Japan Requests Tariff Relief"
 JAP_diplomacy.18.d: "Tokyo has formally requested that we lift the tariffs imposed on Japanese goods. Japanese representatives hint that their government may be willing to deepen security cooperation and move further on defense policy in exchange. We must decide whether to turn this economic dispute into a strategic opportunity, or maintain the pressure."
 JAP_diplomacy.18.a: "Lift the tariffs in exchange for security concessions"
 JAP_diplomacy.18.b: "Refuse and keep the tariffs in place"
 JAP_diplomacy.19.t: "Tariffs Lifted, Security Concessions Demanded"
 JAP_diplomacy.19.d: "The United States has agreed to lift its tariffs on Japanese exports, but only as part of a broader understanding on security and defense. In practice, this means that Japan is expected to further broaden the interpretation of Article 9, deepening military cooperation with Washington and taking on a larger role in regional security."
 JAP_diplomacy.19.a: "For our economy and our alliance, we will accept this burden"
 JAP_diplomacy.20.t: "U.S. Refuses to Lift Tariffs"
 JAP_diplomacy.20.d: "Our formal request to lift the U.S. tariffs has been rejected. Washington insists that the measures will remain in place, citing domestic political pressures and unresolved disagreements over security policy. At home, frustration is growing among exporters and business leaders, while strategists warn that the dispute could further complicate our alliance."
 JAP_diplomacy.20.a: "We will have to endure the pressure for now"
 JAP_diplomacy.21.t: "Japan Requests Renewed Security Guarantees"
 JAP_diplomacy.21.d: "The Japanese government has formally requested renewed or strengthened security guarantees from the United States. Tokyo argues that the regional security environment has deteriorated and that a clearer U.S. commitment would help stabilize the situation. In private, Japanese officials acknowledge that further changes to the interpretation of Article 9 may be possible if Washington is prepared to make explicit commitments."
 JAP_diplomacy.21.a: "Restore our security guarantees in exchange for deeper commitments"
 JAP_diplomacy.21.b: "Refuse to extend our guarantees"
 JAP_diplomacy.22.t: "Security Guarantees Restored"
 JAP_diplomacy.22.d: "The United States has agreed to renew and clarify its security guarantees to Japan. In return, Washington expects Tokyo to take further steps in broadening the interpretation of Article 9 and assuming a greater share of regional security responsibilities. The alliance grows stronger, but the domestic debate over our pacifist principles will intensify."
 JAP_diplomacy.22.a: "For our security, we will accept this commitment"
 JAP_diplomacy.23.t: "U.S. Refuses Stronger Guarantees"
 JAP_diplomacy.23.d: "Our request for renewed or strengthened security guarantees has been rejected. The United States insists that existing arrangements are sufficient and that domestic political constraints limit any further commitments. Within Japan, this refusal will fuel concerns about our long-term security and the reliability of our alliance."
 JAP_diplomacy.23.a: "Then we must reconsider our own path"
 JAP_diplomacy.24.t: "Japan Requests an End to U.S. Naval Pressure"
 JAP_diplomacy.24.d: "Tokyo has formally requested that we scale back or end our heightened naval presence and pressure around key sea lanes and chokepoints. Japanese officials argue that the current posture risks escalation and undermines domestic support for the alliance. In private, they indicate that further changes to the interpretation of Article 9 may be possible if we ease our posture."
 JAP_diplomacy.24.a: "End the naval pressure in exchange for security concessions"
 JAP_diplomacy.24.b: "Maintain our naval pressure around Japan"
 JAP_diplomacy.25.t: "Naval Pressure Eased, Commitments Deepened"
 JAP_diplomacy.25.d: "The United States has agreed to ease its heightened naval presence around our sea lanes, in return for deeper security commitments from Japan. In practice, this means another step in broadening the interpretation of Article 9 and expanding our role in regional security. The alliance appears stronger, but the domestic debate over our pacifist identity will only grow more intense."
 JAP_diplomacy.25.a: "For the sake of stability, we will honor this deal"
 JAP_diplomacy.26.t: "U.S. Refuses to End Naval Pressure"
 JAP_diplomacy.26.d: "Our request to ease or end the heightened U.S. naval presence around our sea lanes has been rejected. Washington insists that the current posture is necessary in light of regional threats. At home, this refusal will fuel both fears of entrapment in a wider conflict and calls to further strengthen Japan's own defenses."
 JAP_diplomacy.26.a: "Then we must adapt under pressure"
 JAP_diplomacy.28.t: "Kaguya Lunar Design Complications"
 JAP_diplomacy.28.d: "The ambitious Kaguya lunar mission is encountering serious design challenges. Key systems are proving more complex than expected, from guidance and power management to thermal protection. Engineers argue that additional funding and time will allow them to redesign critical components and improve overall reliability, but the cost of doing so is already raising eyebrows in the cabinet."
 JAP_diplomacy.28.a: "Invest in redesign and keep the schedule tight"
 JAP_diplomacy.28.b: "Hold the line on costs and accept a longer timeline"
 JAP_diplomacy.29.t: "Kaguya Communications Vulnerabilities"
 JAP_diplomacy.29.d: "As testing continues, the Kaguya program reveals weaknesses in deep-space communications and data links. Signal integrity, bandwidth, and resistance to interference are all below target. Specialists propose new antennas, upgraded ground stations, and more robust encryption,but these improvements will require additional political and financial capital."
 JAP_diplomacy.29.a: "Upgrade the communications architecture"
 JAP_diplomacy.29.b: "Proceed with existing systems and hope for the best"
 JAP_diplomacy.30.t: "Further Delays for the Kaguya Mission"
 JAP_diplomacy.30.d: "Technical setbacks, integration issues, and scheduling conflicts with launch infrastructure have forced yet another delay to the Kaguya lunar mission. While the core systems remain promising, the project is increasingly viewed as slow and troubled. Scientists insist that patience will be rewarded, but public attention is beginning to drift elsewhere."
 JAP_diplomacy.30.a: "Accept the delay and push on toward the Moon"
 JAP_diplomacy.31.t: "Kaguya Reaches the Lunar Surface"
 JAP_diplomacy.31.d: "After years of design revisions, communications upgrades, and difficult delays, the Kaguya mission has finally succeeded. Japanese hardware now operates on and around the Moon, returning high-resolution imagery and invaluable scientific data. The achievement showcases Japan's high-tech capabilities and opens new paths for satellite development, deep-space exploration, and strategic space applications."
 JAP_diplomacy.31.a: "Celebrate Kaguya as a triumph of Japanese technology"
 jap_kaguya_satellite_invest_tt: "§GBecause we invested in better design of the spaceship, we gained:§!"
 jap_kaguya_rocketry_invest_tt: "§GBecause we invested in better communications with the spaceship, we gained:§!"
 JAP_diplomacy.32.t: "Guidance Software Anomaly"
 JAP_diplomacy.32.d: "Engineers on the Mars mission report a recurring anomaly in the guidance software. While the issue is not yet critical, it could compound into serious navigation errors if left unaddressed. Fixing it thoroughly will pull resources from other projects and may affect the overall schedule."
 JAP_diplomacy.32.a: "Divert resources and resolve it properly"
 JAP_diplomacy.32.b: "Accept delays and patch it gradually"
 JAP_diplomacy.33.t: "Naming the Mars Colony"
 JAP_diplomacy.33.d: "Japan has secured a permanent foothold on Mars. As habitats come online and the first long-term crews settle in, a symbolic decision awaits: the official name and character of the colony."
 JAP_diplomacy.33.a: "'Amaterasu', a radiant symbol of unity"
 JAP_diplomacy.33.b: "'Kagutsuchi',a blazing industrial forge"
 JAP_diplomacy.33.c: "'Tsukuyomi',a calm observatory in the dark"
 JAP_diplomacy.33.e: "'Susanoo',a storm-touched martial frontier"
 JAP_diplomacy.68.t: "Japan Demands Sakhalin"
 JAP_diplomacy.68.d: "Japan has issued a formal demand for the return of Sakhalin. Accepting would defuse tensions, but it would be seen as a humiliating concession."
 JAP_diplomacy.68.a: "Accept the demand"
 JAP_diplomacy.68.b: "Reject it outright"
 JAP_diplomacy.69.t: "Sakhalin Returned"
 JAP_diplomacy.69.d: "Moscow has accepted our demand. Sakhalin is now under Japanese administration. The government will present this as proof that the imperial order is returning."
 JAP_diplomacy.69.a: "A historic correction"
 JAP_diplomacy.70.t: "ロシア拒否"
 JAP_diplomacy.70.d: "Moscow has refused our demand for Sakhalin. We can swallow the insult for now, test Russia with a limited border conflict, or commit fully to war."
 JAP_diplomacy.70.a: "Stand down for now"
 JAP_diplomacy.70.b: "Launch a border war"
 JAP_diplomacy.70.c: "Declare total war"
 JAP_diplomacy.71.t: "Japan Demands the North Kuril Islands"
 JAP_diplomacy.71.d: "Japan has issued a formal demand for the return of the North Kuril Islands. Accepting would defuse tensions, but it would be seen as a humiliating concession."
 JAP_diplomacy.71.a: "Accept the demand"
 JAP_diplomacy.71.b: "Reject it outright"
 JAP_diplomacy.72.t: "The North Kuril Islands Returned"
 JAP_diplomacy.72.d: "Moscow has accepted our demand. The North Kuril Islands are now under Japanese administration. The government will present this as proof that the imperial order is returning."
 JAP_diplomacy.72.a: "A historic correction"
 JAP_diplomacy.73.t: "ロシア拒否"
 JAP_diplomacy.73.d: "Moscow has refused our demand for the North Kuril Islands. We can swallow the insult for now, test Russia with a limited border conflict, or commit fully to war."
 JAP_diplomacy.73.a: "Stand down for now"
 JAP_diplomacy.73.b: "Launch a border war"
 JAP_diplomacy.73.c: "Declare total war"
 JAP_diplomacy.74.t: "Japan Demands the South Kuril Islands"
 JAP_diplomacy.74.d: "Japan has issued a formal demand for the return of the South Kuril Islands. Accepting would defuse tensions, but it would be seen as a humiliating concession."
 JAP_diplomacy.74.a: "Accept the demand"
 JAP_diplomacy.74.b: "Reject it outright"
 JAP_diplomacy.75.t: "The South Kuril Islands Returned"
 JAP_diplomacy.75.d: "Moscow has accepted our demand. The South Kuril Islands are now under Japanese administration. The government will present this as proof that the imperial order is returning."
 JAP_diplomacy.75.a: "A historic correction"
 JAP_diplomacy.76.t: "ロシア拒否"
 JAP_diplomacy.76.d: "Moscow has refused our demand for the South Kuril Islands. We can swallow the insult for now, test Russia with a limited border conflict, or commit fully to war."
 JAP_diplomacy.76.a: "Stand down for now"
 JAP_diplomacy.76.b: "Launch a border war"
 JAP_diplomacy.76.c: "Declare total war"
 JAP_diplomacy.77.t: "Tokyo Proposes a Settlement"
 JAP_diplomacy.77.d: "With the Kuril Islands and Sakhalin now under Japanese control, Tokyo has moved quickly to turn battlefield gains into a formal settlement. Japanese diplomats have approached Moscow with a proposal to bring the conflict to an end, arguing that the war has already decided the matter and that further fighting would only prolong the inevitable.\nTheir offer is straight forward: peace in exchange for Russia formally recognizing Japanese control over the Kuril Islands and Sakhalin. In Tokyo's view, it is a practical arrangement meant to stabilize the region and prevent the war from escalating further. Now the decision lies with us. Accept the new reality and end the war, or reject the proposal and continue the struggle."
 JAP_diplomacy.77.a: "Accept the settlement."
 JAP_diplomacy.77.b: "Reject it. The war continues."
 JAP_diplomacy.78.t: "Settlement Accepted"
 JAP_diplomacy.78.d: "The proposal is accepted, and the guns begin to fall silent. Orders are issued to disengage, diplomatic channels reopen, and the war is reduced to a set of clauses and coordinates.\n\nThe Northern isles are transferred as the price of peace, and every side must now sell the outcome to their own public. The campaign ends, but the memory will not."
 JAP_diplomacy.78.a: "So be it. Let the ink replace the blood."
 JAP_diplomacy.79.t: "Settlement Rejected"
 JAP_diplomacy.79.d: "The answer from the other side is a hard no. There will be no signatures, no recognition, and no pause to catch breath.\n\nTokyo has misread our resolve, and the conflict will continue until one side can no longer sustain it. If peace is to come, it will be forced."
 JAP_diplomacy.79.a: "Then we fight on."
 JAP_diplomacy.80.t: "Moscow Seeks a Way Out"
 JAP_diplomacy.80.d: "After Japan's advances in the north, Russian diplomats signal a willingness to end the fighting before the situation worsens. The message is pragmatic: stop the bleed, freeze the lines, and prevent the war from consuming more resources than any side can justify.\n\nThe offer is a straightforward peace, trading continued escalation for an immediate end to hostilities. We must decide whether to accept an imperfect settlement or press our advantage further."
 JAP_diplomacy.80.a: "Accept peace."
 JAP_diplomacy.80.b: "No. We press on."
 JAP_diplomacy.81.t: "Tokyo Accepts the Peace"
 JAP_diplomacy.81.d: "Japan agrees to the terms, choosing to end the war rather than widen it. The decision is unpopular in parts of the country, and the cost is felt at home as confidence slips and the public questions why the fighting began at all.\n\nA white peace is declared, and the territorial concessions are executed. The battlefield quiets, but the political damage will linger."
 JAP_diplomacy.81.a: "We will swallow this, and endure."
 JAP_diplomacy.82.t: "Tokyo Refuses"
 JAP_diplomacy.82.d: "Japan rejects the proposal and signals that it will not accept a settlement written from weakness. The fighting will continue, and the stakes rise with every passing week.\n\nIf peace is to come, it will not be offered. It will be taken."
 JAP_diplomacy.82.a: "ならばそのように"
 JAP_unlock_sikhalin_raid_tt: "Unlocks §YSpecial Forces Raid§! on §Y$STATE_691$§!"
 JAP_diplomacy.83.t: "Victory in the South Kurils"
 JAP_diplomacy.83.d: "Japanese forces have prevailed in the South Kurils, pushing Russian units back and seizing control of the contested ground. The result is small on the map, but loud in its message: Japan can take what it claims and hold it under pressure.\n\nThe flag goes up, the garrison digs in, and Tokyo prepares for the next move. Moscow will not forget this."
 JAP_diplomacy.83.a: "Secure the islands."
 JAP_diplomacy.84.t: "Defeat in the South Kurils"
 JAP_diplomacy.84.d: "The border clash in the South Kurils has gone against us. Russian resistance held firm, and our forces were forced to withdraw under fire, leaving the question of sovereignty unresolved and our leadership under scrutiny.\n\nWe have learned painful lessons in the process. The next attempt will be better planned, better supplied, and harder to stop."
 JAP_diplomacy.84.a: "Learn from the setback."
 JAP_diplomacy.85.t: "Setback in the South Kurils"
 JAP_diplomacy.85.d: "Russian forces have failed to hold the South Kurils in the face of a determined Japanese push. The immediate tactical loss is sharp, and the political signal is sharper: the frontier is vulnerable, and the opponent is willing to pay to change it.\n\nMoscow will have to decide whether to escalate, or accept a humiliating new fact on the ground."
 JAP_diplomacy.85.a: "A bitter lesson."
 JAP_diplomacy.86.t: "South Kurils Secured"
 JAP_diplomacy.86.d: "Russian troops have won the border clash and secured the South Kurils, driving back Japanese units and restoring control along the line. The operation demonstrates readiness and the ability to punish incursions quickly.\n\nTokyo may call it a temporary setback, but the message is clear. The islands will not be taken cheaply."
 JAP_diplomacy.86.a: "Hold the line."
 JAP_diplomacy.87.t: "Victory in the North Kurils"
 JAP_diplomacy.87.d: "Japan has achieved a breakthrough in the North Kurils, forcing Russian units to retreat and leaving the islands under our control. The operation proves that even remote terrain can be seized when planning, timing, and resolve align.\n\nThe occupation begins immediately. Supplies flow, defenses rise, and the northern frontier is rewritten by action."
 JAP_diplomacy.87.a: "Dig in and prepare."
 JAP_diplomacy.88.t: "Defeat in the North Kurils"
 JAP_diplomacy.88.d: "The North Kurils have held against our attack. The fighting was harsh, the conditions worse, and Russian forces managed to blunt our advance and force a withdrawal.\n\nWe return with experience paid for in blood and fatigue. Next time, we will not arrive unprepared."
 JAP_diplomacy.88.a: "We will adapt."
 JAP_diplomacy.89.t: "Loss in the North Kurils"
 JAP_diplomacy.89.d: "Russia has been pushed out of positions in the North Kurils after a successful Japanese operation. The loss is not only territorial, it is psychological, signaling that distance and weather are no longer reliable defenses.\n\nA response will be demanded, but retaliation carries its own risks. The situation is deteriorating fast."
 JAP_diplomacy.89.a: "This cannot stand."
 JAP_diplomacy.90.t: "North Kurils Held"
 JAP_diplomacy.90.d: "Russian forces have defeated the incursion and held the North Kurils, repelling Japanese units and restoring control under difficult conditions. The defense has sharpened doctrine and raised confidence across the command chain.\n\nIf Japan wants these islands, it will have to commit far more than a border clash."
 JAP_diplomacy.90.a: "Maintain readiness."
 JAP_diplomacy.91.t: "Russia Responds on Sakhalin"
 JAP_diplomacy.91.d: "Japanese moves on Sakhalin have triggered an immediate response from Moscow. Russian leadership frames the action as a direct challenge to sovereignty and signals that it will not tolerate further advances without consequence.\n\nThe crisis now branches into two paths: escalation into open war, or coercive pressure through economic measures and maritime restriction. Either way, the temperature has risen past the point of calm diplomacy."
 JAP_diplomacy.91.a: "This will become a war."
 JAP_diplomacy.91.b: "Strangle them with embargo and blockade."
 JAP_diplomacy.92.t: "Russia Answers the Sakhalin Takeover"
 JAP_diplomacy.92.d: "Sakhalin has changed hands, and Moscow must now decide how to answer a humiliation so close to home. War would be costly, but failing to respond would invite further losses and weaken the state's authority.\n\nRussia can choose escalation and attempt to reverse the outcome by force, or accept a temporary peace that ends the fighting while demanding the return of Sakhalin as the price for stopping. The decision will define the next phase of the conflict."
 JAP_diplomacy.92.a: "We will retake it by force."
 JAP_diplomacy.92.b: "Force a settlement. Sakhalin must be returned."
 JAP_diplomacy.94.t: "Tokyo Demands a Protectorate"
 JAP_diplomacy.94.d: "A formal note arrives from Japan, stripped of diplomacy and heavy with intent. Seoul is offered a choice presented as stability: accept Japanese supervision over foreign policy and security affairs, align institutions to Tokyo's direction, and avoid a destructive confrontation.\n\nThe message is clear. Japan is no longer asking for cooperation, it is dictating terms. Refusal will be treated as defiance, and defiance will invite consequences."
 JAP_diplomacy.94.a: "We have no choice but to accept."
 JAP_diplomacy.94.b: "Refuse. Korea will not bow."
 JAP_diplomacy.95.t: "South Korea Submits"
 JAP_diplomacy.95.d: "Seoul accepts the terms, choosing survival over sovereignty. Agreements are signed under pressure, advisers arrive, and the state's external posture is folded into Japan's strategic design.\n\nThe war ends, but a different kind of struggle begins. Korea remains on the map, yet its direction is no longer its own."
 JAP_diplomacy.95.a: "Establish the protectorate."
 JAP_diplomacy.96.t: "South Korea Defies Tokyo"
 JAP_diplomacy.96.d: "Seoul rejects the ultimatum and declares that its sovereignty is not negotiable. The refusal turns the crisis from coercion into confrontation, and Tokyo now has every pretext it needs to claim the issue can only be settled by force.\n\nIf Japan wanted a submission, it has received a challenge instead."
 JAP_diplomacy.96.a: "Then we will impose our will."
 JAP_diplomacy.97.t: "Tokyo Issues an Ultimatum to Pyongyang"
 JAP_diplomacy.97.d: "Japan has delivered an ultimatum to Pyongyang, offering a future of containment under supervision or a future of ruin under bombardment. The terms are blunt: surrender external policy and strategic autonomy to Tokyo's direction, accept monitored security arrangements, and submit to a framework designed to prevent the North from ever becoming a threat again.\n\nFor the regime, this is humiliation. For Japan, it is risk management. The question is whether Pyongyang chooses survival or defiance."
 JAP_diplomacy.97.a: "Accept. Preserve the state at any cost."
 JAP_diplomacy.97.b: "Reject. We will not submit."
 JAP_diplomacy.98.t: "Pyongyang Yields"
 JAP_diplomacy.98.d: "Against all expectations, the North accepts the terms. The regime keeps its symbols, but its freedom of action is broken as Japanese supervision reshapes borders, security, and foreign relations.\n\nThe fighting ends, and the peninsula's northern half becomes a controlled buffer. A threat is neutralized, and Tokyo gains a lever it will not easily release."
 JAP_diplomacy.98.a: "Establish the protectorate."
 JAP_diplomacy.99.t: "Pyongyang Defies Tokyo"
 JAP_diplomacy.99.d: "Pyongyang rejects the ultimatum and chooses defiance, betting that fear and escalation will protect the regime. The refusal turns the crisis into a test of wills, and Tokyo now has the justification to claim the North can only be subdued by force.\n\nThe peninsula braces for war. The next message will not be a note, it will be fire."
 JAP_diplomacy.99.a: "Then we will end the threat ourselves."
 JAP_diplomacy.101.t: "Tokyo Demands Taiwan's Submission"
 JAP_diplomacy.101.d: "Japan has delivered a direct demand to Taipei: accept a protectorate framework and place foreign policy and defense coordination under Tokyo's supervision, or face isolation and force. The offer is packaged as security and stability, promising protection from outside threats in exchange for political obedience.\n\nBehind the formal language is a simple message. The island is too important to be left independent, and Japan intends to decide its future."
 JAP_diplomacy.101.a: "Accept the terms. Avoid catastrophe."
 JAP_diplomacy.101.b: "Reject them. Taiwan will not submit."
 JAP_diplomacy.102.t: "Taipei Accepts"
 JAP_diplomacy.102.d: "Taiwan accepts the ultimatum, choosing survival and continuity over open conflict. New agreements bind its external posture to Japan, advisers arrive, and strategic decision making is quietly shifted toward Tokyo.\n\nThe war ends, but sovereignty is narrowed to what the protector permits. The island remains, yet its direction is no longer fully its own."
 JAP_diplomacy.102.a: "Establish the protectorate."
 JAP_diplomacy.103.t: "Taipei Refuses"
 JAP_diplomacy.103.d: "Taiwan rejects Japan's demand and refuses to trade autonomy for a promise of protection. The decision turns diplomatic pressure into a crisis of force, and Tokyo now has the justification to argue that the island can only be secured by conquest.\n\nThe strait becomes a fault line. The next step will not be negotiation, it will be mobilization."
 JAP_diplomacy.103.a: "Then we will take what we need."
 JAP_diplomacy.105.t: "Tokyo Demands a Philippine Protectorate"
 JAP_diplomacy.105.d: "Japan has issued a demand to Manila that leaves little room for misunderstanding. Accept a protectorate framework, align foreign policy and defense planning with Tokyo, and permit Japanese oversight of key security arrangements, or face the consequences of refusal.\n\nThe offer is presented as stability and protection, but its purpose is control of the sea lanes and the gateway between oceans. The Philippines must now choose between submission and confrontation."
 JAP_diplomacy.105.a: "Accept. Preserve the nation from destruction."
 JAP_diplomacy.105.b: "Refuse. We will not be ruled from Tokyo."
 JAP_diplomacy.106.t: "Manila Submits"
 JAP_diplomacy.106.d: "The Philippine government accepts Japan's terms. Agreements are signed, advisers arrive, and the country's external posture is folded into Japan's maritime design.\n\nThe fighting ends, but the cost is sovereignty. The archipelago remains, yet its strategic decisions will be made with Tokyo looking over every shoulder."
 JAP_diplomacy.106.a: "Establish the protectorate."
 JAP_diplomacy.107.t: "Manila Defies Tokyo"
 JAP_diplomacy.107.d: "The Philippines rejects the ultimatum and refuses to trade independence for a promise of protection. The refusal turns Japan's coercion into a test of force, and Tokyo now has every excuse to claim the archipelago must be secured by arms.\n\nThe sea lanes tighten, fleets begin to posture, and the region braces for war. The next move will not be diplomatic."
 JAP_diplomacy.107.a: "Then we will take the archipelago."
 JAP_diplomacy.109.t: "The Straits Ultimatum"
 JAP_diplomacy.109.d: "A Japanese note arrives with the calm tone of inevitability. Kuala Lumpur is offered a protectorate arrangement that binds foreign policy and security coordination to Tokyo's direction, justified as the price of stability in a region where sea lanes and chokepoints decide survival.\n\nThe message is not a request. Japan intends to command the Straits, and Malaya is expected to comply. Acceptance promises protection, refusal invites the full weight of maritime coercion."
 JAP_diplomacy.109.a: "Accept. We cannot fight the tide."
 JAP_diplomacy.109.b: "Refuse. Our sovereignty is not for sale."
 JAP_diplomacy.110.t: "Kuala Lumpur Bows to the Rising Sun"
 JAP_diplomacy.110.d: "Malaysia accepts the terms, trading strategic independence for immediate survival. Agreements are signed, liaison missions arrive, and Tokyo gains the keys to the corridors that connect two oceans.\n\nThe war ends, but the cost is clear. Malaya remains intact, yet its external posture now moves inside Japan's shadow."
 JAP_diplomacy.110.a: "Establish the protectorate."
 JAP_diplomacy.111.t: "Malaya Rejects the Straits Order"
 JAP_diplomacy.111.d: "Malaysia rejects the ultimatum and refuses to let its future be dictated from Tokyo. The decision turns Japan's pressure into a confrontation over the region's most valuable maritime corridor.\n\nTokyo will not tolerate defiance at the Straits. If Malaya will not submit by treaty, Japan will seek submission by force."
 JAP_diplomacy.111.a: "Then we will take the Straits."
 JAP_diplomacy.113.t: "The Archipelago Edict"
 JAP_diplomacy.113.d: "Tokyo has issued a demand to Jakarta aimed at the heart of Indonesia's independence. The proposal is a protectorate framework that places foreign policy and strategic security under Japanese supervision, justified as the only way to guarantee stability across the island chains that bind two oceans together.\n\nThe language is polite, but the intent is absolute. Japan wants the Indonesian archipelago as a controlled corridor, not a sovereign partner. Acceptance means safety under a shadow, refusal means the shadow becomes a storm."
 JAP_diplomacy.113.a: "Accept. We cannot endure a naval stranglehold."
 JAP_diplomacy.113.b: "Refuse. Indonesia will not be commanded."
 JAP_diplomacy.114.t: "Jakarta Accepts the Edict"
 JAP_diplomacy.114.d: "Indonesia accepts the terms and submits to a new maritime reality. Japanese missions arrive to oversee security coordination, basing rights, and external alignment, turning the archipelago into a managed corridor within Tokyo's strategic sphere.\n\nThe war ends, but independence is narrowed to what is permitted. The islands remain Indonesian in name, yet their direction is now constrained by Japanese power."
 JAP_diplomacy.114.a: "Establish the protectorate."
 JAP_diplomacy.115.t: "Indonesia Defies the Archipelago Edict"
 JAP_diplomacy.115.d: "Jakarta rejects Japan's demand and refuses to trade sovereignty for promises of stability. The refusal turns pressure into confrontation, and Tokyo now treats Indonesian independence as an obstacle to be removed rather than a fact to be respected.\n\nThe seas around the archipelago grow tense. If Indonesia will not yield by treaty, Japan will seek to force compliance by arms."
 JAP_diplomacy.115.a: "Then we will seize the corridors."
 JAP_diplomacy.117.t: "The Tonkin Choice"
 JAP_diplomacy.117.d: "Tokyo has delivered a demand to Hanoi designed to lock Vietnam into Japan's maritime order. The offer is a protectorate arrangement in all but name: align foreign policy, accept Japanese security supervision, and permit strategic access that turns Vietnam's coastline into an extension of Japan's reach.\n\nThe message is framed as protection from larger predators, but it is also a leash. Vietnam must decide whether to accept survival under constraint, or resist and invite a war that will be fought along its shores."
 JAP_diplomacy.117.a: "Accept. We will bend, for now."
 JAP_diplomacy.117.b: "Refuse. Vietnam will not be bound."
 JAP_diplomacy.118.t: "Hanoi Accepts Tokyo's Terms"
 JAP_diplomacy.118.d: "Vietnam accepts the ultimatum. Agreements are signed, liaison officers arrive, and Japan gains decisive influence over Vietnam's external alignment and coastal security.\n\nThe war ends, but independence is narrowed. Vietnam remains, yet its strategic posture now moves within a framework written in Tokyo."
 JAP_diplomacy.118.a: "Establish the protectorate."
 JAP_diplomacy.119.t: "Hanoi Rejects the Tonkin Choice"
 JAP_diplomacy.119.d: "Vietnam rejects Japan's demand and refuses to trade sovereignty for a promise of security. The refusal turns coercion into confrontation, and Tokyo now treats Vietnam as a barrier to be removed from its regional design.\n\nThe coastline becomes a front line. If Vietnam will not submit by treaty, Japan will seek submission by force."
 JAP_diplomacy.119.a: "Then we will take the coast."
 JAP_diplomacy.121.t: "The Mekong Ultimatum"
 JAP_diplomacy.121.d: "A Japanese delegation arrives with a proposal that reads less like diplomacy and more like a verdict. Cambodia is offered protection under Tokyo's supervision, with foreign policy coordination and security arrangements placed inside Japan's regional framework.\n\nThe pitch is stability, investment, and safety from stronger neighbors. The reality is subordination. Phnom Penh must choose whether to accept a guarded future or risk becoming a battlefield for refusing."
 JAP_diplomacy.121.a: "Accept. Survival comes first."
 JAP_diplomacy.121.b: "Refuse. Cambodia will not submit."
 JAP_diplomacy.122.t: "Phnom Penh Accepts"
 JAP_diplomacy.122.d: "Cambodia accepts the terms and yields strategic autonomy to avoid a war it cannot win. New agreements bind the state to Japan's direction, and Tokyo's advisers move quickly to secure key ministries and access points.\n\nThe fighting ends before it begins. Cambodia remains sovereign in name, but its path is now constrained by Japanese power."
 JAP_diplomacy.122.a: "Establish the protectorate."
 JAP_diplomacy.123.t: "Cambodia Rejects the Mekong Ultimatum"
 JAP_diplomacy.123.d: "Phnom Penh rejects Japan's demand and refuses to surrender its future to foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats Cambodia as a weak link that must be brought into line.\n\nDiplomacy has failed. If Cambodia will not accept the framework, Japan will seek to impose it by force."
 JAP_diplomacy.123.a: "Then we will compel obedience."
 JAP_diplomacy.125.t: "The Mekong Hinterland Directive"
 JAP_diplomacy.125.d: "Japan has issued a demand to Vientiane that aims to secure the quiet depth behind the coast. The proposal is a protectorate framework that binds Laos to Tokyo's strategic direction, placing foreign policy and security coordination under Japanese supervision.\n\nThe offer is presented as development and protection. The meaning is clear: corridors, rivers, and borders will be managed to serve Japan's wider sphere. Laos must decide whether to accept the directive or gamble on resistance."
 JAP_diplomacy.125.a: "Accept. We cannot stand alone."
 JAP_diplomacy.125.b: "Refuse. Laos will not be dictated to."
 JAP_diplomacy.126.t: "Vientiane Accepts"
 JAP_diplomacy.126.d: "Laos accepts Japan's terms, choosing survival and stability over a war it cannot afford. Agreements are signed, coordination offices are established, and Laos is folded into Tokyo's regional framework as a controlled hinterland.\n\nThe fighting ends, but autonomy shrinks. Laos remains, yet its strategic choices now move within limits set by Japan."
 JAP_diplomacy.126.a: "Establish the protectorate."
 JAP_diplomacy.127.t: "Laos Rejects the Directive"
 JAP_diplomacy.127.d: "Vientiane rejects Japan's demand and refuses to surrender its future to external supervision. The refusal turns coercion into confrontation, and Tokyo now treats Laos as an obstacle to corridor control rather than a partner to be courted.\n\nIf Laos will not accept the framework by treaty, Japan will seek to impose it by force."
 JAP_diplomacy.127.a: "Then we will bring them to heel."
 JAP_diplomacy.129.t: "The Southern Anchor Ultimatum"
 JAP_diplomacy.129.d: "Tokyo has delivered an ultimatum to Canberra that treats Australia not as a distant continent, but as the keystone of the southern Pacific. The terms are stark: accept a protectorate framework, align foreign policy and defense planning with Japan, and permit the basing and access arrangements that would lock the South Pacific under Tokyo's reach.\n\nThe offer is dressed as stability and guaranteed security. The reality is strategic submission. Australia must decide whether to accept life under Japanese shadow, or prepare to contest the ocean itself."
 JAP_diplomacy.129.a: "Accept. We cannot win a war for the Pacific."
 JAP_diplomacy.129.b: "Refuse. Australia will not bow."
 JAP_diplomacy.130.t: "Canberra Accepts the Anchor Terms"
 JAP_diplomacy.130.d: "Australia accepts Japan's ultimatum, choosing immediate survival over a continental war it cannot risk. Agreements are signed, strategic access is granted, and Japan gains the southern anchor it sought to dominate the wider ocean.\n\nThe guns fall silent, but the balance of the Pacific shifts overnight. Australia remains on the map, yet its strategic decisions now move within limits set in Tokyo."
 JAP_diplomacy.130.a: "Establish the protectorate."
 JAP_diplomacy.131.t: "Australia Rejects the Ultimatum"
 JAP_diplomacy.131.d: "Canberra rejects Japan's demand and refuses to surrender the continent's independence to a foreign mandate. The refusal turns Tokyo's pressure into a direct challenge, and Japan now frames Australia as the final obstacle to a Pacific order under its control.\n\nA contest for the ocean is unavoidable. If Australia will not accept the framework by treaty, Japan will attempt to impose it by force."
 JAP_diplomacy.131.a: "Then we will secure the south by arms."
 JAP_diplomacy.133.t: "The Tasman Line Demand"
 JAP_diplomacy.133.d: "Tokyo has delivered a demand to Wellington aimed at closing the last open flank in the South Pacific. The proposal is a protectorate framework that binds New Zealand's foreign policy and defense posture to Japan's direction, justified as the cost of stability in an ocean that is being reorganized by force.\n\nThe language speaks of protection and partnership, but the structure is control. New Zealand must choose between a constrained peace under Japanese shadow or a war for independence across the sea."
 JAP_diplomacy.133.a: "Accept. We will endure, and survive."
 JAP_diplomacy.133.b: "Refuse. We will not be absorbed."
 JAP_diplomacy.134.t: "Wellington Accepts the Tasman Line"
 JAP_diplomacy.134.d: "New Zealand accepts Japan's terms, trading strategic autonomy for an end to hostilities. Agreements are signed, access arrangements are established, and Tokyo gains a secure southern outpost to shape the wider ocean.\n\nThe war ends, but independence is narrowed. New Zealand remains, yet its external posture now moves within boundaries drawn in Tokyo."
 JAP_diplomacy.134.a: "Establish the protectorate."
 JAP_diplomacy.135.t: "Wellington Rejects the Demand"
 JAP_diplomacy.135.d: "New Zealand rejects Japan's ultimatum and refuses to surrender its future to a foreign mandate. The refusal turns pressure into confrontation, and Tokyo now treats Wellington's independence as a threat to its southern perimeter.\n\nThe Pacific hardens into front lines. If New Zealand will not accept the framework by treaty, Japan will attempt to impose it by force."
 JAP_diplomacy.135.a: "Then we will take the southern outpost."
 JAP_diplomacy.137.t: "The Irrawaddy Gate Ultimatum"
 JAP_diplomacy.137.d: "Tokyo has issued a demand to Naypyidaw aimed at securing Myanmar as the land bridge between oceans. The terms amount to a protectorate framework: align foreign policy with Japan, accept Japanese security supervision, and grant the access needed to control corridors from the Bay of Bengal into Southeast Asia.\n\nThe offer is presented as stability and development. The truth is strategic capture. Myanmar must decide whether to accept a controlled peace or face a war that will turn its gateways into battlefields."
 JAP_diplomacy.137.a: "Accept. We cannot withstand this pressure."
 JAP_diplomacy.137.b: "Refuse. We will not be reduced to a corridor."
 JAP_diplomacy.138.t: "Myanmar Accepts the Gate Terms"
 JAP_diplomacy.138.d: "Myanmar accepts Japan's ultimatum, trading strategic autonomy for an end to hostilities and the promise of order. Agreements are signed, liaison missions arrive, and Japan gains a decisive hand over Myanmar's external alignment and security posture.\n\nThe fighting ends, but the price is sovereignty. Myanmar remains, yet its gateways now serve a regional design written in Tokyo."
 JAP_diplomacy.138.a: "Establish the protectorate."
 JAP_diplomacy.139.t: "Myanmar Rejects the Ultimatum"
 JAP_diplomacy.139.d: "Naypyidaw rejects Japan's demand and refuses to surrender its future to external supervision. The refusal turns pressure into confrontation, and Tokyo now frames Myanmar as an obstacle to corridor control that must be brought into line.\n\nIf Myanmar will not accept the framework by treaty, Japan will seek to impose it by force. The gate will be secured one way or another."
 JAP_diplomacy.139.a: "Then we will take the gate."
 JAP_diplomacy.141.t: "The Northern Highlands Ultimatum"
 JAP_diplomacy.141.d: "Japan has turned its attention to Kachin, the rugged northern highlands that control passes, resources, and the approaches to the wider region. Tokyo's demand is presented as protection and recognition, but the structure is a protectorate: align externally with Japan, accept security supervision, and allow strategic access that secures the frontier.\n\nFor Kachin, this is a choice between autonomy in name and annihilation in practice. Acceptance offers a shield. Refusal invites a war fought in mountains and villages."
 JAP_diplomacy.141.a: "Accept. We need a patron to survive."
 JAP_diplomacy.141.b: "Refuse. We will not trade one master for another."
 JAP_diplomacy.143.t: "Kachin Accepts Japanese Protection"
 JAP_diplomacy.143.d: "Kachin accepts the terms, choosing survival and stability over a fight it cannot sustain alone. Agreements are signed, liaison offices are established, and Japan gains a firm hold over the northern highlands and their strategic corridors.\n\nThe conflict ends, but Kachin's freedom shrinks to what is permitted. The mountains remain, yet their future is now tied to Tokyo."
 JAP_diplomacy.143.a: "Establish the protectorate."
 JAP_diplomacy.144.t: "Kachin Rejects the Ultimatum"
 JAP_diplomacy.144.d: "Kachin rejects Japan's demand and refuses to submit to an external mandate. The refusal turns coercion into confrontation, and Tokyo now frames the highlands as a security problem that must be resolved by force.\n\nIf Kachin will not accept protection by treaty, Japan will impose control by arms. The mountains will not stay neutral."
 JAP_diplomacy.144.a: "Then we will take the highlands."
 JAP_diplomacy.145.t: "The Shan Corridor Demand"
 JAP_diplomacy.145.d: "Japan has delivered its terms to the Wa authorities, targeting the borderlands that sit on smuggling routes, mountain passes, and the arteries of the interior. The offer is framed as recognition and protection, but it is a protectorate arrangement: align externally with Tokyo, accept Japanese security supervision, and permit access that secures the corridor.\n\nFor Wa, the choice is brutal. Submit and keep local power under a new umbrella, or refuse and face a war that will not respect mountains or militias."
 JAP_diplomacy.145.a: "Accept. Better a shield than annihilation."
 JAP_diplomacy.145.b: "Refuse. We will not be absorbed."
 JAP_diplomacy.146.t: "Wa Accepts Japanese Protection"
 JAP_diplomacy.146.d: "Wa accepts Japan's terms, trading strategic independence for survival and formal recognition under a stronger patron. Liaison teams arrive, routes are secured, and the borderlands are folded into Japan's regional framework.\n\nThe fighting ends, but autonomy narrows. Wa retains local authority, yet its external direction now answers to Tokyo."
 JAP_diplomacy.146.a: "Establish the protectorate."
 JAP_diplomacy.147.t: "Wa Rejects the Demand"
 JAP_diplomacy.147.d: "Wa rejects Japan's ultimatum and refuses to place its territory under foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats the borderlands as an uncontrolled gap in its corridor strategy.\n\nIf Wa will not accept the framework by treaty, Japan will impose control by force. The mountains will be contested."
 JAP_diplomacy.147.a: "Then we will secure the corridor."
 JAP_diplomacy.148.t: "The Shan Gate Ultimatum"
 JAP_diplomacy.148.d: "Japan has issued its demand to the authorities of South Shan State, targeting the highland routes that connect the interior to the wider region. The proposal is a protectorate framework: align foreign dealings with Tokyo, accept Japanese security supervision, and permit strategic access to secure roads, passes, and supply corridors.\n\nThe offer promises protection and recognition. The meaning is control. South Shan must decide whether to accept a managed future under Japan's umbrella or risk a war fought across its hills and valleys."
 JAP_diplomacy.148.a: "Accept. We cannot afford annihilation."
 JAP_diplomacy.148.b: "Refuse. We will not be reduced to a corridor."
 JAP_diplomacy.149.t: "South Shan Yields"
 JAP_diplomacy.149.d: "South Shan State accepts Japan's terms. Liaison offices are established, routes are secured, and the region is folded into Tokyo's corridor strategy as a controlled gate rather than an independent actor.\n\nThe fighting ends, but autonomy contracts. Local authority remains, yet the strategic direction now answers to Japan."
 JAP_diplomacy.149.a: "Establish the protectorate."
 JAP_diplomacy.150.t: "South Shan Rejects the Ultimatum"
 JAP_diplomacy.150.d: "South Shan State rejects Japan's demand and refuses to place its future under foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats the region as a dangerous gap in its strategic perimeter.\n\nIf South Shan will not accept the framework by treaty, Japan will impose it by force. The gate will be secured."
 JAP_diplomacy.150.a: "Then we will take the gate by arms."
 JAP_diplomacy.151.t: "The Salween Mandate"
 JAP_diplomacy.151.d: "Japan has turned its gaze to Karen State, where river valleys and border routes can open or close the southern approaches. Tokyo's demand is presented as protection and recognition, but it is a protectorate framework: align external dealings with Japan, accept security supervision, and grant access that secures the Salween corridor.\n\nThe offer promises stability in a region of fractured authority. The cost is obedience. Karen State must choose between a guarded peace under Japan's umbrella or a war that will scorch its crossings and settlements."
 JAP_diplomacy.151.a: "Accept. We will live to see tomorrow."
 JAP_diplomacy.151.b: "Refuse. We will not be ruled."
 JAP_diplomacy.152.t: "Karen State Submits"
 JAP_diplomacy.152.d: "Karen State accepts Japan's terms, trading strategic autonomy for survival and an end to immediate pressure. Liaison missions arrive, routes are secured, and the region is folded into Tokyo's perimeter as a controlled corridor rather than an independent actor.\n\nThe conflict ends, but the boundaries of freedom shrink. Karen authority remains local, yet the strategic direction now answers to Japan."
 JAP_diplomacy.152.a: "Establish the protectorate."
 JAP_diplomacy.153.t: "Karen State Rejects the Mandate"
 JAP_diplomacy.153.d: "Karen State rejects Japan's demand and refuses to surrender its future to foreign supervision. The refusal turns coercion into confrontation, and Tokyo now treats the Salween crossings as a strategic problem to be solved by force.\n\nIf Karen State will not accept the framework by treaty, Japan will impose it by arms. The corridor will be secured."
 JAP_diplomacy.153.a: "Then we will seize the crossings."
 JAP_diplomacy.154.t: "The Palau Anchorage Demand"
 JAP_diplomacy.154.d: "Tokyo has delivered its demand to Palau, a small state sitting on a large piece of the ocean. The terms are framed as protection and guaranteed prosperity, but the structure is a protectorate: align foreign policy with Japan, accept security supervision, and grant basing rights that turn Palau into an Imperial forward anchorage.\n\nThe offer promises safety from storms both political and military. The cost is sovereignty. Palau must choose between submission under the Rising Sun or a fight it cannot sustain against the sea power of a great state."
 JAP_diplomacy.154.a: "Accept. Better a protector than a grave."
 JAP_diplomacy.154.b: "Refuse. We will not surrender our independence."
 JAP_diplomacy.155.t: "Palau Accepts Japanese Protection"
 JAP_diplomacy.155.d: "Palau accepts Japan's terms. Agreements are signed, access is granted, and the islands become a disciplined node in Tokyo's network of ports and airfields.\n\nThe crisis ends without battle, but the change is real. Palau remains in name, yet its external direction now follows Japan's compass."
 JAP_diplomacy.155.a: "Establish the protectorate."
 JAP_diplomacy.156.t: "Palau Rejects the Demand"
 JAP_diplomacy.156.d: "Palau rejects Japan's ultimatum and refuses to trade sovereignty for promises of protection. The refusal turns Tokyo's pressure into a question of force, and Japan now treats the islands as an unsecured gap in its ocean perimeter.\n\nIf Palau will not accept the framework by treaty, Japan will impose control by arms. The anchorage will be secured."
 JAP_diplomacy.156.a: "Then we will take the anchorage."
 JAP_diplomacy.157.t: "The Micronesian Chain Ultimatum"
 JAP_diplomacy.157.d: "Japan has issued its demand to Micronesia, viewing the islands not as scattered communities but as a chain of stepping stones across the central Pacific. The offer is framed as protection and investment, yet the structure is a protectorate: align foreign policy with Tokyo, accept security supervision, and grant access that turns the islands into waypoints for Japan's fleet and air power.\n\nThe message is simple. These waters will be organized under one authority. Micronesia must choose between a managed peace beneath Japan's umbrella or a confrontation it cannot hope to sustain."
 JAP_diplomacy.157.a: "Accept. We cannot resist the tide."
 JAP_diplomacy.157.b: "Refuse. We will not become an outpost."
 JAP_diplomacy.158.t: "Micronesia Accepts the Chain"
 JAP_diplomacy.158.d: "Micronesia accepts Japan's terms. Agreements are signed, access is granted, and the islands become a controlled corridor of ports, airfields, and surveillance nodes within Tokyo's maritime perimeter.\n\nThe crisis ends without battle, but sovereignty narrows. Micronesia remains, yet its external direction now follows Japan's strategic compass."
 JAP_diplomacy.158.a: "Establish the protectorate."
 JAP_diplomacy.159.t: "Micronesia Rejects the Ultimatum"
 JAP_diplomacy.159.d: "Micronesia rejects Japan's demand and refuses to surrender its future to foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats the island chain as a gap in its Pacific network that must be closed.\n\nIf Micronesia will not accept the framework by treaty, Japan will impose control by force. The chain will be secured."
 JAP_diplomacy.159.a: "Then we will take the stepping stones."
 JAP_diplomacy.160.t: "The Nauru Outpost Demand"
 JAP_diplomacy.160.d: "Tokyo has delivered its demand to Nauru, treating the island as a pin in the map that can still anchor surveillance, refueling, and reach across open water. The offer is framed as protection and guaranteed support, but it is a protectorate framework: align foreign policy with Japan, accept security supervision, and grant access that turns Nauru into an Imperial outpost.\n\nFor Nauru, the choice is stark. Submit and survive beneath a greater power, or refuse and risk becoming the battleground that proves Japan's point."
 JAP_diplomacy.160.a: "Accept. We cannot stand alone."
 JAP_diplomacy.160.b: "Refuse. We will not be reduced to a waypoint."
 JAP_diplomacy.161.t: "Nauru Accepts Japanese Protection"
 JAP_diplomacy.161.d: "Nauru accepts Japan's terms. Agreements are signed, access is granted, and the island becomes a small but vital node in Tokyo's Pacific network.\n\nThe crisis ends without battle, but sovereignty narrows. Nauru remains, yet its external direction now follows Japan's strategic line."
 JAP_diplomacy.161.a: "Establish the protectorate."
 JAP_diplomacy.162.t: "Nauru Rejects the Demand"
 JAP_diplomacy.162.d: "Nauru rejects Japan's ultimatum and refuses to trade independence for promises of protection. The refusal turns pressure into confrontation, and Tokyo now treats the island as an unsecured gap in its ocean perimeter.\n\nIf Nauru will not accept the framework by treaty, Japan will impose control by force. The outpost will be secured."
 JAP_diplomacy.162.a: "Then we will take the island."
 JAP_diplomacy.163.t: "The Equatorial Line Ultimatum"
 JAP_diplomacy.163.d: "Japan has issued its demand to Kiribati, a state scattered across the equator like markers on a navigator's chart. Tokyo's proposal is framed as protection and development, but it is a protectorate framework: align foreign policy with Japan, accept security supervision, and grant access that turns Kiribati into a chain of waypoints for surveillance and naval reach.\n\nThe message is simple. In the new Pacific order, there are no empty spaces. Kiribati must choose between submission beneath Japan's umbrella or confrontation against a power that intends to own the sea lanes."
 JAP_diplomacy.163.a: "Accept. We cannot resist the ocean's new master."
 JAP_diplomacy.163.b: "Refuse. We will not be absorbed into an empire."
 JAP_diplomacy.164.t: "Kiribati Accepts the Equatorial Line"
 JAP_diplomacy.164.d: "Kiribati accepts Japan's terms. Agreements are signed, access is granted, and the scattered atolls become a quiet but valuable part of Tokyo's Pacific network.\n\nThe crisis ends without battle, but sovereignty narrows. Kiribati remains, yet its external direction now follows Japan's compass."
 JAP_diplomacy.164.a: "Establish the protectorate."
 JAP_diplomacy.165.t: "Kiribati Rejects the Ultimatum"
 JAP_diplomacy.165.d: "Kiribati rejects Japan's ultimatum and refuses to surrender its future to foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats the equatorial chain as a gap in its maritime perimeter.\n\nIf Kiribati will not accept the framework by treaty, Japan will impose control by force. The line will be secured."
 JAP_diplomacy.165.a: "Then we will take the chain."
 JAP_diplomacy.166.t: "The Atoll Bastion Demand"
 JAP_diplomacy.166.d: "Tokyo has issued its demand to the Marshall Islands, viewing the atolls as natural fortresses that can host airfields, logistics, and the instruments of sea control. The offer is framed as protection and guaranteed support, but it is a protectorate framework: align foreign policy with Japan, accept security supervision, and grant access that turns the Marshalls into bastions of Japan's central Pacific perimeter.\n\nThe message is clear. These islands will not be left as neutral dots on a chart. The Marshalls must choose between a managed peace beneath Japan's umbrella or a war fought over coral and runway."
 JAP_diplomacy.166.a: "Accept. We cannot survive a siege."
 JAP_diplomacy.166.b: "Refuse. We will not become a fortress for another power."
 JAP_diplomacy.167.t: "The Marshalls Yield"
 JAP_diplomacy.167.d: "The Marshall Islands accept Japan's terms. Agreements are signed, access is granted, and the atolls become disciplined bastions within Tokyo's ocean network.\n\nThe crisis ends without battle, but sovereignty narrows. The Marshalls remain, yet their external direction now follows Japan's perimeter plan."
 JAP_diplomacy.167.a: "Establish the protectorate."
 JAP_diplomacy.168.t: "The Marshalls Reject the Demand"
 JAP_diplomacy.168.d: "The Marshall Islands reject Japan's ultimatum and refuse to surrender their future to foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats the atolls as an unsecured gap in its central Pacific defense line.\n\nIf the Marshalls will not accept the framework by treaty, Japan will impose control by force. The bastions will be secured."
 JAP_diplomacy.168.a: "Then we will take the atolls."
 JAP_diplomacy.169.t: "The Reefline Ultimatum"
 JAP_diplomacy.169.d: "Japan has issued its demand to Tuvalu, a thin chain of reefs that still matters in an ocean measured by reach and refueling points. Tokyo offers protection and support, but the structure is a protectorate framework: align foreign policy with Japan, accept security supervision, and grant access that turns Tuvalu into a waypoint in Japan's southern perimeter.\n\nThe message is brutal in its simplicity. There will be no neutral islands in a contested Pacific. Tuvalu must choose between submission beneath Japan's umbrella or a confrontation that would drown a small state in a great power war."
 JAP_diplomacy.169.a: "Accept. We cannot withstand a storm of steel."
 JAP_diplomacy.169.b: "Refuse. We will not surrender our flag."
 JAP_diplomacy.170.t: "Tuvalu Accepts Japanese Protection"
 JAP_diplomacy.170.d: "Tuvalu accepts Japan's terms. Agreements are signed, access is granted, and the islands become a quiet node in Tokyo's maritime network.\n\nThe crisis ends without battle, but sovereignty narrows. Tuvalu remains, yet its external direction now follows Japan's perimeter plan."
 JAP_diplomacy.170.a: "Establish the protectorate."
 JAP_diplomacy.171.t: "Tuvalu Rejects the Ultimatum"
 JAP_diplomacy.171.d: "Tuvalu rejects Japan's ultimatum and refuses to trade independence for promises of protection. The refusal turns pressure into confrontation, and Tokyo now treats the reefline as an unsecured gap in its southern chain.\n\nIf Tuvalu will not accept the framework by treaty, Japan will impose control by force. The waypoint will be secured."
 JAP_diplomacy.171.a: "Then we will take the islands."
 JAP_diplomacy.172.t: "The Solomon Barrier Ultimatum"
 JAP_diplomacy.172.d: "Tokyo has issued its demand to the Solomon Islands, viewing the chain as a natural barrier that can seal the southwest Pacific. The offer is framed as protection and development, but it is a protectorate framework: align foreign policy with Japan, accept security supervision, and grant basing access that turns the Solomons into a fortified screen for Japan's maritime perimeter.\n\nThe message is clear. These islands will either serve Japan's order or be treated as an enemy foothold. The Solomons must choose between submission beneath the Rising Sun or a war fought across jungle airstrips and narrow seas."
 JAP_diplomacy.172.a: "Accept. We cannot survive a blockade."
 JAP_diplomacy.172.b: "Refuse. We will not become a fortress for another empire."
 JAP_diplomacy.173.t: "The Solomons Yield"
 JAP_diplomacy.173.d: "The Solomon Islands accept Japan's terms. Agreements are signed, access is granted, and the chain becomes a disciplined barrier of ports, airfields, and patrol zones under Tokyo's direction.\n\nThe crisis ends without battle, but sovereignty narrows. The Solomons remain, yet their external alignment now follows Japan's perimeter plan."
 JAP_diplomacy.173.a: "Establish the protectorate."
 JAP_diplomacy.174.t: "The Solomons Reject the Ultimatum"
 JAP_diplomacy.174.d: "The Solomon Islands reject Japan's demand and refuse to surrender their future to foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats the chain as a dangerous gap in its southwest Pacific screen.\n\nIf the Solomons will not accept the framework by treaty, Japan will impose control by force. The barrier will be secured."
 JAP_diplomacy.174.a: "Then we will seize the chain."
 JAP_diplomacy.175.t: "The New Guinea Bastion Ultimatum"
 JAP_diplomacy.175.d: "Japan has issued its demand to Papua New Guinea, treating the island as a continental bastion that can dominate the approaches between Southeast Asia and the Pacific. The offer is framed as protection and guaranteed support, but it is a protectorate framework: align foreign policy with Tokyo, accept security supervision, and grant basing access that turns New Guinea into a fortress of air power, logistics, and forward defense.\n\nThe message leaves little doubt. Japan intends to anchor the southern theatre here. Papua New Guinea must choose between submission beneath Japan's shield or a war that will turn its coasts and highlands into front lines."
 JAP_diplomacy.175.a: "Accept. We cannot afford to become a battlefield."
 JAP_diplomacy.175.b: "Refuse. We will not be made into a fortress for another power."
 JAP_diplomacy.176.t: "Port Moresby Accepts"
 JAP_diplomacy.176.d: "Papua New Guinea accepts Japan's terms. Agreements are signed, access is granted, and the island becomes a disciplined bastion within Tokyo's southern perimeter, built around airfields, ports, and logistics hubs.\n\nThe crisis ends without battle, but sovereignty narrows. Papua New Guinea remains, yet its strategic direction now follows Japan's fortress plan."
 JAP_diplomacy.176.a: "Establish the protectorate."
 JAP_diplomacy.177.t: "Papua New Guinea Rejects the Ultimatum"
 JAP_diplomacy.177.d: "Papua New Guinea rejects Japan's demand and refuses to surrender its future to foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats the island as the key obstacle to securing the southern theatre.\n\nIf Papua New Guinea will not accept the framework by treaty, Japan will impose control by force. The bastion will be taken."
 JAP_diplomacy.177.a: "Then we will seize the bastion."
 JAP_diplomacy.178.t: "The South Pacific Chain Demand"
 JAP_diplomacy.178.d: "Tokyo has issued its demand to Vanuatu, treating the islands as another link in the chain that can seal the southwest Pacific. The offer is framed as protection and development aid, but it is a protectorate framework: align foreign policy with Japan, accept security supervision, and grant access that turns Vanuatu into a waypoint for patrols, refueling, and regional control.\n\nThe message is clear. Japan is building a perimeter, island by island. Vanuatu must choose between a managed peace under the Rising Sun or a confrontation it cannot hope to sustain."
 JAP_diplomacy.178.a: "Accept. We cannot fight an empire at sea."
 JAP_diplomacy.178.b: "Refuse. We will not be absorbed."
 JAP_diplomacy.179.t: "Vanuatu Accepts Japanese Protection"
 JAP_diplomacy.179.d: "Vanuatu accepts Japan's terms. Agreements are signed, access is granted, and the islands become a quiet but useful node within Tokyo's southern perimeter.\n\nThe crisis ends without battle, but sovereignty narrows. Vanuatu remains, yet its external direction now follows Japan's strategic line."
 JAP_diplomacy.179.a: "Establish the protectorate."
 JAP_diplomacy.180.t: "Vanuatu Rejects the Demand"
 JAP_diplomacy.180.d: "Vanuatu rejects Japan's ultimatum and refuses to trade independence for promises of protection. The refusal turns pressure into confrontation, and Tokyo now treats the islands as an unsecured gap in its southwest Pacific chain.\n\nIf Vanuatu will not accept the framework by treaty, Japan will impose control by force. The link will be secured."
 JAP_diplomacy.180.a: "Then we will take the islands."
 JAP_diplomacy.181.t: "The South Pacific Keystone Ultimatum"
 JAP_diplomacy.181.d: "Japan has issued its demand to Fiji, treating the islands as a hub that can support fleet logistics and air operations across a wide arc of the South Pacific. The offer is framed as protection and guaranteed support, but it is a protectorate framework: align foreign policy with Tokyo, accept security supervision, and grant basing access that turns Fiji into a keystone of Japan's southern perimeter.\n\nThe message is unmistakable. Japan is not seeking friends, it is building an order. Fiji must choose between a managed peace beneath Japan's umbrella or a confrontation that will be decided by sea power."
 JAP_diplomacy.181.a: "Accept. We cannot afford to be made an example."
 JAP_diplomacy.181.b: "Refuse. Fiji will not submit."
 JAP_diplomacy.182.t: "Fiji Accepts the Keystone Terms"
 JAP_diplomacy.182.d: "Fiji accepts Japan's ultimatum. Agreements are signed, access is granted, and the islands become a central node in Tokyo's South Pacific network of ports, airfields, and patrol zones.\n\nThe crisis ends without battle, but sovereignty narrows. Fiji remains, yet its external direction now follows Japan's perimeter plan."
 JAP_diplomacy.182.a: "Establish the protectorate."
 JAP_diplomacy.183.t: "Fiji Rejects the Ultimatum"
 JAP_diplomacy.183.d: "Fiji rejects Japan's demand and refuses to surrender its future to foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats the islands as the final gap in a southern perimeter it intends to close.\n\nIf Fiji will not accept the framework by treaty, Japan will impose control by force. The keystone will be secured."
 JAP_diplomacy.183.a: "Then we will take the hub."
 JAP_diplomacy.184.t: "The Samoa Line Ultimatum"
 JAP_diplomacy.184.d: "Tokyo has issued its demand to Samoa, treating the islands as a pivot between the central Pacific and the southern approaches. The offer is framed as protection and guaranteed support, but it is a protectorate framework: align foreign policy with Japan, accept security supervision, and grant access that turns Samoa into a waypoint in Japan's expanding ocean perimeter.\n\nThe message is blunt. Japan is drawing lines across the sea, and Samoa sits on one of them. Acceptance offers safety under a greater power, refusal risks becoming the lesson that convinces others."
 JAP_diplomacy.184.a: "Accept. We will survive, even if we must submit."
 JAP_diplomacy.184.b: "Refuse. Samoa will not bow."
 JAP_diplomacy.185.t: "Samoa Accepts Japanese Protection"
 JAP_diplomacy.185.d: "Samoa accepts Japan's ultimatum. Agreements are signed, access is granted, and the islands become a quiet but useful node in Tokyo's Pacific network.\n\nThe crisis ends without battle, but sovereignty narrows. Samoa remains, yet its external direction now follows Japan's strategic line."
 JAP_diplomacy.185.a: "Establish the protectorate."
 JAP_diplomacy.186.t: "Samoa Rejects the Ultimatum"
 JAP_diplomacy.186.d: "Samoa rejects Japan's demand and refuses to trade independence for promises of protection. The refusal turns pressure into confrontation, and Tokyo now treats the islands as an unsecured gap in its ocean perimeter.\n\nIf Samoa will not accept the framework by treaty, Japan will impose control by force. The line will be secured."
 JAP_diplomacy.186.a: "Then we will take the islands."
 JAP_diplomacy.187.t: "The Tongan Crown Demand"
 JAP_diplomacy.187.d: "Tokyo has issued its demand to Tonga, a kingdom whose harbors and sea lanes sit on the southern arc of the Pacific. The offer is framed as protection and partnership, but it is a protectorate framework: align foreign policy with Japan, accept security supervision, and grant access that turns Tonga into a waypoint within Japan's expanding maritime perimeter.\n\nThe message is clear. Japan is building an ocean order that leaves no room for independent pivots. Tonga must choose between a guarded peace beneath Japanese shadow or a confrontation decided by fleets."
 JAP_diplomacy.187.a: "Accept. We will keep the crown, even under a shadow."
 JAP_diplomacy.187.b: "Refuse. Tonga will not submit."
 JAP_diplomacy.188.t: "Tonga Accepts Japanese Protection"
 JAP_diplomacy.188.d: "Tonga accepts Japan's terms. Agreements are signed, access is granted, and the kingdom becomes a disciplined node in Tokyo's southern network.\n\nThe crisis ends without battle, but sovereignty narrows. Tonga remains, yet its external direction now follows Japan's strategic line."
 JAP_diplomacy.188.a: "Establish the protectorate."
 JAP_diplomacy.189.t: "Tonga Rejects the Demand"
 JAP_diplomacy.189.d: "Tonga rejects Japan's ultimatum and refuses to place its future under foreign supervision. The refusal turns pressure into confrontation, and Tokyo now treats the kingdom as an unsecured gap in its southern arc.\n\nIf Tonga will not accept the framework by treaty, Japan will impose control by force. The waypoint will be secured."
 JAP_diplomacy.189.a: "Then we will take the islands."
 JAP_diplomacy.190.t: "Notice to Washington: Pacific Withdrawal"
 JAP_diplomacy.190.d: "Tokyo has delivered a formal demand to Washington calling for the transfer of key American held Pacific islands. The message is blunt: foreign footholds in Japan's ocean perimeter are no longer tolerated, and these outposts must be relinquished to prevent further escalation.\n\nThe demand is framed as a chance to avoid war, but it is also a test of resolve. Accept and concede the stepping stones of power, or refuse and risk turning the Pacific into a battlefield between giants."
 JAP_diplomacy.190.a: "Accept the transfer."
 JAP_diplomacy.190.b: "Refuse. The Pacific is not theirs to claim."
 JAP_diplomacy.191.t: "Washington Yields the Outposts"
 JAP_diplomacy.191.d: "Against expectation, the United States accepts the demand. The islands are transferred, bases are evacuated, and Japan's maritime perimeter expands in a single stroke.\n\nThe crisis ends without war, but the meaning is unmistakable. A great power has stepped back, and the Pacific balance shifts toward Tokyo."
 JAP_diplomacy.191.a: "Secure the islands."
 JAP_diplomacy.192.t: "Washington Refuses"
 JAP_diplomacy.192.d: "The United States rejects Japan's demand and refuses to surrender its Pacific footholds. The refusal turns Tokyo's ultimatum into a direct confrontation between powers, and Japan now has both justification and motive to seek the outposts by force.\n\nThe Pacific tightens into front lines. If these islands will not be ceded by treaty, they will be taken by war."
 JAP_diplomacy.192.a: "Then we claim them by force."
 JAP_diplomacy.193.t: "Ultimatum to Paris: The Pacific Must Be Cleared"
 JAP_diplomacy.193.d: "Tokyo has delivered a formal demand to Paris for the transfer of France's Pacific island holdings. The note is wrapped in polite language, yet its meaning is unmistakable: distant empires will no longer keep footholds inside Japan's ocean perimeter.\n\nJapan offers a narrow path to avoid escalation. France can withdraw with ink and signatures, or refuse and accept that the dispute will be settled by fleets rather than diplomats."
 JAP_diplomacy.193.a: "Accept the transfer."
 JAP_diplomacy.193.b: "Refuse. France will not be pushed out."
 JAP_diplomacy.194.t: "Paris Withdraws from the Pacific"
 JAP_diplomacy.194.d: "France accepts Japan's demand. Flags are lowered, garrisons are ordered out, and the islands are transferred to Tokyo's control.\n\nThe crisis ends without war, but the message echoes across the world. Japan is not negotiating a sphere, it is enforcing one."
 JAP_diplomacy.194.a: "Secure the islands."
 JAP_diplomacy.195.t: "Paris Refuses"
 JAP_diplomacy.195.d: "France rejects Japan's ultimatum and refuses to surrender its Pacific holdings. The refusal turns Tokyo's demand into a direct confrontation, and Japan now has the justification to claim the islands by force.\n\nThe ocean grows smaller when great powers collide. If France will not withdraw by treaty, Japan will attempt to drive it out by war."
 JAP_diplomacy.195.a: "Then we will seize them."
 JAP_diplomacy.196.t: "Notice to London: Relinquish the Pacific Holding"
 JAP_diplomacy.196.d: "Tokyo has delivered a formal demand to London for the transfer of Britain's remaining Pacific island holding. The note speaks of regional stability and the end of distant interference, but its purpose is plain: Japan intends to clear foreign flags from the ocean it now claims to police.\n\nBritain is offered a choice between an orderly withdrawal and an unnecessary war far from home. Accept, and the matter ends on paper. Refuse, and the Pacific becomes yet another theatre where empires test each other's will."
 JAP_diplomacy.196.a: "Accept the transfer."
 JAP_diplomacy.196.b: "Refuse. Britain will not be driven out."
 JAP_diplomacy.197.t: "London Steps Back"
 JAP_diplomacy.197.d: "The United Kingdom accepts Japan's demand. The territory is transferred, the flag is lowered, and Tokyo adds another piece to its enforced maritime perimeter.\n\nThe crisis ends without war, but the symbolism is heavy. An old sea power has yielded ground, and Japan's claim to the Pacific grows bolder with every concession."
 JAP_diplomacy.197.a: "Secure the territory."
 JAP_diplomacy.198.t: "London Refuses the Demand"
 JAP_diplomacy.198.d: "Britain rejects Japan's ultimatum and refuses to surrender its Pacific holding. The refusal turns Tokyo's demand into a direct challenge, and Japan now has both motive and pretext to seize the territory by force.\n\nDiplomacy has reached its limit. If Britain will not withdraw by treaty, Japan will attempt to remove it by war."
 JAP_diplomacy.198.a: "Then we will take it."
 JAP_diplomacy.199.t: "Japanese Channels Expand in Pyongyang"
 JAP_diplomacy.199.d: "Japanese policy toward the North has entered a new phase. Through intermediaries, intelligence contacts, and carefully managed pressure, Tokyo has opened channels inside our political environment that were previously limited or closed.\n\nThis does not mean trust, and it does not mean alignment. It means Japan now has a temporary opportunity to shape decisions, influence factions, and test our resolve from within as well as from abroad."
 JAP_diplomacy.199.a: "We will watch these channels closely."
 JAP_diplomacy.200.t: "Sakhalin and the Kurils Lost"
 JAP_diplomacy.200.d: "Russian forces have retaken full control of Sakhalin and the Kuril Islands, reversing all gains made during the campaign. The operation has collapsed, and Tokyo can no longer sustain the effort. A ceasefire is the only remaining option.\n\nThe failure will carry consequences. Public confidence in the government's military judgment has been shaken, and the political cost of this misadventure will be felt for years."
 JAP_diplomacy.200.a: "We have no choice but to accept defeat."
 JAP_failed_sakhalin_war: "Aftermath of the Sakhalin War"
 JAP_failed_sakhalin_war_desc: "The failed military campaign over Sakhalin and the Kuril Islands has left deep scars on Japan's political landscape. Public trust in the government's strategic competence has eroded, military morale has suffered, and the diplomatic fallout continues to constrain Tokyo's foreign policy options."
 JAP_mars_colony1: "Mars Colony Amaterasu"
 JAP_mars_colony1_desc: "Named after Amaterasu, the sun goddess who illuminates the heavens, Mars Colony 'Amaterasu' stands as a radiant symbol of Japan's unity and leadership. Its presence inspires confidence at home and respect abroad."
 JAP_mars_colony2: "Mars Colony Kagutsuchi"
 JAP_mars_colony2_desc: "Named after Kagutsuchi, the god of fire, Mars Colony 'Kagutsuchi' is built around furnaces, refineries and heavy industry. Its purpose is clear: to turn Martian ore and energy into strength for Japan's factories."
 JAP_mars_colony3: "Mars Colony Tsukuyomi"
 JAP_mars_colony3_desc: "Named after Tsukuyomi, the god of the moon and night, Mars Colony 'Tsukuyomi' serves as a quiet observatory and research complex. From its labs and instruments, data flows back to Japan, deepening scientific understanding."
 JAP_mars_colony4: "Mars Colony Susanoo"
 JAP_mars_colony4_desc: "Named after Susanoo, the storm-bringing deity, Mars Colony 'Susanoo' is shaped into a rugged frontier outpost. Training grounds and experimental ranges make it a crucible for Japan's armed forces and doctrines."
 JAP_american_pressure_article_nine: "Under Pressure Of U.S. Tariffs"
 JAP_JP_USA_SOFA_1: "U.S.-Japan SOFA Framework"
 JAP_JP_USA_SOFA_1_desc: "U.S. forces in Japan operate under a Status of Forces Agreement that shields most personnel from Japanese courts and taxes, and gives the U.S. wide control over its bases. Local police, governors and residents must work around rules negotiated in Washington and Tokyo, and every crime, accident or noise complaint near a base is filtered through SOFA procedures before Japan can act."
 JAP_maritime_heavy_industry_corridor: "Maritime Heavy Industry Corridor"
 JAP_maritime_heavy_industry_corridor_desc: "Japan develops a continuous belt of shipyards, steelworks, and marine engineering firms along key coastal regions. Concentrating investment in this corridor increases capacity for building and maintaining warships, submarines, and support vessels, strengthening the industrial backbone of the fleet."
 JAP_moon_base_completed: "Kaguya Moon Base Established"
 JAP_usa_article_nine_refused: "Refused Article 9 Interpretation Change"
 JAP_diplomacy_shortcut: "外交"
 JAP_political: "政治"
 JAP_economy: "経済"
 JAP_military: "軍事"
 JAP_monarchism: "君主主義"
 JAP_great_east_japan_earthquake_shortcut: "東日本大震災"
 JAP_article_nine_remove_flag: "憲法9条を削除している"
 JAP_usa_article_nine_accepted: "Accepted Article 9 Interpretation Change"
 JAP_tokyo_startup_special_zone: "Tokyo Startup Special Zone"
 JAP_tokyo_startup_special_zone_desc: "We will concentrate deregulation, venture support, and investment incentives in the Tokyo metropolitan area to foster startup creation and commercialization."
 JAP_tokyo_startup_special_zone_idea: "Tokyo Startup Special Zone"
 JAP_tokyo_startup_special_zone_idea_desc: "Tokyo has been designated as a special regulatory reform zone to support startups, venture capital, and new business formation. By concentrating deregulation, investment access, and commercialization support in the capital region, the government aims to turn limited reform into a visible engine of growth."
 JAP_kansai_medical_special_zone: "Kansai Medical Innovation Zone"
 JAP_kansai_medical_special_zone_desc: "We will create a special zone for medical, care, and life science innovation in Kansai, accelerating private investment and practical implementation."
 JAP_kansai_medical_special_zone_idea: "Kansai Medical Innovation Zone"
 JAP_kansai_medical_special_zone_idea_desc: "Kansai is being developed as a special zone for medical, care, and life science innovation through regulatory flexibility and focused investment."
 JAP_kyushu_logistics_special_zone: "Kyushu Logistics & Port Special Zone"
 JAP_kyushu_logistics_special_zone_desc: "We will streamline logistics and port procedures in Kyushu, strengthening trade flows and improving the efficiency of regional industry."
 JAP_kyushu_logistics_special_zone_idea: "Kyushu Logistics & Port Special Zone"
 JAP_kyushu_logistics_special_zone_idea_desc: "Kyushu has been designated as a logistics and port reform zone to improve trade efficiency and regional connectivity. Streamlined procedures, infrastructure prioritization, and regulatory easing are intended to strengthen export capacity and make the region a more attractive base for industry and commerce."
 JAP_expand_special_zones_nationwide: "Expand Special Zones Nationwide"
 JAP_expand_special_zones_nationwide_desc: "The results achieved in selected strategic zones will be scaled nationwide, turning regulatory reform from a limited exception into a broader growth framework."
 JAP_tokyo_startup_special_zone_active: "Executed §Y$JAP_tokyo_startup_special_zone$§!"
 JAP_kansai_medical_special_zone_active: "Executed §Y$JAP_kansai_medical_special_zone$§!"
 JAP_kyushu_logistics_special_zone_active: "Executed §Y$JAP_kyushu_logistics_special_zone$§!"
 JAP_expand_special_zones_nationwide_done: "Executed §Y$JAP_expand_special_zones_nationwide$§!"
 JAP_japanese_economy_decisions: "The Entrenched Demand Shortfall"
 JAP_japanese_economy_decisions_desc: "Two decades of falling prices taught Japanese households and firms to wait. Wages sit flat, companies hoard cash rather than invest, and every yen of stimulus is saved instead of spent. The economy is not collapsing; it is simply refusing to move.\n\n§YWhat you can do§!\nThe decisions below are the demand levers. Announcing a price target, cutting consumption tax, transferring cash to households, funding public investment and pushing durable goods purchases each raise §YDemand Recovery Progress§!. The focuses of the demand branch raise it further, and §Y$JAP_improvement_private_investment_climate$§! adds to it directly.\n\n§YDemand Recovery Progress§!: [?JAP_demand_recovery_progress|0] / 100\n\n§GThresholds§!\n§G30§!: §Y$JAP_entrenched_demand_shortfall_idea_1$§! eases into §Y$JAP_entrenched_demand_shortfall_idea_2$§!.\n§G60§!: it eases again into §Y$JAP_entrenched_demand_shortfall_idea_3$§!.\n§G85§!: the spirit is removed and Japan's economic growth accelerates.\n\n§RWarning§!: this progress never decays, but nothing raises it on its own either. Take no decisions and Japan stays in the slump indefinitely."
 JAP_entrenched_demand_shortfall_idea_2: "鈍い需要回復"
 JAP_entrenched_demand_shortfall_idea_2_desc: "Clearer price targets and support for households have pulled the economy away from its worst phase, but the recovery remains fragile. Consumption and investment are improving in places, yet not with enough force to lift the whole country. Demand is returning, but caution still hangs over the economy.\n-------------\nYou can §Gmitigate§! the effects of this national spirit by using the decisions in §Y$JAP_japanese_economy_decisions$§! to raise §YDemand Recovery Progress§! to at least §G60§!!"
 JAP_entrenched_demand_shortfall_idea_3: "残る需要の重し"
 JAP_entrenched_demand_shortfall_idea_3_desc: "Government measures to stimulate consumption have pushed the economy forward, but the caution left behind by years of stagnation remains deeply entrenched. Households and firms are moving more than before, yet a self-sustaining recovery still needs one final push. Japan's economy stands at the threshold of escaping stagnation, but it has not fully broken free yet.\n-------------\nYou can §Gremove§! this national spirit by using the decisions in §Y$JAP_japanese_economy_decisions$§! to raise §YDemand Recovery Progress§! to at least §G85§!!."
 JAP_declaration_price_target: "物価目標の宣言"
 JAP_declaration_price_target_desc: "景気を弱らせているのは、足元の需要不足だけではない。物価も賃金も動かないという思い込みが、家計と企業の行動を縛っている。明確な物価目標を掲げることは、国が停滞を当然視しないという意思表示であり、閉塞した期待を動かす第一歩となる。"
 Japan_economy.17.t: "物価目標の達成"
 Japan_economy.17.d: "かつては誰も信じなかった物価の上昇が、ついに現実のものとなった。重要なのは数字そのものではない。停滞は永遠ではないという実感が、家計と企業の慎重姿勢を揺るがし始めていることだ。"
 Japan_economy.17.a: "空気は変わった。"
 Japan_economy.18.t: "物価目標は届かず"
 Japan_economy.18.d: "掲げられた目標は現実の動きにつながらず、停滞を打ち破るという政府の約束には疑いが広がり始めている。家計は再び支出に慎重となり、企業も需要の弱さを前に様子見姿勢を強めた。景気回復への期待は確かに傷つき、日本経済には重い空気が戻りつつある。"
 Japan_economy.18.a: "期待は簡単には戻らない。"
 JAP_price_target_mission: "物価上昇の約束"
 JAP_price_target_mission_desc: "目標を掲げただけでは足りない。期限内に物価上昇の兆しを示し、国民に変化が始まったと信じさせなければならない。"
 JAP_cash_transfers_households: "家計への直接給付"
 JAP_cash_transfers_households_desc: "将来不安が強いとき、景気回復は自然には始まらない。ならばまず、使えるお金を家計の手元に直接届けるべきである。特に低中所得層への給付は支出に結びつきやすく、冷え込んだ国内需要に即効性のある刺激を与える。"
 JAP_cash_transfers_households_decision: "低中所得者向け給付金"
 JAP_cash_transfers_households_decision_desc: "支出に結びつきやすい層へ給付を行い、冷え込んだ需要を直接押し上げる。"
 Japan_economy.19.t: "給付金が示した回復の兆し"
 Japan_economy.19.d: "家計に直接届いた資金は、冷え込んだまま眠ることなく、市場へ流れ始めている。特に低中所得層の支出増加は分かりやすく、長く閉じていた財布のひもにようやく緩みが見え始めた。"
 Japan_economy.19.a: "需要はまだ起こせる。"
 JAP_temporary_tax_cuts: "時限減税の実施"
 JAP_temporary_tax_cuts_desc: "Temporary tax cuts give households a reason to spend now, pulling forward the purchases that have been postponed and giving demand visible momentum in a stagnant economy."
 JAP_temporary_consumption_tax_cut: "時限消費税減税"
 JAP_temporary_consumption_tax_cut_desc: "今買う理由を作り、先送りされた消費を景気回復の追い風へ変える。"
 Japan_economy.20.t: "減税が示した回復の兆し"
 Japan_economy.20.d: "期限付きの減税は、家計に今動く理由を与えた。先送りされていた買い物が戻り始め、停滞の空気はわずかながら崩れつつある。短期策ではあるが、需要の鈍さを揺さぶるには十分な効果を見せている。"
 Japan_economy.20.a: "今こそ動く時だ。"
 JAP_active_public_investment: "積極的な公共投資"
 JAP_active_public_investment_desc: "If private firms remain cautious, the government must create the demand itself, pushing money into local economies and employment. Public investment restores the sense that movement has finally returned."
 JAP_active_public_investment_decision: "公共投資の発注"
 JAP_active_public_investment_decision_desc: "政府主導で需要を作り、地域経済と雇用に資金の流れを生み出す。"
 Japan_economy.21.t: "公共投資が示した回復の兆し"
 Japan_economy.21.d: "政府が発注した事業は、数字以上の意味を持ち始めている。地域経済に資金が流れ、雇用に動きが生まれ、景気に対する悲観一色の空気にも変化が見え始めた。待つだけの停滞から、一歩踏み出した実感が広がっている。"
 Japan_economy.21.a: "国が景気を動かす。"
 JAP_improvement_private_investment_climate: "民間投資環境の整備"
 JAP_improvement_private_investment_climate_desc: "政府支出だけで景気回復を完結させることはできない。企業が新規投資に踏み切れる環境を整え、先行きへの不安を和らげることで、民間の成長力を呼び戻さなければならない。持続的な回復には、企業側の前向きな判断が不可欠である。"
 JAP_focus_improving_investment_climate: "投資環境改善への注力"
 JAP_focus_improving_investment_climate_desc: "企業が投資判断を下しやすい環境づくりを優先している。制度設計、調整、説得に政治資源を割くため、短期的には他分野へ回せる余力が細る。"
 Japan_economy.02.t: "民間の投資環境が改善"
 Japan_economy.02.d: "企業はようやく、守りに徹するだけでは機会を逃すと考え始めている。先行きへの不透明感は残るものの、新規投資をためらわせていた重しは少しずつ軽くなってきた。回復が官主導だけで終わらない可能性が見えつつある。"
 Japan_economy.02.a: "民間にも火がついてきた。"
 JAP_stimulating_demand_durable_goods: "耐久財需要の喚起"
 JAP_stimulating_demand_durable_goods_desc: "自動車や家電、住宅関連のような耐久財消費は、動き始めれば景気全体への波及も大きい。逆に停滞期には、真っ先に先送りされやすい分野でもある。ここを動かせれば、需要回復に目に見える勢いを与え、日本経済に久々の活気を取り戻せる。"
 JAP_stimulating_demand_durable_goods_decision: "耐久財購入キャンペーン"
 JAP_stimulating_demand_durable_goods_decision_desc: "先送りされがちな大型消費を後押しし、景気に目に見える動きを与える。"
 Japan_economy.22.t: "耐久財需要が示した回復の兆し"
 Japan_economy.22.d: "長く先送りされてきた大型消費に、ようやく動きが戻り始めた。耐久財の購入は関連産業への波及も大きく、家計が将来に対してわずかでも前向きになった証でもある。景気回復は、数字だけでなく街の空気にも表れ始めている。"
 Japan_economy.22.a: "勢いを広げよう"
 JAP_strict_audits_banks: "銀行への厳格監査"
 JAP_strict_audits_banks_desc: "問題を先送りし続けた結果、銀行の傷は見えにくくなり、金融不安だけが静かに広がった。まず必要なのは、帳簿の奥に隠れた危険な不良債権を洗い出し、現実を直視させることである。痛みは避けられないが、それなくして再生は始まらない。"
 Japan_economy.23.t: "The Shinsei Put Option"
 Japan_economy.23.d: "The clause is exactly as reported. Every loan the buyers judge to have lost a fifth of its value goes back to the Deposit Insurance Corporation at the price on the books, and the state absorbs the difference. The bank did nothing illegal. It read the contract more carefully than the officials who wrote it, and those officials are still at their desks."
 Japan_economy.23.a: "Publish the contract and name who signed it"
 Japan_economy.24.t: "The Collapse of Sogo"
 Japan_economy.24.d: "The chain cannot be saved and everyone advising the minister knows it. The only question is whether it is wound up in court, where the creditors and the officials who indulged them will be named in public, or restructured behind closed doors with the public share of the debt quietly forgiven."
 Japan_economy.24.a: "Let it fail in open court"
 JAP_injection_public_funds: "公的資金の注入"
 JAP_injection_public_funds_desc: "傷んだ銀行に損失処理と貸出再開の両方を求めるのは酷である。金融システムそのものへの不信を抑え込むには、国家が最後の支えとして資本を注ぎ込み、崩壊の連鎖を止めなければならない。政治的には重い決断だが、回避の余地は小さい。"
 Japan_economy.25.t: "Mycal"
 Japan_economy.25.d: "The group's main bank has refinanced it every year since the bubble ended and has now told the ministry it will not do so again. Kansai suppliers who have never dealt with anyone else are already calling their prefectural offices. Whatever is decided this week will be read across the region as a statement about whether the old arrangements still hold."
 Japan_economy.25.a: "Let it go under and audit the bank that carried it"
 JAP_new_lenders: "新規貸し手の参入"
 JAP_new_lenders_desc: "既存の銀行が守りに徹し続けるなら、資金の流れは細ったままである。ならば新たな貸し手を育て、金融の詰まりそのものを崩していくべきだ。競争と多様な資金供給の回路は、日本の金融に失われた柔軟さを取り戻させる。"
 JAP_new_lenders_idea: "新規貸し手の台頭"
 JAP_new_lenders_idea_desc: "既存銀行以外の資金供給主体が台頭し始めている。金融の目詰まりはまだ完全には解消されていないが、資金の流れに新しい逃げ道が生まれつつある。"
 JAP_protection_deposits: "預金保護の確立"
 JAP_protection_deposits_desc: "預金者が自分の金を守れないと感じた瞬間、銀行危機は現実になる。だからこそ、まずは預金が守られるという確かな土台を示さなければならない。信用を完全に取り戻すことはできなくとも、崩壊を防ぐ壁にはなり得る。"
 Japan_economy.26.t: "Resona"
 Japan_economy.26.d: "Strip out the deferred tax assets and the capital ratio collapses. The auditors will not sign, which is itself unprecedented, and the government has days rather than weeks. Two trillion yen makes the bank whole and makes the state its owner. Refusal means the first major bank failure the country has allowed since the war, and nobody can say where it stops."
 Japan_economy.26.a: "Inject the funds and remove the entire board"
 JAP_rehabilitation_small_medium_enterprises: "中小企業金融の安全網"
 JAP_rehabilitation_small_medium_enterprises_desc: "Disposing of the bad loans risks driving small and medium enterprises into funding distress along with the insolvent. Banks are required to maintain lending to viable SMEs while restructuring finance schemes monitor the credit tightening, putting a barrier in front of the collapse of local economies."
 JAP_rehabilitation_small_medium_enterprises_idea: "中小企業金融安定への注力"
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "不良債権処理の副作用で中小企業向け資金供給が細ることを防ぐため、監督、調整、再生支援に政治資源を集中している。地域経済を守るうえで重要だが、その分だけ他分野へ割ける余力は限られる。"
 Japan_economy.27.t: "The Ashikaga Bank"
 Japan_economy.27.d: "The prefecture's government, its firms, and a great many of its households bank nowhere else. The examiners' finding is unambiguous: the bank is insolvent and has been for some time. Temporary nationalisation protects every depositor and wipes out every shareholder, many of whom are local companies that were required to hold the stock as a condition of their own lending."
 Japan_economy.27.a: "Nationalise it and write the shareholders down to nothing"
 Japan_economy.28.t: "Daiei"
 Japan_economy.28.d: "The Revitalization Corporation is ready to take it, replace the board, and sell what can be sold. The founder built this company out of the rubble of the war and has friends in the party who remember it. They are asking for one more refinancing, and they are asking loudly."
 Japan_economy.28.a: "Hand it to the Revitalization Corporation"
 Japan_economy.29.t: "The Kanebo Accounts"
 Japan_economy.29.d: "Two hundred billion yen of profit that was never earned, reported across five years, and signed off every time by the same accounting firm. Prosecuting the company is straightforward. Prosecuting its auditors would tell every accounting firm in Japan that the signature is a liability rather than a formality, and it would make a great many other statements suddenly worth re-reading."
 Japan_economy.29.a: "Prosecute the company and suspend its auditors"
 Japan_economy.30.t: "The Federation Stands Down"
 Japan_economy.30.d: "The pressure has come off. The federation has not withdrawn its objections, but it has stopped briefing against the investigation, and the members who were loudest have gone quiet. It is not agreement. It is a judgement that the fight is no longer worth what it costs them."
 Japan_economy.30.a: "We will take the quiet while it lasts."
 Japan_economy.31.t: "The Federation Makes Good on It"
 Japan_economy.31.d: "Capital spending plans across the member companies have been deferred, and every one of them cites uncertainty. The hiring freeze announced this morning is presented as prudence. The message is unmistakable and it is meant to be, and there is no statute that can compel a company to invest."
 Japan_economy.31.a: "They have made their point."
 Japan_economy.06.t: "The Firms Push Back"
 Japan_economy.06.d: "The moment the auditors ask for the real numbers, the lobbying begins. Industry federations warn of mass bankruptcies and lost jobs, and friendly bureaucrats counsel patience. The banks would rather report the losses on their own schedule, if at all. We can compel them, we can let them hand us what they choose, or we can decide this was never worth the trouble."
 Japan_economy.06.a: "Subpoena the books"
 Japan_economy.07.t: "A Bank on the Brink"
 Japan_economy.07.d: "The audit has flushed out a regional lender drowning in bad loans. Force the whole balance sheet into daylight and the panic could spread; contain the disclosure and the rot stays half-hidden, but the markets stay calm. Either way the investigation grinds forward."
 Japan_economy.07.a: "Force full disclosure"
 Japan_economy.08.t: "The Findings Are Published"
 Japan_economy.08.d: "The report goes to the printers. What is in it depends entirely on what the auditors were allowed to find: a catalogue of insolvent firms and the officials who protected them, a partial account with the worst names redacted, or a document that manages several hundred pages without accusing anyone of anything. The public will read it either way, and so will the people who were promised transparent, Western-style markets."
 Japan_economy.08.a: "Publish all of it and let the public judge"
 Japan_economy.09.t: "A Leak from the Ministry"
 Japan_economy.09.d: "The firms knew which auditors were coming and on which morning. Filing cabinets were emptied over a weekend, and two directors are suddenly unreachable on business abroad. Somebody in the ministry is telling them, and everyone in this room can guess who, because he was posted here from the bank he is protecting and will be posted back to it when he retires."
 Japan_economy.09.a: "Accept the loss and move on"
 Japan_economy.10.t: "The Federation Issues an Ultimatum"
 Japan_economy.10.d: "The business federation has come to the Diet with figures of its own: investment postponed, hiring frozen, confidence damaged, all of it laid at the door of the investigation. The message under the courtesy is not subtle. Wind this down, or the members of this federation will find they cannot commit to anything while the uncertainty lasts."
 Japan_economy.10.a: "Let them make their case in public."
 Japan_economy.11.t: "The Prosecutor Falls"
 Japan_economy.11.d: "It was not the investigation that failed. It was a lead prosecutor with a golf membership he did not declare, given to him by a firm on his own list, and a newspaper that has photographs of him accepting it. The minister has resigned to take responsibility. The probe is suspended pending review, which everyone understands to mean pending the point at which the public stops paying attention."
 Japan_economy.11.a: "We have lost the initiative."
 JAP_expectation_of_being_rewarded: "報われることへの期待"
 JAP_expectation_of_being_rewarded_desc: "Recovery requires restoring the belief that effort will be rewarded in wages and living standards. Without wage growth the stimulus stays temporary, and only that expectation turns a recovery into a self-sustaining one."
 JAP_wage_negotiations: "賃上げ交渉を行う"
 JAP_wage_negotiations_decision: "賃金上昇への期待を回復させ、需要回復を一時的な刺激で終わらせない。"
 Japan_economy.12.t: "企業との賃上げ交渉"
 Japan_economy.12.d: "需要回復を一時的なものに終わらせないためには、賃金の伸びが必要である。しかし企業側には、先行き不安や収益圧迫への警戒も根強い。政府はここで、どこまで強く賃上げを求めるべきだろうか。"
 Japan_economy.12.a: "賃上げを促す。"
 Japan_economy.12.b: "圧力をかける。"
 Japan_economy.12.c: "民間に任せる。"
 Japan_economy.14.t: "賃上げが目標額に到達"
 Japan_economy.14.d: "賃金はついに、目に見える形で上向き始めた。重要なのは所得の増加だけではない。働けば報われるかもしれないという感覚が戻りつつあることこそ、長く弱かった消費心理を変えていく。需要回復は、より自律的な段階へ進み始めた。"
 Japan_economy.14.a: "回復は本物になりつつある。"
 Japan_economy.15.t: "賃上げは目標額に届かず"
 Japan_economy.15.d: "賃上げは目標には届かなかったが、交渉そのものが無駄だったわけではない。企業の慎重姿勢はなお強いものの、賃金を動かす必要性は広く意識され始めている。前進は小さいが、停滞した空気を崩すには意味のある一歩だった。"
 Japan_economy.15.a: "次につなげよう。"
 Japan_economy.12_a_TT: "賃上げが目標額に達するかの見込みは§Y半々§!である"
 Japan_economy.12_b_TT: "賃上げが目標額に達するかの見込みは§G高い§!"
 Japan_economy.12_c_TT: "賃上げが目標額に達するかの見込みは§R低い§!"
 JAP_wage_negotiations_TT: "§Y需要回復の進捗§!が上昇するが上昇値は§Y賃上げ交渉§!の結果に左右される"
 JAP_glorious_decade_desc: "Without postponing the factors behind stagnation, we will rebuild finance, businesses, and demand in parallel. At the same time, we will confront the impacts of the declining birthrate and the \"employment ice age\" generation, and, centered on work-style reforms and investment in people, balance household security with stronger growth potential."
 JAP_inflation_target_desc: "The government and the central bank will clearly communicate the policy stance for supporting the economy and the conditions under which it will be maintained. By reducing future uncertainty and easing the \"wait-and-see\" attitude of households and businesses, we will make it easier for consumption and investment to pick up."
 JAP_diplomacy.34.d: "To strengthen the region's financial safety net, the Japanese government has proposed expanding the currency swap arrangement with our country through the \"Chiang Mai Initiative.\" Securing liquidity in times of crisis can help calm market anxiety and contribute to economic stability.\n\nShould we accept this proposal and take part in strengthening financial cooperation?"
 JAP_diplomacy.40.d: "The Japanese government has proposed \"Qualitative ODA\" cooperation for our country in the fields of education, human resource development, and research, as support carried out in coordination with local companies and institutions. This cooperation will strengthen skills formation and institutional capacity, promoting industrial upgrading and innovation. Accepting the proposal would also increase Japan's influence within ASEAN.\n\nShould we accept this proposal and strengthen human capital and research and development?"
 JAP_diplomacy.41.d: "[FROM.GetName] has accepted Japan's \"Qualitative ODA\" cooperation proposal in the fields of education, human resource development, and research. As coordination with local companies and institutions moves forward, the other country's institutional capacity and technological foundation will be strengthened, contributing to sustainable growth. This agreement will certainly increase Japan's influence within ASEAN."
 JAP_diplomacy.42.d: "[FROM.GetName] has indicated that it will decline the \"Qualitative ODA\" cooperation proposal in the fields of education, human resource development, and research. The other country appears to be prioritizing domestic priorities and institutional preparations, but this does not mean it is rejecting the proposal itself. Japan should remain mindful of the other country's circumstances while keeping channels for dialogue open."
 JAP_diplomacy.49.d: "The Japanese government has presented a proposal to establish the \"Japan Taiwan Disaster Preparedness Knowledge Platform\" to share expertise and lessons learned in disaster response, based on our shared vulnerability to natural disasters. Through standardizing information sharing, conducting joint training, and developing recovery procedures, the aim is to strengthen emergency response capabilities and speed up recovery. If this cooperation moves forward, it is expected to reduce damage and accelerate restoration."
 JAP_diplomacy.50.d: "The Japanese government has proposed the \"Japan Taiwan High-Tech Cooperation,\" which would link research institutions and private companies in Japan and Taiwan to advance joint research in cutting-edge civilian technologies. By sharing research resources, pursuing joint development, and promoting exchanges of engineers, the aim is to speed up innovation and boost industrial productivity and competitiveness. If this cooperation takes root, it will form a foundation for long-term growth in the civilian technology sectors of both countries."
 JAP_diplomacy.56.t: "\"Sinic Cultural Sphere\" Cultural Cooperation Project"
 JAP_diplomacy.56.d: "The Japanese government has proposed a Japan China cultural cooperation project to strengthen cultural ties within the \"Sinic Cultural Sphere,\" which shares a common historical foundation. Through academic exchanges, cultural initiatives, and cooperation in media and education, the aim is to make shared values and historical connections more visible and to have them function as a cultural buffer against external influence. If this framework moves forward, it is also expected to strengthen soft power that contributes to shaping a more favorable international image."
 JAP_diplomacy.59.d: "The Japanese government has proposed the \"Regional Business Exchange Initiative\" to institutionalize local-level business exchanges and promote cooperation between regional companies in Japan and South Korea. Through business matchmaking events, joint exhibitions, supply chain matching, and the sharing of technology and know-how, the aim is to revitalize regional economies and accelerate the growth of civilian industries. If this framework takes root, practical cooperation that is not overly dependent on central-government leadership will expand, strengthening private-sector-driven industrial networks."
 JAP_historical.20010426.d: "Yoshirō Mori announced his resignation as Prime Minister after just one year in office. His approval ratings had declined, and the disconnect between him and the public, symbolized by his \"divine nation\" remark and his handling of the Ehime Maru incident, had only grown wider.\n\nElected as his successor in the LDP leadership race was Junichiro Koizumi, who captured national attention with his bold declaration to \"destroy the LDP\" and ran a flashy, high-profile campaign. Public expectations were high, and he won a landslide victory in the regional vote.\n\nWith a style and stage presence that broke away from the old Liberal Democratic Party, Koizumi raised the banner of \"reform\" as he assumed the office of Prime Minister.\nHowever, what might emerge from the ruins he vowed to destroy, no one yet knows."
 JAP_historical.20060926.d: "Prime Minister Junichiro Koizumi, who led a long-term administration lasting over five years, announced his intention to step down with the expiration of his term as LDP president. While Koizumi had publicly stated his desire to step down at the end of his term, public support for him remained high, and many within the party continued to call for his extension.\n\nMeanwhile, within the LDP, Shinzo Abe, who had risen rapidly through the ranks to become Chief Cabinet Secretary at a young age, emerged as the leading successor. With his youth, name recognition, political lineage, and symbolic status as the \"post-Koizumi\" figure, he was gathering broad support from across the party.\n\nWho is better suited to steer the nation forward, an experienced incumbent or a new leader ready to carry the torch into the next generation? The time for a decision has come."
 JAP_historical.20070926.d: "Prime Minister Shinzo Abe abruptly announced his intention to resign, citing the increasing difficulty of managing the government. It had been only one year since he took office. Amid a series of ministerial scandals, the foundation of his administration had been severely shaken.\nIn response to his resignation, some within the LDP have pushed to bring in former Chief Cabinet Secretary Yasuo Fukuda, arguing that \"a new face is needed to restore public trust.\" However, many voices still strongly support Abe's continuation.\n\nJapan now stands in the midst of political turmoil. The time has come to decide who will take the helm of the nation."
 JAP_historical.20080924.d: "Prime Minister Yasuo Fukuda unexpectedly held a press conference at the Prime Minister's Office to announce his resignation.\n\nDuring the conference, he stated, \"For the sake of the people's daily lives, I hope a new team will carry out the policies,\" showing a calm acceptance of the leadership transition. However, as he did not clearly explain the reasons behind his resignation, the announcement left many citizens confused and uncertain.\nIn response, the Liberal Democratic Party quickly began preparing for a leadership election. Secretary-General Tarō Asō emerged as the leading candidate, rapidly gaining support from various party factions. Still, a small number of voices within the party continue to call for Fukuda to stay on.\n\nTo break political stagnation, is change what the country needs? Or is stability the greater priority for Japan at this moment? The time for a decision has come."
 JAP_focus_renewable_energy_decision_repeal: "Repeal Renewable Energy Focus"
 JAP_focus_renewable_energy_decision_repeal_desc: "Reversing the commitment to renewable energy marks a policy shift away from solar and wind investment, allowing the government to redirect resources toward other energy priorities."
 JAP_focus_thermal_power_decision_repeal: "Repeal Fossil Fuel Powerplant Focus"
 JAP_focus_thermal_power_decision_repeal_desc: "Reversing the expansion of fossil fuel powerplants marks a policy shift away from coal, oil, and gas investment, allowing the government to redirect resources toward other energy priorities."
 JAP_diplomacy.16.t: "The Japan Impasse"
 JAP_diplomacy.16.d: "Tokyo continues to resist broadening the interpretation of Article 9. Washington must decide how far it is willing to push, and at what cost."
 JAP_diplomacy.16.a: "Drop the matter. Our other interests in the region take priority."
 JAP_diplomacy.16.b: "Withdraw our security guarantee for Japan."
 JAP_diplomacy.16.c: "Impose trade tariffs on Japanese exports."
 JAP_diplomacy.16.e: "Establish a naval blockade of Japan."
 JAP_historical.121006001.t: "2000年鳥取県西部地震"
 JAP_historical.121006001.d: "日本は環太平洋火山帯――いわゆる「リング・オブ・ファイア」の上に浮かぶ火山列島である。つまり日本とその人々は、常に大地震に見舞われ続ける宿命にある。それは前の千年紀でも変わらず、そして次の千年紀でも変わらないだろう。\n\n2000年10月6日 午後1時30分――マグニチュード7.3、最大震度6強の地震が島根県西部を襲った。多くの道路や家屋に甚大な被害を与え、揺れは大阪や福岡といった遠方にも及んだ。とりわけ神戸では、1995年の阪神・淡路大震災以来、初めて強い揺れを経験することになった。"
 JAP_historical.disaster_help: "今すぐ支援する！"
 JAP_historical.disaster_leave: "放っておけ。彼らは自力で立ち直る。"
 JAP_historical.130210001.t: "えひめ丸事故"
 JAP_historical.130210001.d: "2001年2月9日、漁業高校の実習船「えひめ丸」は、[USA.GetName]の潜水艦「グリーンヴィル」に衝突され、圧壊した。生徒と教員35名が乗船していたえひめ丸は沈没し、9名が死亡した。\n\n両政府の関係者がこの悲劇的事故に関するあらゆる情報を収集している最中、首相[Root.GetLeader]は休暇でゴルフをしている。\n\n当然、休暇は切り上げて今すぐ東京に戻るべき……ですよね？"
 JAP_historical.130210001.oA: "今すぐ東京に戻れ！"
 JAP_historical.130210001.oB: "待て！あと1打だけ……"
 JAP_historical.130324001.t: "2001年芸予地震"
 JAP_historical.130324001.d: "2001年3月24日 午後3時27分――広島県西部で、マグニチュード6.7、最大震度6弱の地震が発生した。死者は2名、負傷者は288名にのぼった。震源に最も近い都市である呉市は、最大の被害を受けた。一方で、多くの自治体では被害が抑えられた。1995年の阪神・淡路大震災、そして前年の島根県の地震を受けて、各都市が防災対策を進めていたためである。主な被害は、水道管の破損と山の斜面崩落だった。"
 JAP_historical.9130901001.t: "歌舞伎町ビル火災"
 JAP_historical.9130901001.d: "2001年9月1日未明、東京都新宿区歌舞伎町にある「明星56ビル」で火災が発生し、麻雀店やストリップクラブを訪れていた44人が一酸化炭素中毒で死亡した。消防の報告によれば、火は当初は小規模だったが、火災を発見した従業員が扉を開けたことでバックドラフト現象が起き、急激に燃え広がったという。報告はさらに、火災報知器が天井で覆われていたり、故障を理由に切断されていたりして、初期消火の機会が失われたとも指摘している。加えて、ビルの従業員が来訪者の避難誘導を行わなかったとする報告もある。一方、消防と合同で捜査した警視庁は、ガス管が不自然に破損していることを確認した。火災の原因は事故か放火か、いまだ不明だが、防火意識の欠如が被害を拡大させたことは明らかである。"
 JAP_historical.9130901001.oA: "これ以上ひどいビル火災が二度と起きないことを願う。"
 JAP_historical.131201001.t: "敬宮愛子内親王殿下のご誕生"
 JAP_historical.131201001.d: "2001年12月1日、皇太子徳仁親王と妃殿下雅子さまのご長女が、皇居内の病院でご誕生された。第3千年紀最初の内親王であるこのお子さまは、中国儒教の古典『孟子』に由来して「愛子（あいこ）」と命名された。また、敬宮愛子内親王殿下は、天皇明仁陛下の内孫にあたる。1965年の秋篠宮文仁親王殿下のご誕生以来、久方ぶりの慶事であったことから、全国のほぼすべての人々がこれを祝福した。皇居には政治家や著名人を含む2万人が集まり、「万歳」を叫んだ。一方で、このままでは現在の皇統が途絶えるのではないかと懸念する声もあった。雅子妃殿下は出産年齢が進んでおり、第二子の出産は危険を伴うと考えられたからだ。さらに、愛子内親王殿下が成長した場合、徳仁親王と文仁親王の年齢差が大きいこともあり、「最後の皇族」として女系天皇（母系の天皇）となる可能性も取り沙汰された。しかし、それは皇室典範――皇位継承を男系に限る規定――に反する。こうして、女系天皇を可能にするための皇室典範改正をめぐる議論が始まっていった。"
 JAP_historical.131201001.oA: "万歳！"
 JAP_historical.150526001.t: "2003年宮城県沖地震"
 JAP_historical.150526001.d: "6:24 PM, May 26, 2003 - A magnitude 7.1 and scale 6- earthquake occurred in off the Miyagi-Iwate prefectural border and hit on. Large areas of Tohoku region have been suffered much damage like a destroy on trestles of the Sinkansen and landslides on mountains, but no one was killed. The tsunami was so gently like a ripple in this time. Although we have these reports, a lot of people have felt the quaking, from Hokkaido to Kanto."
 JAP_historical.150726001.t: "2003年宮城県北部連続地震（第2次）"
 JAP_historical.150726001.d: "2003年7月26日――宮城県北部では、午前0時から夕方にかけて、同日に最大4回もの地震が立て続けに発生した。最も強い地震は午前7時13分にマグニチュード6.4、最大震度6強を記録し、最も弱いものでもマグニチュード5.1、最大震度5弱だった。これらの地震により、数百棟の家屋だけでなく、航空自衛隊の松島基地にも被害が出た。不快な一日となったが、幸いにも死者は出なかった。"
 JAP_historical.150926001.t: "2003年北海道地震"
 JAP_historical.150926001.d: "2003年9月26日 午前4時50分――北海道南方沖で、マグニチュード8.0、最大震度6弱の地震が発生した。強い揺れを受けた町は限られていたが、ほどなくして、その本当の恐ろしい余波が明らかになった。地震は、沿岸部の埋立地帯での地盤の液状化や、石油貯蔵タンクの火災を引き起こした。さらに、大きな津波が東日本の太平洋沿岸を襲い、2人が死亡した。"
 JAP_historical.161023001.t: "2004年新潟県中越地震"
 JAP_historical.161023001.d: "2004年10月23日 午後5時56分――新潟県で、マグニチュード6.8、最大震度7の地震が発生した。1995年の阪神・淡路大震災を受けた震度階級改定後、震度7が観測されたのはこれが初めてだった。\n\n山古志では土砂崩れによって道路がすべて寸断され、住民は村に孤立した。上越新幹線では走行中の列車が衝撃で脱線したが、死者は出なかった。しかし地震の結果、68人が死亡した。"
 JAP_historical.170320001.t: "2005年福岡県西方沖地震"
 JAP_historical.170320001.d: "2005年3月20日 午前10時53分――福岡市沖で、マグニチュード7.0、最大震度6弱の地震が発生した。北部九州では地震の記録が少なく、この地震も1922年以来最大の規模だった。\n\n福岡市の玄界島では約700人が避難し、そのうち10人は災害時の連絡や巡回のために島に残ることを決めた。福岡市中心部では多くの窓ガラスが割れ、その破片が歩道に落ち、歩行者2人が負傷した。\n\n揺れは対馬だけでなく、韓国や中国にまで及んだ。地震により1人が死亡した。"
 JAP_historical.170425001.t: "福知山線脱線事故"
 JAP_historical.170425001.d: "2005年4月25日 午前9時18分、JR西日本の福知山線（JR宝塚線）の快速列車が、兵庫県尼崎市の急カーブで脱線し、線路脇のマンション1階部分に衝突した。\n列車は7両編成だったが、先頭車両が建物に完全にめり込んだため、当初は6両編成だと誤って報じられた。調査の結果、当該列車は制限速度70km/hの区間に、約116km/hで進入していたことが判明した。この過度の速度により、遠心力で脱線した可能性が高い。\n\n運転士は事故で死亡したが、後部車両の車掌の証言では、乗務員が約90秒の遅れを取り戻そうとしていた可能性が示唆された。また後に、同社には軽微な運行ミスであっても厳しい懲戒的措置が存在していたことが報じられた。それには再教育、社内規則の手書き写しなどの矯正的な慣行が含まれ、これらは中曽根政権下での国鉄民営化に端を発するものだとされた。\n\n幸いにも、反対方向から接近していた特急列車は、線路が塞がれていることにより非常停止でき、二次衝突は回避された。しかし事故は朝の通勤時間帯に発生し、車内は混雑していた。結果として、死者107人、負傷者562人となり、戦後日本で最悪の鉄道事故となった。医療関係者の一部は、衝突で即死したのではなく、長時間の圧迫によるクラッシュ症候群で後に死亡した乗客が複数いた可能性を指摘している。"
 JAP_historical.180906001.t: "悠仁親王殿下のご誕生"
 JAP_historical.180906001.d: "2006年9月6日、秋篠宮文仁親王と妃殿下紀子さまのご長男が、南麻布の民間病院でご誕生された。第3千年紀最初の親王であるこのお子さまは、「悠仁（ひさひと）」と命名された。名の意味は、「悠（ひさ）」が「ゆったりとしたさま」を表し、「仁（ひと）」は平安時代以来の皇族の命名伝統に基づくものである。ご出産は民間病院での帝王切開により行われ、皇居内ではない病院での出産と帝王切開のいずれも、皇室史上初めてのことだった。\n\nこの男子のご誕生は、新たな皇族の誕生であると同時に、皇位継承における正統な男子として歓迎された。男児誕生を受けて、皇室典範改正をめぐる議論は、次第に沈静化していった。"
 JAP_historical.180906001.oA: "万歳！"
 JAP_historical.190216001.t: "\"消えた年金\""
 JAP_historical.190216001.d: "In 1997, Japan's Social Insurance Agency (SIA) began consolidating individual pension records under a single \"Basic Pension Number\" system. However, between 2006 and 2007, the agency discovered approximately 50 million pension records that remained unlinked or had discrepancies due to errors during the transcription of paper documents into digital format.\nSome of these missing records affected current pension recipients, raising concerns that individuals may have received incorrect payment amounts. Additionally, certain records were reportedly lost or mistakenly deleted during attempts to update employee pension data.\nIn response, [JAP.GetRulingParty] launched a special task force to investigate the issue and proposed emergency legislation to provide relief to those affected. Nevertheless, opposition parties are harshly criticizing the government, and public dissatisfaction remains high."
 JAP_historical.190216001.oA: "なんという大惨事だ！"
 JAP_historical.190325001.t: "2007年能登半島地震"
 JAP_historical.190325001.d: "2007年3月25日 午前9時41分――北陸地方をマグニチュード6.9の強い地震が襲った。気象庁は石川県輪島市で最大震度6強を観測し、1922年に地震観測が始まって以来、同市で最も強い地震となった。震源は、これまで断層が確認されていない地域に位置すると報告されている。\n\n揺れは北海道から高知にかけて広い範囲に達し、最大20cm（7.87インチ）の津波も発生した。地震により、石灯籠の倒壊で1人が死亡し、356人が負傷、3万棟を超える建物や住宅が損壊した。"
 JAP_historical.190716001.t: "2007年新潟県中越沖地震"
 JAP_historical.190716001.d: "2007年7月16日 午前10時13分――新潟県を、マグニチュード6.8の地震が再び襲った。気象庁は複数の町で最大震度6強を観測したが、柏崎刈羽原子力発電所では非公式ながら震度7相当と算定された。揺れに伴う津波も発生し、柏崎市では1m（3.28フィート）を記録した。\n\nこの地震により、直接・間接を含めて15人が死亡し、2,346人が負傷、1,331棟の全壊家屋を含む3万4,000棟以上の建物が被害を受けた。さらに、前述の柏崎刈羽原子力発電所では火災が発生したが、初期消火段階での情報共有の誤りにより消火が2時間遅れ、その結果、環境への影響は無視できる範囲だったものの放射性物質の漏えいが起きた。\n\nこの地震は能登半島地震からわずか4か月後、そして甚大な被害を出した2004年新潟県中越地震から3年後に発生した。"
 JAP_historical.200614001.t: "2008年岩手・宮城内陸地震"
 JAP_historical.200614001.d: "2008年6月14日 午前8時43分――岩手県内陸部を震源とするマグニチュード7.2の強い地震が発生した。気象庁は宮城県栗原市と岩手県奥州市で最大震度6強を観測した。\n\n内陸地震であったにもかかわらず、震度3以上の揺れが北海道から関東にかけて記録された。今回の地震は、珍しいことに建物被害は比較的少なかった一方で、土砂崩れが多数発生し、最終的に死者17人、重傷70人、軽傷356人、そして6人が行方不明となった。橋の崩落や文化財の損傷なども報告されている。"
 JAP_historical.210811001.t: "2009年駿河湾地震"
 JAP_historical.210811001.d: "2009年8月11日 午前5時07分――駿河湾でマグニチュード6.5の大きな地震が発生し、1人が死亡、319人が負傷した。地震により、40cm（1.31フィート）の津波も発生した。気象庁は静岡県内の多くの地域で最大震度6弱を観測し、8,678棟の住宅やいくつかの歴史的建造物が損傷したが、住宅が完全に倒壊した例はなかった。\n\n静岡県を含む東海地域は、将来の「東海・東南海」大地震および津波における最重要の被害想定地域とされている。そのため住民は避難訓練を重ね、家具の固定や住宅・建物の耐震化を進めてきた。これが、地震規模の割に死傷者や被害が少なかった理由である。\n\nそれでも、工場、茶畑、東名高速道路などで被害が出たとの報告がある。"
 JAP_asteroid_mining_network_established: "Asteroid Mining Network Established for [JAP.GetNameWithFlag]"
 JAP_asteroid_mining_operation_active: "Currently Conducting an Asteroid Mining Operation"
 JAP_claiming_taiwan_tt: "This asserts a Japanese claim on every Taiwanese island state at once. Once the claims are in place, complete the focus to demand Taiwan's submission."
 JAP_improvement_private_investment_climate_idea: "Improve the Private Investment Climate"
 JAP_improvement_private_investment_climate_idea_desc: "Government spending alone cannot complete the recovery. Firms must be given the confidence to invest again, and uncertainty about the future must be reduced. A lasting recovery requires businesses to move from defense back to expansion."
 JAP_demographic_crisis: "Unprecedented Measures for the Crisis"
 JAP_demographic_crisis_desc: "Japan's Children and Families Agency coordinates a whole-of-government response to demographic decline: pronatalist incentives, female workforce mobilization, or immigration reform. The Diet commits to only one pathway. Each pays its bill in a different currency: cash allowances, workforce disruption, or cultural transformation."
 JAP_demographic_crisis_tt: "Marks the beginning of Japan's response to its demographic decline. The three strategies that follow are mutually exclusive."
 JAP_immigration_backlash_opposition_tt: "§RImmigration backlash:§! anti-immigration sentiment swells the nationalist opposition"
 JAP_immigration_backlash_stability_tt: "§RImmigration backlash:§! anger over the influx of foreigners erodes stability"
 JAP_traditionalist_backlash_opposition_tt: "§RTraditionalist backlash:§! conservative anger at the retreat of the traditional family swells the nationalist opposition"
 JAP_traditionalist_backlash_stability_tt: "§RTraditionalist backlash:§! conservative anger at the retreat of the traditional family erodes stability"
 JAP_japan_belongs_to_the_japanese: "Japan Belongs to the Japanese"
 JAP_japan_belongs_to_the_japanese_desc: "Japan will raise the birthrate through family allowances, pronatalist incentives, and cultural renewal. The state commits to permanent welfare spending regardless of whether births rise. This path trades the fiscal uncertainty of decline for the certainty of irreversible entitlements."
 JAP_pronatalist_turn: "Plus One Initiative"
 JAP_pronatalist_turn_desc: "Japan will launch a comprehensive campaign to encourage childbearing as a civic priority, drawing inspiration from the 'Plus One' strategy of the early 2000s. Through tax incentives, public messaging, and cultural recognition of families with multiple children, the state will shift social attitudes toward larger families while providing concrete support that makes parenthood more affordable and appealing."
 JAP_national_revival_campaign: "Regional Revitalization Initiative"
 JAP_national_revival_campaign_desc: "Japan will channel investment into the regions, reviving local communities that have hollowed out as young people drift toward Tokyo. By creating jobs, improving amenities, and restoring faith in provincial Japan, we aim to anchor families outside the metropolis and slow the concentration of population that deepens rural decline. Strong regions are the foundation for stable families and sustainable birth rates."
 JAP_three_generation_household: "The Three-Generation Household"
 JAP_three_generation_household_desc: "Japan will subsidize three-generation households through tax incentives and housing support, reviving an arrangement where grandparents provide childcare and elder care without market wages. The state offloads welfare costs onto family bonds, reducing its own spending. Care given at home is care the state does not pay for."
 JAP_homeland_production_drive: "Monozukuri at Home"
 JAP_homeland_production_drive_desc: "Japan will deepen its commitment to domestic manufacturing, investing in automation and worker training to maximize output from a shrinking workforce. Rather than offshore production or hire migrants, Japan pursues the monozukuri tradition, the art of making things well. The tradeoff is energy strain and higher costs."
 JAP_incentivize_large_families: "Expanded Child Allowance"
 JAP_incentivize_large_families_desc: "Japan will expand the jido teate child allowance with generous cash grants rising with each additional child. By making parenthood more affordable, the state removes a binding constraint on family size. Once written into law, the allowance becomes a permanent entitlement no future government will dare to cut."
 JAP_state_family_mandate: "The Family as State Imperative"
 JAP_state_family_mandate_desc: "Japan will mandate family formation through employment law, pension incentives, and social messaging pressuring women toward motherhood and men toward parenthood. This is the cheap answer: the state spends little while conscripting citizens into reproduction. The cost is legitimacy and resentment."
 JAP_a_nation_reborn: "A Nation Reborn"
 JAP_a_nation_reborn_desc: "The birthrate has stabilized and begun to rise, motherhood is honored, and regional communities are revitalized. Japan has reversed demographic decline through sustained pronatalist investment. Two decades of allowances, housing subsidies, and elder care have hardened into entitlements no future government can cut."
 JAP_womenomics: "Womenomics"
 JAP_womenomics_desc: "Japan will mobilize women across all economic sectors by dismantling barriers, providing childcare, and shifting corporate culture. This unlocks productive capacity and tax revenue without producing additional children. The state must build and staff the childcare system, and conservative Japan will read it as an attack on the family."
 JAP_eliminate_daycare_waitlists: "Zero Waitlisted Children Initiative"
 JAP_eliminate_daycare_waitlists_desc: "Japan will implement the Childrearing Safety Plan, expanding nurseries, daycare centers, and after-school care until the waiting lists are gone. Heavy investment in worker wages and facility construction removes the binding constraint on female workforce participation. These facilities must be staffed and funded in perpetuity."
 JAP_reform_spousal_tax_deduction: "Dismantle the 1.03 Million Yen Wall"
 JAP_reform_spousal_tax_deduction_desc: "Japan will eliminate the spousal tax deduction cliff at 1.03 million yen and restructure the social insurance thresholds behind it. This removes the penalty on full-time employment that has locked millions of women into part-time work. Demolishing the wall releases a vast pool of experienced, educated women into full-time employment."
 JAP_normalize_parental_leave: "Ikumen Campaign"
 JAP_normalize_parental_leave_desc: "Japan will launch the Ikumen campaign, guaranteeing paid parental leave to both parents and pressuring men to take it. When fathers routinely become caregivers, women are no longer trapped by motherhood and the burden is shared. Firms will bear the cost in lost output, and the salaryman generation will not concede quietly."
 JAP_women_in_management: "The 202030 Initiative"
 JAP_women_in_management_desc: "Japan will pursue the 202030 goal: three in ten leadership positions held by women. The Act on Promotion of Women's Participation and Advancement in the Workplace sets binding corporate and public-sector targets, enforces disclosure, and rewards the firms leading the shift. Women will hold meaningful power in every boardroom and civil-service bureau."
 JAP_family_first_model: "Work Style Reform: Family Path"
 JAP_family_first_model_desc: "The Work Style Reform movement will prioritize the family pathway: flexible scheduling, part-time career tracks, and expanded child allowances will make it possible for women to stay in the workforce without sacrificing the possibility of motherhood. This path accepts lower overall output to preserve both careers and births, betting that social stability and modest demographic recovery matter more than maximum economic growth."
 JAP_career_first_model: "Work Style Reform: Career Path"
 JAP_career_first_model_desc: "The Work Style Reform movement prioritizes the career pathway: no flexibility, no part-time tracks, but genuine equality in advancement and pay. Women compete on equal footing for every position, maximizing economic output and female income. This makes motherhood harder, and birth rates will fall further as many choose ambition over family."
 JAP_a_society_where_women_thrive: "A Society Where Women Thrive"
 JAP_a_society_where_women_thrive_desc: "Structural barriers have fallen and women work at every level with genuine equality and choice, deepening the labor force and the tax base alike. What the reform never delivered was children. Japan works more and earns more, still shrinking, sustained by a childcare and education apparatus the state must fund forever."
 JAP_open_japan: "Open Japan"
 JAP_open_japan_desc: "Japan will systematically draw workers from abroad through migration pacts, skills-based immigration, and visa reform to fill the labor gap. This closes the labor shortage within years rather than decades, securing full employment and pension solvency. Cultural identity comes under strain, communities change faster than consent, and every step invites nationalist backlash."
 JAP_labor_migration_pact: "Bilateral Labor Mobility Agreements"
 JAP_labor_migration_pact_desc: "Japan will formalize bilateral labor arrangements with neighboring countries, expanding the Technical Intern Training Program and establishing new reciprocal agreements to bring workers into construction, agriculture, nursing care, and manufacturing. These pacts are rapid and efficient: tens of thousands of workers can be onboarded within months, filling critical labor gaps and stabilizing employment in sectors that would otherwise contract or disappear entirely."
 JAP_points_based_immigration: "Highly Skilled Professional Program"
 JAP_points_based_immigration_desc: "Japan will establish a points-based system for highly skilled professionals, awarding points for qualifications, work experience, language ability, and prior residence. Engineers, nurses, researchers, and finance professionals fill high-value jobs and ease the constraint on growth. Skilled arrivals bring families and expect international schooling, a cost the state absorbs in exchange for research capacity it could not otherwise buy."
 JAP_integration_programs: "Tabunka Kyosei Integration Framework"
 JAP_integration_programs_desc: "Japan will invest in active integration, tabunka kyosei, through language classes, community centers, and permanent residency pathways for migrant workers and their families. Newcomers given the tools to belong generate less friction and contribute more fully. Language instruction, schooling, and welfare for migrant families become a standing budget charge that buys back what unmanaged migration costs in policing."
 JAP_multicultural_society: "A Multicultural Society"
 JAP_multicultural_society_desc: "Japan extends legal status, civic participation, and cultural recognition to migrants and their children as full members of the national community. It is a profound break with historical insularity, turning potential resentment into belonging and sustaining social stability. Full civic and welfare rights for millions of new Japanese are expensive, permanent entitlements that will not come off the education and social accounts again."
 JAP_guest_worker_system: "Specified Skilled Worker Visa Expansion"
 JAP_guest_worker_system_desc: "Japan will expand the Specified Skilled Worker visa, tokutei gino, bringing workers on fixed-term contracts for construction, agriculture, nursing care, and manufacturing. They come, do the work, and return home when the contract ends, filling the labor gap without the friction of permanent immigration. It creates a rotating population with few protections and no stake in the community, and policing it becomes a standing business cost."
 JAP_an_open_nation: "An Open Nation"
 JAP_an_open_nation_desc: "Japan's population has stabilized and grown through migration, transforming a monoethnic country into a multicultural one. Economic stability and pension solvency are preserved, but the sense of ethnic homogeneity has fractured and the older generation mourns a nation passing away. Policing, schooling, and social provision for a population that arrived faster than institutions were built will stay elevated for a generation."
 JAP_economic_sectors: "Japan's Economic Sectors"
 JAP_economic_sectors_desc: "From locally rooted agriculture, forestry, and fisheries to manufacturing, services, and advanced technologies, we will bring out Japan's strengths across the entire industrial landscape. While supporting domestic employment and supply capacity, we will balance export competitiveness with investment in new growth fields, carrying our industrial foundation forward into the next era."
 JAP_agricultural_revitalization: "Revitalizing the Primary Industries"
 JAP_agricultural_revitalization_desc: "The Ministry of Agriculture, Forestry and Fisheries revises the Basic Act for the first time in a quarter century, binding all three sectors into a unified national strategy for food security. As the average farmer ages toward seventy and fields abandon across the countryside, this integration becomes the foundation for rural recovery and every reform that follows."
 JAP_corporate_farm_consolidation: "Farmland Banks and the End of Gentan"
 JAP_corporate_farm_consolidation_desc: "The Farmland Consolidation Banks gather scattered plots into larger holdings while the abolition of the gentan rice quota ends half a century of paying farmers to leave fields fallow. Mechanization and market discipline will lift productivity, but small family growers unable to compete will be pushed from the land."
 JAP_revitalize_rural_communities: "The Regional Revitalization Strategy"
 JAP_revitalize_rural_communities_desc: "Under the banner of chiho sosei, the government sustains farming in remote districts through direct payments and channels urban wealth back to villages via the hometown tax, enticing young families to settle where fields would otherwise return to wilderness. Growth here is slower than corporate consolidation, but it keeps the countryside alive."
 JAP_smart_rice_farming: "Smart Farming and the Craft of Sake"
 JAP_smart_rice_farming_desc: "Japan pairs rice heritage with smart agriculture: satellite guidance, drones, and sensor-driven paddies let a shrinking, aging workforce tend more land with fewer hands. Premium brands such as Koshihikari and the global thirst for Japanese sake carry the harvest to tables at home and abroad."
 JAP_premium_wagyu_brand: "The Wagyu Export Brand"
 JAP_premium_wagyu_brand_desc: "Building on protected geographical indications and the law shielding wagyu genetics from smuggling, Japan develops the breed into a premium export commanding its price on provenance and quality rather than volume. The finest restaurants of the world will carry Japanese beef."
 JAP_sustainable_fisheries: "The Fisheries Act Reform"
 JAP_sustainable_fisheries_desc: "The 2018 reform of the Fisheries Act, the first overhaul in seventy years, imposes science-based catch quotas and rewards responsible fishing while pouring investment into aquaculture from farmed bluefin to coastal shellfish. Sustainable seas will keep coastal towns working and the nation's food culture supplied."
 JAP_forestry_revival: "The Forest Environment Tax"
 JAP_forestry_revival_desc: "Funded by the Forest Environment Tax, Japan thins and replants neglected cedar and cypress plantations, mechanizes logging, and promotes cross-laminated timber so domestic wood returns to construction sites. A revived forestry sector brings work back to the mountain villages and turns a long-idle resource into national strength."
 JAP_pharmaceutical_powerhouse: "Confronting the Drug Lag"
 JAP_pharmaceutical_powerhouse_desc: "Japan's third-largest pharmaceutical market is held by Takeda, Astellas, Daiichi Sankyo, and Chugai, yet a widening drug lag leaves patients waiting years for overseas medicines. The government streamlines PMDA approval and backs biotech and regenerative medicine, turning a mature industry into an engine of high-value growth."
 JAP_rural_revitalization: "The Sixth Industrialization"
 JAP_rural_revitalization_desc: "Under the sixth industrialization, rokuji sangyoka, primary producers also process and sell what they produce. Farm-stays, branded regional foods, and direct-to-consumer sales turn struggling villages into destinations, drawing young families back to the land as the most reliable anchor against the demographic tide."
 JAP_agricultural_construction_drive: "Agricultural Construction Drive"
 JAP_agricultural_construction_drive_desc: "A concerted national push to break ground on new farmland and rural facilities while the political will and subsidies are aligned, accelerating construction across the countryside."
 JAP_automotive_industry: "The Wheels of the Nation"
 JAP_automotive_industry_desc: "Seven Japanese makers together assemble eight million vehicles a year, sustaining roughly one in twelve Japanese jobs including parts makers, dealers, and haulers. From Aichi's assembly halls to Yokohama's export wharves, Japan will defend its place as the world's largest vehicle exporter."
 JAP_lean_production_system: "The Toyota Production System"
 JAP_lean_production_system_desc: "The Toyota Production System has shaped modern manufacturing through just-in-time delivery, jidoka, and kaizen pursuit of eliminating muda, letting Japanese plants build more cars with fewer defects and less inventory than any rival. Japan will spread lean discipline across industry, training a generation to see waste where others see none."
 JAP_keiretsu_supplier_network: "The Keiretsu Supplier Web"
 JAP_keiretsu_supplier_network_desc: "Behind every finished car stands a pyramid of suppliers bound by decades of trust: Denso, Aisin, Toyota Industries, and thousands of smaller shops each a master of its craft through monozukuri discipline. Japan will deepen these keiretsu ties and guarantee survival of tier-two and tier-three suppliers, making supply chain resilience a strategic asset."
 JAP_precision_machine_tools: "The Robots That Build the Cars"
 JAP_precision_machine_tools_desc: "FANUC and Yaskawa dominate the world market for industrial robots, while Yamazaki Mazak, DMG Mori, and Okuma set the standard in precision machine tools. As the workforce ages and shrinks, Japan will invest heavily in robotics and mechatronics, keeping the nation the workshop that equips the factories of the world."
 JAP_domestic_champions: "The Lexus Standard"
 JAP_domestic_champions_desc: "Lexus proved Japan could challenge the German luxury houses on their own ground, a lesson that has since spread across the industry. Japan will cultivate the brand value of its engineering and chase the high-margin segments, competing on quality and prestige rather than price alone."
 JAP_hybrid_powertrains: "The Hybrid Revolution"
 JAP_hybrid_powertrains_desc: "The Prius proved Japan could gamble where others feared, marrying petrol engine and electric motor without demanding the charging network the world did not yet have. Japan will double down on this hybrid path, refining it into the pragmatic bridge between the age of oil and whatever comes next."
 JAP_battery_electric_shift: "The Battery Electric Gamble"
 JAP_battery_electric_shift_desc: "The Nissan Leaf was the first mass-market electric car, yet Japan has since watched rivals race ahead on pure battery power. To catch up, the government commits to crash programs in solid-state cells and a wave of domestic gigafactories, so the most valuable part of the car is built at home."
 JAP_hydrogen_society: "Toward a Hydrogen Society"
 JAP_hydrogen_society_desc: "The Mirai fuel-cell sedan and the Basic Hydrogen Strategy set out a vision where cars, trucks, homes, and power stations run on the most abundant element in the universe, emitting nothing but water. Japan will build the refuelling network and back the fuel-cell makers, pursuing hydrogen as a distinctly Japanese answer to the end of combustion."
 JAP_automotive_superpower: "The Mobility Superpower"
 JAP_automotive_superpower_desc: "Japan will not be forced to choose a single road into the future. By mastering the hybrid, the battery, and the fuel cell all at once while keeping the lean plants and the supplier web that build them the finest in the world, Japan secures its place as the mobility superpower of the century."
 JAP_automotive_retooling_drive: "Assembly Line Retooling"
 JAP_automotive_retooling_drive_desc: "A national drive to retool and modernize the automotive assembly lines, re-laying the plants for the next generation of vehicles while investment and political will are aligned."
 JAP_battery_gigafactory_program: "Battery Gigafactory Program"
 JAP_battery_gigafactory_program_desc: "A concentrated push to stand up domestic battery gigafactories, ramping cell production capacity at speed so that the heart of the electric car is built at home rather than imported."
 JAP_motorcycle_kingdom: "Kingdom of Two Wheels"
 JAP_motorcycle_kingdom_desc: "Honda, Yamaha, Kawasaki, and Suzuki build the overwhelming majority of powered two-wheelers on Earth, from commuter step-throughs moving hundreds of millions across Southeast Asia to liter-class superbikes dominating the MotoGP and World Superbike grids. Japan will invest in two-wheel plants and defend the engineering lead that keeps rivals chasing Japanese engines a generation behind."
 JAP_kei_car_mobility: "The Kei Car Nation"
 JAP_kei_car_mobility_desc: "Nearly two in five new cars sold in Japan belong to the kei class, minicars capped at 660cc by a tax code written for a poorer country, and as the population ages outside the cities the kei car becomes the last practical way for pensioners to reach the clinic or the shop. Japan will keep the kei class affordable and well-built, sustaining mobility where the trains no longer run."
 JAP_jdm_soft_power: "The Gran Turismo Nation"
 JAP_jdm_soft_power_desc: "The Skyline GT-R, the Supra, and the RX-7 have become global icons of car culture through anime such as Initial D and the Gran Turismo franchise, which taught a generation of players to love the JDM badge. Japan will cultivate this export of image alongside steel, backing tuner shops, touge culture, and the motorsport heritage that make Japanese performance cars objects of worldwide devotion."
 JAP_export_wharves: "The Export Wharves"
 JAP_export_wharves_desc: "Roughly half of every vehicle assembled in Japan rolls onto car carriers at Yokohama, Nagoya, or Kobe, bound for ports across the world, making Japan the largest vehicle exporter on the planet. The government will expand the wharves, marshalling yards, and carrier fleet that keep this flow of automobiles moving outward without interruption."
 JAP_automotive_export_drive: "Automotive Export Drive"
 JAP_automotive_export_drive_desc: "A time-limited national push to expand assembly and export-plant capacity, adding shifts and floor space at the car and component plants while the export order books are full."
 JAP_electronics_revitalization: "Revitalizing Electronics and Semiconductors"
 JAP_electronics_revitalization_desc: "Japan's electronics industry has been driven out of markets it once ruled by competitors in Korea, Taiwan, and China. Under METI's semiconductor revitalization strategy, the state marshals the surviving strengths in materials, tools, and precision engineering to rebuild competitive capacity. The old mastery of the chip can be recovered if the investment flows now."
 JAP_semiconductor_materials: "Masters of Materials and Equipment"
 JAP_semiconductor_materials_desc: "Japan never lost its grip on the upstream of the chip supply chain: Tokyo Electron dominates deposition and etch tools, Shin-Etsu and SUMCO supply the world's silicon wafers, and JSR and Tokyo Ohka hold the photoresist market. The government expands investment in that leverage, leaving every foreign foundry dependent on Japanese materials and Japanese machines."
 JAP_rapidus_moonshot: "The Rapidus Moonshot"
 JAP_rapidus_moonshot_desc: "Rapidus, backed by Toyota, Sony, and the state, races to build a two-nanometre fab at Chitose in Hokkaido in partnership with IBM and imec. No Japanese firm has touched the cutting edge in years and the gap to TSMC is measured in billions. If it lands, Japan re-enters the frontier of the industry in a single bound."
 JAP_foundry_partnership: "The Kumamoto Foundry Partnership"
 JAP_foundry_partnership_desc: "Where Rapidus gambles on the cutting edge, JASM in Kumamoto partners with TSMC and Sony to produce mature nodes for automobiles and sensors. It is a lower ceiling than the moonshot and a floor beneath the economy: chips made at home, in volume, for the industries that cannot afford to run short."
 JAP_semiconductor_sovereignty: "Semiconductor Sovereignty"
 JAP_semiconductor_sovereignty_desc: "Design houses, tool makers, material suppliers, and fabs are knitted into a self-sustaining domestic ecosystem. In an age of export controls and choke points, Japan will not again stand dependent on foreign goodwill for the silicon its economy runs on."
 JAP_home_electronics: "The Ghost of the Galapagos"
 JAP_home_electronics_desc: "The Galapagos syndrome left Japanese consumer electronics brilliant at home and unfit for sale abroad, and the gara-kei feature phone was obsolete the moment the smartphone landed. Sharp, Sony, and Panasonic have been driven from markets they once ruled. The state steadies what remains, keeping the assembly lines and the craft alive while the industry finds its footing."
 JAP_gaming_powerhouse: "The Gaming Powerhouse"
 JAP_gaming_powerhouse_desc: "Nintendo's consoles rank among the best-selling ever made, Sony's PlayStation anchors a global empire, and Capcom, Sega, Square Enix, and Bandai Namco supply the software behind both. The government expands studio and hardware investment and widens the talent pipeline that keeps Japan at the centre of interactive entertainment."
 JAP_rights_and_licensing_regime: "Rights and Licensing Abroad"
 JAP_rights_and_licensing_regime_desc: "Anime, manga, games, and music carry Japan's image further than any embassy, and the Cool Japan initiative exists to convert that reach into revenue. The state invests in distribution, translation, and rights management so creative output earns abroad instead of leaking there. Every licence is signed under foreign contract law and foreign broadcast standards, and the industry learns that one deal at a time."
 JAP_broadband_nation: "A Nation on Fibre"
 JAP_broadband_nation_desc: "NTT and its rivals laid fibre to the home while much of the world still crawled on copper, giving Japan some of the fastest and cheapest connectivity on earth. The government extends high-capacity fibre into the last underserved valleys and islands so no corner of the country is cut off from the digital economy."
 JAP_beyond_5g: "Toward Beyond 5G"
 JAP_beyond_5g_desc: "Japan was shut out of the smartphone wars and does not intend to miss Beyond 5G. The state funds research consortia and open network architectures, from the radio access network to the optical backbone, so Japanese firms set the terms of the networks of the 2030s rather than merely buying them."
 JAP_electronics_superpower: "Electronics Superpower Once More"
 JAP_electronics_superpower_desc: "Materials, fabs in Hokkaido and Kyushu, consoles, and fibre infrastructure now complete the whole electronics architecture. The old master of the silicon age has fought its way back to the frontier. Seoul, Taipei, and Shanghai must reckon with Japan's return."
 JAP_energy_resource_strategy: "The Strategic Energy Plan"
 JAP_energy_resource_strategy_desc: "The Ministry of Economy, Trade and Industry coordinates the Basic Energy Plan across power generation, grid resilience, and resource security to insulate the nation from energy shocks. From nuclear to renewables to strategic reserves, this office directs the whole apparatus of the state toward keeping the lights on and the smelters fed."
 JAP_renewable_energy_expansion: "The Feed-in Tariff Revolution"
 JAP_renewable_energy_expansion_desc: "The feed-in tariff unleashes solar capacity across Kyushu and wind farms off Akita, while the Top Runner efficiency standards squeeze waste out of every appliance and factory line. Kyocera and Sharp shift into the solar trade. The sun and wind can never be embargoed."
 JAP_power_grid_stabilization: "Never Again in the Dark"
 JAP_power_grid_stabilization_desc: "New frequency converters and interconnectors knit the country into a single resilient system, bridging the fifty-hertz east and sixty-hertz west divide that once split the grid. Utilities are ordered to hold reserve capacity and to choose whether solar, thermal, or storage answers each shock as it comes."
 JAP_resource_security_initiative: "Secure the Sinews of Industry"
 JAP_resource_security_initiative_desc: "The national resource strategy spans strategic stockpiles, overseas mining equity, recycling, and the exclusive economic zone, all of it aimed at insulating industry from embargo. The ministries direct steel, oil, and rare metals to the factories that need them most, turning imported dependence into managed resilience."
 JAP_hydroelectric_power: "Harness the Mountain Rivers"
 JAP_hydroelectric_power_desc: "Japan's steep, rain-fed rivers turn reliable turbines, while pumped-storage stations such as Kannagawa bank cheap night-time power for the evening peak. Re-machined dams push greater output from infrastructure the country already owns. The flow is clean, domestic, and constant."
 JAP_hydroelectric_power_TT: "Increase Hydroelectric Power Generated in §Y[613.GetName]§!, §Y[615.GetName]§! and §Y[616.GetName]§! by §G25%§!"
 JAP_geothermal_development: "Fire Beneath the Islands"
 JAP_geothermal_development_desc: "The Japan Organization for Metals and Energy Security funds geothermal exploration from Hachijojima to the Appi highlands, over the objections of the national parks and the hot-spring owners. Binary-cycle plants deliver constant power day and night whatever the weather, tapping the heat of the Ring of Fire to serve the grid."
 JAP_geothermal_development_TT: "Increase Geothermal Power Generated in §Y[609.GetName]§!, §Y[616.GetName]§! and §Y[617.GetName]§! by §G25%§!"
 JAP_nuclear_restart: "Restart the Reactors"
 JAP_nuclear_restart_desc: "Under the Green Transformation policy, the government brings the nuclear fleet back online from Sendai in Kyushu to the vast Kashiwazaki-Kariwa complex on the Japan Sea. Regulators are strict and the public is wary, but the arithmetic of energy security is unforgiving. The atom must carry the base load once more.\n-------------\nRe-enables nuclear generation and opens the §YReactor Restart Programme§!, in which each station is brought back one at a time. Sendai, Ikata, and the Fukui cluster can be started at once; the harder sites follow as the regulatory and consent focuses are completed."
 JAP_nuclear_regulatory_compliance: "Meet the New Safety Standards"
 JAP_nuclear_regulatory_compliance_desc: "Stations seeking restart must pass the Nuclear Regulation Authority's standards, the strictest in the world: seismic and tsunami backfits, mandatory safety facilities, and review that grants nothing on trust. The work is slow and enormously expensive, and it is the only path to an operating fleet. A station that clears it runs better than it did before.\n-------------\nClears the §YTightened Nuclear Safety Standards§! spirit and opens the Genkai, Onagawa, and Shimane restarts."
 JAP_local_consent_accords: "Win Local Consent"
 JAP_local_consent_accords_desc: "A restart requires more than the regulator's approval, because prefectural governors and host municipalities hold an effective veto and the district courts have granted injunctions before. Kagoshima and Ehime cleared Sendai and Ikata through negotiated host-community accords of grants, jobs, and patient local confidence. The subsidy regime is expensive, and it is what makes the hardest restarts possible at all.\n-------------\nOpens the Tomari and Kashiwazaki-Kariwa restarts, the two hardest sites in the country."
 JAP_restart_flagship_fleet: "The Rokkasho Fuel Cycle"
 JAP_restart_flagship_fleet_desc: "The reprocessing plant at Rokkasho in Aomori closes the fuel cycle, recovering plutonium and uranium from spent fuel for use in new reactors. Japan holds separated plutonium and the standing capacity to enrich it further, a fact Beijing, Seoul, and Pyongyang have never once failed to notice.\n-------------\nJapan's neighbours will take a §Rdim view§! of the stockpile."
 JAP_decommissioning_authority: "The Long Shutdown"
 JAP_decommissioning_authority_desc: "Dismantling the fleet safely takes decades, a shrinking pool of nuclear engineers held together, and site management long after the reactors go cold. The public breathes easier and the balance sheet does not. Every ageing reactor fleet in the world faces the same reckoning, and the nation that masters the work first can sell the expertise to all of them.\n-------------\nOpens the frequency converter, Hokkaido interconnector, and Kobe hydrogen projects."
 JAP_lng_bridge_supply: "The Fossil Bridge"
 JAP_lng_bridge_supply_desc: "Liquefied natural gas and coal fill the gap the idled reactors left, making Japan the largest LNG importer in the world. Gas-fired plants at Futtsu and Senboku can be built quickly and run hard, but every cargo is paid for in foreign currency. The household electricity bill carries the difference.\n-------------\nA bridge, and a §Rcostly§! one. The ammonia co-firing project is how Japan eventually gets off it."
 JAP_renewable_acceleration: "Sun, Wind, and Water"
 JAP_renewable_acceleration_desc: "Offshore wind auctions in the Akita and Chiba zones, utility-scale solar, and rewritten grid connection rules drive the renewable share upward faster than the feed-in tariff alone ever managed. Intermittency and grid limits remain, and the cheapest kilowatt-hour is still the one Japan has learned not to use."
 JAP_fusion_energy_program: "The Broader Approach"
 JAP_fusion_energy_program_desc: "Japan stood down from hosting ITER and took the Broader Approach in exchange: the fusion materials accelerator and the international research centre at Rokkasho, and the JT-60SA tokamak at Naka. Superconducting coils, gyrotrons, and a long apprenticeship in plasma physics are the return on that bargain.\n-------------\nWhether the reactors restart or wind down, the case for fusion holds. This is the one energy bet §Yneither road forecloses§!."
 JAP_national_energy_security: "A Nation Powered"
 JAP_national_energy_security_desc: "A stable, resilient supply (restored baseload or a renewable-and-storage grid) resting on a research base that reaches past fission. Energy security becomes the foundation of the wider economy."
 JAP_monarchy_resource_anchor_tt: "Effects of §Y$JAP_rare_earth_resilience$§! will be improved"
 JAP_reactors_recommissioned_tt: "The shuttered reactors are §Grecommissioned§! and may generate power again"
 JAP_national_energy_security_tt1: "With §Y6§! of the §Y8§! reactor sites back online (currently §Y[?JAP_reactor_sites_online|0]§!):"
 JAP_national_energy_security_tt2: "With §Y6§! of the §Y8§! green transformation projects delivered (currently §Y[?JAP_gx_projects_completed|0]§!):"
 JAP_national_energy_security_tt3: "Falling short of either mark:"
 JAP_minamitori_deep_sea: "The Mud of Minamitori"
 JAP_minamitori_deep_sea_desc: "The seabed inside Japan's exclusive economic zone around Minamitorishima holds rare-earth mud at concentrations found nowhere else on the planet, lying under more than five thousand metres of water. JOGMEC and the University of Tokyo fund the riser pipe and lifting trials that would make extraction possible at all. If the mud can be raised, Japan stops depending on a single foreign supplier for the metals its magnets and motors require."
 JAP_national_petroleum_stockpile: "Fill the National Reserves"
 JAP_national_petroleum_stockpile_desc: "The Japan Organization for Metals and Energy Security expands the strategic petroleum reserve held in the coastal tank farms at Shibushi, Kiire, and Tomakomai, adding salt-cavern and above-ground silos. The larger reserve buys the nation months of insurance against a closed Strait of Hormuz. A full tank is quiet power."
 JAP_grid_battery_storage: "The Grid of the Future"
 JAP_grid_battery_storage_desc: "GS Yuasa and Panasonic, veterans of the lithium-ion age, turn their cells toward grid-scale storage while state subsidies underwrite the batteries rising beside the substations. Combined with a smarter grid, storage smooths the peaks and fills the troughs. The electron saved at noon lights the city at dusk."
 JAP_urban_mining: "Mine the Cities"
 JAP_urban_mining_desc: "At its Naoshima and Onahama works, Mitsubishi Materials recovers gold, copper, and rare metals from electronic scrap shipped in from across the world. The medals of the Tokyo Olympics were struck from reclaimed metal. What the country throws away, it smelts anew."
 JAP_horizontal_recycling: "Metal Without End"
 JAP_horizontal_recycling_desc: "Horizontal recycling returns aluminium and steel to their original grade, closing the loop between the scrapyard and the rolling mill. UACJ and Kobe Steel build the sorting and refining lines that make can-to-can and part-to-part recovery work at industrial scale. A tonne kept in circulation is a tonne never imported again."
 JAP_nankai_methane_hydrate: "Fire Ice of the Nankai Trough"
 JAP_nankai_methane_hydrate_desc: "The Japan Organization for Metals and Energy Security presses its research vessels toward a commercial method for the methane hydrate locked in the Nankai Trough off the Pacific coast. Japan ran the world's first offshore production test there, and the engineering remains unproven while the economics stay daunting. Should the fire ice yield, Japan need never beg for gas again."
 JAP_model_competition: "East Asian Electronics Competition"
 JAP_model_competition_desc: "Japan's electronics industry is locked in a relentless contest with its neighbours. Samsung and SK Hynix dominate memory, TSMC owns the leading-edge foundry business, and China's fabs climb the ladder node by node with the backing of a near-bottomless state fund. Every advance by a rival is a market lost, a margin squeezed, a generation of engineers tempted abroad. Only sustained investment keeps the pressure at bay; let it slacken while the competition surges, and the ground gives way beneath Japan's feet.\n-------------\nRaising §YElectronics Resilience§! above the competitive pressure eases and eventually removes this national spirit. See §Y$JAP_technological_isolation_category$§! for the current figures."
 JAP_consumer_electronics_drive: "Consumer Electronics Drive"
 JAP_consumer_electronics_drive_desc: "A time-limited push to keep the domestic consumer electronics lines running at capacity, sustaining the plants, the suppliers, and the skilled hands that assemble them while the industry weathers the storm."
 JAP_foundry_localization: "Foundry Localization Program"
 JAP_foundry_localization_desc: "A concentrated effort to localize the foundry supply chain, standing up the tools, materials, and trained technicians around the new fabs so that domestic chip production can ramp at speed."
 JAP_electronics_export_offensive: "Electronics Export Offensive"
 JAP_electronics_export_offensive_desc: "Launch a coordinated push of subsidies, trade missions, and joint marketing to win back market share from foreign competitors, spending heavily to shore up Japan's position in the global electronics trade."
 JAP_electronics_resilience_up_tt: "§YElectronics Resilience§! against foreign competition: $RIGHT|+=0$"
 JAP_CHI_chip_rivalry: "Semiconductor Rivalry"
 JAP_electronics.1.t: "The Asian Challengers Close In"
 JAP_electronics.1.d: "The quarterly figures make grim reading in Tokyo. Samsung and SK Hynix have widened their lead in memory, TSMC's order book is bursting, and Chinese foundries are winning contracts that once came to Japan by default. Analysts speak openly of a Japanese electronics sector in structural decline. The boardrooms of Kawasaki and Osaka know the truth of it: the competition is no longer catching up, it is pulling ahead."
 JAP_electronics.1.a: "We will not cede the market without a fight."
 JAP_electronics.2.t: "China Reaches the Frontier"
 JAP_electronics.2.d: "The news lands like a hammer blow. Chinese fabs, propped up by the National Integrated Circuit Fund and undeterred by years of Western sanctions, have reached the leading edge of logic manufacturing that only a handful of firms on earth can touch. The last comfortable assumption of Japanese industry, that the mainland remained a generation behind, is gone. The frontier has moved, and Japan must decide whether to meet the challenge or be left in its wake."
 JAP_electronics.2.a: "The frontier has moved. We must answer."
 JAP_electronics.3.t: "Japan Reclaims the Silicon Crown"
 JAP_electronics.3.d: "Against the odds, the tide has turned. Japanese fabs are shipping in volume, Japanese materials remain indispensable, and Japanese design and content command respect the world over. The rivals in Seoul, Taipei, and Shanghai have not gone away, but for the first time in a generation they are the ones looking over their shoulders. The long retreat is over; Japan competes once more from a position of strength."
 JAP_electronics.3.a: "Japan stands once more at the summit of the industry."
 JAP_electronics.4.t: "Japan Returns to the Semiconductor Frontier"
 JAP_electronics.4.d: "In fabs from Hokkaido to Kyushu, in the research labs and the games studios and the fibre trenches, Japan has completed a resurgence few thought possible. A country written off a decade ago as the fading incumbent of the electronics age has clawed its way back to the leading edge and served notice that it means to remain there. The balance of the East Asian technology race has shifted, and every capital from Seoul to Washington is recalculating."
 JAP_electronics.4.a: "A remarkable resurgence."
 JAP_electronics.4.b: "The old giant still has teeth."
 JAP_demographic_pressure_modifier: "Demographic Pressure"
 JAP_demographic_pressure_modifier_desc: "Japan is one of the oldest and fastest-shrinking societies in the world, with deaths outnumbering births and the working-age population in sharp contraction. This crisis strains the labor force that sustains production, stretches welfare and health-care budgets to their limits, erodes fiscal stability, and tests the social fabric. Across six axes (population, workforce, stability, unemployment, health costs, and social costs) Japan faces interrelated pressures. Sustained, multifaceted reform across pro-family, employment, and immigration policies can ease these burdens and set the nation on a path toward stable or growing population."
 JAP_economy_modifier: "Japanese Economy"
 JAP_economy_modifier_desc: "The shared engine of Japan's economic renewal. As successive governments confront demographic decline and mounting competition from Korea, China, and Taiwan, reform reaches into every pillar of the economy: the fields and fisheries that feed the nation, the automakers and machine-tool houses that anchor its exports, the semiconductor and electronics champions racing to break out of stagnation, the drive to secure energy and critical resources for an archipelago almost without its own, and the rail arteries that knit the islands together. Every advance compounds here, lifting productivity, factory efficiency, and research while reshaping the demands Japan places on its industry, its resources, and its power grid."
 JAP_political_modifier: "Kokkai"
 JAP_political_modifier_desc: "Reforms undertaken in response to the demographic crisis are reshaping national politics, opening the country to migration while testing the social cohesion and stability of a nation unaccustomed to change."
 JAP_f15_programe_desc: "Mitsubishi's licence-built F-15J fleet is put through a staged modernisation: new radar, mission computers and cockpit displays on the airframes worth keeping, and a rationalised supply chain for the rest. Fighter and aerospace research runs faster, and light and medium airframes come off the line cheaper."
 JAP_submarine_modernization_idea_desc: "The diesel-electric fleet moves to air-independent propulsion and, later, lithium-ion cells, extending submerged endurance without a reactor. Kawasaki and Mitsubishi alternate the hulls at Kobe, which keeps two yards competent and drives the unit cost down."
 JAP_carrier_aviation_desc: "Fixed-wing naval aviation returns to the Japanese fleet for the first time since 1945. The helicopter destroyers are reassessed as aviation ships, deck coatings and elevators are studied for short take-off aircraft, and the doctrinal work of operating a carrier air group begins in earnest."
 JAP_keen_sword_operation_idea_desc: "The biennial joint exercise with the United States puts the Maritime Self-Defense Force through combined fleet manoeuvres, amphibious landings and air defence drills at a scale it cannot reach alone. Crews come back sharper, and the lessons outlast the exercise."
 JAP_nuclear_power_program: "Long-Term Nuclear Program"
 JAP_nuclear_power_program_desc: "Fifty-two reactors supply roughly a third of the nation's electricity, and the Atomic Energy Commission's Long-Term Program commits Japan to a closed fuel cycle built around reprocessing at Rokkasho. Operating performance is excellent, but consent has collapsed. The criticality accident at the JCO plant in Tokaimura killed two workers and destroyed public trust in the industry and its regulators, and in March 2000 the government placed the construction plans for all twenty proposed stations under review. Since Maki town voted its reactor down by referendum, no prefecture can be counted on to accept a new site."
 JAP_nuclear_local_consent: "Local Consent Accords"
 JAP_nuclear_local_consent_desc: "Prefectural governors and host municipalities have been brought back into the process through binding safety agreements, revenue sharing, and a right of prior consultation on restarts. The veto that stalled Japanese nuclear construction for a generation has been negotiated away rather than overridden, and the utilities can plan new capacity again."
 JAP_consolidate_national_defense_framework_cancel_tt: "Ends once the §YArticle 9§! bonus to §Ystability§! has faded and the penalties to §Ywar support§! and §Yrecruitable population§! have been fully worked off"
 JAP_modernize_joint_command_cancel_tt: "Ends once the §YArticle 9§! penalties to §Yarmy, air and naval experience gain§!, §Ycommand power§! and §Yofficer costs§! have been fully worked off"
 JAP_normalize_defense_procurement_mission: "Normalize Defense Procurement Systems"
 JAP_normalize_defense_procurement_mission_desc: "The expansion of defense responsibilities has placed great strain on existing procurement and industrial arrangements. Through careful reform, long-term planning, and closer coordination with industry, Japan works to normalize defense procurement and reduce the inefficiencies of the transition period."
 JAP_normalize_defense_procurement_cancel_tt: "Ends once the §YArticle 9§! penalties to §Yarmy attack§! and §Yarmy defence§! have been fully worked off and the bonuses to §Ycore territory attack§! and §Ycore territory defence§! have faded"
 JAP_establish_asteroid_mining_network_mission: "Establishing Asteroid Mining Network"
 JAP_establish_asteroid_mining_network_mission_desc: "Japan is assembling its first asteroid mining network, positioning orbital platforms and deploying prospecting equipment as off-world resource operations begin to take shape."
 JAP_reactor_restart_category: "The Reactor Restart Programme"
 JAP_reactor_restart_category_desc: "Fifty-four reactors once supplied a third of Japan's electricity. After 2011 every one of them went dark, and bringing them back is not a single decision but a campaign fought station by station, prefecture by prefecture. Each restart demands a regulatory review measured in years, the consent of a governor who answers to frightened voters, and a bill for seismic backfits that runs to hundreds of billions of yen. What it returns is the cheapest baseload power the country will ever have.\n\nEach completed restart §Gpermanently improves§! Japan's nuclear generation and lowers the cost of holding the fleet."
 JAP_restart_sendai: "Restart Sendai"
 JAP_restart_sendai_desc: "Kyushu Electric's two pressurized-water units at Satsumasendai in Kagoshima were the first in the country to clear the new safety standards, and in August 2015 Sendai Unit 1 became the first Japanese reactor to generate power in nearly two years. Governor Ito's consent made it possible; the seawall, the filtered vent, and the emergency control centre made it defensible."
 JAP_restart_ikata: "Restart Ikata"
 JAP_restart_ikata_desc: "Shikoku Electric's station sits on the narrow Sadamisaki peninsula in Ehime, with the Median Tectonic Line running a few kilometres offshore. Unit 3 returned to service in 2016 and has since been halted and restored more than once by the courts of neighbouring prefectures. No plant in Japan better illustrates that a licence from the regulator is only half the battle."
 JAP_restart_takahama_ohi: "Restart the Fukui Cluster"
 JAP_restart_takahama_ohi_desc: "Fukui prefecture hosts the densest concentration of reactors in the country. Kansai Electric's units at Takahama, Ohi, and Mihama supplied the industry of Osaka and Kobe for decades, and several of them are now old enough that operating them beyond forty years required a separate and contested extension. Restarting the cluster restores the industrial heartland's power supply in a single stroke."
 JAP_restart_genkai: "Restart Genkai"
 JAP_restart_genkai_desc: "Kyushu Electric's station in Saga prefecture returned in 2018 after backfits that included one of the first specialized safety facilities built to the new rules. Genkai also carries Japan's pluthermal programme, burning mixed-oxide fuel that closes part of the loop between the reactors and the reprocessing plant at Rokkasho."
 JAP_restart_onagawa: "Restart Onagawa"
 JAP_restart_onagawa_desc: "Onagawa in Miyagi sat closer to the epicentre of the 2011 earthquake than Fukushima Daiichi did, and its fourteen-metre seawall held. The town sheltered evacuees inside the plant's own gymnasium. Bringing Unit 2 back in 2024 was the first restart of a boiling-water reactor of the same type that failed at Daiichi, and it was the strongest argument the industry had."
 JAP_restart_shimane: "Complete Shimane Unit 3"
 JAP_restart_shimane_desc: "Chugoku Electric's station is the only nuclear plant in Japan sited within a prefectural capital, on the edge of Matsue itself. Unit 3 was built but never commissioned, left finished and idle through the long shutdown. Bringing it into service is not a restart at all but a first start, and the construction expertise recovered in doing it will not be lost again."
 JAP_restart_tomari: "Restart Tomari"
 JAP_restart_tomari_desc: "Hokkaido Electric's three units at Tomari are the only nuclear plant on the northern island, and their loss left Hokkaido dependent on a thin interconnector and ageing thermal capacity, as the island-wide blackout of 2018 made painfully clear. The seismic reassessment of the site dragged on for over a decade. Restoring Tomari is what makes Hokkaido's grid whole."
 JAP_restart_kashiwazaki_kariwa: "Restart Kashiwazaki-Kariwa"
 JAP_restart_kashiwazaki_kariwa_desc: "Seven units on the Niigata coast make this the largest nuclear power station ever built anywhere. It is also TEPCO's, the company that lost Fukushima, and Niigata's governors have spent years refusing to forget it. Security lapses at the site cost the company its operating permission outright for a time. If Kashiwazaki-Kariwa can be brought back, nothing in the fleet is beyond reach."
 JAP_gx_transition_category: "The Green Transformation"
 JAP_gx_transition_category_desc: "A Japan without reactors must find its power somewhere else, and the archipelago is short of everything except wind, heat, and engineers. The Green Transformation is the answer: floating turbines in waters too deep to anchor, the volcanic heat under the northern mountains, a grid finally stitched across the fifty and sixty hertz divide, and above all a national talent for using less than anyone thought possible.\n\nEach completed project §Gpermanently improves§! Japan's renewable output or cuts national demand, and closes the reactors in its region for good."
 JAP_gx_goto_floating_wind: "Goto Floating Offshore Wind"
 JAP_gx_goto_floating_wind_desc: "The seabed off Japan drops away too steeply for the fixed foundations used in the North Sea, which is why the country's offshore wind ambitions rest on floating platforms moored in deep water. The array off the Goto islands in Nagasaki is the proving ground for the technology, and the shipyards that once built tankers are the natural place to fabricate the hulls."
 JAP_gx_tohoku_geothermal: "The Tohoku Geothermal Cluster"
 JAP_gx_tohoku_geothermal_desc: "Japan holds the third-largest geothermal reserves on earth and uses almost none of them, blocked by national park boundaries and by hot-spring proprietors who fear the drill will take their water. Appi in Iwate broke the deadlock in 2024, the first large geothermal plant in decades. Where the volcanoes are, the power is, and it flows in the dark and in the calm alike."
 JAP_gx_kanto_setsuden: "The Setsuden Campaign"
 JAP_gx_kanto_setsuden_desc: "In the summer after the disaster, Tokyo simply used less. Offices dimmed their lights and abandoned neckties, factories shifted their shifts to the weekend, and the capital passed the peak without the blackouts everyone had predicted. Setsuden was supposed to be an emergency measure. Made permanent through building codes, industrial standards, and the Top Runner programme, it is worth more than a power station and costs a fraction of one."
 JAP_gx_frequency_converter: "The Frequency Converter Expansion"
 JAP_gx_frequency_converter_desc: "Tokyo runs at fifty hertz because it bought German generators in the 1890s, and Osaka runs at sixty because it bought American ones. A century later the two halves of the country still cannot freely share power, and in 2011 the west could only trickle a single gigawatt eastward while Tokyo went dark. Expanding the converter stations at Sakuma, Shin-Shinano, and Higashi-Shimizu finally makes one national grid out of two."
 JAP_gx_hokkaido_hvdc: "The Hokkaido Interconnector"
 JAP_gx_hokkaido_hvdc_desc: "Hokkaido has the best wind resource in Japan and the fewest people to use it, a combination that leaves turbines curtailed while Honshu burns imported gas. A high-voltage direct current link down the Japan Sea coast carries the northern wind to where the demand is, and it would have kept the lights on during the island-wide blackout of 2018 besides."
 JAP_gx_kobe_hydrogen: "The Kobe Hydrogen Supply Chain"
 JAP_gx_kobe_hydrogen_desc: "The world's first liquefied hydrogen carrier docked at Kobe in 2022, completing a supply chain that runs from Australian lignite fields to a terminal on Port Island. Hydrogen burns without carbon and stores what the turbines make and the grid cannot yet use, and Kawasaki Heavy has spent a decade building the tankers, tanks, and turbines to handle it."
 JAP_gx_hekinan_ammonia: "Ammonia Co-Firing"
 JAP_gx_hekinan_ammonia_desc: "The coal plant at Hekinan in Aichi is the largest in the country, and JERA has been feeding ammonia into its boilers alongside the coal, first at one part in five and aiming steadily higher. Ammonia carries hydrogen in a form that ships and pipelines already know how to handle, and it lets an existing fleet of thermal plants burn less fuel without being torn down and rebuilt."
 JAP_gx_shikoku_solar_storage: "Shikoku Solar and Storage"
 JAP_gx_shikoku_solar_storage_desc: "Shikoku has the strongest sunlight in Japan and a grid small enough that midday solar output has to be curtailed for want of anywhere to put it. Pairing utility-scale arrays with grid batteries moves the surplus from noon to the evening peak, which is the difference between renewable capacity that exists on paper and renewable power that is actually used."
 JAP_rubber_butadiene_branch_decision: "Butadiene Rubber Branch"
 JAP_rubber_butadiene_branch_decision_desc: "Natural rubber can be cut off, rationed, or priced into weakness, and Japan cannot allow that lever to exist. We will expand a butadiene based synthetic rubber branch to secure tires, seals, and critical components for industry and the armed forces."
 JAP_demand_south_kuril_reject_tt: "We may open a §Yborder war§! over §Y$STATE_1168$§!, or §Rdeclare war on [SOV.GetName]§! to seize the Northern Territories by force"
 JAP_demand_north_kuril_reject_tt: "We may open a §Yborder war§! over §Y$STATE_1168$§!, or §Rdeclare war on [SOV.GetName]§! to seize the Northern Territories by force"
 JAP_demand_sakhalin_reject_tt: "We may unlock a §YSpecial Forces Raid§! on §Y$STATE_691$§!, or §Rdeclare war on [SOV.GetName]§! to seize the Northern Territories by force"
 JAP_claiming_philippines: "Lay Claim to the Philippine Archipelago"
 JAP_claiming_philippines_desc: "The Philippine archipelago commands the approaches to the Western Pacific and the sea lanes that feed our industry. We will lay a formal claim and make clear that these islands fall within Japan's strategic sphere, whether others approve or not. Once declared, the region will understand that our navy intends to decide who passes through these waters."
 JAP_demographic_emergency_taskforce: "Declining Birthrate Emergency Response"
 JAP_demographic_emergency_taskforce_desc: "In response to demographic collapse, the government has established a whole-of-government emergency taskforce, mirroring the Children and Families Agency structure and coordinating rapid deployment of resources across every relevant ministry. Political attention is intense, bureaucratic silos are broken down, and a surge of policy experimentation becomes possible. This window of intense focus and mobilization is temporary; after 730 days of sustained effort, the emergency atmosphere fades and policymaking reverts to normal institutional patterns, though the reforms themselves endure."
 JAP_increase_birth_budget: "Emergency Child Allowance Doubling"
 JAP_increase_birth_budget_desc: "Japan will inject emergency treasury funds into the child allowance system, doubling direct cash transfers to households with children. This immediate, high-visibility spending provides relief to young families and signals state commitment to parenthood, lifting birth rates in the short term. The long-run cost is substantial, swelling the permanent entitlement budget, but the demographic dividends justify the expense while births remain depressed."
 JAP_child_care_subsidies: "Universal Free Early Childhood Education And Care"
 JAP_child_care_subsidies_desc: "Following the October 2019 policy, Japan will make early childhood education and care free to all families, eliminating tuition for nursery and preschool. The subsidy removes a major barrier to parental employment, freeing caregivers, primarily mothers, back into the workforce and enabling income-constrained households to have more children. The program is expensive but delivers both employment gains and modest fertility improvement."
 JAP_invest_in_robotics: "Society 5.0 Automation Drive"
 JAP_invest_in_robotics_desc: "Japan will accelerate the New Robot Strategy of 2015, subsidizing industrial automation, AI, and robotics to compensate for the missing workers. By replacing human labor in construction, manufacturing, and logistics with machines, Japan can maintain output with a smaller workforce. The strategy is capital-intensive but powerful, yet the displacement of low-skill workers can initially push up unemployment before new roles emerge in operation and maintenance."
 JAP_fertility_ivf_program: "In Vitro Fertilization Insurance Coverage"
 JAP_fertility_ivf_program_desc: "Japan will expand insurance coverage of in vitro fertilization (IVF) and assisted reproductive technology, making treatment accessible to all eligible couples regardless of income. Starting in 2022, insurance subsidies remove the economic barrier to infertility treatment, enabling couples who would otherwise remain childless to have children. The impact on birth rates is strong but the health-care system's cost burden rises sharply, placing pressure on public finances."
 JAP_family_housing_construction: "Affordable Family Housing Program"
 JAP_family_housing_construction_desc: "Japan will finance large-scale construction of affordable, family-sized housing aimed at childrearing households. High land and housing costs are a major barrier to family formation; subsidized construction lowers the financial threshold for young couples to marry and have children. The program is capital-intensive but it steadies society by offering young families a credible path to homeownership and signals state commitment to their future."
 JAP_marriage_support_program: "Newlywed Support Initiative"
 JAP_marriage_support_program_desc: "Japan will subsidize newlywed couples with housing grants and matchmaking services, including funding for konkatsu (marriage hunting) programs and AI-powered matchmaking platforms. The state will also partner with local governments to organize community-level marriage events. By reducing the financial and social friction around marriage formation, the program nudges birth rates upward at lower fiscal cost than childbearing incentives alone, though the effect is modest."
 JAP_raise_retirement_age: "Elderly Employment Stabilization Act"
 JAP_raise_retirement_age_desc: "Japan will gradually raise the official retirement age toward 70, extending mandatory employment contributions and deferring pension eligibility. Following the 2021 legislation, the state will incentivize employers to retain older workers and press them to offer continued employment past the traditional 65-year mark. It is politically painful, workers chafe at the extra years of labor and the government must spend political capital to force it through, but the workforce is directly enlarged and the pension burden eased."
 JAP_silver_employment_initiative: "Silver Human Resource Centers"
 JAP_silver_employment_initiative_desc: "Japan will establish and fund Silver Human Resource Centers in every major city, offering part-time job placement, re-training, and mentoring for healthy seniors over 65. These centers will match experienced retirees with employers needing flexible labor in cleaning, security, childcare support, and administration. The program is low-cost, preserves dignity, and adds productive workers without raising the compulsory retirement age, easing unemployment pressure at modest expense."
 JAP_preventive_health_program: "Healthy-Life-Expectancy Initiative"
 JAP_preventive_health_program_desc: "Japan will invest in population-wide preventive health: subsidized screening, vaccinations, lifestyle counseling, and early intervention for chronic disease. By keeping the aging population healthier and functionally independent longer, the state reduces the years spent in costly intensive care and nursing home residence. The program is pure prevention (not treating disease, but preventing it) and it yields high returns in reduced health-care costs as seniors remain active and self-sufficient into their 80s."
 JAP_elderly_care_reform: "Long-Term Care System Modernization"
 JAP_elderly_care_reform_desc: "Japan will restructure the Long-Term Care Insurance system to shift from institutional (nursing home) care toward community-based, integrated care: home helpers, day centers, local clinics, and family support rather than expensive residential facilities. By reducing reliance on costly institutions and mobilizing communities, the state cuts both the health and social-care budgets. The transition is disruptive, some lose preferred institutional care and the administration strains during the changeover, but the long-term savings are substantial."
 Japan.105.t: "Proclamation of the Empire"
 Japan.105.d: "The proclamation lies drafted on the cabinet table with the seal beside it and the date left open. Nothing further remains to be restored: the household stands, the rites are kept, the Privy Council sits. Only the wording is unsettled.\n\nThe Army Minister speaks first. An empire is measured on the continent, in divisions raised and ground held, and the proclamation should say as much. The Navy Minister answers without raising his voice. Japan is an island country that lives by its sea lanes, and a standard raised over the fleet will be read correctly in every port from Vladivostok to Singapore. Both men fall silent and look to the throne."
 Japan.105.a: "£JAP_EMPIRE_flag     The Empire's strength is in its armies."
 Japan.105.b: "£JAP_EMPIRE_NAVAL_flag     The Empire's strength is on the water."
 JAP_american_pressure_article_nine_desc: "Washington has linked the trade file to the defence file. Tariff threats and resource leverage are being used to push Tokyo toward a broader military role, and until the argument is settled Japan negotiates from the weaker side of the table."
 JAP_jsw_tank_mio_trait_ladle_refining: "Clean-Steel Ladle Refining"
 JAP_jsw_tank_mio_trait_muroran_arc_furnace: "Muroran Electric Arc Furnaces"
 JAP_jsw_tank_mio_trait_high_tensile_plate: "High-Tensile Plate Rolling"
 JAP_jsw_tank_mio_trait_scrap_recycling: "Scrap Reclamation Line"
 JAP_jsw_steel_modifier: "Japan Steel Works"
 JAP_jsw_steel_modifier_desc: "Every order placed with Japan Steel Works is an order placed with Muroran. The furnaces that pour the barrels and armor plate are the same furnaces that feed the shipyards, the construction trades, and the automakers, and each contract that keeps them running at capacity leaves the country less dependent on imported billet. What the defence budget buys in gun steel, the wider economy collects in tonnage."
 JAP_zombie_companies: "Zombie Companies"
 JAP_zombie_companies_desc: "Years of forbearance have kept unprofitable, over-indebted firms alive on cheap credit, tying up capital, labour, and management that healthier industries need. Until these firms are restructured or wound down, construction, productivity, and corporate tax receipts all suffer.\n-------------\nRaising §YCorporate Restructuring Progress§! unlocks the §Y$JAP_restructure_next_tranche$§! decision, which eases this national spirit one step at a time. See §Y$JAP_corporate_reform_category$§! for the current figures."
 JAP_ykk_group: "The YKK Group"
 JAP_ykk_group_desc: "Yoshida Kogyo makes roughly half the zippers produced anywhere, some seven billion a year out of plants in more than seventy countries. The company mills its own brass, spins its own polyester, mixes its own dyes and builds the machines that assemble the finished slider, a vertical integration that leaves nothing about the product outside its control. Military procurement is a small share of that business and an exacting one, because the fastener on a plate carrier, a load-bearing vest or a camouflage smock is the first component to fail in the field. Japanese uniform and protective equipment programmes draw on a supplier that can revise a webbing, a coating or a corrosion-resistant alloy in-house rather than wait on a subcontractor."
 JAP_karoshi_crisis: "The Karoshi Crisis"
 JAP_karoshi_crisis_desc: "Chronic overwork is grinding down Japan's workforce. Excessive unpaid overtime, the culture of 'service zangyo', drives stroke, heart failure, and suicide among salaried employees, while exhausted families put off having children. Stability, productivity, and research all suffer, healthcare and social spending climb, and the population edges downward year after year.\n-------------\nReform focuses and workplace campaigns raise §YWorker Wellbeing§!. At §G30§! and §G60§! the §Y$JAP_enforce_next_reforms$§! decision unlocks and eases this national spirit one step; the focus at the end of your chosen path lifts it for good. While Japan's §Yzombie companies§! remain unresolved, every campaign yields half as much. See §Y$JAP_corporate_reform_category$§! for the current figures."
 JAP_karoshi: "Karoshi"
 JAP_karoshi_desc: "The government names karoshi a national crisis: workers killed by overwork, by stroke and heart failure at the desk and by suicide after hundred-hour months. The death of the Dentsu employee Matsuri Takahashi forced it back onto the national agenda and cost the company's president his job. The state must now decide how far it will reach into the workplace to make work survivable."
 JAP_corporate_laws: "Reforming the Labour Standards Act"
 JAP_corporate_laws_desc: "The government takes the legislative road, closing the Article 36 loophole through the Work Style Reform Act and replacing saburoku agreements with hard ceilings enforced by a strengthened Labour Standards Inspectorate. Winning it means fighting employers and the flexible-hours lobby through every committee stage in the Diet. It is the most comprehensive of the three answers and the slowest to arrive."
 JAP_cultural_change: "Confronting the Culture of Overwork"
 JAP_cultural_change_desc: "政府は法律ではなく文化に訴えるキャンペーンを展開している。月に一度の「プレミアムフライデー」で従業員を早めに帰宅させ、メンタルヘルスのスクリーニングを職場に導入し、毎年発表される過労死白書は、雇用主と採用担当者の双方に過労死の存在を周知させている。しかし、勤勉な従業員は課長が退職するまで休まないという暗黙のルールには、こうした取り組みは一切触れていない。この道は、日本の労働に対する考え方を、職場や家庭といった下から変えていくという賭けである。"
 JAP_keiretsu_pact: "Bargaining with the Keiretsu"
 JAP_keiretsu_pact_desc: "The state negotiates directly with the enterprise groups and the Keidanren employers' federation: managed reform in exchange for stability, lifetime employment preserved, and the indebted firms sheltered from disruption. No legislation is passed and no company is named and shamed, because concession is traded for predictability. It is the slowest road to reform and the one that leaves corporate Japan least changed."
 JAP_overtime_cap: "The Article 36 Ceiling"
 JAP_overtime_cap_desc: "A saburoku agreement filed with the labour office turns the statutory forty-hour week into a suggestion, and the Work Style Reform Act closes the hole. Forty-five hours of overtime a month and three hundred and sixty a year become a legal ceiling, never beyond a hundred in a single month, with criminal penalties behind the numbers rather than administrative guidance. The figures track the karoshi line the Ministry of Health, Labour and Welfare uses when deciding whether a stroke or a suicide was caused by the job."
 JAP_mandatory_paid_leave: "Five Days a Worker Must Take"
 JAP_mandatory_paid_leave_desc: "The obligation is inverted: an employer granting ten or more days of leave must now ensure at least five of them are actually consumed, designating the dates itself if the worker will not. Japanese workers do not lack holiday so much as permission to use it, and barely half of granted leave is ever taken. The same amendment borrows the European work interval, eleven hours of rest between shifts, though only as a duty to make an effort."
 JAP_labour_inspection_offices: "The Labour Standards Inspectorate"
 JAP_labour_inspection_offices_desc: "The government funds the Labour Standards Inspectorate to enforce rather than advise: more inspectors, forensic accounting to catch the falsified time cards that turn a hundred hours of overtime into twenty on paper, and the willingness to prosecute. A few thousand inspectors cannot police sixty million workers, so most violations surface only after someone has died and the family has hired a lawyer. The ministry already publishes the names of the firms that break the law, and Dentsu itself was convicted after Matsuri Takahashi's death."
 JAP_karoshi_prevention_act: "The Karoshi Prevention Act"
 JAP_karoshi_prevention_act_desc: "The Diet passes the Act on Promotion of Preventive Measures against Karoshi, obliging the state to research overwork deaths, publish an annual White Paper, and hold itself to targets it can be measured against: fewer than five percent of workers on sixty-hour weeks, seventy percent of paid leave actually taken, mental health provision at every firm. Making the numbers public is the point, because they can then be missed in public. The same package carries a high-level professional exemption lifting hour rules from the best-paid specialists, a carve-out the unions expect to be widened."
 JAP_end_of_karoshi: "A Country Where Work Does Not Kill"
 JAP_end_of_karoshi_desc: "The ceiling on overtime holds because inspectors turn up unannounced and prosecutors follow them, leave is taken because the law requires it, and the contract worker beside you is paid what you are paid. The firms that could only survive on unpaid hours have been wound up rather than propped on evergreened credit, so nobody is left pleading that survival leaves them no choice. Japan will still work hard, but it has stopped treating exhaustion as evidence of loyalty.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved, §Y$JAP_karoshi_crisis$§! already eased to its final stage, and §YWorker Wellbeing§! of at least §G85§!. Completing this focus lifts the Karoshi crisis for good."
 JAP_karoshi_wellbeing_up_tt: "Raises §YWorker Wellbeing§! by $RIGHT|+=0$, easing the Karoshi crisis"
 JAP_premium_friday: "Premium Friday"
 JAP_premium_friday_desc: "The Ministry of Economy, Trade and Industry launches Premium Friday with the Keidanren: on the last Friday of every month, employees leave at three and spend the evening in the shops rather than at their desks. The timing is unfortunate, since month-end is when the accounts close and the quotas settle, and few firms comply with any enthusiasm. What survives is the precedent of the state naming an hour and telling the country to stop working."
 JAP_ikumen_project: "The Ikumen Project"
 JAP_ikumen_project_desc: "The Ministry of Health, Labour and Welfare runs the ikumen campaign to make a child-raising father something to admire rather than explain. Japanese paternity leave is among the most generous in the world on paper, a year of it partially paid, and almost nobody claims it, because a man who files is a man whose colleagues carry his work and whose section chief remembers. The revised law offers four weeks in the eight after a birth, splittable and merely notified, a threshold low enough that a hesitant father might actually take it."
 JAP_stress_check_programme: "The Stress Check"
 JAP_stress_check_programme_desc: "The amended Industrial Safety and Health Act requires every workplace of fifty or more employees to offer an annual psychological self-assessment, the first time the state has obliged Japanese firms to ask their staff how they are. A worker who scores badly may request an interview with a physician and an adjustment to their duties, but the results belong to the employee and a manager sees nothing without consent. That protects the individual and blunts the instrument, and firms under fifty employees are only asked to make an effort."
 JAP_telework_normalization: "Working From Anywhere"
 JAP_telework_normalization_desc: "The government appoints its first Minister for Digital Transformation and opens the Digital Agency, stripping the hanko seal requirement out of the overwhelming majority of administrative procedures. Telework was a rounding error not because the technology was missing but because contracts needed the carved seal and forms still arrived by fax, so somebody had to be in the building holding the stamp. Whether any of it outlasts the emergency is the open question, because firms called their staff back to desks they had proved they did not need."
 JAP_ending_service_zangyo: "The End of Service Overtime"
 JAP_ending_service_zangyo_desc: "Sabisu zangyo is the hour worked and never recorded, given away free because the working day was measured by self-declaration and the employee knew what the section chief expected that number to say. The reform attacks the arithmetic rather than the culture: employers must establish hours by objective means, card readers or login times, and the gap between the two records is evidence. The ministry publishes what it recovers each year, tens of billions of yen in unpaid wages, and every one of those firms was caught rather than unusual."
 JAP_ending_compulsory_nomikai: "The Optional Nomikai"
 JAP_ending_compulsory_nomikai_desc: "The nomikai is voluntary in the sense that the invitation is phrased as a question, and the junior who declines twice has said something about themselves that no performance review will record. The Power Harassment Prevention Act reaches it from the side, defining workplace power harassment in Japanese statute for the first time and obliging every company to run a complaints procedure and protect the complainant. A generation of younger workers had already stopped going, and the law caught up with them."
 JAP_work_to_live: "Working to Live"
 JAP_work_to_live_desc: "Hours are recorded by the machine and match what happened, leave is taken because taking it costs nothing, and fathers file for the weeks after a birth and return to the same desk and the same prospects. None of it was won by statute alone, because it was never really about statute: it was about what a workplace expects when nobody is enforcing anything. Japan still works hard, and it has stopped confusing that with working itself to death.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved, §Y$JAP_karoshi_crisis$§! already eased to its final stage, and §YWorker Wellbeing§! of at least §G85§!. Completing this focus lifts the Karoshi crisis for good."
 JAP_corporate_reform_category: "Corporate Japan Reform"
 JAP_corporate_reform_category_desc: "Japan's corporate sector carries two linked diseases. Banks keep unprofitable, over-indebted firms alive on rolled-over credit, locking up the capital and workers that healthier industries need. Those same firms buy loyalty with unpaid overtime, and the result is karoshi, death from overwork. Neither can be fully cured while the other persists.\n\n§YZombie Companies§!\n§YCorporate Restructuring Progress§!: [?JAP_corporate_restructuring_progress|0] / 100\nRestructuring crawls at §R+0.25 per month§! until the investigation closes and a resolution is chosen. §Y$JAP_controlled_downsize$§! then winds the firms up quickly, §Y$JAP_forced_mergers$§! absorbs them at half that pace, and the quality of the report scales both. The bank focuses and the recovery programmes below add one-off amounts.\n§RProgress stalls at 84§! until a resolution is chosen.\n§GThresholds§!\n§G30§! and §G60§!: the §Y$JAP_restructure_next_tranche$§! decision below unlocks, and each use eases §Y$JAP_zombie_companies$§! one step.\n§G85§!: the focus at the end of your chosen path removes it for good, either §Y$JAP_the_lost_decade_ends$§! or §Y$JAP_consolidated_japan_inc$§!, though the latter leaves a permanent mark behind it.\n§RWarning§!: a §Y$JAP_keiretsu_pact$§! slows the monthly accrual.\n\n§YThe Karoshi Crisis§!\n§YWorker Wellbeing§!: [?JAP_karoshi_wellbeing|0] / 100\nThe reform focuses on your chosen path add Worker Wellbeing directly, and the workplace campaigns below top it up for as long as you keep paying for them.\n§GThresholds§!\n§G30§! and §G60§!: the §Y$JAP_enforce_next_reforms$§! decision below unlocks, and each use eases §Y$JAP_karoshi_crisis$§! one step.\n§G85§!: the focus at the end of your chosen path removes it for good, either §Y$JAP_end_of_karoshi$§!, §Y$JAP_work_to_live$§! or §Y$JAP_the_bargain_kept$§!. Each of them also requires the crisis to have been eased to its final stage first.\n§RWarning§!: every campaign yields §R4§! instead of §G8§! while §Y$JAP_zombie_companies$§! is still in place, and the path focuses themselves cannot carry you to §G85§! alone.\n\n§GHint§!: §Y$JAP_a_society_where_women_thrive$§! halves what the §Y$JAP_cultural_change$§! campaigns cost the treasury."
 JAP_premium_friday_campaign: "Promote Premium Friday"
 JAP_premium_friday_campaign_desc: "Fund another round of the ministry's publicity push and the retail discounts that go with it, and lean on the employers' federation to get its members to close early. The firms that shut the lights off at three will be photographed doing it."
 JAP_ikumen_campaign: "Run the Ikumen Campaign"
 JAP_ikumen_campaign_desc: "Put fathers on childcare leave on posters, in ministry advertising and on television, and publish the take-up rate company by company so that a low number becomes a recruiting problem. The aim is to make filing for leave unremarkable rather than brave."
 JAP_mental_health_campaign: "Workplace Mental Health Drive"
 JAP_mental_health_campaign_desc: "Extend the annual stress check below the fifty-employee threshold, subsidise occupational physicians for firms too small to retain one, and staff the counselling lines properly. Screening only helps if there is somebody at the other end of it."
 JAP_no_overtime_day_campaign: "Declare a No Overtime Day"
 JAP_no_overtime_day_campaign_desc: "Name a weekday, switch the office lights off at the appointed hour and send the section chiefs home first, because nobody junior leaves before their superior does. Crude, visible, and the only version of the instruction that has ever worked."
 JAP_karoshi_resolved: "Japan's Karoshi crisis has been fully resolved"
 JAP_keidanren_charter: "The Charter for Work-Life Balance"
 JAP_keidanren_charter_desc: "The government, the Keidanren, and Rengo sign the Charter for Work-Life Balance and put numbers to it: halve the workers on sixty-hour weeks, take every day of granted paid leave, drag male childcare leave out of the low single figures. The document carries no legal force and no penalties, only an annual public review on a council where business sits as an equal. Japanese working hours have never fallen through prosecution, but they do fall when firms must explain the figures to each other."
 JAP_shunto_offensive: "The Spring Offensive"
 JAP_shunto_offensive_desc: "The cabinet joins the shunto spring wage offensive directly, pressing the Keidanren to raise base pay rather than bonuses and backing the demand with tax credits for the firms that comply. Critics call it kanmin shunto, government-managed bargaining, and argue that a wage round run out of the Prime Minister's office is not collective negotiation at all. Until base pay rises the salaryman keeps working the overtime that pays his mortgage, whatever the ceiling says."
 JAP_health_management_stocks: "Health and Productivity Management"
 JAP_health_management_stocks_desc: "The ministry and the Tokyo Stock Exchange begin naming Health and Productivity Management Stocks, telling investors that staff health is capital expenditure rather than welfare. The certification behind it, the White 500, is the deliberate opposite of the black company blacklist and rests on the finding that exhausted workers produce less and cost more than rested ones. Firms submit their own figures on hours and health to earn the badge, and those that cannot answer for it to shareholders and recruits alike."
 JAP_morning_shift_system: "The Morning Shift"
 JAP_morning_shift_system_desc: "Itochu, a sogo shosha at the centre of the old keiretsu, bans work after ten at night and pays early-morning hours at a premium instead. The reasoning is commercial rather than humane: a trader at his desk since nine the previous morning misprices, and the evening hours are the least productive of the day. Evening overtime collapsed, total hours fell, profit held and the firm's birth rate rose, which embarrassed every rival that had called shorter hours unaffordable."
 JAP_job_based_employment: "Hired to a Job, Not a Company"
 JAP_job_based_employment_desc: "Japanese employment is membership-based: a worker is hired into the company rather than into a job, rotated at the firm's discretion with no defined duties, which is where the unbounded working day begins. Hitachi, Fujitsu, KDDI, and Shiseido now publish actual job descriptions with pay graded to the role, and the Keidanren has conceded that lifetime employment cannot be sustained. The state funds a trillion yen of retraining so the shift reads as opportunity rather than betrayal."
 JAP_the_bargain_kept: "The Bargain Kept"
 JAP_the_bargain_kept_desc: "The hours come down because the enterprise groups work out that they cost more than they earn, and having worked it out they move faster than any committee of the Diet could have made them. The cross-shareholdings stay intact, the main banks stay at the centre of their groups, and the productivity released by shorter days flows into the laboratories rather than into wage claims. The state carries what the bargain does not: the health insurance bill for the workers already broken, and the forbearance that keeps insolvent firms breathing.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved, §Y$JAP_karoshi_crisis$§! already eased to its final stage, and §YWorker Wellbeing§! of at least §G85§!. Completing this focus lifts the Karoshi crisis for good."
 JAP_demand_recovery_progress_tt: "§YDemand Recovery Progress§!: $RIGHT|+=0$"
 JAP_corporate_restructuring_progress_tt: "§YCorporate Restructuring Progress§!: $RIGHT|+=0$"
 Japan_economy.32.t: "A District Court Halts the Restart"
 Japan_economy.32.d: "A district court has issued an injunction blocking the restart of a nuclear reactor, citing unresolved doubts about seismic safety and evacuation planning near the plant. The ruling is not final, but it freezes the reactor's return to operation while the case moves through appeal. Local residents and anti-nuclear groups have seized on the decision, while utilities warn of the cost of continued idle capacity."
 Japan_economy.32.a: "Fight it through the appeals courts."
 Japan_economy.32.b: "Deepen local safety guarantees."
 JAP_zombie_firms_investigation: "Investigate the Zombie Firms"
 JAP_zombie_firms_investigation_desc: "Banks have rolled over loans to insolvent borrowers and the cross-shareholdings have let managers hide behind one another. Auditors now enter the ledgers, name the firms surviving only on evergreened credit, and force the numbers into the open."
 JAP_zombie_firms_investigation_TT: "Opens the investigation. Case files are built through §Y$JAP_zombie_investigation_category$§!, and the firms will fight back."
 JAP_zombie_investigation_idea: "Zombie Firm Investigation"
 JAP_zombie_investigation_idea_desc: "Auditors are combing through the books of insolvent firms. The uncertainty rattles boardrooms and slows the offices while the probe runs its course."
 Japan_economy.06.b: "Let the banks self-report"
 Japan_economy.07.b: "Contain the fallout"
 JAP_zombie_investigation_western_pop_TT: "Publicizing the forbearance discredits the pro-Western reformist bloc: §RLiberal party popularity falls§!"
 JAP_controlled_downsize: "Controlled Downsize"
 JAP_controlled_downsize_desc: "The Financial Revitalization Program applies stricter asset assessment and discounted cash flow provisioning, forcing public capital into the balance sheets that cannot stand alone. Insolvent firms are wound down and factories closed, releasing the workers locked inside the walking dead back to the living."
 JAP_complete_downsizing: "Complete Downsizing of the Economy"
 JAP_complete_downsizing_desc: "The liquidation is finished. Credit now flows to firms that can repay it, land trades at prices that reflect its use, and management no longer measures success by headcount. This is the economy the reformers promised: smaller on paper, far stronger in the ledger."
 JAP_venture_capital_funds: "Venture Capital Funds"
 JAP_venture_capital_funds_desc: "The Innovation Network Corporation of Japan puts state capital behind private startups, matching venture risk with public backing. Japanese households hold enormous savings that almost never reach a founder, and this is how that capital is made to move."
 JAP_infrastructure_investments: "Infrastructure Investments"
 JAP_infrastructure_investments_desc: "The Fundamental Plan for National Resilience commits the Ministry of Land, Infrastructure, Transport and Tourism to renewing the bridges, tunnels, and seawalls built during the high-growth decades, most of them now past fifty years of service. Public works are the arteries of an industrial nation when they are done properly."
 JAP_growth_tax_reform: "Tax Changes to Promote Growth"
 JAP_growth_tax_reform_desc: "Japan long carried one of the heaviest corporate burdens in the developed world. Successive reforms cut the effective rate from roughly thirty-seven percent toward the twenties, broadening the base while lowering the rate and rewarding firms that raise wages and invest at home. A company that keeps its profits working is worth more to the Treasury than one that hoards them."
 JAP_startup_education_programs: "Education Programs for New Companies"
 JAP_startup_education_programs_desc: "The EDGE and EDGE-NEXT programs put entrepreneurship training inside the national universities, and the technology licensing offices turn laboratory patents into companies. A graduate of Todai or Tokyo Tech should see founding a firm as a career, not a disgrace to be explained to one's parents."
 JAP_retirement_reform: "Retirement Reform"
 JAP_retirement_reform_desc: "The revised Act on Stabilization of Employment of Elderly Persons asks employers to secure work opportunities up to the age of seventy. Seniors are healthy, skilled, and willing, and keeping them in the workforce eases the pension burden while returning decades of accumulated craft to the factory floor."
 JAP_forced_mergers: "Fusion"
 JAP_forced_mergers_desc: "Rather than let the weak firms fail, the ministry marries them to the strong: it draws the lines, the banks provide the capital, and nobody has to admit failure. The zombies disappear from the register, and the unhappy engineers, the duplicated factories, and the despised new masters all remain."
 JAP_megabank_consolidation: "Megabank Consolidation"
 JAP_megabank_consolidation_desc: "Japan drives its ailing city banks together into three megabanks: Mizuho, Sumitomo Mitsui, and Mitsubishi UFJ. The mergers bury a decade of bad loans inside balance sheets too large to question, and produce lenders no government could afford to let fail."
 JAP_industrial_revitalization_corp: "Industrial Revitalization Corporation"
 JAP_industrial_revitalization_corp_desc: "The Industrial Revitalization Corporation of Japan buys distressed debt and takes struggling firms in hand, Daiei and Kanebo among the forty-one it restructures. A state turnaround vehicle can dictate terms, rearrange debts, and quietly dilute shareholders in ways no private creditor would dare attempt."
 JAP_national_champion_mergers: "National Champion Mergers"
 JAP_national_champion_mergers_desc: "METI merges the losing divisions of rival firms and calls the sum a champion: Renesas from the chip arms of NEC, Hitachi, and Mitsubishi, Japan Display from the panel businesses of Sony, Toshiba, and Hitachi. Whether three struggling units add up to one healthy company is left carefully unstated."
 JAP_keiretsu_cross_shareholding: "Keiretsu Cross-Shareholding"
 JAP_keiretsu_cross_shareholding_desc: "Mochiai, the web of allied shareholdings, is the quiet architecture of corporate Japan, and every reform to date has tried to unwind it. The government tightens the knots instead, insulating the conglomerates from activist investors and hostile bids. The jobs stay safe, and so does every mediocre executive."
 JAP_employment_preservation_pact: "Employment Preservation Pact"
 JAP_employment_preservation_pact_desc: "Shushin koyo, lifetime employment, was never law but a bargain between firm, union, and state, sustained by adjustment subsidies. The government writes it down: no worker loses a job to a merger. The nation buys social peace and pays for it with factories that can never close."
 JAP_consolidated_japan_inc: "Consolidated Japan Inc."
 JAP_consolidated_japan_inc_desc: "The last of the weak firms is signed into a merger and the register is closed. The champions are enormous, the ministry can draw the industrial map on a single sheet, and foreign rivals treat it with the wary respect due to any giant. Inside, the duplicated plants still run and the unhappy engineers still file out at six.\n-------------\nThis focus §Gremoves§! §Y$JAP_zombie_companies$§! and the §Y$JAP_fusion_restructuring$§! that came with the mergers, and leaves §Y$JAP_consolidated_conglomerates$§! behind permanently."
 JAP_venture_capital_funds_decision: "Capitalize the Innovation Fund"
 JAP_venture_capital_funds_decision_desc: "Put public money into the funds alongside private managers, on the condition that the managers pick the winners. Underwrites a year of concentrated research effort across the new firms."
 JAP_infrastructure_investments_decision: "Launch the Chubu Renewal Works"
 JAP_infrastructure_investments_decision_desc: "Commit civilian construction capacity to renewing the roads, bridges, and utilities of the Chubu industrial belt. The works tie up factories while they run and leave the region's infrastructure substantially improved."
 JAP_growth_tax_reform_decision: "Cut the Corporate Rate"
 JAP_growth_tax_reform_decision_desc: "Push the effective corporate rate down for a year and let firms keep more of what they earn. Consumer prices ease as companies pass part of the relief through to households."
 JAP_startup_education_programs_decision: "Fund the University Startup Track"
 JAP_startup_education_programs_decision_desc: "Endow entrepreneurship faculties and technology licensing offices at the national universities, turning laboratory work into companies and accelerating our industrial research."
 JAP_retirement_reform_decision: "Extend the Employment Guarantee to Seventy"
 JAP_retirement_reform_decision_desc: "Subsidize employers who keep skilled workers past the traditional retirement age. Decades of accumulated craft stay on the factory floor for another year."
 JAP_rail_modernization: "Rail Modernization"
 JAP_rail_modernization_desc: "The Tokaido Shinkansen anchors the densest rail network on earth, and the rolling stock, signalling, and stations behind it are renewed line by line. The railways remain the backbone of an industrial economy that cannot afford them to fail."
 JAP_shinkansen_network_expansion: "Shinkansen Network Expansion"
 JAP_shinkansen_network_expansion_desc: "Under the Nationwide Shinkansen Railway Development Act, successive governments have pushed the high-speed trunk lines outward from the Tokaido core toward Hokuriku, Kyushu, and Hokkaido. Accelerating these projects will knit distant prefectures into the national economy and shorten supply lines across the home islands."
 JAP_chuo_shinkansen_maglev: "Chuo Shinkansen Maglev"
 JAP_chuo_shinkansen_maglev_desc: "The Chuo Shinkansen is JR Central's superconducting maglev line between Tokyo, Nagoya, and Osaka, its L0 series holding the world rail speed record at 603 km/h. State commitment carries the prototyping and the deep tunnelling of the fastest commercial railway ever attempted."
 JAP_freight_modal_shift: "Freight Modal Shift"
 JAP_freight_modal_shift_desc: "Japan Freight Railway is spearheading a modal shift of cargo from long-haul trucks onto rail, promoted through the Eco Rail Mark and standardized thirty-one foot containers. Moving more freight by rail cuts emissions, eases the driver shortage, and strengthens the industrial supply chain."
 JAP_station_city_model: "Station City Model"
 JAP_station_city_model_desc: "JR East has turned major terminals into commercial cities in their own right, developing the retail concourses known as ekinaka and the towers around Shinagawa, Shibuya, and Tokyo Station. Concentrating offices and retail on transit hubs raises land value and productivity in the urban core."
 JAP_regional_line_preservation: "Regional Line Preservation"
 JAP_regional_line_preservation_desc: "As rural depopulation drains ridership, JR West and the third-sector railways struggle to keep local lines open. Rather than abandon the countryside, we will subsidize community rail, preserving supply access and mobility for regions the trunk lines bypass."
 JAP_port_rail_intermodal: "Port and Rail Intermodal"
 JAP_port_rail_intermodal_desc: "The International Strategic Hub Port policy concentrates container traffic on the Keihin and Hanshin port clusters. Extending on-dock rail sidings and inland terminals ties the harbors directly into the freight network, moving containers from ship to train without idle trucking."
 JAP_green_logistics_network: "Green Logistics Network"
 JAP_green_logistics_network_desc: "A green logistics network of electrified rail, battery and hydrogen locomotives, and consolidated distribution centres decarbonises the movement of goods across the country in pursuit of carbon neutrality."
 JAP_rail_technology_exports: "Rail Technology Exports"
 JAP_rail_technology_exports_desc: "Japanese high-speed rail is a flagship export. E5-derived trainsets underpin the Mumbai-Ahmedabad line in India, the 700T serves Taiwan High Speed Rail, and JICA financing packages Shinkansen technology worldwide. Winning these contracts spreads our standards and our influence."
 JAP_global_rail_superpower: "Global Rail Superpower"
 JAP_global_rail_superpower_desc: "With the Chuo Shinkansen driven through to Osaka and our exports circling the globe, Japan stands as the undisputed leader in high-speed rail. The maglev age begins at home and radiates outward, a lasting symbol of Japanese engineering."
 JAP_chuo_shinkansen_program: "Chuo Shinkansen Program"
 JAP_chuo_shinkansen_program_desc: "A dedicated national effort to prototype the superconducting maglev, accelerating our maglev special project."
 JAP_high_speed_line: "High-Speed Line"
 JAP_high_speed_line_desc: "A new Shinkansen corridor raises regional productivity, speeds local construction, and widens supply throughput."
 JAP_rail_category: "Rail Sector"
 JAP_hokuriku_shinkansen_extension: "Hokuriku Shinkansen: Kanazawa to Tsuruga"
 JAP_hokuriku_shinkansen_extension_desc: "Extend the Hokuriku Shinkansen from Kanazawa to Tsuruga, the section opened in 2024, linking the Sea of Japan coast into the national high-speed network."
 JAP_nishi_kyushu_shinkansen: "Nishi Kyushu Shinkansen"
 JAP_nishi_kyushu_shinkansen_desc: "Open the Nishi Kyushu route to Nagasaki, in service since 2022, bringing western Kyushu onto the Shinkansen grid."
 JAP_sanyo_shinkansen_upgrade: "Sanyo Shinkansen Upgrade"
 JAP_sanyo_shinkansen_upgrade_desc: "Deploy N700S rolling stock and modernize the Osaka to Hakata trunk for higher speeds and greater reliability."
 JAP_tohoku_shinkansen_upgrade: "Tohoku Shinkansen 320 km/h"
 JAP_tohoku_shinkansen_upgrade_desc: "Run E5 series trains at 320 km/h on the Tohoku trunk, cutting journey times from Tokyo toward Aomori."
 JAP_hokkaido_shinkansen_sapporo: "Hokkaido Shinkansen: Sapporo Extension"
 JAP_hokkaido_shinkansen_sapporo_desc: "Bore the tunnels and raise the viaducts to carry the Shinkansen from Shin-Hakodate-Hokuto through to Sapporo."
 JAP_shikoku_shinkansen: "Shikoku Shinkansen"
 JAP_shikoku_shinkansen_desc: "Realize the long-planned basic-plan line, bringing high-speed rail to the island of Shikoku for the first time."
 JAP_plutonium_stockpile_concern: "Separated Plutonium Stockpile"
 JAP_galapagos_syndrome: "Galapagos Syndrome"
 JAP_galapagos_syndrome_desc: "Japan built a complete technological world inside its own borders and then found it could not export any of it. Its mobile networks ran on PDC while the rest of the planet standardized on GSM, so no domestic handset could be sold abroad and no foreign handset could be sold here. Browsing arrived through i-mode and payment through FeliCa, each of them years ahead of anything overseas and each of them incompatible with everything overseas. Domestic certification, JIS specification and keiretsu procurement did the rest, filling the home market with products engineered for a customer who exists nowhere else. A hundred and twenty million consumers are enough to sustain an industry and just barely too few to force it outward.\n-------------\nThis national spirit does not de-escalate on its own. §RResearch speed§! drifts steadily downward while Japan stays closed, slowed but never reversed by temporary measures. Only the §YIntegration with the World§! path, carried to §G85§! §YOpenness§!, removes it. See §Y$JAP_technological_isolation_category$§! for the current figures."
 JAP_galapagos_modifier: "Galapagos Drift"
 JAP_galapagos_modifier_desc: "The running account of how far Japan has drifted from the world it trades with. Research slips a little further each month that the country keeps to its own standards, and the further it is from the standards its customers use, the faster it slips. Temporary measures slow the slide. Only genuine integration stops it."
 JAP_galapagos_resolved: "Japan has broken out of its Galapagos isolation"
 JAP_galapagos_syndrome_focus: "The Galapagos Question"
 JAP_galapagos_syndrome_focus_desc: "Japan's domestic market is profitable and shrinking, protected by standards that lock the country out of everywhere else. The ministry debates whether the answer is convergence, rewriting the standards to match the world, or commercialisation, selling the difference itself. Partial measures slow the research drift, but none of them addresses the choice underneath."
 JAP_galapagos_openness_up_tt: "Raises §YOpenness§! by $RIGHT|+=0$, connecting Japan to standards and markets beyond its own"
 JAP_galapagos_openness_down_tt: "Lowers §YOpenness§! by $RIGHT|+=0$, turning Japan further inward from foreign standards and markets"
 JAP_technological_isolation_category: "Galapagos and the Electronics War"
 JAP_technological_isolation_category_desc: "Japanese industry perfected products for Japan alone: superb handsets, standards and services that nobody outside the home market could use, while the rest of the world standardised around someone else. That same insularity now leaves Japan's semiconductor sector exposed as China climbs the technology ladder.\n\n§YGalapagos Syndrome§!\n§YOpenness§!: [?JAP_galapagos_openness|0] / 100\n§Y$JAP_galapagos_drift_review_mission$§! reports the drift every thirty days and shows the exact figure before it is applied. The lower Openness sits the faster research falls behind, down to nothing at all at §G100§! and never worse than §R-15%§!.\n§GRaising Openness§!: the integration focuses carry most of it and the electronics focuses add the rest. The two campaigns below add a little more, but they only slow the drift. They cannot cure the syndrome.\n§GRemoval§!: only the §Y$JAP_world_integration$§! path removes §Y$JAP_galapagos_syndrome$§!, and only once Openness passes §G85§!. The §Y$JAP_cool_japan_doctrine$§! path keeps the spirit on purpose and turns Japan's cultural reach into influence instead.\n\n§YThe Model Competition§!\n§YElectronics Resilience§!: [?JAP_electronics_resilience|0]\nChina's pressure starts at §R1§! and rises by §R+1§! for each semiconductor milestone it reaches, and by another §R+1§! for as long as Openness sits below §R25§!, to a maximum of §R3§!. Pressure minus Resilience decides which tier of §Y$JAP_model_competition$§! Japan suffers. Beat the pressure outright and the spirit disappears; let China pull ahead unanswered and it returns.\n§GRaising Resilience§!: the semiconductor focuses grant it, and the export offensive below adds more until Resilience reaches §G4§!.\n§RWarning§!: that offensive needs Openness above §G10§!, unless §Y$JAP_cool_japan_doctrine$§! has been adopted and Japan has chosen to sell its difference rather than hide it."
 JAP_international_standards_adjustment: "International Standards Adjustment"
 JAP_international_standards_adjustment_desc: "Japanese industry writes its own standards, PDC for mobile and ISDB for broadcasting, and every one of them locks the domestic market away from the GSM and DVB world outside. The government sends engineers into the ISO and IEC working groups, which cannot undo the divergence overnight but puts Japanese names on the drafts every other country will read in a decade. The price is paid at home, in conformance testing rewritten each time a clause is conceded."
 JAP_english_business_environment: "English Business Environment"
 JAP_english_business_environment_desc: "Japanese managers cannot staff their own overseas subsidiaries in the language the contracts are written in. The government backs corporate English programmes and the Rakuten experiment that made English the working language of a Japanese firm and was mocked until the results arrived. It costs years of lost productivity while section chiefs learn to chair a meeting in a second language, and some of them never will."
 JAP_international_standards_adjustment_campaign: "Fund the Standards Delegations"
 JAP_international_standards_adjustment_campaign_desc: "Pay for another rotation of engineers into the ISO, IEC and ITU working groups, and cover the domestic conformance testing that follows every clause Japan concedes. The delegations come home with the drafts and industry gets a year to adjust before the next revision. Stop funding them and the seats go to somebody else."
 JAP_english_business_environment_campaign: "Subsidize Corporate English Programmes"
 JAP_english_business_environment_campaign_desc: "Underwrite the language training the member firms have been unwilling to pay for themselves: in-house instructors, TOEIC sittings on company time, and secondments to the overseas offices for everyone who passes. Output dips while people study. The firms that stay with it stop needing a translator in the room."
 JAP_cool_japan_doctrine: "The Cool Japan Doctrine"
 JAP_mitsubishi_aerospace_aircraft_manufacturer_header_wings_pilot_readiness: "Wings & Pilot Readiness"
 JAP_mitsubishi_aerospace_aircraft_manufacturer_header_air_defense_shield: "Air Defense Shield"
 JAP_kawasaki_aerospace_company_aircraft_manufacturer_header_rotary_wing_aircraft: "Rotary-Wing Aircraft"
 JAP_kawasaki_aerospace_company_aircraft_manufacturer_header_heavy_fixed_wing: "Heavy Fixed Wing"
 JAP_jsw_tank_manufacturer_header_mbt_mastery: "MBT Mastery"
 JAP_jsw_tank_manufacturer_header_self_propelled_excellence: "Self-Propelled Excellence"
 JAP_mitsubishi_heavy_industries_tank_manufacturer_header_battle_recon_power: "Battle & Recon Power"
 JAP_mitsubishi_heavy_industries_tank_manufacturer_header_artillery_anti_air_systems: "Artillery & Anti-Air Systems"
 JAP_komatsu_tank_manufacturer_header_light_vehicle_systems: "Light Vehicle Systems"
 JAP_komatsu_tank_manufacturer_header_heavy_vehicle_systems: "Heavy Vehicle Systems"
 JAP_subaru_tank_manufacturer_header_light_utility_performance: "Light Utility Performance"
 JAP_subaru_tank_manufacturer_header_systems_resilience: "Systems Resilience"
 JAP_howa_machinery_materiel_manufacturer_header_service_rifle_evolution: "Service Rifle Evolution"
 JAP_howa_machinery_materiel_manufacturer_header_support_weapons_accessories: "Support Weapons & Accessories"
 JAP_nec_materiel_manufacturer_header_light_wings: "Light Wings"
 JAP_nec_materiel_manufacturer_header_air_defense_shield: "Air Defense Shield"
 JAP_toshiba_materiel_manufacturer_header_rail_systems: "Rail Systems"
 JAP_toshiba_materiel_manufacturer_header_air_defense_systems: "Air Defense Systems"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_patrol_convoy_vessels: "Patrol & Convoy Vessels"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_frigates_destroyers: "Frigates & Destroyers"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_submarines: "Submarines"
 JAP_kawasaki_shipbuilding_naval_manufacturer_header_submarine_excellence: "Submarine Excellence"
 JAP_kawasaki_shipbuilding_naval_manufacturer_header_container_vessel_efficiency: "Container Vessel Efficiency"
 JAP_ihi_corporation_naval_manufacturer_header_flagship_core_systems: "Flagship Core Systems"
 JAP_ihi_corporation_naval_manufacturer_header_projecting_presence: "Projecting Presence"
 JAP_jmu_corporation_naval_manufacturer_header_escort_combatants: "Escort Combatants"
 JAP_jmu_corporation_naval_manufacturer_header_flight_ops_sea_control: "Flight Ops & Sea Control"
 JAP_jmu_corporation_naval_manufacturer_header_carrier_aviation: "Carrier Aviation"
 senbu_occupation_law_fake_idea: "Senbu Pacification Administration"
 senbu_occupation_law_fake_idea_desc: "Civil affairs officers run the occupied districts through local notables rather than garrison commanders, restoring markets, schools and rice distribution before demanding output. Compliance grows steadily and the garrison requirement stays low, but the light hand leaves organised resistance more room than a punitive regime would."
 JAP_sabotaged_russians: "Sabotaged Russian Facilities"
 JAP_usa_trade_pressure: "American Trade Pressure"
 JAP_article_nine_balance_of_power_category: "Article Nine"
 JAP_article_nine_balance_of_power_category_desc: "The renunciation of war in Article Nine of the constitution is not a settled question but a running argument between the cabinet, the courts, the American alliance and the public. Every reinterpretation shifts the balance between a strictly defensive posture and a normal military."
 JAP_cool_japan_doctrine_desc: "Japanese design is not strange because it failed to match a foreign standard. It is strange because it was made for Japanese customers by people who never once considered the alternative, and that is precisely what makes it worth buying. The ministry stops packaging culture as a shopfront for hardware and begins exporting the difference itself.\n\n§RThis path keeps §Y$JAP_galapagos_syndrome$§! permanently.§! Only §Y$JAP_world_integration$§! removes it, and the two are mutually exclusive: Japan either converges on the world's standards or sells the world its own."
 JAP_galapagos_sphere_modifier: "Cultural Sphere"
 JAP_galapagos_sphere_modifier_desc: "The ministry keeps a quarterly count of the countries where Japanese influence stands at twenty percent or higher and treats the total as an export figure in its own right. Every country on the list widens the audience that already buys Japanese design without being asked to understand it first, which is worth something to the trade delegations and something more to the firms that follow them in. The count is taken once each quarter and the yield moves with it. A sphere that stops growing stops paying."
 JAP_galapagos_sphere_tt: "§YCultural Sphere§!: [?JAP_galapagos_sphere_count|Y0] countries carrying §G20%§! Japanese influence or more, counted each quarter once the §YCool Japan Doctrine§! is adopted. The yield rises by half with §Y$JAP_electronics_superpower$§! and by a further quarter with §Y$JAP_home_electronics$§!."
 JAP_cool_japan_sphere_payout_tt: "Every quarter the ministry counts the countries where Japanese §Yinfluence§! stands at §G20%§! or higher and reports the total as the §YCultural Sphere§!. Each one adds §G+1%§! §Yforeign influence§! and §G+0.2%§! §Yreturn on investment§!, paid out through the §YCultural Sphere§! and growing as the sphere widens. §Y$JAP_electronics_superpower$§! raises the yield by half again, and §Y$JAP_home_electronics$§! raises it by a further quarter.\n-------------\nThis does not touch the §YResearch Drift§!. The doctrine buys reach abroad; it does not close the standards gap at home."
 JAP_creative_industries_office: "Creative Industries Promotion Office"
 JAP_creative_industries_office_desc: "The Ministry of Economy, Trade and Industry stands up the Creative Industries Promotion Office to treat animation, design, fashion, and food as export sectors rather than as culture. The Cool Japan Fund follows with fifty billion yen and a mandate to co-invest rather than subsidise, buying into overseas retail floors, Asian streaming platforms, and distribution ventures no Japanese board would have approved alone. Officials make poor venture capitalists and the Fund posts years of losses, but it takes the first loss on the projects private capital then follows into."
 JAP_visit_japan_campaign: "Visit Japan Campaign"
 JAP_visit_japan_campaign_desc: "The Visit Japan Campaign is relaunched behind a target no ministry believes: forty million foreign visitors a year. The government loosens the visa regime for Asian travellers, exempts cosmetics and medicine from consumption tax at the till, and markets the country on the parts of it that do not translate. Nothing about Japan is made less Japanese to sell it."
 JAP_content_export_offensive: "Content Export Offensive"
 JAP_content_export_offensive_desc: "The Basic Law on Intellectual Property and the Content Promotion Law put animation, games, and manga into statute as strategic assets, and the industry still treats its overseas audience as piracy to be tolerated while fan translators do the distribution. The government builds the legal channel instead: simultaneous release, professional subtitling, and rights holders who negotiate as a bloc rather than one studio at a time. The overseas market is already the larger half of anime revenue, and almost none of it is being collected."
 JAP_washoku_to_the_world: "Washoku to the World"
 JAP_washoku_to_the_world_desc: "With washoku inscribed on the UNESCO Intangible Cultural Heritage list, the government promotes not a dish but a practice: the seasonal ingredient, the arrangement, the New Year table. The ministry's earlier instinct was to police it, and the scheme to certify authentic Japanese restaurants overseas was abandoned once the foreign press christened it the sushi police. Californian rolls and Bangkok ramen sell more Japanese rice, soy, and sake than any inspectorate ever could, and the trillion-yen export target rests on that trade."
 JAP_japan_house_network: "The Japan House Network"
 JAP_japan_house_network_desc: "The JET Programme has sent thousands of young foreigners through Japanese schools and town halls and returned them home fluent, and they now sit in foreign ministries, law firms, and newsrooms. Japan House gives that network a front door: a gallery, a library, a shop, and a restaurant on an expensive street in Sao Paulo, Los Angeles, and London, run by the Foreign Ministry and deliberately empty of flags and policy statements. Applications for Japanese language courses tripled in each city after it opened."
 JAP_gross_national_cool: "Gross National Cool"
 JAP_gross_national_cool_desc: "The Galapagos Syndrome stays: the specifications remain Japanese and the research drift goes on. What the ministries have built instead is a country that earns abroad through what only it can make, the studios, the kitchens, the game houses, the design offices, and the millions who come each year simply to look. The isolation was never cured, only put to work."
 JAP_cool_japan_spirit_kept_tt: "§YGalapagos Syndrome§! §Rremains in place§!. Japan has chosen to sell its difference rather than cure it"
 JAP_electronics_anchor_bonus_tt: "§YElectronics Superpower§!: Japanese hardware carries Japanese content into every market, and the return grows with it"
 JAP_world_integration: "Integration with the World"
 JAP_world_integration_desc: "Japan stops being an island. The standards are rewritten to somebody else's draft, the tariff schedules come down, the ministries stop asking whether a foreign bid is appropriate, and the capital that spent thirty years going around this country starts coming into it. What is surrendered is the protection itself, the captive market that made consumer goods cheap and the wall against foreign influence no rival ever climbed, and Japanese firms must now earn a market they used to own."
 JAP_structural_reform_zones: "Structural Reform Special Zones"
 JAP_structural_reform_zones_desc: "Rather than argue the regulatory code line by line against the ministries that wrote it, the government lets a prefecture or a town apply to be exempted from a rule and then prove that the sky does not fall. Farmers brew below the national minimum volume, joint stock companies run schools and lease farmland, and the National Strategic Special Zones point the same instrument at Tokyo for finance, Fukuoka for startup employment rules, and Kansai for medical trials. It is deregulation retail rather than wholesale, and it is the only method that has ever actually moved anything."
 JAP_corporate_governance_code: "The Corporate Governance Code"
 JAP_corporate_governance_code_desc: "The Ito Review puts a number on the failure: eight per cent return on equity is the minimum a Japanese company must clear to be worth the capital it consumes, and most of them are not clearing it. The Stewardship Code tells the pension funds and the insurers to vote their shares like owners rather than guests, and the Corporate Governance Code follows on comply-or-explain terms. Outside directors rise toward a third of the board and the cross-shareholdings begin to be sold, which does not make Japanese firms foreign so much as legible to anyone willing to buy a share."
 JAP_economic_partnership_agreements: "Economic Partnership Agreements"
 JAP_economic_partnership_agreements_desc: "Agriculture has held the veto over Japanese trade policy since the war, and exporters are now losing tenders to Korean firms on the tariff line alone. Japan closes the largest bilateral agreement either party has ever signed with the European Union, then takes the chair of the Trans-Pacific Partnership after Washington walks out, suspending the American clauses rather than deleting them. RCEP follows and places Japan, China, and South Korea inside a single trade framework for the first time, with the rice protected in every one of them."
 JAP_open_capital_markets: "Open the Capital Markets"
 JAP_open_capital_markets_desc: "Measured against the size of its economy, Japan carries less foreign capital than almost any developed country, held back by the cross-shareholdings, unreadable disclosure, and forty years of officials treating a foreign bid as a problem to be managed. The repairs are unglamorous and almost entirely administrative: Invest Japan desks at JETRO to walk a foreign firm through incorporation, results published in English on the day they appear in Japanese, and a points-based residence track for the people a foreign subsidiary must move here to open at all. The question of people in its full form belongs to §Y$JAP_an_open_nation$§!, and this is the narrower one of whether the capital can find the door."
 JAP_the_third_opening: "The Third Opening"
 JAP_the_third_opening_desc: "Japan abandons the last of the protections that made it an economy apart. The government opens the domestic market to foreign competition, rewrites its standards to international drafts, and lets foreign capital buy in on the same terms as Japanese capital. The captive market and the wall against outside influence are both surrendered for a country that trades as one signatory among many."
 JAP_galapagos_dissolution_tt: "The syndrome lifts. Japan §Rgives up§! the cheap consumer goods a captive market supplied and the high §Rdefence against foreign influence§! that isolation paid for, and §Gsheds§! the research drift, the investment penalties and the ceiling on its own influence abroad:"
 JAP_an_open_nation_bonus_tt: "§Y$JAP_an_open_nation$§!: a country that has already opened to the world's people has far less left to argue about when it opens to the world's capital"
 JAP_zombie_report_credible_tt: "The investigation produced at least a §Ypartial report§!"
 JAP_zombie_investigation_concluded_tt: "The investigation has §Yconcluded§!, whatever it found"
 JAP_zombie_case_files_up_1_tt: "§YCase Files§!: $RIGHT|+=1$"
 JAP_zombie_case_files_up_2_tt: "§YCase Files§!: $RIGHT|+=2$"
 JAP_zombie_case_files_down_1_tt: "§YCase Files§!: §R-1§!"
 JAP_zombie_case_files_down_2_tt: "§YCase Files§!: §R-2§!"
 JAP_zombie_obstruction_up_2_tt: "§YObstruction§!: §R+2§!"
 JAP_zombie_obstruction_up_5_tt: "§YObstruction§!: §R+5§!"
 JAP_zombie_obstruction_up_6_tt: "§YObstruction§!: §R+6§!"
