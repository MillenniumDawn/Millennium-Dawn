 BSH_util_vehicle_2_desc: "A logistics truck and troop carrier used by many militaries around the world."
 BSH_util_vehicle_3: "KamAZ-4310"
 BSH_util_vehicle_3_desc: "A logistics truck and troop carrier used by many militaries around the world."
 BSH_util_vehicle_4: "KamAZ-4350"
 BSH_util_vehicle_4_desc: "Much like the Volk this can carry 8 men but also carry HMGs on the top of them. Used to lead convoys."
 BSH_util_vehicle_5: "GAZ Tigr"
 BSH_util_vehicle_5_desc: "This armored troop carrier can be armed with an array of different weapons and carry up to 11 men."
 BSH_util_vehicle_6: "VPK-3927 Volk"
 BSH_util_vehicle_6_desc: "The VPK can carry 2+8 men. With STANAG 4569 Level 3 armor. Great for special forces and police forces."
 BSH_util_vehicle_7: "Z-STS Akhmat"
 BSH_util_vehicle_7_desc: "Z-STS Akhmat is made on the three-axle all-wheel drive chassis KAMAZ-5350. It has high characteristics of mobility and patency, and in addition, it does not differ in the complexity of operation. It is curious that an armored car, unlike a basic truck, is built according to the hood scheme. This made it possible to shift the crew's places back and increase their safety."
 CRM_Anti_Air_0: "9K32 Strela-2"
 CRM_Anti_Air_0_desc: "Designed at the start of the cold war using Proportional navigation logic, to lock onto and destroy American nuclear bombers. One of the most basic forms of AA that can hit targets at 3700-4200m."
 CRM_Anti_Air_1: "9K38 Igla"
 CRM_Anti_Air_1_desc: "The Igla is a more modern version of the Strela, fielded in 2004 by Russia. It uses dual waveband infra-red (S-version) guidance systems much better than the Strela."
 CRM_Anti_Air_2: "9K38 Igla-S"
 CRM_Anti_Air_2_desc: "더 긴 사거리, 더 민감한 시커, 최신 대응책에 대한 향상된 저항 및 더 무거운 탄두를 갖춘 실질적으로 개선된 변종인 최신 변종입니다. 제조업체 보고에 따르면 적중 확률은 0.8–0.9입니다."
 CRM_Anti_Air_3: "9K42"
 CRM_Anti_Air_4: "9K48"
 CRM_APC_1: "BTR-60"
 CRM_APC_1_desc: "BTR-60은 14.5mm KPVT 중기관총에 500발을 장착했습니다. 보조 무기는 7.62mm 패킷 동축 기관총으로 3,00발입니다. 경보병 이동 및 QRF에 적합합니다."
 CRM_APC_1_short: "BTR-60"
 CRM_APC_2: "MT-LB"
 CRM_APC_2_desc: "MT-LB는 1970년대에 만들어졌습니다. 저렴하고 빠르게 제작된 소련은 가벼운 대공 및 보병 전투에 사용했습니다."
 CRM_APC_2_short: "MT-LB"
 CRM_APC_3: "BTR-70"
 CRM_APC_3_desc: "BTR-70은 1972년 소련-아프가니스탄 전쟁에서 군대를 이동시켜 화력을 지원하는데 사용되었습니다. BTR-60과의 유일한 차이점은 장갑이 더 무겁다는 점입니다."
 CRM_APC_3_short: "BTR-70"
 CRM_APC_4: "BTR-80"
 CRM_APC_4_desc: "BTR-80은 8륜 수륙양용 병력 수송 장갑차(APC)로 소련에서 개발되었습니다. 1986년 배치되기 시작하여 이전의 차량인 BTR-60, BTR70들을 대체하기 시작했습니다. 아프가니스탄전에서 처음 그 실력을 발휘했습니다."
 CRM_APC_4_short: "BTR-80"
 CRM_APC_5: "BTR-90"
 CRM_APC_5_desc: "테러리스트와 싸우기 위해 1994년에 생산되었습니다. 강력한 무기인 30mm 시퍼노브 2A42 포를 500발의 포탄과 함께 장착하고 있습니다."
 CRM_APC_5_short: "BTR-90"
 CRM_APC_6: "Kurganets-25"
 CRM_APC_6_desc: "One of the more modern Russian vehicles the Kurganets-25 was made in 2015. Made as an IFV has a Bumerang-BM light cannon, with a 12.7mm Kord Machine gun. Modeled closely to the American Bradley IFV."
 CRM_APC_6_short: "Kurganets-25"
 CRM_APC_7: "Kurganets-35"
 CRM_APC_7_desc: "Much like the 25, which is primarily an IFV, the 35, an APC, can carry 12 men and do about the same as the 25 in IFV operations."
 CRM_APC_7_short: "Kurganets-35"
 CRM_APC_8: "Kurganets-45"
 CRM_APC_8_desc: "Not much is known about this super APC, but it packs a 40mm cannon and can carry 12 men."
 CRM_APC_8_short: "Kurganets-45"
 CRM_Heavy_Anti_tank_1: "BRDM-2 9P148 Konkurs"
 CRM_Heavy_Anti_tank_1_desc: "Used in many wars and on many vehicles. The effective range is 500-3,000m."
 CRM_Heavy_Anti_tank_2: "MTLB Konkurs"
 CRM_Heavy_Anti_tank_3: "Kornet-E"
 CRM_Heavy_Anti_tank_4: "Kornet-DM"
 CRM_IFV_1: "BMP-1"
 CRM_IFV_1_desc: "BMP-1은 소련제 수륙양용 궤도형 보병 전투 차량입니다. 소련-아프가니스탄 전쟁에서 병력 수송 및 지하디스트와의 전투에 사용되었습니다. 73mm 2A28 주포와 대전차 미사일 발사기를 장착하고 있습니다."
 CRM_IFV_1_short: "BMP-1"
 CRM_IFV_2: "BMP-2"
 CRM_IFV_2_desc: "BMP-2는 지하드 주의자들이 가장 두려워 하던 차량으로 30mm 캐논과 캐터필러를 가져 굉장히 빠르고 효율적입니다."
 CRM_IFV_2_short: "BMP-2"
 CRM_IFV_3: "BMP-2M"
 CRM_IFV_3_short: "BMP-2M"
 CRM_IFV_4: "BMP-3"
 CRM_IFV_4_desc: "BMP-3는 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량입니다. 100mm 포로 고폭탄을 발사합니다."
 CRM_IFV_4_short: "BMP-3"
 CRM_IFV_5: "BMP-3M"
 CRM_IFV_5_desc: "BMP-3M은 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량인 동시에 BMP-3의 개량형입니다. 포와 엔진을 향상시켰습니다."
 CRM_IFV_5_short: "BMP-3M"
 CRM_IFV_6: "T-15 Armata"
 CRM_IFV_6_desc: ""
 CRM_IFV_6_short: "T-15"
 CRM_IFV_7: "T-15M"
 CRM_IFV_7_short: "T-15M"
 CRM_IFV_8: "T-16"
 CRM_IFV_8_short: "T-16"
 CRM_Anti_tank_1: "RPG-7"
 CRM_Anti_tank_1_desc: "Used in many wars and on many vehicles."
 CRM_Anti_tank_2: "AT-4 Fagot"
 CRM_Anti_tank_2_desc: "Much lighter than the other ATGM-systems, and older. This ATGM can only hit at 70-2,500 m which compared to others is much lesser range than the others but also cheaper."
 CRM_Anti_tank_3: "9M133M Kornet-M"
 CRM_Anti_tank_4: "9M134M Bulat-M"
 CRM_MBT_1: "T-55"
 CRM_MBT_1_desc: "The T-54/55 is perhaps the most produced tank in the world. Designed and produced in the early years of the Cold War, it was the might and the backbone of the Red Army. Once feared as a symbol of the Russian might, it has become the iconic representation of Middle-Eastern armoured forces getting destroyed in the wake of an American air strike."
 CRM_MBT_1_short: "T-55"
 CRM_MBT_2: "T-72"
 CRM_MBT_2_desc: "T-72는 아마도 러시아가 생산한 가장 성공적인 디자인일 것입니다. 그것은 냉전 말기 소련군의 정점이었고, 수천 대가 생산되었으며, 오늘날까지도 러시아군의 중추 역할을 하고 있습니다. 비록 중동 분쟁에서 치명적인 실패로 악명이 높았지만, T-72는 미래의 러시아 전차 설계를 위한 개발 플랫폼으로 여전히 사용되고 있으며 오늘날 현대전의 기준에 부합하도록 끊임없는 수정과 업그레이드가 이루어졌습니다. 한때 소련군의 창이었던 전차를 과소평가하지 마십시오."
 CRM_MBT_2_short: "T-72"
 CRM_MBT_3: "T-80"
 CRM_MBT_3_desc: "This 2m dollar tank and beast of the battlefield used the same cannon as the T-72 with added armor and a Kobra ATGM."
 CRM_MBT_3_short: "T-80"
 CRM_MBT_4: "T-90"
 CRM_MBT_4_desc: "Armed with a 3 cannon system for maximum fire capabilities and efficiency. With 3 125mm cannon launchers."
 CRM_MBT_4_short: "T-90"
 CRM_MBT_5: "T-14 Armata"
 CRM_MBT_5_desc: "The most advanced battle tank in the Russian army with sleek outlines and a powerful 152mm cannon."
 CRM_MBT_5_short: "T-14"
 CRM_MBT_7: "T-14M"
 CRM_MBT_7_short: "T-14M"
 CRM_MBT_8: "T-99 블랙이글"
 CRM_MBT_8_short: "T-99"
 CRM_mbt_equipment_0: "T-62"
 CRM_mbt_equipment_1: "T-72"
 CRM_mbt_equipment_2: "T-90"
 CRM_mbt_equipment_3: "T-14"
 CRM_mbt_equipment_4: "T-24"
 CRM_Rec_tank_0: "PT-76"
 CRM_Rec_tank_0_desc: "이 초고속 수륙 양용 경전차는 강 건너편에서 적진으로 몰래 접근하여 지옥의 짐을 내릴 수 있습니다. 76.2mm D-56T 강선 전차포를 사용합니다."
 CRM_Rec_tank_0_short: "PT-76"
 CRM_Rec_tank_1: "2S25 Sprut-SD"
 CRM_Rec_tank_1_desc: "자주식 수륙양용 구축전차인 이 차량은 적 탱크에 몰래 접근하여 t-72-80이 탑재하는 125mm 대포를 발사할 수 있습니다."
 CRM_Rec_tank_1_short: "2S25 Sprut-SD"
 CRM_Rec_tank_2: "BMPT Terminator"
 CRM_Rec_tank_2_desc: "아마도 지금까지 만들어진 가장 치명적인 유리 대포 중 하나일 것입니다. 탱크에 대항할 수는 없지만 기둥 전체를 파괴할 수 있습니다. 4개의 130mm 발사대와 2개의 30mm 기관포를 갖추고 있습니다."
 CRM_Rec_tank_2_short: "BMPT Terminator"
 CRM_Rec_tank_3: "K-18 Bumerang"
 CRM_Rec_tank_3_desc: "The Bumerang was first revealed to be both a cost-efficient APC and IFV for the modern Russian Army. However, the Bumerang will also be used as a dedicated anti-tank platform sporting a 125mm cannon, the details of which were unveiled in 2018. Much like the American Stryker MGS, the Bumerang will serve as a fire support vehicle much like the BMPT."
 CRM_Rec_tank_4: "경전차 2025"
 CRM_Rec_tank_4_short: "경전차 2025"
 CRM_Rec_tank_5: "경전차 2035"
 CRM_Rec_tank_5_short: "경전차 2035"
 CRM_SP_Anti_Air_0: "ZSU-23-4 실카"
 CRM_SP_Anti_Air_1: "9K35 스트렐라-10"
 CRM_SP_Anti_Air_2: "2K22 퉁구스카"
 CRM_SP_Anti_Air_2_desc: "최대 8발의 미사일을 발사할 수 있는 이 기체는 접근하는 모든 항공기를 격추할 수 있습니다. 뿐만 아니라 자동포로 수송기도 파괴할 수 있습니다."
 CRM_SP_Anti_Air_3: "판치르-S1M"
 CRM_SP_Anti_Air_4: "판치르-S4L"
 CRM_SP_R_arty_0: "BM-21 Grad"
 CRM_SP_R_arty_0_desc: "Not used much in modern operations the grandfather of SAMS and MLRS was used mostly in WW2 and Afghanistan. Being effective at 20km."
 CRM_SP_R_arty_1: "BM-30 스메르치"
 CRM_SP_R_arty_1_desc: "이 차량은 그라드 전차의 현대화된 버전입니다. 눈, 얼음, 사막 등 세계 어디든 갈 수 있으며, 유효 사거리는 35km입니다."
 CRM_SP_R_arty_2: "9A52-4 토르나도"
 CRM_SP_R_arty_2_desc: "An extremely heavy artillery battery that if not dealt with, it can destroy entire cities. With a maximum range of 90km."
 CRM_SP_arty_0: "2S1 Gvozdika"
 CRM_SP_arty_0_desc: "The 2S1 Gvozdika is a Soviet self-propelled howitzer based on the MT-LBu multi-purpose chassis, mounting a 122 mm 2A18 howitzer. \"2S1\" is its GRAU designation. An alternative Russian designation is SAU-122 but in the Russian Army it is commonly known as Gvozdika."
 CRM_SP_arty_1: "2S3 아카치야"
 CRM_SP_arty_1_desc: "필요하다면 태양도 쏠 수 있을 만큼 강력한 152.4mm D-22 대포로 무장한 이 포병대는 사거리가 50km에 달하는 놀라운 화력을 자랑합니다."
 CRM_SP_arty_2: "2S19M2 므스타-S"
 CRM_SP_arty_2_desc: "The 2S19 Msta-S was developed towards the end of the Cold War, incorporating new technologies and boasting an increased range compared to its predecessor."
 CRM_SP_arty_3: "2S35 코알리치야-SV"
 CRM_SP_arty_3_desc: "The 2S35 is a true 21st century artillery platform with widespread automation, automatic shell type selection and unified command-and-control systems."
 CRM_SP_arty_4: "2S38 코알리치야-M"
 CRM_artillery_1: "D-30"
 CRM_artillery_1_desc: "122mm towed artillery battery used in many wars by the Soviets. With a range of 15-25km."
 CRM_artillery_2: "2A65 Msta-B"
 CRM_artillery_3: "D-40"
 CRM_artillery_4: "D-50"
 CRM_util_vehicle_1: "ZIL-131"
 CRM_util_vehicle_1_desc: "A logistics truck and troop carrier used by many militaries around the world."
 CRM_util_vehicle_2: "Ural-4320"
 CRM_util_vehicle_2_desc: "A logistics truck and troop carrier used by many militaries around the world."
 CRM_util_vehicle_3: "KamAZ-4310"
 CRM_util_vehicle_3_desc: "A logistics truck and troop carrier used by many militaries around the world."
 CRM_util_vehicle_4: "KamAZ-4350"
 CRM_util_vehicle_4_desc: "Much like the Volk this can carry 8 men but also carry HMGs on the top of them. Used to lead convoys."
 CRM_util_vehicle_5: "GAZ Tigr"
 CRM_util_vehicle_5_desc: "This armored troop carrier can be armed with an array of different weapons and carry up to 11 men."
 CRM_util_vehicle_6: "VPK-3927 Volk"
 CRM_util_vehicle_6_desc: "The VPK can carry 2+8 men. With STANAG 4569 Level 3 armor. Great for special forces and police forces."
 CRM_util_vehicle_7: "Z-STS Akhmat"
 CRM_util_vehicle_7_desc: "Z-STS Akhmat is made on the three-axle all-wheel drive chassis KAMAZ-5350. It has high characteristics of mobility and patency, and in addition, it does not differ in the complexity of operation. It is curious that an armored car, unlike a basic truck, is built according to the hood scheme. This made it possible to shift the crew's places back and increase their safety."
 TAT_Anti_Air_0: "9K32 Strela-2"
 TAT_Anti_Air_0_desc: "Designed at the start of the cold war using Proportional navigation logic, to lock onto and destroy American nuclear bombers. One of the most basic forms of AA that can hit targets at 3700-4200m."
 TAT_Anti_Air_1: "9K38 Igla"
 TAT_Anti_Air_1_desc: "The Igla is a more modern version of the Strela, fielded in 2004 by Russia. It uses dual waveband infra-red (S-version) guidance systems much better than the Strela."
 TAT_Anti_Air_2: "9K38 Igla-S"
 TAT_Anti_Air_2_desc: "더 긴 사거리, 더 민감한 시커, 최신 대응책에 대한 향상된 저항 및 더 무거운 탄두를 갖춘 실질적으로 개선된 변종인 최신 변종입니다. 제조업체 보고에 따르면 적중 확률은 0.8–0.9입니다."
 TAT_Anti_Air_3: "9K42"
 TAT_Anti_Air_4: "9K48"
