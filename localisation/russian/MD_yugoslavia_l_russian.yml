l_russian:
 yugo_nost_overview: "@SLV [SLV.GetName] §Y[?SLV.yugo_nostalgia|0]%§!\n@CRO [CRO.GetName] §Y[?CRO.yugo_nostalgia|0]%§!\n@BOS [BOS.GetName] §Y[?BOS.yugo_nostalgia|0]%§!\n@SER [SER.GetName] §Y[?SER.yugo_nostalgia|0]%§!\n@FYR [FYR.GetName] §Y[?FYR.yugo_nostalgia|0]%§!\n@MNT [MNT.GetName] §Y[?MNT.yugo_nostalgia|0]%§!\n@KOS [KOS.GetName] §Y[?KOS.yugo_nostalgia|0]%§!"
 yugo_nost_rise_tt: "§Y+[?temp_yugo_nost_gain|0]§! Югоностальгия в [THIS.GetFlag] [THIS.GetName]"
 yugo_consensus_tt: "Каждое выжившее государство-преемник имеет по крайней мере 75% случаев югоносталгии"
 yugo_nost_ser_ready_tt: "@SER [SER.GetName] содержит не менее 75 % «югоностальгии»"
 yugo_dominant_tt: "Мы обладаем наибольшим влиянием во всех бывших республиках и возглавляем процесс возрождения Югославии"
 yugo_dominant_none: "нет доминирующего члена"
 yugo_sends_invites_tt: "Направляет приглашения всем оставшимся постюгославским государствам сформировать новую федерацию"
 yugo_invite_accept_tt: "Ответившее государство включено в состав восстановленной Югославской федерации."
 yugo_invite_reject_tt: "Реагирующее государство остается независимым, и федерация добивается цели войны за объединение против него."
 yugoslavia.1.t: "Приглашение в Югославию"
 yugoslavia.1.d: "[FROM.GetName] пригласила нас присоединиться к восстановленной югославской федерации. Принятие означает интеграцию, а отказ может обернуться против нас в рамках кампании по объединению."
 yugoslavia.1.a: "Вступайте в федерацию"
 yugoslavia.1.b: "Отвергать объединение"
 yugoslavia.30.t: "Нация обращается к Югославии"
 yugoslavia.30.d: "Поддержку восстановленной югославской федерации выразили три четверти населения. Идея, которая была похоронена в 1990-е годы, здесь снова является живым политическим проектом."
 yugoslavia.30.a: "Сон продолжается"
 yugoslavia_news.20.t: "Возникновение югославского возрождения"
 yugoslavia_news.20.d: "Спустя почти десять лет после распада Югославии, годы войны и ультранационалистического правления привели к геополитическому возрождению на Балканах, когда одна из стран региона начала настаивать на своем восстановлении.  \n\n Повсюду в [GetYugoDominantName] появились парады и заведения в стиле ретро с лозунгами «Братство и единство», что резко контрастирует с этническими столкновениями 90-х годов. Несмотря на то, что возрождение указывает на стремление к объединению Балкан, пока неясно, будет ли это движение набирать обороты или сойдет на нет, став лебединой песней для утраченной нации."
 yugoslavia_news.20.a: "Регион меняется."
 formed_yugoslavia: "Слава Югославии"
 formed_yugoslavia_desc: "Восстановленная федерация взяла на себя ответственность за интеграцию территории, институтов и народов, входящих в состав бывших югославских республик."
 yugoslavia_restored: "Югославия"
 yugo_bloc_dominant: "Лидер Югославского возрождения"
 yugo_bloc_dominant_desc: "Мы обладаем большим влиянием в бывших республиках, чем любое другое государство-преемник. Наша столица - естественное место встречи для переговоров о возрождении федерации."
 yugo_bloc: "Воссоединение Югославии"
 yugo_bloc_desc: "Прежде чем объединение станет возможным, поддержка восстановления Югославии должна достичь 75 % в каждом из сохранившихся государств-преемников. Возрождение возглавит государство, обладающее наибольшим влиянием в бывших республиках: §Y[GetYugoDominantName]§!.\n\n$yugo_nost_overview$"
 yugo_bloc_map: "Воссоединение Югославии"
 yugo_promote_nostalgia: "Продвижение югоностальгии в [FROM.GetName]"
 yugo_promote_nostalgia_desc: "Финансируйте культурный обмен, совместные средства массовой информации и совместные празднования, чтобы заручиться поддержкой восстановленной федерации. Требуется значимое влияние на целевое состояние."
 yugo_promote_own_nostalgia: "Культивируйте Югоносталгию в домашних условиях"
 yugo_promote_own_nostalgia_desc: "Финансируйте внутренние празднования, школьные программы и средства массовой информации, которые выставляют старую федерацию в благоприятном свете. Медленнее и дороже, чем популяризация ностальгии за рубежом, но для этого не нужно закрепляться в другом государстве."
 yugo_form_federation: "Созвать Федерацию"
 yugo_form_federation_desc: "Призовите все уцелевшие государства-преемники в восстановленную Югославскую федерацию. Государства, которые отказываются ставить перед федерацией цель войны за объединение. Только доминирующий член может созвать переговоры, и только после того, как каждый преемник поддержит воссоединение."
 news.85.t: "Восстановленная Югославия"
 news.85.desc: "Восстановленная югославская федерация была провозглашена после того, как ее архитекторы заручились поддержкой во всех бывших республиках. Новое государство претендует на политическое и стратегическое наследие федерации, распавшейся в 1990-е годы."
 news.85.a: "Возвращается балканское государство"
 yugoslavia_not_restored_tt: "Югославия уже §Rне§! была восстановлена другим государством-преемником"