 DPR_donbass_procent: "돈바스 퍼센트"
 DPR_donbass_procent_desc: "이른바 돈바스 퍼센트를 도입할 것입니다. 시민의 소득 증가를 유지하기 위해 국고에서 노동자의 총소득에 할당될 것입니다"
 DPR_donbass_big_business: "대기업으로 가는 길"
