l_english:
 STALKER_expel_foreign_agents: "Expel Foreign Agents from [FROM.GetName]"
 STALKER_expel_foreign_agents_desc: "Foreign intelligence services have filled the Zone with contractors, researchers and liaison officers who report home.\n\nForeign intelligence presence: §Y[?FROM.STALKER_zone_foreign_intel|0]§!\nIt grows by §Y5§! for each country granted research access, plus §Y0.4§! for each point of §Yexploitation§!. Above §Y49§!, it feeds any MDST network inside our government."
 STALKER_expel_foreign_agents_tt: "[FROM.GetName] loses up to §G40§! foreign intelligence presence. Every country with Zone research access thinks less of us."
 STALKER.140.t: "Foreign Agents in the Zone"
 STALKER.140.d: "Our counterintelligence officers have mapped the foreign presence in [STALKER_zone_name]. Half the scientists, contractors and journalists there are reporting to someone else."
 STALKER.140.a: "Roll up the networks quietly."
 STALKER.140.a_tt: "Costs §R25§! political power. The Zone loses up to §G25§! foreign intelligence presence."
 STALKER.140.b: "Let them watch. We are watching them."
 STALKER.140.b_tt: "Foreign intelligence presence keeps feeding any MDST network inside our government."
 STALKER_expelled_our_agents: "Expelled our agents from a Zone"
 STALKER_hire_mercenaries: "Hire Mercenaries in [FROM.GetName]"
 STALKER_hire_mercenaries_desc: "Put the contractors who already work for foreign services on our payroll. They stay in the original Zone, and the services that hired them first do not leave."
 STALKER_hire_mercenaries_tt: "Mercenary influence rises by §Y10§! and foreign intelligence presence rises by §Y5§!."
 STALKER_expel_mercenaries: "Expel Mercenaries from [FROM.GetName]"
 STALKER_expel_mercenaries_desc: "Order the contractors out of the original Zone. Another client will offer them the same work if the foreign presence remains."
 STALKER_expel_mercenaries_tt: "Mercenary influence falls by up to §G25§!."
 STALKER.141.t: "Mercenaries in the Zone"
 STALKER.141.d: "Contractors working for foreign services are operating in the open around [STALKER_zone_name]. They will take our contract, or they will take someone else's."
 STALKER.141.a: "Hire them onto the cordon."
 STALKER.141.a_tt: "Costs §R25§! political power. Mercenary influence rises by §Y8§! and military influence falls by up to §R3§!."
 STALKER.141.b: "Order them out."
 STALKER.141.b_tt: "Mercenary influence falls by up to §G15§!."
