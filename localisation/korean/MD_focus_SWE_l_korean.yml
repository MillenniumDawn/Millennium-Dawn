 Sweden_foci.4.t: "스웨덴 포병 체계 현대화"
 Sweden_foci.4.d: "포병 전력을 강화하기 위해 스웨덴은 첨단 자주포 체계의 도입을 검토하고 있습니다. 이 전략적 구상은 우리의 방위 태세를 강화하고 잠재적 파트너와의 상호운용성을 확보하는 것을 목표로 합니다."
 Sweden_foci.4.o1: "독일에서 PzH 2000 자주포를 조달한다"
 Sweden_foci.4.o2: "러시아에서 2S19 므스타를 조달한다"
 Sweden_foci.4.o3: "노르웨이와 아처 포병 체계를 공동 개발한다"
 Sweden_foci.4001.t: "스웨덴의 포병 도입 요청에 대한 회신"
 Sweden_foci.4001.d1: "독일이 PzH 2000 자주포를 조달하겠다는 스웨덴의 요청을 접수했습니다. 이 요청을 승인하면 양국 간 방위 관계가 강화되고 지역 안보가 증진될 것입니다."
 Sweden_foci.4001.d2: "러시아가 2S19 므스타 자주포를 조달하겠다는 스웨덴의 요청을 접수했습니다. 이 요청을 승인하면 군사 협력의 길이 열리고 향후 관계에 영향을 미칠 수 있습니다."
 Sweden_foci.4001.d3: "노르웨이가 아처 포병 체계의 개발 및 생산을 공동으로 추진하자는 스웨덴의 제안을 접수했습니다. 이 제안을 수락하면 지역 방위 협력이 강화되고 국내 산업이 뒷받침될 것입니다."
 Sweden_foci.4001.o1: "스웨덴의 요청을 거절한다"
 Sweden_foci.4001.o2: "스웨덴의 요청을 수락한다"
 Sweden_foci.4002.t: "승인된 스웨덴의 포병 도입 요청"
 Sweden_foci.4002.d1: "독일이 PzH 2000 자주포를 조달하겠다는 스웨덴의 요청을 승인했습니다. 이 결정은 양국 간 방위 협력의 중요한 진전입니다."
 Sweden_foci.4002.d2: "러시아가 2S19 므스타 자주포를 구매하겠다는 스웨덴의 제안을 수락했으며, 이는 군사 협력의 새로운 길을 열어 줍니다."
 Sweden_foci.4002.d3: "노르웨이가 아처 포병 체계의 개발 및 생산에서 스웨덴과 협력하기로 합의했으며, 이는 지역 방위 관계를 강화하고 국내 방위 산업을 활성화합니다."
 Sweden_foci.4002.o1: "도입 및 현대화 계획을 진행한다"
 Sweden_foci.4003.t: "거부된 스웨덴의 포병 도입 요청"
 Sweden_foci.4003.d1: "독일이 전략적 고려와 기존 약속을 이유로 PzH 2000 자주포를 조달하겠다는 스웨덴의 요청을 거절했습니다."
 Sweden_foci.4003.d2: "러시아가 지정학적 파장과 전략적 우선순위를 이유로 2S19 므스타 자주포를 구매하겠다는 스웨덴의 제안을 거절했습니다."
 Sweden_foci.4003.d3: "노르웨이가 자국의 방위 수요와 수출 정책을 우선시하여, 아처 포병 체계의 개발 및 생산을 공동으로 추진하자는 스웨덴의 제안을 거부했습니다."
 Sweden_foci.4003.o1: "비에른, ABBA 뮤지컬 프로젝트를 시작하게"
 Sweden_foci.5.t: "스웨덴 수송 헬리콥터 전력 현대화"
 Sweden_foci.5.d: "병참 및 병력 수송 능력을 강화하기 위해 스웨덴은 첨단 수송 헬리콥터의 도입을 평가하고 있습니다. 이 구상은 우리의 작전 효율성을 강화하고 국제 방위 협력을 촉진하는 것을 목표로 합니다."
