 SAU_rep_shia_mil_vanguard: "L'avant-garde révolutionnaire"
 SAU_rep_shia_mil_vanguard_loc: "[SAU.GetFlag]L'avant-garde révolutionnaire\n§HTaux de récupération de division :§! §G+5.00%§!\n§HDéfense de division :§! §G+5.00%§!\n\n"
 SAU_research_modifery_01: "§HDiversification§! - recherche et développement"
 SAU_research_modifery_01_desc: "Un financement ciblé des universités et instituts de recherche accélère la marche du Royaume vers une économie de la connaissance au-delà du pétrole."
 SAU_research_modifery_02: "§HDiversification§! - recherche de classe mondiale"
 SAU_research_modifery_02_desc: "Des institutions phares comme KAUST ont fait de l'Arabie saoudite un pôle régional montant de science et d'innovation, attirant les talents du monde entier."
 SAU_research_modifier_01: "Éveiller les esprits"
 SAU_research_modifier_01_desc: "Des programmes d'alphabétisation de base élargissent le nombre de Saoudiens capables d'entrer dans l'enseignement formel."
 SAU_research_modifier_02: "Une nation de lecture"
 SAU_research_modifier_02_desc: "L'alphabétisation croissante a créé un public lecteur plus large et augmenté la demande d'écoles et de matériels éducatifs."
 SAU_research_modifier_03: "Expansion de l'éducation"
 SAU_research_modifier_03_desc: "Des écoles et des inscriptions élargies donnent à davantage de Saoudiens accès à l'enseignement primaire et secondaire."
 SAU_research_modifier_04: "Fondements du savoir"
 SAU_research_modifier_04_desc: "Le Royaume a établi les institutions et le personnel formé nécessaires à un système éducatif national plus large."
 SAU_research_modifier_06: "Cultiver l’intellect"
 SAU_research_modifier_06_desc: "Universités et instituts de recherche produisent un vivier plus large de spécialistes saoudiens hautement formés."
 SAU_royal_ulema_alliance_content: "§HAlliance trône-oulémas§!"
 SAU_royal_ulema_alliance_content_desc: "Les §LOulémas§! et la §Hmaison des Saoud§! coopèrent de façon productive. Les fatwas de routine favorisent le trône ; les politiques de routine respectent le clergé. Ni l'un ni l'autre n'a motif de se plaindre."
 SAU_royal_ulema_alliance_high: "§HAlliance trône-oulémas§!"
 SAU_royal_ulema_alliance_high_desc: "Le §LConseil des grands oulémas§! soutient fortement le trône, et l'establishment religieux présente la politique royale comme légitime. Cet alignement étroit renforce substantiellement la dynastie."
 SAU_royal_ulema_alliance_neutral: "§HAlliance trône-oulémas§!"
 SAU_royal_ulema_alliance_neutral_desc: "Le trône et le clergé maintiennent une relation §Yformelle mais limitée§!. Ni l'un ni l'autre ne soutient ni n'obstrue activement l'autre, si bien que l'équilibre des pouvoirs n'apporte ni bonus ni pénalité."
 SAU_royal_ulema_alliance_neutral_tt: "§YLa relation trône-oulémas est équilibrée - ni bonus ni pénalité.§! \n§Ychangement d'équilibre des pouvoirs = 0.00§!"
 SAU_royal_ulema_alliance_strained: "§RTension royauté-oulémas§!"
 SAU_royal_ulema_alliance_strained_desc: "Des membres des §LOulémas§! critiquent en privé le trône et usent des prêches pour questionner la réforme gouvernementale. Cette opposition réduit la légitimité religieuse de la dynastie."
 SAU_sabic_01: "SABIC"
 SAU_sabic_01_desc: "La Saudi Basic Industries Corporation est un grand fabricant pétrochimique. Encore en croissance, SABIC contribue à la diversification industrielle et fournit de l'emploi au-delà du secteur pétrolier."
 SAU_sabic_agrinutrients: "§HSABIC§! - Agro-nutriments et produits chimiques de spécialité"
 SAU_sabic_agrinutrients_desc: "SABIC Agri-Nutrients transforme le gaz saoudien en urée et en ammoniac, nourrissant les fermes d'Asie et d'Afrique et faisant du Royaume une puissance des engrais."
 SAU_sabic_foreign_jv: "§HSABIC§! - coentreprises étrangères"
 SAU_sabic_foreign_jv_desc: "Des coentreprises avec Shell, ExxonMobil et Mitsubishi ont apporté une technologie de classe mondiale dans les usines de SABIC tout en ancrant les profits dans le Royaume."
 SAU_sabic_ge_plastics: "§HSABIC§! - Acquisition de GE Plastics"
 SAU_sabic_ge_plastics_desc: "L'acquisition de GE Plastics en 2007 pour plus de onze milliards de dollars a propulsé SABIC au premier rang des producteurs mondiaux de plastiques techniques du jour au lendemain."
 SAU_sabic_global_champion: "§HSABIC§! - Champion mondial de la chimie"
 SAU_sabic_global_champion_desc: "SABIC figure parmi les plus grandes sociétés chimiques de la Terre, la preuve que l'industrie saoudienne peut rivaliser bien au-delà du baril."
 SAU_sabic_hadeed: "§HSABIC§! - Complexe sidérurgique HADEED"
 SAU_sabic_hadeed_desc: "Hadeed, le bras acier de SABIC à Jubail, alimente la construction saoudienne de millions de tonnes de ronds à béton et d'acier plat qu'il fallait autrefois importer."
 SAU_sabic_ibn_affiliates: "§HSABIC§! - Les filiales Ibn"
 SAU_sabic_ibn_affiliates_desc: "Les filiales Ibn Sina, Ibn Zahr et Ibn Rushd répartissent la production pétrochimique de SABIC entre plastiques, méthanol et fibres."
 SAU_sabic_jubail_yanbu: "§HSABIC§! - villes industrielles de Jubail et Yanbu"
 SAU_sabic_jubail_yanbu_desc: "Les villes de la commission royale de Jubail et Yanbu ont transformé un littoral vide en deux des plus grands complexes industriels du monde, fondement de l'industrie lourde saoudienne."
 SAU_sabic_rnd: "§HSABIC§! - Technologie locale"
 SAU_sabic_rnd_desc: "Les centres de recherche de SABIC à Riyad, Bangalore et Geleen maintiennent ses catalyseurs et polymères à la frontière technologique."
 SAU_sagia_initiative: "§HInitiative SAGIA§!"
 SAU_sagia_initiative_02: "§HSAGIA - réformes de l'investissement§!"
 SAU_sagia_initiative_02_desc: "§LSAGIA§! a assoupli les restrictions de propriété et réduit les délais de licence. Ces réformes attirent davantage d'entreprises étrangères et rendent le marché saoudien plus facile à entrer."
 SAU_sagia_initiative_03: "§HSAGIA - plaque tournante des capitaux étrangers§!"
 SAU_sagia_initiative_03_desc: "L'Arabie saoudite a ouvert des §Hsecteurs stratégiques§!, introduit des §Hincitations fiscales§! et développé des §Hvilles économiques§! le long de ses côtes. Ces politiques ont fait du Royaume une destination régionale majeure pour l'investissement direct étranger."
 SAU_sagia_initiative_04: "§GSAGIA - puissance d'investissement§!"
 SAU_sagia_initiative_04_desc: "L'Arabie saoudite combine désormais une §Héconomie diversifiée§! et un §Hmarché d'investissement ouvert§!. Les réformes SAGIA achevées attirent un capital étranger substantiel et des travailleurs qualifiés."
 SAU_sagia_initiative_desc: "Établie par décret royal en §Yavril 2000§!, l'§LAutorité générale saoudienne de l'investissement§! est la première agence du Royaume dédiée à attirer l'investissement étranger. Elle est chargée de simplifier le droit des affaires, de fournir aux investisseurs un §Hpoint de contact unique§!, et d'améliorer l'accès au marché saoudien."
 SAU_salman_health_critical: "§HLa santé du roi§! - §Rcritique§!"
 SAU_salman_health_critical_desc: "Le roi ne voyage plus et manque fréquemment les réunions du Conseil. Le palais fournit peu d'informations, poussant les hauts personnages à se préparer à une succession."
 SAU_salman_health_declining: "§HLa santé du roi§! - §Yen déclin§!"
 SAU_salman_health_declining_desc: "Le roi raccourcit ou annule davantage d'audiences officielles, bien que le palais n'ait pas annoncé de maladie grave. Son calendrier réduit commence à affecter les affaires du gouvernement."
 SAU_salman_health_near_death: "§HLa santé du roi§! - §Rproche de la mort§!"
 SAU_salman_health_near_death_desc: "Le roi est près de la mort et a de fait transféré la gouvernance à ses successeurs. L'activité politique est désormais dominée par les préparatifs de la succession."
 SAU_salman_health_serious: "§HLa santé du roi§! - §Ygrave§!"
 SAU_salman_health_serious_desc: "Le roi fait peu d'apparitions publiques, et les ministres reçoivent de plus en plus les instructions par la Cour royale plutôt que de lui directement."
 SAU_salman_health_stable: "§HLa santé du roi§! - §Gstable§!"
 SAU_salman_health_stable_desc: "Le roi tient un calendrier officiel complet, reçoit les ambassadeurs, préside le Conseil des ministres et examine les dossiers du gouvernement. Sa participation continue maintient la cour et les ministères en ordre."
 SAU_shura_led_notables: "Conseil des notables"
 SAU_shura_led_notables_desc: "Les chefs tribaux et les grandes familles marchandes dominent le Conseil de la choura par des accords informels conclus avant les votes formels. Cet arrangement est représentatif des structures de pouvoir saoudiennes établies mais ralentit la prise de décision."
 SAU_shura_led_technocrats: "Conseil des ministères"
 SAU_shura_led_technocrats_desc: "Les technocrates ont rendu le Conseil de la choura plus efficace pour examiner budgets et politique gouvernementale. Ses membres sont hautement compétents mais représentent mal les communautés hors de Riyad."
 SAU_shura_led_ulema: "Conseil des oulémas"
 SAU_shura_led_ulema_desc: "Les savants religieux contrôlent le Conseil de la choura et empêchent les propositions opposées par l'establishment religieux d'atteindre le roi."
 SAU_sp_abrams_combined: "Armure : armes combinées"
 SAU_sp_abrams_combined_desc: "Chars, infanterie et artillerie combattent en une équipe équilibrée.\n§G+5%§! Attaque de division\n§G+5%§! Défense de division\n§G+5%§! Organisation de division\n§R+10%§! Temps d'entraînement de l'armée"
 SAU_sp_abrams_defensive: "Armure : Mur défensif"
 SAU_sp_abrams_defensive_desc: "Blindés retranchés comme un bouclier inamovible pour le Royaume.\n§G+10%§! Défense de division\n§G+10%§! Vitesse d'enracinement\n§R-10%§! Vitesse de division"
 SAU_sp_abrams_shock: "Armure : choc et percée"
 SAU_sp_abrams_shock_desc: "Percées blindées rapides et dures pour briser la ligne ennemie.\n§G+10%§! Attaque sur territoire national\n§G+5%§! Vitesse de division\n§R-5%§! Organisation de division"
 SAU_sp_apache_antiarmor: "Aviation militaire : tueurs de chars"
 SAU_sp_apache_antiarmor_desc: "Des chasseurs armés de missiles Hellfire pour saigner à blanc une avancée blindée.\n§G+7.5%§! Attaque sur le territoire national\n§G+5%§! Attaque de division\n§R-5%§! Gain d'expérience aérienne"
 SAU_sp_apache_closeair: "Aviation de l'armée : appui rapproché"
 SAU_sp_apache_closeair_desc: "Des canonnières au-dessus pour soutenir et protéger les troupes au sol.\n§G+5%§! Organisation de division\n§G+5%§! Taux de récupération de division\n§R+10%§! Accidents aériens"
 SAU_sp_apache_recon: "Aviation militaire : reconnaissance et raids"
 SAU_sp_apache_recon_desc: "Des yeux en avant et des raids-éclair loin derrière la ligne.\n§G+7.5%§! Vitesse de division\n§G+5%§! Vitesse de planification\n§R-5%§! Défense de division"
 SAU_sp_arty_mass: "Artillerie : feux massifs"
 SAU_sp_arty_mass_desc: "Des barrages écrasants pour pulvériser l'ennemi, au diable le ravitaillement.\n§G+10%§! Attaque sur territoire national\n§R+10%§! Consommation de ravitaillement"
 SAU_sp_arty_mobile: "Artillerie : tirer et déplacer"
 SAU_sp_arty_mobile_desc: "Tirer et se déplacer avant que l'ennemi ne puisse répondre.\n§G+5%§! Vitesse de division\n§G+5%§! Organisation de division\n§R-5%§! Défense de division"
 SAU_sp_arty_precision: "Artillerie : tirs de précision"
 SAU_sp_arty_precision_desc: "Moins d'obus, plus intelligents, exactement sur la bonne cible.\n§G+7.5%§! Attaque de division\n§G+5%§! Gain d'expérience de l'armée\n§R+5%§! Usage de biens de consommation"
 SAU_sp_awacs_control: "AWACS : contrôle de la bataille aérienne"
 SAU_sp_awacs_control_desc: "Les contrôleurs tissent chaque chasseur en un filet meurtrier.\n§G+10%§! Supériorité aérienne\n§G+5%§! Gain d'expérience aérienne\n§R+3%§! Usage de biens de consommation"
 SAU_sp_awacs_earlywarn: "AWACS : réseau d'alerte précoce"
 SAU_sp_awacs_earlywarn_desc: "Aucun raid ne franchit la frontière sans être vu.\n§G+10%§! Défense aérienne\n§R-5%§! Attaque aérienne"
 SAU_sp_awacs_groundlink: "AWACS : liaison terrestre commune"
 SAU_sp_awacs_groundlink_desc: "L'image d'en haut guide l'armée d'en bas.\n§G+5%§! Attaque de division\n§G+5%§! Vitesse de planification\n§R-5%§! Gain d'expérience aérienne"
 SAU_sp_combat_armor: "Armes de combat : poing blindé"
 SAU_sp_combat_armor_desc: "Un poing d'acier en fer de lance.\n§G+7,5 %§! Attaque en territoire national\n§G+5 %§! Vitesse de division\n§R+5 %§! Consommation de ravitaillement"
 SAU_sp_combat_firepower: "Armes de combat : puissance de feu"
 SAU_sp_combat_firepower_desc: "Écraser l'ennemi sous le poids du feu.\n§G+7,5 %§! Attaque de division\n§R-5 %§! Vitesse de division"
 SAU_sp_combat_infantry: "Armes de combat : infanterie professionnelle"
 SAU_sp_combat_infantry_desc: "Une infanterie professionnelle, habile et ferme, tient le terrain.\n§G+7,5 %§! Défense de division\n§G+5 %§! Organisation de division\n§R-5 %§! Attaque en territoire national"
 SAU_sp_fleet_bluewater: "Marine : Ambition Blue-Water"
 SAU_sp_fleet_bluewater_desc: "S'élancer au-delà du Golfe vers le grand large.\n§G+15 %§! Portée navale\n§G+5 %§! Attaque des navires de ligne\n§R-5 %§! Moral naval"
 SAU_sp_fleet_coastal: "Marine : défense côtière"
 SAU_sp_fleet_coastal_desc: "Un mur de petites unités gardant chaque port et chaque récif.\n§G+5 %§! Moral naval\n§G+10 %§! Défense des écrans\n§R-5 %§! Attaque des navires de ligne"
 SAU_sp_fleet_gulf: "Marine : Contrôle de la mer du Golfe"
 SAU_sp_fleet_gulf_desc: "Dominer les eaux étroites et encombrées du golfe Arabique.\n§G+10 %§! Attaque des écrans\n§G+5 %§! Coordination navale\n§R-10 %§! Portée navale"
 SAU_sp_pgm_interdiction: "Munitions à guidage de précision : interdiction du champ de bataille"
 SAU_sp_pgm_interdiction_desc: "Couper l'ennemi de ses arrières avant qu'il puisse combattre.\n§G+5 %§! Organisation de division\n§G+5 %§! Attaque d'appui aérien rapproché\n§R+10 %§! Coût de doctrine aérienne"
 SAU_sp_pgm_sead: "Munitions à guidage de précision : suppression des défenses"
 SAU_sp_pgm_sead_desc: "Aveugler et briser d'abord le réseau de défense aérienne ennemi.\n§G+7,5 %§! Supériorité aérienne\n§G+5 %§! Attaque aérienne\n§R-5 %§! Agilité aérienne"
 SAU_sp_pgm_strike: "Munition à guidage de précision : frappe de précision"
 SAU_sp_pgm_strike_desc: "Des bombes intelligentes qui aplatissent la cible et épargnent le reste.\n§G+10 %§! Attaque d'appui aérien rapproché\n§G+5 %§! Attaque aérienne\n§R+5 %§! Usage de biens de consommation"
 SAU_sp_posture_deterrence: "Posture : dissuasion stratégique"
 SAU_sp_posture_deterrence_desc: "Un bouclier équilibré qui fait réfléchir deux fois tout agresseur.\n§G+5 %§! Défense de division\n§G+5 %§! Défense aérienne\n§G+5 %§! Stabilité\n§R-5 %§! Attaque de division"
 SAU_sp_posture_homeland: "Posture : défense du territoire"
 SAU_sp_posture_homeland_desc: "Tout tourné vers l'intérieur pour faire du Royaume une forteresse.\n§G+10 %§! Défense du territoire national\n§G+5 %§! Retranchement maximal\n§R-5 %§! Vitesse de division"
 SAU_sp_posture_projection: "Posture : Projection de puissance"
 SAU_sp_posture_projection_desc: "Une armée capable de frapper loin de chez elle.\n§G+5 %§! Vitesse de division\n§G+10 %§! Portée navale\n§G+5 %§! Attaque aérienne\n§R+5 %§! Usage de biens de consommation"
 SAU_sp_redflag_bvr: "Air : au-delà de la portée visuelle"
 SAU_sp_redflag_bvr_desc: "Tuer de loin, avant que l'ennemi ne vous voie.\n§G+7,5 %§! Attaque aérienne\n§G+5 %§! Supériorité aérienne\n§R+10 %§! Coût de doctrine aérienne"
 SAU_sp_redflag_defensive: "Air : doctrine de défense aérienne"
 SAU_sp_redflag_defensive_desc: "Survivre, durer et protéger le ciel du Royaume.\n§G+10 %§! Défense aérienne\n§G+5 %§! Agilité aérienne\n§R-5 %§! Attaque aérienne"
 SAU_sp_redflag_dogfight: "Air : Maîtrise du combat aérien"
 SAU_sp_redflag_dogfight_desc: "Virer et brûler : s'emparer du combat rapproché.\n§G+10 %§! Agilité aérienne\n§G+5 %§! Attaque aérienne\n§R-5 %§! Défense aérienne"
 SAU_sp_reform_crash: "Réforme : programme accéléré"
 SAU_sp_reform_crash_desc: "Réformer maintenant, réformer vite — et tant pis pour le désordre.\n§G+10 %§! Gain d'expérience de l'armée\n§G+5 %§! Organisation de division\n§R-5 %§! Stabilité"
 SAU_sp_reform_foreign: "Réforme : contractants étrangers"
 SAU_sp_reform_foreign_desc: "Embaucher des experts étrangers pour le faire vite et bien — à un prix.\n§G-15 %§! Temps d'entraînement de l'armée\n§G+5 %§! Gain d'expérience de l'armée\n§R-5 %§! Gain de pouvoir politique"
 SAU_sp_reform_steady: "Réforme : montée en puissance méthodique"
 SAU_sp_reform_steady_desc: "Une réforme patiente et ordonnée que l'armée peut absorber.\n§G+5 %§! Organisation de division\n§G+5 %§! Taux de récupération des divisions\n§R-3 %§! Attaque de division"
 SAU_sp_sang_regime: "Garde nationale : garde du régime"
 SAU_sp_sang_regime_desc: "D'abord et avant tout, la SANG protège le trône et les deux villes saintes.\n§G+10 %§! Défense du territoire national\n§G+5 %§! Stabilité\n§R-5 %§! Attaque de division"
 SAU_sp_sang_security: "Garde nationale : sécurité intérieure"
 SAU_sp_sang_security_desc: "Une garde vigilante contre la subversion et les troubles intérieurs.\n§G-25 %§! Activité subversive ennemie\n§G+5 %§! Stabilité\n§R-5 %§! Soutien à la guerre"
 SAU_sp_sang_tribal: "Garde nationale : levées tribales"
 SAU_sp_sang_tribal_desc: "Une main-d'œuvre tribale loyale gonfle les rangs, sinon leur polish.\n§G+10 %§! Population recrutable\n§G+5 %§! Taux de récupération des divisions\n§R-5 %§! Organisation de division"
 SAU_sp_sf_counterterror: "Forces spéciales : contre-terrorisme"
 SAU_sp_sf_counterterror_desc: "Une force petite et létale pour libération d'otages et contre-terrorisme.\n§G+10 %§! Attaque des forces spéciales\n§G+5 %§! Défense des forces spéciales\n§R-3 %§! Plafond des forces spéciales"
 SAU_sp_sf_raiders: "Forces spéciales : raids en profondeur"
 SAU_sp_sf_raiders_desc: "Plus d'opérateurs frappant en profondeur, au détriment de leur endurance.\n§G+5 %§! Plafond des forces spéciales\n§G+7,5 %§! Attaque des forces spéciales\n§R-5 %§! Défense des forces spéciales"
 SAU_sp_sf_recon: "Forces spéciales : reconnaissance"
 SAU_sp_sf_recon_desc: "Des yeux silencieux qui font voir plus loin toute l'armée.\n§G+5 %§! Plafond des forces spéciales\n§G+5 %§! Vitesse de planification\n§R-5 %§! Attaque des forces spéciales"
 SAU_spirit_king_in_name: "Roi de nom, héritier en uniforme"
 SAU_spirit_king_in_name_desc: "La monarchie demeure formellement intacte, tandis que le prince héritier sert comme officier sous l'autorité du Conseil. Ce compromis évite une rupture ouverte entre institutions royales et militaires sans pleinement satisfaire ni les unes ni les autres."
 SAU_spirit_national_service: "Les défilés du service national"
 SAU_spirit_national_service_desc: "Deux fois par an, des défilés militaires sur l'avenue du roi Fahd mobilisent blindés, groupes scolaires et retransmissions en direct pour bâtir le soutien au service national. Leur caractère mis en scène n'a pas empêché une forte affluence."
 SAU_spirit_officer_housing: "Le programme de logements des officiers"
 SAU_spirit_officer_housing_desc: "Le gouvernement construit à marche forcée logements, écoles et cliniques pour les officiers et leurs familles. Ces avantages renforcent la loyauté du corps des officiers envers le régime."
 SAU_spirit_officer_purge: "La purge du corps des officiers"
 SAU_spirit_officer_purge_desc: "Les officiers qui ont hésité pendant la prise du pouvoir ont été mis à la retraite, tandis que ceux qui l'ont soutenue conservent le commandement. La purge a réduit la taille de l'armée mais rendu le corps restant plus obéissant."
 SAU_spirit_public_accounts: "Les comptes publics du Conseil"
 SAU_spirit_public_accounts_desc: "Les ministères publient désormais leurs dépenses pour la première fois dans l'histoire saoudienne. La politique a irrité les familles qui profitaient du secret, mais elle est très populaire auprès du public."
 SAU_spirit_quincy_reaffirmed: "L'entente de Quincy"
 SAU_spirit_quincy_reaffirmed_desc: "Les États-Unis et le Conseil poursuivent l'arrangement informel pétrole-sécurité établi en 1945. Les forces américaines protègent le trafic du Golfe tandis que les pétroliers saoudiens approvisionnent les marchés mondiaux, et les deux gouvernements préfèrent laisser l'accord non écrit."
 SAU_spirit_security_directorate: "La Direction de la sécurité"
 SAU_spirit_security_directorate_desc: "Le Conseil a fusionné les archives du Mabahith, les réseaux du ministère de l'Intérieur et le renseignement militaire en une seule direction sous un général. Ses vastes pouvoirs de surveillance la rendent efficace mais largement méfiée."
 SAU_spirit_unbeholden: "Le Royaume sans tutelle"
 SAU_spirit_unbeholden_desc: "L'Arabie saoudite a rejeté garanties de sécurité étrangères et garnisons. Elle achète désormais ses propres défenses aériennes et forme ses propres officiers, gagnant son indépendance à un coût financier très élevé."
 SAU_succession_instability: "§RInstabilité successorale§!"
 SAU_succession_instability_desc: "Le roi Fahd est incapable depuis son accident vasculaire de 1995, laissant le prince héritier Abdallah comme dirigeant de facto. La cour est divisée entre les partisans d'Abdallah et la puissante faction soudairite, créant un climat d'incertitude politique. Tant que la succession n'est pas formellement tranchée, la décision du Royaume reste paralysée par les rivalités de factions."
 SAU_syria_landbridge_severed: "Le pont terrestre iranien coupé"
 SAU_syria_landbridge_severed_desc: "Un gouvernement ami à Damas a coupé la route terrestre de Téhéran vers le Hezbollah. La victoire stratégique enhardit le Royaume et raffermit le royaume."
 SAU_syria_pipeline_t1: "Pipeline Levant (niveau I)"
 SAU_syria_pipeline_t1_desc: "Le pétrole saoudien traverse la Jordanie et la Syrie jusqu'à la Méditerranée, défiant le gaz russe aux portes de l'Europe. §GRevenu supplémentaire : 3,50 Md $§! d'exportations par oléoduc, contre §RDépense supplémentaire : 2,00 Md $§! de droits de transit vers les pays traversés — un solde net de §G+1,50 Md $§! par semaine. Un sabotage fait chuter l'oléoduc d'un palier, réduisant les deux ; une ligne de palier 1 rompue ferme la route."
 SAU_syria_pipeline_t2: "Pipeline Levant (niveau II)"
 SAU_syria_pipeline_t2_desc: "Le pétrole saoudien traverse la Jordanie et la Syrie jusqu'à la Méditerranée, défiant le gaz russe aux portes de l'Europe. §GRevenu supplémentaire : 4,25 Md $§! d'exportations par oléoduc, contre §RDépense supplémentaire : 2,30 Md $§! de droits de transit vers les pays traversés — un solde net de §G+1,95 Md $§! par semaine. Un sabotage fait chuter l'oléoduc d'un palier, réduisant les deux ; une ligne de palier 1 rompue ferme la route."
 SAU_syria_pipeline_t3: "Pipeline Levant (niveau III)"
 SAU_syria_pipeline_t3_desc: "Le pétrole saoudien traverse la Jordanie et la Syrie jusqu'à la Méditerranée, défiant le gaz russe aux portes de l'Europe. §GRevenu supplémentaire : 5,00 Md $§! d'exportations par oléoduc, contre §RDépense supplémentaire : 2,50 Md $§! de droits de transit vers les pays traversés — un solde net de §G+2,50 Md $§! par semaine. Un sabotage fait chuter l'oléoduc d'un palier, réduisant les deux ; une ligne de palier 1 rompue ferme la route."
 SAU_syrian_quagmire: "Le bourbier syrien"
 SAU_syrian_quagmire_desc: "Des années de soutien à une guerre infructueuse en Syrie ont réduit à la fois le soutien public et les fonds du Trésor. Le gouvernement syrien reste au pouvoir malgré les dépenses du Royaume."
 SAU_tadawul_market: "§GTadawul, la Bourse saoudienne NIV 0§!"
 SAU_tadawul_market_desc: "La §LBourse saoudienne§! en est à son stade initial, avec des fonctions de négoce et de régulation de base. Achever les focuses pertinents approfondira le marché et accroîtra ses bénéfices économiques."
 SAU_tadawul_market_t1: "§GTadawul, la Bourse saoudienne NIV 1§!"
 SAU_tadawul_market_t10: "§GTadawul, la Bourse saoudienne NIV 10§!"
 SAU_tadawul_market_t10_desc: "Le programme de réforme est achevé, avec toutes les lois, régulateurs et introductions prévus. §LTadawul§! est désormais la §Gplus grande bourse de la région MENA§!, avec une capitalisation supérieure à celle de toutes les autres bourses du monde arabe réunies."
 SAU_tadawul_market_t1_desc: "La première étape de la réforme de Tadawul a amélioré le fonctionnement du marché et la confiance des investisseurs. D'autres focuses pertinents poursuivront son développement."
 SAU_tadawul_market_t2: "§GTadawul, la Bourse saoudienne NIV 2§!"
 SAU_tadawul_market_t2_desc: "Plus d'entreprises s'introduisent à Tadawul et les volumes de transactions montent, augmentant les recettes des bureaux et de l'impôt sur les sociétés."
 SAU_tadawul_market_t3: "§GTadawul, la Bourse saoudienne NIV 3§!"
 SAU_tadawul_market_t3_desc: "Trois étapes de réforme de Tadawul ont accru l'accès de la bourse aux capitaux et sa contribution aux recettes de l'État."
 SAU_tadawul_market_t4: "§GTadawul, la Bourse saoudienne NIV 4§!"
 SAU_tadawul_market_t4_desc: "Tadawul finance désormais l'industrie civile autant que les sociétés cotées, tandis qu'une régulation plus forte améliore la confiance des investisseurs et la stabilité."
 SAU_tadawul_market_t5: "§GTadawul, la Bourse saoudienne NIV 5§!"
 SAU_tadawul_market_t5_desc: "Tadawul a achevé la moitié de son programme de réforme, avec une activité de négoce, des recettes et une confiance des investisseurs plus fortes."
 SAU_tadawul_market_t6: "§GTadawul, la Bourse saoudienne NIV 6§!"
 SAU_tadawul_market_t6_desc: "Six étapes de réforme ont élargi le rôle de Tadawul dans le financement des entreprises saoudiennes et l'attraction des investissements."
 SAU_tadawul_market_t7: "§GTadawul, la Bourse saoudienne NIV 7§!"
 SAU_tadawul_market_t7_desc: "Sept étapes de réforme ont fait de Tadawul une bourse régionale mature, avec d'importants capitaux sous gestion."
 SAU_tadawul_market_t8: "§GTadawul, la Bourse saoudienne NIV 8§!"
 SAU_tadawul_market_t8_desc: "Une Tadawul mature canalise les capitaux vers la construction et l'industrie et donne au gouvernement davantage d'influence sur la politique économique."
 SAU_tadawul_market_t9: "§GTadawul, la Bourse saoudienne NIV 9§!"
 SAU_tadawul_market_t9_desc: "Tadawul approche le plein développement, produisant d'importantes recettes d'impôt sur les sociétés et l'industrie et jouant un rôle plus large dans la politique économique nationale."
 SAU_tenth_five_year_plan: "Le dixième plan quinquennal"
 SAU_tenth_five_year_plan_desc: "Le ministère de l'Économie et de la Planification publie des plans quinquennaux depuis 1970, mais beaucoup n'étaient que des déclarations d'intention. Ce plan finance pleinement ports, chemins de fer, rocades et réformes ministérielles.\n\n§GDure cinq ans§!."
 SAU_vision_2030_delivered: "Vision 2030 : réalisée"
 SAU_vision_2030_delivered_desc: "Vision 2030 a livré d'importants projets de construction et de diversification, dont NEOM, le réaménagement de Riyad et de nouvelles installations touristiques. L'Arabie saoudite dépend désormais moins fortement du pétrole brut."
 SAU_vision_2030_expectations: "Vision 2030 : la promesse"
 SAU_vision_2030_expectations_desc: "L'annonce des mégaprojets de Vision 2030 a attiré les investissements et accru la confiance du public. Leur ampleur crée aussi d'importants coûts budgétaires et politiques jusqu'à l'achèvement des projets promis."
 SAU_vision_2030_progress: "Vision 2030 : prendre forme"
 SAU_vision_2030_progress_desc: "La construction avance dans tout le Royaume, et les premiers projets de Vision 2030 sont en service. Ces progrès visibles ont réduit les doutes du public sur le programme."
 SAU_vision_2030_white_elephant: "Vision 2030 : les éléphants blancs"
 SAU_vision_2030_white_elephant_desc: "Vision 2030 a manqué son échéance, laissant d'immenses projets inachevés ou inutilisés après des centaines de milliards de dépenses. L'échec a donné raison aux critiques du programme et entamé la confiance dans la direction."
 SAU_water_crisis_01: "§HGestion de la crise de l'eau§!"
 SAU_water_crisis_01_desc: "Le dessalement accru, une politique agricole plus efficiente et une consommation publique moindre ont ramené la crise de l'eau à un niveau §Ggérable§!. Le Royaume reste structurellement en pénurie d'eau, mais l'approvisionnement demeure fiable."
 SAU_water_crisis_02: "§HCrise hydrique aiguë§!"
 SAU_water_crisis_02_desc: "L'Arabie saoudite épuise les aquifères fossiles du §LSaq§! et du §LWajid§! plus vite qu'ils ne se reconstituent. L'agriculture consomme une grande part des eaux souterraines restantes, tandis que la dépendance au dessalement augmente les §Ycoûts des biens de consommation§!, réduit l'§Yefficience§! et affaiblit la §Ypatience du public§!."
 SAU_yemen_attack_buff: "Offensive coordonnée"
 SAU_yemen_attack_buff_desc: "La planification et l'appui-feu saoudiens donnent à nos forces un avantage décisif à l'attaque. +15 % d'attaque contre les Houthis."
 SAU_yemen_pipeline_t1: "Pipeline de la mer d’Oman (niveau I)"
 SAU_yemen_pipeline_t1_desc: "Le brut saoudien descend par Al Mahrah jusqu'à la mer d'Arabie, contournant le détroit d'Ormuz. §GRevenu supplémentaire : 2,00 Md $§! d'exportations par oléoduc, contre §RDépense supplémentaire : 1,00 Md $§! de droits de transit vers les pays traversés — un solde net de §G+1,00 Md $§! par semaine. Un sabotage fait chuter l'oléoduc d'un palier, réduisant les deux ; une ligne de palier 1 rompue ferme la route."
 SAU_yemen_pipeline_t2: "Pipeline de la mer d’Oman (niveau II)"
 SAU_yemen_pipeline_t2_desc: "Le brut saoudien descend par Al Mahrah jusqu'à la mer d'Arabie, contournant le détroit d'Ormuz. §GRevenu supplémentaire : 2,50 Md $§! d'exportations par oléoduc, contre §RDépense supplémentaire : 1,15 Md $§! de droits de transit vers les pays traversés — un solde net de §G+1,35 Md $§! par semaine. Un sabotage fait chuter l'oléoduc d'un palier, réduisant les deux ; une ligne de palier 1 rompue ferme la route."
 SAU_yemen_pipeline_t3: "Pipeline de la mer d’Arabie (niveau III)"
 SAU_yemen_pipeline_t3_desc: "Le brut saoudien descend par Al Mahrah jusqu'à la mer d'Arabie, contournant le détroit d'Ormuz. §GRevenu supplémentaire : 3,00 Md $§! d'exportations par oléoduc, contre §RDépense supplémentaire : 1,25 Md $§! de droits de transit vers les pays traversés — un solde net de §G+1,75 Md $§! par semaine. Un sabotage fait chuter l'oléoduc d'un palier, réduisant les deux ; une ligne de palier 1 rompue ferme la route."
 SAU_baath_state: "Le Baas arabe"
 SAU_baath_state_tt: "§YUnité, liberté, socialisme.§!\n\nLe parti est l'avant-garde de la nation arabe, fusionnant officier et ouvrier, fellah et étudiant en une seule volonté révolutionnaire. Chaque frontière n'est qu'une étape sur la route d'une seule patrie arabe."
 SAU_communist_state: "L'État socialiste"
 SAU_communist_state_tt: "La dictature du prolétariat en Arabie. Ces gains ne tiennent que tant que le Parti communiste saoudien gouverne. S'il perd le pouvoir, ils s'évanouissent."
 SAU_Military_Rule: "Règne militaire"
 SAU_Monarchy_house_of_al_saud: "La maison d'Al Saoud"
 SAU_nda_state: "L'Assemblée démocratique nationale"
 SAU_nda_state_tt: "Les institutions de la république libérale s'approfondissent à chaque réforme gagnée aux urnes."
 SAU_nlf_doctrine: "Socialisme non aligné"
 SAU_nlf_doctrine_tt: "§YVoie arabe vers le socialisme (Front de libération nationale uniquement) :§!\n§G+15% de gain de pouvoir politique, +10% de soutien de guerre§!"
 SAU_peoples_council_works: "Travaux publics du Conseil"
 SAU_peoples_council_works_tt: "Commandé par §Yle Conseil du peuple§! et bâti selon sa norme"
 SAU_rep_shia_hardline_doctrine: "Théocratie révolutionnaire"
 SAU_rep_shia_hardline_doctrine_tt: "Hezbollah Al-Hejaz gouverne au nom du juriste, la nation mobilisée pour la résistance."
 SAU_rep_shia_moderate_doctrine: "Gouvernance réformiste"
 SAU_rep_shia_moderate_doctrine_tt: "Le Mouvement réformateur gouverne par la réconciliation, le social et les urnes."
 SAU_rep_shia_state: "La République chiite"
 SAU_rep_shia_state_tt: "Les institutions de la république chiite se renforcent à chaque réforme gagnée et à chaque victoire remportée."
 SAU_scp_doctrine: "Avant-garde marxiste-léniniste"
 SAU_scp_doctrine_tt: "§YMarxisme-léninisme orthodoxe (Parti communiste saoudien uniquement) :§!\n§G+10% d'efficacité des usines, +10% de vitesse de construction, +5% de stabilité§!"
 SAU_arab_consensus: "Consensus arabe contre la normalisation"
 SAU_arab_shield_bond: "Frères du Bouclier arabe"
 SAU_beijing_agreement: "L'accord de Pékin"
 SAU_betrayed_palestine: "Cause palestinienne abandonnée"
 SAU_boycott_israel: "Boycotter"
 SAU_cause_solidarity: "Solidarité avec la Palestine"
 SAU_egypt_economic_ties: "Soutien économique saoudien"
 SAU_egypt_military_ties: "Patronage militaire saoudien"
 SAU_egypt_partnership: "Partenariat saoudo-égyptien"
 SAU_exposed_iran: "Ingérence démasquée au Yémen"
 SAU_iraq_friendship: "L'amitié saoudo-irakienne"
 SAU_islamic_rivalry: "Rivalité islamique"
 SAU_islamic_rivalry_tt: "[PER.GetFlag]§RLa contestation du monde islamique commence.§!"
 SAU_israel_normalization: "Normalisation des relations"
 SAU_proxy_aggression: "Parrain du terrorisme"
 SAU_quincy_reaffirmed: "Accord de Quincy réaffirmé"
 SAU_recognition_anger: "État palestinien reconnu"
 SAU_recognized_palestine: "Palestine reconnue"
 SAU_taif_spirit: "Esprit de Taïf"
 SAU_talks_collapsed: "Échec des pourparlers de normalisation"
 SAU_two_state_champion: "Champion de la solution à deux États"
 HOU_break_ceasefire_category: "Le cessez-le-feu saoudien"
 HOU_drop_north_yemen_name: "Reprendre le nom du Yémen"
 HOU_drop_north_yemen_name_desc: "Mettre de côté l'identité du Yémen du Nord et gouverner de nouveau sous notre propre bannière."
 PER_houthi_militia: "Mobiliser les milices populaires"
 PER_houthi_militia_desc: "Mobiliser des partisans tribaux pour fournir au mouvement houthi une main-d'œuvre supplémentaire à bas coût."
 PER_houthi_old_weapons: "Faire passer des armes aux Houthis"
 PER_houthi_old_weapons_desc: "Faire remonter un chargement de vieux fusils par la mer Rouge et à travers la frontière jusqu'aux combattants houthis."
 PER_houthi_raise_brigade: "Durcir les défenses"
 PER_houthi_raise_brigade_desc: "Envoyer des ingénieurs de la Force Qods retrancher les Houthis dans les montagnes. Ils seront bien plus difficiles à déloger du terrain qu'ils tiennent."
 PER_houthi_support_category: "Soutenir les Houthis"
 SAU_abdullah_kaec_construction: "Construction accélérée du KAEC"
 SAU_abdullah_kaec_construction_desc: "Accélérer la construction de la Cité économique du roi Abdallah en levant les permis et en embauchant davantage d'entrepreneurs sur la côte de la mer Rouge."
 SAU_abdullah_kasp_scholarship: "Étendre la bourse KASP à l'étranger"
 SAU_abdullah_kasp_scholarship_desc: "Élargir les bourses d'État à l'étranger afin que davantage d'étudiants saoudiens étudient des matières où le Royaume manque de spécialistes formés. Leur formation renforcera la main-d'œuvre nationale à leur retour."
 SAU_abdullah_kaust_grants: "Financer des subventions de haute technologie KAUST"
 SAU_abdullah_kaust_grants_desc: "Accorder à la KAUST d'importantes subventions de recherche pour recruter des spécialistes de premier plan et établir des laboratoires avancés à Thuwal."
 SAU_abdullah_national_dialogue: "Convoquer des forums de dialogue national"
 SAU_abdullah_national_dialogue_desc: "Réunir oulémas, réformateurs, représentants chiites et femmes dans des forums de dialogue national. Les réunions donneront aux groupes exclus un canal formel pour faire entendre leurs préoccupations."
 SAU_abdullah_sang_subsidies: "Subventions de modernisation de la Garde nationale"
 SAU_abdullah_sang_subsidies_desc: "Subventionner de nouveaux contrats de véhicules pour la Garde nationale saoudienne, réduisant le coût de sa modernisation et renforçant sa loyauté envers le gouvernement."
 SAU_Among_Major_powers_Open_east: "Ouvrir les décisions de §Rcoopération avec l'Est§!"
 SAU_appoint_provincial_governor: "Nommer un gouverneur provincial"
 SAU_appoint_provincial_governor_desc: "Le gouvernorat est vacant. Sélectionnez une province sur la carte et le Conseil décidera qui la prend.\n\nChaque province ne peut être attribuée qu'une fois."
 SAU_arm_arab_revolutionaries: "Armer les révolutionnaires arabes"
 SAU_arm_arab_revolutionaries_desc: "Fournir fusils et organisateurs formés aux mouvements communistes opérant dans d'autres pays arabes."
 SAU_arm_lebanese_army: "Armer l'armée libanaise"
 SAU_arm_lebanese_army_desc: "Fournir à l'armée libanaise des armes et une formation saoudiennes afin qu'elle puisse opérer indépendamment du Hezbollah."
 SAU_back_mbn: "Retour Mohammed ben Nayef"
 SAU_back_mbn_desc: "Jeter votre poids derrière le ministre de l'Intérieur, architecte de l'État contre-terroriste du Royaume et favori de Washington. S'engager pour un candidat lie la cour à sa cause pour le reste de la succession."
 SAU_back_mbn_heir: "Retour Mohammed ben Nayef"
 SAU_back_mbn_heir_desc: "Soutenir le prince héritier Mohammed ben Nayef sur la base de son service au ministère de l'Intérieur, de son bilan contre-terroriste et de ses solides relations avec Washington."
 SAU_back_mbs_heir: "Retour Mohammed ben Salmane"
 SAU_back_mbs_heir_desc: "Soutenir Mohammed ben Salmane, le jeune fils du roi, tandis qu'il consolide son autorité sur un nombre croissant de ministères malgré son expérience limitée."
 SAU_back_mutaib: "Retour Mutaib bin Abdallah"
 SAU_back_mutaib_desc: "Jeter votre poids derrière le fils du roi Abdallah, commandant de la Garde nationale et héritier du suivi tribal de son père. S'engager pour un candidat lie la cour à sa cause pour le reste de la succession."
 SAU_back_salman: "Retour Salman ben Abdulaziz"
 SAU_back_salman_desc: "Jeter votre poids derrière le prince soudairite senior et gouverneur de longue date de Riyad. S'engager pour un candidat lie la cour à sa cause pour le reste de la succession."
 SAU_bahrain_restore_khalifa: "Restaurer la maison de Khalifa"
 SAU_bahrain_restore_khalifa_desc: "Traverser la chaussée pour restaurer la maison de Khalifa si elle perd le pouvoir à Bahreïn.\n\n§YDisponible lorsque§! Bahreïn n'est plus gouverné par la maison de Khalifa.\n\n§GRestaure la maison de Khalifa au pouvoir§!, retire Bahreïn de toute faction qui n'est pas la nôtre, et le place sous le §YBouclier de la péninsule§!.\n\n§R-15 milliards $, -2 % de stabilité§!, et les relations avec Téhéran en souffriront. §G+5 % de soutien à la guerre§!."
 SAU_bop_note: "§HComment l'avenir du Royaume bascule§!"
 SAU_bop_note_desc: "L'équilibre de l'§HAvenir du Royaume§! ne peut pas être modifié directement par une décision. Il évolue par les §Lfocuses achevés§! des branches Tadawul, SAGIA et autres, ainsi que par des §Lévénements clés§! et les §Lréformes§! du roi."
 SAU_break_houthi_ceasefire: "Rompre le cessez-le-feu"
 SAU_break_houthi_ceasefire_desc: "Déchirer la trêve avec les Houthis et relancer l'opération Tempête décisive."
 SAU_broadcast_revolution: "Diffuser la révolution"
 SAU_broadcast_revolution_desc: "Utiliser Radio Free Arabia pour promouvoir le soutien communiste parmi les ouvriers et autres groupes mécontents dans les pays arabes."
 SAU_coalition_member_arm_yemen: "Armer la République"
 SAU_coalition_member_arm_yemen_desc: "Des armes et des hommes envoyés au gouvernement reconnu en notre nom, pas celui de Riyad.\n\n§GLe Yémen reçoit 1 500 armes d'infanterie, 8 000 hommes et de l'expérience de l'armée§!. Répétable tous les 30 jours."
 SAU_coalition_member_category: "La coalition yéménite"
 SAU_coalition_member_leave: "Quitter la coalition"
 SAU_coalition_member_leave_desc: "Se retirer de la coalition menée par l'Arabie saoudite et cesser notre participation à sa campagne au Yémen.\n\n§RRiyad perd un partenaire de coalition et le prend personnellement§! ; §G+50 de pouvoir politique, +3 % de stabilité§!."
 SAU_coalition_member_strike: "Effectuer notre sortie"
 SAU_coalition_member_strike_desc: "Notre part de l'ordre de mission aérien, menée contre une province tenue par les Houthis.\n\n§REndommage infrastructures, industrie d'armement et défenses aériennes§! dans la province ciblée. Répétable tous les 21 jours."
 SAU_communist_invite_to_comintern: "Inviter [FROM.GetName] au Komintern arabe"
 SAU_communist_invite_to_comintern_desc: "Étendre une invitation à [FROM.GetName] à rejoindre le Komintern arabe. Un État ouvrier frère n'a pas besoin d'être libéré par la force ; ils peuvent accepter ou décliner."
 SAU_communist_seize_power: "Lancer la révolution socialiste en [FROM.GetName]"
 SAU_communist_seize_power_desc: "Là où les ouvriers tiennent les rues, frapper. Avec un soutien écrasant, l'ancien régime tombe ; là où le mouvement n'est que fort, le pays bascule dans une guerre civile révolutionnaire."
 SAU_council_national_service: "Les défilés du service national"
 SAU_council_national_service_desc: "Tenir un défilé militaire télévisé nationalement sur l'avenue du roi Fahd, le Conseil présent. La démonstration encouragera le soutien public aux forces armées et au nouveau gouvernement."
 SAU_council_officer_housing: "Le programme de logements des officiers"
 SAU_council_officer_housing_desc: "Construire cités, écoles et cliniques pour le corps des officiers. Cela améliorera le soutien militaire au Conseil, mais détourne les fonds publics d'autres besoins."
 SAU_council_officer_purge: "Purger le corps des officiers"
 SAU_council_officer_purge_desc: "Mettre à la retraite les officiers dont la loyauté était incertaine pendant la prise du pouvoir et en écarter d'autres identifiés par l'enquête suivante. L'armée sera plus petite mais plus fiable."
 SAU_council_public_accounts: "Publier les comptes publics"
 SAU_council_public_accounts_desc: "Publier les comptes des ministères pour démontrer l'engagement du Conseil à un gouvernement transparent. Cela améliore sa réputation d'honnêteté mais restreint les dépenses discrétionnaires jadis utilisées pour des arrangements informels."
 SAU_council_security_directorate: "Établir la Direction de la sécurité"
 SAU_council_security_directorate_desc: "Fusionner le Mabahith, les réseaux du ministère de l'Intérieur et le renseignement militaire sous une seule direction. Un reporting centralisé améliorera la capacité du Conseil à surveiller les menaces dans tout le Royaume."
 SAU_councils_category: "Les conseils du Royaume"
 SAU_councils_category_desc: "§HMajlis ash-Shura§! - [ROOT.GetSAUShuraBench]\n§OOulémas§! [?SAU_shura_ulema|0]   §YTechnocrates§! [?SAU_shura_technocrats|0]   §GNotables§! [?SAU_shura_notables|0]\n§HLe Conseil du peuple§! - [ROOT.GetSAUPCStanding], [ROOT.GetSAUPCBloc]\n§ORéformistes§! [?SAU_pc_reformists|0]   §YTraditionalistes§! [?SAU_pc_traditionalists|0]   §GProvinciaux§! [?SAU_pc_provincials|0]\n\nDeux chambres siègent désormais à Riyad et aucune ne peut contraindre le roi à quoi que ce soit.\n\n§HLe Majlis ash-Shura§! est nommé et conseille sur ce qu'on lui remet. Le banc qui détient le plus de sièges fixe son caractère, et ce caractère a un prix :\n§ODirigé par les oulémas§! §G+8 % de stabilité, +10 % de défense contre la dérive§!  / §R-5 % de recherche, -5 % de migration§!\n§YDirigé par les technocrates§! §G+8 % de recherche, +6 % de production des bureaux, +5 % de productivité§!  / §R-5 % de stabilité§!\n§GDirigé par les notables§! §G+8 % de pouvoir politique, -8 % de coût de la corruption§!  / §R+3 % de biens de consommation, -3 % de soutien à la guerre§!\n\n§YSi un banc dépasse 70 sièges, le roi peut charte le Conseil de façon permanente.§! Une charte double le caractère de ce banc, le fige dans la Loi fondamentale, et met fin au concours pour de bon — les comptes de sièges ne décident plus de rien. Refuser, et les trois bancs reviennent à 40, la chambre restant à vous à rééquilibrer.\n\n§HLe Conseil du peuple§! répond vers le bas. C'est le premier organe de l'histoire du Royaume qui parle pour les gouvernés plutôt qu'à eux, et il peut légiférer sur les affaires intérieures. Le roi conserve le veto, et §Rchaque usage coûte de la stabilité et du soutien à la guerre§!."
 SAU_crown_prince_category: "Prince héritier"
 SAU_cyber_defensive_op: "Cyberopération défensive"
 SAU_cyber_defensive_op_desc: "Durcir le Royaume et saboter les systèmes offensifs de la cible pendant §Y90 jours§!. Leurs forces combattent §Y10 % plus faibles à l'attaque§! contre nous, tandis que la GIP protège nos propres réseaux. Requiert un réseau à §G70 %§! sur la cible."
 SAU_cyber_offensive_op: "Cyberopération offensive"
 SAU_cyber_offensive_op_desc: "Transformer le réseau en arme. Une frappe cybernétique de la GIP de §Y90 jours§! paralyse le commandement et les défenses de la cible : leurs divisions combattent §Y10 % plus faibles en défense§! et leur industrie s'enraye. Requiert un réseau à §G70 %§! sur la cible."
 SAU_debug_bop_left: "§Y(DEBUG) Passage au traditionaliste§!"
 SAU_debug_bop_left_desc: "Outil de moddeur/débogage uniquement. Décale l'équilibre de l'§HAvenir du Royaume§! de §R-0,05 vers la gauche§! (vers le traditionalisme). Visible seulement si le jeu est lancé avec -debug."
 SAU_debug_bop_right: "§Y(DEBUG) Basculer vers la libéralisation§!"
 SAU_debug_bop_right_desc: "Outil de moddeur/débogage uniquement. Décale l'équilibre de l'§HAvenir du Royaume§! de §G+0,05 vers la droite§! (vers la libéralisation). Visible seulement si le jeu est lancé avec -debug."
 SAU_debug_category: "DEBUG - Succession saoudienne"
 SAU_debug_clear_decree_lock: "DEBUG : lever le verrou de décret de 60 jours"
 SAU_debug_clear_decree_lock_desc: "Efface SAU_royal_decree_active afin que les décisions du monarque régnant puissent être prises immédiatement, sans attendre les 60 jours."
 SAU_debug_drain_salman_health: "DEBUG : drainer la santé du roi Salman"
 SAU_debug_drain_salman_health_desc: "Met SAU_salman_health à 0. La chaîne d'avènement se déclenche au prochain tick mensuel, couronnant le prince héritier actuel."
 SAU_debug_faisalite_conviction_up: "(DEBUG) Condamnation Faisalite +25"
 SAU_debug_faisalite_conviction_up_desc: "Ajoute 25 de conviction et réévalue le palier. Répéter pour franchir 45 et 75."
 SAU_debug_faisalite_open: "(DEBUG) Ouvrir la chaîne faisalite"
 SAU_debug_faisalite_open_desc: "Déclenche l'événement du sommet de La Mecque qui commence la chaîne, sans attendre 140 jours."
 SAU_debug_faisalite_pivot: "(DEBUG) Déclencher le pivot irakien"
 SAU_debug_faisalite_pivot_desc: "Déclenche l'événement de pivot sur l'occupation américaine, quelle que soit la situation de guerre."
 SAU_debug_faisalite_readout: "(DEBUG) Faisalite : [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_faisalite_readout_desc: "§HConviction§! : §Y[?SAU_faisalite_conviction|0]§! sur §Y100§!\n§HConservatisme social par mois§! : §Y[?SAU_social_conservatism|0]§!\n§HNiveau§! : [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_grievance_open: "(DEBUG) Ouvrir la chaîne de coup d'État"
 SAU_debug_grievance_open_desc: "Pose le drapeau du krach pétrolier de 2008 et déclenche l'événement de grief des officiers qui commence la chaîne, sans attendre 2008."
 SAU_debug_grievance_readout: "(DEBUG) Officiers : [ROOT.GetSAUArmyGrievance]"
 SAU_debug_grievance_readout_desc: "§HGrief§! : §Y[?SAU_army_grievance|0]§! sur §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n§HGarde protégée§! (double le rythme mensuel) : vérifié par le drapeau SAU_sang_shielded."
 SAU_debug_grievance_up: "(DEBUG) Grief de l'officier +25"
 SAU_debug_grievance_up_desc: "Ajoute 25 de grief et réévalue le palier. Répéter pour franchir 50 (ordre de déployer) et 75 (le coup)."
 SAU_debug_junta_legitimacy_up: "(DEBUG) Légitimité de la junte +25"
 SAU_debug_junta_legitimacy_up_desc: "Augmente le standing du Conseil, pour vérifier que la crise s'achève au lieu d'expirer."
 SAU_debug_junta_legitimacy_zero: "(DEBUG) Légitimité de la junte à 0"
 SAU_debug_junta_legitimacy_zero_desc: "Ramène le Conseil à zéro afin que la crise de légitimité s'arme au prochain contrôle."
 SAU_debug_junta_open: "(DEBUG) Forcer le coup des officiers"
 SAU_debug_junta_open_desc: "Arme la chaîne de grief et déclenche immédiatement l'événement de prise du pouvoir."
 SAU_debug_king_abdullah: "DEBUG : le roi héritier Abdallah"
 SAU_debug_king_abdullah_desc: "Met SAU_current_king à 1, installe Abdallah comme dirigeant du pays et rouvre la course à la succession de l'ère Abdallah (Salmane 45 / MBN 30 / Moutaïb 25)."
 SAU_debug_king_mbn: "DÉBOGAGE : Couronne Mohammed bin Nayef"
 SAU_debug_king_mbn_desc: "Met SAU_current_king à 3 et installe Mohammed ben Nayef comme dirigeant du pays."
 SAU_debug_king_mbs: "DÉBOGAGE : Couronne Mohammed ben Salmane"
 SAU_debug_king_mbs_desc: "Met SAU_current_king à 5 et installe Mohammed ben Salmane comme dirigeant du pays."
 SAU_debug_king_mutaib: "DÉBOGAGE : Couronne Mutaib bin Abdallah"
 SAU_debug_king_mutaib_desc: "Met SAU_current_king à 4 et installe Moutaïb ben Abdallah comme dirigeant du pays."
 SAU_debug_king_salman: "DÉBOGAGE : le roi héritier Salmane"
 SAU_debug_king_salman_desc: "Met SAU_current_king à 2, installe Salmane comme dirigeant du pays, ramène sa santé à 100 et ouvre la course au prince héritier MBS contre MBN."
 SAU_debug_oil_dep_readout: "(DEBUG) Dépendance pétrolière : [?oil_dependence|0] (tick trimestriel [?SAU_oil_dep_quarter|0]/3)"
 SAU_debug_oil_dep_readout_desc: "Lit la valeur de dépendance et l'avancement dans le tick de trois mois."
 SAU_debug_pc_open: "(DEBUG) Créer le Conseil du peuple"
 SAU_debug_pc_open_desc: "Pose le drapeau et installe la chambre 40/40/40 à un standing de 50, sans le focus."
 SAU_debug_pc_readout: "(DEBUG) État du Conseil du peuple"
 SAU_debug_pc_readout_desc: "§HOuvert§! (SAU_peoples_council_open, défini par SAU_establish_the_peoples_council)\n§HRéputation§! : §Y[?SAU_pc_standing|0]§! - Les travaux publics exigent 60+\n§HSièges§! - réformateurs §Y[?SAU_pc_reformists|0]§!, traditionalistes §Y[?SAU_pc_traditionalists|0]§!, provinciaux §Y[?SAU_pc_provincials|0]§! - un banc exige 21+ pour prendre la parole\n§HVetos utilisés§! : §Y[?SAU_pc_vetoes|0]§!"
 SAU_debug_pc_reset_cycle: "(DEBUG) Effacer les drapeaux de session"
 SAU_debug_pc_reset_cycle_desc: "Efface SAU_pc_debate_ongoing et SAU_pc_doing_bill si une session se bloque."
 SAU_debug_pc_standing_up: "(DEBUG) Influence du Conseil +20"
 SAU_debug_pc_standing_up_desc: "Hausse le standing de 20 pour tester les travaux publics."
 SAU_debug_shura_dissolve: "(DEBUG) Dissoudre le Majlis ash-Shura"
 SAU_debug_shura_dissolve_desc: "Exécute SAU_shura_dissolve : efface le drapeau, met les bancs à zéro, retire l'esprit."
 SAU_debug_shura_open: "(DEBUG) Ouvrir le Majlis ash-Shura"
 SAU_debug_shura_open_desc: "Pose SAU_shura_open et installe le Conseil à 50/50/50, sans SAU_reorganization_of_the_majlis_ash_shura ni Miteb sur le trône."
 SAU_debug_shura_readout: "(DEBUG) Vérification de la porte Shura"
 SAU_debug_shura_readout_desc: "§HToutes les conditions dont la catégorie a besoin :§!\n§YConseil ouvert§! (SAU_shura_open, posé par SAU_reorganization_of_the_majlis_ash_shura)\n§YMaison d'Al Saoud au pouvoir§! : [?ruling_party|0] doit être 10\n§YPas de coup§! (SAU_military_coup_ready doit être clair)\n§YMonarchie intacte§! (SAU_monarchy_abolished doit être clair)\n\n§HSièges§! - oulémas [?SAU_shura_ulema|0], technocrates [?SAU_shura_technocrats|0], notables [?SAU_shura_notables|0]"
 SAU_debug_storm_complete_civil_war: "(DEBUG) Achever le focus Guerre civile yéménite"
 SAU_debug_storm_complete_civil_war_desc: "Force l'achèvement de SAU_the_yemeni_civil_war sans attendre le contrôle mensuel."
 SAU_debug_storm_open: "(DEBUG) Déclencher la réunion de Riyad"
 SAU_debug_storm_open_desc: "Déclenche directement l'événement 194, en sautant le focus et ses prérequis."
 SAU_debug_storm_readout: "(DEBUG) Coalition : [?SAU_coalition_partners|0]"
 SAU_debug_storm_readout_desc: "§HPartenaires de la coalition§! : §Y[?SAU_coalition_partners|0]§!\n§HTempête lancée§! : drapeau SAU_decisive_storm_launched\n§HFocus de guerre civile§! : SAU_the_yemeni_civil_war"
 SAU_debug_water_pride_down: "§Y(DEBUG) Force Water Pride -1 niveau§!"
 SAU_debug_water_pride_down_desc: "Outil de moddeur/débogage. Force l'esprit §HEaux souveraines§! d'un palier vers le bas, quelle que soit la stabilité. Visible seulement avec -debug."
 SAU_debug_water_pride_up: "§Y(DEBUG) Force Water Pride +1 niveau§!"
 SAU_debug_water_pride_up_desc: "Outil de moddeur/débogage. Force l'esprit §HEaux souveraines§! d'un palier vers le haut, quelle que soit la stabilité. Visible seulement avec -debug."
 SAU_div_arms: "Localiser la production d'armes"
 SAU_div_arms_desc: "Développer §HSAMI§! et l'industrie de défense nationale. Les armes made in Saudi réduisent la facture d'importations, emploient des ingénieurs et §Gélargissent la base industrielle§! au-delà du pétrole."
 SAU_div_digital: "Développer l'économie numérique"
 SAU_div_digital_desc: "Soutenir la §Hfintech, le e-commerce et les start-up§! pour créer des emplois qualifiés et une assiette fiscale hors pétrole plus large. Cela §Gréduit la dépendance au brut§! en élargissant les industries numériques privées."
 SAU_div_giga_project: "Financer un Giga-Projet"
 SAU_div_giga_project_desc: "Engager un financement majeur pour §HNEOM§! et sa ville prévue au nord-ouest. Le projet fournit une demande de construction substantielle et éloigne l'économie §Gdu pétrole§!, mais à un coût fiscal très élevé."
 SAU_div_pif_invest: "Investissement stratégique du PIF"
 SAU_div_pif_invest_desc: "Diriger le capital du §HFonds d'investissement public§! vers usines nationales, capacité de construction et emploi à Riyad. Cela fournit une réduction majeure de la §Gdépendance pétrolière§! à un coût considérable pour le Trésor."
 SAU_div_renewables: "Augmenter la capacité renouvelable"
 SAU_div_renewables_desc: "Déployer le §Hsolaire et l'éolien§! dans le Rub al-Khali. L'énergie propre libère du brut pour l'export et §Gassouplit la dépendance de l'économie au pétrole§!."
 SAU_div_tourism_event: "Accueillir un événement touristique mondial"
 SAU_div_tourism_event_desc: "Promouvoir stations, festivals, pèlerinage et tourisme international sur la §Hcôte de la mer Rouge§!. Les dépenses des visiteurs §Gdiversifient§! les revenus du Royaume au-delà du pétrole."
 SAU_domestic_external_category: "§HSAffaires intérieures et extérieures saoudiennes§!"
 SAU_east_belt_road: "Investissement des Nouvelles routes de la soie"
 SAU_east_belt_road_desc: "Accepter l'investissement chinois des Nouvelles routes de la soie dans les ports, chemins de fer et cités industrielles saoudiens. Les projets élargissent les infrastructures sans les conditions politiques habituellement attachées par les partenaires occidentaux."
 SAU_east_energy_markets: "Marchés énergétiques asiatiques"
 SAU_east_energy_markets_desc: "Élargir les exportations de pétrole vers la Chine et d'autres économies asiatiques. Une clientèle plus large améliore le levier saoudien et réduit la dépendance à la demande occidentale."
 SAU_east_trade: "Accord commercial avec l'Est"
 SAU_east_trade_desc: "Conclure des accords commerciaux échangeant les exportations énergétiques saoudiennes contre des biens manufacturés des économies asiatiques en croissance."
 SAU_faisalite_category: "La question faisalite"
 SAU_faisalite_endowments: "Financer les waqfs"
 SAU_faisalite_endowments_desc: "Fournir un financement supplémentaire aux fondations religieuses en déficit depuis la baisse des recettes pétrolières. Ces fonds non tracés assureront le soutien des oulémas qui influencent les prêches dans tout le Royaume."
 SAU_faisalite_guard_petition: "La Garde pétitionne"
 SAU_faisalite_guard_petition_desc: "Autoriser des officiers seniors de la Garde nationale à remettre une pétition publique à Moutaïb. La signer identifiera les officiers qui soutiennent sa prétention à la succession."
 SAU_faisalite_int_buy_satellite_channels: "Acheter les chaînes satellitaires arabes"
 SAU_faisalite_int_buy_satellite_channels_desc: "Acheter les principaux réseaux satellitaires arabes et nommer un personnel aligné sur Riyad. Cela élargit l'influence saoudienne sur les médias régionaux mais inquiète les oulémas."
 SAU_faisalite_int_endow_universities: "Doter les universités étrangères"
 SAU_faisalite_int_endow_universities_desc: "Financer des chaires permanentes d'études islamiques dans des universités étrangères, du Caire à Kuala Lumpur. Riyad fournira le financement et déterminera le programme approuvé."
 SAU_faisalite_int_hard_currency_loans: "Prêter en devise forte"
 SAU_faisalite_int_hard_currency_loans_desc: "Offrir des prêts libellés en dollars à des gouvernements qui ne peuvent obtenir ailleurs un financement abordable. Les conditions favorables accroîtront leur dépendance au soutien saoudien."
 SAU_faisalite_int_officers_abroad: "Détacher le corps des officiers à l'étranger"
 SAU_faisalite_int_officers_abroad_desc: "Affecter des officiers saoudiens comme conseillers et formateurs auprès des forces armées du monde musulman. Ces déploiements améliorent l'expérience militaire saoudienne et élargissent l'influence de Riyad."
 SAU_faisalite_int_pilgrimage_quotas: "Élargir les quotas de pèlerinage"
 SAU_faisalite_int_pilgrimage_quotas_desc: "Augmenter les quotas du Hajj malgré la pression supplémentaire sur les infrastructures de La Mecque. Davantage de pèlerins connaîtront l'administration saoudienne des lieux saints et rentreront avec des liens plus forts avec le Royaume."
 SAU_faisalite_iso_buy_foreign_firms: "Racheter les compagnies étrangères"
 SAU_faisalite_iso_buy_foreign_firms_desc: "Acheter les entreprises étrangères opérant dans le Royaume et transférer leurs actifs aux ministères d'État. Cela accroît le contrôle saoudien de l'économie mais laisse les nouveaux opérateurs sans l'expertise existante des firmes."
 SAU_faisalite_iso_cancel_visas: "Annuler les visas de travail étrangers"
 SAU_faisalite_iso_cancel_visas_desc: "Laisser expirer un million de permis de travail étrangers sans renouvellement. Cela accroît la part saoudienne de la main-d'œuvre mais retardera les projets qui reposent sur le travail étranger."
 SAU_faisalite_iso_close_foreign_schools: "Fermer les écoles étrangères"
 SAU_faisalite_iso_close_foreign_schools_desc: "Fermer les écoles internationales et transférer leurs élèves dans le système d'État. L'enseignement suivra un programme saoudien, mais les écoles ne sont pas préparées aux élèves supplémentaires."
 SAU_faisalite_iso_import_licences: "Rationner les licences d'importation"
 SAU_faisalite_iso_import_licences_desc: "Réduire le nombre de licences d'importation délivrées chaque trimestre. Les importations deviendront plus rares et plus chères, donnant aux producteurs nationaux davantage de place sur le marché."
 SAU_faisalite_iso_repatriate_reserves: "Rapatrier les réserves souveraines"
 SAU_faisalite_iso_repatriate_reserves_desc: "Sortir les réserves souveraines saoudiennes de New York et de Londres et les ramener dans le Royaume. Cela renforce le contrôle direct des actifs nationaux mais endommagera gravement les relations avec les partenaires financiers occidentaux."
 SAU_faisalite_score_interventionist: "§RInterventionniste§! §Y[?SAU_faisalite_interventionist|0]§!"
 SAU_faisalite_score_interventionist_desc: "L'interventionnisme use de sommets, de soutien financier et de conseillers militaires pour placer Riyad à la tête de l'Oumma. Deux directives interventionnistes peuvent courir à la fois, et chacune ne paie qu'une fois achevée ; gardez ce score au-dessus du score §Oisolationniste§! pour faire du pilier final §RLa doctrine de la troisième voie§!."
 SAU_faisalite_score_isolationist: "§OIsolationniste§! §Y[?SAU_faisalite_isolationist|0]§!"
 SAU_faisalite_score_isolationist_desc: "L'isolationnisme concentre la politique saoudienne sur ses frontières, sa religion et son pétrole, en évitant les engagements étrangers. Deux directives isolationnistes peuvent courir à la fois, et chacune ne paie qu'une fois achevée ; gardez ce score au-dessus du score §Rinterventionniste§! pour faire du pilier final §OSplendide isolement§!."
 SAU_faisalite_sermons: "Faire circuler les prêches"
 SAU_faisalite_sermons_desc: "Rééditer les discours enregistrés de Fayçal et distribuer les transcriptions dans les cercles de la Garde nationale. La campagne relancera sa doctrine politique, bien que le ministère en reconnaisse les implications pour le gouvernement actuel."
 SAU_Foregin_affairs_category: "§GAffaires étrangères saoudiennes§!"
 SAU_Foreign_affairs_unlocked: "§HAffaires étrangères débloquées§!"
 SAU_Foreign_affairs_unlocked_desc: "Le ministère des Affaires étrangères répond de nouveau au Royaume. Les décisions ci-dessous sont ouvertes."
 SAU_found_arab_comintern: "Fonder le Komintern arabe"
 SAU_found_arab_comintern_desc: "L'Arabie convoque les États communistes du monde arabe en un seul bloc révolutionnaire sous sa propre direction."
 SAU_fsa_foreign_fighters: "Ouvrir le pipeline de combattants étrangers"
 SAU_fsa_foreign_fighters_desc: "Autoriser les volontaires étrangers transitant par le Golfe à rejoindre l'Armée syrienne libre, accroissant sa main-d'œuvre disponible."
 SAU_fsa_send_cash: "Virer des fonds à l'Armée syrienne libre"
 SAU_fsa_send_cash_desc: "Établir un canal de financement clandestin pour les soldes, l'approvisionnement et l'organisation politique de l'Armée syrienne libre."
 SAU_fsa_smuggle_weapons: "Faire passer des armes aux rebelles"
 SAU_fsa_smuggle_weapons_desc: "Faire transiter des armes légères par la Jordanie pour renforcer l'Armée syrienne libre contre le gouvernement syrien."
 SAU_heir_mbn_maneuver: "Le prince héritier manœuvre"
 SAU_heir_mbn_maneuver_desc: "User de l'autorité du ministère de l'Intérieur de Mohammed ben Nayef, de ses archives de sécurité et de sa réputation contre-terroriste pour renforcer sa prétention à la succession."
 SAU_heir_mbs_maneuver: "Le jeune prince manœuvre"
 SAU_heir_mbs_maneuver_desc: "Transférer des portefeuilles supplémentaires à Mohammed ben Salmane et écarter les officiels qui s'opposent à sa prétention à la succession."
 SAU_heir_rally_support: "Rassembler le soutien à l'héritier"
 SAU_heir_rally_support_desc: "Rencontrer les princes seniors et briefer des rédacteurs influents pour bâtir le soutien à l'héritier choisi avant l'annonce formelle de la succession."
 SAU_heir_undermine_mbn: "Saper Mohammed ben Nayef"
 SAU_heir_undermine_mbn_desc: "Faire circuler des inquiétudes sur la santé de Mohammed ben Nayef, son endurance et sa relation étroite avec les États-Unis pour affaiblir son soutien à la cour."
 SAU_heir_undermine_mbs: "Saper Mohammed ben Salmane"
 SAU_heir_undermine_mbs_desc: "Souligner la conduite de Mohammed ben Salmane dans la guerre du Yémen, ses dépenses élevées et ses différends avec des princes seniors pour affaiblir son soutien à la cour."
 SAU_houthi_break_ceasefire: "Rompre le cessez-le-feu saoudien"
 SAU_houthi_break_ceasefire_desc: "Les canons du Royaume se sont tus, mais la guerre n'est pas gagnée. Déchirer le cessez-le-feu et relancer l'offensive contre les Saoudiens."
 SAU_if_cross_border_raid: "Raid transfrontalier"
 SAU_if_cross_border_raid_desc: "Lancer une incursion armée pour frapper dépôts et avant-postes militaires israéliens. L'option la plus audacieuse, et la plus susceptible de provoquer une riposte féroce."
 SAU_if_rocket_barrage: "Barrage de roquettes sur les villes israéliennes"
 SAU_if_rocket_barrage_desc: "Ordonner au Front de lancer des roquettes sur des villes israéliennes, perturbant l'économie et forçant la population dans les abris."
 SAU_if_suicide_bombing: "Déclenchez une campagne de bombardement"
 SAU_if_suicide_bombing_desc: "Diriger les cellules du Front pour commettre des attentats-suicides dans des villes israéliennes, réduisant le moral public et accroissant les coûts de sécurité israéliens."
 SAU_intel_counterintel_sweep: "Balayage de contre-espionnage"
 SAU_intel_counterintel_sweep_desc: "La GIP se tourne vers l'intérieur pour une saison — planques démantelées, chiffreurs rotés, et chaque officier traitant étranger dans le Royaume a une raison de se taire.\n\n§GRéprime la subversion étrangère et durcit nos chiffres pendant 90 jours§!, et laisse la communauté du renseignement satisfaite lorsqu'elle s'achève.\n\n§YRépétable§! — un balayage ne tient que tant que vous continuez de le lancer."
 SAU_intel_counterterror: "Direction de la lutte contre le terrorisme"
 SAU_intel_counterterror_desc: "Coordonner raids et opérations de renseignement contre al-Qaïda et les cellules djihadistes. La répression renforce la stabilité et rassemble la maison d'Al Saoud derrière la GIP, et frappe directement tout combattant étranger opérant dans le Royaume."
 SAU_intel_expand_gip: "Élargir la Présidence générale du renseignement"
 SAU_intel_expand_gip_desc: "Nouvelles stations, nouvelles couvertures, nouvelles promotions. La Présidence ne recrute pas un homme pour s'arrêter — elle bâtit un endroit où le mettre.\n\n§GAjoute de façon permanente un emplacement d'agent§!, afin que le Royaume puisse garder un autre officier sur le terrain pour de bon.\n\n§YRépétable jusqu'à 3 fois.§!"
 SAU_intel_foreign_stations: "Réseau de stations à l'étranger"
 SAU_intel_foreign_stations_desc: "Ouvrir des stations de la GIP à l'étranger pour reculer l'influence iranienne et étendre la portée saoudienne dans la région."
 SAU_intel_mabahith: "Renforcer le Mabahith"
 SAU_intel_mabahith_desc: "Élargir la surveillance et les opérations du Mabahith contre la dissidence intérieure. Un plus grand contrôle interne améliore la stabilité et le soutien de l'establishment religieux."
 SAU_intel_surveillance_tech: "Acquérir des technologies de surveillance avancées"
 SAU_intel_surveillance_tech_desc: "Plutôt que d'attendre les ingénieurs du Royaume, la GIP achète tout de go les systèmes de surveillance et d'analyse de données et les fait installer par des contractants étrangers.\n\n§GInstalle immédiatement les ordinateurs de l'agence§!, §Ysans la recherche ni le travail ministériel que l'agence exigerait normalement§!.\n\n§RVous payez le raccourci§! — plus cher que de le construire vous-même, et disponible une seule fois."
 SAU_Intelligence_category: "§GPrésidence générale du renseignement§!"
 SAU_islamic_rivalry_close: "Suspendre la campagne contre l'Iran"
 SAU_islamic_rivalry_close_desc: "Mettre discrètement la campagne en sommeil. Ferme les décisions de rivalité islamique jusqu'à réouverture."
 SAU_islamic_rivalry_open: "Ouvrir la campagne contre l'Iran"
 SAU_islamic_rivalry_open_desc: "Mettre l'appareil du Royaume au travail contre Téhéran. Ouvre les décisions de rivalité islamique."
 SAU_isr_talks_backchannel: "Ouvrir le canal discret"
 SAU_isr_talks_backchannel_desc: "User d'intermédiaires dans des pays tiers pour identifier des termes qu'Israël pourrait accepter avant que l'un ou l'autre gouvernement n'entame des négociations publiques."
 SAU_isr_talks_clock: "Conclure les pourparlers avec Israël"
 SAU_isr_talks_clock_desc: "Dès qu'Israël accepte de parler, la fenêtre est de 120 jours. Israël doit accepter l'Initiative de paix arabe et au moins une autre piste avant que la patience, la politique et les ennemis de la région ne la ferment."
 SAU_isr_talks_palestine: "Offrir l'Initiative de paix arabe"
 SAU_isr_talks_palestine_desc: "Mettre l'initiative de 2002 sur la table par écrit : normalisation complète avec le monde arabe en échange d'un État palestinien indépendant sur les lignes de 1967."
 SAU_isr_talks_sweeten: "Adoucir l'accord"
 SAU_isr_talks_sweeten_desc: "Offrir investissements, ciels ouverts et accès au marché du Golfe comme incitations économiques à un accord."
 SAU_isr_talks_us_mediation: "Faites venir Washington"
 SAU_isr_talks_us_mediation_desc: "Demander aux États-Unis de garantir les pourparlers et d'user de leur influence auprès d'Israël pour soutenir un accord."
 SAU_junta_address_the_nation: "S'adresser à la nation"
 SAU_junta_address_the_nation_desc: "Faire prononcer par un membre senior du Conseil une allocution télévisée expliquant le nouveau gouvernement et son programme. Le discours rassurera une partie du public que l'État reste sous un contrôle effectif."
 SAU_junta_category: "Le Conseil militaire suprême"
 SAU_junta_control_readout: "§HContrôle§! §W[?SAU_junta_control|0]§!"
 SAU_junta_control_readout_desc: "Le Contrôle mesure la capacité du Conseil à faire exécuter ses ordres par garnisons, checkpoints, archives de renseignement et personnel loyal. Il chute d'un point chaque mois, et les programmes temporaires du Conseil dépensent du Contrôle supplémentaire à leur lancement."
 SAU_junta_legitimacy_crisis: "Le Conseil doit répondre de lui-même"
 SAU_junta_legitimacy_crisis_desc: "Le Conseil a perdu sa légitimité restante, et le soutien des oulémas et des autorités provinciales commence à s'effondrer. Il a six mois pour s'entendre avec les officiers, répondre aux demandes tribales et ramener son standing à §H20§!.\n\n§RSi cent quatre-vingts jours passent sans atteindre ce seuil, le Royaume entrera en conflit ouvert.§!"
 SAU_junta_legitimacy_readout: "§HLégitimité§! §W[?SAU_junta_legitimacy|0]§!"
 SAU_junta_legitimacy_readout_desc: "La Légitimité mesure l'acceptation d'un Conseil qui n'a derrière lui ni élection, ni fatwa, ni succession légitime. Elle chute d'un point chaque mois, et atteindre zéro donne au Conseil 180 jours pour revenir à 20."
 SAU_junta_reinforce_garrisons: "Renforcer les garnisons"
 SAU_junta_reinforce_garrisons_desc: "Déployer des bataillons supplémentaires dans les capitales provinciales, doter pleinement les checkpoints et rétablir les communications militaires entre Riyad et les garnisons."
 SAU_junta_standing_readout: "§HStatut§! [ROOT.GetSAUJuntaStanding]"
 SAU_junta_standing_readout_desc: "[ROOT.GetSAUJuntaStandingEffect]"
 SAU_junta_tour_the_provinces: "Tourner dans les provinces"
 SAU_junta_tour_the_provinces_desc: "Envoyer des représentants du Conseil rencontrer les chefs locaux à Buraydah, Djeddah, Jazan et dans l'intérieur. Entendre les griefs et financer les demandes locales améliorera le soutien provincial."
 SAU_king_abdullah_category: "Roi Abdallah ben Abdulaziz"
 SAU_king_mbn_category: "Roi Mohammed ben Nayef"
 SAU_king_mbs_category: "Le roi Mohammed ben Salmane"
 SAU_king_mutaib_category: "Roi Mutaib bin Abdallah"
 SAU_king_salman_category: "Roi Salman ben Abdulaziz"
 SAU_mbn_border_surveillance: "Renforcer les grilles de surveillance des gardes-frontières"
 SAU_mbn_border_surveillance_desc: "Installer tours, clôtures à capteurs et caméras thermiques le long des frontières yéménite et irakienne pour améliorer la détection des passages non autorisés."
 SAU_mbn_mabahith_campaign: "Autoriser la campagne anti-subversion de Mabahith"
 SAU_mbn_mabahith_campaign_desc: "Autoriser la Direction générale des investigations à démanteler les réseaux subversifs soupçonnés dans tout le Royaume. La campagne détiendra aussi des personnes dont l'implication est incertaine."
 SAU_mbn_maneuver: "Les manœuvres de faction de Bin Nayef"
 SAU_mbn_maneuver_desc: "Les services de sécurité œuvrent à avancer la prétention de Mohammed ben Nayef, et peuvent retourner la cour contre votre propre candidat."
 SAU_mbn_rehabilitation_center: "Activer le centre de réhabilitation du prince Nayef"
 SAU_mbn_rehabilitation_center_desc: "Placer les détenus dans un programme de réhabilitation impliquant oulémas, psychologues et leurs familles. Le programme peut réduire la récidive, bien que certains participants reviendront à l'activité militante."
 SAU_mbn_special_security_forces: "Déployer les forces de sécurité spéciales du ministère de l'Intérieur"
 SAU_mbn_special_security_forces_desc: "Déployer les Forces de sécurité spéciales du ministère de l'Intérieur dans les grandes villes, donnant au ministre une force armée indépendante de l'armée régulière."
 SAU_mbn_western_intel_networks: "Activer les réseaux de renseignement conjoints occidentaux"
 SAU_mbn_western_intel_networks_desc: "Élargir la liaison de renseignement entre Riyad, la CIA et les services britanniques. L'Arabie saoudite partagera des informations sensibles en échange d'un meilleur accès au renseignement occidental."
 SAU_mbs_anticorruption_drive: "Exécuter la campagne anticorruption"
 SAU_mbs_anticorruption_drive_desc: "Détenir princes et chefs d'entreprise dans un hôtel de luxe et exiger des règlements financiers avec l'État. Cela ramène des fonds au Trésor et démontre le contrôle du prince héritier sur l'élite."
 SAU_mbs_aramco_liquidity: "Allocation de liquidités stratégiques d'Aramco"
 SAU_mbs_aramco_liquidity_desc: "Transférer une partie du capital disponible d'Aramco vers des programmes contrôlés par le prince héritier, limitant le rôle du conseil d'administration dans la décision."
 SAU_mbs_gami_localization: "Mobiliser la localisation de la défense GAMI"
 SAU_mbs_gami_localization_desc: "Exiger des contractants de défense étrangers de dépenser la moitié du financement d'approvisionnement dans le Royaume, ou perdre l'accès aux contrats saoudiens."
 SAU_mbs_pif_neom: "Allouer des fonds du PIF à NEOM et aux projets frontaliers"
 SAU_mbs_pif_neom_desc: "Allouer le capital du Fonds d'investissement public aux projets de ville linéaire, de port et de station de montagne de NEOM malgré leurs risques techniques et financiers élevés."
 SAU_mbs_vision2030_blitz: "Lancement de la campagne éclair Vision 2030"
 SAU_mbs_vision2030_blitz_desc: "Lancer une campagne coordonnée de publicité et de conférences pour bâtir le soutien public et institutionnel à Vision 2030."
 SAU_military_category: "§HModernisation des forces armées§!"
 SAU_militia_back_dflp: "Financer le Front démocratique"
 SAU_militia_back_dflp_desc: "Financer des factions palestiniennes laïques comme contrepoids aux mouvements rivaux et accroître l'influence saoudienne dans la politique palestinienne."
 SAU_militia_back_hamas: "Financer le Hamas"
 SAU_militia_back_hamas_desc: "Fournir au Hamas argent, armes et recrues en échange d'un alignement plus étroit avec Riyad plutôt qu'avec Téhéran."
 SAU_militia_islamic_front: "Forger un front islamique loyal et saoudien"
 SAU_militia_islamic_front_desc: "Créer et financer une nouvelle faction islamiste dont l'organisation et le commandement restent dépendants du soutien saoudien."
 SAU_mod_abrams_gunnery: "Programme de tir Abrams"
 SAU_mod_abrams_gunnery_desc: "Lancer le programme pour choisir comment cette partie des forces armées combat.\n\n§YS'ouvre avec :§! char de bataille M1A2 Abrams.\n§GOuvre un choix de trois doctrines§!, chacune avec une force et un inconvénient. Relancer plus tard pour §Ychanger§!. §H[Réforme palier I — achever les trois réformes du palier I pour débloquer le palier II.]§!"
 SAU_mod_apache_training: "Formation sur les navires de combat Apache"
 SAU_mod_apache_training_desc: "Lancer le programme pour choisir comment cette partie des forces armées combat.\n\n§YS'ouvre avec :§! aviation de l'armée et hélicoptères d'attaque Apache.\n§GOuvre un choix de trois doctrines§!, chacune avec une force et un inconvénient. Relancer plus tard pour §Ychanger§!. §H[Réforme palier II — achever les trois réformes du palier II pour débloquer le palier III.]§!"
 SAU_mod_artillery_livefire: "Exercice d'artillerie à tir réel"
 SAU_mod_artillery_livefire_desc: "Lancer le programme pour choisir comment cette partie des forces armées combat.\n\n§YS'ouvre avec :§! artillerie automotrice M109.\n§GOuvre un choix de trois doctrines§!, chacune avec une force et un inconvénient. Relancer plus tard pour §Ychanger§!. §H[Réforme palier II — achever les trois réformes du palier II pour débloquer le palier III.]§!"
 SAU_mod_awacs_battle: "Entraînement à la gestion de bataille AWACS"
 SAU_mod_awacs_battle_desc: "Lancer le programme pour choisir comment cette partie des forces armées combat.\n\n§YS'ouvre avec :§! AWACS E-3 Sentry.\n§GOuvre un choix de trois doctrines§!, chacune avec une force et un inconvénient. Relancer plus tard pour §Ychanger§!. §H[Réforme palier III — le lot final.]§!"
 SAU_mod_complete: "Étape III : Parvenir à une force entièrement moderne"
 SAU_mod_complete_desc: "§HPalier III sur III — une force pleinement moderne.§!\n\n§RReste verrouillé jusqu'à l'achèvement des trois réformes du palier II :§!\n §Y- Exercice d'artillerie à feu réel\n  - Entraînement des Apache\n  - Exercice de flotte combinée§!\n(choisir une doctrine dans chacune).\n\n§GCe qui se passe :§! les forces armées atteignent §GPleinement modernisées§! — un vrai contrepoids à l'Iran — et les réformes finales apparaissent : §Yforces spéciales, AWACS et frappe de précision§!. Se déclenche une fois."
 SAU_mod_construction: "Financer la construction industrielle"
 SAU_mod_construction_desc: "Financer de nouvelles usines et routes dans la province orientale pour élargir la capacité industrielle dans la principale région pétrolière."
 SAU_mod_devfund: "Doter le fonds de développement"
 SAU_mod_devfund_desc: "Doter le fonds national de développement pour ouvrir une nouvelle capacité de construction dans la province orientale."
 SAU_mod_fleet_exercise: "Exercice de flotte combiné"
 SAU_mod_fleet_exercise_desc: "Lancer le programme pour choisir comment cette partie des forces armées combat.\n\n§YS'ouvre avec :§! les Forces navales royales saoudiennes.\n§GOuvre un choix de trois doctrines§!, chacune avec une force et un inconvénient. Relancer plus tard pour §Ychanger§!. §H[Réforme palier II — achever les trois réformes du palier II pour débloquer le palier III.]§!"
 SAU_mod_gulf_lessons: "Manœuvres : leçons du Golfe"
 SAU_mod_gulf_lessons_desc: "Organiser un exercice majeur pour tester l'armée contre les dures leçons de 1991 — et décider sur quel modèle la reconstruire.\n\n§YS'ouvre avec :§! Leçons de la guerre du Golfe.\n§GOuvre un choix de quatre doctrines§! — américaine, CCG, OTAN ou nationale — chacune avec ses forces et un inconvénient. Relancer les manœuvres plus tard pour §Ychanger de doctrine§!."
 SAU_mod_modernize: "Palier II : moderniser les armes de combat"
 SAU_mod_modernize_desc: "§HPalier II sur III — rééquiper les armes de combat.§!\n\n§RReste verrouillé jusqu'à l'achèvement des trois réformes du palier I :§!\n §Y- Exercices de préparation de la Garde nationale\n  - Programme de tir Abrams\n  - Entraînement de combat aérien Red Flag§!\n(choisir une doctrine dans chacune).\n\n§GCe qui se passe :§! les forces armées passent de §YEn réforme§! à §YEn modernisation§!, et trois nouvelles réformes apparaissent — §Yartillerie, Apache et flotte combinée§!. Vous devez achever les trois avant que le §Ypalier III§! ne se débloque. Se déclenche une fois."
 SAU_mod_pgm_doctrine: "Cours de doctrine de frappe de précision"
 SAU_mod_pgm_doctrine_desc: "Lancer le programme pour choisir comment cette partie des forces armées combat.\n\n§YS'ouvre avec :§! munitions à guidage de précision.\n§GOuvre un choix de trois doctrines§!, chacune avec une force et un inconvénient. Relancer plus tard pour §Ychanger§!. §H[Réforme palier III — le lot final.]§!"
 SAU_mod_red_flag: "Entraînement au combat aérien avec drapeau rouge"
 SAU_mod_red_flag_desc: "Lancer le programme pour choisir comment cette partie des forces armées combat.\n\n§YS'ouvre avec :§! la Force aérienne royale saoudienne.\n§GOuvre un choix de trois doctrines§!, chacune avec une force et un inconvénient. Relancer plus tard pour §Ychanger§!. §H[Réforme palier I — achever les trois réformes du palier I pour débloquer le palier II.]§!"
 SAU_mod_reform: "Palier I : lancer le programme de réforme"
 SAU_mod_reform_desc: "§HPalier I sur III — la première phase de modernisation.§!\n\n§GPour le lancer :§! achever le focus §YL'état-major général§!, puis gagner les §YManœuvres : leçons du Golfe§! (choisir une doctrine de guerre du Golfe).\n\n§GCe qui se passe :§! les forces armées passent de §RNon modernisées§! à §YEn réforme§!, et trois nouvelles réformes apparaissent — §YGarde nationale, tir Abrams et Red Flag§!.\n\n§RImportant :§! vous devez ensuite achever §Rles trois§! de ces réformes avant que le §Ypalier II§! ne se débloque. Se déclenche une fois."
 SAU_mod_sang_drills: "Exercices de préparation de la Garde nationale"
 SAU_mod_sang_drills_desc: "Lancer le programme pour choisir comment cette partie des forces armées combat.\n\n§YS'ouvre avec :§! Garde nationale saoudienne.\n§GOuvre un choix de trois doctrines§!, chacune avec une force et un inconvénient. Relancer plus tard pour §Ychanger§!. §H[Réforme palier I — achever les trois réformes du palier I pour débloquer le palier II.]§!"
 SAU_mod_sf_selection: "Cours de sélection des forces spéciales"
 SAU_mod_sf_selection_desc: "Lancer le programme pour choisir comment cette partie des forces armées combat.\n\n§YS'ouvre avec :§! commandement des forces spéciales.\n§GOuvre un choix de trois doctrines§!, chacune avec une force et un inconvénient. Relancer plus tard pour §Ychanger§!. §H[Réforme palier III — le lot final.]§!"
 SAU_mod_workforce: "Former la main-d'œuvre nationale"
 SAU_mod_workforce_desc: "Des programmes professionnels placent davantage de Saoudiens dans un travail qualifié, raffermissant la société et le moral national."
 SAU_mutaib_capital_garrison: "Fortifier le réseau de garnison de la capitale"
 SAU_mutaib_capital_garrison_desc: "Établir checkpoints de la Garde nationale, positions blindées et communications indépendantes autour de Riyad. Cela protège la capitale tout en renforçant le contrôle de la Garde sur elle."
 SAU_mutaib_janadriyah_festival: "Organiser le festival du patrimoine national de Janadriyah"
 SAU_mutaib_janadriyah_festival_desc: "Faire organiser par la Garde nationale le festival de Janadriyah avec courses de chameaux, danse de l'épée, poésie et cérémonies tribales télévisées. L'événement renforce les liens de Moutaïb avec les chefs tribaux."
 SAU_mutaib_maneuver: "Manœuvres de faction de Mutaib"
 SAU_mutaib_maneuver_desc: "La Garde nationale œuvre à avancer la prétention de Moutaïb, et peut retourner la cour contre votre propre candidat."
 SAU_mutaib_sang_logistics: "Gestion Logistique Autonome SANG"
 SAU_mutaib_sang_logistics_desc: "Créer un système d'approvisionnement indépendant de la Garde nationale au lieu de s'appuyer sur les dépôts de l'armée régulière. L'autonomie logistique accroît l'indépendance opérationnelle et politique de la Garde."
 SAU_mutaib_sang_procurement: "Approvisionnement accéléré en matière d'aviation et de blindés SANG"
 SAU_mutaib_sang_procurement_desc: "Prioriser hélicoptères Apache et véhicules blindés pour la Garde nationale avant les commandes de l'armée régulière, y compris une composante d'aviation distincte de la Garde."
 SAU_mutaib_tribal_reserves: "Mobiliser les réserves tribales SANG"
 SAU_mutaib_tribal_reserves_desc: "Appeler les cheikhs tribaux à fournir du personnel de réserve rémunéré à la Garde nationale selon le système de levée établi."
 SAU_officer_crisis_category: "Le grief des officiers"
 SAU_officer_grievance_readout: "Le corps des officiers : [ROOT.GetSAUArmyGrievance]"
 SAU_officer_grievance_readout_desc: "§HGrief§! : §Y[?SAU_army_grievance|0]§! sur §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n\nCette entrée affiche le niveau de grief actuel et n'a aucun effet de décision."
 SAU_officers_pay_arrears: "Payer les arriérés"
 SAU_officers_pay_arrears_desc: "Verser onze mois d'indemnités, de suppléments de logement et de salaires différés en un seul transfert rétroactif. Cela apporte un soulagement temporaire sans résoudre la cause du grief des officiers.\n\n§G-20 de grief§!, §R-12 milliards $§!, répétable tous les 60 jours."
 SAU_officers_promote_colonels: "Promouvoir les colonels"
 SAU_officers_promote_colonels_desc: "Donner des commandements de brigade à des officiers de carrière expérimentés au lieu de les réserver aux princes. Le changement améliorera la confiance du corps dans la promotion au mérite.\n\n§G-15 de grief§!, §G+2 % de stabilité§!, répétable tous les 90 jours."
 SAU_officers_restore_defence_budget: "Restaurer le budget de la défense"
 SAU_officers_restore_defence_budget_desc: "Restaurer le financement coupé aux forces régulières et transférer le coût au budget de la Garde nationale. Cela s'attaque à la cause principale du grief des officiers.\n\n§G-25 de grief§!, §R-25 milliards $§!, et la Garde cesse d'être protégée de sorte que le grief monte à moitié rythme ; cela ne peut se faire qu'une fois."
 SAU_officers_settle_for_good: "S'entendre avec les officiers"
 SAU_officers_settle_for_good_desc: "Établir une commission choisie par les officiers, publier un calendrier de promotions, et faire endosser personnellement l'accord par le roi. Cela ne peut s'achever qu'après que tout grief en souffrance a été levé.\n\n§GMet fin à la crise de façon permanente et empêche un coup d'État§! ; requiert un grief à §Y0§!."
 SAU_oil_conserve: "Conserver les réserves"
 SAU_oil_conserve_desc: "Réduire la production pour préserver les réserves pour un usage futur. Cela sacrifie les recettes actuelles mais §Gréduit la dépendance de l'économie au pétrole§! et améliore la stabilité."
 SAU_oil_embargo: "Proclamer un embargo pétrolier"
 SAU_oil_embargo_desc: "Répéter la politique de §H1973§! en cessant les exportations de pétrole vers §Rl'Occident et les amis d'Israël§!, spécifiquement les §LÉtats-Unis, la Grande-Bretagne, la France, l'Allemagne et les Pays-Bas§!. Leurs économies souffriront du choc d'approvisionnement, tandis que l'Arabie saoudite gagne du soutien dans les pays arabes et musulmans.\n\nLe Royaume perd les recettes d'export vers l'Occident et endommage les relations avec Washington, mais gagne §Hprestige, unité et la bénédiction du clergé§!."
 SAU_oil_increase_output: "Augmenter la production pétrolière"
 SAU_oil_increase_output_desc: "Augmenter la production de brut dans la province orientale pour §Gplus de pétrole et des recettes immédiates§!. Cela rend aussi l'économie §Rplus dépendante§! des exportations de pétrole."
 SAU_oil_new_field: "Développer un nouveau champ pétrolifère"
 SAU_oil_new_field_desc: "Financer l'exploration et de nouveaux puits dans le Rub al-Khali. Le projet ajoute un important §Ggisement de pétrole§! mais accroît la dépendance du Royaume au pétrole."
 SAU_oil_new_field_tt: "§GUn nouveau gisement est prouvé§! — §Y+15 pétrole§! apparaît dans une des provinces du Royaume, au coût de §R150 milliards $§!"
 SAU_opec_cut_production: "Réduire la production de pétrole"
 SAU_opec_cut_production_desc: "User du rôle de l'Arabie saoudite comme producteur d'appoint de l'OPEP pour réduire la production et §Gfaire monter le prix mondial du pétrole§!, accroissant les recettes par baril. Utilisable tous les 180 jours."
 SAU_opec_flood_market: "Inonder le marché pétrolier"
 SAU_opec_flood_market_desc: "Augmenter la production assez pour §Rbaisser le prix mondial du pétrole§!. L'Arabie saoudite perd des recettes à court terme, mais les exportateurs concurrents (§LRussie, Iran, Irak, Venezuela§!) subissent des pertes économiques plus importantes. Utilisable une fois par an."
 SAU_operation_decisive_storm: "Opération Tempête Décisive (Amaliyat Asifat al-Hazm)"
 SAU_operation_decisive_storm_desc: "Lancer §YAmaliyat Asifat al-Hazm§!, la campagne aérienne de coalition contre le territoire houthi au Yémen. Les appareils saoudiens frapperont les positions houthis, protégeront les forces gouvernementales et débloqueront un soutien continu à l'armée yéménite."
 SAU_pal_aid_package: "Programme d'aide palestinien"
 SAU_pal_aid_package_desc: "Fournir un financement saoudien trimestriel pour les soldes de l'Autorité palestinienne, hôpitaux, services publics et reconstruction à Ramallah."
 SAU_pal_fund_development: "Financer le développement palestinien"
 SAU_pal_fund_development_desc: "Financer routes, écoles et cliniques dans les territoires palestiniens pour améliorer les conditions de vie et soutenir un règlement viable à deux États."
 SAU_pal_invest_gaza: "Investir à Gaza et en Cisjordanie"
 SAU_pal_invest_gaza_desc: "Investir dans des usines et des infrastructures à Gaza et en Cisjordanie pour créer des emplois et réduire le soutien aux groupes militants."
 SAU_pc_convene: "Convoquer le Conseil du peuple"
 SAU_pc_convene_desc: "Convoquer la chambre et donner à tout bloc ayant assez de sièges trois semaines pour déposer un projet. Une fois un projet déposé, le roi doit le ratifier ou le vetoter ; la ratification renforce le bloc sponsor, un veto l'affaiblit.\n\nRépétable tous les 90 jours."
 SAU_pc_convene_tt: "Ouvre la séance — un bloc de §Y21 sièges ou plus§! peut déposer un projet dans §Y21 jours§!"
 SAU_pc_dissolve: "Dissoudre le Conseil du peuple"
 SAU_pc_dissolve_desc: "Dissoudre le Conseil du peuple par décret royal, sans date de retour.\n\n§R-10 % de stabilité, -8 % de soutien à la guerre§!, §G+150 de pouvoir politique§!. Irrévocable."
 SAU_pc_enact_provincial: "Promulguer le projet des provinciaux"
 SAU_pc_enact_provincial_desc: "Mettre en œuvre les quotas d'embauche saoudiens ratifiés, la réforme du parrainage et l'inspection indépendante malgré l'opposition des grands intérêts marchands.\n\nLe §Hstanding§! mesure l'autorité publique du Conseil du peuple ; il §Gmonte§! lorsqu'un projet est entendu et promulgué et §Rchute§! après un veto, une négligence ou un projet expiré. En dessous de §Y40§!, le Conseil ne peut pas faire passer un projet dans les ministères."
 SAU_pc_enact_provincial_tt: "Requiert §Y300 de pouvoir politique§!, et le Conseil doit encore soutenir le projet — son §Hstanding§! au-dessus de §Y40§! (actuellement §Y[?SAU_pc_standing|0]§! sur §Y100§!)"
 SAU_pc_enact_reformist: "Promulguer le projet des réformistes"
 SAU_pc_enact_reformist_desc: "Mettre en œuvre le projet réformiste ratifié en chargeant les ministères de préparer ses règlements, calendriers et budget.\n\nLe §Hstanding§! mesure l'autorité publique du Conseil du peuple ; il §Gmonte§! lorsqu'un projet est entendu et promulgué et §Rchute§! après un veto, une négligence ou un projet expiré. En dessous de §Y40§!, le Conseil ne peut pas faire passer un projet dans les ministères."
 SAU_pc_enact_reformist_tt: "Requiert §Y300 de pouvoir politique§!, et le Conseil doit encore soutenir le projet — son §Hstanding§! au-dessus de §Y40§! (actuellement §Y[?SAU_pc_standing|0]§! sur §Y100§!)"
 SAU_pc_enact_traditionalist: "Promulguer le projet des traditionalistes"
 SAU_pc_enact_traditionalist_desc: "Mettre en œuvre le programme ratifié de waqfs, d'allocations de logement et de cliniques provinciales par les ministères responsables.\n\nLe §Hstanding§! mesure l'autorité publique du Conseil du peuple ; il §Gmonte§! lorsqu'un projet est entendu et promulgué et §Rchute§! après un veto, une négligence ou un projet expiré. En dessous de §Y40§!, le Conseil ne peut pas faire passer un projet dans les ministères."
 SAU_pc_enact_traditionalist_tt: "Requiert §Y300 de pouvoir politique§!, et le Conseil doit encore soutenir le projet — son §Hstanding§! au-dessus de §Y40§! (actuellement §Y[?SAU_pc_standing|0]§! sur §Y100§!)"
 SAU_pc_public_works: "Commander des travaux publics"
 SAU_pc_public_works_desc: "Le Conseil choisit une province et fixe une norme de §Y[?SAU_pc_req_civ|0]§! usines civiles, §Y[?SAU_pc_req_off|0]§! bureaux et §Y[?SAU_pc_req_inf|0]§! d'infrastructure que le gouvernement doit atteindre sans construction gratuite ; la norme augmente après chaque mandat réussi. §HDeux ans pour s'y conformer§! : le succès donne à la province de façon permanente §G+1 emplacement de construction, +10 % de vitesse de construction et +5 % de main-d'œuvre§!, tandis que l'échec §Rabandonne les travaux et retire une usine civile§!. §YRequiert§! un standing du Conseil de §G60 ou mieux§! ; coût : §R-4 milliards $§!."
 SAU_pc_readout: "Conseil du peuple : [ROOT.GetSAUPCBloc]"
 SAU_pc_readout_desc: "§HLe Conseil du peuple§! - [ROOT.GetSAUPCBloc], [ROOT.GetSAUPCStanding] (§Y[?SAU_pc_standing|0]§! sur §Y100§!)\n§YRéformistes§! : [?SAU_pc_reformists|0]  §YTraditionalistes§! : [?SAU_pc_traditionalists|0]  §YProvinciaux§! : [?SAU_pc_provincials|0]\n§HVetos royaux utilisés§! : §Y[?SAU_pc_vetoes|0]§!\n\nLe §Hstanding§! mesure l'autorité publique ; il §Gmonte§! lorsqu'un projet est entendu et promulgué, §Rchute§! après un veto, une négligence ou un projet expiré, et doit rester à §Y40+§! pour faire passer un projet dans les ministères ou §Y60+§! pour commander des travaux publics. Cette entrée est informative et n'a aucun effet de décision."
 SAU_pc_session_clock: "Le Conseil attend une réponse"
 SAU_pc_session_clock_desc: "Le Conseil s'est réuni, et un bloc qualifié a trois semaines pour déposer un projet avant que la session n'expire sans réponse."
 SAU_pc_take_provincial_bill: "Entendre les provinciaux"
 SAU_pc_take_provincial_bill_desc: "Autoriser le bloc provincial à déposer un projet établissant des quotas d'embauche saoudiens, réformant le système de parrainage et créant une inspection du travail indépendante."
 SAU_pc_take_reformist_bill: "Entendre les réformistes"
 SAU_pc_take_reformist_bill_desc: "Autoriser le bloc réformiste de jeunes juristes et de diplômés de retour à déposer un projet centré sur la performance du gouvernement et la réforme institutionnelle."
 SAU_pc_take_traditionalist_bill: "Entendre les traditionalistes"
 SAU_pc_take_traditionalist_bill_desc: "Autoriser le bloc traditionaliste à déposer un projet finançant waqfs, allocations de logement et cliniques dans les provinces mal desservies."
 SAU_pc_works_mandate: "Mandat du Conseil : [SAU_pc_works_province.GetName]"
 SAU_pc_works_mandate_desc: "Le Conseil a choisi [SAU_pc_works_province.GetName], et le gouvernement a deux ans pour atteindre sa norme de développement publiée. Aucune construction n'est fournie automatiquement.\n\nLa norme requise est de §Y[?SAU_pc_req_civ|0]§! usines civiles, §Y[?SAU_pc_req_off|0]§! bureaux et §Y[?SAU_pc_req_inf|0]§! d'infrastructure dans la province."
 SAU_pipeline_iraq: "L'oléoduc vers l'Europe"
 SAU_pipeline_iraq_desc: "Après le départ de Saddam, construire le segment irakien d'un oléoduc vers la frontière turque. Un accord séparé avec Ankara sera nécessaire avant que le pétrole saoudien n'atteigne l'Europe."
 SAU_pipeline_iraq_talks: "Ouvrir des pourparlers avec Bagdad"
 SAU_pipeline_iraq_talks_desc: "Demander au gouvernement de Saddam d'autoriser un oléoduc saoudien à travers l'Irak malgré son hostilité envers la maison d'Al Saoud. Bagdad a peu de chances d'accepter."
 SAU_pipeline_sabotage_category: "Sabotage des pipelines saoudiens"
 SAU_pipeline_syria_assad: "Négocier l'oléoduc du Levant"
 SAU_pipeline_syria_assad_desc: "Assurer le transit par la Jordanie, puis négocier avec le gouvernement Assad hostile un oléoduc à travers la Syrie jusqu'à la Méditerranée. Damas exigera d'importants droits de transit et des concessions politiques en retour."
 SAU_pipeline_syria_fsa: "L'oléoduc du Levant (Syrie libre)"
 SAU_pipeline_syria_fsa_desc: "Assurer le transit par la Jordanie, puis offrir à un gouvernement syrien ami un investissement saoudien en échange d'une route d'oléoduc vers la Méditerranée."
 SAU_pipeline_turkey_extend: "Prolonger l'oléoduc jusqu'en Turquie"
 SAU_pipeline_turkey_extend_desc: "Négocier avec Ankara pour prolonger l'oléoduc irakien en Turquie et relier le pétrole saoudien directement aux marchés européens."
 SAU_pipeline_yemen: "L'oléoduc de la mer d'Arabie"
 SAU_pipeline_yemen_desc: "Construire un oléoduc à travers le Yémen du Sud ami et Al Mahrah jusqu'à la mer d'Arabie. La ligne reste vulnérable aux perturbations tant que la guerre yéménite continue."
 SAU_proj_alula: "Construire AlUla"
 SAU_proj_alula_desc: "Le développement des tombeaux nabatéens anciens et de l'oasis d'AlUla en destination culturelle et patrimoniale phare. §Y(Coût : 50 milliards $, construction ~450 jours)§! §RÉchéance : [?SAU_remain_alula|0] jours restants.§! §HImmobilise 5 usines civiles pendant la construction.§!"
 SAU_proj_amaala: "Construire Amaala"
 SAU_proj_amaala_desc: "Une enclave de bien-être et de tourisme ultra-luxe sur la côte nord-ouest de la mer Rouge, la « Riviera du Moyen-Orient ». §Y(Coût : 50 milliards $, construction ~450 jours)§! §RÉchéance : [?SAU_remain_amaala|0] jours restants.§! §HImmobilise 5 usines civiles pendant la construction.§!"
 SAU_proj_diriyah: "Construire Diriyah"
 SAU_proj_diriyah_desc: "La restauration du berceau du Royaume en quartier patrimonial et culturel autour de la cité de terre d'At-Turaif. §Y(Coût : 50 milliards $, construction ~450 jours)§! §RÉchéance : [?SAU_remain_diriyah|0] jours restants.§! §HImmobilise 5 usines civiles pendant la construction.§!"
 SAU_proj_green_riyadh: "Construire Riyad verte"
 SAU_proj_green_riyadh_desc: "Un programme pour planter des millions d'arbres dans la capitale, rafraîchissant la ville et adoucissant le désert. §Y(Coût : 30 milliards $, construction ~365 jours)§! §RÉchéance : [?SAU_remain_green_riyadh|0] jours restants.§! §HImmobilise 4 usines civiles pendant la construction.§!"
 SAU_proj_jeddah_central: "Construire le centre de Djeddah"
 SAU_proj_jeddah_central_desc: "Le réaménagement du front de mer de Djeddah en centre-ville moderne, avec stade, marina et quartier culturel. §Y(Coût : 60 milliards $, construction ~450 jours)§! §RÉchéance : [?SAU_remain_jeddah_central|0] jours restants.§! §HImmobilise 6 usines civiles pendant la construction.§!"
 SAU_proj_king_salman_park: "Construire le parc du roi Salman"
 SAU_proj_king_salman_park_desc: "Développer l'un des plus grands parcs urbains du monde à Riyad. §Y(Coût : 40 milliards $, construction ~270 jours)§! §RÉchéance : [?SAU_remain_king_salman_park|0] jours restants.§! §HImmobilise 4 usines civiles pendant la construction.§!"
 SAU_proj_neom: "Construire NEOM"
 SAU_proj_neom_desc: "Développer NEOM comme région urbaine et industrielle post-pétrole phare du Royaume sur la côte de la mer Rouge. §Y(Coût : 150 milliards $, construction ~730 jours)§! §RÉchéance : [?SAU_remain_neom|0] jours restants.§! §HImmobilise 10 usines civiles pendant la construction.§!"
 SAU_proj_new_murabba: "Construire un nouveau Murabba"
 SAU_proj_new_murabba_desc: "Un nouveau centre-ville pour Riyad bâti autour du Mukaab, une tour cubique assez vaste pour contenir vingt Empire State Buildings. §Y(Coût : 100 milliards $, construction ~730 jours)§! §RÉchéance : [?SAU_remain_new_murabba|0] jours restants.§! §HImmobilise 10 usines civiles pendant la construction.§!"
 SAU_proj_oxagon: "Construire Oxagone"
 SAU_proj_oxagon_desc: "Construire un port flottant et un pôle manufacturier à NEOM organisé autour de l'industrie à énergie propre. §Y(Coût : 80 milliards $, construction ~540 jours)§! §RÉchéance : [?SAU_remain_oxagon|0] jours restants.§! §HImmobilise 8 usines civiles pendant la construction.§!"
 SAU_proj_qiddiya: "Construire la Qiddiya"
 SAU_proj_qiddiya_desc: "Une mégacité de divertissement, sport et culture hors de Riyad, avec parcs à thème, stades et circuit de sports mécaniques. §Y(Coût : 80 milliards $, construction ~540 jours)§! §RÉchéance : [?SAU_remain_qiddiya|0] jours restants.§! §HImmobilise 8 usines civiles pendant la construction.§!"
 SAU_proj_red_sea: "Construire le projet mer Rouge"
 SAU_proj_red_sea_desc: "Une destination touristique ultra-luxe sur des dizaines d'îles intactes, construite selon une norme environnementale stricte. §Y(Coût : 80 milliards $, construction ~540 jours)§! §RÉchéance : [?SAU_remain_red_sea|0] jours restants.§! §HImmobilise 7 usines civiles pendant la construction.§!"
 SAU_proj_roshn: "Construire ROSHN"
 SAU_proj_roshn_desc: "Le promoteur national du logement construisant des communautés intégrées entières pour loger des millions de Saoudiens dans des foyers modernes. §Y(Coût : 60 milliards $, construction ~365 jours)§! §RÉchéance : [?SAU_remain_roshn|0] jours restants.§! §HImmobilise 7 usines civiles pendant la construction.§!"
 SAU_proj_sindalah: "Construire Sindalah"
 SAU_proj_sindalah_desc: "Développer Sindalah comme destination insulaire de luxe de NEOM en mer Rouge et son premier projet ouvert aux visiteurs. §Y(Coût : 40 milliards $, construction ~270 jours)§! §RÉchéance : [?SAU_remain_sindalah|0] jours restants.§! §HImmobilise 4 usines civiles pendant la construction.§!"
 SAU_proj_soudah_peaks: "Construire les pics de Soudah"
 SAU_proj_soudah_peaks_desc: "Développer une destination de tourisme de montagne sur les hauts sommets de l'Asir, en usant du climat plus frais et du paysage vert de la région. §Y(Coût : 40 milliards $, construction ~450 jours)§! §RÉchéance : [?SAU_remain_soudah_peaks|0] jours restants.§! §HImmobilise 5 usines civiles pendant la construction.§!"
 SAU_proj_sports_blvd: "Construire un boulevard des sports"
 SAU_proj_sports_blvd_desc: "Un corridor récréatif de 135 kilomètres à travers Riyad pour le cyclisme, la course et l'équitation. §Y(Coût : 30 milliards $, construction ~270 jours)§! §RÉchéance : [?SAU_remain_sports_blvd|0] jours restants.§! §HImmobilise 4 usines civiles pendant la construction.§!"
 SAU_proj_the_line: "Construire LA LIGNE"
 SAU_proj_the_line_desc: "Construire THE LINE comme ville linéaire sans voiture de 170 kilomètres entre deux structures miroir de 500 mètres. §Y(Coût : 200 milliards $, construction ~900 jours)§! §RÉchéance : [?SAU_remain_the_line|0] jours restants.§! §HImmobilise 12 usines civiles pendant la construction.§!"
 SAU_proj_trojena: "Construire Trojena"
 SAU_proj_trojena_desc: "Une station de montagne toute l'année dans les hauts de NEOM, avec ski en extérieur dans le désert d'Arabie. §Y(Coût : 60 milliards $, construction ~450 jours)§! §RÉchéance : [?SAU_remain_trojena|0] jours restants.§! §HImmobilise 5 usines civiles pendant la construction.§!"
 SAU_rally_support: "Rassembler le soutien à notre candidat"
 SAU_rally_support_desc: "Mobiliser le patronage de la famille royale, de l'establishment religieux et de la presse derrière votre prince. Le gain peut être mince, solide, ou une percée majeure."
 SAU_repair_pipeline_iraq: "Élargir l'oléoduc vers l'Europe"
 SAU_repair_pipeline_iraq_desc: "Faire monter d'un palier la ligne de tronc nord — restaurer ce que le sabotage a pris, ou poser la capacité de pompage supplémentaire pour porter plus de brut vers la Turquie."
 SAU_repair_pipeline_syria: "Élargir l'oléoduc du Levant"
 SAU_repair_pipeline_syria_desc: "Faire monter d'un palier la ligne méditerranéenne — restaurer ce que le sabotage a pris, ou élargir le corridor par Amman et Damas."
 SAU_repair_pipeline_yemen: "Élargir l'oléoduc de la mer d'Arabie"
 SAU_repair_pipeline_yemen_desc: "Faire monter d'un palier la ligne sud — restaurer ce que le sabotage a pris, ou poser la capacité supplémentaire pour pousser plus de brut au-delà d'Ormuz."
 SAU_request_f15: "Demander le F-15 aux États-Unis"
 SAU_request_f15_desc: "Ouvrir des négociations avec Washington pour acquérir le F-15 Strike Eagle. Si les Américains acceptent, le focus §YF-15 Strike Eagle§! se débloquera.\n\n§RC'est un choix exclusif :§! le premier fournisseur à accepter verrouille notre chasseur, et les trois autres programmes (§YTornado GR4§!, §YPanavia Tornado§!, §YEurofighter Typhoon§!) seront fermés pour de bon. Choisissez avec soin."
 SAU_request_panavia: "Demander le Panavia Tornado à l'Italie"
 SAU_request_panavia_desc: "Approcher Rome pour le Panavia Tornado IDS, le chasseur d'attaque multinational. Si les Italiens acceptent, le focus §YPanavia Tornado§! se débloquera.\n\n§RC'est un choix exclusif :§! le premier fournisseur à accepter verrouille notre chasseur, et les trois autres programmes (§YF-15 Strike Eagle§!, §YTornado GR4§!, §YEurofighter Typhoon§!) seront fermés pour de bon. Choisissez avec soin."
 SAU_request_tornado: "Demander le Tornado GR4 au Royaume-Uni"
 SAU_request_tornado_desc: "Approcher Londres pour l'appareil d'attaque Tornado GR4, l'épine dorsale du programme historique Al Yamamah. Si les Britanniques acceptent, le focus §YTornado GR4§! se débloquera.\n\n§RC'est un choix exclusif :§! le premier fournisseur à accepter verrouille notre chasseur, et les trois autres programmes (§YF-15 Strike Eagle§!, §YPanavia Tornado§!, §YEurofighter Typhoon§!) seront fermés pour de bon. Choisissez avec soin."
 SAU_request_typhoon: "Demander l'Eurofighter Typhoon"
 SAU_request_typhoon_desc: "Approcher le consortium européen (Allemagne) pour l'Eurofighter Typhoon dans le cadre du programme Al Salam. S'ils approuvent l'export, le focus §YAl Salam : Eurofighter Typhoon§! se débloquera.\n\n§RC'est un choix exclusif :§! le premier fournisseur à accepter verrouille notre chasseur, et les trois autres programmes (§YF-15 Strike Eagle§!, §YTornado GR4§!, §YPanavia Tornado§!) seront fermés pour de bon. Choisissez avec soin."
 SAU_rivalry_back_separatists: "Soutenir les séparatistes"
 SAU_rivalry_back_separatists_desc: "La Présidence générale du renseignement achemine argent et armes vers l'Ahwaz, le Baloutchistan et le Kurdistan. La périphérie iranienne s'agite."
 SAU_rivalry_propaganda_blitz: "Blitz médiatique anti-iranien"
 SAU_rivalry_propaganda_blitz_desc: "Inonder les ondes et les mosquées de l'acte d'accusation contre Téhéran."
 SAU_rivalry_strait_patrols: "Patrouilles du détroit"
 SAU_rivalry_strait_patrols_desc: "Maintenir la flotte à l'exercice dans les eaux étroites d'Ormuz."
 SAU_royal_patronage: "Patronage Royal"
 SAU_royal_patronage_desc: "User des nominations royales et des contrats pour assurer le soutien du candidat choisi parmi les aînés de la famille. Disponible une fois par course à la succession.\n\n§G+20 de standing§! pour le prince que vous soutenez déjà, §Yune fois sous le roi Abdallah et une fois sous le roi Salmane§!."
 SAU_royal_patronage_tt: "§G+20§! au standing du prince que vous soutenez"
 SAU_sabotage_pipeline_iraq: "Frapper l'oléoduc d'Europe"
 SAU_sabotage_pipeline_iraq_desc: "Frapper l'oléoduc qui achemine le pétrole saoudien à travers l'Irak vers l'Europe. Coupez-le, et le défi de Riyad à Moscou s'effondre avec lui."
 SAU_sabotage_pipeline_syria: "Frapper l'oléoduc du Levant"
 SAU_sabotage_pipeline_syria_desc: "Viser l'oléoduc saoudien qui se dirige vers la Méditerranée. Un coup réussi coupe la ligne et prive le Royaume de la route."
 SAU_sabotage_pipeline_yemen: "Frapper l'oléoduc de la mer d'Arabie"
 SAU_sabotage_pipeline_yemen_desc: "Envoyer des saboteurs contre la ligne saoudienne à travers le Yémen du Sud. S'ils passent, le pétrole s'arrête et le Royaume perd sa route méridionale."
 SAU_salman_burden_of_state: "Accabler le roi des affaires de l'État"
 SAU_salman_burden_of_state_desc: "Exiger que le roi traite dossiers, délégations et cérémonies habituellement délégués. La charge accrue accélérera le déclin de sa santé."
 SAU_salman_cpsa_council: "Convoquer le Conseil des affaires politiques et de sécurité"
 SAU_salman_cpsa_council_desc: "Remplacer les comités de sécurité existants par un unique Conseil des affaires politiques et de sécurité siégeant au palais royal. L'autorité consolidée raccourcira le délai des décisions majeures."
 SAU_salman_health_status: "§HLa santé du roi§! : [GetSAUKingHealth]"
 SAU_salman_health_status_desc: "L'état du roi est rapporté comme [GetSAUKingHealth]. Quand sa santé cédera, le prince héritier deviendra roi."
 SAU_salman_ksrelief: "Mobiliser les opérations de secours du KS"
 SAU_salman_ksrelief_desc: "Envoyer à l'étranger des convois KSrelief, des hôpitaux de campagne et des vivres sous patronage saoudien officiel. L'opération fournit une aide humanitaire tout en renforçant le soutien au gouvernement au pays."
 SAU_salman_maneuver: "Les manœuvres des factions de Salman"
 SAU_salman_maneuver_desc: "Le bloc soudairi s'emploie à faire avancer la prétention de Salmane, et peut retourner la cour contre votre propre candidat."
 SAU_salman_riyadh_metro_plan: "Étendre le plan métropolitain de Riyad"
 SAU_salman_riyadh_metro_plan_desc: "Étendre Riyad par six lignes de métro et une série de nouveaux quartiers organisés autour du réseau de transport."
 SAU_salman_royal_decrees: "Émettre des arrêtés royaux structurels"
 SAU_salman_royal_decrees_desc: "User de décrets royaux pour fusionner, abolir et réorganiser les ministères sans long processus législatif."
 SAU_salman_royal_physicians: "Convoquer les médecins royaux"
 SAU_salman_royal_physicians_desc: "Faire venir des spécialistes d'Europe et des États-Unis pour soigner le roi et dégager son emploi du temps. Cela améliorera temporairement son état sans arrêter le déclin à long terme."
 SAU_salman_spark_park: "Subventionner le parc énergétique du roi Salman"
 SAU_salman_spark_park_desc: "Subventionner le parc énergétique roi Salmane de trente kilomètres carrés près de Dammam pour produire pompes, vannes et matériel de forage au pays."
 SAU_shura_convene_session: "Convoquer le Conseil"
 SAU_shura_convene_session_desc: "Tenir une session du Majlis ach-Choura avec procès-verbal, ministres tenus d'assister et de répondre. Les débats seront publiés et pourront orienter le débat public, même si le roi conserve le dernier mot.\n\nCette décision ne peut être prise qu'une fois."
 SAU_shura_seat_notables: "Faire siéger les notables"
 SAU_shura_seat_notables_desc: "Nommer au Conseil des cheikhs tribaux et des grandes familles marchandes de Djeddah et de Buraidah.\n\nRépétable tous les 60 jours."
 SAU_shura_seat_notables_tt: "§G+10 sièges de notables§!, §R-5 sièges§! pour les oulémas et les technocrates\n§GDirigé par les notables§! : §G+8 % de pouvoir politique, -8 % de coût de corruption§! / §R+3 % de biens de consommation, -3 % de soutien de guerre§!\n§YÀ 70 sièges, le roi peut doter le Conseil d'une charte permanente.§!"
 SAU_shura_seat_technocrats: "Faire siéger les technocrates"
 SAU_shura_seat_technocrats_desc: "Nommer au Conseil des économistes, des ingénieurs et des hauts fonctionnaires expérimentés, y compris des Saoudiens formés à l'étranger.\n\nRépétable tous les 60 jours."
 SAU_shura_seat_technocrats_tt: "§G+10 sièges de technocrates§!, §R-5 sièges§! pour les oulémas et les notables\n§YDirigé par les technocrates§! : §G+8 % de recherche, +6 % de rendement des bureaux, +5 % de croissance de productivité§! / §R-5 % de stabilité§!\n§YÀ 70 sièges, le roi peut doter le Conseil d'une charte permanente.§!"
 SAU_shura_seat_ulema: "Faire siéger les oulémas"
 SAU_shura_seat_ulema_desc: "Nommer au Conseil des savants religieux seniors et leurs candidats agréés, accroissant l'influence cléricale sur ses travaux.\n\nRépétable tous les 60 jours."
 SAU_shura_seat_ulema_tt: "§G+10 sièges d'oulémas§!, §R-5 sièges§! pour les technocrates et les notables\n§ODirigé par les oulémas§! : §G+8 % de stabilité, +10 % de défense contre la dérive§! / §R-5 % de recherche, -5 % de migration§!\n§YÀ 70 sièges, le roi peut doter le Conseil d'une charte permanente.§!"
 SAU_spread_revolution_category: "Répandre la révolution"
 SAU_storm_air_campaign: "Frappez les positions des Houthis"
 SAU_storm_air_campaign_desc: "Choisir une province tenue par le mouvement houthi et frapper ses dépôts, aérodromes et routes d'approvisionnement. L'attaque endommagera aussi les infrastructures proches et infligera des pertes.\n\n§REndommage infrastructures, industrie d'armement et défenses aériennes§! dans la province visée et coûte des effectifs aux défenseurs. Répétable tous les 14 jours."
 SAU_storm_partner_readout: "Coalition : [?SAU_coalition_partners|0] partenaires"
 SAU_storm_partner_readout_desc: "§HÉtats volant avec le Royaume§! : §Y[?SAU_coalition_partners|0]§!\n\nChaque membre de la coalition peut se retirer indépendamment."
 SAU_storm_stand_down: "Mettre fin à la campagne"
 SAU_storm_stand_down_desc: "Cesser les sorties de coalition et dissoudre la campagne sans autre opération militaire.\n\n§G+4 % de stabilité§!, §R-3 % de soutien de guerre§!. Met fin à la campagne pour de bon."
 SAU_undermine_mbn: "Saper Mohammed ben Nayef"
 SAU_undermine_mbn_desc: "User des contacts de cour, de révélations nuisibles et du patronage retenu pour réduire le soutien à Mohammed ben Nayef. Le résultat peut aller de l'absence d'effet à une perte majeure d'influence."
 SAU_undermine_mutaib: "Saper Mutaib bin Abdallah"
 SAU_undermine_mutaib_desc: "User des contacts de cour, de révélations nuisibles et du patronage retenu pour réduire le soutien à Moutaïb ben Abdallah. Le résultat peut aller de l'absence d'effet à une perte majeure d'influence."
 SAU_undermine_salman: "Saper Salman ben Abdulaziz"
 SAU_undermine_salman_desc: "User des contacts de cour, de révélations nuisibles et du patronage retenu pour réduire le soutien à Salmane ben Abdelaziz. Le résultat peut aller de l'absence d'effet à une perte majeure d'influence."
 SAU_unleash_laf: "Lâcher l'armée libanaise"
 SAU_unleash_laf_desc: "L'armée est reconstruite, payée et armée. Riyad demande désormais à Beyrouth le seul remboursement qui compte : désarmer le Hezbollah, par la force s'il le faut."
 SAU_vision2030_category: "Projets Vision 2030"
 SAU_west_free_trade: "Libre-échange avec l'Occident"
 SAU_west_free_trade_desc: "Abaisser les tarifs et signer des pactes commerciaux dans tout le bloc de l'OTAN. Les relations avec l'alliance occidentale se réchauffent, et un accord ouvert lie leurs marchés au Royaume."
 SAU_west_joint_training: "Formation conjointe américano-saoudienne"
 SAU_west_joint_training_desc: "Mener des exercices conjoints avec des instructeurs américains pour améliorer l'entraînement interarmes saoudien et donner de l'expérience à toutes les forces."
 SAU_west_petrodollar: "Recyclage de pétrodollars"
 SAU_west_petrodollar_desc: "Les recettes pétrolières saoudiennes sont recyclées en bons du Trésor américain et en coentreprises. Le Royaume gagne moins d'emblée, mais Washington s'enrichit et s'engage davantage envers la maison des Saoud."
 SAU_yemen_old_weapons: "Armes excédentaires des navires"
 SAU_yemen_old_weapons_desc: "Envoyer au gouvernement yéménite des armes d'infanterie saoudiennes obsolètes tirées des stocks, à coût intérieur minime."
 SAU_yemen_raise_brigade: "Coordonner l'offensive"
 SAU_yemen_raise_brigade_desc: "Intégrer des officiers saoudiens au commandement yéménite et planifier une poussée coordonnée. Les forces du gouvernement gagnent un avantage durable à l'attaque contre les Houthis."
 SAU_yemen_war_funds: "Financer l'effort de guerre"
 SAU_yemen_war_funds_desc: "Virer de l'argent à Aden pour payer les soldes, acheter du carburant et tenir les soldats du gouvernement au champ un peu plus longtemps."
 YEM_drop_south_yemen_name: "Reprendre le nom du Yémen"
 YEM_drop_south_yemen_name_desc: "Mettre de côté l'identité du Yémen du Sud et gouverner de nouveau simplement comme Yémen."
 yemen_partition_category: "Les deux Yémen"
 SAU_events.1.a: "Qu'Allah ait pitié de son âme."
 SAU_events.1.d: "Le roi Fahd ben Abdelaziz Al-Saoud, Gardien des deux saintes mosquées, est décédé après des années de santé déclinante suivant son accident vasculaire de 1995. Le prince héritier Abdallah, qui gouverne le Royaume de facto depuis près d'une décennie, montera désormais sur le trône. La crise de succession qui pesait sur le Royaume depuis des années est enfin tranchée."
 SAU_events.1.t: "Mort du roi Fahd"
 SAU_events.10.a: "Rejoignez l’OPEP+."
 SAU_events.10.b: "Rejeter l'accord."
 SAU_events.10.d: "Riyad propose de coordonner la production pétrolière avec Moscou sous l'OPEP+, donnant aux deux exportateurs une plus grande influence sur les prix mondiaux."
 SAU_events.10.t: "[SAU.GetFlag] Accord OPEP+ [SOV.GetFlag]"
 SAU_events.100.a: "La région retient son souffle"
 SAU_events.100.d: "L'Iran est entré en guerre contre la République d'Arabie sécessionniste, plongeant le Golfe dans un conflit ouvert entre les deux pôles rivaux du pouvoir chiite."
 SAU_events.100.t: "Guerre dans le Golfe"
 SAU_events.101.a: "Nous tiendrons"
 SAU_events.101.d: "Téhéran s'est arrêté au seuil de la guerre, mais sa fureur est manifeste. Des agents iraniens agitent nos villes et les médias iraniens flétrissent la république comme État hérétique."
 SAU_events.101.t: "Téhéran bouillonne"
 SAU_events.102.a: "Se réconcilier avec les monarchies du Golfe"
 SAU_events.102.b: "Championner la cause de la démocratie arabe"
 SAU_events.102.d: "Un parlement siégeant et la république sur pied, la question de la place de l'Arabie dans le monde ne peut plus être différée. Fera-t-elle la paix avec les monarchies du Golfe, ou mènera-t-elle la cause de la démocratie arabe ?"
 SAU_events.102.t: "La République et la région"
 SAU_events.103.a: "Rejoindre la ligue"
 SAU_events.103.b: "Restez indépendant"
 SAU_events.103.d: "La République d'Arabie invite notre nation dans une ligue de démocraties arabes, un bloc responsable devant ses peuples plutôt que devant les rois ou les clercs."
 SAU_events.103.t: "Appel aux démocraties"
 SAU_events.104.a: "Un nouveau chapitre pour l'Arabie"
 SAU_events.104.d: "Des décennies de monarchie absolue ont pris fin. Tandis que les foules remplissent les rues de Riyad, un Conseil national de transition a saisi les rênes de l'État, jurant de gouverner seulement jusqu'à ce que l'Arabie choisisse sa voie aux urnes."
 SAU_events.104.t: "La maison des Saoud tombe"
 SAU_events.107.a: "Proclamer la République arabe d'Arabie"
 SAU_events.107.b: "Garder la République d'Arabie"
 SAU_events.107.d: "Le Baas tient les rênes de l'État. L'Arabie se proclamera-t-elle République arabe, avant-garde de la nation arabe, ou gardera-t-elle le nom modeste de République d'Arabie ?"
 SAU_events.107.t: "Le nom de la République"
 SAU_events.109.a: "Rejoindre le Komintern arabe"
 SAU_events.109.b: "Nous resterons seuls"
 SAU_events.109.d: "[FROM.GetName] nous invite dans le Komintern arabe, union d'États ouvriers liés par la cause de la révolution. Nous pouvons rejoindre nos camarades ou garder notre propre chemin."
 SAU_events.109.t: "Appel au Komintern arabe"
 SAU_events.11.a: "Accepter le marché."
 SAU_events.11.b: "Décliner l'offre."
 SAU_events.11.d: "Riyad offre à Washington un marché permanent : un flux fiable de pétrole saoudien vers les marchés américains en échange d'une coopération de sécurité plus étroite. Le Royaume attend une réponse."
 SAU_events.11.t: "[SAU.GetFlag] Pétrole contre sécurité"
 SAU_events.110.a: "Une leçon coûteuse."
 SAU_events.110.d: "L'Armée syrienne libre a été écrasée. Les rebelles que nous avons armés et financés sont dispersés ou morts, et Damas tient. Des années de trésor et de crédit versés en Syrie n'ont valu au Royaume qu'une défaite humiliante et un régime qui s'appuie plus que jamais sur Téhéran."
 SAU_events.110.t: "Le gambit syrien s'effondre"
 SAU_events.111.a: "Accepter le cessez-le-feu"
 SAU_events.111.b: "La guerre continue"
 SAU_events.111.d: "Riyad a avancé des termes de cessez-le-feu. Le Royaume interromprait sa campagne aérienne et mettrait fin aux hostilités directes, laissant le gouvernement de Sanaa mener sa propre guerre. L'offre est sur la table."
 SAU_events.111.t: "Une offre saoudienne de cessez-le-feu"
 SAU_events.112.a: "Une pause dans les combats"
 SAU_events.112.d: "Sanaa a accepté un cessez-le-feu. L'opération Tempête décisive est réduite et le Royaume se retire du front yéménite. La trêve ne tiendra que tant que nous le voudrons."
 SAU_events.112.t: "Les Houthis acceptent"
 SAU_events.113.a: "So be it"
 SAU_events.113.d: "Sanaa a rejeté nos termes sans appel. La guerre au Yémen continue, et l'opération Tempête décisive se poursuit."
 SAU_events.113.t: "Les Houthis refusent"
 SAU_events.114.a: "Alors nous combattons"
 SAU_events.114.d: "La trêve est finie. Enhardis et réarmés, Ansar Allah a déchiré le cessez-le-feu et repris ses attaques. La guerre au Yémen est de retour, que le Royaume l'ait voulu ou non."
 SAU_events.114.t: "Les Houthis rompent le cessez-le-feu"
 SAU_events.115.a: "Le proclamer roi. Il a assez attendu."
 SAU_events.115.b: "Le moment n'est pas venu. Qu'il serve comme prince héritier."
 SAU_events.115.d_mbn: "L'ordre tient. Mohammed ben Nayef demeure prince héritier, sa prétention confirmée par le roi et incontestée en public. Le plus jeune se retire dans ses ministères, déjoué pour l'heure — et le Royaume expire."
 SAU_events.115.d_mbs: "C'est fait. Mohammed ben Nayef est relevé de ses charges et, devant les caméras, baise la main du jeune homme qui l'a déplacé. Mohammed ben Salmane est prince héritier, et la ligne de succession a sauté une génération. Les princes aînés ne disent rien. Ne rien dire est déjà une réponse."
 SAU_events.115.t: "Le prince héritier est nommé"
 SAU_events.116.a: "Long règne à lui."
 SAU_events.116.d_mbn: "Le roi Salmane est mort, et le prince héritier accède comme il devait. Mohammed ben Nayef prend le trône, les services de sécurité derrière lui et une réputation bâtie sur le maintien du Royaume debout."
 SAU_events.116.d_mbs: "Le roi Salmane est mort, et le trône passe à son fils. Mohammed ben Salmane gouverne le Royaume sans partage à un âge où la plupart de ses prédécesseurs attendaient encore un ministère. Ceux qui doutaient de lui ont depuis longtemps été mis à la retraite, arrêtés ou réconciliés."
 SAU_events.116.t: "Un nouveau roi à Riyad"
 SAU_events.117.a: "Les renvoyer chez eux."
 SAU_events.117.b: "Naturaliser les utiles."
 SAU_events.117.d: "Neuf millions de travailleurs étrangers tiennent l'économie du Royaume. Ils posent les tuyaux, tiennent les hôpitaux, conduisent les camions et remplissent les chantiers — et ils ne sont pas, et ne seront jamais, de la nation que les faisalites entendent reconstruire. Le Conseil ne s'accorde pas : échafaudage à retirer, ou fondation à bâtir."
 SAU_events.117.t: "La question de la main-d'œuvre expatriée"
 SAU_events.118.a: "Se retirer de ce que nous n'avons pas écrit."
 SAU_events.118.b: "Les travailler de l'intérieur."
 SAU_events.118.d: "Les Nations unies, le Fonds et la Banque ont été bâtis sans le consentement du Royaume. Le retrait libérerait Riyad d'institutions qu'il n'a pas écrites, mais le laisserait commenté plutôt qu'entendu. Le Conseil doit choisir entre la distance et l'influence."
 SAU_events.118.t: "La question des forums internationaux"
 SAU_events.119.a: "Ramenez tout cela à la maison."
 SAU_events.119.b: "Laissez-le là où il gagne."
 SAU_events.119.d: "Des centaines de milliards reposent dans les trésors et banques occidentaux, sûrs et rentables mais vulnérables à la pression étrangère. Rapetrier la fortune financerait le développement du Royaume ; la laisser à l'étranger préserve ses rendements et l'influence de Riyad dans les capitales occidentales."
 SAU_events.119.t: "La question de la fortune à l'étranger"
 SAU_events.12.a: "Accepter le partenariat."
 SAU_events.12.b: "Décliner l'offre."
 SAU_events.12.d: "L'Arabie saoudite propose un partenariat de long terme avec la Grande-Bretagne. Les recettes pétrolières paieraient l'industrie et l'expertise britanniques, ravivant l'esprit d'Al-Yamamah."
 SAU_events.12.t: "[SAU.GetFlag] Un partenariat saoudo-britannique"
 SAU_events.120.a: "Les Mosquées sont un devoir, non un mandat."
 SAU_events.120.b: "Nous parlons pour les fidèles."
 SAU_events.120.d: "Plus d'un milliard de musulmans n'ont pas une seule voix politique. Le Royaume tient La Mecque et Médine, et les oulémas demandent si cette confiance est un devoir à remplir en silence ou un mandat pour mener l'Oumma au grand jour."
 SAU_events.120.t: "La question de l'Oumma mondiale"
 SAU_events.121.a: "Le mandat d'autosuffisance."
 SAU_events.121.b: "Équidistance armée."
 SAU_events.121.d: "Deux blocs sont chacun convaincus que le Royaume est à eux à perdre. Riyad peut rester armé et équidistant, achetant aux deux sans appartenir à aucun, ou accepter le coût de fabriquer ses propres armes et ne dépendre d'aucun arsenal étranger."
 SAU_events.121.t: "La question de l'engagement des superpuissances"
 SAU_events.122.a: "Aumône, donnée gratuitement."
 SAU_events.122.b: "Aide sous conditions."
 SAU_events.122.d: "L'argent saoudien atteint chaque coin du monde musulman : mosquées, cliniques, gouvernements et armées. Fayçal le donnait en aumône et ne demandait rien par écrit ; ses héritiers arguent qu'une aide sans conditions n'achète aucune influence durable. Le Royaume doit choisir entre charité et levier."
 SAU_events.122.t: "La question de l'aide souveraine"
 SAU_events.123.a: "Frapper les couleurs étrangères. Qu'ils rentrent."
 SAU_events.123.a_tt: "Toute puissance étrangère perd l'accès militaire au Royaume"
 SAU_events.123.b: "L'arrangement tient. La nécessité permet ce que le principe interdit."
 SAU_events.123.d: "Des drapeaux étrangers flottent encore sur le sol saoudien, et chaque année les sermons deviennent plus durs à réfuter. Les garnisons garantissent le Royaume contre ses voisins et l'humilient devant son propre clergé d'un même souffle. Le Conseil n'a plus de moyen de différer la décision."
 SAU_events.123.t: "La question des bases étrangères"
 SAU_events.124.a: "Le proclamer de la chaire."
 SAU_events.124.b: "Le proclamer du palais."
 SAU_events.124.d: "Quand Fayçal prit le trône à son frère en 1964, il le fit une fatwa à la main et le Conseil des ministres déjà réorganisé sous lui — la mosquée et la machine bougèrent la même semaine. Saoud avait mené le Royaume au bord de la faillite ; Fayçal répondit par une austérité que personne n'avait demandée et un Programme en dix points que personne n'avait voté.\n\nLe programme doit être relancé. La seule question qui reste est au nom de qui — le clergé se souvient du roi qui gouverna avec eux, et les ministères du roi qui dirigea l'État lui-même."
 SAU_events.124.t: "La résurgence faisalite"
 SAU_events.125.a: "Racheter leurs chartes."
 SAU_events.125.b: "Remplacez-les carrément."
 SAU_events.125.d: "Abdelaziz lia la péninsule par mariages et pensions, et laissa ses fils gouverner des provinces qui étaient, en tout sens pratique, les leurs. Fayçal passa onze ans à arracher les ministères à cet arrangement et ne l'acheva jamais tout à fait.\n\nLes chartes peuvent être rachetées à un prix que le Trésor sentira, ou simplement révoquées — ce qui est moins cher, et se fait des ennemis dans la famille qui survivront au roi qui les a faits."
 SAU_events.125.t: "Centralisation des émirats provinciaux"
 SAU_events.126.a: "Leur donner les tribunaux."
 SAU_events.126.b: "Leur donner les écoles."
 SAU_events.126.d: "Fayçal gouverna les savants à l'épaule et le paya par versements. Quand il apporta la télévision au Royaume en 1965, son propre neveu mourut en attaquant la station à Riyad, et dix ans plus tard le frère de cet homme entra dans un majlis et tua le roi. L'alliance avec les oulémas n'était jamais décorative et jamais gratuite.\n\nCe qu'on leur rend maintenant décide de quel Royaume il s'agit. Les tribunaux en feraient les arbitres de la loi. Les écoles, les auteurs de la génération suivante."
 SAU_events.126.t: "Accroître l'autorité des oulémas"
 SAU_events.127.a: "Exilez-les."
 SAU_events.127.b: "Rééduquez-les."
 SAU_events.127.d: "L'ironie n'échappe à personne : Fayçal bâtit lui-même la technocratie, envoyant des Saoudiens au Caire, à Londres et en Californie et leur confiant des ministères à leur retour. Zaki Yamani dirigea le portefeuille pétrolier un diplôme de Harvard en poche, mieux que quiconque le Royaume eût pu former au pays.\n\nMais les hommes revinrent avec plus que des diplômes, et le Conseil discute désormais si la réponse est l'aéroport ou la salle de classe."
 SAU_events.127.t: "Purger l'élite occidentalisée"
 SAU_events.128.a: "Nommer par concours."
 SAU_events.128.b: "Nommer par loyauté."
 SAU_events.128.d: "Avant Fayçal, il n'y avait guère d'État à doter. Les finances du Royaume passaient par la maison du roi et une poignée de marchands de confiance, et la différence entre le trésor et la bourse royale était affaire d'opinion. Il bâtit des ministères là où il y avait des serviteurs.\n\nÀ quoi sert vraiment la nouvelle bureaucratie n'a jamais été tranché. Un service choisi par concours sera compétent et ne sera pas reconnaissant. Un service choisi par loyauté ne sera ni l'un ni l'autre."
 SAU_events.128.t: "La fonction publique souveraine"
 SAU_events.129.a: "Qu'ils patrouillent en force."
 SAU_events.129.b: "Les garder en rôle consultatif."
 SAU_events.129.d: "Le Comité pour la promotion de la vertu et la prévention du vice n'était qu'une nuée d'exécutants locaux jusqu'à ce que l'État lui donne un budget, un uniforme et une chaîne de commandement. Fayçal avait besoin du clergé réconcilié à la télévision, aux écoles de filles et aux ingénieurs étrangers dans les rues de Dhahran, et le Comité fut une part de ce qu'il paya.\n\nCe n'a jamais tout à fait été une police, et ce n'a jamais tout à fait pas été une police non plus."
 SAU_events.129.t: "Le retour des comités de vertu"
 SAU_events.13.a: "Accepter le pacte d'investissement."
 SAU_events.13.d: "Mettant de côté d'anciens soupçons, Riyad offre à Paris un vaste pacte d'investissement : capitaux saoudiens pour l'industrie française, expertise française pour le Royaume. Les deux gouvernements ont à y gagner."
 SAU_events.13.t: "[SAU.GetFlag] Un pacte d'investissement franco-saoudien"
 SAU_events.130.a: "Brouiller les satellites."
 SAU_events.130.b: "Acheter les réseaux."
 SAU_events.130.d: "Fayçal mena sa première guerre médiatique contre la Voix des Arabes de Nasser, qui émettait dans les casernes saoudiennes et disait aux soldats que leur roi était un valet américain. Riyad répondit par ses propres émetteurs et beaucoup d'argent placé en silence chez des rédacteurs à Beyrouth et au Caire.\n\nLa leçon prit : on ne discute pas une émission. On la brouille, ou on l'achète."
 SAU_events.130.t: "Interdire les médias étrangers"
 SAU_events.131.a: "Faire siéger les notables."
 SAU_events.131.b: "Élargir l'appartenance."
 SAU_events.131.d: "Le Programme en dix points de 1962 promettait au Royaume un Conseil consultatif. Fayçal régna treize ans de plus sans jamais en convoquer un, et il revint à Fahd de le faire siéger enfin en 1992 — trente ans trop tard, et nommé plutôt qu'élu.\n\nLa promesse est faite à nouveau, et la composition est tout l'argument. Les notables en feraient une cour. Une appartenance plus large en ferait quelque chose que la cour ne peut entièrement prévoir."
 SAU_events.131.t: "Réorganisation du Majlis ach-Choura"
 SAU_events.132.a: "Instituts techniques."
 SAU_events.132.b: "Académies militaires."
 SAU_events.132.d: "Le boom fut bâti par d'autres mains — ouvriers yéménites, instituteurs égyptiens, commis palestiniens, et avec le temps plus d'un million venus d'Asie du Sud. La réponse de Fayçal fut une éducation à une échelle que la péninsule n'avait jamais tentée : l'université roi Abdelaziz ouvrit en 1967, les bourses envoyèrent des milliers à l'étranger, et le Royaume se mit à fabriquer sa propre classe moyenne.\n\nPour quoi cette classe est fabriquée, voilà la décision devant le Conseil."
 SAU_events.132.t: "L'initiative des cadres nationaux"
 SAU_events.133.a: "Scellez-le entièrement."
 SAU_events.133.b: "Admettre ceux dont nous avons besoin."
 SAU_events.133.d: "Dans les années 1970, la main-d'œuvre étrangère approchait le tiers de tous ceux qui se trouvaient à l'intérieur des frontières, et elle faisait l'essentiel du travail qui tenait les lumières allumées. Fayçal prit le travail et s'inquiéta de la politique qui venait avec — les Palestiniens apportaient la cause, les Yéménites les effectifs, les Égyptiens Nasser.\n\nSceller la frontière rend la nation à elle-même et livre aux ministères une pénurie de main-d'œuvre pour laquelle ils n'ont aucun plan."
 SAU_events.133.t: "La frontière fermée"
 SAU_events.134.a: "Fortifier la côte."
 SAU_events.134.b: "Fortifier l'intérieur."
 SAU_events.134.d: "Le Royaume de Fayçal était cerné par des gens qui le voulaient disparu : l'Égypte de Nasser de l'autre côté de la mer Rouge, les républicains à Sanaa, les baasistes à Bagdad et Damas, et une Union soviétique qui avait rayé la maison des Saoud comme relique en attente d'enterrement. Il bâtit la Garde nationale contre le coup et acheta des avions américains contre l'invasion, sans jamais être tout à fait sûr de ce qui viendrait d'abord.\n\nLe Royaume doit maintenant décider contre quelle menace il se prépare vraiment."
 SAU_events.134.t: "Le Royaume forteresse"
 SAU_events.135.a: "La convoquer à La Mecque."
 SAU_events.135.b: "Convoquez-le à l’étranger."
 SAU_events.135.d: "Quand al-Aqsa brûla en août 1969, Fayçal eut les têtes du monde musulman assemblées à Rabat en quelques semaines, et l'Organisation de la conférence islamique existait avant la fin de l'année. C'était la réponse à la Ligue arabe de Nasser — non arabe et laïque, mais musulmane et menée depuis La Mecque.\n\nOù le Royaume convoque les fidèles est en soi la déclaration. Les Villes saintes confèrent une légitimité qu'aucune salle de conférence à l'étranger ne peut prêter."
 SAU_events.135.t: "Conférence de solidarité islamique"
 SAU_events.136.a: "Menacer l'embargo ouvertement."
 SAU_events.136.b: "Appliquez-le tranquillement."
 SAU_events.136.d: "Le dix-sept octobre 1973, Fayçal coupa la production et ferma les robinets aux États-Unis. Le baril passa de trois dollars à près de douze en une saison, l'Occident découvrit précisément ce que valait son confort, et le Royaume découvrit qu'il tenait une arme qu'il n'avait jamais pensé tirer.\n\nElle n'a pas été tirée depuis. Le ministère a tenu les chiffres à jour tout ce temps."
 SAU_events.136.t: "L'esprit de 73"
 SAU_events.137.a: "Les armes d’abord."
 SAU_events.137.b: "Tout le reste d'abord."
 SAU_events.137.d: "Le Royaume pompe le pétrole, le vend à l'étranger, et rachète tout ce dont il a besoin — y compris le tuyau par lequel le pétrole circule. Les plans quinquennaux de Fayçal devaient briser ce cercle et réussirent surtout à bâtir ce qui déplace le pétrole plus vite.\n\nLa substitution doit commencer quelque part, et où elle commence décide de ce que le Royaume peut faire sans demander la permission de personne."
 SAU_events.137.t: "Éradiquer la dépendance étrangère"
 SAU_events.138.a: "Financez-le."
 SAU_events.138.b: "Personnel."
 SAU_events.138.d: "Fayçal fonda la Ligue islamique mondiale à La Mecque en 1962 et fit naître l'Organisation de la conférence islamique sept ans plus tard. Toutes deux siégeaient là où l'argent saoudien pouvait les atteindre, et toutes deux furent bâties pour répondre à un panarabisme qui n'avait pas de place pour les rois.\n\nSes successeurs continuèrent de payer les factures et cessèrent peu à peu d'écrire l'ordre du jour. L'argent achète la déférence ; les fonctionnaires achètent le contrôle. Ce n'est pas la même chose."
 SAU_events.138.t: "Reprendre la direction de l'OCI"
 SAU_events.139.a: "Un quota strict."
 SAU_events.139.b: "Un quota progressif."
 SAU_events.139.d: "Aramco fut faite pour acheter saoudien là où le saoudien existait, et là où il n'existait pas, le Royaume payait des firmes étrangères pour bâtir l'usine qui le produirait. C'était lent, c'était cher, et cela reste la seule façon pour un pays qui importe ses propres trépans de cesser de le faire.\n\nLa dureté du plancher décide si les ministères s'y conforment, ou apprennent simplement à déposer des exemptions."
 SAU_events.139.t: "Le quota d'approvisionnement intérieur"
 SAU_events.14.a: "Accepter l'investissement."
 SAU_events.14.b: "Décliner l'offre."
 SAU_events.14.d: "L'Arabie saoudite offre d'investir dans notre industrie en échange de liens économiques plus profonds. Accepter apporterait de nouvelles usines et de l'influence saoudienne."
 SAU_events.14.t: "[SAU.GetFlag] Investissements dans les pays de l'OTAN"
 SAU_events.140.a: "Qu'il suive Fayçal. La Garde le portera."
 SAU_events.140.b: "Le Royaume de Fayçal est mort avec Fayçal. Qu'il repose."
 SAU_events.140.d: "Fahd est enterré et Abdallah est roi de son propre chef enfin, après dix ans de règne au nom d'un autre. La succession est ouverte, et les princes ont déjà commencé à compter.\n\nLe propre fils du roi vient à lui avec un argument plutôt qu'une prétention. Moutaïb commande la Garde nationale — les levées tribales, les hommes de l'intérieur, la force levée précisément parce que l'armée régulière ne pouvait être confiée près d'un trône. Il a lu Fayçal : l'austérité, l'autosuffisance, le Royaume qui parlait pour l'Oumma et ne demandait rien à Washington. L'oncle qui gouverna ainsi fut abattu par son propre neveu, et chaque homme dans la pièce le sait.\n\nLe programme de Fayçal n'a pas d'héritier. Moutaïb demande à en être un."
 SAU_events.140.t: "La résurgence faisalite"
 SAU_events.141.a: "Laisser le marché trouver son plancher."
 SAU_events.141.b: "L'État achètera. Nous ne pouvons laisser cela devenir de la politique."
 SAU_events.141.d: "Le vingt-cinq février, l'indice Tadawul All Share clôtura à 20 634 puis cessa de monter. Il n'a pas cessé de tomber depuis.\n\nCe n'est pas un krach de banques et d'institutions. Quelque chose comme la moitié de la population adulte du Royaume était dans ce marché — instituteurs, chauffeurs, soldats, fonctionnaires — beaucoup tenant des actions achetées à crédit à des prix qu'aucun bénéfice ne pouvait jamais justifier. Des salles de courtage s'ouvrirent dans les centres commerciaux. Les femmes négociaient depuis des salles séparées. Ce fut, pendant deux ans, le passe-temps national.\n\nQuand l'indice trouvera son plancher, il aura perdu près des deux tiers de sa valeur, et plusieurs centaines de milliards de riyals d'épargne des ménages avec. L'Autorité des marchés de capitaux a trois ans et n'a jamais rien vu de tel. Le Conseil doit décider si l'État rattrape le couteau qui tombe, ou laisse le marché enseigner la leçon qu'il enseigne."
 SAU_events.141.t: "Février noir"
 SAU_events.142.a: "Couper la production. Défendre le prix."
 SAU_events.142.b: "Maintenir la production. Laisser d'abord casser les producteurs chers."
 SAU_events.142.d: "Le prix du baril baisse et ne montre aucun signe d'arrêt. Le budget a été écrit sur des hypothèses qui ne tiennent plus, et chaque ministère va découvrir lesquels de ses programmes étaient abordables et lesquels n'étaient que financés. \nRiyad y est déjà passé. Au début des années 1980, il coupa sa propre production pour soutenir le prix, regarda chaque autre producteur vendre en silence dans le vide laissé, et vit la production saoudienne chuter d'environ trois quarts tandis que le prix s'effondrait quand même. La leçon fut chère et se discute encore au ministère.\nLe Royaume tient les barils les moins chers de la terre. C'est le seul vrai avantage qu'il a, et on peut le dépenser à défendre le prix pour tout le monde, ou à survivre aux producteurs qui ne peuvent se permettre de vendre à ces chiffres."
 SAU_events.142.t: "Effondrement du prix du pétrole"
 SAU_events.143.a: "Une dure leçon dans une salle de classe coûteuse."
 SAU_events.143.d: "La Bourse saoudienne a perdu la plus grande part de sa valeur en quelques mois, effaçant plusieurs centaines de milliards de riyals de fortune des ménages. Fait inhabituel pour un marché de cette taille, les pertes tombent presque entièrement sur les Saoudiens ordinaires plutôt que sur les institutions — instituteurs, chauffeurs et fonctionnaires qui achetèrent au sommet, beaucoup à crédit. Les analystes à l'étranger notent que le plus grand exportateur de pétrole du monde vient de découvrir qu'il a aussi une classe d'investisseurs particuliers, et aucune idée de quoi en faire."
 SAU_events.143.t: "Riyad : le Tadawul s'effondre"
 SAU_events.144.a: "Le baril décide, comme toujours."
 SAU_events.144.d: "Le prix du brut a traversé tous les planchers que les analystes lui avaient tracés. Les États exportateurs réécrivent des budgets équilibrés sur des hypothèses désormais visiblement sans valeur, tandis que les importateurs jouissent d'une aubaine qu'ils se gardent de trop célébrer. Tous les regards sont sur Riyad, qui tient les barils les moins chers de la terre et donc la seule décision qui compte : couper la production et soutenir le prix pour tout le monde, ou continuer de pomper et voir qui casse d'abord."
 SAU_events.144.t: "Le prix du pétrole s'effondre"
 SAU_events.145.a: "Protéger la Garde. C'est elle qui nous garde."
 SAU_events.145.b: "Les deux services le porteront également."
 SAU_events.145.d: "Les réserves s'épuisent et le budget ne se clôt pas. Les subventions d'abord, puis les projets d'équipement, et maintenant le ministère des Finances s'en prend à la ligne de défense.\n\nLa difficulté est que le Royaume n'a pas une armée. Il a les forces régulières sous le ministère de la Défense, et il a la Garde nationale — recrutée parmi les tribus loyales de l'intérieur, cantonnée autour de Riyad et des champs pétrolifères, répondant directement au trône. La Garde existe parce que les fils d'Abdelaziz ne faisaient pas confiance à l'armée, et elle a été payée en conséquence depuis.\n\nLes coupes peuvent tomber sur les deux, ou la Garde peut être protégée et les officiers réguliers priés de s'en arranger. L'un de ces choix tient le trône en sûreté cette année. L'autre le tient en sûreté dans dix ans.\n\n§HLe corps des officiers§! : [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! sur §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.145.t: "Les coupes inégales"
 SAU_events.146.a: "Envoyer la Garde. Vider les rues."
 SAU_events.146.b: "Personne ne se déploie. Trouver l'argent et acheter la paix."
 SAU_events.146.d: "L'austérité a atteint la rue. Il y a des foules à Qatif et à Dammam, et de plus petites à Riyad que les ministères jurent n'être pas des foules du tout.\n\nLa Garde nationale est l'instrument pour cela — elle l'a toujours été, c'est tout son objet — et la Garde est prête, financée et consentante. Le corps des officiers réguliers n'a pas été sollicité, et observe très attentivement qui l'est.\n\nChaque colonel au ministère de la Défense comprend ce que cela signifie si la Garde est envoyée tandis que leurs propres unités restent impayées en caserne. Cela signifie que le trône a décidé, en public, de façon permanente, quelle armée il croit.\n\n§HLe corps des officiers§! : [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! sur §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.146.t: "L'ordre de déployer"
 SAU_events.147.a: "Marcher sur Riyad. La Garde n'aura pas le temps de réagir."
 SAU_events.147.b: "Pas cela. Nous sommes soldats, pas politiciens."
 SAU_events.147.d: "C'est donc réglé. La Garde est payée et crue ; l'armée n'est ni l'un ni l'autre. Les hommes qui font voler les avions, commandent les blindés et tiennent la frontière se sont entendu dire, sans que personne le dise tout à fait, qu'ils sont la seconde armée de leur propre pays.\n\nIl y a un précédent pour ce qui suit. En 1969, une conspiration d'officiers de l'armée de l'air et de terre — nassériens, hidjazis, las d'être gouvernés par une famille — faillit, à un rapport de renseignement près, renverser Fayçal. Des centaines furent arrêtés. Le Royaume en tira que les forces régulières ne pouvaient être crues, éleva encore la Garde, et ne demanda jamais pourquoi les officiers l'avaient voulu.\n\nL'état-major se réunit depuis quelques semaines. On ne discute plus de budgets.\n\n§HLe corps des officiers§! : [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! sur §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.147.t: "Les officiers décident"
 SAU_events.148.a: "Le Royaume a un nouveau gouvernement."
 SAU_events.148.d: "Des unités de l'armée régulière saoudienne sont entrées à Riyad avant l'aube et tiennent les ministères, l'autorité de radiodiffusion et les approches des palais royaux. Les casernes de la Garde nationale ont été cernées à la même heure et n'ont pas résisté. Un Conseil militaire suprême a annoncé qu'il rétablit l'ordre public et que la position constitutionnelle du trône est inchangée — formule que les observateurs notent pouvoir se lire de plusieurs façons.\n\nAramco signale un chargement normal à Ras Tanura. C'est la seule phrase de toute la dépêche que les marchés pétroliers lisent."
 SAU_events.148.t: "Riyad : des blindés dans les rues"
 SAU_events.149.a: "Proclamer une République arabe socialiste."
 SAU_events.149.b: "Proclamer une République islamique."
 SAU_events.149.c: "Proclamer une République constitutionnelle."
 SAU_events.149.d: "Le trône est fini. Le Conseil a les ministères, l'autorité de radiodiffusion et les approches de chaque palais à Riyad, et il a découvert ce que chaque junte découvre : saisir un pays prend une nuit, le gouverner prend un nom.\nUne république doit être proclamée, et une république doit être proclamée comme quelque chose. Les officiers dans la pièce ne s'accordent pas sur quoi. Certains ont servi aux côtés d'Irakiens et de Syriens et sont rentrés admirant le Baas — une nation arabe, un parti, l'armée pour échine. D'autres désignent l'est, Qatif et la Province orientale, et arguent que la seule masse que le Royaume a jamais réprimée est celle qui porterait une république sur ses épaules. Une faction plus jeune, ceux envoyés étudier à l'étranger, veulent une constitution et un parlement et que le mot république signifie ce qu'il signifie partout ailleurs. Et une poignée, plus silencieuse, a lu des choses pour lesquelles le Mabahith les eût autrefois arrêtés.\nQuoi que l'on annonce ce soir, ce sera au nom du peuple saoudien, et aucun d'eux n'a été consulté."
 SAU_events.149.e: "Proclamer une République populaire."
 SAU_events.149.t: "Al-Jumhuriya"
 SAU_events.15.a: "Accepter le partenariat naval."
 SAU_events.15.b: "Décliner l'offre."
 SAU_events.15.d: "Riyad s'approche de Madrid avec une offre navale : les chantiers espagnols construiraient pour la Marine royale saoudienne, et l'argent saoudien affluerait dans l'industrie espagnole."
 SAU_events.15.t: "[SAU.GetFlag] Un partenariat saoudo-espagnol"
 SAU_events.150.a: "Les absorber. Ils peuvent porter notre uniforme."
 SAU_events.150.b: "Dissoudre entièrement la Garde. Les renvoyer chez eux."
 SAU_events.150.c: "Garder un reliquat, sous notre commandement."
 SAU_events.150.d: "Soixante-quinze mille hommes, levés parmi les tribus du Najd parce que les fils d'Abdelaziz ne faisaient pas confiance à une armée de professionnels, et assez armés pour qu'aucune armée professionnelle ne puisse marcher sur Riyad sans les combattre d'abord. Ils furent cernés dans leurs casernes la nuit même et ne tirèrent pas un coup. Le Conseil doit maintenant décider ce qu'il en fait.\n\nCe n'est pas une formation ennemie. Leurs officiers sont cousins et voisins des hommes qui tiennent les armes contre eux, et chacun de leurs soldats appartient à une tribu qui a une créance sur l'État. Les dissoudre, et le Conseil économise beaucoup d'argent et se fait une foule d'ennemis à l'intérieur. Les absorber, et il double ses effectifs et avale soixante-quinze mille hommes dont la loyauté était, jusqu'à la semaine dernière, explicitement à quelqu'un d'autre."
 SAU_events.150.t: "La Garde dissoute"
 SAU_events.151.a: "Ils répondront à l'État ou à personne."
 SAU_events.151.b: "Rétablir les pensions. Chaque riyal."
 SAU_events.151.d: "Les pensions s'arrêtèrent quand la Garde s'arrêta. À l'intérieur, cela ne fut pas lu comme une mesure budgétaire — les versements aux tribus du Najd et des Chammar précèdent le Royaume lui-même, c'est l'arrangement par lequel Abdelaziz l'assembla, et ils n'ont jamais été interrompus une seule fois.\n\nLes cheikhs ne sont pas en rébellion. Ils ne répondent simplement pas, et dans un pays de cette taille ne pas répondre, c'est déjà presque y être."
 SAU_events.151.t: "Les tribus répondent"
 SAU_events.152.a: "Les arrêter. Tous. Ce soir."
 SAU_events.152.b: "Les faire entrer. Élargir le Conseil et partager le blâme."
 SAU_events.152.d: "Un Conseil qui ne peut payer, ne peut gouverner et ne peut s'expliquer est un Conseil dont ses propres colonels commencent à parler à la troisième personne. Il y a de nouveau des réunions — les mêmes salles, les mêmes grades, les mêmes formulations prudentes qui précédèrent la dernière.\n\nLes hommes qui prirent Riyad savent précisément comment cela se fait, parce qu'ils l'ont fait. Voilà la difficulté de gouverner par coup d'État : on a publié la méthode."
 SAU_events.152.t: "Les officiers se retournent"
 SAU_events.153.a: "Mieux vaut pauvre que pendu."
 SAU_events.153.d: "Les pensions sont rétablies, les tribunaux sont discrètement réduits, et une date est nommée pour une assemblée consultative que chacun comprend sera nommée plutôt qu'élue. Ce n'est pas grand-chose. C'est assez pour que les hommes qui comptaient les semaines restantes du Conseil aient cessé de compter à voix haute.\n\nLe Trésor est plus léger d'une somme que personne ne publiera, et les officiers qui prirent Riyad ont rendu une bonne part de ce pour quoi ils l'avaient prise."
 SAU_events.153.t: "Le Conseil se rachète"
 SAU_events.154.a: "Alors ce sera tranché sur le terrain."
 SAU_events.154.d: "Quatre-vingt-dix jours, et le Conseil n'a rien trouvé à dire. La garnison de Haïl s'est déclarée pour le roi ce matin, la Province orientale a suivi à midi, et les levées tribales dont la Garde tirait ont cessé de prétendre être autre chose.\n\nL'armée qui prit le pays en une nuit est désormais la seule institution à le défendre, et elle découvre qu'un État tenu entièrement par la force exige plutôt plus de force que quiconque n'avait budgété."
 SAU_events.154.t: "Le Royaume se divise"
 SAU_events.155.a: "Le monde observe la Province orientale."
 SAU_events.155.d: "Des combats ont été signalés à travers l'intérieur saoudien entre unités loyales au Conseil militaire suprême et formations se déclarant pour la maison des Saoud. La Province orientale, où est le pétrole, est contestée. Le Brent a ouvert onze dollars plus haut et n'a pas cessé de monter.\n\nChaque ministère des Affaires étrangères ayant une ambassade à Riyad publie la même déclaration sur la retenue, et chacun calcule en silence de quel côté se faire voir tard plutôt que tôt."
 SAU_events.155.t: "Riyad : guerre civile en Arabie saoudite"
 SAU_events.156.a: "Garder Abdallah. Le trône vaut ce qu'il nous coûte."
 SAU_events.156.b: "Trouver un roi qui comprenne l'arrangement."
 SAU_events.156.d: "Les gouvernorats sont désormais à la disposition du Conseil, ce qui pose la question qu'il s'est soigneusement abstenu de poser. Il y a encore un roi.\n\nAbdallah est vieux, personnellement austère d'une façon que le pays a toujours aimée, et commanda la Garde nationale quarante ans avant que le Conseil ne la dissolve — ce qui signifie que les hommes qui prirent Riyad se demandent s'il faut garder l'homme dont ils viennent de licencier l'armée. En sa faveur : personne dans le Royaume ne conteste sa légitimité, et un trône que personne ne conteste vaut plus que plusieurs divisions.\n\nContre lui : il n'est pas un figurant par tempérament et ne l'a jamais été. Le garder, c'est rendre une part de ce que le Conseil a pris, en pratique et en public. L'alternative est de trouver un prince qui comprenne que l'arrangement va dans l'autre sens."
 SAU_events.156.t: "La question du trône"
 SAU_events.157.a: "Salman ben Abdulaziz."
 SAU_events.157.b: "Mohammed ben Nayef."
 SAU_events.157.c: "Moutaib ben Abdallah."
 SAU_events.157.d: "Le roi Abdallah a été retiré du trône, et le Conseil militaire suprême doit nommer un successeur parmi les princes aînés de la maison des Saoud.\n\nChaque candidat porte derrière lui un électorat différent — l'establishment soudairi, les services de sécurité, les tribus de l'intérieur, et la génération plus jeune de la famille. Le choix du Conseil déterminera quelle part du Royaume reconnaîtra d'abord le nouvel arrangement, et laquelle devra être persuadée."
 SAU_events.157.e: "Mohammed ben Salmane."
 SAU_events.157.t: "Un roi plus pratique"
 SAU_events.158.a: "Un officier en service. §H+5 Contrôle, -5 Légitimité§!"
 SAU_events.158.b: "Un prince de la maison des Saoud. §H-5 Contrôle, +5 Légitimité§!"
 SAU_events.158.c: "Un notable local. §H+2 Contrôle, +2 Légitimité§!"
 SAU_events.158.d: "Le siège est vide et le Conseil doit le remplir. Trois noms ont été avancés, et chacun achète au Conseil quelque chose de différent.\n\nUn officier sera obéi et haï. Un prince sera reconnu et ignoré. Un notable local ne sera ni l'un ni l'autre, ce qui est la part utile et la part dangereuse à la fois."
 SAU_events.158.t: "Le gouvernorat de [SAU_governor_province.GetName]"
 SAU_events.159.a: "Une régence étroite. Il garde le trône et les Mosquées."
 SAU_events.159.b: "Une régence totale. Tous les pouvoirs, sans exception."
 SAU_events.159.c: "Une régence de cinq ans. Fixez une date."
 SAU_events.159.d: "Le document est court. Il consigne que Sa Majesté, indisposée, confie l'autorité exécutive et le portefeuille de la défense à un Conseil agissant en son nom, et porte sa signature sous un paragraphe qu'on ne lui a pas donné l'occasion d'amender.\n\nReste à régler combien le décret prend vraiment. Une régence qui laisse au roi sa mosquée, son titre et ses cérémonies est une régence avec laquelle le pays peut vivre, et une qui ne lui laisse rien n'est que la vérité écrite. Les juristes font observer, sans qu'on le leur demande, qu'un décret daté est plus facile à signer qu'un décret sans date.\n\nIl n'y a pas de constitution à suspendre. C'est toujours là la commodité de ce Royaume."
 SAU_events.159.t: "Le décret de régence"
 SAU_events.16.a: "Étendre le parapluie de défense aérienne."
 SAU_events.16.b: "Décliner la demande."
 SAU_events.16.d: "Le Royaume demande à Washington un parapluie de défense aérienne élargi. Des batteries Patriot cerneraient les villes et les champs pétrolifères saoudiens, intégralement payées par Riyad."
 SAU_events.16.t: "[SAU.GetFlag] Le bouclier américain"
 SAU_events.160.a: "Tout l'appareil. Couvre-feu, tribunaux, censeurs."
 SAU_events.160.b: "Les pouvoirs d'urgence seulement. Laisser les rues tranquilles."
 SAU_events.160.d: "L'assemblée, les déplacements entre provinces et les presses passent ce matin sous autorité militaire. Les juristes du Conseil observent que le Royaume n'a jamais possédé de constitution à suspendre, ce qui épargne beaucoup de rédaction.\n\nLa question est jusqu'où cela va. Couvre-feu, tribunaux et censeurs tiendront le pays immobile et seront souvenus une génération. Des pouvoirs d'urgence sans le couvre-feu tiendront plutôt moins et seront pardonnés plutôt plus tôt."
 SAU_events.160.t: "Loi martiale"
 SAU_events.161.a: "Le décret disait cinq ans. Cela fait cinq ans."
 SAU_events.161.b: "L'indisposition continue. Indéfiniment."
 SAU_events.161.d: "Il y a cinq ans, le Conseil mit une date à sa propre autorité, et les juristes qui le conseillèrent d'ainsi faire ont passé les années suivantes à être discrètement réaffectés. La date est arrivée. Tout le Royaume le sait.\n\nL'honorer, c'est rendre l'exécutif à un trône que le Conseil a passé cinq ans à vider, et croire que la gratitude est une chose réelle. Le rompre, c'est que la parole du Conseil vaille exactement ce que chacun soupçonnait, et qu'elle ne vaudra plus jamais davantage.\n\n§HUne promesse tenue coûte au Conseil sa prise. Une promesse rompue lui coûte tout le reste.§!"
 SAU_events.161.t: "La régence expire"
 SAU_events.162.a: "Licencier les modèles. Nous avons besoin de production, pas d'orgueil."
 SAU_events.162.b: "Le bâtir nous-mêmes, du minerai jusqu'au bout."
 SAU_events.162.d: "Le Royaume achète ses armes à l'étranger depuis qu'il a des armes à acheter, et les hommes qui le gouvernent maintenant ont passé leur carrière à attendre des pièces étrangères qui arrivaient quand le parlement de quelqu'un d'autre le permettait. La loi impose la fabrication intérieure de ce qui peut l'être ici.\n\nIl y a deux façons de commencer. Acheter les licences et l'outillage, et avoir des usines en marche en trois ans, fabriquant les modèles d'autrui aux conditions d'autrui. Ou partir de rien — la métallurgie, les ingénieurs, les échecs — et posséder le résultat entièrement, à un coût que le Trésor sentira une décennie."
 SAU_events.162.t: "La loi sur les industries de défense"
 SAU_events.163.a: "Les princes. Que le pays les voie en rendre compte."
 SAU_events.163.b: "Les dissidents. Les dossiers sont déjà écrits."
 SAU_events.163.c: "Les deux. Nous n'avons pas saisi l'État pour être sélectifs."
 SAU_events.163.d: "Le tribunal siège sous autorité militaire, sans appel, et prend une juridiction que les juges ordinaires n'ont jamais eue. Les oulémas ont été consultés sur la forme de la procédure et non sur les verdicts, ce qu'ils ont remarqué.\n\nLe Conseil doit décider qui y est amené. Il y a des princes dont les comptes ne survivront pas à un audit et dont la disgrâce réjouirait énormément le pays. Il y a des organisateurs, des clercs et des signataires dont le Mabahith tient les dossiers depuis vingt ans. Juger les premiers est populaire et rentable. Juger les seconds est nécessaire et sera souvenu."
 SAU_events.163.t: "Le tribunal d'urgence"
 SAU_events.164.a: "Service universel. Chaque homme en âge, sans exemption."
 SAU_events.164.b: "Service sélectif. Les tribus gardent leurs exemptions."
 SAU_events.164.d: "Les Al Saoud n'ont jamais conscrit personne. Une armée de volontaires tirée de tribus de confiance est loyale ; une armée de tout le monde n'est que grande, et une grande armée dans un pays de cette taille se fait des opinions sur la façon dont le pays est dirigé.\n\nLe Conseil est lui-même l'opinion que le dernier régime craignait, ce qui prête à la discussion une certaine gaucherie. Il propose de prendre le risque quand même — la seule question est si la levée tombe sur tout le monde, ou sur tous ceux que le Conseil peut se permettre d'agacer."
 SAU_events.164.t: "Conscrit le Royaume"
 SAU_events.165.a: "Les princes aînés. Leurs noms portent encore le pays."
 SAU_events.165.b: "Les cousins oubliés. La gratitude coûte moins cher que le prestige."
 SAU_events.165.c: "Les mécontents fortunés. Les faire entrer et les auditer plus tard."
 SAU_events.165.d: "La famille n'est pas une seule chose. Ce sont des milliers de gens aux prétentions fort inégalement réparties, et un grand nombre d'entre eux ont passé leur vie à être écartés par la branche qui tenait le trône. Le Conseil vient de retirer cette branche de l'équation.\n\nIl y a des princes aînés dont le nom seul réglerait une province. Il y a des cousins sans distinction particulière qui seraient reconnaissants d'un gouvernorat et se souviendraient de qui le leur a donné. Et il y a ceux qui ont de l'argent et des griefs, qu'on pourrait faire entrer à bon marché et auditer plus tard."
 SAU_events.165.t: "Loyaux dans les provinces"
 SAU_events.166.a: "Payer les maisons marchandes. Acheter le Hedjaz proprement."
 SAU_events.166.b: "Y placer une garnison. Ils s'adapteront."
 SAU_events.166.d: "La province de La Mecque, c'est Djeddah, les maisons marchandes, le pèlerinage et le Hedjaz — une région qui fut un royaume à part entière jusqu'en 1925 et n'a jamais tout à fait cessé de le mentionner. Ses familles financèrent l'État avant le pétrole et n'ont jamais été pleinement réconciliées à la règle najdie.\n\nOn peut les acheter, et elles sont chères. Ou la province peut être tenue en garnison, et on peut leur rappeler que le pèlerinage passe désormais par des checkpoints."
 SAU_events.166.t: "La province de La Mecque"
 SAU_events.167.a: "Les courtiser. Concéder ce qui doit l'être."
 SAU_events.167.b: "Réassigner les chaires. Nous avons besoin du libellé maintenant."
 SAU_events.167.d: "Médine tient la Mosquée du Prophète et l'établissement savant qui s'est formé autour d'elle pendant treize siècles. Ses juristes peuvent décrire le Conseil comme une nécessité que la communauté doit accepter, ou comme une usurpation qu'elle doit endurer, et le libellé ira plus loin que n'importe quel communiqué du Conseil.\n\nOn peut les courtiser, ce qui veut dire concessions et patience. Ou les chaires seniors peuvent être réassignées à des hommes qui sont déjà d'accord, ce qui est plus rapide et que chaque savant du monde musulman remarquera."
 SAU_events.167.t: "La province d'al-Madinah"
 SAU_events.168.a: "Se tenir derrière le roi. Emprunter le titre, ne pas le prendre."
 SAU_events.168.b: "La garde appartient à l'État, non à l'homme."
 SAU_events.168.d: "Fahd prit le titre de Gardien des deux saintes mosquées en 1986, mettant de côté Majesté pour quelque chose qui revendiquait ce qu'aucun autre souverain musulman ne pouvait revendiquer. C'est la chose la plus précieuse que possède la maison des Saoud et elle ne se transfère pas.\n\nLe Conseil ne peut le prendre à un roi vivant. Il peut se tenir derrière lui quand il s'en sert, et être vu le faisant — ce qui prête au Conseil sa légitimité et rappelle à chacun de qui elle est. Ou il peut annoncer que la garde repose sur l'État plutôt que sur l'homme, et découvrir comment le monde musulman le prend."
 SAU_events.168.t: "Gardiens des deux Mosquées"
 SAU_events.169.a: "Commencer par les comités de la Province orientale."
 SAU_events.169.b: "Placer les sermons sous revue."
 SAU_events.169.c: "Commencer par les signataires de pétitions."
 SAU_events.169.d: "Le Mabahith n'avait rien à bâtir. Les armoires du ministère de l'Intérieur tiennent les organisateurs de la Province orientale par nom et par rue, les prédicateurs de la Sahwa par sermon et par date, et les hommes qui signèrent la pétition de 2003 et la signèrent encore en 2007. Le ministère qui assembla tout cela en fut toujours soigneux, parce que les hommes des dossiers avaient des cousins au ministère. Le Conseil n'a pas de cousins."
 SAU_events.169.e: "Prendre les trois dossiers ensemble."
 SAU_events.169.t: "Les dossiers sont déjà ouverts"
 SAU_events.17.a: "Nous répondrons à cela."
 SAU_events.17.d: "Des militants de [ROOT.SAU_GetFrontName] ont déchaîné un barrage de roquettes par-delà la frontière. Les sirènes hurlent sur nos villes tandis que les familles se précipitent à l'abri et que les dégâts sont comptés."
 SAU_events.17.t: "Des roquettes frappent nos villes"
 SAU_events.170.a: "En audience publique, et télévisée."
 SAU_events.170.b: "Le régler au Ritz, comme avant."
 SAU_events.170.c: "Des grâces, au tarif en vigueur."
 SAU_events.170.d: "Les comptables ont fini, et les chiffres sont pires que les rumeurs. Des ministères qui n'ont rien bâti, des commissions sur des avions jamais livrés, une décennie de recettes du Royaume qui se sont simplement arrêtées quelque part entre le trésor et l'entrepreneur. On va dire une part de cela au pays. La seule question est combien se passe devant une caméra, et combien se règle dans un hôtel portes closes."
 SAU_events.170.t: "Des princes au banc des accusés"
 SAU_events.171.a: "Les pensionner, généreusement et pour toujours."
 SAU_events.171.b: "Exiler les lignées aînées."
 SAU_events.171.c: "Poursuivre, et confisquer ce qu'on trouve."
 SAU_events.171.d: "Abdelaziz eut quarante-cinq fils recensés et le Royaume a passé soixante-dix ans à en absorber les conséquences. Ils sont plusieurs milliers maintenant, touchant des pensions, tenant des gouvernorats, mariés dans chaque maison marchande de Djeddah à Hofuf. Aucun d'eux pris à part n'est une menace pour le Conseil. Tous ensemble, ils sont le seul gouvernement alternatif que le pays ait jamais connu, et on ne peut simplement les laisser où ils sont."
 SAU_events.171.e: "Les laisser riches et ornementaux."
 SAU_events.171.t: "Chacun d'eux une prétention"
 SAU_events.172.a: "Reconnaître le Conseil. La relation est avec le pays."
 SAU_events.172.b: "Les reconnaître, et en tirer quelque chose."
 SAU_events.172.c: "Nous ne traitons pas avec un conseil de colonels."
 SAU_events.172.d: "La lettre est courte. Elle note que les obligations du Royaume sont inchangées, que les objectifs de production seront tenus, que le personnel américain est en sûreté et que le Conseil souhaiterait une réunion rapide. Elle ne mentionne ni le roi, ni les arrestations, ni la constitution. Washington doit maintenant décider ce qu'il a sous les yeux : un gouvernement, ou un groupe d'officiers qui se trouvent assis là où un gouvernement siégeait."
 SAU_events.172.t: "Le Conseil écrit à Washington"
 SAU_events.173.a: "Ports, rail et le corridor nord."
 SAU_events.173.b: "Du capital, et aucune condition attachée."
 SAU_events.173.d: "L'ambassadeur chinois arriva quatre jours après la nuit elle-même, félicita le Conseil pour le rétablissement de l'ordre, et passa directement au débit de Yanbu. Nulle référence au roi, aux arrestations, ni à la constitution. C'est la conversation la plus directe qu'ait eue le ministère des Affaires étrangères du Royaume depuis une décennie, et chacun dans la pièce comprend précisément ce qui se vend."
 SAU_events.173.t: "Aucune question posée"
 SAU_events.174.a: "Les admettre, une fois Riyad réglé avec Téhéran."
 SAU_events.174.b: "La candidature est refusée."
 SAU_events.174.c: "Les admettre. Sans conditions."
 SAU_events.174.d: "La candidature saoudienne à l'adhésion pleine arrive au Secrétariat sans préambule et sans conditions, ce qui est en soi une déclaration. L'Organisation n'a jamais admis un État du Golfe. Elle n'a jamais non plus refusé un producteur de pétrole d'échelle fondatrice qui demandait poliment. La question à Pékin n'est pas si Riyad est utile — cela a été tranché il y a des années — mais si l'admettre, c'est importer une querelle que l'Organisation a passé deux décennies à éviter."
 SAU_events.174.t: "Une candidature de Riyad"
 SAU_events.175.a: "Rétablir l'entente avec Téhéran."
 SAU_events.175.b: "On ne nous dira pas qui sont nos voisins."
 SAU_events.175.d: "La réponse est courtoise et entièrement sans ambiguïté. La Chine parrainera la candidature, présidera le vote et emportera les plus petits membres — et en échange l'entente négociée à Pékin en 2023 doit être rétablie par écrit, ambassades comprises. L'Organisation ne veut pas d'un membre qui passera chaque sommet à se quereller avec un autre. On demande à Riyad d'acheter son siège par une signature, non par du pétrole."
 SAU_events.175.t: "Les conditions de Pékin"
 SAU_events.176.a: "Le noter, et passer outre."
 SAU_events.176.d: "Nulle raison n'est donnée, parce qu'aucune n'est requise. Le communiqué remercie le Royaume de son intérêt, note la valeur d'un dialogue continu, et se clôt. Riyad a été refusé par une organisation dont on l'assurait qu'elle prendrait n'importe qui, et le refus sera lu correctement dans chaque capitale qui compte."
 SAU_events.176.t: "La candidature est refusée"
 SAU_events.177.a: "Prendre le siège."
 SAU_events.177.d: "Le vote est unanime, ce qui signifie qu'il était réglé avant d'être pris. Le Royaume adhère comme membre à part entière sans préconditions, sans période probatoire et sans aucune référence à la manière dont son gouvernement actuel est venu au pouvoir. Ce silence est tout ce qui a été acheté."
 SAU_events.177.t: "Admis sans conditions"
 SAU_events.178.a: "Les barils circulent comme avant."
 SAU_events.178.d: "La reconnaissance arrive en un communiqué de deux lignes publié un vendredi après-midi, là où Washington met les choses qu'il aimerait que personne n'examine. L'ambassadeur revient la semaine suivante. Rien dans la relation commerciale n'est renégocié et rien des six derniers mois n'est mentionné de part et d'autre, alors ni ensuite."
 SAU_events.178.t: "Affaires comme d'habitude"
 SAU_events.179.a: "Accorder l'accès. C'est le prix de la reconnaissance."
 SAU_events.179.b: "Une reconnaissance à ces conditions n'en est pas une."
 SAU_events.179.d: "Washington reconnaîtra le Conseil, et a joint un calendrier à l'offre : accès élargi à Prince Sultan, droits de prépositionnement dans la Province orientale, et survol permanent. Le raisonnement n'est pas caché. Un gouvernement qui a assez besoin de reconnaissance pour la demander est un gouvernement qu'on peut en facturer, et le Conseil a demandé le premier."
 SAU_events.179.t: "Reconnaissance, à un prix"
 SAU_events.18.a: "Les lâches paieront."
 SAU_events.18.d: "Une campagne de bombardements coordonnée par [ROOT.SAU_GetFrontName] a déchiré nos villes. On compte les morts tandis que le public exige que le gouvernement agisse."
 SAU_events.18.t: "Bombardements dans nos villes"
 SAU_events.180.a: "Alors nous nous débrouillons sans eux."
 SAU_events.180.d: "La déclaration tient en quatre paragraphes sur le gouvernement constitutionnel et l'État de droit, et émane d'un Département d'État qui n'a rien dit de comparable sur la moitié des voisins du Royaume. Le Conseil la lit, note lesquels de ses propres officiers ont été formés au Kansas, et la classe. La relation ne s'arrête pas. Elle cesse simplement d'être dite."
 SAU_events.180.t: "Washington refuse"
 SAU_events.181.a: "Le réaffirmer en entier. La sécurité contre le pétrole, comme avant."
 SAU_events.181.b: "Le pétrole, oui. La garantie, non."
 SAU_events.181.c: "Le laisser expirer. Il n'a jamais été écrit."
 SAU_events.181.d: "En février 1945, Roosevelt et Abdelaziz se rencontrèrent à bord d'un croiseur sur le Grand Lac Amer et convinrent de l'arrangement qui a sous-tendu quatre-vingts ans de politique : sécurité américaine, pétrole saoudien. Ni l'un ni l'autre ne signa rien, ce que chaque administration depuis a trouvé commode. Riyad demande désormais, formellement et par écrit, une réponse à la question que le flou était conçu pour éviter — le marché a-t-il été fait avec un roi, ou avec un pays ?"
 SAU_events.181.t: "La question du Quincy"
 SAU_events.182.a: "Rien n'est signé. Rien ne doit l'être."
 SAU_events.182.d: "Il n'y a pas de document, parce qu'il n'y en a jamais eu. Il y a un groupe aéronaval qui ne part pas, une note passée entre deux gouvernements qui ne sera publiée dans aucun des deux pays, et un accord de ravitaillement renouvelé pour vingt ans aux anciens termes. Quatre-vingts ans plus tard, l'arrangement a survécu à un changement de dynastie par la simple méthode de n'avoir jamais été écrit."
 SAU_events.182.t: "L'entente tient"
 SAU_events.183.a: "Nous prendrons la moitié qui s'embarque."
 SAU_events.183.d: "La relation commerciale est confirmée en quelque détail et la relation de sécurité est décrite, deux fois, comme étant en cours d'examen. Riyad comprend parfaitement la construction : les tankers sont garantis et le Royaume ne l'est pas. C'est la moitié de Quincy qui ne coûte rien à Washington, offerte par une administration qui a compté le coût de l'autre moitié."
 SAU_events.183.t: "Une demi-affaire"
 SAU_events.184.a: "Alors le Royaume se garantit lui-même."
 SAU_events.184.d: "Pas de déclaration, pas de refus, pas de réunion. La demande est accusée de réception par un sous-secrétaire adjoint et jamais répondue, et après quelques mois il devient clair que le non-réponse était la réponse. Quatre-vingts ans d'arrangement n'ont pas été désavoués. Ils ont simplement été laissés expirer, en silence, comme ces choses finissent toujours."
 SAU_events.184.t: "Personne n'a de garantie"
 SAU_events.185.a: "Laissez-les lire."
 SAU_events.185.b: "Le Royaume n'a qu'une politique étrangère."
 SAU_events.185.d: "Quatre mois dans le nouveau règne, l'Organisation de la conférence islamique se réunit à La Mecque — le corps que le roi Fayçal bâtit après qu'al-Aqsa brûla en 1969, convoqué dans sa propre ville par son frère cadet. Un programme d'action décennal fut convenu et chacun rentra. Dans les messes d'officiers de la Garde nationale, on lit plutôt les discours plus anciens, ceux de 1973, et l'on observe que Fayçal ne s'arrêtait pas aux programmes. Moutaïb ben Abdallah commande la Garde. Il n'a pas arrêté la lecture."
 SAU_events.185.t: "Le sommet de La Mecque"
 SAU_events.186.a: "Le financer ouvertement, au nom du Royaume."
 SAU_events.186.b: "Laisser la Garde le payer en silence."
 SAU_events.186.c: "Le rappeler à l'ordre."
 SAU_events.186.d: "En 1969, al-Aqsa brûla et Fayçal eut les têtes du monde musulman assemblées à Rabat dans le mois ; l'Organisation de la conférence islamique existe à cause de cela. Le cercle autour de Moutaïb veut reconvoquer le sommet et financer ouvertement la Ligue islamique mondiale — au nom du Royaume, aux frais du Royaume, le drapeau du Royaume à la tribune. Ce n'est pas une petite demande. C'est aussi, précisément, ce que fit son oncle.\n\n§HSentiment faisalite§! : [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! sur §Y100§!)"
 SAU_events.186.t: "Le souvenir de Rabat"
 SAU_events.187.a: "Fayçal a un héritier après tout."
 SAU_events.187.d: "RIYAD — Le commandant de la Garde nationale saoudienne a passé la semaine à faire, en miniature, ce que son oncle fit en entier. Le budget de la Ligue islamique mondiale a été rétabli près de sa part des années 1970, la Banque islamique de développement doit être recapitalisée sur des fonds proches de la Garde, et Moutaïb ben Abdallah a appelé — de façon inédite, pour un commandant saoudien en service plutôt qu'un ministre — à ce que l'Organisation de la coopération islamique soit convoquée en session extraordinaire.\n\nLe roi Fayçal fonda la Ligue à La Mecque en 1962 et assembla l'Organisation à Rabat en 1969, et en octobre 1973 il démontra ce que le Royaume pouvait faire le jour où il choisissait d'agir plutôt que de médier. La Garde n'est pas l'État et son commandant n'est pas le roi. Les deux points se font à Riyad bien plus souvent qu'il y a un mois."
 SAU_events.187.t: "Fayçal a un héritier"
 SAU_events.188.a: "Dire ouvertement ce qui se dit déjà en privé."
 SAU_events.188.b: "La guerre de Washington n'est pas à nous de raconter."
 SAU_events.188.d: "Il y a des divisions américaines en Mésopotamie, de l'autre côté d'une frontière que le Royaume n'a jamais pu fermer. Quel que soit le nom que Washington donne à l'arrangement, chaque prédicateur de Buraidah à Abha le décrit de la même façon, et aucun n'est contredit par les faits. Le cercle autour de Moutaïb a cessé de discuter si Fayçal avait raison sur l'Occident. Il est passé à ce qui suit de ce qu'il avait raison.\n\n§HSentiment faisalite§! : [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! sur §Y100§!)"
 SAU_events.188.t: "L'occupation d'à côté"
 SAU_events.189.a: "Le Royaume ne se réforme pas pour être applaudi à l'étranger."
 SAU_events.189.b: "Le siècle n'attendra pas."
 SAU_events.189.d: "Pris un à un, les décrets sont modestes — une règle assouplie ici, un ministère restructuré là, une profession ouverte à des gens auparavant non admis. Ensemble, c'est le plus grand changement social depuis que les écoles prirent les filles, et personne à Riyad ne prétend qu'ils furent rédigés sans un œil sur la façon dont ils se liraient à Washington et à Londres. Les chaires ont davantage remarqué la seconde part que la première.\n\n§HSentiment faisalite§! : [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! sur §Y100§!)"
 SAU_events.189.t: "Le Royaume s'ouvre"
 SAU_events.19.a: "Renforcer la frontière."
 SAU_events.19.d: "Des combattants de [ROOT.SAU_GetFrontName] ont franchi la frontière, frappant des dépôts militaires avant de se fondre dans la nuit. Nos forces s'empressent de répondre."
 SAU_events.19.t: "Incursion par-delà la frontière"
 SAU_events.190.a: "Posez la question de Faisal à voix haute."
 SAU_events.190.b: "La réserve n'est pas une arme."
 SAU_events.190.d: "Encore une capitale musulmane, encore une campagne aérienne américaine, encore une déclaration saoudienne exhortant toutes les parties à la retenue. Le cercle autour de Moutaïb a renoncé à rédiger des déclarations. Il fait circuler une question à la place, et c'est précisément celle à laquelle Fayçal répondit en octobre 1973 : à quoi sert la plus grande réserve de pétrole de la terre si on ne la prend jamais ?\n\n§HSentiment faisalite§! : [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! sur §Y100§!)"
 SAU_events.190.t: "La prochaine guerre"
 SAU_events.191.a: "Laisser courir. Il devrait être vu à sa tête."
 SAU_events.191.b: "Le canaliser par les ministères."
 SAU_events.191.c: "Le disperser avant qu'il ne nomme un roi."
 SAU_events.191.d: "Cela a cessé d'être une conversation entre officiers. Le portrait de Fayçal est aux vitrines de la rue Olaya ; les sermons du vendredi à Buraidah et Unaizah portent sur le même sujet depuis six semaines ; et les conscrits de la Garde citent l'émission de 1973 à leurs instructeurs. Personne n'a organisé cela et chacun reconnaît où cela pointe. Moutaïb ben Abdallah n'a rien dit en public, ce qui se lit désormais comme une déclaration.\n\n§HSentiment faisalite§! : [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! sur §Y100§!)"
 SAU_events.191.t: "La rue se souvient de Fayçal"
 SAU_events.192.a: "La réponse de Faisal. Dites-la avec ses mots."
 SAU_events.192.b: "Ouvrir le trésor à ceux qui sont sous le feu."
 SAU_events.192.c: "Une déclaration appelant toutes les parties à la retenue."
 SAU_events.192.d: "Les forces israéliennes sont en action contre un État arabe, et la télévision du Royaume le diffuse en direct et sans interruption. En un jour les pancartes sont autant américaines qu'israéliennes — les avions, les munitions, le veto qui suivra au Conseil de sécurité. C'est le terrain que Fayçal choisit en 1973 et l'argument n'a pas changé dans l'intervalle : le Royaume tient la plus grande réserve de pétrole de la terre et n'a jamais une seule fois consenti à la prendre.\n\n§HSentiment faisalite§! : [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! sur §Y100§!)"
 SAU_events.192.t: "Encore une guerre, et la même question"
 SAU_events.193.a: "Que le procès-verbal montre que ce fut réglé à une table."
 SAU_events.193.d: "Cela tient en soixante pages et recommande presque exactement ce que les colonels demandaient d'abord, ce qui arrive quand une commission est autorisée à choisir ses propres membres. Les promotions sont gazettées, les arriérés clos, et les officiers nommés dans les dossiers du ministère de l'Intérieur se voient dire en silence que les dossiers sont clos aussi.\n\nIl n'y aura pas de coup. Les soldats du Royaume ont reçu une raison de ne pas être ceux qui y mettent fin, et pour une armée c'est généralement assez."
 SAU_events.193.t: "La commission rend son rapport"
 SAU_events.194.a: "Alors c'est convenu. Posez-leur la question à tous."
 SAU_events.194.b: "Le Royaume répondra au Yémen tout seul."
 SAU_events.194.d: "Ils arrivent en un seul week-end et l'ordre du jour n'est jamais publié. Le Koweït envoie le cheikh Mohammed al-Khalid al-Sabah, vice-Premier ministre et ministre de l'Intérieur ; le Qatar envoie son Premier ministre, le cheikh Abdallah ben Nasser Al Thani, qui tient aussi le portefeuille de l'intérieur. Les Émiratis sont déjà dans le bâtiment.\n\nLa capitale est tombée aux Houthis et le président reconnu est quelque part au sud d'elle sans armée digne de ce nom. La question devant la salle n'est pas si le Golfe peut agir. C'est si le Golfe agit d'une seule signature ou de plusieurs — et chaque État du couloir en décidera pour soi."
 SAU_events.194.t: "La réunion de Riyad"
 SAU_events.195.a: "Le signer. Par tous les moyens nécessaires."
 SAU_events.195.b: "Le Yémen ne sera pas sauvé en protectorat."
 SAU_events.195.d: "La demande saoudite est posée au président directement, et ce n'est pas tant une offre d'aide qu'une demande de permission. Riyad veut une lettre : un appel au Conseil de sécurité, et un appel distinct aux États du Conseil de coopération du Golfe, les priant d'intervenir §Ypar tous les moyens nécessaires§!.\n\nUn gouvernement reconnu peut licitement inviter des forces étrangères sur son propre sol, et cette lettre est toute la base juridique de ce qui suit. Signée, elle amène les forces aériennes du Golfe. Non signée, la République affronte les Houthis avec ce qui lui reste — et garde le droit de dire ensuite qu'elle n'a jamais été le client de personne."
 SAU_events.195.t: "La question de Riyad"
 SAU_events.196.a: "La tempête décisive commence."
 SAU_events.196.b: "Air et mer seulement. Aucun soldat saoudien ne franchit la frontière."
 SAU_events.196.d: "L'annonce n'est pas faite à Riyad. Adel al-Joubeir, ambassadeur du Royaume aux États-Unis, la lit à l'ambassade à Washington tandis que les premiers avions sont déjà en l'air — un choix de lieu qui dit à chaque capitale du monde qui fut consulté et quand.\n\nOpération Tempête décisive. Les États qui ont répondu à l'invitation sont nommés comme participants, dont certains apprennent l'étendue de leur participation par la diffusion. L'objectif déclaré est le rétablissement du gouvernement légitime. Nulle date de fin n'est donnée, et nulle n'est demandée.\n\n§HPartenaires de coalition§! : §Y[?SAU_coalition_partners|0]§!"
 SAU_events.196.t: "La déclaration"
 SAU_events.197.a: "Le Golfe est entré en guerre."
 SAU_events.197.d: "WASHINGTON — Une coalition menée par l'Arabie saoudite a commencé des opérations aériennes sur le Yémen ce soir, annoncées depuis l'ambassade saoudienne ici plutôt que depuis Riyad. Le Royaume invoque une demande écrite du président reconnu du Yémen et les dispositions de défense collective du Conseil de coopération du Golfe.\n\nTéhéran a condamné l'opération et nie armer le mouvement houthi. Washington a confirmé fournir un soutien logistique et de renseignement sans engager d'avions propres. Aucun membre de la coalition n'a proposé d'estimation de la durée prévue de la campagne."
 SAU_events.197.t: "Opération Tempête Décisive"
 SAU_events.198.a: "Nous volerons avec le Royaume."
 SAU_events.198.b: "Ce n'est pas notre guerre."
 SAU_events.198.d: "La demande arrive par l'ambassadeur saoudien et est inhabituellement directe : des avions, ou les équipages pour les servir, ou en dernier ressort un nom sur le communiqué. Le Royaume assemble une coalition contre l'avance houthie et préférerait ne pas l'assembler seul.\n\nRejoindre achète beaucoup de crédit à Riyad et une part de ce qui suivra. Décliner coûte ce crédit et rien d'autre — et la guerre n'a pas de date de fin."
 SAU_events.198.t: "Riyad nous demande de voler"
 SAU_events.199.a: "Alors nous n'irons pas où l'on ne nous demande pas."
 SAU_events.199.b: "Nous n'avons pas besoin de leur signature."
 SAU_events.199.d: "La réponse de Sanaa est polie, sans hâte et entièrement négative. Il n'y aura pas d'appel au Conseil de sécurité ni de demande au Golfe, et le Royaume est remercié de sa préoccupation dans la langue que les gouvernements réservent aux préoccupations qu'ils entendent ignorer.\n\nSans cette lettre il n'y a pas d'invitation, et sans invitation une campagne aérienne sur le Yémen n'est qu'une campagne aérienne sur le Yémen. Riyad peut encore agir. Il le fera pour son propre compte, et chaque capitale l'enregistrera ainsi."
 SAU_events.199.t: "La lettre ne vient pas"
 SAU_events.2.a: "Longue vie au roi !"
 SAU_events.2.d: "Abdallah ben Abdelaziz Al-Saoud a été formellement proclamé roi d'Arabie saoudite et Gardien des deux saintes mosquées. Ayant servi de souverain de facto depuis 1995, son accession formelle apporte stabilité et continuité au Royaume. Le roi Abdallah est connu pour ses tendances réformistes prudentes et ses efforts de dialogue interreligieux."
 SAU_events.2.t: "Le roi Abdallah monte sur le trône"
 SAU_events.20.a: "Jaych al-Islam (Armée de l'islam)"
 SAU_events.20.b: "Ansar al-Haramayn (Défenseurs des deux saintes mosquées)"
 SAU_events.20.c: "Kata'ib al-Aqsa (Brigades Al-Aqsa)"
 SAU_events.20.d: "Le nouveau mouvement soutenu par l'Arabie saoudite a besoin d'un nom avant de s'annoncer au monde. La bannière choisie définira comment partisans et ennemis en parleront."
 SAU_events.20.e: "Liwa al-Tawhid (Brigade du monothéisme)"
 SAU_events.20.t: "Un nom pour le front"
 SAU_events.200.a: "Réformer autant que les ministères le supporteront."
 SAU_events.200.b: "Seul le nom sur les décrets a changé."
 SAU_events.200.c: "Ouvrir l'économie et laisser la politique suivre."
 SAU_events.200.d: "Fahd est enterré à Al Oud dans une tombe anonyme, comme la doctrine l'exige, et Abdallah est roi en son propre nom après une décennie de gouvernement au nom d'un autre. Les condoléances arrivent de quatre-vingt-dix capitales et le premier conseil des ministres se tient la même semaine.\n\nTout ce qu'il a voulu faire depuis l'accident vasculaire est désormais à lui d'ordonner plutôt que de proposer, et les ministères le savent. Ce qu'ils ne savent pas encore, c'est combien il en a encore l'intention. Il y a dans ce cabinet des hommes qui ont passé dix ans à supposer que la réponse était très peu."
 SAU_events.200.t: "Un nouveau royaume"
 SAU_events.201.a: "Laisser le Conseil d'allégeance statuer sur la succession."
 SAU_events.201.b: "Le roi nomme son héritier. Le Conseil l'applaudira."
 SAU_events.201.c: "Acheter plutôt le consentement de la famille."
 SAU_events.201.d: "La succession a été réglée par séniorité entre frères depuis 1953, ce qui fonctionnait tant qu'il y avait des frères et tant qu'ils pouvaient s'accorder. Il y en a de moins en moins des deux chaque année, et les deux dernières transitions furent gérées par des hommes qui ne sont plus là pour gérer la suivante.\n\nLa proposition sur la table est un conseil permanent des fils et petits-fils d'Abdelaziz, habilité à confirmer un prince héritier et à statuer sur l'aptitude d'un roi. Ce serait la première procédure écrite que le trône ait jamais eue. Ce serait aussi le premier organe de l'histoire du Royaume ayant une créance sur le roi lui-même, et tout le monde dans la pièce ne l'a pas manqué."
 SAU_events.201.t: "Consolider la Couronne"
 SAU_events.202.a: "Qu'ils parlent, et publier ce qu'ils disent."
 SAU_events.202.b: "Ils peuvent se réunir. L'ordre du jour est nôtre."
 SAU_events.202.d: "La salle est arrangée pour qu'un clerc chiite de Qatif siège à portée de voix d'un savant salafiste de Riyad, et des femmes sont présentes, derrière un écran, pour la première fois de l'histoire du Royaume. Rien de décidé ici n'oblige personne. C'est le but et aussi l'objection.\n\nLes délégués diront ce qu'on leur permet de dire. Combien cela fait n'est pas réglé, et les deux hommes qui le régleront ne s'accordent pas : l'un tient qu'une session qui ne change rien est pire qu'aucune session, l'autre qu'une session qui change quelque chose est la première d'une série que personne ne contrôle."
 SAU_events.202.t: "Le Dialogue national"
 SAU_events.203.a: "Accepter intégralement l'offre de Washington."
 SAU_events.203.b: "Le Mabahith s'occupera des siens."
 SAU_events.203.c: "Les réhabiliter. Les prisons n'en font que davantage."
 SAU_events.203.d: "Les compounds d'Al Hamra et d'Ishbiliya ont été bombardés par des hommes qui ont grandi ici, ont été scolarisés ici, et ont été financés par des œuvres enregistrées ici. Quelle qu'ait été la querelle supposée, elle est désormais démontrablement avec le Royaume lui-même.\n\nWashington offre une cellule de liaison, l'intégration des listes de surveillance et l'accès à des signaux qu'il n'a jamais partagés avec quiconque dans la région. Accepter, c'est des officiers américains lisant des dossiers saoudiens. Refuser, c'est le faire seuls, dans un pays où beaucoup de gens sont discrètement d'accord avec les poseurs de bombes."
 SAU_events.203.t: "Coopération antiterroriste"
 SAU_events.204.a: "La moitié des sièges, et des hommes sur les listes."
 SAU_events.204.b: "Les nommer tous et appeler cela consultation."
 SAU_events.204.c: "Mettre aussi les femmes sur les listes."
 SAU_events.204.d: "La moitié des sièges des conseils municipaux, élus ; l'autre moitié nommée ; et les conseils eux-mêmes avec autorité sur le drainage, l'éclairage des rues et les permis de construire. Personne au palais ne prétend que c'est un transfert de pouvoir.\n\nL'argument contre n'est pas que les conseils feront du mal. C'est que des Saoudiens auront voté, et qu'un précédent, contrairement à un décret, ne peut être discrètement retiré l'année suivante."
 SAU_events.204.t: "Organiser des élections municipales"
 SAU_events.205.a: "Il était consultatif jusqu'au bout."
 SAU_events.205.d: "Le Conseil siégeait quand l'ordre arriva, et l'ordre ne s'expliquait pas. Les membres furent remerciés de leur service en un communiqué de quatre lignes, le bâtiment fut fermé, et les dossiers qu'on leur avait permis de lire pendant des années revinrent aux ministères d'où ils venaient.\n\nIl siégeait par congé du roi. Il n'y a pas de roi, ou il n'y en a plus de la maison des Saoud, et donc il n'y a plus de Conseil. Personne à Riyad ne s'attendait à ce qu'il survive la semaine et personne ne l'a dit à haute voix."
 SAU_events.205.t: "Le Conseil est dissous"
 SAU_events.206.a: "Laissez passer."
 SAU_events.206.b: "La Couronne refuse la sanction."
 SAU_events.206.d: "Le banc réformiste l'a chiffré lui-même, ce qui est nouveau, et le chiffrage est optimiste, ce qui ne l'est pas. Des routes vers les villages que le réseau principal a sautés, de l'eau aux quartiers qui l'achètent encore par citerne, et une clause obligeant le ministère à publier ce qu'il dépense.\n\nC'est la dernière clause à laquelle le ministère s'oppose."
 SAU_events.206.t: "Le projet des réformistes"
 SAU_events.207.a: "Laissez passer."
 SAU_events.207.b: "La Couronne refuse la sanction."
 SAU_events.207.d: "Le banc traditionaliste propose ce qu'il a toujours proposé et n'a jamais pu mettre aux voix : les waqfs dûment financés, les allocations logement relevées, et un calendrier de cliniques pour les provinces qui n'en ont plus eu depuis le boom.\n\nLe ministère des Finances décrit l'arithmétique comme aspirationnelle. Le banc répond que l'arithmétique l'a été dans l'autre direction pendant trente ans."
 SAU_events.207.t: "Le projet des traditionalistes"
 SAU_events.208.a: "Laissez passer."
 SAU_events.208.b: "La Couronne refuse la sanction."
 SAU_events.208.d: "Les membres provinciaux se sont unis, ce que personne à Riyad ne s'attendait à les voir gérer. Des quotas d'embauche saoudiens avec des dents, la fin des arrangements de parrainage qui lient un travailleur à un seul employeur, et une inspection qui rend compte au Conseil plutôt qu'au ministère qu'elle inspecte.\n\nChaque maison marchande de Djeddah a écrit au palais cette semaine. Le banc le sait, et a programmé le vote quand même."
 SAU_events.208.t: "Le projet des provinciaux"
 SAU_events.209.a: "Trente sièges, par décret royal."
 SAU_events.209.b: "La chambre reste comme elle est."
 SAU_events.209.d: "Trente sièges, garantis par décret pour qu'aucun roi futur ne puisse laisser le nombre s'éteindre en silence — un cinquième de la chambre. Elles entreraient par une porte séparée et siégeraient dans une section séparée, et les photographies iraient bien plus loin que le plan de salle.\n\nUne quarantaine de savants seniors ont signé une lettre. La lettre ne menace rien, parce qu'elle n'en a pas besoin."
 SAU_events.209.t: "Des femmes au Conseil de la Choura"
 SAU_events.21.a: "Surveillez de près les développements."
 SAU_events.21.d: "Un mouvement jusqu'alors inconnu se nommant [ROOT.SAU_GetFrontName] a annoncé son existence à travers la Cisjordanie et à l'intérieur des frontières d'Israël. Dans des déclarations coordonnées, il jure une résistance armée jusqu'à la libération, s'attribuant une vague d'attaques récentes. Les services de renseignement s'empressent d'en retracer les origines, le financement et la portée."
 SAU_events.21.t: "Un nouveau front se lève en Terre sainte"
 SAU_events.210.a: "Le Golfe ne perd pas une monarchie."
 SAU_events.210.d: "MANAMA — Des blindés saoudiens ont franchi la chaussée roi Fahd avant l'aube et ont atteint la capitale sans tirer. Riyad décrit le déploiement comme une opération du Bouclier de la péninsule entreprise à la demande du gouvernement légitime de Bahreïn, et refuse de préciser quel gouvernement a fait la demande.\n\nTéhéran l'a appelée occupation. Washington a demandé la retenue de toutes parts et n'a demandé à personne de partir. La maison des Khalifa est de retour au palais, et l'arrangement qui l'y a mise est désormais affaire de registre public plutôt que d'entente privée."
 SAU_events.210.t: "La chaussée"
 SAU_events.211.a: "Pomper. Les champs sont la stratégie."
 SAU_events.211.b: "Bâtir l'industrie qui survit aux puits."
 SAU_events.211.c: "Prospecter. Il y en a davantage."
 SAU_events.211.d: "Abqaiq traite la plus grande part du brut du Royaume en une seule installation et Ras Tanura le charge dans une autre. Deux frappes réussies feraient plus de dégâts à l'économie mondiale que n'importe quelle armée de la région en un an, et le ministère a enfin été prié de dire à haute voix ce qu'il compte faire.\n\nIl y a de l'argent pour une réponse, pas trois. Pomper plus fort tant que les champs sont sûrs ; bâtir l'industrie qui survivrait à les perdre ; ou cesser de supposer que les champs que le Royaume a déjà sont tous les champs qu'il y a."
 SAU_events.211.t: "La stratégie de défense du pétrole"
 SAU_events.212.a: "Laisser le banc s'élever."
 SAU_events.212.d: "La loi était toujours adéquate. Ce qui manquait, c'était un banc disposé à l'appliquer vers le haut — un tribunal qui puisse citer un ministre, une commission qui puisse ouvrir les comptes d'un prince, et un juge qui aurait encore une carrière ensuite.\n\nCela fonctionnera exactement aussi bien que la patience du roi à son égard, et chacun qui pourrait être cité le sait. L'argent cesse déjà de bouger la semaine où les tribunaux sont annoncés."
 SAU_events.212.t: "Les tribunaux de la corruption"
 SAU_events.213.a: "Personne n'est au-dessus du dossier."
 SAU_events.213.d: "Quelque deux cents princes, ministres et hommes d'affaires sont retenus dans l'hôtel le plus cher du pays pendant des mois. Cent milliards de dollars seraient recouvrés. Nulle charge n'est publiée, nuls verdicts rendus, et les libérations se négocient une à une.\n\nOn le décrit comme une campagne anticorruption. Cela fonctionne comme le moment où la famille cessa d'être un collectif et commença d'être un public, et chaque investisseur de la terre l'a vu."
 SAU_events.213.t: "Le Ritz-Carlton"
 SAU_events.214.a: "Régler ça en silence. C'était toujours prévu."
 SAU_events.214.d: "Les libérations se négocient une à une et les termes ne sont jamais publiés : une société cédée ici, une fondation dissoute là, la place d'un fils discrètement garantie. Tous les concernés comprennent que ce ne sont pas des instruments juridiques mais politiques.\n\nL'argent rentre dans le pays presque aussitôt, parce que les hommes qui le rendent ont désormais une raison de le garder là où on peut le surveiller. Le dossier de chacun d'eux reste ouvert dans un tiroir à Riyad."
 SAU_events.214.t: "Offres de porte dérobée"
 SAU_events.215.a: "La famille devra trouver autre chose à se disputer."
 SAU_events.215.d: "Les princes comptaient encore le soutien les uns des autres quand les officiers cessèrent de compter quoi que ce soit. Il n'y a pas d'héritier à nommer, parce qu'il n'y a pas de trône à hériter — le Conseil a retiré la question de la table et n'entend pas la y remettre.\n\nLes hommes qui ont passé les dernières années à assembler leurs factions ont découvert qu'une faction ne vaut que ce que vaut l'institution derrière elle, et que l'institution derrière toutes était la monarchie."
 SAU_events.215.t: "La succession est close"
 SAU_events.216.a: "Qu'ils le prêchent ouvertement."
 SAU_events.216.b: "Le garder aux messes."
 SAU_events.216.c: "Leur dire que le Royaume n'a qu'un roi à la fois."
 SAU_events.216.d: "Les gens de Moutaïb ont posé la même question au Diwan pour la troisième fois cette année, et cette fois ils n'ont pas pris la peine de la formuler en question. Le Royaume se dit gardien des deux mosquées et se comporte en client. Fayçal ne le faisait pas. Voilà tout l'argument et il ne se complique pas à l'examen.\n\nLa succession n'est pas réglée, ce qui signifie que tout ce qui se dit maintenant se dit devant des hommes qui choisissent leur camp."
 SAU_events.216.t: "Le cercle redemande"
 SAU_events.217.a: "Le Royaume continue."
 SAU_events.217.d: "Riyad a annoncé la mort du roi Fahd ben Abdelaziz Al Saoud, qui tint le trône vingt-trois ans et, depuis l'accident vasculaire de 1995, tint fort peu du travail qui allait avec. Le Royaume qu'il laisse fut gouverné en son nom et de la main de son frère pendant une décennie, et la transition annoncée ce matin change le titre sur les documents plutôt que l'homme qui les signe.\n\nLe prince héritier Abdallah accède. Il a déjà passé quatre-vingts ans. Les hommes qui comptent ne le regardent pas — ils regardent au-delà, vers qui sera nommé ensuite."
 SAU_events.217.t: "La mort du roi Fahd"
 SAU_events.218.a: "La succession est désormais l'histoire."
 SAU_events.218.d: "Le roi Abdallah ben Abdelaziz Al Saoud est mort, et avec lui s'en va le dernier des frères qui pouvaient revendiquer le trône par la seule séniorité sans qu'on pose une seconde question. Il a été enterré dans une tombe anonyme à al-Oud, comme le rite l'exige et comme chaque roi avant lui.\n\nSalmane accède en quelques heures. Ce qui suit est la part que le Royaume diffère depuis trente ans : la couronne devra un jour passer à une génération qui n'y a pas de droit automatique, et chaque prince encore vivant le sait."
 SAU_events.218.t: "La mort du roi Abdallah"
 SAU_events.219.a: "Longue vie au roi."
 SAU_events.219.d: "Le roi est mort. Riyad a publié l'annonce avec l'économie de langue qu'elle réserve au trône, et le prince héritier a déjà reçu la bay'ah des princes aînés, des oulémas et des hommes qui commandent la Garde.\n\nLe règne qui s'achève aujourd'hui commença avec un vieil homme et un Royaume qui tournait encore sur l'entente que la couronne se déplaçait latéralement entre frères. Il s'achève avec cette entente disparue, démontée par le roi lui-même, au profit d'une succession que le monde a été invité à tenir pour réglée."
 SAU_events.219.t: "La mort du roi Salmane"
 SAU_events.22.a: "Laisser le pétrole couler vers le sud."
 SAU_events.22.b: "Notre terre n'est pas une autoroute saoudienne."
 SAU_events.22.d: "Les Saoudiens demandent à faire passer un oléoduc par nos provinces du sud jusqu'à la mer d'Arabie. Les droits de transit rempliraient notre trésor, et Riyad nous devrait une faveur qu'il ne peut facilement rembourser."
 SAU_events.22.t: "Un oléoduc vers la mer"
 SAU_events.24.a: "Construire l'oléoduc."
 SAU_events.24.b: "Décliner l'offre."
 SAU_events.24.d: "L'Arabie saoudite offre de faire passer son pétrole par notre terre vers la Turquie et l'Europe. L'Irak deviendrait le pont entre le Golfe et l'Occident, et les recettes de transit reconstruiraient la nation."
 SAU_events.24.t: "L'oléoduc vers l'Europe"
 SAU_events.25.a: "Les renvoyer les mains vides."
 SAU_events.25.d: "La maison des Saoud envoie des émissaires proposant un oléoduc sur notre sol. Ils oublient qui gouverne ici. L'Irak ne s'incline devant personne, encore moins devant Riyad."
 SAU_events.25.t: "Un émissaire saoudien à Bagdad"
 SAU_events.26.a: "Excellent."
 SAU_events.26.d: "Les soudeurs posent le dernier tronçon et les vannes s'ouvrent. Le brut saoudien coule désormais le long d'une nouvelle artère vers la mer, et l'emprise du Royaume sur l'énergie mondiale se resserre."
 SAU_events.26.t: "Le pétrole coule"
 SAU_events.27.a: "Nous trouverons une autre voie."
 SAU_events.27.d: "L'accord a échoué. Pour l'heure, cette route vers la mer reste hors de notre portée, et Ormuz demeure notre seule porte."
 SAU_events.27.t: "La route est fermée"
 SAU_events.28.a: "Un revers coûteux."
 SAU_events.28.d: "La guerre a atteint l'oléoduc. Des saboteurs ont réduit un tronçon en ruine et le pétrole a cessé de couler. Tant que le Yémen du Sud n'est pas assuré, la route de la mer d'Arabie est perdue."
 SAU_events.28.t: "L'oléoduc est coupé"
 SAU_events.29.a: "Ouvrir la route."
 SAU_events.29.b: "Décliner les Saoudiens."
 SAU_events.29.d: "Riyad demande à faire passer un oléoduc par notre royaume vers la Méditerranée. Les seuls droits de transit raffermiraient nos finances, et les Saoudiens sont des amis généreux."
 SAU_events.29.t: "Un pipeline à travers la Jordanie"
 SAU_events.3.a: "Accepter l'offre saoudite."
 SAU_events.3.b: "Décliner l'offre saoudite."
 SAU_events.3.d: "Riyad offre aux entreprises chinoises l'accès à des projets agricoles et énergétiques saoudiens. Accepter approfondirait les liens économiques entre la Chine et le Royaume."
 SAU_events.3.t: "[SAU.GetFlag] Accord entre l'Arabie saoudite et la Chine [CHI.GetFlag]"
 SAU_events.30.a: "Accueillir l'oléoduc."
 SAU_events.30.b: "La Syrie n'est pas à vendre."
 SAU_events.30.d: "La Jordanie ayant accepté, les Saoudiens proposent d'acheminer leur pétrole par notre terre jusqu'à la mer. Une Syrie libre et prospère y gagnerait largement, et l'amitié de Riyad vaut d'être eue."
 SAU_events.30.t: "Une offre de Riyad"
 SAU_events.300.a: "Technocrates indépendants."
 SAU_events.300.b: "La supervision royale est essentielle."
 SAU_events.300.c: "Faire venir des experts étrangers."
 SAU_events.300.d: "La §Lloi sur le marché des capitaux§! est signée. Il faut maintenant décider : qui siégera à la tête de la nouvelle §LAutorité du marché des capitaux§! ? Les technocrates exigent l'indépendance ; la §HCour royale§! exige la tutelle ; des conseillers étrangers offrent leur expérience. Le choix définira l'architecture financière du royaume pour une génération."
 SAU_events.300.t: "§HDécret royal M/30 - Mise en œuvre§!"
 SAU_events.301.a: "Le cadre anglo-saxon."
 SAU_events.301.b: "Le cadre charia d'abord."
 SAU_events.301.c: "Un modèle hybride."
 SAU_events.301.d: "L'incorporation formelle remodelera le paysage des entreprises. Sociétés par actions, sociétés à responsabilité limitée — le §LRoyaume§! doit choisir son modèle. Le cadre §Langlo-saxon§! offre l'efficacité au prix de l'influence étrangère ; le cadre §Lcharia d'abord§! offre la légitimité au prix de la vitesse ; l'§Lhybride§! prend une voie moyenne mesurée."
 SAU_events.301.t: "§HLes réformes juridiques de 2007§!"
 SAU_events.310.a: "Formation et partenariat américains"
 SAU_events.310.b: "Défense collective du CCG"
 SAU_events.310.c: "Un professionnalisme à la manière de l’OTAN"
 SAU_events.310.d: "Autonomie domestique"
 SAU_events.310.desc: "L'opération Tempête du désert a humilié chaque armée qui la regarda. Les Forces terrestres royales saoudiennes se sont comportées convenablement aux côtés de leurs partenaires de coalition — mais l'état-major sait la vérité : sans la puissance aérienne, la logistique et le commandement américains, l'armée du Royaume n'était pas prête.\n\nLes wargames sont finis, et le verdict est là. Le Royaume doit maintenant choisir le modèle sur lequel reconstruire ses forces armées. Chaque voie nous rend plus forts d'un côté et plus faibles de l'autre — il n'y a pas de choix gratuit.\n\n§YSurvolez chaque option pour voir exactement ce qu'elle accorde et ce qu'elle coûte.§!"
 SAU_events.310.t: "Wargames : leçons de la guerre du Golfe"
 SAU_events.311.a: "Garde nationale : garde du régime"
 SAU_events.311.b: "Garde nationale : levées tribales"
 SAU_events.311.c: "Garde nationale : sécurité intérieure"
 SAU_events.311.desc: "La Garde nationale saoudienne doit décider à quoi elle sert vraiment. Chaque voie est un compromis durable — elle nous rend plus forts d'un côté et plus faibles de l'autre.\n\n§YSurvolez une option pour voir exactement ce qu'elle accorde et coûte.§!"
 SAU_events.311.t: "Exercices de préparation de la Garde nationale"
 SAU_events.312.a: "Armure : choc et percée"
 SAU_events.312.b: "Armure : armes combinées"
 SAU_events.312.c: "Armure : Mur défensif"
 SAU_events.312.desc: "Comment le corps blindé combattra-t-il avec ses nouveaux Abrams ? Chaque voie est un compromis durable — elle nous rend plus forts d'un côté et plus faibles de l'autre.\n\n§YSurvolez une option pour voir exactement ce qu'elle accorde et coûte.§!"
 SAU_events.312.t: "Programme de tir Abrams"
 SAU_events.313.a: "Artillerie : feux massifs"
 SAU_events.313.b: "Artillerie : tirs de précision"
 SAU_events.313.c: "Artillerie : tirer et se déplacer"
 SAU_events.313.desc: "Les artilleurs affinent leur métier — mais dans quelle direction ? Chaque voie est un compromis durable — elle nous rend plus forts d'un côté et plus faibles de l'autre.\n\n§YSurvolez une option pour voir exactement ce qu'elle accorde et coûte.§!"
 SAU_events.313.t: "Exercice d'artillerie à tir réel"
 SAU_events.314.a: "Aviation militaire : tueurs de chars"
 SAU_events.314.b: "Aviation de l'armée : appui rapproché"
 SAU_events.314.c: "Aviation militaire : reconnaissance et raids"
