 un_ga_manipulate_vote_tt: "En dépensant du pouvoir politique et de l'influence, nous pouvons déplacer une résolution en tête de liste, facilitant l'arrivée au vote plus rapide de la mesure que nous voulons. De même, nous pouvons dépenser de l'influence pour déplacer des résolutions en fin de liste.\n\n§YClic gauche :§!\nDéplacer la résolution en tête de file.\n\n§YClic droit :§!\n\n§RAVERTISSEMENT :§! En déplaçant des votes en tête de liste, ils ne contourneront pas les votes de confirmation de sièges au §YConseil de sécurité§! de l'§BONU§!, ni les votes de §Rsanctions pour raids§!."
