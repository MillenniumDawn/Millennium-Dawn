 GRN_national_decisions: "Decisões Nacionais da Groenlândia"
 GRN_national_decisions_desc: "A ilha da Groenlândia vive uma situação muito tranquila, mas também tensa. Além das tentativas dos líderes políticos de fazer, bem, qualquer coisa para desenvolver a ilha e sua população, ela também precisa lidar com a questão sempre premente da eventual independência. Alguns a querem agora, outros querem esperar por uma base mais estável. De qualquer forma, caberá tanto à Groenlândia quanto à Dinamarca decidir se a ilha será de fato livre no fim das contas."
 GRN_decision_independence_war: "Guerra de Independência"
 GRN_decision_independence_war_desc: "A hora chegou e os políticos forçaram a mão do povo. A guerra está declarada e agora é uma corrida para ver se a Dinamarca consegue manter sua coroa ou se o controle da coroa se desfará quando a pressão pública forçar uma paz entre todas as partes."
 GRN_decision_capital_city_expansion: "Expansão da Capital"
 GRN_decision_capital_city_expansion_desc: "Com nossa população nacional crescendo em proporções que nunca previmos de verdade, precisaremos reformular a capital, Nuuk, para refletir e integrar melhor o crescimento regional e nacional geral."
 GRN_decision_development_visa_grants: "Concessão de Vistos de Desenvolvimento"
 GRN_decision_development_visa_grants_desc: "Nosso principal problema para o desenvolvimento da nação é pura e simplesmente a falta de recursos humanos. Para chegar a algum lugar, precisamos investir pesado em atrair trabalhadores estrangeiros dispostos a suportar mais o ambiente do que os potenciais incentivos monetários luxuosos e os empregos que podemos oferecer."
 GRN_decision_global_recruitment_efforts: "Esforços de Recrutamento Global"
 GRN_decision_global_recruitment_efforts_desc: "Com a defesa nacional agora sob nosso controle direto, sofremos do mesmo problema que temos como nação em geral: a falta de mão de obra. Precisaremos fazer essencialmente algo semelhante às Concessões de Desenvolvimento, mas para os militares. Com sorte, à medida que nossa economia se tornar mais robusta e nosso orçamento mais flexível para permitir esse tipo de despesa, poderemos incentivar bastante mercenários ou almas errantes sem um lar permanente a escolher o nosso como seu lar definitivo."
 GRN_decision_naval_priority_act: "Lei de Prioridade Naval"
 GRN_decision_naval_priority_act_desc: "Para ter qualquer presença na região mais próxima de nós, precisamos ter uma marinha. O problema é que não temos capacidade econômica para simplesmente construí-las com calma, por assim dizer. Assim, precisamos essencialmente recrutar à força o máximo de instalações e complexos de construção naval, o mais próximos possível uns dos outros, para montar rapidamente uma frota básica. Vai ser extremamente caro, mas também será ficar sentado esperando que algo realmente a nosso favor aconteça."
 GRN_decision_project_vortex: "Projeto Vortex"
 GRN_decision_project_vortex_desc: "Garantir a passagem naval no extremo norte é problemático devido à ideia de adquirirmos supremacia naval em regiões estratégicas. Para remediar isso, criaremos a melhor demonstração de força naval que pudermos com nossos meios atuais."
 GRN_decision_national_commission: "Comissão Nacional"
 GRN_decision_national_commission_desc: "Com o processo de elaboração concluído e os protótipos declarados satisfatórios, agora organizaremos uma comissão nacional para ajudar a construir nosso primeiro Encouraçado."
 GRN_decision_project_northern_projection: "Projeto Projeção Norte"
 GRN_decision_project_northern_projection_desc: "Com as coisas estáveis e prontas para as verdadeiras ambições de nossa nação, precisaremos controlar várias zonas marítimas. Assim, podemos garantir isso trabalhando com construtores navais de todo o país para criar o que será o 2º Grupo de Batalha do Ártico."
 GRN_southern_interior_development_decisions: "Projetos de Desenvolvimento do Interior Sul"
 GRN_southern_interior_development_decisions_desc: "Com nossa nação estabilizada, econômica e socialmente, por meio de nossas iniciativas populacionais, agora podemos olhar para o interior do país. O Planalto Sul será o primeiro grande passo rumo a domar a Grande Plataforma de Gelo."
 GRN_decision_fort_vortex: "Fort Vortex"
 GRN_decision_fort_vortex_desc: "Começaremos nossa jornada rumo ao interior sul estabelecendo uma cidade-forte chamada Fort Vortex."
 GRN_decision_glacial_shine: "Glacial Shine"
 GRN_decision_glacial_shine_desc: "Nosso próximo assentamento mais central se chamará Glacial Shine."
 GRN_decision_frostbury: "Frostbury"
 GRN_decision_frostbury_desc: "Estabeleceremos o assentamento de Frostbury logo a leste da capital de nossa nação."
 GRN_decision_fort_seal: "Fort Seal"
 GRN_decision_fort_seal_desc: "Estabeleceremos um assentamento-forte estratégico no centro-leste, ao longo da fronteira entre o interior sul e o planalto central."
 GRN_decision_southern_interior_basic_roads: "Obras Rodoviárias Básicas do Interior Sul"
 GRN_decision_southern_interior_basic_roads_desc: "Com nossos assentamentos totalmente estabelecidos, agora podemos com segurança criar uma forma básica de transporte terrestre para conectar e suprir as necessidades desses novos bastiões da civilização."
 GRN_decision_southern_interior_improved_roads: "Estradas Melhoradas do Interior Sul"
 GRN_decision_southern_interior_improved_roads_desc: "Investimentos contínuos na rede rodoviária permitirão um melhor volume de fluxo de tráfego, além de estabelecer medidas de segurança adequadas e mais contínuas para viajar em condições tão longas e perigosas."
 GRN_decision_great_polar_railway: "Grande Ferrovia Polar"
 GRN_decision_great_polar_railway_desc: "Assegurar o desenvolvimento de uma rede ferroviária racionalizada e eficiente nos permite transportar pessoas e materiais em grande volume. Isso nos permite, por fim, começar de vez a trabalhar na construção de uma economia para a região do zero."
 GRN_decision_basic_industrial_jobs: "Empregos Industriais Básicos"
 GRN_decision_basic_industrial_jobs_desc: "Assegurar uma forma básica de atividade econômica nos permite financiar o desenvolvimento do interior de maneira mais direta e pode nos permitir expandir para outros setores econômicos sempre que possível."
 GRN_decision_local_food_supply: "Suprimento Local de Alimentos"
 GRN_decision_local_food_supply_desc: "O desenvolvimento estratégico de HFFs nos permite criar suprimentos locais de alimentos para os assentamentos e, assim, não só usamos mais da água congelada, como também ajudamos a fazer crescer internamente esses centros populacionais ainda incipientes. As Instalações de Agricultura Rigorosa serão a lança para perfurar a fera congelada que é a plataforma."
 GRN_decision_extensive_geological_surveying: "Levantamento Geológico Extensivo"
 GRN_decision_extensive_geological_surveying_desc: "Com a vastidão que é o interior, precisaremos investir pesado nessas operações estratégicas, além de montar algumas Instalações de Agricultura Rigorosa dedicadas, projetadas para lidar com plantas produtoras de borracha. Esses resultados devem se mostrar extremamente frutíferos pelo tempo e capital que estamos investindo em tudo isso."
 GRN_decision_creating_dedicated_mining_operations: "Criando Operações de Mineração Dedicadas"
 GRN_decision_creating_dedicated_mining_operations_desc: "Com a detecção de jazidas esparsas e pouco conhecidas de vários recursos minerais, também começamos a expandir o trabalho de base para mais HFFs voltadas à produção de borracha. Continuar essas iniciativas certamente só ajudará nossa causa."
 GRN_decision_regional_economic_sector_synergy: "Sinergia do Setor Econômico Regional"
 GRN_decision_regional_economic_sector_synergy_desc: "Por meio de um vasto e extenso investimento de mão de obra, recursos e financiamento monetário, poderemos expandir as operações de mineração a um ponto em que possamos criar diversidade econômica local. Em breve poderemos criar uma sinergia regional, como no resto da economia da nação."
 GRN_central_plateau_development_decisions: "Projetos de Desenvolvimento do Planalto Central"
 GRN_central_plateau_development_decisions_desc: "Com o Interior Sul em sinergia econômica e social, agora podemos começar a construir as bases para fazer o mesmo aqui, no Planalto Central. Tudo isso será caro, mas, a longo prazo, certamente valerá a pena."
 GRN_decision_fort_frostfields: "Fort Frostfields"
 GRN_decision_fort_frostfields_desc: "Criaremos um assentamento-forte chamado Fort Frostfields no oeste, relativamente perto da cidade de Sisimuit."
 GRN_decision_frigidville: "Frigidville"
 GRN_decision_frigidville_desc: "Seguindo para o leste, criaremos o assentamento de Frigidville. Mais alguém está ficando sem nomes temáticos?"
 GRN_decision_aurora: "Aurora"
 GRN_decision_aurora_desc: "Na seção mais central do planalto, acredito que criaremos o assentamento adequado de Aurora."
 GRN_decision_snowdenson: "Snowdenson"
 GRN_decision_snowdenson_desc: "Virando para o sul, criaremos o assentamento de Snowdenson para fazer a ponte entre Glacial Shine e Aurora para atividades econômicas inter-regionais."
 GRN_decision_blizzards_peak: "Blizzard's Peak"
 GRN_decision_blizzards_peak_desc: "Voltando ao norte e seguindo para o leste, criaremos o assentamento de Blizzard's Peak, pois alguns dos pontos mais altos ficam na região geral."
 GRN_decision_crystal_flake: "Crystal Flake"
 GRN_decision_crystal_flake_desc: "Seguindo mais para o leste, e como o segundo mais próximo da região costeira oriental, criaremos o assentamento de Crystal Flake."
 GRN_decision_snowberry: "Snowberry"
 GRN_decision_snowberry_desc: "Na área de fronteira nordeste entre o planalto e as regiões costeiras do leste, criaremos a cidade de nome pitoresco, Snowberry."
 GRN_decision_plateau_interior_basic_roads: "Rede Rodoviária Básica do Planalto Central"
 GRN_decision_plateau_interior_basic_roads_desc: "Com os assentamentos criados, agora podemos começar a construir as bases elementares de uma rede rodoviária por todo o planalto. Esse trabalho de base ajudará a tornar as viagens mais suaves e diretas do que simplesmente dirigir sobre o próprio terreno perigoso."
 GRN_decision_plateau_interior_improved_roads: "Obras Rodoviárias Melhoradas do Planalto Central"
 GRN_decision_plateau_interior_improved_roads_desc: "Com as obras de base concluídas, agora podemos investir na padronização de medidas de segurança, bem como em outras instalações necessárias para atravessar a extensa paisagem."
 GRN_decision_central_arctic_railroad: "Ferrovia Ártica Central"
 GRN_decision_central_arctic_railroad_desc: "Partindo da GPR no Interior Sul, bem como da rede ferroviária costeira, agora podemos solidificar o principal transporte em grande volume por toda a nossa nação. Assim, o planalto abrigará a Ferrovia Ártica Central, ou CARR."
 GRN_decision_basic_industrial_jobs_two: "Mercado de Empregos Industriais Básicos"
 GRN_decision_basic_industrial_jobs_two_desc: "Com as pessoas e a infraestrutura estabelecidas, agora podemos começar a criar alguma forma de atividade econômica no Planalto Central."
 GRN_decision_local_food_supply_two: "Estabelecendo o Suprimento Local de Alimentos"
 GRN_decision_local_food_supply_two_desc: "Usando os modelos de HFF que empregamos em todo o país, podemos criar instalações dedicadas para ajudar a aliviar a pressão na criação de cadeias locais de suprimento de alimentos."
 GRN_decision_extensive_geological_surveying_two: "Planalto Central: Levantamentos Geológicos em Massa"
 GRN_decision_extensive_geological_surveying_two_desc: "Pessoas, lugares, infraestrutura, empregos e comida. Tudo assegurado e tudo pronto para escavar fundo no gelo e nas terras abaixo do próprio tempo."
 GRN_decision_creating_dedicated_mining_operations_two: "Planalto Central: Operações de Mineração Dedicadas"
 GRN_decision_creating_dedicated_mining_operations_two_desc: "Com os dados do levantamento em nossas mãos e as minas iniciais de reconhecimento estabelecidas, agora podemos começar a expandir e criar mais minas dedicadas e o aparato operacional ao redor delas."
 GRN_decision_regional_economic_sector_synergy_two: "Planalto Central: Sinergia Intersetorial Econômica"
 GRN_decision_regional_economic_sector_synergy_two_desc: "O trecho mais longo e mais caro da jornada está à nossa frente. Mas, ao contemplarmos as brilhantes paisagens de gelo do vasto planalto central, podemos absorver tudo e sentir a pura e feliz satisfação de que finalmente conseguimos. Pois a Groenlândia é de fato a terra das feras."
 GRN_faction_polar_defense_league: "Liga de Defesa Polar"
 greenland_event.1.t: "Referendo de Autogoverno"
 greenland_event.1.d: "Em breve o parlamento votará pela ampliação das disposições que a Lei de Autonomia de 79 estabeleceu. Se o voto for sim, itens como a educação, a saúde e os sistemas judiciais, bem como o controle total da guarda costeira, ficarão sob total controle do governo groenlandês."
 greenland_event.1.o1: "O Parlamento Aprova a Lei de Autogoverno"
 greenland_event.1.o2: "O Parlamento Mantém o Status Quo"
 greenland_event.2.t: "Lei de Autogoverno da Groenlândia"
 greenland_event.2.d: "A Groenlândia votou para ampliar seus direitos sob a Lei de Autonomia de 1979 e substituí-la pela Lei de Autogoverno de 2008. A lei lhe dá o controle de vários órgãos governamentais, bem como da guarda costeira. Podemos aprovar o voto, já que houve maioria, ou podemos bloqueá-lo alegando que as finanças da nação não conseguiriam sustentar a operação independente de todos esses sistemas sem aumentar os subsídios coloniais que fornecemos."
 greenland_event.2.o1: "Aprovar o Voto"
 greenland_event.2.o2: "Negar o Voto"
 greenland_event.300.t: "A Dinamarca Aprova o Voto"
 greenland_event.300.d: "Hoje cedo recebemos a notícia de que o parlamento dinamarquês aprovou, como esperado, o nosso voto pela nova Lei de Autogoverno. Este será um grande passo rumo à nossa independência e, portanto, a um futuro que só nós podemos definir."
 greenland_event.300.o1: "Espera, Eles Podiam Negar Isso?"
 greenland_event.3.t: "A Dinamarca Bloqueia o Voto"
 greenland_event.3.d: "O parlamento dinamarquês achou por bem negar o nosso voto para ampliar a Lei de Autonomia com a nova Lei de Autogoverno. Eles alegam supostas preocupações fiscais, afirmando que a nossa assunção do controle exigiria subsídios dinamarqueses maiores. Podemos declarar independência, o que causaria um conflito local, ou aceitar a situação e nos preparar para desfechos possivelmente piores adiante."
 greenland_event.3.o1: "Lutar. Com Que Exército?"
 greenland_event.3.o2: "Pela Groenlândia Livre!!!"
 greenland_event.4.t: "Guerra Declarada!"
 greenland_event.4.d: "With the blocking of the Greenlandic Self Government Act vote, the government of Greenland has taken upon themselves to force their independence. As such we must bring Greenland back under the crown."
 greenland_event.4.o1: "Greenland stays Danish"
 greenland_event.5.t: "Reformulando os Investimentos em Automação"
 greenland_event.5.d: "Nossa economia está sempre em dificuldades e isso se deve simplesmente ao fato de não termos gente suficiente. Nossa renda per capita é tão instável que os contadores às vezes nem querem fazer nossos livros-caixa, por causa das mudanças descontroladas nas despesas internas, simplesmente porque nossa economia muda o tempo todo. Por isso precisamos de um fator crítico de estabilização, que neste caso será um investimento direto e abrangente em automação em um setor econômico específico. A redução geral da necessidade de trabalhadores nesse setor deve diminuir bastante a natureza volátil da economia."
 greenland_event.5.o1: "O Setor Agrícola"
 greenland_event.5.o2: "O Setor da Indústria Bélica"
 greenland_event.5.o3: "O Setor da Indústria Civil"
 greenland_event.5.o4: "O Setor de Escritórios e Tecnologia"
 greenland_event.6.t: "A Questão da Mineração"
 greenland_event.6.d: "Com os esforços para ampliar e iniciar operações comerciais de mineração, surge a questão principal. Vamos minerar por necessidade ou por ganância? A mineração por necessidade resultaria em esforços modestos de extração, voltados às necessidades internas da nação. Já a mineração por ganância ampliaria as operações de forma significativa para atender à demanda interna e externa, ao custo de uma maior necessidade de mão de obra para cumprir as expectativas operacionais."
 greenland_event.6.o1: "As Necessidades da Nossa Nação"
 greenland_event.6.o2: "Os Fins Justificam os Meios"
 greenland_event.7.t: "Ambições Políticas"
 greenland_event.7.d: "Com o palco montado, nosso povo está ao mesmo tempo animado e preocupado. Nunca antes se acreditou ser possível tamanha liberdade de pensamento, quando éramos uma colônia da coroa dinamarquesa. Mas agora, com nossas novas liberdades, podemos garantir a tranquilidade de espírito e criar o futuro político que desejamos."
 greenland_event.7.o1: "Pensamento Absolutamente Livre"
 greenland_event.7.o2: "As Ideias Emergentes Prevalecem"
 greenland_event.7.o3: "As Mentes Neutras Triunfam"
 greenland_event.7.o4: "O Orgulho Nacional Impulsiona o Progresso"
 greenland_influence_event.1.t: "Investimentos Groenlandeses"
 greenland_influence_event.1.d: "A Groenlândia nos procurou com uma oferta para ajudar a investir na construção da nossa nação. Embora haja algumas preocupações quanto à natureza desses investimentos, a ilha da Groenlândia, mesmo com seus avanços, não representa uma ameaça real à nossa situação interna, ao menos quando comparada às demais partes interessadas."
 greenland_influence_event.1.o1: "Coisa de Graça É Bom"
 greenland_influence_event.1.o2: "Obrigado, Mas Não, Obrigado"
 greenland_influence_event.2.t: "A Islândia Aceita a Infraestrutura"
 greenland_influence_event.2.d: "Nosso primeiro investimento foi aceito, o que aumentará a nossa influência e os nossos laços com a nação."
 greenland_influence_event.2.o1: "O Próximo Investimento, Por Favor"
 greenland_influence_event.3.t: "Energia Groenlandesa"
 greenland_influence_event.3.d: "A Groenlândia nos procurou com outro investimento, desta vez no setor de energia. Eles desejam instalar algumas usinas de geração de energia úteis, sem favorecer nenhum tipo específico de geração. Poderíamos usar as instalações gratuitas de geração de energia para fomentar melhores relações comerciais, mas alguns temem que a Groenlândia possa usá-las para minar o nosso governo."
 greenland_influence_event.3.o1: "Energia Mais Barata É Bom"
 greenland_influence_event.3.o2: "Nossas Necessidades de Energia Não São da Sua Conta"
 greenland_influence_event.4.t: "A Islândia Aceita as Instalações de Energia"
 greenland_influence_event.4.d: "Nossa segunda rodada de investimentos para ajudar a construir a capacidade de geração de energia deles foi aceita. Só nos resta esperar que, se precisarem de combustível para as usinas fósseis, negociem conosco para continuar fomentando melhores relações."
 greenland_influence_event.4.o1: "Enviar o Próximo Investimento"
 greenland_influence_event.5.t: "Investimento da Polar Industries"
 greenland_influence_event.5.d: "A Groenlândia está de volta, desta vez com amplos investimentos no nosso desenvolvimento econômico. De investimentos industriais a investimentos no setor de escritórios, vemos que a Groenlândia está começando a despejar talvez um pouco demais na nossa nação. Embora não tenham muito com que gastar, talvez devêssemos pisar no freio aqui."
 greenland_influence_event.5.o1: "Uma Economia Melhor, Por Que Não"
 greenland_influence_event.5.o2: "Naaah. Acho Que Sei o Seu Jogo"
 greenland_influence_event.6.t: "A Islândia Aceita os Investimentos Econômicos"
 greenland_influence_event.6.d: "Nosso crescente portfólio de investimentos tem sido um grande sucesso, pois encontramos meios estratégicos de fazer o governo da Islândia aceitar nossas generosas ofertas. Agora só precisamos capitalizar esses sucessos."
 greenland_influence_event.6.o1: "Mais um Empurrão e Resolvemos"
 greenland_influence_event.7.t: "Investimentos em Recursos Estratégicos"
 greenland_influence_event.7.d: "A Groenlândia ajudou a conduzir extensos levantamentos geológicos e encontrou depósitos comerciais limitados de ferro, cobre, níquel e outros recursos que poderiam beneficiar a nossa economia interna. Eles também se mostraram dispostos a ampliar a nossa indústria de alumínio para compensar possíveis perdas. Poderíamos realmente usar esses recursos para reduzir nossa dependência de certas fontes estrangeiras, mas será que podemos nos dar ao luxo de ficar em dívida com nosso vizinho?"
 greenland_influence_event.7.o1: "Precisamos Muito Desses Recursos"
 greenland_influence_event.7.o2: "É Arriscado Demais, Negado"
 greenland_influence_event.8.t: "A Arte da Negociação"
 greenland_influence_event.8.d: "A Islândia aceitou nosso investimento em recursos estratégicos e, assim, conseguimos concluir nossa rodada completa de investimentos. Com isso em mente, preparamos o terreno para garantir uma possível união em um futuro não muito distante."
 greenland_influence_event.8.o1: "Valeu a Pena"
 greenland_influence_event.10000.t: "Investimento Rejeitado"
 greenland_influence_event.10000.d: "Com a Islândia rejeitando nossa proposta, estamos oficialmente sem opções diplomáticas. Tentaremos esperar o máximo que pudermos, mas chegou a hora da fase final."
 greenland_influence_event.10000.o1: "Preparar a Operação Real Green"
 greenland_subterfuge_event.1.t: "Grande Investimento Groenlandês"
 greenland_subterfuge_event.1.d: "A Groenlândia nos procurou com uma oferta muito lucrativa. Eles estão dispostos a fazer uma rodada completa de investimentos em atacado para fazer a nossa nação crescer. Uma oportunidade dessas parece quase absurda, mas a ilha não tem muito a seu favor. Além disso, o que a Groenlândia poderia fazer para nos afetar no quadro geral das coisas?"
 greenland_subterfuge_event.1.o1: "Obrigado Pela Sua Generosidade"
 greenland_subterfuge_event.1.o2: "Isso É Bom Demais Para Ser Verdade, Negado"
 greenland_subterfuge_event.2.t: "A Islândia Aceita a Nossa Generosidade"
 greenland_subterfuge_event.2.d: "Com o governo islandês aceitando nossos robustos investimentos, agora podemos usá-los para perturbar a paz e alterar o status quo o suficiente para isolar a ilha da interferência da OTAN."
 greenland_subterfuge_event.2.o1: "Agora Esperamos"
 greenland_subterfuge_event.3.t: "Descobrindo a Origem"
 greenland_subterfuge_event.3.d: "Os recentes surtos de agitação e discórdia social parecem estar ligados a certos investimentos da Groenlândia. Essas novas frentes causaram um leve desconforto em nossa sociedade; no entanto, se deixarmos como está, poderemos enfrentar sérios problemas adiante. É arriscado, mas podemos optar por combater as continuadas artimanhas ou resolver a questão de vez, derrotando a causa raiz."
 greenland_subterfuge_event.3.o1: "Eles Sequer Têm um Exército?"
 greenland_subterfuge_event.3.o2: "Temos a OTAN, Ficaremos Bem"
 greenland_subterfuge_event.10000.t: "Investimento Negado"
 greenland_subterfuge_event.10000.d: "A Islândia negou nossa melhor oferta; se não vão aceitar, não temos escolha a não ser nos preparar para o pior."
 greenland_subterfuge_event.10000.o1: "Preparar a Operação Real Green"
 greenland_subterfuge_event.4.t: "Grande Investimento Groenlandês"
 greenland_subterfuge_event.4.d: "A Groenlândia nos procurou com uma oferta. Um investimento abrangente e um acordo comercial exclusivo. A Groenlândia está disposta a desenvolver nossa infraestrutura, nossa capacidade de planejamento urbano e nossa base industrial civil e, aparentemente, a fornecer um arrendamento exclusivo de apoio material necessário em troca desses investimentos. O gancho final de todo esse enorme pacote de investimentos é um investimento direto em larga escala para desenvolver e extrair depósitos conhecidos de petróleo em nossas águas. É um negócio extremamente bom e, para ser franco, vemos muito pouco de errado nele. Mas, ao ficarmos em dívida com uma nação específica, o que faríamos em relação à Dinamarca?"
 greenland_subterfuge_event.4.o1: "Vamos Fechar o Negócio!"
 greenland_subterfuge_event.4.o2: "Não, Isso Não Está Certo"
 greenland_subterfuge_event.5.t: "As Ilhas Faroé Aceitam"
 greenland_subterfuge_event.5.d: "O governo das Ilhas Faroé aceitou nossos generosos investimentos e agora podemos começar a trabalhar rumo ao nosso futuro."
 greenland_subterfuge_event.5.o1: "Enviar os Agitadores"
 greenland_subterfuge_event.6.t: "Cidadãos Imploram ao Governo"
 greenland_subterfuge_event.6.d: "Os acontecimentos recentes começaram a se intensificar, à medida que cada vez mais cidadãos da ilha imploram ao governo que realize um referendo sobre a formação de uma União Nórdica Ocidental com a Groenlândia. Muitos citam o gesto aparentemente benevolente de investimentos em prol do bem-estar dos ilhéus, em contraste com a abordagem mínima da Dinamarca. Com tanta pressão, somos forçados a aceitar suas exigências e faremos uma petição ao governo groenlandês."
 greenland_subterfuge_event.6.o1: "Faroé Eterna"
 greenland_subterfuge_event.7.t: "O Lance Compensa"
 greenland_subterfuge_event.7.d: "A pressão pública dos cidadãos faroenses forçou o governo deles a pedir a formação de uma união com a nossa nação. Isso é um bom sinal para nós, pois certamente incitará algum tipo de agitação dentro do governo dinamarquês."
 greenland_subterfuge_event.7.o1: "Um Passo Mais Perto"
 greenland_subterfuge_event.8.t: "Como Assim?!"
 greenland_subterfuge_event.8.d: "Chegam relatos de que, de alguma forma, as Forças Armadas Groenlandesas acabaram de se estabelecer nas Ilhas Faroé e estão trabalhando com cidadãos e autoridades do governo para transferir o poder pacificamente. A questão é: quem lhes deu o direito de fazer isso? Não fomos consultados e parece que nosso desinteresse geral pelas ilhas só trabalhou contra nós. Se não agirmos, perdemos prestígio, mas, se agirmos rápido, estaremos sozinhos, pois estaremos instigando hostilidades diretas."
 greenland_subterfuge_event.8.o1: "Podemos Vencê-los!"
 greenland_subterfuge_event.8.o2: "Quem?"
 greenland_subterfuge_event.40000.t: "Investimento Negado"
 greenland_subterfuge_event.40000.d: "As Ilhas Faroé negaram nossa melhor oferta; se não vão aceitar, não temos escolha a não ser nos preparar para o pior."
 greenland_subterfuge_event.40000.o1: "Iniciar a Mobilização"
 greenland_subterfuge_event.9.t: "Investimentos Groenlandeses"
 greenland_subterfuge_event.9.d: "A Groenlândia nos procurou com uma série de investimentos sem nenhum custo para nós. Eles querem se concentrar em desenvolver as áreas menos desenvolvidas da região da Jutlândia e fomentar a solidariedade nórdica. No entanto, alguns no governo acreditam que eles têm uma agenda oculta, pois os investimentos parecem bons demais para ser verdade. Por outro lado, o que a Groenlândia poderia realisticamente fazer contra nós?"
 greenland_subterfuge_event.9.o1: "Coisa de Graça Não É Nada Mal"
 greenland_subterfuge_event.9.o2: "Não Gosto das Suas Palavras Estranhas"
 greenland_subterfuge_event.10.t: "A Dinamarca Aceita"
 greenland_subterfuge_event.10.d: "O governo dinamarquês aceitou os investimentos e agora começaremos a nos preparar para o que planejamos."
 greenland_subterfuge_event.10.o1: "Agora a Bola Está com Eles"
 greenland_subterfuge_event.11.t: "Descobrindo a Origem"
 greenland_subterfuge_event.11.d: "Os recentes surtos de agitação e discórdia social parecem estar ligados a certos investimentos da Groenlândia. Essas novas frentes causaram um leve desconforto em nossa sociedade; no entanto, se deixarmos como está, poderemos enfrentar sérios problemas adiante. É arriscado, mas podemos optar por combater as continuadas artimanhas ou resolver a questão de vez, derrotando a causa raiz."
 greenland_subterfuge_event.11.o1: "Eles Sequer Têm um Exército?"
 greenland_subterfuge_event.11.o2: "Temos a OTAN, Ficaremos Bem"
 greenland_subterfuge_event.90000.t: "Investimento Negado"
 greenland_subterfuge_event.90000.d: "A Dinamarca negou nossa melhor oferta; se não vão aceitar, não temos escolha a não ser nos preparar para o pior."
 greenland_subterfuge_event.90000.o1: "Preparar a Operação Middleman"
 greenland_subterfuge_event.12.t: "Investimentos Groenlandeses"
 greenland_subterfuge_event.12.d: "A Groenlândia nos procurou com uma série de investimentos sem nenhum custo para nós. Eles querem se concentrar em desenvolver as áreas menos desenvolvidas da região de Nord-Norge e fomentar a unidade e a prosperidade nórdicas. No entanto, alguns no governo acreditam que eles têm uma agenda oculta, pois os investimentos parecem bons demais para ser verdade. Por outro lado, o que a Groenlândia poderia realisticamente fazer contra nós?"
 greenland_subterfuge_event.12.o1: "Posso Concordar com o Que É de Graça"
 greenland_subterfuge_event.12.o2: "Estamos Bem, Obrigado"
 greenland_subterfuge_event.13.t: "A Noruega Aceita"
 greenland_subterfuge_event.13.d: "O governo norueguês aceitou os investimentos e agora começaremos a nos preparar para o que planejamos com a população civil para afastar a nação da OTAN."
 greenland_subterfuge_event.13.o1: "Vamos Ver o Que Eles Fazem"
 greenland_subterfuge_event.14.t: "Descobrindo a Origem"
 greenland_subterfuge_event.14.d: "Os recentes surtos de agitação e discórdia social parecem estar ligados a certos investimentos da Groenlândia. Essas novas frentes causaram um leve desconforto em nossa sociedade; no entanto, se deixarmos como está, poderemos enfrentar sérios problemas adiante. É arriscado, mas podemos optar por combater as continuadas artimanhas ou resolver a questão de vez, derrotando a causa raiz."
 greenland_subterfuge_event.14.o1: "Eles Sequer Têm um Exército?"
 greenland_subterfuge_event.14.o2: "Temos a OTAN, Ficaremos Bem"
 greenland_subterfuge_event.120000.t: "Investimento Negado"
 greenland_subterfuge_event.120000.d: "A Noruega negou nossa melhor oferta; se não vai aceitar, não temos escolha a não ser nos preparar para o pior."
 greenland_subterfuge_event.120000.o1: "Preparar a Operação Fjordsland"
 greenland_subterfuge_event.15.t: "Investimentos Groenlandeses"
 greenland_subterfuge_event.15.d: "A Groenlândia nos procurou com uma série de investimentos sem nenhum custo para nós. Eles querem se concentrar em desenvolver as áreas menos desenvolvidas ao redor da cidade de Karlstad e fomentar a unidade e a prosperidade nórdicas. No entanto, alguns no governo acreditam que eles têm uma agenda oculta, pois os investimentos parecem bons demais para ser verdade. Por outro lado, o que a Groenlândia poderia realisticamente fazer contra nós?"
 greenland_subterfuge_event.15.o1: "O Que É de Graça Continua de Graça"
 greenland_subterfuge_event.15.o2: "Declinamos com Humildade"
 greenland_subterfuge_event.16.t: "A Suécia Aceita"
 greenland_subterfuge_event.16.d: "O governo sueco aceitou os investimentos e agora começaremos a nos preparar para o que planejamos com a população civil, a fim de garantir uma autoridade central mais fraca e menos alinhada com a OTAN."
 greenland_subterfuge_event.16.o1: "Agora Esperamos e Planejamos"
 greenland_subterfuge_event.17.t: "Descobrindo a Origem"
 greenland_subterfuge_event.17.d: "Os recentes surtos de agitação e discórdia social parecem estar ligados a certos investimentos da Groenlândia. Essas novas frentes causaram um leve desconforto em nossa sociedade; no entanto, se deixarmos como está, poderemos enfrentar sérios problemas adiante. É arriscado, mas podemos optar por combater as continuadas artimanhas ou resolver a questão de vez, derrotando a causa raiz."
 greenland_subterfuge_event.17.o1: "Eles Sequer Têm um Exército?"
 greenland_subterfuge_event.17.o2: "Não Precisamos Nos Preocupar com Esses Insetos"
 greenland_subterfuge_event.150000.t: "Investimento Negado"
 greenland_subterfuge_event.150000.d: "A Suécia negou nossa melhor oferta; se não vai aceitar, não temos escolha a não ser nos preparar para o pior."
 greenland_subterfuge_event.150000.o1: "Preparar a Operação Grande Guerra do Norte"
 greenland_subterfuge_event.18.t: "Investimentos Groenlandeses"
 greenland_subterfuge_event.18.d: "A Groenlândia nos procurou com uma série de investimentos sem nenhum custo para nós. Eles querem se concentrar em desenvolver a região norte menos desenvolvida da Lapônia (Lappi) e fomentar a unidade e a prosperidade nórdicas. No entanto, alguns no governo acreditam que eles têm uma agenda oculta, pois os investimentos parecem bons demais para ser verdade. Por outro lado, o que a Groenlândia poderia realisticamente fazer contra nós?"
 greenland_subterfuge_event.18.o1: "Temos um Acordo, Meu Senhor"
 greenland_subterfuge_event.18.o2: "Acho Que Não, Neste Momento"
 greenland_subterfuge_event.19.t: "A Finlândia Aceita"
 greenland_subterfuge_event.19.d: "O governo finlandês aceitou os investimentos e agora começaremos a nos preparar para alcançar nossos objetivos isolando o governo e tornando a população mais receptiva a uma grande união nórdica."
 greenland_subterfuge_event.19.o1: "Buscar uma Conclusão Sólida"
 greenland_subterfuge_event.20.t: "Descobrindo a Origem"
 greenland_subterfuge_event.20.d: "Os recentes surtos de agitação e discórdia social parecem estar ligados a certos investimentos da Groenlândia. Essas novas frentes causaram um leve desconforto em nossa sociedade; no entanto, se deixarmos como está, poderemos enfrentar sérios problemas adiante. É arriscado, mas podemos optar por combater as continuadas artimanhas ou resolver a questão de vez, derrotando a causa raiz."
 greenland_subterfuge_event.20.o1: "Eles Sequer Têm um Exército?"
 greenland_subterfuge_event.20.o2: "Não Precisamos Nos Preocupar com Eles"
 greenland_subterfuge_event.180000.t: "Investimento Negado"
 greenland_subterfuge_event.180000.d: "A Finlândia negou nossa melhor oferta; se não vai aceitar, não temos escolha a não ser nos preparar para o pior."
 greenland_subterfuge_event.180000.o1: "Preparar a Operação Mannerheim"
