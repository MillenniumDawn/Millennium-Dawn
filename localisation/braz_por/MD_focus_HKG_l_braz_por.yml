 hongkong.8.t: "O Ano do Dragão"
 hongkong.8.d: "Três anos se passaram desde a reunificação com o continente. Hong Kong enfrentou a crise financeira asiática sem o declínio que o Ocidente previa. Com a chegada do novo milênio, a cidade continuará a provar que a integração com a China não é algo ruim."
 hongkong.8.a: "San Nin Faa Lok! (Feliz Ano Novo!)"
 hongkong.9.t: "Hong Kong Busca Nosso Armamento"
 hongkong.9.d: "A Polícia de Hong Kong fez um pedido de armas leves de fabricação chinesa. O volume é modesto, mas o simbolismo é enorme: esta é a primeira aquisição formal de segurança de HKG junto a um fornecedor do continente. A mídia estatal já apresenta o acordo como sinal da crescente confiança da RAE na indústria da pátria-mãe."
 hongkong.9.a: "Aprovar a taxas favoráveis"
 hongkong.9.b: "Aproveitar o momento para a propaganda estatal"
 hongkong.13.t: "Pequim Responde"
 hongkong.13.d: "Um mês após o apelo do LegCo pela libertação de dissidentes do continente, o Escritório de Ligação emite uma dura repreensão. A mídia estatal acusa os políticos de Hong Kong de \"interferir nos assuntos internos da República Popular\". Um punhado de detidos de baixo perfil é libertado discretamente; muitos outros permanecem atrás das grades. O campo pan-democrata está furioso, o campo patriótico, triunfante."
 hongkong.13.a: "Acolher as libertações parciais"
 hongkong.13.b: "Condenar a repreensão de Pequim"
 hongkong.13.c: "Deixar o assunto morrer discretamente"
 HKG_aukus_request_tt: "§Y[ROOT.GetNameDef]§! §Ysolicitará§! acesso ao compartilhamento de inteligência de §H[ENG.GetName]§!, §H[USA.GetName]§! e §H[AST.GetName]§!. Eles podem recusar."
 HKG_uk_garrison_request_tt: "§H[ENG.GetName]§! será convidado a estacionar forças em Hong Kong. Eles podem recusar."
 hongkong.14.t: "A Questão de Hong Kong"
 hongkong.14.d: "Dois milhões de pessoas nas ruas de Hong Kong. O movimento contra a extradição abalou profundamente a ordem política da RAE. Autoridades pró-Pequim exigem uma ação mais firme; pragmáticos no Conselho de Estado alertam que o excesso afugentará o capital estrangeiro. O Comitê Permanente do Politburo decidirá como responder."
 hongkong.14.a: "Apertar o controle: status formal de fantoche"
 hongkong.14.b: "Mostrar contenção: preservar o arcabouço"
 hongkong.15.t: "Hong Kong Busca Acesso ao AUKUS"
 hongkong.15.d: "O governo pró-Ocidente de Hong Kong solicitou formalmente o compartilhamento de inteligência e acesso a bases. O valor estratégico de um porto amigo no extremo sul da China é substancial, mas Pequim verá isso como um ato hostil, e as implicações de segurança valem para os dois lados. A questão segue para o Conselho de Segurança Nacional."
 hongkong.15.a: "Conceder acesso: Hong Kong é um ativo estratégico"
 hongkong.15.b: "Recusar: manter Pequim à distância"
 hongkong.16.t: "Hong Kong Convida uma Guarnição Britânica"
 hongkong.16.d: "O governo de Hong Kong convidou formalmente o Reino Unido a restabelecer uma guarnição militar permanente na RAE. O simbolismo seria extraordinário; as consequências diplomáticas com Pequim, severas. O relatório do Secretário de Defesa chega à mesa do Gabinete."
 hongkong.16.a: "Aceitar: restaurar a presença britânica"
 hongkong.16.b: "Recusar: o custo diplomático é alto demais"
 hongkong.10.t: "A Questão do Sufrágio Universal"
 hongkong.10.d: "Sob a Lei Básica, os dois primeiros Chefes do Executivo e os três primeiros Conselhos Legislativos foram escolhidos pelo Comitê Eleitoral, e não por sufrágio universal. A Eleição para Chefe do Executivo de 2007 e a Eleição para o LegCo de 2008 representam uma oportunidade de decidir se o sistema democrático de Hong Kong deve ser reformado, tendo o sufrágio universal pleno como objetivo final."
 hongkong.10.a: "O sistema eleitoral de Hong Kong manterá o status quo."
 hongkong.10.b: "Não somos favoráveis ao sufrágio universal imediato, mas apoiaremos uma reforma eleitoral gradual e ordenada."
 hongkong.10.c: "Que tal ser radical e simplesmente permitir o sufrágio universal!"
 hongkong.11.t: "A PCCW se funde com a HKT"
 hongkong.11.d: "A Cable & Wireless anunciou planos de vender a Hong Kong Telecom à SingTel, apesar das objeções do governo chinês. A PCCW, controlada por Li Tzar-kai, filho de Li Ka-shing, entrou na disputa e acabou vencendo. Após o anúncio da fusão, as ações da PCCW saltaram de alguns centavos para HKD 28,50 no fechamento do pregão daquele dia, elevando brevemente seu valor de mercado acima de HKD 250 bilhões."
 hongkong.11.a: "A internet é uma coisa tão incrível!"
 hongkong.12.t: "O Impacto do Estouro da Bolha Pontocom"
 hongkong.12.d: "Com o estouro da bolha pontocom, as ações da PCCW despencaram 98%, poucos meses depois de a fusão com a Hong Kong Telecom tê-las feito disparar. A empresa ficou com um patrimônio líquido fortemente negativo e teve poucas opções além de planejar a venda de seu negócio principal para aliviar as dificuldades financeiras."
 hongkong.12.a: "Novo milênio, novos problemas."
 hongkong_legco.1.t: "As Cadeiras do LegCo de [GetYear]"
 hongkong_legco.1.d: "O Conselho Legislativo se reúne para o novo mandato. As cadeiras dos colégios geográficos e funcionais foram contadas e as maiorias de trabalho da casa já são conhecidas. A aprovação de moções exigirá [?HKG_legco_required_seats] cadeiras; moções constitucionais exigirão [?HKG_legco_specially_required_seats]."
 hongkong_legco.1.a: "Entendido."
 hongkong_news.4.t: "A Aliança Democrática 123 foi dissolvida hoje."
 hongkong_news.4.d: "Fundada em 1994 por um grupo de políticos pró-Taiwan, pró-democracia e pró-empresariado, a Aliança Democrática 123 foi dissolvida por falta de apoio financeiro do governo de Taiwan após a derrota do Kuomintang na eleição presidencial."
 hongkong_news.4.a: "Boa notícia, não é?"
 hongkong_news.4.b: "Entendido."
 hongkong_news.5.t: "Surto de SARS"
 hongkong_news.5.d: "Um surto de um vírus de pneumonia grave conhecido como \"SARS\" ocorreu em Guangdong e Hong Kong. Apesar das alegações de autoridades do continente de que foi efetivamente contido, o surto continua em Hong Kong. A OMS emitiu agora um alerta de viagem para o Sul da China e Hong Kong, dizendo que ele representa uma ameaça sanitária mundial. Até agora, uma pessoa morreu em decorrência da doença. O governo de Hong Kong iniciou medidas de quarentena obrigatória para os suspeitos de infecção."
 hongkong_news.5.a: "Nosso setor de turismo está em apuros."
 hongkong_news.5.b: "Prender os funcionários incompetentes e lidar com o surto de forma transparente."
 hongkong_news.5.c: "Precisamos continuar ocultando os dados reais para manter a estabilidade social."
 hongkong_news.5.e: "Uma evolução preocupante."
 hongkong_news.6.t: "A Morte de Leslie Cheung"
 hongkong_news.6.d: "O mundialmente renomado cantor, ator e ícone de Hong Kong Leslie Cheung tirou a própria vida aos 46 anos, saltando de um prédio do Hotel Mandarin, em Hong Kong, devido à depressão. Leslie Cheung conquistou o coração de incontáveis fãs com suas canções sentidas, sua atuação magistral e seu carisma único. Sua morte chocou toda a comunidade chinesa, e muitas pessoas ficaram profundamente tristes e desamparadas.\n\nA morte de Leslie Cheung não é apenas uma perda significativa para a indústria do entretenimento, mas também um golpe cultural e espiritual. Sua música e seus filmes continuarão a influenciar e inspirar futuros artistas e públicos, mas sua ausência deixará para sempre um vazio impossível de preencher."
 hongkong_news.6.a: "Perdemos um grande artista hoje."
 hongkong_news.7.t: "A Morte de Anita Mui"
 hongkong_news.7.d: "Anita Mui Yim-fong, amplamente conhecida como a \"Madonna da Ásia\", faleceu aos 40 anos após uma corajosa batalha contra o câncer do colo do útero.\n\nNascida em 1963, Anita Mui alcançou a fama na década de 1980, tornando-se uma figura central da cena do Cantopop e deixando um legado duradouro para milhões de fãs. Sua dedicação à caridade e sua força inabalável diante da doença lhe renderam profunda admiração. Conforme a notícia de sua morte se espalha, um clima sombrio cobre a nação, com pessoas se unindo para homenagear a amada \"Filha de Hong Kong\"."
 hongkong_news.7.a: "O fim de uma grande era."
 hongkong_news.8.t: "Forte Tempestade Tropical Utor"
 hongkong_news.8.d: "Em 4 de julho, às 17h45, o Tufão Yuet entrou na zona de alerta de 800 quilômetros, levando o Observatório de Hong Kong a emitir o Sinal de Prontidão nº 1. Em 5 de julho, às 19h30, o sinal foi elevado para o Sinal de Vendaval ou Tempestade nº 8, a primeira emissão desse sinal no século XXI. Devido às ondas de tempestade, a combinação da maré de tempestade com a maré alta normal daquela manhã resultou em um nível do mar de 3,4 metros registrado em Quarry Bay, o mais alto desde que o Tufão Wanda atingiu Hong Kong em 1962. Isso causou graves inundações em Tai O e no noroeste dos Novos Territórios em 6 de julho. Algumas ruas principais de Tai O viraram rios, com profundidade da água chegando a três metros. O mercado atacadista de frutos do mar de Lau Fau Shan também foi inundado, forçando o fechamento de muitas lojas."
 hongkong_news.8.a: "O Observatório cumpriu seu papel."
 hongkong_news.9.t: "Forte Tempestade Tropical Yutu (Coelho da Lua)"
 hongkong_news.9.d: "A Tempestade Tropical Yutu cruzou para a zona de alerta do Observatório de Hong Kong, levando à emissão do Sinal de Prontidão nº 1. Os horários do transporte público foram ajustados, as escolas foram colocadas em alerta de tempestade e os serviços de drenagem e emergência da cidade foram ativados. O Observatório espera o pior nas próximas vinte e quatro horas."
 hongkong_news.9.a: "Abrigar-se e esperar passar."
 HKG_european_bussiness_opinion: "Melhorar o Comércio com Empresários Europeus"
 HKG_chinese_entrepreneurs_opinion: "Melhorar o Comércio com Nossos Empresários do Continente"
 HKG_protest_movement_rises: "Os Protestos Começam"
 HKG_protest_movement_rises_desc: "Centenas de milhares tomam as ruas. O mundo está olhando. Pequim também."
 HKG_loyalist_consolidation: "Consolidação Lealista"
 HKG_loyalist_consolidation_desc: "As facções pró-Pequim apertam o controle sobre o Conselho Legislativo e as nomeações do serviço público."
 HKG_umbrella_revolution: "A Revolução dos Guarda-Chuvas"
 HKG_umbrella_revolution_desc: "Estudantes e ativistas ocupam as principais artérias da cidade. Os guarda-chuvas amarelos tornam-se o símbolo das esperanças de uma geração."
 HKG_democratic_opposition_network: "Rede de Oposição Democrática"
 HKG_democratic_opposition_network_desc: "Partidos pan-democratas e grupos da sociedade civil formam uma ampla coalizão para contestar as invasões de Pequim."
 HKG_nsl_imposed: "Lei de Segurança Nacional"
 HKG_nsl_imposed_desc: "Pequim ignora completamente o Conselho Legislativo. Da noite para o dia, protesto, subversão, secessão e conluio com forças estrangeiras tornam-se crimes puníveis com prisão perpétua."
 HKG_press_freedom_crackdown: "Silenciando a Imprensa"
 HKG_press_freedom_crackdown_desc: "O Apple Daily é invadido e fechado. A independência editorial da RTHK é eliminada. As últimas vozes livres são extintas."
 HKG_police_state_apparatus: "Policiamento de Mão de Ferro"
 HKG_police_state_apparatus_desc: "A força policial amplia seus poderes sob as disposições da LSN. Esquadrões antimotim, operações disfarçadas e prisões em massa tornam-se rotina."
 HKG_dialogue_with_protesters: "Comissão de Diálogo"
 HKG_dialogue_with_protesters_desc: "Uma última tentativa desesperada de mediação antes que a repressão se torne total. Observadores independentes são convidados a avaliar a conduta policial."
 HKG_anti_extradition_bill: "A Crise do Projeto de Extradição"
 HKG_anti_extradition_bill_desc: "Uma proposta de lei que permite a extradição para a China continental desencadeia os maiores protestos da história de Hong Kong. Dois milhões marcham."
 HKG_youth_resistance_cells: "Resistência Juvenil"
 HKG_youth_resistance_cells_desc: "Jovens valentes de Hong Kong formam unidades de linha de frente. A geração vestida de preto luta com coquetéis molotov e guarda-chuvas contra gás lacrimogêneo e balas de borracha."
 HKG_emigration_wave: "O Grande Êxodo"
 HKG_emigration_wave_desc: "Centenas de milhares partem para o Reino Unido, o Canadá e a Austrália sob os programas BN(O). Hong Kong sangra sua classe profissional."
 HKG_preserve_financial_hub: "Preservar o Centro Financeiro"
 HKG_preserve_financial_hub_desc: "As elites empresariais pressionam Pequim: o valor de Hong Kong está em seu arcabouço jurídico distinto e em suas conexões internacionais. Destrua isso e destruirá tudo."
 HKG_foreign_business_exodus: "Fuga de Capital Estrangeiro"
 HKG_foreign_business_exodus_desc: "Bancos, escritórios de advocacia e multinacionais transferem discretamente suas sedes regionais para Singapura e Tóquio. A coroa financeira escorrega."
 HKG_western_sanctions_threat: "Ameaça de Sanções Ocidentais"
 HKG_western_sanctions_threat_desc: "Os EUA, o Reino Unido e a UE revisam o status comercial especial de Hong Kong. O acesso privilegiado da cidade aos mercados ocidentais está em jogo."
 HKG_deeper_mainland_integration: "Integração Mais Profunda com o Continente"
 HKG_deeper_mainland_integration_desc: "A iniciativa da Grande Baía atrai Hong Kong para a órbita econômica da China. Infraestrutura, finanças e governança convergem lentamente."
 HKG_patriotic_education: "Educação Patriótica"
 HKG_patriotic_education_desc: "Um novo currículo reescreve a história. A próxima geração aprenderá que Hong Kong sempre foi, e sempre será, chinesa."
 HKG_last_stand_opposition: "A Última Resistência Democrática"
 HKG_last_stand_opposition_desc: "Figuras pró-democracia sobreviventes se recusam a ser silenciadas. Do exílio em Londres e Washington, continuam a pressionar o mundo, sabendo que talvez nunca voltem para casa."
 HKG_absorption_complete: "Absorção Completa"
 HKG_absorption_complete_desc: "Um país. Um sistema. O experimento acabou. A identidade única de Hong Kong agora existe apenas na memória e na diáspora."
 HKG_city_of_resistance: "Cidade da Resistência"
 HKG_city_of_resistance_desc: "Contra todas as probabilidades, o espírito de resistência perdura. Hong Kong torna-se um símbolo para as democracias do mundo todo, prova de que algumas coisas valem a luta mesmo quando as chances são impossíveis."
 HKG_silenced_press: "Imprensa silenciada"
 HKG_silenced_press_desc: "Silenciar a imprensa facilitará a integração, mas precisamos agir rápido antes que a ira pública atinja o ponto de ruptura."
 HKG_annexation: "The Model SAR"
 HKG_annexation_desc: "Hong Kong tornou-se a Região Administrativa Especial exemplar de Pequim: obediente, próspera, integrada. O Politburo recompensa a lealdade com acesso comercial preferencial, fluxos de mão de obra do continente e investimentos em infraestrutura. Os privilégios duram enquanto Hong Kong continuar sendo parte da República Popular."
 HKG_democratic_reform_initiative: "Iniciativa de Reforma Democrática"
 HKG_democratic_reform_initiative_desc: "O caminho pacífico deu frutos. Com a sociedade civil organizada, a imprensa protegida e o LegCo se abrindo, a RAE se compromete formalmente com um programa de reforma democrática. As instituições existem; agora serão fortalecidas."
 HKG_universal_suffrage_amendment: "Emenda do Sufrágio Universal"
 HKG_universal_suffrage_amendment_desc: "Todo adulto de Hong Kong tem direito a voto, todo cargo eletivo é disputado e o comitê de nomeação é dissolvido. A emenda é aprovada no LegCo e consagrada como direito constitucional. Pequim protesta; Hong Kong comemora."
 HKG_independent_judiciary_reform: "Reforma do Judiciário Independente"
 HKG_independent_judiciary_reform_desc: "O Tribunal de Última Instância é libertado de vetos políticos, os promotores atuam à distância do Executivo e as nomeações judiciais são revisadas por uma comissão independente. Um judiciário digno do Estado de Direito que interpreta."
 HKG_freedom_of_information_act: "Lei de Liberdade de Informação"
 HKG_freedom_of_information_act_desc: "Os arquivos do governo passam a ser acessíveis ao público por padrão. Denunciantes ganham proteção legal. A ideia da Imprensa Silenciada é revertida, e o jornalismo em Hong Kong se torna a coisa mais rara da região: uma imprensa livre em uma cidade chinesa."
 HKG_democratic_consolidation: "Consolidação Democrática"
 HKG_democratic_consolidation_desc: "Sufrágio universal, um judiciário independente e uma imprensa livre agora se reforçam mutuamente. Hong Kong é a sociedade chinesa mais democrática da história. As reformas não podem ser revertidas por decreto; são a nova fundação."
 HKG_infrastructure_megaproject: "Megaprojeto de Infraestrutura"
 HKG_infrastructure_megaproject_desc: "O Departamento de Terras elabora um plano diretor: a próxima década de crescimento de Hong Kong depende de construir para fora, para cima e para baixo da terra. O tesouro se abre. Os contratos são assinados. Os guindastes chegam."
 HKG_mtr_expansion_phase_2: "Expansão do MTR, Fase 2"
 HKG_mtr_expansion_phase_2_desc: "Extensões da Linha West Rail, do Shatin-Central Link e de um prometido corredor North Island. Os tempos de deslocamento caem, os imóveis valorizam ao redor das novas estações e a rede do MTR chega a distritos que esperam desde a era britânica."
 HKG_third_runway_chek_lap_kok: "Terceira Pista em Chek Lap Kok"
 HKG_third_runway_chek_lap_kok_desc: "Só o trabalho de aterro leva anos e o custo é astronômico, mas o Aeroporto Internacional de Hong Kong não pode continuar com duas pistas enquanto Singapura e Xangai se expandem. A terceira pista garante o lugar da cidade como polo de aviação regional."
 HKG_lantau_tomorrow_vision: "Visão Lantau do Amanhã"
 HKG_lantau_tomorrow_vision_desc: "O projeto de aterro mais ambicioso da história de Hong Kong: ilhas artificiais a leste de Lantau, moradias para centenas de milhares e um novo distrito comercial central. Ambientalistas se opõem; os que carecem de moradia comemoram. O custo político é real, o ganho em terra utilizável é enorme."
 HKG_smart_city_initiative: "Iniciativa Cidade Inteligente"
 HKG_smart_city_initiative_desc: "5G em toda a cidade, gestão integrada de tráfego, identidade digital para cada residente e uma API de serviços públicos que permite às startups construir sobre os dados da RAE. Hong Kong salta de próspera para programável."
 HKG_world_class_infrastructure: "Infraestrutura de Classe Mundial"
 HKG_world_class_infrastructure_desc: "Estradas, ferrovias, porto, aeroporto, fibra óptica e terras recuperadas, tudo modernizado em conjunto. A infraestrutura de uma cidade construída para a segunda metade do século XXI, finalmente entregue."
 HKG_hospital_authority_reform: "Reforma da Autoridade Hospitalar"
 HKG_hospital_authority_reform_desc: "A Autoridade Hospitalar é reestruturada visando transparência, eficiência e financiamento baseado em resultados. As filas de espera começam a cair, a distância entre o atendimento público e o privado diminui e as bases de um sistema moderno são lançadas."
 HKG_pandemic_preparedness: "Preparação para Pandemias"
 HKG_pandemic_preparedness_desc: "A SARS deu à cidade uma lição brutal; o novo Centro de Proteção à Saúde garante que ela não seja esquecida. Estoques de EPI, capacidade de rastreamento de contatos e vigilância integrada com a OMS. O próximo surto não pegará Hong Kong desprevenida."
 HKG_chinese_medicine_integration: "Integração da Medicina Chinesa"
 HKG_chinese_medicine_integration_desc: "A Medicina Tradicional Chinesa é incorporada ao sistema público de saúde: profissionais regulamentados, alas hospitalares, bolsas de pesquisa universitárias. Pacientes que querem os dois mundos recebem os dois mundos, e Pequim nota o respeito cultural."
 HKG_universal_healthcare_voucher: "Voucher Universal de Saúde"
 HKG_universal_healthcare_voucher_desc: "Cada residente recebe um voucher anual resgatável em clínicas públicas ou privadas. A cobertura se torna universal na prática e não só no nome, e os trabalhadores pobres param de escolher entre o aluguel e uma consulta médica."
 HKG_public_health_modernisation: "Modernização da Saúde Pública"
 HKG_public_health_modernisation_desc: "Novos centros de câncer, serviços de saúde mental ampliados, hospitais modernizados em todos os Novos Territórios. A própria medicina alcança a reforma institucional."
 HKG_healthcare_excellence: "Excelência em Saúde"
 HKG_healthcare_excellence_desc: "A expectativa de vida em Hong Kong já está entre as mais altas do mundo; o sistema que a produziu agora é digno dessa estatística. Um modelo que as regiões vizinhas começam a estudar e imitar."
 HKG_labour_reform_charter: "Carta de Reforma Trabalhista"
 HKG_labour_reform_charter_desc: "A primeira revisão abrangente do código trabalhista de Hong Kong em décadas. Trabalho em condições análogas às de fábricas de exploração, horas extras não pagas, abusos em dormitórios e exploração no setor informal são identificados, medidos e incluídos na pauta legislativa. Os sindicatos tomam nota."
 HKG_minimum_wage_ordinance: "Decreto do Salário Mínimo"
 HKG_minimum_wage_ordinance_desc: "Um salário mínimo legal, reajustado a cada dois anos. Os conglomerados protestam em nome da competitividade; faxineiros e trabalhadores de restaurantes veem seus contracheques crescerem pela primeira vez em uma geração."
 HKG_collective_bargaining_rights: "Direitos de Negociação Coletiva"
 HKG_collective_bargaining_rights_desc: "Os sindicatos obtêm reconhecimento legal, os contratos coletivos ganham força jurídica e o direito de greve é codificado em vez de apenas tolerado. A Confederação de Sindicatos torna-se um genuíno contrapeso às câmaras de comércio."
 HKG_foreign_domestic_helpers_protections: "Proteção às Trabalhadoras Domésticas Estrangeiras"
 HKG_foreign_domestic_helpers_protections_desc: "Trabalhadoras domésticas residentes, em sua maioria filipinas e indonésias, ganham proteções exigíveis contra os piores abusos de empregadores. Folgas obrigatórias, termos contratuais transparentes e um órgão regulador com poder real. Um reconhecimento há muito devido de que são trabalhadoras, não servas."
 HKG_pension_scheme_reform: "Reforma do Sistema de Previdência"
 HKG_pension_scheme_reform_desc: "Os piores aspectos do Fundo de Previdência Obrigatório, como taxas altas, compensações do empregador e lacunas de contribuição, são reformados. A pobreza na velhice em Hong Kong deixa de ser um escândalo silencioso."
 HKG_labour_dignity: "Dignidade no Trabalho"
 HKG_labour_dignity_desc: "Um piso legal para os salários, sindicatos reconhecidos, trabalhadoras protegidas e uma aposentadoria que de fato aposenta. Trabalhar em Hong Kong torna-se, enfim, algo parecido com um emprego digno."
 HKG_renminbi_offshore_hub: "Polo Offshore do Renminbi"
 HKG_renminbi_offshore_hub_desc: "Pequim confia a Hong Kong o maior reservatório de renminbi offshore do mundo. Emissão de títulos Dim Sum, swaps cambiais e serviços de compensação para toda a região passam por Central. A proximidade com o continente compensa."
 HKG_belt_and_road_financing: "Financiamento da Nova Rota da Seda"
 HKG_belt_and_road_financing_desc: "Hong Kong torna-se a porta de entrada financeira para a infraestrutura da Iniciativa Cinturão e Rota na Eurásia. Financiamento de projetos, sindicalização de títulos e resolução de disputas: a expertise da RAE é exportada junto com o capital chinês."
 HKG_green_finance_centre: "Centro de Finanças Verdes"
 HKG_green_finance_centre_desc: "A HKEX lança um segmento de títulos verdes, a SFC emite regras de divulgação climática com força real e Hong Kong se posiciona como porta de entrada da Ásia para o capital ESG. Fundos de pensão europeus notam. Os desenvolvedores de renováveis também."
 HKG_fintech_revolution: "Revolução Fintech"
 HKG_fintech_revolution_desc: "Licenças de bancos virtuais, ambientes regulatórios de teste e um sistema de pagamentos rápidos que finalmente puxa as finanças de varejo para a era digital. A próxima geração de empresas financeiras nasce no Cyberport, não em Central."
 HKG_global_wealth_management: "Gestão Global de Patrimônio"
 HKG_global_wealth_management_desc: "Compensação em renminbi, capital verde, infraestrutura fintech: Hong Kong está no centro dos três. A riqueza do mundo se administra por meio da RAE. Só as taxas já justificariam a existência da cidade."
 HKG_tourism_board_revival: "Revitalização do Conselho de Turismo"
 HKG_tourism_board_revival_desc: "Pós-devolução, pós-SARS, pós-tudo, o Conselho de Turismo se reinventa: melhor marketing, serviços ampliados aos visitantes, uma marca coerente para a cidade além dos clichês de \"Cidade Mundial da Ásia\". Os visitantes notam."
 HKG_disney_hong_kong: "Disneyland de Hong Kong"
 HKG_disney_hong_kong_desc: "A Ilha de Lantau recebe o menor dos parques Disney, e o mais acessível aos turistas do continente. A conta da construção é alta, a inauguração é reluzente e a RAE ganha uma âncora familiar para sua economia turística."
 HKG_cantopop_revival: "Renascimento do Cantopop"
 HKG_cantopop_revival_desc: "Uma onda de investimento público, cotas para emissoras e patrocínio de festivais de música devolve relevância comercial à música popular em cantonês. A confiança cultural que o Cantopop um dia encarnou volta junto com a música."
 HKG_film_industry_renaissance: "Renascimento da Indústria Cinematográfica"
 HKG_film_industry_renaissance_desc: "Os estúdios da TVB se expandem, diretores autorais independentes encontram financiamento e o cinema de Hong Kong redescobre o charme que tinha nos anos 80 e 90. Não apenas artes marciais e crime, mas drama sério, comédia familiar e uma geração de novos diretores com histórias para contar."
 HKG_west_kowloon_cultural_district: "Distrito Cultural de West Kowloon"
 HKG_west_kowloon_cultural_district_desc: "O M+, o Museu do Palácio, o Centro Xiqu e uma dúzia de instituições menores no que antes era terra recuperada do mar. Um verdadeiro quarteirão cultural que permite à cidade contar a própria história, em galerias e teatros, em vez de saguões de arranha-céus de vidro."
 HKG_world_class_destination: "Destino de Classe Mundial"
 HKG_world_class_destination_desc: "Turismo, infraestrutura, culinária e cultura atingem o auge juntos. Hong Kong deixa de ser apenas uma escala ou um registro financeiro e passa a ser um destino por mérito próprio, o tipo de cidade em torno da qual os viajantes planejam viagens inteiras."
 HKG_consolidated_democracy: "Democracia Consolidada"
 HKG_consolidated_democracy_desc: "As instituições democráticas de Hong Kong agora se autorreforçam: imprensa livre, tribunais independentes, eleições disputadas. Uma democracia que não precisa da permissão do governo central para funcionar."
 HKG_modernised_infrastructure_idea: "Infraestrutura Modernizada"
 HKG_modernised_infrastructure_idea_desc: "As estradas, ferrovias, o porto e a espinha dorsal digital de Hong Kong são modernizados a padrões globais de primeira linha. Todos os setores se beneficiam do efeito multiplicador."
 HKG_modern_healthcare_system: "Sistema de Saúde Moderno"
 HKG_modern_healthcare_system_desc: "Cobertura universal, hospitais modernizados e atendimento público-privado integrado produzem alguns dos melhores resultados de saúde do mundo a um custo sustentável."
 HKG_renminbi_hub_idea: "Polo Offshore do Renminbi"
 HKG_renminbi_hub_idea_desc: "Hong Kong é o principal centro mundial de compensação de renminbi offshore. Fluxos de comércio, investimento e proteção cambial passam pelos bancos e bolsas da RAE."
 HKG_green_finance_idea: "Centro de Finanças Verdes"
 HKG_green_finance_idea_desc: "A porta de entrada da Ásia para o capital alinhado ao clima. Títulos verdes, ações com classificação ESG e financiamento de projetos renováveis passam por Central."
 HKG_tourism_boom: "Boom do Turismo"
 HKG_tourism_boom_desc: "Hong Kong volta a ser um destino global de primeira linha. Os gastos dos visitantes alimentam o comércio, a hotelaria e a cultura; o humor social sobe junto com a receita."
 HKG_modernised_police_force: "Força Policial Modernizada"
 HKG_modernised_police_force_desc: "A Polícia de Hong Kong opera com treinamento, equipamentos e padrões de procedimento atualizados. O policiamento de rotina é mais eficaz, os custos do combate ao crime caem e a confiança do público na força é mensurável em pesquisas."
 HKG_counter_terrorism_capability: "Capacidade Antiterrorismo"
 HKG_counter_terrorism_capability_desc: "A Unidade de Resposta Antiterrorismo dá à RAE uma capacidade especializada crível contra ameaças organizadas. Serviços de inteligência estrangeiros têm mais dificuldade de operar sem serem detectados, e a Força conta com um pequeno quadro permanente de operações especiais."
 HKG_riot_control_capability: "Capacidade de Controle de Distúrbios"
 HKG_riot_control_capability_desc: "A Polícia dispõe de veículos blindados, escudos, gás e protocolos ensaiados de controle de multidões. Os distúrbios são contidos com mais confiabilidade; o equipamento de proteção também é um lembrete visível de que a RAE escolheu uma abordagem específica para a ordem pública."
 HKG_clean_police_force: "Força Policial Íntegra"
 HKG_clean_police_force_desc: "Investigações internas, a fiscalização da ICAC e um compromisso público com a integridade reduziram de forma mensurável a corrupção dentro da Força. Policiais flagrados recebendo pagamentos das tríades enfrentam consequências reais. A reputação da Força, e sua eficácia, melhoram."
 hongkong_order.1.t: "Pressões da Transição Cívica"
 hongkong_order.1.d: "Incidentes rotineiros de ordem pública aumentam em toda a RAE. As causas variam: pressão habitacional, migração transfronteiriça, atrito linguístico e cultural, incerteza econômica em alguns distritos. Nenhuma queixa isolada predomina. Pergunta-se à Polícia como responder a uma situação mais social do que criminal."
 hongkong_order.1.a: "Aumentar as patrulhas nos bairros."
 hongkong_order.1.b: "Estabelecer programas de ligação com a comunidade."
 hongkong_order.1.c: "Manter a postura atual."
 hongkong_order.2.t: "Coordenação contra o Crime Transfronteiriço"
 hongkong_order.2.d: "A Unidade de Resposta Antiterrorismo identificou redes de crime organizado que operam através da fronteira entre a RAE e o continente. A interdição eficaz exige coordenação com a segurança pública do continente, mas os arcabouços jurídicos diferem e a Lei Básica impõe limites à integração operacional. O Comissário pede orientação."
 hongkong_order.2.a: "Aprofundar as operações conjuntas com as autoridades do continente."
 hongkong_order.2.b: "Manter operações independentes dentro de nossa jurisdição."
 hongkong_order.2.c: "Restringir a cooperação apenas aos canais formais."
 hongkong_order.3.t: "Manifestações em Frente à Government House"
 hongkong_order.3.d: "Vários milhares de manifestantes se reuniram em frente à Government House. As queixas são variadas: acesso à moradia, emprego, frustrações cívicas mais difíceis de articular. Algumas faixas fazem referência à devolução; muitas não. A multidão é barulhenta, mas não violenta. A Força precisa decidir como responder."
 hongkong_order.3.a: "Abrir diálogo com os organizadores."
 hongkong_order.3.b: "Manter um perímetro visível e aguardar os acontecimentos."
 hongkong_order.3.c: "Autorizar a dispersão da multidão."
 hongkong_order.4.t: "Alegações de Cooperação entre Polícia e Tríades"
 hongkong_order.4.d: "Um relatório de um denunciante alega que membros da Força vêm recebendo pagamentos para ignorar certas operações das tríades. A pressão política para investigar é considerável; o sindicato da polícia alerta contra o uso de policiais individuais como bodes expiatórios antes do devido processo. O assunto não pode ser ignorado."
 hongkong_order.4.a: "Abrir um inquérito formal por meio da ICAC."
 hongkong_order.4.b: "Apenas revisão disciplinar interna."
 hongkong_order.4.c: "Tratar como incidentes isolados."
 HKG_new_development_idea_buff: "Novo Plano de Desenvolvimento"
 HKG_new_development_idea_buff_desc: "A fase de transição do Novo Plano de Desenvolvimento da RAE. A pesquisa e as instituições políticas ganham um impulso inicial, mas a economia arca com o custo da reestruturação: os setores de escritórios e bens de consumo são temporariamente afetados enquanto o novo arcabouço entra em operação."
 HKG_new_development_idea_buff_complete: "Novo Plano de Desenvolvimento"
 HKG_new_development_idea_buff_complete_desc: "O Novo Plano de Desenvolvimento está plenamente operacional. A velocidade de pesquisa, a eficiência da educação e a produtividade dos escritórios estão permanentemente elevadas. Os custos de transição da fase inicial foram recuperados, e a economia do conhecimento de Hong Kong é agora genuinamente de primeira linha."
 hongkong_housing.1.t: "A Crise Habitacional de Hong Kong"
 hongkong_housing.1.d: "Os preços medianos dos imóveis superaram em vinte vezes a renda mediana das famílias. Dezenas de milhares de moradores de Hong Kong vivem em apartamentos subdivididos e em moradias-gaiola. A fila de espera por habitação pública passa de seis anos e continua crescendo. O governo reconheceu a crise e se comprometeu com um programa de reformas, mas qual reforma, e à custa de quem, continua sendo a questão central da política de Hong Kong."
 hongkong_housing.1.a: "Precisamos agir de forma decisiva."
 hongkong_housing.2.t: "Moradia para Todos os Habitantes de Hong Kong"
 hongkong_housing.2.d: "Após anos de construção, reformas e disputas políticas, a última das metas do programa habitacional foi cumprida. As moradias-gaiola estão sendo esvaziadas. Inquilinos de habitação pública estão passando à casa própria. A fila de espera caiu abaixo de dois anos pela primeira vez em uma geração. A crise que definiu a era pós-devolução está, enfim, para trás."
 hongkong_housing.2.a: "Um lar para cada habitante de Hong Kong."
