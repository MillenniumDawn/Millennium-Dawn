 PER.Kingdom_desc: "（温和萨拉菲圣战主义）- 真主旅，又称伊朗人民抵抗运动，名义上是一个分离主义的激进萨拉菲主义运动，主要活动于伊朗俾路支人聚居区。该组织声称代表逊尼派伊朗人而战，旨在建立一个更加多元化的国家，同时保留伊斯兰教的影响。"
