 MD_ftc_exercise_capital: "항공모함 및 수상함 집단 훈련"
 MD_ftc_exercise_capital_desc: "항모 타격단 숙달 훈련과 수상 전투 훈련입니다. 비행갑판 운용 주기, 방공 조율, 해상 보급을 함께 연습합니다."
 MD_ftc_ex_capital_short: "90일간 주력함 교리 숙련도."
 MD_ftc_exercise_escort: "호위 훈련"
 MD_ftc_exercise_escort_desc: "호위함, 초계함, 순찰정을 위한 수송선단 차단막 및 대잠수함 훈련입니다. 소나 운용, 헬리콥터 협동, 대형 유지를 해상에서 연습합니다."
 MD_ftc_ex_escort_short: "90일간 호위 교리 숙련도."
 MD_ftc_exercise_submarine: "잠수함 훈련"
 MD_ftc_exercise_submarine_desc: "잠수함 부대를 위한 초계 및 어뢰 발사 훈련입니다. 승조원들은 정숙 항해, 수상 호위함 회피, 협동 공격을 연습합니다."
 MD_ftc_ex_submarine_short: "90일간 잠수함 교리 숙련도."
 MD_ftc_exercise_operations: "함대 전비 태세 훈련"
 MD_ftc_exercise_operations_desc: "지휘 통제, 군수, 피해 통제를 아우르는 함대 전체의 전비 태세 주기입니다. 함선들이 모항에서 멀리 떨어져서도 작전을 지속하도록 훈련합니다."
 MD_ftc_ex_operations_short: "90일간 해군 작전 숙련도."
 MD_ftc_staff_course_name: "참모 과정"
 MD_ftc_staff_course_short: "모든 해군 지휘관이 경험치를 얻으며, 한 명은 새로운 특성을 얻을 수 있습니다."
 MD_ftc_staff_course_cooldown: "참모 과정 진행 중"
 MD_ftc_staff_course_cooldown_desc: "해군 참모 장교들이 함대 참모 과정에 참석 중입니다. 이번 기수가 졸업하면 다음 입학이 시작됩니다."
 MD_ftc_flag_officer_course_name: "제독 과정"
 MD_ftc_flag_officer_course_short: "해군 지휘관 한 명의 기술 레벨이 상승합니다."
 MD_ftc_flag_officer_course_cooldown: "제독 과정 진행 중"
 MD_ftc_flag_officer_course_cooldown_desc: "고위 장교들이 제독 계급을 위한 지휘 교육을 이수하고 있습니다. 이번 기수가 수료하면 새 과정을 시작할 수 있습니다."
 MD_ftc_rnd_liaison_name: "해군 연구개발 연락단"
 MD_ftc_rnd_liaison_short: "해군 돌파 포인트를 얻습니다."
 MD_ftc_rnd_liaison_cooldown: "해군 연구개발 연락단 활동 중"
 MD_ftc_rnd_liaison_cooldown_desc: "함대 장교들이 해군 연구 기관에 파견되어 작전 교훈을 개발 요구 사항으로 전환하고 있습니다."
 MD_ftc_academy_name: "훈련 교과 과정"
 MD_ftc_academy_short: "해군사관학교 국가 정신을 해금하고 훈련 효과를 강화합니다."
 MD_ftc_academy_level_text: "레벨 [?ROOT.MD_ftc_academy_level|0]/3"
 MD_ftc_fleet_name: "함대 전비 태세 프로그램"
 MD_ftc_fleet_short: "대교리에 맞는 해군 국가 정신을 해금합니다."
 MD_ftc_fleet_level_text: "레벨 [?ROOT.MD_ftc_fleet_level|0]/3"
 MD_ftc_command_name: "해양 교리 센터"
 MD_ftc_command_short: "대교리에 맞는 해군 지휘 국가 정신을 해금합니다."
 MD_ftc_command_level_text: "레벨 [?ROOT.MD_ftc_command_level|0]/3"
 MD_ftc_academy_blue_water_1: "항공모함 전투 학교 I"
 MD_ftc_academy_blue_water_1_desc: "비행갑판 운용, 항공단 조율, 항모 전단 지휘에 관한 교육이 미래의 기동부대 지휘관을 양성합니다."
 MD_ftc_academy_blue_water_2: "항공모함 전투 학교 II"
 MD_ftc_academy_blue_water_2_desc: "$MD_ftc_academy_blue_water_1_desc$"
 MD_ftc_academy_blue_water_3: "항공모함 전투 학교 III"
 MD_ftc_academy_blue_water_3_desc: "$MD_ftc_academy_blue_water_1_desc$"
 MD_ftc_academy_green_water_1: "연안전 학교 I"
 MD_ftc_academy_green_water_1_desc: "연안 함대의 장교들이 천해 작전, 기뢰 대항책, 항구 접근로 방어를 연구합니다."
 MD_ftc_academy_green_water_2: "연안전 학교 II"
 MD_ftc_academy_green_water_2_desc: "$MD_ftc_academy_green_water_1_desc$"
 MD_ftc_academy_green_water_3: "연안전 학교 III"
 MD_ftc_academy_green_water_3_desc: "$MD_ftc_academy_green_water_1_desc$"
 MD_ftc_academy_jeune_ecole_1: "고속 공격정 학교 I"
 MD_ftc_academy_jeune_ecole_1_desc: "장교들이 속도와 경전력의 집중 운용에 기반한 미사일정, 순찰정, 초계함 전술을 훈련합니다."
 MD_ftc_academy_jeune_ecole_2: "고속 공격정 학교 II"
 MD_ftc_academy_jeune_ecole_2_desc: "$MD_ftc_academy_jeune_ecole_1_desc$"
 MD_ftc_academy_jeune_ecole_3: "고속 공격정 학교 III"
 MD_ftc_academy_jeune_ecole_3_desc: "$MD_ftc_academy_jeune_ecole_1_desc$"
 MD_ftc_academy_guerre_de_course_1: "잠수함 지휘 과정 I"
 MD_ftc_academy_guerre_de_course_1_desc: "예비 잠수함장들이 은밀 초계, 공격 접근, 상선 차단을 훈련합니다."
 MD_ftc_academy_guerre_de_course_2: "잠수함 지휘 과정 II"
 MD_ftc_academy_guerre_de_course_2_desc: "$MD_ftc_academy_guerre_de_course_1_desc$"
 MD_ftc_academy_guerre_de_course_3: "잠수함 지휘 과정 III"
 MD_ftc_academy_guerre_de_course_3_desc: "$MD_ftc_academy_guerre_de_course_1_desc$"
 MD_ftc_fleet_blue_water_1: "원정 군수 I"
 MD_ftc_fleet_blue_water_1_desc: "함대 보급선, 항해 중 보급, 전진 기지 계획이 배치된 기동부대의 작전 반경을 넓혀줍니다."
 MD_ftc_fleet_blue_water_2: "원정 군수 II"
 MD_ftc_fleet_blue_water_2_desc: "$MD_ftc_fleet_blue_water_1_desc$"
 MD_ftc_fleet_blue_water_3: "원정 군수 III"
 MD_ftc_fleet_blue_water_3_desc: "$MD_ftc_fleet_blue_water_1_desc$"
 MD_ftc_fleet_green_water_1: "지역 제해권 I"
 MD_ftc_fleet_green_water_1_desc: "상시 호위 및 순찰 체계가 본국 해역 인근의 해상 교통로와 연안 접근로를 확보합니다."
 MD_ftc_fleet_green_water_2: "지역 제해권 II"
 MD_ftc_fleet_green_water_2_desc: "$MD_ftc_fleet_green_water_1_desc$"
 MD_ftc_fleet_green_water_3: "지역 제해권 III"
 MD_ftc_fleet_green_water_3_desc: "$MD_ftc_fleet_green_water_1_desc$"
 MD_ftc_fleet_jeune_ecole_1: "분산 소함대 기지 I"
 MD_ftc_fleet_jeune_ecole_1_desc: "소형 함정들이 여러 분산된 항구와 대피소에서 작전하여 정비가 수월해지고 단 한 번의 타격에 노출되는 위험이 줄어듭니다."
 MD_ftc_fleet_jeune_ecole_2: "분산 소함대 기지 II"
 MD_ftc_fleet_jeune_ecole_2_desc: "$MD_ftc_fleet_jeune_ecole_1_desc$"
 MD_ftc_fleet_jeune_ecole_3: "분산 소함대 기지 III"
 MD_ftc_fleet_jeune_ecole_3_desc: "$MD_ftc_fleet_jeune_ecole_1_desc$"
 MD_ftc_fleet_guerre_de_course_1: "통상 파괴 참모부 I"
 MD_ftc_fleet_guerre_de_course_1_desc: "전담 참모부가 상선 통행 추적과 항로를 따라 기뢰를 부설하는 계획을 수립합니다."
 MD_ftc_fleet_guerre_de_course_2: "통상 파괴 참모부 II"
 MD_ftc_fleet_guerre_de_course_2_desc: "$MD_ftc_fleet_guerre_de_course_1_desc$"
 MD_ftc_fleet_guerre_de_course_3: "통상 파괴 참모부 III"
 MD_ftc_fleet_guerre_de_course_3_desc: "$MD_ftc_fleet_guerre_de_course_1_desc$"
 MD_ftc_command_blue_water_1: "항공모함 타격 사령부 I"
 MD_ftc_command_blue_water_1_desc: "합동 사령부가 항모 항공단과 호위함을 하나의 타격 전력으로 조율합니다."
 MD_ftc_command_blue_water_2: "항공모함 타격 사령부 II"
 MD_ftc_command_blue_water_2_desc: "$MD_ftc_command_blue_water_1_desc$"
 MD_ftc_command_blue_water_3: "항공모함 타격 사령부 III"
 MD_ftc_command_blue_water_3_desc: "$MD_ftc_command_blue_water_1_desc$"
 MD_ftc_command_green_water_1: "통합 연안 사령부 I"
 MD_ftc_command_green_water_1_desc: "연안 레이더, 항공기, 전함이 하나의 작전 센터에 보고하여 탐지와 차단막이 더욱 정교해집니다."
 MD_ftc_command_green_water_2: "통합 연안 사령부 II"
 MD_ftc_command_green_water_2_desc: "$MD_ftc_command_green_water_1_desc$"
 MD_ftc_command_green_water_3: "통합 연안 사령부 III"
 MD_ftc_command_green_water_3_desc: "$MD_ftc_command_green_water_1_desc$"
 MD_ftc_command_jeune_ecole_1: "군집 전술 사령부 I"
 MD_ftc_command_jeune_ecole_1_desc: "야간 경전력 집중 공격 후 신속 이탈하는 교리입니다."
 MD_ftc_command_jeune_ecole_2: "군집 전술 사령부 II"
 MD_ftc_command_jeune_ecole_2_desc: "$MD_ftc_command_jeune_ecole_1_desc$"
 MD_ftc_command_jeune_ecole_3: "군집 전술 사령부 III"
 MD_ftc_command_jeune_ecole_3_desc: "$MD_ftc_command_jeune_ecole_1_desc$"
 MD_ftc_command_guerre_de_course_1: "수중전 사령부 I"
 MD_ftc_command_guerre_de_course_1_desc: "중앙 잠수함 사령부가 초계 해역, 어뢰 교리, 대잠수함 정보를 지휘합니다."
 MD_ftc_command_guerre_de_course_2: "수중전 사령부 II"
 MD_ftc_command_guerre_de_course_2_desc: "$MD_ftc_command_guerre_de_course_1_desc$"
 MD_ftc_command_guerre_de_course_3: "수중전 사령부 III"
 MD_ftc_command_guerre_de_course_3_desc: "$MD_ftc_command_guerre_de_course_1_desc$"
 MD_ftc_tt_fully_upgraded: "§G업그레이드 완료§!"
 MD_ftc_tt_mastery_0_5: "§G+0.5§!"
 MD_ftc_tt_mastery_0_75: "§G+0.75§!"
 MD_ftc_tt_mastery_1_0: "§G+1.0§!"
 MD_ftc_tt_mastery_1_25: "§G+1.25§!"
 MD_ftc_ex_capital_tt: "§Y항공모함 및 수상함 집단 훈련§!\n\n£navy_experience 해군 경험치: §R-450§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y항공모함 및 수상함 집단 훈련§!을 획득합니다:\n £fuel_consumption_texticon  해군 연료 소비: §R+25%§!\n £attack_battleship_texticon  주력함 공격: §G+3%§!\n£doctrine_mastery §H주력함§! 숙련도: 하루당 [MD_ftc_exercise_mastery_tt_text], §H90§!일간\n\n항공모함, 헬리콥터 운용함, 전함, 순양전함, 순양함, 구축함, 스텔스 구축함, 중호위함 중 최소 하나를 포함하여 최소 §H8§!척의 함선으로 이루어진 해군이 필요합니다."
 MD_ftc_ex_escort_tt: "§Y호위 훈련§!\n\n£navy_experience 해군 경험치: §R-450§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y호위 훈련§!을 획득합니다:\n £fuel_consumption_texticon  해군 연료 소비: §R+25%§!\n £attack_screen_texticon  스크린 함 공격: §G+3%§!\n£doctrine_mastery §H호위함정§! 숙련도: 하루당 [MD_ftc_exercise_mastery_tt_text], §H90§!일간\n\n스크린 구축함, 호위함, 스텔스 호위함, 초계함, 스텔스 초계함, 초계정 중 최소 하나를 포함하여 최소 §H8§!척의 함선으로 이루어진 해군이 필요합니다."
 MD_ftc_ex_submarine_tt: "§Y잠수함 훈련§!\n\n£navy_experience 해군 경험치: §R-450§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y잠수함 훈련§!을 획득합니다:\n £fuel_consumption_texticon  해군 연료 소비: §R+25%§!\n £attack_submarine_texticon  잠수함 공격: §G+3%§!\n£doctrine_mastery §H잠수함§! 숙련도: 하루당 [MD_ftc_exercise_mastery_tt_text], §H90§!일간\n\n공격 잠수함 또는 미사일 잠수함 중 최소 하나를 포함하여 최소 §H8§!척의 함선으로 이루어진 해군이 필요합니다."
 MD_ftc_ex_operations_tt: "§Y함대 전비 태세 훈련§!\n\n£navy_experience 해군 경험치: §R-450§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y함대 전비 태세 훈련§!을 획득합니다:\n £fuel_consumption_texticon  해군 연료 소비: §R+25%§!\n £organization_texticon  해군 편제 유지력: §G+3%§!\n£doctrine_mastery §H지원함정§! 숙련도: 하루당 [MD_ftc_exercise_mastery_tt_text], §H90§!일간\n\n수리함과 지원함을 각각 최소 하나씩 포함하여 최소 §H8§!척의 함선으로 이루어진 해군과 최소 §H100§!개의 수송선단이 필요합니다."
