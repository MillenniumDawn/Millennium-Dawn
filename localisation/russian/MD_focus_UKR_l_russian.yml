 ukr_modernize_sov_equipment_t55_tifon_development_own_tech_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t55_tifon_development_for_tooltip\n\n\n\n\n\n\n\n\n§W§YХКБМ§! адаптирует §YТ-55§! под пакет, согласованный с §Y[PRU.GetNameWithFlag]§!, и строит прототип для испытаний в Андах. Этот вариант §Rтолько для экспорта§! и нашей армии не предлагается.\n------------------\nТребования этого решения можно значительно §Gснизить§!, если технология §Y$era_tech_3$§! уже изучена (§Y[ROOT.GetFlag][ROOT.GetName]§!). Без неё §YХКБМ§! разработает её для §YTifon II§!, и мы §Gполучим её§! по завершении работ.§!\n\n$UKR_rada_modernization_design_tt$"
