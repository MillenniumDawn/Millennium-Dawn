support_doctrine_ast_desc: "Our role in the Pacific is ultimately to support our allies by monitoring and assisting trade, specialising in touch-and-go situations."
dominance_doctrine_ast: "Dominance Doctrine"
dominance_doctrine_ast_desc: "Our role in the Pacific is that of naval supremacy. Through this our mandates are carried out and backed by the force we wield at sea."
