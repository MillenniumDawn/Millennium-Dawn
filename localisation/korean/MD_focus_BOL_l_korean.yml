 BOL_ethnic_divide_decisions: "볼리비아의 민족 분열"
 BOL_ethnic_divide_decisions_desc: "\n\n\n\n\n\n£BOL_desctext_ethnic_divide\n\n\n\n\n\n\n\n\n볼리비아는 유럽계와 원주민의 혼혈인 메스티소(주로 메디아 루나로 통칭되는 동부 볼리비아에서 다수를 차지함)와 서부 볼리비아에서 다수를 차지하는 볼리비아 원주민 사이에서 깊은 민족적, 인종적 분열을 겪고 있습니다. 최근 몇 년간 긴장이 고조되어 권리 부족과 용수 접근권 같은 문제를 둘러싼 원주민 시위가 많이 일어났습니다. 이 집단들의 여론을 안정적인 수준으로 유지하는 것이 중요하며, 그렇지 않으면 양쪽에서 서로 다른 종류의 불안정이 발생할 수 있습니다. 따라서 잘못된 결정 하나가 우리가 아는 볼리비아의 분열로 이어질 수 있으므로 신중하게 처신해야 합니다.\n\n§R원주민 여론이 15 아래로 떨어지면 원주민 집단이 대규모 시위를 통해 정부의 사퇴를 요구할 것이며, 우리가 그 요구에 따르지 않으면 서부 볼리비아의 원주민이 정부에 맞서 반란을 일으킬 것입니다.§!\n\n§Y메스티소 여론이 15 아래로 떨어지면 역사적으로 영향력이 있고 친메스티소 성향인 [Nat_Autocracy_L]이(가) 정부의 사퇴와 조기 선거 실시 때까지의 친메스티소 임시 정부 수립을 요구할 것이며, 우리가 따르지 않으면 군부가 쿠데타를 일으켜 군사 정권을 세울 것입니다.§!\n\n메스티소 여론: [?BOL_mestizo_support]\n\n원주민 여론: [?BOL_indigenous_support]"
