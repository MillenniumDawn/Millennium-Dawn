 APC_9: "БТР 2045 года"
 APC_9_desc: "Бронетранспортёры — бронированные машины, предназначенные для доставки в бой отделения солдат, которые затем спешиваются и сражаются в пешем порядке. Они защищают солдат, но, как правило, собственные боевые возможности у них ограничены. Пехоту, перевозимую на БТР, называют механизированной пехотой."
 APC_10: "БТР 2055 года"
 APC_10_desc: "Бронетранспортёры — бронированные машины, предназначенные для доставки в бой отделения солдат, которые затем спешиваются и сражаются в пешем порядке. Они защищают солдат, но, как правило, собственные боевые возможности у них ограничены. Пехоту, перевозимую на БТР, называют механизированной пехотой."
