l_polish:
 decision_category_energy: "Kategoria Decyzji Energetycznych"
 decision_category_energy_desc: "\n£MAIN_desctext_energy \n\n\n\n§Y[ROOT.GetFlag]Każdy naród§! musi utrzymywać odpowiedni poziom zaopatrzenia w energię, aby jego funkcje i usługi nie zawiodły. Jeśli §Rnie uda nam się§! utrzymać rosnących §Ywymagań energetycznych§! naszej gospodarki, możemy ponieść ogromne §Rkonsekwencje§! i §Rpełne załamanie gospodarki.§!"
 HEADER_TEXT_TITLE: "§YENERGIA§!"
 energy_dynamic_modifier: "Krajowa Sieć Energetyczna"
 energy_dynamic_modifier_TT: "Ten parametr wyświetla sumę zużycia paliwa przez elektrownie kopalne oraz bezpośredniego zużycia paliwa ze źródeł nieelektrycznych, a także ewentualne kary wynikające z niezaspokojenia zapotrzebowania na energię przez jej produkcję. Wyświetli to również wszelką energię współdzieloną lub przekazaną z innego państwa w ramach mechanizmu Energy Load Sharing."
 no_fuel_penalties_modifier: "Kary za Niedobór Paliwa"
 no_fuel_penalties_modifier_TT: "Ten Duch ukazuje kary, jakie powstaną, jeśli kraj zużyje wszystkie swoje rezerwy paliwa, nie pozostawiając nic do wykorzystania przez ludność."
 hydroelectric_infrastructure_in_state: "Infrastruktura Hydroelektryczna"
 hydroelectric_infrastructure_in_state_TT: "Infrastruktura hydro elektryczna obejmuje wszystkie tamy wodne, magazyny i inne elementy związane z Energią Wodną. Modyfikator stanu uwzględnia całkowitą wyprodukowaną energię oraz ilość magazynowanej energii, jaką może ona pomieścić. Przyczynia się do całkowitego wytwarzania energii i jako tako pomaga pokryć zużycie energii w przemyśle i populacji."
 geothermal_infrastructure_in_state: "Infrastruktura Geotermalna"
 geothermal_infrastructure_in_state_TT: "Infrastruktura geotermalna obejmuje wszystkie elektrownie geotermalne i podobną infrastrukturę. Przyczynia się do całkowitego wytwarzania energii i jako taki pomaga pokryć zużycie energii w przemyśle i populacji."
 renewable_capacity_factor_dyn_mod: "§Y[?THIS.modifier@state_renewable_capacity_factor_modifier]§!"
 renewable_capacity_factor_dyn_mod_TT: "§Y [THIS.GetName] §! jest §Y Miejsce o szczególnym potencjale w zakresie energii odnawialnej §!, dysponujący korzystnymi warunkami do jej wytwarzania – czy to dzięki stabilnym, silnym wiatrom, czy też ponadprzeciętnemu rocznemu nasłonecznieniu.\n\n Im wyższy jest współczynnik wykorzystania energii odnawialnej, tym więcej energii wytwarzają każdego tygodnia dla właściciela danego państwa parki energii odnawialnej na tym obszarze."
 heavy_power_restrictions_spirit: "Duże Ograniczenie Energii"
 some_power_restrictions_spirit: "Umiarkowane Ograniczenia Prądu"
 some_additional_consumption_spirit: "Umiarkowane Dotacje Na Zużycie Energii"
 heavy_additional_consumption_spirit: "Dotacje na Duże Zużycie Energii"
 build_battery_park_effect_TT: "Zmienia liczbę §YParków Baterii§! o [?temp_change|0+] w [ROOT.GetNameWithFlag] (obecnie: [?number_of_battery_parks|Y0])"
 has_nuclear_reactors_tt: "[THIS.GetNameWithFlag] ma co najmniej 1 §Y$nuclear_reactor$§! (Aktualnie: [?nuclear_reactors|Y0])\n"
 has_enrichment_facilities_tt: "[THIS.GetNameWithFlag] ma co najmniej 1 §Y $enrichment_facility$ §!\n"
 has_reactor_material_stockpile_tt: "[THIS.GetNameWithFlag] zawiera co najmniej 500 Kg §Y Materiałów jądrowych klasy reaktora §! (Bieżące: [?THIS.var_reactor_material_stockpile|Y0])\n"
 change_reactor_grade_material_effect_tt: "Zmienia zapasy §YMateriału klasy Reaktora§! o [?change_resource|0+] w [THIS.GetNameWithFlag] (Obecnie: [?THIS.var_reactor_material_stockpile|Y0])\n"
 recently_bought_fuel_tt: "Ostatnio Kupiono Paliwo na Rynku. (Pozostało Dni: [?recently_bought_fuel:days_left|0Y])"
 early_renewables: "Podstawowe Panele Słoneczne"
 early_renewables_desc: "Panele z krystalicznego krzemu przekształcają światło słoneczne w energię elektryczną bez użycia paliwa i bez ruchomych części. Są drogie i przetwarzają niewiele ponad jedną dziesiątą światła, które pochłaniają, ale po raz pierwszy dostarczają energię słoneczną na dachy i do odległych miejsc."
 renewables: "Postęp w Zakresie Turbin Wiatrowych"
 renewables_desc: "Większe wirniki, generatory o zmiennej prędkości i lepsza aerodynamika pozwalają pojedynczej turbinie osiągać moc rzędu megawatów. Farmy wiatrowe przechodzą z fazy demonstracyjnej do fazy komercyjnego zasilania sieci."
 improved_renewables: "Wysokowydajna Fotowoltaika"
 improved_renewables_desc: "Czystszy krzem i lepsze konstrukcje ogniw zwiększają wydajność paneli do 20%, a większe fabryki obniżają koszt każdego modułu. Obok systemów dachowych zaczynają pojawiać się farmy fotowoltaiczne na skalę przemysłową."
 advanced_renewables: "Kompozytowe Łopaty Wiatrowe"
 advanced_renewables_desc: "Łopaty z włókna szklanego i węglowego są lżejsze i sztywniejsze niż wcześniejsze konstrukcje, dzięki czemu wirniki mogą być dłuższe bez wginania się w wieżę. Dłuższe łopaty przenoszą więcej powietrza i utrzymują obroty turbin przy słabszym wietrze."
 modern_renewables: "Cienkowarstwowa Technologia Słoneczna"
 modern_renewables_desc: "Ogniwa cienkowarstwowe nakładają kilka mikrometrów materiału absorbującego światło na szkło lub elastyczne arkusze. Wykorzystują one ułamek surowca potrzebnego do produkcji płytek krzemowych i szybko pokrywają duże powierzchnie, co znacznie obniża koszty farmy słonecznej."
 improved_modern_renewables: "Morskie Farmy Wiatrowe"
 improved_modern_renewables_desc: "Turbiny budowane na morzu wychwytują silniejsze i bardziej stabilne wiatry niż jakiekolwiek turbiny na lądzie. Specjalnie zbudowane statki instalacyjne i stałe fundamenty pozwalają deweloperom budować farmy składające się z setek turbin z dala od brzegu."
 advanced_modern_renewables: "Dwustronne Panele Słoneczne"
 advanced_modern_renewables_desc: "Dwustronne panele zbierają światło z obu stron, przechwytując zarówno światło słoneczne odbite od ziemi, jak i bezpośrednio padające na nie. Zamontowane na trackerach, które podążają za słońcem na niebie, zwiększają moc farmy fotowoltaicznej bez zajmowania dodatkowego terenu."
 fuel_efficiency: "Zaawansowana Inżynieria Spalania"
 fuel_efficiency_desc: "Stopniowe spalanie i ściślejsza kontrola mieszanki powietrza i paliwa pozwalają kotłom spalać paliwo w sposób pełniejszy. Nasze elektrownie pozyskują więcej energii elektrycznej z każdej tony węgla i każdego metra sześciennego gazu."
 fuel_efficiency2: "Zintegrowany Cykl Łączony Zgazowania"
 fuel_efficiency2_desc: "Elektrownie IGCC przetwarzają węgiel na gaz syntetyczny, usuwają z niego zanieczyszczenia i spalają go w turbinie gazowej, a następnie odzyskują ciepło spalin w cyklu parowym. Dwustopniowa konstrukcja pozwala uzyskać znacznie większą moc z tego samego paliwa."
 fuel_efficiency3: "Wysokowydajne Technologie Niskoemisyjne"
 fuel_efficiency3_desc: "Elektrownie HELE wykorzystują parę w temperaturach i ciśnieniach nadkrytycznych i ultranadkrytycznych. Gorętsza para oznacza więcej energii z każdej tony paliwa i mniej dwutlenku węgla na każdą megawatogodzinę."
 fuel_efficiency4: "Integracja z Wychwytywaniem i Składowaniem Dwutlenku Węgla (WSDW)."
 fuel_efficiency4_desc: "Jednostki wychwytujące wychwytują dwutlenek węgla ze spalin elektrowni i odprowadzają go do głębokich formacji skalnych, gdzie jest składowany. Zaprojektowanie systemu wychwytywania od samego początku, zamiast jego dobudowy, pozwala zminimalizować zużycie energii."
 fuel_efficiency5: "Optymalizacja i Monitorowanie Oparte na Sztucznej Inteligencji"
 fuel_efficiency5_desc: "Modele uczenia maszynowego odczytują tysiące czujników w elektrowni i sekunda po sekundzie dostosowują przepływ paliwa, dopływ powietrza i obciążenie turbiny. Sygnalizują zużycie części na długo przed awarią, dzięki czemu nasze elektrownie pracują blisko szczytowej wydajności przez dłuższy czas."
 fuel_efficiency6: "Elektrownie na Paliwa Kopalne o Niemal Zerowej Emisji"
 fuel_efficiency6_desc: "Spalanie tlenowo-paliwowe spala paliwo w czystym tlenie, pozostawiając parę wodną i niemal czysty dwutlenek węgla, który łatwo wychwycić. Nasze rośliny kopalne nie emitują obecnie do atmosfery prawie nic."
 energy_efficiency: "Podstawy Termodynamiczne"
 energy_efficiency_desc: "Stosując podstawowe zasady termodynamiki, można natychmiast zmniejszyć straty energii w fabrykach i budynkach biurowych."
 energy_efficiency2: "Zastosowanie izolacji termicznej"
 energy_efficiency2_desc: "Znaczna część krajowych kosztów energii pochodzi z ogrzewania i chłodzenia budynków. Zastosowanie izolacji termicznej może obniżyć te wydatki, umożliwiając wykorzystanie pozyskanej energii w innym miejscu."
 energy_efficiency3: "Zaawansowana Integracja Sterowania"
 energy_efficiency3_desc: "Integrując podstawowe algorytmy z termostatami i systemami sterowania, można jeszcze bardziej poprawić wydajność, co umożliwi dodatkowe oszczędności energii."
 energy_efficiency4: "Izolacja o Dużej Gęstości"
 energy_efficiency4_desc: "Stosując nowocześniejsze materiały, można zwiększyć gęstość izolacji i uzyskać jeszcze większe oszczędności energii."
 energy_efficiency5: "Elektrownie Ulepszone Metodą TEG"
 energy_efficiency5_desc: "Wiele nowoczesnych elektrowni nadal wykorzystuje ciepło do zamiany wody w parę. Chociaż z biegiem lat rozwiązanie to stało się bardziej wydajne, nadal wytwarza duże ilości ciepła odpadowego. Generatory termoelektryczne można elastycznie wykorzystywać do uzyskiwania dodatkowego napięcia z ciepła odpadowego. Znajduje to odzwierciedlenie w obniżeniu całkowitego kosztu paliwa w fabrykach."
 energy_efficiency6: "Izolatory z Nanowłókien"
 energy_efficiency6_desc: "Najnowsze osiągnięcia w technologii nanowłókien umożliwiają zastosowanie jednych z najbardziej zaawansowanych i gęstych izolacji, jakie kiedykolwiek powstały. To znacznie poprawi efektywność energetyczną."
 energy_efficiency7: "Integracja TEG na Dużą Skalę"
 energy_efficiency7_desc: "Wykraczając poza zwykłe izolowanie fabryk i biur, Generatory Termoelektryczne można wykorzystać do odzyskiwania energii, która w przeciwnym razie zostałaby utracona nawet w przypadku najnowocześniejszej izolacji termicznej."
 energy_efficiency8: "Mikrogeneratory"
 energy_efficiency8_desc: "Montaż wydechów z turbinami generatorów o małej skali i poprowadzenie przewodów termoelektrycznych przez okna przenosi odzysk energii na wyższy poziom."
 TOTAL_GENERATION_ENERGY: "§HCałkowita produkcja§!: [?energy_sum|G2] GW"
 ENERGY_GENERATION_TOTAL_TT: "Poniższe wartości przedstawiają pełne zestawienie źródeł wytwarzanej energii. §YElektrownie na paliwa kopalne§! będą bezczynne, jeśli produkujesz więcej energii niż zużywasz. Bezczynne §YElektrownie na paliwa kopalne§! nie zużywają §YPaliwa§!.\n----------\n§YMoc z paliw kopalnych§! Generowanie: [?fossil_pp_energy_generation|G2] GW\n§YMoc bezczynnych elektrowni kopalnych§! Generowanie: [?free_fossil_powerplants_power|Y2] GW\n§YEnergia hydroelektryczna§! Generowanie: [?hydroelectric_energy_generation|G2] GW\n§YEnergia geotermalna§! Generowanie: [?geothermal_energy_generation|G2] GW\n§YNergia jądrowa§! Generacja: [?nuclear_energy_generation|G2] GW\n§Y Energia słoneczna i wiatrowa§! Generacja: [?renewable_energy_display_var|G2] GW\n§Y Inne źródła§! Generacja: [?other_energy_generation|G2] GW\n§Y Pobór energii z magazynów§!: [?energy_withdrawal_from_storage|G2] GW\n\n----------\n§Y Potencjalna energia słoneczna i wiatrowa§! Generacja: [?minimum_renewable_energy_var|+2] GW do [?maximum_renewable_energy_var|+2] GW\nCałkowita produkcja energii przez §Y Podział obciążenia energetycznego§!: [?energy_load_sharing_gain_var|G2]"
 TOTAL_CONSUMPTION_ENERGY: "§HCałkowite zużycie§!: [?energy_consumption|R2] GW"
 TOTAL_CONSUMPTION_ENERGY_TT: "Poniższe wartości stanowią pełne zestawienie źródeł zużycia energii.\n----------\n§YZużycie energii przez populację:§! [?population_energy_use_display_var|R2] GW\nSezonowe zapotrzebowanie ludności: [?energy_seasonal_population_demand_factor|%0R]\n§YCałkowite zużycie energii w budynkach:§! [?energy_use_buildings_total_display_var|R2] GW\n§YInne zużycie energii:§! [?other_energy_use_display_var|R2] GW\n----------\n§YZużycie energii w budynku według rodzaju:§!\n§YZużycie energii w fabrykach cywilnych:§! [?energy_use_civs_total_display_var|R2] GW\n§YZużycie energii w biurach:§! [?energy_use_offices_total_display_var|R2] GW\n§YZużycie energii w fabrykach wojskowwych:§! [?energy_use_mils_total_display_var|R2] GW\n§YZużycie energii w stoczniach Marynarki Wojennej:§! [?energy_use_dockyards_total_display_var|R2] GW\n§YZużycie energii w okręgach rolnictwa komercyjnego:§! [?energy_use_agriculture_district_total_display_var|R2] GW\n§YZużycie energii w fabrykach mikroprocesorów:§! [?energy_use_microchip_plant_total_display_var|R2] GW\n§YZużycie energii w fabrykach produkcji kompozytów:§! [?energy_use_composite_plant_total_display_var|R2] GW\n§YZużycie energii w rafineriach syntetycznych:§! [?energy_use_synthetic_refinery_total_display_var|R2] GW\n\n"
 MISSING_FULFILLMENT_VALUE: "§HNiedobór Energii§!: [?unfulfilled_energy_demand_var|%+]"
 MISSING_FULFILLMENT_VALUE_TT: "Wartość ta stanowi odsetek naszego wymaganego §YZapotrzebowania na energię§!, który nie jest obecnie zaspokajany.\n\n§YWpływ niezaspokojenia potrzeb konsumpcyjnych§!\n£construction_speed_texticon  Szybkość budowy:[?unfulfilled_energy_demand_dynmod_var|+%]\n£research_speed_texticon Szybkość badań:[?unfulfilled_energy_demand_dynmod_var|+%]\n£tax_gain_multiplier_modifier_texticon Mnożnik §YPrzychodów podatkowych§!:[?unfulfilled_energy_demand_dynmod_var_3|+%]\n£factory_output_texticon Produkcja fabryczna:[?unfulfilled_energy_demand_dynmod_var|+%]\n£dockyard_output_texticon Produkcja stoczniowa:[?unfulfilled_energy_demand_dynmod_var|+%]\n£stability_texticon  Stabilność: [?unfulfilled_energy_demand_dynmod_var_2|+%]"
 NET_ENERGY_BALANCE: "§HBilans Energetyczny§!: [energy_total_net_energy_balance]"
 NET_ENERGY_BALANCE_TT: "Wartość §HCałkowitego Bilansu Energii§! jest wartością względną §HCałkowitej Wytworzonej Energii§!, podzieloną przez §HCałkowite Zużycie Energii§!, co pokazuje §HBilans Energii§! jako procent."
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES: "§YElektrownie na paliwa kopalne§! Dzienne zużycie: §YPaliwa§! [?fossil_pp_fuel_display|0R]"
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES_TT: "Wartość ta reprezentuje całkowitą ilość paliwa zużywanego dziennie przez wszystkie aktywne §Yelektrownie na paliwa kopalne§!. §YElektrownie na paliwa kopalne§! zaczynają pracować na biegu jałowym, gdy łączna moc generowania jest większa niż łączne zużycie.\n\n§YModyfikatory§!:\nPrawo, duch narodowy i technologie mają wpływ na §Yelektrownie na paliwa kopalne§! Zużycie: [?modifier@fossil_pp_fuel_consumption_modifier|-%]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES: "Dzienne zużycie §YPaliwa§! przez §YLudność§!: [?non_electric_fuel_display|0R]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES_TT: "Ta wartość reprezentuje całkowitą ilość paliwa zużywanego dziennie przez całą naszą §YLudność§!.\n\n§YModyfikatory§!:\nWpływ prawa, pomysłów i technologii na zużycie §YPaliwa Nieelektrycznego§!: [?modifier@non_electric_fuel_consumption_modifier|-%]\n Sezonowe zapotrzebowanie ludności: [?energy_seasonal_population_demand_factor|%0R]\n\n Zapotrzebowanie ludności na energię elektryczną i paliwa inne niż elektryczne wzrasta o 20% w okresach od grudnia do lutego oraz od czerwca do sierpnia. Zapotrzebowanie sezonowe uwzględniane jest po zastosowaniu innych modyfikatorów i jest aktualizowane w ramach cotygodniowych obliczeń zużycia energii."
 TOTAL_ENERGY_MISC_VALUE_HEADER: "Zużycie Paliwa"
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION: "Cotygodniowa §Gprodukcja§! §YPaliwa Jądrowego§!: [?net_nuclear_fuel_display|0+] Kg"
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION_TT: "Wartość ta odzwierciedla tygodniową produkcję netto §YMateriału klasy reaktorowej§! dla naszych §Yreaktorów jądrowych§!. Wartość ta stanowi różnicę między tygodniową produkcją a zużyciem §YMateriału klasy reaktorowej§!.\n\n§YZapasy materiału klasy reaktorowej§!: £GFX_nuclear_material_texticon §G[?var_reactor_material_stockpile]§! Kg\n§Y Tygodniowa produkcja materiału klasy reaktorowej§!: [?total_nuclear_reactor_fuel_production|G2] Kg\n§Y Tygodniowe zużycie materiału klasy reaktorowej §!: [?nuclear_fuel_consumption|-2] Kg\n\n§Y Modyfikatory§!:\nPrawo, Duch Narodu i Wpływ technologii na §YPaliwa w reaktorze jądrowym§!: Zużycie: [?modifier@nuclear_fuel_consumption_modifier|-%]"
 TOTAL_STORED_ENERGY: "Zmagazynowana Energia: [?stored_energy|3Y] GWh z [?max_stored_energy|3Y] GWh"
 TOTAL_STORED_ENERGY_TT: "Pokazuje to aktualną ilość zmagazynowanej nadwyżki energii, oprócz maksymalnej ilości, jaką możemy przechowywać. Możemy uzyskać więcej §YMaksymalnego Zapasu§! budując dodatkowe §YParki Akumulatorów§!."
 OPEN_ENERGY_BUTTON: "Otwórz§Y Ekran Energii§! Interfejs"
 OPEN_ENERGY_BUTTON_TT: "Spowoduje to otwarcie§Y ekranu energii§!, na którym można zobaczyć zużycie, wytwarzanie i zaspokojenie potrzeb energetycznych kraju."
 total_ffp_amount_tt: "Wartość ta przedstawia całkowitą liczbę §Yelektrowni zasilanych paliwami kopalnymi§! w naszym kraju."
 total_ffp_amount_tt_delayed: "§Y Elektrownie na paliwa kopalne §! to zbiorcze określenie wszystkich źródeł energii termoelektrycznej opartych na paliwach kopalnych. Należą do nich, ale nie wyłącznie; węgiel, gaz ziemny i ropa naftowa. §Y Elektrownie na paliwa kopalne §! będą pracować bezczynnie, jeśli wytwarzanie energii będzie wyższe niż jej zużycie.\n\nZapewnia państwu:\nBazowa liczba wymaganych pracowników: §Y7,5K§!\nBazowa wielkość produkcji PKB na §YElektrownię opartą na paliwach kopalnych§!: $§Y1,7 miliarda§!\nBazowy wzrost mocy: §G+2§! GW\n\nAktualny §YPrzyrost mocy na elektrownię§!: [?fossil_pp_energy_per_plant_display|+2] GW"
 total_nuclear_reactor_amount_tt: "Wartość ta przedstawia całkowitą liczbę §Yreaktorów jądrowych§! w naszym kraju."
 total_nuclear_reactor_amount_tt_delayed: "Budynek ten przekształca energię jądrową w energię elektryczną, zużywając przy tym umiarkowanie wzbogacony uran.\n\nZapewnia państwu:\nBazowa liczba wymaganych pracowników: §Y115K§!\nPodstawowa produkcja PKB na §YReaktor Jądrowy§!: $§Y4 miliardy§!\nBazowy wzrost mocy: §G+4§! GW\n\nAktualny §YPrzyrost mocy na reaktor§!: [?nuclear_energy_per_reactor_display|+2] GW"
 total_renewable_energy_amount_tt: "Wartość ta przedstawia całkowitą liczbę §YInfrastruktury Energii Odnawialnej§! w naszym kraju."
 total_renewable_energy_amount_tt_delayed: "§YInfrastruktura Energii Odnawialnej§! to zbiorcze określenie wszystkich odnawialnych źródeł energii. Obejmują one, ale nie ograniczają się do: parków słonecznych, turbin wiatrowych, rafinerii biopaliw, zakładów produkujących węgiel drzewny, elektrowni biopaliwowych i innych. Jako takie wykorzystuje odnawialne źródła i produkuje paliwo z tych źródeł.\n\nZapewnia państwu:\nBazowa liczba wymaganych pracowników: §Y22,5K§!\nBazowa wielkość PKB w przeliczeniu na §YInfrastrukturę energii odnawialnej§!: $ §Y2 miliardy§!\nBazowy przyrost moocy: §G +0,5§! GW\n"
 total_fuel_silo_amount_tt: "Wartość ta przedstawia całkowitą liczbę §YStrategicznych Rezerw Surowców§! w naszym kraju."
 total_fuel_silo_amount_tt_delayed: "§YStrategiczna Rezerwa Surowców§! to połączenie magazynów, suchych magazynów i innych przechowalni §YPaliwa§!. Ten budynek zapewnia twojemu krajowi więcej miejsca na składowanie §HPaliwa§!."
 heavy_power_restrictions_button_tt: "§YCiężkie ograniczenia mocy zasilania§!\nNasze zużycie energii przewyższa jej wytwarzanie. Możliwym tymczasowym rozwiązaniem jest szybkie ograniczenie zużycia energii elektrycznej przez ludność, dopóki nie zaczniemy budować dodatkowych elektrowni, energii odnawialnej i innych, aby złagodzić ten rosnący kryzys. Nałożenie dużych ograniczeń na ludzi spowoduje znaczne zmniejszenie wzrostu gospodarczego, zużycia energii i projekcji politycznych."
 heavy_power_restrictions_button_delayed_tt: "§Y Efekty: §!\n[!heavy_power_restrictions_button_click]"
 some_power_restrictions_button_tt: "§YPewne ograniczenie mocy zasilania§!\nNasze zużycie energii przewyższa jej wytwarzanie. Możliwym tymczasowym rozwiązaniem jest szybkie ograniczenie zużycia energii elektrycznej przez ludność, dopóki nie zaczniemy budować dodatkowych elektrowni, energii odnawialnej i innych, aby złagodzić ten rosnący kryzys. Nałożenie pewnych ograniczeń na ludzi spowoduje niewielką redukcję wzrostu gospodarczego, zużycia energii i projekcji politycznych."
 some_power_restrictions_button_delayed_tt: "§Y Efekty: §!\n[!some_power_restrictions_button_click]"
 no_power_restrictions_button_tt: "§YBrak ograniczeń mocy§!\nStatus quo jest zwykle najbardziej normalnym scenariuszem dla gospodarki naszego narodu i bezpieczeństwa politycznego naszej partii. Nie ograniczamy konsumpcji ludzi ani nie zachęcamy do dodatkowej konsumpcji."
 no_power_restrictions_button_delayed_tt: "§Y Efekty: §!\n[!no_power_rules_button_click]\nBrak modyfikatorów polityki konsumpcyjnej."
 some_additional_consumption_button_tt: "§YDodatkowe zużycie energii§!\nObecnie nadprodukujemy energię dla naszego wielkiego narodu. Powinniśmy zachęcać do dodatkowej konsumpcji, aby wykorzystać naszą nadmierną produkcję. Zachęcanie do dodatkowej konsumpcji da nam niewielką premię do szybkości budowy i siły politycznej, jednocześnie zwiększając zużycie energii przez naszych obywateli o niewielką ilość."
 some_additional_consumption_button_delayed_tt: "§Y Efekty: §!\n[!some_additional_consumption_button_click]"
 heavy_additional_consumption_button_tt: "§YWysokie dodatkowe zużycie energii§!\nObecnie nadprodukujemy energię dla naszego wielkiego narodu. Powinniśmy zachęcać do dodatkowej konsumpcji, aby wykorzystać naszą nadmierną produkcję. Zachęcanie do dużej dodatkowej konsumpcji da nam dużą premię do szybkości budowy i siły politycznej, jednocześnie zwiększając zużycie energii przez naszych obywateli o dramatyczną kwotę."
 heavy_additional_consumption_button_delayed_tt: "§Y Efekty: §!\n[!heavy_additional_consumption_button_click]"
 build_battery_park_button_tt: "§YBudowa parku akumulatorów§!\n§YPark akumulatorów§! to duża, kosztowna konstrukcja, która może przechowywać §Y100 GWh§! nadwyżki wyprodukowanej energii. Budowanie takich obiektów może być korzystne, aby pomóc w magazynowaniu energii na czas, gdy nie jesteśmy w stanie wyprodukować jej wystarczająco dużo, aby zaspokoić konsumpcję, szczególnie w przypadku korzystania z energii odnawialnej ze względu na jej niestabilną wydajność."
 build_battery_park_button_delayed_tt: "§Y Wymagania wstępne: §!\n[!build_battery_park_button_click_enabled]\n§Y Efekty: §!\n[!build_battery_park_button_click]\nMożemy zakolejkować grupę §Y trzech parków akumulatorów §! na raz przez £key_shift +£click_left §Y Shift L Click §!.\n§Y Wymagania wstępne: §!\n[!build_battery_park_button_shift_click_enabled]\n§Y Efekty: §!\n[!build_battery_park_button_shift_click]"
 buy_fuel_for_money_button_tt: "§YKup paliwo z rynku§!\nNiektórzy sprzedawcy na całym świecie oferują paliwo za pieniądze. Zakup paliwa może pomóc w utrzymaniu naszych elektrowni zasilanych paliwami kopalnymi i naszego wojska."
 buy_fuel_for_money_button_delayed_tt: "§YWymagania wstępne:§!\n[!buy_fuel_for_money_button_click_enabled]\n§YEfekty:§!\n[!buy_fuel_for_money_button_click]\n£key_shift +£click_left §YShift+Lewe Kliknięcie§! skonfigurować automatyczny zakup §YPaliwa§!, gdy jego poziom jest niski"
 ENERGY_GENERATION_TOTAL_DELAYED_TT: "§YModyfikatory§!:\nWpływ prawa, ducha narodu i technologii na §YWszystkie Moce Wytwarzania Energii§!: [?modifier@energy_gain_multiplier|+%]\nWpływ prawa, ducha narodu i technologii na §YWytwarzanie Energii ze Źródeł Odnawialnych§!: [?modifier@renewable_energy_gain_multiplier|%+]\nWpływ prawa, ducha narodu i technologii na §YWytwarzanie Energii z Paliw Kopalnych§!: [?modifier@fossil_pp_energy_generation_modifier|%+]\nWpływ prawa, ducha narodu i technologii na §YWytwarzanie Energii w Energetyce Jądrowej§!: [?modifier@nuclear_energy_generation_modifier|%+]\n\n"
 TOTAL_CONSUMPTION_ENERGY_DELAYED_TT: "§YModyfikatory§!:\nWpływ praw, ducha narodu i technologii na §YCałkowite zużycie energii§!: [?modifier@energy_use_multiplier|-%]\nWpływ praw, ducha narodu i technologii na §YZuużycie energii przez populację§!: [?modifier@pop_energy_use_multiplier|-%]\nWpływ praw, ducha narodu i technologii na §YZużycie energii w fabrykach cywilnych§!: [?modifier@energy_use_modifier_civs|-%]\nWpływ praw, ducha narodu i technologii na §YZużycie energii w sektorach biurowych§!: [?modifier@energy_use_modifier_offices|-%]\nWpływ praw, ducha narodu i technologii na §YZużycie energii w fabrykach wojskowych§!:[?modifier@energy_use_modifier_mils|-%]\nWpływ praw, ducha narodu i technologii na §YZużycie energii w Stoczniach Marynarki Wojennej§!: [?modifier@energy_use_modifier_dockyards|-%]\nWpływ praw, ducha narodu i technologii na §YZużycie energii w skomercjalizowanych sektorach rolnictwa§!:[?modifier@energy_use_modifier_agriculture_district|-%]\nWpływ praw, ducha narodu i technologii na §YZużycie energii w fabrykach Mikroczipów§!: [?modifier@energy_use_modifier_microchip_plant|-%]\nWpływ praw, ducha narodu i technologii na §YZużycie energii w fabrykach kompozytów§!: [?modifier@energy_use_modifier_composite_plant|-%]\nWpływ praw, ducha narodu i technologii na §YZużycie energii w Rafineriach Syntetycznych§!: [?modifier@energy_use_modifier_synthetic_refinery|-%]\n\n----------\nCałkowite zużycie energii przez §YWspółdzielenie obciążenia energetycznego§!: [?energy_load_sharing_use_var|R2]"
 heavy_power_restrictions_spirit_desc: "Rząd nałożył serię poważnych ograniczeń energetycznych na ich populację. Drastycznie ograniczył energię i zużycie prądu, ale kosztem dochodów podatkowych i innych kar ekonomicznych."
 some_power_restrictions_spirit_desc: "Rząd nałożył serię niewielkich ograniczeń energetycznych na ich populację. Drastycznie ograniczył energię i zużycie prądu, ale kosztem dochodów podatkowych i innych kar ekonomicznych."
 some_additional_consumption_spirit_desc: "Rząd rozpoczął serię niewielkich, ukierunkowanych dotacji na zużycie energii elektrycznej przez ludzi, aby złagodzić część obciążenia finansowego. Zachęciło to do nieco większych wydatków, ale zużycie energii elektrycznej gwałtownie wzrosło."
 heavy_additional_consumption_spirit_desc: "Rząd rozpoczął serię szeroko zakrojonych, ukierunkowanych subsydiów na zużycie energii przez ludzi, aby złagodzić część obciążeń finansowych. Zachęciło to do znacznych dodatkowych wydatków, ale zużycie energii elektrycznej gwałtownie wzrosło."
