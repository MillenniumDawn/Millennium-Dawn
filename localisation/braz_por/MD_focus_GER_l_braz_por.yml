 GER_idea_east_german_debuff2: "Ressentimento da Alemanha Oriental"
 GER_idea_east_german_debuff2_desc: "O ressentimento no leste endureceu até se tornar hostilidade aberta contra Berlim. A arrecadação de impostos está caindo e a indústria oriental está ficando ainda mais atrás da ocidental.\n§W--------------§!\nEste espírito nacional pode ser §RRemovido§! se §GMelhorarmos§! a opinião da Alemanha Oriental ou elevarmos seu padrão de vida."
 GER_idea_east_german_debuff3: "Agitação na Alemanha Oriental"
 GER_idea_east_german_debuff3_desc: "Greves e protestos se espalharam pelos estados orientais, e a extrema-esquerda recruta livremente entre eles. A administração local mal funciona.\n§W--------------§!\nEste espírito nacional pode ser §RRemovido§! se §GMelhorarmos§! a opinião da Alemanha Oriental ou elevarmos seu padrão de vida."
 GER_idea_east_german_debuff4: "Revolta na Alemanha Oriental"
 GER_idea_east_german_debuff4_desc: "Os estados orientais estão em revolta aberta. A indústria parou, a arrecadação de impostos colapsou e agitadores comunistas dominam as ruas.\n§W--------------§!\nEste espírito nacional pode ser §RRemovido§! se §GMelhorarmos§! a opinião da Alemanha Oriental ou elevarmos seu padrão de vida."
 GER_subventions_mining_desc: ""
 GER_subventions_agrar_desc: ""
 GER_v_fall_lapse: "O Verteidigungsfall Expira"
 GER_v_fall_lapse_desc: "A ameaça que justificava o Verteidigungsfall passou. O Artigo 115l da §YLei Fundamental§! exige que o Bundestag encerre o estado de defesa quando suas condições deixarem de existir. A menos que sejamos arrastados para uma guerra defensiva, a tensão mundial suba acima de §Y60%§! ou um inimigo comece a justificar um objetivo de guerra contra nós, o Verteidigungsfall terminará e o §YLegado Alemão§! retornará."
 GER_V_fall: "O Verteidigungsfall foi declarado"
 GER_Humbold_foundation: "Cooperação em pesquisa fortalecida por meio da §YFundação Humboldt§!"
 germany_party.21.t: "A Alternativa Eleitoral Torna-se um Partido"
 germany_party.21.desc: "Sindicalistas e social-democratas descontentes, irritados com as reformas do governo no bem-estar social e no mercado de trabalho, transformaram sua associação Trabalho e Justiça Social - A Alternativa Eleitoral em um partido político. A WASG agora oferece um novo lar à esquerda para os eleitores que se sentem abandonados pelo SPD."
 germany_party.21.a: "Um novo desafiante à esquerda."
 germany_party.22.t: "O PDS Torna-se o Partido de Esquerda"
 germany_party.22.desc: "Em um congresso extraordinário em Berlim, o Partido do Socialismo Democrático rebatizou-se como Partido de Esquerda.PDS. O novo nome permite que candidatos da WASG ocidental concorram em suas listas, dando ao partido pós-comunista uma plataforma nacional pela primeira vez."
 germany_party.22.a: "A esquerda fecha fileiras."
 germany_party.23.t: "A Esquerda É Fundada"
 germany_party.23.desc: "O Partido de Esquerda.PDS e a WASG concluíram sua fusão em um único partido, A Esquerda. Unidas pela primeira vez, a esquerda oriental e a ocidental formam agora uma única força à esquerda do SPD."
 germany_party.23.a: "Uma nova força na política alemã."
 germany_party.24.t: "Um Partido Fundado por Muçulmanos Entra na Política"
 germany_party.24.desc: "Grupos locais de eleitores da comunidade turca de Colônia se uniram para formar a Aliança por Inovação e Justiça. O BIG, um dos primeiros partidos da Alemanha fundados por muçulmanos, pretende dar voz própria aos eleitores teuto-turcos e muçulmanos."
 germany_party.24.a: "Veremos se ele encontra apoio."
 germany_party.25.t: "A DVU Funde-se ao NPD"
 germany_party.25.desc: "A União do Povo Alemão fundiu-se ao Partido Nacional-Democrata, encerrando sua existência como partido independente. Opositores dentro da DVU contestam a fusão na justiça, mas o partido efetivamente deixou de funcionar."
 germany_party.25.a: "A extrema-direita se consolida."
 germany_party.26.t: "O Volt Alemanha É Fundado"
 germany_party.26.desc: "Jovens pró-europeus fundaram o Volt Alemanha em Hamburgo como o braço alemão do Volt Europa, um partido pan-europeu lançado em resposta ao Brexit. Ele defende uma Europa federal com base em um programa compartilhado em todo o continente."
 germany_party.26.a: "Chega um partido pan-europeu."
 germany_party.27.t: "O NPD Torna-se Die Heimat"
 germany_party.27.desc: "Em um congresso do partido em Riesa, o Partido Nacional-Democrata rebatizou-se como Die Heimat (A Pátria). O partido de extrema-direita espera que o novo nome o livre de uma marca desgastada após anos de declínio eleitoral."
 germany_party.27.a: "Um novo nome, o mesmo partido."
 germany_party.28.t: "A Aliança Sahra Wagenknecht É Fundada"
 germany_party.28.desc: "Sahra Wagenknecht e um grupo de deputados do Bundestag que romperam com A Esquerda fundaram a Aliança Sahra Wagenknecht como partido. O BSW combina política econômica de esquerda com uma linha restritiva sobre a migração e defende uma paz negociada na Ucrânia."
 germany_party.28.a: "A esquerda se divide novamente."
