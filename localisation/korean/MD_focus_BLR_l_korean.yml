 BLR_kgb_west_TT: "우리는 §YKGB§!를 해산시키지 않을 겁니다. §YKGB§!는 우리의 중심입니다"
 UNS_support_for_union_more_80: "연방 국가 가입을 위한 [ROOT.GetFlag]의 지지도가 §Y80%§! 이상임"
 BLR_grodno_TT: "§Y이제 우리는 다른 국가에 비료 판매를 시작할 수 있습니다§!"
 belarus_character.1.t: "루카셴코의 시대"
 belarus_character.1.d: "알렉산드르 그리고리예비치 루카셴코는 평범한 의원에서 국가 대통령에 이르기까지 먼 길을 걸어왔습니다. 벨라루스를 통치하기 시작한 지 얼마 되지 않았음에도 영향력 있는 많은 세력이 이미 그의 몰락을 꿈꾸고 있습니다. 그는 벨라루스를 위한 더 나은 길을 찾아낼까요, 아니면 종신토록 권력에 매달리는 또 한 명의 독재자가 될까요?"
 belarus_character.1.a: "우리 바트카 루카셴코, 벨라루스의 어머니시여"
 belarus_character.2.t: "자유 민주주의 벨라루스"
 belarus_character.2.d: "세르게이 가이두케비치는 흥미로운 과거와 벨라루스의 미래에 대한 확고한 견해를 가진 비범한 인물입니다. 그는 분명 친러시아 정치인으로 간주되지만, 과연 그 평판에 걸맞게 행동할까요?"
 belarus_character.2.a: "무엇보다도 벨라루스"
 belarus_character.3.t: "유럽의 방식을 따르는 벨라루스"
 belarus_character.3.d: "벨라루스는 마침내 소련의 과거를 거부하고 밝은 유럽의 미래를 향해 나아갔습니다. 그러나 이 새로운 시대에 어떤 길을 택할지는 우리가 결정해야 합니다."
 belarus_character.3.a: "자유주의가 우리의 길이다"
 belarus_character.3.b: "보수주의가 우리의 전부다"
 belarus_character.4.t: "벨라루스의 국가주의자"
 belarus_character.4.d: "Zenon Poznyak, who has come to power, has long been known for his anti-Russian rhetoric. His central belief is that Russia has suppressed Belarusians throughout history. He intends to end this and possibly avenge it."
 belarus_character.4.a: "벨라루스인은 러시아인이 아니다"
 belarus_character.5.t: "붉은 벨라루스"
 belarus_character.5.d: "소련의 과거에서 점차 벗어나고자 한 벨라루스의 바람은 결국 공산주의의 손아귀로 도로 끌려들어 가는 결과를 낳았습니다. 사람들은 소련의 좋았던 시절을 기억하고 있으며, 그 시절을 되살리기로 결심한 듯합니다."
 belarus_character.5.a: "소련의 유산을 되돌려라"
 belarus_ukraine.1.t: "칼리노우스키 연대"
 belarus_ukraine.1.d: "벨라루스인들이 연대 하나 규모의 지원군을 보내 주고 있습니다. 우리는 함께 러시아의 침략에 맞서 싸울 것입니다."
 belarus_ukraine.1.a: "러시아와 그 제국의 야망을 타도하자."
 belarus_ukraine.2.t: "노보로시야 의용군 파병"
 belarus_ukraine.2.d: "국민 중에는 노보로시야 주민들의 투쟁을 돕고자 하는 이들이 있습니다. 우리는 그들을 도울 준비가 되어 있습니다."
 belarus_ukraine.2.a: "의용군을 보내자"
 belarus_ukraine.2.b: "이는 불법이기에 우리는 노보로시야로 가는 의용군을 비난한다"
 belarus_ukraine.3.t: "평화 회담의 중심지로 민스크를 제안하는 벨라루스"
 belarus_ukraine.3.d: "벨라루스가 우크라이나의 평화 수립을 위한 협상 장소로 민스크를 제안했습니다. 분리주의자들과의 휴전 체결에 동의하시겠습니까?"
 belarus_ukraine.3.a: "평화는 우리가 원했던 것이다!"
 belarus_ukraine.3.b: "우리는 우크라이나에 영토의 무결성을 되돌려 줄 것이다"
 belarus_ukraine.4.t: "우크라이나에서의 특별 군사 작전"
 belarus_ukraine.4.d: "러시아가 우크라이나에서 특별 군사 작전을 개시했습니다. 우리 지도부는 참여할 것인지 말 것인지 선택의 기로에 서 있습니다. 우리에게는 많은 의무가 있지만, 이 살육에 휘말리기 전에 신중히 생각해야 합니다."
 belarus_ukraine.4.a: "우크라이나는 해방되어야만 한다!"
 belarus_ukraine.4.b: "우리는 이에 개입하지 않을 것이다"
 belarus_export.2.t: "T-72BM1의 첫 시제품"
 belarus_export.2.d: "마침내 T-72 전차의 개량을 완료했습니다. 이제 우리 군의 수요에 맞춰 생산할 수 있게 되었습니다."
 belarus_export.2.a: "벨라루스산 무기에 영광을"
 belarus_export.3.t: "\"벨그라드\"의 첫 시제품"
 belarus_export.3.d: "마침내 BM-21의 개량을 완료했습니다. 이제 우리 군의 수요에 맞춰 생산할 수 있게 되었습니다."
 belarus_another.1.t: "투자를 요청하는 벨라루스"
 belarus_another.1.d: "Our old Belarusian friends are asking us for investments."
 belarus_another.1.a: "물론이지"
 belarus_another.1.b: "미안하지만, 안된다"
 belarus_another.2.t: "폴란드-벨라루스 외교전"
 belarus_another.2.d: "폴란드와의 관계가 급속히 악화되기 시작했습니다. 벨라루스는 폴란드 외교관 한 명을 \\"벨라루스 사회를 불안정하게 만들려는 적극적 행위\\"로 고발했습니다. 이에 대응하여 폴란드는 폴란드 영토 입국이 금지될 벨라루스 관리들의 명단을 작성했습니다. 분쟁의 원인은 약 2만 명을 아우르는 시민 단체인 \\"벨라루스 폴란드인 연합\\"이었습니다. 벨라루스 폴란드인 연합 대회에서 벨라루스 지도부에 충성하던 전임 대표가 해임되었고, 이후 벨라루스 폴란드인 연합은 당국의 대대적인 압박을 받게 되었으며, 당국은 벨라루스 폴란드인 연합 대회에 자금을 댄 폴란드 지도부와 이 나라 대사관이 벨라루스에 대한 \\"전복 활동\\"을 벌였다고 비난했습니다. 벨라루스 법무부는 안젤리카 보리스를 대표로 선출한 벨라루스 폴란드인 연합 대회의 결과를 승인하기를 거부했습니다. 폴란드 하원은 벨라루스 당국의 행동에 불만을 표명했으나, 벨라루스에서는 이를 내정 간섭 시도로 받아들였습니다. 이후의 사태 전개는 외교적 분쟁으로 이어졌습니다."
 belarus_another.2.a: "폴란드는 이제 지겹다!"
 belarus_another.3.t: "우크라이나의 합동 동방 가톨릭교"
 belarus_another.3.d: "동방귀일교회 신앙이 우리 영토 전역에서 활발히 퍼지기 시작했으며, 많은 주민이 모스크바에 예속된 정교회와의 공식적인 결별을 요구하고 있습니다. 어쩌면 그들의 목소리에 귀 기울여 볼 만할지도 모릅니다."
 belarus_another.3.a: "합동 동방 가톨릭교는 다시 국교가 될 것이다"
 belarus_another.3.b: "현상 유지 한다"
 belarus_another.4.t: "투자를 요청하는 벨라루스"
 belarus_another.4.d: "Our old Belarusian friends are asking us for investments."
 belarus_another.4.a: "물론이지"
 belarus_another.4.b: "미안하지만, 안된다"
 belarus_another.5.t: "법령 제 3호"
 belarus_another.5.d: "제3호 법령에 대한 국민의 분노가 매우 큽니다. 국민은 그 철회를 요구하고 양보를 요구합니다. 그들의 요구에 따르는 데 동의하시겠습니까?"
 belarus_another.5.a: "우리는 법령을 취소하지 않을 것이다"
 belarus_another.5.b: "양보할 준비가 된 것 같다"
 belarus_another.7.t: "Belarus Investments in Our country"
 belarus_another.7.d: "벨라루스 공화국의 동료들이 협력 및 투자 협정을 체결하자고 제안했습니다. 우리는 이 협정을 검토하여 체결 여부를 결정해야 합니다."
 belarus_another.7.a: "우리는 계약에 서명할 것이다"
 belarus_another.7.b: "거절한다"
 belarus_another.8.t: "벨라루스 국경 (BOMBEL) 프로젝트"
 belarus_another.8.d: "EU 자금이 도착했습니다. 이제 이 자금을 어떻게 처리할지 결정할 때입니다."
 belarus_another.8.a: "우리는 늘 그랬듯, 국경을 강화할 겁니다"
 belarus_another.8.b: "우리가 빼돌려도 그들을 모를 것이다"
 belarus_another.9.t: "Belarus Investments in Our country"
 belarus_another.9.d: "벨라루스 공화국의 동료들이 협력 및 투자 협정을 체결하자고 제안했습니다. 우리는 이 협정을 검토하여 체결 여부를 결정해야 합니다."
 belarus_another.9.a: "우리는 계약에 서명할 것이다"
 belarus_another.9.b: "거절한다"
 belarus_another.10.t: "What Should We Do With PMC Wagner?"
 belarus_another.10.d: "수상한 사람 몇 명을 구금했는데, 이들은 이후 유명한 러시아 민간 군사 기업 바그너의 용병으로 밝혀졌습니다. 우리 법 집행 기관은 이미 이들을 테러 준비 혐의로 기소할 준비가 되어 있습니다. 러시아 측은 이들의 석방을 고집하고 있습니다. 어떻게 하시겠습니까?"
 belarus_another.10.a: "우리는 그들을 석방시켜 러시아에 되돌려줄 것이다"
 belarus_another.10.b: "Put them in jail and accuse them of preparing terrorist attacks"
 belarus_another.11.t: "벨라루스 내전"
 belarus_another.11.d: "강도 높은 반러시아적 수사, 벨라루스어 강요 정책, 러시아와의 모든 연관성을 부정하는 역사의 적극적 선전이 대가를 치르게 했습니다. 동부 지역이 반란을 일으켰고 지역 자위대가 권력을 장악했습니다. 열강이 이를 이용하기 전에 가능한 한 빨리 이를 막아야 합니다."
 belarus_another.11.a: "끔찍하군!"
 belarus_another.12.t: "우리나라에서 러시아의 이익에 로비한 아자레노크 장군"
 belarus_another.12.d: "우리 법 집행 기관은 아자레노크 장군의 인맥을 통해 우리나라에서 러시아의 이익을 위한 로비 활동이 벌어지고 있음을 알게 되었습니다. 주의를 기울여야 할까요, 아니면 이를 계속 내버려 두는 것이 벨라루스 공화국의 이익에 부합할까요?"
 belarus_another.12.a: "물론이지"
 belarus_another.12.b: "투옥할 명분이 된다"
 belarus_another.14.t: "세르게이 치하노우스키"
 belarus_another.14.d: "우리 정부를 비판하는 유명한 야당 블로거가 국민 사이에서 지나치게 큰 영향력을 갖기 시작했으며, 우리는 이에 대해 조치를 취해야 합니다."
 belarus_another.14.a: "우리는 그를 투옥해야 한다"
 belarus_another.14.b: "Leave him alone, he may still be useful to us"
 belarus_another.15.t: "국제통화기금(IMF)에 도움 요청"
 belarus_another.15.d: "우리는 위기의 여파를 해결하기 위해 IMF에 지원을 요청할 수밖에 없습니다."
 belarus_another.15.a: "다른 선택지가 없다"
 belarus_another.16.t: "신용 정책 강화"
 belarus_another.16.d: "현재 상황 때문에 신용 정책이 급격하게 수정될 것입니다."
 belarus_another.16.a: "다른 선택지가 없다"
 belarus_another.17.t: "벨라루스와 군사 협력"
 belarus_another.17.d: "우리는 군의 가장 중요한 과제를 해결하기 위해 벨라루스의 군사 전문가들을 초청했습니다. 벨라루스 특수부대가 우리 전투원들을 훈련시켰고, 벨라루스 군수 산업이 우리의 방공 체계를 개선했습니다."
 belarus_another.17.a: "놀랍군!"
 belarus_another.18.t: "라트갈레 또는 전쟁"
 belarus_another.18.d: "벨라루스 정부가 더욱 공격적으로 변하고 있습니다. 그들은 우리에게 최후통첩을 보냈습니다. 라트갈레 지역을 넘기든지, 아니면 우리나라에 가장 끔찍한 결과가 닥칠 것이라는 것입니다. 이 예기치 못한 성명에 우리는 충격을 받았습니다. 어떻게 하시겠습니까?"
 belarus_another.18.a: "라트갈레를 양도해서 최소한 우리의 독립을 지켜내야 한다"
 belarus_another.18.b: "양보는 없다"
 belarus_another.19.t: "두번째 루블린 연방"
 belarus_another.19.d: "벨라루스는 우리 정부에 적극적으로 영향력을 행사하며 상당한 지렛대를 쥐고 있습니다. 오늘 벨라루스 대사가 루카셴코 정부에 러시아가 제안했던 것과 유사한 초국가적 기구 창설을 구상한 새 협정 초안을 우리에게 건넸습니다. 사실상 우리는 자치권의 일부를 내주게 되겠지만, 우리 두 국가는 거의 하나로 통합될 것입니다. 이에 동의하시겠습니까?"
 belarus_another.19.a: "우리는 약하고, 그렇기에 동의할 수 밖에 없다"
 belarus_another.19.b: "무슨 일이 있어도 우리 독립은 지켜야 한다"
 belarus_another.20.t: "Signing the Union"
 belarus_another.20.d: "폴란드 정부가 우리와의 연합 창설에 동의했습니다! 이는 벨라루스 국민 전체의 승리입니다!"
 belarus_another.20.a: "좋아, 두고 보지"
 belarus_another.21.t: "폴란드의 거부!"
 belarus_another.21.d: "우리가 오랫동안 키워 온 폴란드 정부가 우리를 배신했습니다. 우리에게는 선택의 여지가 없는 듯하며, 이 배신자들을 어떻게 할지 우리가 스스로 결정해야 합니다. 가능한 모든 지렛대를 동원해야 할지도 모릅니다."
 belarus_another.21.a: "Let's Make Hell For The Poles"
 belarus_another.21.b: "그냥 내버려둬라"
 belarus_another.22.t: "실레시아 민병대"
 belarus_another.22.d: "우리 국민에게 독립의 기회가 찾아왔습니다. 이를 활용하여 무기를 들 때입니다!"
 belarus_another.22.a: "폴란드의 억압을 타도하라!"
 belarus_another.23.t: "벨라루스와 합동 훈련"
 belarus_another.23.d: "벨라루스가 우리 군의 전투 협동을 위한 합동 훈련을 실시하자고 제안했습니다. 동의하시겠습니까?"
 belarus_another.23.a: "물론 동의한다"
 belarus_another.23.b: "그들 없이 할 것이다"
 belarus_another.24.t: "폴란드와 합동 훈련"
 belarus_another.24.d: "그들이 우리 군과 훈련을 실시하는 데 동의했습니다. 우리는 값진 경험을 얻을 것입니다."
 belarus_another.24.a: "좋다"
 belarus_another.25.t: "이라크에 무기 제공"
 belarus_another.25.d: "우리는 이라크의 우호적인 정권을 지원하기 위해 우리 무기 비축분의 일부를 이라크로 보낼 준비가 되어 있습니다."
 belarus_another.25.a: "좋다"
 belarus_another.26.t: "프로타세브치가 탑승 라이언에어 항공기 착륙"
 belarus_another.26.d: "우리 특수 기관은 야당 채널 넥스타의 편집장이 탑승한 항공기를 요격하여 강제 착륙시키는 데 성공했습니다. 그의 이름은 로만 프로타세비치입니다."
 belarus_another.26.a: "좋다"
 belarus_another.27.t: "벨라루스 교회의 운명"
 belarus_another.27.d: "우리나라 지도부는 우리 교회에 자치권(독립 교회 지위)을 부여하는 문제를 진지하게 고민해 왔습니다. 그러나 이 조치는 분명 우리의 친구이자 이웃인 러시아와의 관계를 해칠 수 있습니다. 밀어붙이시겠습니까?"
 belarus_another.27.a: "우리는 자치적인 교회를 수용한다"
 belarus_another.27.b: "안된다"
 belarus_another.28.t: "벨라루스 내부의 폴란드인 연합에 대한 문제"
 belarus_another.28.d: "벨라루스 폴란드인 연합은 오랫동안 우리의 골칫거리였습니다. 폴란드는 이를 통해 우리에게 전력으로 영향력을 행사해 왔습니다. 이제 이 문제를 처리할 때입니다. 그들을 그대로 두거나, 아니면 폴란드계 주민을 완전히 추방해야 합니다."
 belarus_another.28.a: "우리의 통제하에 남겨두자"
 belarus_another.28.b: "벨라루스에서 폴란드인의 자리는 없다"
 belarus_another.31.t: "유제품 전쟁"
 belarus_another.31.d: "러시아가 우리 유제품 수입을 보이콧하여 우리 수익의 상당 부분이 끊겼습니다. 그들의 조건에 양보하시겠습니까, 아니면 국내 생산자를 보호하시겠습니까?"
 belarus_another.31.a: "We stand firmly behind our manufacturers"
 belarus_another.31.b: "그들의 요구에 응하자"
 belarus_another.32.t: "최고 위원회와의 문제"
 belarus_another.32.d: "최고회의는 소비에트 체제의 유물로 남아 있으며, 헌법을 개정하지 않고서는 법적으로 해체할 수 없습니다. 따라서 이 문제를 마침내 해결할 때까지 우리는 그들과 타협해야 할 것입니다."
 belarus_another.32.a: "벨라루스의 영광을 위해"
 belarus_another.33.t: "우크라이나에서의 항공기 추락"
 belarus_another.33.d: "제논이 탑승하여 키이우로 향하던 항공기가 우크라이나에서 추락했습니다. 생존자는 없었고, 누가 국가 지도자 자리를 맡을지 시급히 결정해야 했습니다. 당 의원인 유리 벨렌키가 임시, 어쩌면 영구적인 수장이 되었습니다."
 belarus_another.33.a: "벨라루스의 영광을 위해"
 belarus_another.34.t: "벨라루스 탈레르 통화 "
 belarus_another.34.d: "벨라루스는 우리 영토에 단일 통화를 도입하자고 제안합니다. 벨라루스에서 쓰는 것과 같은 탈러입니다. 공통 통화는 양국 간 무역을 개선할 수 있겠지만, 우리의 독립은 다시 위협받게 될 것입니다."
 belarus_another.34.a: "동의한다"
 belarus_another.34.b: "거절한다"
 belarus_another.35.t: "인테르마리움"
 belarus_another.35.d: "벨라루스가 '인터마리움'이라는 군사 동맹을 창설하자고 제안합니다. 이를 창설하면 더 큰 이웃 나라들의 침략으로부터 우리를 지킬 수 있을 것입니다."
 belarus_another.35.a: "동의한다"
 belarus_another.35.b: "거절한다"
 belarus_another.36.t: "NATO 가입을 희망하는 벨라루스"
 belarus_another.36.d: "벨라루스는 오랫동안 민주주의의 길을 걸어왔으며 우리와 함께 이를 수호하기를 원합니다. 벨라루스 정부는 나토 가입을 위한 모든 조건을 충족했으며 이 기구에 회원국 가입을 신청했습니다. 받아들이시겠습니까?"
 belarus_another.36.a: "동의한다"
 belarus_another.36.b: "거절한다"
 belarus_another.37.t: "드디어 NATO와 함께한다"
 belarus_another.37.d: "우리의 회원국 가입 신청이 승인되었으며, 이제 우리는 전 세계의 민주주의를 수호할 준비가 된 이 위대한 동맹의 일원입니다!"
 belarus_another.37.a: "만세!"
 belarus_another.38.t: "USAID에 합류를 원하는 벨라루스"
 belarus_another.38.d: "벨라루스 정부가 USAID 프로그램 가입 요청을 보내왔습니다. 긍정적으로 응답할 준비가 되었습니까?"
 belarus_another.38.a: "그들의 요청을 수락하자"
 belarus_another.38.b: "안된다"
 belarus_another.39.t: "USAID의 승인"
 belarus_another.39.d: "미국이 우리의 요청을 승인했으며, 이제 우리는 USAID 프로그램의 일원입니다."
 belarus_another.39.a: "만세!"
 belarus_another.40.t: "2008년 벨라루스 경제 위기"
 belarus_another.40.d: "국가의 재정 및 경제 상황 악화를 나타내는 복합적인 현상이 나타나고 있습니다. 2008년 벨라루스에서 금융 위기가 시작되었습니다. 이제 예산을 지키기 위해 지출을 줄일 분야를 선택해야 합니다."
 belarus_another.40.a: "Reducing the maintenance of the education system."
 belarus_another.40.b: "의료 복지 시스템의 유지 보수비 감축"
 belarus_another.40.c: "Reducing the maintenance of the bureaucracy system."
 belarus_another.41.t: "\"새로운 날\" 작전"
 belarus_another.41.d: "벨라루스 정부가 수바우키 회랑 문제를 제거하기 위해 리투아니아에 대한 공동 군사 작전을 제안하고 있습니다. 이토록 위험한 조치를 취하는 데 동의하시겠습니까?"
 belarus_another.41.a: "우리의 국경을 지켜내야만 한다."
 belarus_another.41.b: "위험을 감수하지 말자"
 belarus_another.42.t: "빌뉴스를 원하는 벨라루스"
 belarus_another.42.d: "벨라루스 정부가 빌뉴스와 주변 영토를 자신들의 완전한 통제 아래로 이양해 달라는 희망을 표명했습니다. 그들의 논거는 이곳이 역사적인 벨라루스 땅이라는 점에 있습니다. 이에 동의하시겠습니까?"
 belarus_another.42.a: "관계를 강화하기 위해, 우린 빌뉴스를 양도할 것이다"
 belarus_another.42.b: "우리의 것으로 남겨두자"
 belarus_another.44.t: "치하노우스카야의 지휘 아래 대규모 시위 발생"
 belarus_another.44.d: "우리는 이토록 강한 민중의 소요를 예상하지 못했습니다. 어쩌면 우리나라에는 정말로 변화가 필요하며, 이제 권력을 다른 이들에게 넘겨줄 때인지도 모릅니다."
 belarus_another.44.a: "절대 안된다"
 belarus_another.44.b: "새 시대가 찾아올 것이 분명하다"
 belarus_GDL.1.t: "우리를 통치하기를 원하는 벨라루스"
 belarus_GDL.1.d: "친벨라루스 민족주의자들이 우리나라에서 상당한 영향력을 갖고 있어, 벨라루스 당국이 우리에게 최후통첩을 보냈습니다. 그들을 정부에 받아들이든지, 아니면 그 결과를 감수하라는 것입니다. 이에 뭐라고 답하시겠습니까?"
 belarus_GDL.1.a: "동의한다"
 belarus_GDL.1.b: "절대 안된다"
 belarus_GDL.2.t: "벨라루스와 함께"
 belarus_GDL.2.d: "우리나라는 벨라루스의 완전한 영향력 아래 놓이게 되었습니다. 우리에게는 선택의 여지가 없으며, 병합 문서에 서명할 준비가 되어 있습니다."
 belarus_GDL.2.a: "그게 우리의 운명이다."
 belarus_azot.1.t: "화학 비료 무역 합의를 제안하는 벨라루스"
 belarus_azot.1.d: "벨라루스가 최근 연락을 취해, 자신들이 제공할 수 있는 최고급 비료에 대한 독점 계약을 제안했습니다. 이를 수락하면 분명 작물 수확량이 늘겠지만, 정치적으로는 이 책략이 일부에게는 의심스럽게 비칠 수 있습니다."
 belarus_azot.1.a: "물론이지"
 belarus_azot.1.b: "지금은 할 수 없다."
 belarus_azot.2.t: "[From.GetName]의 수락"
 belarus_azot.2.d: "[From.GetName]와의 거래를 성사시키려는 우리의 노력이 마침내 결실을 보았습니다. 계약이 체결되었으며 첫 대금을 곧 받게 됩니다."
 belarus_azot.2.a: "듣던 중 반가운 소리군"
 belarus_azot.3.t: "[From.GetName] refuses our deal."
 belarus_azot.3.d: "[From.GetName]와의 거래를 성사시키려는 우리의 노력은 헛수고인 듯합니다. 아무런 답변도 받지 못했으며 이 사안은 진전이 없어 보입니다."
 belarus_azot.3.a: "이런 망할 [From.GetNameDef]!"
 belarus_azot.4.t: "계약을 무효화한 [From.GetName]"
 belarus_azot.4.d: "충격적인 소식을 받았습니다. [From.GetName](이)가 우리와의 비료 계약을 취소하고 있습니다. 적어도 당분간은 그들에게 우리 제품을 판매할 수 없게 되었습니다."
 belarus_azot.4.a: "바보같은 것들! 지금 상황 파악이 안되나!"
 BLR_Azot_category: "그로노 아조트 (Grodno Azot)의 비료 무역"
 BLR_Azot_category_desc: "Focusing on the number of markets GrodnoAzot has access to is vital for the diversity and expansion of the Belarusian Economy. The multitude of different fertilizers and pesticides at their disposal can be useful to many nations. Establishing contracts with other countries and expanding the production of our fertilizers will bring a great amount of revenue to the nation and the people of Belarus.\n\nThe income gained from the trade is determined by the number of contracts you have signed multiplied by five percent.\n§YCurrent Fertilizer Contracts:§! [?current_azot_capacity]/[?current_max_azot_capacity]\n§YFertilizer Cap:§! [?current_max_azot_capacity]/[?max_azot_capacity]"
