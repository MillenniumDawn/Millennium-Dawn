 sov_communists.1.t: "사유 재산 금지"
 sov_communists.1.d: "우리 정부가 통과시킨 일련의 반부르주아 법률 끝에, 우리는 마침내 러시아 땅에서 자본주의를 제거하는 마지막 단계에 도달했습니다. 1920년대에 영광스러운 동지들이 그랬듯이, 이제 우리는 사유 재산을 금지할 것입니다. 남은 유일한 문제는 이 몰수가 어디까지 이루어질 것인가입니다. 전면적일지, 온건할지, 선별적일지 말입니다."
 sov_communists.1.a: "전면적인 자산 압수를 시작한다!"
 sov_communists.1.b: "그래도 조금은 봐주자."
 sov_communists.1.c: "주요 산업 일부만 용인하자."
 sov_communists.2.t: "국가주의-공산주의 헌법"
 sov_communists.2.d: "NPA와 러시아 연방 공산당이 모두 뜻을 모으면서, 이제 새 헌법을 제정할 준비가 되었습니다. 문제는 우리의 이념적 토대가 국제주의 공산주의로 향할지, 아니면 민족주의적이고 고립주의적인 길로 향할 것인가입니다. 우리의 미래 방향이 갈림길에 서 있습니다."
 sov_communists.2.a: "러시아인으로써 자부심을 가져야 한다!"
 sov_communists.2.b: "우리의 주 이념을 잊지말아야 한다."
 sov_communists.3.t: "민주주의 헌법"
 sov_communists.3.d: "우리는 페레스트로이카 시대 우리 이념적 지도자들의 가장 유망한 구상 일부를 물려받았습니다. 더 밝고 자유로운 미래를 건설하려면 헌법을 다시 써야 합니다. 그러나 이를 더 자유주의적인 구조로 이끌어야 할까요, 아니면 지배적인 이념의 핵심을 유지해야 할까요?"
 sov_communists.3.a: "고르바초프의 이념을 보존해야 한다!"
 sov_communists.3.b: "우리의 주 이념을 잊지말아야 한다."
 sov_communists.4.t: "공산당 헌법"
 sov_communists.4.d: "이제 절대 권력이 당의 손에 들어온 만큼, 마침내 우리의 가치에 따라 헌법을 다시 쓸 수 있습니다. 그러나 우리 내부에서 이념 파벌들이 등장했으며, 진정한 소비에트 헌법의 방향을 어느 파벌이 정할지 결정해야 합니다."
 sov_communists.4.a: "물론 스탈린주의를 따라야지"
 sov_communists.4.b: "그래도 점진적인 변화를 해야한다."
 sov_nationalists.1.t: "국가 헌법 개정"
 sov_nationalists.1.d: "우리의 이전 헌법은 러시아 역사상 최악이었다고 할 만합니다! 이 수치스러운 문서를 지우기 위해 우리는 진정한 러시아의 헌법을 만들 것입니다. 핵심 결정은 전통적인 중앙집권을 유지할 것인지, 아니면 더 분권적이지만 팽창주의적인 길을 택할 것인지입니다. 어느 방향을 선택해야 합니까?"
 sov_nationalists.1.a: "Russia needs to stabilize itself before helping others!"
 sov_nationalists.1.b: "Expansionism is our national destiny and must be enshrined in the constitution!"
 russia.29.t: "체첸 공화국의 헌법에 대한 국민 투표"
 russia.29.d: "잔혹하고 피비린내 나는 분쟁이 끝난 후, 체첸은 이제 평화로운 삶으로 돌아갈 기회를 얻었습니다. 다음 문제는 모스크바와의 관계 구조입니다. 연방 구성 주체로서 완전히 통합된 상태로 남을 것인가, 아니면 일정한 자치를 유지할 것인가?"
 russia.29.o1: "Little autonomy won't hurt them"
 russia.29.o2: "I am ready to personally govern Chechnya"
 SOV_slavic_corps: "Solve the Issue with the Slavic Corps"
 SOV_slavic_corps_desc: "슬라브 군단은 홍콩에 등록된 민간 경비 업체입니다. 우리는 소유주들을 붙잡았으며 투옥할 준비가 되어 있습니다. 그러나 이들의 전문 지식은 앞으로 우리에게 여전히 유용할 수 있습니다."
 sov_vybory.2.t: "블라디미르 푸틴의 대통령 당선"
 sov_vybory.2.d: "블라디미르 푸틴이 개표율 99% 기준 63.75%의 득표율로 대통령 선거 1차 투표에서 승리했습니다. 야권은 결과의 정당성에 의문을 제기하며 대규모 시위로 대응하겠다고 위협했습니다. 중앙선거관리위원회의 최신 자료에 따르면 유권자의 65.3%가 선거에 참여했습니다."
 sov_vybory.2.a: "또 다시 우리의 지도자께서 납셨네!"
 sov_vybory.1.t: "메드베데프의 대통령 당선"
 sov_vybory.1.d: "제1부총리 드미트리 메드베데프가 푸틴의 뒤를 이어 대통령 선거에서 결정적이고 예상된 승리를 주장했습니다. 메드베데프는 자유주의적 정책 전환을 약속하지만, 많은 이들은 권력이 여전히 푸틴의 손에 확고히 쥐어져 있다고 믿습니다."
 sov_vybory.1.a: "이제 그가 어떻게 하는지 보자"
 russia_med.1.t: "Militsiya Renamed into Politsiya"
 russia_med.1.d: "드미트리 메드베데프 대통령이 법 집행 체계의 핵심 개혁인 경찰법에 서명했습니다. 이 개혁은 '밀리치야'라는 명칭을 '폴리치야'로 바꾸고, 관료적 중복을 줄이는 한편 경찰과 시민 사회 간의 협력 관계를 강화하는 것을 목표로 합니다. 또한 경찰관의 의무, 권리, 책임을 재정의합니다."
 russia_med.1.a: "이는 모든 것을 바꿀 것이다"
 rusboloto.1.t: "모스크바에서의 시위!"
 rusboloto.1.d: "또 한 번의 정치적 권력 교체에 분노한 대규모 시위가 모스크바에서 벌어졌습니다. 추산 참가자는 2만 5천 명에서 15만 명에 이릅니다. 공정한 선거를 요구하는 시위는 러시아 99개 도시와 해외 45개 도시에서 열렸습니다. 모스크바 교육부가 갑작스럽게 학교 시험을 잡은 것은 대중의 분노를 더욱 키웠을 뿐입니다. 시위대는 직접 만든 팻말을 들고 공정하고 투명한 선거를 요구하고 있습니다."
 rusboloto.1.a: "Crush them with law enforcement!"
 rusboloto.2.t: "급증하는 모스크바에서의 시위!"
 rusboloto.2.d: "경찰의 저지에도 불구하고 시위대는 볼로트나야 광장에서 계속 집회를 이어 가고 있습니다. 보고에 따르면 군중이 던진 병과 화염병에 경찰관 여러 명이 부상을 입었습니다. 경찰은 야권 인사들을 구금하는 것으로 대응했으나 가스는 사용하지 않았습니다. 나발니와 우달초프 같은 주최자들은 현재 폭동 선동과 법 집행 요원에 대한 폭력에 관한 법률에 따라 수사받고 있습니다."
 rusboloto.2.a: "Crush them with law enforcement (again)!"
 rusboloto.2.b: "Fine."
 rusboloto.3.t: "Protests Were Handled by the Police"
 rusboloto.3.d: "시위 운동은 목표를 달성하지 못했으며 당국에 의해 성공적으로 진압되었습니다. 상황은 이제 통제되고 있습니다."
 rusboloto.3.a: "환상적이군"
 sov_other.2.t: "Communists Elected in Russia"
 sov_other.2.d: "중대한 정치적 변화 속에 공산당이 러시아에서 다시 집권했습니다. 사회주의 질서를 복원하겠다고 약속하며, 그들은 이제 전면적인 이념적 변혁을 추진하고 있습니다. 새 지도부는 러시아의 미래를 완전히 뒤집어 과거를 되살릴 준비가 되었다고 주장합니다."
 sov_other.2.a: "소비에트 연방의 재림인가?"
 sov_other.6.t: "대규모 러시아 행진"
 sov_other.6.d: "최근 러시아 전역에서 민족주의자, 군주주의자, 정교회 성직자, 이교도 로드노베리가 참여하는 대규모 민족주의 행진이 벌어졌습니다. 이슬람 공화국 출신 소수 민족과의 충돌도 발생했습니다. 상황은 불안정하며 더 위험한 사태로 번질 수 있습니다."
 sov_other.6.a: "Russians, Forward!"
 sov_other.9.t: "우크라이나를 지원하는 러시아!"
 sov_other.9.d: "러시아의 새 민주 정부는 우크라이나와의 관계 개선을 위한 외교 구상을 시작했습니다. 여기에는 문화적 통합, 반부패 노력에 대한 지원, 민주적 제도 구축에서의 상호 협력 제안이 포함됩니다."
 sov_other.9.a: "영원한 형제여!"
 sov_other.9.b: "진실은 형제 안에 있다"
 sov_other.10.t: "Russia Helps Us in Wiping Out Corruption!"
 sov_other.10.d: "새로운 반부패 협정에 따라 러시아는 부패한 주요 올리가르히의 체포와 자산 압류를 도왔습니다. 이 협력은 우리나라의 부패에 중대한 타격을 입혔습니다."
 sov_other.10.a: "고맙다"
 sov_other.12.t: "NATO Troops in Russia"
 sov_other.12.d: "새로운 서방 노선의 일환으로 러시아는 지역 안정과 공동 안보를 증진하기 위해 자국 영토에 나토군이 주둔하는 것을 허용했습니다."
 sov_other.12.a: "Good.."
 SOV_combined_economic_system: "합동 경제 시스템"
 SOV_combined_economic_system_desc: "국가 기관과 올리가르히의 이해관계 사이에서 타협을 이끌어 냄으로써, 우리는 경제 회복을 위한 러시아 고유의 해법을 만들어 가고 있습니다. 균형과 통제가 우리의 앞길을 규정할 것입니다."
 SOV_oligarchic_republic: "올리가르히 공화국"
 SOV_oligarchic_republic_desc: "올리가르히가 기업 합병을 마무리하면서 새로운 시대가 시작됩니다. 사적 권력이 국가 정책을 좌우하는, 올리가르히가 운영하는 러시아입니다."
 sov_other.13.t: "Russian Proposal..."
 sov_other.13.d: "러시아의 새 민주 정부는 우크라이나에 상호 언어 협정을 제안했습니다. 러시아어는 우크라이나에서 공식적 지위를 얻고, 러시아는 우크라이나계 주민들에게 우크라이나어 교육을 장려하게 됩니다. 이 구상은 양국 간의 평화, 문화 교류, 장기적인 우정을 증진하는 것을 목표로 합니다."
 sov_other.13.a: "환상적인 생각이다!"
 sov_other.13.b: "미안하지만, 안된다"
 sov_other.14.t: "Ukraine Accepted Our Proposal!"
 sov_other.14.d: "Ukraine has agreed to our mutual linguistic integration proposal. A new era of cooperation has begun."
 sov_other.14.a: "환상적이군"
 sov_other.15.t: "Ukraine Denied Our Proposal!"
 sov_other.15.d: "Ukraine has rejected our offer of mutual linguistic integration and cooperation."
 sov_other.15.a: "도대체 왜?"
 SOV_nemtsov: "보리스 넴초프"
 SOV_nemtsov_desc: "1959년 10월 9일부터 2015년 2월 27일까지 생존한 보리스 예피모비치 넴초프는 러시아의 물리학자이자 자유주의 정치인이며, 블라디미르 푸틴에 대한 거침없는 비판자였습니다. 그는 소련 붕괴 이후 과도기 경제 개혁을 설계하는 데 핵심적인 역할을 수행했으며, 니즈니노브고로드 주지사, 연료동력부 장관, 제1부총리 등 옐친 행정부의 요직을 두루 역임했습니다. 이후 '젊은 러시아' 운동을 창설하고 '우파의 대의'를 공동 창당했으며, 자유주의 개혁파 정치 블록인 '우파 연합'의 결성을 이끌었습니다. 그의 유산은 현대 러시아 역사에서 민주적 저항의 상징으로 남아 있습니다."
 SOV_navalny: "알렉세이 나발니"
 SOV_navalny_desc: "1976년 6월 4일 출생한 알렉세이 아나톨리에비치 나발니는 러시아의 야권 지도자이자 변호사이자 반부패 운동가입니다. 그는 수많은 시위를 조직하며 푸틴 대통령의 권력 장악에 도전해 왔습니다. '미래의 러시아' 당수이자 반부패재단(FBK) 설립자로서, 나발니는 인권 신장을 위한 노력을 국제적으로 널리 인정받았습니다. 국제앰네스티로부터 양심수로 지정되었으며 사하로프 사상 자유상을 수상했습니다. 그가 통합 러시아를 '사기꾼과 도둑놈들의 정당'이라 낙인찍은 구호는 개혁파의 대표적인 집결 구호가 되었습니다."
 SOV_path_of_western: "서방을 향하여"
 SOV_path_of_western_desc: "The Cold War is over. Nationalism and communism lie in our past. The only way forward is democracy, toward the end of history. Embracing Western values and institutions will secure Russia's place in the modern world."
 SOV_liberal_loyalty_idea: "자유주의 충성"
 SOV_karabakh_question: "아르차흐 문제 해결"
 sov_other.17.t: "아르메니아를 지원하는 러시아!"
 sov_other.17.d: "러시아는 최근 아르메니아와 잃어버린 영토를 되찾으려는 그 노력에 대한 공개적인 지지를 선언했습니다. 이 조치는 우리의 지역 정책이 전환되었음을 나타내며 캅카스의 힘의 균형을 크게 바꿀 수 있습니다."
 sov_other.17.a: "흥미롭군"
 SOV_FSB_expansion: "러시아 연방보안국 (FSB) 확장"
 SOV_FSB_expansion_desc: "FSB는 우리의 핵심 보안 기관이며, 오늘날의 도전에 대응할 수 있도록 현대적인 시설과 자원을 갖추도록 해야 합니다."
 SOV_alpha_omon_exp: "Alpha Group"
 SOV_alpha_omon_exp_desc: "공식 명칭이 FSB 특수목적센터 A국인 알파 그룹은 1974년 소련 KGB가 창설한 정예 특수부대입니다. 직접적인 정치적 통제 아래 러시아 안팎에서 위험도가 높은 비밀 작전과 준군사 작전을 수행합니다."
 SOV_form_yunarmiya: "유나르미아 형성"
 SOV_form_yunarmiya_desc: "애국 청소년 단체인 유나르미야는 미래 세대가 군을 지지하도록 고취하는 데 도움이 될 것입니다."
 SOV_first_bars_start: "§YBARS 1§! - Kuban Cossack Detachment Named After Z. Chepega"
 SOV_second_bars_start: "§YBARS 2§! - Volunteers from Yakutia"
 SOV_third_bars_start: "§YBARS 3§! - Rodina"
 SOV_first_bars_flag: "제 1 특별 전투 예비군 (BARS) 훈련 완료"
 SOV_second_bars_flag: "제 2 특별 전투 예비군 (BARS) 훈련 완료"
 SOV_third_bars_flag: "제 3 특별 전투 예비군 (BARS) 훈련 완료"
 SOV_union_annex_belarus: "연방 국가가 형성됨"
 SOV_form_bars_TT: "£text_icon_bars §Y특별 전투 예비군 (BARS)§!이 조직될 것입니다"
 SOV_romanov_empire: "신성 로마노프 제국"
 SOV_hyper_empire: "제3의 로마"
 sov_girkin.1.t: "슬라뱐스크 점령!"
 sov_girkin.1.d: "처음에 돈바스에서의 분쟁은 폭력적이지 않았습니다. 도네츠크 인민공화국이 선포되고 유로마이단 지지 활동가 드미트리 체르냐프스키가 살해되었지만, 분리주의자들에게는 실질적인 힘이 없었습니다. 경찰과 보안군은 주저했고 현지의 지지는 미미했습니다. 대부분의 사람들은 평화로운 집회에만 참석했고, 점거된 지방 행정 청사는 극단주의자, 범죄자, 국경 지역에서 온 러시아 활동가들이 뒤섞여 차지했습니다. 알렉산드르 흐랴코프와 안드레이 푸르긴 같은 소수의 DPR 지도자만이 알려져 있었습니다. 대부분은 분리주의자들이 곧 흩어질 것이라 믿었습니다. 그러나 도네츠크 북부의 12만 명 규모 도시 슬라뱐스크에서 상황이 예상치 못하게 격화되었습니다. 무장한 남성 52명이 별다른 저항 없이 도시의 경찰서를 점거했습니다. 그들은 폭발물과 차량을 이용해 건물에 침입했으며, 이는 분쟁의 전환점이 되었습니다."
 sov_girkin.1.a: "흥미롭군"
 SOV_support_nov_idea: "러시아 지원"
 SOV_supportlnrdnr_rus: "도네츠크인민공화국과 루한스크인민공화국 지원"
 SOV_peacekeeping_in_artsakh: "아르차흐의 평화 수호"
 SOV_peacekeeping_in_artsakh_desc: "구소련 권역의 선도 강국으로서, 우리는 아르차흐 분쟁을 책임감 있고 단호하게 해결함으로써 우리의 위상을 유지해야 합니다."
 rec_nov_TT: "We will recognize [NOV.GetFlag]§YDonbass§! as independent and prepare for §RInvasion§!"
 SOV_trade_with_kazakhstan: "카자흐스탄과의 무역"
 SOV_trade_with_kazakhstan_desc: "카자흐스탄은 중앙아시아에서 언제나 우리의 가장 가까운 친구 중 하나였습니다. 양국 간 무역을 확대하면 양국 경제에 이익이 되고 지역 내 영향력이 강화될 것입니다."
 SOV_trade_with_azerbaijan: "아제르바이잔과의 무역"
 SOV_trade_with_azerbaijan_desc: "아제르바이잔은 유망한 파트너입니다. 이들과의 무역을 늘리면 캅카스에서 우리의 입지를 넓히고 경제적 유대를 강화하는 데 도움이 될 것입니다."
 SOV_trade_with_tajikistan: "타지기스탄과의 무역"
 SOV_trade_with_tajikistan_desc: "타지키스탄은 오랫동안 믿을 만한 파트너였습니다. 무역 관계를 강화하면 수익성 있는 기회가 생기고 우리의 동맹이 공고해질 것입니다."
 SOV_trade_with_kyrgyzstan: "Trade with Kyrgyzstan"
 SOV_trade_with_kyrgyzstan_desc: "키르기스스탄은 중앙아시아의 핵심 동맹입니다. 이들과의 무역을 확대하면 우리의 파트너십이 굳건해지고 상호 성장이 뒷받침될 것입니다."
 SOV_trade_with_armenia: "아르메니아와의 무역"
 SOV_trade_with_armenia_desc: "아르메니아인은 캅카스의 우리 형제입니다. 아르메니아와 더 많이 교역하면 양국 경제에 이익이 되고 지역 협력이 깊어질 것입니다."
 SOV_trade_with_uzbekistan: "우즈베키스탄과의 무역"
 SOV_trade_with_uzbekistan_desc: "우즈베키스탄은 크고 성장하는 시장입니다. 이들과의 무역을 촉진하면 우리 경제에 상당한 활력이 될 것입니다."
 SOV_indian_partnership: "인도 협력"
 SOV_indian_partnership_desc: "인도는 우리 상품이 필요한 거대한 개발도상 시장이며, 우리는 그들의 시장에 접근하여 이익을 얻을 수 있습니다. 인도와의 무역 관계를 확대하는 것은 양측 모두에게 현명한 조치입니다."
 sov_other.19.t: "Russian Peace Proposal!"
 sov_other.19.d: "러시아는 우리가 하드루트와 카르바차르를 차지하고 스테파나케르트는 아르메니아인에게 남겨 두는 평화 조약을 제안하고 있습니다. 러시아 평화유지군은 스테파나케르트에 배치될 것입니다. 이 제안을 거절하는 것은 러시아의 정치적 이익에 반하는 일이 될 것입니다."
 sov_other.19.a: "좋다."
 sov_other.19.b: "우리는 끝까지 싸울 것이다!"
 sov_other.20.t: "러시아의 제안"
 sov_other.20.d: "러시아는 평화유지군을 파견하여 나고르노카라바흐 분쟁을 조정하는 것을 돕겠다고 제안하지만, 그 대가로 우리가 일부 영토를 양도하도록 요구하고 있습니다."
 sov_other.20.a: "No, we're good."
 sov_other.20.b: "Yes, please send help."
 sov_other.21.t: "아르메니아의 거절"
 sov_other.21.d: "Armenia believes it can manage the conflict independently and has declined Russian assistance."
 sov_other.21.a: "그럼 어쩔수 없지..."
 SOV_enforce_oligarchs_control: "올리가르히에 대한 통제 강화"
 SOV_enforce_oligarchs_control_desc: "올리가르히가 영향력을 가질 수는 있으나, 국가의 직접 통제가 훨씬 더 효과적입니다. 국가가 더 강력함을 보여 줌으로써 온 나라에 이익이 되는 국영 기업 체제를 안정적으로 구축할 수 있습니다."
 SOV_support_democratic_belarus: "벨라루스에 민주주의를 가져오라"
 SOV_support_democratic_belarus_desc: "It is time to liberate Belarus from dictatorship and support the development of democracy and freedom for its people."
 SOV_buy_belarus: "주요 공무원들에게 뇌물을 주기"
 SOV_buy_belarus_desc: "벨라루스에서 영향력을 얻으려면 핵심 관료들을 전략적으로 매수하여 그들의 충성을 우리 대의에 확보해야 합니다."
 SOV_civil_war_belarus: "벨라루스의 점령자를 타도하라"
 SOV_civil_war_belarus_desc: "벨라루스를 외세의 점령에서 해방하고 정당한 국민에게 주권을 돌려줄 순간이 왔습니다."
 SOV_fly_byu_drones: "군사 협력 강화"
 SOV_fly_byu_drones_desc: "우리는 전투기를 공급함으로써 이란과의 군사 협력을 확대하고, 그 대가로 자폭 드론 기술을 받아 우리 군을 강화할 것입니다."
 SOV_zov_in_belarus: "벨라루스에서 영향력 회복 시도"
 SOV_zov_in_belarus_desc: "벨라루스 당국이 명백히 반러시아적 입장을 취했음에도 불구하고 우리는 벨라루스에 대한 통제력을 되찾으려 시도할 것입니다. 이 노력은 우리의 영향력을 회복하고 지역 내 전략적 이익을 확보하는 데 매우 중요합니다."
 SOV_support_vitebsk: "비텝스크 프로젝트 발전"
 SOV_support_vitebsk_desc: "오랫동안 준비해 온 비텝스크 인민공화국 프로젝트를 실행에 옮길 준비가 되었습니다. 벨라루스에서 우리의 영향력을 확대하기 위한 발판이 될 봉기를 일으킬 때입니다."
 SOV_wagner_to_vitebsk: "비쳅스크의 바그너"
 SOV_wagner_to_vitebsk_desc: "바그너 민간 군사 기업은 노련한 용병을 동원해 비텝스크 반군을 지원할 준비가 되어 있습니다. 그들의 참여는 봉기를 강화하고 성공 가능성을 높일 것입니다."
 SOV_condemn_belarusian_russophobes: "벨라루스의 반러시아 정책 규탄"
 SOV_condemn_belarusian_russophobes_desc: "우리는 현 벨라루스 정권의 위험한 반러시아 정책을 계속해서 공개적으로 규탄할 것입니다. 이러한 언사는 정권을 고립시키고 벨라루스 국민들의 지지를 결집하는 데 도움이 될 것입니다."
 SOV_belarus_strike: "민스크에서의 3일"
 SOV_belarus_strike_desc: "The time has come for a decisive blow against the nationalist regime ruling Belarus. A swift and overwhelming strike on Minsk will demonstrate our resolve and shift the balance of power in the region."
 SOV_belarus_passports: "비텝스크에 러시아 여권 배포"
 SOV_belarus_passports_desc: "우리는 비텝스크 주민들에게 러시아 시민권을 부여하기 시작할 것입니다. 이 조치는 해당 지역에 대한 우리의 주장을 강화하고 그곳의 우리 국민에게 더 큰 보호와 권리를 제공할 것입니다."
 SOV_blr_union_programm: "벨라루스와 연합 프로그램 조율"
 SOV_blr_union_programm_desc: "유대를 강화하기 위해 우리는 벨라루스와 여러 통합 로드맵을 조율하고 이행할 것입니다. 이 프로그램들은 경제적, 정치적 협력을 심화할 것입니다."
 SOV_exercises_belarus_start: "동맹의 결의 훈련"
 SOV_exercises_belarus_start_desc: "러시아군과 벨라루스군은 우리의 단결과 공동의 이익을 수호할 준비 태세를 보여 주기 위해 합동 군사 훈련을 실시할 것입니다."
 SOV_pasports_novorossiya: "러시아 여권 배포"
 SOV_pasports_novorossiya_desc: "우리는 해방한 지역의 주민들에게 러시아 시민권을 부여하여 조국과의 유대를 공고히 하고 러시아 법에 따라 그들을 보호할 것입니다."
 SOV_UVZ_expanding: "우랄바곤자보드를 146%로 가동하라"
 SOV_UVZ_expanding_desc: "우리나라는 대량의 전차가 시급히 필요합니다. 우리는 우랄바곤자보드가 생산을 늘려 이러한 수요를 충족하도록 압박하여 군사력을 보장할 것입니다."
 SOV_more_drones: "드론 생산에 투자"
 SOV_more_drones_desc: "현대전은 무인 기술에 크게 의존합니다. 현대 군사 발전에 보조를 맞추려면 드론 생산에 대규모로 투자해야 합니다."
 SOV_vstavai_strana: "민족 대대"
 SOV_vstavai_strana_desc: "러시아의 민족들은 조국을 수호하기 위해 함께 일어나야 합니다. 민족 대대는 이 정신을 구현하며 비할 데 없는 투지로 싸울 것입니다."
 SOV_armneia_arbat: "아르메니아 아르바트 대대"
 SOV_armneia_arbat_desc: "우리의 아르메니아 형제들이 이 분쟁에서 우리를 지원할 준비가 되어 있습니다. 그들의 헌신과 용맹은 전장에서 우리의 노력을 강화할 것입니다."
 SOV_volunteer_gifts: "시민들의 기부"
 SOV_volunteer_gifts_desc: "뜻있는 시민들이 전선을 지원하기 위해 아낌없이 기부하고 있습니다. 이들의 기부는 핵심 자원을 제공하고 우리 장병들의 사기를 높입니다."
 SOV_contracts_with_minobr: "국방부와의 계약"
 SOV_contracts_with_minobr_desc: "군의 질서를 바로잡기 위해 모든 인원은 국방부와 공식 계약을 체결해야 합니다. 이는 규율과 지휘의 명확성을 보장할 것입니다."
 SOV_unite_as_one: "러시아의 역사를 존중하라"
 SOV_unite_as_one_desc: "우리 국가는 방대하고 풍부한 역사를 지니고 있습니다. 앞으로 나아가는 단결과 자부심의 토대로서 우리의 유산을 기리고 존중해야 합니다."
 SOV_referendums_novorossiya: "러시아 합류에 대한 국민투표"
 SOV_referendums_novorossiya_desc: "노보로시야가 공식적으로 러시아와 재통합할 때가 왔습니다. 국민투표를 실시하면 주민들이 자신의 의지를 표현하고 이 과정을 정당화할 수 있습니다."
 SOV_governorates: "행정구역"
 SOV_governorates_desc: "We have endured too many national republics and the marginalization of ethnic Russians. By reorganizing the country into 30 governorates, we will govern more effectively and unite the state. This reform strengthens central authority and restores order."
 SOV_rus_sphere_united_arms: "모스크바 조약"
 SOV_rus_sphere_united_arms_desc: "We must create a new, powerful political and military alliance. Old agreements have failed us; it is time to form our own coalition that will assert our influence globally and challenge Western dominance."
 SOV_zhirinovsky_take_trans: "트란스니스트리아 국민투표"
 SOV_zhirinovsky_take_trans_desc: "몰도바와의 지속적인 문제는 그들에게 골칫거리가 될 것입니다. 우리가 프리드네스트로비예를 우리의 통제 아래 두기 때문입니다. 이 국민투표는 우리의 주장을 정당화하고 영향력을 넓힐 것입니다."
 SOV_co_op_wagner: "Put Prigozhin in Charge"
 SOV_co_op_wagner_desc: "Since the primary funding comes from Yevgeny Prigozhin, it makes sense to place him in charge of the PMCs. His leadership will bring more coordination and efficiency."
 SOV_rva: "러시아 의용군 창설"
 SOV_rva_desc: "민족주의 단체들이 늘어남에 따라, 우리는 준군사 부대들을 러시아 의용군으로 통합하여 전시에 투입할 준비를 갖출 것입니다."
 SOV_roscosmos_intel: "위성군 편성"
 SOV_roscosmos_intel_desc: "우리는 아군에 필수적인 정보를 제공하기 위해 정찰 위성의 가동 망을 배치할 것입니다."
 SOV_airforce_structure_change: "구조 개혁"
 SOV_airforce_structure_change_desc: "공군 계급을 현대화하기 위한 인사 개편이 진행 중입니다."
 SOV_fighter_production: "전투기 생산 강화"
 SOV_fighter_production_desc: "전투기가 많을수록 하늘은 더 안전하고 평화롭습니다."
 SOV_uav_production: "드론 생산 확대"
 SOV_uav_production_desc: "우리는 아군 전반에 드론을 널리 배치하는 것을 목표로 합니다."
 SOV_bombers_production: "폭격기 생산 증대"
 SOV_bombers_production_desc: "우리의 적들은 우리 폭격기의 위력에 압도될 것입니다."
 SOV_pakfa: "PAKFA"
 SOV_pakfa_desc: "우리의 Su 계열 전투기는 세계 최고 수준에 속합니다."
 SOV_pakda: "PAKDA"
 SOV_pakda_desc: "PAKDA 계열은 가장 진보한 폭격기 가운데 일부를 특징으로 합니다."
 SOV_radioelectronic_warfare: "전자전 부대"
 SOV_radioelectronic_warfare_desc: "이 부대들은 공역을 지배하고, 적의 간섭으로부터 아군 체계를 보호하며, 적의 통신을 교란하는 작전을 수행합니다."
 SOV_modernize_soviet_missile_stockpiles: "발사 사일로 개선"
 SOV_modernize_soviet_missile_stockpiles_desc: "우리의 미사일 사일로는 노후화되어 적시의 개량이 필요합니다."
 SOV_missile_defense_investments: "대공 미사일군"
 SOV_missile_defense_investments_desc: "이 병력은 핵심 시설과 부대를 적의 공습으로부터 보호할 것입니다."
 SOV_russian_airspace_forces: "Russian Aerospace Forces"
 SOV_russian_airspace_forces_desc: "쇠퇴기를 거친 후, 우리 공군은 이제 장비를 갖추고 전 세계 제공권을 되찾을 준비가 되었습니다."
 SOV_space_forces_improvement: "항공군에 추가 투자"
 SOV_space_forces_improvement_desc: "우리는 우주군에 대한 재정 지원을 늘릴 것입니다."
 SOV_reform_army: "새로운 군대 개혁"
 SOV_reform_army_desc: "현대전의 기준에 맞게 우리 육군을 현대화할 때입니다."
 SOV_armyreform_spec: "특수 부대가 우리의 힘이다"
 SOV_armyreform_spec_desc: "우리는 특수 부대를 확대하고 그 훈련과 장비를 강화할 것입니다."
 SOV_mto: "병참지원 부대 창설"
 SOV_mto_desc: "병참지원 부대는 군의 모든 군종에 걸쳐 기술적, 병참적 지원을 제공합니다."
 SOV_arta: "Artillery is the God of War"
 SOV_arta_desc: "우리는 소련 시대의 포병 우위 원칙을 유지하여 우리 포병이 계속 최고임을 보장할 것입니다."
 SOV_mechanize: "육군의 기계화"
 SOV_mechanize_desc: "우리 육군은 기동적이고 기계화되어야 하며, 이를 달성하기 위해 모든 노력을 기울일 것입니다."
 SOV_bmpt: "BMPT 터미네이터"
 SOV_rosguard_start_org: "여단 편성 시작"
 SOV_rosguard_start_org_desc: "첫 번째 여단들을 편성하기 시작할 때입니다."
 SOV_rosguard_armor: "신형 장갑차량"
 SOV_rosguard_armor_desc: "개혁의 일환으로 국가근위대는 전투 능력을 강화하기 위해 신형 장갑차량을 도입할 것입니다."
 SOV_rosguard_military: "National Guard Forces Command"
 SOV_rosguard_military_desc: "이 국가 군사 조직은 공공 안전과 국가 안보를 보장하며 내무부 내무군에서 발전했습니다."
 SOV_rosguard_occup: "OMON과 SOBR의 개편"
 SOV_rosguard_occup_desc: "OMON과 SOBR 부대는 인원 확충과 장비 개선과 함께 국가근위대에 통합될 것입니다."
 SOV_rosguard_tank: "러시아 국가 근위대의 전차 사용 허용"
 SOV_rosguard_tank_desc: "프리고진의 반란 이후, 우리는 러시아 국가 근위대에 전차를 맡길 준비가 되었습니다."
 SOV_reorganize_airforce: "공군 재편"
 SOV_reorganize_airforce_desc: "우리 공군은 상태가 좋지 않습니다. 일련의 대대적인 개혁을 통해 더 나은 상태로 되돌릴 것입니다."
 SOV_missile_development: "전략 로켓군"
 SOV_missile_development_desc: "이 부대는 핵 억지를 위해 상시 전투 태세를 유지하며, 대규모 또는 표적 핵 타격이 가능합니다. 러시아의 모든 대륙간 탄도 미사일이 그들의 지휘 아래 있으며, 이들은 우리의 군사력과 경제력의 핵심을 이룹니다."
 russia_governorate.1.t: "우리를 현으로 삼기로 한 러시아의 결정"
 russia_governorate.1.d: "러시아는 기존의 국가 구조에 강하게 반대하고 있습니다. 그 한 예가 행정 구역으로의 복귀입니다. 러시아는 우리를 이 새로운 질서의 일부인 자국의 현 가운데 하나가 되도록 초청하고 싶어 합니다."
 russia_governorate.1.o1: "Together, we will revive the great Empire!"
 russia_governorate.2.t: "고향으로 돌아오는 [LIT.GetName]"
 russia_governorate.2.d: "[LIT.GetName] 정부는 우리와의 대립을 피함으로써 현명하게 행동했습니다. [LIT.GetName]은(는) 다시 한번 러시아 제국의 일부가 되어 우리의 단결과 공동의 미래를 강화할 것입니다."
 russia_governorate.2.o1: "마침내"
 russia_governorate.3.t: "우리에게 저항하는 [LIT.GetName]!"
 russia_governorate.3.d: "[LIT.GetName] 정부는 평화적으로 우리의 지방이 되라는 우리의 관대한 제안을 거부했습니다. 그들이 외교를 거부한다면 우리는 무력으로 조치를 취할 수밖에 없습니다."
 russia_governorate.3.o1: "멍청이들"
 russia_governorate.4.t: "우리를 현으로 삼기로 한 러시아의 결정"
 russia_governorate.4.d: "러시아는 기존의 국가 구조에 단호히 반대하고 있습니다. 그 한 예가 행정 구역의 복원입니다. 러시아는 우리를 자국의 현 가운데 하나가 되도록 초청하기로 결의했습니다."
 russia_governorate.4.o1: "Together, we will revive the great Empire!"
 russia_governorate.5.t: "고향으로 돌아오는 [LAT.GetName]"
 russia_governorate.5.d: "[LAT.GetName] 정부는 우리와의 충돌을 피함으로써 신중하게 행동했습니다. [LAT.GetName]은(는) 다시 한번 러시아 제국의 일부가 되어 우리의 유대를 강화할 것입니다."
 russia_governorate.5.o1: "마침내"
 russia_governorate.6.t: "우리에게 저항하는 [LAT.GetName]!"
 russia_governorate.6.d: "[LAT.GetName] 정부는 평화적으로 우리의 지방으로 합류하라는 우리의 관대한 제안을 거절했습니다. 우리는 무력으로 그들을 차지하는 수밖에 없습니다."
 russia_governorate.6.o1: "멍청이들"
 russia_governorate.7.t: "우리를 현으로 삼기로 한 러시아의 결정"
 russia_governorate.7.d: "러시아는 기존의 국가 구조에 강하게 반대하고 있습니다. 그 한 예가 행정 구역의 재도입입니다. 러시아는 우리를 자국의 현 가운데 하나가 되도록 초청하려 합니다."
 russia_governorate.7.o1: "Together, we will revive the great Empire!"
 russia_governorate.8.t: "고향으로 돌아오는 [EST.GetName]"
 russia_governorate.8.d: "[EST.GetName] 정부는 우리와의 대립을 현명하게 피했습니다. [EST.GetName]은(는) 다시 한번 러시아 제국의 일부가 되어 우리의 새로워진 힘에 동참할 것입니다."
 russia_governorate.8.o1: "마침내"
 russia_governorate.9.t: "우리에게 저항하는 [EST.GetName]!"
 russia_governorate.9.d: "[EST.GetName] 정부는 평화적으로 우리의 지방이 되라는 우리의 관대한 제안을 거부했습니다. 그들이 고집을 꺾지 않는다면 우리는 단호한 조치를 취해야 합니다."
 russia_governorate.9.o1: "멍청이들"
 russia_governorate.10.t: "우리를 현으로 삼기로 한 러시아의 결정"
 russia_governorate.10.d: "러시아는 기존의 국가 구조에 반대하며 행정 구역의 복귀를 지지합니다. 그들은 우리가 자국의 현 가운데 하나가 되기를 강하게 원하고 있습니다."
 russia_governorate.10.o1: "Together, we will revive the great Empire!"
 russia_governorate.11.t: "조지아가 귀가하다"
 russia_governorate.11.d: "조지아 정부는 우리와의 대립을 피함으로써 현명한 선택을 했습니다. 조지아는 다시 한번 러시아 제국의 일부가 되어 오랜 유대를 새롭게 할 것입니다."
 russia_governorate.11.o1: "마침내"
 russia_governorate.12.t: "Georgia Resists Us!"
 russia_governorate.12.d: "조지아 정부는 평화적으로 지방으로 통합하라는 우리의 관대한 제안을 거절했습니다. 우리는 무력으로 그들을 차지하는 수밖에 없습니다."
 russia_governorate.12.o1: "멍청이들"
 russia_governorate.13.t: "우리를 현으로 삼기로 한 러시아의 결정"
 russia_governorate.13.d: "러시아는 이전의 국가 구조에 강하게 반대하며 행정 구역의 복귀를 지지합니다. 그들은 우리를 자국의 현 가운데 하나가 되도록 초청하려 합니다."
 russia_governorate.13.o1: "Together, we will revive the great Empire!"
 russia_governorate.14.t: "몰도바가 귀가하다"
 russia_governorate.14.d: "몰도바 정부는 대립을 피함으로써 현명하게 행동했습니다. 몰도바는 다시 한번 러시아 제국의 일부가 되어 우리의 단결을 강화할 것입니다."
 russia_governorate.14.o1: "마침내"
 russia_governorate.15.t: "Moldova Resists Us!"
 russia_governorate.15.d: "몰도바 정부는 평화적으로 지방으로 합류하라는 우리의 관대한 제안을 거절했습니다. 그들이 계속 저항한다면 우리는 무력으로 그들을 차지할 수밖에 없습니다."
 russia_governorate.15.o1: "Fools"
 russia.38.t: "경제 협력에 동의한 [FROM.GetName]!"
 russia.38.d: "[FROM.GetName]은(는) 우리의 투자 제안에 긍정적으로 응답했습니다. 이는 양국 간의 더욱 깊은 협력과 상호 성장의 시작을 알립니다."
 russia.38.o1: "훌륭하군."
 russia.39.t: "경제 협력을 거절한 [FROM.GetName]!"
 russia.39.d: "[FROM.GetName]은(는) 우리의 투자 제안을 거부하여 이 프로젝트의 향후 진전을 중단시켰습니다. 적어도 당분간은 경제 협력의 기회가 사라졌습니다."
 russia.39.o1: "슬프군"
 russia.41.t: "중화기 화염방사 시스템을 제안하는 [SOV.GetNameWithFlag]"
 russia.41.d: "러시아는 자국의 최신 군사 개발품 중 하나인 강력한 중화기 화염방사 시스템을 제안했습니다. 이 첨단 무기는 우리의 역량을 크게 높일 수 있습니다. 그들의 제안을 수락하시겠습니까?"
 russia.41.o1: "찬성"
 russia.41.o2: "안된다"
 russia.44.t: "우리 중화기 화염방사 시스템의 구매"
 russia.44.d: "[FROM.GetName]은(는) 우리의 중화기 화염방사 시스템을 구매하기로 동의했습니다. 이 판매는 그들과의 경제적, 군사적 유대를 강화합니다."
 russia.44.a: "좋아"
 russia.45.t: "우리 중화기 화염방사 시스템의 구매"
 russia.45.d: "[FROM.GetName]은(는) 우리의 중화기 화염방사 시스템 구매를 거절했습니다. 성사될 수 있었던 거래가 무산되었습니다."
 russia.45.a: "유감이군."
 russia.46.t: "전차를 제안하는 [SOV.GetNameWithFlag]"
 russia.46.d: "러시아는 자국의 최신 기갑전 발명품 중 하나인 최첨단 전차 시스템을 제안하고 있습니다. 이 장비를 확보하면 우리 육군이 크게 강화될 수 있습니다."
 russia.46.o1: "찬성"
 russia.46.o2: "안된다"
 russia.47.t: "탱크 구매"
 russia.47.d: "[FROM.GetName]은(는) 우리의 전차를 구매하기로 동의했습니다. 이 거래는 양국의 경제와 전략적 입지 모두에 이익이 될 것입니다."
 russia.47.a: "좋아"
 russia.48.t: "탱크 구매"
 russia.48.d: "[FROM.GetName]은(는) 우리의 전차 구매를 거절했습니다. 새로운 고객을 찾아야 할 것입니다."
 russia.48.a: "유감이군."
 russia.49.t: "카라바흐 갈등"
 russia.49.d: "카라바흐에서의 끝없는 분쟁이 또 한 번의 중대한 고비에 이르렀습니다. 이제 우리는 이 불안정하고 역사적으로 분쟁이 끊이지 않는 지역에서 누구를 지원할지 결정해야 합니다."
 russia.49.a: "우리는 아르메니아를 도울 것이다"
 russia.49.b: "우리는 아제르바이잔을 도울 것이다"
