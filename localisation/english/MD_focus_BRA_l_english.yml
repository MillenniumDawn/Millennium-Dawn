l_english:
 BRA_idea_trucker_strike: "Truckers' Strike"
 BRA_idea_trucker_strike_desc: "Truckers have parked their rigs across the country, and fuel, freight, and building supplies are no longer reaching the places that need them. Most of Brazil's cargo moves by road, so a strike stalls construction and resource output within days. It will end on its own, but while it lasts the government looks weak."
 BRA_focus_tree: "Brazilian Focus Tree"
 #### FOCUS TREE
 #Lula Main Political Tree
 BRA_2002_elections: "The 2002 Elections"
 BRA_2002_elections_desc: "Fernando Henrique Cardoso's second term is ending in a currency crisis. José Serra asks voters to trust the PSDB's record, Lula promises change without chaos, and Enéas Carneiro rails against them both."
 BRA_lula: "Lula"
 BRA_lula_desc: "The former lathe operator from Pernambuco won nearly 53 million votes, more than any directly elected president except Ronald Reagan. Now the Workers' Party has to govern for all of them."
 BRA_serra: "Serra"
 BRA_serra_desc: "José Serra, Cardoso's chosen successor, is now president of Brazil. We must make the Brazilian people proud and correct the mistakes of the Cardoso years."
 BRA_nossa_economia: "Nossa Economia"
 BRA_nossa_economia_desc: "The 1997 Asian financial crisis sent shockwaves through global markets. Brazil's export earnings shrank, and Cardoso's policies were slow to answer the damage. We must encourage growth and finally reverse this downturn."
 BRA_pay_back_the_imf: "Pay Back the IMF"
 BRA_pay_back_the_imf_desc: "The IMF rescue package signed in Cardoso's last months still binds our budget to conditions set abroad. Paying down what we owe will cost the treasury now, but it clears the debts that weigh on the real and returns our economic policy to Brazilian hands."
 BRA_brazilian_exports: "Brazilian Exports"
 BRA_brazilian_exports_desc: "Brazil's economy is structured around its raw resources. We now have the chance to turn them into a profitable venture."
 BRA_foreign_companies: "Foreign Companies"
 BRA_foreign_companies_desc: "Foreign firms bring capital, technology, and export markets that our own companies cannot yet match. Welcoming them will please the big industrial groups and the international bankers and put cash in the treasury, but small and medium businesses will fear the new competition."
 BRA_bolsa_familia: "Bolsa Família"
 BRA_bolsa_familia_desc: "Bolsa Família pays poor families a monthly stipend on the condition that their children attend school. Part of the Fome Zero campaign, it feeds families today and gives the next generation the schooling to escape poverty."
 BRA_fome_zero: "Fome Zero"
 BRA_fome_zero_desc: "Fome Zero bundles our social welfare programs into one campaign against hunger. It must cut poverty and help families educate themselves to build a better life."
 BRA_improve_workers_rights: "Improve Workers' Rights"
 BRA_improve_workers_rights_desc: "The laws protecting workers in our country are sorely lacking. We should expand the protections for employees of all sectors."
 BRA_increase_taxes: "Increase Taxes"
 BRA_increase_taxes_desc: "Our programs need steady funding, and the state cannot borrow its way through them. Higher taxes will fill the treasury, but small businesses and international bankers will resent them, and the move shifts the party toward its Radical Wing."
 BRA_improve_the_public_sector: "Improve the Public Sector"
 BRA_improve_the_public_sector_desc: "Decades of neglect have left our public sector unable to serve the millions of Brazilians who depend on it. More investment will deliver the services we promised, and deliver them efficiently."
 BRA_social_enterprises: "Social Enterprises"
 BRA_social_enterprises_desc: "Where Cardoso sold, we will keep. Public enterprises should stay public, owned by the people and run for the people, and a new industrial complex in Ceará will show what state-backed industry can do. Our unions will approve, and so will the big industrial groups that supply those enterprises."
 BRA_economic_interventionism: "Economic Interventionism"
 BRA_economic_interventionism_desc: "Left alone, the market serves those who already have money. The state must step in to steer investment and shield Brazilians from its swings, starting with new industry in Bahia. The price is a larger, more centralized government and an economy that runs a little less efficiently."
 BRA_expand_state_owned_companies: "Expand State-Owned Companies"
 BRA_expand_state_owned_companies_desc: "State-owned companies are the backbone of a strong Brazilian economy. We should not privatize them, as the Cardoso government did, but manage them on behalf of the people."
 BRA_introduce_new_regulations: "Introduce New Economic Regulations"
 BRA_introduce_new_regulations_desc: "Consumers and workers have too few ways to fight back against abusive prices, unsafe jobs, and shoddy goods. Stricter rules will protect them and steady the country, but business will complain of red tape, and research and productivity will pay for it."
 BRA_encourage_consumption: "Encourage Consumption"
 BRA_encourage_consumption_desc: "Steady demand from ordinary families is the engine of a modern economy. Putting more money in their pockets and more goods in the shops will help firms large and small, speed up growth, and ease the pressure on the damaged real."
 BRA_national_developmentalism: "National Developmentalism"
 BRA_national_developmentalism_desc: "National developmentalism let Brazil industrialize rapidly. We should never have abandoned it, and we must now bring it back."
 BRA_social_programs_agenda_lula: "Social Programs Agenda"
 BRA_social_programs_agenda_lula_desc: "Lula and the entire Workers' Party want a strong state that can give the people a dignified life. To fulfill the party's agenda, we must create new social programs."
 BRA_expand_social_benefits: "Expand Social Benefits"
 BRA_expand_social_benefits_desc: "Bolsa Família has shown that targeted benefits work, but many Brazilians still have no safety net. Expanding what we offer will let more families live with dignity and steady the country, and it keeps the party on its Reformist Wing."
 BRA_education_funding: "Education Funding"
 BRA_education_funding_desc: "Illiteracy has plagued Brazil for generations. Greater investment in education will help us eradicate it as quickly as possible."
 BRA_university_funding: "University Funding"
 BRA_university_funding_desc: "Our public universities do much of Brazil's research and train many of its doctors and engineers, yet many of them are short of money and equipment. More funding will fill their labs and pay for more teachers, and the research that follows will repay the cost."
 BRA_gather_the_teachers_support: "Gather Intellectual Support"
 BRA_gather_the_teachers_support_desc: "Teachers, professors, and researchers shape how young Brazilians see politics. Courting them with funding and respect will win us their backing and a calmer country, and it will strengthen our ties with the labor unions that organize them."
 BRA_increase_the_minimun_wage: "Increase the Minimum Wage"
 BRA_increase_the_minimun_wage_desc: "Brazil has suffered from deep inequality since the days of the Empire, and the gap between rich and poor has never closed. Raising the minimum wage will ease its effects and help working families."
 BRA_foreign_policy: "Brazil's Foreign Policy"
 BRA_foreign_policy_desc: "The Itamaraty, our foreign ministry, has a long tradition of independence from any single bloc. The new government must decide whether to lean toward Washington and Europe, toward China and the left in our region, or toward something in between. Each choice will bring its own friends and its own critics."
 BRA_align_to_cuba: "Friendship with Cuba"
 BRA_align_to_cuba_desc: "Fidel Castro and Lula have been friends for decades. Closer relations with Cuba matter to both our nations."
 BRA_align_to_venezuela: "Visit Chávez"
 BRA_align_to_venezuela_desc: "Chávez and Lula both want a South America that answers less to Washington. A standing channel between Brasília and Caracas would turn that shared view into regular cooperation."
 BRA_align_to_bolivia: "Friendship with Bolivia"
 BRA_align_to_bolivia_desc: "Evo Morales, who leads Bolivia, shares Lula's friendship and much of our outlook. Bolivian gas already reaches our industry through the Gasbol pipeline, and warmer ties will protect that supply and keep our long shared border calm."
 BRA_chinese_alignment: "Friendship with China"
 BRA_chinese_alignment_desc: "China is the superpower of tomorrow and will soon rival the United States in every field. We should draw closer to it."
 BRA_chinese_trade: "Trade with China"
 BRA_chinese_trade_desc: "China has become an ever larger buyer of our soy and iron ore, and a trade agreement would lock that demand in. We will offer Beijing improved trade terms, and if it accepts, our exporters gain a steadier market in one of the fastest-growing economies of our time."
 BRA_brics_investments: "BRICS Investments"
 BRA_brics_investments_desc: "The BRICS bring together large developing economies that want a bigger say in world affairs. By applying to join and courting investment from its members, we can find capital and partners that do not depend on Washington."
 BRA_international_support: "International Support"
 BRA_international_support_desc: "Our ties with the BRICS and our friends in South America have given us a voice in the developing world. Now we will carry that voice to the capitals of the older powers as well, starting with Paris and London, so that Brazil is heard on every side of the world's divides."
 BRA_the_workers_party_political_path: "Discuss the Party"
 BRA_the_workers_party_political_path_desc: "The party needs to develop its agenda now that our campaign has won us the presidency. Do we keep our promises?"
 BRA_a_promise_to_keep: "A Promise to Keep"
 BRA_a_promise_to_keep_desc: "Our campaign promised change without rupture. Bringing the Democratic Labour Party into government gives us partners for gradual reform and a firmer footing in Congress."
 BRA_align_centrao: "Align with the Centrão"
 BRA_align_centrao_desc: "The Centrão, the loose bloc of centrist and conservative parties around the MDB, decides most votes in Congress and has joined nearly every recent government that offered it posts. Inviting it into our coalition will give the Workers' Party a working majority, but the price will be paid in ministries and favors."
 BRA_media_tatics: "Media Tactics"
 BRA_media_tatics_desc: "Globo and most of the large papers have never warmed to the Workers' Party. By steering government advertising and friendly coverage toward outlets that give us a fair hearing, we can reach voters who have only heard the other side."
 BRA_mensalao: "Mensalão"
 BRA_mensalao_desc: "Our allies in Congress expect more than promises. Monthly payments to friendly deputies, the mensalão, will buy us a dependable majority and keep our agenda moving. The money leaves a trail, however, and Congress will eventually ask where it went."
 BRA_crush_corruption: "Root Out Corruption"
 BRA_crush_corruption_desc: "Officials embezzle public money, and scandal follows scandal in our politics. We must rebuild the people's trust in their government."
 BRA_push_for_an_agrarian_reform: "Agrarian Reform"
 BRA_push_for_an_agrarian_reform_desc: "A handful of landowners hold most of our farmland, leaving small farmers no room to grow. Agrarian reform will end that long-standing injustice."
 BRA_an_example_of_honesty: "An Example of Honesty"
 BRA_an_example_of_honesty_desc: "Lula's story, from the factory floor to the presidential palace, is the best argument the Workers' Party has. By holding himself to a higher standard than his rivals, he can win the trust of Brazilians who are tired of scandal and make himself the face of our government."
 BRA_western_investments: "Western Investments"
 BRA_western_investments_desc: "Wealthy Western countries have the capital and technology we need, and they have a long record of investing in Brazil. We will offer the United Kingdom an investment treaty that protects both sides, and we will not wait for its answer to open a new industrial complex in Santa Catarina."
 BRA_eastern_investments: "Eastern Investments"
 BRA_eastern_investments_desc: "China has the capital and the construction firms to build what Brazil still lacks, from rail lines to factories. A new industrial complex in Mato Grosso do Sul is only the beginning, and we will offer Beijing an investment treaty that protects both sides' investors."
 BRA_our_own_industry: "Our Own Industry"
 BRA_our_own_industry_desc: "Brazilian capital too often goes abroad or sits idle. With the economy steadier and no foreign patron to please, we can give our own investors the confidence to build at home, starting with a new industrial complex in Goiás."
 BRA_new_wave_ideas: "New Wave Ideas"
 BRA_new_wave_ideas_desc: "Our country has stabilized and become the power it was always meant to be. Now we must decide how best to expand our influence abroad."
 BRA_global_diplomacy: "Global Diplomacy"
 BRA_global_diplomacy_desc: "America, Europe, China, Russia, and Japan all compete for our attention and favor. With whom should we side?"
 BRA_align_to_nato: "US-NATO Alignment"
 BRA_align_to_nato_desc: "Brazil has long maintained close ties with the United States and the NATO alliance. Deepening that partnership opens the door to American security guarantees and the status of a Major Non-NATO Ally."
 BRA_non_aligned: "Non-Aligned"
 BRA_non_aligned_desc: "Brazil has never needed a patron. By staying non-aligned, we keep our neutrality and our freedom to trade with every side."
 BRA_eastern_alignment: "Eastern Alignment"
 BRA_eastern_alignment_desc: "We have worked closely with China and the BRICS in recent years. It is time to align ourselves with them formally."
 # Industrial Section
 BRA_growth_through_freedom: "Growth Through Freedom"
 BRA_growth_through_freedom_desc: "Brazilian business has long been held back by licenses, taxes, and red tape. Freeing private enterprise from them will put capital to work and speed up construction, and the new confidence will make our government more effective. The boost will not last forever, so we must use it while it does."
 BRA_legalize_independent_amazonian_development: "Legalize Independent Amazonian Development"
 BRA_legalize_independent_amazonian_development_desc: "The Amazon's development is tightly regulated and cannot proceed without government oversight of each company. We should loosen these rules and let construction, farming, and mining firms develop the region independently."
 BRA_build_fortaleza: "Expand Fortaleza"
 BRA_build_fortaleza_desc: "Fortaleza is the capital of Ceará and a major Atlantic port. New factories, roads, and rail links will turn it into an industrial center for the whole Northeast and bring steady jobs to a region that needs them."
 BRA_brazilian_research_and_development: "Brazilian Research and Development"
 BRA_brazilian_research_and_development_desc: "Brazil buys much of its technology abroad, and every license costs us money and independence. Funding our own labs and institutes will speed up research and keep the know-how at home, though training the larger skilled workforce will cost more."
 BRA_develop_recife: "Develop Recife"
 BRA_develop_recife_desc: "Recife is a major port city that must be allowed to grow. Easy access to foreign goods makes it a prime target for development."
 BRA_northeastern_stimulus: "Northeastern Stimulus"
 BRA_northeastern_stimulus_desc: "The Northeast has long trailed the industrial South and Southeast, and many of our poorest families live there. Public money for new plants in Maranhão and better infrastructure in Bahia will bring work to a region that growth has too often passed by."
 BRA_foreign_research_methods: "Foreign Research Methods"
 BRA_foreign_research_methods_desc: "The University of São Paulo and Unicamp already do excellent work, but our labs still have much to learn from abroad. Exchanges and partnerships with foreign universities will bring new methods home and make our education spending go further."
 BRA_energy_mining_ministry: "Energy and Mining Ministry"
 BRA_energy_mining_ministry_desc: "The Ministry of Mines and Energy (MME) formulates and carries out public policy for the sustainable management of our energy and mineral resources."
 BRA_amazonian_el_dorado: "Amazonian El Dorado"
 BRA_amazonian_el_dorado_desc: "Manaus is a hidden jewel of the Amazon. Its beauty and tourist potential could bring jobs to the local economy."
 BRA_presal: "Develop Rio"
 BRA_presal_desc: "Rio de Janeiro is a bustling city with a large unemployed population. New factories can put them to work and drive economic growth."
 BRA_develop_the_interior_and_amazon: "Develop the Interior and the Amazon"
 BRA_develop_the_interior_and_amazon_desc: "The Amazon and the interior have the land and the resources but too few roads, power lines, and factories to use them. New industry in Pará and Goiás and better infrastructure in Mato Grosso, Mato Grosso do Sul, and Goiás will bring jobs to regions that the coast has long outpaced."
 BRA_develop_sp_mg_and_the_south: "Develop the Southeast and the South"
 BRA_develop_sp_mg_and_the_south_desc: "Big cities like São Paulo and Curitiba are already well developed. We must now develop more cities in the southeast and the south."
 BRA_major_development_projects: "Major Development Projects"
 BRA_major_development_projects_desc: "To strengthen our economy and industry, we will invest in great public works through the Ministry of Transport."
 BRA_expanded_brazilian_economy: "Expanded Brazilian Economy"
 BRA_expanded_brazilian_economy_desc: "Vale's growing reach abroad and new investment in Fortaleza are paying off in jobs and tax revenue. Our economy is larger and more varied than it was, and we should press that advantage to keep it growing."
 BRA_internationalize_the_real: "Internationalize the Real"
 BRA_internationalize_the_real_desc: "The real helped Brazil put years of runaway inflation behind us, but our partners still look to the dollar for their reserves. Our economy is strong enough to offer another choice. Let us take the real beyond our borders and give other nations a reason to hold it."
 BRA_santos_oilfields: "Develop Santos Basin Offshore Oilfields"
 BRA_santos_oilfields_desc: "The Santos Basin off our southeastern coast holds oil that Petrobras has only begun to tap, and Petrobras has the platforms and the know-how to reach them. New wells will add to our output, but the big contracts will tempt the same few construction firms, and we will have to decide how to handle them."
 BRA_petrobras_tech: "Petrobras Technology"
 BRA_petrobras_tech_desc: "Petróleo Brasileiro S.A. (Petrobras) is a publicly traded, state-controlled company focused on oil and refining. With its technology, we can improve our oil output and our refineries."
 BRA_canadian_vale_incorporation: "Canadian Vale Incorporation"
 BRA_canadian_vale_incorporation_desc: "Vale is a Brazilian multinational and one of the world's largest mining companies, as well as the largest producer of iron ore, pellets, and nickel. Bringing its Canadian operations closer to the parent company will give us resources while keeping relations with Canada friendly."
 BRA_fossil_fuel_industry: "Fossil Fuel Industry"
 BRA_fossil_fuel_industry_desc: "Talk of \"sustainable development\" will not pay our bills. Our land holds the resources, so let us extract them."
 BRA_clean_energy_path: "Clean Energy Path"
 BRA_clean_energy_path_desc: "Brazil already draws most of its electricity from hydropower, and we hold most of the Amazon rainforest. Choosing the clean path commits us to protect the environment for future generations and to build more renewable power instead of leaning on fossil fuels."
 BRA_comperj: "COMPERJ"
 BRA_comperj_desc: "COMPERJ is the Petrobras petrochemical complex planned for Itaboraí, outside Rio de Janeiro. It would turn our oil into fuels, plastics, and other goods at home instead of selling it as crude. The fossil fuel industry will welcome the investment, and our oil output grows with it."
 BRA_develop_angra3: "Develop Angra 3"
 BRA_develop_angra3_desc: "Angra 3 is the third reactor planned beside Angra 1 and Angra 2 on the coast at Angra dos Reis. Finishing it and building more reactors will give us steady, low-carbon power that does not depend on rainfall. It is expensive, but it also keeps our own nuclear industry alive."
 BRA_presal_dev: "Develop the Pre-Salt Reserves"
 BRA_presal_dev_desc: "The pre-salt reserves lie in deep-water rock layers beneath a thick shell of salt on the ocean floor off our coast. They are among the deepest oil reserves in the world and hold billions of barrels of light oil."
 BRA_solar_power_sertao: "Expand Solar Power in the Sertão"
 BRA_solar_power_sertao_desc: "The Sertão is hot, dry, and sunny, which makes it perfect for solar power."
 BRA_the_countryside: "The Countryside"
 BRA_the_countryside_desc: "Most Brazilians live on the eastern coast, but much of the food we eat and export comes from the countryside. We should invest in improving the interior and the wealth it provides."
 BRA_expand_commercialized_sugar_cane: "Expand Commercial Sugarcane Production"
 BRA_expand_commercialized_sugar_cane_desc: "Sugarcane is one of our main cash crops. Expanding commercial production will spur more agro-industrial development at home."
 BRA_increase_grain_exports: "Increase Grain Exports"
 BRA_increase_grain_exports_desc: "Agriculture is a massive industry in Brazil, and grain is a large part of it. We should expand grain production and exports to strengthen our dominance in primary-sector exports."
 BRA_coffee_plantations: "Coffee Plantations"
 BRA_coffee_plantations_desc: "Brazil's climate is exceptionally suited to coffee, and we have been a major producer since the 19th century. Targeted subsidies and larger commercial plantations will give our GDP a substantial boost."
 BRA_apirary_expansions: "Apiary Expansions"
 BRA_apirary_expansions_desc: "Our grasslands and meadows are full of flowers, and the local vegetation is ideal for fresh, organic honey. Expanding the apiaries in these regions will grow our agricultural exports."
 BRA_tobacco_plantations: "Tobacco Plantations"
 BRA_tobacco_plantations_desc: "The south of our country has a number of tobacco plantations that have helped keep the regional economy afloat."
 BRA_expand_corn_production: "Expand Corn Production"
 BRA_expand_corn_production_desc: "Corn has become a pivotal crop in our economy. Expanding its production will help us diversify our agriculture."
 BRA_tea_plantations: "Tea Plantations"
 BRA_tea_plantations_desc: "Some regions have turned to tea because our climate suits it so well. We should follow that trend and expand commercial tea plantations."
 BRA_vineyard_expansions: "Vineyard Expansions"
 BRA_vineyard_expansions_desc: "Our vineyards in the rolling grasslands and along the coast produce some of the best grapes in the Western Hemisphere. The wine made from them is exported worldwide and sought after in many markets."
 # internal_factions
 BRA_help_the_farmers: "Help the Farmers"
 BRA_help_the_farmers_desc: "Farmers are a crucial part of our economy. We should help them stay in business and build our food self-sufficiency on their work."
 BRA_agrotech: "Invest in Agrotech"
 BRA_agrotech_desc: "Brazil is already among the world's largest exporters of soy, beef, and coffee, but much of our farmland still produces less than it could. Better machinery, seeds, and methods will raise yields, build up the farm economy, and win the loyalty of our farmers."
 BRA_agricultural_protectionism: "Agricultural Protectionism"
 BRA_agricultural_protectionism_desc: "Our agricultural industry underpins our food self-sufficiency, and we must protect it from foreign competition."
 BRA_free_trade_agro_producs: "Free Trade in Agricultural Products"
 BRA_free_trade_agro_producs_desc: "Foreign buyers want our soy, beef, and sugar, and our farmers can compete with anyone if the rules are fair. Dropping barriers on agricultural trade will win us export earnings and room for new farms and processing plants in Mato Grosso do Sul. Producers who cannot compete will not welcome it."
 BRA_agrarian_economy: "Agrarian Economy"
 BRA_agrarian_economy_desc: "Brazil was built on sugar, coffee, and cattle, and the land still carries much of our economy. Backing agriculture first will build farm districts faster, raise farm output and tax income, and win the loyalty of farmers and landowners."
 BRA_support_international_bankers: "Gather Support from International Bankers"
 BRA_support_international_bankers_desc: "Foreign banks and funds hold the capital that Brazilian growth depends on, and they watch our budget and our currency closely. Winning their confidence will bring foreign investment, and a new industrial complex will show them we mean business. If they trust us enough, it may lower the cost of our borrowing."
 BRA_help_business_owners: "Assist Business Owners"
 BRA_help_business_owners_desc: "From small shopkeepers in the interior to the big industrial groups of São Paulo, business owners create the jobs and pay the taxes that keep the country running. Helping them earns us their support and brings in more corporate tax income."
 BRA_support_industries: "Support Industrial Conglomerates"
 BRA_support_industries_desc: "Brazil is a big country, but not a very industrialized one. It is time to relight the fire of industrialization."
 BRA_further_industrialization: "Further Industrialization"
 BRA_further_industrialization_desc: "Brazil already makes cars, aircraft, steel, and ships, but our factories are still too few for a country of our size. Pushing industrialization further will bring new industrial complexes and skilled jobs, and it will make the big industrial groups our allies."
 #moreforeignpolicy
 BRA_the_way_we_judge: "The Way We Judge"
 BRA_the_way_we_judge_desc: "Before we decide how to treat the world, we must decide what kind of country we are. Do we turn inward and judge every foreign tie by what it costs us, or do we reach out and judge it by what it offers? Our answer will shape every policy that follows."
 BRA_isolationism: "Isolationism"
 BRA_isolationism_desc: "The world is a dangerous place, and every foreign entanglement is one more way for others to pull on our politics. A doctrine of isolationism will keep our forces and our diplomacy close to home and cut the sway foreign powers hold over us. We will have fewer friends abroad, but we will be freer to act alone."
 BRA_the_country_of_brotherly_love: "The Country of Brotherly Love"
 BRA_the_country_of_brotherly_love_desc: "Brazil is a country of many peoples that has long settled its disputes with its neighbors by treaty rather than by war. We will build on that record and make our diplomacy a force in its own right, offering friendship to all and standing against none."
 BRA_restrict_travelers: "Restrict Travelers"
 BRA_restrict_travelers_desc: "The flow of foreigners into our country has become a major problem. Tourism must be vetted and curbed, and travelers must be restricted from entering."
 BRA_shut_down_the_borders: "Shut Down the Borders"
 BRA_shut_down_the_borders_desc: "Another way to restrict the flow of people is to close our borders and increase the military presence along them."
 BRA_brazil_first: "Brazil First"
 BRA_brazil_first_desc: "Isolationism means our foreign policy answers to Brazilians alone. Our resources and our industry will serve our own people before any partner, and foreign interests will have less say at home."
 BRA_gunboat_diplomacy: "Gunboat Diplomacy"
 BRA_gunboat_diplomacy_desc: "Our neighbors make prime targets for expansion. Some of the smaller ones would be far better off integrated into our great country, by force if necessary."
 BRA_brazil_above_all: "Brazil Above All"
 BRA_brazil_above_all_desc: "Brazil comes before every other interest, at home and abroad, and we will say so loudly. By presenting our government and our country as one cause, we rally voters behind the ruling ideology and push foreign influence further out of our politics."
 BRA_the_international_mediator: "The International Mediator"
 BRA_the_international_mediator_desc: "The Federative Republic of Brazil holds a unique position in the world. We are one of the largest countries without a strong bias toward any side, and our place between East and West lets us understand both."
 BRA_strength_in_cooperation: "Strength in Cooperation"
 BRA_strength_in_cooperation_desc: "Brazil does not need to win every argument if it has the right friends in the room. Our Mercosur partners, our neighbors in the Amazon basin, and other emerging economies can give our voice more weight than any single treaty could. By building those ties, we turn goodwill into political capital."
 BRA_visit_every_country: "Visit Every Country"
 BRA_visit_every_country_desc: "Our president will travel to as many capitals as it takes, from our neighbors in the Americas to the far corners of Asia and Africa. Every handshake shows that Brazil wants to talk to everyone, and the pride Brazilians take in seeing their country welcomed abroad steadies us at home."
 BRA_support_the_little_guys: "Support the Little Guys"
 BRA_support_the_little_guys_desc: "Our first step is to stand up for the smaller nations. Guyana, Suriname, Paraguay, and Uruguay are neighbors that the great powers rarely notice, and Brazilian investment in their roads and ports will earn lasting goodwill and a bigger voice for us in their affairs."
 BRA_a_global_power: "A Global Power"
 BRA_a_global_power_desc: "Brazil is the largest country in Latin America and one of the largest economies in the world, yet it has no permanent voice on the UN Security Council. Germany, India, and Japan make the same argument, and standing with them gives our campaign for a permanent seat real weight."
 #military
 BRA_nosso_exercito: "Nosso Exército"
 BRA_nosso_exercito_desc: "Brazil's army is among the largest in Latin America, but it has long been short of money, modern equipment, and a clear plan. Taking stock of its shortcomings is the first step toward fixing them, and every other reform in the service builds on it."
 BRA_marinha_do_brasil: "Marinha do Brasil"
 BRA_marinha_do_brasil_desc: "Brazil has a vast coastline and a vast river network, and our navy does not yet cover them adequately."
 BRA_imbel: "IMBEL"
 BRA_imbel_desc: "Investing in IMBEL will help us keep growing the Brazilian defense industry. IMBEL is the Brazilian military's primary state-owned arms maker, and meeting the army's demand through it will benefit our army at large."
 BRA_amazonian_high_command: "Establish Amazonian Military High Command"
 BRA_amazonian_high_command_desc: "The Amazon rainforest offers hostile forces many ways in. An Amazonian Military High Command will let us coordinate with local law enforcement and disaster recovery, and direct anti-cartel operations."
 BRA_modern_artillery: "Modern Artillery"
 BRA_modern_artillery_desc: "We cannot abandon the old doctrines of massed artillery. Brazil must be self-sufficient and build its own modern guns."
 BRA_strength_on_land: "Strength on Land"
 BRA_strength_on_land_desc: "Brazil shares a border with nearly every other country in South America, and a serious threat would most likely reach us over land. A doctrine built around land power will teach our army to move and plan better across our rough and varied terrain."
 BRA_homemade_rifles: "Homemade Rifles"
 BRA_homemade_rifles_desc: "IMBEL already builds rifles and ammunition at home, and a country as large as ours should never depend on foreign suppliers for its infantry weapons. Simple, rugged designs that our own factories can turn out in quantity will keep our soldiers armed in any crisis and put our industry to work."
 BRA_western_military_factories: "Western Military Factories"
 BRA_western_military_factories_desc: "Mato Grosso and the western interior have open land and room to build, far from our crowded coast. New arms factories there will widen our military industry and spread defense jobs into regions that have seen little of them."
 BRA_northeastern_military_factories: "Northeastern Military Factories"
 BRA_northeastern_military_factories_desc: "Fortaleza and Recife are important cities on the northeastern coast. Arms factories there could support our expanding armed forces."
 BRA_national_drydocks: "National Drydocks"
 BRA_national_drydocks_desc: "A navy is only as strong as the yards that build and repair its ships, and ours are too few. A new dockyard in Ceará will give the fleet another place to build and refit its ships, and it will bring work to the maritime industry."
 BRA_sao_paulo_naval_industries: "São Paulo Naval Industries"
 BRA_sao_paulo_naval_industries_desc: "São Paulo has the deepest industrial base in Brazil and the port of Santos, the busiest in Latin America. A new dockyard there will let our shipbuilders draw on its steel, engineering, and workforce to build modern vessels."
 BRA_rio_drydocks: "Expand the Arsenal de Marinha"
 BRA_rio_drydocks_desc: "The Arsenal de Marinha in Guanabara Bay, Rio de Janeiro, is the main ship construction and maintenance yard for our navy and for friendly nations. Expanding its facilities will be a massive boon for our fleet and our allies and secure our naval dominance in the South Atlantic."
 BRA_behind_the_times: "Behind the Times"
 BRA_behind_the_times_desc: "Our ships are old, our doctrine is dated, and our officers have little recent experience at sea. A frank review of how far we have fallen behind, and cheaper access to modern naval doctrine, will give us a path toward becoming a real power in the Atlantic."
 BRA_underwater_flotilla: "Underwater Flotilla"
 BRA_underwater_flotilla_desc: "Our submarine force still relies on a handful of aging diesel boats. Submarines are the cheapest way for a middle power to threaten a stronger fleet, and a larger flotilla will help us watch over the South Atlantic. New boats will also cost us less to build."
 BRA_reform_the_navy: "Reform the Navy"
 BRA_reform_the_navy_desc: "The navy has struggled for decades with tight budgets, aging ships, and uneven training. A thorough reform, drawing on the lessons of other navies, will make our crews learn faster and our ships hit harder in every role, from screening to submarine warfare."
 # Military-army
 BRA_ee_11: "EE 11"
 BRA_ee_11_desc: "The Engesa EE-11 Urutu was once one of Brazil's best-known arms exports, but the design is old and our APC fleet needs replacing. A modern successor in the same line, built on that experience, will carry our infantry more safely, and research on armored personnel carriers will move faster."
 BRA_acquire_new_equipment: "Acquire New Equipment"
 BRA_acquire_new_equipment_desc: "Engesa once built the Cascavel and Urutu armored cars that Brazil sold across the world, and even a main battle tank of its own. Reviving its name as a tank maker and buying modern gear for the infantry will help our army catch up, and research on infantry equipment will move faster."
 BRA_update_the_ifvs: "Update the IFVs"
 BRA_update_the_ifvs_desc: "IFVs reduce our reliance on heavier equipment such as tanks and give our infantry light support. We must upgrade them to stay relevant as a military force in the new century."
 BRA_decentralized_warfare: "Decentralized Warfare"
 BRA_decentralized_warfare_desc: "Decentralized command lets smaller units respond quickly to changing conditions. Our army should model itself on the lean command structures of modern forces and meet our foes more efficiently."
 BRA_modern_armor: "Modern Armor"
 BRA_modern_armor_desc: "Our armored fleet is a generation behind. German designs set the standard in this field, and we should learn from them. Better tanks and faster research will make our armored units hit harder and take blows better on the plains of the south and the open interior."
 BRA_larger_artillery: "Larger Artillery"
 BRA_larger_artillery_desc: "Artillery has become less of a priority as SPGs have taken precedence. We should not, however, underestimate the effectiveness of a static gun."
 BRA_braco_forte_mao_amiga: "Braço Forte Mão Amiga"
 BRA_braco_forte_mao_amiga_desc: "Our army must project strength. We do not back down, and we do not bully. With a strong arm and a friendly hand, we will show our strength."
 #military-navy
 BRA_french_naval_studies: "French Naval Studies"
 BRA_french_naval_studies_desc: "France still has one of the world's stronger navies and has helped us in the past. We can learn from its teachings to improve our own ships."
 BRA_lets_go_nuclear: "Let's Go Nuclear"
 BRA_lets_go_nuclear_desc: "A nuclear-powered submarine can patrol our long Atlantic coast far longer than any diesel boat. With what we learned from French naval designs, we can pursue our own reactor and hull designs, and research on attack submarines will move faster."
 BRA_assault_carriers: "Assault Carriers"
 BRA_assault_carriers_desc: "Brazil has flown aircraft from carriers for decades, and a modern assault ship would let the navy and the marines put helicopters and troops ashore far from our own ports. Research on helicopter carriers will move faster, building on what our shipyards already know."
 BRA_usn_carriers: "USN Carriers"
 BRA_usn_carriers_desc: "The United States runs the largest and most experienced carrier fleet in the world, and learning from its designs and surplus hulls is the quickest way to put a modern flagship in our navy. Research on aircraft carriers will move faster, and our fleet will finally be able to project power far from the coast."
 BRA_juruena_class: "Juruena Class"
 BRA_juruena_class_desc: "The Juruena-class destroyers were UK-made vessels from the 1930s and 1940s, and capable all-purpose ships. We should remodel them and produce a new Juruena class."
 BRA_modern_frigate: "Modern Frigate"
 BRA_modern_frigate_desc: "Frigates do much of the real work of a modern navy: escorting convoys, hunting submarines, and guarding our sea lanes. Our old destroyer hulls gave us a start, and now we need a modern frigate of our own. Research on frigates will move faster."
 BRA_protegendo_nossas_riquezas: "Protegendo Nossas Riquezas"
 BRA_protegendo_nossas_riquezas_desc: "Our offshore waters hold the pre-salt oilfields and the sea lanes that carry most of our trade. The navy calls this area the Blue Amazon, and it must be able to guard it. With modern frigates and carriers in service, it can now train and fight as one fleet."
 #military-air forces
 BRA_air_force_expansion: "Air Force Expansion"
 BRA_air_force_expansion_desc: "A country as large as ours needs an air force that can cover the Amazon, the coast, and the southern border. Embraer already shows that Brazil can build aircraft the world will buy, and with the army and navy reformed it is the air arm's turn. We will start with the air bases it flies from."
 BRA_invest_in_heli: "Invest in Helicopters"
 BRA_invest_in_heli_desc: "Brazil's rivers, jungles, and mountains have few roads, and helicopters can reach places that trucks cannot. Helibras already builds helicopters at home in Minas Gerais, and better transport aircraft will carry air assault troops and supplies into the interior quickly. Research on helicopters will move faster."
 BRA_carrier_planes: "Planes for Aircraft Carriers"
 BRA_carrier_planes_desc: "Our carriers remain under-equipped for modern naval warfare. We must improve our air arm to better protect our lands, waters, and airspace."
 BRA_cas_research: "CAS Research"
 BRA_cas_research_desc: "Embraer's Super Tucano was built to patrol the Amazon, where slow, tough aircraft can hunt smugglers' planes and support troops on the ground. Research into better air-to-ground weapons will make it and our new helicopters far more useful to the troops fighting below."
 BRA_maritime_routine: "Maritime Routine"
 BRA_maritime_routine_desc: "Our long coastline and offshore oil platforms can only be watched from the air. Long-range patrol aircraft that can also carry bombs will find intruders and smugglers far out at sea, and research on heavy aircraft will move faster."
 BRA_mr_fighters: "Multirole Fighters"
 BRA_mr_fighters_desc: "Multirole fighters are jacks of all trades. They may not excel at any one task, but they remain valuable tools for our armed forces."
 BRA_light_fighters: "Light Fighters"
 BRA_light_fighters_desc: "Light fighters can provide reconnaissance and light fire support for our troops, and they can help intercept incoming bombers."
 BRA_air_trained_pilots: "Air Trained Pilots"
 BRA_air_trained_pilots_desc: "Simulators and classroom hours cannot replace time in the cockpit. More live flying hours will sharpen our pilots and make our fighters and medium aircraft more agile in combat."
 #Brazilian Space Focuses
 BRA_brazilian_space_program: "Brazilian Space Program"
 BRA_brazilian_space_program_desc: "The Brazilian Space Program (PEB) covers launch vehicle development, satellite production, and space exploration in Brazil. The Brazilian Space Agency (AEB) has coordinated it since 1994."
 BRA_cooperate_with_nasa: "Cooperate with NASA"
 BRA_cooperate_with_nasa_desc: "Brazil has worked with NASA for years, and Marcos Pontes, our first astronaut, trained with its crews. Formal cooperation will give our engineers access to American know-how, and research on satellites and navigation satellites will move faster."
 BRA_create_launchpads: "Create New Launchpads"
 BRA_create_launchpads_desc: "Rockets launched near the equator gain extra speed from the Earth's rotation, which makes reaching orbit much easier. Our location is perfect for great launchpads."
 BRA_first_time_in_the_moon: "First Time on the Moon"
 BRA_first_time_in_the_moon_desc: "The Moon landings made the Americans the heroes of a generation, and Brazil is ready to share the stage. A lunar mission is costly and risky, but the sight of a Brazilian flag on the surface will rally the nation behind us."
 BRA_a_mission_to_mars: "A Mission to Mars"
 BRA_a_mission_to_mars_desc: "No human has set foot on Mars, and the first nation to do it will be remembered for centuries. Preparing a crewed mission will push our engineers to develop new rockets and life-support systems, and the research that follows will speed up our science at home."
 BRA_brazilian_space: "Brazilian Space"
 BRA_brazilian_space_desc: "Our supremacy in space brings us international recognition and prestige, and our continuing space missions are advancing many fields of research."
 BRA_mining_in_space: "Mining in Space"
 BRA_mining_in_space_desc: "Brazil already has vast resources, but asteroids hold metals that no country will ever have enough of. Our space program can begin to reach them, and the first deliveries will add to the steel, aluminum, and tungsten mined in São Paulo and Ceará."
 #Cardoso Final Days
 BRA_cardosos_last_years: "Cardoso's Final Economic Policies"
 BRA_cardosos_last_years_desc: "Cardoso has a final set of socioeconomic policies to implement before his term ends. His presidency has been riddled with problems inherited from his predecessors and with an unstable global economy. He must now carry us into the new millennium."
 BRA_amazonian_development_project: "Amazonian Development Project"
 BRA_amazonian_development_project_desc: "Businesses from across Brazil are preparing to present the \"Amazonian Development Project\", which aims to develop the Amazon rainforest. It could mean anything from light rail clearing to heavy industrial mining. At the very least, we should consider their offer."
 BRA_project_devastate_the_amazon: "Amazonian Devastation Project"
 BRA_project_devastate_the_amazon_desc: "Another project is circulating through the halls of government. It would devastate the Amazon but improve our economy. What are we to do?"
 BRA_march_of_the_excluded: "March of the Excluded"
 BRA_march_of_the_excluded_desc: "Indigenous protests have marred the 500th anniversary of Brazil. Marchers have taken to the streets to condemn an establishment that has failed to support those who were here first."
 BRA_native_protests: "Native Protests"
 BRA_native_protests_desc: "Protests by indigenous peoples keep forcing our colonial history back into view. We could treat this as an opportunity to crack down and build up our police forces."
 BRA_angry_natives: "Angry Natives"
 BRA_angry_natives_desc: "Cardoso's policies on land demarcation have left the native peoples unhappy with the government."
 BRA_reinstating_imf_debts: "Reinstating IMF Debts"
 BRA_reinstating_imf_debts_desc: "The global economy has taken a turn for the worse, public debt is rising, and we are running out of options. The IMF rescue package, signed just months before Lula's election, now has to be addressed."
 BRA_a_modern_recession: "A Modern Recession"
 BRA_a_modern_recession_desc: "Our economy has suffered at the turn of the century. The Asian crisis, public debt, and other factors have left the country struggling. Targeted economic adjustments and talks with our political constituencies can help stabilize the situation."
 BRA_foreign_assist: "Seek Foreign Assistance"
 BRA_foreign_assist_desc: "We can ask the United States to help ease our mounting debt. American private investors hold a large portion of our public debt in bonds, and through an exchange or an act of goodwill, Washington may be willing to buy it back and spare us from being further entrapped by the IMF package."
 BRA_deficit_spending: "Deficit Spending"
 BRA_deficit_spending_desc: "The only way out of a recession this deep is to spend heavily to keep ourselves afloat. We can issue additional bonds to the people to fund it."
 BRA_crippled_currency: "Reevaluate Our Crippled Currency"
 BRA_crippled_currency_desc: "Our policies have slowly eased the financial crisis and the damage to our currency. We should stay the course and resolve it before more problems spring from the weak real."
 #Amazon Protection
 BRA_logging_reform: "Logging Reforms"
 BRA_logging_reform_desc: "It is time to impose stronger regulations on our logging industry. The Amazon urgently needs protection, because the current loss of acreage far exceeds what the rainforest can sustain."
 BRA_preserve_amazon: "Operation Preserve the Amazon"
 BRA_preserve_amazon_desc: "We must set up regulatory protections, tougher punishment, and greater policing in the Amazon to prevent any further devastation."

 ###New FT
 #The New Coalition
 BRA_new_coalition: "The New Coalition"
 BRA_new_coalition_desc: "The Brazilian left has one advantage over the nationalists: it is more united. To press that advantage, we must build a coalition."
 BRA_parties_of_the_people: "Parties of the People"
 BRA_parties_of_the_people_desc: "No government survives widespread disapproval. Our previous government had very low approval and ended in impeachment."
 BRA_anti_rw_rhetoric: "Anti-Right-Wing Rhetoric"
 BRA_anti_rw_rhetoric_desc: "Right-wing movements have grown fast on public anger at the left, and each month they gain ground. A steady campaign that exposes their record and their allies will cut into their support and break the wave of nationalism that has been building against us."
 BRA_strenghten_coalition: "Strengthen the Coalition"
 BRA_strenghten_coalition_desc: "A coalition is only as strong as its members' discipline. Sharing posts and credit fairly among the parties of the left will keep them working together and bring more voters into the camp, which steadies the government and widens the left's hold on power."
 BRA_new_brazil: "A New Brazil"
 BRA_new_brazil_desc: "Years of left-wing government have changed the country. The coalition we built now governs as one. Nationalism finds it harder to take root, and our supporters stand more firmly behind the cause."
 #PT Hegemony
 BRA_mst: "MST"
 BRA_mst_desc: "The Landless Workers' Movement (MST, \"Movimento dos Trabalhadores Rurais Sem Terra\") fights for agrarian reform, since much of Brazil's arable land lies abandoned or unused."
 BRA_absorb_left_wing: "Absorb Left-Wing Parties"
 BRA_absorb_left_wing_desc: "Absorbing the other left-wing parties, such as PSOL and PCdoB, will secure our popularity and our hold on Brazil."
 BRA_lulismo: "Lulismo"
 BRA_lulismo_desc: "Lulismo describes the consolidation, around 2006, of groups once hostile to social movements and the Workers' Party behind the political forces led by Luiz Inácio Lula da Silva. It combines controlled reformism and limited structural change with a focus on the poorest Brazilians."
 BRA_the_pheonix_reborn: "The Phoenix Reborn"
 BRA_the_pheonix_reborn_desc: "The Workers' Party has survived its scandals and returned with new leaders, new allies, and new goals. A rebuilt party can finally deal with Globo, the network that has fought it for so long, and win a friendlier hearing for our government."
 #Left Wing Tree
 BRA_pro_workers: "Pro-Workers"
 BRA_pro_workers_desc: "The party was born in the metalworkers' unions of São Paulo's industrial belt, and workers remain its heart. Laws and programs that serve them will keep the unions on our side and make good on the party's oldest promise."
 BRA_popular_government: "Popular Government"
 BRA_popular_government_desc: "A government with popular support can do all it sets out to do, because the people stand behind our actions and decisions."
 BRA_crush_psdb: "Crush the PSDB"
 BRA_crush_psdb_desc: "For years every presidential election has come down to the PT against the PSDB. A government that means to rule for decades cannot tolerate a rival with a national organization, so we will break the party and cost the liberal democrats much of their popularity."
 BRA_bring_back_dilma: "Bring Back Dilma"
 BRA_bring_back_dilma_desc: "Dilma Rousseff, an economist and member of the Workers' Party, served as the 36th president of Brazil from 2011 until her removal by impeachment in 2016. It is time to bring her back."
 BRA_appease_south_american_socialists: "Appease South American Socialists"
 BRA_appease_south_american_socialists_desc: "Venezuela is the main bastion of South American socialism, and we must align with it to secure our mutual success."
 BRA_industrialization_help_from_china: "Industrialization Help from China"
 BRA_industrialization_help_from_china_desc: "China has the factories, the capital, and the engineers to help us catch up. Chinese partnerships will bring new industrial complexes to Minas Gerais and Amazonas and speed up growth, and in return we will grow closer to Beijing. The building will take a toll on the Amazon."
 BRA_new_communist_government: "New Communist Government"
 BRA_new_communist_government_desc: "With Chinese help on industry, friendly socialist neighbors, and Dilma Rousseff's return, our government can finally take its full form. A new communist government will give Brazil a state built on its own terms and secure our standing as a major power, and it should help win over the native peoples who still distrust the state."
 BRA_five_year_plan: "Five-Year Plans"
 BRA_five_year_plan_desc: "The free-market models of the Western states are not the future of a socialist state. A planned economy, preferably in the form of classic Soviet-style five-year plans, will give the government control over a previously unchecked economy."
 BRA_the_corruption_question: "End Corruption"
 BRA_the_corruption_question_desc: "Scandals from the mensalão to Car Wash have convinced many voters that the left cannot be trusted with public money. A thorough audit of the state, even inside our own ranks, will bring the hidden graft to light and restore faith in a socialist government that serves the people."
 BRA_empower_the_government: "Empower the Government"
 BRA_empower_the_government_desc: "A state that runs on favors can reward its loyalists and punish its enemies without waiting on the courts. We will let corruption serve us instead of fighting it, and accept that the state will grow more corrupt as a result."
 BRA_better_sus: "Improve the SUS"
 BRA_better_sus_desc: "The Unified Health System (SUS) promises free care to every Brazilian, but long waits, empty pharmacies, and too few doctors outside the big cities keep many from using it. More money and better management will bring care closer to the people, and a healthier country is a steadier one."
 BRA_align_unions: "Support the Unions"
 BRA_align_unions_desc: "Simply saying one supports the unions is one thing. It is another to actively support them at the cost of one's reputation."
 BRA_aid_the_poor: "Aid the Poor"
 BRA_aid_the_poor_desc: "Poverty has plagued Brazil since independence, and it is time to address it. Aid to the poor will also win us more support."
 BRA_left_wing_education: "Left-Wing Education"
 BRA_left_wing_education_desc: "By shaping our students' views, we can build support over time and secure our rule without the risk of revolt."
 BRA_ban_nationalists: "Ban the Nationalists"
 BRA_ban_nationalists_desc: "Nationalist parties, from the Bolsonaro movement to the older far right, stand for everything our state opposes. Banning their organizations and rallies will leave them with little public support and clear the field for our own programs."
 BRA_socialist_market: "Socialist Market"
 BRA_socialist_market_desc: "Strict planning on its own leaves little room for private business. China has shown that a party can keep the commanding heights of the economy while letting industrial groups and small firms trade under its watch. We will take the same road and pull that energy into our plan."
 BRA_state_industries: "State Industries"
 BRA_state_industries_desc: "Plants owned by foreigners are always a security risk. If foreign countries threaten us with sanctions, their owners could leave overnight and take vital parts of the plants with them. To prevent that, we must seize these industries for the state, even if it offends foreign governments."
 BRA_break_banks: "Break the Banks"
 BRA_break_banks_desc: "Bradesco? Banco do Brasil? Santander? Itaú? These leeches will feel the pain they inflict on the working class. We will end their destructive influence."
 BRA_foro_de_sp: "Foro de São Paulo"
 BRA_foro_de_sp_desc: "The Foro de São Paulo (São Paulo Forum) is a conference of leftist parties and organizations from Latin America and the Caribbean. It began when the Workers' Party approached other parties and movements in the region to debate the international scene and the consequences of neoliberal policies."
 BRA_influence_our_neighbors: "Influence Our Neighbors"
 BRA_influence_our_neighbors_desc: "The Foro de São Paulo gave the left of the continent a place to coordinate, and our own socialist state can now lend its weight to that work. Sister parties across South America will find a friend in Brasília, and left-wing neighbors are neighbors we need not fear."
 #Car Wash
 BRA_op_car_wash: "Operation Car Wash"
 BRA_op_car_wash_desc: "The case takes its name from a Brasília gas station whose car wash laundered cash for black-market money changers. Federal Police in Curitiba have followed that cash to the dealer Alberto Youssef, and from him to Petrobras."
 BRA_odebrecht_corruption: "Follow the Odebrecht Contracts"
 BRA_odebrecht_corruption_desc: "Odebrecht, Latin America's largest builder, ran an entire department to manage its bribes. Its contracts reach from Lima to Bogotá, and prosecutors there will want to see what we find."
 BRA_petrobras_indictment: "Audit Petrobras Contracts"
 BRA_petrobras_indictment_desc: "Alberto Youssef bought a Land Rover for Paulo Roberto Costa, then Petrobras's director of supply. Prosecutors want to know what else the gift paid for, starting with every contract Costa approved."
 BRA_searchandseizure: "Search and Seizure"
 BRA_searchandseizure_desc: "Search and seizure warrants will let us secure critical evidence. With so many companies and people implicated, the scale of the arrests may shock the public."
 BRA_anti_corruption_measures: "Anti-Corruption Measures"
 BRA_anti_corruption_measures_desc: "The Federal Public Ministry (MPF) launched a campaign to rally Congress behind ten measures against corruption. They could greatly reduce corruption in our country."
 BRA_parties_of_the_left: "Parties of the Left"
 BRA_parties_of_the_left_desc: "Our previous governments achieved a great deal, and the left cannot afford to waste it on infighting. A standing alliance of the parties of the left will keep our program alive and help us hold the government, though bargaining among so many partners will slow every decision."
 BRA_psl_growth: "Rise of the PSL"
 BRA_psl_growth_desc: "Bolsonaro's popularity keeps growing, and his party, the PSL, is growing fast with it, especially in the run-up to the elections."
 BRA_acquit_pmdb: "Acquit MDB"
 BRA_acquit_pmdb_desc: "The Brazilian Democratic Movement (MDB), formerly the PMDB, is a centrist party and one of the largest in Brazil, with huge influence in the Chamber of Deputies, the Senate, and many other political bodies. Aligning with it could bring us some benefits."
 BRA_acquit_workers_party: "Acquit the Workers' Party"
 BRA_acquit_workers_party_desc: "The Workers' Party (PT) is a left-wing party. It has little support among the Centrão but a great deal of popular support across the country."
 BRA_the_new_elections: "The New Elections"
 BRA_the_new_elections_desc: "Car Wash has discredited the old parties, and voters want someone who was never part of the deal. The next presidential election will be a three-way fight."
 BRA_rw_populist: "Right-Wing Populism"
 BRA_rw_populist_desc: "After the arrests and mistakes of the Brazilian left, voters are looking across the aisle to parties such as the PSL."
 BRA_pt_pmdb_coop: "PT-MDB Cooperation"
 BRA_pt_pmdb_coop_desc: "The MDB is a centrist party with huge influence in the Centrão. Our relations with the Centrão are poor for now, but support from the MDB can change that."
 BRA_pt_hegemony: "PT Hegemony"
 BRA_pt_hegemony_desc: "The Workers' Party has won again, with a base that runs from the Northeast to the factories of São Paulo. Using that strength to build alliances and place loyal people in key posts will make the party the center of Brazilian politics for years to come."
 BRA_rise_electoral_media: "Rise of Electoral Media"
 BRA_rise_electoral_media_desc: "[BRA.GetLeader] has huge support on social media, especially on Twitter. Hashtags backing the president are everywhere."
 BRA_populist_wave: "Populist Wave"
 BRA_populist_wave_desc: "The PSL's election victory sparked a populist wave, with support for its new administration stretching from Acre to Rio Grande do Sul."
 BRA_christian_democracy: "Christian Democracy"
 BRA_christian_democracy_desc: "Brazilians want to preserve traditional, Christian values. To do that, we must build a more Christian democracy."
 #PSDB-PDT 2018 Branch
 BRA_restoration_image: "Restore the Image"
 BRA_restoration_image_desc: "Since Cardoso left office, the PSDB has lost voters, leaders, and its sense of purpose. A new image built on competence and the party's social democratic roots can win some of them back and take the wind out of the nationalists' sails."
 BRA_underdog: "Underdog Effect"
 BRA_underdog_desc: "The underdog appeals to many: we fight without knowing whether we will win, but because we believe in something worth fighting for. Like a cornered fox, we will march on."
 BRA_social_democracy: "Brazilian Social Democracy"
 BRA_social_democracy_desc: "Social democracy is a broad spectrum of left-wing ideologies that espouse economic and social justice more strongly than most branches of liberalism. Social democrats seek to humanize capitalism, curb inequality and oppression, and foster democracy. Our people love the social democratic system, and we should adopt it."
 BRA_liberal_resurgence: "Liberal Resurgence"
 BRA_liberal_resurgence_desc: "Liberalism is a centrist ideology that promotes individual rights and stresses freedom over the expansion of state power. Liberals tend to support progressive social policies within a free market and free trade with the world. Brazilians are growing more liberal, and we will become a liberal government in favor of the people."
 BRA_reduce_debts: "Reduce Our Debt"
 BRA_reduce_debts_desc: "Interest payments eat a large share of the budget, and every real we owe is one we cannot spend at home. Paying down our debt will spare future governments the burden and win the party credit for sound money, though the treasury will feel the sting right away."
 BRA_foreign_buyouts: "Seek Foreign Buyouts"
 BRA_foreign_buyouts_desc: "Foreign firms and banks are eager to buy into Brazilian companies, and the capital they bring will fund new plants in São Paulo's industrial belt. Welcoming them also earns goodwill with the international bankers, whose confidence the real depends on."
 BRA_ciro_gomes: "Ciro Gomes Endorses Us"
 BRA_ciro_gomes_desc: "Ciro Gomes is a center-left politician, lawyer, and academic from the northeastern state of Ceará. He ran for president in 1998, 2002, and 2018, and he now belongs to the Democratic Labour Party (PDT). He is offering us his support."
 BRA_agrarian_reform: "Agrarian Reform"
 BRA_agrarian_reform_desc: "A handful of landowners hold most of our farmland, leaving small farmers no room to grow. Agrarian reform will end that long-standing injustice."
 BRA_social_programs: "Social Programs"
 BRA_social_programs_desc: "Ciro Gomes and the PDT stand for a state that looks after those at the bottom. With his endorsement behind us, we can fund programs that put that idea into practice, and win the trust of organized labor along the way."
 BRA_cardoso_legacy: "Cardoso's Legacy"
 BRA_cardoso_legacy_desc: "Fernando Henrique Cardoso, known as FHC, tamed inflation with the Real Plan and then served two terms as president. We will govern by the same rules of sound money and open markets, and the party's voters will remember who built them."
 BRA_psdb_pdt_coalition: "PSDB-PDT Coalition"
 BRA_psdb_pdt_coalition_desc: "The PSDB has been a truly social-democratic party in recent years. By aligning with other parties, such as the PDT, we can fulfill all our interests."
 BRA_rise_of_moderates: "Rise of Moderates"
 BRA_rise_of_moderates_desc: "Centrists and moderates across the spectrum are tired of polarized politics and want a government they can trust. Their support strengthens our democratic camp and gives us the standing to found a faction of our own."
 BRA_align_with_other_parties: "Create a New Coalition"
 BRA_align_with_other_parties_desc: "We cannot rule Brazil alone. We should govern with other parties, especially those that share our interests. Which party will we choose?"
 BRA_business_deregulation: "Pro-Business Deregulation"
 BRA_business_deregulation_desc: "Pro-business deregulation is the best option for international investors and entrepreneurs, and it should create more jobs."
 BRA_fight_corruption: "Fight Corruption in Our Party"
 BRA_fight_corruption_desc: "The PSDB has a reputation as a party full of corrupt politicians. We must fight corruption for our country's sake."
 BRA_seek_young_vote: "Seek the Youth Vote"
 BRA_seek_young_vote_desc: "Young Brazilians are online, restless, and unconvinced by old party labels. Campaigning at universities and on social media with a message of competence and reform will bring many of them to the PSDB, and the party that wins them early can govern for decades."
 BRA_industrial_congolmerates: "Industrial Conglomerates"
 BRA_industrial_congolmerates_desc: "Brazil is a big country, but not a very industrialized one. It is time to relight the fire of industrialization."
 BRA_revitalize_economy: "Revitalize the Economy"
 BRA_revitalize_economy_desc: "Cheaper credit and less red tape for small and medium businesses will raise productivity and put the economy back on its feet."
 BRA_healthcare_reforms: "Healthcare Reforms"
 BRA_healthcare_reforms_desc: "Too many Brazilians still wait months for a specialist or travel hundreds of kilometers to a clinic. Reforming how the SUS spends its money and staffs its clinics will bring care closer to people and give our government a mandate for wider reform."
 BRA_support_from_the_us: "Support from the USA"
 BRA_support_from_the_us_desc: "Liberal democracies stand together, and Washington has long been our natural partner among them. Winning American backing will bring us a security guarantee and, if American opinion of us is high enough, the status of a Major Non-NATO Ally."
 BRA_embrace_free_market: "Embrace the Free Market"
 BRA_embrace_free_market_desc: "By following the example of countries like the United States in privatizing companies and industries, we can improve our economy."
 BRA_bastion_of_liberty: "Bastion of Liberty"
 BRA_bastion_of_liberty_desc: "With the free market embraced and Washington and Brussels behind us, Brazil can stand as the largest democracy in Latin America and a leading voice for liberty in the world. Our new standing will bring recognition as a major power and, we hope, the trust of the native peoples who have felt left out."
 BRA_education_reforms: "Education Reforms"
 BRA_education_reforms_desc: "Brazilian students trail their peers in other large economies, and too many leave school before they can read well. New curricula, better pay for teachers, and wider access to university will raise results over the coming decade and earn the gratitude of parents."
 BRA_pre_campaigning: "Pre-Campaigning"
 BRA_pre_campaigning_desc: "Elections are won in the months before the vote. Rallies, television spots, and a leader who is seen traveling the country will make our candidate a familiar face long before the ballots are printed."
 BRA_alliances_with_unions: "Alliances with the Unions"
 BRA_alliances_with_unions_desc: "Brazil's union federations, the CUT and Força Sindical among them, speak for millions of workers and can bring them out in support or in protest. A formal alliance will secure their backing and that of the activists around them, and it will steady the labor front."
 BRA_support_from_the_eu: "Support from the EU"
 BRA_support_from_the_eu_desc: "EU countries have been thriving through social democracy for years. It is only logical for us to develop good relationships with fellow social democrats."
 # Bolsonaro
 BRA_rise_of_bolsonaro: "Rise of Bolsonaro"
 BRA_rise_of_bolsonaro_desc: "Once a backbench congressman with no filter on his controversial opinions, Jair Bolsonaro is now president of Brazil."
 BRA_brazilian_diplomacy: "Brazilian Diplomacy"
 BRA_brazilian_diplomacy_desc: "Brazil has a strong multilateral diplomatic tradition, yet many assume we are a \"diplomatic dwarf\" with no say on the international stage. Putting Ernesto Araújo in charge of the Foreign Ministry is part of the PSL administration's push to steer our foreign policy in a new direction."
 BRA_ensure_military_support: "Ensure Military Support"
 BRA_ensure_military_support_desc: "[BRA.GetLeader] has a strong support base in the military. Leveraging this support is vital to maintain our political base."
 BRA_allow_access_to_guns: "Allow Access to Guns"
 BRA_allow_access_to_guns_desc: "One of Bolsonaro's main projects was to restore access to guns, as in the United States, a right that was curtailed in 2003 under former president Lula."
 BRA_fight_foreign_influence: "Fight Foreign Influence"
 BRA_fight_foreign_influence_desc: "A weak state leaves Brazil exposed to foreign governments, NGOs, and corporations that have too much say in our politics and our media. We will tighten oversight of outside money and give Brazilians back control of Brazil's decisions."
 BRA_no_ideology: "'No Ideology' Foreign Policy"
 BRA_no_ideology_desc: "Enough with our foreign policy being dictated by the previous government's left-wing ideology. We will break from it and find our own path."
 BRA_improve_mil_conditions: "Improve Military Conditions"
 BRA_improve_mil_conditions_desc: "A popular myth holds that Brazil has ammunition for only two hours of battle. Outsiders see our military as shoddy. We must take measures to restore confidence in its capacity."
 BRA_increase_mil_budget: "Increase Military Budget"
 BRA_increase_mil_budget_desc: "By raising the share of the state budget allocated to the military, our Defense Ministry could radically reshape our armed forces."
 BRA_court_evangelicals: "Court the Evangelical Church"
 BRA_court_evangelicals_desc: "Evangelical churches have several members in Congress and are rapidly gaining influence in Brazil. By courting them, we will secure a strong religious base."
 BRA_call_paulo_guedes: "Call Paulo Guedes"
 BRA_call_paulo_guedes_desc: "Paulo Guedes is a Chicago-trained economist with a monetarist agenda of tight budgets and privatizations. He is also a great supporter of Bolsonaro, and some say he is the economist version of him."
 BRA_insult_usa: "Insult the Americans"
 BRA_insult_usa_desc: "The Americans backed the 1964 coup, constantly meddle in our affairs, and promote a globalist agenda. Enough of them."
 BRA_insult_china: "Nationalize Chinese Corporations"
 BRA_insult_china_desc: "Chinese firms are encroaching on our country by buying stakes in our energy sector and building companies here. We must buy back their shares by force of law and push these communists out."
 BRA_insult_europe: "Insult European Leaders on Twitter"
 BRA_insult_europe_desc: "Bolsonaro's Twitter use is famously colorful. In 2019 alone he insulted the French, the Germans, and the Swedes, to name only a few."
 BRA_crackdown_south_american_socialists: "Crack Down on South American Socialists"
 BRA_crackdown_south_american_socialists_desc: "South American socialist regimes, such as Venezuela and Bolivia, have always been a problem for Brazil and for their own people. It is time to \"liberate\" South America from communism."
 BRA_the_caribbean_menace: "The Caribbean Menace"
 BRA_the_caribbean_menace_desc: "Cuba has menaced the Americas since its revolution, influencing not only Brazil but all of South America. It is time to save the Cuban people."
 BRA_new_domestic_identity: "New Domestic Identity"
 BRA_new_domestic_identity_desc: "With foreign influence curbed and the socialist regimes of the region pushed back, we can build a national identity on our own terms and free from globalism. A confident Brazil can lead an alliance of its own instead of joining someone else's, and we are now free to found one."
 BRA_court_usa: "Ensure American Support"
 BRA_court_usa_desc: "Our government sees Washington as its natural ally and wants the strongest partnership it can build. Warm ties will bring us an American security guarantee and, if American opinion of us is high enough, the status of a Major Non-NATO Ally, and closer scientific links will help our researchers."
 BRA_court_israel: "Court Israel"
 BRA_court_israel_desc: "Previous leftist governments frequently sided with Arab nations and Iran on questions concerning the Middle East. By moving our embassy to Jerusalem, we will send a strong message of support for Israel."
 BRA_talks_with_china: "Closer Alignment with the BRICS"
 BRA_talks_with_china_desc: "China has significant commercial influence in Brazil, and we have worked closely with the BRICS in recent years. We should align with them again."
 BRA_our_south_american_allies: "Our South American Allies"
 BRA_our_south_american_allies_desc: "South America has many leftist governments, but it also has conservative and liberal countries, like Argentina and Paraguay. We should draw closer to them."
 BRA_be_friend_european_conservatives: "Closer Alignment with European Conservatives"
 BRA_be_friend_european_conservatives_desc: "Many European countries lean conservative, such as Poland and Germany. We will build new friendships with them."
 BRA_invite_nationalists: "Invite Far-Right Leaders to Brazil"
 BRA_invite_nationalists_desc: "We should invite far-right leaders to a summit and discuss how to align our goals against globalist liberals and communists."
 BRA_modernization_equipment: "Modernization of Equipment"
 BRA_modernization_equipment_desc: "The Army, Navy, and Air Force all need modern equipment. We should invest in national military technology and import new aircraft and weapons."
 BRA_harsher_conscription: "Harsher Conscription"
 BRA_harsher_conscription_desc: "Every 18-year-old must enlist for a mandatory year of service, yet only a small share stay on after their contract ends. We must find ways to raise the retention rate, even if the conscripts mostly rake fields all day."
 BRA_volunteer_reformation: "Volunteer Reformation"
 BRA_volunteer_reformation_desc: "We should build a more professional military and raise the number of volunteers through propaganda, better wages, career prospects, and privileges."
 BRA_abundant_force: "Abundant Force"
 BRA_abundant_force_desc: "Our military must rival all the other South American armies combined. Its sheer strength will deter any foreign invasion."
 BRA_dealing_with_congress: "Dealing with Congress"
 BRA_dealing_with_congress_desc: "The Brazilian Congress is ineffective and corrupt. We must act to either turn it to our advantage or destroy it."
 BRA_bolsokids_position: "Put Bolsonaro's Sons in High Positions"
 BRA_bolsokids_position_desc: "Eduardo and Carlos Bolsonaro, two legislators from Rio, are sons of Jair Bolsonaro. Placing them in high-profile positions will secure our control of Congress and the cabinet."
 BRA_eduardobolsonaro: "Eduardo Bolsonaro as US Ambassador"
 BRA_eduardobolsonaro_desc: "Eduardo travels to the United States often and lived there for a few years. As our diplomat in Washington, he can strengthen our position abroad."
 BRA_rally_far_right: "Rally the Far Right"
 BRA_rally_far_right_desc: "Enough of the corrupt \"centrists\" in Congress. We must gather every far-right-leaning congressman into a single bloc and push the Centrão out."
 BRA_assign_military_cabinet: "Assign the Military to the Cabinet"
 BRA_assign_military_cabinet_desc: "Enough of civilian legislators and \"specialists\" in the cabinet. We must bring in strong, wise military men to guide the country with an iron fist."
 BRA_attack_press: "Attack Press Freedom"
 BRA_attack_press_desc: "The Globo Network is the country's largest news and broadcasting organization and one of [BRA.GetLeader]'s greatest critics. By revoking Globo's TV and radio licenses, we will teach it a lesson about loyalty."
 BRA_rally_military: "Rally the Military"
 BRA_rally_military_desc: "Congress is corrupt, divided, and slow, and the generals have never forgotten that they once ran the country. Rallying the barracks and their supporters behind us will lift the military-backed faction in politics, but it unsettles a country that still remembers the dictatorship."
 BRA_auto_coup: "Auto-Coup"
 BRA_auto_coup_desc: "[BRA.GetLeader] has carried out a coup d'état against his own parliament and now rules by decree. A new congress will be formed with members of the military, in a two-party system similar to that of the \"years of lead\"."
 BRA_defund_progressive_policies: "Defund Progressive Policies"
 BRA_defund_progressive_policies_desc: "Progressive social policies on minorities and LGBT issues are extremely unpopular among Evangelicals, who see them as an attack on Brazil's families. To court the Evangelical clergy further, we must remove the social policies enacted by previous governments."
 BRA_assign_evangelical_judge: "Assign an Evangelical Judge to the STF"
 BRA_assign_evangelical_judge_desc: "To set the government's pro-Evangelical policies in stone, [BRA.GetLeader] will appoint a \"terribly evangelical\" justice to the Supreme Federal Court to block any ruling that might curb the interests of the clergy."
 BRA_socialsecurity_reform: "Social Security Reform"
 BRA_socialsecurity_reform_desc: "Brazil's pension system is broken, and everyone knows it. If nothing changes, social security and other mandatory payments will consume more than 60% of the state budget, leaving no room for investments such as education and health. Paulo Guedes proposed a reform that, though unpopular, will tackle the system's structural problems."
 BRA_tax_reform: "Tax Reform"
 BRA_tax_reform_desc: "Taxes in Brazil are extremely byzantine. There are four different VAT rates for different sectors of the economy, not counting state VAT, and the tax code is so complicated that printing it would take a book the size of a family car. To boost growth and attract foreign investment, we must simplify our tax code completely."
 BRA_privatize_national_companies: "Privatize Nationalized Companies"
 BRA_privatize_national_companies_desc: "Brazil is mostly a market economy, but much of its industry, especially in the energy sector, is still state-owned. We must begin a new round of privatization talks and open our markets to new entrants."
 BRA_mining_amazon: "Mining in the Amazon"
 BRA_mining_amazon_desc: "The Amazon has vast, untouched mineral and oil deposits in natural reserves. We should pass legislation allowing the economic exploitation of those areas."
 BRA_glorify_1964_coup: "Glorify the 1964 Coup"
 BRA_glorify_1964_coup_desc: "The Brazilian military dictatorship, sometimes called the Fifth Brazilian Republic, was established on April 1, 1964, and lasted until March 15, 1985, under successive military governments. Authoritarian and nationalist in character, it began with the coup that overthrew João Goulart's government."
 BRA_brazilian_hypernationalism: "Brazilian Hypernationalism"
 BRA_brazilian_hypernationalism_desc: "The right is already mobilized, and the memory of 1964 has given it a story to tell. Wrapping our program in the flag and in the language of national greatness will deepen the nationalist vote and give our government a cause bigger than any one party."
 BRA_absorb_right_wing: "Absorb Right-Wing Parties"
 BRA_absorb_right_wing_desc: "Right-wing parties across the spectrum remain disorganized. It is time to pull them into our fold and absorb them."
 BRA_appease_centrao: "Appease the Centrão"
 BRA_appease_centrao_desc: "The PMDB, DEM, and other parties form a bloc of political centrists called \"the big center\". No legislation passes without their say, so we need to \"negotiate\" for their support."
 BRA_olavist_policies: "Olavist Policies"
 BRA_olavist_policies_desc: "Olavo de Carvalho was a Brazilian essayist, digital influencer, and ideologue, and a leading voice of conservatism in Brazil. A former journalist and astrologer, he called himself a philosopher."
 BRA_try_to_coup_psl: "Create a New Party"
 BRA_try_to_coup_psl_desc: "Bolsonaro is having internal problems with the PSL and will eventually leave it, but he needs a new party. That party will be the \"Aliança\", a conservative party."
 BRA_bolsonarismo: "Bolsonarismo"
 BRA_bolsonarismo_desc: "Bolsonarismo is the political phenomenon that formed around Jair Bolsonaro. It took shape after the 2014 presidential campaign and gave the right a new platform, backed by the congressman's voters and aimed at diminishing the power of the left in Brazil. It is often compared to Thatcherism, Trumpism, and Reaganism."
 BRA_make_alliances_with_centrao: "Make Alliances with the Centrão"
 BRA_make_alliances_with_centrao_desc: "No president governs without the Centrão, and its leaders know it. By offering ministries, committee seats, and money for their districts to friends in each of the big parties, we may keep Congress in line through influence alone, and we can choose how formal the alliance will be."
 BRA_new_ministries: "Create New Ministries"
 BRA_new_ministries_desc: "We will create a series of new ministries to help unify the country under our government. They will bring in politicians from across the spectrum, which will bring stability and solidify our place at the head of the government."
 BRA_push_for_economic_liberalisation: "Push for Economic Liberalization"
 BRA_push_for_economic_liberalisation_desc: "Selling state companies and cutting regulation will let private capital run our plants and mines, and make every new project cheaper to start."
 BRA_the_brazilian_dream: "The Brazilian Dream"
 BRA_the_brazilian_dream_desc: "Across our nation, our people cry with pride at the great nation we have become. The world will now know us as a republic truly worthy of international respect."
 BRA_a_new_way: "A New Way"
 BRA_a_new_way_desc: "The Brazilian Republic was born in a coup, and many leaders have already called it a failure. We should change our political system and return to the old way."
 BRA_old_values: "Old Values"
 BRA_old_values_desc: "Many Brazilians still long for the order and dignity they associate with the old Empire, and conservatives value those traditions more than any republican slogan. Tying our program to the old values will win over voters who want continuity and strengthen the monarchist cause."
 BRA_side_with_psl: "Side with PSL"
 BRA_side_with_psl_desc: "Bolsonaro's PSL shares our distrust of the old parties and our respect for faith, order, and tradition. Siding with it gives us a ready-made voter base and a place in the right's new coalition, and it lifts both the PSL and our own monarchist movement."
 BRA_monarchy_model: "The Monarchy Model"
 BRA_monarchy_model_desc: "The former Brazilian Empire was a constitutional monarchy, but many believe we need a strong monarchy. Which monarchist system will we choose?"
 BRA_modern_monarchies: "The Modern Monarchies"
 BRA_modern_monarchies_desc: "The United Kingdom and Spain show that a crown can sit comfortably beside a modern government and a free economy. We will study how they pair a ceremonial head of state with elected ministers, and our friendly overtures will earn goodwill in London and Madrid."
 BRA_learnings_from_past: "Lessons from the Past"
 BRA_learnings_from_past_desc: "Our first Empire ended in a barracks coup after it lost the army and the landowners, and it never built institutions that could outlive the emperor. The new Empire will study those failures so that the throne can last this time."
 BRA_unite_the_people: "Unite the People"
 BRA_unite_the_people_desc: "Brazilians are split between left and right, city and countryside, rich and poor. A monarch who stands above party politics can speak for all of them, and a royal family that visits every region will give the country something it can agree on."
 BRA_monarchist_propaganda: "Monarchist Propaganda"
 BRA_monarchist_propaganda_desc: "Most Brazilians know little about their Empire beyond a few school lessons on Pedro II. Books, television, and public ceremonies that explain what a monarchy offers will build support for the throne and keep the cause in the public eye for years."
 BRA_restauration: "Restoration"
 BRA_restauration_desc: "All Brazilians, empowered by national renewal, will consolidate the birth of the Third Brazilian Empire. From now on, we will rise as a great power on the world stage."
 BRA_acabar_isso: "Tem que acabar isso daí!"
 BRA_acabar_isso_desc: "The left has ruined the country's economy and morality and keeps trying to impose its ideology on Brazilian families. This must end."
 BRA_ending_mamata: "Ending the \"Mamata\""
 BRA_ending_mamata_desc: "Brazilian politicians and legislators are constantly looking for a piece of the state's largesse. We must make the public see this government as the one that will end corruption in politics."
 BRA_new_imperial_university: "New Imperial University"
 BRA_new_imperial_university_desc: "Pedro II, one of the greatest Brazilian leaders, invested heavily in education. We should follow his legacy and improve our universities and our education system."
 BRA_government_reform: "Government Reform"
 BRA_government_reform_desc: "The republic left us with a bloated state, too much power in Brasília, and a long record of graft. The new government will expose corruption, hand more authority to the provinces, and make the state work for the economy instead of against it."
 BRA_brazilian_traditional_values: "Brazilian Traditional Values"
 BRA_brazilian_traditional_values_desc: "In general, the Brazilian population is conservative and Christian, so maintaining traditional values will boost our support."
 BRA_fight_crime: "Fight Crime"
 BRA_fight_crime_desc: "Brazil has one of the highest homicide totals in the world, and gangs such as the PCC and Comando Vermelho run whole neighborhoods. More money for the police, better training, and a firmer hand against the cartels will take back the streets."
 BRA_the_cisplatina: "The Cisplatina Question"
 BRA_the_cisplatina_desc: "In 1828, Brazil was forced to relinquish its control over its southern Cisplatine Province. Today, the Cisplatina is called Uruguay. We have to reclaim it, either by diplomacy or by force."
 BRA_empire_proud: "Imperial Glory"
 BRA_empire_proud_desc: "Our emperor's reign has reunited and stabilized Brazil and led it to prosperity and glory. We have also fulfilled the legacy of Pedro II. Ave Glória! Ave Império!"
 BRA_appease_military: "Appease the Military"
 BRA_appease_military_desc: "The military is our greatest supporter, and previous governments abandoned it. We will fulfill its needs and avoid their mistakes."
 BRA_pro_bolsonaro_parties: "Pro-Bolsonaro Parties"
 BRA_pro_bolsonaro_parties_desc: "To ensure [BRA.GetLeader] stays in power, we need to gather support from some of the parties that once backed Bolsonaro."
 BRA_empower_militaries: "Empower the Military"
 BRA_empower_militaries_desc: "Our rule rests on the armed forces, and we must reward them. Officers will take seats in the ministries and the state companies, and the barracks will get the budgets and privileges they enjoyed under the old military regime, at the price of more graft in the ranks."
 BRA_eneas_legacy: "The Legacy of Enéas"
 BRA_eneas_legacy_desc: "Enéas Ferreira Carneiro was a Brazilian politician who ran for president three times. He founded and led the nationalist, conservative Party of the Reconstruction of the National Order (PRONA), usually seen as far-right, and he supported nationalizing some industries."
 BRA_ending_communism: "Ending Communism"
 BRA_ending_communism_desc: "The communist movement has divided our country for decades and has little to show for it but strikes and unrest. With the military leading the effort, we will close its party offices and break its networks until communism has no place in Brazilian politics."
 BRA_intervention_in_south_america: "Intervention in South America"
 BRA_intervention_in_south_america_desc: "Brazil is the largest country in South America, and our generals see no reason to tolerate socialist regimes on our borders. A more interventionist posture will let us act against them openly, in the name of order and our own security."
 BRA_pax_brasilis: "Pax Brasilis"
 BRA_pax_brasilis_desc: "It is time to formalize the actual situation: Brazil is the uncontested ruler of Latin America. Let us show the world what we are truly capable of."
 BRA_privatize_petrobras: "Privatize Petrobras"
 BRA_privatize_petrobras_desc: "Petrobras is a state-owned company focused on oil and refining, and it has been tied to several corruption scandals. To expand the private market even further, we must privatize it."
 BRA_federal_pact: "Federal Pact"
 BRA_federal_pact_desc: "The Federative Pact, now called Fiscal Federalism, is defined in the Constitution of the Federative Republic of Brazil (articles 145 to 162). It sets out the tax powers of the federation's entities and the charges and public services for which they are responsible."

 #Serra Tree

 BRA_american_diplomacy: "American Diplomacy"
 BRA_american_diplomacy_desc: "Brazil and the United States fought side by side in Italy in the Second World War, and ties between the two countries have stayed close since. A visit to Washington and a warmer tone in Brasília will turn that history into real friendship and open the way to trade and investment."
 BRA_american_trade: "Trading with America"
 BRA_american_trade_desc: "The United States is among our largest trading partners and buys everything from Embraer jets to coffee and orange juice. We will offer Washington a trade agreement that lowers barriers on both sides and gives our exporters easier access to the world's biggest consumer market."
 BRA_american_investments: "American Investments"
 BRA_american_investments_desc: "General Motors and other American firms already build cars in Brazil, and American capital funds much of our industry. We will offer Washington an investment treaty that protects both sides' investors, and our own businesses will gain new industrial and office capacity in the process."
 BRA_looking_to_europe: "Looking to Europe"
 BRA_looking_to_europe_desc: "Our law, our language, and many of our families came from Europe, and Brazilian elites have long looked to Paris and Lisbon for models. A push for closer ties, backed by friendly visits to the EU capitals, will earn us goodwill across the bloc and more standing in each of its members."
 BRA_european_trade: "Trading with Europe"
 BRA_european_trade_desc: "As a bloc, the European Union is one of our largest trading partners, and Mercosur has been negotiating with it for years. A trade agreement with its leading members will open European markets to our soy, beef, and manufactured goods, and it will win us goodwill across the EU."
 BRA_european_investments_serra: "European Investments"
 BRA_european_investments_serra_desc: "European carmakers and banks such as Volkswagen and Santander already operate across Brazil. We will propose an investment treaty that protects their money and ours, and the capital that follows will help build up our industry."
 BRA_global_alignment: "Global Alignment"
 BRA_global_alignment_desc: "With investment treaties offered in both Washington and the capitals of Europe, Brazil has a foot in both halves of the Western world. We can now present ourselves as a partner of every major democracy and expect to be taken seriously in every forum."
 BRA_fiscal_reform: "Fiscal Reform"
 BRA_fiscal_reform_desc: "Our budget has run on borrowed time since the currency crisis, and our creditors are watching. Simplifying our tangled tax system, cutting waste, and living within our means will restore confidence in the real and give business a stable base to plan from."
 BRA_education_investment: "Competitive Education"
 BRA_education_investment_desc: "The countries that grow fastest today are the ones that teach their children best, and Brazil still loses too many students before they finish school. Higher spending on schools and universities will lift our research and prepare a workforce for the economy we want."
 BRA_improve_healthcare_conditions: "Improve Healthcare Conditions"
 BRA_improve_healthcare_conditions_desc: "Public hospitals in our big cities are overcrowded, and clinics in the countryside are too few. More investment in the SUS, together with reform of the way it is run, will bring care to those who need it and show Brazilians that the government is paying attention."
 BRA_administrative_reform_serra: "Administrative Reform"
 BRA_administrative_reform_serra_desc: "Brazil's bureaucracy is costly and slow, and the public pays for it every day in queues and paperwork. A thorough administrative reform will bring waste and graft to light, and it gives us the mandate to act on what we find."
 BRA_federalization_ethos: "Federalization Ethos"
 BRA_federalization_ethos_desc: "Brazil is a federation of twenty-six states and a federal district, yet much of the real power still sits in Brasília. A federalist outlook in our administration will let governors and mayors shape policy for their own regions and bring their natural resources to market."
 BRA_improve_the_real: "Improve the Real"
 BRA_improve_the_real_desc: "The real ended the years of runaway inflation, but the recent crisis has left it weak and our creditors uneasy. Disciplined budgets and a central bank that investors trust will repair its reputation and lift the burden a weak currency places on our economy."
 BRA_effective_public_sector: "Effective Public Sector"
 BRA_effective_public_sector_desc: "Decades of neglect have left our public sector unable to serve the millions of Brazilians who depend on it. More investment will deliver the services we promised, and deliver them efficiently."
 BRA_pay_off_the_debt: "Pay Off the Debt"
 BRA_pay_off_the_debt_desc: "Years of borrowing have left a debt that costs us dearly in interest. Retiring a large part of it will lift a weight from the real and leave more money for roads, schools, and hospitals later, though the treasury will feel the cost today."
 BRA_empower_the_states: "Empower the States"
 BRA_empower_the_states_desc: "The 1988 constitution made the states and municipalities full members of the federation, but they still lean on Brasília for money. Giving the governors more resources and authority will let each state build on its own strengths."
 BRA_scientific_efforts: "Scientific Efforts"
 BRA_scientific_efforts_desc: "Brazilian researchers at Fiocruz, Embrapa, and our public universities have already shown what steady funding can do, from vaccines to farmland. More money for labs and graduate students will keep our best minds at home and pay us back in new products and industries."
 BRA_weaken_economic_regulations: "Weaken Economic Regulations"
 BRA_weaken_economic_regulations_desc: "Brazil's maze of licenses and taxes makes starting and running a business harder than it should be. Cutting the worst of the rules will speed up construction and free firms large and small to grow, while we keep the protections that matter."
 BRA_employment_projects: "Employment Projects"
 BRA_employment_projects_desc: "Too many Brazilians are out of work, and a government that cannot find them jobs will lose their trust. Public investment in new plants and offices in Goiás will put people on payrolls and give our economy fresh capacity at the same time."
 BRA_infrastructure_projects: "Infrastructure Projects"
 BRA_infrastructure_projects_desc: "Brazil moves most of its cargo by truck, over roads that are too few and too poorly kept. New transport links in the Northeast, starting in Piauí and Maranhão, will bring down shipping costs and open more of the country to business."
 BRA_diversify_the_economy: "Diversify the Economy"
 BRA_diversify_the_economy_desc: "Our economy still leans on a few commodities and a few states. Public money for offices and industry in Acre, far from our traditional centers, will open a new region to business and make us less dependent on any single sector."
 BRA_increase_private_sector_role: "Expand the Private Sector's Role"
 BRA_increase_private_sector_role_desc: "Cardoso sold off Vale and the Telebrás phone monopoly, and both grew quickly under private owners. A bigger role for private firms and small businesses will bring in capital, competition, and jobs, and it will earn the trust of bankers and entrepreneurs."
 BRA_guarantee_civil_liberties: "Guarantee Civil Liberties"
 BRA_guarantee_civil_liberties_desc: "The 1988 constitution restored the freedoms that the military regime had taken away, and our government will defend them. A free press, free assembly, and fair elections are the base of Brazilian democracy, and keeping them safe will win us the trust of the people."
 BRA_protect_brazilian_democracy: "Protect Brazilian Democracy"
 BRA_protect_brazilian_democracy_desc: "We must ensure that radicals such as the Workers' Party and PRONA do not damage Brazilian democracy."
 BRA_maintain_power: "PSDB Hegemony"
 BRA_maintain_power_desc: "Two Cardoso terms put the PSDB at the center of Brazilian politics, and we mean to keep it there. Holding on will mean favors for allies in Congress and the state governments, and that will cost us in clean government."
 BRA_crackdown_on_corruption: "Crack Down on Corruption"
 BRA_crackdown_on_corruption_desc: "Officials embezzle public money, and scandal follows scandal in our politics. We must rebuild the people's trust in their government."
 BRA_gather_the_popular_support: "Gather Popular Support"
 BRA_gather_the_popular_support_desc: "A clean-government record gives us something to show voters, but it will not carry an election alone. We must take the PSDB's message beyond our base in São Paulo and prove that the party works for ordinary Brazilians."
 BRA_ensure_political_majority_psdb: "Ensure Political Rule"
 BRA_ensure_political_majority_psdb_desc: "Congress is split among many parties, and no government can pass a law without building a majority among them. Courting the centrão and trading ministries for votes will keep the PSDB's agenda moving, though such deals have a price."
 BRA_positivism: "Positivism"
 BRA_positivism_desc: "Positivism, the creed behind our flag's motto of Order and Progress, holds that society improves through science, reason, and efficient government. We will make it our guide, and the technocratic image will win the party the trust of voters who value results over slogans."

