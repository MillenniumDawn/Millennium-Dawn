 PHI_islamism_dynamic_modifier: "Рост радикального исламизма"
 PHI_islamism_dynamic_modifier_tooltip: "Исламизм существовал на Филиппинах на протяжении веков. В последнее время ситуация начала меняться, и в южной части страны наблюдается крайняя радикализация."
 PHI_npa_insurgency_dynamic_modifier: "Затяжная народная война"
 PHI_npa_insurgency_dynamic_modifier_tooltip: "Коммунистическая партия Филиппин с 1969 года ведет партизанскую войну в сельской местности через свою Новую народную армию. Ее кадры облагают деревни налогами, устраивают засады на патрули и оспаривают местное самоуправление на Лусоне, Самаре и восточном Минданао."
 PHI_milf_decisions_category: "Конфликт Моро"
 PHI_milf_decisions_category_desc: "Конфликт Моро — это серия вооруженных столкновений в провинции Минданао. Конфликт Моро начался в результате политики переселения, проводившейся в 1935 году на территории Филиппинского Содружества. Он разразился после убийства 11 мусульманских военных курсантов на Коррехидоре. Вскоре после этого, в 1969 году, был сформирован Исламский национальный фронт Моро, который с тех пор находится в открытом конфликте с правительственными войсками.\n £generic_anarchist_communism_small §RСила MILF:§! [?PHI.PHI_strength_of_milf|20]%"
 PHI_anti_muslim_propaganda: "Антимусульманская пропаганда"
 PHI_anti_muslim_propaganda_desc: "Направленная информационная кампания в государственных СМИ и среди населения с целью противодействия влиянию радикальных исламских повстанческих группировок, действующих на Минданао."
 PHI_crush_the_moro_insurgency: "Подавление восстания Моро"
 PHI_crush_the_moro_insurgency_desc: "После того как Исламский фронт освобождения Моро сократился до разрозненных остатков, Вооруженные силы могут объявить кампанию на Минданао завершенной. Командование южными провинциями возвращается к гражданскому правительству, и повстанческое движение прекращается силой оружия, а не путем переговоров."
 PHI_sign_the_bangsamoro_agreement: "Подпишите соглашение о Бангсаморо."
 PHI_sign_the_bangsamoro_agreement_desc: "Переговоры в Куала-Лумпуре, организованные при посредничестве Малайзии, привели к тому, что Фронт занял свою позицию. Всеобъемлющее соглашение предусматривает вывод из эксплуатации его бойцов, замену Автономного региона в мусульманском Минданао образованием Бангсаморо, обладающим реальными финансовыми и законодательными полномочиями, а также обязательство Манилы финансировать переходный период."
 PHI_communist_insurgency_category: "Восстание Новой Народной Армии"
 PHI_communist_insurgency_category_desc: "Восстание Новой народной армии — старейшее в мире коммунистическое повстанческое движение. НПА ведет непрерывную борьбу против национального правительства Филиппин с 1969 года.\n\nПришло время приложить усилия для подавления этого восстания.\n £generic_Communist_State_small §RСила НПА:§! [?PHI.PHI_strength_of_npa|20]%"
 PHI_sustained_military_offensive: "Продолжительное военное наступление"
 PHI_sustained_military_offensive_desc: "Направить армейские и полицейские подразделения на зачистку партизанских фронтов в Сьерра-Мадре, Самаре и окрестностях Давао. Зачистки ослабляют Новую народную армию быстрее, чем любой другой метод, но длительные операции в сельской местности лишают правительство поддержки среди сельского населения."
 PHI_peace_and_development_teams: "Группы по вопросам мира и развития"
 PHI_peace_and_development_teams_desc: "Развертывание совместных военно-гражданских групп в населенных пунктах, находящихся под влиянием партизан, совмещая строительство дорог и школ с работой по местному самоуправлению. Лишение повстанцев базы для вербовки идет медленнее, чем зачистка, и значительно дороже, но это не лишает их стабильности."
 PHI_amnesty_for_returning_cadres: "Амнистия для вернувшихся кадров"
 PHI_amnesty_for_returning_cadres_desc: "Предлагается юридическая неприкосновенность, денежная помощь и поддержка в обеспечении средств к существованию бойцам, сдавшим оружие. Массовый дезертирство ослабляет партизанские фронты, хотя помилование повстанцев лишает правительство доверия со стороны офицерского корпуса и жертв восстания."
 PHI_defeat_the_new_peoples_army: "Разгромить Новую народную армию"
 PHI_defeat_the_new_peoples_army_desc: "Партизанские фронты прорваны, и Центральный комитет рассеян по всему миру. Объявление о военном поражении знаменует собой конец самого продолжительного коммунистического восстания в мире."
 PHI_conclude_the_oslo_talks: "Завершить переговоры в Осло"
 PHI_conclude_the_oslo_talks_desc: "Норвежские посредники годами поддерживали открытый канал связи с Национальным демократическим фронтом. Окончательное урегулирование предполагало обмен политической амнистии и обязательств по аграрной реформе на окончательную демобилизацию Новой народной армии."
 PHI_anti_dynasty_law: "Закон против династий"
 PHI_anti_dynasty_law_desc: "Статья II, раздел 26 Конституции 1987 года запрещает политические династии, но Конгресс так и не принял соответствующий закон, и у семей, доминирующих в законодательном органе, нет для этого оснований. Принятие такого закона запретило бы родственникам действующих депутатов занимать свои должности, ослабив влияние провинциальных кланов на национальную политику и открыв доступ к руководству каждой партии для кандидатов, не принадлежащих к влиятельным семьям."
 PHI_corruption_battle_mechanic_category: "Борьба с коррупцией"
 PHI_corruption_battle_mechanic_category_desc: "Десятилетия патронажной политики, слабые институты и укоренившиеся интересы привели к тому, что коррупция глубоко укоренилась практически на всех уровнях власти. Для её искоренения потребуются постоянные, целенаправленные расследования в бюрократии, армии и частном секторе. По мере проведения реформ и укрепления институтов будущие расследования станут проще и эффективнее.\n\nТекущий уровень коррупции: [Root.GetPHI_corruption_tier_number]\nТекущий уровень коррупции: [?PHI_corruption_strength|Y0]"
 PHI_change_the_strength_of_corruption_tt: "§YУровень искажения§! изменяется на [?temp_change|0+] (Текущий: [?PHI.PHI_corruption_strength|Y0])\n"
 PHI_corp_nothing_tt: "§R75%§!: Ничего не происходит / бюрократический провал.\nНет прогресса в борьбе с коррупцией."
 PHI_corp_minor_tt: "§Y65%§!: Обнаружено небольшое кольцо искажений.\nПрогресс искажений §G-5§!."
 PHI_corp_major_tt: "§Y35%§!: Крупномасштабный корпоративный скандал.\n§G-10§! прогресс коррупции. §R-2%§! стабильность."
 PHI_corp_huge_tt: "§G10%§!: Выявлена ​​коррупция на крупную сумму.\n§G-20§! Прогресс коррупции. §R-5%§! отрасль за 180 дней."
 PHI_contracts_nothing_tt: "§R70%§!: Доказательств не обнаружено.\nБез изменений."
 PHI_contracts_minor_tt: "§Y55%§!: Выявлены незначительные нарушения в управлении.\n§G-5§! прогресс коррупции."
 PHI_contracts_major_tt: "§Y30%§!: Крупный объем коррупции при закупках.\n§G-10§! прогресс коррупции. §R-3%§! скорость строительства."
 PHI_contracts_huge_tt: "§G15%§!: Раскрыта масштабная государственная растрата.\n§G-20§! прогресс коррупции. §R-2%§! стабильность."
 PHI_tax_nothing_tt: "§R80%§!: Нет окончательных выводов.\nБез изменений."
 PHI_tax_minor_tt: "§Y50%§!: Обнаружено мелкое взяточничество.\n§G-5§! прогресс коррупции."
 PHI_tax_major_tt: "§Y25%§!: Раскрыта мошенническая схема на таможне.\n§G-10§! Прогресс коррупции. §R-10%§! Налоговые поступления за 2 месяца."
 PHI_tax_huge_tt: "§G10%§!: Высокопоставленные чиновники замешаны.\n§G-25§! прогресс коррупции. §R-15%§! иностранные инвестиции за 6 месяцев."
 PHI_military_nothing_tt: "§R80%§!: Нет доказательств или скрыто.\nБез изменений."
 PHI_military_minor_tt: "§Y60%§!: Пойманы офицеры низшего ранга.\n§G-5§! прогресс коррупции."
 PHI_military_major_tt: "§Y25%§!: Генеральный штаб замешан.\n§G-10§! прогресс коррупции. §R-3%§! организация армии за 90 дней."
 PHI_military_huge_tt: "§G10%§!: Разоблачение высокопоставленного военного деятеля.\n§G-20§! прогресс коррупции. §R-5%§! стабильность. §R-5§! армейский опыт."
 PHI_purge_nothing_tt: "§R70%§!: Значимых результатов нет.\nИзменений нет."
 PHI_purge_minor_tt: "§Y60%§!: Обнаружена мелкомасштабная сеть прививок.\n§G-5§! прогресс коррупции."
 PHI_purge_major_tt: "§Y35%§!: Крупный местный синдикат разоблачен.\n§G-10§! прогресс коррупции. §R+1%§! цель сопротивления."
 PHI_purge_huge_tt: "§G10%§!: Политическая династия свергнута.\n§G-20§! прогресс коррупции. §R+2%§! цель сопротивления. §G+3%§! стабильность через 90 дней."
 PHI_offshore_nothing_tt: "§R85%§!: Следы не обнаружены.\nИзменений нет."
 PHI_offshore_minor_tt: "§Y50%§!: Отслежены мелкие учетные записи.\n§G-5§! прогресс коррупции."
 PHI_offshore_major_tt: "§Y20%§!: Обнаружена крупная сеть отмывания денег.\n§G-25§! прогресс коррупции."
 PHI_offshore_huge_tt: "§G5%§!: Обнаружено офшорное состояние.\n§G-40§! Прогресс коррупции. §G-10%§! Стоимость иностранных инвестиций за 6 месяцев."
 PHI_investigate_corporations: "Расследуйте деятельность корпораций"
 PHI_investigate_corporations_desc: "Крупнейшие филиппинские конгломераты давно поддерживают тесные связи с регулирующими органами и законодателями. Целенаправленное расследование корпоративной бухгалтерии, налоговых деклараций и государственных контрактов может выявить схемы взяточничества и хищений, хотя результат зависит от того, насколько глубоко укоренилась коррупция в настоящее время.\n\nТекущий уровень коррупции: [ROOT.GetPHI_corruption_tier_number]"
 PHI_audit_government_contracts: "Аудит государственных контрактов"
 PHI_audit_government_contracts_desc: "Государственные инфраструктурные проекты и контракты на закупки печально известны как источники коррупции, где откаты и завышенные счета отвлекают средства от государственных проектов. Тщательная проверка последних контрактов может выявить мошеннические действия, хотя чиновники, которым есть что скрывать, будут сопротивляться проверке.\n\nТекущий уровень коррупции: [ROOT.GetPHI_corruption_tier_number]"
 PHI_inspect_tax_bureau: "Проверка налоговой службы"
 PHI_inspect_tax_bureau_desc: "Бюро внутренних доходов преследуют обвинения во взяточничестве, тайных сделках и фальсификации документов. Внутренняя проверка могла бы вернуть потерянные доходы и выявить коррумпированных агентов, хотя коррупция в самом бюро может защитить самых злостных нарушителей.\n\nТекущий уровень коррупции: [ROOT.GetPHI_corruption_tier_number]"
 PHI_investigate_the_military: "Расследуйте деятельность военных."
 PHI_investigate_the_military_desc: "Скандалы с закупками и «солдаты-призраки» давно истощают бюджет Вооруженных сил Филиппин. Расследование военных финансов чревато конфликтами с офицерским корпусом, но успешные расследования могут вернуть украденные средства и восстановить дисциплину в рядах.\n\nТекущий уровень коррупции: [ROOT.GetPHI_corruption_tier_number]"
 PHI_purge_local_officials: "Уволить местных чиновников"
 PHI_purge_local_officials_desc: "Органы местного самоуправления, от провинциальных администраций до сельских советов, часто находятся под контролем политических династий, которые рассматривают государственные должности как семейное дело. Целенаправленная чистка коррумпированных местных чиновников может сломить их власть, хотя укоренившиеся династии могут сопротивляться всеми силами.\n\nТекущий уровень коррупции: [ROOT.GetPHI_corruption_tier_number]"
 PHI_trace_offshore_accounts: "Отслеживание офшорных счетов"
 PHI_trace_offshore_accounts_desc: "Нажитые десятилетиями нечестным путем богатства часто переводились на офшорные счета и в подставные компании за рубежом. Отслеживание этих счетов — медленный, дорогостоящий и дипломатически сложный процесс, но успешное отслеживание может вернуть огромные суммы и нанести серьезный удар по сетям, которые их создали.\n\nТекущий уровень коррупции: [ROOT.GetPHI_corruption_tier_number]"
 PHI_police_investiture: "Полицейские расследования"
 PHI_police_investiture_desc: "Перенаправить государственные средства на укрепление Национальной полиции Филиппин, повышение эффективности работы следователей за счет увеличения расходов на полицию."
 PHI_police_investiture_active_tt: "Увеличение финансирования полиции активно. Все антикоррупционные расследования имеют более высокие шансы на успех.\n§R+20%§! расходы на полицию. §R-15§! максимальная командная власть."
 PHI_corporate_scandal_industry: "Корпоративный скандал"
 PHI_corporate_scandal_industry_desc: "Разоблачение коррупции в крупных корпорациях подорвало доверие инвесторов к нашему промышленному сектору."
 PHI_procurement_scandal_construction: "Скандал с закупками"
 PHI_procurement_scandal_construction_desc: "Выявленные масштабные коррупционные схемы в государственных контрактах замедлили строительство на время пересмотра контрактов."
 PHI_customs_fraud_tax: "Раскрыта мошенническая схема на таможне"
 PHI_customs_fraud_tax_desc: "Мошенническая группировка, занимающаяся таможенным оформлением, нарушила сбор налогов на время реорганизации ведомства."
 PHI_tax_scandal_investment: "Скандал в налоговой службе"
 PHI_tax_scandal_investment_desc: "Коррупция на самом высоком уровне в налоговой службе отпугнула иностранных инвесторов."
 PHI_military_scandal_org: "Военный коррупционный скандал"
 PHI_military_scandal_org_desc: "Коррупция в генеральном штабе подорвала командные структуры и сплоченность подразделений."
 PHI_offshore_fortune_investment: "Возвращенные офшорные средства"
 PHI_offshore_fortune_investment_desc: "Конфискованные офшорные активы были реинвестированы, что открыло новые каналы для привлечения иностранных инвестиций."
 PHI_locked_corruption: "Укоренившаяся коррупция"
 PHI_locked_corruption_desc: "§RНевозможно изменить законы о борьбе с коррупцией вручную§!\nГоды патронажной политики, бюрократической неэффективности и укоренившихся особых интересов вплели коррупцию в ткань филиппинского государства. Государственные ресурсы регулярно перенаправляются, подотчетность остается слабой, а влиятельные лица продолжают извлекать выгоду из существующего положения вещей. Значимых реформ нельзя добиться одними лишь указами. Борьба с коррупцией потребует решительных расследований, более сильных институтов и правительства, готового противостоять тем, кто наживается на системе."
 PHI_corruption_eradicated: "Чистое управление"
 PHI_corruption_eradicated_desc: "Благодаря многолетним последовательным реформам Филиппины добились редкого в своей истории результата: правительство, функционирующее с подлинной честностью. Институты укрепились, доверие общественности восстановлено, и порочный круг коррупции разорван, по крайней мере, на данный момент. Поддержание этого стандарта потребует постоянной бдительности."
 PHI_corruption_event.1.t: "Уровень коррупции снижен."
 PHI_corruption_event.1.d: "Наши неустанные усилия принесли свои плоды. Коррупционные сети были ликвидированы, и установлен новый уровень подотчетности."
 PHI_corruption_event.1.a: "Наконец-то прогресс."
 PHI_corruption_event.2.t: "Коррупция усиливается"
 PHI_corruption_event.2.d: "Несмотря на наши усилия, коррумпированные силы укрепили свои позиции. Взяточничество и коррупция проникли еще глубже в государственные структуры."
 PHI_corruption_event.2.a: "Мы должны работать лучше."
 PHI_corruption_event.10.t: "Расследование: Подозревается сокрытие информации."
 PHI_corruption_event.10.d: "Наши следователи столкнулись с непреодолимым препятствием в виде юристов, засекреченных документов и внезапной потери памяти. Кто-то влиятельный заметает следы, но мы не можем это доказать."
 PHI_corruption_event.10.a: "Продолжайте за ними наблюдать."
 PHI_corruption_event.11.t: "Расследование: Обнаружена коррупционная сеть."
 PHI_corruption_event.11.d: "Раскрыта коррупционная схема среднего звена, действовавшая в частном секторе. Нескольким руководителям предъявлены обвинения, а часть присвоенных средств возвращена."
 PHI_corruption_event.11.a: "Привлечь их к ответственности."
 PHI_corruption_event.12.t: "Расследование: Раскрыт корпоративный скандал"
 PHI_corruption_event.12.d: "Масштабный корпоративный скандал потряс деловой сектор. Руководители вступили в сговор с государственными чиновниками с целью хищения государственных средств. Последствия подорвали доверие инвесторов."
 PHI_corruption_event.12.a: "Конфискуйте их имущество."
 PHI_corruption_event.13.t: "Расследование: Разоблачение коррупции в сфере высоких доходов"
 PHI_corruption_event.13.d: "Удивительное открытие: полностью раскрыта сеть масштабной корпоративной коррупции, достигшая самых вершин частного сектора. Конфискуются активы на миллиарды долларов."
 PHI_corruption_event.13.a: "Это не будет забыто."
 PHI_corruption_event.20.t: "Аудит: Доказательства не обнаружены."
 PHI_corruption_event.20.d: "Аудит не выявил ничего, за что стоило бы принимать меры. Все контракты были оформлены правильно. Либо бухгалтерские книги чисты, либо кто-то их почистил до нашего приезда."
 PHI_corruption_event.20.a: "Мы пытались."
 PHI_corruption_event.21.t: "Аудит: выявлены нарушения в управлении."
 PHI_corruption_event.21.d: "Аудиторы выявили небрежность в ведении бухгалтерского учета и завышенные счета-фактуры в нескольких отделах. Нецелевое использование средств было компенсировано."
 PHI_corruption_event.21.a: "Привлечь их к ответственности."
 PHI_corruption_event.22.t: "Аудит: выявлена ​​коррупция в сфере закупок."
 PHI_corruption_event.22.d: "Раскрыта глубоко укоренившаяся схема мошенничества в сфере государственных закупок. Чиновники систематически заключали контракты с подставными компаниями в обмен на откаты."
 PHI_corruption_event.22.a: "Демонтаж сети."
 PHI_corruption_event.23.t: "Аудит: Выявлено хищение государственных средств."
 PHI_corruption_event.23.d: "Выявлена ​​ошеломляющая схема хищения средств, охватывающая несколько министерств. Масштабы хищений из государственной казны – это национальный скандал."
 PHI_corruption_event.23.a: "Этому приходит конец."
 PHI_corruption_event.30.t: "Налоговая проверка: замечаний не обнаружено."
 PHI_corruption_event.30.d: "Инспекторы не обнаружили убедительных доказательств нарушений. Сотрудники правоохранительных органов сотрудничали со следствием, и все записи выглядели в порядке. Расследование закрыто безрезультатно."
 PHI_corruption_event.30.a: "Возвращаюсь к работе."
 PHI_corruption_event.31.t: "Налоговая проверка: выявлена ​​взяточничество"
 PHI_corruption_event.31.d: "Ряд рядовых налоговых инспекторов были уличены в получении взяток за занижение налоговых оценок. Они были уволены, а задолженность по налогам взыскана."
 PHI_corruption_event.31.a: "Уберитесь в доме."
 PHI_corruption_event.32.t: "Налоговая инспекция: разоблачение мошенничества на таможне"
 PHI_corruption_event.32.d: "Пресечена изощренная схема таможенного мошенничества. Контрабандисты годами подкупали высокопоставленных агентов, чтобы те пропускали незадекларированные грузы."
 PHI_corruption_event.32.a: "Реформировать бюро."
 PHI_corruption_event.33.t: "Налоговая проверка: в деле замешаны высокопоставленные чиновники"
 PHI_corruption_event.33.d: "Высокопоставленные чиновники Бюро внутренних доходов оказались замешаны в систематической коррупционной схеме. Скандал встревожил иностранных инвесторов и подорвал доверие общественности."
 PHI_corruption_event.33.a: "Привлечь к ответственности каждого из них."
 PHI_corruption_event.40.t: "Военное расследование: сокрытие улик"
 PHI_corruption_event.40.d: "Военные сплотились. Наши следователи столкнулись с сопротивлением на всех уровнях. Если коррупция существует, то она глубоко запрятана."
 PHI_corruption_event.40.a: "Мы вернёмся."
 PHI_corruption_event.41.t: "Военное расследование: задержаны офицеры"
 PHI_corruption_event.41.d: "Несколько офицеров низшего звена были уличены в присвоении выделенных средств на топливо и оборудование в личных целях. Они предстали перед военным трибуналом."
 PHI_corruption_event.41.a: "Справедливость восторжествовала."
 PHI_corruption_event.42.t: "Военное расследование: замешан Генеральный штаб"
 PHI_corruption_event.42.d: "Члены генерального штаба оказались замешаны в коррупционной схеме, связанной с контрактами на оборонные закупки. Скандал нарушил цепочку командования."
 PHI_corruption_event.42.a: "Провести чистку в рядах."
 PHI_corruption_event.43.t: "Военное расследование: разоблачение высокопоставленного лица"
 PHI_corruption_event.43.d: "Высокопоставленный военный чиновник был публично уличен в хищении средств оборонного ведомства на протяжении многих лет. Это разоблачение потрясло как вооруженные силы, так и общественность."
 PHI_corruption_event.43.a: "Никто не стоит выше закона."
 PHI_corruption_event.50.t: "Очищение: существенных результатов не выявлено."
 PHI_corruption_event.50.d: "Местные чиновники молчали, и чистка не принесла результатов. Либо сети затихли, либо получили предупреждение заранее."
 PHI_corruption_event.50.a: "Мы попробуем ещё раз."
 PHI_corruption_event.51.t: "Чистка: Обнаружена сеть подкупа"
 PHI_corruption_event.51.d: "Была ликвидирована небольшая коррупционная сеть, действовавшая из местной бюрократии. Несколько чиновников были отстранены от своих должностей."
 PHI_corruption_event.51.a: "Скатертью дорога."
 PHI_corruption_event.52.t: "Чистка: Разоблачение местного синдиката"
 PHI_corruption_event.52.d: "Крупный местный преступный синдикат, внедренный в региональное правительство, был разоблачен. Его устранение подорвало местные властные структуры и вызвало беспорядки."
 PHI_corruption_event.52.a: "Стабильность придет сама собой."
 PHI_corruption_event.53.t: "Чистка: свержение политической династии"
 PHI_corruption_event.53.d: "Укоренившаяся политическая династия, десятилетиями контролировавшая местное самоуправление, была свергнута. Ее активы конфискованы, хотя лояльные ей сторонники по-прежнему недовольны."
 PHI_corruption_event.53.a: "Начинается новая эра."
 PHI_corruption_event.60.t: "След в прибрежной зоне: След не найден"
 PHI_corruption_event.60.d: "Наши финансовые следователи зашли в тупик. Все зацепки свелись к анонимным подставным компаниям в разных юрисдикциях. Деньги исчезли."
 PHI_corruption_event.60.a: "Мы их потеряли."
 PHI_corruption_event.61.t: "Поиск офшорных счетов: обнаружены счета несовершеннолетних."
 PHI_corruption_event.61.d: "Было выявлено и заморожено несколько небольших офшорных счетов, связанных с государственными чиновниками. Суммы невелики, но прецедент имеет важное значение."
 PHI_corruption_event.61.a: "Заморозьте всё."
 PHI_corruption_event.62.t: "Offshore Trace: Раскрыта сеть отмывания денег."
 PHI_corruption_event.62.d: "Крупная сеть по отмыванию денег, переводившая средства через офшорные счета, была ликвидирована. Значительная сумма была возвращена в казну Филиппин."
 PHI_corruption_event.62.a: "Принесите это домой."
 PHI_corruption_event.63.t: "Offshore Trace: Offshore Fortune Uncovered"
 PHI_corruption_event.63.d: "Невероятное открытие: обнаружено и конфисковано огромное состояние, находившееся в офшорных зонах и принадлежавшее высокопоставленным чиновникам. Эта крупная сумма является исторической и посылает мощный сигнал."
 PHI_corruption_event.63.a: "Люди узнают."
 PHI_corruption_event.99.t: "Общественное доверие восстановлено"
 PHI_corruption_event.99.d: "После свержения старой политической династии местные сообщества постепенно восстанавливают доверие к своим институтам. Зарождается чувство осторожного оптимизма."
 PHI_corruption_event.99.a: "Народ нас поддерживает."
 PHI_corruption_event.100.t: "Мы это сделали!"
 PHI_corruption_event.100.d: "После многих лет кропотливых расследований, судебных преследований и институциональных реформ наша борьба с коррупцией достигла вехи, в которую мало кто верил. Укоренившиеся сети взяточничества и кумовства, которые когда-то парализовали наше правительство, были ликвидированы. Филиппины стоят на пороге новой эры, определяющей не то, что крадут чиновники, а то, что они создают."
 PHI_corruption_event.100.a: "Сегодня начинается новая жизнь на Филиппинах."
 PHI_corruption_event.200.t: "Скандал с корпоративным лоббированием"
 PHI_corruption_event.200.d: "Распространяются слухи о том, что крупный конгломерат использовал тайные пожертвования для влияния на недавнее законодательство. Общественность следит за ситуацией, и оппозиция чувствует запах крови."
 PHI_corruption_event.200.a: "Не обращайте на это внимания. Мы не можем воевать со всеми."
 PHI_corruption_event.200.b: "Провести ограниченную проверку."
 PHI_corruption_event.200.c: "Публично осудите их."
 PHI_corruption_event.201.t: "Призрачные проекты"
 PHI_corruption_event.201.d: "В парламентском отчете выявлено несколько финансируемых государством инфраструктурных проектов, которые так и не были завершены: дороги не построены, здания не стоят, рабочие так и не наняты. Деньги просто исчезли."
 PHI_corruption_event.201.a: "Замять дело."
 PHI_corruption_event.201.b: "Вините местных чиновников."
 PHI_corruption_event.201.c: "Начать официальное расследование."
 PHI_corruption_event.202.t: "Утечка налогов"
 PHI_corruption_event.202.d: "Информатор предоставил доказательства того, что высокопоставленные правительственные чиновники уклонялись от уплаты налогов через сеть фиктивных подставных компаний. Документы уже распространяются в прессе."
 PHI_corruption_event.202.a: "Сделайте это спокойно."
 PHI_corruption_event.202.b: "Покажите им пример."
 PHI_corruption_event.202.c: "Предложите снисхождение в обмен на сотрудничество."
 PHI_corruption_event.203.t: "Мошенничество в сфере военных закупок"
 PHI_corruption_event.203.d: "В ходе расследования выяснилось, что пропали партии оружия, предназначенные для Вооруженных сил Филиппин. Счета-фактуры были подписаны, поставки зарегистрированы, но оборудование нигде не найдено."
 PHI_corruption_event.203.a: "Отклонить обвинения."
 PHI_corruption_event.203.b: "Наказать нескольких козлов отпущения."
 PHI_corruption_event.203.c: "Начните полное расследование."
 PHI_corruption_event.204.t: "Провинциальные мафиозные сети"
 PHI_corruption_event.204.d: "Полицейские разведывательные отчеты подтвердили то, что многие местные жители и так знали: ряд должностных лиц провинциального и местного уровней активно сотрудничают с организованными преступными синдикатами. Плата за «крышевание» переходит из рук в руки на всех уровнях."
 PHI_corruption_event.204.a: "Не обращайте на это внимания."
 PHI_corruption_event.204.b: "Арестуйте их публично."
 PHI_corruption_event.204.c: "Замените их лоялистами."
 PHI_corruption_event.205.t: "Схема получения откатов за рубежом"
 PHI_corruption_event.205.d: "Появились доказательства того, что иностранные строительные и энергетические компании подкупали высокопоставленных чиновников, чтобы получить выгодные государственные контракты. Документальные следы ведут аж в столицу."
 PHI_corruption_event.205.a: "Отрицайте всё."
 PHI_corruption_event.205.b: "Тихонько накажите их."
 PHI_corruption_event.205.c: "Покажите пример публично."
 PHI_corruption_event.206.t: "Бюрократическая гниль"
 PHI_corruption_event.206.d: "Мелкая коррупция становится все более распространенной в государственных учреждениях. Клерки ждут конвертов с деньгами. Инспекторов нужно убеждать. Разрешения имеют свою цену, выходящую за рамки официальной платы. Культура мелкой коррупции подрывает доверие к учреждениям."
 PHI_corruption_event.206.a: "Пусть они наслаждаются своими небольшими привилегиями."
 PHI_corruption_event.206.b: "Предложить символические реформы."
 PHI_corruption_event.206.c: "Переназначить нескольких должностных лиц."
 PHI_corruption_number_01: "(1) Незначительная коррупция"
 PHI_corruption_number_02: "(2) Незначительная коррупция"
 PHI_corruption_number_03: "(3) Умеренная коррупция"
 PHI_corruption_number_04: "(4) Средний уровень коррупции"
 PHI_corruption_number_05: "(5) Широко распространенная коррупция"
