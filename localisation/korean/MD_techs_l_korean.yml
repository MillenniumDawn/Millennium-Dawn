 module_heavy_guns_3: "주포 III"
 module_railgun_1: "레일건 I"
 module_railgun_1_desc: "Early electromagnetic railguns use powerful electrical currents to launch projectiles at extreme velocities. While still experimental, these weapons offer exceptional range and penetration compared to conventional naval artillery.\n\n§GDesigner Hint: Railguns provide high Cannon Attack and Cannon Piercing for shore bombardment and engagements with armored ships. They are useful when penetration matters, but cost more IC and strategic resources than conventional guns.§!"
 module_railgun_2: "레일건 II"
 module_railgun_2_desc: "Refined railgun designs improve power efficiency and barrel durability, allowing for higher rates of fire and more reliable operation. These systems begin to rival traditional naval guns in sustained combat effectiveness.\n\n§GDesigner Hint: Railguns provide high Cannon Attack and Cannon Piercing for shore bombardment and engagements with armored ships. They are useful when penetration matters, but cost more IC and strategic resources than conventional guns.§!"
 module_railgun_3: "레일건 III"
 module_railgun_3_desc: "Advanced railgun platforms integrate improved energy storage and fire-control systems, enabling precise long-range strikes against surface targets and limited engagement of aerial threats.\n\n§GDesigner Hint: Railguns provide high Cannon Attack and Cannon Piercing for shore bombardment and engagements with armored ships. They are useful when penetration matters, but cost more IC and strategic resources than conventional guns.§!"
 module_railgun_4: "레일건 IV"
 module_railgun_4_desc: "Cutting-edge electromagnetic railgun technology represents a breakthrough in naval firepower, delivering highly accurate, hypersonic projectiles with minimal logistical burden and unmatched destructive potential.\n\n§GDesigner Hint: Railguns provide high Cannon Attack and Cannon Piercing for shore bombardment and engagements with armored ships. They are useful when penetration matters, but cost more IC and strategic resources than conventional guns.§!"
