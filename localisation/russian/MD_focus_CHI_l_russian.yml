 apply_to_join_as_a_member_desc: "Полноправное членство в Шанхайской организации сотрудничества открывает доступ к архитектуре безопасности организации, каналам экономических инвестиций и механизмам политической координации. Подача заявки инициирует девяностодневный период рассмотрения, и в случае одобрения Китаю присваивается соответствующий уровень членства с учетом его текущего направления развития."
 apply_to_join_as_an_observer_desc: "Статус наблюдателя предоставляет доступ к саммитам Шанхайской организации сотрудничества, совместным учениям и механизмам экономической координации без обязательств, связанных с полноправным членством. Прежде чем статус будет предоставлен, заявители должны пройти девяностодневный период рассмотрения со стороны Китая и, в соответствующих случаях, России."
