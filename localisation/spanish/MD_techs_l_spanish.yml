 module_anti_submarine_missile_1: "Misil antisubmarino I"
 module_anti_submarine_missile_1_desc: "Los primeros sistemas de misiles antisubmarinos permiten a los buques atacar sumergibles a distancias seguras (stand-off), mejorando la defensa submarina de la flota más allá de las cargas de profundidad tradicionales.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas incrementadas de guerra antisubmarina, a cambio de un mayor coste de capacidad industrial (IC).§!"
 module_anti_submarine_missile_2: "Misil antisubmarino II"
 module_anti_submarine_missile_2_desc: "Los misiles ASW mejorados cuentan con sistemas de guía y propulsión perfeccionados, lo que aumenta la probabilidad de impacto y extiende el alcance de combate contra los submarinos modernos.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas incrementadas de guerra antisubmarina, a cambio de un mayor coste de capacidad industrial (IC).§!"
 module_anti_submarine_missile_3: "Misil antisubmarino III"
 module_anti_submarine_missile_3_desc: "Los sistemas de misiles ASW modernos incorporan puntería avanzada y mayores velocidades, permitiendo una interceptación fiable de submarinos evasivos o sigilosos.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas incrementadas de guerra antisubmarina, a cambio de un mayor coste de capacidad industrial (IC).§!"
 module_anti_submarine_missile_4: "Misil antisubmarino IV"
 module_anti_submarine_missile_4_desc: "Los misiles ASW altamente avanzados utilizan sensores sofisticados, anticontramedidas y un alcance extendido, proporcionando una neutralización superior de las amenazas bajo el mar.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas incrementadas de guerra antisubmarina, a cambio de un mayor coste de capacidad industrial (IC).§!"
 module_anti_submarine_missile_5: "Misil antisubmarino V"
 module_anti_submarine_missile_5_desc: "Los misiles ASW de próxima generación enfatizan el sigilo, la guía asistida por inteligencia y un alcance extremo, permitiendo una interdicción eficaz de submarinos a lo largo de vastas áreas operacionales.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas incrementadas de guerra antisubmarina, a cambio de un mayor coste de capacidad industrial (IC).§!"
 module_anti_submarine_missile_6: "Misil antisubmarino VI"
 module_anti_submarine_missile_6_desc: "Los misiles ASW del futuro cercano representan la cúspide de la guerra antisubmarina, combinando guía por IA, alta velocidad y sistemas robustos de anticontramedidas.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas incrementadas de guerra antisubmarina, a cambio de un mayor coste de capacidad industrial (IC).§!"
 module_anti_submarine_missile_7: "Misil antisubmarino VII"
 module_anti_submarine_missile_7_desc: "Los misiles ASW hiperavanzados representan la cúspide de la guerra antisubmarina, combinando guía por IA, alta velocidad y sistemas robustos de anticontramedidas.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas incrementadas de guerra antisubmarina, a cambio de un mayor coste de capacidad industrial (IC).§!"
 module_anti_submarine_missile_8: "Misil antisubmarino VIII"
 module_anti_submarine_missile_8_desc: "Los misiles ASW ultraavanzados representan la cúspide de la guerra antisubmarina, combinando guía por IA, alta velocidad y sistemas robustos de anticontramedidas.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas incrementadas de guerra antisubmarina, a cambio de un mayor coste de capacidad industrial (IC).§!"
 module_vls_asm_1: "Misiles antibuque VLS I"
 module_vls_asm_1_desc: "Los primeros sistemas de misiles antibuque basados en VLS permiten a los buques de guerra lanzar armas a distancia segura desde celdas verticales protegidas. Esto optimiza la supervivencia y la flexibilidad de combate en comparación con los lanzadores tradicionales montados en cubierta.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_asm_2: "Misiles antibuque VLS II"
 module_vls_asm_2_desc: "Los misiles antibuque VLS mejorados cuentan con sistemas de guía perfeccionados y un alcance extendido, permitiendo ataques más fiables contra objetivos de superficie al tiempo que mantienen las ventajas de la integración del lanzamiento vertical.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_asm_3: "Misiles antibuque VLS III"
 module_vls_asm_3_desc: "Los sistemas de misiles antibuque VLS modernos integran buscadores avanzados y perfiles de vuelo rozadores de mar, lo que permite ataques de largo alcance coordinados y una mayor resistencia a las contramedidas enemigas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_asm_4: "Misiles antibuque VLS IV"
 module_vls_asm_4_desc: "Los misiles antibuque VLS altamente avanzados utilizan puntería en red y guía de precisión, permitiendo rápidos combates contra múltiples objetivos y una mejor efectividad contra las defensas navales modernas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_asm_5: "Misiles antibuque VLS V"
 module_vls_asm_5_desc: "Las plataformas de misiles antibuque VLS de próxima generación enfatizan el sigilo, la maniobrabilidad y la resistencia a la guerra electrónica, incrementando significativamente la supervivencia y el éxito de los ataques en entornos disputados.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_asm_6: "Misiles antibuque VLS VI"
 module_vls_asm_6_desc: "Los sistemas de misiles antibuque VLS de vanguardia representan el cenit de la tecnología de ataque naval, combinando puntería inteligente, velocidad extrema y resistencia avanzada a las contramedidas para abrumar incluso a las flotas más sofisticadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_asm_7: "Misiles antibuque VLS VII"
 module_vls_asm_7_desc: "Los sistemas de misiles antibuque VLS hiperavanzados representan el cenit de la tecnología de ataque naval, combinando puntería inteligente, velocidad extrema y resistencia avanzada a las contramedidas para abrumar incluso a las flotas más sofisticadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_asm_8: "Misiles antibuque VLS VIII"
 module_vls_asm_8_desc: "Los sistemas de misiles antibuque VLS ultraavanzados representan el cenit de la tecnología de ataque naval, combinando puntería inteligente, velocidad extrema y resistencia avanzada a las contramedidas para abrumar incluso a las flotas más sofisticadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_naval_vls_drone_swarm_1: "Enjambre de drones VLS I"
 module_naval_vls_drone_swarm_1_desc: "Los enjambres de drones de lanzamiento vertical permiten a los buques desplegar rápidamente múltiples plataformas no tripuladas para misiones de reconocimiento, distracción y soporte de ataque terminal, abrumando las defensas mediante perfiles de vuelo coordinados y detección distribuida.\n\n§GConsejo de diseño: Los enjambres de drones VLS cambian los efectos de saturación de alto impacto y la utilidad de misión flexible por una mayor demanda de recursos.§!"
 module_naval_vls_drone_swarm_2: "Enjambre de drones VLS II"
 module_naval_vls_drone_swarm_2_desc: "$module_naval_vls_drone_swarm_1_desc$"
