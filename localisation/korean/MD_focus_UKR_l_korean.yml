 UKR_develop_btr3u: "§YBTR-3U '가디언'§!을\n§Y[UAE.GetNameWithFlag]§! 입찰용으로 개발"
 UKR_develop_btr3u_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3u_for_tooltip\n\n\n\n\n\n\n\n\n§W§YBTR-3U '가디언'§!은 §YBTR-94K§!를 전면 개조한 형식으로, 해병대용 신형 장갑차를 위한 진행 중인 §Y아랍에미리트§! 입찰을 겨냥한 것입니다. 이 차량은 출력 326마력의 도이츠 BF6M1015 엔진과 앨리슨 MD3066 자동 변속기, 또는 300마력 UTD-20 엔진을 장착합니다.\nO. O. 모로조프 명칭 하르키우 설계국이 이 차량의 개발을 수행하였습니다. 설계 문서: 차체 개발과 차량의 모든 체계 및 무장의 통합.\n무장에는 30mm ZTM-1 자동포와 이와 함께 장착된 7.62mm KT-7,62 기관총, 9M113M '콘쿠르스-M' 대전차 유도 미사일 발사기 2기, 30mm 자동 유탄 발사기를 갖춘 KBA-105 '시크발' 전투 모듈이 포함됩니다.\n§W--------------§!\nUAE 입찰에서 우리가 이길 가능성을 §G높이려면§! 우리에 대한 그들의 §Y관계§!가 §G40§! 이상이어야 합니다. 그렇지 않으면 솔직히 패배할 확률이 상당히 높습니다.\n§W--------------§!\n이 결정은 이 차량의 후속형을 개발하는 이후 결정에 §R필수§!입니다.\n이 결정을 §R건너뛰면§! 이 차량의 신형 버전을 개발할 수 있는 가능성이 §R없어집니다§!.§!"
 UKR_develop_btr3e: "§YBTR-3E§! 개발"
 UKR_develop_btr3e_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3e_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3E는 UTD-20 또는 도이츠 BF6M1015 엔진을 장착한 개조형입니다.\nBM-3M '슈투름-M' 전투 모듈을 갖추었으며, 그 무장은 30mm ZTM-1 자동포, 이와 함께 장착된 7.62mm KT-7.62 기관총, '바리어' 발사기 2기(로켓 6발), 30mm KBA-117 자동 유탄 발사기를 포함합니다.§!"
 UKR_develop_btr3e1: "§YBTR-3E1§! 개발"
 UKR_develop_btr3e1_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3e1_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3E1은 2005~2006년 태국 계약의 요구 사항을 충족하기 위해 특별히 제작된 BTR-3E의 개조형입니다.\n이 형식이 BTR-3E와 비교하여 갖는 주요 특징은 현대화된 BM-3M '슈투름' 전투 모듈 설치, 높이를 2,928mm에서 2,774mm로 낮춤, 전투 인원을 9명에서 13명으로 늘림, VRC-950 무전기 설치, 전투 모듈용 추가 탄약 배치입니다.§!"
 UKR_develop_btr3da: "§YBTR-3DA§! 개발"
 UKR_develop_btr3da_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3da_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3DA는 우크라이나 동부 전쟁의 경험을 반영한 장갑차의 추가 발전형입니다.\nBTR-3DA 장갑차는 이전 형식보다 빠르고 기동성이 좋으며, 승무원 장갑 방호가 개선되었고 텔레비전 및 열상 채널을 갖춘 광전자 모듈을 갖추고 있습니다.\n이 덕분에 야간 사격이 가능해졌습니다.\n보조 동력 장치를 사용하면 주 동력 장치를 쓰지 않고도 전투 모듈을 조종할 수 있습니다.§!"
 UKR_develop_btr3u_flag: "완료된 결정: §YBTR-3U '가디언' 개발§!"
 UKR_develop_btr3e_flag: "완료된 결정: §YBTR-3E 개발§!"
 UKR_develop_btr3e1_flag: "완료된 결정: §YBTR-3E1 개발§!"
 UKR_develop_btr3da_flag: "완료된 결정: §YBTR-3DA 개발§!"
 UKR_develop_btr3e1_cse90lp: "§YBTR-3E1 CSE90LP§! 개발"
 UKR_develop_btr3e1_cse90lp_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3_cse90lp_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3E1 CSE90LP는 90mm 저압포를 갖춘 코커릴 CSE 90LP 포탑을 장착한 BTR-3E1의 개조형입니다.\n이 포탑에는 동축 7.62mm 기관총과 40mm 자동 유탄 발사기가 장착됩니다.\n포탑은 레이저 거리 측정기, 열상 장비, 탄도 계산기를 포함하는 자동 사격 통제 체계를 갖추고 있습니다.§!"
 UKR_develop_btr3e1_cpws30: "§YBTR-3E CPWS-30§! 개발"
 UKR_develop_btr3e1_cpws30_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3_cpws30_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3E CPWS-30은 30mm 자동포를 갖춘 CPWS-30 포탑을 장착한 BTR-3E의 개조형입니다.\n이 포탑에는 동축 7.62mm 기관총과 40mm 자동 유탄 발사기가 장착됩니다.\n포탑은 레이저 거리 측정기, 열상 장비, 탄도 계산기를 포함하는 자동 사격 통제 체계를 갖추고 있습니다.§!"
 UKR_develop_btr4_choose_role: "§YBTR-4§! 임무 선택"
 UKR_develop_btr4_choose_role_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_roles_for_tooltip\n\n\n\n\n\n\n\n\n§W§YBTR-4§!는 이전의 소련제 설계보다 한 단계 발전한 차량으로, 처음부터 더 강력한 무장을 탑재하도록 설계되었습니다.\n이 장비의 임무를 선택할 수 있습니다. 더 가볍고 저렴한 APC로 할 것인지, 더 비싸지만 중무장한 IFV로 할 것인지 정해야 합니다.\n이 결정에 따라 BTR-4를 장비할 대대가 기계화 대대 또는 기갑 대대로 정해집니다.\n원한다면 기본적으로 동일한 장비를 반대의 임무로도 생산할 수 있습니다.§!"
