l_korean:
 botswana_focus: "보츠와나 중점 계통도"
 BOT_model_student_of_africa: "아프리카의 모범 국가"
 BOT_model_student_of_africa_desc: "보츠와나는 아프리카에서 가장 발전된 국가 중 하나입니다. 독립 이후 안정적인 민주주의 국가로서 분쟁도 거의 겪지 않았습니다. 사하라 사막 이남 아프리카에서 가장 높은 인간 개발 지수와 가장 낮은 부패 인식률을 자랑하는 보츠와나는 아프리카 다른 국가들이 본받아야 할 모범 사례입니다.\n\n§R§Y부패 수준§!이§Y$corruption_level_05$§!보다 높으면 이 보너스를 잃게 됩니다!§!"
 BOT_kalahari_expansion: "칼라하리 사막화"
 BOT_kalahari_expansion_desc: "보츠와나 서부의 칼라하리 사막은 넓은 면적을 차지합니다. 해가 갈수록 이 사막은 더욱 확장됩니다. 보츠와나 국토의 95%가 강수량이 너무 적어 농업이 불가능하기 때문에, 국토의 71%가 농업용 방목지로 사용되고 있으며 대부분의 국민이 지하수에서 물을 얻습니다. 대규모 축산업은 사막화를 악화시키지만, 보츠와나 국민의 거의 절반이 이로부터 소득을 얻고 있습니다.\n\n보츠와나 서부에는 국립공원도 많이 있으며(국토 면적의 20%를 차지합니다), 가장 큰 곳은 중앙 칼라하리 수렵 보호구역으로 산족이 살고 있으며 보츠와나 최대 규모의 다이아몬드 광산 가운데 하나가 있습니다.\n\n§Y매년 1월§!마다 칼라하리의 사막화 현황에 대한 소식을 받게 됩니다. 사막은 계속 확장될 수도 있고(§Y사막화§!), 현 상황이 유지될 수도 있으며(§Y안정화§!), 상황이 개선될 수도 있습니다(§Y오아시스화§!). 각 결과의 확률은 §Y$BOT_anti_poaching_decisions$§! 결정 분류에서 확인할 수 있습니다.\n\n이미 고통받고 있는 칼라하리와 주변 사바나를 계속 착취하여 사막화를 악화시킬 수도 있고, 보전주의적 접근으로 사막화를 늦추거나 심지어 되돌리려 시도할 수도 있습니다."
 BOT_house_of_chiefs: "추장원 (House of Chiefs)"
 BOT_house_of_chiefs_desc: "족장원(은틀로 야 디크고시)은 보츠와나 의회의 자문 기구입니다. 족장원은 보츠와나 8대 주요 부족의 세습 족장, 선출된 의원 22명, 대통령이 지명한 족장 5명으로 구성됩니다. 족장원은 정치적, 행정적 권한이 없지만 대부분의 법안과 모든 헌법 개정안은 국민의회에 오르기 전에 족장원에서 검토하고 논의해야 합니다. 디크고시 본인들은 자기 부족에 대해 의례적이고 소규모의 행정적 권한만 가집니다."
 BOT_house_of_chiefs_tt: "정부 예산 및 법안 변경 비용: §R+15%§!\n행정 예산: §R+5%§!"
 BOT_house_of_chiefs_empowered: "추장원 - 중앙 집권화"
 BOT_house_of_chiefs_empowered_desc: "족장원(은틀로 야 디크고시)은 보츠와나 의회의 자문 기구입니다. 족장원은 보츠와나 8대 주요 부족의 세습 족장, 선출된 의원 22명, 대통령이 지명한 족장 5명으로 구성됩니다. 대부분의 법안과 모든 헌법 개정안은 국민의회에 오르기 전에 족장원에서 검토하고 논의해야 합니다. 족장원은 법안에 대한 거부권(1회)과 부족 관련 활동을 규율하는 입법을 통제할 권리를 가집니다. 디크고시 본인들은 재량과 자치권을 가지며 국가 입법부와 다른 법을 제정할 수 있고, 재임 중에는 법적 조치로부터 면책 특권을 부여받습니다."
 BOT_house_of_chiefs_empowered_tt: "정부 지출 및 정책 변경 비용: §R+20%§!\n행정 비용: §R+10%§!"
 BOT_house_of_chiefs_militarised: "추장원 - 개별 무장 허용"
 BOT_house_of_chiefs_militarised_desc: "족장원(은틀로 야 디크고시)은 보츠와나 의회의 자문 기구입니다. 족장원은 보츠와나 8대 주요 부족의 세습 족장, 선출된 의원 22명, 대통령이 지명한 족장 5명으로 구성됩니다. 족장원은 정치적, 행정적 권한이 없지만 대부분의 법안과 모든 헌법 개정안은 국민의회에 오르기 전에 족장원에서 검토하고 논의해야 합니다. 디크고시 본인들은 자기 부족에 대해 의례적이고 소규모의 행정적 권한만 가집니다. 다만 이들에게는 지역 치안 병력으로 복무할 지역 민병대를 조직하고 훈련시킬 권리가 부여되었습니다."
 BOT_house_of_chiefs_militarised_tt: "정부 지출 및 정책 변경 비용: §R+20%§!\n군대 임금: §R+5%§!\n행정 비용: §R+5%§!"
 BOT_house_of_chiefs_empowered_and_militarised: "추장원 - 중앙 집권과 개별 무장 허용"
 BOT_house_of_chiefs_empowered_and_militarised_desc: "족장원(은틀로 야 디크고시)은 보츠와나 의회의 자문 기구입니다. 족장원은 보츠와나 8대 주요 부족의 세습 족장, 선출된 의원 22명, 대통령이 지명한 족장 5명으로 구성됩니다. 대부분의 법안과 모든 헌법 개정안은 국민의회에 오르기 전에 족장원에서 검토하고 논의해야 합니다. 족장원은 법안에 대한 거부권(1회)과 부족 관련 활동을 규율하는 입법을 통제할 권리를 가집니다. 디크고시 본인들은 재량과 자치권을 가지며 국가 입법부와 다른 법을 제정할 수 있고, 재임 중에는 법적 조치로부터 면책 특권을 부여받습니다. 또한 디크고시에게는 지역 치안 병력으로 복무할 지역 민병대를 조직하고 훈련시킬 권리가 있습니다."
 BOT_house_of_chiefs_empowered_and_militarised_tt: "Cost to Change Government Expenditures and Policies: §R+20%§!\nMilitary Wages: §R+5%§!\nBureaucracy Spending: §R+10%§!\n"
 BOT_ancestral_land_conflict: "조상부터 이어진 영토 분쟁"
 BOT_ancestral_land_conflict_desc: "중앙 칼라하리 수렵 보호구역에는 지구상에서 가장 오래된 문화 중 하나인 수렵 채집민 산족(부시맨으로도 알려져 있습니다)이 살고 있습니다. 칼라하리 사막의 이름 유래가 된 바칼라가디 같은 다른 선주민들도 그곳에 살고 있습니다. 이 수렵 보호구역은 본래 야생동물과 부시맨의 생활 방식을 모두 보호하기 위해 만들어졌습니다.\n\n1970년대에 보츠와나 정부는 산족이 동물을 남획하고 있다고 주장했으며, 해당 지역이 자연 보호구역이라는 점은 정부가 산족을 위한 서비스(학교, 병원 등)를 설치하는 것을 가로막았습니다. 이주 프로그램이 시작되었고, 공교롭게도 이는 수렵 보호구역에서 다이아몬드 광맥이 발견된 시기와 겹쳤습니다. 1990년대에는 정부가 보호구역 거주민에 대한 서비스 접근을 끊기 시작하면서 이주 노력이 강화되었습니다.\n\n산족은 우리 인구의 극히 일부에 불과하므로 우리에게 맞설 현실적인 방법이 없습니다. 그러나 이들에 대한 처우는 우리의 국제적 이미지에 오점입니다."
 BOT_ancestral_land_conflict_escalated: "조상부터 이어진 영토 분쟁이 확대됨"
 BOT_ancestral_land_conflict_escalated_desc: "중앙 칼라하리 수렵 보호구역에는 지구상에서 가장 오래된 문화 중 하나인 수렵 채집민 산족(부시맨으로도 알려져 있습니다)이 살고 있습니다. 칼라하리 사막의 이름 유래가 된 바칼라가디 같은 다른 선주민들도 그곳에 살고 있습니다. 이 수렵 보호구역은 본래 야생동물과 부시맨의 생활 방식을 모두 보호하기 위해 만들어졌습니다.\n\n1970년대에 보츠와나 정부는 산족이 동물을 남획하고 있다고 주장했으며, 해당 지역이 자연 보호구역이라는 점은 정부가 산족을 위한 서비스(학교, 병원 등)를 설치하는 것을 가로막았습니다. 이주 프로그램이 시작되었고, 공교롭게도 이는 수렵 보호구역에서 다이아몬드 광맥이 발견된 시기와 겹쳤습니다. 1990년대에는 정부가 보호구역 거주민에 대한 서비스 접근을 끊기 시작하면서 이주 노력이 강화되었습니다.\n\n산족은 우리 인구의 극히 일부에 불과하므로 우리에게 맞설 현실적인 방법이 없습니다. 그러나 이들에 대한 처우는 우리의 국제적 이미지에 오점입니다."
 BOT_BDP_stronghold: "£BOT_Neutral_conservatism  보츠나와 민주당(BDP)의 본거지"
 BOT_BDP_stronghold_desc: "건국 이래 £BOT_Neutral_conservatism BDP(보츠와나 민주당)가 나라를 통치해 왔습니다. 선거 때마다 이들은 최대 정당이었으며, 가장 낮은 득표율도 55%였습니다. 이들은 보수주의, 자유주의, 사회주의가 뒤섞인 포괄 정당입니다. 이들의 주된 힘은 츠와나족 지지층에서 나오기 때문에 나라의 다른 많은 부족은 소외감을 느끼게 됩니다. BDP의 권력 장악을 깨려면 큰 정치 스캔들이 필요할 것입니다.\n\n§Y£BOT_Neutral_conservatism BDP의 A팀 파벌과 바라타-파티 파벌을 합친 세력이 최대 정당인 한, 선거 후에도 £BOT_Neutral_conservatism BDP가 계속 집권합니다.\n\n£BOT_Neutral_conservatism BDP가 지나치게 강해지면 야당들이 단일 정당으로 합쳐지며, 단일 소수 정당에 영향을 미치는 모든 효과가 이 신당에 적용됩니다.\n\n£BOT_Neutral_conservatism BDP의 인기도가 너무 낮아지면 당내 개혁파가 자체 정당을 결성합니다.§!"
 BOT_zimbabwean_refugees: "짐바브웨의 난민들"
 BOT_zimbabwean_refugees_desc: "짐바브웨의 경제 상황으로 인해 수천 명이 합법적, 불법적으로 국경을 넘어 보츠와나로 들어오고 있습니다. 짐바브웨인의 약 3분의 1이 불법 체류 중이며, 국경을 넘은 대부분은 즉시 짐바브웨로 추방됩니다. 그러나 대규모 난민 유입에는 이점도 있습니다. 대부분의 바츠와나가 소를 키워 생계를 꾸리는 반면 대부분의 짐바브웨인은 광업과 공업 부문에서 일하므로, 보츠와나 숙련 노동력에서 불균형적으로 큰 비중을 차지합니다.\n\n§Y짐바브웨가 존재하지 않거나 우리의 종속국이면 이 국가 정신은 제거됩니다§!"
 BOT_zimbabwean_refugees_encouraged: "짐바브웨의 난민들을 환영함"
 BOT_zimbabwean_refugees_encouraged_desc: "짐바브웨의 경제 상황으로 인해 수천 명이 합법적, 불법적으로 국경을 넘어 보츠와나로 들어오고 있습니다. 짐바브웨인의 약 3분의 1이 불법 체류 중이며, 국경을 넘은 대부분은 즉시 짐바브웨로 추방됩니다. 그러나 대규모 난민 유입에는 이점도 있습니다. 대부분의 바츠와나가 소를 키워 생계를 꾸리는 반면 대부분의 짐바브웨인은 광업과 공업 부문에서 일하므로, 보츠와나 숙련 노동력에서 불균형적으로 큰 비중을 차지합니다.\n\n§Y짐바브웨가 존재하지 않거나 우리의 종속국이면 이 국가 정신은 제거됩니다§!"
 BOT_army_of_peacekeepers: "평화 유지 군대"
 BOT_army_of_peacekeepers_desc: "보츠와나 방위군은 전 세계에서 평화유지 병력으로 복무하도록 군을 개편했습니다. 물론 사람들은 군에 입대하는 유일한 이유가 타국에서 죽는 것이라는 점에 그다지 열광하지 않습니다."
 BOT_army_against_poaching: "불법 밀렵 통제 군대"
 BOT_army_against_poaching_desc: "보츠와나 방위군은 국내 밀렵꾼 퇴치와 재난 구호 활동 참여에 집중하고 있습니다."
 BOT_army_against_poaching_tt: "군인 급여: §G-10%§!\n국내 치안 지출: §R+10%§!\n§G제거된 밀렵꾼 수가 5 증가합니다§!"
 BOT_professional_military: "전문 군대"
 BOT_professional_military_desc: "보츠와나 방위군은 밀렵 방지, 평화 유지, 재난 구호 역할에서 거리를 두고 보다 전통적인 군대에 가까워지기 위한 조치를 취했습니다."
 BOT_coal_focused_energy: "석탄 국가 출발"
 BOT_coal_focused_energy_desc: "보츠와나는 개발되지 않은 석탄 자원을 활용하여 에너지 생산의 자급자족을 이루기로 결정했습니다. 값싸고 접근하기 쉽지만, 석탄은 가장 환경 친화적인 방식은 아닙니다."
 BOT_coal_focused_energy_tt: "추가 지출: $§R0.050§! x10억"
 BOT_coal_focused_energy_self_sufficient: "자급자족 석탄 국가"
 BOT_coal_focused_energy_self_sufficient_desc: "보츠와나는 개발되지 않은 석탄 자원을 활용하여 에너지 생산의 자급자족을 이루기로 결정했습니다. 값싸고 접근하기 쉽지만, 석탄은 가장 환경 친화적인 방식은 아닙니다."
 BOT_coal_focused_energy_small_profit: "수익성 있는 석탄 국가"
 BOT_coal_focused_energy_small_profit_desc: "보츠와나는 개발되지 않은 석탄 자원을 활용하여 에너지 생산의 자급자족을 이루기로 결정했습니다. 값싸고 접근하기 쉽지만, 석탄은 가장 환경 친화적인 방식은 아닙니다."
 BOT_coal_focused_energy_small_profit_tt: "기타 수입: $§G0.050§!"
 BOT_coal_focused_energy_rich: "부유한 석탄 국가"
 BOT_coal_focused_energy_rich_desc: "보츠와나는 개발되지 않은 석탄 자원을 활용하여 에너지 생산의 자급자족을 이루기로 결정했습니다. 값싸고 접근하기 쉽지만, 석탄은 가장 환경 친화적인 방식은 아닙니다."
 BOT_coal_focused_energy_rich_tt: "기타 수입: $§G0.100§!"
 BOT_renewable_focused_energy: "재생 에너지 국가 출발"
 BOT_renewable_focused_energy_desc: "보츠와나는 재생 에너지 생산의 막대한 잠재력을 활용하기로 결정했습니다. 비용이 많이 들고 에너지 밀도는 낮지만, 재생 에너지를 사용하면 환경에 도움이 될 것입니다."
 BOT_renewable_focused_energy_self_sufficient: "자급자족 재생 에너지 국가"
 BOT_renewable_focused_energy_self_sufficient_desc: "보츠와나는 재생 에너지 생산의 막대한 잠재력을 활용하기로 결정했습니다. 비용이 많이 들고 에너지 밀도는 낮지만, 재생 에너지를 사용하면 환경에 도움이 될 것입니다."
 BOT_renewable_focused_energy_small_profit: "수익성 있는 재생 에너지 국가"
 BOT_renewable_focused_energy_small_profit_desc: "보츠와나는 재생 에너지 생산의 막대한 잠재력을 활용하기로 결정했습니다. 비용이 많이 들고 에너지 밀도는 낮지만, 재생 에너지를 사용하면 환경에 도움이 될 것입니다."
 BOT_renewable_focused_energy_small_profit_tt: "기타 수입: $§G0.040§!"
 BOT_renewable_focused_energy_rich: "부유한 재생 에너지 국가"
 BOT_renewable_focused_energy_rich_desc: "보츠와나는 재생 에너지 생산의 막대한 잠재력을 활용하기로 결정했습니다. 비용이 많이 들고 에너지 밀도는 낮지만, 재생 에너지를 사용하면 환경에 도움이 될 것입니다."
 BOT_renewable_focused_energy_rich_tt: "기타 수입: $§G0.080§!"
 BOT_ilea: "국제 법집행 아카데미"
 BOT_ilea_desc: "미국은 사하라 이남 아프리카의 경찰관을 훈련하기 위해 가보로네에 국제 법집행 아카데미를 설립했습니다."
 BOT_extra_school_funding: "학교 추가 지원금"
 BOT_extra_school_funding_desc: "우리는 교육 제도에 추가 자금을 배정했습니다."
 BOT_school_fees: "학비 재도입"
 BOT_school_fees_desc: "우리는 치솟는 교육 비용에 대응하기 위해 학비를 다시 도입했습니다."
 Botswana_pulse.1.t: "칼라하리 사막 확장"
 Botswana_pulse.1.d: "작년 자료에 따르면 칼라하리 사막은 계속 확장되었습니다. 방목지로 쓰이던 여러 지역이 이제 황무지가 되었고, 다수의 지하수원이 말랐으며, 밀렵으로 야생동물이 줄었습니다. 사람들이 원하는 곳에서 소를 마음대로 방목하게 두고, 이 지역의 광물을 개발하며, 밀렵을 외면하는 것은 상황을 더욱 악화시킬 수밖에 없습니다."
 Botswana_pulse.1.a: "안타깝군"
 Botswana_pulse.2.t: "칼라하리 사막 보통"
 Botswana_pulse.2.d: "작년 자료에 따르면 칼라하리와 그 주변의 사막화 상황은 현상 유지 중인 것으로 보입니다. 그러나 다시 악화되는 것은 시간문제입니다. 사람들이 원하는 곳에서 소를 마음대로 방목하게 두고, 이 지역의 광물을 개발하며, 밀렵을 외면하는 것은 상황을 더욱 악화시킬 수밖에 없습니다."
 Botswana_pulse.2.a: "시간을 더 벌었다"
 Botswana_pulse.3.t: "칼라하리 사막 후퇴"
 Botswana_pulse.3.d: "작년 자료에 따르면 칼라하리의 넓은 지역에 식생이 다시 자라났습니다. 자연적인 방목 방식을 모방하고 밀렵에 맞서 싸우면 이 지역이 스스로 회복할 수 있을 것입니다."
 Botswana_pulse.3.a: "진전을 이루었다"
 Botswana_pulse.4.t: "£BOT_Neutral_conservatism BDP, 또다시 승리 확보!"
 Botswana_pulse.4.desc: "집권당 £BOT_Neutral_conservatism BDP가 선거에서 또 한 번 승리를 거머쥐었습니다! 이들의 성공에는 끝이 없는 듯합니다."
 Botswana_pulse.4.a: "예상대로군"
 Botswana_pulse.5.t: "£BOT_Neutral_conservatism BDP, 스캔들로 분열!"
 Botswana_pulse.5.desc: "집권당 £BOT_Neutral_conservatism BDP가 스캔들을 겪고 있습니다. 당내 한 파벌이 [ROOT.GetLeader] 대통령의 정책과 대중의 지지를 얻지 못한 점에 질려 주류 정당에서 갈라져 나왔습니다."
 Botswana_pulse.5.a: "예상대로군"
 Botswana_pulse.6.t: "야당, 선거 연합 결성"
 Botswana_pulse.6.desc: "여러 야당이 단일 선거 연합 아래 뭉쳤습니다. 야당 지도자들의 회동 끝에, £BOT_Neutral_conservatism BDP를 무너뜨릴 유일한 방법은 협력뿐이라는 결론에 이르렀습니다. 새 연합은 £BOT_neutral_Social_UDC UDC - 민주 변화를 위한 우산이라는 이름으로 알려질 것입니다."
 Botswana_pulse.6.a: "무의미하군"
 Botswana_pulse.7.t: "£BOT_neutral_Social_UDC UDC 분열"
 Botswana_pulse.7.desc: "£BOT_neutral_Social_UDC UDC가 선거 승리라는 목표를 달성한 이상 선거 연합은 더 이상 필요하지 않습니다. 정당들은 다음 선거에서 다시 독자적으로 선거 운동을 하기로 결정했습니다."
 Botswana_pulse.7.a: "흥미롭군"
 Botswana_pulse.8.t: "귀환하는 바뇰레스의 흑인"
 Botswana_pulse.8.desc: "1830년, 한 산족 개인의 시신이 프랑스의 베로 형제에 의해 박제되었습니다. 이 박제는 결국 스페인 카탈루냐의 박물관에 자리 잡았습니다. 이것이 논란이 된 것은 1991년이 되어서였으며, 1997년 UN에서의 논의 끝에 박물관은 박제된 사람을 해체하고 남은 인간 유해를 보츠와나로 돌려보내기로 결정했습니다. 그 '소포'가 이제 도착했습니다. 이 유해를 어떻게 해야 할까요?"
 Botswana_pulse.8.a: "그에게 합당한 장례를 치러 준다"
 Botswana_pulse.8.b: "200년 전에 죽은 사람이다, 어디든 보관해 두자"
 Botswana_pulse.9.t: "마리에트 보슈 처형"
 Botswana_pulse.9.desc: "마리에트 보슈는 1996년 연인의 배우자를 두 발의 총격으로 살해한 남아프리카 여성이었습니다. 이 살인은 처음에는 용의자가 없는, 강도가 잘못된 사건으로만 여겨졌습니다. 보슈는 2001년 3월 교수형으로 처형되었습니다. 이 사건이 이례적이었던 것은 그가 보츠와나에서 처형된 최초의 백인 여성이자 남아프리카 국적자였기 때문입니다. 처형 자체도 엉망이었는데, 처형된 바로 그날 그의 가족이 면회하러 오는 중이었고 남아프리카의 [SAF.GetLeader] 대통령이 그를 위한 사면 운동을 계획하고 있었기 때문입니다. 어느 쪽도 처형이 이루어질 것이라는 사실을 사전에 통보받지 못했습니다."
 Botswana_pulse.9.a: "좀 더 잘 풀릴 수도 있었을 텐데"
 Botswana_pulse.10.t: "정부를 고소한 부시맨"
 Botswana_pulse.10.desc: "산족 부시맨의 이익 단체가 1970년대부터 이루어져 온 이주 조치를 문제 삼아 정부를 고소했습니다. 보츠와나 고등법원은 사건을 분석한 끝에 산족을 이주시키려는 정부의 노력이 위헌이라는 결론을 내렸습니다."
 Botswana_pulse.10.a: "쯧"
 Botswana_pulse.11.t: "모사디 세보코, 크고시골로로 즉위"
 Botswana_pulse.11.desc: "발레테족의 크고시골로 투멜로 세보코가 최근 사망했습니다. 그의 누이 모사디 세보코가 맏이라는 이유로 보고시, 즉 출생에 따른 평등권을 근거로 왕관을 주장했습니다. 여성 크고시골로가 전례가 없었던 만큼 그의 주장에 대한 반대도 거셌습니다. 그러나 보츠와나 헌법은 이를 막지 않습니다. 결국 그는 공식적으로 즉위하여 족장원에 자리를 잡았습니다. 그는 보츠와나의 여성 권리를 열정적으로 옹호하고 있습니다."
 Botswana_pulse.11.a: "평등을 향한 한 걸음"
 Botswana_pulse.12.t: "산업 현장 파업"
 Botswana_pulse.12.desc: "최근 수천 명의 노동자가 한 산업 현장에서 파업을 벌였습니다. 결국 법원은 이 파업을 불법으로 판결했습니다. 그 결과 산업 현장 소유주는 거의 천 명을 노동력에서 해고했습니다. 많은 사람이 우리나라 노동자들의 처우에 분노하고 있습니다."
 Botswana_pulse.12.a: "파업하고 노조를 만든 대가다"
 Botswana_pulse.12.b: "우리 노동자들의 권리를 개선해야 한다!"
 Botswana_pulse.13.t: "아들을 살해한 모디세 모콰디 플라이"
 Botswana_pulse.13.desc: "오늘 끔찍한 소식이 전해졌습니다. £BOT_neutral_Social BCP 청년 연맹의 지도자가 잠자던 아들을 도끼로 살해한 사실이 밝혀졌습니다. 플라이는 자신에게 총격을 가했다는 경찰에게 도끼를 던지다가 실수로 아들을 죽였다고 주장했습니다. 플라이는 교수형을 선고받았습니다."
 Botswana_pulse.13.a: "BCP에게 스캔들이다!"
 Botswana_pulse.14.t: "탑 기어: 보츠와나 스페셜"
 Botswana_pulse.14.desc: "오늘 탑 기어 보츠와나 스페셜이 처음 방영되었습니다. 제러미 클락슨, 제임스 메이, 리처드 해먼드는 험지를 SUV보다 잘 달릴 수 있음을 증명하기 위해 값싼 자동차를 타고 보츠와나 동쪽 끝에서 출발하여 나미비아 국경까지 나라를 가로질러 달리는 것을 목표로 했습니다. 스페셜의 초반 하이라이트 중 하나는 보츠와나의 [ROOT.GetLeader] 대통령이 글라이더를 타고 도착해, 영국인들이 칼라하리를 횡단하기 직전에 행운을 빌어 준 장면이었습니다. 문제는 이들 중 누가 가장 잘 해낼까 하는 것입니다."
 Botswana_pulse.14.a: "키 큰 오랑우탄이 이기길 바란다!"
 Botswana_pulse.14.b: "느릿느릿 대장의 승리를 응원한다!"
 Botswana_pulse.14.c: "당연히 나는 햄스터와 올리버 팀이다!"
 Botswana_pulse.15.t: "모레미 항공 세스나 208 추락"
 Botswana_pulse.15.desc: "어제 모레미 항공이 운항하던 세스나 208이 이륙 직후 사카나카 야영지 근처에서 추락했습니다. 탑승자 12명 중 8명이 사망했으며, 프랑스, 영국, 스위스 국적자(영국인 조종사 포함)가 포함되어 있었습니다. 추락 원인은 엔진 결함으로, 압축기 터빈 날개가 황화 부식의 영향을 받았으나 항공기의 어떤 점검에서도 발견되지 않았습니다. 많은 이가 이 나라의 비행 기준에 대한 점검과 강화를 촉구하고 있지만, 이는 사파리를 기획하는 많은 업체에 타격이 될 수 있습니다."
 Botswana_pulse.15.a: "더 엄격한 통제를 요구한다!"
 Botswana_pulse.15.b: "이는 단 한 번의 사고일 뿐이다"
 Botswana_pulse.16.t: "또 다른 항공기 추락"
 Botswana_pulse.16.desc: "모레미 항공 추락 사고가 아직 사람들의 기억에 생생한 가운데, 비슷한 사고가 또 발생했습니다. 사파리 기획사가 운항하던 소형 터보프롭 항공기가 이륙 후 추락했습니다. 다행히 사고로 숨진 사람은 소수에 그쳤습니다. 이제 이 나라의 비행 기준을 강화하기 시작해야 할까요?"
 Botswana_pulse.16.a: "더 엄격한 통제를 요구한다!"
 Botswana_pulse.16.b: "이는 단 한 번의 사고일 뿐이다"
 Botswana_pulse.17.t: "음무시 외 대 라만텔레 외"
 Botswana_pulse.17.desc: "보츠와나에서 상속 문제를 둘러싼 소송이 제기되었습니다. 보츠와나 농촌에서 운영되는 전통 법정에 따르면, 막내 남자 자식이 항상 아버지의 집을 상속합니다. 문제는 한 남성과 그의 이복형제가 아버지의 집을 놓고 다투면서 시작되었습니다. 그러나 분쟁이 해결되기 전에 두 사람 모두 사망했습니다. 그러면 집은 이복형제의 아들 몰레피 라만텔레에게 넘어가게 됩니다. 이에 대해 분쟁이 시작된 이후로 집의 재정적 부담을 감당해 온 그의 고모들이 이의를 제기했습니다. 보츠와나 법원은 전통적인 상속 방식이 위헌이라며 고모들의 손을 들어 주었습니다. 보츠와나에서 여성의 재산 상속권이 인정된 것은 이번이 처음이었습니다."
 Botswana_pulse.17.a: "평등을 향한 한 걸음!"
 Botswana_pulse.17.b: "이복형제의 아들이 정당한 상속인이었어야 했다!"
 Botswana_pulse.18.t: "고몰레모 모츠왈레디 사망"
 Botswana_pulse.18.desc.1: "보츠와나 민주당(바라타-파티 파벌)의 고위 정치인 고몰레모 모츠왈레디가 어제 교통사고로 사망했습니다. 그는 한때 BDP 청년 연맹의 수장을 지냈습니다. 인기 있는 정치인이었던 만큼 BDP에게 큰 타격입니다."
 Botswana_pulse.18.desc.2: "고위 정치인 고몰레모 모츠왈레디가 어제 교통사고로 사망했습니다. 그는 BDP에서 경력을 시작했으며, 이후 탈당하여 BMD의 공동 창립자 중 한 명이 되었습니다. 인기 있는 정치인이었던 만큼 BMD에게 큰 타격입니다."
 Botswana_pulse.18.a: "평등을 향한 한 걸음!"
 Botswana_pulse.19.t: "거대한 다이아몬드 발견!"
 Botswana_pulse.19.desc: "카로웨 광산에서 거대한 다이아몬드가 발견되었습니다. 총 무게는 약 1100캐럿(220그램)이며 지름이 2인치 이상으로, 현재까지 발견된 다이아몬드 중 세 번째로 큽니다. 이 다이아몬드는 레세디 라 로나(우리의 빛)라고 명명되었습니다. 다이아몬드는 영국 보석상 그라프에 5300만 달러에 팔렸습니다."
 Botswana_pulse.19.a: "근사하군!"
 Botswana_pulse.20.t: "또 다른 거대한 다이아몬드 발견!"
 Botswana_pulse.20.desc: "카로웨 광산에서 다시 한번 거대한 다이아몬드가 발견되었습니다. 총 무게는 약 1700캐럿(350그램)이며 크기는 테니스공 정도입니다. 이는 이전의 레세디 라 로나를 넘어서는, 지금까지 발견된 두 번째로 큰 다이아몬드입니다. 이 다이아몬드는 세웰로(희귀한 발견)라고 명명되었습니다. 루이 뷔통이 현재 이 다이아몬드를 구입하는 데 관심을 보이고 있습니다. 다이아몬드로서는 이례적으로 얇은 검은 탄소층으로 덮여 있어 연마가 매우 까다롭습니다."
 Botswana_pulse.20.a: "근사하군!"
 Botswana_pulse.21.t: "전력 부족"
 Botswana_pulse.21.desc: "보츠와나를 포함한 남부 아프리카 대부분 지역은 에너지의 대부분을 남아프리카에서 공급받습니다. 남아프리카의 전력 생산에 차질이 생기면 다른 모든 나라에 영향이 미칩니다. 남아프리카는 현재 전력 부족 사태를 겪고 있으며, 이는 우리에게도 피해를 주고 있습니다. 앞으로 이를 피하려면 남아프리카에 대한 의존도를 줄이려 노력해야 합니다."
 Botswana_pulse.21.a: "근사하군!"
 Botswana_pulse.22.t: "보츠와나 자동차 회사 파산"
 Botswana_pulse.22.desc: "보츠와나 자동차 회사는 1993년부터 보츠와나에서 현대 자동차를 생산해 왔습니다. 부유한 짐바브웨인이 설립한 이 회사는 때때로 수상한 사업 관행에 손을 대, 차량을 먼저 모잠비크에서 수입한 뒤 분해하고 재조립하여 남아프리카로 선적하는 방식으로 값싸게 수출해 왔습니다. 어제 회사는 더 이상 감당할 수 없는 막대한 부채 때문에 문을 닫는다고 발표했습니다. 현대 자체는 조립 라인을 남아프리카 킴벌리로 옮길 계획이며, 이에 따라 보츠와나에서 900개의 일자리가 사라집니다."
 Botswana_pulse.22.a: "해고된 노동자들에게 특별 구제를 제공한다!"
 Botswana_pulse.22.b: "그저 사업일 뿐이다"
 Botswana_pulse.23.t: "크고시, 태형 혐의로 고발"
 Botswana_pulse.23.desc: "가장 큰 부족 가운데 한 곳의 크고시가 부족민 한 명을 범죄 혐의로 태형에 처했다는 이유로 고발당했습니다. 크고시는 이것이 전혀 문제가 없으며 크고시는 국가의 사법권으로부터 면제된다고 주장하고 있습니다. 그러나 법원은 크고시도 국가 헌법이나 의회가 정한 법률을 거스를 수 없다고 주장합니다."
 Botswana_pulse.23.a: "크고시는 유죄다!"
 Botswana_pulse.23.b: "크고시는 뜻대로 할 수 있다"
 Botswana_events.1.t: "보츠와나 전투기 구매"
 Botswana_events.1.desc: "노후한 전투기 전력을 교체할 때가 되었습니다. 어느 나라를 공급자로 선택해야 할까요?"
 Botswana_events.1.a: "[SWE.GetNameDef]"
 Botswana_events.1.b: "[USA.GetNameDef]"
 Botswana_events.1.c: "[CHI.GetNameDef]"
 Botswana_events.1.d: "[ENG.GetNameDef]"
 Botswana_events.2.t: "보츠와나, 공동 광케이블 제안"
 Botswana_events.2.desc: "보츠와나가 양국에 걸쳐 공동 광케이블을 깔아 두 나라의 네트워크를 서아프리카 해저 케이블 시스템에 직접 연결하자고 협력을 제안했습니다. 이는 양국의 네트워크 품질을 높일 것입니다."
 Botswana_events.2.a: "물론이지"
 Botswana_events.2.b: "안된다"
 Botswana_events.3.t: "나미비아의 동의"
 Botswana_events.3.desc: "나미비아가 이 협정에 동의했으며 우리의 네트워크 품질이 개선되었습니다."
 Botswana_events.3.a: "니스"
 Botswana_events.4.t: "제안을 거절한 나미비아"
 Botswana_events.4.desc: "나미비아가 네트워크 개선을 위해 협력하자는 우리의 제안을 거절했습니다."
 Botswana_events.4.a: "유감이군"
 Botswana_events.5.t: "코뿔소 뿔 제거 운동 성공"
 Botswana_events.5.desc: "지난 몇 달간 수백 마리의 코뿔소가 뿔을 제거당했습니다. 밀렵할 동기가 줄어들면서 국내에서 활동하는 밀렵꾼의 수가 대폭 감소한 것으로 보고할 수 있습니다."
 Botswana_events.5.a: "좋아"
 Botswana_events.6.t: "코뿔소 뿔 제거 운동 실패"
 Botswana_events.6.desc: "지난 몇 달간 수백 마리의 코뿔소가 뿔을 제거당했습니다. 그러나 밀렵꾼들에게는 아무런 영향이 없었던 것으로 보입니다. 밀렵꾼들은 평소처럼 코뿔소를 추적하며, 뿔이 없는 코뿔소를 따라잡더라도 그 동물을 다시 추적하느라 시간을 낭비할 위험을 피하기 위해 어차피 쏴 죽입니다. 우리가 이룬 것은 뿔 없는 코뿔소 몇 마리를 만든 것뿐인 듯합니다."
 Botswana_events.6.a: "그 모든 시간이 허사였다!"
 Botswana_news_events.1.t: "[BOT.GetNameDef]의 짐바브웨 압박"
 Botswana_news_events.1.desc: "[BOT.GetNameDef] 정부가 짐바브웨의 독재자 로버트 무가베에 대해 공세적인 접근을 취했습니다. 인권 침해를 이유로 [BOT.GetNameDef]은(는) 무가베에게 권좌에서 물러날 것을 요구했습니다."
 Botswana_news_events.1.a: "전쟁이 다가오는가?"
 Botswana_news_events.2.t: "전통을 받아들인 [BOT.GetNameDef]"
 Botswana_news_events.2.desc: "오늘 [BOT.GetNameDef]에서 놀라운 소식이 전해졌습니다. 일단의 부족 지도자들과 그 지지자들이 현 정부를 몰아내고 족장원을 보츠와나의 유일한 합법적 통치 기구로 삼았습니다. [BOT.GetLeader]은(는) 크고시골로, 즉 보츠와나의 최고 족장으로 즉위했습니다. 한때 보츠와나가 보여 주었던 민주주의의 빛나는 등불은 이제 과거의 일이 된 듯합니다."
 Botswana_news_events.2.a: "보츠와나는 현대성을 거부했다"
 Botswana_news_events.3.t: "[BOT.GetNameDef]의 부시맨 보호 맹세"
 Botswana_news_events.3.desc: "\"자국 내 산족의 지위를 개선하기 위한 조치를 취한 [BOT.GetNameDef] 정부는 이웃 나라인 [NAM.GetNameDef]에 눈길을 돌렸습니다. [NAM.GetNameDef]은 오랫동안 자국에 거주하는 산족에 대한 차별적 정책을 유지해 왔으며, 많은 산족이 국경을 넘어 보츠와나로 피신했습니다. [BOT.GetNameDef]은 필요하다면 무력을 동원해서라도 나미비아에 있는 산족의 권리를 보호하겠다고 다짐했습니다."
 Botswana_news_events.3.a: "오랜 평화가 깨졌다"
 BOT_military_reevaluation: "군 재평가"
 BOT_military_reevaluation_desc: "보츠와나 군은 개혁이 필요합니다. 새 천년은 새로운 도전을 가져옵니다."
 BOT_develop_anti_poaching_tactics: "밀렵 방지 전술 개발"
 BOT_develop_anti_poaching_tactics_desc: "우리 군을 훈련시키는 데 강대국의 도움은 필요하지 않습니다. 야생동물 보호를 통해 배운 것을 군사 교리로 발전시킬 수 있습니다."
 BOT_indian_military_cooperation: "인도와의 군사 협력"
 BOT_indian_military_cooperation_desc: "우리는 최근 인도에 공식적으로 대사관을 열었습니다. 인도는 이 대륙에 매우 관심이 많고 많은 인도인이 아프리카에 살고 있습니다. 이들은 우리 군을 훈련시킬 완벽한 파트너가 될 것입니다."
 BOT_american_military_cooperation: "미국과의 군사 협력"
 BOT_american_military_cooperation_desc: "미국인들은 오랜 동맹이며 우리는 소말리아에서 그들과 함께 일했습니다. 평화 유지와 아프리카 지원에 대한 이들의 헌신은 우리가 군사 파트너에게 바라는 바로 그것입니다."
 BOT_chinese_military_cooperation: "중국과의 군사 협력"
 BOT_chinese_military_cooperation_desc: "중국은 아프리카 대륙에서 비교적 새로운 일원이지만 우리를 돕는 데 매우 적극적입니다. 이들은 군을 운영하는 방식에 대해 새로운 관점을 제공할 것입니다."
 BOT_enlist_women: "여성 입대"
 BOT_enlist_women_desc: "보츠와나는 매우 진보적이고 현대적인 국가이지만 육군은 여성을 신병으로 받지 않습니다. 이는 바로잡아야 할 일이며, 군 입대 기회는 지난 20년간 여성 인권 운동가 은톰비 셋슈왈로가 촉구해 온 사안입니다. 이제 바츠와나 여성들이 조국을 위해 복무하도록 허용할 때입니다."
 BOT_institute_partial_draft: "부분 징병제 도입"
 BOT_institute_partial_draft_desc: "보츠와나는 인구가 적어 보안군에 인원을 확보하기가 어렵습니다. 여성을 군에 입대시키는 대신 부분 징병제를 도입하여 매년 최소한 일정 수의 신병을 보장할 수 있습니다."
 BOT_peacekeeping_army: "평화 유지에 집중"
 BOT_peacekeeping_army_desc: "보츠와나 방위군은 소말리아와 레소토 등 여러 국제 작전에 참여했습니다. 세계를 더 나은 곳으로 만들기 위해 우리가 집중해야 할 분야입니다. 물론 모든 군인이 주로 타국을 위해 피를 흘린다는 점에 만족하지는 않을 것입니다."
 BOT_anti_poaching_army: "밀렵 방지군"
 BOT_anti_poaching_army_desc: "우리의 가장 큰 문제 중 하나는 나라를 괴롭히는 밀렵입니다. 군을 훈련시켜 밀렵꾼과 싸우고 야생동물을 보호해야 합니다. 또한 발생할 수 있는 자연재해에 대비한 재난 구호 훈련도 시켜야 합니다. 우리 병사들은 지형을 훨씬 더 잘 알게 되겠지만, 전문 전투 병력으로서의 기량은 낮아질 것입니다."
 BOT_shift_to_traditional_military: "전통적 군대로 전환"
 BOT_shift_to_traditional_military_desc: "군의 군사 능력을 밀렵꾼과 싸우는 확대된 경찰력 수준으로 축소한 것은 실수였습니다. 이 전환을 되돌리고 군을 국가 안보를 보장하는 조직으로 만들어야 합니다."
 BOT_buy_pilatus_pc9: "필라투스 PC-9 도입"
 BOT_buy_pilatus_pc9_desc: "밀렵꾼을 더 잘 정찰하고 발견하려면 이 임무에 적합한 경항공기가 필요합니다. 스위스 기업 필라투스는 이에 안성맞춤인 경량 터보프롭기를 생산합니다. 이를 통해 밀렵꾼을 발견하고(때로는 폭격할) 수 있습니다."
 BOT_buy_hercules_c130: "수송기 전력 확장"
 BOT_buy_hercules_c130_desc: "평화유지군을 수송하고 보급하려면 수송기가 필요합니다. 우리는 이미 미국산 C-130을 일부 운용하고 있으며, 이 기존 전력을 확장해야 합니다."
 BOT_buy_gunships: "공격 헬리콥터 구입"
 BOT_buy_gunships_desc: "우리 육군의 향후 지상 작전을 지원하려면 근접 항공 지원이 필요합니다. 이 임무에는 공격 헬리콥터가 최선입니다. 러시아는 아프리카에 공격 헬리콥터를 공급해 온 오랜 역사가 있으며, Mi-24 하인드는 단연 고전입니다."
 BOT_zimbabwe_border_fence: "짐바브웨 국경 울타리"
 BOT_zimbabwe_border_fence_desc: "짐바브웨에서 번지는 구제역을 통제하기 위해 동물 이동을 막는 전기 울타리를 짐바브웨와의 국경에 설치해야 합니다. 공교롭게도 이는 짐바브웨 난민의 불법 월경도 막아 줄 것입니다."
 BOT_deploy_peacekeepers: "짐바브웨에 평화유지군 파견"
 BOT_deploy_peacekeepers_desc: "이웃 짐바브웨의 상황은 참담합니다. 국민들은 독재적이고 부패한 정권 아래서 고통받고 있습니다. 우리가 짐바브웨 정부와 연결해 둔 인맥을 동원하면 인권 침해를 구실로 [ZIM.GetLeader]을(를) 조용히 권좌에서 몰아낼 수 있을지도 모릅니다."
 BOT_topple_mugabe: "[ZIM.GetLeader] 타도"
 BOT_topple_mugabe_desc: "[ZIM.GetNameDef]의 인권 침해는 용납할 수 없습니다. 짐바브웨 지도자 [ZIM.GetLeader]을(를) 즉시 타도하고 짐바브웨 국민에게 자유를 가져다주어야 합니다."
 BOT_replace_f5s: "CF-5 교체"
 BOT_replace_f5s_desc: "1996년에 우리는 미국 F-5의 캐나다 면허 생산형인 CF-5 전투기 18대를 인수했습니다. 이 전투기들은 인수 당시에도 이미 구식이었습니다. 이제 보다 성능이 우수한 전투기로 공군 전력을 현대화할 때입니다."
 BOT_replace_f5s_tt: "다음 국가 중 한 곳에서 §Y다목적 항공기 12대§!를 총 §Y$$15 billion§!에 구입합니다"
 BOT_domestic_weapon_supply: "PAAM에 투자"
 BOT_domestic_weapon_supply_desc: "PAAM, 즉 범아프리카 탄약 제조사는 소화기 탄약을 생산하는 기업입니다. 이 회사에 투자하여 BDF의 공식 공급업체로 키워야 합니다. 탄약 외에도 우리의 소형 화기를 제조하고 정비하게 될 것입니다."
 BOT_militarise_tribes: "부족 무장화"
 BOT_militarise_tribes_desc: "방위군의 임무는 나라 전체를 지키는 것입니다. 그러나 지역 족장인 디크고시가 지역 수비대 역할을 할 사설 민병대를 직접 모집하도록 허용하면 지역 방위를 더 잘 처리할 수 있습니다."
 BOT_unite_bushmen: "부시맨 통합"
 BOT_unite_bushmen_desc: "이웃 나미비아는 우리와 비슷한 산족의 역사를 가지고 있습니다. 산족은 나미비아에서 차별과 강제 이주, 거의 노예에 가까운 처우를 겪고 있습니다. 수백 명의 산족이 국경을 넘어 보츠와나로 피신했습니다. 우리가 겪었던 고통을 산족이 겪도록 내버려 둘 수 없습니다."
 BOT_unite_bushmen_trigger_tt: "[Nat_Populism_L]이(가) 집권 연립의 일원입니다"
 BOT_ancestral_brothers: "조상의 형제들"
 BOT_ancestral_brothers_desc: "우리는 산족을 하나의 국가 아래 통합했습니다. 우리의 보호 아래 이들은 차별 없이 번영하며 자신들의 생활 방식을 유지할 수 있을 것입니다."
 BOT_meet_with_chiefs: "족장들과 회동"
 BOT_meet_with_chiefs_desc: "족장원과 정기적으로 회동하는 것은 부족들과의 대화를 유지하는 중요한 부분입니다."
 BOT_depose_mosadi_seboko: "모사디 세보코 폐위"
 BOT_depose_mosadi_seboko_desc: "발레테족의 크고시골로 모사디 세보코는 보츠와나 역사상 처음으로 족장원에 앉은 여성입니다. 이는 나라의 전통에 어긋나며 세보코에게는 많은 비판자와 반대자가 있습니다. 그의 직위를 박탈하고 대신 사촌 침마네 모크고시를 왕좌에 앉혀야 합니다."
 BOT_celebrate_mosadi_seboko: "모사디 세보코 경축"
 BOT_celebrate_mosadi_seboko_desc: "발레테족의 크고시골로 모사디 세보코는 보츠와나 역사상 처음으로 족장원에 앉은 여성입니다. 그는 단지 여성이라는 이유만으로 많은 비판자와 반대자를 두고 있습니다. 정부는 보츠와나의 평등을 향한 한 걸음으로서 그에 대한 지지를 표명해야 합니다."
 BOT_empower_the_house_of_chiefs: "족장원 권한 강화"
 BOT_empower_the_house_of_chiefs_desc: "족장원은 부족들에게 대표성을 주지만 권력은 주지 않습니다. 족장원을 실질적인 입법 기구로 바꾸고, 부족들에게 그들의 사안에 대한 일정한 자치권도 부여해야 합니다."
 BOT_keep_the_status_quo_of_chiefs: "현상 유지"
 BOT_keep_the_status_quo_of_chiefs_desc: "족장원은 지금 그대로도 괜찮으며 분란을 일으키려 해서는 안 됩니다."
 BOT_abolish_the_house_of_chiefs: "족장원 폐지"
 BOT_abolish_the_house_of_chiefs_desc: "족장원은 차별적이고 봉건적인 조직에 불과합니다. 특정 부족의 족장을 다른 부족보다 높이 올려놓으며, 일부 부족이 다른 부족보다 더 평등하다는 분명한 신호를 보냅니다. 이 제도를 폐지하고 모든 모츠와나가 나라에서 평등하게 대우받도록 해야 합니다."
 BOT_the_kgosikgolo: "크고시골로"
 BOT_the_kgosikgolo_desc: "보츠와나는 지배적인 츠와나 부족들이 다스리는 편이 나을 것입니다. 집권 [show_ruling_party]은(는) 부패한 조직이며 국민의 최선의 이익을 염두에 두고 있지 않습니다. 이러한 이유로 이들은 끌어내려져야 합니다."
 BOT_the_kgosikgolo_tt: "§C집중 §Y$BOT_militarise_tribes$§!을(를) 완료했다면 내전 가능성이 낮아집니다§!"
 BOT_judicial_reform: "사법 개혁"
 BOT_judicial_reform_desc: "보츠와나의 사법 제도는 상당히 낡았으며 현대화가 필요합니다."
 BOT_empower_unions: "노조 역량 강화"
 BOT_empower_unions_desc: "보츠와나에는 활동 중인 노동조합이 매우 적고 조합 참여율도 매우 낮습니다. 보츠와나 노동조합연맹과 협력하여 국내 모든 노동조합을 단결시키고 국민이 조합에 가입하도록 장려해야 합니다."
 BOT_end_bushmen_relocations: "부시맨 이주 중단"
 BOT_end_bushmen_relocations_desc: "산족을 칼라하리 수렵 보호구역 밖으로 이주시키는 정책은 잘못된 것이며, 산족에게 정부 서비스에 대한 더 나은 접근을 제공한다는 거짓 명분 아래 시행되어 왔습니다. 이들이 보호구역에서 전통적인 생활 방식대로 살도록 허용해야 합니다."
 BOT_ramp_up_bushmen_relocations: "부시맨 이주 가속화"
 BOT_ramp_up_bushmen_relocations_desc: "중앙 칼라하리 수렵 보호구역의 야생동물은 보호되어야 합니다. 산족은 이해하지 못할 수도 있지만, 모두 보호구역 밖으로 이주시켜 더 나은 삶을 제공하는 것이 낫습니다."
 BOT_total_ban_on_hunting: "사냥 전면 금지"
 BOT_total_ban_on_hunting_desc: "부시맨은 한동안 수렵 보호구역에서 사냥이 금지되어 왔지만, 충분히 높은 대가를 치르는 관광객에게는 계절 사냥이 가능했습니다. 더는 안 됩니다. 자연이 스스로 존재하도록 보호구역 내 모든 야생동물 사냥을 금지해야 합니다."
 BOT_found_NBB: "NBB 설립"
 BOT_found_NBB_desc: "NBB(국가 방송 위원회)는 보츠와나 전역의 방송 면허를 발급하고 라디오와 텔레비전 방송을 통제 및 감독하는 책임을 맡게 됩니다."
 BOT_increase_cattle_production: "축산업 육성"
 BOT_increase_cattle_production_desc: "대부분의 바츠와나는 소를 방목하여 생계를 꾸리므로 소는 우리 경제의 큰 부분을 차지합니다. 농업용 방목이 현재 우리가 직면한 환경 문제의 가장 큰 원인 중 하나이긴 하지만, 더 많은 축산 농가를 장려해야 합니다."
 BOT_optimise_cattle_production: "소 생산 최적화"
 BOT_optimise_cattle_production_desc: "대부분의 바츠와나는 소를 방목하여 생계를 꾸리므로 소는 우리 경제의 큰 부분을 차지합니다. 그러나 농업용 방목은 우리의 환경을 파괴하고 있습니다. 사바나에 미치는 영향을 줄이기 위해 새로운 방목 방식과 더 지속 가능하고 통제된 축산을 시도해야 합니다."
 BOT_clear_way_for_new_farms: "신규 농장에 길 터주기"
 BOT_clear_way_for_new_farms_desc: "방목에 쓸 수 있는 면적이 매우 제한적입니다. 현재 운영 중인 수렵 보호구역과 국립공원의 일부를 줄여 방목을 위한 공간을 더 확보해야 합니다."
 BOT_refine_the_musi_breed: "무시 품종 개량"
 BOT_refine_the_musi_breed_desc: "무시 품종은 보츠와나 기후에 더 잘 적응하도록 1980년대에 개량된 가축 소 품종입니다. 현대 기술로 일부 형질을 더욱 개량할 수 있습니다. 사용 면적당 육류 생산량이 늘어나면 환경에 가해지는 부담을 덜 수 있습니다."
 BOT_biofuel_experimentation: "바이오 연료 실험"
 BOT_biofuel_experimentation_desc: "소가 많으니 그 분뇨를 에너지 생산에 쓸 수 있지 않을까요? 이 문제에 대한 연구 프로젝트를 시작하여 무언가 성과를 낼 수 있는지 살펴봐야 합니다."
 BOT_biofuel_plants: "연료 생산형 축산업"
 BOT_biofuel_plants_desc: "소 분뇨는 메탄으로 전환할 수 있으며, 이는 석유의 더 깨끗한 대안 연료로 쓰일 수 있습니다. 메탄은 매우 깨끗한 연료인 에탄올로 더욱 정제할 수도 있습니다. 축산 농가, 마을, 가정에 이 공정을 수행할 장비를 제공해야 합니다. 이는 우리의 에너지 자립을 크게 향상시킬 것입니다."
 BOT_encourage_zimbabwean_immigration: "짐바브웨 난민 장려"
 BOT_encourage_zimbabwean_immigration_desc: "성장하는 축산업에는 더 많은 노동자가 필요합니다. 짐바브웨의 열악한 상황을 활용하여 국경을 넘는 사람들에게 조금 더 관대해져야 합니다."
 BOT_form_cattle_communes: "목축 공동체 결성"
 BOT_form_cattle_communes_desc: "축산 농가들이 조직하여 소규모 협동 집단을 이루도록 도와야 합니다. 이렇게 하면 농가들이 영농 방식을 더 잘 조직할 수 있을 것입니다."
 BOT_support_ditec: "디텍 모바일 지원"
 BOT_support_ditec_desc: "디텍 모바일은 보츠와나의 국내 휴대전화 제조업체입니다. 자체 전화기를 설계하고 제작하며, 아프리카에 필요한 혁신을 정확히 보여 주는 기업입니다."
 BOT_found_BIUST: "BIUST 설립"
 BOT_found_BIUST_desc: "현재 나라 전체에 대학이 하나뿐입니다. 교육 기회를 넓혀야 하며, 따라서 보츠와나 국제 과학기술대학교를 설립해야 합니다. 대학은 가보로네 북쪽의 팔라피 마을에 위치하며 보다 기술적인 연구에 중점을 둘 것입니다."
 BOT_found_UBSOM: "UBSOM 설립"
 BOT_found_UBSOM_desc: "보츠와나 대학교는 나라에서 가장 오래된 대학입니다. 이 대학에 의과대학을 설립해야 합니다. 이는 우리의 의료 부문에 도움이 되고 HIV 유행에 맞서는 우리의 효과를 높일 것입니다."
 BOT_support_deaftronics: "데프트로닉스 지원"
 BOT_support_deaftronics_desc: "데프트로닉스는 현재 보청기용 태양광 배터리를 개발 중인 기업입니다. 이 혁신은 아프리카의 수백만 청각 장애인에게 도움이 될 것입니다. 대부분의 지역에서 적합한 일반 배터리를 구하기가 비싸고 어렵기 때문입니다. 데프트로닉스의 태양광 배터리가 있으면 한 번만 구입하고 같은 배터리를 수년간 사용할 수 있습니다."
 BOT_namibia_botswana_fiber_cable: "보츠와나-나미비아 광케이블"
 BOT_namibia_botswana_fiber_cable_desc: "보츠와나의 현재 인터넷망은 세계 통신망으로 가는 관문으로서 남아프리카에 크게 의존하고 있습니다. 나미비아와 협력하여 양국에 걸쳐 광케이블을 깔고 우리의 네트워크를 서아프리카 해저 케이블 시스템에 직접 연결해야 합니다."
 BOT_national_space_program: "국가 우주 프로그램"
 BOT_national_space_program_desc: "많은 아프리카 국가가 자국 위성을 궤도에 쏘아 올리기를 열망하며, 이미 성공한 나라도 많습니다. 기술적으로 발전한 국가로서 우리도 이 무리에 합류해야 합니다. 우리는 핀란드 오울루 대학교라는 파트너를 찾았으며, 이들은 큐브샛 유형의 나노위성을 궤도에 올리는 것을 도와줄 것입니다."
 BOT_innovation_city: "혁신 도시"
 BOT_innovation_city_desc: "이제 오랫동안 첨단 기술 개발에 집중해 왔으므로, 가보로네에 이 모든 첨단 산업을 한 곳에 모으고 더 많은 산업을 유치할 비즈니스 파크를 건설해야 합니다."
 BOT_invest_in_debswana: "뎁스와나에 투자"
 BOT_invest_in_debswana_desc: "뎁스와나는 보츠와나에서 운영되는 주요 광업 기업입니다. 보츠와나 정부와 남아프리카의 드비어스 그룹의 합작 투자 기업으로, 다이아몬드 광산 4곳과 석탄 광산 1곳(대부분 보츠와나 북동부에 있습니다)을 운영합니다. 이들이 채굴 사업을 확장하도록 도와야 합니다."
 BOT_the_energy_debate: "에너지 논쟁"
 BOT_the_energy_debate_desc: "보츠와나 에너지의 70%는 이웃 남아프리카에서 수입하며, 자체 전력의 80%는 모루풀레 석탄 발전소에서 생산됩니다. 이러한 외국 에너지 의존과 단일 국내 에너지원에 대한 의존은 위험합니다. 남부 아프리카 전력 공동체에서 에너지 순수출국이 되어야 합니다."
 BOT_focus_on_coal: "석탄에 집중"
 BOT_focus_on_coal_desc: "보츠와나 전역에는 개발되지 않은 석탄 광맥이 많이 있으며, 일부 연구에 따르면 보츠와나는 세계에서 석탄이 가장 풍부한 나라 중 하나일 수 있으나 그 석탄 대부분은 아직 개발되지 않았습니다. 따라서 석탄에 집중해야 합니다."
 BOT_focus_on_coal_tt: "§C석탄에 집중하면 이웃 나라에 에너지를 판매하여 더 많은 수익을 낼 수 있지만 칼라하리에는 재앙이 될 것입니다!§!"
 BOT_focus_on_renewables: "재생 에너지에 집중"
 BOT_focus_on_renewables_desc: "보츠와나는 태양이 너무 작아 닿지 않는 마을이 없는 나라입니다. 세계 나머지 나라들에 본보기를 보이고 지속 가능한 에너지망을 구축해야 합니다. 비용이 많이 들겠지만 미래 세대를 위해 그만한 가치가 있을 것입니다."
 BOT_focus_on_renewables_tt: "§C재생 에너지에 집중하면 석탄을 사용할 때만큼의 수익은 나지 않지만 칼라하리에는 더 좋을 것입니다!§!"
 BOT_work_with_CIC: "CIC와 협력"
 BOT_work_with_CIC_desc: "영국령 버진아일랜드의 석탄 투자 법인 CIC는 현지 미퐁 인베스트먼츠 사와 함께 맘아불라에 탄전을 개발하는 데 관심을 보이고 있습니다. 그곳의 석탄 광맥은 남아프리카 석탄의 40%를 공급하는 남아프리카 워터베르크 탄전의 연장선에 있습니다. 잠재력은 분명히 존재하며 이는 우리의 석탄 생산을 크게 늘려 줄 것입니다. 이곳의 신설 기업은 츠와나 석탄이라고 불릴 것입니다."
 BOT_grid_expansion: "전력망 확장"
 BOT_grid_expansion_desc: "자체 전력을 생산할 수 있게 된 것은 좋은 일이지만, 전력을 나라 곳곳과 이웃 나라로 보낼 튼튼한 전력망도 필요합니다."
 BOT_solar_panel_grid: "태양광 패널 전력망"
 BOT_solar_panel_grid_desc: "우리의 지리적 위치를 고려하면 보츠와나에는 거의 항상 햇볕이 풍부합니다. 이는 태양광 발전소를 세우기에 놀라운 입지입니다."
 BOT_kalahari_exploitation: "칼라하리 개발"
 BOT_kalahari_exploitation_desc: "칼라하리에는 풍부한 다이아몬드 광맥이 있으며 인근 지역에는 석탄이 풍부합니다. 이 지역에서 츠와나 석탄의 사업을 확장해야 합니다."
 BOT_resource_excavation_research: "석탄 채굴 연구"
 BOT_resource_excavation_research_desc: "일부 석탄은 접근하기 어려운 곳에 있습니다. BIUST와 협력하여 가능한 모든 석탄을 채굴할 방법을 찾아야 합니다."
 BOT_wind_turbine_research: "풍력 터빈 연구"
 BOT_wind_turbine_research_desc: "현재 기술로는 보츠와나에 풍력 단지를 세우는 것이 불가능합니다. 바람 조건이 현대식 터빈에는 적합하지 않습니다. 이 문제의 해결책 연구에 투자해야 합니다."
 BOT_ethanol_power_plant: "에탄올 발전소"
 BOT_ethanol_power_plant_desc: "소 분뇨에서 얻은 에탄올을 사용하여 지속 가능한 전력 생산 방식을 만들 수 있습니다."
 BOT_botswana_steelworks: "보츠와나 제철소"
 BOT_botswana_steelworks_desc: "석탄을 더 캐내야 합니다! 여분의 석탄으로 제철소도 세울 수 있습니다."
 BOT_tuli_wind_park: "툴리 풍력 단지"
 BOT_tuli_wind_park_desc: "북부 툴리 수렵 보호구역은 보츠와나 동쪽 모서리에 있는 자연 공원입니다. 공원 인근의 지형은 풍력 발전 단지를 세우기에 적합하며, 그곳이 보츠와나 최초의 풍력 단지가 들어설 장소입니다."
 BOT_coal_powered_nation: "석탄으로 움직이는 국가"
 BOT_coal_powered_nation_desc: "석탄이 다이아몬드와 경쟁하는 자원이 되면서 새로운 경제 세력이 보츠와나를 장악하고 있습니다. 츠와나 석탄 기업은 보츠와나 정부에게 뎁스와나가 한 번도 그랬던 적 없을 만큼 훨씬 더 가치 있는 존재입니다."
 BOT_debswana_on_top: "뎁스와나, 지배적 지위 유지"
 BOT_debswana_on_top_desc: "재생 에너지 부문을 확장했음에도 대부분의 신규 발전소는 여러 소규모 기업이 운영합니다. 주요 다이아몬드 생산업체인 뎁스와나는 다이아몬드와 함께 여전히 보츠와나 경제의 핵심 주체 중 하나로 남아 있습니다."
 BOT_political_effort: "정치적 노력"
 BOT_political_effort_desc: "보츠와나 정치는 집권 BDP 정당이 지배하고 있습니다. 따라서 나라를 통치하는 데 반대 세력이 거의 없습니다."
 BOT_assert_independence: "독립 천명"
 BOT_assert_independence_desc: "인구와 국토 면적 모두에서 작은 나라인 우리는 외세의 영향에 취약합니다. 우리가 스스로의 길을 개척할 능력이 있음을 세계에 증명해야 합니다."
 BOT_found_indian_embassy: "인도에 대사관 설립"
 BOT_found_indian_embassy_desc: "인도는 1987년부터 가보로네에 대사관을 두고 있습니다. 그러나 우리는 아직 인도에 대사관을 설립하지 않았습니다. 호의에 보답하여 뉴델리에 대사관을 열어야 합니다."
 BOT_indian_diamond_institute: "인도-아프리카 다이아몬드 연구소"
 BOT_indian_diamond_institute_desc: "인도 다이아몬드 연구소가 보츠와나에 새로운 인도-아프리카 다이아몬드 연구소를 설립하자고 우리 정부에 연락해 왔습니다. 연구소는 인도인이 직원으로 일하며 다이아몬드 커팅, 연마, 등급 판정, 보석 제작을 가르칩니다. 이는 우리의 다이아몬드 생산 능력을 향상시킬 것입니다."
 BOT_us_relations: "미국에 접근"
 BOT_us_relations_desc: "미국은 오랫동안 보츠와나의 동맹이었으며 과거에 우리에게 막대한 개발 원조를 제공했습니다."
 BOT_found_ilea: "ILEA 설립"
 BOT_found_ilea_desc: "미국은 가보로네에 국제 법집행 아카데미를 설립하고자 합니다. 이 아카데미는 사하라 이남 아프리카 전역에 경찰 훈련을 제공할 것입니다."
 BOT_saf_relations: "남아프리카와의 협력"
 BOT_saf_relations_desc: "보츠와나는 아파르트헤이트 정권이 끝난 1994년부터 남아프리카와 외교 관계를 맺어 왔습니다. 두 나라는 1910년부터 남부 아프리카 관세 동맹의 일원이었으며 영국 연방의 일원이었던 역사도 공유합니다."
 BOT_security_against_zimbabwe: "짐바브웨에 대한 안보"
 BOT_security_against_zimbabwe_desc: "짐바브웨의 불안정은 보츠와나와 남아프리카 모두에 위협입니다. 이 문제에 대한 해결책을 찾아야 합니다."
 BOT_three_digkosi_nko: "만수대 해외 프로젝트 고용"
 BOT_three_digkosi_nko_desc: "정부는 영국인을 설득하여 베추아날란드를 남아프리카와 분리된 독자적 실체로 만든 세 명의 디크고시를 기리는 동상을 세울 계획입니다. 북한의 만수대 해외 프로젝트 사가 아프리카에서 건설 사업 경험이 풍부한 만큼, 이 회사를 고용하여 동상을 건립해야 합니다."
 BOT_three_digkosi_domestic: "국내에서 동상 건립"
 BOT_three_digkosi_domestic_desc: "정부는 영국인을 설득하여 베추아날란드를 남아프리카와 분리된 독자적 실체로 만든 세 명의 디크고시를 기리는 동상을 세울 계획입니다. 현지 보츠와나 기업을 고용하여 동상을 건립해야 합니다."
 BOT_condemn_north_korea: "북한을 규탄"
 BOT_condemn_north_korea_desc: "북한의 인권 침해는 용납할 수 없습니다. 우리는 그들과 모든 외교 관계를 끊어야 합니다. 이로써 보츠와나는 반도에서 유일한 진정한 한국 국가인 대한민국만을 인정하는 아프리카 최초의 국가가 될 것입니다."
 BOT_deepen_cooperation_with_nko: "북한과의 협력 심화"
 BOT_deepen_cooperation_with_nko_desc: "북한과 보츠와나 사이에 더 깊은 경제적, 외교적 유대를 구축하는 것을 목표로 해야 합니다."
 BOT_extra_funding_to_schools: "학교에 추가 자금 지원"
 BOT_extra_funding_to_schools_desc: "교육은 잘 작동하는 사회의 초석입니다. 청년을 교육하는 일을 소홀히 할 수 없습니다."
 BOT_introduce_school_fees: "학비 재도입"
 BOT_introduce_school_fees_desc: "보츠와나는 1980년대부터 완전 무상 교육을 제공해 왔습니다. 그러나 교육 비용은 계속 증가하고 있습니다. 격차를 메우기 위해 학비를 다시 도입해야 합니다. 인기는 없겠지만 필요한 일입니다."
 BOT_expand_nature_reserves: "수렵 보호구역 확장"
 BOT_expand_nature_reserves_desc: "야생동물을 더 잘 보호하기 위해 국가 수렵 보호구역을 확장해야 합니다."
 BOT_shrink_nature_reserves: "수렵 보호구역 축소"
 BOT_shrink_nature_reserves_desc: "보츠와나 국토의 20%가 국립공원으로 지정되어 있다는 점을 고려하면, 야생동물 보호 정책이 지나쳤을 수 있습니다. 그 땅의 일부를 개발할 수 있는 지역으로 되찾아야 합니다."
 BOT_remove_death_penalty: "사형제 폐지"
 BOT_remove_death_penalty_desc: "보츠와나는 아프리카에서 여전히 사형제를 유지하는 몇 안 되는 나라 중 하나입니다. 대략 연간 한 건의 사형이 집행되며(주로 가중 살인에 대한 것입니다) 형은 흔히 교수형으로 집행됩니다. 이는 비인도적인 관행이며 중단되어야 합니다."
 BOT_keep_death_penalty: "사형제 유지"
 BOT_keep_death_penalty_desc: "보츠와나는 아프리카에서 여전히 사형제를 유지하는 몇 안 되는 나라 중 하나입니다. 대략 연간 한 건의 사형이 집행되며(주로 가중 살인에 대한 것입니다) 형은 흔히 교수형으로 집행됩니다. 범죄자나 살인자에게 관용을 베풀 수 없으며, 그렇지 않으면 사회가 무너집니다. 사형제는 존속될 것입니다."
 BOT_prioritise_industrial_courts: "노동 법원 우선시"
 BOT_prioritise_industrial_courts_desc: "노동 법원은 모든 무역 및 산업 관련 분쟁을 처리하는 보츠와나 사법 제도의 일부입니다. 경제가 원활히 돌아가는 데 이들이 갖는 중요성을 강조해야 합니다."
 BOT_secure_workers_rights: "노동자 권리 보장"
 BOT_secure_workers_rights_desc: "광업 및 에너지 기업들이 열악한 환경에서 국민을 일하게 하며 이들을 착취하고 있습니다. 노동조합과 더 나은 근로 계약을 우리 국민을 위해 장려해야 합니다."
 BOT_anti_poaching_decisions: "칼라하리의 밀렵"
 BOT_anti_poaching_decisions_desc: "밀렵은 보츠와나의 심각한 문제입니다. 코뿔소와 코끼리 같은 동물은 뿔과 상아를 노린 총격을 받고 전통 의학에 쓰이도록 아시아 시장으로 운송됩니다. 일부 동물은 돈이 충분한 부유한 개인들이 단지 재미로 쏘아 죽이기도 합니다. 대부분의 §Y밀렵꾼§!은 이웃 나미비아와 잠비아에서 오지만 많은 바츠와나도 가담합니다. 보츠와나는 수십 년간 §Y밀렵꾼§!에게 강경한 입장을 취해 왔으며, 발견되는 즉시 §Y밀렵꾼§!을 사살하는 일도 드물지 않습니다.\n\n밀렵(및 기타 정책)은 칼라하리의 지속적인 사막화에 기여하는 요인입니다. 밀렵과의 싸움은 야생동물 보호의 핵심 요소입니다.\n\n§Y사막화§! 가능성: §R[?kalahari_expands]%§!\n§Y안정화§! 가능성: [?kalahari_steady]%\n§Y오아시스화§! 가능성: §G[?kalahari_retreats]%§!\n\n매월\n§Y[?chance_to_not_kill_poachers]%§!의 확률로 §Y새 밀렵꾼 15명§!이 활동을 시작합니다.\n§Y[?chance_to_kill_poachers]%§!의 확률로 우리 보안군이 §Y밀렵꾼 [?no_of_poachers_to_kill]명§!을 제거합니다.\n\n§Y국내 치안§! 지출을 늘리거나 추가 장비 또는 인력으로 병력을 보강하면 밀렵꾼을 제거할 확률을 높일 수 있습니다.\n\n현재 추정 밀렵꾼 수: [?no_of_poachers] ([BOT_threat_level_of_poachers])"
 BOT_bi_yearly_poaching_report: "연간 밀렵 보고서"
 BOT_bi_yearly_poaching_report_desc: "12개월마다 밀렵이 우리나라에 미치는 영향이 추정됩니다. §G낮은 위협§!은 §Y사막화§! 가능성을 낮추고, §R높은 위협§!은 §Y사막화§! 가능성을 높입니다."
 BOT_anti_poaching_dehorn_rhinos: "코뿔소 뿔 제거 운동"
 BOT_anti_poaching_dehorn_rhinos_desc: "올해 코뿔소 개체군의 뿔을 제거하는 것은 밀렵꾼이 코뿔소에게 접근하지 못하게 하는 좋은 방법이 될 수 있습니다. 뿔을 제거해도 코뿔소에게는 거의 영향이 없지만, 이는 밀렵꾼이 코뿔소를 추적하는 것을 단념시킬 수 있습니다."
 BOT_anti_poaching_dehorn_rhinos_tt: "§G운동이 성공하면 밀렵꾼의 수가 절반으로 줄어듭니다§!"
 BOT_industrial_conglomerates: "뎁스와나"
 BOT_landowners: "부족 족장"
 kgosikgolo_leader_trait: "크고시골로"
 BOT_FESTUS_MOGAE_DESC: "페스투스 모가에는 1998년에 취임한 보츠와나의 제3대 대통령입니다. 경제학 전문가인 그는 이전에 IMF와 보츠와나 은행에서 근무했으며 1989년부터 1998년까지 재무장관을 지냈습니다. 그의 가장 큰 선거 공약 중 하나는 빈곤과 국내에서 맹위를 떨치는 HIV 유행에 맞서는 것이었습니다."
 BOT_IAN_KHAMA_GENERATED_DESC: "이안 카마는 보츠와나의 초대 대통령 세레체 카마의 아들입니다. 1998년 정계에 입문하여 부통령이 되기 전, 카마는 보츠와나 방위군 사령관으로 복무했습니다. 카마는 짐바브웨의 로버트 무가베와 수단의 오마르 알바시르 같은 아프리카의 독재적 통치자들을 공개적으로 반대해 왔습니다.\n\n카마의 목표 중 하나는 보츠와나 경제를 다이아몬드 채굴에서 벗어나 농업과 관광으로 다변화하는 것입니다. 그는 또한 보츠와나의 가장 큰 문제로 보는 알코올 소비를 크게 줄이는 것을 목표로 하는 완고한 금주론자입니다."
 BOT_IAN_KHAMA_2017_DESC: "이안 카마는 보츠와나의 초대 대통령 세레체 카마의 아들입니다. 1998년 정계에 입문하여 부통령이 되기 전, 카마는 보츠와나 방위군 사령관으로 복무했습니다. 카마는 짐바브웨의 로버트 무가베와 수단의 오마르 알바시르 같은 아프리카의 독재적 통치자들을 공개적으로 반대해 왔습니다.\n\n카마의 목표 중 하나는 보츠와나 경제를 다이아몬드 채굴에서 벗어나 농업과 관광으로 다변화하는 것입니다. 그는 또한 완고한 금주론자로, 취임 당시 30%의 주류세를 부과했습니다(70% 세율 부과에는 실패한 뒤였습니다). 그는 2014년에 코끼리 사냥도 금지했습니다."
 BOT_MOKGWEETSI_MASISI_DESC: "모크웨치 마시시는 오랜 기간 활동한 모츠와나 정치인이자 외교관 에디슨 마시시의 아들입니다. 마시시는 영화 '사랑하는 조국이여 울어라'로 호평을 받았으며 여러 남아프리카 영화 제작에 참여했습니다. 마시시는 BDP 당수 직에서 이안 카마의 후임이 되었으며, 카마는 이 결정에 공개적으로 반대해 왔습니다. 마시시는 권위주의적 견해로 비판을 받아 왔으며 많은 이가 선거 부정과 보츠와나의 국제적 이미지 훼손의 책임을 그에게 묻고 있습니다. 마시시는 또한 하나의 중국 정책을 지지합니다."
