 HACS_equipment: "HACS"
 HACS_equipment_desc: "Боевая система высокой манёвренности (HACS) представляет собой новое поколение боевых механизированных подразделений. Обладая превосходной манёвренностью и передовым вооружением, подразделения HACS призваны обеспечить господство на поле боя и адаптироваться к различным боевым сценариям в противостоянии с силами CHIMERA."
 HACS_0: "HACS Mk. I"
 HACS_0_desc: "HACS Mk. I — это первое поколение боевых систем высокой манёвренности. Оснащённая базовым вооружением и бронёй, она служит надёжной платформой для ведения наземных боевых действий против сил CHIMERA."
 HACS_1: "HACS Mk. II"
 HACS_1_desc: "Новое поколение роботов HACS отличается большей манёвренностью по сравнению с предыдущей версией. Благодаря блестящим чертежам, предоставленным гражданскими лицами, HACS Mk. II представляет собой гораздо более смертоносное оружие, чем предыдущее поколение."
 HACS_2: "HACS Mk. III"
 HACS_2_desc: "Недавнее исследование рандалита позволило нам ещё больше усовершенствовать конструкцию HACS. Версия Mk. III отличается усиленной бронёй и усовершенствованными системами вооружения, что делает её нашим лучшим оружием для борьбы с войсками Химеры."
 CHIMERA_equipment: "CHIMERA"
 CHIMERA_equipment_desc: "Боевые единицы CHIMERA"
 CHIMERA_0: "Беллатрис"
 CHIMERA_0_desc: "«Беллатрис» — это боевая единица CHIMERA, предназначенная для ведения боевых действий на передовой. Она обладает передовыми наступательными возможностями и высокой бронёй, что позволяет ей эффективно действовать в различных боевых ситуациях."
 CHIMERA_1: "Брахионис"
 CHIMERA_1_desc: "«Брахионис» — это боевая единица CHIMERA, известная мощной защитой спереди, однако в целом она обладает более слабой бронёй по сравнению с другими единицами CHIMERA. Её самым смертоносным оружием являются когти, способные с лёгкостью разгромить противника в ближнем бою, но на расстоянии она уязвима."
