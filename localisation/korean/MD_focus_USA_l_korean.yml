 launch_pad_in_brazil_tt: "§Y우주 중점§! 보정:\n비용: §G-20%§!\n"
 mission_to_mars_tt: "유인 화성탐사 임무가 편성될 것입니다.\n"
 asteroid_mining_wait_period_tt: "We will need to scout and wait for a suitable asteroid for us to maneuver it to enter orbit around Earth.\n"
