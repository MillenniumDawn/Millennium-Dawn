 Opium_Economy: "Économie de l'opium"
 Opium_Economy_desc: "L'opium est une culture commerciale importante en Afghanistan depuis des siècles. Cependant, durant le chaos des dernières décennies et avec l'émergence du commerce mondial des stupéfiants, la culture de l'opium en Afghanistan s'est considérablement développée et une grande partie de l'économie rurale dépend désormais du pavot. Cependant, étant donné qu'une grande partie de l'opium est utilisée pour la fabrication de drogues illégales, il est difficile pour notre gouvernement de tirer profit de sa culture."
 Major_Non_NATO_Ally: "Allié majeur non membre de l'OTAN"
 Major_Non_NATO_Ally_desc: "Allié majeur non-membre de l'OTAN (MNNA) est une désignation donnée par le gouvernement des États-Unis aux alliés proches qui ont des relations de travail stratégiques avec les forces armées américaines mais qui ne sont pas membres de l'Organisation du traité de l'Atlantique Nord (OTAN). Bien que le statut de MNNA ne comprenne pas automatiquement un pacte de défense mutuelle avec les États-Unis, il confère une variété d'avantages militaires et financiers que les pays non membres de l'OTAN ne peuvent obtenir autrement."
 ISI_jihadist_islamic_state: "État islamique djihadiste"
 ISI_jihadist_islamic_state_desc: "[ISI.GetNameWithFlag] has rallied and the Caliphate remains strong. It is time to jihad against the infidels and end their puny existence!"
 isis_sleeper_cell_idea: "Cellules dormantes de l'État islamique"
 isis_sleeper_cell_idea_desc: "Ces satanés terroristes ont infiltré notre pays d'une manière ou d'une autre et causent des problèmes. Nous devons les arrêter avant qu'ils ne causent plus de sang, de larmes et de souffrances."
 israel_new_intifada: "Nouvelle intifada"
 hutu_tutsi_tensions: "Tensions Hutu/Tutsi"
 hutu_tutsi_tensions_desc: "The Hutu and the Tutsi are two separate ethnic groups living in the border regions between the Democratic Republic of the Congo and Tanzania, especially in the two small countries Burundi and Rwanda. Burundi is dominated by the Tutsi and committed a genocide against the Hutu in 1972, whereas Rwanda is dominated by the Hutu and had hundreds of thousands of Tutsis slaughtered by Hutu militias in 1994.\n\nThese two ethnic groups just seem to not get along, but have been forced into the same countries by the European-created colonial borders."
 generic_nationalist_boost_idea: "Montée du nationalisme"
 generic_western_boost_idea: "Allégeance pro-occidentale"
 generic_emerging_boost_idea: "Émergence orientale"
