 mass_arrests_of_cartel_members_decision_desc: "カルテルの関係者と疑われる者たちは、生活のさまざまな場面に紛れ込んでいる。我々は軍や警察を動員し、既知の、または疑いのあるカルテル関係者の逮捕を開始できる。"
