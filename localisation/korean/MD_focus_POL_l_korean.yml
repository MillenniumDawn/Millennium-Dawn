 POL_dangerous_game_idea: "위험한 게임"
 POL_dangerous_game_idea_desc: "나토와 CSTO는 바보들입니다. 그들은 자신이 안전하다고 생각하지만 우리의 위대한 동맹이 곧 그들을 능가할 것입니다."
