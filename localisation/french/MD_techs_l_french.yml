 nsb_gun_pods_tech_2_desc: "Systèmes d'armes montés à l'extérieur conçus pour améliorer les capacités offensives des aéronefs à voilure tournante. Ces nacelles permettent aux hélicoptères de transporter un armement supplémentaire sans modifications significatives de leur cellule, offrant une flexibilité et une puissance de feu accrue pour diverses missions."
