 light_tank_equipment_4: "Лёгкий танк 2035 года"
 BSH_Anti_Air_0: "9К32 «Стрела-2»"
 BSH_Anti_Air_0_desc: "Разработан в начале холодной войны с использованием метода пропорциональной навигации для захвата и уничтожения американских ядерных бомбардировщиков. Одна из самых простых систем ПВО, способная поражать цели на расстоянии 3700–4200 м."
 BSH_Anti_Air_1: "9К38 «Игла»"
 BSH_Anti_Air_1_desc: "«Игла» — более современная версия «Стрелы», принятая на вооружение в России в 2004 году. Она использует двухдиапазонную инфракрасную систему наведения (версия «С»), которая намного лучше, чем у «Стрелы»."
 BSH_Anti_Air_2: "9К38 «Игла-С»"
 BSH_Anti_Air_2_desc: "Новейший вариант, который является существенно улучшенным вариантом с большей дальностью действия, более чувствительным искателем, повышенной устойчивостью к последним мерам противодействия и более тяжелой боеголовкой. Производитель сообщает, что вероятность попадания составляет 0,8-0,9."
 BSH_Anti_Air_3: "9К42"
 BSH_Anti_Air_4: "9К48"
 BSH_APC_1: "БТР-60"
 BSH_APC_1_desc: "Одна из старейших машин, до сих пор находящихся на вооружении, БТР-60, оснащена 14,5-мм крупнокалиберным пулемётом КПВТ с боезапасом 500 патронов. Вспомогательное вооружение — спаренный пулемёт ПКТ калибра 7,62 мм с боезапасом 3,00 патрона. Отлично подходит для переброски лёгкой пехоты и сил быстрого реагирования (QRF)."
 BSH_APC_1_short: "БТР-60"
 BSH_APC_2: "МТ-ЛБ"
 BSH_APC_2_desc: "МТ-ЛБ был создан в 1970-х годах. Изготовлены дешево и быстро. Советы использовали их для легких противовоздушных и пехотных боев."
 BSH_APC_2_short: "МТ-ЛБ"
 BSH_APC_3: "БТР-70"
 BSH_APC_3_desc: "БТР-70 использовались с 1972 года, в советско-афганской войне они использовались для передвижения войск и последующей огневой поддержки. Единственное отличие от БТР-60 — более тяжелая броня."
 BSH_APC_3_short: "БТР-70"
 BSH_APC_4: "БТР-80"
 BSH_APC_4_desc: "БТР-80 — колесный БТР-амфибия с колесной формулой 8х8, разработанный в СССР. Он был принят на вооружение в 1986 году и заменил в Советской Армии предыдущие машины БТР-60 и БТР-70. Впервые он был применен во время советской войны в Афганистане."
 BSH_APC_4_short: "БТР-80"
 BSH_APC_5: "БТР-90"
 BSH_APC_5_desc: "Разработан в 1994 году для борьбы с боевиками. Оснащен мощной 30-мм пушкой Шипунова 2А42 с 500 патронами."
 BSH_APC_5_short: "БТР-90"
 BSH_APC_6: "Курганец-25"
 BSH_APC_6_desc: "«Курганец-25», одна из самых современных российских машин, был создан в 2015 году. Как БМП он вооружён лёгкой пушкой «Бумеранг-БМ» и 12,7-мм пулемётом «Корд». Во многом повторяет американскую БМП Bradley."
 BSH_APC_6_short: "Курганец-25"
 BSH_APC_7: "Курганец-35"
 BSH_APC_7_desc: "Во многом подобно «Курганцу-25», который в первую очередь является БМП, «Курганец-35» — это БТР: он может перевозить 12 человек и выполнять в операциях БМП примерно те же задачи, что и 25-й."
 BSH_APC_7_short: "Курганец-35"
 BSH_APC_8: "Курганец-45"
 BSH_APC_8_desc: "Об этом супер БТР известно немного, но он оснащен 40-мм пушкой и может перевозить 12 человек."
 BSH_APC_8_short: "Курганец-45"
 BSH_Heavy_Anti_tank_1: "БРДМ-2 9П148 «Конкурс»"
 BSH_Heavy_Anti_tank_1_desc: "Применялся во многих войнах и на многих машинах. Эффективная дальность — 500–3000 м."
 BSH_Heavy_Anti_tank_2: "МТ-ЛБ «Конкурс»"
 BSH_Heavy_Anti_tank_3: "«Корнет-Э»"
 BSH_Heavy_Anti_tank_4: "«Корнет-ДМ»"
 BSH_IFV_1: "БМП-1"
 BSH_IFV_1_desc: "БМП-1 — советская гусеничная плавающая боевая машина пехоты. Применялась в советско-афганской войне для перевозки войск и борьбы с джихадистами. Вооружена 73-мм орудием 2А28 и пусковой установкой ПТУР."
 BSH_IFV_1_short: "БМП-1"
 BSH_IFV_2: "БМП-2"
 BSH_IFV_2_desc: "Самый большой страх джихадистов — это БМП-2, чрезвычайно быстрая и эффективная благодаря 30-мм пушке и перемалывающим гусеницам."
 BSH_IFV_2_short: "БМП-2"
 BSH_IFV_3: "БМП-2М"
 BSH_IFV_3_short: "БМП-2М"
 BSH_IFV_4: "БМП-3"
 BSH_IFV_4_desc: "БМП-3 — советская боевая машина пехоты, преемница БМП-1 и БМП-2. Стрельба из 100-мм пушки тяжелыми фугасными снарядами."
 BSH_IFV_4_short: "БМП-3"
 BSH_IFV_5: "БМП-3М"
 BSH_IFV_5_desc: "БМП-3М — советская боевая машина пехоты, преемница БМП-1 и БМП-2 и вариант БМП-3. Использует модернизированную пушку и двигатель."
 BSH_IFV_5_short: "БМП-3М"
 BSH_IFV_6: "Т-15 «Армата»"
