 EUvote.1.t: "EU議会の投票開始"
 EUvote.1.d: "EU議会が議案を投票にかけた！議案を確認して、可決か否決の判断をするために、EUの議会セクションをチェックしよう。"
 EUvote.1.a: "投票だ！"
 EUvote.2.t: "欧州理事会の投票開始"
 EUvote.2.d: "EU理事会が新法案の採決を開始した！EU理事会セクションから投票を行い、他の国々に影響を与えよう！"
 EUvote.2.a: "投票だ！"
 EUU_idea_gdpr: "一般データ保護規則"
 EUU_idea_gdpr_desc: "§Y一般データ保護規則§!(GDPR)は、欧州連合および欧州経済領域(EEA)内の情報プライバシーに関する欧州連合の規則である。これはEUのプライバシーおよび人権法の重要な構成要素、特に§Y欧州連合基本権憲章§!の第8条(1)と見なされている。この規則の主な目標は、個人が自身のデータおよび個人情報を管理する能力を強化し、国際的なビジネス目的のための規制を簡素化することである。"
 foreign_data_kraken: "海外データクラーケン"
 foreign_data_kraken_desc: "海外データクラーケンは、一般データ保護規則（GDPR）に先立つ一連の法律を表している。これらの法律にはいくつかの抜け道や欠陥があり、欧州連合加盟国の長期的な安全性にとって問題を引き起こしている。"
 EU_copyright: "デジタル単一市場における著作権に関する指令"
 EU_copyright_desc: "§Yデジタル単一市場における著作権に関する指令§!は、著作権のための十分に機能する市場を確保するために採択された欧州連合の指令である。これは欧州連合の著作権法を拡張し、単一のデジタル市場に拡大するものである。"
 asylum_shopping: "アサイラム・ショッピング"
 asylum_shopping_desc: "Asylum seekers from all across the world continue to shop around the European Union for the most favorable asylum nation. It causes bureaucratic drain all across the European Union and it should be something we seek to remedy as soon as possible."
 relocation_asylum_seekers: "亡命希望者の移転および再定住"
 relocation_asylum_seekers_desc: "我々は、圧倒的な数の移民を抑えるために、亡命希望者の移転および再定住に着手した。この増大する問題に対して、より恒久的な解決策を探さなければならない。"
 EU_Turkey_deal: "EU・トルコ協定"
 EU_Turkey_deal_desc: "EU・トルコ協定は、トルコからギリシャの島々へ非正規に渡航する人々の抑制を意図していた。これは欧州連合への不法移民を抑制しようとする画期的な協定であったが、これが庇護希望者の流入を抑制するかどうかはまだ不明である。"
 European_Asylum_Agency: "欧州庇護機関"
 European_Asylum_Agency_desc: "§Y欧州庇護機関§!は、庇護に関する欧州連合加盟国の協力を強化し、共通欧州庇護制度の実施を改善し、庇護希望者からの圧力下にある加盟国を支援するための欧州連合内の機関である。"
 Frontex: "Frontex"
 Frontex_desc: "欧州国境沿岸警備機関、通称Frontexは、欧州連合の機関である。加盟国の国境警備隊および沿岸警備隊と連携して、シェンゲン圏の国境管理を行う。"
 European_Defence_Fund: "欧州防衛基金"
 European_Defence_Fund_desc: "§Y欧州防衛基金§!は、欧州連合の共通安全保障防衛政策(CSDP)の構成要素の一つである。CSDPは防衛研究への国家投資を調整および増加させ、欧州加盟国の国軍間の相互運用性を向上させることを目指している。特にEDFは、共同防衛プロジェクトに資金を提供するプログラムである。"
 European_Security_Council: "欧州安全保障理事会"
 European_Security_Council_desc: "§Y欧州安全保障理事会§!は、欧州連合が関与するあらゆる事態において、欧州連合が迅速かつ効果的に戦略的に考え、行動することへの支援を目的とした安全保障理事会である。"
 EUU_cfr_eu: "欧州連合基本権憲章"
 EUU_cfr_eu_desc: "The §YCharter of Fundamental Rights of the European Union§! enshrines political, social and economic rights for the European Union citizens and residents into European Law. The charter forms part of the area of freedom, security and justice (AFSJ) policy domain of the European Union. It applies to all bodies of the European Union and Euratom which must act and legislate by its provisions."
 european_spirit: "ヨーロッパ精神"
 european_spirit_desc: "永遠に、我々は分裂しているよりも団結している方が強い。我々は、大陸と世界全体の向上のために、欧州連合を強化し続けなければならない。"
 ECB_zero_interest_rate_policy: "ECBゼロ金利政策"
 ECB_zero_interest_rate_policy_desc: "ECBゼロ金利政策は、欧州中央銀行が策定した金融政策決定を達成するためのマクロ経済概念の一部である。ECBゼロ金利政策は、しばしば経済成長の鈍化、デフレ、デレバレッジと関連付けられるため、いくらかのストレスにさらされている。"
 EUU_national_dept_crisis_eu: "国家債務危機"
 EUU_national_dept_crisis_eu_desc: "アメリカ合衆国における大不況は、世界の多くの地域に波及効果を及ぼし続けている。ヨーロッパにおける国家債務危機は、進行中の波及効果の一例にすぎない。我が国の増大する債務は、ユーロ全体を脅かし始めている。"
 european_debt_crisis: "欧州債務危機"
 european_debt_crisis_desc: "アメリカ合衆国における大不況は、世界の多くの地域に波及効果を及ぼし続けている。いくつかのEU加盟国は、大不況の影響で苦境に立たされている。"
 euro_bonds: "ユーロ債"
 euro_bonds_desc: "ユーロ債は公的債務の資金調達のための新たな選択肢である。ユーロ圏加盟国へのユーロ債発行は、その債務の資金調達を支援し、米国債市場と競合する流動性の高い投資機会を貯蓄者に提供する。"
 euro_rescue_package: "ユーロ救済パッケージ"
 euro_rescue_package_desc: "欧州中央銀行は、債務危機の流れを食い止め、再び制御下に置くために救済パッケージを発行した。これは費用のかかる措置であるが、ユーロ圏の現在の経済状況を安定させるはずである。"
 fiscal_union: "財政統合"
 fiscal_union_desc: "欧州連合の財政統合により、我々は共通予算をさらに共有することが可能となる。これは、欧州連合内での一体感の高まりと、連合全体を前進させるために行われている譲歩という点をさらに推し進めるものである。"
 European_Economic_Government: "欧州経済政府"
 European_Economic_Government_desc: "欧州経済政府の設立は、[EUU.GetFlag][EUU.GetName]全体が税務当局を設立し、加盟国の歳出目標を設定するための先例と能力を確立した。"
 withdrawal_treaty: "離脱協定"
 withdrawal_treaty_desc: "我々が欧州連合から離脱するにあたり、貿易協定やその他の政治的譲歩を維持するための合意を含む離脱協定を達成した。"
 no_deal_exit: "合意無き離脱"
 no_deal_exit_desc: "我々は合意なき離脱を選択した。我が国の欧州連合離脱の詳細について合意することができなかった。"
 austerity: "緊縮財政"
 austerity_desc: "我々は欧州委員会のトロイカ改革の目標を達成した。我が国のために緊縮財政を成し遂げ、それによって我々の経済は安定し続けている。"
 EUU_voting_rights_suspended: "EU理事会におけるEU投票権の停止"
 EUU_voting_rights_suspended_desc: "欧州の価値観に対する度重なる違反により、我々の欧州連合における投票権は停止された。我々が国が進む方向を変えるか、あるいは連合からの離脱を検討すべき時である。"
 EUU_subsidies_suspended: "EU補助金の停止"
 EUU_subsidies_suspended_desc: "我々がかつて受け取っていた欧州連合の補助金は現在停止されている。我々の予算の突然の変化には慣れが必要であり、我々に割り当てられた補助金を再び活用するために状況を改善する方法を検討すべきである。"
 EU_office_category: "欧州連合の役職"
 EU_office_category_desc: "[EUU.GetFlag]\n\n[POTEF_polls_loc]"
 EU_Tech_Share_name: "欧州防衛機関(EDA)"
 EU_Tech_Share_desc: "加盟国は研究努力を結集する。欧州防衛機関(EDA)は欧州連合加盟国間の取り組みを調整する。"
 tooltip_ECB_Start_OMT_effect: "§G左クリック時:§! §YOMTプログラム§!が利用可能になる。\n\n§G右クリック時:§! §YOMT規模上限§!>$0"
 tooltip_ECB_Outright_Monetary_Transactions_available: "§YOMT規模上限§!>$0"
 tooltip_ECB_Outright_Monetary_Transactions_complete_effect: "All member states with §Yinterest rate§! > §R4.0%§!: Debt is reduced till §Yinterest rate§! < §R4.0%§! AND §GOMT Size Limit§! > §BOMT Total Value§!.\n"
 tooltip_ECB_Outright_Monetary_Transactions_remove_effect: "§BOMT勘定§!>$0の全加盟国:債務に§BOMT勘定§!を§R加算§!する。\n"
 EU_exit_category: "欧州連合からの離脱"
 EU_exit_category_desc: "EU全体で欧州懐疑主義が高まる中、一部の加盟国は§C[EUU.GetFlag]欧州連合§!からの離脱を検討するだろう。"
 EU_Article_50: "欧州連合からの離脱（第50条）"
 EU_Article_50_desc: "「いかなる加盟国も、自国の憲法上の要件に従って、連合から脱退することを決定することができる。」\n-欧州連合条約第50条第1項\n\n第50条は当初、欧州憲法条約のために起草された。欧州憲法の批准プロセスが失敗した後、この条項はリスボン条約に組み込まれた。"
 EU_Revoke_Article_50: "リスボン条約第50条の破棄"
 EU_Revoke_Article_50_desc: "第50条を撤回し、§C[EUU.GetFlag]欧州連合§!に残留する！\n「欧州連合条約第50条は、加盟国が同条に従って欧州理事会に欧州連合からの脱退の意向を通知した場合、当該加盟国と欧州連合との間で締結された離脱協定が発効していない限り、または、そのような協定が締結されていない場合は、同条約第50条第3項に定められた2年間（同項により延長される可能性あり）が満了していない限り、当該加盟国が、その憲法上の要件に従って撤回決定を行った後、欧州理事会に書面で通知することにより、明白かつ無条件の方法で、一方的にその通知を撤回することを認めるものと解釈されなければならない。その撤回の目的は、当該加盟国のEU加盟資格を加盟国としての地位に関して変更なく確認することであり、その撤回は離脱手続きを終了させる。」\n-欧州連合司法裁判所判決 事件番号C-621/18"
 EU_exit: "EU離脱"
 EU_exit_desc: "§Y[ROOT.GetNameWithFlag]§! has notified the European Council of its intention to leave §C[EUU.GetFlag] The European Union§!. §Y[ROOT.GetNameWithFlag]§! will leave the Union two years after the notification."
 EU_extend_Article_50: "第50条の延長"
 EU_extend_Article_50_desc: "§C[EUU.GetFlag]欧州連合§!に第50条の延長を要請し、後日連合を離脱する。"
 EU_exit_three_month: "3ヶ月の延長"
 EU_exit_three_month_desc: "§Y[ROOT.GetNameWithFlag]§! was granted a three-month extension of Article 50 by §C[EUU.GetFlag] The European Union§!. §Y[ROOT.GetNameWithFlag]§! will leave the Union after a period of three months."
 EU_withdrawal_treaty: "離脱条約"
 EU_withdrawal_treaty_desc: "§Y[ROOT.GetNameWithFlag]§!と§C[EUU.GetFlag]欧州連合§!の加盟国は離脱協定に合意した。"
 tooltip_EU_exit_available: "§Y[ROOT.GetNameWithFlag]§!は現在§C[EUU.GetFlag][EUU.GetName]§!からの離脱を試みていない"
 tooltip_EU_exit_cancel_trigger: "§Y[ROOT.GetNameWithFlag]§!はディシジョン§Y第50条を撤回する§!を発動中である。"
 tooltip_EU_Revoke_Article_50_available: "§Y[ROOT.GetNameWithFlag]§!はミッション§YEU離脱§!またはミッション§Y3ヶ月の延長§!を実行中である。"
 tooltip_EU_Revoke_Article_50_effect: "§Y[ROOT.GetNameWithFlag]§!は§Y[EUU.GetFlag]欧州連合§!に残留する。ミッション§YEU離脱§!およびミッション§Y3ヶ月の延長§!は削除される。\n今後§Y180日間§!は§Y第50条§!を発動できなくなる！"
 tooltip_EU_extend_Article_50_available: "§Y[ROOT.GetNameWithFlag]§!はミッション§YEU離脱§!またはミッション§Y3ヶ月の延長§!を実行中\nかつ[ROOT.GetNameWithFlag]はEUの外交政策責任者に対して25％以上の影響力を持っていなければならない。"
 tooltip_EU_remove_laws_and_offices: "すべての§YEU法と役職§!を削除する。\n"
 EU_defense_category: "EUの防衛政策"
 EU_defense_category_desc: "1950年代、欧州防衛共同体の構想はフランス議会での批准を得られず頓挫した。その後継となったのが欧州連合の共通安全保障防衛政策である。ヨーロッパ諸国の大多数が北大西洋条約機構(NATO)の加盟国であったため、20世紀を通じて独自の欧州防衛組織の必要性は認識されていなかった。しかし、21世紀に入り世界的な緊張が高まる中で、状況は変化している。"
 EU_Frontex_take_control: "Frontex部隊の指揮権掌握"
 EU_Frontex_take_control_desc: "ヨーロッパの対外国境では、近年EUへの入国を希望する移民や難民の数が前例のないほど増加している。対外国境を持つ国は国境管理に単独で責任を負う。しかし、Frontexは深刻な移民圧力に直面しているEU諸国に追加の技術支援を提供することができる。\nこれは、追加の技術装備（例：航空機や船舶）と特別に訓練された国境警備隊員の展開を調整することによって行われる。"
 EU_EuroNavy_take_control: "欧州海軍の指揮権掌握"
 EU_EuroNavy_take_control_desc: "21世紀において多国籍艦隊や任務部隊がより一般的かつ重要になる中、§C[EUU.GetFlag]欧州連合§!の加盟国は、その戦力を結集し、軍艦を§Y欧州海軍§!として知られる統一欧州海軍司令部に移管することを決定した。"
 EU_EuroArmy_take_control: "欧州軍の指揮権掌握"
 EU_EuroArmy_take_control_desc: "§C[EUU.GetFlag]欧州連合§!の加盟国は、§Y欧州軍§!として知られる共通軍を創設することを決定した"
 EU_create_EDU: "欧州防衛連合(EDU)の結成"
 EU_create_EDU_desc: "集団的利益を守り、外部の紛争や危機に対応し、近隣地域に安全保障を投射するために必要な戦略的自律性を達成するため、加盟国は軍事同盟として§Y欧州防衛連合(EDU)§!を結成し、集団的に§YNATO§!から脱退することを決定した。"
 EU_military_exercise: "[FROM.GetAdjective]国境での軍事演習準備"
 EU_military_exercise_desc: "[FROM.GetAdjective]国境での軍事演習準備"
 EU_ask_to_host_military_exercise: "国境での軍事演習の受け入れ要請"
 EU_ask_to_host_military_exercise_desc: "[FROM.GetNameWithFlag]に国境での軍事演習の受け入れを要請する"
 EU_military_exercise_mission: "軍事演習を実施する"
 EU_military_exercise_mission_desc: "軍事演習を実施する"
 counter_military_exercise_mission: "対抗軍事演習"
 counter_military_exercise_mission_desc: "対抗軍事演習"
 EU_military_exercise_threat: "軍事演習"
 EU_apply_for_membership_category: "EUへの加盟"
 EU_apply_for_membership_category_desc: "EUへの加盟は複雑な手続きであり、一朝一夕にできるものではない。申請国が加盟条件を満たすと、すべての領域でEUの規則や規制を実施しなければならない。\nこれは加盟条件を満たした国であれば、誰でも申請することができ、これらの条件は「コペンハーゲン基準」として知られており、自由市場経済、安定した民主主義と法の支配、ユーロを含むすべてのEU法の受諾が含まれている。"
 EU_apply_for_membership: "EUへの加盟"
 EU_apply_for_membership_desc: "§Y[ROOT.GetNameWithFlag]§! can join §C[EUU.GetFlag] The European Union§!. Let's sing the Ode to Joy:\nJoy, beautiful spark of Divinity,\nDaughter of Elysium,\nWe enter, drunk with fire,\nHeavenly One, thy sanctuary!\nYour magic binds again\nWhat custom strictly divided;\nAll people become brothers,\nWhere your gentle wing abides. "
 USoE_integrate_new_members: "新規加盟国の統合"
 USoE_integrate_new_members_desc: "さらなる国々が前進し、連合への参加を決定した。これらの新規加盟国を統合し、ヨーロッパ合衆国をさらに強化する時が来た。"
 tooltip_leader_of_EU_trade_policy_influence_3_percent: "§C[EUU.GetFlag]欧州連合貿易政策主導国§!（§Y欧州委員会委員長§!、§Y欧州理事会議長§!、§Y欧州議会議長§!）は、すべての§C[EUU.GetFlag]欧州連合§!加盟国に対して3%を超える影響力を持っていなければならない"
