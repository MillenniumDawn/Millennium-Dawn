 computing_1: "Mainframe Computing"
 computing_1_desc: "Large, high-speed computers are used primarily by large organizations for critical applications, bulk data processing and other large processing jobs.\n"
 computing_2: "Microcomputing"
 computing_2_desc: "The theory of microcomputing comes from the introduction of microprocessors to the computing field. The microprocessor's introduction has allowed computers to become more powerful and increased the logic capacity of computers, paving the way for greater usages of personal home computers.\n"
 computing_3: "Improved Computing"
 computing_3_desc: "Computers are becoming more and more popular as time goes on. Computers can now sit comfortably on a desk, allowing for people to have the ability to play games, write papers, and many other comforts that people have never thought possible.\n"
 computing_4: "Advanced Computing"
 computing_4_desc: "The introduction of the very first desktops in their contemporary form in the mid-2000s has given way to an information explosion. People now have the ability to do so much more.\n"
 computing_5: "Modern Computing"
 computing_5_desc: "Now technology in computers has proceeded quickly that computers that were once in giant server boxes have now become as small as a tablet. Processing power is triple, if not five times, as powerful as it was at the invention of the very first computers.\n"
 computing_6: "Quantum Computing"
 computing_6_desc: "Quantum computing began in the early 1980s when physicist Paul Benioff proposed a quantum mechanical model of the Turing machine. Scientists later suggested that a quantum computer could perform simulations that are out of reach for regular computers. Early practical quantum systems use controlled qubits and error correction to accelerate specialized tasks in cryptography, materials research, and complex military simulations.\n"
 computing_7: "Advanced Quantum Computing"
 computing_7_desc: "Advanced quantum systems expand reliable logical qubit counts, improve quantum algorithms, and integrate with classical supercomputers, allowing more practical use in military research, logistics, and secure communications.\n"
 computing_8: "Distributed Quantum Processors"
 computing_8_desc: "Distributed quantum processors link multiple quantum modules into larger computing systems, increasing circuit depth, algorithm complexity, and the scale of problems that can be solved reliably.\n"
 computing_9: "Hybrid Quantum Supercomputing"
 computing_9_desc: "Hybrid quantum supercomputers combine quantum accelerators with high-performance classical systems, using each architecture for the tasks it handles best in large-scale scientific and strategic computation.\n"
 computing_10: "Distributed Quantum Supercomputing"
 computing_10_desc: "Distributed quantum supercomputers connect large fault-tolerant processor arrays through specialized control, networking, and error-correction systems, enabling advanced simulations, optimization, and cryptographic analysis.\n"
 computing_11: "Strategic Quantum Compute Networks"
 computing_11_desc: "Strategic quantum compute networks link vast quantum processors and AI-driven control systems to coordinate and optimize military and industrial assests across the entire nation.\n"
