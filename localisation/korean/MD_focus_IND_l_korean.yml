l_korean:
 indonesia_focus: "인도네시아 중점 계통도"
 IND_indonesias_future: "인도네시아의 미래"
 IND_indonesias_future_desc: "우리는 모든 문제를 떠안고 21세기에 들어섰습니다. 우리는 이를 해결할 방법을 모색하고 우리의 마땅한 가치를 인정받야만 합니다!"
 IND_asia_financial_crisis: "위기를 해결하라!"
 IND_asia_financial_crisis_desc: "1997년 이래 금융 위기가 동남아시아를 강타했으며, 우리나라도 그 치명적인 영향을 피하지 못했습니다. 이제 이 문제를 해결할 계획을 수립해 나갈 것입니다."
 IND_japanese_aid: "일본의 원조 요청"
 IND_japanese_aid_desc: "제2차 세계 대전에서의 갈등에도 불구하고, 일본은 우리의 경제난에 비교적 호의적이었습니다. 이 상황에서 벗어날 수 있도록 일본과 그 서방 동맹국들에 연락해 도움을 구해야 합니다."
 IND_japanese_aid_jica: "일본 국제협력기구 (JICA)"
 IND_japanese_aid_jica_desc: "일본 국제협력기구로도 알려진 JICA는 우리나라의 기반시설과 도로를 개발하는 데 매우 유용한 조직이 될 수 있습니다."
 IND_japanese_aid_metro_invest: "일본식 철도 투자"
 IND_japanese_aid_metro_invest_desc: "우리 국민은 전국을 빠르게 이동할 수 있어야 하며, 일본의 지하철 기술과 투자로 이 목표를 달성할 수 있습니다."
 IND_japanese_aid_java_airport: "서자와 공항"
 IND_japanese_aid_java_airport_desc: "늘어나는 항공 이용객과 관광객을 위해 우리나라에는 더 많은 공항이 필요합니다. 서자바는 수도가 있는 곳이므로 공항을 건설하기에 가장 적합한 곳입니다."
 IND_japanese_aid_ev: "일본 전기자동차"
 IND_japanese_aid_ev_desc: "일본은 전기 자동차 분야의 선두 주자이며 훌륭한 자동차가 많이 생산되고 있으므로, 오염을 줄이기 위해 국민을 전기차로 전환하는 과정을 시작하는 것이 최선입니다."
 IND_japanese_aid_mitsubishi: "미쓰비시 공장"
 IND_japanese_aid_mitsubishi_desc: "미쓰비시는 일본에 본사를 둔 성공적인 자동차 제조업체입니다. 이들의 사무소를 인도네시아에 유치할 수 있다면 자동차에 관해 한두 가지 배울 수 있을 것입니다."
 IND_japanese_aid_expander_bagero: "The Xpander and Pajero!"
 IND_japanese_aid_expander_bagero_desc: "독창성과 장인정신의 진정한 위업인 엑스팬더와 파제로는 전기차 산업의 진정한 경이이며, 이제 인도네시아 국민도 이용할 수 있습니다."
 IND_japanese_aid_inf_finance: "일본과 인도네시아 기반 기금 (IFF) 협약"
 IND_japanese_aid_inf_finance_desc: "인도네시아 기반시설 금융으로도 알려진 IIF는 민간 기업이지만, 우리나라의 기반시설을 건설할 때는 대충하기보다 일본과 거래를 맺어 비용을 줄이는 것이 최선입니다."
 IND_japanese_aid_men_for_finance: "IFF에 일본 인력 투입"
 IND_japanese_aid_men_for_finance_desc: "일본으로부터 IIF에 필요한 인력을 확보할 수 있다면 관계를 더욱 긴밀히 하고 그들의 전문성을 우리 기반시설 개선에 투입할 수 있습니다."
 IND_japanese_aid_rubber: "수마트라의 고무 지대"
 IND_japanese_aid_rubber_desc: "일본의 도움으로 세계 시장에 공급할 고무를 더 효율적으로 생산할 수 있으며, 동남아시아 최대의 고무 생산국이 될 가능성도 있습니다."
 IND_new_capital_desc: "자카르타는 시대에 뒤떨어진 도시가 되어 세계의 다른 수도들에 뒤처지고 있습니다. 일본으로부터 얻은 모든 전문성과 지식을 활용하여 완전히 새로운 도시를 건설할 계획을 시작해야 합니다."
 IND_chinese_aid: "중국을 불러라!"
 IND_chinese_aid_desc: "일본은 제2차 세계 대전 중 우리나라를 약탈하고 국민을 노예로 삼았습니다. 이를 잊을 수 없으며, 우리나라의 민족주의자들은 중국 및 동방 세계와의 더 긴밀한 관계를 요구하고 있습니다. 중국이 인도네시아에 공장과 기반시설 건설을 위해 투자하도록 할 수도 있습니다."
 IND_chin_aid_gas_plants: "중국 가스 시설"
 IND_chin_aid_gas_plants_desc: "북수마트라의 유전은 개발되지 않은 채 많은 잠재력이 낭비되고 있습니다. 중국의 가스 발전소를 통해 이를 유용하게 활용하고 동남아시아에서 더 큰 석유 생산국이 될 수 있습니다."
 IND_chin_aid_coal: "서자와 석탄 공장"
 IND_chin_aid_coal_desc: "우리는 막대한 석탄 매장량 위에 앉아 있지만, 이를 효율적으로 에너지로 전환할 산업 역량이 없다는 것이 안타깝습니다. 그러나 중국이 석탄 채굴과 전환 과정을 가속할 새 공장 건설이라는 뿌리치기 힘든 제안을 해 왔습니다."
 IND_chin_aid_coal_surplus: "우리의 잉여 석탄 활용"
 IND_chin_aid_coal_surplus_desc: "이제 석탄 공급을 위한 공장이 생겼으니, 이를 국가가 쓸 수 있는 에너지로 전환할 정제소를 건설해야 합니다."
 IND_chin_aid_ev: "중국 전기자동차 지원"
 IND_chin_aid_ev_desc: "중국은 차량 대량 생산에 관해 무엇이 최선인지 알고 있으며, 전기차에 대한 그들의 전문성으로 우리나라의 오염과 맞서 싸울 수 있습니다."
 IND_chin_aid_catl: "CATL 전기 배터리 기업과의 협정"
 IND_chin_aid_catl_desc: "나날이 늘어나는 수요에 맞춰 배터리를 생산하도록 우리나라와 CATL 사이에 협정을 체결해야 합니다."
 IND_chin_aid_pollution: "공해 감소법"
 IND_chin_aid_pollution_desc: "우리는 많은 도시의 오염에 맞서 싸우기 위해 오염 저감법을 통과시킬 것입니다. 중국의 투자로 이것이 꿈이 아닌 가능성이 되었습니다."
 IND_chin_aid_inf: "중국 기반 투자"
 IND_chin_aid_inf_desc: "중국의 기반시설이 날로 좋아지고 있으니, 우리나라도 비슷한 대우를 받아야 함은 물론입니다. 우리는 인도네시아 기반시설 건설에 대한 중국의 투자를 요청할 것입니다."
 IND_chin_aid_high_railway: "자카르타 - 반둥 고속철"
 IND_chin_aid_high_railway_desc: "효율적인 산업 국가가 되려면 먼저 도시들을 연결해야 합니다. 중국이 자카르타와 반둥을 잇는 고속철도를 건설하겠다고 제안했습니다."
 IND_chin_aid_tollway: "발릭파판 - 사마린다 통행로"
 IND_chin_aid_tollway_desc: "발릭파판-사마린다 유료 도로는 동칼리만탄 주민들이 꼭 필요한 편의 속에 이동할 수 있게 해 줄 것입니다. 중국의 기반시설 건설 방식을 활용하여 우리나라에 이 유료 도로를 만들 수 있습니다."
 IND_new_silkroad: "21세기의 실크로드!"
 IND_new_silkroad_desc: "중국 파트너들의 도움은 우리나라를 다시 한번 국제 무대의 중심에 올려놓았습니다. 우리는 이제 산업화된 국가이며 21세기를 이끌어 갈 산업 역량을 갖추고 있습니다!"
 IND_our_policies: "정책 투자"
 IND_our_policies_desc: "우리의 정책은 수정이 필요합니다. 21세기의 요구에 부응하도록 우리의 정책을 면밀히 검토해야 합니다."
 IND_undertable_deals: "탁자 밑의 거래"
 IND_undertable_deals_desc: "약간의 추가 수입을 위해 정치인, 국가, 조직과 몰래 거래를 할 수 있지만, 그 대가는 국가 내 부패입니다..."
 IND_bribe_media: "Bribe the Media"
 IND_bribe_media_desc: "우리 당은 꼭 필요한 지지가 필요하며, 언론에 약간의 대가를 건넨다면 그 지지를 얻을 수 있을지도 모릅니다."
 IND_save_corrupt_official: "부패한 장교 은폐"
 IND_save_corrupt_official_desc: "부패근절위원회(KPK)는 우리 관료 다수에게 골칫거리입니다. 이들의 행적을 신속히 은폐하고 기소를 막아야 합니다."
 IND_shun_corruption: "부패 개선"
 IND_shun_corruption_desc: "우리는 나라의 부패를 척결해야 합니다! 성공적인 국가가 되려면 먼저 국민이 땀 흘려 번 돈으로 자기 주머니를 채우려는 자들을 기소해야 합니다."
 IND_kpk: "오직박멸위원회 (KPK) 기금"
 IND_kpk_desc: "부패근절위원회로도 알려진 KPK는 국가 부패와 맞서 싸우는 데 훌륭한 역할을 해 왔습니다. 그러나 약간의 자금이 있다면 그 과정을 가속하는 데 도움이 될 수 있습니다."
 IND_trial_corrupt_official: "부패 장교 기소"
 IND_trial_corrupt_official_desc: "KPK와 긴밀히 협력한 끝에 일부 부패 관료를 적발할 수 있었으며, 이들에 대한 재판을 준비하고 있습니다."
 IND_more_jobs: "직업 창출"
 IND_more_jobs_desc: "우리 국민은 가족을 먹여 살릴 돈이 필요합니다. 국내에 일자리가 부족한 만큼, 국민이 생계를 꾸릴 수 있도록 새로운 시설을 만드는 것이 우리의 임무입니다. 새 공장을 지어 경제를 부양하고 국민을 가난에서 건져낼 수 있습니다."
 IND_rural_fortification: "지방 요새화"
 IND_rural_fortification_desc: "농촌 주민들은 현지 반군으로부터 꼭 필요한 보호를 받아야 합니다. 반군을 처리하는 동안 주민을 보호하기 위한 임시 방어 시설을 설치할 수 있습니다."
 IND_fund_industries: "국가 산업 지원"
 IND_fund_industries_desc: "인도네시아에는 많은 산업이 있으며, 북쪽 친구들의 도움으로 우리의 역량을 끌어올릴 수 있습니다. 그러나 국내 산업이 외국 산업에 뒤처지도록 놔둘 수는 없습니다."
 IND_education_question: "교육문화연구기술부와의 협의"
 IND_education_question_desc: "늘어나는 청년층에 대응하도록 교육 정책을 개정해야 합니다. 이슬람 중심 교육을 택하거나 학교를 세속화할 수 있습니다. 당내 일부는 모든 쪽을 만족시키기 위해 둘을 결합하자고 주장하기도 합니다."
 IND_religious_system: "종교적 체계"
 IND_religious_system_desc: "학교는 이미 한동안 종교부의 관할 아래 운영되어 왔으며, 지금 와서 그 임무를 면하게 하는 것은 끔찍한 발상일 것입니다."
 IND_quran_class: "쿠란 수업 지속"
 IND_quran_class_desc: "우리나라는 이슬람 국가이며 국민은 이를 잊어서는 안 됩니다! 청년들에게 꾸란의 가르침을 널리 알리고 이를 필수 과목으로 삼아야 합니다."
 IND_no_religious_system: "세속적인 체계"
 IND_no_religious_system_desc: "종교부가 학교를 운영하는 임무에서 벗어나게 해야 합니다. 현대화를 위해 학생들에게 현대적 이념을 더 잘 가르칠 독자적인 부처를 설립해야 합니다."
 IND_no_quran_class: "쿠란 교실 금지"
 IND_no_quran_class_desc: "꾸란 수업은 학생들에게 부담입니다. 우리 인구의 다수가 무슬림이지만, 중요한 과목에 집중하려면 종교를 학교에서 배제해야 합니다."
 IND_mandatory_education: "의무 교육"
 IND_mandatory_education_desc: "모든 청년이 학교에 가도록 강제해야 합니다. 국민이 문맹이라면 우리는 석기 시대에 머물 것입니다."
 IND_satisfied_nation: "만족스러운 국가?"
 IND_satisfied_nation_desc: "우리의 노력이 국민들에게 외면받지 않기를 바랍니다. 문제들이 여전히 많이 남아 있지만 우리가 이룬 성과를 잊어서는 안 됩니다."
 IND_fix_rupiah: "루피아를 개혁하라!"
 IND_fix_rupiah_desc: "우리 통화인 루피아는 한동안 혼란에 빠져 있으며, 가치가 하락함에 따라 안정도 역시 뒤따라 떨어지고 있습니다."
 IND_cooperate_local_gov: "지역 정부와의 협력"
 IND_cooperate_local_gov_desc: "인도네시아는 수많은 민족과 여러 지방 정부로 이루어진 다양한 국가입니다. 국가를 위해 세금을 더 효율적으로 거두려면 이들 지방 정부와 협력해야 합니다."
 IND_lower_interest_rates: "이자율 인하"
 IND_lower_interest_rates_desc: "우리의 금리가 끔찍한 수준으로 치솟고 있으며, 국민을 만족시키려면 금리를 낮추기 시작해야 합니다."
 IND_farmers_in_industry: "농부들을 산업 부문에 재배치"
 IND_farmers_in_industry_desc: "농촌 부문에는 농민이 충분합니다. 경제를 돕기 위해 이들 중 일부를 농장에서 공장으로 옮겨야 합니다!"
 IND_begin_projects_desc: "루피아의 유통을 돕기 위해, 국민이 시간과 돈을 쓸 수 있도록 새로운 프로젝트에 자금을 지원하는 것을 고려해야 합니다."
 IND_fight_rising_prices: "오르는 가격에 대응"
 IND_fight_rising_prices_desc: "우리 당은 물가 상승에 대한 대응이 부족하여 인기가 빠르게 떨어지고 있습니다. 이제 이를 바꿀 때입니다!"
 IND_keep_high_prices: "높은 가격 유지"
 IND_keep_high_prices_desc: "어쩌면 이 높은 물가로 이득을 볼 수 있을지도 모릅니다... 결국 어느 나라가 진정으로 국민을 생각하겠습니까?"
 IND_proficient_supply: "숙련된 배급 체계 관리"
 IND_proficient_supply_desc: "경제를 건강하게 유지하려면 공급망 관리를 개정하기 시작해야 합니다. 그렇지 않으면 경제 붕괴의 위협이 계속 남을 것입니다."
 IND_connect_docks: "배급 체계 연결"
 IND_connect_docks_desc: "공급망을 연결하면 보급을 훨씬 효율적으로 관리하려는 노력에 도움이 될 것입니다. 또한 국제 시장과의 연결도 더 긴밀해질 것입니다."
 IND_a_resilient_currency: "탄력있는 경제!"
 IND_a_resilient_currency_desc: "피, 땀, 눈물로 우리의 위대한 통화 루피아가 승리한다!"
 IND_maluku_back_muslims: "무슬림으로 귀환!"
 IND_maluku_back_muslims_desc: "인도네시아는 이슬람 국가입니다. 따라서 우리는 무슬림 인구를 배신할 수 없으며 그들을 전폭적으로 지지해야 합니다."
 IND_back_muslims_arm_ulama: "울라마 무장"
 IND_back_muslims_arm_ulama_desc: "울라마를 무장시킵시다! 울라마는 성전이 벌어질 경우 무슬림을 동원하는 데 우리의 도움이 필요합니다."
 IND_back_muslims_medical_fee: "Reduce Medical Fees"
 IND_back_muslims_medical_fee_desc: "종교 분쟁에서 부상당한 무슬림을 돕기 위해, 이들이 사회로 복귀할 수 있도록 병원 비용을 낮춰야 합니다."
 IND_back_muslims_workers: "무슬림 노동자 활용"
 IND_back_muslims_workers_desc: "무슬림 노동자들과 그들의 노력을 잊어서는 안 됩니다. 따라서 이들을 활용하여 국가 성장을 촉진할 전략 부문에 배치할 의무가 있습니다."
 IND_back_muslims_factories: "이슬람 산업을 위한 안전 자금"
 IND_back_muslims_factories_desc: "이슬람계 산업이 경제적 어려움에 처한다면, 어려운 시기를 돕기 위해 새로운 긴급 공장 건설에 투자하겠습니다."
 IND_back_muslims_send_guns: "소총 지원"
 IND_back_muslims_send_guns_desc: "무슬림 국민을 무장시키면 도시를 안전하게 지키고 모스크를 혐오 공격으로부터 보호하는 데 도움이 될 수 있습니다."
 IND_back_muslims_infantry: "무슬림 보병 부대 창설"
 IND_back_muslims_infantry_desc: "군대 내 어떠한 내부 갈등도 막기 위해 무슬림 전용 보병을 창설해야 합니다."
 IND_call_saudis: "사우디와 접촉"
 IND_call_saudis_desc: "사우디에 연락하여 그들의 자금으로 우리 무슬림을 지원할 의향이 있는지 알아봐야 합니다. 이미 우리 모스크에 자금을 대고 있으니 돕지 못할 이유가 없습니다."
 IND_ambon_for_muslims: "무슬림을 위한 암본"
 IND_ambon_for_muslims_desc: "암본은 종파 분쟁의 중심지입니다. 그러나 우리의 노력 덕분에 암본시 분쟁은 무슬림의 결정적 승리로 마무리되었다고 합니다."
 IND_maluku_just_fix_it: "그 누구도 돕지 말자"
 IND_maluku_just_fix_it_desc: "이들 분쟁에서 특정 편을 들어서는 안 됩니다. 편향되지 않은 해결책을 찾읍시다."
 IND_maluku_call_army: "군에 연락"
 IND_maluku_call_army_desc: "우리 군은 종파 분쟁에 대해 아무것도 하지 않은 채 방관하고 있습니다. 분쟁 완화를 위해 군을 투입할 때입니다."
 IND_maluku_militarize_villages: "마을 군사화"
 IND_maluku_militarize_villages_desc: "일부 작은 마을들은 이 종파 분쟁의 한가운데에 놓여 약탈자로부터 아무런 보호를 받지 못하고 있습니다. 이들 마을이 안전하도록 신속히 요새화하고 무장시켜야 합니다."
 IND_maluku_increase_policing: "치안 증가"
 IND_maluku_increase_policing_desc: "늘어나는 분쟁에 맞서기 위해 치안을 강화해야 함은 두말할 나위가 없습니다. 이를 통해 꼭 필요한 질서가 회복될 것입니다."
 IND_maluku_civilian_shelter: "노동자들을 위한 공장"
 IND_maluku_civilian_shelter_desc: "피해를 입은 노동자들은 종교적 입장 때문에 공장이 불타버린 경우가 많으므로, 이들을 위한 공장을 지어야 합니다."
 IND_maluku_military_shelter: "군을 위한 공장"
 IND_maluku_military_shelter_desc: "종파 분쟁으로 도시 내 우리 군 병력이 늘어나고 있으므로 새로운 군수 공장을 건설해야 합니다."
 IND_maluku_mobilize_priests: "성직자 동원"
 IND_maluku_mobilize_priests_desc: "사제들을 결집시키면 기독교 인구의 분노를 일깨우는 데 도움이 될 것입니다. 이는 수많은 종파 분쟁에서 그들에게 도움이 될 것입니다."
 IND_maluku_mechanize_them: "기계화 기독교인 부대"
 IND_maluku_mechanize_them_desc: "사제들의 노력으로 교회를 보호하기 위해 기계화 기독교 사단을 배치할 수 있게 되었습니다."
 IND_maluku_christian_volunteers: "기독교인 자원자 활용"
 IND_maluku_christian_volunteers_desc: "많은 기독교인이 자신의 시간을 희생하며 국가 프로젝트에 자원봉사를 하고 있습니다. 이러한 노력을 기꺼이 받아들입니다."
 IND_maluku_christian_businesses: "기독교 사업의 안전 자금"
 IND_maluku_christian_businesses_desc: "기독교 기관이 파산하면 재기할 수 있도록 대출 지원을 제공할 수 있습니다."
 IND_maluku_train_medics: "의료진 훈련"
 IND_maluku_train_medics_desc: "부상자와 종파 분쟁의 교전 속에 휘말린 사람들을 돕기 위해 더 많은 의무병을 훈련시켜야 합니다."
 IND_maluku_give_trucks: "트럭을 보내라!"
 IND_maluku_give_trucks_desc: "기독교인들에게 트럭을 더 제공하면 어려움 없이 효율적으로 이동할 수 있습니다."
 IND_maluku_contact_dutch: "네덜란드에 연락"
 IND_maluku_contact_dutch_desc: "우리 기독교인 다수의 조상이 네덜란드인이라는 점을 고려하면, 이들을 돕기 위해 네덜란드에 지원을 요청하면 기꺼이 수락할 것이라고 해도 무방합니다... 그렇지 않겠습니까?"
 IND_maluku_ambon_for_christians: "기독교인을 위한 암본 시티!"
 IND_maluku_ambon_for_christians_desc: "암본시가 기독교인에게 넘어갔다고 합니다. 우리의 노력 덕분에 기독교인들은 종교 분쟁의 교전 지대였던 도시에서 우위를 잡기 시작했습니다."
 IND_transfer_to_army: "군으로 상황 확대"
 IND_transfer_to_army_desc: "우리의 해법은 분쟁을 끝내는 데 효과가 없었던 것으로 보이며, 따라서 더 많은 군사 개입이 필요하여 작전의 전체 통제권이 TNI-AD로 이관되고 있습니다."
 IND_maluku_equip_police: "경찰 무장"
 IND_maluku_equip_police_desc: "경찰력을 군사화함으로써 종파 분쟁을 억제하는 임무에서 군을 해방시키고, 마침내 군을 다른 반군 진압 임무로 재배치할 수 있습니다."
 IND_maluku_crush_gangs: "폭력배 진압"
 IND_maluku_crush_gangs_desc: "도시에 남은 갱단을 소탕하면 마침내 한숨 돌릴 수 있습니다. 그들의 약탈, 살인, 파괴는 우리나라에 불안정만 가져다줄 뿐입니다!"
 IND_maluku_all_quiet_for_now: "잠깐의 침묵.."
 IND_maluku_all_quiet_for_now_desc: "우리의 더 강경한 노력 덕분에 많은 도시에서 평화가 회복된 것으로 보입니다. 이것이 계속되기를 바랍니다."
 IND_indonesian_armed_forces: "인도네시아군"
 IND_indonesian_armed_forces_desc: "The Armed forces of Indonesia is one of Asia's military mights. From our ground forces, to our pilots the nation's men and women stand ready to defend the nation from any and all threats."
 IND_tni_ad: "인도네시아 국립 군사 지상군 (TNI-AD)"
 IND_tni_ad_desc: "TNI-AD는 60년 넘게 우리의 주력 지상군 군종이었습니다. 21세기에 접어든 오늘날 우리는 이들 장병을 훈련시키는 새로운 방식을 추진하는 임무를 맡고 있습니다."
 IND_chinese_model_inf: "중국 보병 모델"
 IND_chinese_model_inf_desc: "중국이 세계적 강국이 되리라는 것은 매우 분명하며, 따라서 우리는 그들에게 뒤처져서는 안 됩니다. 무기와 전술에서 그들의 도움을 얻을 수 있다면 그들과 함께 부상할 수도 있습니다."
 IND_homegrown_inf: "자주적인 보병"
 IND_homegrown_inf_desc: "우리가 독립적인 주권 국가가 되려면 먼저 우리 자신의 전술을 활용해야 합니다. 우리 병사들이 중국군과 똑같이 싸운다면 어떻게 차별화될 수 있겠습니까?"
 IND_jungle_expertise: "정글 지형 특화"
 IND_jungle_expertise_desc: "의심할 여지 없이 우리 병사들을 동남아시아의 습하고 울창한 환경에서 싸울 수 있도록 훈련시켜야 합니다. 그렇지 않으면 이웃 국가들에 뒤처질 수 있습니다."
 IND_strong_howitzers: "강력한 곡사포"
 IND_strong_howitzers_desc: "적과 대등하려면 우리의 곡사포를 최상의 상태로 유지하는 것이 중요합니다. 낡은 포들의 개량 작업을 즉시 시작해야 합니다."
 IND_most_advanced_tanks: "위대한 전차"
 IND_most_advanced_tanks_desc: "우리의 전차가 구식이 되어가고 있음은 의심의 여지가 없습니다. 따라서 동남아시아 최고의 전차 전력을 구축하기 위해 기술자들에게 실험과 연구를 맡겼습니다."
 IND_tank_factories: "전차 생산 공장"
 IND_tank_factories_desc: "늘어나는 전차 수에 맞춰 새로운 공장을 건설하는 것은 의심할 여지 없이 매우 필요합니다. 생산에서 뒤처진다면 전차 기술이 무슨 소용이 있겠습니까?"
 IND_best_ifvs: "최고의 보병전투차량"
 IND_best_ifvs_desc: "보병전투차도 전차와 같은 대우를 받을 자격이 있습니다. 결국 보병전투차는 전장에서 매우 중요합니다. 우리의 군사력을 빠르게 높이기 위해, 병사들을 안전하게 수송할 최신 최고의 보병전투차 기술을 확보하는 것이 최선입니다."
 IND_the_toughest_apcs: "튼튼한 병력수송장갑차"
 IND_the_toughest_apcs_desc: "우리의 병력 수송 장갑차는 상당히 구식이고 원시적입니다. 이를 바꿔야 합니다. 이를 위해 가장 큰 포탄도 견딜 수 있는 새로운 설계를 만들 팀을 서둘러 꾸리고 있습니다."
 IND_tni_al: "인도네시아 해군 (TNI-AL)"
 IND_tni_al_desc: "해군은 우리나라 군사력의 자랑입니다. 바다로 둘러싸인 군도 국가로서 우리에게 해를 끼치려는 자들을 막을 강력한 해군을 건설하는 것이 필수적입니다."
 IND_fortified_seas: "해안 요새화"
 IND_fortified_seas_desc: "적이 상륙하거나 우리 함선을 손상시키지 못하도록 해안을 요새화해야 합니다. 전투에서는 방어적 자세를 유지하도록 노력해야 합니다."
 IND_new_corvettes: "새로운 초계함 설계"
 IND_new_corvettes_desc: "우리의 초계함 전력은 상당히 구식이 되어가고 있으며 쇄신이 절실합니다. 새로운 설계를 구상하는 작업을 시작해야 합니다."
 IND_submarines: "새로운 잠수함"
 IND_submarines_desc: "잠수함전이 전쟁에서 점점 더 많이 사용되고 있습니다. 우리도 잠수함이 있으나 세계 수준에 미치지 못합니다. 이를 바꿔야 합니다."
 IND_industrialized_sea: "산업화된 해양"
 IND_industrialized_sea_desc: "적에게 싸움을 걸기 위해 해군의 생산을 늘려야 합니다. 방어적으로만 행동한다면 국민이 피해를 입을 수 있습니다."
 IND_cruisers: "순양함 연구"
 IND_cruisers_desc: "더 좋은 순양함을 확보해야 합니다! 순양함은 함대에서 가장 큰 함선이지만 해전 승리의 열쇠입니다."
 IND_air_carrier_designs: "새로운 항공모함ㅁ"
 IND_air_carrier_designs_desc: "오늘날의 전쟁은 항공 지원과 함께 치러집니다. 우리 해군에 항공 지원이 없다면 어떻게 승리를 기대할 수 있겠습니까? 인도네시아 항공모함을 설계하고 건조하기 시작해야 합니다!"
 IND_maritime_empire: "해상 제국"
 IND_maritime_empire_desc: "우리나라는 바다에서 승리해야 합니다. 역사가 보여주듯이 한 나라의 해군은 종종 그 나라의 안보와 보전을 좌우합니다."
 IND_tni_au: "인도네시아 공군 (TNI-AU)"
 IND_tni_au_desc: "TNI-AU는 우리나라 공군의 주력 군종이며, 앞으로 나아갈 방향을 재평가해야 합니다."
 IND_refine_airbases: "공군기지 재설계"
 IND_refine_airbases_desc: "새 항공기와 조종사의 필요에 맞게 공군 기지를 재설계하는 것을 진지하게 고려해야 합니다. 기지의 질을 높이지 못하면 하늘에서 실패할 수 있습니다."
 IND_air_drills: "국내 항공 훈련 개시"
 IND_air_drills_desc: "조종사의 기량을 연마하려면 먼저 전투 준비가 되어 있는지 확인해야 합니다. 장교들에게 조종사들이 준비되었는지 확인하도록 임무를 맡길 것입니다."
 IND_expand_air_craft_designs: "향상된 항공기 설계"
 IND_expand_air_craft_designs_desc: "항공 분야에서 세계에 뒤처지지 않으려면 새로운 항공기 설계를 위해 연구자들에게 자금을 지원하기 시작하는 것이 최선입니다."
 IND_nato_drilling: "NATO 훈련"
 IND_nato_drilling_desc: "서방과의 우정을 공고히 하려면 하늘에서 함께 훈련을 실시하는 것이 최선입니다. 이를 통해 협동 공격에 대비할 수 있습니다."
 IND_funds_for_iae: "Fund the Indonesian Aerospace Company"
 IND_funds_for_iae_desc: "IAE에 자금을 지원하면 우리 항공기가 하늘에서 더 첨단화되고 효율적이 될 것입니다. 이를 통해 동남아시아에서 인도네시아의 제공권을 확보할 수 있습니다."
 IND_political_agenda: "정치적 의제"
 IND_political_agenda_desc: "선거가 다가오고 있기에, 우리는 정치에 더욱 집중하여 선전 없이 어떻게 하면 인도네시아의 민주주의가 번영할 수 있는지 고심해야 합니다.. 그게 아니라면 혹시..?"
 IND_naw_rural_folk: "지방 인사"
 IND_naw_rural_folk_desc: "농촌 주민에 집중합시다. 이들은 우리나라의 근간이며 이들을 돕는 것이 우리의 최대 관심사여야 합니다."
 IND_naw_reps_village: "마을의 대표"
 IND_naw_reps_village_desc: "마을에 사는 우리 국민은 목소리를 높이고 있지만 아무도 듣지 않습니다. 이제 그들에게 우리 사안에서 정당한 발언권을 줄 때입니다."
 IND_naw_health_fac: "의료 시설에 집중"
 IND_naw_health_fac_desc: "농촌 인구에 대한 의료를 확대하는 데 힘써야 합니다. 그들이 죽도록 방치된다면 그들을 돕는다는 우리의 임무는 실패하는 것입니다."
 IND_naw_better_edu: "교육 확대"
 IND_naw_better_edu_desc: "마을의 아이들은 너무 오랫동안 방치되어 왔습니다. 모두가 배울 기회를 가질 수 있도록 교육을 확대할 때가 되었습니다."
 IND_naw_aid_village: "마을 기반시설에 집중"
 IND_naw_aid_village_desc: "마을 주민들의 집이 무너져가고 있으며 우리는 이를 가만히 지켜볼 수 없습니다. 주민을 위해 새 건물을 세우도록 건설 노동자들을 파견했습니다."
 IND_naw_dev_lacking_regions: "교외 지역 산업화"
 IND_naw_dev_lacking_regions_desc: "마을의 빈곤층에게 일자리를 제공합시다. 훈련이 필요하겠지만 이들이 일할 수 있도록 새 공장을 지어야 합니다."
 IND_naw_agri_dev: "농업 발전"
 IND_naw_agri_dev_desc: "새 주택을 짓는 것과 함께, 시장에 식량을 공급할 수 있도록 더 나은 영농 시설도 건설해야 합니다."
 IND_naw_fishermen: "어부 지원"
 IND_naw_fishermen_desc: "어민에 대한 자금 지원은 사기를 높이는 훌륭한 방법이며 국민을 먹이는 훌륭한 방법이기도 합니다."
 IND_naw_women: "전략 기획 부문에서의 여성"
 IND_naw_women_desc: "여성들을 전략 부문에서 일하도록 활용하는 것은 사회 발전뿐 아니라 과학 발전에도 매우 유용할 수 있습니다."
 IND_naw_aid_farmer: "농부에 집중"
 IND_naw_aid_farmer_desc: "개인, 즉 농민에게 집중합시다. 이들에게 관심을 기울이면 더 저렴하게 생산하도록 이끌 수 있을지도 모릅니다."
 IND_naw_aid_laborer: "노동자 지원"
 IND_naw_aid_laborer_desc: "노동자와 같은 서민을 돕는 것은 농장을 산업화하는 열쇠가 될 것입니다."
 IND_naw_safety_reg: "안전 규제 통과"
 IND_naw_safety_reg_desc: "안전 규정을 통과시키는 것은 노동자를 안전하게 지키는 열쇠입니다. 이는 우리나라가 사회적 관점에서 발전하는 데에도 도움이 되며 노동자들의 마음을 편안하게 해줄 것입니다."
 IND_way_forward_naw: "앞으로"
 IND_way_forward_naw_desc: "미래가 민족각성당의 손에 달려 있음은 분명합니다. 우리는 집권 후보로 지명된 이래 이 나라에 위대함과 민주주의만을 가져왔습니다."
 IND_prosper_justice: "번영과 정의의 승리"
 IND_prosper_justice_desc: "인도네시아 국민이 무엇을 원하는지는 명백합니다. 나라만을 생각하고 오직 나라만을 위하는 정당이며, 그것은 번영정의당만이 이룰 수 있습니다."
 IND_reform_system: "Systemic Reforms"
 IND_reform_system_desc: "이 쇠락하는 체제를 개혁하고, 국민들 안에 국가에 대한 사랑을 다시 불붙입시다!"
 IND_improve_network: "네트워크 개선"
 IND_improve_network_desc: "인터넷 기반시설이 낡았다면 국민이 어떻게 소통하겠습니까. 새 기반시설을 구축하기 시작합시다."
 IND_efficient_tax: "효율적인 세금 징수"
 IND_efficient_tax_desc: "국민은 국가가 운영되도록 세금을 내야 합니다. 효율적인 징세 절차는 국가의 안녕에 필수적입니다."
 IND_const_practices: "건설의 관습 개선"
 IND_const_practices_desc: "예방할 수 있는 사고로 사람들이 죽고 있습니다. 작업 속도는 늦어지겠지만 이것이 최선입니다."
 IND_upgrade_facilities: "장비 개선"
 IND_upgrade_facilities_desc: "우리 일꾼들이 수월하게 일할 수 있도록 새로운 도구에 투자해야 합니다."
 IND_address_issues: "우리의 문제 제기"
 IND_address_issues_desc: "We should focus on our internal problems."
 IND_edu_to_disenfranchised: "박탈자들을 위한 교육"
 IND_edu_to_disenfranchised_desc: "소외된 지역의 아이들에게 학교를 세워 주면 사회 발전을 크게 촉진할 수 있습니다."
 IND_continue_pol_fund: "치안 자금 지속 증대"
 IND_continue_pol_fund_desc: "깡패와 범죄자를 거리에서 몰아냅시다. 경찰에 자금을 지원하면 국민이 밤에 편히 쉴 수 있도록 보장할 수 있습니다."
 IND_continue_cor_fight: "부패와의 전쟁 지속"
 IND_continue_cor_fight_desc: "부패와 싸움으로써 우리의 기록이 깨끗하고 국민이 우리를 신뢰하도록 보장할 수 있습니다."
 IND_more_offices: "더많은 사무지구"
 IND_more_offices_desc: "새 사무실을 짓는 것은 더 많은 일자리를 만드는 훌륭하고 효율적인 방법이며 경제의 흐름을 이끌 수도 있습니다."
 IND_road_improvements: "도로 개선"
 IND_road_improvements_desc: "도로를 정비할 수 있다면 소외된 도시의 사람들도 마침내 인기 있는 도시의 사람들과 동등해질 수 있습니다."
 IND_help_arm_industry: "군수 산업 지원"
 IND_help_arm_industry_desc: "무기 산업을 돕는 것은 궁극적으로 우리에게 큰 이익이 될 수 있습니다. 어려운 사람들에게 일자리를 제공하고 경제와 군대를 모두 끌어올릴 것입니다."
 IND_new_society: "새로운 사회"
 IND_new_society_desc: "우리의 노력으로 번영정의당의 눈부신 진보가 전국의 인도네시아 국민들에게 전달되었습니다."
 IND_united_development: "통합개발당 (UDP)"
 IND_united_development_desc: "카바당으로도 알려진 UDP는 인도네시아 일상생활의 문제들에 관심을 환기하는 데 주력하는 온건 이슬람주의 정당입니다."
 IND_und_national_dev: "국가개발계획"
 IND_und_national_dev_desc: "국가 개발 계획을 발표합시다. 국민의 사기와 우리 당의 인기를 높일 것입니다."
 IND_und_clean_water: "깨끗한 물"
 IND_und_clean_water_desc: "물을 정화하고 새로운 시설을 구축함으로써 사람들이 해를 입지 않고 물을 마실 수 있도록 보장할 수 있습니다. 이는 향후 프로젝트를 위한 부지도 확보해 줄 것입니다."
 IND_und_bridge_port: "수송 체계 개선"
 IND_und_bridge_port_desc: "트럭 운전사들을 위한 더 나은 기반시설을 확보하면 전국에서 물자가 문제없이 오갈 수 있습니다."
 IND_und_agri_invest: "농업에 투자"
 IND_und_agri_invest_desc: "국민을 효율적으로 먹이려면 농업 투자가 필수적입니다."
 IND_und_more_science: "더 많은 과학자"
 IND_und_more_science_desc: "우리나라가 발전하려면 과학자가 필요하며, 이들 과학자의 훈련과 교육에 자금을 지원해야 합니다."
 IND_und_prot_muslims: "무슬림 보호"
 IND_und_prot_muslims_desc: "무슬림을 위한 긴급 대피소를 건설함으로써 우리 종교의 보전과 무슬림의 안전을 모두 보장할 수 있습니다. 우리나라의 무슬림이 다른 종교가 있는 도시에서 공격의 위협을 받고 있으므로 이는 매우 중요합니다."
 IND_und_islam_schools: "이슬람 학교 지원"
 IND_und_islam_schools_desc: "이슬람 학교에 자금을 지원하는 것은 국민을 문화적으로나 종교적으로 교육하는 빠른 방법입니다. 또한 성직자들의 호감을 얻을 수도 있습니다."
 IND_und_islam_banking: "이슬람 은행"
 IND_und_islam_banking_desc: "이슬람 금융 관행은 의심할 여지 없이 올바른 금융 방식입니다. 국민에게 높은 이자를 강요해서는 안 되며 이렇게 하면 국민이 만족할 것입니다. 다만 우리의 주머니는 다소 얇아질 수 있습니다."
 IND_und_better_social_welfare: "노인들을 위한 복지"
 IND_und_better_social_welfare_desc: "우리는 어르신들을 배신해서는 안 됩니다. 결국 우리는 그분들의 노고 위에 서 있습니다. 의료 접근성을 높여 드림으로써 그분들의 노고를 기리고 만족시킬 수 있습니다."
 IND_und_help_food: "식품 생산 연구 지원"
 IND_und_help_food_desc: "새로운 식량 생산 방식에 자금을 지원함으로써 인도네시아의 수백만 굶주린 사람들과 우리 자신을 먹일 수 있습니다."
 IND_und_housing_act: "주택법"
 IND_und_housing_act_desc: "머리 위에 지붕 없이 지내는 사람이 없도록 하는 것은 우리 당 정책의 핵심입니다. 북말루쿠의 사람들을 위한 저가 주택을 지어야 합니다."
 IND_und_better_hospitals: "병원 장비 개선"
 IND_und_better_hospitals_desc: "의사들에게 더 좋고 발전된 의료 장비를 제공하면 많은 생명을 구하는 데 도움이 됩니다."
 IND_und_help_unemployment: "실업자 지원"
 IND_und_help_unemployment_desc: "인구의 큰 부분을 고용하는 것은 인도네시아가 경제적으로 성장하는 데 필수적이므로, 이들이 일자리를 얻을 수 있도록 새 건물을 지어야 합니다."
 IND_und_united_indonesia: "인도네시아 통합"
 IND_und_united_indonesia_desc: "신앙과 국가로 하나가 되어, 우리의 정책이 나라 안에서 실현되는 것을 보며 마침내 안심할 수 있습니다."
 IND_party_of_struggle: "The Party Of Struggle"
 IND_party_of_struggle_desc: "좌파 정당인 투쟁당은 많은 급진적 변화를 추진하고 있으나, 이를 실현할 수 있을지는 아무도 알 수 없습니다."
 IND_strug_brace_for_change: "변화에 대비"
 IND_strug_brace_for_change_desc: "우리 당이 제시할 전면적 개혁에 국민이 준비되어 있기를 바랍니다."
 IND_strug_expand_infrastructure: "기반시설 확장"
 IND_strug_expand_infrastructure_desc: "기반시설을 확충하는 것은 국민의 삶의 질이 높고 기대에 부합하도록 보장하는 안전한 방법입니다."
 IND_strug_acquire_bp: "Acquire Construction Blueprints"
 IND_strug_acquire_bp_desc: "새로운 건설 설계도를 확보하면 차질 없이 건설할 수 있습니다!"
 IND_strug_new_airports: "새로운 공항"
 IND_strug_new_airports_desc: "새 공항을 건설함으로써 관광객이 꾸준히 유입되도록 보장할 수 있습니다. 또한 국민이 국내외로 여행하는 데에도 도움이 됩니다."
 IND_strug_better_road: "영공 무장"
 IND_strug_better_road_desc: "영공을 군사화하는 것은 민간 공항을 더 짓는 것의 좋은 대안입니다. 어려운 시기에 우리나라 하늘을 방어하는 데 도움이 되기 때문입니다."
 IND_strug_fight_corruption: "부패 척결"
 IND_strug_fight_corruption_desc: "부패가 인도네시아 정치에서 큰 역할을 한다는 것은 두말할 나위가 없습니다. 따라서 이를 근절하기 위해 최선을 다해야 합니다."
 IND_strug_establish_investigations: "감사 요청"
 IND_strug_establish_investigations_desc: "부패 관료에 대한 수사를 개시하면 우리 당의 인기를 쉽게 높이고 경쟁 정당을 기소하여 뒤처지게 할 수 있습니다."
 IND_strug_purge_sus_members: "수상한 인물 숙청"
 IND_strug_purge_sus_members_desc: "우리 자신을 조사하지 않고 다른 정당의 부패를 비난하는 것은 매우 위선적일 것이므로, 우리 내부의 부패 관료를 숙청할 조치가 필요합니다."
 IND_strug_economic_growth: "경제 성장"
 IND_strug_economic_growth_desc: "시장에 자금을 투입함으로써 경제 호황을 불러올 수 있을지도 모릅니다."
 IND_strug_agri_funding: "농업 기금"
 IND_strug_agri_funding_desc: "농업은 인도네시아에서 매우 중요하므로 농민들을 만족시키기 위해 그들의 프로젝트에 자금을 지원해야 합니다."
 IND_strug_seaports: "새로운 해상 항구"
 IND_strug_seaports_desc: "새 항구를 건설하면 외부 세계와의 무역에 크게 도움이 되며 선박을 훨씬 빠르게 생산하는 데에도 도움이 됩니다."
 IND_strug_eastasian_unity: "동아시아 통합"
 IND_strug_eastasian_unity_desc: "세계 대부분이 무너지고 혼란에 빠지는 가운데, 적은 가까이 두고 친구는 더 가까이 두는 것이 중요합니다. 번영을 위해 다른 동아시아 국가들과 협력해야 합니다."
 IND_strug_host_regional_events: "지역 행사 개최"
 IND_strug_host_regional_events_desc: "인도네시아는 과거에 지역 행사의 중심지였으며, 이는 나라에 많은 새로운 얼굴을 불러왔습니다. 이러한 관행을 계속하여 더 많은 행사를 유치하겠다고 제안해야 합니다."
 IND_strug_just_indonesia: "정의로운 인도네시아"
 IND_strug_just_indonesia_desc: "우리의 모든 노력으로 마침내 있는 그대로 부를 수 있게 되었습니다. 새롭고 정의로운 인도네시아라고."
 IND_democrat_party: "The Democrat Party"
 IND_democrat_party_desc: "민주당은 인도네시아에서 가장 인기 있는 친서방 정당 중 하나이며 더 자유주의적인 국가를 옹호하고 있습니다."
 IND_dem_greater_future: "더나은 내일"
 IND_dem_greater_future_desc: "우리는 나라가 개혁과 변화에 대비하도록 해야 합니다. 내일은 오늘보다 나아야 하고 인도네시아는 번영할 것입니다!"
 IND_dem_enviro_prot_plan: "Environmental Protection Plan"
 IND_dem_enviro_prot_plan_desc: "환경 보호를 추진함으로써 우리의 숲, 정글, 해변을 훼손으로부터 안전하게 지킬 수 있습니다."
 IND_dem_resource_regulation: "자원 규제"
 IND_dem_resource_regulation_desc: "자원 채굴 과정에서 아무것도 낭비되지 않도록 규제합시다."
 IND_dem_protected_areas: "보호 구역 설립"
 IND_dem_protected_areas_desc: "보호 구역을 설정하면 우리나라의 문화 유적을 보호하고 역사를 보존할 수 있습니다."
 IND_dem_for_the_oceans: "Democrat Party for The Oceans"
 IND_dem_for_the_oceans_desc: "우리는 바다로 둘러싸여 있으므로 바다에 친절해야 합니다. 새로운 안전 시설을 건설함으로써 바다와 우리 모두에게 이로울 수 있도록 보장할 수 있습니다."
 IND_dem_decentralization: "지방분권"
 IND_dem_decentralization_desc: "나라를 분권화하면 국민이 우리를 더 신뢰하게 되고 가능한 곳에서 비용을 절감하는 데에도 도움이 됩니다."
 IND_dem_regional_econ: "지역 경제 지원"
 IND_dem_regional_econ_desc: "지역 경제를 위한 일자리에 자금을 지원함으로써 지지를 크게 얻고 더 큰 노동력의 결실도 계속 거둘 수 있습니다."
 IND_dem_prot_local_cultures: "지역 문화 보호"
 IND_dem_prot_local_cultures_desc: "소수민족과 그들의 문화를 보호하는 것은 인도네시아를 문명국으로 유지하는 열쇠입니다. 많은 사람이 서로에게 증오 행위를 저지르고 있으며, 이는 이번 정부에서 용납되지 않을 것입니다."
 IND_dem_small_business_support: "토지주와의 갈등"
 IND_dem_small_business_support_desc: "토지를 독점하는 지주들과 맞서 싸우면 국민에게 토지를 분배하고 국가가 계속 성장하도록 도울 수 있습니다."
 IND_dem_promote_credit: "노인을 위한 원조"
 IND_dem_promote_credit_desc: "노인을 돕는 것은 국민에게 우리 당의 선의를 보여주는 확실한 방법입니다."
 IND_dem_technical_support: "기술적 진보 지원"
 IND_dem_technical_support_desc: "우리나라 국민 대부분은 여전히 인터넷에 접근하지 못하고 있어 뒤처지고 있습니다. 이를 바꾸고 새로운 인터넷 기반시설을 구축해야 합니다."
 IND_dem_emergence_indonesia: "인도네시아의 부상"
 IND_dem_emergence_indonesia_desc: "새로운 정책과 목표를 마음에 새기고, 우리는 인도네시아가 어떤 일이 있어도 약화된 상태에서 벗어나 부상할 것임을 세계에 보여주었습니다."
 IND_dem_civil_activity: "시민 활동 촉진"
 IND_dem_civil_activity_desc: "시민 활동을 장려하는 것은 국민이 서로를 알아갈 수 있도록 하는 동시에 국가에도 이로운 안전한 방법입니다."
 IND_k.e.m.i.u: "인도네시아 외교부 (K.E.M.I.U)"
 IND_k.e.m.i.u_desc: "K.E.M.I.U, 즉 외교 부서는 해외에서 국익을 수호하고 세계 각국과의 관계를 구축하는 책임을 맡고 있습니다."
 IND_contact_west: "서방과의 관계"
 IND_contact_west_desc: "서방과 가까이 지내는 것은 중요합니다. 우리는 매일 그들 나라의 새로운 기술적, 과학적 혁신을 봅니다. 게다가 그들의 기업으로부터 경제적 이익도 얻을 수 있습니다."
 IND_american_coop: "Indonesian - American Cooperation"
 IND_american_coop_desc: "미국은 세계 최고의 경제 대국이므로 미국과의 협력은 우리 경제를 성장시키는 데 도움이 될 수 있습니다."
 IND_american_armor: "미국의 무장"
 IND_american_armor_desc: "미국의 장갑 설계를 구매하는 것은 우리 군, 특히 육군인 TNI-AD에 이로울 수 있습니다."
 IND_west: "친서방 외교"
 IND_east: "동방 외교"
 IND_american_companies: "NASA와의 협력"
 IND_american_companies_desc: "NASA와의 협력은 우리 인력을 우주로 보내는 속도를 크게 높일 것이며 우주 연구도 가속할 것입니다."
 IND_contact_netherlands: "네덜란드와 접촉"
 IND_contact_netherlands_desc: "우리의 옛 식민 통치자는 이제 새로운 친구입니다. 네덜란드와 접촉을 유지하는 것은 인도네시아가 유럽 무역에 진입하는 훌륭한 관문이 될 수 있습니다."
 IND_spajik_frigate: "Purchase Van Speijk Frigates"
 IND_spajik_frigate_desc: "새 호위함을 구매하는 것, 특히 네덜란드로부터 구매하는 것은 이로울 수 있습니다. 그들은 꽤 좋은 조건으로 한 척을 넘길 의향이 있습니다."
 IND_sigma_corvette: "시그마 초계함 구매"
 IND_sigma_corvette_desc: "네덜란드의 시그마급 초계함은 바다에서 강력한 전투 전력으로 보입니다. 한 척이라도 거래를 성사시킬 수 있다면 우리 해군에 큰 도움이 될 것입니다."
 IND_ease_asean_trade: "네덜란드를 아세안 무역에 정착"
 IND_ease_asean_trade_desc: "네덜란드를 ASEAN 무역에 편입시키는 것은 우리와 이웃 국가들에게 이로울 수 있습니다. 또한 동아시아와 유럽의 관계에도 크게 도움이 될 것입니다."
 IND_fund_dutch_churches: "네덜란드 교회 지원"
 IND_fund_dutch_churches_desc: "네덜란드 교회에 자금을 지원하는 것은 다소 위험할 수 있습니다. 그러나 이곳의 일부 기독교인들이 스스로를 네덜란드인의 후손으로 여기므로, 네덜란드의 친구들을 기쁘게 하기 위해 일부 교회에 자금을 지원하는 것을 고려해야 합니다."
 IND_contact_europe: "유럽 연합과 대화"
 IND_contact_europe_desc: "유럽 연합과의 회담은 서유럽과 동유럽 대부분과 더 큰 관계를 구축하는 데 도움이 될 수 있습니다."
 IND_boost_econ_relations: "경제 관계 성장"
 IND_boost_econ_relations_desc: "경제 관계를 증진하면 EU와 경제적으로 더 긴밀한 유대를 맺는 데 도움이 될 것입니다. 또한 국민이 서방 상품에 더 쉽게 접근할 수 있게 되어 일상생활도 나아질 것입니다."
 IND_national_development_plan: "국가개발계획"
 IND_national_development_plan_desc: "국가 기반시설을 개선하기 위해 EU와 몇 가지 거래를 맺읍시다."
 IND_talks_east: "동쪽을 바라보라"
 IND_talks_east_desc: "동쪽을 바라보고 동방의 친구들과 대화합시다. 서방은 인도네시아에 해만 끼치고 국민을 절망에 빠뜨렸을 뿐입니다."
 IND_sino_cooperation: "중국-인도네시아 협력"
 IND_sino_cooperation_desc: "중국은 우리에게 해를 끼치지 않았습니다... 아직은요. 그런 일이 일어나지 않도록 그들과 관계를 구축합시다."
 IND_sino_science_coop: "중국 과학 협력"
 IND_sino_science_coop_desc: "과학 분야에서 중국과 협력하면 우리나라가 앞으로 나아갈 수 있습니다."
 IND_principle_bandung: "반둥의 10가지 규칙"
 IND_principle_bandung_desc: "서로의 내정에 간섭하지 않기로 합의하는 것은 아시아의 단결에 핵심입니다. 회의 이후 중국은 불가침 및 불개입 조약에 합의하고 우리의 내정을 건드리지 않겠다고 약속했습니다."
 IND_japanese_friendship: "일본과의 친선"
 IND_japanese_friendship_desc: "일본이 우리를 식민 지배했지만 그들과 관계를 구축하지 않는 것은 어리석은 일입니다. 회담은 우리와 그들 모두에게 이로울 수 있습니다."
 IND_port_exports: "수출을 위한 더 많은 항구"
 IND_port_exports_desc: "새 항구를 건설하면 일본 및 세계 다른 곳과의 물자 흐름을 가속할 수 있습니다."
 IND_jap_tech_giants: "일본 기술 단지"
 IND_jap_tech_giants_desc: "일본의 거대 기술 기업들은 우리에게 한두 가지를 가르쳐 줄 수 있습니다. 그들과 국내 기술 기업들의 협력을 모색해야 합니다."
 IND_men_for_ports: "항구 인력"
 IND_men_for_ports_desc: "이 항구들은 저절로 운영되지 않습니다! 숙련된 노동자가 필요하므로 항구의 직위를 채울 일본 인력을 요청해야 합니다."
 IND_jap_const_methods: "일본식 건설 모델"
 IND_jap_const_methods_desc: "일본의 건설 방식을 모방하는 것이 우리나라의 목표가 되어야 합니다. 그들처럼 기반시설을 진정으로 구축할 수 있다면 순식간에 그들을 능가할 것입니다."
 IND_russia_coop: "러시아-인도 협력"
 IND_russia_coop_desc: "러시아와의 협력은 서방의 행태에 질렸다는 것을 서방에 보여주는 확실한 방법입니다. 또한 러시아와 전략적 파트너십을 확보할 수도 있습니다..."
 IND_sukhoi_jets: "수호이 제트기 구매"
 IND_sukhoi_jets_desc: "최신 최고 성능의 러시아 전투기를 도입하면 우리 공군인 TNI-AU에 도움이 될 것입니다. 러시아와 전투기 도입 협상을 추진할 계획을 세워야 합니다."
 IND_russian_tourist: "러시아 관광객 우대"
 IND_russian_tourist_desc: "러시아 관광객을 극진히 대접하면 그들의 눈에 우리나라의 위상이 높아질 것입니다. 우리 관광 수입의 상당 부분이 러시아에서 오는 만큼 이를 고려해야 합니다."
 IND_talk_with_neighbors: "주변국과의 대화"
 IND_talk_with_neighbors_desc: "이웃 국가들과 대화를 나누면 우리의 뜻을 동남아시아 전역에 효과적으로 알릴 수 있습니다."
 IND_australia: "오스트레일리아와 대화"
 IND_australia_desc: "오스트레일리아와 매우 중요한 사안들을 논의해야 합니다. 특히 동티모르 문제와 그들의 개입이 쟁점입니다."
 IND_apologize_australia: "오스트레일리아에 사과"
 IND_apologize_australia_desc: "오스트레일리아와 사망한 자원병들의 유족에게 사과해야 합니다. 통제권을 유지하려는 과정에서 우리가 다소 지나치게 강경했을지도 모릅니다."
 IND_high_prices: "높은 가격!"
 IND_meet_minister_australia: "장관과의 만남"
 IND_meet_minister_australia_desc: "우리는 최근 오스트레일리아 총리와 회담을 가졌으며, 다행히 양국 사이의 문제들이 해소되었습니다. 더욱 발전된 관계를 기대합시다!"
 IND_confront_australia: "호주와의 대치"
 IND_confront_australia_desc: "동티모르 문제에 대한 그들의 개입에 대해 맞서야 합니다. 그들은 인도네시아 국가에 피해와 슬픔을 안겼습니다."
 IND_malaysia: "말레이시아와 대화"
 IND_malaysia_desc: "말레이시아와 인도네시아는 가까운 이웃이지만, 최근의 문제들이 우리 사이를 갈라놓고 있습니다.."
 IND_demand_riau: "Demand they Cede Riau"
 IND_demand_riau_desc: "리아우는 정당한 인도네시아 영토이며, 말레이시아가 이에 대한 영유권을 주장하는 것을 좌시할 수 없습니다. 지금 당장 물러나라고 요구해야 합니다!"
 IND_strategic_partnership: "전략적 제휴"
 IND_strategic_partnership_desc: "이제 말레이시아와 전략적 파트너가 될 수 있습니다. 우리가 리아우에서 물러난 뒤 그들은 우리에게 크게 호감을 갖게 되었습니다."
 IND_combat_it: "급진주의와 투쟁"
 IND_combat_it_desc: "급진주의에 맞서 싸우는 것이 최선의 선택입니다. 이에 맞서 싸움으로써 급진주의를 추종하는 자들에게 강력한 메시지를 보낼 수 있습니다. 이는 우리 자신의 권력을 강화하는 데에도 도움이 되며, 국민 생활의 여러 측면에 대한 영향력을 행사할 수 있게 해 줍니다."
 IND_bolster_party_pop: "정당 인기도 강화"
 IND_bolster_party_pop_desc: "당의 인기도를 높이는 것은 일석이조입니다. 국민들이 우리나라를 사랑하게 되고, 다음 선거에서 더 많은 지지를 얻을 수 있습니다!"
 IND_derad_campaign: "비급진화 운동"
 IND_derad_campaign_desc: "급진화된 사람들을 바로잡기에 아직 늦지 않았습니다. 인도네시아 전역에서 정부 주도의 탈급진화 캠페인을 개최하여 사람들을 탈급진화시킬 수 있습니다."
 IND_investigate_growth: "그들의 성장에 대한 조사"
 IND_investigate_growth_desc: "예산의 일부를 경찰력 강화에 투입하면 급진 세력이 날마다 커지는 이유에 대한 단서를 얻을 수 있습니다."
 IND_start_media_campaign: "언론 캠페인 시작"
 IND_start_media_campaign_desc: "언론에 발판을 마련하는 것은 일부 급진주의자들의 시각을 바꾸는 좋은 방법이 될 수 있습니다."
 IND_control_net: "인터넷에서 극단주의와 갈등"
 IND_control_net_desc: "인터넷에서 급진 세력과 맞서 싸우는 것은 점점 디지털화되는 인도네시아에서 그들과 그들의 사상을 몰아내기 위한 여러 방법 중 하나입니다."
 IND_filter_net: "인터넷 검열"
 IND_filter_net_desc: "인터넷을 전면 차단하는 조치는 국민을 분노하게 할 수 있지만, 몇몇 페이지를 감시하는 것만으로는 불가능한 수준으로 훨씬 쉽게 오가는 콘텐츠를 통제할 수 있게 해 줍니다."
 IND_bolster_nationalism: "인도네시아 국가주의의 불씨"
 IND_bolster_nationalism_desc: "국민이 우리나라에 자부심을 갖도록 하고, 종교에서 조금씩 관심을 돌리게 합시다."
 IND_rallies_schools: "학교에서의 모의의회 개최"
 IND_rallies_schools_desc: "집회를 개최하면 청소년들에게 급진화의 위험성을 가르칠 수 있습니다."
 IND_arrest_members: "급진주의 지도자 체포"
 IND_arrest_members_desc: "알려진 급진 지도자들에게 교도소를 견학시키면 그 추종자들에게 앞으로 닥칠 일을 보여 줄 수 있습니다."
 IND_curb_fpi: "이슬람 방어 전선 (FPI)를 굴복시켜라"
 IND_curb_fpi_desc: "FPI, 즉 이슬람수호전선은 위험한 급진주의 조직이며 극단주의 이념에 대한 영향력의 대부분을 쥐고 있습니다. 이들의 영향력과 세력을 억제하는 것이 우리나라의 급진주의에 맞서 싸우는 데 필수적입니다."
 IND_persecute: "이슬람 방어 전선 (FPI) 박해"
 IND_persecute_desc: "FPI를 탄압하면 우리나라에서 극단주의 신념이 사라질 것이며, 이들은 우리의 사법 제도에 따라 재판을 받게 될 것입니다!"
 IND_embrace_it: "유연한 입장"
 IND_embrace_it_desc: "Softening our stance may make these radicals change their views on us, however we risk creating a situation we may not be able to control in the future..."
 IND_tell_police_backdown: "극단주의 지역의 경계부대 해산"
 IND_tell_police_backdown_desc: "이러한 보안 부대를 해산하면 급진 세력에게 우리가 위협이 아님을 보여 줄 수 있으며, 그들이 우리에게 호감을 갖게 되기를 기대할 수 있습니다."
 IND_fund_their_media: "이슬람 방어 전선 (FPI)을 언론에"
 IND_fund_their_media_desc: "FPI의 언론 활동을 허용하면 인도네시아 민주주의의 결실을 보여 줄 수 있습니다. 이 나라에서는 모두가 발언권을 가지며, 우리는 이념에 따라 차별하지 않을 것입니다!"
 IND_beyond_our_control: "잠깐... 왜 들고 일어서는 거야?"
 IND_beyond_our_control_desc: "배은망덕한 급진주의자들 같으니! 그들은 폭동을 일으키고 거리를 파괴하며 정부의 전복을 요구하고 있는 듯합니다. 어떻게 이런 일이 벌어졌습니까? 누가 이런 일이 일어나리라 예상했겠습니까?"
 IND_fpi: "FPI Seizes Power"
 IND_fpi_desc: "우리나라 역사에서 암울한 날이... 아니, 오늘은 우리나라 역사에서 참으로 찬란한 날입니다. 추종자들이 우리에게 부여한 힘으로 이 나라를 한 장 한 장 벽돌을 쌓듯 정화할 것입니다!"
 IND_touch_on_economy: "경제를 손봐라"
 IND_touch_on_economy_desc: "우리나라는 어려운 시기를 겪고 있으며, 경제의 일부 분야를 되살린다면 붕괴의 손아귀에서 벗어날 가능성이 있습니다."
 IND_fund_for_holy: "공장에 대한 사형 선고"
 IND_fund_for_holy_desc: "노동자를 위한 새로운 공장들이 건설되고 있습니다. 이는 우리나라의 상품과 그 유통을 활성화할 것입니다."
 IND_oppose_invest: "투자 반대"
 IND_oppose_invest_desc: "외국인 투자를 반대하는 것은 우리나라의 자원을 보존하고 독립을 유지하기 위한 한 가지 방법입니다!"
 IND_convert_tourist_destination: "관광 명소 재활성화"
 IND_convert_tourist_destination_desc: "해변 한두 곳이 무슨 대수입니까? 낡은 바위 지형이나 500년 전에 지어진 어리석은 이교도의 사원이 무슨 소용입니까? 우리나라의 힘을 키우려면 확보할 수 있는 모든 공간이 필요합니다!"
 IND_sharia_2: "샤리아!"
 IND_sharia: "샤리아!"
 IND_sharia_desc: "샤리아 법을 통해 마침내 우리나라와 사회의 정화를 시작할 수 있습니다. 처음에는 얼마간 저항이 있겠지만, 국민은 점차 이를 사랑하게 될 것입니다.."
 IND_dress_code: "복장 통일"
 IND_dress_code_desc: "복장 규정을 시행하는 것은 인도네시아 사회를 정화하는 확실한 방법입니다. 그러지 않으면 국민이 이교도가 되어 우리의 계획에 차질을 빚을 것입니다!"
 IND_gender_seg: "Segregate the Genders"
 IND_gender_seg_desc: "성별을 분리하여 각자의 역할로 돌려보내는 것이 제멋대로 하게 놔두는 것보다 훨씬 더 큰 성과를 가져다줄 것입니다."
 IND_raid_bar: "방해물을 습격해라"
 IND_raid_bar_desc: "새로운 법이 시행되었음에도 일부 이교도들은 여전히 지하 술집을 운영하고 있습니다. 이러한 영업을 즉시 폐쇄해야 합니다!"
 IND_regional_purification: "지역 정화"
 IND_regional_purification_desc: "이웃 나라들이 이교도이며 불결한데 어떻게 우리 국민을 정화할 수 있겠습니까? 이제 우리가 직접 나설 때입니다!"
 IND_purify_singapore: "싱가포르 정화"
 IND_purify_singapore_desc: "싱가포르는 우리와 같은 이슬람 국가이지만, 그들의 터무니없는 정책은 종교와 지역의 순수성에 수치를 안기고 있습니다!"
 IND_purify_asia: "남아시아 정화"
 IND_purify_asia_desc: "남아시아를 정화하면 대륙 전체에 발판을 마련할 수 있습니다. 그렇게 할 수 있다면 우리는 정화주의 정책을 계속 이어 나갈 수 있습니다."
 IND_holy_indonesia: "정화된 인도네시아"
 IND_holy_indonesia_desc: "우리는 조국 인도네시아의 정화에 성공했습니다. 이제 국민의 이슬람적 열정과 함께 21세기를 향해 나아갈 수 있습니다!"
 IND_help_aceh: "아체 지원"
 IND_help_aceh_desc: "These are trying times, Aceh has been struck with disaster and our people living there are in serious danger. We must coordinate an effort to help them as much as we can."
 IND_send_aid_package: "재난 구조팀 조직"
 IND_send_aid_package_desc: "아체 주민들이 다시 일어설 수 있도록 재난 구호를 조율해야 합니다."
 IND_bring_resistance_down_one: "지역 지도자들과의 동맹"
 IND_bring_resistance_down_one_desc: "지역 지도자들과 동맹을 맺으면 그들의 신뢰를 얻고 관계 회복의 첫 번째 단계를 시작할 수 있습니다."
 IND_bring_resistance_down_two: "지역 지도자에게 원조 공여"
 IND_bring_resistance_down_two_desc: "지역 지도자들에게 자금을 제공하면 파괴된 건물의 재건 사업에 자금을 투입하도록 할 수 있습니다."
 IND_bring_resistance_down_three: "골칫거리 체포"
 IND_bring_resistance_down_three_desc: "끔찍한 재앙이 닥쳤음에도 아체의 일부는 평화를 원하지 않습니다. 이 무의미한 분쟁에서 벗어날 수 있도록 그들을 처리해야 합니다."
 IND_bring_resistance_down_four: "아체를 되돌려라!"
 IND_bring_resistance_down_four_desc: "이제.. 이제 마침내 아체 주민들을 인도네시아로 다시 맞이하여 앞으로 수백 년간 함께 번영할 때가 되었습니다!"
 indonesia.8.t: "동티모르에 대한 배상을 요구하는 인도네시아!"
 indonesia.8.d: "인도네시아는 우리가 동티모르의 독립을 지원했다는 이유로 배상금 지급을 요구하고 있습니다. 그들은 오스트레일리아의 주머니에서 나갈 터무니없는 금액을 요구하고 있습니다. 이를 거부할 수 있지만 통제할 수 없는 상황으로 번질 수 있습니다."
 indonesia.8.a: "그들에게 와서 가져가라고 해라"
 indonesia.8.b: "그래, 이러면 좀 잠잠해 지겠지"
 indonesia.800.t: "그들의 수락!"
 indonesia.800.d: "오스트레일리아가 동티모르 개입에 대한 배상금을 지급하겠다고 제안했으나, 그들 때문에 우리가 영토를 잃었으므로 결코 충분하지 않을지도 모릅니다..."
 indonesia.800.a: "완벽하다!"
 indonesia.80.t: "그들의 거부!"
 indonesia.80.d: "우리가 오스트레일리아에 매우 정중하고 관대한 요구를 했음에도 그들은 이를 거절했습니다. 그들은 우리에게 협력할 의사가 없는 듯하며, 우리나라에 고통을 안겨 준 것에 대해 후회조차 하지 않는 것으로 보입니다!"
 indonesia.80.a: "알겠다, 허나 어떻게든 배상을 받아낼 것이다!"
 indonesia.7.t: "리아우 제도에서 철수를 요구하는 인도네시아!"
 indonesia.7.d: "인도네시아 대사들이 우리에게 리아우에 대한 영유권 주장을 철회하라고 요구하고 있습니다. 이는 양국 사이에서 뜨거운 논쟁거리였으며 마침내 끓는점에 도달한 것으로 보입니다. 가능한 한 빨리 대응을 준비해야 합니다"
 indonesia.7.a: "아니다, 리아우는 우리 것이다!"
 indonesia.7.b: "그들이 가져가라고 해라, 우리는 그 비통하고 조그만한 섬이 필요없다"
 indonesia.70.t: "Malaysia Refuses to Cede Riau!"
 indonesia.70.d: "말레이시아 외교관들이 최근 우리의 제안을 거부한다고 통보했습니다. 이는 인도네시아 주권에 대한 침해이며 적절한 대응으로 맞서야 합니다!"
 indonesia.70.a: "그들이 자초한 일이지.."
 indonesia.700.t: "They Cede Riau!"
 indonesia.700.d: "우리의 메시지가 명확히 전달된 듯합니다. 리아우는 우리의 것입니다! 말레이시아 외교관들은 최근 리아우 섬에 대한 모든 영유권 주장을 포기했다고 전해 왔습니다. 이제 인도네시아는 안도의 한숨을 돌릴 수 있습니다"
 indonesia.700.a: "좋다"
 indonesia.923.t: "Indonesia's Future"
 indonesia.923.d: "우리나라는 네덜란드로부터 독립을 얻은 때까지 거슬러 올라가는 아주 오랜 기간 동안 혼란 상태에 놓여 있었습니다. 재정 문제에서 사회 및 민족 문제에 이르기까지 인도네시아는 사방에서 타격을 받아 왔으며 더는 오래 버틸 수 없습니다. 21세기 인도네시아의 존속과 번영을 보장하기 위해 단호한 조치를 취해야 합니다. 따라서 우선 내부의 문제부터 해결하는 것에서 시작해야 합니다"
 indonesia.923.a: "앞으로 나아가자!"
 indonesia.69.t: "칼리만탄에서의 폭력!"
 indonesia.69.d: "이주 사건 당시 삼피에서 마두라인 두 명이 다수의 다야크인에게 공격당하면서 폭력의 연쇄가 시작되었습니다. 이 갈등은 이제 본격적인 위기로 번져 사망자가 날마다 늘고 있으며 많은 사람이 집을 잃고 있습니다. 보안군은 현재 명령을 기다리며 대기하고 있습니다"
 indonesia.69.a: "그들 스스로 처리할 수 있겠지!"
 indonesia.69.b: "무엇을 기다리나? 당장 바로잡아라!"
 indonesia.5.t: "Indonesia Requests Funds"
 indonesia.5.d: "인도네시아는 국내에서 매우 격렬한 종교 분쟁을 겪고 있으며, 우리에게 재정 지원을 요청하고 있습니다"
 indonesia.5.a: "좋다, 더 큰 이익을 위한 것이니"
 indonesia.5.b: "안된다."
 indonesia.50.t: "네덜란드의 원조 동의!"
 indonesia.50.d: "신중한 검토 끝에 네덜란드 외교관들이 우리 기독교도들이 분쟁에서 승리하는 데 쓸 수 있도록 약간의 자금을 지원해 주기로 했습니다"
 indonesia.50.a: "완벽하다"
 indonesia.500.t: "네덜란드의 원조 거부!"
 indonesia.500.d: "네덜란드 외교관들이 찾아와 자국 정부가 우리 기독교도들에 대한 지원을 거부했다고 통보했습니다!"
 indonesia.500.a: "Unbelievable"
 indonesia.6.t: "Indonesia Requests Funds"
 indonesia.6.d: "인도네시아는 국내에서 매우 격렬한 종교 분쟁을 겪고 있으며, 우리에게 재정 지원을 요청하고 있습니다"
 indonesia.6.a: "좋다, 더 큰 이익을 위한 것이니"
 indonesia.6.b: "안된다."
 indonesia.60.t: "The Saudis Agree to Aid Us!"
 indonesia.60.d: "신중한 검토 끝에 사우디 외교관들이 우리 무슬림들이 분쟁에서 승리하는 데 쓸 수 있도록 약간의 자금을 지원해 주기로 했습니다"
 indonesia.60.a: "완벽하다"
 indonesia.600.t: "Saudis Refuse Aid!"
 indonesia.600.d: "사우디 외교관들이 찾아와 자국 정부가 우리 무슬림들에 대한 지원을 거부했다고 통보했습니다!"
 indonesia.600.a: "Unbelievable"
 indonesia.772.t: "극단주의 지도자 리지크 시바브의 체포!"
 indonesia.772.d: "\\"FPI\\" 조직의 급진 지도자 리지크 시하브가 체포되어 재판을 기다리고 있습니다. 이제 우리 민주주의가 급진주의자들과 그들의 시대착오적 이상으로부터 직접적인 위협을 받지 않게 되었으므로, 이는 인도네시아 안보에 있어 큰 승리입니다!"
 indonesia.772.a: "A victory for democracy."
 indonesia.2.t: "동티모르에 대한 의문"
 indonesia.2.d: "우리나라에 쓰라린 순간이 찾아왔습니다. 우리의 여러 섬 중 하나인 동티모르의 주민들이 독립을 요구하고 있습니다. 격렬한 시위와 폭동, 충돌로 인해 극심한 불안이 초래되었고 정치 및 사회 발전이 심각하게 지연되었습니다. 이제 나라의 운명을 결정하는 것은 우리에게 달려 있습니다. 국제연합(UN)의 뜻에 따를 것인지, 우리의 길을 갈 것인지 선택해야 합니다"
 indonesia.2.a: "이는 동티모르 사람들이 원하는 것이다... 우리가 아니라"
 indonesia.2.b: "이제 와서 뭘 하고 싶다고?"
 indonesia.3.t: "유엔의 헌법 승인!"
 indonesia.3.d: "우리가 동티모르의 독립을 승인한 후, 국제연합은 그들의 헌법을 승인했습니다. 민주적이고 독립된 동티모르가 곧 우리의 이웃이 될 것입니다.. "
 indonesia.3.a: "이것이 그들이 원한 것인가"
 indonesia.4.t: "동티모르는 이제 자유다!"
 indonesia.4.d: "공식적입니다. 국제연합의 헌법 승인이 마침내 발효되었으며, 독립한 동티모르가 이제 우리의 이웃이 되었습니다."
 indonesia.4.a: "좋은 관계가 되기를 바라자"
 indonesia.9.t: "동티모르의 독립을 거부하는 인도네시아!"
 indonesia.9.d: "인도네시아 정권은 동티모르 국민에게서 자유와 독립을 박탈했습니다. 많은 반군 단체가 우리를 잠재적 해방자로 바라보고 있으며, 현재 이 지역과 세계에서 큰 긴장이 조성되고 있습니다..."
 indonesia.9.a: "Alright, that's enough!"
 indonesia.9.b: "우리 문제가 아니다"
 indonesia.55.t: "우리 학생들의 미래!"
 indonesia.55.d: "이제 우리 아이들의 교육의 미래를 논의할 때가 되었습니다. 우리가 알기로는 오랫동안 종교부가 학교 제도를 운영해 왔으며 학생들에게 온건한 수준의 이슬람 교육을 부과해 왔습니다. 이러한 접근법이 정말로 효과적인지 재평가해야 합니다..."
 indonesia.55.a: "종교 교육을 계속해라!"
 indonesia.55.b: "종교 교육을 멈춰라!"
 indonesia.77.t: "걷잡을 수 없는 민족간의 긴장!"
 indonesia.77.d: "우리나라 안에서 격화되는 민족 갈등을 해결해야 할 때입니다. 암본과 보르네오 같은 여러 지역에서 거의 매일 폭력이 벌어지고 있습니다. 국민이 종교적 신념을 두고 서로 싸운다면 나라는 계속 유지될 수 없습니다. 이제 단호히 나서서, 누군가를 지지할 것이라면 누구를 지지할지 선택해야 합니다."
 indonesia.77.a: "무슬림들은 우리가 필요하다!"
 indonesia.77.b: "We don't pick favorites, just fix it already!"
 indonesia.77.c: "기독교인들은 우리가 필요하다!"
 indonesia.1000.t: "Parliament Stormed"
 indonesia.1000.d: "수개월에 걸친 폭동과 충돌이 마침내 이 지경에 이르렀습니다.. 우리의 지지자와 추종자들이 인도네시아 의회를 성공적으로 점거하고 여러 핵심 인사의 사임을 요구했으며, 모두가 이에 응했습니다. 인도네시아 국민은 이제 이른바 민주주의라는 영원한 폭정에서 해방되었습니다"
 indonesia.1000.a: "혁명이 성공했다"
 indonesia.1001.t: "기독교인들의 손에 들어간 암본 시티!"
 indonesia.1001.d: "암본에서의 수년간의 전투가 마침내 막을 내렸고, 주민들은 안도의 한숨을 쉴 수 있게 되었습니다. 도시의 기독교도들이 승리를 거두었으며, 우리는 인근 마을과 촌락에 기독교인 지도자들을 임명하기 시작했습니다"
 indonesia.1001.a: "이건 시간의 문제였다.."
 indonesia.1002.t: "무슬림들의 손에 들어간 암본 시티!"
 indonesia.1002.d: "암본에서의 수년간의 전투가 마침내 막을 내렸고, 주민들은 안도의 한숨을 쉴 수 있게 되었습니다. 도시의 무슬림들이 승리를 거두었으며, 우리는 인근 마을과 촌락에 무슬림 지도자들을 임명하기 시작했습니다"
 indonesia.1002.a: "예상대로군"
 indonesia.27.t: "Wahid's Impeachment!"
 indonesia.27.d: "전체 회의를 거쳐 국민협의회(MPR)는 무모한 정책과 금융 위기 대응에서 드러난 무능을 이유로 와히드 대통령을 탄핵하기로 결정했습니다. 이들은 이제 메가와티 수카르노푸트리 부통령을 인도네시아 대통령으로 임명했습니다!"
 indonesia.27.a: "그럴줄 알았다!"
 indonesia.37.t: "발리에서의 공격!"
 indonesia.37.d: "발리의 한 나이트클럽에서 여러 발의 폭탄이 터져 우리 국민과 외국인을 포함해 202명이 사망했습니다. 오스트레일리아인 88명이 목숨을 잃었으며 우리는 이제 오스트레일리아 당국과 다른 나라들로부터 이 문제에 대처하라는 압박을 받고 있습니다. 이러한 공격의 근원으로 알려진 극단주의 단체 자마아 이슬라미야가 지목되고 있습니다. 상황이 더 악화되기 전에 이 문제에 대해 즉시 결정을 내려야 합니다"
 indonesia.37.a: "조사를 진행하고, 가족들에게 보상을 해주어라"
 indonesia.37.b: "유감이군"
 indonesia.477.t: "습격"
 indonesia.477.d: "성난 군중이 와메나 지구의 무기고를 점거했으며, 이는 매우 치명적인 사태가 될 수 있습니다. 우리 보안군은 위험에 처할 수 있는 민간인들을 대피시켜 안전한 곳으로 옮기기 시작했으나, 현재 이 군중의 동기는 아직 알려지지 않았습니다"
 indonesia.477.a: "빨리 뭐라도 해라!"
 indonesia.477.b: "스스로 잠잠해지기를 바라자"
 indonesia.577.t: "아체에서의 쓰나미"
 indonesia.577.d: "파괴적인 쓰나미가 반다아체와 주의 다른 지역을 강타했습니다. 아체는 게릴라전과 저항의 중심지였으므로, 재난이 발생해도 우리와 그들 사이에 협력이 이루어지지 않았습니다. 그러나 이번에는 상황이 매우 다릅니다. 그들은 더 이상 이만한 규모의 사건을 스스로 감당할 수 없으며 복구를 위해 우리의 도움이 필요합니다. GAM은 휴전을 제안했으며 분쟁을 끝내기 위해 협력할 의사를 밝혔습니다"
 indonesia.577.a: "Another Disaster..."
 indonesia.67.t: "서파푸아에서 문제를 이르킨 난민"
 indonesia.67.d: "오스트레일리아가 또다시 우리의 내정에 간섭했으며, 이번에는 서파푸아의 문제 유발자들에게 망명을 제공하고 있습니다. 자카르타와 캔버라 사이의 긴장은 끓는점에 도달했으며 필요하다면 조치를 취할 준비가 되어 있습니다!"
 indonesia.67.a: "미래에 같은일을 반복하지 않도록 감시 초소에 자금을 지원하자!"
 indonesia.67.b: "자금이 혹여나... 다른 곳으로 흘러들어가진 않을까.."
 indonesia.678.t: "The National Committee of West Papua is formed"
 indonesia.678.d: "KNPB로도 알려진 서파푸아 민족위원회는 서파푸아에 기반을 둔 단체로 이 지역의 지위에 관한 국민투표를 주장하고 있습니다. 그들의 메시지는 평화적이지만, 목표가 달성된다면 우리나라에 재앙이 될 것입니다"
 indonesia.678.a: "의회 해산"
 indonesia.678.b: "건설이 조금 지연되는 것은 큰 문제가 아니다"
 indonesia_news.1.d: "테스트"
 indonesia_news.1.a: "테스트"
 indonesia.95.t: "독립을 선언한 동티모르!"
 indonesia.95.d: "우리의 정당한 영토를 지키겠다는 결정에 따라 동티모르가 독립을 선언하기로 했습니다. 그러나 가장 충격적인 점은 오스트레일리아가 은밀히 그들에게 무기를 밀반입했으며, 그들이 이제 우리에게 대항해 봉기하고 있다는 것입니다!"
 indonesia.95.a: "우린 기한 내에 복수할 것이다!"
 indonesia.420.t: "지원 요청!"
 indonesia.420.d: "우리나라의 아시아 금융 위기에 대처하려면 외국 기관의 도움을 구해야 합니다. 일본은 도움을 줄 의향이 있는 우리의 가장 가까운 파트너입니다. 그러나 일본은 과거에 우리나라에 해를 끼쳤으며 많은 민족주의 및 반서방 단체가 또 다른 대안을 요구하고 있습니다. 그 대안은 중국입니다. 중국 역시 우리나라를 돕는 데 열려 있으나, 그렇게 하면 우리는 그들의 직접적인 세력권으로 들어가게 되어 정치 노선이 바뀔 수도 있습니다."
 indonesia.420.a: "우리는 일본의 지원이 필요하다!"
 indonesia.420.b: "China knows what they're doing, call them!"
 IND_ethnic_tension: "Squash Ethnic Troubles"
 IND_ethnic_tension_desc: "Indonesia is an ethnically, culturally and religiously diverse state. This often leads to troubles between our peoples. This causes instability and we must immediately find a solution!"
 IND_aceh_in_turmoil: "혼란에 빠진 아체!"
 IND_aceh_in_turmoil_desc: "Aceh has been in a state of disarray and rebellion since 1976, and it's causing our nation instability and unnecessary bloodshed. Our military is way too focused on dealing with these insurgents, and it is causing us to fall behind militarily\n§W--------------§!\nThis national spirit will be §RRemoved§! if we §Hceasefire with Aceh in 2004§!."
 IND_rupiah_crisis: "루피아 위기"
 IND_rupiah_crisis_desc: "The Rupiah, our nation's currency is seriously weak. This is the result of decades of corruption and mismanagement and it is about time we fix it and get our economy back on the global stage."
 IND_popular_tourist_destination: "인기있는 여행 관광지"
 IND_popular_tourist_destination_desc: "Indonesia is a really popular tourist destination. This is the result of our great culture and history."
 IND_growing_radicalization: "증가하는 급진화"
 IND_growing_radicalization_desc: "Being an Islamic country, our nation's youth and people are prone to radicalization and hardline ideals."
 IND_asian_crisis: "인도네시아의 아시아 금융 위기"
 IND_asian_crisis_desc: "The 1997 Asian Financial Crisis hit Indonesia and its neighbors very hard, causing a slow down in almost all walks of life in the nation."
