 AFG_afghan_independents_in_power_tt: "£GFX_AFG_western_autocracy §YАфганские независимые§! находится у власти"
 AFG_add_coalition_parties_tt: "Будет  §GУсиливаться§! наш авторитет, добавив оппозиционные партии в коалицию, чтобы они не могли напрямую бросить нам вызов."
