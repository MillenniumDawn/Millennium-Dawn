 STAT_NAVY_SUB_VISIBILITY: "£sub_visibility_texticon Visibilidade de Submarinos:"
 STAT_NAVY_SUB_VISIBILITY_DESC: "Quão fácil é detectar um submarino."
 STAT_NAVY_SHORE_BOMBARDMENT: "Capacidade de Assalto Anfíbio: "
 STAT_NAVY_SHORE_BOMBARDMENT_DESC: "A capacidade de um navio de auxiliar as tropas embarcadas em assaltos anfíbios e combates nas praias próximas quando em missão de Espera."
 STAT_NAVY_MISSION_COVERAGE: "Eficiência de Detecção de Inimigos: "
 STAT_NAVY_MISSION_COVERAGE_DESC: "§TQuão eficiente o navio é em detectar inimigos. Cada navio adiciona sua eficiência de detecção.§!"
 STAT_NAVY_FIRE_RANGE_DESC: "O alcance dos mísseis principais do navio."
 STAT_NAVY_EVASION: "Armas de Defesa Ponto-a-Ponto: "
 STAT_NAVY_EVASION_DESC: "Habilidade dos navios em evitar ataques inimigos com flares, CIWS e outras contramedidas. Navios menores têm naturalmente mais probabilidade de evitar ataques."
 STAT_NAVY_SUB_ATTACK: "£depth_charge_texticon Guerra Antissubmarino: "
 STAT_NAVY_SUB_ATTACK_DESC: "Quanto dano podemos causar a submarinos inimigos."
 STAT_NAVY_ATTACK: "£attack_texticon Poder de Fogo de Mísseis: "
 STAT_NAVY_ATTACK_DESC: "Quantos e quão poderosos são os mísseis antinavio que temos."
