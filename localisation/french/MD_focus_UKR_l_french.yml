 ukraine_develop_btr4.10.desc: "Nous pouvons choisir la durée et la complexité des tests de pré-production pour le BTR-4 VCI.\n\nNous pouvons opter pour un programme de base afin d'économiser du temps et de l'argent, ou un programme étendu nécessitant plus de ressources, mais permettant d'éliminer les défauts visibles lors de la production en petite série. Les éliminer garantira une machine plus fiable lors de la production à grande échelle."
