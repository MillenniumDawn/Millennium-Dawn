l_japanese:
 TAI_legacy_of_1949: "1949年の遺産"
 TAI_legacy_of_1949_desc: "1949年の中国内戦終結は、国民党（KMT）とその支持者が台湾島省へ逃亡するのを見た。この出来事の遺産は、地元の土着台湾運動と組み合わさり、台湾市民の大多数による本土との再統一への強い拒絶につながった。"
 TAI_the_great_chip_empire: "大チップ帝国"
 TAI_the_great_chip_empire_desc: "台湾は半導体およびマイクロチップ生産がまだ黎明期にあった時期にその機会を活かし、さらに他国よりも魅力的な投資先でもあったことから、この業界の最前線へと躍り出た。安価かつ効率的な生産と欧米諸国への大規模な輸出を通じて、台湾は経済と国家安全保障の基盤を、欧米諸国へのマイクロチップ供給に据えてバランスを保ち、絶え間ない革新によって業界のリーダーとしての地位を維持し続けている。"
 TAI_flight_crew_strike: "桃園客室乗務員組合のストライキ"
 TAI_flight_crew_strike_desc: "結果が出ないなら止まらない！"