 DESIGNER_EMPTY_NAME: "§RУ шаблона бригады должно быть название§!"
 DESIGNER_TEMPLATE_NAME_EXISTS: "§RШаблон бригады с таким названием уже существует§!"
 DESIGNER_REGULAR_TEMPLATE_IN_USE: "§RЭтот шаблон нельзя превратить в шаблон штаба армии: его используют развёрнутые бригады, не являющиеся штабами§!"
