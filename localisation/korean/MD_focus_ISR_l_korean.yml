 israel_economy.221.t: "보이콧을 중단하기로 결정한 [FROM.GetNameWithFlag]!"
 israel_economy.221.d: "최근 [FROM.GetNameWithFlag] 정부가 우리나라에 대한 보이콧을 중단하기로 결정했습니다. 필요한 모든 관계가 복원되었습니다. 다만 그들은 우리의 정책이 자신들이나 역내에 부정적인 영향을 미치면 다시 보이콧할 수 있다고 말합니다."
 israel_economy.221.a: "훌륭해!"
 israel_economy.222.t: "보이콧을 강화하기로 결정한 [FROM.GetNameWithFlag]!"
 israel_economy.222.d: "최근 [FROM.GetNameWithFlag] 정부가 우리나라에 대한 보이콧을 강화하기로 결정했습니다. 그들과의 많은 관계가 이제 중단되었습니다. 다만 그들은 우리의 정책이 자신들이나 역내에 긍정적인 영향을 미치면 보이콧을 다시 풀 수 있다고 말합니다."
 israel_economy.222.a: "당연하지!"
 israel_economy.223.t: "보이콧을 포기하기로 결정한 [FROM.GetNameWithFlag]!"
 israel_economy.223.d: "최근 [FROM.GetNameWithFlag] 정부가 우리나라에 대한 보이콧을 영원히 포기하기로 결정했습니다. 필요한 모든 관계가 복원되었으며 지속이 보장됩니다. 이는 그들이 우리의 적대 행위를 용인한다는 뜻은 아니지만, 양국 관계에 우호의 정신이 이제 뚜렷해졌습니다."
 israel_economy.223.a: "훌륭해!"
 Cat_GENES: "유전자 연구"
 israel.5.t: "미국-이스라엘 합동 훈련!"
 israel.5.d: "최근 우리 군은 [ISR.GetNameWithFlag]과(와) 군사 훈련을 실시했으며, 이를 통해 양국 모두 시가전, 협조, 군수 분야에서 더 많은 경험을 쌓았습니다."
 israel.5.a: "훌륭해!"
 will_appear_after_dec_tt: "§Y이 중점의 효과는 우리가 어떤 군사 계획을 사용할지 결정한 후에 나타납니다!§!"
 golan_fort_tt: "§Y헤즈볼라 및 시리아와의 국경에 레벨 2 육상 요새를 추가합니다!§!"
 israel.6.t: "키프로스-이스라엘 합동 훈련!"
 israel.6.d: "최근 우리 군은 [ISR.GetNameWithFlag]과(와) 군사 훈련을 실시했으며, 이를 통해 양국 모두 산악전, 협조, 군수 분야에서 더 많은 경험을 쌓았습니다."
 israel.6.a: "훌륭해!"
 israel.7.t: "우리 항공기를 구매하려는 이스라엘"
 israel.7.d: "이스라엘이 자국 방위군과 이스라엘 국방군을 위해 우리의 훈련기 수십 대를 구매하려 합니다. 동의하시겠습니까?"
 israel.7.a: "좋습니다."
 israel.7.b: "아니."
 israel.8.t: "독일의 동의"
 israel.8.d: "독일이 훈련기의 우리 측 인도를 공식 승인했습니다. 첫 번째 항공기 물량이 곧 우리나라에 도착할 것입니다."
 israel.8.a: "좋습니다."
 israel.9.t: "우리를 거절한 독일"
 israel.9.d: "독일이 훈련기를 구매하겠다는 우리의 제안을 거절했습니다. 다른 믿을 만한 공급처를 찾아야 할 것 같습니다."
 israel.9.a: "안타깝다."
 israel.10.t: "우리 항공기 한 묶음을 구매하려는 이스라엘"
 israel.10.d: "이스라엘이 자국 비행대를 위해 우리의 F-35 구매를 요청해 왔습니다. 이 기체들은 최첨단 장비이긴 하지만, 판매를 통해 우리는 이스라엘 및 중동 지역 내 영향력을 확대할 수 있을 것입니다. 그들에게 판매해야 할까요?"
 israel.10.a: "좋습니다."
 israel.10.b: "아니."
 israel.11.t: "미국이 F-35 판매를 승인했다"
 israel.11.d: "미국이 최신 항공기를 우리에게 판매하기로 동의했습니다. 그들의 도움으로 우리는 이 지역에서 제공권을 확보할 수 있을 것입니다. 첫 항공기 물량이 이미 우리나라에 도착했습니다."
 israel.11.a: "좋습니다."
 israel.12.t: "미국의 거절"
 israel.12.d: "미국이 자국 항공기의 공급을 거부했습니다. 그들은 자국 항공기가 잘못된 손에 들어가는 것을 원하지 않습니다. 우리는 현대식 전투기의 새로운 공급처를 찾아야 할 것입니다."
 israel.12.a: "안타깝다."
 ISR_modernization_of_armored_forces_idea: "현대화된 기갑군단"
 ISR_ger_fleet_tt: "§Y[GER.GetNameWithFlag]§!에 $3.6 십억에 §Y독일제 잠수함 3척§!을 구매하겠다는 요청을 보냅니다."
 ISR_ger_fleet_again_tt: "§Y[GER.GetNameWithFlag]§!에 $3.6 십억에 §Y독일제 잠수함 3척§!을 구매하겠다는 요청을 다시 보냅니다.\n다만 §Y지도부§!가 같은 거래를 다시 진행하는 것에 §R회의적§!일 수 있습니다."
 ISR_GER_agree_to_sell_tt: "$3.6 십억에 §Y잠수함 3척§!을 건조하는 데 동의합니다"
 israel.13.t: "흥미로운 제안을 보내온 [ISR.GetNameWithFlag]"
 israel.13.d: "[ISR.GetNameWithFlag]의 대표단이 흥미로운 제안을 가지고 우리나라에 도착했습니다. 그들은 막대한 금액을 대가로 자신들을 위해 함선 몇 척을 건조해 줄 것을 요청합니다."
 israel.13.a: "해보자!"
 israel.13.b: "우리 함대는 판매용 상품이 아니다."
 israel.14.t: "[FROM.GetNameWithFlag]의 수락!"
 israel.14.d: "[FROM.GetNameWithFlag]이(가) 우리를 위해 함선 몇 척을 건조해 주겠다는 우리의 제안을 수락했습니다!"
 israel.14.a: "좋아!"
 israel.15.t: "[FROM.GetNameWithFlag]의 거절!"
 israel.15.d: "[FROM.GetNameWithFlag]이(가) 우리를 위해 함선 몇 척을 건조해 달라는 우리의 제안을 거절했습니다!"
 israel.15.a: "젠장!"
 madan_idea: "이스라엘 해군 정보 부서"
 ISR_air_reservists_idea: "예비역 전략"
 ISR_air_profs_idea: "전문 조종사"
 cheap_solut_tt: "§Y이 중점§!은 §G비용이 저렴하며§! §4크네세트§!의 승인이 §G필요하지 않습니다§!!"
 ISR_intelligence_lahak: "정보 라학"
 ISR_idid_rest: "IDI 우세"
 kirya_ontop: "키랴 우세"
 gilot_ontop: "글릴롯 우세"
 kirya_gilot_middle: "키랴-글릴롯 균형"
 israel.16.t: "우주 비행 STS-107, 우주왕복선 컬럼비아호"
 israel.16.d: "우주 비행 STS-107이 발사 준비를 마쳤습니다. 수년간 이스라엘과 미국의 우주비행사들이 이번 비행을 위해 훈련해 왔습니다. 우리 두 나라 국민이 발사를 기다리고 있습니다.\nSTS-107 컬럼비아호는 과학 및 연구 임무를 전담하는 16일간의 비행으로 계획되어 있습니다. 비행이 §G성공§!하면 우리와 [ISR.GetNameWithFlag]은(는) 미사일 연구 보너스를 얻습니다. 발사를 진행하시겠습니까?"
 israel.16.a: "물론입니다!"
 israel.16.b: "발사를 취소한다."
 israel.17.t: "발사된 STS-107!"
 israel.17.d: "STS-107 컬럼비아호는 과학 및 연구 임무를 전담하는 16일간의 비행으로 계획되어 있습니다. 그러나 발사 중 우주왕복선의 좌측 날개 앞전이 외부 연료 탱크에서 떨어진 파편에 맞았습니다. 모든 것이 잘 진행되기를 바랍시다..."
 israel.17.a: "행운을 빈다"
 israel.18.t: "취소된 STS-107 발사!"
 israel.18.d: "NASA는 안전 문제와 기타 우려로 인해 발사를 취소하기로 결정했습니다. 일란 라몬은 이스라엘로 돌아올 것입니다."
 israel.18.a: "매우 유감이다."
 israel.19.t: "귀환을 준비하는 STS-107!"
 israel.19.d: "STS-107이 지구로 귀환할 준비를 하고 있습니다. 우주왕복선이 입은 손상이 착륙에 영향을 미치지 않기를 바랍시다."
 israel.19.a: "신이 그들을 구하시기를..."
 israel.20.t: "우주왕복선 컬럼비아호 참사!"
 israel.20.d: "우주왕복선 컬럼비아호가 텍사스와 루이지애나 상공에서 대기권에 재진입하던 중 분해되어 탑승한 우주비행사 7명이 모두 사망했습니다. 이는 1986년 챌린저호와 승무원을 잃은 이후 재앙으로 끝난 두 번째 우주왕복선 임무였습니다.\n재진입 전 NASA 관리자들은 문제가 확인되더라도 승무원이 이를 고칠 수 없을 것이라고 판단하여 조사를 제한했습니다. 컬럼비아호가 지구 대기권에 재진입했을 때 손상된 부위로 뜨거운 대기 가스가 열 차폐막을 뚫고 들어와 내부 날개 구조를 파괴했고, 이로 인해 궤도선이 불안정해지며 산산조각 났습니다."
 israel.20.a: "그들의 죽음을 애도한다."
 israel.21.t: "성공적으로 착륙한 STS-107!"
 israel.21.d: "우주왕복선이 입은 손상에도 불구하고 승무원들은 안전하게 지구에 착륙했습니다. 모든 연구 자료가 성공적으로 회수되었습니다!"
 israel.21.a: "좋아!"
 isr_usa_flight_tt: "[USA.GetNameWithFlag]이(가) 공동 비행에 동의하면 §G$10 십억§!을 지출합니다.\n비행이 §R실패§!할 §Y확률은 50%§!입니다.\n비행이 §G성공§!하면 우리와 [USA.GetNameWithFlag]은(는) 미사일 연구 보너스를 얻습니다."
 israel.22.t: "달에 도달한 베레시트!"
 israel.22.d: "베레시트1은 이스라엘 비영리 기관 SpaceIL의 민간 달 탐사 미션입니다. 베레시트1은 더 많은 이스라엘인들이 STEM(과학, 기술, 공학, 수학) 분야에서 경력을 쌓도록 영감을 주기 위해 기획되었습니다. 베레시트1은 성공적으로 달에 도달했지만, 착륙에 실패하여 추락했습니다."
 israel.22.a: "흥미롭군!"
 ISR_sion_production: "고급 드론 생산"
 israel_mechanic.21.t: "암살 준비 중..."
 israel_mechanic.21.d: "우리 지휘 본부는 오늘 하마스 지도자를 제거하는 계획에 대해 회의를 준비했습니다. 우리는 진행 방법에 대해 두 가지 옵션을 받았습니다. 첫 번째는 우리 요원들이 적의 위치를 추적하여 그의 호텔 방에 즉석 폭발 장치를 설치하고 그가 도착하는 즉시 이를 폭파하는 방법입니다. 두 번째는 이라크 쿠르디스탄에서 미사일을 발사하는 방법인데, 만약 우리가 그 능력을 가지고 있다면 말입니다. 우리는 어떻게 해야 할까요?"
 israel_mechanic.21.a: "폭탄을 설치하라!"
 israel_mechanic.21.b: "미사일을 사용하라"
 israel_mechanic.22.t: "Assassination of [HAM.GetNameWithFlag] Leader!"
 israel_mechanic.22.d: "[HAM.GetLeader], head of the politburo of the [HAM.GetNameWithFlag], was killed in an Israeli strike. Arabic-language media reported that the attack on [HAM.GetNameWithFlag]'s residence was carried out by a missile launched from outside Iran. At the same time, the leader of the Palestinian Islamic Jihad, Ziyad al-Nahala, was on another floor of the same building and was not injured, which raises suspicions about the veracity of such information."
 israel_mechanic.22.a: "허."
 israel_mechanic.23.t: "Failed Assassination of [HAM.GetNameWithFlag] Leader!"
 israel_mechanic.23.d: "Recently, a terrorist attack happened in Iran, when [HAM.GetLeader], leader of [HAM.GetNameWithFlag] was visiting Iran. However, the Assassination attempt failed and [HAM.GetLeader] survived. Iran's officials now claim that it is a dangerous provocation of Israeli terrorists who try to destabilize the axis of resistance."
 israel_mechanic.23.a: "흥미롭군"
 wesill_be_creful2_tt: "Our §4Mossad§! agents will enter [PER.GetNameWithFlag] through §YSouth Caucasus§! and will try to §GAssassinate the leader of [HAM.GetNameWithFlag]§!. We will need to be §Ycareful§! about what we will choose in giving our orders."
 israel_lebanon_occup_category: "남레바논 안보 지대"
 israel_lebanon_occup_category_desc: "§Y남레바논§! 안보 지대 행정부는 남레바논 안보 지대 지역에 있는 §Y남레바논§!의 지방 임시 통치 기구입니다. 이는 §Y자유 레바논 국가§!의 기구를 대체했으며 1985년부터 [ISR.GetNameWithFlag]의 전면적인 군수 및 군사 지원 아래 운영되고 있습니다.\n§Y우리 국민§!은 §R점령§!의 지속에 반대하며 현 지도자 [ISR.GetLeader]은(는) 우리 군대를 철수시키겠다고 약속했습니다. 그러나 우리는 남레바논에 병력을 §Y유지§!하는 쪽을 선택할 수도 있으며, 이는 대중의 반발을 초래할 수 있지만 장래에 전쟁이 발생할 경우 우리에게 도움이 될 것입니다."
 south_lebanon_occupation_ticker_mission: "정치적 반발!"
 south_lebanon_occupation_ticker_mission_desc: "남레바논 점령에 대한 우리의 입장을 결정해야 합니다. 아무 조치도 취하지 않으면 문제가 두 배가 되고 병력은 그대로 남게 되며 이후에는 이를 바꿀 수 없습니다.\n§Y병력은 남는다§! 또는 §Y우리 아이들을 집으로§! 중점 중 하나를 완료해야 합니다."
 result_dep_on_pol_tt: "결과는 우리의 결정에 따라 달라집니다!"
 israel_mechanic.24.t: "정치적 시위!"
 israel_mechanic.24.d: "남레바논 점령이 계속되고 있으나, 우리 국민의 정부 지지가 급격히 하락했습니다."
 israel_mechanic.24.a: "그들은 나중에 우리에게 감사할 것이다."
 israel_mechanic.25.t: "정치적 지지 상승!"
 israel_mechanic.25.d: "남레바논에서 병력을 철수한 후 우리 정부에 대한 정치적 지지가 급격히 상승했으며 국민이 우리를 지지합니다!"
 israel_mechanic.25.a: "글쎄..."
 ISR_not_withdraw_from_the_security_belt: "병력은 남는다"
 ISR_not_withdraw_from_the_security_belt_desc: "대중의 반발에도 불구하고 남레바논 점령을 계속해야 합니다. 향후 헤즈볼라가 우리를 공격할 경우 더 많은 이점을 얻을 수 있습니다."
 israel_mechanic.26.t: "거센 정치적 반발!"
 israel_mechanic.26.d: "남레바논 점령이 계속되고 있으나, 우리 국민의 정부 지지가 급격히 하락했고 시위가 시작되었습니다. 정부는 문제를 다루지도 않고 유권자들을 무시했습니다."
 israel_mechanic.26.a: "어리석기도 하지!"
 israel_mechanic.27.t: "레바논으로부터의 이주!"
 israel_mechanic.27.d: "최근 이스라엘이 남레바논에서 철수함에 따라, 많은 레바논 기독교인들이 헤즈볼라의 박해를 피하는 방편으로 프랑스로 이주하기로 결정했습니다."
 israel_mechanic.27.a: "환영한다고 해야 하나?"
 israel_mechanic.28.t: "안사르 수용소의 운명"
 israel_mechanic.28.d: "남레바논을 장기간 점령하는 동안 우리는 다수의 헤즈볼라 무장 대원을 포로로 가둬 둔 수용소를 통제해 왔습니다. 이제 철수 여부를 결정하기에 앞서 이 수용소의 운명을 결정해야 합니다."
 israel_mechanic.28.a: "수용소를 떠나자."
 israel_mechanic.28.b: "포로들을 이스라엘로 이송하라."
 we_willget_events_tt: "§Y카운트다운이 끝나면 사건이 발생합니다!§!"
 israel_nationalist.1.t: "시작된 카플란 재판"
 israel_nationalist.1.d: "재판은 전국의 이목을 끌었습니다. 이제 법원은 적절한 형량을 결정해야 합니다."
 israel_nationalist.1.o1: "종신형"
 israel_nationalist.1.o2: "사형 선고"
 we_willget_events2_tt: "§Y카운트다운이 끝나면 사건이 발생합니다!§!\n§R거센 정치적 반발을 받게 됩니다!§!"
 camp_david_tt: "§Y이스라엘과 팔레스타인에서 사건이 발생하며 팔레스타인은 회담 이후 행동을 선택합니다!§!"
 israel_nationalist.2.t: "예루살렘에서 와크프를 추방하는 이스라엘!"
 israel_nationalist.2.d: "예루살렘 와크프는 예루살렘 구시가지에 있는, 전 세계에서 가장 중요한 모스크 중 하나인 알아크사 모스크의 관리를 담당하는 요르단 기구입니다. 와크프는 18명으로 구성된 위원회이며 전원이 요르단 왕국에 의해 임명됩니다.\n이스라엘이 우리 기구를 예루살렘에서 추방하고 있으며, 우리는 더 이상 알아크사 모스크를 관리할 수 없게 됩니다!"
 israel_nationalist.2.o1: "그들은 우리의 분노를 온전히 마주하게 될 것이다!"
 israel_nationalist.2.o2: "이는 용납할 수 없다"
 israel_nationalist.2.o3: "뭐, 어쩔 수 없지"
 israel_nationalist.3.t: "제3성전을 건설한 이스라엘"
 israel_nationalist.3.d: "많은 국제 기구의 우려를 완전히 무시하고, 이스라엘은 제3성전을 건설하기로 결정했으며, 시위를 피로 진압하고 예루살렘을 성지로 함께 여기는 무슬림과 기독교인들로부터 토지를 빼앗았습니다."
 israel_nationalist.3.o1: "감히 어떻게?!?"
 israel_nationalist.3.o2: "이는 용납할 수 없다"
 israel_nationalist.3.o3: "뭐, 어쩔 수 없지"
 israel_nationalist.3.o4: "잘했다!"
 israel_nationalist.4.t: "사회의 기둥"
 israel_nationalist.4.d: "자원이 무한하지 않으므로, 우리는 의제의 이념적 핵심 중 하나에 집중해야 합니다."
 israel_nationalist.4.o1: "이스라엘 방위군"
 israel_nationalist.4.o2: "정착민"
 israel_nationalist.4.o3: "시온주의 공동체"
 israel.23.t: "캠프 데이비드 회담"
 israel.23.d: "이스라엘, 팔레스타인, 미국이 캠프 데이비드에서 3자 외교 회담을 가졌으나 당사자들은 합의에 이르지 못했고 협상은 무산되었습니다. 당사자들은 협상을 계속하겠다고 약속했지만, 향후의 교섭은 협력과 평화 증진에 대한 각자의 의지에 달려 있습니다..."
 israel.23.a: "이스라엘과의 군사 공조를 끊어라!"
 israel.23.b: "다음에는 반드시 합의가 이루어질 것이다."
 israel.23.c: "평화 협상을 할 상대가 없다"
 israel.23.e: "모든 것이 잘 풀리기를 바란다."
 no_militar_coord: "군사 공조 중단!"
 israel.24.t: "군사 공조를 중단한 팔레스타인!"
 israel.24.d: "캠프 데이비드 회담 이후 야세르 아라파트는 이스라엘과의 군사 공조를 중단했으며, 이스라엘에 맞서기 위해 하마스와 정치적 휴전 협정을 체결하겠다고 공언했습니다."
 israel.24.a: "젠장!"
 israel.25.t: "팔레스타인 자치정부의 메시지!"
 israel.25.d: "캠프 데이비드 협상이 결렬되었음에도 불구하고, 팔레스타인 자치정부는 앞으로 다시 만나 현안을 논의하기를 여전히 희망하고 있습니다."
 israel.25.a: "더 나빠질 수도 있었다."
 israel.26.t: "아리엘 샤론의 발표!"
 israel.26.d: "최근의 캠프 데이비드 회담에 대응하여, 리쿠드의 야당 대표 아리엘 샤론은 다음 달 로시 하샤나에 성전산을 방문하겠다고 선언했습니다. 30일 안에 그를 설득하지 못하면 심각한 결과로 이어질 수 있습니다."
 israel.26.a: "이에 대해 무언가 해야 한다..."
 ahsrfoc_tt: "그가 성전산을 방문하지 않도록 설득하려면 국가 중점 §Y샤론 설득§!을 완료해야 합니다!"
 sharon_announce: "샤론이 성전산 방문을 발표했다"
 sharnotconv_tt: "§Y샤론은 설득되지 않았습니다!§!"
 sharconv_tt: "§Y샤론은 설득되었습니다!§!"
 resthirdday_tt: "§Y결과는 추후 알려질 것입니다!§!"
 israel.27.t: "샤론의 결정..."
 israel.27.d: "아리엘 샤론과의 대화 이후, 그가 어떤 결정을 내릴지 지켜봅시다..."
 israel.27.a: "새로운 인티파다를 기다려야 하는가?"
 israel.27.b: "그가 동의해서 다행이다!"
 israel.28.t: "성전산을 방문한 샤론!"
 israel.28.d: "수백 명의 이스라엘 진압 경찰에 둘러싸인 채, 샤론 씨와 소수의 리쿠드 정치인들은 이슬람에서 세 번째로 신성한 성지인 황금빛 바위의 돔이 있는 하람 알샤리프로 행진해 올라갔습니다."
 israel.28.a: "젠장."
 israel.28.b: "받아들일 수 없다!"
 israel.29.t: "인티파다 준비!"
 israel.29.d: "아리엘 샤론의 터무니없는 행동 이후, 우리는 이에 대한 대응으로 무엇을 할지 결정해야 합니다! 민중이 우리의 명령을 기다리고 있습니다."
 israel.29.a: "제2차 인티파다를 선포하라!"
 israel.29.b: "너무 불을 붙이지는 말자..."
 israel.30.t: "이스라엘 내 아랍인 시위!"
 israel.30.d: "이스라엘 아랍인들이 특정 도시에서 팔레스타인인들을 지지하는 대규모 시위를 시작했으며, 가장 두드러진 곳은 카프르 카나입니다. 거리에서 폭력이 벌어지고 있으며, 우리는 이를 신속히 처리해야 합니다!"
 israel.30.a: "망할 놈들!"
 israel.30.b: "훌륭해!"
 ISR_arab_protests: "이스라엘 내 아랍인 시위!"
 ISR_arab_protests_desc: "아랍계 주민들이 우리 정부에 반대하는 시위를 시작했습니다!"
 israel.31.t: "아리엘 샤론의 구금!"
 israel.31.d: "최근 이스라엘 아랍인들의 집회 이후, 논란의 우익 정치인 아리엘 샤론이 구금되었으며 그의 최근 행적에 대해 최종 판결을 내릴 재판을 받게 됩니다."
 israel.31.a: "우리는 그를 설득하려 했다!"
 ISR_good_size_knesset: "크네세트 과반 지지!"
 ISR_big_size_knesset: "크네세트 압도적 과반 지지!"
 ISR_small_knesset: "크네세트 소수 지지!"
 israel.32.t: "시위 진압!"
 israel.32.d: "이스라엘 경찰은 시위를 성공적으로 진압했으나, 그 과정에서 이스라엘 아랍인 13명과 이스라엘 유대인 1명이 사망했습니다. 시위에 대한 폭력적 진압으로 인해 이스라엘 아랍인들의 우리 정부에 대한 지지가 감소했습니다. 팔레스타인 또한 이스라엘 정부의 행동을 비난했습니다."
 israel.32.a: "선택의 여지가 없었다."
 israel.33.t: "국경 너머 습격 제안!"
 israel.33.d: "현재 시온주의 정권의 군대는 내부 시위와 최근의 이스라엘-서안 지구 간 긴장, 그리고 내부 관료주의적 혼란으로 인해 매우 분산된 상태에 있습니다. 우리 고문들은 습격과 이스라엘 군인 인질 확보를 제안하고 있습니다."
 israel.33.a: "전진!"
 raidhas_happ_hez: "헤즈볼라가 습격을 감행했다!"
 israel.34.t: "헤즈볼라의 국경 너머 습격!"
 israel.34.d: "헤즈볼라 무장대원들이 보안 장벽을 순찰하던 이스라엘 군인 세 명을 붙잡아 레바논으로 데려갔습니다. 그들은 이스라엘 방위군 병사 3명을 포로로 잡아 인질로 억류하고 있습니다."
 israel.34.a: "젠장!"
 israel_utj.1.t: "벽의 여성들"
 israel_utj.1.d: "벽의 여성들(네샤 하코텔)은 서쪽 벽, 즉 코텔에서 여성이 기도할 권리를 확보하는 것을 목표로 하는 유대인 페미니스트 단체입니다."
 israel_utj.1.o1: "말도 안 된다, 우리는 성별 분리를 유지할 것이다"
 israel_utj.1.o2: "그들에게 약간의 양보를 해 주자"
 ISR_2000_show_hezbollah: "헤즈볼라에 힘을 과시하라!"
 ISR_2000_show_hezbollah_desc: "북쪽 테러리스트들의 최근 행위는 용납할 수 없습니다! 우리는 더 이상 이를 묵인하지 않을 것임을 보여 주어야 합니다!"
 israel.35.t: "정당한 교훈 작전"
 israel.35.d: "우리 지휘 체계는 헤즈볼라에 대한 보복 방법으로 두 가지 옵션을 제시합니다. 첫 번째 시나리오는 헤즈볼라의 통제 하에 있는 우리 포로를 탈환하기 위해 제한적인 군사 작전을 수행하는 것입니다. 두 번째 옵션은 하니발 지침(Hannibal Directive)에 따라 미사일로 그들의 가장 가까운 전초 기지를 타격하는 것입니다. 이 경우 어떻게 진행해야 할까요?"
 israel.35.a: "아군을 구출하기 위해 병력을 보내라!"
 israel.35.b: "우리는 하니발 지침을 따라야 한다."
 israel.36.t: "정당한 교훈 작전을 성공적으로 수행한 이스라엘!"
 israel.36.d: "최근 헤즈볼라의 국경 너머 습격 이후, 이스라엘은 이에 대한 대응으로 특수 작전을 개시했으며 헤즈볼라의 억류로부터 자국 병사들을 성공적으로 구출했습니다!"
 israel.36.a: "훌륭해!"
 israel.36.b: "그들을 처형했어야 했다!"
 israel.37.t: "정당한 교훈 작전에 실패한 이스라엘!"
 israel.37.d: "최근 헤즈볼라의 국경 너머 습격 이후, 이스라엘은 이에 대한 대응으로 특수 작전을 개시했으나 헤즈볼라의 억류로부터 자국 병사들을 구출하는 데 실패했습니다!"
 israel.37.a: "그들은 기억될 것이다."
 israel.37.b: "우리의 힘은 위대하다!"
 israel.38.t: "결판이 나지 않은 국경 전쟁!"
 israel.38.d: "최근 헤즈볼라의 국경 너머 습격 이후, 이스라엘은 이에 대한 대응으로 특수 작전을 개시했습니다. 그러나 이 충돌의 결과는 결판이 나지 않은 것으로 간주됩니다."
 israel.38.a: "다음에 보자, 시온주의자들!"
 israel.38.b: "이 문제는 사령부에서 논의해야 한다..."
 israel.39.t: "이스라엘의 헤즈볼라 미사일 공격!"
 israel.39.d: "최근 헤즈볼라의 국경 너머 습격 이후, 이스라엘은 붙잡힌 이스라엘 방위군 병사들과 헤즈볼라의 주요 간부가 있던 헤즈볼라 전초기지에 미사일 공격을 가했습니다."
 israel.39.a: "그들의 복수를 해 주겠다!"
 israel.39.b: "훌륭해!"
 israel.40.t: "실패한 미사일 공격!"
 israel.40.d: "최근 헤즈볼라의 국경 너머 습격 이후, 이스라엘은 붙잡힌 이스라엘 방위군 병사들과 헤즈볼라의 주요 간부가 있던 헤즈볼라 전초기지에 미사일 공격을 가했습니다. 그러나 미사일은 요격되었고 작전은 실패했습니다."
 israel.40.a: "또 한 번의 승리다!"
 israel.40.b: "으윽..."
 mis_borwar_tt: "우리는 §R[HEZ.GetNameWithFlag]§!와의 국경에서 §Y특수 작전§!을 개시하거나, 그들의 §R거점§!에 제한적인 §Y미사일 공격§!을 가할 수 있게 됩니다!"
 ISR_tolerate_hezbollah: "교환 협상"
 ISR_tolerate_hezbollah_desc: "헤즈볼라가 붙잡은 우리 병사들을 이미 살해했을 가능성이 높음에도 불구하고, 그들이 새로운 인질 교환을 시작하기 위해 그렇게 했다는 것은 분명합니다. 현재 우리가 처한 어려움을 고려하면, 상황을 확대시켜서는 안 됩니다."
 israel.41.t: "포로 교환"
 israel.41.d: "이스라엘 정부는 실종된 이스라엘 방위군 병사 세 명의 송환과 더불어, 마약 거래를 위해 두바이로 유인된 뒤 헤즈볼라에 붙잡힌 이스라엘 사업가이자 예비역 대령인 엘하난 테넨바움의 송환에 관한 합의가 이루어졌다고 발표했습니다.\n헤즈볼라는 레바논 수감자 14명과 일부 팔레스타인 수감자의 석방을 위한 협상을 주도했습니다. 테넨바움과 사망한 병사 세 명의 유해를 받는 대가로, 레바논 및 아랍 수감자 30명, 팔레스타인 수감자 400명, 독일 국적의 헤즈볼라 조직원 슈테펜 스미레크, 그리고 레바논 무장대원과 민간인 59명의 유해가 남레바논의 이스라엘 지뢰 위치를 표시한 지도와 함께 헤즈볼라에 인도되었습니다."
 israel.41.a: "아주 좋다!"
 israel.41.b: "우리는 해야 할 일을 했다."
 israel.42.t: "10월 사태 조사!"
 israel.42.d: "시위 진압 이후, 우리는 경찰의 위법 행위를 조사하고 시위를 일으킨 자들을 찾아내야 합니다. 이스라엘 아랍 위원회는 이번 사태에 대한 우리의 부분적 보상으로서 조사에 참여하기를 원합니다. 그들이 경찰의 업무를 감독하도록 허용하겠습니까?"
 israel.42.a: "물론이다!"
 israel.42.b: "경찰이 처리할 것이다."
 israel.43.t: "카프르 카심에 대한 입장!"
 israel.43.d: "카프르 카심 학살은 1956년 10월 29일, 당시 이스라엘과 요르단령 서안 지구 사이의 사실상 국경이었던 그린 라인에 위치한 이스라엘 아랍인 마을 카프르 카심에서 발생했습니다. 이는 시나이 전쟁 전야에 그날 일찍 내려진 통행금지령을 알지 못한 채 일터에서 돌아오던 아랍인 민간인들을 이스라엘 국경경찰이 살해한 사건입니다.\n최근의 사태 이후, 우리는 이 사건을 인정하고 이스라엘 아랍인들에게 사과할 수 있습니다."
 israel.43.a: "우리는 사과해야 한다."
 israel.43.b: "그런 일은 없었다!"
 israel.44.t: "시리아와의 협상!"
 israel.44.d: "시리아를 이란의 영향권에서 벗어나게 하기 위해, 우리는 그들과 관계 정상화 조건을 협상해 볼 수 있습니다. 어떤 입장에서 말해야 하겠습니까?"
 israel.44.a: "아무런 조건 없는 정상화."
 israel.44.b: "골란 고원을 양도할 용의가 있다!"
 israel.45.t: "관계 정상화를 제안하는 이스라엘!"
 israel.45.d: "최근 이스라엘 정부가 우리나라에 아무런 사전 조건 없는 관계 정상화를 제안했습니다. 그들이 원하는 것은 우리가 골란 고원에 대한 영유권 주장을 포기하는 것뿐입니다."
 israel.45.a: "좋다, 영유권 주장을 포기하겠다."
 israel.45.b: "꺼져라, 시온주의 외교관!"
 syracc_negot: "시리아가 이스라엘의 제안을 수락했다"
 israel.46.t: "시리아의 수락!"
 israel.46.d: "그들은 골란에 대한 영유권 주장을 포기하고 우리나라와 관계를 정상화할 것입니다!"
 israel.46.a: "훌륭해!"
 israel.47.t: "시리아의 거절!"
 israel.47.d: "시리아는 우리나라와의 어떠한 추가 협상도 거부했습니다. 우리의 조건과 그들의 조건은 전혀 같지 않으며, 그들은 문제가 우리의 비협조뿐만 아니라 우리의 존재 자체에 있다고 보고 있습니다."
 israel.47.a: "으윽."
 israel.48.t: "우리나라에 골란 양도를 제안하는 이스라엘!"
 israel.48.d: "이스라엘은 우리가 자국과 상호 불가침 조약을 체결하고 관계를 정상화한다면 골란을 우리나라에 양도하겠다고 제안하고 있습니다."
 israel.48.a: "어디에 서명하면 되는가?"
 israel.48.b: "시온주의자들의 속임수인가?"
 israel.49.t: "시리아의 수락!"
 israel.49.d: "시리아는 골란 양도 협정에 서명했으며 이제 우리나라에 우호적입니다."
 israel.49.a: "적어도 이렇게라도..."
 syr_negotgol_tt: "우리는 §Y[SYR.GetNameWithFlag]§!에 §Y무조건적인 정상화를 요청§!하거나, §G우호 관계§!의 대가로 §Y골란§!을 §Y[SYR.GetNameWithFlag]§!에 양도하는 것 중에서 선택할 수 있게 됩니다."
 israel.50.t: "시리아 내 헤즈볼라 기지를 공격하는 이스라엘!"
 israel.50.d: "최근 이스라엘 공군이 시리아 내 헤즈볼라 기지를 표적으로 공습했습니다. 시리아 당국은 아직 이에 대해 논평하지 않았지만, 헤즈볼라는 이른바 시온주의 정권의 행위에 대해 복수하겠다고 이미 공언했습니다. 헤즈볼라 간부 일부가 사망했고 수십 명의 병사가 부상을 입었습니다."
 israel.50.a: "훌륭해!"
 israel.50.b: "젠장!"
 israel.50.c: "빌어먹을 시온주의자들!"
 israel.50.e: "빌어먹을 시온주의자들!"
 syrhez_tt: "우리는 §R[SYR.GetNameWithFlag]§! 내 §R[HEZ.GetNameWithFlag]§!의 기지를 공격하여 §R[SYR.GetNameWithFlag]§!에 대한 §R[HEZ.GetNameWithFlag]§!의 영향력을 감소시키고 시리아 지역의 건물에 무작위로 피해를 입힙니다!"
 istspechez_tt: "우리는 §R[HEZ.GetNameWithFlag]§!를 직접 공격하여 특수 부대를 §Y남레바논§!에 투입합니다. 그들은 §R[HEZ.GetNameWithFlag]§!의 전략 시설을 파괴한 뒤 §Y갈릴리§!를 통해 철수할 것입니다."
 israel.51.t: "[ISR.GetNameWithFlag] 특수 부대의 [HEZ.GetNameWithFlag] 공격!"
 israel.51.d: "최근 이스라엘 특수 부대가 소규모 조로 레바논 국경을 넘어 침투하여 헤즈볼라 전투원들을 공격했습니다. 이후 그들은 남레바논의 전략 시설을 파괴했습니다. 전선의 전반적인 위치를 바꾸지는 못했지만, 이스라엘 특수 부대는 갈릴리를 통해 성공적으로 탈출했습니다."
 israel.51.a: "잘했다, 제군들!"
 israel.51.b: "복수는 곧 이루어질 것이다!"
 israel.51.c: "복수는 곧 이루어질 것이다!"
 ISR_collapsed_tunnels: "붕괴된 터널!"
 ISR_collapsed_tunnels_desc: "이스라엘군이 이스라엘 국경을 가로지르던 우리의 터널을 폭파했으며, 새 터널을 파고 남은 터널을 보수하는 데에는 상당한 시간이 걸릴 것입니다."
 israel.52.t: "우리의 터널을 폭파하는 이스라엘!"
 israel.52.d: "이스라엘군이 이스라엘 국경을 가로지르던 우리의 터널을 폭파했으며, 새 터널을 파고 남은 터널을 보수하는 데에는 상당한 시간이 걸릴 것입니다."
 israel.52.a: "쯧!"
 israel.53.t: "침투당한 라드완 부대!"
 israel.53.d: "이스라엘은 우리 특수 부대에 침투하여 우리의 계획 일부를 파악하는 데 성공했습니다."
 israel.53.a: "젠장!"
 ISR_leb_air: "레바논 상공의 아군 공군"
 ISR_bibi_power: "분열된 리쿠드"
 leb_willris_tt: "전쟁이 시작될 때 레바논 내 친[ISR.GetNameWithFlag] 단체의 인기도가 최소 10%라면 이들이 봉기할 것입니다."
 isr_will_attack_leb_tt: "§G[ISR.GetNameWithFlag]§!는 §R[HEZ.GetNameWithFlag]!§!를 소탕하기 위해 §Y남레바논§!을 침공할 것입니다.\n레바논 내 친§G[ISR.GetNameWithFlag]§! 단체의 인기도가 최소 10%라면, 이들이 §R[HEZ.GetNameWithFlag]!§!에 맞서 봉기할 것입니다."
 ISR_ben_gvir_easy_trigger_1: "교전 수칙 - 완화"
 ISR_ben_gvir_easy_trigger_1_desc: "매일같이 팔레스타인 테러에 대처하려면 특별하고 느슨한 교전 수칙이 필요합니다."
 ISR_ben_gvir_easy_trigger_2: "교전 수칙 - 최소화"
 ISR_ben_gvir_easy_trigger_2_desc: "우리의 작전 능력을 제한하는 터무니없는 교전 수칙으로부터 영웅들을 보호하기 위한 한 걸음 더 나아간 조치입니다."
 ISR_freedom_of_teaching_1: "독립 교육 - LIBA 중단"
 ISR_freedom_of_teaching_1_desc: "영어 교육을 포함하는 교육부의 핵심 교육과정인 LIBA는 일부 집단이 히브리어와 기타 종교 과목만 가르치는 것을 막기 위해 도입되었습니다. 이 결정은 젊은 세대에게 우리 문화를 가르칠 우리의 독립성을 침해하므로 철회되어야 합니다. 영어를 가르칠지 여부는 그들이 스스로 결정하게 해야 합니다."
 ISR_freedom_of_teaching_2: "독립 교육 - 마마흐"
 ISR_freedom_of_teaching_2_desc: "하레디 교육 체계의 다음 단계로서, 우리는 우리만의 영어를 가르치고, 이스라엘의 전통을 바탕으로 역사 교육을 강화하며, 젠더나 다윈의 이론과 같은 터무니없는 이론의 교육을 금지할 것입니다."
 ISR_only_pikuach_nefesh: "오직 피쿠아흐 네페쉬만"
 ISR_only_pikuach_nefesh_desc: "안식일에는 건설을 포함한 어떠한 노동도 허용되지 않으며, 할라카로 알려진 개념인 인간 생명의 보호, 즉 피쿠아흐 네페쉬의 경우만 예외입니다."
 ISR_gender_equality: "양성평등"
 ISR_gender_equality_desc: "어떤 성별도 우월하지 않으며, 모든 사람은 성별과 관계없이 사회에 동등하게 기여할 것입니다."
 ISR_renewable_energy_focused: "재생 에너지 중심"
 ISR_renewable_energy_focused_desc: "우리의 땅은 인간이 초래한 오염과 파괴를 더 이상 견딜 수 없습니다. 성장을 지속하기 위해 재생 에너지에 중점을 둡시다."
 bomcatisra_tt: "이를 통해 §Y지역§!에서 §R[PER.GetNameWithFlag]의 영향력§!에 §G대응하고§! §Y비밀 작전을 수행할 수§! 있게 됩니다!"
 israel.54.t: "시리아의 핵반응로 의심 시설을 폭격한 이스라엘!"
 israel.54.d: "최근 이스라엘군은 시리아가 알 키바르 시설로 불리는, 알 수 없는 목적의 핵반응로를 건설하려 한 것으로 의심되는 시설에 공습을 가했습니다. 이스라엘 특수 부대 또한 시리아 영토에 진입하여 시설의 잔해를 수거하는 데 성공했습니다."
 israel.54.a: "훌륭해!"
 israel.54.b: "빌어먹을 시온주의자들!"
 israel.54.c: "흥미롭군."
 israel.55.t: "시리아에서 격추된 이스라엘 항공기!"
 israel.55.d: "최근 이스라엘 군용 제트기 여러 대가 시리아 영토에 진입하려다 시리아에서 격추되었습니다. 이스라엘은 이 상황에 대해 어떠한 논평도 하지 않았습니다."
 israel.55.a: "아, 젠장."
 israel.55.b: "또 한 번의 승리다!"
 israel.55.c: "시리아인들이 잘해 주었다."
 syr_ope_aa_tt: "§G성공§! 확률은 [SYR.GetNameWithFlag]의 §Y전반적인 대공 방어 수준§!에 직접 연동됩니다."
 israel.56.t: "[ISR.GetNameWithFlag]의 비밀 메시지!"
 israel.56.d: "최근 이스라엘이 우리에게 메시지를 보내, 우리가 시리아에서 모든 이란군을 몰아내면 이란이 시리아에 맞서 어떤 행동을 취할 경우 이스라엘이 우리를 보호해 주겠다는 수상한 거래를 제안했습니다."
 israel.56.a: "이란은 돌아가라!"
 israel.56.b: "또 하나의 어리석은 시온주의자 음모다!"
 israel.57.t: "시리아의 수락!"
 israel.57.d: "우리와 시리아 사이의 이념적 차이에도 불구하고, 시리아는 우리의 제안을 수락했으며 시리아 영토에서 모든 이란군을 몰아냈습니다."
 israel.57.a: "훌륭해!"
 israel.58.t: "자국 영토에서 우리 군대를 쫓아낸 시리아!"
 israel.58.d: "우리 요원들이 시리아와 이스라엘이 이 지역에서 우리의 영향력에 대항하기로 합의했다는 정보를 전해 왔습니다. 시리아는 자국 영토에서 우리 군을 몰아냈습니다. 어떻게 해야 할까요?"
 israel.58.a: "복수는 나중에 하겠다..."
 israel.58.b: "병력을 집결시켜라!"
 israel.59.t: "시리아의 거절!"
 israel.59.d: "시리아는 우리의 비밀 제안을 거절했으며 앞으로도 이란의 동맹이자 저항의 축의 일원으로 남을 것입니다."
 israel.59.a: "매우 유감이다."
 syr_manip_tt: "우리는 §R[PER.GetNameWithFlag]§! 군대의 §Y[SYR.GetNameWithFlag]§! 영토 §G철수§!를 요구하고, 수락할 경우 §Y[SYR.GetNameWithFlag]§!의 독립을 §G보장§!할 것입니다. 그러나 세계 긴장도가 높다면 §R[PER.GetNameWithFlag]§!가 §Y[SYR.GetNameWithFlag]§!를 공격할 수도 있습니다!\n§Y[SYR.GetNameWithFlag]§!의 수락 여부는 §Y[SYR.GetNameWithFlag]§!의 §Y집권 정당§!에 따라 달라집니다."
 lba_ope_aa_tt: "§G성공§! 확률은 [LBA.GetNameWithFlag]의 §Y전반적인 대공 방어 수준§!에 직접 연동됩니다."
 israel.60.t: "우리의 핵반응로를 폭격한 이스라엘!"
 israel.60.d: "이스라엘 항공기가 우리 영공에 진입하여 일부 핵반응로를 표적 폭격했습니다!"
 israel.60.a: "젠장!"
 israel.62.t: "[FROM.GetNameWithFlag] 폭격 임무 성공!"
 israel.62.d: "우리 항공기가 [FROM.GetNameWithFlag]의 영공에 성공적으로 진입하여 핵반응로를 폭격했습니다. 이로써 그들은 당분간 저지될 것입니다."
 israel.62.a: "훌륭해!"
 israel.61.t: "핵 시설 폭격에 실패한 이스라엘!"
 israel.61.d: "이스라엘 제트기가 격추되어 [FROM.GetNameWithFlag]의 핵 시설은 안전하게 남았습니다."
 israel.61.a: "쓰라린 결과다."
 israel.61.b: "좋았어!"
 irq_ope_aa_tt: "§G성공§! 확률은 [IRQ.GetNameWithFlag]의 §Y전반적인 대공 방어 수준§!에 직접 연동됩니다."
 per_ope_aa_tt: "§G성공§! 확률은 [PER.GetNameWithFlag]의 §Y전반적인 대공 방어 수준§!에 직접 연동됩니다."
 israel_news.14.t: "암모니아 관련 문서를 기밀 해제한 이스라엘!"
 israel_news.14.d: "이스라엘은 비밀 핵 시설의 폐쇄를 발표하고, 그동안 철저히 은닉해 온 핵무기를 완전히 포기하겠다고 약속했습니다. 그러나 많은 중동 국가들은 이스라엘이 또다시 자신들을 기만할 것인지 우려를 표명했습니다."
 israel_news.14.o1: "흥미롭군."
 israel_palestine_category: "[ISR.GetNameWithFlag] - [PAL.GetNameWithFlag] Tensions"
 ISR_palestine_desc_loc: "Our current §RTensions§! [?ISR_palestine_situation|0+]\n\n[?PAL_arab_popularity|=0+] from £ISR_Communist_State £ISR_Autocracy £ISR_anarchist_communism £ISR_Neutral_Muslim_Brotherhood §YArab parties§! polling\n[?PAL_war_support_in_isr|=0+] from current §4Israeli§! war support\n\n[?PAL_arab_parties_rulling|=0+] from seclusion of  £ISR_Communist_State £ISR_Autocracy £ISR_anarchist_communism £ISR_Neutral_Muslim_Brotherhood §YArab parties§! in the §YGovernment§! of [ISR.GetNameWithFlag]\n\n[select_thingie_palisr]\n\nAfter numerous §YIsraeli-Arab wars and intifada§!, the situation in [PAL.GetNameWithFlag] is under almost complete §4Israeli§! control. However, increased §Rtension§! between \n[ISR.GetNameWithFlag] and  [PAL.GetNameWithFlag] could lead to §Runrest, wars and possible uprisings§! and §Ychange the balance of power§! and the §Yoverall situation§!.\n\nThe more §Rtensions increase§!, the more §Rviolent§! the situation will be!\n\nThe §Rtension level§! also depends on the §YAutonomy level§! of [PAL.GetNameWithFlag]!"
 gu_westbank_select: "서안 지구"
 gu_gaza_select: "가자 지구"
