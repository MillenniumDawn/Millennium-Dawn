 MD_sftc_ex_ranger_tt: "§Y레인저 평가 훈련§!\n\n£army_experience 육군 경험치: §R-300§!\n£air_experience 공군 경험치: §R-150§!\n£command_power 지휘력: §R-75§!\n§Y90§!일간 국가 정신 §Y레인저 평가 훈련§!을 획득합니다:\n £fuel_consumption_texticon  육군 연료 소비: §R+10%§!\n £out_of_supply_texticon  특수 부대 보급 외 지역 페널티: §G-5%§!\n£doctrine_mastery §Y특수 레인저 연대§! 숙련도: 하루당 [MD_sftc_exercise_mastery_tt_text], §Y90§!일간\n\n§Y혼합 지휘§! 또는 §Y레인저 중심 특수 부대§! 대교리가 필요합니다."
 MD_sftc_ex_marine_tt: "§Y상륙 습격 훈련§!\n\n£navy_experience 해군 경험치: §R-300§!\n£army_experience 육군 경험치: §R-150§!\n£command_power 지휘력: §R-75§!\n§Y90§!일간 국가 정신 §Y상륙 습격 훈련§!을 획득합니다:\n £fuel_consumption_texticon  해군 연료 소비: §R+10%§!\n £amphibious_texticon  상륙 침공: §G+5%§!\n£doctrine_mastery §Y특수 해병 부대§! 숙련도: 하루당 [MD_sftc_exercise_mastery_tt_text], §Y90§!일간\n\n§Y혼합 지휘§! 또는 §Y해병 중심 특수 부대§! 대교리가 필요합니다."
 MD_sftc_ex_airborne_tt: "§Y공수 침투 훈련§!\n\n£air_experience 공군 경험치: §R-300§!\n£army_experience 육군 경험치: §R-150§!\n£command_power 지휘력: §R-75§!\n§Y90§!일간 국가 정신 §Y공수 침투 훈련§!을 획득합니다:\n £fuel_consumption_texticon  공군 연료 소비: §R+10%§!\n £organisation_paratroop_texticon  공수 강하 편제: §G+5%§!\n£doctrine_mastery §Y공수 중대§! 숙련도: 하루당 [MD_sftc_exercise_mastery_tt_text], §Y90§!일간\n\n§Y혼합 지휘§! 또는 §Y공수 중심 특수 부대§! 대교리가 필요합니다."
