l_japanese:
 fiji_influence_defense_through_chaos: "混沌を通じた影響力防御"
 fiji_influence_defense_through_chaos_desc: "フィジーは1970年代から独立国であるが、残念ながらその独立は、我々が望んでいたような栄光と平和をもたらすものではなかった。文民・軍事クーデターや蔓延する民族間の緊張は、世界の多くの国々と比較して、この国を本質的に停滞させてきた。しかし、この混乱は、ある種の自然な障壁ともなっている。というのも、外国勢力はこの混乱を理由に、このような小規模な地域で資産を失うことを警戒しているからだ。したがって、我々は予想以上の外国影響防衛力を有している。確かにこれは諸刃の剣ではあるが、当面は我々に有利に働いている。"
 fiji_militarized_society: "軍事化社会"
 fiji_militarized_society_desc: "2000年クーデターの混乱と暴力は、国家の人々に傷跡を残した。その傷跡は憎しみと自己恥辱のものである。この傷跡と共に、新しい世代の新しい波が軍に参加するようになり、したがってリーダーシップの一形態としての軍事政権の創設と人気を強化した。これは決意と義務の道へと導き、そこでは軍が社会であり、社会が軍である。"
 fiji_society_of_the_elected_king: "選出王の社会"
 fiji_society_of_the_elected_king_desc: "国と歴史を守り、公正な法と秩序を維持するという根本的な使命を掲げた武力示威により、多くの人々はスバ家が極めてかすかな光の中へと現れたことを認識した。フィジー国民に与えた衝撃は、独立以来どの文民政府も達成できなかった印象を残した。そのため多くの人々は、たとえ完全に同意していなくとも、新たな体制への支持を示し協力を模索している。"
 fiji_ostracized_commonwealth_member: "追放された連邦加盟国"
 fiji_ostracized_commonwealth_member_desc: "我が国の混乱は、我々を連邦の他の国々との緊張した関係に置いた。我々はこれが国際的にもたらす追加の力を享受するが、しかし、我々の国内状況が外国メンバーに与える熱い性質のために、物事の完全な現実を見ていない。しかし、少なくとも得られるものは取るだろう。"
 fiji_foreign_scientist_imports: "外国人科学者輸入"
 fiji_foreign_scientist_imports_desc: "いくつかの重要なインセンティブにより、我々は科学的な頭脳を、予算の約束と共に、いわば家からの永久休暇と共にフィジーに連れてくることができる。"
 fiji_pacific_exchange_and_investment_society: "P.I.E.S.委員会"
 fiji_pacific_exchange_and_investment_society_desc: "太平洋投資交換協会は、社会および外交関係グループである。一種の地域的カントリークラブのようなものを装い、我々はこの種の社会を、投資家を呼び込むと共に、我々自身の印を我々の小さな世界パイの一部に輸出する方法として使用する。"
 fiji_depoliticized_military: "脱政治化された軍"
 fiji_depoliticized_military_desc: "軍との微妙なやり取りを経て、軍と文民政治組織を分離するという合意が成立した。この単純ながらも確固たる合意は、後にフィジーを小規模ながらも地域大国へと押し上げるための改革への道を開くかもしれない。"
 fiji_cohesive_integrations_act: "結束統合法"
 fiji_cohesive_integrations_act_desc: "我々は我々の周りのより広い世界を学ぶことを目指し、同胞とのより緊密な絆を求める。我々は人民と、同様に改善を望む人々の改善のために、視野を広げることを求める。"
 fiji_independence_sustainment_act: "独立維持法"
 fiji_independence_sustainment_act_desc: "アメリカの例と中東の例に従い、我々は独自の独立精神を創造することを目指す。もし我が国が世界の陰謀に飲み込まれても、我々は最終的に逆境に打ち勝つだろう。"
 fiji_importing_ideas_exporting_ideals: "アイデア輸入、理想輸出"
 fiji_importing_ideas_exporting_ideals_desc: "我が島は小さいが、野心は大きい。我々は根本的に世界を変えることはできないかもしれないが、それでも国際問題のパズルにおける重要なピースになることができる。我々のR&Dは効率的で焦点を絞り、より小さなバーストで新しい領域をより迅速に探求することを可能にするだろう。これは我が国に外国勢力への大きな魅力をもたらすだろう。"
 fiji_pieces_for_the_peace: "平和のためのピース"
 fiji_pieces_for_the_peace-desc: "新たに得た安定によって、我々は今や、国際社会における支援と機会をより効果的に模索できるようになった。まだ道のりは長いが、それでもなお、控えめに言ってもこれは大きな飛躍である。"
 fiji_the_fijian_dream: "フィジアン・ドリーム"
 fiji_the_fijian_dream_desc: "私には夢がある。その夢とは、社会によって脇に追いやられ、見下され、完全に捨てられた人々。それらの人々が高く立ち、人生を見上げることができる夢である。それらの人々が、これは終わりではなく、むしろ新しい始まりだと言うことができる夢である。これは達成可能であり、達成されるべきであり、フィジーの旗の下に立つ人々の未来となるだろう。"
 fiji_building_tall_within_something_small: "小さなものの中に高く建てる"
 fiji_building_tall_within_something_small_desc: "建築物高層化法は、文脈を知らない者にとってはかなり誤解を招くものである。この法案は、国民が慣れ親しみ調和すべき基礎的な自動化の義務を法制化するものである。この原則を理解すれば、狭い面積に多くの建物を建設でき、それによって島全体の効率化が図られ、結果として国際的な競争力が高まる。"
 fiji_new_foreign_image: "新しい対外イメージ"
 fiji_new_foreign_image_desc: "人々が絶えず戦ったり、逃げたり、ホームレスになったりしないことで、我々の周りのより広い世界が感嘆の念を持って頭を向け始めた。我が島はこれらの年月にわたって真の変容を遂げ、したがって真の努力は真の結果をもたらす。"
 fiji_foriegn_advisory_board: "外国人諮問委員会"
 fiji_foriegn_advisory_board_desc: "FAB、すなわち外国人諮問委員会は、我が国を正しい道に設定するのを強化し助けるであろう、民事および軍事顧問のホストである。多くの人々はこれが外部勢力からの我が国の独立を損なうのではないかと疑問に思うかもしれないが。安心してください、我々はそのまさに懸念について事前に考えた。なぜなら、これらの外国人顧問は実際には我が国の新しい市民になるからだ。政府のインセンティブと、本質的にこれらの人々を自国から買い取ることにより、内部を強化する一方で、外部からの影響はほとんど期待できない。"
 fiji_national_rotc_program: "国家ROTCプログラム"
 fiji_national_rotc_program_desc: "国家予備役将校訓練課程プログラムを国家の教育内に設立することにより、我々は団結、リーダーシップ、革新、そしてチームワークを我が国の将来の世代に教えることができるだろう。国家の安定と、国家の人民と精神の全体的なエートスへの影響は計り知れないだろう。"
 fiji_expanded_ministry_of_science: "拡大科学省"
 fiji_expanded_ministry_of_science_desc: "技術開発を優先することにより、我々は文民および軍事応用のスペクトル全体にわたる多くの進歩をホストすることができる。したがって、コストにもかかわらず、もし我々が真に国家の未来を求めるなら、全体的な地位を向上させることを目指さなければならない。"
 fiji_citizen_soldiers_amendment: "市民兵士修正条項"
 fiji_citizen_soldiers_amendment_desc: "我々は軍隊を持つ国家ではなく、むしろ国家を持つ軍隊である。過去のナショナリズムの考え方は、常に悪役などによって個人的な目標や野心達成のために乱用されてきた。さて、もう終わりだ。憲法令を通じて、我々はフィジー・ナショナリズムとは何か、フィジー人であることの意味、そして人が当該人生を送ることを誇りに感じて真に生きることができる方法の考え方を確立する。"
 fiji_fijian_general_staff: "フィジー参謀本部"
 fiji_fijian_general_staff_desc: "軍事議会は本質的に一つの大きな参謀本部である。政府と軍事問題の混合を統一された指揮系統へと統合することは、軍事と文民の両方のニーズの計画と調整が、どちらか一方の側が夢見ることさえできない速度で理解され対処されることを意味する。しかし、我々はこの参謀本部が果たす役割を意識しなければならない。なぜなら、人はそのような権力の集中に囲まれて視界を失うことがあるからだ。"
 fiji_research_institute_of_fiji: "フィジー研究所"
 fiji_royal_engineers_program: "王立工兵プログラム"
 fiji_royal_engineers_program_desc: "文民労働力を政府、より具体的には軍事関連プロジェクトに混合するこの限定的なハイブリッドプログラムは、構築するための基盤である。これは、全てを失うという考えが精神と多くの人々の意思決定に大混乱を引き起こす可能性があるため、市民がそれを超えて自由落下するのを防ぐことができる、制御された最低ラインを作成する。このプログラムは、再び立ち上がるのを助けるために我々がそこにいることを示すために、倒れた人々のための希望の灯台としてそこにあるだろう。"
 fiji_economic_planning_board: "経済計画委員会"
 fiji_economic_planning_board_desc: "EPB（経済計画委員会）は経済成長の政府部門である。民間セクターは依然として楽しむことができるが、それらの神を恐れる引用符で囲まれた反共産主義の説教者にとって、この種の政府省庁はむしろ独立した投資部門である。これは、安定が保証された後、民間となるであろう新しい政府構想を導き、開始するのを助けるためである。要するに、EPBが物事を開始し、民間セクターがうまくいけば永続的に物事を継続する。"
 fiji_pacific_economics_exchange_commission: "太平洋経済交流委員会"
 fiji_pacific_economics_exchange_commission_desc: "PEEC（太平洋経済交流委員会）は、我々の影響力と世界の我々の地域における国々との協力をより良く拡大するための共同地域ベンチャーである。主な焦点は経済と政治であるが、軍事教育のサイドハッスルは参加する全ての人々に一般的な利益をもたらすだろう。"
 fiji_titles_by_election: "選挙による称号"
 fiji_titles_by_election_desc: "「選挙による称号」は、民主的プロセスが保存され、人々が次の想定される貴族が誰になるかを投票できるという憲法上の要件である。もはやそれは寝物語のおとぎ話ではなくなるだろう。今やあなたは本当に、あなたも女王または王になれると言うことができる。"
 fiji_institute_of_automation: "フィジー・オートメーション研究所"
 fiji_institute_of_automation_desc: "FIA（フィジー・オートメーション研究所）は、まもなく引用符で囲まれた研究楽園プログラムとして知られるようになるものの基礎工事である。目標は本質的に、島を巨大な研究開発施設へと変貌させ、太陽の下でも、そして現実そのものの未知を解き明かす想像力と創造性の中でも両方を持つことができることを世界に示すことである。"
 fiji_institute_of_resource_development: "フィジー資源開発研究所"
 fiji_institute_of_resource_development_desc: "FIRD（フィジー資源開発研究所）は研究楽園プログラムの開発におけるもう一つの画期的な出来事である。その存在を、既知の最大限の可能性まで資源を抽出し、精製し、合成することに捧げる。はい、我が島は小さいが、これは我々が自由に使えるものを何も持っていないという意味ではない。したがって、この研究所は国内供給を保証し、可能な限りそれらをどのように成長させるかという重要なポイントとなるだろう。"
 fiji_institute_of_energy_development: "エネルギー開発研究所"
 fiji_institute_of_energy_development_desc: "IED（エネルギー開発研究所）は、エネルギーを生産できるより効率的で生産的な方法の開発に焦点を当てるだろう。この部門はまた、エネルギーと経済の結束をより良く統合するためにFIRDと連携して活動することもできるだろう。"
 fiji_technocratic_military: "テクノクラート軍"
 fiji_technocratic_military_desc: "我が島は小さいが、脳はそうではない。この理解により、我々は軍事力を強化するためにR&D能力のかなりの規模の脚注を準備することができる。我々は依然として近代的な空軍を持つための経済を持っていないが、少なくとも海軍と地上軍をより良く専門化することができる。"
 fiji_research_paradise_program: "研究楽園プログラム"
 fiji_research_paradise_program_desc: "我々の広範な研究努力の集大成は、研究開発全体のための新しい楽園を創造した。島は楽園へと変貌した。外国の休暇客だけでなく、科学コミュニティ全体のためにも。ここで我々は、我々が認識している分野と、我々が発見するかもしれない新しい分野の両方における国内および外国の進歩を調整することができる。未来は本当に今だ。"
 fijian_homelessness_crisis: "ホームレス危機"
 fijian_homelessness_crisis_desc: "国の政情不安の中、政府は深刻化するホームレス問題の是正と決断を全く怠っています。新世紀を迎えるにあたり、国民を苦しめるこの深刻な問題を政府が本当に解決できるのか、多くの人が疑問を抱いています。しかし、政府が国民を守るだけでなく、自らの面倒も見始めることができるかどうかは、時が経てば分かることでしょう。"
 fijian_emigration_crisis: "大量移住危機"
 fijian_emigration_crisis_desc: "政治的不安定さ、気候変動、そして高まる民族的緊張により、フィジーを変えるための頭脳はこの小さな島々を去る方が良いと気づいた。より良い明日のための土台を設定するのは新政府次第であるが、彼らに反対する多くの困難があるため、フィジー政府は時間そのものの試練に耐えることができるだろうか？"
 fijian_military: "フィジー軍"
 fijian_military_desc: "島の独立を通じて、フィジー軍は良い自衛隊であった。しかし、外国任務への限定的な関与でさえ、フィジー軍は経験の観点からはほとんど何も持っていない。島が現代へと引き込まれ、さらなる政治的不安が恐れられるにつれて、多くの人々は軍が平和を維持しなければならない回数がどれだけ増えるのか疑問に思っている。"
 fijian_economic_condition: "フィジー経済状況"
 fijian_economic_condition_desc: "人口と国土面積はさほど大きくないにもかかわらず、フィジー経済は十分に多様化している。鉱業は銅、金、銀などの資源採掘に優れており、二次産業にはセメント生産や船舶業が含まれる。全体としてフィジー経済は比較的強固な基盤を有しており、新千年紀を迎えるにあたり、政府はハイテクやソフトウェア開発といった新産業への進出を通じて経済のさらなる多様化を推進する責務を負っている。"
 fijian_ethnic_tensions: "インド＝フィジー人緊張"
 fijian_ethnic_tensions_desc: "独立以来、フィジー諸島の人口は比較的緩やかな増加を続けてきた。しかしこの現象の負の側面は、フィジーに移住する人々の圧倒的多数がインド系移民である点にある。大多数にとってこれは何の意味も持たないが、残念ながら相当数のフィジー先住民にとって、これは自らの置換と疎外を意味している。独立後の近現代史を通じて、こうした緊張は劇的に増大するばかりだ。重大な事態が発生する前に、この問題を解決することがフィジー政府の責務である...同国史に散見される数々のクーデターについては、どうか無視してほしい。"
 fiji_2000_coups_over: "平和への回帰"
 fiji_post_coup_political_shift: "忠誠心は変化している"
 fiji_fast_tracked_military_junta: "§8改善の長い行進が始まった§!"
 fiji_fast_tracked_monarchy: "§0力の王冠は、人民の王冠を作る§!"
 fiji_2006_coup_avoided: "§P2006年クーデターを回避した§!"
 fiji_2006_coup_historical: "§l軍事クーデター成功§!"
 fiji_2006_coup_military_junta: "§8バナナマンは倒れた§!"
 fiji_2006_coup_monarchist_era: "§0スバ家勝利§!"
 fiji_2006_coup_technocracy: "§tテクネイト評議会が支配権掌握§!"
 fiji_news.1.t: "民族主義者、政府高官を誘拐"
 fiji_news.1.d: "本日2000年5月19日、イタウケイとして知られる親フィジー系民族政治運動のメンバーが、新しく選出され、ほとんどが民族的にインド系フィジー人の政府の主要メンバーを人質に取った。首相といくつかの主要な政府高官が、イタウケイメンバーが事実上内部にバリケードを築いた議会建物で人質に取られた。人命の損失なしに人質を抽出するための交渉が進行中である。"
 fiji_news.1.o1: "なぜ我々は互いに戦わなければならないのか"
 fiji_news.2.t: "暫定政府創設"
 fiji_news.2.d: "出来事と反乱軍との交渉の行き詰まりの後、カミセセ・マラ大統領は非常事態を宣言し、捕らえられなかった現在人質に取られている政府メンバーの残りで継続政府を創設した。地元警察とフィジー共和国軍、すなわちRFMFが、議会の周りの失敗した非常線を創設し、スバのいくつかのインド系フィジー人企業を標的とした抗議者による増大する抗議と市民不安に対処することで stretched されているため、緊張は高まっている。"
 fiji_news.2.o1: "我々は何もできないのか！？"
 fiji_news.3.t: "権威喪失が軍事クーデターを引き起こす"
 fiji_news.3.d: "文民政府の残りが真に行政権を行使する能力がないことを証明したため、RFMF司令官フランク・バイニマラマは現政府を追放し、独自の政府を樹立した。彼らの最初の行動は戒厳令の確立であり、これにより彼らは大量の市民不安に対処するためのより多くの自由を得た。"
 fiji_news.3.o1: "また始まった"
 fiji_news.3.o2: "軍がこれを解決するだろう"
 fiji_news.4.t: "議会で銃撃戦交換"
 fiji_news.4.d: "軍のクーデター後、1997年憲法は廃止され、軍が最後通告を発したことで交渉は決裂した。外国勢力は一連の制裁を開始し、フィジーは英連邦から除名され、複数の国がフィジー製品の輸入禁止、フィジーのスポーツチームの出場禁止措置を取った。これらの対応は、反乱軍の要求に屈するとの見解に基づくものだった。6月12日、軍はジョージ・スペイトの車両に警告射撃を行ったが、スペイトは暗殺未遂だったと主張している。交渉は継続中で、さらに多くの人質が解放された。市民の動揺が収まり、状況に希望が見え始めた今、この状態がいつまで続くのかと多くの人が疑問に思っている。"
 fiji_news.4.o1: "この無意味な暴力を終わらせてください"
 fiji_news.5.t: "軍、反乱軍と合意？"
 fiji_news.5.d: "2000年7月3日、バイニマラマはライセニア・ガラセを首相に指名し、全てフィジー系先住民の政府を率いさせた。スペイトはこの決定に激怒し、翌日議会で銃撃戦が勃発し、5人が負傷した。混乱はエスカレートし、反乱軍は国内で多くの事件を起こした。ランバサのスクナイヴァル兵舎の兵士たちが反乱を起こし、スペイトへの支持を宣言した。地元の土地所有者がモナサヴ・ダムを占拠し、スバへの電力を遮断した。8日、反乱軍はスバとナンディ間の道路を封鎖し、コロヴォウの警察署を襲撃し、30人の人質を取った。ナボロ刑務所では、50人の囚人が暴動を起こし、看守を人質に取った。"
 fiji_news.5.o1: "バナナラマは何を考えているんだ！？！？"
 fiji_news.6.t: "クーデター終結"
 fiji_news.6.d: "6月と7月の数ヶ月間、文民政府の改革が話し合われ、話し合われる中で、半継続的な交渉が国中に浸透した。最終的に、ますます多くの人質が解放され、反乱軍は議会建物を去り、首都圏から移動した。最終的に7月26日、スペイトとその報道官ジョー・ナタは、新大統領への脅迫と内戦の脅威が二人の反乱指導者から投げかけられた後、軍事検問所近くで逮捕された。まもなく軍は反乱軍本部を襲撃し、さらに369人の反乱軍を逮捕した。文民クーデターは終結したと宣言された。まもなくジョージ・スペイトは反逆罪で裁判にかけられ、死刑を宣告された。"
 fiji_news.6.o1: "ようやく平和が……しかし、どんな犠牲を払って？"
 fiji_news.7.t: "統一フィジー党、勝利確保"
 fiji_news.7.d: "1997年フィジー憲法は、衆議院の総選挙を少なくとも5年に1回実施することを定めていた。ラトゥ・ジョニ・マドライウィウィ大統領代行は2006年3月2日、3月27日発効で議会解散を宣言した。前議会の任期は2006年10月1日に満了予定であった。選挙令状は3月28日に発布され、候補者は4月11日に立候補届を提出し、13日に優先順位リストを公表した。有権者登録は4月4日に締め切られた。フィジーでは2006年5月6日から13日にかけて総選挙が実施された。ライセニア・カラセ首相率いる与党ソコソコ・ドゥアヴァタ・ニ・レウェニヴァヌア（SDL）政権が3期目の再選を果たした。主要野党はマヘンドラ・チャウグリ率いる労働党のほか、複数の小政党が存在する。"
 fiji_news.7.o1: "着実に進め。"
 fiji_news.8.t: "軍の要求"
 fiji_news.8.d: "2006年10月16日、RFMF司令官バイニマラマ准将は、政府が9つの要求を満たすか、12月1日までに辞任するかの最後通牒を発した。9つの要求は主に、2000年クーデター支持者が裁判にかけられること、人種的根拠に基づく潜在的な経済的不平等をさらに助長するいかなる政治的策略も撤回すること、外国当局による介入を拒否すること（名前を挙げて警察長官アンドリュー・ヒューズ、オーストラリア国民を言及）、今年初めの軍の声明に関する訴訟手続きを取り下げること、そして政府支出と内部統治に関する懸念に正式に対処することに集中していた。1週間半後の2006年10月31日、軍はスバ周辺で演習を行い、市の陸軍兵舎を閉鎖した。軍は演習は脅迫的ではないと述べた。"
 fiji_news.8.o1: "我々はそのような騒ぎを拒否する"
 fiji_news.8.o2: "§P今は体面を保とう§!"
 fiji_news.9.t: "軍事クーデター政府"
 fiji_news.9.d: "政府が軍の要求に異議を唱えたため、フランク・バイニマラマ准将はクーデターを開始し、それは引用符で囲まれた「社会的および民族的安定への脅威」として述べられた政府を追放した。ここでの展開は迅速かつ素早く、軍自体が准将の意志のこの試みに団結しているように見えることを示している。しかし、一部の人々はその正当性を疑問視し、さらに多くの人々は軍が他の計画を持っていると考えているようだ。あまり知られていないが、多くの人々は我々が我々の時代に真の平和を見ることができることを望んでいる。"
 fiji_news.9.o1: "これで本当に十分なのか？"
 fiji_news.9.o2: "§l安定が戻った§!"
 fiji_news.10.t: "クーデターメンバー扇動"
 fiji_news.10.d: "最近のクーデターによりフランク・バイニマラマ准将が国家の事実上の指導者として確立されたため、多くの人々は今、フィジーに正直何が次に待ち受けているのか疑問に思っている。クーデター内の一部の幹部メンバーは、国家がどのように統治されるかについて、より断固たる姿勢を求めて扇動しているようだ。ある者は、民族的混乱の些細ないさかいが、国家が耐えなければならなかった、ましてや自らを引き裂いた最大の失敗であると述べている。今のところ、全世界がこの小さな太平洋の島が耐えている不安な性質に目を向けている。"
 fiji_news.10.o1: "§8軍は我々の救済である§!"
 fiji_news.10.o2: "我々はもう十分苦しんだのではないか"
 fiji_news.11.t: "古いアイデアが派閥主義を刺激"
 fiji_news.11.d: "軍事政権内の増大する派閥主義は、新しい風味を持つ古いアイデアの台頭を見ている。スバ家として知られる派閥は、選出された君主制、一種の新しい原則を持つ古い称号を創設したいと考えているようだ。称号を血統に結びつけるのではなく、選挙と民主主義の原則の考え方は依然としてそこにあるだろう。君主主義と民主的選挙主義のこのハイブリッド化は、彼らのプラットフォームの基本的な基礎となるだろう。派閥メンバーの一人はさらに引用符で、「今やあなたは息子や娘に、もし十分に努力し、人生の目標を探し出せば、あなたも王子、王女、あるいは王や女王にさえなれると伝えることができる」と述べている。多くの人々はこの提案について確信が持てないが、それは大首長評議会と島の部族的遺産の人々にアピールするように見える。"
 fiji_news.11.o1: "なんというおとぎ話だ"
 fiji_news.11.o2: "§0まあ……良いエゴブーストになるかもしれない§!"
 fiji_news.12.t: "クーデター不安定化"
 fiji_news.12.d: "クーデターが長引き、多くの派閥が今や一般大衆によって抗議されているため、多くの人々はこの国家の完全な停止から何が来るのか疑問に思っている。噂によれば、テクネイト評議会と呼ばれる派閥が形成されているという。この評議会は、フィジー・テクノクラシー党として知られるニッチな秘密主義政党の一部であるようだ。しかし、クーデター機構に対する抗議運動の多くは、単に前進したいだけであり、フィジー労働党が選挙結果で2位だったため、ただ権力を握るようにという看板がますます現れている。誰が最初にまばたきするだろうか？"
 fiji_news.12.o1: "§t評議会が権力掌握§!"
 fiji_news.12.o2: "§P人民はもう十分だ§!"
 fiji_news.400.t: "軍事狂信者"
 fiji_news.400.d: "クーデターがもたらした混乱により、一部の軍関係者が不当に攻撃的なアプローチを取り、フランク・バイニマラマ准将の意向を公然と無視している。緊張はエスカレートしており、軍内部の結束は崩壊し始めている。"
 fiji_news.400.o1: "神よ、我らを助けたまえ"
 fiji_news.401.t: "襲撃の噂広まる"
 fiji_news.401.d: "最近、より急進的な考えを持つ指導者の下の軍事政権の一部門が、議会建物を襲撃し人質を排除する計画を立てたという噂がある。准将は、1980年代の最初のクーデター以来見られなかった国家危機を防ぐために、これらの急進的な将校を見つけ出すために奔走しているのが見られている。冷静な人々か、あるいは混乱が土地を支配するかどうかは時間が経てばわかるだろう。"
 fiji_news.401.o1: "§8銃声が聞こえるような気がする？§!"
 fiji_news.401.o2: "§l今日は奇妙に静かだ。§!"
 fiji_news.401.o3: "§0聞こえるあの騒ぎは何だ？§!"
 fiji_news.402.t: "スバ虐殺"
 fiji_news.402.d: "銃声と人質状況への襲撃が15人の死亡、27人の負傷、そして国家全体での大規模なパニックをもたらしたため、混乱が国家を襲った。1週間にわたる出来事の混乱の中で、情報筋によると、フランク・バイニマラマ准将はひどく損傷した輸送隊の中で死んでいるのが発見されたという。准将の死を主張する者は誰もおらず、彼が本当に死ぬべきだったかどうかについては意見が分かれている。それにもかかわらず、これは国家に多くの費用がかかる回復への道である。"
 fiji_news.402.o1: "我々は本当にこれから癒えることができるのだろうか？"
 fiji_news.403.t: "前進"
 fiji_news.403.d: "2000年クーデターの混乱の後、国家を再建するのは長く、かなり退屈な冒険だった。しかし灰の中から不死鳥が蘇り、この荘厳な鳥は舞い上がるだろう。我々は今、我々の前に設定された基盤の上に構築し、我々の小さな島だけでなく、我々の周りの世界に目を向けることに集中することができる。"
 fiji_news.403.o1: "旅は始まったばかりだ。"
 fiji_news.500.t: "権力闘争激化"
 fiji_news.500.d: "議会ビル周辺の警備体制は既に極めて脆弱な状態にあったが、軍が突然撤退させられた。情報筋によれば、首都スバ郊外で銃声とタイヤのきしむ音が確認されたという。多くの者が疑問を抱いている。なぜ軍による反クーデター体制が、残存する文民政府に対してこれほど急激な変化を遂げたのか。さらに、最初のクーデターの発端者である民族主義指導者は、自らとの対話を求めるか、さもなければ行動を起こさなければ結果に直面すると、過激な呼びかけを行っている。事態の進展について、早急な情報提供を期待する。"
 fiji_news.500.o1: "我々にはもはや国家さえあるのだろうか？"
 fiji_news.501.t: "血塗られた結果が判明"
 fiji_news.501.d: "我々が住む現代世界とは著しい対照をなして、軍の不安定な一派が准将の輸送隊を待ち伏せし、その後大首長評議会にスバ家の合法化を強制したことが判明した。この血塗られた登位は、国家が君主制から独立を得た歴史にもかかわらず、国家が君主制になる結果となった。想定される家評議会の一人との最近のインタビューでは、引用符で「我々は国家に対して確固たる支配、公正な支配、そして神聖な支配を持つことを目指す。はい、我々は民族主義者が処理されるまで一種の戒厳令を敷いているが、それにもかかわらず我々は選挙を廃止する計画はない」と述べた。多くの人々はその主張に懐疑的だが、大多数は単に混乱が止まることを望んでいる。彼らのこの血によって作られた王冠による最終結果がどうなるか見てみよう。"
 fiji_news.501.o1: "取るべき舵さえあるのか！？！"
 fiji_news.502.t: "新時代"
 fiji_news.502.d: "再建プロセスが本質的に完了し、傷跡がある程度癒え、国家が未来に集中できるようになった今。スバ家は国家とその人民の完全な理解と発展にコミットすることを見てきた。それは前途に課題があることを理解しており、人々は依然としてためらっているものの、それにもかかわらず生活が正常に戻ったという安堵感を育んできた……たとえその正常がそれ自体「正常」とは見なされなくても。"
 fiji_news.502.o1: "新しい章、新しい始まり。"
 Rear_Admiral_Villiame_Naupoto_desc: "ヴィリアメ・ナウポトはフィジーの海軍士官であり、2006年クーデターの混乱を通じて、より声高な軍国主義者の派閥に加わった。クーデター内のこの派閥はフランク、引用符で囲まれた「バナナマン」を追放し孤立させた。この転換の結果、かつて憲法を遵守していたクーデターは今や完全な軍事政権へと変貌していた。ナウポト少将は政治シーンでは新顔であるが、いわば盲目ではない。したがって、人々は彼が国家とその人民をより良い時代へとどのように導くのか疑問に思っている。"
 Laisenia_Qarase_desc: "ライセニア・ガラセは2000年クーデター中に確立された妥協候補であった。あまり左傾せず、民族的にフィジー人であり、当時はあまり右傾していなかった。彼は2001年の解散総選挙、そして驚くべきことに2006年の選挙でも勝利した。しかし、2006年までに彼の見解と党はより民族的にフィジー人に連携するように変化し、彼の2006年の任期中に提案されたいくつかの物議を醸す法案は、軍による2006年クーデターにつながる憲法危機を引き起こした。"
 Mahendra_Chaudhry_desc: "マヘンドラ・チョードリーは2000年にフィジーで最初に選出された多数派民族インド系フィジー人政府の指導者であった。しかし、民族主義運動からの扇動者が事態を自分の手に取ることを決定し、したがって選出された政府を誘拐した。当該クーデターの出来事に続いて、統一フィジー党が設立され、クーデター後の解散総選挙で公式に選出された。マヘンドラ・チョードリーは2006年の総選挙で再び首相の地位を目指した。"
 Dr_Padma_Narsey_Lal_desc: "1951年生まれのパドマ・ナーシー・ラルは、南太平洋大学で学び、科学、生態学、生化学の修士号を取得して卒業した。彼女は同大学に通った最初の女性グジャラート人であった。1971年に、彼女は最初の南太平洋大学金メダルを授与された。彼女はまた、オーストラリア国立大学から資源環境学の修士号、ハワイ大学マノア校から農業資源経済学の博士号を取得した。パドマ・ラルは研究および研究管理職に移る前に、フィジー政府の公務員として始まった。彼女は太平洋諸島フォーラム事務局で持続可能な開発顧問、そして国際自然保護連合オセアニア地域事務所で主任技術顧問を務めた。ラルはまた、オーストラリア国際農業研究センターを含む、オーストラリア連邦政府で上級職を務めた。"
 King_Sitiveni_I_desc: "シティベニ・ランブカは今や公式にスバ家のシティベニ1世国王の称号を与えられた。スバ家の主要メンバーであり、一部では潜在的な創設者と主張されている。ランブカは政治的および軍事的キャリアで名を成し、遺産を残し、国家が経験したほぼ全てのクーデターに何らかの形で関与してきた。安定、秩序、平和……これら三つの柱こそランブカが維持しようと努力してきたものであり、この新しい道筋により、多くの人々は彼が真の遺産を創造できるのか疑問に思っている。"
 King_Sitiveni_II_desc: "ジオジ・コンロテは今や公式にスバ家のシティベニ2世国王の称号を与えられた。元少将であり政治家であった彼は、クーデター後の時代の最初の選挙サイクルで人民によって選出された。シティベニという名前は王冠評議会の象徴である。その象徴とは、スバ家の主要メンバーの一人であり、一部では潜在的な創設者と主張されているシティベニ・ランブカである。命名規則が先例として設定されたため、多くの人々は続く指導者たちが象徴を選ぶのか、あるいは数字ゲームで独自の主張をするのか疑問に思っている。"
 fiji_focus: "フィジー 国家方針ツリー"
 fiji_research_institute_of_fiji_desc: "R.I.F.（フィジー研究所）は我が国のアイデンティティの頂点である。全ての分野における研究と革新への適度に包括的な投資を使用することにより、我々は地図に名前を載せ、外国の科学コミュニティを引き込むことができるだろう。これを念頭に置くと、それは我が国を技術により早くさらし、我々のゲームをプレイしたいかもしれない人々のために取引するためのデッキを我々に与えるだろう。"
 FIJ_focus_the_1999_general_election: "1939年総選挙"
 FIJ_focus_the_1999_general_election_desc: "In 1999 the Fijian General Elections were held which organized the new government, the Fijian Labour Party taking a majority of the seats in its parliament. The main opposition, the SVT or Soqosoqo ni Vakavulewa ni Taukei, would take 2nd place. The dynamic being set as the Labour Party was considered a Center Left and the SVT being a Center Right. However in 3rd place we have the FAP or Fijian Association Party. A splinter group of the SVT it was considered ironically more right being predominantly ethnic Fijians, however a change in leadership would lead to the known softening of the party as they would create an electoral alliance with the FLP."
 FIJ_focus_assessing_the_national_situation: "国家情勢の評価"
 FIJ_focus_assessing_the_national_situation_desc: "新たな選挙の期待はさておき、我々は現状を把握し、何を求め、何を解決すべきかを理解しなければならない。この美しい国の独立以来、混乱は政治的な争いとクーデターの連続であった。だからこそ、我々は同じ泥沼に陥らないよう、急がなければならない。"
 FIJ_focus_increased_security: "スバの法執行機関の強化"
 FIJ_focus_increased_security_desc: "首都は不安な状況にあり、この地域で事業を営む人々に対する民族間の暴力がさらに激化するのではないかと懸念されている。これは、最近インド系フィジー人が多数を占める政権が誕生したことが背景にあると考えられている。"
 FIJ_focus_the_2000_debacle: "2000年の惨敗"
 FIJ_focus_the_2000_debacle_desc: "世紀の変わり目に、フィジー島は民族主義者によるクーデター未遂事件に見舞われた。このクーデター未遂は最終的に軍による反クーデターによって鎮圧されたものの、それ以来、文民政権への信頼はかつてないほど低下している。今、与党はもちろん、野党でさえも、フィジー国民に希望を取り戻せるかどうかを見極めなければならない。"
 FIJ_focus_isolated_terror_attacks: "Nationalist Attacks"
 FIJ_focus_isolated_terror_attacks_desc: "Despite Speight's arrest, violence by rebels continued. On July 31st Speight supporters terrorised the village of Dreketi, taking 30 hostages. Soldiers who had mutinied at the Sukunaivalu Barracks did not surrender for six weeks. On August 8th rebels ambushed a military patrol, killing one soldier and a policeman, and wounding three others"
 FIJ_focus_military_disunity: "Military Mutiny"
 FIJ_focus_military_disunity_desc: "On November 2nd 2000, soldiers of the Counter Revolutionary Warfare Unit loyal to Speight mutinied in the Queen Elizabeth Barracks mutiny, holding officers hostage in an attempt to depose military commander Frank Bainimarama. Two soldiers were killed and ten were injured when the military retook the barracks. Four of the rebels were tortured and killed by loyal soldiers in the aftermath."
 FIJ_focus_political_legitimacy: "Solidified Legitimacy"
 FIJ_focus_political_legitimacy_desc: "On November 15th, the High Court of Fiji declared that the interim government was illegal. Mara remained the lawful President; Parliament had not been dissolved but only suspended, and should now be reconvened; and by implication, Chaudhry remained the lawful Prime Minister. Mara subsequently officially resigned, with his resignation backdated to May 29th."
 FIJ_focus_political_stagnation: "Political Deadlocking"
 FIJ_focus_political_stagnation_desc: "Following the reinstatement of the 1997 constitution and subsequently the 1999 elected government, the nation was oddly put on hold. The government having been held hostage, terrorized into resigning and so forth was now all of a sudden back to supposedly normal. While the nation is at ease the main government ministers and members are not, some wonder if they can truly keep their power in such an aftermath."
 FIJ_focus_political_challenge: "Qarase's Challenge"
 FIJ_focus_political_challenge_desc: "The Qarase government appealed the High Court's ruling. On March 1st 2001, The Court of Appeal of Fiji confirmed the High Court's decision reinstating the constitution. The government would accept the ruling and would look to restart campaigning for the upcoming 2001 election."
 FIJ_focus_2001_elections: "The 2001 Fijian General Elections"
 FIJ_focus_2001_elections_desc: "The decision to hold fresh elections to start a new would see said elections held in August and September of 2001. The elections were tense following the contention from the 1999 elected government, the majority party being the Fiji Labour Party, which was battling against the Coup instated government of Laisenia Qarase who was apart of the main opposition party. The United Fiji Party or Soqosoqo Duavata ni Lewenivanua (SDL) was formed under Qarase when he was sworn in as prime minister during the 2000 coup. Said party absorbed most of what remained of the Fijian Association Party and a majority of the Christian Democratic Alliance along with other conservative groups creating a conservative grand coalition party of sorts. In the end the SDL would end up taking a majority victory in the election setting the stage for the post coup handling of the nation at large."
 FIJ_focus_post_coup_cleanup: "Post Coup Cleanup"
 FIJ_focus_post_coup_cleanup_desc: "In the aftermath there has been significant amounts of property damage and a right mess of the general capital area of Suva. We must invest in speedily cleaning things up if we are to start on a blank slate and work forward towards our goals."
 FIJ_focus_early_community_programs: "Early Community Programs"
 FIJ_focus_early_community_programs_desc: "We must rebuild the people's will to work together, we are all citizens of Fiji and as such we must be willing to live with one another. To show the coup isn't the reality of things we shall create unity programs. These will show that towns and communities are about coming together and not tearing each other apart."
 FIJ_focus_head_start_cooperatives: "Head Start Co-operative Programs"
 FIJ_focus_head_start_cooperatives_desc: "With the older generations tearing each other apart its up to the younger generation to put things back together. To do that we must early on instill a sense of family unity in our school systems that it doesn't matter if you are Fijian, or Indo-Fijian, we are all here to work together for a better tomorrow."
 FIJ_focus_softer_situational_training_programs: "Softer Situational Training Programs"
 FIJ_focus_softer_situational_training_programs_desc: "With tensions high among ethnic groups we must introduce police reform. To prevent a soft on crime backlash, this reform is actually a new training program for law enforcement. The program us designed around civil disputes between groups and how officers can handle the situation without seeming favoring one side or another."
 FIJ_focus_service_guarantee_citizenship: "Service Guarantees Citizenship!"
 FIJ_focus_service_guarantee_citizenship_desc: "We must create a sense of national pride, for that we can use the military, maybe help bring in new peoples to make our island more diverse instead of just Fijians and Indo-Fijians. For that we'll be creating a service to citizen program within the military. A little extra funding and something to better personally occupy the military leadership should help us overall in a post coup world. So remember, they're doing their part, Are You? Join the Republic of Fiji Military Forces Today!"
 FIJ_focus_the_universal_retirement_program: "The Universal Retirement Program"
 FIJ_focus_the_universal_retirement_program_desc: "The URP will a blanket retirement fund the government will create and give to any citizen which has reached and filed for retirement or other associated social benefits. We hope to raise and even the floor for all citizens for the benefit of the nation as a whole."
 FIJ_focus_the_national_care_initiative: "The National Care Initiative"
 FIJ_focus_the_national_care_initiative_desc: "The NCI will be the beginning of the floor of our healthcare system. Basic treatments related to everyday accidents n such will be freely available to all citizens. We hope that the care given will show the citizens which make up our nation that they are being looked after and that they will give us a real chance to do real things in bettering life as we know it."
 FIJ_focus_soup_kitchens_act: "Soup Kitchens Act"
 FIJ_focus_soup_kitchens_act_desc: "With the rising homelessness, ethnic tensions and people fleeing the island, we must seek radical solutions. A government program establishing strategic soup kitchens to help all those who are either homeless or in a right state will bring the people together. This isn't as much as we'd hope to do but it is the foundation for a real charity initiative throughout the nation."
 FIJ_focus_police_fairness_act: "Police Fairness Act"
 FIJ_focus_police_fairness_act_desc: "With the stage set and the light all on the security and handling of the nations people our law enforcement must be better implemented and not seen as brood vagabonds. Police organization and deployment regiments will be re-evaluated and looked to be more fair to both high crime and to areas seen as neglected by locals."
 FIJ_focus_fijian_corps_of_engineers: "Fijian Corps Of Engineers"
 FIJ_focus_fijian_corps_of_engineers_desc: "The establishment of the FCE branch of the RFMF will be a directed initiative for the military, in peace time, to help with domestic development. This can mean renovating existing military infrastructure but can also be used to bolster civilian construction projects on public works like water, road, rail and other infrastructures which make our nation run."
 FIJ_focus_early_education_standards_act: "Early Education Standards Act"
 FIJ_focus_early_education_standards_act_desc: "The EESA is a piece of budgetary legislation which will be allocating funding to early education levels. This funding will go to a mix of teachers pay, new text books and standardizing the needed materials and equipment that classrooms need for each core subject. This funding will be spread evenly to every school designed for elementary type schools, the hope being that newer generations will have a higher understanding for when they get to middle school they should feel a softer challenge. This should set the stage for future funding to begin working our way up and overall improving the education standards of the nation at large."
 FIJ_focus_targeted_medical_imports: "Targeted Medical Imports"
 FIJ_focus_targeted_medical_imports_desc: "Through dedicated funding we'll set up a priority checklist of medical equipment, needed drugs and basic supplies to create a baseline inventory so our medical infrastructure can operate efficiently as possible. This should begin a process of encouraging where possible, domestic medical development so we don't become hamstrung by global supply chains."
 FIJ_focus_fiji_food_securities_program: "Fijian Food Securities Program"
 FIJ_focus_fiji_food_securities_program_desc: "The FFSP is a food bank like program wherein citizens most affected can claim collection of said benefits and be able to purchase needed foods for survival for their home in a months' time. This should raise the floor and help soften the poverty line and ever growing emigration problem the nation keeps experiencing."
 FIJ_focus_domestic_savings_initiative: "The Domestic Savings Initiative"
 FIJ_focus_domestic_savings_initiative_desc: "The DSI will be a dedicated program designed as a sort of war chest for the government. This supposed warchest will only be used during times of economic crisis and or to do dedicated and targeted programs to alleviate situations which have grown to proportions unattainable by local authorities. Such measures will allow Fiji to appear better managed and appealing to foreign onlookers as our situation is not entirely the most inviting. Nevertheless, we shall prevail and come into the new millennia with a vigor not seen in the last 30 plus years since independence."
 FIJ_focus_fijian_economic_diversity_initiative: "The Fijian Economic Diversity Initiative"
 FIJ_focus_fijian_economic_diversity_initiative_desc: "The FEDI is a general concept plan in which throughout the next couple of decades, the nation of Fiji should have some early sense of autarky to the best of its ability. Not much is honestly known about the resources we stand upon, but with the ethnic tension, everyone leaving and a military and population not too keen on the government body, we have too many problems to fully focus on such an endeavor. With this in mind we have kept the hope of reaching the goal within the next couple of decades, but its up to the people if we can keep hold and look to reach such goals."
 FIJ_focus_rebuild_suva_initiative: "Rebuild Suva Initiative"
 FIJ_focus_rebuild_suva_initiative_desc: "The R.S.I. is a mutually agreed economic aid package to the citizens of Suva which suffered the most during the turmoil of the 3-month long coup. Mass looting and rioting has seen multitudes of property damage and people's livelihoods destroyed, as such we must help them to get back on their feet."
 FIJ_focus_early_business_management: "Early Business Management Program"
 FIJ_focus_early_business_management_desc: "The BMP is a government initiative to encourage the next generation of businessmen and women for our nation. These will be dedicated classes and on-the-job-related intern like training to understand how to manage, run and understand what it genuinely means to be a business owner. We hope to jump-start the development of our economy as new loans are taken and new goods and services are being produced and sold."
 FIJ_focus_startup_investment_program: "Startup Investment Program"
 FIJ_focus_startup_investment_program_desc: "The SIP will be a dedicated business financing loan program for new business owners and their dreams. While such a venture could breed bad lending we however will be seeking to utilize a dedicated portion of the national budget to allow for an unattached manner of conduct. As such if an invested business does fail it will come to no additional cost to the taxpayer."
 FIJ_focus_start_mining_survey_program: "Start Mining Survey Programs"
 FIJ_focus_start_mining_survey_program_desc: "We shall begin several survey programs to be able to identify what resources we have and where we genuinely stand when it comes to instituting our limited autarky program."
 FIJ_focus_importing_mining_equipment: "Importing Mining Equipment"
 FIJ_focus_importing_mining_equipment_desc: "With the recent mining surveys we've proposed we'll need to support such new endeavors. With this in mind we shall create a priority list of crucial mining equipment, materials and needed gear for our mining workers. These folks are the core of how our nation will diversify its economy as a whole."
 FIJ_focus_increased_core_industries: "Increased Core Industries"
 FIJ_focus_increased_core_industries_desc: "With the focus of our nation looking forward in our 20-year plan, we should invest in expanding our bread and butter industries. Forestry and boating has been a fairly strong aspect but we also include specifics in the mining sector related to cement."
 FIJ_focus_solidifying_precious_metals: "Solidifying Precious Metals"
 FIJ_focus_solidifying_precious_metals_desc: "The extraction and exporting of gold and silver is a crucial aspect in our imports. Expanding these sub-sectors will greatly improve our trade deficit ratio to import and export of goods. Now expanding such a thing will allow the growth of our trading income to allow us to bolster what we can import. A cycle of growth has begun."
 FIJ_focus_establishing_fijian_manufacturing: "Establishing Fijian Manufacturing"
 FIJ_focus_establishing_fijian_manufacturing_desc: "The establishment of a robust manufacturing base means we have the ability to diversify our economic portfolio. Now when we import stuff we can use this baseline to diversify the uses of said imports and better gain from our exports."
 FIJ_focus_economic_relief_fund: "Economic Relief Fund"
 FIJ_focus_economic_relief_fund_desc: "The ERF is an established safety net wherein if the nation falls on hard times or if economic conditions are met which causes a sector to suddenly collapse or near free fall, businesses within the affected economic sector can file for an organized bailout. These supposed bailouts will be negotiated and held within the understanding of the budget allocated for the ERF. With such a fund we hope to stem the tie if any outside forces affect our economy in any way."
 FIJ_focus_balanced_trading_budget: "Balanced Trading Budget"
 FIJ_focus_balanced_trading_budget_desc: "With the state of the nation clawing from the Pseudo agrarian and de-industrialized economy into a new age of diversity and prosperity, we must keep in check that what we take in does not outpace what we hope to export. As such we must look into some real budget balancing nearly intervals of quarterly and or even half quarterly, in due time we shall fine tune our economy and increase the efficiency and overall effectiveness of the economy."
 FIJ_focus_early_adoption_tech_sector_investments: "Early Adoption Of Tech Sector Investment"
 FIJ_focus_early_adoption_tech_sector_investments_desc: "With the rise of the so-called internet being the buzz and trend global markets seem fixated on it is our duty to respond in kind. As such we shall fine tune our industrial manufacturing and exports to include these new products and services that the tech sector seems to generate."
 FIJ_focus_the_motorway_improvement_act: "The Motorways Improvement Act"
 FIJ_focus_the_motorway_improvement_act_desc: "Parliament has passed a bill funding dedicated updating projects to the nation's main roadways. The bill is seen as a way to better accommodate rising freight traffic and increase access of new potential businesses and industries as our economy grows and develops. While some reject the increase in spending, others hope it is another stepping stone to our future as a nation."
 FIJ_focus_the_new_millennia_tax_reform_act: "The Post Coup Tax Reform Act"
 FIJ_focus_the_new_millennia_tax_reform_act_desc: "Parliament recently passed the PCTR Act, a bill which reforms tax collection on businesses and the population at large in a way which will hopefully be fairer to the impoverished and the ethnic Fijian population which seems to be a large proportion of our poverty stricken population."
 FIJ_focus_domestic_energy_initiative: "Domestic Energy Initiative"
 FIJ_focus_domestic_energy_initiative_desc: "The DEI is a program of study, survey and planning. Our island is relatively small, as such we must look to get the most bang for our buck when it comes to energy production. Keeping this in mind we've found a good source of domestic oil which we can harvest, doing so we will also integrate an early form of the petrochemical industry as an expansion and direct link to resource extraction. This should work wonders for future planning."
 FIJ_focus_domestic_resource_diversity: "Domestic Resource Diversity Program"
 FIJ_focus_domestic_resource_diversity_desc: "Parliament has created the DRD Program, a government initiative to expand and possibly diversify our domestic resources and the amount extracted. For most of our fair island's independence, we were known for gold & silver, however recent surveys and technological advancements has seen the discovery of decently sized deposits of key resources like iron, copper and even oil. We hope in future to greatly capitalize on these infantile startups of resource extraction."
 FIJ_focus_the_2006_general_election: "The 2006 General Election"
 FIJ_focus_the_2006_general_election_desc: "General elections were held in Fiji between the 6th and 13th of May 2006. The incumbent Soqosoqo Duavata ni Lewenivanua (SDL) government, led by Prime Minister Laisenia Qarase, was going against the main counterforce, the Labour Party of Fiji, led by Mahendra Chaudhry, as well as several other minor parties."
 FIJ_focus_subtle_ethnic_illusions: "Subtle Ethnic Illusions"
 FIJ_focus_subtle_ethnic_illusions_desc: "With our re-election secure and the tables of power changing in our favor, we must look to solidify our people's hegemony on the island. Though this would be met with open opposition and even hostility, we shall therefore look to be more subtle in our approach and lead up to real change."
 FIJ_focus_drafting_the_reconciliation_bill: "Drafting The Reconciliation Bill"
 FIJ_focus_drafting_the_reconciliation_bill_desc: "The Reconciliation Bill is a bill which will see a number of small concessions given back to the ethnic Fijian population, as such one of our main points is to look back on the 2000 coup and start a new leaf through giving coup participants and jailed members amnesty. We hope this will give the public a fair and truer understanding that we all make mistakes and as such should not be solely defined by them alone."
 FIJ_focus_assessing_the_farmland_leases: "Assessing The Farmland Leases"
 FIJ_focus_assessing_the_farmland_leases_desc: "The Leases of Farming lands to the Indo-Fijian population as compensation for the old Royal Sugar Refining Company under colonial rule is well out of date. We cling to the past by perpetuating such a practice and as such we'll look into drafting legislation to properly deal with such a practice."
 FIJ_focus_labour_party: "§pFLP Wins Post Coup Shakeup§!"
 FIJ_focus_labour_party_desc: "The FUP have given into all demands of the military for fear of retribution and legitimate acting on the threat of a coup. With this, a snap election was held leading to the election of a FLP majority government. With the military indirectly on our side and a sort of clean slate to boot we can look to really change things for the better."
 FIJ_focus_turning_down_the_heat: "Turning Down The Heat"
 FIJ_focus_turning_down_the_heat_desc: "With the new government in charge and a consensus with the military established we now have a clean slate to work with. The near boiling point for ethnic tensions which culminated in the 2006 fiasco has now calmed down and we can begin to better integrate our communities. Though as time goes on our numbers diminish we can set the stage for a new age of peace for the island."
 FIJ_focus_simmering_national_fears: "Simmering National Fears"
 FIJ_focus_simmering_national_fears_desc: "Many are still fleeing the nation in droves and we must act on this. Through budget repurposes in healthcare and welfare programs we can encourage the newer generations to not flee as hope is show to them that we are here for them."
 FIJ_focus_setting_to_boil_new_economic_plans: "Setting To Boil New Economic Plans"
 FIJ_focus_setting_to_boil_new_economic_plans_desc: "The economy is stagnating or growing at a pace which looks practically stagnate if someone even thought of sneezing on a global market. Therefore we must turn the heat up on our economic initiatives and look to build both connectiveness and economic stability, a sort of Our-tarky plan if you will."
 FIJ_focus_a_path_of_healing: "A Path Of Healing"
 FIJ_focus_a_path_of_healing_desc: "With the storm passing and our thoughts collected along with being organized we will now attend to the domestic situation which will likely consume the majority of the administration."
 FIJ_focus_foreign_outreach: "Foreign Outreach"
 FIJ_focus_foreign_outreach_desc: "With the instability of our nation now looking more stable in the eyes of foreign powers, we can look to gain and give investments and see where we can find our place in this world of ours."
 FIJ_focus_farmers_investment_division: "Farmers Investment Division"
 FIJ_focus_farmers_investment_division_desc: "Farmers seem to have caused a lot of the ruckus on this fair island. Therefore we must set up a balanced farmers investment and agriculture division in the government which can attend to all needs, farmers are farmers in the end they all need help."
 FIJ_focus_fijian_redevelopment_fund_phase_one: "Fijian Redevelopment Fund Phase 1"
 FIJ_focus_fijian_redevelopment_fund_phase_one_desc: "The FRF or Fijian Redevelopment Fund is a protracted government initiative which will seek to solve multiple issues via a focal point of economic development. These plans will be comprehensive and staged out to the best possible way to ensure national stability in these tense times which we have been no stranger to."
 FIJ_focus_ministry_of_scientific_development: "Ministry Of Scientific Development"
 FIJ_focus_ministry_of_scientific_development_desc: "The MoSD will be a dedicated sector of the government, with this dedication its main goals will be to seek out bright minds and potential future minds of the nation and be able to research and develop not only new technologies but how we can elevate our people's education."
 FIJ_focus_reforming_trade_initiatives: "Reforming Trade Initiatives"
 FIJ_focus_reforming_trade_initiatives_desc: "Our island is home to many untapped resources, since we must diversify our economy we must be able to export as well as import. Renegotiating trade terms and looking to sell to the highest potential bidder will allow us to bring in more capital to better our future plans."
 FIJ_focus_pulling_in_foreign_scientist: "Pulling In Foreign Scientists"
 FIJ_focus_pulling_in_foreign_scientist_desc: "Our brightest minds are leaving, we must stop this at once. If we can convince foreign scientists to start research departments and create a base here, it'll help now only the development of the nation but dissuade those from leaving as well."
 FIJ_focus_overhauling_the_tax_code: "Overhauling The Tax Code"
 FIJ_focus_overhauling_the_tax_code_desc: "The Federal tax code is a shambles, the decades of coups, changing governments and the back and forth of pro-ethnic Fijians and pro-Indo-Fijians has made a mess and a great inefficiency of our tax code. We must start it from the ground up and give no quarter to mentioning anything about ethnicity. The Tax code is for monetary stability of the nation and not for picking favorites among our citizens."
 FIJ_focus_domestic_iron_development: "Domestic Iron Development"
 FIJ_focus_domestic_iron_development_desc: "With recent advances in geological surveying technologies, we've been able to uncover iron ore deposits for which we can use for domestic and exporting to others. This supply should allow us small wiggle room in the form of helping domestic development projects."
 FIJ_focus_expanding_upon_domestic_energy_sources: "Expanding Domestic Energy Sources"
 FIJ_focus_expanding_upon_domestic_energy_sources_desc: "Our island, while small is packed to the brim with a host of different natural resources. It is these same resources which will allow us to not only secure the domestic situation but allow us to look out into the regional house for which we live."
 FIJ_focus_human_resources_fund: "Human Resources Fund"
 FIJ_focus_human_resources_fund_desc: "With the development of our economy we must also have at least the people to work in it. As such we must look to bring home our citizens which have fled abroad, we must also look to bring in those seeking opportunity, with enough incentives we can show them real opportunity."
 FIJ_focus_pacific_exchange_and_investment_society: "Pacific Investment & Exchange Society"
 FIJ_focus_pacific_exchange_and_investment_society_desc: "They say you cant have your cake and eat it as well, but what about PIES. The society in question will be a great front to mingle in the pacific region and look to better assert ourselves among our much larger competitors."
 FIJ_focus_phase_two_development_fund: "Fiji Development Fund Phase 2"
 FIJ_focus_phase_two_development_fund_desc: "Phase 1 was a bit muddy by the mix of other focuses, but we must move forward with a real plan. The plan is to suck in foreign investment, prioritize domestic growth and balance the imports and exports of our nation to keep a strong level of economic and foreign independence."
 FIJ_focus_security_through_community: "Security Through Community"
 FIJ_focus_security_through_community_desc: "Policing efforts are strained under the ridged system, our new system allows for more community involvement. These programs will organize locals to be more in synch with each other, give people the ability for citizens arrest and allow for the expansion of local police departments through community engagement."
 FIJ_focus_the_care_balance_act: "The Care Balance Act"
 FIJ_focus_the_care_balance_act_desc: "The CBA is a legislation which will go through the country's healthcare and social care apparatus and attempt to balance and overhaul the sore thumbs in the room."
 FIJ_focus_the_military_reform_bill: "The Military Reform Bill"
 FIJ_focus_the_military_reform_bill_desc: "Parliamentary Bill #M253 is a negotiation bill, wherein through the depoliticization of the military funding will be increased to allow for more domestic forms of training programs. This as well as making larger paychecks for our men and women who put their lives on the line to defend our nation and its people. Its a start, but there is not much hope in regards to military investment."
 FIJ_focus_foreign_construction_contracts: "Foreign Construction Contracts"
 FIJ_focus_foreign_construction_contracts_desc: "Drawing in foreign investments has to start with the companies, not just the country leaders themselves. By focusing help of domestic contractors for construction projects, we can draw in new ideas, new materials and a new way wave of people which can live on the island."
 FIJ_focus_education_investment_package: "Education Investment Package"
 FIJ_focus_education_investment_package_desc: "The EIP is a dedicated increase in education and R&D budgets to help us gain traction in relation with our regional neighbors. From this we can seek out new more efficient forms of resources and production methods."
 FIJ_focus_foreign_medical_expos: "Foreign Medical Expos"
 FIJ_focus_foreign_medical_expos_desc: "Organizing with medical institutions from around the world should allow us to genuinely invest back into the health and wellbeing of our people, their mental and physical attributes and the lifestyles they try to have."
 FIJ_focus_phase_three_development_funds: "Fiji Development Fund Phase 3"
 FIJ_focus_phase_three_development_funds_desc: "We're on the road to greatness folks. By focusing on the real issues and calming down the divides set up by the past we have set our nation on the path of growth instead of the path of destruction. We must double down and continue this method of governance to secure the future of our nation and now our way of life."
 FIJ_focus_cohesive_integrations_act: "Cohesive Integrations Act"
 FIJ_focus_cohesive_integrations_act_desc: "With our homeland understood we must seek to understand our Pacific neighbors. Understanding their culture, their people and their societies allows us to better work with these folks in the future."
 FIJ_focus_resource_securities_initiative: "Resource Securities Initiative"
 FIJ_focus_resource_securities_initiative_desc: "The RSI is a dedicated state security and diplomatic institution which will work to seek domestic and foreign resources for the development of our nation and the benefit for those who provide."
 FIJ_focus_military_baseline_act: "Military Baseline Act"
 FIJ_focus_military_baseline_act_desc: "Through our goals of prosperity and investment in ourselves and others a glaring reality is becoming more and more apparent. As such we must create a baseline readiness of our armed services and with this, we can allow our nation and its partners to feel the safety and security we little guys deserve from the bigger nations."
 FIJ_focus_independence_sustainment_act: "Independence Sustainment Act"
 FIJ_focus_independence_sustainment_act_desc: "Through the organization of our peoples into local bands, uniting communities as not only self made units but of a piece of the greater Fiji national pie. We seek to create an atmosphere of defiance and self-determination, with the Chinese and so many larger more....willing nations on an quest for self gain we must stay vigilant in these uncertain times."
 FIJ_focus_modern_industrialism_act: "Modern Industrialism Act"
 FIJ_focus_modern_industrialism_act_desc: "The MIA is a bill which seeks to better streamline the way on how production industries are laid out and to better increase the overall efficiencies of said industries. In turn we'll increase the standards for which our people may be able to enjoy in life."
 FIJ_focus_food_of_tomorrow: "Food Of Tomorrow"
 FIJ_focus_food_of_tomorrow_desc: "Our island is small, as such we must look to secure more from less. As such we will dedicate a wing of the general R&D department to securing the basics of life for our people."
 FIJ_focus_progressive_taxes_progressive_gains: "Progressive Taxes For Progressive Society"
 FIJ_focus_progressive_taxes_progressive_gains_desc: "With this tax reform we seek to better balance the forms of taxation based on the incomes generated. Through the balancing of taxation levels we see no one massively outpacing another simply cause they supposedly pulled themselves up by their own bootstraps. Now we can use this new revenue balance to give everyone a better life style and invest back not only into the economy, but the people and this nation as a whole."
 FIJ_focus_united_fiji_installed: "§lMilitary Installs UFP Moderate Government§!"
 FIJ_focus_united_fiji_installed_desc: "With the government resisting the military's demands, Commodore Frank Bainimarama has initiated a coup of the government and has looked to install a moderate of the United Fiji Party. Most see this new government as military appointed yes men, however some have hope that this will reset the tight rope like legislative backlash the constitutional crisis caused of recent."
 FIJ_focus_resetting_ethnic_legislations: "Resetting Ethnic Legislation"
 FIJ_focus_resetting_ethnic_legislations_desc: "By cutting back and for lack of better words, resetting bills and laws which seem to have swayed the ethnic balance. We can look to set them back to a more neutral position to get a more level minded approach to the situation at hand."
 FIJ_focus_slashing_biased_taxes: "Slashing Biased Taxes"
 FIJ_focus_slashing_biased_taxes_desc: "The governments of the past have worked against the notion of peace for our island. One of the main issues was the tax code and its many subtle underlines which help specific ethnic peoples over others, we will begin to cut these back."
 FIJ_focus_jobs_initiative: "Jobs Initiative"
 FIJ_focus_jobs_initiative_desc: "Through a comprehensive government spending package we'll invest into creating job initiatives. This will help get anyone and everyone a job where possible and set a new standard of equality for our nation."
 FIJ_focus_fijian_resource_development_program: "Fijian Resource Development Program"
 FIJ_focus_fijian_resource_development_program_desc: "The FRDP will spearhead resource development and extraction. Such a program will be turned into a government ministry and as such will also be seen more for the betterment of the nation rather than the betterment of specific groups. The main point is that lands which are found to have valuable resources will now have government ownership and businesses will have shared ownership in handling the extraction and processing of said resources. The plan is to foster national unity through the development of prosperity."
 FIJ_focus_health_not_wealth_act: "Health Not Wealth Act"
 FIJ_focus_health_not_wealth_act_desc: "The HNW act is a legislation which will reform some key labour laws which allows us to better balance and create more fair play in the average joe's environment. By creating new workplace standards and equalizing and or outright gutting old and defunct regulations, we allow our people to work smarter, build better and live together longer."
 FIJ_focus_fiji_more_than_just_water: "Fiji, More Than Just Water"
 FIJ_focus_fiji_more_than_just_water_desc: "Our island has an awful history, this history is very apparent through the actions and the current standings our fair nation has with a lot of the world. Knowing this we must seek out what foreigners think about our nation and look to win hearts and minds. Showing that we can change and that our island is more than just a water commercial."
 FIJ_focus_researching_new_trades: "Researching New Trades"
 FIJ_focus_researching_new_trades_desc: "Through generous investments into R&D related to trading goods and services. Along with obtaining said goods and service, our nation shall reach new heights never thought before."
 FIJ_focus_unity_through_service: "Unity Through Service"
 FIJ_focus_unity_through_service_desc: "The military has been the biggest part in holding our society together. In the end of things we must recognize that strength through unity is what drives this nation forward. As such with some well rounded negotiations with military leaders we have come up with a comprehensive plan to better invest in the military, its personnel and allow the better separation of civil and military authorities. We can ill afford another 2000 Coup."
 FIJ_focus_peace_for_piece: "Peace For Piece"
 FIJ_focus_peace_for_piece_desc: "Through peace at home we achieve pieces of abroad. Now with our island seeing a level of stability not seen in years many nations are now more willing to trade, vacation and work with us. This should allow us to better see to the future and staking our claim within the region."
 FIJ_focus_low_income_work_houses: "Low Income Work Houses"
 FIJ_focus_low_income_work_houses_desc: "Government created Low Income Housing. A dedicated project which can help us get people off the streets and into homes and jobs. Granted the cost will be a bit high, however to ensure safety, security and prosperity, we should understand the real expense by not doing such a thing."
 FIJ_focus_funding_a_new_sector: "Funding A New Sector"
 FIJ_focus_funding_a_new_sector_desc: "With new geological surveys we've been able to determine a good sizeable area for a low grade iron ore mining operation. Having this domestic supply will bolster our diversification of the economy and seek to bring back more opportunity where possible."
 FIJ_focus_finding_homes_abroad: "Finding Homes Abroad"
 FIJ_focus_finding_homes_abroad_desc: "Some of our homeless are surprisingly overly mannered and have social skills which could be used to the nation's benefit. As such we'll take in and hire these skilled under valued members of our society and expand the foreign office. Using the rough times they've had as a point of interest, they should be able to better appeal to the common folks of nations abroad. Thus now showing the world the idea of the Fijian Dream."
 FIJ_focus_evaluating_military_requirements: "Evaluating Military Requirements"
 FIJ_focus_evaluating_military_requirements_desc: "Technically a military does not contribute to the economy in any such way. However, neither do homeless people either. So if we could artificially raise the bottom line by just tweaking standards and requirements to actually join the military. Then we could reduce homelessness, increase our national defense and to boot increase our army leadership and knowledge since there will be exposure to larger units. Everyone wins in the end."
 FIJ_focus_reorganizing_homeless_shelters: "Reorganizing Homeless Shelter"
 FIJ_focus_reorganizing_homeless_shelters_desc: "The state of some of our welfare programs are in  is genuinely shocking. We must reorganize the funding and structure of these places to be more efficient in the amount of people they can comfortably handle."
 FIJ_focus_naval_primacy_expected: "Expected Naval Primacy"
 FIJ_focus_naval_primacy_expected_desc: "Our nation is an island nation, for us to have any genuine impact on our region of influence we must genuinely invest in our navy."
 FIJ_focus_synthetics_centric_research: "Synthetics Centric Research"
 FIJ_focus_synthetics_centric_research_desc: "Our island has a host of natural resources, the problem is that on scale with the globe we are significantly insufficient. Knowing this key problem we can seek out the future of resources. By pioneering synthetic technology we could establish our own forms of limited Autarky for which the globe has not actually seen before. A small footnote, but to us it is nevertheless a proud statement of our nation."
 FIJ_focus_streamlining_tax_code_expansions: "Streamlining Tax Code Expansions"
 FIJ_focus_streamlining_tax_code_expansions_desc: "Parliamentary Bill T:101A will streamline the process and what kinds of taxes can be levied on the nation as a whole. We hope that by creating a known standard will allow our businesses and population to encourage development in ways which, while may go around these taxes, will also indirectly increase the levied taxes."
 FIJ_focus_building_tall: "Building Tall Act"
 FIJ_focus_building_tall_desc: "With our space limited and our nation small we must make the most of the space we have. With this in mid we seek out the new and modern baseline our people must be accustomed to. Automation is the future whether we genuinely like it or not, but rather than just replacing people we must integrate the people with the machines. Expanding our productive capacity and making our island way more efficient then most may even think of."
 FIJ_focus_promoting_a_frugal_lifestyle: "Promoting A Frugal Lifestyle"
 FIJ_focus_promoting_a_frugal_lifestyle_desc: "Our space is limited and our options are few when it comes to developing our island. We must have some genuine regard into preserving the natural beauty of our land if we are to keep the supposed Island Destination vibe for tourist. As such our people must understand to enjoy life as it is, seek out the good in what they have, rather than always worry about what they supposedly could have. Save the materialism for the Americans, this shall not be the way of the Fijians."
 FIJ_focus_exploiting_corporatism: "Exploiting Corporatism"
 FIJ_focus_exploiting_corporatism_desc: "Our nation has plenty of local and foreign businesses in which we generate a significant amount of GDP. However with the trends of human nature shows that they want the power and the money. We can exploit this by cozying up and supposedly taking bribes and so forth, but in reality use this money as a sort of war chest. Funding programs that may fall a little short outside of budgeting sessions, keeping the peace when a possible economic downturns and whatever possible. Of course they'll probably catch on, but lets enjoy it while we can."
 FIJ_focus_neutral_selectivism: "Neutral Selectivism"
 FIJ_focus_neutral_selectivism_desc: "The big dogs of the Pacific, The United State of America and The Peoples Republic of China. These two nations will eventually butt heads a bit too hard, as such we must be cordial but not seek out favors. The US is more likely to invest, but we must spin these in ways that China would want to top. Play the top dogs while they indirectly build the under dog sort to speak."
 FIJ_focus_innovations_sector: "Innovations Sector Start Ups"
 FIJ_focus_innovations_sector_desc: "With no real abundance in raw materials we must branch into different markets which appeal to the changing world. Our tech start ups shall lay the bedrock for our breach into the tech industries, allowing us to sell valuable software and other products to the highest bidders."
 FIJ_focus_employment_commission: "Employment Commission"
 FIJ_focus_employment_commission_desc: "Bill 5436 also known as the Employing Everyone Act, is legislation which will establish the department of Employment. The Employment Commission will seek out government funded initiatives in which jobs can be directly funded and supported to ensure those who do not have a job have the genuine opportunity to have a job. The cost would be greater in the beginning, but as time goes on it would be offset by new tax income and revenues from the new businesses created."
 FIJ_focus_limited_fijian_naval_expansion: "Limited Fijian Naval Expansion"
 FIJ_focus_limited_fijian_naval_expansion_desc: "Our trade and our waters must be defended. A couple of PT boats is genuinely not enough to warrant real defense. We must create a genuine expansion of limited and defensive posturing with our navy to ensure our island's security. Personnel and equipment must be standardized and improved upon with the knowledge we know from domestic and foreign missions we have partaken in."
 FIJ_focus_education_budget_expansion: "Education Budget Expansion"
 FIJ_focus_education_budget_expansion_desc: "Through an expansion of the education budget, we can seek out the betterment of our people's understanding of the wider world around us and to bring new opportunities as the generations pass."
 FIJ_focus_balancing_budgets: "Balancing Budgets"
 FIJ_focus_balancing_budgets_desc: "We've seen our nation develop and strive, but we've also seen a trend in the budgeting department. If we are to be a real model of growth we must be flexible budget wise and understand that we can balance where overages and shortcomings appear."
 FIJ_focus_industrial_expansion: "Industrial Expansion"
 FIJ_focus_industrial_expansion_desc: "Our unemployment is at a record low and best of all, our emigration trends are also low. We must sponsor an industrial expansion to continue this god send of a trend in our nation's history."
 FIJ_focus_revitalization_of_foreign_perception: "Revitalization Of Foreign Perception"
 FIJ_focus_revitalization_of_foreign_perception_desc: "The progress our nation has made for a better image, not only for our people but of the greater world around us. Let us truly enjoy this new age for our quaint island paradise."
 FIJ_focus_extracting_the_future: "Extracting The Future"
 FIJ_focus_extracting_the_future_desc: "New technologies in geological surveying and of mining along with extraction techniques have allowed us to expand the understanding of our available resources which we can truly excavate. While some are not honestly thrilled with expanding mining operations, this is nevertheless a key portion which expands and keeps our economic development cycle stable and steady."
 FIJ_focus_wealthcare_act: "Wealthcare Act"
 FIJ_focus_wealthcare_act_desc: "With the rapid growth of wealth in our nation it is only fitting that our people deserve the care and access to medical and post retirement benefits for which nation nearly 100 times our size have. With some investments and procurement in equipment and personnel we shall create the care our nation has been striving for, for nearly decades now."
 FIJ_focus_military_radicals_force_a_junta: "§8Military Radicals Install Junta§!"
 FIJ_focus_military_radicals_force_a_junta_desc: "With massive internal pressure the Commodore has been forced to install a junta. With the sad news unrest has beset the nation, but nationalists rally together to create order with the military."
 FIJ_focus_martial_law_window: "Martial Law Timer"
 FIJ_focus_martial_law_window_desc: "We shall restore order in the land, we shall also commit to the stabilization of the nation as we evaluate our situation. This martial law will denote no travel to and from foreign nations for a duration due to the principle of a worsening emigration problem. Many won't like this, but we must endure."
 FIJ_focus_merging_police_forces: "Merging Police Forces"
 FIJ_focus_merging_police_forces_desc: "The distinction of a Military Police and a Civilian Police is a waste of resources and doubling commands. As such we will integrate both forces, place them under a military like structure and ensure the unified goal of protecting our nation and its people in times of disorder and lawlessness."
 FIJ_focus_militarized_politics: "Militarized Politics"
 FIJ_focus_militarized_politics_desc: "The Governmental structure is a good organization, with some fine tuning and militarizing the apparatus all together we can really turn this nation around like a well oiled machine. After all, what is a parliament but the civilian version of a general staff meeting and or planning room."
 FIJ_focus_weathering_the_political_storm: "Weathering The Political Storm"
 FIJ_focus_weathering_the_political_storm_desc: "While we are not entirely out of the woods yet, we must nevertheless lighten our grip on the excesses of control. The world already is deeply against us due to the authoritarianism we embody as a military junta. So we're lifting the travel ban and the martial law, along side this we are passing our first official reform post coup chaos which is the limited care act. This bill will reduce costs and the direct excesses which parry our medical field at this time, hopefully this gesture will turn some heads in a positive manner."
 FIJ_focus_transparency_in_requirements: "Transparency Requirements Act"
 FIJ_focus_transparency_in_requirements_desc: "The TRA is an extensive overhaul in the transparency in rule making and requirements in civil and military based laws. This also effects the transparency in requirements for things like how people can get jobs in the civil society or how promotions and responsibilities in the military society."
 FIJ_focus_fijian_service_means_fijian_respect: "Fijian Service, Fijian Respect"
 FIJ_focus_fijian_service_means_fijian_respect_desc: "Updating and direct messaging in code of conduct will cut down on old grudges. By increasing the penalties and showing not only on paper but in practice as well that those who server Fiji are Fiji itself. By fostering this family based bond we look to unite our people and throw away the old world influences."
 FIJ_focus_constitutional_safeguard: "Constitutional Safeguard"
 FIJ_focus_constitutional_safeguard_desc: "Our people do not trust the system, it is said system we must let them trust. Therefore we will pass an amendment which stipulates and makes a national crime out of unjust treatment of Fijian citizens as a whole, regardless of ethnic origins. With this decree we hope to mend the decades of strife which has torn this nation asunder."
 FIJ_focus_foreign_advisors: "Foreign Advisors Board"
 FIJ_focus_foreign_advisors_desc: "With the world seemingly against us we must look to genuinely show we want to do right by our people and of the mutual benefit of those around us. As such with an extensive civil and military advisory board created to help us rebuild our nation, we can seek out new frontiers of growth for our fair island nation."
 FIJ_focus_building_upon_our_civilian_base: "Building Upon Our Civilian Base"
 FIJ_focus_building_upon_our_civilian_base_desc: "The economy is small compared to our population, not to mention we seem to have a host of problems with this lack of economy as a whole. As such a directed investment to increase such industrial base will allow us to get the people working for the nation, its goals, and for each other."
 FIJ_focus_starting_domestic_arms_companies: "Starting Domestic Arms Companies"
 FIJ_focus_starting_domestic_arms_companies_desc: "The Fijian Military is not known for...really anything now that I think about it. We must change that and as such the best starting place would be to have domestic arms companies form within our nation and create a unique Fijian Military Identity. We may never be compared to the likes of America, Germany and so on, but we can certainly make ourselves known in the region which we live in."
 FIJ_focus_bringing_jobs_back_to_fiji: "Bringing People & Jobs Back To Fiji"
 FIJ_focus_bringing_jobs_back_to_fiji_desc: "Our people still leave our nation, whether its to study, work or whatever we still suffer from the emigration which plagues our nation. As such we must invest more directly and precisely into the problems which cause such an exodus."
 FIJ_focus_establishing_the_university_of_fiji: "Founding The University Of Fiji"
 FIJ_focus_establishing_the_university_of_fiji_desc: "Education...this fundamental pillar of society must be one of our main focuses when considering our nation and people's future. This pillar has both civilian and military applications which in turn will be implemented to the fullest extent."
 FIJ_focus_fijian_care_act: "Fijian National Care Act"
 FIJ_focus_fijian_care_act_desc: "The FNCA is a program to put back into programs which effect our life lived population. Contrary to all the emotional fervor of political theater, older people cause more problems then they hope to even think about. As such if we can keep them quiet through comfy living post retirement and so forth, we'll be able to have a better assessment on the needs of the active population."
 FIJ_focus_increase_funding_for_the_fcoe: "Increase Funding For The FCoE"
 FIJ_focus_increase_funding_for_the_fcoe_desc: "The bedrock of our civilian and military hybridization is that of the Fijian Corps of Engineers. We must increase their funding to allow for an expansion of the branch in order to better both military and civilian applications."
 FIJ_focus_deboning_healthcare_excesses: "De-Boning Healthcare Excesses"
 FIJ_focus_deboning_healthcare_excesses_desc: "Who would have thought, that if you have programs which go unchecked and unsupervised due to decades of political chaos and constant governmental changes, that corruption and lost money would be somewhat rampant. A complete redraft and practically a restarting of our healthcare network is in order. By doing this we can create a blank slate which will atone for the changes we now face and the reality that our nation is truly on its own road to recovery."
 FIJ_focus_national_rotc_curriculum: "National ROTC Program"
 FIJ_focus_national_rotc_curriculum_desc: "In places like the United States, some schools have a program which is run by a military branch in which send program teaches students leadership lessons which apply to the civilian world through a military organized structure. This is the future and main point in the school system we need. From the start of middle school all schools will follow this format and the nation's students in their respective graduating years will be organized into quote on quote, units. Forstering the knowledge of community, leadership and innovation through teamwork, we seek to create a future that our youth can truly understand and be prepared for."
 FIJ_focus_barracks_housing_initiative: "Barracks Housing Initiative"
 FIJ_focus_barracks_housing_initiative_desc: "The BHI Act will be a new way to approach housing short falls in the nation. Homeless people can take residence in a barracks like housing unit with others in similar dispositions. In such an environment they will be able to get back on their feet through a jobs program and military like routine in order to instill that initiative back into those that believe the system has left them behind. Working up the income through this quote on quote basic training like program until they can get a job outside of the program and into a home outside of the barracks complex."
 FIJ_focus_resource_extractions_act: "Resources Extractions Act"
 FIJ_focus_resource_extractions_act_desc: "The REA will prioritize those who are homeless and or also in the penal system to seek employment as a way in which to earn a living and do right by developing the nation. With this act we seek to understand and expand the resources which we can have domestically speaking."
 FIJ_focus_expand_the_fcoe: "Expanding The Fijian Corps Of Engineers"
 FIJ_focus_expand_the_fcoe_desc: "With the growing need of new infrastructure, housing and the economy as a whole, we must expand the keystone to our bridge. That keystone being the Fijian Corps of Engineers or FCoE. This expansion will see a faster and more comprehensive approach to handling development as more resources and manpower begin to be allocated to the sub-branch of the military."
 FIJ_focus_tax_rebalancing_act: "Tax Rebalancing Act"
 FIJ_focus_tax_rebalancing_act_desc: "The military parliament has passed the Taxation Rebalancing Act, in which a general overview of the current tax code will be reviewed individually and allow us to fix obtuse taxes being levied on those who were put out of a home."
 FIJ_focus_expanding_the_ministry_of_science: "Expanding The Ministry Of Science"
 FIJ_focus_expanding_the_ministry_of_science_desc: "Our nation falls behind the world not only cause our land is small in size, but rather we don't truly innovate. We seek foreign help as with the creation of our Foreign Advisory Board. But no more, we'll show the world we can get somewhere and with that we will invest heavily into our ministry of science and the overall abilities which our nation has to research and develop technologies."
 FIJ_focus_soldiers_lifestyle_act: "A Soldier's Lifestyle Act"
 FIJ_focus_soldiers_lifestyle_act_desc: "The parliament has seen fit to pass a decree in which creates the true bottom line for a standard lifestyle. The bottom line being that of the average soldier within our armed services. This creates a national and generational understanding of what our people do enjoy at the expense of what some can't."
 FIJ_focus_the_citizen_soldiers_act: "The Citizens Soldiers Act"
 FIJ_focus_the_citizen_soldiers_act_desc: "Parliament has passed the Citizens Soldiers Act, a constitutional amendment in which every citizen is a soldier of the nation and every soldier is a citizen of the nation. This amendment essentially declares those who serve Fiji are in themselves Fijian, equivocally denoting that the idea of being Fijian is not just some pseudo-science based race or ethnic garbage that some would like to express. But rather the idea of Fiji or what it means to be Fijian is about devotion to the nation and its ideas."
 FIJ_focus_energizing_the_nation: "Energizing The Nation"
 FIJ_focus_energizing_the_nation_desc: "In order to properly balance both military and civilian needs we are going to need to expand our energy network. Having a stable grid and fuel supply will prove stability and foresight to the journey ahead."
 FIJ_focus_naval_industrialism: "Naval Industrialism"
 FIJ_focus_naval_industrialism_desc: "We are an island nation, its only natural that we focus our military side of production towards naval vessels. How else could we appeal to foreign powers like America, Australia and so forth if we turned out to be nothing more than a glorified military base."
 FIJ_focus_energy_diversity_act: "Energy Diversity Act"
 FIJ_focus_energy_diversity_act_desc: "The EDA will mandate the diversity of our energy grid as to make our nation more defendable from foreign exploiters. Putting all our eggs in one energized basket is a recipe for instant chaos should our nation be attacked in any way shape or form."
 FIJ_focus_mining_the_future: "Mining The Future"
 FIJ_focus_mining_the_future_desc: "We know we got our own resources, we should be using them to better our nation and to prevent outside interference in basic economic needs."
 FIJ_focus_naval_priorities: "Naval Priorities"
 FIJ_focus_naval_priorities_desc: "While we seek to have a robust and balanced recruitment to our military, we also know that we are literally an island. As such funding increases will sway in the direction of the navy over other branches, but not too much cause we don't need unhealthy inter-service conflicts."
 FIJ_focus_civilian_air_training: "Civilian Air Training"
 FIJ_focus_civilian_air_training_desc: "So....we know we have a pretty rough history with having an air force. But we can't let the past dictate our present situation let alone our future endeavors of existence. Therefore we'll use civilian based training programs and aircraft as a way to introduce and begin the baby steps of our air force branch. It'll be a slow process, but one we need if we are to survive in this modern age."
 FIJ_focus_prussia_of_the_pacific: "The Pacifica Prussia"
 FIJ_focus_prussia_of_the_pacific_desc: "Our state is the modern embodiment of a Prussian like nation. Molding and fusing civilian and military lifestyles into one cohesive machine has created a new age for Fiji. We are small, but we are proud, we build tall and speak loud, we are a regional power and will make our voices heard like every other nation."
 FIJ_focus_monarchist_acendence: "§0Monarchist Ascendancy§!"
 FIJ_focus_monarchist_acendence_desc: "The military's infighting has led the way to the righteous path of our nation. Brothers and sisters of Fiji, we stand united under god and under the banner of Fiji. We are the masters of our own destiny, democracy has proven too unstable to hold form. Therefore we must compromise and create a new society, one with nationalism, one with military strength, one where to be Fijian is more than just simply about ethnicity."
 FIJ_focus_the_kingdoms_quarrels: "The Kingdom's Quarrels"
 FIJ_focus_the_kingdoms_quarrels_desc: "The political situation is tenuous at best and absurdly decrepit at worst. We must wrangle together a cabinet, formalize the government and assess our nation's biggest problems."
 FIJ_focus_the_kingdoms_economy: "The Kingdom's Economy"
 FIJ_focus_the_kingdoms_economy_desc: "If we are to get anywhere in this world we need to have a real economy. Diversity is the main point, the supporting point would be to have the right people for said economy. Overall though we'll need to shop around if we are to get anywhere."
 FIJ_focus_the_ethnic_divides: "The Ethnic Divisions"
 FIJ_focus_the_ethnic_divides_desc: "The ethnic divisions of the nation stem back in the days of early English colonialism. With many colonial subjects from India being imported to Fiji to work on the sugar farms and sugar companies which lined the English coffers. This division and forced migration has been very tense since our nation's independence in the 1970s. As such this should be one of our biggest priorities in solving lest we want to actually stay in power."
 FIJ_focus_police_standards_act: "Police Standards Act"
 FIJ_focus_police_standards_act_desc: "Parliament has passed a bill which will reshape the standards which make up the police forces of Fiji. All code of conduct will be polished and refurbished in motions and language to stress the facts and reality that regardless of the situation, any and all actions must be assessed fairly based on the situation at hand. No acts of aggression must not happen against any civilian and or citizen of Fiji unless threat to person or property in progress. These steps will work to set the right wheels in motion."
 FIJ_focus_sponsored_emigration_deals: "Sponsored Emigration Deals"
 FIJ_focus_sponsored_emigration_deals_desc: "Though costly in the short term of things, long term wise we'll have stability come to the nation a lot faster....even if it is by unorthodox means. By creating sponsored emigration deals with ethnic Indians, we could look to shrink and indirectly homogenize our nation and work with those who genuinely want to stay. Everyone has a price, but everyone also has a choice."
 FIJ_focus_hiring_practices_act: "Hiring Practices Act"
 FIJ_focus_hiring_practices_act_desc: "A bill was passed standardizing the language in and reaffirming anti-discrimination laws. Seems what little we did have had a fair amount of loopholes, as such setting the playing field straight will stop exploitation and discrimination of all citizens of our fair nation."
 FIJ_focus_equal_standard_care_act: "Equal Standard Care Act"
 FIJ_focus_equal_standard_care_act_desc: "The ESCA is a legal bottom line in which all forms of care, be they medical or welfare related, public or private must have the same standard of basic care. We must ensure that no matter who is sick, or who has retired, that the citizens of this nation must be cared for and as such will enjoy said care no matter what their ethnicity may be."
 FIJ_focus_redrafting_the_constitution: "Redrafting The Constitution"
 FIJ_focus_redrafting_the_constitution_desc: "Its been a good while since a true redrafting of the constitution has been enacted. With this in mind we must put forth the governmental structure to rule. We must put forth the foundation of equality and social freedoms to have our nation build upon, lest we wish to cave in on ourselves down the road."
 FIJ_focus_addressing_the_brain_drain: "Addressing The Brain Drain"
 FIJ_focus_addressing_the_brain_drain_desc: "Our nation costs itself by merely existing at this point. Our people flee seeking better opportunities and better lifestyles. If we want to grow our nation, we need to invest and care for our nation and its people."
 FIJ_focus_establishing_the_reseach_and_development_ministry: "Establishing The Ministry For R&D"
 FIJ_focus_establishing_the_reseach_and_development_ministry_desc: "The creation and formalization of the Ministry for Research and Development or simply the Ministry of Research, will be a fundamental pillar in our society. Creating a head for our nation's education and innovative attributes allows us to better organize, fund and well, innovate."
 FIJ_focus_employment_assistance_programs: "Employment Assistance Programs"
 FIJ_focus_employment_assistance_programs_desc: "The unemployment of our nation and the fear of halting in life due to a bad turn of events can be a heavy driving force to cause people to leave. As such we must set up a series of prevention programs to temporarily help citizens transition into new jobs. Things like a small stipend to help for the month they may fall behind on bills for, or job boards to help find employment faster, things in the end that smooth the transition of employment and unemployment without giving people the feeling of life seemingly halting."
 FIJ_focus_specializing_medical_research: "Specializing Medical Research"
 FIJ_focus_specializing_medical_research_desc: "Our people are not many, thus every life in this nation by comparison is also way more valuable as well. We must ensure a significant sector of our Research and Development goes towards pioneering technologies within the medical field as a whole. Yes, yes it will cost us, but our people must be the best cared for if we are to truly utilize our population to the fullest potential."
 FIJ_focus_expanding_education_funding: "Expanding Education Funding"
 FIJ_focus_expanding_education_funding_desc: "Expanding our general investment towards our nation's education system allows us to create new generations of smarter citizens. The knowledge they gain will in turn be used in developing our nation and our future."
 FIJ_focus_creating_the_research_institute_of_fiji: "Creating The Research Institute Of Fiji"
 FIJ_focus_creating_the_research_institute_of_fiji_desc: "The RIF will be the pride of scientific development in the Pacific Ocean. Our investment and dedicated drive to innovation will allow our people to want to stay, to want to better not only themselves but our nation as a whole. We can also use this institution as a form of soft power in military development and national power projection."
 FIJ_focus_reviewing_the_housing_crisis: "Reviewing The Housing Crisis"
 FIJ_focus_reviewing_the_housing_crisis_desc: "In the developed western world a housing crisis is that of the asset market crashing. But in our case the housing crisis comes from a rising homelessness problem. Despite have a low population count we have a homeless problem on par with some nations in Africa. Understanding this scary reality will allow us to be decisive in how we go about fixing this growing ordeal and in turn maybe prevent such a cascade from happening again...or at least in the scale of it happening again."
 FIJ_focus_increased_homeless_shelter_funding: "Increased Homeless Shelter Funding"
 FIJ_focus_increased_homeless_shelter_funding_desc: "Our current homeless programs are not receiving the funding amount to properly take care of those who have come in need. With a direct investment towards increased funding we can better ensure the quality of care these citizens can have in their time of need until they get back on their feet."
 FIJ_focus_royal_engineers_program: "Royal Engineers Program"
 FIJ_focus_royal_engineers_program_desc: "The REP will allow a civilian jobs market within the Army's Corps of Engineers. This civilian wing of the Corps will be used for public works projects, government sponsored construction jobs and so on. The idea is to have a basic job in which if someone is unemployed and risks losing their home and subsequently their livelihood as a whole. Then we can create a hard floor in which our citizens can stand upon and not feel like they may free fall into depths they fear they might not come back from."
 FIJ_focus_young_business_leaders_program: "Young Business Leaders Program"
 FIJ_focus_young_business_leaders_program_desc: "The YBL program is a government initiative to inspire and help new and future business leaders. Everyone has the ability to own and operate a business, but those who truly want to do so can by joining the YBL program. By teaching business skills and accepting and in turn paying back no loss loans, we set up a positive environment to excel at molding our future economic pillars."
 FIJ_focus_resource_development_initiative: "Resource Development Initiative"
 FIJ_focus_resource_development_initiative_desc: "The RDI is a government spearhead in the economy to diversify our domestic resources. We know we have limited options due to us literally being an island. However this doesn't mean we actually don't have anything of value, on the contrary we have a nice mix of ores and minerals which allow us to have a well diversified economy. But if we are to keep the tables turned in our favor we need to have some more homely based resources."
 FIJ_focus_new_economic_planning_board: "New Economic Planning Board"
 FIJ_focus_new_economic_planning_board_desc: "The EPB will help city planners and investors both foreign and domestic to establish a new and ever expanding economy. This will allow us to draw in new capital and allow us to exercise a limited form of soft power projection in the form of supporting foreign companies and exporting our produced products."
 FIJ_focus_ensuring_a_steeling_future: "Ensuring A Steeling Future"
 FIJ_focus_ensuring_a_steeling_future_desc: "The development and procurement of steel in sufficient domestic hands allows us to essentially function. Steel is one of the main resources and materials which makes up the modern world we live in. As such securing a domestic supply allows us to keep some form of economic independence."
 FIJ_focus_phase_one_business_development: "Phase 1 Business Development"
 FIJ_focus_phase_one_business_development_desc: "The first results of our economic revitalization are coming to life and as such we'll be able to bask in prosperity in no time."
 FIJ_focus_oiling_our_nation: "Oiling Our Nation"
 FIJ_focus_oiling_our_nation_desc: "Through extensive surveying and research we have been able to dedicate our plan to securing a domestic supply of oil. The cornerstone of the modern age, we will secure our future and our energy and petrochemical needs."
 FIJ_focus_diversifying_the_naval_industries: "Diversifying The Naval Industries"
 FIJ_focus_diversifying_the_naval_industries_desc: "We have a strong ship building industry, but we must diversify and allow the expansion of both civil and military related industries on our island. We must be able to stake a small claim to securing our nation's soil and our way of competition with other nations."
 FIJ_focus_rubber_banding_the_nation: "Rubber Banding The Nation"
 FIJ_focus_rubber_banding_the_nation_desc: "Through breakthroughs in synthetic technologies we've been able to secure a sizable domestic supply of rubber from the limited stock of real rubber we have to specially produce. This may cost us a little more, but in the long term this boost will ensure another step to as much autarky as we can genuinely manage."
 FIJ_focus_phase_two_business_development: "Phase 2 Business Development"
 FIJ_focus_phase_two_business_development_desc: "Continual investments to improve business growth and expansion of our economy will no doubt allow us to grow at a steady rate."
 FIJ_focus_pacific_economics_exchange_commission: "Pacific Economics Exchange Commission"
 FIJ_focus_pacific_economics_exchange_commission_desc: "Our venture into regional recognition and to be a bit of a headache to the vying powers over the Pacific will be our crowning achievement. The Pacific Economics Exchange Commission is a tool of cooperation between our nation and others within the region of the Pacific ocean. The goal of the commission is to foster more cooperation and unity between us and the other island nations to at the very least, establish a broad status quo in the terms of soft power exertion."
 FIJ_focus_royal_military_expansion_program: "Royal Military Expansion Program"
 FIJ_focus_royal_military_expansion_program_desc: "A general expansion and funding of our military will allow us to expand domestic security and foreign support missions. Not only this but with a rise of the military we can instill a sense of duty and honor towards our nation and its people, in turn molding future generations to come."
 FIJ_focus_royal_military_contracts: "Royal Military Contracts"
 FIJ_focus_royal_military_contracts_desc: "The RMCs will be an incentives program to attempt domestic arms production. While its nothing to honestly sneeze at it will nevertheless allow us to properly supply our military and in turn better our training while also reducing the overall time need to train."
 FIJ_focus_royal_fijian_dream: "The Royal Fijian Dream"
 FIJ_focus_royal_fijian_dream_desc: "The Royal Fijian Dream is that of thinking of the past, but doing it by the standards of the present. A reaffirming of the constitutional declaration that the cornerstone of our democracy will be kept, but rather the names of offices and titles will simply be changed. Is this just adding more cosmetic panash to our way of rule, yes, but does this devalue our commitments to care for our nation and its people, certainly not. Sometimes a little boost in ego can do wonders to the many who may not always confide in themselves."
 FIJ_focus_technate_council_emerges: "§tThe Technate Council Emerges§!"
 FIJ_focus_technate_council_emerges_desc: "In Fiji many prominent technical experts have studied abroad. The Technate Council is a group of well respected sect of economist, scientists and other technical experts which have collectivized themselves into their own power block. As such in the seemingly endless chaos and factionalism the Technate Council acted by using their connections and influence to subdue faction leaders either through direct or indirect means. As a result the council has taken leadership of the nation and will strive to make Fiji into a model of human ingenuity and innovation."
 FIJ_focus_a_technocratic_constitution: "A Technocratic Constitution"
 FIJ_focus_a_technocratic_constitution_desc: "The fundamental of any Technocracy is that the governing body is for the betterment of the species and not the sub-category of said species. Therefore we plan to redraft the constitution of our nation and create the first ever Technocratic constitution. The main points we can break down as we go about redrafting it but suffice to say the main point now is that while we call ourselves Fijians and have a nation-state called Fiji. Hence forth any human under the governing body of this nation will be treated as an equal. Humans are humans, we are the species and we must work together to solidify the future and progress of our species."
 FIJ_focus_human_treatment_amendment: "Human Treatment Amendment"
 FIJ_focus_human_treatment_amendment_desc: "The Human Treatment Amendment states in clear language that any member of the human species, regardless of variation, will be treated as a human. This means any and all unjust acts of harm done onto another member of the species due to difference in beliefs, looks or personal identity within the known scientific realms of understanding, will be punished severely in accordance with the laws laid out in the criminal code."
 FIJ_focus_voting_requirements_amendment: "Voting Requirements Amendment"
 FIJ_focus_voting_requirements_amendment_desc: "The amendment for voting requirement is a simple and straightforward answer to voting in this modern age of democratic governments. The voting age will be 18, the legally recognized age of becoming an adult and understanding personal responsibility of your own life choices and actions. All registered citizens of the nation will be allowed to vote, this is to prevent malicious foreign adversaries from exploiting the openness that can come from a direct democracy. Votes will be cast through a government website which can be accessed at home, on the phone, or at a local administrative building. Voters must be able to put in their citizenship ID number as to prevent double voting and other malicious acts of hinderance."
 FIJ_focus_working_standards_amendment: "Working Standards Amendment"
 FIJ_focus_working_standards_amendment_desc: "The amendment for standards of workplace environments and jobs covers the new direction we fundamentally want to take the nation in. The main stipulation is the immediate analysis and implementation of the revolving schedule. This is more commonly known as the 4 & 4 schedule. For 4hrs a day, 4 days a week will be the standard work week of our citizens. This roll out will obviously take time but this formatting ensures maximum employment and worker retention and happiness."
 FIJ_focus_funding_our_future: "Funding Our Future"
 FIJ_focus_funding_our_future_desc: "The core of our journey into a technocratic future is to ensure that future generations are being adaptively taught the information of the wider world and beyond. Some are visual learners, some are hands on. But its all a sliding scale and as such if we can't slide with that scale we will create a caste of people and only hurt them by not truly caring about how they can learn and adapt."
 FIJ_focus_growing_our_manufacturing_base: "Growing Our Manufacturing Base"
 FIJ_focus_growing_our_manufacturing_base_desc: "If we are to achieve a future of progress we must grow, not only as a nation but our economy as well. This point will start a dedicated focus to economic growth. Which we will also have a supporting pillar as well in social development and investment."
 FIJ_focus_building_the_institute_of_automation: "Building The Institute Of Automation"
 FIJ_focus_building_the_institute_of_automation_desc: "The RPP or Research Paradise Program is something that will launch our nation and subsequently our species on this planet into the future we speculate about. Starting with the Institute of Automation we'll use this institution to dedicate innovations and research into better automating and integrating new technologies and methods for which we can build, produce and create. Setting the bar for creating more at cheaper and faster rates we hope to give everyone where possible a new standard of living not seen since the Post War Era."
 FIJ_focus_dedicated_welfare_funding: "Dedicated Welfare Funding"
 FIJ_focus_dedicated_welfare_funding_desc: "If we want our citizens to be productive and cooperative we must also take care of them as well. Respect is a two way street and regardless of the emotional impact we are all members of the same species, thus by constitutional decree we must care for one another as such."
 FIJ_focus_tech_industrial_investments: "Tech Industrial Investments"
 FIJ_focus_tech_industrial_investments_desc: "Our understanding of the wider global economy shows full well that the tech industries are where things are at. Knowing this we can get in on the game and integrate this as part of our Research Paradise Program as well."
 FIJ_focus_institute_for_resource_development: "Institute For Resource Development"
 FIJ_focus_institute_for_resource_development_desc: "The IRD will dedicate it research towards ways of resource extraction, refinement and synthetics. This overhaul and dedication will set the bedrock for our development for economic autarky and allow the world to see that we can create a better tomorrow."
 FIJ_focus_institute_for_energy_development: "Institute For Energy Development"
 FIJ_focus_institute_for_energy_development_desc: "The creation of the IED will be to develop new ways of producing energy. This also extends to making these new methods of production more efficient and productive overall. As such this new extension of the Research Paradise Program will help to secure more energy independence from foreign powers."
 FIJ_focus_labour_corps: "Labour Corps"
 FIJ_focus_labour_corps_desc: "The Labour Corps is a government sponsored initiative to organize and prioritize the development and construction of new public works and new infrastructure on the whole. This military like civilian organization will allow us to build things at speeds no normal developed nation would be able to. This is due to the organization and streamlining of regulations along with how we directly attack needs and get them done."
 FIJ_focus_labour_prison_program: "Labour Prison Program"
 FIJ_focus_labour_prison_program_desc: "The LPP is a rehabilitation philosophy in relation to the criminal system. Those who commit crimes and are imprisoned will receive the basic forms of care and attention. However all prisoners will be able to enroll into the LP Program wherein the prisoner will be able to have a dedicated job in which they can earn energy credits. These credits can be exchanged in to redeem for a set amount of quote, upgrades, in relation to raise the minimum of their duration to a more bearable state. After all supposed upgrades are bought and depending on the offense the prisoner can eventually exchange a set amount of energy credits to reduce their sentence. Though this rate at first will be bias to keep them in, in the end the goal is to encourage a form of rehabilitation through work and dedication and to prepare the prisoners to re-enter society."
 FIJ_focus_increasing_domestic_steel: "Increasing Domestic Steel"
 FIJ_focus_increasing_domestic_steel_desc: "Through extensive surveying and research we've been able to make a breakthrough in the development of our domestic steel production. While its not a lot, it is nevertheless a good starting point for us to be more self sufficient."
 FIJ_focus_technocratic_militarism: "Technocratic Militarism"
 FIJ_focus_technocratic_militarism_desc: "A common uniting principle in our species' history is that of duty and honor to the homeland and those who serve it. We must implore a good footnote of research and development towards enhancing our military. This may not put us on par with say nations like France, Germany and so on, but at the very least we could emulate a mini sized American military. One can dream...one can dream."
 FIJ_focus_research_paradise_program: "Research Paradise Program"
 FIJ_focus_research_paradise_program_desc: "After nearly 3 years in development we can finally unleash our ultimate goal. The Research Paradise Program will serve as a cornerstone of the global scientific community and use extensive funding to create a vacation like hub for researchers from all fields to study, experiment and explore their fields of study. We will create a quote, world in which the STEM fields can be seen as not only the future, but just as enjoyable as a regular vacation."
 FIJ_focus_promoting_domestic_energy_synthetics: "Promoting Domestic Energy Synthetics"
 FIJ_focus_promoting_domestic_energy_synthetics_desc: "Breakthroughs in synthetics has resulted in a growing domestic supply of oil. This domestic supply will further be used to grow our economy as while this can be used for energy this will also propel our general petrochemical industries."
 FIJ_focus_technocratic_health_act: "Technocratic Health Act"
 FIJ_focus_technocratic_health_act_desc: "The council has passed the THA, a bill which invests a general expansion into our healthcare system. This will allow us to better treat and care for our population on the whole. We must be able to build tall, in order to do that we must have the population, both in size and in motivation that that population wants to build to."
 FIJ_focus_industrial_diversity_act: "Industrial Diversity Act"
 FIJ_focus_industrial_diversity_act_desc: "The IDA sees the further diversification of our civilian economy. With continued efforts from the Institute Complex we have been able to truly develop our nation."
 FIJ_focus_family_care_act: "Family Care Act"
 FIJ_focus_family_care_act_desc: "This decree is a core understanding that for healthy societal cohesion, the family, regardless of the make up, is the main keystone of any society. As such we must restructure our welfare programs to support and maintain this keystone to keep strong the structure of our society."
 FIJ_focus_research_plan_alchemy: "Research Plan Alchemy"
 FIJ_focus_research_plan_alchemy_desc: "Our most ambitious plan to date. Research Plan Alchemy will cost around a third of our GDP, but we believe we have the extreme basics to attempt molecular reorganization. In plain terms this would be nearing the equivalent of Alchemy itself. Though this tech would be extremely volatile and expensive, if we can truly work through this, we would be able to unlock the near truest form of economic autarky."
 FIJ_focus_research_plan_armory: "Research Plan Armory"
 FIJ_focus_research_plan_armory_desc: "Our military must be on par with our civilian advancements. While we can't just put all our best new inventions in the field, the very least we can do is raise the standard at which our service personnel can both fight and survive. Though this will of course come at a decent costs, the end results will prove to the betterment of our nation's security overall."
 FIJ_focus_research_plan_biomedical: "Research Plan Bio-Medical"
 FIJ_focus_research_plan_biomedical_desc: "Plan Bio-Med is essentially propelling our biological and medical tech and machines to levels which will extend the average lifespan another 20 years hopefully. Prothstetics, enhancements in genetic engineering as a whole would allow older people to stay healthier and stronger despite their age. We hope to be like an umbrella and truly cover our citizens in a new age of bio-medical innovations."
 FIJ_focus_naval_innovations: "Naval Innovations"
 FIJ_focus_naval_innovations_desc: "Our military is more than just the army, a dedicated internal department dedicated to naval innovations is the only way Fiji can rule her national waters."
 FIJ_focus_expansion_of_welfare_programs: "Expansion Of Welfare Programs"
 FIJ_focus_expansion_of_welfare_programs_desc: "Diversifying our types of welfare programs will allow for a variety of attentive care towards a number of constant problems which persist within the new age."
 FIJ_focus_research_plan_synthetic: "Research Plan Synthetic"
 FIJ_focus_research_plan_synthetic_desc: "Plan Synthetic is a wholesale approach to refining our synthetics program which will allow us to conjure a domestic supply of rubber like products. At the cost of limited rubber imports and increased research investments we can expect some boost to our general economic and societal matrixes due to this additional supply of resources. Another step we take..."
 FIJ_focus_civilian_corp_of_engineers: "Civilian Corps Of Engineers"
 FIJ_focus_civilian_corp_of_engineers_desc: "The CCE is a civilian extension of the Fijian Corps of Engineers. The point is to make a distinction and prioritize civil and military works projects. However these two groups can unify if the need arises which will have some indirect military applications."
 FIJ_focus_research_plan_autarky: "Research Plan Autarky"
 FIJ_focus_research_plan_autarky_desc: "Through years of extensive research, planning and investments we have finally achieved a real breakthrough. One which solidifies our economic autarky to the practically fullest extent. We can now achieve anything, the stars may even not be the limit anymore."
 FIJ_focus_research_plan_feast: "Research Plan Feast"
 FIJ_focus_research_plan_feast_desc: "To sustain our growth as a species and a society we must provide the very basics of living. One key basic is food, this key will ensure societal stability, population growth and a soft power advancement over most nations. We can find ways to essentially grow targeted foreign aid and lead the world in tackling poverty and food insecurities. Fiji will become a cornerstone to global unity."
 FIJ_focus_research_plan_nucleus: "Research Plan Nucleus"
 FIJ_focus_research_plan_nucleus_desc: "The future is truly now. So many advancements have been made in nuclear engineering that its pathetic the advancements in fearmongering tactics still prevail a disgusting disregard of the obvious realities of energy production. Therefore we will, of course at a major cost, will set the new global standard of how to truly build a nuclear reactor. One which is efficient, effective and one which will likely produce more than the serviceable area it controls. We set this true and safest standard we could put to shame any nation with a shoddy past in terms of nuclear power. For Technocracy, The Future Our Species Needs, But Somehow Seems To Not Want."