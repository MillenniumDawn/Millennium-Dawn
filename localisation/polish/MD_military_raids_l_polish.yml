 MD_raid.18.t: "[FROM.GetName] Wystosowuje nuklearne ultimatum"
 MD_raid.18.d: "Rząd [FROM.GetName] ostrzegł, że dalsze postępy na jego terytorium spotkają się z pełnym uderzeniem nuklearnym. Przedstawiciele władz w [FROM.capital.GetCapitalVictoryPointName] zapewniają, że nie jest to blef, a nasze siły otrzymały rozkaz przygotowania się na ewentualny odwet nuklearny."
 MD_raid.18.a: "Nie odważyliby się."