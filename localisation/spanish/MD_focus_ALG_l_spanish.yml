 alg_deep_state.107.a: "Reward commanders loyal to the state."
 alg_deep_state.107.b: "Let the deep state manage promotions."
 alg_deep_state.108.a: "Accept discreet foreign assistance."
 alg_deep_state.108.b: "Refuse any foreign interference."
 alg_deep_state.200.a: "The military now controls Algeria."
 alg_deep_state.201.a: "Attempt to resist the coup!"
 alg_deep_state.201.b: "Accept military rule - resistance is futile."
 alg_deep_state.210.a: "The new order is established."
 alg_deep_state.211.a: "Ignore the criticism."
