 varyag_offer_lapsed_tt: "§RПредложение утратило силу.§! Условия соглашения изменились."
 varyag_buyback_tt: "§Y[CHI.GetNameWithFlag]§! получает возмещение в £treasury §R0.20§! млрд. §Y[TUR.GetNameWithFlag]§! получает £treasury §R0.50§! млрд за обратную буксировку. §Y«Варяг»§! §Gвозвращается§! в §YНиколаев§!, а отношения с §Y[CHI.GetNameWithFlag]§! §Rухудшаются§!."
 varyag_joint_offer_tt: "Если §Y[UKR.GetNameWithFlag]§! согласится, мы получим §Gкорпус и бонус к исследованиям§!. Мы платим §Y[UKR.GetNameWithFlag]§! £treasury §R2.50§! млрд и возмещаем §Y[CHI.GetNameWithFlag]§! £treasury §R0.20§! млрд."
