 problem_with_the_boats_desc: "Des manifestations ont éclaté à travers le pays, notre police est débordée et les contre-manifestations ont dégénéré en émeutes. En conséquence, les groupes politiques de droite jouissent d'une hausse de soutien, et avec les médias, continuent de jeter de l'huile sur le feu. \n\n§RLes fissures commencent à se voir.§!"
