 SOV_gru_spetznaz: "GRU Spetsnaz"
 SOV_gru_spetznaz_desc: "The General Staff's own special forces get new brigades, new gear and orders that do not pass through the Lubyanka. Their instructors work in foreign capitals long before any war begins."
