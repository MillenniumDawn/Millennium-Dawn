 SOV_capitalisation_idea_tt: "[SOV_MoexStatus_loc][SOV_CapGazprom_loc][SOV_CapRosneft_loc][SOV_CapSberbank_loc][SOV_CapVtb_loc][SOV_CapMts_loc][SOV_CapAlrosa_loc][SOV_SphereIntegration_loc]"
 SOV_MoexStatus_loc1: "£text_icon_sov_ruble §Y모스크바 거래소§!: §R폐쇄§!\n상장 기업들이 §R국유화§!되었습니다. 시가총액은 동결되었으며 시장은 더 이상 우리 경제에 기여하지 않습니다.\n"
 SOV_MoexStatus_loc2: "£text_icon_sov_ruble §Y모스크바 거래소§!: §R정지§!\n거래가 중단되었습니다. 거래가 재개될 때까지 시가총액은 변하지 않습니다.\n"
 SOV_MoexStatus_loc3: "£text_icon_sov_ruble §Y모스크바 거래소§!: §R정지§!\n종속국인 우리는 자체 거래소를 운영하지 않습니다. 시가총액은 동결됩니다.\n"
 SOV_MoexStatus_loc4: "£text_icon_sov_ruble §Y모스크바 거래소§!: §G개장§!\n시가총액은 매월 재평가됩니다. 기업의 평가액이 높을수록 지급되는 보너스도 커집니다.\n"
 SOV_CapGazprom_loc1: "\n£text_icon_sov_gazprom §g가스프롬§!\n§Y시가총액§!: $§G[?SOV.SOV_capitalisation_gazprom|1]§! 십억 (지난달 §Y[?SOV.SOV_cap_delta_gazprom|2]§!)\n§Y시장 프리미엄§!: 최대치의 §G[?SOV.SOV_cap_ramp_gazprom|%0]§!, $ 250억에서 최대치 도달\n§Y자원 부문 GDP§! 창출: 최대 §G+3.00%§!\n£resource_export_multiplier_modifier_texticon §Y화석 연료 수출 수입§! 배수: 최대 §G+3.00%§!\n£corporate_tax_income_multiplier_modifier_texticon §Y법인세 수입§! 배수: 최대 §G+3.00%§!\n"
 SOV_CapRosneft_loc1: "\n£text_icon_sov_rosneft §g로스네프트§!\n§Y시가총액§!: $§G[?SOV.SOV_capitalisation_rosneft|1]§! 십억 (지난달 §Y[?SOV.SOV_cap_delta_rosneft|2]§!)\n§Y시장 프리미엄§!: 최대치의 §G[?SOV.SOV_cap_ramp_rosneft|%0]§!, $ 250억에서 최대치 도달\n§Y자원 부문 GDP§! 창출: 최대 §G+2.00%§!\n£resource_export_multiplier_modifier_texticon §Y화석 연료 수출 수입§! 배수: 최대 §G+4.00%§!\n£corporate_tax_income_multiplier_modifier_texticon §Y법인세 수입§! 배수: 최대 §G+3.00%§!\n"
 SOV_CapRosneft_loc2: "\n£text_icon_sov_rosneft §g로스네프트§!\n이 기업은 상장되어 있으나 §R거래 가능한 자산을 보유하고 있지 않습니다§!. 시가총액은 §Y유코스§!의 자산을 흡수한 이후에야 변동하기 시작합니다.\n"
 SOV_CapSberbank_loc1: "\n£text_icon_sov_sberbank §g스베르§!\n§Y시가총액§!: $§G[?SOV.SOV_capitalisation_sberbank|1]§! 십억 (지난달 §Y[?SOV.SOV_cap_delta_sberbank|2]§!)\n§Y시장 프리미엄§!: 최대치의 §G[?SOV.SOV_cap_ramp_sberbank|%0]§!, $ 250억에서 최대치 도달\n£research_speed_texticon  연구 속도: 최대 §G+3.00%§!\n£corporate_tax_income_multiplier_modifier_texticon §Y법인세 수입§! 배수: 최대 §G+3.00%§!\n£economic_cycles_cost_factor_texticon 경기 순환 변경 비용: 최대 §G-3.00%§!\n£education_cost_multiplier_modifier_texticon §Y교육 비용§! 배수: 최대 §R+5.00%§!\n"
 SOV_CapSberbank_loc2: "\n£text_icon_sov_sberbank §g스베르방크§!\n아직 §R국영 저축은행§!입니다. 상업 대출 기관으로 구조조정되기 전까지는 거래소에서 평가되지 않습니다.\n"
 SOV_CapVtb_loc1: "\n£text_icon_sov_vtb §gVTB 은행§!\n§Y시가총액§!: $§G[?SOV.SOV_capitalisation_vtb|1]§! 십억 (지난달 §Y[?SOV.SOV_cap_delta_vtb|2]§!)\n§Y시장 프리미엄§!: 최대치의 §G[?SOV.SOV_cap_ramp_vtb|%0]§!, $ 250억에서 최대치 도달\n£corporate_tax_income_multiplier_modifier_texticon §Y법인세 수입§! 배수: 최대 §G+3.00%§!\n£economic_cycles_cost_factor_texticon 경기 순환 변경 비용: 최대 §G-3.00%§!\n"
 SOV_CapVtb_loc2: "\n£text_icon_sov_vtb §gVTB 은행§!\n§R아직 상장되지 않음§!. 주식이 일반에 공개되기 전까지 이 은행은 시장 프리미엄을 지급하지 않습니다.\n"
 SOV_CapMts_loc1: "\n£text_icon_sov_mts §gMTS§!\n§Y시가총액§!: $§G[?SOV.SOV_capitalisation_mts|1]§! 십억 (지난달 §Y[?SOV.SOV_cap_delta_mts|2]§!)\n§Y시장 프리미엄§!: 최대치의 §G[?SOV.SOV_cap_ramp_mts|%0]§!, $ 250억에서 최대치 도달\n£corporate_tax_income_multiplier_modifier_texticon §Y법인세 수입§! 배수: 최대 §G+3.00%§!\n§Y$internet_station$§! 건설 속도: 최대 §G+3.00%§!\n"
 SOV_CapAlrosa_loc1: "\n£text_icon_sov_alrosa §g알로사§!\n§Y시가총액§!: $§G[?SOV.SOV_capitalisation_alrosa|1]§! 십억 (지난달 §Y[?SOV.SOV_cap_delta_alrosa|2]§!)\n§Y시장 프리미엄§!: 최대치의 §G[?SOV.SOV_cap_ramp_alrosa|%0]§!, $ 100억에서 $ 250억 구간에 걸쳐 적용\n£resource_export_multiplier_modifier_texticon §Y귀금속 수출 수입§! 배수: 최대 §G+2.00%§!\n£corporate_tax_income_multiplier_modifier_texticon §Y법인세 수입§! 배수: 최대 §G+2.00%§!\n"
