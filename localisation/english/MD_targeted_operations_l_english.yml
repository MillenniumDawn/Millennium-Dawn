 TOP_open_tt: "Open named-person dossiers alongside counterterrorism organization intelligence."
 TOP_select_tt: "Select this person's dossier. Changing the displayed dossier does not change an authorized operation."
 TOP_collect_tt: "Spend 25 Political Power to maintain collection on this designated person. Each target country can have one case; cases in different countries collect independently. Counterterrorism intelligence and infiltration help, while failed attempts and hostile counterintelligence hinder collection. No intelligence DLC is required."
 TOP_stop_tt: "End collection for the displayed case. Other countries' cases continue. Confidence declines without fresh leads."
 TOP_drone_tt: "Submit this exact person and lead state for approval of a native map drone operation."
 TOP_capture_tt: "Submit a special-forces operation to capture this person alive. Native raids require trained special forces and suitable basing."
 TOP_covert_tt: "Submit a deniable operation for intelligence and senior authorization review. Requires decryption capability and a foreign host, except the explicit domestic emergency mandate. Exposure can still produce political consequences."
 TOP_rendition_tt: "Submit a capture and custody operation. Requires a foreign host and special-forces capability. Capture feasibility, sovereignty, and political authority are reviewed."
 TOP_partner_tt: "Request a partner-led capture operation. The host may refuse to cooperate. Requires a foreign host and its consent."
 TOP_sabotage_tt: "Submit disruption of the identified facility for approval. Requires a foreign state and an existing facility of the selected type. A successful operation damages the recorded facility."
 TOP_revoke_tt: "Close the case for [TOP_authorized_name] or revoke its standing mandate and timed mission. An assessment must be confirmed before its country slot is freed. Native map cancellation alone leaves authority active. Renewing the identical open person, method, and state preserves preparation. Once closed, a native person/method/state binding cannot be reused; develop a lead in another state or select another method. Fees are not refunded."
 TOP_release_tt: "Release this prisoner. Before Iraq's hunt is complete, a released fugitive no longer counts as securely detained."
 TOP_transfer_tt: "Transfer this prisoner to the existing host government. Custody remains recorded, and Iraq's hunt retains credit."
 TOP_refresh_tt: "Refresh the dossier and archive from the latest recorded intelligence."
 TOP_location_actionable: "Last credible lead: [?TOP_lead_state^TOP_selected.GetName]"
 TOP_location_region: "Probable host: [?TOP_lead_host^TOP_selected.GetName]. Exact state unconfirmed."
 TOP_dossier_body: "§Y[TOP_selected_name]§!\n[TOP_selected_group] | [TOP_selected_role]\n[TOP_selected_status] | [TOP_case_stage]\nConfidence: [?TOP_confidence^TOP_selected|0]% | Lead age: [?TOP_lead_age^TOP_selected|0] days\n[TOP_selected_location]\nAttempts: [?TOP_attempts^TOP_selected|0] | Custody: [TOP_selected_custody]"
 TOP_authorization_body: "§Y[TOP_selected_name]§! | [TOP_case_stage]\n[TOP_selected_status] | [TOP_selected_location]\n[TOP_current_authority]\n[TOP_current_review]"
 TOP_archive_help: "§YOperations Archive§!\nThe most recent 128 entries are retained. Day numbers count from the campaign's counterterrorism initialization. Lifetime attempts remain on each dossier. Assessment updates report the recorded outcome."
 TOP_row_intel: "[?TOP_confidence^v|0]% confidence\nLead [?TOP_lead_age^v|0]d ago"
 TOP_archive_row: "Day [?TOP_archive_day^v|0]: [TOP_archive_name]\n[TOP_archive_status]"
 TOP_sovereignty_violation: "Unauthorized Covert Operation"
 TOP_custody_none: "None known"
