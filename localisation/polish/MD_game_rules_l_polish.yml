 RULE_ALLOW_ENABLE_LEDGER_NO_DESC: "Wyłącza księgę MD. Jest to lepsze dla użytkowników, którzy preferują bardziej autentyczne doświadczenia i chcą wykorzystać La Resistance do uzyskania kluczowych informacji."
 RULE_ALLOW_HELP_GUI: "Włącz graficzny interfejs pomocy MD"
