 israel.coalition.12.a: "Ah, droga!"
 israel.coalition.13.t: "Colapso do Governo!"
 israel.coalition.13.d: "Nossos parceiros deixaram a coalizão em massa, levando a uma crise política e ao colapso do governo. Teremos que realizar eleições novamente."
 israel.coalition.13.a: "Crise política..."
 israel.knesset.0.t: "Projeto de lei é enviado ao Knesset"
 israel.knesset.0.d: "Apresentamos o projeto ao Knesset. Ele agora está sendo analisado pela comissão competente. Em breve será apresentado aos parlamentares e levado à votação."
 israel.knesset.0.a: "Desejem-nos sorte!"
 israel.knesset.1.t: "A mídia criticou nosso projeto!"
 israel.knesset.1.d: "Houve artigos em vários veículos de mídia criticando ferozmente nosso projeto. Alguns veículos o chamam de desumano, outros chamam os autores do projeto de \"Burros Analfabetos\". Como resultado, alguns parlamentares de nossa facção se recusaram a votar a favor de nosso projeto."
 israel.knesset.1.a: "São burros de verdade aqui!"
 israel.knesset.2.t: "A mídia apoiou nosso projeto!"
 israel.knesset.2.d: "Houve artigos em vários veículos de mídia apoiando nosso projeto. Muitos veículos falam positivamente do projeto e pedem a todos os parlamentares que votem a favor. Ouvimos rumores de que membros das facções da oposição estão pensando em apoiar o projeto."
 israel.knesset.2.a: "Que surpresa!"
 israel.knesset.3.t: "Discussão dentro da Coalizão"
 israel.knesset.3.d: "Nossos parceiros de coalizão nos apresentaram um pacote de emendas ao projeto. Elas incluem um grande número de mudanças que acreditam que beneficiarão seu eleitorado e o nosso Estado. Se não as implementarmos, nossos parceiros talvez não votem a favor de nosso projeto e desestabilizarão nossa coalizão."
 israel.knesset.3.a: "Vamos implementá-las!"
 israel.knesset.3.b: "Nosso projeto, nossas regras!"
 israel.knesset.4.t: "Análise da Comissão"
 israel.knesset.4.d: "A Comissão analisou nosso projeto e, embora seus membros o tenham aprovado por maioria, os membros da oposição na comissão nos pediram para fazer emendas adicionais à lei e levar em conta todas as observações que fizeram. Isso poderia tornar o projeto mais atraente para as facções opostas, mas nosso eleitorado e nosso partido podem ficar insatisfeitos com o projeto."
 israel.knesset.4.a: "Façam as mudanças."
 israel.knesset.4.b: "Nosso projeto já é perfeito."
 israel.knesset.5.t: "Moção aprovada!"
 israel.knesset.5.d: "Na votação final, nosso projeto foi aprovado pela maioria dos parlamentares; assim que for sancionado pelo presidente, nossa lei será oficialmente implementada."
 israel.knesset.5.a: "Conseguimos!"
 israel.knesset.6.t: "Moção rejeitada!"
 israel.knesset.6.d: "Na votação final, nosso projeto não obteve a maioria dos votos dos parlamentares. Poderemos tentar na próxima vez."
 israel.knesset.6.a: "Ah, não..."
 israel.knesset.7.t: "Negócios Escusos"
 israel.knesset.7.d: "Na votação final, não seria má ideia ter alguns votos a mais. Poderíamos oferecer um pequeno auxílio financeiro a uma pequena facção parlamentar e obter seu apoio."
 israel.knesset.7.a: "Deem a eles o que querem."
 israel.knesset.7.b: "Não precisamos dos votos deles."
 israel.knesset.8.t: "Escândalo de Corrupção!"
 israel.knesset.8.d: "A imprensa obteve imagens de câmera do líder da facção parlamentar do nosso partido entregando uma maleta de dinheiro a parlamentares de outra facção. Embora a mídia não tenha descoberto informações sobre a transação em si, isso terá um forte impacto na popularidade do nosso partido e do partido do nosso parceiro."
 israel.knesset.8.a: "Desgraçados!"
 israel_economy.173.t: "Israel revoga a remoção da zona desmilitarizada do Sinai!"
 israel_economy.173.d: "O governo israelense, considerando todas as recentes ações diplomáticas positivas, decidiu emendar a remoção do status de zona desmilitarizada do Sinai. Finalmente, mesmo antes de tempos de guerra, nossas tropas podem entrar naquela região."
 israel_economy.173.a: "Ótimo!"
 ISR_egy_surveillance_drones: "Apoio de Drones Israelense"
 israel_economy.174.t: "Israel fornece vigilância por drones!"
 israel_economy.174.d: "O governo israelense decidiu fornecer vigilância com seus drones perto de nossa fronteira, para que possamos combater com mais eficácia os insurgentes salafistas no Sinai!"
 israel_economy.174.a: "Obrigado!"
 israel_economy.174.b: "Não precisamos da sua ajuda!"
 israel_economy.175.t: "O Egito aceita!"
 israel_economy.175.d: "Eles aceitaram nossa oferta. Forneceremos a eles vigilância com nossos drones."
 israel_economy.175.a: "Ótimo!"
 israel_economy.176.t: "O Egito rejeita!"
 israel_economy.176.d: "Eles se recusaram a aceitar nosso apoio. Dizem que podem fazer isso sozinhos."
 israel_economy.176.a: "O quê?"
 jordanian_waqf_authprity: "Waqf Jordaniano"
 saudi_waqf_authprity: "Waqf Saudita"
 ISR_jordan_waqf_slek: "Waqf Jordaniano"
 ISR_jordan_waqf_slek_desc: "Desde a Guerra dos Seis Dias (e isso foi solidificado no Tratado de Paz de Arava de 1994), as autoridades religiosas jordanianas (Waqf) mantêm a suserania sobre a administração e o funcionamento da Mesquita de Al-Aqsa e do Complexo do Monte do Templo."
 ISR_saud_waqf_slek: "Waqf Saudita"
 ISR_saud_waqf_slek_desc: "Após várias discussões, o governo israelense transferiu a autoridade sobre Al-Aqsa para a Arábia Saudita."
 israel_economy.177.t: "Israel expulsa nosso Waqf!"
 israel_economy.177.d: "Recentemente, o governo israelense decidiu expulsar nossa autoridade Waqf da Mesquita de Al-Aqsa e do Complexo do Monte do Templo. Não surpreendentemente, decidiram nem sequer entregá-lo ao patrocínio de outro país muçulmano, mas geri-lo eles mesmos."
 israel_economy.177.a: "Eles são loucos?"
 israel_economy.178.t: "Israel nomeia a Arábia Saudita para a Autoridade de Al-Aqsa!"
 israel_economy.178.d: "Recentemente, o governo israelense decidiu expulsar a autoridade Waqf da Jordânia da Mesquita de Al-Aqsa e do Complexo do Monte do Templo. Agora, a Arábia Saudita o administrará e seu clero controlará o local."
 israel_economy.178.a: "Mudanças estão por vir."
 ISR_jor_isr_treaty: "Expansão do Tratado de Arava"
 israel_economy.179.t: "Israel propõe a Expansão do Tratado de Arava"
 israel_economy.179.d: "Recentemente, autoridades do governo israelense nos procuraram para propor a expansão do tratado de Arava, que já aceitamos no passado. Essa nova expansão do tratado permitirá que nossos governos realizem projetos econômicos conjuntos. Devemos concordar?"
 israel_economy.179.a: "Claro!"
 israel_economy.156.b: "[Root.GetName] não tem nada a procurar lá."
 israel_economy.180.t: "A Jordânia aceita!"
 israel_economy.180.d: "Eles concordaram com a expansão do nosso tratado!"
 israel_economy.180.a: "Ótimo!"
 israel_economy.181.t: "A Jordânia rejeita!"
 israel_economy.181.d: "Eles recusaram a expansão do nosso tratado."
 israel_economy.181.a: "Muito lamentável."
 israel_economy.182.t: "Israel propõe o Projeto de Preservação do Mar Morto!"
 israel_economy.182.d: "Israel propõe um novo projeto conjunto para salvar o Mar Morto. Não exige muito dinheiro e, no entanto, beneficiará a ambos."
 israel_economy.182.a: "Concordamos!"
 israel_economy.182.b: "Não."
 israel_economy.183.t: "A Jordânia aceita!"
 israel_economy.183.d: "A Jordânia aceitou investir no projeto conjunto de preservação do Mar Morto!"
 israel_economy.183.a: "Ótimo!"
 israel_economy.184.t: "A Jordânia rejeita!"
 israel_economy.184.d: "A Jordânia recusou investir no projeto conjunto de preservação do Mar Morto!"
 israel_economy.184.a: "Affe."
 ISR_jor_water_share: "Acordo de Recursos Hídricos do Mar Morto"
 israel_economy.185.t: "Israel propõe acordo de recursos hídricos do Mar Morto!"
 israel_economy.185.d: "Recentemente, Israel propôs um novo acordo pelo qual nossas necessidades agrícolas e outras serão plenamente atendidas com água do Mar Morto. Devemos concordar?"
 israel_economy.185.a: "Claro!"
 israel_economy.185.b: "Não."
 israel_economy.186.t: "A Jordânia aceita!"
 israel_economy.186.d: "A Jordânia aceitou nossa proposta e começaremos a entregar água do Mar Morto a eles."
 israel_economy.186.a: "Ótimo!"
 israel_economy.187.t: "A Jordânia recusa!"
 israel_economy.187.d: "Eles não querem comprar água do nosso país."
 israel_economy.187.a: "Muito lamentável."
 ISR_solar_farms: "Fazendas Solares"
 israel_economy.188.t: "Israel propõe o Acordo Verde-Azul!"
 israel_economy.188.d: "O Acordo Verde-Azul para o Oriente Médio é uma iniciativa ousada para promover a segurança climática e a paz regional. Israel propõe construir painéis solares em nosso país, tal como já fez para si mesmo. Devemos concordar?"
 israel_economy.188.a: "Claro!"
 israel_economy.188.b: "Desculpe, não."
 israel_economy.189.t: "[FROM.GetNameWithFlag] concorda!"
 israel_economy.189.d: "Construiremos 3 fazendas de painéis solares para eles."
 israel_economy.189.a: "Ótimo!"
 israel_economy.190.t: "[FROM.GetNameWithFlag] rejeita!"
 israel_economy.190.d: "Eles não querem participar do projeto."
 israel_economy.190.a: "Muito lamentável."
 ISR_jor_attack_idea: "Plano de Inundação da Jordânia"
 israel_economy.191.t: "Assassinato de herdeiro hachemita!"
 israel_economy.191.d: "Recentemente, perpetradores desconhecidos assassinaram um dos herdeiros da dinastia hachemita. A bomba foi plantada sob seu carro, quando ele estava prestes a deixar o palácio. Muitas autoridades na Jordânia apontam que a Al-Qaeda pode estar por trás deste ataque."
 israel_economy.191.a: "Interessante."
 ISR_jor_unloyal_mil_idea: "Rumores de Militares Desleais"
 israel_economy.192.t: "Conspiração nas Forças Armadas!"
 israel_economy.192.d: "Rumores recentes se espalharam sobre uma possível conspiração de golpe contra o governo da Jordânia nas forças armadas. Supostamente, por meio de várias fontes de renda, uma potência estrangeira está subornando muitos generais jordanianos para se levantarem em algum momento que lhes seja conveniente. A Jordânia deve lidar com a influência estrangeira antes que seja tarde demais."
 israel_economy.192.a: "Está esquentando."
