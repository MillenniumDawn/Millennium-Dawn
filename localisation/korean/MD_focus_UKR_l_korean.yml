 UKR_repair_slots_expand_desc: "\n\n\n\n\n\n£UKR_desctext_strategic_aviation_narp\n\n\n\n\n\n\n\n\nNARP 공장의 조립 라인 수를 늘리도록 자금을 지원해, 동시에 수리할 수 있는 항공기 수를 §C1§!대 늘려 최대 §C6§!대까지 확대합니다."
