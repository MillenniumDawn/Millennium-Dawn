l_english:

 # American OEM and Defense-Tech Industry Events
 USA_oem_events.1.t: "A New Contractor Class"
 USA_oem_events.1.d: "The intelligence community is looking beyond traditional defense suppliers for software that can merge scattered databases into usable counterterrorism leads. Venture-backed firms argue that the old procurement cycle cannot keep pace with the threat environment."
 USA_oem_events.1.a: "Back the data-fusion firms"
 USA_oem_events.1.b: "Keep procurement conventional"
 USA_oem_events.2.t: "The Seeing Stone"
 USA_oem_events.2.d: "A small group of analysts and engineers has presented a platform designed to connect government datasets without forcing every agency onto the same system. Supporters see a breakthrough in counterterrorism work, while critics see the outline of a permanent surveillance architecture."
 USA_oem_events.2.a: "Expand counterterror data fusion"
 USA_oem_events.2.b: "Require oversight from the start"
 USA_oem_events.3.t: "Privacy Advocates Mobilize"
 USA_oem_events.3.d: "Civil-liberties groups are pressing Congress to examine how federal agencies use private analytics platforms. The dispute has turned a quiet procurement question into a public debate over privacy, security, and democratic accountability."
 USA_oem_events.3.a: "Open congressional hearings"
 USA_oem_events.3.b: "Defend the program"
 USA_oem_events.4.t: "A Bridge to Silicon Valley"
 USA_oem_events.4.d: "Defense officials want a dedicated channel for commercial firms working in autonomy, software, sensors, and data analysis. The proposal promises faster prototypes, but legacy contractors warn that speed can become waste without disciplined acquisition rules."
 USA_oem_events.4.a: "Empower the innovation unit"
 USA_oem_events.4.b: "Keep the primes in charge"
 USA_oem_events.5.t: "Prototype to Production"
 USA_oem_events.5.d: "Several commercial prototypes have impressed field commands, but their path into full production remains uncertain. Congress, the services, and the prime contractors now have to decide whether the new model is an experiment or a procurement lane."
 USA_oem_events.5.a: "Fast-track promising prototypes"
 USA_oem_events.5.b: "Route them through prime review"
 USA_oem_events.6.t: "Autonomy Enters Procurement"
 USA_oem_events.6.d: "A new generation of defense startups is offering autonomous towers, drones, and battlefield software as integrated systems. Their pitch is simple: cheaper sensors, faster iteration, and less dependence on crewed platforms."
 USA_oem_events.6.a: "Support autonomous defense startups"
 USA_oem_events.6.b: "Keep autonomy prime-led"
 USA_oem_events.7.t: "The Primes Push Back"
 USA_oem_events.7.d: "Major defense manufacturers are warning lawmakers that software-first procurement risks fragile supply chains and untested vendors. The startups counter that the old arsenal is too slow for modern competition."
 USA_oem_events.7.a: "Mandate open standards"
 USA_oem_events.7.b: "Preserve legacy contracting power"
 USA_oem_events.8.t: "The AI Arsenal"
 USA_oem_events.8.d: "Defense-tech firms are proposing an integrated stack that combines battlefield data, autonomous systems, and artificial intelligence. Advocates call it necessary modernization; skeptics worry about accountability, escalation, and vendor lock-in."
 USA_oem_events.8.a: "Accelerate the AI defense stack"
 USA_oem_events.8.b: "Create a review board"
 USA_oem_events.9.t: "Congress Demands Guardrails"
 USA_oem_events.9.d: "Lawmakers are demanding clearer rules for artificial intelligence, surveillance contracts, and autonomous systems. The administration can accept durable oversight or preserve wider discretion for urgent procurement."
 USA_oem_events.9.a: "Codify procurement oversight"
 USA_oem_events.9.b: "Protect executive discretion"
