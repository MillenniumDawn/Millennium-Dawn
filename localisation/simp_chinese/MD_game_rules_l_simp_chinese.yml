 RULE_OPTION_SWE_PRO_WESTERN: "向西"
 RULE_OPTION_SWE_PRO_WESTERN_AI_DESC: "瑞典放弃了两个世纪以来的不结盟政策，加入北约，并成为欧盟的核心成员。波罗的海成为盟国的领地，俄罗斯的北部通道被封锁。"
 RULE_OPTION_SWE_RED_SWEDEN: "瑞典共和国"
 RULE_OPTION_SWE_RED_SWEDEN_AI_DESC: "瑞典左翼彻底掌控了瑞典议会，废除了君主制，宣布成立共和国。福利国家体制超越了社会民主主义，走向公有制，瑞典不再是任何国家的中立模式。"
