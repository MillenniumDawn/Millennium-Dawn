 UKR_security_start_desc: "Our country is huge and therefore needs strong internal protection, we will begin financing and reforming our government structures."
 UKR_sbu_start: "SBU 개혁"
 UKR_sbu_start_desc: "우크라이나 보안국은 심층적인 개혁과 효율성 증대가 필요합니다."
 UKR_sbu_t: "\\"T\\" 총국"
 UKR_sbu_t_desc: "우크라이나 보안국은 국가 체제를 훼손하고, 우크라이나의 독립을 소멸시키며, 헌법 질서를 무력으로 바꾸고, 국가의 주권과 영토 보전을 침해하며, 국가 안보를 해치고, 국가 권력을 불법적으로 찬탈하며, 전쟁과 폭력을 선전하고, 민족 간·인종 간·종교 간 및 기타 적대감을 선동하고, 인권과 자유를 침해하는 것을 목적으로 하는 조직과 개인에 대응하는 분야에서 국가 정책을 시행합니다.\n\n또한 국가의 핵심 이익과 우크라이나 시민의 안전에 직접적인 위협이 되며 우크라이나 보안국의 관할에 속하는 범죄 및 기타 불법 행위의 예방, 적발, 진압을 수행하고 이 분야의 범죄 예방을 시행합니다."
 UKR_sbu_corrupt: "\\"K\\" 총국"
 UKR_sbu_corrupt_desc: "우크라이나 보안국은 \\"부패 및 조직범죄 척결의 조직적·법적 기초에 관한 우크라이나 법률(1993년 6월 30일자 제3341-XII호)\\"에 따라 부패 및 조직범죄 척결의 임무를 맡고 있습니다.\n\n이 분야에서 활동할 권한이 있는 국가 기관 중 하나가 우크라이나 보안국 부패·조직범죄 대응 총국(GU \\"K\\")입니다."
 UKR_sbu_contr: "군 방첩 총국"
 UKR_sbu_contr_desc: "군 방첩 기관은 우크라이나군, 우크라이나 국가 국경수비대 및 우크라이나 영토에 주둔하는 기타 군사 조직의 방첩 지원을 위해 창설되었습니다.\n\n우크라이나 보안국의 군 방첩 기관 체계는 군 방첩 총국, 방첩국의 일부로서 각 지역에 있는 기관(부서), 작전·지역·영토 사령부(총국), 군단, 개별 부대 및 편제에 있는 군 방첩 작전 부서로 구성됩니다."
 UKR_sbu_svr: "대외정보국"
 UKR_sbu_svr_desc: "우크라이나 대외정보국(SZRU)은 우크라이나 정부의 정보 기관입니다. 정치, 경제, 군사, 과학기술 정보 및 생태 분야에서 정보 활동을 수행하며 우크라이나 대통령에게 직접 예속됩니다."
 UKR_sbu_sviaz_desc: "데르자브스페츠비야즈쿠(Derzhspetszv'yazku)라고도 알려진 우크라이나 국가특수통신국은 보안 정부 통신, 정부 문서 송달 업무, 정보 보호 및 사이버 방어를 핵심 기능으로 하는 전문 행정 기관입니다."
 UKR_sbu_alpha: "알파"
 UKR_sbu_alpha_desc: "우크라이나 보안국 특수작전센터의 \\"A\\" 그룹은 우크라이나 보안국의 특수 부대입니다. 공식 명칭은 \\"군 부대 E6117\\"입니다."
 UKR_sbu_administration: "민군 행정부"
 UKR_sbu_administration_desc: "민군 행정부는 전투 지역에 인접한 영토에 설치되는 우크라이나의 임시 국가 기관입니다."
 UKR_peacemakers: "평화유지 프로그램"
 UKR_peacemakers_desc: "우리나라는 언제나 전 세계의 평화유지 임무에 참여하고자 해 왔으며, 이 전통을 계속 이어갈 것입니다."
 UKR_border_guard: "국가 국경수비대"
 UKR_border_guard_desc: "우크라이나 국가 국경수비대는 우크라이나의 국경 경비 기관입니다. 우크라이나 헌법에 따라 군사 조직으로 편성된 독립적인 법 집행 기관이며, 그 수장은 우크라이나 대통령에게 예속됩니다."
 UKR_reform_vv: "내무군 개혁"
 UKR_reform_vv_desc: "우리 내무군은 출범 이래 국가 기구의 위계 속에서 불분명한 지위를 가져 왔으며, 이를 바로잡을 때입니다."
 UKR_finance_vv: "특수 대대 재정 지원"
 UKR_finance_vv_desc: "내무군 특수 대대의 활동에 자금을 지원할 것입니다. 앞으로 이들이 우리에게 매우 유용할 수도 있습니다."
 UKR_sbu_white_wolves: "백색 늑대 대대"
 UKR_sbu_white_wolves_desc: "SBU는 소속 직원들로 구성된 대대를 전쟁에 파견할 것입니다."
 UKR_border: "국가 국경수비대"
 UKR_border_desc: "우리의 국경은 너무 넓어서 군의 개별 부대에 의존해 지킬 수 없습니다. 국경 부대가 이 임무를 더 효율적으로 수행할 것입니다."
