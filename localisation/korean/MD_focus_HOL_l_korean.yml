 HOL_nato_not_active_key1: "수십 년 동안 네덜란드는 군사 장비와 병참 지원을 외국에 의존해 왔습니다. 이러한 의존은 우리 군이 독자적으로 기능할 수 없게 만들었고, 현대적 위협 앞에서 위험한 취약점이 되었습니다."
 HOL_nato_active_key1: "네덜란드는 강력한 국제 파트너십의 혜택을 누리고 있지만, 군사 장비와 물자는 여전히 외국 동맹국에 크게 의존하고 있습니다. 이러한 의존은 우리의 독립성을 제한하며, 관계가 악화될 경우 상당한 위험이 됩니다."
 HOL_nato_not_active_key2: "자급자족 가능한 군수 생산의 부재는 심각한 상황을 초래했습니다. 장비 부족과 운용상의 결함은 우리 군의 준비태세를 위협하고 있으며, 네덜란드는 장기전이나 대규모 분쟁에 취약한 상태입니다."
 HOL_nato_active_key2: "우리 군은 장비와 물자를 외부 지원에 심각하게 의존하고 있습니다. 위기 시에는 이러한 의존이 장기 작전을 지속하거나 국익을 효과적으로 방어할 우리의 능력을 약화시킵니다."
 HOL_nato_not_active_key3: "§R의존적인 군대로 전쟁에 돌입하면 우리 육군의 역량이 크게 약화됩니다§!"
 HOL_nato_active_key3: "§R의존적인 군대로 나토의 지원을 떠나면 우리 육군의 역량이 크게 약화됩니다.§!"
