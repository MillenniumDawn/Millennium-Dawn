 BOS_civilian_training: "Expand Reserve Training"
 BOS_rifle_advancements: "Advance Service Rifles"
 BOS_post_war_clean_up: "Postwar Cleanup"
 BOS_land_mines: "Minas Terrestres"
 BOS_dayton_accords: "Acordos de Dayton"
 BOS_land_mine_removal_efforts: "Esforços de remoção de minas terrestres"
 bos_fed: "Federação Bósnia"
 bos_fed2: "República Federal Bósnia"
 hzg_fed: "Federação Herzegovina"
 rsk_fed: "Federação Srpska"
 bos_srpska_colour_change3: "Maior Srpska"
 bos_war_civil_war: "A Guerra Civil Bósnia"
 event_chain_will_fire: "A sequence of strikes and political confrontations will test whether organized labor can replace the existing coalition."
 news.83.t: "Bosnia Returns to Civil War"
 news.83.desc: "Republika Srpska has declared independence and Bosnia and Herzegovina has returned to civil war. International organizations have called for an immediate ceasefire as entity forces mobilize across the country."
 news.83.a: "The Dayton peace has failed"
 news.84.t: "Mujahideen Join the Bosnian War"
 news.84.desc: "El Mudžahid fighters have broken with Sarajevo and proclaimed an Islamist state in Bosnia. Their intervention adds a third armed faction to the conflict and has drawn condemnation from neighboring governments."
 news.84.a: "The war has escalated"
 news.86.t: "Bosnian Civil War Ends"
 news.86.desc: "The victorious faction has restored control over Bosnia and Herzegovina after defeating the remaining breakaway forces. The government now faces demobilization, reconstruction, and another attempt at political settlement."
 news.86.a: "The fighting is over"
 if_a_strike_happens_this_may_lead_to_a_shift_in_government_tt:0 "Se ocorrer uma greve, isso pode levar a uma mudança de governo"
 BOS_bosniak_lead_government:0 "Governo Liderado pelos Bósnios"
 BOS_bosniak_lead_government_desc:0 "Uma coalizão liderada pelos bósnios priorizará as instituições nacionais e abrirá caminho para a reconciliação com o Ocidente ou para um programa revanchista mais confrontacional."
 BOS_House_of_Representatives_shortcut: "Câmara dos Representantes"
 BOS_prepping_an_offensive_shortcut: "Preparando uma ofensiva"
 BOS_post_war_effort_shortcut: "Esforço Pós-Guerra"
 BOS_politicized_army_shortcut: "Exército politizado"
 BOS_srpska_lead_government:0 "Governo Liderado pela Srpska"
 BOS_expand_federalization: "Expandir a Federalização"
 BOS_politicized_army: "Exército politizado"
 BOS_srpska_lead_government_desc:0 "Uma coalizão liderada pela Srpska defenderá as instituições das entidades e buscará parceiros orientais, para depois escolher entre federalismo cooperativo e supremacia política."
 BOS_expand_federalization_desc:0 "Maior autoridade para as entidades protegerá as instituições locais, mantendo coerentes a política externa e de defesa da Bósnia."
 BOS_politicized_army_desc:0 "Lealdades às entidades e nomeações políticas ainda dividem as forças armadas. A integração gradual pode criar uma instituição nacional profissional."
 BOS_anti_government_demonstrations: "Manifestações antigovernamentais"
 BOS_politicized_army_idea: "Exército politizado"
 BOS_politicized_army_idea_desc:0 "Lealdades paralelas, nomeações políticas e tradições de guerra separadas obstruem o comando nacional. Reformas sucessivas podem transformar a força em uma instituição profissional."
 BOS_aggressive_nation:0 "Postura Agressiva"
 BOS_aggressive_nation_desc:0 "A nação adotou uma postura militar agressiva na busca de seus objetivos de guerra."
