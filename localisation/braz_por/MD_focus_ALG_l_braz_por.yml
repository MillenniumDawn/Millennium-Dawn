 alg_deep_state_news.1.t: "Golpe Militar na Argélia!"
 alg_deep_state_news.1.d: "Relatos vindos de Argel indicam que os militares argelinos tomaram o controle do governo. Tanques cercam edifícios governamentais importantes e uma junta militar anunciou que está assumindo o poder.\n\nIsso marca uma mudança dramática na política argelina, com o há muito rumorejado 'estado profundo' agora abertamente no comando."
 alg_deep_state_news.1.a: "Isso é profundamente preocupante."
 alg_deep_state_news.1.b: "Os assuntos internos da Argélia não são da nossa conta."
