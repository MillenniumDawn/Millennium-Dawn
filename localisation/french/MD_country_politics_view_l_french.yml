 HOLD_REELECTIONS_TT: "De nouvelles élections se tiendront dans 14 jours. En raison de leur nature extraordinaire, les élections suivantes auront toujours lieu à la date prévue.\n\n§YPrérequis :§! \n[!hold_reelections_button_click_enabled] \n§YEffets :§! \n[!hold_reelections_button_click]"
