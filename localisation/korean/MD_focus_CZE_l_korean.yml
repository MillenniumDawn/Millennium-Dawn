 CZE_political_leaders_milos_zeman_text_text: "§t밀로시 제만§!"
 CZE_political_leaders_milos_zeman_TT: "§Y밀로시 제만§!"
 CZE_political_leaders_milos_zeman_delayed_TT: "1992년 밀로시 제만은 ČSSD 당원으로 출마해 당선되었습니다. 1993년에 당 대표로 선출되었고, 이후 몇 년간 이 당을 나라의 주요 정당 중 하나로 탈바꿈시켰습니다.\n\n1996년 총선에서 ČSSD가 거둔 성공 덕분에 그는 라이벌인 바츨라프 클라우스와 그의 시민민주당(ODS)이 과반 정부를 구성하는 것을 막을 수 있었습니다.\n\n1998년 ČSSD가 선거에서 승리하여 밀로시 제만은 소수 정부의 총리가 되었고, 이후 4년간 이를 이끌었습니다. 2001년 4월 그는 블라디미르 슈피들라로 대표직을 교체당했습니다."
 CZE_political_leaders_milos_zeman_effect_text_text: "§G+10%§! §Y정치력 획득§!"
 CZE_political_leaders_vladimir_spidla_text_text: "§t블라디미르 슈피들라§!"
 CZE_political_leaders_vladimir_spidla_TT: "§Y블라디미르 슈피들라§!"
 CZE_political_leaders_vladimir_spidla_delayed_TT: "2001년 4월 블라디미르 슈피들라는 ČSSD 대표가 되었습니다. 밀로시 제만은 파벨 메르틀리크를 대신할 재무장관 후보로 그를 고려했습니다.\n\n2001년 블라디미르 슈피들라는 헌법상 공직자의 급여를 삭감하는 법안을 제안했으나, US-DEU, ODS, KDU-ČSL, KSČM의 반대로 통과하지 못했습니다.\n\n그는 또한 체코 사회보장청을 사회보험 회사로 전환하는 방안을 제안했는데, 이는 의료 및 사회보험 소득을 국가 예산과 분리하여 선별된 자금이 다른 목적에 사용되는 것을 막으려는 것이었습니다."
