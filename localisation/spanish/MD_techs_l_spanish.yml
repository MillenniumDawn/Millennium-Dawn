 module_light_surface_diesel_power_1: "Motor diésel ligero I"
 module_light_surface_diesel_power_1_desc: "Los motores diésel optimizados para buques de superficie más pequeños proporcionan una propulsión fiable con un consumo eficiente de combustible.\n\n§GConsejo de diseño: La propulsión diésel ligera ofrece una velocidad modesta y un alcance máximo corto a un bajo coste de producción. Es ideal para embarcaciones costeras asequibles, pero incrementa el uso de combustible y la visibilidad de superficie.§!"
