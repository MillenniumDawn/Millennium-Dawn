 anti_vehicle_tank_ammo_3_desc: "현대 전투 상황에서 적 차량에 대응하기 위해 개발된 최첨단 탄약입니다. 이 탄은 강화된 관통 능력을 갖추어 전차와 장갑 수송차 같은 장갑 표적을 효과적으로 상대하고 손상시킬 수 있습니다."
