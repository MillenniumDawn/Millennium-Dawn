 AFG_ai_Weight_effect_Arms: "A disposição deles de aceitar é §GForte§! por padrão\n\n [USA.GetName] tem menor probabilidade de se aliar a nós se\n §R-Não seguirmos a mesma Ideologia\n -Tiverem uma Opinião Baixa de [AFG.GetName]§!"
 AFG_ai_Weight_effect_Airlift: "A disposição deles de aceitar é §GForte§! por padrão\n\n Eles têm maior probabilidade de aceitar se\n §G-[USA.GetLeader] tiver anunciado a Operação Liberdade Duradoura §!\n\n Eles têm menor probabilidade de aceitar se\n §R-Não seguirmos a mesma ideologia\n -Tiverem uma opinião baixa de nós§!"
 AFG_ai_Weight_effect_Iran: "A disposição deles de aceitar é §GForte§! por padrão\n\n Eles têm menor probabilidade de aceitar se\n §R-Não seguirmos a mesma ideologia\n -Tiverem uma opinião baixa de nós\n -Formos sunitas§!"
 AFG_ai_Weight_effect_div_usa: "A disposição deles de aceitar é §RFraca§! por padrão\n\n Eles têm maior probabilidade de aceitar se\n §G-Os drones Predator da CIA forem aprovados\n -Seguirmos a mesma ideologia\n -Tiverem uma Opinião Alta de [AFG.GetNameDefCap]§!"
 AFG_ai_Weight_effect_CIA_drones: "A disposição deles de aceitar é §GForte§! por padrão\n\n Eles têm menor probabilidade de aceitar se\n §R-Osama bin Laden estiver morto\n -Não seguirmos a mesma ideologia\n -Tiverem uma Opinião Baixa de [AFG.GetNameDefCap]§!"
 AFG_ai_Weight_effect_India_aid: "A disposição deles de aceitar é §GForte§! por padrão\n\n Eles têm menor probabilidade de aceitar se\n§R -Não seguirmos a mesma ideologia\n -Tiverem uma Opinião Baixa de [AFG.GetNameDefCap]§!"
 AFG_available_as_leaderTT: "§GDisponível§! como §YLíder Político§!"
 AFG_available_as_MillleaderTT: "§GAlocado§! como §YAlto Comandante Militar§!"
 AFG_import_westernism: "Importar o ocidentalismo"
 AFG_import_westernism_desc: "O Afeganistão há muito se apega a seus valores tradicionais. No entanto, a recente abertura a novas ideias nos permitiu incorporar seletivamente aspectos de conceitos ocidentais. Essa abordagem nos permite recorrer a uma ampla gama de ideias ocidentais, escolhendo as que se alinham às nossas necessidades específicas e rejeitando as que não se encaixam em nosso contexto."
 AFG_atta_installs_leadership: "Atta Muhammad Nur assume a liderança"
 AFG_atta_installs_leadership_desc: "De senhor da guerra a comandante, Atta Muhammad Nur não lida bem com as coisas."
 AFG_liberal_society: "Sociedade Liberal"
 AFG_afghan_morning_taliban_by_night: "A.N.A. de Dia, Talibã à Noite"
 AFG_afghan_morning_taliban_by_night_desc: "Grande parte de nosso pessoal no Exército Nacional Afegão leva uma vida dupla. Muitos deles estão no Talibã enquanto servem no exército, dando ao Talibã uma grande vantagem sobre nossas forças. Essa corrupção permitiu a corrupção em massa em nossas forças armadas e um grande desgaste moral para os homens que lutam pela nação."
 AFG_safed_koh_supply_network: "Rede de Suprimentos de Safed Koh"
 AFG_safed_koh_supply_network_desc: "Usando uma complexa rede de estradas, montanhas e cavernas subterrâneas, a rede de suprimentos de Safed Koh amenizou o impacto do terreno hostil e isolado da região."
 AFG_tal_insurgency_new: "[TAL.GetFlag] Insurgência talibã"
 AFG_tal_insurgency_new_desc: "O Talibã recuou para os arredores orientais do Afeganistão após várias derrotas. Eles estão se entrincheirando, preparando-se para uma guerra de guerrilha longa e sangrenta. A Força do Talibã está diretamente ligada aos seus modificadores defensivos e ofensivos. Se tiverem mais de 30% de força quando os Estados Unidos se retirarem, lançarão novamente uma invasão em larga escala.\n\n£AFG_salafist_jihadism  §HForça do Talibã - [?AFG.taliban_attack_strength|%]§!"
 TAL_move_into_tribal_areas: "Avançar sobre as áreas tribais paquistanesas"
 TAL_move_into_tribal_areas_desc: "Para sobreviver, precisaremos deslocar nossas forças para fora, de modo a não ficarmos concentrados em uma única área. As áreas tribais são o esconderijo perfeito, pois teremos acesso livre a uma boa cadeia de montanhas."
 AFG_414_attack_1207: "Atacar redutos talibãs"
 AFG_414_attack_1207_desc: "Embora não consigamos erradicar o Talibã, poderemos reduzir sua força... se tivermos sucesso."
 TAL_1207_attack_1154: "Golpear Kunar"
 TAL_1207_attack_1208: "Avançar sobre Qalat"
 AFG_414_attack_1208: "Retomar Qalat"
 AFG_414_attack_1154: "Retomar Kunar"
 PAK_objected: "Recuamos após as objeções do [PAK.GetFlag] Paquistão"
 AFG_doing_border_raid: "Atualmente realizando uma incursão na fronteira"
 TAL_money: "Fundos do Talibã"
 AFG_agriculture_mech: "Agricultura"
 AFG_agriculture_mech_desc: "Amêndoas e romãs são as únicas exportações afegãs que o mundo compra sem hesitar. Dinheiro estatal investido em pomares, transporte e compradores transforma a colheita do agricultor em receita para o tesouro."
 AFG_pomegranate_return_tt: "Retorno: §G+6%§! do PIB para o §YTesouro§!"
 AFG_almond_return_tt: "Retorno: §G+8%§! do PIB para o §YTesouro§!"
 AFG_pomegranate_investment_limit_tt: "Investimentos em romã restantes: §Y[?AFG_pomegranate_investments]/5§!"
 AFG_almond_investment_limit_tt: "Investimentos em amêndoa restantes: §Y[?AFG_almond_investments]/5§!"
 TAL_1207_attack_1154_desc: "Enviar combatentes das cordilheiras de Safed Koh a Kunar para desgastar a guarnição afegã antes que ela se entrincheire."
 TAL_1207_attack_1208_desc: "Pressionar de Safed Koh contra Qalat. Controlar a rodovia ali divide as forças do governo pelo sudeste."
 TAL_1152_attack_415: "Varrer o Sistão"
 TAL_1152_attack_415_desc: "Avançar para o oeste, saindo de Registão em direção ao Sistão, ameaçando o controle do governo sobre a fronteira desértica com o Irã."
 AFG_415_attack_1152: "Limpar o Registão"
 AFG_415_attack_1152_desc: "Contra-atacar a partir do Sistão para retomar o deserto de Registão e negar ao Talibã sua área de concentração."
 AFG_412_attack_415: "Libertar o Sistão"
 AFG_412_attack_415_desc: "Avançar de Hazarajat para expulsar o Talibã do Sistão e devolver as províncias do sul ao controle do governo."
 TAL_construct_the_safed_koh_system: "Construir a rede de suprimentos de Safed Koh"
 TAL_construct_the_safed_koh_system_desc: "Abrir esconderijos, túneis e trilhas de mulas pela cordilheira de Safed Koh para manter os combatentes abastecidos fora do alcance das patrulhas afegãs."
 TAL_begin_insurgency_in_registan: "Abrir a frente de Registão"
 TAL_begin_insurgency_in_registan_desc: "Levantar colunas de milícia pelo deserto de Registão e tomar a província, abrindo uma segunda frente no sul."
 TAL_begin_war_again: "Relançar a guerra"
 TAL_begin_war_again_desc: "Com as tropas estrangeiras fora e nossa força restaurada, abandonar o cessar-fogo e marchar sobre Cabul para encerrar a guerra."
 AFG_taliban_insurgency_eliminated: "A insurgência talibã foi eliminada"
 AFG_active_taliban_insurgency: "A insurgência talibã está ativa"
 wot_supporting_afghan_counter_insurgency: "Apoiar a contrainsurgência afegã"
 AFG_civil_war_shortcut: "Guerra Civil"
 AFG_panjshir_shortcut: "Panjshir"
 AFG_foreign_policy_shortcut: "Política Externa"
 AFG_government_shortcut: "Governo"
 AFG_reconstruction_shortcut: "Reconstrução"
 AFG_national_policy_shortcut: "Política Nacional"
 AFG_national_assembly: "Assembleia Nacional"
 AFG_anjuman_pass: "O Leão de Panjshir"
 AFG_law_of_faith: "Lei da Fé"
 AFG_law_of_faith_idea: "Lei da Fé"
 AFG_law_of_faith_idea_desc: "A lei religiosa está inscrita no código legal. O clero está satisfeito e o campo responderá a um chamado às armas, mas o espaço político para qualquer coisa fora do consenso se fechou."
 AFG_law_of_faith_desc: "A Lei da Fé prevalecerá em nosso Estado para reforçar nossos princípios islâmicos. Nosso povo será guiado por suas crenças islâmicas a fim de manter o Estado puro e justo."
 AFG_training_of_local_police_officers: "Treinamento de Policiais Locais"
 AFG_training_of_local_police_officers_desc: "Em preparação para a eventual libertação e estabilização do Afeganistão, a Aliança do Norte deve estabelecer uma força policial disciplinada e eficaz. Essa força será crucial para manter a lei e a ordem nos territórios que pretendemos retomar."
 AFG_heirs_o_the_mujahideen: "Herdeiros dos Mujahidin"
 AFG_heirs_o_the_mujahideen_desc: "Inspirando-se nos lendários combatentes do passado, a liderança atual busca reviver o espírito e as táticas dos Mujahidin."
 AFG_the_lions_guard: "A Guarda do Leão"
 AFG_the_lions_guard_desc: "Uma nova força-tarefa surgiu para evitar possíveis ataques contra Ahmad Shah Massoud, em resposta a preocupações com ameaças iminentes."
 AFG_the_francesc_vendrell_talks: "As Negociações de Francesc Vendrell"
 AFG_the_francesc_vendrell_talks_desc: "Em Dushanbe, no Tajiquistão, o Enviado Especial da ONU Francesc Vendrell conduz negociações de paz com líderes afegãos importantes: o comandante da Aliança do Norte Ahmad Shah Massoud, o ex-governador de Nangarhar Haji Abdul Qadeer e o ex-membro do governo Rabbani Syed Hussain Anwari, discutindo as aflições de Muhammad Asif Mohseni."
 AFG_assault_on_mazar_i_sharif: "Ataque a Mazar-i-Sharif"
 AFG_assault_on_mazar_i_sharif_desc: "A importante cidade de Mazar-i-Sharif precisa ser retomada, e podemos mobilizar nossos homens para dar-lhes um impulso e conseguir isso."
 AFG_massoud_s_mig_and_sukho: "Os MiGs e Sukhois de Massoud"
 AFG_massoud_s_mig_and_sukho_desc: "O apoio da Índia tem sido encoberto. A Índia vem ajudando Massoud com dinheiro, equipamentos de radar e peças de aeronaves há algum tempo. Eles enviaram cerca de 30 técnicos que, segundo relatos, mantêm os caças MiG e Sukhoi de Massoud. Assessores militares indianos também deram dicas sobre como combater o Talibã. Embora não reconhecida, a ajuda indiana tornou-se um pilar das forças de Massoud."
 AFG_russian_air_lift_idea: "Ponte Aérea Russa"
 AFG_russian_air_lift_idea_desc: "Armas e peças de reposição de padrão soviético estão chegando por via aérea da Rússia. Nossas tripulações já conhecem o equipamento, então ele chega à frente de batalha de forma barata e sem necessidade de retreinamento."
 AFG_russian_air_lift: "Ponte Aérea Russa"
 AFG_russian_air_lift_desc: "A Rússia mantém uma antiga aliança encoberta com a Aliança do Norte, fornecendo armas e suprimentos essenciais para apoiar o que resta do nosso governo. Ontem mesmo, o Ministro da Defesa russo, Sergei Ivanov, anunciou que equiparão nossas milícias com equipamentos conhecidos da era soviética, com os quais os membros da Aliança do Norte já estão familiarizados."
 AFG_mil_mi_24_gunships: "Helicóptero de Ataque Mil Mi-24"
 AFG_mil_mi_24_gunships_desc: "A Rússia anunciou planos de nos fornecer 12 helicópteros de ataque Mil Mi-24, que serão um apoio valioso em nosso avanço contra o Talibã."
 AFG_cia_predator_surveillance_drones: "Drones de Vigilância Predator da CIA"
 AFG_cia_predator_surveillance_drones_idea: "Drones de Vigilância Predator da CIA"
 AFG_cia_predator_surveillance_drones_idea_desc: "Drones americanos sobrevoam os desfiladeiros e nos repassam o que veem. Pela primeira vez planejamos com base em inteligência real, e nossas próprias redes crescem a partir das deles."
 AFG_cia_predator_surveillance_drones_desc: "Os drones de vigilância Predator da CIA têm sido fundamentais para fornecer ampla cobertura do terreno, identificar pontos de interesse e localizar alvos hostis."
 AFG_appeal_to_washington_for_support: "Apelo a Washington por Apoio"
 AFG_appeal_to_washington_for_support_desc: "Diante do conflito em curso e da ameaça das facções extremistas, o Afeganistão deve buscar o apoio de aliados internacionais para fortalecer sua capacidade militar."
 AFG_imu_countermeasures: "Contramedidas contra o MIU"
 AFG_imu_countermeasures_desc: "Para combater essa ameaça, o Afeganistão busca a ajuda do Uzbequistão para realizar ataques aéreos direcionados contra os redutos do MIU. Essa colaboração visa enfraquecer as capacidades do MIU, interromper suas operações e restaurar a segurança nas regiões de fronteira."
 AFG_shura_system: "Reforçar o Sistema Shura"
 AFG_shura_system_desc: "Fortalecer o sistema Shura dentro da Aliança do Norte é crucial para manter a unidade e uma governança eficaz. Ao reforçar essa estrutura tradicional de decisão baseada em conselhos, garantimos que todas as facções estejam representadas."
 AFG_anjuman_pass_desc: "Ahmad Shah Massoud, também conhecido como o Leão de Panjshir, é um símbolo de resistência e liderança tática. Ao se unir em torno de suas ideias, a nação pretende adotar suas estratégias, inspirar as tropas e consolidar suas defesas. Seus princípios de liderança guiaram e guiarão o Afeganistão através de suas dificuldades atuais."
 AFG_ghanis_plan: "Plano de Ghani"
 AFG_ghanis_plan_desc: "Ghani está lançando um plano para cortar o apoio ao Talibã por meio de ações militares direcionadas e projetos de desenvolvimento, visando estabilizar regiões-chave e restaurar o controle do governo."
 AFG_secretly_support_the_opium_industry: "Apoio Secreto à Indústria do Ópio"
 AFG_secretly_support_the_opium_industry_desc: "Sob o pretexto da industrialização, nossa base urbana acreditará que caminhamos para uma nova era de modernização. No entanto, não podemos alienar o alicerce da nação: os agricultores. Apoiaremos secretamente o comércio de ópio como meio de melhorar nossa prosperidade econômica e agradar a todos os setores da sociedade afegã."
 AFG_parliamentary_illusion: "Ilusão Parlamentar"
 AFG_parliamentary_illusion_idea: "Ilusão Parlamentar"
 AFG_parliamentary_illusion_idea_desc: "A câmara se reúne, debate e vota, mas não decide nada que importe. Custa pouco mantê-la, e a aparência de consentimento vale mais que a realidade."
 AFG_parliamentary_illusion_desc: "Afinal, para que serve o parlamento? Serve para apaziguar nosso povo, fazendo-o crer que tem voz no governo. Não podemos descartar totalmente o processo democrático, mas podemos manipulá-lo para melhor servir aos nossos interesses."
 AFG_the_western_kleptocracy: "A Cleptocracia Ocidental"
 AFG_ashraf_ghani: "Os Ahmadzai"
 AFG_ashraf_ghani_desc: "Ashraf Ghani foi eleito o novo Presidente do Afeganistão. Com um mandato de reformas, ele busca estabilizar a nação e reconstruir suas instituições."
 AFG_endorse_the_american_candidate: "Apoiar o Candidato Americano"
 AFG_endorse_the_american_candidate_desc: "Com o fim do governo de transição, o controle de Hamid Karzai sobre o governo continua forte. Como candidato escolhido pelo acordo de Bonn, Karzai formou um governo de ampla base voltado a reconstruir o Afeganistão e promover uma paz duradoura com nossos novos aliados americanos."
 AFG_the_new_chairman: "O Novo Presidente"
 AFG_the_new_chairman_desc: "Com o passar do ciclo eleitoral, o chefe de Estado deve não apenas exercer o controle, mas também ser o rosto da nação. Com o cargo em aberto, Karzai deve assumir o comando e liderar o Afeganistão pelo exemplo."
 AFG_aptta: "APTTA"
 AFG_aptta_desc: "O Acordo de Comércio de Trânsito Afeganistão-Paquistão, ou APTTA, é um acordo comercial bilateral entre o Paquistão e o Afeganistão, assinado durante a administração Karzai. O acordo visa impulsionar o comércio entre os dois países, apoiar operações antiterrorismo e trazer desenvolvimento às regiões de fronteira."
 AFG_saarc_membership: "Adesão à SAARC"
 AFG_saarc_membership_idea: "Adesão à SAARC"
 AFG_saarc_membership_idea_desc: "Um assento à mesa do Sul da Ásia. O crédito é mais barato, a base de impostos é mais estável e Cabul é tratada como vizinha em vez de problema."
 AFG_saarc_membership_desc: "A adesão do Afeganistão à Associação Sul-Asiática para Cooperação Regional, ou SAARC, demonstra a integração do país ao arcabouço econômico e político regional. Também oferece uma oportunidade de tirar o Afeganistão da sarjeta."
 AFG_rebuilding_the_state: "Reconstruindo o Estado"
 AFG_rebuilding_the_state_desc: "Após a queda do Talibã, um dos principais objetivos da construção da nação no Afeganistão é restaurar e reconstruir o Estado desde a base. O Afeganistão, um Estado com economia em colapso e quase nenhuma estrada pavimentada ou ferrovia, deve agora ser reconstruído como um país capaz de ocupar seu lugar na ordem global."
 AFG_drafting_the_constitution: "Redigindo a Constituição"
 AFG_drafting_the_constitution_desc: "A assinatura da Constituição marca um ponto de virada significativo para o Estado, pois coloca no papel medidas que garantem os direitos humanos."
 AFG_national_solidarity_program: "Programa de Solidariedade Nacional"
 AFG_national_solidarity_program_desc: "O Programa de Solidariedade Nacional Afegão, ou NSP, foi uma iniciativa governamental para reabilitar e desenvolver cerca de 5.000 vilarejos no Afeganistão, com US$ 900 milhões distribuídos ao longo de três anos. Buscava estabelecer instituições locais eleitas democraticamente e supervisionar os esforços de reconstrução."
 AFG_reformist_path: "Caminho Reformista"
 AFG_reformist_path_desc: "O caminho reformista visa substituir o velho pelo novo, e não há momento melhor que agora, pois o Afeganistão ainda está nos estágios iniciais da construção da nação."
 AFG_next_in_line_of_succession: "Próximo na Linha de Sucessão"
 AFG_next_in_line_of_succession_desc: "Com o fim do mandato de Hamid Karzai, um sucessor deve assumir o seu lugar."
 AFG_sway_local_warlords: "Influenciar os Senhores da Guerra Locais"
 AFG_sway_local_warlords_desc: "Os senhores da guerra locais dominam a liderança afegã desde a invasão soviética, e removê-los não será fácil. Em vez disso, devemos identificar e colaborar com os homens fortes principais para fortalecer nossa posição."
 AFG_the_islamic_republic: "A República Islâmica"
 AFG_the_islamic_republic_desc: "À medida que o Estado do Afeganistão se desfaz, uma nova era para a república começa, marcando um novo começo e uma nova forma para nossa nação."
 AFG_the_mujahideen: "Os Mujahidin"
 AFG_the_mujahideen_desc: "Os Mujahidin, ou Mujahidin Afegãos, são uma ampla coalizão de ex-comandantes da resistência e senhores da guerra, muitos dos quais apoiaram a antiga Aliança do Norte. Devemos nos concentrar em manter o status quo."
 AFG_age_of_republican_leadership: "Liderança da Nova Era"
 AFG_age_of_republican_leadership_desc: "Com a criação da República Islâmica, devemos aposentar gradualmente os antigos comandantes senhores da guerra em favor de novos oficiais para as novas forças de defesa nacional."
 AFG_islamic_democracy: "Democracia Islâmica"
 AFG_islamic_democracy_desc: "O novo capítulo continua com a sociedade islâmica assumindo o comando do Estado do Afeganistão, esperançosamente rumo ao futuro. No entanto, agora não é hora de descanso, pois senhores da guerra e chefes de gangues percorrem a nação, representando uma ameaça ao se aliarem às forças talibãs."
 AFG_reinforce_the_government: "Reforçar o Governo"
 AFG_reinforce_the_government_desc: "Com nosso novo controle sobre as regiões do sul da nação, acreditamos ser um bom começo para comandar a oposição e trazer nossa liderança à luz de muitos."
 AFG_agricultural_modernisation: "Modernização Agrícola"
 AFG_agricultural_modernisation_desc: "Modernizar a irrigação, a mecanização e as técnicas de cultivo aumentaria a produção em nossas províncias rurais e daria ao tesouro uma nova fonte de receita do setor agrícola."
 AFG_the_farmer_and_their_rifle: "O Agricultor e Seu Fuzil"
 AFG_the_farmer_and_their_rifle_desc: "Com sede de abrir caminho a sangue e osso para proteger sua pátria, os habitantes rurais do Afeganistão provaram ser a espinha dorsal do Estado. Perder o apoio dessa comunidade seria o primeiro dominó a levar à nossa queda."
 AFG_inheritor_of_afghanistan: "Herdeiro do Afeganistão"
 AFG_inheritor_of_afghanistan_desc: "O Afeganistão só foi verdadeiramente pacífico sob o nosso governo. Tornamo-nos os herdeiros do Estado afegão e devemos ser elogiados por essa conquista, não desprezados pelas potências globais."
 AFG_second_man_of_the_state: "Segundo Homem do Estado"
 AFG_second_man_of_the_state_desc: "Sendo um ex-comandante da resistência, Atta tem grande interesse no poder. Ele se estabeleceu como um líder distinto do Afeganistão e não evitou se envolver em conflitos de grande escala com outros senhores da guerra."
 AFG_dismantle_the_warlords: "Desmantelar os Senhores da Guerra"
 AFG_dismantle_the_warlords_desc: "Bandidos e gângsteres controlam certas regiões da nação. Para nos transformarmos de fato em um Estado-nação moderno, devemos nos esforçar para resolver esse problema dos senhores da guerra."
 AFG_a_tolerant_state: "Um Estado Tolerante"
 AFG_a_tolerant_state_desc: "O Afeganistão abriga uma multidão de povos diferentes. Devemos cumprir nossas promessas de considerar cada afegão como um só e permanecer unidos como um todo."
 AFG_naveen: "Naveen"
 AFG_naveen_desc: "O Partido do Novo Afeganistão, ou Naveen, é um partido político do Afeganistão liderado por Yunus Qanuni. O partido foi fundado quando Qanuni se afastou do Movimento Nacional do Afeganistão, liderado por Ahmad Wali Massoud. Yunus Qanuni pretende dar continuidade à mentalidade da Aliança do Norte."
 AFG_new_class_of_jam_iat_reformers: "Nova Classe de Reformistas do Jam'iat"
 AFG_new_class_of_jam_iat_reformers_desc: "Yunus Qanuni representa uma nova onda de reformistas do Jam'iat que abraçam mais os valores islâmicos e tradicionais. Esse grupo tende a adotar uma abordagem mais reformista, focada em mudanças graduais em vez de conversão agressiva."
 AFG_counite_masouds_works: "Continuar o Trabalho de Massoud"
 AFG_counite_masouds_works_desc: "Com a derrota da Aliança do Norte e o fim da liderança de Massoud, permanecemos comprometidos em preservar o espírito da Aliança do Norte enquanto nos esforçamos para construir um Afeganistão moderno."
 AFG_foster_innovation: "Fomentar a Inovação"
 AFG_foster_innovation_desc: "Como ex-Ministro da Educação, Yunus Qanuni entende a necessidade crítica de inovação no setor educacional."
 AFG_combat_electoral_corruption: "Combater a Corrupção Eleitoral"
 AFG_combat_electoral_corruption_desc: "No Afeganistão, autoridades frequentemente usaram o suborno para acumular riqueza e manter seu poder. A partir de agora, devemos garantir que a fraude eleitoral não seja mais tolerada."
 AFG_empowering_provincial_governance: "Fortalecer a Governança Provincial"
 AFG_empowering_provincial_governance_desc: "Fortalecer a governança provincial no Afeganistão é essencial. Como demonstrado pela Alemanha, a governança descentralizada permite que as regiões progridam e alcancem o resto da nação."
 AFG_centralise_the_apparatus_of_the_state: "Centralizar o Aparato do Estado"
 AFG_centralise_the_apparatus_of_the_state_desc: "A centralização fortalecerá nosso controle, garantindo que todas as revisões e a oposição sejam geridas diretamente por nós."
 AFG_expand_the_education_ministry: "Expandir o Ministério da Educação"
 AFG_expand_the_education_ministry_desc: "Expandir o Ministério da Educação beneficiaria muito nosso Estado ao fomentar uma força de trabalho mais qualificada e desenvolver uma sociedade mais instruída."
 AFG_propose_a_new_constitution: "Propor uma Nova Constituição"
 AFG_propose_a_new_constitution_desc: "A atual constituição afegã não atende aos padrões modernos e exige emendas significativas."
 AFG_embezzle_foreign_funds: "Desviar Fundos Estrangeiros"
 AFG_embezzle_foreign_funds_desc: "Desviar fundos estrangeiros tem sido um método para manter controle rígido sobre a nação e sustentar nosso governo ao lado da Assembleia Nacional."
 AFG_enforce_afghan_centralism: "Impor o Centralismo"
 AFG_enforce_afghan_centralism_desc: "Os afegãos são um povo rural e tribal, e historicamente reagiram mal a qualquer forma de centralização. Mas de que adianta nosso governo se formos limitados no que podemos e não podemos fazer? Devemos firmar o pé e impor o centralismo."
 AFG_urban_tribal_divisions: "Concessões aos Líderes Shura"
 AFG_urban_tribal_divisions_desc: "Ao transferir parte de nossos membros tribais para áreas urbanizadas, poderemos dar a certas regiões maior autonomia e controle sobre si mesmas, pois estarão mais organizadas."
 AFG_atlanticism: "Atlantismo"
 AFG_atlanticism_desc: "O atlantismo é a crença na estreita cooperação entre a América do Norte e a Europa, uma doutrina que se firmou após a Segunda Guerra Mundial. O Afeganistão deseja adotar um modelo mais ocidental em termos de progresso e governança."
 AFG_arsenal_of_democracy: "Arsenal da Democracia"
 AFG_arsenal_of_democracy_desc: "Com a economia armamentista americana em alta, devemos usar isso a nosso favor, estocando e nos preparando para os desafios que virão."
 AFG_the_republic_survives_another_day: "A República Sobreviveu Mais um Dia"
 AFG_the_republic_survives_another_day_desc: "Enquanto a noite dá lugar ao dia, a bandeira do povo afegão se mantém firme. Pronta para o que vier, seja paz ou guerra. Uma coisa permanece certa: a república resistirá até o último suspiro."
 AFG_defenders_of_democracy: "Defensores da Democracia"
 AFG_defenders_of_democracy_desc: "De um Estado com pouca noção de democracia a um novo regime que a abraça plenamente: é algo sem precedentes. Devemos cumprir nosso dever e proteger esta nação e seus ideais a qualquer custo."
 AFG_root_out_the_old_cabinet: "Extirpar o Antigo Gabinete"
 AFG_root_out_the_old_cabinet_desc: "Figuras de gestões passadas ainda estão no sistema parlamentar. Devemos desarmá-las e expô-las pelas fraudes que são."
 AFG_moderate_islamism: "Islamismo Moderado"
 AFG_moderate_islamism_desc: "O islamismo moderado refere-se a uma abordagem passiva ou tradicional do Islã, diferenciando-se de interpretações mais radicais e revolucionárias."
 AFG_basej_e_milli: "A Tendência Verde"
 AFG_basej_e_milli_desc: "O Basej-e Milli, também conhecido como Rawand-e Sabz-e Afghanistan, é um partido político antitalibã, nacionalista afegão e pró-democracia. Desempenha papel significativo na defesa de um futuro democrático e da unidade nacional no Afeganistão."
 AFG_knife_to_the_warlords: "Faca nos Senhores da Guerra"
 AFG_knife_to_the_warlords_desc: "Os senhores da guerra assolam esta nação e são um conceito ultrapassado. Dizem agir em nome do povo, mas todos nós nos opomos a eles."
 AFG_standardised_taxation: "Tributação Padronizada"
 AFG_standardised_taxation_desc: "A tributação padronizada permitirá que nossa economia se recupere de anos de guerra."
 AFG_enlist_the_support_of_the_people: "Angariar o Apoio do Povo"
 AFG_enlist_the_support_of_the_people_desc: "Angariar o apoio do povo salvará a república das ameaças que estão por vir."
 AFG_recraft_the_healthcare_system: "Refazer o Sistema de Saúde"
 AFG_recraft_the_healthcare_system_desc: "Os hospitais são antigos e precisam de restauração e reparos. Devemos fazer a nossa parte para resolver esse problema."
 AFG_local_organisation: "Organização Local"
 AFG_local_organisation_desc: "Devemos nos mobilizar para ser autossuficientes e não depender do apoio do resto do mundo."
 AFG_lift_the_press_restrictions: "Suspender as Restrições à Imprensa"
 AFG_lift_the_press_restrictions_desc: "Uma imprensa livre e independente é a pedra angular de uma sociedade vibrante e democrática."
 AFG_progressive_tax: "Um Imposto Progressivo"
 AFG_progressive_tax_desc: "Para garantir uma distribuição justa de riqueza e recursos, o Afeganistão adota um sistema de imposto progressivo."
 AFG_return_of_dostum: "Retorno de Dostum"
 AFG_return_of_dostum_desc: "O General Abdul Rashid Dostum, importante líder militar afegão e figura influente, está voltando ao cenário nacional. Ele é conhecido por seu formidável comando das forças uzbeques e por sua argúcia estratégica."
 AFG_mission_to_tehran: "Missão a Teerã"
 AFG_mission_to_tehran_desc: "Em busca de fortalecer alianças regionais e conter ameaças externas, o Afeganistão embarca em uma missão diplomática a Teerã. Ao se unir ao Eixo da Resistência liderado pelo Irã, o Afeganistão pretende garantir aliados poderosos, ampliar sua capacidade militar e reforçar sua posição geopolítica."
 AFG_take_command_of_rabbanis_feyzabad_forces: "Assumir o Comando das Forças de Rabbani em Feyzabad"
 AFG_take_command_of_rabbanis_feyzabad_forces_desc: "As forças de Burhanuddin Rabbani estacionadas em Feyzabad são cruciais para controlar as regiões nordeste do Afeganistão. Ao assumir o comando direto dessas forças, a liderança central pretende unificar as estruturas de comando, melhorar a coordenação e reforçar a defesa dessa área estrategicamente importante."
 AFG_karim_khalilis_new_offensive: "Nova Ofensiva de Karim Khalili"
 AFG_karim_khalilis_new_offensive_desc: "Karim Khalili, líder e estrategista de destaque, está à frente de uma nova e ousada ofensiva para retomar territórios-chave e repelir as forças hostis. Seu plano combina táticas de guerrilha, mobilização de milícias locais e coordenação estratégica com forças aliadas."
 AFG_western_klep_tt1: "O impacto de §YDesviar a Ajuda Externa§! na §YRenda Adicional§! é de $§G0.18§! bilhão"
 AFG_state_northern_stronghold_dynamic_modifier: "Portões da Passagem de Anjuman"
 AFG_taliban_assault_on_taloqan: "Ataque do Talibã a Taloqan"
 AFG_state_battle_for_mazar_i_sharif_dynamic_modifier: "Ofensiva de Mazar-i-Sharif"
 AFG_increase_road_toll_tt: "Aumentar os Pedágios\nNível de Pedágio: [?AFG_toll_level]\nGanho Monetário do Estado: $§G[?AFG_Toll_display_var]§!\nBens de Consumo: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_increase_road_toll_tt_desc: "Os níveis de pedágio podem ser elevados até cinco vezes, cada um aumentando a receita gerada pelas rodovias estatais com base no tráfego e no volume de mercadorias comercializadas. Cada nível acima do primeiro custa §Y2%§! de bens de consumo em âmbito nacional, refletindo o peso que os pedágios impõem à economia como um todo."
 AFG_lower_road_toll_tt: "Reduzir os Pedágios\nNível de Pedágio: [?AFG_toll_level]\nGanho Monetário do Estado: $§G[?AFG_Toll_display_var]§!\nBens de Consumo: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_lower_road_toll_tt_desc: "Reduzir um nível de pedágio devolve os §Y2%§! de bens de consumo que ele custou, ao preço da receita que aquele nível gerava. Os pedágios não podem ser reduzidos abaixo do primeiro nível."
 AFG_toll_below_maximum_tt: "Os pedágios deste estado estão §Rno nível mais alto§!."
 AFG_toll_above_minimum_tt: "Os pedágios deste estado estão §Rno nível mais baixo§!."
 AFG_info_box: "§GPedágios§!\nNível de Pedágio: [?AFG_toll_level]\nGanho Monetário do Estado: $§G[?AFG_Toll_display_var]§!\nGanho Monetário Nacional com Pedágios: $§G[?ROOT.additional_income_AFG_tolls_income1]§!\nBens de Consumo Nacionais: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_info_box_desc_lore: "As rodovias afegãs são controladas por grupos como o Talibã e senhores da guerra locais, que usam pedágios locais para gerar renda das rotas comerciais que ligam a Ásia Central, o Irã e o Paquistão. Esses pedágios, enraizados nas tradições da Rota da Seda, são uma importante fonte de financiamento tanto para o regime talibã quanto para os senhores da guerra, sendo o controle das estradas principais crucial para o poder e a riqueza."
 AFG_usa_equipment: "Envolvimento da CIA"
 AFG_usa_equipment_desc: "Os americanos não gostam do ponto de apoio que o Talibã tem atualmente e, por isso, ofereceram nos vender equipamentos a preço baixo."
 AFG_join_sco: "Ingressar na OCX"
 AFG_join_sco_desc: "A OCX é liderada pela China e pela Rússia e é uma organização que enfatiza a paz regional, a segurança, o combate ao terrorismo e a cooperação econômica. Ela pode fornecer muitos dos recursos que consideramos necessários ao nosso país, como exercícios antiterrorismo e assistência ao desenvolvimento. Devemos ingressar na OCX para o benefício do nosso país."
 AFG_the_western_kleptocracy_desc: "Mudança? Quem precisa de mudança? Temos o Ocidente para nos ajudar e a situação vai melhorar como planejado."
 AFG_liberal_society_desc: "Afrouxar o domínio do establishment clerical deu a Cabul uma imprensa, um bazar e um debate público. Os parceiros comerciais nos levam mais a sério por isso, embora o capital político gasto para manter essa linha seja real."
 AFG_preserve_democracy: "Preservar a Democracia"
 AFG_preserve_democracy_desc: "Com a imprensa liberta e os tribunais deixados em paz, a república tem uma chance genuína de criar raízes antes que a próxima crise a coloque à prova."
 AFG_indian_support_and_arms_trade: "Apoio Indiano e Comércio de Armas"
 AFG_indian_support_and_arms_trade_desc: "Os indianos concordaram em apoiar e armar nossa nação contra nossos inimigos."
 AFG_establishing_supply_lines: "Estabelecendo Linhas de Suprimento"
 AFG_establishing_supply_lines_desc: "Ao estabelecer linhas de suprimento bem conservadas e bem mantidas, nossas tropas estarão suficientemente abastecidas para continuar lutando."
 AFG_russian_technical_specialists: "Especialistas Técnicos Russos"
 AFG_russian_technical_specialists_desc: "Trouxemos especialistas da [SOV.GetFlag] Rússia para trabalhar em nossas unidades mecanizadas."
 AFG_the_shura_system_idea: "O Sistema Shura"
 AFG_the_shura_system_idea_desc: "O sistema Shura na Aliança do Norte é uma forma tradicional de governança baseada em conselhos, enraizada em práticas tribais e comunitárias de tomada de decisão. Esse sistema reúne líderes militares, anciãos tribais e figuras influentes para deliberar e tomar decisões coletivas. O sistema Shura fortalece a unidade e garante que as diversas facções da Aliança do Norte estejam representadas e tenham voz em assuntos estratégicos e políticos."
 AFG_civilian_exodus_taloqan: "Êxodo Civil de Taloqan"
 AFG_civilian_exodus_taloqan_desc: "Os combates ao redor de Taloqan empurraram milhares de famílias para o norte e o oeste. Os campos sobrecarregam o pouco que podemos dispensar, mas os refugiados levam a província consigo, e menos bocas na linha de frente aliviam nosso abastecimento."
 AFG_iranian_airbridge: "Ponte Aérea Iraniana"
 AFG_iranian_airbridge_desc: "Depois que o Talibã tomou Cabul, a ajuda do Irã à Aliança do Norte aumentou. O Irã estabeleceu uma ponte aérea entre Mashhad e as bases aéreas afegãs de Bagram e Kulyab, para abastecer a Aliança do Norte com grandes quantidades de armas. Relatos indicam que, em um único dia em 1997, 13 voos iranianos pousaram em Bagram, e suspeita-se que o Irã ainda envie 700 toneladas de armas via Tajiquistão."
 AFG_junbishis: "Junbishis"
 AFG_junbishis_desc: "§RWe can't manually boost §W[reactionary_L]'s§! popularity while Abdul Rashid Dostum is in exile §!\n\nJunbish-i Milli Islami Afghanistan, commonly known as Junbish, is a major faction within the Northern Alliance, primarily consisting of ethnic Uzbeks. It was recently expelled from its stronghold Mazar-i-Sharif by Taliban forces, but Junbish continues to play a significant role within the Northern Alliance. The group is led by General Abdul Rashid Dostum, a prominent warlord who has been at odds with other members of the Northern Alliance in the Past and has a strained relationship while he is in exile.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we complete the §Y$AFG_return_of_dostum$§! focus."
 AFG_northern_alliance_taloqan_siege: "O Cerco a Taloqan"
 AFG_northern_alliance_taloqan_siege_desc: "Na história recente, Taloqan serviu como quartel-general estratégico de Ahmad Shah Massoud, líder proeminente entre as facções mujahidin, durante a resistência contra o Exército Soviético. Depois desse período, assumiu o papel de quartel-general de [AFG.GetFlag] [AFG.GetNameDefCap] após a cidade de Mazar-i-Sharif ser tomada pelas forças talibãs em 1997."
 AFG_idea_opium_economy: "Economia Afegã do Ópio"
 AFG_idea_opium_economy_desc: "Grande parte dos agricultores afegãos ganha a vida cultivando e vendendo papoulas para o ópio. Enormes campos de papoula ocupam boa parte de nossas terras aráveis."
 AFG_idea_opium_barons: "Barões Afegãos do Ópio"
 AFG_idea_opium_barons_desc: "Grande parte dos agricultores afegãos ganha a vida cultivando e vendendo papoulas para o ópio. Enormes campos de papoula ocupam boa parte de nossas terras aráveis. As novas políticas do governo permitiram uma situação em que uma grande panelinha de barões do ópio opera várias grandes redes comerciais. A influência desses barões do ópio dentro do governo é inegável."
 AFG_idea_afghan_defence: "Amplas Medidas Defensivas"
 AFG_idea_afghan_defence_desc: "Nosso país está mergulhado em uma guerra civil. Temos perdido terreno, mas não daremos mais um passo para trás!"
 AFG_idea_un_troops: "Tropas de Paz da ONU"
 AFG_idea_un_troops_desc: "Solicitamos que forças de paz da ONU sejam enviadas ao nosso país na esperança de trazer estabilidade."
 AFG_political_events.1.t: "Pedido de Armamento de [AFG.GetNameDef]"
 AFG_political_events.1.d: "[AFG.GetNameDef] enviou um emissário a [ROOT.capital.GetName] para negociar um acordo em que os equiparíamos com o material necessário para prosseguir com suas operações de combate."
 AFG_political_events.1.a: "Aceitaremos"
 AFG_political_events.1.b: "Hoje Não"
 AFG_political_events.2.t: "[FROM.GetNameDef] Rejeita Nosso Pedido de Armas"
 AFG_political_events.2.d: "[FROM.GetNameDef] negou nosso pedido de armas. Não nos desanimaremos com essa recusa e persistiremos em nossos objetivos atuais."
 AFG_political_events.2.a: "Adiante"
 AFG_political_events.3.t: "[FROM.GetNameDef] Assina Remessa de Armas"
 AFG_political_events.3.d: "Expressamos nossa profunda gratidão a [FROM.GetNameDef] por fornecer o equipamento tão necessário que aguardávamos há muito tempo."
 AFG_political_events.3.a: "Ótimo!"
 AFG_political_events.4.t: "Primeiras Eleições Afegãs"
 AFG_political_events.4.d: "Hoje marca o fim da contagem dos votos. Estamos finalmente prestes a eleger o primeiro líder do Afeganistão."
 AFG_political_events.4.a: "Governo de Hamid Karzai"
 AFG_political_events.4.b: "Naveen"
 AFG_political_events.4.c: "Jamiat-e Islami"
 AFG_political_events.4.e: "Governo de Saleh"
 AFG_political_events.0.t: "Atta Instaura Diarquia Militar"
 AFG_political_events.0.d: "Atta Muhammad Nur, ex-comandante da resistência mujahidin, marchou com suas forças para Cabul, exigindo controle sobre certos níveis de todas as forças militares. Com a maioria dos homens migrando para sua causa, nossas opções são severamente limitadas, para dizer o mínimo."
 AFG_political_events.0.a: "Estamos de mãos atadas"
 AFG_events.8.t: "[AFG.GetNameDef] Pede Nossa Proteção"
 AFG_events.8.d: "Após décadas de instabilidade, o governo afegão teme uma reabertura da guerra ou interferência e invasão externas. O Presidente de [AFG.GetNameWithFlag], [AFG.GetLeader], visitou a Casa Branca e procurou nosso Presidente [USA.GetLeader] para firmar um tratado de defesa. Se concordarmos em protegê-los, poderemos garantir que permaneçam em nossa esfera de influência, mas também teremos a obrigação de defender [AFG.GetNameWithFlag] de ameaças externas e de ajudar a manter a estabilidade do país, especialmente combatendo a insurgência talibã £GFX_AFG_salafist_jihadism. Considerando a situação do nosso país, devemos assinar um tratado de defesa com [AFG.GetLeader]?"
 AFG_events.8.a: "Concordar em protegê-los."
 AFG_events.8.b: "Não temos tempo para isso!"
 AFG_events.9.t: "[USA.GetNameDef] Concordou em nos Proteger"
 AFG_events.9.d: "Graças aos nossos prudentes esforços diplomáticos, o Presidente de [USA.GetNameWithFlag], [USA.GetLeader], assinou formalmente um tratado de defesa com nosso Presidente [AFG.GetLeader]. Com a assinatura desse tratado, [FROM.GetNameWithFlag] não apenas nos protegerá de agressões externas, como também ajudará a manter nossa estabilidade interna."
 AFG_events.9.a: "Excelente!"
 AFG_events.10.t: "[USA.GetNameDef] Recusou-se a Assinar!"
 AFG_events.10.d: "Apesar de nosso Presidente [AFG.GetLeader] ter visitado [USA.GetNameWithFlag] em busca de assistência de segurança, [USA.GetLeader] foi evasivo quanto a qualquer tipo de tratado. [USA.GetLeader] disse em coletiva de imprensa que \"Sempre defenderemos a liberdade, a democracia e os direitos humanos no Afeganistão.\" Mas é muito óbvio que o compromisso de [USA.GetLeader] se resume a palavras, e teremos de nos defender sozinhos."
 AFG_events.10.a: "Que visita catastrófica..."
 AFG_events.11.t: "[AFG.GetNameDef] Pede Nossa Proteção"
 AFG_events.11.d: "Após décadas de instabilidade, o governo afegão teme uma reabertura da guerra ou interferência e invasão externas. O Presidente de [AFG.GetNameWithFlag], [AFG.GetLeader], visitou Zhongnanhai e procurou o Secretário-Geral [CHI.GetLeader] para firmar um tratado de defesa. Se concordarmos em protegê-los, poderemos garantir que permaneçam em nossa esfera de influência, mas também teremos a obrigação de defender [AFG.GetNameWithFlag] de ameaças externas e de ajudar a manter a estabilidade do país, especialmente combatendo a insurgência talibã £GFX_AFG_salafist_jihadism. Considerando a situação do nosso país, devemos assinar um tratado de defesa com [AFG.GetLeader]?"
 AFG_events.11.a: "Mais um Irmão de Ferro!"
 AFG_events.11.b: "Não temos nada de sobra para um tratado!"
 AFG_events.12.t: "[CHI.GetNameDef] Concordou em nos Proteger"
 AFG_events.12.d: "Graças aos nossos esforços diplomáticos, o Secretário-Geral de [CHI.GetNameWithFlag], [CHI.GetLeader], assinou formalmente um tratado de defesa com nosso Presidente [AFG.GetLeader]. Com a assinatura desse tratado, [FROM.GetNameWithFlag] não apenas nos protegerá de agressões externas, como também ajudará a manter nossa estabilidade interna."
 AFG_events.12.a: "Excelente!"
 AFG_events.13.t: "[CHI.GetNameDef] Recusou-se a Assinar!"
 AFG_events.13.d: "Apesar de nosso Presidente [AFG.GetLeader] ter visitado [CHI.GetNameWithFlag] em busca de assistência de segurança, [CHI.GetLeader] foi evasivo quanto a qualquer tipo de tratado. [CHI.GetLeader] disse ao nosso presidente que \"Sempre estaremos comprometidos com a segurança e a estabilidade regionais.\" Mas é muito óbvio que o compromisso de [CHI.GetLeader] se resume a palavras, e teremos de nos defender sozinhos."
 AFG_events.13.a: "Que decepção..."
 AFG_events.14.t: "[AFG.GetNameDef] Denuncia Publicamente a Linha Durand"
 AFG_events.14.d: "Há poucos instantes, o presidente de [AFG.GetNameWithFlag], [AFG.GetLeader], anunciou que [AFG.GetNameWithFlag] jamais reconhecerá a Linha Durand, traçada arbitrariamente pelos britânicos no século XIX como fronteira entre os dois países, e declarou em alto e bom som que \"Talvez não possamos retomar nossa sagrada terra pashtun neste momento, mas nossos descendentes nas próximas gerações certamente retomarão esta terra, que é nossa por direito. O tempo dirá!\" Ficou muito claro que [AFG.GetNameWithFlag] está agora adotando uma política externa hostil contra o nosso país."
 AFG_events.14.a: "Não há absolutamente nenhuma justificativa para eles fazerem isso!"
 AFG_events.15.t: "Assassinato de Burhanuddin Rabbani"
 AFG_events.15.d: "Esta noite, Burhanuddin Rabbani foi assassinado em um atentado suicida em sua casa em Cabul, no dia de seu 71º aniversário. Dois homens que se passavam por representantes do Talibã aproximaram-se dele para oferecer um abraço, e um deles detonou os explosivos escondidos em seu turbante. O homem-bomba afirmou ser um comandante talibã e disse trazer uma mensagem muito importante e positiva dos líderes talibãs no Paquistão. Disseram que o Talibã queria discutir a paz com Rabbani. Outros quatro membros do Alto Conselho de Paz do nosso governo também morreram na explosão. Nossas fontes confirmaram que a Shura de Quetta, a liderança talibã escondida em Quetta, no Paquistão, é responsável por esse assassinato.\n\nRabbani presidiu o Alto Conselho de Paz de nossa nação depois de deixar um papel de destaque no governo. Durante esse período, ele convenceu com sucesso centenas de militantes talibãs a deporem as armas pacificamente. O assassinato é um golpe duro no processo de paz do nosso país, pois será difícil encontrar alguém com seu prestígio para ocupar esse cargo."
 AFG_events.15.a: "Realizar um funeral de Estado."
 AFG_events.16.t: "[AFG.GetNameDef] Busca Reconhecimento de Neutralidade"
 AFG_events.16.d: "Recentemente, [AFG.GetNameDef] optou por seguir um caminho de neutralidade para se tornar uma nação neutra permanente. Eles demonstraram disposição de cumprir as obrigações de um país permanentemente neutro, mas resta saber se serão cumpridas.\n\nO governo do Afeganistão busca agora que nosso país se torne fiador de seu status de país neutro. Se aceitarmos, teremos a obrigação de proteger o Afeganistão caso ele seja invadido. Se recusarmos, outros países poderão garantir seu status e nada teremos a perder com isso."
 AFG_events.16.a: "Concordar em garantir seu status de potência neutra"
 AFG_events.16.b: "Não temos tempo para o Afeganistão"
 AFG_events.17.t: "[FROM.GetNameDef] garante nosso Status de Neutralidade"
 AFG_events.17.d: "O comunicado do governo [FROM.GetAdjective] afirma que [FROM.GetNameDef] está disposto a garantir nosso status de neutralidade e virá em nossa defesa em caso de invasão externa ao nosso país.\n\nIsso é uma conquista significativa, pois obtivemos o reconhecimento de nosso status de neutralidade de pelo menos um membro permanente do Conselho de Segurança das Nações Unidas."
 AFG_events.17.a: "Excelente!"
 AFG_events.18.t: "Povo afegão se revolta contra o Talibã"
 AFG_events.18.d: "Após a Operação Liberdade Duradoura, várias milícias tribais e de minorias étnicas lançaram levantes contra o Talibã, notadamente em Herat. Com a ajuda dos Estados Unidos e do Irã, essas milícias tomaram o controle de várias áreas do Talibã e se juntaram ao comando da Aliança do Norte.\n\nO levante foi recebido com tiros comemorativos por parte dos moradores locais, e algumas comemorações incluíram até 'dançar nos telhados' e buzinar carros. Mohammad Ismail Khan, um dos principais comandantes da Aliança do Norte, também conhecido como o \"Leão de Herat\", concedeu anistia a ex-combatentes do Talibã, mas alertou sobre represálias caso esses combatentes voltassem a pegar em armas."
 AFG_events.18.a: "A vitória está próxima!"
 AFG_news.7.t: "[AFG.GetNameDef] anuncia reivindicações sobre território paquistanês"
 AFG_news.7.d: "Há poucos instantes, o presidente [AFG.GetLeader] de [AFG.GetNameWithFlag] anunciou que [AFG.GetNameWithFlag] jamais reconhecerá a Linha Durand, arbitrariamente estabelecida pelos britânicos no século XIX como fronteira entre os dois países, e declarou em alto e bom som: \"Talvez não possamos recuperar nossa sagrada terra pashtun no momento, mas nossos descendentes nas próximas gerações certamente recuperarão esta terra, que é nossa por direito. O tempo dirá!\" O presidente [PAK.GetLeader] de [PAK.GetNameWithFlag] respondeu rejeitando todas as reivindicações feitas por [AFG.GetLeader] e criticou duramente a ação, afirmando que \"As ações diplomáticas hostis de [AFG.GetLeader] não farão nada além de prejudicar ainda mais a relação entre nossos dois países.\" e pediu que o governo afegão respeite o direito internacional. Está muito claro que as relações diplomáticas entre os dois países se deterioraram ainda mais."
 AFG_news.7.a: "Vamos ver o que acontece a seguir."
 AFG_news.8.t: "Golpe no Afeganistão"
 AFG_news.8.d: "Devido à corrupção do governo central, à privação econômica e à pobreza da população, muitos afegãos que perderam seu sustento e estavam desiludidos com o status quo se juntaram ao £GFX_AFG_kingdom Hezb-e Islami de Hekmatyar. Um grupo de oficiais militares afegãos que não recebiam salário havia muito tempo deu um golpe, derrubando o governo republicano, declarando a suspensão da atual constituição afegã e a imposição temporária de controle militar. Gulbuddin Hekmatyar, que serviu duas vezes como Primeiro-Ministro do Afeganistão na década de 1990, encerrou oficialmente seu exílio e retornou ao Afeganistão como o novo Presidente do país. Hekmatyar prometeu erradicar a corrupção, reviver a economia e conduzir o povo afegão a um novo capítulo. Em resposta ao golpe, um porta-voz do Talibã emitiu um comunicado afirmando que \"Nós somos os verdadeiros afegãos e continuaremos a derrubar Hekmatyar, o \"Açougueiro de Cabul\"\"."
 AFG_news.8.a: "Mais um capítulo na guerra sem fim..."
 AFG_news.9.t: "[AFG.GetNameDef] mobiliza militares nas cidades"
 AFG_news.9.d: "Devido às recentes políticas radicais da liderança de [AFG.GetLeader], como a repressão às liberdades políticas e pessoais, a Lei Sharia ao estilo talibã e a remoção da influência tribal, iniciou-se um grande protesto contra o governo; o governo de [AFG.GetLeader] respondeu enviando tropas a cidades e vilas, e alguns manifestantes foram mortos a tiros por soldados do Exército Nacional Afegão ou por unidades da Polícia Nacional Afegã. Parece que [AFG.GetNameDef] está mergulhando no totalitarismo."
 AFG_news.9.a: "Essa é a vida cotidiana no Afeganistão..."
 AFG_news.10.t: "Assassinato de Burhanuddin Rabbani"
 AFG_news.10.d: "Burhanuddin Rabbani foi assassinado em um atentado suicida esta noite em sua casa em Cabul. Dois homens-bomba que se passavam por representantes do Talibã e diziam querer discutir a paz com Rabbani se aproximaram dele para lhe dar um abraço, e um deles detonou seus explosivos dentro do turbante. Outros quatro membros do Alto Conselho de Paz do Afeganistão também morreram na explosão.\n\nRabbani presidia o Alto Conselho de Paz do Afeganistão depois de deixar um papel de destaque no governo. Durante esse período, ele convenceu com sucesso centenas de militantes do Talibã a depor suas armas pacificamente. Seu assassinato é um golpe duro para o processo de paz no Afeganistão."
 AFG_news.10.a: "Notícia trágica."
 AFG_news.11.t: "Sequestro do Voo 805 da Ariana Airlines"
 AFG_news.11.d: "Um grupo de nove homens afegãos liderados pelos irmãos Ali e Mohammed Safi, que fugiam do regime talibã, sequestrou o Voo 805 da Ariana Afghan Airlines, um Boeing 727 com matrícula YA-FAY, com 180 passageiros e 7 tripulantes a bordo. O Voo 805 era um voo doméstico de Cabul para o Aeroporto de Mazar-i-Sharif.\n\nOs sequestradores forçaram a tripulação a voar para o Aeroporto de Londres Stansted, no Reino Unido, após escalas em Tashkent, Aktobe e Moscou. O cerco à aeronave durou até 10 de fevereiro. Não se sabe se os sequestradores serão condenados, pois aguardam julgamento no próximo ano."
 AFG_news.11.a: "Deveríamos tê-los interceptado com um de nossos MiGs."
 AFG_news.12.t: "Sequestro do Voo 805 da Ariana Airlines"
 AFG_news.12.d: "Um grupo de nove homens afegãos liderados pelos irmãos Ali e Mohammed Safi, que fugiam do regime talibã, sequestrou o Voo 805 da Ariana Afghan Airlines, um Boeing 727 com matrícula YA-FAY, com 180 passageiros e 7 tripulantes a bordo. O Voo 805 era um voo doméstico de Cabul para o Aeroporto de Mazar-i-Sharif.\n\nOs sequestradores forçaram a tripulação a voar para o Aeroporto de Londres Stansted, no Reino Unido, após escalas em Tashkent, Aktobe e Moscou. O cerco à aeronave durou até 10 de fevereiro. Não se sabe se os sequestradores serão condenados, pois aguardam julgamento no próximo ano."
 AFG_news.12.a: "Interessante"
 AFG_news.12.b: "O terrorismo é um flagelo para a humanidade."
 AFG_news.13.t: "Irã envia refugiados de volta ao Afeganistão"
 AFG_news.13.d: "Após chegar a um acordo com o ACNUR, o Irã iniciou um programa de repatriação que enviará 7.700 refugiados afegãos de volta à sua terra natal nas próximas três semanas."
 AFG_news.13.a: "Haverá um fim para esta guerra?"
 AFG_news.14.t: "Guerra no Afeganistão deixa milhares passando fome"
 AFG_news.14.d: "O Programa Mundial de Alimentos relatou que a situação de seca nas províncias de Kandahar e Zabul era desesperadora. O povo Koochi havia perdido até 80% de seu gado, e os sistemas de irrigação construídos para coletar água da chuva haviam secado. Damasqueiros e amendoeiras murcharam e estavam sem frutos. Camelos estavam morrendo. Desde fevereiro, o PMA vinha alimentando 30.000 famílias na região e planejava incluir outras 10.000 famílias em maio. O PMA oferecia farinha adicional aos afegãos como incentivo para que permanecessem em suas aldeias."
 AFG_news.14.a: "O povo afegão precisa de nós."
 AFG_events.32.t: "O Castelo chamado Taloqan caiu"
 AFG_events.32.d: "A captura implacável pelo Talibã provocou um êxodo em massa, com civis fugindo em direção a Imam Sahib e ao Vale do Panjshir. Após um cerco brutal que custou centenas de vidas civis, nossos soldados detiveram o avanço do Talibã ao norte e a leste da cidade, mas não conseguiram retomá-la. Abandonamos nosso quartel-general da Aliança do Norte na cidade e transferimos nossa base de operações para Fayzabad."
 AFG_events.32.a: "Um dia sombrio"
 AFG_events.31.t: "Taloqan resiste para lutar mais um dia"
 AFG_events.31.d: "Após suportar um cerco brutal, o Talibã enfrentou a derrota. Este triunfo ecoa a resiliência das vitórias que vieram antes. Que seja mais um passo rumo ao fim definitivo do Talibã, pois \"Talaqan é um lugar de tesouros de Alá. Esses tesouros não são de ouro e prata, mas consistem em pessoas que reconheceram Alá como deveriam.\""
 AFG_events.31.a: "Um dia sombrio"
 AFG_investment.1.t: "[AFG.GetNameDef] nos convida a investir em seus projetos"
 AFG_investment.1.desc: "Recém-recuperado da guerra contra o Talibã, o governo de [AFG.GetNameWithFlag] nos convida a investir em alguns dos projetos de seu país. No entanto, investir ou não depende de nós. Se optarmos por investir, poderemos obter alguma influência sobre seu governo; se a ameaça terrorista continuar alta no Afeganistão, é melhor não arriscar."
 AFG_investment.1.a: "Investir na infraestrutura deles!"
 AFG_investment.1.b: "Investir na indústria civil deles!"
 AFG_investment.1.c: "Investir no setor de serviços deles!"
 AFG_investment.1.d: "É melhor não arriscar."
 AFG_investment.2.t: "[FROM.GetNameDef] investiu em nossa Infraestrutura!"
 AFG_investment.2.d: "Após dias de negociações, [FROM.GetNameWithFlag] concordou em investir em nossa infraestrutura em troca de algumas concessões mínimas. O investimento beneficiará nossa população rural."
 AFG_investment.2.a: "Somos gratos pela ajuda deles!"
 AFG_investment.3.t: "[FROM.GetNameDef] investiu em nossa Indústria Civil!"
 AFG_investment.3.d: "Após dias de negociações, [FROM.GetNameWithFlag] concordou em nos ajudar a construir algumas fábricas civis em troca de algumas concessões menores. O investimento beneficiará o setor industrial de nosso país e facilitará a modernização da nação."
 AFG_investment.3.a: "Somos gratos pela ajuda deles!"
 AFG_investment.4.t: "[FROM.GetNameDef] investiu em nosso Setor de Serviços!"
 AFG_investment.4.d: "Após dias de negociações, [FROM.GetNameWithFlag] concordou em investir em nosso setor de serviços construindo alguns escritórios em troca de algumas concessões menores. O investimento beneficiará o setor financeiro de nosso país e facilitará a modernização da nação."
 AFG_investment.4.a: "Somos gratos pela ajuda deles!"
 AFG_investment.5.t: "[FROM.GetNameDef] recusou-se a investir!"
 AFG_investment.5.d: "Após dias de negociações, [FROM.GetNameWithFlag] rejeitou nosso convite de investimento, alegando que o ambiente de negócios em nosso país ainda não é seguro o bastante e que avaliará com cautela futuros acordos de investimento conosco."
 AFG_investment.5.a: "Parece que precisamos trabalhar mais!"
 AFG_taliban_insurgency.0.t: "O início da insurgência talibã"
 AFG_taliban_insurgency.0.d: "Após o colapso da principal força talibã, seus batalhões se fragmentaram em diversas células dissidentes e passaram a travar uma guerra de guerrilha em todos os cantos do Afeganistão, além de lançar ataques terroristas flagrantes. Estima-se que a insurgência levará anos para ser devidamente contida, mas, se não agirmos diante da situação, simplesmente nunca teremos estabilidade em nosso país."
 AFG_taliban_insurgency.0.a: "É hora de arregaçar as mangas!"
 AFG_taliban_insurgency.1.t: "Sucesso na incursão a um esconderijo talibã"
 AFG_taliban_insurgency.1.d: "Graças às nossas corajosas unidades de comando, o esconderijo talibã que encontramos foi destruído; alguns militantes talibãs tentaram resistir, mas foram mortos por nossos comandos, enquanto a maioria se rendeu e pouquíssimos escaparam da justiça. No geral, a operação foi um sucesso completo!"
 AFG_taliban_insurgency.1.a: "Excelente!"
 AFG_taliban_insurgency.2.t: "Fracasso da incursão"
 AFG_taliban_insurgency.2.d: "Não conseguir concluir a incursão foi um enorme golpe para nossa unidade de comando antiterrorista. O Talibã parecia conhecer nossos planos com antecedência e lançou um ataque preventivo contra alguns de nossos comboios, plantando IEDs na rota obrigatória e emboscando nossos comandos após a explosão. Infelizmente, vários comandos morreram.\n\nNo relatório pós-operação, alguns generais suspeitam que possa haver simpatizantes entre os organizadores da operação que teriam vazado o plano ao Talibã; o relatório também criticou a corrupção do governo, que pode ter levado à perda das vidas dos comandos. Precisamos analisar esse fracasso e aprender a lição!"
 AFG_taliban_insurgency.2.a: "Descansem em paz, nossos heróis!"
 AFG_taliban_insurgency.3.t: "Ataque aéreo bem-sucedido"
 AFG_taliban_insurgency.3.d: "Boas notícias! A aeronave de contrainsurgência de nossa força aérea, pilotada por um de nossos hábeis militares, destruiu com sucesso um acampamento talibã com base em coordenadas fornecidas por nossa agência de inteligência; o acampamento talibã foi completamente destruído, e muitos militantes talibãs foram mortos.\n\nEsse sucesso demonstrou a eficácia do setor de segurança interna de nossa agência de inteligência e prova que a tecnologia é vital em futuras operações de contrainsurgência."
 AFG_taliban_insurgency.3.a: "Um grande sucesso!"
 AFG_taliban_insurgency.4.t: "Falha em ataque aéreo mata civis"
 AFG_taliban_insurgency.4.d: "Notícias terríveis! Nossa força aérea bombardeou um alvo com base em coordenadas fornecidas por nossa agência de inteligência, mas agora é evidente que as bombas atingiram alvos civis e mataram civis inocentes em vez dos combatentes talibãs pretendidos.\n\nA população local está de luto e, com razão, indignada com essa operação fracassada; já há relatos de protestos na região. Precisamos analisar os motivos do fracasso dessa operação para dar uma explicação aos nossos cidadãos."
 AFG_taliban_insurgency.4.a: "Uma tragédia!"
 AFG_taliban_insurgency.5.t: "Aeronave abatida por militantes talibãs"
 AFG_taliban_insurgency.5.d: "Notícias trágicas da operação de ataque aéreo! Uma de nossas aeronaves de contrainsurgência foi abatida por militantes talibãs com um míssil antiaéreo portátil; o piloto morreu.\n\nEsse fracasso operacional mostrou que precisamos reorganizar nossa força aérea para futuras operações e obter melhor inteligência sobre nossos alvos talibãs."
 AFG_taliban_insurgency.5.a: "Um piloto heroico, descanse em paz!"
 AFG_taliban_insurgency.6.t: "Sucesso da propaganda de unidade"
 AFG_taliban_insurgency.6.d: "Graças aos nossos esforços de propaganda de unidade, alguns combatentes talibãs se apresentaram em nossos postos de controle policiais e militares e depuseram suas armas; alguns abraçaram nossos soldados e a polícia local. Nossos soldados e policiais não lhes causaram muitos problemas; ao contrário, deram a muitos dos militantes talibãs que depuseram as armas algum dinheiro para a viagem de volta para casa. Isso aumentou a confiança pública no governo e a unidade nacional."
 AFG_taliban_insurgency.6.a: "Um desdobramento bem-sucedido!"
 AFG_taliban_insurgency.7.t: "Fracasso da propaganda de unidade"
 AFG_taliban_insurgency.7.d: "Foi extremamente decepcionante para o nosso governo que o recente esforço de propaganda de unidade não tenha dado resultados positivos. Segundo alguns comandantes talibãs de baixo escalão, a liderança talibã vê o atual governo afegão como um governo de ladrões, um fantoche de um governo estrangeiro e nada representativo da nação afegã. Eles se consideram os verdadeiros afegãos."
 AFG_taliban_insurgency.7.a: "Talvez precisemos fazer mais da nossa parte..."
 AFG_taliban_insurgency.8.t: "A eliminação da insurgência talibã"
 AFG_taliban_insurgency.8.d: "Há algumas horas, o governo afegão confirmou oficialmente que eliminou com sucesso a insurgência talibã. Segundo informações divulgadas pelo governo afegão, a grande maioria dos talibãs depôs as armas pacificamente e voltou para casa.\n\nAlguns militantes talibãs empedernidos fugiram pela fronteira afegão-paquistanesa para as áreas tribais do Paquistão e se juntaram a grupos militantes locais da região. Como o governo afegão construiu medidas de segurança suficientes ao longo da fronteira afegão-paquistanesa, é improvável que os militantes entrincheirados no Paquistão consigam se infiltrar de volta pela fronteira."
 AFG_taliban_insurgency.8.a: "O longo conflito finalmente chegou ao fim?"
 AFG_taliban_insurgency.10.t: "Talibã lança insurgência em larga escala"
 AFG_taliban_insurgency.10.d: "O recente aumento nos ataques do Talibã e na violência deu ao grupo a oportunidade de escalar a insurgência para uma guerra civil mais uma vez. O Talibã tomou uma grande extensão de território rural, formando um importante reduto no sudoeste, além de outras áreas rurais que caíram sob seu domínio.\n\nUma pequena parte do Exército Nacional Afegão viu soldados desertarem, e alguns desses desertores se juntaram ao Talibã; a maioria optou por ficar e resistir ao Talibã por medo de ser liquidada por eles.\n\nSe a comunidade internacional nos apoiará, permanece incerto, mas devemos mobilizar nossos soldados e lutar até a vitória."
 AFG_taliban_insurgency.10.a: "Não temos escolha a não ser lutar!"
 AFG_taliban_insurgency.11.t: "Talibã lança insurgência em larga escala"
 AFG_taliban_insurgency.11.d: "O recente aumento nos ataques do Talibã e na violência deu ao grupo a oportunidade de escalar a insurgência para uma guerra civil mais uma vez. O Talibã tomou uma grande extensão de território rural, formando um importante reduto no sudoeste, além de outras áreas rurais que caíram sob seu domínio.\n\nUma pequena parte do Exército Nacional Afegão viu soldados desertarem, e alguns desses desertores se juntaram ao Talibã; a maioria optou por ficar e resistir ao Talibã por medo de ser liquidada por eles.\n\nO líder afegão [AFG.GetLeader] anunciou que a insurgência será esmagada e prometeu que lutará até que a paz seja alcançada."
 AFG_taliban_insurgency.11.a: "O Afeganistão está em guerra novamente..."
 AFG_taliban_insurgency.14.t: "A situação no Afeganistão"
 AFG_taliban_insurgency.14.d: "Sabemos que o governo afegão nos permitiu estacionar tropas em seu território, mas nossa agência de inteligência militar alerta que o Talibã está travando uma insurgência em todos os cantos do Afeganistão e que há uma infinidade de outros grupos terroristas aproveitando-se da situação instável no país. A ameaça terrorista atingiu um nível crítico que pode representar um perigo real para nossas tropas ali estacionadas.\n\nSe continuarmos mantendo nossas tropas no Afeganistão, elas provavelmente serão alvo do Talibã e de outros grupos terroristas ativos no país. No entanto, se permanecermos, podemos optar por auxiliar as forças do governo afegão em suas operações de contrainsurgência. Se o fizermos, nossos militares poderão adquirir experiência valiosa, como diferentes técnicas de contrainsurgência e de combate à guerrilha, e poderão proteger nossos cidadãos no Afeganistão.\n\n[ROOT.GetLeader], se o senhor decidir continuar mantendo tropas no Afeganistão, não o impediremos, mas pense com cuidado se realmente vale o risco."
 AFG_taliban_insurgency.14.a: "Contribuiremos com os esforços de contrainsurgência afegãos."
 AFG_taliban_insurgency.14.b: "É melhor não arriscar a vida de nossos militares."
 AFG_taliban_insurgency.15.t: "[FROM.GetNameDef] se junta à nossa luta"
 AFG_taliban_insurgency.15.d: "[FROM.GetLeader], líder de [FROM.GetNameDef], informou ao nosso governo que as tropas [FROM.GetAdjective] estacionadas em nosso país estão dispostas a se juntar à nossa luta na batalha de contrainsurgência contra o Talibã, além de proteger seus cidadãos em nosso país.\n\nAlém disso, [FROM.GetName] também fornecerá assistência de segurança, como dispositivos de detecção de explosivos e outros equipamentos militares mais avançados."
 AFG_taliban_insurgency.15.a: "Somos gratos pela ajuda!"
 AFG_taliban_insurgency.16.t: "[FROM.GetNameDef] inicia a retirada de tropas"
 AFG_taliban_insurgency.16.d: "[FROM.GetLeader], líder de [FROM.GetNameDef], informou ao nosso governo que as tropas [FROM.GetAdjective] estacionadas em nosso país concluíram sua missão e os soldados estão voltando para casa.\n\nO comandante das tropas [FROM.GetAdjective] em nosso país já iniciou os processos de transferência de bases com nossos comandantes."
 AFG_taliban_insurgency.16.a: "Adeus!"
 AFG_taliban_insurgency.17.t: "Sucesso na incursão a esconderijo talibã"
 AFG_taliban_insurgency.17.d: "Graças às nossas corajosas unidades de comando, o esconderijo talibã que encontramos foi destruído; alguns militantes talibãs tentaram resistir, mas foram mortos por nossos comandos, enquanto a maioria se rendeu e pouquíssimos escaparam da justiça. No geral, a operação foi um sucesso completo!"
 AFG_taliban_insurgency.17.a: "Excelente!"
 AFG_taliban_insurgency.18.t: "Fracasso da incursão"
 AFG_taliban_insurgency.18.d: "Não conseguir concluir a incursão foi um enorme golpe para nossa unidade de comando antiterrorista. O Talibã parecia conhecer nossos planos com antecedência e lançou um ataque preventivo contra alguns de nossos comboios, plantando IEDs na rota obrigatória e emboscando nossos comandos após a explosão. Infelizmente, vários comandos morreram.\n\nNo relatório pós-operação, alguns generais suspeitam que possa haver simpatizantes entre os organizadores da operação que teriam vazado o plano ao Talibã; o relatório também criticou a corrupção do governo, que pode ter levado à perda das vidas dos comandos. Precisamos analisar esse fracasso e aprender a lição!"
 AFG_taliban_insurgency.18.a: "Descansem em paz!"
 AFG_taliban_insurgency.21.t: "Ataque de drone bem-sucedido"
 AFG_taliban_insurgency.21.d: "Nosso ataque de drone contra o Talibã foi um sucesso! Nosso drone conseguiu localizar, atacar e destruir vários esconderijos talibãs perto de uma zona urbana, prejudicando suas capacidades militares na região e deixando temporariamente sua estrutura de liderança local completamente desorganizada.\n\nEmbora assustada com o ataque de drone no início, a população local agora comemora a retirada dos insurgentes talibãs, ao menos por enquanto."
 AFG_taliban_insurgency.21.a: "Drones são o futuro da guerra!"
 AFG_taliban_insurgency.22.t: "Ataque de drone fracassado mata civis"
 AFG_taliban_insurgency.22.d: "Hoje, um de nossos drones atacou e destruiu o que parecia ser um esconderijo talibã perto de uma área residencial, mas relatórios recentes de inteligência concluíram que o prédio atingido era, na verdade, um pequeno edifício de apartamentos ocupado por civis.\n\nRepórteres da imprensa já cobrem o incidente e muitos grupos criticam nosso envolvimento nesta guerra."
 AFG_taliban_insurgency.22.a: "Foi um erro técnico!"
 AFG_taliban_insurgency.23.t: "Operação de bombardeio bem-sucedida"
 AFG_taliban_insurgency.23.d: "A inteligência informa que hoje um de nossos bombardeiros estratégicos destruiu um complexo de túneis talibã escondido nas montanhas do leste do Afeganistão.\n\nNossa campanha de bombardeios bem-sucedida começa a paralisar as operações talibãs nas áreas isoladas do país, e o colapso de sua infraestrutura forçará o Talibã a se render com o tempo."
 AFG_taliban_insurgency.23.a: "Os jihadistas aprenderão a temer nosso poderio aéreo!"
 AFG_taliban_insurgency.24.t: "Bombardeio equivocado mata civis"
 AFG_taliban_insurgency.24.d: "Hoje ocorreu um incidente catastrófico!\n\nNossa força aérea bombardeou uma área montanhosa no leste do Afeganistão até descobrirmos que não havia acampamentos talibãs na região, mas sim uma pequena aldeia entre as montanhas. A aldeia foi absolutamente destruída como resultado de nosso bombardeio.\n\nA credibilidade de nossa campanha aérea foi seriamente questionada. Nossos políticos e o comando militar estão sendo acusados de crimes de guerra contra o povo afegão."
 AFG_taliban_insurgency.24.a: "Isto é terrível!"
 AFG_taliban_insurgency.25.t: "[FROM.GetNameDef] fornece equipamento técnico"
 AFG_taliban_insurgency.25.d: "Uma mensagem do governo [FROM.GetAdjective] à nossa liderança afirmou que [FROM.GetNameDef] nos fornecerá equipamentos técnicos de contrainsurgência, incluindo dispositivos de detecção de explosivos que podem ser instalados em rodovias ou entradas de portas, cães treinados especificamente para detectar explosivos escondidos, além de outros equipamentos eletrônicos para melhorar a eficácia de nossos militares e policiais no combate à insurgência talibã.\n\nEspera-se que o equipamento chegue dentro de um mês e, com sorte, reduza o crescimento da insurgência talibã, ao menos por um curto período."
 AFG_taliban_insurgency.25.a: "Somos gratos pela ajuda!"
 AFG_taliban_attack.0.t: "Militantes talibãs atacam delegacia local"
 AFG_taliban_attack.0.d: "Hoje, um grupo de militantes talibãs emboscou sem aviso um dos postos de controle policiais do nosso governo. Nossas forças policiais estavam claramente despreparadas e foram pegas de surpresa; lutaram com bravura até que seus superiores deram a ordem de evacuar o posto.\n\nOs militantes talibãs tomaram o posto de controle até que os militares fossem informados e enviassem apoio às nossas forças policiais. No entanto, havia armas no arsenal do posto que foram levadas pelo Talibã. Durante o ataque, nossas forças policiais e militares mataram vários militantes talibãs, mas nossa polícia também perdeu vários bravos oficiais."
 AFG_taliban_attack.0.a: "Eles vão pagar por isso!"
 AFG_taliban_attack.1.t: "Talibã afegão ataca delegacia"
 AFG_taliban_attack.1.d: "Hoje, um grupo de militantes do Talibã afegão emboscou sem aviso um dos postos de controle policiais do governo afegão. As forças policiais afegãs estavam claramente despreparadas e foram pegas de surpresa, mas lutaram com bravura até que seus superiores deram a ordem de evacuar o posto.\n\nOs militantes talibãs tomaram o posto de controle até que os militares afegãos fossem informados e enviassem apoio à polícia. No entanto, havia armas no arsenal do posto que foram levadas pelo Talibã. Durante o ataque, as forças policiais e militares afegãs mataram vários militantes talibãs, mas a polícia também perdeu vários bravos oficiais."
 AFG_taliban_attack.1.a: "Um desdobramento problemático."
 AFG_taliban_attack.2.t: "Talibã realiza atentado a ônibus"
 AFG_taliban_attack.2.d: "Hoje, um grupo de militantes talibãs forçou um ônibus a parar com um caminhão, usou Kalashnikovs para atirar nos civis a bordo e depois detonou um carro-bomba perto do ônibus. Após a chegada da polícia militar, os militantes talibãs fugiram do local; alguns foram baleados e mortos, enquanto os poucos que não escaparam foram capturados e levados à polícia militar para interrogatório.\n\nPelos resultados do interrogatório e da investigação posterior, sabemos que o ataque terrorista visou deliberadamente turistas e estrangeiros. O Talibã ofereceu uma recompensa por matar estrangeiros no Afeganistão. O ataque também causou vítimas entre cidadãos estrangeiros, e os países dos afetados já exigem que nosso governo realize uma investigação completa do ataque."
 AFG_taliban_attack.2.a: "Devemos caçar esses terroristas talibãs!"
 AFG_taliban_attack.3.t: "Atentado talibã a ônibus mata nossos cidadãos"
 AFG_taliban_attack.3.d: "Hoje, um grupo de militantes do Talibã afegão forçou um ônibus a parar com um caminhão, usou Kalashnikovs para atirar nos civis a bordo e depois detonou um carro-bomba perto do ônibus. Após a chegada da polícia militar afegã, os militantes talibãs fugiram do local; alguns foram baleados e mortos, enquanto os poucos que não escaparam foram capturados e levados à polícia militar para interrogatório.\n\nO ataque também causou vítimas entre nossos cidadãos; nosso embaixador no Afeganistão entrou em contato com autoridades afegãs para tentar lidar com as consequências."
 AFG_taliban_attack.3.a: "Enviar nossas condolências às famílias das vítimas!"
 AFG_taliban_attack.4.t: "Estrangeiros mortos em atentado talibã a ônibus"
 AFG_taliban_attack.4.d: "Hoje, um grupo de militantes do Talibã afegão forçou um ônibus a parar com um caminhão, usou Kalashnikovs para atirar nos civis a bordo e depois detonou um carro-bomba perto do ônibus. Após a chegada da polícia militar afegã, os militantes talibãs fugiram do local; alguns foram baleados e mortos, enquanto os poucos que não escaparam foram capturados e levados à polícia militar para interrogatório.\n\nO ataque causou vítimas entre afegãos locais e cidadãos estrangeiros e provocou ampla condenação da comunidade internacional."
 AFG_taliban_attack.4.a: "Enviar nossas condolências às vítimas!"
 AFG_taliban_attack.5.t: "Talibã ataca comboio de caminhões-tanque"
 AFG_taliban_attack.5.d: "Hoje, militantes talibãs atacaram um comboio de caminhões de combustível que deveria entregar combustível vital aos militares e à polícia militar. Os militantes incendiaram os caminhões-tanque e os motoristas foram sequestrados pelo Talibã. O paradeiro desses motoristas é, por ora, desconhecido.\n\nAinda não há relatos de vítimas entre os moradores locais, mas os caminhões-tanque ficaram completamente carbonizados e as estradas próximas foram totalmente fechadas pelos militares por segurança. Prevê-se que levará algum tempo para que a vida volte ao normal na área para os moradores locais."
 AFG_taliban_attack.5.a: "Devemos resgatar esses motoristas!"
 AFG_taliban_attack.6.t: "Talibã afegão incendeia caminhões-tanque"
 AFG_taliban_attack.6.d: "Hoje, militantes do Talibã afegão atacaram um comboio de caminhões de combustível que deveria entregar combustível vital aos militares e à polícia militar. Os militantes incendiaram os caminhões-tanque e os motoristas foram sequestrados pelo Talibã. O paradeiro desses motoristas é, por ora, desconhecido.\n\nAinda não há relatos de vítimas entre os moradores locais, mas os caminhões-tanque ficaram completamente carbonizados e as estradas próximas foram totalmente fechadas pelos militares por segurança. Prevê-se que levará algum tempo para que a vida volte ao normal na área para os moradores locais."
 AFG_taliban_attack.6.a: "O Afeganistão é de fato um lugar perigoso..."
 AFG_taliban_attack.7.t: "Talibã ataca comboio militar"
 AFG_taliban_attack.7.d: "Hoje, militantes talibãs lançaram um chocante ataque suicida com bomba contra um de nossos comboios militares. Os militantes dirigiram dois carros e detonaram ambos os veículos ao se aproximarem dos caminhões militares.\n\nO ataque suicida resultou na destruição de vários caminhões militares pela onda de choque da explosão e causou diversas baixas entre nossos soldados; felizmente, nossos soldados sofreram em sua maioria apenas ferimentos, enquanto os militantes talibãs envolvidos no ataque morreram imediatamente com suas próprias bombas."
 AFG_taliban_attack.7.a: "Precisamos aumentar a inspeção de veículos!"
 AFG_taliban_attack.8.t: "Ataque suicida do Talibã atinge militares afegãos"
 AFG_taliban_attack.8.d: "Hoje, militantes do Talibã afegão lançaram um chocante ataque suicida com bomba contra um dos comboios militares do Afeganistão. Os militantes dirigiram dois carros e detonaram ambos os veículos ao se aproximarem dos caminhões militares.\n\nO ataque suicida resultou na destruição de vários caminhões militares pela onda de choque da explosão e causou diversas baixas entre os soldados do exército afegão; os militantes talibãs envolvidos no ataque morreram imediatamente com suas próprias bombas."
 AFG_taliban_attack.8.a: "Como os militares afegãos deixaram isso acontecer?"
 AFG_taliban_attack.9.t: "Talibã ataca tropas estrangeiras"
 AFG_taliban_attack.9.d: "Hoje, um militante talibã disfarçado de morador local aproximou-se silenciosamente de um comboio de tropas estrangeiras enviadas ao nosso país e detonou uma bomba escondida em seu turbante. Embora ninguém tenha se ferido na primeira explosão, outro grupo de militantes talibãs aproveitou o caos criado pela explosão e usou RPGs para disparar foguetes contra as tropas estrangeiras.\n\nA situação se acalmou após a chegada de reforços militares, mas, infelizmente, o ataque resultou em muitas baixas e vários veículos militares foram destruídos."
 AFG_taliban_attack.9.a: "Droga"
 AFG_taliban_attack.10.t: "Nossos militares mortos em ataque talibã"
 AFG_taliban_attack.10.d: "Hoje, um militante talibã disfarçado de morador local aproximou-se silenciosamente de um comboio de tropas estrangeiras enviadas ao nosso país e detonou uma bomba escondida em seu turbante. Embora ninguém tenha se ferido na primeira explosão, outro grupo de militantes talibãs aproveitou o caos criado pela explosão e usou RPGs para disparar foguetes contra as tropas estrangeiras.\n\nA situação se acalmou após a chegada de reforços, mas, infelizmente, o ataque resultou em muitas baixas entre nossos militares e vários veículos militares foram destruídos. Nosso comandante local tem mantido contato com os comandantes militares afegãos para lidar com as consequências."
 AFG_taliban_attack.10.a: "Enviar condolências aos soldados caídos!"
 AFG_taliban_attack.11.t: "Tropas estrangeiras mortas em ataque talibã"
 AFG_taliban_attack.11.d: "Hoje, um militante talibã disfarçado de morador local aproximou-se silenciosamente de um comboio de tropas estrangeiras enviadas ao nosso país e detonou uma bomba escondida em seu turbante. Embora ninguém tenha se ferido na primeira explosão, outro grupo de militantes talibãs aproveitou o caos criado pela explosão e usou RPGs para disparar foguetes contra as tropas estrangeiras.\n\nA situação se acalmou após a chegada de reforços militares, mas o ataque resultou em muitas baixas e vários veículos militares foram destruídos."
 AFG_taliban_attack.11.a: "Por que eles não conseguem eliminar o Talibã?"
 AFG_taliban_attack.12.t: "Talibã lança atentado a edifício"
 AFG_taliban_attack.12.d: "Hoje, um edifício foi abalado por uma explosão enorme em um dos prédios que abrigam escritórios de investidores estrangeiros; os resultados da investigação posterior determinaram que a bomba provavelmente foi feita com uma série de projéteis de artilharia roubados ou extraviados de um arsenal do Exército Nacional Afegão. Desde então, o Talibã assumiu a responsabilidade pelo atentado.\n\nHá estrangeiros entre os mortos, e autoridades do nosso governo têm mantido contato com seus embaixadores para lidar com as consequências."
 AFG_taliban_attack.12.a: "Isso vai prejudicar nossa imagem nacional!"
 AFG_taliban_attack.13.t: "Nossos empreiteiros mortos em atentado talibã"
 AFG_taliban_attack.13.d: "Hoje, um edifício foi abalado por uma explosão enorme em um dos prédios que abrigam escritórios de um de nossos empreiteiros; os resultados da investigação posterior determinaram que a bomba provavelmente foi feita com uma série de projéteis de artilharia roubados ou extraviados de um arsenal do Exército Nacional Afegão. Desde então, o Talibã assumiu a responsabilidade pelo atentado.\n\nAlguns de nossos cidadãos estão entre as vítimas, e nosso embaixador no Afeganistão tem mantido contato com autoridades do governo afegão para lidar com as consequências."
 AFG_taliban_attack.13.a: "Eles precisam proteger nossos investidores!"
 AFG_taliban_attack.14.t: "Estrangeiros mortos em atentado talibã a edifício"
 AFG_taliban_attack.14.d: "Hoje, um edifício foi abalado por uma explosão enorme em um dos prédios que abrigam escritórios de empreiteiros estrangeiros em uma grande cidade do Afeganistão; os resultados da investigação posterior determinaram que a bomba provavelmente foi feita com uma série de projéteis de artilharia roubados ou extraviados de um arsenal do Exército Nacional Afegão. Desde então, o Talibã assumiu a responsabilidade pelo atentado.\n\nHá cidadãos estrangeiros entre as vítimas, e autoridades do governo afegão têm mantido contato com os embaixadores dos países afetados para lidar com as consequências."
 AFG_taliban_attack.14.a: "Por que algum país investiria no Afeganistão?"
 AFG_taliban_attack.15.t: "Talibã bombardeia aeroporto"
 AFG_taliban_attack.15.d: "Hoje, um de nossos aeroportos de uso duplo foi atingido por um carro-bomba quando um caminhão carregando um dispositivo explosivo arrombou a barreira de proteção na entrada do aeroporto e detonou o artefato instalado no veículo. A explosão causou danos significativos ao campo de pouso devido ao rendimento explosivo extremamente alto da bomba. Pouco depois dos primeiros relatos, a rede Haqqani, o ramo mais radical do Talibã, assumiu a responsabilidade pelo ataque.\n\nO ataque deixou um grande número de vítimas entre as equipes de solo e os passageiros que aguardavam no terminal. Nossos serviços de segurança foram pegos completamente de surpresa, e o público pergunta como um caminhão repleto de explosivos conseguiu chegar aos portões de um campo de pouso vigiado."
 AFG_taliban_attack.15.a: "Os terroristas talibãs precisam ser caçados!"
 AFG_taliban_attack.16.t: "Grande ataque a aeroporto no Afeganistão"
 AFG_taliban_attack.16.d: "Hoje, um dos aeroportos de uso duplo do Afeganistão foi atingido por um carro-bomba quando um caminhão carregando um dispositivo explosivo arrombou a barreira de proteção na entrada do aeroporto e detonou o artefato instalado no veículo. A explosão causou danos significativos ao aeroporto devido ao rendimento explosivo extremamente alto da bomba. Pouco depois dos primeiros relatos, a rede Haqqani, o ramo mais radical do Talibã, assumiu a responsabilidade pelo ataque.\n\nO ataque resultou em um grande número de vítimas, mas não há relatos de cidadãos [ROOT.GetAdjective] mortos ou feridos no Afeganistão. Nosso líder [ROOT.GetLeader] enviou condolências a [AFG.GetLeader] pelo ataque e condenou veementemente as ações do Talibã."
 AFG_taliban_attack.16.a: "A insurgência talibã atingiu um nível crítico!"
 AFG_news.17.t: "Levante anti-Talibã no Afeganistão"
 AFG_news.17.d: "Após a Operação Liberdade Duradoura, Herat testemunha uma onda de resistência enquanto milícias locais, auxiliadas pelos EUA e pelo Irã, desafiam o controle talibã. Cenas de comemoração tomam as ruas conforme as milícias ocupam áreas-chave e se alinham à Aliança do Norte. O \"Leão de Herat\", Mohammad Ismail Khan, oferece anistia a ex-combatentes do Talibã, mas alerta contra futuras hostilidades. Os levantes marcam um momento decisivo na luta do Afeganistão por estabilidade."
 AFG_news.17.a: "Reviravolta interessante"
 AFG_events.27.t: "O papel das mulheres"
 AFG_events.27.d: "Embora o conceito do papel das mulheres em nossa sociedade possa parecer pouco convencional, o Estado tem ideias variadas sobre como avançar."
 AFG_events.27.a: "Elas devem desempenhar um papel mais tradicional"
 AFG_events.27.b: "Vamos dar a elas um papel"
 AFG_events.28.t: "O papel da religião"
 AFG_events.28.d: "O papel da religião e a questão de se o Afeganistão deve se abrir ou manter sua estrita adesão ao Islã sunita é um assunto controverso."
 AFG_events.28.a: "Permaneceremos fechados"
 AFG_events.28.b: "Devemos nos abrir"
 AFG_events.35.t: "Ponte aérea para a Aliança do Norte"
 AFG_events.35.d: "Em meio ao conflito em curso no Afeganistão, a Rússia se vê envolvida nos assuntos da região. Desde 1996, o governo russo tem apoiado discretamente a Aliança do Norte, fornecendo armas e suprimentos para fortalecer a resistência do governo afegão deposto. Esse apoio nasce do temor de que o conflito se espalhe para a Ásia Central, como visto anteriormente com a OTU na guerra civil do Tajiquistão. Agora, com o Ministro da Defesa Ivanov revelando a extensão dessa ajuda, a liderança russa enfrenta uma decisão crítica: persistir em auxiliar a Aliança do Norte apesar da pressão econômica ou retirar o apoio por completo."
 AFG_events.35.a: "Pedir que os Estados Unidos arquem com o custo"
 AFG_events.35.b: "Podemos arcar com o custo"
 AFG_events.35.c: "Cortar o fluxo de ajuda"
 AFG_events.36.t: "Aliança do Norte afegã aceita sediar drones"
 AFG_events.36.d: "Com os atentados de 1998 às embaixadas dos EUA e os subsequentes ataques com mísseis dos EUA contra campos de treinamento da Al-Qaeda no Afeganistão, os Estados Unidos intensificaram os esforços para desmantelar redes terroristas, incluindo a exigência de rendição de Osama bin Laden. Uma reunião de altas autoridades de segurança nacional concordou que o Talibã receberia um ultimato para entregar bin Laden. Apesar da relutância anterior em colaborar com a Aliança do Norte, há agora uma oportunidade de ação conjunta para rastrear o paradeiro de bin Laden."
 AFG_events.36.a: "Enviar drones de vigilância "
 AFG_events.36.b: "Já cumprimos o objetivo"
 AFG_events.37.t: "Apoio ampliado à Aliança do Norte do Afeganistão"
 AFG_events.37.d: "Com o conflito no Afeganistão em plena fúria, a Aliança do Norte precisa de apoio ampliado para combater o Talibã e a Al-Qaeda. A assistência encoberta da Índia tem sido crucial, fornecendo fundos, equipamentos de radar, peças de aeronaves e apoio técnico para manter caças em operação. Com os assessores militares indianos sendo valiosos na luta contra o Talibã, sua ajuda tornou-se indispensável para os soldados de [AFG.GetLeader]."
 AFG_events.37.a: "A remoção dos aliados paquistaneses é necessária."
 AFG_events.37.b: "Não desejamos continuar esse processo."
 AFG_events.38.t: "Equipamento da ponte aérea russa chega ao Afeganistão"
 AFG_events.38.d: "Equipamento militar russo, incluindo armas, suprimentos e veículos, começou a chegar ao Afeganistão por ponte aérea. A chegada desse equipamento cria uma nova abertura na guerra."
 AFG_events.38.a: "Boas notícias"
 AFG_events.39.t: "Aprovação dos EUA para apoio de drones"
 AFG_events.39.d: "Os Estados Unidos aprovaram o pedido de apoio de drones para atacar campos de treinamento da Al-Qaeda e rastrear Osama bin Laden. Agora podemos usar a inteligência para reunir informações e coordenar esforços com as forças dos EUA."
 AFG_events.39.a: "Ótima notícia"
 AFG_events.40.t: "Apoio indiano continua"
 AFG_events.40.d: "O Afeganistão recebe apoio da Índia, incluindo fundos, equipamentos de radar, peças de aeronaves e assessores militares."
 AFG_events.40.a: "Ótimo"
 AFG_events.41.t: "Pedido de apoio rejeitado "
 AFG_events.41.d: "Apesar dos esforços para conseguir apoio adicional, o pedido de ajuda foi rejeitado. Teremos de contar com os recursos existentes."
 AFG_events.41.a: "Decepcionante"
 AFG_events.42.t: "A Rússia pede que arquemos com a conta"
 AFG_events.42.d: "A Rússia não está disposta a cobrir os custos da cara operação de ponte aérea para abastecer a Aliança do Norte no Afeganistão. O Sr. Ivanov procurou os Estados Unidos em busca de ajuda, e também foram realizadas conversas com autoridades de defesa britânicas. Os EUA enfrentam a decisão de auxiliar ou não a Rússia nessa operação."
 AFG_events.42.a: "Podemos fazer isso"
 AFG_events.42.b: "Não podemos"
 AFG_news.18.t: "Pedido da Rússia para que os EUA paguem a ponte aérea ao Afeganistão"
 AFG_news.18.d: "O pedido da Rússia por ajuda no financiamento da operação de ponte aérea para abastecer a Aliança do Norte no Afeganistão foi recebido com zombaria pela comunidade global. Apesar de seu poderio militar, a relutância da Rússia em arcar com a conta atraiu críticas, e muitos questionam seu compromisso com a causa. Alguns chegaram a sugerir que a Rússia reconsidere suas prioridades e se concentre em resolver seus próprios problemas econômicos. Os suprimentos começaram a fluir para o Afeganistão no fim de setembro, com munição e equipamento militar sendo entregues por pontes de pontões construídas pela 201ª divisão da Rússia sobre o rio Piandj, que divide o Tajiquistão e o Afeganistão, segundo o Nezavisimaya Gazeta."
 AFG_news.18.a: "Para onde foi todo o dinheiro?"
 AFG_news.18.c: "A Águia virá em socorro do Urso ferido mais uma vez?"
 AFG_news.18.b: "Hã, na verdade"
 AFG_news.19.t: "EUA mobilizam drones Predator no Afeganistão"
 AFG_news.19.d: "Os Estados Unidos mobilizaram drones Predator no Afeganistão para atacar redutos terroristas da Al-Qaeda. Essa escalada no Afeganistão inaugura uma nova era da presença militar dos Estados Unidos na região. Espera-se que os drones forneçam inteligência e vigilância, reforçando as operações militares dos Estados Unidos no país."
 AFG_news.19.a: "Interessante"
 AFG_news.20.t: "Discurso de [AFG.GetLeader] ao Parlamento Europeu"
 AFG_news.20.d: "Durante a coletiva de imprensa no Parlamento Europeu, [AFG.GetLeader] instou líderes mundiais a pressionar o Paquistão por seu apoio ao Talibã e pediu ajuda humanitária para aliviar o sofrimento do povo afegão. O apelo ocorre enquanto ele também alerta sobre um ataque planejado da Al-Qaeda contra nações ocidentais."
 AFG_news.20.a: "Isso pode ser motivo de preocupação"
 AFG_news.21.t: "Dostum adere aos planos de assalto a Mazar-i-Sharif"
 AFG_news.21.d: "O retorno de Dostum ao Afeganistão após o exílio foi visto como uma oportunidade de retomar Mazar-i-Sharif. Agora, ao lado do comandante Ahmad Shah Massoud, de Ismail Khan e de Mohammad Mohaqiq, ele se prepara para uma ofensiva contra a cidade de Mazar-i-Sharif, controlada pelo Talibã. \n\nDostum, originalmente comandante da unidade militar 374 nas forças comunistas do PDPA, havia desertado para os mujahidin após a queda de Cabul em 1992. Ele então estabeleceu seu protoestado em Mazar-i-Sharif, comumente conhecido como Zona Autônoma do Norte. Imprimiu sua própria moeda e chegou a operar sua própria companhia aérea, a Balkh Air.\n\nApós perder brevemente o controle de Mazar-i-Sharif para o Talibã, Dostum voltou do exílio em outubro de 1997 para reassumir o comando. Apesar de seus esforços, o Talibã retornou em 1998, levando Dostum a fugir mais uma vez para a Turquia."
 AFG_news.21.a: "Vamos ver o que acontece."
 AFG_events.45.t: "Mahmoud Surkha desertou para o Talibã"
 AFG_events.45.d: "O comandante Mahmoud Surkha desertou para o Talibã alegando insatisfação com a interferência russa na guerra. [AFG.GetLeader] nega a acusação, mas diz que tem o direito de buscar apoio internacional como governo de fato reconhecido do Afeganistão."
 AFG_events.48.t: "Abdullah Jan Wahidi deserta"
 AFG_events.48.d: "Haji Abdul Qadeer admitiu que um de seus comandantes-chave, Abdullah Jan Wahidi, desertou para o Talibã."
 AFG_events.48.a: "Não há nada que possamos fazer"
 AFG_events.44.t: "Ismail Khan foge da prisão de Kandahar"
 AFG_events.44.d: "Ismail Khan, ex-governador de Herat e líder da resistência ao regime talibã no poder, foge da prisão em Kandahar. \nKhan poderia ser considerado um dos mais respeitados líderes mujahidin na insurgência contra os soviéticos. Em 1992, as tropas mujahidin capturaram Herat, e Ismail Khan tornou-se governador. Em 1995, ele defendeu a cidade contra o Talibã em cooperação com Ahmad Shah Massoud. Khan chegou a partir para a ofensiva contra o reduto talibã de Kandahar, mas foi repelido. Isso mudou quando o general Abdul Rashid Dostum atacou Herat, forçando Ismail Khan e seus 8.000 homens a fugir para o Irã antes que o Talibã varresse a região e assumisse o controle da província de Herat. Dois anos depois, enquanto organizava a resistência ao Talibã na área de Faryab, foi traído e capturado por Abdul Majid Rouzi, que havia desertado para o Talibã junto com Abdul Malik Pahlawan, então um dos subordinados de Dostum."
 AFG_events.44.a: "Arriscando as chances mais uma vez"
 AFG_events.45.a: "O que podemos fazer, afinal"
 AFG_events.65.t: "O Afeganistão pede apoio"
 AFG_events.65.d: "Diante da escassez de equipamentos e recursos, o Afeganistão solicita urgentemente nossa ajuda, enviando agentes para treinar combatentes afegãos locais e fornecer-lhes o equipamento e os veículos necessários, permitindo que combatam o Talibã de forma independente e, assim, minimizando a necessidade de intervenção militar direta"
 AFG_events.65.a: "Sim, ajudaremos"
 AFG_events.65.b: "Não, não ajudaremos"
 AFG_events.66.t: "Eles aceitam"
 AFG_events.66.d: "Os Estados Unidos aceitaram o pedido e enviarão assessores junto com equipamento para auxiliar o Afeganistão em sua batalha contra o Talibã, marcando um passo significativo no fortalecimento das forças afegãs e nos esforços colaborativos para combater a insurgência e estabilizar a região."
 AFG_events.66.a: "Entraremos em ação"
 AFG_border_wars.1.t: "[event_target:AFG_ATTACKER.GetName] vence a guerra de fronteira"
 AFG_border_wars.1.d: "[event_target:AFG_ATTACKER.GetName] venceu a guerra de fronteira contra [event_target:AFG_DEFENDER.GetName] e avançou para novas terras. É provável que continue sua ofensiva depois disso."
 AFG_border_wars.1.a: "Viva!"
 AFG_border_wars.1.b: "Droga"
 AFG_border_wars.1.c: "Escalar!"
 AFG_border_wars.2.t: "[event_target:AFG_ATTACKER.GetName] perde a guerra de fronteira"
 AFG_border_wars.2.d: "[event_target:AFG_ATTACKER.GetName] perdeu a guerra de fronteira contra [event_target:AFG_DEFENDER.GetName]."
 AFG_border_wars.2.a: "Viva!"
 AFG_border_wars.2.b: "Droga"
 AFG_border_wars.3.t: "Talibã se prepara para entrar nas áreas tribais"
 AFG_border_wars.3.d: "O Talibã vem fazendo planos para se mudar para as áreas tribais, principalmente a região do Waziristão do Norte e Parachinar. Fomos informados por um negociador talibã sobre seus planos, e eles esperam que os deixemos ficar ali por um 'período temporário'. Embora a região seja bastante insignificante no panorama geral, ainda representa uma perda de território e a entrada de terroristas radicais no país."
 AFG_border_wars.3.a: "Enquanto forem úteis, podem ficar"
 AFG_border_wars.3.b: "De jeito nenhum"
 AFG_border_wars.4.t: "Paquistão condena planos de entrada nas áreas tribais"
 AFG_border_wars.4.d: "O governo paquistanês entrou em contato conosco recentemente e expressou seu descontentamento com a perspectiva de forças talibãs permanecerem nas regiões do Waziristão do Norte e Parachinar. Embora não seja um resultado chocante, ainda é um obstáculo em nossos esforços para retomar o Afeganistão."
 AFG_border_wars.4.a: "Tudo bem"
 AFG_border_wars.4.b: "Que se danem as objeções deles!"
 AFG_border_wars.5.t: "Paquistão permite a entrada nas áreas tribais"
 AFG_border_wars.5.d: "O governo paquistanês sinalizou que vai ignorar nossa movimentação nas regiões do Waziristão do Norte e Parachinar. Isso significa que podemos continuar expandindo nossas operações e aumentar nossas chances caso um grande assalto afegão seja iniciado."
 AFG_border_wars.5.a: "Bom"
 AFG_border_wars.6.t: "O Talibã nos ignora"
 AFG_border_wars.6.d: "O Talibã nos ignorou, assim como nossas objeções às suas recentes movimentações na região do Waziristão do Norte e Parachinar. Parece que não temos escolha a não ser usar a força para ensiná-los que não podemos ser pisoteados."
 AFG_border_wars.6.a: "Eles começaram isso"
 AFG_border_wars.7.t: "Forças Armadas Afegãs garantem a vitória"
 AFG_border_wars.7.d: "Após uma escaramuça com o Talibã, as Forças Armadas Afegãs garantiram uma vitória contra as forças talibãs. Essa batalha está sendo exibida como uma vitória nacional por [AFG.GetLeader]."
 AFG_border_wars.7.a: "Allahu Akbar!"
 AFG_border_wars.7.b: "Inshallah, a vitória virá"
 AFG_border_wars.8.t: "Forças talibãs garantem a vitória"
 AFG_border_wars.8.d: "Após uma escaramuça com o Exército Nacional Afegão, as forças talibãs garantiram uma vitória contra as forças do Exército Nacional Afegão. Essa batalha está sendo exibida como uma vitória de todo o Talibã por [TAL.GetLeader]."
 AFG_border_wars.8.a: "Allahu Akbar!"
 AFG_border_wars.8.b: "Inshallah, a vitória virá"
 AFG_border_wars.9.t: "Resultados inconclusivos após escaramuça entre Talibã e afegãos"
 AFG_border_wars.9.d: "Forças internacionais observaram uma linha de frente congelada após uma escaramuça entre as forças do Talibã e do Exército Nacional Afegão. Foi declarado que ambos os lados reduziram seus ataques e recuaram para suas regiões anteriores à escaramuça."
 AFG_border_wars.9.a: "Certo"
 AFG_uzbek_bombing_of_the_imu: "Campanha de bombardeio uzbeque"
 AFG_uzbek_bombing_of_the_imu_desc: "Aeronaves uzbeques atacam campos do Movimento Islâmico do Uzbequistão além da fronteira norte. As incursões enfraquecem a defesa aérea talibã e reduzem a força de suas ofensivas enquanto Tashkent continuar voando."
