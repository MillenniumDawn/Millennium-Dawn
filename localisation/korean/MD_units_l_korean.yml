l_korean:
 fighter: "공중우세기"
 Strike_fighter: "타격 전투기"
 L_Strike_fighter: "경 타격 전투기"
 CV_L_Strike_fighter: "함재 타격 전투기"
 multi_role_fighter: "다목적 전투기"
 cv_multi_role: "함재 다목적 전투기"
 cas: "근접 항공 지원"
 strat_bomber: "전략폭격기"
 transport_plane: "수송기"
 attack_helicopter: "공격 헬리콥터"
 Air_UAV: "전투용 무인항공기(UCAV)"
 transport_helicopter: "수송 헬리콥터"
 Militia_Bat: "Militia "
 Militia_Bat_desc: "Militia Company on foot. Militia Units are characterized by having less heavy equipment and communication kits than normal infantry. This makes them highly mobile and effective in bad terrain, but they melt away quickly in flat terrain against an armored opponent.\n\n§GDesigner Hint: Militia provide inexpensive defensive frontage and Suppression. They perform best in cities, forests, and hills, but have poor Defense and Breakthrough and are especially vulnerable to armor and combat in open or harsh terrain.§!"
 Mot_Militia_Bat: "차량화민병"
 Mot_Militia_Bat_desc: "Militia Company with Pickup Trucks or even Armored Utility Vehicles. Militia Units are characterized by having less heavy equipment and communication kits than normal infantry. This makes them highly mobile and effective in bad terrain, but they melt away quickly in flat terrain against an armored opponent.\n\n§GDesigner Hint: Motorized Militia trade some economy for Speed and greater Suppression. Use them for mobile security and inexpensive exploitation across plains or deserts, but their weak combat stats and rough-terrain penalties make them poor assault troops.§!"
 L_Inf_Bat: "경 보병"
 L_Inf_Bat_desc: "Light Infantry Company without transports. Rarely seen on the modern battlefield, but specialized units in very difficult terrain such as jungle and mountains exist - where they are highly effective. Could also be useful as urban garrisons.\n\n§GDesigner Hint: Light Infantry provide high Organization and strong combat performance in hills, forests, mountains, jungles, marshes, and cities without requiring vehicles. Use them to hold or attack difficult terrain, but expect slow strategic movement and weaker attacks across plains and deserts.§!"
 Mot_Inf_Bat: "차량화보병"
 Mot_Inf_Bat_desc: "Motorized Infantry Company uses all kinds of Utility Vehicles as transport, from pickup trucks to modern mine-resistant vehicles. They provide rapid battlefield mobility where roads and open terrain favor vehicle movement.\n\n§GDesigner Hint: Motorized Infantry provide affordable Speed and good performance in open terrain. Use them to exploit breakthroughs and support fast fronts, but their vehicles increase equipment demand and lose effectiveness in forests, mountains, jungles, marshes, and cities.§!"
 Mech_Inf_Bat: "기계화보병"
 Arm_Inf_Bat: "기갑화 보병"
 Mech_Inf_Bat_desc: "Mechanized Infantry Company uses Armored Personnel Carriers as transport. They are well suited for armored combat in flat terrain.\n\n§GDesigner Hint: Mechanized Infantry combine strong Defense and armored mobility with good performance in plains and deserts. Use them to hold the line in fast armored formations, but APCs are costly and their attack and movement suffer in forests, mountains, jungles, and cities.§!"
 L_Air_Inf_Bat: "Airborne Infantry"
 L_Air_Inf_Bat_desc: "Airborne Light Infantry Company are elite Infantry, with their special training in Aerial Insertion via paradrops from Transport Aircraft or with Transport Helicopters. They can rapidly respond to emergencies from afar, and can be inserted behind enemy lines to take vital objectives ahead of the main army advance. Their mode of transport puts strict limits on the amount of heavy equipment they can carry, though.\n\n§GDesigner Hint: Airborne Infantry combine high Organization with paradrop capability and strong performance in difficult terrain. Use them to seize and hold isolated objectives, but their special-forces training and increased infantry-equipment demand make them expensive for routine line combat.§!"
 Mot_Air_Inf_Bat: "차량화 공수보병"
 Mot_Air_Inf_Bat_desc: "Motorized Airborne Infantry Company are elite Infantry, with their special training in Aerial Insertion via paradrops from Transport Aircraft or with Transport Helicopters. They can rapidly respond to emergencies from afar, and can be inserted behind enemy lines to take vital objectives ahead of the main army advance. Their Utility Vehicles give them great mobility upon insertion, and allow them to bring more heavy equipment into battle. It is however, much more logistically demanding to paradrop them together with vehicles.\n\n§GDesigner Hint: Motorized Airborne Infantry add Speed after a paradrop and perform well across open terrain. Use them when an airborne force must exploit or reinforce quickly, but vehicles raise the equipment burden and reduce Organization and rough-terrain performance compared with foot airborne troops.§!"
 Mech_Air_Inf_Bat: "기계화 공수보병"
 Mech_Air_Inf_Bat_desc: "Mechanized Airborne Infantry Company are elite Infantry, with their special training in Aerial Insertion via paradrops from Transport Aircraft. They can rapidly respond to emergencies from afar, and can be inserted behind enemy lines to take vital objectives ahead of the main army advance. Their specially designed Light Armored Personnel Carriers give them great mobility upon insertion, and allow them to bring much more heavy equipment into battle than lighter Airborne forces. It is however, much more logistically demanding to paradrop them together with such vehicles.\n\n§GDesigner Hint: Mechanized Airborne Infantry bring APC protection, Speed, and heavier firepower to paradrops. Use them when isolated airborne forces must survive mobile combat after landing, but their lower Organization, large equipment demand, and severe rough-terrain penalties make them an expensive specialist choice.§!"
 Arm_Air_Inf_Bat: "기갑화 공수보병"
 Arm_Air_Inf_Bat_desc: "Armored Airborne Infantry Company are elite Infantry, with their special training in Aerial Insertion via paradrops from Transport Aircraft. They can rapidly respond to emergencies from afar, and can be inserted behind enemy lines to take vital objectives ahead of the main army advance. Their specially designed Light Infantry Fighting Vehicles give them great mobility, and allow them to fight on equal terms against normal mechanized formations. It is however, extremely logistically demanding to paradrop them together with their IFV's. As of 2017, only Russia has ever operated such forces.\n\n§GDesigner Hint: Armored Airborne Infantry deliver IFV firepower, Armor, and Breakthrough by paradrop. Use them to contest defended objectives or fight enemy mobile reserves after insertion, but their very high equipment burden, low Organization, and difficult-terrain penalties make losses costly.§!"
 L_Marine_Bat: "Marine Infantry"
 L_Marine_Bat_desc: "Marine Infantry Company are elite Infantry, with special training in amphibious operations, such as river-crossings, operation in swamps, and amphibious invasions. As they don't have vehicles, there are strict limits on the amount of heavy equipment they can carry, though.\n\n§GDesigner Hint: Marine Infantry provide high Organization and strong amphibious and marsh performance without vehicle costs. Use them to establish beachheads and fight in wetlands, but they are slower after landing, consume special-forces capacity, and are less effective in open terrain.§!"
 Mot_Marine_Bat: "차량화 해병"
 Mot_Marine_Bat_desc: "Motorized Marine Infantry Company are elite Infantry, with special training in amphibious operations, such as river-crossings, operation in swamps, and amphibious invasions. While they disembark as Light Infantry, they have Utility Vehicles as land transports, giving them great mobility and allows them to carry large amounts of heavy equipment into battle.\n\n§GDesigner Hint: Motorized Marine Infantry retain a strong amphibious bonus while adding Speed for rapid expansion from a beachhead. Use them when the landing force must move inland quickly, but their vehicles cost more equipment and reduce Organization and mountain performance compared with foot marines.§!"
 Mech_Marine_Bat: "기계화 해병"
 Mech_Marine_Bat_desc: "Mechanized Marine Infantry Company are elite Infantry, with special training in amphibious operations, such as river-crossings, operation in swamps, and amphibious invasions. As they make landings protected in their specially designed Amphibious Armored Personnel Carriers, they are very much equipped to strike right away with great mobility, carrying large amounts of heavy equipment into battle.\n\n§GDesigner Hint: Mechanized Marines combine an amphibious bonus with APC protection and strong mobility after landing. Use them to expand and hold mechanized beachheads, but they have less Organization than lighter marines and their vehicles perform poorly in forests and mountains.§!"
 Arm_Marine_Bat: "기갑화 해병"
 Arm_Marine_Bat_desc: "Armored Marine Infantry Company are elite Infantry, with special training in amphibious operations, such as river-crossings, operation in swamps, and amphibious invasions. They can cross large distances on water in their heavily armored jet-propelled Amphibious Infantry Fighting Vehicles, and be ready to fight from the same IFV's once they make it to shore with great proficiency.\n\n§GDesigner Hint: Armored Marines provide the strongest IFV firepower, Armor, and urban combat ability among marine infantry while retaining an amphibious bonus. Use them against heavily defended ports, but their low Organization, high cost, and severe mountain and jungle penalties require lighter troops for difficult inland terrain.§!"
 L_Air_assault_Bat: "공중강습부대"
 L_Air_assault_Bat_desc: "Air Assault Infantry Company are elite Infantry, with their special training in rappelling and air transportation, their equipment is sometimes designed or field-modified to allow better transportation within aircraft. They are often used to seize and hold key terrain which has not been fully secured, and to directly engage enemy forces behind enemy lines.\n\n§GDesigner Hint: Air Assault Infantry use transport helicopters for rapid operations and gain combat bonuses across most difficult terrain. Use them to seize remote hills, forests, mountains, jungles, marshes, or cities, but their low Strength, poor Entrenchment, and costly helicopters make prolonged line combat risky.§!"
 Special_Forces: "특수 작전 부대"
 Special_Forces_desc: "Special Operation Forces are the elite of any military where they feature, with longer and harder training than anyone else. They are experts of difficult terrains, airborne operations and amphibious landings. They are, however, very lightly equipped as they may need to operate with mobility behind the front lines.\n\n§GDesigner Hint: Special Operation Forces offer exceptional Organization, Recovery, and broad terrain bonuses with paradrop and coastal exfiltration capability. Use them for the hardest raids and contested objectives, but their wide Combat Width, very long training, special-forces cap, and light equipment make them unsuitable as ordinary line infantry.§!"
 armor_Bat: "Tank Company"
 armor_Bat_desc: "A Tank Company features only the most heavily armored vehicles in existence, Main Battle Tanks. With excellent mobility in flat terrain and fierce direct fire, they are designed to punch holes in the enemy front lines that can be rapidly exploited by follow-up mechanized infantry units.\n\n§GDesigner Hint: Tanks deliver high Armor, Breakthrough, and hard-target firepower with excellent plains and desert bonuses. Use them as the spearhead of offensive divisions, but they consume expensive tank and command equipment, have low Organization, and suffer major penalties in forests, mountains, jungles, marshes, and cities.§!"
 armor_Comp: "Tank Platoon"
 armor_Comp_desc: "A Tank Platoon features only the most heavily armored vehicles in existence, Main Battle Tanks. With excellent mobility in flat terrain and fierce direct fire, they are designed to punch holes in the enemy front lines that can be rapidly exploited by follow-up mechanized infantry units.\n\n§GDesigner Hint: A Tank Platoon adds Armor, Breakthrough, and mobile firepower without Combat Width. Use it to stiffen eligible infantry or mobile formations for open-terrain combat, but its tanks and command equipment are costly and it slows and attacks poorly in mountains, jungles, and marshes.§!"
 L_Recce_Comp: "Infantry Recce Platoon"
 L_Recce_Comp_desc: "Infantry Recce Companies operate on foot, and are therefore devoid of much of the heavy equipment that would make them an effective fighting unit. They infiltrate close to the enemy to observe and report on their activity, and use both Drone Reconnaissance and Electronic Surveillance to gather intel. They can also perform limited raids and ambushes. Recce Companies are often called 'Squadrons' due to their legacy as former Cavalry units.\n\n§GDesigner Hint: Infantry Recce adds Reconnaissance and Initiative without Combat Width while retaining small bonuses in forests, mountains, jungles, and hills. Use it in foot, airborne, airmobile, marine, or special-forces divisions, but it requires more Manpower than other recon elements and adds little firepower.§!"
 Mot_Recce_Comp: "Motorized Recce Platoon"
 Mot_Recce_Comp_desc: "Motorized Recce Companies operate with Utility Vehicles, and have much of the same equipment as their Infantry counterparts. Their roles however, are different. They infiltrate close to the enemy to observe and report on their activity, and use both Drone Reconnaissance and Electronic Surveillance to gather intel. They can also perform limited raids and ambushes. Recce Companies are often called 'Squadrons' due to their legacy as former Cavalry units.\n\n§GDesigner Hint: Motorized Recce provides more Reconnaissance and Initiative than foot scouts while matching mobile formations and adding open-terrain mobility. Use it in motorized or marine divisions, but Utility Vehicles increase cost and it slows in mountains, jungles, and marshes.§!"
 Mech_Recce_Comp: "Mechanized Recce Platoon"
 Mech_Recce_Comp_desc: "Mechanized Recce Companies operate with Armored Personnel Carriers, and have much of the same equipment as their Infantry counterparts. Their roles however, are different. They infiltrate close to the enemy to observe and report on their activity, and use both Drone Reconnaissance and Electronic Surveillance to gather intel. They can also perform limited raids and ambushes. Recce Companies are often called 'Squadrons' due to their legacy as former Cavalry units.\n\n§GDesigner Hint: Mechanized Recce provides high Reconnaissance and Initiative without Combat Width while matching APC formations and improving movement in plains. Use it in armored or marine divisions, but its APC and support-equipment cost is high and it slows in mountains and marshes.§!"
 Arm_Recce_Comp: "Heavy Mechanized Recce Platoon"
 Arm_Recce_Comp_desc: "Heavy Mechanized Recce Companies operate with Infantry Fighting Vehicles, and have much of the same equipment as their Armored Infantry counterparts. Their roles however, are different. They infiltrate close to the enemy to observe and report on their activity, and use both Drone Reconnaissance and Electronic Surveillance to gather intel. They can also perform raids and ambushes. Recce Companies are often called 'Squadrons' due to their legacy as former Cavalry units.\n\n§GDesigner Hint: Heavy Mechanized Recce provides high Reconnaissance and Initiative with IFV protection and no Combat Width. Use it in armored or marine divisions operating in plains or deserts, but IFVs are costly and movement suffers in forests, mountains, jungles, and marshes.§!"
 armor_Recce_Comp: "Armored Recce Platoon"
 armor_Recce_Comp_desc: "Armored Recce Platoon operates with special Recon Light Tanks that combine incredible mobility with awe-inspiring stopping power. They can hold their own against all types of Infantry in direct combat. Direct combat isn't their intended role, though - they infiltrate close to the enemy to observe and report on their activity, and use both Drone Reconnaissance and Electronic Surveillance to gather intel. They can also perform raids and ambushes on important enemy assets and mechanized formations. Recce Companies are often called 'Squadrons' due to their legacy as former Cavalry units.\n\n§GDesigner Hint: Armored Recce provides the highest Reconnaissance and Initiative among conventional scouts while adding anti-armor mobility without Combat Width. Use it in tank formations on open terrain, but recon tanks and command equipment are costly and movement falls sharply in forests, mountains, jungles, and marshes.§!"
 L_Engi_Comp: "Engineer Company"
 L_Engi_Comp_desc: "Engineers handle temporary bridge and defensive perimeter construction, mine-laying and clearing in addition to bomb disposal. They carry basic infantry weaponry, for defensive purposes.\n\n§GDesigner Hint: Engineer Companies improve Entrenchment, help infantry attack and defend in forts, cities, forests, and marshes, and improve defense and movement in mountains. Use them in defensive or rough-terrain divisions, but they add Combat Width, Manpower, and equipment while contributing little direct firepower.§!"
 H_Engi_Comp: "Heavy Engineer Company"
 H_Engi_Comp_desc: "Engineers handle temporary bridge and defensive perimeter construction, mine-laying and clearing in addition to bomb disposal. They carry basic infantry weaponry for defensive purposes. With dedicated construction and recovery vehicles, they are well-equipped to recover combat-disabled equipment from the frontline.\n\n§GDesigner Hint: Heavy Engineer Companies provide greater Entrenchment and stronger fort, urban, mountain, and marsh bonuses than standard engineers. Use them in valuable assault or defensive formations, but their large Manpower and equipment requirements make them an expensive support choice.§!"
 Arty_Bat: "Artillery Battery"
 Arty_Bat_desc: "With its powerful indirect fire abilities, Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew. Since it requires external vehicles for its movement, it can be difficult to move around in-between strikes, making it vulnerable against enemy artillery counter-strikes. Lightweight lower calibre systems can be dragged around manually, and are suitable for airborne operations as they can fit inside transport planes.\n\n§GDesigner Hint: Artillery Battery adds substantial Soft Attack and can be paradropped, making it effective against infantry-heavy forces. Use it to give foot formations offensive firepower, but its low Organization and Strength, added Combat Width, and movement penalties in rough terrain require enough infantry to protect it.§!"
 Arty_Battery: "Artillery Section"
 Arty_Battery_desc: "With its powerful indirect fire abilities, Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew. Since it requires external vehicles for its movement, it can be difficult to move around in-between strikes, making it vulnerable against enemy artillery counter-strikes. Lightweight lower calibre systems can be dragged around manually, and are suitable for airborne operations as they can fit inside transport planes.\n\n§GDesigner Hint: An Artillery Section adds Soft Attack without Combat Width at far lower equipment cost than a full artillery battery. Use it as economical fire support for eligible foot formations, but its very low Organization and rough-terrain penalties limit its value in unsupported or highly mobile divisions.§!"
 SP_Arty_Bat: "SP Artillery Battery"
 SP_Arty_Bat_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery.\n\n§GDesigner Hint: Self-Propelled Artillery Battery adds heavy Soft Attack while keeping pace with armored formations and excels in plains. Use it to break infantry-heavy lines, but its low Organization, added Combat Width, costly chassis, and rough-terrain penalties require armored protection and open ground.§!"
 SP_AA_Bat: "SP Anti-Air Battery"
 SP_AA_Bat_desc: "Using self-propelled short or medium ranged Anti-Air Missile Systems, the Air Defence Battery will defend its unit from enemy Close Air Support strikes.\n\n§GDesigner Hint: Self-Propelled Air Defence supplies high Air Attack and mobile protection for armored formations. Use it when enemy aircraft threaten valuable spearheads, but it adds Combat Width, costs specialized vehicles, contributes little ground firepower, and moves poorly in mountains, jungles, and marshes.§!"
 SP_AA_Battery: "SP Anti-Air Section"
 SP_AA_Battery_desc: "Using self-propelled short or medium ranged Anti-Air Missile Systems, the Air Defence Section will defend its unit from enemy Close Air Support strikes.\n\n§GDesigner Hint: A Self-Propelled Air Defence Section adds mobile Air Attack without Combat Width. Use it to protect mobile, armored, or marine divisions under hostile skies, but its specialized chassis has little value against ground forces and is less mobile in mountains and marshes.§!"
 Arm_Inf_Bat_desc: "Armored Infantry Company uses Infantry Fighting Vehicles as transport. They are well suited for armored combat in flat terrain, but are wasted in difficult terrain where they must operate on foot far from their IFV's.\n\n§GDesigner Hint: Armored Infantry use IFVs for greater firepower, Armor, and Breakthrough than mechanized infantry. Use them alongside tanks in open terrain, but their lower Organization, high equipment cost, and severe mountain, jungle, marsh, and urban penalties demand careful deployment.§!"
 L_arm_Bat: "Light Tank Company"
 L_arm_Bat_desc: "Light Tank Company operates with special, often wheeled, Light Tanks that combine incredible mobility with awe-inspiring stopping power. They can hold their own against all types of Infantry in direct combat. Direct combat isn't their intended role, though - they infiltrate close to the enemy to observe and report on their activity, and use both Drone Reconnaissance and Electronic Surveillance to gather intel. They can also perform raids and ambushes on important enemy assets and mechanized formations.\n\n§GDesigner Hint: Light Tanks provide fast armored firepower and strong attacks in plains and deserts. Use them for reconnaissance in force and exploitation, but their protection and direct combat power are lighter and rough terrain sharply reduces their effectiveness.§!"
 combat_service_support_company: "Combat Service Support Battalion"
 combat_service_support_company_desc: "The division's logistics and medical personnel coordinate supply distribution, casualty evacuation, and replacement flow.\n\n§GDesigner Hint: Combat Service Support reduces Supply and Fuel Consumption while preserving Manpower and unit experience through casualty recovery. Use it in large, veteran, or supply-hungry divisions, but it adds Combat Width and equipment while sharply reducing direct combat stats.§!"
 helicopter_combat_service_support: "Helicopter Combat Service Support Squadron"
 helicopter_combat_service_support_desc: "Helicopter-borne logistics and medical teams sustain rapidly deployed forces and evacuate casualties from forward positions.\n\n§GDesigner Hint: Helicopter Combat Service Support provides greater casualty recovery and stronger Supply and Fuel savings with less Manpower than ground support. Use it for costly airmobile or fast formations, but transport helicopters are expensive, it adds Combat Width, and its combat contribution is minimal.§!"
 attack_helo_bat: "Attack Helicopter Squadron"
 attack_helo_bat_desc: "Attack helicopter squadrons mass rotary-wing gunships for rapid anti-armor strikes and close support across a wide front.\n\n§GDesigner Hint: Attack Helicopters provide fast armored firepower and strong attacks in plains and deserts. Use them to reinforce breakthroughs or hunt armor in open terrain, but their very low Organization and Strength, expensive aircraft, and poor performance in cities, mountains, forests, and jungles make sustained combat dangerous.§!"
 attack_helo_comp: "Attack Helicopter Flight"
 attack_helo_comp_desc: "An attack helicopter flight provides rapid gunship support and mobile anti-armor firepower to frontline formations.\n\n§GDesigner Hint: An Attack Helicopter Flight adds fast armored firepower without Combat Width. Use it as flexible support for infantry, mobile, armored, or marine divisions, but aircraft and command equipment are expensive and it attacks less effectively in cities and jungles.§!"
 L_Marine_Cdo_Bat: "Marine Commandos"
 L_Marine_Cdo_Bat_desc: "Marine Commandos Company are larger formations of Marine Raiders, trained to conduct hit and run operations, among other light infantry tasks.\n\n§GDesigner Hint: Marine Commandos combine high Organization with excellent amphibious, marsh, forest, and urban attacks. Use them for elite raids and contested landings, but their special-forces cap, long training, light equipment, and weaker open-terrain attacks limit mass deployment.§!"
 drone_tactical_company: "FPV Drone Platoon"
 drone_tactical_company_desc: "Using FPV fixed-wing and quadcopter drones, these units conduct reconnaissance and targeted strikes in support of their line units.\n\n§GDesigner Hint: An FPV Drone Company adds efficient Soft and Hard Attack without Combat Width and can be paradropped. Use it for flexible fire support in divisions that can supply land drones, but it has almost no Organization and requires substantial drone equipment for limited staying power.§!"
 group_headquarters_title: "본부"
 arm_inf_hq: "기갑화 보병 본부"
 arm_inf_hq_desc: "Headquarters element for mechanized and armored infantry."
 arm_hq: "Armored Headquarters"
 arm_hq_desc: "Headquarters element for light tanks and main battle tanks"
 L_Ranger_Bat: "레인저"
 L_Ranger_Recce_Comp: "레인저 정찰 소대"
 group_headquarters_title_desc: "부대를 전투로 이끌 수 있도록 장비를 갖춘 사령부 부대"
 light_inf_hq: "경보병 사령부"
 light_inf_hq_desc: "경보병 및 차량화 보병을 위한 사령부 요소"
 helo_hq: "헬리콥터 사령부"
 helo_hq_desc: "헬리콥터 부대를 위한 사령부 요소"
 group_light_bat_title: "감편 부대"
 group_light_bat_title_desc: "전력 증강을 위해 설계된 감편 전투 요소로, 능력은 줄어들지만 훈련 시간과 비용도 줄어듭니다."
 Light_Mech_Inf_Bat: "감편 기계화 보병 중대"
 Light_Mech_Inf_Bat_desc: "감편 기계화 요소는 소수의 장갑차를 할당하여 정상적인 전투 정면을 차지하지 않고 부대를 증강합니다.\n\n§G설계 힌트: 감편 기계화 보병은 전투 폭 증가 없이 장갑차 방호와 방어를 더해 줍니다. 평원, 구릉, 도시에서 대상 부대를 증강하는 데 사용하되, 차량 비용, 낮은 전력, 산악, 정글, 습지, 하천, 상륙에서의 심각한 페널티 때문에 독립적인 전투 가치는 제한됩니다.§!"
 Light_Arm_Inf_Bat: "감편 기갑 보병 중대"
 Light_Arm_Inf_Bat_desc: "감편 기갑 보병 요소는 소수의 보병 전투차를 할당하여 정상적인 전투 정면을 차지하지 않고 방호된 화력을 더합니다.\n\n§G설계 힌트: 감편 기갑 보병은 전투 폭 증가 없이 보병 전투차의 장갑과 화력을 더해 주며 평원과 사막에서 가장 좋은 성능을 발휘합니다. 가치 있는 부대를 증강하는 데 사용하되, 낮은 조직력, 값비싼 차량, 험지, 하천, 상륙에서의 극심한 페널티 때문에 매우 특화된 부대입니다.§!"
 Light_L_Air_assault_Bat: "감편 공중 강습 보병 중대"
 Light_L_Air_assault_Bat_desc: "공중 강습 보병은 레펠 강하와 항공 수송에 대한 특별 훈련을 받은 정예 보병이며, 항공기 내 수송이 수월하도록 장비가 설계되거나 현지에서 개조되기도 합니다. 완전히 확보되지 않은 핵심 지형을 점령하고 유지하거나, 적 후방에서 적군과 직접 교전하는 데 자주 투입됩니다.\n\n§G설계 힌트: 이 감편 공중 강습 부대는 전투 폭 증가 없이 조직력과 도시, 산악, 삼림, 정글, 습지에서의 강력한 보너스를 더해 줍니다. 험지의 특수 편제를 강화하는 데 사용하되, 헬리콥터 요구 사항이 비싸고 평원, 사막, 상륙 공격에서는 성능이 떨어집니다.§!"
 Light_attack_helo_bat: "감편 공격 헬리콥터 비행대대"
 Light_attack_helo_bat_desc: "소규모 공격 헬리콥터 요소가 완편 비행대대 규모의 부담 없이 신속한 건십 지원을 제공합니다.\n\n§G설계 힌트: 감편 공격 헬리콥터는 전투 폭 증가 없이 빠른 장갑 화력을 더해 주며 평원과 사막에서 뛰어납니다. 소형 기동 지원으로 사용하되, 매우 낮은 조직력과 전력, 값비싼 항공기, 산악, 정글, 습지, 도시에서의 심각한 페널티로 인해 손실을 감당하기 어렵습니다.§!"
 Light_armor_Bat: "감편 전차 중대"
 Light_armor_Bat_desc: "감편 전차 요소는 제한된 수의 주력 전차를 집중 배치하여 정상적인 전투 정면을 차지하지 않고 부대를 증강합니다.\n\n§G설계 힌트: 감편 전차는 전투 폭 증가 없이 장갑, 돌파, 강력한 평원 및 사막 공격력을 더해 줍니다. 공세 부대를 경제적으로 증강하는 데 사용하되, 낮은 조직력과 전력, 전차 비용, 험지와 도시에서의 극심한 페널티 때문에 범용 지원으로는 부적합합니다.§!"
 Light_L_arm_Bat: "감편 경전차 중대"
 Light_L_arm_Bat_desc: "감편 경전차 요소는 더 작은 차량 규모로 기동성 있는 대기갑 화력과 전투 정찰을 제공합니다.\n\n§G설계 힌트: 감편 경전차는 전투 폭 증가 없이 기동성 있는 대기갑 화력을 더해 주며 평원과 사막에서 뛰어납니다. 기동 부대의 대차량 능력을 보강하는 데 사용하되, 낮은 전력, 특수 차체, 험지, 하천, 상륙에서의 큰 페널티 때문에 유연성이 제한됩니다.§!"
 Light_SP_Arty_Bat: "감편 자주포 포대"
 Light_SP_Arty_Bat_desc: "축소된 자주포 요소는 완편 포대보다 적은 차량으로 기동성 있는 간접 사격을 제공합니다.\n\n§G설계 힌트: 감편 자주포는 전투 폭 증가 없이 기동성 있는 연성 공격력을 더해 주며 특히 평원, 사막, 도시에서 좋은 성능을 발휘합니다. 소형 공세 지원으로 사용하되, 조직력이 거의 없고 전력이 낮으며 특수 차체 비용이 들고 삼림, 산악, 정글에서는 성능이 떨어집니다.§!"
 Light_SP_AA_Bat: "감편 자주 방공 포대"
 Light_SP_AA_Bat_desc: "축소된 자주 방공 요소는 소수의 기동 대공 체계를 할당하여 부대를 보호합니다.\n\n§G설계 힌트: 감편 자주 방공은 전투 폭이나 많은 인력 없이 대공 공격력을 더해 줍니다. 적 공군력 아래의 기동 부대를 소형으로 보호하는 데 사용하되, 조직력이 거의 없고 전력이 낮으며 지상 화력에는 거의 기여하지 못하는 특수 대공 차량이 필요합니다.§!"
 Drone_Recce_Comp: "무인 정찰 소대"
 Drone_Recce_Comp_desc: "소형 무인 항공 체계를 이용해 가시선 너머까지 관측 범위를 넓힘으로써, 무인 정찰 소대는 정찰병을 직접 사격에 노출시키지 않고도 전장 인식을 개선합니다. 이 드론은 경로를 신속히 정찰하고, 적 진지를 식별하며, 복잡한 지형에서 표적을 확인하여 더 빠른 의사 결정과 더 정확한 사격을 가능하게 합니다.\n\n§G설계 조언: 무인 정찰은 높은 정찰력과 주도권을 제공하고, 다른 정찰 요소를 강화하며, 포병 공격을 개선합니다. 드론을 감당할 수 있는 기동 또는 기갑 사단에서 활용하십시오. 다만 전투 폭과 보급 소모가 늘고, 참호화가 줄어들며, 도시와 산악에서는 성능이 떨어집니다.§!"
 medium_walker_battalion: "중형 워커 중대"
 medium_walker_battalion_desc: "워커 부대의 전방위 주력으로 설계된 중형 워커 중대는 직접 전투를 위한 균형 잡힌 방호력, 기동성, 적재 능력을 겸비합니다.\n\n§G설계 힌트: 중형 워커는 장착된 워커 차체에 따라 결정되는 유연한 기갑 전선 전력을 제공합니다. 워커 부대의 범용 핵심으로 사용하되, 넓은 전투 폭, 낮은 조직력, 긴 훈련 기간, 대형 차체 요구량 때문에 배치와 보충에 많은 비용이 듭니다.§!"
 light_walker_tank_battalion: "경량 워커 중대"
 light_walker_tank_battalion_desc: "대기갑 워커 차체를 기반으로 제작된 경량 워커 중대는 지속적인 전선 전투보다 장갑화된 표적 사냥과 돌파구 확대에 중점을 둡니다.\n\n§G설계 힌트: 경량 워커는 전차 파괴 워커 차체를 통해 장갑 표적에 특화되어 있습니다. 적 장갑 부대를 상대로 집중된 관통력과 경성 공격력이 필요할 때 사용하되, 넓은 전투 폭, 낮은 조직력, 긴 훈련 기간, 특수 차체 비용 때문에 비장갑 적을 상대로는 비효율적입니다.§!"
 heavy_walker_tank_battalion: "중량 워커 중대"
 heavy_walker_tank_battalion_desc: "중량 워커 중대는 거대한 보행 플랫폼에 포병 탑재물을 장착하여 주력 부대와 함께 방호된 화력 지원을 제공합니다.\n\n§G설계 힌트: 중량 워커는 워커 포병 차체에서 나오는 장갑 포병 화력을 제공합니다. 보병과 요새화된 방어선에 대한 강력한 지원을 더하는 데 사용하되, 넓은 전투 폭, 낮은 조직력, 긴 훈련 기간, 값비싼 특수 차체 때문에 충분히 지원받는 부대가 필요합니다.§!"
 space_artillery_support_company: "우주 포병 지원 포대"
 space_artillery_support_company_desc: "궤도 플랫폼에서 발사되는 포탄을 운용하는 우주 포병 지원 포대는 재래식 체계의 사거리를 훨씬 넘어서는 전장 표적에 우주로부터 정밀 폭격을 가합니다. 이러한 타격은 경고 없이 요새화된 진지를 신속하게 제압하고, 고가치 자산을 파괴하며, 적 집결지를 분쇄할 수 있습니다.\n\n§G설계 힌트: 우주 포병은 전투 폭을 늘리지 않고 포병 포대의 공격 기여도를 두 배로 늘려 주며 공수 강하가 가능합니다. 포병 중심 부대의 화력을 증폭하는 데 사용하되, 희귀한 궤도 관제 장비, 긴 훈련 기간, 약한 단독 전투 능력치 때문에 포병이 적은 사단에서는 낭비가 됩니다.§!"
 space_artillery_equipment_type: "궤도 사격 통제 중계기"
 space_artillery_equipment_type_desc: "궤도 포병 타격을 실시간으로 요청, 조율, 확인하도록 설계된 강화 통신 및 표적 지정 중계기입니다. 전방 관측관을 우주 기반 포대와 연결하여 신속한 사격 임무, 정밀한 타이밍, 아군과의 신뢰할 수 있는 충돌 방지를 가능하게 합니다. 이 체계는 값비싸고 자원 소모가 크지만, 이것이 없으면 궤도 화력은 눈먼 채 느리고 위험할 만큼 비효율적인 상태에 머뭅니다."
 space_artillery_equipment_1: "$space_artillery_equipment_type$ I"
 space_artillery_equipment_1_desc: "$space_artillery_equipment_type_desc$"
 HACS_Mech: "1세대 고기동 전투 체계"
 HACS_Mech_desc: "1세대 고기동 전투 체계는 첨단 장갑, 무장, 기동성을 공중 전개가 가능한 전투 플랫폼에 결합했습니다.\n\n§G설계 힌트: 1세대 HACS는 매우 높은 조직력, 전력, 전방위 화력, 공수 강하 능력을 제공하며 구릉과 평원에서 강력한 보너스를 받습니다. 정예 기갑 선봉으로 사용하되, 넓은 전투 폭, 매우 긴 훈련 기간, 희귀한 장비, 삼림과 정글에서의 페널티 때문에 부주의한 손실은 치명적입니다.§!"
 HACS_Mech_2: "2세대 고기동 전투 체계"
 HACS_Mech_2_desc: "2세대 고기동 전투 체계는 전략적 전개 유연성을 유지하면서 방호력, 무기 체계, 전장 지속 능력을 향상시켰습니다.\n\n§G설계 힌트: 2세대 HACS는 공수 강하와 해안 이탈 능력을 유지하면서 조직력, 전력, 돌파를 향상시킵니다. 구릉, 평원, 사막, 습지에서 정예 공격에 사용하되, 넓은 전투 폭, 희귀한 장비, 긴 훈련 기간, 남아 있는 정글 페널티 때문에 선별적인 운용이 요구됩니다.§!"
 HACS_Mech_3: "3세대 고기동 전투 체계"
 HACS_Mech_3_desc: "3세대 고기동 전투 체계는 첨단 방호력, 모듈식 무기, 탁월한 전장 지속 능력을 결합했습니다.\n\n§G설계 힌트: 3세대 HACS는 탁월한 조직력, 전력, 참호화, 폭넓은 화력, 공수 강하 능력, 강력한 지형 보너스를 제공합니다. 가장 까다로운 기갑 작전에 사용하되, 넓은 전투 폭, 긴 훈련 기간, 대체 불가능한 첨단 장비 때문에 소모전에는 여전히 큰 타격을 입습니다.§!"
 ALN_bellatoris: "벨라토리스"
 ALN_bellatoris_desc: "벨라토리스는 키메라 군집의 최전선 전사로, 끊임없는 근접 돌격을 위해 길러졌습니다. 빠르고 공격적이어서 압도적인 수와 맹렬함으로 방어선을 뒤엎습니다.\n\n§G설계 힌트: 벨라토리스는 매우 높은 조직력과 전력에 균형 잡힌 공격력, 방어, 돌파, 빠른 훈련을 겸비합니다. 삼림, 구릉, 습지, 평원, 사막에서 범용 키메라 전선 병력으로 사용하되, 대공 공격력이 없고 산악과 정글에서는 고전합니다.§!"
 ALN_brachionis: "브라키오니스"
 ALN_brachionis_desc: "브라키오니스는 장갑 표적을 근접 거리에서 움켜쥐고 찢어발기도록 만들어진 다지형 키메라입니다.\n\n§G설계 힌트: 브라키오니스는 방어를 일부 희생하는 대신 더 높은 연성 공격력과 경성 공격력을 얻으면서 높은 조직력과 빠른 훈련은 유지합니다. 개활지에서 공격적인 돌격 병력으로 사용하되, 산악과 정글에서는 여전히 약합니다.§!"
 ALN_gravis: "그라비스"
 ALN_gravis_desc: "그라비스는 가장 무거운 키메라 개체로, 군집의 전진을 떠받치고 강고한 진지를 힘으로 돌파하는 장갑 덩어리입니다.\n\n§G설계 힌트: 그라비스는 가장 강력한 키메라 공격력, 돌파, 주도권을 높은 조직력과 빠른 훈련과 함께 제공합니다. 개활지에서 공세의 중추로 사용하되, 보급을 더 많이 소모하고 더 가벼운 개체보다 방어와 조직력이 낮으며 산악과 정글에서 고전합니다.§!"
 Hvy_Mot_Inf_Bat: "중형 차량화 보병"
 Hvy_Mot_Inf_Bat_desc: "중형 차량화 보병 중대는 대지뢰 매복 방호(MRAP) 차량을 수송 수단으로 사용합니다. 이 장갑 차량은 지뢰, 급조폭발물(IED), 소화기 사격으로부터 승무원에게 우수한 방호를 제공하므로, 매복 위협이 큰 적대적 환경에서의 작전에 이상적입니다.\n\n§G설계 조언: 중형 차량화 보병은 평원과 사막에서의 빠른 전선 작전을 위해 더 무거운 방호 차량을 사용합니다. 장비 소모가 더 크고 경량 보병보다 조직도와 참호화가 낮으며, 험지에서는 여전히 상당한 페널티를 받습니다.§!"
 L_Ranger_Bat_desc: "레인저는 습격, 직접 행동, 주력에 앞선 신속 전개에 특화된 정예 경보병입니다. 기동성과 기습을 극대화하기 위해 가볍게 이동하며, 핵심 목표를 점령하고 재래식 부대가 도착할 때까지 확보합니다. 대신 중장비가 부족하여 개활지에서 기갑 부대를 상대하기에는 취약합니다.\n\n§G설계 조언: 레인저는 낮은 전투 폭에 높은 조직도와 탁월한 험지 보너스를 담았습니다. 정예 산악, 삼림, 정글, 습지, 도시 편제에 활용하십시오. 다만 긴 훈련 기간, 특수부대 제한, 제한된 중장비 때문에 대량 배치는 비용이 크고 평원에서는 취약합니다.§!"
 L_Ranger_Recce_Comp_desc: "레인저에서 차출된, 도보로 적 후방 깊숙이 침투하여 적의 움직임을 보고하도록 훈련받은 정찰 요소입니다. 은밀성에 드론 정찰과 전자 감시를 결합하여 정보를 수집하고 아군 사격을 위해 표적을 표시하며, 기회가 오면 제한적인 습격과 매복도 수행할 수 있습니다.\n\n§G설계 조언: 레인저 정찰은 정찰력과 주도권을 높이는 동시에 포병의 대인 공격을 개선하고 험지에서도 잘 싸웁니다. 정예 정찰이 필요한 특수부대 편제에 활용하십시오. 다만 전투 폭이 늘어나고 특수부대 수용량을 소모하며 직접적인 화력 기여는 제한적입니다.§!"
 A_L_arm_Bat: "공수 경전차 중대"
 A_L_arm_Bat_desc: "경전차 중대는 흔히 바퀴형인 특수 경전차로 작전하며, 놀라운 기동력과 경외로운 제동 화력을 결합했습니다. 모든 유형의 보병을 상대로 직접 전투에서 자신을 지킬 수 있습니다. 그러나 직접 전투는 본래의 역할이 아니며, 적에게 가까이 침투하여 활동을 관찰하고 보고하고 드론 정찰과 전자 감시를 모두 사용하여 정보를 수집합니다. 또한 적의 중요 자산과 기계화 편제에 대한 습격과 매복도 수행할 수 있습니다. 이 부대는 낙하산 부대 요소와 함께 공수 작전도 수행할 수 있어 즉각적인 근접 기갑 지원을 제공합니다.\n\n§G설계 조언: 공수 경전차는 낙하 편제에 투입 후의 기동 장갑과 대차량 화력을 제공합니다. 개활지에서 기동 중인 적에 맞서 공수 부대를 지원하는 데 활용하십시오. 다만 특수 차량은 비싸고 산악, 정글, 습지, 도시에서 심각한 페널티를 받습니다.§!"
 Weapons_company: "무기 분대"
 Weapons_company_desc: "GPMG 및 HMG 팀, 유탄 기관총 팀, 기타 중보병 직사 지원 무기로 구성된 직사 보병 지원 무기 분대입니다. 이 분대는 지원 대상으로 배속된 어떤 보병 요소에도 폭넓은 병력 범위에 걸쳐 지원 화력을 제공하도록 설계되었습니다.\n\n§G설계 힌트: 무기 분대는 전투 폭 증가 없이 폭넓은 직사 능력치, 특히 관통력을 더해 줍니다. 범용 보병을 강화하는 데 사용하되, 상당한 보병 장비 요구량과 참호화 페널티 때문에 저렴한 고정 방어 부대로는 매력이 떨어집니다.§!"
 Heavy_mortar_company: "박격포 분대"
 Heavy_mortar_company_desc: "박격포는 상급 부대의 배속 없이도 전선 부대에 신속하고 통합된 화력 지원을 제공하도록 설계되었습니다. 이 박격포들은 완편 포병 부대에 필요한 비용보다 훨씬 저렴하게 전선 요소에 간접 사격 지원을 제공합니다.\n\n§G설계 힌트: 박격포 분대는 포병 장비나 전투 폭 없이 강력한 연성 공격력을 제공합니다. 보병에 대한 저렴한 통합 화력 지원으로 사용하되, 경성 공격력과 관통력은 거의 없고 참호화를 감소시킵니다.§!"
 Sniper_company: "저격 소대"
 Sniper_company_desc: "관측수와 짝을 이루어 활동하는 정밀 사수들로 편성된 저격 소대는 장교, 승무원, 통신 팀과 같은 고가치 표적에 장거리 선별 사격을 가합니다. 이들은 은폐된 위치에서 적 부대를 괴롭히고 교란하는 데 뛰어나며, 위치를 파악하고 교전하기 어려운 상태에서 적의 전투 효율을 저하시킵니다.\n\n§G설계 힌트: 저격 소대는 연성 공격력과 정찰을 더해 주며 정찰 요소의 주도권과 포병의 화력을 강화합니다. 보병에 대한 사용이나 더 나은 전장 조율을 위해 사용하되, 전투 폭이 늘어나며 돌파, 경성 공격력, 관통력이 매우 형편없습니다.§!"
 AT_company: "보병 대전차 분대"
 AT_company_desc: "보병 대전차 무기로 무장한 이 대전차 분대는 경보병 요소와 특별히 함께 활동하도록 설계되었습니다. 도시 지역, 삼림 및 기타 참호화되거나 밀집된 지형에서 쉽게 활동할 수 있으며, 적 기갑 요소를 쉽게 공격한 뒤 다시 참호화된 위치로 사라질 수 있습니다.\n\n§G설계 힌트: 보병 대전차는 도보, 공수, 해병, 특수 부대 편제에 전투 폭 증가 없이 높은 경성 공격력과 관통력을 더해 줍니다. 해당 사단이 기갑에 저항해야 할 때 사용하되, 다른 전투 능력치를 약화시키며 특수 장비 비용이 추가됩니다.§!"
 Mot_AT_company: "차량 탑재 대전차 분대"
 Mot_AT_company_desc: "차량에 장착된 사격 위치에서 활동하는, 대전차 작전 전담 분대입니다. 이 분대는 속도에 더 중점을 두어 설계되어 빠르게 움직이는 기동 및 기갑 요소와 보조를 맞추면서도 향상된 대전차 능력을 제공합니다.\n\n§G설계 힌트: 차량 대전차는 기동 부대의 속도를 늦추지 않으면서 높은 경성 공격력과 관통력을 더해 줍니다. 전차와 마주한 차량화, 기갑, 공수 또는 해병 사단에 사용하되, 중대전차 무기와 다목적 차량 때문에 비용이 더 비싸고 연성 표적에 대한 기여는 거의 없습니다.§!"
 AA_company: "대공 분대"
 AA_company_desc: "적 항공기 요소와 교전하고 적 헬리콥터 및 기타 항공기에 대한 방어를 제공하도록 특별히 장비를 갖춘 요소입니다.\n\n§G설계 힌트: 대공 분대는 전투 폭 증가 없이 강력한 대공 공격력을 제공합니다. 적의 공군력 아래에서 활동하는 사단을 보호하는 데 사용하되, 지상 전투에서는 약하며 제공권이 확보된 상황에서는 가치가 거의 없는 전용 대공 장비를 소모합니다.§!"
 Combat_engineer_company: "전투 공병 소대"
 Combat_engineer_company_desc: "전투 공병은 전선 부대를 직접 지원하는 공세적 공병 활동을 수행합니다. 이들은 하천이나 대전차호와 같은 험난한 지형을 건너도록 훈련받고 장비를 갖추고 있습니다. 또한 지뢰밭이나 기타 방어 장애물을 돌파하고 지역을 정리하여 다른 전투 병력이 방해받지 않고 통과할 수 있도록 하는 장비도 갖추고 있습니다.\n\n§G설계 힌트: 전투 공병은 전투 폭 증가 없이 방어, 돌파와 함께 삼림, 산악, 정글, 도시에서의 소폭 공격 및 방어 보너스를 더해 줍니다. 험지를 통과하는 강습에 사용하되, 상당한 보병 장비가 필요하며 개활지에서는 특화된 가치가 낮습니다.§!"
 pathfinder_company: "선도 정찰 소대"
 pathfinder_company_desc: "공수 작전을 수행하기에 앞서 먼저 강하하여 가장 안전한 착륙 지점과 집결 지역을 찾도록 훈련받은 정예 공수부대원 집단입니다. 이 정예 병력은 모든 공수 또는 공중기동 작전의 핵심 단계에서 필수적인 지휘 통제를 제공합니다.\n\n§G설계 힌트: 선도 정찰대는 공수 보병의 조직력과 연성 공격력을 향상시키며 낙하산으로 전개할 수 있습니다. 공수 또는 공중기동 강습 사단을 강화하는 데 사용하되, 전투 폭이 늘어나고 해당 편제로만 제한되며 직접적인 전투력은 거의 없습니다.§!"
 amphibious_landing_detachment: "해군 상륙 분견대"
 amphibious_landing_detachment_desc: "신속하고 효과적인 상륙 작전을 가능하게 하는 해군 배속 요소입니다. 전용 상륙함과 장비를 갖추고 있어 이 부대들은 신속한 함대 대 해안 또는 수평선 너머 상륙 작전을 용이하게 합니다. 그러나 이러한 부대를 배속하는 대가로 비상륙 작전을 수행하는 능력이 감소합니다.\n\n§G설계 힌트: 해군 상륙 분견대는 해병 부대의 상륙 공격, 방어, 이동 속도를 크게 향상시킵니다. 해안 강습 전담 사단에 사용하되, 전투 폭, 인력, 장비가 늘어나며 거의 모든 육상 지형에서 심각한 전투 페널티를 부과합니다.§!"
 combat_maintenance_company: "정비 중대"
 combat_maintenance_company_desc: "정비 중대는 야전 수리를 수행하고 손상된 플랫폼이 영구히 상실되기 전에 회수함으로써 부대의 차량과 중장비를 전투에 계속 투입할 수 있도록 유지합니다. 전투 불능이 된 차량을 전선 가까이에서 복구함으로써 장기 작전 중에도 기갑 전력을 유지하고 소모로 인한 손실을 줄입니다.\n\n§G설계 힌트: 정비는 차량 중심 사단의 신뢰도, 회복, 장비 노획을 향상시킵니다. 장기 작전 중 소모를 억제하고 값비싼 장비를 보존하는 데 사용하되, 전투 폭, 인력, 다목적 차량이 늘어나며 직접적인 화력에는 거의 기여하지 못합니다.§!"
 airmobile_maintenance_company: "공중기동 정비 중대"
 airmobile_maintenance_company_desc: "공중기동 및 헬리콥터 부대를 지원하도록 구성된 정비 요소로, 회전익 및 신속 전개 부대를 가동 상태로 유지하는 데 필요한 더 가볍고 수송하기 쉬운 장비를 갖추고 있습니다. 전방 지역에서 손상된 장비를 복구하여 기존 보급창에서 멀리 떨어진 공중 강습 작전의 속도를 유지시킵니다.\n\n§G설계 힌트: 공중기동 정비는 헬리콥터 부대와 보조를 맞추면서 장비 노획과 신뢰도를 향상시킵니다. 값비싼 회전익 장비를 보존하는 데 사용하되, 지상 정비보다 회복력이 낮고 전투 폭이 늘어나며 많은 수송 헬리콥터가 필요합니다.§!"
 communications_company: "통신 중대"
 communications_company_desc: "통신 중대는 부대를 하나로 묶는 무선, 데이터, 지휘 네트워크를 유지하여 명령과 보고가 전장 전체에 안정적으로 흐르도록 보장합니다. 견고한 통신은 조율과 반응 시간을 향상시키고 부대를 전파 방해 및 전자적 교란으로부터 보호합니다.\n\n§G설계 힌트: 통신 중대는 전선 대대의 조직력, 회복, 주도권을 향상시킵니다. 조율의 이점을 얻는 대규모 또는 가치 있는 전투 사단에 사용하되, 전투 폭과 상당한 지휘통제 장비 비용이 추가되며 직접적인 화력은 거의 제공하지 못합니다.§!"
 military_police_attachment: "헌병 분견대"
 military_police_attachment_desc: "헌병은 교통 통제, 후방 지역 경비, 포로 관리를 맡아 전선 부대가 전투에 집중할 수 있도록 합니다. 보급로를 질서 있게 유지하고 침투자와 낙오병으로부터 후방을 방어함으로써 규율을 지키고 부대가 원활하게 움직이도록 유지합니다.\n\n§G설계 힌트: 헌병은 보병의 제압력을 배가하며 전투 폭 증가 없이 추가 제압력을 더해 줍니다. 점령 및 후방 지역 경비 편제에 사용하되, 인력과 장비 비용에 비해 전선 전투 사단에는 거의 이점이 없습니다.§!"
 hq_mech: "사령부 기계화 보병 중대"
 hq_mot: "사령부 차량화 보병 중대"
 hq_armor: "사령부 중기병 중대"
 hq_Mot_Inf_Bat: "사령부 차량화 보병 경비 분견대"
 hq_Mech_Inf_Bat: "사령부 기계화 보병 경비 분견대"
 hq_Arm_Inf_Bat: "사령부 기갑 경비 분견대"
 hq_Mech_Marine_Bat: "사령부 해병 경비 분견대"
 hq_Mech_Air_Inf_Bat: "사령부 공중 강습 경비 분견대"
 Militia_Recce_Comp: "민병 정찰 소대"
 Militia_Recce_Comp_desc: "민병 정찰 중대는 다용도 차량과 제한된 통신 장비를 사용하여 민병 부대보다 앞서 정찰합니다. 특히 시가지에서 저렴하게 적 진지를 정찰합니다.\n\n§G설계 조언: 민병 정찰은 전투 폭 없이 정찰력과 주도권을 더하며 도시와 초대도시에서 특히 잘 싸웁니다. 민병 전술을 저렴하게 개선하는 데 활용하십시오. 다만 민병에게만 사용할 수 있고 직접적인 전투력 기여는 거의 없습니다.§!"
 light_medium_walker_battalion: "중형 워커 중대 (경)"
 light_medium_walker_battalion_desc: "축소된 중형 워커 요소가 소수의 범용 워커 차체를 할당하여 부대를 증강합니다.\n\n§G설계 힌트: 감편 중형 워커는 완편 워커 중대보다 더 적은 전투 폭과 훨씬 적은 차체로 유연한 기갑 전력을 더해 줍니다. 생산력이 완편 요소를 유지하지 못할 때 사용하되, 낮은 조직력, 긴 훈련 기간, 제한된 지속 전투 능력은 그대로 유지합니다.§!"
 light_light_walker_tank_battalion: "경량 워커 중대 (경)"
 light_light_walker_tank_battalion_desc: "축소된 경량 워커 요소가 표적 증강을 위한 소규모 대기갑 워커 플랫폼 전력을 제공합니다.\n\n§G설계 힌트: 감편 경량 워커는 더 적은 전투 폭과 더 적은 전차 파괴 차체로 집중된 대기갑 전력을 더해 줍니다. 장갑화된 표적에 대항하여 사단을 증강하는 데 사용하되, 낮은 조직력, 긴 훈련 기간, 비장갑 적을 상대로 한 좁은 역할은 그대로 유지합니다.§!"
 light_heavy_walker_tank_battalion: "중량 워커 중대 (경)"
 light_heavy_walker_tank_battalion_desc: "축소된 중량 워커 요소가 완편 중대 규모의 부담 없이 포병을 장착한 보행 플랫폼을 제공합니다.\n\n§G설계 힌트: 감편 중량 워커는 완편 요소보다 더 적은 전투 폭과 더 적은 차체로 장갑 포병 화력을 더해 줍니다. 소형 화력 지원으로 사용하되, 낮은 조직력, 긴 훈련 기간, 특수 포병 차체 때문에 여전히 비용이 많이 듭니다.§!"
 hq_support_company: "사령부 지원 중대"
 hq_support_company_desc: "사령부 지원 중대는 야전 부대를 지휘하는 데 필요한 지휘 참모, 통신, 수송, 경비를 제공합니다.\n\n§G설계 힌트: 사령부 지원 중대는 배치된 지휘관이 기량으로부터 얻는 보너스를 향상시킵니다. 육군 사령부 편제의 범용 선택지이지만, 특화된 전투 또는 작전 보너스 없이 전투 폭, 인력, 장비가 늘어납니다.§!"
 hq_engineer: "사령부 공병 중대"
 hq_engineer_desc: "사령부 공병 중대는 부대 전반에 걸친 돌파, 요새화, 기동 작업을 조율합니다.\n\n§G설계 힌트: 사령부 공병 중대는 요새 피해와 상륙 침공 방어를 향상시키면서 참호화와 돌파를 더해 줍니다. 공성, 방어 또는 해안 작전에 사용하되, 전투 폭이 늘어나며 직접적인 화력은 제한적입니다.§!"
 hq_recon: "사령부 정찰 중대"
 hq_recon_desc: "사령부 정찰 중대는 지휘 참모를 위해 지형 및 적 정보를 수집하고 배포합니다.\n\n§G설계 힌트: 사령부 정찰 중대는 배치된 지휘관의 정찰과 지형 특성 경험치를 향상시키면서 사령부에 정찰을 더해 줍니다. 기동 또는 지형 중심의 지휘부에 사용하되, 전투 폭이 늘어나며 직접적인 전투력은 거의 없습니다.§!"
 hq_maintenance: "사령부 정비 중대"
 hq_maintenance_desc: "사령부 정비 중대는 부대 전반에 걸친 회수, 수리, 장비 재활용을 조율합니다.\n\n§G설계 힌트: 사령부 정비 중대는 배치된 지휘관의 소모를 줄이고 장비 노획을 향상시키면서 사령부에 신뢰도와 장비 노획을 더해 줍니다. 장비 중심의 지휘부에 사용하되, 전투 폭이 늘어나며 전투 능력치가 약합니다.§!"
 hq_logistics: "사령부 군수 중대"
 hq_logistics_desc: "사령부 군수 중대는 부대의 보급품 배분과 연료 이동을 계획합니다.\n\n§G설계 힌트: 사령부 군수 중대는 배치된 지휘관의 보급 소모와 사령부의 연료 소모를 줄입니다. 보급이 제한되거나 연료 소모가 큰 전선에 사용하되, 전투 폭이 늘어나며 전투력은 거의 없습니다.§!"
 hq_naval_liaison: "사령부 해군 연락 중대"
 hq_naval_liaison_desc: "해군 연락 팀은 사령부를 함대 지휘관 및 함대 대 해안 지원 네트워크와 연결합니다.\n\n§G설계 힌트: 사령부 해군 연락 중대는 배치된 지휘관의 해안 포격, 상륙 침공, 해병 보급 유예를 향상시킵니다. 해안 및 상륙 전역에 사용하되, 전투 폭이 늘어나며 내륙 깊숙한 곳에서는 이점이 거의 없습니다.§!"
 hq_air_liaison: "사령부 공군 연락 중대"
 hq_air_liaison_desc: "공군 연락 팀은 사령부를 수송, 근접 지원, 제공 전투 부대와 조율합니다.\n\n§G설계 힌트: 사령부 공군 연락 중대는 공중 침공 준비 시간을 단축하고 근접 항공 지원에 대한 저항력과 제공권에서 오는 전투 이점을 향상시킵니다. 공지 협동이 중요한 곳에 사용하되, 전투 폭이 늘어나며 상당한 지상 화력은 없습니다.§!"
 hq_specops: "사령부 특수작전 중대"
 hq_specops_desc: "특수작전 참모는 통상적인 보급 및 지휘 네트워크 밖에서 활동하는 정예 부대를 조율합니다.\n\n§G설계 힌트: 사령부 특수작전 중대는 전투 폭 증가 없이 배치된 지휘관의 특수 부대 공격, 방어, 보급 두절 시 성능을 향상시킵니다. 정예 부대를 지휘하는 데 사용하되, 인력과 장비 비용은 재래식 병력에는 낭비입니다.§!"
 hq_mech_desc: "기계화 작전 참모는 부대 전반에 걸쳐 장갑차와 이에 탑승한 보병을 조율합니다.\n\n§G설계 힌트: 사령부 기계화 보병 중대는 배치된 지휘관의 기계화 공격과 방어를 향상시킵니다. 기계화 부대를 지휘하는 데 사용하되, 장갑차와 상당한 지원 장비가 필요하며 다른 부대 유형에는 이점이 거의 없습니다.§!"
 hq_mot_desc: "차량화 작전 참모는 차량 수송 보병과 부대의 신속한 이동을 조율합니다.\n\n§G설계 힌트: 사령부 차량화 보병 중대는 배치된 지휘관의 차량화 공격과 방어를 향상시킵니다. 차량화 부대를 지휘하는 데 사용하되, 다목적 차량과 장비 비용이 도보 또는 기갑 부대에는 가치가 거의 없습니다.§!"
 hq_armor_desc: "기갑 작전 참모는 부대 전반에 걸쳐 전차, 기갑 보병, 이를 지원하는 요소를 조율합니다.\n\n§G설계 힌트: 사령부 중기병 중대는 배치된 지휘관의 기갑 공격과 방어를 향상시킵니다. 전차 중심 병력을 지휘하는 데 사용하되, 보병 전투차와 폭넓은 장비 요구량 때문에 비용이 가장 많이 드는 사령부 지원 선택지 중 하나입니다.§!"
 hq_infantry: "사령부 보병 경비 분견대"
 hq_infantry_desc: "경보병 분견대가 사령부 인원, 통신, 지휘소를 직접 공격으로부터 보호합니다.\n\n§G설계 힌트: 사령부 보병 경비 분견대는 육군 사령부에 적당한 장비 비용으로 높은 전력과 조직력을 제공합니다. 기본 경비선으로 사용하되, 전투 폭이 늘어나고 지형 보너스가 없으며 일반 전선 보병에 비해 전투 능력치가 낮습니다.§!"
 hq_Mot_Inf_Bat_desc: "차량화 보병 분견대가 사령부 인원과 지휘소에 기동 경비를 제공합니다.\n\n§G설계 힌트: 사령부 차량화 보병 경비 분견대는 육군 사령부에 속도, 견실한 조직력, 강력한 구릉 및 도시 성능을 더해 줍니다. 기동 지휘 부대에 사용하되, 차량 때문에 비용이 늘어나며 사막, 정글, 습지, 하천, 상륙 공격에서는 약합니다.§!"
 hq_Mech_Inf_Bat_desc: "기계화 보병 분견대가 장갑차로 기동 사령부를 보호합니다.\n\n§G설계 힌트: 사령부 기계화 보병 경비 분견대는 장갑 기동성과 구릉 및 도시에서의 강력한 방어를 더해 줍니다. 기계화 육군 사령부를 보호하는 데 사용하되, 장갑차가 비싸고 산악, 정글, 습지, 하천, 상륙 공격에서 심각한 페널티를 입습니다.§!"
 hq_Arm_Inf_Bat_desc: "기갑 보병 분견대가 보병 전투차를 사용하여 사령부에 중무장 경비를 제공합니다.\n\n§G설계 힌트: 사령부 기갑 경비 분견대는 육군 사령부에 보병 전투차 기반의 방호와 개활지 성능을 제공합니다. 기갑 지휘부와 함께 사용하되, 조직력이 낮고 장비 비용이 높으며 험지와 상륙 작전에서 심각한 페널티를 입습니다.§!"
 hq_Mech_Marine_Bat_desc: "기계화 해병 분견대가 함대 대 해안 및 연안 작전 중 사령부를 보호합니다.\n\n§G설계 힌트: 사령부 해병 경비 분견대는 육군 사령부에 장갑 기동성과 강력한 상륙 및 하천 공격력을 결합해 줍니다. 해병 지휘부와 교두보 작전에 사용하되, 장갑차 비용과 험지 페널티 때문에 내륙 전역에서는 비효율적입니다.§!"
 hq_Mech_Air_Inf_Bat_desc: "경량 기계화 분견대가 공수 및 신속 전개 부대에 배정된 사령부를 보호합니다.\n\n§G설계 힌트: 사령부 공중 강습 경비 분견대는 육군 사령부와 함께 낙하산으로 강하할 수 있는 장갑 경비를 제공합니다. 공수 지휘 부대에 사용하되, 장갑차와 지원 장비 비용이 높으며 험지, 하천, 상륙 공격에서 큰 페널티를 입습니다.§!"
 Mech_Militia_Bat: "기계화 민병"
 Mech_Militia_Bat_desc: "장갑차를 갖춘 민병 중대입니다. 민병 부대는 일반 보병에 비해 중장비와 통신 장비가 적은 것이 특징입니다. 덕분에 기동성이 매우 높고 험지에서 효과적이지만, 평지에서 기갑 부대를 상대하면 빠르게 와해됩니다.\n\n§G설계 조언: 기계화 민병은 경제성을 더 희생하는 대신 속도와 더 높은 경도를 얻습니다. 비교적 저렴한 가격으로 더 강력한 기동 경계를 맡기고, 도보 보병과 포병을 밀어붙이는 데 활용하십시오. 다만 전문 기계화 부대에 비해 전투 능력치가 약해 잘 갖춘 군대와 정면으로 맞붙기는 어렵습니다.§!"
 SP_arty_battery: "자주포 분대"
 SP_arty_battery_desc: "강력한 간접 사격 능력을 갖춘 자주포는 전장에서 필요한 곳에, 그리고 시야 밖 먼 거리까지 지속적인 정밀 타격을 제공합니다. 승무원이 직접 재장전할 수 있으며, 자체 추진 능력 덕분에 기동성이 높아 적 포병의 대포병 사격을 피해 이동할 수 있습니다.\n\n§G설계 힌트: 자주포 분대는 전투 폭 증가 없이 기동성 있는 연성 공격력을 더해 줍니다. 기동, 기갑, 해병 또는 민병 부대를 위한 소형 화력 지원으로 사용하되, 특수 차체가 견인포보다 비용이 많이 들고 산악, 정글, 습지에서는 이동이 원활하지 않습니다.§!"
 SP_R_arty_Bat: "자주 로켓 포대"
 SP_R_arty_Bat_desc: "MLRS 발사기를 사용하는 로켓포 포대는 먼 거리에서 한 지역 전체를 초토화할 수 있습니다. 무차별 사격이라 전장에서의 정밀 타격에는 적합하지 않으므로 적 후방 지역에 대해 운용됩니다. 특수 재장전 차량이 필요하며 재장전 시간이 깁니다.\n\n§G설계 힌트: MLRS 포대는 매우 높은 연성 공격력과 돌파를 제공하며 개활지에서 기동 부대와 보조를 맞출 수 있습니다. 집중적인 공세 화력이 필요할 때 사용하되, 낮은 조직력, 추가되는 전투 폭, 값비싼 로켓 차량이 필요하며 산악, 정글, 습지, 도시에서는 고전합니다.§!"
 SP_R_arty_battery: "자주 로켓 분대"
 SP_R_arty_battery_desc: "MLRS 발사기를 사용하는 로켓포 분대는 먼 거리에서 지역을 초토화할 수 있습니다. 무차별 사격이라 전장에서의 정밀 타격에는 적합하지 않으므로 적 후방 지역에 대해 운용됩니다. 특수 재장전 차량이 필요하며 재장전 시간이 깁니다.\n\n§G설계 힌트: MLRS 분대는 전투 폭 증가 없이 강력한 기동 연성 공격력과 약간의 돌파를 더해 줍니다. 기동 또는 기갑 사단의 소형 공세 지원으로 사용하되, 로켓 차량은 비용이 많이 들고 지속 전투 능력이 낮으며 산악과 습지에서 기동력을 잃습니다.§!"
 air_assault_arty_Bat: "공중기동 포병 포대"
 air_assault_arty_Bat_desc: "견인포로 구성된 완편 포대를 헬리콥터 슬링 로딩으로 수송합니다. 공중기동 작전을 위한 지속적인 간접 사격 지원을 제공하며, 신속한 공중 재배치로 공중 강습 보병과 보조를 맞춥니다.\n\n§G설계 힌트: 공중기동 포병은 헬리콥터 부대에 상당한 연성 공격력을 더해 주며 구릉, 산악, 삼림, 정글, 도시에서 좋은 성능을 발휘합니다. 험지에서 공중 강습 부대를 지원하는 데 사용하되, 전투 폭이 늘어나고 조직력과 전력이 낮으며 값비싼 수송 헬리콥터가 필요합니다.§!"
 air_assault_arty_battery: "공중기동 포병 소대"
 air_assault_arty_battery_desc: "견인포를 사용하는 이 부대들은 포를 슬링 로딩으로 수송하여 기동성을 높이며, 더 빠른 공중기동 보병 부대와 보조를 맞출 수 있습니다.\n\n§G설계 힌트: 공중기동 포병 소대는 전투 폭 증가 없이 연성 공격력을 더해 주며 구릉, 산악, 삼림, 정글, 도시에서 가장 좋은 성능을 발휘합니다. 공중기동 또는 해병 부대를 위한 소형 화력 지원으로 사용하되, 헬리콥터와 포병 요구량이 비싸고 평원과 사막에서는 약합니다.§!"
 Light_SP_R_arty_Bat: "감편 자주 로켓포 포대"
 Light_SP_R_arty_Bat_desc: "축소된 다연장 로켓 요소는 완편 포대보다 적은 차량으로 집중적인 지역 사격을 제공합니다.\n\n§G설계 힌트: 감편 로켓포는 전투 폭 증가 없이 강력한 기동 연성 공격력을 더해 주며 평원, 사막, 도시에서 뛰어납니다. 공세 부대를 증강하는 데 사용하되, 무시할 만한 수준의 조직력, 낮은 전력, 로켓 차량 비용, 험지 페널티 때문에 방호가 필요합니다.§!"