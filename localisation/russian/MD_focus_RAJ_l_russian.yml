 RAJ_terror_and_disruptive_activities_act: "Закон о терроризме и деструктивной деятельности"
 RAJ_terror_and_disruptive_activities_act_desc: "Наша законодательная система оказалась не готова к новым вызовам терроризма 21 века. Пришло время адаптировать ее и внести необходимые поправки."
 RAJ_nuclear_tests_rajasthan: "Ядерные испытания в Раджастхане"
 RAJ_nuclear_tests_rajasthan_desc: "Обновление и расширение нашего ядерного арсенала является важным прецедентом для современной индийской оборонной политики. Пришло время провести новые испытания в Раджастане и убедиться в нашей мощи."
 RAJ_inner_network_idea_desc: "Хорошая внутренняя сеть имеет решающее значение для нашего развития."
 indian_event.12.a: "Конечно"
 RAJ_make_threshold_higher: "Увеличить порог"
 RAJ_make_threshold_higher_desc: "Чтобы добиться честности выборов, мы должны повысить избирательный порог, чтобы отсеять дилетантов и прочих недоумков, тем самым оставив место для умных и образованных людей."
 RAJ_BRICS_integer: "Создание БРИКС"
 RAJ_BRICS_integer_desc: "Крупнейшим мировым державам пора объединиться в единый кулак, чтобы создать многополярный мир. Концепция БРИКС, предложенная на Петербургском международном экономическом форуме, должна быть реализована."
 RAJ_appease_hindus_desc: "Инвестируйте в программы и культурные инициативы индуистской общины. Это повышает общественное мнение среди индуистов, но может быть воспринято мусульманскими общинами как проявление фаворитизма."
 RAJ_appease_sikhs_desc: "Решать проблемы сикхской общины и финансировать культурные программы. Это повышает общественное мнение среди сикхов, но может быть воспринято индусами как проявление фаворитизма."
 RAJ_appease_buddhists_desc: "Поддержка сохранения буддийского наследия и работы с местным населением. Это повышает общественное мнение о буддизме, но может быть воспринято индуистами как проявление фаворитизма."
 RAJ_appease_christians_desc: "Финансирование развития христианских общин и решение проблем дискриминации. Это повышает общественное мнение среди христиан, но может быть воспринято индуистами как проявление фаворитизма."
 RAJ_appease_muslims_desc: "Инвестируйте в благосостояние мусульманской общины и решайте проблемы безопасности. Это повысит авторитет мусульман, но может быть воспринято индусами как проявление фаворитизма."
 RAJ_naxalite_insurgency: "Жестокий наксалитский мятеж"
 RAJ_naxalite_insurgency_desc: "[RAJ.GetName] В стране наблюдается серьёзное повстанческое движение наксалитов и маоистов. В Красном коридоре активно действуют крупные партизанские отряды, часто устраиваются засады на силы безопасности, а повстанцы контролируют значительную территорию."
 RAJ_naxalite_insurgency_severe_TT: "§RУровень серьёзного мятежа§! — активное присутствие и действия партизан"
 RAJ_naxalite_insurgency_1: "Восстание высших наксалитов"
 RAJ_naxalite_insurgency_1_desc: "[RAJ.GetName] сталкивается с крайне активным повстанческим движением наксалитов. Повстанцы сохраняют значительное присутствие в сельских районах и часто совершают нападения на государственные учреждения и персонал."
 RAJ_naxalite_insurgency_high_TT: "§OВысокий уровень повстанческого движения§! — активное повстанческое движение с частыми нападениями"
 RAJ_naxalite_insurgency_2: "Умеренный наксалитский мятеж"
 RAJ_naxalite_insurgency_2_desc: "[RAJ.GetName] имеет дело с умеренным повстанческим движением наксалитов. Повстанцы действуют организованно, периодически происходят инциденты, но силы безопасности сохраняют общий контроль."
 RAJ_naxalite_insurgency_moderate_TT: "§YУмеренный уровень повстанческой активности§! — постоянное присутствие с периодической активностью"
 RAJ_naxalite_insurgency_3: "Слабый наксалитский мятеж"
 RAJ_naxalite_insurgency_3_desc: "[RAJ.GetName] присутствие наксалитов в этом регионе ограничено. Периодически происходят столкновения, но инфраструктура повстанцев значительно ослабла."
 RAJ_naxalite_insurgency_weak_TT: "§GСлабый уровень повстанческого движения§! — ограниченное присутствие, единичные инциденты"
 RAJ_naxalite_insurgency_4: "Восстание низших наксалитов"
 RAJ_naxalite_insurgency_4_desc: "[RAJ.GetName] В этом районе активность наксалитов минимальна. Регион в основном зачищен, за исключением отдельных инцидентов."
 RAJ_naxalite_insurgency_low_TT: "§GНизкий уровень повстанческой активности§! — минимальная активность, территория в основном зачищена"
 RAJ_development_boost: "Активная инициатива в области развития"
 RAJ_development_boost_TT: "§GИнициатива по развитию§! — повышение скорости строительства в рамках государственных программ развития"
 RAJ_integrated_development_initiative: "Инициатива по комплексному развитию"
 RAJ_integrated_development_initiative_desc: "Запустить комплексные программы развития в районах, пострадавших от наксалита, включая инфраструктуру, образование и здравоохранение. Это устраняет коренные причины мятежа, уменьшая недовольство племен и улучшая местные условия."
 RAJ_surrender_rehabilitation_program: "Программа капитуляции и реабилитации"
 RAJ_surrender_rehabilitation_program_desc: "Проводить политику капитуляции, предлагая амнистию и льготы по реабилитации наксалитам, которые сложат оружие. Исторически это было эффективным, и после таких программ наблюдались значительные потери."
 RAJ_operation_green_hunt: "Операция «Зелёная Охота»"
 RAJ_operation_green_hunt_desc: "Начните массированное скоординированное наступление военизированных формирований на опорные пункты наксалитов. В этой крупномасштабной операции участвуют центральные военизированные формирования, работающие совместно с полицией штата по зачистке и удержанию территории."
 RAJ_samadhan_doctrine: "Примите доктрину САМАДХАНА"
 RAJ_samadhan_doctrine_desc: "Внедряйте всеобъемлющую доктрину САМАДХАНА: разумное лидерство, агрессивная стратегия, мотивация и обучение, оперативный интеллект, ключевые показатели эффективности на основе панели инструментов, использование технологий, План действий для каждого театра военных действий и отсутствие доступа к финансированию."
 RAJ_naxal.10.t: "Слияние PWG и MCC формирует CPI (маоистский)"
 RAJ_naxal.10.d: "Группа \"Народная война\" и маоистский коммунистический центр объединились в Коммунистическую партию Индии (маоистскую). Это объединение создает более грозную повстанческую силу с объединенными кадрами, ресурсами и территориальным контролем по всему Красному Коридору."
 RAJ_naxal.10.a: "Это серьезная эскалация."
 RAJ_naxal.11.t: "Крупная атака Наксалита"
 RAJ_naxal.11.d: "Повстанцы-наксалиты предприняли разрушительную атаку на силы безопасности. В результате засады погибло несколько человек личного состава и уничтожено оборудование. Смелость этого нападения демонстрирует сохраняющуюся силу повстанцев."
 RAJ_naxal.11.a: "Мы должны ответить твердо."
 RAJ_naxal.12.t: "Массовая сдача наксалитов"
 RAJ_naxal.12.d: "После нашей программы реабилитации и продолжительного давления значительное количество наксалитских кадров сдалось властям. Бывшие повстанцы проходят процедуру реинтеграции в общество."
 RAJ_naxal.12.a: "Успех нашей политики."
 RAJ_naxal.13.t: "Лидерство Наксалита устранено"
 RAJ_naxal.13.d: "Операции, проводимые разведкой, привели к ликвидации ключевого лидера наксалитов. Этот удар по командной структуре повстанцев нарушит их операции и потенциально вызовет внутренние споры по поводу преемственности."
 RAJ_naxal.13.a: "Значительная победа."
 RAJ_naxal.14.t: "Протесты против перемещения племен"
 RAJ_naxal.14.d: "Племенные общины в районах, пострадавших от наксалита, протестуют против перемещения населения из-за добычи полезных ископаемых и промышленных проектов. Наксалиты пытаются извлечь выгоду из этих обид, чтобы набрать новые кадры и заручиться поддержкой населения."
 RAJ_naxal.14.a: "Игнорируйте протесты."
 RAJ_naxal.14.b: "Решите их проблемы."
 RAJ_naxal.15.t: "Операция «Зелёная Охота» завершена"
 RAJ_naxal.15.d: "Скоординированное наступление военизированных формирований достигло значительных результатов. Позиции наксалитов во многих штатах были ослаблены, их линии снабжения нарушены, а несколько опорных пунктов очищены. Повстанческое движение было ослаблено."
 RAJ_naxal.15.a: "Продолжайте надавливать."
 RAJ_naxal.16.t: "Наксал-Свободная Индия"
 RAJ_naxal.16.d: "После многих лет неустанных усилий Индия эффективно ликвидировала наксалито-маоистский мятеж. Красный коридор больше не представляет серьезной угрозы. Развитие достигло районов проживания племен, и бывшие повстанцы были реабилитированы. Это знаменует собой историческое достижение во внутренней безопасности."
 RAJ_naxal.16.a: "Начинается новая эра."
 RAJ_operation_green_hunt_active: "Операция «Зелёная Охота»: активна"
 RAJ_operation_green_hunt_active_desc: "Ведется массированное скоординированное наступление военизированных формирований на опорные пункты наксалитов. Силы безопасности зачищают и удерживают территорию по ту сторону Красного коридора."
 RAJ_samadhan_doctrine_idea: "Доктрина САМАДХАНА"
 RAJ_samadhan_doctrine_idea_desc: "Была принята всеобъемлющая стратегия борьбы с повстанцами, сочетающая разумное руководство, агрессивные операции, действенные разведданные и использование новейших технологий."
 RAJ_naxal_free_india: "Наксал-Свободная Индия"
 RAJ_naxal_free_india_desc: "Индия успешно ликвидировала наксалито-маоистский мятеж. Красный коридор был обеспечен, и развитие достигло ранее затронутых территорий племен."
 RAJ_salwa_judum_active: "Сальва Иудум активна"
 RAJ_salwa_judum_active_desc: "В Чхаттисгархе активно действует противоречивая программа гражданского ополчения \"Салва Джудум\" (\"Марш мира\" или \"Охота за очищением\"). Несмотря на свою эффективность в подавлении маоистов, она вызвала критику за нарушения прав человека."
 RAJ_counter_insurgency_operations: "Операции по борьбе с повстанцами"
 RAJ_counter_insurgency_operations_desc: "Начните всеобъемлющую кампанию по борьбе с повстанцами против оплотов наксалитов по всему Красному Коридору. Это будет включать скоординированные военные операции, сбор разведданных и стратегии территориального господства."
 RAJ_reduce_naxalite_level_tt: "Уменьшите уровень активности наксалита на 1 в этом состоянии"
 RAJ_naxal.17.t: "Засада Дантевады"
 RAJ_naxal.17.d: "6 апреля 2010 года наксалиты устроили засаду на роту сотрудников CRPF в районе Дантевада в Чхаттисгархе. В результате нападения погибли 76 сотрудников службы безопасности, что сделало его одним из самых смертоносных одиночных нападений в истории повстанцев. Маоисты применили самодельные взрывные устройства и автоматическое оружие в ходе хорошо скоординированной атаки, которая длилась несколько часов."
 RAJ_naxal.17.a: "Это национальная трагедия"
 RAJ_naxal.18.t: "Атака Сукмы"
 RAJ_naxal.18.d: "24 апреля 2017 года наксалиты устроили разрушительную засаду на сотрудников CRPF в районе Сукма в Чхаттисгархе. В результате нападения были убиты 25 сотрудников службы безопасности. Маоисты продолжают демонстрировать свою способность наносить удары, несмотря на годы операций по борьбе с повстанцами."
 RAJ_naxal.18.a: "Нас это не остановит"
 RAJ_salwa_judum: "Инициировать Салва Джудум"
 RAJ_salwa_judum_desc: "Сальва Джудум (\"Марш мира\" или \"Охота за очищением\") - противоречивое антинахалитское ополчение, поддерживаемое правительством штата Чхаттисгарх. Несмотря на свою эффективность в борьбе с повстанцами, она подверглась жесткой критике за нарушения прав человека и в конечном итоге была признана Верховным судом неконституционной в 2011 году."
 RAJ_road_connectivity_program: "Дорожное сообщение по Красному коридору"
 RAJ_road_connectivity_program_desc: "Улучшить дорожную инфраструктуру в районах, пострадавших от наксалита. Улучшение связи снижает влияние маоистов за счет доставки государственных служб в отдаленные районы проживания племен и затруднения действий повстанцев."
 RAJ_MAO_rebellion_desc: "Жесткое наксалитское восстание и растущая поддержка коммунистов подтолкнули маоистские ячейки к организации массовых демонстраций против правительства. Если их влияние не будет ограничено, за этим последует вооруженное восстание."
 RAJ_bolywood_idea_desc: "Индийская киноиндустрия, центром которой является Мумбаи, является крупнейшей в мире по объему производства. Ее культурное влияние распространяется на Южную Азию, Ближний Восток и индийскую диаспору по всему миру, выступая в качестве мощного инструмента для проецирования мягкой силы."
 RAJ_settle_gujarat_unrest: "Урегулировать беспорядки в Гуджарате"
 RAJ_settle_gujarat_unrest_desc: "Направить государственные ресурсы на урегулирование межобщинных конфликтов в Гуджарате и восстановление порядка, не дожидаясь действий конкретного правительства в Дели. Это повысит общественное мнение как среди индусов, так и среди мусульман. Как только уровень общественного мнения среди обеих групп достигнет 35 лет и выше, беспорядки в Гуджарате утихнут сами собой, а поддержание высокого уровня общественного мнения обеспечит спокойствие в регионе."
 RAJ_kashmir_unrest: "Беспорядки в Кашмире"
 RAJ_kashmir_unrest_desc: "В Кашмире сохраняется напряженность, а его мусульманское большинство чувствует себя отчужденным от Дели. Пока их недовольство не будет удовлетворено, операции по обеспечению безопасности подрывают моральный дух и стабильность во всей долине. Повышение общественного мнения среди мусульман посредством решения о примирении, межрелигиозного диалога и региональных инициатив, направленных на решение проблемы 35-летнего возраста, способствует устранению этих беспорядков."
 RAJ_punjab_unrest: "Пенджаб беспорядки"
 RAJ_punjab_unrest_desc: "Сохраняющаяся неприязнь сикхов держит Пенджаб в напряжении, истощая политический капитал и подрывая стабильность. Единственный путь к спокойствию — урегулирование проблем общины. Повышение общественного мнения сикхов посредством решения о примирении, межрелигиозного диалога и региональных инициатив, направленных на решение проблемы 35-летнего возраста, позволит устранить эту напряженность."
 RAJ_bengal_unrest: "Беспорядки в Бенгалии"
 RAJ_bengal_unrest_desc: "Межрелигиозные конфликты с мусульманским населением Бенгалии нарушают промышленность и порядок в регионе. Беспорядки продолжаются до тех пор, пока их вера не будет примирена с государством. Повышение общественного мнения среди мусульман посредством решения о примирении, межрелигиозного диалога и региональных инициатив, направленных на решение проблем, связанных с мусульманами (более 35%), способствует урегулированию этих беспорядков."
 RAJ_northeast_unrest: "Беспорядки на северо-востоке"
 RAJ_northeast_unrest_desc: "Христианские общины на северо-востоке не доверяют центральному правительству, что подпитывает сепаратистские настроения. Вербовка новобранцев и стабильность страдают до тех пор, пока не будут урегулированы их претензии. Повышение общественного мнения среди христиан посредством решения о примирении, межконфессионального диалога и региональных инициатив, направленных на решение проблемы 35-летнего возраста, способствует устранению этих волнений."
 RAJ_new_army_idea_desc: "В рамках комплексной программы модернизации индийские вооруженные силы были реструктурированы на основе новых доктринальных принципов, улучшены процессы набора новобранцев, оперативная координация и боеготовность во всех родах войск."
 RAJ_BRICS_desc: "Членство в БРИКС открывает торговые и политические связи с блоком, ускоряет скромное сотрудничество в области исследований и дает индийским переговорщикам более сильные позиции за столом переговоров с другими членами организации."
 RAJ_BRICS_associate: "Ассоциированный член БРИКС"
 RAJ_BRICS_associate_desc: "Статус ассоциированного члена привязывает страну к торговле и научным исследованиям стран БРИКС без полноправного членства, предоставляя ограниченные преимущества блока, но оставляя при этом возможность для продвижения по службе."
 RAJ_BRICS_observer: "BRICS Observer"
 RAJ_BRICS_observer_desc: "Статус наблюдателя позволяет стране оставаться вовлеченной в дипломатию БРИКС и укреплять торговые отношения с блоком, что является первым шагом к более глубокой интеграции."
 RAJ_brics_leadership_TT: "Будучи лидером БРИКС, Индия пользуется политическим влиянием и завоевывает положительную торговую репутацию, которая растет по мере присоединения к блоку новых стран."
 RAJ_BRICS_bank_desc: "Новый банк развития направляет кредиты государств-членов на стратегические проекты в ресурсной и промышленной сферах, повышая добычу местных ресурсов и объемы производства на заводах. Цена этого — уязвимость: иностранные державы получают рычаги влияния на наши финансовые решения."
 RAJ_BRICS_cur_desc: "Координация денежно-кредитной политики с блоком снижает наши затраты на финансирование и улучшает условия торговли с членами, однако первоначальные затраты на реструктуризацию наших экономических циклов высоки, а новый порядок увеличивает текущие расходы на модернизацию циклов."
 RAJ_steady_elephant: "Несгибаемый слон"
 RAJ_steady_elephant_desc: "Индия должна двигаться вперед с неуклонной, неудержимой тяжестью слона: терпеливой, непоколебимой в трудных ситуациях и решительной, когда ее провоцируют. Сильное и независимое государство требует именно такого идеала национального характера."
 RAJ_iri_fake_ns2_desc: "Проверки закупок и частичная реорганизация министерства обороны начали давать о себе знать. Неэффективное использование мощностей и завышенные затраты на переоборудование остаются серьезными проблемами, но худшие последствия искажений, существовавших во времена лицензионного режима, начинают ослабевать."
 RAJ_iri_fake_ns3_desc: "Реформы позволили сократить бюрократические проволочки настолько, что оборонные заводы работают с приемлемой эффективностью. Переоборудование гражданских производственных линий больше не является непомерно дорогим, хотя отдельные группы покровительства по-прежнему искажают результаты."
 RAJ_iri_fake_ns4_desc: "Современная система закупок, прозрачность контрактов и серьезная борьба с коррупцией превратили оборонную промышленность в конкурентоспособный сектор. Неэффективность теперь управляема, а не парализует отрасль."
 RAJ_re_fake_militar2_desc: "Реструктуризация командных структур и модернизация инструментов координации позволили стабилизировать значительную часть сил. Улучшаются оборонительные укрепления и дисциплина передвижения, хотя организация боевых действий по-прежнему отстает от армий равных по силе противников."
 RAJ_re_fake_militar3_desc: "Доктринальные реформы и интеграция объединенных штабов в значительной степени сократили разрыв с аналогичными армиями. Большинство подразделений теперь действуют в полевых условиях с предсказуемой сплоченностью."
 RAJ_re_fake_militar4_desc: "Целое поколение профессионализации принесло свои плоды. Индийские вооруженные силы теперь действуют с современной координацией, дисциплинированным маневром и доктриной укрепления позиций, характерной для армий высшего уровня."
 RAJ_industrial_expansion: "Промышленная экспансия"
 RAJ_industrial_expansion_desc: "Инвестиции в тяжелую промышленность и производственные мощности позволят модернизировать нашу экономику и создать рабочие места по всей стране."
 RAJ_agrarian_society: "Аграрное общество"
 RAJ_agrarian_society_desc: "Укрепление нашего сельскохозяйственного сектора обеспечивает продовольственную безопасность и поддерживает сельские общины, которые составляют основу нашей страны."
 RAJ_expanding_at_calcutta: "Расширение деятельности в Калькутте"
 RAJ_expanding_at_calcutta_desc: "В связи с ростом населения мы сталкиваемся с необходимостью расширения Калькутты. Мы черпаем вдохновение из политики постоянного расширения, применяемой в других крупных городах."
 RAJ_standard_rationing: "Стандартное нормирование и земельная реформа"
 RAJ_standard_rationing_desc: "Реформы в сфере нормирования земли и продовольствия модернизируют сельское хозяйство, одновременно подрывая традиционные властные структуры."
 RAJ_indian_air_force: "ВВС Индии"
 RAJ_indian_air_force_desc: "Модернизировать ВВС Индии и расширить их боевую подготовку, создав опытные экипажи, необходимые для контроля над нашим воздушным пространством."
 RAJ_NAJA_idea_1_desc: "Военизированные и полицейские формирования, оснащенные оружием военного образца и прошедшие соответствующую подготовку, развернуты для поддержания внутренней безопасности и противодействия угрозам со стороны повстанцев в конфликтных регионах."
 RAJ_network_centric_warfare: "Сетецентрическая война"
 RAJ_network_centric_warfare_desc: "Сетецентрическая война, также называемая сетецентрическими операциями или сетевой войной, — это военная доктрина или теория войны, целью которой является преобразование информационного преимущества, частично обеспечиваемого информационными технологиями, в конкурентное преимущество посредством компьютерной сети рассредоточенных сил."
 RAJ_interfaith_dialogue: "Созыв межрелигиозного диалога"
 RAJ_interfaith_dialogue_desc: "Необходимо профинансировать долгосрочную национальную программу примирения, которая объединит представителей всех конфессий за одним столом. Это позволит одновременно улучшить общественное мнение во всех общинах, не оставив ни одной группы в обиде, но этот процесс медленный и требует значительных финансовых затрат."
 RAJ_religion_conflict_musl_hindu_title: "Вспыхнуло насилие между индусами и мусульманами."
 RAJ_religion_conflict_musl_hindu_desc: "В одном из крупнейших и наиболее густонаселенных городов группа индусов и мусульман начала конфликт из-за неизвестного спора. Однако известно, что обе стороны активно раздирают друг друга на части, и это серьезно сказывается на работе местной полиции."
 RAJ_religion_conflict_musl_christ_title: "Мусульмане и христиане враждуют"
 RAJ_religion_conflict_musl_christ_desc: "Сегодня между мусульманами и христианами возник конфликт из-за строительства церкви рядом с мечетью. Обе стороны утверждают, что другая сторона должна перенести свое место поклонения в другое место в городе, и даже поступают сообщения о небольших стычках по всему городу."
 RAJ_religion_conflict_hindu_christ_title: "Столкновения между индуистами и христианами"
 RAJ_religion_conflict_hindu_christ_desc: "Сегодня утром группа индусов была возмущена оскорблением со стороны христианина, который пытался обратить в свою веру индуса. Инцидент перерос в открытые столкновения между двумя группами, в результате которых были подожжены несколько зданий."
 RAJ_religion_conflict_back_hindu: "Поддержите индусов!"
 RAJ_religion_conflict_back_muslim: "Поддержите мусульман"
 RAJ_religion_conflict_back_christian: "Поддержите христиан"
 RAJ_religion_conflict_resolve: "Найдите решение, которое устроит обе стороны."
 RAJ_drdo_idea_desc: "Организация оборонных исследований и разработок направляет отечественные НИОКР в вооруженные силы, ускоряя военные исследования, снижая стоимость перепрофилирования гражданских мощностей для военного производства и способствуя развитию искусственного интеллекта в военной сфере."
 RAJ_indian_national_congress: "Индийский национальный конгресс"
 RAJ_indian_national_congress_desc: "Индийский национальный конгресс является доминирующей силой в индийской политике с момента обретения независимости. Укрепление партийного аппарата будет способствовать консолидации демократического управления."
 RAJ_indian_socialism_idea_desc: "Наследие Неру в виде смешанной экономики обуславливает жесткий государственный контроль над промышленным производством, производством оружия и инфраструктурой. Производственный объем резко возрастает, но социальная сплоченность страдает из-за жесткой системы разрешений."
 RAJ_scandinavian_model_idea_desc: "Импортированные модели социал-демократической политики снижают стоимость образования и стабилизируют политический порядок за счет раздутой бюрократии и более спокойного, менее милитаризованного общественного настроения."
 RAJ_true_social_democracy_idea_desc: "Развитая система социального обеспечения сокращает социальные и медицинские расходы, увеличивая поддержку войны за счет видимой государственной компетентности. Расходы на персонал растут, а политическая стабильность несколько снижается под бременем перераспределения ресурсов."
 RAJ_new_democratic_india_idea_desc: "Подтверждение приверженности демократическим нормам повышает стабильность, ускоряет наращивание политической власти и усиливает демократические тенденции во внутреннем общественном мнении."
 RAJ_vietnamese_intervention: "Ставить под сомнение независимость Вьетнама"
 RAJ_demand_singapore: "Спрос Сингапура"
 RAJ_demand_singapore_desc: "Укрепив свои региональные позиции, настало время заявить о своих исторических претензиях на Сингапур и включить этот город-государство в свою сферу влияния."
 RAJ_arms_export_economy: "Экономика экспорта вооружений"
 RAJ_brics_leadership: "Лидеры БРИКС"
 RAJ_religious_climate: "Религиозная атмосфера"
 RAJ_country_has_any_naxalite_states: "В одном из штатов Индии активно действуют наксалиты."
 RAJ_has_severe_naxalite_states_trigger: "В одном из штатов Индии наблюдается значительное присутствие наксалитов."
 RAJ_state_has_any_naxalite: "В этом штате активно действуют наксалиты."
 RAJ_country_has_any_naxalite_states_TT: "В любом штате присутствует активное присутствие наксалитов."
 RAJ_has_severe_naxalite_states_trigger_TT: "В любом штате наблюдается активное и масштабное присутствие наксалитов."
 RAJ_hindu_discontent: "Недовольство индусов"
 RAJ_hindu_discontent_desc: "Индуистское большинство всё больше недовольно политикой правительства. Как самая многочисленная демографическая группа, их недовольство угрожает политической стабильности и подрывает базу поддержки правительства. Повышение общественного мнения среди индусов имеет первостепенное значение. §Y35§! На этом всё заканчивается."
 RAJ_religious_harmony: "Религиозная гармония"
 RAJ_religious_harmony_desc: "Все основные религиозные общины Индии положительно относятся к правительству. Эта межрелигиозная гармония укрепляет национальное единство и привлекает инвестиции. Проводится в условиях, когда каждая вера стоит выше §Y74§!."
 RAJ_religious_climate_TT: "§YРелигиозная атмосфера§!Шкала стабильности и политической власти согласуется со средним мнением представителей всех пяти религий. Каждый из пунктов выше. §Y50§! стоит §G+0.4%§! Для каждого из них каждая точка ниже стоит одинаково, но не более того. §G+10%§! и §R-10%§!."
 RAJ_settle_gujarat_unrest_TT: "[RAJ.GetNameWithFlag] §YMuslim§! Мнение выше 50\n[RAJ.GetNameWithFlag] §YHindu§! Мнение выше 50."
 RAJ_maoist_suppression: "Рейд на маоистов в [FROM.GetName]"
 RAJ_suppression_failed_tt: "§RРейд провалился.§!Сочувствующие маоистам сплачиваются вокруг провальной операции, усиливая поддержку коммунистов."
 RAJ_delhi_caliphate: "Провозгласить Делийский халифат"
 RAJ_delhi_caliphate_desc: "Салафитское движение захватывает государственный аппарат и провозглашает халифат во главе с Дели, положив конец конституционной республике и обязав новое правительство подчиняться исламскому праву."
 RAJ_iran_doctrinal_dispute: "Противостояние иранской доктрине"
 RAJ_iran_doctrinal_dispute_desc: "Шиитская революционная доктрина Тегерана является прямым идеологическим соперником суннитского салафитского проекта. Противостояние региональному влиянию Ирана в настоящее время является стратегическим приоритетом."
 RAJ_MAO_rebellion_armed: "Вооруженный конфликт неизбежен"
 RAJ_MAO_rebellion_armed_desc: "Маоистское повстанческое движение вышло за рамки демонстраций. Вооруженные ячейки мобилизуются для открытой войны против правительства. Если это не остановить, гражданская война неизбежна."
 RAJ_central_asian_revolution: "Салафитская революция в [FROM.GetName]"
 RAJ_central_asian_revolution_desc: "В [FROM.GetNameDefCap] сложились благоприятные условия для салафитского восстания. Направьте наше влияние на местное фашистское движение и спровоцируйте вооруженную революцию, чтобы подчинить страну нашей власти."
 RAJ_BRICS_polit_alliance_faction_warning_tt: "§RПредупреждение:§! это приведет к §Rраспаду вашей существующей фракции§! и замене ее новой фракцией БРИКС. Все приглашенные вами лица, не являющиеся членами БРИКС, будут §Rотклонены§!."
 RAJ_arms_export_economy_TT: "§YЭкономия от масштаба при экспорте вооружений§!\nКаждый отдельный экспортный партнер увеличивает §Gпроизводственные мощности§! по мере масштабирования оборонной промышленности: §G+1%§! объем производства на заводе на одного партнера."
 RAJ_energy_idea_desc: "Инвестиции в отечественную атомную энергетику расширяют генерирующие мощности и снижают нашу зависимость от импортного топлива."
 RAJ_207_sd_idea_desc: "Tata Indica, первый в Индии полностью отечественный легковой автомобиль, является опорой внутреннего автомобильного сектора, который ускоряет строительство и наращивание объемов производства, приносит налоговые поступления корпорациям и оказывает умеренное влияние на политическую стабильность и рост населения."
 RAJ_network_improvement_idea_desc: "Модернизация национальной телекоммуникационной инфраструктуры ускоряет развертывание цифровых сетей по всей стране."
 RAJ_socdem_stability_factor: "Фактор стабильности"
 RAJ_Local_markets_desc: "Процветают внутренние базары и уличная торговля, что ускоряет строительство малоэтажных зданий по всей стране."
 TT_RAJ_LOCAL_MARKETS_MODIFIER: "§Y Дополнительный доход§!: $§G0.080§!"
 indian_event.61.t: "Взрывы поездов в Мумбаи"
 indian_event.61.d: "11 июля 2006 года серия из семи скоординированных взрывов бомб потрясла пригородную железнодорожную сеть Мумбаи в час пик, убив 209 человек и ранив более 700. Эти атаки, совершенные группировкой «Лашкар-э-Тайба» при поддержке местных жителей, были направлены против жизненно важной транспортной артерии города и вызвали шок по всей стране."
 indian_event.61.a: "Это акт войны."
 RAJ_naxal.19.t: "Засада в долине Дарбха"
 RAJ_naxal.19.d: "25 мая 2013 года боевики-наксалиты устроили засаду на колонну Индийского национального конгресса в долине Дарбха в штате Чхаттисгарх, убив 27 человек, включая высокопоставленных лидеров штата и их телохранителей. Это нападение выявило серьезные пробелы в разведывательной деятельности и безопасности маршрутов в Красном коридоре."
 RAJ_naxal.19.a: "Повстанческое движение должно быть подавлено."
 indian_event.62.t: "Атака базы Ури"
 indian_event.62.d: "18 сентября 2016 года четверо боевиков атаковали штаб бригады индийской армии недалеко от Ури в Джамму и Кашмире, убив 19 солдат и ранив 30 других. Это нападение, одно из самых смертоносных нападений на силы безопасности в Кашмире, вызвало широкие призывы к ответным действиям."
 indian_event.62.a: "За это им придётся заплатить."
 indian_event.63.t: "Объявлена ​​деноминация."
 indian_event.63.d: "8 ноября 2016 года правительство внезапно объявило о деноминации банкнот номиналом 500 и 1000 рупий, в результате чего 86% национальной валюты в одночасье стали недействительными. Хотя этот шаг был направлен на борьбу с теневой экономикой и поддельными деньгами, он вызвал масштабные сбои в повседневной жизни и неформальной экономике."
 indian_event.63.a: "Необходимая жертва."
 RAJ_eastas.6.t: "Противостояние в Докламе"
 RAJ_eastas.6.d: "В июне 2017 года индийские и китайские войска оказались в 73-дневном противостоянии на стыке границ трех государств в Докламе, недалеко от Бутана. Попытки Китая проложить дорогу на спорную территорию были заблокированы индийскими силами, что поставило две ядерные державы на грань вооруженного конфликта в Гималаях."
 RAJ_eastas.6.a: "Мы не уступим ни пяди."
 indian_event.64.t: "Теракт в Пулваме"
 indian_event.64.d: "14 февраля 2019 года террорист-смертник из группировки «Джаиш-э-Мохаммед» направил начиненный взрывчаткой автомобиль в колонну Центральной резервной полиции Индии (CRPF) недалеко от Пулвамы в Кашмире, убив 40 сотрудников. Это самое смертоносное террористическое нападение на силы безопасности за последние десятилетия вызвало национальный кризис и требования возмездия."
 indian_event.64.a: "Кровь требует крови."
 indian_event.65.t: "Статья 370 отменена."
 indian_event.65.d: "5 августа 2019 года правительство отменило статью 370 Конституции, лишив Джамму и Кашмир особого автономного статуса и разделив штат на две союзные территории. Этот шаг, сопровождавшийся усилением мер безопасности и отключением связи, вызвал как одобрение внутри страны, так и международную обеспокоенность."
 indian_event.65.a: "Кашмир полностью интегрирован."
 indian_event.66.t: "Вспыхнули протесты против закона о гражданстве."
 indian_event.66.d: "В декабре 2019 года по всей стране вспыхнули массовые протесты против Закона о внесении поправок в закон о гражданстве, который предоставляет гражданство немусульманским беженцам из соседних стран, но исключает мусульман. Демонстранты утверждают, что закон нарушает светские принципы Конституции."
 indian_event.66.a: "Мы должны прислушиваться к народу."
 RAJ_eastas.7.t: "Столкновение в долине Галван"
 RAJ_eastas.7.d: "15 июня 2020 года в долине Галван в Ладакхе произошли жестокие рукопашные бои между индийскими и китайскими войсками, в результате которых погибли 20 индийских солдат и неизвестное число китайских военнослужащих. Это столкновение стало первым смертельным пограничным конфликтом между двумя странами с 1975 года."
 RAJ_eastas.7.a: "Мы почтим их жертву."
 RAJ_naxal.20.t: "Засада в Биджапуре"
 RAJ_naxal.20.d: "3 апреля 2021 года боевики-наксалиты устроили засаду на силы безопасности в районе Биджапур штата Чхаттисгарх, убив 22 человека. Это одно из самых смертоносных нападений за последние годы. Инцидент подчеркивает сохраняющуюся угрозу в Красном коридоре, несмотря на многолетние контртеррористические операции."
 RAJ_naxal.20.a: "Они не сломят нашу решимость."
 RAJ_naxal.21.t: "Верховный суд отменил решение Верховного суда по делу Salwa Judum."
 RAJ_naxal.21.d: "5 июля 2011 года Верховный суд Индии признал «Салва Джудум» неконституционным, распорядившись о немедленном разоружении поддерживаемого государством племенного ополчения. Суд установил, что вооружение плохо подготовленных гражданских лиц для борьбы с маоистами нарушает основные права человека и подпитывает тот самый цикл насилия, который оно должно было подавлять. Критики внутри страны и международные правозащитные организации внимательно следят за действиями Нью-Дели."
 RAJ_naxal.21.a: "Мы выполним постановление суда."
 RAJ_human_rights_scrutiny: "Контроль за соблюдением прав человека"
 RAJ_human_rights_scrutiny_desc: "Международные правозащитные организации и отечественная пресса пристально изучают действия по борьбе с повстанцами. Стабильность и политический капитал страдают, а иностранные разведывательные службы считают Индию более легкой мишенью на время пристального внимания общественности."
 indian_event.67.t: "В Манипуре вспыхнули беспорядки."
 indian_event.67.d: "В мае 2023 года в Манипуре вспыхнуло этническое насилие между общинами мейтеев и куки, что привело к многомесячным столкновениям, поджогам и перемещению населения. Кризис, коренящийся в земельных правах, статусе резерваций и религиозных разногласиях, обнажил глубокие противоречия в этом северо-восточном штате."
 indian_event.67.a: "Мы должны восстановить порядок."
 RAJ_regional.1.t: "Трансграничная забастовка"
 RAJ_regional.1.d: "9 июня 2015 года индийская армия провела точечные удары через границу с Мьянмой, уничтожив лагеря NSCN-K, ответственные за засаду, в результате которой в районе Чандел штата Манипур погибли 18 солдат. Эта операция стала первым признанным трансграничным ударом Индии по убежищам повстанцев."
 RAJ_regional.1.a: "Они сами напросились."
 RAJ_regional.2.t: "Анклавный обмен с Бангладеш"
 RAJ_regional.2.d: "6 июня 2015 года Индия и Бангладеш обменялись 162 анклавами в рамках знакового соглашения, положившего конец 68-летнему пограничному спору. Более 50 000 лиц без гражданства наконец-то получат гражданство."
 RAJ_regional.2.a: "Исторический день."
 RAJ_regional.3.t: "Кризис с рохинджа достиг Индии."
 RAJ_regional.3.d: "В августе 2017 года военные репрессии в Мьянме вынудили более 700 000 рохинджа пересечь границу и бежать в Бангладеш. Индия принимает 40 000 беженцев рохинджа, и правительство должно решить, предоставить ли им убежище или депортировать их."
 RAJ_regional.3.a: "Депортировать их всех."
 RAJ_regional.3.b: "Предоставьте им убежище."
 RAJ_regional.4.t: "Переговоры по реке Тиста провалились"
 RAJ_regional.4.d: "В апреле 2017 года премьер-министр Бангладеш Хасина прибыла в Нью-Дели в надежде завершить соглашение о разделе вод реки Тиста. Главный министр Западной Бенгалии в очередной раз заблокировал соглашение, оставив Дакку ни с чем."
 RAJ_regional.4.a: "Преодолеть сопротивление со стороны штата."
 RAJ_regional.4.b: "Внутренняя политика стоит на первом месте."
 RAJ_regional.5.t: "Комиссия по ядерному регулированию (NRC) не включает миллионы"
 RAJ_regional.5.d: "В августе 2019 года из окончательного Национального реестра граждан Ассама были исключены 1,9 миллиона человек, большинство из которых — бенгальские мусульмане. В сочетании с Законом о внесении поправок в закон о гражданстве этот шаг вызвал общенациональные протесты и яростную реакцию со стороны Дакки."
 RAJ_regional.5.a: "Этого требует национальная безопасность."
 RAJ_regional.6.t: "Кампания по проведению референдума о Халистане"
 RAJ_regional.6.d: "В 2020 году запрещенная организация «Сикхи за справедливость» инициировала глобальный необязывающий референдум о независимости, собравший большое количество участников из сикхской диаспоры. Несмотря на репрессии со стороны правительства, это движение подпитывает сепаратистские настроения внутри страны."
 RAJ_regional.6.a: "Разгромите это движение."
 RAJ_regional.7.t: "Мьянманские беженцы наводняют границу."
 RAJ_regional.7.d: "После военного переворота в Мьянме в феврале 2021 года тысячи беженцев из народа чин перебрались в Мизорам и Манипур. Центральное правительство приказало штатам выдворить их обратно, но главный министр Мизорама открыто бросает вызов Нью-Дели."
 RAJ_regional.7.a: "Запечатайте границу."
 RAJ_regional.7.b: "Пропустите их."
 RAJ_regional.8.t: "Рамочное соглашение о мире в Нагаленде подписано."
 RAJ_regional.8.d: "3 августа 2015 года правительство подписало рамочное соглашение с NSCN-IM после 18 лет переговоров. Соглашение обещает урегулировать одно из старейших повстанческих движений в Азии и открыть новую главу в истории Северо-Востока."
 RAJ_regional.8.a: "Шаг к прочному миру."
 RAJ_regional.9.t: "Трансграничная контрабанда оружия"
 RAJ_regional.9.d: "Разведка обнаружила действующий канал поставок оружия из Мьянмы в северо-восточный Красный коридор. Совместная операция с Мьянмой могла бы его перекрыть, но для этого потребуются ресурсы и дипломатический капитал."
 RAJ_regional.9.a: "Начать совместную операцию."
 RAJ_regional.9.b: "Мы не можем выделить необходимые ресурсы."
 RAJ_regional.10.t: "Кризис, связанный с убийством Ниджара"
 RAJ_regional.10.d: "В июне 2023 года в Британской Колумбии был убит лидер халистанцев Хардип Сингх Ниджар. Премьер-министр Канады публично обвинил Индию в организации этого убийства, что спровоцировало самый серьезный дипломатический кризис между двумя странами за последние десятилетия."
 RAJ_regional.10.a: "Выслать их дипломатов."
 RAJ_regional.11.t: "Военно-морские учения в Бенгальском заливе"
 RAJ_regional.11.d: "В 2014 году Индия расширила морское сотрудничество с Бангладеш и Мьянмой в рамках соглашения BIMSTEC, проводя совместное патрулирование и предоставляя корветы военно-морским силам обеих стран. Эта инициатива укрепляет позиции Индии как доминирующей военно-морской державы в Бенгальском заливе."
 RAJ_regional.11.a: "Проявляйте силу в наших водах."
 RAJ_regional.12.t: "Убийства на границе сотрудниками пограничной службы"
 RAJ_regional.12.d: "Индийские пограничные силы вновь обвиняются в убийстве мирных жителей Бангладеш вдоль границы. Дакка выразила официальный протест, а правозащитные организации призывают к привлечению виновных к ответственности."
 RAJ_regional.12.a: "Приказ об ограничении свободы."
 RAJ_regional.12.b: "Граница должна быть удержана."
 RAJ_regional.13.t: "Блокада границы Непала"
 RAJ_regional.13.d: "В сентябре 2015 года, после принятия Непалом новой конституции, которая ставит в невыгодное положение меньшинство мадхеси, Индия ограничила поставки топлива и других товаров через границу. Непал столкнулся с гуманитарным кризисом в преддверии зимы, и Китай предложил альтернативные пути снабжения."
 RAJ_regional.13.a: "Ужечь блокаду."
 RAJ_regional.13.b: "Смягчение ограничений."
 RAJ_regional.13.c: "Снимите блокаду."
 RAJ_regional.14.t: "Непал обращается к Китаю"
 RAJ_regional.14.d: "Многомесячные ограничения поставок нанесли сокрушительный удар по экономике Непала. Катманду подписал новые торговые и транзитные соглашения с Пекином, что является резким изменением ситуации в стране, долгое время находившейся в орбите влияния Индии. Блокада стала поучительным примером чрезмерного вмешательства."
 RAJ_regional.14.a: "Ущерб уже нанесен."
 RAJ_regional.14.b: "Протяните оливковую ветвь."
 RAJ_regional.14.c: "Наша сдержанность оправдала себя."
 RAJ_regional.15.t: "Пограничный спор в Калапани"
 RAJ_regional.15.d: "В мае 2020 года парламент Непала единогласно принял конституционную поправку, претендующую на Калапани, Липулех и Лимпиядхуру. Спорная территория на стыке трех границ Индии, Непала и Китая находится на границе, и размещение там войск может привести к эскалации напряженности по всей гималайской границе."
 RAJ_regional.15.a: "Укрепляйте наши позиции."
 RAJ_regional.15.b: "Предложить начать переговоры."
 RAJ_regional.15.c: "Примите участие в совместном опросе."
 RAJ_regional.16.t: "Договор 1950 года находится на рассмотрении."
 RAJ_regional.16.d: "Непал официально предложил пересмотреть Договор о мире и дружбе 1950 года, назвав его неравноправным пережитком прошлого. Договор лежит в основе влияния Индии на внешнюю и оборонную политику Непала, и его пересмотр может изменить двусторонние отношения."
 RAJ_regional.16.a: "Модернизируйте партнерство."
 RAJ_regional.16.b: "Договор остается в силе."
 RAJ_regional.17.t: "Бутан благодарит Индию"
 RAJ_regional.17.d: "После урегулирования конфликта в Докламе Бутан в частном порядке выразил глубокую благодарность Индии за готовность противостоять Китаю на своей суверенной территории. Тхимпху стремится к формализации более прочных оборонных связей."
 RAJ_regional.17.a: "Укрепить альянс."
 RAJ_regional.17.b: "Достаточно рукопожатия."
 RAJ_regional.18.t: "Расширение гидроэнергетического сектора Бутана"
 RAJ_regional.18.d: "Введена в эксплуатацию гидроэлектростанция Мангдечху, увеличивающая мощность на 720 МВт. Индия финансирует и строит плотины в Бутане, а также закупает излишки электроэнергии, что является основой одного из самых несбалансированных, но стабильных партнерств в Южной Азии."
 RAJ_regional.18.a: "Расширить партнерство."
 RAJ_regional.18.b: "У нас и так достаточно обязательств."
 RAJ_regional.19.t: "Бутан поддерживает демократию"
 RAJ_regional.19.d: "В марте 2008 года король Джигме Сингье Вангчук руководил мирным переходом Бутана от абсолютной монархии к конституционной демократии. Первые выборы прошли без инцидентов. Ближайший союзник Индии вступает в новую эру."
 RAJ_regional.19.a: "Приветствуйте их в демократии."
 RAJ_regional.19.b: "Монархия была проще."
 RAJ_regional.20.t: "Блокада со стороны Индии дает о себе знать."
 RAJ_regional.20.d: "Закрытие Индией пограничных переходов привело к критической нехватке топлива, медикаментов и сжиженного газа в Непале. Пекин предложил экстренную помощь и право транзита через Тибет. Катманду стоит перед сложным выбором между гордостью и прагматизмом."
 RAJ_regional.20.a: "Примите предложение Китая."
 RAJ_regional.20.b: "Терпите и ведите переговоры."
 RAJ_regional.21.t: "Оттава требует подотчетности"
 RAJ_regional.21.d: "Канада официально обвинила Индию в причастности к убийству сикхского лидера Хардипа Сингха Ниджара на территории Канады. Оттава обдумывает свои дальнейшие действия, поскольку дипломатический тупик угрожает двусторонней торговле и многочисленной индо-канадской диаспоре."
 RAJ_regional.21.a: "Выслать индийских дипломатов."
 RAJ_regional.21.b: "Добиваться дипломатического урегулирования."
 RAJ_regional.22.t: "Дакка осуждает высылку рохинджа."
 RAJ_regional.22.d: "Индия начала депортацию беженцев-рохинджа обратно в Мьянму, что вызвало резкое осуждение со стороны Дакки. Бангладеш, уже переполненный более чем миллионом беженцев из Мьянмы, назвал этот шаг предательством общих гуманитарных обязательств."
 RAJ_regional.22.a: "Осудить решение Нью-Дели."
 RAJ_regional.23.t: "Дакка приветствует солидарность Индии."
 RAJ_regional.23.d: "Решение Индии предоставить убежище беженцам-рохинджа, а не высылать их, было тепло встречено в Дакке. Бангладеш рассматривает это как акт подлинной солидарности в кризисной ситуации, которая затронула все страны региона."
 RAJ_regional.23.a: "Мы высоко ценим солидарность Индии."
 RAJ_regional.24.t: "Индия укрепляет Калапани"
 RAJ_regional.24.d: "Индийские войска переместились для усиления позиций в спорном районе стыка провинций Калапани и Липулех спустя несколько дней после того, как парламент Непала единогласно заявил о своих правах на эту территорию. Катманду должен решить, следует ли ему ответить взаимностью на военную позицию Индии или искать дипломатический выход из ситуации."
 RAJ_regional.24.a: "Мобилизуйте наши силы."
 RAJ_regional.24.b: "Протест посредством дипломатии."
 RAJ_regional.25.t: "Бутан рассматривает возможность заключения союза с Индией."
 RAJ_regional.25.d: "После противостояния в Докламе Индия углубила свое оборонное партнерство с Бутаном. Тхимпху благодарен Индии за вмешательство, но помнит, что полное сближение может еще больше спровоцировать Пекин, который имеет собственные территориальные претензии на территорию Бутана."
 RAJ_regional.25.a: "Индия – наш щит."
 RAJ_regional.25.b: "Мы не должны провоцировать Китай."
 RAJ_regional.26.t: "Дакка подписала соглашение по реке Тиста."
 RAJ_regional.26.d: "После многолетних переговоров, зашедших в тупик из-за возражений Западной Бенгалии, Индия наконец преодолела внутреннюю оппозицию и предложила подписать соглашение о разделе водных ресурсов реки Тиста. Эта сделка является крупной дипломатической победой для Бангладеш и может преобразовать двусторонние отношения."
 RAJ_regional.26.a: "Подпишите соглашение."
 RAJ_ladakh_crisis: "Ладакхский сепаратистский кризис"
 RAJ_ladakh_crisis_desc: "Уровень общественного мнения среди мусульман в Ладакхе опасно упал. Если мы в ближайшее время не урегулируем их недовольство, регион может объявить о независимости."
 RAJ_meghalaya_crisis: "Сепаратистский кризис в Мегхалае"
 RAJ_meghalaya_crisis_desc: "Уровень христианского общественного мнения в Мегхалае опасно упал. Если мы в ближайшее время не урегулируем их недовольство, регион может объявить о независимости."
 RAJ_manipur_crisis: "Сепаратистский кризис в Манипуре"
 RAJ_manipur_crisis_desc: "Уровень христианского общественного мнения в Манипуре опасно упал. Если мы в ближайшее время не урегулируем их недовольство, регион может объявить о независимости."
 RAJ_sikkim_crisis: "Сепаратистский кризис в Сиккиме"
 RAJ_sikkim_crisis_desc: "Популярность буддизма в Сиккиме опасно упала. Если мы в ближайшее время не урегулируем их недовольство, регион может объявить о независимости."
 RAJ_punjab_crisis: "Пенджабский сепаратистский кризис"
 RAJ_punjab_crisis_desc: "Общественное мнение о сикхах в Пенджабе опасно упало. Если мы в ближайшее время не урегулируем их проблемы, регион может объявить о независимости."
 RAJ_raise_muslim_opinion_tt: "Мнение мусульман должно быть старше 19 лет."
 RAJ_raise_christian_opinion_tt: "Мнение христианина должно быть старше 19 лет."
 RAJ_raise_buddhist_opinion_tt: "Мнение буддистов должно быть старше 19 лет."
 RAJ_raise_sikh_opinion_tt: "Мнение сикхов должно быть старше 14 лет."
 RAJ_rebellion.1.a: "Это катастрофа."
 RAJ_rebellion.1.b: "Ситуация стабилизировалась."
 RAJ_rebellion_ladakh_title: "Ладакх провозгласил независимость"
 RAJ_rebellion_ladakh_desc: "Мусульманское население Ладакха утратило всякое доверие к центральному правительству. Вооруженные сепаратисты захватили контроль над регионом и провозгласили независимость. Наши силы были изгнаны из этого района."
 RAJ_rebellion_meghalaya_title: "Мегхалая провозгласила независимость"
 RAJ_rebellion_meghalaya_desc: "Христианские общины Мегхалаи восстали против центрального правительства. Племенные ополчения захватили контроль над штатом и провозгласили независимость."
 RAJ_rebellion_manipur_title: "Манипур провозгласил независимость"
 RAJ_rebellion_manipur_desc: "Христианские и племенные общины Манипура восстали против центрального правительства. Вооруженные группы захватили контроль над штатом и провозгласили независимость."
 RAJ_rebellion_sikkim_title: "Сикким провозгласил независимость"
 RAJ_rebellion_sikkim_desc: "Буддийское население Сиккима утратило всякую веру в центральное правительство. Сепаратистские силы захватили власть и провозгласили независимость, стремясь восстановить суверенитет Сиккима."
 RAJ_rebellion_punjab_title: "Пенджаб провозгласил независимость"
 RAJ_rebellion_punjab_desc: "Сикхское население Пенджаба полностью утратило веру в центральное правительство. Сепаратисты-халистанцы захватили контроль над регионом и провозгласили независимость."
 indian_event.70.t: "Приглашение к полноправному членству в БРИКС"
 indian_event.70.d: "[FROM.GetName] направил приглашение нашей стране присоединиться к БРИКС в качестве полноправного члена. Это представляет собой значительную возможность углубить наши экономические и политические связи с наиболее динамично развивающимися экономиками мира. Полноправное членство предоставляет нам право голоса, доступ к Новому банку развития и участие во всех инициативах БРИКС."
 indian_event.70.a: "Примите приглашение с честью."
 indian_event.70.b: "Отказ — мы не соответствуем требованиям."
 indian_event.71.t: "[FROM.GetName] принимает полноправных членов стран БРИКС"
 indian_event.71.d: "[FROM.GetName] официально принял наше приглашение присоединиться к БРИКС в качестве полноправного члена. Это историческое расширение укрепляет наш альянс и открывает новые возможности для сотрудничества в сфере торговли, финансов и безопасности."
 indian_event.71.a: "Примите их в свои ряды."
 indian_event.72.t: "[FROM.GetName] отказывается от полноправного членства в БРИКС"
 indian_event.72.d: "[FROM.GetName] отклонил наше приглашение присоединиться к БРИКС в качестве полноправного члена. Хотя это и разочаровывает, мы уважаем их решение и надеемся продолжить дипломатическое взаимодействие по другим каналам."
 indian_event.72.a: "Упущенная возможность"
 indian_event.73.t: "Приглашение к членству в качестве ассоциированного члена БРИКС"
 indian_event.73.d: "[FROM.GetName] пригласил нас стать ассоциированным членом БРИКС. Этот статус предоставляет расширенные возможности сотрудничества, но не дает полных прав голоса. Ассоциированные члены участвуют в экономических инициативах и имеют статус наблюдателя на саммитах."
 indian_event.73.a: "Принять ассоциированное членство"
 indian_event.73.b: "Спад - не выполнены требования"
 indian_event.74.t: "[FROM.GetName] принимает ассоциированное членство в странах БРИКС"
 indian_event.74.d: "[FROM.GetName] принял наше приглашение стать ассоциированным членом БРИКС. Это укрепляет наши экономические связи и открывает новые возможности для сотрудничества."
 indian_event.74.a: "Шаг к полной интеграции"
 indian_event.75.t: "[FROM.GetName] отказывается от ассоциированного членства в БРИКС"
 indian_event.75.d: "[FROM.GetName] отклонил наше предложение о ассоциированном членстве в БРИКС. Мы по-прежнему открыты для дальнейшего сотрудничества."
 indian_event.75.a: "Возможно, в другой раз."
 indian_event.76.t: "Приглашение к получению статуса наблюдателя от стран БРИКС"
 indian_event.76.d: "[FROM.GetName] предложил нам статус наблюдателя в БРИКС. Это позволит нам посещать саммиты, участвовать в рабочих группах и налаживать отношения с государствами-членами в рамках рассмотрения возможности более глубокого взаимодействия."
 indian_event.76.a: "Принять статус наблюдателя"
 indian_event.76.b: "Отказ - не заинтересован"
 indian_event.77.t: "[FROM.GetName] принимает статус наблюдателя BRICS."
 indian_event.77.d: "[FROM.GetName] принял наше приглашение на получение статуса наблюдателя в БРИКС. Это знаменует начало потенциально более глубоких взаимоотношений."
 indian_event.77.a: "Каждое путешествие начинается с одного шага."
 indian_event.78.t: "[FROM.GetName] отказывается от статуса наблюдателя БРИКС"
 indian_event.78.d: "[FROM.GetName] отклонил наше предложение о статусе наблюдателя в БРИКС. Приглашение остается в силе, если они пересмотрят свое решение."
 indian_event.78.a: "Возможно, со временем"
 indian_event.79.t: "Предлагается ассоциированное членство в странах БРИКС."
 indian_event.79.d: "[FROM.GetName] предложил повысить наш статус в рамках БРИКС с наблюдателя до ассоциированного члена. Статус ассоциированного члена дает нам право участвовать в экономических инициативах блока и более весомый голос в обсуждениях на саммитах, углубляя наше партнерство с развивающимися экономиками."
 indian_event.79.a: "Примите повышение"
 indian_event.79.b: "Упадок — мы довольны ролью наблюдателей."
 indian_event.82.t: "Предлагается полноправное членство в БРИКС."
 indian_event.82.d: "[FROM.GetName] предложил повысить наш статус в БРИКС с ассоциированного члена до полноправного. Полноправное членство предоставляет право голоса, доступ к Новому банку развития и участие в соглашениях альянса о безопасности, связывая наше будущее с блоком."
 indian_event.82.a: "Принять полное членство"
 indian_event.82.b: "Отказ — обязательство слишком велико."
 RAJ_brics_invite_full_member: "Пригласить [FROM.GetName] в качестве полноправного члена"
 RAJ_brics_invite_full_member_desc: "[FROM.GetName] может претендовать на полноправное членство в БРИКС. Полноправные члены получают право голоса, доступ к Новому банку развития и участие во всех инициативах БРИКС."
 RAJ_brics_invite_associate_member: "Пригласить [FROM.GetName] в качестве ассоциированного члена."
 RAJ_brics_invite_associate_member_desc: "[FROM.GetName] может претендовать на ассоциированное членство, что укрепит глобальное влияние БРИКС за счет расширения экономического сотрудничества."
 RAJ_brics_invite_observer: "Пригласить [FROM.GetName] в качестве наблюдателя"
 RAJ_brics_invite_observer_desc: "Участник [FROM.GetName] может претендовать на статус наблюдателя, что позволит ему участвовать в дискуссиях и рабочих группах БРИКС."
 RAJ_brics_promote_to_associate: "Повысить статус [FROM.GetName] до должности ассоциированного сотрудника."
 RAJ_brics_promote_to_associate_desc: "Повысить статус участника [FROM.GetName] с наблюдателя до ассоциированного члена, предоставив ему расширенные права на экономическое сотрудничество."
 RAJ_brics_promote_to_full: "Присвоить [FROM.GetName] статус полноправного члена"
 RAJ_brics_promote_to_full_desc: "Повысить статус [FROM.GetName] с ассоциированного члена до полноправного члена с правом голоса и полноправным участием в деятельности стран БРИКС."
 RAJ_brics_full_member_tt: "§Y[FROM.GetName]§! войдет в БРИКС в качестве §Gполноправного члена§! с правом голоса и полным доступом ко всем инициативам."
 RAJ_brics_associate_member_tt: "§Y[FROM.GetName]§! войдет в состав БРИКС в качестве ассоциированного члена §Yassociate member§! с правом на экономическое сотрудничество."
 RAJ_brics_observer_tt: "§Y[FROM.GetName]§! присоединится к БРИКС в качестве §Yobserver§! с ограниченными правами участия."
 RAJ_brics_rejected_tt: "Участник под ником §Y[FROM.GetName]§! отклонил приглашение, сославшись на невыполнение требований или отсутствие интереса."
 RAJ_brics_member_opinion: "Полноправный член БРИКС"
 RAJ_brics_associate_opinion: "Ассоциированный член БРИКС"
 RAJ_brics_observer_opinion: "BRICS Observer"
 BRICS_associate_member_requirements_tt: "Требования: §Y >40% влияния лидера БРИКС, §!, §Y >50% мнения лидера БРИКС, §!, §Y демократия/нейтралитет/коммунизм, §!"
 BRICS_observer_requirements_tt: "Требования: §Y >25% влияния лидера БРИКС, §!, §Y положительное мнение лидера БРИКС, §!"
 RAJ_rehabilitation_in_progress: "Реабилитационные программы в процессе реализации"
 RAJ_green_hunt_active: "Активная Зеленая Охота"
 RAJ_suppression_active: "В настоящее время ведётся подавление деятельности наксалитского региона."
 USA_wot_enduring_freedom: "Операция «Несокрушимая свобода» началась."
 indian_event.83.t: "Халифат требует подчинения"
 indian_event.83.d: "Дели призывает [ROOT.GetName] к единству в вере и подчинению правлению [FROM.GetName]. Отказ означает войну."
 indian_event.83.a: "Подчинитесь халифату."
 indian_event.83.b: "Откажитесь и готовьтесь к войне."
 RAJ_gas_pipeline_accept_tt: "§YПолучатель гранта строит электростанцию, работающую на возобновляемых источниках энергии, и улучшает отношения и торговлю с Индией.§!"
 RAJ_gas_pipeline_reject_tt: "§YМнение получателя об Индии ухудшается.§!"
 RAJ_bangladesh_ultimatum_accept_tt: "§YИндия аннексирует Бангладеш полностью, получая полный контроль над его территорией и основными территориями бывших штатов.§!"
 RAJ_bangladesh_ultimatum_reject_tt: "§YВместо этого Индия ставит перед собой цель завоевать Бангладеш силой.§!"
 RAJ_vietnam_alliance_accept_tt: "§YВьетнам и Индия образуют взаимный союз, присоединившись к одной и той же фракции.§!"
 RAJ_sco_join_notify_tt: "§YИндия присоединяется к ШОС в качестве партнера по диалогу.§!"
 RAJ_brics_founding_invite_tt: "§YКаждая страна, принявшая решение о вступлении, становится полноправным членом БРИКС, получая бонус за лояльность Индии как члена БРИКС и присоединяясь к индийской фракции, если Индия возглавляет одну из них.§!"
 RAJ_iran_brics_invite_tt: "§YИран вступил в БРИКС в качестве полноправного члена.§!"
 RAJ_us_pak_pressure_accept_tt: "§YСоединенные Штаты понизили статус Пакистана как крупного союзника, не входящего в НАТО, что ухудшило американо-пакистанские отношения.§!"
 RAJ_us_pak_pressure_reject_tt: "§YМнение Соединенных Штатов об Индии ухудшается, а влияние Индии на Вашингтон снижается.§!"
 RAJ_pakistan_ultimatum_accept_tt: "§YИндия аннексирует Пакистан полностью, получая полный контроль над его территорией и основными территориями бывших штатов.§!"
 RAJ_pakistan_ultimatum_reject_tt: "§YВместо этого Индия ставит перед собой цель завоевать Пакистан силой.§!"
 RAJ_cenasia_ultimatum_accept_tt: "§YИндия аннексирует принимающую страну полностью, получая полный контроль над её территорией.§!"
 RAJ_cenasia_ultimatum_reject_tt: "§YВместо этого Индия ставит перед собой цель завоевать принимающую сторону силой.§!"
 RAJ_turkmen_treaty_accept_tt: "§YТуркменистан подписал с Индией пакт о взаимном ненападении, что открывает путь к будущему разделу Афганистана.§!"
 RAJ_turkmen_treaty_reject_tt: "§YТуркменистан отказывается от договора, закрывая тем самым путь к будущему разделу Афганистана.§!"
 RAJ_afghan_partition_accept_tt: "§YТуркменистан присоединяется к Индии в заявлении о целях войны против талибов и Афганистана.§!"
 RAJ_islamic_ulema_invite_accept_tt: "§YСтрана присоединяется к индийской фракции исламских улемов.§!"
 RAJ_islamic_ulema_invite_reject_tt: "§YОтношения ухудшаются с обеих сторон, и страна страдает от последствий для своей политической жизни и стабильности.§!"
 RAJ_development_in_progress: "Комплексная инициатива в области развития уже реализуется."
 RAJ_pak_top_influencer_tt: "§Y[ROOT.GetNameWithFlag]§! является ведущим источником иностранного влияния в §Y[PAK.GetNameWithFlag]§!"
 RAJ_seek_permanent_unsc_seat: "Подать заявку на постоянное членство в Совете Безопасности ООН"
 RAJ_seek_permanent_unsc_seat_desc: "Население Индии, ее экономический вес и роль в международных миротворческих операциях подтверждают ее право на постоянное представительство в Совете Безопасности ООН. Мы начнем дипломатическую кампанию, необходимую для того, чтобы представить это право Совету и Генеральной Ассамблее."
 RAJ_enshrine_pluralism: "Укрепить плюрализм"
 RAJ_enshrine_pluralism_desc: "Вписать вопрос о религиозном урегулировании в конституционный порядок, а не оставлять его на волю правительства, находящегося у власти. Это требует... §YПлюралистическая гармония§! Закон и существующая религиозная гармония. Бонус фиксируется навсегда, и общественное мнение больше не является причиной беспорядков, сепаратистских кризисов или сецессии."
 RAJ_all_faiths_content: "Каждая вера имеет мнение выше §Y80§!"
 RAJ_pluralist_harmony: "Плюралистическая гармония"
 RAJ_pluralist_harmony_desc: "Плюрализм, принятый с позиции силы. Каждое сообщество уже поддерживает правительство, поэтому равное положение перед государством воспринимается как признание, а не как уступка, вырванная у недовольного большинства."
 RAJ_pluralist_settlement: "Плюралистическое поселение"
 RAJ_pluralist_settlement_desc: "Религиозное устройство закреплено в конституционном порядке и больше не зависит от действующего правительства. Общинный статус перестал быть определяющим фактором сплоченности союза."
 RAJ_hindus_opinion_tt: "§YHindu§! Мнение: $RIGHT|+=0$"
 RAJ_muslim_opinion_tt: "§YMuslim§! Мнение: $RIGHT|+=0$"
 RAJ_sikh_opinion_tt: "§YSikh§! Мнение: $RIGHT|+=0$"
 RAJ_christians_opinion_tt: "§YChristian§! Мнение: $RIGHT|+=0$"
 RAJ_buddhist_opinion_tt: "§YBuddhist§! Мнение: $RIGHT|+=0$"
 RAJ_PAK_border_conflict_category: "Индо-пакистанский пограничный конфликт"
 RAJ_PAK_border_conflict_category_desc: "[RAJ.GetNameDefCap] и [PAK.GetNameDefCap] по-прежнему расходятся во мнениях по поводу Джамму и Кашмира и сильно милитаризованной границы. Учения, вторжения и артиллерийские обстрелы могут привести к ограниченным столкновениям или дипломатическому кризису. Прогресс отслеживается отдельно для каждого оспариваемого штата.\n\n$border_readiness_RAJ$: [?RAJ.pak_raj_border_readiness|Y0]\n$border_readiness_PAK$: [?PAK.pak_raj_border_readiness|Y0]\n$pak_raj_border_tension$: [?global.pak_raj_border_tension|Y0]\n\n§YПриграничные штаты§! (для подачи иска требуется 80 очков прогресса):\n[420.Owner.GetFlag] [420.GetName]: [?THIS.pak_raj_border_progress_420|Y0]\n[427.Owner.GetFlag] [427.GetName]: [?THIS.pak_raj_border_progress_427|Y0]\n[429.Owner.GetFlag] [429.GetName]: [?THIS.pak_raj_border_progress_429|Y0]\n[563.Owner.GetFlag] [563.GetName]: [?THIS.pak_raj_border_progress_563|Y0]\n[573.Owner.GetFlag] [573.GetName]: [?THIS.pak_raj_border_progress_573|Y0]\n[426.Owner.GetFlag] [426.GetName]: [?THIS.pak_raj_border_progress_426|Y0]\n[987.Owner.GetFlag] [987.GetName]: [?THIS.pak_raj_border_progress_987|Y0]\n[984.Owner.GetFlag] [984.GetName]: [?THIS.pak_raj_border_progress_984|Y0]\n\nАрмия назначает один приграничный штат в качестве нашего активного сектора за раз, и все подготовительные работы проводятся из него. Новый сектор формируется из контролируемых нами приграничных штатов после завершения текущей подготовки."
 RAJ_CHI_border_conflict_category: "Китайско-индийский пограничный конфликт"
 RAJ_CHI_border_conflict_category_desc: "[RAJ.GetNameDefCap] и [CHI.GetNameDefCap] оспаривают несколько участков Линии фактического контроля, от Аксай-Чина и Ладакха до Сиккима и Аруначал-Прадеша. Для проведения операций требуются местные силы, и наращивание темпа происходит только в направлении штата, где произошли боевые действия.\n\n$border_readiness_RAJ$: [?RAJ.raj_chi_border_readiness|Y0]\n$border_readiness_CHI$: [?CHI.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$: [?global.raj_chi_border_tension|Y0]\n\n§YПриграничные штаты§! (для предъявления претензии требуется 80 пунктов прогресса):\n[475.Owner.GetFlag] [475.GetName]: [?THIS.raj_chi_border_progress_475|Y0]\n[982.Owner.GetFlag] [982.GetName]: [?THIS.raj_chi_border_progress_982|Y0]\n[591.Owner.GetFlag] [591.GetName]: [?THIS.raj_chi_border_progress_591|Y0]\n[993.Owner.GetFlag] [993.GetName]: [?THIS.raj_chi_border_progress_993|Y0]\n\nАрмия назначает один приграничный штат в качестве нашего За один раз формируется активный сектор, и вся подготовка начинается с него. Новый сектор формируется из контролируемых нами приграничных государств после завершения текущей подготовки."
 border_war_axis_requirements_tt: "Мы должны владеть и контролировать государство-источник, разместить там как минимум одну дивизию и противостоять сопернику в государстве-цели. Эти условия проверяются повторно после завершения подготовки."
 border_war_capture_requirements_tt: "Мы должны удерживать смежное исходное состояние, имеющее как минимум одно подразделение, в то время как соперник владеет и контролирует целевое состояние. Эти условия проверяются повторно после завершения операции."
 border_war_negotiate_opinion_tt: "Обе страны должны иметь как минимум §Y25 Мнение §! друг о друге."
