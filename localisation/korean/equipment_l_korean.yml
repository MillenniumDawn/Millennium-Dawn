 HACS_equipment: "HACS"
 HACS_equipment_desc: "High Agility Combat System (HACS) is a new generation of mech battle units. With superior agility and advanced weaponry, HACS units are designed to dominate the battlefield and adapt to various combat scenarios against CHIMERA forces."
 HACS_0: "HACS Mk. I"
 HACS_0_desc: "The HACS Mk. I is the first generation of High Agility Combat System units. Equipped with basic weaponry and armor, it serves as a reliable platform for ground engagements against CHIMERA forces."
 HACS_1: "HACS Mk. II"
 HACS_1_desc: "Another generation of HACS mechs is more agile than the previous version. Thanks to the brilliant blueprints provided by the civilians, HACS Mk. II is a far deadlier weapon than the previous generation."
 HACS_2: "HACS Mk. III"
 HACS_2_desc: "Recent study on Randallite allowed us to improve the HACS design even further. The Mk. III version features enhanced armor and weapon systems, making it our best weapon to fight against Chimera forces."
 CHIMERA_equipment: "CHIMERA"
 CHIMERA_equipment_desc: "CHIMERA units"
 CHIMERA_0: "Bellatris"
 CHIMERA_0_desc: "Bellatris is a CHIMERA unit designed for frontline combat. It features advanced offensive capabilities and high armor, making it effective in various combat situations."
 CHIMERA_1: "Brachionis"
 CHIMERA_1_desc: "Brachionis is a CHIMERA unit known for its strong defensive capabilities from the front, but in general it has weaker armor compared to other CHIMERA units. Its deadliest weapons are claws that can easily shatter units in close-range combat, but they're fragile from the distance."
