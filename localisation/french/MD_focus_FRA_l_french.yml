 FRA_corporate_systems_events.22.b: "Faire de l'État le sauveteur principal"
 FRA_corporate_systems_events.22.b_tt: "Pouvoir politique : §R-125§!\nSouveraineté stratégique : §G+0.5§!\nSanté de France Télécom/Orange : §G+1.0§!\nPression de la dette des entreprises : §G-1.8§!"
 FRA_corporate_systems_events.22.c: "Éviter la dilution et couper l'investissement"
 FRA_corporate_systems_events.22.c_tt: "Infrastructure numérique : §R-0.6§!\nPression de la dette des entreprises : §G-1.0§!\nStabilité : §R-1.0%§!\nGagne §YRestructuration Ambition FT 2005§! pendant §Y730 jours§!."
 FRA_corporate_systems_events.22.d: "France Télécom a lancé Ambition FT 2005 pour refinancer sa dette, rétablir la trésorerie et renforcer le bilan. Le sauvetage peut combiner recapitalisation et cessions, s'appuyer davantage sur l'État, ou protéger les actionnaires par des coupes plus profondes."
