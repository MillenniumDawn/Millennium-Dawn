 EGY_deradical_ulema: "Deradicalization of Ulema"
 EGY_deradical_ulema_desc: "Many Salafi sympathizers have infiltrated ulemas in Egypt. Deradicalization must be done to suppress the radical thought."

 EGY_african_union_aff: "African Union Cooperation"
