 MON.liberalism: "£MON_liberalism 民主党"
 MON.liberalism_icon: "£MON_liberalism"
 MON.liberalism_desc: "1990年民主革命后，蒙古成为多党制国家。民主革命先驱者在民主革命期间建立了蒙古民族进步党、蒙古社会民主党等政党。2000年12月6日，蒙古民族民主党、蒙古社会民主党等五个政党合并成立蒙古民主党。"
 AZE.Neutral_Autocracy: "£AZE_non_aligned_autocracy (YAP) - 新阿塞拜疆党"
 AZE.Neutral_Autocracy_icon: "£AZE_non_aligned_autocracy"
 AZE.Neutral_Autocracy_desc: "(威权保守主义) - 新阿塞拜疆党\n\n新阿塞拜疆党由前克格勃将军、苏联政治局委员、共和国第一书记盖达尔·阿利耶夫于1992年在纳希切万创立，旨在巩固其重返权力的地位。1993年的政变使他如愿以偿，此后该党一直执政至今。新阿塞拜疆党宣扬阿塞拜疆主义，主张在强有力的总统领导下实现民族团结，建立以里海石油和天然气为基础的国家主导型市场经济，在俄罗斯、土耳其、伊朗和西方之间寻求平衡，并主张收复纳戈尔诺-卡拉巴赫地区。该党掌控着议会、国家行政机构和经济命脉。\n\n伊利哈姆·阿利耶夫父子相传，使得该党既是国家党，也是家族党；数十万党员是其在公共部门谋求职业发展的必要条件。该党依靠石油收入、安全机构以及建立在稳定和卡拉巴赫事业基础上的真正全国性支持，从未有任何选举动摇​​过其统治地位。"
 IRQ.socialism: "£IRQ_national_congress_small (INC)伊拉克国民大会"
 IRQ.socialism_icon: "£IRQ_national_congressa_small"
 IRQ.socialism_desc: "（社会民主主义）- 伊拉克国民大会\n\n伊拉克国民大会是海湾战争后成立的一个伞式组织，旨在抵抗伊拉克复兴党的命令。该组织由美国资助，由什叶派、前军官、自由党、社会主义者和许多其他政治和种族群体组成。"
 IRQ.conservatism: "£IRQ_conservatism_small 伊斯兰达瓦党 - 伊拉克组织"
 IRQ.conservatism_icon: "£IRQ_conservatism_small"
 IRQ.conservatism_desc: "(保守主义) - 在萨达姆·侯赛因的独裁统治期间，达瓦党遭受了残酷的迫害和灭绝运动，迫使其大多数幸存领导人逃往邻国和欧洲，在那里他们继续领导留在国内的积极分子与政权作斗争。 有组织的起义。 但随着时间的推移，部分留在国内的党员与流亡领导人之间出现了分歧和对抗，导致该党分裂，伊拉克境内部分地下组织成立了哈希姆·阿尔 -莫萨维领导的伊斯兰达瓦党-伊拉克组织。该党领袖，在伊拉克什叶派中享有盛誉并受人尊敬。"
 IRQ.Conservative_2018: "£IRQ_Conversative_2017_small 文明联盟"
 IRQ.Conservative_2018_icon: "£IRQ_Conversative_2017_small"
 IRQ.Conservative_2018_desc: "保守主义 - 文明联盟是伊拉克最大的两个世俗联盟之一，其主要意识形态是世俗主义和非宗派主义，重点是重建伊拉克。"
 KUR.Neutral_Communism: "£KUR_Neutral_Communism_small 库尔德斯坦共产党"
 KUR.Neutral_Communism_desc: "库尔德斯坦共产党是库尔德人的一个政党，于1993年在伊拉克共产党库尔德地区分支独立成立时成立。"
 KUR.Autocracy: "£KUR_Autocracy_small 库尔德斯坦爱国联盟"
 KUR.Autocracy_icon: "£KUR_Autocracy_small"
 KUR.Autocracy_desc: "专制主义 - 库尔德斯坦爱国联盟是一个融合的库尔德政党，作为一个更左翼的替代政党而成立，仍然反对库尔德民主党强大的巴尔扎尼家族的统治。库尔德自治区内战结束后，它有效控制了伊拉克库尔德斯坦南部，并仍然控制着大批佩什梅加部队。在库尔德人彻底独立的问题上，它比库尔德民主党更加务实，并且随着库尔德民主党与伊朗关系的降温，它加强了与伊朗的关系。"
 TUR.Neutral_Muslim_Brotherhood_akp: "£TUR_Neutral_Muslim_Brotherhood (AKP)正义与发展党"
 TUR.Neutral_Muslim_Brotherhood_akp_icon: "£TUR_Neutral_Muslim_Brotherhood"
 TUR.Neutral_Muslim_Brotherhood_akp_desc: "（温和伊斯兰主义） - 正义与发展党阵线\n\n正义与发展党是一个以雷杰普·塔伊普·埃尔多安政治为中心的保守伊斯兰主义政党。虽然该党声称是世俗的，但其许多政策旨在恢复保守伊斯兰教的许多元素，例如取消头巾禁令和对酒精征税。在外交政策方面，该党经常与美国和西方结盟，但毫不费力地考虑土耳其自身的利益，而且外交政策往往没有既定的结盟。\n\n该党于军方的§Y地位§!§R-100§!"
 TUR.oligarchism_mafia: "£generic_oligarchism_small 土耳其黑帮"
 TUR.oligarchism_mafia_icon: "£generic_oligarchism_small"
 TUR.oligarchism_mafia_desc: "土耳其黑帮 - 土耳其黑帮长期以来一直参与土耳其政治和日常生活。众所周知，他们在土耳其领土内外从事犯罪活动。通常，他们的外部业务在西欧进行，但众所周知，他们也在其他地方开展业务。\n\n该党于军方的§Y地位§!：§R-25§!"
 ROJ.conservatism_icon: "£ROJ_conservatism_small"
 ROJ.neutral_Social_icon: "£ROJ_neutral_Social_small"
 IRQ.Neutral_conservatism: "£generic_Neutral_conservatism_small 保守派"
 IRQ.Neutral_conservatism_desc: ""
 PER.socialism_icon: "£PER_socialism"
 PER.hardline_totalitarian: "£generic_Vilayat_e_Faqih_small (IRP)  - 伊斯兰共和党"
 PER.hardline_totalitarian_desc: "（霍梅尼主义） - 伊斯兰共和党代表着最初的伊斯兰革命，它最初是阿亚图拉·鲁霍拉·霍梅尼及其支持者的政治工具。尽管该党最初因派系斗争于1987年解散，但其遗产在由原则派和改革派组成的全国联盟中得以延续 - 尽管这两个联盟本身也存在派系斗争，但其存在方式比组织严密的伊斯兰共和党更为非正式。"
 PER.nation_party: "£PER_Nat_Populism_small (NPI) - 伊朗国家党"
 PER.nation_party_desc: "（民族民主主义）- 伊朗国家党\n\n伊朗国家党于1951年10月，佩泽克沙普尔和福鲁哈尔发生争执后，从泛伊朗主义者中分裂出来。福鲁哈尔希望推动更加民主的议程，而佩泽克沙普尔则希望推动该党走向威权主义，这导致福鲁哈尔创建了国家党。"
 EST.liberalism_icon: "£EST_western_liberal"
 EST.socialism_icon: "£EST_western_social_democrat"
 EST.anarchist_communism2: "£EST_anarchist_communism_2 (EUVP)  - 爱沙尼亚联合左翼党"
 EST.anarchist_communism2_desc: "（民主社会主义） - 爱沙尼亚联合左翼党\n\n爱沙尼亚联合左翼党是爱沙尼亚的一个政党，代表爱沙尼亚俄罗斯少数民族。该党是爱沙尼亚共产党的直系后裔，爱沙尼亚共产党是前爱沙尼亚苏维埃社会主义共和国的执政党。"
 EST.Nat_Fascism2: "£EST_Nat_Fascism (EKRE) -  爱沙尼亚保守人民党"
 EST.Nat_Fascism2_desc: "（爱沙尼亚民族主义） - 爱沙尼亚保守人民党\n\n爱沙尼亚保守人民党是爱沙尼亚的一个民族主义和右翼民粹主义政党。该党强烈反对左右翼政治光谱，被描述为一个极端民族主义、仇俄政党，同时希望实施瑞士式民主。该党支持将所有俄语教育过渡到爱沙尼亚语教育，是一个热衷于反对欧盟的欧洲怀疑论政党。"
 EST.Nat_Populism2: "£EST_national_populism_2 (EV)  - 爱沙尼亚自由党"
 EST.Nat_Populism2_desc: "（保守民粹主义）- 爱沙尼亚自由党\n\n爱沙尼亚自由党融合了右翼自由主义和民粹主义思想，主张削减政党资金和对企业的支持，但强烈反对承认同性婚姻和欧盟移民政策。"
 RWA.Nat_Populism_icon: "£RWA_Nat_Populism"
 RWA.Nat_Autocracy: "£RWA_Nat_Autocracy 卢旺达国防军"
 RWA.Nat_Autocracy_desc: ""
 RWA.Nat_Autocracy_icon: "£RWA_Nat_Autocracy"
 RWA.Monarchist_icon: "£RWA_nationalist_monarchist"
 RAJ.Neutral_Libertarian: "£RAJ_non_aligned_libertarian (SWA) - 自由独立党"
 RAJ.Neutral_Libertarian_icon: "£RAJ_non_aligned_libertarian"
 RAJ.Neutral_Libertarian_desc: "（古典自由主义）- 自由独立党\n\nC·拉贾戈帕拉查里于1959年创立了自由党，反对尼赫鲁的计划经济、合作农业和土地上限政策。该党获得了王公、地主和商界的支持，于1967年成为人民院最大的反对党，并于1974年因领导层分裂而解散。自由市场倡导者不时重拾该党名，主张放松管制、降低税收，并呼吁将国家职能限制在国防、法律和基础设施领域。"
 RAJ.Neutral_green: "£RAJ_non_aligned_greens (IGP) - 印度绿党"
 RAJ.Neutral_green_icon: "£RAJ_non_aligned_greens"
 RAJ.Neutral_green_desc: "（环保主义）- 印度绿党\n\n印度绿党源于北阿坎德邦变革党，于2018年在选举委员会注册为全国性绿色组织。该党将喜马拉雅山脉和河流流域的生态保护与反腐败政治、权力下放至村委会以及反对大型水坝和采矿项目相结合。该党参选席位不多，主要以压力集团的形式与纳尔默达河拯救运动等环保组织合作开展活动。"
 RAJ.Monarchist_icon: "£RAJ_nationalist_monarchist"
 FIJ.conservatism_2001: "£FIJ_western_conservative_alt 联合斐济党"
 FIJ.conservatism_2001_desc: "斐济联合党是斐济的一个政党。它于2001年由莱塞尼亚·恩加拉塞总理创立，作为权力基础；它吸收了大部分基督教民主联盟和其他保守派团体，并且得到了大酋长委员会的支持，使其被广泛视为联盟党的继承者，而联盟党是从20世纪60年代到20世纪60年代主导斐济政坛的前执政党。它主要得到斐济土著人的支持。"
 FIJ.Neutral_conservatism: "£FIJ_non_aligned_conservative 人民联盟(PA)"
 FIJ.Neutral_conservatism_desc: "人民联盟一直被视为保守党中的保守党。这是因为它与社会民主自由党分裂，而社会民主自由党本身又与斐济第一党分裂。"
 FIJ.oligarchism: "£FIJ_oligarchism 斐济技术官僚党(TPF)"
 FIJ.oligarchism_desc: "斐济技术官僚党TPF是一个实验性政党，其诞生于斐济顶尖STEM领域人才的理性思考之中。尽管如此，该党仍希望全面改革斐济，使其成为其所宣扬的太平洋地区闪亮灯塔。通过实施一些简单的技术官僚理念，如永久性工作轮换制（亦称“四四工作周”），TPF成员希望真正将斐济这个全球眼中的“小土丘”打造成一座巍峨高山。"
 FIJ.neutral_Social: "£FIJ_non_aligned_socialist_democrat 全国联邦党(NFP)"
 FIJ.neutral_Social_desc: "国家联邦党是斐济政党，由A.D.帕特尔于1968年11月创立，由联邦党和国家民主党合并而成。尽管它声称代表所有斐济岛民，但实际上，它几乎完全由印度裔斐济人支持，他们的祖先在1879年至1916年间来到斐济，大多是契约劳工。然而，在2018年大选中，由于纳入了更多斐济本土候选人，该党的支持基础发生了相当大的变化。"
 FIJ.Monarchist: "£FIJ_nationalist_monarchist 苏瓦王室"
 FIJ.Monarchist_desc: "斐济君主制是斐济部落历史的深厚根源。图伊维蒂或斐济国王是一个半官方头衔，在过去就已确立。尽管它因殖民主义和国家现代政治混乱而陷入泥潭。斐济族占多数，并得到大酋长委员会的同意，因此建立了苏瓦王朝。这个西方式君主制带有斐济文化和政治影响，被视为具有强大议会民主代表制的君主立宪制。"
 NHN.Neutral_Autocracy: "£NHN_Neutral_Autocracy 掸邦进步党"
 SOV.Western_Autocracy: "£SOV_western_autocrat (OHR) 我们的家园 - 俄罗斯"
 SOV.Western_Autocracy_icon: "£SOV_western_autocrat"
 SOV.Western_Autocracy_desc: "（叶利钦改良主义）我们的家园 -俄罗斯\n\n我们的家园 - 俄罗斯是俄罗斯中间派政党，由俄罗斯总理维克多·切尔诺梅尔金于1995年创立，旨在竞选国家杜马席位，并形成亲政府多数派。该党支持前总统鲍里斯·叶利钦的中右翼思想和政策。"
 SOV.conservatism_1: "£SOV_western_conservative_1 (RPR-PARNAS) 人民自由党"
 SOV.conservatism_1_icon: "£SOV_western_conservative_1"
 SOV.conservatism_1_desc: "（自由民主主义）俄罗斯共和党 - 人民自由党。\n\n人民自由党或PARNAS是最古老的政党之一，于1990年作为苏共纲领之一成立，后来发展成为一个独立政党，参加了各级选举，取得了有限的成功。该党代表自由主义、市场经济和反独裁主义。"
 SOV.socialism_1: "£SOV_social_democrat_1 (JR) 公正俄罗斯 - §C亲西方派§!"
 SOV.socialism_1_icon: "£SOV_social_democrat_1"
 SOV.socialism_1_desc: "（社会民主主义）公正俄罗斯党\n\n公正俄罗斯党是各种左翼民族主义、社会主义和进步主义政党联合的结果。尽管该党将自己定位为社会主义者，但实际上它是一个由左翼民族主义者和左翼自由主义者组成的广泛左翼联盟。该党主张扩大社会计划并让国家更多地参与经济。"
 SOV.Autocracy: "£SOV_Autocracy (PPUM) 祖国"
 SOV.Autocracy_icon: "£SOV_Autocracy"
 SOV.Autocracy_desc: "（左翼民族主义）‘祖国’人民爱国联盟\n\n祖国或人民爱国联盟是一个沙文主义的俄罗斯民族主义政党，提倡爱国主义、民族主义和政府对俄罗斯经济的广泛干预。祖国主要由富有的俄罗斯寡头和民族主义者领导。"
 SOV.Neutral_Autocracy: "£SOV_non_aligned_autocracy (PRR) 俄罗斯复兴党"
 SOV.Neutral_Autocracy_icon: "£SOV_non_aligned_autocracy"
 SOV.Neutral_Autocracy_desc: "（左翼爱国主义）俄罗斯复兴党\n\n俄罗斯复兴党是不满的俄罗斯联邦共产党成员创立的左翼政党。该党支持市场监管、军费支出、民族主义和社会支出。"
 DPR.Nat_Populism: "£DPR_nat_pop  新俄罗斯党"
 DPR.Nat_Populism_icon: "£DPR_nat_pop"
 DPR.Autocracy: "£DPR_autocracy  顿涅茨克共和国"
 DPR.Autocracy_icon: "£DPR_autocracy"
 DPR.Autocracy_desc: "顿涅茨克与乌克兰分离的亲俄支持者党。"
 SOV.oligarchism_council: "£SOV_oligarchs (LR) 自由俄罗斯"
 SOV.oligarchism_council_icon: "£SOV_oligarchs"
 SOV.oligarchism_council_desc: "（自由寡头主义）自由俄罗斯党曾是由寡头鲍里斯·别列佐夫斯基资助的政党，后因资金短缺而停止活动。如今寡头们重掌大权，他们需要一个属于自己的执政党来控制立法。"
 VEN.Nat_Fascism: "£VEN_nationalist_fascism 新秩序"
 VEN.Nat_Fascism_desc: "新秩序是一个反共产主义、法西斯导向的学生运动，受到前总统马科斯·埃万杰利斯塔·佩雷斯·希门尼斯思想的影响。"
 POL.Neutral_conservatism: "£POL_walesa 波兰第三共和国基督教民主联盟"
 POL.Neutral_conservatism_icon: "£POL_walesa"
 POL.Neutral_conservatism_desc: "波兰第三共和国基督教民主联盟是一个波兰政党，由莱赫·瓦文萨于1997年创立。它是一个基督教民主党，主张自由市场经济、社会正义和强大的国防。该党近年来一直在衰落，但仍然是波兰政坛的一支重要力量。"
