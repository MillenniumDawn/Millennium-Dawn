 alg_deep_state.202.t: "The Republic in Peril"
 alg_deep_state.202.d: "The attempt to resist the military takeover has failed. Armed loyalists and military units are clashing in the streets. The country teeters on the edge of full civil war. The decisions made now will determine whether Algeria survives as a unified state."
