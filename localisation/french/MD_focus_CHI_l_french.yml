 CHI_water_shortage_2: "$CHI_water_shortage$"
 CHI_water_shortage_2_desc: "The North China Plain, the Yellow River basin, and the Beijing-Tianjin-Hebei corridor together hold roughly half the country's cultivated land but less than a fifth of its freshwater. Per-capita water availability in the north falls well below the international scarcity threshold of 1,000 cubic metres per year. Industrial discharge and agricultural run-off have contaminated significant shares of available surface and groundwater, compounding the physical scarcity. Agriculture accounts for over 60 percent of total water consumption, and the energy sector's cooling demands add further strain to an already depleted resource base.\n§W--------------§!\nCompleting projects from the §Y$CHI_water_shortage_category$§! decision category, unlocked by the §Y$CHI_water_security_initiative$§! focus, and the South-North Water Transfer routes in the §Y$CHI_megaprojects$§! category raises our water conservation progress. This national spirit will §GImprove§! at §Y9§! completed projects."
