l_polish:
 inuit_nunangat_focus: "Drzewo celów Inuitów"
 INU_Learning_from_Crested_Ice: "Nauka z lodu grzebieniastego"
 INU_Learning_from_Crested_Ice_desc: "W latach 50. i 60. XX wieku Stany Zjednoczone prowadziły nad obszarem wysokiej Arktyki loty bombowców B-52 Stratofortress uzbrojonych w broń jądrową – operację znaną jako „Chrome Dome”. W 1968 roku jeden z tych samolotów uległ katastrofie podczas próby lądowania w bazie lotniczej Thule, powodując skażenie środowiska, co zostało następnie zatuszowane przez władze. Musimy teraz spojrzeć wstecz i przeanalizować aspekty etyczne tej sytuacji, zanim ponownie zaczniemy igrać z nuklearnym ogniem."
 INU_Buy_Spare_Parts: "Zakup części zamiennych"
 INU_Buy_Spare_Parts_desc: "Aby dalej rozwijać nasz program modernizacji zasobów nuklearnych, musimy postarać się o części i maszyny niezbędne do odtworzenia lub przywrócenia do stanu używalności broni, którą zamierzamy wykorzystać."
 INU_Project_S: "Projekt Sanna"
 INU_Project_S_desc: "Sanna lub Sedna to imię inuickiej bogini morza i władczyni morskich stworzeń. Pragnąc uhonorować jej rolę jako istotnego źródła pożywienia, nadamy naszemu programowi budowy okrętów podwodnych przenoszących pociski balistyczne nazwę pochodzącą od jej imienia."
 INU_Project_Ice_Shield: "Projekt Lodowa Tarcza"
 INU_Project_Ice_Shield_desc: "Czas poddać nasze działania próbie. Pokażmy światu, do czego jesteśmy zdolni, gdy naród potrafi właściwie obchodzić się z bronią jądrową i wykorzystywać ją jako narzędzie dyplomacji, a nie jako środek do zastraszania innych. Wykorzystamy ją do ochrony interesów rdzennych ludów Arktyki."
 INU_Project_N: "Projekt Nuutuittuq"
 INU_Project_N_desc: "Nuutuittuq to nazwa gwiazdy polarnej – Polaris. W hołdzie dla niej tak właśnie nazwiemy nasz program pocisków balistycznych, gdyż pozwoli nam on coraz bardziej zbliżyć się do gwiazd."
 INU_Looking_to_the_Stars: "Spoglądając w gwiazdy"
 INU_Atmospheric_Monitoring: "Monitorowanie atmosfery"
 INU_Lidar_Climate_Research: "Badania klimatu z wykorzystaniem technologii LiDAR"
 INU_Recover_B52_Thermonuclear_Arm: "Odzyskać termojądrowe uzbrojenie bombowca B-52"
 INU_Qaanaaq_Space_base: "Baza Kosmiczna Qaanaaq"