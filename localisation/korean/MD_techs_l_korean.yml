 nsb_artillery_ammo_1: "1세대 포탄"
 nsb_artillery_ammo_1_desc: "곡사포, 야포, 자주포와 같은 대구경 무기에 사용하도록 설계된 특수 탄약입니다. 파괴적인 충격을 가하는 고폭탄, 요새화된 목표물을 관통하는 장갑 관통탄, 전술 지원을 위한 연막탄 또는 조명탄 등 전장의 특정 역할에 맞춰 다양한 유형으로 제공됩니다."
