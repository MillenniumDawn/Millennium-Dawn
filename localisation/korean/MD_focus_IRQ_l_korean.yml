 iraqi_economic_union_TT: "\n이란에게 §Y저항의 축 회원국 및 우호 관계에 있는 국가들§!로 구성된 §Y경제 연합§!을 §G설립§!할 수 있도록 허가를 요청합니다.\n\n상대가 동의할 경우:\n§Y우호국을 경제 연합에 초대§!하고 §Y원조§!할 수 있게 됩니다. 연합 회원국은 회원국 수에 따라 §G긍정적인 효과§!를 얻습니다.\n§Y국고§!: $§R-15.00§!십억\n\n상대가 거부할 경우:\n§Y아무 일도 일어나지 않습니다§!."
