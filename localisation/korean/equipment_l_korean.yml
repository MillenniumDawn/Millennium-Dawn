 BEN_infantry_weapons_2_desc: "헤클러앤코흐 G3(게베르 3)는 7.62x51mm NATO 구경의 선택 사격식 전투소총으로, 1950년대 서독의 무기 제조업체 헤클러앤코흐(H&K)가 스페인 국영 설계 개발 기관인 CETME와 협력하여 개발했습니다. G3는 1959년부터 FN FAL/G1을 대체하여 표준 소총으로 사용되었으며, 1963년에 개량형 G3A1 모델로 업그레이드될 때까지 운용되었습니다."
 BEN_infantry_weapons_3_desc: "M16A2 소총의 개발은 원래 미 해병대가 베트남 전쟁에서 XM16E1과 M16A1 소총을 사용해 얻은 전투 경험을 바탕으로 요청한 것이었습니다. 이 소총은 1982년 국방부에서 \"미군 5.56mm 소총 M16A2\"로 공식 채택되었습니다. 미 해병대는 1980년대 초중반에 이 소총을 미군 최초로 도입했으며, 미 육군은 1980년대 후반에 뒤이어 도입했습니다."
 BEN_infantry_weapons_4_desc: "The M16A4 is the fourth generation of the M16 series. It is equipped with a removable carrying handle and a full length quad Picatinny rail for mounting optics and other ancillary devices. The FN M16A4, using safe/semi/burst selective fire, became standard issue for the U.S. Marine Corps. Military issue rifles are also equipped with a Knight's Armament Company M5 RAS hand guard, allowing vertical grips, lasers, tactical lights, and other accessories to be attached, coining the designation M16A4 MWS (or Modular Weapon System) in U.S. Army field manuals."
 BEN_infantry_weapons_5_desc: "M4 카빈 소총은 M16 돌격소총의 단축형 및 경량형 변형 모델입니다. M4는 5.56x45mm NATO 탄을 사용하는 공랭식, 직접 가스 작동식, 탄창식 카빈 소총입니다. 14.5인치(370mm) 길이의 총열과 접이식 개머리판을 갖추고 있습니다."
