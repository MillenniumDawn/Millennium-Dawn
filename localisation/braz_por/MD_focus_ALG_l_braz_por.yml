 ALG_dgi_trait_manpads_systems: "Sistemas MANPADS"
 ALG_dgi_trait_manpads_systems_desc: "Sistemas portáteis de defesa antiaérea para a infantaria e unidades leves."
 ALG_dgi_trait_artillery_modernization: "Modernização da Artilharia"
 ALG_dgi_trait_artillery_modernization_desc: "Atualizar as peças de artilharia existentes com sistemas modernos de controle de tiro e de pontaria."
 ALG_dgi_trait_cnc_integration: "Integração de Sistemas C3I"
 ALG_dgi_trait_cnc_integration_desc: "Integrar sistemas de comando, controle, comunicações e inteligência em todas as plataformas."
 ALG_dgi_trait_mass_production: "Iniciativa de Produção em Massa"
 ALG_dgi_trait_mass_production_desc: "Ampliar as capacidades de produção para atender às exigências da expansão militar."
 ALG_bcl_trait_desert_adaptation: "Pacote de Adaptação ao Deserto"
 ALG_bcl_trait_desert_adaptation_desc: "Modificações especializadas para operações no deserto, incluindo refrigeração reforçada e filtragem de poeira."
 ALG_bcl_trait_soviet_refurbishment: "Reforma de Equipamento Soviético"
 ALG_bcl_trait_soviet_refurbishment_desc: "Experiência em revisar e modernizar veículos blindados da era soviética a um custo reduzido."
 ALG_bcl_trait_reactive_armor: "Integração de Blindagem Reativa"
 ALG_bcl_trait_reactive_armor_desc: "Adicionar blindagem reativa explosiva para melhorar a proteção contra cargas ocas."
 ALG_bcl_trait_apc_modernization: "Programa de Modernização de VBTP"
 ALG_bcl_trait_apc_modernization_desc: "Melhorias abrangentes para veículos blindados de transporte de pessoal e veículos de combate de infantaria."
 ALG_bcl_trait_production_efficiency: "Melhorias na Eficiência de Produção"
 ALG_bcl_trait_production_efficiency_desc: "Simplificar os processos de montagem para aumentar a produção."
 ALG_snvi_trait_saharan_proven: "Projetos Aprovados no Saara"
 ALG_snvi_trait_saharan_proven_desc: "Veículos amplamente testados em condições desérticas para máxima confiabilidade."
 ALG_snvi_trait_mercedes_partnership: "Parceria com a Mercedes-Benz"
 ALG_snvi_trait_mercedes_partnership_desc: "Produção licenciada de plataformas de veículos comerciais da Mercedes-Benz adaptadas para uso militar."
 ALG_snvi_trait_mass_production: "Expansão da Produção em Massa"
 ALG_snvi_trait_mass_production_desc: "Expandir as instalações de produção para atender à maior demanda militar."
 ALG_snvi_trait_cost_reduction: "Otimização de Custos"
 ALG_snvi_trait_cost_reduction_desc: "Reduzir o custo por unidade por meio de maior eficiência de fabricação."
 ALG_enmib_trait_maintenance_expertise: "Especialização em Manutenção e Revisão"
 ALG_enmib_trait_maintenance_expertise_desc: "O conhecimento especializado em manutenção de helicópteros prolonga a vida útil e a confiabilidade."
 ALG_enmib_trait_licensed_assembly: "Operações de Montagem Licenciada"
 ALG_enmib_trait_licensed_assembly_desc: "Montar projetos de helicópteros estrangeiros sob licença a custo reduzido."
 ALG_enmib_trait_production_expansion: "Expansão da Capacidade de Produção"
 ALG_enmib_trait_production_expansion_desc: "Expandir as instalações para aumentar a capacidade de produção de helicópteros."
 ALG_mek_trait_mediterranean_design: "Projeto Naval Mediterrâneo"
 ALG_mek_trait_mediterranean_design_desc: "Navios otimizados para operações no Mar Mediterrâneo, com velocidade e eficiência melhoradas."
 ALG_mek_trait_patrol_vessel_expertise: "Especialização em Embarcações de Patrulha"
 ALG_mek_trait_patrol_vessel_expertise_desc: "Especializado na construção de lanchas de patrulha rápidas com capacidades de detecção aprimoradas."
 ALG_mek_trait_shipyard_expansion: "Programa de Expansão do Estaleiro"
 ALG_mek_trait_shipyard_expansion_desc: "Expandir as instalações do estaleiro para aumentar a capacidade de construção."
 ALG_cnan_trait_frigate_construction: "Capacidade de Construção de Fragatas"
 ALG_cnan_trait_frigate_construction_desc: "Desenvolver a capacidade de construir fragatas e destróieres modernos."
 ALG_cnan_trait_anti_air_systems: "Sistemas Antiaéreos Navais"
 ALG_cnan_trait_anti_air_systems_desc: "Integrar sistemas antiaéreos modernos às embarcações de superfície."
 ALG_cnan_trait_submarine_assembly: "Montagem de Submarinos"
 ALG_cnan_trait_submarine_assembly_desc: "Montagem licenciada de submarinos diesel-elétricos com assistência técnica estrangeira."
 ALG_cnan_trait_foreign_assistance: "Assistência Técnica Estrangeira"
 ALG_cnan_trait_foreign_assistance_desc: "Parcerias com construtores navais estrangeiros aceleram o desenvolvimento tecnológico."
 ALG_cnan_trait_shipyard_modernization: "Modernização do Estaleiro"
 ALG_cnan_trait_shipyard_modernization_desc: "Modernizar as instalações do estaleiro com equipamentos de construção avançados."
 ALG_ersa_trait_mro_expertise: "Especialização em MRO"
 ALG_ersa_trait_mro_expertise_desc: "A experiência em manutenção, reparo e revisão garante a máxima confiabilidade das aeronaves."
 ALG_ersa_trait_licensed_assembly: "Montagem Licenciada de Aeronaves"
 ALG_ersa_trait_licensed_assembly_desc: "Montar projetos de aeronaves estrangeiras sob licença a custo reduzido."
 ALG_ersa_trait_transport_specialization: "Especialização em Aeronaves de Transporte"
 ALG_ersa_trait_transport_specialization_desc: "Foco em aeronaves de transporte militar com maior alcance e eficiência."
 ALG_ersa_trait_production_expansion: "Iniciativa de Expansão da Produção"
 ALG_ersa_trait_production_expansion_desc: "Expandir as instalações para aumentar a capacidade de produção de aeronaves."
 ALG_resistance_power_struggle: "A Luta pelo Poder"
 ALG_resistance_power_struggle_desc: "Uma guerra silenciosa se trava entre o povo argelino e *Le Pouvoir*. Ambos os lados buscam consolidar apoio até que o inevitável confronto decida o futuro da Argélia."
 ALG_resistance_support: "Apoiar a Resistência"
 ALG_resistance_support_desc: "Canalizar recursos para movimentos populares, protestos e redes clandestinas, fortalecendo o desafio do povo à elite governante."
 ALG_increase_resistance_tt: "§YO povo se fortalece enquanto a influência do exército diminui.§!"
 ALG_le_pouvoir_support: "Apoiar *Le Pouvoir*"
 ALG_le_pouvoir_support_desc: "Apoio direto à elite entrincheirada, reforçando seu controle do exército e enfraquecendo as queixas do povo."
 ALG_increase_pouvoir_tt: "§YO exército consolida o controle enquanto o povo perde impulso.§!"
 ALG_resistance_final_clash: "O Confronto Final"
 ALG_resistance_final_clash_desc: "O conflito entre a Resistência e *Le Pouvoir* atingiu seu auge. Os próximos meses determinarão quem realmente governa a Argélia."
 alg_resistance.1.t: "O Povo Triunfa!"
 alg_resistance.1.d: "As vozes do povo se ergueram contra as elites governantes. Manifestações massivas e a organização popular forçaram o governo a ceder. A Argélia entra em uma nova era de governança democrática."
 alg_resistance.1.a: "O povo falou."
 alg_resistance.2.t: "Le Pouvoir Esmaga a Resistência"
 alg_resistance.2.d: "A elite entrincheirada, apoiada pelo exército, reprimiu com sucesso a resistência. O status quo permanece, mas o descontentamento latente ameaça causar novas agitações no futuro."
 alg_resistance.2.a: "A ordem foi restaurada."
 alg_resistance.3.t: "Uma Nação no Caos"
 alg_resistance.3.d: "Nem a Resistência nem Le Pouvoir conseguiram impor seu domínio. O vácuo de poder mergulhou a Argélia no caos, com homens fortes militares e facções disputando o controle."
 alg_resistance.3.a: "O país oscila à beira do colapso."
 alg_resistance.4.t: "A Crise Argelina se Agrava"
 alg_resistance.4.d: "A frágil junta não consegue manter o Estado unido, e a Argélia mergulha ainda mais na turbulência. Os oficiais podem devolver o país a um governo civil enquanto ainda há um país para devolver, ou podem se entrincheirar e deixar os grupos armados virem."
 alg_resistance.4.a: "Entregar o poder a um governo civil."
 ALG_african_union_tt: "A Argélia fortalece seus laços dentro da §YUnião Africana§!, melhorando as relações com os estados membros africanos."
 KBY_alg_modifier_desc: "A Cabília é um estado criado há relativamente pouco tempo; sua política interna e externa está completamente subordinada a Argel, mas, ainda assim, ela tem grande autonomia na política interna e externa."
 KBY_new_state: "Terra para os Berberes"
 KBY_new_state_desc: "Por fim, os verdadeiros herdeiros destas terras, os berberes, tomarão o poder em suas próprias mãos"
 KBY_constitution: "A Constituição da Cabília"
 KBY_constitution_desc: "Devemos formalizar a legislação do nosso estado. Para isso, adotaremos nossa própria constituição."
 KBY_drs: "Cooperação com o DRS"
 KBY_fsb_desc: "Infelizmente, ainda não temos a oportunidade de criar nossos próprios serviços especiais, então contaremos com a cooperação com o DRS da Argélia"
 KBY_mvd: "Subordinar o Ministério do Interior Local"
 KBY_mvd_desc: "Subordinaremos os órgãos locais do Ministério do Interior, que estavam sob o poder francês"
 KBY_ter_defence: "Defesa Territorial"
 KBY_ter_defence_desc: "Criaremos uma Defesa Territorial a partir da milícia local"
 KBY_contract_army: "Sistema de Exército Contratado"
 KBY_contract_army_desc: "Nosso exército será formado de acordo com o sistema de contratação"
 KBY_defence_doctrine: "Doutrina Defensiva"
 KBY_defence_doctrine_desc: "Não atacamos ninguém, nossa tarefa é defender nossas fronteiras. Nosso exército adotará a doutrina de táticas defensivas"
 KBY_nat_guard: "A Guarda Nacional da Cabília"
 KBY_nat_guard_desc: "A Argélia já teve uma guarda nacional, nos anos 80. Recriaremos essa divisão, mas já sob o nosso comando"
 KBY_defence_prom: "Indústria Militar"
 KBY_defence_prom_desc: "Investiremos fundos significativos na restauração da indústria militar em nosso território. Precisamos de um exército forte"
 KBY_rebuild_war_academy: "Escolas Militares"
 KBY_rebuild_war_academy_desc: "Nossos combatentes devem ter o melhor treinamento para defender a pátria. Por isso, reviveremos as academias militares em nosso território"
 KBY_no_corrupt_military: "Reduzir Seriamente a Corrupção no Exército"
 KBY_no_corrupt_military_desc: "Nosso exército ainda é jovem, então é muito mais fácil eliminar a corrupção nele"
 KBY_nation_quest: "A Questão Nacional"
 KBY_nation_quest_desc: "A Cabília era e será parte da Argélia; esta é a nossa resposta à questão nacional"
 KBY_referendum: "Referendo sobre o Destino da Cabília"
 KBY_referendum_desc: "Chegou o momento decisivo em que devemos decidir o rumo do nosso país. Ele se tornará uma parte plena da Argélia, na forma de uma república, ou escolheremos o caminho de um Estado da União"
 KBY_dinar: "O Dinar como Moeda do Estado"
 KBY_dinar_desc: "O dinar se tornará nossa moeda estatal, ninguém jamais duvidou disso"
 KBY_corruption: "Combate à Corrupção"
 KBY_corruption_desc: "Apesar de nosso estado ainda ser jovem, já surgiram nele funcionários corruptos. Precisamos lidar com isso"
 KBY_isr_invest: "Investimentos de Israel"
 KBY_isr_invest_desc: "Israel nos apoia com seus investimentos"
 KBY_build_factories: "Construção de Fábricas"
 KBY_build_factories_desc: "O país precisa de fábricas e usinas; forneceremos ao nosso povo tudo de que precisa"
 KBY_social_invest: "Investimentos na Esfera Social"
 KBY_social_invest_desc: "Nossos cidadãos devem ter acesso a instalações médicas da melhor qualidade, além de todas as garantias sociais"
 KBY_infrastructure: "Investimentos em Infraestrutura"
 KBY_infrastructure_desc: "As estradas são as veias do nosso estado"
 KBY_fight_oligarch: "A Luta contra os Oligarcas"
 KBY_fight_oligarch_desc: "Even in our young state, corrupt oligarchs have already begun to appear, who made a lot of money in the war. Let's deal with them"
 KBY_it_invest: "Investir em TI"
 KBY_it_invest_desc: "Investiremos em tecnologias de TI para o desenvolvimento bem-sucedido do nosso país"
 KBY_maloross_economy: "Economia da Cabília"
 KBY_maloross_economy_desc: "Nossas medidas econômicas levaram ao crescimento da nossa economia"
 KBY_union_state: "Estado da União"
 KBY_union_state_desc: "Escolhemos o caminho do Estado da União"
 KBY_union_group_army: "Agrupamento Conjunto de Tropas"
 KBY_union_group_army_desc: "Nossos soldados se tornarão membros do agrupamento conjunto de tropas do Estado da União"
 KBY_union_group_economic: "Investimentos do Estado da União"
 KBY_union_group_economic_desc: "A participação no Estado da União teve um impacto positivo em nossa economia"
 KBY_union_health_social: "Cooperação nas Esferas Social e Médica"
 KBY_union_health_social_desc: "Os membros do Estado da União cooperam ativamente nas esferas Social e Médica"
 KBY_republic_rf: "Somos Parte da Argélia"
 KBY_republic_rf_desc: "Tornamo-nos uma república da Argélia, e agora o nosso destino está ligado a ela"
 KBY_alg_regions: "Cooperação com as Regiões da Argélia"
 KBY_alg_regions_desc: "Cooperaremos ativamente com as outras regiões da Argélia"
 KBY_fra_companies: "Cooperação com Empresas Francesas"
 KBY_fra_companies_desc: "As empresas francesas serão nossas principais parceiras"
 KBY_integrate_army: "Integrar ao Exército Argelino"
 KBY_integrate_army_desc: "Levaremos nosso exército aos padrões do Exército Argelino"
 ALG_legacy_of_independence_war: "Legado da Guerra de Independência da Argélia"
 ALG_legacy_of_independence_war_desc: "A luta contra o domínio colonial francês forjou um forte senso de identidade e unidade nacional. Esse legado duradouro fortalece nosso poder político, acelera a pesquisa e a modernização e aumenta a influência da Argélia no exterior. Contudo, divisões ideológicas e memórias históricas continuam moldando a opinião interna e as relações exteriores."
 ALG_new_nobility_idea: "Nobreza Renovada"
 ALG_new_nobility_idea_desc: "Ao restaurar os privilégios nobres e criar uma aristocracia leal, a monarquia reforça seu governo, recompensando a lealdade com influência e prestígio."
 ALG_state_islam_idea: "O Islã como Estado"
 ALG_state_islam_idea_desc: "A monarquia formaliza o Islã como princípio orientador do Estado, fortalecendo os ulemás e incorporando a Sharia à governança, ao custo do progresso científico."
 ALG_andalus_crusade_idea: "Legado de Al-Andalus"
 ALG_andalus_crusade_idea_desc: "O sonho de reconquistar Al-Andalus alimenta a causa do Califado, inspirando guerreiros e legitimando a expansão pela Península Ibérica."
 ALG_maghribi_identity_idea: "Identidade Magrebina"
 ALG_maghribi_identity_idea_desc: "A monarquia promove uma identidade magrebina distinta, enraizada na cultura e na unidade compartilhadas, reforçando a estabilidade e afastando a influência estrangeira."
 ALG_maghribi_identity_idea_two: "Verdadeiro Magrebismo"
 ALG_maghribi_identity_idea_two_desc: "Do Marrocos à Líbia, o Magrebe se une sob um destino singular. A monarquia encarna essa visão, reduzindo a interferência estrangeira e unindo a região."
 ALG_renewed_nobility_idea: "Cavalaria Restaurada"
 ALG_renewed_nobility_idea_desc: "Os cavaleiros do reino retornam, honrados como uma elite militar e política leal. Seu papel renovado fortalece o domínio da monarquia e reduz os custos de liderança."
 ALG_going_to_roots: "Retorno às Nossas Raízes"
 ALG_going_to_roots_desc: "Tanto as dinastias magrebinas quanto as andaluzas lançaram as bases da identidade argelina. Ao abraçar essas tradições, uniremos passado e presente em uma única visão orientadora para a nação."
 ALG_state_islam: "O Islã como Fé do Estado"
 ALG_state_islam_desc: "A religião sempre guiou o povo da Argélia. Ao proclamar o Islã como alicerce da monarquia, solidificamos nossa legitimidade, conquistamos o favor dos ulemás e fortalecemos a unidade dos fiéis."
 ALG_restore_knighthood: "Restaurar a Cavalaria"
 ALG_restore_knighthood_desc: "Na era dos impérios, ordens de guerreiros e nobres defendiam nossa terra e nossa fé. Restauraremos essas ordens cavaleirescas para servir ao trono e inspirar lealdade nas armas."
 ALG_andalus_legacy: "Legado de Al-Andalus"
 ALG_andalus_legacy_desc: "Nosso renascimento andaluz não é apenas sobre o trono. É sobre reacender o orgulho perdido dos muçulmanos expulsos da Ibéria séculos atrás. Espalharemos nossa influência e lembraremos à Europa que Al-Andalus não foi esquecida."
 ALG_our_old_realm: "Nosso Antigo Reino"
 ALG_our_old_realm_desc: "Já governamos partes da Ibéria sob a bandeira de Al-Andalus. Agora, por meio de aproximações diplomáticas e da memória histórica, reivindicaremos nossas antigas terras e prepararemos o terreno para seu retorno."
 ALG_renewed_nobility: "Nobreza Renovada"
 ALG_renewed_nobility_desc: "Novas casas nobres devem ser forjadas para servir à monarquia. Famílias antigas serão restauradas e novas elites elevadas, para dar à Argélia servidores leais da coroa."
 ALG_politic_outreach_iberia: "Aproximação Política na Ibéria"
 ALG_politic_outreach_iberia_desc: "Ao apoiar forças simpáticas na Espanha e em Portugal, podemos estender a influência da Argélia para o oeste. Nosso apoio aos movimentos ibéricos fortalecerá nossas reivindicações e enfraquecerá seus estados."
 ALG_fate_of_spain: "O Destino da Espanha"
 ALG_fate_of_spain_desc: "A Espanha repousa sobre a terra de nossos ancestrais. Seu destino pode agora ser decidido pela mão da Argélia, por meio de união, reivindicação ou conquista."
 ALG_true_maghribism: "Verdadeiro Magrebismo"
 ALG_true_maghribism_desc: "Chegou a hora de declarar nossa própria visão, uma ideologia enraizada na identidade magrebina, na unidade islâmica e no orgulho monarquista. A doutrina do Magrebismo inspirará uma nova ordem em todo o Norte da África."
 ALG_glory_of_andalus_idea: "Glória de Al-Andalus"
 ALG_glory_of_andalus_idea_desc: "Um renascimento cultural, inspirado no legado de Al-Andalus, revigora nossos estudiosos, artesãos e governantes. Ele une a nação sob uma memória compartilhada e orgulhosa."
 ALG_spain_algeria_union_tt: "Desbloqueia decisões para a união com a Espanha sob a monarquia argelina."
 ALG_trade_with_arabic_nations_tt: "A Argélia estabelece melhores acordos comerciais com todas as nações árabes."
 ALG_loas_influence_tt: "A Argélia aumenta sua influência entre os estados membros da Liga Árabe por meio de esforços diplomáticos e acordos de amizade."
 ALG_isr_threat: "A Argélia Condena a Agressão Israelense"
 ALG_palestinian_aid_package_tt: "A Argélia fornece ajuda à Palestina e aumenta a influência em todas as nações do Oriente Médio."
 ALG_african_union_reforms_tt: "A Argélia estabeleceu melhores acordos comerciais com todos os estados membros da OUA."
 ALG_mutual_defense_idea: "Defesa Mútua"
 ALG_mutual_defense_idea_desc: ""
 ALG_the_State: "O Estado da Argélia"
 ALG_unlocks_focus_for_us: "§CDesbloqueia uma decisão que nos permitirá remover os modificadores negativos que recebemos disto!§!"
 ALG_activate_from_event: "§HEstes focos são ativados por um evento ou decisão§!"
 ALG_our_society: "Sociedade Argelina"
 ALG_our_society_desc: "A sociedade argelina está em constante mudança e evolução. Embora o papel do governo seja normalmente limitado nesse aspecto devido a certas restrições, houve momentos em que precisamos intervir, e haverá momentos em que teremos de intervir para mudar nossas políticas."
 ALG_DRS: "O DRS"
 ALG_DRS_desc: "O DRS é a agência de inteligência de nossa nação, encarregada de proteger o governo e as políticas da nação contra ameaças internas e externas."
 ALG_domestic_focus: "Foco Interno"
 ALG_domestic_focus_desc: "O DRS deve se concentrar em proteger a nação de ameaças internas, como agentes mal-intencionados que desejam derrubar o governo espalhando ideais perigosos."
 ALG_foreign_focus: "Foco Externo"
 ALG_foreign_focus_desc: "O DRS deve se preocupar com as ameaças vindas de fora de nossas fronteiras, pois as pessoas jamais desejarão causar mal à sua própria nação."
 ALG_disaster_relief: "Plano de Desastres"
 ALG_disaster_relief_desc: "Atualmente não temos um plano de desastres, o que significa que não estamos preparados para proteger e socorrer nossos cidadãos."
 ALG_charity_based: "Estabelecer um Sistema Liderado por Instituições de Caridade"
 ALG_charity_based_desc: "As instituições de caridade amparam nosso povo quando ocorrer um desastre, então podemos cortar bastante os gastos."
 ALG_government_reliant: "Estabelecer um Sistema Liderado pelo Governo"
 ALG_government_reliant_desc: "É dever do governo socorrer seu povo quando ocorre um desastre, mesmo que isso signifique aumentar nossos gastos."
 ALG_migration_problems: "Problemas de Migração"
 ALG_migration_problems_desc: "Sempre tivemos problemas com o afluxo de migrantes que chegam à nação. Mas nunca soubemos o que fazer com eles depois que seus problemas acabam em seus países de origem."
 ALG_open_door_policy: "Política de Portas Abertas"
 ALG_open_door_policy_desc: "Ao adotar uma política de portas abertas, podemos facilmente utilizar os migrantes que chegam para melhorar e desenvolver nossa nação."
 ALG_closed_borders: "Fechar as Fronteiras"
 ALG_closed_borders_desc: "Podemos nos livrar completamente da chegada de migrantes à nação simplesmente fechando nossas fronteiras, encerrando assim nossos problemas."
 ALG_drug_problem: "O Problema das Drogas"
 ALG_drug_problem_desc: "Às vezes as drogas são necessárias para uso médico, mas isso não impede que certos indivíduos abusem do sistema e as usem para fins recreativos, com resultados perigosos."
 ALG_tighten_punishments: "Postura Mais Dura"
 ALG_tighten_punishments_desc: "Criminalizaremos qualquer pessoa que use drogas para qualquer fim que não seja médico, não importa a desculpa."
 ALG_relax_restrictions: "Suavizar Nossa Postura"
 ALG_relax_restrictions_desc: "Mesmo que nosso povo queira usar drogas para fins recreativos, por que deveríamos nos importar? Talvez devêssemos simplesmente deixá-los fazer o que quiserem, mesmo com alguns riscos."
 ALG_rising_nationalism: "Ascensão do Nacionalismo"
 ALG_rising_nationalism_desc: "Embora o nacionalismo seja algo bom, demais pode ser ruim. O nacionalismo dentro da nação tem causado problemas e brigas entre grupos minoritários."
 ALG_utilize_it: "Utilizar o Nacionalismo"
 ALG_utilize_it_desc: "Utilizaremos o nacionalismo a nosso favor; assim, o inimigo saberá que o povo argelino não ficará de braços cruzados em tempos de guerra."
 ALG_combat_it: "Combatê-lo"
 ALG_combat_it_desc: "Teremos de combater o nacionalismo, pois não podemos arriscar mais instabilidade dentro das fronteiras de nossa nação."
 ALG_charity_disasters: "Plano Conduzido pela Caridade"
 ALG_charity_disasters_desc: "Nosso plano de desastres depende da bondade e das doações dos cidadãos para ajudar as pessoas em tempos de necessidade"
 ALG_government_led_disasters: "Plano Conduzido pelo Governo"
 ALG_government_led_disasters_desc: "O governo prestará auxílio às pessoas atingidas por desastres naturais, no lugar das instituições de caridade, embora elas também sejam livres para ajudar se quiserem"
 ALG_drugs_illegalized: "Drogas Criminalizadas"
 ALG_drugs_illegalized_desc: "Quem usar drogas para qualquer fim, exceto uso médico, terá problemas com a lei"
 ALG_drugs_legalized: "Drogas Legalizadas"
 ALG_drugs_legalized_desc: "Não nos importamos realmente com o motivo pelo qual as pessoas usam drogas, afinal a vida é delas"
 ALG_drs_idea_1: "Polícia Militarizada"
 ALG_drs_idea_1_desc: "A polícia foi reorganizada em uma força paramilitar capaz de lidar com terrorismo, tumultos e agitação, dando-lhe um papel mais forte na segurança interna da Argélia."
 ALG_drs_idea_2: "Polícia Fortemente Militarizada"
 ALG_drs_idea_2_desc: "A polícia agora opera como um órgão paramilitar fortemente armado, com equipamento avançado e laços estreitos com o exército, borrando as linhas entre a segurança civil e o controle militar."
 ALG_drs_idea_3: "Polícia Militarizada Integrada"
 ALG_drs_idea_3_desc: "Nossas forças policiais estão totalmente integradas ao aparato de segurança, operando lado a lado com o exército no combate ao terrorismo, na defesa das fronteiras e na vigilância interna."
 ALG_riot_police_idea: "Polícia de Choque"
 ALG_riot_police_idea_desc: "Um ramo policial especializado, criado para lidar com protestos, manifestações e agitação social. Está equipado com material de controle de multidões e atua com forte ênfase na manutenção da estabilidade do regime."
 ALG_algerian_special_forces: "Formar as Forças Especiais Argelinas"
 ALG_algerian_special_forces_desc: "As ameaças à segurança da Argélia exigem unidades de elite capazes de intervenção rápida e contraterrorismo. Estabelecer forças especializadas fortalecerá nossa defesa tanto contra a agitação interna quanto contra perigos externos."
 ALG_BRI: "Expandir a BRI"
 ALG_BRI_desc: "A Brigade de Recherche et d'Intervention (BRI) é uma unidade policial especializada, treinada para resgate de reféns e operações de alto risco. Expandir seu efetivo e seus recursos melhorará nossa segurança urbana."
 ALG_al_saiqa: "Unidades Al-Sa'iqa"
 ALG_al_saiqa_desc: "Unidades paramilitares especiais de controle de tumultos e contrainsurgência reforçarão nossa capacidade de manter a lei e a ordem em períodos de agitação civil."
 ALG_al_hars_al_watani: "Guarda Nacional"
 ALG_al_hars_al_watani_desc: "Uma Guarda de Segurança Nacional fornecerá segurança local em áreas vulneráveis, liberará recursos do exército e manterá a ordem em situações de crise."
 ALG_haras_al_hudod: "Unidades da Guarda de Fronteira"
 ALG_haras_al_hudod_desc: "Forças especializadas que patrulham nossas fronteiras reduzirão o contrabando, impedirão infiltrações e fortalecerão as defesas fronteiriças da Argélia."
 ALG_central_armed_police: "Polícia Armada Central"
 ALG_central_armed_police_desc: "Consolidar a polícia armada em um comando centralizado melhorará os tempos de resposta e a eficiência, garantindo uma mão mais firme contra ameaças organizadas."
 ALG_border_security_force: "Força de Segurança de Fronteira"
 ALG_border_security_force_desc: "Ao criar uma força dedicada à vigilância e interdição de fronteiras, a Argélia reprimirá as redes de tráfico e as infiltrações armadas."
 ALG_firqat_tadakhol_al_sariye: "Unidade de Intervenção Rápida"
 ALG_firqat_tadakhol_al_sariye_desc: "Unidades de reação rápida de elite permitirão à Argélia atacar rapidamente células terroristas e crises emergentes antes que se agravem."
 ALG_expanding_BRI: "Ampliando as Capacidades da BRI"
 ALG_expanding_BRI_desc: "Com mais financiamento, treinamento e equipamento avançado, a BRI pode evoluir para uma formidável unidade de contraterrorismo e resgate de reféns, rivalizando com as melhores da região."
 ALG_increase_police_funding: "Aumentar o Financiamento da Polícia"
 ALG_increase_police_funding_desc: "Ampliar o investimento em nossa polícia e gendarmaria fortalecerá a estabilidade interna, reforçará a segurança pública e melhorará a resiliência da Argélia contra a agitação."
 ALG_drs_expand: "Expandir o DRS"
 ALG_drs_expand_desc: "O Département du Renseignement et de la Sécurité (DRS) pode ser ampliado ainda mais, concedendo maiores capacidades de coleta de inteligência e contraespionagem."
 ALG_new_gendarmerie_equipment: "Novo Equipamento para a Gendarmaria"
 ALG_new_gendarmerie_equipment_desc: "Nossa gendarmaria deve estar devidamente armada e equipada para enfrentar os desafios do terrorismo, do crime e da agitação interna."
 ALG_mia_reform: "Reformar o Ministério do Interior"
 ALG_mia_reform_desc: "Centralizar o comando sob o Ministério do Interior simplificará a gestão da segurança interna, garantindo respostas mais rápidas e coordenadas."
 ALG_internal_troops: "Tropas Internas"
 ALG_internal_troops_desc: "Tropas internas paramilitares sob comando do Estado reforçarão o combate à insurgência e às redes criminosas."
 ALG_increase_special_forces: "Aumentar as Forças Especiais"
 ALG_increase_special_forces_desc: "Nossas forças de elite precisam de recrutamento ampliado e programas de treinamento especializados para enfrentar as sofisticadas ameaças da guerra moderna."
 ALG_cybercrime_directorate: "Diretoria de Cibercrime"
 ALG_cybercrime_directorate_desc: "A criação de uma Diretoria contra o Cibercrime protegerá a Argélia da espionagem digital, de ciberataques e de campanhas hostis de desinformação."
 ALG_riot_police: "Unidades de Polícia de Choque"
 ALG_riot_police_desc: "Unidades organizadas de polícia de choque garantirão o controle de multidões e uma resposta disciplinada a protestos em massa, assegurando a estabilidade durante a agitação."
 ALG_military_police_training: "Treinamento da Polícia Militar"
 ALG_military_police_training_desc: "Programas de treinamento para a polícia militar aumentarão a disciplina, reduzirão a deserção e melhorarão a gestão da ocupação em regiões instáveis."
 ALG_peoples_security: "Segurança do Povo"
 ALG_peoples_security_desc: "Uma doutrina de 'Segurança do Povo' fortalecerá a cooperação entre civis e militares, elevará o moral e integrará as populações locais aos esforços de defesa nacional."
 ALG_procurement_of_espionage_equipment: "Aquisição de Equipamento de Espionagem"
 ALG_procurement_of_espionage_equipment_desc: "Investir em tecnologia avançada de vigilância e espionagem aumentará nossa capacidade de detectar e neutralizar ameaças internas e estrangeiras."
 ALG_occupation_management_strategies: "Estratégias de Gestão da Ocupação"
 ALG_occupation_management_strategies_desc: "Novas estratégias para administrar áreas ocupadas ou instáveis minimizarão a resistência, reduzirão as baixas e consolidarão a autoridade do Estado."
 ALG_french_weapons: "Importar Armas Francesas"
 ALG_french_weapons_desc: "Ao adquirir armas leves e equipamentos franceses, a Argélia pode modernizar rapidamente sua infantaria, ao mesmo tempo em que fortalece os laços com Paris."
 ALG_russian_guns: "Importar Armas Russas"
 ALG_russian_guns_desc: "Armas leves russas, entregues em grande quantidade, dão à Argélia armamento durável e confiável, reforçando nossa tradicional parceria de defesa com Moscou."
 ALG_algerian_space_programme: "Estabelecer a ASAL"
 ALG_algerian_space_programme_desc: "A Agência Espacial Argelina (ASAL) coordenará todas as atividades espaciais nacionais, do desenvolvimento de satélites à cooperação internacional em pesquisa espacial."
 ALG_alsat_initiative: "Iniciativa AlSat"
 ALG_alsat_initiative_desc: "O projeto AlSat dá à Argélia seus primeiros satélites, dedicados à observação da Terra e às comunicações, marcando nossa entrada na era espacial."
 ALG_alsat2_series: "Série AlSat-2"
 ALG_alsat2_series_desc: "O desenvolvimento dos satélites avançados AlSat-2 aprimorará nossas capacidades de vigilância, comunicações e sensoriamento remoto."
 ALG_finance_private_space_companies: "Financiar Empresas Espaciais Privadas"
 ALG_finance_private_space_companies_desc: "Incentivar o setor privado da Argélia a participar da indústria espacial fortalecerá nossa base nacional de alta tecnologia."
 ALG_regional_satnet: "SatNet Regional"
 ALG_regional_satnet_desc: "Ligaremos nossos satélites em uma rede regional, integrando usos civis e militares e conectando a Argélia a seus vizinhos."
 ALG_asal_lunar_project: "Projeto Lunar da ASAL"
 ALG_asal_lunar_project_desc: "A agência espacial da Argélia iniciará um projeto ambicioso para estudar a exploração lunar e avançar a tecnologia de foguetes."
 ALG_human_spaceflight: "Programa de Voo Espacial Tripulado"
 ALG_human_spaceflight_desc: "Nosso programa espacial dará um passo ousado: planejar o primeiro voo espacial tripulado da Argélia em parceria com aliados internacionais."
 ALG_orbital_defense_program: "Programa de Defesa Orbital"
 ALG_orbital_defense_program_desc: "Satélites também podem ser usados para defesa. Desenvolver capacidades de defesa orbital protegerá a Argélia de ameaças futuras."
 ALG_alsat_future: "Futuro do AlSat"
 ALG_alsat_future_desc: "O futuro do programa espacial da Argélia está em investimento contínuo, parcerias público-privadas e planejamento científico de longo prazo."
 ALG_cyber_sat_integration: "Integração Ciber-Satélite"
 ALG_cyber_sat_integration_desc: "Combinar capacidades de guerra cibernética com nossa rede de satélites dará à Argélia uma poderosa ferramenta assimétrica nos conflitos modernos."
 ALG_idea_the_new_space_race: "A Nova Corrida Espacial"
 ALG_idea_the_new_space_race_desc: "A Argélia entrou na corrida espacial global, competindo com as potências mundiais para provar sua força tecnológica e estratégica."
 ALG_idea_cyberwarfare_2: "Integração Ciber-Satélite"
 ALG_idea_cyberwarfare_2_desc: "O comando cibernético da Argélia agora está integrado aos nossos sistemas de satélites, proporcionando segurança de comunicações superior e capacidades ofensivas."
 ALG_algeria_police_modifier: "Segurança Interna da Argélia"
 ALG_algeria_police_modifier_desc: "O governo argelino tem ampla experiência em reprimir a dissidência e agentes inimigos, desde a época em que fazia parte da URSS."
 ALG_algeria_police_modifier_tt_intro: "Modificar §Y$ALG_algeria_police_modifier$§! em"
 ALG_algeria_support_category: "Tropas Auxiliares da Argélia"
 ALG_stabilize_mali: "Estabilizar o Mali"
 ALG_stabilize_mali_desc: "A instabilidade do Mali ameaça todo o Sahel. A Argélia, com sua experiência em contrainsurgência e diplomacia, deve intervir para estabilizar seu vizinho do sul, seja pela força, pela negociação ou pela influência."
 ALG_back_tuareg_rebellion: "Apoiar a Rebelião Tuaregue"
 ALG_back_tuareg_rebellion_desc: "Em vez de apoiar Bamaco, podemos fortalecer os rebeldes tuaregues que buscam autonomia no norte do Mali. Isso enfraquecerá a autoridade central do Mali e aumentará nossa influência na região."
 ALG_support_malian_army: "Apoiar o Exército Malinês"
 ALG_support_malian_army_desc: "A Argélia pode, em vez disso, apoiar diretamente o governo malinês, oferecendo apoio político e militar para fortalecer seu exército contra os insurgentes."
 ALG_promote_tuareg_dialogue: "Promover o Diálogo Tuaregue"
 ALG_promote_tuareg_dialogue_desc: "Em vez de escolher um lado, a Argélia poderia sediar conversas entre os rebeldes tuaregues e o Estado malinês, posicionando-se como mediadora e estabilizadora no Sahel."
 ALG_support_tuareg_politicians: "Apoiar Políticos Tuaregues"
 ALG_support_tuareg_politicians_desc: "Além do campo de batalha, a influência tuaregue também pode ser construída por canais políticos. Apoiar líderes tuaregues moderados dará à Argélia aliados de longo prazo dentro do Mali."
 ALG_aid_malian_army: "Auxiliar o Exército Malinês"
 ALG_aid_malian_army_desc: "A Argélia pode enviar armas, veículos e sistemas de comando para reforçar a capacidade do exército malinês de combater insurgentes e estabilizar o país."
 ALG_mali_stabilized: "Mali Estabilizado"
 ALG_mali_stabilized_desc: "Após anos de turbulência, os esforços da Argélia valeram a pena. O conflito malinês está sob controle, a rebelião tuaregue contida, e a Argélia se destaca como a potência estabilizadora do Sahel."
 ALG_tuareg_autonomy_victory: "Vitória da Autonomia Tuaregue"
 ALG_tuareg_autonomy_victory_desc: "O movimento tuaregue conquistou o reconhecimento de sua autonomia. Com o apoio da Argélia, os tuaregues agora detêm poder político, e o Mali enfrenta um novo equilíbrio de autoridade no Sahel."
 Algeria.237.t: "Intervenção Argelina no Mali"
 Algeria.237.d: "A Argélia declarou sua intenção de estabilizar o Mali, citando preocupações com o terrorismo, o separatismo tuaregue e a instabilidade regional. Com Argel movendo tropas, ajuda e pressão política para o sul, o equilíbrio de poder no Mali está mudando. Resta saber se isso trará paz ou um conflito mais profundo."
 Algeria.237.a: "A Argélia assume a liderança no Sahel."
 Algeria.409.t: "Iniciativa de Diálogo Tuaregue"
 Algeria.409.d: "A Argélia começou a promover o diálogo com representantes tuaregues no Mali e no restante do Sahel. Enquanto alguns em Argel veem isso como um caminho para a paz e a estabilidade, outros temem que legitimar as demandas tuaregues possa encorajar o separatismo. O governo deve decidir até onde ir no apoio a essa iniciativa."
 Algeria.409.a: "Engajar por meio de ações culturais e de mídia"
 Algeria.409.b: "Oferecer apoio discreto à liderança tuaregue"
 ALG_TUA_REV_TT: "[TUA.GetFlag] A §HResistência Tuaregue§! recebeu apoio da Argélia, levando à criação de uma §YRegião Autônoma Tuaregue§! (ou possivelmente de um §Gnovo estado tuaregue§!) dentro do Mali."
 ALG_MAL_STABILIZED_TT: "[MAL.GetFlag] O §HMali§! foi §Gestabilizado§! com apoio argelino, garantindo a paz e reduzindo o risco de novos conflitos."
 ALG_algerian_intervention: "Doutrina de Intervenção Regional"
 ALG_algerian_intervention_desc: "A Argélia há muito atua como intermediária de poder regional. Com a instabilidade ameaçando nossa vizinhança, devemos decidir se intervimos diretamente em conflitos regionais para salvaguardar nossos interesses nacionais."
 ALG_intervene_in_sahrawi: "Intervir no Saara"
 ALG_intervene_in_sahrawi_desc: "O conflito entre o Marrocos e a República Árabe Saaraui Democrática continua sem solução. A Argélia deve intervir diplomática ou militarmente para proteger suas fronteiras e fortalecer sua influência no Magrebe."
 ALG_supp_polisario: "Apoiar a Frente Polisário"
 ALG_supp_polisario_desc: "A luta saaraui pela independência é central para a política regional da Argélia. Ao fornecer armas e apoio à Frente Polisário, podemos enfraquecer o Marrocos e garantir que nossa influência cresça no Saara Ocidental."
 ALG_a_new_stance: "Uma Nova Postura em Relação ao Marrocos"
 ALG_a_new_stance_desc: "A Argélia tradicionalmente se opôs ao controle marroquino sobre o Saara Ocidental, mas a mudança dos ventos políticos exige pragmatismo. Alinhar-se ao Marrocos poderia reduzir as tensões, abrir novas oportunidades econômicas e nos dar influência no Magrebe."
 ALG_intervene_in_libya: "Intervir na Líbia"
 ALG_intervene_in_libya_desc: "O caos na Líbia ameaça transbordar para além de nossas fronteiras. A Argélia não pode se dar ao luxo de ter instabilidade ao lado. Seja por ação militar, diplomacia ou influência encoberta, devemos garantir nossos interesses na Líbia."
 ALG_assassinate_gaddafi: "Assassinar Kadafi"
 ALG_assassinate_gaddafi_desc: "O governo de Muammar Kadafi desestabiliza toda a região. Ao orquestrar sua queda, a Argélia pode acelerar a mudança de regime na Líbia e garantir que surja um governo mais favorável, mesmo que isso mergulhe a Líbia em uma guerra civil."
 ALG_peacekeepers: "Enviar Forças de Paz à Líbia"
 ALG_peacekeepers_desc: "Em vez de mergulhar a Líbia ainda mais no caos, a Argélia poderia intervir como força de paz. Enviar tropas para estabilizar a situação fortaleceria nossa imagem de potência regional responsável e nos daria influência duradoura em Trípoli."
 ALG_pulse.1.t: "O Deserto do Saara se Expande"
 ALG_pulse.1.d: "Segundo os dados mais recentes, o Saara continua sua expansão constante. As áreas de pastagem estão se tornando estéreis, os oásis estão secando e animais selvagens como gazelas e cervos-da-berbéria estão desaparecendo devido à caça ilegal. O excesso de pastoreio, a mineração descontrolada e a omissão diante da caça ilegal só piorarão a desertificação."
 ALG_pulse.1.a: "Um sinal preocupante"
 ALG_pulse.2.t: "Deserto do Saara Estável"
 ALG_pulse.2.d: "Os dados deste ano sugerem que o avanço do Saara desacelerou, com a desertificação estável. Contudo, sem ações contra o excesso de pastoreio, a caça ilegal e o uso insustentável da terra, o equilíbrio pode em breve voltar a pender."
 ALG_pulse.2.a: "Devemos permanecer vigilantes"
 ALG_pulse.3.t: "O Saara Devolve Terras"
 ALG_pulse.3.d: "Relatórios recentes indicam que a vegetação está voltando lentamente a algumas margens do deserto. Patrulhas anticaça ilegal, pastoreio controlado e esforços de reflorestamento parecem estar ajudando a terra a se recuperar, restaurando o equilíbrio de ecossistemas frágeis."
 ALG_pulse.3.a: "Progresso encorajador"
 ALG_reduce_yearly_good_desertification_5: "Probabilidade de §YFormação de Oásis§!: §R-5%§!\n"
 ALG_increase_yearly_good_desertification_5: "Probabilidade de §YFormação de Oásis§!: §G+5%§!\n"
 ALG_increase_yearly_bad_desertification_5: "Probabilidade de §YDesertificação§!: §R+5%§!\n"
 ALG_decrease_yearly_bad_desertification_5: "Probabilidade de §YDesertificação§!: §G-5%§!\n"
 ALG_reduce_yearly_neutral_desertification_5: "Probabilidade de §YEstabilização§!: §R-5%§!\n"
 ALG_increase_yearly_neutral_desertification_5: "Probabilidade de §YEstabilização§!: §G+5%§!\n"
 ALG_anti_poaching_raid_successful: "§GEliminamos com sucesso §Y[?poachers_killed]§! caçadores ilegais!§!"
 ALG_anti_poaching_raid_normal: "§GConseguimos eliminar §Y[?poachers_killed]§! caçadores ilegais!§!"
 ALG_anti_poaching_raid_failure: "§RNossos guardas florestais sofrem baixas§!"
 ALG_strengthen_ENTV_environmental_campaigns: "Fortalecer as Campanhas Ambientais da ENTV"
 ALG_strengthen_ENTV_environmental_campaigns_desc: "A ENTV, nosso serviço nacional de radiodifusão, pode ser usada para conscientizar sobre questões ambientais. Ao promover campanhas sobre desertificação, conservação da água e proteção da vida selvagem, podemos incentivar os cidadãos a apoiar um futuro sustentável."
 ALG_increase_cattle_grazing: "Expandir o Pastoreio de Gado"
 ALG_increase_cattle_grazing_desc: "A pecuária continua sendo um pilar da economia das estepes e dos altos planaltos da Argélia. Expandir o pastoreio de bovinos e ovinos poderia aumentar a renda rural, mas corre o risco de agravar o excesso de pastoreio, a degradação do solo e a desertificação se não for gerido com cuidado."
 ALG_optimize_pastoral_practices: "Otimizar as Práticas Pastoris"
 ALG_optimize_pastoral_practices_desc: "Os métodos tradicionais de pastoreio impuseram enorme pressão a ecossistemas frágeis. Ao introduzir pastoreio rotativo, uso sustentável da água e melhores cuidados veterinários, podemos modernizar as práticas pastoris e reduzir seu impacto nas estepes e nas margens do Saara."
 ALG_expand_steppe_farming: "Expandir a Agricultura das Estepes"
 ALG_expand_steppe_farming_desc: "As regiões de estepe da Argélia, situadas entre o Atlas Telliano e o Saara, são vitais para a produção de grãos e gado. Investindo em projetos de irrigação e recuperação, podemos aumentar o cultivo nessas áreas, embora com o risco de maior estresse ambiental."
 ALG_research_drought_resistant_crops: "Pesquisar Culturas Resistentes à Seca"
 ALG_research_drought_resistant_crops_desc: "As mudanças climáticas e a desertificação ameaçam a segurança alimentar da Argélia. Investindo em pesquisa de culturas resistentes à seca, como grãos resilientes e variedades de tamareira, podemos proteger nosso setor agrícola contra condições áridas cada vez piores."
 ALG_shrink_nature_reserves_sahara: "Reduzir as Reservas Naturais do Saara"
 ALG_shrink_nature_reserves_sahara_desc: "Alguns argumentam que grandes porções de terra reservadas como reservas naturais no Saara poderiam ser reaproveitadas para agricultura, pastoreio ou projetos industriais. Reduzir o tamanho dessas reservas permitiria o desenvolvimento, mas a um grande custo ambiental."
 ALG_expand_nature_reserves_sahara: "Expandir as Reservas Naturais do Saara"
 ALG_expand_nature_reserves_sahara_desc: "Proteger os ecossistemas frágeis do Saara é essencial para a biodiversidade e o equilíbrio ambiental de longo prazo. Ao expandir as áreas protegidas, podemos salvaguardar espécies ameaçadas e reduzir as pressões que contribuem para a desertificação."
 ALG_drs: "O DRS"
 ALG_drs_desc: "O Département du Renseignement et de la Sécurité (DRS) da Argélia foi forjado durante a sangrenta Década Negra e tornou-se infame por seus vastos poderes. Embora sirva oficialmente como escudo contra o terrorismo e a infiltração estrangeira, o DRS também intervém pesadamente na política, garantindo a preservação da autoridade e da estabilidade do Estado, mesmo ao custo das liberdades civis."
 ALG_decline_of_tourism: "Declínio do Turismo"
 ALG_destroyed_agriculture: "Agricultura Destruída"
 ALG_tikjda_resort: "Estação de Esqui de Tikjda"
 ALG_algerian_tourism: "Turismo na Argélia"
 ALG_natural_products_idea: "Produtos Naturais Argelinos"
 ALG_sonatrach: "Expansão da Sonatrach"
 algeria_invest.1.t: "Investimentos na Argélia"
 algeria_invest.1.d: "A Argélia nos pede que invistamos em seu estado. Graças aos investimentos na Argélia, podemos fortalecer nossa influência no Norte da África e ao longo da costa do Mediterrâneo."
 algeria_invest.1.a: "Certo"
 algeria_invest.1.b: "Não"
 algeria_invest.2.t: "Eles concordaram"
 algeria_invest.2.d: "Eles concordaram em investir em nosso país."
 algeria_invest.2.a: "Ótimo."
 algeria_invest.3.t: "Eles recusaram"
 algeria_invest.3.d: "Eles se recusaram a investir em nosso país, alegando que nossa oferta não era lucrativa."
 algeria_invest.3.a: "Que pena"
 algeria_invest.4.t: "Investimentos americanos na Argélia"
 algeria_invest.4.d: "A Argélia oferece às nossas empresas a chance de investir em sua economia. Em troca, ganharemos influência e, a longo prazo, fortaleceremos as relações com a Argélia."
 algeria_invest.4.a: "Quem falou em dinheiro?"
 algeria_invest.4.b: "Não"
 algeria_invest.5.t: "A América concordou."
 algeria_invest.5.d: "Empresas americanas já começaram a planejar projetos de investimento na Argélia."
 algeria_invest.5.a: "Uma vitória para os negócios e para a democracia."
 algeria_invest.6.t: "A América recusou"
 algeria_invest.6.d: "A América se recusou a investir em nossa economia. Eles não têm confiança na transparência do nosso sistema político."
 algeria_invest.6.a: "Bem, então ligaremos para a Europa."
 algeria_invest.7.t: "Investimentos europeus na Argélia"
 algeria_invest.7.d: "A Argélia nos pede que invistamos em sua economia. Segundo eles, há um clima de investimento favorável, e nosso envolvimento fortalecerá os laços através do Mediterrâneo."
 algeria_invest.7.a: "Claro"
 algeria_invest.7.b: "Não há dinheiro."
 algeria_invest.8.t: "A Europa concordou"
 algeria_invest.8.d: "Investidores europeus concordaram em apoiar nossa economia. Várias grandes empresas já estão dispostas a lançar projetos de investimento na Argélia."
 algeria_invest.8.a: "Boas notícias para o desenvolvimento."
 algeria_invest.9.t: "A Europa recusou"
 algeria_invest.9.d: "Eles alegaram que não há dinheiro disponível no momento para destinar a um pacote de investimento."
 algeria_invest.9.a: "Que pena"
 algeria_invest.10.t: "Investidor chinês financia o Metrô de Argel"
 algeria_invest.10.d: "Um investidor chinês nos oferece dinheiro para expandir o Metrô de Argel. Podemos construir o metrô com os fundos deles ou desviá-los enganando-os, mas isso poderia prejudicar nossas relações com a China."
 algeria_invest.10.a: "Argel precisa de um metrô!"
 algeria_invest.10.b: "A Argélia precisa de dinheiro!"
 algeria_invest.11.t: "A Argélia nos enganou"
 algeria_invest.11.d: "Um grupo de vigaristas argelinos fraudou o projeto do metrô e ficou com todo o dinheiro que havíamos preparado para eles."
 algeria_invest.11.a: "Desgraçados"
 algeria_invest.12.t: "Os Investimentos de Rebrab"
 algeria_invest.12.d: "Issad Rebrab, fundador da Cevital, é um dos empresários mais influentes da Argélia. Desde a década de 1990, ele tem investido em indústria, produção de alimentos e expansão internacional. Graças a ele, a Argélia ganhou fábricas, empregos e projetos de prestígio. Ele continua sendo um símbolo do potencial do setor privado do país."
 algeria_invest.12.a: "Obrigado, Rebrab!"
 ALG_our_economy: "Nossa Economia"
 ALG_our_economy_desc: "A economia da Argélia está numa encruzilhada. Após anos de instabilidade e falta de investimento, o governo deve decidir se se concentra no mercado interno ou abre as portas à modernização e ao crescimento."
 ALG_attract_foreign_inv: "Atrair Investimento Estrangeiro"
 ALG_attract_foreign_inv_desc: "Ao abrir nossos mercados a investidores estrangeiros, a Argélia pode obter capital, conhecimento técnico e projetos de infraestrutura que, de outra forma, permaneceriam fora de alcance."
 ALG_france_inv: "Buscar Investimento Francês"
 ALG_france_inv_desc: "A França continua sendo um dos parceiros econômicos mais próximos da Argélia. Renovar seu envolvimento em nossos setores de energia e indústria poderia acelerar o desenvolvimento, se pudermos suportar sua influência."
 ALG_chinese_inv: "Iniciativa de Investimento Chinês"
 ALG_chinese_inv_desc: "A China oferece pacotes de investimento ambiciosos, muitas vezes ligados ao desenvolvimento de infraestrutura e recursos. Fazer parceria com Pequim poderia transformar nossa economia, mas ao custo de uma dependência maior."
 ALG_usa_inv: "Convidar Investimento Americano"
 ALG_usa_inv_desc: "Os Estados Unidos podem fornecer tecnologia avançada e considerável apoio financeiro. A cooperação com Washington pode transformar a indústria e os serviços da Argélia em competidores globais."
 ALG_russian_inv: "Cooperação Econômica Russa"
 ALG_russian_inv_desc: "A Rússia é há muito tempo uma aliada estratégica em energia e defesa. Ampliar a cooperação a projetos econômicos mais amplos fortalecerá nossa espinha dorsal industrial e militar."
 ALG_iran_inv: "Parceria com o Irã"
 ALG_iran_inv_desc: "A Argélia e o Irã compartilham uma história de não alinhamento e de resistência à dominação estrangeira. Ampliar os laços com Teerã poderia abrir novas frentes na cooperação energética, em projetos industriais e na diplomacia regional, embora possa gerar preocupação entre os parceiros ocidentais."
 ALG_italia_inv: "Fortalecer os Laços com a Itália"
 ALG_italia_inv_desc: "A Itália é um dos parceiros europeus mais próximos da Argélia, especialmente pelo papel da ENI em nosso setor de energia. Aprofundando a cooperação com Roma, podemos garantir investimentos vitais em infraestrutura, impulsionar o comércio mediterrâneo e reforçar nossa posição como fornecedora-chave de energia para a Europa."
 ALG_algiers_metro_expansion: "Expandir o Metrô de Argel"
 ALG_algiers_metro_expansion_desc: "Argel sofre com congestionamento e infraestrutura obsoleta. Expandir o sistema de metrô não apenas modernizará o transporte, mas também sinalizará progresso tanto a investidores quanto a cidadãos."
 ALG_cevital_group_expansion: "Expansão do Grupo Cevital"
 ALG_cevital_group_expansion_desc: "A Cevital, principal conglomerado da Argélia, tem potencial para se tornar uma potência continental. Apoiar seu crescimento criará empregos e acelerará a modernização industrial."
 ALG_scientific_research_push: "Promover a Pesquisa Científica"
 ALG_scientific_research_push_desc: "A inovação é a chave do crescimento de longo prazo. Investindo em pesquisa científica, a Argélia pode preparar a base para uma economia baseada no conhecimento."
 ALG_expand_higher_education: "Expandir o Ensino Superior"
 ALG_expand_higher_education_desc: "Universidades e escolas técnicas devem ser ampliadas e modernizadas para atender às exigências do século XXI. Uma população mais bem educada fortalecerá tanto a sociedade quanto a economia."
 ALG_digitalize_education: "Digitalizar a Educação"
 ALG_digitalize_education_desc: "Plataformas digitais, ensino on-line e integração de TI revolucionarão o setor educacional da Argélia, criando uma força de trabalho mais qualificada e adaptável."
 ALG_national_research_program: "Lançar o Programa Nacional de Pesquisa"
 ALG_national_research_program_desc: "Reunindo universidades, indústria e governo, um programa nacional de pesquisa coordenado permitirá à Argélia acompanhar os avanços tecnológicos globais."
 ALG_industry: "Expandir a Indústria Argelina"
 ALG_industry_desc: "A indústria da Argélia deve ser diversificada e modernizada. Promovendo o crescimento industrial, podemos reduzir a dependência dos hidrocarbonetos e criar uma economia mais equilibrada."
 ALG_constantine_hub: "Desenvolver o Polo Industrial de Constantina"
 ALG_constantine_hub_desc: "A cidade de Constantina é um importante centro regional. Investir aqui criará um novo polo industrial que espalhará o crescimento para fora de Argel."
 ALG_tlemcen_agro_industry: "Impulsionar a Agroindústria de Tlemcen"
 ALG_tlemcen_agro_industry_desc: "A agricultura e o processamento de alimentos em Tlemcen podem ser desenvolvidos em um poderoso setor agroindustrial, alimentando a nação e criando empregos."
 ALG_snvi_modernization: "Modernizar a SNVI"
 ALG_snvi_modernization_desc: "A SNVI, fabricante nacional de veículos da Argélia, deve ser modernizada para competir globalmente. Expandir a capacidade de produção fortalecerá nossa base de transporte e industrial."
 ALG_annaba_steel_complex: "Complexo Siderúrgico de Annaba"
 ALG_annaba_steel_complex_desc: "Annaba abriga as maiores instalações de produção de aço da Argélia. Modernizá-las e ampliá-las fornecerá a espinha dorsal das futuras indústrias de infraestrutura e defesa."
 ALG_arzew_refinery: "Expansão da Refinaria de Arzew"
 ALG_arzew_refinery_desc: "A refinaria de Arzew é um elo vital em nossas exportações de energia. Expandir sua capacidade garantirá a entrada de divisas e fortalecerá o domínio da Sonatrach."
 ALG_pipeline_modernization: "Modernizar os Oleodutos"
 ALG_pipeline_modernization_desc: "Um sistema moderno de oleodutos é essencial para exportações de energia seguras e eficientes. Modernizar nossos oleodutos evitará perdas e melhorará a confiabilidade internacional."
 ALG_skikda_port_modernization: "Modernizar o Porto de Skikda"
 ALG_skikda_port_modernization_desc: "O porto de Skikda é essencial para o comércio e as exportações de energia. Modernizar suas instalações garantirá que a Argélia continue sendo um polo marítimo competitivo."
 ALG_grant_foreign_energy_concessions: "Conceder Concessões de Energia a Estrangeiros"
 ALG_grant_foreign_energy_concessions_desc: "Ao conceder concessões selecionadas a empresas estrangeiras, a Argélia pode atrair capital e tecnologia, embora com o risco de ceder parte de sua independência energética."
 ALG_hassi_messaoud_expansion: "Expandir o Campo de Petróleo de Hassi Messaoud"
 ALG_hassi_messaoud_expansion_desc: "O campo de petróleo de Hassi Messaoud é o maior da Argélia. Expandir a capacidade de extração e refino impulsionará enormemente nossa produção de energia."
 ALG_expand_sonatrach: "Expandir a Sonatrach"
 ALG_expand_sonatrach_desc: "A Sonatrach é o coração pulsante da economia da Argélia. Fortalecer a empresa garantirá nosso papel global na produção de petróleo e gás."
 ALG_protect_oil_gas_facilities: "Proteger as Instalações de Petróleo e Gás"
 ALG_protect_oil_gas_facilities_desc: "Nossa infraestrutura energética é vulnerável em tempos de guerra ou agitação. Reforçar as defesas em torno das instalações de petróleo e gás é fundamental para a segurança nacional."
 ALG_minister_of_agriculture_reforms: "Programa de Reforma Agrícola"
 ALG_minister_of_agriculture_reforms_desc: "Anos de negligência enfraqueceram a agricultura da Argélia. Novas reformas sob o Ministério da Agricultura restaurarão a produtividade e reduzirão a dependência de importações de alimentos."
 ALG_modernize_agricultural_sector: "Modernizar o Setor Agrícola"
 ALG_modernize_agricultural_sector_desc: "Anos de conflito e negligência deixaram as fazendas da Argélia obsoletas e ineficientes. Mecanização, sistemas de irrigação e subsídios revitalizarão o setor agrícola, garantindo a segurança alimentar do nosso povo."
 ALG_rural_development_program: "Programa de Desenvolvimento Rural"
 ALG_rural_development_program_desc: "As aldeias da Argélia há muito sofrem com a falta de investimento. Direcionando recursos para infraestrutura rural, energia e empregos, reduziremos a desigualdade entre as cidades e o campo e fortaleceremos a unidade nacional."
 ALG_promote_algerian_produce: "Promover os Produtos Argelinos"
 ALG_promote_algerian_produce_desc: "Nossa terra produz grande variedade de culturas e produtos naturais, mas as importações estrangeiras dominam os mercados locais. Por meio de marcas, subsídios e incentivos comerciais, elevaremos o perfil dos produtos argelinos no país e no exterior."
 ALG_build_farm_to_market_roads: "Estradas da Fazenda ao Mercado"
 ALG_build_farm_to_market_roads_desc: "Os agricultores precisam de melhor acesso aos consumidores e às rotas de exportação. Construir estradas das zonas rurais aos centros urbanos e através da fronteira tunisiana fortalecerá tanto nosso setor agrícola quanto os laços regionais."
 ALG_new_agro_industrial_complexes: "Novos Complexos Agroindustriais"
 ALG_new_agro_industrial_complexes_desc: "A Argélia deve ligar a agricultura à indústria moderna. Construindo complexos agroindustriais, podemos criar produtos de maior valor agregado, gerar empregos e elevar a renda rural."
 ALG_invest_tourism: "Investir no Turismo"
 ALG_invest_tourism_desc: "O turismo já prosperou na Argélia antes que os anos de guerra afastassem os visitantes. Com investimento cuidadoso e segurança aprimorada, podemos começar a restaurar esse setor vital."
 ALG_restore_hotel_resorts: "Restaurar Hotéis e Resorts"
 ALG_restore_hotel_resorts_desc: "Muitos dos resorts e hotéis da Argélia estão em ruínas ou abandonados. Reformá-los ajudará a atrair visitantes estrangeiros e a gerar empregos internos."
 ALG_blida_airbase_modernization: "Modernização da Base Aérea de Blida"
 ALG_blida_airbase_modernization_desc: "A base aérea de Blida é uma instalação fundamental tanto para viagens civis quanto para o transporte militar. Modernizá-la melhorará a conectividade da Argélia e impulsionará o comércio regional."
 ALG_algiers_oran_highway: "Rodovia Argel–Orã"
 ALG_algiers_oran_highway_desc: "Ligar Argel a Orã por uma rodovia moderna encurtará os tempos de transporte, apoiará o comércio e fortalecerá a espinha dorsal econômica da Argélia."
 ALG_east_west_highway_project: "Projeto da Rodovia Leste–Oeste"
 ALG_east_west_highway_project_desc: "Estendendo-se por toda a extensão da Argélia, a Rodovia Leste–Oeste será um dos maiores projetos de infraestrutura da África, conectando nossas regiões e estimulando o comércio."
 ALG_ski_resorts_of_tikjda: "Estações de Esqui de Tikjda"
 ALG_ski_resorts_of_tikjda_desc: "Nas montanhas da Cabília fica Tikjda, um resort com potencial inexplorado. Modernizar suas instalações e promover o turismo de inverno diversificará a base econômica da Argélia."
 ALG_north_african_tourism_hub: "Polo de Turismo do Norte da África"
 ALG_north_african_tourism_hub_desc: "Investindo em nossas costas, em nosso patrimônio cultural e em nossas paisagens naturais, a Argélia pode se tornar o principal destino turístico do Norte da África, rivalizando com nossos vizinhos mediterrâneos."
 ALG_it_investments: "Investimentos em TI"
 ALG_it_investments_desc: "Com a velocidade com que a tecnologia da informação evolui, não podemos prescindir dela no futuro. Portanto, é mais do que hora de investir nesse setor."
 ALG_infrastructure_investments: "Investimentos em Infraestrutura"
 ALG_infrastructure_investments_desc: "Nossa infraestrutura após os anos 90 está em estado deplorável. Já era hora de reconstruí-la"
 ALG_science_idea: "Ciência e Educação Argelinas"
 ALG_fuel: "Combustível Argelino"
 ALG_dziri: "Dziri"
 ALG_dziri_desc: "A Argélia deve abordar suas questões sociais urgentes: da tradição e do Islã aos direitos amazigues e às reformas democráticas. O caminho que escolhermos moldará a nação."
 ALG_traditions_matter: "As Tradições Importam"
 ALG_traditions_matter_desc: "O povo argelino se apega firmemente à fé, à família e à identidade nacional. Nosso governo deve respeitar essas tradições se quisermos manter a legitimidade."
 ALG_restrict_women_roles: "Preservar o Código da Família"
 ALG_restrict_women_roles_desc: "Líderes conservadores argumentam que o papel das mulheres deve continuar centrado na família. Reformar o Código da Família corre o risco de irritar as autoridades religiosas e o público."
 ALG_expand_berber_rights: "Reconhecer os Direitos Amazigues"
 ALG_expand_berber_rights_desc: "O movimento de identidade berbere exige pleno reconhecimento cultural e linguístico. Conceder direitos amazigues amenizaria as tensões, mas poderia alienar os linhas-duras."
 ALG_censor_internet: "Censurar a Internet"
 ALG_censor_internet_desc: "As redes sociais e o ativismo on-line alimentaram os protestos. Restringir as liberdades on-line restaurará o controle do Estado, mas prejudicará nossa imagem internacional."
 ALG_open_civil_society: "Abrir a Sociedade Civil"
 ALG_open_civil_society_desc: "As forças democráticas pressionam por uma sociedade civil livre, ONGs e associações do Hirak. Abrir esse espaço fortaleceria a legitimidade, mas arriscaria a fragmentação política."
 ALG_integration_policy: "Política de Integração"
 ALG_integration_policy_desc: "Migrantes subsaarianos e a diáspora que retorna enfrentam dificuldades. Uma política de integração estruturada pode reduzir as tensões sociais e promover a coesão."
 ALG_marriage_subsidies: "Subsídios ao Casamento"
 ALG_marriage_subsidies_desc: "Com os jovens tendo dificuldade para se casar e formar famílias, subsídios para moradia e casamentos estabilizarão a sociedade e incentivarão a formação de famílias."
 ALG_constitutionalize_rights: "Constitucionalizar os Direitos"
 ALG_constitutionalize_rights_desc: "Podemos garantir as liberdades civis, os direitos das mulheres e o reconhecimento amazigue por meio de uma reforma constitucional. Isso sinalizaria uma mudança social permanente."
 ALG_berber_right: "Reconhecimento Amazigue"
 ALG_berber_right_desc: "A identidade amazigue foi oficialmente reconhecida, aumentando a estabilidade nas regiões de maioria berbere."
 Algeria.238.t: "Estabilizar o Mali"
 Algeria.238.d: "O conflito em curso no Mali ameaça desestabilizar toda a região do Sahel. Separatistas tuaregues e grupos jihadistas criaram uma crise de segurança em nossa fronteira sul. A Argélia não pode se dar ao luxo de permanecer passiva enquanto a instabilidade se espalha. Devemos decidir se apoiamos o governo malinês na restauração da ordem ou se buscamos negociações com as facções tuaregues na esperança de alcançar um acordo duradouro."
 Algeria.238.a: "Apoiar o Governo Malinês"
 Algeria.238.b: "Oferecer Apoio às Forças Tuaregues"
 ALG_us_invest_tt: "Buscar investimento americano na Argélia"
 ALG_fra_invest_tt: "Buscar investimento francês na Argélia"
 ALG_eng_invest_tt: "Buscar investimento inglês na Argélia"
 ALG_chi_invest_tt: "Buscar investimento chinês na Argélia"
 ALG_rus_invest_tt: "Buscar investimento russo na Argélia"
 ALG_open_to_west: "Abertura ao Ocidente"
 ALG_open_to_west_desc: "A Argélia há muito persegue a neutralidade, mas os tempos estão mudando. Alinhar-nos mais de perto ao mundo ocidental poderia trazer estabilidade, segurança e oportunidades de investimento."
 ALG_nato_partnership: "Parceria com a OTAN"
 ALG_nato_partnership_desc: "Exploraremos uma cooperação estruturada com a OTAN. Essa parceria fortalecerá a posição internacional da Argélia e ajudará a modernizar nossas forças armadas."
 ALG_energy_partnership_eu: "Parceria Energética com a UE"
 ALG_energy_partnership_eu_desc: "As vastas reservas de energia da Argélia são muito procuradas na Europa. Ao firmar parcerias energéticas com a França e o Reino Unido, podemos garantir contratos lucrativos e investimentos de longo prazo."
 ALG_strengthen_eu_trade: "Fortalecer as Relações Comerciais com a UE"
 ALG_strengthen_eu_trade_desc: "A Europa continua sendo nosso maior parceiro comercial. Fortalecer esses laços econômicos estabilizará nosso mercado de exportação e integrará ainda mais a Argélia ao comércio global."
 ALG_expand_us_partnership: "Expandir a Parceria com os EUA"
 ALG_expand_us_partnership_desc: "Os Estados Unidos buscam estabilidade no Norte da África. Ao expandir a cooperação econômica e de segurança com Washington, a Argélia pode atrair investimentos e conquistar um aliado poderoso."
 ALG_become_nato_ally: "Tornar-se Aliado da OTAN"
 ALG_become_nato_ally_desc: "Embora a adesão plena à OTAN possa ser prematura, a Argélia pode obter o status de aliado de confiança. Isso nos daria acesso a conhecimento militar, exercícios conjuntos e influência diplomática."
 ALG_exchange_research_with_nato: "Trocar Pesquisas com a OTAN"
 ALG_exchange_research_with_nato_desc: "A cooperação científica com os aliados da OTAN permitirá que a Argélia se beneficie de pesquisas conjuntas, do compartilhamento de tecnologia militar e da modernização de nossas instituições de educação e pesquisa."
 ALG_get_nato_military_exp: "Obter Conhecimento Militar da OTAN"
 ALG_get_nato_military_exp_desc: "O extenso treinamento e a doutrina militar da OTAN oferecem conhecimento valioso. As forças armadas da Argélia se modernizarão por meio de exercícios de treinamento combinados e orientação estratégica."
 ALG_counterterrorism_coordination: "Coordenação Antiterrorismo"
 ALG_counterterrorism_coordination_desc: "O terrorismo continua sendo uma grande ameaça no Norte da África. Coordenando-se com as unidades de inteligência e antiterrorismo da OTAN, a Argélia pode fortalecer a segurança interna e a estabilidade regional."
 ALG_get_investements_from_nato: "Atrair Investimentos da OTAN"
 ALG_get_investements_from_nato_desc: "Nosso alinhamento com a OTAN atrairá apoio econômico e projetos de infraestrutura dos membros da aliança, garantindo benefícios de longo prazo para a economia da Argélia."
 ALG_strengthen_democratic_norms: "Fortalecer as Normas Democráticas"
 ALG_strengthen_democratic_norms_desc: "Para se integrar plenamente ao mundo ocidental, a Argélia deve fortalecer as instituições democráticas. Isso inclui proteger as liberdades civis, apoiar o pluralismo e incentivar a reforma política."
 ALG_seek_greater_influence_in_wto: "Buscar Maior Influência na OMC"
 ALG_seek_greater_influence_in_wto_desc: "À medida que a Argélia se desenvolve, devemos ampliar nosso papel na Organização Mundial do Comércio, garantindo que nossa voz seja ouvida nas negociações econômicas globais."
 ALG_seek_security_council_seat: "Buscar uma Cadeira no Conselho de Segurança da ONU"
 ALG_seek_security_council_seat_desc: "O histórico diplomático e o desempenho da Argélia em missões de paz nos dão um forte argumento para uma presença permanente no Conselho de Segurança da ONU. Devemos lutar por essa ambição."
 ALG_join_nato: "Ingressar na OTAN"
 ALG_join_nato_desc: "Após décadas de neutralidade e equilíbrio cauteloso, a Argélia se prepara agora para dar um passo histórico: a adesão plena à OTAN. Essa decisão consolidará nosso lugar entre as potências ocidentais e remodelará nossa política externa."
 ALG_global_companies: "Convidar Corporações Globais"
 ALG_global_companies_desc: "Abrindo nossos mercados a investidores estrangeiros, a Argélia pode atrair corporações globais para se estabelecerem em nossa economia. Isso impulsionará o crescimento industrial, as transferências de tecnologia e o prestígio internacional."
 ALG_huawei: "Telecomunicações Huawei"
 ALG_huawei_desc: "A Huawei se ofereceu para estabelecer uma infraestrutura avançada de telecomunicações na Argélia, dando-nos uma espinha dorsal digital moderna e garantindo nosso papel na era da informação."
 ALG_hyundai: "Expansão Industrial da Hyundai"
 ALG_hyundai_desc: "A Hyundai manifestou interesse em investir nos setores de veículos e industrial da Argélia. Ao receber suas fábricas, podemos estimular o emprego e o desenvolvimento tecnológico."
 ALG_weapons_expert: "Especialização em Armamento Estrangeiro"
 ALG_weapons_expert_desc: "Por meio da cooperação com empresas de defesa estrangeiras, a Argélia pode adquirir novo conhecimento em armas de apoio e sistemas táticos, fortalecendo nossas forças terrestres."
 ALG_airburst_weapons: "Desenvolver Armas de Detonação Aérea"
 ALG_airburst_weapons_desc: "A tecnologia de detonação aérea permite que a infantaria atinja inimigos atrás de cobertura ou em posições fortificadas. Investir nesse sistema de ponta aumentará muito nossa eficácia no campo de batalha."
 ALG_vehicle_industry: "Expandir a Indústria de Veículos"
 ALG_vehicle_industry_desc: "Em parceria com montadoras e empresas industriais globais, a Argélia pode estabelecer uma forte indústria de veículos militares e civis para impulsionar tanto a defesa quanto a economia."
 ALG_advanced_ultility_vehicle: "Veículos Utilitários Avançados"
 ALG_advanced_ultility_vehicle_desc: "Nosso setor automotivo deve avançar para o desenvolvimento de ponta. Produzir veículos utilitários modernos e confiáveis fortalecerá a logística e a eficiência do transporte."
 ALG_sat_tech: "Cooperação em Tecnologia de Satélites"
 ALG_sat_tech_desc: "Por meio de parcerias com empresas globais, a Argélia pode desenvolver tecnologia avançada de satélites, aprimorando nossos sistemas de vigilância, comunicações e posicionamento."
 ALG_advanced_radar: "Sistemas de Radar Avançados"
 ALG_advanced_radar_desc: "A tecnologia moderna de radar e detecção dará à Argélia maiores capacidades defensivas e nos permitirá integrar estruturas avançadas de segurança regional."
 ALG_microsoft: "Infraestrutura Digital da Microsoft"
 ALG_microsoft_desc: "Em parceria com a Microsoft, a Argélia pode modernizar seus setores de TI e software, aprimorando a cibersegurança, a administração digital e o crescimento impulsionado pela tecnologia."
 ALG_Lenovo: "Investimento Tecnológico da Lenovo"
 ALG_Lenovo_desc: "A Lenovo tem interesse em ampliar sua presença na Argélia. Colaborar com ela fortalecerá nossa indústria de hardware de computação e apoiará a inovação tecnológica."
 ALG_Danone: "Expansão da Danone na Indústria de Alimentos"
 ALG_Danone_desc: "Receber o investimento da Danone no setor alimentício da Argélia melhorará a nutrição, os padrões de produção de alimentos e as relações comerciais internacionais."
 ALG_toyota: "Parceria Industrial com a Toyota"
 ALG_toyota_desc: "Convidando a Toyota a estabelecer instalações industriais e automotivas, a Argélia pode aprimorar a produção de veículos, criar empregos e promover o avanço tecnológico no setor automotivo."
 ALG_align_with_south_africa: "Alinhar-se à África do Sul"
 ALG_align_with_south_africa_desc: "A África do Sul tem papel de liderança nos assuntos políticos e econômicos da África. Fortalecendo nossa parceria, podemos coordenar políticas de comércio, diplomacia e segurança em todo o continente."
 ALG_open_to_east: "Abertura ao Oriente"
 ALG_open_to_east_desc: "Voltar-se para o Oriente diversificará nossas parcerias, reduzirá a dependência do Ocidente e abrirá oportunidades em mercados como Rússia, China e outras potências emergentes."
 ALG_expand_trade_with_russia: "Expandir o Comércio com a Rússia"
 ALG_expand_trade_with_russia_desc: "A Rússia oferece à Argélia novas oportunidades em energia, armas e cooperação industrial. Fortalecer nossos laços comerciais aprofundará as relações estratégicas."
 ALG_expand_trade_with_china: "Expandir o Comércio com a China"
 ALG_expand_trade_with_china_desc: "A China está ansiosa para investir na África e oferece à Argélia acordos comerciais vantajosos. Essa cooperação poderia nos proporcionar infraestrutura e desenvolvimento industrial."
 ALG_mediterranean_corridor_initiative: "Iniciativa do Corredor Mediterrâneo"
 ALG_mediterranean_corridor_initiative_desc: "Ligando nossa economia mais estreitamente aos mercados do Mediterrâneo e do Oriente, a Argélia pode se firmar como um corredor fundamental para o comércio e projetos de infraestrutura."
 ALG_Investments_From_East: "Investimentos do Oriente"
 ALG_Investments_From_East_desc: "Atrair investidores do Oriente fortalecerá nossa economia, trará novas indústrias e garantirá que a Argélia se beneficie de fontes de capital diversificadas."
 ALG_eastern_alignment: "Alinhamento com o Oriente"
 ALG_eastern_alignment_desc: "Um alinhamento mais forte com a Rússia, a China e seus aliados dará à Argélia novos parceiros em segurança, comércio e tecnologia, reduzindo a influência ocidental."
 ALG_china_civ: "Investimentos Civis Chineses"
 ALG_china_civ_desc: "Corporações chinesas estão prontas para se expandir nas indústrias civis da Argélia. Esses projetos gerarão empregos e acelerarão a modernização."
 ALG_china_civ2: "Mais Projetos Civis Chineses"
 ALG_china_civ2_desc: "Após o sucesso dos empreendimentos anteriores, a China oferece investimentos adicionais para ampliar ainda mais a base industrial civil da Argélia."
 ALG_chinese_armor_deal: "Acordo de Blindados com a China"
 ALG_chinese_armor_deal_desc: "A China propôs vender à Argélia veículos blindados e pacotes de tecnologia. Esse acordo melhorará nossas forças terrestres e aprofundará os laços de defesa."
 ALG_joint_military_exercise_with_rus: "Exercícios Militares Conjuntos com a Rússia"
 ALG_joint_military_exercise_with_rus_desc: "Realizando exercícios conjuntos com a Rússia, a Argélia melhorará a coordenação militar e aprenderá com a experiência de combate russa."
 ALG_russia_inf_tech: "Tecnologia de Infantaria Russa"
 ALG_russia_inf_tech_desc: "A experiência russa em armas leves e táticas de infantaria pode ser adaptada às necessidades argelinas, dando a nossos soldados melhores ferramentas e treinamento."
 ALG_russia_experience: "Cooperação de Defesa com Moscou"
 ALG_russia_experience_desc: "Aprofundar a cooperação militar com a Rússia trará conselheiros experientes e programas de treinamento à Argélia. Nossas forças armadas sairão mais fortes e mais preparadas."
 ALG_idea_parliamentary_republic: "Majlis al-Watani al-Shaabi"
 ALG_idea_presidential_republic: "Sistema Presidencialista"
 ALG_idea_semi_presidential_republic: "Al-Jumhorya al-Democratia al-Shaabia"
 ALG_release_political_pirsoners: "Libertar os Presos Políticos"
 ALG_release_political_pirsoners_desc: "Para abrir um novo capítulo para a nação, a nova administração libertará aqueles detidos por motivos políticos durante os anos de agitação. Este ato de clemência pretende promover a unidade nacional e reconstruir a confiança entre o povo e o Estado."
 ALG_al_jazair_al_djadida: "Al-Jazair Al-Djadida"
 ALG_al_jazair_al_djadida_desc: "A promessa do presidente Abdelmadjid Tebboune de uma 'Nova Argélia' busca renovar a legitimidade do Estado por meio de reformas constitucionais e administrativas, fortalecendo as instituições democráticas e a confiança pública."
 ALG_republic_of_algeria: "A República da Argélia"
 ALG_republic_of_algeria_desc: "Lançadas as bases da reforma, a Argélia reafirma sua identidade como uma república guiada pela soberania nacional, pela justiça social e pela vontade de seus cidadãos."
 ALG_majlis_al_watani_al_shaabi: "Majlis al-Watani al-Shaabi"
 ALG_majlis_al_watani_al_shaabi_desc: "Uma república parlamentarista daria aos representantes eleitos do povo o poder de guiar o rumo da nação, limitando o domínio do executivo e garantindo a tomada de decisões coletiva."
 ALG_jumhorya_democratia_shaabia: "Al-Jumhorya al-Democratia al-Shaabia"
 ALG_jumhorya_democratia_shaabia_desc: "Manter um equilíbrio semipresidencialista entre os poderes executivo e legislativo poderia estabilizar a transição da Argélia, evitando um retorno ao autoritarismo e assegurando uma governança decisiva."
 ALG_deep_state_republic: "A República do Estado Profundo"
 ALG_deep_state_republic_desc: "Por trás de uma fachada de reforma, surge uma nova estrutura de poder. Ex-generais, empresários e burocratas consolidam o controle nas sombras. Esta 'República do Estado Profundo' mantém a ilusão de democracia enquanto protege suas redes de influência e corrupção."
 ALG_tamazgha: "O Sonho de Tamazgha"
 ALG_tamazgha_desc: "Chegou a hora do renascimento de Tamazgha, a terra do povo amazigue que se estende do Atlântico ao Nilo. Um novo amanhecer surge para o Norte da África, sob a bandeira da liberdade e da unidade."
 ALG_our_land: "Nossa Terra Sagrada"
 ALG_our_land_desc: "Nosso povo deve recuperar e reconstruir as terras que sempre foram nossas. Indústria, mão de obra e coragem serão a base de nossa pátria renascida."
 ALG_expand_our_army: "Expandir Nosso Exército"
 ALG_expand_our_army_desc: "A defesa de Tamazgha depende da força de nosso exército. Devemos treinar, armar e ampliar nossas forças para proteger nossa nova nação de seus muitos inimigos."
 ALG_berber_of_tunisia: "Os Berberes da Tunísia"
 ALG_berber_of_tunisia_desc: "Nossos irmãos amazigues na Tunísia estão há muito sob domínio estrangeiro. É hora de uni-los sob a bandeira de Tamazgha e libertar suas terras."
 ALG_libya_invasion: "Invasão da Líbia"
 ALG_libya_invasion_desc: "Das areias do Saara às costas de Trípoli, a Líbia faz parte, por direito, de nossa pátria cultural. Devemos trazê-la para o seio de Tamazgha."
 ALG_take_egypt: "Marchar sobre o Egito"
 ALG_take_egypt_desc: "O Egito detém a chave da fronteira oriental de Tamazgha. Seus vastos recursos e sua importância estratégica o tornam parte vital de nossa visão."
 ALG_canary_island: "Tomar as Ilhas Canárias"
 ALG_canary_island_desc: "As Ilhas Canárias foram outrora habitadas pelo povo amazigue, os guanches. Traremos essas ilhas de volta à soberania amazigue."
 ALG_take_niger: "Reivindicar o Níger"
 ALG_take_niger_desc: "Os tuaregues do Níger são amazigues de sangue e herança. Seus desertos se juntarão novamente à grande federação de Tamazgha."
 ALG_rif_in_morocco: "O Rife no Marrocos"
 ALG_rif_in_morocco_desc: "As montanhas do Rife deram origem a heróis que resistiram ao colonialismo. Sua bravura nos inspira a unificar o Marrocos sob a causa amazigue."
 ALG_demand_mali: "Exigir o Mali"
 ALG_demand_mali_desc: "As terras do Mali, ricas em história e cultura, já fizeram parte dos grandes impérios amazigues. É hora de restaurar nossa influência no Sahel."
 ALG_demand_mauritania: "Exigir a Mauritânia"
 ALG_demand_mauritania_desc: "Os desertos da Mauritânia guardam raízes amazigues que penetram fundo em nosso passado. Sua unificação com Tamazgha é o próximo passo de nosso destino continental."
 ALG_TAM_unite_tamazgha: "Unir Tamazgha"
 ALG_TAM_unite_tamazgha_desc: "Todas as terras amazigues devem ser unidas sob uma só bandeira. O sonho de Tamazgha não é mais uma visão, é uma missão que cumpriremos."
 ALG_expand_more: "Expandir a Federação"
 ALG_expand_more_desc: "Tamazgha não deve estagnar. A expansão, tanto industrial quanto territorial, garantirá nosso lugar como grande potência da África e do Mediterrâneo."
 ALG_focus_on_our_land: "Focar em Nossa Terra"
 ALG_focus_on_our_land_desc: "Em vez de nos expandirmos demais, devemos nos concentrar em desenvolver nossa terra, melhorando nossa influência, nossa economia e nossa unidade dentro da própria Tamazgha."
 ALG_expand_to_ME: "Expandir para o Oriente Médio"
 ALG_expand_to_ME_desc: "O Oriente Médio está dilacerado pelo caos. Com força e propósito, Tamazgha pode levar ordem e liderança amazigue às terras da Arábia."
 ALG_take_arabia: "Conquistar a Arábia"
 ALG_take_arabia_desc: "A Península Arábica jaz dividida e fraca. Levaremos a luz de Tamazgha a essas terras e garantiremos nosso domínio sobre o Mar Vermelho e o Golfo."
 ALG_take_levant: "Tomar o Levante"
 ALG_take_levant_desc: "Das montanhas do Líbano às planícies da Síria e da Palestina, o Levante cairá sob a bandeira de Tamazgha, aproximando-nos do controle do berço da civilização."
 ALG_legacy_of_dihiya: "Legado de Dihya"
 ALG_legacy_of_dihiya_desc: "A rainha Dihya, a destemida guerreira de Aurès, uniu outrora as tribos amazigues contra invasores estrangeiros. Seu espírito de desafio e liderança vive em nosso povo. Carregamos seu legado adiante, inquebrável, inflexível e para sempre livre."
 ALG_de_arabisation_mission_desc: "A campanha nacional de reforma cultural e linguística está em andamento. A burocracia e a educação estão sendo reescritas para refletir a herança amazigue. Essa transformação causará tensão a curto prazo, mas fortalecerá nossa nação no longo prazo."
 ALG_dearabisation_end_TT: "§GO processo de Desarabização é concluído.§! Os núcleos árabes são substituídos por núcleos amazigues, e recebemos o espírito nacional §Y'Perseverança dos Imazighen'§!."
 ALG_de_arabisation: "Campanha de Desarabização"
 ALG_de_arabisation_desc: "Por séculos, a verdadeira identidade de nosso povo esteve enterrada sob culturas impostas. Recuperaremos nossas raízes reformando as políticas de educação, administração e língua, mesmo que isso perturbe nossa sociedade a curto prazo."
 ALG_dearabisation_penalty: "Convulsão Administrativa"
 ALG_dearabisation_penalty_desc: "O processo de Desarabização perturbou a burocracia estatal e o sistema educacional. Resistência, confusão e ineficiência marcam a transição enquanto o governo tenta reconstruir as instituições à imagem amazigue."
 ALG_imazighen_perseverance: "Perseverança dos Imazighen"
 ALG_imazighen_perseverance_desc: "Através das dificuldades e das reformas, nosso povo resistiu. O espírito amazigue provou ser inquebrável; emergimos da tempestade mais fortes, mais orgulhosos e unidos."
 ALG_el_salam_nuclear_reactor: "Reator Nuclear El Salam"
 ALG_el_salam_nuclear_reactor_desc: "Para atender à crescente demanda de energia da Argélia e reduzir a dependência de combustíveis fósseis, o governo iniciará a construção do reator nuclear El Salam. Este projeto representa um grande passo rumo ao progresso científico e à diversificação energética."
 ALG_uranium_enrichment: "Programa de Enriquecimento de Urânio"
 ALG_uranium_enrichment_desc: "Desenvolver uma capacidade nacional de enriquecimento de urânio permitirá à Argélia gerir seu próprio suprimento de combustível nuclear. Com este programa, nossos cientistas pretendem dominar a tecnologia de centrífugas e alcançar a autossuficiência nuclear."
 ALG_el_nour_nuclear_facility: "Instalação Nuclear El Nour"
 ALG_el_nour_nuclear_facility_desc: "Após o sucesso do reator El Salam, a Argélia ampliará sua infraestrutura nuclear construindo a instalação El Nour, um polo de pesquisa, manutenção de reatores e desenvolvimento nuclear pacífico."
 ALG_ask_for_help_from_india: "Buscar Assistência da Índia"
 ALG_ask_for_help_from_india_desc: "A Índia tem décadas de experiência no desenvolvimento de energia nuclear sob escrutínio internacional. Buscando Nova Délhi para cooperação técnica e científica, a Argélia pode avançar mais rapidamente em seu programa nuclear civil."
 ALG_buy_pinaka_launcher: "Comprar Lançadores de Foguetes Pinaka"
 ALG_buy_pinaka_launcher_desc: "O lançador múltiplo de foguetes Pinaka, de fabricação indiana, é um sistema econômico e confiável. Adquirir esses lançadores fortalecerá as divisões de artilharia da Argélia e promoverá uma cooperação militar mais estreita com a Índia."
 ALG_indian_missiles: "Adquirir Tecnologia de Mísseis Indiana"
 ALG_indian_missiles_desc: "Com a ampliação da colaboração em defesa com a Índia, a Argélia pode obter acesso a sistemas avançados de guiamento e propulsão de mísseis. Integrar essa tecnologia aumentará significativamente nossas capacidades de defesa nacional."
 ALG_subsidise_amazigh_businesses: "Subsidiar Negócios Amazigues"
 ALG_subsidise_amazigh_businesses_desc: "Oferecer subsídios estatais e apoio preferencial a empreendedores amazigues, incentivando o crescimento econômico nas regiões de Tamazgha."
 ALG_leave_arab_league: "Sair da Liga Árabe"
 ALG_leave_arab_league_desc: "Retirar a Argélia da Liga Árabe, afirmando uma identidade amazigue soberana, separada da política do bloco árabe."
 ALG_bring_back_amazigh_exiles: "Trazer de Volta os Exilados Amazigues"
 ALG_bring_back_amazigh_exiles_desc: "Facilitar o retorno de exilados e imigrantes amazigues, oferecendo incentivos para o reassentamento."
 ALG_boost_kabyle_population: "Impulsionar a População Cabila"
 ALG_boost_kabyle_population_desc: "Implementar políticas para aumentar a participação demográfica cabila por meio de incentivos, reassentamento e apoio."
 ALG_de_arabisation_category: "Programa de Desarabização de Tamazgha"
 ALG_de_arabisation_category_desc: "Para construir uma nova Tamazgha, devemos nos livrar da identidade árabe imposta e restaurar a alma amazigue de nossa nação."
 ALG_de_arabisation_mission: "Processo de Desarabização"
 ALG_return_amazigh_exiles: "Trazer de Volta Exilados e Imigrantes Amazigues"
 ALG_return_amazigh_exiles_desc: "Décadas de discriminação forçaram muitos a fugir. É hora de trazê-los para casa."
 ALG_dearabisation_fail_TT: "O fracasso enfraquece a estabilidade e aumenta a tensão étnica."
 ALG_amazigh_businesses_complete_TT: "A satisfação cabila e a economia melhoram."
 ALG_amazigh_businesses_fail_TT: "O fracasso reduz a satisfação cabila."
 ALG_return_exiles_complete_TT: "O retorno dos exilados fortalece a identidade amazigue e a mão de obra."
 ALG_return_exiles_fail_TT: "A falha em repatriar os exilados enfraquece a unidade."
 ALG_leave_arab_league_complete_TT: "Sair da Liga Árabe aumenta a soberania de Tamazgha."
 ALG_leave_arab_league_fail_TT: "A falha em sair causa agitação."
 ALG_kabyle_pop_complete_TT: "A população cabila cresce e a unidade nacional aumenta."
 ALG_kabyle_pop_fail_TT: "Negligenciar a demografia cabila causa agitação."
 ALG_tamazgha_cultural_revival_category: "Renascimento Cultural de Tamazgha"
 ALG_tamazgha_cultural_revival_category_desc: "Com a Arabização encerrada, é hora de restaurar nossa herança cultural, linguística e intelectual; o renascimento de Tamazgha começa."
 ALG_amazigh_language_reform: "Reforma da Língua Amazigue"
 ALG_amazigh_language_reform_desc: "Devemos restaurar o tamazight como língua nacional e promovê-lo por meio da educação e da administração."
 ALG_tamazight_in_education: "Introduzir o Tamazight na Educação"
 ALG_tamazight_in_education_desc: "Implementar a língua tamazight em escolas e universidades para preservar nossas raízes culturais."
 ALG_media_cultural_independence: "Independência Cultural e da Mídia"
 ALG_media_cultural_independence_desc: "Apoiar veículos de mídia amazigues independentes e iniciativas culturais livres de influência externa."
 ALG_tamazgha_regional_cooperation: "Cooperação Regional de Tamazgha"
 ALG_tamazgha_regional_cooperation_desc: "Unir as nações norte-africanas de ascendência amazigue em um marco de cooperação para um futuro compartilhado."
 ALG_amazigh_language_reform_complete_TT: "O tamazight se torna língua oficial do Estado e impulsiona a educação."
 ALG_amazigh_language_reform_fail_TT: "A falha em reformar a educação atrasa o renascimento cultural."
 ALG_tamazight_in_education_complete_TT: "O tamazight é introduzido com sucesso nos programas educacionais."
 ALG_tamazight_in_education_fail_TT: "O sistema educacional continua dominado pelo árabe."
 ALG_media_cultural_independence_complete_TT: "A mídia amazigue independente fortalece a identidade nacional."
 ALG_media_cultural_independence_fail_TT: "A falta de ação enfraquece a influência cultural."
 ALG_tamazgha_regional_cooperation_complete_TT: "Alcançada a unidade regional entre as nações de Tamazgha."
 ALG_tamazgha_regional_cooperation_fail_TT: "A falha em estabelecer a cooperação isola Tamazgha."
 ALG_black_decade_lesson: "Lições da Década Negra"
 ALG_black_decade_lesson_desc: "A guerra civil da década de 1990 marcou profundamente a nação, deixando uma geração desconfiada do extremismo e da instabilidade. O Estado tirou duras lições desse capítulo sombrio, concentrando-se em preservar a unidade nacional, fortalecer as instituições de segurança e evitar o caos do confronto ideológico. No entanto, essas lições também justificam a continuidade do domínio da velha guarda sobre a política, pois o medo de uma repetição ainda molda cada reforma."
 AlgeriaElections.1.t: "As Eleições"
 AlgeriaElections.1.d: "Pela primeira vez em anos, a Argélia assiste a eleições verdadeiramente competitivas. O ar está carregado de expectativa e tensão enquanto milhões de cidadãos vão às urnas, determinados a moldar o futuro de sua nação após décadas de estagnação política. Diversas forças dominam o cenário político.\n\nUm bloco, formado por facções reformistas, liberais e islamistas moderadas, faz campanha pela democracia, pela transparência e pela reconciliação nacional. Sua visão pede o desmantelamento do sistema 'Le Pouvoir' e a restauração da legitimidade do governo. Seu apelo ressoa fortemente entre os jovens, a sociedade civil e os trabalhadores que buscam uma mudança genuína.\n\nOutra frente é formada por independentes pragmáticos e tecnocratas, aqueles que buscam a reforma por dentro. Eles priorizam a democratização gradual, a melhoria da governança e a liberalização econômica, mantendo a estabilidade e a segurança.\n\nÀ medida que os votos são contados, um partido emerge vitorioso, cada um representando um caminho distinto para o futuro da nação."
 AlgeriaElections.1.a: "A FFS Reivindica a Vitória"
 AlgeriaElections.1.b: "O RND Vence as Eleições"
 AlgeriaElections.1.c: "O MSP Garante um Mandato"
 AlgeriaElections.1.dd: "O RCD Ascende ao Poder"
 AlgeriaElections.2.t: "As Eleições"
 AlgeriaElections.2.d: "As eleições tão aguardadas chegaram, e a nação prende a respiração. A Frente de Libertação Nacional (FLN), no poder, mais uma vez se apresenta como o pilar central do sistema político argelino, apelando para aqueles que ainda valorizam a estabilidade, a unidade e a continuidade após a turbulência da Década Negra. Sob a liderança do presidente Abdelaziz Bouteflika e do leal establishment do partido, a FLN promete modernização sem caos, reforma sem ruptura.\n\nOs movimentos de oposição, embora vocais e diversos, permanecem divididos e fragmentados, incapazes de formar uma frente unida capaz de desafiar a velha guarda. Muitos argelinos, cansados da agitação e ansiosos por ordem, votam no que lhes é familiar, convencidos de que a experiência e a segurança pesam mais do que os riscos da mudança.\n\nQuando os últimos votos são contados, o resultado fica claro: o legado da revolução ainda reina soberano."
 AlgeriaElections.2.a: "A FLN Garante Mais uma Vitória!"
 ALG_election_time: "Período Eleitoral"
 ALG_election_time_desc: "A Argélia se prepara para mais uma temporada eleitoral crucial. O cenário político está tenso enquanto tanto a FLN, no poder, quanto os partidos de oposição preparam suas campanhas."
 ALG_FLN_media_control: "Mídia Controlada pelo Estado"
 ALG_FLN_media_control_desc: "Ao reforçar o controle sobre a imprensa e a televisão, o governo garante que a narrativa pública permaneça leal à FLN no poder e à sua visão de estabilidade."
 ALG_loyal_military: "Militares Leais"
 ALG_loyal_military_desc: "O exército provou ser um guardião confiável do regime, garantindo que a ordem e a unidade nacional sejam preservadas acima de tudo."
 ALG_FLN_state_led_development: "Desenvolvimento Liderado pelo Estado"
 ALG_FLN_state_led_development_desc: "O Estado dirige os principais setores da economia, garantindo que o desenvolvimento industrial e social permaneça sob controle nacional."
 ALG_FLN_oil_for_people: "Petróleo para o Povo"
 ALG_FLN_oil_for_people_desc: "O governo usa a vasta riqueza em hidrocarbonetos do país para oferecer bem-estar e subsídios, promovendo um contrato social baseado na redistribuição econômica."
 ALG_FLN_national_security_council: "Conselho de Segurança Nacional"
 ALG_FLN_national_security_council_desc: "Um órgão de alto nível que coordena a segurança interna e a contrainteligência, garantindo que as ameaças ao Estado sejam rapidamente neutralizadas."
 ALG_FLN_industrial_nationalization: "Nacionalização Industrial"
 ALG_FLN_industrial_nationalization_desc: "O governo da FLN tomou medidas para reafirmar o controle sobre as indústrias-chave a fim de proteger a soberania econômica da Argélia."
 ALG_FLN_legacy_of_stability: "Legado de Estabilidade"
 ALG_FLN_legacy_of_stability_desc: "Apesar de suas falhas, o governo da FLN proporcionou continuidade e estabilidade, algo que muitos argelinos valorizam após anos de turbulência."
 ALG_FLN_oil_for_people_idea: "Petróleo para o Povo"
 ALG_FLN_oil_for_people_idea_desc: "O governo decidiu usar as receitas do petróleo para financiar diretamente programas públicos e subsídios. Embora isso eleve o padrão de vida, também corre o risco de ineficiência e dependência a longo prazo."
 ALG_FLN_legacy_of_stability_idea: "Legado de Estabilidade"
 ALG_FLN_legacy_of_stability_idea_desc: "Por décadas, a FLN se apresentou como guardiã da estabilidade da Argélia. Seu firme controle da política e da segurança garante a paz, mas ao custo de liberdades limitadas."
 ALG_FLN_industrial_nationalization_idea: "Nacionalização Industrial"
 ALG_FLN_industrial_nationalization_idea_desc: "Os principais setores da economia estão sendo postos sob controle estatal para garantir a independência nacional e orientar o crescimento industrial sob o planejamento governamental."
 ALG_FLN_state_led_development_idea: "Desenvolvimento Liderado pelo Estado"
 ALG_FLN_state_led_development_idea_desc: "O Estado assume um papel ativo na condução do crescimento econômico da Argélia, enfatizando infraestrutura, educação e bem-estar social para fortalecer as bases da nação."
 ALG_FLN_media_control_idea: "Code de l'Information"
 ALG_FLN_media_control_idea_desc: "O Code de l'Information estabelece o marco legal que rege as atividades de imprensa e radiodifusão, permitindo ao Estado regular as operações da mídia e orientar o espaço nacional de informação."
 ALG_FLN_national_security_council_idea: "Conselho de Segurança Nacional"
 ALG_FLN_national_security_council_idea_desc: "Um poderoso conselho composto por militares, agentes de inteligência e altos funcionários supervisiona a estabilidade interna e a estratégia nacional, garantindo lealdade ao governo da FLN."
 ALG_loyal_military_idea: "Militares Leais"
 ALG_loyal_military_idea_desc: "Os militares permanecem leais à FLN, valorizando a ordem e a hierarquia acima de tudo. Essa unidade vem com menor adaptabilidade e iniciativa no campo de batalha."
 ALG_loyal_military2_idea: "Corpo Militar Leal"
 ALG_loyal_military2_idea_desc: "A lealdade do exército se aprofundou por meio da integração política e de benefícios privilegiados, garantindo um aparato militar poderoso e disciplinado sob o comando do governo."
 ALG_invest_in_youth_idea: "Investir na Juventude"
 ALG_invest_in_youth_idea_desc: "Programas para educar e empregar a crescente população jovem da Argélia moldarão o futuro do país, criando uma nova geração de profissionais e líderes."
 ALG_anti_corruption_campaign_idea: "Campanha Anticorrupção"
 ALG_anti_corruption_campaign_idea_desc: "O governo lançou uma campanha para erradicar a corrupção e os abusos burocráticos, com o objetivo de restaurar a confiança pública e melhorar a eficiência do Estado."
 ALG_new_era_for_algeria_idea: "Uma Nova Era para a Argélia"
 ALG_new_era_for_algeria_idea_desc: "A Argélia entra em uma nova era de reforma e modernização, equilibrando inovação e progresso social com os desafios de uma economia global em mudança."
 ALG_open_market_idea: "Políticas de Mercado Aberto"
 ALG_open_market_idea_desc: "A liberalização gradual da economia argelina atrai investimento e empreendedorismo, com o risco de reduzir o controle tradicional do Estado sobre as indústrias-chave."
 ALG_reform_education_system_idea: "Reformar o Sistema Educacional"
 ALG_reform_education_system_idea_desc: "Reformas abrangentes estão sendo feitas para modernizar o sistema educacional, promover a inovação e alinhar as escolas às necessidades de uma economia argelina moderna."
 ALG_reform_the_judicial_system_idea: "Reforma Judicial"
 ALG_reform_the_judicial_system_idea_desc: "Estão em curso esforços para modernizar o sistema judicial da Argélia, reduzir a corrupção e estabelecer tribunais mais justos que defendam o Estado de direito."
 ALG_free_media_idea: "Mídia Livre"
 ALG_free_media_idea_desc: "Veículos de mídia independentes começam a florescer, proporcionando transparência e prestação de contas, embora isso também aumente as críticas e o debate público."
 ALG_black_decade_lesson_idea: "Lições da Década Negra"
 ALG_black_decade_lesson_idea_desc: "O trauma da guerra civil ainda assombra a Argélia. A nação permanece cautelosa, priorizando a segurança em vez do risco, para garantir que tal instabilidade nunca retorne."
 ALG_election_day: "Dia da Eleição"
 ALG_election_day_desc: "Chegou a hora de os argelinos escolherem seu futuro. Se a FLN no poder manterá seu domínio ou se a oposição triunfará moldará o país por décadas."
 ALG_FLN_path: "Vitória da FLN"
 ALG_FLN_path_desc: "A FLN triunfou mais uma vez, mantendo o controle do governo e do rumo do futuro da Argélia."
 ALG_FLN_preserve_system: "Preservar o Sistema"
 ALG_FLN_preserve_system_desc: "A liderança da FLN não vê necessidade de mudanças drásticas; preservar a ordem existente garante estabilidade e continuidade."
 ALG_FLN_control_media: "Aprovar a Lei Orgânica nº 12-05"
 ALG_FLN_control_media_desc: "Ao adotar a Lei Orgânica nº 12-05, que regula a atividade de informação e mídia, o Estado pode moldar a narrativa nacional enquanto mantém um marco legal para a supervisão da imprensa."
 ALG_election_day_tt: "§YDesbloqueia o caminho para a eleição presidencial de 2004 da Argélia.§!\nEm breve você terá de escolher, para o futuro do país, entre a §RFLN§! no poder e a §YOposição§!."
 ALG_ethnic_kabyle_tt: "A §YPopulação Cabila§! é maior que §Y10%§!"
 ALG_kabyle_satisfaction_tt: "A §YSatisfação Cabila§! é de pelo menos §Y65§!"
 ALG_kabyle_satisfaction_70_tt: "A §YSatisfação Cabila§! é maior que §Y70§!"
 ALG_kabyle_satisfaction_60_tt: "A §YSatisfação Cabila§! é de pelo menos §Y60§!"
 ALG_fossil_fuel_industry: "Lobby da Sonatrach"
 ALG_fossil_fuel_industry_desc: "A gigante estatal de energia Sonatrach e sua rede de empreiteiras formam uma das facções mais poderosas da Argélia. Elas defendem os subsídios, resistem à diversificação econômica e mantêm laços estreitos com empresas e governos estrangeiros dependentes do petróleo e do gás argelinos."
 ALG_the_military: "Exército Nacional Popular (ANP)"
 ALG_the_military_desc: "As forças armadas argelinas, a ANP, são a espinha dorsal do Estado. Atuam como guardiãs da unidade e da estabilidade nacionais, mas seu domínio limita a reforma democrática. Equilibrando-se entre proteger a Argélia e restringir o governo civil, a ANP é sempre um ator decisivo na política."
 ALG_industrial_conglomerates: "CEVITAL-MADAR"
 ALG_industrial_conglomerates_desc: "Os conglomerados industriais, dominados por gigantes como a Cevital e a Madar Holdings, representam a elite empresarial oligárquica em ascensão da Argélia. Intimamente ligados ao poder político e muitas vezes entrelaçados com os militares e as famílias governantes, esses grupos buscam lucro por meio de privatizações, bens de consumo, imóveis e comércio exterior. Podem trazer investimento e crescimento muito necessários, mas ao custo de corrupção, desigualdade e captura política."
 ALG_offices_contruction_speed: "Velocidade de Construção de Escritórios"
 ALG_arms_factory_contruction_speed: "Velocidade de Construção de Fábricas Militares"
 ALG_civ_construction_speed: "Velocidade de Construção de Fábricas Civis"
 ALG_population_energy_consumption: "Consumo de Energia da População"
 ALG_civ_factory_workforce: "Trabalhadores Necessários nas Fábricas Civis"
 ALG_mil_factory_workforce: "Trabalhadores Necessários nas Fábricas Militares"
 ALG_office_workforce: "Trabalhadores Necessários nos Escritórios"
 ALG_military_modifier: "Forças Armadas Argelinas"
 ALG_military_modifier_desc: "Representa as capacidades e reformas das forças armadas argelinas."
 ALG_opposition_path: "O Caminho da Oposição"
 ALG_opposition_path_desc: "À medida que a oposição política ganha impulso, o país enfrenta uma escolha: reformar por dentro ou arriscar o caos. Chegou a hora de abraçar a transparência e o progresso."
 ALG_OPP_free_elections: "Realizar Eleições Livres"
 ALG_OPP_free_elections_desc: "Por tempo demais, a voz do povo foi silenciada. A verdadeira democracia começa com eleições transparentes e justas."
 ALG_FLN_military_loyalty: "Garantir a Lealdade Militar"
 ALG_FLN_military_loyalty_desc: "Os militares são um pilar de estabilidade. Garantir sua lealdade evitará turbulências e assegurará o futuro de nossa nação."
 ALG_FLN_public_works: "Lançar Programas de Obras Públicas"
 ALG_FLN_public_works_desc: "Investindo em infraestrutura pública, oferecemos empregos e renovamos a fé do povo nas instituições governamentais."
 ALG_reform_armed_forces: "Reformar as Forças Armadas"
 ALG_reform_armed_forces_desc: "Modernizar a estrutura militar garantirá eficiência, disciplina e lealdade ao Estado, em vez de a indivíduos."
 ALG_counter_extremism: "Capacidades Antiterrorismo"
 ALG_counter_extremism_desc: "As redes terroristas ameaçam nossa estabilidade nacional. Fortalecendo a inteligência, as forças de segurança e os programas de prevenção, podemos aprimorar as capacidades antiterrorismo da Argélia."
 ALG_regional_power: "Uma Potência Regional"
 ALG_regional_power_desc: "Alcançada a estabilidade interna, a Argélia pode projetar força e liderança em todo o Norte da África e no Mediterrâneo."
 ALG_expanding_the_power_grid: "Expandir a Rede Elétrica"
 ALG_expanding_the_power_grid_desc: "Um fornecimento de energia confiável é vital para o crescimento econômico. Expandir a rede de energia apoiará a indústria e o desenvolvimento rural."
 ALG_OPP_new_constitution: "Redigir uma Nova Constituição"
 ALG_OPP_new_constitution_desc: "Uma nova constituição lançará as bases da democracia, da igualdade e do governo civil."
 ALG_OPP_media_freedom: "Garantir a Liberdade de Imprensa"
 ALG_OPP_media_freedom_desc: "A liberdade de imprensa é essencial para responsabilizar os líderes e informar o público com veracidade."
 ALG_OPP_judiciary_reform: "Reformar o Judiciário"
 ALG_OPP_judiciary_reform_desc: "Um judiciário independente e transparente é fundamental para garantir justiça a todos os cidadãos, independentemente de status ou influência."
 ALG_OPP_education_first: "Educação em Primeiro Lugar"
 ALG_OPP_education_first_desc: "Uma nação moderna depende de uma população bem educada. Investir em escolas e universidades moldará um futuro mais brilhante."
 ALG_OPP_open_market: "Abrir o Mercado"
 ALG_OPP_open_market_desc: "Reformas econômicas e comércio aberto atrairão investimento e criarão oportunidades para empreendedores."
 ALG_OPP_new_era: "Uma Nova Era para a Argélia"
 ALG_OPP_new_era_desc: "Após anos de luta e reforma, a Argélia entra em um novo capítulo de liberdade, prosperidade e estabilidade."
 ALG_OPP_anti_corruption: "Combater a Corrupção"
 ALG_OPP_anti_corruption_desc: "A corrupção drena o potencial da nação. É hora de leis rigorosas, instituições transparentes e responsabilização em todos os níveis."
 ALG_OPP_invest_in_youth: "Investir na Juventude"
 ALG_OPP_invest_in_youth_desc: "A juventude é a alma da Argélia. Ao fortalecê-la por meio da educação e do emprego, garantimos o futuro da nação."
 ALG_OPP_state_first: "O Estado em Primeiro Lugar"
 ALG_OPP_state_first_desc: "Em tempos de mudança, a unidade e o interesse nacional devem guiar cada política. A integridade do Estado vem antes do ganho partidário."
 ALG_terror_2013_in_amenas_title: "Crise de Reféns de In Amenas, 2013"
 ALG_terror_2013_in_amenas_desc: "Um grupo de militantes armados ligados a organizações extremistas lançou um ataque surpresa à instalação de gás de In Amenas, no sul da Argélia. Os atacantes tomaram centenas de reféns, incluindo trabalhadores estrangeiros, desencadeando uma crise internacional. O exército argelino cercou rapidamente o local, levando a um sangrento impasse que chocou o mundo e levantou questões sobre a capacidade do governo de lidar com o terrorismo nas regiões desérticas."
 ALG_terror_2013_placeholder_option: "Nossas forças respondem com firmeza."
 ALG_terror_2013_low_tt: "Agitação menor contida. §GA estabilidade melhora ligeiramente.§!"
 ALG_terror_2013_medium_tt: "A situação piora, alimentando a §ORadicalização§! e reduzindo a §Restabilidade§!."
 ALG_terror_2013_high_tt: "O ataque foge ao controle. §RA estabilidade nacional despenca§! enquanto os §Oinsurgentes radicais§! ganham terreno."
 ALG_healthcare_reform_tt: "A §Yinsatisfação pública§! deve estar abaixo de §Y40§! para iniciar a reforma da saúde."
 ALG_education_reform_tt: "A §Yinsatisfação pública§! deve estar abaixo de §Y40§! para iniciar a reforma da educação."
 ALG_unemployment_reform_tt: "A §Yinsatisfação pública§! deve estar abaixo de §Y40§! para iniciar a reforma do desemprego."
 ALG_employment_TT: "O §HDesemprego§! é inferior a §H20%§!"
 ALG_grand_mosque: "A Grande Mesquita de Argel"
 ALG_grand_mosque_desc: "Símbolo do renascimento espiritual e cultural da Argélia, a Grande Mesquita de Argel é uma das mais altas e magníficas mesquitas do mundo. Sua construção não apenas demonstra a ambição arquitetônica da nação, mas também serve como farol da herança e da unidade islâmicas. Concluir este projeto monumental fortalecerá o orgulho nacional e projetará a influência da Argélia pelo mundo muçulmano."
 ALG_big_cities_or_rising_states: "Programa de Desenvolvimento Urbano ou Regional"
 ALG_big_cities_or_rising_states_desc: "Após o programa de recuperação do pós-guerra, o governo deve decidir seu próximo passo: concentrar recursos nas grandes cidades costeiras para fortalecer a espinha dorsal industrial da Argélia ou elevar as regiões do interior e do deserto para alcançar um crescimento nacional equilibrado?"
 ALG_focus_on_big_cities: "Focar nas Grandes Cidades"
 ALG_focus_on_big_cities_desc: "Centros urbanos como Argel, Orã e Constantina são os motores da economia da Argélia. Concentrando nossos esforços de desenvolvimento ali, podemos modernizar nossa infraestrutura e melhorar a produtividade."
 ALG_rising_states_program: "Programa Estados em Ascensão"
 ALG_rising_states_program_desc: "Enquanto as cidades costeiras prosperam, as regiões do interior ficam para trás. O Programa Estados em Ascensão visa levar estradas, escolas e indústrias ao coração da Argélia, garantindo que nenhuma província seja deixada para trás."
 ALG_develop_atlas: "Desenvolver o Atlas Argelino"
 ALG_develop_atlas_desc: "As regiões montanhosas do Atlas têm grande potencial para a agricultura e a pequena indústria. Investir aqui melhorará o padrão de vida local e criará segurança alimentar a longo prazo."
 ALG_develop_kabylia: "Expandir a Região da Cabília"
 ALG_develop_kabylia_desc: "A Cabília tem uma forte identidade cultural e um povo trabalhador. Desenvolver sua infraestrutura e seus escritórios fortalecerá tanto o orgulho regional quanto a unidade nacional."
 ALG_develop_aures: "Crescimento Agrícola em Aurès"
 ALG_develop_aures_desc: "As Montanhas de Aurès abrigam vastas terras agrícolas e comunidades trabalhadoras. Modernizar a produção agrícola aqui reduzirá a pobreza rural e estabilizará o abastecimento de alimentos."
 ALG_expand_oran: "Expandir a Zona Industrial de Orã"
 ALG_expand_oran_desc: "Orã é uma das cidades industriais e portuárias mais importantes da Argélia. Expandir sua zona industrial criará novos empregos e impulsionará as exportações."
 ALG_expand_algiers: "Modernizar Argel"
 ALG_expand_algiers_desc: "Como coração pulsante da Argélia, Argel deve continuar a evoluir. Novos escritórios, infraestrutura e reformas urbanas a transformarão em uma capital modelo do Norte da África."
 ALG_expand_constantine: "Investir em Constantina"
 ALG_expand_constantine_desc: "A longa história de educação e cultura de Constantina a torna um polo ideal para o ensino superior e a inovação. Investir aqui criará uma nova geração de pensadores e engenheiros argelinos."
 ALG_develop_tamanrasset: "Desenvolver a Infraestrutura de Tamanrasset"
 ALG_develop_tamanrasset_desc: "No coração do Saara, Tamanrasset é a chave da logística do sul da Argélia. Estradas, nós de suprimento e infraestrutura de comunicações ligarão o deserto ao norte."
 ALG_develop_mzab: "Energizar o Vale do Mzab"
 ALG_develop_mzab_desc: "A região do Mzab tem um espírito resiliente e necessidades energéticas crescentes. Construir novas usinas de energia fornecerá eletricidade e empregos à população local."
 ALG_develop_granderg: "Explorar os Recursos do Grande Erg"
 ALG_develop_granderg_desc: "O Grande Erg Ocidental pode parecer vazio, mas sua riqueza subterrânea conta outra história. Desenvolver locais de extração de petróleo aqui fortalecerá a posição da Argélia como produtora de energia."
 ALG_FIS.1.t: "O Retorno dos Ulemás"
 ALG_FIS.1.d: "Dentro da Frente Islâmica de Salvação, surgiu um intenso debate sobre o rumo do nosso movimento. Os estudiosos wahhabitas, inspirados em interpretações sauditas rigorosas, exigem uma purificação completa do islã e da política argelinos daquilo que veem como inovações corruptas. Enquanto isso, os ulemás tradicionais da Argélia defendem um retorno à orientação espiritual e à reforma nacional dentro de um marco islâmico mais tolerante.\n\nNossa escolha definirá a alma do movimento."
 ALG_FIS.1.a: "Seguir os ulemás wahhabitas. Purificar e fortalecer a fé"
 ALG_FIS.1.b: "Apoiar os ulemás tradicionais. Reformar e guiar a nação"
 ALG_FIS.2.t: "O Futuro da Frente Islâmica de Salvação"
 ALG_FIS.2.d: "Em 1991, após as manifestações em massa lideradas pela Frente Islâmica de Salvação (FIS), as autoridades argelinas reagiram com força, marcando um dos pontos de virada mais sangrentos da história moderna da nação. O fundador do movimento, Abbasi Madani, foi condenado a quinze anos de prisão após os eventos de junho, nos quais o exército e a polícia dispersaram violentamente milhares de apoiadores da FIS. O general Khaled Nezzar ordenou a prisão de Madani e impôs um Estado de Emergência com o objetivo de desmantelar o partido e suprimir a influência islamista. A repressão levou ao caos, a baixas civis e ao fim de qualquer esperança de reforma pacífica, uma faísca que acendeu a devastadora Guerra Civil Argelina, mais tarde conhecida como a Década Negra. Com Abbasi Madani preso e a liderança da FIS dispersa, novas figuras surgiram dentro do movimento. Agora, enquanto nossa influência ressurge silenciosamente, a pergunta permanece: quem nos conduzirá por esta era de sangue e sacrifício rumo a uma nova visão para a Argélia?"
 ALG_FIS.2.a: "Nomear o cofundador e voz do povo. Ali Belhadj"
 ALG_FIS.2.b: "Abraçar o caminho da luta. Abdelhak Layada, fundador do GIA"
 ALG_ps_victory: "Vitória da Frente Islâmica de Salvação"
 ALG_ps_victory_desc: "A Frente Islâmica de Salvação triunfou. A Argélia está numa encruzilhada, entre a fé e a ordem, entre a mesquita e o quartel. Agora devemos consolidar este novo amanhecer do poder."
 ALG_consolidate_power: "Consolidar a Nova Ordem"
 ALG_consolidate_power_desc: "O poder deve ser assegurado em todos os níveis da sociedade. O partido, os ulemás e os grupos armados devem agora servir a um único propósito: a preservação do nosso governo."
 ALG_national_reconstruction: "Reconstrução Nacional"
 ALG_national_reconstruction_desc: "Nossa nação devastada pela guerra deve ser reconstruída a partir das ruínas. A reconstrução exigirá tanto fé quanto pragmatismo, enquanto restauramos a indústria e a confiança pública."
 ALG_religious_reconciliation: "Reconciliação Religiosa"
 ALG_religious_reconciliation_desc: "As divisões entre os estudiosos islâmicos da Argélia ameaçam nossa unidade. Devemos reconciliar nossas diferenças e criar uma base religiosa unificada para o novo Estado."
 ALG_crackdown_purges: "Repressões e Expurgos"
 ALG_crackdown_purges_desc: "Para manter o poder, devemos eliminar a oposição. Os remanescentes do antigo regime, os oficiais seculares e as facções dissidentes devem ser expurgados."
 ALG_unify_parties: "Unificar os Movimentos Islâmicos"
 ALG_unify_parties_desc: "Os diversos grupos islamistas que apoiaram nossa ascensão devem agora ser reunidos sob uma só bandeira. A unidade da Umma começa em casa."
 ALG_infrastructure_crash: "Restauração da Infraestrutura"
 ALG_infrastructure_crash_desc: "A guerra civil deixou nossa infraestrutura em frangalhos. Lançaremos programas emergenciais para restaurar estradas, pontes e serviços públicos."
 ALG_industry_investment: "Investimentos Industriais"
 ALG_industry_investment_desc: "Para sustentar a recuperação a longo prazo, devemos investir na indústria nacional e apoiar empreendedores locais guiados por princípios econômicos islâmicos."
 ALG_madrasa_reforms: "Reformas das Madrassas"
 ALG_madrasa_reforms_desc: "A educação deve se alinhar tanto às necessidades modernas quanto aos valores religiosos. Reformar nossas madrassas garantirá uma nova geração de estudiosos e engenheiros fundamentados na fé."
 ALG_community_outreach: "Programas de Aproximação Comunitária"
 ALG_community_outreach_desc: "Fortaleceremos nossa ligação com as comunidades locais por meio de iniciativas sociais, promovendo a unidade e a solidariedade sob os valores islâmicos."
 ALG_internal_security: "Aparato de Segurança Interna"
 ALG_internal_security_desc: "Devemos estabelecer uma rede leal de segurança interna para reprimir a agitação e proteger a revolução por dentro."
 ALG_intelligence_network: "Departamento de Inteligência Islâmico"
 ALG_intelligence_network_desc: "Um serviço de inteligência eficaz nos permitirá antecipar ameaças e neutralizar conspirações antes que criem raízes."
 ALG_transport_upgrade: "Modernização do Transporte"
 ALG_transport_upgrade_desc: "Sistemas de transporte modernos acelerarão o comércio, melhorarão a mobilidade e ligarão as regiões da Argélia mais estreitamente do que nunca."
 ALG_energy_program: "Programa Nacional de Energia"
 ALG_energy_program_desc: "Desenvolver fontes de energia renováveis e convencionais fornecerá a espinha dorsal da nova economia da Argélia."
 ALG_scholastic_centers: "Centros de Pesquisa Acadêmica"
 ALG_scholastic_centers_desc: "Nossos estudiosos e cientistas trabalharão lado a lado para avançar tanto o conhecimento islâmico quanto a ciência moderna em prol do progresso nacional."
 ALG_social_welfare: "Expansão do Bem-Estar Social"
 ALG_social_welfare_desc: "Cuidaremos dos pobres, das viúvas e dos desabrigados, garantindo que todo argelino se beneficie das bênçãos de nossa governança guiada pela fé."
 ALG_military_rebuild: "Reconstruir o Exército da Fé"
 ALG_military_rebuild_desc: "O exército deve ser reconstruído e purificado da corrupção. Um exército disciplinado defenderá a revolução e a nação."
 ALG_garrison_restructure: "Reestruturação das Guarnições"
 ALG_garrison_restructure_desc: "Devemos reorganizar nossas guarnições para garantir lealdade, eficiência e prontidão contra ameaças externas ou internas."
 ALG_factory_output: "Expansão da Produção Industrial"
 ALG_factory_output_desc: "Nossos investimentos estão dando frutos. As fábricas agora funcionarão em plena capacidade para impulsionar o crescimento econômico."
 ALG_oil_and_minerals: "Desenvolvimento de Petróleo e Minerais"
 ALG_oil_and_minerals_desc: "Os abundantes recursos naturais da Argélia são uma dádiva divina. Vamos aproveitá-los com responsabilidade para garantir a independência energética."
 ALG_religious_council: "Estabelecer o Conselho Religioso"
 ALG_religious_council_desc: "Um conselho supremo de ulemás guiará o rumo moral e espiritual da nação, garantindo que toda lei esteja em conformidade com a Sharia."
 ALG_national_cohesion: "Coesão Nacional"
 ALG_national_cohesion_desc: "Por meio do bem-estar e da fé, curaremos as divisões da guerra e forjaremos uma nova identidade argelina unida."
 ALG_border_defences: "Reforçar as Fronteiras"
 ALG_border_defences_desc: "Nossas fronteiras devem ser fortificadas contra infiltração e contrabando. Os inimigos da revolução estão além e dentro delas."
 ALG_strategic_reserves: "Programa de Reservas Estratégicas"
 ALG_strategic_reserves_desc: "Estocaremos suprimentos e ampliaremos nossas reservas para garantir resistência em tempos de guerra ou instabilidade econômica."
 ALG_heavy_industry: "Desenvolver a Indústria Pesada"
 ALG_heavy_industry_desc: "Levaremos nossa base industrial além dos bens de consumo, com foco em maquinário pesado, aço e produção de armas."
 ALG_international_trade: "Expandir o Comércio Internacional"
 ALG_international_trade_desc: "Comerciando com as nações amigas do mundo islâmico, a Argélia pode se tornar um polo de comércio movido pela fé."
 ALG_cultural_influence: "Iniciativa de Influência Cultural"
 ALG_cultural_influence_desc: "Exportaremos nossa cultura, nossa fé e nosso exemplo, espalhando o modelo argelino de renascimento islâmico."
 ALG_welfare_programs: "Programas de Bem-Estar"
 ALG_welfare_programs_desc: "Iniciativas abrangentes de bem-estar fortalecerão nossa legitimidade e protegerão os vulneráveis."
 ALG_army_of_salvation: "Exército da Salvação"
 ALG_army_of_salvation_desc: "O Exército da Salvação será o escudo do Islã e a espada da Argélia: disciplinado, fiel e inflexível."
 ALG_nation_energy_independence: "Independência Energética Nacional"
 ALG_nation_energy_independence_desc: "Com nossa energia totalmente sob controle nacional, nos libertaremos da dependência estrangeira."
 ALG_international_outreach: "Aproximação Islâmica Internacional"
 ALG_international_outreach_desc: "Estenderemos a mão ao mundo islâmico, construindo pontes com movimentos e nações que compartilham nossa visão."
 ALG_regional_leadership: "Liderança Regional"
 ALG_regional_leadership_desc: "A Argélia se afirmará como líder política, religiosa e econômica no Norte da África e além."
 ALG_technological_renaissance: "Renascimento Tecnológico"
 ALG_technological_renaissance_desc: "Fé e ciência não são inimigas. Lideraremos uma nova era de avanço tecnológico guiada pela ética islâmica."
 ALG_islamic_coalition: "Formar a Coalizão Islâmica"
 ALG_islamic_coalition_desc: "A unidade da Umma deve ser restaurada pela cooperação. A Argélia liderará uma coalizão de nações islâmicas rumo à prosperidade mútua."
 ALG_grand_strategy: "A Grande Estratégia"
 ALG_grand_strategy_desc: "Nossa nação agora está forte, militar, econômica e espiritualmente. É hora de traçar uma visão de longo prazo para a nossa civilização."
 ALG_final_salvation: "Salvação Final"
 ALG_final_salvation_desc: "O passo final de nossa jornada: criar uma sociedade totalmente guiada pela lei divina e pela força moral."
 FIS_rust_belt_rejuvenation: "Rejuvenescimento do Cinturão Industrial Decadente"
 FIS_rule_to_perfection: "Governar até a Perfeição"
 FIS_new_islamic_architecture: "Nova Arquitetura Islâmica"
 FIS_prioritize_military_industries: "Priorizar as Indústrias Militares"
 FIS_industrialize_the_umma: "Industrializar a Umma"
 ALG_fis_win: "Vitória da Frente Islâmica de Salvação"
 ALG_fis_win_desc: "Por meio da perseverança, da unidade e da orientação divina, a Frente Islâmica de Salvação triunfou sobre seus adversários. O caminho adiante é de governança espiritual e renovação. Um novo capítulo começa para a Argélia, definido pela fé, pela justiça e pela vontade de Alá."
 ALG_fis_win_tt: "§YDesbloqueia a Árvore de Focos da Frente Islâmica de Salvação (FIS)§!"
 alg_politics_news.1.t: "Abdallah Djaballah Funda a FJD"
 alg_politics_news.1.d: "Abdallah Djaballah, ex-líder do Movimento pela Reforma Nacional (Islah) e fundador do Ennahda, anunciou a criação de um novo partido político, a Front pour la Justice et le Développement (FJD). Inspirando-se no Partido da Justiça e Desenvolvimento (AKP) da Turquia, a FJD busca fundir princípios islâmicos com moderação política e desenvolvimento nacional. O movimento pretende renovar a confiança pública na política islamista enfatizando a justiça, a reforma e a governança ética na Argélia pós-guerra civil."
 alg_politics_news.1.a: "Um novo movimento islamista entra no cenário político argelino."
 algerian.1.t: "Pedido Argelino de Investimento em Infraestrutura"
 algerian.1.d: "O governo argelino nos procurou com uma proposta para financiar a construção de estradas da fazenda ao mercado e de infraestrutura rural. Esse investimento melhoraria a distribuição agrícola e a capacidade industrial na Argélia, ao mesmo tempo em que nos permitiria ampliar nossa influência política e econômica. Contudo, a iniciativa exigiria uma contribuição financeira do nosso tesouro."
 algerian.1.a: "Financiar o Projeto de Infraestrutura"
 algerian.1.b: "Recusar o Pedido"
 algerian.4.t: "Cooperação em Infraestrutura Aprovada"
 algerian.4.d: "A Tunísia concordou em apoiar nossa iniciativa de infraestrutura da fazenda ao mercado. O investimento fortalecerá nossa economia rural e capacidade industrial, além de melhorar as relações bilaterais."
 algerian.4.a: "Um passo à frente para nossa economia"
 algerian.5.t: "Financiamento de Infraestrutura Rejeitado"
 algerian.5.d: "A Tunísia recusou financiar nossa proposta de iniciativa de infraestrutura. Sem apoio estrangeiro, o desenvolvimento das estradas da fazenda ao mercado e de projetos relacionados será adiado."
 algerian.5.a: "Nos viraremos sozinhos"
 algeria_news.30.t: "A Revolta da Primavera Negra"
 algeria_news.30.d: "Após anos de agitação na região da Cabília, você deve decidir como responder às crescentes demandas da população berbere."
 algeria_news.30.a: "Conceder plena independência aos cabilas"
 algeria_news.30.b: "Conceder autonomia aos cabilas"
 algeria_news.30.c: "Reprimir a revolta"
 algeria_news.30_a_tt: "Escolher este caminho criará um estado cabila independente. A estabilidade aumenta, ganha-se poder político."
 algeria_news.30_b_tt: "Escolher a autonomia concede aos cabilas um autogoverno limitado (Barbacha). A estabilidade aumenta moderadamente e ganha-se poder político."
 algeria_news.30_c_tt: "Reprimir os cabilas diminuirá a estabilidade e o apoio à guerra, mas você ganha algum poder político."
 AlgeriaFocusEvents.43.t: "Convite para o Conselho dos Mundos Islâmicos"
 AlgeriaFocusEvents.43.d: "A liderança de [Root.GetName] recebeu um convite formal para ingressar no Conselho dos Mundos Islâmicos. A adesão fortaleceria a cooperação econômica entre as nações islâmicas, abriria novas oportunidades comerciais e reforçaria nosso alinhamento político compartilhado. Contudo, aderir pode nos afastar de blocos econômicos não islâmicos."
 AlgeriaFocusEvents.43.a: "Ingressar no Conselho"
 AlgeriaFocusEvents.43.b: "Recusar o Convite"
 AlgeriaFocusEvents.41.t: "Convite para o Conselho dos Mundos Islâmicos"
 AlgeriaFocusEvents.41.d: "A Argélia nos convidou formalmente a ingressar no Conselho dos Mundos Islâmicos. A proposta enfatiza a cooperação econômica, a coordenação política e o fortalecimento dos laços entre as nações islâmicas. Aceitar poderia melhorar nossa posição regional, enquanto a recusa pode estremecer as relações."
 AlgeriaFocusEvents.41.a: "Esta é uma boa ideia"
 AlgeriaFocusEvents.41.b: "Não temos interesse"
 AlgeriaFocusEvents.411.t: "O Iraque Recusa o Convite"
 AlgeriaFocusEvents.411.d: "O governo iraquiano recusou educadamente nosso convite para ingressar no Conselho dos Mundos Islâmicos, citando considerações estratégicas e prioridades nacionais."
 AlgeriaFocusEvents.411.a: "Lamentável, mas anotado"
 AlgeriaFocusEvents.42.t: "Convite para o Conselho dos Mundos Islâmicos"
 AlgeriaFocusEvents.42.d: "Recebemos uma resposta oficial sobre nossa iniciativa de expandir o Conselho dos Mundos Islâmicos. A nação convidada está avaliando se deve se alinhar econômica e politicamente ao CMI."
 AlgeriaFocusEvents.42.a: "Dar-lhes boas-vindas ao Conselho"
 AlgeriaFocusEvents.42.b: "Eles recusaram"
 AlgeriaFocusEvents.421.t: "Convite Rejeitado"
 AlgeriaFocusEvents.421.d: "O país convidado recusou participar do Conselho dos Mundos Islâmicos. Nossos esforços diplomáticos precisarão ser redirecionados para outro lugar."
 AlgeriaFocusEvents.421.a: "Muito bem"
 AlgeriaFocusEvents.81.t: "Convite para a Aliança do CMI"
 AlgeriaFocusEvents.81.desc: "Recebemos um convite para ingressar na aliança do Conselho dos Mundos Islâmicos. A proposta promete maior cooperação e apoio mútuo, embora possa exigir concessões em troca."
 AlgeriaFocusEvents.81.a: "Somente com garantias em troca"
 AlgeriaFocusEvents.81.b: "De jeito nenhum"
 ALG_power_struggle_resistance_dominant: "§RO povo está em desafio aberto ao Regime§!"
 ALG_power_struggle_army_dominant: "§BOs militares controlam firmemente a situação§!"
 ALG_power_struggle_resistance_rising: "§YA pressão popular aumenta contra o Establishment§!"
 ALG_power_struggle_army_rising: "§YOs militares reafirmam seu domínio sobre o Poder§!"
 ALG_power_struggle_stable: "§WUm frágil equilíbrio se mantém por ora§!"
 ALG_west_alignment_tt: "Formalizar a parceria estratégica com os Estados Unidos e aprofundar os laços com a OTAN e a UE. Isso concede acesso a tecnologia e investimento ocidentais, mas pode estremecer as relações com a China e a Rússia."
 ALG_china_alignment_tt: "Aprofundar a cooperação com a China sob a Iniciativa Cinturão e Rota. Espere grandes investimentos em infraestrutura e crescimento comercial, mas as potências ocidentais ficarão desconfiadas."
 alg_crackdown.1.t: "Protestos Eclodem em Argel"
 alg_crackdown.1.d: "A prisão de figuras da oposição provocou manifestações de rua. Os manifestantes exigem reforma política e o fim da repressão."
 alg_crackdown.1.a: "Esmagar os protestos."
 alg_crackdown.1.b: "Libertar alguns detidos."
 alg_crackdown.2.t: "Greves e Manifestações em Todo o País"
 alg_crackdown.2.d: "A proibição dos partidos de oposição desencadeou um movimento de massas que lembra os protestos do Hirak. O país está paralisado."
 alg_crackdown.2.a: "Mobilizar o exército."
 alg_crackdown.2.b: "Abrir o diálogo e revogar a proibição."
 democratic_reforms: "Processo de Reforma Democrática"
 ALG_healthcare_success_tt: "Nossas reformas da saúde melhorarão a saúde pública e reduzirão as queixas."
 ALG_healthcare_failure_tt: "A falha em realizar a reforma da saúde aprofundará a raiva pública e fortalecerá a posição política dos militares."
 ALG_education_success_tt: "A reforma educacional modernizará nossa força de trabalho e reduzirá o descontentamento."
 ALG_education_failure_tt: "A crise educacional continua. A frustração pública aumenta."
 ALG_unemployment_success_tt: "Programas de geração de empregos reduzirão o desemprego e estabilizarão o país."
 ALG_unemployment_failure_tt: "A falha em enfrentar o desemprego desencadeará greves e agitação."
 ALG_tamazgha.1.t: "Convite de Tamazgha"
 ALG_tamazgha.1.d: "O governo de [FROM.GetName], agora rebatizado como 'Tamazgha', nos procurou com uma proposta para formar uma nova aliança regional baseada na herança amazigue compartilhada e na cooperação cultural. Alegam que essa confederação proporcionará desenvolvimento econômico mútuo, segurança e uma rejeição de estruturas pan-arabistas ultrapassadas, como a Liga Árabe.\n\nEnquanto alguns em nosso governo veem isso como uma oportunidade histórica, outros questionam as intenções e os objetivos de longo prazo de Tamazgha."
 ALG_tamazgha.1.a: "Ingressaremos na Confederação de Tamazgha."
 ALG_tamazgha.1.b: "Esta não é a nossa luta."
 ALG_election_time_idea: "Preparando-se para a Próxima Eleição"
 ALG_casablanca_decisions: "Iniciativa de Casablanca"
 ALG_casablanca_decisions_desc: "Opções diplomáticas para pressionar o Marrocos sobre o Saara Ocidental por meio da União Africana ou de canais internacionais."
 ALG_casablanca_mission_tt: "Iniciar a missão da Iniciativa de Casablanca. Exige que você escolha primeiro uma abordagem. A missão dura 180 dias e produz um resultado baixo/médio/alto."
 ALG_casablanca_mission_desc: "Iniciar o esforço diplomático com prazo limitado. O resultado determina se a pressão da UA pode eliminar as reivindicações do Marrocos ou (com grande sucesso) remover núcleos."
 ALG_casablanca_approach_tt: "Escolha uma abordagem estratégica para a Iniciativa de Casablanca. Somente uma abordagem pode ser escolhida; depois, inicie o bloco da missão para executar a campanha."
 ALG_casablanca_approach_great_powers: "Cortejar as Grandes Potências"
 ALG_casablanca_approach_great_powers_desc: "Gastar poder político cortejando as grandes potências (EUA/Espanha/Rússia). Maior chance de produzir pressão decisiva na UA, mas é custoso e politicamente arriscado."
 ALG_casablanca_approach_regional: "Apenas Foco Regional"
 ALG_casablanca_approach_regional_desc: "Contar com parceiros regionais e evitar a influência das grandes potências. Mais barato e menos arriscado, mas com menor probabilidade de resultados decisivos."
 ALG_casablanca_approach_mixed: "Estratégia Mista"
 ALG_casablanca_approach_mixed_desc: "Combinar pressão regional e internacional. Custo e chances equilibrados."
 ALG_morocco.2.t: "Pressão da UA/ONU sobre o Marrocos"
 ALG_morocco.2.d: "Após a campanha diplomática da Argélia na UA e na ONU, o Marrocos enfrenta pressão internacional a respeito do Saara Ocidental. O reino cederá às exigências ou resistirá e arriscará sanções?"
 ALG_morocco.2.a: "Ceder sob pressão"
 ALG_morocco.2.b: "Resistir à pressão, arriscar sanções"
 Algeria_events.5.t: "Campanha Anticaça Ilegal Bem-Sucedida"
 Algeria_events.5.desc: "Graças aos nossos esforços coordenados, centenas de animais ameaçados foram protegidos nos últimos meses. Isso não só reduziu a caça ilegal, como também ajudou a preservar frágeis ecossistemas desérticos, desacelerando os efeitos da desertificação nas regiões afetadas."
 Algeria_events.5.a: "Excelente"
 Algeria_events.6.t: "Campanha Anticaça Ilegal Malsucedida"
 Algeria_events.6.desc: "Apesar de nossas tentativas de proteger a vida selvagem, os caçadores ilegais continuam suas atividades como de costume. O ecossistema do deserto continua ameaçado, e nossa campanha teve pouco efeito em conter a desertificação ou a caça ilegal."
 Algeria_events.6.a: "Todo esse esforço desperdiçado!"
 ALG_ethnic_arab_display: "Árabes: [?ALG_ethnic_arab]%"
 ALG_ethnic_kabyle_display: "Cabilas: [?ALG_ethnic_kabyle]%"
 ALG_kabyle_content: "Cooperação Cabila"
 ALG_kabyle_content_desc: "O povo cabila, com seus tradicionalmente altos níveis de escolaridade, contribui com entusiasmo para o desenvolvimento nacional e a pesquisa."
 ALG_kabyle_discontent: "Movimento de Autonomia Cabila"
 ALG_kabyle_discontent_desc: "Ativistas cabilas organizam protestos exigindo o reconhecimento do tamazight e maior autonomia regional. A sombra da Primavera Negra paira no ar."
 ALG_kabyle_unrest: "Crise da Cabília"
 ALG_kabyle_unrest_desc: "A região cabila está em revolta aberta. Protestos, greves e desobediência civil paralisam a região. É necessária uma ação urgente."
 ALG_black_spring_happened: "A Primavera Negra Ocorreu"
 ALG_has_conducted_census: "Realizou o Censo Nacional"
 ALG_ethnic_system_active: "Assuntos Étnicos Estabelecidos"
 ALG_can_enact_ethnic_policy: "Pode Promulgar Nova Política Étnica"
 algeria_power_balance: "Disputa Política Argelina"
 algeria_old_guard: "Le Pouvoir (Velha Guarda)"
 algeria_reformists: "Movimento Hirak (Reformistas)"
 algeria_compromise_range: "Compromisso Frágil"
 algeria_compromise_range_desc: "Nenhum dos lados domina. Um impasse incômodo persiste enquanto ambas as facções manobram em busca de vantagem."
 old_guard_leaning: "Influência da Velha Guarda"
 old_guard_leaning_desc: "O establishment militar começa a reafirmar seu domínio tradicional."
 old_guard_partial_control: "Consolidação da Velha Guarda"
 old_guard_partial_control_desc: "Le Pouvoir aperta o cerco. As vozes reformistas são marginalizadas."
 old_guard_strong_control: "Deriva Autoritária"
 old_guard_strong_control_desc: "O aparato de segurança domina a vida política. As instituições democráticas se corroem."
 old_guard_full_control: "Domínio Militar"
 old_guard_full_control_desc: "Le Pouvoir controla a Argélia com mão de ferro. As liberdades civis são severamente restringidas."
 reformists_leaning: "Agitação Reformista"
 reformists_leaning_desc: "A sociedade civil se torna mais ousada. O espírito do Hirak ressurge."
 reformists_gaining_ground: "Impulso Reformista"
 reformists_gaining_ground_desc: "O movimento de reforma ganha força. A velha guarda luta para manter o controle."
 reformists_strong_momentum: "Onda Democrática"
 reformists_strong_momentum_desc: "Os reformistas dominam o discurso público. Uma mudança real parece possível."
 reformists_victory: "Transição Democrática"
 reformists_victory_desc: "A Argélia abraça o governo civil e o pluralismo. O domínio de Le Pouvoir foi quebrado."
 ALG_political_struggle: "Disputa Política Argelina"
 ALG_political_struggle_desc: "A batalha entre a velha guarda e os reformistas moldará o futuro da Argélia.\nEquilíbrio atual: [ALG_power_struggle_state]\nControle militar: [ALG_army_grip_text]\nDescontentamento público: [ALG_grievance_text]"
 ALG_power_struggle_state: "Situação Política"
 ALG_boost_reformists_tt: "Direcionar recursos a políticos reformistas e grupos da sociedade civil.\nDesloca o equilíbrio em direção aos reformistas em §G+0.15§!."
 ALG_boost_old_guard_tt: "Reforçar o apoio entre os veteranos militares e o establishment de segurança.\nDesloca o equilíbrio em direção à velha guarda em §R-0.15§!."
 ALG_rally_students_tt: "Mobilizar movimentos estudantis e ativistas jovens em favor da reforma.\nDesloca o equilíbrio em direção aos reformistas em §G+0.08§!."
 ALG_mobilize_veterans_tt: "Reunir veteranos da guerra de independência e oficiais aposentados.\nDesloca o equilíbrio em direção à velha guarda em §R-0.08§!."
 ALG_bribe_elites_tt: "Usar o clientelismo para garantir a lealdade das elites.\nDesloca o equilíbrio em direção à velha guarda em §R-0.05§!.\nCusta §R30§! do tesouro. Risco de alimentar a corrupção."
 ALG_compromise_tt: "Intermediar um acordo de divisão de poder entre reformistas e a velha guarda.\nMove o equilíbrio em direção ao centro em §W±0.08§!."
 ALG_media_campaign_reform_tt: "Lançar uma campanha na mídia que promova valores democráticos.\nDesloca o equilíbrio em direção aos reformistas em §G+0.05§!."
 ALG_security_crackdown_tt: "Autorizar as forças de segurança a reprimir a dissidência.\nDesloca o equilíbrio em direção à velha guarda em §R-0.05§!."
 ALG_world_tension_security_tt: "A instabilidade global justifica um aparato de segurança mais forte.\nDesloca o equilíbrio em direção à velha guarda em §R-0.08§!."
 ALG_world_tension_high_security_tt: "Graves tensões globais exigem medidas de segurança extraordinárias.\nDesloca o equilíbrio em direção à velha guarda em §R-0.12§!."
 ALG_crackdown_momentum_tt: "Nossa política de repressão fortalece a posição da velha guarda.\nDesloca o equilíbrio em direção à velha guarda em §R-0.10§!."
 ALG_reconciliation_momentum_tt: "Nossa abordagem de reconciliação fortalece as vozes reformistas.\nDesloca o equilíbrio em direção aos reformistas em §G+0.10§!."
 ALG_oil_patronage_tt: "Usar as receitas do petróleo para financiar redes de clientelismo.\nDesloca o equilíbrio em direção à velha guarda em §R-0.06§!.\nCusta §R25§! do tesouro, mas aumenta a estabilidade."
 ALG_economic_reforms_tt: "Implementar medidas de liberalização econômica e transparência.\nDesloca o equilíbrio em direção aos reformistas em §G+0.08§!."
 ALG_elite_patronage: "Redes de Clientelismo das Elites"
 ALG_elite_patronage_desc: "Estamos comprando estabilidade por meio do clientelismo, mas isso aprofunda a corrupção e drena recursos."
 alg_politics.10.t: "As Negociações de Compromisso"
 alg_politics.10.d: "Representantes de ambas as facções se reuniram em segredo. Um compromisso foi alcançado - mas ambos os lados o honrarão?"
 alg_politics.10.a: "Aceitar o acordo"
 alg_politics.10.b: "Rejeitar e continuar a luta"
 alg_politics.20.t: "Reformistas Tomam o Poder"
 alg_politics.20.d: "O movimento reformista atingiu a massa crítica. A velha guarda enfrenta uma escolha: dar um passo atrás ou lutar."
 alg_politics.20.a: "Aceitar a transição democrática"
 alg_politics.20.b: "Os militares não se renderão"
 alg_politics.21.t: "Golpe Militar Iminente"
 alg_politics.21.d: "Os generais consolidaram o poder e estão agindo para afastar os reformistas civis."
 alg_politics.21.a: "Aceitar a autoridade militar"
 alg_politics.21.b: "Defender o movimento de reforma"
 alg_politics.22.t: "Sombras sobre Argel"
 alg_politics.22.d: "O establishment de segurança fica mais ousado. A Argélia caminha para o autoritarismo. Como responderemos?"
 alg_politics.22.a: "A segurança deve vir primeiro"
 alg_politics.22.b: "Aliviar as tensões antes que seja tarde demais"
 alg_politics.23.t: "Ventos de Mudança"
 alg_politics.23.d: "O movimento de reforma se fortalece. Mas Le Pouvoir ainda comanda as forças de segurança. Como prosseguimos?"
 alg_politics.23.a: "Avançar com as reformas"
 alg_politics.23.b: "Desacelerar para evitar uma reação adversa"
 ALG_political_truce: "Trégua Política"
 ALG_political_truce_desc: "Um frágil compromisso se mantém entre os reformistas e a velha guarda."
 ALG_tamazight_integration_process: "Processo de Integração do Tamazight"
 ALG_tamazight_integration_process_desc: "O reconhecimento oficial da língua tamazight está sendo implementado em todas as instituições do Estado. Embora isso tenha em grande parte pacificado as regiões, a mudança burocrática e o ajuste da identidade nacional causam um período temporário de atrito à medida que avançamos rumo à plena coesão social."
 ALG_auto.1.t: "Escândalo na Indústria Automotiva"
 ALG_auto.1.desc: "Vieram à tona revelações sobre corrupção generalizada na indústria automobilística da Argélia. Diversas parcerias estrangeiras, incluindo Renault, BMW e Mercedes, foram implicadas em esquemas de suborno e práticas fraudulentas de importação. O público está indignado e exige providências."
 ALG_auto.1.a: "Abrir uma investigação completa"
 ALG_auto.1.b: "Abafar a história"
 ALG_auto.2.t: "Resposta ao Escândalo Automotivo"
 ALG_auto.2.desc: "Após a investigação do escândalo, devemos decidir como lidar com as importações de automóveis daqui em diante. Uma proibição total enviaria uma mensagem forte, mas prejudicaria nossa economia. Restrições parciais oferecem um meio-termo."
 ALG_auto.2.a: "Decretar a proibição total das importações"
 ALG_auto.2.b: "Implementar restrições parciais"
 ALG_auto.2.c: "Não tomar nenhuma medida sobre as importações"
 ALG_auto.3.t: "A Fiat Propõe uma Parceria"
 ALG_auto.3.desc: "A montadora italiana Fiat nos procurou com uma proposta de instalar unidades de produção na Argélia. Ela vê uma oportunidade em nosso mercado após as restrições às importações. Isso poderia revitalizar nosso setor automotivo."
 ALG_auto.3.a: "Aceitar a proposta da Fiat"
 ALG_auto.3.b: "Negociar termos melhores"
 ALG_auto.3.c: "Rejeitar a proposta"
 ALG_auto.4.t: "Recuperação do Setor Automotivo"
 ALG_auto.4.desc: "Após nossa resposta comedida ao escândalo, o setor automotivo começa a se estabilizar. Os fabricantes nacionais mostram interesse em expandir, enquanto empresas estrangeiras continuam nos procurando."
 ALG_auto.4.a: "Apoiar os fabricantes nacionais"
 ALG_auto.4.b: "Considerar as ofertas estrangeiras"
 ALG_auto.5.t: "A Fiat Aceita Nossos Termos"
 ALG_auto.5.desc: "Nossos negociadores tiveram sucesso. A Fiat concordou com termos mais favoráveis, incluindo investimento adicional e transferência de tecnologia. Esta é uma vitória significativa para a indústria argelina."
 ALG_auto.5.a: "Excelente notícia!"
 ALG_auto.6.t: "A Fiat Rejeita a Renegociação"
 ALG_auto.6.desc: "A Fiat rejeitou nossas exigências por termos melhores. Ela insiste que a oferta original é mais do que justa. Devemos decidir se aceitamos seus termos ou abandonamos o acordo por completo."
 ALG_auto.6.a: "Aceitar os termos originais"
 ALG_auto.6.b: "Abandonar o acordo"
 ALG_corruption_auto_scandal: "Escândalo de Corrupção na Indústria Automotiva"
 ALG_corruption_auto_scandal_desc: "A exposição da corrupção generalizada em nossa indústria automobilística abalou a confiança pública. Os parceiros estrangeiros estão se afastando enquanto as investigações continuam. Nossa produção industrial e nosso capital político sofreram um golpe significativo."
 ALG_corruption_auto_scandal_coverup: "Escândalo Automotivo Abafado"
 ALG_corruption_auto_scandal_coverup_desc: "Tentamos abafar as notícias do escândalo da indústria automotiva. Embora o dano imediato esteja contido, as agências de inteligência estrangeiras sabem do nosso engano e os grupos de oposição internos têm munição contra nós. A verdade ainda pode vir à tona."
 ALG_import_ban_penalty: "Proibição de Importação de Automóveis"
 ALG_import_ban_penalty_desc: "Uma proibição total à importação de automóveis foi decretada após o escândalo de corrupção. Embora envie uma mensagem forte contra a exploração estrangeira, ela perturbou severamente as cadeias de suprimento e a produção industrial. Os consumidores enfrentam escassez e preços mais altos."
 ALG_import_restrictions_light: "Restrições à Importação de Automóveis"
 ALG_import_restrictions_light_desc: "Foram implementadas restrições parciais à importação de automóveis. Essa abordagem comedida mantém algumas relações comerciais ao mesmo tempo em que responde à raiva pública com o escândalo de corrupção. O impacto econômico é administrável, mas ainda perceptível."
 ALG_4g_rollout_tt: "§GA Argélia lança a rede móvel 4G em todo o país:§!\n- Internet móvel de alta velocidade\n- Melhor conectividade para empresas\n- Expansão dos serviços digitais"
 ALG_4g_coverage_basic: "Cobertura 4G - Básica"
 ALG_4g_coverage_basic_desc: "Nossa rede 4G está operacional, mas a cobertura se limita aos principais centros urbanos. É preciso continuar investindo em infraestrutura."
 ALG_4g_coverage_moderate: "Cobertura 4G - Moderada"
 ALG_4g_coverage_moderate_desc: "A cobertura 4G agora chega à maioria das cidades e vilas. Empresas e cidadãos se beneficiam da melhor conectividade."
 ALG_4g_coverage_good: "Cobertura 4G - Boa"
 ALG_4g_coverage_good_desc: "Forte cobertura 4G na maior parte da Argélia. A economia digital floresce e a produtividade está em alta."
 ALG_4g_coverage_excellent: "Cobertura 4G - Excelente"
 ALG_4g_coverage_excellent_desc: "Cobertura 4G nacional alcançada! A Argélia agora é líder regional em conectividade móvel. A base para o desenvolvimento do 5G está lançada."
 algerian_event.51.t: "Espaçonave Argelina Pousa com Sucesso na Lua!"
 algerian_event.51.desc: "A Agência Espacial Argelina (ASAL) alcançou um marco histórico! Nosso módulo lunar concluiu com sucesso um pouso suave na superfície lunar, tornando a Argélia apenas a quinta nação da história a realizar tal feito.\n\nA descida foi transmitida ao vivo para todo o país, com milhões de argelinos assistindo maravilhados enquanto nossa espaçonave tocava o solo perto do polo sul lunar. Os cientistas do centro de controle em Argel explodiram em comemoração quando a telemetria confirmou o pouso bem-sucedido.\n\nEssa conquista coloca a Argélia ao lado da URSS, dos EUA, da China e da Índia no seleto clube de nações capazes de realizar pousos suaves na Lua. Representa o ápice de décadas de investimento em nosso programa espacial e sinaliza a emergência da Argélia como uma grande potência espacial.\n\nO mundo observa com admiração enquanto a bandeira verde e branca é fincada na Lua."
 algerian_event.51.a: "Um salto gigante para a Argélia!"
 ALG_missile_leverage: "Alavanca de Mísseis"
 ALG_missile_leverage_desc: "Nossa relação com a China apresenta a oportunidade de adquirir tecnologia avançada de mísseis. Ao usar nossos laços diplomáticos e nossa posição estratégica, podemos negociar a transferência de mísseis de cruzeiro lançados de terra e de plataformas de lançamento móveis. Isso ampliará significativamente a capacidade de dissuasão da Argélia."
 ALG_build_nuclear_reactor_tt: "§GConstruir Reator Nuclear:§!\n- Estabelecer capacidade nuclear civil\n- Reduzir a dependência de combustíveis fósseis\n- Formar cientistas e engenheiros nucleares\n- Base para a pesquisa nuclear avançada"
 ALG_election_pending: "Eleições Nacionais Pendentes"
 ALG_opposition_reforms_1: "Reformas da Oposição: Liberdade de Imprensa"
 ALG_opposition_reforms_1_desc: "O governo de oposição iniciou seu programa de reformas garantindo a liberdade de imprensa. Uma imprensa livre agora cobra responsabilidade do governo e informa o público."
 ALG_opposition_reforms_2: "Reformas da Oposição: Sistema de Justiça"
 ALG_opposition_reforms_2_desc: "Com base nas reformas da mídia, o governo de oposição reformou o Judiciário. Tribunais independentes agora garantem justiça a todos os argelinos e combatem a corrupção."
 ALG_opposition_reforms_3: "Reformas da Oposição: Educação"
 ALG_opposition_reforms_3_desc: "O programa de reformas da oposição continua com grandes investimentos em educação. Um sistema modernizado prepara a juventude argelina para os desafios que virão."
 ALG_opposition_reforms_4: "Uma Nova Era para a Argélia"
 ALG_opposition_reforms_4_desc: "O programa abrangente de reformas da oposição está concluído. A Argélia foi transformada em uma nação moderna, democrática e próspera. Mídia livre, tribunais independentes, educação de qualidade e oportunidades econômicas definem esta nova era."
 ALG_fis_movement: "Movimento de Salvação Islâmica"
 ALG_fis_movement_desc: "A FIS mobilizou o povo argelino com sua mensagem de democracia islâmica, justiça social e combate à corrupção. As mesquitas funcionam como centros comunitários, oferecendo serviços sociais que o governo negligenciou. O apoio popular cresce a cada dia."
 ALG_fln.1.t: "Escândalo de Corrupção Abala a Argélia"
 ALG_fln.1.desc: "Jornalistas investigativos descobriram uma teia de corrupção que se estende por todo o establishment político da Argélia. Registros bancários revelam milhões desviados de fundos públicos para contas particulares. Vários partidos parecem estar implicados, inclusive membros da nossa própria FLN.\n\nO escândalo veio a público e não podemos ignorá-lo. As provas são contundentes, mas a forma como respondermos pode estabilizar ou desestabilizar todo o sistema político. Devemos escolher nosso curso de ação com cuidado."
 ALG_fln.1.a: "Enterrar a história"
 ALG_cover_up_corruption_tt: "§RAbafar o Escândalo:§!\n• A corrupção aumenta significativamente\n• Pequena perda de poder político\n• Reputação da FLN levemente abalada\n• Estabilidade preservada por ora\n\n§7\"O que o povo não sabe não o machuca.\"§!"
 ALG_fln.1.b: "Culpar os partidos de oposição"
 ALG_blame_others_tt: "§YCulpar os Partidos de Oposição:§!\n• A corrupção aumenta\n• Partidos de oposição seriamente prejudicados\n• A FLN ganha algum apoio\n• Alguma estabilidade perdida\n\n§7\"Eles são os verdadeiros criminosos aqui!\"§!"
 ALG_fln.1.c: "Deixar a verdade vir à tona"
 ALG_expose_all_tt: "§GExpor Toda a Corrupção:§!\n• Todos os partidos prejudicados (inclusive a FLN)\n• Perda significativa de estabilidade\n• Alto custo em poder político\n• MAS a corrupção diminui\n• Impulso anticorrupção (bônus de 1 ano)\n\n§7\"O povo merece a verdade.\"§!"
 ALG_fln.1.e: "Lançar uma campanha anticorrupção completa"
 ALG_anti_corruption_campaign_tt: "§GLançar Campanha Anticorrupção:§!\n• Todos os partidos prejudicados (inclusive a FLN)\n• Alto custo ao tesouro (§R-15§!)\n• Grande custo em poder político (§R-100§!)\n• MAS a corrupção diminui significativamente\n• §GReformas anticorrupção permanentes§!\n• Ganho de estabilidade a longo prazo\n\n§7\"Vamos arrancar esse câncer pela raiz!\"§!"
 ALG_anti_corruption_momentum: "Impulso Anticorrupção"
 ALG_anti_corruption_momentum_desc: "A exposição da corrupção despertou a demanda pública por reformas. Embora dolorosa, essa transparência criou um impulso por mudanças positivas."
 ALG_anti_corruption_reforms: "Reformas Anticorrupção"
 ALG_anti_corruption_reforms_desc: "Medidas anticorrupção abrangentes foram implementadas em todo o governo. Contratações transparentes, auditores independentes e proteção a denunciantes estão reduzindo a corrupção e restaurando a confiança pública."
 ALG_fln.2.t: "Escândalo de Corrupção na Sonatrach"
 ALG_fln.2.desc: "Um enorme escândalo de corrupção eclodiu na Sonatrach, a estatal de petróleo da Argélia. As investigações revelam bilhões desviados por meio de contratos falsos e contas offshore. Altos executivos e parceiros estrangeiros estão implicados.\n\nO público exige respostas. Como responderemos?"
 ALG_fln.2.a: "Abafar o caso"
 ALG_fln.2.b: "Investigar a corrupção"
 ALG_fln.2.c: "Culpar a oposição"
 ALG_fln.3.t: "O Hirak Desperta"
 ALG_fln.3.desc: "Milhões de argelinos foram às ruas em um movimento de massa que exige mudança. Os protestos do Hirak uniram pessoas de todas as divisões - jovens e idosos, laicos e religiosos.\n\n\"Yetnahaw Ga3!\" (Que saiam todos!) ecoa por todas as cidades.\n\nA velha ordem treme. O povo encontrou sua voz."
 ALG_fln.3.a: "O povo falou."
 ALG_grievance_increase_5_tt: "§YDescontentamento do Povo:§! +5"
 ALG_cover_up_scandal: "Escândalo Abafado"
 ALG_cover_up_scandal_desc: "O escândalo de corrupção da Sonatrach foi enterrado, mas os rumores persistem. As agências de inteligência estrangeiras sabem do acobertamento, e a verdade ameaça ressurgir a qualquer momento."
 ALG_anti_corruption_probe: "Investigação Anticorrupção"
 ALG_anti_corruption_probe_desc: "Uma investigação minuciosa da corrupção na Sonatrach está em andamento. Embora atrapalhe o funcionamento habitual, a apuração restaura a confiança pública e expurga funcionários corruptos."
 ALG_shift_blame: "Culpa Transferida para a Oposição"
 ALG_shift_blame_desc: "O governo conseguiu redirecionar a ira pública pelo escândalo da Sonatrach para os partidos de oposição. Embora seja uma propaganda eficaz, esse desvio de atenção não faz nada para combater a corrupção subjacente."
 ALG_mass_protests: "Protestos em Massa"
 ALG_mass_protests_desc: "O movimento Hirak levou milhões às ruas de toda a Argélia. A atividade econômica é prejudicada enquanto o povo exige mudanças fundamentais. A velha ordem está estremecendo."
 ALG_FLN_chosen: "Caminho da FLN Escolhido"
 ALG_fln_opp_path: "Caminho da Oposição da FLN"
 ALG_domestic_development_focus: "Foco no Desenvolvimento Interno"
 ALG_domestic_development_focus_desc: "A Argélia optou por investir em seu próprio desenvolvimento em vez da expansão externa. Projetos de infraestrutura, desenvolvimento industrial e programas sociais estão transformando a nação em um Estado moderno e próspero."
 ALG_middle_east_expansion: "Expansão no Oriente Médio"
 ALG_middle_east_expansion_desc: "Nossos exércitos marcham rumo ao Oriente Médio. As tropas estão bem abastecidas e motivadas por visões de glória e conquista."
 ALG_de_arabisation_effect_TT: "§YPolítica de Desarabização:§!\n\n§G Renascimento da Língua Berbere§!\n  O tamazight se torna língua co-oficial\n\n§G Reconhecimento Cultural§!\n  A identidade amazigh é celebrada nacionalmente\n\n§G Reforma Educacional§!\n  A história berbere é ensinada nas escolas\n\n§RConsequências:§!\n  -Apoio dos nacionalistas árabes\n  -Relações com a Liga Árabe\n  +Estabilidade regional na Cabília"
 ALG_civil_reforms_1: "Proteção dos Direitos Civis"
 ALG_civil_reforms_1_desc: "A Argélia estabeleceu proteções básicas aos direitos civis. Os cidadãos desfrutam de maiores liberdades e a base para novas reformas está lançada."
 ALG_civil_reforms_2: "Direitos Civis e Igualdade de Gênero"
 ALG_civil_reforms_2_desc: "Com base nas reformas dos direitos civis, a Argélia avançou na igualdade de gênero. As mulheres estão entrando no mercado de trabalho em maior número, impulsionando a produtividade e o crescimento."
 ALG_civil_reforms_3a: "Reformas Civis: Imprensa Livre"
 ALG_civil_reforms_3a_desc: "O programa de reformas da Argélia agora inclui a liberdade de imprensa. A mídia independente cobra responsabilidade do governo enquanto os direitos civis e a igualdade de gênero continuam a transformar a sociedade."
 ALG_civil_reforms_3b: "Reformas Civis: Independência Judicial"
 ALG_civil_reforms_3b_desc: "O programa de reformas da Argélia agora inclui um Judiciário independente. Tribunais justos combatem a corrupção enquanto os direitos civis e a igualdade de gênero continuam a transformar a sociedade."
 ALG_civil_reforms_4: "Reformas Completas da Sociedade Civil"
 ALG_civil_reforms_4_desc: "A Argélia concluiu reformas abrangentes da sociedade civil. Direitos civis, igualdade de gênero, liberdade de imprensa, independência judicial e organizações da sociedade civil fortalecidas transformaram a Argélia em uma democracia moderna."
 ALG_gov_reforms_1: "Iniciativa de Governo Digital"
 ALG_gov_reforms_1_desc: "A Argélia começou a digitalizar os serviços governamentais. As plataformas online melhoram a prestação dos serviços públicos e reduzem a ineficiência burocrática."
 ALG_gov_reforms_2: "Reformas do Serviço Público"
 ALG_gov_reforms_2_desc: "Com base nos alicerces digitais, a Argélia reformou os serviços públicos. Os cidadãos desfrutam de serviços governamentais mais rápidos e eficientes."
 ALG_gov_reforms_3a: "Reformas Anticorrupção"
 ALG_gov_reforms_3a_desc: "A campanha anticorrupção da Argélia limpou as instituições governamentais. A transparência e a responsabilização foram restauradas."
 ALG_gov_reforms_3b: "Sistema de Governança Eletrônica"
 ALG_gov_reforms_3b_desc: "O portal de governança eletrônica da Argélia oferece aos cidadãos acesso fluido aos serviços do governo online. A eficiência burocrática melhorou drasticamente."
 ALG_gov_reforms_4: "Estado Administrativo Moderno"
 ALG_gov_reforms_4_desc: "A Argélia alcançou um governo totalmente modernizado, eficiente e transparente. Serviços digitais, medidas anticorrupção e uma burocracia enxuta definem a nova administração."
 ALG_african_union_engagement_full_tt: "§GEngajar-se com a União Africana:§!\n\n§YEfeitos em todos os Estados-membros da UA:§!\n• §G+25§! de Opinião sobre a Argélia\n• §G+2%§! de Influência Argelina\n\nA Argélia fortalece sua posição como voz de destaque nos assuntos africanos."
 ALG_mend_ties_with_rabat: "Reparar os Laços com Rabat"
 ALG_mend_ties_with_rabat_desc: "A fronteira entre a Argélia e o Marrocos está fechada desde 1994. O conflito do Saara Ocidental, a Guerra das Areias de 1963 e os alinhamentos da Guerra Fria criaram feridas profundas entre nossas nações.\n\nNo entanto, compartilhamos a mesma herança amazigh e árabe, a mesma luta contra o colonialismo e as mesmas esperanças para nossos povos. Talvez seja hora de deixar o passado para trás e construir uma nova relação com o Reino do Marrocos."
 ALG_our_east_brothers: "Nossos Irmãos do Leste"
 ALG_our_east_brothers_desc: "A Argélia e a Tunísia lutaram lado a lado contra o colonialismo francês. O solo tunisiano abrigou refugiados argelinos e combatentes da FLN durante nossa guerra de independência.\n\nEssa irmandade deve ser fortalecida. Juntas, a Argélia e a Tunísia podem formar o núcleo de um Magrebe unido e conduzir o Norte da África a um futuro próspero."
 ALG_black_spring: "A Primavera Negra"
 ALG_black_spring_desc: "Em 18 de abril de 2001, Massinissa Guermah, um jovem estudante cabila, foi morto a tiros dentro de uma brigada da gendarmaria em Beni Douala. Sua morte desencadeou os maiores protestos na Cabília desde a independência, com mais de 100 mortos pelas forças de segurança. A Primavera Negra começou."
 ALG_black_spring_tt: "§HA Primavera Negra Eclode§!\nA morte de Massinissa Guermah desencadeia protestos em massa por toda a Cabília. Mais de 100 manifestantes mortos pela gendarmaria.\n\n§YDemandas dos Cabilas:§!\n- Justiça para os mortos\n- Retirada da gendarmaria\n- Reconhecimento do tamazight\n- Fim da 'hogra' (desprezo)"
 ALG_negotiate_with_arrouch: "Negociar com os Arrouch"
 ALG_negotiate_with_arrouch_desc: "Os Arrouch (conselhos de aldeia) se organizaram em um movimento coordenado que representa as demandas cabilas. Em vez do confronto, iniciaremos o diálogo com essas estruturas tradicionais."
 ALG_negotiate_arrouch_tt: "§HO Movimento Arrouch§!\nAs assembleias de aldeia tradicionais cabilas se uniram para apresentar suas demandas. A negociação pode trazer a paz.\n\n§YPrincipais Demandas dos Arrouch:§!\n- Reconhecimento da Plataforma de El-Kseur\n- Direitos da língua tamazight\n- Desenvolvimento econômico\n- Fim da presença militar"
 ALG_recognize_tamazight_2002: "Tamazight: Língua Nacional"
 ALG_recognize_tamazight_2002_desc: "Em 8 de abril de 2002, após intensas negociações, o tamazight será reconhecido como língua nacional da Argélia - uma concessão histórica à identidade berbere."
 ALG_tamazight_national_tt: "§HTamazight Torna-se Língua Nacional§!\nUm momento histórico - o tamazight se junta ao árabe como língua nacional da Argélia.\n\n§YSignificado:§!\n- Primeiro reconhecimento da identidade berbere\n- Emenda constitucional\n- As escolas poderão ensinar tamazight\n- §GGrande vitória cabila§!"
 ALG_address_hogra: "Enfrentar a Hogra"
 ALG_address_hogra_desc: "A hogra - o desprezo e a humilhação que os cabilas sentem por parte do Estado - deve ser enfrentada. Investimento, empregos e respeito substituirão o abandono e o abuso."
 ALG_address_hogra_tt: "§HAcabar com a Hogra§!\nA 'hogra' - o desprezo sistemático dirigido aos cabilas - será enfrentada por meio de:\n\n- Investimento em infraestrutura na Cabília\n- Programas de geração de empregos\n- Fim das práticas discriminatórias\n- Respeito à dignidade cabila"
 ALG_amazigh_cultural_revival: "Renascimento Cultural Amazigh"
 ALG_amazigh_cultural_revival_desc: "O investimento em instituições culturais, museus e programas educacionais berberes preservará e celebrará a herança amazigh que antecede a chegada dos árabes."
 ALG_amazigh_revival_tt: "§HRenascimento Cultural Amazigh§!\n- Academia Amazigh estabelecida\n- Museus berberes financiados\n- Festivais culturais apoiados\n- Escrita tifinagh promovida"
 ALG_yennayer_national_holiday: "Feriado Nacional de Yennayer"
 ALG_yennayer_national_holiday_desc: "Em dezembro de 2017, o presidente Bouteflika declarou o Yennayer - o Ano Novo Amazigh - feriado nacional. O dia 12 de janeiro agora será celebrado em toda a Argélia."
 ALG_yennayer_tt: "§HYennayer Torna-se Feriado Nacional§!\nO Ano Novo Berbere (12 de janeiro) agora é um feriado oficial argelino.\n\n§YReconhecimento Histórico:§!\n- Herança pré-islâmica celebrada\n- Unidade nacional fortalecida\n- §GSatisfação dos cabilas aumentada§!"
 ALG_tamazight_official_2016: "Tamazight: Língua Oficial"
 ALG_tamazight_official_2016_desc: "A emenda constitucional de 2016 eleva o tamazight de língua 'nacional' a língua 'oficial', colocando-o em pé de igualdade com o árabe."
 ALG_tamazight_official_tt: "§HTamazight Torna-se Língua Oficial§!\n§WEmenda Constitucional de 2016:§!\n- Tamazight em igualdade com o árabe\n- Todos os documentos do governo bilíngues\n- Língua berbere em todas as escolas\n- §GGrande vitória constitucional§!"
 ALG_berber_integration_complete: "Unidos na Diversidade"
 ALG_berber_integration_complete_desc: "Por meio do diálogo, do reconhecimento e do investimento, a Argélia resolveu a questão cabila. Argelinos árabes e amazighs permanecem unidos."
 ALG_integration_complete_tt: "§HQuestão Cabila Resolvida§!\nA Argélia integrou com sucesso sua população berbere por meio de:\n- Reconhecimento da língua\n- Investimento cultural\n- Desenvolvimento econômico\n- Respeito e diálogo\n\n§GUnidade nacional alcançada!§!"
 ALG_crush_the_uprising: "Esmagar o Levante"
 ALG_crush_the_uprising_desc: "A Primavera Negra ameaça a unidade nacional. A gendarmaria restaurará a ordem e os elementos separatistas serão neutralizados."
 ALG_crush_uprising_tt: "§HCaminho da Repressão§!\nUsar a força para encerrar os protestos e manter a integridade territorial da Argélia.\n\n§YBenefícios:§!\n- Manter todo o território\n- Nenhuma concessão aos separatistas\n- Controle militar\n\n§RCustos:§!\n- Críticas internacionais\n- Profundo ressentimento cabila\n- Resistência contínua"
 ALG_gendarmerie_reinforcement: "Reforço da Gendarmaria"
 ALG_gendarmerie_reinforcement_desc: "Unidades adicionais da gendarmaria serão enviadas à Cabília para manter a ordem e evitar futuras agitações."
 ALG_gendarmerie_tt: "§HEnviar Forças de Segurança§!\n- Presença da gendarmaria aumentada\n- Protestos monitorados\n- Ativistas-chave detidos\n- Ordem mantida pela força"
 ALG_arabization_policy: "Política de Arabização"
 ALG_arabization_policy_desc: "O árabe é a língua da Argélia. Intensificar os programas de arabização na Cabília para combater a ideologia berberista separatista."
 ALG_arabization_1_tt: "§HIntensificar a Arabização§!\n- Ensino exclusivamente em árabe imposto\n- Tamazight reprimido\n- Identidade islâmica promovida\n- Ideologia berberista combatida\n\n§ROs cabilas ficarão profundamente ressentidos§!"
 ALG_ban_mak: "Proibir o MAK"
 ALG_ban_mak_desc: "Em maio de 2021, o Mouvement pour l'Autodétermination de la Kabylie (MAK), liderado por Ferhat Mehenni, será designado organização terrorista e proibido."
 ALG_ban_mak_tt: "§HMAK Designado Organização Terrorista§!\nO Movimento pela Autodeterminação da Cabília é proibido:\n- Ferhat Mehenni rotulado de terrorista\n- Apoiadores do MAK presos\n- Atividade separatista criminalizada\n\n§RCríticas internacionais esperadas§!"
 ALG_accuse_foreign_interference: "Acusar Mãos Estrangeiras"
 ALG_accuse_foreign_interference_desc: "O movimento separatista MAK não é orgânico - é financiado e apoiado por potências estrangeiras que buscam desestabilizar a Argélia. O Marrocos e outros devem ser expostos."
 ALG_foreign_interference_tt: "§HCulpar Potências Estrangeiras§!\nO MAK é acusado de ser um representante estrangeiro:\n- Marrocos acusado de financiar o MAK\n- Conspirações externas contra a Argélia\n- Unidade nacional contra os inimigos\n\n§RAs tensões diplomáticas aumentarão§!"
 ALG_mak_israel_connection: "Conexão MAK-Israel"
 ALG_mak_israel_connection_desc: "A reunião de Ferhat Mehenni com autoridades israelenses prova que o MAK é um projeto sionista para dividir o mundo árabe. A conexão deve ser exposta."
 ALG_mak_israel_tt: "§HLigação MAK-Israel Exposta§!\n- MAK rotulado de projeto sionista\n- Israel acusado de desestabilização\n- Apoio da Liga Árabe obtido\n- Sentimento antiisraelense mobilizado\n\n§YApoio interno §Gaumenta§!§!\n§RAs relações com Israel serão destruídas§!"
 ALG_kabylie_pacified: "Cabília Pacificada"
 ALG_kabylie_pacified_desc: "Por meio de operações de segurança e repressão política, a Cabília foi colocada sob controle. A ameaça separatista está contida."
 ALG_kabylie_pacified_tt: "§HCabília Sob Controle§!\n- MAK esmagado\n- Separatismo criminalizado\n- Forças de segurança no controle\n- Unidade nacional imposta\n\n§YMas o ressentimento ferve em fogo baixo.§!"
 ALG_el_kseur_platform: "Aceitar a Plataforma de El-Kseur"
 ALG_el_kseur_platform_desc: "A Plataforma de El-Kseur, redigida pelos Arrouch em 11 de junho de 2001, contém 15 demandas por justiça e direitos. Nós a aceitaremos como base para a negociação."
 ALG_el_kseur_tt: "§HAceitar a Plataforma de El-Kseur§!\nAs 15 demandas incluem:\n- Justiça para as vítimas da Primavera Negra\n- Retirada da gendarmaria\n- Status oficial do tamazight\n- Fim da hogra\n- Desenvolvimento econômico\n- Reformas democráticas\n\n§RConcessões radicais necessárias§!"
 ALG_withdraw_gendarmerie: "Retirar a Gendarmaria"
 ALG_withdraw_gendarmerie_desc: "Uma demanda central de El-Kseur - a odiada gendarmaria será retirada da Cabília e substituída pela polícia local."
 ALG_withdraw_gendarmerie_tt: "§HRetirada da Gendarmaria§!\n- As forças paramilitares deixam a Cabília\n- A polícia local assume\n- Presença militar reduzida\n- Grande demanda cabila atendida\n\n§ROs militares ficarão descontentes§!"
 ALG_trial_responsible_officers: "Julgamento dos Oficiais Responsáveis"
 ALG_trial_responsible_officers_desc: "Os oficiais responsáveis pelas mortes durante a Primavera Negra enfrentarão a justiça. Esse passo sem precedentes reconhece os crimes do Estado contra os cabilas."
 ALG_trial_officers_tt: "§HProcessar os Oficiais Responsáveis§!\n- Oficiais são julgados pelas mortes\n- Famílias das vítimas indenizadas\n- O Estado reconhece os crimes\n- Responsabilização histórica\n\n§ROs militares ficarão furiosos§!\n§GAprovação internacional aumenta§!"
 ALG_secular_berber_identity: "Identidade Berbere Laica"
 ALG_secular_berber_identity_desc: "A Cabília sempre foi historicamente mais laica que o resto da Argélia. Reconhecer a identidade berbere laica desafia a definição árabe-islâmica de nação argelina."
 ALG_secular_berber_tt: "§HReconhecer a Identidade Amazigh Laica§!\n- Herança pré-islâmica celebrada\n- Valores laicos protegidos\n- Liberdade religiosa garantida\n- Desafia a narrativa islamista\n\n§ROs islamistas se oporão a isso§!"
 ALG_mak_dialogue: "Diálogo com o MAK"
 ALG_mak_dialogue_desc: "Abrir diálogo com o movimento separatista MAK de Ferhat Mehenni. Isso corre o risco de legitimar o separatismo, mas pode ser o único caminho para a paz."
 ALG_mak_dialogue_tt: "§HAbrir Diálogo com o MAK§!\nNegociar com os separatistas:\n- Ferhat Mehenni envolvido\n- Autodeterminação em discussão\n- Autonomia em exame\n- Independência na mesa\n\n§RExtremamente controverso§!\n§RRisco de legitimar o separatismo§!"
 ALG_reject_separatism: "Rejeitar o Separatismo"
 ALG_reject_separatism_desc: "Embora respeite os direitos berberes, a integridade territorial da Argélia é inegociável. Unidade na diversidade - e não a divisão - é a resposta."
 ALG_reject_separatism_tt: "§HUnidade na Diversidade§!\n- Separatismo rejeitado\n- Direitos berberes garantidos\n- Integridade territorial mantida\n- Uma Argélia diversa, mas unida"
 ALG_kabyle_autonomy_statute: "Estatuto de Autonomia Cabila"
 ALG_kabyle_autonomy_statute_desc: "Um estatuto formal de autonomia para a Cabília - autogoverno em assuntos locais, permanecendo parte da Argélia. Um compromisso histórico."
 ALG_autonomy_statute_tt: "§HCabília Ganha Autonomia§!\n- Parlamento regional estabelecido\n- Tamazight reconhecido como oficial\n- Poderes tributários locais\n- Autonomia cultural concedida\n\n§YA Cabília continua parte da Argélia§!"
 ALG_federal_algeria: "Argélia Federal"
 ALG_federal_algeria_desc: "A Argélia se transforma em uma república federal, com a Cabília como primeira região autônoma. Outras regiões podem seguir esse modelo."
 ALG_federal_algeria_tt: "§HA Argélia Torna-se Federal§!\n- Constituição federal adotada\n- Autonomia regional concedida\n- Cabília como modelo\n- Poder descentralizado\n- Unidade por meio do federalismo"
 ALG_united_secular_algeria: "Argélia Laica e Unida"
 ALG_united_secular_algeria_desc: "Uma Argélia unida e laica que respeita todas as identidades - árabe e amazigh, muçulmana e laica. A diversidade é a nossa força."
 ALG_united_secular_tt: "§HArgélia Laica e Unida§!\n- Estado laico estabelecido\n- Todas as identidades respeitadas\n- Sem separatismo\n- Sem islamismo\n- Democracia moderna"
 ALG_release_kby_autonomous_tt: "§YLiberar a Cabília como Região Autônoma§!"
 ALG_black_spring_spirit: "Agitação da Primavera Negra"
 ALG_black_spring_spirit_desc: "A morte de Massinissa Guermah desencadeou os maiores protestos desde a independência. A Cabília arde de fúria contra o Estado."
 ALG_arrouch_negotiations: "Negociações com os Arrouch"
 ALG_arrouch_negotiations_desc: "O governo está negociando com o movimento Arrouch. Os conselhos tradicionais de aldeia agora falam pela Cabília."
 ALG_tamazight_national_language: "Tamazight Língua Nacional"
 ALG_tamazight_national_language_desc: "O tamazight foi reconhecido como língua nacional da Argélia - um grande passo rumo ao reconhecimento berbere."
 ALG_tamazight_official_language: "Tamazight Língua Oficial"
 ALG_tamazight_official_language_desc: "A constituição de 2016 fez do tamazight uma língua oficial, em pé de igualdade com o árabe. Uma conquista histórica para os direitos berberes."
 ALG_addressing_kabyle_grievances: "Atendendo às Queixas dos Cabilas"
 ALG_addressing_kabyle_grievances_desc: "O governo está investindo na Cabília e enfrentando anos de abandono e de 'hogra' (desprezo)."
 ALG_amazigh_cultural_institutions: "Instituições Culturais Amazigh"
 ALG_amazigh_cultural_institutions_desc: "O investimento em instituições culturais berberes está preservando e celebrando a herança amazigh da Argélia."
 ALG_united_algeria: "Argélia Unida"
 ALG_united_algeria_desc: "Por meio do diálogo e do respeito, a Argélia uniu suas populações árabe e amazigh. A questão cabila está resolvida."
 ALG_kabyle_crackdown: "Repressão aos Cabilas"
 ALG_kabyle_crackdown_desc: "As forças de segurança estão reprimindo os protestos cabilas. A ordem está sendo restaurada pela força."
 ALG_gendarmerie_deployed: "Gendarmaria Mobilizada"
 ALG_gendarmerie_deployed_desc: "Unidades da gendarmaria estão posicionadas por toda a Cabília, mantendo a ordem e monitorando a dissidência."
 ALG_forced_arabization: "Arabização Forçada"
 ALG_forced_arabization_desc: "As políticas de arabização estão sendo intensificadas na Cabília. A identidade berbere está sendo suprimida em favor do nacionalismo árabe-islâmico."
 ALG_mak_banned: "MAK Proibido"
 ALG_mak_banned_desc: "O Movimento pela Autodeterminação da Cabília foi designado organização terrorista. O separatismo agora é crime."
 ALG_foreign_hands_narrative: "Narrativa das Mãos Estrangeiras"
 ALG_foreign_hands_narrative_desc: "O governo culpa potências estrangeiras - especialmente o Marrocos e Israel - pelo separatismo cabila. Inimigos externos unem a nação."
 ALG_mak_terrorist_designation: "Designação do MAK como Terrorista"
 ALG_mak_terrorist_designation_desc: "O MAK e Ferhat Mehenni são designados terroristas com ligações com Israel. A ameaça separatista é retratada como uma conspiração sionista."
 ALG_kabylie_under_control: "Cabília Sob Controle"
 ALG_kabylie_under_control_desc: "Pela força e pela repressão política, a Cabília está sob controle do governo. Mas o ressentimento ferve sob a superfície."
 ALG_el_kseur_negotiations: "Negociações de El-Kseur"
 ALG_el_kseur_negotiations_desc: "O governo aceitou a Plataforma de El-Kseur como base para as negociações com a Cabília."
 ALG_secular_amazigh_movement: "Movimento Amazigh Laico"
 ALG_secular_amazigh_movement_desc: "Uma identidade berbere laica está sendo reconhecida, desafiando a definição árabe-islâmica de nação argelina."
 ALG_mak_negotiations: "Negociações com o MAK"
 ALG_mak_negotiations_desc: "O governo mantém um diálogo sem precedentes com o movimento separatista MAK. O futuro da Cabília está em jogo."
 ALG_unity_within_diversity: "Unidade na Diversidade"
 ALG_unity_within_diversity_desc: "A Argélia abraça sua diversidade - árabe e amazigh, muçulmana e laica - mantendo a unidade nacional. O separatismo é rejeitado."
 ALG_federal_republic: "República Federal"
 ALG_federal_republic_desc: "A Argélia tornou-se uma república federal, com a Cabília como primeira região autônoma. O poder é descentralizado enquanto a unidade é mantida."
 ALG_secular_united_nation: "Nação Laica e Unida"
 ALG_secular_united_nation_desc: "A Argélia emergiu como uma nação unida e laica que respeita todas as identidades e rejeita tanto o separatismo quanto o extremismo religioso."
 KBY_autonomous_kabylie: "Cabília Autônoma"
 KBY_autonomous_kabylie_desc: "A Cabília alcançou a autonomia dentro da Argélia. Autogoverno em assuntos locais, permanecendo parte da nação."
 KBY_federal_partner: "Parceira Federal"
 KBY_federal_partner_desc: "Como parceira federal da Argélia, a Cabília desfruta de plena autonomia e parceria igualitária na federação argelina."
 ALG_kabyle_autonomy: "Caminho da Autonomia Cabila"
 ALG_kabyle_suppressed: "Caminho da Repressão Cabila"
 ALG_kabyle_independence: "Caminho da Independência Cabila"
 ALG_black_spring_triggered: "Primavera Negra Desencadeada"
 ALG_kabyle_issue_resolved: "Questão Cabila Resolvida"
 ALG_became_federal: "A Argélia Tornou-se Federal"
 ALG_secular_path_complete: "Caminho Laico Concluído"
 human_rights_violation: "Violações de Direitos Humanos"
 human_rights_progress: "Progresso nos Direitos Humanos"
 accused_of_interference: "Acusado de Interferência"
 accused_of_terrorism_support: "Acusado de Apoiar o Terrorismo"
 anti_israel_stance: "Postura Anti-Israel"
 ALG_bribe_malian_generals: "Subornar os Generais Malineses"
 ALG_bribe_malian_generals_desc: "A junta militar do Mali pode ser influenciada por uma distribuição cuidadosa de fundos. Subornando generais-chave, a Argélia pode ganhar influência sobre as decisões de Bamaco e garantir nossos interesses no Sahel."
 ALG_isolate_mali_regime: "Isolar o Regime do Mali"
 ALG_isolate_mali_regime_desc: "O regime militar em Bamaco desestabilizou a região e ameaçou as populações tuaregues. A Argélia trabalhará para isolar a junta internacionalmente, posicionando-se como mediadora legítima na crise do Sahel."
 ALG_isolate_mali_tt: "§YIsolar o Regime Malinês§!\nUsar a pressão diplomática e os canais da União Africana para condenar a junta militar.\n\n§YBenefícios:§!\n- Liderança regional para a Argélia\n- Apoio tuaregue aumentado\n- Mali enfraquecido\n- Influência na UA conquistada\n\n§WResultado:§!\nA Argélia se torna a mediadora-chave nos assuntos do Sahel"
 ALG_au_condemns_mali_tt: "§YA União Africana condena o regime malinês§!\nTodos os membros da UA reduzem a opinião sobre o Mali"
 ALG_malian_general_network: "Rede de Generais Malineses"
 ALG_malian_general_network_desc: "Uma rede de generais malineses subornados fornece à Argélia informações e influência sobre a junta militar em Bamaco."
 ALG_sahel_mediator: "Mediadora do Sahel"
 ALG_sahel_mediator_desc: "A Argélia emergiu como a principal mediadora diplomática nos conflitos do Sahel. Nossa voz tem peso nos assuntos regionais."
 MAL_international_isolation: "Isolamento Internacional"
 MAL_international_isolation_desc: "O regime militar enfrenta condenação e isolamento internacionais. O comércio é interrompido, a ajuda externa é suspensa e o governo luta para manter o controle."
 ALG_bribed_our_generals: "Subornou Nossos Generais"
 ALG_supported_our_cause: "Apoiou Nossa Causa"
 AU_condemned_regime: "UA Condenou o Regime"
 ALG_bribed_mali_generals: "Generais Malineses Subornados"
 ALG_isolated_mali: "Regime do Mali Isolado"
 ALG_dziri_unlock_tt: "§YRequer um dos seguintes:§!\n- §HRestaurar a Esperança§! concluído\n- §HResistir a Le Pouvoir§! concluído\n- §HGolpe Militar§! concluído"
 ALG_requires_democratic_or_neutral_tt: "Requer governo §HDemocrático§! ou §HNeutro§!"
 ALG_requires_authoritarian_or_neutral_tt: "Requer governo §HAutoritário§! ou §HNeutro§!"
 ALG_not_gender_equality_tt: "§RIncompatível com o foco Igualdade de Gênero§!"
 ALG_not_suppressed_kabyle_tt: "§RIndisponível se a Cabília foi reprimida§!"
 ALG_migration_event_required_tt: "§YDesbloqueado pelo evento Crise Migratória§!"
 ALG_drug_event_required_tt: "§YDesbloqueado pelo evento Crise das Drogas§!"
 ALG_dziri_tt: "§GRamo da Sociedade Argelina Desbloqueado:§!\n\nEscolha como moldar a sociedade argelina - progressista ou tradicional, aberta ou fechada."
 ALG_dziri_unlocks_tt: "§YDesbloqueia o Ramo da Sociedade:§!\n- Caminho da Sociedade Civil (Democrático/Neutro)\n- Caminho das Tradições (Autoritário/Neutro)\n- Direitos Berberes (Democrático/Neutro)\n- Resposta às Drogas (acionado por evento)\n- Resposta à Migração (acionado por evento)"
 ALG_open_civil_society_tt: "§GSociedade Civil Aberta:§!\n\n- ONGs e entidades beneficentes florescem\n- A participação democrática aumenta\n- Base para reformas progressistas"
 ALG_constitutionalize_rights_tt: "§GDireitos Constitucionais:§!\n\n- Liberdades fundamentais protegidas\n- Estado de direito fortalecido\n- Aprovação internacional"
 ALG_integration_policy_tt: "§GProgramas de Integração:§!\n\n- Migrantes se tornam cidadãos produtivos\n- Ganhos de mão de obra\n- Coesão social"
 ALG_unlocks_migration_branch_tt: "§YDesbloqueia o Ramo de Resposta à Migração§!\n(Quando o evento de migração ocorrer)"
 ALG_migration_problems_tt: "§YCrise Migratória:§!\n\nMigrantes da África subsaariana inundam as fronteiras ao sul da Argélia. Você deve escolher como responder."
 ALG_migration_choice_tt: "§YEscolha:§!\n- §GPolítica de Portas Abertas§! - Acolher os migrantes\n- §RFronteiras Fechadas§! - Proteger a fronteira"
 ALG_open_door_tt: "§GPolítica de Portas Abertas:§!\n\n- Acolher migrantes e refugiados\n- Ganhos de mão de obra\n- Alguma perda de estabilidade\n- Reputação humanitária"
 ALG_closed_borders_tt: "§RFronteiras Fechadas:§!\n\n- Proteger a fronteira\n- Ganhos de estabilidade\n- Influência estrangeira reduzida\n- Crescimento populacional desacelera"
 ALG_expand_berber_rights_tt: "§GAmpliar os Direitos Berberes:§!\n\n- Cultura amazigh celebrada\n- Satisfação dos cabilas melhora\n- A pesquisa se beneficia da diversidade"
 ALG_drug_problem_tt: "§YCrise das Drogas:§!\n\nO tráfico de drogas vindo do Marrocos e do Sahel gerou problemas de dependência. Você deve escolher como responder."
 ALG_drug_choice_tt: "§YEscolha:§!\n- §GDescriminalizar§! - Abordagem baseada na saúde\n- §REndurecer as Punições§! - Abordagem policial"
 ALG_relax_restrictions_tt: "§GDescriminalizar as Drogas:§!\n\n- Tratar a dependência como questão de saúde\n- Reduzir a população carcerária\n- Alguma influência da máfia permanece\n- Críticas internacionais reduzidas"
 ALG_tighten_punishments_tt: "§RRepressão às Drogas:§!\n\n- Penas severas para traficantes\n- Influência da máfia reduzida\n- Apoio à Guerra aumentado\n- Alguma perda de estabilidade"
 ALG_traditions_matter_tt: "§GValores Tradicionais:§!\n\n- Costumes argelinos preservados\n- Valores religiosos promovidos\n- Resistência à influência ocidental"
 ALG_unlocks_conservative_path_tt: "§YDesbloqueia o Caminho Social Conservador§!"
 ALG_censor_internet_tt: "§YCensurar a Internet:§!\n\n- Bloquear a propaganda estrangeira\n- Controlar o fluxo de informações\n- Reduzir a influência estrangeira\n- Pesquisa um pouco mais lenta"
 ALG_restrict_women_tt: "§YPapéis de Gênero Tradicionais:§!\n\n- Mulheres incentivadas a ficar em casa\n- A taxa de natalidade pode aumentar\n- Força de trabalho reduzida\n- Críticas do Ocidente"
 ALG_marriage_subsidies_tt: "§GSubsídios ao Casamento:§!\n\n- O governo paga os casamentos\n- Crescimento populacional incentivado\n- Custo para o tesouro\n- Valores tradicionais promovidos"
 ALG_open_civil_society_idea: "Sociedade Civil Aberta"
 ALG_open_civil_society_idea_desc: "A Argélia tem uma sociedade civil vibrante, com ONGs, entidades beneficentes e organizações comunitárias ativas que contribuem para a vida pública."
 ALG_constitutionalize_rights_idea: "Direitos Constitucionais"
 ALG_constitutionalize_rights_idea_desc: "Os direitos fundamentais estão consagrados na constituição, protegendo os cidadãos argelinos e fortalecendo o estado de direito."
 ALG_integration_policy_idea: "Política de Integração"
 ALG_integration_policy_idea_desc: "A Argélia integra ativamente migrantes e refugiados, oferecendo cursos de idioma e caminhos para a cidadania."
 ALG_migration_crisis: "Crise Migratória"
 ALG_migration_crisis_desc: "Ondas de migrantes da África subsaariana sobrecarregaram as instalações de fronteira e criaram tensões sociais."
 ALG_welcome_migrants: "Política de Portas Abertas"
 ALG_welcome_migrants_desc: "A Argélia acolhe migrantes e refugiados, oferecendo assistência humanitária e apoio à integração."
 ALG_refugees_maintained: "População Refugiada Gerenciada"
 ALG_refugees_maintained_desc: "A população refugiada da Argélia é bem gerenciada, com instalações adequadas e programas de integração."
 ALG_drug_crisis: "Crise das Drogas"
 ALG_drug_crisis_desc: "O tráfico de drogas e a dependência se tornaram problemas graves, sobrecarregando as forças policiais e os serviços de saúde."
 ALG_traditions_matter_idea: "Valores Tradicionais"
 ALG_traditions_matter_idea_desc: "A Argélia promove valores tradicionais, entre eles a família, a fé e a comunidade. A influência cultural ocidental é resistida."
 ALG_censored_internet_idea: "Internet Censurada"
 ALG_censored_internet_idea_desc: "O governo controla o acesso à internet, bloqueando a propaganda estrangeira e o conteúdo imoral."
 ALG_women_role_idea: "Papéis de Gênero Tradicionais"
 ALG_women_role_idea_desc: "As mulheres são incentivadas a assumir papéis tradicionais de donas de casa e mães. A participação feminina na força de trabalho diminuiu."
 ALG_marriage_subsidies_idea: "Subsídios ao Casamento"
 ALG_marriage_subsidies_idea_desc: "O governo subsidia casamentos, ajudando jovens casais a arcar com as cerimônias e incentivando a formação de famílias."
 restricts_women_rights: "Restringe os Direitos das Mulheres"
 ALG_migration_flood: "Crise Migratória Ativa"
 ALG_drugs: "Crise das Drogas Ativa"
 ALG_mediterranean_games_preparation: "Preparando os Jogos do Mediterrâneo"
 ALG_mediterranean_games_preparation_desc: "Orã está sendo transformada para os Jogos do Mediterrâneo de 2022. Equipes de construção trabalham dia e noite no Complexo Olímpico, em novos estádios e na vila dos atletas. A nação se une em torno desse evento histórico enquanto a Argélia se prepara para receber 26 nações em seu litoral."
 ALG_more_infra: "Expandir a Infraestrutura"
 ALG_more_infra_desc: "A infraestrutura da Argélia precisa de uma expansão significativa para sustentar o crescimento econômico. Novas estradas, ferrovias e serviços públicos conectarão comunidades e facilitarão o comércio em todo o país."
 TT_ALG_SECULAR_DISCONTENT_MODIFIER: "§ROs laicos ficam descontentes§!\nOs argelinos progressistas e laicos se opõem às políticas religiosas."
 TT_ALG_ISLAMIST_SATISFACTION_MODIFIER: "§GO apoio islamista aumenta§!\nOs conservadores religiosos aprovam estas medidas."
 ALG_more_relation_better: "§HEles têm§! §Gmais chances de aderir§! §Hse tivermos§! §Gmelhores relações!§!"
 algerian_military_dismantling: "Desmantelamento Militar"
 algerian_military_dismantling_desc: "As forças armadas da Argélia estão sendo desmanteladas de forma sistemática. Equipamentos são desativados, unidades dissolvidas e oficiais aposentados. O outrora poderoso Exército Nacional Popular Argelino é uma sombra do que foi."
 algerian_student_exchanges: "Programas de Intercâmbio Estudantil"
 algerian_student_exchanges_desc: "Estudantes argelinos estudam no exterior em universidades estrangeiras enquanto estudantes internacionais vêm à Argélia. Esses intercâmbios criam conexões, transferem conhecimento e formam a próxima geração de profissionais argelinos."
 ALG_boost_reformists: "Impulsionar os Reformistas"
 ALG_boost_old_guard: "Impulsionar a Velha Guarda"
 ALG_rally_students: "Mobilizar os Estudantes"
 ALG_mobilize_veterans: "Mobilizar os Veteranos"
 ALG_bribe_elites: "Subornar as Elites"
 ALG_seek_compromise: "Buscar o Compromisso"
 ALG_media_campaign_reform: "Campanha de Mídia pela Reforma"
 ALG_security_crackdown: "Repressão de Segurança"
 ALG_world_tension_security: "Segurança por Tensão Mundial"
 ALG_world_tension_high_security: "Segurança Máxima por Tensão Mundial"
 ALG_path_crackdown_momentum: "Impulso da Repressão"
 ALG_path_reconciliation_momentum: "Impulso da Reconciliação"
 ALG_oil_patronage: "Clientelismo do Petróleo"
 ALG_economic_reforms: "Reformas Econômicas"
 ALG_ter_oboronaup_start: "Defesa Territorial"
 ALG_internalup_start: "Tropas Internas"
 ALG_MAJLIS_WATANI_SHAABI_DESC: "A Assembleia Popular Nacional é a câmara baixa do Parlamento argelino. Sob este sistema, o poder executivo é investido na Assembleia, e não em um único presidente, estabelecendo uma verdadeira república parlamentar em que os representantes eleitos governam a nação coletivamente."
 ALG_a_new_algeria_tt: "A rede de corrupção de Bouteflika é desmantelada. Sua riqueza roubada é confiscada, suas propriedades são vendidas e os fundos recuperados retornam ao tesouro nacional."
 FIS_faction_middle_east_available_tt: "Pelo menos uma nação sunita do Oriente Médio deve ter uma opinião de nós acima de 70 e seguir uma política externa intervencionista"
 FIS_faction_asia_available_tt: "Pelo menos uma nação sunita da Ásia deve ter uma opinião de nós acima de 70 e seguir uma política externa intervencionista"
 ALG_4g_upgrade_decisions_tt: "Desbloqueia decisões para melhorar a infraestrutura da rede 4G nacional."
 ALG_environmental_campaign_no_space_tt: "Nenhum espaço de construção disponível encontrado. Em vez disso, a influência interna foi aumentada por meio da campanha de mídia ambiental."
 ALG_grand_mufti_rule_djaballah_tt: "Abdallah Djaballah será nomeado o novo chefe de Estado, trazendo uma orientação islamista conservadora ao governo da Argélia."
 ALG_grand_mufti_rule_ulema_tt: "O Conselho dos Ulemás será consultado para definir a liderança religiosa da Argélia, desencadeando uma escolha entre facções clericais rivais."
 ALG_revivify_non_aligned_movement_t: "A Argélia trabalhará para revitalizar o Movimento dos Países Não Alinhados, posicionando-se como uma voz de destaque das nações alheias aos blocos das grandes potências."
 TT_ALG_REDUCE_TAXES_5: "A taxa de imposto sobre a população será reduzida em 5, aliviando o fardo das classes baixas e conquistando apoio entre o campesinato."
 ALG_east_west_highway: "Rodovia Leste-Oeste"
 ALG_east_west_highway_desc: "A Rodovia Leste-Oeste servirá de espinha dorsal econômica da Argélia, ligando os principais centros populacionais de Annaba a Tlemcen e melhorando drasticamente o comércio interno e a mobilidade."
 ALG_future_national_policy1: "Uma Nação na Encruzilhada"
 ALG_future_national_policy1_desc: "O futuro da Argélia ainda não foi escrito. As decisões tomadas nos próximos anos definirão o caráter do Estado, seus valores, seus aliados e seu lugar no mundo."
 ALG_hassi_massoud_exploitation_desc: "O campo petrolífero de Hassi Messaoud é um dos maiores da África. Investindo em sua plena exploração, a Argélia pode aumentar drasticamente sua produção de petróleo e garantir receitas energéticas de longo prazo."
 ALG_north_south_highway_desc: "Uma rodovia transaariana ligando o litoral norte ao extremo sul abrirá o vasto interior da Argélia, viabilizando a extração de recursos e reduzindo a desigualdade regional."
 ALG_black_decade_lesson2_idea: "Lições da Década Negra II"
 ALG_black_decade_lesson2_idea_desc: "As reformas nas forças armadas se basearam nas dolorosas lições da guerra civil. As forças militares da Argélia estão mais bem preparadas para lidar com ameaças internas sem recorrer à violência indiscriminada."
 ALG_black_decade_lesson3_idea: "Lições da Década Negra III"
 ALG_black_decade_lesson3_idea_desc: "Uma década de reformas transformou a doutrina de segurança da Argélia. O combate ao extremismo agora está incorporado à cultura militar, com unidades especializadas e redes de inteligência concebidas especificamente para prevenir futuras insurgências."
 ALG_decline_of_tourism1: "Setor de Turismo em Recuperação"
 ALG_decline_of_tourism1_desc: "O pior do declínio já passou. Investimentos direcionados e melhores condições de segurança começam a atrair visitantes de volta aos sítios históricos e ao litoral mediterrâneo da Argélia."
 ALG_destroyed_agriculture_two: "Setor Agrícola Danificado"
 ALG_destroyed_agriculture_two_desc: "A instabilidade contínua segue prejudicando a recuperação agrícola. Os campos continuam improdutivos e as comunidades rurais lutam para retomar as atividades agrícolas normais."
 ALG_destroyed_agriculture_three: "Reconstrução Agrícola"
 ALG_destroyed_agriculture_three_desc: "Os esforços de reconstrução estão em andamento no setor agrícola. Novos distritos estão sendo cultivados e a infraestrutura é lentamente reconstruída para restaurar a capacidade de produção de alimentos."
 ALG_family_centric_2: "A Família no Coração da Sociedade II"
 ALG_family_centric_2_desc: "A ênfase nas estruturas familiares tradicionais se aprofundou, moldando a política social em torno de uma visão conservadora do lar como alicerce da sociedade argelina."
 ALG_hydroelectric_power_plants_upgraded2_idea: "Rede Hidrelétrica Avançada"
 ALG_hydroelectric_power_plants_upgraded2_idea_desc: "Uma segunda onda de melhorias na infraestrutura hidrelétrica da Argélia ampliou significativamente a capacidade de armazenamento de energia e a confiabilidade da rede em todo o país."
 ALG_mastering_atom_2: "Dominando o Átomo II"
 ALG_mastering_atom_2_desc: "O programa nuclear da Argélia avançou para a fase de enriquecimento, gerando preocupação internacional. O país agora é capaz de produzir material de grau militar, embora o passo final ainda não tenha sido dado."
 ALG_mastering_atom_3: "Dominando o Átomo III"
 ALG_mastering_atom_3_desc: "A Argélia desenvolveu com sucesso uma capacidade de armas nucleares. A nação agora figura entre as potências nucleares do mundo, alterando drasticamente o equilíbrio de poder regional."
 ALG_riot_police_1: "Unidade de Resposta Rápida Al-Saiqa"
 ALG_riot_police_1_desc: "Uma unidade dedicada de polícia de choque foi formada, treinada especificamente para dispersar protestos e manter a ordem nos centros urbanos. Sua presença é um fator de dissuasão contra a agitação civil."
 ALG_riot_police_2: "Mobilização Ampliada da Al-Saiqa"
 ALG_riot_police_2_desc: "A unidade de polícia de choque foi reduzida e reformada após críticas públicas ao uso excessivo da força. Seu mandato foi restringido e a supervisão, ampliada."
 ALG_riot_police_3: "Força de Elite Al-Saiqa"
 ALG_riot_police_3_desc: "A unidade Al-Saiqa foi ampliada e profissionalizada, tornando-se uma força de elite de segurança interna, capaz de mobilização rápida em qualquer ponto do país."
 ALG_science_idea_two: "Renascimento Científico Argelino II"
 ALG_science_idea_two_desc: "Com base na primeira onda de investimento científico, a Argélia estabeleceu uma rede de instituições de pesquisa e parcerias internacionais que aceleram o desenvolvimento tecnológico."
 ALG_air_reform_desc: "Uma primeira rodada de reformas na Força Aérea Argelina começou a modernizar sua estrutura de comando e a atualizar sua frota de aeronaves envelhecidas."
 ALG_air_reform2_desc: "A segunda fase da reforma da força aérea introduziu programas de treinamento avançados e procedimentos de manutenção aprimorados, aumentando a prontidão operacional."
 ALG_air_reform3_desc: "A força aérea da Argélia foi substancialmente reformulada. Novos esquadrões equipados com aeronaves modernas entraram em serviço, melhorando significativamente a defesa aérea e a projeção de poder."
 ALG_air_reform4_desc: "O programa de reforma da força aérea está concluído. A Argélia agora conta com uma das forças aéreas mais capazes do continente africano."
 ALG_algerian_tourism_desc: "O setor de turismo da Argélia está sendo ativamente promovido, com investimentos em infraestrutura hoteleira e campanhas internacionais de marketing que atraem visitantes para o rico patrimônio cultural e natural do país."
 ALG_army_reform_desc: "Foi lançado um programa abrangente de reformas para modernizar o Exército Argelino, melhorando os padrões de treinamento, a logística e as estruturas de comando."
 ALG_army_reform_mass_army_desc: "A Argélia está construindo um grande exército convencional capaz de operações prolongadas, priorizando a mão de obra e a infantaria mecanizada em detrimento das forças especializadas."
 ALG_army_reform_mass_army2_desc: "A reforma do exército de massa entrou em sua segunda fase, com logística aprimorada e apoio blindado aumentando o poder de combate convencional das forças terrestres argelinas."
 ALG_army_reform_mass_army3_desc: "A doutrina do exército de massa da Argélia está plenamente estabelecida. Grandes formações de armas combinadas são agora a espinha dorsal da estratégia de defesa terrestre da nação."
 ALG_army_reform_mass_army4_desc: "O programa do exército de massa está concluído. A Argélia pode mobilizar forças terrestres numericamente superiores, apoiadas por uma sólida infraestrutura logística."
 ALG_army_reform_specops_desc: "A Argélia está investindo em forças de operações especiais, criando unidades de elite treinadas para contraterrorismo, resposta rápida e guerra não convencional."
 ALG_army_reform_specops2_desc: "O programa de forças especiais se expandiu, com novas unidades treinadas em resgate de reféns, infiltração profunda e operações de ação direta."
 ALG_army_reform_specops3_desc: "As forças especiais da Argélia atingiram um alto nível de capacidade, aproveitando as lições de décadas de experiência em contrainsurgência no Sahel e no próprio país."
 ALG_army_reform_specops4_desc: "O programa de reforma das forças especiais está concluído. As unidades de elite da Argélia estão entre as mais capazes da África, respeitadas por sua experiência e sofisticação operacional."
 ALG_basic_income_support_desc: "Um programa de renda básica oferece uma rede de proteção financeira aos cidadãos mais pobres da Argélia, reduzindo a pobreza e amortecendo os efeitos da volatilidade econômica."
 ALG_black_decade_methods_desc: "As forças de segurança continuam recorrendo aos métodos brutais desenvolvidos durante a guerra civil. Embora eficaz no curto prazo, essa abordagem alimenta o ressentimento e corre o risco de reacender o mesmo extremismo que pretende suprimir."
 ALG_border_security_idea_desc: "Postos de controle reforçados nas fronteiras e rotas de patrulha ampliadas melhoraram a capacidade da Argélia de interceptar contrabandistas, traficantes de armas e infiltrados extremistas que cruzam suas vastas fronteiras desérticas."
 ALG_childcare_reform_desc: "Novas creches e programas subsidiados de educação infantil estão sendo implantados, facilitando para as famílias conciliar o trabalho e a criação dos filhos."
 ALG_closed_moroccan_border_desc: "A fronteira com o Marrocos permanece firmemente fechada. Embora isso limite o contrabando transfronteiriço, também sufoca o comércio legítimo e aprofunda o congelamento diplomático entre as duas nações."
 ALG_confidence_measures_idea_desc: "Um pacote de medidas de construção de confiança entre a Argélia e seus vizinhos ajuda a reduzir as tensões e a abrir canais para o diálogo diplomático."
 ALG_counter_morocco_idea_desc: "A Argélia combate ativamente a influência marroquina na região por meio de pressão diplomática, apoio à Frente Polisário e competição estratégica por aliados africanos."
 ALG_dialogue_with_morocco_desc: "Foi aberto um diálogo cauteloso com o Marrocos, explorando a possibilidade de normalizar as relações e reabrir a fronteira após anos de hostilidade."
 ALG_education_arabization_desc: "A arabização do sistema educacional foi aprofundada, substituindo o ensino em francês pelo árabe em todos os níveis e incorporando valores islâmicos ao currículo nacional."
 ALG_food_subsidy_idea_desc: "Os subsídios governamentais mantêm baixos os preços dos alimentos básicos, garantindo que até os argelinos mais pobres possam pagar por uma nutrição básica. No entanto, isso representa um fardo significativo para o orçamento nacional."
 ALG_foreign_arms_companies_desc: "A Argélia abriu seu processo de aquisição a fabricantes de armas estrangeiros, obtendo acesso a uma gama mais ampla de equipamentos militares, mas aumentando a dependência de fornecedores externos."
 ALG_fuel_subsidy_idea_desc: "Os preços subsidiados dos combustíveis mantêm baixos os custos de transporte e energia para famílias e empresas argelinas, mas representam um grande passivo fiscal que limita a flexibilidade orçamentária do governo."
 ALG_future_army_desc: "A Argélia está investindo em tecnologia e doutrina militares de nova geração, posicionando suas forças armadas na vanguarda da capacidade de guerra moderna."
 ALG_global_power_desc: "A Argélia se firmou como uma verdadeira potência global, com assento à mesa internacional e o peso econômico e militar para sustentá-lo."
 ALG_health_insurance_system_desc: "Um sistema nacional de seguro-saúde está sendo estabelecido, dando aos argelinos acesso a cuidados médicos independentemente do nível de renda."
 ALG_housing_support_idea_desc: "Programas governamentais de apoio à moradia ajudam famílias de baixa renda a acessar habitação acessível, reduzindo a pressão da escassez de moradias urbanas na Argélia."
 ALG_hydroelectric_power_plants_upgraded_idea_desc: "A infraestrutura hidrelétrica da Argélia foi modernizada, aumentando a capacidade e a confiabilidade da geração de eletricidade a partir da água e reduzindo a dependência de combustíveis fósseis."
 ALG_idea_arab_diplomacy_desc: "A Argélia adota uma agenda diplomática árabe ativa, posicionando-se como mediadora-chave e voz de peso na Liga Árabe e no mundo árabe em geral."
 ALG_idea_parliamentary_republic_desc: "A Argélia adotou um sistema de república parlamentar, deslocando o poder executivo para o Legislativo e estabelecendo uma forma de governo mais responsável perante o povo."
 ALG_idea_presidential_republic_desc: "A Argélia funciona como uma república presidencial, com a autoridade executiva concentrada no cargo de presidente, eleito diretamente pelo povo."
 ALG_idea_refoming_education_desc: "Uma primeira rodada de reformas educacionais começou a melhorar os padrões curriculares, a formação de professores e o acesso à escolarização em todo o país."
 ALG_idea_refoming_education1_desc: "A segunda fase da reforma educacional ampliou o ensino secundário, melhorou a formação profissional e introduziu metodologias de ensino atualizadas nas escolas da Argélia."
 ALG_idea_semi_presidential_republic_desc: "O sistema semipresidencialista da Argélia equilibra o poder entre um presidente eleito diretamente e um primeiro-ministro responsável perante o parlamento."
 ALG_maghreb_cooperation_idea_desc: "A Argélia trabalha para aprofundar a cooperação econômica e política com seus vizinhos do Magrebe, lançando as bases de um bloco regional norte-africano mais integrado."
 ALG_maghreb_security_idea_desc: "Um marco de segurança compartilhado com os parceiros do Magrebe permite respostas coordenadas ao terrorismo, ao contrabando e à instabilidade transfronteiriça no Sahel."
 ALG_maghreb_trade_idea_desc: "Acordos comerciais preferenciais com as nações do Magrebe impulsionam o comércio intrarregional, reduzindo a dependência da Argélia dos mercados europeus."
 ALG_mastering_atom_desc: "A Argélia iniciou um programa nuclear clandestino, estabelecendo a infraestrutura de pesquisa necessária para eventualmente desenvolver material de grau militar."
 ALG_military_expansion_desc: "A Argélia está ampliando o tamanho de suas forças armadas, investindo em novos equipamentos e recrutando pessoal adicional para projetar maior poder militar."
 ALG_military_expansion2_desc: "O programa de expansão militar entrou em sua segunda fase, com novas unidades blindadas, brigadas de artilharia e sistemas de defesa aérea entrando em serviço."
 ALG_military_junta_desc: "Os militares assumiram o controle direto do Estado. A Argélia é governada por uma junta de generais cuja legitimidade se baseia na força, e não em um mandato popular."
 ALG_military_quality_initiative_desc: "Uma abordagem de qualidade em vez de quantidade na reforma militar está melhorando o profissionalismo, os padrões de treinamento e o equipamento das forças armadas da Argélia."
 ALG_military_quality_initiative2_desc: "A segunda fase da iniciativa de qualidade militar introduziu treinamento avançado em simulação, melhor formação de oficiais e exercícios conjuntos ampliados entre as forças."
 ALG_modern_hospitals_desc: "A Argélia está construindo uma rede de hospitais modernos equipados com tecnologia médica contemporânea, melhorando significativamente os resultados de saúde da população."
 ALG_natural_products_idea_desc: "A Argélia promove seus produtos naturais, como tâmaras, azeite e artesanato, nos mercados internacionais, diversificando a receita de exportação e apoiando as comunidades rurais."
 ALG_naval_reform_desc: "A marinha da Argélia passa por sua primeira grande reforma em décadas, melhorando a manutenção, o treinamento e a capacidade de sua frota de superfície."
 ALG_naval_reform2_desc: "Novas fragatas e navios-patrulha entraram em serviço como parte da segunda fase da reforma naval, estendendo o alcance da Argélia no Mediterrâneo ocidental."
 ALG_naval_reform3_desc: "A capacidade naval da Argélia foi substancialmente modernizada, com melhores capacidades de guerra antissubmarino e de defesa costeira."
 ALG_naval_reform4_desc: "O programa de reforma naval está concluído. A Argélia agora conta com uma força naval moderna e equilibrada, capaz de projetar poder pelo Mediterrâneo e até o Atlântico."
 ALG_open_border_coop_desc: "A Argélia abriu suas fronteiras a uma maior cooperação transfronteiriça com seus vizinhos, facilitando o comércio, a circulação de pessoas e projetos conjuntos de infraestrutura."
 ALG_pna_expansion_desc: "O Exército Nacional Popular ampliou sua capacidade logística e administrativa, melhorando sua habilidade de sustentar operações em larga escala em todo o vasto território da Argélia."
 ALG_polisario_support_idea_desc: "A Argélia continua oferecendo apoio político, logístico e material à Frente Polisário, mantendo a pressão sobre o Marrocos na disputa do Saara Ocidental."
 ALG_private_clinics_expansion_desc: "O setor privado de saúde está autorizado a se expandir, oferecendo atendimento de maior qualidade para quem pode pagar e aliviando a pressão sobre o sistema público de saúde."
 ALG_private_healthcare_idea_desc: "A Argélia incentiva o investimento privado em saúde, criando um setor privado paralelo que oferece serviços premium ao lado do sistema público."
 ALG_reactioners_desc: "Elementos conservadores dentro da burocracia estatal e dos militares resistem a reformas significativas, protegendo os interesses da ordem estabelecida em detrimento da modernização."
 ALG_reactioners1_desc: "As forças reacionárias foram um pouco enfraquecidas, embora ainda mantenham influência significativa em instituições-chave e continuem a retardar o ritmo da mudança."
 ALG_reactioners2_desc: "O domínio da velha guarda está se afrouxando. Os esforços de reforma ganharam impulso suficiente para superar muitos dos obstáculos institucionais que antes bloqueavam o progresso."
 ALG_reactioners3_desc: "A facção reacionária foi substancialmente marginalizada. O novo acordo político removeu muitos de seus aliados de posições de poder."
 ALG_reactioners4_desc: "A reforma sistêmica quebrou a espinha do bloco reacionário. As instituições da Argélia respondem cada vez mais à demanda popular, e não aos interesses de elites entrincheiradas."
 ALG_reactioners5_desc: "Restam apenas focos isolados de resistência entre a velha guarda. A transformação da cultura política da Argélia está perto de ser concluída."
 ALG_reactioners6_desc: "Os últimos vestígios do sistema reacionário foram varridos. A Argélia entrou em uma nova era definida pela responsabilização e pela genuína competição política."
 ALG_reactioners7_desc: "A Argélia rompeu por completo com seu passado autoritário. O Estado agora se estrutura em torno de normas democráticas e do estado de direito, com as antigas redes de clientelismo dissolvidas."
 ALG_sand_war_memory_idea_desc: "A memória da Guerra das Areias de 1963 com o Marrocos ainda molda o planejamento militar e a política externa argelinos, fomentando uma profunda desconfiança institucional quanto às intenções marroquinas."
 ALG_science_idea_desc: "A Argélia está investindo em pesquisa e desenvolvimento científico, criando novos laboratórios e financiando programas de pesquisa universitária para construir uma economia do conhecimento doméstica."
 ALG_shipbuilding_desc: "A Argélia está desenvolvendo uma indústria naval nacional, construindo instalações capazes de produzir embarcações militares e comerciais e reduzindo a dependência de fornecedores estrangeiros."
 ALG_shipbuilding2_desc: "A indústria naval amadureceu, e embarcações maiores e mais complexas agora são produzidas internamente. A Argélia está se tornando uma nação confiável na manufatura marítima."
 ALG_social_contract_idea_desc: "O governo renovou seu contrato social com a população, trocando aquiescência política por subsídios garantidos, emprego público e serviços sociais."
 ALG_sonatrach_desc: "A Sonatrach, empresa nacional de petróleo e gás da Argélia, continua sendo a espinha dorsal da economia nacional, gerando a grande maioria das receitas de exportação do Estado."
 ALG_state_hospitals_idea_desc: "Uma rede de hospitais estatais oferece acesso básico à saúde a todos os argelinos, embora o subfinanciamento crônico faça a qualidade variar bastante entre as regiões."
 ALG_suppressed_opposition_desc: "A oposição política foi silenciada por uma combinação de restrições legais, controle da mídia e intimidação direta. A dissidência é empurrada para a clandestinidade em vez de eliminada."
 ALG_technological_ties_desc: "A Argélia estabeleceu acordos de transferência de tecnologia com parceiros estrangeiros, obtendo acesso a sistemas e conhecimentos avançados em troca de concessões econômicas e diplomáticas."
 ALG_tikjda_resort_desc: "O resort de montanha de Tikjda, na região da Cabília, está sendo desenvolvido como destino turístico de referência, promovendo o ecoturismo e atraindo visitantes às Montanhas do Atlas da Argélia."
 ALG_universal_healthcare_idea_desc: "A Argélia estabeleceu um sistema de saúde universal que oferece atendimento médico gratuito ou fortemente subsidiado a todos os cidadãos, financiado por tributos gerais e receitas de hidrocarbonetos."
 ALG_university_expansion_desc: "Novos campi universitários estão sendo criados por toda a Argélia, ampliando o acesso ao ensino superior e formando graduados preparados para as exigências da economia moderna."
 ALG_welfare_state_idea_desc: "A Argélia construiu um Estado de bem-estar social abrangente, que oferece apoio à moradia, saúde, educação e assistência de renda, financiado em grande parte pelas receitas de petróleo e gás."
 FIS_al_aqsa_faction: "A Coalizão Al-Aqsa"
 Algeria_desc: "Argélia"
 AlgeriaFocusEvents_desc: "Eventos acionados por focos para a Argélia."
 algeria_focus_desc: "A árvore de focos nacionais da Argélia, cobrindo caminhos políticos, econômicos, militares e de política externa."
 algerian_focus_desc: "A árvore de focos nacionais da Argélia, cobrindo caminhos políticos, econômicos, militares e de política externa."
 algeria_power_balance_desc: "O equilíbrio de poder entre o governo civil e o establishment militar, que há muito tempo funciona como um Estado dentro do Estado na Argélia."
 nuclear_algeria_desc: "A Argélia cruzou o limiar nuclear, possuindo armas nucleares operacionais que alteram fundamentalmente sua postura estratégica no Norte da África e no Mediterrâneo como um todo."
 ALG_civilian_government: "Governo Civil"
 ALG_civilian_government_desc: "Pela primeira vez em décadas, a Argélia é governada por uma administração genuinamente civil. Os militares recuaram da intervenção política direta, permitindo que autoridades eleitas liderem."
 ALG_corrupt_generals: "Generais Corruptos"
 ALG_corrupt_generals_desc: "A cúpula militar está tomada pela corrupção. Generais enriquecidos por décadas de clientelismo resistem a qualquer reforma que ameace seus interesses econômicos."
 ALG_government_led_disaster: "Resposta Governamental a Desastres"
 ALG_government_led_disaster_desc: "O Estado assumiu o controle direto da resposta a desastres, mobilizando recursos públicos em larga escala. Embora cara e burocrática, a intervenção está produzindo resultados reais no terreno."
 ALG_no_disasters_plan: "Sem Plano de Contingência para Desastres"
 ALG_no_disasters_plan_desc: "Atualmente, a Argélia não tem uma estrutura dedicada de resposta a desastres. Quando as crises ocorrem, a ausência de planejamento coordenado gera respostas estatais lentas e ineficazes que pioram os resultados."
 ALG_olympic_preparation: "Programa de Preparação Olímpica"
 ALG_olympic_preparation_desc: "A Argélia está investindo pesado na preparação para sediar os Jogos Olímpicos, construindo infraestrutura esportiva de nível mundial e lançando programas nacionais de desenvolvimento atlético."
 algerian_empowered_sharia_courts: "Tribunais da Sharia Fortalecidos"
 algerian_empowered_sharia_courts_desc: "A jurisdição dos tribunais islâmicos foi ampliada, dando às autoridades religiosas maior influência sobre questões civis e familiares e deslocando o arcabouço jurídico da Argélia em direção à sharia."
 algerian_gulen_movement: "Movimento de Inspiração Gülenista"
 algerian_gulen_movement_desc: "Uma rede inspirada no movimento Gülen se infiltrou na educação e na sociedade civil argelinas, promovendo uma abordagem islâmica modernista e construindo influência significativa nas instituições do Estado."
 algerian_scientific_ventures: "Empreendimentos Científicos Argelinos"
 algerian_scientific_ventures_desc: "Uma onda de empreendimentos científicos conjuntos com parceiros estrangeiros impulsiona um renascimento da pesquisa argelina, com novos projetos em energia renovável, computação e ciência dos materiais ganhando reconhecimento internacional."
 hoggar_nuclear_facility_idea: "Instalação Nuclear de Hoggar"
 ALG_2014_oil_crash_idea_desc: "A queda do preço do petróleo em 2014 devastou as receitas de hidrocarbonetos da Argélia, expondo a fragilidade de seu modelo econômico dependente de recursos e forçando dolorosos cortes nos gastos públicos."
 ALG_AU_pressure_idea_desc: "A União Africana está exercendo pressão diplomática sobre a Argélia por uma questão regional, limitando suas opções de política externa e complicando suas relações com os estados vizinhos."
 ALG_black_market_desc: "Um próspero mercado negro se desenvolveu à sombra do Estado, minando as estatísticas oficiais de comércio, privando o governo de receita tributária e alimentando redes de crime organizado."
 ALG_clean_government_desc: "Uma nova geração de funcionários tecnocratas trouxe maior transparência e responsabilização ao governo. A corrupção está em declínio e a confiança pública nas instituições estatais se recupera aos poucos."
 ALG_decline_of_tourism_desc: "O setor de turismo da Argélia está em grave declínio. Preocupações com segurança, infraestrutura precária e um regime de vistos difícil tornaram o país pouco atraente para visitantes estrangeiros, custando caro à economia."
 ALG_destroyed_agriculture_desc: "O setor agrícola da Argélia foi devastado pelo conflito e pelo abandono. As terras de cultivo estão em pousio, as comunidades rurais foram deslocadas e a dependência de importação de alimentos aumentou drasticamente."
 ALG_election_time_idea_desc: "Uma campanha eleitoral está em andamento, dominando a agenda política e criando tanto oportunidades quanto instabilidade, à medida que facções rivais mobilizam suas bases."
 ALG_emergency_budget_desc: "O governo ativou as disposições de orçamento de emergência, cortando gastos não essenciais e redirecionando recursos para enfrentar uma crise econômica ou de segurança aguda."
 ALG_idea_joint_military_arab_desc: "A Argélia entrou em uma estrutura militar conjunta com parceiros árabes, permitindo planejamento de defesa coordenado, inteligência compartilhada e exercícios de treinamento combinados em toda a região."
 ALG_insurgency_unleashed_desc: "A Argélia cultivou deliberadamente redes insurgentes em um estado vizinho, usando procuradores irregulares para projetar poder e desestabilizar rivais sem compromisso militar direto."
 ALG_national_dialogue_modifier_desc: "Um processo de diálogo nacional reuniu governo e oposição, criando um raro espaço para negociação política e reduzindo o risco imediato de confronto."
 ALG_political_repression_desc: "O Estado pratica repressão política sistemática, prendendo ativistas, censurando a mídia e usando os serviços de segurança para silenciar a dissidência e manter o controle."
 ALG_repression_modifier_desc: "Uma onda de repressão varreu a esfera política da Argélia. Figuras da oposição estão sendo detidas, a mídia está sendo silenciada e as manifestações públicas estão sendo dispersadas à força."
 ALG_surveillance_state_modifier_desc: "A Argélia construiu uma sofisticada infraestrutura de vigilância interna, monitorando comunicações e rastreando as atividades de opositores políticos e atores da sociedade civil."
 ALG_transparent_budget_desc: "A Argélia introduziu a divulgação transparente do orçamento, publicando detalhamentos dos gastos públicos e tornando as contas do governo acessíveis ao escrutínio independente pela primeira vez."
 algeria_cultural_rebirth_desc: "Uma poderosa onda de renascimento cultural nacionalista varre a Argélia, elevando a herança e a história indígenas e marginalizando influências culturais estrangeiras."
 algeria_emerging_youth_desc: "Uma geração de jovens argelinos politicamente engajados está surgindo, pressionando por reforma democrática e oportunidades econômicas com firmeza crescente."
 algeria_nationalist_youth_desc: "O movimento jovem da Argélia deu uma guinada fortemente nacionalista, exigindo uma política externa mais assertiva e o fim do que veem como o compromisso da velha guarda com interesses estrangeiros."
 hoggar_nuclear_facility_idea_desc: "No fundo das Montanhas Ahaggar, uma instalação de pesquisa nuclear foi estabelecida em um local remoto. Sua existência serve como um poderoso fator de dissuasão contra aventuras estrangeiras."
 idea_alg_empowered_parliament_desc: "O parlamento da Argélia recebeu autoridade legislativa genuína. A câmara agora detém poder real sobre o orçamento, a legislação e a responsabilização ministerial."
 idea_algerian_oligarchy_arrests_desc: "A prisão de oligarcas importantes abalou a elite empresarial da Argélia. Embora popular entre o público, a repressão criou incertezas que estão congelando o investimento privado."
 ALG_flavor_event.6.t: "Crise de Refugiados"
 ALG_flavor_event.6.d: "Ondas de refugiados estão inundando nossas fronteiras, fugindo de conflitos e da instabilidade em países vizinhos. Nossa infraestrutura está sobrecarregada e nosso povo está dividido sobre como responder."
 ALG_flavor_event.6.a: "Devemos absorvê-los."
 ALG_flavor_event.7.t: "Crise do Tráfico de Drogas"
 ALG_flavor_event.7.d: "Redes criminosas organizadas transformaram a Argélia em um importante corredor de trânsito de narcóticos. O comércio de drogas está corrompendo as instituições locais e alimentando a violência nas regiões de fronteira."
 ALG_flavor_event.7.a: "Reprimir os traficantes."
 fra_colonial.1.t: "A Sombra do Passado"
 fra_colonial.1.d: "Argel denunciou formalmente o legado colonial da França na Argélia, reabrindo velhas feridas e inflamando a opinião pública dos dois lados do Mediterrâneo. Nosso parlamento está dividido: alguns exigem que mantenhamos firme nosso registro histórico, enquanto outros veem uma oportunidade de reconciliação."
 fra_colonial.1.a: "Defender nosso registro histórico."
 fra_colonial.1.b: "Oferecer um gesto de reconciliação."
 algerian_event.51.d: "Contra todas as probabilidades, o programa espacial da Argélia alcançou o extraordinário: nossa espaçonave pousou com sucesso na Lua. Esse triunfo da engenharia e da vontade nacional eletrizou o povo argelino e colocou nossa bandeira entre as estrelas."
 ALG_aouchiche_desc: "Youcef Aouchiche é um reformista liberal e líder da Frente das Forças Socialistas. Crítico ferrenho do establishment governante, ele fez campanha por reforma democrática, liberdades civis e modernização econômica."
 ALG_hassani_desc: "Abdelali Hassani Cherif é o líder do Movimento da Sociedade pela Paz, o principal partido islamista da Argélia. Ele defende um Islã político moderado, alinhado às normas democráticas e à reconciliação nacional."
 algeria_elections.a: "Está decidido, então."
 alg_military_rule_option: "Apoiar a decisão dos militares."
 AlgeriaPoliticalEvents.1.t: "Realinhamento Político da Argélia"
 AlgeriaPoliticalEvents.1.d: "Com a Década Negra chegando ao fim, a Argélia enfrenta uma escolha crucial sobre sua futura orientação política. Parceria com o Ocidente, não alinhamento ou laços mais estreitos com o Oriente: cada caminho traz consequências profundas para a identidade e a estabilidade do país."
 AlgeriaPoliticalEvents.1.a: "Abrir o debate nacional."
 AlgeriaPoliticalEvents.20.t: "Racha Ideológico no Governo"
 AlgeriaPoliticalEvents.20.d: "Com o conflito chegando ao fim, cresce a pressão dentro do governo para definir o futuro sistema político da Argélia. Os linha-dura exigem o domínio militar, os moderados defendem a reconciliação e a reforma, e as facções islamistas pedem eleições livres."
 AlgeriaPoliticalEvents.20.a: "Fortalecer os militares."
 AlgeriaPoliticalEvents.20.b: "Pressionar por reforma e reconciliação."
 AlgeriaPoliticalEvents.20.c: "Negociar com os islamistas."
 Algeria.8.t: "A Argélia Pede Proteção"
 Algeria.8.d: "O governo argelino solicitou formalmente proteção americana ou garantias de segurança, citando a crescente instabilidade regional. Washington agora deve decidir se estenderá seu guarda-chuva estratégico."
 Algeria.8.a: "Aceitamos o pedido."
 Algeria.8.b: "Não podemos nos comprometer com isso."
 ALG_alignments: "Alinhamento de Política Externa"
 KBY_alg_modifier: "Modificadores do Estado Cabila"
 ALG_algiers_metro: "Corredor do Metrô de Argel"
 ALG_diplomatic_outreach_west: "Aproximação Diplomática com o Ocidente"
 ALG_diplomatic_outreach_west_desc: "A relação da Argélia com Washington e seus aliados europeus foi definida pela desconfiança mútua. Uma iniciativa diplomática sustentada poderia lançar as bases para laços econômicos e de segurança mais estreitos com o mundo ocidental."
 ALG_diplomatic_outreach_china: "Aproximação Diplomática com a China"
 ALG_diplomatic_outreach_china_desc: "Pequim vem expandindo de forma constante sua presença no continente africano. Aprofundar os laços com a China poderia destravar investimentos significativos em infraestrutura e abrir novos mercados, embora possa complicar as relações com parceiros ocidentais."
 monitor_kabyle_unrest_desc: "As montanhas da Cabília são um foco persistente de tensão. Os serviços de segurança devem manter vigilância estreita sobre a atividade da resistência na região para antecipar qualquer escalada."
 kabyle_resistance_tooltip: "A atividade da resistência na Cabília continua elevada."
 ALG_boost_reformists_desc: "Dentro da opaca estrutura política da Argélia, uma facção de tecnocratas e modernizadores vem pressionando por uma reforma genuína. Dar-lhes cobertura política e recursos poderia deslocar o equilíbrio interno de poder em direção à abertura."
 ALG_boost_old_guard_desc: "A rede estabelecida de oficiais militares e veteranos da FLN que construiu o Estado pós-independência está ansiosa com o ritmo da mudança. Reafirmar sua posição e suas prerrogativas reforçará a estabilidade, mas consolidará o status quo."
 ALG_rally_students_desc: "Os campi universitários sempre foram o motor da mudança política argelina. Organizar associações estudantis em torno da agenda reformista pode gerar pressão de baixo para cima e alterar o discurso público."
 ALG_mobilize_veterans_desc: "Os veteranos da guerra de independência e da Década Negra têm enorme autoridade moral na sociedade argelina. Reuni-los em defesa da ordem vigente confere legitimidade à posição do Estado na atual disputa política."
 ALG_bribe_elites_desc: "Grande parte da estrutura de poder da Argélia funciona por meio de redes informais de clientelismo e favores. Distribuir contratos, nomeações e benefícios financeiros a figuras-chave pode consolidar a lealdade, embora aprofunde a corrupção que já corrói o Estado."
 ALG_seek_compromise_desc: "Com os dois lados do debate interno entrincheirados, um esforço de mediação neutra pode ser a única forma de impedir que o impasse descambe para o confronto aberto. Um compromisso não satisfará plenamente ninguém, mas pode evitar o pior."
 ALG_media_campaign_reform_desc: "A mídia estatal e a mídia privada simpática podem ser direcionadas a construir uma narrativa em torno da necessidade de renovação política. Moldar a opinião pública em favor da reforma abala o terreno sob os pés da velha guarda."
 ALG_security_crackdown_desc: "O aparato de segurança pode ser direcionado a reprimir protestos, a mídia independente e os grupos da sociedade civil que alimentam o movimento de reforma. Isso ganhará tempo, mas acumula problemas maiores para o futuro."
 ALG_world_tension_security_desc: "A crescente instabilidade na região oferece ao establishment militar novos argumentos para manter a política firmemente sob seu controle. Aproveitar esse clima pode consolidar a posição da velha guarda."
 ALG_world_tension_high_security_desc: "Com conflitos regionais se alastrando em direção às fronteiras da Argélia, os militares pressionam por poderes de emergência que, na prática, deixariam de lado os defensores civis da reforma. A crise serve de cobertura, mas suspender a competição política traz riscos de longo prazo."
 ALG_path_crackdown_momentum_desc: "A repressão está dando resultados. Manter o ímpeto com operações de segurança adicionais e pressão política aprofundará o domínio da velha guarda sobre o Estado, mas cada passo torna a reversão mais difícil."
 ALG_path_reconciliation_momentum_desc: "O processo de reforma está ganhando tração. Avançar com medidas adicionais de construção de confiança e aberturas políticas pode levar a agenda de reconciliação além do ponto de não retorno."
 ALG_oil_patronage_desc: "A bonança dos hidrocarbonetos da Argélia há muito é usada para comprar paz social. Redirecionar parte das receitas do petróleo para um clientelismo direcionado pode garantir a lealdade de grupos-chave na atual disputa política."
 ALG_economic_reforms_desc: "A economia da Argélia, dominada pelo Estado, é profundamente ineficiente. Um pacote crível de reformas econômicas, abrindo espaço à iniciativa privada e reduzindo obstáculos burocráticos, poderia deslocar o sentimento popular para o campo reformista."
 ALG_ter_oboronaup_start_desc: "Com o país em guerra, a Guarda Nacional pede a formação de unidades de defesa territorial recrutadas localmente para guarnecer a retaguarda e liberar as formações do exército regular para operações na linha de frente."
 ALG_internalup_start_desc: "A situação exige o envio de tropas dedicadas de segurança interna para manter a ordem atrás das linhas de frente, proteger a infraestrutura crítica e impedir que o inimigo explore a instabilidade na retaguarda."
 ALG_casablanca_mission: "Buscar o Acordo de Casablanca"
 ALG_eliminate_GIA: "Eliminar o GIA"
 ALG_eliminate_GIA_desc: "O Grupo Islâmico Armado já representou a face mais brutal da insurgência. Com suas redes fragmentadas e o apoio público em colapso, o Estado agora age para desmantelar os últimos remanescentes da organização e restaurar a ordem em todo o país."
 ALG_reintegration_programs: "Programas de Reintegração"
 ALG_reintegration_programs_desc: "Anos de violência deixaram milhares de ex-combatentes e simpatizantes espalhados pela sociedade argelina. Por meio de programas de reintegração cuidadosamente monitorados, o governo oferecerá um caminho de volta à vida civil para aqueles dispostos a abandonar a insurgência."
 ALG_strengthen_DRS: "Fortalecer o DRS"
 ALG_strengthen_DRS_desc: "O Département du Renseignement et de la Sécurité desempenhou um papel decisivo no combate às redes extremistas durante a Década Negra. Fortalecer as capacidades de nossos serviços de inteligência garantirá que a Argélia nunca mais mergulhe em tamanho caos."
 ALG_coalition_economic_program_tt: "A coalizão presidencial lança um programa coordenado de desenvolvimento econômico."
 ALG_governmental_transparency_tt: "O governo se compromete com reformas de transparência, enfraquecendo a corrupção entrincheirada, mas irritando os interesses militares."
 ALG_ethnic_satisfaction_critical: "§RHostilidade Aberta§!"
 ALG_ethnic_satisfaction_low: "§YProfundo Ressentimento§!"
 ALG_ethnic_satisfaction_moderate: "§YTensões Latentes§!"
 ALG_ethnic_satisfaction_high: "§GRelativamente Satisfeitos§!"
 ALG_deep_state_map_name: "Argel - Centro do Poder"
 ALG_hybrid_military_governance: "Governança Militar Híbrida"
 ALG_hybrid_military_governance_desc: "A Argélia funciona sob um sistema híbrido em que os militares mantêm influência política significativa enquanto as estruturas civis permanecem em vigor."
 ALG_civil_war_brewing_added_tt: "§R£generic_warning RISCO DE GUERRA CIVIL!§!\nA resistência fracassada ao golpe desestabilizou a Argélia."
 ALG_accepted_foreign_intervention: "Aceitou ajuda contra o estado profundo"
 ALG_military_coup_opinion: "Golpe militar na Argélia"
 ALG_fulfilled_election_promise: "Restaurou a democracia como prometido"
 ALG_broke_election_promise: "Quebrou a promessa de realizar eleições"
