 opening_info_ast.1.t: "Starting Information"
 opening_info_ast.1.d: "G'day and welcome to Australia. \n\nThis country uses a dynamic focus tree, meaning that, depending on the current leader, the focus tree will change. Special events and paths can also change the tree. \n\nDevelopment is very much a work in progress. Currently content is available up into 2015, focusing on the Liberal and Labor party with 5 different leader-specific trees. Elections before 2007, however, have been disabled until the next Labor content update is released, which should be soon. \n\nContent for One Nation and the minor parties is also planned for release before the end of the year, and much more is coming for the land downunder!"
 opening_info_ast.1.a: "Understood."
 opening_info_ast.1.b: "Country path guides."
 opening_info_ast.2.t: "Available Country Paths"
 opening_info_ast.2.d: "Liberal \n\n- Tony Abbott. Available during the 2010-2013 elections, or if you retire John Howard. \n\n- Peter Costello. Available as a successor option if you retire John Howard. \n\n- Malcolm Turnbull (Work in progress). Available during the 2016-2019 elections. \n\nLabor \n\n- Kevin Rudd. Available during the 2007-2010 elections. \n\n- Julia Gillard. Available during the 2013-2016 elections, or if Rudd steps down."
 opening_info_ast.2.a: "Go back."
 AST_boeing_australia: "Boeing Australia"
 AST_boeing_australia_mio_header_airframe_assembly_and_sustainment: "Airframe Assembly & Sustainment"
 AST_boeing_australia_mio_header_uncrewed_targets_and_flight_test_systems: "Uncrewed Targets & Flight Test Systems"
 AST_residency_eligibility: "Reconsider Eligibility"
 AST_residency_eligibility_desc: "Current requirements prevent many Australians who aren't native born from enlisting, along with a slew of eligibility barriers. Opening the criteria up to permanent residents and presenting a pathway to citizenship with the ADF is going to bring a new generation to the ADF."
 AST_kapooka_training_sims: "Kapooka Training Sims"
 AST_kapooka_training_sims_desc: "Digital innovations in the field of military sims have progressed to the point where our troops don't even need to leave the barracks to gain essential training! Tank simulators, virtual reality and even videogames will be utilised at our basic training camps to prepare them for field work, with a test run in Kapooka."
 AST_territory_bases: "Territory Bases"
 AST_territory_bases_desc: "Projecting power in our western flank has always been a primary concern. Our island bases near the Indian Ocean will become an easy target for invaders if we don't shore up some defenses."
 AST_asca: "ASCA"
 AST_asca_desc: "As our older systems like the Defense Innovation Hub are phased out, the Advanced Strategic Capabilities Accelerator initiative will be implemented. A program focusing on rapidly deploying prototypes, while scaling and streamlining production lines to be ready for our newest designs."
 AST_phase_two_deployment: "Phase 3 Upgrades"
 AST_phase_two_deployment_desc: "The improvements by Rheinmetall have been successful enough that we're starting to see significant improvements to our logistics. The project heads have even suggested going further, replacing our current cargo trailers, recovery units, tankers and tippers with unified designs. Keeping our army serviced with ease."
 AST_eagle_four: "EAGLE IV"
 AST_eagle_four_desc: "Another bidder for our new phase of procurement has been General Dynamics, with their recent 4x4 tactical vehicles. Offering a localized variant of their EAGLE models, which would act as a more mobile, faster alternative to our heavier APC's, without sacrificing the armour."
 AST_hitting_harder: "Hitting Harder"
 AST_hitting_harder_desc: "Recently General Dynamics has been working alongside Thales to evolve on the benefits of the Bushmaster, and apply that to our armored forces. Enhanced survivability, blast-deflection and electronic adaptability are all key aspects of the blueprint they want to rollout into our current units."
 AST_send_the_thunder: "Send the Thunder"
 AST_send_the_thunder_desc: "During testing of our AS9 Huntsman artillery systems, the sound of the rounds firing was described for miles around as cracking thunder. It's a testament to our innovation, and ability to harness incredible power for our disposal. Similarly our anti-tank and air targeting systems will follow suit in these upgrades. Allowing us to bring thunder to the next battlefield."
 AST_rebuild_the_home_guard: "Rebuild the Home Guard"
 AST_rebuild_the_home_guard_desc: "During WW2 the original Home Guard was formed to tackle the imminent crisis of enemy combatants landing on our shores. Thankfully that never occurred. In the current era, however, the idea of a foreign invasion is never too far off. We must adopt a permanent model for a national guard, made to respond to disasters locally, and fend off the threats abroad."
 AST_forgen: "FORGEN"
 AST_forgen_desc: "Over the duration of our deployments near and far we must sustain the strength of our troops, ensuring that they are adequately supplied and keeping morale at high levels. For this we utilise the process of Force Generation. Equipment is periodically maintained and reconstituted, while fresh personnel are absorbed to replace troops at the end of their deployment."
 AST_expeditionary_ready: "Expeditionary Ready"
 AST_expeditionary_ready_desc: "As our theatres have expanded across Asia and the Middle East, the new §YHeadquarters Joint Operations Command§! will be formed to plan and conduct operations far from our soil."
 AST_pmc_support: "PMC Support"
 AST_pmc_support_desc: "We don't shy away from hiring the odd private military company to watch over our embassies and such in places that our own troops can't easily go. As our reach expands and our logistics begin to get strained in foreign lands, it takes a helping hand to make sure our backlines are safe and peace of mind is secure."
 AST_umbrella_engagement: "Umbrella Engagement"
 AST_umbrella_engagement_desc: "It might not be a surprise to learn that diplomacy and defense aren't mutually exclusive. Our blueprint for peace in the region can be simply described as nation buffering, in that the countries around us that we can approach will be supported, militarily or otherwise, to create a layer of defense between us and the less approachable nations."
 AST_a_model_army: "A Model Army"
 AST_a_model_army_desc: "The ADF has been one of our oldest and sturdiest institutions, and now, for all intents and purposes, it's become a model army in the Pacific. Arms production is now more streamlined than ever, our troops enjoy the latest and most effective tools. Our reforms have brought back pride and respect to our forces, and we can expect an uptick in new recruits thanks to it."
 AST_autonomous_ops: "Autonomous Ops"
 AST_autonomous_ops_desc: "In war, operational advantage favours the side that adapts more quickly. Drones and artificial intelligence systems have quickly changed the way we fight wars, decreasing the risk to our personnel whilst increasing the damage dealt to the other side. The next step for us will be embedding the Robotic and Autonomous Systems and Artificial Intelligence standard into our armies, while monitoring and adapting it to suit our mission structures."
 AST_denial_operations: "Denial Operations"
 AST_denial_operations_desc: "Given our inability to completely deter opposing nations by might alone, a strategy of denial must be employed if conflict arises. The enemy must be delayed at every turn. Infrastructure must be made unusable, shipping lanes unapproachable. Our forces must strike where they are unexpected with the express purpose of causing maximum damage."
 canberra_treaty_idea_desc: "\n§W--------------§!\nThis national spirit will be §RRemoved§! if we are not at war."
 generic_bushfires_ast.2.t: "Bushfires Lash Canberra"
 generic_bushfires_ast.2.d: "A 25km fire front approaches the capital in Canberra, spurred on by powerful winds and creating an explosive storm that is leaving responders scrambling to contain it. \n\nHigh temperatures across the country have been labelled the main culprit for the sudden bushfires breaking out, with an estimated 70% of the state's pastures, forests and nature parks having already been destroyed. An estimated 488 houses have also been lost, including the Mount Stromlo Observatory, one of the oldest research observatories in the country."
 generic_bushfires_ast.2.a: "A terrible loss."
 us_aus_trade_howrd.1.c: "No deal."
 us_aus_trade_howrd.4.t: "The Americans Flip the Deal"
 us_aus_trade_howrd.4.d: "While the deal was initially received well by the United States officials, it seems somewhere along the line they've carved some of the more important aspects out of the deal. In particular sugar and beef have been excluded, leaving us appearing somewhat empty handed to our major farming lobbyists. \n\nWe aren't in a position to renegotiate or refuse the deal, especially since it's already gone through. Instead we'll just have to accept the shirt-fronting and move on."
 us_aus_trade_howrd.4.a: "Did we just get screwed?"
