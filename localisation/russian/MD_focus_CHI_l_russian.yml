 china_sar.048.t: "Hong Kong Dissolves Itself"
 china_sar.048.d: "The Legislative Council has voted to wind up the Special Administrative Region and place Hong Kong under direct central administration. Sinicization has run its full course: the local government now petitions Beijing to complete the handover ahead of schedule, and there is no constituency left in the territory willing to argue otherwise."
 china_sar.048.a: "The Pearl returns to the fold."
