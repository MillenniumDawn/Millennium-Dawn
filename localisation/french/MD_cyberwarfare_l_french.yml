 cyber_op_slot_0_attribution_hunt_tracking: "Chasse aux attributions active"
 cyber_op_slot_0_attribution_hunt_tracking_desc: "Nos équipes de renseignement mènent une analyse criminalistique d'une intrusion récente, retraçant vecteurs d'attaque et signatures numériques pour identifier l'État responsable. Les résultats sont attendus sous 60 jours."
