 CZE_political_event.7.t: "노동자당 금지"
 CZE_political_event.7.desc: "최고행정법원은 정부의 요청에 따라 노동자당을 해산시켰으며, 이는 체코 공화국 역사상 이념을 이유로 한 최초의 정당 금지입니다. 당 지도부와 당원들은 극우 노선의 강령을 이어 가는 사회정의 노동자당으로 재편하고 있습니다."
 CZE_political_event.7.a: "극우가 재집결한다"
 CZE_political_event.8.t: "자유연합-민주연합 해산"
 CZE_political_event.8.desc: "자유연합-민주연합은 당대회에서 정당 해산과 청산 절차 돌입을 의결하면서 정치 활동을 끝냈습니다. 자유주의 성향의 친유럽 유권자들은 이제 TOP 09를 자신들 진영의 주요 정당으로 바라보고 있습니다."
 CZE_political_event.8.a: "자유주의가 새 보금자리를 찾다"
 CZE_political_event.9.t: "공화당을 해산시킨 법원"
 CZE_political_event.9.desc: "최고행정법원은 미로슬라프 슬라데크의 공화국을 위한 집결-체코슬로바키아 공화당을 해산시켰습니다. 한때 이 정당이 장악했던 민족주의 성향의 항의 표심은 토미오 오카무라 상원의원의 신생 운동인 직접민주주의의 여명으로 옮겨 가고 있습니다."
 CZE_political_event.9.a: "항의 표심의 새로운 얼굴"
 CZE_political_event.10.t: "자유와 직접민주주의를 창당한 오카무라"
 CZE_political_event.10.desc: "토미오 오카무라와 라딤 피알라는 격렬한 내부 분쟁 끝에 직접민주주의의 여명과 결별하고 새 정당인 자유와 직접민주주의를 창당했습니다. 신당은 직접민주주의, 이민 반대, EU 회원 자격에 대한 국민투표를 내걸고 선거 운동을 벌입니다."
 CZE_political_event.10.a: "오카무라가 다시 시작한다"
 CZE_political_event.11.t: "결성된 좌파당"
 CZE_political_event.11.desc: "민주사회주의당과 진정한 좌파가 하나의 정당인 좌파당으로 합당했습니다. 신당은 흩어져 있던 급진 좌파를 민주사회주의, 반자본주의, 반군국주의 아래 결집하기를 기대합니다."
 CZE_political_event.11.a: "좌파가 대열을 정비한다"
 CZE_political_event.12.t: "사회민주당이 된 ČSSD"
 CZE_political_event.12.desc: "체코 사회민주당은 플젠에서 열린 당대회에서 당명을 사회민주당, 곧 SOCDEM으로 변경했습니다. 지도부는 당이 하원에서 퇴출된 이후의 새 출발로서 새 당명과 로고를 소개하고 있습니다."
 CZE_political_event.12.a: "같은 정당, 새로운 이름"
 CZE_political_event.13.t: "사회정의 노동자당 해산"
 CZE_political_event.13.desc: "사회정의 노동자당의 당대회는 정당 해산을 의결했습니다. 남은 활동가들은 더 작은 단체와 거리 운동 조직으로 흩어지고 있습니다."
 CZE_political_event.13.a: "변방 정당의 종말"
