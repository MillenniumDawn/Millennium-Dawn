 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Umożliwia bardziej kontrowersyjne opcje flag, które normalnie byłyby cenzurowane."
 RULE_DISABLE_EU: "Wyłącz UE"
 RULE_YES_DISABLE_EU_DESC: "Wszystkie kraje zostaną usunięte z Unii Europejskiej."
 RULE_NO_DISABLE_EU_DESC: "Unia Europejska będzie istnieć taka, jaka jest."
 RULE_EUROPEAN_VOTING_COOLDOWN_LIMIT: "Wyciszenie głosowania w Unii Europejskiej"
 RULE_OPTION_EU_SIXTY: "60 dni"
 RULE_OPTION_EU_SIXTY_DESC: "Głosowania w Parlamencie Europejskim i Radzie Europejskiej zostanie skrócone do sześćdziesięciu dni zamiast domyślnych stu osiemdziesięciu dni"
 RULE_OPTION_EU_NINETY: "90 dni"
