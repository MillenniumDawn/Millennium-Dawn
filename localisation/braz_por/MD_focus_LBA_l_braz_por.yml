 LBA_unit_leader_trait_tripolitania: "Afinidade Tribal: Tripolitânia"
 LBA_unit_leader_trait_tripolitania_desc: "Este comandante é de uma tribo da Tripolitânia. Em caso de conflito entre o governo central e sua tribo, é possível que ele escolha a tribo em vez da nação."
