l_russian:
 MD_wacky.1.t: "Незарегистрированный контакт в канун Рождества"
 MD_wacky.1.d: "Противовоздушная оборона засекла низкий, медленный контакт, пересекающий границу вскоре после полуночи, и атаковала его без предупреждения. Спасательная команда сообщает о санях, девяти северных оленях и очень большом мешке с завернутыми свертками."
 MD_wacky.1.a: "Классифицируйте обломки."
 MD_wacky.1.b: "Извинись перед детьми."
 MD_wacky.2.t: "Неопознанный объект над столицей"
 MD_wacky.2.d: "Тысячи людей в течение одиннадцати минут фотографировали бесшумный треугольный фонарь, висевший над правительственным районом. Военно-воздушные силы настаивают, что их радары вообще ничего не зафиксировали."
 MD_wacky.2.a: "Поднимите перехватчики в воздух."
 MD_wacky.2.b: "Объявите, что это был метеозонд."
 MD_wacky.3.t: "Космический мусор приземляется на автостоянке министерства"
 MD_wacky.3.d: "Титановый топливный бак от несуществующего спутника связи обрушился ночью, расплющив три официальных автомобиля и живую изгородь. Никто не пострадал, и ни одно космическое агентство не признает, чей это был спутник."
 MD_wacky.3.a: "Выставьте счет запускающему государству."
 MD_wacky.3.b: "Выставьте это в музее."
 MD_wacky.4.t: "Торговые автоматы Выводят из строя сеть Министерства"
 MD_wacky.4.d: "Министерство внутренних дел потратило неделю на поиск иностранной кибератаки, прежде чем технические специалисты отследили трафик до собственных интеллектуальных торговых автоматов в здании, которые незаметно переупорядочивали газированные напитки в бесконечном цикле."
 MD_wacky.4.a: "Отключите от сети все машины в здании."
 MD_wacky.4.b: "Пусть пресса поверит, что это была иностранная держава."
 MD_wacky_events: "Дурацкий инцидент"
 MD_wacky_classified_intercept: "Засекреченный перехват"
 MD_wacky_classified_intercept_desc: "Этот бой не упоминается ни в одном опубликованном журнале, и участвующие в нем экипажи были проинструктированы никогда не обсуждать форму цели. Однако видеозапись с камеры наблюдения за оружием является отличным учебным материалом."
 MD_wacky_ufo_conspiracy: "Объяснение Метеозонда"
 MD_wacky_ufo_conspiracy_desc: "Никто не верит официальному заявлению. Два конкурирующих гражданских комитета теперь публикуют конкурирующие фотоанализы, а телекомпания заказала документальный фильм о молчании правительства."
 MD_wacky_debris_exhibit: "Экспонат возвращающихся обломков"
 MD_wacky_debris_exhibit_desc: "Топливный бак стоит в национальном музее рядом с фотографией трех транспортных средств, на которые он приземлился. Посещаемость растет, и необычно большое количество приезжих школьников теперь заявляют, что намерены изучать инженерное дело."
 MD_wacky_phantom_cyber_threat: "Призрачная Киберугроза"
 MD_wacky_phantom_cyber_threat_desc: "Министерство так и не исправило историю об иностранном вторжении, и бюджет на обеспечение безопасности сети в чрезвычайных ситуациях был утвержден без единого вопроса. Торговые автоматы были вынесены из здания."