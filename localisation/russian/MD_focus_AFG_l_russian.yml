 AFG_pakistan_border_less_than_three_fort_tt: "Уровень укрепления ниже, чем  §Y1§! в любом из приграничных регионов с [PAK.GetNameWithFlag]"
 AFG_fence_along_central_afghanistan_border_tt: "Сборка §G1§! пограничного укрепления в каждом пограничном районе с [PAK.GetNameWithFlag] в §YЦентральном§! Афганистане"
 AFG_fence_along_southern_afghanistan_border_tt: "Сборка §G1§! пограничного укрепления в каждом пограничном районе с [PAK.GetNameWithFlag] в §YЮжном§! Афганистане"
 AFG_fence_along_northern_afghanistan_border_tt: "Сборка §G1§! пограничного укрепления в каждом пограничном районе с [PAK.GetNameWithFlag] в §YСеверном§! Афганистане"
 AFG_secure_border_with_pakistan_tt: "\nСтроительство укреплений безопасности вдоль афгано-пакистанской границы §Gснизит§! эффективность проникновения £GFX_AFG_salafist_jihadism §RТалибана§! в нашу страну. Строительство начнётся сначала с §Yцентрального§! Афганистана из-за его политической значимости, затем продолжится с §Yюжного§! Афганистана к §Yсеверному§! Афганистану.\n"
 afghan_unity_propaganda_success_tt: "\nНа §YШансы на успех§! §Rвлияют§! by the §YДоверие общества к нашему правительству§! и §YВаше экономическое положение§!."
 AFG_taliban_strength_lower_than_five_percent_tt: "§YСила талибов§! §Yниже§! §Y5%§!"
 AFG_pakistan_border_more_than_two_fort_tt: "Уровень укрепления выше §Y2§! на всех пограничных регионах с [PAK.GetNameWithFlag]"
 AFG_support_afghan_counter_insurgency_tt: "§YРазблокирует решения Талибов о мятеже§!\n§YТалибан§! Будет установлен в §YСтатической войне§!"
 isaf_raid_taliban_success_tt: "\nНа §YШансы на успех§! §Rвлияет§! §YДоверие общественности к афганскому правительству§! так как мы не можем выполнить эту миссию без координации с  §YАфганским правительством§! и §YЕго военными§!."
