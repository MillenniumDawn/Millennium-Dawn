 nsb_gun_technology_6_desc: "전장의 화력을 강화하도록 설계된 강력한 포병 및 로켓 체계입니다. 이 발전으로 대형 곡사포, 대규모 로켓 무기, 파괴력을 높이는 특수 포병 탄약이 도입됩니다. 또한 로켓 포드의 배치를 가능하게 하여 항공 플랫폼에 향상된 타격 잠재력을 제공합니다. 이 체계들은 뛰어난 장거리 지원을 제공하므로 전장을 지배하는 데 필수적입니다."
 nsb_artillery_ammo_6: "5세대 포병 탄약"
 nsb_artillery_ammo_6_desc: "곡사포, 야포, 자주포와 같은 대구경 화기에 사용하도록 설계된 특수 병기입니다. 파괴적 충격을 위한 고폭탄, 방어 시설을 관통하는 철갑탄, 전술 지원을 위한 연막탄이나 조명탄 등 특정 전장 역할에 맞춰진 여러 유형이 있습니다."
 nsb_special_ammo_4: "통합 병기 현대화"
 nsb_special_ammo_4_desc: "차세대 적응형 탄두, 모듈식 탄약, 고충격 폭발 체계의 전면적 통합입니다."
 nsb_special_ammo_5: "5세대 병기 현대화"
 nsb_special_ammo_5_desc: "차세대 적응형 탄두, 모듈식 탄약, 고충격 폭발 체계의 전면적 통합입니다."
 nsb_fire_modes_4: "우수 화력 지원 교리 II"
 nsb_fire_modes_4_desc: "$nsb_fire_modes_3_desc$"
 nsb_fire_modes_5: "우수 화력 지원 교리 III"
 nsb_fire_modes_5_desc: "$nsb_fire_modes_3_desc$"
 nsb_AA_autocannon_5: "최신예 기관포 체계"
 nsb_AA_autocannon_5_desc: "전장 화력의 차세대 진화인 최첨단 기관포 체계는 최첨단 에너지 기반 기술, 스마트 탄약, AI 기반 표적 지정 체계를 통합하여 비길 데 없는 정밀도와 적응력을 구현합니다. 이 첨단 무기는 전자기 추진, 무탄피 극초고속 탄환, 비행 중에 조정이 가능한 적응형 탄종을 활용하여 효과를 극대화합니다. 자율 전투망에 완전히 통합된 이 기관포는 여러 표적을 동시에 교전하고, 고속 공중 위협을 추적하며, 최소한의 반동으로 지속 사격을 제공할 수 있습니다. 다중 플랫폼 배치를 염두에 두고 설계되어 차세대 주력 전차, 항공기, 해군 함정, 무인 전투 체계의 화력을 강화하며, 내일의 전쟁에서 우위를 보장합니다."
 nsb_AA_autocannon_6: "6세대 기관포 체계"
 nsb_AA_autocannon_6_desc: "$nsb_AA_autocannon_5_desc$"
 nsb_AA_autocannon_7: "7세대 기관포 체계"
 nsb_AA_autocannon_7_desc: "$nsb_AA_autocannon_5_desc$"
 nsb_AA_autocannon_8: "8세대 기관포 체계"
 nsb_AA_autocannon_8_desc: "$nsb_AA_autocannon_5_desc$"
 nsb_SHORAD_missile_5: "미래형 미사일 기술"
 nsb_SHORAD_missile_5_desc: "미사일전의 차세대 진화인 미래형 미사일 기술은 극초음속 속도, 인공지능, 첨단 에너지 기반 추진 체계를 통합하여 비길 데 없는 정밀도, 적응력, 살상력을 달성합니다. 이 최첨단 무기는 자가 학습 AI 표적 지정, 군집 협동, 다단계 유도 체계를 특징으로 하여 공중, 지상, 해상 표적을 거의 즉각적인 반응 속도로 교전할 수 있습니다. 플라즈마 기반 탄두, 양자 암호화 표적 지정, 자율 전장 통합과 같은 발전은 이 미사일이 대응 수단을 회피하고, 역동적인 위협에 적응하며, 복잡한 전략 기동을 수행할 수 있게 합니다. 우주 기반 플랫폼, 스텔스 폭격기, 차세대 해군 함정에서 전개할 수 있는 이 미사일은 전쟁의 미래를 재정의하며 모든 전역에서 확고한 우위를 보장합니다."
 nsb_SHORAD_missile_6: "6세대 미사일 기술"
 nsb_SHORAD_missile_6_desc: "$nsb_SHORAD_missile_5_desc$"
 nsb_SHORAD_missile_7: "7세대 미사일 기술"
 nsb_SHORAD_missile_7_desc: "$nsb_SHORAD_missile_5_desc$"
 nsb_SHORAD_missile_8: "8세대 미사일 기술"
 nsb_SHORAD_missile_8_desc: "$nsb_SHORAD_missile_5_desc$"
 nsb_dual_role_missile_5: "미래형 겸용 미사일 체계"
 nsb_dual_role_missile_5_desc: "미사일전의 다음 시대는 공중, 지상, 해상은 물론 우주 기반 위협에 이르기까지 여러 유형의 표적을 전례 없는 속도와 적응력으로 교전하도록 설계된 미래형 겸용 미사일 체계를 도입합니다. 이 고도로 발전한 미사일은 AI 기반 군집 협동, 양자 암호화 표적 지정, 자가 학습 유도 체계를 활용하여 위협을 실시간으로 자율 탐지, 추적, 무력화합니다. 플라즈마 기반 탄두, 지향성 에너지 탑재체, 마하 10을 넘는 극초음속 추진을 갖춘 이 미사일은 알려진 모든 대응 수단을 회피하고, 비행 중 동적으로 조정하며, 대륙간 사거리에서 정밀 타격을 수행할 수 있습니다. 자율 전투망에 통합된 이 무기들은 차세대 전략 및 전술적 우위의 토대로서, 재래식 및 비대칭 전쟁 시나리오 모두에서 전장의 완전한 우세를 보장합니다."
 nsb_dual_role_missile_6: "6세대 겸용 미사일 체계"
 nsb_dual_role_missile_6_desc: "$nsb_dual_role_missile_5_desc$"
 nsb_dual_role_missile_7: "7세대 겸용 미사일 체계"
 nsb_dual_role_missile_7_desc: "$nsb_dual_role_missile_5_desc$"
 nsb_dual_role_missile_8: "8세대 겸용 미사일 체계"
 nsb_dual_role_missile_8_desc: "$nsb_dual_role_missile_5_desc$"
 tech_rail_battery_3_desc: "3세대 레일건 포대는 최첨단 포신 수명, 열 관리, 탄약고 자동화를 더해 치명적인 마모 없이 지속적인 고속 일제 사격을 가능하게 합니다. 더 지능적인 전력 분배와 고급 표적 설정을 통해, 이 3연장 레일 포탑은 수상 교전을 지배하고 기존 해군 포병을 훨씬 뛰어넘는 장거리 정밀 화력 지원을 제공할 수 있습니다."
 composite_production_6: "최첨단 복합재 생산"
 composite_production_6_desc: "최첨단 복합재 생산은 열가소성 재료, 로봇 적층, 실시간 공정 감시를 확대하여 복잡한 스텔스 기체, 장갑판, 차량 구조물을 더 빠르고 더 적은 결함으로 생산할 수 있게 합니다."
 composite_production_7: "근미래 복합재 생산"
 composite_production_7_desc: "근미래 복합재 생산은 나노물질, 전파 흡수층, 내장형 구조 센서를 통합하여 방호력을 높이고 식별 신호를 줄이며 운용 중 손상을 감시할 수 있는 더 가벼운 부품을 만들어 냅니다."
 composite_production_8: "미래 복합재 생산"
 composite_production_8_desc: "미래 복합재 생산은 프로그래밍 가능한 섬유, 자가 치유 기질, AI 최적화 제조를 활용하여 장갑 방호, 스텔스 성능, 열 제어, 전장 손상 저항력을 겸비한 초경량 구조물을 만들어 냅니다."
