 USA_crisis_event.1125.t: "Los Sindicatos Mineros se Movilizan"
 USA_crisis_event.1125.d: "A medida que la situación se deteriora más allá de lo comprensible, los trabajadores mineros sindicalizados han comenzado a movilizarse en torno al estado de Virginia Occidental. Considerando el estado como una posición defensiva clave, la mayoría de estos trabajadores esperan aumentar la presión y, o bien forzar la adopción de una agenda favorable a los sindicatos, o bien asegurar la independencia del otrora conocido como el Estado de la Perla Negra."
 USA_crisis_event.1125.o1: "¡Dios Mío, ¿Por Qué Ahora?!"
 USA_crisis_event.1126.t: "Movilicen las Defensas"
 USA_crisis_event.1126.d: "El gobierno federal busca reprimir y oprimir a quienes lo ven como una broma. Nos mantendremos firmes contra la tiranía y por los trabajadores."
 USA_crisis_event.1126.o1: "¡Convoquen a los Trabajadores!"
 USA_crisis_event.1127.t: "El Tercer Susto Rojo"
 USA_crisis_event.1127.d: "Ha llegado el momento: debemos aplastar a esta chusma comunista si queremos asegurar un futuro democrático para nuestra nación en estos tiempos difíciles."
 USA_crisis_event.1127.o1: "Mejor Muerto que Rojo"
 USA_crisis_event.1128.t: "The Sun Shines Too Bright"
 USA_crisis_event.1128.d: "In a disturbing upset in regional unity, the state of Florida has declared independence. While we are greatly saddened by this turn of events, the mutual goal of the destruction of the federal government is what matters and as such is what we will unite towards for the time being."
 USA_crisis_event.1128.o1: "Poco Queda de la Familia del Sur"
 USA_crisis_event.1129.t: "Creación de la Guardia Estatal"
 USA_crisis_event.1129.d: "The recent national turmoil has resulted in us recreating the state guard and using it as a means of a self defense force. We hope to secure our independence from federal oppression and wish Godspeed to all who share our cause."
 USA_crisis_event.1129.o1: "¡A las Armas!"
 USA_crisis_event.1130.t: "La Gran Rebelión"
 USA_crisis_event.1130.d: "Now we have rebellion inside of a rebellion, will this chaos ever end?"
 USA_crisis_event.1130.o1: "¡Marchamos hacia Miami!"
 USA_crisis_event.1131.t: "El Loco de la Montaña"
 USA_crisis_event.1131.d: "As things continue to spiral out of control, the state of Idaho seeing the Lakotan buffer state as a means to secure its seclusion from everything has declared independence. With the statement from the rebellion leader stating, quote, \"Our state is but that of the Rocky Mountains, we have no need for your fancy cities and divisive ideologies.\". Federal officials are looking to respond as quickly as possible to yet another challenge to its authority in the on-going crisis."
 USA_crisis_event.1131.o1: "¿Cuántos Más Hay?"
 USA_crisis_event.1132.t: "Montañas con Hombres"
 USA_crisis_event.1132.d: "Mientras el gobierno federal busca extender su control tóxico sobre todos los que se resisten a sus trampas oligárquicas, debemos buscar defendernos a nosotros mismos y a nuestros hermanos y hermanas en armas que también desean que los dejen en paz."
 USA_crisis_event.1132.o1: "Resistid Firmes y Fuertes"
 USA_crisis_event.1133.t: "Otro Problema de Montañas"
 USA_crisis_event.1133.d: "Llegaremos a ellos eventualmente, pero aún debemos declarar nuestras intenciones obvias."
 USA_crisis_event.1133.o1: "Dios, por favor… ¡Nada más montañas!"
 USA_crisis_event.1134.t: "Soñando con California"
 USA_crisis_event.1134.d: "Seems like the whole nation is dreaming while we're actively living a nightmare. The governor of California has formally declared a state of secession up until either the federal government of the so called \"United States\" is dealt with or a cease fire is reached. Wherein California will negotiate to consider either reintegration or outright independence."
 USA_crisis_event.1134.o1: "Oh, Qué Benevolentes Son…"
 USA_crisis_event.1135.t: "Llamad a la Guardia"
 USA_crisis_event.1135.d: "We expect like those before us to be swiftly and unjustly strung up against a wall. With this clear and violent outcome assured we must mobilize defenses and ensure our people are secure from the tyranny of the east."
 USA_crisis_event.1135.o1: "Dios Bendiga a la República del Oso"
 USA_crisis_event.1136.t: "El Avance Occidental"
 USA_crisis_event.1136.d: "De mar a mar resplandeciente volveremos a ser una sola nación."
 USA_crisis_event.1136.o1: "¡Adelante!"
 USA_crisis_event.1137.t: "Grandes Lagos, Grandes Problemas"
 USA_crisis_event.1137.d: "Como si no fuera suficiente tener 19 estados ya confirmados en rebelión activa, parece que casi la mitad del país, si no ya, está indignada por el reciente desastre del gobierno federal. Debemos asegurarnos de que esto no vaya más lejos."
 USA_crisis_event.1137.o1: "The Death Penalty, Maybe We Do Need It"
 USA_crisis_event.1138.t: "La Puerta del Norte"
 USA_crisis_event.1138.d: "The nation is in ruins, we can only do what any respectable state should do and that's protect its people. Mobilize the masses and stand strong with our sister states."
 USA_crisis_event.1138.o1: "¡Defended la Democracia Misma!"
 USA_crisis_event.1139.t: "Nuestro Propio Sendero de Lágrimas"
 USA_crisis_event.1139.d: "Si queremos proteger a toda la nación, debemos atender a todos los estados problemáticos con el mismo tratamiento que a los orígenes de esta catástrofe."
 USA_crisis_event.1139.o1: "Dios, Por Favor, Que Esto Termine Ya…"
 USA_crisis_event.1140.t: "Ley de Conscripción de Emergencia"
 USA_crisis_event.1140.d: "With the absolute state of things, mass conscription similar to the draft has been enforced. loyal national guard elements as well as civilian movement and volunteers have been morphed into new Nat Guard Regiments."
 USA_crisis_event.1140.o1: "Dios nos Salve a Todos"
 USA_venezuela_decision_TT: "Strategic Importance Of This Action:\n - §H[VEN.GetFlag] Venezuela§! has long been a thorn in the side of South American diplomacy. Their aggressive and anti-western nature makes it so that we have to tip-toe around their bursts of rage to talk with our partners in the region.\n - By toppling the §H[VEN.GetFlag] Venezuelan§! regime, we could achieve a friendly force in the region and bring about a new era in South America."
 USA_focus_2004_economic_deregulation_desc: "Para continuar con la expansión, debemos desregular aún más la economía. Podemos lograrlo atacando la legislación 'núcleo' que está llena de barreras para el crecimiento empresarial y la creación de nuevas empresas."
 USA_focus_2004_investments_desc: "Las inversiones gubernamentales limitadas en empresas clave impulsarán el PIB de nuestra nación y crearán más empleos como resultado del 'estímulo' hacia los sectores económicos seleccionados."
 USA_focus_2008_healthcare_desc: "Debemos mirar a nuestros homólogos británicos y ver que la atención médica para todos puede ser una realidad; como tal, aún debemos llegar a un compromiso con la oposición si queremos aprobar una política tan 'peligrosa'."
 USA_focus_2008_environment_deregulation_desc: "Debemos desregular estas engorrosas normativas 'verdes' para incentivar mejor al futuro emprendedor que desee iniciar un nuevo negocio."
 USA_focus_were_not_them_desc: "La oposición está aplicando una propaganda muy agresiva y la mayoría de sus 'afirmaciones' son claramente falsas. Debemos hacer todo lo posible para hacer frente a estas mentiras."
 USA_focus_we_arent_like_them_desc: "La oposición está aplicando una propaganda muy agresiva y la mayoría de sus 'afirmaciones' son claramente falsas. Debemos hacer todo lo posible para hacer frente a estas mentiras."
 USA_focus_strengthing_naval_training_efforts_desc: "Mediante el aumento de los estándares y requisitos, así como las mejoras generales en la forma y el contenido del adiestramiento de nuestro personal naval, sentaremos un nuevo precedente sobre cómo el marinero promedio responde a las condiciones del campo de batalla y a las situaciones de gestión de crisis, creando una fuerza más sólida y con mayores conocimientos."
 USA_focus_sierra_leone_peacekeepers: "'Cascos azules' en Sierra Leona"
 USA_focus_sierra_leone_peacekeepers_desc: "La nación está decentemente equipada pero no está logrando ningún progreso real; podemos enviar 'fuerzas de paz' como si estuviéramos vinculados a la ONU y ayudar a motivar la guerra hacia una dirección más positiva."
 USA_focus_joint_police_action: "'Acción policial' conjunta"
 USA_focus_joint_police_action_desc: "La acción policial en la que se ha convertido la guerra civil de Sierra Leona se presenta prometedora hacia un nuevo tipo de política exterior. Debemos buscar refinar y redefinir el término 'acción policial', no sea que muchos comiencen a repetir los sentimientos de la época de la guerra de Vietnam."
 USA_focus_foreign_aid_desc: "The international community is wary of our more or less candid silence towards the mideast crisis. Let's try and calm this view by giving some \"foreign aid\" to those fighting for the \"right\" cause."
 USA_focus_everyone_has_their_price_desc: "La guerra se ha estado prolongando durante algún tiempo y lo último que necesitamos es irnos con las manos vacías. Podemos presionar a uno o varios grupos para llegar a un compromiso o a algún beneficio 'mutuo' para nosotros en caso de que su facción gane la guerra."
 USA_taxing_smarter_desc: "Defender un sistema fiscal progresivo, desglosando las disparidades de ingresos y presionando por la justicia económica."
 USA_american_anarchist_society_collectivizes_victory_desc: "En una serie de eventos sorprendentes y casi desconcertantes, la Sociedad Anarquista se ha abierto paso hasta el liderazgo. A través de los esfuerzos por vender sus ideas, así como por asegurar votos en las elecciones de liderazgo, suficientes miembros de la Sociedad Anarquista han inclinado la balanza a su favor para asegurar el liderazgo de la mayoría sobre el partido. Ahora todo el mundo contempla con asombro a la espera de ver qué hará exactamente un 'gobierno anarquista'."
 USA_cosmetic_tag_fascist_completed_desc: "Declara la §YUnión [USA.GetAdjective]§! y cambia el nombre del país en consecuencia."
 USA_cosmetic_tag_military_junta_completed_desc: "Establece una §YJunta Militar§! y cambia el nombre del país en consecuencia."
 USA_cosmetic_tag_monarchist_desc: "Proclama el §YImperio [USA.GetAdjective]§! y cambia el nombre del país en consecuencia."
 USA_cosmetic_tag_red_junta_desc: "Forma el §YComisariado Revolucionario§! y cambia el nombre del país en consecuencia."
 USA_fascist_closing_borders_desc: "§RCierra las fronteras§! de [USA.GetName]."
 USA_free_american_territories_desc: "Establece los §YTerritorios Libres de América§! y cambia el nombre del país en consecuencia."
