 idea_focus_energy_preferred_fossil: "Énergie fossile encouragées"
 idea_focus_energy_preferred_fossil_desc: "Nous avons décidé de privilégier l’énergie fossile à l’énergie verte car elle est plus rentable et contribuera à apaiser les problèmes ici et maintenant."
 idea_focus_energy_preferred_renewable: "Énergies renouvelables encouragées"
