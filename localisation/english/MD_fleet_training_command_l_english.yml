 MD_ftc_exercise_capital: "Carrier and Surface Group Exercise"
 MD_ftc_exercise_capital_desc: "Carrier strike group workups and surface action drills. Flight deck cycles, air defense coordination and replenishment at sea are rehearsed together."
 MD_ftc_ex_capital_short: "Capital ship doctrine mastery for 90 days."
 MD_ftc_exercise_escort: "Escort Exercise"
 MD_ftc_exercise_escort_desc: "Convoy screening and anti-submarine drills for destroyers, frigates and corvettes. Sonar handling, helicopter coordination and formation station keeping are practiced at sea."
 MD_ftc_ex_escort_short: "Escort doctrine mastery for 90 days."
 MD_ftc_exercise_submarine: "Submarine Exercise"
 MD_ftc_exercise_submarine_desc: "Patrol and torpedo firing exercises for the submarine service. Crews rehearse quiet running, evasion against surface escorts and coordinated attacks."
 MD_ftc_ex_submarine_short: "Submarine doctrine mastery for 90 days."
 MD_ftc_exercise_operations: "Fleet Readiness Exercise"
 MD_ftc_exercise_operations_desc: "A fleet-wide readiness cycle covering command and control, logistics and damage control. Ships train to sustain operations far from home ports."
 MD_ftc_ex_operations_short: "Naval operations mastery for 90 days."
 MD_ftc_exercise_program_level_1_tt: "Daily mastery from each fleet exercise rises from §Y0.5§! to §G0.75§!."
 MD_ftc_exercise_program_level_2_tt: "Daily mastery from each fleet exercise rises from §Y0.75§! to §G1.0§!."
 MD_ftc_exercise_program_level_3_tt: "Daily mastery from each fleet exercise rises from §Y1.0§! to §G1.25§!."
 MD_ftc_staff_course_name: "Staff Course"
 MD_ftc_staff_course_short: "Every navy leader gains experience."
 MD_ftc_staff_course_cooldown: "Staff Course in Session"
 MD_ftc_staff_course_cooldown_desc: "Navy staff officers are attending the fleet staff course. The next intake opens when this class graduates."
 MD_ftc_flag_officer_course_name: "Flag Officer Course"
 MD_ftc_flag_officer_course_short: "One navy leader gains a skill level."
 MD_ftc_flag_officer_course_cooldown: "Flag Officer Course in Session"
 MD_ftc_flag_officer_course_cooldown_desc: "Senior officers are completing command training for flag rank. A new course can begin once this class has finished."
 MD_ftc_rnd_liaison_name: "Naval R&D Liaison"
 MD_ftc_rnd_liaison_short: "Gain a naval breakthrough point."
 MD_ftc_rnd_liaison_cooldown: "Naval R&D Liaison Active"
 MD_ftc_rnd_liaison_cooldown_desc: "Fleet officers are seconded to naval research establishments, turning operational lessons into development requirements."
 MD_ftc_academy_name: "Training Syllabus"
 MD_ftc_academy_short: "Unlocks a $naval_academy_spirit$ for your grand doctrine and raises fleet exercise mastery."
 MD_ftc_academy_level_text: "Level [?ROOT.MD_ftc_academy_level|0]/3"
 MD_ftc_fleet_name: "Fleet Readiness Program"
 MD_ftc_fleet_short: "Unlocks a $navy_spirit$ for your grand doctrine."
 MD_ftc_fleet_level_text: "Level [?ROOT.MD_ftc_fleet_level|0]/3"
 MD_ftc_command_name: "Maritime Doctrine Center"
 MD_ftc_command_short: "Unlocks a $naval_command_spirit$ for your grand doctrine."
 MD_ftc_command_level_text: "Level [?ROOT.MD_ftc_command_level|0]/3"
 MD_ftc_academy_blue_water_name: "Carrier Warfare School"
 MD_ftc_academy_blue_water_desc_text: "Instruction in flight deck operations, air wing coordination and carrier group command prepares future task force leaders."
 MD_ftc_academy_green_water_name: "Littoral Warfare School"
 MD_ftc_academy_green_water_desc_text: "Officers of the coastal fleet study shallow water operations, mine countermeasures and the defense of harbor approaches."
 MD_ftc_academy_jeune_ecole_name: "Fast Attack Craft School"
 MD_ftc_academy_jeune_ecole_desc_text: "Officers train in missile boat, patrol craft and corvette tactics built around speed and massed light forces."
 MD_ftc_academy_guerre_de_course_name: "Submarine Command Course"
 MD_ftc_academy_guerre_de_course_desc_text: "Prospective submarine captains train in covert patrol, attack approach and the interdiction of merchant shipping."
