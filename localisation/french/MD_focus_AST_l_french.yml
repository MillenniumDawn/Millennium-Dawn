 australia_abbottgov_focus: "Le gouvernement Abbott"
 tony_abbott_desc: "La carrière de Tony a été une performance : esquiver les critiques et les déverser sur ses adversaires. Chef de l'opposition d'une efficacité féroce, Tony a mené le parti vers une ligne plus dure, avec un goût pour populariser ses slogans en trois mots. \n\nNé à Londres, élevé à Sydney comme catholique romain et formé chez les jésuites, la première priorité de Tony à l'école était de devenir prêtre. Un désir profond de service et de direction spirituelle l'a poussé à revenir au Royaume-Uni comme étudiant à Oxford, apprenant autant qu'il le pouvait avant son engagement. Pourtant, malgré l'adoration, ses inclinations politiques ne l'ont jamais quitté. \n\nSon organisation régulière de meetings et de manifestations l'a opposé à la direction étudiante de gauche d'Oxford, jusqu'à des heurts violents. De retour en Australie, Tony suivrait son intention première et entrerait au séminaire en 1984, à 26 ans. Après trois ans, il avouerait être « une cheville carrée dans un trou rond », et que la prêtrise n'était tout simplement pas faite pour lui. \n\nPuisque sa dévotion ne suffisait pas à vaincre son amour pour l'excitation de la politique, Tony rejoignit The Bulletin comme journaliste, menant au poste de secrétaire de presse du Parti libéral. L'homme de parti expérimenté et clivant a désormais atteint le plus haut siège de la nation."
 executive_management_ast: "Direction exécutive"
 the_turnbull_government_desc: "Il n'y a pas de contenu pour cet arbre pour le moment. Un arbre de focuses Turnbull sera développé plus tard ; pour l'instant, ce focus est un placeholder."
 collapsing_state_sol: "État en effondrement"
 collapsing_state_sol_desc: "L'ordre public s'est effectivement effondré dans le pays, de vastes zones étant contrôlées par des bandes de policiers hors-la-loi et de militants armés. Le peu d'économie qui reste est en chute libre, et le gouvernement lui-même est coincé au parlement. Sans finances ni autorité pour maîtriser la spirale."
 collapsing_state_sol_1: "État fragile"
 collapsing_state_sol_1_desc: "La majorité des militants ont été désarmés et restent sous la garde de l'État. L'ordre a été rétabli dans quelques villes, mais la situation demeure dans un équilibre délicat."
 collapsed_state_sol: "État effondré"
 collapsed_state_sol_desc: "Alors que beaucoup d'habitants continuent de fuir les îles, les militants restants continuent de picorer la carcasse d'une nation morte. Les dernières lumières de la démocratie se sont éteintes, et il reste peu d'espoir pour ceux qui tentent de survivre."
