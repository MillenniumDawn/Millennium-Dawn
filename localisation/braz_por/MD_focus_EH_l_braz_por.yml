 sp_monitor_portal_energy_emissions_project: "Monitorar as Emissões de Energia dos Portais"
 sp_monitor_portal_energy_emissions_project_desc: "Com a ajuda de nossos satélites, monitoraremos as emissões de energia do Portal mais próximo. Isso nos permitirá reunir mais informações sobre o inimigo e suas movimentações. Se tivermos sucesso, também poderemos eliminar as falhas cíclicas em nossa rede de satélites causadas por essas emissões."
 sp_monitor_portal_energy_emissions_project_prototype: "Marcações de Energia Irregulares"
 sp_monitor_portal_energy_emissions_project_prototype_desc: "Nossos satélites danificados conseguiram relatar algumas marcações de energia irregulares que captam constantemente dos Portais. Parece que elas são responsáveis pelas falhas em nossa rede de satélites. Podemos preparar contramedidas para proteger nossos satélites dessas emissões ou gastar mais tempo pesquisando esse fenômeno para compreendê-lo melhor."
 sp_monitor_portal_energy_emissions_project_prototype_a: "O Progresso É o Mais Importante"
 sp_monitor_portal_energy_emissions_project_prototype_b: "Dedicar Tempo a Pesquisas Adicionais"
 sp_spies_in_hive_project: "Espiões na Colmeia"
 sp_spies_in_hive_project_desc: "Algumas unidades das Quimeras voltam à zona de seu Portal após um assalto bem-sucedido. Elas parecem ter um comportamento quase instintivo nessa fase, criando uma janela de oportunidade para marcá-las com um rastreador e uma pequena câmera. Depois, vamos deixá-las voltar ao Portal. O que poderia dar errado?"
 sp_spies_in_hive_project_prototype: "Os Mechas Podem Ser Nossos Entregadores"
 sp_spies_in_hive_project_prototype_desc: "Como estamos produzindo mechas, podemos usá-los para colocar rastreadores durante o combate contra as forças das Quimeras. Será arriscado e certamente perderemos muitas boas máquinas e seus pilotos, mas isso pode nos aproximar do fim desta guerra."
 sp_spies_in_hive_project_prototype_a: "Usar apenas mechas"
 sp_spies_in_hive_project_prototype_b: "Não podemos perder mechas demais, o exército ajudará"
 sp_spies_in_hive_project_prototype_c: "Não correr riscos adicionais"
 sp_the_tesla_weapon_project: "A Arma T.E.S.L.A."
 sp_the_tesla_weapon_project_desc: "O Sistema Eletromagnético Tático de Aniquilação Linear (T.E.S.L.A.) é uma superarma projetada para emitir um poderoso pulso eletromagnético (EMP) capaz de desativar sistemas eletrônicos em um amplo raio. Essa arma pode ser a nossa chave para desestabilizar os Portais e enfraquecer permanentemente as forças das Quimeras."
 sp_the_tesla_weapon_project_prototype: "Redirecionando o Setor de Pesquisa"
 sp_the_tesla_weapon_project_prototype_desc: "Podemos redirecionar todos os nossos esforços de pesquisa para o desenvolvimento da arma T.E.S.L.A. Isso acelerará o projeto, mas pode atrasar outras iniciativas de pesquisa importantes."
 sp_the_tesla_weapon_project_prototype_a: "Concentrar toda a pesquisa no T.E.S.L.A."
 sp_the_tesla_weapon_project_prototype_b: "Equilibrar os esforços de pesquisa"
 sp_the_tesla_weapon_project_prototype_c: "Não podemos nos dar ao luxo de atrasos"
 sp_hacs_gen_one_project: "BF-38 Atlas"
 sp_hacs_gen_one_project_desc: "A primeira geração dos mechas do Sistema de Combate de Alta Agilidade (HACS) será um marco significativo em nossa luta contra as Quimeras. Esses mechas serão nosso maior trunfo contra as forças das Quimeras."
 sp_hacs_gen_one_project_prototype_western_one: "Durabilidade ou Poder de Fogo?"
 sp_hacs_gen_one_project_prototype_western_one_desc: "O campo de batalha é um lugar brutal, e nossos mechas precisam resistir a fogo pesado ao mesmo tempo que desferem golpes poderosos no inimigo. Podemos nos concentrar em aumentar a durabilidade de nossos HACS, tornando-os mais resistentes em combate. Como alternativa, podemos priorizar o poder de fogo, equipando nossos mechas com armamento avançado para derrubar inimigos rapidamente."
 sp_hacs_gen_one_project_prototype_western_one_a: "Aumentar a durabilidade"
 sp_hacs_gen_one_project_prototype_western_one_b: "Priorizar o poder de fogo"
 sp_hacs_gen_one_project_prototype_western_one_c: "Está perfeito como está agora"
 sp_hacs_gen_one_project_prototype_western_two: "Prioridade dos Componentes do HACS"
 sp_hacs_gen_one_project_prototype_western_two_desc: "Temos alguns fundos sobrando para melhorar o projeto do HACS. Podemos nos concentrar em aprimorar a mobilidade de nossos mechas, tornando-os mais rápidos e ágeis no campo de batalha. Como alternativa, podemos investir em melhorar seus sistemas de armas, aumentando sua capacidade ofensiva."
 sp_hacs_gen_one_project_prototype_western_two_a: "Focar na mobilidade"
 sp_hacs_gen_one_project_prototype_western_two_b: "Focar no armamento"
 sp_hacs_gen_one_project_prototype_eastern_one: "Possível Redução na Produção"
 sp_hacs_gen_one_project_prototype_eastern_one_desc: "Podemos dispensar alguns dos gatilhos de segurança e sistemas redundantes do projeto do HACS para acelerar a produção. Embora isso possa levar a um pequeno aumento nas taxas de falha, nos permitirá mobilizar mais mechas ao campo de batalha mais rapidamente."
 sp_hacs_gen_one_project_prototype_eastern_one_a: "Precisamos deles o quanto antes"
 sp_hacs_gen_one_project_prototype_eastern_one_b: "Devemos nos dedicar mais a isso"
 sp_hacs_gen_one_project_prototype_eastern_one_c: "Manter os padrões atuais de produção"
 sp_hacs_gen_one_project_prototype_eastern_two: "Eficácia no Campo de Batalha"
 sp_hacs_gen_one_project_prototype_eastern_two_desc: "Podemos construir um número maior de mechas HACS para sobrepujar o inimigo pela simples força numérica. Como alternativa, podemos nos concentrar em aprimorar o projeto de nossos mechas para torná-los mais eficazes em combate, mesmo que isso signifique produzir menos unidades."
 sp_hacs_gen_one_project_prototype_eastern_two_a: "Precisamos de mais mechas"
 sp_hacs_gen_one_project_prototype_eastern_two_b: "Vamos melhorar o projeto deles"
 sp_hacs_gen_two_project: "GSK-41 Bogatyr"
 sp_hacs_gen_two_project_desc: "Chegou o momento de mais uma atualização de nossos majestosos e novíssimos mechas HACS. Graças a engenheiros e cientistas civis apaixonados, conseguimos aprimorar ainda mais o projeto de nossos mechas. Talvez até encontremos uma forma de torná-los mais baratos de produzir."
 sp_hacs_gen_two_project_prototype_western_one: "Redução do Custo de Randallita"
 sp_hacs_gen_two_project_prototype_western_one_desc: "Revirando antigas anotações de pesquisa, encontramos algumas ideias sobre como reduzir a quantidade de Randallita usada na produção do HACS. Com essas mudanças, podemos diminuir o custo de cada mecha sem prejudicar significativamente seu desempenho."
 sp_hacs_gen_two_project_prototype_western_one_a: "Claro!"
 sp_hacs_gen_two_project_prototype_western_one_b: "Não podemos enfraquecer nossos mechas"
 sp_hacs_gen_two_project_prototype_eastern_one: "Redução do Custo de Randallita"
 sp_hacs_gen_two_project_prototype_eastern_one_desc: "Graças às novas pesquisas sobre a Randallita, encontramos uma forma de reduzir ainda mais a quantidade desse precioso recurso usada na produção do HACS. Isso nos permitirá produzir mais mechas com a mesma quantidade de Randallita, mas as máquinas terão que sacrificar parte do desempenho."
 sp_hacs_gen_two_project_prototype_eastern_one_a: "Claro, por que não"
 sp_hacs_gen_two_project_prototype_eastern_one_b: "É desvantagem demais no campo de batalha"
 sp_hacs_gen_three_project: "SAS-32 Hércules"
 sp_hacs_gen_three_project_desc: "Esta é a atualização perfeita dos mechas HACS, o modelo de mecha HACS mais poderoso que podemos fabricar atualmente, capaz de maximizar nossa capacidade de lutar contra as Quimeras."
 sp_hacs_gen_three_project_prototype_one: "A Arma Final"
 sp_hacs_gen_three_project_prototype_one_desc: "Nossos engenheiros propuseram um redesenho radical dos mechas HACS, com o objetivo de criar a arma definitiva contra as Quimeras. Esse novo projeto ultrapassará os limites da tecnologia atual, resultando em um mecha mais rápido, mais forte e mais resistente do que nunca, mas a um preço muito mais alto."
 sp_hacs_gen_three_project_prototype_one_a: "Essa é a arma definitiva"
 sp_hacs_gen_three_project_prototype_one_b: "Precisamos deles agora!"
 sp_hacs_gen_three_project_prototype_one_c: "O projeto atual é perfeito"
 EH_spirits_lasts_until_war_is_active_TT: "§YEste Espírito Nacional durará enquanto estivermos em guerra com os Invasores.§!"
 EH_defence_decrease_blocked_while_at_war_with_ALN_TT: "§RO Gasto Militar não pode ser reduzido enquanto estivermos em guerra com os Invasores.§!"
 EH_the_country_of_war_idea_TT: "§YAdiciona o modificador O País da Guerra.§!\n§RRemovido quando os requisitos do foco não forem atendidos.§!"
 EH_controlled_situation_idea_TT: "§YAdiciona o modificador Situação Controlada§!\n§RRemovido quando os requisitos do foco não forem atendidos.§!"
 EH_territorial_defense_idea_TT: "§YAdiciona o modificador Defesa Territorial§!"
 EH_electric_traps_TT: "Ativa as decisões de §YArmadilhas Elétricas§!, que aparecerão no mapa durante a guerra contra as Quimeras (com a aba de decisões ativas). Cada armadilha pode ser instalada em um estado controlado que seja de §Yprimeira linha§! ou §Ysegunda linha§!. Instalar a armadilha custará §R1 Metal Tecnológico§! e ela usará §R100 MW§! de energia enquanto estiver ativa.\n\nA armadilha ficará ativa por §Y10 dias§! e depois entrará em recarga por §Y15 dias§!. Enquanto a armadilha estiver ativa, todas as unidades inimigas no estado receberão §G+20%§! de §Ydesgaste§! e §G-15%§! de §Yvelocidade de movimento§!. A armadilha pode ser removida, o que devolverá §G1 Metal Tecnológico§!."
