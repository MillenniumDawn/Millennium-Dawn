 module_surface_fut_reactor_power2: "Reactor hiperavanzado"
 module_surface_fut_reactor_power2_desc: "Los reactores de próxima generación proporcionan un rendimiento máximo, una eficiencia excepcional y una autonomía casi ilimitada para los buques de superficie más modernos.\n\n§GConsejo de diseño: La propulsión nuclear proporciona una velocidad mejorada, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para flotas desplegadas globalmente, pero su construcción es extremadamente costosa.§!"
 module_surface_fut_reactor_power3: "Reactor ultraavanzado"
 module_surface_fut_reactor_power3_desc: "Los reactores de próxima generación proporcionan un rendimiento máximo, una eficiencia excepcional y una autonomía casi ilimitada para los buques de superficie más modernos.\n\n§GConsejo de diseño: La propulsión nuclear proporciona una velocidad mejorada, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para flotas desplegadas globalmente, pero su construcción es extremadamente costosa.§!"
 module_sub_diesel_electric_power6: "Propulsión diésel-eléctrica 6"
 module_sub_diesel_electric_power6_desc: "La propulsión diésel-eléctrica de próxima generación ofrece un equilibrio óptimo de velocidad, autonomía y sigilo en inmersión para los submarinos modernos.\n\n§GConsejo de diseño: La propulsión diésel-eléctrica ofrece un submarino asequible y dependiente de combustible con velocidad, alcance máximo y sigilo mejorados en los niveles posteriores. Es ideal para operaciones locales y regionales, pero no puede igualar la autonomía global de un reactor.§!"
 module_sub_diesel_electric_power7: "Propulsión diésel-eléctrica 7"
 module_sub_diesel_electric_power7_desc: "La propulsión diésel-eléctrica de próxima generación ofrece un equilibrio óptimo de velocidad, autonomía y sigilo en inmersión para los submarinos modernos.\n\n§GConsejo de diseño: La propulsión diésel-eléctrica ofrece un submarino asequible y dependiente de combustible con velocidad, alcance máximo y sigilo mejorados en los niveles posteriores. Es ideal para operaciones locales y regionales, pero no puede igualar la autonomía global de un reactor.§!"
 module_sub_fut_reactor_power2: "Potencia de reactor hiperavanzada"
 module_sub_fut_reactor_power2_desc: "Hyper advanced nuclear reactors deliver unparalleled endurance, speed, and stealth capabilities for near-future submarines.\n\n§GDesigner Hint: Nuclear Propulsion gives submarines high Speed, exceptional Max Range, and fuel-free operation. It suits global deployments, but costs more IC and is generally easier to detect than diesel-electric propulsion.§!"
 module_sub_fut_reactor_power3: "Potencia de reactor ultraavanzada"
 module_sub_fut_reactor_power3_desc: "Los reactores nucleares ultraavanzados ofrecen una autonomía, velocidad y capacidades de sigilo inigualables para los submarinos del futuro cercano.\n\n§GConsejo de diseño: La propulsión nuclear otorga a los submarinos una alta velocidad, un alcance máximo exceptional y un funcionamiento libre de combustible. Es ideal para despliegues globales, pero cuesta más capacidad industrial (IC) y es generalmente más fácil de detectar que la propulsión diésel-eléctrica.§!"
 module_light_helipad_3: "Helipista ligera III"
 module_light_helipad_3_desc: "Las helipistas ligeras optimizadas proporcionan un mejor soporte para las operaciones de ala rotatoria, mejorando las capacidades ASW, de vigilancia y de transporte.\n\n§GConsejo de diseño: Las helipistas ligeras mejoran la detección de submarinos, la guerra antisubmarina, la detección de superficie y el dragado de minas a un coste menor que las helipistas completas. Son ideales para escoltas ASW pequeños, pero aun así añaden uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_76mm_gun_5: "76 mm de tiro ultrarrápido - Munición guiada avanzada"
 module_76mm_gun_5_desc: "Los cañones de tiro ultrarrápido de 76 mm con munición guiada avanzada proporcionan un rendimiento antiaéreo y de superficie excepcional a distancias cortas y medias.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_76mm_gun_6: "76 mm de tiro ultrarrápido - Munición guiada de vanguardia"
 module_76mm_gun_6_desc: "Los cañones de tiro ultrarrápido de 76 mm con munición guiada de vanguardia proporcionan un rendimiento antiaéreo y de superficie excepcional a distancias cortas y medias.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_127mm_guns_5: "127 mm V"
 module_127mm_guns_5_desc: "Los cañones navales de 127 mm altamente avanzados proporcionan una precisión, alcance y cadencia de tiro superiores, lo que los hace eficaces tanto contra buques como contra aeronaves.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_127mm_guns_6: "127 mm VI"
 module_127mm_guns_6_desc: "Los cañones navales de 127 mm altamente avanzados proporcionan una precisión, alcance y cadencia de tiro superiores, lo que los hace eficaces tanto contra buques como contra aeronaves.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 tech_light_guns_5: "Cañones navales 2060"
 tech_light_guns_5_desc: "Sistemas de armas navales tanto de pequeño como de gran calibre, diseñados para permitir el combate contra objetivos tanto de superficie como aéreos."
 tech_light_guns_6: "Cañones navales 2075"
 tech_light_guns_6_desc: "Sistemas de armas navales tanto de pequeño como de gran calibre, diseñados para permitir el combate contra objetivos tanto de superficie como aéreos."
 nsb_drone_tech_4: "Tecnología de drones hiperavanzada"
 nsb_drone_tech_4_desc: "Armas de drones montadas en un helicóptero, configuradas tanto para funciones ofensivas como defensivas."
 nsb_drone_tech_5: "Tecnología de drones ultraavanzada"
 nsb_drone_tech_5_desc: "Armas de drones montadas en un helicóptero, configuradas tanto para funciones ofensivas como defensivas."
 nsb_defense_tech_5: "Defensa láser avanzada"
 nsb_defense_tech_5_desc: "Un sistema de defensa de energía dirigida capaz de inutilizar físicamente los proyectiles entrantes. Dispara un láser de alta energía para destruir o desviar misiles antes del impacto. Representa la última generación de protección activa para aeronaves de ala rotatoria."
 nsb_defense_tech_6: "Defensa láser hiperavanzada"
 nsb_defense_tech_6_desc: "Un sistema de defensa de energía dirigida capaz de inutilizar físicamente los proyectiles entrantes. Dispara un láser de alta energía para destruir o desviar misiles antes del impacto. Representa la última generación de protección activa para aeronaves de ala rotatoria."
 nsb_gun_pods_tech_6: "Contenedores de cañones de 6.ª gen."
 nsb_gun_pods_tech_6_desc: "Sistemas de armas de montaje externo diseñados para mejorar las capacidades ofensivas de las aeronaves de ala rotatoria. Estos contenedores permiten a los helicópteros transportar armamento adicional sin realizar modificaciones significativas en sus estructuras, proporcionando flexibilidad y una mayor potencia de fuego para diversos perfiles de misión."
 nsb_gun_pods_tech_7: "Contenedores de cañones de 7.ª gen."
 nsb_gun_pods_tech_7_desc: "Sistemas de armas de montaje externo diseñados para mejorar las capacidades ofensivas de las aeronaves de ala rotatoria. Estos contenedores permiten a los helicópteros transportar armamento adicional sin realizar modificaciones significativas en sus estructuras, proporcionando flexibilidad y una mayor potencia de fuego para diversos perfiles de misión."
 nsb_rocket_pods_tech_6: "Contenedores de cohetes de 6.ª gen."
 nsb_rocket_pods_tech_6_desc: "Los contenedores de cohetes para helicópteros son lanzadores externos fijados a las aeronaves que permiten el despliegue de cohetes guiados o no guiados para diversas misiones de combate. Estos contenedores mejoran significativamente la potencia de fuego de un helicóptero, permitiendo un combate eficaz contra objetivos terrestres, la supresión de posiciones enemigas y operaciones de apoyo aéreo cercano."
 nsb_rocket_pods_tech_7: "Contenedores de cohetes de 7.ª gen."
 nsb_rocket_pods_tech_7_desc: "Los contenedores de cohetes para helicópteros son lanzadores externos fijados a las aeronaves que permiten el despliegue de cohetes guiados o no guiados para diversas misiones de combate. Estos contenedores mejoran significativamente la potencia de fuego de un helicóptero, permitiendo un combate eficaz contra objetivos terrestres, la supresión de posiciones enemigas y operaciones de apoyo aéreo cercano."
 nsb_atgm_tech_6: "ATGM de 6.ª gen."
 nsb_atgm_tech_6_desc: "Anti-Tank Guided Missile (ATGM) pods are external systems mounted on helicopters, enabling the deployment of guided missiles designed to engage and destroy armored vehicles, fortifications, and other ground targets with high precision. These pods significantly enhance a helicopter's offensive capabilities, allowing for effective engagement in various combat scenarios."
 nsb_atgm_tech_7: "ATGM de 7.ª gen."
 nsb_atgm_tech_7_desc: "Anti-Tank Guided Missile (ATGM) pods are external systems mounted on helicopters, enabling the deployment of guided missiles designed to engage and destroy armored vehicles, fortifications, and other ground targets with high precision. These pods significantly enhance a helicopter's offensive capabilities, allowing for effective engagement in various combat scenarios."
 nsb_multiple_atgm_tech_6: "Montaje cuádruple de ATGM de 6.ª gen."
 nsb_multiple_atgm_tech_6_desc: "Un contenedor cuádruple de ATGM (misiles guiados antitanque) se refiere a un sistema lanzador equipado con cuatro misiles listos para disparar, lo que mejora la capacidad de una plataforma para atacar múltiples objetivos blindados en rápida sucesión. Estas configuraciones a menudo se integran en varios vehículos militares, incluidos los transportes blindados de personal y los vehículos de combate de infantería, para reforzar su efectividad contra el blindaje."
 nsb_multiple_atgm_tech_7: "Montaje cuádruple de ATGM de 7.ª gen."
 nsb_multiple_atgm_tech_7_desc: "Un contenedor cuádruple de ATGM (misiles guiados antitanque) se refiere a un sistema lanzador equipado con cuatro misiles listos para disparar, lo que mejora la capacidad de una plataforma para atacar múltiples objetivos blindados en rápida sucesión. Estas configuraciones a menudo se integran en varios vehículos militares, incluidos los transportes blindados de personal y los vehículos de combate de infantería, para reforzar su efectividad contra el blindaje."
 nsb_heavy_atgm_tech_6: "ATGM pesado de 6.ª gen."
 nsb_heavy_atgm_tech_6_desc: "Los misiles guiados antitanque (ATGM) pesados fueron desarrollos tempranos en la tecnología de misiles diseñados para entablar combate y destruir vehículos blindados. Estos sistemas empleaban típicamente guía de comando manual a la línea de visión (MCLOS), lo que requería que los operadores dirigieran manualmente el misil hacia el objetivo durante todo su vuelo. Este método exigía un entrenamiento extensivo y exponía a los operadores al fuego enemigo durante la guía del misil."
 nsb_heavy_atgm_tech_7: "ATGM pesado de 7.ª gen."
 nsb_heavy_atgm_tech_7_desc: "Los misiles guiados antitanque (ATGM) pesados fueron desarrollos tempranos en la tecnología de misiles diseñados para entablar combate y destruir vehículos blindados. Estos sistemas empleaban típicamente guía de comando manual a la línea de visión (MCLOS), lo que requería que los operadores dirigieran manualmente el misil hacia el objetivo durante todo su vuelo. Este método exigía un entrenamiento extensivo y exponía a los operadores al fuego enemigo durante la guía del misil."
 nsb_engine_tech_6: "Motores de helicóptero de 6.ª gen."
 nsb_engine_tech_6_desc: "Plantas motrices especializadas diseñadas para proporcionar el empuje y la sustentación necesarios para las aeronaves de ala rotatoria."
 nsb_engine_tech_7: "Motores de helicóptero de 7.ª gen."
 nsb_engine_tech_7_desc: "Plantas motrices especializadas diseñadas para proporcionar el empuje y la sustentación necesarios para las aeronaves de ala rotatoria."
