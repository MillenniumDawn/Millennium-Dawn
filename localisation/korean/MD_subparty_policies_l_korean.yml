l_korean:
 subparty_policies_category: "이념적 갈등"
 subparty_policies_category_desc: "우리 정당은 우리의 이념으로 정의됩니다. 우리가 세계를 보는 시각은 이념을 이해하고 접근하는데 있어 독특한 방법을 제시합니다."
 generic_admit_5_year_plan_failure: "5개년 개획의 실패 인정"
 generic_admit_5_year_plan_failure_desc: "We have to admit that the plans we made for our grandiose 5-year-plan were a bit too overambitious to say the least. Admitting that is definitely a hard piece to swallow, and will only show our weakness to the world. It definitely won't be an agreeable solution for many of the party members."
 generic_nationalise_biggest_influencer_industries: "[?var:influence_array^0.GetFlag] [?var:influence_array^0.GetAdjective] 투자 국유화"
 generic_nationalise_biggest_influencer_industries_desc: "[?var:influence_array^0.GetFlag][?var:influence_array^0.GetName] moves a large amount of money through our country. They are abusing our people for capitalistic gains and that needs to be stopped. We should nationalise some of the [?var:influence_array^0.GetAdjective] holdings in our country."
 generic_nationalise_second_biggest_influencer_industries: "[?var:influence_array^1.GetFlag] [?var:influence_array^1.GetAdjective] 투자 국유화"
 generic_nationalise_second_biggest_influencer_industries_desc: "[?var:influence_array^1.GetFlag][?var:influence_array^1.GetName] moves a large amount of money through our country. They are abusing our people for capitalistic gains and that needs to be stopped. We should nationalise some of the [?var:influence_array^1.GetAdjective] holdings in our country."
 generic_form_paramilitary_units: "청소년 준군사조직 창설"
 generic_form_paramilitary_units_desc: "우리 청년들이 게으르고 타락해가고 있습니다. 그들에게 유용한 생활 기술과 군사 기술, 그리고 물론 당에 대한 충성심을 가르칠 수 있는 준군사 조직을 만들어야 합니다."
 TT_ABANDON_5_YEAR_PLAN: "§H[Root.GetLeader]§!가 불가사의하게 사라졌습니다.\n다행히 §H[show_ruling_party]§!에는 지도자가 되기를 간절히 원하는 사람이 있습니다.\n\n"
 TT_HAS_20_INFLUENCE: "목표 대상이 우리에게 최소 20%의 영향력을 보유하고 있음"
