l_korean:
 yugo_nost_overview: "@SLV [SLV.GetName] §Y[?SLV.yugo_nostalgia|0]%§!\n@CRO [CRO.GetName] §Y[?CRO.yugo_nostalgia|0]%§!\n@BOS [BOS.GetName] §Y[?BOS.yugo_nostalgia|0]%§!\n@SER [SER.GetName] §Y[?SER.yugo_nostalgia|0]%§!\n@FYR [FYR.GetName] §Y[?FYR.yugo_nostalgia|0]%§!\n@MNT [MNT.GetName] §Y[?MNT.yugo_nostalgia|0]%§!\n@KOS [KOS.GetName] §Y[?KOS.yugo_nostalgia|0]%§!"
 yugo_nost_rise_tt: "§Y+[?temp_yugo_nost_gain|0]§! 유고노스탤지어: [THIS.GetFlag] [THIS.GetName]"
 yugo_consensus_tt: "생존한 모든 승계국이 최소 75%의 유고노스탤지어를 보유"
 yugo_nost_ser_ready_tt: "@SER [SER.GetName]의 유고노스탤지어가 최소 75% 이상"
 yugo_dominant_tt: "우리가 구 공화국들 전반에서 가장 큰 영향력을 보유하며 유고슬라비아 부활을 주도함"
 yugo_dominant_none: "주도 회원국 없음"
 yugo_sends_invites_tt: "새로운 연방을 결성하기 위해 남아 있는 모든 구 유고슬라비아 국가에 초청장을 보냄"
 yugo_invite_accept_tt: "응답한 국가가 복원된 유고슬라비아 연방에 편입됩니다."
 yugo_invite_reject_tt: "응답한 국가는 독립을 유지하며, 연방은 해당 국가에 대한 통일 전쟁 목표를 얻습니다."
 yugoslavia.1.t: "유고슬라비아로의 초청"
 yugoslavia.1.d: "[FROM.GetName](이)가 우리를 복원된 유고슬라비아 연방에 가입하도록 초청했습니다. 수락은 편입을 의미하며, 거절할 경우 연방의 통일 운동이 우리를 향할 수 있습니다."
 yugoslavia.1.a: "연방에 가입한다"
 yugoslavia.1.b: "통일을 거부한다"
 yugoslavia.30.t: "유고슬라비아로 향하는 한 국가"
 yugoslavia.30.d: "복원된 유고슬라비아 연방에 대한 지지가 국민의 4분의 3을 넘어섰습니다. 1990년대에 묻혔던 그 구상이 이곳에서 다시금 살아 있는 정치 과제가 되었습니다."
 yugoslavia.30.a: "꿈은 계속된다"
 yugoslavia_news.20.t: "유고슬라비아 부활의 등장"
 yugoslavia_news.20.d: "유고슬라비아 붕괴 후 거의 10년이 지난 지금, 수년간의 전쟁과 극단적 민족주의 통치가 발칸 반도 내에서 지정학적 부활을 키워 냈으며, 이 지역의 한 국가가 그 재건을 추진하기 시작했습니다. \n\n[GetYugoDominantName] 전역에서 '형제애와 통일'을 내건 현수막과 함께 퍼레이드가 열리고 복고풍 상점들이 생겨나고 있으며, 이는 1990년대의 민족 간 충돌과는 확연히 달라진 모습입니다. 이러한 재기는 통일된 발칸에 대한 추진력을 보여 주지만, 이 운동이 계속 성장할지 아니면 잃어버린 국가를 위한 마지막 노래로 남은 채 사그라질지는 불분명합니다."
 yugoslavia_news.20.a: "지역이 변하고 있다."
 formed_yugoslavia: "유고슬라비아의 영광"
 formed_yugoslavia_desc: "복원된 연방은 구 유고슬라비아 공화국들의 영토, 제도, 구성 민족을 통합할 책임을 맡았습니다."
 yugoslavia_restored: "유고슬라비아"
 yugo_bloc_dominant: "유고슬라비아 부활의 주도국"
 yugo_bloc_dominant_desc: "우리는 구 공화국들 전반에서 다른 어느 승계국보다 더 큰 영향력을 보유하고 있습니다. 우리의 수도는 복원된 연방에 관한 회담의 자연스러운 만남의 장소입니다."
 yugo_bloc: "유고슬라비아 재통일"
 yugo_bloc_desc: "통일이 진행되려면 생존한 모든 승계국에서 복원된 유고슬라비아에 대한 지지가 75퍼센트에 도달해야 합니다. 구 공화국들 전반에서 가장 큰 영향력을 가진 국가가 부활을 주도합니다. §Y[GetYugoDominantName]§!\n\n$yugo_nost_overview$"
 yugo_bloc_map: "유고슬라비아 재통일"
 yugo_promote_nostalgia: "[FROM.GetName]의 유고노스탤지어 고취"
 yugo_promote_nostalgia_desc: "복원된 연방에 대한 지지를 구축하기 위해 문화 교류, 공동 미디어, 합동 기념행사에 자금을 지원합니다. 대상 국가에 대한 의미 있는 영향력이 필요합니다."
 yugo_promote_own_nostalgia: "국내에서 유고노스탤지어 육성"
 yugo_promote_own_nostalgia_desc: "과거의 연방을 호의적으로 묘사하는 국내 기념행사, 학교 교육과정, 공영 미디어에 자금을 지원합니다. 해외에서 향수를 고취하는 것보다 느리고 비용이 많이 들지만, 다른 국가에 발판이 필요하지 않습니다."
 yugo_form_federation: "연방 소집"
 yugo_form_federation_desc: "생존한 모든 승계국을 복원된 유고슬라비아 연방에 참여하도록 소집합니다. 거부하는 국가는 연방에 통일 전쟁 목표를 부여합니다. 주도 회원국만이 회담을 소집할 수 있으며, 모든 승계국이 재통일을 지지할 때에만 가능합니다."
 news.85.t: "유고슬라비아 복원"
 news.85.desc: "복원된 유고슬라비아 연방의 설계자들이 구 공화국들 전반의 지지를 확보한 뒤 연방의 수립이 선포되었습니다. 신생 국가는 1990년대에 해체된 연방의 정치적, 전략적 유산을 계승한다고 주장합니다."
 news.85.a: "발칸의 한 국가가 돌아왔다"
 yugoslavia_not_restored_tt: "유고슬라비아가 다른 승계국에 의해 이미 복원된 상태가 §R아님§!"