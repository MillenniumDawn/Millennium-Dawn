l_korean:
 arms_factory: "군수산업"
 arms_factory_plural: "군수 산업체"
 dockyard: "조선소"
 dockyard_plural: "조선소"
 industrial_complex: "민간산업"
 industrial_complex_plural: "민간 산업체"
 industrial_complex_desc: "This building provides the state with industry for production of civilian goods or construction of new buildings. Can be converted to military industry if needed.\n\nProvides the state with:\nBase Number of Required Workers: §Y206K§!\nBase GDP Output per §YCivilian Industry§!: $§Y17.5 Billion§!\nBase Energy Consumption: §R-0.5§! GW\n"
 anti_air_building: "단거리방공시스템 기"
 anti_air_building_plural: "단거리방공시스템 기"
 anti_air_building_desc: "§Y단거리 방공시스템 기지(SHORAD Sites)§!는 저고도 공중 위협에 대해 대공 방어를 수행하기 위한 대공무기와 전술을 갖춘 복합체입니다. 기지는 영공을 방어 가능한 공역으로 나누어, 헬리콥터부터 저공비행 항공기와 제트기까지 이들로부터 지역의 군사 목표와 기반시설에 대한 대공 방어를 제공합니다."
 synthetic_refinery_desc: "This building provides the state with industry for production of synthetic rubber and some additional fuel production capability.\n\nProvides the state with:\nBase Number of Required Workers: §Y184K§!\nBase GDP Output per §YSynthetic Refinery§!: $§Y10 Billion§!\nBase Energy Consumption: §R-0.2§! GW\n\nProduces §YRubber§! at standard market rates, with surplus generating cash income on top of corporate tax.\n"
 nuclear_reactor_desc: "This building converts nuclear energy into electrical energy, consuming moderately enriched uranium in the process.\n\nProvides the state with:\nBase Number of Required Workers: §Y115K§!\nBase GDP Output per §YNuclear Reactor§!: $§Y4 Billion§!\nBase Power Gain: §G+5§! GW\n"
 radar_station_desc: "§YRadar Stations§! allows you to gain intel on enemy troops in nearby states. It consists of various radars and sensors, as well as intel assets and capacity to analyse the evolving situation.\nA higher level will increase its effective range.\nIts radars also provide the state with better detection of enemy air forces, giving your aircraft a better chance to engage them.\nIn addition the radars are increasing detection of enemy fleets at sea."
 fuel_silo: "전략 자원 비축고"
 fuel_silo_plural: "전략 자원 비축고"
 fuel_silo_desc: "The §YStrategic Resource Reserve§! is an amalgamation of warehouses, dry storage, and other §YFuel§! like storage. This building provides your nation with more room for stockpiling §HFuel§! and §HResources§!.\n\nNOTE: §YResource Storage§! has an engine limitation to where if you are on §Y$export_economy$§! or §Y$globalized_trade_economy$§! you may end up sending more resources to export than to your needed production lines. If you need to start to withdraw from storage it is recommended you switch to §Y$mixed_economy$§! or lower.\n"
 arms_factory_desc: "This building provides the state with industry for production of new military equipment. Can be converted to civilian industry if needed.\n\nProvides the state with:\nBase Number of Required Workers: §Y18.8K§!\nBase GDP Output per §YMilitary Industry§!: $§Y1.5 Billion§!\nBase Energy Consumption: §R-0.5§! GW"
 internet_station: "네트워크 기반시설"
 internet_station_plural: "네트워크 기반시설"
 internet_station_desc: "§YNetwork Infrastructure§! are tall structures used in the telecommunication and radio communication fields in order to push transmissions across great distances or underground fiber optic cables and cloud computing systems.\n\nProvides the state with:\nBase Number of Required Workers: §Y12K§!\nBase GDP Output per §YNetwork Infrastructure§!: $§Y3.5 Billion§!\n\nEach level of §YNetwork Infrastructure§! improves local productivity growth speed by §G+5.00%§!.\nEach level of §YNetwork Infrastructure§! reduces the duration of §YInternational Investments§! by §G-5.00%§!."
 dockyard_desc: "§YNaval Yards§! are representative of a state's ability to produce military vessels of all sorts ranging from §YPatrol Boats§!, §YConvoys§!, §YDestroyers§!, §YCarriers§! and more.\n\nProvides the state with:\nBase Number of Required Workers: §Y18.8K§!\nBase GDP Output per §YNaval Yard§!: $§Y1.5 Billion§!\nBase Energy Consumption: §R-0.5§! GW"
 air_base_desc: "An §YAir Base§! is a storage facility and a military compound for the deployment and preparation of your air forces. It can be stacked to level ten adding additional capacity of §Y24§! Planes per level."
 offices: "사무 지구"
 offices_plural: "사무 지구"
 offices_desc: "The §YOffice Sectors§! represent all the other industries of the economy beyond the extraction and heavy industries. These include financial, customer, information technology, retail services and so much more.\n\nProvides the state with:\nBase Number of Required Workers: §Y473K§!\nBase GDP Output per §YOffice Sector§!: $§Y50 Billion§!\nBase Energy Consumption: §R-0.25§! GW"
 rail_way_plural: "철도"
 fossil_powerplant: "화석연료 발전소"
 fossil_powerplant_plural: "화석연료 발전소"
 fossil_powerplant_desc: "§YFossil Fuel Powerplants§! is a catch-all for all fossil-based thermoelectric energy sources. These include but are not limited to; coal, natural gas and oil. §YFossil Fuel Powerplants§! will idle if energy generation is higher than consumption.\n\nProvides the state with:\nBase Number of Required Workers: §Y7.5K§!\nBase GDP Output per §YFossil Fuel Powerplant§!: $§Y1.7 Billion§!\nBase Power Gain: §G+2§! GW\n"
 fossil_powerplant_amount: "$VALUE|Y0=$"
 fossil_powerplant_resource: "£resources_strip|$FRAME$"
 agriculture_district: "상업화된 농업 지구"
 agriculture_district_plural: "상업화된 농업 지구"
 agriculture_district_desc: "§YCommercialized Agriculture Districts§! represents a catch-all for all non-subsistence Agriculture within our nation. It includes Agro-Industry, arable land, grain silos, butcherhouses and more.\n\nProvides the state with:\nBase Number of Required Workers: §Y188K§!\nBase GDP Output per §YCommercialized Agriculture District§!: $§Y25 Billion§!\nBase Energy Consumption: §R-0.10§! GW\n§YFuel Gain§! from States: 8\n§YLocal Supplies§!: 1.5%\n"
 agriculture_district_amount: "$VALUE|Y0=$"
 rocket_site: "미사일 발사 기지"
 rocket_site_plural: "미사일 발사 기지"
 rocket_site_desc: "§Y미사일 발사 기지§!는 §Y지대공 미사일§!부터 §Y대륙간탄도미사일§!까지 모든 전구 수준의 미사일 장비를 취급하는 곳입니다. 기지는 해당 주에 전략 공역에 전략 자산을 전개할 수 있는 능력을 부여하여 대공방어를 돕거나 공격능력을 제공할 수 있도록 합니다."
 nuclear_facility: "민간 R&D 시설"
 nuclear_facility_plural: "민간 R&D 시설"
 nuclear_facility_desc: "A §YCivilian R&D Facility§! includes all types of special projects relating to the civilian industrial capacity, nuclear facilities, and more."
 air_facility: "공기역학 및 항공전자 연구소"
 air_facility_desc: "공기역학 및 항공전자 연구소는 항공기, 첨단 로켓, 이와 관련된 전자 및 우주 프로젝트에 대한 연구 프로젝트를 해금합니다."
 naval_facility_desc: "Experimental Facilities for Naval Engineering allow you to start research projects related to Surface Ships and Submarines.\nA Naval Engineering Facility can only be created in a coastal province."
 stronghold_network: "광범위한 방어 체계"
 stronghold_network_plural: "광범위한 방어 체계"
 stronghold_network_desc: "터널, 거점, 참호, 방공호, 무기고, 사전 계획된 폭파 장소 등으로 구성된 광범위한 방어 체계는 방어자가 공격자에 맞서 결정적 우위를 점할 수 있게 해줍니다."
 renewable_energy_infra: "재생 에너지 기반시설"
 renewable_energy_infra_plural: "재생 에너지 기반시설"
 renewable_energy_infra_desc: "§Y재생 에너지 기반시설§!은 모든 재생 에너지원을 아우르는 총칭입니다. 여기에는 태양광 단지, 풍력 터빈, 바이오연료 정제소, 숯 공장, 바이오연료 발전소 등이 포함되나 이에 국한되지 않습니다. 이처럼 재생 가능한 자원을 사용하며, 그 자원에서 연료를 생산합니다.\n\n주에 제공하는 효과:\n기본 필요 노동자 수: §Y22.5K§!\n§Y재생 에너지 기반시설§! 1기당 기본 GDP 산출량: $§Y20억§!\n기본 발전량: §G+0.5§! GW\n"
 renewable_energy_infra_amount: "$VALUE|Y0=$"
 renewable_energy_infra_resource: "£resources_strip|$FRAME$"
 microchip_plant: "마이크로칩 공장"
 microchip_plant_plural: "마이크로칩 공장"
 microchip_plant_desc: "첨단 금속과 귀금속을 마이크로칩으로 가공하는 생산 공장으로, 산업과 군사 수요 모두에 쓰입니다.\n\n주에 제공하는 효과:\n기본 필요 노동자 수: §Y37.5K§!\n§Y마이크로칩 공장§! 1개당 기본 GDP 산출량: $§Y320억§!\n기본 에너지 소비량: §R-0.75§! GW\n§Y마이크로칩§! 20 생산\n\n§Y마이크로칩§!은 단위당 시장 가격이 가장 높아, 잉여분을 수출하면 상당한 현금 수입을 얻을 수 있습니다.\n\n비용:\n§Y첨단 금속§! 3\n§Y귀금속§! 2"
 composite_plant: "복합재 공장"
 composite_plant_desc: "석유, 고무, 귀금속을 복합재로 가공하는 생산 공장으로, 과학, 군사, 산업 부문에 쓰입니다.\n\n주에 제공하는 효과:\n기본 필요 노동자 수: §Y37.5K§!\n§Y복합재 공장§! 1개당 기본 GDP 산출량: $§Y280억§!\n기본 에너지 소비량: §R-0.8§! GW\n§Y첨단 복합재§! 20 생산\n\n§Y복합재§!는 단위당 시장 가격이 가장 높은 축에 속해, 잉여분을 수출하면 강력한 현금 수입을 얻을 수 있습니다.\n\n비용:\n§Y석유§! 1\n§Y고무§! 1\n§Y귀금속§! 1"
 composite_plant_plural: "복합재 공장"
 rail_terminal: "철도 터미널"
 rail_terminal_plural: "철도 터미널"
 rail_terminal_desc: "촘촘한 터미널 망이 갖춰진 주는 사람과 물자를 더 빠르게 이동시키므로, 공장은 더 안정적으로 투입 자재를 공급받고 노동자는 더 확실하게 일자리에 닿으며 주변 경제는 성장할 여력을 얻습니다."
 show_construction_speed: "체크하면 각 §Y건물 유형§!의 현재 £construction_speed_texticon §Y건설 속도 보너스§!를 볼 수 있습니다.\n\n이 변동치는 해당 건물에만 적용되는 변동치만 표시합니다. §Y전역 £construction_speed_texticon 건설 속도§!는 반영되지 않습니다."
 landmark_kaaba: "카바"
 landmark_kaaba_plural: "$landmark_kaaba$"
 landmark_kaaba_desc: "메카 마스지드 알하람의 중심에 자리한 신성한 정육면체 구조물 카바는 이슬람에서 가장 신성한 장소입니다. 금빛 서예로 장식된 검은 비단으로 덮여 있으며, 전 세계 무슬림이 기도할 때 향하는 방향인 키블라 역할을 합니다. '신의 집'으로 알려진 이 고대 성소는 수 세기에 걸친 신앙과 순례, 이슬람의 역사를 담고 있으며 무슬림 공동체 움마의 단결을 상징합니다.\n\n§Y랜드마크 카바§!는 아랍 주들의 총인구에 비례하여 관광 수입을 창출합니다. 정확한 금액은 §Y경제 미리보기§!에서 확인할 수 있습니다."
 landmark_milad: "밀라드 타워"
 landmark_milad_plural: "$landmark_milad$"
 landmark_milad_desc: "밀라드 타워, 즉 보르제 밀라드는 이란의 혁명 이전 시기에 뿌리를 두고 있으며, 최초 계획은 1970년대로 거슬러 올라갑니다. 1979년 이란 혁명 이후 정치적 우선순위가 바뀌면서 이 초기 계획은 보류되었습니다. 1990년대 후반에 이 구상이 되살아나 2000년에 공사가 시작되었으며, 이는 개발과 현대화에 대한 이란의 새로운 관심과 맞물렸습니다. 이 타워의 설계는 이란의 유산과 현대 공학의 요소를 결합하여, 역사적 연속성과 변화하는 국가 정체성을 모두 보여 주는 인상적인 상징이 되었습니다. 오늘날 이 타워는 복합 기능을 갖춘 단지이자 주요 문화 랜드마크로서, 테헤란 주민과 방문객에게 도시와 멀리 보이는 엘부르즈 산맥의 전경을 제공합니다."
 landmark_domeofrock: "바위의 돔"
 landmark_domeofrock_plural: "$landmark_domeofrock$"
 landmark_domeofrock_desc: "바위의 돔은 예루살렘 구시가지를 굽어보는 황금 돔으로 유명한 이슬람 성지입니다. 7세기에 지어졌으며, 이슬람교도와 유대교도 모두에게 신성한 장소인 하람 알샤리프, 일명 성전산 위에 서 있습니다. 이 성지는 기초석을 모시고 있는데, 무슬림은 이곳이 예언자 무함마드가 승천한 곳이라고 믿으며 유대인은 고대 유대 성전의 지성소가 있던 자리라고 믿습니다."
 landmark_goldengate: "골든게이트 브리지"
 landmark_goldengate_plural: "$landmark_goldengate$"
 landmark_goldengate_desc: "1937년에 완공된 골든게이트 브리지는 샌프란시스코 만과 태평양 사이의 해협에 걸쳐 도시와 마린 헤드랜즈를 연결합니다. 독특한 인터내셔널 오렌지색 주탑과 긴 현수 구간 덕분에 개통 당시 세계에서 가장 긴 같은 유형의 다리였으며, 지금도 미국에서 가장 잘 알려진 구조물 중 하나입니다."
 landmark_UScongress: "미국 국회의사당"
 landmark_UScongress_plural: "$landmark_UScongress$"
 landmark_UScongress_desc: "미국 국회의사당은 워싱턴 D.C. 내셔널 몰의 동쪽 끝에 서 있으며 상원과 하원의 의사당을 품고 있습니다. 신고전주의 양식의 설계와 중앙 돔 덕분에 미국 입법 권력의 가장 상징적인 중심지가 되었으며, 의회도서관, 연방대법원, 스미소니언 박물관 단지로 이어지는 회랑의 중심을 이룹니다."
 landmark_fuji: "후지산"
 landmark_fuji_plural: "$landmark_fuji$"
 landmark_fuji_desc: "후지산은 해발 3,776미터로 일본에서 가장 높은 봉우리이며, 맑은 날에는 도쿄에서도 보이는 혼슈의 활성 성층화산입니다. 신도 신앙에서 오래도록 신성시되어 왔고 일본 미술의 대표적인 소재이기도 하며, 유네스코 세계유산이기도 합니다. 거의 완벽한 원뿔형 실루엣과 주변 호수 지대는 매년 수십만 명의 등반객과 관광객을 끌어들입니다."
 landmark_giza: "기자의 피라미드"
 landmark_giza_plural: "$landmark_giza$"
 landmark_giza_desc: "이집트 고왕국 시대에 파라오의 거대한 무덤으로 지어진 기자의 피라미드는 카이로 외곽에 서 있습니다. 파라오 쿠푸를 위해 건설된 대피라미드는 고대 세계 7대 불가사의 가운데 유일하게 남아 있는 건축물입니다. 이 단지는 스핑크스와 함께 이집트에서 가장 많은 사람이 찾는 랜드마크이자 이 나라 관광 경제의 중심입니다."
 landmark_shuttle: "케네디 우주 센터"
 landmark_shuttle_plural: "$landmark_shuttle$"
 landmark_shuttle_desc: "플로리다 대서양 연안에 위치한 케네디 우주센터는 NASA 유인 우주비행 임무의 주요 발사장입니다. 로켓이 발사 준비를 하는 상징적인 우주선 조립동과, 아폴로 및 우주 왕복선 계획의 역사적인 출발지였던 39 발사 단지 같은 시설을 갖추고 있습니다. 이 센터는 정부와 상업 발사를 모두 지원하는 혁신과 탐사의 중심지로 남아 있습니다."
 landmark_shuttle_launch: "케네디 우주 센터"
 landmark_shuttle_launch_plural: "$landmark_shuttle_launch$"
 landmark_shuttle_launch_desc: "플로리다 대서양 연안에 위치한 케네디 우주센터는 NASA 유인 우주비행 임무의 주요 발사장입니다. 로켓이 발사 준비를 하는 상징적인 우주선 조립동과, 아폴로 및 우주 왕복선 계획의 역사적인 출발지였던 39 발사 단지 같은 시설을 갖추고 있습니다. 이 센터는 정부와 상업 발사를 모두 지원하는 혁신과 탐사의 중심지로 남아 있습니다."
 landmark_buran: "바이코누르 우주기지"
 landmark_buran_plural: "$landmark_buran$"
 landmark_buran_desc: "카자흐스탄 남부 초원에 위치한 바이코누르 우주기지는 세계에서 가장 오래되고 가장 큰 현역 우주기지입니다. 1955년에 건설되었으며, 유리 가가린의 보스토크 1호 최초 유인 우주비행을 비롯한 소련과 러시아의 기념비적인 임무가 이곳에서 발사되었습니다. 러시아는 지금도 카자흐스탄으로부터 이 시설을 임차하여 국제우주정거장으로 향하는 소유즈 유인 발사에 사용하고 있습니다."
 landmark_ICBMsilominot: "마이넛 공군기지"
 landmark_ICBMsilominot_plural: "$landmark_ICBMsilominot$"
 landmark_ICBMsilominot_desc: "마이넛 공군기지의 미사일 단지는 노스다코타 평원 곳곳에 흩어져 있는 대륙간 탄도 미사일 지하 격납고의 광범위한 망으로 이루어져 있습니다. 이 격납고는 핵 공격에 견디도록 강화되어 있고 삼엄하게 경비되며 상시 경계 태세로 유지되어, 미국 핵 삼원체계의 지상 기반 축을 이룹니다."
 landmark_ICBMsiloyasny: "야스니 미사일 기지"
 landmark_ICBMsiloyasny_plural: "$landmark_ICBMsiloyasny$"
 landmark_ICBMsiloyasny_desc: "러시아 오렌부르크 지역 돔바롭스키 인근에 위치한 야스니 미사일 기지는 전략로켓군의 주요 격납고 지대 가운데 하나입니다. 냉전 시기에 건설되었으며, 강화된 지하 격납고에 대형 ICBM을 배치하고 있어 러시아 핵 억지력의 핵심 구성 요소를 이룹니다."
 landmark_zenobia_wall: "제노비아 방어선"
 landmark_zenobia_wall_plural: "$landmark_zenobia_wall$"
 landmark_zenobia_wall_desc: "이집트 남부와 서부 사막에 걸쳐 뻗어 있는 철통같은 요새화 방어선입니다. 콘크리트 장벽, 벙커 단지, 사전 배치된 포병이 제노비아 방어선의 중추를 이루며, 사하라 이남의 돌파 지점에서 밀려오는 키메라의 진격을 저지하기 위해 세워졌습니다."
 landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
 landmark_hagia_sophia_desc: "537년 비잔틴 대성당으로 지어진 하기아 소피아는 1453년 도시가 정복된 뒤 이스탄불의 주요 오스만 모스크가 되었습니다. 튀르키예 공화국 역사의 상당 기간에는 세속 박물관으로 쓰였습니다. 거대한 중앙 돔과 비잔틴 모자이크는 지금까지 지어진 종교 건축 가운데 가장 영향력 있는 작품으로 남아 있으며, 매년 수백만 명의 방문객을 이스탄불로 끌어들입니다."
 landmark_forbidden_city_desc: "베이징 한복판에 자리한 성벽으로 둘러싸인 궁궐 단지는 거의 5세기 동안 명나라와 청나라의 황실 거처로 쓰였습니다. 오늘날에는 고궁박물원이 들어서 있으며 세계에서 가장 중요한 중국 미술품과 유물 컬렉션 가운데 하나를 소장하고 있습니다. 자금성은 이 나라에서 가장 많은 사람이 찾는 문화 유적이자 유네스코 세계유산이며, 중국 문명의 으뜸가는 상징으로 서 있습니다."
 landmark_tokyo_imperial_palace_desc: "메이지 유신 이래 일본 천황의 주된 거처로, 도쿄 중심부의 옛 에도 성 터에 서 있습니다. 궁전과 그 부지는 세계에서 가장 오래된 세습 군주제의 연속성을 나타냅니다. 일반인의 출입은 제한되지만, 동쪽 정원과 주요 황실 의식이 해마다 상당한 관광객을 끌어들입니다."
 landmark_taj_mahal_plural: "$landmark_taj_mahal$"
 landmark_taj_mahal_desc: "1632년 무굴 황제 샤 자한이 아내 뭄타즈 마할을 위한 영묘로 의뢰한 타지마할은 현존하는 무굴 건축의 가장 뛰어난 사례입니다. 하얀 대리석 정면, 정교한 상감 세공, 대칭을 이루는 정원 덕분에 유네스코 세계유산이자 지구상에서 가장 많은 사람이 찾는 기념물 가운데 하나가 되었으며, 매년 수백만 명의 방문객을 아그라로 끌어들입니다."
 landmark_prague_castle: "프라하 성"
 landmark_prague_castle_desc: "면적 기준으로 세계에서 가장 큰 고성 단지인 프라하 성은 보헤미아 왕과 신성 로마 제국 황제의 거처였으며, 지금은 체코 대통령의 관저입니다. 성벽 안에는 성 비투스 대성당과 중부 유럽 전역에서 모인 수 세기에 걸친 예술품이 자리하고 있어, 이 성은 이 나라에서 가장 많은 사람이 찾는 문화 유적이 되었습니다."
 landmark_bojnice_castle: "보이니체 성"
 landmark_bojnice_castle_desc: "중세 슬로바키아 요새를 낭만적인 신고딕 양식으로 복원한 보이니체 성은 19세기 말 팔피 야노시 백작의 주도로 프랑스 루아르 지방 성관 양식에 따라 재건되었습니다. 오늘날 슬로바키아에서 가장 많은 사람이 찾는 문화 유적 가운데 하나이며, 뾰족탑이 솟은 실루엣과 주변 공원은 슬로바키아 유산 관광의 중심을 이루고 있습니다."
 landmark_sadabad_complex: "사다바드 궁전 단지"
 landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
 landmark_sadabad_complex_desc: "테헤란 북쪽 산기슭에 펼쳐진 광대한 궁전 단지로, 본래 카자르 왕조 시대에 지어졌으며 팔레비 왕조의 샤들이 대대적으로 확장했습니다. 1979년 혁명 이후 이 단지는 국유화되었으며, 오늘날에는 왕실 소장품, 이란 미술, 자연사 자료를 소장한 국립 박물관들의 연결망으로 운영됩니다."
 landmark_hofburg_palace_desc: "빈 중심부의 호프부르크는 수 세기 동안 합스부르크 왕조의 주 황궁이었습니다. 오늘날 그 홀에는 오스트리아 연방 대통령 집무실, 스페인 승마학교, 제국 보물관, 그리고 여러 주요 박물관이 들어서 있습니다. 호프부르크는 지금도 빈을 대표하는 랜드마크이자 오스트리아 문화 관광의 중심입니다."
 landmark_berlin_reichstag_desc: "공화국 광장에 자리한 라이히스타크 건물은 한 세기 넘게 베를린 정치의 중심에 서 있었습니다. 1933년과 제2차 세계 대전 중에 크게 파괴되었으나, 통일 후 노먼 포스터의 재설계로 복원되어 1999년 독일 연방의회인 연방하원의 의사당으로 재개관했습니다. 유리 돔은 현대 독일 민주주의의 대표적인 상징이자 베를린 중심부의 주요 명소가 되었습니다."
 enrichment_facility: "핵 농축 시설"
 enrichment_facility_plural: "핵 농축 시설"
 enrichment_facility_desc: "농축 시설은 우라늄을 받아 원자로와, 어느 정도는 핵무기에 쓸 수 있도록 농축합니다."