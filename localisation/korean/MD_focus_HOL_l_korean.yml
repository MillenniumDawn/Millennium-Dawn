 HOL_radicaal_populisme: "급진적 포퓰리즘"
 HOL_fortuyn_centre_balance: "균형 잡힌 포르퇴인주의"
 HOL_fortuyn_centre_balance_desc: "정치 노선은 개혁적 실용주의와 포퓰리즘의 에너지 사이에서 균형을 이루고 있습니다. 안정, 정책의 연속성, 시민 참여가 이 중간 지대를 규정합니다."
 HOL_pragmatisch_fortuynisme_high: "실용적 포르퇴인주의의 지배"
 HOL_pragmatisch_fortuynisme_high_desc: "기술 관료주의와 제도 개혁이 의제를 주도합니다. 포퓰리즘적 수사는 차분하고 정책 중심적인 접근에 밀려 잦아들었습니다."
 HOL_pragmatisch_fortuynisme_medium: "통치 지향 정책"
 HOL_pragmatisch_fortuynisme_medium_desc: "구조 개혁, 분권화, 투명성에 초점이 맞춰져 있습니다. LPF는 이성적 지도력의 안정적인 노선을 걷고 있습니다."
 HOL_pragmatisch_fortuynisme_low: "온건한 실용주의"
 HOL_pragmatisch_fortuynisme_low_desc: "실용적 포르퇴인주의가 근소하게 앞서 있으나, 더 대립적이고 포퓰리즘적인 정책을 요구하는 목소리가 지지층 사이에서 힘을 얻고 있습니다."
 HOL_pragmatisch_fortuynisme_edge: "포퓰리즘과의 위태로운 균형"
 HOL_pragmatisch_fortuynisme_edge_desc: "당은 정책적 절제와 포퓰리즘의 호소력 사이에서 아슬아슬한 줄타기를 하고 있습니다. 더 강경한 수사를 요구하는 여론의 압력이 높아지고 있습니다."
 HOL_radicaal_populisme_high: "급진적 포퓰리즘의 부상"
 HOL_radicaal_populisme_high_desc: "당은 반체제 의제를 완전히 받아들였습니다. 대립적인 수사, 문화적 부흥주의, 반엘리트 정서가 LPF의 새로운 정체성을 규정합니다."
 HOL_radicaal_populisme_medium: "포퓰리즘의 기세"
 HOL_radicaal_populisme_medium_desc: "LPF는 대중의 불만을 행동으로 이끌고 있습니다. 전통적 통치 구조가 내부에서부터 도전받고 있습니다."
 HOL_radicaal_populisme_low: "포퓰리즘의 대두"
 HOL_radicaal_populisme_low_desc: "포퓰리즘의 영향력이 커지고 있으나 당은 여전히 일정한 제도적 신중함을 유지하고 있습니다. 내부 논쟁이 뜨거워지고 있습니다."
 HOL_radicaal_populisme_edge: "실용주의와의 긴장"
 HOL_radicaal_populisme_edge_desc: "포퓰리즘 세력이 부상하고 있으나 LPF 지도부는 실용주의적 기반을 완전히 버리는 데 여전히 주저하고 있습니다."
 HOL_pvda_modernize_party_policies: "당 정책 현대화"
 HOL_pvda_modernize_party_policies_desc: "환경주의, 디지털 혁신, 포용성에 관한 정책을 채택하여 젊은 유권자와 도시 진보층에 호소합니다."
 HOL_pvda_promote_urban_investments: "도시 투자 촉진"
 HOL_pvda_promote_urban_investments_desc: "도심의 기반시설, 주택, 친환경 사업에 집중하여 도시에서 당의 호소력을 강화합니다."
 HOL_pvda_focus_climate_policy: "기후 정책 집중"
 HOL_pvda_focus_climate_policy_desc: "재생 에너지와 녹색 산업 투자를 우선시하며 야심찬 기후 개혁을 옹호합니다."
 HOL_pvda_strengthen_union_influence: "노조 영향력 강화"
 HOL_pvda_strengthen_union_influence_desc: "노동조합에 힘을 실어 노동 정책과 의사 결정에 대한 영향력을 높입니다."
 HOL_pvda_promote_rural_investments: "농촌 개발에 집중"
 HOL_pvda_promote_rural_investments_desc: "농촌 공동체와 전통 산업을 지원하는 데 자원을 배분하여 당의 노동 계급적 뿌리에 호소합니다."
 HOL_pvda_social_housing_initiative: "사회 주택 사업 확대"
 HOL_pvda_social_housing_initiative_desc: "불평등과 도시 과밀을 해소하기 위해 저소득층 지역에 중점을 두고 사회 주택에 대규모로 투자합니다."
 HOL_pvda_private_energy_investments: "에너지 분야 민간 투자 장려"
 HOL_pvda_private_energy_investments_desc: "자본을 유치하기 위해 에너지 부문의 일부를 민영화하며, 녹색 목표보다 경제적 효율을 우선시합니다."
 HOL_pvda_climate_action_plan: "기후 행동 계획"
 sp_dutch_super_bus_project: "슈퍼 버스"
 sp_dutch_super_bus_project_desc: "슈퍼버스 실험은 혁신과 지속가능성을 통해 대중교통을 변혁하도록 설계된 네덜란드의 최첨단 프로젝트입니다. 이 프로젝트는 최고 시속 250km에 도달할 수 있는 전기 고속 승객 차량을 개발하는 것을 목표로 합니다. 경량 탄소 섬유로 제작된 슈퍼버스는 호화로운 여행과 효율성을 결합하여 주요 지역 간 신속한 이동을 가능하게 합니다."
