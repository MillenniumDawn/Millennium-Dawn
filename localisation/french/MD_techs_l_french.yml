 hypersonic_missile_equipment: "Missiles de croisière hypersoniques"
 hypersonic_missile_equipment_desc: "Un missile de croisière hypersonique (HSCM) se déplace au moins cinq fois la vitesse du son (Mach 5)"
 hypersonic_missile_equipment_1: "HSCM 2025"
 hypersonic_missile_equipment_1_desc: "Un missile de croisière hypersonique (HSCM) se déplace au moins cinq fois la vitesse du son (Mach 5)"
 hypersonic_missile_equipment_2: "HSCM 2035"
 hypersonic_missile_equipment_2_desc: "Un missile de croisière hypersonique (HSCM) se déplace au moins cinq fois la vitesse du son (Mach 5)"
 guided_missile_equipment: "Missiles de croisière lancés depuis le sol"
 guided_missile_equipment_desc: "Les premiers missiles de croisière, utilisant uniquement des systèmes de navigation inertielle primitifs, n'étaient pas particulièrement précis et ne pouvaient être utilisés que pour attaquer de grandes villes."
 guided_missile_equipment_1: "GLCM 1965"
 guided_missile_equipment_1_desc: "Un missile de croisière lancé depuis le sol (GLCM) est un missile de croisière basé à terre, conçu pour frapper des cibles tactiques et stratégiques."
 guided_missile_equipment_2: "GLCM 1975"
 guided_missile_equipment_2_desc: "Un missile de croisière lancé depuis le sol (GLCM) est un missile de croisière basé à terre, conçu pour frapper des cibles tactiques et stratégiques."
 guided_missile_equipment_3: "GLCM 1985"
