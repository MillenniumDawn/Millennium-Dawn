l_english:
 OPEC_OPEN_BUTTON_TT: "Open the §YOPEC§! overview."
 OPEC_TITLE: "OPEC"
 OPEC_CONFERENCE_PRESIDENT: "President"
 OPEC_CONFERENCE_PRESIDENT_TT: "§Y[?global.opec_conference_president.GetName]§! holds the presidency of the OPEC Conference. The presidency rotates among members at every December conference."
 OPEC_NEXT_CONFERENCE: "Next Conference"
 OPEC_NEXT_CONFERENCE_DAYS: "§Y[?global.opec_months_to_conference|0]§! months"
 OPEC_OIL_PRICE: "Oil Price"
 OPEC_OIL_PRICE_VALUE: "[?global.oil_price|2]"
 OPEC_OIL_PRICE_TT: "The world oil price, recalculated every month from global supply and demand and the current OPEC stance."
 OPEC_COHESION: "Cohesion"
 OPEC_COHESION_VALUE: "[?global.opec_cohesion|0]%"
 OPEC_COHESION_TT: "How closely members follow the agreed stance. The stance moves the oil price in proportion to Cohesion.\n\nEach conference changes Cohesion by one point for every §Y5%§! of production the winning proposal is backed by above or below §Y50%§!. A §YDeep Production Cut§! costs §R5§! Cohesion and a §YPrice War§! costs §R10§!."
 OPEC_CURRENT_STANCE: "Current Stance"
 OPEC_TOP_PROPOSALS: "Most Supported Proposals"
 OPEC_TOP_PROPOSAL_RANK_1: "1st"
 OPEC_TOP_PROPOSAL_RANK_2: "2nd"
 OPEC_TOP_PROPOSAL_RANK_3: "3rd"
 OPEC_TOP_PROPOSAL_SHARE: "§Y[?global.opec_vote_share^v|0]%§! of OPEC production"
 OPEC_PROPOSALS: "Possible Proposals"
 OPEC_PROPOSAL_VOTES: "[?global.opec_vote_count^v|0] (§Y[?global.opec_vote_share^v|0]%§!)"
 OPEC_STANCE_DEEP_CUT: "Deep Production Cut"
 OPEC_STANCE_DEEP_CUT_TT: "Members sharply reduce output to force prices up.\n\nOil price: §G+30%§! at full Cohesion\nMember oil export revenue: §R-20%§!\nCohesion: §R-5§!"
 OPEC_STANCE_CUT: "Production Cut"
 OPEC_STANCE_CUT_TT: "Members trim output to support prices.\n\nOil price: §G+15%§! at full Cohesion\nMember oil export revenue: §R-10%§!"
 OPEC_STANCE_HOLD: "Hold Production"
 OPEC_STANCE_HOLD_TT: "Members keep their current quotas. The oil price follows world supply and demand."
 OPEC_STANCE_RAISE: "Raise Production"
 OPEC_STANCE_RAISE_TT: "Members pump more to ease prices and win market share.\n\nOil price: §R-10%§! at full Cohesion\nMember oil export revenue: §G+5%§!"
 OPEC_STANCE_PRICE_WAR: "Price War"
 OPEC_STANCE_PRICE_WAR_TT: "Members flood the market to punish rival producers.\n\nOil price: §R-30%§! at full Cohesion\nMember oil export revenue: §G+15%§!\nCohesion: §R-10§!"
 OPEC_VOTE_TT: "Back this proposal at the next OPEC Conference. Click again to withdraw. Votes are weighted by oil production, and the most backed proposal becomes the stance."
 OPEC_VOTE_MEMBERS_ONLY_TT: "We are a member of OPEC"
 OPEC_MEMBER_TT: "§Y[?v.GetName]§! is a member of OPEC."
 opec_member_modifier: "OPEC Membership"
 opec_member_modifier_desc: "As a member of OPEC, our oil exports follow the production stance agreed at the OPEC Conference."
