 NKO.liberalism_2017: "£NKO_liberalism_2017 (FJ)  - 自由朝鲜"
 NKO.liberalism_2017_desc: "(大帐篷) - 自由朝鲜\n\n自由朝鲜是一个反朝鲜政府的非政府组织。它因在金正男被暗杀后保护金正男的儿子金汉溶而受到关注。它还以支持并帮助想要离开朝鲜的脱北者而闻名。2019年3月1日，‘千里马民防’（该组织原名）更名为‘自由朝鲜’，这也是其提议在朝鲜推翻现政府后的新国名。"
 NKO.liberalism_2017_icon: "£NKO_liberalism_2017"
 NKO.anarchist_communism: "£NKO_anarchist_communism  (KSDP) -  朝鲜社会民主党"
 NKO.anarchist_communism_desc: "（左翼社会民主主义） - 朝鲜社会民主党\n\n朝鲜社会民主党是朝鲜民主主义人民共和国官方注册的政党之一，成立于1945年11月3日，最初名为朝鲜民主党，由企业家、商人、手工业者、小资产阶级、农民和基督徒等不同社会阶层人士联合组建。"
 NKO.anarchist_communism_icon: "£NKO_anarchist_communism"
 NKO.Nat_Autocracy: "£NKO_military_junta (KPA)  - 朝鲜人民军"
 NKO.Nat_Autocracy_desc: "（红色军政府） - 朝鲜人民军于1948年以现在的形式出现，其前身是活跃在朝鲜境内的抗日游击队。随着苏联占领北方，共产党军队得以巩固在名义上的朝鲜民主主义人民共和国的政权，从而将所有民兵组织整合为一个统一的军事力量，即朝鲜人民军。在朝鲜战争爆发前，该军主要参与与南方的边境冲突，而朝鲜战争本身是其历史上唯一一次直接参与的大规模冲突。朝鲜战争后期的大清洗和思想灌输确保了军队对主体思想的忠诚，使其成为高度军事化和孤立主义的朝鲜民主主义人民共和国的主要工具。"
