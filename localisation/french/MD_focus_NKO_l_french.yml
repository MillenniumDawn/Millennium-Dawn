 NKO_vpk: "Complexe militaro-industriel national"
 NKO_sad_army_idea: "Armée populaire obsolète"
 NKO_sad_army_idea_desc: "Cet esprit national sera §Yamélioré§! si nous achevons les focus de l'§Hesprit militaire révolutionnaire§!. \n§W--------------§!\nL'armée nord-coréenne, si elle se targue d'effectifs considérables, s'appuie lourdement sur un matériel et une technologie dépassés. Une grande partie de son arsenal consiste en chars, artillerie et aéronefs de l'ère soviétique, avec une modernisation limitée. Cette dépendance aux systèmes anciens reflète les contraintes de ressources et les sanctions internationales, rendant l'armée redoutable en nombre mais en difficulté d'efficacité et de capacité par rapport aux armées modernes."
 NKO_new_army_idea: "Nouvelle Armée populaire nord-coréenne"
 NKO_new_army_idea_desc: "L'armée modernisée de la Corée du Nord combine des technologies indigènes avancées avec des améliorations stratégiques de ses principaux actifs militaires. Les systèmes de missiles perfectionnés, les drones et les capacités de guerre cybernétique témoignent d'un virage vers la modernisation. Bien que toujours limitée par les sanctions, l'accent mis sur l'innovation et les tactiques de guerre asymétrique fait de l'armée une force redoutable dans la région."
 NKO_marines_idea: "Corps des marines"
 NKO_unite_sport_team: "Équipe olympique unifiée"
 NKO_unite_sport_team_desc: ""
