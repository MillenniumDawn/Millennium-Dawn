 ALG_khenchela_trait_desert_hardened: "Equipamiento endurecido para el desierto"
 ALG_khenchela_trait_desert_hardened_desc: "Armas diseñadas y probadas específicamente para las condiciones del Sáhara, con un sellado mejorado contra el polvo y mayor resistencia al calor."
 ALG_khenchela_trait_simplified_maintenance: "Mantenimiento simplificado"
 ALG_khenchela_trait_simplified_maintenance_desc: "Diseños optimizados que reducen los requisitos de mantenimiento y los costes de las piezas de repuesto."
 ALG_khenchela_trait_standardized_production: "Líneas de producción estandarizadas"
 ALG_khenchela_trait_standardized_production_desc: "Implementar procesos de fabricación uniformes para aumentar la eficiencia de la producción."
 ALG_khenchela_trait_mass_production_focus: "Enfoque en la producción en masa"
 ALG_khenchela_trait_mass_production_focus_desc: "Ampliar la capacidad de producción para satisfacer las demandas de un gran ejército permanente."
 ALG_seriana_trait_kalashnikov_expertise: "Experiencia en Kaláshnikov"
 ALG_seriana_trait_kalashnikov_expertise_desc: "Décadas de experiencia en la producción de fusiles tipo AK proporcionan una fiabilidad y un poder de fuego superiores."
 ALG_seriana_trait_licensed_production: "Eficiencia de producción bajo licencia"
 ALG_seriana_trait_licensed_production_desc: "Líneas de producción optimizadas para armas de diseño extranjero fabricadas bajo licencia."
 ALG_seriana_trait_cost_reduction: "Medidas de reducción de costes"
 ALG_seriana_trait_cost_reduction_desc: "Implementar técnicas de fabricación que ahorren costes sin comprometer la calidad."
 ALG_dgi_trait_atgm_development: "Programa de desarrollo de ATGM"
 ALG_dgi_trait_atgm_development_desc: "Desarrollo nacional de misiles guiados antitanque para reducir la dependencia extranjera."
 ALG_dgi_trait_manpads_systems: "Sistemas MANPADS"
 ALG_dgi_trait_manpads_systems_desc: "Sistemas de defensa aérea portátiles para la infantería y unidades ligeras."
 ALG_dgi_trait_artillery_modernization: "Modernización de la artillería"
 ALG_dgi_trait_artillery_modernization_desc: "Actualizar las piezas de artillería existentes con sistemas modernos de puntería y control de tiro."
 ALG_dgi_trait_cnc_integration: "Integración de sistemas C3I"
 ALG_dgi_trait_cnc_integration_desc: "Integrar sistemas de mando, control, comunicaciones e inteligencia en todas las plataformas."
 ALG_dgi_trait_mass_production: "Iniciativa de producción en masa"
 ALG_dgi_trait_mass_production_desc: "Aumentar las capacidades de producción para satisfacer los requisitos de expansión militar."
 ALG_bcl_trait_desert_adaptation: "Paquete de adaptación al desierto"
 ALG_bcl_trait_desert_adaptation_desc: "Modificaciones especializadas para operaciones en el desierto, incluyendo refrigeración mejorada y filtración de polvo."
 ALG_bcl_trait_soviet_refurbishment: "Reacondicionamiento de equipamiento soviético"
 ALG_bcl_trait_soviet_refurbishment_desc: "Experiencia en la revisión y modernización de vehículos blindados de la era soviética a un coste reducido."
 ALG_bcl_trait_reactive_armor: "Integración de blindaje reactivo"
 ALG_bcl_trait_reactive_armor_desc: "Añadir blindaje reactivo explosivo para mejorar la protección contra cargas huecas."
 ALG_bcl_trait_apc_modernization: "Programa de modernización de VBTP"
 ALG_bcl_trait_apc_modernization_desc: "Mejoras integrales para vehículos blindados de transporte de personal y vehículos de combate de infantería."
 ALG_bcl_trait_production_efficiency: "Mejoras en la eficiencia de producción"
 ALG_bcl_trait_production_efficiency_desc: "Optimizar los procesos de ensamblaje para aumentar el rendimiento."
 ALG_snvi_trait_saharan_proven: "Diseños probados en el Sáhara"
 ALG_snvi_trait_saharan_proven_desc: "Vehículos probados exhaustivamente en condiciones desérticas para una fiabilidad máxima."
 ALG_snvi_trait_mercedes_partnership: "Asociación con Mercedes-Benz"
 ALG_snvi_trait_mercedes_partnership_desc: "Producción bajo licencia de plataformas de vehículos comerciales Mercedes-Benz adaptadas para uso militar."
 ALG_snvi_trait_mass_production: "Expansión de la producción en masa"
 ALG_snvi_trait_mass_production_desc: "Ampliar las instalaciones de producción para satisfacer la creciente demanda militar."
 ALG_snvi_trait_cost_reduction: "Optimización de costes"
 ALG_snvi_trait_cost_reduction_desc: "Reducir los costes por unidad mediante una mayor eficiencia en la fabricación."
 ALG_enmib_trait_maintenance_expertise: "Experiencia en mantenimiento y revisión"
 ALG_enmib_trait_maintenance_expertise_desc: "Conocimientos especializados en el mantenimiento de helicópteros que prolongan su vida útil y fiabilidad."
 ALG_enmib_trait_licensed_assembly: "Operaciones de ensamblaje bajo licencia"
 ALG_enmib_trait_licensed_assembly_desc: "Ensamblar diseños de helicópteros extranjeros bajo licencia a un coste reducido."
 ALG_enmib_trait_production_expansion: "Expansión de la capacidad de producción"
 ALG_enmib_trait_production_expansion_desc: "Ampliar las instalaciones para aumentar la capacidad de producción de helicópteros."
 ALG_mek_trait_mediterranean_design: "Diseño naval mediterráneo"
 ALG_mek_trait_mediterranean_design_desc: "Buques optimizados para operaciones en el mar Mediterráneo, con velocidad y eficiencia mejoradas."
 ALG_mek_trait_patrol_vessel_expertise: "Experiencia en patrulleros"
 ALG_mek_trait_patrol_vessel_expertise_desc: "Especializados en la construcción de patrulleras rápidas con capacidades de detección mejoradas."
 ALG_mek_trait_shipyard_expansion: "Programa de expansión de astilleros"
 ALG_mek_trait_shipyard_expansion_desc: "Ampliar las instalaciones de los astilleros para aumentar la capacidad de construcción."
 ALG_cnan_trait_frigate_construction: "Capacidad de construcción de fragatas"
 ALG_cnan_trait_frigate_construction_desc: "Desarrollar la capacidad para construir fragatas y destructores modernos."
 ALG_cnan_trait_anti_air_systems: "Sistemas antiaéreos navales"
 ALG_cnan_trait_anti_air_systems_desc: "Integrar sistemas antiaéreos modernos en buques de superficie."
 ALG_cnan_trait_submarine_assembly: "Ensamblaje de submarinos"
 ALG_cnan_trait_submarine_assembly_desc: "Ensamblaje bajo licencia de submarinos diésel-eléctricos con asistencia técnica extranjera."
 ALG_cnan_trait_foreign_assistance: "Asistencia técnica extranjera"
 ALG_cnan_trait_foreign_assistance_desc: "Las asociaciones con astilleros extranjeros aceleran el desarrollo tecnológico."
 ALG_cnan_trait_shipyard_modernization: "Modernización de astilleros"
 ALG_cnan_trait_shipyard_modernization_desc: "Modernizar las instalaciones de los astilleros con equipos de construcción avanzados."
 ALG_ersa_trait_mro_expertise: "Experiencia en MRO"
 ALG_ersa_trait_mro_expertise_desc: "La experiencia en mantenimiento, reparación y revisión (MRO) garantiza la máxima fiabilidad de las aeronaves."
 ALG_ersa_trait_licensed_assembly: "Ensamblaje de aviones bajo licencia"
 ALG_ersa_trait_licensed_assembly_desc: "Ensamblar diseños de aviones extranjeros bajo licencia a un coste reducido."
 ALG_ersa_trait_transport_specialization: "Especialización en aviones de transporte"
 ALG_ersa_trait_transport_specialization_desc: "Enfoque en aviones de transporte militar con mayor alcance y eficiencia."
 ALG_ersa_trait_production_expansion: "Iniciativa de expansión de la producción"
 ALG_ersa_trait_production_expansion_desc: "Ampliar las instalaciones para aumentar la capacidad de producción de aviones."
 ALG_resistance_power_struggle: "La lucha por el poder"
 ALG_resistance_power_struggle_desc: "Una guerra silenciosa se libra entre el pueblo argelino y *Le Pouvoir*. Ambos bandos buscan consolidar apoyos hasta que el inevitable enfrentamiento decida el futuro de Argelia."
 Resistance_support: "Apoyar a la Resistencia"
 Resistance_support_desc: "Canalizar recursos hacia los movimientos de base, las protestas y las redes clandestinas, fortaleciendo el desafío del pueblo contra la élite gobernante."
 ALG_increase_resistance_tt: "§YEl pueblo se fortalece mientras la influencia del ejército disminuye.§!"
 Le_Pouvoir_support: "Apoyar a Le Pouvoir"
 Le_Pouvoir_support_desc: "Prestar apoyo directo a la élite atrincherada, reforzando su control sobre el ejército y mitigando las demandas del pueblo."
 ALG_increase_pouvoir_tt: "§YEl ejército consolida su control mientras el pueblo pierde fuelle.§!"
 Resistance_Final_Clash: "El enfrentamiento final"
 Resistance_Final_Clash_desc: "El conflicto entre la Resistencia y *Le Pouvoir* ha alcanzado su punto álgico. Los próximos meses determinarán quién gobierna realmente Argelia."
 alg_resistance.1.t: "¡El pueblo triunfa!"
 alg_resistance.1.d: "Las voces del pueblo se han alzado contra las élites gobernantes. Las manifestaciones masivas y la organización de base han obligado al gobierno a ceder. Argelia entra en una nueva era de gobernanza democrática."
 alg_resistance.1.a: "El pueblo ha hablado."
 alg_resistance.2.t: "Le Pouvoir aplasta la Resistencia"
 alg_resistance.2.d: "La élite atrincherada, respaldada por el ejército, ha suprimido con éxito la resistencia. El statu quo se mantiene, pero el descontento latente amenaza con futuros disturbios."
 alg_resistance.2.a: "Se ha restaurado el orden."
 alg_resistance.3.t: "Una nación en caos"
 alg_resistance.3.d: "Ni la Resistencia ni Le Pouvoir lograron imponer su dominio. El vacío de poder ha sumido a Argelia en el caos, con caudillos militares y facciones compitiendo por el control."
 alg_resistance.3.a: "El país se tambalea al borde del colapso."
 alg_resistance.4.t: "La crisis argelina se intensifica"
 alg_resistance.4.d: "La frágil junta militar no puede mantener unido al Estado y Argelia se hunde cada vez más en la confusión. Los oficiales pueden devolver el país a un gobierno civil mientras quede un país que devolver, o pueden atrincherarse y dejar que los grupos armados avancen."
 alg_resistance.4.a: "Entregar el poder a un gobierno civil."
 ALG_african_union_tt: "Argelia fortalece sus lazos dentro de la §YUnión Africana§!, mejorando las relaciones con los Estados miembros africanos."
 KBY_alg_modifier_desc: "Kabylia is a state that was created relatively recently, its internal and foreign policy are completely subordinated to Algiers, but still, it has great autonomy in domestic and foreign policy."
 KBY_new_state: "Land for the Berbers"
 KBY_new_state_desc: "Finally, the true heirs of these lands, the Berbers, will take power into their own hands"
 KBY_constitution: "La Constitución de Cabilia"
 KBY_constitution_desc: "We must formalize our state legislation. To do this, we will adopt our own constitution."
 KBY_drs: "Cooperación con el DRS"
 KBY_fsb_desc: "Desafortunadamente, todavía no tenemos la oportunidad de crear nuestros propios servicios especiales, por lo que dependeremos de la cooperación con el DRS de Argelia."
 KBY_mvd: "Subordinar el Ministerio del Interior local"
 KBY_mvd_desc: "Subordinaremos los organismos locales del Ministerio del Interior, que se encontraban bajo el poder francés."
 KBY_ter_defence: "Defensa Territorial"
 KBY_ter_defence_desc: "Crearemos una Defensa Territorial a partir de las milicias locales."
 KBY_contract_army: "Sistema de ejército profesional"
 KBY_contract_army_desc: "Nuestro ejército se estructurará de acuerdo con un sistema de reclutamiento profesional por contrato."
 KBY_defence_doctrine: "Doctrina defensiva"
 KBY_defence_doctrine_desc: "No vamos a atacar a nadie, nuestra tarea es defender nuestras fronteras. Nuestro ejército adoptará la doctrina de tácticas defensivas."
 KBY_nat_guard: "La Guardia Nacional de Cabilia"
 KBY_nat_guard_desc: "En su día, allá por los años 80, Argelia tuvo una guardia nacional. Volveremos a crear esta división, pero esta vez bajo nuestro propio mando."
 KBY_defence_prom: "Industria militar"
 KBY_defence_prom_desc: "Invertiremos fondos significativos en la restauración de la industria militar en nuestro territorio. Necesitamos un ejército fuerte."
 KBY_rebuild_war_academy: "Escuelas militares"
 KBY_rebuild_war_academy_desc: "Nuestros combatientes deben tener el mejor entrenamiento para defender su patria. Por lo tanto, reactivaremos las academias militares en nuestro territorio."
 KBY_no_corrupt_military: "Reducir drásticamente la corrupción en el ejército"
 KBY_no_corrupt_military_desc: "Nuestro ejército aún es joven, por lo que es mucho más fácil erradicar la corrupción en su seno."
 KBY_nation_quest: "La cuestión nacional"
 KBY_nation_quest_desc: "Cabilia fue y será parte de Argelia, esta es nuestra respuesta a la cuestión nacional."
 KBY_referendum: "Referéndum sobre el destino de Cabilia"
 KBY_referendum_desc: "The fateful moment has come when we must decide which way our country will go. Will it become a full-fledged part of Algeria, in the form of a republic, or will we choose the path of a Union State"
 KBY_dinar: "El dinar como moneda estatal"
 KBY_dinar_desc: "El dinar se convertirá en nuestra moneda estatal, nadie lo ha dudado jamás."
 KBY_corruption: "Lucha contra la corrupción"
 KBY_corruption_desc: "Despite the fact that our state is still young, corrupt officials have already appeared in it. We need to deal with this"
 KBY_isr_invest: "Inversiones de Israel"
 KBY_isr_invest_desc: "Israel nos respalda con sus inversiones económicas."
 KBY_build_factories: "Construcción de fábricas"
 KBY_build_factories_desc: "The country needs factories and plants, we will provide our people with everything they need"
 KBY_social_invest: "Inversiones en el ámbito social"
 KBY_social_invest_desc: "Nuestros ciudadanos deben tener acceso a centros médicos de la mejor calidad, así como contar con todas las garantías sociales."
 KBY_infrastructure: "Inversiones en infraestructura"
 KBY_infrastructure_desc: "Las carreteras son las venas de nuestro Estado."
 KBY_fight_oligarch: "La lucha contra los oligarcas"
 KBY_fight_oligarch_desc: "Incluso en nuestro joven Estado ya han empezado a aparecer oligarcas corruptos que ganaron mucho dinero en la guerra. Vamos a encargarnos de ellos."
 KBY_it_invest: "Invertir en tecnologías de la información"
 KBY_it_invest_desc: "Invertiremos en tecnologías de la información (TI) para el desarrollo exitoso de nuestro país."
 KBY_maloross_economy: "Economía de Cabilia"
 KBY_maloross_economy_desc: "Nuestras medidas económicas han propiciado el crecimiento de nuestra economía."
 KBY_union_state: "Estado de la Unión"
 KBY_union_state_desc: "Hemos elegido el camino del Estado de la Unión."
 KBY_union_group_army: "Agrupación Conjunta de Tropas"
 KBY_union_group_army_desc: "Nuestros soldados se convertirán en miembros de la agrupación conjunta de tropas del Estado de la Unión."
 KBY_union_group_economic: "Inversiones del Estado de la Unión"
 KBY_union_group_economic_desc: "La membresía en el Estado de la Unión ha tenido un impacto positivo en nuestra economía."
 KBY_union_health_social: "Cooperación en el ámbito social y médico"
 KBY_union_health_social_desc: "Los miembros del Estado de la Unión cooperan activamente en los ámbitos social y médico."
 KBY_republic_rf: "Somos parte de Argelia"
 KBY_republic_rf_desc: "Nos hemos convertido en una república de Argelia; ahora nuestro destino está conectado con ella."
 KBY_alg_regions: "Cooperación con las regiones de Argelia"
 KBY_alg_regions_desc: "Cooperaremos activamente con otras regiones de Argelia."
 KBY_fra_companies: "Cooperación con empresas francesas"
 KBY_fra_companies_desc: "Las empresas francesas serán nuestras principales socias."
 KBY_integrate_army: "Integrarse en el ejército argelino"
 KBY_integrate_army_desc: "Adaptaremos nuestro ejército a los estándares del ejército argelino."
 ALG_legacy_of_independence_war: "Legado de la Guerra de Independencia de Argelia"
 ALG_legacy_of_independence_war_desc: "La lucha contra el dominio colonial francés forjó un fuerte sentido de identidad nacional y unidad. Este legado perdurable fortalece nuestro poder político, acelera la investigación y la modernización, e incrementa la influencia de Argelia en el extranjero. Sin embargo, las divisiones individuales y las memorias históricas continúan moldeando la opinión interna y las relaciones exteriores."
 ALG_new_nobility_idea: "Nobleza renovada"
 ALG_new_nobility_idea_desc: "Al restaurar los privilegios nobiliarios y crear una aristocracia leal, la monarquía fortalece su control, recompensando la fidelidad con influencia y prestigio."
 ALG_state_islam_idea: "El Islam como Estado"
 ALG_state_islam_idea_desc: "La monarquía formaliza el Islam como el principio rector del Estado, empoderando a los ulemas e integrando la Sharía en la gobernanza, a costa del progreso científico."
 ALG_andalus_crusade_idea: "Legado de al-Andalus"
 ALG_andalus_crusade_idea_desc: "El sueño de reclamar al-Andalus alimenta la causa del Califato, inspirando a los guerreros y legitimando la expansión a través de la península ibérica."
 ALG_maghribi_identity_idea: "Identidad magrebí"
 ALG_maghribi_identity_idea_desc: "La monarquía promueve una identidad magrebí distintiva arraigada en una cultura compartida y la unidad, fortaleciendo la estabilidad al tiempo que distancia la influencia extranjera."
 ALG_maghribi_identity_idea_two: "Verdadero magrebismo"
 ALG_maghribi_identity_idea_two_desc: "Desde Marruecos hasta Libia, el Magreb se une bajo un destino singular. La monarquía encarna esta visión, reduciendo la injerencia extranjera y vinculando a la región entre sí."
 ALG_renewed_nobility_idea: "Caballería restaurada"
 ALG_renewed_nobility_idea_desc: "Los caballeros del reino regresan, honrados como una élite política y militar leal. Su papel renovado fortalece el control de la monarquía al tiempo que reduce los costes de liderazgo."
 ALG_going_to_roots: "Regreso a nuestras raíces"
 ALG_going_to_roots_desc: "Tanto las dinastías magrebíes como las andalusíes sentaron las bases de la identidad argelina. Al abrazar estas tradiciones, unificaremos el pasado y el presente en una única visión rectora para la nación."
 ALG_state_islam: "El Islam como fe del Estado"
 ALG_state_islam_desc: "La religión siempre ha guiado al pueblo de Argelia. Al proclamar el Islam como el fundamento de la monarquía, consolidamos nuestra legitimidad, nos ganamos el favor de los ulemas y fortalecemos la unidad de los fieles."
 ALG_restore_knighthood: "Restaurar la caballería"
 ALG_restore_knighthood_desc: "En la era de los imperios, las órdenes de guerreros y nobles defendieron nuestra tierra y nuestra fe. Restauraremos tales órdenes de caballería para servir al trono e inspirar lealtad en las armas."
 ALG_andalus_legacy: "Legado de al-Andalus"
 ALG_andalus_legacy_desc: "Nuestro renacimiento andalusí no se trata solo del trono. Se trata de reavivar el orgullo perdido de los musulmanes expulsados de Iberia hace siglos. Extenderemos nuestra influencia y le recordaremos a Europa que al-Andalus no ha sido olvidado."
 ALG_our_old_realm: "Nuestro antiguo dominio"
 ALG_our_old_realm_desc: "Una vez gobernamos partes de Iberia bajo el estandarte de al-Andalus. Ahora, mediante iniciativas diplomáticas y memoria histórica, reclamaremos nuestras antiguas tierras y prepararemos el terreno para su regreso."
 ALG_renewed_nobility: "Nobleza renovada"
 ALG_renewed_nobility_desc: "Se deben forjar nuevas casas nobles para servir a la monarquía. Se restaurarán las antiguas familias y se elevará a las nuevas élites para proporcionar a Argelia servidores leales a la corona."
 ALG_politic_outreach_iberia: "Iniciativas políticas en Iberia"
 ALG_politic_outreach_iberia_desc: "Al apoyar a fuerzas afines en España y Portugal, podemos extender la influencia de Argelia hacia el oeste. Nuestro respaldo a los movimientos ibéricos fortalecerá nuestras reclamaciones y debilitará a sus Estados."
 ALG_fate_of_spain: "El destino de España"
 ALG_fate_of_spain_desc: "España se asienta sobre la tierra de nuestros antepasados. Su destino ahora puede ser decidido por la mano de Argelia, ya sea mediante la unión, la reclamación o la conquista."
 ALG_true_maghribism: "Verdadero magrebismo"
 ALG_true_maghribism_desc: "Ha llegado el momento de declarar nuestra propia visión, una ideología arraigada en la identidad del Magreb, la unidad islámica y el orgullo monárquico. La doctrina del magrebismo inspirará un nuevo orden en todo el norte de África."
 ALG_glory_of_andalus_idea: "Gloria de al-Andalus"
 ALG_glory_of_andalus_idea_desc: "Un renacimiento cultural, inspirado en el legado de al-Andalus, vigoriza a nuestros eruditos, artesanos y gobernantes. Une a la nación bajo una orgullosa memoria compartida."
 ALG_spain_algeria_union_tt: "Desbloquea decisiones para la unión con España bajo la monarquía argelina."
 ALG_trade_with_arabic_nations_tt: "Argelia establece acuerdos comerciales mejorados con todas las naciones árabes."
 ALG_loas_influence_tt: "Argelia incrementa su influencia entre los Estados miembros de la Liga Árabe mediante esfuerzos diplomáticos y acuerdos de amistad."
 ALG_isr_threat: "Argelia condena la agresión israelí"
 ALG_palestinian_aid_package_tt: "Argelia proporciona ayuda a Palestina e incrementa su influencia en todas las naciones de Oriente Medio."
 ALG_african_union_reforms_tt: "Argelia ha establecido acuerdos comerciales mejorados con todos los Estados miembros de la OUA."
 ALG_mutual_defense_idea: "Defensa mutua"
 ALG_mutual_defense_idea_desc: ""
 ALG_the_State: "El Estado de Argelia"
 ALG_unlocks_focus_for_us: "§C¡Desbloquea una decisión que nos permitirá eliminar los modificadores negativos que recibimos de esto!§!"
 ALG_activate_from_event: "§HEstos enfoques se activan a través de un evento o decisión§!"
 ALG_our_society: "Sociedad argelina"
 ALG_our_society_desc: "Algerian Society is constantly changing and evolving into something new. Though the government's role is typically limited when it comes to this due to certain restraints, there have been times where we needed to intervene and there will be times where we will have to intervene to make changes to our policies."
 ALG_DRS: "El DRS"
 ALG_DRS_desc: "The DRS is our nation's intelligence agency tasked with protecting the government and policies of the nation from internal and external threats."
 ALG_domestic_focus: "Enfoque nacional"
 ALG_domestic_focus_desc: "El DRS debe centrarse en proteger a la nación de las amenazas internas, como aquellos actores malintencionados que desean derrocar al gobierno mediante la propagación de ideales peligrosos."
 ALG_foreign_focus: "Enfoque extranjero"
 ALG_foreign_focus_desc: "El DRS debe preocuparse por las amenazas que provienen de fuera de nuestras fronteras, ya que la población local nunca desearía causar daño a su propia nación."
 ALG_disaster_relief: "Plan ante catástrofes"
 ALG_disaster_relief_desc: "Actualmente no disponemos de un plan ante catástrofes, lo que significa que no estamos preparados para proteger y acudir en ayuda de nuestros ciudadanos."
 ALG_charity_based: "Establecer un sistema dirigido por organizaciones benéficas"
 ALG_charity_based_desc: "Las organizaciones benéficas ampararán a nuestra gente cuando ocurra una catástrofe, lo que nos permitirá recortar bastante el gasto público."
 ALG_government_reliant: "Establecer un sistema dirigido por el gobierno"
 ALG_government_reliant_desc: "It is the government's job to come to its people's aid when disaster strikes, even if it means increasing our spending."
 ALG_migration_problems: "Problemas de migración"
 ALG_migration_problems_desc: "We have always had problems with an influx of migrants coming into the nation. But we never knew what to do with them after their problems end back in their home nation."
 ALG_open_door_policy: "Política de puertas abiertas"
 ALG_open_door_policy_desc: "By opting to use an open-door policy, we can easily utilize incoming migrants to better our nation and develop it."
 ALG_closed_borders: "Cerrar las fronteras"
 ALG_closed_borders_desc: "Somos capaces de deshacernos por completo de los migrantes que llegan a la nación simplemente cerrando nuestras fronteras, cerrando así nuestros problemas."
 ALG_drug_problem: "El problema de las drogas"
 ALG_drug_problem_desc: "A veces, las drogas son necesarias para uso médico, pero eso no impide que ciertos individuos abusen del sistema y las utilicen con fines recreativos con resultados peligrosos."
 ALG_tighten_punishments: "Postura más dura"
 ALG_tighten_punishments_desc: "Criminalizaremos a cualquiera que consuma drogas para cualquier fin que no sea el uso médico, sin importar cuál sea su excusa."
 ALG_relax_restrictions: "Suavizar nuestra postura"
 ALG_relax_restrictions_desc: "Incluso si nuestra gente desea consumir drogas con fines recreativos, ¿por qué debería importarnos? Quizás deberíamos dejar que hagan lo que quieran, aunque existan algunos riesgos."
 ALG_rising_nationalism: "Auge del nacionalismo"
 ALG_rising_nationalism_desc: "A pesar de que el nacionalismo es algo bueno, un exceso del mismo puede ser perjudicial. El nacionalismo dentro de la nación ha causado que estallen problemas y peleas entre los grupos minoritarios."
 ALG_utilize_it: "Utilizar el nacionalismo"
 ALG_utilize_it_desc: "We will utilize nationalism to our advantage, this way the enemy will know that the Algerian people won't sit idly by in times of war."
 ALG_combat_it: "Combatir el nacionalismo"
 ALG_combat_it_desc: "We are going to have to combat Nationalism as we cannot risk any further instability within our nation's borders."
 ALG_charity_disasters: "Plan gestionado por beneficencia"
 ALG_charity_disasters_desc: "Nuestro plan ante catástrofes depende de la amabilidad y las donaciones de los ciudadanos para prestar ayuda a las personas en tiempos de necesidad."
 ALG_government_led_disasters: "Plan liderado por el gobierno"
 ALG_government_led_disasters_desc: "El gobierno proporcionará ayuda a las personas que hayan sufrido desastres naturales en lugar de las organizaciones benéficas, aunque estas también son libres de colaborar si lo desean."
 ALG_drugs_illegalized: "Drogas ilegalizadas"
 ALG_drugs_illegalized_desc: "Si alguien consume drogas para cualquier propósito excepto para uso médico, tendrá problemas con la ley."
 ALG_drugs_legalized: "Drogas legalizadas"
 ALG_drugs_legalized_desc: "Realmente no nos importa para qué consuma la gente las drogas; al fin y al cabo, es su vida."
 ALG_drs_idea_1: "Policía militarizada"
 ALG_drs_idea_1_desc: "La policía ha sido reorganizada en una fuerza paramilitar capaz de lidiar con el terrorismo, los disturbios y la agitación, otorgándoles un papel más fuerte en la seguridad interna de Argelia."
 ALG_drs_idea_2: "Policía fuertenente militarizada"
 ALG_drs_idea_2_desc: "La policía opera ahora como un cuerpo paramilitar fuertemente armado, con equipamiento avanzado y estrechos vínculos con el ejército, desdibujando las líneas entre la seguridad civil y el control militar."
 ALG_drs_idea_3: "Policía militarizada integrada"
 ALG_drs_idea_3_desc: "Nuestras fuerzas policiales están plenamente integradas en el aparato de seguridad, operando codo con codo con el ejército en materia de antiterrorismo, defensa fronteriza y vigilancia nacional."
 ALG_riot_police_idea: "Policía antidisturbios"
 ALG_riot_police_idea_desc: "Una rama policial especializada diseñada para lidiar con protestas, manifestaciones y disturbios sociales. Están equipados con material de control de masas y operan con un fuerte énfasis en mantener la estabilidad del régimen."
 ALG_algerian_special_forces: "Formar las Fuerzas Especiales Argelinas"
 ALG_algerian_special_forces_desc: "Las amenazas a la seguridad de Argelia exigen unidades de élite capaces de una intervención rápida y de la lucha antiterrorista. El establecimiento de fuerzas especializadas fortalecerá nuestra defensa tanto contra los disturbios internos como contra los peligros externos."
 ALG_BRI: "Expandir la BRI"
 ALG_BRI_desc: "La Brigade de Recherche et d'Intervention (BRI) es una unidad policial especializada entrenada para el rescate de rehenes y operaciones de alto riesgo. Expandir su número y recursos mejorará nuestra seguridad urbana."
 ALG_al_saiqa: "Unidades Al-Sa'iqa"
 ALG_al_saiqa_desc: "Unidades paramilitares especiales de control de disturbios y contrainsurgencia reforzarán nuestra capacidad para mantener la ley y el orden durante los periodos de agitación civil."
 ALG_al_hars_al_watani: "Guardia Nacional"
 ALG_al_hars_al_watani_desc: "Una Guardia de Seguridad Nacional proporcionará seguridad local en áreas vulnerables, liberará recursos del ejército y mantendrá el orden en situaciones de crisis."
 ALG_haras_al_hudod: "Unidades de Guardia de Fronteras"
 ALG_haras_al_hudod_desc: "Fuerzas especializadas que patrullan nuestras fronteras frenarán el contrabando, evitarán infiltraciones y fortalecerán las defensas fronterizas de Argelia."
 ALG_central_armed_police: "Policía Armada Central"
 ALG_central_armed_police_desc: "Consolidar la policía armada bajo un mando centralizado mejorará los tiempos de respuesta y la eficiencia, garantizando una mano más firme contra las amenazas organizadas."
 ALG_border_security_force: "Fuerza de Seguridad Fronteriza"
 ALG_border_security_force_desc: "Al crear una fuerza dedicada a la vigilancia e interdicción de fronteras, Argelia tomará medidas enérgicas contra las redes de tráfico y la infiltración armada."
 ALG_firqat_tadakhol_al_sariye: "Unidad de Intervención Rápida"
 ALG_firqat_tadakhol_al_sariye_desc: "Las unidades de élite de reacción rápida permitirán a Argelia golpear con presteza a las células terroristas y las crisis emergentes antes de que se intensifiquen."
 ALG_expanding_BRI: "Expandir las capacidades de la BRI"
 ALG_expanding_BRI_desc: "Con más financiación, entrenamiento y equipamiento avanzado, la BRI puede evolucionar hasta convertirse en una formidable unidad antiterrorista y de rescate de rehenes que rivalice con las mejores de la región."
 ALG_increase_police_funding: "Aumentar la financiación policial"
 ALG_increase_police_funding_desc: "Impulsar la inversión en nuestra policía y gendarmería fortalecerá la estabilidad interna, reforzará la seguridad pública y mejorará la resiliencia de Argelia frente a los disturbios."
 ALG_drs_expand: "Expandir el DRS"
 ALG_drs_expand_desc: "El Département du Renseignement et de la Sécurité (DRS) puede expandirse aún más, otorgando mayores capacidades de recopilación de inteligencia y contraespionaje."
 ALG_new_gendarmerie_equipment: "Nuevo equipamiento para la Gendarmería"
 ALG_new_gendarmerie_equipment_desc: "Nuestra gendarmería debe estar debidamente armada y equipada para afrontar los desafíos del terrorismo, el crimen y la agitación interna."
 ALG_mia_reform: "Reformar el Ministerio del Interior"
 ALG_mia_reform_desc: "Centralizar el mando bajo el Ministerio del Interior optimizará la gestión de la seguridad interna, garantizando respuestas más rápidas y coordinadas."
 ALG_internal_troops: "Tropas internas"
 ALG_internal_troops_desc: "Las tropas internas paramilitares bajo el mando del Estado reforzarán la lucha contra la insurgencia y las redes criminales."
 ALG_increase_special_forces: "Aumentar las Fuerzas Especiales"
 ALG_increase_special_forces_desc: "Nuestras fuerzas de élite necesitan una mayor contratación y programas de entrenamiento especializados para hacer frente a las sofisticadas amenazas de la guerra moderna."
 ALG_cybercrime_directorate: "Dirección de Delitos Informáticos"
 ALG_cybercrime_directorate_desc: "La creación de una Dirección contra los Delitos Informáticos protegerá a Argelia del espionaje digital, los ciberataques y las campañas de desinformación hostiles."
 ALG_riot_police: "Unidades de Policía Antidisturbios"
 ALG_riot_police_desc: "Las unidades organizadas de policía antidisturbios se encargarán del control de masas y de dar una respuesta disciplinada a las protestas masivas, garantizando la estabilidad durante los disturbios."
 ALG_military_police_training: "Entrenamiento de la Policía Militar"
 ALG_military_police_training_desc: "Los programas de entrenamiento para la policía militar aumentarán la disciplina, reducirán la deserción y mejorarán la gestión de la ocupación en regiones inestables."
 ALG_peoples_security: "Seguridad del pueblo"
 ALG_peoples_security_desc: "Una doctrina de «Seguridad del pueblo» fortalecerá la cooperación civil-militar, elevará la moral e integrará a las poblaciones locales en los esfuerzos de defensa nacional."
 ALG_procurement_of_espionage_equipment: "Adquisición de equipos de espionaje"
 ALG_procurement_of_espionage_equipment_desc: "Invertir en tecnología avanzada de vigilancia y espionaje mejorará nuestra capacidad para detectar y neutralizar amenazas internas y extranjeras."
 ALG_occupation_management_strategies: "Estrategias de gestión de ocupación"
 ALG_occupation_management_strategies_desc: "Las nuevas estrategias para gestionar áreas ocupadas o inestables minimizarán la resistencia, reducirán las bajas y consolidarán la autoridad del Estado."
 ALG_french_weapons: "Importar armas francesas"
 ALG_french_weapons_desc: "Al adquirir armas ligeras y equipamiento franceses, Argelia puede modernizar rápidamente su infantería al tiempo que fortalece los lazos con París."
 ALG_russian_guns: "Importar armas rusas"
 ALG_russian_guns_desc: "Las armas ligeras rusas, entregadas a gran escala, proporcionan a Argelia armamento duradero y fiable, reforzando nuestra tradicional asociación de defensa con Moscú."
 ALG_algerian_space_programme: "Establecer la ASAL"
 ALG_algerian_space_programme_desc: "La Agencia Espacial Argelina (ASAL) coordinará todas las actividades espaciales nacionales, desde el desarrollo de satélites hasta la cooperación internacional en la investigación espacial."
 ALG_alsat_initiative: "Iniciativa AlSat"
 ALG_alsat_initiative_desc: "El proyecto AlSat dota a Argelia de sus primeros satélites, dedicados a la observación de la Tierra y a las comunicaciones, marcando nuestra entrada en la era espacial."
 ALG_alsat2_series: "Serie AlSat-2"
 ALG_alsat2_series_desc: "El desarrollo de satélites avanzados AlSat-2 mejorará nuestras capacidades de vigilancia, comunicaciones y teledetección."
 ALG_finance_private_space_companies: "Financiar empresas espaciales privadas"
 ALG_finance_private_space_companies_desc: "Fomentar la participación del sector privado argelino en la industria espacial fortalecerá nuestra base tecnológica nacional de alta tecnología."
 ALG_regional_satnet: "Red satelital regional"
 ALG_regional_satnet_desc: "Vincularemos nuestros satélites en una red regional, integrando los usos civiles y militares al tiempo que conectamos a Argelia con sus vecinos."
 ALG_asal_lunar_project: "Proyecto Lunar de la ASAL"
 ALG_asal_lunar_project_desc: "La agencia espacial de Argelia comenzará un ambicioso proyecto para estudiar la exploración lunar y avanzar en la tecnología de cohetes."
 ALG_human_spaceflight: "Programa de vuelos espaciales tripulados"
 ALG_human_spaceflight_desc: "Nuestro programa espacial dará un paso audaz hacia adelante: planificar el primer vuelo espacial tripulado de Argelia en asociación con aliados internacionales."
 ALG_orbital_defense_program: "Programa de Defensa Orbital"
 ALG_orbital_defense_program_desc: "Los satélites también pueden utilizarse para la defensa. El desarrollo de capacidades de defensa orbital protegerá a Argelia de futuras amenazas."
 ALG_alsat_future: "El futuro de AlSat"
 ALG_alsat_future_desc: "El futuro del programa espacial de Argelia reside en la inversión sostenida, las asociaciones público-privadas y la planificación científica a largo plazo."
 ALG_cyber_sat_integration: "Integración ciber-satelital"
 ALG_cyber_sat_integration_desc: "Fusionar las capacidades de guerra cibernética con nuestra red de satélites otorgará a Argelia una poderosa herramienta asimétrica en los conflictos modernos."
 ALG_idea_the_new_space_race: "La nueva carrera espacial"
 ALG_idea_the_new_space_race_desc: "Argelia ha entrado en la carrera espacial global, compitiendo con las potencias mundiales para demostrar su fuerza tecnológica y estratégica."
 ALG_idea_cyberwarfare_2: "Integración ciber-satelital"
 ALG_idea_cyberwarfare_2_desc: "El mando cibernético de Argelia está ahora integrado con nuestros sistemas satelitales, proporcionando una seguridad de comunicaciones superior y capacidades ofensivas."
 ALG_algeria_police_modifier: "Seguridad Interna de Argelia"
 ALG_algeria_police_modifier_desc: "The Algerian government has a wealth of experience since its time as part of the USSR in suppressing dissent and enemy agents."
 ALG_algeria_police_modifier_tt_intro: "Modificar §Y$ALG_algeria_police_modifier$§! por"
 ALG_algeria_support_category: "Tropas auxiliares de Argelia"
 ALG_stabilize_mali: "Estabilizar Mali"
 ALG_stabilize_mali_desc: "La inestabilidad de Mali amenaza a todo el Sahel. Argelia, con su experiencia en contrainsurgencia y diplomacia, debe intervenir para estabilizar a su vecino del sur, ya sea mediante la fuerza, la negociación o la influencia."
 ALG_back_tuareg_rebellion: "Respaldar la rebelión tuareg"
 ALG_back_tuareg_rebellion_desc: "En lugar de apoyar a Bamako, podemos empoderar a los rebeldes tuareg que buscan la autonomía en el norte de Mali. Esto debilitará la autoridad central de Mali y aumentará nuestra influencia en la región."
 ALG_support_malian_army: "Apoyar al ejército maliense"
 ALG_support_malian_army_desc: "Argelia puede, en su lugar, respaldar directamente al gobierno de Mali, proporcionando apoyo político y militar para fortalecer a su ejército contra los insurgentes."
 ALG_promote_tuareg_dialogue: "Promover el diálogo tuareg"
 ALG_promote_tuareg_dialogue_desc: "En lugar de elegir un bando, Argelia podría albergar conversaciones entre los rebeldes tuareg y el Estado de Mali, posicionándose como mediador y estabilizador en el Sahel."
 ALG_support_tuareg_politicians: "Apoyar a políticos tuareg"
 ALG_support_tuareg_politicians_desc: "Más allá del campo de batalla, la influencia tuareg también puede construirse a través de canales políticos. Apoyar a los líderes tuareg moderados le dará a Argelia aliados a largo plazo dentro de Mali."
 ALG_aid_malian_army: "Ayudar al ejército maliense"
 ALG_aid_malian_army_desc: "Argelia puede enviar armas, vehículos y sistemas de mando para fortalecer la capacidad del ejército de Mali para combatir a los insurgentes y estabilizar el país."
 ALG_mali_stabilized: "Mali estabilizado"
 ALG_mali_stabilized_desc: "Tras años de agitación, los esfuerzos de Argelia han dado sus frutos. El conflicto de Mali está bajo control, la rebelión tuareg contenida y Argelia se erige como la potencia estabilizadora del Sahel."
 ALG_tuareg_autonomy_victory: "Victoria de la autonomía tuareg"
 ALG_tuareg_autonomy_victory_desc: "El movimiento tuareg ha ganado el reconocimiento de su autonomía. Con el respaldo de Argelia, los tuareg ostentan ahora el poder político y Mali se enfrenta a un nuevo equilibrio de autoridad en el Sahel."
 Algeria.237.t: "Intervención argelina en Mali"
 Algeria.237.d: "Argelia ha declarado su intención de estabilizar Mali, citando la preocupación por el terrorismo, el separatismo tuareg y la inestabilidad regional. Con Argel trasladando tropas, ayuda y presión política hacia el sur, el equilibrio de poder en Mali está cambiando. Queda por ver si esto traerá la paz o un conflicto más profundo."
 Algeria.237.a: "Argelia asume el liderazgo en el Sahel."
 Algeria.409.t: "Iniciativa de diálogo tuareg"
 Algeria.409.d: "Argelia ha comenzado a promover el diálogo con los representantes tuareg en Mali y en el Sahel en general. Mientras que algunos en Argel ven esto como un camino hacia la paz y la estabilidad, otros temen que legitimar las demandas tuareg pueda alentar el separatismo. El gobierno debe decidir hasta dónde llegar en el apoyo a esta iniciativa."
 Algeria.409.a: "Comprometerse a través del alcance cultural y mediático"
 Algeria.409.b: "Proporcionar apoyo discreto al liderazgo tuareg"
 ALG_TUA_REV_TT: "La §HResistencia tuareg§! de [TUA.GetFlag] ha sido apoyada por Argelia, lo que ha llevado a la creación de una §YRegión Autónoma Tuareg§! (o potencialmente un §Gnuevo Estado tuareg§!) dentro de Mali."
 ALG_MAL_STABILIZED_TT: "[MAL.GetFlag] §HMali§! ha sido §Gestabilizado§! con el apoyo de Argelia, asegurando la paz y reduciendo el riesgo de un nuevo conflicto."
 ALG_algerian_intervention: "Doctrina de intervención regional"
 ALG_algerian_intervention_desc: "Argelia ha actuado durante mucho tiempo como un componedor del poder regional. Con la inestabilidad amenazando nuestro entorno, debemos decidir si intervenir directamente en los conflictos regionales para salvaguardar nuestros intereses nacionales."
 ALG_intervene_in_sahrawi: "Intervenir en el Sáhara"
 ALG_intervene_in_sahrawi_desc: "El conflicto entre Marruecos y la República Árabe Saharaui Democrática sigue sin resolverse. Argelia debe intervenir diplomática o militarmente para proteger sus fronteras y fortalecer su influencia en el Magreb."
 ALG_supp_polisario: "Apoyar al Frente Polisario"
 ALG_supp_polisario_desc: "La lucha saharaui por la independencia es fundamental para la política regional de Argelia. Al suministrar armas y apoyo al Frente Polisario, podemos debilitar a Marruecos y asegurar que nuestra influencia crezca en el Sáhara Occidental."
 ALG_a_new_stance: "Una nueva postura hacia Marruecos"
 ALG_a_new_stance_desc: "Argelia se ha opuesto tradicionalmente al control marroquí sobre el Sáhara Occidental, pero los vientos políticos cambiantes exigen pragmatismo. Alinearse con Marruecos podría reducir las tensiones, abrir nuevas oportunidades económicas y darnos influencia en el Magreb."
 ALG_intervene_in_libya: "Intervenir en Libia"
 ALG_intervene_in_libya_desc: "El caos en Libia amenaza con extenderse a través de nuestras fronteras. Argelia no puede permitirse la inestabilidad al lado. Ya sea mediante acción militar, diplomacia o influencia encubierta, debemos asegurar nuestros intereses en Libia."
 ALG_assassinate_gaddafi: "Asesinar a Gadafi"
 ALG_assassinate_gaddafi_desc: "El mandato de Muamar el Gadafi desestabiliza a toda la región. Al orquestar su caída, Argelia puede acelerar el cambio de régimen en Libia y asegurar que surja un gobierno más favorable, incluso si eso sume a Libia en una guerra civil."
 ALG_peacekeepers: "Enviar fuerzas de paz a Libia"
 ALG_peacekeepers_desc: "En lugar de hundir a Libia aún más en el caos, Argelia podría intervenir como una fuerza de mantenimiento de la paz. Desplegar tropas para estabilizar la situación fortalecerá nuestra imagen como una potencia regional responsable y nos dará una influencia duradera en Trípoli."
 ALG_pulse.1.t: "El desierto del Sáhara se expande"
 ALG_pulse.1.d: "Según los últimos datos, el Sáhara continúa su avance constante. Las zonas de pastoreo se están volviendo estériles, los oasis se están secando y la fauna salvaje, como las gacelas y los ciervos de Berbería, está desapareciendo debido a la caza furtiva. El sobrepastoreo, la minería sin control e ignorar la caza furtiva solo empeorarán la desertificación."
 ALG_pulse.1.a: "Una señal preocupante"
 ALG_pulse.2.t: "Desierto del Sáhara estable"
 ALG_pulse.2.d: "Los datos de este año sugieren que el avance del Sáhara se ha ralentizado, manteniendo estable la desertificación. Sin embargo, si no se toman medidas contra el sobrepastoreo, la caza furtiva y el uso insostenible de la tierra, el equilibrio podría volver a romperse pronto."
 ALG_pulse.2.a: "Debemos mantenernos vigilantes"
 ALG_pulse.3.t: "El Sáhara retrocede"
 ALG_pulse.3.d: "Informes recientes indican que la vegetación está regresando lentamente a algunas márgenes del desierto. Las patrullas contra la caza furtiva, el pastoreo controlado y los esfuerzos de reforestación parecen estar ayudando a sanar la tierra, restaurando el equilibrio en los ecosistemas frágiles."
 ALG_pulse.3.a: "Progreso alentador"
 ALG_reduce_yearly_good_desertification_5: "Probabilidad de §YOasificación§!: §R-5%§!\n"
 ALG_increase_yearly_good_desertification_5: "Probabilidad de §YOasificación§!: §G+5%§!\n"
 ALG_increase_yearly_bad_desertification_5: "Probabilidad de §YDesertificación§!: §R+5%§!\n"
 ALG_decrease_yearly_bad_desertification_5: "Probabilidad de §YDesertificación§!: §G-5%§!\n"
 ALG_reduce_yearly_neutral_desertification_5: "Probabilidad de §YEstabilización§!: §R-5%§!\n"
 ALG_increase_yearly_neutral_desertification_5: "Probabilidad de §YEstabilización§!: §G+5%§!\n"
 ALG_anti_poaching_raid_successful: "§G¡Eliminamos con éxito a §Y[?poachers_killed]§! cazadores furtivos!§!"
 ALG_anti_poaching_raid_normal: "§G¡Logramos eliminar a §Y[?poachers_killed]§! cazadores furtivos!§!"
 ALG_anti_poaching_raid_failure: "§R¡Nuestros guardabosques sufren bajas!§!"
 ALG_strengthen_ENTV_environmental_campaigns: "Reforzar las campañas ambientales de la ENTV"
 ALG_strengthen_ENTV_environmental_campaigns_desc: "La ENTV, nuestro servicio nacional de radiodifusión, puede utilizarse para concienciar sobre los problemas ambientales. Mediante la realización de campañas sobre la desertificación, la conservación del agua y la protección de la fauna salvaje, podemos animar a los ciudadanos a apoyar un futuro sostenible."
 ALG_increase_cattle_grazing: "Expandir el pastoreo de ganado"
 ALG_increase_cattle_grazing_desc: "La cría de ganado sigue siendo una piedra angular de la economía de la estepa y el altiplano de Argelia. Expandir el pastoreo de vacas y ovejas podría impulsar los ingresos rurales, pero arriesga agravar el sobrepastoreo, la degradación del suelo y la desertificación si no se gestiona con cuidado."
 ALG_optimize_pastoral_practices: "Optimizar las prácticas pastoriles"
 ALG_optimize_pastoral_practices_desc: "Los métodos tradicionales de pastoreo han ejercido una enorme presión sobre los ecosistemas frágiles. Al introducir el pastoreo rotativo, el uso sostenible del agua y una mejor atención veterinaria, podemos modernizar las prácticas pastoriles y reducir su impacto en la estepa y en los márgenes del Sáhara."
 ALG_expand_steppe_farming: "Expandir la agricultura esteparia"
 ALG_expand_steppe_farming_desc: "Las regiones esteparias de Argelia, ubicadas entre el Atlas del Tell y el Sáhara, son vitales para la producción de cereales y ganado. Al invertir en proyectos de irrigación y recuperación de tierras, podemos aumentar el cultivo en estas áreas, aunque a riesgo de sufrir una mayor presión ambiental."
 ALG_research_drought_resistant_crops: "Investigar cultivos resistentes a la sequía"
 ALG_research_drought_resistant_crops_desc: "El cambio climático y la desertificación amenazan la seguridad alimentaria de Argelia. Al invertir en la investigación de cultivos resistentes a la sequía, como cereales resilientes y variedades de palmeras datileras, podemos salvaguardar nuestro sector agrícola contra el empeoramiento de las condiciones áridas."
 ALG_shrink_nature_reserves_sahara: "Reducir las reservas naturales del Sáhara"
 ALG_shrink_nature_reserves_sahara_desc: "Algunos sostienen que grandes porciones de tierra destinadas a reservas naturales en el Sáhara podrían reutilizarse para la agricultura, el pastoreo o proyectos industriales. Reducir el tamaño de estas reservas permitiría el desarrollo, pero a un gran coste ambiental."
 ALG_expand_nature_reserves_sahara: "Expandir las reservas naturales del Sáhara"
 ALG_expand_nature_reserves_sahara_desc: "Proteger los ecosistemas frágiles del Sáhara es esencial para la biodiversidad y el equilibrio ambiental a largo plazo. Al expandir las áreas protegidas, podemos salvaguardar a las especies en peligro de extinción y reducir las presiones que contribuyen a la desertificación."
 ALG_drs: "El DRS"
 ALG_drs_desc: "El Département du Renseignement et de la Sécurité (DRS) de Argelia se forjó durante la sangrienta Década Negra y se hizo tristemente célebre por sus vastos poderes. Aunque oficialmente actúa como escudo contra el terrorismo y la infiltración extranjera, el DRS también interviene fuertemente en la política, asegurando la preservación de la autoridad y estabilidad del Estado, incluso a costa de las libertades civiles."
 ALG_decline_of_tourism: "Declive del turismo"
 ALG_destroyed_agriculture: "Agricultura destruida"
 ALG_tikjda_resort: "Estación de esquí de Tikjda"
 ALG_algerian_tourism: "Turismo en Argelia"
 ALG_natural_products_idea: "Productos naturales argelinos"
 ALG_sonatrach: "Expansión de Sonatrach"
 algeria_invest.1.t: "Inversiones en Argelia"
 algeria_invest.1.d: "Argelia nos solicita que invirtamos en su Estado. Gracias a las inversiones en Argelia, podemos fortalecer nuestra influencia en el norte de África y a lo largo de la costa mediterránea."
 algeria_invest.1.a: "Aceptar"
 algeria_invest.1.b: "Rechazar"
 algeria_invest.2.t: "Han aceptado"
 algeria_invest.2.d: "Han accedido a invertir en nuestro país."
 algeria_invest.2.a: "Bien."
 algeria_invest.3.t: "Rechazaron la oferta"
 algeria_invest.3.d: "Se negaron a invertir en nuestro país, alegando que nuestra oferta no era rentable."
 algeria_invest.3.a: "Lamentable"
 algeria_invest.4.t: "Inversiones americanas en Argelia"
 algeria_invest.4.d: "Argelia ofrece a nuestras empresas la oportunidad de invertir en su economía. A cambio, ganaremos influencia y, a largo plazo, fortaleceremos las relaciones con Argelia."
 algeria_invest.4.a: "¿Quién dijo dinero?"
 algeria_invest.4.b: "No"
 algeria_invest.5.t: "América aceptó."
 algeria_invest.5.d: "Las empresas estadounidenses ya han comenzado a planificar proyectos de inversión en Argelia."
 algeria_invest.5.a: "Una victoria para los negocios y la democracia."
 algeria_invest.6.t: "América rechazó la oferta"
 algeria_invest.6.d: "América se ha negado a invertir en nuestra economía. No confían en la transparencia de nuestro sistema político."
 algeria_invest.6.a: "Bueno, entonces llamaremos a Europa."
 algeria_invest.7.t: "Inversiones europeas en Argelia"
 algeria_invest.7.d: "Argelia nos solicita que invirtamos en su economía. Según ellos, disponen de un clima de inversión favorable y nuestra implicación fortalecerá los lazos a través del Mediterráneo."
 algeria_invest.7.a: "Por supuesto"
 algeria_invest.7.b: "No hay dinero."
 algeria_invest.8.t: "Europa aceptó"
 algeria_invest.8.d: "Los inversores europeos han acordado apoyar nuestra economía. Varias empresas importantes ya están dispuestas a poner en marcha proyectos de inversión en Argelia."
 algeria_invest.8.a: "Buenas noticias para el desarrollo."
 algeria_invest.9.t: "Europa rechazó la oferta"
 algeria_invest.9.d: "Alegaron que no hay dinero disponible en este momento para asignar un paquete de inversión."
 algeria_invest.9.a: "Lamentable"
 algeria_invest.10.t: "Inversor chino financia el metro de Argel"
 algeria_invest.10.d: "Un inversor chino nos ofrece dinero para ampliar el metro de Argel. Podemos construir el metro con sus fondos o malversarlos engañándolos, pero esto podría dañar nuestras relaciones con China."
 algeria_invest.10.a: "¡Argel necesita un metro!"
 algeria_invest.10.b: "¡Argelia necesita dinero!"
 algeria_invest.11.t: "Argelia nos ha engañado"
 algeria_invest.11.d: "Un grupo de estafadores argelinos amañó el proyecto del metro y se llevó todo el dinero que les habíamos preparado."
 algeria_invest.11.a: "Bastardos"
 algeria_invest.12.t: "Inversiones de Rebrab"
 algeria_invest.12.d: "Issad Rebrab, fundador de Cevital, es uno de los empresarios más influyentes de Argelia. Desde la década de 1990, ha invertido en la industria, la producción de alimentos y la expansión internacional. Gracias a él, Argelia ha ganado fábricas, puestos de trabajo y proyectos de gran prestigio. Sigue siendo un símbolo del potencial del sector privado en el país."
 algeria_invest.12.a: "¡Gracias, Rebrab!"
 ALG_our_economy: "Nuestra economía"
 ALG_our_economy_desc: "La economía de Argelia se encuentra ante una encrucijada. Tras años de inestabilidad y falta de inversión, el gobierno debe decidir si centrarse en el interior o abrir las puertas a la modernización y al crecimiento."
 ALG_attract_foreign_inv: "Atraer la inversión extranjera"
 ALG_attract_foreign_inv_desc: "Al abrir nuestros mercados a los inversores extranjeros, Argelia puede asegurar capital, conocimientos técnicos y proyectos de infraestructura que de otro modo quedarían fuera de nuestro alcance."
 ALG_france_inv: "Buscar inversión francesa"
 ALG_france_inv_desc: "Francia sigue siendo uno de los socios económicos más cercanos de Argelia. Renovar su implicación en nuestros sectores energético e industrial podría acelerar el desarrollo, siempre que podamos tolerar su influencia."
 ALG_chinese_inv: "Iniciativa de inversión china"
 ALG_chinese_inv_desc: "China ofrece ambiciosos paquetes de inversión, a menudo vinculados al desarrollo de infraestructuras y recursos. Asociarse con Pekín podría transformar nuestra economía, pero a costa de una mayor dependencia."
 ALG_usa_inv: "Invitar a la inversión estadounidense"
 ALG_usa_inv_desc: "Los Estados Unidos pueden proporcionar tecnología avanzada y un respaldo financiero sustancial. La cooperación con Washington puede remodelar la industria y los servicios de Argelia para convertirlos en competidores globales."
 ALG_russian_inv: "Cooperación económica rusa"
 ALG_russian_inv_desc: "Rusia ha sido durante mucho tiempo un aliado estratégico en materia de energía y defensa. Ampliar la cooperación a proyectos económicos más amplios fortalecerá nuestra columna vertebral industrial y militar."
 ALG_iran_inv: "Asociación con Irán"
 ALG_iran_inv_desc: "Argelia e Irán comparten una historia de no alineación y resistencia a la dominación extranjera. La expansión de los lazos con Teherán podría abrir nuevas vías en la cooperación energética, proyectos industriales y diplomacia regional, aunque puede despertar inquietud entre los socios occidentales."
 ALG_italia_inv: "Fortalecer los lazos con Italia"
 ALG_italia_inv_desc: "Italia es uno de los socios europeos más cercanos de Argelia, especialmente a través del papel de ENI en nuestro sector energético. Al profundizar la cooperación con Roma, podemos asegurar inversiones vitales en infraestructuras, impulsar el comercio mediterráneo y reforzar nuestra posición como proveedor clave de energía para Europa."
 ALG_algiers_metro_expansion: "Expandir el metro de Argel"
 ALG_algiers_metro_expansion_desc: "Argel sufre problemas de congestión y una infraestructura obsoleta. La expansión del sistema de metro no solo modernizará el transporte, sino que también enviará una señal de progreso tanto a los inversores como a los ciudadanos."
 ALG_cevital_group_expansion: "Expansión del Grupo Cevital"
 ALG_cevital_group_expansion_desc: "Cevital, el principal conglomerado de Argelia, tiene el potencial de convertirse en una potencia continental. Respaldar su crecimiento creará puestos de trabajo y acelerará la modernización industrial."
 ALG_scientific_research_push: "Promover la investigación científica"
 ALG_scientific_research_push_desc: "La innovación es la clave para el crecimiento a largo plazo. Al invertir en la investigación científica, Argelia puede sentar las bases para una economía basada en el conocimiento."
 ALG_expand_higher_education: "Expandir la educación superior"
 ALG_expand_higher_education_desc: "Las universidades y escuelas técnicas deben ampliarse y modernizarse para satisfacer las demandas del siglo XXI. Una población mejor educada fortalecerá tanto a la sociedad como a la economía."
 ALG_digitalize_education: "Digitalizar la educación"
 ALG_digitalize_education_desc: "Las plataformas digitales, el aprendizaje en línea y la integración de las tecnologías de la información revolucionarán el sector educativo de Argelia, creando una fuerza laboral más cualificada y adaptable."
 ALG_national_research_program: "Lanzar el Programa Nacional de Investigación"
 ALG_national_research_program_desc: "Reuniendo a las universidades, la industria y el gobierno, un programa nacional de investigación coordinado permitirá a Argelia mantenerse al ritmo de los avances tecnológicos globales."
 ALG_industry: "Expandir la industria argelina"
 ALG_industry_desc: "La industria de Argelia debe diversificarse y modernizarse. Al promover el crecimiento industrial, podemos reducir la dependencia de los hidrocarburos y crear una economía más equilibrada."
 ALG_constantine_hub: "Desarrollar el centro industrial de Constantina"
 ALG_constantine_hub_desc: "La ciudad de Constantina es un importante centro regional. Invertir aquí creará un nuevo núcleo industrial que extenderá el crecimiento fuera de Argel."
 ALG_tlemcen_agro_industry: "Impulsar la agroindustria de Tremecén"
 ALG_tlemcen_agro_industry_desc: "La agricultura y el procesamiento de alimentos en Tremecén pueden desarrollarse hasta convertirse en un poderoso sector agroindustrial, alimentando a la nación y creando puestos de trabajo."
 ALG_snvi_modernization: "Modernizar la SNVI"
 ALG_snvi_modernization_desc: "La SNVI, el fabricante nacional de vehículos de Argelia, debe modernizarse para competir a nivel global. Expandir la capacidad de producción fortalecerá nuestra base industrial y de transporte."
 ALG_annaba_steel_complex: "Complejo siderúrgico de Annaba"
 ALG_annaba_steel_complex_desc: "Annaba alberga las mayores instalaciones de producción de acero de Argelia. Su modernización y expansión proporcionarán la columna vertebral para las futuras industrias de infraestructura y defensa."
 ALG_arzew_refinery: "Expansión de la refinería de Arzew"
 ALG_arzew_refinery_desc: "La refinería de Arzew es un eslabón vital en nuestras exportaciones de energía. Expandir su capacidad asegurará la entrada de divisas y fortalecerá el dominio de Sonatrach."
 ALG_pipeline_modernization: "Modernizar los gasoductos y oleoductos"
 ALG_pipeline_modernization_desc: "Un sistema de tuberías moderno es esencial para unas exportaciones de energía seguras y eficientes. La actualización de nuestros oleoductos y gasoductos evitará pérdidas y mejorará la fiabilidad internacional."
 ALG_skikda_port_modernization: "Modernizar el puerto de Skikda"
 ALG_skikda_port_modernization_desc: "El puerto de Skikda es crítico para el comercio y las exportaciones de energía. La modernización de sus instalaciones garantizará que Argelia siga siendo un centro marítimo competitivo."
 ALG_grant_foreign_energy_concessions: "Conceder concesiones energéticas extranjeras"
 ALG_grant_foreign_energy_concessions_desc: "Al otorgar concesiones selectas a empresas extranjeras, Argelia puede atraer capital y tecnología, aunque a riesgo de ceder parte de su independencia energética."
 ALG_hassi_messaoud_expansion: "Expandir el campo petrolífero de Hassi Messaoud"
 ALG_hassi_messaoud_expansion_desc: "El campo petrolífero de Hassi Messaoud es el más grande de Argelia. Expandir la capacidad de extracción y refinamiento impulsará enormemente nuestra producción de energía."
 ALG_expand_sonatrach: "Expandir Sonatrach"
 ALG_expand_sonatrach_desc: "Sonatrach es el corazón que hace latir la economía de Argelia. El fortalecimiento de la empresa asegurará nuestro papel global en la producción de petróleo y gas."
 ALG_protect_oil_gas_facilities: "Proteger las instalaciones de petróleo y gas"
 ALG_protect_oil_gas_facilities_desc: "Nuestra infraestructura energética es vulnerable en tiempos de guerra o disturbios. Fortalecer las defensas alrededor de las instalaciones de petróleo y gas es fundamental para la seguridad nacional."
 ALG_minister_of_agriculture_reforms: "Programa de reforma agraria"
 ALG_minister_of_agriculture_reforms_desc: "Años de abandono han debilitado la agricultura de Argelia. Nuevas reformas bajo el Ministerio de Agricultura restaurarán la productividad y reducirán la dependencia de las importaciones de alimentos."
 ALG_modernize_agricultural_sector: "Modernizar el sector agrícola"
 ALG_modernize_agricultural_sector_desc: "Años de conflicto y abandono han dejado las granjas de Argelia obsoletas e ineficientes. La mecanización, los sistemas de riego y los subsidios revitalizarán el sector agrícola, garantizando la seguridad alimentaria de nuestro pueblo."
 ALG_rural_development_program: "Programa de desarrollo rural"
 ALG_rural_development_program_desc: "Los pueblos de Argelia han sufrido durante mucho tiempo la falta de inversión. Al dirigir fondos hacia la infraestructura rural, la energía y el empleo, reduciremos la desigualdad entre las ciudades y el campo y fortaleceremos la unidad nacional."
 ALG_promote_algerian_produce: "Promover el producto argelino"
 ALG_promote_algerian_produce_desc: "Nuestra tierra produce una amplia variedad de cultivos y productos naturales, pero las importaciones extranjeras dominan los mercados locales. A través de marcas, subsidios e incentivos comerciales, elevaremos el perfil de los productos argelinos en el país y en el extranjero."
 ALG_build_farm_to_market_roads: "Carreteras del campo al mercado"
 ALG_build_farm_to_market_roads_desc: "Los agricultores necesitan un mejor acceso a los consumidores y a las rutas de exportación. La construcción de carreteras desde las zonas rurales hasta los centros urbanos y a través de la frontera tunecina fortalecerá tanto nuestro sector agrícola como los lazos regionales."
 ALG_new_agro_industrial_complexes: "Nuevos complejos agroindustriales"
 ALG_new_agro_industrial_complexes_desc: "Argelia debe vincular la agricultura con la industria moderna. Mediante la construcción de complejos agroindustriales, podemos crear productos de valor añadido, generar empleos y elevar los ingresos rurales."
 ALG_invest_tourism: "Invertir en turismo"
 ALG_invest_tourism_desc: "El turismo prosperó una vez en Argelia antes de que los años de la guerra ahuyentaran a los visitantes. Con una inversión cuidadosa y una seguridad mejorada, podemos comenzar a restaurar este sector vital."
 ALG_restore_hotel_resorts: "Restaurar complejos hoteleros"
 ALG_restore_hotel_resorts_desc: "Muchos de los complejos hoteleros y hoteles de Argelia se encuentran en ruinas o en mal estado. Su renovación ayudará a atraer visitantes extranjeros y proporcionará empleos nacionales."
 ALG_blida_airbase_modernization: "Modernización de la base aérea de Blida"
 ALG_blida_airbase_modernization_desc: "La base aérea de Blida es una instalación clave tanto para los viajes civiles como para el transporte militar. Su modernización mejorará la conectividad de Argelia e impulsará el comercio regional."
 ALG_algiers_oran_highway: "Autopista Argel–Orán"
 ALG_algiers_oran_highway_desc: "Conectar Argel con Orán mediante una autopista moderna acortará los tiempos de transporte, respaldará el comercio y fortalecerá la columna vertebral económica de Argelia."
 ALG_east_west_highway_project: "Proyecto de la autopista Este–Oeste"
 ALG_east_west_highway_project_desc: "Extendiéndose a lo largo de Argelia, la autopista Este-Oeste será uno de los proyectos de infraestructura más grandes de África, conectando nuestras regiones y estimulando el comercio."
 ALG_ski_resorts_of_tikjda: "Estaciones de esquí de Tikjda"
 ALG_ski_resorts_of_tikjda_desc: "En las montañas cabilas se encuentra Tikjda, un complejo con un potencial sin explotar. La modernización de sus instalaciones y la promoción del turismo de invierno diversificarán la base económica de Argelia."
 ALG_north_african_tourism_hub: "Centro turístico del norte de África"
 ALG_north_african_tourism_hub_desc: "Al invertir en nuestras costas, patrimonio cultural y paisajes naturales, Argelia puede convertirse en el principal destino turístico del norte de África, rivalizando con nuestros vecinos mediterráneos."
 ALG_it_investments: "Inversiones en TI"
 ALG_it_investments_desc: "Con la velocidad a la que evoluciona la tecnología informática, no podremos prescindir de ella en el futuro. Así que es el momento ideal para invertir en este sector."
 ALG_infrastructure_investments: "Inversiones en infraestructura"
 ALG_infrastructure_investments_desc: "Nuestra infraestructura después de la década de los 90 se encuentra en un estado deplorable. Ya es hora de que sea reconstruida."
 ALG_science_idea: "Ciencia y educación argelinas"
 ALG_fuel: "Combustible argelino"
 ALG_dziri: "Dziri"
 ALG_dziri_desc: "Argelia debe abordar sus apremiantes cuestiones sociales: desde la tradición y el Islam hasta los derechos amazigh y las reformas democráticas. El camino que elijamos dará forma a la nación."
 ALG_traditions_matter: "Las tradiciones importan"
 ALG_traditions_matter_desc: "El pueblo argelino se aferra firmemente a la fe, la familia y la identidad nacional. Nuestro gobierno debe respetar estas tradiciones si queremos mantener la legitimidad."
 ALG_restrict_women_roles: "Preservar el Código de Familia"
 ALG_restrict_women_roles_desc: "Los líderes conservadores sostienen que los roles de las mujeres deben seguir centrados en la familia. Reformar el Código de Familia corre el riesgo de enfurecer a las autoridades religiosas y al público."
 ALG_expand_berber_rights: "Reconocer los derechos amazigh"
 ALG_expand_berber_rights_desc: "El movimiento por la identidad bereber exige un reconocimiento cultural y lingüístico pleno. Conceder los derechos amazigh desactivaría las tensiones, pero podría alienar a los de la línea dura."
 ALG_censor_internet: "Censurar internet"
 ALG_censor_internet_desc: "Las redes sociales y el activismo en línea han alimentado las protestas. Restringir las libertades en línea restablecerá el control estatal, pero dañará nuestra imagen internacional."
 ALG_open_civil_society: "Abrir la sociedad civil"
 ALG_open_civil_society_desc: "Las fuerzas democráticas presionan por una sociedad civil libre, ONG y asociaciones del Hirak. Abrir este espacio fortalecería la legitimidad, pero arriesga la fragmentación política."
 ALG_integration_policy: "Política de integración"
 ALG_integration_policy_desc: "Los migrantes subsaharianos y la diáspora que regresa se enfrentan a desafíos. Una política de integración estructurada puede reducir las tensiones sociales y promover la cohesión."
 ALG_marriage_subsidies: "Subsidios al matrimonio"
 ALG_marriage_subsidies_desc: "Dado que los jóvenes luchan por casarse y formar familias, los subsidios para la vivienda y las bodas estabilizarán la sociedad y fomentarán la formación de familias."
 ALG_constitutionalize_rights: "Constitucionalizar los derechos"
 ALG_constitutionalize_rights_desc: "Podemos blindar las libertades civiles, los derechos de las mujeres y el reconocimiento amazigh a través de una reforma constitucional. Esto señalaría un cambio social permanente."
 ALG_berber_right: "Reconocimiento amazigh"
 ALG_berber_right_desc: "La identidad amazigh ha sido reconocida oficialmente, impulsando la estabilidad en las regiones de mayoría bereber."
 Algeria.238.t: "Estabilizar Mali"
 Algeria.238.d: "El conflicto en curso en Mali amenaza con desestabilizar a toda la región del Sahel. Los separatistas tuareg y los grupos yihadistas han creado una crisis de seguridad en nuestra frontera sur. Argelia no puede permitirse permanecer pasiva mientras se extiende la inestabilidad. Debemos decidir si apoyamos al gobierno maliense para restaurar el orden, o si entablamos negociaciones con las facciones tuareg con la esperanza de lograr un acuerdo duradero."
 Algeria.238.a: "Apoyar al gobierno maliense"
 Algeria.238.b: "Proporcionar apoyo a las fuerzas tuareg"
 ALG_us_invest_tt: "Buscar la inversión estadounidense en Argelia"
 ALG_fra_invest_tt: "Buscar la inversión francesa en Argelia"
 ALG_eng_invest_tt: "Buscar la inversión británica en Argelia"
 ALG_chi_invest_tt: "Buscar la inversión china en Argelia"
 ALG_rus_invest_tt: "Buscar la inversión rusa en Argelia"
 ALG_open_to_west: "Apertura hacia Occidente"
 ALG_open_to_west_desc: "Argelia ha perseguido la neutralidad durante mucho tiempo, pero los tiempos están cambiando. Alinearnos más estrechamente con el mundo occidental podría aportar estabilidad, seguridad y oportunidades de inversión."
 ALG_nato_partnership: "Asociación con la OTAN"
 ALG_nato_partnership_desc: "Exploraremos una cooperación estructurada con la OTAN. Esta asociación fortalecerá la posición internacional de Argelia y ayudará a modernizar nuestras fuerzas armadas."
 ALG_energy_partnership_eu: "Asociación energética con la UE"
 ALG_energy_partnership_eu_desc: "Las vastas reservas de energía de Argelia son muy codiciadas en Europa. Al forjar asociaciones energéticas con Francia y el Reino Unido, podemos asegurar contratos lucrativos e inversiones a largo plazo."
 ALG_strengthen_eu_trade: "Reforzar las relaciones comerciales con la UE"
 ALG_strengthen_eu_trade_desc: "Europa sigue siendo nuestro mayor socio comercial. El fortalecimiento de estos lazos económicos estabilizará nuestro mercado de exportación e integrará aún más a Argelia en el comercio mundial."
 ALG_expand_us_partnership: "Ampliar la asociación con EE. UU."
 ALG_expand_us_partnership_desc: "Los Estados Unidos buscan la estabilidad en el norte de África. Al ampliar la cooperación económica y de seguridad con Washington, Argelia puede atraer inversiones y ganar un aliado poderoso."
 ALG_become_nato_ally: "Convertirse en aliado de la OTAN"
 ALG_become_nato_ally_desc: "Aunque una membresía plena en la OTAN puede ser prematura, Argelia puede obtener el estatus de aliado de confianza. Esto nos otorgaría acceso a experiencia militar, ejercicios conjuntos e influencia diplomática."
 ALG_exchange_research_with_nato: "Intercambio de investigación con la OTAN"
 ALG_exchange_research_with_nato_desc: "La cooperación científica con los aliados de la OTAN permitirá a Argelia beneficiarse de la investigación conjunta, el intercambio de tecnología militar y la modernización de nuestras instituciones educativas y de investigación."
 ALG_get_nato_military_exp: "Obtener experiencia militar de la OTAN"
 ALG_get_nato_military_exp_desc: "El extenso entrenamiento militar y la doctrina de la OTAN ofrecen una experiencia valiosa. Las fuerzas armadas de Argelia se modernizarán mediante ejercicios de entrenamiento combinados y orientación estratégica."
 ALG_counterterrorism_coordination: "Coordinación antiterrorista"
 ALG_counterterrorism_coordination_desc: "El terrorismo sigue siendo una de las principales amenazas en el norte de África. Al coordinarse con las unidades de inteligencia y antiterrorismo de la OTAN, Argelia puede fortalecer la seguridad nacional y la estabilidad regional."
 ALG_get_investements_from_nato: "Atraer inversiones de la OTAN"
 ALG_get_investements_from_nato_desc: "Nuestra alineación con la OTAN atraerá apoyo económico y proyectos de infraestructura de los miembros de la alianza, asegurando beneficios a largo plazo para la economía de Argelia."
 ALG_strengthen_democratic_norms: "Fortalecer las normas democráticas"
 ALG_strengthen_democratic_norms_desc: "Para integrarse plenamente con el mundo occidental, Argelia debe fortalecer las instituciones democráticas. Esto incluye proteger las libertades civiles, apoyar el pluralismo y fomentar la reforma política."
 ALG_seek_greater_influence_in_wto: "Buscar mayor influencia en la OMC"
 ALG_seek_greater_influence_in_wto_desc: "A medida que Argelia se desarrolla, debemos ampliar nuestro papel dentro de la Organización Mundial del Comercio, asegurando que nuestra voz sea escuchada en las negociaciones económicas globales."
 ALG_seek_security_council_seat: "Buscar un asiento en el Consejo de Seguridad de la ONU"
 ALG_seek_security_council_seat_desc: "La historia diplomática de Argelia y su historial de mantenimiento de la paz nos otorgan sólidos argumentos para una presencia permanente en el Consejo de Seguridad de la ONU. Debemos presionar para lograr esta ambición."
 ALG_join_nato: "Unirse a la OTAN"
 ALG_join_nato_desc: "Tras décadas de neutralidad y un cauteloso equilibrio, Argelia se prepara ahora para dar un paso histórico: la membresía plena en la OTAN. Esta decisión consolidará nuestro lugar entre las potencias occidentales y remodelará nuestra política exterior."
 ALG_global_companies: "Invitar a corporaciones globales"
 ALG_global_companies_desc: "Al abrir nuestros mercados a los inversores extranjeros, Argelia puede atraer a corporaciones globales para que establezcan una presencia en nuestra economía. Esto impulsará el crecimiento industrial, las transferencias de tecnología y el prestigio internacional."
 ALG_huawei: "Telecomunicaciones de Huawei"
 ALG_huawei_desc: "Huawei se ha ofrecido a establecer una infraestructura avanzada de telecomunicaciones en Argelia, proporcionándonos una columna vertebral digital moderna y asegurando nuestro papel en la era de la información."
 ALG_hyundai: "Expansión industrial de Hyundai"
 ALG_hyundai_desc: "Hyundai ha expresado interés en invertir en los sectores automotriz e industrial de Argelia. Al dar la bienvenida a sus fábricas, podemos estimular el empleo y el desarrollo tecnológico."
 ALG_weapons_expert: "Experiencia en armas extranjeras"
 ALG_weapons_expert_desc: "A través de la cooperación con empresas de defensa extranjeras, Argelia puede adquirir nueva experiencia en armas de apoyo y sistemas tácticos, fortaleciendo nuestras fuerzas terrestres."
 ALG_airburst_weapons: "Desarrollar armas de explosión aérea"
 ALG_airburst_weapons_desc: "La tecnología de explosión aérea (airburst) permite a la infantería atacar a los enemigos detrás de coberturas o en posiciones fortificadas. Invertir en este sistema de vanguardia incrementará enormemente nuestra eficacia en el campo de batalla."
 ALG_vehicle_industry: "Expandir la industria automotriz"
 ALG_vehicle_industry_desc: "Al asociarnos con fabricantes de automóviles y empresas industriales globales, Argelia puede establecer una sólida industria de vehículos militares y civiles para impulsar tanto la defensa como la economía."
 ALG_advanced_ultility_vehicle: "Vehículos utilitarios avanzados"
 ALG_advanced_ultility_vehicle_desc: "Nuestro sector de automoción debe avanzar hacia el desarrollo avanzado. La producción de vehículos utilitarios modernos y fiables fortalecerá la logística y la eficiencia del transporte."
 ALG_sat_tech: "Cooperación en tecnología satelital"
 ALG_sat_tech_desc: "A través de asociaciones con empresas globales, Argelia puede desarrollar tecnología satelital avanzada, mejorando nuestros sistemas de vigilancia, comunicaciones y posicionamiento."
 ALG_advanced_radar: "Sistemas de radar avanzados"
 ALG_advanced_radar_desc: "La tecnología moderna de radar y detección otorgará a Argelia mayores capacidades defensivas y nos permitirá integrarnos en marcos avanzados de seguridad regional."
 ALG_microsoft: "Infraestructura digital de Microsoft"
 ALG_microsoft_desc: "Al asociarnos con Microsoft, Argelia puede modernizar sus sectores de TI y software, mejorando la ciberseguridad, la administración digital y el crecimiento impulsado por la tecnología."
 ALG_Lenovo: "Inversión tecnológica de Lenovo"
 ALG_Lenovo_desc: "Lenovo está interesada en expandir su presencia en Argelia. Colaborar con ellos fortalecerá nuestra industria de hardware informático y apoyará la innovación tecnológica."
 ALG_Danone: "Expansión de la industria alimentaria de Danone"
 ALG_Danone_desc: "Dar la bienvenida a la inversión de Danone en el sector alimentario de Argelia impulsará la nutrición, los estándares de producción de alimentos y las relaciones comerciales internacionales."
 ALG_toyota: "Asociación industrial con Toyota"
 ALG_toyota_desc: "Al invitar a Toyota a establecer instalaciones industriales y de automoción, Argelia puede mejorar la producción de vehículos, crear puestos de trabajo y promover el avance tecnológico en el sector automotriz."
 ALG_align_with_south_africa: "Alinearse con Sudáfrica"
 ALG_align_with_south_africa_desc: "Sudáfrica desempeña un papel destacado en los asuntos políticos y económicos de África. Al fortalecer nuestra asociación, podemos coordinar políticas sobre comercio, diplomacia y seguridad en todo el continente."
 ALG_open_to_east: "Apertura hacia el Este"
 ALG_open_to_east_desc: "Aliarse con el Este diversificará nuestras asociaciones, reducirá la dependencia de Occidente y abrirá oportunidades en mercados como Rusia, China y otras potencias en auge."
 ALG_expand_trade_with_russia: "Expandir el comercio con Rusia"
 ALG_expand_trade_with_russia_desc: "Rusia ofrece a Argelia nuevas oportunidades en materia de energía, armamento y cooperación industrial. El fortalecimiento de nuestros lazos comerciales profundizará las relaciones estratégicas."
 ALG_expand_trade_with_china: "Expandir el comercio con China"
 ALG_expand_trade_with_china_desc: "China está ansiosa por invertir en África y ofrece a Argelia acuerdos comerciales beneficiosos. Esta cooperación podría proporcionarnos desarrollo industrial e infraestructuras."
 ALG_mediterranean_corridor_initiative: "Iniciativa del Corredor Mediterráneo"
 ALG_mediterranean_corridor_initiative_desc: "Al vincular nuestra economía más estrechamente con los mercados mediterráneos y orientales, Argelia puede consolidarse como un corredor clave para proyectos comerciales y de infraestructura."
 ALG_Investments_From_East: "Inversiones orientales"
 ALG_Investments_From_East_desc: "Atraer inversores del Este fortalecerá nuestra economía, proporcionará nuevas industrias y garantizará que Argelia se beneficie de fuentes de capital diversificadas."
 ALG_eastern_alignment: "Alineación oriental"
 ALG_eastern_alignment_desc: "Una alineación más fuerte con Rusia, China y sus aliados otorgará a Argelia nuevos socios en seguridad, comercio y tecnología, al tiempo que reducirá la influencia occidental."
 ALG_china_civ: "Inversiones civiles chinas"
 ALG_china_civ_desc: "Las corporaciones chinas están listas para expandirse en las industrias civiles de Argelia. Estos proyectos generarán empleos y acelerarán la modernización."
 ALG_china_civ2: "Nuevos proyectos civiles chinos"
 ALG_china_civ2_desc: "Tras el éxito de las empresas anteriores, China ofrece inversiones adicionales para expandir aún más la base industrial civil de Argelia."
 ALG_chinese_armor_deal: "Acuerdo de blindados chinos"
 ALG_chinese_armor_deal_desc: "China ha propuesto vender a Argelia vehículos blindados y paquetes tecnológicos. Este acuerdo mejorará nuestras fuerzas terrestres y profundizará los lazos de defensa."
 ALG_joint_military_exercise_with_rus: "Ejercicios militares conjuntos con Rusia"
 ALG_joint_military_exercise_with_rus_desc: "Al realizar ejercicios conjuntos con Rusia, Argelia mejorará la coordinación militar y aprenderá de la experiencia de combate rusa."
 ALG_russia_inf_tech: "Tecnología de infantería rusa"
 ALG_russia_inf_tech_desc: "La experiencia rusa en armas ligeras y tácticas de infantería puede adaptarse a las necesidades argelinas, otorgando a nuestros soldados mejores herramientas y entrenamiento."
 ALG_russia_experience: "Cooperación de defensa con Moscú"
 ALG_russia_experience_desc: "Profundizar la cooperación militar con Rusia traerá asesores experimentados y programas de entrenamiento a Argelia. Nuestras fuerzas armadas emergerán más fuertes y preparadas."
 ALG_idea_parliamentary_republic: "Majlis al-Watani al-Shaabi"
 ALG_idea_presidential_republic: "Sistema presidencial"
 ALG_idea_semi_presidential_republic: "Al-Jumhorya al-Democratia al-Shaabia"
 ALG_release_political_pirsoners: "Liberar a los presos políticos"
 ALG_release_political_pirsoners_desc: "Para abrir un nuevo capítulo para la nación, la nueva administración liberará a los detenidos por motivos políticos durante los años de disturbios. Este acto de clemencia tiene como objeto fomentar la unidad nacional y reconstruir la confianza entre el pueblo y el Estado."
 ALG_al_jazair_al_djadida: "Al-Jazair Al-Djadida"
 ALG_al_jazair_al_djadida_desc: "La promesa de una «Nueva Argelia» del presidente Abdelmadjid Tebboune busca renovar la legitimidad del Estado mediante reformas constitucionales y administrativas, fortaleciendo las instituciones democráticas y la confianza pública."
 ALG_republic_of_algeria: "La República de Argelia"
 ALG_republic_of_algeria_desc: "Con los cimientos de la reforma asentados, Argelia reafirma su identidad como una república guiada por la soberanía nacional, la justicia social y la voluntad de sus ciudadanos."
 ALG_majlis_al_watani_al_shaabi: "Majlis al-Watani al-Shaabi"
 ALG_majlis_al_watani_al_shaabi_desc: "Una república parlamentaria otorgaría a los representantes electos del pueblo el poder de guiar el rumbo de la nación, limitando el dominio del ejecutivo y garantizando la toma de decisiones colectiva."
 ALG_jumhorya_democratia_shaabia: "Al-Jumhorya al-Democratia al-Shaabia"
 ALG_jumhorya_democratia_shaabia_desc: "Mantener un equilibrio semipresidencial entre el poder ejecutivo y el legislativo podría estabilizar la transición de Argelia, evitando el regreso al autoritarismo al tiempo que garantiza una gobernanza decisiva."
 ALG_deep_state_republic: "La República del Estado Profundo"
 ALG_deep_state_republic_desc: "Detrás de una fachada de reforma, surge una nueva estructura de poder. Antiguos generales, empresarios y burócratas consolidan el control en las sombras. Esta «República del Estado Profundo» mantiene la ilusión de la democracia al tiempo que salvaguarda sus redes de influencia y corrupción."
 ALG_tamazgha: "El sueño de Tamazgha"
 ALG_tamazgha_desc: "Ha llegado el momento del renacimiento de Tamazgha, la tierra del pueblo amazigh que se extiende desde el Atlántico hasta el Nilo. Un nuevo amanecer se alza para el norte de África bajo el estandarte de la libertad y la unidad."
 ALG_our_land: "Nuestra tierra sagrada"
 ALG_our_land_desc: "Nuestro pueblo debe reclamar y reconstruir las tierras que siempre han sido nuestras. La industria, la mano de obra y el valor serán los cimientos de nuestra patria renacida."
 ALG_expand_our_army: "Expandir nuestro ejército"
 ALG_expand_our_army_desc: "La defensa de Tamazgha depende de la fuerza de nuestro ejército. Debemos entrenar, armar y expandir nuestras fuerzas para proteger a nuestra nueva nación de sus numerosos enemigos."
 ALG_berber_of_tunisia: "Los bereberes de Túnez"
 ALG_berber_of_tunisia_desc: "Nuestros hermanos amazigh en Túnez han estado bajo dominio extranjero durante mucho tiempo. Es hora de unirlos bajo la bandera de Tamazgha y liberar sus tierras."
 ALG_libya_invasion: "Invasión de Libia"
 ALG_libya_invasion_desc: "Desde las arenas del Sáhara hasta las costas de Trípoli, Libia es por derecho parte de nuestra patria cultural. Debemos integrarla en el seno de Tamazgha."
 ALG_take_egypt: "Marcha sobre Egipto"
 ALG_take_egypt_desc: "Egipto tiene la llave de la frontera oriental de Tamazgha. Sus vastos recursos y su importancia estratégica lo convierten en una parte vital de nuestra visión."
 ALG_canary_island: "Apoderarse de las Islas Canarias"
 ALG_canary_island_desc: "Las Islas Canarias estuvieron una vez habitadas por un pueblo amazigh, los guanches. Devolveremos estas islas a la soberanía amazigh."
 ALG_take_niger: "Reclamar Níger"
 ALG_take_niger_desc: "Los tuareg de Níger son amazigh de sangre y herencia. Sus desiertos se unirán a la gran federación de Tamazgha una vez más."
 ALG_rif_in_morocco: "El Rif en Marruecos"
 ALG_rif_in_morocco_desc: "Las montañas del Rif vieron nacer a héroes que resistieron al colonialismo. Su valentía nos inspira a unificar a Marruecos bajo la causa amazigh."
 ALG_demand_mali: "Exigir Mali"
 ALG_demand_mali_desc: "Las tierras de Mali, ricas en historia y cultura, formaron parte en su día de los grandes imperios amazigh. Es hora de restaurar nuestra influencia en el Sahel."
 ALG_demand_mauritania: "Exigir Mauritania"
 ALG_demand_mauritania_desc: "Los desiertos de Mauritania albergan raíces amazigh que se hunden profundamente en nuestro pasado. Su unificación con Tamazgha es el siguiente paso en nuestro destino continental."
 ALG_TAM_unite_tamazgha: "Unir Tamazgha"
 ALG_TAM_unite_tamazgha_desc: "Todas las tierras amazigh deben unirse bajo una sola bandera. El sueño de Tamazgha ya no es una visión, es una misión que cumpliremos."
 ALG_expand_more: "Expandir la federación"
 ALG_expand_more_desc: "Tamazgha no debe estancarse. La expansión, tanto industrial como territorial, asegurará nuestro lugar como una gran potencia de África y el Mediterráneo."
 ALG_focus_on_our_land: "Centrarse en nuestra tierra"
 ALG_focus_on_our_land_desc: "En lugar de expandirnos demasiado, deberíamos centrarnos en desarrollar nuestra tierra, mejorando nuestra influencia, economía y unidad dentro de la propia Tamazgha."
 ALG_expand_to_ME: "Expandirse hacia Oriente Medio"
 ALG_expand_to_ME_desc: "Oriente Medio está desgarrado por el caos. Con fuerza y determinación, Tamazgha puede llevar el orden y el liderazgo amazigh a las tierras de Arabia."
 ALG_take_arabia: "Conquistar Arabia"
 ALG_take_arabia_desc: "La península arábiga se encuentra dividida y débil. Llevaremos la luz de Tamazgha a estas tierras y aseguraremos nuestro dominio sobre el mar Rojo y el Golfo."
 ALG_take_levant: "Tomar el Levante"
 ALG_take_levant_desc: "Desde las montañas del Líbano hasta las llanuras de Siria y Palestina, el Levante caerá bajo el estandarte de Tamazgha, acercándonos al control de la cuna de la civilización."
 ALG_legacy_of_dihiya: "Legado de Dihya"
 ALG_legacy_of_dihiya_desc: "La reina Dihya, la intrépida guerrera de los Aurès, unificó en su día a las tribus amazigh contra los invasores extranjeros. Su espíritu de desafío y liderazgo sigue vivo en nuestro pueblo. Llevamos su legado hacia adelante, inquebrantable, inflexible y eternamente libre."
 ALG_de_arabisation_mission_desc: "La campaña nacional de reforma cultural y lingüística está en marcha. La burocracia y la educación se están reescribiendo para reflejar la herencia amazigh. Esta transformación causará tensiones a corto plazo, pero fortalecerá a nuestra nación a largo plazo."
 ALG_dearabisation_end_TT: "§GEl proceso de dearabización concluye.§! Los estados legítimos (cores) árabes son reemplazados por cores amazigh, y ganamos el espíritu nacional §Y'Perseverancia Imazighen'§!."
 ALG_de_arabisation: "Campaña de dearabización"
 ALG_de_arabisation_desc: "Durante siglos, la verdadera identidad de nuestro pueblo ha estado enterrada bajo culturas impuestas. Reclamaremos nuestras raíces reformando las políticas educativas, administrativas y lingüísticas, incluso si eso perturba nuestra sociedad a corto plazo."
 ALG_dearabisation_penalty: "Agitación administrativa"
 ALG_dearabisation_penalty_desc: "El proceso de dearabización ha trastocado la burocracia estatal y el sistema educativo. La resistencia, la confusión y la ineficiencia asolan la transición mientras el gobierno intenta reconstruir las instituciones a imagen de los amazigh."
 ALG_imazighen_perseverance: "Perseverancia Imazighen"
 ALG_imazighen_perseverance_desc: "A través de las dificultades y las reformas, nuestro pueblo resistió. El espíritu amazigh ha demostrado ser inquebrantable; emergemos de la tormenta más fuertes, más orgullosos y unificados."
 ALG_el_salam_nuclear_reactor: "Reactor nuclear Es-Salam"
 ALG_el_salam_nuclear_reactor_desc: "Para satisfacer la creciente demanda de energía de Argelia y reducir la dependencia de los combustibles fósiles, el gobierno comenzará la construcción del reactor nuclear Es-Salam. Este proyecto representa un paso importante hacia el progreso científico y la diversificación energética."
 ALG_uranium_enrichment: "Programa de enriquecimiento de uranio"
 ALG_uranium_enrichment_desc: "El desarrollo de una capacidad nacional de enriquecimiento de uranio permitirá a Argelia gestionar su propio suministro de combustible nuclear. Con este programa, nuestros científicos pretenden dominar la tecnología de centrifugado y lograr la autosuficiencia nuclear."
 ALG_el_nour_nuclear_facility: "Instalación nuclear El Nour"
 ALG_el_nour_nuclear_facility_desc: "Tras el éxito del reactor Es-Salam, Argelia ampliará su infraestructura nuclear mediante la construcción de la instalación El Nour, un centro para la investigación, el mantenimiento de reactores y el desarrollo nuclear pacífico."
 ALG_ask_for_help_from_india: "Buscar asistencia de la India"
 ALG_ask_for_help_from_india_desc: "La India tiene décadas de experiencia en el desarrollo de la energía nuclear bajo supervisión internacional. Al recurrir a Nueva Delhi para la cooperación técnica y científica, Argelia puede hacer avanzar su programa nuclear civil con mayor rapidez."
 ALG_buy_pinaka_launcher: "Comprar lanzacohetes Pinaka"
 ALG_buy_pinaka_launcher_desc: "El lanzacohetes múltiple Pinaka, de fabricación india, es un sistema fiable y rentable. La adquisición de estos lanzadores fortalecerá las divisiones de artillería de Argelia y fomentará una cooperación militar más estrecha con la India."
 ALG_indian_missiles: "Adquirir tecnología de misiles india"
 ALG_indian_missiles_desc: "A través de una amplia colaboración de defensa con la India, Argelia puede obtener acceso a sistemas avanzados de guiado y propulsión de misiles. La integración de esta tecnología mejorará significativamente nuestras capacidades de defensa nacional."
 ALG_subsidise_amazigh_businesses: "Subvencionar empresas gestionadas por amazigh"
 ALG_subsidise_amazigh_businesses_desc: "Proporcionar subsidios estatales y apoyo preferencial a los empresarios amazigh, fomentando el crecimiento económico en las regiones de Tamazgha."
 ALG_leave_arab_league: "Abandonar la Liga Árabe"
 ALG_leave_arab_league_desc: "Retirar a Argelia de la Liga Árabe, afirmando una identidad soberana amazigh independiente de la política del bloque árabe."
 ALG_bring_back_amazigh_exiles: "Hacer regresar a los exiliados amazigh"
 ALG_bring_back_amazigh_exiles_desc: "Facilitar el regreso de los exiliados e inmigrantes amazigh, ofreciendo incentivos para su reasentamiento."
 ALG_boost_kabyle_population: "Impulsar la población cabila"
 ALG_boost_kabyle_population_desc: "Implementar políticas para aumentar la proporción demográfica cabila mediante incentivos, reasentamientos y apoyo estatal."
 ALG_de_arabisation_category: "Programa de dearabización de Tamazgha"
 ALG_de_arabisation_category_desc: "Para construir una nueva Tamazgha, debemos desprendernos de la identidad árabe impuesta y restaurar el alma amazigh de nuestra nación."
 ALG_de_arabisation_mission: "Proceso de dearabización"
 ALG_return_amazigh_exiles: "Hacer regresar a exiliados e inmigrantes amazigh"
 ALG_return_amazigh_exiles_desc: "Décadas de discriminación obligaron a muchos a huir. Es hora de traerlos de vuelta a casa."
 ALG_dearabisation_fail_TT: "El fracaso debilita la estabilidad y aumenta la tensión étnica."
 ALG_amazigh_businesses_complete_TT: "La satisfacción cabila y la economía mejoran."
 ALG_amazigh_businesses_fail_TT: "El fracaso disminuye la satisfacción cabila."
 ALG_return_exiles_complete_TT: "El regreso de los exiliados fortalece la identidad amazigh y la mano de obra."
 ALG_return_exiles_fail_TT: "El fracaso en la repatriación de los exiliados debilita la unidad."
 ALG_leave_arab_league_complete_TT: "Abandonar la Liga Árabe impulsa la soberanía de Tamazgha."
 ALG_leave_arab_league_fail_TT: "El fracaso a la hora de abandonar la liga provoca disturbios."
 ALG_kabyle_pop_complete_TT: "La población cabila crece, la unidad nacional aumenta."
 ALG_kabyle_pop_fail_TT: "Descuidar la demografía cabila provoca disturbios."
 ALG_tamazgha_cultural_revival_category: "Renacimiento cultural de Tamazgha"
 ALG_tamazgha_cultural_revival_category_desc: "Con el fin de la arabización, ha llegado el momento de restaurar nuestra herencia cultural, lingüística e intelectual; el renacimiento de Tamazgha comienza."
 ALG_amazigh_language_reform: "Reforma del idioma amazigh"
 ALG_amazigh_language_reform_desc: "Debemos restaurar el tamazight como idioma nacional y promoverlo a través de la educación y la administración."
 ALG_tamazight_in_education: "Introducir el tamazight en la educación"
 ALG_tamazight_in_education_desc: "Implementar el idioma tamazight en las escuelas y universidades para preservar nuestras raíces culturales."
 ALG_media_cultural_independence: "Independencia cultural y mediática"
 ALG_media_cultural_independence_desc: "Apoyar a los medios de comunicación independientes amazigh e iniciativas culturales libres de influencias externas."
 ALG_tamazgha_regional_cooperation: "Cooperación regional de Tamazgha"
 ALG_tamazgha_regional_cooperation_desc: "Unir a las naciones norteafricanas de ascendencia amazigh en un marco cooperativo para un futuro compartido."
 ALG_amazigh_language_reform_complete_TT: "El tamazight se convierte en idioma estatal e impulsa la educación."
 ALG_amazigh_language_reform_fail_TT: "El fracaso en la reforma de la educación retrasa el renacimiento cultural."
 ALG_tamazight_in_education_complete_TT: "Tamazight introducido con éxito en los programas educativos."
 ALG_tamazight_in_education_fail_TT: "El sistema educativo sigue estando dominado por los árabes."
 ALG_media_cultural_independence_complete_TT: "Los medios independientes amazigh fortalecen la identidad nacional."
 ALG_media_cultural_independence_fail_TT: "El fracaso a la hora de actuar debilita la influencia cultural."
 ALG_tamazgha_regional_cooperation_complete_TT: "Unidad regional alcanzada entre las naciones de Tamazgha."
 ALG_tamazgha_regional_cooperation_fail_TT: "El fracaso en establecer la cooperación aísla a Tamazgha."
 ALG_black_decade_lesson: "Lecciones de la Década Negra"
 ALG_black_decade_lesson_desc: "La guerra civil de la década de 1990 dejó profundas cicatrices en la nación, dejando a una generación cautelosa ante el extremismo y la inestabilidad. El Estado ha extraído duras lecciones de este oscuro capítulo, centrándose en preservar la unidad nacional, fortalecer las instituciones de seguridad y evitar el caos de la confrontación ideológica. Sin embargo, estas lecciones también justifican el control continuo de la vieja guardia sobre la política, ya que el temor a una repetición sigue condicionando cada reforma."
 AlgeriaElections.1.t: "Las elecciones"
 AlgeriaElections.1.d: "Por primera vez en años, Argelia es testigo de unas elecciones verdaderamente competitivas. El ambiente está cargado tanto de expectación como de tensión mientras millones de ciudadanos acuden a las urnas, decididos a moldear el futuro de su nación tras décadas de estancamiento político. Múltiples fuerzas dominan el panorama político.\n\nUn bloque, compuesto por facciones reformistas, liberales e islamistas moderadas, hace campaña por la democracia, la transparencia y la reconciliación nacional. Su visión exige el desmantelamiento del sistema de «Le Pouvoir» y la restauración de la legitimidad en la gobernanza. Su llamamiento resuena con fuerza entre la juventud, la sociedad civil y los trabajadores que buscan un cambio genuino.\n\nOtro frente está integrado por independientes pragmáticos y tecnócratas, aquellos que buscan la reforma desde dentro. Priorizan una democratización gradual, una mejor gobernanza y la liberalización económica, manteniendo al mismo tiempo la estabilidad y la seguridad.\n\nA medida que se escrutan las papeletas, un partido emerge victorioso, representando cada uno un camino distinto para el futuro de la nación."
 AlgeriaElections.1.a: "El FFS se proclama vencedor"
 AlgeriaElections.1.b: "El RND gana las elecciones"
 AlgeriaElections.1.c: "El MSP asegura un mandato"
 AlgeriaElections.1.dd: "El RCD se alza con el poder"
 AlgeriaElections.2.t: "Las elecciones"
 AlgeriaElections.2.d: "Las tan esperadas elecciones han llegado y la nación contiene el aliento. El gobernante Frente de Liberación Nacional, o FLN, se erige una vez más como el pilar central del sistema político de Argelia, apelando a aquellos que aún valoran la estabilidad, la unidad y la continuidad tras la agitación de la Década Negra. Bajo el liderazgo del presidente Abdelaziz Bouteflika y el estamento leal del partido, el FLN promete modernización sin caos, reforma sin ruptura.\n\nLos movimientos de oposición, aunque ruidosos y diversos, permanecen divididos y fragmentados, incapaces de formar un frente unido capaz de desafiar a la vieja guardia. Muchos argelinos, cansados de los disturbios y ansiosos por el orden, depositan sus votos por lo conocido, convencidos de que la experiencia y la seguridad superan los riesgos del cambio.\n\nAl computarse los votos finales, el resultado se vuelve claro: el legado de la revolución sigue reinando de forma suprema."
 AlgeriaElections.2.a: "¡El FLN asegura otra victoria!"
 ALG_election_time: "Periodo electoral"
 ALG_election_time_desc: "Argelia se prepara para otra temporada electoral crucial. El panorama político es tenso mientras tanto el gobernante FLN como los partidos de la oposición preparan sus campañas."
 ALG_FLN_media_control: "Medios controlados por el Estado"
 ALG_FLN_media_control_desc: "Al endurecer el control sobre la prensa y la televisión, el gobierno se asegura de que la narrativa pública se mantenga leal al gobernante FLN y a su visión de estabilidad."
 ALG_loyal_military: "Ejército leal"
 ALG_loyal_military_desc: "El ejército ha demostrado ser un guardián fiable del régimen, garantizando que el orden y la unidad nacional se preserven por encima de todo lo demás."
 ALG_FLN_state_led_development: "Desarrollo dirigido por el Estado"
 ALG_FLN_state_led_development_desc: "El Estado dirige los principales sectores de la economía, garantizando que el desarrollo industrial y social permanezca bajo el control nacional."
 ALG_FLN_oil_for_people: "Petróleo para el pueblo"
 ALG_FLN_oil_for_people_desc: "El gobierno utiliza la vasta riqueza de hidrocarburos del país para proporcionar asistencia social y subsidios, promoviendo un contrato social basado en la redistribución económica."
 ALG_FLN_national_security_council: "Consejo de Seguridad Nacional"
 ALG_FLN_national_security_council_desc: "Un organismo de alto nivel que coordina la seguridad interna y la contrainteligencia, garantizando que las amenazas al Estado sean neutralizadas rápidamente."
 ALG_FLN_industrial_nationalization: "Nacionalización industrial"
 ALG_FLN_industrial_nationalization_desc: "El gobierno del FLN ha tomado medidas para reafirmar el control sobre industrias clave para proteger la soberanía económica de Argelia."
 ALG_FLN_legacy_of_stability: "Legado de estabilidad"
 ALG_FLN_legacy_of_stability_desc: "A pesar de sus fallos, el gobierno del FLN ha proporcionado continuidad y estabilidad, algo que muchos argelinos valoran tras años de agitación."
 ALG_FLN_oil_for_people_idea: "Petróleo para el pueblo"
 ALG_FLN_oil_for_people_idea_desc: "El gobierno ha decidido utilizar los ingresos del petróleo para financiar directamente programas públicos y subsidios. Si bien esto eleva el nivel de vida, también conlleva el riesgo de ineficiencia y dependencia a largo plazo."
 ALG_FLN_legacy_of_stability_idea: "Legado de estabilidad"
 ALG_FLN_legacy_of_stability_idea_desc: "Durante décadas, el FLN se ha presentado como el guardián de la estabilidad de Argelia. Su estricto control de la política y la seguridad garantiza la paz, pero a costa de libertades limitadas."
 ALG_FLN_industrial_nationalization_idea: "Nacionalización industrial"
 ALG_FLN_industrial_nationalization_idea_desc: "Los principales sectores de la economía se están poniendo bajo el control del Estado para garantizar la independencia nacional y guiar el crecimiento industrial bajo la planificación del gobierno."
 ALG_FLN_state_led_development_idea: "Desarrollo dirigido por el Estado"
 ALG_FLN_state_led_development_idea_desc: "El Estado asume un papel activo en la dirección del crecimiento económico de Argelia, haciendo hincapié en la infraestructura, la educación y el bienestar social para fortalecer los cimientos de la nación."
 ALG_FLN_media_control_idea: "Code de l'Information"
 ALG_FLN_media_control_idea_desc: "El Code de l'Information establece el marco legal que rige las actividades de prensa y radiodifusión, permitiendo al Estado regular las operaciones de los medios y guiar el espacio de información nacional."
 ALG_FLN_national_security_council_idea: "Consejo de Seguridad Nacional"
 ALG_FLN_national_security_council_idea_desc: "Un poderoso consejo compuesto por militares, miembros de la inteligencia y altos funcionarios supervisa la estabilidad interna y la estrategia nacional, garantizando la lealtad al gobierno del FLN."
 ALG_loyal_military_idea: "Ejército leal"
 ALG_loyal_military_idea_desc: "El ejército se mantiene leal al FLN, valorando el orden y la jerarquía por encima de todo. Esta unidad conlleva una menor adaptabilidad e iniciativa en el campo de batalla."
 ALG_loyal_military2_idea: "Cuerpo militar leal"
 ALG_loyal_military2_idea_desc: "La lealtad del ejército se ha profundizado a través de la integración política y los beneficios privilegiados, garantizando un aparato militar poderoso y disciplinado bajo el mando del gobierno."
 ALG_invest_in_youth_idea: "Invertir en la juventud"
 ALG_invest_in_youth_idea_desc: "Los programas para educar y dar empleo a la creciente población juvenil de Argelia moldearán el futuro del país, creando una nueva generación de profesionales y líderes."
 ALG_anti_corruption_campaign_idea: "Campaña contra la corrupción"
 ALG_anti_corruption_campaign_idea_desc: "El gobierno ha lanzado una campaña para erradicar la corrupción y los abusos burocráticos, con el objetivo de restaurar la confianza pública y mejorar la eficiencia del Estado."
 ALG_new_era_for_algeria_idea: "Una nueva era para Argelia"
 ALG_new_era_for_algeria_idea_desc: "Argelia entra en una nueva era de reformas y modernización, equilibrando la innovación y el progreso social con los desafíos de una economía global cambiante."
 ALG_open_market_idea: "Políticas de libre mercado"
 ALG_open_market_idea_desc: "La liberalización gradual de la economía argelina invita a la inversión y al espíritu empresarial, a riesgo de reducir el control tradicional del Estado sobre las industrias clave."
 ALG_reform_education_system_idea: "Reformar el sistema educativo"
 ALG_reform_education_system_idea_desc: "Se están llevando a cabo reformas integrales para modernizar el sistema educativo, promover la innovación y alinear las escuelas con las necesidades de una economía argelina moderna."
 ALG_reform_the_judicial_system_idea: "Reforma judicial"
 ALG_reform_the_judicial_system_idea_desc: "Están en marcha esfuerzos para modernizar el sistema judicial de Argelia, reducir la corrupción y establecer tribunales más justos que defiendan el estado de derecho."
 ALG_free_media_idea: "Medios de comunicación libres"
 ALG_free_media_idea_desc: "Los medios de comunicación independientes empiezan a florecer, proporcionando transparencia y rendición de cuentas, aunque esto también incrementa las críticas y el debate público."
 ALG_black_decade_lesson_idea: "Lecciones de la Década Negra"
 ALG_black_decade_lesson_idea_desc: "El trauma de la guerra civil todavía atormenta a Argelia. La nación se mantiene cautelosa, priorizando la seguridad sobre el riesgo, para garantizar que esa inestabilidad nunca regrese."
 ALG_election_day: "Día de las elecciones"
 ALG_election_day_desc: "Ha llegado el momento de que los argelinos elijan su futuro. El hecho de que el gobernante FLN mantenga su control o que la oposición triunfe moldeará al país durante décadas."
 ALG_FLN_path: "Victoria del FLN"
 ALG_FLN_path_desc: "El FLN ha triunfado una vez más, manteniendo el control sobre el gobierno y el rumbo del futuro de Argelia."
 ALG_FLN_preserve_system: "Preservar el sistema"
 ALG_FLN_preserve_system_desc: "El liderazgo del FLN no ve la necesidad de cambios drásticos; preservar el orden existente garantiza la estabilidad y la continuidad."
 ALG_FLN_control_media: "Aprobar la Ley Orgánica n.º 12-05"
 ALG_FLN_control_media_desc: "Al adoptar la Ley Orgánica n.º 12-05 que regula la información y la actividad de los medios de comunicación, el Estado puede dar forma a la narrativa nacional manteniendo al mismo tiempo un marco legal para la supervisión de la prensa."
 ALG_election_day_tt: "§YDesbloquea el camino hacia las elecciones presidenciales de Argelia de 2004.§!\nPronto tendrás que elegir entre el gobernante §RFLN§! y la §YOposición§! para el futuro del país."
 ALG_ethnic_kabyle_tt: "La §YPoblación cabila§! es superior al §Y10%§!"
 ALG_kabyle_satisfaction_tt: "La §YSatisfacción cabila§! es de al menos §Y65§!"
 ALG_kabyle_satisfaction_70_tt: "La §YSatisfacción cabila§! es superior a §Y70§!"
 ALG_kabyle_satisfaction_60_tt: "La §YSatisfacción cabila§! es de al menos §Y60§!"
 ALG_fossil_fuel_industry: "Lobby de Sonatrach"
 ALG_fossil_fuel_industry_desc: "El gigante energético estatal Sonatrach y su red de contratistas forman una de las facciones más poderosas de Argelia. Defienden los subsidios, se resisten a la diversificación económica y mantienen estrechos vínculos con empresas extranjeras y gobiernos que dependen del petróleo y el gas argelinos."
 ALG_the_military: "Ejército Nacional Popular (ANP)"
 ALG_the_military_desc: "El ejército argelino, el ANP, es la columna vertebral del Estado. Actúa como guardián de la unidad nacional y la estabilidad, pero su dominio limita la reforma democrática. Al equilibrarse entre la protección de Argelia y la restricción del gobierno civil, el ANP es siempre un actor decisivo en la política."
 ALG_industrial_conglomerates: "CEVITAL-MADAR"
 ALG_industrial_conglomerates_desc: "Los conglomerados industriales, dominados por gigantes como Cevital y Madar Holdings, representan a la creciente élite empresarial oligárquica de Argelia. Estrechamente vinculados al poder político y a menudo entrelazados con los militares y las familias gobernantes, estos grupos buscan el beneficio a través de la privatización, los bienes de consumo, el sector inmobiliario y el comercio exterior. Pueden proporcionar inversiones y crecimiento muy necesarios, pero a costa de la corrupción, la desigualdad y la captura política."
 ALG_offices_contruction_speed: "Velocidad de construcción de oficinas"
 ALG_arms_factory_contruction_speed: "Military Factory Construction Speed"
 ALG_civ_construction_speed: "Velocidad de construcción de fábricas civiles"
 ALG_population_energy_consumption: "Consumo energético de la población"
 ALG_civ_factory_workforce: "Trabajadores de fábrica civil necesarios"
 ALG_mil_factory_workforce: "Trabajadores de fábrica militar necesarios"
 ALG_office_workforce: "Trabajadores de oficina necesarios"
 ALG_military_modifier: "Fuerzas Armadas de Argelia"
 ALG_military_modifier_desc: "Representa las capacidades y reformas del ejército argelino."
 ALG_opposition_path: "El camino de la oposición"
 ALG_opposition_path_desc: "A medida que la oposición política gana impulso, el país se enfrenta a una elección: reformar desde dentro o arriesgarse al caos. Ha llegado el momento de abrazar la transparencia y el progreso."
 ALG_OPP_free_elections: "Celebrar elecciones libres"
 ALG_OPP_free_elections_desc: "Durante demasiado tiempo, la voz del pueblo ha sido silenciada. La verdadera democracia comienza con elecciones transparentes y justas."
 ALG_FLN_military_loyalty: "Asegurar la lealtad militar"
 ALG_FLN_military_loyalty_desc: "El ejército es un pilar de estabilidad. Garantizar su lealtad evitará disturbios y asegurará el futuro de nuestra nación."
 ALG_FLN_public_works: "Lanzar programas de obras públicas"
 ALG_FLN_public_works_desc: "Al invertir en infraestructura pública, proporcionamos empleos y renovamos la fe del pueblo en las instituciones gubernamentales."
 ALG_reform_armed_forces: "Reformar las Fuerzas Armadas"
 ALG_reform_armed_forces_desc: "Modernizar la estructura militar garantizará la eficiencia, la disciplina y la lealtad al Estado en lugar de a los individuos."
 ALG_counter_extremism: "Capacidades antiterroristas"
 ALG_counter_extremism_desc: "Las redes terroristas amenazan nuestra estabilidad nacional. Al fortalecer la inteligencia, las fuerzas de seguridad y los programas de prevención, podemos mejorar las capacidades antiterroristas de Argelia."
 ALG_regional_power: "Una potencia regional"
 ALG_regional_power_desc: "Con la estabilidad interna alcanzada, Argelia puede proyectar fuerza y liderazgo en todo el norte de África y el Mediterráneo."
 ALG_expanding_the_power_grid: "Expandir la red eléctrica"
 ALG_expanding_the_power_grid_desc: "Un suministro eléctrico fiable es vital para el crecimiento económico. La expansión de la red de energía apoyará a la industria y al desarrollo rural."
 ALG_OPP_new_constitution: "Redactar una nueva constitución"
 ALG_OPP_new_constitution_desc: "Una nueva constitución sentará las bases para la democracia, la igualdad y el gobierno civil."
 ALG_OPP_media_freedom: "Garantizar la libertad de los medios"
 ALG_OPP_media_freedom_desc: "La libertad de prensa es esencial para exigir responsabilidades a los líderes e informar al público con la verdad."
 ALG_OPP_judiciary_reform: "Reformar el poder judicial"
 ALG_OPP_judiciary_reform_desc: "Un poder judicial independiente y transparente es clave para garantizar la justicia para todos los ciudadanos, independientemente de su estatus o influencia."
 ALG_OPP_education_first: "La educación primero"
 ALG_OPP_education_first_desc: "Una nación moderna depende de una población bien educada. Invertir en escuelas y universidades moldeará un futuro más brillante."
 ALG_OPP_open_market: "Abrir el mercado"
 ALG_OPP_open_market_desc: "Las reformas económicas y el libre comercio atraerán inversiones y crearán oportunidades para los empresarios."
 ALG_OPP_new_era: "Una nueva era para Argelia"
 ALG_OPP_new_era_desc: "Tras años de lucha y reformas, Argelia entra en un nuevo capítulo de libertad, prosperidad y estabilidad."
 ALG_OPP_anti_corruption: "Luchar contra la Corrupción"
 ALG_OPP_anti_corruption_desc: "La corrupción drena el potencial de la nación. Es hora de leyes estrictas, instituciones transparentes y rendición de cuentas a todos los niveles."
 ALG_OPP_invest_in_youth: "Invertir en la juventud"
 ALG_OPP_invest_in_youth_desc: "La juventud es el alma de Argelia. Al empoderarlos a través de la educación y el empleo, aseguramos el futuro de la nación."
 ALG_OPP_state_first: "El Estado es lo primero"
 ALG_OPP_state_first_desc: "En tiempos de cambio, la unidad y el interés nacional deben guiar cada política. La integridad del Estado está por encima del beneficio partidista."
 ALG_terror_2013_in_amenas_title: "Crisis de rehenes de In Amenas de 2013"
 ALG_terror_2013_in_amenas_desc: "Un grupo de militantes armados vinculados a organizaciones extremistas lanzó un asalto sorpresa contra la instalación de gas de In Amenas, en el sur de Argelia. Los atacantes capturaron a cientos de rehenes, incluidos trabajadores extranjeros, desencadenando una crisis internacional. El ejército argelino rodeó rápidamente el lugar, lo que dio pie a un sangriento enfrentamiento que conmocionó al mundo y planteó dudas sobre la capacidad del gobierno para gestionar el terrorismo en las regiones desérticas."
 ALG_terror_2013_placeholder_option: "Nuestras fuerzas responden con decisión."
 ALG_terror_2013_low_tt: "Disturbios menores contenidos. §GLa estabilidad mejora ligeramente.§!"
 ALG_terror_2013_medium_tt: "La situación empeora, avivando la §ORadicalización§! y reduciendo la §Restabilidad§!."
 ALG_terror_2013_high_tt: "El ataque se sale de control. §RLa estabilidad nacional se desploma§! a medida que los §Oinsurgentes radicales§! ganan terreno."
 ALG_healthcare_reform_tt: "El §YDescontento público§! debe estar por debajo de §Y40§! para comenzar la reforma sanitaria."
 ALG_education_reform_tt: "El §YDescontento público§! debe estar por debajo de §Y40§! para comenzar la reforma educativa."
 ALG_unemployment_reform_tt: "El §YDescontento público§! debe estar por debajo de §Y40§! para comenzar la reforma del desempleo."
 ALG_employment_TT: "El §HDesempleo§! es menor que el §H20%§!"
 ALG_grand_mosque: "La Gran Mezquita de Argel"
 ALG_grand_mosque_desc: "Un símbolo del renacimiento espiritual y cultural de Argelia, la Gran Mezquita de Argel se erige como una de las mezquitas más altas y magníficas del mundo. Su construcción no solo demuestra la ambición arquitectónica de la nación, sino que también sirve como un faro de herencia islámica y unidad. Completar este monumental proyecto fortalecerá el orgullo nacional y proyectará la influencia de Argelia en todo el mundo musulmán."
 ALG_big_cities_or_rising_states: "Programa de desarrollo urbano o regional"
 ALG_big_cities_or_rising_states_desc: "Tras el programa de recuperación de posguerra, el gobierno debe decidir su siguiente paso: ¿deberíamos concentrar los recursos en las principales ciudades costeras para fortalecer la columna vertebral industrial de Argelia, o potenciar las regiones del interior y del desierto para lograr un crecimiento nacional equilibrado?"
 ALG_focus_on_big_cities: "Centrarse en las principales ciudades"
 ALG_focus_on_big_cities_desc: "Los centros urbanos como Argel, Orán y Constantina son los motores de la economía de Argelia. Al centrar allí nuestros esfuerzos de desarrollo, podemos modernizar nuestra infraestructura y mejorar la productividad."
 ALG_rising_states_program: "Programa de Estados Emergentes"
 ALG_rising_states_program_desc: "Mientras las ciudades costeras prosperan, las regiones del interior se quedan atrás. El Programa de Estados Emergentes tiene como objetivo llevar carreteras, escuelas e industrias al corazón de Argelia, garantizando que ninguna provincia se quede atrás."
 ALG_develop_atlas: "Desarrollar el Atlas argelino"
 ALG_develop_atlas_desc: "Las regiones montañosas del Atlas albergan un gran potencial para la agricultura y la pequeña industria. La inversión aquí mejorará el nivel de vida local y creará seguridad alimentaria a largo plazo."
 ALG_develop_kabylia: "Expandir la región de Cabilia"
 ALG_develop_kabylia_desc: "Cabilia posee una fuerte identidad cultural y un pueblo laborioso. El desarrollo de sus infraestructuras y oficinas fortalecerá tanto el orgullo regional como la unidad nacional."
 ALG_develop_aures: "Crecimiento agrícola en los Aurès"
 ALG_develop_aures_desc: "Las montañas de los Aurès albergan extensas tierras de cultivo y comunidades trabajadoras. La modernización de la producción agrícola en esta zona reducirá la pobreza rural y estabilizará el suministro de alimentos."
 ALG_expand_oran: "Expandir la zona industrial de Orán"
 ALG_expand_oran_desc: "Orán es una de las ciudades industriales y portuarias más importantes de Argelia. La expansión de su zona industrial creará nuevos empleos e impulsará las exportaciones."
 ALG_expand_algiers: "Modernizar Argel"
 ALG_expand_algiers_desc: "Como corazón latente de Argelia, Argel debe seguir evolucionando. Nuevas oficinas, infraestructuras y reformas urbanas la transformarán en una capital modelo para el norte de África."
 ALG_expand_constantine: "Invertir en Constantina"
 ALG_expand_constantine_desc: "La larga historia de educación y cultura de Constantina la convierte en un centro ideal para la enseñanza superior y la innovación. Invertir aquí formará a una nueva generación de pensadores e ingenieros argelinos."
 ALG_develop_tamanrasset: "Desarrollar la infraestructura de Tamanrasset"
 ALG_develop_tamanrasset_desc: "En lo profundo del Sáhara, Tamanrasset es la clave para la logística del sur de Argelia. Carreteras, nodos de suministro e infraestructuras de comunicación conectarán el desierto con el norte."
 ALG_develop_mzab: "Abastecer de energía al valle de M'zab"
 ALG_develop_mzab_desc: "La región de M'zab posee un espíritu resiliente y necesidades energéticas crecientes. La construcción de nuevas centrales eléctricas proporcionará electricidad y empleo a la población local."
 ALG_develop_granderg: "Explotar los recursos del Gran Erg"
 ALG_develop_granderg_desc: "El Gran Erg Occidental puede parecer vacío, pero su riqueza subterránea cuenta otra historia. El desarrollo de centros de extracción de petróleo aquí fortalecerá la posición de Argelia como productor de energía."
 ALG_FIS.1.t: "El regreso de los ulemas"
 ALG_FIS.1.d: "Dentro del Frente Islámico de Salvación, ha surgido un intenso debate sobre el rumbo de nuestro movimiento. Los eruditos wahhabíes, inspirados por interpretaciones estrictas de Arabia Saudí, exigen una purificación completa del Islam y de la política argelina de lo que consideran innovaciones corruptas. Mientras tanto, los ulemas tradicionales de Argelia abogan por un retorno a la guía espiritual y a la reforma nacional dentro de un marco islámico más tolerante.\n\nNuestra elección definirá el alma del movimiento."
 ALG_FIS.1.a: "Seguir a los ulemas wahhabíes. Purificar y fortalecer la fe"
 ALG_FIS.1.b: "Apoyar a los ulemas tradicionales. Reformar y guiar a la nación"
 ALG_FIS.2.t: "El futuro del Frente Islámico de Salvación"
 ALG_FIS.2.d: "En 1991, tras las manifestaciones masivas lideradas por el Frente Islámico de Salvación (FIS), las autoridades argelinas respondieron con la fuerza, marcando uno de los puntos de inflexión más sangrientos de la historia moderna de la nación. El fundador del movimiento, Abbasi Madani, fue condenado a quince años de prisión tras los acontecimientos de junio, durante los cuales el ejército y la policía dispersaron violentamente a miles de partidarios del FIS. El general Khaled Nezzar ordenó el arresto de Madani e impuso un estado de emergencia destinado a desmantelar el partido y suprimir la influencia islamista. La represión provocó el caos, bajas civiles y la disolución de cualquier esperanza de reforma pacífica, una chispa que encendió la devastadora guerra civil argelina, conocida más tarde como la Década Negra. Con Abbasi Madani encarcelado y los líderes del FIS dispersos, han surgido nuevas figuras dentro del movimiento. Ahora que nuestra influencia resurge silenciosamente, la pregunta es: ¿quién nos guiará a través de esta era de sangre y sacrificio hacia una nueva visión para Argelia?"
 ALG_FIS.2.a: "Nombrar al cofundador y voz del pueblo: Ali Belhadj"
 ALG_FIS.2.b: "Abrazar el camino de la lucha: Abdelhak Layada, fundador del GIA"
 ALG_ps_victory: "Victory of the Islamic Salvation Front"
 ALG_ps_victory_desc: "El Frente Islámico de Salvación ha triunfado. Argelia se encuentra ante una encrucijada entre la fe y el orden, entre la mezquita y los cuarteles. Debemos consolidar ahora este nuevo amanecer del poder."
 ALG_consolidate_power: "Consolidar el nuevo orden"
 ALG_consolidate_power_desc: "El poder debe asegurarse en todos los niveles de la sociedad. El partido, los ulemas y los grupos armados deben servir ahora a un único propósito: la preservación de nuestro mandato."
 ALG_national_reconstruction: "Reconstrucción nacional"
 ALG_national_reconstruction_desc: "Nuestra nación, devastada por la guerra, debe ser reconstruida de entre las ruinas. La reconstrucción requerirá tanto fe como pragmatismo a medida que restauramos la industria y la confianza pública."
 ALG_religious_reconciliation: "Reconciliación religiosa"
 ALG_religious_reconciliation_desc: "Las divisiones entre los eruditos islámicos de Argelia amenazan nuestra unidad. Debemos conciliar nuestras diferencias y crear un fundamento religioso unificado para el nuevo Estado."
 ALG_crackdown_purges: "Represiones y purgas"
 ALG_crackdown_purges_desc: "Para mantener el poder, debemos eliminar a la oposición. Los remanentes del antiguo régimen, los oficiales laicos y las facciones disidentes deben ser purgados."
 ALG_unify_parties: "Unificar los movimientos islámicos"
 ALG_unify_parties_desc: "Los diversos grupos islamistas que apoyaron nuestro ascenso deben ser reunidos ahora bajo un mismo estandarte. La unidad de la Umma comienza en casa."
 ALG_infrastructure_crash: "Restauración de infraestructura"
 ALG_infrastructure_crash_desc: "La guerra civil dejó nuestra infraestructura en ruinas. Lanzaremos programas de emergencia para restaurar carreteras, puentes y servicios públicos."
 ALG_industry_investment: "Inversiones industriales"
 ALG_industry_investment_desc: "Para sostener la recuperación a largo plazo, debemos invertir en la industria nacional y apoyar a los empresarios locales guiados por los principios económicos islámicos."
 ALG_madrasa_reforms: "Reformas de las madrazas"
 ALG_madrasa_reforms_desc: "La educación debe alinearse tanto con las necesidades modernas como con los valores religiosos. La reforma de nuestras madrazas garantizará una nueva generación de eruditos e ingenieros cimentados en la fe."
 ALG_community_outreach: "Programas de alcance comunitario"
 ALG_community_outreach_desc: "Fortaleceremos nuestra conexión con las comunidades locales a través de iniciativas sociales, promoviendo la unidad y la solidaridad bajo los valores islámicos."
 ALG_internal_security: "Aparato de Seguridad Interna"
 ALG_internal_security_desc: "Debemos establecer una red de seguridad interna leal para suprimir los disturbios y proteger la revolución desde dentro."
 ALG_intelligence_network: "Oficina de Inteligencia Islámica"
 ALG_intelligence_network_desc: "Un servicio de inteligencia eficaz nos permitirá anticipar amenazas y neutralizar conspiraciones antes de que puedan arraigar."
 ALG_transport_upgrade: "Modernización del transporte"
 ALG_transport_upgrade_desc: "Los sistemas de transporte modernos acelerarán el comercio, mejorarán la movilidad y conectarán las regiones de Argelia más estrechamente que nunca."
 ALG_energy_program: "Programa Energético Nacional"
 ALG_energy_program_desc: "El desarrollo de fuentes de energía tanto renovables como convencionales proporcionará la columna vertebral de la nueva economía de Argelia."
 ALG_scholastic_centers: "Centros de Investigación Escolástica"
 ALG_scholastic_centers_desc: "Nuestros eruditos y científicos trabajarán codo con codo para hacer avanzar tanto el conocimiento islámico como la ciencia moderna en pos del progreso nacional."
 ALG_social_welfare: "Expansión del bienestar social"
 ALG_social_welfare_desc: "Cuidaremos de los pobres, las viudas y los desplazados, asegurando que cada argelino se beneficie de las bendiciones de nuestra gobernanza guiada por la fe."
 ALG_military_rebuild: "Reconstruir el Ejército de la Fe"
 ALG_military_rebuild_desc: "El ejército debe ser reconstruido y purificado de la corrupción. Un estamento militar disciplinado defenderá la revolución y la nación."
 ALG_garrison_restructure: "Reestructuración de guarniciones"
 ALG_garrison_restructure_desc: "Debemos reorganizar nuestras guarniciones para garantizar la lealtad, la eficiencia y la preparación contra amenazas externas o internas."
 ALG_factory_output: "Expansión de la producción industrial"
 ALG_factory_output_desc: "Nuestras inversiones están dando sus frutos. Las fábricas funcionarán ahora a pleno rendimiento para impulsar el crecimiento económico."
 ALG_oil_and_minerals: "Desarrollo de petróleo y minerales"
 ALG_oil_and_minerals_desc: "Los abundantes recursos naturales de Argelia son un regalo divino. Los aprovecharemos de forma responsable para garantizar la independencia energética."
 ALG_religious_council: "Establecer el Consejo Religioso"
 ALG_religious_council_desc: "Un consejo supremo de ulemas guiará la dirección moral y espiritual de la nación, asegurando que cada ley se ajuste a la Sharía."
 ALG_national_cohesion: "Cohesión nacional"
 ALG_national_cohesion_desc: "A través del bienestar y la fe, sanaremos las divisiones de la guerra y forjaremos una nueva identidad argelina unida."
 ALG_border_defences: "Reforzar las fronteras"
 ALG_border_defences_desc: "Nuestras fronteras deben ser fortificadas contra la infiltración y el contrabando. Los enemigos de la revolución se encuentran más allá y dentro de ellas."
 ALG_strategic_reserves: "Programa de Reservas Estratégicas"
 ALG_strategic_reserves_desc: "Almacenaremos suministros y ampliaremos nuestras reservas para garantizar la resistencia en tiempos de guerra o de inestabilidad económica."
 ALG_heavy_industry: "Desarrollar la industria pesada"
 ALG_heavy_industry_desc: "Impulsaremos nuestra base industrial más allá de los bienes de consumo, centrándonos en la maquinaria pesada, el acero y la producción de armas."
 ALG_international_trade: "Expandir el comercio internacional"
 ALG_international_trade_desc: "Al comerciar con naciones aliadas del mundo islámico, Argelia puede convertirse en un centro de comercio guiado por la fe."
 ALG_cultural_influence: "Iniciativa de influencia cultural"
 ALG_cultural_influence_desc: "Exportaremos nuestra cultura, nuestra fe y nuestro ejemplo, difundiendo el modelo argelino de renacimiento islámico."
 ALG_welfare_programs: "Programas de bienestar social"
 ALG_welfare_programs_desc: "Las iniciativas integrales de bienestar social fortalecerán nuestra legitimidad y protegerán a los más vulnerables."
 ALG_army_of_salvation: "Ejército de Salvación"
 ALG_army_of_salvation_desc: "El Ejército de Salvación será el escudo del Islam y la espada de Argelia: disciplinado, fiel e inquebrantable."
 ALG_nation_energy_independence: "Independencia energética nacional"
 ALG_nation_energy_independence_desc: "Con nuestra energía totalmente bajo control nacional, nos liberaremos de la dependencia extranjera."
 ALG_international_outreach: "Alcance islámico internacional"
 ALG_international_outreach_desc: "Extenderemos nuestra mano al mundo islámico, construyendo puentes con movimientos y naciones que compartan nuestra visión."
 ALG_regional_leadership: "Liderazgo regional"
 ALG_regional_leadership_desc: "Argelia se consolidará como un líder político, religioso y económico en el norte de África y más allá."
 ALG_technological_renaissance: "Renacimiento tecnológico"
 ALG_technological_renaissance_desc: "La fe y la ciencia no son enemigas. Lideraremos una nueva era de avance tecnológico guiada por la ética islámica."
 ALG_islamic_coalition: "Formar la Coalición Islámica"
 ALG_islamic_coalition_desc: "La unidad de la Umma debe ser restaurada a través de la cooperación. Argelia liderará una coalición de naciones islámicas hacia la prosperidad mutua."
 ALG_grand_strategy: "La gran estrategia"
 ALG_grand_strategy_desc: "Nuestra nación se mantiene ahora fuerte militar, económica y espiritualmente. Es hora de trazar una visión a largo plazo para nuestra civilización."
 ALG_final_salvation: "Salvación final"
 ALG_final_salvation_desc: "El paso final en nuestro viaje: crear una sociedad plenamente guiada por la ley divina y la fuerza moral."
 FIS_rust_belt_rejuvenation: "Rejuvenecimiento del cinturón industrial"
 FIS_rule_to_perfection: "Gobernar hacia la perfección"
 FIS_new_islamic_architecture: "Nueva arquitectura islámica"
 FIS_prioritize_military_industries: "Priorizar las industrias militares"
 FIS_industrialize_the_umma: "Industrializar la Umma"
 ALG_fis_win: "Victoria del Frente Islámico de Salvación"
 ALG_fis_win_desc: "A través de la perseverancia, la unidad y la guía divina, el Frente Islámico de Salvación ha triunfado sobre sus adversarios. El camino por delante es uno de gobernanza espiritual y renovación. Comienza un nuevo capítulo para Argelia, uno definido por la fe, la justicia y la voluntad de Alá."
 ALG_fis_win_tt: "§Y¡Desbloquea el árbol de enfoques del Frente Islámico de Salvación (FIS)!§!"
 alg_politics_news.1.t: "Abdallah Djaballah funda el FJD"
 alg_politics_news.1.d: "Abdallah Djaballah, exlíder del Movimiento para la Reforma Nacional (Islah) y fundador de Ennahda, ha anunciado la creación de un nuevo partido político, el Front pour la Justice et le Développement (FJD). Inspirándose en el Partido de la Justicia y el Desarrollo de Turquía (AKP), el FJD busca fusionar los principios islámicos con la moderación política y el desarrollo nacional. El movimiento pretende renovar la confianza pública en la política islamista haciendo hincapié en la justicia, la reforma y la gobernanza ética en la era posterior a la guerra civil de Argelia."
 alg_politics_news.1.a: "Un nuevo movimiento islamista entra en la escena política de Argelia."
 algerian.1.t: "Petición argelina de inversión en infraestructuras"
 algerian.1.d: "El gobierno argelino se ha dirigido a nosotros con una propuesta para financiar la construcción de carreteras del campo al mercado e infraestructuras rurales. Esta inversión mejoraría la distribución agrícola y la capacidad industrial en Argelia, al tiempo que nos permitiría expandir nuestra influencia política y económica. Sin embargo, la iniciativa requeriría una contribución financiera de nuestra tesorería."
 algerian.1.a: "Financiar el proyecto de infraestructura"
 algerian.1.b: "Rechazar la petición"
 algerian.4.t: "Cooperación en infraestructuras aprobada"
 algerian.4.d: "Túnez ha accedido a apoyar nuestra iniciativa de infraestructura del campo al mercado. La inversión fortalecerá nuestra economía rural y nuestra capacidad industrial al tiempo que mejorará las relaciones bilaterales."
 algerian.4.a: "Un paso adelante para nuestra economía"
 algerian.5.t: "Financiación de infraestructura rechazada"
 algerian.5.d: "Túnez ha rechazado financiar nuestra propuesta de iniciativa de infraestructura. Sin el apoyo extranjero, el desarrollo de las carreteras del campo al mercado y los proyectos relacionados se retrasarán."
 algerian.5.a: "Nos las arreglaremos por nuestra cuenta"
 algeria_news.30.t: "The Black Spring Uprising"
 algeria_news.30.d: "Tras años de disturbios en la región de Cabilia, debes decidir cómo responder a las crecientes demandas de la población bereber."
 algeria_news.30.a: "Conceder la plena independencia a los cabilas"
 algeria_news.30.b: "Conceder la autonomía a los cabilas"
 algeria_news.30.c: "Suprimir el levantamiento"
 algeria_news.30_a_tt: "Elegir este camino creará un Estado cabila independiente. La estabilidad aumenta y se gana poder político."
 algeria_news.30_b_tt: "Elegir la autonomía concede a los cabilas un autogobierno limitado (Barbacha). La estabilidad aumenta moderadamente y se gana poder político."
 algeria_news.30_c_tt: "Suprimir a los cabilas disminuirá la estabilidad y el apoyo a la guerra, pero ganarás algo de poder político."
 AlgeriaFocusEvents.43.t: "Invitación al Consejo de Mundos Islámicos"
 AlgeriaFocusEvents.43.d: "El liderazgo de [Root.GetName] ha recibido una invitación formal para unirse al Consejo de Mundos Islámicos. La membresía fortalecería la cooperación económica entre las naciones islámicas, abriría nuevas oportunidades comerciales y reforzaría nuestra alineación política compartida. Sin embargo, unirse puede distanciarnos de los bloques económicos no islámicos."
 AlgeriaFocusEvents.43.a: "Unirse al Consejo"
 AlgeriaFocusEvents.43.b: "Rechazar la invitación"
 AlgeriaFocusEvents.41.t: "Invitación al Consejo de Mundos Islámicos"
 AlgeriaFocusEvents.41.d: "Argelia nos ha invitado formalmente a unirnos al Consejo de Mundos Islámicos. La propuesta hace hincapié en la cooperación económica, la coordinación política y el fortalecimiento de los lazos entre las naciones islámicas. Aceptar podría mejorar nuestra posición regional, mientras que un rechazo puede tensar las relaciones."
 AlgeriaFocusEvents.41.a: "Esta es una buena idea"
 AlgeriaFocusEvents.41.b: "No estamos interesados"
 AlgeriaFocusEvents.411.t: "Irak rechaza la invitación"
 AlgeriaFocusEvents.411.d: "El gobierno iraquí ha rechazado cortésmente nuestra invitación a unirnos al Consejo de Mundos Islámicos, citando consideraciones estratégicas y prioridades nacionales."
 AlgeriaFocusEvents.411.a: "Desafortunado, pero tomado en nota"
 AlgeriaFocusEvents.42.t: "Invitación al Consejo de Mundos Islámicos"
 AlgeriaFocusEvents.42.d: "Hemos recibido una respuesta oficial respecto a nuestra iniciativa de expandir el Consejo de Mundos Islámicos. La nación invitada está considerando si alinearse económica y políticamente con la CIW."
 AlgeriaFocusEvents.42.a: "Darles la bienvenida al Consejo"
 AlgeriaFocusEvents.42.b: "Han rechazado la oferta"
 AlgeriaFocusEvents.421.t: "Invitación rechazada"
 AlgeriaFocusEvents.421.d: "El país invitado ha rechazado participar en el Consejo de Mundos Islámicos. Nuestros esfuerzos diplomáticos tendrán que ser redirigidos a otra parte."
 AlgeriaFocusEvents.421.a: "Muy bien"
 AlgeriaFocusEvents.81.t: "Invitación a la Alianza de la CIW"
 AlgeriaFocusEvents.81.desc: "Hemos recibido una invitación para unirnos a la alianza del Consejo de Mundos Islámicos. La propuesta promete una mayor cooperación y apoyo mutuo, aunque puede requerir concesiones a cambio."
 AlgeriaFocusEvents.81.a: "Solo con garantías a cambio"
 AlgeriaFocusEvents.81.b: "Absolutamente no"
 ALG_power_struggle_resistance_dominant: "§REl pueblo desafía abiertamente al régimen§!"
 ALG_power_struggle_army_dominant: "§BEl estamento militar controla firmemente la situación§!"
 ALG_power_struggle_resistance_rising: "§YLa presión popular está aumentando contra el sistema§!"
 ALG_power_struggle_army_rising: "§YEl ejército está reafirmando su control sobre el poder§!"
 ALG_power_struggle_stable: "§WUn frágil equilibrio se mantiene por ahora§!"
 ALG_west_alignment_tt: "Formalizar una asociación estratégica con los Estados Unidos y profundizar los lazos con la OTAN y la UE. Esto otorga acceso a la tecnología e inversiones occidentales, pero puede tensar las relaciones con China y Rusia."
 ALG_china_alignment_tt: "Profundizar la cooperación con China bajo la Iniciativa de la Franja y la Ruta. Espera importantes inversiones en infraestructuras y crecimiento comercial, pero las potencias occidentales se mostrarán cautelosas."
 alg_crackdown.1.t: "Estallan protestas en Argel"
 alg_crackdown.1.d: "El arresto de figuras de la oposición ha desatado manifestaciones callejeras. Los manifestantes exigen reformas políticas y el fin de la represión."
 alg_crackdown.1.a: "Aplastad las protestas."
 alg_crackdown.1.b: "Liberar a algunos de los detenidos."
 alg_crackdown.2.t: "Huelgas y manifestaciones a escala nacional"
 alg_crackdown.2.d: "La prohibición de los partidos de la oposición ha desencadenado un movimiento de masas que recuerda a las protestas del Hirak. El país está paralizado."
 alg_crackdown.2.a: "Desplegar al ejército."
 alg_crackdown.2.b: "Abrir el diálogo y revocar la prohibición."
 democratic_reforms: "Proceso de reforma democrática"
 ALG_healthcare_success_tt: "Nuestras reformas sanitarias mejorarán la salud pública y reducirán los agravios."
 ALG_healthcare_failure_tt: "El fracaso en la reforma de la sanidad profundizará la indignación pública y fortalecerá la posición política del ejército."
 ALG_education_success_tt: "La reforma educativa modernizará nuestra fuerza laboral y reducirá el descontento."
 ALG_education_failure_tt: "La crisis de la educación continúa. La frustración pública aumenta."
 ALG_unemployment_success_tt: "Los programas de creación de empleo reducirán el desempleo y estabilizarán el país."
 ALG_unemployment_failure_tt: "El fracaso a la hora de abordar el desempleo desencadenará huelgas y disturbios."
 ALG_tamazgha.1.t: "Invitación de Tamazgha"
 ALG_tamazgha.1.d: "El gobierno de [FROM.GetName], ahora rebautizado como 'Tamazgha', se ha puesto en contacto con nosotros con una propuesta para formar una nueva alianza regional basada en la herencia amazigh compartida y la cooperación cultural. Afirman que esta confederación proporcionará un desarrollo económico mutuo, seguridad y el rechazo a las estructuras panárabes obsoletas como la Liga Árabe.\n\nMientras que algunos en nuestro gobierno ven esto como una oportunidad histórica, otros cuestionan las intenciones de Tamazgha y sus objetivos a largo plazo."
 ALG_tamazgha.1.a: "Nos uniremos a la Confederación de Tamazgha."
 ALG_tamazgha.1.b: "Esta no es nuestra lucha."
 ALG_election_time_idea: "Preparándose para las próximas elecciones"
 ALG_casablanca_decisions: "Iniciativa de Casablanca"
 ALG_casablanca_decisions_desc: "Opciones diplomáticas para presionar a Marruecos sobre el Sáhara Occidental a través de la Unión Africana o canales internacionales."
 ALG_casablanca_mission_tt: "Iniciar la misión de la Iniciativa de Casablanca. Requiere que primero selecciones un enfoque. La misión dura 180 días y produce un resultado bajo, medio o alto."
 ALG_casablanca_mission_desc: "Comenzar la ofensiva diplomática por tiempo limitado. El resultado determina si la presión de la UA puede eliminar las reclamaciones de Marruecos o (con un éxito rotundo) eliminar sus estados legítimos (cores)."
 ALG_casablanca_approach_tt: "Elige un enfoque estratégico para la Iniciativa de Casablanca. Solo se puede elegir un enfoque; luego, inicia la casilla de misión para llevar a cabo la campaña."
 ALG_casablanca_approach_great_powers: "Cortejar a las grandes potencias"
 ALG_casablanca_approach_great_powers_desc: "Gasta poder político cortejando a las principales potencias (EE. UU., España, Rusia). Ofrece la mayor probabilidad de producir una presión decisiva en la UA, pero es costoso y políticamente arriesgado."
 ALG_casablanca_approach_regional: "Enfoque regional exclusivo"
 ALG_casablanca_approach_regional_desc: "Depender de los socios regionales y evitar la influencia de las grandes potencias. Es más barato y menos arriesgado, pero es menos probable que logre resultados decisivos."
 ALG_casablanca_approach_mixed: "Estrategia mixta"
 ALG_casablanca_approach_mixed_desc: "Combina la presión regional e internacional. Costes y probabilidades equilibrados."
 ALG_morocco.2.t: "Presión de la UA y la ONU sobre Marruecos"
 ALG_morocco.2.d: "Tras la campaña diplomática de Argelia en la UA y la ONU, Marruecos se enfrenta a la presión internacional respecto al Sáhara Occidental. ¿Cumplirá el reino con las exigencias o se resistirá y se arriesgará a sufrir sanciones?"
 ALG_morocco.2.a: "Ceder bajo presión"
 ALG_morocco.2.b: "Resistir a la presión, arriesgándose a sanciones"
 Algeria_events.5.t: "Campaña exitosa contra la caza furtiva"
 Algeria_events.5.desc: "Gracias a nuestros esfuerzos coordinados, cientos de animales en peligro de extinción han sido protegidos en los últimos meses. Esto no solo ha reducido la caza ilegal, sino que también ha ayudado a preservar los frágiles ecosistemas del desierto, frenando los efectos de la desertificación en las regiones afectadas."
 Algeria_events.5.a: "Excelente"
 Algeria_events.6.t: "Campaña fallida contra la caza furtiva"
 Algeria_events.6.desc: "A pesar de nuestros intentos por proteger la fauna salvaje, los cazadores furtivos continúan con sus actividades habituales. El ecosistema del desierto sigue bajo amenaza y nuestra campaña ha tenido poco efecto a la hora de frenar la desertificación o la caza ilegal."
 Algeria_events.6.a: "¡Todo ese esfuerzo desperdiciado!"
 ALG_ethnic_arab_display: "Árabes: [?ALG_ethnic_arab]%"
 ALG_ethnic_kabyle_display: "Cabilas: [?ALG_ethnic_kabyle]%"
 ALG_kabyle_content: "Cooperación cabila"
 ALG_kabyle_content_desc: "El pueblo cabila, con sus niveles educativos tradicionalmente altos, está contribuyendo con entusiasmo al desarrollo nacional y a la investigación."
 ALG_kabyle_discontent: "Movimiento por la Autonomía Cabila"
 ALG_kabyle_discontent_desc: "Activistas cabilas están organizando protestas exigiendo el reconocimiento del tamazight y una mayor autonomía regional. La sombra de la Primavera Negra se cierne sobre la región."
 ALG_kabyle_unrest: "Crisis de Cabilia"
 ALG_kabyle_unrest_desc: "La región de Cabilia se encuentra en abierta rebelión. Las protestas, las huelgas y la desobediencia civil están paralizando la zona. Se necesitan medidas urgentes."
 ALG_black_spring_happened: "Ocurrió la Primavera Negra"
 ALG_has_conducted_census: "Ha realizado el censo nacional"
 ALG_ethnic_system_active: "Asuntos étnicos establecidos"
 ALG_can_enact_ethnic_policy: "Puede promulgar una nueva política étnica"
 algeria_power_balance: "Lucha política argelina"
 algeria_old_guard: "Le Pouvoir (Vieja guardia)"
 algeria_reformists: "Movimiento Hirak (Reformistas)"
 algeria_compromise_range: "Compromiso frágil"
 algeria_compromise_range_desc: "Ningún bando domina. Persiste un tenso estancamiento mientras ambas facciones maniobran para obtener ventaja."
 old_guard_leaning: "Influencia de la vieja guardia"
 old_guard_leaning_desc: "El estamento militar comienza a reafirmar su dominio tradicional."
 old_guard_partial_control: "Consolidación de la vieja guardia"
 old_guard_partial_control_desc: "Le Pouvoir endurece su control. Las voces reformistas son marginadas."
 old_guard_strong_control: "Deriva autoritaria"
 old_guard_strong_control_desc: "El aparato de seguridad domina la vida política. Las instituciones democráticas se erosionan."
 old_guard_full_control: "Dominio militar"
 old_guard_full_control_desc: "Le Pouvoir controla Argelia con puño de hierro. Las libertades civiles están severamente restringidas."
 reformists_leaning: "Agitación reformista"
 reformists_leaning_desc: "La sociedad civil se vuelve más audaz. El espíritu del Hirak revive."
 reformists_gaining_ground: "Impulso reformista"
 reformists_gaining_ground_desc: "El movimiento de reforma gana fuerza. La vieja guardia lucha por mantener el control."
 reformists_strong_momentum: "Oleada democrática"
 reformists_strong_momentum_desc: "Los reformistas dominan el discurso público. El cambio real parece posible."
 reformists_victory: "Transición democrática"
 reformists_victory_desc: "Argelia abraza el gobierno civil y el pluralismo. El control de Le Pouvoir ha sido roto."
 ALG_political_struggle: "Lucha política argelina"
 ALG_political_struggle_desc: "La batalla entre la vieja guardia y los reformistas moldeará el futuro de Argelia.\nEquilibrio actual: [ALG_power_struggle_state]\nControl militar: [ALG_army_grip_text]\nDescontento público: [ALG_grievance_text]"
 ALG_power_struggle_state: "Situación política"
 ALG_boost_reformists_tt: "Canalizar recursos hacia los políticos reformistas y los grupos de la sociedad civil.\nDesplaza el equilibrio hacia los reformistas en un §G+0.15§!."
 ALG_boost_old_guard_tt: "Reforzar el apoyo entre los veteranos militares y el estamento de seguridad.\nDesplaza el equilibrio hacia la vieja guardia en un §R-0.15§!."
 ALG_rally_students_tt: "Movilizar a los movimientos estudiantiles y a los jóvenes activistas a favor de la reforma.\nDesplaza el equilibrio hacia los reformistas en un §G+0.08§!."
 ALG_mobilize_veterans_tt: "Reunir a los veteranos de la guerra de independencia y a los oficiales retirados.\nDesplaza el equilibrio hacia la vieja guardia en un §R-0.08§!."
 ALG_bribe_elites_tt: "Utilizar el clientelismo para asegurar la lealtad de la élite.\nDesplaza el equilibrio hacia la vieja guardia en un §R-0.05§!.\nCuesta §R30§! de la tesorería. Corre el riesgo de avivar la corrupción."
 ALG_compromise_tt: "Negociar un acuerdo de reparto de poder entre los reformistas y la vieja guardia.\nMueve el equilibrio hacia el centro en un §W±0.08§!."
 ALG_media_campaign_reform_tt: "Lanzar una campaña mediática que promueva los valores democráticos.\nDesplaza el equilibrio hacia los reformistas en un §G+0.05§!."
 ALG_security_crackdown_tt: "Autorizar a las fuerzas de seguridad a reprimir la disidencia.\nDesplaza el equilibrio hacia la vieja guardia en un §R-0.05§!."
 ALG_world_tension_security_tt: "La inestabilidad global justifica un aparato de seguridad más fuerte.\nDesplaza el equilibrio hacia la vieja guardia en un §R-0.08§!."
 ALG_world_tension_high_security_tt: "Las severas tensiones globales exigen medidas de seguridad extraordinarias.\nDesplaza el equilibrio hacia la vieja guardia en un §R-0.12§!."
 ALG_crackdown_momentum_tt: "Nuestra política de represión fortalece la posición de la vieja guardia.\nDesplaza el equilibrio hacia la vieja guardia en un §R-0.10§!."
 ALG_reconciliation_momentum_tt: "Nuestro enfoque de reconciliación empodera a las voces reformistas.\nDesplaza el equilibrio hacia los reformistas en un §G+0.10§!."
 ALG_oil_patronage_tt: "Utilizar los ingresos del petróleo para financiar las redes de clientelismo.\nDesplaza el equilibrio hacia la vieja guardia en un §R-0.06§!.\nCuesta §R25§! de la tesorería, pero aumenta la estabilidad."
 ALG_economic_reforms_tt: "Implementar medidas de liberalización económica y transparencia.\nDesplaza el equilibrio hacia los reformistas en un §G+0.08§!."
 ALG_elite_patronage: "Redes de clientelismo de la élite"
 ALG_elite_patronage_desc: "Estamos comprando estabilidad a través del clientelismo, pero esto profundiza la corrupción y agota los recursos."
 alg_politics.10.t: "Las conversaciones de compromiso"
 alg_politics.10.d: "Representantes de ambas facciones se han reunido en secreto. Se ha alcanzado un compromiso, pero ¿lo respetarán ambas partes?"
 alg_politics.10.a: "Aceptar el acuerdo"
 alg_politics.10.b: "Rechazar y continuar la lucha"
 alg_politics.20.t: "Los reformistas toman el poder"
 alg_politics.20.d: "El movimiento reformista ha alcanzado una masa crítica. La vieja guardia se enfrenta a una elección: dar un paso a un lado o luchar."
 alg_politics.20.a: "Aceptar la transición democrática"
 alg_politics.20.b: "El estamento militar no se rendirá"
 alg_politics.21.t: "Golpe militar inminente"
 alg_politics.21.d: "Los generales han consolidado el poder y se disponen a marginar a los reformistas civiles."
 alg_politics.21.a: "Aceptar la autoridad militar"
 alg_politics.21.b: "Defender el movimiento de reforma"
 alg_politics.22.t: "Sombras sobre Argel"
 alg_politics.22.d: "El estamento de seguridad se vuelve más audaz. Argelia está a la deriva hacia el autoritarismo. ¿Cómo respondemos?"
 alg_politics.22.a: "La seguridad debe ser lo primero"
 alg_politics.22.b: "Aliviar las tensiones antes de que sea demasiado tarde"
 alg_politics.23.t: "Vientos de cambio"
 alg_politics.23.d: "El movimiento de reforma se fortalece. Pero Le Pouvoir todavía comanda las fuerzas de seguridad. ¿Cómo procedemos?"
 alg_politics.23.a: "Avanzar con las reformas"
 alg_politics.23.b: "Frenar para evitar una reacción violenta"
 ALG_political_truce: "Tregua política"
 ALG_political_truce_desc: "Se mantiene un frágil compromiso entre los reformistas y la vieja guardia."
 ALG_tamazight_integration_process: "Proceso de integración del tamazight"
 ALG_tamazight_integration_process_desc: "El reconocimiento oficial del idioma tamazight se está implementando en todas las instituciones del Estado. Aunque esto ha pacificado en gran medida las regiones, el cambio burocrático y el ajuste de la identidad nacional provocan un periodo temporal de fricción a medida que avanzamos hacia una plena cohesión social."
 ALG_auto.1.t: "Escándalo en la industria automotriz"
 ALG_auto.1.desc: "Han salido a la luz revelaciones sobre una corrupción generalizada en la industria del automóvil de Argelia. Múltiples asociaciones extranjeras, incluidas Renault, BMW y Mercedes, se han visto implicadas en esquemas de sobornos y prácticas fraudulentas de importación. El público está indignado y exige medidas."
 ALG_auto.1.a: "Lanzar una investigación completa"
 ALG_auto.1.b: "Suprimir la noticia"
 ALG_auto.2.t: "Respuesta al escándalo automotriz"
 ALG_auto.2.desc: "Tras la investigación del escándalo, debemos decidir cómo gestionar las importaciones de automóviles en el futuro. Una prohibición total enviaría un fuerte mensaje pero dañaría nuestra economía. Las restricciones parciales ofrecen un término medio."
 ALG_auto.2.a: "Promulgar una prohibición total de importación"
 ALG_auto.2.b: "Implementar restricciones parciales"
 ALG_auto.2.c: "No tomar medidas sobre las importaciones"
 ALG_auto.3.t: "Fiat propone una asociación"
 ALG_auto.3.desc: "El fabricante de automóviles italiano Fiat se ha dirigido a nosotros con una propuesta para establecer instalaciones de fabricación en Argelia. Ven una oportunidad en nuestro mercado tras las restricciones de importación. Esto podría reactivar nuestro sector automotriz."
 ALG_auto.3.a: "Aceptar la propuesta de Fiat"
 ALG_auto.3.b: "Negociar mejores condiciones"
 ALG_auto.3.c: "Rechazar la propuesta"
 ALG_auto.4.t: "Recuperación del sector automotriz"
 ALG_auto.4.desc: "Tras nuestra respuesta mesurada al escándalo, el sector automotriz comienza a estabilizarse. Los fabricantes nacionales muestran interés en expandirse, mientras que las empresas extranjeras continúan acercándose a nosotros."
 ALG_auto.4.a: "Apoyar a los fabricantes nacionales"
 ALG_auto.4.b: "Considerar ofertas extranjeras"
 ALG_auto.5.t: "Fiat acepta nuestras condiciones"
 ALG_auto.5.desc: "Nuestros negociadores han tenido éxito. Fiat ha aceptado condiciones más favorables, incluyendo inversiones adicionales y transferencia de tecnología. Esta es una victoria significativa para la industria argelina."
 ALG_auto.5.a: "¡Excelentes noticias!"
 ALG_auto.6.t: "Fiat rechaza la renegociación"
 ALG_auto.6.desc: "Fiat ha rechazado nuestras demandas de mejores condiciones. Insisten en que su oferta original es más que justa. Debemos decidir si aceptamos sus condiciones o nos retiramos por completo del acuerdo."
 ALG_auto.6.a: "Aceptar las condiciones originales"
 ALG_auto.6.b: "Retirarse del acuerdo"
 ALG_corruption_auto_scandal: "Escándalo de corrupción automotriz"
 ALG_corruption_auto_scandal_desc: "La exposición de la corrupción generalizada en nuestra industria automotriz ha sacudido la confianza pública. Los socios extranjeros se están distanciando mientras las investigaciones continúan. Nuestra producción industrial y el capital político han recibido un golpe significativo."
 ALG_corruption_auto_scandal_coverup: "Escándalo automotriz suprimido"
 ALG_corruption_auto_scandal_coverup_desc: "Hemos intentado suprimir las noticias sobre el escándalo de la industria automotriz. Aunque el daño inmediato está contenido, las agencias de inteligencia extranjeras son conscientes de nuestro engaño y los grupos de la oposición nacional tienen munición contra nosotros. La verdad aún podría salir a la luz."
 ALG_import_ban_penalty: "Prohibición de importación de automóviles"
 ALG_import_ban_penalty_desc: "Se ha promulgado una prohibición total de las importaciones de automóviles tras el escándalo de corrupción. Aunque esto envía un fuerte mensaje contra la explotación extranjera, ha desbaratado gravemente las cadenas de suministro y la producción industrial. Los consumidores se enfrentan a la escasez y a precios más altos."
 ALG_import_restrictions_light: "Restricciones de importación de automóviles"
 ALG_import_restrictions_light_desc: "Se han implementado restricciones parciales a las importaciones de automóviles. Este enfoque mesurado mantiene algunas relaciones comerciales al tiempo que aborda la indignación pública por el escándalo de corrupción. El impacto económico es manejable pero aún perceptible."
 ALG_4g_rollout_tt: "§GArgelia lanza la red móvil 4G a escala nacional:§!\n- Internet móvil de alta velocidad\n- Conectividad empresarial mejorada\n- Expansión de servicios digitales"
 ALG_4g_coverage_basic: "Cobertura 4G - Básica"
 ALG_4g_coverage_basic_desc: "Nuestra red 4G está operativa, pero la cobertura se limita a los principales centros urbanos. Se necesita una inversión continua en infraestructura."
 ALG_4g_coverage_moderate: "Cobertura 4G - Moderada"
 ALG_4g_coverage_moderate_desc: "La cobertura 4G se extiende ahora a la mayoría de las ciudades y pueblos. Las empresas y los ciudadanos se benefician de una conectividad mejorada."
 ALG_4g_coverage_good: "Cobertura 4G - Buena"
 ALG_4g_coverage_good_desc: "Sólida cobertura 4G en la mayor parte de Argelia. La economía digital está floreciendo y la productividad va en aumento."
 ALG_4g_coverage_excellent: "Cobertura 4G - Excelente"
 ALG_4g_coverage_excellent_desc: "¡Cobertura 4G alcanzada en todo el país! Argelia es ahora un líder regional en conectividad móvil. Los cimientos están listos para el desarrollo del 5G."
 algerian_event.51.t: "¡Nave espacial argelina aterriza con éxito en la Luna!"
 algerian_event.51.desc: "¡La Agencia Espacial Argelina (ASAL) ha alcanzado un hito histórico! Nuestro módulo de aterrizaje lunar ha completado con éxito un alunizaje suave en la superficie lunar, convirtiendo a Argelia en la quinta nación de la historia en lograr esta hazaña.\n\nEl descenso se transmitió en vivo en todo el país, con millones de argelinos observando con asombro cómo nuestra nave espacial tocaba suelo cerca del polo sur lunar. Los científicos en el centro de control de Argel estallaron en celebraciones en cuanto la telemetría confirmó el éxito del alunizaje.\n\nEste logro sitúa a Argelia al lado de la URSS, los EE. UU., China y la India en el club de élite de naciones capaces de realizar alunizajes suaves. Representa la culminación de décadas de inversión en nuestro programa espacial y señala la emergencia de Argelia como una gran potencia espacial.\n\nEl mundo observa con admiración cómo se planta la bandera verde y blanca en la Luna."
 algerian_event.51.a: "¡Un paso gigante para Argelia!"
 ALG_missile_leverage: "Influencia de misiles"
 ALG_missile_leverage_desc: "Nuestra relación con China representa una oportunidad para adquirir tecnología avanzada de misiles. Al aprovechar nuestros lazos diplomáticos y nuestra posición estratégica, podemos negociar la transferencia de misiles de crucero de lanzamiento terrestre y plataformas de lanzamiento móviles. Esto mejorará significativamente las capacidades de disuasión de Argelia."
 ALG_build_nuclear_reactor_tt: "§GConstruir reactor nuclear:§!\n- Establecer la capacidad de energía nuclear civil\n- Reducir la dependencia de los combustibles fósiles\n- Capacitar a científicos e ingenieros nucleares\n- Sentar las bases para la investigación nuclear avanzada"
 ALG_election_pending: "Elecciones nacionales pendientes"
 ALG_opposition_reforms_1: "Reformas de la oposición: Libertad de prensa"
 ALG_opposition_reforms_1_desc: "El gobierno de la oposición ha comenzado su programa de reformas garantizando la libertad de los medios de comunicación. Una prensa libre exige ahora responsabilidades al gobierno e informa al público."
 ALG_opposition_reforms_2: "Reformas de la oposición: Sistema judicial"
 ALG_opposition_reforms_2_desc: "Aprovechando las reformas de los medios de comunicación, el gobierno de la oposición ha reformado el poder judicial. Los tribunales independientes garantizan ahora la justicia para todos los argelinos y combaten la corrupción."
 ALG_opposition_reforms_3: "Reformas de la oposición: Educación"
 ALG_opposition_reforms_3_desc: "El programa de reformas de la oposición continúa con importantes inversiones en educación. Un sistema modernizado está preparando a la juventud de Argelia para los desafíos que se avecinan."
 ALG_opposition_reforms_4: "Una nueva era para Argelia"
 ALG_opposition_reforms_4_desc: "El programa integral de reformas de la oposición se ha completado. Argelia se ha transformado en una nación moderna, democrática y próspera. Los medios de comunicación libres, los tribunales independientes, la educación de calidad y las oportunidades económicas definen esta nueva era."
 ALG_fis_movement: "Movimiento de Salvación Islámica"
 ALG_fis_movement_desc: "El FIS ha movilizado al pueblo argelino con su mensaje de democracia islámica, justicia social y lucha contra la corrupción. Las mezquitas sirven como centros comunitarios, proporcionando servicios sociales que el gobierno había descuidado. El apoyo popular crece día a día."
 ALG_fln.1.t: "Escándalo de corrupción sacude Argelia"
 ALG_fln.1.desc: "Periodistas de investigación han descubierto una red de corrupción que se extiende por todo el sistema político de Argelia. Los registros bancarios revelan millones desviados de los fondos públicos hacia cuentas privadas. Múltiples partidos parecen estar implicados, incluidos miembros de nuestro propio FLN.\n\nEl escándalo ha estallado ante la mirada pública y no podemos ignorarlo. La evidencia es condenable, pero la forma en que respondamos podría estabilizar o desestabilizar todo el sistema político. Debemos decidir nuestro curso de acción con cuidado."
 ALG_fln.1.a: "Enterrar la historia"
 ALG_cover_up_corruption_tt: "§ROcultar el escándalo:§!\n• La corrupción aumenta significativamente\n• Pérdida menor de poder político\n• Reputación del FLN ligeramente dañada\n• Estabilidad preservada por el momento\n\n§7\"Lo que el pueblo no sabe, no le hará daño\".§!"
 ALG_fln.1.b: "Culpar a los partidos de la oposición"
 ALG_blame_others_tt: "§YCulpar a los partidos de la oposición:§!\n• La corrupción aumenta\n• Los partidos de la oposición resultan fuertemente dañados\n• El FLN gana algo de apoyo\n• Se pierde algo de estabilidad\n\n§7\"¡Ellos son los verdaderos criminales aquí!\".§!"
 ALG_fln.1.c: "Dejar que la verdad salga a la luz"
 ALG_expose_all_tt: "§GExponer toda la corrupción:§!\n• Todos los partidos resultan dañados (incluido el FLN)\n• Pérdida significativa de estabilidad\n• Alto coste de poder político\n• PERO la corrupción disminuye\n• Impulso contra la corrupción (bonificación de 1 año)\n\n§7\"El pueblo merece saber la verdad\".§!"
 ALG_fln.1.e: "Lanzar una campaña integral contra la corrupción"
 ALG_anti_corruption_campaign_tt: "§GLanzar campaña contra la corrupción:§!\n• Todos los partidos resultan dañados (incluido el FLN)\n• Fuerte coste para la tesorería (§R-15§!)\n• Gran coste de poder político (§R-100§!)\n• PERO la corrupción disminuye significativamente\n• §GReformas permanentes contra la corrupción§!\n• Ganancia de estabilidad a largo plazo\n\n§7\"¡Eradicaremos este cáncer por completo!\".§!"
 ALG_anti_corruption_momentum: "Impulso contra la corrupción"
 ALG_anti_corruption_momentum_desc: "La exposición de la corrupción ha desatado la demanda pública de reformas. Aunque doloroso, este momento de transparencia ha creado un impulso para un cambio positivo."
 ALG_anti_corruption_reforms: "Reformas contra la corrupción"
 ALG_anti_corruption_reforms_desc: "Se han implementado medidas integrales contra la corrupción en todo el gobierno. Las adquisiciones transparentes, los auditores independientes y las protecciones para los denunciantes están reduciendo los sobornos y restaurando la confianza pública."
 ALG_fln.2.t: "Escándalo de corrupción en Sonatrach"
 ALG_fln.2.desc: "Un escándalo masivo de corrupción ha estallado en Sonatrach, la empresa estatal de petróleo de Argelia. Las investigaciones revelan miles de millones malversados a través de contratos falsos y cuentas en el extranjero. Altos ejecutivos y socios extranjeros están implicados.\n\nEl público exige respuestas. ¿Cómo responderemos?"
 ALG_fln.2.a: "Ocultarlo"
 ALG_fln.2.b: "Investigar la corrupción"
 ALG_fln.2.c: "Culpar a la oposición"
 ALG_fln.3.t: "El Hirak despierta"
 ALG_fln.3.desc: "Millones de argelinos han tomado las calles en un movimiento de masas que exige un cambio. Las protestas del Hirak han unido a la gente por encima de todas las divisiones: jóvenes y mayores, laicos y religiosos.\n\n«¡Yetnahaw Ga3!» (¡Tienen que irse todos!) resuena en cada ciudad.\n\nEl viejo orden tiembla. El pueblo ha encontrado su voz."
 ALG_fln.3.a: "El pueblo ha hablado."
 ALG_grievance_increase_5_tt: "§YDescontento público:§! +5"
 ALG_cover_up_scandal: "Ocultación del escándalo"
 ALG_cover_up_scandal_desc: "El escándalo de corrupción de Sonatrach ha sido enterrado, pero los rumores persisten. Las agencias de inteligencia extranjeras son conscientes del encubrimiento y la verdad amenaza con resurgir en cualquier momento."
 ALG_anti_corruption_probe: "Investigación contra la corrupción"
 ALG_anti_corruption_probe_desc: "Está en marcha una investigación exhaustiva sobre la corrupción en Sonatrach. Aunque interrumpe la actividad habitual, la investigación está restaurando la confianza pública y erradicando a los funcionarios corruptos."
 ALG_shift_blame: "Culpabilidad desviada a la oposición"
 ALG_shift_blame_desc: "El gobierno ha logrado redirigir la indignación pública por el escándalo de Sonatrach hacia los partidos de la oposición. Aunque es una propaganda eficaz, este desvío no hace nada para abordar la corrupción subyacente."
 ALG_mass_protests: "Protestas masivas"
 ALG_mass_protests_desc: "El movimiento Hirak ha sacado a millones de personas a las calles en toda Argelia. La actividad económica se encuentra paralizada mientras el pueblo exige un cambio fundamental. El viejo orden se tambalea."
 ALG_FLN_chosen: "Camino del FLN elegido"
 ALG_fln_opp_path: "Camino de la oposición del FLN"
 ALG_domestic_development_focus: "Enfoque en el desarrollo nacional"
 ALG_domestic_development_focus_desc: "Argelia ha optado por invertir en su propio desarrollo en lugar de la expansión extranjera. Los proyectos de infraestructura, el desarrollo industrial y los programas sociales están transformando a la nación en un Estado moderno y próspero."
 ALG_middle_east_expansion: "Expansión en Oriente Medio"
 ALG_middle_east_expansion_desc: "Nuestros ejércitos marchan hacia Oriente Medio. Las tropas están bien abastecidas y motivadas por visiones de gloria y conquista."
 ALG_de_arabisation_effect_TT: "§YPolítica de dearabización:§!\n\n§G Resurgimiento del idioma bereber§!\n  El tamazight se convierte en idioma cooficial\n\n§G Reconocimiento cultural§!\n  La identidad amazigh se celebra a nivel nacional\n\n§G Reforma educativa§!\n  La historia bereber se enseña en las escuelas\n\n§RConsecuencias:§!\n  - Apoyo nacionalista árabe\n  - Relaciones con la Liga Árabe\n  + Estabilidad regional en Cabilia"
 ALG_civil_reforms_1: "Protección de los derechos civiles"
 ALG_civil_reforms_1_desc: "Argelia ha establecido protecciones básicas para los derechos civiles. Los ciudadanos disfrutan de mayores libertades y se han sentado los cimientos para futuras reformas."
 ALG_civil_reforms_2: "Derechos civiles e igualdad de género"
 ALG_civil_reforms_2_desc: "Aprovechando las reformas de los derechos civiles, Argelia ha avanzado en la igualdad de género. Las mujeres se incorporan al mercado laboral en mayor número, impulsando la productividad y el crecimiento."
 ALG_civil_reforms_3a: "Reformas civiles: Prensa libre"
 ALG_civil_reforms_3a_desc: "El programa de reformas de Argelia incluye ahora la libertad de prensa. Los medios independientes exigen responsabilidades al gobierno, mientras que los derechos civiles y la igualdad de género continúan transformando la sociedad."
 ALG_civil_reforms_3b: "Reformas civiles: Independencia judicial"
 ALG_civil_reforms_3b_desc: "El programa de reformas de Argelia incluye ahora un poder judicial independiente. Los tribunales justos combaten la corrupción, mientras que los derechos civiles y la igualdad de género continúan transformando la sociedad."
 ALG_civil_reforms_4: "Reformas plenas de la sociedad civil"
 ALG_civil_reforms_4_desc: "Argelia ha completado reformas integrales de la sociedad civil. Los derechos civiles, la igualdad de género, la libertad de prensa, la independencia judicial y el empoderamiento de las organizaciones de la sociedad civil han transformado a Argelia en una democracia moderna."
 ALG_gov_reforms_1: "Iniciativa de gobierno digital"
 ALG_gov_reforms_1_desc: "Argelia ha comenzado a digitalizar los servicios gubernamentales. Las plataformas en línea mejoran la prestación de los servicios públicos y reducen la ineficiencia burocrática."
 ALG_gov_reforms_2: "Reformas del servicio público"
 ALG_gov_reforms_2_desc: "Aprovechando los cimientos digitales, Argelia ha reformado los servicios públicos. Los ciudadanos disfrutan de unos servicios gubernamentales más rápidos y eficientes."
 ALG_gov_reforms_3a: "Reformas contra la corrupción"
 ALG_gov_reforms_3a_desc: "La campaña contra la corrupción de Argelia ha saneado las instituciones gubernamentales. Se han restaurado la transparencia y la rendición de cuentas."
 ALG_gov_reforms_3b: "Sistema de administración electrónica"
 ALG_gov_reforms_3b_desc: "El portal de administración electrónica de Argelia ofrece a los ciudadanos un acceso fluido a los servicios gubernamentales en línea. La eficiencia burocrática ha mejorado drásticamente."
 ALG_gov_reforms_4: "Estado administrativo moderno"
 ALG_gov_reforms_4_desc: "Argelia ha logrado un gobierno plenamente modernizado, eficiente y transparente. Los servicios digitales, las medidas contra la corrupción y una burocracia optimizada definen a la nueva administración."
 ALG_african_union_engagement_full_tt: "§GCompromiso con la Unión Africana:§!\n\n§YEfectos en todos los Estados miembros de la UA:§!\n• Opinión de Argelia: §G+25§!\n• Influencia argelina: §G+2%§!\n\nArgelia fortalece su posición como una de las voces líderes en los asuntos africanos."
 ALG_mend_ties_with_rabat: "Restablecer lazos con Rabat"
 ALG_mend_ties_with_rabat_desc: "La frontera entre Argelia y Marruecos permanece cerrada desde 1994. El conflicto del Sáhara Occidental, la Guerra de las Arenas de 1963 y las alineaciones de la Guerra Fría crearon profundas heridas entre nuestras naciones.\n\nSin embargo, compartimos la misma herencia amazigh y árabe, la misma lucha contra el colonialismo y las mismas esperanzas para nuestros pueblos. Quizás sea hora de dejar atrás el pasado y construir una nueva relación con el Reino de Marruecos."
 ALG_our_east_brothers: "Nuestros hermanos orientales"
 ALG_our_east_brothers_desc: "Argelia y Túnez lucharon codo con codo contra el colonialismo francés. El suelo tunecino acogió a los refugiados argelinos y a los combatientes del FLN durante nuestra guerra de independencia.\n\nEsta hermandad debe ser fortalecida. Juntos, Argelia y Túnez pueden formar el núcleo de un Magreb unido y guiar al norte de África hacia un futuro próspero."
 ALG_black_spring: "La Primavera Negra"
 ALG_black_spring_desc: "El 18 de abril de 2001, Massinissa Guermah, un joven estudiante cabila, fue asesinado a tiros dentro de una brigada de la gendarmería en Beni Douala. Su muerte desató las mayores protestas en Cabilia desde la independencia, con más de 100 muertos a manos de las fuerzas de seguridad. La Primavera Negra ha comenzado."
 ALG_black_spring_tt: "§H¡Estalla la Primavera Negra!§!\nLa muerte de Massinissa Guermah desata protestas masivas en toda Cabilia. Más de 100 manifestantes mueren a manos de la gendarmería.\n\n§YDemandas cabilas:§!\n- Justicia para los fallecidos\n- Retirada de la gendarmería\n- Reconocimiento del tamazight\n- Fin de la «hogra» (el desprecio)"
 ALG_negotiate_with_arrouch: "Negociar con los Aarchs"
 ALG_negotiate_with_arrouch_desc: "Los Aarchs (consejos locales de aldeas) se han organizado en un movimiento coordinado que representa las demandas cabilas. En lugar de la confrontación, entablaremos un diálogo con estas estructuras tradicionales."
 ALG_negotiate_arrouch_tt: "§HEl Movimiento de los Aarchs§!\nLas asambleas tradicionales de las aldeas cabilas se han unido para presentar sus demandas. La negociación puede traer la paz.\n\n§YDemandas clave de los Aarchs:§!\n- Reconocimiento de la Plataforma de El Kseur\n- Derechos lingüísticos para el tamazight\n- Desarrollo económico\n- Fin de la presencia militar"
 ALG_recognize_tamazight_2002: "Tamazight: Idioma nacional"
 ALG_recognize_tamazight_2002_desc: "El 8 de abril de 2002, tras intensas negociaciones, el tamazight será reconocido como idioma nacional de Argelia, una concesión histórica para la identidad bereber."
 ALG_tamazight_national_tt: "§HEl tamazight se convierte en idioma nacional§!\nUn momento histórico: el tamazight se une al árabe como idioma nacional de Argelia.\n\n§YSignificado:§!\n- Primer reconocimiento de la identidad bereber\n- Enmienda constitucional\n- Las escuelas podrán enseñar tamazight\n- §G¡Gran victoria cabila!§!"
 ALG_address_hogra: "Abordar la Hogra"
 ALG_address_hogra_desc: "La hogra —el desprecio y la humillación que sienten los cabilas por parte del Estado— debe ser atajada. La inversión, los empleos y el respeto reemplazarán al abandono y al abuso."
 ALG_address_hogra_tt: "§HPoner fin a la Hogra§!\nLa «hogra» —el desprecio sistemático mostrado hacia los cabilas— se abordará mediante:\n\n- Inversión en infraestructuras en Cabilia\n- Programas de creación de empleo\n- Fin de las prácticas discriminatorias\n- Respeto por la dignidad cabila"
 ALG_amazigh_cultural_revival: "Renacimiento cultural amazigh"
 ALG_amazigh_cultural_revival_desc: "La inversión en instituciones culturales, museos y programas educativos bereberes preservará y celebrará la herencia amazigh que precede a la llegada árabe."
 ALG_amazigh_revival_tt: "§HRenacimiento cultural amazigh§!\n- Establecimiento de la Academia Amazigh\n- Financiación de museos bereberes\n- Apoyo a festivales culturales\n- Promoción de la escritura tifinagh"
 ALG_yennayer_national_holiday: "Día festivo nacional de Yennayer"
 ALG_yennayer_national_holiday_desc: "En diciembre de 2017, el presidente Bouteflika declaró el Yennayer —el Año Nuevo amazigh— como día festivo nacional. El 12 de enero se celebrará ahora en toda Argelia."
 ALG_yennayer_tt: "§HEl Yennayer se convierte en día festivo nacional§!\nEl Año Nuevo bereber (12 de enero) es ahora un día festivo oficial en Argelia.\n\n§YReconocimiento histórico:§!\n- Celebración de la herencia preislámica\n- Fortalecimiento de la unidad nacional\n- §G¡Aumento de la satisfacción cabila!§!"
 ALG_tamazight_official_2016: "Tamazight: Idioma oficial"
 ALG_tamazight_official_2016_desc: "La enmienda constitucional de 2016 eleva el tamazight de estatus de idioma «nacional» a «oficial», situándolo en igualdad de condiciones con el árabe."
 ALG_tamazight_official_tt: "§HEl tamazight se convierte en idioma oficial§!\n§WEnmienda constitucional de 2016:§!\n- El tamazight se iguala al árabe\n- Todos los documentos gubernamentales serán bilingües\n- El idioma bereber se implementará en todas las escuelas\n- §G¡Gran victoria constitucional!§!"
 ALG_berber_integration_complete: "Unidos en la diversidad"
 ALG_berber_integration_complete_desc: "A través del diálogo, el reconocimiento y la inversión, Argelia ha resuelto la cuestión cabila. Los argelinos árabes y amazigh se mantienen unidos."
 ALG_integration_complete_tt: "§HCuestión cabila resuelta§!\nArgelia ha integrado con éxito a su población bereber mediante:\n- El reconocimiento del idioma\n- Inversión cultural\n- Desarrollo económico\n- Respeto y diálogo\n\n§G¡Unidad nacional alcanzada!§!"
 ALG_crush_the_uprising: "Aplastar el levantamiento"
 ALG_crush_the_uprising_desc: "La Primavera Negra amenaza la unidad nacional. La gendarmería restaurará el orden y los elementos separatistas serán neutralizados."
 ALG_crush_uprising_tt: "§HRuta de represión§!\nUsa la fuerza para poner fin a las protestas y mantener la integridad territorial de Argelia.\n\n§YVentajas:§!\n- Conservar todo el territorio\n- Sin concesiones a los separatistas\n- Control militar\n\n§RCostes:§!\n- Críticas internacionales\n- Profundo resentimiento cabila\n- Resistencia continua"
 ALG_gendarmerie_reinforcement: "Refuerzo de la Gendarmería"
 ALG_gendarmerie_reinforcement_desc: "Se desplegarán unidades adicionales de la gendarmería en Cabilia para mantener el orden y prevenir futuros disturbios."
 ALG_gendarmerie_tt: "§HDesplegar fuerzas de seguridad§!\n- Presencia de la gendarmería aumentada\n- Monitoreo de protestas\n- Activistas clave detenidos\n- Orden mantenido por la fuerza"
 ALG_arabization_policy: "Política de arabización"
 ALG_arabization_policy_desc: "El árabe es el idioma de Argelia. Se intensificarán los programas de arabización en Cabilia para contrarrestar la ideología bereberista separatista."
 ALG_arabization_1_tt: "§HIntensificar la arabización§!\n- Educación obligatoria exclusivamente en árabe\n- Supresión del tamazight\n- Promoción de la identidad islámica\n- Contrarrestar la ideología bereberista\n\n§RLos cabilas guardarán un profundo resentimiento§!"
 ALG_ban_mak: "Prohibir el MAK"
 ALG_ban_mak_desc: "En mayo de 2021, el Mouvement pour l'Autodétermination de la Kabylie (MAK), liderado por Ferhat Mehenni, será designado como organización terrorista y prohibido."
 ALG_ban_mak_tt: "§HMAK designado organización terrorista§!\nEl Movimiento por la Autodeterminación de la Cabilia queda prohibido:\n- Ferhat Mehenni es etiquetado como terrorista\n- Arresto de los partidarios del MAK\n- Criminalización de la actividad separatista\n\n§Se esperan críticas internacionales§!"
 ALG_accuse_foreign_interference: "Acusar la injerencia extranjera"
 ALG_accuse_foreign_interference_desc: "El movimiento separatista del MAK no es orgánico; está financiado y respaldado por potencias extranjeras que buscan desestabilizar Argelia. Marruecos y otros deben ser expuestos."
 ALG_foreign_interference_tt: "§HCulpar a las potencias extranjeras§!\nEl MAK es acusado de ser un proxy extranjero:\n- Marruecos es acusado de financiar al MAK\n- Conspiraciones externas contra Argelia\n- Unidad nacional frente a los enemigos\n\n§RLas tensiones diplomáticas aumentarán§!"
 ALG_mak_israel_connection: "La conexión MAK-Israel"
 ALG_mak_israel_connection_desc: "La reunión de Ferhat Mehenni con funcionarios israelíes demuestra que el MAK es un proyecto sionista para dividir al mundo árabe. La conexión debe ser expuesta."
 ALG_mak_israel_tt: "§HVínculo MAK-Israel expuesto§!\n- El MAK es etiquetado como proyecto sionista\n- Israel es acusado de desestabilización\n- Respaldo de la Liga Árabe obtenido\n- Movilización del sentimiento antiisraelí\n\n§YEl apoyo interno §Gaumenta§!§!\n§RLas relaciones con Israel quedarán destruidas§!"
 ALG_kabylie_pacified: "Cabilia pacificada"
 ALG_kabylie_pacified_desc: "Mediante operaciones de seguridad y supresión política, Cabilia ha sido puesta bajo control. La amenaza separatista está contenida."
 ALG_kabylie_pacified_tt: "§HCabilia bajo control§!\n- El MAK ha sido aplastado\n- El separatismo ha sido criminalizado\n- Fuerzas de seguridad en control\n- Unidad nacional impuesta\n\n§YPero el resentimiento se mantiene latente.§!"
 ALG_el_kseur_platform: "Aceptar la Plataforma de El-Kseur"
 ALG_el_kseur_platform_desc: "La Plataforma de El-Kseur, redactada por los Aarchs el 11 de junio de 2001, contiene 15 demandas de justicia y derechos. La aceptaremos como base para la negociación."
 ALG_el_kseur_tt: "§HAceptar la Plataforma de El-Kseur§!\nLas 15 demandas incluyen:\n- Justicia para las víctimas de la Primavera Negra\n- Retirada de la gendarmería\n- Estatus oficial para el tamazight\n- Fin de la hogra\n- Desarrollo económico\n- Reformas democráticas\n\n§RSe requieren concesiones radicales§!"
 ALG_withdraw_gendarmerie: "Retirar a la Gendarmería"
 ALG_withdraw_gendarmerie_desc: "Una demanda clave de El-Kseur: la odiada gendarmería será retirada de Cabilia y reemplazada por la policía local."
 ALG_withdraw_gendarmerie_tt: "§HRetirada de la gendarmería§!\n- Las fuerzas paramilitares abandonan Cabilia\n- La policía local asume el control\n- Presencia militar reducida\n- Demanda cabila principal cumplida\n\n§REl estamento militar no estará satisfecho§!"
 ALG_trial_responsible_officers: "Juicio a los oficiales responsables"
 ALG_trial_responsible_officers_desc: "Los oficiales responsables de las muertes durante la Primavera Negra se enfrentarán a la justicia. Este paso sin precedentes reconoce los crímenes del Estado contra los cabilas."
 ALG_trial_officers_tt: "§HProcesar a los oficiales responsables§!\n- Los oficiales se enfrentan a juicios por los asesinatos\n- Compensación a las familias de las víctimas\n- El Estado reconoce los crímenes\n- Rendición de cuentas histórica\n\n§REl estamento militar se enfurecerá§!\n§GEl visto bueno internacional aumenta§!"
 ALG_secular_berber_identity: "Identidad bereber laica"
 ALG_secular_berber_identity_desc: "Cabilia ha sido históricamente más laica que el resto de Argelia. Reconocer la identidad bereber laica desafía la definición árabe-islámica de la nación argelina."
 ALG_secular_berber_tt: "§HReconocer la identidad amazigh laica§!\n- Celebración de la herencia preislámica\n- Valores laicos protegidos\n- Libertad religiosa garantizada\n- Desafía la narrativa islamista\n\n§YLos islamistas se opondrán a esto§!"
 ALG_mak_dialogue: "Diálogo con el MAK"
 ALG_mak_dialogue_desc: "Abrir el diálogo con el movimiento separatista MAK de Ferhat Mehenni. Esto arriesga legitimar el separatismo, pero puede ser el único camino hacia la paz."
 ALG_mak_dialogue_tt: "§HAbrir diálogo con el MAK§!\nNegociar con los separatistas:\n- Contacto con Ferhat Mehenni\n- Debate sobre la autodeterminación\n- Exploración de la autonomía\n- Independencia sobre la mesa\n\n§RExtremadamente controvertido§!\n§RRiesgo de legitimar el separatismo§!"
 ALG_reject_separatism: "Rechazar el separatismo"
 ALG_reject_separatism_desc: "A la vez que se respetan los derechos bereberes, la integridad territorial de Argelia no es negociable. La unidad en la diversidad —no la división— es la respuesta."
 ALG_reject_separatism_tt: "§HUnidad en la diversidad§!\n- Separatismo rechazado\n- Derechos bereberes garantizados\n- Integración territorial mantenida\n- Una Argelia diversa pero unada"
 ALG_kabyle_autonomy_statute: "Estatuto de Autonomía de Cabilia"
 ALG_kabyle_autonomy_statute_desc: "Un estatuto de autonomía formal para Cabilia: autogobierno en los asuntos locales permaneciendo como parte de Argelia. Un compromiso histórico."
 ALG_autonomy_statute_tt: "§HCabilia obtiene la autonomía§!\n- Establecimiento del parlamento regional\n- El tamazight es reconocido como oficial\n- Poderes de recaudación de impuestos locales\n- Autonomía cultural concedida\n\n§YCabilia sigue siendo parte de Argelia§!"
 ALG_federal_algeria: "Argelia federal"
 ALG_federal_algeria_desc: "Argelia se transforma en una república federal, con Cabilia como la primera región autónoma. Otras regiones podrían seguir este modelo."
 ALG_federal_algeria_tt: "§HArgelia se vuelve federal§!\n- Adopción de la constitución federal\n- Autonomía regional concedida\n- Cabilia como modelo\n- Descentralización del poder\n- Unidad a través del federalismo"
 ALG_united_secular_algeria: "Argelia laica unida"
 ALG_united_secular_algeria_desc: "Una Argelia unida y laica que respete todas las identidades: árabe y amazigh, musulmana y laica. La diversidad es nuestra fuerza."
 ALG_united_secular_tt: "§HArgelia laica unida§!\n- Establecimiento del Estado laico\n- Respeto a todas las identidades\n- Sin separatismo\n- Sin islamismo\n- Democracia moderna"
 ALG_release_kby_autonomous_tt: "§YLiberar Cabilia como región autónoma§!"
 ALG_black_spring_spirit: "Disturbios de la Primavera Negra"
 ALG_black_spring_spirit_desc: "El asesinato de Massinissa Guermah ha desatado las mayores protestas desde la independencia. Cabilia arde en rabia contra el Estado."
 ALG_arrouch_negotiations: "Negociaciones con los Aarchs"
 ALG_arrouch_negotiations_desc: "El gobierno está negociando con el movimiento de los Aarchs. Las asambleas tradicionales de las aldeas hablan ahora en nombre de Cabilia."
 ALG_tamazight_national_language: "Tamazight como idioma nacional"
 ALG_tamazight_national_language_desc: "El tamazight ha sido reconocido como idioma nacional de Argelia, un paso fundamental hacia el reconocimiento bereber."
 ALG_tamazight_official_language: "Tamazight como idioma oficial"
 ALG_tamazight_official_language_desc: "La constitución de 2016 convirtió al tamazight en idioma oficial, en igualdad de condiciones con el árabe. Un logro histórico para los derechos bereberes."
 ALG_addressing_kabyle_grievances: "Abordar los agravios cabilas"
 ALG_addressing_kabyle_grievances_desc: "El gobierno está invirtiendo en Cabilia y abordando años de abandono y de «hogra» (desprecio)."
 ALG_amazigh_cultural_institutions: "Instituciones culturales amazigh"
 ALG_amazigh_cultural_institutions_desc: "La inversión en las instituciones culturales bereberes preserva y celebra la herencia amazigh de Argelia."
 ALG_united_algeria: "Argelia unida"
 ALG_united_algeria_desc: "A través del diálogo y el respeto, Argelia ha unido a sus poblaciones árabe y amazigh. La cuestión cabila queda resuelta."
 ALG_kabyle_crackdown: "Represión cabila"
 ALG_kabyle_crackdown_desc: "Las fuerzas de seguridad están reprimiendo las protestas cabilas. El orden se está restaurando mediante la fuerza."
 ALG_gendarmerie_deployed: "Gendarmería desplegada"
 ALG_gendarmerie_deployed_desc: "Unidades de la gendarmería están estacionadas en toda Cabilia, manteniendo el orden y monitoreando la disidencia."
 ALG_forced_arabization: "Arabización forzosa"
 ALG_forced_arabization_desc: "Las políticas de arabización se están intensificando en Cabilia. La identidad bereber está siendo suprimida en favor del nacionalismo árabe-islámico."
 ALG_mak_banned: "MAK prohibido"
 ALG_mak_banned_desc: "El Movimiento por la Autodeterminación de la Cabilia ha sido designado como organización terrorista. El separatismo queda ahora criminalizado."
 ALG_foreign_hands_narrative: "Narrativa de la injerencia extranjera"
 ALG_foreign_hands_narrative_desc: "El gobierno culpa a las potencias extranjeras —especialmente a Marruecos e Israel— del separatismo cabila. Los enemigos externos unen a la nación."
 ALG_mak_terrorist_designation: "Designación terrorista del MAK"
 ALG_mak_terrorist_designation_desc: "El MAK y Ferhat Mehenni son designados como terroristas con vínculos con Israel. La amenaza separatista se retrata como un complot sionista."
 ALG_kabylie_under_control: "Cabilia bajo control"
 ALG_kabylie_under_control_desc: "Mediante el uso de la fuerza y la supresión política, Cabilia se encuentra bajo el control del gobierno. Pero el resentimiento se mantiene latente bajo la superficie."
 ALG_el_kseur_negotiations: "Negociaciones de El-Kseur"
 ALG_el_kseur_negotiations_desc: "El gobierno ha aceptado la Plataforma de El-Kseur como base para las negociaciones con Cabilia."
 ALG_secular_amazigh_movement: "Movimiento amazigh laico"
 ALG_secular_amazigh_movement_desc: "Se está reconociendo una identidad bereber laica, desafiando la definición árabe-islámica de la nación argelina."
 ALG_mak_negotiations: "Negociaciones con el MAK"
 ALG_mak_negotiations_desc: "El gobierno mantiene un diálogo sin precedentes con el movimiento separatista MAK. El futuro de Cabilia pende de un hilo."
 ALG_unity_within_diversity: "Unidad en la diversidad"
 ALG_unity_within_diversity_desc: "Argelia abraza su diversidad —árabe y amazigh, musulmana y laica— al tiempo que mantiene la unidad nacional. El separatismo es rechazado."
 ALG_federal_republic: "República federal"
 ALG_federal_republic_desc: "Argelia se ha convertido en una república federal, con Cabilia como la primera región autónoma. El poder se descentraliza mientras se mantiene la unidad."
 ALG_secular_united_nation: "Nación laica unida"
 ALG_secular_united_nation_desc: "Argelia ha emergido como una nación unida y laica que respeta todas las identidades y rechaza tanto el separatismo como el extremismo religioso."
 KBY_autonomous_kabylie: "Cabilia autónoma"
 KBY_autonomous_kabylie_desc: "Cabilia ha logrado la autonomía dentro de Argelia. Autogobierno en los asuntos locales permaneciendo como parte de la nación."
 KBY_federal_partner: "Socio federal"
 KBY_federal_partner_desc: "Como socio federal de Argelia, Cabilia goza de plena autonomía y de una asociación equitativa en la federación argelina."
 ALG_kabyle_autonomy: "Camino de la autonomía cabila"
 ALG_kabyle_suppressed: "Camino de la represión cabila"
 ALG_kabyle_independence: "Camino de la independencia cabila"
 ALG_black_spring_triggered: "Primavera Negra desencadenada"
 ALG_kabyle_issue_resolved: "Cuestión cabila resuelta"
 ALG_became_federal: "Argelia se volvió federal"
 ALG_secular_path_complete: "Ruta laica completada"
 human_rights_violation: "Violaciones de los derechos humanos"
 human_rights_progress: "Progreso de los derechos humanos"
 accused_of_interference: "Acusado de injerencia"
 accused_of_terrorism_support: "Acusado de apoyar al terrorismo"
 anti_israel_stance: "Postura antiisraelí"
 ALG_bribe_malian_generals: "Sobornar a generales malienses"
 ALG_bribe_malian_generals_desc: "La junta militar de Mali puede ser influenciada mediante una cuidadosa distribución de fondos. Al sobornar a generales clave, Argelia puede obtener una ventaja en la toma de decisiones de Bamako y asegurar nuestros intereses en el Sahel."
 ALG_isolate_mali_regime: "Aislar al régimen de Mali"
 ALG_isolate_mali_regime_desc: "El régimen militar de Bamako ha desestabilizado la región y amenazado a las poblaciones tuareg. Argelia trabajará para aislar internacionalmente a la junta, posicionándonos como el mediador legítimo en la crisis del Sahel."
 ALG_isolate_mali_tt: "§YIsolate the Malian Regime§!\nUse diplomatic pressure and African Union channels to condemn the military junta.\n\n§YBenefits:§!\n- Regional leadership for Algeria\n- Tuareg support increased\n- Mali weakened\n- AU influence gained\n\n§WOutcome:§!\nAlgeria becomes the key mediator in Sahel affairs"
 ALG_au_condemns_mali_tt: "§YLa Unión Africana condena al régimen maliense§!\nTodos los miembros de la UA reducen la opinión sobre Mali"
 ALG_malian_general_network: "Red de generales malienses"
 ALG_malian_general_network_desc: "Una red de generales malienses sobornados proporciona a Argelia inteligencia e influencia sobre la junta militar en Bamako."
 ALG_sahel_mediator: "Mediador del Sahel"
 ALG_sahel_mediator_desc: "Argelia ha emergido como el principal mediador diplomático en los conflictos del Sahel. Nuestra voz tiene peso en los asuntos regionales."
 MAL_international_isolation: "Aislamiento internacional"
 MAL_international_isolation_desc: "El régimen militar se enfrenta a la condena y al aislamiento internacional. El comercio se ve alterado, la ayuda extranjera suspendida y el gobierno lucha por mantener el control."
 ALG_bribed_our_generals: "Sobornó a nuestros generales"
 ALG_supported_our_cause: "Apoyó nuestra causa"
 AU_condemned_regime: "La UA condenó al régimen"
 ALG_bribed_mali_generals: "Sobornó a generales malienses"
 ALG_isolated_mali: "Aisló al régimen de Mali"
 ALG_dziri_unlock_tt: "§YRequiere uno de los siguientes:§!\n- Completar §HRestaurar la esperanza§!\n- Completar §HResistir a Le Pouvoir§!\n- Completar §HGolpe militar§!"
 ALG_requires_democratic_or_neutral_tt: "Requiere un gobierno §HDemocrático§! o §HNeutral§!"
 ALG_requires_authoritarian_or_neutral_tt: "Requiere un gobierno §HAutoritario§! o §HNeutral§!"
 ALG_not_gender_equality_tt: "§RIncompatible con el enfoque de Igualdad de género§!"
 ALG_not_suppressed_kabyle_tt: "§RNo disponible si Cabilia fue reprimida§!"
 ALG_migration_event_required_tt: "§YDesbloqueado por el evento de la Crisis migratoria§!"
 ALG_drug_event_required_tt: "§YDesbloqueado por el evento de la Crisis de las drogas§!"
 ALG_dziri_tt: "§GRama de la Sociedad Argelina desbloqueada:§!\n\nElige cómo moldear la sociedad argelina: progresista o tradicional, abierta o cerrada."
 ALG_dziri_unlocks_tt: "§YDesbloquea la rama de la Sociedad:§!\n- Camino de la Sociedad Civil (Democrático/Neutral)\n- Camino de las Tradiciones (Autoritario/Neutral)\n- Derechos Bereberes (Democrático/Neutral)\n- Respuesta a las Drogas (Desencadenado por evento)\n- Respuesta a la Migración (Desencadenado por evento)"
 ALG_open_civil_society_tt: "§GSociedad civil abierta:§!\n\n- Las ONG y las organizaciones benéficas florecen\n- Aumenta la participación democrática\n- Cimientos para reformas progresistas"
 ALG_constitutionalize_rights_tt: "§GDerechos constitucionales:§!\n\n- Libertades fundamentales protegidas\n- Fortalecimiento del estado de derecho\n- Aprobación internacional"
 ALG_integration_policy_tt: "§GProgramas de integración:§!\n\n- Los migrantes se convierten en ciudadanos productivos\n- Ganancias de mano de obra\n- Cohesión social"
 ALG_unlocks_migration_branch_tt: "§YDesbloquea la rama de Respuesta a la migración§!\n(Cuando se active el evento de migración)"
 ALG_migration_problems_tt: "§YCrisis migratoria:§!\n\nLos migrantes subsaharianos inundan las fronteras del sur de Argelia. Debes elegir cómo responder."
 ALG_migration_choice_tt: "§YElección:§!\n- §GPolítica de puertas abiertas§! - Dar la bienvenida a los migrantes\n- §RFronteras cerradas§! - Asegurar la frontera"
 ALG_open_door_tt: "§GPolítica de puertas abiertas§!\n\n- Bienvenida a migrantes y refugiados\n- Ganancias de mano de obra\n- Cierta pérdida de estabilidad\n- Reputación humanitaria"
 ALG_closed_borders_tt: "§RFronteras cerradas:§!\n\n- Asegurar la frontera\n- Ganancias de estabilidad\n- Influencia extranjera reducida\n- El crecimiento de la población se ralentiza"
 ALG_expand_berber_rights_tt: "§GExpandir los derechos bereberes:§!\n\n- Celebración de la cultura amazigh\n- Mejora de la satisfacción cabila\n- La investigación se beneficia de la diversidad"
 ALG_drug_problem_tt: "§YCrisis de las drogas:§!\n\nEl tráfico de drogas desde Marruecos y el Sahel ha creado problemas de adicción. Debes elegir cómo responder."
 ALG_drug_choice_tt: "§YElección:§!\n- §GDescriminalizar§! - Enfoque basado en la salud\n- §RReforzar los castigos§! - Enfoque policial"
 ALG_relax_restrictions_tt: "§GDescriminalizar las drogas:§!\n\n- Tratar la adicción como un problema de salud\n- Reducir la población carcelaria\n- Persiste cierta influencia de las mafias\n- Críticas internacionales reducidas"
 ALG_tighten_punishments_tt: "§RRepresión contra las drogas:§!\n\n- Penas severas para los traficantes\n- Influencia de las mafias reducida\n- Aumento del apoyo a la guerra\n- Cierta pérdida de estabilidad"
 ALG_traditions_matter_tt: "§GValores tradicionales:§!\n\n- Costumbres argelinas preservadas\n- Valores religiosos promovidos\n- Resistencia a la influencia cultural occidental"
 ALG_unlocks_conservative_path_tt: "§YDesbloquea el camino social conservador§!"
 ALG_censor_internet_tt: "§YCensurar internet:§!\n\n- Bloquear propaganda extranjera\n- Controlar el flujo de información\n- Reducir la influencia extranjera\n- Investigación ligeramente más lenta"
 ALG_restrict_women_tt: "§YRoles de género tradicionales:§!\n\n- Se anima a las mujeres a quedarse en casa\n- La tasa de natalidad puede aumentar\n- Fuerza laboral reducida\n- Críticas occidentales"
 ALG_marriage_subsidies_tt: "§GSubsidios al matrimonio:§!\n\n- El gobierno costea las bodas\n- Se fomenta el crecimiento de la población\n- Coste para la tesorería\n- Promoción de valores tradicionales"
 ALG_open_civil_society_idea: "Sociedad civil abierta"
 ALG_open_civil_society_idea_desc: "Argelia cuenta con una sociedad civil vibrante, con ONG, organizaciones benéficas y comunitarias activas que contribuyen a la vida pública."
 ALG_constitutionalize_rights_idea: "Derechos constitucionales"
 ALG_constitutionalize_rights_idea_desc: "Los derechos fundamentales están consagrados en la constitución, protegiendo a los ciudadanos argelinos y fortaleciendo el estado de derecho."
 ALG_integration_policy_idea: "Política de integración"
 ALG_integration_policy_idea_desc: "Argelia integra activamente a los migrantes y refugiados, proporcionando formación lingüística y vías hacia la ciudadanía."
 ALG_migration_crisis: "Crisis migratoria"
 ALG_migration_crisis_desc: "Las oleadas de migrantes procedentes del África subsahariana han desbordado las instalaciones fronterizas y generado tensiones sociales."
 ALG_welcome_migrants: "Política de puertas abiertas"
 ALG_welcome_migrants_desc: "Argelia da la bienvenida a los migrantes y refugiados, proporcionando asistencia humanitaria y apoyo para la integración."
 ALG_refugees_maintained: "Población de refugiados gestionada"
 ALG_refugees_maintained_desc: "La población de refugiados en Argelia está bien gestionada, contando con instalaciones adecuadas y programas de integración."
 ALG_drug_crisis: "Crisis de las drogas"
 ALG_drug_crisis_desc: "El tráfico de drogas y la adicción se han convertido en problemas graves, sobrecargando los servicios de salud y de orden público."
 ALG_traditions_matter_idea: "Valores tradicionales"
 ALG_traditions_matter_idea_desc: "Argelia promueve los valores tradicionales, incluyendo la familia, la fe y la comunidad. Se resiste a la influencia cultural occidental."
 ALG_censored_internet_idea: "Internet censurado"
 ALG_censored_internet_idea_desc: "El gobierno controla el acceso a internet, bloqueando la propaganda extranjera y el contenido inmoral."
 ALG_women_role_idea: "Roles de género tradicionales"
 ALG_women_role_idea_desc: "Se anima a las mujeres a adoptar los roles tradicionales como amas de casa y madres. La participación de las mujeres en la fuerza laboral ha disminuido."
 ALG_marriage_subsidies_idea: "Subsidios al matrimonio"
 ALG_marriage_subsidies_idea_desc: "El gobierno subsidia los matrimonios, ayudando a las parejas jóvenes a costear sus bodas y fomentando la formación de familias."
 restricts_women_rights: "Restringe los derechos de las mujeres"
 ALG_migration_flood: "Crisis migratoria activa"
 ALG_drugs: "Crisis de las drogas activa"
 ALG_mediterranean_games_preparation: "Preparativos para los Juegos Mediterráneos"
 ALG_mediterranean_games_preparation_desc: "Orán se está transformando para los Juegos Mediterráneos de 2022. Los equipos de construcción trabajan las veinticuatro horas del día en el Complejo Olímpico, los nuevos estadios y la villa de los atletas. La nación se vuelca con este acontecimiento histórico mientras Argelia se prepara para acoger a 26 naciones en sus costas."
 ALG_more_infra: "Expandir la infraestructura"
 ALG_more_infra_desc: "La infraestructura de Argelia requiere una expansión significativa para respaldar el crecimiento económico. Nuevas carreteras, vías férreas y servicios públicos conectarán a las comunidades y facilitarán el comercio en todo el país."
 TT_ALG_SECULAR_DISCONTENT_MODIFIER: "§RLos laicos se muestran descontentos§!\nLos argelinos progresistas y laicos se oponen a las políticas religiosas."
 TT_ALG_ISLAMIST_SATISFACTION_MODIFIER: "§GEl apoyo islamista aumenta§!\nLos conservadores religiosos aprueban estas medidas."
 ALG_more_relation_better: "§H¡Es§! §Gmás probable que se unan§! §Hsi tenemos§! §Gmejores relaciones!§!"
 algerian_military_dismantling: "Desmantelamiento militar"
 algerian_military_dismantling_desc: "El ejército de Argelia está siendo desmantelado sistemáticamente. El equipamiento es retirado del servicio, las unidades disueltas y los oficiales jubilados. El otrora poderoso Ejército Nacional Popular de Argelia es ahora una sombra de lo que fue."
 algerian_student_exchanges: "Programas de intercambio de estudiantes"
 algerian_student_exchanges_desc: "Los estudiantes argelinos estudian en el extranjero en universidades extranjeras, mientras que los estudiantes internacionales vienen a Argelia. Estos intercambios construyen conexiones, transfieren conocimientos y capacitan a la próxima generación de profesionales argelinos."
 ALG_boost_reformists: "Impulsar a los reformistas"
 ALG_boost_old_guard: "Impulsar a la vieja guardia"
 ALG_rally_students: "Reunir a los estudiantes"
 ALG_mobilize_veterans: "Movilizar a los veteranos"
 ALG_bribe_elites: "Sobornar a las élites"
 ALG_seek_compromise: "Buscar un compromiso"
 ALG_media_campaign_reform: "Reforma de la campaña mediática"
 ALG_security_crackdown: "Represión de seguridad"
 ALG_world_tension_security: "Seguridad por tensión mundial"
 ALG_world_tension_high_security: "Alta seguridad por tensión mundial"
 ALG_path_crackdown_momentum: "Impulso de la represión"
 ALG_path_reconciliation_momentum: "Impulso de la reconciliación"
 ALG_oil_patronage: "Clientelismo del petróleo"
 ALG_economic_reforms: "Reformas económicas"
 ALG_ter_oboronaup_start: "Defensa Territorial"
 ALG_internalup_start: "Tropas internas"
 ALG_MAJLIS_WATANI_SHAABI_DESC: "La Asamblea Popular Nacional es la cámara baja del Parlamento argelino. Bajo este sistema, el poder ejecutivo recae en la Asamblea y no en un único presidente, estableciendo una verdadera república parlamentaria donde los representantes electos gobiernan la nación de forma colectiva."
 ALG_a_new_algeria_tt: "La red de corrupción de Bouteflika es desmantelada. Sus riquezas robadas son incautadas, sus propiedades se venden y los fondos recuperados se devuelven a la tesorería nacional."
 FIS_faction_middle_east_available_tt: "Al menos una nación suní de Oriente Medio debe tener una opinión sobre nosotros superior a 70 y seguir una política exterior intervencionista."
 FIS_faction_asia_available_tt: "Al menos una nación suní asiática debe tener una opinión sobre nosotros superior a 70 y seguir una política exterior intervencionista."
 ALG_4g_upgrade_decisions_tt: "Desbloquea decisiones para actualizar la infraestructura de la red 4G nacional."
 ALG_environmental_campaign_no_space_tt: "No se han encontrado ranuras de construcción disponibles. En su lugar, se ha incrementado la influencia nacional a través de la campaña mediática ambiental."
 ALG_grand_mufti_rule_djaballah_tt: "Abdallah Djaballah será nombrado nuevo jefe de Estado, aportando un rumbo islamista conservador a la gobernanza de Argelia."
 ALG_grand_mufti_rule_ulema_tt: "Se consultará al Consejo de los Ulemas para determinar el liderazgo religioso de Argelia, lo que desencadenará una elección entre facciones clericales rivales."
 ALG_revivify_non_aligned_movement_t: "Argelia trabajará para revitalizar el Movimiento de Países No Alineados, posicionándose como una voz líder para las naciones que están fuera de los bloques de las grandes potencias."
 TT_ALG_REDUCE_TAXES_5: "La tasa impositiva de la población se reducirá en 5, aliviando la carga sobre las clases bajas y construyendo apoyo entre el campesinado."
 ALG_east_west_highway: "Autopista Este-Oeste"
 ALG_east_west_highway_desc: "La autopista Este-Oeste servirá como la columna vertebral económica de Argelia, conectando los principales centros de población desde Annaba hasta Tremecén y mejorando drásticamente el comercio interno y la movilidad."
 ALG_future_national_policy1: "Una nación ante una encrucijada"
 ALG_future_national_policy1_desc: "El futuro de Argelia sigue sin escribirse. Las decisiones que se tomen en los próximos años definirán el carácter del Estado, sus valores, sus aliados y su lugar en el mundo."
 ALG_hassi_massoud_exploitation_desc: "El campo petrolífero de Hassi Messaoud es uno de los más grandes de África. Al invertir en su plena explotación, Argelia puede aumentar drásticamente su producción de petróleo y asegurar ingresos energéticos a la largo plazo."
 ALG_north_south_highway_desc: "Una autopista transahariana que conecte la costa norte con el profundo sur abrirá el vasto interior de Argelia, permitiendo la extracción de recursos y reduciendo la desigualdad regional."
 ALG_black_decade_lesson2_idea: "Lessons of the Black Decade II"
 ALG_black_decade_lesson2_idea_desc: "Las reformas de las fuerzas armadas se han basado en las dolorosas lecciones de la guerra civil. El ejército de Argelia está mejor preparado para gestionar las amenazas internas sin recurrir a la violencia indiscriminada."
 ALG_black_decade_lesson3_idea: "Lessons of the Black Decade III"
 ALG_black_decade_lesson3_idea_desc: "Una década de reformas ha transformado la doctrina de seguridad de Argelia. El antiterrorismo está ahora arraigado en la cultura militar, con unidades especializadas y redes de inteligencia diseñadas específicamente para prevenir futuras insurgencias."
 ALG_decline_of_tourism1: "Sector turístico en recuperación"
 ALG_decline_of_tourism1_desc: "Lo peor de la crisis ha pasado. Las inversiones focalizadas y la mejora de las condiciones de seguridad están empezando a atraer de nuevo a los visitantes a los lugares históricos y a la costa mediterránea de Argelia."
 ALG_destroyed_agriculture_two: "Sector agrícola dañado"
 ALG_destroyed_agriculture_two_desc: "La inestabilidad persistente sigue obstaculizando la recuperación agrícola. Los campos siguen siendo improductivos y las comunidades rurales luchan por volver a las actividades agrícolas normales."
 ALG_destroyed_agriculture_three: "Reconstrucción agrícola"
 ALG_destroyed_agriculture_three_desc: "Se están llevando a cabo esfuerzos de reconstrucción en el sector agrícola. Se están cultivando nuevos distritos y la infraestructura se está reconstruyendo lentamente para restaurar la capacidad de producción de alimentos."
 ALG_family_centric_2: "La familia en el corazón de la sociedad II"
 ALG_family_centric_2_desc: "El énfasis en las estructuras familiares tradicionales se ha profundizado, modelando la política social en torno a una visión conservadora del hogar como fundamento de la sociedad argelina."
 ALG_hydroelectric_power_plants_upgraded2_idea: "Red hidroeléctrica avanzada"
 ALG_hydroelectric_power_plants_upgraded2_idea_desc: "Una segunda oleada de modernizaciones en la infraestructura hidroeléctrica de Argelia ha ampliado significativamente la capacidad de almacenamiento de energía y la fiabilidad de la red en todo el país."
 ALG_mastering_atom_2: "Dominar el átomo II"
 ALG_mastering_atom_2_desc: "El programa nuclear de Argelia ha avanzado a la etapa de enriquecimiento, despertando la preocupación internacional. El país es ahora capaz de producir material de grado militar, aunque aún no se ha dado el paso final."
 ALG_mastering_atom_3: "Dominar el átomo III"
 ALG_mastering_atom_3_desc: "Argelia ha desarrollado con éxito una capacidad de armas nucleares. La nación se encuentra ahora entre las potencias nucleares del mundo, alterando drásticamente el equilibrio de poder regional."
 ALG_riot_police_1: "Unidad de Respuesta Rápida Al-Saiqa"
 ALG_riot_police_1_desc: "Se ha formado una unidad de policía antidisturbios dedicada, entrenada específicamente para disolver protestas y mantener el orden en los centros urbanos. Su presencia actúa como disuasión ante los disturbios civiles."
 ALG_riot_police_2: "Despliegue ampliado de Al-Saiqa"
 ALG_riot_police_2_desc: "La unidad de policía antidisturbios ha sido reducida y reformada tras las críticas públicas por el uso excesivo de la fuerza. Su mandato se ha limitado y se ha incrementado la supervisión."
 ALG_riot_police_3: "Fuerza de élite Al-Saiqa"
 ALG_riot_police_3_desc: "La unidad Al-Saiqa se ha ampliado y profesionalizado hasta convertirse en una fuerza de seguridad interna de élite, capaz de desplegarse rápidamente en cualquier lugar del país."
 ALG_science_idea_two: "Renacimiento científico argelino II"
 ALG_science_idea_two_desc: "Aprovechando la primera oleada de inversiones científicas, Argelia ha establecido una red de instituciones de investigación y asociaciones internacionales que están acelerando el desarrollo tecnológico."
 ALG_air_reform_desc: "Una primera ronda de reformas en la Fuerza Aérea Argelina ha comenzado a modernizar su estructura de mando y a actualizar su flota de aeronaves envejecidas."
 ALG_air_reform2_desc: "La segunda fase de la reforma de la fuerza aérea ha introducido programas de entrenamiento avanzados y ha mejorado los procedimientos de mantenimiento, incrementando la preparación operativa."
 ALG_air_reform3_desc: "La fuerza aérea de Argelia ha sido reestructurada sustancialmente. Se han puesto en servicio nuevos escuadrones equipados con aviones modernos, mejorando significativamente la defensa aérea y la proyección de poder."
 ALG_air_reform4_desc: "El programa de reforma de la fuerza aérea se ha completado. Argelia cuenta ahora con una de las fuerzas aéreas más capaces del continente africano."
 ALG_algerian_tourism_desc: "El sector turístico de Argelia se está promoviendo activamente, con inversiones en infraestructura hotelera y campañas de marketing internacional que atraen a los visitantes al rico patrimonio cultural y natural del país."
 ALG_army_reform_desc: "Se ha puesto en marcha un programa integral de reformas para modernizar el Ejército de Argelia, mejorando los estándares de entrenamiento, la logística y las estructuras de mando."
 ALG_army_reform_mass_army_desc: "Argelia está construyendo un gran ejército convencional capaz de realizar operaciones sostenidas, priorizando la mano de obra y la infantería mecanizada por encima de las fuerzas especializadas."
 ALG_army_reform_mass_army2_desc: "La reforma del ejército de masas ha entrado en su segunda fase, con una logística mejorada y un apoyo blindado que incrementa el poder de combate convencional de las fuerzas terrestres argelinas."
 ALG_army_reform_mass_army3_desc: "La doctrina del ejército de masas de Argelia está plenamente establecida. Las grandes formaciones de armas combinadas son ahora la columna vertebral de la estrategia de defensa terrestre de la nación."
 ALG_army_reform_mass_army4_desc: "El programa del ejército de masas se ha completado. Argelia puede desplegar fuerzas terrestres numéricamente superiores respaldadas por una robusta infraestructura logística."
 ALG_army_reform_specops_desc: "Argelia está invirtiendo en fuerzas de operaciones especiales, creando unidades de élite entrenadas para el antiterrorismo, la respuesta rápida y la guerra no convencional."
 ALG_army_reform_specops2_desc: "El programa de fuerzas especiales se ha ampliado, con nuevas unidades entrenadas en el rescate de rehenes, infiltración profunda y operaciones de acción directa."
 ALG_army_reform_specops3_desc: "Las fuerzas especiales de Argelia han alcanzado un alto nivel de capacidad, aprovechando las lecciones de décadas de experiencia en contrainsurgencia tanto en el Sahel como en el propio país."
 ALG_army_reform_specops4_desc: "El programa de reforma de las fuerzas especiales se ha completado. Las unidades de élite de Argelia se encuentran entre las más capaces de África, respetadas por su experiencia y sofisticación operativa."
 ALG_basic_income_support_desc: "Un programa de apoyo a los ingresos básicos proporciona una red de seguridad financiera para los ciudadanos más pobres de Argelia, reduciendo la pobreza y amortiguando los efectos de la volatilidad económica."
 ALG_black_decade_methods_desc: "Las fuerzas de seguridad siguen confiando en los brutales métodos desarrollados durante la guerra civil. Aunque eficaz a corto plazo, este enfoque alimenta el resentimiento y arriesga reavivar el mismo extremismo que pretende suprimir."
 ALG_border_security_idea_desc: "Los puestos de control fronterizos reforzados y las rutas de patrulla ampliadas han mejorado la capacidad de Argelia para interceptar a contrabandistas, traficantes de armas e infiltrados extremistas que cruzan sus vastas fronteras desérticas."
 ALG_childcare_reform_desc: "Se están implementando nuevas instalaciones de cuidado infantil y programas de guarderías subsidiadas, lo que facilita a las familias conciliar el trabajo y la crianza de los hijos."
 ALG_closed_moroccan_border_desc: "La frontera con Marruecos permanece firmemente cerrada. Aunque esto limita el contrabando transfronterizo, también frena el comercio legítimo y profundiza el congelamiento diplomático entre ambas naciones."
 ALG_confidence_measures_idea_desc: "Un paquete de medidas de fomento de la confianza entre Argelia y sus vecinos está ayudando a reducir las tensiones y a abrir canales para el diálogo diplomático."
 ALG_counter_morocco_idea_desc: "Argelia está contrarrestando activamente la influencia marroquí en la región mediante la presión diplomática, el apoyo al Frente Polisario y la competencia estratégica por aliados africanos."
 ALG_dialogue_with_morocco_desc: "Se ha abierto un diálogo cauteloso con Marruecos, explorando la posibilidad de normalizar las relaciones y reabrir la frontera tras años de hostilidad."
 ALG_education_arabization_desc: "Se ha profundizado la arabización del sistema educativo, reemplazando la instrucción en idioma francés por el árabe en todos los niveles e integrando los valores islámicos en el plan de estudios nacional."
 ALG_food_subsidy_idea_desc: "Los subsidios gubernamentales mantienen bajos los precios de los alimentos básicos, garantizando que incluso los argelinos más pobres puedan permitirse una nutrición básica. Sin embargo, esto representa una carga significativa para el presupuesto nacional."
 ALG_foreign_arms_companies_desc: "Argelia ha abierto su proceso de adquisición a los fabricantes de armas extranjeros, obteniendo acceso a una gama más amplia de equipamiento militar pero incrementando la dependencia de proveedores externos."
 ALG_fuel_subsidy_idea_desc: "Los precios subsidiados del combustible mantienen bajos los costes de transporte y energía para los hogares y empresas argelinas, pero representan una obligación fiscal importante que limita la flexibilidad presupuestaria del gobierno."
 ALG_future_army_desc: "Argelia está invirtiendo en tecnología y doctrina militar de próxima generación, posicionando a sus fuerzas armadas en la vanguardia de la capacidad de guerra moderna."
 ALG_global_power_desc: "Argelia se ha consolidado como una verdadera potencia global, con un asiento en la mesa internacional y el peso económico y militar necesario para respaldarlo."
 ALG_health_insurance_system_desc: "Se está estableciendo un sistema nacional de seguro de salud, proporcionando a los argelinos acceso a la atención médica independientemente de su nivel de ingresos."
 ALG_housing_support_idea_desc: "Los programas gubernamentales de apoyo a la vivienda están ayudando a las familias de bajos ingresos a acceder a alojamientos asequibles, reduciendo la presión de la escasez de vivienda urbana en Argelia."
 ALG_hydroelectric_power_plants_upgraded_idea_desc: "La infraestructura hidroeléctrica de Argelia ha sido modernizada, aumentando la capacidad y la fiabilidad de la generación de electricidad a partir de energía hidráulica y reduciendo la dependencia de los combustibles fósiles."
 ALG_idea_arab_diplomacy_desc: "Argelia está persiguiendo una agenda diplomática árabe activa, posicionándose como un mediador y una voz clave dentro de la Liga Árabe y el mundo árabe en general."
 ALG_idea_parliamentary_republic_desc: "Argelia ha adoptado un sistema de república parlamentaria, trasladando el poder ejecutivo hacia el legislativo y estableciendo una forma de gobierno más responsable."
 ALG_idea_presidential_republic_desc: "Argelia opera como una república presidencial, con la autoridad ejecutiva concentrada en la oficina del presidente, quien es elegido directamente por el pueblo."
 ALG_idea_refoming_education_desc: "Una primera ronda de reformas educativas ha comenzado a mejorar los estándares de los planes de estudio, la capacitación de los profesores y el acceso a la escolarización en todo el país."
 ALG_idea_refoming_education1_desc: "La segunda fase de la reforma educativa ha ampliado la educación secundaria, mejorado la formación profesional e introducido metodologías de enseñanza actualizadas en todas las escuelas de Argelia."
 ALG_idea_semi_presidential_republic_desc: "El sistema semipresidencial de Argelia equilibra el poder entre un presidente elegido directamente y un primer ministro responsable ante el parlamento."
 ALG_maghreb_cooperation_idea_desc: "Argelia está trabajando para profundizar la cooperación económica y política con sus vecinos del Magreb, sentando las bases para un bloque regional norteafricano más integrado."
 ALG_maghreb_security_idea_desc: "Un marco de seguridad compartido con los socios del Magreb está permitiendo respuestas coordinadas al terrorismo, el contrabando y la inestabilidad transfronteriza en el Sahel."
 ALG_maghreb_trade_idea_desc: "Los acuerdos comerciales preferenciales con las naciones del Magreb están impulsando el comercio intrarregional, reduciendo la dependencia de Argelia de los mercados europeos."
 ALG_mastering_atom_desc: "Argelia ha iniciado un programa nuclear clandestino, estableciendo la infraestructura de investigación necesaria para llegar a desarrollar material de grado militar."
 ALG_military_expansion_desc: "Argelia está expandiendo el tamaño de sus fuerzas armadas, invirtiendo en nuevo equipamiento y reclutando personal adicional para proyectar un mayor poder militar."
 ALG_military_expansion2_desc: "El programa de expansión militar ha entrado en su segunda fase, poniéndose en servicio nuevas unidades blindadas, brigadas de artillería y sistemas de defensa aérea."
 ALG_military_junta_desc: "El estamento militar ha tomado el control directo del Estado. Argelia está gobernada por una junta de generales cuya legitimidad descansa en la fuerza más que en el mandato popular."
 ALG_military_quality_initiative_desc: "Un enfoque de calidad sobre cantidad en la reforma militar está mejorando la profesionalidad, los estándares de entrenamiento y el equipamiento de las fuerzas armadas de Argelia."
 ALG_military_quality_initiative2_desc: "La segunda fase de la iniciativa de calidad militar ha introducido un entrenamiento de simulación avanzado, mejorado la educación de los oficiales y ampliado los ejercicios de servicios conjuntos."
 ALG_modern_hospitals_desc: "Argelia está construyendo una red de hospitales modernos equipados con tecnología médica contemporánea, mejorando significativamente los resultados sanitarios para la población."
 ALG_natural_products_idea_desc: "Argelia está promoviendo sus productos naturales, incluidos los dátiles, el aceite de oliva y los productos artesanales, en los mercados internacionales, diversificando los ingresos por exportación y apoyando a las comunidades rurales."
 ALG_naval_reform_desc: "La armada de Argelia está experimentando su primera gran reforma en décadas, mejorando el mantenimiento, el entrenamiento y la capacidad de su flota de superficie."
 ALG_naval_reform2_desc: "Se han puesto en servicio nuevas fragatas y patrulleros como parte de la segunda fase de la reforma naval, ampliando el alcance de Argelia en el Mediterráneo occidental."
 ALG_naval_reform3_desc: "La capacidad naval de Argelia ha sido mejorada sustancialmente con capacidades mejoradas de guerra antisubmarina y defensa costera."
 ALG_naval_reform4_desc: "El programa de reforma naval se ha completado. Argelia cuenta ahora con una fuerza naval moderna y equilibrada, capaz de proyectar poder a lo largo del Mediterráneo y en el Atlántico."
 ALG_open_border_coop_desc: "Argelia ha abierto sus fronteras a una mayor cooperación transfronteriza con sus vecinos, facilitando el comercio, el movimiento de personas y los proyectos conjuntos de infraestructura."
 ALG_pna_expansion_desc: "El Ejército Nacional Popular ha ampliado su capacidad logística y administrativa, mejorando su aptitud para sostener operaciones a gran escala en el vasto territorio de Argelia."
 ALG_polisario_support_idea_desc: "Argelia continúa brindando apoyo político, logístico y material al Frente Polisario, manteniendo la presión sobre Marruecos en la disputa del Sáhara Occidental."
 ALG_private_clinics_expansion_desc: "Se está permitiendo la expansión del sector sanitario privado, ofreciendo una atención de mayor calidad para quienes puedan permitírselo, al tiempo que se alivia la presión sobre el sistema de salud pública."
 ALG_private_healthcare_idea_desc: "Argelia está fomentando la inversión privada en la atención médica, creando un sector privado paralelo que ofrece servicios premium junto al sistema público."
 ALG_reactioners_desc: "Elementos conservadores dentro de la burocracia estatal y el ejército se resisten a cualquier reforma significativa, protegiendo los intereses del orden establecido a expensas de la modernización."
 ALG_reactioners1_desc: "Las fuerzas reaccionarias se han visto algo debilitadas, aunque conservan una influencia significativa dentro de las instituciones clave y continúan ralentizando el ritmo del cambio."
 ALG_reactioners2_desc: "El control de la vieja guardia se está relajando. Los esfuerzos de reforma han ganado el impulso suficiente como para superar muchos de los obstáculos institucionales que antes bloqueaban el progreso."
 ALG_reactioners3_desc: "La facción reaccionaria ha sido marginada sustancialmente. El nuevo acuerdo político ha apartado a muchos de sus aliados de las posiciones de poder."
 ALG_reactioners4_desc: "La reforma sistémica ha roto la columna vertebral del bloque reaccionario. Las instituciones de Argelia responden cada vez más a la demanda popular en lugar de a los intereses de la élite atrincherada."
 ALG_reactioners5_desc: "Solo quedan focos aislados de resistencia entre la vieja guardia. La transformación de la cultura política de Argelia está cerca de completarse."
 ALG_reactioners6_desc: "Los últimos vestigios del sistema reaccionario han sido barridos. Argelia ha entrado en una nueva era definida por la rendición de cuentas y una verdadera competencia política."
 ALG_reactioners7_desc: "Argelia ha roto por completo con su pasado autoritario. El Estado se estructura ahora en torno a las normas democráticas y el estado de derecho, habiéndose disuelto las antiguas redes de clientelismo."
 ALG_sand_war_memory_idea_desc: "El recuerdo de la Guerra de las Arenas de 1963 con Marruecos todavía condiciona la planificación militar y la política exterior de Argelia, fomentando una profunda sospecha institucional hacia las intenciones marroquíes."
 ALG_science_idea_desc: "Argelia está invirtiendo en investigación y desarrollo científico, estableciendo nuevos laboratorios y financiando programas de investigación universitaria para construir una economía nacional basada en el conocimiento."
 ALG_shipbuilding_desc: "Argelia está desarrollando una industria de construcción naval nacional, construyendo instalaciones capaces de producir buques navales y comerciales y reduciendo la dependencia de proveedores extranjeros."
 ALG_shipbuilding2_desc: "La industria de la construcción naval ha madurado, produciéndose ahora buques más grandes y complejos a nivel nacional. Argelia se está convirtiendo en una nación fabricante marítima creíble."
 ALG_social_contract_idea_desc: "El gobierno ha renovado su contrato social con la población, intercambiando la aquiescencia política por subsidios garantizados, empleo público y servicios sociales."
 ALG_sonatrach_desc: "Sonatrach, la empresa nacional de petróleo y gas de Argelia, sigue siendo la columna vertebral de la economía nacional, generando la gran mayoría de los ingresos por exportación del Estado."
 ALG_state_hospitals_idea_desc: "Una red de hospitales gestionados por el Estado proporciona acceso a la atención médica básica a todos los argelinos, aunque la falta de financiación crónica hace que la calidad varíe significativamente entre regiones."
 ALG_suppressed_opposition_desc: "La oposición política ha sido silenciada mediante una combinación de restricciones legales, control de los medios de comunicación e intimidación directa. La disidencia es empujada a la clandestinidad en lugar de ser eliminada."
 ALG_technological_ties_desc: "Argelia ha establecido acuerdos de transferencia de tecnología con socios extranjeros, obteniendo acceso a sistemas avanzados y conocimientos técnicos a cambio de concesiones económicas y diplomáticas."
 ALG_tikjda_resort_desc: "La estación de montaña de Tikjda, en la región de Cabilia, se está desarrollando como un destino turístico emblemático, promoviendo el ecoturismo y atrayendo visitantes a las montañas del Atlas de Argelia."
 ALG_universal_healthcare_idea_desc: "Argelia ha establecido un sistema de salud universal que proporciona atención médica gratuita o fuertemente subsidiada a todos los ciudadanos, financiado a través de la recaudación fiscal general y los ingresos por hidrocarburos."
 ALG_university_expansion_desc: "Se están estableciendo nuevos campus universitarios en toda Argelia, ampliando el acceso a la educación superior y produciendo graduados preparados para las demandas de la economía moderna."
 ALG_welfare_state_idea_desc: "Argelia ha construido un Estado del bienestar integral que proporciona ayuda a la vivienda, atención médica, educación y asistencia para los ingresos, financiado en gran parte por los ingresos del petróleo y el gas."
 FIS_al_aqsa_faction: "La Coalición de Al-Aqsa"
 Algeria_desc: "Argelia"
 AlgeriaFocusEvents_desc: "Eventos desencadenados por enfoques para Argelia."
 algeria_focus_desc: "Árbol de enfoques nacionales de Argelia, que cubre las rutas políticas, económicas, militares y de política exterior."
 algerian_focus_desc: "Árbol de enfoques nacionales de Argelia, que cubre las rutas políticas, económicas, militares y de política exterior."
 algeria_power_balance_desc: "El equilibrio de poder entre el gobierno civil y el estamento militar, que durante mucho tiempo ha operado como un Estado dentro del Estado en Argelia."
 nuclear_algeria_desc: "Argelia ha cruzado el umbral nuclear, poseyendo armas nucleares operativas que alteran fundamentalmente su postura estratégica en el norte de África y en el Mediterráneo en general."
 ALG_civilian_government: "Gobierno civil"
 ALG_civilian_government_desc: "Por primera vez en décadas, Argelia está gobernada por una administración genuinamente civil. El ejército ha dado un paso atrás en la intervención política directa, permitiendo que los funcionarios electos lideren."
 ALG_corrupt_generals: "Generales corruptos"
 ALG_corrupt_generals_desc: "El alto mando militar está plagado de corrupción. Los generales que se han enriquecido a través de décadas de clientelismo se resisten a cualquier reforma que amenace sus intereses económicos."
 ALG_government_led_disaster: "Respuesta gubernamental ante catástrofes"
 ALG_government_led_disaster_desc: "El Estado ha asumido el control directo de la respuesta ante catástrofes, desplegando recursos públicos a gran escala. Aunque es costosa y burocrática, la intervención está produciendo resultados reales sobre el terreno."
 ALG_no_disasters_plan: "Sin plan de contingencia ante catástrofes"
 ALG_no_disasters_plan_desc: "Argelia no dispone actualmente de un marco dedicado a la respuesta ante catástrofes. Cuando se producen las crisis, la ausencia de una planificación coordinada provoca respuestas estatales tardías e ineficaces que empeoran los resultados."
 ALG_olympic_preparation: "Programa de Preparación Olímpica"
 ALG_olympic_preparation_desc: "Argelia está invirtiendo fuertemente en los preparativos para albergar los Juegos Olímpicos, construyendo infraestructura deportiva de clase mundial y lanzando programas nacionales de desarrollo atlético."
 algerian_empowered_sharia_courts: "Tribunales de la Sharía empoderados"
 algerian_empowered_sharia_courts_desc: "Se ha ampliado la jurisdicción de los tribunales islámicos, otorgando a las autoridades religiosas una mayor influencia sobre los asuntos civiles y familiares y desplazando el marco legal de Argelia hacia la Sharía."
 algerian_gulen_movement: "Movimiento inspirado en Gülen"
 algerian_gulen_movement_desc: "Una red inspirada en el movimiento de Gülen se ha integrado en la educación y la sociedad civil argelinas, promoviendo un enfoque islámico modernista y construyendo una influencia significativa en las instituciones del Estado."
 algerian_scientific_ventures: "Proyectos científicos argelinos"
 algerian_scientific_ventures_desc: "Una ola de proyectos científicos conjuntos con socios extranjeros está impulsando un renacimiento en la investigación argelina, obteniendo reconocimiento internacional nuevos proyectos en energías renovables, informática y ciencia de materiales."
 hoggar_nuclear_facility_idea: "Instalación nuclear de Hoggar"
 ALG_2014_oil_crash_idea_desc: "El colapso de los precios del petróleo de 2014 devastó los ingresos por hidrocarburos de Argelia, exponiendo la fragilidad de su modelo económico dependiente de los recursos y forzando dolorosos recortes en el gasto público."
 ALG_AU_pressure_idea_desc: "La Unión Africana está ejerciendo presión diplomática sobre Argelia debido a un asunto regional, lo que limita sus opciones de política exterior y complica sus relaciones con los Estados vecinos."
 ALG_black_market_desc: "Un próspero mercado negro se ha desarrollado a la sombra del Estado, socavando las estadísticas comerciales oficiales, privando al gobierno de ingresos fiscales y alimentando a las redes del crimen organizado."
 ALG_clean_government_desc: "Una nueva generación de funcionarios tecnócratas ha aportado una mayor transparencia y rendición de cuentas al gobierno. La corrupción disminuye y la confianza pública en las instituciones del Estado se recupera lentamente."
 ALG_decline_of_tourism_desc: "El sector turístico de Argelia sufre un grave declive. Las preocupaciones de seguridad, la deficiente infraestructura y un régimen de visados difícil han hecho que el país no sea atractivo para los visitantes extranjeros, lo que supone un duro coste para la economía."
 ALG_destroyed_agriculture_desc: "El sector agrícola de Argelia ha quedado devastado por el conflicto y el abandono. Las tierras de cultivo permanecen en barbecho, las comunidades rurales han sido desplazadas y la dependencia de la importación de alimentos ha aumentado drásticamente."
 ALG_election_time_idea_desc: "Una campaña electoral está en marcha, dominando la agenda política y generando tanto oportunidades como inestabilidad a medida que las facciones competidoras movilizan a sus bases."
 ALG_emergency_budget_desc: "El gobierno ha activado disposiciones presupuestarias de emergencia, recortando el gasto no esencial y redirigiendo recursos para hacer frente a una aguda crisis económica o de seguridad."
 ALG_idea_joint_military_arab_desc: "Argelia ha entrado en un marco militar conjunto con socios árabes, permitiendo una planificación de defensa coordinada, inteligencia compartida y ejercicios de entrenamiento combinados en toda la región."
 ALG_insurgency_unleashed_desc: "Argelia ha cultivado deliberadamente redes insurgentes en un Estado vecino, utilizando proxies irregulares para proyectar poder y desestabilizar a sus rivales sin un compromiso militar directo."
 ALG_national_dialogue_modifier_desc: "Un proceso de diálogo nacional ha reunido al gobierno y a la oposición, creando un espacio poco común para la negociación política y reduciendo el riesgo inmediato de confrontación."
 ALG_political_repression_desc: "El Estado ejerce una represión política sistemática, arrestando a activistas, censurando a los medios de comunicación y utilizando a los servicios de seguridad para silenciar la disidencia y mantener el control."
 ALG_repression_modifier_desc: "Una ola de represión ha barrido la esfera política de Argelia. Figuras de la oposición están siendo detenidas, los medios de comunicación son silenciados y las manifestaciones públicas son dispersadas por la fuerza."
 ALG_surveillance_state_modifier_desc: "Argelia ha construido una sofisticada infraestructura de vigilancia interna, monitoreando las comunicaciones y rastreando las actividades de los opositores políticos y los actores de la sociedad civil."
 ALG_transparent_budget_desc: "Argelia ha introducido informes presupuestarios transparentes, publicando desgloses detallados del gasto público y haciendo accesibles las cuentas del gobierno al escrutinio independiente por primera vez."
 algeria_cultural_rebirth_desc: "Una poderosa ola de resurgimiento cultural nacionalista recorre Argelia, elevando el patrimonio e historia nativos mientras margina las influencias culturales extranjeras."
 algeria_emerging_youth_desc: "Emerge una generación de jóvenes argelinos políticamente comprometidos, que presionan con creciente firmeza a favor de reformas democráticas y oportunidades económicas."
 algeria_nationalist_youth_desc: "El movimiento juvenil de Argelia ha dado un giro marcadamente nacionalista, exigiendo una política exterior más firme y el fin de lo que consideran compromisos de la vieja guardia con intereses extranjeros."
 hoggar_nuclear_facility_idea_desc: "En lo profundo de las montañas de Ahaggar, se ha establecido una instalación de investigación nuclear en un lugar remoto. Su existencia actúa como un poderoso elemento de disuasión contra el aventurismo extranjero."
 idea_alg_empowered_parliament_desc: "Se ha concedido al parlamento de Argelia una auténtica autoridad legislativa. La cámara ostenta ahora un poder real sobre el presupuesto, la legislación y la rendición de cuentas de los ministros."
 idea_algerian_oligarchy_arrests_desc: "El arresto de oligarcas clave ha sacudido a la élite empresarial de Argelia. Aunque es popular entre el público, la represión ha creado una incertidumbre que está paralizando la inversión privada."
 ALG_flavor_event.6.t: "Crisis de refugiados"
 ALG_flavor_event.6.d: "Oleadas de refugiados cruzan nuestras fronteras huyendo del conflicto y de la inestabilidad de los países vecinos. Nuestra infraestructura se encuentra sobrecargada y nuestro pueblo está dividido sobre cómo responder."
 ALG_flavor_event.6.a: "Debemos absorberlos."
 ALG_flavor_event.7.t: "Crisis del tráfico de drogas"
 ALG_flavor_event.7.d: "Redes criminales organizadas han convertido a Argelia en un importante corredor de tránsito de estupefacientes. El tráfico de drogas corrompe a las instituciones locales y aviva la violencia en las regiones fronterizas."
 ALG_flavor_event.7.a: "Reprimir con dureza a los traficantes."
 fra_colonial.1.t: "La sombra del pasado"
 fra_colonial.1.d: "Argel ha denunciado formalmente el legado colonial de Francia en Argelia, reabriendo viejas heridas e inflamando la opinión pública a ambos lados del Mediterráneo. Nuestro parlamento se encuentra dividido: algunos exigen que nos mantengamos firmes en nuestro registro histórico, mientras que otros ven una oportunidad para la reconciliación."
 fra_colonial.1.a: "Defender nuestro registro histórico."
 fra_colonial.1.b: "Ofrecer un gesto de reconciliación."
 algerian_event.51.d: "Contra todo pronóstico, el programa espacial de Argelia ha logrado lo extraordinario: nuestra nave espacial ha alunizado con éxito en la Luna. Este triunfo de la ingeniería y de la voluntad nacional ha electrizado al pueblo argelino y ha colocado nuestra bandera entre las estrellas."
 ALG_aouchiche_desc: "Youcef Aouchiche es un reformista liberal y líder del Front des Forces Socialistes. Firme crítico del sistema gobernante, basó su campaña en la reforma democrática, las libertades civiles y la modernización económica."
 ALG_hassani_desc: "Abdelali Hassani Cherif es el líder del Movimiento de la Sociedad por la Paz, el principal partido islamista de Argelia. Aboga por un islam político moderado alineado con las normas democráticas y la reconciliación nacional."
 algeria_elections.a: "Así se ha decidido."
 alg_military_rule_option: "Apoyar la decisión del estamento militar."
 AlgeriaPoliticalEvents.1.t: "El realineamiento político de Argelia"
 AlgeriaPoliticalEvents.1.d: "Con la Década Negra llegando a su fin, Argelia se enfrenta a una elección crucial sobre su futura orientación política. Una asociación occidental, la no alineación o lazos más estrechos con el Este; cada camino conlleva profundas consecuencias para la identidad y la estabilidad del país."
 AlgeriaPoliticalEvents.1.a: "Abrir el debate nacional."
 AlgeriaPoliticalEvents.20.t: "Brecha ideológica en el gobierno"
 AlgeriaPoliticalEvents.20.d: "Con el conflicto llegando a su fin, aumenta la presión dentro del gobierno para definir el futuro sistema político de Argelia. Los partidarios de la línea dura exigen el dominio militar, los moderados presionan por la reconciliación y la reforma, mientras que las facciones islamistas piden elecciones libres."
 AlgeriaPoliticalEvents.20.a: "Empoderar al estamento militar."
 AlgeriaPoliticalEvents.20.b: "Presionar por la reforma y la reconciliación."
 AlgeriaPoliticalEvents.20.c: "Negociar con los islamistas."
 Algeria.8.t: "Argelia solicita protección"
 Algeria.8.d: "El gobierno argelino ha solicitado formalmente protección estadounidense o garantías de seguridad, citando la creciente inestabilidad regional. Washington debe decidir ahora si extiende su paraguas estratégico."
 Algeria.8.a: "Aceptamos la petición."
 Algeria.8.b: "No podemos comprometernos con esto."
 ALG_alignments: "Alineación de la política exterior"
 KBY_alg_modifier: "Modificadores del Estado de Cabilia"
 ALG_algiers_metro: "Corredor del metro de Argel"
 ALG_diplomatic_outreach_west: "Acercamiento diplomático a Occidente"
 ALG_diplomatic_outreach_west_desc: "La relación de Argelia con Washington y sus aliados europeos ha estado definida históricamente por la sospecha mutua. Una iniciativa diplomática sostenida podría sentar las bases para unos lazos económicos y de seguridad más estrechos con el mundo occidental."
 ALG_diplomatic_outreach_china: "Acercamiento diplomático a China"
 ALG_diplomatic_outreach_china_desc: "Pekín ha estado expandiendo constantemente su presencia en todo el continente africano. Profundizar los lazos con China podría desbloquear importantes inversiones en infraestructuras y abrir nuevos mercados, aunque puede complicar las relaciones con los socios occidentales."
 monitor_kabyle_unrest_desc: "Las montañas de Cabilia han sido un foco de tensión persistente. Los servicios de seguridad deben mantener una estrecha vigilancia sobre las actividades de la resistencia en la región para anticiparse a cualquier escalada."
 kabyle_resistance_tooltip: "La actividad de la resistencia en Cabilia sigue siendo elevada."
 ALG_boost_reformists_desc: "Dentro de la opaca estructura política de Argelia, una facción de tecnócratas y modernizadores ha estado presionando a favor de una reforma genuina. Proporcionarles cobertura política y recursos podría inclinar el equilibrio interno de poder hacia la apertura."
 ALG_boost_old_guard_desc: "La red establecida de oficiales militares y veteranos del FLN que construyeron el Estado posterior a la independencia ve con creciente ansiedad el ritmo del cambio. Reafirmar su posición y prerrogativas apuntalará la estabilidad, pero afianzará el statu quo."
 ALG_rally_students_desc: "Los campus universitarios han sido históricamente el motor del cambio político en Argelia. Organizar a las asociaciones de estudiantes detrás de la agenda reformista puede generar presión desde abajo y transformar el discurso público."
 ALG_mobilize_veterans_desc: "Los veteranos de la guerra de independencia y de la Década Negra gozan de una enorme autoridad moral en la sociedad argelina. Reunirlos en apoyo del orden existente otorga legitimidad a la postura del Estado en la contienda política actual."
 ALG_bribe_elites_desc: "Gran parte de la estructura de poder de Argelia opera mediante redes informales de clientelismo y favores. Distribuir contratos, nombramientos y beneficios financieros a figuras clave puede consolidar la lealtad, aunque profundiza la corrupción que ya corroe al Estado."
 ALG_seek_compromise_desc: "Con ambas partes del debate interno atrincheradas, un esfuerzo de mediación neutral puede ser la única forma de evitar que un callejón sin salida desemboque en una confrontación abierta. Un compromiso no satisfará a nadie por completo, pero puede evitar lo peor."
 ALG_media_campaign_reform_desc: "Los medios de comunicación bajo control estatal o afines al régimen pueden ser dirigidos para construir una narrativa en torno a la necesidad de una renovación política. Moldear la opinión pública a favor de la reforma debilita la posición de la vieja guardia."
 ALG_security_crackdown_desc: "El aparato de seguridad puede ser dirigido para reprimir las protestas, los medios independientes y los grupos de la sociedad civil que están alimentando al movimiento de reforma. Esto hará ganar tiempo, pero acumulará problemas mayores para el futuro."
 ALG_world_tension_security_desc: "La creciente inestabilidad en toda la región está proporcionando al estamento militar nuevos argumentos para mantener la política firmemente bajo su control. Capitalizar este clima puede consolidar la posición de la vieja guardia."
 ALG_world_tension_high_security_desc: "Con los conflictos regionales extendiéndose hacia las fronteras de Argelia, el ejército presiona para obtener poderes de emergencia que marginen eficazmente a los defensores civiles de la reforma. La crisis sirve de tapadera, pero suspender la competencia política conlleva riesgos a largo plazo."
 ALG_path_crackdown_momentum_desc: "La represión está mostrando resultados. Mantener el impulso mediante operaciones de seguridad adicionales y presión política profundizará el control de la vieja guardia sobre el Estado, pero cada paso hace que la reversión sea más difícil."
 ALG_path_reconciliation_momentum_desc: "El proceso de reforma está ganando tracción. Seguir adelante con medidas adicionales de fomento de la confianza y aperturas políticas puede llevar la agenda de reconciliación más allá del punto de no retorno."
 ALG_oil_patronage_desc: "Los ingresos imprevistos por hidrocarburos de Argelia se han utilizado durante mucho tiempo para comprar la paz social. Redirigir una parte de los ingresos del petróleo hacia un clientelismo focalizado puede asegurar la lealtad de distritos electorales clave en la contienda política actual."
 ALG_economic_reforms_desc: "La economía de Argelia, dominada por el Estado, es profundamente ineficiente. Un paquete creíble de reformas económicas, que abra espacio a la empresa privada y reduzca los obstáculos burocráticos, podría inclinar el sentimiento popular hacia el bando reformista."
 ALG_ter_oboronaup_start_desc: "Con el país en guerra, la Guardia Nacional pide la formación de unidades de defensa territorial reclutadas localmente para asegurar las zonas de retaguardia y liberar a las formaciones del ejército regular para operaciones en primera línea."
 ALG_internalup_start_desc: "La situación requiere el despliegue de tropas dedicadas a la seguridad interna para mantener el orden detrás de las líneas del frente, proteger la infraestructura crítica y evitar que el enemigo explote la inestabilidad en la retaguardia."
 ALG_casablanca_mission: "Buscar el Acuerdo de Casablanca"
 ALG_eliminate_GIA: "Eliminar al GIA"
 ALG_eliminate_GIA_desc: "El Grupo Islámico Armado representó en su día la cara más brutal de la insurgencia. Con sus redes fracturadas y el apoyo público colapsado, el Estado se dispone ahora a desmantelar los últimos remanentes de la organización y a restaurar el orden en todo el país."
 ALG_reintegration_programs: "Programas de reintegración"
 ALG_reintegration_programs_desc: "Años de violencia han dejado a miles de antiguos combatientes y simpatizantes dispersos por la sociedad argelina. A través de programas de reintegración cuidadosamente supervisados, el gobierno ofrecerá una vía de retorno a la vida civil para aquellos dispuestos a abandonar la insurgencia."
 ALG_strengthen_DRS: "Fortalecer el DRS"
 ALG_strengthen_DRS_desc: "El Département du Renseignement et de la Sécurité ha desempeñado un papel decisivo en la lucha contra las redes extremistas durante la Década Negra. El fortalecimiento de las capacidades de nuestros servicios de inteligencia garantizará que Argelia nunca vuelva a caer en semejante caos."
 ALG_coalition_economic_program_tt: "La coalición presidencial pone en marcha un programa coordinado de desarrollo económico."
 ALG_governmental_transparency_tt: "El gobierno se compromete con las reformas de transparencia, debilitando la corrupción atrincherada pero enfureciendo a los intereses militares."
 ALG_ethnic_satisfaction_critical: "§RHostilidad abierta§!"
 ALG_ethnic_satisfaction_low: "§RProfundo resentimiento§!"
 ALG_ethnic_satisfaction_moderate: "§YTensiones latentes§!"
 ALG_ethnic_satisfaction_high: "§GRelativamente contentos§!"
 ALG_deep_state_map_name: "Argel - Centro del poder"
 ALG_hybrid_military_governance: "Gobernanza militar híbrida"
 ALG_hybrid_military_governance_desc: "Argelia opera bajo un sistema híbrido en el que el estamento militar mantiene una influencia política significativa mientras las estructuras civiles siguen vigentes."
 ALG_civil_war_brewing_added_tt: "§R£generic_warning ¡RIESGO DE GUERRA CIVIL!§!\nLa resistencia fallida al golpe de Estado ha desestabilizado Argelia."
 ALG_accepted_foreign_intervention: "Aceptó asistencia contra el Estado Profundo"
 ALG_military_coup_opinion: "Golpe militar en Argelia"
 ALG_fulfilled_election_promise: "Restauró la democracia como prometió"
 ALG_broke_election_promise: "Rompió la promesa de celebrar elecciones"
 ALG_mod_name_mediene: "Mohamed Mediène"
 ALG_moi_name_loyalist: "Tecnócrata leal"
 minister_type_technocrat: "Tecnócrata"
 minister_type_loyalist: "Leal"
 minister_type_reformist: "Reformista"
 minister_type_independent: "Independiente"
 minister_type_military: "Militar"
 minister_type_civilian: "Civil"
 minister_type_none: "Ninguno"
 loyalty_very_low: "§RMuy baja§!"
 loyalty_low: "§RBaja§!"
