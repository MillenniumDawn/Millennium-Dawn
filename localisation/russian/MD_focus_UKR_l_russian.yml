 ukr_modernize_sov_equipment_old_gear_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_old_gear_offer_for_tooltip\n\n\n\n\n\n\n\n\n§WНа наших складах всё ещё хранятся разведывательные машины §YБРДМ-1§!, пушки §YМ-46§! и гаубицы §YМ-30§! военных времён, а также стрелковое оружие, которым наша армия пользоваться не будет. После 2003 года §Y[USA.GetNameWithFlag]§! закупают такое оружие для новых армий Ирака и Афганистана, а §Y[SUD.GetNameWithFlag]§! и §Y[ETH.GetNameWithFlag]§! берут всё дешёвое.§!"
