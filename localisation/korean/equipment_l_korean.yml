 CAN_infantry_weapons_1: "C1A2"
 CAN_infantry_weapons_1_desc: "C1A2는 캐나다 아스널 리미티드가 C1A1에 가한 대대적인 개조형입니다. 소총의 신뢰성과 야전 수리 용이성을 높이기 위해 여러 개량이 이루어졌습니다."
 CAN_infantry_weapons_2: "C7"
 CAN_infantry_weapons_2_desc: "A licensed version of the Colt M16 platform with several Canadian requested features which resulted in a rifle similar to a M16A2 but with M16A1 rear sights and the capability for fully automatic fire."
 CAN_infantry_weapons_3: "C7A1"
 CAN_infantry_weapons_3_desc: "C7A1은 C7에 사용되던 기계식 조준기/운반 손잡이 일체형 부품을 광학 장비 장착용 개량 위버 레일로 교체했습니다. 이 거치대에는 기존의 기계식 조준기 또는 ELCAN C79 3.4x28 광학 조준경을 사용할 수 있습니다."
 CAN_infantry_weapons_4: "C7A2"
 CAN_infantry_weapons_4_desc: "아프가니스탄에 파병된 캐나다는 디마코 및 캐나다군과 함께 당면한 작전 상황에 더 적합하도록 C7A1을 개량했습니다. 그 결과물인 C7A2는 4단 신축식 개머리판과 전방 가늠자 받침에 고정되는 3면 레일 TRIAD를 갖추어 부속품을 장착할 수 있습니다. 선택 레버, 탄창 분리 버튼, 장전 손잡이 걸쇠는 양손잡이용으로 바뀌었습니다."
 CAN_infantry_weapons_5: "C8A3"
 CAN_infantry_weapons_5_desc: "C8A3는 C8 카빈의 개량형으로, 냉간 단조 총열과 플랫탑 상부 리시버를 갖추었으며 녹색 총기 부품, 양손잡이용 장전 손잡이 걸쇠, 탄창 분리 버튼, 선택 레버 등 C7A2에 적용된 모든 중기 개량 사항을 포함합니다. TRIAD I 레일도 장착되어 있습니다."
 CAN_infantry_weapons_6: "C8A4"
 CAN_infantry_weapons_6_desc: "C8A4는 콜트 MRR을 기반으로 하며, 소음기, 일체형 상부 레일, 신형 광학 장비, 신형 방아쇠 장치 등 기존 C7 및 C8 소총에서 확인된 여러 개량 사항을 포함합니다."
 CAN_infantry_weapons_7: "CMAR"
 CAN_infantry_weapons_7_desc: "캐나다 모듈형 돌격소총은 C8A4에 추가 개량을 가한 소총으로, 가변 배율 광학 장비, 더 나은 인체공학, 운용자에 맞춘 개조 능력 향상에 중점을 두었습니다."
 CAN_util_vehicle_8: "AOPIMU"
 CAN_transport_helicopter_1: "벨 CH-135 트윈 휴이"
 CAN_transport_helicopter_1_desc: "벨 CH-135 이로쿼이(별칭 \\"트윈 휴이\\")는 터보샤프트 엔진 2기로 구동되며 주 회전익과 꼬리 회전익이 각각 2엽인 군용 다목적 헬리콥터입니다. 다수 생산된 휴이 계열의 개량형으로, 1968년 캐나다군의 다목적 헬리콥터 요구 사항을 충족하기 위해 벨 헬리콥터가 개발했습니다."
 CAN_transport_helicopter_1_short: "CH-135 트윈 휴이"
 CAN_transport_helicopter_2: "벨 CH-146 그리폰"
 CAN_transport_helicopter_2_desc: "벨 CH-146 그리폰은 벨 헬리콥터가 제작한 4엽 회전익 쌍발 엔진 다목적 헬리콥터입니다."
