 DOCTRINE_TRACK_SUPPORT: "Okręty Wsparcia"
 MARINE_SPECIAL_FORCES: "Szybki desant morski"
 MARINE_SPECIAL_FORCES_DESC: "Doktryna ta przygotowuje lekkie oddziały piechoty morskiej do przeprowadzania szybkich desantów i forsowania rzek. Koncepcje szybkiego natarcia kładą nacisk na szybkość, mobilność oraz opanowanie brzegu, zanim przeciwnik zdoła zareagować."
 MARINE_MASSIVE_FORCES: "Skoncentrowane siły desantowe"
 MARINE_SPECIAL_FORCES_MASSIVE_DESC: "Doktryna ta organizuje lekkie i zmotoryzowane jednostki piechoty morskiej w duże formacje, przeznaczone do długotrwałych, zakrojonych na szeroką skalę operacji desantowych. Koncepcje masowego desantu kładą nacisk na zdolność do inwazji, przepustowość szkoleniową oraz liczebność sił lądowych."
 RANGER_FORCES_DOCTRINES: "Leśni Komandosi"
 RANGER_FORCES_DOCTRINES_DESC: "Doktryna ta szkoli rangersów do walki w gęstym lesie, wykorzystując osłonę drzew do przeprowadzania zasadzek, błyskawicznego wycofywania się i wykrwawiania przeciwnika, który nie jest w stanie ich dostrzec. Koncepcje działań leśnych kładą nacisk na maskowanie, swobodę poruszania się poza drogami oraz uporczywą obronę z przygotowanych pozycji."
 SUBDOCTRINE_OPERATIONS_CENTRAL_COMMAND: "Dowodzenie Scentralizowane"
 SUBDOCTRINE_OPERATIONS_CENTRAL_COMMAND_DESC: "Ta doktryna umieszcza operacje lotnicze pod jednolitym centralnym dowództwem, gdzie planowanie, priorytety i wykonanie kierowane są przez jedną władzę. Zapewnia to spójny zamiar operacyjny i skoordynowane wykorzystanie sił powietrznych w teatrze działań."
 SUBDOCTRINE_OPERATIONS_DETACHED_COMMAND: "Dowodzenie Rozproszone"
 SUBDOCTRINE_OPERATIONS_DETACHED_COMMAND_DESC: "Ta doktryna przydziela operacje lotnicze półniezależnym dowództwom, nadając delegowaną władzę nad planowaniem i realizacją w określonych granicach operacyjnych. Dowodzenie rozproszone umożliwia lokalne podejmowanie decyzji przy zachowaniu zgodności z ogólnymi celami strategicznymi."
 SUBDOCTRINE_OPERATIONS_NAVAL_AIR: "Dowodzenie Morskie"
 SUBDOCTRINE_OPERATIONS_NAVAL_AIR_DESC: "Ta doktryna integruje operacje lotnicze w strukturach dowodzenia morskiego, synchronizując planowanie i wykonanie działań powietrznych z celami marynarki. Zapewnia skoordynowane wykorzystanie sił powietrznych wspierających operację floty i kontrolę nad morzem."
 SUBDOCTRINE_DESIGN_MULTIROLE: "Samoloty Wielozadaniowe"
 SUBDOCTRINE_DESIGN_MULTIROLE_DESC: "Ta doktryna kładzie nacisk na rozwój samolotów zdolnych do wykonania różnych profili misji w ramach jednej platformy. Koncepcje samolotów wielozadaniowych priorytetowo traktują adaptacyjność i zintegrowane systemy do wsparcia różnorodnych wymagań operacyjnych."
 SUBDOCTRINE_DESIGN_DEDICATED: "Samoloty Dedykowane"
 SUBDOCTRINE_DESIGN_DEDICATED_DESC: "Ta doktryna koncentruje się na rozwoju samolotów zoptymalizowanych pod konkretną rolę operacyjną. Koncepcje samolotów dedykowanych kładą nacisk na specjalizację i dostosowaną wydajność, aby spełniać jasno określone wymagania misji w obszarze powietrznym."
 SUBDOCTRINE_DESIGN_HEAVY: "Samoloty Ciężkie"
 SUBDOCTRINE_DESIGN_HEAVY_DESC: "Ta doktryna kładzie nacisk na rozwój dużych i wytrzymałych konstrukcji samolotów, skoncentrowanych na długotrwałości, ładowności i utrzymaniu ciągłej obecności operacyjnej. Samoloty ciężkie priorytetowo traktują wytrzymałość konstrukcji i zintegrowane systemy, aby wspierać wymagające operacje powietrzne."
 SUBDOCTRINE_DESIGN_DRONE: "Drony"
 SUBDOCTRINE_HEAVY_STRATEGIC_BOMBER: "Bombowce Strategiczne"
 SUBDOCTRINE_HEAVY_STRATEGIC_BOMBER_DESC: "Ta doktryna koncentruje się na rozwoju samolotów przeznaczonych do długodystansowych operacji uderzeniowych o charakterze strategicznym. Bombowce strategiczne są projektowane tak, aby dostarczać trwałą siłę powietrzną na dużych odległościach, wspierając nadrzędne cele wojskowe."
 SUBDOCTRINE_HEAVY_NAVAL_BOMBERS: "Bombowce Morskie"
 SUBDOCTRINE_HEAVY_NAVAL_BOMBERS_DESC: "Ta doktryna kładzie nacisk na rozwój samolotów przeznaczonych do działań w ścisłej współpracy z siłami morskimi. Konstrukcje bombowców morskich koncentrują się na projekcji siły powietrznej nad obszarami morskimi, wspierając operację floty i realizację celów kontroli morza."
 SUBDOCTRINE_HEAVY_GUNSHIPS: "Ciężki Śmigłowiec Bojowy"
 SUBDOCTRINE_HEAVY_GUNSHIPS_DESC: "Ta doktryna koncentruje się na rozwoju silnie uzbrojonych samolotów, zaprojektowanych do zapewnienia trwałej siły ogniowej w powietrzu. Konstrukcje ciężkich śmigłowców bojowych kładą nacisk na zintegrowane systemy uzbrojenia oraz długotrwałą obecność, wspierając operacje powietrzne w obszarach spornych."
 SUBDOCTRINE_MULTIROLE_MIXED: "Zróżnicowane Samoloty Wielozadaniowe"
 SUBDOCTRINE_MULTIROLE_MIXED_DESC: "Ta doktryna promuje zrównoważone podejście do rozwoju samolotów wielozadaniowych poprzez łączenie różnych filozofii projektowanych w ramach jednej siły powietrznej. Koncepcje zróżnicowanych samolotów wielozadaniowych kładą nacisk na elastyczność w składzie sił, aby sprostać szerokiemu zakresowi wymagań operacyjnych."
 SUBDOCTRINE_MULTIROLE_STRIKE: "Samoloty Uderzeniowe"
 SUBDOCTRINE_MULTIROLE_STRIKE_DESC: "Ta doktryna kładzie nacisk na rozwój samolotów wielozadaniowych ukierunkowanych na ofensywne operacje powietrzne. Konstrukcje skoncentrowane na uderzeniach priorytetowo traktują skuteczne dostarczanie sił powietrznej przeciw wyznaczonym celom, wspierając szersze cele operacyjne."
 SUBDOCTRINE_MULTIROLE_OPERATIONS: "Operacje Wielozadaniowe"
 SUBDOCTRINE_MULTIROLE_OPERATIONS_DESC: "Ta doktryna organizuje operacje powietrzne wokół samolotów wielozadaniowych zdolnych do realizacji różnorodnych zadań. Operacje wielozadaniowe kładą nacisk na skoordynowane wykorzystanie elastycznych platform powietrznych w celu wspierania szerokiego zakresu celów operacyjnych."
 SUBDOCTRINE_STRIKE_CAS: "Samoloty Wsparcia Bezpośredniego (CAS)"
 SUBDOCTRINE_STRIKE_CAS_DESC: "Ta doktryna koncentruje się na rozwoju samolotów przeznaczonych do wsparcia operacji lądowych poprzez bezpośrednie działania powietrzne. Samoloty wsparcia bezpośredniego (CAS) są organizowane tak, aby zapewnić szybkie i trwałe wsparcie powietrzne w ścisłej koordynacji z siłami lądowymi."
 SUBDOCTRINE_STRIKE_NAVAL: "Lotnictwo Uderzeniowe Morskie"
 SUBDOCTRINE_STRIKE_NAVAL_DESC: "Ta doktryna koncentruje się na rozwoju samolotów uderzeniowych przeznaczonych do wspierania celów morskich. Koncepcje lotnictwa uderzeniowego morskiego kładą nacisk na integrację sił powietrznych z operacjami floty w celu projekcji sił na obszarach morskich."
 SUBDOCTRINE_STRIKE_MUNITIONS: "Amunicja Uderzeniowa"
 SUBDOCTRINE_STRIKE_MUNITIONS_DESC: "Ta doktryna kładzie nacisk na rozwój i integrację amunicji przeznaczonej do precyzyjnych operacji uderzeniowych. Koncepcje amunicji uderzeniowej koncentrują się na zwiększaniu skutecznego wykorzystania siły ogniowej dostarczanej z powietrza w celu wspierania celów operacyjnych."
 SUBDOCTRINE_FIGHTER_LIGHT: "Lekkie Myśliwce"
 SUBDOCTRINE_FIGHTER_LIGHT_DESC: "Ta doktryna koncentruje się na rozwoju lekkich myśliwców zoptymalizowanych pod kątem zwrotności i szybkiego reagowania w operacjach powietrznych. Konstrukcje lekkich myśliwców kładą nacisk na efektywną wydajność i elastyczne wykorzystanie w ramach szerszego systemu walki powietrznej."
 SUBDOCTRINE_FIGHTER_AIR_SUP: "Panowanie w powietrzu"
 SUBDOCTRINE_FIGHTER_AIR_SUP_DESC: "Doktryna ta koncentruje się na rozwoju i wykorzystaniu samolotów myśliwskich w celu uzyskania oraz utrzymania panowania w powietrzu. Koncepcje dotyczące panowania w powietrzu kładą nacisk na skoordynowane działania walki powietrznej, mające na celu zapewnienie swobody operacyjnej w obrębie teatru działań."
 SUBDOCTRINE_STRUCTURE_CENTRAL_COMMAND: "Dowództwo Centralne"
 SUBDOCTRINE_STRUCTURE_CENTRAL_COMMAND_DESC: "Doktryna ta organizuje siły lądowe w ramach jednolitego, centralnego dowodzenia, w którym planowanie, koordynacja i realizacja działań są kierowane przez jeden organ. Struktury centralnego dowodzenia zapewniają spójny zamysł operacyjny oraz zsynchronizowane użycie sił lądowych na całym obszarze działań."
 SUBDOCTRINE_STRUCTURE_DECENTRAL_COMMAND: "Zdecentralizowane dowodzenie"
 SUBDOCTRINE_STRUCTURE_DECENTRAL_COMMAND_DESC: "Doktryna ta rozdziela uprawnienia dowódcze pomiędzy różne szczeble wojsk lądowych, umożliwiając podległym formacjom planowanie i prowadzenie działań w ramach wyznaczonych celów. Zdecentralizowane struktury dowodzenia kładą nacisk na inicjatywę oraz sprawne podejmowanie decyzji w całej przestrzeni walki."
 SUBDOCTRINE_STRUCTURE_BCT: "Batalionowe Zespoły Bojowe"
 SUBDOCTRINE_STRUCTURE_BCT_DESC: "Doktryna ta organizuje wojska lądowe w oparciu o samodzielne formacje szczebla batalionowego, przeznaczone do prowadzenia działań połączonych rodzajów wojsk. Batalionowe grupy bojowe integrują elementy manewrowe, wsparcia ogniowego oraz zabezpieczenia logistycznego, co pozwala im na skuteczne działanie w wyznaczonych strefach operacyjnych."
 SUBDOCTRINE_OPERATION_DECENTRALIZED_SUPPLY: "Zdecentralizowane dostawy"
 SUBDOCTRINE_OPERATION_DECENTRALIZED_SUPPLY_DESC: "Doktryna ta organizuje utrzymanie sił lądowych poprzez rozproszone struktury logistyczne, które wspierają jednostki na wielu obszarach operacyjnych. Zdecentralizowane koncepcje zaopatrzenia kładą nacisk na lokalną kontrolę zasobów w celu utrzymania tempa i ciągłości działań operacyjnych."
 SUBDOCTRINE_OPERATION_CENTRALIZED_SUPPLY: "Scentralizowane zaopatrzenie"
 SUBDOCTRINE_OPERATION_CENTRALIZED_SUPPLY_DESC: "Doktryna ta organizuje utrzymanie wojsk lądowych w ramach scentralizowanych struktur logistycznych, które koordynują dystrybucję zaopatrzenia na całym obszarze operacyjnym. Koncepcje scentralizowanego zaopatrzenia kładą nacisk na ujednolicone planowanie i kontrolę, aby zapewnić spójne wsparcie operacji lądowych."
 SUBDOCTRINE_OPERATION_SCAVENGING_SUPPLY: "Zapas ze zbiórki"
 SUBDOCTRINE_OPERATION_SCAVENGING_SUPPLY_DESC: "Ta doktryna opiera się na wspieraniu sił lądowych poprzez wykorzystanie lokalnie dostępnych zasobów w środowisku operacyjnym. Koncepcje pozyskiwania zapasów koncentrują się na adaptacyjnym pozyskiwaniu i integracji zdobytego lub improwizowanego sprzętu w celu wsparcia bieżących operacji lądowych."
 SUBDOCTRINE_OPERATION_ADVERSE: "Działania w warunkach niekorzystnych"
 SUBDOCTRINE_OPERATION_ADVERSE_DESC: "Doktryna ta przygotowuje wojska lądowe do prowadzenia operacji w warunkach wrogich i zdegradowanych. Operacje w warunkach niekorzystnych kładą nacisk na zdolność adaptacji, odporność i trwałą skuteczność w trudnych warunkach operacyjnych."
 SUBDOCTRINE_OPERATION_VOLUNTEER: "Organizacja działań wolontariackich"
 SUBDOCTRINE_OPERATION_VOLUNTEER_DESC: "Doktryna ta organizuje działania wojsk lądowych wokół rozmieszczania wybranych formacji poza granicami kraju w celu wsparcia celów zewnętrznych. Działania te, realizowane przez ochotników, kładą nacisk na interwencję o ograniczonej skali, autonomię operacyjną oraz zgodność z szerszymi zamierzeniami strategicznymi."
 SUBDOCTRINE_OPERATION_DEEP_BATTLE: "Operacje głębokiego uderzenia"
 SUBDOCTRINE_OPERATION_DEEP_BATTLE_DESC: "Doktryna ta strukturyzuje operacje lądowe, aby umożliwić jednoczesne zaangażowanie sił przeciwnika na wielu głębokościach pola bitwy. Koncepcje bitew głębokich kładą nacisk na skoordynowane działania mające na celu zakłócenie dowodzenia, utrzymania i manewrów poza bezpośrednią linią frontu."
 SUBDOCTRINE_OPERATION_THUNDER_RUN: "Operacja Thunder Run"
 SUBDOCTRINE_OPERATION_THUNDER_RUN_DESC: "Doktryna ta opiera operacje lądowe na szybkich, skoncentrowanych uderzeniach, mających na celu osiągnięcie decydujących efektów poprzez szybkość i szok. Operacje typu „thunder run” kładą nacisk na pęd i skoncentrowane manewry, aby zakłócić środowisko operacyjne."
 SUBDOCTRINE_OPERATION_LIGHT_INFANTRY: "Działania lekkiej piechoty"
 SUBDOCTRINE_OPERATION_LIGHT_INFANTRY_DESC: "Doktryna ta organizuje operacje lądowe wokół wysoce mobilnych formacji piechoty, dostosowanych do zróżnicowanego terenu i warunków operacyjnych. Operacje lekkiej piechoty kładą nacisk na elastyczność, szybkie rozmieszczenie i ciągłą obecność na polu bitwy."
 SUBDOCTRINE_OPERATION_GUERRILLA: "Działania partyzanckie"
 SUBDOCTRINE_OPERATION_GUERRILLA_DESC: "Doktryna ta opiera operacje lądowe na nieregularnych i rozproszonych formacjach bojowych działających w spornych obszarach. Operacje partyzanckie kładą nacisk na mobilność, lokalną inicjatywę i stałą presję na kształtowanie pola bitwy na lądzie."
 SUBDOCTRINE_OPERATION_STATIC_DEFENSE: "Operacje obrony stacjonarnej"
 SUBDOCTRINE_OPERATION_STATIC_DEFENSE_DESC: "Doktryna ta organizuje obronne działania lądowe w oparciu o stałe pozycje i przygotowane systemy obronne. Działania w ramach obrony statycznej kładą nacisk na kontrolę terenu oraz zorganizowane użycie sił w celu utrzymania kluczowych obszarów."
 SUBDOCTRINE_OPERATION_ELASTIC_DEFENSE: "Operacje elastycznej obrony"
 SUBDOCTRINE_OPERATION_ELASTIC_DEFENSE_DESC: "Doktryna ta organizuje działania obronne poprzez kontrolowane przemieszczenia i wykorzystanie sił na dużej głębokości. Koncepcje elastycznej obrony kładą nacisk na kształtowanie pola walki przy jednoczesnym zachowaniu skuteczności bojowej na kolejnych poziomach obrony."
 SUBDOCTRINE_OPERATION_MOBILE_DEFENSE: "Operacje obrony mobilnej"
 SUBDOCTRINE_OPERATION_MOBILE_DEFENSE_DESC: "Doktryna ta opiera się na strukturach obronnych operacji lądowych, które opierają się na siłach manewrowych, zdolnych do dynamicznego reagowania na działania przeciwnika. Koncepcje obrony mobilnej kładą nacisk na elastyczność i skoordynowane kontrmanewry w obronnym polu walki."
 SUBDOCTRINE_OPERATION_INSURGENT: "Działania powstańcze"
 SUBDOCTRINE_OPERATION_INSURGENT_DESC: "Doktryna ta organizuje siły lądowe wokół nieregularnych działań wojennych prowadzonych przez zdecentralizowane i zintegrowane jednostki bojowe. Operacje powstańcze kładą nacisk na stałe zaangażowanie i kontrolę ludności, aby wpływać na środowisko operacyjne."
 SUBDOCTRINE_TECHNOLOGY_HIGH: "Armia wykorzystująca zaawansowane technologie"
 SUBDOCTRINE_TECHNOLOGY_HIGH_DESC: "Doktryna ta opiera siły lądowe na szeroko zakrojonej integracji zaawansowanych technologii w zakresie walki, dowodzenia i utrzymania. Koncepcje armii opartej na zaawansowanych technologiach kładą nacisk na przewagę technologiczną jako kluczowy element skuteczności operacyjnej."
 SUBDOCTRINE_TECHNOLOGY_COMMON: "Armia Technologii Wspólnych"
 SUBDOCTRINE_TECHNOLOGY_COMMON_DESC: "Doktryna ta organizuje siły lądowe wokół powszechnie dostępnych i znormalizowanych technologii wojskowych. Powszechne koncepcje technologiczne armii kładą nacisk na niezawodność, skalowalność i szeroką interoperacyjność między formacjami."
 SUBDOCTRINE_TECHNOLOGY_LOW: "Armia niskich technologii"
 SUBDOCTRINE_TECHNOLOGY_LOW_DESC: "Doktryna ta opiera siły lądowe na minimalnym wykorzystaniu zaawansowanych systemów technologicznych. Koncepcje armii low-tech kładą nacisk na podstawowe wyposażenie, prostotę i funkcjonalność operacyjną w ograniczonych warunkach technologicznych."
 SUBDOCTRINE_TRAINING_REDUCED: "Ograniczony trening"
 SUBDOCTRINE_TRAINING_REDUCED_DESC: "Doktryna ta ogranicza do minimum wymogi dotyczące formalnego szkolenia, aby przyspieszyć proces formowania i przerzutu sił. Koncepcje zakładające ograniczenie szkolenia kładą nacisk na podstawową gotowość operacyjną oraz szybką dostępność sił."
 SUBDOCTRINE_TRAINING_ADVANCED: "Szkolenie zaawansowane"
 SUBDOCTRINE_TRAINING_ADVANCED_DESC: "Doktryna ta kładzie nacisk na rozbudowane i ustrukturyzowane programy szkoleniowe, mające na celu wzmocnienie spójności jednostek i sprawności operacyjnej. Zaawansowane koncepcje szkoleniowe koncentrują się na przygotowaniu sił do złożonych i wymagających warunków operacyjnych."
 SUBDOCTRINE_TRAINING_SKILLS: "Szkoła Umiejętności"
 SUBDOCTRINE_TRAINING_SKILLS_DESC: "Doktryna ta organizuje szkolenie wokół systematycznego rozwijania specjalistycznych umiejętności wojskowych. Szkolenie ukierunkowane na umiejętności kładzie nacisk na kompetencje techniczne oraz biegłość w wykonywaniu zadań przypisanych do konkretnych ról w wojskach lądowych."
 SUBDOCTRINE_TRAINING_SURVIVAL: "Szkolenie przetrwania"
 SUBDOCTRINE_TRAINING_SURVIVA_DESC: "Doktryna ta kładzie nacisk na szkolenie ukierunkowane na wytrzymałość oraz zdolność przystosowania się do działania w trudnych i wrogich warunkach. Założenia szkolenia z zakresu przetrwania przygotowują siły do ​​kontynuowania działań w niesprzyjającym otoczeniu."
 SUBDOCTRINE_LEADERSHIP_OFFICER: "Szkolenie dla oficerów"
 SUBDOCTRINE_LEADERSHIP_OFFICER_DESC: "Doktryna ta koncentruje się na rozwoju przywództwa wśród oficerów poprzez formalną edukację i przygotowanie dowodzenia. Koncepcje szkolenia oficerów kładą nacisk na planowanie, koordynację i kontrolę organizacyjną w wojskach lądowych."
 SUBDOCTRINE_LEADERSHIP_NCO: "Szkolenie podoficerów"
 SUBDOCTRINE_LEADERSHIP_NCO_DESC: "Doktryna ta opiera proces kształtowania umiejętności przywódczych na podoficerach, stanowiących trzon dowodzenia wojskami lądowymi. Koncepcje szkolenia podoficerów kładą nacisk na dowodzenie na szczeblu taktycznym oraz na bieżącą efektywność działania pododdziałów."
 SUBDOCTRINE_LEADERSHIP_REDUCED: "Obniżone standardy"
 SUBDOCTRINE_LEADERSHIP_REDUCED_DESC: "Doktryna ta obniża formalne wymagania kwalifikacyjne dla dowódców, aby zwiększyć potencjał dowódczy. Koncepcje obniżonych standardów kładą nacisk na doraźne pozyskiwanie przywódców, aby wspierać rozbudowę sił."
 SUBDOCTRINE_EQUIPMENT_BASE_INFANTRY: "Podstawowe wyposażenie piechoty"
 SUBDOCTRINE_EQUIPMENT_BASE_INFANTRY_DESC: "Doktryna ta definiuje znormalizowany ładunek sprzętu piechoty, skupiający się na niezbędnej broni i sprzęcie wsparcia. Podstawowe koncepcje ładowności piechoty kładą nacisk na równowagę i uniwersalność w zakresie długotrwałych operacji lądowych."
 SUBDOCTRINE_EQUIPMENT_LIGHT_INFANTRY: "Wyposażenie lekkiej piechoty"
 SUBDOCTRINE_EQUIPMENT_LIGHT_INFANTRY_DESC: "Doktryna ta opiera koncepcję wyposażenia piechoty na redukcji masy i uproszczeniu zestawów ekwipunku. Założenia dotyczące lekkiego wyposażenia piechoty kładą nacisk na mobilność oraz łatwość przerzutu i rozmieszczenia sił w zróżnicowanych środowiskach operacyjnych."
 SUBDOCTRINE_EQUIPMENT_HEAVY_INFANTRY: "Ciężkie wyposażenie piechoty"
 SUBDOCTRINE_EQUIPMENT_HEAVY_INFANTRY_DESC: "Doktryna ta wyposaża formacje piechoty w rozbudowane systemy uzbrojenia i ochrony. Koncepcje dotyczące wyposażenia ciężkiej piechoty kładą nacisk na zwiększoną siłę ognia oraz wytrzymałość podczas walki naziemnej."
 SUBDOCTRINE_EQUIPMENT_BASE_MOTORIZED: "Zmotoryzowana konfiguracja podstawowa"
 SUBDOCTRINE_EQUIPMENT_BASE_MOTORIZED_DESC: "Doktryna ta określa ustandaryzowaną konfigurację wyposażenia dla pododdziałów piechoty zmotoryzowanej. W podstawowych zestawieniach dla piechoty zmotoryzowanej kładzie się nacisk na równowagę między mobilnością a zdolnością bojową, przy wykorzystaniu transportu kołowego."
 SUBDOCTRINE_EQUIPMENT_LIGHT_MOTORIZED: "Zmotoryzowana lekka konfiguracja"
 SUBDOCTRINE_EQUIPMENT_LIGHT_MOTORIZED_DESC: "Doktryna ta opiera wyposażenie pododdziałów zmotoryzowanych na lżejszych pojazdach i ograniczonej liczbie systemów pokładowych. Lekkie konfiguracje zmotoryzowane kładą nacisk na szybkość i elastyczność operacyjną w działaniach naziemnych."
 SUBDOCTRINE_EQUIPMENT_HEAVY_MOTORIZED: "Zmotoryzowana ciężka konfiguracja"
 SUBDOCTRINE_EQUIPMENT_HEAVY_MOTORIZED_DESC: "Doktryna ta wyposaża jednostki zmotoryzowane w cięższe pojazdy i ulepszony sprzęt pokładowy. Ciężkie jednostki zmotoryzowane kładą nacisk na ochronę i ciągłą zdolność bojową podczas operacji naziemnych."
 SUBDOCTRINE_EQUIPMENT_MIXED_MECHANIZED: "Zmechanizowana mieszana konfiguracja"
 SUBDOCTRINE_EQUIPMENT_MIXED_MECHANIZED_DESC: "Doktryna ta organizuje formacje zmechanizowane w oparciu o połączenie pojazdów transportowych i bojowych. Mieszane struktury zmechanizowane kładą nacisk na elastyczność działania dzięki integracji różnorodnego sprzętu."
 SUBDOCTRINE_EQUIPMENT_APC_MECHANIZED: "Zmechanizowana konfiguracja Transporterów Opancerzonych"
 SUBDOCTRINE_EQUIPMENT_APC_MECHANIZED_DESC: "Doktryna ta organizuje jednostki zmechanizowane wokół transporterów opancerzonych jako głównej platformy transportowej. Zmechanizowane konfiguracje transporterów opancerzonych kładą nacisk na mobilność chronioną i wsparcie piechoty w operacjach lądowych."
 SUBDOCTRINE_EQUIPMENT_IFV_MECHANIZED: "Konfiguracja Bojowego Wozu Piechoty"
 SUBDOCTRINE_EQUIPMENT_IFV_MECHANIZED_DESC: "Doktryna ta organizuje siły zmechanizowane w oparciu o bojowe wozy piechoty wyposażone w zintegrowane systemy bojowe. W strukturach tych kładzie się nacisk na połączenie mobilności ze wsparciem ogniem bezpośrednim."
 SUBDOCTRINE_EQUIPMENT_MBT_TANK: "Wyposażenie Czołgowe"
 SUBDOCTRINE_EQUIPMENT_MBT_TANK_DESC: "Doktryna ta koncentruje się na rozmieszczaniu i utrzymaniu zdolności bojowych formacji czołgów podstawowych. Koncepcje dotyczące wyposażenia pancernego podkreślają siłę ognia jako kluczowy element lądowych sił bojowych."
 SUBDOCTRINE_EQUIPMENT_LIGHT_TANK: "Konfiguracja Lekkiego Czołgu"
 SUBDOCTRINE_EQUIPMENT_LIGHT_TANK_DESC: "Doktryna ta opiera się na budowaniu jednostek pancernych wokół lżejszych platform czołgowych, dostosowanych do elastycznych operacji naziemnych. Konfiguracje lekkich czołgów kładą nacisk na mobilność i zasięg operacyjny w formacjach pancernych."
 SUBDOCTRINE_EQUIPMENT_SUPERHEAVY_TANK: "Sprzęt superciężki"
 SUBDOCTRINE_EQUIPMENT_SUPERHEAVY_TANK_DESC: "Doktryna ta organizuje siły pancerne wokół wyjątkowo ciężkich i chronionych platform pojazdów. Koncepcje sprzętu superciężkiego kładą nacisk na maksymalną obecność pojazdów pancernych w formacjach naziemnych."
 SUBDOCTRINE_EQUIPMENT_TOWED_ARTILLERY: "Artyleria holowana"
 SUBDOCTRINE_EQUIPMENT_TOWED_ARTILLERY_DESC: "Doktryna ta organizuje siły artylerii w oparciu o systemy artyleryjskie przystosowane do przemieszczania, wspierane przez środki transportowe. Koncepcje artylerii holowanej kładą nacisk na elastyczne wsparcie ogniowe w ramach działań naziemnych."
 SUBDOCTRINE_EQUIPMENT_SP_ARTILLERY: "Wyposażenie Artylerii Samobieżnej SPART"
 SUBDOCTRINE_EQUIPMENT_SP_ARTILLERY_DESC: "Doktryna ta wyposaża pododdziały artylerii w platformy samobieżne, zdolne do działania wspólnie z siłami manewrowymi. Koncepcje sprzętowe SPART kładą nacisk na mobilne i elastyczne wsparcie ogniowe."
 SUBDOCTRINE_EQUIPMENT_ROCKET_ARTILLERY: "Wyposażenie Artylerii Rakietowej"
 SUBDOCTRINE_EQUIPMENT_ROCKET_ARTILLERY_DESC: "Doktryna ta organizuje siły artylerii w oparciu o wieloprowadnicowe wyrzutnie rakietowe, przeznaczone do rażenia celów powierzchniowych. Koncepcje wykorzystania tego sprzętu kładą nacisk na skoordynowane prowadzenie ognia na całym obszarze działań bojowych."
 SUBDOCTRINE_EQUIPMENT_ATK_HELICOPTER: "Śmigłowce szturmowe"
 SUBDOCTRINE_EQUIPMENT_ATK_HELICOPTER_DESC: "Doktryna ta włącza śmigłowce uderzeniowe w struktury wyposażenia wojsk lądowych. Koncepcje wykorzystania śmigłowców uderzeniowych kładą nacisk na powietrzne wsparcie ogniowe oraz integrację działań powietrznych z operacjami lądowymi."
 SUBDOCTRINE_EQUIPMENT_TRANS_HELICOPTER: "Śmigłowce transportowe"
 SUBDOCTRINE_EQUIPMENT_TRANS_HELICOPTER_DESC: "Doktryna ta opiera mobilność wojsk lądowych na śmigłowcowych środkach transportu. Koncepcje wykorzystania śmigłowców transportowych kładą nacisk na mobilność powietrzną oraz szybkie przemieszczanie sił."
 SUBDOCTRINE_CAPITAL_CARRIER: "Operacje lotniskowców"
 SUBDOCTRINE_CAPITAL_CARRIER_DESC: "Doktryna ta koncentruje projekcję siły morskiej wokół lotniskowców jako centralnych zasobów floty. Operacje lotniskowców kładą nacisk na skoordynowane wykorzystanie zaokrętowanych skrzydeł lotniczych w celu rozszerzenia wpływów morskich na wszystkie teatry działań wojennych."
 SUBDOCTRINE_CAPITAL_HLS: "Okręty przystosowane do operacji śmigłowcowych"
 SUBDOCTRINE_CAPITAL_HLS_DESC: "Doktryna ta włącza okręty desantowe przystosowane do obsługi śmigłowców w struktury sił morskich. Koncepcje takich jednostek kładą nacisk na mobilność pionową oraz wsparcie działań desantowych w ramach operacji morskich."
 SUBDOCTRINE_CAPITAL_ESCORT_CARRIER: "Lotniskowiec eskortowy"
 SUBDOCTRINE_CAPITAL_ESCORT_CARRIER_DESC: "Doktryna ta organizuje lotnictwo morskie wokół mniejszych platform lotniskowców, operujących równolegle z elementami floty. Koncepcje lotniskowców eskortowych kładą nacisk na rozproszone wsparcie powietrzne w ramach formacji morskich."
 SUBDOCTRINE_CAPITAL_LOTS: "Władcy mórz"
 SUBDOCTRINE_CAPITAL_LOTS_DESC: "Doktryna ta organizuje siły morskie w celu zapewnienia trwałej kontroli nad kluczowymi regionami morskimi. Koncepcje Władców Mórz podkreślają dominującą obecność floty i ciągły wpływ morski."
 SUBDOCTRINE_CAPITAL_CARRIER_ESCORTS: "Eskorta lotniskowca"
 SUBDOCTRINE_CAPITAL_CARRIER_ESCORTS_DESC: "Doktryna ta organizuje elementy floty w celu zapewnienia warstwowej ochrony grupom lotniskowców. Koncepcje eskorty lotniskowców kładą nacisk na skoordynowaną obronę i ciągłość operacyjną okrętów flagowych."
 SUBDOCTRINE_CAPITAL_FLEET_CRUISERS: "Flota Krążowników"
 SUBDOCTRINE_CAPITAL_FLEET_CRUISERS_DESC: "Doktryna ta koncentruje organizację floty wokół jednostek klasy krążowników, zdolnych do operacji niezależnych i grupowych. Koncepcje krążowników flotowych kładą nacisk na obecność dowódców i zdolność do wykonywania wielu zadań morskich."
 SUBDOCTRINE_CAPITAL_DESTROYER_FLEET: "Flota niszczycieli"
 SUBDOCTRINE_CAPITAL_DESTROYER_FLEET_DESC: "Doktryna ta organizuje siły morskie w oparciu o niszczyciele jako główny element nawodnych sił bojowych. Koncepcje wykorzystania floty niszczycieli kładą nacisk na elastyczność działań bojowych oraz wsparcie operacyjne na szczeblu całej floty."
 SUBDOCTRINE_CAPITAL_SUPPORT_DESTROYERS: "Wparcie Niszczycieli"
 SUBDOCTRINE_CAPITAL_SUPPORT_DESTROYERS_DESC: "Doktryna ta przydziela siły niszczycieli do wspierania i ochrony jednostek floty o większej wartości. Koncepcje wsparcia niszczycieli kładą nacisk na ochronę, koordynację i ciągłe operacje floty."
 SUBDOCTRINE_CAPITAL_FRIGATE_CAPITAL: "Skupienie na Fregatach"
 SUBDOCTRINE_CAPITAL_FRIGATE_CAPITAL_DESC: "Doktryna ta nadaje okrętom klasy fregata kluczowe znaczenie w ramach formacji morskich. Koncepcje zakładające wiodącą rolę fregat kładą nacisk na zrównoważony potencjał oraz rozproszoną obecność na morzu."
 SUBDOCTRINE_ESCORT_MULTIROLE_FRIGATE: "Wielozadaniowe fregaty"
 SUBDOCTRINE_ESCORT_MULTIROLE_FRIGATE_DESC: "Doktryna ta organizuje siły eskortowe w oparciu o fregaty zdolne do realizacji różnorodnych zadań na morzu. Koncepcje fregat wielozadaniowych kładą nacisk na elastyczność działań w ramach zadań eskortowych i patrolowych."
 SUBDOCTRINE_ESCORT_ANTI_SUB_CORVETTE: "Korwety zwalczające okręty podwodne"
 SUBDOCTRINE_ESCORT_ANTI_SUB_CORVETTE_DESC: "Doktryna ta organizuje siły eskortowe wokół korwet specjalizujących się w wykrywaniu i zwalczaniu okrętów podwodnych. Koncepcje korwet zwalczających okręty podwodne kładą nacisk na lokalną kontrolę podwodną."
 SUBDOCTRINE_ESCORT_ANTI_AIR_CORVETTE: "Korweta przeciwlotnicza"
 SUBDOCTRINE_ESCORT_ANTI_AIR_CORVETTE_DESC: "Doktryna ta organizuje formacje eskortowe wokół korwet przystosowanych do zadań obrony powietrznej. Koncepcje korwet przeciwlotniczych kładą nacisk na ochronę jednostek floty przed zagrożeniami z powietrza."
 SUBDOCTRINE_ESCORT_STEALTH_ESCORTS: "Niewykrywalne eskorty"
 SUBDOCTRINE_ESCORT_STEALTH_ESCORTS_DESC: "Doktryna ta włącza okręty eskortowe o obniżonej wykrywalności do składu formacji morskich. Koncepcje eskorty typu stealth kładą nacisk na ograniczenie wykrywalności oraz dyskrecję operacyjną w środowisku morskim."
 SUBDOCTRINE_SUBMARINE_ESCORT_ATTACK: "Eskortowe Okręty podwodne"
 SUBDOCTRINE_SUBMARINE_ESCORT_ATTACK_DESC: "Doktryna ta przewiduje działania sił podwodnych w ścisłej współpracy z flotami nawodnymi. Koncepcje wykorzystania okrętów podwodnych do zadań eskortowych i uderzeniowych kładą nacisk na wsparcie operacji morskich prowadzone w zanurzeniu."
 SUBDOCTRINE_SUBMARINE_HUNTER_KILLER: "Myśliwskie Okręty Podwodne"
 SUBDOCTRINE_SUBMARINE_HUNTER_KILLER_DESC: "Doktryna ta opiera siły podwodne na niezależnych patrolach ofensywnych. Koncepcje okrętów podwodnych typu hunt-killer kładą nacisk na stałą obecność pod wodą i ukierunkowane działania."
 SUBDOCTRINE_SUBMARINE_MISSILE_BOATS: "Łodzie rakietowe"
 SUBDOCTRINE_SUBMARINE_MISSILE_BOATS_DESC: "Doktryna ta organizuje siły podwodne wokół platform przystosowanych do rozmieszczania pocisków rakietowych. Koncepcje łodzi rakietowych kładą nacisk na strategiczne i operacyjne zdolności uderzeniowe z obszaru morskiego."
 SUBDOCTRINE_OPERATIONS_RAIDING_FLEETS: "Floty rajdowe"
 SUBDOCTRINE_OPERATIONS_RAIDING_FLEETS_DESC: "Doktryna ta organizuje działania morskie wokół mobilnych grup zadaniowych, prowadzących operacje morskie o charakterze dezorganizującym. Koncepcje flot przeznaczonych do działań typu „rajdowego” kładą nacisk na zasięg operacyjny oraz elastyczne wykorzystanie sił."
 SUBDOCTRINE_OPERATIONS_NAVAL_SUPREMACY: "Przewaga na morzu"
 SUBDOCTRINE_OPERATIONS_NAVAL_SUPREMACY_DESC: "Doktryna ta organizuje działania sił morskich w celu ustanowienia i utrzymania kontroli nad obszarami morskimi. Koncepcje supremacji na morzu kładą nacisk na skoordynowane działania floty na morskich szlakach komunikacyjnych."
 SUBDOCTRINE_OPERATIONS_COSTAL_DEFENSE: "Obrona wybrzeża"
 SUBDOCTRINE_OPERATIONS_COSTAL_DEFENSE_DESC: "Doktryna ta tworzy struktury sił morskich w celu ochrony wód terytorialnych i dostępu do wybrzeża. Koncepcje obrony wybrzeża kładą nacisk na wielowarstwowe bezpieczeństwo morskie i regionalną kontrolę morską."
