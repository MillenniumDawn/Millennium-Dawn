 ALLOW_ALL_PARTIES_TT_DELAYED: "Il est temps de lever notre interdiction totale des autres partis.\n\n§YPrérequis :§!\n[!allow_all_parties_button_click_enabled]\n§YEffets :§!\n[!allow_all_parties_button_click]"
