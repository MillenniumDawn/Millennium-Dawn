l_korean:
 UKR_found_the_uop: "군산복합체 개혁"
 UKR_found_the_uop_desc: "우리의 방위 산업은 비참한 상태에 있습니다. 따라서, 이 분야에서 전반적인 개혁을 시작해야 합니다."
 UKR_ukrainian_armed_forces_reform: "국군 개혁"
 UKR_ukrainian_armed_forces_reform_desc: "Our armed forces urgently need reform. We must create new structures and new types of troops, and solve the old problems of our army."
 UKR_srdsc: "국가 연구 및 조선 설계 센터"
 UKR_srdsc_desc: "국가 연구 및 조선 설계 센터는 선박 전문 설계국으로 우크라이나 미콜라이우에 위치하고 있습니다. 기관은 우크라이나 방위산업 국영기업의 일부 입니다."
 UKR_defend_our_sky: "항공 산업을 부활시키다"
 UKR_defend_our_sky_desc: "소련 붕괴 이후 끔찍한 상태로 남겨져 있던 항공 산업을 부활 시킬 것입니다."
 UKR_cut_down_the_general_staff: "장군규모 감축"
 UKR_cut_down_the_general_staff_desc: "Too many generals negatively affect our army, it's time to fix it."
 UKR_contract_army: "군사교육 개혁"
 UKR_contract_army_desc: "We will reorganize the old military universities, as well as create new ones, to improve the quality of our armed forces."
 UKR_war_on_donbass_experience: "우리 군대"
 UKR_war_on_donbass_experience_desc: "The Ukrainian Army is literally a shadow of its former Soviet, and now Russian, counterpart. It is time to change that."
 UKR_support_uia: "우크라이나 항공(UIA)"
 UKR_support_uia_desc: "UIA 또는 우크라이나 국제항공은 우크라이나에 있는 주력 항공사이자 최대 규모의 항공사입니다. 항공기의 주요 허브는 키예프의 보리스필 국제공항에 있습니다. 유럽, 중동, 미국, 캐나다, 아시아로 여객기 및 화물 서비스를 운항하고 있습니다."
 UKR_build_new_airports: "새로운 공항 건설"
 UKR_build_new_airports_desc: "우리 공항은 너무 오랫동안 방치되어 왔습니다. 우리는 군사적 목적뿐만 아니라 민간 목적을 위해 공항에 투자해야 합니다."
 UKR_invest_in_ministry_of_infrastructure: "도로교통부서 투자"
 UKR_invest_in_ministry_of_infrastructure_desc: "인프라부는 일부 비난을 받았습니다. 우크라이나의 부패한 정부 관료들이 자금을 빼돌림으로 인해 인프라가 붕괴되고 있습니다. 사람들은 상황으로 인해 일부 도로에서 운전할 수 없습니다. 이제 우리 산업의 더 나은 미래를 위해 교육부를 다시 그려야 할 때입니다."
 UKR_roads_extend_plan: "도로 확충 계획"
 UKR_roads_extend_plan_desc: "우크라이나의 도로는 세계 최고가 아닙니다. 일부 지역은 여전히 ​​비포장 도로나 거의 파괴된 도로에 의존하고 있습니다. 이제 이 지역들이 약간의 사랑을 받을 때입니다."
 UKR_ukrainian_railways: "우크라이나 철도(UZ)"
 UKR_ukrainian_railways_desc: "UZ is the name of the state-owned company that currently possesses a massive monopoly on the majority of the Ukrainian railroad transportation within the country. The company boasts an impressive combined total track length of over 23,000km worth of track, marking it as the 13th largest in the world.\n\nIt is also the 6th largest rail passenger transporter and 7th largest freight transporter."
 UKR_legacy_of_the_ukr_ind: "우크라이나 산업화의 유산"
 UKR_legacy_of_the_ukr_ind_desc: "Ukraine relies heavily on its industrial base for its economic growth. The major cities of Kyiv, Lviv, and Zaporizhia all contain some form of industry that has driven their growth throughout the years. We must keep this trend or else we stagnate."
 UKR_ssau: "우크라이나 국가우주청(SSAU)"
 UKR_ssau_desc: "우크라이나 우주 산업은 우주 기술 분야의 세계적 리더와는 거리가 멀습니다. 그러나 우주선과 기타 외계 기계의 대규모 생산국이기도 합니다. 이 마지막 개척지에서 경쟁력을 유지할 수 있는 능력이 향후 우리의 미래를 좌우할 것입니다."
 UKR_pivdenmash_udo: "P.A.Y.M.B.P.과 U.D.O."
 UKR_pivdenmash_udo_desc: "Pivdenmash is Ukraine's primary manufacturer of spacecraft. The company is notable in producing rockets for foreign customers such as NASA. It would be good to develop this booming industry to project Ukraine on the global stage. Quick fun fact, Ukrainian made rockets accounted for 12% of all space flights in 2006. Who knew!"
 UKR_national_steel_companies: "우크라이나 철강 회사"
 UKR_national_steel_companies_desc: "루테니아 강철은 한때 전쟁을 수행하기 위한 강력한 제품이었습니다. 이제 우리는 더 이상 칼과 방패로 싸우지 않습니다. 그러나 우리의 탱크, 총, 총알이 경쟁력을 유지하려면 고품질의 강철이 필요합니다."
 UKR_naftogaz: "나프토가스"
 UKR_naftogaz_desc: "Naftogaz is the state-owned oil and natural gas company. It is involved in the process from extraction to the refinement of the products. The company is often used to push for oil and gas independence against countries like Russia or other major energy exporters."
 UKR_extend_ukrainian_refineries: "재생에너지에 집중"
 UKR_extend_ukrainian_refineries_desc: "우리는 천연가스와 기타 석유 매장량에 대한 충분한 접근권을 갖고 있지만, 현재의 에너지 수요를 다른 형태의 에너지로 보충하면 화석 연료 생산량이 적은 시대에 안정화하는 데 도움이 될 것입니다."
 UKR_zalk: "자포리지아 산업 알루미늄 공장"
 UKR_zalk_desc: "Zaporizhia는 우크라이나의 중요한 산업 중심지입니다. ZAZ의 본거지인 Zaporizhia Oblast의 수도이며, 야금술의 중심지이자 Donbas에서 물품을 선적하는 주요 항구 도시입니다."
 UKR_zaz: "ZAZ사"
 UKR_zaz_desc: "ZAZ 또는 Zaporizhia Automobile Building Plant는 우크라이나의 주요 자동차 제조업체입니다. 이름에서 알 수 있듯이 우크라이나 남동부의 Zaporizhia 시에 본사를 두고 있습니다. 또한 일반적으로 버스와 트럭을 생산하며 대부분 이전 모회사인 AvtoZAZ로 알려져 있습니다."
 UKR_kraz: "KrAZ"
 UKR_kraz_desc: "KrAZ is a privately held company in Kremenchuk, Ukraine. The company mainly produces trucks and other special-purpose vehicles. However, their main specialty is heavy-duty off-road models. It was recently registered as a holding company, and the Ukrainian corporation Finance and Credit now owns it."
 UKR_west_east_rivalry_balanced: "서방과 동방 사이에서\n§L현재 대립 상태:§! §G균형잡힌§!\n"
 UKR_west_east_rivalry_balanced_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."
 UKR_west_strengthened: "Between East and West \n§LCurrent rivalry status:§! §GMoving towards West§!\n"
 UKR_west_strengthened_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."
 UKR_west_dominant: "서방과 동방 사이에서\n§L현재 대립 상태:§! §G친서방§!"
 UKR_west_dominant_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."
 UKR_east_strengthened: "서방과 동방 사이에서\n§L현재 대립 상태:§! §G동방에 가까움§!\n"
 UKR_east_strengthened_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."
 UKR_east_dominant: "서방과 동방 사이에서\n§L현재 대립 상태:§! §G친러 국가§!"
 UKR_east_dominant_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."
 UKR_kleptocracy: "도둑정치"
 UKR_kleptocracy_desc: "우크라이나 정부는 현재 도벽정치의 수렁에 빠져 있습니다. 고위층은 부패했으며, 자신의 권력을 사용해 영토의 국민과 천연자원을 착취하여 부와 정치적 권력을 확장하고 있습니다.\n\n§C도벽 정치의 부정적인 영향을 없애기 위해 국가는 부패를 척결하기 위한 조치를 취해야 합니다.§!"
 UKR_to_many_generals: "과도한 장군 참모"
 UKR_to_many_generals_desc: "우크라이나 군대에는 450명의 현역 장군이 있습니다. 이들 대부분은 연루와 부패로 인해 직위를 받았고 전투 작전을 수행한 경험이 없습니다. 현 참모진은 무능해 개혁이 절실하다."
 UKR_idea_eu_member_associate: "EU 준회원"
 UKR_idea_eu_member_associate_desc: "우크라이나는 EU와의 제휴를 시작했습니다. 이는 유럽 및 서구 블록과의 관계를 심화할 것입니다. 그러나 이는 러시아어를 사용하는 대다수 지역에 문제를 제공합니다."
 UKR_idea_government_in_need: "비효율적인 정부"
 UKR_idea_pro_ukraine_reform_1: "개혁된 정부."
 UKR_idea_shortened_general_staff: "집중된 장군 참모"
 ukraine_news.7.t: "우크라이나 내전"
 ukraine_news.7.d: "우크라이나 돈바스 지역 주민들이 독립을 선언했습니다. 그들은 도네츠크와 루한스크 지역 주민들에게 더 이상 키예프의 폭정에 굴복하지 않겠다고 선언했습니다. [UKR.GetLeader] 측과 우크라이나 정부는 반군을 비난하고 그들을 진압하기 위해 동원했습니다. 이 지역에서는 이미 친우크라이나 반군 사이에 소규모 접전이 벌어졌습니다."
 ukraine_news.7.a: "반란을 진압해라"
 ukraine_news.7.b: "폭군을 쳐부셔라!"
 ukraine_news.7.c: "흥미로운 상황"
 ukraine_news.8.t: "크림반도 합병"
 ukraine_news.8.d: "크림반도 국민들은 우크라이나로부터 분리되는 국민투표를 실시했고 러시아와 동맹을 맺었습니다. 러시아는 이 지역에 병력을 쏟아부으면서 신속하고 단호하게 대응했습니다. 그들은 재빨리 반도를 합병했고 군사적 지위도 재빨리 장악했습니다. 우크라이나 정부는 이 문제에 대해 분노를 표명했으며 러시아가 크림 반도를 그들에게 반환하기를 요구하고 있습니다."
 ukraine_news.8.a: "당분간만이다..."
 ukraine_news.8.b: "모국 러시아를 위해!"
 ukraine_news.8.c: "성가신 소식이다."
 ukraine_focus: "우크라이나 중점 계통도"
 UKR_home_to_chernobyl_zone: "Home of the Chornobyl Exclusion Zone"
 UKR_chernobyl_tooltip: "The Chornobyl Exclusion Zone was established in the northern regions of this state, following the catastrophic nuclear accident at the Chornobyl nuclear power plant. The zone covers an area of approximately 2,600 square kilometers in Ukraine and was evacuated and declared uninhabitable due to high levels of radioactive contamination. Since its establishment, the exclusion zone has been managed by the Ukrainian government, and efforts have been ongoing to monitor and remediate the environmental and health impacts of the disaster."
 UKR_chernobyl_effects_tooltip: "§R지속적인 방사능 유출은 장기간의 피해를 야기할 것입니다§!"
 UKR_every_man_ataman: "Every Man - Otaman"
 UKR_foreign_advisors: "해외 고문단"
 ukraine_coup.1.t: "국내 쿠데타를 시도한 러시아!"
 ukraine_coup.1.d: "Latest reports from Kyiv state that Russian-supported agents were about to coup our government! This is a direct threat to our independence from Russian side."
 ukraine_coup.1.a: "Bastards."
 ukraine_coup.2.t: "국내 쿠데타를 일으킨 러시아!"
 ukraine_coup.2.d: "Latest reports from Kyiv state that Russian-supported agents couped our government! Now our country is going to be ruled by pro-Russian establishment clique."
 ukraine_coup.2.a: "뭐라고?"
 UKR_tro_brigades_ukraine_decision_category: "우크라이나 영토 방위군"
 UKR_tro_brigades_ukraine_decision_category_desc: "우크라이나 국군 영토방위군은 우크라이나 국군의 별도 부서로, 영토방위 임무의 조직, 준비 및 실행을 담당합니다."
 UKR_tro_created_tt: "§Y영토방위군 여단§!을 고용할 수 있습니다"
 UKR_reorganize_the_national_guard_ukraine_decision_category: "우크라이나 방위군"
 UKR_reorganize_the_national_guard_ukraine_decision_category_desc: "The National Guard of Ukraine is a military formation with law enforcement functions, is part of the system of the Ministry of Internal Affairs of Ukraine (MIA) and is designed to perform tasks to protect and defend the life, rights, freedoms and legitimate interests of citizens of Ukraine, society and the state from criminal and other illegal encroachments, protect public order and ensure public safety.\n\nAs well as in cooperation with law enforcement agencies, to ensure state security and protection of the state border, suppression of terrorist activities, activities of illegal paramilitary or armed formations (groups), terrorist organizations, organized groups and criminal organizations."
 UKR_reorganize_the_national_guard_first_brigade: "우크라이나 방위군의 §Y제 1작전 여단§! "
 UKR_reorganize_the_national_guard_second_brigade: "§Y25차 별동대§! 공공 질서 보호"
 UKR_reorganize_the_national_guard_third_brigade: "우크라이나 국가경비대 §Y 제4 작전 여단 §!"
 UKR_reorganize_the_national_guard_four_brigade: "§Y23번쨰 별동대§! 공공 질서 보호"
 UKR_natguard_created_tt: "§Y국가방위군 여단§!을 고용할 수 있습니다"
 UKR_uop_decision_category: "국가 주도 우크라이나 방산업 (Ukroboronprom)"
 UKR_uop_decision_category_desc: "국가 주도 우크라이나 방산업 (Ukroboronprom)은 국가의 통제 및 관리 하에 있는 우크라이나 군산복합기업 연합체입니다. 이 협력 체계는 무기, 군사 및 특수 장비, 탄약의 개발, 제조, 판매, 수리, 현대화 및 폐기와 관련된 경제적 산업에 연관되어 있고 타국과의 군사 기술 협력에 참여하는 방위 산업체들 또한 포함되어 있습니다. 이 국가 주도 산업은 전략 기획, 방위 산업 기업의 효율성 조정 및 개선, 공공 기관과의 상호 작용을 일선에서 지원합니다.\n\n\n현재 추가적인 임시 차량에 사용할 수 있는 추가 산업 역량은 [?ukr_industry_points]입니다."
 UKR_bpla_oup: "§YUAV(무인항공기)§! 분야 개발 실시"
 UKR_helicopter: "§Y헬리콥터§! 분야 개발 실시"
 UKR_uda_created_tt: "§Y우크라이나 의용군§!이 창설될 것입니다"
 UKR_aidar_created_tt: "§Y아이다르 대대§!가 창설됩니다"
 UKR_donbass_created_tt: "§Y돈바스-우크라이나 대대§!가 창설됩니다"
 UKR_azov_created_tt: "§Y아조우§!가 창설됩니다"
 UKR_police_mobilisation_1: "Mobilize §YPolice Regiment Kyiv§!"
 UKR_police_mobilisation_2: "§Y이바노프란키우스크 경찰연대§! 동원"
