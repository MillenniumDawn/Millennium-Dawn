 raj_exports.1.t: "자국 무기 구매를 제안하는 인도"
 raj_exports.1.d: "인도 정부는 자국 무기 기업을 통해 자국에서 생산하는 특정 종류의 무기를 구매하라는 제안을 해 왔습니다. 수락하시겠습니까?"
 raj_exports.1.a: "대공 장비를 구매한다"
 raj_exports.1.b: "지휘 통제 장비를 구매한다"
