 module_tank_exoskeletal_engine_gen1: "Экзоскелетный двигатель"
 module_tank_exoskeletal_engine_gen1_desc: "Внешняя система питания и привода, повышающая мощность трансмиссии и повышающая мобильность при больших нагрузках. Это улучшает ускорение и управляемость бронированных платформ на пересеченной местности, но увеличивает производственные затраты и нагрузку на техническое обслуживание из-за сложных приводов и современных материалов."
 module_tank_exoskeletal_engine_gen2: "Усовершенствованный экзоскелетный двигатель"
 module_tank_exoskeletal_engine_gen2_desc: "Усовершенствованная силовая рама экзоскелета с улучшенной эффективностью, долговечностью и интеграцией управления, обеспечивающая более высокую производительность без постоянных поломок. Это еще больше повышает мобильность и устойчивость к нагрузкам, но остается дорогостоящим и ресурсоемким для масштабного производства."
 super_heavy_tank_chassis_0: "Средний шагающий корпус I поколения"
 super_heavy_tank_chassis_0_desc: "Средние шагающие корпуса обозначают бронированные боевые машины, в которых вместо обычной гусеничной или колесной ходовой части используется двуногая или многоногая система передвижения. Обычно они сочетают усиленную бронированную капсулу, высокомощный двигатель или генератор и сочленённые исполнительные механизмы, позволяющие перемещаться по завалам, крутым склонам, мягкой почве и другим типам местности, ограничивающим движение традиционной бронетехники."
 super_heavy_tank_chassis_1: "Средний шагающий корпус II поколения"
 super_heavy_tank_chassis_1_desc: "Средние шагающие корпуса обозначают бронированные боевые машины, в которых вместо обычной гусеничной или колесной ходовой части используется двуногая или многоногая система передвижения. Обычно они сочетают усиленную бронированную капсулу, высокомощный двигатель или генератор и сочленённые исполнительные механизмы, позволяющие перемещаться по завалам, крутым склонам, мягкой почве и другим типам местности, ограничивающим движение традиционной бронетехники."
 super_heavy_tank_chassis_2: "Средний шагающий корпус III поколения"
 super_heavy_tank_chassis_2_desc: "Средние шагающие корпуса обозначают бронированные боевые машины, в которых вместо обычной гусеничной или колесной ходовой части используется двуногая или многоногая система передвижения. Обычно они сочетают усиленную бронированную капсулу, высокомощный двигатель или генератор и сочленённые исполнительные механизмы, позволяющие перемещаться по завалам, крутым склонам, мягкой почве и другим типам местности, ограничивающим движение традиционной бронетехники."
 super_heavy_tank_chassis_3: "Средний шагающий корпус IV поколения"
 super_heavy_tank_chassis_3_desc: "Средние шагающие корпуса обозначают бронированные боевые машины, в которых вместо обычной гусеничной или колесной ходовой части используется двуногая или многоногая система передвижения. Обычно они сочетают усиленную бронированную капсулу, высокомощный двигатель или генератор и сочленённые исполнительные механизмы, позволяющие перемещаться по завалам, крутым склонам, мягкой почве и другим типам местности, ограничивающим движение традиционной бронетехники."
 super_heavy_tank_chassis_4: "Средний шагающий корпус V поколения"
 super_heavy_tank_chassis_4_desc: "Средние шагающие корпуса обозначают бронированные боевые машины, в которых вместо обычной гусеничной или колесной ходовой части используется двуногая или многоногая система передвижения. Обычно они сочетают усиленную бронированную капсулу, высокомощный двигатель или генератор и сочленённые исполнительные механизмы, позволяющие перемещаться по завалам, крутым склонам, мягкой почве и другим типам местности, ограничивающим движение традиционной бронетехники."
 super_heavy_tank_artillery_chassis_0: "Корпус тяжёлого шагохода 1-го поколения"
 super_heavy_tank_artillery_chassis_0_desc: "Корпуса тяжёлых шагоходов — это корпуса бронированных боевых машин, которые используют четырёхногую систему передвижения вместо традиционного гусеничного или колёсного шасси. Обычно они сочетают сильно усиленную бронированную капсулу, мощный двигатель или генераторный блок и четыре шарнирных приводных механизма, обеспечивающих устойчивое передвижение по завалам, крутым склонам, мягкому грунту и другой местности, затрудняющей движение традиционной бронетехники."
 super_heavy_tank_artillery_chassis_1: "Корпус тяжёлого шагохода 2-го поколения"
 super_heavy_tank_artillery_chassis_1_desc: "Корпуса тяжёлых шагоходов — это корпуса бронированных боевых машин, которые используют четырёхногую систему передвижения вместо традиционного гусеничного или колёсного шасси. Обычно они сочетают сильно усиленную бронированную капсулу, мощный двигатель или генераторный блок и четыре шарнирных приводных механизма, обеспечивающих устойчивое передвижение по завалам, крутым склонам, мягкому грунту и другой местности, затрудняющей движение традиционной бронетехники."
 super_heavy_tank_artillery_chassis_2: "Корпус тяжёлого шагохода 3-го поколения"
 super_heavy_tank_artillery_chassis_2_desc: "Корпуса тяжёлых шагоходов — это корпуса бронированных боевых машин, которые используют четырёхногую систему передвижения вместо традиционного гусеничного или колёсного шасси. Обычно они сочетают сильно усиленную бронированную капсулу, мощный двигатель или генераторный блок и четыре шарнирных приводных механизма, обеспечивающих устойчивое передвижение по завалам, крутым склонам, мягкому грунту и другой местности, затрудняющей движение традиционной бронетехники."
 super_heavy_tank_destroyer_chassis_0: "Корпус лёгкого шагохода 1-го поколения"
 super_heavy_tank_destroyer_chassis_0_desc: "Корпуса лёгких шагоходов — это компактные двуногие бронированные корпуса, разработанные для высокой манёвренности и быстрой смены позиции на пересечённой местности. Они быстрее средних шагоходов, но из-за уменьшенной грузоподъёмности могут нести только лёгкое оружие и оборудование для миссий."
 super_heavy_tank_destroyer_chassis_1: "Корпус лёгкого шагохода 2-го поколения"
 super_heavy_tank_destroyer_chassis_1_desc: "Корпуса лёгких шагоходов — это компактные двуногие бронированные корпуса, разработанные для высокой манёвренности и быстрой смены позиции на пересечённой местности. Они быстрее средних шагоходов, но из-за уменьшенной грузоподъёмности могут нести только лёгкое оружие и оборудование для миссий."
 super_heavy_tank_destroyer_chassis_2: "Корпус лёгкого шагохода 3-го поколения"
 super_heavy_tank_destroyer_chassis_2_desc: "Корпуса лёгких шагоходов — это компактные двуногие бронированные корпуса, разработанные для высокой манёвренности и быстрой смены позиции на пересечённой местности. Они быстрее средних шагоходов, но из-за уменьшенной грузоподъёмности могут нести только лёгкое оружие и оборудование для миссий."
 tech_tank_walker_chassis_1: "Шасси шагоходного танка II"
 tech_tank_walker_chassis_1_desc: "Ранние шасси шагоходов заменяют гусеницы на приводные ножные конструкции, обменивая простоту на возможность передвижения по пересечённой местности и высокую манёвренность на завалах, в лесах и на неровной почве. Они могут переступать через препятствия, которые остановили бы обычную бронетехнику, но требования к обслуживанию и стоимость резко возрастают из-за приводов, сенсоров и сложных систем балансировки."
 tech_tank_walker_chassis_2: "Шасси шагоходного танка III"
 tech_tank_walker_chassis_2_desc: "Шасси шагоходов второго поколения повышают устойчивость, грузоподъёмность и стойкость к повреждениям за счёт улучшенного программного обеспечения управления и усиленной конструкции шарниров. С более мощными силовыми установками и продуманной логикой подвески шагоходы становятся подходящей платформой для тяжёлых операций в городских условиях и на экстремальной местности, хотя по-прежнему остаются дорогими и требовательными к ресурсам при массовом развертывании."
 walker_tank_module_railgun: "Шагающая рельсотронная установка"
 walker_tank_module_railgun_desc: "Рельсотроны используют электромагнитное ускорение для выстрела снарядов высокой скорости, обеспечивая отличное пробивание брони защищённых целей.\n\n§GПодсказка дизайнера: Рельсотроны значительно повышают пробиваемость брони, но их производство дороже.§!"
 walker_tank_module_tank_barrel: "Стандартная танковая пушка"
 walker_tank_module_tank_barrel_desc: "Танковые пушки обеспечивают сбалансированное и надёжное основное вооружение для бронетехники, сочетая проверенную огневую мощь с разумными требованиями к производству и обслуживанию.\n\n§GПодсказка дизайнера: стандартные танковые пушки — экономичное базовое оружие, обеспечивающее надёжную работу без специальных компромиссов.§!"
 walker_tank_module_flamethrower: "Огнемёт шагохода"
 walker_tank_module_flamethrower_desc: "Транспортные огнеметы стреляют горящей жидкостью, чтобы расчистить позиции пехоты и легкие укрепления, что делает их крайне эффективными против мягких целей на близкой дистанции.\n\n§GПодсказка дизайнера: Огнемёты отлично справляются с небронированными целями и окопавшейся пехотой, но имеют очень ограниченную эффективность против тяжелобронированных или укреплённых целей§!"
 walker_tank_module_heavy_machinegun: "Пулемёт крупного калибра"
 walker_tank_module_heavy_machinegun_desc: "Пулемёты крупного калибра обеспечивают надёжное оружие с высокой скорострельностью для подавления пехоты и борьбы с легкими транспортными средствами, предлагая стабильную защиту на ближней и средней дистанции.\n\n§GПодсказка дизайнера: Крупнокалиберные пулемёты — простой и экономичный вариант вспомогательного вооружения, идеально подходящий для универсальной защиты от небронированных целей§!"
 walker_tank_module_rocket_launcher: "Реактивная установка «Вокер»"
 walker_tank_module_rocket_launcher_desc: "Реактивные установки выпускают осколочно-фугасные и кумулятивные боеприпасы, обеспечивая более высокую эффективность против твёрдых целей по сравнению со стандартным пулемётным вооружением.\n\n§GПодсказка дизайнера: Ракетные установки дороже крупнокалиберных пулемётов, но дают более высокую атаку по бронетехнике и улучшенное бронепробитие против бронированных целей§!"
 walker_tank_module_vls: "Универсальная пусковая установка «Вокер»"
 walker_tank_module_vls_desc: "Вертикальные пусковые установки позволяют шагающим танкам нести и запускать управляемые ракеты из защищённых пусковых ячеек, обеспечивая мощные удары и возможность быстрой залповой стрельбы.\n\n§GПодсказка дизайнера: Модули VLS значительно дороже в производстве, но обеспечивают заметно более высокую пробивную способность и атакующий потенциал§!"
 walker_tank_module_nuclear_engine_gen1: "Ядерный двигатель I"
 walker_tank_module_nuclear_engine_gen1_desc: "Ядерные двигатели обеспечивают генерацию энергии на борту, исключая потребление обычного топлива и позволяя вести продолжительные операции без зависимости от топливной логистики.\n\n§GПодсказка дизайнера: Ядерные двигатели устраняют расход топлива, но они дороже в производстве§!"
 walker_tank_module_nuclear_engine_gen2: "Ядерный двигатель II"
 walker_tank_module_nuclear_engine_gen2_desc: "$walker_tank_module_nuclear_engine_gen1_desc$"
 walker_tank_module_nuclear_engine_gen3: "Ядерный двигатель III"
 walker_tank_module_nuclear_engine_gen3_desc: "$walker_tank_module_nuclear_engine_gen1_desc$"
 walker_tank_module_nuclear_engine_gen4: "Ядерный двигатель IV"
 walker_tank_module_nuclear_engine_gen4_desc: "$walker_tank_module_nuclear_engine_gen1_desc$"
 walker_tank_module_diesel_engine_gen1: "Дизельный двигатель I"
 walker_tank_module_diesel_engine_gen1_desc: "Дизельные двигатели обеспечивают традиционную проверенную силовую установку для шагающих танков, предлагая простое производство и обслуживание с использованием широко доступных компонентов.\n\n§GПодсказка дизайнера: Дизельные двигатели — это стандартный и экономичный вариант, но они характеризуются высоким расходом топлива§!"
 walker_tank_module_fusion_engine_gen1: "Топливный термоядерный двигатель I"
 walker_tank_module_fusion_engine_gen1_desc: "Термоядерные двигатели обеспечивают высокоплотную генерацию энергии на борту, исключая потребление обычного топлива и позволяя вести продолжительные операции без зависимости от топливной логистики.\n\n§GПодсказка дизайнера: Термоядерные двигатели предоставляют те же преимущества независимости от топлива, что и ядерные двигатели, но они более надёжны и ещё дороже§!"
 walker_tank_module_solar_engine_gen1: "Солнечный двигатель I"
 walker_tank_module_solar_engine_gen1_desc: "Солнечные двигатели обеспечивают генерацию электроэнергии на борту, сокращая зависимость от обычного топлива и позволяя вести продолжительные операции при благоприятных условиях.\n\n§GПодсказка дизайнера: Солнечные двигатели предоставляют аналогичные преимущества независимости от топлива, как и ядерные двигатели, но они менее надёжны и дешевле§!"
 walker_tank_module_two_legs: "Двуногое шасси вокаера"
 walker_tank_module_two_legs_desc: "Двуногие шасси шагающего танка обеспечивают стандартную двухногую компоновку, предлагая сбалансированную маневренность и защиту для универсальных боевых задач.\n\n§GПодсказка дизайнера: Двуногие шасси — это базовая конфигурация шагающих танков, обеспечивающая надёжную мобильность и выживаемость без высоких затрат и сложности более тяжёлых ноговых систем§!"
 walker_tank_module_four_legs: "Четырёхногое тяжёлое шасси"
 walker_tank_module_four_legs_desc: "Четырёхногие тяжёлые шасси используют четыре усиленные ножные сборки для повышения устойчивости под огнём и поддержки более тяжёлых нагрузок, увеличивая боевую живучесть при штурмах.\n\n§GПодсказка дизайнера: Четырёхногие тяжёлые шасси обеспечивают большую пробивную способность и повышенную надёжность, но они дороже в производстве и имеют сниженную подвижность§!"
 walker_tank_light_chassis: "Лёгкое корпусное шасси вокаера"
 walker_tank_light_chassis_desc: "Лёгкое шасси образует основную конструкцию корпуса шагающего танка, делая приоритетом малый вес и манёвренность для быстрого перемещения и смены позиции.\n\n§GПодсказка дизайнера: Лёгкие шасси обеспечивают высокую манёвренность и дают доступ к 1 слоту вооружения, что делает их идеальными для задач, где скорость имеет решающее значение§!"
 walker_tank_medium_chassis: "Среднее корпусное шасси вокаера"
 walker_tank_medium_chassis_desc: "Среднее шасси образует основную конструкцию корпуса шагающего танка, обеспечивая баланс защиты, мобильности и грузоподъёмности для универсальной эффективности на передовой.\n\n§GПодсказка дизайнера: Средние шасси — это универсальный вариант, предоставляющий доступ к 2 слотам вооружения для гибких комплектаций§!"
 walker_tank_heavy_chassis: "Тяжёлое корпусное шасси вокаера"
 walker_tank_heavy_chassis_desc: "Тяжёлое шасси образует основную конструкцию тяжёлого шагающего танка, делая приоритетом максимальную грузоподъёмность и интеграцию вооружения в ущерб скорости и манёвренности.\n\n§GПодсказка дизайнера: Тяжёлые шасси очень дорогие и самые медленные, но они предоставляют наибольшее количество слотов для вооружения и созданы для подавления и уничтожения самых прочных целей§!"
 walker_tank_module_battlestation_1: "Боевой модуль станции I"
 walker_tank_module_battlestation_1_desc: "Боевые модули станции интегрируют систему управления огнём, датчики и инструменты координации на борту, повышая общую боевую эффективность и скорость реакции платформы.\n\n§GПодсказка дизайнера: Боевые модули станции обеспечивают широкое улучшение характеристик шагающего танка, делая их сильным универсальным апгрейдом для любой роли и комплектации§!"
 walker_tank_module_countermeasures_1: "Система активной защиты I"
 walker_tank_module_countermeasures_1_desc: "Системы активной защиты используют датчики и быстродействующие противодействующие меры для обнаружения и нейтрализации приближающихся угроз, повышая общую живучесть под огнём.\n\n§GПодсказка дизайнера: Системы активной защиты обеспечивают широкое улучшение защиты, помогая шагающим танкам выживать при столкновениях с ракетами, снарядами и другими точными угрозами на передовой§!"
 walker_tank_module_anti_rocket_laser_1: "Лазер ближней обороны I"
 walker_tank_module_anti_rocket_laser_1_desc: "Лазеры ближней обороны используют быстрое наведение и импульсы направленной энергии для обнаружения и уничтожения приближающихся ракет до их удара, снижая вероятность успешного пробития.\n\n§GПодсказка дизайнера: Лазеры ближней обороны повышают защиту от ракет и снарядов, снижая шансы пробития, что делает их особенно ценными для ударных подразделений, ожидающих продолжительный обстрел§!"
 walker_tank_module_recon_drone_1: "Комплект разведывательных дронов I"
 walker_tank_module_recon_drone_1_desc: "Комплекты разведывательных дронов позволяют шагающим танкам запускать дрон на поле боя для передового наблюдения и подтверждения целей, повышая осведомлённость о ситуации за пределами прямой видимости.\n\n§GПодсказка дизайнера: Разведывательные дроны улучшают разведку§!"
 walker_tank_module_suicide_drone_1: "Ячейки дронов-камикадзе I"
 walker_tank_module_suicide_drone_1_desc: "Ячейки дронов-камикадзе запускают расходуемые боевые дроны, которые могут искать, отслеживать и поражать цели с улучшенным наведением и распознаванием целей по сравнению со стандартными залпами ракет.\n\n§GПодсказка дизайнера: Дроны-камикадзе обеспечивают лучшую точность и надёжность попадания по сравнению с обычными ударами VLS, но наносят меньше прямого урона из-за меньших боеголовок и ограниченной грузоподъёмности§!"
