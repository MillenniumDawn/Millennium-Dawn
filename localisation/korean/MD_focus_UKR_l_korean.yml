 ukraine_varyag.2.desc: "§W미완성 상태의 §!§Y바랴크§!§W는 §!§Y미콜라이우§!§W를 떠나 §!§L청롯§!§W으로 예인되고 있습니다. 청롯은 §!§Y마카오§!§W에 수상 카지노를 열 계획이라고 합니다. §!§Y[TUR.GetNameWithFlag]§!§W은(는) 동력 없는 예인의 위험과 §!§Y몽트뢰 협약§!§W 문제를 이유로 해협 통과 허가를 §!§R보류했습니다§!§W.§!"
 ukraine_varyag.2.desc_ukraine: "§Y[TUR.GetNameWithFlag]§!§W이(가) §!§Y보스포루스§!§W 입구에서 §!§Y바랴크§!§W를 멈춰 세웠습니다. 우리 해군 지휘관들은 이 지연을 하늘의 계시라 부르며, 선체가 아직 §!§Y흑해§!§W에 있을 때 매각을 되돌리라고 촉구합니다. §!§Y미콜라이우§!§W의 기술자들이 선체를 조사해 우리 함대용으로 완성하려면 무엇이 필요한지 알려줄 수 있습니다.§!"
 ukraine_varyag.2.a: "가능한 방안 검토"
 ukraine_varyag.4.name: "§Y[CHI.GetNameWithFlag]§!의 통과 요청"
 ukraine_varyag.4.desc: "§Y[CHI.GetNameWithFlag]§!§W은(는) §!§Y보스포루스§!§W와 §!§Y다르다넬스§!§W를 통과하는 통제된 예인 비용을 지불할 용의가 있습니다. 협상단은 더 적은 대금을 받는 대신 우리의 이동식 미사일 계획에 기술 지원을 해달라는 제안도 내놓았습니다.§!"
 ukraine_varyag.4.a: "전액 지불을 §G수락§!"
 ukraine_varyag.4.b: "대금과 미사일 지원을 §G수락§!"
 ukraine_varyag.4.c: "§R통과를 거부§!하고 없던 일로 한다"
 ukraine_varyag.5.name: "§Y바랴크§!, §Y[CHI.GetNameWithFlag]§!에 도착하다"
 ukraine_varyag.5.desc: "§W예인선들이 §!§G미완성 항공모함을 인도했습니다§!§W. 이제 우리 해군 기술자들이 선체를 도면과 대조하고 §!§Y다롄§!§W에서 진행할 개수를 계획할 수 있습니다.§!"
 ukraine_varyag.5.a: "우리 기술자들을 승선시킨다"
 ukraine_varyag.6.name: "§Y[TUR.GetNameWithFlag]§!의 공동 개수 제안"
 ukraine_varyag.6.desc: "§Y[TUR.GetNameWithFlag]§!§W은(는) 구매자에게 대금을 보상하고 선체를 §!§Y귈추크§!§W로 가져가겠다고 제안합니다. §!§L흑해 조선소§!§W와 우리 설계국이 계약에 따라 공학 작업과 부품을 공급하게 됩니다.§!"
 ukraine_varyag.6.a: "조선 계약을 §G수락§!"
 ukraine_varyag.6.b: "기존 매각을 고수한다"
 ukraine_varyag.7.name: "§Y바랴크§!, §Y보스포루스§!를 통과하다"
 ukraine_varyag.7.desc: "§W교통이 통제되고 호위 예인선이 배치되자 §!§Y바랴크§!§W가 해협 §!§G통과를 시작했습니다§!§W. 예인은 원래의 매각 계약대로 §!§Y[CHI.GetNameWithFlag]§!§W을(를) 향하고 있습니다.§!"
