 SAU_corporate_policy: "Corporate and Labour Policy"
 SAU_corporate_policy_tt: "§HHow the Kingdom regulates its companies and who they are allowed to hire.§!"
 SAU_corporate_policy_2_tt: "§YNitaqat quotas and Kafala rules outlive any one government - these terms survive a change of regime.§!"
 SAU_nitaqat_band_dynamic: "The Dynamic Tiering Formula"
 SAU_nitaqat_band_dynamic_desc: "A quota that means one thing to a firm of nine thousand and another to a firm of nine cannot be a single number. The formula scales the requirement with headcount, revenue and sector, and recalculates it every quarter.\n\nFirms stop gaming the threshold by splitting themselves in two."
 SAU_nitaqat_band_high_green: "High-Green Zone Incentives"
 SAU_nitaqat_band_high_green_desc: "Below platinum sits the band where most of the Kingdom's serious employers actually live. They are compliant, they are not exceptional, and until now the system gave them nothing for it.\n\nPriority processing and a lighter audit schedule, on the theory that rewarding the near-compliant is cheaper than punishing them."
 SAU_nitaqat_band_yellow: "The Yellow Band Warnings"
 SAU_nitaqat_band_yellow_desc: "A firm in yellow is told, in writing and with a date attached, exactly how far short it falls and what happens when the quarter closes.\n\nMost of them fix it. The warning costs the Ministry a letter and saves it a freeze."
 SAU_shura_rebalanced_tt: "§YAll three benches reset to 40 seats§! - the Council stays contested and no charter is issued"
 SAU_shura_charter_ulema: "The Council of Senior Scholars"
 SAU_shura_charter_ulema_desc: "The Council's religious wing is written into the Basic Law. Legislation is read for its conformity before it is read for anything else, and the scholars answer to the King alone.\n\nThe Kingdom is harder to move and much harder to subvert. It also stops learning as quickly as its neighbours."
 SAU_shura_charter_technocrats: "The Planning Council"
 SAU_shura_charter_technocrats_desc: "The Council becomes what its technocrats always argued it should be - a planning body staffed by people who can read a balance sheet, with a standing mandate over industrial and education policy.\n\nThe Kingdom modernises faster than anyone expected. The men it stopped consulting notice."
 SAU_shura_charter_notables: "The Chamber of Families"
 SAU_shura_charter_notables_desc: "The great merchant and tribal houses take permanent seats, and the Council becomes the room where the Kingdom's patronage is negotiated openly rather than in private.\n\nIt runs smoothly and cheaply. It will not ask the country for anything difficult."
 SAU_events.220.t: "The Planners Ask for a Mandate"
 SAU_events.220.d: "The technocrats now hold the Council outright. They have drafted a proposal that would make that permanent - a standing planning mandate over industry, education and the budget, with the Council's composition fixed in the Basic Law.\n\nThe King can sign it and get a government that works, or refuse and keep a chamber he can still rebalance whenever it suits him."
 SAU_events.220.a: "Charter the Planning Council."
 SAU_events.220.b: "The Council stays what I make it."
 SAU_events.221.t: "The Families Present Their Case"
 SAU_events.221.d: "The notables hold the Council, and they have come to the Diwan with a proposal drafted by men who have been negotiating with this family for a century - permanent seats for the great houses, in exchange for the quiet the King has always relied on them to keep.\n\nIt is the cheapest government available and the least ambitious."
 SAU_events.221.a: "Charter the Chamber of Families."
 SAU_events.221.b: "The Council stays what I make it."
 SAU_events.222.t: "The Scholars Ask to Be Written In"
 SAU_events.222.d: "The ulema hold the Council and wish it entered into the Basic Law - a standing body of senior scholars with first reading on every measure the Kingdom passes.\n\nIt would settle the question of religious authority in the Kingdom for a generation, in the scholars' favour, and it cannot be undone by a later King in a bad mood."
 SAU_events.222.a: "Charter the Council of Senior Scholars."
 SAU_events.222.b: "The Council stays what I make it."
 SAU_junta_grip_firm: "The Council's Writ Runs"
 SAU_junta_grip_firm_desc: "Orders issued in Riyadh are carried out in Jazan the same week. The provincial governors answer the telephone, the security services report upward rather than sideways, and nobody is quietly waiting to see which way this goes.\n\nIt is the one advantage a government of officers has over the one it replaced."
 SAU_junta_grip_uneven: "An Uneven Writ"
 SAU_junta_grip_uneven_desc: "The Council governs the capital and the Eastern Province properly, and the rest of the Kingdom approximately. Instructions are followed where somebody is watching.\n\nIt is enough to hold the country. It is not enough to change it."
 SAU_junta_grip_slipping: "The Writ Stops at the Ring Road"
 SAU_junta_grip_slipping_desc: "Outside Riyadh the Council's orders are received, filed, and disregarded by men calculating how long it will last. Garrison commanders have begun corresponding with each other rather than with the capital.\n\nA government that cannot be obeyed is not yet a government that has fallen, but the distinction is getting thinner."
 SAU_regency_deadline_tt: "§YA reckoning falls due in five years§! - the decree must be renewed, extended or allowed to lapse"
 SAU_debug_shura_seat_jump: "§Y(DEBUG) Technocrats +30 seats§!"
 SAU_debug_shura_seat_jump_desc: "Pushes the technocrat bench past the 70-seat charter threshold so the charter event fires."
 SAU_debug_corp_readout: "§Y(DEBUG) Corporate Policy§!: tax [?SAU_corp_tax|%1] migr [?SAU_corp_migration|%1] workers [?SAU_corp_civ_workers|%1] FDI [?SAU_corp_fdi_cost|%1]"
 SAU_debug_corp_readout_desc: "Reads the corporate and labour policy variables the Nitaqat and Kafala paths write into."
 SAU_debug_junta_control_up: "§Y(DEBUG) Junta Control +25§!"
 SAU_debug_junta_control_up_desc: "Raises the Council's grip to test the grip tiers."
 SAU_debug_junta_control_down: "§Y(DEBUG) Junta Control -25§!"
 SAU_debug_junta_control_down_desc: "Lowers the Council's grip to test the slipping-writ penalties."
 SAU_water_national_company: "The National Water Company"
 SAU_water_national_company_desc: "Desalination, distribution and billing are consolidated into one state utility answerable to the Ministry. It builds where the Kingdom needs water rather than where the margin is, which is the point of it and also the problem with it.\n\nWater reaches the interior. The utility will never turn a profit and was never asked to."
 SAU_water_foreign_operators: "Foreign Water Operators"
 SAU_water_foreign_operators_desc: "The plants are built, run and maintained under contract by firms that have done it a hundred times before, to a standard the Kingdom could not yet reach on its own.\n\nThe water is cleaner and cheaper per cubic metre. The contracts are denominated in dollars and the expertise leaves when they do."
 SAU_events.223.t: "The Kingdom, Briefly"
 SAU_events.223.d: "A short note on how this Kingdom is played, from the men who will have to run it.\n\n§HThe Kingdom's Future§! - a balance, not a button. It moves with focuses, events and the reforms the King enacts, and it decides how receptive the country is to modernisation. Watch it; you cannot order it.\n§HOil Dependence§! - a number from 0 to 100 that creeps up §Yone point every three months§! on its own. Diversification decisions and focuses pull it down. It is the long argument of the whole campaign.\n§HCorporate and Labour Policy§! - in the economic tree. Choose §ONitaqat quotas§! (tax and hire Saudis, lose foreign labour) or §YKafala liberalisation§! (cheap workers and foreign capital, at the cost of tax revenue and jobs for nationals). Both feed the Kingdom's real unemployment figure.\n§HThe Councils§! - the Majlis ash-Shura sits from the start. Seat the §Oulema§!, §Ytechnocrats§! or §Gnotables§!; whichever bench leads sets its character, and past §Y70 seats§! you may charter it permanently. The People's Council arrives later, passes bills, and can be vetoed - at a price.\n§HThe Succession§! - when Fahd dies the princes begin manoeuvring. Back one through the Crown Prince decisions; whoever leads when the King dies takes the throne, and each brings his own directives. §YOne directive occupies the court at a time.§!\n§HThe Army§! - the officers keep their own account of what they are owed. Let it run and they will act on it. §RWatch the grievance readout, and settle before it is too late§! - the coup can be prevented, but not reversed.\n§HThe Arab Spring§! - if the region catches, unrest builds as a number. At breaking point the King chooses: ride it out and bleed stability, or §Rlet the monarchy fall§! and hand the country to a transitional council.\n§HThe Republic of Arabia§! - the throne is not permanent, and there are §Ythree roads off it§!: let the officers take Riyadh and §OProclaim the Republic§! under military rule; keep the throne intact but §Oput a party other than the House of Al Saud in power§!, which opens Declare the Republic of Arabia from the Royal Hub; or let the §OArab Spring run to its breaking point§! and step aside, which declares it for you. §RThe military road closes the other two§! - a Kingdom that has already had its coup cannot take the civilian one.\n\nEverything above is visible in your decision tabs. Nothing here needs to be memorised - it is all written on the buttons."
 SAU_events.223.a: "Understood. Let us begin."
 SAU_tadawul_needs_market_tt: "§RRequires the Tadawul to be listed first§! - complete §HTadawul, The Saudi Stock Exchange§! and every focus in this branch will raise it a tier:"
 SAU_focus_655_choice_tt: "§YA choice follows§! - 'Full Anglo-Saxon - all instruments allowed' / 'Gradual - Western practice with Sharia veneer'."
 SAU_focus_654_choice_tt: "§YA choice follows§! - 'Strict orthodoxy - no compromise' / 'Pragmatic - lead the global Islamic finance market'."
 SAU_focus_653_choice_tt: "§YA choice follows§! - 'SAMA - independent secular regulator' / 'SAMA + Sharia council with binding veto' / 'Hybrid - two parallel structures'."
 SAU_focus_652_choice_tt: "§YA choice follows§! - 'Conventional interest-based interbank market' / 'Murabaha-based Islamic interbank market' / 'Hybrid - both, run separately'."
 SAU_focus_651_choice_tt: "§YA choice follows§! - 'Light regulation - allow derivatives and futures' / 'Strict prohibition - no gharar, no gambling' / 'Regulated derivatives only - balanced approach'."
 SAU_focus_650_choice_tt: "§YA choice follows§! - 'Modern fractional reserve - growth at the cost of stability' / 'Asset-backed only - stable but slower' / 'Moderate reserve requirements'."
 SAU_focus_649_choice_tt: "§YA choice follows§! - 'Allow conventional interest-bearing accounts' / 'Strict riba prohibition - Sharia is supreme' / 'Sukuk in public, pragmatic interest in private'."
 SAU_Conscript_The_Kingdom_choice_tt: "§YA choice follows§! - 'Universal service. Every man of age, no exemptions' / 'Selective service. The tribes keep their exemptions'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_Emegency_tribunal_choice_tt: "§YA choice follows§! - 'The princes. Let the country watch them account for it' / 'The dissidents. The files are already written' / 'Both. We did not seize the state to be selective'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_Defense_industries_act_choice_tt: "§YA choice follows§! - 'Licence the designs. We need production, not pride' / 'Build it ourselves, from the ore up'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_Maritical_law_issues_choice_tt: "§YA choice follows§! - 'The full apparatus. Curfew, tribunals, censors' / 'Emergency powers only. Leave the streets alone'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_Regency_decree_choice_tt: "§YA choice follows§! - 'A narrow regency. He keeps the throne and the Mosques' / 'A total regency. Every power, without exception' / 'A regency of five years. Put a date on it'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_the_succession_question_2_choice_tt: "§YA choice follows§! - 'Pension them, generously and permanently' / 'Exile the senior lines' / 'Prosecute, and confiscate what is found' / 'Leave them rich and ornamental'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_trials_of_the_old_order_choice_tt: "§YA choice follows§! - 'In open court, and televised' / 'Settle it in the Ritz, as before' / 'Pardons, at the going rate'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_The_silk_road_pivot_choice_tt: "§YA choice follows§! - 'Ports, rail and the northern corridor' / 'Capital, and no conditions attached'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_crackdown_on_the_opposition_choice_tt: "§YA choice follows§! - 'Begin with the Eastern Province committees' / 'Place the sermons under review' / 'Begin with the petition signatories' / 'Take all three files together'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_Guardians_of_the_two_mosques_choice_tt: "§YA choice follows§! - 'Stand behind the King. Borrow the title, do not take it' / 'The guardianship belongs to the state, not the man'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_Al_Madinah_province_secure_support_choice_tt: "§YA choice follows§! - 'Court them. Concede what has to be conceded' / 'Reassign the chairs. We need the wording now'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_Mecca_province_secure_support_choice_tt: "§YA choice follows§! - 'Pay the merchant houses. Buy the Hejaz properly' / 'Garrison it. They will adjust'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_Appoint_Loyalist_in_Privnces_choice_tt: "§YA choice follows§! - 'The senior princes. Their names still carry the country' / 'The overlooked cousins. Gratitude is cheaper than prestige' / 'The wealthy malcontents. Bring them in and audit them later'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_Disband_the_national_guard_choice_tt: "§YA choice follows§! - 'Absorb them. They can wear our uniform' / 'Dissolve the Guard entirely. Send them home' / 'Keep a rump, under our command'. It moves §Hthe officers' grip on the state and the junta's legitimacy§!."
 SAU_AlSaud_historical_19_choice_tt: "§YA choice follows§! - 'Then it is agreed. Put the question to them all' / 'The Kingdom will answer Yemen by itself'."
 SAU_AlSaud_historical_17_choice_tt: "§YA choice follows§! - 'Pump. The fields are the strategy' / 'Build the industry that outlives the wells' / 'Survey. There is more of it out there'."
 SAU_AlSaud_historical_16_choice_tt: "§YA choice follows§! - 'Thirty seats, by royal decree' / 'The chamber remains as it is'."
 SAU_AlSaud_historical_11_choice_tt: "§YA choice follows§! - 'Half the seats, and men on the rolls' / 'Appoint them all and call it consultation' / 'Put women on the rolls as well'."
 SAU_AlSaud_historical_9_choice_tt: "§YA choice follows§! - 'Take Washington's offer in full' / 'The Mabahith will handle its own' / 'Rehabilitate them. Prisons only make more'."
 SAU_AlSaud_historical_8_choice_tt: "§YA choice follows§! - 'Let them speak, and publish what they say' / 'They may convene. The agenda is ours'."
 SAU_AlSaud_historical_4_choice_tt: "§YA choice follows§! - 'Let the Allegiance Council rule on the succession' / 'The King names his heir. The Council will applaud him' / 'Buy the family's consent instead'."
 SAU_AlSaud_historical_3_choice_tt: "§YA choice follows§! - 'Reform as far as the ministries will bear it' / 'Only the name on the decrees has changed' / 'Open the economy and let the politics follow'."
 SAU_Faisaliste_25_choice_tt: "§YA choice follows§! - 'The Mosques are a duty, not a mandate' / 'We speak for the faithful'. It moves §Hthe Kingdom's course abroad§!."
 SAU_Faisaliste_24_choice_tt: "§YA choice follows§! - 'Fund it' / 'Staff it'."
 SAU_Faisaliste_23_choice_tt: "§YA choice follows§! - 'Send them home' / 'Naturalise the useful ones'. It moves §Hthe Kingdom's course abroad§!."
 SAU_Faisaliste_22_choice_tt: "§YA choice follows§! - 'Convene it in Mecca' / 'Convene it abroad'."
 SAU_Faisaliste_21_choice_tt: "§YA choice follows§! - 'Alms, freely given' / 'Aid with conditions'. It moves §Hthe Kingdom's course abroad§!."
 SAU_Faisaliste_20_choice_tt: "§YA choice follows§! - 'A strict quota' / 'A phased quota'."
 SAU_Faisaliste_19_choice_tt: "§YA choice follows§! - 'Bring it all home' / 'Leave it where it earns'. It moves §Hthe Kingdom's course abroad§!."
 SAU_Faisaliste_18_choice_tt: "§YA choice follows§! - 'Weapons first' / 'Everything else first'."
 SAU_Faisaliste_17_choice_tt: "§YA choice follows§! - 'The Self-Reliance Mandate' / 'Armed equidistance'. It moves §Hthe Kingdom's course abroad§!."
 SAU_Faisaliste_16_choice_tt: "§YA choice follows§! - 'Withdraw from what we did not write' / 'Work them from within'. It moves §Hthe Kingdom's course abroad§!."
 SAU_Faisaliste_15_choice_tt: "§YA choice follows§! - 'Threaten the embargo openly' / 'Apply it quietly'."
 SAU_Faisaliste_14_choice_tt: "§YA choice follows§! - 'Fortify the coast' / 'Fortify the interior'."
 SAU_Faisaliste_13_choice_tt: "§YA choice follows§! - 'Technical institutes' / 'Military academies'."
 SAU_Faisaliste_11_choice_tt: "§YA choice follows§! - 'Appoint by examination' / 'Appoint by loyalty'."
 SAU_Faisaliste_10_choice_tt: "§YA choice follows§! - 'Buy out their charters' / 'Replace them outright'."
 SAU_Faisaliste_7_choice_tt: "§YA choice follows§! - 'Strike the foreign colours. They go home' / 'The arrangement stands. Necessity permits what principle forbids'."
 SAU_Faisaliste_6_choice_tt: "§YA choice follows§! - 'Exile them' / 'Re-educate them'."
 SAU_Faisaliste_5_choice_tt: "§YA choice follows§! - 'Seal it entirely' / 'Admit whom we need'."
 SAU_Faisaliste_4_choice_tt: "§YA choice follows§! - 'Jam the satellites' / 'Buy the networks'."
 SAU_Faisaliste_3_choice_tt: "§YA choice follows§! - 'Let them patrol in force' / 'Keep them advisory'."
 SAU_Faisaliste_2_choice_tt: "§YA choice follows§! - 'Give them the courts' / 'Give them the schools'."
 SAU_Faisaliste_1_choice_tt: "§YA choice follows§! - 'Proclaim it from the pulpit' / 'Proclaim it from the palace'."
 SAU_focus_328_choice_tt: "§YA choice follows§! - 'The Anglo-Saxon framework' / 'The Sharia-first framework' / 'A hybrid model'."
 SAU_focus_327_choice_tt: "§YA choice follows§! - 'Independent technocrats' / 'Royal oversight is essential' / 'Bring in foreign experts'."
 SAU_AlSaud_historical_24_choice_tt: "§YThe reign is reshaped§! - the courts cut corruption, and tax and political power rise with them. §RInvestors price in the new risk§!, and the accused have friends."
 SAU_AlSaud_historical_25_choice_tt: "§YThe reign is reshaped§! - the purge buys political power, cheaper corruption and better intelligence. §RForeign capital reads it as expropriation§! and prices the Kingdom accordingly."
 SAU_AlSaud_historical_26_choice_tt: "§YThe reign is reshaped§! - returns, market income and investment all improve. §RCorruption deepens twice over§!, and the court pays for it in political power."
 SAU_unif_new_partners_choice_tt: "§YA choice follows§! - the Council picks a guarantor outside the Gulf: 'Turkey' / 'Iran' / 'India' / 'Pakistan' / 'Russia'. Whoever is chosen is asked to answer."
 SAU_unif_khaleeji_union_choice_tt: "§GThe Gulf becomes one state§! - every remaining GCC member is §Hannexed with its forces§!, their land is cored, and the Kingdom takes the name §HKhaleej§!."
 SAU_water_ras_al_khair: "§HRas Al-Khair Complex§!"
 SAU_water_ras_al_khair_desc: "On the Gulf coast north of Jubail the Kingdom pours concrete for a desalination and power complex on a scale nobody has attempted. It is state money, state land and state labour, and it will still be running when the men who signed for it are gone.\n\n§GBuilds a fossil-fuel power plant and infrastructure in Haasa§! and steadies the country.\n\n§RCosts 60bn§!. Built by the Kingdom, owned by the Kingdom."
 SAU_water_shuaibah_iwpp: "§HThe Shuaibah IWPP§!"
 SAU_water_shuaibah_iwpp_desc: "South of Jeddah a consortium takes the water and power plant on its own balance sheet and sells the output back to the Kingdom under a twenty-year contract. It is cheaper, it is faster, and the meter is read in another capital.\n\n§GBuilds a fossil-fuel power plant and energy infrastructure in Hejaz§!.\n\n§RCosts 30bn and deepens American influence§!. Half the price, and not entirely yours."
 SAU_Soverniy_saudi_company: "§HThe Sovereign Saudi Water Company§!"
 SAU_Soverniy_saudi_company_desc: "Whoever laid the pipe, the Kingdom now puts a single sovereign company over all of it - tariffs, reserves, allocation between the provinces. For the first time there is one desk where the question 'how much water does the Kingdom have' has an answer.\n\n§GOpens Sovereign Waters§!, the Kingdom's standing on water, and grants political power.\n\nIt does not make water. It makes the Kingdom accountable for it."
 SAU_water_pride_open_tt: "§YOpens Sovereign Waters§! - nine ranks from Catastrophic to Triumphant. It tracks §Hstability§!: a confident country believes the taps will run, a shaken one does not. It settles each month on its own."
 SAU_unif_road_still_open_tt: "§YThe Council has not yet turned elsewhere§! - asking new partners or declaring autonomy closes the American road permanently."
 SAU_unif_usa_refused_tt: "§YWashington has not already taken the Gulf under its wing§! - open if you never asked, or if the Americans §Rrefused§!."
 SAU_unif_partners_refused_tt: "§YNo outside partner has taken the Gulf under its wing§! - open if you never asked, or if they §Rrefused§!."
 SAU_unif_not_yet_autonomous_tt: "§YThe Council has not declared its independence§! - going it alone closes this road."
 SAU_unif_no_member_aligned_tt: "§YNo Council member has invited a foreign power in§! - Turkish or Indian bases, Russian advisors, outside security guarantees, arms purchases or foreign procurement all close this road."
 SAU_intel_surveillance_bypass_tt: "§YBypasses the agency's own requirements§! - no §HImproved Computing§! research and no §HForm Department§! upgrade needed"
 SAU_Intelligence_category_desc: "The General Intelligence Presidency (GIP) is the Kingdom's primary intelligence agency, responsible for both domestic and foreign intelligence gathering and analysis. It plays a crucial role in national security, counterterrorism, and strategic planning.\n\n§GUnlocking the GIP§! will allow you to make decisions that enhance your intelligence capabilities, providing valuable insights and advantages in both domestic and international affairs.\n\nA Decisions will Open when you Reach §G70%§! GIP Network Penetration in a Country, and will be more likely to appear the higher your penetration is. They will be unavailable if your penetration falls below 70%."
 SAU_Foregin_affairs_category_desc: "§G Saudi Arabia Foreign Affairs§!\nThe Kingdom's foreign policy is defined by a delicate diplomatic balancing act. As a regional power and the custodian of Islam's holiest sites, we must navigate complex alliances, secure our economic interests, and maintain stability in the Middle East. Whether we align closely with our traditional Western allies, pivot towards emerging Eastern markets, or assert ourselves as an independent regional hegemon, our diplomatic corps will pave the way.\n\n To Open More Decision Related to the Foregin Affairs, you must completed Focuses or get a Speical Event while moving forward\n\n All the Decisions will Show up Again after a year since you selection it."
 SAU_domestic_external_category_desc: "The Kingdom's levers over its home front, its oil, and its future beyond it.\n\n§HHow these decisions appear:§!\n§GDomestic§! measures - construction drives, the development fund and workforce reform - unlock with §Y'Economic Liberalization'§!.\n§GOil§! moves - raising output, new fields, conserving reserves, the oil embargo and the OPEC levers - unlock with §Y'Saudi Aramco'§! and its export doctrine.\n§GDiversification§! projects - PIF investment, giga-projects, renewables, the digital economy, tourism and the defence industry - unlock as you complete the §Y'Vision 2030'§! tree.\n\n§HSome decisions ask more of you:§! a §Ynew oil field§! needs the Aramco production strategy; the §Yoil embargo§! can only be proclaimed §Gin peacetime§! while your oil economy is running. Each costs time and treasury, and most push your §Hoil dependence§! up or down."
 SAU_vision2030_category_desc: "Saudi Arabia's giga-projects, each on its own deadline. Fund and finish them in time to make Vision 2030 a reality. Let the deadlines pass and the projects become costly monuments to ambition, dragging the Vision toward failure.\n\n There will be a Decisions to build each project, each Project have deadline when you hover around the Project, it update weakly if it is 1848, the next update for the Decision deadline will be 1841 (-7days)\n\n if you didn't do the project and deadline ended, it will result in debuff in the 2030 Vision, otherwise when you finished the project it will result in increase the buff instead"
 SAU_military_category_desc: "The long programme to rebuild the Kingdom's armed forces after the shock of §LOperation Desert Storm§! - from a military that needed §LAmerican§! airpower, logistics and command to fight, into a modern force and a true counterweight to §LIran§!.\n\n§HHow it works:§!\nEvery reform is a §Ydecision§! unlocked by a military §Yfocus§!. Each opens a §Gchoice of doctrines§! - and every doctrine is a deliberate §Rtrade-off§!, strengthening the forces one way while costing them another. You may re-run a reform later to §Yswitch doctrine§!.\n\n§HThe three Stages:§!\nReadiness advances in stages - §RUnmodernized§! to §YIn Reform§! to §YModernizing§! to §GModernized§!. Each Stage reveals its own batch of reforms, and you must §Ycomplete all of them§! before the next Stage will open. It all begins by winning the §LWar Games: Lessons of the Gulf§!.\n\nEvery doctrine you choose feeds into the §LThe Saudi Military§! national spirit, where the combined effect is shown."
 SAU_crown_prince_category_desc: "[ROOT.GetSAUSuccessionPanel]"
 SAU_king_abdullah_category_desc: "Abdullah holds the Kingdom from the opening year - regent while Fahd lives, King in his own right from 2005. His death in January 2015 resolves the succession race, and whichever of §YSalman§!, §YMohammed bin Nayef§! or §YMutaib§! gathered the most influence inherits both the throne and his own set of directives. Use the §YCrown Prince§! decisions during his reign to decide which. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_salman_category_desc: "Salman's reign opens a second contest, §YMohammed bin Salman§! against §YMohammed bin Nayef§!, settled in June 2017 - where you may crown the winner at once or leave him Crown Prince. If you wait, he takes the throne when the King's health finally fails, by 2032 at the latest. Watch it in the §YCrown Prince§! tab, and prop him up or wear him down as you please. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_mbs_category_desc: "Reached by backing Mohammed bin Salman in the Crown Prince race under King Salman, then either declaring him King outright in 2017 or waiting for Salman's health to fail. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_mbn_category_desc: "Reached two ways: push Mohammed bin Nayef ahead of Salman and Mutaib in the Abdullah-era succession race, or have him named Crown Prince under King Salman and outlive the King. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_mutaib_category_desc: "Reached only by winning the Abdullah-era succession race outright, ahead of both Salman and Mohammed bin Nayef - the outsider's path. No further succession is scripted beyond him. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_faisalite_category_desc: "Faisal ibn Abdulaziz was never an isolationist. He founded the Muslim World League, and when Al-Aqsa burned in 1969 he had the Muslim heads of state assembled at Rabat within weeks - the Organisation of the Islamic Conference was his doing. He opened the treasury to Egypt and Jordan at Khartoum after 1967, fought Nasser's expeditionary army to a standstill in the mountains of Yemen, chartered the Islamic Development Bank, and in 1973 turned the oil itself into a weapon and made the West feel it. Self-reliance was never his destination. It was his means - the strength a Kingdom needed before it could speak for the Ummah without asking anyone's leave.\n\nHis heirs inherit the doctrine without the man, and with it a question he never had to answer. §OIsolationism§! takes self-reliance as its own reward: a sealed frontier, no clients, no crusades, a Kingdom answerable to nobody. §RInterventionism§! takes it as Faisal did - a foundation, laid so that Riyadh may lead the faithful and stand armed between the blocs rather than behind either.\n\n§HWhere the Kingdom stands today§! - [ROOT.GetSAUFaisaliteLean]\n[ROOT.GetSAUFaisaliteLeanEffect]\n\n§HDirectives under way§!: §Y[?SAU_faisalite_active|0]§! of §Y2§!. Two may run at once, from either side, and each pays out only when it has run its course.\n\nFocuses, events and the decisions below all move these counts, and nothing here is bought cheaply. Whichever stands higher when the pillars are raised settles the last of them - §RThe Third Way Doctrine§! or §OSplendid Isolation§!."
 SAU_junta_category_desc: "The Council rules by two things and owns neither outright. §HControl§! is what it can enforce - the garrisons, the checkpoints, the files, the men who answer when called. §HLegitimacy§! is what it is owed, and it is owed nothing: no election, no fatwa, no succession, only the fact that the armour arrived first.\n\nEverything that raises one is paid for out of the other. Legitimacy falls by one every month regardless - a junta that simply governs quietly is a junta running out of time.\n\n§HAt zero, the Council has ninety days to find a reason to exist. If it cannot, the Kingdom will settle the question in the field.§!"
 SAU_officer_crisis_category_desc: "The regular army carried the cost of the crash and the National Guard did not, and the officer corps has worked out which of those facts is deliberate. None of this has to end in tanks on Olaya Street. It ends that way only if nothing is done about it.\n\n§HThe officer corps§! - [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! of §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]\n\nGrievance climbs every month on its own. Bring it all the way to §Y0§! and you can settle with the officers permanently; let it pass §Y75§! with the deployment order given and they will settle it themselves."
 SAU_modernisation_balance_of_power_category_desc: "Two visions struggle for the soul of the §LKingdom of Saudi Arabia§!. The §Rtraditionalist§! camp - the §LCouncil of Senior Scholars§!, the §Lroyal court§!, the §Ltribal elders§! - guards the old ways. The §Gliberalisation§! camp - the technocrats, the foreign-trained engineers, the §LVision 2030§! advocates - presses for openness, reform, and a place at the modern world's table. The balance shifts with every focus completed and every decision taken."
 SAU_spread_revolution_category_desc: "The People's Republic of Arabia is only the first spark. The revolution must spread until every Arab worker has thrown off his chains.\n\nThis category unlocks once §YThe People's Republic of Arabia§! is complete and a communist government rules. §YBroadcast the Revolution§! raises communist support inside Arab countries, while §YFound the Arab Comintern§! gathers fellow workers' states. A §YLaunch the Socialist Revolution§! decision stays §Rhidden§! on each Arab country until its communists reach §Y30%§! support, so keep broadcasting until it appears. Once it does, strike: at §Y50%§! or more the revolution seizes the state outright, while §Y30-50%§! ignites a revolutionary civil war. Fellow workers' states are never overthrown, only welcomed into the §YArab Comintern§! through §YInvite to the Arab Comintern§!."
 SAU_pipeline_sabotage_category_desc: "The Kingdom's oil leaves by pipeline, and so does everyone else's.\n\n§RStriking a rival's line raises the price of crude and the temperature of the region§! in equal measure."
 SAU_coalition_member_category_desc: "We answered Riyadh's invitation and our aircraft are in the rotation. What that is worth - and how long we intend to keep paying for it - is a question for us alone, and the door out is not locked."
 SAU_debug_category_desc: "Test tools for the succession, reign and King Salman health systems. This category only exists in a debug build - it is invisible in a normal launch and in multiplayer."
 SAU_proxy_aggression_desc: "We are bankrolling attacks against their people. They will not soon forget it."
 SAU_traditionalist_bop_left_side_desc: "The §LWahhabi clergy§!, conservative princes, and tribal sheikhs. They preserve the Kingdom's character but resist the changes the world demands."
 SAU_liberalisation_bop_right_side_desc: "The §Ltechnocrats§!, foreign-trained engineers, and reformist princes. They open the Kingdom's doors - at the cost of disturbing the established order."
 SAU_modernisation_bop_centre_range_desc: "Neither tradition nor reform dominates. The Kingdom holds steady - for now."
 SAU_traditionalist_bop_low_range_desc: "The clergy and conservatives have a §Yslight upper hand§!. The Kingdom moves cautiously."
 SAU_traditionalist_bop_medium_range_desc: "Tradition is the §Hguiding hand§!. Reform proposals are weighed against centuries of precedent - and usually found wanting."
 SAU_traditionalist_bop_advanced_range_desc: "The §LCouncil of Senior Scholars§! sets the agenda. Modernisers are §Ymarginalised§! or §Yexiled§!. The Kingdom looks inward."
 SAU_traditionalist_bop_win_range_desc: "The §Lulema§! rule in all but name. The world calls; the Kingdom does not answer. Tradition has §Rwon§!, and the price is paid in lost decades."
 SAU_liberalisation_bop_low_range_desc: "The reformers have a §Gtoehold§!. New offices, new schools, new ideas trickle through the cracks."
 SAU_liberalisation_bop_medium_range_desc: "The §LCrown Prince§!'s programme is the new orthodoxy. Universities expand, tourism opens, women drive."
 SAU_liberalisation_bop_advanced_range_desc: "Reform piles on reform. The §Lulema§! grumble; the §Ltribes§! grumble; but the §Gpace§! does not slow. The Kingdom is changing faster than its people can metabolise."
 SAU_liberalisation_bop_win_range_desc: "Saudi Arabia is §Gunrecognisable§! from the Kingdom of 2000. Foreign capital, foreign tourism, foreign culture. The reformers have §Gwon§! - but the §Yclerics§! have not forgotten."
 SAU_Monarchy_house_of_al_saud_desc: "The House of Al Saud is the ruling family of the Kingdom of Saudi Arabia. It was founded by Abdulaziz Ibn Saud in 1932 and has since maintained control over the country through a combination of political alliances, religious legitimacy, and economic power derived from oil wealth."
 SAU_Military_Rule_desc: "The Supreme Military Council governs the Kingdom. The throne remains, the ministries answer elsewhere, and the officers who took Riyadh are discovering that holding a country is considerably harder than seizing one."
 SAU_gip_network: "§HGIP Station Network§!"
 SAU_gip_network_tt: "Stations, cover and case officers - the Presidency's standing capability.\n"
 SAU_gip_slots_cap_tt: "§YThe Presidency can run at most 3 additional officers§! - the stations are built, and there are no more to open."
 SAU_stage1_decision_gate_tt: "§YThis decision appears once Stage I has begun.§!"
 SAU_stage2_decision_gate_tt: "§YThis decision appears once Stage II has begun.§!"
 SAU_stage3_decision_gate_tt: "§YThis decision appears once Stage III has begun.§!"
 SAU_vision2030_commitment_tt: "§RThe Kingdom is now committed: deliver the projects, or face the backlash of broken promises.§!"
 SAU_tadawul_matured_tt: "§GThe Tadawul has reached its full listing§! - the exchange cannot be raised further, so the flotation funds §Hnew office space§! instead:"