 SOV_npp_category_desc: "\n\n\n\n\n\n£SOV_desctext_npp \n\n\n\n\n\n\n\n\n현재의 경제 상황을 개선하기 위해 정부는 국가 프로젝트 계획을 시작했습니다. 이는 미래의 위대한 러시아를 건설하는 데 도움이 될 것입니다!\nNPP 구상을 완료하는 데 필요한 5개의 §Y국가 프로젝트§! 중 §G[?SOV.npp_completed]§!개를 완료했습니다."
