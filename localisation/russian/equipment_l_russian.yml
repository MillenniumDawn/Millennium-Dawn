 TAT_infantry_weapons_4_desc: "В 1991 году на заводе «Ижмаш» в Ижевске началось серийное производство модернизированного варианта АК-74 — АК-74М. Он оснащён облегчёнными затвором и затворной рамой, а также прикладом из стеклонаполненного полиамида."
 TAT_infantry_weapons_5: "АК-103"
 TAT_infantry_weapons_5_desc: "Штурмовая винтовка АК-103 является производной от АК-74М и использует патрон 7,62х39 мм M43. Подобно более старому АКМ, АК-103 может использовать различные прицелы, включая ночные и оптические, а также оснащаться штыком или подствольным гранатомётом. Отличием от большинства автоматов АК являются пластиковые и более дешёвые материалы, применённые в АК-103."
 TAT_infantry_weapons_6: "АК-12"
 TAT_infantry_weapons_6_desc: "АК-12 — новый российский автомат. Он был разработан в рамках программы экипировки солдата будущего «Ратник». Созданный для специализированных подразделений, он должен заменить производство АК-103. АК-12 имеет улучшенный баланс и эргономику, что делает его самым элитным российским автоматом на сегодняшний день."
 TAT_infantry_weapons_7: "АК-12М1"
 TAT_infantry_weapons_8: "АК-31"
 TAT_util_vehicle_8: "КАЗ «Дрозд-Б»"
 TAT_util_vehicle_8_desc: "После успешной презентации на «Армия-2020» амфибийный бронеавтомобиль «Дрозд» был отправлен на испытания, которые показали низкий уровень защиты этой машины. В результате появилась модификация «Дрозд-Б». Современный бронеавтомобиль способен преодолевать речные преграды и бездорожье, а также имеет низкую тепловую заметность. Рациональная V-образная форма днища из композитной брони обеспечивает повышенную защиту от мин."
 BSH_util_vehicle_8: "КАЗ «Дрозд-Б»"
 BSH_util_vehicle_8_desc: "После успешной презентации на «Армия-2020» амфибийный бронеавтомобиль «Дрозд» был отправлен на испытания, которые показали низкий уровень защиты этой машины. В результате появилась модификация «Дрозд-Б». Современный бронеавтомобиль способен преодолевать речные преграды и бездорожье, а также имеет низкую тепловую заметность. Рациональная V-образная форма днища из композитной брони обеспечивает повышенную защиту от мин."
 PMR_util_vehicle_4_desc: "Как и «Волк», может перевозить 8 человек, а также нести сверху крупнокалиберные пулемёты. Используется во главе колонн."
 C01_util_vehicle_9: "AMZ Żubr"
 infantry_weapons_type_desc: "Стрелковое оружие — это снаряжение стрелковых отделений: штурмовые винтовки, марксманские винтовки, снайперские винтовки, гранатомёты, безоткатные орудия, ручные пулемёты и бронежилеты."
 infantry_weapons_1_desc: "Стрелковое оружие — это снаряжение стрелковых отделений: штурмовые винтовки, марксманские винтовки, снайперские винтовки, гранатомёты, безоткатные орудия, ручные пулемёты и бронежилеты."
 H_infantry_weapons_type: "Тяжёлое вооружение"
 H_infantry_weapons_type_desc: "Тяжёлое пехотное вооружение — это пехотное оружие, для перемещения и применения которого требуется целый расчёт, например крупнокалиберные пулемёты и миномёты. Это оружие и обслуживающие его солдаты обычно сводятся в отделения огневой поддержки."
 H_infantry_weapons_1: "Тяж. оружие 1965"
 H_infantry_weapons_1_desc: "Тяжёлое пехотное вооружение — это пехотное оружие, для перемещения и применения которого требуется целый расчёт, например крупнокалиберные пулемёты и миномёты. Это оружие и обслуживающие его солдаты обычно сводятся в отделения огневой поддержки."
 ENG_transport_helicopter_1: "Westland Puma HC"
 ENG_transport_helicopter_1_short: "Puma HC"
 GER_transport_helicopter_1: "UH-1D"
 GER_transport_helicopter_1_desc: "UH-1D — это американский вертолёт UH-1 Iroquois / «Huey», производившийся по лицензии в тогдашней Западной Германии компанией Dornier Flugzeugwerke. UH-1D является многоцелевым транспортным вертолётом и используется для различных задач: от перевозки войск до транспортировки тяжёлых грузов. UH-1D был основным вертолётом вооружённых сил Западной Германии во время холодной войны и продолжал службу даже после объединения страны."
