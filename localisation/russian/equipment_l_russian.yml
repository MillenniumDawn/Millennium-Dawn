 SAO_infantry_weapons_4_desc: "M16A4 — четвёртое поколение серии M16. Она оснащена съёмной ручкой для переноски и четырьмя планками Пикатинни по всей длине для установки оптики и другого дополнительного оборудования. FN M16A4 с режимами огня «предохранитель/одиночный/отсечка очереди» стала штатным оружием Корпуса морской пехоты США. Армейские винтовки также оснащаются цевьём M5 RAS производства Knight's Armament Company, позволяющим крепить вертикальные рукоятки, лазерные целеуказатели, тактические фонари и другие аксессуары, благодаря чему в полевых уставах Армии США появилось обозначение M16A4 MWS (Modular Weapon System — модульная система оружия)."
 SAO_infantry_weapons_5_desc: "Карабин M4 — более короткий и лёгкий вариант штурмовой винтовки M16. M4 — магазинный карабин под патрон 5,56x45 мм НАТО с воздушным охлаждением и газоотводной автоматикой с прямым воздействием пороховых газов на затворную раму. Он имеет ствол длиной 14,5 дюйма (370 мм) и телескопический приклад."
 CAM_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
