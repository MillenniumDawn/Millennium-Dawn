 EST_rural_unemployment: "농촌 실업"
 EST_rural_unemployment_desc: "에스토니아 농촌 지역의 만성적인 저개발은 파괴적인 실업의 악순환을 낳았습니다. 우리의 교구, 마을, 지방 자치체는 늘어나는 실업으로 어려움을 겪고 있으며, 이는 지역 자원을 고갈시키고 사회 복지 제도에 끊임없이 커지는 부담을 지우고 있습니다. 개입이 없다면 이러한 공동체는 영구적인 경제적 불모지가 될 위험이 있습니다."
 EST_crippling_unemployment: "주체할 수 없는 실업률"
 EST_crippling_unemployment_desc: "러시아의 금융 위기는 우리가 모스크바에 대한 경제적 의존을 줄이려 하는 가운데 우리 경제에 파괴적인 충격파를 보냈습니다. 이 위기는 연쇄적인 기업 도산과 대규모 해고를 촉발했고, 이전에 번창하던 우리 경제를 거의 마비 상태로 몰아넣었습니다. 여러 차례의 정책 개입에도 불구하고 우리는 높아지는 실업의 물결을 막지 못했습니다. 단호한 조치가 없다면 이 경제적 마비는 우리 국가 경제의 장기적인 구조적 약점이 될 위험이 있습니다."
 EST_population_decline: "인구 감소"
 EST_population_decline_desc: "독립 이후 우리는 인구 감소가 제기하는 문제와 싸워 왔습니다. 이민은 사상 최저 수준이고, 사람들은 일자리를 찾아 나라를 떠나며, 하루하루 태어나는 사람은 줄고 있습니다. 이 속도로 계속 간다면, 우리가 다스릴 에스토니아가 남아 있지 않을지도 모릅니다."
 EST_pop_stagnation: "인구 정체"
 EST_pop_stagnation_desc: "기적처럼 우리는 감소를 멈출 수 있었고, 현재 우리의 인구 증가는 오르지도 내리지도 않고 정체되어 있습니다."
 EST_widespread_alcoholism: "만연한 알코울 중독"
 EST_widespread_alcoholism_desc: "경제적 어려움으로 인해 많은 국민이 술에서 위안을 찾게 되었고, 이는 우리 경제에 영향을 미치고 있지만, 무엇보다도 많은 이들의 가정생활에 영향을 미치고 있습니다."
 EST_taxed_alc_consumpt: "주류 소비세"
 EST_taxed_alc_consumpt_desc: "최근의 주류세로 소비가 급감했지만, 우리 정부에는 다소 안정적인 수입원도 생겼습니다."
 EST_pop_boost: "인구 증가"
 EST_pop_boost_desc: "우리는 불가능을 해냈으며 훌륭한 사회·경제 정책을 통해 인구 증가를 이루어 냈습니다. 이 정책은 이민자들을 끌어들였을 뿐 아니라, 에스토니아인들이 더는 자신의 재정 상태를 걱정하지 않게 되어 아이를 낳도록 장려하기도 했습니다."
