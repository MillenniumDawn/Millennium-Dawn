 module_naval_asw_nuclear_torpedoes_5: "Torpilles nucléaires ASW V"
 module_naval_asw_nuclear_torpedoes_5_desc: "Les torpilles ASM nucléaires combinent des profils de lancement anti-sous-marins et une ogive exceptionnellement puissante pour maximiser la létalité contre les cibles immergées.\n\n§GIndice du concepteur : les torpilles ASM nucléaires offrent une lutte anti-sous-marine exceptionnelle pour détruire les sous-marins détectés. Conviennent aux chasseurs de sous-marins dédiés, mais coûtent plus de CI et de main-d'œuvre que les torpilles ASM conventionnelles.§!"
 module_naval_asw_nuclear_torpedoes_6: "Torpilles ASM nucléaires VI"
 module_naval_asw_nuclear_torpedoes_6_desc: "Les torpilles ASM nucléaires combinent des profils de lancement anti-sous-marins et une ogive exceptionnellement puissante pour maximiser la létalité contre les cibles immergées.\n\n§GIndice du concepteur : les torpilles ASM nucléaires offrent une lutte anti-sous-marine exceptionnelle pour détruire les sous-marins détectés. Conviennent aux chasseurs de sous-marins dédiés, mais coûtent plus de CI et de main-d'œuvre que les torpilles ASM conventionnelles.§!"
 module_anti_ship_torpedoes_7: "Torpilles à double usage VII"
 module_anti_ship_torpedoes_7_desc: "Les torpilles duales du futur proche représentent le pinacle de la technologie des torpilles, combinant guidage assisté par IA, vitesse extrême et systèmes avancés de contre-contre-mesures pour dominer les champs de bataille sous-marins et de surface.\n\n§GIndice du concepteur : les torpilles duales offrent une attaque de torpille contre les navires de surface et une lutte anti-sous-marine contre les sous-marins. Armement flexible à coût de CI modéré, mais moins spécialisées que les armes ASM dédiées.§!"
 module_anti_ship_torpedoes_8: "Torpilles à double usage VIII"
 module_anti_ship_torpedoes_8_desc: "Les torpilles duales du futur proche représentent le pinacle de la technologie des torpilles, combinant guidage assisté par IA, vitesse extrême et systèmes avancés de contre-contre-mesures pour dominer les champs de bataille sous-marins et de surface.\n\n§GIndice du concepteur : les torpilles duales offrent une attaque de torpille contre les navires de surface et une lutte anti-sous-marine contre les sous-marins. Armement flexible à coût de CI modéré, mais moins spécialisées que les armes ASM dédiées.§!"
 module_aa_guns_6: "Canons anti-aériens VI"
 module_aa_guns_6_desc: "Les canons antiaériens hyperavancés combinent capacité de tir rapide, réseaux de capteurs intégrés et précision supérieure pour une défense aérienne complète contre menaces aériennes modernes et émergentes.\n\n§GIndice du concepteur : les canons antiaériens améliorent la DCA et le blindage, utiles pour les navires nécessitant une protection dédiée contre les avions ennemis.§!"
 module_aa_guns_7: "Canons anti-aériens VII"
 module_aa_guns_7_desc: "Les canons antiaériens ultra-avancés combinent capacité de tir rapide, réseaux de capteurs intégrés et précision supérieure pour une défense aérienne complète contre menaces aériennes modernes et émergentes.\n\n§GIndice du concepteur : les canons antiaériens améliorent la DCA et le blindage, utiles pour les navires nécessitant une protection dédiée contre les avions ennemis.§!"
 module_radar_8: "Radar VIII"
 module_radar_8_desc: "La technologie radar hyperavancée intègre fusion de capteurs en réseau, détection à portée extrême et priorisation automatisée des menaces, représentant le pinacle des capacités navales de détection et d'acquisition de cibles.\n\n§GIndice du concepteur : le radar améliore la détection de surface et de sous-marins tout en renforçant les missiles antinavires, l'attaque de torpille et la DCA. Convient aux navires de combat polyvalents, mais coûte plus de CI et de puces que le sonar.§!"
 module_radar_9: "Radar IX"
 module_radar_9_desc: "La technologie radar ultra-avancée intègre fusion de capteurs en réseau, détection à portée extrême et priorisation automatisée des menaces, représentant le pinacle des capacités navales de détection et d'acquisition de cibles.\n\n§GIndice du concepteur : le radar améliore la détection de surface et de sous-marins tout en renforçant les missiles antinavires, l'attaque de torpille et la DCA. Convient aux navires de combat polyvalents, mais coûte plus de CI et de puces que le sonar.§!"
