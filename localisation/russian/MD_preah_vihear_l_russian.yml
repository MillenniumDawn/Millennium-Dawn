 preah_vihear.40.t: "Инцидент во время тренировки на границе"
 preah_vihear.40.d: "В ходе учений с боевой стрельбой вблизи границы произошел инцидент. Была повреждена техника, несколько военнослужащих признаны непригодными к службе, и эта неудача подорвала доверие к программе боеготовности."
 preah_vihear.40.a: "Учитесь на своих ошибках."
 preah_vihear.41.t: "Провокация имеет обратный эффект."
 preah_vihear.41.d: "Последняя волна риторики и перемещений войск привлекла нежелательное внимание внутри страны. Оппозиционные деятели и пресса задаются вопросом, не создает ли правительство кризис, который оно не может контролировать, и ему пришлось снизить накал страстей."
 preah_vihear.41.a: "Обратите внимание на урок"
 preah_vihear.110.t: "Коммюнике Ноппадон"
 preah_vihear.110.d: "Министр иностранных дел Ноппадон Паттама подписал совместное коммюнике в поддержку заявки Камбоджи на включение острова Преах Вихеар в список объектов Всемирного наследия ЮНЕСКО, документ, который с тех пор вызвал бурю негодования внутри страны. Конституционный суд рассматривает вопрос о том, было ли соглашение заключено без надлежащего одобрения парламента, а националистически настроенные критики требуют отставки министра."
 preah_vihear.110.a: "Поддерживайте коммюнике"
 preah_vihear.110.b: "Откажитесь от этого и отпустите министра."
 preah_vihear.111.t: "Таксин в Пномпене"
 preah_vihear.111.d: "Премьер-министр Хун Сен назначил беглого Таксина Шинаватру своим личным экономическим советником, что является преднамеренным оскорблением правительства в Бангкоке. Камбоджа отказалась рассматривать вопрос об экстрадиции, и это назначение стало поводом для сплочения по обе стороны границы."
 preah_vihear.111.a: "Отзовите нашего посла"
 preah_vihear.111.b: "Подать только официальный протест"
 preah_vihear.112.t: "Желтые рубашки на границе"
 preah_vihear.112.d: "Народный альянс за демократию воспринял пограничный спор как новое свидетельство того, что правительство слишком тесно связано с Пномпенем и слишком мягко относится к национальному суверенитету. Митинги у Дома правительства не показывают признаков сокращения числа участников."
 preah_vihear.112.a: "Пережить протесты"
 preah_vihear.120.t: "Спор дошёл до Совета Безопасности ООН."
 preah_vihear.120.d: "Пограничный кризис обострился до такой степени, что теперь он включен в повестку дня Совета Безопасности. Государства-члены призвали обе стороны к сдержанности, хотя никаких обязательных к исполнению мер не ожидается."
 preah_vihear.120.a: "Обратите внимание на ход разбирательства."
 preah_vihear.121.t: "Индонезия предлагает наблюдателей."
 preah_vihear.121.d: "Будучи председателем АСЕАН, Индонезия предложила направить невооруженных наблюдателей для мониторинга границы и составления отчетов о нарушениях режима прекращения огня. Джакарта позиционирует это как шаг к укреплению доверия, а не как урегулирование спора путем посредничества."
 preah_vihear.121.a: "Примите наблюдателей"
 preah_vihear.121.b: "Отклонить предложение"
 preah_vihear.130.t: "Решающее поражение"
 preah_vihear.130.d: "Противоположная сторона одержала решающую победу в противостоянии у Преах-Вихеара и теперь использует все дипломатические и пропагандистские каналы, чтобы закрепить унижение. Передача территории не произошла, но наши позиции на границе выглядят слабее, чем за последние годы."
 preah_vihear.130.a: "Примите эту неудачу на данный момент."
 preah_vihear.130.b: "Готовьтесь к полномасштабной войне"
 preah_vihear.131.t: "Обрыв исчез"
 preah_vihear.131.d: "Тайские войска захватили спорную территорию, и Бангкок официально аннексировал Северную кхмерскую провинцию, включая храм. Решение 1962 года, которое должно было быть нашим, ничего не значит против войск на высотах. Страна в шоке и требует ответа, который мы, возможно, не сможем дать."
 preah_vihear.131.a: "Мрачный день для страны"
 preah_vihear.131.b: "Мы заберём его обратно."
