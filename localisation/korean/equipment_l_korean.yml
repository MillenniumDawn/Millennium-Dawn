 UKR_cnc_equipment_1: "R-140U"
 UKR_cnc_equipment_1_desc: "소련 붕괴 이후 우크라이나가 물려받은 소련 시대의 구형 지휘통제용 무전국입니다. 1990년대 내내 여단 및 군 단위 통신의 근간으로 널리 사용되었습니다."
 UKR_cnc_equipment_2: "R-145BM"
 UKR_cnc_equipment_2_desc: "R-145BM 지휘 차량을 기반으로 한 1세대 체계입니다. 대대 및 여단급 지휘소에 기본적인 음성 및 데이터 통신을 제공합니다."
 UKR_cnc_equipment_3: "R-161A2 아르체울"
 UKR_cnc_equipment_3_desc: "우크라이나의 R-161A2 디지털 무전 복합체계를 기반으로 한 2세대 체계입니다. 소련 시대 체계보다 향상된 암호화, 신뢰성, 상호운용성을 제공합니다."
 UKR_cnc_equipment_4: "R-162-01"
 UKR_cnc_equipment_4_desc: "보안 디지털 무전기, 전장 센서, 초기 단계의 자동화 지휘 요소를 통합한 체계입니다."
 UKR_cnc_equipment_5: "아셀산–모토로라"
 UKR_cnc_equipment_5_desc: "서방의 전술 무전기와 컴퓨터, 나토 호환 통신 표준을 통합한 체계입니다."
 UKR_cnc_equipment_6: "델타 BMS"
 UKR_cnc_equipment_6_desc: "우크라이나의 '델타' 전장 관리 플랫폼을 중심으로 한 체계로, 실시간 상황 인식과 네트워크 중심전을 가능하게 합니다."
 SOV_cnc_equipment_1: "R-140M"
 SOV_cnc_equipment_1_desc: "군 및 전선 단위에서 사용된 냉전 시대의 장거리 지휘 통제 무선국입니다. 소련 전략 및 작전 통신의 근간 역할을 했으며, 소련 붕괴 이후에도 제한적으로 운용되었습니다."
 SOV_cnc_equipment_2: "R-145BM"
 SOV_cnc_equipment_2_desc: "R-145BM 지휘 차량을 기반으로 한 1세대 체계입니다. 대대 및 여단급 지휘소를 위한 기본적인 HF 및 VHF 통신을 제공합니다."
 SOV_cnc_equipment_3: "R-168 '아크베둑'"
 SOV_cnc_equipment_3_desc: "소련 시대 장비를 대체하기 위해 설계된 2세대 디지털 무전 체계입니다. 암호화된 음성 통신과 제한적인 데이터 전송 기능을 도입했습니다."
 SOV_cnc_equipment_4: "R-149MA1"
 SOV_cnc_equipment_4_desc: "디지털 무전기, 자동화된 지휘 요소, 전장 데이터 교환 기능을 통합한 지휘 차량입니다."
 SOV_cnc_equipment_5: "ESU TZ '소즈베즈디예-M2'"
 SOV_cnc_equipment_5_desc: "대대에서 여단급까지의 부대를 통합하여 러시아 네트워크 중심전 개념의 핵심을 이루는 체계입니다."
 SOV_cnc_equipment_6: "안드로메다-D"
 SOV_cnc_equipment_6_desc: "신속한 전개와 여러 군종과의 통합을 위해 설계된 공중 및 합동군 지휘 체계입니다."
 artillery_6: "야포 2065"
 artillery_6_desc: "강력한 간접 사격 능력을 갖춘 포병은 전장에서 필요한 곳에, 그리고 시야 밖 먼 거리까지 지속적인 정밀 타격을 제공합니다. 포병 자체 승무원이 직접 재장전할 수 있습니다. 이동에 외부 차량이 필요하기 때문에 타격 사이의 이동이 어려울 수 있으며, 이로 인해 적 포병의 대포병 사격에 취약합니다. 경량 소구경 체계는 인력으로 끌고 다닐 수 있으며 수송기 내부에 탑재할 수 있어 공수 작전에 적합합니다."
 Anti_tank_9: "대전차 유도 미사일(ATGM) 2075"
 Anti_tank_9_desc: "대전차 유도 미사일은 중장갑 차량을 공격하도록 특별히 설계된 고폭 탄두를 사용하는 휴대용 미사일 체계입니다."
 Heavy_Anti_tank_9: "차량 탑재 ATGM 2075"
 Heavy_Anti_tank_9_desc: "중형 대전차 유도 미사일 체계는 더 긴 사거리와 더 큰 미사일 탄두 중량을 갖습니다. 이로 인해 늘어난 무게 때문에 휴대하기에 적합하지 않아 차량에 탑재됩니다. 중장갑 차량을 공격하도록 특별히 설계된 고폭 탄두를 사용합니다."
