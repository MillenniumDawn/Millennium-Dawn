 EGY_gp_status_awaiting: "Awaiting funds"
 EGY_the_question_of_2011: "The Question of 2011"
 EGY_the_question_of_2011_desc: "The regime has survived the street, but Mubarak's fifth term ends this year, when he will be 83. Every faction is asking who comes next: his son, his spymaster, or the president himself once more."
 EGY_gamals_moment: "Gamal's Moment"
 EGY_gamals_moment_desc: "The New Guard dominates the cabinet and the party. Gamal Mubarak tours the country, chairs conferences, and prepares to step out of his father's shadow."
 EGY_the_generals_succession: "The General's Succession"
 EGY_the_generals_succession_desc: "The security establishment closes ranks behind Omar Suleiman. The army and the intelligence service will not allow the presidency to pass to a civilian."
 EGY_the_sixth_term: "The Sixth Term"
 EGY_the_sixth_term_desc: "No heir is ready, and the factions cannot agree on one. Mubarak will run again for a sixth term."
 EGY_the_old_guard_restored: "The Old Guard Restored"
 EGY_the_old_guard_restored_desc: "The president has had enough of his son's reformers. Veterans of the NDP and the state apparatus return to the posts they held before Gamal's men pushed them aside."
 EGY_safwat_el_sherif_returns: "Safwat el-Sherif Returns"
 EGY_safwat_el_sherif_returns_desc: "Safwat el-Sherif ran the NDP machine and the state media for three decades. As secretary-general again, he rebuilds the patronage networks that win elections in the provinces."
 EGY_zakaria_azmis_palace: "Zakaria Azmi's Palace"
 EGY_zakaria_azmis_palace_desc: "Zakaria Azmi, chief of the presidential staff, decides who reaches the president and which files cross his desk. Power flows back to Abdeen and Heliopolis, away from the party."
 EGY_dissolve_the_policies_secretariat: "Dissolve the Policies Secretariat"
 EGY_dissolve_the_policies_secretariat_desc: "The Policies Secretariat was Gamal's base inside the NDP. Closing it ends the New Guard as an organised faction and returns policy to the cabinet and the presidency."
 EGY_absorb_the_policies_secretariat: "Absorb the Policies Secretariat"
 EGY_absorb_the_policies_secretariat_desc: "The secretariat's economists are too useful to lose. They are folded into the ministries as advisers, without a power base of their own."
 EGY_the_loyal_opposition: "The Loyal Opposition"
 EGY_the_loyal_opposition_desc: "The Wafd and Tagammu receive seats, licences and newspapers in exchange for their loyalty. A tame legal opposition leaves the Brotherhood less room to claim it is the only alternative."
 EGY_the_2015_parliamentary_elections: "The 2015 Parliamentary Elections"
 EGY_the_2015_parliamentary_elections_desc: "The NDP avoids the open fraud of 2010 and leaves room for the licensed parties. The result is never in doubt, but this time it is harder to dispute."
 EGY_the_rais_above_parties: "The Rais Above Parties"
 EGY_the_rais_above_parties_desc: "Mubarak stands above the party system and every faction in it. Foreign capitals that hoped to steer Egypt's succession find no one to deal with but the president himself."
 EGY_the_arbiter_of_the_pillars: "The Arbiter of the Pillars"
 EGY_the_arbiter_of_the_pillars_desc: "The army, the intelligence service and the Interior Ministry each answer to the president alone. Mubarak keeps them in balance, and none of them is allowed to grow strong enough to replace him."
 EGY_the_old_field_marshal: "The Old Field Marshal"
 EGY_the_old_field_marshal_desc: "Field Marshal Tantawi has served as defence minister since 1991. Keeping him in post reassures the senior officers that their place in the state is safe."
 EGY_promote_the_young_generals: "Promote the Young Generals"
 EGY_promote_the_young_generals_desc: "Officers such as Sami Anan and Abdel Fattah el-Sisi are promoted over the heads of Tantawi's generation. A younger command owes its rise to the president, not to the field marshal."
 EGY_rebuild_state_security: "Rebuild State Security"
 EGY_rebuild_state_security_desc: "The January unrest showed how thin the State Security Investigations Service had become. New funds, recruits and files restore its reach into every mosque, campus and factory."
 EGY_army_contracts_for_loyalty: "Army Contracts for Loyalty"
 EGY_army_contracts_for_loyalty_desc: "The National Service Projects Organisation receives road, housing and food contracts without tender. The officer corps profits from the regime and has every reason to keep it in place."
 EGY_pay_the_csf_conscripts: "Pay the CSF Conscripts"
 EGY_pay_the_csf_conscripts_desc: "The 1986 mutiny of the Central Security Forces started over pay. Better wages and rations for the riot police conscripts make sure they stay on the regime's side of the barricades."
 EGY_the_sinai_tribal_compact: "The Sinai Tribal Compact"
 EGY_the_sinai_tribal_compact_desc: "Bedouin sheikhs in North Sinai receive jobs, land titles and a share of the smuggling trade. In return they police the jihadist cells hiding in their territory."
 EGY_the_lessons_of_january: "The Lessons of January"
 EGY_the_lessons_of_january_desc: "The security services study how the protest networks of 2011 organised online and in the mosques. Informants and monitoring now reach the groups before they reach the street."
 EGY_the_pillars_hold: "The Pillars Hold"
 EGY_the_pillars_hold_desc: "Army, intelligence and police have each been rewarded and each been watched. As long as the president holds the balance, no pillar can move against him."
 EGY_the_state_provides: "The State Provides"
 EGY_the_state_provides_desc: "Mubarak was never a convert to his son's free-market reforms. The Ministry of Social Solidarity again becomes the regime's main tool for keeping the poor quiet."
 EGY_sack_the_businessmen_ministers: "Sack the Businessmen Ministers"
 EGY_sack_the_businessmen_ministers_desc: "Tycoons such as Rachid Mohamed Rachid and Ahmed el-Maghrabi ran the ministries that regulated their own companies. Their dismissal is presented as a fight against corruption."
 EGY_the_fifteen_percent_raise: "The Fifteen Percent Raise"
 EGY_the_fifteen_percent_raise_desc: "Six million state employees receive a fifteen percent pay rise. The budget suffers, but the civil service remains the regime's most dependable constituency."
 EGY_toshka_second_phase: "Toshka: The Second Phase"
 EGY_toshka_second_phase_desc: "Mubarak's flagship desert project has never met its targets. New pumping stations and canals extend reclamation deeper into the New Valley."
 EGY_halt_the_privatisation_drive: "Halt the Privatisation Drive"
 EGY_halt_the_privatisation_drive_desc: "No more public companies will be sold. The remaining state firms are kept, recapitalised and told to hire."
 EGY_renationalise_the_failed_sales: "Renationalise the Failed Sales"
 EGY_renationalise_the_failed_sales_desc: "The courts have ruled that the sales of Omar Effendi and Tanta Flax were illegal. The state takes the firms back and reopens their shuttered factories."
 EGY_expand_the_ration_cards: "Expand the Ration Cards"
 EGY_expand_the_ration_cards_desc: "Millions of families left off the ration card registers are added back. Subsidised sugar, oil and rice reach the households that rioted for bread in 2008."
 EGY_east_owainat_wheat: "East Owainat Wheat"
 EGY_east_owainat_wheat_desc: "Centre-pivot farms in the far south-west draw on fossil groundwater to grow wheat. Every tonne grown at home is a tonne Egypt does not have to buy abroad."
 EGY_the_ain_sokhna_industrial_zone: "The Ain Sokhna Industrial Zone"
 EGY_the_ain_sokhna_industrial_zone_desc: "State-owned steel, cement and fertiliser plants are built around the Red Sea port of Ain Sokhna. Industry follows a state plan, not the stock market."
 EGY_cairo_metro_line_four: "Cairo Metro Line Four"
 EGY_cairo_metro_line_four_desc: "A Japanese-financed line will link Giza and the pyramids to New Cairo. Construction employs thousands and opens land for new public housing along the route."
 EGY_the_paternal_economy: "The Paternal Economy"
 EGY_the_paternal_economy_desc: "The state employs, feeds and houses its citizens, and in return it collects its due. The bargain is old, but it has kept Mubarak in power for thirty years."
 EGY_the_elder_statesman: "The Elder Statesman"
 EGY_the_elder_statesman_desc: "Mubarak has outlasted most Arab rulers of his generation. Presidents and kings in a region shaken by revolt still turn to Cairo."
 EGY_the_libyan_question: "The Libyan Question"
 EGY_the_libyan_question_desc: "Revolt across the western border threatens a million Egyptian workers in Libya and opens a smuggling route for weapons. The army reinforces Salloum and the desert crossings."
 EGY_king_abdullahs_friend: "King Abdullah's Friend"
 EGY_king_abdullahs_friend_desc: "King Abdullah of Saudi Arabia stood by Mubarak through the January crisis. Riyadh rewards a regime that survived the storm with deposits and oil on credit."
 EGY_the_western_capitals: "The Western Capitals"
 EGY_the_western_capitals_desc: "The January crisis shook every Western government that had backed Mubarak for thirty years. The President flies to Washington, Paris, Berlin and London to show that Cairo is stable and still open for business."
 EGY_mediate_in_tripoli: "Mediate in Tripoli"
 EGY_mediate_in_tripoli_desc: "Egyptian envoys shuttle between Tripoli and Benghazi. Whoever wins the Libyan war will owe something to Cairo."
 EGY_partner_against_the_islamic_state: "Partner Against the Islamic State"
 EGY_partner_against_the_islamic_state_desc: "When Washington forms a coalition against the Islamic State, Cairo joins at once. Our officers share intelligence on the Sinai and Libya, and our army trains alongside coalition forces."
 EGY_release_the_held_deliveries: "Release the Held Deliveries"
 EGY_release_the_held_deliveries_desc: "After the crackdown of 2011, Congress froze deliveries of Apache helicopters, F-16 fighters, Harpoon missiles and Abrams tank kits. Our generals lobby the Pentagon to send them on, arguing that Egypt cannot fight terrorism with empty hangars."
 EGY_the_deauville_partnership: "The Deauville Partnership"
 EGY_the_deauville_partnership_desc: "At Deauville in May 2011 the G8 pledged billions to the Arab countries in transition, and the European Bank for Reconstruction and Development extended its mandate to Egypt. Cairo presents its survival as stability worth investing in."
 EGY_the_siemens_megadeal: "The Siemens Megadeal"
 EGY_the_siemens_megadeal_desc: "Blackouts plague Egyptian summers. We place the largest order in Siemens history for gas-fired power plants at Beni Suef, Burullus and the New Capital, backed by German export credit."
 EGY_gatekeeper_of_the_mediterranean: "Gatekeeper of the Mediterranean"
 EGY_gatekeeper_of_the_mediterranean_desc: "Europe fears a new wave of boats from our northern coast. A strict anti-smuggling law and new coast guard patrols close the route, and we ask Rome, Paris, Madrid, Athens, Valletta and Nicosia to share the cost."
 EGY_the_cairo_arab_summit: "The Cairo Arab Summit"
 EGY_the_cairo_arab_summit_desc: "Arab leaders gather in Cairo under Mubarak's chairmanship. The summit restores the Arab League as a club of rulers that protect one another."
 EGY_the_dean_of_arab_rulers: "The Dean of Arab Rulers"
 EGY_the_dean_of_arab_rulers_desc: "After thirty years in power, Mubarak is the senior figure of the Arab world. His word carries weight from Rabat to Baghdad."
 EGY_the_eternal_rais: "The Eternal Rais"
 EGY_the_eternal_rais_desc: "Party, army, economy and diplomacy all lead back to one man. The question of who comes after Mubarak remains open, but as long as he lives, nobody dares to ask it."
 EGY_question_of_2011_tt: "The §YSuccession Question§! decides which path opens. §YGamal's Moment§! needs the New Guard at §Y30§! or more. §YThe General's Succession§! needs the Old Guard at §Y30§! or more, or §YSuleiman§! as vice president. §YThe Sixth Term§! needs the balance to stay contested.\n"
 EGY_question_of_2011_unlocked_tt: "Unlocks the focus §YThe Question of 2011§!.\n"
 EGY_gamal_sworn_in_tt: "§YGamal Mubarak§! succeeds his father as President and gains the §YGamal's Presidency§! modifier.\n"
 EGY_securing_the_presidency: "Securing the Presidency"
 EGY_securing_the_presidency_desc: "The army, General Intelligence and the Interior Ministry each have reasons to doubt the new president. Before anything else, we must decide how to deal with the men who guard the regime."
 EGY_tantawis_bargain: "Tantawi's Bargain"
 EGY_tantawis_bargain_desc: "Field Marshal Mohamed Hussein Tantawi has run the Ministry of Defence since 1991. We keep him in office and leave the armed forces' budget, factories and land untouched. In return, the army salutes its new commander-in-chief."
 EGY_retire_the_field_marshal: "Retire the Field Marshal"
 EGY_retire_the_field_marshal_desc: "Tantawi is in his late seventies and opposed every privatization the New Guard put forward. We retire him with full honors and give the ministry to a younger officer who owes his promotion to the president."
 EGY_el_adlys_interior_ministry: "El-Adly's Interior Ministry"
 EGY_el_adlys_interior_ministry_desc: "Habib el-Adly has led the Interior Ministry since 1997 and backed Gamal's rise when the generals would not. His police and State Security Investigations become the new president's shield."
 EGY_the_republican_guard_command: "The Republican Guard Command"
 EGY_the_republican_guard_command_desc: "The Republican Guard protects the presidential palaces and the capital. We place it under officers personally loyal to the president and give it the best equipment the army has."
 EGY_keep_suleiman_at_the_gis: "Keep Suleiman at the GIS"
 EGY_keep_suleiman_at_the_gis_desc: "Omar Suleiman has run General Intelligence since 1993 and handled the Gaza, Israel and Sudan files for the old president. We keep him where he is, valued and watched."
 EGY_pension_off_the_spymaster: "Pension Off the Spymaster"
 EGY_pension_off_the_spymaster_desc: "Suleiman was the security establishment's candidate for the succession. We thank him for his service, retire him, and give General Intelligence to a director chosen by the president."
 EGY_officers_pay_and_housing: "Officers' Pay and Housing"
 EGY_officers_pay_and_housing_desc: "Officers expect apartments in the new military cities, cars, and a post in a state company after retirement. A raise for the officer corps reminds them that the new president looks after his army."
 EGY_respect_the_army_economy: "Respect the Army's Economy"
 EGY_respect_the_army_economy_desc: "Through the National Service Projects Organization and the Ministry of Military Production, the armed forces run factories, farms, hotels and construction firms. We leave this empire alone and hand it new contracts."
 EGY_audit_the_nspo: "Audit the NSPO"
 EGY_audit_the_nspo_desc: "The army's companies pay no taxes, publish no accounts and compete unfairly with private business. We order the Central Auditing Organization to examine the National Service Projects Organization's books."
 EGY_the_generals_accept_the_heir: "The Generals Accept the Heir"
 EGY_the_generals_accept_the_heir_desc: "The officer corps has made its peace with a civilian president. The threat of a coup recedes, and the presidency can turn to the work the generals once blocked."
 EGY_coup_risk_ended_tt: "The generals will no longer threaten a §Ycoup§! over the balance of power.\n"
 EGY_military_opinion_above_49_tt: "§YThe Military§! opinion is at least §Y50§!"
 EGY_the_social_bargain: "The Social Bargain"
 EGY_the_social_bargain_desc: "Growth under the Nazif cabinet reached the stock market before it reached the villages. The new president must show that reform can feed, house and employ ordinary Egyptians."
 EGY_the_thousand_poorest_villages: "The Thousand Poorest Villages"
 EGY_the_thousand_poorest_villages_desc: "In 2009 the NDP launched a programme to bring water, sewage, roads and schools to Egypt's 1,000 poorest villages, most of them in Upper Egypt. We fund it in full."
 EGY_the_future_generation_foundation: "The Future Generation Foundation"
 EGY_the_future_generation_foundation_desc: "Gamal Mubarak founded the Future Generation Foundation in 1998 to train young graduates for private-sector jobs. Its alumni now staff the ministries and the party."
 EGY_ibni_beitak: "Ibni Beitak"
 EGY_ibni_beitak_desc: "In 2005 the NDP promised 500,000 subsidized housing units for young families. Under the \"Build Your Home\" scheme, the state provides serviced plots in the new cities and families build their own homes."
 EGY_takaful_and_karama: "Takaful and Karama"
 EGY_takaful_and_karama_desc: "In 2008 the Ministry of Social Solidarity piloted cash transfers in the Cairo slum of Ain el-Sira. We expand the scheme nationwide: monthly payments for poor families who keep their children in school, and for the elderly and the disabled."
 EGY_back_nile_university: "Back Nile University"
 EGY_back_nile_university_desc: "Nile University opened in 2006 as a private research university backed by Ahmed Nazif and the New Guard. We give it the state land and funding it was promised."
 EGY_zewail_city: "Zewail City"
 EGY_zewail_city_desc: "The Nobel laureate Ahmed Zewail has long called for a national science city. We give his project Nile University's campus and turn it into a showcase of Egyptian science."
 EGY_universal_health_insurance: "Universal Health Insurance"
 EGY_universal_health_insurance_desc: "Half of all Egyptians have no health insurance and pay for care out of pocket. A universal scheme, drafted by the Ministry of Health since the 2000s, finally goes to parliament."
 EGY_ration_card_reform: "Ration Card Reform"
 EGY_ration_card_reform_desc: "Millions of ration cards belong to families that no longer need them, or to people who have died. We review the lists and redirect the savings to the poor."
 EGY_building_the_middle_class: "Building the Middle Class"
 EGY_building_the_middle_class_desc: "The NDP's 2010 programme promised to expand the middle class. With housing, cash transfers, schools and health care in place, the party can claim that reform has reached ordinary homes."
 EGY_egypt_inc: "Egypt Inc."
 EGY_egypt_inc_desc: "The president, the cabinet and the tycoons around the Policies Secretariat share one vision: Egypt as an emerging market that competes for capital with Turkey and the Gulf."
 EGY_second_wave_privatisation: "The Second Wave of Privatization"
 EGY_second_wave_privatisation_desc: "Banque du Caire, the public insurance companies and dozens of loss-making factories are still in state hands. We put them on the market, whatever the Old Guard and the unions say."
 EGY_the_real_estate_tax_law: "The Real Estate Tax Law"
 EGY_the_real_estate_tax_law_desc: "The 2008 Real Estate Tax Law taxed property for the first time in decades. It faced fierce resistance from homeowners and the press, but the treasury needs the revenue."
 EGY_mortgage_finance: "Mortgage Finance"
 EGY_mortgage_finance_desc: "The Mortgage Finance Law of 2001 allowed banks to lend for home purchases, but few Egyptians use it. Cheaper credit and a state guarantee fund open the market to the middle class."
 EGY_energy_subsidy_reform: "Energy Subsidy Reform"
 EGY_energy_subsidy_reform_desc: "Fuel and electricity subsidies take a larger share of the budget than health and education combined, and most of the money goes to the rich and to industry. We raise prices step by step."
 EGY_the_pensions_law: "The Pensions Law"
 EGY_the_pensions_law_desc: "Finance Minister Youssef Boutros Ghali's 2010 Social Insurance and Pensions Law merged the state pension funds and tied benefits to contributions. Workers protest now, but the system will be solvent later."
 EGY_the_suez_canal_corridor: "The Suez Canal Corridor"
 EGY_the_suez_canal_corridor_desc: "Ports, industrial zones and logistics hubs along the Suez Canal, from Ain Sokhna to East Port Said, can turn the world's busiest shortcut into a manufacturing belt."
 EGY_twenty_million_tourists: "Twenty Million Tourists"
 EGY_twenty_million_tourists_desc: "Under Zuhair Garana, the Tourism Ministry set ever higher targets for visitor numbers. New resorts on the Red Sea, cheaper flights and the Grand Egyptian Museum can bring 20 million tourists a year."
 EGY_the_imf_programme: "The IMF Programme"
 EGY_the_imf_programme_desc: "An IMF loan brings billions of dollars and the confidence of foreign investors. In return the Fund demands subsidy cuts, a value added tax and a flexible pound."
 EGY_gulf_deposits: "Gulf Deposits"
 EGY_gulf_deposits_desc: "Saudi Arabia, the Emirates, Kuwait and Qatar are flush with oil money. We invite their sovereign funds to build factories here and to park deposits in our central bank, without IMF conditions but with political expectations."
 EGY_the_gas_hub: "The Gas Hub"
 EGY_the_gas_hub_desc: "Discoveries in the Mediterranean such as Zohr, together with the LNG plants at Damietta and Idku, can make Egypt the gas hub of the eastern Mediterranean."
 EGY_egx_and_nilex: "EGX and Nilex"
 EGY_egx_and_nilex_desc: "The Egyptian Exchange is the oldest in the Middle East, and since 2007 Nilex has listed small and medium firms. Deeper capital markets let Egyptian companies grow without the state banks."
 EGY_cairo_2050: "Cairo 2050"
 EGY_cairo_2050_desc: "The 2008 Cairo 2050 plan of the General Organization for Physical Planning would move ministries out of downtown, clear informal districts and build new towns on the desert edge."
 EGY_africas_tiger: "Africa's Tiger"
 EGY_africas_tiger_desc: "Growth, investment and new industries have made Egypt the economic success story of Africa and the Arab world. The New Guard's promise has been kept."
 EGY_reform_or_order: "Reform or Order"
 EGY_reform_or_order_desc: "The new president must choose how he governs. He can open the system, as the reformers in the party urge, or rule as his father did, through the party machine and the security services."
 EGY_badrawi_at_the_secretariat: "Badrawi at the Secretariat"
 EGY_badrawi_at_the_secretariat_desc: "In February 2011 the reformist physician Hossam Badrawi became secretary-general of the NDP. We give him a free hand to rebuild the party as a genuine political organization."
 EGY_lift_the_state_of_emergency: "Lift the State of Emergency"
 EGY_lift_the_state_of_emergency_desc: "Egypt has lived under emergency law since Sadat's assassination in 1981. Lifting it ends detention without trial and the exceptional State Security courts."
 EGY_amnesty_for_political_prisoners: "Amnesty for Political Prisoners"
 EGY_amnesty_for_political_prisoners_desc: "Bloggers, Kefaya activists and opposition politicians fill our prisons. A presidential amnesty shows that the new era is more than a change of names."
 EGY_empower_the_nchr: "Empower the NCHR"
 EGY_empower_the_nchr_desc: "The National Council for Human Rights was founded in 2003 but can only write reports. We give it the right to inspect prisons and police stations and to refer cases to the prosecutor."
 EGY_judicial_independence_law: "The Judicial Independence Law"
 EGY_judicial_independence_law_desc: "In 2006 the Judges' Club demanded control over the judiciary's budget and an end to the Justice Ministry's power over judges. We give them what they asked for."
 EGY_dialogue_with_the_nac: "Dialogue with the NAC"
 EGY_dialogue_with_the_nac_desc: "Mohamed ElBaradei's National Association for Change gathered a million signatures for constitutional reform in 2010. We invite its leaders to the presidency to discuss the country's future."
 EGY_restore_the_term_limit: "Restore the Term Limit"
 EGY_restore_the_term_limit_desc: "In 1980 Sadat amended Article 77 to allow unlimited presidential terms. Restoring the limit of two terms shows that the presidency is no longer a family possession."
 EGY_license_the_opposition: "License the Opposition"
 EGY_license_the_opposition_desc: "The Political Parties Committee has rejected nearly every new party since 1977. We strip it of its veto and let new parties register freely."
 EGY_free_parliamentary_elections: "Free Parliamentary Elections"
 EGY_free_parliamentary_elections_desc: "The 2010 elections gave the NDP over 90 percent of the seats and discredited the parliament. This time, the judiciary supervises every polling station."
 EGY_the_second_republic: "The Second Republic"
 EGY_the_second_republic_desc: "With a new constitution, free elections and an army that accepts civilian rule, the July Republic of 1952 gives way to a second republic."
 EGY_ezzs_party_machine: "Ezz's Party Machine"
 EGY_ezzs_party_machine_desc: "Steel magnate Ahmed Ezz, the NDP's secretary for organization, built the party machine that delivered the 2010 elections. We give him full control of the party's candidates and funds."
 EGY_unleash_state_security: "Unleash State Security"
 EGY_unleash_state_security_desc: "State Security Investigations knows every activist, imam and union leader in the country. We remove the last limits on its surveillance and arrests."
 EGY_the_2010_playbook: "The 2010 Playbook"
 EGY_the_2010_playbook_desc: "In 2010 the NDP won over 90 percent of the seats in parliament through rigging, intimidation and the disqualification of opposition candidates. We will do it again."
 EGY_crush_kefaya_and_april_6: "Crush Kefaya and April 6"
 EGY_crush_kefaya_and_april_6_desc: "The Kefaya movement first chanted \"no to inheritance\" in 2004, and the April 6 Youth Movement organized online after the Mahalla strike of 2008. We arrest their leaders and close their pages."
 EGY_the_internet_kill_switch: "The Internet Kill Switch"
 EGY_the_internet_kill_switch_desc: "On 28 January 2011 the government ordered every internet and mobile provider to cut its service. We make the order a standing power of the presidency."
 EGY_consolidate_state_media: "Consolidate State Media"
 EGY_consolidate_state_media_desc: "Al-Ahram, the Maspero television building and the national radio speak with one voice, and private channels lose their licenses when they stray."
 EGY_the_counter_terrorism_law: "The Counter-Terrorism Law"
 EGY_the_counter_terrorism_law_desc: "The emergency law was always meant to be replaced by a permanent counter-terrorism law. We pass one that gives the security services the same powers without the stigma of an emergency."
 EGY_rein_in_the_judges_club: "Rein In the Judges' Club"
 EGY_rein_in_the_judges_club_desc: "The judges who protested in 2006 and supervised the elections are a threat to the party. We lower the retirement age, transfer the troublemakers and elect a loyal board for the Judges' Club."
 EGY_prosperity_before_politics: "Prosperity Before Politics"
 EGY_prosperity_before_politics_desc: "China and Singapore grew rich under one-party rule. The New Guard argues that Egyptians want jobs and growth first, and democracy can wait."
 EGY_the_hereditary_republic: "The Hereditary Republic"
 EGY_the_hereditary_republic_desc: "Arabs coined the word \"jumlukiya\" for republics that pass from father to son, as in Syria. Egypt has joined them, and the party, the police and the army stand behind the new president."
 EGY_the_heir_abroad: "The Heir Abroad"
 EGY_the_heir_abroad_desc: "Gamal Mubarak spent years courting Washington, the Gulf and European capitals. As president, he must show that Egypt remains the region's indispensable power."
 EGY_washingtons_partner: "Washington's Partner"
 EGY_washingtons_partner_desc: "Barack Obama chose Cairo University for his speech to the Muslim world in 2009. The United States still sends us $1.3 billion in military aid every year, and we intend to keep it."
 EGY_operation_eagle: "Operation Eagle"
 EGY_operation_eagle_desc: "In August 2011 the army sent tanks and troops into North Sinai to fight jihadist cells, with Israel's consent under the peace treaty. We launch a full campaign against the insurgency."
 EGY_the_nile_basin_question: "The Nile Basin Question"
 EGY_the_nile_basin_question_desc: "The 1959 agreement with Sudan gives us the bulk of the Nile's water. The upstream states now reject it and want a new treaty that ends our veto over their dams."
 EGY_the_gulf_axis: "Knocking on the GCC's Door"
 EGY_the_gulf_axis_desc: "Riyadh and Abu Dhabi share our fear of Iran and the Muslim Brotherhood. In 2011 the Gulf Cooperation Council offered seats to Jordan and Morocco. We ask every member to back Egypt as well."
 EGY_rafale_and_mistral: "Rafale and Mistral"
 EGY_rafale_and_mistral_desc: "In 2015 Egypt bought 24 Rafale fighters and two Mistral helicopter carriers from France. Buying from Paris shows Washington that our loyalty has a price."
 EGY_the_cairo_ceasefire: "The Cairo Ceasefire"
 EGY_the_cairo_ceasefire_desc: "In November 2012 Egyptian mediators brokered the ceasefire that ended eight days of fighting between Israel and Hamas. We make Cairo the only address for Gaza diplomacy."
 EGY_the_libyan_frontier: "Western Desert Command"
 EGY_the_libyan_frontier_desc: "Our border with Libya runs for more than a thousand kilometers of open desert. We station a new command at Marsa Matruh, with an air base and radar to watch the smuggling routes and any trouble that spills over from Libya."
 EGY_the_eastmed_gas_forum: "The EastMed Gas Forum"
 EGY_the_eastmed_gas_forum_desc: "In 2019 Egypt, Israel, Greece, Cyprus, Italy, Jordan and the Palestinian Authority founded the East Mediterranean Gas Forum in Cairo. We host its headquarters and set its agenda."
 EGY_the_indispensable_heir: "The Indispensable Heir"
 EGY_the_indispensable_heir_desc: "Washington, the Gulf, Europe and Africa all deal with Cairo. Like his father, Gamal Mubarak has made himself the partner the region cannot do without."
 EGY_gamal_modifier: "Gamal's Presidency"
 EGY_gamal_modifier_desc: "Gamal Mubarak rules as a civilian heir, backed by the party, the technocrats and the tycoons, and watched closely by the generals.\n§W--------------§!\nThis modifier is §RRemoved§! when Gamal Mubarak leaves office."
 EGY_gamal_modifier_added_tt: "Gains the §YGamal's Presidency§! modifier.\n"
 EGY_the_heir: "The Heir"
 EGY_the_heir_desc: "Gamal Mubarak inherited the presidency from his father. The tycoons trust him, the generals do not."
 EGY_the_reformer: "The Reformer"
 EGY_the_reformer_desc: "Gamal Mubarak opened the political system and earned a legitimacy of his own."
 EGY_the_iron_heir: "The Iron Heir"
 EGY_the_iron_heir_desc: "Gamal Mubarak rules as his father did, through the party machine and the security services."
 EGY_imf_programme_idea: "The IMF Programme"
 EGY_imf_programme_idea_desc: "The Fund's money and approval reassure investors, while subsidy cuts squeeze household budgets."
 EGY_gulf_deposits_idea: "Gulf Deposits"
 EGY_gulf_deposits_idea_desc: "Saudi and Emirati deposits steady the pound and fund new construction."
 EGY_operation_eagle_idea: "Operation Eagle"
 EGY_operation_eagle_idea_desc: "Army units rotate through North Sinai and learn to fight an insurgency."
 EGY_kill_switch_idea: "The Kill Switch"
 EGY_kill_switch_idea_desc: "The presidency can cut the internet at any time, and activists know it. Businesses and universities pay the price in lost connectivity."
 EGY_counter_terrorism_law_idea: "The Counter-Terrorism Law"
 EGY_counter_terrorism_law_idea_desc: "The security services keep their emergency powers under a permanent law."
 EGY_generals_coup_tt: "There is a §R50%§! chance that the army removes the President.\n"
 EGY_eighteen_days_mission: "The Eighteen Days"
 EGY_eighteen_days_mission_desc: "Tahrir Square is full and the country is on strike. Whether the regime survives depends on Mubarak's strength, the army's loyalty, and how our response plays out. Hunger in the bread lines and the crowding of informal Cairo feed the protests."
 EGY_revolt_response_crackdown_holds_tt: "The army stands behind the police. Our chance to survive the protests §Grises by 10§!.\n"
 EGY_revolt_response_crackdown_fails_tt: "The army will not back the police. Our chance to survive the protests §Rfalls by 10§!.\n"
 EGY_revolt_response_concession_tt: "Our chance to survive the protests §Grises by 10§!.\n"
 EGY_revolt_response_army_loyal_tt: "The army is loyal. Our chance to survive the protests §Grises by 15§!.\n"
 EGY_revolt_response_army_wavers_tt: "The army's loyalty is doubtful. Our chance to survive the protests §Rfalls by 5§!.\n"
 egypt_mubarak.13.t: "The Army Answers"
 egypt_mubarak.13.d_accepts: "The generals have studied the NDP's choice. Field Marshal Tantawi lets it be known that the armed forces will respect the constitution, as long as their place in the state is respected too."
 egypt_mubarak.13.d_refuses: "The generals have studied the NDP's choice and do not like it. Senior officers make clear that the armed forces will not salute a civilian heir who never served."
 egypt_mubarak.13.a: "The army falls in line."
 egypt_mubarak.13.b: "The generals dig in."
 egypt_mubarak.92.t: "The Day of Revolt"
 egypt_mubarak.92.d: "On Police Day, tens of thousands answered calls from online activists and marched on Tahrir Square. By nightfall the protests had spread to Alexandria, Suez, and Mahalla, and the crowds were chanting for the fall of the regime. The president must decide how the state answers."
 egypt_mubarak.92.a: "Send in the Central Security Forces."
 egypt_mubarak.92.b: "Dismiss the cabinet and appoint a vice president."
 egypt_mubarak.92.c: "Let the army deploy."
 egypt_mubarak.93.t: "Mubarak Weathers the Storm"
 egypt_mubarak.93.d: "The square has emptied and the strikes are over. The regime has survived the largest protests in its history, but its authority is shaken, and every faction now looks to the presidential election."
 egypt_mubarak.93.a: "The state endures."
 egypt_mubarak.94.t: "Mubarak Steps Down"
 egypt_mubarak.94.d: "After eighteen days of protests, the army has refused to clear the streets. Hosni Mubarak has resigned and handed power to the Supreme Council of the Armed Forces, which promises elections and a new constitution."
 egypt_mubarak.94.a: "The army takes charge."
 EGY_survived_2011: "Has survived the §YEighteen Days§!"
 egypt_mubarak.95.t: "The Heir Is Sworn In"
 egypt_mubarak.95.d_accepts: "Before the People's Assembly, Gamal Mubarak takes the oath as President of the Republic. His father watches from the front row, and Field Marshal Tantawi stands with the generals and salutes."
 egypt_mubarak.95.d_refuses: "Before the People's Assembly, Gamal Mubarak takes the oath as President of the Republic. Several seats reserved for the Supreme Council of the Armed Forces stay empty, and the cameras do not miss it."
 egypt_mubarak.95.a: "A new generation takes charge."
 egypt_mubarak.96.t: "The Generals Lose Patience"
 egypt_mubarak.96.d: "Senior officers have met without the President's knowledge. They resent the tycoons in the cabinet, the sale of state companies and a commander-in-chief who never wore a uniform. A message reaches the palace: change course, or the army will change it for us."
 egypt_mubarak.96.a: "Give the generals what they want."
 egypt_mubarak.96.b: "The President does not take orders."
 egypt_mubarak.97.t: "The Army Removes the Heir"
 egypt_mubarak.97.d: "Tanks surround the Ittihadiya Palace and state television interrupts its programmes. A general reads a statement: the armed forces have relieved Gamal Mubarak of his duties to protect the nation, and will hand power to a civilian government once order is restored."
 egypt_mubarak.97.a: "The army takes charge."
 egypt_mubarak.98.t: "The Field Marshal Retires"
 egypt_mubarak.98.d: "Field Marshal Tantawi has handed over the Ministry of Defence. In the officers' clubs, some call it a long-overdue change of generations. Others see a civilian president reaching into the army's command."
 egypt_mubarak.98.a: "Award him the Order of the Nile and a generous pension."
 egypt_mubarak.98.b: "The army answers to the President now."
 egypt_mubarak.99.t: "Protests After the Sweep"
 egypt_mubarak.99.d: "The NDP has won almost every seat in parliament. The opposition boycotted the runoff, and activists who filmed ballot stuffing post their videos online. Crowds gather outside the Journalists' Syndicate and the High Court."
 egypt_mubarak.99.a: "The Central Security Forces will clear the streets."
 egypt_mubarak.99.b: "Let them shout."
 egypt_mubarak.100.t: "The Entebbe Agreement"
 egypt_mubarak.100.d: "Ethiopia, Uganda, Rwanda, Tanzania and Kenya have signed the Cooperative Framework Agreement in Entebbe. It would end Egypt's and Sudan's veto over projects on the upper Nile. Cairo and Khartoum refused to sign."
 egypt_mubarak.100.a: "The Nile is a red line."
 egypt_mubarak.100.b: "Coordinate with Khartoum and keep talking."
 egypt_mubarak.101.t: "Ethiopia Builds on the Blue Nile"
 egypt_mubarak.101.d: "Ethiopia has laid the foundation stone of the Grand Ethiopian Renaissance Dam near the Sudanese border. When complete, it will be the largest hydroelectric dam in Africa, and its reservoir will hold more than a year of the Blue Nile's flow."
 egypt_mubarak.101.a: "This changes everything."
 egypt_mubarak.102.t: "The IMF's Conditions"
 egypt_mubarak.102.d: "The IMF mission has finished its talks in Cairo. The Fund wants bread and fuel subsidies cut faster than the cabinet planned, and the Finance Ministry must decide how much of the timetable to accept."
 egypt_mubarak.102.a: "Accept the Fund's timetable."
 egypt_mubarak.102.b: "Negotiate a slower pace."
 egypt_mubarak.103.t: "The Election Results"
 egypt_mubarak.103.d: "For the first time in decades, judges have supervised every polling station and observers report few irregularities. The count will show whether the NDP can win without the help of the Interior Ministry."
 egypt_mubarak.103.a: "Parliament has been elected."
 EGY_the_security_establishment_rules: "The Security Establishment Rules"
 EGY_the_security_establishment_rules_desc: "The president came from the security services, and the security services expect to govern with him. The army, General Intelligence and the Interior Ministry now sit at the center of the state."
 EGY_tantawi_stays_at_defence: "Tantawi Stays at Defence"
 EGY_tantawi_stays_at_defence_desc: "Field Marshal Mohamed Hussein Tantawi has been Minister of Defence since 1991. His endorsement made this presidency possible, and he keeps his ministry, his budget and his place at the head of the Supreme Council of the Armed Forces."
 EGY_muwafi_takes_the_gis: "Muwafi Takes the GIS"
 EGY_muwafi_takes_the_gis_desc: "Major General Murad Muwafi, governor of North Sinai and a former director of Military Intelligence, takes over the General Intelligence Service. Suleiman leaves his old service to a man he trusts."
 EGY_the_trial_of_habib_el_adly: "The Trial of Habib el-Adly"
 EGY_the_trial_of_habib_el_adly_desc: "Habib el-Adly ran the Interior Ministry from 1997 to 2011, and the public blames his police for the deaths of protesters. Putting him on trial for corruption and the killings shows that the new president answers the street's anger."
 EGY_sami_anan_as_chief_of_staff: "Sami Anan's General Staff"
 EGY_sami_anan_as_chief_of_staff_desc: "Lieutenant General Sami Hafez Anan has been Chief of Staff since 2005 and has close ties to the Pentagon. He receives a free hand to modernize training and to keep the army ready for operations in Sinai."
 EGY_the_military_economy_untouched: "The Military Economy Untouched"
 EGY_the_military_economy_untouched_desc: "The National Service Projects Organization and the Arab Organization for Industrialization run factories, farms, hotels and construction firms. The army's businesses stay outside civilian audit, and in return they invest in new plants."
 EGY_the_national_security_sector: "The National Security Sector"
 EGY_the_national_security_sector_desc: "State Security Investigations became the most hated institution in the country. We dissolve it and create a new National Security Sector with a narrower mandate, as the interior minister announced in March 2011."
 EGY_keep_state_security: "Keep State Security"
 EGY_keep_state_security_desc: "State Security Investigations has watched the Islamists, the opposition and the universities for decades. Dismantling it now would blind the state. The service stays, with its files and its officers intact."
 EGY_guard_the_arish_pipeline: "Guard the Arish Pipeline"
 EGY_guard_the_arish_pipeline_desc: "Saboteurs in North Sinai have bombed the gas pipeline from el-Arish to Israel and Jordan more than a dozen times since February 2011. Army units take over its protection from the police."
 EGY_the_brotherhood_at_the_table: "The Brotherhood at the Table"
 EGY_the_brotherhood_at_the_table_desc: "On 6 February 2011, Suleiman invited the Muslim Brotherhood to the national dialogue for the first time. We keep that door open and bring the Brotherhood into politics, where it can be watched and bargained with."
 EGY_ban_the_guidance_bureau: "Ban the Guidance Bureau"
 EGY_ban_the_guidance_bureau_desc: "Suleiman has warned that a Brotherhood government would turn Egypt into a religious state. The Guidance Bureau is closed, its leaders are detained, and its candidates are kept out of every election."
 EGY_operation_sinai: "Operation Sinai"
 EGY_operation_sinai_desc: "Militants have attacked police stations in el-Arish and Rafah and killed soldiers on the border. With Israel's consent, armored units and helicopters move into the demilitarized zones of North Sinai to clear the militant camps."
 EGY_settle_the_bedouin_question: "Settle the Bedouin Question"
 EGY_settle_the_bedouin_question_desc: "The Bedouin of Sinai cannot own their land, rarely serve in the police and have been jailed by the thousands since the Taba bombings. Land titles, jobs and the release of detainees can win back the tribes."
 EGY_the_guardians_of_the_state: "The Guardians of the State"
 EGY_the_guardians_of_the_state_desc: "The army, General Intelligence and the Interior Ministry now act under one command. The security establishment that brought the president to power has become the foundation of his rule."
 EGY_the_suleiman_roadmap: "The Suleiman Roadmap"
 EGY_the_suleiman_roadmap_desc: "During the crisis of 2011, Suleiman offered the opposition a roadmap: constitutional amendments, an end to the emergency law once security returns, and free elections. As president, he must now decide how much of it to honor."
 EGY_the_constitutional_amendments_committee: "The Amendments Committee"
 EGY_the_constitutional_amendments_committee_desc: "A committee of judges and legal scholars will draft amendments to the 1971 constitution. Its mandate covers who may run for president, how long a president may serve, and judicial supervision of elections."
 EGY_the_national_dialogue: "The National Dialogue"
 EGY_the_national_dialogue_desc: "The opposition parties, the youth movements and independent figures are invited to talks with the presidency. Few trust the regime, but even a limited dialogue drains the anger from the squares."
 EGY_purge_the_new_guard: "Purge the New Guard"
 EGY_purge_the_new_guard_desc: "Ahmed Ezz, Rachid Mohamed Rachid and the other tycoons of Gamal Mubarak's circle are blamed for the corruption of the last decade. Asset freezes and travel bans end the New Guard's hold on the party and the economy."
 EGY_amend_articles_76_and_77: "Amend Articles 76 and 77"
 EGY_amend_articles_76_and_77_desc: "Article 76 made it almost impossible to run against the ruling party, and Article 77 let a president serve without limit. Easier candidacy rules and a limit of two four-year terms meet the opposition's core demands."
 EGY_the_shafik_cabinet: "The Shafik Cabinet"
 EGY_the_shafik_cabinet_desc: "Air Marshal Ahmed Shafik, former commander of the air force and Minister of Civil Aviation, has a reputation as an efficient manager. A cabinet under his leadership gives the regime a competent face."
 EGY_ease_the_emergency_law: "Ease the Emergency Law"
 EGY_ease_the_emergency_law_desc: "Egypt has lived under emergency law since 1981. We limit its use to terrorism and organized crime, a step the regime has promised and postponed for thirty years."
 EGY_the_constitutional_referendum: "The Constitutional Referendum"
 EGY_the_constitutional_referendum_desc: "The amendments go before the voters. In March 2011, a similar package passed with 77 percent of the vote. A clear majority gives the transition legitimacy and the presidency a mandate."
 EGY_a_strong_presidency: "A Strong Presidency"
 EGY_a_strong_presidency_desc: "Suleiman has said he would resign before serving under a parliamentary system. The new order keeps the president as head of the executive, commander in chief and the final arbiter of the state."
 EGY_a_mixed_system: "A Mixed System"
 EGY_a_mixed_system_desc: "The president keeps defense and foreign affairs, while a prime minister answerable to parliament runs the government. Sharing power reassures the opposition and foreign partners."
 EGY_the_peoples_assembly_elections: "The People's Assembly Elections"
 EGY_the_peoples_assembly_elections_desc: "Elections for the People's Assembly are held in three rounds under judicial supervision. The results will show how much support the regime's heirs can win without the old party machine."
 EGY_a_new_constitution: "A New Constitution"
 EGY_a_new_constitution_desc: "A constituent assembly drafts a permanent constitution to replace the amended text of 1971. Its articles on the army, religion and the presidency will define the state for a generation."
 EGY_the_security_republic: "The Security Republic"
 EGY_the_security_republic_desc: "The constitution protects the armed forces' budget from civilian oversight and gives the security services a permanent place in the state. Order has been restored, and the generals will guard it."
 EGY_the_managed_transition: "The Managed Transition"
 EGY_the_managed_transition_desc: "The security services step back from open politics and leave the elected institutions to govern. Investors and foreign governments welcome the change, while the generals keep watch from the barracks."
 EGY_order_first: "Order First"
 EGY_order_first_desc: "In his 2012 campaign, Suleiman promised that restoring security would be his first priority. Without order, there will be no tourists, no investment and no growth."
 EGY_bring_back_the_tourists: "Bring Back the Tourists"
 EGY_bring_back_the_tourists_desc: "Tourist arrivals fell by a third in 2011 as hotels in Sharm el-Sheikh and Luxor stood empty. Police return to the resorts and the Red Sea coast, and the Ministry of Tourism launches a campaign abroad."
 EGY_recover_the_stolen_billions: "Recover the Stolen Billions"
 EGY_recover_the_stolen_billions_desc: "Businessmen such as Hussein Salem moved fortunes abroad as the old regime weakened. Asset freezes in Switzerland, Spain and Britain, together with settlements at home, can return part of that money to the treasury."
 EGY_the_gulf_lifeline: "The Gulf Lifeline"
 EGY_the_gulf_lifeline_desc: "In 2011, Saudi Arabia, the United Arab Emirates and Qatar pledged billions of dollars in deposits and grants. Their money props up the pound and buys time for the treasury."
 EGY_the_imf_standby: "The IMF Standby Loan"
 EGY_the_imf_standby_desc: "The International Monetary Fund has offered a 3 billion dollar standby loan. It is cheap money and a signal to investors, but it comes with conditions on subsidies and the budget deficit."
 EGY_the_armys_billion: "The Army's Billion"
 EGY_the_armys_billion_desc: "In December 2011, the armed forces lent the Central Bank one billion dollars from their own funds. The army can rescue the treasury without the IMF, but it expects to be repaid in influence."
 EGY_east_port_said: "East Port Said"
 EGY_east_port_said_desc: "The Suez Canal Container Terminal at East Port Said can grow into a manufacturing and logistics zone at the entrance of the canal. The state invests in new plants and port facilities."
 EGY_the_minimum_wage: "The Minimum Wage"
 EGY_the_minimum_wage_desc: "Workers have demanded a minimum wage of 1,200 pounds since a court ordered the government to set one in 2010. A minimum of 700 pounds for public sector employees answers part of the demand."
 EGY_bread_before_reform: "Bread Before Reform"
 EGY_bread_before_reform_desc: "The bread queues of 2008 and the protests of 2011 showed how quickly hunger turns into anger. Subsidized bread and flour are protected before any other reform is attempted."
 EGY_restart_the_factories: "Restart the Factories"
 EGY_restart_the_factories_desc: "Strikes, curfews and unpaid suppliers have idled factories from Mahalla to Tenth of Ramadan City. State credit and new orders put the production lines back to work."
 EGY_the_independent_unions: "Recognize the Independent Unions"
 EGY_the_independent_unions_desc: "The Egyptian Federation of Independent Trade Unions was founded in Tahrir Square in January 2011. Recognizing it gives workers a voice outside the state-controlled federation and channels strikes into negotiation."
 EGY_decree_law_34: "Decree-Law 34"
 EGY_decree_law_34_desc: "In March 2011, the military council criminalized strikes and protests that disrupt work. Enforcing the decree ends the strike wave, but it makes the government the workers' opponent."
 EGY_stability_and_bread: "Stability and Bread"
 EGY_stability_and_bread_desc: "The tourists are returning, the factories are working and bread is on the table. The new president's bargain with the people is simple: order and a living, in return for patience."
 EGY_the_brokers_hand: "The Broker's Hand"
 EGY_the_brokers_hand_desc: "For two decades, Suleiman handled Egypt's most sensitive files: Gaza, Israel, Sudan and Washington. As president, he can make Cairo the region's indispensable broker again."
 EGY_the_cairo_reconciliation: "The Cairo Reconciliation"
 EGY_the_cairo_reconciliation_desc: "On 27 April 2011, Fatah and Hamas signed a reconciliation agreement in Cairo after four years of division. Egypt mediated the talks and will oversee their implementation."
 EGY_the_camp_david_annex: "The Camp David Annex"
 EGY_the_camp_david_annex_desc: "The 1979 treaty limits Egyptian forces in eastern Sinai. Israel has agreed to let additional battalions into the zone to fight the militants, and we seek to make that arrangement permanent."
 EGY_the_langley_channel: "The Langley Channel"
 EGY_the_langley_channel_desc: "Suleiman worked with the CIA for years on counterterrorism and the Palestinian file. As president, he relies on that channel to keep American aid, training and intelligence flowing."
 EGY_the_two_sudans: "The Two Sudans"
 EGY_the_two_sudans_desc: "South Sudan became independent on 9 July 2011. Egypt recognizes the new state and works to keep good relations with both Khartoum and Juba, since both lie on the Nile."
 EGY_the_shalit_exchange: "The Shalit Exchange"
 EGY_the_shalit_exchange_desc: "Egyptian intelligence mediated for five years between Israel and Hamas over Gilad Shalit, the Israeli soldier held in Gaza. In October 2011, he was exchanged for 1,027 Palestinian prisoners."
 EGY_honor_the_gas_contract: "Honor the Gas Contract"
 EGY_honor_the_gas_contract_desc: "The East Mediterranean Gas Company supplies Israel under a long-term contract that Suleiman's service helped negotiate. Honoring it keeps the peace profitable and the Americans satisfied."
 EGY_cancel_the_emg_contract: "Cancel the EMG Contract"
 EGY_cancel_the_emg_contract_desc: "Egyptians believe the gas sold to Israel was priced far below its value, and Hussein Salem made a fortune from the deal. In April 2012, the state gas company cancelled the contract over unpaid bills."
 EGY_the_nile_waters: "The Nile Waters"
 EGY_the_nile_waters_desc: "The upstream states have signed the Entebbe framework to end Egypt's veto over the Nile, and Ethiopia plans a great dam on the Blue Nile. Egypt depends on the river for almost all of its water."
 EGY_open_rafah: "Open Rafah"
 EGY_open_rafah_desc: "The Rafah crossing reopened permanently for people on 28 May 2011. Opening Gaza's only gate that Israel does not control eases the blockade and wins Palestinian goodwill."
 EGY_seal_the_tunnels: "Seal the Tunnels"
 EGY_seal_the_tunnels_desc: "Hundreds of tunnels under the border bring fuel, goods and weapons into Gaza and carry militants out of it. Engineers flood and demolish them, whatever the cost in relations with Hamas."
 EGY_back_the_colonel: "Back the Colonel"
 EGY_back_the_colonel_desc: "Muammar Gaddafi has been an unpredictable neighbor, but he employs a million Egyptian workers and has kept the western border quiet. We quietly support his regime against the uprising in Benghazi."
 EGY_back_the_national_transitional_council: "Back the Transitional Council"
 EGY_back_the_national_transitional_council_desc: "The rebels in Benghazi have formed a National Transitional Council with Western and Gulf support. Egyptian intelligence supplies them across the border and secures a friendly government in eastern Libya."
 EGY_the_indispensable_spymaster: "The Indispensable Spymaster"
 EGY_the_indispensable_spymaster_desc: "Hamas, Israel, Washington and the Gulf capitals all need Cairo's mediation. The spymaster has made Egypt the power that every party in the region must consult."
 EGY_the_presidents_heart: "The President's Heart"
 EGY_the_presidents_heart_desc: "Omar Suleiman was born in 1936 and suffers from a heart condition and amyloidosis. His doctors warn that the strain of the presidency could kill him."
 EGY_treatment_in_cleveland: "Treatment in Cleveland"
 EGY_treatment_in_cleveland_desc: "The Cleveland Clinic in Ohio is among the best cardiac hospitals in the world. Quiet treatment abroad can extend the president's life, if word of it does not reach the press."
 EGY_the_maadi_cardiac_unit: "The Maadi Cardiac Unit"
 EGY_the_maadi_cardiac_unit_desc: "The Maadi Armed Forces Hospital in Cairo treats the country's senior officers. A new cardiac unit there keeps the president under military doctors and away from foreign cameras."
 EGY_a_vice_president_at_last: "A Vice President at Last"
 EGY_a_vice_president_at_last_desc: "Mubarak left the vice presidency empty for thirty years and nearly lost the state in 2011. Suleiman will not repeat that mistake, and the army must agree on who stands next in line."
 EGY_the_field_marshal_as_heir: "The Field Marshal as Heir"
 EGY_the_field_marshal_as_heir_desc: "Field Marshal Tantawi is the senior officer of the armed forces and the man who endorsed this presidency. He is old, but no general will challenge his succession."
 EGY_sami_anan_as_heir: "Sami Anan as Heir"
 EGY_sami_anan_as_heir_desc: "Chief of Staff Sami Anan is younger than Tantawi and well known in Washington. Naming him as heir promises continuity with a more modern face."
 EGY_el_sisi_as_heir: "El-Sisi as Heir"
 EGY_el_sisi_as_heir_desc: "Major General Abdel Fattah el-Sisi, director of Military Intelligence, is the youngest member of the military council. Passing over his seniors would bring a new generation of officers to the top."
 EGY_secure_the_line_of_succession: "Secure the Line of Succession"
 EGY_secure_the_line_of_succession_desc: "The heir is introduced to the governors, the party and the foreign embassies, and the military council formally pledges to support him. If the president dies, the transfer of power will be orderly."
 EGY_the_state_outlives_the_man: "The State Outlives the Man"
 EGY_the_state_outlives_the_man_desc: "Suleiman spent his career protecting a regime built around one man. His presidency will be judged by whether the state he leaves behind can survive without him."
 EGY_suleiman_sworn_in_tt: "§YOmar Suleiman§! succeeds Hosni Mubarak as President and gains §YThe Spymaster's Presidency§! modifier.\n"
 EGY_suleiman_modifier: "The Spymaster's Presidency"
 EGY_suleiman_modifier_desc: "Omar Suleiman rules with the army and the intelligence service behind him, and with his own failing health as the regime's greatest risk.\n§W--------------§!\nThis modifier is §RRemoved§! when Omar Suleiman leaves office."
 EGY_suleiman_modifier_added_tt: "Gains §YThe Spymaster's Presidency§! modifier.\n"
 EGY_the_spymaster: "The Spymaster"
 EGY_the_spymaster_desc: "Omar Suleiman ran General Intelligence for eighteen years. He knows every secret of the state and trusts almost no one."
 EGY_change_suleiman_health_risk_tt: "The monthly chance of a presidential heart crisis changes by [?temp_health|-=0]% (Now: §Y[?EGY_suleiman_health_risk|0]%§!)\n"
 EGY_suleiman_health_explained_tt: "From §Y2012§! onward, the president faces a monthly chance of a heart crisis (Now: §Y[?EGY_suleiman_health_risk|0]%§!). The first crisis is a warning. The second is fatal, and his chosen heir takes power.\n"
 EGY_heir_tantawi_tt: "§YMohamed Hussein Tantawi§! will succeed Omar Suleiman if he dies in office.\n"
 EGY_heir_anan_tt: "§YSami Hafez Anan§! will succeed Omar Suleiman if he dies in office.\n"
 EGY_heir_sisi_tt: "§YAbdel Fattah el-Sisi§! will succeed Omar Suleiman if he dies in office.\n"
 EGY_secure_succession_tt: "If Omar Suleiman dies in office, the transfer of power costs §Y2%§! stability instead of §R8%§! and does not anger the military.\n"
 egypt_mubarak.104.t: "The General Takes the Oath"
 egypt_mubarak.104.d_accepts: "Hosni Mubarak has stepped aside after three decades in power. Before the People's Assembly, Omar Suleiman takes the oath as President of the Republic, with Field Marshal Tantawi and the military council standing behind him."
 egypt_mubarak.104.d_refuses: "Hosni Mubarak has stepped aside after three decades in power. Omar Suleiman takes the oath as President of the Republic, but several generals are absent from the ceremony, and the officers' clubs ask why an intelligence man should command the army."
 egypt_mubarak.104.a: "Security comes first."
 egypt_mubarak.105.t: "The President Collapses"
 egypt_mubarak.105.d: "President Suleiman collapsed during a meeting at the Ittihadiya Palace and was rushed to the Maadi Armed Forces Hospital. His doctors report that he has recovered, but they warn that his heart may not survive another crisis."
 egypt_mubarak.105.a: "The president is in good health."
 egypt_mubarak.105.b: "Tell the nation and let him rest."
 egypt_mubarak.106.t: "The President Is Dead"
 egypt_mubarak.106.d: "Omar Suleiman has died of a heart attack. State television interrupts its programs with recitations from the Quran, and the military council meets through the night. By morning, the generals have agreed on his successor."
 egypt_mubarak.106.a: "The state goes on."
 EGY_twenty_million_tourists_tt: "Red Sea resorts and cheaper flights raise §Ytourism income§! by §G0.02§! per week.\n"
 EGY_gulf_expectations_tt: "In six months, §YRiyadh§! will ask for something in return.\n"
 EGY_property_survey_idea: "The Property Survey"
 EGY_property_survey_idea_desc: "Tax assessors are surveying every apartment and villa in the country for the first time. The work is slow and expensive, and owners resent it. Once the register is complete, the Real Estate Tax will start to pay."
 EGY_mortgage_boom_idea: "Mortgage Finance Boom"
 EGY_mortgage_boom_idea_desc: "With the Mortgage Finance Fund guaranteeing loans, banks are lending to middle-class buyers in the new towns. Developers race to meet demand, and households take on debt for the first time."
 EGY_suez_zone_mission: "Build the Suez Canal Zone"
 EGY_suez_zone_mission_desc: "Developers are bidding for plots in Ain Sokhna and East Port Said. Every six months, another factory, berth, office block or road opens along the canal. The program runs four rounds."
 EGY_cairo_2050_mission: "Carry Out Cairo 2050"
 EGY_cairo_2050_mission_desc: "Bulldozers are moving into the informal districts, while ministries prepare to leave downtown for the new towns. Corruption in the ministries decides how many of the promised homes are built."
 egypt_mubarak.107.t: "Banque du Caire on the Block"
 egypt_mubarak.107.d: "Banque du Caire, the third largest state bank, is for sale. A European bank has made the highest offer, a group of Egyptian businessmen close to the Policies Secretariat has made the best connected one, and the Central Bank suggests selling only a minority stake on the exchange."
 egypt_mubarak.107.a: "Sell to the foreign bank."
 egypt_mubarak.107.b: "Sell to our own businessmen."
 egypt_mubarak.107.c: "Float a minority stake."
 egypt_mubarak.108.t: "The Mill Occupation"
 egypt_mubarak.108.d: "Workers at a privatized textile mill have occupied the factory floor. The new owners have cut wages and laid off hundreds, and the workers demand the severance pay promised at the sale. The governor asks Cairo whether to pay or send in the police."
 egypt_mubarak.108.a: "Pay the severance."
 egypt_mubarak.108.b: "Clear the mill."
 egypt_mubarak.109.t: "Fuel Queues and Microbus Strikes"
 egypt_mubarak.109.d: "The first fuel price rise has hit the microbus drivers who carry most of Cairo's commuters. They have raised fares and parked their vans in protest, and queues stretch from every petrol station. The cabinet must decide how to respond."
 egypt_mubarak.109.a: "Hold the line on prices."
 egypt_mubarak.109.b: "Phase in the rise more slowly."
 egypt_mubarak.109.c: "Pay cash transfers through the ration cards."
 egypt_mubarak.110.t: "Riyadh's Expectations"
 egypt_mubarak.110.d: "The Saudi ambassador has called on the president. The Kingdom expects Egypt to stand with the Gulf on Iran, Yemen and the Brotherhood, and reminds Cairo whose money keeps the pound stable."
 egypt_mubarak.110.a: "Stand with the Kingdom."
 egypt_mubarak.110.b: "Egypt sets its own foreign policy."
 egypt_mubarak.111.t: "Listing Day at the EGX"
 egypt_mubarak.111.d: "The Egyptian Exchange has its busiest year in a decade. The Capital Market Authority must decide what to bring to the market next. It can list more state companies, court foreign funds with lower fees, or push small firms onto Nilex."
 egypt_mubarak.111.a: "List the state champions."
 egypt_mubarak.111.b: "Court the foreign funds."
 egypt_mubarak.111.c: "Bring small firms onto Nilex."
 EGY_ibni_beitak_idea: "Self-Build Housing Plots"
 EGY_ibni_beitak_idea_desc: "Young families have received serviced plots in the new cities and are building their homes with their own savings and a state grant. Cement trucks fill the desert roads. Once the houses are finished, thousands of families can leave the crowded districts of Cairo."
 EGY_thousand_villages_mission: "Develop the Thousand Villages"
 EGY_thousand_villages_mission_desc: "Engineers are laying water pipes, sewers and roads across the poorest villages of Upper Egypt. Corruption in the governorates decides how much of the money reaches the villages."
 egypt_mubarak.112.t: "The Foundation's Graduates"
 egypt_mubarak.112.d: "The first large class of Future Generation Foundation graduates has finished its training, fluent in English and loyal to the president. The ministries want them as managers, the private sector wants them as staff, and the party wants them as organizers. The Foundation's board asks where we want them."
 egypt_mubarak.112.a: "Put them in the ministries."
 egypt_mubarak.112.b: "Send them to the private sector."
 egypt_mubarak.112.c: "Build the party machine."
 egypt_mubarak.113.t: "The Health Insurance Bill"
 egypt_mubarak.113.d: "The universal health insurance bill has reached the People's Assembly. Everyone agrees that half the country cannot pay for a doctor, but no one agrees on who should pay for the scheme. The Ministry of Finance wants employers to carry the cost, the Ministry of Health wants the budget to carry it, and the Doctors' Syndicate wants a say in how it is run."
 egypt_mubarak.113.a: "The state will pay."
 egypt_mubarak.113.b: "Employers will pay."
 egypt_mubarak.113.c: "Let the Doctors' Syndicate shape it."
 egypt_mubarak.112.a_tt: "If we §Yput them in the ministries§!"
 egypt_mubarak.112.b_tt: "If we §Ysend them to the private sector§!"
 egypt_mubarak.112.c_tt: "If we §Ybuild the party machine§!"
 egypt_mubarak.113.a_tt: "If §Ythe state pays§!"
 egypt_mubarak.113.b_tt: "If §Yemployers pay§!"
 egypt_mubarak.113.c_tt: "If we §Ylet the Doctors' Syndicate shape it§!"
 EGY_tantawis_bargain_idea: "Tantawi's Bargain"
 EGY_tantawis_bargain_idea_desc: "Field Marshal Tantawi stays at the Ministry of Defence, and the army's budget, factories and land stay out of reach. The officer corps salutes the new president, but every cabinet decision that touches the armed forces now passes through the field marshal's office first."
 EGY_republican_guard_idea: "The Republican Guard Command"
 EGY_republican_guard_idea_desc: "New commanders, chosen for their loyalty to the president, are taking over the Republican Guard brigades around the palaces and the capital. The Guard trains hard and receives the army's best equipment first. Once the reshuffle is complete, no unit stands closer to the presidency."
 EGY_nspo_audit_mission: "Audit the NSPO"
 EGY_nspo_audit_mission_desc: "Inspectors from the Central Auditing Organization are working through the books of the National Service Projects Organization. The generals open some ledgers and lose others. How much the auditors find depends on how clean our own administration is."
 egypt_mubarak.114.t: "Who Guards the President"
 egypt_mubarak.114.d: "The Defence Minister, the Director of General Intelligence and the Interior Minister have each asked for a private meeting in the first week of the new presidency. Whoever we receive first will read it as a sign of where they stand. The others will read it the same way."
 egypt_mubarak.114.a: "The army comes first."
 egypt_mubarak.114.b: "Receive the intelligence chiefs."
 egypt_mubarak.114.c: "They will all wait for the president."
 egypt_mubarak.114.a_tt: "If §Ythe army comes first§!"
 egypt_mubarak.114.b_tt: "If we §Yreceive the intelligence chiefs§!"
 egypt_mubarak.114.c_tt: "If §Ythey all wait for the president§!"
 egypt_mubarak.98.a_tt: "If we §Yretire him with full honors§!"
 egypt_mubarak.98.b_tt: "If we §Ymake a clean break§!"
 egypt_mubarak.115.t: "The Spymaster's Farewell"
 egypt_mubarak.115.d: "Omar Suleiman has handed over his office at General Intelligence, but his deputies still run the Gaza, Israel and Sudan files. The new director asks whether he should keep them or bring in his own people. Suleiman's friends in the service are watching how we treat him."
 egypt_mubarak.115.a: "A villa and a full pension."
 egypt_mubarak.115.b: "Clear out his deputies too."
 egypt_mubarak.115.a_tt: "If we give him §Ya villa and a full pension§!"
 egypt_mubarak.115.b_tt: "If we §Yclear out his deputies too§!"
 egypt_mubarak.116.t: "Dossiers in the Press"
 egypt_mubarak.116.d: "An independent newspaper has printed extracts from intelligence files on ministers close to the president. Everyone in Cairo assumes the leaks come from the officers we pushed out of General Intelligence. Tomorrow's edition promises more."
 egypt_mubarak.116.a: "Seize the print run."
 egypt_mubarak.116.b: "Let the story burn out."
 egypt_mubarak.116.a_tt: "If the dossiers leak and we §Yseize the print run§!"
 egypt_mubarak.116.b_tt: "If the dossiers leak and we §Ylet the story burn out§!"
 EGY_corrupt_mil_idea_desc: "The armed forces run factories, farms, hotels and construction firms that pay no taxes and publish no accounts. Contracts flow to retired generals, and the defense budget pays for loyalty as much as for readiness.\n§W--------------§!\nThis national spirit will §GImprove§! if the audit started by the §H$EGY_audit_the_nspo$§! focus succeeds, and will be §RRemoved§! and replaced by §H$EGY_corrupt_mil_idea6$§! if we complete the §H$EGY_respect_the_army_economy$§! or §H$EGY_army_contracts_for_loyalty$§! focus."
 EGY_corrupt_mil_idea1: "Audited Army Business"
 EGY_corrupt_mil_idea1_desc: "The Central Auditing Organization has examined part of the National Service Projects Organization's books. Some contracts are now tendered openly, but many ledgers never reached the inspectors.\n§W--------------§!\nThis national spirit will never be §RRemoved§!."
 EGY_corrupt_mil_idea3: "Accountable Army Business"
 EGY_corrupt_mil_idea3_desc: "The audit of the National Service Projects Organization has put most of the army's companies on the public books. Officers still run them, but their accounts now pass through the Central Auditing Organization.\n§W--------------§!\nThis national spirit will never be §RRemoved§!."
 EGY_corrupt_mil_idea6_desc: "We have left the army's economic empire untouched and handed it new contracts. The generals keep their share and their silence, and the officer corps stays loyal to the presidency.\n§W--------------§!\nThis national spirit will never be §RRemoved§!."
 EGY_great_debate_idea: "The Great Debate"
 EGY_great_debate_idea_desc: "The party, the cabinet and the security services argue in the open over how the new president should govern. Every faction sends us memoranda, and every newspaper takes a side."
 EGY_end_of_emergency_idea: "The End of Emergency Rule"
 EGY_end_of_emergency_idea_desc: "For the first time in three decades, the police must charge a suspect or release him. State Security officers resent the new limits, and the streets test how far they reach."
 EGY_unleashed_ssi_idea: "State Security Unleashed"
 EGY_unleashed_ssi_idea_desc: "State Security Investigations taps the phones of activists, imams and union leaders and detains them at will. Foreign governments and human rights groups report every arrest, and those released turn to the mosques."
 EGY_nchr_inspections_mission: "NCHR Prison Inspections"
 EGY_nchr_inspections_mission_desc: "Teams from the National Council for Human Rights are visiting prisons and police stations without notice. The Interior Ministry delays some visits and opens other doors. How far the inspectors get depends on how clean our own administration is."
 EGY_teda_zone_mission: "The Suez Economic Zone"
 EGY_teda_zone_mission_desc: "Chinese developers from Tianjin are building an industrial zone at Ain Sokhna on the Gulf of Suez. Whether the factories open on time depends on how clean our own administration is."
 egypt_mubarak.99.a_tt: "If §Ythe Central Security Forces clear the streets§!"
 egypt_mubarak.99.b_tt: "If we §Ylet them shout§!"
 egypt_mubarak.103.ndp_tt: "With a §Y60%§! chance, the NDP keeps its majority"
 egypt_mubarak.103.opposition_tt: "With a §Y40%§! chance, the opposition makes large gains"
 egypt_mubarak.103.always_tt: "Whatever the result"
 egypt_mubarak.117.t: "Badrawi's Purge List"
 egypt_mubarak.117.d: "Hossam Badrawi has brought us a list of party officials he wants removed, most of them businessmen who bought their seats through Ahmed Ezz. The old guard warns that a purge will split the party before the next elections. Badrawi says the alternative is to let members choose their own candidates."
 egypt_mubarak.117.a: "Expel Ezz's businessmen."
 egypt_mubarak.117.b: "Let the members hold primaries."
 egypt_mubarak.117.a_tt: "If we §Yexpel Ezz's businessmen§!"
 egypt_mubarak.117.b_tt: "If we §Ylet the members hold primaries§!"
 egypt_mubarak.118.t: "Prison Memoirs"
 egypt_mubarak.118.d: "The bloggers we released have begun to publish accounts of torture in police stations and State Security prisons. Their posts are shared by the thousand, and foreign newspapers reprint them. The Interior Ministry asks for permission to bring the loudest back in."
 egypt_mubarak.118.a: "Let them publish."
 egypt_mubarak.118.b: "Bring the loudest back in."
 egypt_mubarak.118.a_tt: "If we §Ylet them publish§!"
 egypt_mubarak.118.b_tt: "If we §Ybring the loudest back in§!"
 egypt_mubarak.119.t: "ElBaradei at Heliopolis Palace"
 egypt_mubarak.119.d: "Mohamed ElBaradei and the leaders of the National Association for Change have come to the palace with their seven demands for constitutional reform. The cameras are waiting outside. What we offer him will decide whether he leaves as a partner or as a rival."
 egypt_mubarak.119.a: "Form a constitutional committee."
 egypt_mubarak.119.b: "Offer him a ministry."
 egypt_mubarak.119.c: "A photograph and nothing more."
 egypt_mubarak.119.a_tt: "If we §Yform a constitutional committee§!"
 egypt_mubarak.119.b_tt: "If we §Yoffer him a ministry§!"
 egypt_mubarak.119.c_tt: "If we give him §Ya photograph and nothing more§!"
 egypt_mubarak.120.t: "The Parties Committee Backlog"
 egypt_mubarak.120.d: "With the Political Parties Committee stripped of its veto, dozens of applications have arrived at once, from liberal and Nasserist groups to parties founded by former members of the Brotherhood. The registrar asks whether every applicant should be accepted."
 egypt_mubarak.120.a: "Register every applicant."
 egypt_mubarak.120.b: "Only parties that keep religion out of politics."
 egypt_mubarak.120.a_tt: "If we §Yregister every applicant§!"
 egypt_mubarak.120.b_tt: "If we register §Yonly civil parties§!"
 egypt_mubarak.121.t: "The April 6 Founders on Trial"
 egypt_mubarak.121.d: "State Security has arrested the founders of the April 6 Youth Movement and the organizers of Kefaya. The prosecutor is ready to send them to an emergency court. State Security officers suggest that some of them would be more useful as informants than as prisoners."
 egypt_mubarak.121.a: "Send them to the State Security court."
 egypt_mubarak.121.b: "Turn them into informants."
 egypt_mubarak.121.a_tt: "If we §Ysend them to the State Security court§!"
 egypt_mubarak.121.b_tt: "If we §Yturn them into informants§!"
 egypt_mubarak.122.t: "Vodafone Egypt Ordered Offline"
 egypt_mubarak.122.d: "Cairo has made the power to cut every internet and mobile network a standing order of the presidency. Vodafone Egypt, owned in part by our largest telecoms company, must obey or lose its license. Human rights groups ask us to protest."
 egypt_mubarak.122.a: "Vodafone must obey local law."
 egypt_mubarak.122.b: "Condemn the order."
 egypt_mubarak.122.b_tt: "§Y[ENG.GetNameDef]§! protests the order and its opinion of us worsens."
 egypt_mubarak.123.t: "ON TV and Dream TV"
 egypt_mubarak.123.d: "Two private channels still host opposition guests every night. ON TV belongs to Naguib Sawiris, and Dream TV to Ahmed Bahgat. The Information Ministry can revoke their licenses, or friendly businessmen can buy them out."
 egypt_mubarak.123.a: "Revoke their licenses."
 egypt_mubarak.123.b: "Have loyal businessmen buy them."
 egypt_mubarak.123.a_tt: "If we §Yrevoke their licenses§!"
 egypt_mubarak.123.b_tt: "If we have §Yloyal businessmen buy them§!"
 egypt_mubarak.124.t: "The Judges' Club Assembly"
 egypt_mubarak.124.d: "The Judges' Club has called an emergency general assembly against the new retirement age and the transfers. As in 2006, the judges threaten to refuse to supervise the next elections. The Justice Minister asks whether to discipline the leaders or raise salaries."
 egypt_mubarak.124.a: "Refer the leaders to the disciplinary board."
 egypt_mubarak.124.b: "Raise judicial salaries."
 egypt_mubarak.124.a_tt: "If we §Yrefer the leaders to the disciplinary board§!"
 egypt_mubarak.124.b_tt: "If we §Yraise judicial salaries§!"
 egypt_mubarak.100.a_tt: "If we §Ydeclare the Nile a red line§!"
 egypt_mubarak.100.b_tt: "If we §Ycoordinate with Khartoum§!"
 egypt_mubarak.101.b: "Propose a tripartite technical committee."
 EGY_khartoum_nile_front_tt: "Khartoum stands with Cairo on the Nile. [ETH.GetNameDef] becomes §Gmore likely§! to accept a binding filling timetable.\n"
 EGY_gerd_committee_tt: "A tripartite committee studies the dam. [ETH.GetNameDef] becomes §Gmore likely§! to accept a binding filling timetable.\n"
 egypt_mubarak.125.t: "The President's First Tour"
 egypt_mubarak.125.d: "Every capital wants to be the first to host the new Egyptian president. Where Gamal Mubarak flies first will tell the world which partner Cairo values most."
 egypt_mubarak.125.a: "Washington first."
 egypt_mubarak.125.b: "Riyadh and Abu Dhabi first."
 egypt_mubarak.125.c: "Paris and Brussels first."
 egypt_mubarak.125.a_tt: "If we fly to §YWashington§! first"
 egypt_mubarak.125.b_tt: "If we fly to §YRiyadh and Abu Dhabi§! first"
 egypt_mubarak.125.c_tt: "If we fly to §YParis and Brussels§! first"
 egypt_mubarak.126.t: "Certifying Egypt's Military Aid"
 egypt_mubarak.126.d: "Congress expects the State Department to certify that Egypt meets its human rights commitments before $$1.3 billion in military aid is released. Cairo's new president asks us to release the money without conditions."
 egypt_mubarak.126.a: "Certify the aid."
 egypt_mubarak.126.b: "Attach human rights conditions."
 egypt_mubarak.127.t: "Washington's Conditions"
 egypt_mubarak.127.d: "The Americans will release the military aid only if we free jailed activists and let foreign NGOs work again. The security services warn that the activists will be back in Tahrir Square within a month."
 egypt_mubarak.127.a: "Accept the conditions."
 egypt_mubarak.127.b: "Refuse and take what is offered."
 egypt_mubarak.127.a_tt: "If we §Yaccept the conditions§!"
 egypt_mubarak.127.b_tt: "If we §Yrefuse the conditions§!"
 EGY_us_aid_conditions_tt: "Washington attaches human rights conditions, and we must answer them.\n"
 egypt_mubarak.128.t: "Cairo Wants the Rafale"
 egypt_mubarak.128.d: "Egypt wants 24 Rafale fighters and help with its navy, and it can pay quickly. No export customer has bought the Rafale yet, and Dassault needs this contract."
 egypt_mubarak.128.a: "Sell them the fighters."
 egypt_mubarak.128.b: "Offer licensed assembly and a naval package."
 egypt_mubarak.128.c: "Decline the deal."
 egypt_mubarak.128.a_tt: "If they §Ysell us the fighters§!"
 egypt_mubarak.128.b_tt: "If they §Yoffer licensed assembly and a naval package§!"
 EGY_gulf_cofinancing_tt: "Our §YGulf partners§! pay part of the bill.\n"
 EGY_rafale_licence_tt: "We receive a licence to build the §YRafale§!.\n"
 egypt_mubarak.129.t: "Egypt Asks to Exceed the Annex Limits"
 egypt_mubarak.129.d: "The peace treaty limits Egyptian forces in eastern Sinai. Cairo asks us to approve tanks, helicopters and extra battalions there to fight the jihadist cells near our border."
 egypt_mubarak.129.a: "Approve the deployment."
 egypt_mubarak.129.b: "Hold Cairo to the treaty."
 egypt_mubarak.130.t: "Egypt's Ceasefire Terms"
 egypt_mubarak.130.d: "Egyptian intelligence officers have brought us terms for a ceasefire in Gaza. Rocket fire would stop at once, and the crossings would open in stages under Egyptian supervision."
 egypt_mubarak.130.a: "Accept the terms."
 egypt_mubarak.130.b: "Accept only if Egypt closes the tunnels."
 egypt_mubarak.130.c: "Reject the terms."
 EGY_ceasefire_mediation_tt: "Our mediators carry the terms between [ISR.GetNameDef] and the Palestinian side. A deal needs both sides to agree.\n"
 EGY_ceasefire_tunnel_demand_tt: "[ISR.GetNameDef] may demand that we seal the Rafah tunnels before it signs.\n"
 egypt_mubarak.131.t: "Cairo's Ceasefire Terms"
 egypt_mubarak.131.d: "Egyptian mediators tell us the Israelis will stop the air strikes if our rockets fall silent. The crossings would open in stages, with Cairo as guarantor."
 egypt_mubarak.131.a: "Accept the ceasefire."
 egypt_mubarak.131.b: "Keep fighting."
 egypt_mubarak.132.t: "Israel Wants the Tunnels Closed"
 egypt_mubarak.132.d: "The Israelis will sign the ceasefire only if we close the smuggling tunnels under Rafah. The Brotherhood calls it a blockade of our Palestinian brothers."
 egypt_mubarak.132.a: "Seal the tunnels."
 egypt_mubarak.132.b: "Refuse the demand."
 egypt_mubarak.133.t: "The Cairo Ceasefire Holds"
 egypt_mubarak.133.d: "The guns over Gaza have fallen silent. Every capital that wants a say in the conflict must now pass through Cairo."
 egypt_mubarak.133.a: "Cairo is the only address for Gaza."
 egypt_mubarak.134.t: "The Gaza Talks Collapse"
 egypt_mubarak.134.d: "Our mediators have come home empty-handed, and the fighting in Gaza goes on. Smugglers and militants in Sinai take advantage of the chaos."
 egypt_mubarak.134.a: "We tried."
 egypt_mubarak.135.t: "Invitation to the EastMed Gas Forum"
 egypt_mubarak.135.d: "Cairo invites us to found an East Mediterranean Gas Forum with its headquarters in Egypt. Members would coordinate pipelines, liquefaction and exports to Europe."
 egypt_mubarak.135.a: "Join the forum."
 egypt_mubarak.135.b: "Decline the invitation."
 EGY_emgf_joined_tt: "We join the §YEast Mediterranean Gas Forum§!.\n"
 EGY_emgf_invitations_tt: "Invitations go to Greece, Cyprus, Israel, Italy and Jordan.\n"
 EGY_emgf_member_joins_tt: "The country gains a better opinion of us, and our influence there grows by §G2%§!.\n"
 EGY_emgf_founding_tt: "After §Y30§! days, the forum opens in Cairo"
 EGY_emgf_treasury_per_member_tt: "We gain §G$$0.5 billion§! for every member that joined.\n"
 EGY_emgf_small_forum_tt: "With fewer than §Y2§! members, the export bonus is only §Y3%§!.\n"
 egypt_mubarak.136.t: "The Forum Opens in Cairo"
 egypt_mubarak.136.d: "Energy ministers from [?EGY_emgf_members|Y0] countries signed the founding charter of the East Mediterranean Gas Forum in Cairo. Turkey was not invited and has denounced the forum."
 egypt_mubarak.136.a: "Gas will make us the hub of the region."
 egypt_mubarak.137.t: "A Joint Nile Front"
 egypt_mubarak.137.d: "Cairo asks us to stand with it against the Entebbe Agreement and defend the 1959 water treaty. Addis Ababa promises us cheap electricity from its dams if we stay neutral."
 egypt_mubarak.137.a: "Stand with Cairo."
 egypt_mubarak.137.b: "Keep our options open."
 egypt_mubarak.138.t: "Egypt Proposes a Tripartite Committee"
 egypt_mubarak.138.d: "Cairo proposes a committee of Egyptian, Sudanese and Ethiopian experts to study how the Renaissance Dam will affect the river. It would give Egypt a voice in how we fill the reservoir."
 egypt_mubarak.138.a: "Agree to the committee."
 egypt_mubarak.138.b: "The dam is our own affair."
 egypt_mubarak.142.t: "Egypt Seeks GCC Membership"
 egypt_mubarak.142.d: "Cairo has asked every member of the Gulf Cooperation Council to endorse its bid for membership. Egypt offers its army and its weight in the Arab world against Iran and the Muslim Brotherhood. In return, it expects Gulf money."
 egypt_mubarak.142.a: "Endorse Cairo."
 egypt_mubarak.142.b: "Not yet."
 EGY_gulf_backing_tt: "If §YSaudi Arabia§! or the §YEmirates§! endorse us, Gulf money will help pay for our French fighters.\n"
 EGY_uae_backing_tt: "If [UAE.GetNameDef] accepts, it also funds our work on the Libyan frontier.\n"
 egypt_mubarak.143.t: "Cairo Offers a Border Pact"
 egypt_mubarak.143.d: "Egypt offers us weapons and intelligence to secure the desert border, where smugglers move guns and fighters in both directions. In return, Cairo expects our cooperation against the jihadists in the east."
 egypt_mubarak.143.a: "Accept the pact."
 egypt_mubarak.143.b: "Decline the offer."
 EGY_uae_covers_frontier_tt: "Abu Dhabi covers part of the cost.\n"
 EGY_derna_raid_unlocked_tt: "For §Y2§! years, we can launch the §YDerna Strikes§! air raid against jihadist-held states in Libya.\n"
 egypt_mubarak.144.t: "The Derna Strikes"
 egypt_mubarak.144.d: "Jihadists in eastern Libya have murdered Egyptian workers and smuggle weapons across the border. The air force has prepared strikes on their camps around Derna."
 egypt_mubarak.144.a: "Launch the strikes."
 egypt_mubarak.144.b: "Hold back the air force."
 egypt_mubarak.144.a_tt: "If we §Ylaunch the strikes§!"
 egypt_mubarak.144.b_tt: "If we §Yhold back§!"
 EGY_derna_strike_odds_tt: "§Y60%§! success, gaining war support, military opinion and a lower Sinai bombing risk. §Y25%§! partial success, gaining a little war support. §Y15%§! failure, costing stability and air experience and raising the Sinai bombing risk.\n"
 EGY_derna_strike_success_tt: "The strikes destroy the jihadist camps.\n"
 EGY_derna_strike_partial_tt: "The strikes hit some of their targets.\n"
 EGY_derna_strike_failure_tt: "The strikes miss, and the jihadists strike back in Sinai.\n"
 egypt_mubarak.145.t: "The Sharm el-Sheikh Conference"
 egypt_mubarak.145.d: "Presidents, kings and bankers gather at Sharm el-Sheikh to hear Gamal Mubarak present Egypt's future. Each delegation hopes for a different message."
 egypt_mubarak.145.a: "Court the Western investors."
 egypt_mubarak.145.b: "Collect the Gulf pledges."
 egypt_mubarak.145.c: "Propose a joint Arab force."
 egypt_mubarak.145.a_tt: "If we §Ycourt the Western investors§!"
 egypt_mubarak.145.b_tt: "If we §Ycollect the Gulf pledges§!"
 egypt_mubarak.145.c_tt: "If we §Ypropose a joint Arab force§!"
 EGY_cheap_gas_for_industry: "Cheap Gas for Industry"
 EGY_cheap_gas_for_industry_desc: "The steel, cement and fertilizer tycoons of the New Guard warn that higher gas prices would close their plants. We keep the subsidy and widen it, betting that cheap energy will build Egypt faster than the Treasury can save."
 EGY_the_cyrenaican_buffer: "Security Zone in Cyrenaica"
 EGY_the_cyrenaican_buffer_desc: "The coast road from Tobruk to Derna is the main route for weapons and fighters heading into Egypt. We claim the borderland as a security zone and are ready to hold it ourselves."
 EGY_backing_haftar: "Backing the Libyan National Army"
 EGY_backing_haftar_desc: "The authorities in eastern Libya are fighting the same jihadists who threaten our western desert. We arm them and share intelligence, so that the border has a friendly government on the other side."
 EGY_energy_subsidies_idea: "Subsidized Energy"
 EGY_energy_subsidies_idea_desc: "Fuel, gas and electricity are sold far below cost, and energy takes about seventy percent of the subsidy bill. Factories and households waste what is cheap, and steel and cement plants grow fat on gas that could be exported."
 EGY_energy_subsidies_industrial_idea: "Cheap Gas for Industry"
 EGY_energy_subsidies_industrial_idea_desc: "The state sells gas to heavy industry at a fraction of its export price. Construction booms, but the bill keeps growing."
 EGY_energy_subsidy_cost_tt: "$$[?EGY_energy_subsidy_expense|-3] per week from §YEnergy Subsidies§!\n"
 EGY_imf_seal_of_approval_idea: "The IMF's Seal of Approval"
 EGY_imf_seal_of_approval_idea_desc: "We met the conditions of the programme. Rating agencies and foreign lenders now treat Egyptian debt as a safer bet."
 EGY_imf_programme_suspended_idea: "IMF Programme Suspended"
 EGY_imf_programme_suspended_idea_desc: "The Fund has frozen our programme after we missed its targets. Investors pull out, and lenders demand far higher interest on our bonds."
 EGY_gcc_strategic_partner_idea: "GCC Strategic Partner"
 EGY_gcc_strategic_partner_idea_desc: "The Gulf Cooperation Council has made Egypt a strategic partner. It is not membership, but Gulf capital now flows to Cairo more easily."
 EGY_imf_conditions_mission: "Meet the IMF Conditions"
 EGY_imf_conditions_mission_desc: "The Fund pays its second tranche only if we balance the budget without letting the bread queues get out of hand. If we miss the deadline, the programme is suspended."
 EGY_imf_conditions_tt: "Starts the §YMeet the IMF Conditions§! mission. Within §Y2§! years, our expenses must be lower than our income and bread pressure must be below §Y70§!.\n"
 EGY_imf_conditions_met_tt: "§GIf we meet the conditions§!"
 EGY_imf_conditions_failed_tt: "§RIf we miss the deadline§!"
 EGY_imf_bread_pressure_tt: "§YBread Pressure§! is below §Y70§! (now §Y[?EGY_bread_pressure|0]§!)"
 EGY_nile_university_missing_facility_tt: "Builds a §Yresearch facility§! of a type we have fewer than §Y2§! of.\n"
 EGY_nile_university_any_facility_tt: "Builds a random §Yresearch facility§!.\n"
 EGY_gulf_capital_invitations_tt: "We invite §YSaudi Arabia§!, the §YEmirates§!, §YKuwait§! and §YQatar§! to invest in Egypt.\n"
 EGY_gulf_capital_offer_tt: "They can fund a §Ynew civilian factory§! and keep Egypt on their list of investment targets, or place §Y2§! billion dollars in our central bank.\n"
 EGY_gulf_capital_thin_tt: "Too few Gulf funds invested to change much.\n"
 EGY_gcc_candidacy_tt: "Every §YGCC member§! that has not yet endorsed us is asked to support our membership.\n"
 EGY_gcc_endorsement_tt: "The member §Gendorses§! our bid for the Gulf Cooperation Council.\n"
 EGY_gcc_dominant_member_decides_tt: "After §Y30§! days, the leading GCC member decides on our candidacy.\n"
 EGY_gcc_invitation_tt: "If every member endorsed us, it can §Ginvite Egypt into the GCC§!. Otherwise, it offers us a strategic partnership.\n"
 EGY_gcc_partnership_tt: "§YStrategic partnership§! instead of membership\n"
 EGY_western_desert_attack_tt: "Libyan unrest will soon reach our side of the border.\n"
 EGY_western_desert_watch_tt: "If §YLibya§! falls into chaos, militants will strike in the Western Desert.\n"
 EGY_western_desert_grievance_tt: "We will be more willing to claim a §Ysecurity zone§! in Libya.\n"
 EGY_libya_is_unstable_tt: "§YLibya§! has fallen into chaos (Gaddafi no longer rules, or rival or jihadist governments hold Libyan land)"
 egypt_mubarak.146.t: "Cairo Courts Gulf Capital"
 egypt_mubarak.146.d: "Egypt's investment minister is touring the Gulf with a list of factory sites and an offer of tax breaks. Cairo would also welcome a large deposit at its central bank to steady the pound."
 egypt_mubarak.146.a: "Fund a factory in Egypt."
 egypt_mubarak.146.b: "Place a deposit at the Central Bank."
 egypt_mubarak.146.c: "Decline politely."
 egypt_mubarak.147.t: "The Gulf Delivers"
 egypt_mubarak.147.d: "The answers from the Gulf capitals are in. Their money is now flowing into new industrial zones and the reserves of the Central Bank."
 egypt_mubarak.147.a: "Put the money to work."
 egypt_mubarak.148.t: "Attack in the Western Desert"
 egypt_mubarak.148.d: "Gunmen who crossed from Libya have ambushed a border guard checkpoint near Farafra. Weapons from the looted Libyan arsenals are moving east across the open desert."
 egypt_mubarak.148.a: "Seal the border."
 egypt_mubarak.148.b: "Blame the Libyan militias."
 egypt_mubarak.149.t: "Egypt Requests a Security Zone"
 egypt_mubarak.149.d: "Cairo asks us to hand the Derna region to the Egyptian army as a security zone against the jihadists. Egypt would hold the coast road while our forces fight elsewhere."
 egypt_mubarak.149.a: "Let the Egyptians hold it."
 egypt_mubarak.149.b: "Libyan soil stays Libyan."
 egypt_mubarak.150.t: "Egypt's Candidacy"
 egypt_mubarak.150.d: "Egypt has asked to join the Gulf Cooperation Council. As the leading member, we decide whether to invite Cairo or offer a looser strategic partnership."
 egypt_mubarak.150.a: "Invite Egypt into the Council."
 egypt_mubarak.150.b: "Offer a strategic partnership."
 raid_type_EGY_raid_derna: "The Derna Strikes"
 raid_type_EGY_raid_derna_desc: "Egyptian fighters strike jihadist camps and depots in eastern Libya to stop the flow of weapons and fighters across the western desert."
 EGY_presidential_diwan_idea: "The Presidential Diwan"
 EGY_presidential_diwan_idea_desc: "Zakaria Azmi's staff at the presidency now screen every minister, governor and visiting envoy. Files that once went through the party secretariat cross the president's desk only after the Diwan has read them."
 EGY_reformers_exodus_idea: "The Reformers' Exodus"
 EGY_reformers_exodus_idea_desc: "The economists and businessmen of Gamal's secretariat have been pushed out of the party. Foreign banks and investors who knew them by name now wait to see who speaks for the economy in Cairo."
 EGY_the_2015_vote_mission: "The 2015 People's Assembly Vote"
 EGY_the_2015_vote_mission_desc: "The NDP must win a clear majority while the licensed parties win enough seats to make the result credible. If the vote has to be fixed again, the 2010 scandal repeats itself."
 EGY_2015_ndp_majority_tt: "The §YNational Democratic Party§! has more than §Y44%§! popularity."
 EGY_2015_licensed_opposition_tt: "The §YNew Wafd Party§! has more than §Y2%§! popularity."
 EGY_ministry_advisers_mission: "Fold the Advisers into the Ministries"
 EGY_ministry_advisers_mission_desc: "The secretariat's economists now sit in the ministries of finance, investment and trade as advisers. How well they work under the old ministers depends on how clean and orderly our administration is."
 EGY_new_guard_regroups_tt: "The reformers turn their advisory posts into a new power base inside the cabinet.\n"
 EGY_notables_paid_tt: "Within two months, the notables come back for more.\n"
 EGY_notables_cut_off_tt: "The provincial notables no longer owe us their votes, and the §Y2015 Parliamentary Elections§! lose the patronage bonus.\n"
 EGY_reformers_jailed_tt: "The jailed reformers will harden Western reactions to our §Y2015 Parliamentary Elections§!.\n"
 EGY_reformers_strike_back_tt: "A month later, the reformers strike back.\n"
 EGY_2015_observers_tt: "The §YUnited States§!, and §YFrance§! and §YGermany§! as members of the §YEuropean Union§!, will each decide whether to accept the result.\n"
 EGY_each_condemns_tt: "§HEffect for each nation that condemns the vote§!"
 EGY_gulf_old_guard_appeal_tt: "We ask §YSaudi Arabia§!, the §YEmirates§! and §YKuwait§! to back the Old Guard against the Brotherhood.\n"
 egypt_mubarak.151.t: "The Returning Veterans"
 egypt_mubarak.151.d: "Gamal's men are leaving the governorships and ministry departments they took over in the last decade. The president's office must decide who fills them. Each of the old pillars of the state has its own candidates."
 egypt_mubarak.151.a: "Give the posts back to the party barons."
 egypt_mubarak.151.b: "Appoint officers from State Security."
 egypt_mubarak.151.c: "Appoint retired generals as governors."
 egypt_mubarak.151.a_tt: "If we §Ygive the posts back to the party barons§!"
 egypt_mubarak.151.b_tt: "If we §Yappoint officers from State Security§!"
 egypt_mubarak.151.c_tt: "If we §Yappoint retired generals as governors§!"
 egypt_mubarak.152.t: "The Provincial Lists"
 egypt_mubarak.152.d: "Safwat el-Sherif has brought the president the NDP's lists for the governorates. Village mayors, tribal elders and landowning families expect contracts, jobs and licences in exchange for their votes. Interior Minister el-Adly would rather vet every name himself."
 egypt_mubarak.152.a: "Fund the notables."
 egypt_mubarak.152.b: "Let the Interior Ministry vet the lists."
 egypt_mubarak.152.a_tt: "If we §Yfund the notables§!"
 egypt_mubarak.152.b_tt: "If we §Ylet the Interior Ministry vet the lists§!"
 egypt_mubarak.153.t: "The Notables Want More"
 egypt_mubarak.153.d: "The families we paid have come back to the party offices. Rival clans in the same districts now demand the same contracts, and the old ones want their share renewed."
 egypt_mubarak.153.a: "Keep paying."
 egypt_mubarak.153.b: "Cut them off."
 egypt_mubarak.153.a_tt: "If we §Ykeep paying§!"
 egypt_mubarak.153.b_tt: "If we §Ycut them off§!"
 egypt_mubarak.154.t: "Corruption up to the Knees"
 egypt_mubarak.154.d: "Zakaria Azmi has told the People's Assembly that corruption in the local councils has risen up to the knees. He wants the Administrative Control Authority to audit the councils, most of which are run by el-Sherif's party men."
 egypt_mubarak.154.a: "Back Azmi's audit."
 egypt_mubarak.154.b: "Shield the party councils."
 egypt_mubarak.154.a_tt: "If we §Yback Azmi's audit§!"
 egypt_mubarak.154.b_tt: "If we §Yshield the party councils§!"
 egypt_mubarak.155.t: "The Secretariat's Files"
 egypt_mubarak.155.d: "With the Policies Secretariat closed, its files have reached the Public Prosecutor. They show steel licences, land sales and privatisation deals that made Gamal's businessmen ministers rich. The Old Guard wants trials."
 egypt_mubarak.155.a: "Prosecute Ezz and the businessmen ministers."
 egypt_mubarak.155.b: "Retire them quietly."
 egypt_mubarak.155.c: "Send them abroad."
 egypt_mubarak.155.a_tt: "If we §Yprosecute Ezz and the businessmen ministers§!"
 egypt_mubarak.155.b_tt: "If we §Yretire them quietly§!"
 egypt_mubarak.155.c_tt: "If we §Ysend them abroad§!"
 egypt_mubarak.156.t: "The Reformers Strike Back"
 egypt_mubarak.156.d: "The prosecuted ministers' friends own newspapers and satellite channels, and they have allies in Washington's think tanks. Their papers now run daily stories on the Old Guard's own fortunes."
 egypt_mubarak.156.a: "Shut the papers down."
 egypt_mubarak.156.b: "Ride out the campaign."
 egypt_mubarak.156.a_tt: "If we §Yshut the papers down§!"
 egypt_mubarak.156.b_tt: "If we §Yride out the campaign§!"
 egypt_mubarak.157.t: "The Price of a Licence"
 egypt_mubarak.157.d: "The Wafd and Tagammu will take part in the next election as a loyal opposition, but they want seats, state advertising for their newspapers and room to criticise the cabinet. Moderates who left the Brotherhood to found the Wasat Party also want a licence."
 egypt_mubarak.157.a: "Grant them seats and newspapers."
 egypt_mubarak.157.b: "License them, but keep the censors."
 egypt_mubarak.157.c: "License the Wasat breakaways too."
 egypt_mubarak.157.a_tt: "If we §Ygrant them seats and newspapers§!"
 egypt_mubarak.157.b_tt: "If we §Ylicense them, but keep the censors§!"
 egypt_mubarak.157.c_tt: "If we §Ylicense the Wasat breakaways too§!"
 egypt_mubarak.158.t: "Egypt's 2015 Vote"
 egypt_mubarak.158.d: "Egypt has held parliamentary elections in which the ruling NDP shared the field with licensed opposition parties. The fraud of 2010 has not been repeated openly, but the result was never in doubt. Cairo waits for our verdict."
 egypt_mubarak.158.d_jailed: "Egypt has held parliamentary elections in which the ruling NDP shared the field with licensed opposition parties. The reformers who once ran the party's economic policy are on trial in Cairo. Our verdict on the vote will also be read as a verdict on their prosecution."
 egypt_mubarak.158.a: "Accept the result."
 egypt_mubarak.158.b: "Condemn the vote."
 egypt_mubarak.159.t: "The Party Chairmanship"
 egypt_mubarak.159.d: "The president has chaired the NDP since 1981. His advisers suggest he resign the chairmanship and govern as the president of all Egyptians. El-Sherif warns that the party machine will not survive without him at its head."
 egypt_mubarak.159.a: "Resign the chairmanship."
 egypt_mubarak.159.b: "Keep the chair."
 egypt_mubarak.159.a_tt: "If we §Yresign the chairmanship§!"
 egypt_mubarak.159.b_tt: "If we §Ykeep the chair§!"
 egypt_mubarak.160.t: "Cairo's Old Guard Asks for Backing"
 egypt_mubarak.160.d: "Hosni Mubarak has pushed his son's reformers out and stands above the parties. His envoys ask us for deposits at the Central Bank of Egypt and for our support against the Brotherhood."
 egypt_mubarak.160.a: "Back the Rais."
 egypt_mubarak.160.b: "Decline."
 EGY_old_high_command_idea: "The Old High Command"
 EGY_old_high_command_idea_desc: "Field Marshal Tantawi and the officers of his generation keep their posts at the Defence Ministry and in the field armies. They are loyal to the institution they built, and promotions wait until they choose to leave."
 EGY_police_idea_desc: "The State Security Investigations Service and the Central Security Forces are being rebuilt with new funds, recruits and informants. Their reach grows with their budget, and so does the bill."
 EGY_nspo_contracts_mission: "The NSPO Contracts"
 EGY_nspo_contracts_mission_desc: "The National Service Projects Organisation is building roads, housing blocks and bakeries in Greater Cairo without tender. How much of the work is finished depends on how clean and orderly our administration is."
 EGY_sinai_compact_mission: "The Sinai Compact"
 EGY_sinai_compact_mission_desc: "The sheikhs of the Sawarka and Tarabin tribes have taken our jobs and land titles and promised to hunt the jihadist cells in their territory. Whether they keep the bargain depends on how much of the money reaches them."
 EGY_usa_aid_review_tt: "The §YUnited States§! will decide how its military aid follows our choice of commanders.\n"
 EGY_israel_sinai_compact_tt: "§YIsrael§! will decide whether to work with our tribal compact in North Sinai.\n"
 EGY_gulf_common_front_tt: "We ask §YSaudi Arabia§! and the §YEmirates§! to join our campaign against the Brotherhood.\n"
 EGY_ssi_overreach_tt: "Within weeks, State Security's methods produce a scandal.\n"
 EGY_ambitious_general_tt: "An ambitious general now waits for his moment, and he will return when we complete §H$EGY_the_pillars_hold$§!.\n"
 EGY_pillars_balanced_tt: "No pillar of the regime is dominating.\n"
 EGY_pillar_trimmed_tt: "One pillar has grown too strong, and we must cut it back to size.\n"
 egypt_mubarak.161.t: "Who Holds the Brotherhood File"
 egypt_mubarak.161.d: "Field Marshal Tantawi wants the Brotherhood's financiers tried before military courts, as Khairat el-Shater was in 2007. Interior Minister el-Adly insists that State Security knows the movement best. The Guidance Office has sent word that it would rather talk to the president directly."
 egypt_mubarak.161.a: "Send them to the military courts."
 egypt_mubarak.161.b: "Leave the file with State Security."
 egypt_mubarak.161.c: "Keep the channel in the presidency."
 egypt_mubarak.161.a_tt: "If we §Ysend them to the military courts§!"
 egypt_mubarak.161.b_tt: "If we §Yleave the file with State Security§!"
 egypt_mubarak.161.c_tt: "If we §Ykeep the channel in the presidency§!"
 egypt_mubarak.162.t: "The Generals' Governorships"
 egypt_mubarak.162.d: "Tantawi has brought a list of retiring major generals for the next round of governor appointments. A governorship is the reward an officer expects for a loyal career, and the field marshal's men expect it most of all."
 egypt_mubarak.162.a: "Give the governorships to the generals."
 egypt_mubarak.162.b: "Appoint civilian governors."
 egypt_mubarak.162.a_tt: "If we §Ygive the governorships to the generals§!"
 egypt_mubarak.162.b_tt: "If we §Yappoint civilian governors§!"
 egypt_mubarak.163.t: "The Passed-Over Generals"
 egypt_mubarak.163.d: "A dozen senior commanders of Tantawi's generation have been retired to make room for Anan and el-Sisi. They meet in the officers' clubs of Heliopolis and Nasr City and tell anyone who listens that the president has broken faith with the army."
 egypt_mubarak.163.a: "Give them seats on the industry boards."
 egypt_mubarak.163.b: "Let them go quietly."
 egypt_mubarak.163.c: "Have General Intelligence watch them."
 egypt_mubarak.163.a_tt: "If we §Ygive them seats on the industry boards§!"
 egypt_mubarak.163.b_tt: "If we §Ylet them go quietly§!"
 egypt_mubarak.163.c_tt: "If we §Yhave General Intelligence watch them§!"
 egypt_mubarak.164.t: "Washington and the Egyptian Command"
 egypt_mubarak.164.d: "President Mubarak has kept Field Marshal Tantawi at the Defence Ministry. Our $$1.3 billion in yearly military aid has long gone to the same senior officers. We must decide whether to keep it flowing unchanged or tie it to reform."
 egypt_mubarak.164.d_young: "President Mubarak has promoted a younger generation of Egyptian commanders, many of them trained at our war colleges. Pentagon officials see a chance to deepen training and joint exercises with our $$1.3 billion in yearly military aid."
 egypt_mubarak.164.a: "Keep the aid flowing."
 egypt_mubarak.164.b: "Tie the aid to reform."
 egypt_mubarak.165.t: "The Director of Military Intelligence"
 egypt_mubarak.165.d: "One of the young generals we promoted now runs Military Intelligence. He asks for a seat on the board that awards the NSPO contracts. His reports are the best the president receives, and he knows it."
 egypt_mubarak.165.a: "Give him the board seat."
 egypt_mubarak.165.b: "Post him to Washington as attaché."
 egypt_mubarak.165.c: "Have General Intelligence watch him."
 egypt_mubarak.165.a_tt: "If we §Ygive him the board seat§!"
 egypt_mubarak.165.b_tt: "If we §Ypost him to Washington as attaché§!"
 egypt_mubarak.165.c_tt: "If we §Yhave General Intelligence watch him§!"
 egypt_mubarak.166.t: "The Lazoghly Files"
 egypt_mubarak.166.d: "The rebuilt State Security Investigations Service at Lazoghly Square has claimed the files on foreign-funded NGOs. Omar Suleiman's General Intelligence says the files have always been its own. Each service is now withholding reports from the other."
 egypt_mubarak.166.a: "Back el-Adly's State Security."
 egypt_mubarak.166.b: "Back Suleiman's General Intelligence."
 egypt_mubarak.166.c: "Let them compete for our favour."
 egypt_mubarak.166.a_tt: "If we §Yback el-Adly's State Security§!"
 egypt_mubarak.166.b_tt: "If we §Yback Suleiman's General Intelligence§!"
 egypt_mubarak.166.c_tt: "If we §Ylet them compete for our favour§!"
 egypt_mubarak.167.t: "A Death in Custody"
 egypt_mubarak.167.d: "A young man from Alexandria has died after a beating by State Security officers. Photographs of his body are spreading online, and the Brotherhood's deputies are raising the case in the People's Assembly."
 egypt_mubarak.167.a: "Cover it up."
 egypt_mubarak.167.b: "Prosecute the officers."
 egypt_mubarak.167.a_tt: "If we §Ycover it up§!"
 egypt_mubarak.167.b_tt: "If we §Yprosecute the officers§!"
 egypt_mubarak.168.t: "Ration Day at Darrasa"
 egypt_mubarak.168.d: "The new pay and rations have reached the Central Security Forces camp at Darrasa, but the conscripts say their quartermasters are selling half of it. In 1986 a rumour like this one started a mutiny."
 egypt_mubarak.168.a: "Court-martial the quartermasters."
 egypt_mubarak.168.b: "Look away."
 egypt_mubarak.168.c: "Double the rations."
 egypt_mubarak.168.a_tt: "If we §Ycourt-martial the quartermasters§!"
 egypt_mubarak.168.b_tt: "If we §Ylook away§!"
 egypt_mubarak.168.c_tt: "If we §Ydouble the rations§!"
 egypt_mubarak.169.t: "The Sheikh's Bargain Breaks"
 egypt_mubarak.169.d: "A sheikh who signed our compact has been caught moving rockets through the tunnels into Gaza. His men still hold the roads around el-Arish, and the jihadist cells he promised to hunt have gone quiet in his villages."
 egypt_mubarak.169.a: "Send in the Second Field Army."
 egypt_mubarak.169.b: "Buy him back."
 egypt_mubarak.169.c: "Let General Intelligence turn his rivals."
 egypt_mubarak.169.a_tt: "If we §Ysend in the Second Field Army§!"
 egypt_mubarak.169.b_tt: "If we §Ybuy him back§!"
 egypt_mubarak.169.c_tt: "If we §Ylet General Intelligence turn his rivals§!"
 egypt_mubarak.170.t: "Egypt's Bedouin Compact"
 egypt_mubarak.170.d: "Cairo has paid the Bedouin sheikhs of North Sinai to police the jihadist cells in their territory. It asks us to allow more Egyptian troops in the zones limited by the peace treaty. Some of the same tribes run the smuggling tunnels into Gaza."
 egypt_mubarak.170.a: "Coordinate with Cairo."
 egypt_mubarak.170.b: "Protest the Gaza smuggling."
 egypt_mubarak.171.t: "Cairo Asks for a Common Front"
 egypt_mubarak.171.d: "Egypt's security services have mapped the Brotherhood's networks after the unrest of 2011. Cairo asks us to freeze the movement's accounts and expel its organisers. A common front would also protect our own thrones."
 egypt_mubarak.171.a: "Join the common front."
 egypt_mubarak.171.b: "Stay out of it."
 egypt_mubarak.172.t: "The General Who Waited"
 egypt_mubarak.172.d: "The general who sits on the NSPO board has built a following among the younger officers. He now asks to become chief of staff. We must decide whether to bind him closer or send him into retirement."
 egypt_mubarak.172.a: "Retire him with honours."
 egypt_mubarak.172.b: "Make him chief of staff."
 egypt_mubarak.172.a_tt: "If we §Yretire him with honours§!"
 egypt_mubarak.172.b_tt: "If we §Ymake him chief of staff§!"
 EGY_public_sector_losses_idea: "Losses in the Public Sector"
 EGY_public_sector_losses_idea_desc: "No more state companies are for sale. The unions and the ministries are reassured, but the spinning mills, the steelworks and the department stores still lose money every month, and the treasury covers each loss."
 EGY_ration_register_mission: "Rebuild the Ration Registers"
 EGY_ration_register_mission_desc: "Officials of the Ministry of Social Solidarity are adding millions of families back to the ration card registers. The tamwin grocers who hand out the sugar, oil and rice decide how much of it reaches them."
 EGY_ain_sokhna_mission: "The Ain Sokhna State Plants"
 EGY_ain_sokhna_mission_desc: "State holding companies are building steel, cement and fertiliser plants on the Gulf of Suez. The National Service Projects Organisation would gladly take over any site that falls behind."
 EGY_toshka_pumping_mission: "The New Toshka Pumps"
 EGY_toshka_pumping_mission_desc: "New pumping stations on Lake Nasser will push Nile water deeper into the Sheikh Zayed canal. The desert heat and our own ministries decide whether the pumps run through their first summer."
 EGY_metro_line_four_mission: "Building Metro Line Four"
 EGY_metro_line_four_mission_desc: "Tunnelling crews are working under Giza toward New Cairo, and public housing is being planned along the route. Contracts and land deals decide how much of the line opens on schedule."
 EGY_tycoon_partners_tt: "In two months, the case reaches the minister's business partners.\n"
 EGY_west_privatisation_freeze_tt: "The §YUnited States§!, §YFrance§! and §YGermany§! will respond to the end of our privatisation programme.\n"
 EGY_tt_if_each_objects: "§HEffect for each nation that Objects§!"
 EGY_tanta_back_pay_tt: "In three months, the workers of the reopened mills demand their back pay.\n"
 EGY_saudi_omar_effendi_tt: "The Saudi buyers of §YOmar Effendi§! and §YTanta Flax§! will ask §YSaudi Arabia§! to defend their claims.\n"
 EGY_wheat_share_shields_tt: "A higher §YDomestic Wheat Share§! softens every future rise in world grain prices.\n"
 EGY_toshka_feeds_owainat_tt: "The completed §YToshka§! canal shares its water and silos with East Owainat.\n"
 EGY_gulf_desert_farms_tt: "We invite §YSaudi Arabia§! and the §YEmirates§! to invest in the desert farms.\n"
 EGY_state_firms_get_orders_tt: "The firms we kept in state hands receive orders from the new zone.\n"
 EGY_reclaimed_plants_move_tt: "Machinery from the renationalised factories moves to Ain Sokhna.\n"
 EGY_china_ain_sokhna_tt: "§YChina§! will decide whether TEDA builds next to our state plants.\n"
 EGY_japan_metro_loan_tt: "§YJapan§! will decide whether to finance the line through a JICA loan.\n"
 EGY_nspo_takes_sokhna_tt: "The army's National Service Projects Organisation takes over the unfinished sites.\n"
 EGY_paternal_budget_alive_tt: "The state can still pay its way. The treasury is in credit, debt is below 100% of GDP and the bread queues are gone.\n"
 EGY_paternal_overstretched_tt: "The state is overstretched. The treasury is empty, debt is above 100% of GDP or the bread queues have returned.\n"
 egypt_mubarak.173.t: "The Ministry of Social Solidarity"
 egypt_mubarak.173.d: "Minister Ali Moselhy has drawn up plans for more subsidised bread, more pensions for widows and more cash for the poorest households. The Ministry of Finance asks where the money will come from. The army offers its own shops and bakeries as a cheaper way to deliver it."
 egypt_mubarak.173.a: "Pay for it from the budget."
 egypt_mubarak.173.b: "Deliver it through the army's outlets."
 egypt_mubarak.173.c: "Borrow to pay for it."
 egypt_mubarak.173.a_tt: "If we §Ypay for it from the budget§!"
 egypt_mubarak.173.b_tt: "If we §Ydeliver it through the army's outlets§!"
 egypt_mubarak.173.c_tt: "If we §Yborrow to pay for it§!"
 egypt_mubarak.174.t: "The Maghrabi Land Case"
 egypt_mubarak.174.d: "The Prosecutor General has opened a case against former Housing Minister Ahmed el-Maghrabi. State desert land was sold to his own companies at a fraction of its value. His lawyers are ready to repay the difference if the case is dropped, and his family's jet is waiting at Cairo airport."
 egypt_mubarak.174.a: "Put him on trial."
 egypt_mubarak.174.b: "Accept the repayment."
 egypt_mubarak.174.c: "Let him leave for London."
 egypt_mubarak.174.a_tt: "If we §Yput him on trial§!"
 egypt_mubarak.174.b_tt: "If we §Yaccept the repayment§!"
 egypt_mubarak.174.c_tt: "If we §Ylet him leave for London§!"
 egypt_mubarak.175.t: "The Partners in the Dock"
 egypt_mubarak.175.d: "Maghrabi's testimony names the developers who bought the land with him. Several of them sit on the Policies Secretariat of the National Democratic Party, and one is a close friend of Gamal Mubarak. The prosecutors ask how far they may go."
 egypt_mubarak.175.a: "Widen the case to Gamal's circle."
 egypt_mubarak.175.b: "Close the file with Maghrabi."
 egypt_mubarak.175.a_tt: "If we §Ywiden the case to Gamal's circle§!"
 egypt_mubarak.175.b_tt: "If we §Yclose the file with Maghrabi§!"
 egypt_mubarak.176.t: "Cairo Freezes Its Sell-Offs"
 egypt_mubarak.176.d: "President Mubarak has ended the privatisation programme his son's cabinet started. The remaining state companies will be kept and told to hire. The IMF warns that their losses will widen Egypt's deficit, and our investors want to know whether we will say so in public."
 egypt_mubarak.176.a: "Accept Cairo's reasons."
 egypt_mubarak.176.b: "Warn of the consequences."
 egypt_mubarak.177.t: "Back Pay at Tanta Flax"
 egypt_mubarak.177.d: "The reopened Tanta Flax and Oils plant has no money for the wages its workers lost while it stood idle. Two thousand of them are sitting in on the factory floor. The National Service Projects Organisation has offered to take over the mills and pay the wages itself."
 egypt_mubarak.177.a: "Pay the arrears."
 egypt_mubarak.177.b: "Send the Central Security Forces."
 egypt_mubarak.177.c: "Hand the mills to the army."
 egypt_mubarak.177.a_tt: "If we §Ypay the arrears§!"
 egypt_mubarak.177.b_tt: "If we §Ysend the Central Security Forces§!"
 egypt_mubarak.177.c_tt: "If we §Yhand the mills to the army§!"
 egypt_mubarak.178.t: "Cairo Seizes Omar Effendi"
 egypt_mubarak.178.d: "An Egyptian court has annulled the sale of the Omar Effendi department stores and the Tanta Flax plant to Saudi investors. Cairo is taking both back and offers compensation at its own valuation. The buyers ask us to support international arbitration."
 egypt_mubarak.178.a: "Accept Cairo's terms."
 egypt_mubarak.178.b: "Back the arbitration claim."
 egypt_mubarak.179.t: "Prices Rise in the Souk"
 egypt_mubarak.179.d: "Within weeks of the pay rise, the price of meat, cooking oil and vegetables has gone up in the markets of Cairo. Traders say the civil servants have more to spend. Families with no state salary pay the higher prices with the same money as before."
 egypt_mubarak.179.a: "Fix the prices of staples."
 egypt_mubarak.179.b: "Let prices settle."
 egypt_mubarak.179.c: "Release the strategic reserves."
 egypt_mubarak.179.a_tt: "If we §Yfix the prices of staples§!"
 egypt_mubarak.179.b_tt: "If we §Ylet prices settle§!"
 egypt_mubarak.179.c_tt: "If we §Yrelease the strategic reserves§!"
 egypt_mubarak.180.t: "The Grocers' Ghost Cards"
 egypt_mubarak.180.d: "Inspectors have found that ration grocers in Imbaba and Shubra draw sugar and oil for families who moved away or died years ago. The goods are sold on the open market, and the new registers have been padded the same way."
 egypt_mubarak.180.a: "Audit every tamwin grocer."
 egypt_mubarak.180.b: "Look away."
 egypt_mubarak.180.c: "Distribute through the army's shops."
 egypt_mubarak.180.a_tt: "If we §Yaudit every tamwin grocer§!"
 egypt_mubarak.180.b_tt: "If we §Ylook away§!"
 egypt_mubarak.180.c_tt: "If we §Ydistribute through the army's shops§!"
 egypt_mubarak.181.t: "A JICA Loan for Line Four"
 egypt_mubarak.181.d: "Egypt asks the Japan International Cooperation Agency to finance a fourth Cairo metro line, from Giza and the pyramids to New Cairo. Japanese firms would supply the trains and signals. Cairo's finances are weak, but it has repaid our earlier metro loans."
 egypt_mubarak.181.a: "Extend the loan."
 egypt_mubarak.181.b: "Decline."
 egypt_mubarak.182.t: "The Pumps Fail in August"
 egypt_mubarak.182.d: "In the heat of its first summer, the new pumping station on Lake Nasser has broken down. Silt has clogged the intakes, and the newly planted fields along the Sheikh Zayed canal are drying out. The engineers say the station was never built to the original design."
 egypt_mubarak.182.a: "Have the army repair it."
 egypt_mubarak.182.b: "Borrow for new pumps."
 egypt_mubarak.182.c: "Write off the canal extension."
 egypt_mubarak.182.a_tt: "If we §Yhave the army repair it§!"
 egypt_mubarak.182.b_tt: "If we §Yborrow for new pumps§!"
 egypt_mubarak.182.c_tt: "If we §Ywrite off the canal extension§!"
 egypt_mubarak.183.t: "Gulf Capital for the Desert Farms"
 egypt_mubarak.183.d: "Egypt is drilling into the Nubian aquifer to grow wheat at East Owainat, near the Sudanese border. Cairo offers Gulf agricultural companies long leases on the centre-pivot farms. Part of each harvest would be sold in Egypt's own markets."
 egypt_mubarak.183.a: "Invest in the farms."
 egypt_mubarak.183.b: "Decline."
 egypt_mubarak.184.t: "TEDA and the State Plants"
 egypt_mubarak.184.d: "Egypt is building state steel, cement and fertiliser plants at Ain Sokhna, next to the zone run by the Tianjin Economic-Technological Development Area. Cairo asks TEDA to build factories alongside them and share the port and power lines."
 egypt_mubarak.184.a: "Build alongside the state plants."
 egypt_mubarak.184.b: "Decline."
 EGY_abdullah_called_first_tt: "King Abdullah will remember that we called him first. His next loan to us grows by §G1§! billion.\n"
 EGY_worried_rulers_opinion_tt: "Every non-democratic member of the §YArab League§! gains a better opinion of us.\n"
 egypt_mubarak.185.a_tt: "If we call King Abdullah first"
 egypt_mubarak.185.b_tt: "If we call our old friends at the Pentagon"
 egypt_mubarak.185.c_tt: "If we receive the worried rulers in Cairo"
 EGY_salloum_road_tt: "The army's engineers rebuild the coastal road to §YSalloum§! at no cost to the treasury.\n"
 egypt_mubarak.186.a_tt: "If we bring the workers home"
 egypt_mubarak.186.b_tt: "If we demand guarantees from the Libyan government"
 EGY_workers_guaranteed_tt: "Our workers stay in Libya under the government's protection and keep sending money home.\n"
 egypt_mubarak.193.a_tt: "If Riyadh sends deposits and oil on credit"
 egypt_mubarak.193.b_tt: "If Riyadh sends deposits only"
 EGY_old_friend_bonus_tt: "Because we called King Abdullah first, the loan is larger.\n"
 EGY_saudi_investment_target_tt: "§YSaudi Arabia§! adds us to its permanent investment targets.\n"
 EGY_med_border_invitations_tt: "§YItaly§!, §YFrance§!, §YSpain§!, §YGreece§!, §YMalta§! and §YCyprus§! are asked to fund our coast guard, unless they are at war with us.\n"
 EGY_med_border_partner_tt: "The partner pays its share and gains a much better opinion of us.\n"
 EGY_med_border_closes_tt: "After §Y30§! days the pact is signed, and the result depends on how many partners paid.\n"
 EGY_med_border_tier_high_tt: "If §Y4§! or more partners pay"
 EGY_med_border_tier_mid_tt: "If §Y2§! or §Y3§! partners pay"
 EGY_med_border_tier_low_tt: "If fewer than §Y2§! partners pay"
 EGY_libyan_shuttle_tt: "Our envoys carry terms from §YTripoli§! to §YBenghazi§!. Both sides must agree to talks in Cairo.\n"
 egypt_mubarak.190.a_tt: "If we broker a ceasefire on the current lines"
 egypt_mubarak.190.b_tt: "If we back our eastern neighbor"
 EGY_shuttle_breaks_down_tt: "The talks collapse, and we think less of the side that walked out.\n"
 EGY_cairo_summit_invitations_tt: "Every member of the §YArab League§! not at war with us is invited to sign the §YCairo Declaration§!.\n"
 EGY_summit_signatory_tt: "The signatory gains a much better opinion of us, and our influence there grows by §G3%§!.\n"
 EGY_cairo_summit_closes_tt: "After §Y30§! days the summit closes, and the result depends on how many rulers signed.\n"
 EGY_summit_tier_high_tt: "If §Y8§! or more rulers sign"
 EGY_summit_tier_mid_tt: "If §Y4§! to §Y7§! rulers sign"
 EGY_summit_tier_low_tt: "If fewer than §Y4§! rulers sign"
 EGY_dean_friends_tt: "For every §Y3§! members of the §YArab League§! with an opinion of us above §Y40§!, the modifier grows by a further §G1%§!, up to §G3%§!.\n"
 EGY_riyadh_cairo_treaty_tt: "We sign a §YMutual Investment Treaty§! with §YSaudi Arabia§!.\n"
 EGY_envoy_carries_terms_tt: "The Egyptian envoy carries our terms to the other side.\n"
 EGY_talks_in_cairo_tt: "Both sides meet in Cairo, and the Egyptians set the final terms.\n"
 EGY_signed_cairo_declaration_tt: "We sign the §YCairo Declaration§!.\n"
 egypt_mubarak.185.t: "The Old Friends Call"
 egypt_mubarak.185.d: "The President's telephone has not stopped ringing since the revolts began. Kings and presidents who once lectured Cairo now ask the old man how he survived January. He decides which friendship to tend first."
 egypt_mubarak.185.a: "Call King Abdullah."
 egypt_mubarak.185.b: "Call the old hands at the Pentagon."
 egypt_mubarak.185.c: "Receive the worried rulers in Cairo."
 egypt_mubarak.186.t: "A Million Workers in Libya"
 egypt_mubarak.186.d: "Egyptian builders, farmhands and teachers are trapped between the militias across the western border. Their families crowd the gates of the Foreign Ministry. Every week they stay, their remittances keep villages in Upper Egypt alive."
 egypt_mubarak.186.a: "Bring them home through Salloum."
 egypt_mubarak.186.b: "Demand that Tripoli protect them."
 egypt_mubarak.187.t: "Cairo Asks for Its Workers' Safety"
 egypt_mubarak.187.d: "Cairo asks us to guarantee the safety of the Egyptian workers in our country. Their labor keeps our cities running, and Mubarak has made clear that he takes their fate personally."
 egypt_mubarak.187.a: "Guarantee their safety."
 egypt_mubarak.187.b: "We cannot promise anything."
 egypt_mubarak.188.t: "An Egyptian Envoy in Tripoli"
 egypt_mubarak.188.d: "An envoy from Mubarak has arrived with an offer to mediate. Cairo would carry our terms to the other side and host talks under the President's chairmanship."
 egypt_mubarak.188.a: "Let Cairo carry our terms."
 egypt_mubarak.188.b: "We need no mediator."
 egypt_mubarak.189.t: "Cairo Carries Tripoli's Terms"
 egypt_mubarak.189.d: "The Egyptian envoy brings terms from our rivals and an invitation to talks in Cairo. Mubarak's palace offers a neutral table, but the Egyptians will expect something in return."
 egypt_mubarak.189.a: "Go to Cairo."
 egypt_mubarak.189.b: "Send the envoy home."
 egypt_mubarak.190.t: "Talks at the Ittihadiya Palace"
 egypt_mubarak.190.d: "Both Libyan delegations have arrived in Heliopolis and sit in separate wings of the palace. Our envoys carry papers between them. The President must now decide what kind of peace Egypt wants on its western border."
 egypt_mubarak.190.a: "Broker a ceasefire on the current lines."
 egypt_mubarak.190.b: "Back our eastern neighbor."
 egypt_mubarak.191.t: "The Shuttle Breaks Down"
 egypt_mubarak.191.d: "One of the Libyan camps has turned our envoys away. The fighting goes on, and weapons keep moving east across the desert toward Sinai."
 egypt_mubarak.191.a: "We tried."
 egypt_mubarak.192.t: "Cairo Offers a Border Compact"
 egypt_mubarak.192.d: "Cairo proposes a compact for the Salloum crossing. Our border guards would work with theirs against smugglers, and Egyptian goods and workers would cross freely."
 egypt_mubarak.192.a: "Sign the compact."
 egypt_mubarak.192.b: "Decline."
 egypt_mubarak.193.t: "Mubarak Asks His Old Friend"
 egypt_mubarak.193.d: "Mubarak has asked the King for help. The revolts emptied his treasury, and Egypt wants deposits in its central bank and oil on credit. The King has not forgotten that Cairo stood firm when others fell."
 egypt_mubarak.193.a: "Send deposits and oil on credit."
 egypt_mubarak.193.b: "Send deposits only."
 egypt_mubarak.193.c: "Decline."
 egypt_mubarak.194.t: "Cairo Asks for the Held Deliveries"
 egypt_mubarak.194.d: "Egypt's generals ask the Pentagon to release the Apaches, F-16s and Harpoon missiles that Congress froze after the 2011 crackdown. Cairo says it needs them against the militants in the Sinai."
 egypt_mubarak.194.a: "Release the deliveries."
 egypt_mubarak.194.b: "Keep them on hold."
 egypt_mubarak.195.t: "Cairo Orders Power Plants from Siemens"
 egypt_mubarak.195.d: "Cairo has ordered gas-fired power plants from Siemens for millions of Egyptian homes, the largest order in the company's history. Siemens will build them either way, but Cairo asks Berlin to cover half the bill with export credit."
 egypt_mubarak.195.a: "Back the order."
 egypt_mubarak.195.b: "Refuse the export credit."
 egypt_mubarak.196.t: "Cairo Offers to Close the Boat Route"
 egypt_mubarak.196.d: "Egypt has passed a strict anti-smuggling law and promises to stop the boats leaving its northern coast. Cairo asks us to pay a share of the new coast guard patrols."
 egypt_mubarak.196.a: "Fund the Egyptian coast guard."
 egypt_mubarak.196.b: "Raise our human rights concerns."
 egypt_mubarak.197.t: "The Coast Guard Pact"
 egypt_mubarak.197.d: "The answers from the European capitals are in. Our patrol boats now sail from Alexandria to Rosetta, and the number of partners paying for them decides how much Europe owes us."
 egypt_mubarak.197.a: "The coast is closed."
 egypt_mubarak.198.t: "Invitation to the Cairo Summit"
 egypt_mubarak.198.d: "Mubarak invites the Arab heads of state to Cairo. His Cairo Declaration commits its signatories to non-interference and to standing together against the revolts."
 egypt_mubarak.198.a: "Sign the Cairo Declaration."
 egypt_mubarak.198.b: "Send a deputy."
 egypt_mubarak.198.c: "Boycott the summit."
 egypt_mubarak.199.t: "The Cairo Summit Closes"
 egypt_mubarak.199.d: "The leaders have left the conference hall in Nasr City. Mubarak counts the signatures on his declaration as carefully as he once counted votes."
 egypt_mubarak.199.a: "The Arab League stands together."
 egypt_mubarak.200.t: "The Dean's Bargain"
 egypt_mubarak.200.d: "Mubarak has offered to bring the Arab capitals behind our regional policy. In return he asks Washington to restore Egypt's place among its closest allies."
 egypt_mubarak.200.a: "Accept the bargain."
 egypt_mubarak.200.b: "Decline."
 egypt_mubarak.201.t: "The Riyadh-Cairo Axis"
 egypt_mubarak.201.d: "Mubarak proposes that Riyadh and Cairo bind their economies together. Saudi capital would back Egypt's state firms, and the two thrones would stand side by side."
 egypt_mubarak.201.a: "Sign the treaty."
 egypt_mubarak.201.b: "Decline."
 EGY_saudi_oil_credit_idea: "Saudi Oil on Credit"
 EGY_saudi_oil_credit_idea_desc: "Saudi tankers deliver crude and fuel oil to our power stations, with payment deferred for years. The lights stay on without burning our reserves."
 EGY_cairo_declaration_idea: "The Cairo Declaration"
 EGY_cairo_declaration_idea_desc: "The rulers who signed in Cairo have promised not to meddle in one another's affairs or shelter one another's dissidents. The club of Arab rulers protects its members."
 EGY_seal_the_western_desert_mission: "Seal the Western Desert"
 EGY_seal_the_western_desert_mission_desc: "Border guards and army patrols hunt the smugglers who carry Libyan weapons east toward Sinai. Whether the routes stay closed depends on how many officers the smugglers can buy."
