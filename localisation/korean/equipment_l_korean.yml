 CHI_Anti_Air_0_desc: "HN-5('홍영-5')는 소련 기술을 기반으로 한 1세대 고체 연료 로켓 모터 방식의 중국제 휴대용 방공 미사일 체계(MANPAD) 계열입니다."
 CHI_Anti_Air_1_desc: "중화인민공화국이 개발한 QW-1 반가드는 전방위 교전이 가능한 고체 로켓 적외선 유도 방식의 휴대용 지대공 미사일입니다."
 CHI_Anti_Air_2_desc: "FN-6 또는 페이누-6('비노-6')은 3세대 단일 단계 고체 로켓 모터 방식의 수동 적외선 유도 휴대용 방공 체계입니다."
