 ISR_ask_egypt_to_mediate: "Pedir ao Egito Mediação Diplomática"
 israel.93.t: "Israel pede um favor diplomático!"
 israel.93.d: "O governo israelense nos procurou recentemente pedindo que nossa missão diplomática medie as negociações entre Israel e a Palestina.\n\nConsiderando que nossas relações com Israel esquentaram recentemente e que a Palestina confia mais em nós, talvez possamos fazer isso para ganhar mais peso diplomático. Devemos concordar?"
 israel.93.a: "Ligue para Arafat!"
 israel.93.b: "Sem acordos com o Diabo."
 israel.94.t: "O Egito recusa!"
 israel.94.d: "O líder egípcio [EGY.GetLeader] recusou nossa proposta. Eles dizem que não têm interesse em mediar entre nós e a Palestina. Consideram essa tentativa de engano diplomático um pacto com o diabo que jamais aceitarão."
 israel.94.a: "O quê?!"
 medsuc_pr_tt: "Se a §Ymediação§! for bem-sucedida, as tensões entre a Palestina e Israel diminuirão e ambos os lados se beneficiarão."
 israel.95.t: "Reunião em Sharm El Sheikh!"
 israel.95.d: "Recentemente, o governo egípcio foi solicitado pelo governo de Israel a mediar a redução das tensões entre nós e Israel.\n\nAmbas as missões diplomáticas chegaram a Sharm El Sheikh e estamos prontos para dizer nossa primeira palavra, que determinará o resultado da reunião."
 israel.95.a: "Concordamos em acalmar a situação."
 israel.95.b: "Iniciativa idiota!"
 israel.96.t: "Reunião bem-sucedida em Sharm El Sheikh!"
 israel.96.d: "Felizmente, graças aos esforços do governo egípcio, Israel e Palestina reduziram suas tensões e um acordo temporário foi alcançado."
 israel.96.a: "Ótimo!"
 israel.96.b: "Obrigado, Egito!"
 israel.97.t: "Reunião fracassada em Sharm El Sheikh!"
 israel.97.d: "Após uma hora de negociações, a delegação palestina deixou a conferência e não continuará as conversas."
 israel.97.a: "Bem... tentamos."
 israel.97.b: "Estupidez teimosa!"
 PAL_emergency_quartet_meeting: "Solicitar uma Reunião de Emergência do Quarteto"
 ISR_associate_with_waronterror: "Associar-se à Guerra ao Terror!"
 ISR_clearance_tax_discuss: "Discutir a Compensação Tributária"
 israel.98.t: "Discussão sobre a Compensação Tributária"
 israel.98.d: "Devemos aumentar ou diminuir a compensação tributária para a Palestina? Qual é a nossa decisão agora?"
 israel.98.a: "Aumentá-la!"
 israel.98.b: "Diminuí-la."
 israel.98.c: "Mudei de ideia."
 israel.99.t: "Israel reduz a compensação tributária!"
 israel.99.d: "Israel decidiu recentemente reduzir a compensação tributária. Agora sofremos menos com isso."
 israel.99.a: "Bom!"
 israel.100.t: "Israel aumenta a compensação tributária!"
 israel.100.d: "Israel decidiu recentemente aumentar a compensação tributária. Agora sofremos mais com isso."
 israel.100.a: "Desgraçados!"
