 aus_cyclone.1.d: "一场威力强大的飓风在昆士兰州登陆，造成全州基础设施损毁，超过6万户家庭断电数日。这场飓风经过所罗门群岛后，强度维持在3级，之后逐渐消散。由于预警提前发布，大部分居民已提前撤离，但仍有一人死亡。\n\n国家紧急服务部门和澳大利亚国防军已部署到位，负责修复损坏并恢复供电。"
 aus_cyclone.1.a: "然而，这仍然是一场悲剧。"
