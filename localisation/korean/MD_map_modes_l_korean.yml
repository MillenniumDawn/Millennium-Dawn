l_korean:
 MAPMODE_EU_MAP_MODE_NAME: "유럽 연합 (EU)"
 MAPMODE_EU_MAP_MODE: "유럽 연합 (EU)"
 MAPMODE_EU_MAP_MODE_DESCRIPTION: "Shows EU member states, potential members, and current office holders within the European Union."
 EU_map_mode_tooltip: "European Union"
 EU_map_mode_tooltip_delayed: "Shows the current membership and leadership of the European Union.\n\n§Y[FROM.CONTROLLER.GetNameWithFlag]§!: §Y[FROM.CONTROLLER.map_mode_EU_status]§!\n\n§YColor Legend:§!\n§nBlue§! = EU Member State\n§YGold§! = Potential Member State\n\n§YOffice Holders:§!\n§RRed§! = President of the European Commission, European Council, or European Parliament\n§WWhite§! = President of the European Federation\n§BIndigo§! = Secretary General of EuroArmy or EuroNavy, or Frontex Executive Director\n§4Light Blue§! = High Representative or Ambassador of the Union to the United Nations\n§GGreen§! = President of the European Central Bank or European Minister of Economy and Finance\n\nColors follow the §YMap Mode Colors§! choice in Automation Settings.\nUpdated weekly."
 MAPMODE_INFLUENCE_MAP_MODE_NAME: "영향력"
 MAPMODE_INFLUENCE_MAP_MODE: "영향력"
 MAPMODE_INFLUENCE_MAP_MODE_DESCRIPTION: "다른 국가에 대한 우리의 영향력 순위를 표시합니다. 영향력은 외교적 지렛대를 결정하며 시간이 지남에 따라 정치적 성향에 영향을 줍니다."
 influence_map_mode_tooltip: "영향"
 influence_map_mode_tooltip_delayed: "우리가 영향력을 보유한 국가, 영향력 행사국 중 우리의 순위, 자동 영향력 행사 대상으로 설정된 국가를 표시합니다.\n\n영향력은 해당 국가에 대한 외교적 지렛대를 결정합니다. 순위가 높을수록 그 나라의 정치적 성향과 외교 정책에 대한 영향력이 커집니다.\n\n§Y색상 범례:§!\n§Y노란색§! = 우리나라\n§4연한 파란색§! = 1위 영향력 행사국 (지배적)\n§l하늘색§! = 2위 또는 3위 영향력 행사국\n§2파란색§! = 4위~7위 영향력 행사국\n§P자홍색§! = 자동 영향력 행사 대상국 (매월)\n§R빨간색§! = 영향력 확산 재사용 대기 (최근 대상이 됨)\n§g짙은 회색§! = 영향력 없음\n\n색상은 자동화 설정의 §Y지도 모드 색상§! 선택을 따릅니다.\n매주 갱신됩니다."
 MAPMODE_GCC_MAP_MODE_NAME: "걸프협력회의 (GCC)"
 MAPMODE_GCC_MAP_MODE: "걸프협력회의 (GCC)"
 MAPMODE_GCC_MAP_MODE_DESCRIPTION: "Shows member states and potential members of the Gulf Cooperation Council."
 GCC_map_mode_tooltip: "Gulf Cooperation Council"
 GCC_map_mode_tooltip_delayed: "Shows the current membership of the Gulf Cooperation Council (GCC).\n\n§Y[FROM.CONTROLLER.GetNameWithFlag]§!: §Y[FROM.CONTROLLER.map_mode_GCC_status]§!\n\n§YColor Legend:§!\n§CTeal§! = GCC Member State\n§GYellow-Green§! = Potential Member State\n\nUpdated weekly."
 MAPMODE_SCO_MAP_MODE_NAME: "상하이협력기구 (SCO)"
 MAPMODE_SCO_MAP_MODE: "상하이협력기구 (SCO)"
 MAPMODE_SCO_MAP_MODE_DESCRIPTION: "Shows member states, observers, and potential members of the Shanghai Cooperation Organisation."
 SCO_map_mode_tooltip: "Shanghai Cooperation Organisation"
 SCO_map_mode_tooltip_delayed: "Shows the current membership of the Shanghai Cooperation Organisation (SCO).\n\n§Y[FROM.CONTROLLER.GetNameWithFlag]§!: §Y[FROM.CONTROLLER.map_mode_SCO_status]§!\n\n§YColor Legend:§!\n§OOrange§! = SCO Member State\n§0Purple§! = Observer State\n§4Light Blue§! = Dialogue Partner\n§YYellow§! = Potential Member State\n\nUpdated weekly."
 MAPMODE_GDP_C_MAP_MODE_NAME: "1인당 국민총생산(GDP/C)"
 MAPMODE_GDP_C_MAP_MODE: "1인당 국민총생산(GDP/C)"
 MAPMODE_GDP_C_MAP_MODE_DESCRIPTION: "This map mode displays the GDP per capita of a nation, representing the average economic output per person."
 gdp_c_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]의 1인당 국민총생산(GDP/C)"
 gdp_c_map_mode_tooltip_delayed: "GDP per capita of §Y[FROM.CONTROLLER.GetNameWithFlag]§! is: §Y$[?FROM.CONTROLLER:gdp_per_capita|Y]K§!.\n\nGDP per capita represents the economic output per person. Higher values indicate a wealthier, more productive economy.\n\n§YColor Legend:§!\n§nNavy§! = Below 8K (Low income)\n§lDark Teal§! = 8K - 18K (Lower-middle income)\n§5Teal§! = 18K - 32K (Middle income)\n§6Sea Green§! = 32K - 60K (Upper-middle income)\n§7Light Green§! = 60K - 110K (High income)\n§WPale Yellow§! = Above 110K (Extremely wealthy)\n\nBrighter is wealthier.\nUpdated with the weekly economic tick."
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_NAME: "Energy Unfulfillment"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE: "Energy Unfulfillment"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_DESCRIPTION: "이 지도 모드는 국가별 현재 충족되지 않은 에너지 요구의 비욜을 나타냅니다."
 energy_consumption_map_mode_tooltip: "Energy Consumption Unfulfillment in [FROM.CONTROLLER.GetNameWithFlag]"
 energy_consumption_map_mode_tooltip_delayed: "Energy Consumption Unfulfillment in §Y[FROM.CONTROLLER.GetNameWithFlag]§! is: §Y[?FROM.CONTROLLER:unfulfilled_energy_demand_var|%+]§!\n\nThis shows the percentage of energy demand that is not being met. A negative value means demand exceeds supply (energy deficit).\n\n§YColor Legend:§!\n§nNavy§! = Below -30% (Severe deficit)\n§lDark Teal§! = -30% to -18% (Moderate deficit)\n§5Teal§! = -18% to -12% (Mild deficit)\n§6Sea Green§! = -12% to -4% (Nearly met)\n§7Light Green§! = -4% to -1% (Almost met)\n§WPale Yellow§! = Above -1% (Fully met)\n\nDarker is worse. Invest in energy production to improve.\nUpdated with the weekly economic tick."
 MAPMODE_PRODUCTIVITY_MAP_MODE_NAME: "생산성"
 MAPMODE_PRODUCTIVITY_MAP_MODE: "생산성"
 MAPMODE_PRODUCTIVITY_MAP_MODE_DESCRIPTION: "이 지도 모드는 각 주의 현재 생산성을 표시하며, 이는 노동자 1인당 경제 생산 효율을 나타냅니다."
 productivity_map_mode_tooltip: "[FROM.GetName]의 생산성"
 productivity_map_mode_tooltip_delayed: "§Y[FROM.GetName]§!의 생산성: §Y[?FROM.productivity_state_var|Y]§!\n\n생산성은 주의 경제 생산 효율을 나타냅니다. 값이 높을수록 노동자 1인당 경제 생산량이 많음을 의미합니다.\n\n§Y색상 범례:§!\n§n남색§! = 200 미만 (매우 낮음)\n§2파란색§! = 200 - 500 (낮음)\n§l짙은 청록색§! = 500 - 800 (평균 이하)\n§3스틸 블루§! = 800 - 1200 (평균)\n§5청록색§! = 1200 - 1900 (평균 이상)\n§6바다 초록색§! = 1900 - 3800 (높음)\n§7연두색§! = 3800 - 5000 (매우 높음)\n§W연한 노란색§! = 5000 초과 (탁월함)\n\n밝을수록 생산성이 높습니다.\n주간 경제 틱마다 갱신됩니다."
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_NAME: "재생 에너지 유망지"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE: "재생 에너지 유망지"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_DESCRIPTION: "이 지도 모드는 바람, 태양광 및 기타 지리적 요인에 따른 각 주의 천연 재생 에너지 잠재력을 표시합니다."
 renewable_energy_hotspot_map_mode_tooltip: "[FROM.GetName]의 재생 에너지 설비 보너스"
 renewable_energy_hotspot_map_mode_tooltip_delayed: "§Y[FROM.GetName]§!의 재생 에너지 설비 보너스: §Y[?FROM.state_renewable_capacity_factor_modifier_var|Y]§!\n\n주의 재생 에너지 생산량에 적용되는 배율입니다. §Y1.0§!이 세계 평균이므로, 1.5인 주는 평균의 1.5배를, 0.5인 주는 절반을 생산합니다.\n\n§Y색상 범례 (1.0 = 세계 평균):§!\n§n남색§! = 0.6 미만 (매우 열악함)\n§3짙은 파란색§! = 0.6 - 0.8 (열악함)\n§l짙은 청록색§! = 0.8 - 1.0 (평균보다 약간 낮음)\n§5청록색§! = 1.0 - 1.2 (평균 이상)\n§6바다 초록색§! = 1.2 - 1.45 (평균을 크게 상회)\n§7연두색§! = 1.45 - 1.6 (뛰어남)\n§W연한 노란색§! = 1.6 초과 (예외적)\n\n밝을수록 좋습니다.\n이 값은 고정되어 있으며 시간이 지나도 변하지 않습니다."
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_NAME: "실업률"
 unemployment_rate_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]의 실업률"
 unemployment_rate_map_mode_tooltip_delayed: "§Y[FROM.CONTROLLER.GetNameWithFlag]§!의 실업률: §Y[?FROM.CONTROLLER:total_unemployed_percentage_display|%Y]§!\n\n생산가능인구 중 실업 상태인 인구의 비율을 나타냅니다.\n\n§Y색상 범례:§!\n§n남색§! = 35% 초과 (위기)\n§l짙은 청록색§! = 22% - 35% (매우 높음)\n§5청록색§! = 10% - 22% (높음)\n§6바다 초록색§! = 5% - 10% (보통)\n§7연두색§! = 2% - 5% (낮음)\n§W연한 노란색§! = 2% 미만 (완전 고용)\n\n색이 어두울수록 상황이 나쁩니다. 경제 성장과 정책을 통해 실업을 줄이십시오.\n주간 경제 틱마다 갱신됩니다."
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE: "실업률"
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_DESCRIPTION: "이 지도 모드는 국가별 현재 실업률을 생산가능인구 대비 비율로 표시합니다."
 MAPMODE_SUBIDEOLOGY_MAP_MODE_NAME: "집권당"
 MAPMODE_SUBIDEOLOGY_MAP_MODE: "집권당"
 MAPMODE_SUBIDEOLOGY_MAP_MODE_DESCRIPTION: "각국을 집권 중인 정당의 세부 이념을 표시하며, 마우스를 올리면 집권 정당들의 득표율이 나타납니다."
 subideology_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]의 집권당"
 subideology_map_mode_tooltip_delayed: "§H[FROM.CONTROLLER.GetNameWithFlag]§!\n\n§H집권당:§![FROM.CONTROLLER.map_mode_ruling_party]\n\n§H정부 연립:§![FROM.CONTROLLER.map_mode_coalition_none][FROM.CONTROLLER.L_coal_elect_percent_0][FROM.CONTROLLER.L_coal_elect_percent_1][FROM.CONTROLLER.L_coal_elect_percent_2][FROM.CONTROLLER.L_coal_elect_percent_3][FROM.CONTROLLER.L_coal_elect_percent_4][FROM.CONTROLLER.L_coal_elect_percent_5][FROM.CONTROLLER.L_coal_elect_percent_6][FROM.CONTROLLER.L_coal_elect_percent_7][FROM.CONTROLLER.L_coal_elect_percent_8][FROM.CONTROLLER.L_coal_elect_percent_9][FROM.CONTROLLER.L_coal_elect_percent_10][FROM.CONTROLLER.L_coal_elect_percent_11][FROM.CONTROLLER.L_coal_elect_percent_12][FROM.CONTROLLER.L_coal_elect_percent_13][FROM.CONTROLLER.L_coal_elect_percent_14][FROM.CONTROLLER.L_coal_elect_percent_15][FROM.CONTROLLER.L_coal_elect_percent_16][FROM.CONTROLLER.L_coal_elect_percent_17][FROM.CONTROLLER.L_coal_elect_percent_18][FROM.CONTROLLER.L_coal_elect_percent_19][FROM.CONTROLLER.L_coal_elect_percent_20][FROM.CONTROLLER.L_coal_elect_percent_21][FROM.CONTROLLER.L_coal_elect_percent_22][FROM.CONTROLLER.L_coal_elect_percent_23]\n\n§H정부 총 지지율:§! §Y[?FROM.CONTROLLER:government_coalition_strength_elect|%1]§!\n\n비율은 각 정당이 지난 선거에서 얻은 득표율이므로, 선거를 치른 적이 없는 국가는 0.0%로 표시됩니다.\n\n§Y색상 범례:§!\n모든 정당은 적록 색맹과 청황 색맹에서도 알아볼 수 있도록 확인된 고유한 색상을 가집니다. 국가 위에 마우스를 올리면 집권당을 볼 수 있습니다.\n\n정부가 교체될 때마다 갱신됩니다."
 map_mode_ruling_party_text: "\n[show_ruling_party] ([?party_pop_elect_array^ruling_party|%1])"
 map_mode_coalition_none_text: "\n없음 (단일 정당 정부)"
 map_mode_member_state: "회원국"
 map_mode_potential_member_state: "잠재 회원국"
 map_mode_not_a_member: "비회원국"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE_NAME: "기축통화"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE: "기축통화"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE_DESCRIPTION: "각국이 기축통화 정책에 따라 보유한 기축통화를 표시합니다."
 reserve_currency_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]의 기축통화"
 reserve_currency_map_mode_tooltip_delayed: "§Y[FROM.CONTROLLER.GetNameWithFlag]§!\n\n기축통화 정책: §Y[FROM.CONTROLLER.map_mode_reserve_currency]§!\n\n§Y색상 범례:§!\n§l파랑§! = 달러\n§n진한 파랑§! = 유로\n§R빨강§! = 위안\n§G진한 초록§! = 루블\n§W흰색§! = 엔\n§Y노랑§! = 파운드\n§p분홍§! = 프랑\n§O주황§! = 휠던\n§7연한 초록§! = 헤알\n§0보라§! = 비트코인\n§g짙은 회색§! = 자국 통화 준비\n\n색상은 자동화 설정의 §Y지도 모드 색상§! 선택을 따릅니다.\n주간 경제 틱마다 갱신됩니다."