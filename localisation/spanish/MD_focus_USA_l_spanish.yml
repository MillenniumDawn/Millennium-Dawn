 department_of_state.9.b: "Más agresión occidental contra una nación soberana"
 department_of_state.38001.t: "Rusia se estabiliza bajo las RUSFOR"
 department_of_state.38001.d: "Con el colapso soviético formalizado y la autoridad de las RUSFOR establecida, Rusia emerge del caos de la transición como un Estado unificado y alineado con Occidente. Las antiguas reclamaciones territoriales soviéticas se transfieren a la Federación de Rusia, y Moscú es admitida en la esfera de la OTAN. El camino por delante es largo, pero una Rusia democrática está ahora al alcance."
 department_of_state.38001.a: "Comienza un nuevo capítulo"
 USA_sale_of_additional_kee_lung_destroyers: "[TAI.GetFlag] Ampliar la venta de destructores Kee-Lung"
 USA_sale_of_additional_kee_lung_destroyers_desc: "Con [CHI.GetNameWithFlag] haciendo sonar los tambores de guerra al otro lado del estrecho, [TAI.GetNameWithFlag] necesita algo más que los cuatro cascos Kee-Lung originales si quiere disuadir una invasión. Ofreceremos un segundo lote de destructores modernizados y ayudaremos a expandir sus astilleros nacionales, convirtiendo a la Armada de la República de China en una auténtica amenaza regional por derecho propio."
 USA_chi_aggression_or_tension_tt: "[CHI.GetFlag] §H[CHI.GetName]§! se está comportando de forma agresiva: o bien ha generado §R20%+ de tensión mundial§!, está en guerra con [TAI.GetFlag] §H[TAI.GetName]§!, o lidera una facción en una guerra abierta"
 USA_demand_japanese_article_9_interpretation: "[JAP.GetFlag] Exigir la reinterpretación del Artículo 9"
 USA_demand_japanese_article_9_interpretation_desc: "[JAP.GetFlag] Japón se ha atado de manos con una constitución que prohíbe cualquier acción militar significativa en el extranjero. Presionaremos a Tokio para que reinterprete el Artículo 9 y adopte una postura de defensa que esté a la altura de la amenaza que plantea [CHI.GetFlag] China. Un Japón capaz es exactamente lo que el Pacífico necesita."
 USA_nato_ukraine_accept_TT: "Los aliados de la OTAN profundizarán la §Hcooperación militar§! con [UKR.GetFlag] §H[UKR.GetName]§! y aportarán §Harmas y vehículos§! al esfuerzo de guerra ucraniano"
 USA_maximum_pressure_dprk: "[NKO.GetFlag] Presión máxima"
 USA_maximum_pressure_dprk_desc: "El pequeño hombre del cohete ha estado colmando nuestra paciencia durante demasiado tiempo con sus provocaciones nucleares. Los presionaremos con todo lo que tenemos y luego les ofreceremos el acuerdo de sus vidas. Si son lo bastante listos como para aceptarlo, tendremos el mayor acuerdo de la historia. Si no, bueno, desearán haberlo hecho."
 USA_maximum_pressure_dprk_TT: "Enviaremos a [NKO.GetFlag] §H[NKO.GetName]§! un ultimátum de §Rpresión máxima§!, combinando §Rsanciones devastadoras§! con una oferta directa de cumbre\n\nImportancia estratégica de esta acción:\n - Asfixiar económicamente a [NKO.GetFlag] §H[NKO.GetName]§! puede obligarlos a sentarse a la mesa de negociación y limitar sus §Rambiciones nucleares§!.\n - Si [NKO.GetLeader] acepta el trato, lograremos la desnuclearización sin disparar un solo tiro."
 USA_withdraw_from_jcpoa: "[PER.GetFlag] Romper el acuerdo con Irán"
 USA_withdraw_from_jcpoa_desc: "El acuerdo nuclear con Irán fue el peor acuerdo jamás negociado. Los iraníes han seguido patrocinando el terrorismo y desarrollando misiles balísticos mientras se escondían tras este vergonzoso pacto. Nos salimos, y las sanciones más duras de la historia van de camino hacia ellos."
 USA_withdraw_jcpoa_TT: "We will withdraw from the [PER.GetFlag] §HIran nuclear deal§! and reimpose §Rmaximum sanctions§! on [PER.GetFlag] §HTehran§!\n\nStrategic Importance Of This Action:\n - Sanctions will cripple [PER.GetFlag] §HIran's§! oil revenue and §Rslow§! their weapons programs.\n - Our [ENG.GetFlag] [FRA.GetFlag] [GER.GetFlag] §HEuropean allies§! will object, but the deal handed [PER.GetFlag] §HIran§! too much and demanded too little in return."
 USA_recognition_of_jerusalem: "[ISR.GetFlag] La capital eterna"
 USA_recognition_of_jerusalem_desc: "Durante décadas, cada administración ha ido aplazando este asunto a pesar de que el Congreso aprobó la Ley de la Embajada de Jerusalén allá por 1995. Es hora de asumir la realidad y trasladar nuestra embajada a donde corresponde. Jerusalén es la capital eterna del pueblo judío, y el mundo necesita saberlo."
 USA_recognition_jerusalem_TT: "Reconoceremos oficialmente a §HJerusalén§! como la capital de [ISR.GetFlag] §H[ISR.GetName]§! y trasladaremos nuestra §Hembajada§!\n\nImportancia estratégica de esta acción:\n - [ISR.GetFlag] §HIsrael§! recibirá un importante §Himpulso diplomático§! y un mayor apoyo militar de los Estados Unidos.\n - Las naciones árabes e islámicas reaccionarán de forma §Rnegativa§!, pero la determinación estadounidense en este asunto es algo que debió hacerse hace mucho tiempo."
 USA_golan_heights_recognition: "[ISR.GetFlag] El Golán es israelí"
 USA_golan_heights_recognition_desc: "Los Altos del Golán han estado bajo control israelí durante más de medio siglo. Es una zona estratégicamente vital para la seguridad de Israel y, francamente, sería suicida devolvérsela a [SYR.GetName]. Es hora de dejar de fingir y reconocer formalmente la realidad."
 USA_golan_recognition_TT: "Reconoceremos formalmente a [ISR.GetFlag] §H[ISR.GetName]§! como la potencia §Hsoberana§! sobre los §HAltos del Golán§!\n\nImportancia estratégica de esta acción:\n - [ISR.GetFlag] §HIsrael§! obtendrá un §Hnúcleo permanente§! en los Altos del Golán, poniendo fin a cualquier ambigüedad sobre el estatus del territorio.\n - [SYR.GetFlag] §H[SYR.GetName]§! no estará satisfecha, pero los Altos son un colchón defensivo crítico que [ISR.GetFlag] §HIsrael§! no se puede permitir el lujo de abandonar."
 USA_aukus_pact: "[AST.GetFlag] [ENG.GetFlag] El Pacto AUKUS"
 USA_aukus_pact_desc: "El dragón chino está mostrando sus músculos por todo el Indo-Pacífico, y nuestros aliados se están poniendo nerviosos. Es hora de forjar una nueva alianza de seguridad con [AST.GetName] y [ENG.GetName] para compartir nuestra mejor tecnología de defensa, incluyendo la capacidad de submarinos de propulsión nuclear. Si Pekín quiere jugar a estos juegos, tendrá que lidiar con nosotros tres."
 USA_aukus_accept_TT: "[AST.GetFlag] §H[AST.GetName]§! y [ENG.GetFlag] §H[ENG.GetName]§! se unen al pacto de seguridad §HAUKUS§!, abriendo un §Hgrupo de investigación de submarinos§! compartido y ampliando la §Hpropulsión nuclear naval§! a Canberra"
 USA_indo_pacific_economic_framework: "El Escudo del Indo-Pacífico"
 USA_indo_pacific_economic_framework_desc: "Los tentáculos económicos de China se están extendiendo por todas las naciones del Indo-Pacífico. Si no ofrecemos una alternativa a nuestros amigos, no tendrán más remedio que alinearse con Pekín. El Marco Económico del Indo-Pacífico será nuestra respuesta: una asociación integral que sitúa los intereses estadounidenses en primer plano y ofrece a nuestros aliados una vía de escape de la dependencia china."
 USA_ipef_TT: "Lanzaremos el §HMarco Económico del Indo-Pacífico§!, llegando a §H10 socios regionales§! para reducir la influencia económica de [CHI.GetFlag] §H[CHI.GetName]§!\n - Las naciones asociadas que se unan nos concederán §H+10§! de opinión y verán §Rreducida§! la influencia [CHI.GetFlag] §Hchina§! en sus mercados\n - Obtendremos la idea de los §HBeneficios comerciales del IPEF§! durante §H2 años§!\n\nImportancia estratégica de esta acción:\n - El dominio económico de [CHI.GetFlag] §HPekín§! en el Indo-Pacífico es nuestro mayor desafío estratégico. Ofrecer una alternativa creíble es la única manera de mantener a estas naciones fuera de su órbita."
 USA_abraham_accords_expansion: "[ISR.GetFlag] [SAU.GetFlag] Ampliar los Acuerdos de Abraham"
 USA_abraham_accords_expansion_desc: "Los Acuerdos de Abraham demostraron lo que todo el mundo decía que era imposible: la paz entre Israel y el mundo árabe. Ahora debemos presionar más y sentar a más naciones a la mesa. Si logramos que los saudíes se sumen, todo Oriente Medio se inclinará a nuestro favor. Los iraníes no sabrán qué les golpeó."
 USA_abraham_accords_accept_TT: "Los Estados del Golfo participantes normalizarán sus relaciones con [ISR.GetFlag] §H[ISR.GetName]§!, rediseñando §HOriente Medio§! a nuestro favor"
 USA_chips_act_diplomacy: "La Ley CHIPS"
 USA_chips_act_diplomacy_desc: "Cada pieza de tecnología avanzada funciona con microchips, y ahora mismo la gran mayoría provienen de [TAI.GetName] y del este de Asia. Un solo conflicto en el estrecho de Taiwán y toda nuestra economía se detendría por completo. Vamos a invertir miles de millones para traer la producción de semiconductores a casa y conseguir que nuestros aliados construyan sus propias fábricas."
 USA_chips_act_TT: "Invertiremos para construir una §Hplanta de semiconductores§! en nuestro país e invitaremos a [TAI.GetFlag] §H[TAI.GetName]§!, [KOR.GetFlag] §H[KOR.GetName]§! y [JAP.GetFlag] §H[JAP.GetName]§! a construir las suyas propias\n - Obtendremos la idea de la §HLey CHIPS§! durante §H5 años§!\n - La influencia [CHI.GetFlag] §Hchina§! en [TAI.GetFlag] §H[TAI.GetName]§! §Rdisminuirá§! un §H5%§!\n\nImportancia estratégica de esta acción:\n - Excluir a [CHI.GetFlag] §HPekín§! de la cadena de suministro de semiconductores es el paso más importante que podemos dar para preservar nuestra ventaja tecnológica y militar a largo plazo."
 USA_return_to_paris_agreement: "Regreso a París"
 USA_return_to_paris_agreement_desc: "La ausencia de Estados Unidos en el Acuerdo Climático de París fue una vergüenza. El mundo necesita saber que estamos de vuelta y listos para liderar en materia climática, incluso si eso significa tragarse un poco de orgullo. Nuestros amigos europeos estarán encantados, y esa buena voluntad vale algo."
 USA_paris_agreement_TT: "Nos reintegraremos al §HAcuerdo Climático de París§!, restaurando §H+10 de opinión§! con todas las naciones miembros de la §HUE§! y obteniendo §H+2% de estabilidad§!\n\nImportancia estratégica de esta acción:\n - Reincorporarse señala a nuestros §Haliados europeos§! [ENG.GetFlag] [FRA.GetFlag] [GER.GetFlag] que Estados Unidos está de vuelta en el escenario mundial.\n - La buena voluntad generada vale mucho más que el coste simbólico de volver a firmar."
 USA_support_taiwan_defense: "[TAI.GetFlag] Armar la isla"
 USA_support_taiwan_defense_desc: "El ejército chino se está volviendo más audaz cada día, enviando cazas a través del estrecho y poniendo a prueba nuestra determinación. [TAI.GetName] necesita las herramientas para defenderse, y debemos asegurarnos firmemente de que Pekín entienda que cualquier agresión tendrá un coste inaceptable. Un paquete masivo de armas enviará ese mensaje alto y claro."
 USA_taiwan_defense_TT: "Enviaremos a [TAI.GetFlag] §H[TAI.GetName]§! un importante paquete de armas: §H3000 armas de infantería§! y §H400 vehículos utilitarios§!\n - [CHI.GetFlag] §H[CHI.GetName]§! será notificada y podría responder\n - Si [TAI.GetFlag] §H[TAI.GetName]§! acepta, nuestras relaciones mejorarán en §G+15§!\n\nImportancia estratégica de esta acción:\n - Cada caja de armas que enviamos a [TAI.GetFlag] §HTaiwán§! aumenta el coste que [CHI.GetFlag] §HPekín§! debe pagar por cualquier aventura militar a través del estrecho."
 USA_freedom_of_navigation_scs: "[CHI.GetFlag] Navegando por su patio trasero"
 USA_freedom_of_navigation_scs_desc: "Los chinos han estado construyendo islas y apostando misiles en ellas como si todo el mar de la China Meridional les perteneciera. La última vez que lo comprobamos, las aguas internacionales pertenecen a todos. Nuestra Armada navegará por donde el derecho internacional lo permita, y si a [CHI.GetName] no le gusta, que lo discuta con la Séptima Flota."
 USA_fon_scs_TT: "Realizaremos operaciones de §Hlibertad de navegación§! en el mar de la China Meridional, enviando un mensaje directo a [CHI.GetFlag] §H[CHI.GetName]§!\n - [PHI.GetFlag] §H[PHI.GetName]§!, [VIE.GetFlag] §H[VIE.GetName]§! y [MAY.GetFlag] §H[MAY.GetName]§! ganarán cada uno §G+5§! de opinión hacia nosotros\n - Nuestro §Hapoyo bélico§! aumentará un §G3%§!\n\nImportancia estratégica de esta acción:\n - No se puede permitir que [CHI.GetFlag] §HPekín§! reclame aguas internacionales como propias. Navegar a través de ellas es cómo lo dejamos claro sin disparar un solo tiro."
 USA_thaad_deployment_korea: "[KOR.GetFlag] [NKO.GetFlag] Desplegar el escudo"
 USA_thaad_deployment_korea_desc: "El programa de misiles de [NKO.GetName] se vuelve más peligroso mes a mes, y nuestros aliados en [KOR.GetName] están justo en el punto de mira. El THAAD les dará una oportunidad de defenderse contra un ataque de misiles balísticos, aunque los chinos van a montar en cólera por el hecho de que el radar llegue hasta su territorio. No es nuestro problema."
 USA_thaad_accept_TT: "[KOR.GetFlag] §H[KOR.GetName]§! recibirá el sistema de defensa de misiles §HTHAAD§!, proporcionándoles un escudo real contra los misiles de [NKO.GetFlag] §H[NKO.GetName]§!"
 USA_quad_security_dialogue: "[JAP.GetFlag] [RAJ.GetFlag] [AST.GetFlag] La Alianza Quad"
 USA_quad_security_dialogue_desc: "Los chinos creen que pueden abrirse paso a la fuerza hacia el dominio del Indo-Pacífico, pero no han tenido en cuenta el peso combinado de los Estados Unidos, [JAP.GetName], [RAJ.GetName] y [AST.GetName]. Formalizar el Quad creará un muro de poder democrático que ni siquiera Pekín podrá ignorar."
 USA_quad_accept_TT: "[JAP.GetFlag] §H[JAP.GetName]§!, [RAJ.GetFlag] §H[RAJ.GetName]§! y [AST.GetFlag] §H[AST.GetName]§! han acordado formalizar la asociación de seguridad §HQuad§!"
 USA_philippine_defense_cooperation: "[PHI.GetFlag] Fortalecer la alianza filipina"
 USA_philippine_defense_cooperation_desc: "Filipinas está justo en la línea de frente del estancamiento del mar de la China Meridional, y su ejército necesita una seria modernización. Al ampliar el Acuerdo Mejorado de Cooperación en Defensa, obtenemos un acceso crítico a bases y [PHI.GetFlag] Manila obtiene la potencia de fuego y el entrenamiento para resistir la coacción [CHI.GetFlag] china. Cada base estadounidense en Filipinas es un clavo en el ataúd del dominio marítimo [CHI.GetFlag] chino."
 USA_phi_edca_accept_TT: "[PHI.GetFlag] §H[PHI.GetName]§! ampliará la §Hcooperación en defensa§!, otorgándonos acceso a bases y recibiendo §Hequipo militar§! a cambio"
 USA_phi_edca_reject_TT: "[PHI.GetFlag] §H[PHI.GetName]§! ha rechazado ampliar la §Hcooperación en defensa§!"
 USA_support_korean_reunification_talks: "[KOR.GetFlag] [NKO.GetFlag] Tender puentes en la península"
 USA_support_korean_reunification_talks_desc: "La península de Corea ha sido un polvorín activo desde 1953, y un solo error de cálculo podría arrastrar a [USA.GetFlag] Estados Unidos a una guerra para la que nadie está preparado. Si logramos mediar un diálogo, aunque sea limitado, entre [KOR.GetFlag] Seúl y [NKO.GetFlag] Pionyang, habrá menos misiles apuntando a nuestros aliados y más espacio para que funcione la diplomacia. Es difícil, pero nosotros tenemos la sartén por el mango."
 USA_korea_talks_accept_TT: "[KOR.GetFlag] §H[KOR.GetName]§! y [NKO.GetFlag] §H[NKO.GetName]§! participarán en un §Hdiálogo facilitado por EE. UU.§!, aliviando las tensiones en la península"
 USA_intervene_yemen_civil_war: "[YEM.GetFlag] Aplastar a los hutíes"
 USA_intervene_yemen_civil_war_desc: "La insurgencia hutí en [YEM.GetName], respaldada por Irán, está desgarrando el país y amenazando rutas marítimas vitales de las que depende nuestra economía. No podemos quedarnos de brazos cruzados mientras los representantes de Teherán campan a sus anchas en el patio trasero de nuestros aliados. Es hora de armar al gobierno legítimo y demostrar a los hutíes que eligieron la pelea equivocada."
 USA_yemen_intervention_TT: "Enviaremos a [YEM.GetFlag] §H[YEM.GetName]§! §H3000 armas de infantería§! y §H400 vehículos utilitarios§! para combatir la insurgencia §Rhutí§!\n - Nuestra §Hinfluencia§! en [YEM.GetFlag] §H[YEM.GetName]§! aumentará un §G5%§!\n - [SAU.GetFlag] §HArabia Saudí§! también recibirá apoyo militar si se enfrenta a las fuerzas [HOU.GetFlag] §Hhutíes§!\n\nImportancia estratégica de esta acción:\n - No se puede permitir que los representantes [PER.GetFlag] §Hiraníes§! controlen la costa de [YEM.GetFlag] §HYemen§! y asfixien las rutas marítimas de las que depende nuestra economía."
 USA_intervene_mali_insurgency: "[MAL.GetFlag] Sofocar el fuego del Sahel"
 USA_intervene_mali_insurgency_desc: "Los combatientes yihadistas en [MAL.GetName] se están extendiendo como la pólvora por todo el Sahel y, si no intervenimos ahora, toda la región arderá en llamas. Los franceses han cargado con este peso durante demasiado tiempo. Es hora de que Estados Unidos se involucre antes de que los rusos y los chinos entren a llenar el vacío."
 USA_mali_intervention_TT: "Enviaremos a [MAL.GetFlag] §H[MAL.GetName]§! §H2000 armas de infantería§! y §H200 vehículos utilitarios§! para combatir la §Rinsurgencia yihadista§!\n - Nuestra §Hinfluencia§! en [MAL.GetFlag] §H[MAL.GetName]§! aumentará un §G5%§!\n\nImportancia estratégica de esta acción:\n - Si el Sahel cae en manos de los yihadistas, los mercenarios [SOV.GetFlag] §Hrusos§! y los contratistas [CHI.GetFlag] §Hchinos§! llenarán el vacío. Las armas estadounidenses nos mantienen relevantes antes de que esa ventana se cierre."
 USA_intervene_nigeria_boko_haram: "[NIG.GetFlag] A la caza de Boko Haram"
 USA_intervene_nigeria_boko_haram_desc: "Boko Haram ha convertido el noreste de [NIG.GetName] en una zona de guerra, masacrando civiles y desestabilizando a la nación más poblada de África. No podemos permitir que la mayor economía del continente se hunda en el caos. La asistencia militar y la inteligencia de los Estados Unidos ayudarán a los nigerianos a aplastar a estos terroristas de una vez por todas."
 USA_nigeria_intervention_TT: "Enviaremos a [NIG.GetFlag] §H[NIG.GetName]§! §H2000 armas de infantería§!, §H200 vehículos utilitarios§! y §Hapoyo de inteligencia§! para aplastar a §HBoko Haram§!\n - Nuestra §Hinfluencia§! en [NIG.GetFlag] §H[NIG.GetName]§! aumentará un §G5%§!\n\nImportancia estratégica de esta acción:\n - [NIG.GetFlag] §HNigeria§! es la mayor economía de África. Permitir que colapse en el caos supondría entregar a [CHI.GetFlag] §HChina§! y a [SOV.GetFlag] §HRusia§! una enorme oportunidad estratégica en el continente."
 USA_stabilize_haiti: "[HAI.GetFlag] Salvar a Haití de sí mismo"
 USA_stabilize_haiti_desc: "[HAI.GetName] se está hundiendo en un colapso total justo en nuestro propio patio trasero. Las bandas controlan las calles, el gobierno apenas funciona y miles de personas huyen en embarcaciones. Ya hemos hecho esto antes y lo volveremos a hacer. Las botas estadounidenses sobre el terreno son lo único que va a reconstruir este país."
 USA_haiti_stabilization_TT: "Desplegaremos fuerzas en [HAI.GetFlag] §H[HAI.GetName]§!, enviando §H1500 armas de infantería§! y §H150 vehículos utilitarios§! para restaurar el orden\n - Nuestra §Hinfluencia§! en [HAI.GetFlag] §H[HAI.GetName]§! aumentará un §G10%§!\n\nImportancia estratégica de esta acción:\n - [HAI.GetFlag] §HHaití§! se está desmoronando a noventa millas de nuestras costas. La inestabilidad allí significa flujos de refugiados, redes de bandas y oportunismo [CHI.GetFlag] §Hchino§! justo en nuestro propio patio trasero."
 USA_counter_narcotics_central_america: "Guerra contra los cárteles"
 USA_counter_narcotics_central_america_desc: "Los cárteles han convertido a Centroamérica en su autopista personal para introducir drogas en las ciudades estadounidenses. Cada muerte por sobredosis en nuestras calles puede rastrearse hasta estas redes criminales. Las operaciones conjuntas de lucha contra el narcotráfico con nuestros socios centroamericanos ahogarán el suministro desde su origen."
 USA_counter_narcotics_TT: "Lanzaremos operaciones de §Hlucha contra el narcotráfico§! en toda Centroamérica, aumentando nuestra §Hinfluencia§! en §H6 naciones§! un §G3%§! en cada una\n\nImportancia estratégica de esta acción:\n - Cada kilo de droga incautado en el origen es una muerte menos en las ciudades estadounidenses. Esta operación golpea a los cárteles donde son más débiles: su cadena de suministro."
 USA_caribbean_investment_initiative: "[CHI.GetFlag] Dólares en el Caribe"
 USA_caribbean_investment_initiative_desc: "Los chinos se han ido colando en nuestro propio vecindario con el dinero de la Iniciativa de la Franja y la Ruta, construyendo puertos y puentes mientras compran influencia isla por isla. El Caribe siempre ha estado en nuestra esfera de influencia, y no vamos a permitir que Pekín entre como Pedro por su casa a cambiar eso. Los dólares estadounidenses tienen que empezar a fluir hacia el sur."
 USA_caribbean_investment_TT: "Invertiremos en §H6 naciones del Caribe§!, construyendo §Hinfraestructuras§! en cada capital y reduciendo la influencia [CHI.GetFlag] §Hchina§! un §R3%§! por nación\n - Nuestra §Hinfluencia§! en cada nación aumentará un §G5%§!\n\nImportancia estratégica de esta acción:\n - [CHI.GetFlag] §HPekín§! ha estado comprando el Caribe con el dinero de la Franja y la Ruta. La inversión estadounidense aquí envía un mensaje claro: este es nuestro vecindario."
 USA_invest_in_canada: "[CAN.GetFlag] Integración norteamericana"
 USA_invest_in_canada_desc: "[CAN.GetName] es nuestro aliado más cercano y nuestro mayor socio comercial, y ahora mismo ambos dependemos demasiado de cadenas de suministro adversarias. Al profundizar nuestros lazos económicos, especialmente en semiconductores y minerales críticos, construiremos una fortaleza económica norteamericana que nadie podrá quebrantar."
 USA_canada_invest_accept_TT: "[CAN.GetFlag] §H[CAN.GetName]§! aceptará el paquete de inversión, construyendo una §Hplanta de microchips§! y profundizando nuestros §Hlazos económicos§!"
 USA_canada_invest_reject_TT: "[CAN.GetFlag] §H[CAN.GetName]§! ha rechazado nuestro paquete de inversión"
 USA_west_africa_development_initiative: "[CHI.GetFlag] Ganar en África Occidental"
 USA_west_africa_development_initiative_desc: "África Occidental se ha convertido en un tira y afloja a tres bandas entre nosotros, los chinos y los rusos. Pekín ofrece préstamos con trampas de deuda, Moscú ofrece mercenarios y la población sufre de todos modos. Necesitamos ofrecer algo mejor: inversión real, infraestructuras reales y asociaciones reales que no vengan con condiciones impuestas por un autócrata."
 USA_west_africa_development_TT: "Invertiremos en §H5 naciones de África Occidental§!, construyendo §Hinfraestructuras§! en cada capital y haciendo retroceder a los rivales extranjeros\n - Nuestra §Hinfluencia§! en cada nación aumentará un §G5%§!\n - La influencia [CHI.GetFlag] §Hchina§! disminuirá un §R5%§! y la influencia [SOV.GetFlag] §Hrusa§! un §R3%§! en cada nación\n\nImportancia estratégica de esta acción:\n - África Occidental es el próximo frente en la competición entre las grandes potencias. [CHI.GetFlag] §HPekín§! trae trampas de deuda y [SOV.GetFlag] §HMoscú§! trae mercenarios. Nosotros debemos ofrecer algo mejor."
 USA_pacific_islands_compact: "[CHI.GetFlag] Mantener el Pacífico"
 USA_pacific_islands_compact_desc: "Las Islas del Pacífico han sido nuestras socias durante décadas a través del Tratado de Libre Asociación, pero China ha estado apareciendo con chequeras abultadas y grandes promesas. Si no renovamos nuestros compromisos, nos despertaremos una mañana y descubriremos bases militares chinas dispersas por todo el Pacífico. Eso no va a suceder bajo nuestra supervisión."
 USA_pacific_islands_TT: "Renovaremos nuestro §HTratado de Libre Asociación§! con §H5 naciones insulares del Pacífico§!, bloqueando la influencia [CHI.GetFlag] §Hchina§! en Oceanía\n - Nuestra §Hinfluencia§! en cada nación aumentará un §G5%§!\n - La influencia [CHI.GetFlag] §Hchina§! disminuirá un §R3%§! en cada nación\n\nImportancia estratégica de esta acción:\n - El Pacífico es nuestro lago estratégico. Si [CHI.GetFlag] §HPekín§! construye bases allí, nuestra capacidad para proyectar poder en todo el Indo-Pacífico estará acabada."
 USA_african_growth_opportunity_act: "[CHI.GetFlag] Abrir los mercados de África"
 USA_african_growth_opportunity_act_desc: "La Ley de Crecimiento y Oportunidad en África otorga a las naciones africanas un acceso preferente al mercado más rico de la Tierra: el nuestro. Al ampliar este programa, creamos puestos de trabajo a ambos lados del Atlántico y construimos relaciones comerciales que sobrevivirán a cualquier préstamo chino con letra pequeña. La diplomacia inteligente empieza con una economía inteligente."
 USA_agoa_TT: "Ampliaremos las preferencias comerciales de la §HAGOA§! a las naciones africanas elegibles, aumentando nuestra §Hinfluencia§! un §G3%§! y reduciendo la influencia [CHI.GetFlag] §Hchina§! un §R3%§! en cada nación que cumpla los requisitos\n\nImportancia estratégica de esta acción:\n - Un acuerdo comercial que impulse las economías africanas es mucho más duradero que cualquier préstamo [CHI.GetFlag] §Hchino§! con letra pequeña. Las naciones con acceso a los mercados estadounidenses no tienen motivos para buscar alternativas."
 USA_IPEF_trade_benefits: "Marco Económico del Indo-Pacífico"
 USA_IPEF_trade_benefits_desc: "El Marco Económico del Indo-Pacífico fortalece los lazos comerciales y la cooperación en la cadena de suministro con socios regionales clave, proporcionando beneficios económicos y reduciendo la dependencia del comercio chino."
 USA_chips_act: "Ley CHIPS y Ciencia"
 USA_chips_act_desc: "La Ley CHIPS y Ciencia ha invertido miles de millones en la fabricación nacional de semiconductores, impulsando la eficiencia de la producción y acelerando la construcción de instalaciones de fabricación avanzadas."
 USA_thaad_defense: "Defensa de misiles THAAD"
 USA_thaad_defense_desc: "El sistema de Defensa de Área de Alta Altitud Terminal (THAAD) proporciona capacidades avanzadas de defensa contra misiles balísticos, mejorando significativamente la defensa antiaérea y la preparación militar general."
 USA_caribbean_development: "Ayuda al desarrollo del Caribe"
 USA_caribbean_development_desc: "Un programa sostenido de inversiones estadounidenses en el Caribe, que construye infraestructuras y fortalece los lazos con los socios regionales para mantener la influencia [CHI.GetFlag] china fuera de nuestro propio patio trasero."
 USA_west_africa_development: "Ayuda al desarrollo de África Occidental"
 USA_west_africa_development_desc: "Un programa sostenido de inversiones estadounidenses en toda África Occidental, que financia infraestructuras y construye asociaciones comerciales como una alternativa creíble a las trampas de deuda [CHI.GetFlag] chinas y a los mercenarios [SOV.GetFlag] rusos."
 department_of_state.100.t: "La propuesta del AUKUS"
 department_of_state.100.d: "Estados Unidos se ha puesto en contacto con nosotros con una propuesta innovadora para una asociación trilateral de seguridad llamada AUKUS. Este acuerdo implicaría compartir tecnologías avanzadas de defensa, incluidas las capacidades de submarinos de propulsión nuclear, para hacer frente a las crecientes amenazas en la región del Indo-Pacífico."
 department_of_state.100.a: "Aceptamos esta asociación histórica."
 department_of_state.100.b: "Debemos rechazar respetuosamente en este momento."
 department_of_state.101.t: "Se forma la Alianza AUKUS"
 department_of_state.101.d: "Estados Unidos, Australia y el Reino Unido han anunciado una nueva asociación trilateral de seguridad conocida como AUKUS. El acuerdo contemplará el intercambio de tecnologías avanzadas de defensa y capacidades de submarinos de propulsión nuclear para mantener la seguridad en el Indo-Pacífico."
 department_of_state.101.a: "Una nueva era de cooperación."
 department_of_state.102.t: "Marco Económico del Indo-Pacífico"
 department_of_state.102.d: "Estados Unidos nos ha invitado a unirme al Marco Económico del Indo-Pacífico, una nueva iniciativa multilateral diseñada para fortalecer las cadenas de suministro, promover la energía limpia y contrarrestar la influencia económica china en la región."
 department_of_state.102.a: "Nos uniremos al marco estructural."
 department_of_state.102.b: "Preferimos mantener nuestros acuerdos actuales."
 department_of_state.103.t: "Resultados de la asociación del IPEF"
 department_of_state.103.d: "Las naciones de todo el Indo-Pacífico han respondido a nuestra invitación para unirse al Marco Económico del Indo-Pacífico."
 department_of_state.103.a: "Anotado."
 department_of_state.104.t: "Ampliación de los Acuerdos de Abraham"
 department_of_state.104.d: "Estados Unidos está trabajando para ampliar los Acuerdos de Abraham y ha propuesto que nuestra nación normalice las relaciones con Israel. Esto representaría un giro histórico en la dinámica regional y abriría nuevas oportunidades económicas y diplomáticas."
 department_of_state.104.a: "Normalizaremos las relaciones con Israel."
 department_of_state.104.b: "No es el momento adecuado para la normalización."
 department_of_state.105.t: "Progreso de los Acuerdos de Abraham"
 department_of_state.105.d: "Estados Unidos ha mediado con éxito acuerdos de normalización adicionales como parte del marco ampliado de los Acuerdos de Abraham."
 department_of_state.105.a: "Maravillosas noticias."
 department_of_state.106.t: "Acuerdos de Abraham ampliados"
 department_of_state.106.d: "El histórico marco de los Acuerdos de Abraham se ha ampliado para incluir a más naciones árabes que normalizan sus relaciones con Israel, rediseñando el panorama geopolítico de Oriente Medio."
 department_of_state.106.a: "Un nuevo capítulo en la diplomacia regional."
 department_of_state.107.t: "Asociación de la Ley CHIPS"
 department_of_state.107.d: "Estados Unidos nos ha invitado a participar en su iniciativa de la Ley CHIPS y Ciencia, ofreciendo incentivos para construir instalaciones de fabricación de semiconductores en nuestro suelo como parte de un esfuerzo más amplio para diversificar las cadenas mundiales de suministro de microchips."
 department_of_state.107.a: "Agradecemos esta inversión."
 department_of_state.107.b: "Debemos rechazar esta oferta."
 department_of_state.108.t: "Inversiones de la Ley CHIPS"
 department_of_state.108.d: "Estados Unidos ha lanzado una iniciativa masiva de inversión en semiconductores al amparo de la Ley CHIPS y Ciencia, construyendo nuevas instalaciones nacionales de fabricación de microchips y coordinándose con naciones aliadas para diversificar la cadena de suministro mundial de semiconductores."
 department_of_state.108.a: "La carrera de los semiconductores ha comenzado."
 department_of_state.109.t: "Estados Unidos se reintegra al Acuerdo de París"
 department_of_state.109.d: "Estados Unidos se ha reintegrado oficialmente al Acuerdo Climático de París, lo que señala un compromiso renovado con la cooperación climática internacional y la diplomacia multilateral."
 department_of_state.109.a: "Bienvenidos de nuevo a la mesa."
 department_of_state.110.t: "Paquete de armas estadounidense"
 department_of_state.110.d: "Estados Unidos nos ha ofrecido un importante paquete de armas para reforzar nuestras capacidades defensivas contra una posible agresión. El acuerdo incluye sistemas de armas avanzados y equipamiento militar."
 department_of_state.110.a: "Aceptamos agradecidos."
 department_of_state.111.t: "Venta de armas de EE. UU. a Taiwán"
 department_of_state.111.d: "Estados Unidos ha anunciado una importante venta de armas a Taiwán, una flagrante violación de nuestra soberanía y una interferencia en nuestros asuntos internos. Esta provocación exige una respuesta contundente."
 department_of_state.111.a: "Emitir una protesta diplomática formal."
 department_of_state.111.b: "Este es un acto de agresión que requiere una escalada."
 department_of_state.112.t: "EE. UU. arma a Taiwán"
 department_of_state.112.d: "Estados Unidos ha aprobado un importante paquete de armas para Taiwán, proporcionando equipamiento militar avanzado para reforzar las defensas de la isla en medio de las crecientes tensiones en el estrecho de Taiwán."
 department_of_state.112.a: "El equilibrio de poder cambia."
 department_of_state.115.t: "Propuesta de cumbre estadounidense"
 department_of_state.115.d: "El presidente estadounidense ha propuesto una cumbre directa sin precedentes con nuestro Líder Supremo. Aunque la campaña de presión máxima ha hecho mella en nuestra economía, esto podría ser una oportunidad para ganar legitimidad internacional y, potencialmente, conseguir un alivio de las sanciones."
 department_of_state.115.a: "Aceptaremos asistir a la cumbre."
 department_of_state.115.b: "No legitimaremos la agresión estadounidense."
 department_of_state.116.t: "Cumbre histórica entre EE. UU. y la RPDC"
 department_of_state.116.d: "En un hecho histórico sin precedentes, los líderes de los Estados Unidos y de Corea del Norte se han reunido cara a cara para mantener conversaciones diplomáticas, marcando un hito en el estancamiento de décadas en la península de Corea."
 department_of_state.116.a: "Un acontecimiento extraordinario."
 department_of_state.117.t: "Retirada del JCPOA"
 department_of_state.117.d: "Estados Unidos se ha retirado unilateralmente del Plan de Acción Integral Conjunto y volverá a imponer las máximas sanciones económicas contra nuestra nación. Esto representa una traición a los acuerdos internacionales."
 department_of_state.117.a: "Esta agresión no quedará sin respuesta."
 department_of_state.118.t: "Retirada estadounidense del JCPOA"
 department_of_state.118.d: "Estados Unidos se ha retirado del acuerdo nuclear con Irán, una decisión que socava años de cuidadosa diplomacia multilateral. Nuestros canales diplomáticos deben ahora recalibrarse."
 department_of_state.118.a: "Una decisión lamentable."
 department_of_state.119.t: "EE. UU. se retira del acuerdo con Irán"
 department_of_state.119.d: "Estados Unidos ha anunciado su retirada del Plan de Acción Integral Conjunto, volviendo a imponer las máximas sanciones económicas a Irán y tensando las relaciones con los aliados europeos que siguen comprometidos con el acuerdo."
 department_of_state.119.a: "La diplomacia recibe un duro golpe."
 department_of_state.120.t: "Jerusalén reconocida como capital"
 department_of_state.120.d: "Estados Unidos ha reconocido oficialmente a Jerusalén como la capital de Israel y ha anunciado planes para trasladar su embajada. Esta decisión histórica es una tremenda afirmación del vínculo entre nuestras naciones."
 department_of_state.120.a: "Un día trascendental para Israel."
 department_of_state.121.t: "EE. UU. reconoce a Jerusalén"
 department_of_state.121.d: "Estados Unidos ha reconocido oficialmente a Jerusalén como la capital de Israel, rompiendo con décadas de convención diplomática y provocando una enérgica condena en todo el mundo árabe e islámico."
 department_of_state.121.a: "Una decisión controvertida."
 department_of_state.124.t: "EE. UU. reconoce los Altos del Golán"
 department_of_state.124.d: "Estados Unidos ha reconocido oficialmente la soberanía israelí sobre los Altos del Golán, un territorio capturado a Siria en la guerra de 1967. La decisión marca otro giro en la política estadounidense para Oriente Medio."
 department_of_state.124.a: "Anotado."
 department_of_state.125.t: "Provocación naval estadounidense"
 department_of_state.125.d: "La Armada de los Estados Unidos ha llevado a cabo una supuesta operación de \"libertad de navegación\" a través de aguas que reclamamos como territorio soberano chino en el mar de la China Meridional. Esta flagrante provocación desafía nuestras legítimas reclamaciones marítimas y exige una respuesta."
 department_of_state.125.a: "Emitir una protesta diplomática."
 department_of_state.125.b: "Enviar fuerzas navales para interceptar."
 department_of_state.126.t: "Libertad de navegación en el mar de la China Meridional"
 department_of_state.126.d: "La Armada de los Estados Unidos ha llevado a cabo operaciones de libertad de navegación en el mar de la China Meridional, desafiando las reclamaciones territoriales chinas y asegurando a los aliados regionales el compromiso estadounidense con las vías navegables abiertas."
 department_of_state.126.a: "Las aguas internacionales deben seguir siendo libres."
 department_of_state.127.t: "Propuesta de despliegue del THAAD"
 department_of_state.127.d: "Estados Unidos ha propuesto desplegar el sistema de defensa de misiles THAAD en nuestro suelo para contrarrestar la creciente amenaza de misiles balísticos de Corea del Norte. Aunque esto mejoraría significativamente nuestras capacidades de defensa, China ha advertido de graves consecuencias si aceptamos."
 department_of_state.127.a: "Nuestra seguridad exige que aceptemos."
 department_of_state.127.b: "Los costes diplomáticos son demasiado altos."
 department_of_state.129.t: "THAAD desplegado en Corea del Sur"
 department_of_state.129.d: "Estados Unidos ha desplegado con éxito el sistema de defensa de misiles THAAD en Corea del Sur, mejorando significativamente las capacidades de defensa de misiles aliadas en la península de Corea, al tiempo que ha despertado duras críticas por parte de China."
 department_of_state.129.a: "El escudo está colocado."
 department_of_state.130.t: "EE. UU. interviene en Yemen"
 department_of_state.130.d: "Estados Unidos ha anunciado apoyo militar para el gobierno yemení reconocido internacionalmente en su lucha contra la insurgencia hutí, proporcionando equipamiento y asistencia logística para contrarrestar a las fuerzas respaldadas por Irán."
 department_of_state.130.a: "Se debe restaurar la estabilidad."
 department_of_state.131.t: "Apoyo militar estadounidense"
 department_of_state.131.d: "Estados Unidos ha destinado importantes recursos militares para apoyar nuestra lucha contra la insurgencia hutí. Las armas, los vehículos y el apoyo de inteligencia estadounidenses reforzarán nuestra posición en el campo de batalla."
 department_of_state.131.a: "Agradecemos el apoyo estadounidense."
 department_of_state.132.t: "EE. UU. apoya a Malí contra la insurgencia"
 department_of_state.132.d: "Estados Unidos ha anunciado un paquete de asistencia militar para Malí con el fin de ayudar a combatir la insurgencia yihadista que amenaza la región del Sahel."
 department_of_state.132.a: "La estabilidad en el Sahel es fundamental."
 department_of_state.133.t: "Asistencia militar estadounidense"
 department_of_state.133.d: "Estados Unidos ha comprometido equipamiento militar y apoyo de inteligencia para ayudar a nuestras fuerzas a combatir la insurgencia yihadista. Esta asistencia reforzará significativamente nuestras capacidades."
 department_of_state.133.a: "El apoyo estadounidense es muy bienvenido."
 department_of_state.134.t: "EE. UU. apoya a Nigeria contra Boko Haram"
 department_of_state.134.d: "Estados Unidos ha anunciado un paquete integral de asistencia militar para Nigeria con el fin de combatir a la organización terrorista Boko Haram en el noreste del país."
 department_of_state.134.a: "La lucha contra el terrorismo continúa."
 department_of_state.135.t: "Asistencia antiterrorista estadounidense"
 department_of_state.135.d: "Estados Unidos ha proporcionado un importante equipamiento militar y apoyo de inteligencia para reforzar nuestra campaña contra Boko Haram. Esta alianza ayudará a restaurar la seguridad en el noreste."
 department_of_state.135.a: "Juntos derrotaremos esta amenaza."
 department_of_state.136.t: "EE. UU. despliega fuerzas en Haití"
 department_of_state.136.d: "Estados Unidos ha autorizado el despliegue de fuerzas militares y asistencia humanitaria en Haití, donde la inestabilidad política y la violencia han llevado a la nación al borde del colapso."
 department_of_state.136.a: "Se debe restaurar el orden."
 department_of_state.137.t: "Fuerzas de estabilización estadounidenses"
 department_of_state.137.d: "Estados Unidos ha desplegado fuerzas militares y ha proporcionado asistencia humanitaria para ayudar a restaurar el orden. El equipamiento y el apoyo estadounidenses ayudarán a nuestras fuerzas de seguridad a recuperar el control de la situación."
 department_of_state.137.a: "Agradecemos la asistencia."
 department_of_state.138.t: "Programa antinarcóticos estadounidense"
 department_of_state.138.d: "Estados Unidos ha lanzado un programa coordinado de lucha contra el narcotráfico en nuestra región, proporcionando entrenamiento, equipamiento y apoyo de inteligencia para desarticular las redes de tráfico de drogas que operan en Centroamérica."
 department_of_state.138.a: "Una asociación bienvenida."
 department_of_state.140.t: "Programa de inversión estadounidense"
 department_of_state.140.d: "Estados Unidos ha lanzado una importante iniciativa de inversión en el Caribe, ofreciendo desarrollo de infraestructuras, asistencia económica y asociaciones comerciales para fortalecer los lazos en toda la región."
 department_of_state.140.a: "Agradecemos la inversión estadounidense."
 department_of_state.141.t: "Iniciativa de inversión de EE. UU. en el Caribe"
 department_of_state.141.d: "Estados Unidos ha anunciado una iniciativa integral de inversión en todo el Caribe, financiando el desarrollo de infraestructuras y programas económicos para fortalecer las asociaciones regionales y contrarrestar la influencia china."
 department_of_state.141.a: "Compromiso estadounidense en el Caribe."
 department_of_state.142.t: "Propuesta de inversión estadounidense"
 department_of_state.142.d: "Estados Unidos ha propuesto un paquete de inversión estratégica para profundizar nuestra integración económica, que incluye financiación para la fabricación de semiconductores y el desarrollo de cadenas de suministro críticas."
 department_of_state.142.a: "Aceptamos esta asociación."
 department_of_state.142.b: "Preferimos buscar un desarrollo independiente."
 department_of_state.143.t: "Resultados de la inversión canadiense"
 department_of_state.143.d: "Canadá ha respondido a nuestra propuesta de inversión."
 department_of_state.143.a: "Anotado."
 department_of_state.144.t: "Programa de desarrollo estadounidense"
 department_of_state.144.d: "Estados Unidos ha lanzado una iniciativa de desarrollo en África Occidental, ofreciendo inversión en infraestructuras, asistencia económica y asociaciones comerciales para promover el crecimiento y contrarrestar la influencia rival en la región."
 department_of_state.144.a: "Agradecemos la ayuda al desarrollo estadounidense."
 department_of_state.145.t: "Iniciativa de desarrollo de EE. UU. en África Occidental"
 department_of_state.145.d: "Estados Unidos ha anunciado una importante iniciativa de desarrollo en toda África Occidental, invirtiendo en infraestructuras y programas económicos para fortalecer las asociaciones y ofrecer una alternativa a la influencia china y rusa."
 department_of_state.145.a: "Un nuevo capítulo en el desarrollo africano."
 department_of_state.146.t: "Asociación con las Islas del Pacífico"
 department_of_state.146.d: "Estados Unidos ha propuesto renovar y ampliar nuestra asociación bajo el Tratado de Libre Asociación, ofreciendo una mayor asistencia económica y cooperación en materia de seguridad."
 department_of_state.146.a: "Valoramos nuestra asociación con Estados Unidos."
 department_of_state.147.t: "EE. UU. renueva el Tratado de las Islas del Pacífico"
 department_of_state.147.d: "Estados Unidos ha renovado y ampliado su Tratado de Libre Asociación con las naciones insulares del Pacífico, contrarrestando los avances diplomáticos y económicos de China en Oceanía."
 department_of_state.147.a: "El compromiso estadounidense con el Pacífico."
 department_of_state.148.t: "Preferencias comerciales de la AGOA"
 department_of_state.148.d: "Estados Unidos ha ofrecido a nuestra nación un acceso comercial preferente bajo la Ley de Crecimiento y Oportunidad en África, proporcionando un acceso libre de aranceles al mercado estadounidense para una amplia gama de productos."
 department_of_state.148.a: "Agradecemos la ampliación del acceso comercial."
 department_of_state.149.t: "EE. UU. amplía el programa comercial africano"
 department_of_state.149.d: "Estados Unidos ha ampliado la Ley de Crecimiento y Oportunidad en África, extendiendo el acceso comercial preferente a más naciones africanas y promoviendo el desarrollo económico en todo el continente."
 department_of_state.149.a: "El comercio promueve el desarrollo."
 department_of_state.150.t: "Invitación al Diálogo de Seguridad Cuadrilateral"
 department_of_state.150.d: "Estados Unidos ha propuesto formalizar el Diálogo de Seguridad Cuadrilateral entre nuestra nación, Estados Unidos y socios clave del Indo-Pacífico. Esta asociación coordinará las respuestas a los desafíos de seguridad compartidos y promoverá un Indo-Pacífico libre y abierto."
 department_of_state.150.a: "Nos uniremos al Quad."
 department_of_state.150.b: "Preferimos mantener nuestra autonomía estratégica."
 department_of_state.151.t: "Se establece la asociación del Quad"
 department_of_state.151.d: "El Diálogo de Seguridad Cuadrilateral entre Estados Unidos, Japón, la India y Australia se ha formalizado como un marco de seguridad clave para la región del Indo-Pacífico."
 department_of_state.151.a: "Emerge una nueva arquitectura de seguridad."
 department_of_state.152.t: "Propuesta de Acuerdo Mejorado de Cooperación en Defensa"
 department_of_state.152.d: "Estados Unidos ha propuesto ampliar el Acuerdo Mejorado de Cooperación en Defensa, ofreciendo una mayor asistencia militar, acuerdos de acceso a bases y equipamiento de defensa para reforzar nuestras capacidades en medio de las crecientes tensiones regionales."
 department_of_state.152.a: "Ampliaremos la cooperación en defensa."
 department_of_state.152.b: "Debemos considerar nuestras otras relaciones."
 department_of_state.153.t: "Se amplía la cooperación en defensa entre EE. UU. y Filipinas"
 department_of_state.153.d: "Estados Unidos y Filipinas han ampliado su Acuerdo Mejorado de Cooperación en Defensa, profundizando los lazos militares y fortaleciendo la alianza en medio de las crecientes tensiones en el mar de la China Meridional."
 department_of_state.153.a: "La alianza se profundiza."
 department_of_state.154.t: "Diálogo de reunificación de Corea"
 department_of_state.154.d: "Estados Unidos ha propuesto facilitar el diálogo intercoreano y las conversaciones de reunificación, ofreciendo apoyo diplomático para una resolución pacífica a la división de la península de Corea."
 department_of_state.154.a: "Estamos abiertos al diálogo."
 department_of_state.154.b: "Las condiciones no son las adecuadas para las conversaciones."
 department_of_state.155.t: "EE. UU. facilita el diálogo coreano"
 department_of_state.155.d: "Estados Unidos ha mediado en el diálogo intercoreano, sentando a la mesa a representantes tanto de Seúl como de Pionyang para mantener conversaciones sobre la reducción de tensiones y explorar vías hacia una eventual reunificación."
 department_of_state.155.a: "Un paso hacia la paz."
 department_of_state.160.t: "[FROM.GetName] acepta el Pacto AUKUS"
 department_of_state.160.d: "[FROM.GetName] ha aceptado unirse a la asociación de seguridad AUKUS, fortaleciendo nuestra cooperación trilateral de defensa en el Indo-Pacífico."
 department_of_state.160.a: "Excelente"
 department_of_state.161.t: "[FROM.GetName] se une al IPEF"
 department_of_state.161.d: "[FROM.GetName] ha aceptado participar en el Marco Económico del Indo-Pacífico, ampliando nuestra asociación económica en toda la región."
 department_of_state.161.a: "Un gran paso adelante"
 department_of_state.162.t: "[FROM.GetName] se une a los Acuerdos de Abraham"
 department_of_state.162.d: "[FROM.GetName] ha aceptado normalizar las relaciones con Israel bajo el marco de los Acuerdos de Abraham. Este es un avance histórico para la paz regional."
 department_of_state.162.a: "Un logro histórico"
 department_of_state.163.t: "[FROM.GetName] acepta la asociación de la Ley CHIPS"
 department_of_state.163.d: "[FROM.GetName] ha aceptado unirse a nuestra asociación de semiconductores bajo la Ley CHIPS, reforzando la resiliencia de nuestra cadena de suministro."
 department_of_state.163.a: "Buenas noticias"
 department_of_state.164.t: "[FROM.GetName] acepta asistir a la cumbre"
 department_of_state.164.d: "[FROM.GetName] ha aceptado participar en las conversaciones de desnuclearización. Esta es una oportunidad sin precedentes para la diplomacia en la península de Corea."
 department_of_state.164.a: "Un acontecimiento prometedor"
 department_of_state.165.t: "[FROM.GetName] acepta el despliegue del THAAD"
 department_of_state.165.d: "[FROM.GetName] ha aprobado el despliegue de sistemas de defensa de misiles THAAD en su territorio, fortaleciendo nuestra postura defensiva en la región."
 department_of_state.165.a: "Nuestros aliados están más seguros"
 department_of_state.166.t: "[FROM.GetName] acepta la asociación de inversión"
 department_of_state.166.d: "[FROM.GetName] ha aceptado nuestra propuesta de asociación económica y de semiconductores, profundizando nuestros lazos económicos."
 department_of_state.166.a: "Una asociación sólida"
 department_of_state.167.t: "[FROM.GetName] se une al Quad"
 department_of_state.167.d: "[FROM.GetName] ha acordado formalizar el Diálogo de Seguridad Cuadrilateral, reforzando nuestro compromiso compartido con un Indo-Pacífico libre y abierto."
 department_of_state.167.a: "Bienvenidos a bordo"
 department_of_state.168.t: "[FROM.GetName] amplía la cooperación del EDCA"
 department_of_state.168.d: "[FROM.GetName] ha aceptado ampliar el Acuerdo Mejorado de Cooperación en Defensa, profundizando nuestra asociación militar y los acuerdos de acceso a bases."
 department_of_state.168.a: "La alianza se fortalece"
 department_of_state.169.t: "[FROM.GetName] se muestra abierto a las conversaciones de reunificación"
 department_of_state.169.d: "[FROM.GetName] ha aceptado participar en el diálogo de reunificación facilitado por EE. UU. Todavía podría ser posible una resolución pacífica en la península de Corea."
 department_of_state.169.a: "La diplomacia prevalece"
 department_of_state.180.t: "[FROM.GetName] rechaza el Pacto AUKUS"
 department_of_state.180.d: "[FROM.GetName] ha rechazado participar en la asociación de seguridad AUKUS. Tendremos que buscar otras vías para la cooperación regional."
 department_of_state.180.a: "Decepcionante"
 department_of_state.181.t: "[FROM.GetName] rechaza el IPEF"
 department_of_state.181.d: "[FROM.GetName] ha rechazado unirse al Marco Económico del Indo-Pacífico. Su ausencia debilita la iniciativa."
 department_of_state.181.a: "Ellos se lo pierden"
 department_of_state.182.t: "[FROM.GetName] rechaza los Acuerdos de Abraham"
 department_of_state.182.d: "[FROM.GetName] ha rechazado normalizar las relaciones con Israel bajo los Acuerdos de Abraham. La paz regional tendrá que esperar."
 department_of_state.182.a: "Una oportunidad perdida"
 department_of_state.183.t: "[FROM.GetName] rechaza la asociación de la Ley CHIPS"
 department_of_state.183.d: "[FROM.GetName] ha rechazado nuestra propuesta de asociación de semiconductores. Tendremos que encontrar socios alternativos para asegurar nuestras cadenas de suministro."
 department_of_state.183.a: "Buscaremos en otra parte"
 department_of_state.184.t: "[FROM.GetName] rechaza asistir a la cumbre"
 department_of_state.184.d: "[FROM.GetName] ha rechazado participar en las conversaciones de desnuclearización. Las tensiones en la península de Corea siguen sin resolverse."
 department_of_state.184.a: "Un contratiempo"
 department_of_state.185.t: "[FROM.GetName] rechaza el despliegue del THAAD"
 department_of_state.185.d: "[FROM.GetName] ha rechazado el despliegue de los sistemas de defensa de misiles THAAD. Nuestra postura de defensa regional tendrá que ser reconsiderada."
 department_of_state.185.a: "Desafortunado"
 department_of_state.186.t: "[FROM.GetName] rechaza la asociación de inversión"
 department_of_state.186.d: "[FROM.GetName] ha rechazado nuestra propuesta de asociación económica y de semiconductores. La cooperación económica tendrá que adoptar una forma diferente."
 department_of_state.186.a: "Lamentable"
 department_of_state.187.t: "[FROM.GetName] rechaza unirse al Quad"
 department_of_state.187.d: "[FROM.GetName] ha rechazado formalizar el Diálogo de Seguridad Cuadrilateral, prefiriendo mantener su autonomía estratégica."
 department_of_state.187.a: "Respetamos su decisión"
 department_of_state.188.t: "[FROM.GetName] rechaza la ampliación del EDCA"
 department_of_state.188.d: "[FROM.GetName] ha rechazado ampliar el Acuerdo Mejorado de Cooperación en Defensa. Nuestra asociación de defensa se mantiene en su nivel internacional actual."
 department_of_state.188.a: "Un paso atrás"
 department_of_state.189.t: "[FROM.GetName] rechaza las conversaciones de reunificación"
 department_of_state.189.d: "[FROM.GetName] ha rechazado participar en el diálogo de reunificación. El camino hacia la paz en la península de Corea se hace más largo."
 department_of_state.189.a: "La puerta sigue abierta"
 USA_blr_fail_TT: "la operación fracasa, dejando a [BLR.GetFlag] [BLR.GetLeader] en el poder"
 USA_kidd_destroyer_accept_TT: "[TAI.GetFlag] §H[TAI.GetName]§! recibirá §H4 destructores clase Kee-Lung§! a cambio de §G$2.5B§!, reforzando el §Hestrecho de Taiwán§!"
 USA_additional_kee_lung_accept_TT: "[TAI.GetFlag] §H[TAI.GetName]§! recibirá §H3 destructores adicionales clase Kee-Lung§! y §Hancorajes/astilleros ampliados§! a cambio de §G$2B§!, y ganará §G+2% de apoyo bélico§! al hacer frente a [CHI.GetFlag] §HPekín§!"
 USA_article_nine_accept_TT: "[JAP.GetFlag] §H[JAP.GetName]§! reinterpretará el §HArtículo 9§!, lo que permitirá una postura de §Hautodefensa§! más activa y profundizará la §Hopinión§! entre nuestras naciones"
 department_of_state.220.t: "Un pedido ampliado de la clase Kee-Lung"
 department_of_state.220.d: "Dada la creciente agresión de [CHI.GetName], [USA.GetName] ha ofrecido un segundo lote de la clase Kee-Lung. El paquete incluye §H3 cascos reacondicionados adicionales§! extraídos de la reserva estadounidense, modernizados según los estándares actuales, junto con apoyo para la §Hampliación de astilleros§! con el fin de acelerar nuestra propia producción nacional. Washington claramente está apostando por una §HArmada de la República de China§! más fuerte como freno a las ambiciones del continente. La oferta no es barata, pero tampoco lo es ver cómo el estrecho se calma a nuestro favor."
 department_of_state.220.a: "Firmar el cheque"
 department_of_state.220.b: "No podemos permitirnos ese precio"
 department_of_state.230.t: "Una solicitud de estatus de MNNA"
 department_of_state.230.d: "[FROM.GetNameWithFlag] ha solicitado formalmente la designación como §HAliado importante no miembro de la OTAN§! (MNNA). Han expuesto sus argumentos: una alineación occidental o neutral, la disposición a compartir inteligencia y tecnología militar y, fundamentalmente, el compromiso de no caer bajo la influencia de [CHI.GetFlag] §HPekín§!, [SOV.GetFlag] §HMoscú§! o [PER.GetFlag] §HTeherán§!. Conceder el estatus de MNNA asegura su orientación hacia nosotros durante una generación, pero también significa que estamos señalando al mundo que un ataque contra ellos es un ataque contra nuestros intereses."
 department_of_state.230.a: "Conceder el estatus de Aliado importante no miembro de la OTAN"
 department_of_state.230.b: "Rechazar la solicitud"
 department_of_state.231.t: "La respuesta de [FROM.GetName]"
 department_of_state.231.d: "[FROM.GetNameWithFlag] ha enviado una respuesta formal a nuestra solicitud para el estatus de Aliado importante no miembro de la OTAN. La decisión está tomada."
 department_of_state.231.a: "Ahora somos un §HAliado importante no miembro de la OTAN§!"
 department_of_state.231.b: "Nuestra solicitud ha sido §Rrechazada§!"
 department_of_state.232.t: "[FROM.GetNameWithFlag] ha sido atacado"
 department_of_state.232.d: "[FROM.GetNameWithFlag] ha sido atacado por otra nación y es uno de nuestros §HAliados importantes no miembros de la OTAN§!. Cada tratado y cada discurso que hemos pronunciado sobre la defensa de nuestros socios dependen de momentos como este. El mundo está observando para ver si nuestro compromiso todavía significa algo. Nuestro liderazgo militar espera nuestra decisión. ¿Respondemos a su llamada a las armas?"
 department_of_state.232.a: "Honrar el compromiso. Movilizar a las fuerzas de reacción rápida."
 department_of_state.232.b: "Enviar armas e imponer sanciones, pero mantenerse al margen de los combates"
 department_of_state.232.c: "Condenar la invasión pero no tomar medidas"
 request_MNNA_status: "Solicitar estatus de Aliado importante no miembro de la OTAN"
 request_MNNA_status_desc: "El programa de §HAliado importante no miembro de la OTAN§! es una designación para socios cercanos que se encuentran fuera de la §HOTAN§!. Calificar para el estatus de MNNA nos otorga un asiento en la mesa para transferencias de armas, intercambio de inteligencia y ejercicios conjuntos, y, si los astros se alinean, el compromiso del líder de la §HOTAN§! de defendernos cuando vengan los lobos."
 MNNA_accept_TT: "Si el líder de la §HOTAN§! lo aprueba, recibiremos la idea de §HAliado importante no miembro de la OTAN§! y nuestras relaciones con ellos se §Hprofundizarán§!"
 MNNA_reject_TT: "Si es rechazada, no podremos volver a presentar la solicitud durante §H180 días§!"
 nato_leader_not_at_war_with_us_tt: "El líder de la §HOTAN§! no está en guerra con nosotros"
 Major_Non_NATO_Ally_TT: "Si somos §Ratacados§! por un agresor no democrático y que no sea MNNA, se podrá llamar al líder de la §HOTAN§! para que nos defienda"
 department_of_state.233.t: "Un aliado de la OTAN ha cambiado de bando"
 department_of_state.233.d: "[event_target:nato_coup_victim.GetNameWithFlag] ha experimentado un cambio de gobierno, y el nuevo liderazgo §Rya no es democrático§!. Las huellas de [event_target:nato_coup_aggressor.GetFlag] §H[event_target:nato_coup_aggressor.GetName]§! están por todas partes en esta transición. Aprovecharon su §Hpenetración de influencia§! en la política de [event_target:nato_coup_victim.GetName] para hacer cambiar de bando a un aliado de la OTAN desde dentro. La alianza está observando para ver cómo respondemos."
 department_of_state.233.a: "Expulsarlos de la OTAN y sancionar al nuevo régimen"
 department_of_state.233.b: "Apoyar clandestinamente a la oposición democrática"
 department_of_state.233.c: "Aceptar al nuevo régimen y preservar la unidad de la alianza"
 department_of_state.234.t: "Washington responde a la transición"
 department_of_state.234.d: "La nación de [USA.GetName] ha formalizado su postura sobre nuestro nuevo gobierno. La respuesta de Washington moldeará nuestro lugar en el mundo durante los próximos años."
 department_of_state.234.a: "Las consecuencias están ahora en nuestras manos"
 USA_trump_buy_greenland: "[DEN.GetFlag] Adquirir Groenlandia"
 USA_trump_buy_greenland_desc: "El presidente ha lanzado una idea que la mayoría de los expertos de Washington descartaron como una provocación en redes, pero hablaba completamente en serio: comprar Groenlandia a Dinamarca. El valor estratégico no está en duda: rutas marítimas árticas, minerales de tierras raras, una posición avanzada contra los submarinos rusos. La pregunta es si Copenhague se tomará la oferta en serio y si el precio será algo que el Congreso pueda tolerar."
 USA_greenland_accept_TT: "[DEN.GetFlag] §H[DEN.GetName]§! nos transfiere §HGroenlandia§! a cambio de §G$500B§!"
 USA_greenland_reject_TT: "[DEN.GetFlag] §H[DEN.GetName]§! rechaza la oferta y su opinión sobre nosotros §Rdisminuye§!"
 department_of_state.240.t: "Una oferta estadounidense por Groenlandia"
 department_of_state.240.d: "[FROM.GetNameWithFlag] ha ofrecido formalmente comprar §HGroenlandia§! por §G500 000 millones de dólares§!. La oferta no tiene precedentes en la era moderna. No se han comprado territorios entre aliados occidentales desde que se tiene memoria. Vender enfurecerá a la opinión política groenlandesa y a gran parte de Europa, pero negarse priva a [DEN.GetName] de una suma asombrosa en un momento en que necesitamos cada corona que podamos encontrar. El Folketing está paralizado; la decisión recae en el gabinete."
 department_of_state.240.a: "Vender Groenlandia"
 department_of_state.240.b: "Groenlandia no está en venta"
 department_of_state.241.t: "Groenlandia vendida a los Estados Unidos"
 department_of_state.241.d: "En un movimiento que ha dejado estupefacta a Europa y entusiasmado a la derecha estadounidense, el Reino de Dinamarca ha transferido formalmente §HGroenlandia§! a [USA.GetName] por una suma no revelada que se cree que asciende a cientos de miles de millones de dólares. La transacción ya está siendo calificada como la 'mayor venta de tierras de la historia', eclipsando la Compra de Luisiana. Han estallado protestas en Nuuk. Bruselas ha emitido un comunicado redactado en términos muy severos."
 department_of_state.241.a: "Un nuevo capítulo para la soberanía estadounidense"
 USA_trump_nato_dilemma: "[USA.GetFlag] Reevaluar nuestro papel en la OTAN"
 USA_trump_nato_dilemma_desc: "El presidente ha hecho campaña con la idea de que la §HOTAN§! está obsoleta y de que nuestros aliados europeos se están aprovechando de los dólares de defensa estadounidenses. Su equipo de seguridad nacional está menos convencido. Se avecina una revisión formal de nuestros compromisos, y hay tres opciones principales sobre la mesa: retirarse, amenazar con la retirada como elemento de presión o volver a comprometerse."
 department_of_state.242.t: "OTAN: La elección del presidente"
 department_of_state.242.d: "El presidente ha convocado a los Jefes de Estado Mayor, al secretario de Estado y al secretario de Defensa a una reunión a puerta cerrada sobre la §HOTAN§!. La cuestión que tienen ante sí es existencial: ¿cuál es el papel de Estados Unidos en la alianza de cara al futuro? Algunos miembros del personal defienden abiertamente la retirada total, argumentando que la alianza ya no sirve a los intereses estadounidenses en un mundo donde China es el competidor directo. Otros consideran que la alianza es la piedra angular de la seguridad occidental, algo que costó ochenta años construir y que podría perderse en una sola mañana."
 department_of_state.242.a: "Retirarse de la OTAN"
 department_of_state.242.b: "Amenazar con la retirada a menos que los aliados cumplan con el objetivo del 2%"
 department_of_state.242.c: "Reafirmar nuestro compromiso con la OTAN"
 USA_india_civil_nuclear_agreement: "[RAJ.GetFlag] [USA.GetFlag] El acuerdo nuclear con la India"
 USA_india_civil_nuclear_agreement_desc: "[RAJ.GetNameWithFlag] es la mayor democracia del mundo y un contrapeso natural frente a una pujante [CHI.GetNameWithFlag]. Al romper con décadas de ortodoxia nuclear y reconocer a [RAJ.GetNameWithFlag] como una potencia nuclear responsable, abrimos la puerta a una asociación estratégica que definirá el próximo siglo. Los pakistaníes pondrán el grito en el cielo y los partidarios de la no proliferación protestarán, pero el premio merece la pena."
 USA_india_nuclear_TT: "Ofreceremos a §H[RAJ.GetNameWithFlag]§! un §Hacuerdo de cooperación nuclear civil§!, poniendo fin a décadas de aislamiento tecnológico\n - Si lo aceptan, obtendremos un §Hmodificador de cooperación§! con §H[RAJ.GetNameWithFlag]§!\n - §H[PAK.GetNameWithFlag]§! perderá §R30 de opinión§! sobre nosotros independientemente del resultado\n\nImportancia estratégica de esta acción:\n - §H[RAJ.GetNameWithFlag]§! es la mayor democracia del mundo y el contrapeso más natural frente a §H[CHI.GetNameWithFlag]§!. Forjar esta relación ahora moldeará el próximo siglo del poder en el Indo-Pacífico."
 USA_vietnam_comprehensive_partnership: "[VIE.GetFlag] [USA.GetFlag] Socios en el Pacífico"
 USA_vietnam_comprehensive_partnership_desc: "Hace cincuenta años nos disparábamos mutuamente en la jungla. Hoy en día, [VIE.GetName] es una de las naciones más antichinas del sudeste asiático y un socio estratégico natural. Una Asociación Integral establecerá el marco para el comercio, la cooperación en materia de seguridad y el mutuo entendimiento tácito de que Pekín es el problema común."
 USA_vietnam_partnership_TT: "Ofreceremos a §H[VIE.GetNameWithFlag]§! una §HAsociación Integral§!, construyendo lazos estratégicos y un entendimiento tácito de que §H[CHI.GetNameWithFlag]§! es el problema común\n - Si lo aceptan, obtendremos un §Hmodificador de cooperación§! con §H[VIE.GetNameWithFlag]§!\n\nImportancia estratégica de esta acción:\n - §H[VIE.GetNameWithFlag]§! es una de las naciones más antichinas del sudeste asiático. Una asociación formal aquí abre una brecha entre [CHI.GetFlag] §HPekín§! y su entorno cercano que el dinero por sí solo no puede comprar."
 USA_caatsa_turkey_sanctions: "[TUR.GetFlag] [USA.GetFlag] Sanciones por el S-400"
 USA_caatsa_turkey_sanctions_desc: "[TUR.GetNameWithFlag] compró un sistema de defensa aérea ruso a pesar de ser un aliado de la OTAN. Así no es como funcionan las alianzas. Bajo la ley CAATSA, sancionaremos al estamento de defensa turco y los eliminaremos del programa F-35 hasta que entren en razón. Si quieren jugar a dos bandas, tendrán que pagar el precio."
 USA_caatsa_turkey_TT: "Enviaremos a §H[TUR.GetNameWithFlag]§! un ultimátum de §Rsanciones CAATSA§! debido a su compra del sistema de defensa aérea [SOV.GetFlag] §HS-400§!\n\nImportancia estratégica de esta acción:\n - Los aliados no pueden comprar armas rusas y permanecer en el programa F-35. Si §H[TUR.GetNameWithFlag]§! da marcha atrás, ganará §G+15§! de opinión hacia nosotros.\n - Si se niegan, serán §Rformalmente sancionados§! y la estabilidad de §H[TUR.GetNameWithFlag]§! se verá afectada."
 USA_recognize_guaido: "[VEN.GetFlag] [USA.GetFlag] Reconocer a Juan Guaidó"
 USA_recognize_guaido_desc: "El régimen de Maduro ha destruido a [VEN.GetName]. Millones han huido, la economía está en ruinas y la democracia es un recuerdo. La Asamblea Nacional, liderada por la oposición, ha nombrado a un presidente interino y vamos a reconocerlo como el líder legítimo de [VEN.GetName]. Las sanciones que seguirán asfixiarán lo que quede de los ingresos petroleros del régimen."
 USA_recognize_guaido_TT: "Reconoceremos a §HJuan Guaidó§! como el presidente legítimo de [VEN.GetFlag] §H[VEN.GetName]§! e impondremos §Rsanciones petroleras§! al régimen de Maduro\n\nImportancia estratégica de esta acción:\n - Si lo aceptan, [VEN.GetFlag] §H[VEN.GetName]§! perderá un §H10% de estabilidad§! y §H100 de poder político§!. El resultado es incierto: §H30%§! de probabilidad de una §Rguerra civil democrática§!, §H40%§! de probabilidad de §Rdisturbios masivos§!, §H30%§! de probabilidad de una §Gtransición pacífica§!.\n - Incluso si lo rechazan, [VEN.GetFlag] §H[VEN.GetName]§! perderá un §H5% de estabilidad§! y sufrirá un §Rdeclive económico§! a causa de nuestras sanciones."
 USA_cuba_thaw: "[CUB.GetFlag] [USA.GetFlag] Poner fin a la Guerra Fría con Cuba"
 USA_cuba_thaw_desc: "El embargo a [CUB.GetName] no ha funcionado durante cincuenta años, y no va a funcionar en los próximos cincuenta. Es hora de restablecer las relaciones diplomáticas, reabrir la embajada y aliviar las restricciones a los viajes y a las remesas. El acercamiento hará más por cambiar a Cuba de lo que el aislamiento jamás logró."
 USA_cuba_thaw_TT: "Restableceremos las §Hrelaciones diplomáticas§! con [CUB.GetFlag] §H[CUB.GetName]§! y aliviaremos el §Hembargo§!, abriendo la puerta a la normalización\n - Si [CUB.GetFlag] §H[CUB.GetName]§! lo acepta, obtendremos un §Hmodificador de cooperación§! y su §Hestabilidad§! mejorará un §G5%§!\n - Esta acción es §Rpermanente§!. Bloquea la opción de §RCongelamiento con Cuba§! durante el resto de la era\n\nImportancia estratégica de esta acción:\n - Cincuenta años de embargo no han derrocado al gobierno de [CUB.GetFlag] §HCuba§!. El acercamiento podría tener éxito donde el aislamiento ha fracasado."
 USA_cuba_freeze: "[CUB.GetFlag] [USA.GetFlag] Cuba no es una amiga"
 USA_cuba_freeze_desc: "El deshielo con La Habana le dio al régimen todo lo que quería y no ofreció nada a cambio. Volveremos a imponer restricciones de viaje, endureceremos el embargo y perseguiremos los flujos de dólares hacia las fuerzas militares cubanas. [CUB.GetName] es una dictadura comunista a noventa millas de nuestra costa, y la trataremos como tal."
 USA_cuba_freeze_TT: "Volveremos a imponer §Rsanciones§! estrictas a [CUB.GetFlag] §H[CUB.GetName]§! y revertiremos cualquier beneficio de la normalización\n - Si lo aceptan, [CUB.GetFlag] §H[CUB.GetName]§! perderá un §H2% de estabilidad§! y §H25 de poder político§!\n - Si lo rechazan, [CUB.GetFlag] §H[CUB.GetName]§! perderá un §H5% de estabilidad§! y se enfrentará a un §Rdeclive económico§!\n - Esta acción es §Rpermanente§!. Bloquea la opción de §RDeshielo con Cuba§! durante el resto de la era\n\nImportancia estratégica de esta acción:\n - [CUB.GetFlag] §H[CUB.GetName]§! es una dictadura comunista a noventa millas de nuestras costas. Las sanciones envían el mensaje de que desafiar los intereses estadounidenses en nuestro propio hemisferio tiene un coste."
 USA_huawei_export_blacklist: "[CHI.GetFlag] [USA.GetFlag] Incluir a Huawei en la lista negra"
 USA_huawei_export_blacklist_desc: "Huawei no es solo una empresa de telecomunicaciones, es un brazo del Estado chino, y cada router que venden en el extranjero es una puerta trasera potencial hacia las redes aliadas. Añadirlos a la Lista de Entidades los priva de chips y software estadounidenses. Si nuestros aliados quieren mantener seguras sus redes 5G, seguirán nuestro ejemplo."
 USA_huawei_blacklist_TT: "Añadiremos a §HHuawei§! y a las empresas tecnológicas [CHI.GetFlag] §Hchinas§! relacionadas a la §HLista de Entidades§!, privándolas de chips y software estadounidenses\n\nImportancia estratégica de esta acción:\n - Si [CHI.GetFlag] §H[CHI.GetName]§! da marcha atrás, perderá §R50 de poder político§! ante la presión estadounidense.\n - Si se niega, la tecnología [CHI.GetFlag] §Hchina§! se enfrentará a un §Rdeclive económico§! a medida que las cadenas de suministro se fragmenten lejos de ellos."
 USA_semiconductor_export_controls: "[CHI.GetFlag] [USA.GetFlag] Asfixiar el suministro de chips"
 USA_semiconductor_export_controls_desc: "Los chips avanzados son el petróleo del siglo veintiuno, y [CHI.GetName] lleva años de retraso. Estos nuevos controles de exportación mantendrán las cosas así. Nada de equipos avanzados de litografía, nada de aceleradores de IA, nada de apoyo para sus fábricas más sofisticadas. Es la política de contención tecnológica más agresiva desde la Guerra Fría, y va a causar un impacto profundo."
 USA_semiconductor_controls_TT: "Impondremos §Hcontroles estrictos de exportación§! a los §Hsemiconductores§! avanzados y a los equipos de fabricación de chips destinados a [CHI.GetFlag] §H[CHI.GetName]§!\n\nImportancia estratégica de esta acción:\n - Si [CHI.GetFlag] §H[CHI.GetName]§! capitula, perderá §R75 de poder político§! debido a la presión interna que esto generará.\n - Si se niega, su industria de chips de gama alta se enfrentará a un §Rdeclive económico§! y quedará rezagada durante años, asegurando nuestra ventaja tecnológica."
 USA_hong_kong_autonomy_sanctions: "[CHI.GetFlag] [USA.GetFlag] La Ley de Autonomía de Hong Kong"
 USA_hong_kong_autonomy_sanctions_desc: "La ley de seguridad nacional de Pekín ha estrangulado las libertades prometidas a Hong Kong bajo el principio de 'Un país, dos sistemas'. La Ley de Autonomía de Hong Kong nos permite sancionar a los funcionarios del PCCh y a los bancos responsables. No restaurará Hong Kong, pero hará que las personas que acabaron con ella paguen un precio personal."
 USA_hk_sanctions_TT: "Sancionaremos a los §Hfuncionarios del PCCh§! y a los bancos responsables de la represión en §HHong Kong§! bajo la Ley de Autonomía de Hong Kong\n\nImportancia estratégica de esta acción:\n - Si [CHI.GetFlag] §H[CHI.GetName]§! da marcha atrás, perderá §R100 de poder político§! y un §R3% de estabilidad§! debido al impacto interno.\n - Si se niega, el crecimiento [CHI.GetFlag] §Hchino§! se verá afectado y [ENG.GetFlag] §H[ENG.GetName]§! ganará §G+15§! de opinión hacia nosotros por mantenernos firmes."
 USA_withdraw_from_who: "[USA.GetFlag] Retirar fondos a la Organización Mundial de la Salud"
 USA_withdraw_from_who_desc: "La Organización Mundial de la Salud encubrió a [CHI.GetName] mientras el virus se propagaba por todo el mundo. Son un títere chino y nosotros no vamos a pagar la cuenta. Retiramos nuestra financiación y nuestra membresía. Que la OMS explique a sus otros donantes por qué el más grande de todos se marchó."
 USA_return_to_who: "[USA.GetFlag] Reintegrarse a la Organización Mundial de la Salud"
 USA_return_to_who_desc: "Abandonar la OMS en mitad de una pandemia fue una herida autoinfligida. Nos reintegraremos desde el primer día, restaurando nuestra financiación y reafirmando el liderazgo estadounidense en la agencia. Las reformas llegarán desde dentro, no desde la barrera."
 USA_fentanyl_cartel_fto: "[MEX.GetFlag] [USA.GetFlag] Designar a los cárteles como terroristas"
 USA_fentanyl_cartel_fto_desc: "El fentanilo está matando a más estadounidenses cada año que toda la guerra de Vietnam. Los cárteles que lo envían a través de la frontera son organizaciones terroristas en todo menos en el nombre, y hoy lo hacemos oficial. La designación como Organización Terrorista Extranjera desbloquea cada herramienta legal y militar que tenemos. [MEX.GetName] puede ayudar o apartarse del camino."
 USA_fentanyl_fto_TT: "Designaremos formalmente a los [MEX.GetFlag] §Hcárteles de la droga mexicanos§! como §HOrganizaciones Terroristas Extranjeras§!, desbloqueando todas las herramientas antiterroristas a nuestra disposición\n\nImportancia estratégica de esta acción:\n - Si [MEX.GetFlag] §H[MEX.GetName]§! coopera, obtendremos un §Hmodificador de cooperación§! y un socio real para desmantelar la cadena de suministro.\n - Si [MEX.GetFlag] §H[MEX.GetName]§! se niega, su economía recibirá un §Rimpacto§! y su estabilidad caerá un §R3%§! a medida que nuestra presión contra el narcotráfico se intensifique."
 department_of_state.210.t: "Asociación nuclear estadounidense"
 department_of_state.210.d: "Los estadounidenses han extendido una oferta histórica: un acuerdo integral de cooperación nuclear civil que pondría fin a décadas de sanciones impuestas tras nuestras pruebas de 1974. A cambio de separar nuestros programas civiles y militares y aceptar las salvaguardias del OIEA en los reactores civiles, obtendríamos acceso a la tecnología de reactores y combustible estadounidenses. Islamabad pondrá el grito en el cielo, pero un abrazo estratégico de Washington no es una oferta que se presente dos veces."
 department_of_state.210.a: "Una asociación de dos grandes democracias."
 department_of_state.210.b: "No comprometeremos nuestro programa nuclear."
 department_of_state.211.t: "Una Asociación Integral"
 department_of_state.211.d: "Washington nos ha ofrecido una Asociación Integral que abarca la cooperación política, económica, cultural y en materia de seguridad. Medio siglo después de la guerra, los estadounidenses están listos para dejar atrás el pasado y mantenerse firmes juntos frente al creciente problema chino en el mar de la China Meridional. El Partido debe decidir qué tan profundo dejar llegar este acercamiento."
 department_of_state.211.a: "Aceptamos la asociación."
 department_of_state.211.b: "No es el momento adecuado."
 department_of_state.212.t: "Ultimátum de la CAATSA"
 department_of_state.212.d: "Los estadounidenses han entregado un ultimátum: abandonar el S-400 ruso y regresar al programa F-35, o enfrentarse a amplias sanciones CAATSA y a la expulsión del consorcio de cazas. Washington se niega a aceptar que un aliado de la OTAN pueda comprar sistemas de defensa aérea rusos sin consecuencias. La elección es entre nuestra autonomía estratégica y nuestra alineación occidental."
 department_of_state.212.a: "Cancelaremos el acuerdo por el S-400."
 department_of_state.212.b: "Turquía no responde ante nadie."
 department_of_state.213.t: "Ultimátum estadounidense"
 department_of_state.213.d: "Los estadounidenses han reconocido el reclamo de la oposición a la presidencia y exigen que el régimen dé un paso al costado. Seguirán sanciones petroleras devastadoras a menos que cedamos. Las calles están llenas de manifestantes, la oposición está envalentonada y la Casa Blanca está dejando claro que considera que los días del bolivarianismo están contados."
 department_of_state.213.a: "Daremos un paso al costado para salvar a la nación."
 department_of_state.213.b: "La revolución no será imperializada."
 department_of_state.214.t: "Normalización con Washington"
 department_of_state.214.d: "Tras medio siglo de confrontación, los estadounidenses han ofrecido restablecer las relaciones diplomáticas, reabrir las embajadas y flexibilizar el embargo. Washington apuesta a que el acercamiento logrará lo que el aislamiento nunca pudo. Es una apertura que no esperábamos, y que podría transformar nuestra economía o comprometer la revolución."
 department_of_state.214.a: "La revolución sobrevivirá al embargo. Que vengan."
 department_of_state.214.b: "No cambiaremos nuestros principios por dólares del turismo."
 department_of_state.215.t: "El regreso del embargo"
 department_of_state.215.d: "Los estadounidenses han cambiado de rumbo. Se vuelven a imponer restricciones de viaje, se congelan los contactos de las embajadas y se endurece el embargo una vez más. Washington ha decidido que el deshielo nos dio todo y no ofreció nada a cambio. La breve apertura ha terminado."
 department_of_state.215.a: "Debemos encontrar una forma de negociar."
 department_of_state.215.b: "Resistiremos como siempre lo hemos hecho."
 department_of_state.216.t: "Sanciones de la Lista de Entidades"
 department_of_state.216.d: "Los estadounidenses han añadido a Huawei y a una lista creciente de nuestras empresas tecnológicas a su Lista de Entidades, privándolas de chips, software y componentes estadounidenses. Washington está tratando a nuestros campeones nacionales como brazos del Estado y presionando a las capitales aliadas para que hagan lo mismo en la adquisición de 5G. Es un acto de guerra económica contra nuestro ascenso tecnológico y exige una respuesta."
 department_of_state.216.a: "Buscaremos un compromiso negociado."
 department_of_state.216.b: "La autosuficiencia será nuestra respuesta."
 department_of_state.217.t: "Escalada de la guerra de los chips"
 department_of_state.217.d: "Los estadounidenses han impuesto nuevos y amplios controles de exportación a los semiconductores avanzados y al equipo necesario para fabricarlos, apuntando específicamente a nuestro camino hacia los chips militares y de IA de gama alta. Es el bloqueo tecnológico más agresivo que Washington ha intentado desde la Guerra Fría, y golpea directamente el corazón de nuestro futuro industrial."
 department_of_state.217.a: "Debemos encontrar una resolución diplomática."
 department_of_state.217.b: "Construiremos lo que ellos no nos vendan."
 department_of_state.218.t: "Ley de Autonomía de Hong Kong"
 department_of_state.218.d: "Los estadounidenses han promulgado sanciones contra nuestros funcionarios y bancos a causa de la ley de seguridad nacional de Hong Kong. Washington ha declarado que hemos violado el principio de 'Un país, dos sistemas', mientras que nosotros insistimos en que el asunto es un tema soberano interno. Las sanciones están calibradas para imponer costes personales a los camaradas que autorizaron la represión."
 department_of_state.218.a: "Suavizaremos la aplicación de la ley en Hong Kong."
 department_of_state.218.b: "Hong Kong es un asunto interno."
 department_of_state.219.t: "Cárteles declarados terroristas"
 department_of_state.219.d: "Los estadounidenses han designado formalmente a nuestros cárteles como Organizaciones Terroristas Extranjeras y nos están presionando para que cooperemos en operaciones conjuntas. Washington ha convertido la crisis del fentanilo en el eje central de su política y está debatiendo abiertamente una acción militar unilateral en nuestro suelo. La elección es entre una asociación humillante y la perspectiva de drones estadounidenses en nuestros cielos."
 department_of_state.219.a: "Cooperaremos para evitar algo peor."
 department_of_state.219.b: "Nuestra soberanía no está en venta."
 USA_fifth_generation_fighter_woes_1: "Melancolía de 5.ª generación: Producción"
 USA_fifth_generation_fighter_woes_1_desc: "A pesar de las perspectivas optimistas desde el primer vuelo de prueba en 1997, el F-22 se ha visto empañado por problemas de fabricación y ensamblaje. El desecho de piezas, el reacondicionamiento y los retrasos en los planos de ingeniería mantienen la producción lenta y costosa. Lockheed espera que los primeros F-22 alcancen la producción a ritmo bajo a finales de este año."
 USA_fifth_generation_fighter_woes_2: "Melancolía de 5.ª generación: Célula de la aeronave"
 USA_fifth_generation_fighter_woes_2_desc: "Las pruebas de vuelo han sacado a la luz problemas en la estructura del avión que repercuten en la línea de producción: vibraciones en la aleta vertical, sobrecalentamiento entre los escapes de los motores y debilitamiento del estabilizador horizontal. Cada Raptor que sale de la línea cuesta más mientras se implementan las soluciones."
 USA_fifth_generation_fighter_woes_3: "Melancolía de 5.ª generación: Aviónica"
 USA_fifth_generation_fighter_woes_3_desc: "La suite de aviónica de ordenador central del Raptor es inestable. Con más de 1,7 millones de líneas de código, los pilotos tienen que reiniciar los ordenadores de la aeronave en pleno vuelo. Hasta que el tiempo medio entre anomalías de aviónica cumpla los requisitos para las pruebas operativas, la producción seguirá siendo lenta y costosa."
 USA_f22_rushed_production: "Despliegue apresurado del Raptor"
 USA_f22_rushed_production_desc: "Enviamos el F-22 al campo de batalla antes de que se solucionaran todos los fallos. La flota vuela con fallos conocidos, lo que eleva la tasa de accidentes y merma la pericia de las tripulaciones hasta que se apliquen las correcciones correspondientes."
 USA_f22_raptor_operational: "F-22 Raptor operativo"
 USA_f22_raptor_operational_desc: "El Raptor está en servicio. Con el problemático desarrollo ya en el pasado, la línea de producción funciona a buen ritmo y la fuerza aérea por fin dispone de su caza de quinta generación."
 usa.200.t: "El F-22A entra en producción a ritmo bajo"
 usa.200.d: "Tras años de retrasos, el Raptor recibe luz verde para la producción inicial a ritmo bajo. Los aviones de prueba van con retraso, la productividad del software es baja y la fábrica sigue lidiando con desecho de piezas y reacondicionamientos. ¿Con cuánta fuerza aceleramos la línea de producción?"
 usa.200.a: "Aceleremos el ritmo, necesitamos estructuras de aviones"
 usa.200.b: "Mantengamos un ritmo de construcción deliberado y prudente"
 usa.201.t: "Problemas estructurales del F-22"
 usa.201.d: "Las pruebas de vuelo han descubierto violentas vibraciones en las aletas verticales, sobrecalentamiento entre los escapes de los motores y debilitamiento en el estabilizador horizontal. Las soluciones deben incorporarse de nuevo a los aviones de producción. ¿Hacemos un remiendo rápido y seguimos volando, o paramos para un rediseño adecuado?"
 usa.201.a: "Atornillemos los remiendos rápidos y sigamos volando"
 usa.201.b: "Paremos la línea para un rediseño adecuado"
 usa.202.t: "Inestabilidad del software de aviónica del F-22"
 usa.202.d: "Los pilotos están reiniciando la aviónica en pleno vuelo. La Junta de Adquisiciones de Defensa exige horas de funcionamiento estable antes de las pruebas operativas. Podemos desplegar el Bloque 3.1.2 tal como está, o volcar todos nuestros recursos en el software antes de que el Raptor pase a estar operativo."
 usa.202.a: "Desplegar el Bloque 3.1.2 tal cual"
 usa.202.b: "Esfuerzo de máxima prioridad para el software"
 usa.203.t: "El Raptor está operativo"
 usa.203.d: "La evaluación y prueba operativa inicial calificó al F-22 como abrumadoramente eficaz, superando al F-15C en todas las áreas de misiones aire-aire. Se aprueba la producción a pleno rendimiento y los primeros Raptors con capacidad de combate están llegando a la flota."
 usa.203.a: "Superioridad aérea garantizada"
 MNNA_partnership: "Programa de Aliados Importantes No Miembros de la OTAN"
 MNNA_partnership_desc: "La designación de §HAliado importante no miembro de la OTAN§! es otorgada por el liderazgo de la §HOTAN§! a socios cercanos fuera de la alianza. Concede acceso preferente a transferencias de armas, ejercicios militares conjuntos y acuerdos de intercambio de inteligencia."
 USA_nigeria_intervention: "Intervención de EE. UU. en Nigeria"
 USA_rock_island_arsenal_name: "Arsenal de Rock Island"
 USA_rock_island_arsenal_trait: "Arsenal gubernamental del Ejército de EE. UU."
 USA_rock_island_arsenal_b1_header: "Línea de obuses remolcados"
 USA_rock_island_arsenal_b2_header: "Fabricación del arsenal"
 USA_rock_island_m198_line: "Línea del obús M198"
 USA_rock_island_m119_light: "Obús ligero M119"
 USA_rock_island_m198_range: "Extensión de alcance del M198"
 USA_rock_island_digital_fire_control: "Control de tiro digital del M119A3"
 USA_rock_island_jmtc: "Centro de Tecnología y Fabricación Conjunta"
 USA_rock_island_recoil_mechanisms: "Maestría en mecanismos de retroceso"
 USA_rock_island_additive_manufacturing: "Fundición de fabricación aditiva"
 USA_us_arab_legion_desc: "Voluntarios árabe-estadounidenses se han movilizado para formar una legión que luchará junto a nuestras fuerzas contra la amenaza iraquí. Organizar y sostener este cuerpo de voluntarios mermará nuestra reserva de reclutamiento, dejando un poco menos de personal para el servicio regular."
 lunar_outpost_tt: "Con el paso del tiempo, nuestro puesto avanzado lunar puede experimentar desafíos o crisis que lo pongan en peligro. Sin embargo, si tiene éxito, las recompensas serán tremendas."
 USA_wot_iraq_invasion_failed: "Fracaso al invadir Irak"
 MNNA_nato_may_intervene_in_this_conflict_tt: "Debido a que [FROM.GetNameWithFlag] es un §HAliado importante no miembro de la OTAN§!, es posible que veamos una intervención de la §HOTAN§! en este conflicto.\n"
 MNNA_rejected_recently: "Has recently applied for §YMajor Non-NATO Ally§!, and got rejected."
 USA_condemn_iranian_missile_launches: "Organizar la condena a las pruebas de misiles iraníes"
 USA_condemn_iranian_missile_launches_desc: "El programa de misiles balísticos de Irán ha continuado a través de cada ronda de sanciones, con lanzamientos de prueba programados para señalar desafío en lugar de capacidad. Washington puede presionar a un gobierno socio para que se una a una condena pública, convirtiendo una protesta unilateral en un frente diplomático común. Los gobiernos que dependen de la energía iraní o temen represalias pueden negarse."
 USA_condemned_PER_launch_recently: "Ha organizado recientemente la condena a las pruebas de misiles iraníes"
 USA_shayrat_missile_strike: "Atacar la base aérea de Shayrat"
 USA_shayrat_missile_strike_desc: "La base aérea de Shayrat, a las afueras de Homs, alberga los escuadrones de la Fuerza Aérea Siria que realizan salidas contra el territorio controlado por los rebeldes. Los destructores en el Mediterráneo oriental pueden lanzar Tomahawks sobre la pista de aterrizaje, los refugios blindados y los puntos de reabastecimiento de combustible en cuestión de horas. Se trata de un ataque punitivo, no de una campaña: Damasco reparará el aeródromo en unos días, y Moscú y Teherán lo considerarán como una entrada directa de Estados Unidos en la guerra."
 USA_arm_rojava: "Armar a las Fuerzas Democráticas Sirias"
 USA_arm_rojava_desc: "Las milicias lideradas por kurdos que controlan el norte de Siria son la única fuerza terrestre dispuesta a tomar Raqa, y están luchando con lo que pueden capturar. Las transferencias directas de armas ligeras, vehículos livianos y armas antitanque harían posible un asalto a la capital del Estado Islámico. Ankara considera a estas unidades como una extensión del PKK y leerá el cargamento como el armamento de una organización terrorista en su frontera."
 asteroid_mining_rate_tt: "Requiere una tasa de minería de asteroides activa (actualmente [?asteroid_mining_rate|0])"
 USA_jcpoa_withdrawn: "Ya se ha retirado del JCPOA"
 USA_jerusalem_recognized: "Ya ha reconocido a Jerusalén como la capital de Israel"
 USA_golan_recognized: "Ya ha reconocido la soberanía israelí sobre el Golán"
 USA_paris_agreement_rejoined: "Ya se ha reintegrado al Acuerdo de París"
 USA_thaad_deployed: "El THAAD ya ha sido desplegado en Corea"
 USA_quad_established: "El Quad ya ha sido formalizado"
 USA_phi_edca_expanded: "El EDCA ya ha sido ampliado"
 USA_yemen_intervention: "Ya ha intervenido en Yemen"
 USA_mali_intervention: "Ya ha intervenido en Malí"
 USA_haiti_stabilization: "Ya se ha desplegado en Haití"
