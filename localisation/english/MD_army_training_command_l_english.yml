 MD_artc_fully_upgraded: "Fully Upgraded"
 MD_artc_exercise_operations: "Combined Arms Field Exercise"
 MD_artc_exercise_operations_desc: "Brigades deploy to the training area to rehearse the army's operational concept end to end, from movement to contact through exploitation and resupply."
 MD_artc_ex_operations_short: "Operational Theory mastery for 90 days."
 MD_artc_exercise_dedicated: "Combat Training Centre Rotation"
 MD_artc_exercise_dedicated_desc: "Units rotate through the combat training centre and fight a professional opposing force under instrumented conditions. Every engagement is reviewed in detailed after action reports."
 MD_artc_ex_dedicated_short: "Dedicated Doctrine mastery for 90 days."
 MD_artc_exercise_training: "Live Fire Training Cycle"
 MD_artc_exercise_training_desc: "Battalions move through a graduated live fire program, from individual weapons qualification to company level combined arms ranges."
 MD_artc_ex_training_short: "Training mastery for 90 days."
 MD_artc_exercise_leadership: "Command Post Exercise"
 MD_artc_exercise_leadership_desc: "Division and corps headquarters deploy their command posts and fight a simulated campaign. Staffs practice orders production, battle tracking and handing over command under pressure."
 MD_artc_ex_leadership_short: "Leadership mastery for 90 days."
 MD_artc_exercise_technology: "Experimental Force Trials"
 MD_artc_exercise_technology_desc: "A designated experimental formation trials new sensors, networks and weapons in the field. Its findings shape how the wider army adopts new equipment."
 MD_artc_ex_technology_short: "Technology mastery for 90 days."
 MD_artc_exercise_structure: "Formation Readiness Exercise"
 MD_artc_exercise_structure_desc: "Divisions mobilize to full strength and deploy on short notice to test how the army's force structure holds up during a rapid deployment."
 MD_artc_ex_structure_short: "Structure mastery for 90 days."
 MD_artc_staff_college_name: "Command and General Staff College"
 MD_artc_staff_college_short: "Every army leader gains experience, and one may gain a new trait."
 MD_artc_staff_college_cooldown: "Command and General Staff College in Session"
 MD_artc_staff_college_cooldown_desc: "Field grade officers are attending the command and general staff college. The next class starts when this one graduates."
 MD_artc_senior_course_name: "Senior Leaders Course"
 MD_artc_senior_course_short: "One field marshal, or a general if none qualify, gains a skill level."
 MD_artc_senior_course_cooldown: "Senior Leaders Course in Session"
 MD_artc_senior_course_cooldown_desc: "General officers are completing senior command training for corps and army level command. A new course can begin once this class has finished."
 MD_artc_rnd_liaison_name: "Land R&D Liaison"
 MD_artc_rnd_liaison_short: "Gain a land breakthrough point."
 MD_artc_rnd_liaison_cooldown: "Land R&D Liaison Active"
 MD_artc_rnd_liaison_cooldown_desc: "Army officers are seconded to defense research establishments, turning operational lessons into development requirements."
 MD_artc_academy_name: "Combat Training Program"
 MD_artc_academy_short: "Unlocks a Spirit of the Academy, boosts exercises."
 MD_artc_academy_level_text: "Level [?ROOT.MD_artc_academy_level|0]/3"
 MD_artc_army_name: "Army Sustainment Program"
 MD_artc_army_short: "Unlocks a Spirit of the Army."
 MD_artc_army_level_text: "Level [?ROOT.MD_artc_army_level|0]/3"
 MD_artc_command_name: "Mission Command Training Program"
 MD_artc_command_short: "Unlocks a Spirit of Division Command."
 MD_artc_command_level_text: "Level [?ROOT.MD_artc_command_level|0]/3"
 MD_artc_academy_1: "Combat Training Centre I"
 MD_artc_academy_1_desc: "A permanent combat training centre with a dedicated opposing force gives every brigade a demanding rotation before it is declared ready."
 MD_artc_academy_2: "Combat Training Centre II"
 MD_artc_academy_2_desc: "$MD_artc_academy_1_desc$"
