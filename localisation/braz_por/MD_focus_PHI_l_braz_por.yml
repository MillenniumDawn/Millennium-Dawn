 PHI_islamism_dynamic_modifier: "Ascensão do Islamismo Radical"
 PHI_islamism_dynamic_modifier_tooltip: "O islamismo faz parte das Filipinas há séculos. Recentemente isso começou a mudar, e o sul do país tem visto uma radicalização extrema."
 PHI_npa_insurgency_dynamic_modifier: "Guerra Popular Prolongada"
 PHI_npa_insurgency_dynamic_modifier_tooltip: "O Partido Comunista das Filipinas trava uma guerra de guerrilha rural por meio de seu Novo Exército do Povo desde 1969. Seus quadros cobram impostos de vilarejos, emboscam patrulhas e disputam o governo local em Luzon, Samar e no leste de Mindanao."
 PHI_milf_decisions_category: "O Conflito Moro"
 PHI_milf_decisions_category_desc: "The Moro Conflict is referred to as a series of armed conflicts within the Mindanao province. The Moro Conflict began as a result of the Resettlement Policy enforced during the Philippine Commonwealth territory in 1935. It exploded when 11 Muslim military trainees were murdered in Corregidor. The Moro Islamic National Front formed shortly thereafter in 1969 and has since been in open conflict with the government Forces.\n £generic_anarchist_communism_small §RStrength of MILF:§! [?PHI.PHI_strength_of_milf|0]%"
 PHI_anti_muslim_propaganda: "Propaganda Antimuçulmana"
 PHI_anti_muslim_propaganda_desc: "Direcionar a mídia estatal e as mensagens públicas para conter a influência dos grupos insurgentes islâmicos radicais que atuam em Mindanao."
 PHI_crush_the_moro_insurgency: "Esmagar a Insurgência Moro"
 PHI_crush_the_moro_insurgency_desc: "Com a Frente Moro de Libertação Islâmica reduzida a remanescentes dispersos, as Forças Armadas podem declarar encerrada a campanha de Mindanao. O comando das províncias do sul retorna ao governo civil, e a insurgência termina pela força das armas, e não por negociação."
 PHI_sign_the_bangsamoro_agreement: "Assinar o Acordo de Bangsamoro"
 PHI_sign_the_bangsamoro_agreement_desc: "Negociações mediadas pela Malásia em Kuala Lumpur trouxeram a Frente à mesa. Um acordo abrangente desmobilizaria seus combatentes, substituiria a Região Autônoma no Mindanao Muçulmano por uma entidade Bangsamoro com reais poderes fiscais e legislativos e comprometeria Manila a financiar a transição."
 PHI_communist_insurgency_category: "Rebelião do Novo Exército do Povo"
 PHI_communist_insurgency_category_desc: "The New People's Army Rebellion is the world's oldest Communist insurgency. The NPA has been fighting constantly since 1969 against the Filipino national government.\n\nIt is time we put forth effort in crushing this rebellion.\n £generic_Communist_State_small §RStrength of the NPA:§! [?PHI.PHI_strength_of_npa|0]%"
 PHI_sustained_military_offensive: "Ofensiva Militar Sustentada"
 PHI_sustained_military_offensive_desc: "Empenhar unidades do exército e da constabulária na limpeza das frentes guerrilheiras na Sierra Madre, em Samar e no interior de Davao. As varreduras enfraquecem o Novo Exército do Povo mais rápido que qualquer outro método, mas operações prolongadas no campo custam ao governo o apoio da população rural."
 PHI_peace_and_development_teams: "Equipes de Paz e Desenvolvimento"
 PHI_peace_and_development_teams_desc: "Enviar equipes civis-militares conjuntas aos barangays sob influência guerrilheira, combinando a construção de estradas e escolas com trabalho de governança local. Privar a insurgência de sua base de recrutamento é mais lento que uma varredura, e consideravelmente mais caro, mas não custa estabilidade."
 PHI_amnesty_for_returning_cadres: "Anistia aos Quadros que Retornam"
 PHI_amnesty_for_returning_cadres_desc: "Oferecer imunidade legal, auxílio em dinheiro e apoio à subsistência aos combatentes que entregarem suas armas. Deserções em massa esvaziam as frentes guerrilheiras, embora perdoar insurgentes custe ao governo prestígio junto ao corpo de oficiais e às vítimas da rebelião."
 PHI_defeat_the_new_peoples_army: "Derrotar o Novo Exército do Povo"
 PHI_defeat_the_new_peoples_army_desc: "As frentes guerrilheiras foram quebradas e o Comitê Central está disperso no exterior. Declarar a rebelião militarmente derrotada encerra a insurgência comunista mais longa do mundo."
 PHI_conclude_the_oslo_talks: "Concluir as Negociações de Oslo"
 PHI_conclude_the_oslo_talks_desc: "Mediadores noruegueses mantêm há anos um canal aberto com a Frente Democrática Nacional. Um acordo final trocaria anistia política e compromissos de reforma agrária pela desmobilização permanente do Novo Exército do Povo."
 PHI_anti_dynasty_law: "Lei Antidinastia"
 PHI_anti_dynasty_law_desc: "O Artigo II, Seção 26 da Constituição de 1987 proíbe as dinastias políticas, mas o Congresso nunca aprovou a legislação regulamentadora, e as famílias que dominam o legislativo não têm motivo para isso. Forçar a aprovação de um projeto impediria parentes de ocupantes de cargos de sucedê-los, quebrando o domínio dos clãs provinciais sobre a política nacional e abrindo a liderança de todos os partidos a candidatos de fora das grandes famílias."
 PHI_corruption_battle_mechanic_category: "A Batalha contra a Corrupção"
 PHI_corruption_battle_mechanic_category_desc: "Décadas de política clientelista, instituições fracas e interesses arraigados deixaram a corrupção profundamente enraizada em quase todos os níveis do governo. Erradicá-la exigirá investigações sustentadas e direcionadas na burocracia, nas forças armadas e no setor privado. À medida que as reformas se firmam e as instituições se fortalecem, as investigações futuras se tornarão mais fáceis e eficazes.\n\nNível Atual de Corrupção:  [Root.GetPHI_corruption_tier_number]\nForça Atual da Corrupção: [?PHI_corruption_strength|Y0]"
 PHI_change_the_strength_of_corruption_tt: "§YForça da Corrupção§! muda em [?temp_change|0+] (Atual: [?PHI.PHI_corruption_strength|Y0])\n"
 PHI_corp_nothing_tt: "§R75%§!: Nada acontece / falha burocrática.\nSem progresso contra a corrupção."
 PHI_corp_minor_tt: "§Y65%§!: Pequeno esquema de corrupção descoberto.\n§G-5§! de progresso da corrupção."
 PHI_corp_major_tt: "§Y35%§!: Escândalo corporativo de grande escala.\n§G-10§! de progresso da corrupção. §R-2%§! de estabilidade."
 PHI_corp_huge_tt: "§G10%§!: Corrupção de alto valor descoberta.\n§G-20§! de progresso da corrupção. §R-5%§! de indústria por 180 dias."
 PHI_contracts_nothing_tt: "§R70%§!: Nenhuma evidência encontrada.\nSem mudança."
 PHI_contracts_minor_tt: "§Y55%§!: Pequena má gestão exposta.\n§G-5§! de progresso da corrupção."
 PHI_contracts_major_tt: "§Y30%§!: Grande corrupção em compras públicas.\n§G-10§! de progresso da corrupção. §R-3%§! de velocidade de construção."
 PHI_contracts_huge_tt: "§G15%§!: Desvio nacional de recursos revelado.\n§G-20§! de progresso da corrupção. §R-2%§! de estabilidade."
 PHI_tax_nothing_tt: "§R80%§!: Nenhuma conclusão definitiva.\nSem mudança."
 PHI_tax_minor_tt: "§Y50%§!: Pequeno caso de suborno descoberto.\n§G-5§! de progresso da corrupção."
 PHI_tax_major_tt: "§Y25%§!: Esquema de fraude alfandegária exposto.\n§G-10§! de progresso da corrupção. §R-10%§! de receita de impostos por 2 meses."
 PHI_tax_huge_tt: "§G10%§!: Altos funcionários implicados.\n§G-25§! de progresso da corrupção. §R-15%§! de investimento estrangeiro por 6 meses."
 PHI_military_nothing_tt: "§R80%§!: Sem evidências ou acobertado.\nSem mudança."
 PHI_military_minor_tt: "§Y60%§!: Oficiais de baixa patente flagrados.\n§G-5§! de progresso da corrupção."
 PHI_military_major_tt: "§Y25%§!: Estado-maior implicado.\n§G-10§! de progresso da corrupção. §R-3%§! de organização do exército por 90 dias."
 PHI_military_huge_tt: "§G10%§!: Figura militar de alto escalão exposta.\n§G-20§! de progresso da corrupção. §R-5%§! de estabilidade. §R-5§! de experiência do exército."
 PHI_purge_nothing_tt: "§R70%§!: Nenhum resultado significativo.\nSem mudança."
 PHI_purge_minor_tt: "§Y60%§!: Rede de desvios de pequena escala descoberta.\n§G-5§! de progresso da corrupção."
 PHI_purge_major_tt: "§Y35%§!: Grande sindicato local exposto.\n§G-10§! de progresso da corrupção. §R+1%§! de alvo de resistência."
 PHI_purge_huge_tt: "§G10%§!: Dinastia política derrubada.\n§G-20§! de progresso da corrupção. §R+2%§! de alvo de resistência. §G+3%§! de estabilidade após 90 dias."
 PHI_offshore_nothing_tt: "§R85%§!: Nenhum rastro encontrado.\nSem mudança."
 PHI_offshore_minor_tt: "§Y50%§!: Pequenas contas rastreadas.\n§G-5§! de progresso da corrupção."
 PHI_offshore_major_tt: "§Y20%§!: Grande rede de lavagem de dinheiro encontrada.\n§G-25§! de progresso da corrupção."
 PHI_offshore_huge_tt: "§G5%§!: Fortuna offshore descoberta.\n§G-40§! de progresso da corrupção. §G-10%§! de custo de investimento estrangeiro por 6 meses."
 PHI_investigate_corporations: "Investigar Corporações"
 PHI_investigate_corporations_desc: "Grandes conglomerados filipinos há muito desfrutam de relações cômodas com reguladores e legisladores. Uma investigação focada na contabilidade corporativa, nas declarações fiscais e nos contratos governamentais pode expor esquemas de suborno e desvio de recursos, embora o resultado dependa de quão arraigada a corrupção está atualmente.\n\nNível Atual de Corrupção: [ROOT.GetPHI_corruption_tier_number]"
 PHI_audit_government_contracts: "Auditar Contratos do Governo"
 PHI_audit_government_contracts_desc: "Contratos de infraestrutura pública e de compras são notórias fontes de desvios, com propinas e notas fiscais superfaturadas drenando recursos de projetos públicos. Uma auditoria minuciosa dos contratos recentes pode revelar negócios fraudulentos, embora funcionários com algo a esconder resistam ao escrutínio.\n\nNível Atual de Corrupção: [ROOT.GetPHI_corruption_tier_number]"
 PHI_inspect_tax_bureau: "Inspecionar a Receita Federal"
 PHI_inspect_tax_bureau_desc: "O Bureau de Receita Interna tem sido assolado por denúncias de suborno, acordos por baixo dos panos e registros falsificados. Uma inspeção interna poderia recuperar receita perdida e extirpar agentes corruptos, embora a própria corrupção do bureau possa proteger os piores infratores.\n\nNível Atual de Corrupção: [ROOT.GetPHI_corruption_tier_number]"
 PHI_investigate_the_military: "Investigar os Militares"
 PHI_investigate_the_military_desc: "Escândalos de compras e soldados fantasmas há muito drenam o orçamento das Forças Armadas das Filipinas. Investigar as finanças militares arrisca atritos com o corpo de oficiais, mas inquéritos bem-sucedidos podem recuperar fundos desviados e restaurar a disciplina nas fileiras.\n\nNível Atual de Corrupção: [ROOT.GetPHI_corruption_tier_number]"
 PHI_purge_local_officials: "Expurgar Autoridades Locais"
 PHI_purge_local_officials_desc: "As unidades de governo local, das capitais provinciais às prefeituras de barangay, são frequentemente dominadas por dinastias políticas que tratam o cargo público como negócio de família. Um expurgo direcionado de autoridades locais corruptas pode quebrar seu domínio do poder, embora as dinastias entrincheiradas possam resistir com tudo o que têm.\n\nNível Atual de Corrupção: [ROOT.GetPHI_corruption_tier_number]"
 PHI_trace_offshore_accounts: "Rastrear Contas Offshore"
 PHI_trace_offshore_accounts_desc: "A riqueza ilícita de décadas de desvios muitas vezes foi canalizada para contas offshore e empresas de fachada no exterior. Rastrear essas contas é lento, caro e diplomaticamente delicado, mas um rastreamento bem-sucedido pode recuperar somas vastas e desferir um golpe severo nas redes que as construíram.\n\nNível Atual de Corrupção: [ROOT.GetPHI_corruption_tier_number]"
 PHI_police_investiture: "Investiduras Policiais"
 PHI_police_investiture_desc: "Redirecionar recursos do governo para fortalecer a Polícia Nacional Filipina, melhorando a eficácia dos investigadores ao custo de maiores despesas com policiamento."
 PHI_police_investiture_active_tt: "O aumento do financiamento policial está ativo. Todas as investigações anticorrupção têm maiores chances de sucesso.\n§R+20%§! de custo policial. §R-15§! de poder de comando máximo."
 PHI_corporate_scandal_industry: "Escândalo Corporativo"
 PHI_corporate_scandal_industry_desc: "A exposição de corrupção corporativa de alto valor abalou a confiança dos investidores em nosso setor industrial."
 PHI_procurement_scandal_construction: "Escândalo de Compras Públicas"
 PHI_procurement_scandal_construction_desc: "A descoberta de grande corrupção em contratos do governo retardou as obras, enquanto os contratos são revisados."
 PHI_customs_fraud_tax: "Fraude Alfandegária Exposta"
 PHI_customs_fraud_tax_desc: "Um esquema de fraude alfandegária prejudicou a arrecadação de impostos enquanto o órgão é reestruturado."
 PHI_tax_scandal_investment: "Escândalo na Receita"
 PHI_tax_scandal_investment_desc: "A corrupção de alto escalão na receita afugentou investidores estrangeiros."
 PHI_military_scandal_org: "Escândalo de Corrupção Militar"
 PHI_military_scandal_org_desc: "A corrupção no estado-maior perturbou as estruturas de comando e a coesão das unidades."
 PHI_offshore_fortune_investment: "Fundos Offshore Recuperados"
 PHI_offshore_fortune_investment_desc: "Os ativos offshore apreendidos foram reinvestidos, abrindo novos canais de investimento estrangeiro."
 PHI_locked_corruption: "Corrupção Arraigada"
 PHI_locked_corruption_desc: "§RNão é possível alterar as leis de corrupção manualmente§!\nAnos de política clientelista, ineficiência burocrática e interesses especiais arraigados deixaram a corrupção entranhada no tecido do Estado filipino. Recursos públicos são rotineiramente desviados, a responsabilização permanece fraca e figuras poderosas continuam a se beneficiar do status quo. Uma reforma significativa não pode ser alcançada apenas por decreto. A luta contra a corrupção exigirá investigações determinadas, instituições mais fortes e um governo disposto a desafiar aqueles que lucram com o sistema. "
 PHI_corruption_eradicated: "Governança Limpa"
 PHI_corruption_eradicated_desc: "Após anos de reformas sustentadas, as Filipinas alcançaram algo raro em sua história: um governo que funciona com verdadeira integridade. As instituições estão mais fortes, a confiança pública foi restaurada e o ciclo de desvios foi quebrado, por ora. Manter esse padrão exigirá vigilância contínua."
 PHI_corruption_event.1.t: "Nível de Corrupção Reduzido"
 PHI_corruption_event.1.d: "Nossos esforços incansáveis deram frutos. As redes corruptas foram desmanteladas e um novo nível de responsabilização foi estabelecido."
 PHI_corruption_event.1.a: "Progresso, enfim."
 PHI_corruption_event.2.t: "A Corrupção Piora"
 PHI_corruption_event.2.d: "Apesar de nossos esforços, as forças corruptas consolidaram seu domínio. O suborno e o desvio de recursos se espalharam ainda mais pelas instituições do Estado."
 PHI_corruption_event.2.a: "Precisamos fazer melhor."
 PHI_corruption_event.10.t: "Investigação: Suspeita de Acobertamento"
 PHI_corruption_event.10.d: "Nossos investigadores toparam com um muro de advogados, documentos lacrados e perdas súbitas de memória. Alguém poderoso está apagando seus rastros, mas não podemos provar."
 PHI_corruption_event.10.a: "Continuar de olho neles."
 PHI_corruption_event.11.t: "Investigação: Esquema de Corrupção Descoberto"
 PHI_corruption_event.11.d: "Um esquema de corrupção de nível médio, que operava no setor privado, foi exposto. Vários executivos enfrentam acusações e parte dos fundos desviados foi recuperada."
 PHI_corruption_event.11.a: "Processá-los."
 PHI_corruption_event.12.t: "Investigação: Escândalo Corporativo Descoberto"
 PHI_corruption_event.12.d: "Um enorme escândalo corporativo abalou o setor empresarial. Executivos conspiraram com funcionários do Estado para desviar fundos públicos. As consequências abalaram a confiança dos investidores."
 PHI_corruption_event.12.a: "Confiscar seus bens."
 PHI_corruption_event.13.t: "Investigação: Corrupção de Alto Valor Exposta"
 PHI_corruption_event.13.d: "Uma descoberta extraordinária: uma teia de corrupção corporativa de alto valor, que chega ao topo do setor privado, foi totalmente exposta. Bilhões em ativos estão sendo confiscados."
 PHI_corruption_event.13.a: "Isso não será esquecido."
 PHI_corruption_event.20.t: "Auditoria: Nenhuma Evidência Encontrada"
 PHI_corruption_event.20.d: "A auditoria não revelou nada aproveitável. Todos os contratos estavam em ordem no papel. Ou as contas estão limpas, ou alguém as limpou antes de chegarmos."
 PHI_corruption_event.20.a: "Nós tentamos."
 PHI_corruption_event.21.t: "Auditoria: Má Gestão Exposta"
 PHI_corruption_event.21.d: "Os auditores descobriram contabilidade desleixada e notas fiscais infladas em vários departamentos. Os fundos mal geridos foram recuperados."
 PHI_corruption_event.21.a: "Responsabilizá-los."
 PHI_corruption_event.22.t: "Auditoria: Corrupção em Compras Públicas Descoberta"
 PHI_corruption_event.22.d: "Um esquema arraigado de compras públicas foi desmascarado. Funcionários concediam contratos sistematicamente a empresas de fachada em troca de propinas."
 PHI_corruption_event.22.a: "Desmantelar a rede."
 PHI_corruption_event.23.t: "Auditoria: Desvio Nacional de Recursos Revelado"
 PHI_corruption_event.23.d: "Um esquema de desvio impressionante, que se estende por vários ministérios, foi descoberto. A escala do roubo aos cofres públicos é um escândalo nacional."
 PHI_corruption_event.23.a: "Isso acaba agora."
 PHI_corruption_event.30.t: "Inspeção Fiscal: Nada Encontrado"
 PHI_corruption_event.30.d: "Os inspetores não encontraram provas concretas de irregularidades. Os agentes foram cooperativos e os registros pareciam em ordem. A investigação se encerra sem resultado."
 PHI_corruption_event.30.a: "De volta ao trabalho."
 PHI_corruption_event.31.t: "Inspeção Fiscal: Suborno Descoberto"
 PHI_corruption_event.31.d: "Vários agentes fiscais de baixo escalão foram flagrados aceitando propina para reduzir cobranças. Eles foram demitidos e os impostos atrasados foram recuperados."
 PHI_corruption_event.31.a: "Limpar a casa."
 PHI_corruption_event.32.t: "Inspeção Fiscal: Fraude Alfandegária Exposta"
 PHI_corruption_event.32.d: "Um sofisticado esquema de fraude alfandegária foi desmantelado. Contrabandistas subornavam agentes graduados para liberar, por anos, carregamentos sem pagar imposto."
 PHI_corruption_event.32.a: "Reformar o órgão."
 PHI_corruption_event.33.t: "Inspeção Fiscal: Altos Funcionários Implicados"
 PHI_corruption_event.33.d: "Altos funcionários da Receita Interna foram implicados em um esquema sistêmico de corrupção. O escândalo alarmou investidores estrangeiros e abalou a confiança pública."
 PHI_corruption_event.33.a: "Processar todos eles."
 PHI_corruption_event.40.t: "Inquérito Militar: Provas Acobertadas"
 PHI_corruption_event.40.d: "Os militares fecharam fileiras. Nossos investigadores encontraram obstrução em todos os níveis. Se há corrupção, ela foi enterrada bem fundo."
 PHI_corruption_event.40.a: "Voltaremos."
 PHI_corruption_event.41.t: "Inquérito Militar: Oficiais Flagrados"
 PHI_corruption_event.41.d: "Vários oficiais de baixa patente foram flagrados desviando cotas de combustível e equipamentos para ganho pessoal. Eles foram levados à corte marcial."
 PHI_corruption_event.41.a: "Justiça feita."
 PHI_corruption_event.42.t: "Inquérito Militar: Estado-Maior Implicado"
 PHI_corruption_event.42.d: "Membros do estado-maior foram implicados em um esquema de corrupção envolvendo contratos de compras de defesa. O escândalo perturbou a cadeia de comando."
 PHI_corruption_event.42.a: "Expurgar as fileiras."
 PHI_corruption_event.43.t: "Inquérito Militar: Figura de Alto Escalão Exposta"
 PHI_corruption_event.43.d: "Uma figura militar de alto escalão foi publicamente exposta por desviar verbas de defesa durante muitos anos. A revelação chocou as forças armadas e o público."
 PHI_corruption_event.43.a: "Ninguém está acima da lei."
 PHI_corruption_event.50.t: "Expurgo: Nenhum Resultado Significativo"
 PHI_corruption_event.50.d: "As autoridades locais mantiveram a cabeça baixa e o expurgo encontrou pouco com que agir. Ou as redes se calaram, ou foram avisadas com antecedência."
 PHI_corruption_event.50.a: "Tentaremos de novo."
 PHI_corruption_event.51.t: "Expurgo: Rede de Desvios Encontrada"
 PHI_corruption_event.51.d: "Uma rede de desvios de pequena escala, que operava a partir da burocracia local, foi desmantelada. Um punhado de funcionários foi afastado de seus cargos."
 PHI_corruption_event.51.a: "Já vão tarde."
 PHI_corruption_event.52.t: "Expurgo: Sindicato Local Exposto"
 PHI_corruption_event.52.d: "Um grande sindicato local, infiltrado no governo regional, foi exposto. Sua remoção perturbou as estruturas de poder locais e provocou agitação."
 PHI_corruption_event.52.a: "A estabilidade virá."
 PHI_corruption_event.53.t: "Expurgo: Dinastia Política Derrubada"
 PHI_corruption_event.53.d: "Uma dinastia política arraigada, que controlava o governo local havia décadas, foi derrubada. Seus bens foram confiscados, embora os leais a ela continuem inquietos."
 PHI_corruption_event.53.a: "Uma nova era começa."
 PHI_corruption_event.60.t: "Rastreamento Offshore: Nenhuma Pista Encontrada"
 PHI_corruption_event.60.d: "Nossos investigadores financeiros chegaram a um beco sem saída. Cada pista se dissolveu em empresas de fachada anônimas em várias jurisdições. O dinheiro sumiu."
 PHI_corruption_event.60.a: "Perdemos o rastro."
 PHI_corruption_event.61.t: "Rastreamento Offshore: Contas Menores Encontradas"
 PHI_corruption_event.61.d: "Várias contas offshore menores ligadas a funcionários do governo foram identificadas e congeladas. Os valores são modestos, mas o precedente é significativo."
 PHI_corruption_event.61.a: "Congelar tudo."
 PHI_corruption_event.62.t: "Rastreamento Offshore: Rede de Lavagem Exposta"
 PHI_corruption_event.62.d: "Uma importante rede de lavagem de dinheiro, que movimentava fundos por contas offshore, foi desmantelada. Uma quantia significativa foi repatriada para o tesouro filipino."
 PHI_corruption_event.62.a: "Trazer de volta para casa."
 PHI_corruption_event.63.t: "Rastreamento Offshore: Fortuna Offshore Descoberta"
 PHI_corruption_event.63.d: "Uma descoberta extraordinária: uma vasta fortuna offshore pertencente a altos funcionários foi descoberta e confiscada. O ganho inesperado é histórico e envia uma mensagem poderosa."
 PHI_corruption_event.63.a: "O povo saberá."
 PHI_corruption_event.99.t: "Confiança Pública Restaurada"
 PHI_corruption_event.99.d: "Com a antiga dinastia política afastada do poder, as comunidades locais reconstroem lentamente a confiança em suas instituições. Um sentimento de otimismo cauteloso toma conta."
 PHI_corruption_event.99.a: "O povo está conosco."
 PHI_corruption_event.100.t: "Conseguimos"
 PHI_corruption_event.100.d: "Após anos de investigações, processos e reformas institucionais meticulosos, nossa campanha anticorrupção alcançou um marco que poucos acreditavam possível. As redes arraigadas de desvios e clientelismo que outrora paralisavam nosso governo foram desmanteladas. As Filipinas estão no limiar de uma nova era, definida não pelo que os funcionários roubam, mas pelo que constroem."
 PHI_corruption_event.100.a: "Uma nova Filipinas começa hoje."
 PHI_corruption_event.200.t: "Escândalo de Lobby Corporativo"
 PHI_corruption_event.200.d: "Circulam rumores de que um grande conglomerado usou doações secretas para influenciar a legislação recente. O público está de olho, e a oposição sente cheiro de sangue."
 PHI_corruption_event.200.a: "Ignorar. Não podemos lutar contra todos."
 PHI_corruption_event.200.b: "Lançar uma auditoria limitada."
 PHI_corruption_event.200.c: "Condená-los publicamente."
 PHI_corruption_event.201.t: "Projetos Fantasmas"
 PHI_corruption_event.201.d: "Um relatório parlamentar encontrou vários projetos de infraestrutura financiados pelo Estado sem qualquer sinal de conclusão: nenhuma estrada construída, nenhum prédio erguido, nenhum trabalhador contratado. O dinheiro simplesmente sumiu."
 PHI_corruption_event.201.a: "Varrer para debaixo do tapete."
 PHI_corruption_event.201.b: "Culpar as autoridades locais."
 PHI_corruption_event.201.c: "Abrir um inquérito oficial."
 PHI_corruption_event.202.t: "Vazamento Fiscal"
 PHI_corruption_event.202.d: "Um denunciante apresentou provas de que altos funcionários do governo vêm sonegando impostos por meio de uma rede de empresas de fachada falsas. Os documentos já circulam na imprensa."
 PHI_corruption_event.202.a: "Resolver isso discretamente."
 PHI_corruption_event.202.b: "Fazer deles um exemplo."
 PHI_corruption_event.202.c: "Oferecer clemência em troca de cooperação."
 PHI_corruption_event.203.t: "Fraude em Compras Militares"
 PHI_corruption_event.203.d: "As investigações revelaram carregamentos de armas desaparecidos, destinados às Forças Armadas das Filipinas. As notas foram assinadas, as entregas foram registradas, mas o equipamento não é encontrado em lugar nenhum."
 PHI_corruption_event.203.a: "Rejeitar as acusações."
 PHI_corruption_event.203.b: "Punir alguns bodes expiatórios."
 PHI_corruption_event.203.c: "Abrir um inquérito completo."
 PHI_corruption_event.204.t: "Redes de Máfia Provinciais"
 PHI_corruption_event.204.d: "Relatórios de inteligência policial confirmaram o que muitos moradores já sabiam: vários funcionários provinciais e de barangays cooperam ativamente com sindicatos do crime organizado. Dinheiro de proteção troca de mãos em todos os níveis."
 PHI_corruption_event.204.a: "Ignorar."
 PHI_corruption_event.204.b: "Prendê-los publicamente."
 PHI_corruption_event.204.c: "Substituí-los por aliados leais."
 PHI_corruption_event.205.t: "Esquema de Propinas Estrangeiras"
 PHI_corruption_event.205.d: "Surgiram provas de que empresas estrangeiras de construção e energia subornaram altos funcionários para obter lucrativos contratos governamentais. O rastro de papéis leva até a capital."
 PHI_corruption_event.205.a: "Negar tudo."
 PHI_corruption_event.205.b: "Sancioná-las discretamente."
 PHI_corruption_event.205.c: "Fazer um exemplo público."
 PHI_corruption_event.206.t: "Podridão Burocrática"
 PHI_corruption_event.206.d: "A corrupção miúda tornou-se cada vez mais normalizada nas repartições do governo. Os escriturários esperam envelopes. Os fiscais precisam ser persuadidos. As licenças têm um preço além da taxa oficial. A cultura das pequenas corrupções está corroendo a confiança institucional."
 PHI_corruption_event.206.a: "Deixá-los com suas pequenas regalias."
 PHI_corruption_event.206.b: "Emitir reformas simbólicas."
 PHI_corruption_event.206.c: "Remanejar vários funcionários."
