name: Issue Triage

on:
  issues:
    types: [opened, transferred]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  triage:
    name: Issue triage
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        uses: >-
          actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd
        with:
          project-url: https://github.com/orgs/MillenniumDawn/projects/3
          github-token: ${{ secrets.PROJECT_PAT }}

      - name: Default issue type to Task
        uses: >-
          actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              if (issue.data.type) {
                console.log(
                  `Issue #${context.issue.number} already has type: ` +
                  issue.data.type.name
                );
                return;
              }

              // Let the bot type issues marked from-discord.
              const labels = (issue.data.labels || []).map(l =>
                typeof l === 'string' ? l : l.name
              );
              if (labels.includes('from-discord')) {
                console.log(
                  `Issue #${context.issue.number} is bot-owned ` +
                  '(from-discord); leaving type to the bot.'
                );
                return;
              }

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                type: 'Task',
              });

              console.log(`Set type to Task on issue #${context.issue.number}`);
            } catch (err) {
              core.warning(
                `default-type skipped for #${context.issue.number}: ` +
                err.message
              );
            }

      - name: Checkout composite action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Assign milestone
        uses: ./.github/actions/assign-milestone
        with:
          issue-number: ${{ github.event.issue.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
