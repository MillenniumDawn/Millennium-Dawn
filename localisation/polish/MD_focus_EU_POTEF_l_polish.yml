 POTEF_special_forces_doctrine_desc: "The §YBaltic countries§! traditionally focused on small and highly capable Special Forces. With the Special Forces Doctrine all member states can adopt this tradition and tactics."
 POTEF_extensive_special_forces_doctrine: "Rozległa doktryna sił specjalnych"
 POTEF_extensive_special_forces_doctrine_desc: "§YKraje bałtyckie§! tradycyjnie skupiały się na małych i wysoce zdolnych siłach specjalnych. Dzięki Doktrynie Sił Specjalnych wszystkie państwa członkowskie mogą przyjąć tę tradycję i taktykę."
 EU_POTEF_environmental_imperialism_decision: "Domagaj się reform środowiskowych"
 EU_POTEF_environmental_imperialism_decision_desc: "Musimy ocalić planetę. Jeśli §Y[FROM.GetNameWithFlag]§! nie przeprowadza niezbędnych §GReform środowiskowych§! sami, musimy ich do tego zmusić. Muszą mieć przynajmniej jedną §YRafinerię Biopaliw§! dla każdego stanu, jaki posiadają. Jeśli §Y[FROM.GetNameWithFlag]§! nie spełni naszych żądań w ciągu miesiąca, nałożymy §RESankcje środowiskowe§! na nich."
 EU_POTEF_environmental_imperialism_mission: "Reformy środowiskowe"
 EU_POTEF_environmental_imperialism_mission_desc: "§YEuropa§! żąda §GReform środowiskowych§! od nas, aby ocalić planetę. Jeśli nie zbudujemy lub nie wybudujemy chociaż jednej §YRafinerii Biopaliw§! na każdy stan, który będziemy posiadać w ciągu miesiąca, nałożą §REsankcje środowiskowe§! odpowiedzialność."
 EU_POTEF_environmental_imperialism_restructure_industry_decision: "Rekonstrukcja zielonej energii"
 EU_POTEF_environmental_imperialism_restructure_industry_decision_desc: "Aby wypełnić europejską §GReformę ochrony środowiska§! żąda, abyśmy zrekonstruowali część naszego §YPrzemysłu Cywilnego§! producentowi energii odnawialnej (§YBiofuel Rafineria§!)."
 EU_POTEF_break_environmental_sanctions_decision: "Złamać sankcje środowiskowe"
 EU_POTEF_break_environmental_sanctions_decision_desc: "Europe has imposed Environmental Sanctions on us. We need to break them with all means - political and military. But this will give [FROM.GetNameWithFlag] a war goal on us. So we need to ally with other countries sanctioned by [FROM.GetNameWithFlag]."
 EU_POTEF_call_all_major_non_EU_ally: "Zadzwoń do wszystkich głównych sojuszników EDU spoza UE"
 EU_POTEF_call_all_major_non_EU_ally_desc: "EDU zostaje zaatakowane. Czas aktywować sojusz obronny i wezwać wszystkich sojuszników EDU spoza UE."
 EU_POTEF_call_major_non_EU_ally: "Zadzwoń do [FROM.GetName] do EDU"
 EU_POTEF_call_major_non_EU_ally_desc: "Zadzwoń do głównego sojusznika EDU spoza UE §Y[FROM.GetNameWithFlag]§!."
 focus_POTEF301_effect_tt: "Każdy członek Unii Europejskiej §Poprawi opinię o +25§! ze wszystkimi krajami łacińskimi.\n"
 focus_POTEF502_effect_tt: "Każdy członek Unii Europejskiej §Poprawi opinię o +30§! z kolejnymi krajami: [KAZ.GetNameWithFlag], [KYR.GetNameWithFlag], [TAJ.GetNameWithFlag], [UZB.GetNameWithFlag], [TRK.GetNameWithFlag], [PER.GetNameWithFlag], [TUR.GetNameWithFlag], [GRE. GetNameWithFlag].\nRównież wpływ [CHI.GetFlag][CHI.GetAdjective] zostanie §Gzmniejszony§! w tych krajach.\n"
 tooltip_focus_POTEF203_trigger: "Należy do frakcji §YEuropejska Unia Obrony§!"
