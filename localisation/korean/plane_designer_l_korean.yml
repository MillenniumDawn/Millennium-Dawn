 gen_7_light: "7세대 경전투기"
 gen_7_light_desc: "7세대 기체는 공중전의 초첨단 실험 기술입니다. 설계와 제조에 많은 비용이 들며, 최첨단 스텔스 소재, 항전 장비, 드론 윙맨, 정밀 무기 체계 등을 포함합니다."
 gen_8_light: "8세대 경전투기"
