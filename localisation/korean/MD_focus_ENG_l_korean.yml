 ENG_celsa_steel_idea: "셀사 스틸 제휴"
 ENG_celsa_steel_idea_desc: "셀사의 카디프 제강소와의 장기 제휴로 재활용 고철이 새 강철로 꾸준히 공급되어 자원 산출량이 개선되고, 매년 생산량을 더 늘릴 수 있는 여력을 얻습니다."
