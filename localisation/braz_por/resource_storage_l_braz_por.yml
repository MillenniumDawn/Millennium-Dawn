 OPEN_STORAGE_BUTTON_TT: "Abre o menu de §Y Armazenamento de Recursos §! onde você pode ver quantos recursos estão atualmente em suas §Y Reservas Estratégicas de Recursos §!.\n\nOBSERVAÇÃO: §Y Armazenamento de Recursos §! possui uma limitação do motor do jogo que faz com que, se você estiver em uma §Y Economia de Exportação §! ou em uma §Y Economia de Comércio Globalizado §!, você possa acabar enviando mais recursos para exportação do que para suas linhas de produção necessárias. Se precisar começar a retirar recursos do armazenamento, é recomendável mudar para uma §Y Economia Mista §! ou inferior.\n"
