l_french:
 RULE_ZOMBIE_DIFFICULTY: "Difficulté du mode de jeu Zombie"
 RULE_ZOMBIE_DIFFICULTY_NORMAL: "Normal"
 RULE_ZOMBIE_DIFFICULTY_NORMAL_DESC: "Les zombies disposent de 4 millions de zombies au début de la partie."
 RULE_ZOMBIE_DIFFICULTY_HARD: "Difficile"
 RULE_ZOMBIE_DIFFICULTY_HARD_DESC: "Les zombies disposent de 9 millions de zombies au début de la partie."
 RULE_ZOMBIE_DIFFICULTY_EXTREME: "Extrême"
 RULE_ZOMBIE_DIFFICULTY_EXTREME_DESC: "Les zombies disposent de 13,5 millions de zombies au début de la partie."
 RULE_ZOMBIE_DIFFICULTY_INSANE: "Insensé"
 RULE_ZOMBIE_DIFFICULTY_INSANE_DESC: "Les zombies disposent de 37 millions de zombies et de bonus d'attaque et de défense au début de la partie."
 RULE_ZOMBIE_GAME_MODE: "Activer le mode de jeu Zombie"
 RULE_ZOMBIE_GAME_MODE_NO_DESC: "Le mode de jeu Zombie ne sera pas activé."
 RULE_ZOMBIE_GAME_MODE_YES_DESC: "Le mode de jeu Zombie sera activé. Tout le contenu de Millennium Dawn existera toujours, gardez cela à l'esprit. Si vous voulez jouer en tant que Zombies, commencez en Inde."
 zombie: "Virus zombie"
 zombie_desc: "Le virus transforme des humains inoffensifs en monstres."
 zombie_0: "Virus zombie"
 zombie_0_desc: "Le virus transforme des humains inoffensifs en monstres."
 Zombie: "Zombies"
 Zombie_desc: "Le seul but d'un zombie est de manger des humains."
 better_instincts: "Un meilleur instinct"
 better_instincts_desc: "Les zombies ont développé des méthodes de mise à mort plus efficaces."
 shock_and_zombie_awe: "La panique..."
 shock_and_zombie_awe_desc: "La panique s'empare de la population. Personne n'aurait pu se préparer aux zombies ni à la vitesse avec laquelle ils ont submergé les positions militaires. Les défenses désespérées s'effondrent à mesure que la confiance en la survie s'érode."
 zombie.1.t: "Le virus se propage en Angleterre"
 zombie.1.d: "La Manche n'est pas un obstacle pour la peste implacable. Des réfugiés infectés s'échouent sur les falaises blanches de Douvres, et les rues animées de Londres tombent étrangement silencieuses alors que le virus déchire le cœur de l'Empire. La forteresse insulaire britannique devient une prison alors que les morts commencent à marcher."
 zombie.1.a: "Grrr!"
 zombie.2.t: "Le virus se propage en Irlande"
 zombie.2.d: "La mer d'Irlande ne constitue pas une barrière contre la peste des morts-vivants. Des bateaux de pêche reviennent au port avec plus que leur prise, et les villes côtières tombent une à une. L'infection se propage à l'intérieur des terres depuis Dublin et Cork, consumant l'Île d'Émeraude dans une vague de cadavres titubants."
 zombie.2.a: "Nom, nom, nom."
 zombie.3.t: "Le virus se propage aux États-Unis"
 zombie.3.d: "Malgré des mesures de quarantaine désespérées, des réfugiés infectés fuyant l'Europe ont apporté la peste de l'autre côté de l'Atlantique. Les grands ports de la côte Est signalent des épidémies, et l'infection se propage vers l'ouest à une vitesse terrifiante. Le rêve américain devient un cauchemar de morts-vivants."
 zombie.3.a: "Braaaaiiiinnssss..."
 zombie.4.t: "Le virus se propage au Japon"
 zombie.4.d: "Le pays du Soleil levant fait maintenant face à une armée qui ne connaît ni honneur ni pitié. Les rapports affluent de Tokyo, Osaka et d'autres centres de population alors que les villes densément peuplées deviennent des pièges mortels. Les temples anciens et les gratte-ciel modernes tombent sous la marée implacable des infectés."
 zombie.4.a: "Urrgh, kawaii..."
 zombie.5.t: "Le virus se propage en Australie"
 zombie.5.d: "Le vaste océan n'offre qu'un répit temporaire. Des navires de fret transportant des membres d'équipage infectés arrivent à Sydney et Melbourne, et l'épidémie déchire le continent. Même l'âpre Outback offre peu de refuge contre la peste qui se propage alors que le dernier bastion insulaire de l'humanité commence à tomber."
 zombie.5.a: "Raaargh..."
 zombie.6.t: "Le virus se propage en Nouvelle-Zélande"
 zombie.6.d: "Les îles reculées qui ont inspiré la Terre du Milieu font maintenant face à leur propre apocalypse. L'infection arrive par les airs et la mer, se propageant à travers Wellington et Auckland. L'isolement de la Nouvelle-Zélande, autrefois sa plus grande défense, signifie maintenant qu'il n'y a nulle part où fuir."
 zombie.6.a: "Urrrgh..."
 zombie.7.t: "Le virus se propage aux Philippines"
 zombie.7.d: "L'infection balaie l'archipel philippin comme une tempête tropicale. Des survivants sautant d'île en île transportent la peste de Luçon à Mindanao, et les milliers d'îles qui fournissaient autrefois des barrières naturelles deviennent des poches isolées d'horreur sans espoir d'échappatoire."
 zombie.7.a: "Mmmm... Nngh..."
 zombie.8.t: "La Horde Zombie"
 zombie.8.d: "Les morts marchent sur la Terre. La horde de zombies a jailli à travers le sous-continent indien et dévore rapidement notre population par l'infection et la prédation directe. Les experts ont nommé le conflit « l'Éclosion », mais la guerre pour la survie de l'humanité ne fait que commencer. Déjà, des nations désespérées ferment leurs frontières."
 zombie.8.a: "Envoyez les zombies au tombeau !"
 zombie.8.b: "Accepter le destin de l'humanité"
 zombie.9.t: "[FROM.GetName] demande de l'aide contre les zombies"
 zombie.9.d: "[FROM.GetName] a demandé de l'aide et tente d'enrôler toutes les grandes nations pour arrêter l'Éclosion. Répondrons-nous à l'appel, ou privilégierons-nous notre propre survie ?"
 zombie.9.a: "Rejoindre la coalition"
 zombie.9.b: "Putain ça ! Sauvez-vous!"
 RULE_ZOMBIE_JOINING_FACTION_GAME_MODE: "Faction de la Coalition anti-Zombies"
 RULE_ZOMBIE_JOINING_FACTION_NORMAL: "Comportement de faction par défaut"
 RULE_ZOMBIE_JOINING_FACTION_NORMAL_DESC: "Le comportement de faction est celui par défaut pour le mode de jeu."
 RULE_ZOMBIE_JOINING_FACTION_NO_MAJORS: "Pas de grandes puissances"
 RULE_ZOMBIE_JOINING_FACTION_NO_MAJORS_DESC: "Aucune grande puissance ne rejoindra la Coalition anti-Zombies."
 RULE_ZOMBIE_JOINING_FACTION_ALL_MAJORS: "Toutes les grandes puissances rejoignent la Coalition"
 RULE_ZOMBIE_JOINING_FACTION_ALL_MAJORS_DESC: "Toutes les grandes puissances rejoignent la Coalition anti-Zombies."
 zombie.10.t: "Épidémie！"
 zombie.10.d: "Le virus zombie s'est répandu sur nos terres et se propage désormais à travers [?var:random_outbreak_state.GetName]. La gravité de l'épidémie reste inconnue."
 zombie.10.a: "Mobiliser les troupes"
 zombie.11.t: "Épidémie dans [FROM.GetName]"
 zombie.11.d: "Une épidémie a éclaté en [FROM.GetName] et continue de s'aggraver rapidement. Le virus zombie se propage à une vitesse terrifiante, et la situation pourrait marquer le commencement de la fin."
 zombie.11.a: "Worrying..."
 zombie.11.b: "Raaargh..."
 RULE_ZOMBIE_SPAWN_LOCATION: "Lieu d'apparition des zombies"
 RULE_ZOMBIE_SPAWN_INDIA: "Inde (par défaut)"
 RULE_ZOMBIE_SPAWN_INDIA_DESC: "La Horde de zombies apparaît en Inde comme d'habitude."
 RULE_ZOMBIE_SPAWN_AFRICA: "Afrique centrale"
 RULE_ZOMBIE_SPAWN_AFRICA_DESC: "La Horde de zombies apparaît en Afrique centrale (région du Congo), ouvrant un nouveau front qui menace plus tôt l'Europe et le Moyen-Orient."
 RULE_ZOMBIE_SPAWN_EAST_ASIA: "Asie de l'Est"
 RULE_ZOMBIE_SPAWN_EAST_ASIA_DESC: "La Horde de zombies apparaît sur la côte chinoise, menaçant immédiatement l'Asie de l'Est, le Japon et le Pacifique."
 RULE_ZOMBIE_SPAWN_MULTIPLE: "Plusieurs emplacements"
 RULE_ZOMBIE_SPAWN_MULTIPLE_DESC: "La Horde de zombies apparaît simultanément en Inde, en Afrique centrale et en Asie de l'Est, avec des forces initiales plus petites à chaque emplacement."
 RULE_ZOMBIE_COALITION_ENABLED: "Faction de la coalition anti-zombies"
 RULE_ZOMBIE_COALITION_ENABLED_YES: "Activé (par défaut)"
 RULE_ZOMBIE_COALITION_ENABLED_YES_DESC: "La Coalition anti-zombies se forme normalement. Les grandes puissances seront invitées à rejoindre le combat contre la Horde."
 RULE_ZOMBIE_COALITION_ENABLED_NO: "Désactivé"
 RULE_ZOMBIE_COALITION_ENABLED_NO_DESC: "La Coalition anti-zombies ne se formera pas. Les nations devront survivre à l'épidémie seules, sans coalition organisée."
 RULE_ZOMBIE_COALITION_DELAY: "Délai d'apparition des zombies"
 RULE_ZOMBIE_COALITION_DELAY_NONE: "Aucun délai (par défaut)"
 RULE_ZOMBIE_COALITION_DELAY_NONE_DESC: "La Horde de zombies apparaît immédiatement au début de la partie."
 RULE_ZOMBIE_COALITION_DELAY_ONE_YEAR: "1 an"
 RULE_ZOMBIE_COALITION_DELAY_ONE_YEAR_DESC: "La Horde de zombies apparaît après un compte à rebours d'un an, donnant aux nations le temps de se préparer avant le début de l'épidémie."
 RULE_ZOMBIE_COALITION_DELAY_TWO_YEARS: "2 ans"
 RULE_ZOMBIE_COALITION_DELAY_TWO_YEARS_DESC: "La Horde de zombies apparaît après un compte à rebours de deux ans, donnant aux nations un temps significatif pour bâtir leurs économies et leurs armées."
 RULE_ZOMBIE_COALITION_DELAY_THREE_YEARS: "3 ans"
 RULE_ZOMBIE_COALITION_DELAY_THREE_YEARS_DESC: "La Horde de zombies apparaît après un compte à rebours de trois ans, donnant aux nations un temps de préparation étendu avant le début de l'épidémie."
 zombie_runner: "Souche de coureur"
 zombie_runner_desc: "Une mutation plus rapide et plus agressive du virus zombie. Les Coureurs se déplacent en essaims et submergent les défenses par la seule vitesse et le volume.\n\n§GConseil du concepteur : les Coureurs offrent une haute vitesse et une forte attaque souple dans une formation étroite. Utilisez-les pour exploiter les brèches et déborder l'infanterie, mais leur faible organisation, leur faible défense et leur capacité antichar négligeable rendent le combat soutenu coûteux.§!"
 zombie_runner_0: "Souche de coureur"
 zombie_runner_0_desc: "Une mutation plus rapide et plus agressive du virus zombie. Les Coureurs se déplacent en essaims et submergent les défenses par la seule vitesse et le volume."
 zombie_brute: "Souche brute"
 zombie_brute_desc: "Une souche lourdement mutée qui produit des zombies plus grands et plus résistants. Les Brutes encaissent des punitions terribles et percent les lignes défensives.\n\n§GConseil du concepteur : les Brutes offrent une haute défense, percée, force, et plus d'attaque dure que les autres souches. Utilisez-les comme troupes d'assaut lentes contre les positions durcies, mais leur faible vitesse, large largeur de combat et très fort besoin en main-d'œuvre limitent mobilité et effectifs.§!"
 zombie_brute_0: "Souche brute"
 zombie_brute_0_desc: "Une souche lourdement mutée qui produit des zombies plus grands et plus résistants. Les Brutes encaissent des punitions terribles et percent les lignes défensives."
 zombie.12.t: "Le virus se propage au Nigeria"
 zombie.12.d: "La peste a sauté à travers le continent. Les villes portuaires du golfe de Guinée rapportent des pertes massives alors que les infectés déferlent de la côte vers l'intérieur. La vaste population du Nigeria et ses centres urbains denses en font un terreau fertile pour l'horreur qui se répand. L'Afrique de l'Ouest ne sera peut-être plus jamais la même."
 zombie.12.a: "Reconnaître la menace"
 zombie.13.t: "Le virus se propage au Brésil"
 zombie.13.d: "L'Amazonie n'offre aucune barrière. L'infection émerge à São Paulo et Rio de Janeiro simultanément, déchirant les plus grandes villes d'Amérique du Sud à une vitesse terrifiante. Des millions de civils paniqués encombrent les autoroutes vers l'intérieur, emportant le virus avec eux sans le savoir."
 zombie.13.a: "Reconnaître la menace"
 zombie.14.t: "Le virus se propage en Turquie"
 zombie.14.d: "À cheval sur deux continents, la Turquie devient le pont entre l'infection orientale et l'Europe. Des foyers éclatent à Istanbul et Ankara tandis que les autorités s'efforcent de contenir ce qui devient rapidement incontrôlable. Le Bosphore, autrefois symbole de lien, ne porte plus que la mort."
 zombie.14.a: "Reconnaître la menace"
 zombie.15.t: "La Horde évolue"
 zombie.15.d: "Le virus change. Les éclaireurs rapportent une nouvelle race d'infectés dans nos rangs : des variantes plus rapides et plus sauvages qui se déplacent en meutes, et des spécimens plus grands et plus résistants qui ignorent les armes légères. La horde devient plus dangereuse de jour en jour."
 zombie.15.a: "Reconnaître l'évolution"
 ZOM_cure_developed: "Prototype de remède contre les zombies"
 ZOM_cure_developed_desc: "Nos scientifiques ont développé un traitement expérimental contre le virus zombie. Distribué via les chaînes d'approvisionnement de la coalition, le vaccin accorde à toutes les forces combattant les morts-vivants un avantage de combat marqué."
 ZOM_research_cure: "Développer un remède"
 ZOM_research_cure_desc: "La plus grande menace que l'humanité ait jamais affrontée exige notre plus grand effort scientifique. En mettant en commun nos ressources et notre expertise, nous pourrons peut-être développer un traitement ou un vaccin capable de renverser le cours de cette guerre. À l'achèvement, toutes les nations combattant la Horde recevront un bonus de combat."
 ZOM_establish_safe_zones: "Établir des zones de sécurité"
 ZOM_establish_safe_zones_desc: "Désigner et fortifier des zones sûres civiles pour protéger les non-combattants et maintenir l'ordre public. Des corridors d'évacuation organisés et des abris durcis gagneront du temps et stabiliseront le front intérieur."
 ZOM_develop_a_cure: "Développer un remède"
 ZOM_develop_a_cure_desc: "Financer et achever la décision Développer un traitement. En cas de succès, toutes les nations combattant la Horde reçoivent un bonus de combat contre les morts-vivants."
 ZOM_protect_civilian_population: "Protéger la population civile"
 ZOM_protect_civilian_population_desc: "Maintenir la stabilité au-dessus de 60 % pour assurer la sécurité civile et la cohésion sociétale."
 ZOM_global_mobilization: "Mobilisation mondiale"
 ZOM_global_mobilization_desc: "Faire croître la Coalition anti-zombies jusqu'à au moins 8 nations membres."
 ZOM_defeat_the_zombie_horde: "Vaincre la Horde de zombies"
 ZOM_defeat_the_zombie_horde_desc: "Éliminer la Horde de zombies et mettre fin à la menace pour l'humanité."
 the_horde_spreads: "La Horde se répand"
 ZOM_apocalypse_countdown_1yr: "L'épidémie approche"
 ZOM_apocalypse_countdown_1yr_desc: "Des rapports d'un pathogène mystérieux émergent à travers le globe. Les services de renseignement estiment un an avant que la situation ne devienne incontrôlable."
 ZOM_apocalypse_countdown_2yr: "L'épidémie approche"
 ZOM_apocalypse_countdown_2yr_desc: "D'inquiétants rapports de régions reculées décrivent un pathogène jamais vu. Les experts pensent que nous avons deux ans pour nous préparer avant qu'il n'atteigne une masse critique."
 ZOM_apocalypse_countdown_3yr: "L'épidémie approche"
 ZOM_apocalypse_countdown_3yr_desc: "Des incidents isolés de violence inexpliquée et de réanimation ont été signalés. Les scientifiques estiment trois ans avant que le virus ne mute vers sa forme finale, imparable."
 zombie_capitulation.1.t: "Le Dragon rouge s'effondre"
 zombie_capitulation.1.d: "La nation la plus peuplée de la Terre a été consumée. Les vastes armées de la Chine, sa Grande Muraille, sa population d'un milliard. Rien n'a compté. Pékin est tombé en quelques jours, Shanghai en quelques heures. La densité même des villes chinoises les a transformées en abattoirs, et désormais plus d'un milliard de cadavres marchent sous la bannière de la Horde. Si la Chine n'a pas tenu, quel espoir reste-t-il pour les autres ?"
 zombie_capitulation.1.a: "Accepter la perte"
 zombie_capitulation.1.b: "Se préparer au pire"
 zombie_capitulation.2.t: "La Russie tombe"
 zombie_capitulation.2.d: "Le plus grand pays de la Terre a succombé à la peste des morts-vivants. L'immensité de toundra gelée et de forêts denses de la Russie, autrefois vue comme une forteresse naturelle contre la Horde, s'est révélée sans effet face à un ennemi qui n'a pas froid, ne se fatigue pas et ne s'arrête pas. Les défenses de Moscou se sont effondrées, et le Kremlin se tait. La Horde commande désormais un territoire s'étendant de l'Europe au Pacifique."
 zombie_capitulation.2.a: "Accepter la perte"
 zombie_capitulation.2.b: "Se préparer au pire"
 zombie_capitulation.3.t: "Les États-Unis tombent"
 zombie_capitulation.3.d: "La dernière superpuissance est tombée. Les États-Unis, avec toute leur puissance militaire, leur arsenal nucléaire et leurs océans de séparation, n'ont pas pu arrêter la marée. La côte Est a été submergée d'abord, puis le cœur du pays, et enfin les derniers réduits des Rocheuses se sont tus. Les étoiles et les bandes ne flottent plus sur Washington. Pour beaucoup, cela marque la véritable fin de la civilisation humaine telle qu'on la connaissait."
 zombie_capitulation.3.a: "Accepter la perte"
 zombie_capitulation.3.b: "Se préparer au pire"
 zombie_countdown_decision_category: "Compte à rebours de l'apocalypse zombie"
 zombie_countdown_decision_category_desc: ""
 zombie_coalition_decision_category: "Décisions de la Horde"
 zombie_coalition_decision_category_desc: ""
 zombie.8.d.africa: "Les morts marchent sur la Terre. La Horde de zombies a éclaté en Afrique centrale et consume rapidement notre population par infection et prédation directe. Les experts ont nommé le conflit « L'Épidémie », mais la guerre pour la survie humaine ne fait que commencer. Déjà, des nations désespérées ferment leurs frontières."
 zombie.8.d.east_asia: "Les morts marchent sur la Terre. La Horde de zombies a émergé dans la péninsule coréenne et consume rapidement notre population par infection et prédation directe. Les experts ont nommé le conflit « L'Épidémie », mais la guerre pour la survie humaine ne fait que commencer. Déjà, des nations désespérées ferment leurs frontières."
 zombie.8.d.multiple: "Les morts marchent sur la Terre. La Horde de zombies a éclaté simultanément sur trois continents, frappant l'Inde, l'Afrique centrale et la péninsule coréenne à la fois, consumant rapidement notre population par infection et prédation directe. Les experts ont nommé le conflit « L'Épidémie », mais la guerre pour la survie humaine ne fait que commencer. Déjà, des nations désespérées ferment leurs frontières."
 zombie_capitulation.4.t: "L'épidémie prend fin"
 zombie_capitulation.4.d: "Contre toute attente, l'humanité a prévalu. La Horde de zombies a été brisée. Ses territoires libérés, ses essaims détruits, les derniers infectés mis au repos. Les villes cicatrisées par l'apocalypse commencent le long travail de reconstruction. Le monde a changé pour toujours, mais il endure."
 zombie_capitulation.4.a: "L’humanité perdure"
 ZOM_hold_the_line: "Tenir la ligne"
 ZOM_hold_the_line_desc: "Garder le contrôle de votre capitale jusqu'à ce que la Horde évolue. Si le siège du gouvernement tient encore après la première vague, l'espoir demeure."
 ZOM_sanctuary: "Sanctuaire"
 ZOM_sanctuary_desc: "Établir cinq zones sûres pour abriter les survivants. Murs, ordre et un endroit où fuir sont le seul refuge qui reste aux vivants."
 ZOM_sanctuary_completed_tt: "Établir 5 §Yzones sûres§!"
 ZOM_reclaim_the_cradle: "Reconquérir le berceau"
 ZOM_reclaim_the_cradle_desc: "Prendre le cœur de l'épidémie : la capitale de la Horde. Brûler le nid où la peste est née."
 ZOM_total_eradication: "Éradication totale"
 ZOM_total_eradication_desc: "Détruire la Horde de zombies et développer un traitement contre l'infection. La victoire sur le terrain compte peu tant que le contagion se répand encore dans le sang."
 ZOM_against_all_odds: "Contre toute attente"
 ZOM_against_all_odds_desc: "Vaincre la Horde de zombies en difficulté Extrême ou Insane. Face à des nombres écrasants, l'humanité a refusé de tomber."
 zombies: "Horde de zombies"
 zombies_desc: "Une masse de corps infectés poussée par la faim et l'instinct.\n\n§GConseil du concepteur : les Hordes de zombies offrent de grandes formations de première ligne rapidement entraînées, avec une forte récupération et une lourde attaque souple. Utilisez-les pour submerger les défenseurs par la masse, mais leur faible organisation, leur faible capacité antichar et leur fort besoin en main-d'œuvre rendent chaque horde peu maniable.§!"