 TT_ALG_SOCIAL_DEMOCRAT_WIN: "[socialism_L] doit remporter les élections libres"
 TT_ALG_POPULIST_WIN: "[Nat_Populism_L] doit remporter les élections libres"
 TT_ALG_ISLAMIST_WIN: "[Neutral_Muslim_Brotherhood_L] doit remporter les élections libres"
 TT_ALG_SOCIAL_DEMOCRAT_PATH_REQ: "[socialism_L] doit être le parti au pouvoir"
 TT_ALG_POPULIST_PATH_REQ: "[Nat_Populism_L] doit être le parti au pouvoir"
 TT_ALG_FEDERAL_PARTY_EXISTS: "Les fédéralistes ont formé leur parti"
 TT_ALG_FEDERALIST_COALITION: "Les fédéralistes sont dans la coalition gouvernementale"
 TT_ALG_NATIONALIST_COALITION: "Les nationalistes sont dans la coalition gouvernementale"
 TT_ALG_FEDERAL_PARTY_EXISTS_NOT: "Les fédéralistes n'ont pas formé leur parti"
 TT_ALG_FEDERALIST_COALITION_NOT: "Les fédéralistes ne sont pas dans la coalition gouvernementale"
 TT_ALG_NATIONALIST_COALITION_NOT: "Les nationalistes ne sont pas dans la coalition gouvernementale"
 TT_ALG_US_PROTECTION_REQ: "[Western_Autocracy_L] doit être le parti au pouvoir"
 TT_ALG_DIRECT_DEM_REQ: "Nous aurions dû accorder la citoyenneté aux Kurdes pour qu'ils répandent les idéaux de démocratie directe dans la région"
 TT_ALG_KICKING_ASSADS_EFFECT: "Inclusivité politique alaouite : §R-40%§!"
 TT_ALG_REPUBLICANISM_FOCUS_EFFECT: "Pour chaque communauté ethnique et religieuse importante d'Algérie, nous choisirons entre réserver des sièges au parlement à des politiciens représentant ces communautés, ce qui accroît l'inclusion des minorités au prix d'une corruption plus coûteuse, ou ne pas le faire, ce qui provoquera des émeutes et des dégâts matériels dans leurs régions chaque fois que leur inclusion politique tombera sous §Y50 %§!"
 TT_ALG_FEDERALISM_FOCUS_EFFECT: "Pour chaque communauté ethnique et religieuse importante d'Algérie, nous choisirons entre leur accorder une semi-autonomie, accroissant leur inclusion politique au prix d'une extraction de ressources, d'une vitesse de construction et de créneaux de construction réduits, ainsi que d'un coût accru pour changer les lois gouvernementales inversement proportionnel à l'inclusion politique de la communauté, ou libérer entièrement la région en État autonome"
 TT_ALG_DIRECT_DEMOCRACY_REQ: "Pour que notre démocratie directe fonctionne, l'État doit être sécularisé et la menace terroriste devenir inexistante. La société doit aussi être pacifiée des idéaux salafistes radicaux"
 TT_ALG_SECULARIZE_CONSTITUTION: "Selon les réformes et politiques adoptées, nous serons soit une démocratie libérale, soit une démocratie illibérale"
 TT_ALG_ALLY_FARMERS: "Les agriculteurs nous rejoindront comme faction interne dans notre lutte"
 TT_ALG_ALLY_INDUSTRIALISTS: "Les conglomérats industriels nous rejoindront comme faction interne dans notre lutte"
 TT_ALG_ALLY_ULEMA: "Les oulémas nous rejoindront comme faction interne dans notre lutte"
 TT_ALG_ALLY_INTL_BANKERS: "Les banquiers internationaux nous rejoindront comme faction interne dans notre lutte"
 TT_ALG_AGRICULTURAL_INVESTMENT_EFFECT: "Investir plusieurs fois dans l'agriculture permettra l'apparition de nouveaux marchés et entreprises pour vendre la production. Le nombre d'investissements requis pour que de nouvelles entreprises émergent dépend toutefois du niveau de corruption"
 ALG_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§YNous inviterons un parti dans la coalition. Ce parti nous sera d'un grand bénéfice dans sa cause respective, centralisation ou décentralisation, durant le processus d'équilibre des pouvoirs de construction de l'État§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§CAvoir ce parti dans la coalition nous bénéficiera grandement pour la centralisation durant le processus d'équilibre des pouvoirs de construction de l'État§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§GAvoir ce parti dans la coalition nous bénéficiera grandement pour la décentralisation durant le processus d'équilibre des pouvoirs de construction de l'État§!"
 ALG_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "En cas de succès, nous gagnerons §G75§! de pouvoir politique et l'esprit §YBureaucrates prometteurs§! accordant §G+0.5§! de §Ygain quotidien de pouvoir politique§! et §G+0.2§! de §Yvitesse de construction§! pendant §Y100§! jours"
 ALG_STATE_DECISION_MAKING_SUCCESS_EFFECTS: "En cas de succès, nous gagnerons §G5 %§! de stabilité"
 ALG_LOCAL_ACCOUNTABILITY_SUCCESS_EFFECTS: "En cas de succès, nous gagnerons §G10 %§! de popularité du parti et réduirons la corruption"
 ALG_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "En cas de succès, nous réduirons la corruption et obtiendrons §YEssor des organisations bénévoles§! accordant §G0.2§! de gain quotidien de pouvoir politique et §G+30 %§! de vitesse de construction pendant §Y100§! jours"
 ALG_ENCOURAGE_ECONOMIC_SELF_RELIANCE: "En cas de succès, nous accroîtrons notre cycle de croissance économique"
 TT_ALG_KURDS_WITHOUT_CITIZENSHIPS_PARTY_FORMATION: "§GUne fois le problème réglé en accordant la citoyenneté aux Kurdes après l'éviction des Assad, ils formeront un parti politique cherchant à transformer l'Algérie en fédération§!"
 ALG_ECONOMIC_DECISIONS_ONE_FREE_FACTORIES_EXPLANATION: "§RIl doit y avoir au moins un complexe industriel disponible et non assigné à la construction. Annulez la construction en cours ou attendez qu'elle se termine et devienne disponible§!"
 ALG_ECONOMIC_DECISIONS_TWO_FREE_FACTORIES_EXPLANATION: "§RIl doit y avoir au moins deux complexes industriels disponibles et non assignés à la construction. Annulez la construction en cours ou attendez qu'elle se termine et devienne disponible§!"
 ALG_ECONOMIC_DECISIONS_THREE_FREE_FACTORIES_EXPLANATION: "§RIl doit y avoir au moins trois complexes industriels disponibles et non assignés à la construction. Annulez la construction en cours ou attendez qu'elle se termine et devienne disponible§!"
 ALG_FEDERAL_FORMATION_TOOLTIP: "Si toutes les valeurs d'inclusion des minorités sont à §Y50 %§! ou plus, la §GFédération algérienne§! sera formée"
 ALG_UNITARY_FORMATION_TOOLTIP: "Si toutes les valeurs d'inclusion des minorités sont à §Y50 %§! ou plus, la §CRépublique algérienne§! sera formée"
 ALG_tech_name: "Bonus technologique"
 TT_ALG_CORRUPTION_COSTS: "Plus nos institutions sont corrompues, plus nos investissements seront coûteux"
 ALG_algeria_invite_ciw: "§CNous inviterons chaque nation islamique au CIW§!"
 dyn_ALG_tt: "L'effet de ce focus dépend de l'orientation du gouvernement algérien !"
 ALG_islamist_opposition_victory: "Gouvernement d'opposition islamiste"
 ALG_islamist_opposition_victory_desc: "La coalition d'opposition islamiste a remporté les élections et sera chargée de conduire l'Algérie vers une république islamique conservatrice"
 ALG_islamist_renaissance: "Renaissance islamiste"
 ALG_islamist_renaissance_desc: "Notre victoire a galvanisé notre soutien parmi les masses. Une nouvelle culture a émergé et nous sommes pleinement décidés à la soutenir"
 ALG_empower_sharia_courts: "Autonomiser les tribunaux de la charia"
 ALG_empower_sharia_courts_desc: "Il est temps de renforcer le judiciaire islamique et d'étendre son influence"
 ALG_turkish_inspired_islamism: "Islamisme d'inspiration turque"
 ALG_turkish_inspired_islamism_desc: "Nous nous inspirerons des mouvements islamistes survenus en Turquie après l'établissement de leur république. Cela présentera notre mouvement sous un jour plus favorable pour l'heure et pourra attirer des hommes d'affaires conservateurs turcs à investir dans notre pays."
 ALG_deregulate_economy: "Économie déréglementée"
 ALG_deregulate_economy_desc: "Pour renforcer les classes moyennes et les commerçants dont nous tirons une grande part de notre soutien, nous réduirons les restrictions qui pèsent sur eux et leur donnerons l'espace nécessaire à leur essor"
 ALG_moderate_conservatism: "Conservatisme modéré"
 ALG_moderate_conservatism_desc: "Nous éliminerons les éléments extrémistes de nos rangs et remodelerons notre image en force conservatrice n'ayant rien à voir avec le fanatisme religieux"
 ALG_religious_values: "Nos valeurs inébranlables"
 ALG_religious_values_desc: "Il se peut que nos politiques précédentes, destinées à apaiser la population et à adoucir notre image, nous aient écartés des véritables valeurs sur lesquelles reposent nos idéaux. Nous nous soucions moins de l'opinion d'autrui : notre seul but est d'établir la charia sur nos terres, quelle que soit l'impopularité de cette voie"
 ALG_religious_economic_charity: "Dons religieux"
 ALG_religious_economic_charity_desc: "Nos mouvements ont toujours été associés à des œuvres et fondations bénéfiques pour nos communautés. Désormais plus en vue, nous les institutionnaliserons davantage afin d'alléger nos fardeaux économiques"
 ALG_qatari_support: "Soutien qatari"
 ALG_qatari_support_desc: "Nous avons attiré l'intérêt de divers investisseurs qatariens"
 ALG_flourishment_of_central_economy: "Développer les centres urbains"
 ALG_flourishment_of_central_economy_desc: "Notre base de soutien vient surtout de diverses régions urbaines et nous devons commencer à les développer pour renforcer le soutien de leur population"
 ALG_turkish_investments: "Investissements turcs"
 ALG_turkish_investments_desc: "Nous avons attiré de nombreux investisseurs turcs grâce à nos politiques de déréglementation ainsi qu'à nos affinités idéologiques"
 ALG_reverse_secularization: "Sécularisation inversée"
 ALG_arm_palestinians_to_fight: "Armer les Palestiniens"
 ALG_arm_palestinians_to_fight_desc: "La Jordanie abrite une importante population de réfugiés palestiniens. Nous pouvons en faire des combattants et les pousser à semer le chaos en Palestine et en Israël. Comme ce sont des proxies, nous pourrons pousser Israël à riposter, le faisant passer pour le mauvais camp du conflit"
 ALG_zionist_threat: "La menace sioniste"
 ALG_zionist_threat_desc: "Israël est le plus grand affront à tous les musulmans, un État factice abominable au cœur de l'islam. Il doit être rayé de la carte."
 ALG_help_sahara: "Nos amis sahariens"
 ALG_help_sahara_desc: "Nous sommes en contact avec de nombreux mouvements qui soutiennent notre cause panarabe ; l'un d'eux est le Front Polisario, qui cherche à libérer le peuple du Sahara septentrional. Depuis un siècle, le Polisario a combattu l'oppression coloniale puis marocaine, et le Front ne contrôle plus qu'une petite zone du Sahara occidental. Pour l'heure le conflit est gelé, mais nous pouvons changer cela en envoyant une aide militaire à nos amis et en équipant les Sahraouis de tout ce dont ils ont besoin pour poursuivre leur lutte."
 algeria.42.t: "Soutien en armement de [FROM.GetName] !"
 algeria.42.d: "Ils nous ont envoyé des armes !"
 algeria.42.a: "Great"
 algeria.43.t: "L'Algérie émet une protestation diplomatique !"
 algeria.43.d: "Le président algérien Abderrazak Makri a adressé une protestation diplomatique contre notre gouvernement. Il prétend que nous sommes des terroristes et que la communauté internationale doit lancer une opération spéciale pour liquider notre régime."
 algeria.43.a: "Va te faire foutre, Makri"
 ALG_support_fsa: "Prise en charge de la FSA"
 ALG_support_fsa_desc: "Nos relations avec la Syrie ont une longue histoire. Désormais, elles devront être définies par leur rapport à l'idéologie des Frères."
 ALG_brotherhood_diplo: "Diplomatie de la Fraternité"
 ALG_brotherhood_diplo_desc: "Nous devons réformer notre diplomatie conformément à notre nouveau gouvernement."
 ALG_hamas_under_wing: "Le Hamas sous notre aile"
 ALG_hamas_under_wing_desc: "Le Hamas est un groupe de combattants de la liberté situé dans la bande de Gaza et associé aux Frères musulmans. Les aider est notre devoir !"
 algeria.44.t: "Le Hamas prend le contrôle de Gaza"
 algeria.44.d: "Le Hamas, avec le soutien de l'Algérie, a pris le contrôle de la bande de Gaza. Ses milices armées se sont emparées des bâtiments gouvernementaux, et leur porte-parole [HAM.GetLeader] a déclaré que le groupe se prépare à marcher pour libérer la mosquée Al-Aqsa"
 algeria.44.a: "Damn"
 ALG_letter_isr: "Manipulation israélienne"
 ALG_letter_isr_desc: "Ô Israël ! L'heure est venue de décider de votre sort."
 MSP_letter_isr: "Manipulation israélienne"
 MSP_letter_isr_desc: "Ô Israël ! L'heure est venue de décider de votre sort."
 ALG_und_supp_hamas: "Soutien clandestin au Hamas"
 ALG_und_supp_hamas_desc: "Pour que la cause du Hamas aboutisse, nous devons les soutenir matériellement."
 ALG_org_of_isl_coop: "Organisation de la coopération islamique"
 ALG_org_of_isl_coop_desc: "L'Organisation de la coopération islamique, anciennement Organisation de la conférence islamique, est une organisation intergouvernementale fondée en 1969, regroupant 57 États membres, dont 48 à majorité musulmane."
 MSP_und_supp_hamas: "Soutien clandestin au Hamas"
 MSP_und_supp_hamas_desc: "Pour que la cause du Hamas aboutisse, nous devons les soutenir matériellement."
 MSP_org_of_isl_coop: "Organisation de la coopération islamique"
 MSP_org_of_isl_coop_desc: "L'Organisation de la coopération islamique, anciennement Organisation de la conférence islamique, est une organisation intergouvernementale fondée en 1969, regroupant 57 États membres, dont 48 à majorité musulmane."
 algeria.49.t: "L'Algérie demande la libération d'Omar Abdel-Rahman"
 algeria.49.d: "Dans sa lettre, Makri a brièvement indiqué qu'il nous demandait de libérer Omar Abdel-Rahman, condamné pour l'attentat de 1993 contre le World Trade Center à New York, ainsi que les nombreux Égyptiens arrêtés durant la révolution. Un porte-parole des Frères a ensuite déclaré que l'extradition était proposée pour des raisons humanitaires et que Makri n'entendait pas annuler les condamnations pénales d'Abdel-Rahman."
 algeria.49.a: "Makri est-il fou ?"
 algeria.49.b: "Euh, bien sûr ?"
 ALG_supp_plo: "Soutenir l'OLP"
 ALG_supp_plo_desc: "L'Organisation de libération de la Palestine (OLP) a longtemps été un acteur clé de la lutte pour l'autodétermination palestinienne. Soutenir l'OLP pourrait renforcer notre standing auprès des alliés internationaux et favoriser un règlement pacifique du conflit."
 ALG_the_pal_issue: "La question palestinienne"
 ALG_the_pal_issue_desc: "La question de la Palestine demeure un enjeu central de notre politique étrangère. Notre position sur la lutte palestinienne définira nos alliances internationales et notre influence dans la région. Nous devons décider comment aborder ce conflit persistant."
 ALG_supp_hamas: "Soutenez le Hamas"
 ALG_supp_hamas_desc: "Le Hamas représente une faction importante de la résistance palestinienne. En lui apportant notre soutien, nous pouvons renforcer nos liens avec ce groupe, accroître notre influence régionale et nous aligner sur leur lutte."
 ALG_Get_rid_of_military_corrupt: "Purger les corrompus de l'armée"
 ALG_Get_rid_of_military_corrupt_desc: "L'armée est enracinée dans nos institutions et constitue une menace claire pour l'avenir du pays. Nous les arrêterons pour corruption et confisquerons les biens dont nous pourrons nous emparer"
 idea_algerian_oligarchy_arrests: "Purge militaire"
 ALG_the_coalition: "La coalition"
 ALG_the_coalition_desc: "Après le rétablissement des partis politiques, deux forces notables ont émergé. L'une plaide pour la fédéralisation de l'État et davantage de pouvoir aux provinces, l'autre pour l'enracinement de l'autorité centralisée et le maintien d'une république unitaire. Nous devrons choisir avec soin avec qui nous aligner"
 ALG_dismantle_the_military: "Démanteler le budget militaire"
 ALG_dismantle_the_military_desc: "Une grande part du PIB de défense a été détournée vers des projets inutiles en raison de la corruption enracinée dans les institutions de nos forces armées. Nous réaffecterons et vendrons une grande partie de ce dont nous pourrons nous emparer ; cela pourra affaiblir notre armée et nous exposer aux menaces, mais c'est une étape nécessaire vers le redressement économique et l'éradication de la corruption"
 ALG_empower_institutions: "Autonomiser les institutions"
 ALG_empower_institutions_desc: "Nos institutions sont très faibles et reléguées. Le pouvoir est concentré sur le président, le parlement n'en a que peu, et des médias d'État entretiennent un climat restreignant les libertés personnelles. Rédiger une nouvelle constitution garantissant la répartition des pouvoirs et la libéralisation est une étape cruciale vers l'avenir"
 ALG_western_supported_economic_relief: "Secours occidental"
 ALG_western_supported_economic_relief_desc: "Nos idéaux s'alignent sur ceux de l'Occident et nous ont même permis d'établir nos partis dans leurs pays. Nous nouerons des liens avec eux et demanderons un allègement en échange de leviers économiques"
 ALG_liberalize_society: "Libéraliser la société"
 ALG_liberalize_society_desc: "Le peuple est étranger aux valeurs de liberté et d'égalité. Nous devons l'encourager à chérir ses libertés"
 ALG_scientific_ventures: "Entreprises scientifiques"
 ALG_scientific_ventures_desc: "En soutenant les bourses et en actualisant nos programmes scolaires dépassés, nous pourrons faire progresser le secteur scientifique du pays"
 Algeria_student_exchanges: "Échanges étudiants"
 ALG_banish_authoritarian_influence: "Bannir l’influence autoritaire"
 ALG_banish_authoritarian_influence_desc: "De nombreux États autoritaires comme l'Iran et la Russie ont eu une forte présence ici. Désormais État libre, il est temps de mettre fin à leur influence sur nos institutions et notre économie"
 ALG_democratic_socialism: "Socialisme démocratique"
 ALG_democratic_socialism_desc: "L'état ruineux de notre économie a laissé notre population pauvre et sous-développée. Réduire les restrictions aux entreprises introduirait l'exploitation et une concurrence déloyale, l'inégalité économique demeurant prégnante. Ce qu'il nous faut, c'est encourager de nouvelles entreprises et leur accorder des subventions pour un développement économique large dont toutes les classes pourront bénéficier"
 ALG_unleash_economic_potential: "Libérer le potentiel économique"
 ALG_unleash_economic_potential_desc: "Nous avons un grand potentiel pour devenir une puissance économique. Nous pouvons encourager les investisseurs et entreprises étrangers à s'installer ici ; même si cela fera de notre population une main-d'œuvre bon marché, ce sera notre grand bond vers le développement économique"
 ALG_domestic_investments: "Investissements nationaux"
 ALG_domestic_investments_desc: "De nombreuses jeunes entreprises nationales se créent. Nous investirons en elles pour soutenir leur marche vers la prospérité économique"
 ALG_subsidize_local_firms: "Entreprises locales"
 ALG_subsidize_local_firms_desc: "Grâce à nos politiques, les firmes locales sont reconnues pour leur succès. Il est temps d'investir en elles"
 ALG_economic_democracy: "Égalité économique"
 ALG_economic_democracy_desc: "Notre développement économique a atteint toutes les couches de la population en s'attaquant à l'inégalité et a même donné naissance à des entreprises nationales prospères. C'est une fierté"
 ALG_federalisation: "Fédéralisation"
 ALG_federalisation_desc: "La solution est de donner davantage de pouvoir aux États. Cela encouragera grandement la représentation locale et l'inclusion, et remédiera aux peurs et tensions sectaires. Cette autonomie affaiblira toutefois notre emprise sur les États, surtout là où les minorités sont présentes"
 ALG_algerian_investments: "Investissements de la diaspora"
 ALG_algerian_investments_desc: "Grâce à nos politiques économiquement accueillantes, nous avons attiré des investissements de la diaspora algérienne à l'étranger"
 ALG_invite_US_business_giants: "Invitez des géants du monde des affaires"
 ALG_invite_US_business_giants_desc: "Si nous avons laissé notre économie prospérer, ce n'est pas suffisant. Nous inviterons de grandes entreprises américaines à établir des franchises dans le pays pour encourager le consumérisme"
 ALG_republicanism: "Républicanisme"
 ALG_republicanism_desc: "L'Algérie est mieux gouvernée comme un État fort à l'autorité centralisée. Cela renforcera le gouvernement mais provoquera l'aliénation et la colère des minorités qui se sentent reléguées"
 ALG_address_ethnic_divides: "Résoudre les divisions ethniques"
 ALG_address_ethnic_divides_desc: "Notre pays a toujours été divisé et miné par le sectarisme. Nous devons décider comment aborder ces questions"
 ALG_EU_investments: "Investissements de l'UE"
 ALG_EU_investments_desc: "Divers pays européens cherchent à investir dans notre pays"
 ALG_student_exchanges: "Échanges étudiants"
 ALG_student_exchanges_desc: "Nous encouragerons les bourses à l'étranger afin d'améliorer notre enseignement et de le maintenir au niveau des normes mondiales"
 ALG_democratic_victory: "Victoire démocratique"
 ALG_democratic_victory_desc: ""
 ALG_new_era: "Une nouvelle ère"
 ALG_new_era_desc: "Une nouvelle ère s'ouvrira pour la région. Une ère de paix et de stabilité, libre de l'oppression et de l'injustice"
 ALG_islamic_nato: "OTAN islamique"
 ALG_islamic_nato_desc: "Si l'OTAN nous apporte la sécurité, ses membres ont montré leur mépris total pour le Moyen-Orient. S'ils ne peuvent garantir la stabilité et la prospérité, nous devons prendre le relais. Nous formerons notre propre alliance militaire, l'Organisation du traité méditerranéen, ou OTM"
 ALG_invite_iraq: "Inviter l'Irak"
 ALG_invite_iraq_desc: "Nous devons inviter l'Irak dans notre alliance : ils commencent lentement à se reprendre, et une coopération mutuelle nous serait grandement bénéfique"
 ALG_invite_syria: "Inviter la Syrie"
 ALG_invite_syria_desc: "Avoir la Syrie juste au sud de notre nation nous rend très vulnérables. L'inviter dans notre faction serait un excellent moyen de garantir notre sécurité"
 ALG_invite_algeria: "Inviter l'Égypte"
 ALG_invite_algeria_desc: "L'Égypte est une puissance montante, et avec une population de cette taille, notre alliance pourra accomplir pratiquement n'importe quoi"
 ALG_assistance_to_bulgaria: "Assistance à la Bulgarie"
 ALG_assistance_to_bulgaria_desc: "Nous devrions aider la Bulgarie à développer ses infrastructures afin de pouvoir plus facilement mener des investissements au-delà de ses frontières"
 ALG_islamic_economic_cooperation: "Coopération économique islamique"
 ALG_islamic_economic_cooperation_desc: "De nombreux pays musulmans nagent dans l'argent et l'utilisent à des fins absurdes. Nous devrions former une alliance économique pour mettre en commun nos ressources dans des projets communs"
 ALG_msp_win: "§RNOTE§! : §GCE FOCUS DÉVERROUILLERA L'ARBRE DE FOCUS DU MSP ! CET ARBRE SERA ÉCRASÉ§!"
 algeria_news.1.t: "Coup d'État militaire en Algérie !"
 algeria_news.1.d: "Dans un retournement rapide et inattendu, l'Algérie bascule dans l'incertitude alors qu'un coup d'État militaire renverse le gouvernement de [ALG.GetLeader]. Au milieu de tensions croissantes entre le parti au pouvoir et les factions d'opposition, l'armée algérienne, menée par le général Ahmed Gaïd Salah, s'empare de l'appareil d'État, suspend la constitution et interner les figures politiques clés. Les rues du Caire explosent de scènes de joie et d'appréhension, reflétant les profondes divisions de la nation face à l'intervention militaire. La communauté internationale observe de près l'avenir de l'Algérie, les inquiétudes grandissant quant aux implications pour la démocratie et la stabilité régionales."
 algeria_news.1.a: "Intéressant"
 algeria_news.2.t: "L'Algérie à la croisée des chemins"
 algeria_news.2.d: "Après près d'une décennie de sang et d'instabilité, l'Algérie se trouve dans une position fragile et incertaine. Les armes se sont tues dans bien des régions, mais la paix est loin d'être garantie. La nation est à un tournant critique : choisira-t-elle la réconciliation et la réforme, poursuivra-t-elle l'état d'urgence sous l'armée, ou s'effondrera-t-elle à nouveau dans le conflit ? Les regards du peuple algérien, et du monde, sont fixés sur la suite."
 algeria_news.2.a: "La lutte pour l'avenir de l'Algérie commence"
 algeria_news.3.t: "Bouteflika accède à la présidence"
 algeria_news.3.d: "En avril 1999, Abdelaziz Bouteflika a été élu président de l'Algérie, rendant au pays une direction civile formelle après des années de crise politique. Si la guerre n'est pas encore tout à fait terminée, Bouteflika entre en fonction déterminé à rétablir la stabilité, reconstruire l'État et conduire l'Algérie dans le nouveau millénaire. Son programme de réconciliation et de dialogue a fait naître l'espoir chez de nombreux Algériens, mais le doute demeure : sa présidence pourra-t-elle vraiment cicatriser les plaies de la Décennie noire ?"
 algeria_news.3.a: "Une nouvelle ère commence sous Bouteflika"
 algeria_news.4.t: "L'échéance de la Concorde civile expire"
 algeria_news.4.d: "La fenêtre d'amnistie ouverte par la Concorde civile du président Bouteflika s'est refermée. Des milliers d'insurgés sont descendus des montagnes et ont repris une vie civile, et l'Armée islamique du salut s'est formellement dissoute plutôt que de poursuivre le combat. Les durs du Groupe islamique armé, et le Groupe salafiste pour la prédication et le combat nouvellement formé, ont refusé toute offre et restent sur le terrain. Les partisans voient dans la Concorde la meilleure chance d'arrêter le sang ; les critiques répondent qu'elle absout les auteurs des massacres sans rendre la moindre justice aux victimes."
 algeria_news.4.a: "Une chance de tourner la page de la Décennie noire"
 algeria_news.5.t: "Le FLN ravive son héritage révolutionnaire"
 algeria_news.5.d: "Le président Bouteflika et le FLN ont lancé une campagne nationale pour renforcer leur légitimité par le souvenir de la guerre d'indépendance. Les médias d'État et les écoles glorifient désormais les sacrifices des martyrs, présentant le FLN comme le gardien éternel de la souveraineté algérienne. Dans le même temps, le gouvernement a scellé des alliances avec d'autres grands partis, formant une coalition politique pour consolider l'autorité et présenter un front uni. Les critiques dénoncent une propagande opportuniste, tandis que les partisans y voient la renaissance de l'esprit révolutionnaire algérien."
 algeria_news.5.a: "La révolution continue par l'unité"
 algeria_news.5.b: "Aucun FLN ne doit gouverner seul"
 algeria_news.6.t: "Formation de l'Alliance présidentielle"
 algeria_news.6.d: "S'appuyant sur sa campagne d'héritage révolutionnaire, le FLN a scellé une coalition de gouvernement connue sous le nom d'« Alliance présidentielle ». Le Front de libération nationale (FLN), le Rassemblement national démocratique (RND) et le Mouvement de la société pour la paix (MSP) ont convenu de coordonner leurs politiques en soutien au président Bouteflika. L'alliance renforce le contrôle du bloc dirigeant sur le système politique algérien, présentant un front uni au public. Si les partisans saluent cette coalition comme un symbole de stabilité, les voix d'opposition mettent en garde contre un glissement vers la domination d'un parti unique sous un nouveau visage."
 algeria_news.6.a: "Ensemble, nous sauvegardons l'avenir de l'Algérie"
 ALG_presidential_alliance: "§YLe FLN, le RND et le MSP ont formé l'Alliance présidentielle.§!\nCette coalition accroît la stabilité du gouvernement, mais consolide la domination politique sous le bloc dirigeant."
 algeria_news.7.t: "La crise se rallume"
 algeria_news.7.d: "Les promesses de réconciliation et de réforme se sont effondrées en mensonges. Le FLN et ses soi-disant alliés du RND et d'autres partis démocratiques n'ont pas apporté la justice et les droits exigés par le peuple. Désillusionnés par les paroles vides, beaucoup se tournent désormais vers le Groupe salafiste pour la prédication et le combat (GSPC), convaincus que seule la loi d'Allah peut apporter la vraie justice à l'Algérie. Pour eux, la charia représente une loi supérieure, non corrompue par l'avidité des politiciens, la trahison des harkis ou l'influence des puissances étrangères. Ce n'est pas une guerre contre le peuple algérien, mais contre les officiels corrompus et les élites soutenues de l'étranger qui ont volé leur avenir. Une nouvelle guerre civile se profile, qui décidera une fois pour toutes du destin de l'Algérie."
 algeria_news.7.a: "La loi d'Allah guidera l'avenir de l'Algérie"
 ALG_army_alliance: "Le Pouvoir se renforce"
 ALG_strengthen_le_pouvoir: "Renforcer Le Pouvoir"
 ALG_strengthen_le_pouvoir_desc: "L'élite dirigeante et l'armée consolident le pouvoir au détriment des libertés politiques."
 ALG_resistance_challenges_new: "Les revendications du peuple"
 ALG_resistance_challenges_new_desc: "Le peuple exige des réformes de la santé, de l'éducation et de l'emploi. Ne pas y répondre renforcera les griefs et rapprochera l'Algérie de la guerre civile."
 ALG_healthcare_reform: "Réformer le système de santé"
 ALG_healthcare_reform_desc: "Les hôpitaux sont saturés, les médecins sous-payés et les pénuries médicales endémiques. Nous devons agir vite."
 alg.310.t: "Succès de la réforme sanitaire"
 alg.310.d: "L'investissement dans les hôpitaux et les médecins a restauré une part de confiance dans le gouvernement."
 alg.310.a: "Une petite victoire."
 alg.311.t: "Effondrement des soins de santé"
 alg.311.d: "Les hôpitaux sont submergés, les patients refoulés, et la corruption ronge le système. La colère bout."
 alg.311.a: "Cela nous coûtera cher."
 ALG_education_reform: "Réformer le système éducatif"
 ALG_education_reform_desc: "Nos écoles et universités sont dépassées, et les diplômés font face à un avenir sans emploi."
 alg.320.t: "Succès de la réforme de l'éducation"
 alg.320.d: "L'investissement dans les écoles et universités a redonné espoir aux étudiants."
 alg.320.a: "Un avenir meilleur."
 alg.321.t: "Effondrement de l'éducation"
 alg.321.d: "Classes surchargées, universités en échec et manque d'opportunités alimentent le mécontentement."
 alg.321.a: "La jeunesse se retourne contre nous."
 ALG_unemployment_reform: "S'attaquer à la crise du chômage"
 ALG_unemployment_reform_desc: "La jeunesse algérienne est sans emploi et agitée. Nous devons investir dans l'industrie et la création d'emplois ou affronter les troubles."
 alg.330.t: "Succès du programme d'emploi"
 alg.330.d: "De nouveaux emplois et de petites industries offrent de l'espoir à des milliers de jeunes Algériens."
 alg.330.a: "Un pas en avant."
 alg.331.t: "La crise du chômage s'aggrave"
 alg.331.d: "Les usines restent inactives, les diplômés oisifs dans les rues, et les manifestations tournent à la violence."
 alg.331.a: "Cela ne peut durer."
 alg.400.t: "L'armée accepte la défaite"
 alg.400.d: "L'Armée nationale populaire a perdu son emprise sur la politique. Sous la pression publique et des officiers peu enclins à risquer une nouvelle guerre sanglante, les généraux acceptent de s'effacer au profit d'une direction civile."
 alg.400.a: "Le pouvoir civil, enfin !"
 alg.401.t: "L'armée contre-attaque"
 alg.401.d: "Bien que des réformes aient commencé, l'armée détient encore le vrai pouvoir. Les généraux interfèrent en politique, réorientent les fonds et sabotent les tentatives de transparence. L'Algérie retombe dans un gouvernement de l'ombre."
 alg.401.a: "Les généraux corrompus restent au pouvoir."
 alg.402.t: "Le peuple prend les armes"
 alg.402.d: "Les griefs du peuple algérien ont atteint le point de rupture. La stabilité disparue et la confiance dans les institutions anéantie, les manifestations se transforment en rébellion ouverte. L'Algérie affronte une nouvelle guerre civile."
 alg.402.a: "La nation est déchirée."
 ALG_resist_le_pouvoir: "Résistez au Pouvoir"
 ALG_resist_le_pouvoir_desc: "Pendant des décennies, l'élite corrompue connue sous le nom de *Le Pouvoir* a dirigé l'Algérie depuis l'ombre, usant de l'armée comme poing de fer. Le peuple s'agite, et si l'on n'entend pas ses griefs, l'Algérie pourra affronter une nouvelle tempête. Choisir cette voie ouvrira la voie à la réforme, ou au sang."
 ALG_popular_salvation: "Mouvement du salut populaire"
 ALG_popular_salvation_desc: "Des cendres du désespoir, un nouveau mouvement s'élève. Étudiants, ouvriers et soldats désillusionnés s'unissent pour appeler au changement. Que ce mouvement puisse renverser pacifiquement l'ancien ordre ou allumer une guerre civile dépendra de la façon dont nous gérerons les revendications du peuple."
 ALG_popular_salvation_tt: "§YCe focus renforce le mouvement d'opposition mais ne garantit pas la guerre civile. L'issue dépend de la gestion des griefs et de l'influence de l'armée.§!"
 ALG_restore_hope: "Restaurer l'espoir"
 ALG_restore_hope_desc: "En 1999, Abdelaziz Bouteflika est arrivé au pouvoir en promettant stabilité et réconciliation après la Décennie noire. Le peuple le voit comme un symbole d'espoir."
 ALG_charter_for_peace: "La Concorde civile"
 ALG_charter_for_peace_desc: "Approuvée par référendum en septembre 1999, la Concorde civile offre l'amnistie à tout insurgé qui se rend avant la clôture de la fenêtre. L'Armée islamique du salut a déjà honoré son cessez-le-feu ; la question est de savoir combien des combattants restants la suivront en descendant des montagnes."
 ALG_no_pres_alliance: "Le FLN gouverne seul"
 ALG_no_pres_alliance_desc: "Bouteflika et le FLN rejettent les alliances avec d'autres partis, affirmant une domination totale sur le système politique algérien."
 ALG_le_pouvoir_in_the_shadows: "Le Pouvoir dans l'ombre"
 ALG_le_pouvoir_in_the_shadows_desc: "Bien que des élections aient lieu, le vrai pouvoir est détenu par l'élite enracinée. La corruption s'approfondit tandis que les citoyens s'agitent."
 ALG_peace_charter: "La Concorde civile"
 ALG_peace_charter_desc: "L'amnistie de Bouteflika pour les insurgés qui déposent les armes, destinée à vider la Décennie noire de ses combattants plutôt qu'à les vaincre sur le terrain."
 ALG_fln_dominance: "Dominance du FLN"
 ALG_fln_dominance_desc: "Le Front de libération nationale (FLN) continue de dominer le système politique algérien. Sa domination limite le pluralisme et nourrit le ressentiment des oppositions, tout en offrant continuité et contrôle au régime."
 ALG_only_FLN: "Pas d'alliance"
 ALG_only_FLN_desc: "Le FLN gouvernera seul, rejetant alliances et coalitions. Cela consolide le pouvoir, mais isole davantage les forces d'opposition et risque d'accroître le mécontentement public."
 ALG_pres_coa: "Alliance présidentielle"
 ALG_pres_coa_desc: "Pour maintenir la stabilité, le FLN peut former une coalition présidentielle plus large. En y incluant des partis loyalistes et des indépendants, le gouvernement gagne en légitimité sans céder sa domination."
 ALG_nationalize_privatized_industries: "Nationaliser les industries privatisées"
 ALG_nationalize_privatized_industries_desc: "Les privatisations néolibérales des années 1990 ont affaibli la souveraineté de l'Algérie. En renationalisant les industries clés, l'État peut reprendre le contrôle des secteurs stratégiques."
 ALG_sonatrach_expansion: "Agrandissement de Sonatrach"
 ALG_sonatrach_expansion_desc: "Sonatrach, la compagnie énergétique publique algérienne, est l'épine dorsale de notre économie. Étendre sa capacité et sa portée renforcera les recettes de l'État et l'influence de l'Algérie sur les marchés énergétiques mondiaux."
 ALG_the_cult_of_bouteflika: "Le culte de Bouteflika"
 ALG_the_cult_of_bouteflika_desc: "Les partisans du président Bouteflika bâtissent un culte de la personnalité autour de sa direction. Par des réseaux loyaux et la propagande, son entourage cimentent sa domination sur la politique algérienne, même si la corruption et le clientélisme s'approfondissent."
 ALG_cult_of_bouteflika: "L'entourage de Bouteflika"
 ALG_cult_of_bouteflika_desc: "Entouré d'un entourage loyal mais profondément corrompu, le cercle intime de Bouteflika contrôle les leviers du pouvoir. Leur influence assure la stabilité du régime mais enracine le népotisme et réduit la transparence de la gouvernance."
 ALG_oppose_ffs_and_rcd: "Interdire le FFS et le RCD"
 ALG_oppose_ffs_and_rcd_desc: "Le Front des forces socialistes (FFS) et le Rassemblement pour la culture et la démocratie (RCD) défient l'hégémonie du FLN. En les interdisant, le régime élimine des voix d'opposition, mais risque d'enflammer la dissidence, surtout en Kabylie."
 ALG_smaller_state: "Plus petit État"
 ALG_smaller_state_desc: "L'État algérien hypertrophié est inefficace et coûteux. Réduire sa taille et décentraliser l'autorité pourrait améliorer l'efficacité, bien que les élites enracinées résistent à de telles réformes."
 ALG_fight_bloated_bureaucracy: "Combattez la bureaucratie gonflée"
 ALG_fight_bloated_bureaucracy_desc: "Des strates de bureaucratie étouffent la gouvernance algérienne. Une campagne pour rationaliser l'administration publique réduira la corruption et rapprochera les services du peuple."
 FLN_parties_corruptions: "La corruption dans nos partis"
 FLN_parties_corruptions_desc: "La corruption s'est infiltrée dans le FLN et ses partis alliés. La dénoncer et y remédier est vital si le régime espère restaurer sa crédibilité."
 ALG_elite_control: "Contrôle d'élite"
 ALG_elite_control_desc: "Un réseau de magnats, de chefs de parti et d'officiers militaires connu sous le nom de « Le Pouvoir » dirige l'Algérie depuis l'ombre."
 ALG_military_coup: "Coup d'État militaire"
 ALG_military_coup_desc: "L'armée a décidé de mettre fin à la direction civile et de s'emparer directement du pouvoir, promettant l'ordre mais apportant la peur."
 ALG_suspend_democracy: "Suspendre la démocratie"
 ALG_suspend_democracy_desc: "Le parlement est dissous, les élections annulées, et les généraux dirigent l'Algérie."
 ALG_repression_campaign: "Campagne de répression"
 ALG_repression_campaign_desc: "L'ANP use des méthodes brutales de la Décennie noire pour écraser la dissidence, au prix de l'indignation internationale."
 ALG_black_market_rises: "L'essor du marché noir"
 ALG_black_market_rises_desc: "La corruption et les pénuries créent un marché noir florissant, sapant l'économie officielle."
 ALG_expand_the_pna: "Étendre l'ANP"
 ALG_expand_the_pna_desc: "L'armée est agrandie, modernisée et renforcée pour garantir la survie du régime."
 ALG_africas_strongest_army: "L'armée la plus puissante d'Afrique"
 ALG_africas_strongest_army_desc: "L'Algérie possède désormais les forces armées les plus puissantes du continent, une force avec laquelle il faut compter."
 ALG_global_power_projection: "Le HCS se relève"
 ALG_global_power_projection_desc: "L'armée détenant à nouveau un pouvoir incontesté, l'Algérie s'affirme au pays comme à l'étranger. Écho de la domination de l'ère du HCS des années 1990, notre nation se dresse, inflexible, prête à projeter son influence bien au-delà de ses frontières. Le monde se souviendra de la force de la détermination algérienne."
 ALG_army_reform: "Réforme de l'armée"
 ALG_army_reform_specops: "Réforme de l'armée"
 ALG_army_reform_specops2: "Réforme de l'armée"
 ALG_army_reform_specops3: "Réforme de l'armée"
 ALG_army_reform_specops4: "Réforme de l'armée"
 ALG_military_quality_initiative: "Initiative de qualité militaire"
 ALG_military_quality_initiative2: "Initiative de qualité militaire"
 ALG_army_reform_mass_army: "Réforme de l'armée"
 ALG_army_reform_mass_army2: "Réforme de l'armée"
 ALG_army_reform_mass_army3: "Réforme de l'armée"
 ALG_army_reform_mass_army4: "Réforme de l'armée"
 ALG_military_expansion: "Expansion militaire"
 ALG_military_expansion2: "Expansion militaire"
 ALG_foreign_arms_companies: "Entreprises d'armement étrangères"
 ALG_future_army: "Armée du futur"
 ALG_air_reform: "Réforme aérienne"
 ALG_air_reform2: "Réforme aérienne"
 ALG_air_reform3: "Réforme aérienne"
 ALG_air_reform4: "Réforme aérienne"
 ALG_naval_reform: "Réforme navale"
 ALG_naval_reform2: "Réforme navale"
 ALG_naval_reform3: "Réforme navale"
 ALG_naval_reform4: "Réforme navale"
 ALG_shipbuilding: "Construction navale algérienne"
 ALG_shipbuilding2: "Construction navale algérienne"
 ALG_resist_le_pouvoir_system_tt: "§YNouveau système déverrouillé : grief populaire et influence de l'armée§!\n\n- Le §Ogrief populaire§! mesure le mécontentement. Il augmente si le chômage, l'éducation ou la santé sont négligés.\n- Si le grief devient trop élevé, des manifestations de masse ou une guerre civile peuvent éclater.\n\n- L'§Oinfluence de l'armée§! suit le rôle militaire en politique. L'affaiblir par des réformes peut permettre une transition pacifique, mais si l'influence croît, l'armée peut réprimer la démocratie et resserrer son emprise.\n\nVous devez équilibrer réforme, stabilité et pouvoir militaire pour survivre à cette voie."
 ALG_reactioners: "Économie de cluster"
 ALG_reactioners1: "Économie de cluster"
 ALG_reactioners2: "Économie de cluster"
 ALG_reactioners3: "Économie de cluster"
 ALG_reactioners4: "Économie de cluster"
 ALG_reactioners5: "Économie de cluster"
 ALG_reactioners6: "Économie de cluster"
 ALG_reactioners7: "Économie de cluster"
 ALG_automobile_industry: "Développer l'industrie automobile"
 ALG_automobile_industry_desc: "L'Algérie a longtemps dépendu des importations pour ses besoins automobiles. En développant une industrie nationale, nous pouvons créer des emplois, réduire les importations et faire de l'Algérie un pôle manufacturier régional."
 ALG_peugeot_deal: "Investissement Peugeot"
 ALG_peugeot_deal_desc: "Peugeot a manifesté son intérêt pour ouvrir une usine en Algérie. Ce partenariat pourrait nous apporter une capacité industrielle bien nécessaire."
 ALG_renault_oran: "Renault à Oran"
 ALG_renault_oran_desc: "Renault est prêt à établir une production à Oran, assurant un flux régulier de véhicules et dynamisant notre économie."
 ALG_hyundai_tiaret: "Hyundai à Tiaret"
 ALG_hyundai_tiaret_desc: "Hyundai, de Corée du Sud, est prêt à établir un partenariat à Tiaret, créant des emplois et réduisant notre dépendance aux constructeurs européens."
 ALG_volkswagen_relizane: "Volkswagen à Relizane"
 ALG_volkswagen_relizane_desc: "Volkswagen et ses marques associées (Škoda, Audi, Seat) sont prêtes à ouvrir une usine à Relizane, diversifiant davantage notre base industrielle."
 ALG_bmw_deal: "Partenariat BMW"
 ALG_bmw_deal_desc: "BMW, d'Allemagne, a montré de l'intérêt pour assembler des véhicules de luxe et premium en Algérie, élevant notre industrie automobile aux normes internationales."
 ALG_mercedes_trucks: "Camions Mercedes"
 ALG_mercedes_trucks_desc: "En travaillant avec Daimler, nous pourrons assembler des camions militaires Mercedes et des véhicules lourds en Algérie, soutenant directement nos forces armées."
 ALG_auto_scandal: "Scandale de corruption automobile"
 ALG_auto_scandal_desc: "Des révélations ont exposé l'industrie d'assemblage automobile algérienne comme une mascarade gangrenée par la corruption, les subventions détournées et des usines qui ne font guère plus que réassembler des kits importés. Le scandale aura de graves répercussions politiques et économiques."
 ALG_import_ban: "Interdire les importations de voitures"
 ALG_import_ban_desc: "Pour protéger notre industrie nationale, nous interdirons l'importation de la plupart des voitures étrangères. Cette mesure est controversée et créera des tensions économiques à court terme."
 ALG_fiat_deal: "Accord d'investissement Fiat"
 ALG_fiat_deal_desc: "Fiat a proposé de revenir en Algérie avec un complexe industriel moderne, promettant de relancer la production et de restaurer la confiance du public dans notre secteur automobile."
 ALG_indigenous_brand: "Créer une marque autochtone"
 ALG_indigenous_brand_desc: "Plutôt que de dépendre des compagnies étrangères, l'Algérie devrait créer son propre constructeur automobile indigène, conçu et bâti localement par des Algériens."
 ALG_auto_exports: "Exporter les voitures algériennes"
 ALG_auto_exports_desc: "Avec une industrie automobile nationale stable, nous pouvons désormais regarder vers l'extérieur et commencer à exporter des véhicules algériens vers les marchés africains et méditerranéens."
 alg.1000.t: "Scandale de corruption dans l'automobile"
 alg.1000.d: "Un scandale de corruption massif a ébranlé le secteur automobile algérien. Les enquêtes ont révélé que de nombreuses soi-disant « usines » n'étaient que des ateliers de réassemblage abusant des subventions d'État et gonflant les coûts. La confiance du public s'effondre et l'industrie est paralysée."
 alg.1000.a: "Une humiliation nationale"
 ALG_tebboune_tt: "Abdelmadjid Tebboune devient président de l'Algérie à la suite des manifestations du Hirak de 2019. La tristement célèbre (bande) de politiciens corrompus, dont Ahmed Ouyahia, Abdelmalek Sellal, Ali Haddad et Mahieddine Tahkout, est arrêtée et traduite en justice. C'est le début d'une nouvelle ère, même si beaucoup doutent de la profondeur réelle des réformes."
 ALG_corruption_network: "L'entourage de Bouteflika"
 ALG_corruption_network_desc: "Un réseau corrompu de politiciens et d'hommes d'affaires, dont Ouyahia, Sellal et Tahkout, domine la politique algérienne. Leur influence affaiblit l'État et alimente la colère publique."
 ALG_cleaning_the_state: "Nettoyer l'État"
 ALG_clean_government: "Gouvernement propre"
 ALG_political_repression: "Répression politique"
 ALG_military_junta: "Junte militaire"
 ALG_cleaning_the_state_desc: "Avec la chute de l'entourage, l'Algérie prend enfin des mesures pour purger la corruption de ses institutions et restaurer la confiance du peuple."
 algeria_reforms.1.t: "Les réformes sous Tebboune"
 algeria_reforms.1.d: "Après la démission d'Abdelaziz Bouteflika et l'élection d'Abdelmadjid Tebboune, l'Algérie entre dans un nouveau chapitre politique. Tebboune a promis des réformes, une nouvelle constitution et le démantèlement du tristement célèbre réseau de corruption appelé l'« ʿIsābah » (la bande), qui comprenait les anciens Premiers ministres Ahmed Ouyahia, Abdelmalek Sellal et des magnats comme Ali Haddad et Mahieddine Tahkout. \n\nLe mouvement Hirak, toutefois, reste sceptique face à ses promesses. Ces réformes mèneront-elles à une véritable démocratisation, ou ne sont-elles qu'un moyen de préserver le régime sous une nouvelle direction ?"
 algeria_reforms.1.a: "Soutenez les réformes de Tebboune"
 algeria_reforms.1.b: "Le peuple en demande davantage !"
 ALG_arrest_the_gang: "Arrêter l'entourage"
 ALG_arrest_the_gang_desc: "Le peuple algérien exige justice. Tebboune poursuivra les poursuites contre Ouyahia, Sellal, Haddad, Tahkout et d'autres figures corrompues qui ont drainé la richesse de la nation."
 ALG_at_a_crossroads: "La nation à la croisée des chemins"
 ALG_at_a_crossroads_desc: "Alors que notre nation affronte des défis sans précédent, nous sommes à un moment charnière de notre histoire. Les choix que nous ferons maintenant façonneront notre avenir et détermineront le cours de notre société. Embrasserons-nous le changement et la réforme, ou nous cramponnerons-nous au passé ? La voie que nous choisirons définira notre héritage."
 ALG_promises_of_reform: "Promesses de réforme"
 ALG_promises_of_reform_desc: "Une nouvelle Algérie exige une nouvelle constitution. Tebboune promet des réformes pour limiter les mandats présidentiels, renforcer le parlement et garantir davantage de libertés."
 ALG_suppressed_opposition: "Opposition réprimée"
 ALG_black_decade_methods: "Méthodes de la décennie noire"
 ALG_black_market: "Marché noir"
 ALG_pna_expansion: "Extension de l'ANP"
 ALG_global_power: "Puissance mondiale"
 ALG_crackdown_on_dissent: "Réprimer le Hirak"
 ALG_crackdown_on_dissent_desc: "Les manifestations n'ont pas cessé. Au lieu du dialogue, Tebboune a choisi la répression, espérant faire taire la dissidence et préserver l'État."
 ALG_rebuild_trust_investors: "Rétablir la confiance des investisseurs"
 ALG_rebuild_trust_investors_desc: "Après des années de corruption et d'instabilité, nous devons reconquérir la confiance des investisseurs étrangers et nationaux dans notre économie."
 ALG_diversify_economy: "Diversifier l'économie"
 ALG_diversify_economy_desc: "L'Algérie ne peut pas s'appuyer uniquement sur le pétrole et le gaz. Les renouvelables, l'agriculture et l'industrie seront les piliers de notre avenir."
 ALG_social_subsidies: "Protéger les subventions sociales"
 ALG_social_subsidies_desc: "Le peuple dépend des subventions pour le carburant, le pain et le logement. Tebboune promet de maintenir ces protections malgré les défis économiques."
 ALG_balance_regional_powers: "Équilibrer les pouvoirs régionaux"
 ALG_balance_regional_powers_desc: "L'Algérie se tient entre l'Europe, l'Afrique et le monde arabe. Nous devons maintenir une politique étrangère équilibrée au service de nos intérêts."
 ALG_strengthen_russia_ties: "Renforcer les liens avec la Russie"
 ALG_strengthen_russia_ties_desc: "Notre amitié historique avec Moscou peut s'approfondir par la coopération de défense et des accords énergétiques."
 ALG_china_investments: "Investissements chinois"
 ALG_china_investments_desc: "L'initiative des Nouvelles routes de la soie offre à l'Algérie une chance de moderniser ses infrastructures et d'attirer d'importants projets d'investissement chinois."
 ALG_north_south_highway: "Projet d'autoroute Nord-Sud"
 ALG_automobile_factories: "Industrie automobile"
 ALG_automobile_factories_desc: "Pour employer notre population et gagner en capacité économique, nous pourrions devoir inviter des constructeurs automobiles étrangers dans notre pays."
 algeria_policy.1.t: "Dénoncer les régimes colonialistes"
 algeria_policy.1.d: "Le FLN a publié une ferme condamnation des régimes colonialistes passés, dénonçant les crimes commis durant l'occupation de l'Algérie. La déclaration a suscité la fierté nationale au pays mais a provoqué la colère à Paris, détériorant les relations algéro-françaises."
 algeria_policy.1.a: "Exposer les crimes du colonialisme !"
 algeria_disaster.1.t: "Le séisme de Boumerdès"
 algeria_disaster.1.d: "Un séisme dévastateur a frappé le nord de l'Algérie, centré près de la ville de Boumerdès. Des milliers de personnes ont perdu la vie, des dizaines de milliers d'autres sont blessées, et de vastes parties d'Alger et de la région côtière sont réduites en ruines. La nation est sous le choc tandis que les secours peinent à faire face à l'ampleur du désastre. Une action immédiate est requise pour rétablir l'ordre et porter secours à la population touchée."
 algeria_disaster.1.a: "Mobiliser les équipes d'urgence et commencer la reconstruction"
 ALG_earthquake_recovery_tt: "Les opérations de sauvetage commencent. Le gouvernement décidera bientôt comment financer la reconstruction."
 algeria_disaster.2.t: "Efforts de reconstruction et de relèvement"
 algeria_disaster.2.d: "Les lendemains du séisme laissent l'Algérie face à l'une des pires crises humanitaires de son histoire moderne. Des milliers de personnes restent sans abri et les infrastructures vitales sont en ruines. Le gouvernement doit décider comment financer la reconstruction : soit en créant un fonds d'aide national sur ressources d'État, soit en sollicitant une assistance étrangère, qui pourra s'accompagner de contreparties politiques."
 algeria_disaster.2.a: "Créer un fonds d'aide d'État"
 ALG_state_aid_fund_tt: "Allouer des ressources d'État à la reconstruction des régions touchées. Cela pèsera sur le Trésor mais renforcera la confiance intérieure dans le gouvernement."
 algeria_disaster.2.b: "Solliciter une aide étrangère"
 ALG_foreign_aid_dependence_tt: "Demander l'aide de partenaires internationaux. Cela allégera la pression financière mais accroîtra l'influence étrangère sur les affaires intérieures de l'Algérie."
 ALG_french_influence: "L'influence française dans l'ombre"
 ALG_french_influence_desc: "Indépendante sur le papier, la politique algérienne demeure sous l'ombre de l'influence française. Généraux et politiciens corrompus liés à Paris façonnent la décision, limitant la véritable souveraineté."
 ALG_shadow_state: "Le Pouvoir dans l'ombre"
 ALG_shadow_state_desc: "Le réseau occulte de généraux, d'officiers du renseignement et d'hommes d'affaires, souvent appelé « Le Pouvoir », domine l'Algérie. La corruption affaiblit l'État, mais ce système de l'ombre assure la stabilité politique et renforce l'emprise du régime."
 algeria_emerging_youth: "Organisations de jeunesse"
 algeria_nationalist_youth: "Organisations de jeunesse"
 algeria_nationalist_rise: "Renouveau nationaliste"
 algeria_nationalist_rise_desc: "Le nationalisme en Algérie n'a jamais été aussi populaire. En raison de l'opposition claire du gouvernement à l'ingérence étrangère et de son ferme soutien à la souveraineté et à l'indépendance de l'État"
 algeria_cultural_rebirth: "Renaissance culturelle"
 ALG_PNA_victory: "Règne militaire"
 ALG_PNA_victory_desc: "L'Armée nationale populaire est l'armée de l'Algérie. Depuis l'indépendance en 1962, elle a joué un grand rôle en politique. Elle a pratiquement contrôlé le gouvernement jusqu'en 1988, lorsqu'un système multipartite a été établi. Elle conserve toutefois une influence sur la politique algérienne, le plus récent exemple étant l'abdication du président Abdelaziz Bouteflika en 2019 après que les manifestations lui ont fait perdre le soutien de l'armée."
 ALG_kick_out_morocco: "Expulser le Maroc"
 ALG_kick_out_morocco_desc: "Le Maroc nous a toujours soumis à son contrôle et rien ne justifie de maintenir nos liens avec lui. Il est temps de chasser ces ennemis idéologiques hors d'Algérie !"
 ALG_statist_rise: "Augmentation des statistiques"
 ALG_statist_rise_desc: "L'économie libérale permet l'exploitation de notre peuple et compromet notre indépendance nationale et notre contrôle. Il vaut mieux pour l'Algérie de relier chaque aspect de l'économie à l'État."
 ALG_maintain_military_role: "Maintenir les leviers de l’armée"
 ALG_maintain_military_role_desc: "Le monde entre dans des temps sombres et étranges : nous devons protéger notre nation, quel qu'en soit le coût."
 ALG_kick_out_iran: "Expulser l’Iran"
 ALG_kick_out_iran_desc: "L'Iran nous a toujours soumis à son contrôle et rien ne justifie de maintenir nos liens avec lui. Il est temps de chasser ces ennemis idéologiques hors d'Algérie !"
 ALG_nationalize_oligarchic_holdings: "Nationaliser les avoirs"
 ALG_nationalize_oligarchic_holdings_desc: "Nous nationaliserons les avoirs et propriétés de divers oligarques voyous afin de renforcer notre emprise sur l'économie."
 ALG_subsidise_police: "Subventionner la police"
 ALG_subsidise_police_desc: "La police est l'un des éléments les plus importants pour que notre peuple se sente en sécurité et pour garantir notre règne en Algérie, et elle a été très sous-financée. Cela doit changer."
 ALG_maintain_socialistic_policies: "Maintenir les lois socialistes"
 ALG_maintain_socialistic_policies_desc: "Une chose que le gouvernement précédent a bien faite, et la raison ultime de sa relative popularité, ce sont ses politiques socialistes en faveur des classes inférieures. Nous poursuivrons les politiques mises en œuvre par l'ancien président Hafez el-Assad et nous présenterons comme les véritables défenseurs des opprimés."
 ALG_government_planned_economic_projects: "Projets gouvernementaux"
 ALG_government_planned_economic_projects_desc: "Nous devons lancer des projets publics pour améliorer notre image de gouvernement responsable et rassembler le soutien du peuple."
 ALG_patriotic_propaganda: "Propagande patriotique"
 ALG_patriotic_propaganda_desc: "Nous renforcerons nos positions idéologiques en soulignant l'importance de la fierté nationale et de la loyauté envers l'État."
 ALG_gather_support_from_peasantry: "Soutien à la paysannerie"
 ALG_gather_support_from_peasantry_desc: "Les paysans sont l'épine dorsale de notre nation et nous devons nous assurer de leur soutien."
 ALG_strong_government: "Gouvernement fort"
 ALG_strong_government_desc: "Nous devrons montrer à notre peuple que notre gouvernement est stable et capable de gouverner. Cela nous permettra de gagner sa confiance"
 ALG_expand_youth_organizations: "Développer les organisations de jeunesse"
 ALG_expand_youth_organizations_desc: "Nos partis se sont notablement appuyés sur les organisations de jeunesse et, maintenant que nous sommes au pouvoir, il est temps d'encourager la jeunesse à soutenir nos causes idéologiques en gagnant les cœurs et les esprits."
 ALG_illiberal_democracy: "Démocratie illibérale"
 ALG_illiberal_democracy_desc: "Le libéralisme est un virus qui infecte et exploite les nations pauvres. Ce dont le peuple a besoin, c'est d'une vraie démocratie qui le représente vraiment et l'unit sous une même bannière. Nous sommes une démocratie, quoi qu'on en dise."
 ALG_reestablish_intelligence_committee: "Rétablir les agences Intel"
 ALG_reestablish_intelligence_committee_desc: "Les guerres de demain ne se feront pas avec des fusils et des chars, mais avec l'information. Il est de notre responsabilité de créer un service de renseignement pleinement fonctionnel."
 ALG_national_security_act: "Loi sur la sécurité nationale"
 ALG_national_security_act_desc: "Les groupes extrémistes tuent lentement notre nation et menacent notre peuple. Leurs attaques sont une menace claire et nous devons les arrêter immédiatement, quel qu'en soit le coût, quoi qu'il arrive. LE TERRORISME DOIT CESSER."
 ALG_pan_algerian_nationalism: "Panalgérisme"
 ALG_pan_algerian_nationalism_desc: "L'Algérie est le pays qui devrait illuminer toute l'Afrique du Nord par son identité unique. Notre riche histoire et notre culture rendent clair qu'il est de notre devoir de montrer au monde notre véritable potentiel et notre identité."
 ALG_cultural_rebirth: "Renaissance culturelle"
 ALG_cultural_rebirth_desc: "Notre nation reconnaît lentement mais sûrement son identité. Les divisions mesquines ne doivent pas empêcher de réaliser la beauté de notre peuple. Notre peuple doit reconnaître que, quoi qu'il arrive, nous sommes encore Algériens après tout."
 ALG_deal_with_the_trade_unions: "Un accord avec les syndicats"
 ALG_deal_with_the_trade_unions_desc: "La clé d'un pays fort est sa production et son économie : nous devons nous assurer que tous les travailleurs d'Algérie nous soutiennent."
 ALG_reassert_russian_ties: "Cravates russes"
 ALG_reassert_russian_ties_desc: "La Russie est le seul et véritable allié qui nous aide à devenir une nation moderne, sûre et prospère."
 ALG_russian_oil_excavation: "Offres sur le pétrole russe"
 ALG_russian_oil_excavation_desc: "Il y a un grand trésor dans notre nation et notre alliée, la Russie, nous aidera à atteindre ces ressources."
 ALG_russian_algiers_base_expansion: "Élargir la présence navale russe"
 ALG_russian_algiers_base_expansion_desc: "Nous ne pouvons pas créer une marine forte immédiatement, mais nos amis russes nous aideront à garder nos côtes en sûreté en aidant à étendre les capacités du port."
 ALG_houarist_rise: "Montée Houariste"
 ALG_houarist_rise_desc: "Le houarisme se relève et est prêt à rendre à l'Algérie sa grandeur."
 ALG_islamic_socialism: "Socialisme islamique"
 ALG_islamic_socialism_desc: "Les gens semblent oublier que l'islam prône de nombreuses pratiques attribuées au socialisme, comme la zakat et la sadaqa. Nous devons souligner ce lien en fondant nos idéaux dessus, ce qui rassemblera aussi le soutien des islamistes qui se sont toujours opposés à nos idéaux. Le socialisme islamique est la vraie voie vers une république moderne, forte et vertueuse."
 ALG_Get_rid_of_oligarchs: "Purger les oligarques"
 ALG_news.1.t: "L'Algérie à la croisée des chemins"
 ALG_news.1.d: "Après près d'une décennie de violence brutale, de désintégration économique et de stagnation politique, l'Algérie de l'an 2000 se trouve à un moment décisif. La guerre civile, que beaucoup appellent la « Décennie noire », a laissé des dizaines de milliers de morts et bien davantage de déplacés. Si l'intensité des combats a diminué, les tensions restent élevées et les plaies sont loin d'être cicatrisées.\n\nL'avenir de la nation étant incertain, des forces concurrentes poussent désormais dans des directions différentes. Une voie cherche la réconciliation nationale et des réformes démocratiques pour unifier le pays. Une autre penche pour prolonger l'état d'urgence, maintenant l'emprise du régime actuel. Une troisième murmure la poursuite de la guerre, des batailles inachevées, des promesses radicales, et ceux qui refusent de déposer les armes.\n\nLa route que l'Algérie choisira ensuite pourra façonner son destin pour des générations."
 ALG_news.1.a: "Tous les regards sont tournés vers Alger."
 Arab_Defense_Bloc: "Bloc de défense arabe"
 The_Maghreb_Joint_Defense: "La défense conjointe du Maghreb"
 ALG_bouteflika.3.t: "Crise sanitaire de Bouteflika"
 ALG_bouteflika.3.d: "En 2013, Bouteflika a subi un accident vasculaire cérébral débilitant. Un journaliste, Hichem Aboud, a été poursuivi pour atteinte à la sécurité nationale, à l'intégrité territoriale et à la gestion normale des institutions de la République, et les journaux pour lesquels il écrivait ont été censurés, parce qu'il avait écrit que le président était revenu du Val-de-Grâce dans un état comateux et avait caractérisé Saïd Bouteflika comme le marionnettiste dirigeant l'administration."
 ALG_bouteflika.3.a: "Que va-t-il se passer ?"
 ALG_boteflika_tt: "Cela déverrouillera le focus Crise de santé du président algérien"
 ALG_bouteflika: "Actualité : crise sanitaire de Bouteflika"
 ALG_bouteflika.2.t: "Élection présidentielle algérienne de 2014"
 ALG_bouteflika.2.d: "Des élections présidentielles se sont tenues en Algérie le 17 avril 2014. Le président sortant Abdelaziz Bouteflika a été réélu avec 82 % des voix. Les enjeux de la campagne comprenaient le désir de stabilité intérieure après la sanglante guerre civile des années 1990"
 ALG_bouteflika.2.a: "Bouteflika gagne"
 ALG_bouteflika_health_crisis: "Crise sanitaire de Bouteflika"
 ALG_bouteflika_health_crisis_desc: "La santé déclinante du président menace de déstabiliser l'Algérie. Le garderons-nous au pouvoir ou préparerons-nous une transition ?"
 ALG_2014_elections: "Élection présidentielle de 2014"
 ALG_2014_elections_desc: "Malgré sa maladie, Bouteflika se présente pour un quatrième mandat. L'opposition est muselée, et les résultats sont une conclusion d'avance."
 ALG_2014_oil_crash: "Effondrement du prix du pétrole"
 ALG_2014_oil_crash_desc: "L'effondrement des prix du pétrole dévaste l'économie algérienne. Le peuple blâme la corruption et exige le changement."
 ALG_silence_hirak: "Écraser les manifestations du Hirak"
 ALG_silence_hirak_desc: "L'armée et la police réprimeront la dissidence. Les rues seront rouges de sang, mais le régime survivra."
 ALG_listen_to_hirak: "Céder aux exigences réformistes"
 ALG_listen_to_hirak_desc: "Promettre des réformes politiques pour apaiser les manifestants. La vieille garde résistera, mais la colère du peuple pourra s'apaiser."
 ALG_2019_elections: "Crise politique de 2019"
 ALG_2019_elections_desc: "La candidature de Bouteflika à un cinquième mandat enflamme la fureur nationale. L'Algérie basculera-t-elle dans la révolution ou se soumettra-t-elle à la tyrannie ?"
 ALG_new_president: "Nommer un nouveau président"
 ALG_new_president_desc: "Le mouvement Hirak a gagné. Un gouvernement de transition organisera des élections libres, mettant fin à des décennies de règne autoritaire."
 ALG_release_political_prisoners: "Libérer les prisonniers politiques"
 ALG_release_political_prisoners_desc: "Des milliers d'activistes, de journalistes et de figures d'opposition languissent en détention pour leur rôle dans les manifestations du Hirak. Les libérer signalerait une véritable rupture avec l'ancien régime et renforcerait la légitimité démocratique."
 ALG_corrupt_successor: "Installer un successeur loyaliste"
 ALG_corrupt_successor_desc: "L'armée s'assure qu'une marionnette prenne le pouvoir. L'héritage de corruption de Bouteflika survit."
 alg_oil_crash_title: "Effondrement des prix du pétrole"
 alg_oil_crash_desc: "Les prix du pétrole s'effondrent : notre nation survivra-t-elle ?"
 alg_oil_crash_option: "C'est préoccupant !"
 alg_hirak_victory_title: "Le peuple gagne"
 alg_hirak_victory_desc: "Après des années de manifestations, Bouteflika se retire. Une ère nouvelle commence, mais tiendra-t-elle ?"
 alg_military_rule_title: "Les généraux décident"
 alg_military_rule_desc: "L'armée installe un dirigeant fantoche. Le Hirak est écrasé pour l'heure."
 algeria_tebboune.1.t: "Les élections présidentielles de 2019"
 algeria_tebboune.1.d: "Après des mois de manifestations et la démission d'Abdelaziz Bouteflika, les Algériens se rendent aux urnes pour l'élection la plus disputée depuis des décennies. Beaucoup voient le processus dominé par la vieille garde, tandis que d'autres s'accrochent à l'espoir d'une réforme, voire d'un renouveau islamiste. Trois candidats principaux se sont imposés : Abdelmadjid Tebboune, candidat de la continuité lié à l'establishment ; Ali Benflis, réformiste libéral avec son propre mouvement ; et Abdelkader Bengrina, dirigeant islamiste lié au Mouvement de la société pour la paix. Le choix déterminera la voie future de l'Algérie."
 algeria_tebboune.1.a: "Élire Abdelmadjid Tebboune"
 algeria_tebboune.1.b: "Élire Ali Benflis"
 algeria_tebboune.1.c: "Élire Abdelkader Bengrina"
 ALG_benflis_tt: "§YAli Benflis§! devient président de l'Algérie, à la tête des réformistes libéraux."
 ALG_bengrina_tt: "§YAbdelkader Bengrina§! devient président de l'Algérie, représentant l'opposition islamiste."
 kabyle_resistance_info: "La région kabyle connaît des troubles. Niveau de résistance : [?state_resistance@438|%Y]"
 kabyle_resistance_effects: "Surveiller la Kabylie pour une montée du soutien séparatiste. Résistance actuelle : [?state_resistance@385|%Y]"
 ALG_kabyle_resistance_tooltip: "Niveau de résistance en Kabylie :"
 ALG_suppress_kabyle: "Réprimer le mouvement kabyle"
 ALG_suppress_kabyle_desc: "Les troubles kabyles menacent la souveraineté nationale. Nous ne pouvons laisser prospérer une rhétorique sécessionniste. Une répression ferme sera peut-être le seul moyen de rétablir le contrôle, même au prix d'une résistance féroce."
 ALG_recognize_kabyle: "Reconnaître l'indépendance kabyle"
 ALG_recognize_kabyle_desc: "Des décennies de tensions, de protestations et de troubles nous ont menés à ce moment. Il est peut-être temps de reconnaître les aspirations kabyles à l'indépendance. Cela mettrait fin aux troubles immédiats, mais au prix de l'intégrité territoriale."
 ALG_recognize_tamazight: "Reconnaître le tamazight"
 ALG_recognize_tamazight_desc: "Reconnaître le tamazight comme langue officielle est une revendication clé de la population kabyle. Cela pourra légitimer leur identité culturelle tout en préservant l'unité nationale."
 ALG_kabyle_cultural_reforms: "Réformes culturelles kabyles"
 ALG_kabyle_cultural_reforms_desc: "Nous devons soutenir l'éducation, les institutions locales et les droits culturels en région kabyle afin de favoriser l'intégration et le respect mutuel."
 ALG_internal_troops_kabyle: "Déployer les troupes internes"
 ALG_internal_troops_kabyle_desc: "La situation en Kabylie exige une forte présence sécuritaire. Nous déploierons des troupes internes pour sécuriser la région et réprimer les troubles."
 ALG_disrupt_kabyle_networks: "Perturber les réseaux politiques kabyles"
 ALG_disrupt_kabyle_networks_desc: "L'activité séparatiste est coordonnée par des réseaux politiques clandestins. La disruption par la surveillance et les arrestations est nécessaire pour préserver la sécurité nationale."
 KBY_build_a_new_state: "Construire un nouvel État"
 KBY_build_a_new_state_desc: "Désormais indépendants, nous devons poser les fondations d'une république fonctionnelle. Une constitution, une gouvernance et des services sociaux sont les priorités."
 KBY_secure_our_borders: "Sécuriser nos frontières"
 KBY_secure_our_borders_desc: "Notre souveraineté proclamée, nous devons fortifier nos frontières vulnérables et assurer notre survie dans un environnement hostile."
 idea_ALG_neutrality: "Neutralité de l’Algérie"
 idea_ALG_neutrality_desc: "L'Algérie ne peut plus se permettre la guerre : la neutralité est notre meilleure option."
 idea_ALG_neutrality_2: "Neutralité de l’Algérie"
 idea_ALG_neutrality_2_desc: ""
 ALG_a_globalized_algeria: "Une Algérie mondialisée"
 ALG_a_globalized_algeria_desc: "Nous vivons une ère de mondialisation, à laquelle l'Algérie doit participer."
 ALG_international_investments: "Investissements internationaux"
 ALG_international_investments_desc: ""
 ALG_export_driven_growth: "Croissance tirée par les exportations"
 ALG_export_driven_growth_desc: ""
 ALG_promote_sovereignty: "Promouvoir la souveraineté"
 ALG_promote_sovereignty_desc: ""
 ALG_promote_human_rights: "Promouvoir les droits de l'homme"
 ALG_promote_human_rights_desc: "Les droits de l'homme avant tout, même au-dessus de la souveraineté nationale."
 ALG_extract_favorable_terms: "Extraire des conditions favorables"
 ALG_extract_favorable_terms_desc: ""
 ALG_a_norm_entrepreneur: "Un entrepreneur normatif"
 ALG_a_norm_entrepreneur_desc: ""
 ALG_Algeria_resplendent: "L'Algérie resplendissante"
 ALG_Algeria_resplendent_desc: ""
 ALG_national_strength: "Puissance nationale"
 ALG_national_strength_desc: ""
 ALG_terror_2003_hostage_title: "Crise des otages au Sahara"
 ALG_terror_2003_hostage_desc: "Un groupe de touristes européens a été pris en otage dans le désert algérien par des militants islamistes. Aucune victime n'a été signalée, mais cela marque le début d'une hausse inquiétante de l'activité djihadiste organisée."
 ALG_terror_2003_hostage_option: "Un signe inquiétant de ce qui nous attend"
 ALG_terror_monitor: "Surveiller la menace terroriste"
 ALG_conduct_security_raids: "Mener des raids sécuritaires"
 ALG_terror_threat_category: "Moniteur des menaces terroristes"
 ALG_terror_2007_algiers_title: "Attentats à la bombe à Alger"
 ALG_terror_2007_algiers_desc: "Un attentat-suicide massif a frappé le palais du gouvernement à Alger. Plus de 30 civils et agents ont été tués dans l'une des attaques les plus meurtrières de ces dernières années."
 ALG_terror_2007_batna_title: "Bombardement de Batna"
 ALG_terror_2007_batna_desc: "Un kamikaze a fait exploser un engin près d'une foule attendant de voir le président à Batna. L'attentat a fait plus de 20 morts."
 ALG_terror_2008_issers_title: "Attentat à la bombe à l'école de police d'Issers"
 ALG_terror_2008_issers_desc: "Un attentat-suicide à la voiture piégée a visé des recrues de police à l'académie d'Issers, tuant 43 personnes et en blessant des dizaines."
 ALG_terror_generic_option: "Une nouvelle tragique."
 ALG_terror_2000_bus_ambush_title: "Embuscade de bus près de Médéa"
 ALG_terror_2000_bus_ambush_desc: "Des militants armés ont tendu une embuscade meurtrière à un bus de voyageurs près de Médéa. Dix-neuf civils ont perdu la vie. Cet attentat signale une instabilité persistante dans l'après-guerre civile."
 ALG_terror_2002_tazmalt_title: "Bombardement de Tazmalt"
 ALG_terror_2002_tazmalt_desc: "Une bombe a explosé à Tazmalt, tuant et blessant plusieurs civils. Les forces de sécurité suspectent des reliquats du GSPC."
 ALG_terror_2002_miliana_title: "Bombardement de Miliana"
 ALG_terror_2002_miliana_desc: "Un engin piégé en bord de route a explosé près de Miliana, blessant plusieurs soldats."
 ALG_terror_2002_hammam_title: "Attentat à la bombe contre Hammam Righa"
 ALG_terror_2002_hammam_desc: "Un engin explosif artisanal a détoné à Hammam Righa, visant un convoi militaire."
 ALG_terror_2002_larbaa_title: "Bombardement de Larbaa"
 ALG_terror_2002_larbaa_desc: "Des militants ont fait exploser une bombe à Larbaâ, poursuivant leur campagne contre les autorités de l'État."
 ALG_terror_2002_msila_title: "Attentat à la bombe de M'Sila"
 ALG_terror_2002_msila_desc: "Un IED a explosé à M'Sila, illustrant encore la persistance des réseaux terroristes dans la région."
 ALG_terror_2003_tizi_title: "Attentat à la bombe de Tizi Ouzou"
 ALG_terror_2003_tizi_desc: "Une explosion meurtrière a eu lieu à Tizi Ouzou. Des civils figuraient parmi les morts, et les forces de sécurité suspectent l'implication du GSPC."
 ALG_terror_2004_tebessa_title: "Bombardement de Tébessa"
 ALG_terror_2004_tebessa_desc: "Un attentat coordonné à Tébessa a tué 7 personnes. L'ampleur croissante des attaques est alarmante."
 ALG_idea_arab_diplomacy: "Diplomatie arabe"
 ALG_terror_2005_tidjelabine_title: "Attentat à la bombe à Tidjelabine"
 ALG_terror_2005_tidjelabine_desc: "Deux gendarmes ont été tués à Tidjelabine après qu'une voiture piégée a frappé leur patrouille."
 ALG_relying_on_our_own_strength_spirit: "Compter sur nos propres forces"
 ALG_relying_on_our_own_strength_spirit_desc: "L'Algérie n'a besoin que des Algériens pour prospérer, de personne d'autre."
 ALG_hydroelectric_power_plants_upgraded_idea: "§RSonatrach§! - centrales hydroélectriques modernisées"
 FLN_nationalize_resources: "Nationaliser les ressources"
 FLN_nationalize_resources_desc: "Les ressources naturelles de l'Algérie sont la clé de sa souveraineté et de sa prospérité. En nationalisant nos ressources, nous pouvons garantir que la richesse issue du pétrole, du gaz et des minerais bénéficie directement au peuple algérien, posant les bases d'une indépendance économique à long terme."
 ALG_revivify_non_aligned_movement: "Raviver le mouvement des non-alignés"
 ALG_revivify_non_aligned_movement_desc: "Fier membre du mouvement des non-alignés, l'Algérie doit relancer ce bloc de nations indépendantes. En renforçant les liens avec d'autres États neutres, nous pourrons résister à la domination des superpuissances et forger une voie de véritable souveraineté dans un monde divisé."
 ALG_reach_out_ASEAN: "Tendre la main à l'ASEAN"
 ALG_reach_out_ASEAN_desc: "Les nations d'Asie du Sud-Est partagent notre désir d'un développement libre de l'ingérence étrangère. Une coopération plus étroite avec l'ASEAN ouvrira de nouvelles opportunités économiques tout en renforçant un ordre mondial multipolaire."
 ALG_support_developing_world: "Soutenir le monde en développement"
 ALG_support_developing_world_desc: "L'Algérie est solidaire des nations opprimées et appauvries. Par l'aide économique, les échanges techniques et le plaidoyer diplomatique, nous pourrons contribuer à élever le Sud global et défier l'exploitation néocoloniale."
 ALG_between_east_and_west: "Entre l'Est et l'Ouest"
 ALG_between_east_and_west_desc: "Prise entre des blocs rivaux, l'Algérie doit naviguer avec prudence. En maintenant des relations équilibrées avec les puissances capitalistes et socialistes, nous pourrons obtenir des investissements vitaux sans céder notre indépendance à aucun camp."
 ALG_mediate_great_power_conflict: "Médier le conflit des grandes puissances"
 ALG_mediate_great_power_conflict_desc: "Alors que les tensions montent entre les superpuissances, l'Algérie peut servir d'intermédiaire honnête. Notre neutralité et notre autorité morale nous placent en position de désamorcer les crises et de promouvoir la coexistence pacifique dans un monde de plus en plus instable."
 ALG_promote_reconciliation: "Promouvoir la réconciliation"
 ALG_promote_reconciliation_desc: "De l'Afrique au Moyen-Orient, les conflits font rage entre frères. L'Algérie, avec son héritage révolutionnaire et son expérience diplomatique, doit favoriser le dialogue et l'unité parmi les nations divisées."
 ALG_secure_balance: "Solde sécurisé"
 ALG_secure_balance_desc: "Dans un monde d'hégémonies concurrentes, l'équilibre est notre sauvegarde. En calibrant soigneusement notre politique étrangère, nous pourrons empêcher la domination d'une seule puissance tout en tirant le maximum de bénéfices de toutes."
 ALG_joining_brics: "Rejoignez les BRICS"
 ALG_joining_brics_desc: "L'Algérie cherche à renforcer son influence mondiale en rejoignant le groupe BRICS des économies émergentes, améliorant à la fois la croissance économique et la coopération politique."
 ALG_align_with_brazil: "Renforcer les liens avec le Brésil"
 ALG_align_with_brazil_desc: "Le Brésil, comme l'Algérie, cherche une voie indépendante dans les affaires mondiales. En approfondissant notre partenariat avec ce géant sud-américain, nous pourrons accroître le commerce agricole et technologique tout en présentant un front uni contre les pressions néocoloniales dans les forums mondiaux."
 ALG_align_with_india: "Forger un partenariat stratégique avec l'Inde"
 ALG_align_with_india_desc: "La position non-alignée de l'Inde et sa puissance industrielle croissante en font un allié naturel. Collaborer sur des projets énergétiques, des échanges militaires et la diplomatie à l'ONU renforcera nos deux nations face à la domination des superpuissances tout en favorisant la coopération Sud-Sud."
 ALG_islamic_monarchy_idea: "Monarchie islamique"
 ALG_islamic_monarchy_idea_desc: "L'Algérie a restauré une monarchie divine enracinée dans les principes islamiques et la tradition nationale."
 ALG_caliph_crowned: "Calife couronné"
 ALG_caliph_crowned_desc: "Le calife règne non seulement par la loi, mais par la volonté du peuple et l'héritage de la foi."
 ALG_amir_al_muminin_idea: "Amir al-Mu'minin"
 ALG_amir_al_muminin_idea_desc: "Commandeur des croyants, un titre au poids spirituel et politique dans tout le monde islamique."
 ALG_maghreb_alliance_idea: "Piliers du Maghreb"
 ALG_maghreb_alliance_idea_desc: "L'Algérie mène un effort pour unifier le monde islamique occidental sous un nouvel ordre religieux et politique."
 ALG_restore_caliphate_in_algiers: "Restaurer le califat à Alger"
 ALG_restore_caliphate_in_algiers_desc: "La république a échoué. L'heure est venue de restaurer une monarchie divine, enracinée dans la foi et l'histoire. D'Alger s'élèvera un nouveau califat."
 ALG_crown_the_caliph: "Couronner le calife"
 ALG_crown_the_caliph_desc: "Un héritier légitime du califat a été choisi. Par une cérémonie à Alger, la couronne sera restaurée et le monde reconnaîtra le nouvel amir al-Mu'minin."
 ALG_amir_al_muminin: "L'amir al-Mu'minin"
 ALG_amir_al_muminin_desc: "Nous déclarons le calife amir al-Mu'minin, Commandeur des croyants. Ce titre lui confère une légitimité spirituelle et politique dans tout le monde islamique."
 ALG_umayyad_legacy: "Proclamer l'héritage omeyyade"
 ALG_umayyad_legacy_desc: "L'Algérie invoque la mémoire des Omeyyades, dont la gloire s'étendit jadis sur des continents. Nous nous positionnons comme les héritiers de leur legs."
 ALG_reclaim_al_andalus: "Récupérer al-Andalus"
 ALG_reclaim_al_andalus_desc: "Les terres d'al-Andalus furent jadis le joyau du monde islamique. L'heure est venue de les reconquérir et de faire renaître notre ancienne civilisation en Ibérie."
 ALG_reclaim_the_crown: "Reconquérir la couronne"
 ALG_reclaim_the_crown_desc: "L'heure est venue de restaurer une monarchie légitime, guidée par le divin et enracinée dans la légitimité islamique. Sur les cendres de l'échec républicain et de la guerre civile, nous ressusciterons la couronne historique, unissant la nation sous un étendard royal de foi, d'ordre et d'héritage. Qu'il s'agisse d'un successeur abbasside, d'une dynastie berbère renaissante ou d'un symbole de nouvelle unité islamique, la couronne brillera de nouveau sur l'Algérie."
 ALG_pillars_of_the_maghreb: "Les piliers du Maghreb"
 ALG_pillars_of_the_maghreb_desc: "L'Algérie cherche l'unité avec ses frères occidentaux, le Maroc et la Tunisie, pour former le fondement d'un bloc islamique uni en Afrique du Nord."
 ALG_monarchy_tt: "§OEn tant que nouveau monarque d'Algérie, nous collectons la jizya et la zakat auprès des fidèles. Par la guidance d'Allah, nous poursuivrons notre règne.§!"
 ALG_recovering_from_the_civil_war: "La décennie noire"
 ALG_recovering_from_the_civil_war_desc: "La guerre civile algérienne a laissé de profondes cicatrices sur la nation. Bien que le conflit soit terminé, ses effets persistent, influençant le paysage politique et la psyché nationale. Des années après la guerre civile, l'Algérie lutte encore avec ses ombres. Les plaies du conflit ne sont pas encore pleinement cicatrisées, mais la nation demeure déterminée à se reconstruire."
 MSP_non_aligned_revival: "Relancer la politique non alignée"
 MSP_non_aligned_revival_desc: "Nous raviverons l'esprit de neutralité et de solidarité du Sud, comme dans les années 1960."
 MSP_global_south_solidarity: "Solidarité mondiale du Sud"
 MSP_global_south_solidarity_desc: "L'Algérie renforcera ses liens avec les nations postcoloniales par le commerce, la diplomatie et l'aide."
 MSP_north_africa_first: "L’Afrique du Nord d’abord"
 MSP_north_africa_first_desc: "Nous nous concentrerons sur la direction de la diplomatie et du développement dans notre région immédiate."
 MSP_western_sahara_position: "Soutenez le Sahara occidental"
 MSP_western_sahara_position_desc: "Nous réaffirmons notre soutien à l'indépendance sahraouie contre les revendications marocaines."
 MSP_african_union_engagement: "Rejoindre l'Union africaine"
 MSP_african_union_engagement_desc: "L'Algérie doit réintégrer l'Union africaine et y jouer un rôle de premier plan dans la diplomatie continentale."
 MSP_sahel_initiatives: "S'étendre au Sahel"
 MSP_sahel_initiatives_desc: "Nous combattrons l'instabilité et le terrorisme au Sahel par le soft power et la défense."
 MSP_arab_world_outreach: "Approfondir les liens diplomatiques arabes"
 MSP_arab_world_outreach_desc: "Pour renforcer l'influence de l'Algérie dans le monde arabe, nous devons relancer notre diplomatie et nos efforts de coordination. Par des visites bilatérales, des sommets et des initiatives commerciales, l'Algérie peut s'affirmer comme une force d'union dans la région."
 MSP_join_arab_league: "Renforcer l’engagement de la Ligue arabe"
 MSP_join_arab_league_desc: "Membre déjà de la Ligue arabe, l'Algérie peut aller au-delà de la simple participation et jouer un rôle diplomatique de premier plan. Promouvoir la coordination économique, les consultations de défense et la solidarité culturelle renforcera notre rang dans le monde arabe."
 MSP_support_palestine: "Soutenir la cause palestinienne"
 MSP_support_palestine_desc: "L'Algérie s'est longtemps tenue aux côtés de la lutte palestinienne pour l'autodétermination. Un soutien diplomatique renouvelé, une aide humanitaire et un plaidoyer international réaffirmeront notre position de principe en défense des droits palestiniens."
 MSP_algeria_algiers_axis: "Forger l'axe Le Caire-Alger"
 MSP_algeria_algiers_axis_desc: "En se rapprochant de l'Égypte, l'Algérie peut contribuer à former un bloc régional puissant, capable de guider l'unité arabe, d'assurer la stabilité nord-africaine et de contrebalancer l'influence étrangère."
 MSP_condemn_israel: "Condamner les actions israéliennes"
 MSP_condemn_israel_desc: "Face à l'agression persistante et aux violations des droits de l'homme, l'Algérie condamnera officiellement les actions israéliennes sur la scène internationale, rassemblant les soutiens à une paix juste et s'opposant à toute normalisation sans règlement."
 MSP_palestinian_aid_package: "Programme d'aide palestinien"
 MSP_palestinian_aid_package_desc: "Nous allouerons des ressources pour fournir une assistance humanitaire, économique et technique aux territoires palestiniens, afin que l'engagement de l'Algérie aille au-delà des paroles et se traduise par une aide concrète."
 MSP_pan_african_defense_initiative: "Initiative de défense panafricaine"
 MSP_pan_african_defense_initiative_desc: "Pour protéger la souveraineté africaine et renforcer la stabilité continentale, l'Algérie proposera une initiative de défense africaine coordonnée, afin de bâtir une préparation militaire collective face aux menaces communes."
 MSP_send_troops_to_sahel: "Déployer des forces au Sahel"
 MSP_send_troops_to_sahel_desc: "Face à l'instabilité croissante au Sahel, l'Algérie enverra des troupes pour appuyer les opérations de maintien de la paix, la protection des frontières et les campagnes antiterroristes, en collaboration avec les gouvernements régionaux."
 MSP_sahel_stabilization_force: "Force de stabilisation du Sahel"
 MSP_sahel_stabilization_force_desc: "L'Algérie prendra la tête de la création d'une force permanente de stabilisation du Sahel, un cadre de sécurité africain destiné à contrer les insurrections et les réseaux criminels dans la région."
 MSP_exploit_sahel_resources: "Exploiter les ressources du Sahel"
 MSP_exploit_sahel_resources_desc: "L'influence algérienne au Sahel ouvre l'accès à des ressources naturelles inexploitées. En négociant des contrats miniers et d'infrastructure, nous pourrons garantir des gains économiques et des partenariats stratégiques dans la région."
 MSP_propose_maghreb_union: "Proposer l'Union du Maghreb"
 MSP_propose_maghreb_union_desc: "Il est temps de relancer la vision d'un Maghreb uni. L'Algérie prendra l'initiative de proposer de nouveaux efforts d'intégration, centrés sur la coopération économique, les infrastructures communes et l'alignement diplomatique."
 MSP_economic_integration_initiative: "Intégration économique maghrébine"
 MSP_economic_integration_initiative_desc: "Par la baisse des tarifs, l'investissement dans les infrastructures et des discussions de politique monétaire synchronisée, l'Algérie impulsera les efforts pour créer une zone économique maghrébine commune au bénéfice de tous les États membres."
 MSP_maghreb_joint_defense_pact: "Pacte de défense commune maghrébin"
 MSP_maghreb_joint_defense_pact_desc: "Un Maghreb sûr exige une défense collective. Nous proposerons un pacte militaire régional axé sur la protection des frontières, le partage du renseignement et des exercices conjoints."
 MSP_mediterranean_dialogue: "Le Dialogue méditerranéen"
 MSP_invite_iraq: "Inviter l'Irak"
 MSP_invite_iraq_desc: "Nous devons inviter l'Irak dans notre alliance : ils commencent lentement à se reprendre, et une coopération mutuelle nous serait grandement bénéfique"
 MSP_invite_syria: "Inviter la Syrie"
 MSP_invite_syria_desc: "Avoir la Syrie juste au sud de notre nation nous rend très vulnérables. L'inviter dans notre faction serait un excellent moyen de garantir notre sécurité"
 MSP_invite_algeria: "Inviter l'Égypte"
 MSP_invite_algeria_desc: "L'Égypte est une puissance montante, et avec une population de cette taille, notre alliance pourra accomplir pratiquement n'importe quoi"
 MSP_assistance_to_bulgaria: "Assistance à la Bulgarie"
 MSP_assistance_to_bulgaria_desc: "Nous devrions aider la Bulgarie à développer ses infrastructures afin de pouvoir plus facilement mener des investissements au-delà de ses frontières"
 MSP_supp_plo: "Soutenir l'OLP"
 MSP_supp_plo_desc: "L'Organisation de libération de la Palestine (OLP) a longtemps été un acteur clé de la lutte pour l'autodétermination palestinienne. Soutenir l'OLP pourrait renforcer notre standing auprès des alliés internationaux et favoriser un règlement pacifique du conflit."
 MSP_the_pal_issue: "La question palestinienne"
 MSP_the_pal_issue_desc: "La question de la Palestine demeure un enjeu central de notre politique étrangère. Notre position sur la lutte palestinienne définira nos alliances internationales et notre influence dans la région. Nous devons décider comment aborder ce conflit persistant."
 MSP_supp_hamas: "Soutenez le Hamas"
 MSP_supp_hamas_desc: "Le Hamas représente une faction importante de la résistance palestinienne. En lui apportant notre soutien, nous pouvons renforcer nos liens avec ce groupe, accroître notre influence régionale et nous aligner sur leur lutte."
 MSP_Get_rid_of_military_corrupt: "Purger les corrompus de l'armée"
 MSP_Get_rid_of_military_corrupt_desc: "L'armée est enracinée dans nos institutions et constitue une menace claire pour l'avenir du pays. Nous les arrêterons pour corruption et confisquerons les biens dont nous pourrons nous emparer"
 MSP_reverse_secularization: "Sécularisation inversée"
 MSP_arm_palestinians_to_fight: "Armer les Palestiniens"
 MSP_arm_palestinians_to_fight_desc: "La Jordanie abrite une importante population de réfugiés palestiniens. Nous pouvons en faire des combattants et les pousser à semer le chaos en Palestine et en Israël. Comme ce sont des proxies, nous pourrons pousser Israël à riposter, le faisant passer pour le mauvais camp du conflit"
 MSP_zionist_threat: "La menace sioniste"
 MSP_zionist_threat_desc: "Israël est le plus grand affront à tous les musulmans, un État factice abominable au cœur de l'islam. Il doit être rayé de la carte."
 ALG_kabyle_issue: "Question kabyle"
 ALG_kabyle_issue_map: "Satisfaction du peuple amazigh [KBY.GetFlag] à l'égard de notre gouvernement !"
 ALG_2014_oil_crash_idea: "Crash pétrolier"
 ALG_algeria_resplendent: "L'Algérie resplendissante"
 ALG_algeria_resplendent_desc: ""
 KBY_new_state_born: "Un nouvel État est né"
 KBY_new_state_born_desc: "La Kabylie est née à nouveau comme nation souveraine. Les premiers jours de notre indépendance doivent être marqués par la consolidation, la célébration et la prudence."
 KBY_border_readiness: "Préparation à la frontière"
 KBY_border_readiness_desc: "Nous devons sécuriser le périmètre de notre patrie pour prévenir infiltrations, contrebande ou incursions."
 KBY_new_institutions: "Nouveaux établissements"
 KBY_new_institutions_desc: "Un État fonctionnel doit reposer sur des institutions fiables et stables."
 KBY_state_economy_plan: "Plan économique d'État"
 KBY_state_economy_plan_desc: "Nous devons définir la structure de notre économie, qu'elle soit centralisée, de marché ou mixte."
 KBY_african_diplomacy: "Diplomatie africaine"
 KBY_african_diplomacy_desc: "Chercher une légitimité régionale auprès des voisins africains renforcera notre standing et nos opportunités économiques."
 KBY_international_recognition_campaign: "Campagne de reconnaissance internationale"
 KBY_international_recognition_campaign_desc: "Notre survie dépend de la légitimité aux yeux des autres nations. Lancer une offensive diplomatique ciblée."
 KBY_international_recognition_campaign_completion: "Les canaux diplomatiques sont ouverts : commence maintenant le dur travail de persuasion."
 KBY_establish_governance_structures: "Établir des structures de gouvernance"
 KBY_establish_governance_structures_desc: "Des institutions doivent être créées pour garantir la pérennité de nos principes de gouvernement."
 KBY_establish_governance_structures_completion: "Les institutions gouvernementales sont désormais opérationnelles, prêtes à servir nos citoyens."
 KBY_plan_the_economy: "Planifier l'économie"
 KBY_plan_the_economy_desc: "Décider de notre avenir économique : dirigiste, libéral ou mixte. Chaque voie offre des compromis uniques."
 KBY_plan_the_economy_completion: "Planification économique en cours : choisissez avec sagesse pour la prospérité à long terme."
 KBY_seek_regional_support: "Rechercher un soutien régional"
 KBY_seek_regional_support_desc: "Le soutien de nos voisins et de la communauté africaine renforcera notre légitimité."
 KBY_seek_regional_support_completion: "Des efforts de sensibilisation régionaux ont été déployés, en attente de réponses."
 KBY_secure_internal_stability: "Assurer la stabilité intérieure"
 KBY_secure_internal_stability_desc: "Les menaces extérieures sous contrôle, nous devons traiter la dissidence et la résistance internes."
 KBY_secure_internal_stability_completion: "Protocoles de sécurité activés, l'ordre public s'est amélioré."
 KBY.10.t: "Établir des relations internationales"
 KBY.10.d: "Notre indépendance désormais reconnue par la communauté internationale, il est temps pour la Kabylie d'établir des relations diplomatiques formelles avec d'autres nations. Nos diplomates sont prêts à s'adresser à des partenaires potentiels, en commençant par la France, vu nos liens historiques, et la Turquie, qui a montré de l'intérêt pour la cause amazighe.\n\nCette offensive diplomatique aidera à légitimer notre jeune nation et ouvrira des portes pour une coopération future."
 KBY.10.a: "Nous nous adresserons à toutes les nations !"
 KBY.15.t: "À la recherche de l’unité africaine"
 KBY.15.d: "Notre initiative de diplomatie africaine a posé les bases d'une intégration plus profonde avec le continent. L'Union africaine représente un forum important pour notre nation : l'adhésion fournirait légitimité, opportunités économiques et une tribune pour plaider les droits amazighs à travers l'Afrique du Nord.\n\nLe Niger, avec sa importante population touarègue, a exprimé son soutien à notre candidature."
 KBY.15.a: "Postuler à l'Union africaine"
 KBY_diplomatic_move: "Poussée diplomatique kabyle"
 KBY_au_membership_attempt: "Tentative d'adhésion de la Kabylie à l'UA"
 KBY_state_economy_model_statist: "Une économie dirigée par l’État"
 KBY_state_economy_model_liberal: "Économie de marché libérale"
 KBY_state_economy_model_mixed: "Modèle économique mixte"
 ALG_recover_from_the_war: "Se relever de la guerre civile"
 ALG_restoring_order: "Rétablir l'ordre"
 ALG_restoring_order_desc: "La priorité immédiate est de rétablir l'autorité de l'État et d'arrêter le chaos qui persiste dans certaines régions. La population aspire à la paix et à l'ordre après des années de dévastation."
 ALG_secure_weapons_shipments: "Expéditions d'armes sécurisées"
 ALG_secure_weapons_shipments_desc: "Assurer un bon ravitaillement de notre armée nous permettra de maintenir l'ordre intérieur et de prévenir une nouvelle insurrection."
 ALG_recover_from_the_war_desc: "Nous devons maintenant entamer le long processus de reconstruction de notre nation. La Décennie noire a marqué l'Algérie, mais avec de la détermination, nous pourrons renaître de nos cendres."
 ALG_restoring_the_broken_economy: "Relancer l'économie nationale"
 ALG_restoring_the_broken_economy_desc: "La guerre civile a paralysé nos institutions financières. Nous devons mettre en œuvre des mesures d'urgence pour stabiliser l'économie."
 ALG_arresting_extremists: "Neutraliser les menaces armées"
 ALG_arresting_extremists_desc: "Des groupes extrémistes opèrent encore dans des zones reculées. Une campagne de sécurité renouvelée rétablira le contrôle national complet."
 ALG_economic_recovery: "Relance économique"
 ALG_economic_recovery_desc: "Nos politiques commencent à porter leurs fruits. Nous entamons une phase de relèvement progressif et de restauration de la confiance."
 ALG_regain_banks: "Rétablir la confiance dans le secteur bancaire"
 ALG_regain_banks_desc: "Relancer le secteur bancaire est crucial pour restaurer la confiance des investisseurs et relancer le crédit intérieur."
 ALG_financial_reform: "Réformer le système financier"
 ALG_financial_reform_desc: "Moderniser le système financier algérien encouragera une croissance durable et nous permettra d'éviter de futurs chocs."
 ALG_begin_full_recovery: "Entamer la restauration économique complète"
 ALG_begin_full_recovery_desc: "La sécurité assurée et l'économie stabilisée, nous pouvons maintenant entamer un relèvement économique national complet."
 ALG_repairing_the_roads: "Réparer les infrastructures"
 ALG_repairing_the_roads_desc: "Routes, ponts et lignes de communication se sont effondrés. Reconstruire notre réseau logistique est essentiel à la cohésion nationale."
 ALG_rebuild_north: "Reconstruire la Kabylie et Alger"
 ALG_rebuild_north_desc: "Ces centres urbains ont été parmi les plus touchés. La priorité doit aller au rétablissement des services de base en Kabylie et à Alger."
 ALG_rebuild_centre: "Reconstruire les Hauts Plateaux"
 ALG_rebuild_centre_desc: "Les hauts plateaux centraux ont été à la fois un champ de bataille et une crise humanitaire. Ils nécessitent une reconstruction ciblée."
 ALG_rebuild_west: "Reconstruire l'Ouest"
 ALG_rebuild_west_desc: "Les infrastructures de l'Ouest étaient négligées même avant la guerre. Il est temps d'intégrer ces régions reculées."
 ALG_rebuild_algeria: "Reconstruire l'Algérie"
 ALG_rebuild_algeria_desc: "Il est temps de reconstruire notre nation et de redevenir une grande puissance : cette guerre civile a trop blessé, l'heure est à la cicatrisation"
 ALG_rebuild_south: "Reconstruire le Sud"
 ALG_rebuild_south_desc: "Les infrastructures du sud étaient négligées même avant la guerre. Il est temps d'intégrer ces régions reculées."
 ALG_order_restored_in_algeria: "Ordre rétabli en Algérie"
 ALG_order_restored_in_algeria_desc: "Pour la première fois depuis des décennies, l'Algérie est stable et unie. Le chemin est encore long, mais la paix est de retour."
 ALG_state_and_imf_funding: "Financement de l’État et du FMI"
 ALG_state_and_imf_funding_desc: "Par des prêts et l'aide étrangère, surtout du FMI, nous pouvons insuffler la vie à notre économie bloquée."
 ALG_restocking_factories: "Usines de réapprovisionnement"
 ALG_restocking_factories_desc: "De nombreuses usines ont été endommagées ou vidées. Avec de nouveaux approvisionnements, nous pourrons relancer la production."
 ALG_rebuilding_factories: "Reconstruire les zones industrielles"
 ALG_rebuilding_factories_desc: "Plusieurs zones industrielles sont tombées en ruine. Les reconstruire fournira des emplois et les matériaux nécessaires au relèvement."
 ALG_export_controls: "Contrôles à l'export et aide fédérale"
 ALG_export_controls_desc: "Pour protéger les biens stratégiques et assurer le développement intérieur, nous imposerons des restrictions temporaires à l'exportation, équilibrées par un soutien extérieur."
 ALG_post_war_recovery: "Reconstruction d'après-guerre civile"
 ALG_post_war_recovery_desc: "L'Algérie demeure marquée par le brutal conflit civil des années 1990. Bien que la paix soit rétablie, la nation souffre encore d'instabilité, d'usines sous-utilisées, d'infrastructures tendues et d'un système politique fragile."
 ALG_imf_funding_idea: "Financement d’urgence du FMI"
 ALG_imf_funding_idea_desc: "Le Fonds monétaire international est intervenu pour fournir la liquidité et le soulagement budgétaire tant nécessaires. Si ces fonds aident à stabiliser l'économie, ils s'accompagnent de contreparties."
 ALG_export_controls_idea: "Contrôles à l'export"
 ALG_export_controls_idea_desc: "Afin de prioriser le relèvement intérieur, le gouvernement a imposé des restrictions à l'exportation de matériaux clés. Cette politique stabilise les marchés intérieurs mais peut détériorer les relations commerciales internationales."
 ALG_anti_terror_sweeps: "Opérations antiterroristes"
 ALG_anti_terror_sweeps_desc: "Les forces de sécurité mènent des opérations agressives pour éliminer les éléments extrémistes restants. Si cela améliore la sécurité nationale, il faut l'équilibrer pour éviter de réprimer les libertés civiles."
 ALG_banking_confidence_restored: "La confiance du secteur bancaire est rétablie"
 ALG_banking_confidence_restored_desc: "Après une période de méfiance sévère et de stagnation, le secteur bancaire a recouvré une certaine stabilité, permettant aux citoyens comme aux investisseurs de se réengager avec le système financier algérien."
 ALG_structural_reform: "Réformes économiques structurelles"
 ALG_structural_reform_desc: "Des réformes globales sont en cours pour moderniser l'économie algérienne. Ces changements visent à réduire l'inflation, rationaliser les institutions et promouvoir la croissance à long terme."
 ALG_national_recovery_completed: "Relance nationale achevée"
 ALG_national_recovery_completed_desc: "Infrastructures reconstruites, sécurité assurée et économie relancée, l'Algérie est enfin sortie de son plus sombre chapitre. Une nouvelle ère d'espoir et de progrès commence."
 ALG_mastering_atom: "Maîtriser l'atome"
 ALG_missile_chi_TT: "L'Algérie améliorera sa technologie de §Hréacteur nucléaire§!"
 CHI_rejected_ALG: " Offre rejetée par la Chine"
 ALG_technological_ties: "Liens technologiques"
 ALG_continue_1991_program: "Poursuivre le programme nucléaire de 1991"
 ALG_continue_1991_program_desc: "Bien que notre programme nucléaire ait été suspendu dans les années 1990, ses fondations demeurent. En relançant les anciens projets, nous pourrons poursuivre à la fois la sécurité énergétique et une plus grande indépendance, même si des sanctions internationales sont susceptibles de suivre."
 ALG_seek_china_help: "Demander l'aide de la Chine"
 ALG_seek_china_help_desc: "La Chine a longtemps été disposée à coopérer avec l'Algérie sur la technologie nucléaire. Un partenariat renouvelé nous fournira équipements, expertise et formation, contournant les restrictions occidentales."
 ALG_1983_deal: "Relancer l'accord de missiles de 1983"
 ALG_1983_deal_desc: "Notre coopération antérieure avec la Chine en 1983 nous a fourni de la technologie de missiles et une assistance nucléaire limitée. Relancer cet arrangement accélérerait nos ambitions nucléaires civiles et militaires."
 ALG_missile_cooperation: "Élargir la coopération en matière de missiles"
 ALG_missile_cooperation_desc: "Au-delà des réacteurs et du combustible, la Chine peut aussi nous fournir des systèmes de missiles capables d'emporter des charges nucléaires. Cette étape, toutefois, attirera une attention sérieuse de l'Occident."
 ALG_hoggar_nuclear_facility: "Construire l'installation du Hoggar"
 ALG_hoggar_nuclear_facility_desc: "Au plus profond des montagnes du Hoggar, une installation nucléaire sécurisée peut être construite, à l'abri des ingérences extérieures. Elle servira de pièce maîtresse du programme nucléaire algérien."
 ALG_the_search_for_uranium: "La quête de l'uranium"
 ALG_the_search_for_uranium_desc: "Nos scientifiques sont convaincus que le vaste désert algérien recèle d'importantes réserves d'uranium. Localiser et extraire ces gisements fournira l'épine dorsale de tout projet nucléaire indépendant."
 ALG_dig_in_tamanrasset: "Se retrancher à Tamanrasset"
 ALG_dig_in_tamanrasset_desc: "Les plaines désertiques de Tamanrasset dissimulent d'importants gisements d'uranium. En y investissant dans les infrastructures minières, l'Algérie peut se libérer de sa dépendance aux fournisseurs étrangers."
 ALG_withdrawal_from_npt: "Se retirer du TNP"
 ALG_withdrawal_from_npt_desc: "L'Algérie ne peut plus laisser sa souveraineté liée par des traités étrangers. En se retirant du Traité de non-prolifération nucléaire, nous déclarons notre intention de poursuivre ouvertement l'arme nucléaire."
 ALG_wmds: "Armes de destruction massive"
 ALG_wmds_desc: "Les installations d'enrichissement achevées et les missiles prêts, l'heure est venue de finaliser la dissuasion nucléaire algérienne. Le monde s'en avisera, et nos ennemis y réfléchiront à deux fois avant de nous menacer."
 ALG_algiers_agreement: "L'accord d'Alger"
 ALG_algiers_agreement_desc: "Au lieu de poursuivre l'armement nucléaire, l'Algérie peut se présenter comme championne de la paix. L'accord d'Alger servira de serment de retenue, ouvrant la porte à l'investissement étranger et à la légitimité internationale."
 ALG_sign_BWC: "Signer la Convention sur les armes biologiques"
 ALG_sign_BWC_desc: "En adhérant aux accords internationaux contre les armes de destruction massive, nous démontrons l'engagement de l'Algérie pour la paix. Cela rassurera les investisseurs étrangers et réduira les soupçons sur nos activités nucléaires."
 ALG_build_nuclear_reactor: "Construire un réacteur nucléaire"
 ALG_build_nuclear_reactor_desc: "Notre programme nucléaire est prêt à franchir l'étape suivante. En construisant un réacteur à grande échelle, l'Algérie acquerra à la fois une puissante source d'énergie et un paravent pour d'autres activités d'enrichissement. Le monde pourra y voir une intention pacifique ; la réalité pourra être bien plus complexe."
 ALG_IAEA_safeguards_leave: "Garanties de l'AIEA achevées"
 ALG_IAEA_safeguards_leave_desc: "Après des années de surveillance et de conformité, l'Algérie a pleinement mis en œuvre ses engagements au titre de l'accord d'Alger et de la Convention sur les armes biologiques. Les derniers inspecteurs de l'AIEA quittant notre territoire, les sanctions sont levées et notre nation est reconnue comme une puissance régionale responsable."
 sanctioned_algeria: "Sanctions"
 ALG_hoggar_nuclear_facility_idea: "Installation nucléaire du Hoggar"
 ALG_algeria_behave_TT: "[USA.GetFlag] §HLes États-Unis§! lèveront probablement §Gles§! sanctions économiques"
 nuclear_algeria.1.t: "Fournisseur potentiel ?"
 nuclear_algeria.1.d: "Dans notre quête de technologie nucléaire, nous devons admettre que nous n'avons tout simplement pas le niveau de sophistication requis pour produire des armes ou des installations adéquates. Nous devons donc regarder vers le monde et voir qui est disposé à nous aider ; nos sources indiquent que nous pouvons demander de l'aide à une nation en particulier."
 nuclear_algeria.1.a: "Contacter les Chinois"
 nuclear_algeria.2.t: "L'Algérie demande de l'aide"
 nuclear_algeria.2.d: "Des scientifiques et diplomates algériens ont récemment rencontré les nôtres, demandant une assistance pour leur programme nucléaire. Ils ont déclaré qu'ils accepteraient tout ce que nous leur fournirions, pourvu que cela les aide à développer leur programme."
 nuclear_algeria.2.a: "Okay"
 nuclear_algeria.2.b: "Nous ne pouvons pas partager nos secrets"
 nuclear_algeria.3.t: "La Chine partage sa technologie de missiles"
 nuclear_algeria.3.d: "Des scientifiques chinois ont récemment rencontré les nôtres à [ALG.capital.GetCapitalVictoryPointName] et nous ont fourni des plans de missiles ICBM avancés que nous ne possédons pas actuellement."
 nuclear_algeria.3.a: "Super!"
 nuclear_algeria.4.t: "La Chine fournit la technologie nucléaire"
 nuclear_algeria.4.d: "Des scientifiques chinois ont récemment rencontré les nôtres à [ALG.capital.GetCapitalVictoryPointName] et nous ont fourni des plans de réacteurs avancés que nous ne possédons pas actuellement."
 nuclear_algeria.4.a: "Super!"
 nuclear_algeria.5.t: "[FROM.GetName] refuse de fournir une assistance !"
 nuclear_algeria.5.d: "Nous avons commis une grave erreur de calcul en contactant [FROM.GetName] pour une assistance à notre programme nucléaire : ils ont rejeté nos demandes et menacé de les porter devant les tribunaux internationaux, risquant d'exposer notre secret."
 nuclear_algeria.5.a: "Une occasion manquée."
 nuclear_algeria.6.t: "L'Algérie veut acheter des missiles"
 nuclear_algeria.6.d: "Le gouvernement algérien nous a demandé de lui vendre une série de missiles balistiques. Il a déclaré qu'il les utiliserait pour protéger ses frontières nationales et ne s'en servirait d'aucune forme de guerre offensive."
 nuclear_algeria.6.a: "D'accord, finaliser la vente"
 nuclear_algeria.6.b: "No"
 nuclear_algeria.7.t: "La Chine vend ses missiles"
 nuclear_algeria.7.d: "La Chine nous a vendu environ 400 missiles balistiques. Certains sont peut-être datés, mais ils fonctionnent encore, et c'est tout ce qui compte."
 nuclear_algeria.7.a: "Great"
 nuclear_algeria.8.t: "La Chine refuse de vendre des missiles"
 nuclear_algeria.8.d: "Le gouvernement chinois a rejeté notre demande d'achat de missiles, arguant qu'il en a besoin pour ses propres opérations militaires."
 nuclear_algeria.8.a: "Okay"
 nuclear_algeria.19.t: "Sanctions internationales"
 nuclear_algeria.19.d: "Il semble que le monde ait décidé de se retourner contre nous et ait placé des sanctions sur notre économie qui l'arrêteront inévitablement. Nous devrons évaluer nos politiques."
 nuclear_algeria.19.a: "Que pouvions-nous attendre d'un monde de traîtres ?"
 nuclear_algeria.25.t: "Les États-Unis accentuent la pression économique"
 nuclear_algeria.25.d: "Les États-Unis ont décidé d'exercer leur vision impérialiste en accroissant les sanctions économiques contre notre peuple."
 nuclear_algeria.25.a: "Nous résisterons !"
 nuclear_algeria.26.t: "Les États-Unis relâchent la pression économique"
 nuclear_algeria.26.d: "Les États-Unis ont choisi de diminuer le montant des sanctions qu'ils ont imposées à notre peuple. Qu'ils maintiennent cette position, c'est ce que nous verrons."
 nuclear_algeria.26.a: "Good"
 nuclear_algeria.28.t: "L'Algérie rentre dans le rang"
 nuclear_algeria.28.d: "Dans un retournement complet de la politique algérienne typique, ils semblent s'orienter vers une direction plus pacifique et contrôlée."
 nuclear_algeria.28.a: "Bien, peut-être pourrons-nous alléger les sanctions maintenant"
 algerian_focus.171.t: "Centrale nucléaire d'Es-Salam"
 algerian_focus.171.d: "Laissée inachevée par les Américains, ce qui a été construit de la centrale nucléaire d'Es-Salam reste inactif depuis des décennies. Avec l'arrivée de plusieurs scientifiques chinois, une offre a été faite par une compagnie chinoise pour achever ce qui restait de la centrale."
 algerian_focus.171.a: "Accepter la proposition"
 algerian_focus.171.b: "Non merci"
 ALG_sanctioned: "Sanctionné"
 ALG_nuclear_known: "Programme nucléaire révélé"
 ALG_emergency_budget: "Budget d'urgence"
 support_brics: "Briques de soutien"
 algeria_msp: "Focus MSP"
 algeria_democratic: "Focus RND"
 algeria_nationalist: "Focus sur l’ANP"
 monitor_kabyle_unrest: "Surveiller les troubles kabyles [KBY.GetFlag]"
 ALG_us_sanctions: "Sanctions américaines"
 ALG_us_sanctions_desc: "Les États-Unis ont placé plusieurs sanctions qui limitent notre capacité à interagir avec le monde extérieur. Sans être paralysantes, elles empêchent dans une certaine mesure notre succès économique.\n§W--------------§!\nLes États-Unis ont la capacité d'accroître ou de réduire les sanctions contre notre gouvernement selon nos actions.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les États-Unis estiment que nous ne poursuivons plus l'arme nucléaire."
 ALG_imf_path: "Choisir la voie des prêts du FMI"
 ALG_imf_loan_taken: "A contracté les prêts du FMI"
 ALG_oil_reformed: "Le pétrole réformé"
 ALG_repression_modifier: "Répression"
 ALG_surveillance_state_modifier: "État de surveillance"
 ALG_national_dialogue_modifier: "Dialogue national"
 ALG_boteflika: "Crise sanitaire du président algérien"
 idea_alg_empowered_parliament: "Un Parlement habilité"
 algeria_sahar.1.t: "Aide de l'Algérie"
 algeria_sahar.1.d: "Nous avons reçu une offre de l'Algérie : elle est prête à nous fournir une assistance militaire et à nous aider à préparer la reprise des hostilités, en échange d'une participation au processus d'établissement de la RAU. Devons-nous accepter le soutien de l'Algérie ?"
 algeria_sahar.1.a: "Nous devons accepter !"
 algeria_sahar.1.b: "Pas question de devenir leurs marionnettes !"
 algeria_sahar.2.t: "Accord de paix"
 algeria_sahar.2.d: "Nous n'avons pas pu contenir les rebelles : ils ont pris tout le Sahara occidental. Devons-nous leur offrir un traité de paix et céder le territoire ?"
 algeria_sahar.2.a: "Leur envoyer l'offre"
 algeria_sahar.2.b: "Nous devons les écraser !"
 algeria_sahar.3.t: "Offre du Maroc"
 algeria_sahar.3.d: "Le Maroc nous a envoyé une proposition de traité de paix : cette déclaration peut être considérée comme un véritable acte de reddition ! Nous pouvons accepter la reddition ou marcher sur un large front pour libérer les peuples du Maghreb septentrional !"
 algeria_sahar.3.a: "Nous avons gagné !"
 algeria_sahar.3.b: "En avant vers la Fédération populaire !"
 algeria_sahar.4.t: "La guerre a été gagnée"
 algeria_sahar.4.d: "Nos forces ont prévalu. Le conflit du Sahara occidental est terminé et nous sommes libres de remodeler l'ordre politique de la région comme bon nous semble."
 algeria_sahar.4.a: "Établir la Fédération saharienne."
 algeria_sahar.5.t: "La paix, enfin."
 algeria_sahar.5.d: "Nous avons signé un traité de paix avec les Sahraouis et la guerre est terminée."
 algeria_sahar.5.a: "Nos heures les plus sombres..."
 algeria_sahar.6.t: "Ils ont rejeté !"
 algeria_sahar.6.d: "Les Sahraouis ont rejeté notre traité de paix ! La guerre continue !"
 algeria_sahar.6.a: "Reconnu."
 algeria_sahar.7.t: "Sarawi accepte !"
 algeria_sahar.7.d: "Les Sahraouis acceptent notre offre."
 algeria_sahar.7.a: "En avant vers la RAU !"
 algeria_sahar.8.t: "Ils ont rejeté !"
 algeria_sahar.8.d: "Les Sahraouis ont rejeté notre offre."
 algeria_sahar.8.a: "Quelle honte."
 TT_ALG_DEAL_WITH_TRADE_UNIONS: "Nous accroîtrons l'opinion syndicale lorsque nous les aurons comme faction interne"
 ALG_oil_price_collapse: "Effondrement du prix du pétrole"
 ALG_oil_price_collapse_desc: "Une chute brutale des prix mondiaux du pétrole a gravement affecté les recettes de l'État algérien. Les hydrocarbures demeurant l'épine dorsale de l'économie nationale, cet effondrement menace la stabilité budgétaire, les réserves de change et les dépenses sociales.\n\n§R- Effondrement des recettes du Trésor§!"
 alg_hirak_victory_option: "Le mouvement Hirak l’emporte"
 alg_hirak_victory_option_desc: "Après des années de manifestations, de mobilisation et de résistance populaire, le mouvement Hirak a enfin prévalu. Des réformes démocratiques sont désormais en cours, mais l'État demeure fragile et la transition incertaine.\n\n§G+ Légitimité réformiste§!\n§Y- Influence de l'État profond§!"
 alg_hirak_reforms_title: "Des réformes motivées par le Hirak"
 alg_hirak_reforms_desc: "Face à une immense pression de la rue, le gouvernement est contraint de mettre en œuvre des réformes symboliques."
 alg_hirak_reforms_option: "Annoncer des réformes politiques"
 alg_hirak_gains_influence_tt: "Le §YHirak§! gagne davantage d'influence dans l'équilibre politique."
 alg_hirak_crackdown_title: "Répression des manifestations du Hirak"
 alg_hirak_crackdown_desc: "Le régime a choisi la répression plutôt que la réforme, déchaînant les forces de sécurité sur les manifestants."
 alg_hirak_crackdown_option: "Recourir à la force pour rétablir l'ordre"
 alg_pouvoir_crackdown_tt: "§YLe Pouvoir§! consolide son emprise au détriment de la stabilité."
 alg_health_crisis_title: "Crise sanitaire présidentielle"
 alg_health_crisis_desc: "Le président Bouteflika a subi un grave incident de santé, relançant les inquiétudes sur le vieillissement de la direction et le manque de transparence de la politique algérienne. Si son cercle proche insiste qu'il continuera de gouverner, beaucoup dans la population et les cercles d'élite commencent à questionner la légitimité de son maintien au pouvoir."
 alg_health_crisis_option_continue: "Réaffirmer le leadership de Bouteflika"
 alg_le_pouvoir_strengthens_tt: "§YLe Pouvoir§! consolide davantage son emprise tandis que le cercle intime du président le protège du regard public."
 maghreb_union_member: "§YA accepté notre proposition de former l'Union du Maghreb§!"
 has_power_balance_algeria: "Élections de 2014 en Algérie terminées"
 supports_brics: "Soutenir les BRICS"
 ALG_eu_trade_agreements_desc: "Signer un accord commercial avec l'UE pour renforcer nos liens avec l'Occident et développer notre économie"
 ALG_join_nato_partnership_desc: "Rejoindre le Partenariat OTAN afin de dominer la région africaine et de faire de l'Algérie un pays du premier monde"
 ALG_al_quwwat_al_jawwiya_al_jazaeriya: "Forces aériennes algériennes"
 ALG_al_quwwat_al_jawwiya_al_jazaeriya_desc: "L'armée de l'air algérienne est l'un des piliers de notre puissance militaire depuis l'indépendance. Renforcer nos capacités aériennes par la modernisation et les acquisitions garantira la domination dans les cieux nord-africains."
 ALG_al_jaysh_al_watani_al_shaabi: "L'Armée nationale populaire"
 ALG_al_jaysh_al_watani_al_shaabi_desc: "L'Armée nationale populaire est l'épine dorsale de la défense de l'Algérie. Réformer et équiper les forces terrestres sécurisera notre territoire et maintiendra la stabilité face aux menaces."
 ALG_al_quwwat_al_bahriya_al_jazaeriya: "Force navale algérienne"
 ALG_al_quwwat_al_bahriya_al_jazaeriya_desc: "Les forces navales algériennes sauvegardent notre côte méditerranéenne et nos intérêts maritimes. Étendre notre flotte et nos infrastructures permettra à l'Algérie de projeter sa puissance et de protéger les voies maritimes vitales."
 ALG_al_quwwat_al_musallaha_al_jazaeriya: "Les Forces armées algériennes"
 ALG_al_quwwat_al_musallaha_al_jazaeriya_desc: "Les Forces armées algériennes représentent la puissance combinée de notre armée, de notre aviation et de notre marine. Garante de la souveraineté nationale, elles doivent être restructurées et modernisées pour affronter les défis du nouveau siècle."
 ALG_expand_the_EFCIP: "Étendre l'EFCIP"
 ALG_expand_the_EFCIP_desc: "L'École de formation des commandos et d'initiation au parachutisme (EFCIP) de Boghar est la pierre angulaire de l'entraînement des forces spéciales algériennes depuis 1963. En étendant ses installations, modernisant ses infrastructures et introduisant des programmes de combat avancés, nous renforcerons encore les capacités de nos commandos et parachutistes. Cet investissement garantira que l'Algérie conserve l'un des corps de forces spéciales les plus redoutables d'Afrique du Nord."
 ALG_expand_conscription: "Développer la conscription"
 ALG_expand_conscription_desc: "Étendre la conscription accroît notre vivier de soldats formés. Cela assure la main-d'œuvre suffisante pour défendre la nation et répondre aux menaces."
 ALG_expand_military_infrastructure: "Étendre les infrastructures militaires"
 ALG_expand_military_infrastructure_desc: "Construire de nouvelles bases, centres d'entraînement et pôles logistiques renforce notre capacité militaire. Les améliorations d'infrastructure soutiennent l'efficacité opérationnelle."
 ALG_focus_on_military_morale: "Se concentrer sur le moral militaire"
 ALG_focus_on_military_morale_desc: "Un moral élevé est critique pour l'efficacité au combat. Investir dans le bien-être des soldats, le commandement et l'esprit de corps booste l'ardeur au combat."
 ALG_expand_artillery_units: "Développer les unités d'artillerie"
 ALG_expand_artillery_units_desc: "L'artillerie fournit une puissance de feu vitale sur le champ de bataille. Accroître les unités d'artillerie renforce les capacités offensives et défensives de notre armée."
 ALG_an_army_of_the_masses: "Une armée des masses"
 ALG_an_army_of_the_masses_desc: "Une armée vaste et bien entraînée peut dissuader l'agression et protéger la souveraineté. Bâtir une armée de masse exige un engagement en formation et en ressources."
 ALG_expand_the_escuela_de_condores: "Étendre l'Escuela de Cóndores"
 ALG_expand_the_escuela_de_condores_desc: "L'école des Cóndores forme l'élite des soldats algériens. L'étendre développera davantage de forces spéciales pour affronter des défis de sécurité complexes."
 ALG_form_specops_brigades: "Former des brigades de forces spéciales"
 ALG_form_specops_brigades_desc: "Les brigades de forces spéciales mènent des missions à haut risque exigeant des compétences avancées. Former ces unités accroît la souplesse tactique de l'Algérie."
 ALG_military_mechanization: "Mécanisation militaire"
 ALG_military_mechanization_desc: "Mécaniser l'infanterie améliore la mobilité et la puissance de feu. Cette transition modernise l'armée et accroît l'efficacité sur le champ de bataille."
 ALG_abolish_conscription: "Abolir la conscription"
 ALG_abolish_conscription_desc: "Mettre fin à la conscription fait passer l'armée à une force professionnelle de volontaires. Cela peut améliorer la qualité mais réduit la disponibilité en effectifs."
 ALG_quality_over_quantity: "La qualité plutôt que la quantité"
 ALG_quality_over_quantity_desc: "Se concentrer sur une force plus petite et mieux équipée accroît l'efficacité au combat. L'entraînement et l'équipement moderne sont priorisés sur le nombre brut."
 ALG_a_cost_effective_army: "Une armée rentable"
 ALG_a_cost_effective_army_desc: "Maintenir une armée allégée et efficace assure la responsabilité budgétaire. Un budget intelligent permet d'équilibrer les besoins de défense et les réalités économiques."
 ALG_modernizing_our_equipment: "Moderniser notre équipement"
 ALG_modernizing_our_equipment_desc: "Mettre à niveau les armes et le matériel maintient nos forces compétitives. Un équipement moderne améliore la survivabilité et la puissance de combat."
 ALG_develop_algerian_military_industry: "Développer l'industrie militaire algérienne"
 ALG_develop_algerian_military_industry_desc: "Établir une industrie d'armement nationale réduit la dépendance aux importations. Cela renforce la souveraineté et crée des emplois."
 ALG_cooperate_with_foreign_arms_companies: "Coopérer avec des compagnies d'armement étrangères"
 ALG_cooperate_with_foreign_arms_companies_desc: "S'associer à des firmes d'armement internationales accélère le transfert de technologies. Ces collaborations améliorent nos capacités militaires."
 ALG_tackle_military_corruption: "S'attaquer à la corruption militaire"
 ALG_tackle_military_corruption_desc: "La corruption sape l'efficacité et le moral militaires. De fermes réformes et un contrôle restaurent la confiance et la discipline."
 ALG_elite_officer_training: "Formation d'officier d'élite"
 ALG_elite_officer_training_desc: "Des officiers hautement qualifiés sont la clé du succès sur le champ de bataille. Des programmes de formation spécialisés bâtissent le leadership et l'expertise stratégique."
 ALG_an_army_for_the_future: "Une armée pour l'avenir"
 ALG_an_army_for_the_future_desc: "Nous devons préparer l'armée à affronter les menaces et technologies futures. L'innovation et l'adaptabilité sont au cœur de cette vision."
 ALG_purchase_american_aircraft: "Acheter un avion américain"
 ALG_purchase_american_aircraft_desc: "Acquérir des appareils auprès des États-Unis fournit une technologie avancée et une fiabilité éprouvée. Cela renforce nos capacités aériennes."
 ALG_purchase_chinese_aircraft: "Acheter des avions chinois"
 ALG_purchase_chinese_aircraft_desc: "Les appareils chinois offrent des options économiques et une sophistication technologique croissante. Diversifier les fournisseurs élargit les partenariats stratégiques."
 ALG_purchase_russian_aircraft: "Acheter un avion russe"
 ALG_purchase_russian_aircraft_desc: "Les appareils russes apportent des conceptions robustes et de solides performances. La coopération accroît la polyvalence de notre aviation."
 ALG_improve_air_defense_infrastructure: "Améliorer l'infrastructure de défense aérienne"
 ALG_improve_air_defense_infrastructure_desc: "Renforcer les systèmes de défense aérienne protège les atouts critiques et les centres de population. Les mises à niveau réduisent la vulnérabilité aux menaces aériennes."
 ALG_close_air_support: "Appui aérien rapproché"
 ALG_close_air_support_desc: "L'appui aérien rapproché booste l'efficacité des forces terrestres au combat. Intégrer les opérations aériennes et terrestres est vital pour le succès sur le champ de bataille."
 ALG_a_new_world_class_academy: "Une académie de rang mondial"
 ALG_a_new_world_class_academy_desc: "Établir une académie militaire de classe mondiale formera les futurs chefs. Cette institution fixera les normes d'excellence."
 ALG_dominate_the_skies: "Dominer les cieux"
 ALG_dominate_the_skies_desc: "Obtenir la supériorité aérienne est essentiel dans la guerre moderne. Nous investirons pour contrôler notre espace aérien et soutenir toutes les opérations militaires."
 ALG_might_of_the_sky: "La puissance du ciel"
 ALG_might_of_the_sky_desc: "Notre puissance aérienne symbolise la force nationale et le progrès technologique. Maintenir une aviation puissante dissuade l'agression."
 ALG_naval_military_police: "Police militaire navale"
 ALG_naval_military_police_desc: "La police militaire navale maintient la discipline et la sécurité à bord des navires et des bases. Elle garantit l'ordre et l'efficacité des opérations."
 ALG_expand_the_naval_academy: "Étendre l'académie navale"
 ALG_expand_the_naval_academy_desc: "Une académie navale étendue formera davantage d'officiers et de marins. Cet investissement bâtit des forces maritimes professionnelles et capables."
 ALG_return_to_the_sea: "Notre retour à la mer"
 ALG_return_to_the_sea_desc: "Retrouver l'accès à l'océan Pacifique est un but historique pour l'Algérie. Développer une présence navale est crucial pour cette ambition."
 ALG_algerian_marine_forces: "Forces maritimes algériennes"
 ALG_algerian_marine_forces_desc: "Les forces de marine fournissent des capacités de réaction rapide et une expertise amphibie. Leur expansion accroît la portée opérationnelle de l'Algérie."
 ALG_quick_strikes: "Frappes rapides"
 ALG_quick_strikes_desc: "Des frappes rapides et décisives peuvent submerger l'adversaire. Développer de telles forces accroît la flexibilité tactique."
 ALG_invest_into_shipbuilding: "Investir dans la construction navale"
 ALG_invest_into_shipbuilding_desc: "Bâtir une industrie navale nationale soutient l'expansion de la marine et la croissance économique. Ce secteur est stratégique pour la défense à long terme."
 ALG_djebel_chenoua: "Djebel Chenoua"
 ALG_djebel_chenoua_desc: "Créer une flotte puissante projette la force et protège les intérêts nationaux. Le Djebel Chenoua est un symbole de souveraineté maritime."
 ALG_masters_of_the_mediterranean: "Maîtres de la Méditerranée"
 ALG_masters_of_the_mediterranean_desc: "Dominer les eaux méditerranéennes sécurise les routes commerciales et des avantages stratégiques. L'Algérie doit aspirer à être un acteur clé de cette région."
 ALG_focus_on_mass_assault_tactics: "Privilégier les tactiques d'assaut de masse"
 ALG_focus_on_mass_assault_tactics_desc: "Les tactiques d'assaut de masse mettent l'accent sur le submergement de l'ennemi par de grandes concentrations de troupes. Cette stratégie s'appuie sur la main-d'œuvre et la coordination pour obtenir la victoire."
 ALG_licence_mir: "Achat de licences pour le Mirage"
 ALG_licence_mir_desc: "Nous avons tous les moyens de produire des appareils français : nous devons demander une licence pour les produire"
 ALG_purchase_russian_su30: "Acheter un SU-30 russe"
 ALG_purchase_russian_su30_desc: "En tant que puissance régionale, sauvegarder nos vastes frontières et projeter notre influence à travers le Maghreb et le Sahel est primordial. Notre haut commandement militaire a identifié le légendaire Su-30 russe comme la plateforme idéale pour accroître significativement notre supériorité aérienne. Cette acquisition renforcerait non seulement la puissance de notre flotte et standardiserait la logistique, mais fournirait aussi un avantage décisif immédiat, même si elle attirera sans aucun doute une attention internationale significative."
 alg_politics.50.t: "Mort du général Smaïn Lamari"
 alg_politics.50.d: "Le général Smaïn Lamari, chef de la redoutée branche de contre-espionnage du DRS, est décédé. Sa mort soudaine laisse un vide de pouvoir dans l'État profond algérien, tandis que des rivaux manœuvrent pour s'emparer de son ancienne influence."
 alg_politics.50.a: "Une ombre de l'ancien régime disparaît."
 ALG_black_decade_threat: "Retour des méthodes de la décennie noire"
 ALG_2001_title: "Promotion de Fatima Boudouani"
 ALG_2001_desc: "Dans le cadre du renouveau réformiste du président Bouteflika, Fatima Boudouani devient la première femme générale d'Algérie. Sa promotion marque une nouvelle ère pour les femmes dans les forces armées, boostant le moral et signalant la modernisation."
 ALG_2001_a: "Un pas historique pour l'armée."
 ALG_2002_title: "Promotion de Fatima Zohra Ardjoune"
 ALG_2002_desc: "Suivant la voie pionnière de Fatima Boudouani, Fatima Zohra Ardjoune est désormais promue au rang de générale. Première femme générale du corps médical algérien, sa nomination reflète les pas prudents de l'Algérie vers l'inclusion des femmes dans l'armée."
 ALG_2002_a: "Encore une barrière brisée."
 alg_reform.1.t: "Une chance de vraie réforme"
 alg_reform.1.d: "À la suite de l'initiative « Par le peuple, pour le peuple », l'Algérie a une rare occasion de choisir un dirigeant engagé dans une véritable réforme. Trois candidats ont émergé, chacun promettant une voie différente pour stabiliser et moderniser le pays. Le choix appartient désormais au peuple."
 alg_reform.1.a: "Ahmed Benbitour – Le réformateur technocrate"
 alg_benbitour_desc: "Ahmed Benbitour est un technocrate axé sur l'efficacité administrative et la modernisation économique. Son approche mesurée vise à bâtir une stabilité à long terme et à réformer les institutions de l'État."
 alg_reform.1.b: "Soufiane Djilali – Le réformateur charismatique"
 alg_djilali_desc: "Soufiane Djilali est un dirigeant d'opposition réformiste, mettant l'accent sur les réformes sociales et politiques. Charismatique et déterminé, il cherche à renforcer les institutions démocratiques et la participation publique."
 alg_reform.1.c: "Rachid Nekkaz – L'activiste populiste"
 alg_nekkaz_desc: "Rachid Nekkaz est un activiste populiste s'adressant directement au peuple. Si sa popularité est élevée, son style confrontationnel pourrait créer de l'instabilité dans un environnement politique délicat."
 ALG_citizens_constitution: "Constitution du citoyen"
 ALG_justice_for_the_people: "Justice pour le peuple"
 ALG_free_press_free_people: "Presse libre, peuple libre"
 ALG_economic_transparency: "Transparence économique"
 ALG_citizens_constitution_desc: "Rédiger une nouvelle constitution qui garantit les droits fondamentaux et renforce les institutions démocratiques."
 ALG_justice_for_the_people_desc: "Réformer le judiciaire pour qu'il soit indépendant, équitable et protégé de l'ingérence politique."
 ALG_free_press_free_people_desc: "Garantir la liberté de la presse, permettant aux médias de tenir le pouvoir responsable et d'informer les citoyens."
 ALG_economic_transparency_desc: "Mettre en œuvre un budget et des politiques fiscales transparents pour combattre la corruption et accroître la confiance du public."
 ALG_true_reformist_path_tt: "Cette voie permet à l'Algérie de choisir un véritable dirigeant réformiste, d'accroître la popularité démocratique et la stabilité, et de lancer des réformes politiques et économiques pour le peuple."
 algeria_news.3_tt: "Le programme de paix de Bouteflika donne à l'Algérie un sentiment d'espoir, améliorant la stabilité et le soutien démocratique."
 algeria_news.7_tt: "La résistance à « le Pouvoir » gagne le soutien populaire, renforçant l'influence démocratique et le capital politique."
 algeria_news.1_tt: "L'armée affirme son contrôle après les mesures d'urgence. La stabilité baisse légèrement mais le soutien à la guerre et le pouvoir politique augmentent."
 algeria_news.4_tt: "L'effort de réconciliation de Bouteflika booste la stabilité nationale et le soutien démocratique."
 algeria_news.8.t: "Les victimes de la Décennie noire"
 algeria_news.8.d: "La guerre civile des années 1990 a laissé des centaines de milliers de victimes : les disparus, les veuves, les orphelins, et ceux qui ont souffert torture et terreur. Alors que l'Algérie cherche la réconciliation, la question se pose : comment l'État doit-il répondre aux exigences de justice et de reconnaissance ?"
 algeria_news.8.a: "Indemniser les familles et les victimes"
 algeria_news.8.b: "N'accorder qu'une reconnaissance symbolique"
 algeria_news.8.c: "Nous ne pouvons pas nous attarder sur le passé"
 algeria_news.8_a_tt: "Des §Yprogrammes d'indemnisation coûteux§! amélioreront la stabilité et renforceront la légitimité de l'Algérie, mais pèseront sur le Trésor."
 algeria_news.8_b_tt: "La §Yreconnaissance symbolique§! améliore la stabilité à un coût politique énorme, mais laisse certaines revendications insatisfaites."
 algeria_news.8_c_tt: "§YIgnorer les revendications des victimes§! économise des ressources maintenant, mais réduit la stabilité et alimente le mécontentement."
 algeria_news.10.t: "La voie du relèvement"
 algeria_news.10.d: "Le conflit civil s'achevant, l'Algérie affronte le défi monumental de reconstruire son économie brisée. Les usines sont inactives, les infrastructures endommagées, et le chômage demeure dangereusement élevé. Pourtant, pour la première fois depuis des années, il y a l'espoir que reconstruction et réforme puissent restaurer prospérité et stabilité."
 algeria_news.10.a: "Le relèvement commence !"
 algeria_news.10_a_tt: "§YLes premiers pas sont faits pour relancer l'économie algérienne.§! Cela ouvre la voie à des réformes plus profondes dans les infrastructures, l'industrie et la finance."
 algeria_news.11.t: "Mission d'aide des Nations Unies"
 algeria_news.11.d: "Des représentants des Nations unies sont arrivés à Alger avec une offre d'aide économique et d'assistance à la reconstruction. Leurs programmes pourraient apporter des fonds précieux, de l'expertise et des secours humanitaires, mais beaucoup au gouvernement mettent en garde : accepter une telle aide pourrait inviter l'ingérence étrangère dans les affaires intérieures de l'Algérie."
 algeria_news.11.a: "Accepter la mission de l'ONU"
 algeria_news.11_a_tt: "§GNous recevrons des fonds d'aide internationale et un soutien technique.§! \n§RToutefois, cela accroîtra l'influence américaine, française et britannique en Algérie.§!"
 algeria_news.11.b: "Rejeter l'ingérence étrangère"
 algeria_news.11_b_tt: "§RNous refusons la tutelle de l'ONU et nous relèverons seuls.§! \n§YCela préserve notre souveraineté mais ralentit la croissance économique.§!"
 algeria_news.20.t: "Réexamen de la politique étrangère algérienne"
 algeria_news.20.d: "Avec la fin du conflit civil et le fragile relèvement de l'Algérie en cours, la direction à Alger a lancé une revue complète de la politique étrangère de la nation. Les choix des années à venir détermineront si nous renforçons les liens avec d'anciens alliés, cherchons de nouveaux partenariats, ou maintenons notre indépendance dans un monde de plus en plus polarisé. Le débat a commencé, et bientôt l'Algérie devra choisir sa voie."
 algeria_news.20.a: "L'avenir de l'Algérie attend."
 algeria_news.20_tt: "§YCela marque le début de la branche de politique étrangère de l'Algérie.§!"
 ALG_between_east_and_west_tt: "L'Algérie cherche à équilibrer ses relations entre l'Est et l'Ouest tout en affirmant une politique étrangère non-alignée."
 ALG_mediate_great_power_conflict_tt: "L'Algérie médie activement entre les puissances mondiales, consolidant sa réputation de pacificateur neutre."
 ALG_secure_balance_tt: "L'Algérie renforce sa position non alignée, assurant un équilibre stable entre les grandes puissances mondiales."
 alg_news_non_aligned.1.t: "Équilibrer entre l'Est et l'Ouest"
 alg_news_non_aligned.1.d: "L'Algérie a commencé à tracer une voie prudente entre les grandes puissances mondiales, cherchant à maintenir son indépendance tout en s'engageant diplomatiquement avec l'Est comme avec l'Ouest."
 alg_news_non_aligned.1.a: "L'Algérie cherche l'équilibre"
 alg_news_non_aligned.2.t: "Médiateur des tensions mondiales"
 alg_news_non_aligned.2.d: "L'Algérie s'est avancée pour médier les tensions entre grandes puissances, visant à rehausser son standing international comme pacificateur neutre."
 alg_news_non_aligned.2.a: "Médiation en cours"
 alg_news_non_aligned.3.t: "Promouvoir la réconciliation régionale"
 alg_news_non_aligned.3.d: "L'Algérie a lancé une série d'initiatives diplomatiques pour réconcilier les différences entre puissances régionales, cherchant la stabilité et des partenariats de coopération."
 alg_news_non_aligned.3.a: "Efforts de réconciliation"
 alg_news_non_aligned.4.t: "Garantir un équilibre non aligné"
 alg_news_non_aligned.4.d: "L'Algérie a solidifié sa position non-alignée, maintenant soigneusement des relations avec les grandes puissances sans s'engager pleinement dans aucun bloc."
 alg_news_non_aligned.4.a: "Solde sécurisé"
 alg_news_non_aligned.5.t: "Raviver le mouvement des non-alignés"
 alg_news_non_aligned.5.d: "L'Algérie a pris des mesures pour revitaliser sa participation au mouvement des non-alignés, réaffirmant son leadership et son influence diplomatique parmi les nations neutres."
 alg_news_non_aligned.5.a: "Influence du NAM restaurée"
 alg_news_non_aligned.6.t: "Soutenir le monde en développement"
 alg_news_non_aligned.6.d: "L'Algérie a entamé une vaste offensive diplomatique et économique vers les nations en développement, promouvant la stabilité et la coopération tout en accroissant son influence sur le continent."
 alg_news_non_aligned.6.a: "Sensibilisation initiée"
 algeria_news.9.t: "L'héritage de la Décennie noire"
 algeria_news.9.d: "La guerre civile a laissé de profondes cicatrices sur l'Algérie. Le gouvernement doit décider comment cadrer le passé, attribuer les responsabilités et guider l'avenir de la nation."
 algeria_news.9.a: "Soutenir le régime militaire"
 algeria_news.9.b: "Prendre le parti des victimes et des pauvres"
 algeria_news.9.c: "Blâmer les acteurs externes"
 algeria_news.9.dd: "Effacer officiellement et réprimer le débat"
 ALG_promote_reconciliation_tt: "§GPromouvoir la réconciliation :§!\n• Améliorer les relations avec les voisins\n• Réduire les tensions régionales\n• Ouvrir des canaux diplomatiques"
 alg_mufti.2.t: "Quelle voie pour l'État islamique ?"
 alg_mufti.2.d: "Maintenant que l'islam a été déclaré principe directeur de la nation, nous devons décider quel courant définira notre voie. Le Mouvement de la renaissance islamique (Nahda), mené par Abdallah Djaballah, appelle à une vision islamiste modérée et structurée par les urnes. D'autres se tournent vers les oulémas et les prédicateurs charismatiques qui promettent une forme d'autorité islamique plus directe et sans compromis."
 alg_mufti.2.a: "Renforcer le Mouvement de la renaissance islamique (Nahda)"
 alg_mufti.2.a.tt: "La Nahda de Djaballah devient la force dirigeante de la politique islamique."
 alg_mufti.2.b: "Placer l'autorité entre les mains des oulémas"
 alg_mufti.2.b.tt: "Plus tard, nous choisirons de suivre un prédicateur controversé ou un mufti approuvé par le gouvernement."
 alg_mufti.3.t: "Le visage des oulémas"
 alg_mufti.3.d: "L'autorité des oulémas confirmée, le gouvernement doit maintenant décider qui représentera ce courant à la direction. Cheikh Bouamrane est un modéré, acceptable pour l'État et l'armée, tandis qu'Ali Belhadj demeure une voix radicale et incendiaire qui inspire le soutien populaire mais risque la confrontation avec les autorités."
 alg_mufti.3.a: "Soutenez Belhadj"
 alg_mufti.3.a.tt: "Ali Belhadj deviendra le dirigeant, représentant un courant salafiste dur."
 alg_mufti.3.b: "Soutenez Bouamrane"
 alg_mufti.3.b.tt: "Cheikh Bouamrane deviendra le dirigeant, représentant un courant d'oulémas modéré et aligné sur l'État.\n§RIndisponible après mai 2016.§!"
 ALG_ennahda: "Soutenez Ennahda"
 ALG_ennahda_desc: "Nous soutiendrons Abdallah Djaballah et le Mouvement de la renaissance islamique, intégrant la politique islamiste au sein de nos institutions d'État."
 ALG_independent: "Oulémas indépendants"
 ALG_independent_desc: "Nous renforcerons l'indépendance des oulémas, donnant aux savants religieux l'autorité sur les questions spirituelles et potentiellement sur la direction de l'État."
 ALG_grand_mufti_rule: "Le Grand Mufti gouverne"
 ALG_grand_mufti_rule_desc: "Les oulémas, ou un mouvement islamiste politique, fourniront l'autorité directrice de l'État algérien. La voie que nous avons choisie déterminera qui émergera comme visage de l'autorité islamique."
 ALG_nahda_path: "A choisi la voie de la Nahda"
 ALG_ulema_path: "A choisi la voie des oulémas"
 ALG_belhadj_leader: "Ali Belhadj est le dirigeant"
 ALG_bouamrane_leader: "Cheikh Bouamrane est le dirigeant"
 ALG_constitution_1996: "Constitution de 1996"
 ALG_constitution_1996_desc: "La Constitution révisée de 1996 devait stabiliser l'Algérie après les troubles de la Décennie noire. Toutefois, de nombreuses dispositions ont été conçues pour la survie du régime plutôt que pour une véritable démocratisation. Son cadre laïc rigide a été vu par une grande part du mouvement islamiste comme illégitime et « non islamique ». Si elle consolide le contrôle de l'État et renforce la présidence, elle restreint aussi la participation politique, réduit la confiance entre le gouvernement et la société, et entrave la réforme à long terme. L'héritage de cette constitution continue de peser lourdement sur la stabilité et la légitimité de l'Algérie."
 ALG_enahda_media_network_idea: "Réseau médiatique Ennahda"
 ALG_enahda_media_network_idea_desc: "Le mouvement Ennahda a établi ses propres canaux médiatiques pour diffuser son message et mobiliser le soutien public. Ces organes promeuvent des valeurs d'inspiration religieuse tout en critiquant les échecs du régime.\n\n§YCet esprit national sera retiré si nous ne sommes pas alignés sur Ennahda§!"
 ALG_supreme_islamic_council_idea: "Haut Conseil islamique"
 ALG_supreme_islamic_council_idea_desc: "Un conseil consultatif composé d'oulémas seniors et de savants islamiques a été établi pour guider la politique de l'État selon des lignes religieuses. S'il ne détient pas de pouvoir direct, son influence sur la législation et la vie publique est significative.\n\n§YCet esprit national sera retiré si nous ne sommes pas salafistes ou islamistes§!"
 alg_constitution.1.t: "La Constitution est réformée"
 alg_constitution.1.d: "Après des années de controverses, la Constitution de 1996 a été révisée. Le nouveau cadre retire certaines des dispositions les plus autoritaires, introduit des contrôles sur le pouvoir exécutif et cherche un meilleur équilibre entre les courants islamiques et laïcs de l'Algérie. Beaucoup y voient une étape nécessaire vers la réconciliation, tandis que d'autres doutent que les réformes changent vraiment le système enraciné du Pouvoir."
 alg_constitution.1.a: "Adopter la nouvelle Constitution"
 alg_constitution.1.a.tt: "Remplace la §YConstitution de 1996§! par une §YConstitution réformée§!, offrant des bonus de stabilité, de pouvoir politique et de croissance économique."
 ALG_ali_belhadj_desc: "Ali Belhadj, cofondateur du Front islamique du salut (FIS), fut l'un des dirigeants islamistes les plus charismatiques et radicaux de l'Algérie tumultueuse des années 1990. Connu pour ses sermons incendiaires, sa rhétorique sans compromis et son rejet de la politique laïque, il devint un symbole de résistance au régime du FLN. Emprisonné une grande partie de la guerre civile et banni de la politique formelle sous la Constitution de 1996, Belhadj demeure une figure polarisante : pour certains, l'incarnation du grief islamiste ; pour d'autres, un dangereux rappel de la Décennie noire. Son éventuel retour sur la scène politique soulève à la fois des espoirs de réconciliation et des craintes d'un extrémisme renouvelé."
 ALG_bouamrane_desc: "Mohamed Bouamrane a émergé dans les années 1990 comme un intellectuel et acteur politique islamiste plus modéré. Prônant le dialogue plutôt que la confrontation, il s'est positionné entre les islamistes durs comme Ali Belhadj et l'élite enracinée du FLN. Sans jamais atteindre le même attrait de masse que la direction du FIS, Bouamrane est devenu une figure respectée des débats d'après-guerre sur la réconciliation et la réforme constitutionnelle. Sa vision mettait l'accent sur une Algérie où les valeurs islamiques pouvaient coexister avec les institutions démocratiques, faisant de lui une figure de pont dans l'équilibre tendu entre politique laïque et religieuse."
 algeria_elections.2024.t: "Les élections présidentielles de 2024"
 algeria_elections.2024.d: "L'Algérie entre dans une autre élection critique. Les trois figures de premier plan incarnent des voies divergentes : Abdelmadjid Tebboune, promettant la continuité sous le FLN ; Youcef Aouchiche, plaidant pour la réforme démocratique et la modernisation libérale ; et Abdelali Hassani, soutenu par des courants islamistes cherchant un plus grand rôle de la religion en politique. Les résultats reflètent l'équilibre des pouvoirs entre les factions."
 algeria_elections.2024.a: "Abdelmadjid Tebboune assuré d'être réélu."
 algeria_elections.2024.b: "Youcef Aouchiche remporte la présidence."
 algeria_elections.2024.c: "Abdelali Hassani s'élève avec le soutien islamiste."
 ALG_tebboune_2024_tt: "§YAbdelmadjid Tebboune§! reste président avec la domination du FLN."
 ALG_aouchiche_2024_tt: "§YYoucef Aouchiche§! devient président, à la tête des libéraux réformistes."
 ALG_hassani_2024_tt: "§YAbdelali Hassani§! devient président, soutenu par les mouvements islamistes."
 algeria_gspc.1.t: "Nabil Sahraoui prend la tête du GSPC"
 algeria_gspc.1.d: "Le mécontentement a grandi au sein du Groupe salafiste pour la prédication et le combat (GSPC). De nombreux commandants ont accusé Hassan Hattab de faiblesse, critiquant son hésitation à poursuivre un djihad à grande échelle. À la mi-2003, Hattab a été écarté par ses propres hommes, et Nabil Sahraoui, figure bien plus radicale, s'est déclaré nouvel émir du GSPC."
 algeria_gspc.1.a: "L'insurrection se radicalise davantage."
 ALG_sahraoui_rise_tt: "§YNabil Sahraoui§! remplace Hassan Hattab comme nouveau chef du GSPC."
 algeria_gspc.2.t: "Sahraoui tué, Droukdel s'impose"
 algeria_gspc.2.d: "En juin 2004, les forces de sécurité algériennes ont tué Nabil Sahraoui dans un affrontement. Sa mort n'a toutefois pas affaibli l'insurrection : la direction est passée à Abdelmalek Droukdel, stratège ambitieux lié au réseau mondial d'Al-Qaïda. Sous lui, le GSPC est susceptible d'étendre et d'internationaliser son djihad."
 algeria_gspc.2.a: "Une époque plus meurtrière commence."
 ALG_droukdel_rise_tt: "§YAbdelmalek Droukdel§! devient le chef du GSPC."
 algeria_gspc.3.t: "Hassan Hattab se rend"
 algeria_gspc.3.d: "Après des années de fuite, le fondateur du GSPC, Hassan Hattab, s'est rendu aux autorités algériennes. Désillusionné par la voie du mouvement qu'il avait créé, Hattab a accepté le programme d'amnistie du gouvernement. Si son influence a décliné, sa reddition représente une victoire symbolique pour l'État algérien."
 algeria_gspc.3.a: "Un symbole de défaite pour l'insurrection."
 ALG_hattab_surrender_tt: "§YHassan Hattab§! se rend, réduisant l'activité insurrectionnelle."
 alg_generals.1.t: "Abdelkader Lounès nommé commandant de l'armée de l'air"
 alg_generals.1.d: "Le général Abdelkader Lounès a été nommé commandant de l'armée de l'air algérienne. Connu pour son accent sur la modernisation, il supervisera le développement de la puissance aérienne algérienne dans la décennie à venir."
 alg_generals.1.a: "Nos cieux sont en de sûres mains."
 alg_generals.2.t: "Amar Amrani prend le commandement de la défense aérienne"
 alg_generals.2.d: "Le général de division Amar Amrani a été placé à la tête des Forces de défense sol-air de l'Algérie. Son commandement renforcera la capacité de l'Algérie à défendre son espace aérien contre les menaces étrangères."
 alg_generals.2.a: "Notre défense aérienne se renforce."
 alg_generals.3.t: "Menad Nouba devient commandant de gendarmerie"
 alg_generals.3.d: "Le général Menad Nouba a été nommé commandant de la Gendarmerie nationale algérienne. Chargé de la sécurité intérieure et de la contre-insurrection, son commandement sera crucial pour maintenir l'ordre intérieur."
 alg_generals.3.a: "Une poigne ferme pour la sécurité de l'Algérie."
 ALG_ouyahia_pm: "Ahmed Ouyahia comme Premier ministre"
 ALG_belkhadem_pm: "Abdelaziz Belkhadem comme Premier ministre"
 ALG_interim_president.1.t: "Présidence par intérim déclarée"
 ALG_interim_president.1.d: "Après la démission de Bouteflika, l'Algérie affronte un vide de pouvoir. Par mandat constitutionnel, Abdelkader Bensalah, président de la chambre haute, est investi président par intérim pour 90 jours. Le Hirak rejette cette nomination, le voyant comme partie du même système corrompu."
 ALG_interim_president.1.a: "Nommer Abdelkader Bensalah"
 ALG_bouteflika_resigns.1.t: "Bouteflika démissionne"
 ALG_bouteflika_resigns.1.d: "Sous l'immense pression de semaines de manifestations du Hirak et du retrait du soutien de l'establishment militaire, le président Abdelaziz Bouteflika a formellement démissionné. Sa présidence de deux décennies s'est achevée, laissant l'avenir de l'Algérie incertain."
 ALG_bouteflika_resigns.1.a: "L'ère Bouteflika est terminée."
 ALG_hirak.100.t: "La voix du Hirak"
 ALG_hirak.100.d: "D'Alger à Oran, de Constantine à Tamanrasset, des millions de personnes ont défilé chaque vendredi en exigeant « Yetnahaw Ga3 » – qu'ils s'en aillent tous. L'ancien régime s'est effondré. Désormais, le Hirak doit choisir : qui portera l'esprit du 22 février au palais présidentiel d'El Mouradia ?"
 ALG_hirak.100.a: "Zoubida Assoul – La voix constitutionnelle"
 ALG_hirak.100.b: "Karim Tabbou – Le champion de la rue"
 ALG_hirak.100.c: "Hakim Addad – La génération RAJ"
 ALG_hirak.100.e: "Amira Bouraoui – La fille féroce de Barakat"
 ALG_african_trade_links: "Liens commerciaux africains"
 ALG_african_trade_links_desc: "Par des initiatives économiques et diplomatiques renforcées à travers l'Afrique, l'Algérie étend son réseau d'accords commerciaux, réduisant la dépendance aux marchés extérieurs et assurant une prospérité mutuelle avec nos partenaires continentaux."
 ALG_african_mediation_role: "Rôle de médiation africaine"
 ALG_african_mediation_role_desc: "L'Algérie s'est longtemps positionnée comme médiatrice de confiance dans les différends africains. En s'engageant activement dans la résolution des conflits, nous pouvons renforcer notre légitimité sur le continent et étendre notre influence diplomatique."
 ALG_african_union_reforms: "Pousser aux réformes de l'Union africaine"
 ALG_african_union_reforms_desc: "L'Union africaine demeure limitée dans son efficacité. En poussant des réformes, renforçant ses institutions, promouvant la responsabilité et bâtissant le consensus, nous pourrons faire de l'Algérie un dirigeant respecté au sein du cadre continental africain."
 ALG_african_economic_integration: "Intégration économique africaine"
 ALG_african_economic_integration_desc: "L'intégration économique continentale est la clé de la prospérité de l'Algérie. En abaissant les barrières commerciales et en améliorant les liens avec les partenaires africains, nous réduirons la dépendance aux marchés étrangers et favoriserons une croissance durable en Afrique."
 ALG_expand_african_investments: "Développer les investissements africains"
 ALG_expand_african_investments_desc: "Par des entreprises soutenues par l'État et la coopération avec des partenaires africains, l'Algérie peut étendre ses investissements dans les infrastructures, l'énergie et le commerce. Ces investissements dynamiseront notre économie tout en renforçant les liens à travers le continent."
 ALG_PT: "PT (Parti des Travailleurs)"
 ALG_PT_desc: "Le PT (Parti des travailleurs) est un parti trotskiste algérien, étroitement lié au Parti des travailleurs indépendants de France. Le parti est dirigé par Louisa Hanoune. Le Parti des travailleurs, qui utilise l'abréviation « PT », plaide pour la protection et la promotion des mouvements syndicaux en Algérie ; parmi ses revendications figure une doctrine égalitaire visant une meilleure répartition des richesses parmi le peuple du pays. La création de ce parti remonte à 1990, un an après la réforme constitutionnelle qui a introduit le multipartisme. Sa secrétaire générale est Louisa Hanoune, qui en 2004 fut la première femme du monde arabe à se présenter à une élection présidentielle."
 ALG_communist_education: "Éducation communiste"
 ALG_communist_education_desc: "Les jeunes esprits sont les plus influençables. Inculquer les valeurs de base du communisme à la jeune génération tout en enseignant aux étudiants universitaires la gloire de l'égalité pourrait grandement faire avancer notre cause."
 ALG_labour_focus_unions: "Contacter les syndicats"
 ALG_labour_focus_unions_desc: "Les syndicats seront très heureux d'avoir un gouvernement disposé non seulement à coopérer, mais à céder à leurs revendications. Nous veillerons à ce que leur influence ne s'étende pas au-delà de notre arrivée au pouvoir afin d'éviter des §Rconflits d'intérêts.§!"
 ALG_failures_capitalism: "Les échecs du capitalisme"
 ALG_failures_capitalism_desc: "Le capitalisme ne nous bénit plus de la richesse infinie qu'il promettait. Il est temps de suivre notre propre voie pour qu'une telle crise ne puisse plus jamais se produire ! §RL'effet de ce focus varie selon l'ampleur de la crise de la dette.§!"
 ALG_working_class: "La classe ouvrière"
 ALG_working_class_desc: "La classe ouvrière – là où les rêves naissent et meurent. Nous pouvons leur promettre d'être bien traités et de recevoir le crédit qu'ils méritent pour être le fondement du nouvel État communiste."
 ALG_communist_propaganda: "Machine de propagande"
 ALG_communist_propaganda_desc: "Grâce à notre influence croissante, nous pouvons déchaîner la machine de propagande sur l'Algérie. Bien que le coût monétaire soit élevé, cette propagande n'est pas à négliger : elle sera extrêmement efficace pour convertir la population algérienne."
 ALG_prepare_government: "Préparer un gouvernement"
 ALG_prepare_government_desc: "En mettant en place un gouvernement au sein de notre parti politique, nous assurons une transition efficace qui nous permet d'agir sur nos objectifs plus vite que nos rivaux ne pourront se reprendre. Ce sera coûteux, mais vu nos chances de gagner, c'est un pari bien placé."
 ALG_damn_market: "Maudire le marché libre"
 ALG_damn_market_desc: "Nous sommes en position de porter le coup de grâce aux capitalistes. Avec la puissance de la propagande de notre côté, nous pourrons porter le coup fatal à l'économie de marché, et ce faisant, usurper le trône de l'excès sur lequel siègent les capitalistes !"
 ALG_election_com: "Exigez des élections immédiates"
 ALG_election_com_desc: "Camarades, l'heure est venue ! Toute notre construction vers un nouvel État libre a mené à ce moment ! \n\n§RNous veillerons à ce que le gouvernement du peuple règne encore 1000 ans !§!"
 PT_flag: "PT"
 ALG_failures_capitalism_TT: "§RL'effet du focus varie selon l'ampleur de la crise de la dette.§!"
 ALG_communist_takeover_TT: "§GLe peuple algérien exige des élections !§!\n\nAssurez-vous d'avoir assez de pouvoir politique en réserve. Si vous §Réchouez§! à élire et former un gouvernement, vous §Rdevrez tenir une autre élection extraordinaire§! pour porter au pouvoir §Y[Communist-State_L]§!"
 ALG_increase_drift_TT: "§GAccroît la dérive politique vers ce parti !§!"
 ALG_wild_unions: "Syndicats sauvages"
 ALG_wild_unions_desc: "Nous avons donné du pouvoir aux syndicats et ils l'utilisent – nous n'y voyons aucun problème."
 ALG_wild_unions_2: "Syndicats sauvages"
 ALG_wild_unions_2_desc: "Les syndicats ont reçu une grande liberté durant notre montée au pouvoir. Désormais victorieux, nous ne faisons appel à eux que pour nous assurer d'avoir le cœur du peuple avant de sécuriser complètement notre base de pouvoir."
 ALG_wild_unions_3: "Syndicats sauvages"
 ALG_wild_unions_3_desc: "Les syndicats sont tout simplement insupportables, nous ne pouvons plus les supporter ! Ils ont commencé comme une nuisance, mais sont devenus un obstacle à la volonté de l'État : ils doivent être pacifiés ou détruits !"
 ALG_press_opposition: "Opposition des médias"
 ALG_press_opposition_desc: "Les médias ne nous ont pas dépeints sous le meilleur jour depuis que nous avons restauré l'ordre au gouvernement, mais il n'est que logique que les faibles craignent les forts."
 ALG_one_party: "État à parti unique"
 ALG_one_party_desc: "Après avoir déclaré que le PT est le seul parti politique autorisé en Algérie, nous avons le pouvoir de faire ce que nous voulons, mais au prix du sang à verser pour assurer la soumission de notre peuple."
 ALG_reorganize_army_idea: "Réorganisation de l'armée"
 ALG_reorganize_army_idea_desc: "Nous ne pouvons pas simplement désengager l'armée jusqu'à la dysfonction. Le temps pourra venir où nous aurons besoin de forces armées puissantes, et pour cette éventualité nous veillerons à ce que notre armée soit loyale et prête."
 ALG_new_army_idea: "Une nouvelle armée"
 ALG_new_army_idea_desc: "Nous avons vu un grand succès de la police prenant le rôle de force défensive principale. Toutefois, nous savons qu'elle n'est pas assez équipée pour repousser une invasion étrangère. Nous bâtirons une nouvelle armée axée uniquement sur la défense de l'Algérie afin d'assurer la sécurité de notre peuple."
 ALG_red_army_idea: "Une Armée Rouge"
 ALG_red_army_idea_desc: "Nous avons inculqué un fanatisme idéologique profond non seulement dans les rangs de notre armée, mais aussi dans la population civile, assurant la main-d'œuvre et la loyauté nécessaires pour aligner une armée redoutable."
 ALG_cracked_foundation: "Une fondation fissurée"
 ALG_cracked_foundation_desc: "Le fondement de l'État a été contredit tant de fois qu'à ce stade, si nous poursuivons notre voie actuelle, nous pourrions affronter une terrible nouvelle révolution. \n\n§RSi notre stabilité tombe sous 30 %, nous affronterons une révolution en Algérie !§!"
 ALG_militarist_education_idea: "Éducation militariste"
 ALG_militarist_education_idea_desc: "Le système éducatif a inculqué des valeurs militaires à son programme, permettant une plus grande préparation en cas d'attaques soudaines."
 ALG_elam: "Résurgence du Front populaire national"
 ALG_elam_desc: "Le Front national populaire a grandement étendu ses efforts pour influencer l'électeur moyen. Nous suspectons l'Algérie d'être la cause de cette « perturbation »."
 algeria.5.t: "Le PT appelle à des élections en Algérie"
 algeria.5.d: "Après avoir obtenu le soutien majoritaire de la classe ouvrière algérienne et de plusieurs figures politiques, le Parti des travailleurs (PT) a appelé le gouvernement à tenir des élections libres. Le PT a rassemblé un soutien massif, et les autorités sont sous pression de multiples côtés pour céder. Beaucoup s'attendent à une victoire décisive du PT, sa base parmi les travailleurs et les syndicats se renforçant de jour en jour. Un porte-parole a averti que si les élections sont refusées, les travailleurs lanceraient un soulèvement pour renverser le gouvernement."
 algeria.5.a: "Travailleurs d'Algérie, levez-vous !"
 algeria.5.b: "Intéressant"
 algeria.7.t: "L'Algérie bascule à gauche"
 algeria.7.d: "Avec la hausse du chômage et l'aggravation de l'inégalité économique, la classe ouvrière algérienne s'est rassemblée derrière le Parti des travailleurs (PT) d'extrême gauche. Le PT dénonce les politiques néolibérales et les violations des droits des travailleurs, tout en soutenant des positions anti-occidentales et en organisant des manifestations pour faire pression sur le gouvernement. Leur influence croît rapidement, marquant un basculement décisif à gauche de la politique algérienne."
 algeria.7.a: "Travailleurs d'Algérie, votre libération approche"
 algeria.7.b: "Intéressant"
 ALG_family_centric: "Centré sur la famille"
 ALG_family_centric_desc: "Nous encourageons les familles comme principal pilier de la société algérienne."
 ALG_religion_in_schools: "Éducation religieuse"
 ALG_religion_in_schools_desc: "Notre système éducatif intègre étroitement la religion au programme, assurant que les jeunes générations soient élevées avec de solides valeurs islamiques."
 ALG_grand_mufti_appointed: "Grand mufti d'Algérie"
 ALG_grand_mufti_appointed_desc: "Un Grand Mufti a été nommé pour interpréter la loi islamique en Algérie, renforçant la légitimité religieuse de l'État."
 ALG_islam_above_the_nation: "L'islam au-dessus de la nation"
 ALG_islam_above_the_nation_desc: "Durant le passé tumultueux de l'Algérie, le nationalisme et l'islam ont rivalisé pour façonner l'État. Pour notre avenir, l'islam doit servir de principe directeur de la gouvernance, au-dessus de tout."
 ALG_family_is_a_central_unit: "La famille avant tout"
 ALG_family_is_a_central_unit_desc: "Le cœur de la société est la famille. Un homme, une femme et leurs enfants forment le fondement de la nation. Des familles fortes assureront la prospérité et le succès de l'Algérie pour les années à venir."
 ALG_follow_religious_law: "Suivre la loi religieuse"
 ALG_follow_religious_law_desc: "La loi islamique est la meilleure base pour gouverner un pays. L'adopter comme fondement garantira justice et équité pour tous les Algériens."
 ALG_traditional_role_for_women: "Rôle traditionnel des femmes"
 ALG_traditional_role_for_women_desc: "Les femmes détiennent le plus grand honneur d'élever les enfants et de veiller sur leur famille. Tandis que les hommes travaillent à l'extérieur, les femmes doivent sauvegarder les traditions de la nation au foyer."
 ALG_religious_education: "Éducation religieuse"
 ALG_religious_education_desc: "Nos écoles doivent intégrer étroitement les études religieuses à leur programme. Dès l'enfance, les Algériens doivent apprendre le Coran et les pratiques islamiques."
 ALG_appoint_grand_mufti: "Nommer un Grand Mufti"
 ALG_appoint_grand_mufti_desc: "L'Algérie a besoin d'un Grand Mufti pour interpréter la loi islamique. Nous devons nommer un savant respecté pour fournir une guidance religieuse à l'État."
 ALG_abrogate_secular_constitution: "Abroger la constitution laïque"
 ALG_abrogate_secular_constitution_desc: "La constitution actuelle maintient un cadre laïc hérité de l'indépendance. La seule loi que nous devons suivre est le Coran, non des textes faits de main d'homme."
 ALG_enahda_media_network: "Réseau médiatique Ennahda"
 ALG_enahda_media_network_desc: "Nous devons établir un réseau de télévision national pour diffuser le message du Grand Mufti et promouvoir les valeurs islamiques à travers l'Algérie."
 ALG_supreme_islamic_council: "Haut Conseil islamique"
 ALG_supreme_islamic_council_desc: "Pour sauvegarder le nouvel État, nous devons créer un Conseil islamique suprême, un organe consultatif pour soutenir le Grand Mufti et assurer que l'Algérie demeure fermement sur la voie de la foi."
 ALG_edu_and_social_policy: "Éducation et politique sociale"
 ALG_edu_and_social_policy_desc: "La prospérité à long terme de l'Algérie dépend de plus que des ressources naturelles : elle repose sur les fondations de l'éducation, de la santé et des protections sociales. En réformant ces secteurs, nous pourrons forger un nouveau contrat social pour le XXIe siècle."
 ALG_expand_primary_education: "Étendre l'enseignement primaire"
 ALG_expand_primary_education_desc: "Étendre l'accès aux écoles primaires dans les zones rurales et urbaines réduira l'analphabétisme et bâtira un fondement pour le développement national."
 ALG_reform_secondary_curriculum: "Réformer le programme du secondaire"
 ALG_reform_secondary_curriculum_desc: "Nos lycées doivent être réformés pour répondre aux exigences d'une économie moderne, tout en préservant l'identité algérienne."
 ALG_western_curriculum: "Adopter le programme occidental"
 ALG_western_curriculum_desc: "En intégrant des programmes d'orientation occidentale, nous pourrons exposer notre jeunesse aux sciences modernes et aux normes mondiales, améliorant la compétitivité de l'Algérie."
 ALG_national_curriculum: "Renforcer le programme national"
 ALG_national_curriculum_desc: "Au lieu de copier des modèles étrangers, nous devons nous concentrer sur l'arabisation et les valeurs culturelles algériennes dans nos écoles afin de préserver la souveraineté éducative."
 ALG_university_reform: "Réforme universitaire"
 ALG_university_reform_desc: "Nos universités doivent être étendues et modernisées pour former des professionnels, des chercheurs et des innovateurs capables de conduire l'avenir de l'Algérie."
 ALG_basic_healthcare_access: "Accès aux soins de santé de base"
 ALG_basic_healthcare_access_desc: "Chaque Algérien mérite d'accéder aux soins de santé de base. Étendre la couverture est un premier pas vers une nation en meilleure santé."
 ALG_state_hospitals: "Agrandir les hôpitaux d’État"
 ALG_state_hospitals_desc: "En investissant dans un système hospitalier dirigé par l'État, nous pourrons garantir des soins gratuits et accessibles à tous les Algériens, même à un coût significatif pour le Trésor."
 ALG_modernize_state_hospitals: "Moderniser les hôpitaux publics"
 ALG_modernize_state_hospitals_desc: "Mettre à niveau l'équipement, former les médecins et améliorer les infrastructures renforcera le réseau de santé de l'État."
 ALG_universal_healthcare: "Soins de santé universels"
 ALG_universal_healthcare_desc: "La santé est un droit, non un privilège. L'Algérie s'engagera à bâtir un système de santé pleinement universel."
 ALG_private_healthcare: "Encourager les soins de santé privés"
 ALG_private_healthcare_desc: "En promouvant les hôpitaux et cliniques privés, nous pourrons réduire la charge de l'État et introduire la concurrence de marché dans la santé."
 ALG_expand_private_clinics: "Développer les cliniques privées"
 ALG_expand_private_clinics_desc: "Les cliniques privées peuvent compléter le système public en offrant des services plus spécialisés, surtout dans les zones urbaines."
 ALG_national_insurance: "Système d'assurance nationale"
 ALG_national_insurance_desc: "Un régime national d'assurance maladie unifiera les soins publics et privés sous un filet de sécurité unique pour les citoyens algériens."
 ALG_minimum_income_guarantee: "Garantie de revenu minimum"
 ALG_minimum_income_guarantee_desc: "L'État garantira un niveau de revenu minimum pour les plus vulnérables, protégeant les Algériens de la pauvreté absolue."
 ALG_housing_support: "Aide au logement"
 ALG_housing_support_desc: "Des programmes de logement subventionné fourniront des foyers abordables aux familles ouvrières et réduiront la surpopulation urbaine."
 ALG_childcare_support: "Aide à la garde d'enfants"
 ALG_childcare_support_desc: "Soutenir les crèches et les allocations familiales aidera les jeunes familles à élever des enfants sans difficultés financières."
 ALG_fuel_subsidies: "Subventions aux carburants"
 ALG_fuel_subsidies_desc: "En subventionnant les prix du carburant, nous pourrons rendre le transport et le chauffage abordables pour les Algériens ordinaires, même si cela pèse sur le Trésor."
 ALG_food_subsidies: "Subventions alimentaires"
 ALG_food_subsidies_desc: "Protéger le prix du pain et des denrées essentielles garantira qu'aucune famille algérienne ne souffre de la faim."
 ALG_welfare_consolidation: "Consolider l’État-providence"
 ALG_welfare_consolidation_desc: "En fusionnant nos programmes sociaux en un système de protection sociale complet, l'Algérie établira un filet de sécurité moderne."
 ALG_civil_rights_protections: "Protections des droits civiques"
 ALG_civil_rights_protections_desc: "Garantir les droits et libertés fondamentaux renforcera la stabilité nationale et réduira les griefs."
 ALG_gender_equality: "Promouvoir l’égalité des sexes"
 ALG_gender_equality_desc: "Autonomiser les femmes algériennes par l'égalité des droits et des opportunités est la clé d'une société juste et prospère."
 ALG_freedom_of_press: "Garantir la liberté de la presse"
 ALG_freedom_of_press_desc: "Une presse libre est essentielle à la démocratie et à la responsabilité. Soutenir les médias indépendants donnera aux Algériens une voix plus forte."
 ALG_judicial_reform: "Réforme judiciaire"
 ALG_judicial_reform_desc: "Un judiciaire moderne et indépendant garantira des procès équitables, réduira la corruption et renforcera l'État de droit."
 ALG_civil_society_empowerment: "Autonomiser la société civile"
 ALG_civil_society_empowerment_desc: "Soutenir les ONG, les syndicats et les organisations de terrain créera une société plus participative et résiliente."
 ALG_digital_government: "Gouvernement numérique"
 ALG_digital_government_desc: "La numérisation réduira la bureaucratie, améliorera la transparence et rapprochera les services publics du peuple."
 ALG_public_service_efficiency: "Efficacité des services publics"
 ALG_public_service_efficiency_desc: "En modernisant le secteur public, nous pourrons éliminer les inefficacités et améliorer la prestation des services."
 ALG_anti_corruption_campaign: "Campagne anticorruption"
 ALG_anti_corruption_campaign_desc: "La corruption sape l'État. Une campagne globale contre elle restaurera la confiance dans les institutions algériennes."
 ALG_e_governance_portal: "Portail de gouvernance électronique"
 ALG_e_governance_portal_desc: "Créer une plateforme d'e-gouvernance intégrée fournira aux citoyens des services publics transparents, rapides et accessibles."
 ALG_streamlined_bureaucracy: "Rationaliser la bureaucratie"
 ALG_streamlined_bureaucracy_desc: "En réduisant les formalités et en modernisant les structures administratives, l'Algérie deviendra plus efficace et compétitive."
 ALG_social_contract_21st_century: "Un contrat social pour le XXIe siècle"
 ALG_social_contract_21st_century_desc: "Par l'éducation, la santé, la protection sociale, les droits civils et les réformes administratives, l'Algérie forgera un nouveau contrat social qui assurera stabilité, justice et prospérité pour les générations à venir."
 ALG_corrupt_mil_idea: "Armée corrompue"
 ALG_corrupt_mil_idea_desc: "L'armée algérienne, bien que puissante et profondément enracinée en politique, souffre d'une corruption omniprésente. Les ressources destinées à la modernisation et à l'efficacité sont siphonnées par des généraux et des réseaux de clientèle. Cela sape la capacité opérationnelle et érode la confiance du public, rendant les réformes difficiles tout en enracinant le rôle de l'armée comme à la fois gardienne et obstacle au progrès."
 ALG_military_oversight: "Tutelle militaire"
 ALG_military_oversight_desc: "L'armée a établi une tutelle serrée sur la politique et les institutions civiles. Si cela assure la stabilité et prévient le chaos, cela réduit aussi la transparence, restreint les réformes et renforce la domination de l'armée dans la vie publique."
 ALG_gas_pipeline_leverage: "Levier du gazoduc"
 ALG_gas_pipeline_leverage_desc: "Le vaste réseau de gazoducs algériens vers l'Europe constitue un puissant levier de politique étrangère. La dépendance énergétique rend les partenaires prudents, mais crée aussi une trop grande dépendance aux exportations d'hydrocarbures pour maintenir ce levier politique."
 ALG_resource_curse: "Malédiction des ressources"
 ALG_resource_curse_desc: "Malgré d'immenses réserves de pétrole et de gaz, l'Algérie lutte contre la « malédiction des ressources ». La dépendance aux hydrocarbures alimente la corruption, décourage la diversification et expose l'économie à la volatilité des marchés énergétiques mondiaux."
 ALG_PM_Elections: "Nommer un Premier ministre"
 ALG_PM_Elections_desc: "\n£MAIN_desctext_elections\n\n\n\nLe président doit décider de la nomination d'un Premier ministre à la tête du gouvernement. Ce choix n'est pas seulement administratif : différents candidats représentent des visions concurrentes de l'avenir de l'Algérie, des technocrates loyaux aux réformistes d'opposition."
 ALG_authority_more_70: "Les §Yréformistes§! détiennent au moins §Y70 %§! d'influence £generic_anarchist_communism au sein du gouvernement algérien [ROOT.GetFlag]"
 ALG_PNA_victory_tt: "§Le Pouvoir§! détient plus de §Y45 %§! de l'influence dans l'équilibre des pouvoirs."
 ALG_prime_minister_name_loc: "Premier ministre"
 ALG_minister_bio_loc: "Détenteur de l'autorité exécutive sous le président."
 algeria_morocco.1.t: "La question marocaine"
 algeria_morocco.1.d: "Les relations de l'Algérie avec le Maroc ont longtemps été assombries par l'héritage amer de la guerre des Sables, le conflit du Sahara occidental et des décennies de frontières fermées. Les tensions couvant encore, la question de l'approche du Maroc se pose avec force. L'Algérie doit-elle redoubler dans sa rivalité historique, ou tenter de tracer une nouvelle voie de dialogue et de coopération ?"
 algeria_morocco.1.a: "L'avenir du Maghreb est en jeu."
 ALG_morocco_question: "La question marocaine"
 ALG_morocco_question_desc: "Notre rivalité avec le Maroc autour du Sahara occidental, de la guerre des Sables et de la fermeture des frontières depuis des décennies a laissé l'Algérie affaiblie. Nous devons décider : affronterons-nous le Maroc, ou poursuivrons-nous la réconciliation ?\n\n§YCe focus ouvre la branche de la question marocaine.§!"
 ALG_sand_war_legacy: "Héritage de la guerre des Sables"
 ALG_sand_war_legacy_desc: "Les plaies de la guerre des Sables de 1963 demeurent. Les Algériens se souviennent des ambitions marocaines sur notre territoire, et beaucoup appellent à une vigilance renouvelée."
 ALG_close_the_border: "Fermer la frontière"
 ALG_close_the_border_desc: "La frontière avec le Maroc demeure une source de contrebande, de troubles et d'espionnage. La fermer enverra un message fort de défi."
 ALG_border_security_investments: "Investissements dans la sécurité frontalière"
 ALG_border_security_investments_desc: "Nous devons renforcer la frontière occidentale par des postes militaires permanents, une surveillance moderne et des unités de gendarmerie pour tenir l'influence marocaine à distance."
 ALG_counter_moroccan_influence: "Contrer l’influence marocaine"
 ALG_counter_moroccan_influence_desc: "Le Maroc cherche activement des alliés à l'étranger. L'Algérie doit contrer cette offensive diplomatique, coupant leur influence en Afrique et au-delà."
 ALG_support_polisario_struggle: "Soutenir la lutte du Polisario"
 ALG_support_polisario_struggle_desc: "Le peuple sahraoui mérite l'indépendance. En soutenant le Front Polisario, l'Algérie renforce son rôle de championne de la lutte anticoloniale au Maghreb."
 ALG_internationalize_conflict: "Internationaliser le conflit"
 ALG_internationalize_conflict_desc: "La question du Sahara occidental doit être portée à l'ONU, à l'UA et à tous les forums possibles afin de faire pression diplomatiquement sur le Maroc."
 ALG_african_union_pressure: "Mobiliser l'Union africaine"
 ALG_african_union_pressure_desc: "Par l'Union africaine, l'Algérie bâtira une coalition d'États pressant le Maroc d'accepter l'autodétermination sahraouie."
 ALG_seek_dialogue_morocco: "Chercher le dialogue avec le Maroc"
 ALG_seek_dialogue_morocco_desc: "L'Algérie doit explorer des canaux diplomatiques avec le Maroc. Si les guerres et rivalités passées nous divisent, le dialogue pourra mener à la stabilité régionale."
 ALG_confidence_building: "Mesures de confiance"
 ALG_confidence_building_desc: "De petits pas comme des comités conjoints et la réduction des restrictions de visas pourront créer la base d'une confiance durable avec le Maroc."
 ALG_reopen_borders: "Rouvrir les frontières"
 ALG_reopen_borders_desc: "Après des années de fermeture, rouvrir la frontière à la libre circulation des personnes et des biens serait un tournant historique dans nos relations."
 ALG_economic_cooperation: "Coopération économique"
 ALG_economic_cooperation_desc: "L'interdépendance économique avec le Maroc apportera la prospérité, réduira les tensions et renforcera le rôle régional de l'Algérie."
 ALG_security_cooperation: "Coopération sécuritaire"
 ALG_security_cooperation_desc: "Des menaces partagées comme le terrorisme et la contrebande exigent des patrouilles conjointes et le partage d'informations. La coopération est plus efficace que la rivalité."
 ALG_towards_maghreb_union: "Vers une Union du Maghreb"
 ALG_towards_maghreb_union_desc: "Avec le Maroc, l'Algérie peut poser le fondement d'une Union du Maghreb forte, écho des rêves de nos aïeux d'unité nord-africaine."
 ALG_morocco.1.t: "Débat à l'ONU sur le Sahara occidental"
 ALG_morocco.1.d: "L'Algérie a porté la question du Sahara occidental devant les Nations unies, condamnant le contrôle marocain du territoire. Les délégués débattent de savoir si le Maroc doit se retirer ou si l'Algérie dépasse son rôle."
 ALG_morocco.1.a: "Condamner durement le Maroc"
 ALG_morocco.1.b: "Pousser des sanctions et résolutions modérées"
 ALG_moroccan_rivalry_start: "Tensions frontalières avec le Maroc"
 ALG_moroccan_rivalry_start_desc: "Des décennies d'hostilité avec le Maroc, alimentées par la guerre des Sables, le Sahara occidental et la fermeture de la frontière en 1994, pèsent lourdement sur l'Algérie. Les tensions nuisent à notre économie, notre stabilité et notre préparation militaire.\n§RCet esprit national ne peut être retiré normalement.§!\nIl ne sera réduit, remplacé ou retiré qu'en progressant dans l'arbre de focus de la §Yquestion marocaine§!."
 ALG_moroccan_rivalry_A1: "Contrer l’influence marocaine"
 ALG_moroccan_rivalry_A1_desc: "L'Algérie a pris des mesures pour émousser l'influence marocaine dans la région. La rivalité persiste, mais ses effets sont mieux gérés."
 ALG_moroccan_rivalry_A2: "Rivalité accrue"
 ALG_moroccan_rivalry_A2_desc: "Les tensions avec le Maroc demeurent un fardeau pour l'État, mais notre détermination et nos réformes en ont limité l'impact."
 ALG_moroccan_rivalry_A_final: "Préparation militaire contre le Maroc"
 ALG_moroccan_rivalry_A_final_desc: "Par des années de confrontation, l'Algérie a bâti une armée endurcie et capable, prête au conflit. La rivalité a forgé la force dans l'adversité."
 ALG_moroccan_reconciliation_B1: "Ouvertures diplomatiques"
 ALG_moroccan_reconciliation_B1_desc: "L'Algérie a fait des pas prudents vers le dialogue avec le Maroc, créant des opportunités de coopération limitée et de construction de la confiance."
 ALG_moroccan_reconciliation_B2: "Ouvrir les frontières"
 ALG_moroccan_reconciliation_B2_desc: "Les liens diplomatiques s'approfondissant, l'Algérie a rouvert ses frontières avec le Maroc, réduisant la pression économique et favorisant le commerce régional."
 ALG_moroccan_reconciliation_B_final: "Coopération maghrébine"
 ALG_moroccan_reconciliation_B_final_desc: "L'Algérie et le Maroc ont embrassé la coopération, permettant le commerce, le développement et le leadership régional. La rivalité est enfin derrière nous."
 ALG_morocco_question_tt: "§YCe focus ouvre la voie de la question marocaine.§!\n\n- §RVoie A :§! Poursuivre la confrontation avec le Maroc – affaiblir progressivement le malus, pour aboutir à une §Garmée plus forte§!.\n- §GVoie B :§! Chercher la réconciliation avec le Maroc – remplacer le malus par des §Gbonus positifs§! croissants, pour aboutir à une §Yéconomie et une diplomatie§! plus fortes."
 alg_general.1.t: "Le retour de Khaled Nezzar"
 alg_general.1.d: "Avec la décision de relancer les méthodes de la Décennie noire, l'ancien ministre de la Défense controversé, Khaled Nezzar, est de nouveau appelé. Son approche de poing de fer pourra stabiliser l'armée, mais risque d'aliéner la population et d'attirer les critiques internationales."
 alg_general.1.a: "Le passé revient guider le présent."
