 CZE_petr_pavel_scripted_gui_missions_text_text: "[CZE_petr_pavel_scripted_gui_missions_scripted_text]"
 CZE_petr_pavel_scripted_gui_missions_scripted_text_one: "As missões militares têm maior impacto no treinamento de Pavel, mas também levam mais tempo para ser concluídas. Esse tipo de missão se concentra em operações militares e decisões-chave.\n§RVocê só pode ter 1 missão ativa!§!"
 CZE_petr_pavel_scripted_gui_politics_text_text: "[CZE_petr_pavel_scripted_gui_politics_scripted_text]"
 CZE_petr_pavel_scripted_gui_politics_scripted_text_one: "As missões políticas são concluídas mais rápido, mas às vezes podem ter impacto ainda maior que as militares. Concentram-se principalmente em planejar estratégias e outras operações.\n§RVocê só pode ter 1 missão ativa!§!"
 CZE_petr_pavel_scripted_gui_north_flank_button_text_text: "[CZE_petr_pavel_scripted_gui_north_flank_button_one_scripted_text]"
 CZE_petr_pavel_scripted_gui_north_button_one_scripted_text_one: "Programa Defensivo da Força Expedicionária"
 CZE_petr_pavel_scripted_gui_north_button_one_scripted_text_two: "§GPrograma Defensivo da Força Expedicionária§!"
 CZE_petr_pavel_scripted_gui_north_flank_button_delayed_text: "A Força Expedicionária Conjunta (JEF) é uma parceria militar multinacional do norte da Europa, liderada pelo Reino Unido e concebida para resposta rápida e operações expedicionárias.\n\n[CZE_petr_pavel_scripted_gui_north_flank_button_one_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_button_click]"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_north_flank_politics_button_one_scripted_text]"
 CZE_petr_pavel_scripted_gui_north_politics_button_one_scripted_text_one: "Representante em Brunssum"
 CZE_petr_pavel_scripted_gui_north_politics_button_one_scripted_text_two: "§GRepresentante em Brunssum§!"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_delayed_text: "O Comando da Força Conjunta Aliada de Brunssum (JFCBS) é um comando da OTAN com sede em Brunssum, nos Países Baixos. Foi estabelecido em 2004, como parte de uma reorganização que reduziu o número de quartéis-generais da Estrutura de Comando Militar da OTAN.\n\n[CZE_petr_pavel_scripted_gui_north_flank_politics_button_one_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_click]"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_text_text: "[CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_north_politics_button_two_scripted_text_one: "Representante no País de Gales"
 CZE_petr_pavel_scripted_gui_north_politics_button_two_scripted_text_two: "§GRepresentante no País de Gales§!"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_delayed_text: "A Cúpula de 2014 da Organização do Tratado do Atlântico Norte (OTAN) no País de Gales foi a 25ª cúpula de chefes de Estado e de governo dos países da OTAN, realizada em Newport, no País de Gales, nos dias 4 e 5 de setembro de 2014. Essas cúpulas são realizadas esporadicamente e permitem que líderes e autoridades dos Aliados da OTAN discutam questões atuais de interesse mútuo e planejem atividades estratégicas. A cúpula de 2014 foi descrita pelo almirante da Marinha dos EUA James G. Stavridis como a mais importante desde a queda do Muro de Berlim.\n\n[CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_click]"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_text_text: "[CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_scripted_text]"
 CZE_petr_pavel_scripted_gui_north_politics_button_three_scripted_text_one: "Representante no SHAPE"
 CZE_petr_pavel_scripted_gui_north_politics_button_three_scripted_text_two: "§GRepresentante no SHAPE§!"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_delayed_text: "O Quartel-General Supremo das Potências Aliadas na Europa (SHAPE) é o quartel-general militar do Comando Aliado de Operações (ACO) da OTAN, que comanda todas as operações da OTAN em todo o mundo. O SHAPE fica na vila de Casteau, perto de Mons, na Bélgica. De 1951 a 2003, o SHAPE foi o quartel-general do Comando Aliado na Europa (ACE). Desde 2003, o SHAPE é o quartel-general do ACO, controlando a OTAN também fora da Europa. Mesmo com a ampliação do alcance geográfico de suas atividades, o SHAPE manteve seu nome tradicional, com referência à Europa.\n\n[CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_click]"
 CZE_petr_pavel_scripted_gui_east_south_flank_button_text_text: "[CZE_petr_pavel_scripted_gui_east_south_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_east_south_button_scripted_text_one: "Operação Ramo de Oliveira"
 CZE_petr_pavel_scripted_gui_east_south_button_scripted_text_two: "§GOperação Ramo de Oliveira§!"
 CZE_petr_pavel_scripted_gui_east_south_flank_button_delayed_text: "A Operação Ramo de Oliveira foi uma operação militar transfronteiriça conduzida pelas Forças Armadas da Turquia e pelo Exército Nacional Sírio (SNA) no distrito de Afrin, de maioria curda, no noroeste da Síria, contra as Unidades de Proteção Popular (YPG) das Forças Democráticas Sírias (SDF). A guerra aérea e o uso de artilharia pesada terminaram quando as milícias árabes e turcomanas do SNA entraram na cidade de Afrin em 18 de março de 2018, e teve início a insurgência das SDF no norte de Aleppo.\n\n[CZE_petr_pavel_scripted_gui_east_south_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_button_click]"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_east_south_politics_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_scripted_text_one: "O Livro Branco da Defesa"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_scripted_text_two: "§GO Livro Branco da Defesa§!"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_delayed_text: "O Livro Branco fornece instruções, sugestões e estratégias sobre como o país deve desenvolver seu sistema defensivo. Petr Pavel foi um dos generais presentes na redação do Livro Branco do programa de defesa da República Tcheca. Olhando para nossos aliados, podemos perguntar à Hungria e à Eslováquia se nossos planos devem incluir também a segurança deles.\n\n[CZE_petr_pavel_scripted_gui_east_south_politics_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_click]"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_two_text_text: "[CZE_petr_pavel_scripted_gui_east_south_politics_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_two_scripted_text_one: "Apoiar a Operação KFOR"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_two_scripted_text_two: "§GApoiar a Operação KFOR§!"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_two_delayed_text: "A Força do Kosovo (KFOR) é uma força internacional de manutenção da paz no Kosovo, liderada pela OTAN. Suas operações estão sendo gradualmente reduzidas até que a Força de Segurança do Kosovo, criada em 2009, se torne autossuficiente. A KFOR entrou no Kosovo em 12 de junho de 1999, dois dias após o Conselho de Segurança da ONU adotar a Resolução 1244. Na época, o Kosovo enfrentava uma grave crise humanitária, com forças militares da Iugoslávia em combates diários contra o Exército de Libertação do Kosovo (UÇK).\n\n[CZE_petr_pavel_scripted_gui_east_south_politics_button_two_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_two_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_two_click]"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_three_text_text: "[CZE_petr_pavel_scripted_gui_east_south_politics_button_three_scripted_text]"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_three_scripted_text_one: "Operação Althea"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_three_scripted_text_two: "§GOperação Althea§!"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_three_delayed_text: "A Operação Althea, formalmente a Força da União Europeia na Bósnia e Herzegovina (EUFOR), é uma missão militar na Bósnia e Herzegovina para supervisionar a implementação militar do Acordo de Dayton. É a sucessora da SFOR e da IFOR da OTAN. A transição da SFOR para a EUFOR foi em grande parte uma mudança de nome e de comandantes: 80% das tropas permaneceram no lugar. Ela substituiu a SFOR em 2 de dezembro de 2004.\n\n[CZE_petr_pavel_scripted_gui_east_south_politics_button_three_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_three_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_three_click]"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_text_text: "[CZE_petr_pavel_scripted_gui_eastern_flank_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_scripted_text_one: "Presença Avançada Reforçada"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_scripted_text_two: "§GPresença Avançada Reforçada§!"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_delayed_text: "A Presença Avançada Reforçada é uma força militar aliada da OTAN, de defesa e dissuasão, posicionada à frente no norte, centro e leste da Europa. Após a invasão da Crimeia pela Rússia, os Estados-membros da OTAN concordaram, na cúpula de Varsóvia de 2016, em posicionar à frente quatro grupos de combate multinacionais de batalhão nas áreas com maior probabilidade de ataque.\n\n[CZE_petr_pavel_scripted_gui_eastern_flank_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_button_click]"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_two_text_text: "[CZE_petr_pavel_scripted_gui_eastern_flank_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_two_scripted_text_one: "Operação Atlantic Resolve"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_two_scripted_text_two: "§GOperação Atlantic Resolve§!"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_two_delayed_text: "A Operação Atlantic Resolve foi financiada pela Iniciativa Europeia de Dissuasão. Os EUA e o Reino Unido tomaram várias medidas imediatas para reforçar a postura de dissuasão ao longo do flanco leste da OTAN, incluindo o aumento da presença aérea, terrestre e naval na região e a intensificação de exercícios previamente programados.\nOs EUA descreveram as atividades como medidas para reforçar os planos militares e as capacidades de defesa da OTAN e manter uma presença contínua na Europa Central e Oriental. As rotações da Atlantic Resolve são supervisionadas por um quartel-general regionalmente alinhado ali instalado.\n\n[CZE_petr_pavel_scripted_gui_eastern_flank_button_two_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_button_two_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_button_two_click]"
 CZE_petr_pavel_scripted_gui_eastern_flank_political_button_text_text: "[CZE_petr_pavel_scripted_gui_eastern_flank_political_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_eastern_flank_political_button_scripted_text_one: "Apoio ao Policiamento Aéreo do Báltico"
 CZE_petr_pavel_scripted_gui_eastern_flank_political_button_scripted_text_two: "§GApoio ao Policiamento Aéreo do Báltico§!"
 CZE_petr_pavel_scripted_gui_eastern_flank_political_button_delayed_text: "A missão de policiamento aéreo do Báltico é um Alerta de Reação Rápida (QRA) de defesa aérea da OTAN para proteger o espaço aéreo dos três países bálticos: Estônia, Letônia e Lituânia.\n\n[CZE_petr_pavel_scripted_gui_eastern_flank_political_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_political_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_political_button_click]"
 CZE_petr_pavel_scripted_gui_usa_button_text_text: "[CZE_petr_pavel_scripted_gui_usa_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_usa_button_scripted_text_one: "Oficial de Ligação do CENTCOM"
 CZE_petr_pavel_scripted_gui_usa_button_scripted_text_two: "§GOficial de Ligação do CENTCOM§!"
 CZE_petr_pavel_scripted_gui_usa_button_delayed_text: "O Comando Central dos Estados Unidos (USCENTCOM ou CENTCOM) é um dos onze comandos de combate unificados do Departamento de Defesa dos EUA. Foi estabelecido em 1983. Sua Área de Responsabilidade (AOR) inclui o Oriente Médio (inclusive o Egito, na África), a Ásia Central e partes do Sul da Ásia. O comando tem sido a principal presença americana em muitas operações militares, incluindo a Operação Tempestade no Deserto da Guerra do Golfo Pérsico em 1991, a Guerra do Afeganistão e a Guerra do Iraque, de 2003 a 2011.\n\n[CZE_petr_pavel_scripted_gui_usa_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_usa_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_usa_button_click]"
 CZE_petr_pavel_scripted_gui_usa_button_two_text_text: "[CZE_petr_pavel_scripted_gui_usa_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_usa_button_two_scripted_text_one: "Operação Liberdade Duradoura"
 CZE_petr_pavel_scripted_gui_usa_button_two_scripted_text_two: "§GOperação Liberdade Duradoura§!"
 CZE_petr_pavel_scripted_gui_usa_button_two_delayed_text: "A Operação Liberdade Duradoura (OEF) foi o nome oficial usado pelo governo dos EUA tanto para a primeira fase (2001-2014) da Guerra do Afeganistão (2001-2021) quanto para a Guerra Global contra o Terror, de escala maior. Em 7 de outubro de 2001, em resposta aos ataques de 11 de setembro, o presidente George W. Bush anunciou que haviam começado os ataques aéreos contra a Al-Qaeda e o Talibã no Afeganistão.\n\n[CZE_petr_pavel_scripted_gui_usa_button_two_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_usa_button_two_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_usa_button_two_click]"
 CZE_petr_pavel_scripted_gui_usa_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_usa_politics_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_usa_politics_button_scripted_text_one: "Reunião no Pentágono"
 CZE_petr_pavel_scripted_gui_usa_politics_button_scripted_text_two: "§GReunião no Pentágono§!"
 CZE_petr_pavel_scripted_gui_usa_politics_button_delayed_text: "O Pentágono é a sede do Departamento de Defesa dos Estados Unidos, na Virgínia, perto de Washington. É um dos maiores edifícios de escritórios do mundo, com seu característico formato pentagonal. Foi concluído em 1943, durante a Segunda Guerra Mundial, e tem servido como centro operacional das forças armadas americanas.\n\nAbriga os escritórios militares e civis do Departamento de Defesa, bem como as sedes dos mais importantes comandos militares dos EUA. É um centro fundamental de planejamento estratégico.\n\nPetr Pavel poderá cooperar com os mais importantes estrategistas dos EUA, o que certamente o ajudará a se aprimorar ainda mais.\n\n[CZE_petr_pavel_scripted_gui_usa_politics_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_usa_politics_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_usa_politics_button_click]"
 CZE_petr_pavel_scripted_gui_russia_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_russia_politics_button_one_scripted_text]"
 CZE_petr_pavel_scripted_gui_russia_politics_button_one_scripted_text_one: "Aquecer as Relações"
 CZE_petr_pavel_scripted_gui_russia_politics_button_one_scripted_text_two: "§GAquecer as Relações§!"
 CZE_petr_pavel_scripted_gui_russia_politics_button_delayed_text: "A Rússia está novamente se tornando mais agressiva em suas ações. Não podemos deixar essa situação se agravar ainda mais, e um bom movimento será manter ao menos relações cordiais com esse país.\n\n[CZE_petr_pavel_scripted_gui_russia_politics_button_one_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_russia_politics_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_russia_politics_button_click]"
 CZE_petr_pavel_scripted_gui_russia_button_text_text: "[CZE_petr_pavel_scripted_gui_russia_button_one_scripted_text]"
 CZE_petr_pavel_scripted_gui_russia_button_one_scripted_text_one: "Delegação Diplomática"
 CZE_petr_pavel_scripted_gui_russia_button_one_scripted_text_two: "§GDelegação Diplomática§!"
 CZE_petr_pavel_scripted_gui_russia_button_delayed_text: "A Rússia é um país que precisa estar sempre sob vigilância. Enviaremos Petr Pavel em uma missão diplomática para manter nossa relação em bom nível.\n\n[CZE_petr_pavel_scripted_gui_russia_button_one_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_russia_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_russia_button_click]"
 CZE_petr_pavel_scripted_gui_qatar_button_text_text: "[CZE_petr_pavel_scripted_gui_qatar_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_qatar_button_scripted_text_one: "2ª Guerra do Golfo"
 CZE_petr_pavel_scripted_gui_qatar_button_scripted_text_two: "§G2ª Guerra do Golfo§!"
 CZE_petr_pavel_scripted_gui_qatar_button_delayed_text: "A Segunda Guerra do Golfo foi uma invasão rápida do Iraque que mais tarde causou uma guerra de 8 anos no território ocupado. Durante a invasão, Petr Pavel cooperou com as forças americanas a partir do Catar, atuando como oficial de ligação. Foi também ele quem alertou o alto comando sobre a possibilidade de um ataque iraquiano com armas biológicas.\n\n[CZE_petr_pavel_scripted_gui_qatar_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_qatar_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_qatar_button_click]"
 CZE_petr_pavel_scripted_gui_qatar_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_qatar_politics_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_qatar_politics_button_scripted_text_one: "Manter as Relações Após a 2ª Guerra do Golfo"
 CZE_petr_pavel_scripted_gui_qatar_politics_button_scripted_text_two: "§GManter as Relações Após a 2ª Guerra do Golfo§!"
 CZE_petr_pavel_scripted_gui_qatar_politics_button_delayed_text: "Após a 2ª Guerra do Golfo, seria bom manter boas relações com o Catar, caso ocorram eventos inesperados.\n\n[CZE_petr_pavel_scripted_gui_qatar_politics_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_qatar_politics_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_qatar_politics_button_click]"
 CZE_petr_pavel_scripted_gui_iraq_text_text: "[CZE_petr_pavel_scripted_gui_iraq_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_iraq_button_scripted_text_one: "Ajudar nos Esforços da 2ª Guerra do Golfo"
 CZE_petr_pavel_scripted_gui_iraq_button_scripted_text_two: "§GAjudar nos Esforços da 2ª Guerra do Golfo§!"
 CZE_petr_pavel_scripted_gui_iraq_delayed_text: "Os EUA não tinham o direito de invadir o Iraque. Nosso governo é da mesma opinião e, sejam ou não nossos aliados, essa agressão precisa ser detida.\n\n[CZE_petr_pavel_scripted_gui_iraq_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_iraq_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_iraq_button_click]"
 CZE_petr_pavel_scripted_gui_iraq_politics_text_text: "[CZE_petr_pavel_scripted_gui_iraq_politics_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_iraq_politics_button_scripted_text_one: "Aproximação dos Governos"
 CZE_petr_pavel_scripted_gui_iraq_politics_button_scripted_text_two: "§GAproximação dos Governos§!"
 CZE_petr_pavel_scripted_gui_iraq_politics_delayed_text: "O Iraque sofreu muito com esta guerra. Eles devem saber que têm o nosso apoio. Petr Pavel se saiu bem anteriormente durante a Segunda Guerra do Golfo, então vamos enviá-lo para lá novamente.\n\n[CZE_petr_pavel_scripted_gui_iraq_politics_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_iraq_politics_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_iraq_politics_button_click]"
 CZE_petr_pavel_scripted_gui_afghanistan_button_text_text: "[CZE_petr_pavel_scripted_gui_afghanistan_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_afghanistan_button_scripted_text_one: "Força Int. de Assistência à Segurança"
 CZE_petr_pavel_scripted_gui_afghanistan_button_scripted_text_two: "§GForça Int. de Assistência à Segurança§!"
 CZE_petr_pavel_scripted_gui_afghanistan_button_delayed_text: "A Força Internacional de Assistência à Segurança é uma missão militar multinacional no Afeganistão. O principal objetivo da ISAF era treinar as Forças Nacionais de Segurança Afegãs (ANSF) e ajudar o Afeganistão a reconstruir instituições governamentais essenciais; gradualmente, ela passou a participar da guerra mais ampla no Afeganistão contra a insurgência talibã.\n\n[CZE_petr_pavel_scripted_gui_afghanistan_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_button_click]"
 CZE_petr_pavel_scripted_gui_afghanistan_button_two_text_text: "[CZE_petr_pavel_scripted_gui_afghanistan_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_afghanistan_button_two_scripted_text_one: "Plano de Estratégia Antitalibã"
 CZE_petr_pavel_scripted_gui_afghanistan_button_two_scripted_text_two: "§GPlano de Estratégia Antitalibã§!"
 CZE_petr_pavel_scripted_gui_afghanistan_button_two_delayed_text: "Apesar de nossos esforços, o Afeganistão ainda precisa de nossa ajuda. O treinamento anterior permitirá que Petr Pavel planeje uma grande operação ofensiva. Esta será um teste importante na carreira de Pavel e, se ele passar, a guerra poderá terminar bem mais rápido.\n\n[CZE_petr_pavel_scripted_gui_afghanistan_button_two_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_button_two_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_button_two_click]"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_text_text: "[CZE_petr_pavel_scripted_gui_afghanistan_political_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_scripted_text_one: "Operação Apoio Resoluto"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_scripted_text_two: "§GOperação Apoio Resoluto§!"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_delayed_text: "A Missão Apoio Resoluto (RSM), ou Operação Apoio Resoluto, foi uma missão multinacional liderada pela OTAN no Afeganistão. Começou em 1º de janeiro de 2015 como sucessora da Força Internacional de Assistência à Segurança. Era uma missão sem combate, voltada a aconselhar e treinar as forças de segurança afegãs para garantir a segurança de longo prazo do país.\n\n[CZE_petr_pavel_scripted_gui_afghanistan_political_button_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_political_button_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_political_button_click]"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_text_text: "[CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_scripted_text_one: "Estratégia para Vencer os Talibãs"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_scripted_text_two: "§GEstratégia para Vencer os Talibãs§!"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_delayed_text: "A guerra contra os talibãs não termina. É hora de começar a preparar uma nova estratégia para pressioná-los novamente. Infelizmente, precisamos da permissão do alto comando afegão para realizar tal operação. Se eles recusarem, Petr Pavel terá de encerrar seu treinamento no Afeganistão após esta missão.\n\n[CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_delayed_scripted_text]\n\n§YPré-requisitos:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_click_enabled]\n\n§YEfeitos:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_click]"
 CZE_adaptation_to_urban_fight_tactics_modifier: "Adaptação às Táticas de Combate Urbano"
 CZE_skoda_laboratories_modifier: "Laboratórios Škoda"
 CZE_skoda_superb_productivity_modifier: "£GFX_CZE_skoda_small Fator de Produtividade dos Carros Škoda Superb"
 CZE_petr_pavel_modifier: "Missões de Petr Pavel"
 CZE_SLO_open_political_court: "Abrir a Corte Política"
 CZE_SLO_open_political_court_desc: "Após a queda da Tchecoslováquia, a República Tcheca e a Eslováquia tornaram-se nações independentes. Os dois países têm cultura, história e relações em comum. Seus objetivos políticos atuais podem ser diferentes, mas ainda compartilham alguns programas comuns. Um país pode afetar o outro e, quem sabe, um dia a reintegração volte a ser possível."
 CZE_SLO_start_looking_into_the_future: "Começar a Olhar para o Futuro"
 CZE_SLO_start_looking_into_the_future_desc: "O comunismo partiu completamente da Europa; é hora de abandonar as velhas tradições e avançar rumo a posturas democráticas e independentes."
 CZE_SLO_question_divide: "Questionar a Divisão"
 CZE_SLO_question_divide_desc: "O regime comunista enfraqueceu nossa nação, o que nos forçou a nos dividir e quase desabar por completo... Talvez, se nos esforçarmos de verdade, possamos voltar a ser um só país."
 CZE_SLO_close_up_of_the_governments: "Aproximação dos Governos"
 CZE_SLO_close_up_of_the_governments_desc: "Ambos os governos compartilham objetivos comuns e visões apenas ligeiramente diferentes. Podemos tentar nos alinhar um pouco mais."
 CZE_SLO_upgrade_industrial_sector: "Modernizar o Setor Industrial"
 CZE_SLO_upgrade_industrial_sector_desc: "Nossa indústria tem sido muito voltada ao setor militar. Em vez disso, devemos mirar a indústria civil."
 CZE_SLO_stop_border_controls: "Encerrar os Controles de Fronteira"
 CZE_SLO_stop_border_controls_desc: "Não há necessidade de separar ainda mais nossas nações. As restrições de fronteira são desnecessárias."
 CZE_SLO_d1_highway_construction: "Construção da Rodovia D1"
 CZE_SLO_d1_highway_construction_desc: "Tecnicamente, existem 2 rodovias D1. Uma fica na República Tcheca, a outra na Eslováquia. Juntos, podemos finalmente concluir esses projetos."
 CZE_SLO_discuss_about_european_union: "Discutir sobre a União Europeia"
 CZE_SLO_discuss_about_european_union_desc: "A famosa União Europeia. É boa, mas talvez devêssemos considerar um caminho mais neutro."
 CZE_SLO_protect_democratic_values: "Proteger os Valores Democráticos"
 CZE_SLO_protect_democratic_values_desc: "Portanto, é melhor permanecer com o resto da Europa. Ambos nos beneficiaremos disso."
 CZE_SLO_stay_neutral: "Permanecer Neutro"
 CZE_SLO_stay_neutral_desc: "Nossas nações estão se desenvolvendo bem sem a ajuda da UE. Ficaremos bem."
 CZE_SLO_further_eu_integration: "Maior Integração com a UE"
 CZE_SLO_further_eu_integration_desc: "Quanto mais amigáveis formos com os países da UE, maior a chance de que aceitem nossa adesão no futuro."
 CZE_SLO_focus_on_internal_sphere: "Focar na Esfera Interna"
 CZE_SLO_focus_on_internal_sphere_desc: "Nossas nações têm inimigos externos, mas também dentro de nossas fronteiras. Devemos nos manter fortes e não deixar que nossos inimigos influenciem nossas decisões."
 CZE_SLO_secure_common_interests: "Garantir os Interesses Comuns"
 CZE_SLO_secure_common_interests_desc: "Devemos economizar algum dinheiro e reduzir nossas dívidas. Isso nos ajudará no desenvolvimento futuro."
 CZE_SLO_nato_problem: "O Problema da OTAN"
 CZE_SLO_nato_problem_desc: "A OTAN é uma aliança que exerce uma pressão muito alta sobre o desenvolvimento do exército, especialmente nos países maiores. Mas não é requisito ter um grande exército. Talvez devêssemos considerar soluções mais internas."
 CZE_SLO_mutual_army_training: "Treinamento Mútuo dos Exércitos"
 CZE_SLO_mutual_army_training_desc: "Tchecos e eslovacos lutaram juntos em muitos conflitos. Devemos nos unir novamente e lutar juntos."
 CZE_SLO_join_nato_conflicts: "Participar dos Conflitos da OTAN"
 CZE_SLO_join_nato_conflicts_desc: "As forças da OTAN estão presentes em muitos dos conflitos atuais. Podemos nos juntar a elas e ganhar muita experiência militar com seu estilo de luta."
 CZE_SLO_regional_protectionism: "Protecionismo Regional"
 CZE_SLO_regional_protectionism_desc: "A Tchecoslováquia sempre preferiu soluções mais defensivas. Devemos focar no protecionismo regional em vez de entrar em conflitos globais."
 CZE_SLO_connect_army_doctrines: "Conectar as Doutrinas do Exército"
 CZE_SLO_connect_army_doctrines_desc: "Nossas doutrinas são semelhantes, mas ligeiramente diferentes. Podemos resolver isso facilmente implementando uma doutrina comum."
 CZE_SLO_re_integration_project: "Projeto de Reintegração"
 CZE_SLO_re_integration_project_desc: "Já estamos divididos há tempo demais. É hora de levar isso a sério e iniciar o projeto de reintegração, que permitirá que nossas nações se unam novamente sob 1 bandeira."
 CZE_SLO_begin_reforming_czechoslovakia: "Iniciar a Reforma da Tchecoslováquia"
 CZE_SLO_begin_reforming_czechoslovakia_desc: "Nosso plano prevê a unificação pacífica de ambos os países. Temos de convencer nosso povo de que é uma boa ideia, preparar uma nova lei e obter apoio no exército, dizendo que não é traição nem coisa parecida... Temos muito trabalho a fazer, então vamos nos mexer!"
 CZE_SLO_no_more_dividing: "Chega de Divisão"
 CZE_SLO_no_more_dividing_desc: "Finalmente estamos prontos para unificar nossas nações. O último passo cabe ao nosso vizinho. Se aceitarem nossa oferta, a Tchecoslováquia ressurgirá."
 CZE_SLO_defensive_posture: "Postura Defensiva"
 CZE_SLO_defensive_posture_desc: "A Tchecoslováquia sempre visou doutrinas defensivas. Mais importante é proteger nossa nação do que invadir outros países."
 CZE_SLO_bring_back_sudetenland_forts: "Trazer de Volta os Fortes dos Sudetos"
 CZE_SLO_bring_back_sudetenland_forts_desc: "A Alemanha é... uma vizinha complicada. A antiga Tchecoslováquia perdeu o controle dos Sudetos antes de poder usar sua grande linha defensiva. Não repetiremos esse erro."
 CZE_SLO_improve_strategic_targets: "Melhorar os Alvos Estratégicos"
 CZE_SLO_improve_strategic_targets_desc: "Nossas capitais estrangeiras são atualmente os pontos estratégicos mais importantes a defender. Garantiremos que ninguém consiga romper suas fortificações."
 CZE_SLO_advantage_of_mountain_areas: "Vantagem das Áreas Montanhosas"
 CZE_SLO_advantage_of_mountain_areas_desc: "Os Sudetos na Tchéquia e os Cárpatos na Eslováquia. Temos uma paisagem perfeita para treinar alpinistas e fortificar as trilhas de montanha mais difíceis de atravessar."
 CZE_SLO_homeland_defence: "Defesa da Pátria"
 CZE_SLO_homeland_defence_desc: "Nossos soldados costumavam treinar apenas no território de seu país. Agora temos 2 nações em 1 país. A paisagem é parecida, mas nosso exército ainda precisa aprender a proteger cada pedaço de nossa terra."
 CZE_SLO_power_of_the_two_economies: "O Poder das Duas Economias"
 CZE_SLO_power_of_the_two_economies_desc: "A República Tcheca tem poderosas empresas industriais como a Škoda e a Tatra. A Eslováquia também vem desenvolvendo sua indústria de motorização. Se nossas empresas começarem a trabalhar juntas, poderemos ter um impacto ainda maior no mercado de motorização do que a alemã Volkswagen."
 CZE_SLO_blur_industrial_differences: "Diluir as Diferenças Industriais"
 CZE_SLO_blur_industrial_differences_desc: "Algumas regiões se desenvolveram mais rápido que outras. Um novo programa de construção ajudará a desenvolver as regiões mais fracas e tornar nossa indústria mais dispersa, o que dificultará o trabalho de nosso inimigo para destruir nossa economia em caso de guerra."
 CZE_SLO_slovakian_nuclear_reactors: "Reatores Nucleares Eslovacos"
 CZE_SLO_slovakian_nuclear_reactors_desc: "Com a ajuda de cientistas tchecos, a região eslovaca pode melhorar seus reatores nucleares e se preparar para a construção de um novo bloco de reator."
 CZE_SLO_take_advantage_of_green_energy: "Aproveitar a Energia Verde"
 CZE_SLO_take_advantage_of_green_energy_desc: "A energia renovável é o futuro do nosso país e do mundo inteiro. Os reatores nucleares são ótimos geradores de energia com emissões baixas ou nulas. Devemos fazer o possível para promover essa forma de geração de energia."
 CZE_SLO_intensify_coal_extraction: "Intensificar a Extração de Carvão"
 CZE_SLO_intensify_coal_extraction_desc: "Ainda temos muito carvão, gás e outras fontes naturais de energia sob nossos pés. Antes de migrarmos para a energia verde, vale esgotar essas minas e não desperdiçar nenhum recurso."
 CZE_SLO_czechoslovakian_army: "Exército Tchecoslovaco"
 CZE_SLO_czechoslovakian_army_desc: "Sempre defendemos a segurança interna e a estratégia de dissuasão. E o que ganhamos com isso? A ocupação alemã e soviética. O estilo defensivo falhou conosco, então é hora de dar uma guinada de 180 graus e começar a preparar nosso exército para uma abordagem ofensiva."
 CZE_SLO_military_concerns: "Preocupações Militares"
 CZE_SLO_military_concerns_desc: "A tcheca VOP CZ é uma conhecida fabricante de veículos militares. Vamos ajudá-la a se desenvolver melhor e mais rápido para que nosso exército também cresça mais depressa."
 CZE_SLO_always_be_ready_for_war: "Estar Sempre Pronto para a Guerra"
 CZE_SLO_always_be_ready_for_war_desc: "O inimigo pode atacar quando não esperamos. A partir de agora, nada surpreenderá nossas forças."
 CZE_SLO_begin_smaller_demands: "Começar com Exigências Menores"
 CZE_SLO_begin_smaller_demands_desc: "Todos têm exigido algo de NÓS; agora exigiremos algo DELES. Estamos prestes a recuperar nossos territórios há muito perdidos."
 CZE_SLO_claim_zaolzi: "Reivindicar Zaolzie"
 CZE_SLO_claim_zaolzi_desc: "Polônia, Polônia, Polônia... Zaolzie deveria ser nossa, assim como metade da sua região sul."
 CZE_SLO_forever_together: "Juntos para Sempre"
 CZE_SLO_forever_together_desc: "As recentes reformas e mudanças militares se encaixaram muito bem em nosso estilo comum. A Tchecoslováquia está verdadeiramente reformada e nada nos dividirá nunca mais."
 CZE_SLO_diplomatic_proposition: "Proposta Diplomática"
 CZE_SLO_diplomatic_proposition_desc: "Antes de... persuadi-los a se unificar conosco, podemos lhes propor que se rendam agora mesmo, sem luta."
 CZE_SLO_rapid_intervention: "Intervenção Rápida"
 CZE_SLO_rapid_intervention_desc: "A diplomacia não nos ajudará nesse projeto. Hora de tomar medidas mais brutais."
 CZE_SLO_new_dawn_of_czechoslovakia: "Nova Aurora da Tchecoslováquia"
 CZE_SLO_new_dawn_of_czechoslovakia_desc: "Nossos países estão unidos mais uma vez. Finalmente é hora de reformar nossa Tchecoslováquia há muito perdida, desta vez sob nova gestão."
 CZE_SLO_far_reaching_ambitions: "Ambições de Longo Alcance"
 CZE_SLO_far_reaching_ambitions_desc: "O que nos impede agora de recuperar nossos antigos territórios e ir ainda mais longe? A pacífica aurora do milênio acabou há muito tempo."
 CZE_SLO_restore_sudetenland_forts: "Restaurar os Fortes dos Sudetos"
 CZE_SLO_restore_sudetenland_forts_desc: "Não se pode confiar na Alemanha. O tolo anterior... hã, um dos governos tchecoslovacos anteriores não conseguiu defender seu país dos invasores estrangeiros. Ninguém voltará a exigir nossa subjugação sem consequências!"
 CZE_SLO_western_charge: "Investida Ocidental"
 CZE_SLO_western_charge_desc: "A OTAN pagará por nos deixar sob o regime comunista por mais de quatro décadas! Preparem-se, Europa Ocidental, pois estamos indo atrás de vocês, seus traidores desprezíveis!"
 CZE_SLO_ensure_dominance_in_the_center_europe: "Garantir o Domínio na Europa Central"
 CZE_SLO_ensure_dominance_in_the_center_europe_desc: "Nossos vizinhos mais próximos atacaram nossa nação muitas vezes. Vencemos a Hungria, mas ninguém trará de volta nossos soldados e civis mortos. Todos pagarão pelos erros de seus governos anteriores!"
 CZE_SLO_protect_the_karpaty_mountains: "Proteger os Montes Cárpatos"
 CZE_SLO_protect_the_karpaty_mountains_desc: "A Ucrânia é um país forte, mas a região dos Cárpatos não é muito grande e, se atacada por vários lados ao mesmo tempo, pode ser muito fácil de conquistar. Devemos reforçar nossa passagem de montanha."
 CZE_SLO_eastern_charge: "Investida Oriental"
 CZE_SLO_eastern_charge_desc: "41 anos... 41 anos de regime comunista. A Rússia sempre teve ambições imperialistas. Seja URSS ou Federação Russa, o novo governo sempre tenta ser pior que o anterior. Chega de opressão, é hora de finalmente revidar!"
 CZE_SLO_post_unification_chaos: "Caos Pós-Unificação"
 CZE_SLO_post_unification_chaos_desc: "Nossa diplomacia agressiva deixou muito descontentamento e papelada por cumprir. Acho que devemos resolver esse caos..."
 CZE_SLO_media_propaganda: "Propaganda na Mídia"
 CZE_SLO_media_propaganda_desc: "O povo acreditará em tudo que a televisão lhe mostrar. Também podemos usar a internet para contrabalançar os sites confiáveis."
 CZE_SLO_form_new_parliament: "Formar Novo Parlamento"
 CZE_SLO_form_new_parliament_desc: "Se colocarmos no parlamento políticos de nosso vizinho anexado, teremos mais aceitação por parte deles e eles nos ajudarão a estabilizar a administração."
 CZE_SLO_ensure_loyalty_in_the_army: "Garantir a Lealdade no Exército"
 CZE_SLO_ensure_loyalty_in_the_army_desc: "Há um certo general tcheco, Petr Pavel. Ele não quer participar dessa bagunça, mas sinto que pode nos causar muitos problemas no futuro... De qualquer forma, o exército está se revoltando e temos de impedir isso se não quisermos ser derrubados."
 CZE_SLO_return_of_the_heavy_industry: "O Retorno da Indústria Pesada"
 CZE_SLO_return_of_the_heavy_industry_desc: "A região tcheca tem muitas empresas militares que produziam equipamento militar no século passado. Devemos procurá-las e restaurar algumas de suas fábricas militares."
 CZE_SLO_new_skoda_works_factory: "Nova Fábrica da Škoda Works"
 CZE_SLO_new_skoda_works_factory_desc: "A Škoda produzia anteriormente veículos militares e caminhões mecanizados. Vejamos se ainda se lembram de como produzir esse tipo de equipamento."
 CZE_SLO_restoration_of_the_zbrojovka_brno: "Restauração da Zbrojovka Brno"
 CZE_SLO_restoration_of_the_zbrojovka_brno_desc: "A Zbrojovka Brno é uma fabricante de armas leves em Brno, República Tcheca, pertencente integralmente ao Grupo Colt-CZ. No passado, também fabricou artilharia leve, carros, motocicletas, tratores e várias ferramentas, como máquinas de escrever e os primeiros computadores."
 CZE_SLO_modernized_tanks_production: "Produção de Tanques Modernizados"
 CZE_SLO_modernized_tanks_production_desc: "Graças às antigas plantas da Škoda, podemos modernizar seus protótipos e adaptá-los às condições mais recentes de guerra."
 CZE_SLO_cooperation_with_vop_cz: "Cooperação com a VOP CZ"
 CZE_SLO_cooperation_with_vop_cz_desc: "A VOP CZ ainda está ativa na República Tcheca. Essa empresa nunca abandonou a produção de armas e será ótima parceira de cooperação."
 CZE_SLO_mass_equipment_production: "Produção em Massa de Equipamentos"
 CZE_SLO_mass_equipment_production_desc: "Às vezes temos de tornar nossas fábricas mais rápidas ao custo de um maior tempo de construção."
 CZE_SLO_czechoslovakia_category: "Situação Tchecoslovaca"
 CZE_SLO_czechoslovakia_category_desc: "A Tchecoslováquia foi criada após a capitulação das Potências Centrais no fim da Primeira Guerra Mundial. Rapidamente tornou-se um dos países mais estáveis da Europa, até ser anexada pelo III Reich, um ano antes da Segunda Guerra Mundial. Foi quando ocorreu a primeira divisão, com o estabelecimento da Boêmia e Morávia e do Estado da República Eslovaca. A guerra terminou, novamente com derrota da Alemanha, e a Tchecoslováquia foi restaurada às suas fronteiras como a Terceira República Tchecoslovaca.\n\nEm 1948, a União Soviética se fez introduzir e estabeleceu um regime comunista, rebatizando a Terceira República Tchecoslovaca como República Socialista Tchecoslovaca. O país seguiu os protestos anticomunistas de 1989, iniciando a Revolução de Veludo e derrubando o comunismo. 41 anos de subjugação comunista conseguiram desestabilizar o país e dividir o povo, levando ao colapso da Tchecoslováquia em 31 de dezembro de 1992. A República Tcheca e a Eslováquia tornaram-se nações independentes, sob dois governos, fronteiras e diplomacias diferentes.\n\nMas o povo continuou o mesmo, assim como sua cultura e história. A divisão era inevitável alguns anos atrás, mas hoje, quando a situação volta a ficar estável, talvez haja uma chance de reconexão e, com um pequeno empurrão decisivo, dois países podem voltar a ser um só."
 CZE_SLO_stop_reunification: "Impedir a Reunificação"
 CZE_SLO_stop_reunification_desc: "O retorno da Tchecoslováquia não trará nada de bom para nossas nações. Vamos interromper esse processo antes que seja tarde demais."
 CZE_SLO_welfare_sector: "§CAbrir Setor de Bem-Estar§!"
 CZE_SLO_welfare_sector_desc: "Nosso povo ficou dividido por causa da partição. Temos de trabalhar juntos se quisermos torná-lo uma só nação novamente."
 CZE_SLO_welfare_sector_close: "§CFechar Setor de Bem-Estar§!"
 CZE_SLO_welfare_sector_announce_cooperation_in_media: "Anunciar a Cooperação na Mídia"
 CZE_SLO_welfare_sector_organize_common_events: "Organizar Eventos Comuns"
 CZE_SLO_welfare_sector_increase_culture_expenditure: "Aumentar os Gastos com Cultura"
 CZE_SLO_welfare_sector_decrease_opinion_mission: "§RQueda na Opinião do Povo§!"
 CZE_SLO_welfare_sector_decrease_opinion_mission_desc: "Nossa intervenção forçada deixou o povo descontente com nossas ações recentes... Pode valer a pena acalmar as massas."
 CZE_SLO_welfare_sector_seek_support_among_politicians: "Buscar Apoio entre os Políticos"
 CZE_SLO_welfare_sector_media_propaganda: "Propaganda na Mídia"
 CZE_SLO_law_sector: "§OAbrir Setor Jurídico§!"
 CZE_SLO_law_sector_desc: "Temos 2 constituições, mas elas também são muito parecidas. Nossos países formaram governos diferentes e introduziram leis diferentes. Temos de diluir essas diferenças e tornar nossa lei comum."
 CZE_SLO_law_sector_close: "§OFechar Setor Jurídico§!"
 CZE_SLO_law_sector_change_the_criminal_law: "Unificar o Direito Penal"
 CZE_SLO_law_sector_change_the_constitutional_law: "Modificar o Direito Constitucional"
 CZE_SLO_law_sector_change_the_civil_law: "Alterar o Direito Civil"
 CZE_SLO_law_sector_change_the_labor_law: "Nova Lei Trabalhista"
 CZE_SLO_law_sector_decrease_opinion_mission: "§RQueda na Similaridade Legal§!"
 CZE_SLO_law_sector_decrease_opinion_mission_desc: "Como anexamos nosso vizinho sem unificar nossas leis, a administração está agora em total caos. Se não organizarmos os órgãos e o parlamento, cairemos em total anarquia!"
 CZE_SLO_law_sector_quick_law_change: "Mudança Rápida na Lei"
 CZE_SLO_law_sector_reform_the_administration: "Reforma da Administração"
 CZE_SLO_military_sector: "§GAbrir Setor Militar§!"
 CZE_SLO_military_sector_close: "§GFechar Setor Militar§!"
 CZE_SLO_military_sector_organize_new_training_program: "Organizar Novo Programa de Treinamento"
 CZE_SLO_military_sector_mutual_officer_trainings: "Treinamentos Mútuos de Oficiais"
 CZE_SLO_military_sector_decrease_opinion_mission: "§RQueda no Apoio Militar§!"
 CZE_SLO_military_sector_real_enemy_is_outside_our_borders: "O Verdadeiro Inimigo Está Fora de Nossas Fronteiras"
 CZE_SLO_military_sector_organize_military_structure: "Reorganizar a Estrutura Militar"
 CZE_SLO_slovakian_nuclear_research: "Pesquisa Nuclear Tcheco-Eslovaca"
 CZE_SLO_slovakian_nuclear_research_desc: "A região da República Tcheca tem reatores muito melhores que os eslovacos. Para ajudar a integrar os reatores eslovacos à tecnologia tcheca, cientistas nucleares tchecos trabalharão junto com os eslovacos para preparar seus reatores para uma importante modernização."
 CZE_SLO_improved_slovakian_nuclear_fuel: "Combustível Nuclear Eslovaco Aprimorado"
 CZE_SLO_begin_construction_of_new_nuclear_reactor: "Iniciar a Construção de Novo Reator Nuclear"
 CZE_SLO_event.1.t: "Oferta de Garantia Mútua"
 CZE_SLO_event.1.d: "O governo vizinho está tentando manter a relação comum entre nossos países e quer garantir que continuemos amigos após a partição da Tchecoslováquia. Eles nos oferecem um pacto de não agressão que incluirá garantia de independência."
 CZE_SLO_event.1.a: "Claro"
 CZE_SLO_event.1.b: "Temos outros planos"
 CZE_SLO_event.2.t: "Programa de Cooperação Ampliada com a OTAN"
 CZE_SLO_event.2.d: "Nossos países precisam finalmente decidir que lado tomar. A OTAN foca em treinamento militar e protecionismo em toda a região, mas a Europa é atualmente um continente de paz (quase), então talvez valha investir mais em nossas forças policiais em vez do exército."
 CZE_SLO_event.2.a: "Nossas forças armadas devem ser mais fortes"
 CZE_SLO_event.2.b: "As forças policiais são mais importantes hoje"
 CZE_SLO_event.3.t: "[FROM.GetName] Opta por Mais Treinamentos Militares"
 CZE_SLO_event.3.d: "[FROM.GetName] decidiu se integrar mais aos países da OTAN e vai aumentar a intensidade dos treinamentos militares para estar mais bem preparada em caso de guerra. Devemos também escolher esta doutrina?"
 CZE_SLO_event.3.a: "Nós nos juntaremos a eles"
 CZE_SLO_event.3.b: "Absurdo"
 CZE_SLO_event.4.t: "[FROM.GetName] Opta por Mais Apoio às Forças Policiais"
 CZE_SLO_event.4.d: "[FROM.GetName] decidiu desenvolver suas forças policiais em vez de se integrar com outros países da OTAN. Para eles, a segurança interna é mais importante do que preparativos para uma guerra que talvez nunca venha. Devemos nos juntar a eles?"
 CZE_SLO_event.4.a: "Nós nos juntaremos a eles"
 CZE_SLO_event.4.b: "Absurdo"
 CZE_SLO_event.5.t: "A Tchecoslováquia Colapsou!"
 CZE_SLO_event.5.d: "A recém-reformada Tchecoslováquia não suportou as tensões crescentes criadas após a unificação forçada. [CZE.GetName] e [SLO.GetName] voltaram a ser dois países independentes, e o país que forçou a unificação agora enfrenta um enorme colapso econômico."
 CZE_SLO_event.5.a: "..."
 CZE_SLO_event.5.b: "Foi uma ideia estúpida"
 CZE_SLO_event.6.t: "Proposta para Reformar a Tchecoslováquia!"
 CZE_SLO_event.6.d: "Nosso vizinho tomou a iniciativa e decidiu realizar nossos objetivos comuns de restaurar a Tchecoslováquia. O governo deles diz que, como prepararam tudo, ficarão encarregados do novo parlamento e das novas estruturas do país, mas ambas as nações se beneficiarão muito dessa ação. Se assinarmos o documento, a Tchecoslováquia será restaurada e nossas nações estarão novamente juntas sob uma só bandeira."
 CZE_SLO_event.6.a: "Esperamos tanto por isso!"
 CZE_SLO_event.6.b: "Não, nunca voltaremos a isso"
 CZE_SLO_event.7.t: "A Tchecoslováquia Está de Volta ao Mapa!"
 CZE_SLO_event.7.d: "A República Tcheca e a Eslováquia decidiram se unir novamente sob 1 bandeira. O país que caiu após a derrubada do regime comunista está de volta ao mapa."
 CZE_SLO_event.7.a: "Depois de todos esses anos..."
 CZE_SLO_event.7.b: "Uhuuuuu!!!!!"
 CZE_SLO_event.8.t: "[FROM.GetName] Recusa a Unificação"
 CZE_SLO_event.8.d: "[FROM.GetName] decidiu não se unificar neste momento. A República Tcheca e a Eslováquia permanecerão divididas até que outro político tente unir ambos os países novamente."
 CZE_SLO_event.8.a: "Eles vão pagar..."
 CZE_SLO_event.8.b: "Não podemos fazer nada quanto a isso"
 CZE_SLO_event.9.t: "A Tchecoslováquia Exige [701.GetName]"
 CZE_SLO_event.9.d: "A Tchecoslováquia é um país relativamente antigo. [701.GetName] pertencia originalmente a eles quando conquistaram a independência após a Primeira Guerra Mundial. Perderam este território após a Segunda Guerra Mundial e ele foi anexado à União Soviética. Agora está em nossas terras, mas talvez este pequeno pedaço de terreno não valha outra guerra."
 CZE_SLO_event.9.a: "É deles"
 CZE_SLO_event.9.b: "Nem pensar"
 CZE_SLO_event.10.t: "A Tchecoslováquia Recupera [701.GetName]!"
 CZE_SLO_event.10.d: "A Tchecoslováquia assumiu o controle de seu antigo território, que lhe foi tomado à força décadas atrás. Alguns dizem que é apenas o começo de suas exigências, mas por ora não parece muito prejudicial..."
 CZE_SLO_event.10.a: "Perfeito"
 CZE_SLO_event.10.b: "Ok?"
 CZE_SLO_event.11.t: "[FROM.GetName] Recusa!"
 CZE_SLO_event.11.d: "[FROM.GetName] recusou nossa oferta de transferir o nosso estado há muito perdido [701.GetName] para nossos territórios. A tensão entre a Tchecoslováquia e [FROM.GetName] está muito alta e esse pequeno conflito pode até escalar para uma guerra total."
 CZE_SLO_event.11.a: "Ainda não acabou!"
 CZE_Army_2000.01.t: "Modernizar a Frota de Blindados de Transporte Tchecos"
 CZE_Army_2000.01.d: "A modernização das Forças Armadas Tchecas tornou-se uma preocupação premente, e nossa frota envelhecida de Veículos Blindados de Transporte de Pessoal (APCs) precisa ser substituída. Devemos agora decidir se adquirimos modelos de última geração de nossos vizinhos ou desenvolvemos nosso próprio projeto nacional. Cada escolha traz seus próprios benefícios estratégicos e compensações. Devemos confiar na tecnologia militar da Áustria, recorrer à Polônia para uma parceria regional mais estreita ou investir no desenvolvimento de nossa própria capacidade de produção nacional?"
