l_korean:
 GENERIC_political_reform: "정치 개혁"
 GENERIC_political_reform_desc: "정치권의 침체를 막기 위해서는 정부가 나라를 유지하고 그 구성원들이 활발하고 관심있게 정치에 그 소임을 다해야 합니다. 이는 법률 제정 초안의 제출, 국회의원의 선출, 재정 지출 계획의 통과, 공공 사업 계획 같은 것을 포함합니다.[Root.GetAdjective] 정부는 지금에 만족하지 않고 나라를 더 부강하고 발전시킬 것입니다."
 GENERIC_cabinet_reform: "내각 개편"
 GENERIC_cabinet_reform_desc: "현 정책에 반하는 내각의 주요인사 몇 몇을 교체하는 것으로 행정부는 앞으로 있을 정치적 문제와 위기에서 결단력을 낼 수 있습니다. 즉, 내각 개편을 통해 우리는 불평분자들과 패배주의자, 반대주의자들을 무시할 수 있게 됩니다."
 GENERIC_expand_the_secret_service: "첩보 조직 확장"
 GENERIC_expand_the_secret_service_desc: "[Root.GetNameDef]의 국가안보는 군사 및 민간 첩보원에 크게 의지하고 있습니다. 우리는 적대 세력의 첩보원, 사회전복 시도, 테러, (가능성은 낮지만) 핵 공격에 대한 효과적인 대응책을 마련해야 합니다."
 GENERIC_build_intelligence_stations: "첩보 시설 건설"
 GENERIC_build_intelligence_stations_desc: "A follow-up to World War 2's RADAR stations, the Intelligence Stations will provide us with detailed reports on enemy troop movements and incoming aircraft. We will use the experiences from the espionage affairs and intrigue of the Cold War era."
 GENERIC_strengthen_government: "정부 강화"
 GENERIC_strengthen_government_desc: "우리의 기존 정부는 어느 정도 강화가 필요합니다. 우리 당을 정치적으로 강화하면 다양한 정책을 추진할 수 있는 선택권이 더 많아질 것입니다."
 GENERIC_political_games: "정치 게임"
 GENERIC_political_games_desc: "광범위한 정치 문화가 없는 정부는 무엇일까요? 우리는 정치적 환경이 번영하고 안정을 유지하려면 토론과 논의의 씨앗을 심어야 합니다."
 GENERIC_the_establishment: "확립"
 GENERIC_the_establishment_desc: "체제의 인물들이 국가 정치에 대한 영향력을 강화해왔습니다. 우리는 국가 문제에 대한 추가적인 권한을 확보하기 위해 이를 잘 활용할 수 있습니다."
 GENERIC_the_state: "국가"
 GENERIC_the_state_desc: "우리 땅에 관한 모든 것에 확고한 의지를 갖고 있다면, 우리는 오랫동안 우리 나라를 괴롭혀 온 분열과 지연이라는 해충을 단번에 제거할 수 있을 것입니다."
 GENERIC_diplomatic_positions: "외교적 위치"
 GENERIC_diplomatic_positions_desc: "정치적 개혁과 외교 문제에 대한 우리의 집중을 통해, 우리는 더욱 광범위한 국제 협력을 위해 이웃 국가들과 응집력 있는 외교적 입장을 확립할 수 있습니다."
 GENERIC_our_place: "우리의 위치"
 GENERIC_our_place_desc: "주권은 우리의 것입니다 - 그리고 우리는 우리의 영향력을 행사하는 탐욕적인 손들로부터 자유로워질 자격이 있습니다."
 GENERIC_station_in_the_world: "세계의 전망"
 GENERIC_station_in_the_world_desc: "국가를 세계에 공개하는 것은 우리에게 많은 이점을 가져올 것입니다 - 그 중에는 우리의 지도자들에게 실질적인 권력을 부여하는 것도 포함됩니다."
 GENERIC_the_west: "서방 세계"
 GENERIC_the_west_desc: "서방 국가는 민주주의와 자유를 강조하며, 미국을 중심으로 행동합니다. 서방 국가들은 세계 정치 상태를 유지하기 위해 노력합니다."
 GENERIC_eastern_emergence: "동양의 신흥국"
 GENERIC_eastern_emergence_desc: "Politically Emerging countries wish to deviate from the current world order, and set up new organisations to replace the old ones. While not strictly anti-US or anti-West, Emerging countries often try to undermine Western influences."
 GENERIC_the_nationalist_rise: "민족주의 증가"
 GENERIC_the_nationalist_rise_desc: "민족주의 국가들은 자신과 국가의 과거 영광에 집중합니다. 이들은 종종 권위주의 정치에 빠지고, 단일 민족이나 민족의 존재를 촉진합니다."
 GENERIC_the_salafist_rise: "살라피스트 증가"
 GENERIC_the_salafist_rise_desc: "살라피즘은 이슬람에 대한 초보수적인 해석입니다. 살라피스트들은 이슬람을 전통적이고 문자 그대로의 뿌리로 되돌리기 위해, 필요하다면 강제로 이슬람을 개혁하려고 합니다."
 GENERIC_western_ideas: "서구 이념"
 GENERIC_western_ideas_desc: "The ideals of democracy and freedom that the West holds so dearly are key to the success of any respectable nation-state. We should adopt them."
 GENERIC_the_rising_powers: "떠오르는 강자"
 GENERIC_the_rising_powers_desc: "한 국가가 보이지 않는 인형술사들의 규칙을 얼마나 오래 따라야 합니까? 이 부당하고 부패한 세계 질서에서 벗어나 우리의 형제들과 함께 떠오릅시다."
 GENERIC_us_above_all: "무엇보다 우리"
 GENERIC_us_above_all_desc: "국가는 이 세상에서 유일하게 신성하고 순수한 것입니다. 국가는 존중받아야 할 뿐 아니라 다른 이들이 어떻게 생각하든 그 필요가 충족되어야 합니다!"
 GENERIC_jihad: "지하드"
 GENERIC_jihad_desc: "알라는 가장 위대하시다!"
 GENERIC_international_diplomacy: "국제 외교"
 GENERIC_international_diplomacy_desc: "더 큰 주변국들이 호의적이고 나누는 공공의 태도를 보이는 화합의 장을 만들기 위한 국제 외교의 실현은 위대하고 선전을 통한 뒷작업으로 기나긴 시간에 걸쳐서 이루어낸 결과물입니다. 이제 외교 목표는 일정한 원유공급을 지켜내는 것입니다. [Root.GetNameDef]은(는) 실패하지 않을 것입니다."
 GENERIC_trade_with_the_neighbors: "주변국과의 무역"
 GENERIC_trade_with_the_neighbors_desc: "외교 인력의 확충과 도로망 확충을 통해 밀접해진 주변국들과 우호적인 분위기 속에서, 미래의 동반자들과 무역협정을 맺게 되었습니다. 이는 대기업과 중소기업 모두에게 이익이 될 일입니다."
 GENERIC_alignment_debate: "토론을 통한 방침결정"
 GENERIC_alignment_debate_desc: "국제 외교의 문제는 중립주의와 고립주의, 개입주의가 서로 상충된다는 것입니다."
 GENERIC_neutrality: "중립주의"
 GENERIC_neutrality_desc: "We should always be concerned with the safety and prosperity of [Root.GetAdjective] citizens first and foremost. We cannot waste our young men, natural resources and financial assets in foreign entanglements. Instead, we must make sure that the home front is safe by securing our borders and avoiding membership in international alliance networks."
 GENERIC_interventionism: "간섭주의"
 GENERIC_interventionism_desc: "국제무대에서 우리 자신만 바라보는 것은 이기적일 뿐만 아니라 세계 모든 민족에 대한 모욕입니다. 무슨 일이 있어도 우리는 지역 전체, 그리고 어쩌면 전 세계 모든 사람의 번영과 안전을 확보해야 합니다! 그리고 우리가 그 과정에서 [Root.GetNameDef]에 대한 추가 리소스와 만족을 얻게 된다면..."
 GENERIC_build_fortifications: "요새 건설"
 GENERIC_build_fortifications_desc: "강력한 방어 구조물은 외국군의 침공 시 무너지지 않는 전선을 확보하는 열쇠입니다."
 GENERIC_militarism: "군국주의"
 GENERIC_militarism_desc: "군국주의는 국가가 강력한 군대를 보유하고, 이를 국내외에서 국가 이익을 확보하고 보호하는 데 사용한다는 사상입니다."
 GENERIC_peaceful_emergence: "평화주의"
 GENERIC_peaceful_emergence_desc: "우리의 세계관이 다르더라도 낡은 질서에 적대적일 필요는 없으며, 대신 외교와 경제를 통해 서서히 세계를 바꾸어 나가야 합니다."
 GENERIC_revanchism: "보복주의"
 GENERIC_revanchism_desc: "복수주의는 국가가 이전에 잃은 영토를 되찾으려는 의지를 가리키는 말입니다. 프랑스가 알자스-로렌을 잃은 뒤 대중화된 복수주의는 오늘날에도 많은 나라의 정치에서 핵심 요인입니다."
 GENERIC_build_roads: "도로 부설"
 GENERIC_build_roads_desc: "교통은 세계의 모든 발전된 지역에서 핵심이며, 특히 저개발 지역을 포함해 전국에 도로를 건설함으로써 교육과 도시 생활에 대한 더 큰 접근성을 장려할 수 있습니다."
 GENERIC_build_railways: "철도 건설"
 GENERIC_build_railways_desc: "교통은 세계의 모든 발전된 지역에서 핵심이며, 국가의 저개발 지역에 철도를 건설함으로써 산업화를 장려하고 빠르고 저렴한 교통 수단을 마련할 수 있습니다."
 GENERIC_build_highways: "고속도로 건설"
 GENERIC_build_highways_desc: "[Root.GetNameDef] 전역에서 개인이 장거리로 이동하려면 고속도로가 필요합니다. 몇 개를 건설합시다."
 GENERIC_expand_urban_areas: "도심지 확장"
 GENERIC_expand_urban_areas_desc: "[Root.GetNameDef]의 도시 지역은 발전의 핵심이자 잠재적으로 경제의 핵심입니다. 도시화된 삶을 확대하고 개선함으로써 경제를 더욱 중앙집중화하고 시민의 역동성을 자극할 수 있습니다."
 GENERIC_developmentalism: "개발주의"
 GENERIC_developmentalism_desc: "개발주의는 저개발국 경제를 발전시키는 최선의 방법이 높은 관세를 두른 강력하고 다양한 내수 시장을 갖추는 것이라고 주장하는 경제 이론입니다."
 GENERIC_increase_resource_production: "자원 증산"
 GENERIC_increase_resource_production_desc: "생산 현장의 자원 산출량이 높아지면 대량 수출 시 수익도 높아집니다. 자원 채취를 우선시하면 경제를 부양할 수 있을 뿐 아니라 군대를 위한 장비를 더 많이 생산할 수 있습니다."
 GENERIC_economic_autonomy: "경제적 자립성"
 GENERIC_economic_autonomy_desc: "나라에 가장 큰 위험 중 하나는 경제를 외세에 넘겨주는 것입니다. 우리 국민은 그들이 억압할 대상이 아니라 우리의 국민입니다."
 GENERIC_autarky: "경제 자립 정책"
 GENERIC_autarky_desc: "자급자족은 우리가 시민들에게 가르칠 수 있는 가장 중요한 것 중 하나입니다. 이는 관료의 업무량이 줄어들 뿐만 아니라 국가 안보 위협이 줄어들고 국내 정치에 대한 통제가 강화되며 대중의 교육 수준이 높아진다는 것을 의미합니다."
 GENERIC_assure_the_national_fuel_reserve: "국립 석유 비축고"
 GENERIC_assure_the_national_fuel_reserve_desc: "우리의 석유는 차량과 장갑 장비 같은 군사 용도뿐 아니라 일반 민간 수송과 일상 용도에도 매우 중요합니다. 이 검은 황금을 저장하는 데 국가 연료 비축고가 더 효과적이도록 연료 저장고를 더 깊게 팔 수 있습니다."
 GENERIC_ease_of_business_reforms: "기업 규제 개혁"
 GENERIC_ease_of_business_reforms_desc: "[Root.GetAdjective] 시민이 소비하고 사업을 하도록 장려하는 가능한 접근법 중 하나는 독립 기업가가 생계를 꾸리기 더 쉽고 수익성이 높도록 법과 경제를 개혁하는 것입니다."
 GENERIC_attract_foreign_investors: "외국 투자자 유치"
 GENERIC_attract_foreign_investors_desc: "기업법을 완화함으로써 우리 땅을 기회주의적인 외국 투자자들에게 매력적으로 만들 수 있으며, 이들은 바로 우리가 있는 곳에서 빛나는 별 한두 개를 발견할지도 모릅니다."
 GENERIC_mobilize_the_working_class: "노동자 동원"
 GENERIC_mobilize_the_working_class_desc: "징집 사무소에 더 많이 지출하는 것은 분쟁이 발발할 경우 [Root.GetNameDef]을(를) 승리로 이끌 충분한 인력과 산업적 지원을 확보하는 확실한 방법 중 하나입니다."
 GENERIC_light_industry_investments: "경공업 투자"
 GENERIC_light_industry_investments_desc: "민간 산업과 석유 복합체에 자본을 투입하면 가장 어려운 시기에 경제가 앞으로 나아가는 데 도움이 됩니다."
 GENERIC_heavy_industry_investments: "중공업 투자"
 GENERIC_heavy_industry_investments_desc: "군산 복합체에 자본을 투입하면 장비 산출량이 늘어나 모든 병력이 전투에 충분히 무장되도록 할 수 있습니다."
 GENERIC_satisfy_the_middle_class: "중산층 유화정책"
 GENERIC_satisfy_the_middle_class_desc: "중산층은 아마도 나라에서 가장 중요한 집단일 것입니다. 대부분 산업 및 기업 복합체로 구성된 이들은 도시 기반시설을 확충하면 만족할 것으로 기대할 수 있습니다."
 GENERIC_build_churches: "교회 건설"
 GENERIC_build_churches_desc: "사제와 성직자들을 만족시키려면 전국의 교회, 사원, 그 밖의 예배 장소 건설에도 자금을 투입해야 합니다. 부수적으로 일반 시민들이 더욱 안정을 찾게 된다는 이점도 있습니다."
 GENERIC_please_the_upper_class: "상류층 유화정책"
 GENERIC_please_the_upper_class_desc: "과두 계층은 어느 국가에서든 규모는 작지만 중요한 부분을 차지하며, 미시적·거시적 수준 모두에서 투자, 토지 취득, 경제를 움직이는 보이지 않는 손입니다. 그들을 달래는 것은 우리에게 당연한 일입니다."
 GENERIC_import_foreign_automobiles: "해외 자동차 수입"
 GENERIC_import_foreign_automobiles_desc: "남의 집 잔디는 늘 더 푸르고, 국경 너머의 자동차는 늘 더 깨끗해 보이는 법입니다. 외국 산업에서 자동차를 직수입하면 정부에 대한 기대감을 한껏 끌어올릴 좋은 구실이 될 것입니다."
 GENERIC_invest_in_biofuels: "바이오 연료에 투자"
 GENERIC_invest_in_biofuels_desc: "대체 에너지는 미래입니다! ...투자자들의 말로는 그렇습니다. 어쨌든 우리는 그들의 이해관계를 믿으며, 그것이 우리 국가의 이익과 일치할 것이라 믿습니다."
 GENERIC_assure_intellectual_freedoms: "정보의 자유 보장"
 GENERIC_assure_intellectual_freedoms_desc: "[Root.GetNameDef] 전역의 모든 지식인에게 알립니다. 그들의 과학적 노력은 가치 있을 뿐 아니라 우리 번영의 핵심이며, 이념이나 소속과 관계없이 보호받을 것입니다."
 GENERIC_create_an_automotive_industry: "자동차 산업 육성"
 GENERIC_create_an_automotive_industry_desc: "저 성가신 외국인들에게서 자동차 제조의 온갖 비결을 배우고 나면, 우리만의 대안을 개발하여 국가 산업을 활성화하고 그 과정에서 하층 계급도 만족시킬 수 있을 것입니다."
 GENERIC_build_primary_schools: "초등학교 건설"
 GENERIC_build_primary_schools_desc: "교육은 세상 어느 땅에서든 민중의 심장이자 영혼입니다. 특히 초등 교육은 접근 기회를 보장하는 것이 매우 중요합니다. 교육받지 못한 아이는 교육받지 못한 어른으로 자라기 때문입니다. 초등 교육 기관을 더 많이 건설하면 우리나라의 문해율을 높일 수 있습니다."
 GENERIC_assure_access_to_education: "의무교육정책"
 GENERIC_assure_access_to_education_desc: "교육은 핵심적인 필요일 뿐 아니라 권리입니다! 모든 시민에게 언제나 빠짐없이 교육이 제공되도록 보장해야 합니다. 이 일이 끝나면 다음 세대의 지식인들이 우리에게 든든한 뒷받침이 되어 줄 것입니다."
 GENERIC_expand_the_universities: "대학교 확장"
 GENERIC_expand_the_universities_desc: "이제 초등교육의 기반이 마련되었으니 고등교육에 투자할 수 있게 되어 천재들과 세계적 지식인들도 [Root.GetNameDef]에서 나올 수 있게 되었습니다."
 GENERIC_industrial_research_task_forces: "산업 연구 위원회"
 GENERIC_industrial_research_task_forces_desc: "산업 연구 태스크포스(IRTF)는 최고의 산업 관행을 관찰하는 데 전념하는 국가 지원 연구진으로, 이를 통해 미래에 그 관행을 도입할 수 있을 것입니다."
 GENERIC_naval_reform: "해군 개혁"
 GENERIC_naval_reform_desc: "낡은 해군 관행을 버리고 해상 전력을 더욱 진지하게 다루기 시작할 때가 되었습니다."
 GENERIC_naval_bases: "해군기지"
 GENERIC_naval_bases_desc: "해안 곳곳에 부두와 항만을 건설하면 산업뿐 아니라 해군에도 이익이 될 것입니다."
 GENERIC_submarines: "잠수함"
 GENERIC_submarines_desc: "침략자가 우리의 수상함 가까이 접근하지 못하도록 잠수함 기술을 연구해 볼 수 있습니다."
 GENERIC_surface_ships: "수상함"
 GENERIC_surface_ships_desc: "모든 해양 작전의 주력인 수상함 중 가장 효과적이고 현대적인 함선을 연구하면 곧바로 제해권 장악으로 이어질 것입니다."
 GENERIC_dockyards: "조선소"
 GENERIC_dockyards_desc: "무역과 전투 모두에서 번영하려면 항만을 더 많이 짓고 해군 산업을 육성해야 합니다!"
 GENERIC_nuclear_submarines: "원자력 잠수함"
 GENERIC_nuclear_submarines_desc: "A nuclear submarine is any type of submarine powered by a nuclear reactor. They are more powerful, faster, and rarely need to refuel."
 GENERIC_naval_doctrine_innovations: "해군 교리 혁신"
 GENERIC_naval_doctrine_innovations_desc: "가장 강력한 군사 세계 질서를 이루는 일부 세력의 표준 교리를 연구하여 우리 자신의 해상 전투 효율을 높일 수 있습니다."
 GENERIC_aircraft_carriers: "항공모함"
 GENERIC_aircraft_carriers_desc: "항공모함은 바다 위의 공군 기지 역할을 하는 군함으로, 전장 비행 갑판과 항공기를 탑재, 무장, 발진, 회수하기 위한 시설을 갖추고 있습니다."
 GENERIC_naval_doctrine_expertise: "해군 전략가"
 GENERIC_naval_doctrine_expertise_desc: "현대 해군 교리의 모든 요소를 하나의 전술 체계로 통합하면 가장 위대한 해양 강국마저 우리의 역량 앞에 떨게 될 것입니다."
 GENERIC_air_force_reform: "공군 개혁"
 GENERIC_air_force_reform_desc: "하늘을 지배하는 국가가 땅을 지배한다는 원칙에 따라, 항공과 관련된 모든 교리를 현대화해야 합니다."
 GENERIC_fighter_planes: "전투기"
 GENERIC_fighter_planes_desc: "전투기, 즉 요격기는 공대공 교전을 염두에 두고 설계되었습니다. 이는 우리 공군이 모든 전장 공역에서 제공권을 확보하는 주된 수단입니다."
 GENERIC_air_doctrine_innovations: "공군 교리 혁신"
 GENERIC_air_doctrine_innovations_desc: "항공 교리는 우리와 적의 기술이 변하는 만큼 빠르게, 기술과 함께 발전하고 퇴보하며 변화합니다. 이제 그 과정을 서두를 때입니다."
 GENERIC_countermeasures_against_aircraft: "대공대책"
 GENERIC_countermeasures_against_aircraft_desc: "항공 우세를 가진 적에 맞서 영토를 방어하려면 대공 무기 기술에 특별히 집중해야 합니다."
 GENERIC_bomber_planes: "폭격기"
 GENERIC_bomber_planes_desc: "폭격기를 이용한 전략 폭격은 불규칙한 수송이 일반화된 오늘날에도 적의 사기를 꺾고 보급망에 타격을 입힐 것입니다. 공세를 펼칠 때는 최우선 과제입니다."
 GENERIC_drones: "드론"
 GENERIC_drones_desc: "UAV(무인 항공기) 기술은 드론이 원격 조종되므로 인력을 조금도 희생하지 않고 사람이든 기반시설이든 원거리 표적을 폭격하고 암살하고 제거할 능력을 줄 것입니다."
 GENERIC_air_doctrine_expertise: "공군 전략가"
 GENERIC_air_doctrine_expertise_desc: "이제 우리 공군은 진정으로 무시할 수 없는 존재이며, 우리가 활용하는 전술 또한 그렇습니다. 교리를 계속 현대화하고 발전시키면 전에 없던 방식으로 하늘을 지배할 수 있을 것입니다."
 GENERIC_army_reform: "육군 개혁"
 GENERIC_army_reform_desc: "육군 개혁이 최우선 과제입니다. 강한 육군이 없으면 우리나라를 지킬 수 없습니다."
 GENERIC_military_emergency: "전시사태"
 GENERIC_military_emergency_desc: "전쟁 상황이 우리에게 극도로 불리해졌습니다. 비상 소집을 발령하고 모든 역량을 집중하여 난관을 극복하는 것 외에는 방법이 없습니다."
 GENERIC_land_doctrine_innovations: "육군 교리 혁신"
 GENERIC_land_doctrine_innovations_desc: "현대전은 적응을 요구합니다. 새로운 전략과 기술로 교리를 갱신하면 우리 군이 앞으로의 분쟁에서도 효과적이고 준비된 상태를 유지할 수 있습니다."
 GENERIC_military_exercises: "육군 훈련"
 GENERIC_military_exercises_desc: "강도 높은 훈련은 전투 준비 태세와 부대 간 협동을 향상시켜, 압박 속에서도 우리 군이 완벽하게 임무를 수행하도록 보장합니다."
 GENERIC_military_education_reform: "육군 사관학교 개혁"
 GENERIC_military_education_reform_desc: "군사 교육을 현대화하면 더 강한 지휘관, 더 날카로운 전략가, 그리고 현대의 과제에 대응할 수 있는 군대를 길러낼 수 있습니다."
 GENERIC_infantry_equipment_development: "보병 장비 개발"
 GENERIC_infantry_equipment_development_desc: "보병 장비를 발전시키면 우리 병사들이 최첨단 도구를 갖추게 되어 전장에서의 효율과 생존성이 향상됩니다."
 GENERIC_land_doctrine_expertise: "육군 전략가"
 GENERIC_land_doctrine_expertise_desc: "현대 지상 교리에 대한 이해를 높이면 전장에서의 효율을 극대화하고 어떤 적도 기동으로 앞지를 수 있습니다."
 GENERIC_artillery_experiments: "야포 실험"
 GENERIC_artillery_experiments_desc: "새로운 포병 체계와 기법을 시험하면 현대 전장에서의 정밀도, 화력, 적응력이 향상됩니다."
 GENERIC_uniform_improvements: "군복 개선"
 GENERIC_uniform_improvements_desc: "군복을 개선하면 편안함, 내구성, 다양한 전투 환경에 대한 적응력이 높아집니다."
 GENERIC_self_propelled_artillery: "자주포"
 GENERIC_self_propelled_artillery_desc: "기동성과 화력을 결합하면 우리 포병이 전진하는 부대를 신속히 지원하고 변화하는 전선에 대응할 수 있습니다."
 GENERIC_develop_armor_prototypes: "기갑 시제품 개발"
 GENERIC_develop_armor_prototypes_desc: "차세대 장갑차량을 설계하면 우월한 화력과 방호력으로 지상전을 지배할 우리의 능력이 강화됩니다."
 GENERIC_countermeasures_against_armored_units: "대전차 대책"
 GENERIC_countermeasures_against_armored_units_desc: "적 기갑에 대응할 효과적인 전술과 무기를 개발하면 적의 중장비 부대를 효율적으로 무력화할 수 있습니다."
 GENERIC_non_aligned: "비동맹"
 GENERIC_non_aligned_desc: "Neutral countries try to stay out of global politics, and often focus on internal or regional development. They don't feel strongly about either the West or the East."
 GENERIC_the_conservative_approach: "보수적인 접근방식"
 GENERIC_the_conservative_approach_desc: "보수적인 국가들은 세계의 현상 유지를 적극적으로 시도하며, 서방 기성 세력식 정치와 국제적 시각의 유지에 집중합니다."
 GENERIC_anti_corruption_reforms: "반-부패 개혁"
 GENERIC_anti_corruption_reforms_desc: "반 부패 개혁을 승인함으로써 국가 내부의 부패를 줄일 수 있기를 기대합니다."
 GENERIC_centralization: "중앙집권화"
 GENERIC_centralization_desc: "국가의 중앙집권은 우리의 포괄적인 국가 경영을 도모하는데 도움을 줄 수 있습니다. 국가를 중앙화 함으로써 추가적인 정치적 자본을 얻고 이와 함께 추가적인 세입을 만들어낼 수 있을 겁니다."
 GENERIC_decentralization: "지방분권"
 GENERIC_decentralization_desc: "국가를 지방 분권화하고 불필요한 관료 주의를 제거함으로써 전반적인 관료 비용과 추가적인 건설 성장을 도모할 수 있습니다."
 GENERIC_economic_measures: "경제 수단"
 GENERIC_economic_measures_desc: "경제 규제 조치와 국제 부채 통제를 시행함으로써 지역 예산의 성장을 촉진하고 부채 금리를 낮출 수 있습니다."
 GENERIC_refitting_the_military_industry: "군수 산업 개선"
 GENERIC_refitting_the_military_industry_desc: "장비 생산이 뒤처지지 않도록 새로운 공장을 열 수 있습니다."
 GENERIC_vessel_production: "함선 건조"
 GENERIC_vessel_production_desc: "조선소의 서류 업무를 최적화하고 해안 지역에서 해군 문화를 장려하면 해군 생산 속도를 끌어올릴 수 있을 것입니다."
 GENERIC_network_infrastructure: "인터넷 기반시설"
 GENERIC_network_infrastructure_desc: "The modern world has turned the internet into a basic human need. Investing in this need will assist in education, construction efforts and much more."
 GENERIC_energy_sector: "에너지 부문"
 GENERIC_energy_sector_desc: "국가를 유지하려면 먼저 에너지 부문을 최신 상태로 유지해야 합니다. 지역 전체에 저렴하고 안정적인 에너지를 공급하기 위해 화석 연료 발전소와 일부 재생 에너지 기반시설을 모두 건설해야 합니다."
 GENERIC_fossil_powerplant: "회석 연료 발전소"
 GENERIC_fossil_powerplant_desc: "산출량과 혁신을 희생하는 대신 저렴하고 충분히 연구된 에너지 생산 방식을 택하여, 에너지 부문을 화석 연료야말로 올바른 선택이라는 쪽에 집중할 수 있습니다."
 GENERIC_improved_energy_cycling: "개선된 발전소"
 GENERIC_improved_energy_cycling_desc: "에너지 부문에서 우리의 입장을 분명히 하면 더 많은 기업과 단체가 화석 연료 에너지 생산을 택할 것입니다. 이는 재생 에너지원의 가동 중단을 뜻하기도 합니다."
 GENERIC_renewable_retooling: "재생가능한 개혁"
 GENERIC_renewable_retooling_desc: "대신 신뢰성을 희생하고 더 높은 비용을 감수하는 대가로, 높은 산출량과 낮은 환경 영향을 얻기 위해 에너지 부문을 대체 가능한 지속 가능 연료에 집중할 수 있습니다."
 GENERIC_combined_military_defense_industries: "방산업 합병"
 GENERIC_combined_military_defense_industries_desc: "우리의 탁월한 노력과 성과 덕분에 이제 방위 산업을 더 효율적으로 운영할 수 있게 되었습니다."
 GENERIC_renewable_infrastructure: "재생가능한 기반시설"
 GENERIC_renewable_infrastructure_desc: "이제 우리나라에서 재생 에너지에 대한 열기가 높아졌으므로, 관심 있는 투자자들의 재정 지원을 받아 지속 가능한 기반시설 건설을 진행할 수 있습니다."
 GENERIC_unemployment_program: "실업 프로그램"
 GENERIC_unemployment_program_desc: "나라가 고통을 겪기 시작하기 전에 더 높은 실업률을 견딜 수 있도록 성급한 조치가 시행될 수 있습니다. 그 시행은 국민을 위해 복지 및 의료 예산을 조정하는 방법이 될 수도 있습니다."
 GENERIC_debt_refactoring: "빚의 재분배"
 GENERIC_debt_refactoring_desc: "우리 정부의 효율성과 삶을 개선하기 위한 목적으로 대출을 협상하는 것은 결코 나쁜 일이 아닙니다."
 GENERIC_productivity_measures: "생산성 측정"
 GENERIC_productivity_measures_desc: "오직 생산성의 향상만이 우리나라의 힘을 더욱 키울 수 있습니다."
 GENERIC_improved_worker_productivity: "근로자 생산성 향상"
 GENERIC_improved_worker_productivity_desc: "생산성을 더욱 발전시키고 1인당 산출량을 개선하면 총생산을 효과적으로 늘릴 수 있습니다."
 GENERIC_the_manpower_solution: "인력 해결책"
 GENERIC_the_manpower_solution_desc: "사람이 충분하지 않으면 아무것도 없습니다. 인구가 빠르게 늘어나도록 조치를 취하십시오."
 GENERIC_emphasize_autarkic_measures: "추가 자급자족 조치 강조"
 GENERIC_emphasize_autarkic_measures_desc: "세계 시장이 누구에게 필요합니까? 우리의 필요는 우리 공장에서 충당할 수 있습니다."
 GENERIC_reaching_to_the_global_market: "세계 시장에 진출"
 GENERIC_reaching_to_the_global_market_desc: "세계 시장에 접근해야만 우리나라의 잠재력을 더욱 끌어내고 세계 무대에서 발판을 마련할 수 있습니다."
 GENERIC_agricultural_district_subsidization: "농업지구 보조금"
 GENERIC_agricultural_district_subsidization_desc: "식량 문제를 외면할 수 없습니다. 농업에 보조금을 지급하여 우리나라가 가능한 한 식량을 자급하도록 하십시오."
 GENERIC_nuclear_energy_expansions: "핵에너지 확장"
 GENERIC_nuclear_energy_expansions_desc: "원자력 사용은 미래의 흐름이며, 우리는 그 활용을 더욱 깊이 발전시켜야 합니다."
 GENERIC_public_service_announcement: "공익광고"
 GENERIC_public_service_announcement_desc: "We must establish a standardized way of communicating public interest messages directly to our citizens. This is done through a public service announcement."
 GENERIC_domestic_vehicle_research: "차량 시험장"
 GENERIC_domestic_vehicle_research_desc: "최신 군용 차량에 접근하기 위해 우리는 전략적 협력국가가 차량을 제공해 주기만 기대할 수 없습니다. 우리는 국산 장갑차를 시험하고 개발할 수 있는 차량 시험장을 건설해야 합니다."
 GENERIC_domestic_naval_research: "[ROOT.GetAdjective] 군함 개발"
 GENERIC_domestic_naval_research_desc: "우리 경제에 해상 교통로의 안보는 필수적입니다. 만약 우리가 동맹국의 해군력에 대한 접근을 잃는다면, 우리는 좌초될 것입니다. 우리는 우리만의 군함을 만들 수 있는 시설을 만들어야 합니다."
 GENERIC_domestic_aircraft_research: "국산 제트기 계획"
 GENERIC_domestic_aircraft_research_desc: "항공기는 지구상에서 가장 정교한 기계 중 하나이며, 우리는 그것을 만드는 방법을 모릅니다. 우리는 우리의 기술력을 세상에 보여주기 위해 우리만의 국산 군용 항공기를 만들어야 합니다."
 GENERIC_secret_weapons_program: "비밀 무기 연구"
 GENERIC_secret_weapons_program_desc: "Nuclear weapons, space program, fusion power and other wonders of science await exploration. This will give us an edge over all our enemies."
 GENERIC_capital_defense_scheme: "자본 방어 계획"
 GENERIC_capital_defense_scheme_desc: "항공기 및 기타 공중 위협에 대비해 더욱 철저한 방어 계획을 수립하면 우리 국민은 지금부터 영원히 안전하다고 느낄 수 있을 것입니다."
 GENERIC_light_helicopter_operators: "경량 헬리콥터 모함"
 GENERIC_light_helicopter_operators_desc: "헬리콥터 항공모함은 주로 헬리콥터를 운반하는 데 쓰이는 항공모함으로, 상륙 강습함이나 대잠 항공모함으로 분류되는 경우도 많습니다. 대잠전, 상륙 작전, 근접 항공 지원을 비롯한 군용 항공 임무에 주로 사용됩니다."
 GENERIC_defense_scheme_beta: "고급 수도 방어 계획"
 GENERIC_defense_scheme_beta_desc: "어떤 상황에서도 문제가 없도록 수도의 방어를 더욱 강화합니다."
 GENERIC_military_equipment_procurement: "군사 장비 조달"
 GENERIC_military_equipment_procurement_desc: "충분한 무기가 없으면 우리 육군은 어떤 임무도 완수하기 어려우므로, 무기의 긴급 조달에 착수했습니다."
 GENERIC_capital_defense_scheme_tt: "§Y무작위 보유 주§!에 §Y대공 건물§! §G1§!개를 부여합니다"
 GENERIC_defense_scheme_beta_tt: "§Y무작위 보유 주§!에 §Y대공 건물§! §G1§!개를 부여합니다"
 GENERIC_expand_the_strategic_reserves: "전략 비축량 확대"
 GENERIC_expand_the_strategic_reserves_desc: "국가 연료 비축분을 바탕으로 전략 비축량을 더욱 늘려 위기 시에도 에너지 안보를 확보할 수 있습니다. 추가 연료 저장고는 우리의 경제 및 군사 작전을 지켜 줄 것입니다."
 GENERIC_subsistence_agriculture_investments: "자급 농업 투자"
 GENERIC_subsistence_agriculture_investments_desc: "소규모 자급 농업을 지원하면 농촌 지역사회의 식량 안보를 확보하고 전국의 전통 농업 방식을 유지할 수 있습니다."
 GENERIC_focus_towards_the_subsistence: "자급 농업 중시"
 GENERIC_focus_towards_the_subsistence_desc: "자급 농업을 우선시하면 농촌의 자급자족을 강화하고 농업 부문을 안정적이고 탄력적으로 유지할 수 있습니다."
 GENERIC_commercialized_agriculture_investments: "상업 농업 투자"
 GENERIC_commercialized_agriculture_investments_desc: "기계화·상업화된 농업에 투자하면 생산성이 높아지고 우리 농업 부문이 현대적인 수출 지향 산업으로 탈바꿈할 것입니다."
 GENERIC_encourage_more_commercial_agriculture: "상업 농업 장려"
 GENERIC_encourage_more_commercial_agriculture_desc: "상업적 영농 방식으로 농업 부문을 한층 더 현대화하면 생산량이 늘고 세계 식량 시장에서 경쟁력을 갖추게 될 것입니다."
 GENERIC_a_new_breadbasket: "새로운 곡창지대"
 GENERIC_a_new_breadbasket_desc: "농업 기반시설과 방식을 완전히 현대화하면 [Root.GetNameDef]은(는) 주요 식량 생산국이 되어 국민을 먹이고 세계로 수출할 수 있습니다."
 GENERIC_microchip_research_and_development: "마이크로칩 연구 개발"
 GENERIC_microchip_research_and_development_desc: "반도체 기술은 현대 전자기기와 컴퓨팅의 기반입니다. 마이크로칩 연구에 투자하면 우리의 기술 역량이 발전하고 외국 공급업체에 대한 의존도가 줄어들 것입니다."
 GENERIC_microchip_domestic_production: "국산 마이크로칩 생산"
 GENERIC_microchip_domestic_production_desc: "국내 마이크로칩 생산 시설을 구축하면 기술 공급망이 안정되고 [Root.GetNameDef]은(는) 세계 반도체 산업의 한 축으로 자리매김할 것입니다."
 GENERIC_synthetic_refinery_expansion: "합성 정유 시설 확장"
 GENERIC_synthetic_refinery_expansion_desc: "합성 소재 생산 능력을 확대하면 보급이 끊기는 때에도 민간 및 군수 산업에 필요한 핵심 소재를 확보할 수 있습니다."
 GENERIC_military_industry_investment_projects: "군수 산업 투자 사업"
 GENERIC_military_industry_investment_projects_desc: "국방 산업에 대한 대규모 투자 사업은 군사 장비 생산 능력을 확대하고 산업 기반을 강화할 것입니다."
 GENERIC_hydroelectric_energy_expansion: "수력 에너지 확대"
 GENERIC_hydroelectric_energy_expansion_desc: "수력 발전 댐으로 수로의 힘을 활용하면 화석 연료 의존도를 줄이면서 깨끗한 재생 에너지를 얻을 수 있습니다."
 GENERIC_geothermal_energy_expansion: "지열 에너지 확대"
 GENERIC_geothermal_energy_expansion_desc: "지열 에너지원을 개발하면 안정적이고 지속 가능한 발전이 가능해지고 재생 에너지 구성도 다양해집니다."
 GENERIC_battery_park_investments: "배터리 단지 투자"
 GENERIC_battery_park_investments_desc: "대규모 배터리 저장 시설은 재생 에너지를 효율적으로 저장하게 해 주며, 해가 뜨지 않거나 바람이 불지 않을 때에도 안정적인 전력 공급을 보장합니다."
 GENERIC_nuclear_energy_expansions_two: "추가 원자력 에너지 확대"
 GENERIC_nuclear_energy_expansions_two_desc: "원자로를 추가로 건설하며 원자력 에너지 계획을 이어 나가면 수십 년간 풍부한 무탄소 전력을 공급받을 수 있습니다."
 GENERIC_reinforced_electric_grid: "강화된 전력망"
 GENERIC_reinforced_electric_grid_desc: "전력망 기반시설을 강화하고 보강하면 안정적인 전력 분배가 보장되고 전국적인 정전 위험이 줄어들 것입니다."
 GENERIC_high_capacity_electric_grid: "대용량 전력망"
 GENERIC_high_capacity_electric_grid_desc: "대용량 전력망으로 개선하면 산업 성장과 운송 수단의 전기화로 늘어나는 전력 수요를 감당할 수 있습니다."
 GENERIC_targeted_pension_fund_investments: "표적 연금 기금 투자"
 GENERIC_targeted_pension_fund_investments_desc: "연금 기금에 대한 전략적 투자는 국민의 노후를 보장하고 사회 안전망 사업도 안정시킬 것입니다."
 GENERIC_emphasize_separation_of_church_and_state: "정교 분리"
 GENERIC_emphasize_separation_of_church_and_state_desc: "종교 기관과 정부의 분리를 강조하면 우리 정치 체제가 현대화되고 모든 신앙의 시민이 평등한 대우를 받게 될 것입니다."
 GENERIC_artificial_intelligence_investments: "인공지능 투자"
 GENERIC_artificial_intelligence_investments_desc: "인공지능은 기술의 미래입니다. AI 연구 개발에 투자하면 [Root.GetNameDef]은(는) 이 혁명적인 분야의 선두에 서게 될 것입니다."
 GENERIC_large_ship_drydocks: "대형 선박 건조 독"
 GENERIC_large_ship_drydocks_desc: "항공모함과 상륙 강습함을 포함한 대형 군함을 건조하고 정비할 수 있는 특수 건조 독을 짓는다면 우리의 조선 능력이 향상될 것입니다."
 GENERIC_improved_repair_facilities: "수리 시설 개선"
 GENERIC_improved_repair_facilities_desc: "해군 수리 시설을 현대화하면 정비 중단 시간이 줄어들고 함대가 언제나 작전 가능하며 전투 준비를 갖춘 상태를 유지할 수 있습니다."
 GENERIC_composite_industrial_expansion: "복합 소재 산업 확대"
 GENERIC_composite_industrial_expansion_desc: "복합 소재 산업을 확대하면 항공우주, 해군, 장갑차량 생산에 쓰일 첨단 소재를 공급받을 수 있습니다."
 GENERIC_weapon_conversion_packages: "무기 전환 패키지"
 GENERIC_weapon_conversion_packages_desc: "모듈식 무기 전환 패키지를 개발하면 기존 군사 체계를 새로운 위협과 기술에 맞춰 신속하게 개량하고 적응시킬 수 있습니다."
 GENERIC_convoy_and_freighter_production: "수송선단 및 화물선 생산"
 GENERIC_convoy_and_freighter_production_desc: "상선과 호송함 생산을 늘리면 해상 무역로를 확보하고 전시에 핵심 보급선을 보호할 수 있습니다."
 GENERIC_establish_a_marine_corps: "해병대 창설"
 GENERIC_establish_a_marine_corps_desc: "상륙 작전에 특화된 전담 해병 부대를 창설하면 바다에서 힘을 투사하고 복잡한 상륙 작전을 수행할 수 있게 됩니다."
 GENERIC_submarine_expansion_project: "잠수함 확장 사업"
 GENERIC_submarine_expansion_project_desc: "현대식 함선으로 잠수함 전력을 확충하면 수중전 능력이 강화되고 잠재적 적대 세력에 대한 강력한 억지력이 됩니다."
 GENERIC_stealth_ships: "스텔스 함선"
 GENERIC_stealth_ships_desc: "스텔스 해군 기술을 개발하면 우리 함선의 레이더 반사 면적이 줄어들어 현대 해전에서 결정적인 전술적 이점을 얻게 됩니다."
 GENERIC_air_base: "공군 기지 건설"
 GENERIC_air_base_desc: "새 공군 기지를 건설하고 기존 시설을 확장하면 현대적인 공군을 지원하고 지역 전체에 공군력을 투사하는 데 필요한 기반시설이 갖춰집니다."
 GENERIC_satellite_programs: "위성 계획"
 GENERIC_satellite_programs_desc: "군사 위성 능력을 개발하면 우리 군에 정찰, 통신, 항법 지원이 제공되어 결정적인 정보 우위를 얻게 됩니다."
 GENERIC_air_base_expansion_plan: "공군 기지 확장 계획"
 GENERIC_air_base_expansion_plan_desc: "공군 기지망을 종합적으로 확장하면 작전 범위가 늘어나고 영토 전역에서 공군력을 더욱 효과적으로 배치할 수 있습니다."
 GENERIC_air_base_expansion_plan_two: "고급 공군 기지 확장"
 GENERIC_air_base_expansion_plan_two_desc: "공군 기지를 추가로 확장하고 현대화하면 가장 진보된 항공기를 지원할 수 있는 세계적 수준의 군용 항공 기반시설이 만들어질 것입니다."
 GENERIC_domestic_drone_production: "국산 드론 생산"
 GENERIC_domestic_drone_production_desc: "국내 UAV 생산 시설을 구축하면 이 핵심 체계의 공급이 안정되고 우리의 특정 작전 수요에 맞춰 드론을 맞춤 제작할 수 있습니다."
 GENERIC_domestic_helicopter_production: "국산 헬리콥터 생산"
 GENERIC_domestic_helicopter_production_desc: "국내 헬리콥터 생산 능력을 개발하면 항공우주 산업을 육성하는 동시에 우리 군에 믿을 만한 수송 및 다목적 헬리콥터를 공급할 수 있습니다."
 GENERIC_domestic_attack_helicopter_production: "공격 헬리콥터 생산"
 GENERIC_domestic_attack_helicopter_production_desc: "공격 헬리콥터를 국내에서 제작하면 우리 군이 강력한 근접 항공 지원 능력을 갖추게 되고 군용 항공 부문이 강화됩니다."
 GENERIC_develop_air_cavalry_doctrines: "항공 기병 교리"
 GENERIC_develop_air_cavalry_doctrines_desc: "특화된 항공 기병 전술을 개발하면 신속 강습, 정찰, 화력 지원 임무에서 헬리콥터 전력의 효율이 극대화됩니다."
 GENERIC_manpads: "휴대용 대공 미사일 체계"
 GENERIC_manpads_desc: "보병에게 휴대용 대공 미사일 체계를 지급하면 최전선 부대가 적 항공기와 헬리콥터에 맞서 방어할 수 있게 됩니다."
 GENERIC_paratrooper_corps: "공수 군단"
 GENERIC_paratrooper_corps_desc: "정예 공수 군단을 창설하면 신속 전개 능력과 적진 후방의 핵심 목표를 점령할 능력을 갖추게 됩니다."
 GENERIC_to_conscript_or_not_to_conscript: "징병 문제"
 GENERIC_to_conscript_or_not_to_conscript_desc: "징병제와 완전 지원병제 중 무엇을 택할 것인가는 우리 국방 정책의 근본 문제입니다. 어느 쪽이 국가 안보 수요에 더 부합하는지 신중히 판단해야 합니다."
 GENERIC_utility_vehicles: "다목적 차량"
 GENERIC_utility_vehicles_desc: "군 다목적 차량 보유 대수를 현대화하면 군수 지원, 기동성, 지상군의 작전 효율이 향상됩니다."
 GENERIC_special_forces_training_programmes: "특수부대 훈련 프로그램"
 GENERIC_special_forces_training_programmes_desc: "종합적인 특수부대 훈련 프로그램을 마련하면 비정규전, 대테러, 고위험 작전을 수행할 수 있는 정예 부대를 길러낼 수 있습니다."
 GENERIC_rangers_and_light_infantry: "레인저 및 경보병"
 GENERIC_rangers_and_light_infantry_desc: "경보병과 레인저 전술에 특화하면 다양한 지형과 어려운 환경에서 작전할 수 있는 기동성 높고 적응력 있는 부대를 만들 수 있습니다."
 GENERIC_specialized_mechanized_battalions: "전문 기계화 대대"
 GENERIC_specialized_mechanized_battalions_desc: "전문 기계화 대대를 편성하면 보병과 장갑 전투 차량이 결합되어 강력한 합동 병과 작전이 가능해집니다."
 GENERIC_self_propelled_anti_air: "자주 대공포"
 GENERIC_self_propelled_anti_air_desc: "기동 대공 체계를 개발하면 전진하는 부대와 보조를 맞출 수 있는 방공 능력을 지상군에 제공하고 공중 위협으로부터 보호할 수 있습니다."
 GENERIC_counter_terrorism_operations: "대테러 작전"
 GENERIC_counter_terrorism_operations_desc: "위협이 현실화하기 전에 탐지하고 무력화하기 위해 전담 대테러 부대와 정보 공유 체계를 구축합니다."
 GENERIC_cyber_warfare_program: "사이버전 계획"
