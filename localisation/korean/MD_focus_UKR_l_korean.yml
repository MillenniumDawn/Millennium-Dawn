 ukraine_varyag.9.a: "함을 취역시킨다"
 ukraine_varyag.10.name: "§Y바랴크§!, 우리 손을 떠나다"
 ukraine_varyag.10.desc: "§W§!§Y바랴크§!§W를 §!§Y[CHI.GetNameWithFlag]§!§W으로 보내려던 시도는 §!§R끝났습니다§!§W. 우리 기술자들이 §!§G도면 사본을 확보했으며§!§W 이를 항공모함의 배치 구조를 연구하는 데 쓸 수 있습니다.§!"
