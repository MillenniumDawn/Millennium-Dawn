 EGY_remove_slums_in_nile_valley_desc: "문제를 해결하는 방법은 학교, 수도관, 하수도 같은 사회 기반시설 건설, 빈민가 주민 퇴거 등 여러 가지가 있습니다. 우리는 실용적으로 접근하여 구체적인 상황을 살펴볼 것입니다."
 EGY_coptic_decision: "콥트 사람들"
 EGY_coptic_decision_desc: "§Y콥트인§!은 북아프리카 토착의 §1기독교§! 민족종교 집단으로, 고대부터 현재의 [EGY.GetFlag]§Y이집트§!와 [SUD.GetFlag]§Y수단§! 일대에 주로 거주해 왔습니다.\n\n그들의 여론에 따라 §G긍정적§! 또는 §R부정적§! 효과를 받게 된다는 점을 기억하십시오. 또한 그들의 영향력을 잊지 마시고, 영향력이 높아지지 않도록 유의하십시오.\n\n§H콥트인 여론§!: [?EGY_coptic_people_opinion]\n§Y콥트인의 정치적 영향력§!: [?EGY_copts_political_influence]\n§Y콥트인 인기도§!: [?party_pop_array^13|%1]"
 modify_coptic_opinion_effect_tt: "§H콥트인 여론§!이 [?coptic_opinion_change|+0] 변화합니다 (현재: [?THIS.EGY_coptic_people_opinion|Y0])\n"
 modify_coptic_pol_influence_effect_tt: "§H콥트인 영향력§!이 [?coptic_pol_influence_change|+0] 변화합니다 (현재: [?THIS.EGY_copts_political_influence|Y0])\n"
 EGY_military_decision: "이집트 군부"
 EGY_military_decision_desc: "\n\n\n\n£EGY_desctext_militar\n\n\n\n\n\n이집트 군부는 국가 정치에 서슴없이 모습을 드러내며, 따라서 우리의 행동에 대한 군부의 영향력은 군부가 우리를 좋아하는지 여부에 대한 입장에 따라 결정됩니다. 군부 내부 파벌이 제거되면 내전이 시작됩니다!\n\n[EGY.Nat_Autocracy_L]에 대한 우리의 §Y입지§!가 §Y-100§! 아래로 떨어지면 군대가 정부를 전복하기 위해 행동에 나설 것입니다.\n\n우리의 현재 §Y입지§!: [?EGY_military_standing_value|0+]\n\n현재 §Y집권당§!으로 인한 [?EGY_military_standing_party|=0+]\n£pol_idea §G군사 지출 수준§!으로 인한 [?EGY_military_standing_spending|=0+]\n§Y군대§!의 현재 여론으로 인한 [?EGY_military_standing_opinion|=0+]\n우리의 §Y부패 수준§!으로 인한 [?EGY_military_standing_corruption|=0+]\n우리의 §Y경기 순환§!으로 인한 [?EGY_military_standing_economy|=0+]\n우리의 §Y이자율§!로 인한 [?EGY_military_standing_interest_rate|=0+]"
