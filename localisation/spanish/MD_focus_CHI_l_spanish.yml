 CHI_HKG_sinicization_modifier_desc: ""
 CHI_TIB_sinicization_modifier: "Sinización del Tíbet"
 CHI_TIB_sinicization_modifier_desc: "Realiza un seguimiento de la sinización del Tíbet y de las condiciones económicas que Pekín concede a la región a medida que esta aumenta. La sinización crece a través de las decisiones y enfoques del Tíbet en la rama de §Y$CHI_SAR_integrate_TIB$§!.\n§W--------------§!\nEste modificador se §REliminará§! si completamos el enfoque §Y$CHI_SAR_integrate_TIB$§!, que requiere una §YSinización del Tíbet§! de al menos §Y95§!."
 TIB_sinicization: "£GFX_text_icon_tibet_sar Sinización del Tíbet: [?TIB_sinicization_var|Y1]"
 TIB_sinicization_tt: "£GFX_text_icon_tibet_sar Sinización del Tíbet: $RIGHT|Y=1$"
 TIB_sar_development_modifier: "Desarrollo de la RAE tibetana"
 TIB_sar_development_modifier_desc: "Realiza un seguimiento del desarrollo económico acumulado de la Región Administrativa Especial del Tíbet, reflejando el crecimiento del turismo de peregrinación, el comercio transfronterizo y los ingresos por extracción de recursos que fluyen hacia la RAE."
 ETK_sinicization: "$ETK_sinicization_var$: [?ETK_sinicization_var|Y1]"
 ETK_sinicization_var: "£GFX_text_icon_xinjiang_sar Sinización de Xinjiang"
 ETK_sinicization_tt: "$ETK_sinicization_var$: $RIGHT|Y=1$"
 CHI_ETK_sinicization_modifier: "Sinización de Xinjiang"
 CHI_ETK_sinicization_modifier_desc: "Realiza un seguimiento de la sinización de Xinjiang y de las condiciones económicas que Pekín concede a la región a medida que esta aumenta. La sinización crece a través de las decisiones y enfoques de Xinjiang en la rama de §Y$CHI_SAR_integrate_ETK$§!.\n§W--------------§!\nEste modificador se §REliminará§! si completamos el enfoque §Y$CHI_SAR_integrate_ETK$§!, que requiere una §YSinización de Xinjiang§! de al menos §Y95§!."
 MAC_sinicization: "£GFX_text_icon_macau_sar Sinización de Macao: [?MAC_sinicization_var|Y1]"
