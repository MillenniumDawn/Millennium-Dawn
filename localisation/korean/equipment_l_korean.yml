l_korean:
 combat_eng_equipment: "전투 공병 장비"
 combat_eng_equipment_desc: "전투 공병은 전 세계 모든 군대에서 핵심적인 역할을 하는 이들로 군의 다양한 부대에서 찾을 수 있으며, 심지어 전투 부대에서도 임무를 수행하기도 합니다."
 L_Drone_equipment: "드론 장비"
 L_Drone_equipment_desc: "단거리 정찰 드론(UAV)은 가치 있는 실시간 정찰 정보와 전장 상황 인지 능력을 제공합니다. 이 장비는 가볍고 상대적으로 휴대가 간편합니다."
 artillery_equipment: "야포"
 artillery_equipment_desc: "야포는 포탄을 발사하도록 설계된, 보병 화기의 사거리와 화력을 뛰어넘는 커다란 군용 무기입니다."
 artillery_1: "ART 1965"
 artillery_1_desc: "With its powerful indirect fire abilities, Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew. Since it requires external vehicles for its movement, it can be difficult to move around in between strikes, making it vulnerable against enemy artillery counter-strikes. Lightweight lower calibre systems can be dragged around manually, and are suitable for airborne operations as they can fit inside transport planes."
