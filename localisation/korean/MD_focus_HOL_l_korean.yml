 BEL_sabiex_international_tank_manufacturer_desc: "1988년에 설립되어 몽스와 투르네에 기반을 둔 사비엑스 인터내셔널은 장갑차와 군용 트럭을 정비하고 현대화합니다. 현재 엘빗의 자회사로서 궤도형 수송차, 차륜형 장갑차, 병참 차량의 파워팩, 구동계, 전투 체계를 전면 정비합니다."
