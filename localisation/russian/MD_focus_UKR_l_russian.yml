 ukr_modernize_sov_equipment_t55_procurement_program_battalion_mission_desc: "\n\n\n\n\n\n[UKR_t55_batch_image]\n\n\n\n\n\n\n\n\n§W§YХарьковский бронетанковый завод§! перестраивает §Y40§! хранящихся корпусов до стандарта §Y[UKR_t55_batch_model]§!. Когда работа будет завершена, машины §Gпоступят на наши склады§!, а мы сможем заказать ещё одну партию, перевести линию на другую модель или закрыть программу и §Gвернуть военный завод§!.§!"
