---
name: Tools Validation

"on":
  pull_request:
    paths:
      - "tools/**"
      - ".claude/docs/typo-watchlist.md"
      - "resources/documentation/modifiers_documentation.md"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - ".github/workflows/coding-pipeline.yml"
      - ".github/workflows/nightly-pr-validation.yml"
      - ".github/workflows/tools-validation.yml"
      - ".github/workflows/validator-cache.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            common
            events
            history
            localisation
            interface
            gfx/flags
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group runtime
      - name: Run tools validation
        run: |
          python tools/validate_tools.py --strict --no-color --output \
            tools_validation.log
      - name: Upload validation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tools-validation-report
          path: tools_validation.log
          retention-days: 7

  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `name` is the status-check context branch protection matches on —
        # keep these strings stable when reshaping the job.
        check:
          - name: report_lib + validator unit tests
            id: unit
          - name: staged validator integration
            id: staged
          - name: ruff lint (tools)
            id: lint
    steps:
      # config_drift_test reads the pre-commit config and these workflows to
      # compare the validator set declared in each, and to check the pipeline
      # wiring around them. pyproject.toml supplies the pytest testpaths so all
      # six test dirs are collected. typo-watchlist.md is read by
      # loc_typo_watchlist_test's doc-sync guard, and modifiers_documentation.md
      # by validate_modifiers_test's parse guard. common/national_focus is
      # walked by focus_pp_malus_test's exemption-freshness guard.
      # check_common_mistakes_test asserts its script_enums, equipment, decision
      # and modifier loaders against the real files those loaders read; without
      # them each returns None and the module-level assertions blow up at
      # collection time.
      - name: Checkout (unit tests)
        if: matrix.check.id == 'unit'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            .pre-commit-config.yaml
            .claude/docs/typo-watchlist.md
            resources/documentation/modifiers_documentation.md
            common/national_focus
            common/script_enums.txt
            common/units/equipment
            common/decisions
            common/opinion_modifiers
            common/modifiers
            .github/workflows/coding-pipeline.yml
            .github/workflows/nightly-pr-validation.yml
            .github/workflows/tools-validation.yml
            .github/workflows/validator-cache.yml
          sparse-checkout-cone-mode: false

      - name: Checkout (staged integration)
        if: matrix.check.id == 'staged'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            events
            common
            localisation
            history
          sparse-checkout-cone-mode: false

      - name: Checkout (lint)
        if: matrix.check.id == 'lint'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.x"

      - name: Install dependencies (unit tests)
        if: matrix.check.id == 'unit'
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Install dependencies (staged integration)
        if: matrix.check.id == 'staged'
        run: |
          python -m pip install --upgrade pip
          pip install --group dev --group runtime

      - name: Install dependencies (lint)
        if: matrix.check.id == 'lint'
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Run unit tests
        if: matrix.check.id == 'unit'
        run: |
          python -m coverage run --branch -m pytest -v
          python -m coverage report

      - name: Create isolated test worktree
        if: matrix.check.id == 'staged'
        run: |
          git worktree add --detach \
            "${{ runner.temp }}/md-staged-validator-test" HEAD

      - name: Run staged-validator integration
        if: matrix.check.id == 'staged'
        working-directory: ${{ runner.temp }}/md-staged-validator-test
        env:
          MD_RUN_STAGED_INTEGRATION: "1"
        run: |
          python -m pytest \
            tools/tests/staged_validators_test.py \
            tools/tests/staged_validators_real_test.py -q

      - name: Run ruff
        if: matrix.check.id == 'lint'
        run: ruff check tools --output-format=github

      - name: Check formatting (black)
        if: matrix.check.id == 'lint'
        run: black --check tools

      - name: Run pylint
        if: matrix.check.id == 'lint'
        run: pylint tools --output-format=github --reports=no --score=no

      - name: Run mypy
        if: matrix.check.id == 'lint'
        run: mypy
