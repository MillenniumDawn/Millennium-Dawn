 nsb_drone_tech_1: "Tecnología de Drones Temprana"
 nsb_drone_tech_1_desc: "Armas no tripuladas montadas sobre helicópteros, tanto en funciones ofensivas como defensivas."
 nsb_drone_tech_2: "Tecnología de Drones Moderna"
