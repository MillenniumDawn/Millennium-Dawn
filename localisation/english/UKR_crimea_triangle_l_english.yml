 ukraine_crimea_balance.100.desc: "§W[UKR.GetFlag] §Y[UKR.GetNameDef]§! has formally requested that [UZB.GetFlag] §Y[UZB.GetNameDef]§! permit an organized return of §YCrimean Tatar§! families to §Y[669.GetName]§!. The diplomatic agreement is evaluated separately for each country.§!\n\n§YRequired [UKR.GetFlag] Ukrainian influence:§! §G12%§!\n§YRussian limit:§! [SOV.GetFlag] §Y[SOV.GetNameDef]§! cannot hold more than §Rthree times§! the [UKR.GetFlag] §Y[UKR.GetAdjective]§! share.\n\n§RRefusal§! allows [UKR.GetFlag] §Y[UKR.GetNameDef]§! to reopen talks through a separate, more costly decision."
