l_korean:
 free_states_of_america_focus: "아메리카 자유주 중점 계통도"
 the_dust_settles: "먼지가 가라앉았다... 이제 무엇을 할 것인가?"
 USB_UFSR_desc: "[USB.GetFlag]§Y아메리카 자유 주§!가 이름을 §Y자유 사회주의 공화국 연방§!으로 변경합니다"
 USB_MidAtlantic_Union_desc: "[USB.GetFlag]§Y아메리카 자유 주§!가 이름을 §Y중부 대서양 군사 연합§!으로 변경합니다"
 USB_MidAtlantic_States_desc: "[USB.GetFlag]§Y아메리카 자유 주§!가 이름을 §Y중부 대서양 연방 연합§!으로 변경합니다"
 USB_second_american_republic_desc: "[USB.GetFlag]§Y아메리카 자유 주§!가 이름을 §Y제2 미국 공화국§!으로 변경합니다"
 free_states_idea_isolationist_focused_foreign_office: "고립주의 외무부"
 free_states_idea_isolationist_focused_foreign_office_desc: "우리 국가의 참담한 상태 때문에 외무부 인사는 대부분 손쉬운 돈벌이로 여겨집니다. 이는 사회 자체를 재건하고 있다는 사실에서 비롯된 극심한 무기력 때문입니다. 그럼에도 우리가 발전하고 번영하기 시작하면 미래에는 더 밝은 지평을 바라볼 수 있습니다."
 free_states_idea_neighborhood_foreign_policy: "이웃 외교 정책"
 free_states_idea_neighborhood_foreign_policy_desc: "경제는 물론 군사 및 정치적 발전 면에서 국가가 사상 최고점에 이르면서, 최근 외국의 관심이 급증했습니다. 따라서 우리가 정말로 무엇을 하고 싶은지 아직 정리해야 하는 만큼, 이웃 국가들을 우리가 적절하다고 보는 방식으로 상대할 준비를 할 것입니다. 이 디딤돌은 머지않아 우리가 위대함을 이루고 다시 세계 무대의 일원이 될 것이라는 단순한 사실일 뿐입니다."
 free_states_idea_naval_budget_priorities: "해군 예산 우선"
 free_states_idea_naval_budget_priorities_desc: "구질서에서 남은 군 대부분이 다소간 해군에 관련되어 있어 우리의 예산 우선순위도 그러한 영향을 반영하기 시작했습니다. 그러나 우리가 바다가 아닌 대륙을 등지고 있는 상황에서 그러한 영향이 얼마나 유익하겠습니까."
 free_states_idea_army_defensive_budgeting: "육군 방어 예산 편성"
 free_states_idea_army_defensive_budgeting_desc: "현대전은 아주 빠르게도, 아주 느리게도 승리할 수 있습니다. 현대의 민간인은 대부분이 깨닫는 것보다 더 큰 힘을 지니고 있으며, 우리는 그 사실을 인식하고 있습니다. 우리의 현대 교리는 4세대 전쟁의 요소를 표준적인 소모전 교리와 결합할 것입니다. 이를 통해 물자와 인원 모두 최소한의 비용으로 기동 방어를 갖출 수 있습니다. 이 새로운 교리는 DEW, 즉 방어 지출 전쟁이라 불립니다."
 free_states_idea_naval_renovations_budget: "해군 개수 예산"
 free_states_idea_naval_renovations_budget_desc: "우리의 상황과 해안선은 좋게 봐도 상당히 길고 나쁘게 보면 어마어마합니다. 광대한 바다와 우리 해안에 상륙하려는 자들로부터 스스로를 방어하는 것을 생각하려면, 해군 전체를 개편하고 개수하는 데 투자해야 합니다."
 free_states_idea_foreign_relations_act: "대외 관계법"
 free_states_idea_foreign_relations_act_desc: "대외 관계법은 더 나은 무역 협정과 노동자 교류 프로그램을 얻기 위해 외국 강대국에 호소하는 외교적 투자입니다. 전반적으로 경제는 성장하겠지만, 이러한 의무를 계속 감당하느라 정치적 역량이 압박을 받을 것입니다."
 free_states_idea_domestic_priority_policy: "국내 우선 정책"
 free_states_idea_domestic_priority_policy_desc: "DPP는 국내 정책의 시행과 국가 및 시민의 복리를 최우선으로 삼는 이상입니다. 국방을 확보해야 하며, 이처럼 내향적인 접근에서는 외교 정책이 국가의 안보를 우선시해야 합니다. 따라서 무역과 국방 같은 것들이 이 계획의 이상입니다."
 free_states_idea_diplomatic_corps: "외교단"
 free_states_idea_diplomatic_corps_desc: "적과 친구는 온갖 모습과 규모로 존재하므로, 누가 누구인지 확인하고 이해하려면 최고 수준의 외교단이 있어야 급격한 변화가 일어날 때 관계에 관한 정보를 가장 빨리 알 수 있습니다."
 free_states_idea_national_labor_corps: "국가 노동단"
 free_states_idea_national_labor_corps_desc: "일자리나 소득이 필요한 이들을 돕는 교정 노동단과 민간 노동단의 결합, 그리고 사회에서 무언가를 빼앗으려 했던 이들이 이제는 더 많이 되돌려 줄 수 있도록 활용하는 능력입니다. 요컨대 NLC는 끊임없이 커 가는 우리 훌륭한 국가의 기구를 키우고 유지하는 데 쓰일 것입니다."
 FSA_america_military_surplus_jobs: "군 잉여 인력 일자리"
 FSA_america_military_surplus_jobs_desc: "군을 위한 장비 생산은 무기든 보병이 마시는 수통처럼 단순한 것이든 저마다의 방식으로 모두 중요합니다. 그렇다면 군수 산업을 수동적으로 활용하여, 국방 병력에게 더 많은 장비와 물자를 공급하는 동시에 아직 마땅한 민간 일자리를 찾는 이들에게 소득을 쥐어 주는 것만큼 실업 문제를 임시로 해결하기에 좋은 방법이 어디 있겠습니까."
 free_states_idea_extreme_mining_projects: "극단적 채굴 사업"
 free_states_idea_extreme_mining_projects_desc: "무모한 채굴이라 부르는 이도 있겠지만, 우리는 광범위하고 종종 극단적인 채굴 작업을 통해 국제적 인정에 가까운 수준까지 도약했습니다. 상당수 사람들이 이러한 \\"무자비한 채굴\\"을 좋아하지 않지만, 무역 협정에서 다른 국가들에 대해 가질 수 있는 잠재적 영향력과 무역 상품을 통해 시민에게 돌아갈 이익을 간과할 수는 없습니다."
 free_states_idea_strategic_autarky: "전략적 자급자족"
 free_states_idea_strategic_autarky_desc: "전략적 자급자족 계획(SAP)은 무역 협정을 최대한 제한하고, 체결하는 협정은 시민의 복리를 위해 확실히 확보하도록 하는 국가 전략 구상입니다. 국제 관계 측면에서 가장 받아들여지기 쉬운 전략은 아닐 수 있으나, 우리는 스스로를 지켜야 합니다."
 free_states_idea_consumer_complex_initiative: "소비 복합 구상"
 free_states_idea_consumer_complex_initiative_desc: "소비 복합 구상(CCI)은 소비재 중심 산업을 경제의 일차적 기반이자 조직 원리로 삼는 경제 모델입니다. 이에 따라 방위 산업이나 이른바 경제의 \\"장교 부문\\"으로 여겨지는 특수 산업은 부차적으로 보며, 국가적 필요에 따라 소비 복합의 보완적 부분이 됩니다. 이는 그러한 것의 건설이 타격을 입는다는 뜻이지만, 국민이 잘 보살핌을 받는다면 누가 신경 쓰겠습니까."
 free_states_idea_economic_efficiency_model: "경제 효율 모델"
 free_states_idea_economic_efficiency_model_desc: "높이 짓자는 말에 대부분은 한 구역에 더 많은 사람을 수용하는 건물을 떠올렸을 뿐입니다. 그러나 우리의 새로운 EEM 경제 계획으로 높이 짓는 것도 경제 모델이 될 수 있음을 보여 줄 수 있습니다. 더 적은 수단으로 더 많은 생산을 얻는 방식으로 산업에 집중함으로써, 자원 소모를 제한하면서 균형 있고 효율적인 성장도 유지할 수 있습니다."
 free_states_idea_military_readiness_model: "군사 대비 모델"
 free_states_idea_military_readiness_model_desc: "군사 대비 모델(MRM)은 경제의 선제적 군사화에 초점을 맞춘 경제 모델입니다. 공장과 산업을 전시 제조 시설로 전환될 수 있다는 전제 하에 건설한다는 뜻입니다. 이를 통해 경제는 지속 가능한 방식으로 운영되면서도 필요가 생길 경우 높은 적응력을 발휘할 수 있습니다."
 free_states_idea_department_for_synthetic_development: "합성 연료 개발부"
 free_states_idea_department_for_synthetic_development_desc: "화석연료에 한계가 있다는 것은 누구나 알지만, 그 한계를 과학적으로 가능한 한 늘릴 수 있다면 어떻겠습니까. 바로 그 한계가 어디인지, 석유화학 산업의 일부인 플라스틱, 나일론, 특정 화학물질이나 윤활제 등 미래에 어떤 합성물을 만들 수 있는지 알아내는 연구개발 전담 부서인 DSD가 등장합니다. 우리는 과거를 활용해 미래를 만듭니다."
 free_states_idea_department_for_energy_innovation: "에너지 혁신부"
 free_states_idea_department_for_energy_innovation_desc: "우리가 미래를 활용한다고 주장하려면, 그것이 과학적으로 정말 미래임을 보장해야 합니다. 따라서 DEI는 에너지 생산의 혁신을 발굴하고 발견하는 것은 물론, 가능한 한 낭비 없이 에너지를 더 효율적으로 소비하는 방법을 찾는 임무에 전념합니다."
 free_states_idea_infrastructure_readiness_act: "기반시설 대비법"
 free_states_idea_infrastructure_readiness_act_desc: "기반시설 대비법은 국가 기반시설 보존에서 불만과 나태에 맞서는 그 자체의 선전포고입니다. 점검 주기를 정하고 건설 일정과 자재 조달을 미리 계획하면 기반시설을 신속히 수리하고 유지하면서도, 지역 주민의 일상에 미치는 전체적 영향을 줄일 수 있습니다."
 free_states_idea_defensive_officers_school: "방어 장교 학교"
 free_states_idea_defensive_officers_school_desc: "우리는 스스로를 지키는 방법을 이해해야 하며, 더 적은 것으로 더 많은 것을 얻고 무모한 적에 맞서 우리의 방어 구상을 진정으로 감당할 수 있도록 하는 전문 훈련이 필요합니다."
 free_states_idea_the_bulwark_doctrine: "보루 교리"
 free_states_idea_the_bulwark_doctrine_desc: "보루 교리는 국가의 방어와 정신을 지키는 데 있어 우리의 근본적인 전환입니다. 지형과 물류를 활용하고, 모두가 죽지 않으면서도 죽을 때까지 방어하는 능력을 이해하는 것입니다. 이 모든 것이 우리가 살아남을지, 시간의 시련에 스러질지를 결정할 것입니다."
 free_states_idea_the_fighter_defense_doctrine: "전투기 방어 교리"
 free_states_idea_the_fighter_defense_doctrine_desc: "하늘을 지키는 것이 지상군을 지키는 길입니다. 따라서 항공 훈련과 생산을 특화하여 우리 항공 전력의 우위를 보장해야 합니다."
 free_states_idea_the_increasing_defensive_capabilites: "방어 능력 강화"
 free_states_idea_the_increasing_defensive_capabilites_desc: "IDC 계획은 우리 항공기 생산 방식을 활용하여 인간 조종사가 일반 조종사가 할 수 없는 일을 공중에서 해낼 수 있도록 돕는 것입니다. 레이더 혁신, 추력 및 비행 제어의 발전 등이 여기에 해당합니다. 우리는 국가 영공의 수호자가 될 것이며, 매일 쾌청한 날이 될 것입니다."
 free_states_idea_naval_mining_warfare_refinement_program: "해군 기뢰전 개선 계획"
 free_states_idea_naval_mining_warfare_refinement_program_desc: "해군 기뢰전 개선 계획은 해상 기뢰와 기뢰전 능력을 중심으로 해군을 훈련하고 다듬는 전담 훈련 및 강화 기관입니다."
 free_states_idea_armored_assault_assist_groups: "기갑 돌격 지원단"
 free_states_idea_armored_assault_assist_groups_desc: "AAAG, 즉 트리플 AG는 기갑 요소를 현지화하고 특화하여 주력 육군이 적 병력을 돌파하고 분단하는 것을 지원하기 위한 전투 교리입니다."
 free_states_idea_aggressive_officer_corps: "공세적 장교단"
 free_states_idea_aggressive_officer_corps_desc: "장교 훈련 프로그램과 군사 학교를 재편하면 우리 지도부는 이전에 볼 수 없었던 방식으로 공세적이 될 수 있습니다. 이는 분명 대가가 따르겠지만, 우리가 공격받는다면 적이 그런 선택을 한 것을 후회하게 만들 것입니다."
 free_states_idea_material_not_human_loss: "인명이 아닌 물자의 손실"
 free_states_idea_material_not_human_loss_desc: "장비는 교체할 수 있지만 경험 많고 훈련된 병사는 그렇지 않습니다. 장비 손실이 불가피한 것은 받아들이되 동료 병사의 손실은 대체할 수 없는 것이라는 점을 장려하는 훈련 방식을 확립할 것입니다."
 free_states_idea_survivability_program: "생존성 계획"
 free_states_idea_survivability_program_desc: "우리는 생존성의 혁신을 보장해야 하며, 이를 위해 인원의 생존뿐 아니라 가능한 모든 경우 장비의 생존성까지 극대화하는 방법을 다듬고 개발할 것입니다."
 free_states_idea_admirable_admiralty: "존경스러운 해군부"
 free_states_idea_admirable_admiralty_desc: "해군 지도자들의 숙련도와 타고난 재능은 우리가 해군 우위를 보장하는 방법의 정점입니다."
 FSA_america_hit_and_hit_again: "치고 또다시 치기"
 FSA_america_hit_and_hit_again_desc: "함선으로 심리전을 해 본 적이 있습니까? 이제 우리는 할 수 있습니다. 우리 종의 약점을 특화하여 이해함으로써, 적 승조원이 방향 감각을 잃은 뒤 결정적 타격을 가하는 식으로 전투 전술을 구성할 수 있습니다. 이는 도박성 전술이지만 성공한다면 적 함대 역량에 치명타를 안길 것입니다."
 free_states_idea_the_assimilation_program: "동화 계획"
 free_states_idea_the_assimilation_program_desc: "옛 사상으로 새로운 정체성을 만드는 일은 개인과 이상주의자들에게 인기가 없기 마련입니다. 따라서 이러한 선입견을 뒤집고, 산만함을 낳는 그러한 경향이 확산되지 못하도록 억제해야 합니다."
 free_states_idea_the_second_american_republic: "제2 미국 공화국"
 free_states_idea_the_second_american_republic_desc: "피와 땀과 눈물, 그리고 수많은 시련을 거쳐 우리는 망토를 되찾고 운명을 확보했습니다. 아메리칸 드림을 새롭게 하고 제2 미국 공화국을 세움으로써, 1776년 건국자들이 처음 쓴 이 자유의 책에서 마침내 한 장이 넘어갔습니다. 새로운 공화국을 위한 새 시대, 새 빛, 새 미래를 위하여."
 free_states_idea_the_self_made_embargo: "자체 금수 조치"
 free_states_idea_the_self_made_embargo_desc: "우리가 가진 현대 기술과 합성 기술 덕분에 자급자족과 고립주의 신념이 어느 때보다 잘 실현될 수 있습니다. 이를 통해 일본 막부 시대 이후 볼 수 없었던 현대적 선례를 만들 것입니다."
 free_states_idea_ground_to_air_dominance: "지대공 우세"
 free_states_idea_ground_to_air_dominance_desc: "우리에겐 달아날 곳이 없으니 달아나지 말고 싸우기 시작합시다. 실용적인 지대공 전투 능력에 대한 상당한 투자는 우리의 정당한 영토 위에서 벌어지는 어떠한 현대 공중전에서도 버틸 수 있게 해 줄 것입니다. 게다가 추가된 장비는 영토 일부가 포위당할 경우 지하전에도 도움이 될 수 있습니다."
 free_states_idea_graveyard_warfare_doctrine: "무덤 전쟁 교리"
 free_states_idea_graveyard_warfare_doctrine_desc: "무덤 전쟁 교리(GWD)는 비대칭전, 곧 4세대 전쟁과 관련된 포괄적 교리입니다. 이 시민 전쟁 교리는 우리와 우리 국민을 굴복시켜 지옥에 빠뜨리려는 모든 외국 세력에게 오히려 그들만의 지옥을 안겨 줄 것입니다."
 free_states_divided_we_fell: "분열되어 무너지다"
 free_states_divided_we_fell_desc: "공화국은 더 이상 없으며, 우리는 한때의 그림자에 불과합니다. 땅은 불타고 있고 사람들은 죽어 가거나 달아나거나, 어떻게든 생존하고 있습니다. 이는 우리가 사실상 홀로 서 있는 동안에도, 북쪽과 남쪽의 이웃들이 신대륙을 덮친 최대의 인도주의 위기와 관련해 일부 지원을 받고 있다는 뜻입니다. 길은 끊기고 장애물로 가득하지만, 우리는 계속 나아가 어떤 지평이든 찾아야 합니다."
 free_states_federal_budgets: "연방 예산 정책"
 free_states_federal_budgets_desc: "번영을 보장하려면 장부의 균형을 맞춰야 합니다. 우리는 주변 세계로부터 배우고, 부채가 외면할 것이 아니라 이해해야 할 숫자임을 알아야 합니다."
 free_states_domestic_policies: "국내 정책"
 free_states_domestic_policies_desc: "우리는 국민을 더 낫게 만들기 위해 노력해야 하며, 국가뿐 아니라 우리가 고향이라 부르는 것을 이루는 시민과 문화도 함께 키워야 합니다."
 free_states_industrial_policies: "산업부"
 free_states_industrial_policies_desc: "산업부(DoIA)는 때로 산업 행정국(IAA)이라고도 하며, 우리 경제를 규제하고 간소화하며 형성하기 위해 설립된 정부 부서입니다. 자원 관리부(DoM)와 긴밀히 협력하여 균형 잡힌 규제와 계획을 수립하고, 우리 국가의 경제를 성장시키고 다각화하며 통제합니다. 다만 DoM이 오직 자원 배분과 그 자원의 조직화를 맡는 반면, IAA는 이러한 자원을 활용하는 기업 내의 계획과 혁신을 담당합니다."
 free_states_resource_management_policies: "자원 관리부"
 free_states_resource_management_policies_desc: "자원 관리부, 줄여서 관리부(DoM)는 사회 자체를 재건하고 재편하기 위해 설립된 정부 기관입니다. 이 부서가 우리가 가용한 자원, 혹은 이 경우 가용하지 않은 자원에 전적으로 집중함으로써 우선순위를 정하고, 훨씬 적은 것으로 훨씬 많은 것을 만들어 낼 방법을 찾을 수 있습니다. 이 부서는 우리 발전의 방향과 역사에 남길 흔적을 정하는 데 핵심이 될 것입니다."
 free_states_tax_policies: "세금 정책"
 free_states_tax_policies_desc: "진전을 가늠하려면 안정적이고 적응력 있는 세법이 있어야 합니다. 이 세법은 국민의 필요와 우리의 미래를 보장하고 그 길을 닦는 국가 이익에 맞추어 조정되어야 합니다."
 free_states_army_service_branch: "육군 병과"
 free_states_army_service_branch_desc: "국방의 근간이자 우리 군의 중핵은 육군입니다. 국가와 국민을 지키려면, 본토를 지킬 뿐 아니라 우리의 생활 방식을 위협하는 적에 대처할 수 있는 전투 병력을 개편하고 확립해야 합니다."
 free_states_air_force_service_branch: "공군 병과"
 free_states_air_force_service_branch_desc: "근간은 육군이지만 전장의 여왕은 지상이 아니라 공군이 있는 하늘에 있습니다. 우리 땅을 진정으로 지키려면 적과 보조를 맞춰야 합니다. 적이 지상에서 공격하지 못하는 것이라도 공중에서 기총소사하고 폭격할 수 있기 때문입니다."
 free_states_navy_service_branch: "해군 병과"
 free_states_navy_service_branch_desc: "해군은 적의 의도를 지연시키고 경고하는 차단막입니다. 억제력을 만들고 우리가 공유하는 영토 너머의 위협으로부터 본토를 지키려면 강력한 해군이 있어야 합니다."
 free_states_idea_hit_them_again_doctrine: "치고 또 치기 교리"
 free_states_idea_hit_them_again_doctrine_desc: "누군가에게 가진 모든 것을 퍼부으면 상대는 당황하거나 뒷걸음질 치거나 응집력을 잃습니다. 따라서 이 발상을 활용하여 적에 대한 새로운 유형의 전투 전술을 도입합니다. 함대나 함선이 가능한 한 말 그대로 모든 것을 한꺼번에 적에게 퍼부을 수 있도록 준비하면, 그 혼란을 틈타 정밀 타격을 신속히 준비하여 적 함선에 치명타를 입히거나 격침시킬 수 있습니다."
 USA_colorado_capital: "마운트 컬럼비아"
 USA_kansas_capital: "뉴 알링턴"
 USA_missouri_capital: "윈필드"
 post_united_event.1.t: "자유 주를 갈라놓는 파벌주의"
 post_united_event.1.d: "아메리카 자유 주라는 사회의 외형이 성급하게 세워진 이후, 이 잔존 국가의 집권 연방 정부는 강력한 파벌주의를 키워 왔습니다. 이 파벌주의는 많은 이들이 네 개 집단으로 본 것으로 나뉩니다. 북부의 사회주의자, 동부의 군국주의자, 남부의 군주주의자, 그리고 중앙·서부의 연방주의자입니다. 이 파벌들은 두 개의 주요 파벌로 합쳐졌으며, 새로운 세부 사항을 파악하는 대로 더 많은 소식이 전해질 것입니다."
 post_united_event.1.o1: "우리는 이미 충분히 갈라지지 않았나?"
 post_united_event.2.t: "선거 찬성 집단"
 post_united_event.2.d: "최근 정치적 파벌주의가 고조되면서 연방당, 자유사회당, 현대군주당 같은 선거 찬성 집단이 부상했습니다. 이들 정당은 최종 목표와 사실상 모든 면에서 일관성이 없지만, 어쩐 일인지 선거 원칙에는 모두 동의했습니다. 현 상황에서 투표 제도가 가능한 한 대의적이라는 점을 이해하기 때문입니다. 많은 이들은 미래를 위한 투표가 장기적으로 우리를 갈라놓기보다 더 하나로 묶어 주리라는 희망을 여전히 붙들고 있지만, 그것은 시간만이 말해 줄 것입니다."
 post_united_event.2.o1: "우리가 원하는 미래를 위해 투표하자"
 post_united_event.3.t: "선거 반대 집단"
 post_united_event.3.d: "반면 선거 반대 정당들이 있으며, 이들은 연방당, 자유사회당, 통합군당으로 이루어져 있습니다. 알 수 있듯이 두 주요 정당인 연방당과 자유사회당을 가르는 파벌주의는, 선거가 실시된다면 잠재적인 미래의 후보 구성을 근본적으로 갈라놓을 것으로 보입니다. 이러한 분열의 상태에 대해서는 아는 바가 거의 없으나, 논쟁이 계속되는 앞으로 며칠간 어떤 일이 벌어질지 지켜볼 것입니다."
 post_united_event.3.o1: "토론이 아니라 집중해야 한다."
 post_united_event.4.t: "분열된 여론조사"
 post_united_event.4.d: "지난 몇 주 동안 여론조사원과 기자들이 전국을 휩쓸었고, 일종의 유사 투표 방식인 \\"전국 여론조사\\"는 우리가 정말 어떤 방향으로 가야 하는지를 두고 많은 이들을 갈라놓았습니다. 결국 대다수는 우리가 처한 약하고 불구가 된 상태에서 지금 더 이상의 선거는 오히려 방해만 될 뿐이라는 데 동의했습니다. 이제 여론을 자기 쪽으로 돌리는 것은 네 개의 주요 정당에 달려 있습니다. 연방당과 그 더 보수적인 파벌, 자유사회당의 국가통제주의 파벌, 중부대서양당의 고립주의 파벌, 국가봉사당의 군국주의 파벌입니다. 모두 원하는 것은 다르지만 동시에 같은 것을 원합니다. 가까운 장래에는 선거 없이 더 자급자족적인 정체성을 갖자는 것입니다."
 post_united_event.4.o1: "연방당이 승리를 거머쥐다"
 post_united_event.4.o2: "FSP가 승리를 공유화하다"
 post_united_event.4.o3: "\\"MAP\\" 고립주의자들이 권력을 확보하다"
 post_united_event.4.o4: "NSP가 또 한 번의 전투에서 이기다"
 post_united_event.5.t: "첫 번째 선거"
 post_united_event.5.d: "선거가 재개됨에 따라 이제 투표를 하고 국민이 원하는 방향을 선택할 때가 되었습니다. 연방당, 자유사회당, 중부대서양당, 국가봉사당 모두 선거에서 안정적인 과반을 확보하기 위해 대중의 지지를 구하고 있습니다. 그러나 시간이 흐르고 표가 집계되면서 첫 공식 선거의 승자는..."
 post_united_event.5.o1: "연방당이 승리했다"
 post_united_event.5.o2: "자유사회당의 승리"
 post_united_event.5.o3: "중부대서양당이 당연히 이겼다"
 post_united_event.5.o4: "국가봉사당이 승리를 가져오다"
 post_united_event.1000.t: "위대한 질문"
 post_united_event.1000.d: "바람이 우리에게 희망적인 쪽으로 바뀌면서, 우리는 국가적으로 과감한 제스처를 취하여 국명 변경 가능성을 선언했습니다. 이에 전국 투표가 조직되었으며 곧 결과가 집계될 것입니다. 위대한 도박이 눈앞에 있으며 국민이 진정으로 무엇을 원하는지 알게 될 것입니다... 그들이 원하는 것이 우리이기를 바랄 뿐입니다."
 post_united_event.1000.o1: "우리는 아카디아다!!!"
 post_united_event.1000.o2: "적어도 우리는 하나다... 맞지?"
 post_united_event.2000.t: "수도 위기"
 post_united_event.2000.d: "제2의 명백한 운명 이후, 국민의 눈과 귀는 여전히 옛 동부 해안의 초라한 곳에 있는 수도로 향하고 있습니다. 많은 이들은 상징성 때문에 수도를 바꾸어서는 안 된다고 믿는 반면, 훨씬 더 많은 이들은 국가 전체의 변화를 상징하기 위해 바꿔야 한다고 믿습니다. 새 수도는 하원 확대에 대한 사전 계획을 더 잘 세울 수 있게 해 줄 것이며, 이는 많은 이들이 구질서의 정치적 수렁이 지닌 주된 결함 중 하나로 여기는 부분입니다. 게다가 새 수도는 아마 더 중앙에 위치하여, 연방 정부가 하는 일을 한 번도 생각해 본 적 없던 사람들에게 빛과 관심과 노출을 줄 것입니다. 그럼에도 몇몇 후보가 선택지에 올라 있으며, 선택은 국민과 지도자들에게 달려 있습니다."
 post_united_event.2000.o1: "왜 바꾸나, 지금도 괜찮은데."
 post_united_event.2001.t: "로키산맥"
 post_united_event.2001.d: "많은 이들이 로키산맥 부근, 혹은 사실상 로키산맥 위에 수도 지역을 건설하자고 주장합니다. 이는 우리 국가가 공격을 받을 때마다 자연 요새와도 같은 구조를 이룰 것입니다. 다른 이들은 의도했던 것보다 다소 고립적으로 보일 수 있다고 주장합니다. 어쨌든 계획가들은 이미 콜로라도 북부에 일종의 정착지를 세울 기초 작업에 착수했습니다."
 post_united_event.2001.o1: "로키 로드(아이스크림)는 싸게 먹을 수 있나?"
 post_united_event.2002.t: "\\"중앙\\" 정부"
 post_united_event.2002.d: "캔자스 계획가들은 자신들이 제안하는 새 수도 위치가 가장 중앙에 위치한 제안 중 하나라고 주장합니다. 이는 공정하게 여겨질 것이며 동부 해안 대 서부 해안이라는 식의 편향된 사고에 영합하지 않을 것입니다. 그럼에도 우리 선택의 타당성을 보장하려면 나머지 선택지도 평가해야 합니다."
 post_united_event.2002.o1: "일리는 있군."
 post_united_event.2003.t: "강 장벽 방안"
 post_united_event.2003.d: "최근 많은 이들이 수도를 미시시피강 부근에 두는 것이 더 실현 가능하다고 보고 있으며, 이는 적의 지상 공격에 대한 거대하고 확실한 장벽입니다. 이는 우리 대륙이 나뉜다고 하는 분수령의 상징이며, 다소 수직으로 흐르는 강이 남쪽 측면을 덮고 동쪽과 거의 북쪽까지 가려 준다는 점을 생각하면 더 안전한 위치입니다. 이 방안은 다른 두 방안보다 더 동쪽이지만 미시시피강의 서쪽에 위치합니다. 어쨌든 새 건물이 어떤 모습일지, 하원을 어떻게 할지에 대한 계획도 남아 있습니다."
 post_united_event.2003.o1: "적어도 물은 충분하군."
 post_united_event.2004.t: "최종 결정"
 post_united_event.2004.d: "몇 주에 걸친 숙의와 계획, 대중 여론조사와 상황의 여러 측면을 거쳐, 마침내 새 수도의 위치와 이름을 결정할 때가 되었습니다. 콜로라도에는 마운트 컬럼비아라는 제안이 있고, 미주리에는 미주리강과 미시시피강을 자연 국경으로 삼는 윈필드 마을을 기반으로 하는 안이 있습니다. 마지막으로 캔자스 북부의 뉴 알링턴 제안이 있는데, 넓고 트여 있으며 사실상 비어 있어 개발하기에 백지와도 같은 곳이 될 가능성이 큽니다."
 post_united_event.2004.o1: "옛 수도도 충분히 좋다."
 post_united_event.2004.o2: "로키산맥이 자유를 수호할 것이다."
 post_united_event.2004.o3: "당연히 중앙 정부 입지다."
 post_united_event.2004.o4: "미시시피강이 자유를 수호할 것이다."
 post_united_event.2005.t: "새로운 아메리카"
 post_united_event.2005.d: "제2 미국 공화국의 선포와 함께, 이제 우리는 우리가 성장한 규모에 맞게 행정을 개편하고 적응시키고자 합니다. 지휘하고 통제할 것이 너무 많아 분명 비효율이 생기겠지만, 그럼에도 우리는 이겨 낼 것입니다. 독수리는 추락했으나 다시 일어나 이전보다 더 높이 날아오를 것입니다."
 post_united_event.2005.o1: "노부스 아메리카누스, 새로운 아메리카의 시대"
 free_states_idea_military_high_command: "통합 군 최고 사령부"
 free_states_idea_military_high_command_desc: "이제 중앙집중화된 \\"최고 지도부\\"가 생겼으므로, 우리는 군을 확장하고 훈련하며 발전시키고 그 역량을 더욱 강화할 수 있습니다."
 USB_decisions_war_time_mobilization_category: "전시 동원"
 USB_decisions_war_time_mobilization_category_desc: "우리 땅을 지키고 우리의 운명을 만들 때가 올 것입니다. 무기를 들고 우리의 땅과 시간의 시험을 견딜 기념물들을 수호하십시오."
 USB_war_time_mobilization: "제1차 동원"
 USB_war_time_mobilization_desc: "때가 왔습니다. 워싱턴과 우리가 지켜 온 연방의 자유를 수호하십시오. 우리는 지켜 낼 것입니다!"
 USB_war_second_wave_defenders: "제2차 수호대"
 USB_war_second_wave_defenders_desc: "적이 밀고 들어오고 있으므로 또 한 차례의 수호대를 징집해야 합니다. 국가의 사기는 저하되겠지만 병력이 필요합니다."
 USB_war_desperate_defenders: "필사의 수호대"
 USB_war_desperate_defenders_desc: "상황이 암울해지고 있습니다. 전선을 지키려면 가능한 모든 인원이 필요합니다. 어쩌면, 아주 어쩌면 아직 승리할 수도 있을 것입니다."
 USB_america_economy_what_economy: "경제... 무슨 경제?"
 USB_america_economy_what_economy_desc: "모든 것이 총체적으로 엉망인 지금, 우리는 먼저 기준선에 대한 공감대를 만들어야 합니다. 그 기준선이란 경제 규제에 관한 입법 개혁을 추진하고, 돌봄 프로그램, 교육 및 훈련 지원 프로그램, 그리고 투자 목적 보조금에 해당하는 행정 프로그램 사이의 예산을 증액하는 것입니다. 요컨대 우리는 행정 및 예산 기준을 확립하여 경제 건설에 가능한 최선의 방식으로 접근할 수 있도록 할 것입니다."
 USB_america_department_of_labor_affairs: "노동부"
 USB_america_department_of_labor_affairs_desc: "노동부(DoLA)는 더 적은 인원으로 더 높은 효율을 얻을 수 있도록 노동법과 노동 규정을 검토하고 개선하는 전담 부서입니다. 또한 노동부는 실업 지원 프로그램도 관할하므로 예산은 크게 두 부분으로 나뉩니다. 하나는 실업 지원 프로그램이며, 다른 하나는 재취업 프로그램입니다. 재취업 프로그램은 실업자들이 조직적인 취업 박람회나 프로그램을 찾아 새로운 안정적인 직장과 소득을 얻을 때까지 대체 소득을 확보할 수 있게 해 줍니다."
 USB_america_ensuring_the_modern_four_day_week: "현대적 주 4일제"
 USB_america_ensuring_the_modern_four_day_week_desc: "오늘날 자동화와 기술 덕분에 우리의 노동력은 십수 년 전보다도 훨씬 효율적이 되었습니다. 따라서 현대적 주 4일 근무제는 일과 사회적 삶 사이의 진정한 균형을 보장하는 표준이며, 이 지표를 이해함으로써 기존 노동력으로부터 더 많은 생산과 고용 가치를 끌어낼 수 있습니다."
 USB_america_ensuring_enforced_job_fairs: "취업 박람회 의무화 보장"
 USB_america_ensuring_enforced_job_fairs_desc: "취업 박람회의 개최와 지속을 의무화하는 것은 고용주에게 해당 지역의 노동력이 어떤 수준인지 알려 줄 뿐 아니라, 노동자에게는 존재하는 줄도 몰랐던 일자리를 접할 기회를 주므로 필수적입니다. 약간의 비용이 들겠지만, 구직 과정이 원활하게 이루어지도록 하는 데에는 충분히 그럴 만한 가치가 있습니다."
 USB_america_automation_and_advancements_act: "자동화 및 진보법"
 USB_america_automation_and_advancements_act_desc: "흔히 3A라 불리는 자동화 및 진보법은 정식 명칭 그대로 교육 및 연구개발 예산 패키지로, 전 세계 산업이 로봇공학, 자동화, 인공지능 기반 프로그램 같은 보편화된 관행을 따라잡아 생산량과 효율을 높이도록 하는 것입니다. 이는 일자리를 일시적으로 잃을까 두려워하는 미신적인 이들에게 타격을 줄 것입니다. 그러나 교육 체계 현대화에 투자하여 사람들이 더 어린 나이부터 이러한 직업을 인식하도록 하면 그 규모를 완화할 수 있습니다."
 USB_america_national_labour_corps: "국가 노동단"
 USB_america_national_labour_corps_desc: "국가 노동단(NLC)은 연방이 후원하는 민간 노동단으로, 실업자들과 (물론 별도의 시설에서) 교정 노동단이 함께 기반시설 및 개발 사업에 투입될 것입니다. 이는 또한 기반시설 같은 분야의 유지 보수를 충분히 수행할 기회가 되기도 합니다."
 USB_america_military_surplus_jobs: "군 잉여 인력 일자리"
 USB_america_military_surplus_jobs_desc: "군과 민간 부문이 협력하면 신생 국가가 겪고 있는 고용 문제를 제때 더 잘 해결할 수 있을 것입니다."
 USB_america_slashing_regulations_for_new_regulations: "새 규제를 위한 규제 삭감"
 USB_america_slashing_regulations_for_new_regulations_desc: "경제 성장을 조금이라도 생각한다면, 우리에게 필요한 규제와 불필요한 규제가 무엇인지 파악해야 합니다. 기업 친화적인 것과, 기회주의적이고 개인주의적인 권력 찬탈자들의 사적 탐욕에 수수방관하는 것은 전혀 다른 문제입니다. 따라서 성장의 의미를 훼손하지 않으면서 성장을 장려하려면 현행 규제를 삭감하고, 그 자리를 더 낫고 명확하며 유연한 규제로 대체해야 합니다."
 USB_america_department_for_strategic_resource_collection: "자원 수집부"
 USB_america_department_for_strategic_resource_collection_desc: "전략 자원 수집부(DoRC)는 자원 관리부(DoRM) 산하의 전담 행정 조직으로, 국가적 결속을 유지하는 데 핵심적인 자원의 전략 비축분 및 공급분을 확보하는 역할을 맡습니다. 건설용 강철, 에너지용 화석연료 등이 이에 해당합니다. 이 부서를 통해 우리는 미래를 보장할 것입니다."
 USB_america_aggressive_extraction_methods: "공격적 채굴 방식"
 USB_america_aggressive_extraction_methods_desc: "부서 내 공격적 채굴 방식(AEM) 논란은 상당한 정치적 반발을 불러왔습니다. 그러나 그로 인해 찾아올 경제 호황은 우리가 패를 잘 쓴다면 훨씬 큰 반등을 가져올 것입니다."
 USB_america_targeted_resource_extraction: "표적 자원 채굴"
 USB_america_targeted_resource_extraction_desc: "AEM의 사고방식과 달리, 부서는 우리 경제의 기능에 가장 중요한 전략 자원을 표적으로 삼을 것입니다. 이 방식은 에너지부와 협력하여 경제 및 자원 확장 사업에 접근하는 방식의 일관성을 확보할 것입니다."
 USB_america_rusting_sheets_to_polished_metals: "녹슨 철판에서 빛나는 금속으로"
 USB_america_rusting_sheets_to_polished_metals_desc: "이제 우리나라의 \\"러스트 벨트\\" 지역을 야금 제조업의 새로운 빛나는 철판으로 되돌릴 때입니다. 저지 해안의 알루미늄 공장부터 펜실베이니아 이리 단지의 제철소에 이르기까지, 한때 버려졌던 것에서 새로운 것을 만들어 낼 것입니다."
 USB_america_strategic_metallurgic_expansions: "전략 야금 확장"
 USB_america_strategic_metallurgic_expansions_desc: "과거 \\"러스트 벨트\\" 지역 주들의 전략 야금 확장(SME) 프로그램은, 한때 잊혔던 제조업의 보루들이 지닌 전략적 중요성과 고용 시장을 키우는 좋은 출발점입니다."
 USB_america_the_capital_gemstones: "수도 보석 법"
 USB_america_the_capital_gemstones_desc: "메릴랜드와 델라웨어는 건설 자재용 점토, 모래, 석재 외에는 이렇다 할 것으로 알려져 있지 않습니다. 그러나 메릴랜드의 석탄 채굴과 델라웨어의 석유화학이 협력할 수 있으며, 두 주의 제한적인 보석 채굴 사업도 최선을 다해 실질적으로 키울 수 있습니다. 가장 작은 주와 우리의 수도 주가 달리 표현할 말이 없을 만큼... 저평가되어 있었다는 걸 누가 알았겠습니까, 하하."
 USB_america_from_coal_to_petrochemicals: "석탄에서 석유화학으로"
 USB_america_from_coal_to_petrochemicals_desc: "자원 면에서 메릴랜드와 델라웨어는 다소 빈약하거나, 좋게 말해도 기대에 못 미칩니다. 따라서 이 제한된 여건을 활용하기 위해 메릴랜드의 석탄 산업을 확대하여 델라웨어의 과학 및 산업 석유화학 기반을 더욱 키울 것입니다. 이는 두 주 모두에 도움이 되며 연구개발에 투자할 이유도 더 많이 만들어 줍니다."
 USB_america_the_dynamic_ming_duo: "역동적인 광업 듀오"
 USB_america_the_dynamic_ming_duo_desc: "버지니아는 한때 하나의 주였으나 이제는 하나가 된 우리 국가의 두 부분입니다. 버지니아는 자원의 다양성이 제한적이므로 각 자원을 확대하고 강철, 구리 등 흔한 핵심 광물을 중점적으로 육성해야 합니다. 반면 웨스트버지니아는 사정이 훨씬 다릅니다. 이 주에는 석탄뿐입니다. 그래서 '검은 진주의 주'로 불리니, 그렇다면 진주를 캐 보도록 합시다. 진주 얘기가 나왔으니 말인데, 보석도 채굴한다는 사실을 아십니까? 우리의 원대한 계획에 곁들이는 훌륭한 부업입니다."
 USB_america_black_pearls_fuel_valley_industries: "계곡 산업에 연료를 대는 검은 진주"
 USB_america_black_pearls_fuel_valley_industries_desc: "웨스트버지니아의 석탄 및 화석연료 채굴 사업을 직접 성장시킴으로써 버지니아 산업과 강철, 티타늄 제철소 같은 야금 공장의 에너지 수요를 공급할 수 있습니다. 특히 정부가 버지니아에서 채굴되는 일부 광물을 \\"필수 자원\\"으로 지정한 점을 고려하면, 필수품은 계속 공급해야 하지 않겠습니까."
 USB_america_the_trade_guru: "무역의 달인"
 USB_america_the_trade_guru_desc: "우리의 자원 개발 및 확장 사업은 정점에 이르러, 국내 경제 발전이 마천루처럼 솟아오르는 데 그치지 않았습니다. 그러나 우리는 국경 너머도 바라보아야 합니다. 우리의 자원을 원하는 국가가 많을 것이며, 수익성 있는 미래를 보장하려면 이러한 잠재적 파트너를 찾아 나서야 합니다."
 USB_america_strategic_autarky_program: "전략적 자급자족 계획"
 USB_america_strategic_autarky_program_desc: "진정한 국가 안보를 확보하려면 자원 안보와 세계 각국과의 무역에 선제적으로 대응해야 합니다. 따라서 우리는 국가의 자원 안보에 맞추어 무역 정책을 이끌 전략적 자급자족 계획(SAP)을 도입할 것입니다. 많은 이들이 우리의 행동에 무관심하거나 실망할 가능성이 높지만, 국가의 안녕을 보장하기 위해서는 작은 대가에 불과합니다."
 USB_america_industrial_development_planning_board: "산업 개발 기획 위원회 설립"
 USB_america_industrial_development_planning_board_desc: "산업 개발 기획 위원회(IDPB)는 산업부 산하의 전담 기구로, 민간 부문의 활동과는 별개로 경제의 기획과 개발을 담당합니다. 주요 기능은 국가적 필요에 따라 균형을 찾는 것입니다. 예컨대 실업률을 낮춰야 한다면, 국민의 필요에 실제로 기여하지 못하는 좀비 기업만 양산하지 않으면서 실업률을 낮추려면 무엇이 필요한지를 판단하는 식입니다."
 USB_america_civilian_development_administration: "민간 개발청"
 USB_america_civilian_development_administration_desc: "IDPB 산하 민간 개발청(CDA)은 민간 부문의 성장을 보완하며 국가가 지속적이고 안정적으로 성장할 수 있도록 IDPB가 마련한 민간 경제 구상을 개발하는 임무를 맡습니다."
 USB_america_erie_hudson_initiative: "이리-허드슨 구상"
 USB_america_erie_hudson_initiative_desc: "IDPB는 이리-허드슨 구상을 승인했습니다. 이는 옛 러스트 벨트 지역에 속한 우리 구역을 다시 지도 위에 올려놓기 위한 부흥 계획입니다. 대단하진 않지만, 정직한 일입니다."
 USB_america_cumberland_wilmington_initiative: "컴벌랜드 & 윌밍턴 구상"
 USB_america_cumberland_wilmington_initiative_desc: "위원회로부터 메릴랜드와 델라웨어 개발 승인을 받았습니다. 따라서 안전이 허락하는 한 최대한 빨리 착공하여 준비를 갖출 것입니다."
 USB_america_the_sisters_initiative: "자매 구상"
 USB_america_the_sisters_initiative_desc: "위원회가 방금 버지니아 두 주의 개발 계획을 확정했습니다. 이를 통해 애팔래치아 지역과 그 밖의 지역에 산업화와 일자리를 가져다줄 것입니다."
 USB_america_rustic_services_plan: "러스틱 서비스 계획"
 USB_america_rustic_services_plan_desc: "펜실베이니아와 뉴저지 내 서비스 및 사무 네트워크를 개선하고 확장하려는 IDPB의 계획이 승인되었습니다. 즉시 작업에 착수하여 이들 주의 지역 경제를 다각화할 것입니다."
 USB_america_mid_atlantic_tech_plan: "중부 대서양 기술 계획"
 USB_america_mid_atlantic_tech_plan_desc: "수차례의 설계와 수정을 거쳐 위원회가 MAT 계획을 승인했습니다. 이는 메릴랜드와 델라웨어에 기술 및 기타 사무 네트워크 일자리를 가져오기 위한 개요 및 개발 구상입니다. 이를 통해 우리의 연구개발 역량이 높아지기를 기대합니다."
 USB_america_virginia_tech_expansions: "버지니아 공대 확장"
 USB_america_virginia_tech_expansions_desc: "위원회는 버지니아 공대와 협력하여 버지니아 두 주의 기술 및 서비스 부문을 구체화하는 개발 및 확장 계획을 수립하고자 합니다. 이를 통해 새로운 혁신과 지역 주민을 위한 충분한 일자리가 생기기를 기대합니다."
 USB_america_military_development_administration: "군사 개발청"
 USB_america_military_development_administration_desc: "군사 개발청(MDA)은 CDA에 대응하는 군 부문 조직입니다. 이 부서는 외세의 침입이나 노골적인 침공으로부터 국가의 방어 능력을 개발하고 유지하기 위해 IDPB가 승인한 군수 산업 계획을 시행할 책임이 있습니다."
 USB_america_altoona_tanks_and_jersey_jumpers: "알투나 전차 & 저지 점퍼"
 USB_america_altoona_tanks_and_jersey_jumpers_desc: "지역의 무기와 군복 등 지원 장비의 생산 능력이 확대될 것입니다. 주요 공장은 펜실베이니아주 알투나와 뉴저지주 뉴어크에 지정되었습니다. 위원회는 이들 공장이 일자리와 임금을 가져오고, 외국이 공격해 올 경우 지역의 안보 역량을 높여 주기를 기대합니다."
 USB_america_maryland_munitions: "메릴랜드 군수품"
 USB_america_maryland_munitions_desc: "메릴랜드와 델라웨어는 수도와 가까워 군 지원 장비를 개발하기에 최적의 장소입니다. 이에 따라 위원회는 군사 분야의 지역 보급망을 개발하는 메릴랜드 군수품 계획을 추진하기로 했습니다."
 USB_america_appalachian_arms: "애팔래치아 무기"
 USB_america_appalachian_arms_desc: "IDPB는 웨스트버지니아와 버지니아의 애팔래치아 지역 일대에 무기 시설을 건설하는 계획을 승인했습니다. 이 천연 산악 지형을 비축물자 저장에 활용할 수 있을 뿐 아니라, 지역 내 공장을 은폐하거나 부분적으로 보호할 수도 있기를 기대합니다."
 USB_america_philly_shipyards: "필라델피아 조선소"
 USB_america_philly_shipyards_desc: "필라델피아 남쪽의 만 지역은 조선소 단지를 건설하기에 훌륭한 장소입니다. 위원회는 필라델피아 남쪽과 뉴저지 서부 해안선을 따라 \\"대 필라델피아 조선소\\"를 건설하는 것을 승인했습니다."
 USB_america_delaware_destroyers: "델라웨어 구축함"
 USB_america_delaware_destroyers_desc: "이름과 달리, 델라웨어 중심이라고 알려진 이 개발 계획은 사실 더 넓은 반도 전체를 아우르는 해군 계획입니다. 메릴랜드와 델라웨어가 함께 차지한 반도를 따라 조선소가 건설되며, 이는 광활한 해안을 더 잘 활용하여 해안 방어를 강화하기 위함입니다."
 USB_america_norfolk_navies: "노퍽 해군"
 USB_america_norfolk_navies_desc: "버지니아주 노퍽 항은 예로부터 해군 함대를 건조하고 배출해 온 오랜 역사를 지니고 있습니다. 이에 따라 위원회는 노퍽 단지 인근에 이를 확장하고 지원 조선소를 건설하기로 했습니다. 이 해군 복합단지가 수 세기 동안 그래 왔듯이 우리의 연안 해역을 방어하는 데 도움이 되기를 기대합니다."
 USB_america_idpb_economic_direction_sub_committee: "경제 방향 소위원회"
 USB_america_idpb_economic_direction_sub_committee_desc: "IDPB의 주된 기능이 곧 경제 그 자체이므로, 우리 국가가 어떤 경제 방향으로 나아가야 하는지에 대해 최선의 결정을 논의하고 제시할 소위원회가 설치되었습니다. 어떤 이들은 제조업 기반을 주장하고, 어떤 이들은 기술 및 사무 중심의 서비스 경제를 주장합니다. 심지어 경제를 더 군사적인 방향으로 조직하여, 무기 판매를 통해 해외 투자에서 영향력을 확보하자는 이들도 있습니다. 어쨌든 무엇이 최선의 선택인지 결정하는 것은 이 소위원회의 몫입니다."
 USB_america_the_mom_and_pop_plan: "영세 상점 계획"
 USB_america_the_mom_and_pop_plan_desc: "경제의 근간은 분명 우리 위대한 국가 곳곳에 자리한 소규모 사업체입니다. 따라서 이들의 우위를 보장하는 방향으로 경제 개발을 이어 가면, 대부분의 국가보다 더 나은 경제를 건설할 수도 있을 것입니다."
 USB_america_pittswark_development_scheme: "피츠워크 개발 구상"
 USB_america_pittswark_development_scheme_desc: "PDS는 뉴저지와 펜실베이니아에서 추진하는 계획 경제 개발 구상입니다. 목표는 더 많은 소규모 사업체를 설립하고 소비재 중심 산업을 발전시켜 이들 주 시민의 삶의 질을 높이는 것입니다."
 USB_america_huntingmond_development_scheme: "헌팅먼드 개발 구상"
 USB_america_huntingmond_development_scheme_desc: "HDS는 웨스트버지니아와 버지니아에서 추진하는 계획 경제 개발 구상입니다. 목표는 더 많은 소규모 사업체를 설립하고 소비재 중심 산업을 창출하여 이들 주 시민의 생활 수준을 높이는 것입니다."
 USB_america_wilmingland_development_scheme: "윌밍랜드 개발 구상"
 USB_america_wilmingland_development_scheme_desc: "WDS는 델라웨어와 메릴랜드를 위한 경제 개발 구상입니다. 더 많은 소규모 사업체를 만들고 소비재 중심 산업을 구축하여 이들 주 시민의 생활 수준을 높이는 것을 목표로 합니다."
 USB_america_norfolk_naval_contract: "노퍽 해군 계약"
 USB_america_norfolk_naval_contract_desc: "우리의 의도가 순전히 국내에 있다 하더라도, 우리의 생활 방식과 국가 정체성을 지키려면 어떤 형태로든 방위 산업을 갖춰야 합니다. 따라서 노퍽 해군 조선소를 확장하고, 방어에 필요한 범위 내에서 제한적인 계약을 발주할 것입니다."
 USB_america_altoona_automatics_contract: "알투나 자동화기 육군 계약"
 USB_america_altoona_automatics_contract_desc: "군수 무기 계약은 오직 우리 자신을 지킬 방어 능력을 위한 것입니다. 따라서 알투나에 무기 공장을 세우고 소비재 중심 산업도 함께 키운다면, 부당한 군사화에 대한 우려는 가라앉을 것입니다."
 USB_america_the_consumer_complex_initiative: "소비 복합 모델"
 USB_america_the_consumer_complex_initiative_desc: "경제 계획이 굳건해지면서, 소비자 신뢰와 시민의 경제적 필요를 지키는 것이 진정한 우선순위라는 점을 깨달았습니다. 이에 우리는 국가와 국민의 필요를 이렇게 우선시하는 데 완전한 일관성을 보장하기 위한 새로운 경제 모델을 개발했습니다."
 USB_america_mixed_measures_plan: "혼합 조치 계획"
 USB_america_mixed_measures_plan_desc: "경제 계획은 그 자체로 하나의 정교한 예술이며, 과학이라 부르는 이도 있을 것입니다. 보는 시각이 어떠하든, 우리에게 그것은 일련의 균형 잡기입니다. 규모와 상관없이 국가나 사회 조직은 수많은 이들의 필요를 조율해야 하며, 언제나 정답을 찾지는 못하더라도 과거의 사람들만큼 틀리지 않도록 최선을 다할 수는 있습니다. 따라서 우리는 국가 전체의 복잡한 필요에 대해 균형과 공정성을 보장하는 일반 경제 개발 계획인 혼합 조치 계획(MMP)을 도입할 것입니다."
 USB_america_rust_belt_renewal_initiative: "러스트 벨트 재생 구상"
 USB_america_rust_belt_renewal_initiative_desc: "RBRI는 과거 러스트 벨트에 속했던 저지와 펜실베이니아 주의 경제를 되살리고 물론 다각화하기 위한 구상입니다. 다각화를 통해, 말하자면 기술적으로는 단일 품목에 의존하던 경제에 새로운 활력을 불어넣겠다는 취지입니다."
 USB_america_twin_sisters_initiative: "쌍둥이 자매 구상"
 USB_america_twin_sisters_initiative_desc: "두 개의 버지니아는 경제 다각화가 필요하며, 특히 웨스트버지니아가 더욱 그렇습니다만 이야기가 샜군요. 따라서 이 새로운 경제 개발 구상을 통해 바로 그것을 실행할 것입니다."
 USB_america_the_baltimore_blossom: "볼티모어의 꽃"
 USB_america_the_baltimore_blossom_desc: "아직 다각화되지 않은 마지막 주인 메릴랜드와 델라웨어에 같은 방식의 계획을 적용하고 나면, 국방이라는 정부의 필요로 방향을 돌릴 수 있습니다. 가장 큰 우선순위의 전환은 아니지만 우리의 안녕을 지키기 위해 필요한 일입니다."
 USB_america_the_office_initiative: "사무 구상"
 USB_america_the_office_initiative_desc: "서비스 및 사무 부문은 현대 소비자의 직접적인 필요에 해당합니다. 인터넷, 케이블 TV 등으로부터 시작하여, 우리는 사무 부문과 그 파생 산업을 발전시켜 성장에 대한 우리의 투자로부터 혜택을 얻고자 합니다."
 USB_america_defense_industry_needs: "방위 산업의 필요"
 USB_america_defense_industry_needs_desc: "국방에 대한 우리의 요구는 크지 않지만, 균형 잡힌 접근을 생각해야 합니다. 우리가 외국의 적이나 이웃 국가의 공격을 받게 될지는 아무도 알 수 없습니다. 게다가 우리의 입지는 틀에서 벗어난 사고를 하고 새로운 정체성을 확립할 수 있게 해 줍니다. 지금 당장은 자위라는 명분 아래 제한적인 군사화를 하는 것으로 충분합니다."
 USB_america_a_true_balance: "진정한 균형"
 USB_america_a_true_balance_desc: "우리 경제는 호황을 누리고 있고 다양하며, 국민과 정부의 필요도 충족되고 있습니다. 이제는 이 모델을 조율하여, 물자와 인적 자원 및 천연 자원을 더 효율적으로 쓰는 방법을 이해하고 발전시켜야 합니다. 무엇보다 우리는 경제를 \\"고층 건설\\" 방식의 계획으로 이끌기 위한 새로운 경제 모델인 경제 효율 모델, 즉 EEM 계획을 도입할 것입니다."
 USB_america_militarized_economy_plan: "군사화 경제 계획"
 USB_america_militarized_economy_plan_desc: "우리의 상황은 좋게 봐도 위태롭고 나쁘게 보면 순식간에 무너질 수 있습니다. 경제를 혼합 체제로 전환하여 국방을 보장하는 동시에 국민이 필요로 하는 생활 필수품도 공급해야 합니다."
 USB_america_rustic_arms_act: "러스틱 무기법"
 USB_america_rustic_arms_act_desc: "RAA는 러스트 벨트 지역 주들의 방위 산업 기반을 개발하고 확보하기 위한 지출 패키지입니다."
 USB_america_dover_dockyards: "도버 조선소"
 USB_america_dover_dockyards_desc: "세계 무대에서 우리의 무역을 지키려면 민수용과 군수용 해양 산업이 모두 필수적입니다. 350척의 함선이 주는 영광은 없을지 몰라도, 지금은 방어하고 호위하기에 충분한 정도면 족합니다."
 USB_america_sister_armaments: "자매 무기"
 USB_america_sister_armaments_desc: "수줍은 듯한 이름과 달리, 이는 동네 수녀원이 민병대를 꾸리는 것이 아닙니다... 그랬다면 재미있었겠지만 말입니다. 그 대신 이는 자매 무기 회사로 알려진 무기 제조업체에 대한 공동 투자입니다. 두 자매가 창립하여 버지니아 자매 주 두 곳에서만 사실상 운영되는 이 회사의 가족적 결속에 의지하여, 그 가족들과 주, 그리고 국가 전체를 지켜 줄 품질을 생산할 수 있을 것입니다."
 USB_america_federal_firearms: "연방 화기"
 USB_america_federal_firearms_desc: "\\"연방 구역\\", 즉 수도권과 맞닿은 주들은 최악의 경우 방위군에 대한 보급을 보장하기 위해 무기와 장비를 지역에서 최대한 가까이 조달해야 합니다. 따라서 우리 수도의 안보를 보장하려면 버지니아와 메릴랜드의 방위 산업 개발이 필수입니다."
 USB_america_complacency_act: "안주법"
 USB_america_complacency_act_desc: "완곡한 이름과 달리 안주법은 사실 민수 산업 등을 개발하고 분산시켜 국민의 필수적인 필요를 충족시키기 위한 대규모 패키지입니다. 따라서 전쟁이 발발하더라도 국민은 어느 정도 자급자족할 수 있어, 배급제 등을 시행해야 하는 시점을 늦출 수 있습니다."
 USB_america_military_ready_economy: "군사 대비 경제"
 USB_america_military_ready_economy_desc: "일련의 개발 구상이 진행 중이고 민간과 군사 양면에서 상황이 더 안정되어 가는 만큼, 이제 우리의 적응력에 집중할 수 있습니다. 적이 감히 우리에게 선전포고를 생각하더라도 즉시 대응할 수 있도록 현재의 경제 개발을 미세 조정하는 것입니다. 이는 민간인들에게 다소 인기가 없겠지만, 우리가 기꺼이 감수할 희생입니다."
 USB_america_establishing_the_department_of_energy: "에너지부"
 USB_america_establishing_the_department_of_energy_desc: "에너지부(DoE)는 산업부(DoIA)의 한 부서로, 국가의 에너지 수요에 초점을 맞춥니다. 어떻게 생산할 것인지, 새 시설을 어디에 건설할 것인지, 기반시설 유지 보수 등을 다룹니다."
 USB_america_tried_and_tested_development: "검증된 개발"
 USB_america_tried_and_tested_development_desc: "화석연료 산업이라는 오랜 믿을 만한 수단은 여전히 유효합니다. 환경주의자들의 반대가 있겠지만, 저렴하고 효과적인 전력으로 다수를 만족시킬 수 있습니다. 항의가 너무 성가셔지면 재생에너지를 가미해 볼 수도 있을 것입니다."
 USB_america_innovation_station_plan: "혁신 거점 계획"
 USB_america_innovation_station_plan_desc: "에너지 소비와 생산 방식의 다양성은 외국의 간섭으로부터 우리를 지키는 최선의 방법입니다. 따라서 연구개발에 대한 대규모 투자와 다양한 에너지 생산 수단을 갖춘 기반이 시간을 두고 시행될 것입니다."
 USB_america_west_virginian_revival: "웨스트버지니아의 부활"
 USB_america_west_virginian_revival_desc: "화석연료 중심의 발전 확대 계획 덕분에 우리는 웨스트버지니아 광업의 일부와 그 주 경제의 심장부를 간접적으로 되살렸습니다. 의도하지 않은 결과였으나, 웨스트버지니아뿐 아니라 국가 전체가 누리게 될 호황입니다."
 USB_america_the_solar_harness: "태양광 활용"
 USB_america_the_solar_harness_desc: "태양으로 에너지를 생산하는 것은 풍력만큼이나 변동이 클 수 있습니다. 그러나 평균적으로 일조량이 많은 지역에 태양광 패널과 태양광 단지를 전략적으로 배치한다면 장기적으로 더 큰 이익이 될 것입니다. 따라서 세금 감면과 프로그램을 도입하여 국민이 자신의 집에서, 나아가 전력망 전체에 전력을 공급하도록 할 수 있습니다."
 USB_america_oil_and_gas_power: "석유 & 가스 발전"
 USB_america_oil_and_gas_power_desc: "석탄만으로는 한계가 있으므로, 삼박자를 갖추려면 석유와 천연가스 시설을 개발하여 균형 잡힌 에너지 생산 체계를 확보해야 합니다."
 USB_america_the_winds_of_change: "변화의 바람"
 USB_america_the_winds_of_change_desc: "풍력을 태양광과 마찬가지로 다루고 그 약점을 이해한다면, 바람이 가능한 한 꾸준한 지역에 풍력 터빈을 전략적으로 배치할 수 있습니다. 또한 바람뿐 아니라 조류까지 발전에 활용하는 해상 풍력 터빈도 건설할 것입니다. 해변을 찾는 이들에게 아름다운 광경은 아니겠지만, 에너지 자립을 이루려면 감수해야 할 희생입니다."
 USB_america_power_hubs: "전력 거점"
 USB_america_power_hubs_desc: "자원이 풍부하거나 전략적 위치에 있는 \\"전력 거점\\"을 설립하여 더 집중되고 효율적인 발전 단지를 만들 것입니다. 웨스트버지니아와 메릴랜드는 두 조건 중 어느 쪽에도 부합하며, 같은 땅에서 필요할 수 있는 다른 산업의 개발을 해치지도 않습니다."
 USB_america_green_coal_act: "녹색 석탄법"
 USB_america_green_coal_act_desc: "GCA는 일부가 \\"신세대 석탄\\"이라 여기는 것을 완곡하게 표현한 이름입니다. 물론 이는 우라늄과 원자력 전반을 가리킵니다. 이 기술은 풍부한 에너지 생산의 미래나 다름없으므로 제대로 투자하고 개발해야 합니다. 결국 대부분의 SF 매체가 \\"만능 에너지원\\"으로 원자력이나 가상의 물질을 내세우는 이유도 그 잠재력이 있기 때문이며, 우리는 아직 원자력보다 나은 것을 찾지 못했습니다."
 USB_america_department_for_synthetic_development: "합성 연료 개발부"
 USB_america_department_for_synthetic_development_desc: "합성 연료 개발부(DSD)는 에너지부 산하의 연구개발 전담 부서로, 합성 연료의 혁신과 개발을 보장합니다. 여기에는 석탄, 석유, 가스뿐 아니라 플라스틱이나 나일론 같은 일부 석유화학 제품도 포함됩니다."
 USB_america_department_for_energy_innovations: "에너지 혁신부"
 USB_america_department_for_energy_innovations_desc: "에너지 혁신부(DEI)는 에너지부 내에서 에너지 생산과 활용에 관한 혁신을 다루는 연구개발 전담 부서입니다. 우리가 미래라 부르는 것을 사용하려면 그 미래를 앞서 찾아 나서야 합니다."
 USB_america_department_of_logistical_affairs: "물류부"
 USB_america_department_of_logistical_affairs_desc: "교통부와 유사하게, 물류부(DoLA)의 주된 기능은 우리 기반시설의 유지와 유연성 및 적응력을 보장하고, 국가가 필요로 하는 곳에 어디를 확장하고 개발할지 결정하는 것입니다."
 USB_america_northern_highways_act: "북부 고속도로법"
 USB_america_northern_highways_act_desc: "NHA는 주간 고속도로망과 관련된 기존 주요 도로를 개발하여 확장하거나 유지하기 위한 지출 패키지입니다."
 USB_america_re_establishing_the_pennsy: "펜실베이니아 철도 재건"
 USB_america_re_establishing_the_pennsy_desc: "PRR, 즉 '펜시'는 한때 사라진 깃발이 된 철도를 기억하는 이들에게 전성기에 미주리까지 영역을 뻗친 철도였습니다. 그러나 뉴욕 센트럴과 기타 부실 철도와의 강제 합병으로 펜 센트럴이라는 혼란이 빚어졌고, 뒤이은 파산은 피할 수 없었습니다. 이제 새로운 출발과 새로운 생명을 얻은 만큼 펜실베이니아 철도를 재건하고, 세기말 이전의 초대형 합병이나 강제된 몰락을 막도록 유연한 규제를 장려할 것입니다."
 USB_america_southern_highways_act: "남부 고속도로법"
 USB_america_southern_highways_act_desc: "여러분, 앞서와 같습니다. 다만 이번에는 우리 국가 기반시설의 남쪽 절반을 챙기는 것입니다."
 USB_america_re_establishing_the_norfolk_and_western: "노퍽 & 웨스턴 재건"
 USB_america_re_establishing_the_norfolk_and_western_desc: "N&W는 버지니아 두 주와 약간의 추가 영역을 담당하던 수익성 좋은 석탄 철도였습니다. 시대가 변했음에도 이 철도는 전반적으로 시간의 시험을 견뎌 냈습니다. 그러나 1900년대 후반의 초대형 합병과 도로, 항공 등과의 경쟁 심화에 대응하여 N&W는 사실상 합병 상대를 찾을 수밖에 없었습니다. 그 상대는 '남부의 믿음직한 노장'이라 불리던 서던 철도였고, 얼마 지나지 않아 두 옛 깃발은 사라지고 노퍽 서던이라는 새로운 공동의 깃발을 달았습니다. 이제 1급 철도회사들이 거의 사라진 만큼, 진정한 미국의 역사를 되살리고 사라진 깃발을 다시 올릴 때입니다."
 USB_america_the_infrastructure_readiness_act: "기반시설 대비법"
 USB_america_the_infrastructure_readiness_act_desc: "IRA는 아일랜드 이민 법안이 아니라, 기반시설 유지가 곧 국가 안보라고 규정하는 정부의 규제이자 의무입니다. 따라서 국방 다음가는 최우선 과제 중 하나는, 작업이 필요한 지역 주민들에게 지속적이고 부당한 어려움을 주지 않으면서 우리의 기반시설을 최상의 상태로 유지하는 것입니다."
 USB_america_military_debate: "대군사 논쟁"
 USB_america_military_debate_desc: "군대를 갖는 것도 좋지만, 그 군대로 무엇을 할지 아는 것이 더 낫습니다."
 USB_america_the_bulwark_doctrine: "보루 교리"
 USB_america_the_bulwark_doctrine_desc: "적들은 우리가 공격적이고 무모하리라 예상하지만, 우리는 그런 유혹에 넘어가지 않을 것입니다. 진정으로 빠른 전쟁이란 존재하지 않음을 이해하고 방어적인 방식으로 군대를 건설하고 운용해야 합니다. 이를 바탕으로 보루와도 같은 군대를 만들고, 적이 자원을 허비하는 동안 국방을 위한 민군 통합을 통해 소모전에서 승리할 것입니다."
 USB_america_infantry_supremacy_guide: "보병 우위 지침"
 USB_america_infantry_supremacy_guide_desc: "모든 남자에게 소총을, 모든 여자에게 산탄총을. 이것이 육군 군사 훈련 개요인 보병 우위 지침(ISG)의 선언입니다. 현대전의 양상을 고려할 때 우리가 장갑차량 등에도 투자할 것은 물론입니다. 그러나 그런 장비를 갖추더라도 모든 병사를 언제든 보병 인원이 될 수 있다는 전제 아래 훈련시켜야 합니다."
 USB_america_refining_ocs_institutions: "장교 후보생 교육기관 개선"
 USB_america_refining_ocs_institutions_desc: "리더십은 군대가 기능하는 핵심입니다. 이러한 사실에 따라 우리는 군사 학교의 장교단 연구 과정을 전면 개편하여 우리 군의 새로운 방향을 반영하고 적응시킬 것입니다. 방어 교리와 지휘하는 병력 보존에 대한 주도성이 그 핵심입니다. 우리는 함께 버틸 것이며, 지휘관들이 방어하고 그들이 이끄는 병사들도 그러할 것입니다."
 USB_america_streamlining_logistics: "물류 간소화"
 USB_america_streamlining_logistics_desc: "버티려면 병사들에게 계속 보급할 수 있어야 합니다. 따라서 병력에 대한 보급을 확실히 하고 병사들의 사기를 유지하기 위해 물류 우선순위를 간소화해야 합니다."
 USB_america_establishing_the_doctrine: "교리 확립"
 USB_america_establishing_the_doctrine_desc: "육군 발전 계획의 정점은 우리 군의 공식 교리, 곧 보루 교리를 확립하는 것입니다. 우리는 국가와 국민의 방어를 보장할 것입니다."
 USB_america_sky_defenders_program: "하늘 수호자 계획"
 USB_america_sky_defenders_program_desc: "현대 전장의 여왕은 공군입니다. 전투기든 폭격기든 다목적 항공기든, 원칙은 전쟁에서 이기려면 먼저 하늘에서 이겨야 한다는 것입니다. 따라서 우리는 적 폭격기 등이 우리의 방어 능력을 파괴하지 못하도록 영공을 방어하고 지키는 능력을 개선하는 데 방향을 맞춰 발전시킬 것입니다."
 USB_america_fighter_defense_doctrine: "전투기 방어 교리"
 USB_america_fighter_defense_doctrine_desc: "전투기 방어 교리(FDD)는 지역 안보라는 원칙 아래 우리 공군을 조직하는 전담 체계입니다. 우리는 본토를 방어하므로 항공기와 훈련 모두 그러한 특성에 맞춰야 합니다."
 USB_america_agility_training_measures: "기동성 훈련 조치"
 USB_america_agility_training_measures_desc: "우리의 훈련은 공군에 입대한다는 것이 무엇인지에 대한 기대를 구현하는 정해진 기준입니다. 이는 조종사들의 능력을 높이기 위해 평소보다 높은 G 하중에 대한 내성을 기를 수 있도록 훈련 방식을 개선해야 한다는 뜻입니다. 더구나 우리 항공기의 기동성은 조종사가 감당할 수 있는 수준을 넘어서므로, 가장 큰 한계는 인원 자체입니다. 따라서 이를 개선하기 위해 노력할 것이며, 반드시 개선해야 합니다."
 USB_america_aircraft_refinement_programs: "항공기 개량 계획"
 USB_america_aircraft_refinement_programs_desc: "항공기 개량 계획(ARP)은 우리가 달성하고자 하는 역할에 맞추어 항공기를 효율적으로 혁신하고 개발하도록 설정된 전담 생산 활용 계획입니다."
 USB_america_naval_repair_schools: "해군 수리 학교"
 USB_america_naval_repair_schools_desc: "해군 수리 인력뿐 아니라 민간 용접 계약업자까지 고용하면 수리와 개장 과정이 훨씬 원활해질 것입니다. 이는 결과적으로 더 나은 장비를 생산하는 데에도 도움이 되며, 새 수리 학교(NRS)가 통합되면 아무리 복잡한 선박도 수월하게 수리할 수 있게 될 것입니다."
 USB_america_naval_alloy_innovations: "해군 합금 혁신"
 USB_america_naval_alloy_innovations_desc: "해군 합금 혁신(NAI)은 함선 건조의 발전을 전담하는 연구개발 부서입니다. 배수량과 합금 개량 등을 통해 더 낫고 매끄러우며 내구성이 뛰어난 선박을 건조하여, 실제 바다의 다양한 조건에서도 항해할 수 있게 하는 것이 목표입니다."
 USB_america_mining_warfare_refinements: "기뢰전 개선"
 USB_america_mining_warfare_refinements_desc: "기뢰전 개선(MWR) 계획은 우리 해군의 역량을 특화하여 해상 기뢰 부설과 대기뢰전 작전 능력을 적응시키고 다듬는 것입니다."
 USB_america_navy_readiness_training: "해군 대비 훈련"
 USB_america_navy_readiness_training_desc: "해군 인원의 훈련 프로그램과 연대를 강화하여 위협은 물론 잠재적인 오경보에 대한 대응성을 원활하고 높일 것입니다. 오경보조차 잠재적 위협이기 때문입니다."
 USB_america_the_spearhead_doctrine: "창끝 교리"
 USB_america_the_spearhead_doctrine_desc: "우리 군은 창끝과 같아야 하며, 적이 효과적인 방어를 조직하기 전에 가능한 곳에서 찌르고 베고 쓰러뜨릴 수 있어야 합니다."
 USB_america_perpetual_assault_training: "끝없는 돌격 훈련"
 USB_america_perpetual_assault_training_desc: "끝없는 돌격 훈련(PAT)은 우리가 \\"끝없는 돌격\\"이라 부르는 것을 수행할 병사의 지구력을 이해하고 길러 내는 훈련 프로그램입니다. 옛 시절의 대규모 돌격 교리를 개선한 것으로 보면 되며, 신속한 전과 확대와 잠재적 포위를 위해 집중 공격 원칙으로 다듬은 것입니다. 말하자면 대규모 돌격과 각개 격파의 혼합에 가깝습니다."
 USB_america_armored_assault_assist: "기갑 돌격 지원단"
 USB_america_armored_assault_assist_desc: "군의 트리플 A인 이 기갑 부대 개선은, 포위 반격의 위험을 크게 지지 않고도 소규모 적 병력 집단을 돌파하여 격파할 수 있게 해 줄 것입니다."
 USB_america_officer_corp_aggression_training: "장교단 공세 훈련"
 USB_america_officer_corp_aggression_training_desc: "우리가 전진할 수 있는지는 오로지 지휘를 맡은 장교들의 책임에 달려 있습니다. 병사들에게 활력과 결의를 불어넣고, 전진하기 위한 계획과 전술을 이해하며, 우리 군과 육군 전체에 정해 둔 교리를 이해해야 합니다."
 USB_america_material_not_human_loss: "인명이 아닌 물자의 손실"
 USB_america_material_not_human_loss_desc: "우리는 국민의 손실을 감당할 여유가 없습니다. 우리 교리의 방법론과 상관없이 우리는 병사야말로 최고의 자산이라고 믿습니다. 따라서 인력 소모에서 아끼려는 만큼에 상응하는 장비 손실을 감당하도록 물류를 재편해야 합니다."
 USB_america_proactive_air_assaults: "선제 공중 공격"
 USB_america_proactive_air_assaults_desc: "공군의 공세성은 적 항공기가 알아차리기도 전에 격추할 수 있게 해 줄 것입니다. 선제적 훈련을 통해 우리 항공 승무원과 조종사의 대응성과 적응력을 모의하는 것입니다. 요컨대 이들은 주어진 상황과 정보에 대한 신속하고 비판적인 사고를 바탕으로, 상황과 오경보를 가능한 한 가장 빠른 속도와 유연한 접근으로 처리할 수 있어야 합니다."
 USB_america_modern_maneuverability_courses: "현대 기동성 과정"
 USB_america_modern_maneuverability_courses_desc: "스텔스 기술의 부상과 조종사에 대한 요구 증가에 따라, 우리는 평균적으로 위험한 수준의 G 하중이 가해지는 초기동 상황에 대처할 수 있도록 조종사들을 사전에 훈련시키고 적응시켜야 합니다. 비용이 들겠지만 우리가 운용하며 얻게 될 장기적 가능성을 생각하면 그만한 가치가 있습니다."
 USB_america_redesigns_and_field_testing: "재설계 및 야전 시험"
 USB_america_redesigns_and_field_testing_desc: "기존 항공기에 대해 얻을 수 있는 모든 종류의 자료를 이해하면 더 나은 설계를 만들고 훈련 프로그램을 개선할 수 있습니다. 이는 결과적으로 방어 작전과 공격 작전 모두에서 공군의 역량을 높일 것입니다."
 USB_america_air_corps_survivability_program: "항공단 생존성 계획"
 USB_america_air_corps_survivability_program_desc: "생존성 계획(SP)은 가능한 경우 조종사와 장비 모두의 생존성을 보장하는 방법을 혁신하기 위한 계획입니다. 물론 우선순위는 언제나 조종사입니다. 극한 상황을 견뎌 내도록 한 사람을 훈련시키는 데는 금속과 전선 덩어리를 만드는 것보다 더 오랜 시간이 걸린다고 할 수 있기 때문입니다."
 USB_america_rapid_response_protocols: "신속 대응 규약"
 USB_america_rapid_response_protocols_desc: "신속 대응 규약(RRP)은 망망대해에서 \\"야전 수리\\"를 더 확실히 수행할 수 있도록 하는 훈련과 표준 장비의 개정입니다. 항구로 돌아가 확인받는 절차는 여전히 언제나 필요하지만, 제대로만 이루어진다면 수리는 어디까지나 수리라는 것이 현실입니다."
 USB_america_streamlining_port_facilities: "항만 시설 간소화"
 USB_america_streamlining_port_facilities_desc: "해군의 즉응 태세를 보장하려면 함선을 받아들이고 새 함선을 건조할 시설을 간소화하고 현대화하며 준비해야 합니다."
 USB_america_the_new_admiralty: "새로운 해군부"
 USB_america_the_new_admiralty_desc: "함선을 지휘하는 사람들이 아무것도 모른다면 우리의 함선은 아무 의미가 없습니다. 따라서 미래 해군 지휘관의 훈련과 육성을 전면 개편하는 것이 최우선 과제입니다."
 USB_america_hit_and_hit_again: "치고 또 치기"
 USB_america_hit_and_hit_again_desc: "전략적 기동을 통해 적에게 대량의 사격을 퍼부어 적을 혼란에 빠뜨릴 수 있습니다. 적을 정신적으로 지치게 만들 수 있다면, 우리는 한 가지 방식 이상으로 승리를 확보할 수 있습니다."
 USB_america_foreign_policy_debate: "위대한 국가 방향"
 USB_america_foreign_policy_debate_desc: "국가가 안정되고 머리가 맑아졌으며 경제와 민간의 필요도 해결된 지금, 우리 국가를 어떤 위대한 방향으로 이끌고자 하는지 논의하겠습니다."
 USB_america_reclaim_the_mantle_of_destiny: "운명의 망토 탈환"
 USB_america_reclaim_the_mantle_of_destiny_desc: "권력의 공백은 광대하며, 이를 메울 자격이 있는 것은 오직 우리뿐입니다. 우리는 옛 수도를 장악하고 있으며, 우리 영토의 중핵은 옛 공화국의 연방주의 세력입니다. 끈기와 결의와 기량으로 우리의 진정한 운명을 실현하고, 제2 미국 공화국을 선포하기 위해 옛 땅을 되찾을 것입니다."
 USB_america_war_plan_arcadia: "아카디아 전쟁 계획"
 USB_america_war_plan_arcadia_desc: "가장 짧은 전선이자 우리 판단으로 가장 취약한 전선은 북동부입니다. 이를 염두에 두고 다가올 북진에 대비하여 준비하고 계획하며 태세를 갖춰야 합니다."
 USB_america_battle_plan_albany: "올버니 작전 계획"
 USB_america_battle_plan_albany_desc: "뉴욕은 구세계에서 이민 온 이들에게 자유의 땅이었습니다. 이제 이곳은 우리의 망토를 확보하기 위해 반드시 차지해야 할 적수입니다. 허드슨 만에서 캐나다 국경까지 자유의 상징을 확보할 것이니, 승리를 향해 전진하라!"
 USB_america_battle_plan_providence: "프로비던스 작전 계획"
 USB_america_battle_plan_providence_desc: "뉴잉글랜드라는 위대한 북쪽, 북쪽의 숲은 어떤 계획을 고려하든 가장 큰 문제입니다. 그럼에도 우리는 뉴잉글랜드의 더 발달한 지역을 장악할 것이며, 그들의 사기는 분명 무너져 또 하나의 승리가 우리 것이 될 것입니다."
 USB_america_war_plan_mississippi: "미시시피 전쟁 계획"
 USB_america_war_plan_mississippi_desc: "우리는 배의 절반도 띄우지 못하고 있으므로, 주된 목표는 미시시피강 동쪽의 모든 것을 확보하는 것입니다. 이는 최상의 자연 국경이며, 대륙에서 우리가 부상하는 지위도 굳혀 줄 것입니다."
 USB_america_battle_plan_gary: "게리 작전 계획"
 USB_america_battle_plan_gary_desc: "한때 우리의 영토였던 이 땅을 다시 통합하면 오대호는 더욱 위대해질 것입니다. 이점으로는, 우리의 주된 목표가 인디애나주 게리를 점령하는 것인지, 아니면 게리가 이 계획을 세웠는지를 두고 적을 혼란에 빠뜨릴 수 있습니다."
 USB_america_battle_plan_dixie: "딕시 작전 계획"
 USB_america_battle_plan_dixie_desc: "여러분, 딕시랜드로 갑시다. 딕시의 모든 아이들이 언제나 샘 아저씨와 함께 살게 될 것임을 확실히 알게 하겠습니다."
 USB_america_securing_the_new_frontiers: "새 전선 확보"
 USB_america_securing_the_new_frontiers_desc: "태평양을 향한 진군을 이어 가기 전에, 우리가 획득한 영역을 확보하고 장악해야 합니다. 확장에 앞선 단결이 과거를 만든 것이니, 이제 우리는 더 나은 미래를 만들 것입니다."
 USB_america_the_borderlands: "접경 지대"
 USB_america_the_borderlands_desc: "동화 과정은 조율되어야 하며, 따라서 초기 접경 지대가 먼저 우리의 주된 관심사가 되어야 합니다."
 USB_america_uniting_the_arcadians: "아카디아인 통합"
 USB_america_uniting_the_arcadians_desc: "북동부는 수 세기 전 한때 프랑스령 아카디아 식민지 지역의 일부로 알려져 있었습니다. 이곳 사람들은 짙은 영국의 영향과 은은한 프랑스의 영향이 어우러진 매우 독특한 문화를 지니고 있습니다. 따라서 우리는 이를 지우고 이 땅에 단결을 가져오도록 노력할 것입니다."
 USB_america_southern_culture_is_american: "남부 문화는 미국 문화다"
 USB_america_southern_culture_is_american_desc: "피 흘리는 반란을 통한 것은 아니었지만, 우리는 남부를 다시 한번 우리 품으로 되돌리려 하고 있습니다. 두 행정부가 오락가락하며 실패한 정책 대신, 통일되고 합법적인 통합 정책을 시행할 것입니다. 남부와 남부 문화는 곧 미국 문화이며 그렇게 대우받을 것입니다. 남부는 편안한 음식과 스포츠에 대한 열광 같은 것들을 가져다주기 때문입니다. 이러한 것들은 미국적인 것이며 그렇게 인식되고 존중받을 것입니다."
 USB_america_midwestern_unity: "중서부의 단결"
 USB_america_midwestern_unity_desc: "남부와 마찬가지로 중서부는 사냥철로 유명하며, 편안한 음식에 또 다른 색깔을 더하고 스포츠 라이벌 관계도 빼놓을 수 없습니다. 따라서 중서부는 미국이라는 퍼즐의 또 다른 조각일 뿐이며, 그들이 문화적 하위 유형이긴 하나 결국에는 빨강, 하양, 파랑의 피가 흐르는 평범한 미국인임을 분명히 해야 합니다."
 USB_america_cajun_dixie_and_us: "케이전, 딕시, 그리고 우리"
 USB_america_cajun_dixie_and_us_desc: "과거 남부 공화국의 서쪽 절반과 그들의 남부연합 선조들은 독립에 대한 강한 의지를 지니고 있습니다. 문화적 융합의 차이와 미시시피강 부근 혹은 그 동쪽의 더 고립된 지역들은 그들에게 원하는 대로 행동할 더 큰 여력을 줍니다. 그럼에도 우리는 이러한 문화를 동화시키고, 남부 및 중서부의 형제자매들과 공유하는 유사점과 가치를 상기시키기 위해 노력해야 합니다."
 USB_america_war_plan_pacific: "태평양 전쟁 계획"
 USB_america_war_plan_pacific_desc: "이는 시작이자 끝을 위한 준비이기도 합니다. 제2의 명백한 운명, 혹은 일부가 부르기 시작했듯 \\"미국의 성전\\"입니다. 결국 중요한 것은 단결과 의무뿐이며, 미국의 정체성은 다시 한번 굳건해질 것입니다."
 USB_america_battle_plan_alamo: "알라모 작전 계획"
 USB_america_battle_plan_alamo_desc: "새뮤얼 휴스턴은 당대에 그 지역의 정착민들이 고향이라 부를 수 있는 나라를 세우고자 했습니다. 그들은 \\"서부의 나폴레옹\\" 산타 안나에 맞서 사력을 다해 싸웠습니다. 그리고 승리한 뒤 새로운 고향 역시 미국이라 불러 달라고 청원했습니다. 세상 대부분이 우리를 그렇게 믿었던 바로 그 미국인들을 다시 품으로 데려옵시다."
 USB_america_battle_plan_woundedknee: "운디드니 작전 계획"
 USB_america_battle_plan_woundedknee_desc: "커스터는 운디드니 학살에서 악명 높은 마지막 항전을 했습니다. 우리는 커스터처럼 무모하지 않을 것이지만, 공화국의 곡창지대를 확보하고 새로운 이든 오래된 이든 모두가 미국인임을 사람들에게 상기시킬 것입니다."
 USB_america_the_second_utah_war: "제2차 유타 전쟁"
 USB_america_the_second_utah_war_desc: "우리는 거의 태평양에 닿았으나 이제 로키산맥과 \\"모르몬\\"이 앞길을 막고 있습니다. 1850년대에 그랬듯 그들을 굴복시킬 것이며, 우리는 바다에서 빛나는 바다까지 하나가 될 것입니다."
 USB_america_battle_plan_cascadia: "캐스캐디아 작전 계획"
 USB_america_battle_plan_cascadia_desc: "캐스캐디아 운동은 매우 신생 운동이므로, 이들을 재빨리 제거하고 산악에서 발이 묶이지 않도록 선제적으로 진격한다면 확실히 \\"주목받고 싶어 하는 자들\\"에게 그들이 단지 태평양 연안의 미국인일 뿐이라는 현실을 상기시키고 정신 차리게 할 수 있습니다."
 USB_america_battle_plan_angels: "엔젤스 작전 계획"
 USB_america_battle_plan_angels_desc: "캘리포니아는 아메리칸 드림의 고향이자 골드러시 시대 같은 미국사의 중요한 이정표가 있는 곳입니다. 천사들의 도시와 인구가 더 밀집한 남부 해안 중핵부가 우리의 주된 목표가 될 것이며 아마도 가장 쉬운 접근이 될 것입니다. 앞으로 돌격하여 아메리칸 드림의 가장 먼 끝자락까지 되찾읍시다."
 USB_america_west_of_the_mississippi: "미시시피강 서쪽"
 USB_america_west_of_the_mississippi_desc: "위대한 성전, 수개월과 수년에 걸친 계획과 전투 등이 마침내 끝났습니다. 이제 우리는 미시시피강 서쪽 땅의 사람들에게 그들이 미국인이며 언제나 미국인이었음을 심어 주고 가르치고 상기시키고자 합니다."
 USB_america_from_plains_to_rockies: "대평원에서 로키산맥까지"
 USB_america_from_plains_to_rockies_desc: "서쪽으로 갈수록 사람들은 정부로부터 멀어졌다고 느낍니다. 우리 앞의 이 개척의 땅을 평화롭게 재통합할 수 있도록 그들의 기원과 역사, 그리고 유사성에 대한 이해를 상기시킵시다. 또한 이전 많은 분리 독립 운동의 구호가 바로 이 문제였다는 점을 고려하여 수도를 옮기는 방안도 검토해 봅시다."
 USB_america_from_sea_to_shining_sea: "바다에서 빛나는 바다까지"
 USB_america_from_sea_to_shining_sea_desc: "위대한 제2의 명백한 운명이 완수되었으며, 숱한 고난과 시련과 노력 끝에 우리는 태평양 해안에 도달했습니다. 이제 아메리칸 드림이 다시 실현되어, 우리의 미래를 이루는 이들의 눈 속에서 빛날 수 있습니다."
 USB_america_the_great_administration: "대 행정 개편"
 USB_america_the_great_administration_desc: "전국이 하나가 된 지금, 이토록 광대하고 지리적으로 다양한 땅에 절실히 필요한 공무원 제도와 행정 개편을 시작할 수 있습니다."
 USB_america_capital_crisis: "수도 위기"
 USB_america_capital_crisis_desc: "국가의 단결이 공고해진 지금, 우리는 방 안에서 가장 눈에 거슬리는 문제, 곧 연방 수도와 그에 따른 연방 정부의 위치를 살펴보아야 합니다. 제대로 나아가려면 선택지를 검토하고, 새 수도를 어디에 둘 수 있는지, 또 둘 것인지를 파악해야 합니다."
 USB_america_the_proclamation: "대 선포"
 USB_america_the_proclamation_desc: "미국 역사의 이 장을 끝낼 날이 다가왔습니다. 제1공화국은 거의 300년을 이어 가며 사실상 이전의 모든 공화국보다 오래 존속했습니다. 새 공화국의 가장 큰 특징은 건국 문서를 다시 쓰는 것이기 때문입니다. 프랑스가 제7공화국에 이르렀고 그리스가 몇 번째인지 모를 이유도 그것입니다. 그럼에도 이 새로운 공화국과 함께 우리는 새 시대를 열고 우리가 원하는 미래를 찾아 나설 것입니다."
 USB_america_the_great_shutdown: "대고립"
 USB_america_the_great_shutdown_desc: "옛 전망과 꿈은 끝났습니다. 세상은 우리를 실망시켰고 우리도 세상을 실망시켰습니다. 안으로 집중하여 가장 깨뜨리기 어려운 호두가 됩시다. 우리를 산만하게 할 것이 아무것도 없다면, 굳이 밖으로 확장할 필요가 있겠습니까."
 USB_america_self_embargo: "궁극의 금수 조치"
 USB_america_self_embargo_desc: "EP, 일부가 농담 삼아 궁극의 금수 계획이라 부르는 이 조치는 외부 세계와의 무역을 차단하는 것입니다. 우리는 수 세기 동안 없었던 선례를 만들며, 가능한 한 외부의 영향을 받지 않는 방식으로 스스로를 지키고 시민의 삶을 개선하고자 합니다. 이는 경제적 역량에 큰 타격을 주겠지만, 강한 집중력과 결의가 있다면 새로운 길, 곧 우리의 길을 확보할 수 있습니다."
 USB_america_every_citizen_a_job: "모든 시민에게 일자리를"
 USB_america_every_citizen_a_job_desc: "자체 금수 조치를 시행하는 만큼 경제적 안정을 확보해야 합니다. 이를 염두에 두고, 교육과 공공 서비스는 이러한 새로운 도전에 적응해야 하며, 이제는 일할 수 있는 모든 시민이 일자리를 가져야 하고 또 갖게 될 것입니다. 이 근본적인 경제 변화는 혁명적이며 좋게 봐도 불안정할 가능성이 큽니다. 그러나 준비하고 집중하며 제대로 조율한다면 기본적인 생존을 충족하고, 원한다면 다른 나라들이 누리는 사치도 누릴 수 있게 할 수 있습니다."
 USB_america_mandatory_service_period: "의무 복무 기간"
 USB_america_mandatory_service_period_desc: "국가의 즉응 태세를 극대화하려면 시민을 대상으로 한 의무 복무 기간을 도입해야 합니다. 뿐만 아니라 학교에서 학군단(JROTC) 프로그램 같은 것을 장려하고, 사회를 더 군사 친화적으로 적응시켜야 합니다."
 USB_america_ground_defense_is_air_defense: "지상 방어는 곧 대공 방어"
 USB_america_ground_defense_is_air_defense_desc: "GDAD 계획은 연구와 군사 훈련에 대한 일련의 투자로, 지상군이 적의 장기적인 항공 기반 전투 부대를 제대로 방어하고 견뎌 낼 능력을 갖추고 대비하게 하는 것입니다. 현대전은 전장의 여왕이 규정하며 그 여왕은 곧 공군입니다. 우리 국가는 외부 세계와 그리 소통하지 않으므로, 이 여왕을 상대할 적절한 킹메이커를 갖출 방법을 찾아야 합니다."
 USB_america_warfare_beyond_the_grave: "무덤 너머의 전쟁"
 USB_america_warfare_beyond_the_grave_desc: "무덤 전쟁은 4세대 전쟁에 기반한 이 새로운 교리로, <레드 던> 같은 영화를 아이들 장난처럼 보이게 만들 것입니다. 여러분의 저항은 영원합니다. 우리 국가가 영원하기 때문입니다."
 USB_america_the_new_identity_plan: "새로운 전진의 길"
 USB_america_the_new_identity_plan_desc: "옛 땅을 되찾는다고 해서 그 땅이 그대로 우리와 잘 맞을 것처럼 가장할 수는 없습니다. 그렇다고 일본의 쇼군 정권처럼 국가를 닫아걸 수도 없으므로 새로운 길을 개척해야 합니다. 우리의 목표는 새로운 전진의 길, 곧 국민이 자랑스러워할 수 있는 새로운 정체성입니다."
 USB_america_war_plan_gray_coat: "회색 코트 전쟁 계획"
 USB_america_war_plan_gray_coat_desc: "대서양에서 미시시피까지 우리의 운명은 정해졌습니다. 목표를 이루기 위한 우리의 첫 직접 계획은 옛 남부연합 지역입니다. 이곳이 가장 연속적으로 이어져 있으며 우리의 위대한 통합을 확실히 해 줄 것이기 때문입니다."
 USB_america_the_southeast: "남동부"
 USB_america_the_southeast_desc: "근접성과 해안을 따라 이어지는 끊임없는 개발 덕분에, 덜 발달한 주들보다 더 원활한 척도로 표적 투자와 통합 노력을 추진할 수 있습니다. 미래를 향한 디딤돌일 뿐입니다."
 USB_america_the_gulf_states: "걸프 지역 주"
 USB_america_the_gulf_states_desc: "걸프 연안과 그 연안에서 바로 내륙에 접한 주들은 발전과 방치가 뒤섞여 있습니다. 우리는 이 주들이 소외감을 느끼지 않도록 하고, 기반시설에 투자하며 이 주들을 우리의 새로운 전진의 길에 더 잘 통합하고 포용할 방법을 모색할 것입니다."
 USB_america_war_plan_superior: "슈피리어 전쟁 계획"
 USB_america_war_plan_superior_desc: "오대호와 옛 러스트 벨트 주들은 옛 국가의 산업 중심지이자 우리의 새로운 전진의 길입니다. 우리는 남부의 농업적 힘을 우리의 정체성으로 확보했듯이, 산업적 힘 또한 정체성의 일부로 삼을 것입니다."
 USB_america_the_automotive_states_and_some: "자동차 주들과 그 밖의 주"
 USB_america_the_automotive_states_and_some_desc: "한때 미국 자동차 제조업의 중심은 미시간, 오하이오, 인디애나였으며 일리노이도 일정 몫을 가졌습니다. 그러나 우리는 통합을 단계적이고 체계적으로 하고자 하므로 이 세 주와 접경 주인 켄터키만 택했습니다. 이들 주에는 여러 문제가 있으므로, 가능한 모든 수단을 활용하여 고용을 늘리고 당장의 문제를 해결해 위대한 우리 국가라는 새 고향에 더 잘 적응하도록 할 것입니다."
 USB_america_the_northwest_region: "북서부 지역"
 USB_america_the_northwest_region_desc: "이제 캐나다와 직접 국경을 맞대고 미시시피강 너머에서 전개되는 일과 맞닿은 이 주들의 모임은, 사냥과 스포츠 같은 것을 통해 스포츠맨십과 단결을 보여 주기에 훌륭한 곳입니다. 이 오랜 전통을 활용해 이들 주의 주민들이 새로운 현실을 받아들이고 모든 것이 항상 나쁜 것만은 아님을 이해하도록 결집시킬 것입니다."
 USB_america_war_plan_north_atlantic: "북대서양 전쟁 계획"
 USB_america_war_plan_north_atlantic_desc: "새로운 정체성을 위한 마지막 개척지는 대 뉴잉글랜드 지역입니다. 이 주들을 효과적으로 상대하고 되찾으려면 도시전, 산악전, 정글전과 같은 전투에 대비해야 합니다."
 USB_america_liberty_prime: "리버티 프라임"
 USB_america_liberty_prime_desc: "자유의 보루이자 자유의 상징인 자유의 여신상이 있는 뉴욕주는 매우 독특하고 깨뜨리기 어려운 호두입니다. 빈민가와 다문화의 주인 만큼, 우리는 뉴요커가 문화적으로 무엇인지를 배우고 연구하며 이해해야 할 뿐 아니라, 공동의 목표와 미래라는 측면에서 그들과 우리 사이에 진정한 차이가 없음을 알도록 해야 합니다. 그들의 독특함에 호소하고, 결속과 협력을 위해 자치와 관련해 양보를 해 줄 가능성이 큽니다."
 USB_america_new_england_old_habits: "뉴잉글랜드, 오랜 습관"
 USB_america_new_england_old_habits_desc: "뉴잉글랜드 주들이 지닌 문화적 중요성에도 불구하고, 이들은 솔직히 나머지 국가와 다를 바 없습니다. 특정 습관과 국가적 소일거리의 공통점을 보면, 서로 다르더라도 우리는 상당 부분을 공유한다는 점이 분명해집니다. 그러니 이들에게 우리 모두가 동지이자 가족이며, 과거의 실수를 이해하여 더 나은 내일을 만들 수 있음을 상기시킬 때입니다."
 USB_america_the_arcadian_identity: "아카디아의 운명"
 USB_america_the_arcadian_identity_desc: "마침내 때가 왔습니다. 우리는 이 장과 역사의 이 위대한 한 페이지를 끝낼 것입니다. 옛 사상과 이상, 옛날과 과거, 심지어 지난주의 교훈을 가지고 새로운 출발을 향해 돌격합시다. 우리는 날개를 펴고 꿈의 저 먼 곳으로 날아오를 준비가 된 찬란한 나비입니다. 우리는 아카디아입니다."
 USB_arcadia_path_desc: "[USB.GetFlag]§Y아메리카 자유 주§!가 이름을 §Y아카디아§!로 변경합니다"
 USB_formalizing_the_fighting_brigades: "전투 여단 공식화"
 USB_formalizing_the_fighting_brigades_desc: "우리는 아직 정비하는 중이지만 적이 무엇을 할지는 알 수 없습니다. 따라서 신속 대응 주방위군 유형의 부대로서 연방 전투부대를 창설할 것입니다. 아무것도 없는 것보다는 낫기 때문입니다."
 USB_creating_infantry_reserves: "보병 예비대 창설"
 USB_creating_infantry_reserves_desc: "우리 국가는 아직 재건 중이며, 한 발은 문밖으로 내디뎠다 해도 나머지 한 발을 옮기다 넘어질 가능성이 똑같이 큽니다. 따라서 미래가 무엇을 가져오든 대비할 수 있도록 즉응 예비 병력을 창설해야 합니다."
 USB_mobilizing_the_reserves: "예비대 동원"
 USB_mobilizing_the_reserves_desc: "국가의 적극적인 방어를 시작할 때가 왔습니다. 다가올 전투에 대비할 수 있도록 동원을 개시합시다."
 USB_coal_wars_two_event.1.t: "연합 광부들의 이주"
 USB_coal_wars_two_event.1.d: "국가를 정상화하려 애쓰는 사이, 현직이거나 과거에 일했던 많은 광부들이 어떤 이유에서인지 웨스트버지니아 주로 이주하고 있습니다. 옛 UMWA를 재편한 연합광산노동자협회는 정치적 노조 집회에서 조직화하고 모이기 시작했습니다. 현 회장인 세실 로버츠는 아직 우리에게 연락해 오지 않았으나, 돌아가는 상황으로 보아 곧 소식을 듣게 될 것입니다."
 USB_coal_wars_two_event.1.o1: "철새라도 된단 말인가?"
 USB_coal_wars_two_event.2.t: "검은 진주 제안"
 USB_coal_wars_two_event.2.d: "오늘 일찍 새로운 UMWA로부터 마침내 소식이 닿았습니다. 회장은 웨스트버지니아의 여러 탄광을 재개장해 달라고 요청했으며 상당한 청원 기반을 확보했습니다. 이 주에는 약 200억 톤 이상의 석탄 매장량이 있는 것으로 추정되며, 생존을 위해 애쓰는 가정과 기업에 저렴하고 손쉬운 에너지를 공급하는 데 분명 유용할 것입니다. 그러나 우리가 점유한 동부 해안 매장지 상당수는 황 함량이 높아 환경 문제로 탄광이 폐쇄되었습니다. 따라서 문제는 현대적 기준을 유지할 것인가, 빠른 회복을 위해 그 기준을 낮출 것인가 하는 점입니다."
 USB_coal_wars_two_event.2.o1: "검은 진주가 다시 한번 빛난다"
 USB_coal_wars_two_event.2.o2: "기준에는 이유가 있다"
 USB_coal_wars_two_event.3.t: "자금의 흐름"
 USB_coal_wars_two_event.3.d: "협상이 순조롭게 진행되고 마침내 웨스트버지니아로 자금이 향하면서, 이주해 온 광부들은 이미 옛 탄광을 다시 여는 작업에 착수했습니다. 이는 이 주에 새 시대이며, 우리가 경제적으로 국가를 안정시키려는 과정에서 앞으로 큰 자산이 될 것입니다."
 USB_coal_wars_two_event.3.o1: "대단하진 않지만, 정직한 일이다"
 USB_coal_wars_two_event.300.t: "광부들의 결정 항의"
 USB_coal_wars_two_event.300.d: "검은 진주 제안을 기각하는 최근 판결로 인해, 고향을 떠나 안정적인 일자리와 미래의 안정을 얻을 수 있으리라 믿고 이주한 많은 광부들이 시위를 조직하기 시작했습니다. 지역 법 집행기관은 또한 총기 관련 절도와 소규모 폭동이 증가했다고 보고했습니다. 이 주가 불안정해지는 상황에서 우리가 직접 개입할 만한 실질적 입지가 없으므로, 이 비상사태에 대처할 준비를 해야 합니다."
 USB_coal_wars_two_event.300.o1: "무엇을 기대했단 말인가?"
 USB_coal_wars_two_event.301.t: "자유 주?"
 USB_coal_wars_two_event.301.d: "결과에 대한 일말의 고려도 없이 그들이 일을 저질렀습니다. 지역 폭동은 웨스트버지니아 주에 있던 얼마 안 되는 무기와 탄약을 표적으로 삼았고, 일부가 \\"폭민 통치\\"라 부르는 신속한 행동으로 UMWA는 통제권을 장악하고 웨스트버지니아의 독립을 선언했습니다. 우리는 얼마 안 되는 병력을 결집하여 본래 우리 것이던 땅을 되찾기 시작해야 합니다. 대륙의 다른 누군가가 우리의 독립을 갉아먹는 것만큼은 반드시 피해야 합니다."
 USB_coal_wars_two_event.301.o1: "이런 걸 어디서 본 적이 있는데?"
 USB_coal_wars_two_event.302.t: "제2차 석탄 전쟁"
 USB_coal_wars_two_event.302.d: "무기를 들어라, 대지의 형제자매들이여, 무기를 들어라! 오늘로써 눈먼 워싱턴의 도적들이 우리의 운명을 결정하는 일은 끝이다. 우리는 사랑하는 어머니 대지가 우리에게 주는 자원을 채굴하고 사용할 권리를 지키기 위해 일어서서 싸울 것이다. 이 땅을 결집하여 수호하고, 이 검은 진주를 다시 한번 빛나게 하자."
 USB_coal_wars_two_event.302.o1: "무기를 들어라!!!"
 USB_coal_wars_two_event.303.t: "우리의 진군!"
 USB_coal_wars_two_event.303.d: "때가 왔고 우리는 어느 때보다 준비되었습니다. 파커스버그로 진군하여 웨스트버지니아를 다시 한번 확보할 것입니다."
 USB_coal_wars_two_event.303.o1: "전진하라, 제군들!"
 USB_coal_wars_raise_mining_regiments_tt: "웨스트버지니아가 광부 연대 사단 §Y15§!개를 편성합니다."
 USB_america_focus_establishing_a_govt: "정부 수립"
 USB_america_focus_establishing_a_govt_desc: "혼돈이 거리를 집어삼키고 있습니다. 무엇이라도 할 생각이 있다면 민간 정부의 중앙 지휘부부터 확보해야 합니다."
 USB_america_focus_creating_a_police_force: "경찰력 창설"
 USB_america_focus_creating_a_police_force_desc: "민간 정부가 들어선 만큼 민간 치안 부서를 재건해야 합니다. 민정국을 설립하고 계획을 세우는 한편, 전략적 요충지에 경찰서를 세워 일반적인 무질서를 진압할 임시 경찰력을 신속히 갖추도록 하겠습니다."
 USB_america_focus_organizing_the_militias: "민병대 조직"
 USB_america_focus_organizing_the_militias_desc: "떠돌이 갱단들은 여전히 막대하고 지속적인 피해를 일으키고 있습니다. 이 무정부주의자들의 파괴 행위조차 멈추지 못한다면 어떻게 새로운 사회라는 감각을 만들어 낼 수 있겠습니까. 주 방위대와 국가 방위군, 그리고 군의 잔존 병력이 있으니 이 퍼즐을 맞춰 보고 어떤 그림이 나올지, 나온다면 어떤 그림일지 확인해 보겠습니다."
 USB_america_focus_rebuilding_the_economy: "경제 재건"
 USB_america_focus_rebuilding_the_economy_desc: "대단한 일은 아니지만 정직한 일입니다. 솔직히 일자리가 없는 것보다는 어떤 일자리라도 있는 편이 낫습니다."
 USB_america_focus_backyard_battleground: "뒷마당의 전장"
 USB_america_focus_backyard_battleground_desc: "혼란이 대체로 끝나고 수도 지역이 가능한 한 안정된 만큼, 조만간 어디로든 나아가려면 메릴랜드 주를 장악해야 합니다. 주의 통제와 안정을 확보하기 위해 인력, 치안, 경제에 대한 투자를 전면적으로 단행하겠습니다."
 USB_america_focus_from_backyard_to_frontyard: "뒷마당에서 앞마당으로"
 USB_america_focus_from_backyard_to_frontyard_desc: "경제적, 민간 부문의 투자와 함께 이제 법과 질서의 정착이 이루어집니다. 민간 행정과 법을 확립하면 우리의 뒷마당인 메릴랜드 주에 대한 통제를 공고히 할 수 있을 것입니다. 이를 바꾸어 자유주 합중국이라는 새 깃발 아래 국가를 통합하는 본보기가 되는 앞마당으로 만들겠습니다."
 USB_america_focus_the_old_dominion_state: "올드 도미니언 주"
 USB_america_focus_the_old_dominion_state_desc: "어떻게 된 일인지 우리는 올드 도미니언 주인 버지니아를 손아귀에 유지해 왔습니다. 많은 이들이 남부 쪽으로 떠날 것이라 생각했지만, 그들이 스스로를 우리의 일부라고 여긴다면 우리가 무언가 충분히 옳은 일을 했던 것이 틀림없습니다. 그럼에도 그 주는 우리 \\"국가\\"의 나머지가 그렇듯 낡고 무질서합니다. 그러니 국가라는 감각을 되살려 품 안으로 되돌리려면 투자하고 재건해야 합니다."
 USB_america_focus_norfolk_novelty: "노퍽의 새 면모"
 USB_america_focus_norfolk_novelty_desc: "민간 질서와 경제적 안정이 보장된 만큼 올드 도미니언을 새로운 빛 속으로 이끌 수 있습니다. 미래를 위해 우리는 단결하고, 미래를 위해 우리의 권리를 지킬 것이며 지켜야만 합니다. 자유주를 위하여."
 USB_america_focus_black_pearl_state: "검은 진주의 주"
 USB_america_focus_black_pearl_state_desc: "탄광 지대의 잿더미에서 웨스트버지니아가 솟아납니다. 다각화와 현대화에 완전히 실패한 이후 사실상 주 전체가 유령 도시처럼 알려져 있습니다. 황 함량이 높은 석탄이 현대에 쓸모없어지면서 몰락했습니다. 이 주를 더 아끼고 생명을 불어넣어 우리 연합 안에서 살아남게 해야 합니다. 누가 알겠습니까, 언젠가 사람들이 웨스트버지니아를 새로운 산의 어머니라고 부르게 될지도 모릅니다."
 USB_america_focus_parkersburg_perfection: "파커스버그의 완성"
 USB_america_focus_parkersburg_perfection_desc: "석탄은 다시 채굴되고 경제는 다시 안정을 찾았습니다. 웨스트버지니아 주는 새로운 포부를 품고 하늘을 올려다보고 있으며, 이제 우리는 거리를 정비하고 민간 행정을 복구하여 그들을 이끌고 도와야 합니다. 블루리지 산맥은 다시 한번 빛날 것입니다."
 USB_america_focus_the_commonwealth_state: "코먼웰스 주"
 USB_america_focus_the_commonwealth_state_desc: "펜실베이니아는 땅과 사람이 다양한 주입니다. 산업, 철도, 그리고 미국 역사 자체에 풍부한 역사를 지닌 이 코먼웰스의 안정과 경제적 미래를 보장해야 우리 연합이 온전함을 확신할 수 있습니다."
 USB_america_focus_from_rust_to_shine: "녹슨 땅에서 빛나는 땅으로"
 USB_america_focus_from_rust_to_shine_desc: "탈산업 사회의 녹슨 쇠퇴에서 다각화된 디지털 역동성의 빛나는 등대로, 코먼웰스 주는 우리의 새로운 위대한 국가라는 퍼즐의 한 조각이 될 것입니다."
 USB_america_focus_delaware_dilemma: "델라웨어의 딜레마"
 USB_america_focus_delaware_dilemma_desc: "독립 전쟁 때와 마찬가지로 우리는 델라웨어 강을 건너야 합니다. 다만 적을 쓰러뜨리기 위해서가 아니라 벗을 재건하고 맞이하기 위해서입니다."
 USB_america_focus_delaware_delight: "델라웨어의 기쁨"
 USB_america_focus_delaware_delight_desc: "경제적 폐허에서 자랑스러운 부흥의 선두로, 우리는 또 하나의 소중한 주를 사랑이 담긴 품으로 다시 맞이합니다. 더 밝은 미래를 향해 전진하며, 이제 함께하는 동료와의 시간을 기뻐합시다."
 USB_america_focus_the_jersey_jumpstart: "저지의 시동"
 USB_america_focus_the_jersey_jumpstart_desc: "우리 영토에서 가장 먼 주 가운데 하나이면서, 러스트 벨트 가운데 우리 몫의 나머지 절반이기도 합니다. 제대로 방향을 정하고 다시 온전한 국가를 이루려면 이 주를 되살리고 시동을 걸어 주어야 합니다."
 USB_america_focus_the_trenton_turnaround: "트렌턴의 반전"
 USB_america_focus_the_trenton_turnaround_desc: "거리에서는 환호성이 울려 퍼집니다. 트렌턴의 승리가 이곳에 도래했기 때문입니다. 뉴저지 주민들은 우리의 경제적 투자뿐 아니라 민간 행정을 다시 도입하여 세워 갈 민간 질서와 돌봄 덕분에 평화와 새로운 번영을 누릴 것입니다."
 USB_america_focus_the_great_reclamation: "위대한 수복"
 USB_america_focus_the_great_reclamation_desc: "수많은 투자와 신중한 계획, 그리고 진정한 국가적 결의를 통해, 이제 우리는 낡은 세계와 낡은 이상의 족쇄를 진정으로 벗어던지고 자유의 미래를 바라볼 수 있습니다. 이제 우리는 자랑스럽게 말할 수 있습니다. 우리는 자유주입니다."
 USB_america_focus_the_elections_question: "선거 문제"
 USB_america_focus_the_elections_question_desc: "국가가 마침내 진정한 정치 토론이 가능할 만큼 재편된 지금, 우리는 새 국가의 초기에 무엇을 원하는가라는 현실에 직면했습니다. 어떤 이들은 선거를 원하고 어떤 이들은 안정만을 원합니다. 결국 국가의 야망이 어디를 향하는지는 시간만이 말해 줄 것입니다."
 USB_america_focus_ban_elections: "당분간 선거 금지"
 USB_america_focus_ban_elections_desc: "우리는 지금에 집중해야 합니다. 과거를 곱씹는 것도, 우리에게 필요하다는 가상의 미래를 꿈꾸는 것도 그만두어야 합니다. 지금 국가를 운영하기 위해 필요한 것은 안정과 행동이며, 그래야 미래에 대한 걱정은 나중에 할 수 있습니다."
 USB_america_focus_establish_elections: "선거 수립"
 USB_america_focus_establish_elections_desc: "우리는 국가로서 어떤 방향으로 나아갈지 합의에 이르러야 합니다. 이에 따라 새로운 선거가 치러지고 국민이 미래를 선택할 것입니다."
 USB_america_focus_federalist_rightist: "연방주의 우파의 승리"
 USB_america_focus_federalist_rightist_desc: "선거 논쟁이 정리되면서 국민투표에서 연방당이 승리해 당분간 집권당이 되었습니다. 그러나 이는 선거 반대 우파 파벌이 주도권을 확보했다는 현실도 함께 의미합니다. 이들이 이 새로운 희망의 등대를 이끌며 어떤 선택을 내리는지 지켜보겠습니다."
 USB_america_focus_federal_taxes_when_needed_not_wanted: "크리스천 샌즈워스 법"
 USB_america_focus_federal_taxes_when_needed_not_wanted_desc: "크리스천 샌즈워스 법은 사회를 위한 세법을 만들고 개혁하는 방식을 새롭게 바라보는 법입니다. 세법의 일부를 바꾸거나 개혁하기 위한 특별 회기는 대통령이나 양원의 대표 지도자 중 누구든 소집할 수 있습니다. 이 회기는 세법 내의 하나의 핵심 주제에 집중하여 이를 변경 또는 개혁하는 안건에 표결하거나 안건을 기각하는 표결을 합니다. 지금의 핵심 원칙은 입법부와 국민이 원하는 바가 아니라 필요한 바에 기반해 세법을 만들고자 한다는 것입니다. 우리가 원하는 대로가 아니라, 지금 국가와 사회에 무엇이 필요한가를 따져야 합니다."
 USB_america_focus_federal_many_hands_act: "근면 노동자 법"
 USB_america_focus_federal_many_hands_act_desc: "HWA는 경제 성장과 고용에 시동을 걸기 위한 일련의 개혁입니다. 우리는 아직 이른바 석기 시대에 있지만, 그럼에도 정제된 사회로 가는 길에 시동을 거는 일에 매진할 수 있습니다. 우리의 비효율은 검증되고 믿음직한 노동자들이 메워 줄 것입니다. 낡은 것에서 새것을 만들어야 한다는 필요를 이해하는 우리의 입법 개혁은 일터를 통해 새로운 형태의 애국심을 심고자 합니다. 지금 열심히 일하여 나중에 더 열심히 즐기도록 합시다."
 USB_america_focus_federal_societal_progress_act: "사회 진보법"
 USB_america_focus_federal_societal_progress_act_desc: "SPA는 사회의 변화를 정치적 문제가 아닌 국민의 문제로 만들고자 합니다. 주와 지방은 시민 질서와 합법적 행위의 지속을 강제할 수 있는 법을 제정하고 개혁하고 만들 수 있습니다. 다만 특정 집단에 차별적이거나 불공정하다고 간주될 수 있는 법은 주 법원에 항소할 수 있고, 필요하다면 연방 법원에도 항소할 수 있습니다. 재판 사례는 대중의 인식을 위해 폭넓게 기록되며, 소외를 낳는 사안에 대해 최대한 많은 정보를 알려 필요할 경우 유리한 판결을 얻을 뿐 아니라, 지역과 주의 시민들이 문제를 더 잘 이해하고 가능한 한 많은 이에게 더 나은 방식으로 나아갈 수 있도록 하겠습니다."
 USB_america_focus_federal_liberty_businesses_act: "자유 기업법"
 USB_america_focus_federal_liberty_businesses_act_desc: "구질서는 사업 규정이 지나치게 엄격했습니다. 눈에 띄는 속도로 재건하려면 앞장서려는 이들이 그럴 수 있는 수단과 능력을 갖추도록 해야 합니다. 이에 따라 이 법안은 정부 지원 프로그램을 마련하는 한편, 규제를 인간에 대한 돌봄과 현대 사회의 기대라는 기본 사항으로만 제한합니다."
 USB_america_focus_federal_clear_minds_act: "맑은 정신법"
 USB_america_focus_federal_clear_minds_act_desc: "CMA는 정부가 가능한 한 원활하게 운영되도록 하는 반부패 업무 독립 위원회가 될 것입니다. 많은 이들은 새 정부가 옛 정부와 똑같을 것이라는 우려를 해소하는 방법으로 이를 봅니다. 그럼에도 새 시대가 왔으니 힘차게 출발해 봅시다."
 USB_america_focus_federal_the_liming_act: "라이밍 법"
 USB_america_focus_federal_the_liming_act_desc: "라이밍 법은 독일 정부가 예산을 편성하는 방식인 부채 제동 법제를 변형한 것이며, 우리는 이를 한 단계 더 밀어붙입니다. 양적 완화 정책은 해당 회계 분기의 현재 GDP 수치의 5% 한도 내에서만 시행할 수 있습니다. 모든 양적 완화 프로그램은 다섯 가지를 넘지 않는 뚜렷한 항목만을 다루는 법안이나 입법에 투입되어야 합니다. 즉, 할당할 대상이 백 가지나 되는 법안인데 실제로 배정할 수 있는 돈은 가령 50달러뿐인 법안은 만들 수 없다는 뜻입니다."
 USB_america_focus_federal_industrial_standards_act: "산업 표준법"
 USB_america_focus_federal_industrial_standards_act_desc: "ISA는 경제 발전과 우리가 세우려는 기업 및 산업에 대해 우리가 출발점으로 삼아야 할 새롭고 현대적인 기준을 만들고자 합니다. 세계와 경쟁하는 것은 하나의 일이고, 스스로를 실제로 돌보며 자신과 경쟁하는 것은 또 다른 일입니다."
 USB_america_focus_federal_remechanization_act: "재기계화법"
 USB_america_focus_federal_remechanization_act_desc: "인구가 줄고 있음에도 우리 인구는 여전히 방대합니다. 현대적 기계화와 자동화 분야에서 다시 정상에 오른다면 우리 인구를 위해 훨씬 많은 일을 할 수 있습니다. 미래는 진정으로 지금이며, 우리는 우리만이 아니라 우리가 섬기는 국민을 위해 이 미래를 붙잡아야 합니다."
 USB_america_focus_federal_scraping_up_defense_industries: "방위 산업 긁어모으기"
 USB_america_focus_federal_scraping_up_defense_industries_desc: "예전만큼 강하지는 않지만 어디서든 시작해야 합니다. 방위 산업의 잔재를 모두 끌어모으면 우리에게 남은 군대가 무엇이든 최소한 어느 정도는 보급할 수 있을 것입니다."
 USB_america_focus_federal_reset_act: "리셋 법"
 USB_america_focus_federal_reset_act_desc: "국가가 가동을 멈추고 사실상 유아 상태로 초기화된 만큼 전력망을 새롭게 시작할 방법을 찾아야 합니다. 구 체계는 번거롭고 한심할 정도로 낡았으며 공격에 고통스러울 만큼 취약했습니다. 리셋 법은 새 전력망을 계획하고, 건설하고, 보호하는 새로운 기준선을 만들고, 국가의 필요가 생길 때 이를 확장할 수 있는 능력도 확보할 것입니다."
 USB_america_focus_federal_appalachian_act: "애팔래치아 법"
 USB_america_focus_federal_appalachian_act_desc: "애팔래치아 법은 다행히 아직 우리가 쥐고 있는 땅의 자원을 되살려 정상 궤도에 올리기 위한 정부 투자 계획입니다. 우리는 애팔래치아 산맥의 상당 부분을 보유하고 있으므로, 광물과 광석을 파악하고 조사하여 채굴해 국가가 번영하고 한때 잃은 것을 다시 이루려 분투해야 합니다."
 USB_america_focus_military_distinctions_act: "군 차별화법"
 USB_america_focus_military_distinctions_act_desc: "MDA는 자유주의 군대에 직접 자금을 대고, 표준화하고, 고유한 정체성을 부여하기 위한 초기 투자 법안입니다. 훈련, 계획, 조직의 이러한 새로운 기준과 더불어 군수 산업력의 표준화를 어느 정도 시작함으로써, 가까운 장래에 침공을 받더라도 적어도 우리의 집은 지킬 수 있게 될 것입니다."
 USB_america_focus_naval_distinctions_act: "해군 차별화법"
 USB_america_focus_naval_distinctions_act_desc: "MDA에 이어 NDA는 분열 이전 시대부터 남아 있는 함선, 군 복무자, 시설을 되살리고자 합니다. 시작으로서는 대단하지 않지만, 성장하는 산업과 안정을 되찾는 국가가 있으니 분명 그곳에 도달할 것입니다."
 USB_america_focus_national_pride_initiative: "자유주의 날"
 USB_america_focus_national_pride_initiative_desc: "국가 자긍심 구상은 자유주의 날이라 불릴 국경일로, 은행 휴일이자 일반 국경일이며 필수 업무를 제외한 모든 이가 쉬게 됩니다. 필수 업무에 한해 이날에는 4시간 교대로만 근무할 수 있습니다. 취지는 우리가 국가로서 이룬 진보를 기념하고 국민에게 보답하는 것입니다. 사실상 가능하고 그럴듯한 한 최대한 많은 국민에게 전용 휴일을 주는 것이 의무입니다."
 USB_socialist_statist_victory: "자유사회당 국가주의파의 승리"
 USB_socialist_statist_victory_desc: "국민투표의 결론은 자유사회당의 승리이며, 그중에서도 국가주의 성향 파벌의 승리입니다. 이 파벌은 \\"아나키스트\\" 상대 파벌과 달리 더 강한 중앙 권위와 국가 단결에 집중합니다. 그럼에도 이 이른바 붉은 새벽이 무엇을 내놓을지 지켜보며, 이 새로운 위대한 국가의 시민들에게 더 밝은 미래가 기다리기를 바랍니다."
 USB_socialist_statist_socialized_industry: "사회화된 산업"
 USB_socialist_statist_socialized_industry_desc: "국민은 길을 잃었으므로 우리는 고용과 산업 성장을 후원하고 보장해야 합니다. 이렇게 하면 경제 상황을 더 직접적으로 파악할 수 있을 뿐 아니라 우리 프로그램이 국민에게 미치는 영향도 알 수 있어, 그들을 더 잘 돕도록 조정할 수 있습니다."
 USB_socialist_statist_reformed_welfare_state: "개혁된 복지 국가"
 USB_socialist_statist_reformed_welfare_state_desc: "복지 국가는 부모와 같습니다. 쓰러졌을 때 도와주고 스스로를 나아지게 하도록 이끄는 존재입니다. 옛 복지 국가는 사람들을 받아 주는 데에만 치중했지만, 우리의 개혁된 복지는 받아 줄 뿐 아니라 다시 일으켜 세워 삶의 여정으로 돌려보낼 것입니다. 재원을 조정하고 재통합 프로그램을 우선시함으로써 우리 프로그램이 스스로 비용을 충당하도록 하겠습니다."
 USB_socialist_statist_socialized_education: "사회화된 교육"
 USB_socialist_statist_socialized_education_desc: "통일된 공교육입니다. 이것이 우리가 국민을 끌어올리기 위해 세울 표준이자 토대이며, 우리가 기준을 만들 뿐 아니라 깨고 끌어올릴 수도 있음을 보여 줄 것입니다."
 USB_socialist_statist_the_peoples_army: "인민군"
 USB_socialist_statist_the_peoples_army_desc: "우리는 우리의 사상과 이상을 두려워하는 국가들에 둘러싸여 있습니다. 역사를 괴롭히고 이 경제 모델에 낙인을 찍은 권위주의적 사회주의의 유령에 시달리는 가운데, 우리는 국민과 집, 그리고 우리를 자랑스럽고 강한 국가로 만드는 바로 그 이상을 지켜 내야 합니다."
 USB_socialist_statist_tax_brackets_act: "세율 구간법"
 USB_socialist_statist_tax_brackets_act_desc: "TBA는 누진 세법이 무엇인지에 대한 현대적 표준을 정비하고 확립하는 포괄적 입법입니다. 세율 구간의 기본은 이제 16개의 구간이 있고 금액 범위의 차이가 균일하며 세율 증가가 더 매끄럽고 문자 그대로 누진적이라는 것입니다. 마지막 구간이자 물론 가장 높은 구간은 250,015달러를 초과하는 소득에 40%를 과세하는 것입니다. 가파르게 들릴 수 있지만, 평균적인 사람의 소득이 세금으로 징수되는 실제 비례 가치의 차이를 살펴보아야 합니다. 이 때문에 진정한 평등과 우리 경제 발전에 대한 사회적 기여의 공유를 보장하고, 학교와 응급 서비스 등이 제대로 돌봄과 재정 지원을 받도록 하기 위해 이토록 매끄러운 세법이 필요합니다."
 USB_socialist_statist_millennium_labor_reforms_act: "밀레니엄 노동 개혁법"
 USB_socialist_statist_millennium_labor_reforms_act_desc: "MLRA는 노동 관계와 법이 제정되는 방식을 근본적으로 바꿀 것입니다. 입법부가 공식적으로 법안을 통과시키고 서명하지만, 노조와 기업 관계 합동 위원회가 설립되어 기존 노조와 상응하는 산업 지도부 사이에 동등한 대표성을 갖게 됩니다. 이 위원회는 노동자의 삶을 개선할 뿐 아니라 노동자의 필요를 적절한 경제적 뒷받침과 균형 맞추기 위해 불만과 의견을 한데 모아 협력합니다. 결국 반쪽짜리 타협은 진정한 타협이 아닙니다."
 USB_socialist_statist_modern_geology_act: "현대 지질법"
 USB_socialist_statist_modern_geology_act_desc: "현대 지질법은 원자재 산업을 키우고 경제의 기반선을 끌어올리기 위한 정부 투자 계획입니다. 목표를 둔 연구와 지질 조사를 통해 새 광산과 통제되는 임업 산업을 세워, 현대 경제를 만들 수 있는 원자재 잉여를 확보하겠습니다."
 USB_socialist_statist_modern_marxism: "현대 마르크스주의"
 USB_socialist_statist_modern_marxism_desc: "새천년에 기술은 민간, 군사, 그리고 온갖 경제 부문과 삶의 영역에 있는 이들에게 으뜸가는 필수품입니다. 따라서 우리는 경제의 일정 부분을 기술 부문과 혁신에 전념하도록 해야 합니다."
 USB_socialist_statist_national_security_act: "국가 안보법"
 USB_socialist_statist_national_security_act_desc: "국가 안보법은 국가와 시민의 안보와 안전을 보장하기 위한 입법입니다. 내부 안보국이라는 연방 기관이 지방 법 집행 기관을 위한 훈련, 규제, 연방 자금 배분을 조율하고 지원합니다. 국가와 그 이상의 건전성과 안전을 보장하는 데 필요한 것은 통일성과 기준입니다."
 USB_socialist_statist_manufacturing_investments: "제조업 투자"
 USB_socialist_statist_manufacturing_investments_desc: "국내 제조업이 거의 없다시피 하므로, 성장하고 목표를 바라보려면 경제의 이 핵심 부문을 육성하는 데 투자해야 합니다."
 USB_socialist_statist_department_of_anticorruption_affairs: "반부패 업무부"
 USB_socialist_statist_department_of_anticorruption_affairs_desc: "DACA는 반부패 수사와 정부 전반에 대한 감사를 수행할 수 있도록 독립적으로 설립되고 연방이 승인한 기관입니다. 이 부서는 법적으로 연방의 승인을 받았지만 실제로는 연방 정부의 일부가 아니며 정부에 대한 실질적 통제권도 없습니다. 이러한 분리는 정부 감사를 수행하는 효과를 극대화하고 시민과 미래 행정부에 최선의 투명성을 보장하게 해 줍니다. 과거를 되풀이하지 않도록 노력합시다."
 USB_socialist_statist_modern_agrarian_reforms: "현대 농업 개혁"
 USB_socialist_statist_modern_agrarian_reforms_desc: "세계는 식량을 필요로 하며, 그것이 우리 국민이든 덜 유복한 지역이나 국가의 사람들이든 마찬가지입니다. 따라서 우리는 국내 수요에 더 잘 맞도록, 나아가 세계의 사람들까지 도울 수 있도록 농업을 다듬고 혁신해야 합니다. 이러한 성장과 의존은 바이오 연료 프로그램을 통해 연료 다변화를 실험하고 확대할 수 있게도 해 줄 것입니다. 에탄올은 연료 세계에서 늘 찬밥 신세였으니, 더 나은 모습이 되도록 보살피고 사랑을 주지 않을 이유가 없습니다."
 USB_socialist_statist_coastal_security_act: "해안 안보법"
 USB_socialist_statist_coastal_security_act_desc: "해안 안보법은 아직 우리 통제 아래에 있는 해군 인력과 해군 함정을 재건하거나, 적어도 다시 가동시키기 위한 제한적 투자입니다. 큰 규모는 아니지만, 이제는 대륙 하나만큼의 해안선을 걱정할 필요가 없다는 점을 고려하면 시작으로는 충분합니다."
 USB_socialist_statist_energy_conservations_act: "에너지 보전법"
 USB_socialist_statist_energy_conservations_act_desc: "입법부는 최근 에너지 전문 연구개발 프로젝트에 투자하고 전력망을 더 효율적으로 정비하고 확충하기 위한 법안을 제안했습니다. 결국 국가의 필요를 위한 에너지를 더 많이 생산할 뿐 아니라, 이처럼 커지는 수요를 효율적으로 활용할 수 있기를 바랍니다. 다시 말해 수요가 커지는 동안에도 수요를 줄이는 일종의 균형입니다."
 USB_mid_atlantic_isolationist_victory: "중부 대서양 고립주의 파벌의 승리"
 USB_mid_atlantic_isolationist_victory_desc: "MAP, 즉 중부 대서양당이 국민투표에서 승리를 거머쥐었습니다. 이 파벌은 확장이라는 발상을 인적, 자연적 자원의 무의미한 낭비로 보는 강력한 고립주의 파벌입니다. 옛 공화국이 무너진 것에 그들이 신경이나 쓰는지 궁금해하는 이들도 많지만, 대다수는 그저 투쟁에 지쳐 일상으로 돌아갔습니다. 지금은 평화가 이해되고 번영이 목표입니다. 중부 대서양 합중국에 영광을."
 USB_mid_atlantic_self_determination_act: "자기 결정법"
 USB_mid_atlantic_self_determination_act_desc: "SDA는 우리 국가의 기풍을 굳히는 데 도움이 될 법안입니다. 우리는 세계의 사람들과 함께 살고, 번영하고, 협력하기를 바랍니다. 옛 시절이 그립지만, 삶이라는 큰 게임에서 정말로 어딘가에 도달하려면 새로운 아침과 전망을 바라보아야 합니다."
 USB_mid_atlantic_raw_materials_act: "원자재법"
 USB_mid_atlantic_raw_materials_act_desc: "정부는 원자재 및 1차 자원 산업을 키우고 떠받치기 위한 투자 계획을 최근 통과시켰습니다. 쌓아 올리려면 그 위에 쌓을 토대가 있어야 하며, 이 토대는 1차 자원 부문과 제조 역량을 키우는 데 필요한 자재를 확보할 능력으로 규정될 것입니다."
 USB_mid_atlantic_dedicated_automation_investments: "자동화 전담 투자"
 USB_mid_atlantic_dedicated_automation_investments_desc: "경제를 현대로 반등시키려면 우리의 제조업이 지역 강국들과 경쟁할 수 있도록 자동화에 대한 전담 투자를 모색해야 합니다."
 USB_mid_atlantic_atlantic_education_initiative: "대서양 교육 구상"
 USB_mid_atlantic_atlantic_education_initiative_desc: "AEI는 우리 교육 체계의 가르치는 능력을 키우고 시민이 평생 갖추게 될 지식의 수준을 높이기 위한 교육 재정 법안입니다."
 USB_mid_atlantic_atlantic_care_act: "대서양 의료법"
 USB_mid_atlantic_atlantic_care_act_desc: "대서양 의료법은 일반 인구에게 제공되는 의료의 수용 능력과 기준을 표준화하고 높이기 위한 의료 개선 예산입니다. 공공 및 민간 선택지가 모두 제공되며, 행정의 비대화 문제로 이어지는 경향을 줄이도록 규제를 통일합니다. 이제 사람들은 자신의 돈이 행정가와 서류 처리 담당자만이 아니라 자신의 치료에 쓰인다는 것을 알 수 있습니다."
 USB_mid_atlantic_department_for_transparency: "투명 행정부"
 USB_mid_atlantic_department_for_transparency_desc: "DoTA는 정부 지도자로서의 직무와 책임을 수행하는 데 있어 부패와 전반적인 비위를 정부에 대해 조사할 수 있는 독립 정부 기관이 될 것입니다."
 USB_mid_atlantic_tech_development_grants: "기술 개발 보조금"
 USB_mid_atlantic_tech_development_grants_desc: "새천년은 새로운 산업을 가져왔고, 떠오르는 스타는 기술 부문입니다. 기술 부문은 모든 현대 경제의 필수적인 성장 거점이며 우리도 이를 갖추어야 합니다. 따라서 새로운 기술 부문 기업을 세우려는 벤처에 개발 보조금이 지급되어, 경제를 끌어올릴 뿐 아니라 계속 성장하는 상품과 서비스의 혁신에 사회가 통합되도록 하겠습니다."
 USB_mid_atlantic_blue_ridge_act: "블루리지 법"
 USB_mid_atlantic_blue_ridge_act_desc: "간단히 말해 자원입니다. 이 반구의 진정한 새로운 기둥이 되려면 더 많은 국내 공급을 확보해야 합니다."
 USB_mid_atlantic_naval_securities_act: "해군 안전보장법"
 USB_mid_atlantic_naval_securities_act_desc: "우리는 이제 작은 나라이므로 국가 주권의 안전을 보장하기 위해 연안 해역의 방어를 확보해야 합니다."
 USB_mid_atlantic_guardian_angels_act: "수호천사법"
 USB_mid_atlantic_guardian_angels_act_desc: "오늘날 전장의 여왕은 공군입니다. 이 새 시대에 자유롭고 독립된 국가로 존재할 능력을 보장하려면 이 핵심적 인식에 투자해야 합니다."
 USB_mid_atlantic_prospectors_initiative: "개척자 구상"
 USB_mid_atlantic_prospectors_initiative_desc: "자급자족... 현대는 자급자족이라는 말을 낙후된 것으로 외면하고 꾸짖습니다. 그 핵심 원칙인 고립은 그렇다 하더라도, 건전한 국가란 스스로 자립할 수 있는 국가라는 것이 현실입니다. 따라서 우리는 개척자 구상이라는 새로운 홈스테드 법을 만들고 있습니다. 자원 채굴에 관한 규정을 통해, 최대 5에이커의 땅에 정착할 의사가 있는 가족이나 개인은 그 땅에 매장된 천연자원을 국가 경제에 기여하는 대가로 그 땅을 소유할 수 있습니다."
 USB_mid_atlantic_planned_policing_program: "계획 치안 프로그램"
 USB_mid_atlantic_planned_policing_program_desc: "PPP는 국가 경찰력에 대한 대중의 이해와 가치를 북돋우기 위한 연방과 지방의 합동 구상입니다. 지역 사회 접촉 프로그램과 대회 등이 개최되고 계획되어 시민과 경찰이 서로를 더 잘 이해하고 진심으로 존중하도록 합니다. 요컨대 법을 집행한다는 것이 무엇인지, 그리고 준법 시민이 된다는 것이 무엇인지에 대한 때로 심하게 오해받는 본질을 다루는 것입니다. 분열이 아닌 통합."
 USB_mid_atlantic_energy_advancements_act: "에너지 진보법"
 USB_mid_atlantic_energy_advancements_act_desc: "에너지 진보법은 복합적인 지출 패키지입니다. 에너지 생산과 소비에 대한 연구 보조금, 전력망 현대화 투자, 그리고 앞으로의 에너지 수요에 대처하며 나아가는 방식에 새로운 기준을 세우는 규제를 포함합니다."
 USB_mid_atlantic_the_true_green_way: "진정한 녹색의 길"
 USB_mid_atlantic_the_true_green_way_desc: "원자력은 물론 태양 자체를 활용하는 것 다음으로 에너지 대량 생산의 미래입니다. 그러나 원자력은 정치 세계에서 늘 위태로운 주제입니다. 공포를 부추기는 이들은 과거의 실수에 매달려 모든 뉘앙스를 깎아내립니다. 원자력 강경론자들은 에너지 이점을 자랑하면서 계획과 군사화의 잠재적 부작용 같은 뉘앙스를 잊습니다. 그럼에도 우리는 원자력 발전에 핵심 투자를 하며 나아갑니다. 최선의 길은 과거에 갇히거나 현재에 안주하지 않는 것임을 세계에 보여 주어야 합니다."
 USB_nsp_militarist_faction_victory: "국민봉사당, 승리를 군사화하다"
 USB_nsp_militarist_faction_victory_desc: "투표 결과가 나왔고 NSP, 즉 국민봉사당이 선두에 올랐습니다. 그러나 많은 이들이 이런 합의에 만족하지 않았고, NSP의 군국주의 파벌은 이를 당내 투쟁에서 승리하는 계기로 삼았습니다. 이제 NSP의 지도부는 이른바 \\"승리의 군사화\\"를 내세우며, 군대와 복무하는 이들, 그리고 안보라는 발상 자체가 국민이 투표로 선택한 승리라고 합니다. 이런 메시지가 공포 조장으로 보일 수 있다고 우려하는 이들도 있지만, 다른 이들은 앞으로 나아가 한때 잃은 것을 재건하길 바랄 뿐입니다. 어디 한번 지켜보자가 암묵적인 구호가 되었습니다."
 USB_nsp_meritocracy_act: "능력주의 법"
 USB_nsp_meritocracy_act_desc: "능력주의 법, 혹은 일부가 능력법이라 부르는 이 법은 연방, 주, 지방을 막론하고 정부 지도직을 추구하는 개인의 임명 및 검증 절차를 개혁하고 전면 개편하는 포괄적 입법입니다. 개인적 신념, 경력, 그리고 해당 직무 분야에서 입증된 성과와 행적에 대한 광범위한 신원 조사에 중점을 둔 이 절차는 정부와 행정에 대한 진정한 기술 관료적 접근을 위한 길을 닦아 줄 것입니다. 심사 부서는 심사 대상자와 직간접적 연관이 없는 사람들로 구성된 독립 위원회로서, 심사의 투명성과 공정성을 가능한 최고 수준으로 유지합니다."
 USB_nsp_industrial_investments: "산업 투자"
 USB_nsp_industrial_investments_desc: "국내 안보를 확보하는 데에는 강한 민간 경제가 강한 군사 경제만큼이나 좋습니다."
 USB_nsp_military_investments: "군사 투자"
 USB_nsp_military_investments_desc: "이웃 중 누군가가 엉뚱한 생각을 품고 우리를 굴복시키려 할 때를 대비해야 합니다. 따라서 군사 경제와 군의 대비 태세에 시동을 걸기 위한 일련의 제한적 투자가 이미 한참 늦었습니다."
 USB_nsp_maritime_investments: "해양 투자"
 USB_nsp_maritime_investments_desc: "우리의 해안은 넓어 방어해야 하지만, 한편으로 이 초기 투자는 무역과 우리의 대의에 대한 인지도 확산이라는 측면에서 민간 경제를 끌어올릴 것입니다."
 USB_nsp_the_national_arteries_act: "국가 동맥법"
 USB_nsp_the_national_arteries_act_desc: "NAA는 사실상 무너져 가는 국가 인프라를 되살리고 갱신하기 위한 대규모 인프라 투자 계획입니다. 국민은 물론 경제와 군의 대비 태세를 위기 관리 기준의 최전선에 연결하려면 처리 능력의 기준을 세워야 하며, 우리는 그 기준에서 새로운 기록을 세울 것입니다."
 USB_nsp_department_of_internal_investigation: "내부 조사부"
 USB_nsp_department_of_internal_investigation_desc: "DII는 우리 능력주의의 안정과 강인함을 보장하기 위한 반부패 전담 기관입니다. 국가의 존속과 안정을 확보하려면 군과 민간 직무 모두에서 사심 없는 봉사의 기풍을 만들어야 합니다."
 USB_nsp_national_high_command: "국가 최고사령부"
 USB_nsp_national_high_command_desc: "사회의 민간 부문과 군사 부문이 이토록 다르므로, 우리는 현실의 이 분열을 더 잘 통합하고 온전하게 만드는 법을 배워야 합니다. 따라서 수도권 지역의 국가 안보에 대한 투자와 함께 국가 지도부 구조의 새로운 개편이 시행될 것입니다. 우리의 총사령관은 이제 사회 원수라는 통합 칭호를 갖게 되며, 간단히 원수로 줄여 부르는 이 칭호는 민간 업무와 군사 업무가 우리의 아름답고 작은 국가의 결속과 생존을 위한 하나의 통합된 기반일 뿐이라는 인식을 하나로 모을 것입니다."
 USB_nsp_mini_steel_belt: "미니 철강 지대"
 USB_nsp_mini_steel_belt_desc: "국내 우선을 최우선 과제로 삼는 만큼 현대 건설과 제조업 지원의 초석을 확보해야 합니다. 미니 철강 지대 투자 계획은 웨스트버지니아와 펜실베이니아에 폭넓게 투자하여 우리에게 남은 얼마 안 되는 \\"러스트 벨트\\"를 정비하고 되살릴 것입니다."
 USB_nsp_militarizing_society: "사회의 군사화"
 USB_nsp_militarizing_society_desc: "볼테르는 프로이센이 군대를 가진 국가가 아니라 국가를 가진 군대라고 말한 바 있습니다. 우리는 이것이 현실 그 자체가 되어야 한다고 말합니다. 어떤 사회도 군대를 필요로 하지 않지만 군대 또한 진정으로 사회를 필요로 하지 않습니다. 이를 염두에 두고 우리는 군대와 사회 자체를 완전한 결속으로 통합해야 합니다. 노동 윤리, 교육, 기술의 발전, 그리고 통치까지 군대 자체인 것처럼 조직될 수 있고 조직될 것입니다. 능력주의의 모든 장점과, 자신과 사회 전체를 더 낫게 만들려는 노력을 장려하는 것입니다."
 USB_nsp_energy_investments: "에너지 투자"
 USB_nsp_energy_investments_desc: "경제를 동원하고 군대를 재건하는 지금, 국민뿐 아니라 군대의 에너지 수요도 충족하도록 하는 것이 우리의 최선의 이익입니다. 당장 해결되지는 않겠지만, 이 투자와 연구 보조금은 에너지 생산뿐 아니라 에너지 소비에 대해서도 효율적인 새 방법을 더 잘 개발하게 해 줄 것입니다."
 USB_nsp_top_priority_budgeting: "우선순위 예산 편성"
 USB_nsp_top_priority_budgeting_desc: "우리는 여러 항구와 상당한 해군 조선소를 장악하고 있어 해군 중심의 방향으로 나아가고 있습니다. 따라서 해안의 규모, 성장하는 무역, 외국 적대 세력의 잠재적 침공을 고려하여 국가와 국민의 방어를 보장하도록 예산 편성에 우선순위 체계를 세워야 합니다."
 USB_nsp_expanding_jersey_foundries: "저지 주조소 확장"
 USB_nsp_expanding_jersey_foundries_desc: "뉴저지의 주조소와 금속 제련 공장은 다양한 경금속을 생산합니다. 이러한 경금속은 민간과 군사의 확장 모두에 필수적이므로, 국가로서 커지는 수요에 더 잘 부응하도록 뉴저지 전반에 투자하겠습니다."
 USB_nsp_defensive_expenditure_warfare: "방어적 지출 전쟁"
 USB_nsp_defensive_expenditure_warfare_desc: "지리적 위치상 이미 등 뒤에 바다를 두고 있으므로 국가의 생존을 보장해야 합니다. 이를 염두에 두고 육군의 연구개발과 예산 편성은 엄격한 방어적 사고방식에 맞춰졌습니다. 적이 많다는 것을 이해하는 만큼, 우리는 전선을 사수하는 동시에 전쟁 생산 수단을 유지할 수 있도록 경계해야 합니다. 따라서 새로운 전쟁 교리의 개발이 최우선 과제이며, 지금부터 우리는 방어적 지출 전쟁이라 불리는 것을 개발할 것입니다."
 USB_nsp_the_new_identity: "새로운 국가"
 USB_nsp_the_new_identity_desc: "국가와 국민, 군대, 기풍이 굳건해졌습니다. 새롭게 얻은 이 정체성을 보장할 새 이름을 지어야 합니다. 우리는 더 이상 단순한 자유주 합중국이 아니라 중부 대서양 연합입니다."
 USB_america_focus_federalist_liberals_win_election: "연방주의 자유주의자들, 선거에서 승리하다"
 USB_america_focus_federalist_liberals_win_election_desc: "선거 결과가 나왔고 연방당이 승리를 거둔 것으로 보입니다. 이른바 보수적 핵심 당원들이 선거에 반대했던 만큼 이 승리는 당의 균형을 더 자유주의적인 체제로 옮겨 놓은 듯합니다. 이전 당원 한 명은 \\"선거는 국가 생존에 방해가 될 뿐\\"이라고 했지만, 국민은 어떤 변화든, 특히 희망적인 정상화로의 복귀를 기대하고 있습니다."
 USB_states_focus_fed_left_national_works_administration: "국가 공공사업청"
 USB_states_focus_fed_left_national_works_administration_desc: "NWA는 경제 건설을 돕기 위해 새로 설치된 정부 전담 기관입니다. 인프라 계획과 정부 주도의 경제 사업을 통해 실업을 줄이고, 불황기에도 경제에 약간의 자극제가 될 것입니다."
 USB_states_focus_fed_left_industrial_development_committee: "산업 개발 위원회"
 USB_states_focus_fed_left_industrial_development_committee_desc: "IDC가 설립되면 국가의 산업 개발은 순수한 민간 부문 형식으로 이루어지되 정부 프로그램의 추가 지원을 받아, 존재하는 산업의 다양성뿐 아니라 산업이 들어서는 위치에 있어서도 균형을 이룰 수 있습니다. 이는 어떤 공동체나 카운티, 심지어 주 전체도 동시대 지역들에 비해 뒤처지지 않도록 하는 방식입니다."
 USB_states_focus_fed_left_department_of_innovation: "혁신부"
 USB_states_focus_fed_left_department_of_innovation_desc: "DoI, 즉 혁신부는 국민 생활 수준을 높이는 데 핵심적인 분야의 혁신과 일반 과학 발전을 위해 민간 연구 기업에 자금을 대고 함께 일하는 연방 후원 연구개발 기관입니다. 상당한 자금을 투입하여 이 국가적 후퇴를 만회하고 미래로 향하는 길을 열겠습니다."
 USB_states_focus_fed_left_education_standards_act: "교육 기준법"
 USB_states_focus_fed_left_education_standards_act_desc: "ESA는 국가 교육 체계 내의 기준선을 세우는 법안입니다. 거의 모든 카운티가 같은 결과를 내리라는 명목으로 저마다 다른 방식으로 가르치던 옛 체계는 이제 끝입니다. 앞으로 교과 과정은 표준화되어, 교육 기관이 국내 어디에 있든 각 교육 단계에서 이를 지켜야 합니다."
 USB_states_focus_fed_left_automation_advancements_act: "자동화 진흥법"
 USB_states_focus_fed_left_automation_advancements_act_desc: "AAA는 생산 과정을 자동화하는 여러 기술을 도입하고 시행하는 산업 관행의 확대와 표준화에 직접 자금을 투입합니다. 요컨대 적게 투입해 더 많이 만들 수 있도록 투자를 늘려, 더 많이 만들 수 있게 하자는 것입니다."
 USB_states_focus_fed_left_the_true_deal: "진정한 협약"
 USB_states_focus_fed_left_the_true_deal_desc: "진정한 협약은 투자하고, 확인되거나 발견된 천연자원을 통해 다각화하며, 국가의 대부분 중앙 지역에 중심 인프라 네트워크를 만들려는 대규모 경제 패키지입니다. 산업, 인프라, 그리고 새로운 광업 구상이 우리가 국민에게 주고자 하는 미래로 가는 길을 닦을 것입니다. 이는 시민들에게 진정한 협약입니다."
 USB_states_focus_fed_left_department_of_internal_investigation: "내부 조사부"
 USB_states_focus_fed_left_department_of_internal_investigation_desc: "DoII, 흔히 올리가르히 박멸국이라 불리는 이 기관은 연방 정부의 구성원들을 정기적으로 조사하고 견제하는 임무를 맡은 독립 반부패 기관입니다. 이 독립 기구는 세 가지 주요 기준에 따라 선출된 사람들로 구성됩니다. 1. 행정 또는 수사 경력이 있을 것. 2. 기관의 청렴성을 보장하기 위해 정치적으로 무관심하거나 투표 경험이 없는 배경일 것. 3. 대표자는 부패를 일으킬 수 있는 가장 단순한 방식과 동시에 가장 복잡한 방식을 이해하기 위한 관점의 다양성을 보장하도록 각 주의 모든 주요 사회 계층에서 균형을 이룰 것. 이 기관은 자유주 합중국의 '자유'를 보장하는 초석이 될 것입니다."
 USB_states_focus_fed_left_old_power_is_still_power: "옛 동력은 여전히 동력이다"
 USB_states_focus_fed_left_old_power_is_still_power_desc: "경제가 다시 가동되고 수요가 생산을 앞지르고 있으니, 성장에 뒤처지지 않으려면 저렴하게 전력을 생산할 방법을 찾아야 합니다."
 USB_states_focus_fed_left_new_power_is_balanced_power: "새 동력은 균형 잡힌 동력이다"
 USB_states_focus_fed_left_new_power_is_balanced_power_desc: "새천년이 되면서 재생 에너지 발전 기술에 대한 투자와 개발은 놀라울 정도였습니다. 우리는 발전을 다각화하고 이러한 재생 에너지를 활용해 우리가 요구하는 전력, 그리고 미래에 필요할 전력을 확보해야 합니다. 일이 충분히 잘 풀린다면 이 잉여 에너지를 우리에게 유리하게 쓸 수 있을지도 모릅니다."
 USB_states_focus_fed_left_future_power_is_future_proofing: "미래 동력은 미래 대비다"
 USB_states_focus_fed_left_future_power_is_future_proofing_desc: "미래는 지금이자 그 너머이며, 혁신하려면 적어도 그와 관련된 에너지 생산 수단을 접하고 이해해야 합니다. 핵분열은 우리의 균형 잡힌 에너지 생산 수단에 들어맞으며 경제 전반에 큰 힘이 될 것입니다. 그뿐 아니라 연구개발에 적절히 투자하면 핵분열은 사라지고 핵융합이 새로운 미래가 될지도 모릅니다. 그 질문에는 시간만이 답할 것입니다."
 USB_states_focus_fed_left_the_substations_act: "변전소법"
 USB_states_focus_fed_left_the_substations_act_desc: "이 법안은 전력망의 급속한 성장과 확장에 필요한 효율과 보호를 보장하기 위한 포괄적 연구 및 인프라 투자 계획입니다. 결국 우리는 발전 수요를 늘려야 할 뿐 아니라 그 전력을 소비하는 방식도 더 효율적으로 만들어야 합니다."
 USB_states_focus_fed_left_the_self_defense_act: "자위법"
 USB_states_focus_fed_left_the_self_defense_act_desc: "이름과는 달리 SDA는 민법의 개정이 아니라 군사, 더 구체적으로는 육군에 대한 투자 및 개발 기금입니다. 우리의 현재 상황은 하루가 지날수록 더 불안해지고 있습니다. 외세는 우리가 정당하게 일군 것을 찾아 빼앗으려 하지만, 그런 일이 일어나지 않도록 하겠습니다."
 USB_states_focus_fed_left_freecare_program: "프리케어 프로그램"
 USB_states_focus_fed_left_freecare_program_desc: "프리케어는 보편적 복지 제도를 시행하는 우리의 방식입니다. 국민의 필요를 정리하여 국내 의료 전문가를 육성하고 해외 의료 전문가를 영입하는 데 모두 투자하며, 시민에게 필요한 돌봄의 단계를 4단계로 나눈 체계를 마련합니다. 이 돌봄 단계는 질병과 부상의 중증도를 파악해 늘어나는 인구에 얼마나 빠르고 효율적으로 돌봄을 배분할 수 있는지 행정 측이 조직하도록 하며, 현장의 전문가들은 환자의 상태가 갑자기 달라지면 현시점에서 단계 상향을 승인할 수 있습니다. 결국 삶에서 확실한 것은 죽음 외에 없습니다."
 USB_states_focus_fed_left_mid_atlantic_fleet: "중부 대서양 함대"
 USB_states_focus_fed_left_mid_atlantic_fleet_desc: "구질서의 함선을 상당수 보유하고 있음에도 우리의 입지는 기껏해야 불안정합니다. 대부분의 해군 조선소와 시설은 낡아서 오스트레일리아나 포르투갈 같은 나라와 대등해지려 해도 수리와 개보수가 필요합니다. 따라서 현재 해군의 상태를 봉인 해제하는 정비에 상당한 해군 기금을 투입할 것입니다."
 USB_america_focus_anarchists_fsp_anarchist_victory: "자유사회당 \\"아나키스트\\", 승리를 집단화하다"
 USB_america_focus_anarchists_fsp_anarchist_victory_desc: "충격적인 상황 전개로 자유사회당이 선두에 올랐습니다. 여러 갈래의 붉은 세력으로 구성된 이 당은 선거를 지지하는 쪽으로 기운 최근의 변화 속에서 강경 마르크스주의 및 권위주의적 사회주의에서, 혼란스럽긴 하나 유럽식 사회민주주의자들과 국가가 개입하는 체제에서 더 협력할 수 있다는 이유로 일부가 \\"사이비 아나키스트\\"라고 농담하는 이들의 균형으로 옮겨 갔습니다. 어쨌든 선거는 자유사회당이 이겼고, 이제 우리 국가의 미래를 결정하는 것은 미래와 당 지도부뿐입니다."
 USB_america_focus_anarchists_communalcare_program: "공동체 의료 프로그램"
 USB_america_focus_anarchists_communalcare_program_desc: "CCP는 아이러니하지요, 지역에서 만든 돌봄 시설에 대한 보조금에 의존하는 전담 복지 프로그램 체계로서, 해당 마을이나 지자체의 주민이 같은 지자체의 사람들에게 돌봄을 받습니다. 물론 도움이 필요한 이들을 도울 사람은 언제나 필요하겠지만, 이 시설의 본질은 지역민이 지역민을 돌보기 위해 세웠다는 점입니다. 노인 돌봄과 아동 돌봄을 생각해 보십시오. 예수께서도 이웃을 사랑하라고 하지 않으셨습니까."
 USB_america_focus_anarchists_red_rose_health: "붉은 장미 보건"
 USB_america_focus_anarchists_red_rose_health_desc: "RRH 프로그램은 보편적 의료 제도로 가는 단계를 마련하기 위한 전담 의료 프로그램입니다. 각 주의 필요를 평가한 후 주별 지부가 통제를 지역 단위로 나누고 카운티가 제대로 피드백을 줄 수 있게 합니다. 그 결과 서류 업무를 최소화하고 통제를 쉽게 하는 적절한 지휘 구조와 같은 체계를 세우기를 바랍니다. 대부분의 보편적 의료 프로그램의 실패는 의료 인력보다 행정가가 더 많은 데서 비롯되기 때문입니다."
 USB_america_focus_anarchists_syndicate_industries: "신디케이트 산업"
 USB_america_focus_anarchists_syndicate_industries_desc: "노동조합은 우리 지지 기반의 상당 부분이자 옛 러스트 벨트 주들에서 큰 영향력을 지닙니다. 따라서 우리의 입지를 유지하려면 노동조합에 실질적인 일자리와 미래 발전을 마련하고 보장해야 합니다."
 USB_america_focus_anarchists_social_tech_incorporated: "소셜 테크 주식회사"
 USB_america_focus_anarchists_social_tech_incorporated_desc: "현대에는 현대적 산업이 필요하며 기술과 서비스 산업이 미래입니다. 따라서 우리는 투자하고 경제를 다각화하여 시민의 삶의 질을 높일 뿐 아니라 이를 수출하고 해외의 관심과 투자를 얻을 능력을 키울 것입니다."
 USB_america_focus_anarchists_community_defense_act: "공동체 방위법"
 USB_america_focus_anarchists_community_defense_act_desc: "세계는 위험한 곳이며 외세는 우리의 매우 소심한 입장을 악용하려 합니다. 우리는 스스로를 지킬 방법을 찾아야 하며, 따라서 군대뿐 아니라 우리 국가의 공동체들도 자신의 집과 가족을 지키고 싶어 하도록 해야 합니다."
 USB_america_focus_anarchists_civil_affairs_administration: "민정 행정청"
 USB_america_focus_anarchists_civil_affairs_administration_desc: "CAA는 감사와 반부패 업무를 전담하는 기관입니다. 우리가 존중받고 도움받을 만한 진짜 정부이자 진짜 국가이며 진정한 사회임을 국민과 세계가 인정하도록 최고 수준의 윤리를 심어야 합니다."
 USB_america_focus_anarchists_red_ducation_act: "붉은 교육법"
 USB_america_focus_anarchists_red_ducation_act_desc: "붉은 교육법은 우리가 무엇을 가르치는지, 왜 가르치는지, 그리고 사회의 개선이라는 관점에서 우리 교육 체계의 전반적 목표가 무엇인지를 표준화하고 개선하기 위한 대규모 교육 투자입니다."
 USB_america_focus_anarchists_foreign_relations_act: "대외 관계법"
 USB_america_focus_anarchists_foreign_relations_act_desc: "우리 정부는 바다 건너의 많은 국가들과 보조를 같이하고 있습니다. 치안과 정부 예산 편성에 우선순위를 두어 무역 협정과 노동자 교류 프로그램이 안전하고 양측 모두에 이로움이 되도록 할 수 있습니다."
 USB_america_focus_anarchists_mineral_expansion_act: "광물 확대법"
 USB_america_focus_anarchists_mineral_expansion_act_desc: "MEA는 우리의 광물 및 자원 채굴 산업을 개선합니다. 새로운 기술과 규제, 그리고 광물 사업을 확대하거나 새로 시작하기 위한 정부 보조금을 도입하여, 국내 수요를 충족하도록 국가의 성공을 최대한 보장하겠습니다."
 USB_america_focus_anarchists_the_interstate_renewal_act: "주간 고속도로 갱신법"
 USB_america_focus_anarchists_the_interstate_renewal_act_desc: "주간 고속도로 체계는 우리 경제와 사회 결속의 혈관입니다. 강하고 건강한 국가를 이루려면 더 튼튼하고 믿을 수 있는 혈관을 정비하고, 뚫고, 건설해야 합니다."
 USB_america_focus_anarchists_consumer_industry_advancements: "소비재 산업 진흥"
 USB_america_focus_anarchists_consumer_industry_advancements_desc: "경제적 경쟁력에 더해 국내 품질 향상을 보장하려면 자동화의 새로운 진전을 도입하도록 투자하고 확보해야 합니다. 그에 더해 산업에 편입할 새 기술을 찾아 제품의 품질을 유지하면서 양까지 늘려야 합니다."
 USB_america_focus_anarchists_parker_harrison_act: "파커-해리슨 법"
 USB_america_focus_anarchists_parker_harrison_act_desc: "파커-해리슨 법은 우리의 에너지 수요에 대한 국가적 투자입니다. 새 발전소와 기술에 대한 투자, 그리고 에너지 소비 효율에 관한 규제와 혁신이 포함됩니다. 시민의 에너지 수요를 확보하고 현대 국가가 갖추어야 할 기준을 높이겠습니다."
 USB_america_focus_anarchists_family_unity_program: "가족 결속 프로그램"
 USB_america_focus_anarchists_family_unity_program_desc: "FUP는 자녀가 세 명 이상인 가족을 위한 프로그램이자 세금 감면입니다. 이는 국내 가족 단위를 튼튼히 하고 그 결속을 유지할 자원을 제공하여 인적 자본이 국가의 발전에 기여하도록 합니다. 경제가 성장함에 따라 국민도 성장하고 원하는 삶을 살 수 있어야 하기 때문입니다."
 USB_america_focus_anarchists_army_readiness_act: "육군 대비법"
 USB_america_focus_anarchists_army_readiness_act_desc: "국가 보존은 우리 삶의 방식에서 소중한 것을 지키고 유지하기 위한 최우선 과제 중 하나입니다. 이에 따라 외부의 적으로부터 국가와 국민의 방어를 강화하기 위해 군, 특히 육군에 투자합니다."
 USB_mid_atlantic_identitarian_victory: "중부 대서양 정체성주의자들, 선거에서 승리하다"
 USB_mid_atlantic_identitarian_victory_desc: "MAP, 즉 중부 대서양당이 선거에서 승리했으며, 역설적이게도 많은 이들에게 놀라운 일은 아니었습니다. 놀라운 점은 이 당이 대서양 주들의 정체성을 만든다는 것을 제1 목표로 하는 정체성주의 정당으로 더 기울었다는 것입니다. 그러나 당분간은 중부 대서양 정체성에 만족하며 무엇보다 먼저 후방을 지키고 확보하고자 합니다."
 USB_mid_atlantic_identitarian_rust_to_riches: "녹슨 땅에서 부로"
 USB_mid_atlantic_identitarian_rust_to_riches_desc: "우리 국가의 3분의 1은 옛 러스트 벨트에 속합니다. 이 주들은 한때 20세기 산업주의의 대표적인 저력이었습니다. 그러나 지금은 죽은 채로 썩어 가며 고통받고 있습니다. 더는 아닙니다. 우리는 재건하고, 수리하고, 닦아 이 녹슨 주들을 국가의 빛나는 등대로 만들 것입니다."
 USB_mid_atlantic_identitarian_the_old_black_gold: "옛 검은 황금"
 USB_mid_atlantic_identitarian_the_old_black_gold_desc: "웨스트버지니아 주는 세월 그 자체로 고통받는 주입니다. 상황이 이런 만큼 이 \\"옛 황금\\"이 새 시대에 쓰이도록 개발하고 보장해야 합니다. 주를 전면적으로 정비하는 식의 연구와 투자는 이 주가 다시 한번 꽃피고 번영하게 해 줄 것입니다."
 USB_mid_atlantic_identitarian_naval_novelty: "해군의 새 면모"
 USB_mid_atlantic_identitarian_naval_novelty_desc: "해군 대비 태세의 쇠퇴는 문자 그대로 바다를 열어 우리가 공격받게 만드는 일입니다. 우리 해안선을 조금이라도 지키려면 해군과 해군 산업을 정비하고 발전시켜야 합니다."
 USB_mid_atlantic_identitarian_national_defense_act: "국방법"
 USB_mid_atlantic_identitarian_national_defense_act_desc: "국방법은 육군의 발전과 대비 태세를 위한 자금이자 지상에서 국가를 방어하는 능력을 향상시키는 입법입니다. 주 방위군이나 의무 복무 기간이라는 발상도 제안되었으나, 그렇게까지 빠르게 나아가야 할지는 확실치 않습니다."
 USB_mid_atlantic_identitarian_aviation_development_fund: "항공 개발 기금"
 USB_mid_atlantic_identitarian_aviation_development_fund_desc: "ADF는 공군의 개발과 현대화에 국방비를 투입하는 입법입니다. 공군은 거의 무질서에 가까운 상태이고 복무를 이어 갈 지식조차 부족해 가장 심하게 무너진 분야입니다. 누구나 병사와 선원 놀이는 할 줄 알지만, 어떤 비행기든 조종하려면 적절한 신체 기준과 장비를 배우고 이해하는 능력이 필요합니다."
 USB_mid_atlantic_identitarian_military_influenced_education: "군 영향 교육"
 USB_mid_atlantic_identitarian_military_influenced_education_desc: "교육 체계는 청소년과 미래 세대를 이른바 \\"어른의 세계\\"에 대비하도록 가르치고 준비시키는 체계입니다. 우리의 세계는 그리 밝지 않으므로, JROTC, 즉 예비역 장교 훈련단 주니어 과정이나 특수 체육 수업 같은 프로그램과 수업을 통해 군과 군 생활의 작지만 매우 전념적인 영향과 노출이 있어야 합니다. 이렇게 하면 입대 여부와 상관없이 군 모집과 국가에 대한 의무를 은연중에 북돋울 수 있습니다. JROTC 프로그램은 잠재적 병사를 준비시킬 뿐 아니라, 군에서만큼이나 민간 세계에서도 잘 통하는 대중 연설, 리더십 자질, 팀워크 같은 것을 아이들에게 가르칠 수 있습니다."
 USB_mid_atlantic_identitarian_service_member_tax_breaks: "군 복무자 세금 감면"
 USB_mid_atlantic_identitarian_service_member_tax_breaks_desc: "국방과 새로 얻은 정체성의 보존은 우리가 소중히 여기는 것입니다. 따라서 이를 지키기로 선택한 시민들은 세금 감면과, 군 복무자 가족에 대한 일정한 수당 형태의 보충 지원을 통해 보살핌을 받아야 합니다."
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy: "\\"동원\\" 경제 모델"
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy_desc: "유사 동원 경제는 제조 산업이 정상적인 생산 방식 등을 따르도록 하는 혼합형 경제 모델입니다. 차이점은 각 산업의 작은 전담 부분, 대략 5~10퍼센트가 어떤 형태의 군수 생산에 할당된다는 것입니다. 각 주요 기업이 특정 장비나 장비 종류의 생산을 전담하되, 각 기업의 공장 간 실제 배분은 기대 할당량을 충족하거나 근접하고 생산된 장비의 품질을 보장하는 한 기업 경영진에게 달려 있습니다."
 USB_mid_atlantic_identitarian_the_new_nation: "새로운 국가"
 USB_mid_atlantic_identitarian_the_new_nation_desc: "이제부터 우리는 더 이상 단지 \\"지나간 시대의 연방 잔존물\\"이 아닙니다. 우리는 이제 중부 대서양 연방 연합으로 불릴 것입니다. 우리가 키우고 우리의 것이라 부르기 위해 쏟은 새로운 정체성과 문화에 기반한 더 순수한 연합입니다. 물론 과거를 존중하기에 연방 연합이라 부르지만, 이는 새로운 한 걸음이며 이제 오를 일만 남았습니다."
 USB_mid_atlantic_identitarian_developing_the_arms_industry: "무기 산업 발전"
 USB_mid_atlantic_identitarian_developing_the_arms_industry_desc: "스스로를 지킬 능력을 굳히려면 그 노력의 병참 측면이 유지되도록 해야 합니다. 이를 위해 우리를 덮칠 수 있는 요구와 잠재적 위협에 대응하도록 군수 산업 역량을 발전시켜야 합니다."
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments: "해운 산업 개발 증진"
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments_desc: "국제적 인지도를 높이기 위해 우리는 해군과 해운 산업의 지속적인 발전을 추구합니다. 이는 군사적으로도 활용될 수 있지만 가장 큰 필요는 물론 무역과 어업 등입니다."
 USB_mid_atlantic_identitarian_advanced_industries_act: "첨단 산업법"
 USB_mid_atlantic_identitarian_advanced_industries_act_desc: "AIA는 기술 및 서비스 기반 산업을 발전시키고 키우기 위한 정부 자금 패키지입니다. 우리가 속한 대륙의 나머지 군소 세력들 사이에서 두각을 나타내려면 혁신하고 세계 무대에서의 경쟁력도 높여야 합니다."
 USB_mid_atlantic_identitarian_the_primary_industries_act: "1차 산업법"
 USB_mid_atlantic_identitarian_the_primary_industries_act_desc: "이름을 알리고자 한다면 한 전문 분야에서 선두이자 개척자로서 행동해야 합니다. 이 대륙에는 자원이 있고 세계는 그 자원을 필요로 합니다. 따라서 1차 산업을 발전시키고 더 적은 것으로 더 많이 얻는 새로운 방법을 연구하기 위한 대규모 자금 및 투자 패키지가 우리가 차지해야 할 미래의 몫입니다."
 USB_mid_atlantic_identitarian_the_labor_restructuring_act: "노동 재편법"
 USB_mid_atlantic_identitarian_the_labor_restructuring_act_desc: "노동 재편법은 노동법과 가용 노동력을 효율적으로 배분하는 전반적 능력에 대한 포괄적 입법 개혁이며, 더 적은 인원으로 더 많은 생산 역량을 얻는 능력을 미래에 대비해 갖추는 것이기도 합니다. 물론 복지와 기타 예산 장치를 늘려야 하겠지만, 이는 모든 국민의 더 나은 생활 수준을 위한 진정한 투자입니다."
 USB_nsp_monarchist_victory: "NSP \\"군주주의자\\"의 승리?"
 USB_nsp_monarchist_victory_desc: "충격적인 상황 전개로 NSP, 즉 국민봉사당이 선거에서 승리했습니다. 충격적인 이유는 알려진 모든 이념 가운데 이 당의 선거 지지 쪽 날개가 스스로를 \\"현대 군주주의자\\"라 부른다는 점입니다. 이들의 주된 목표는 민주 체제를 유지하되 선출직에 칭호를 붙이는 미적 변화를 주는 것으로 보입니다. 이런 선출 군주제, 혹은 일부 절대주의자들이 비웃듯 \\"사이비 군주주의\\"라 부르는 것은 많은 사람에게 다소 기이합니다. 그러나 군은 군주제가 군대를 높이 평가했던 역사적 영향을 이해하고 만족합니다. 보수주의자들은 이것이 거의 궁극의 보수적 행보이기에 만족하고, 자유주의자들은 이를 통해 민주적 대표성이 유지되고 자유화되므로 어느 정도 만족합니다. 결국 이름에 진정으로 무엇이 담겨 있겠습니까?"
 USB_nsp_monarchist_the_great_debate: "대토론"
 USB_nsp_monarchist_the_great_debate_desc: "선거 승리 이후, 많은 이들이 관직 칭호를 겉으로만 바꾸는 것의 의미가 무엇인지, 몇 개나 바꿔야 하는지 등을 진정으로 궁금해합니다. 따라서 당의 가장 뛰어난 토론자들과 가장 냉철한 인물들이 모여 이른바 \\"대토론\\"을 벌여, 큰 틀에서 실제로 얼마나 많은 것이 바뀌는지를 대중과 회의론자 모두에게 보여 주어야 합니다."
 USB_nsp_monarchist_the_upper_echelon_act: "상층부 법"
 USB_nsp_monarchist_the_upper_echelon_act_desc: "긴 토론 끝에 우리는 새로운 형식적 변화를 확정했습니다. 국가 이름을 아카디아 연합 왕국(UKA)으로 바꾸기로 한 선택은 새로운 정체성의 상징이자, 한때 우리의 전신에 독립을 안겨 준 이들에 대한 상징입니다. 프랑스령 아카디아 지역은 캐나다의 뉴브런즈윅, 노바스코샤, 프린스에드워드아일랜드로 알려져 있습니다. 이제 그 이름은 UKA로서 우리와 함께 살아남을 것입니다. 이 새로운 정체성은 관직 칭호의 변경을 가능하게 합니다. 대통령은 황제, 상원은 대공, 하원은 영주 또는 남작, 주지사는 왕과 여왕이 됩니다. 국가 지도부의 이른바 상층부 전체가 이제 새로운 국가, 새로운 국민, 새로운 길의 정신을 구현할 것입니다."
 USB_nsp_monarchist_the_true_progressives: "진정한 진보주의자들"
 USB_nsp_monarchist_the_true_progressives_desc: "진정한 세제 개혁에 대한 진보적 선호가 있는 만큼 세법의 공정성을 보장해야 합니다. 따라서 세율 구간은 최고 세율 구간의 기준이 25만 달러에 이르도록 설정됩니다. 이것의 누진성은 구간 사이의 간격이 균등하게 나뉜, 검증된 가변적 구간 수로서 가장 누진적인 형태의 과세를 가능하게 합니다. 소득이 더 높은 이들을 벌하는 대신 비례 소득을 기준으로 스케일링합니다. 그러면 \\"공정한 몫을 내라\\"는 실체 없는 공방이 사라집니다. 그 공정한 몫이 단지 남보다 더 많이 번 탓에 더 많이 낸 것이 아니라 소득의 비율에 기반하기 때문입니다."
 USB_nsp_monarchist_the_royal_families_act: "왕실 가족법"
 USB_nsp_monarchist_the_royal_families_act_desc: "RFA는 국가의 가족을 지원하여 시민이 보살핌을 받을 뿐 아니라 국가의 미래도 보살핌을 받도록 하기 위한 복지 개혁 및 예산 법안입니다. 이혼의 주된 원인이 자녀를 갖는 일로 인한 재정 불안정이라는 것은 누구나 압니다. 따라서 시민의 행복을 높이고, 안정된 가정의 발전 기준선을 끌어올리며, 우리 미래 시민과 잠재적 지도자의 앞날을 보장하려면 말 그대로 아이들을 생각해야 합니다."
 USB_nsp_monarchist_the_modern_merchants_act: "현대 상인법"
 USB_nsp_monarchist_the_modern_merchants_act_desc: "군주주의의 \\"전통 시대\\"에는 상인이 군주제와 그 나라의 영향력과 부를 확대하는 근간이었습니다. 현대에서 이 \\"현대 상인\\"은 소규모 사업주입니다. 경제의 근간이며 국가 경제라는 엔진을 움직이는 증기입니다. 따라서 우리는 소기업이 창출할 수 있도록 자금을 대고, 키우고, 지지해야 합니다. 다만 국가와 국민의 부가 아니라 자기 부를 지키기 위해 우리 국경 밖을 바라보는 기업 실체는 예외입니다."
 USB_nsp_monarchist_the_great_connections_act: "대연결법"
 USB_nsp_monarchist_the_great_connections_act_desc: "현대는 40년 전에는 생각조차 못 한 일을 해냈습니다. 바로 세계를 더 작은 곳으로 만든 것이며, 오늘날 많은 이들은 인터넷과 이동통신 서비스를 누려야 할 권리로 여깁니다. 생존에 필요한 것을 제외하면 물질적인 것은 결코 권리가 아니지만, 우리는 이러한 서비스가 미래이며 모두를 더 가깝게 만드는 것보다 국가와 국민, 정체성을 키우는 더 나은 방법은 없다고 믿습니다. 대연결법이라 불리는 이 대규모 자금 패키지를 통해 도로 및 인터넷/전화 기반 인프라가 시민이 제공할 수 있는 최선의 수준으로 확장되고, 현대화되며, 유지되도록 하여 통합을 보장합니다."
 USB_nsp_monarchist_domestic_first_policy: "국내 우선 정책"
 USB_nsp_monarchist_domestic_first_policy_desc: "국내 우선 정책, 혹은 국내 우선순위 정책이라고도 불리는 이것은 정부의 주된 책무가 국내 전선의 안보와 안녕을 보장하기 위해 행동하는 것이라고 강제하는 일련의 입법과 개혁입니다. 이는 무역 등이 외부 실체로부터 국내 상황의 개선, 혹은 단순히 그 안전을 확보하는 방식으로 이루어져야 한다는 뜻입니다. 이런 사이비 자급자족적이고 민족주의적인 정책은 상당수 다른 국가를 불쾌하게 하겠지만, 국민이 우선이 아니라면 국가 정부의 정책이 무엇이겠습니까."
 USB_nsp_monarchist_the_grand_tour: "그랜드 투어"
 USB_nsp_monarchist_the_grand_tour_desc: "회의론자는 삶의 일부이며, 누군가 반대하는 한 무언가에 대해 누군가가 진정으로 \\"옳은지 그른지\\" 의심하는 사람들이 있을 것입니다. 따라서 국제적 이미지를 강화하려면 외교단을 확대하고 우리의 존재 자체에 대한 적의 가능성을 줄여야 합니다."
 USB_nsp_monarchist_la_grand_army: "우리의 대육군"
 USB_nsp_monarchist_la_grand_army_desc: "존경할 만한 군대가 있다면 하루 종일 이야기해도 모자랄 것입니다. 자신이 믿는 것을 위해 목숨을 바칠 각오가 있는 사람이라는 원칙은 사람이 할 수 있는 궁극의 희생이기 때문입니다. 그럼에도 나폴레옹의 혁신성은 앞을 내다보거나 미래에 대비하는 모든 장교의 마음속에 특별한 자리를 차지하고 있습니다. 자존심이 있는 사람이라면 누구나 나폴레옹이 되고 싶어 할 것이라고 생각해도 무방할 듯합니다. 어쨌든 전쟁, 특히 새로운 이웃과의 전쟁에서 살아남을 생각이라면 우리 군대를 최대한의 존중과 성실로 대해야 합니다."
 USB_nsp_monarchist_our_great_navy: "우리의 위대한 해군"
 USB_nsp_monarchist_our_great_navy_desc: "육상 방어에서 해상 방어로, 대해군본부는 우리의 무역과 연안 공동체를 바깥의 위험으로부터 안전하게 지켜 낼 것입니다. 같은 투자의 열정으로 우리 군을 되살리겠습니다."
 USB_nsp_monarchist_our_defiant_air_force: "우리의 불굴의 공군"
 USB_nsp_monarchist_our_defiant_air_force_desc: "우리 나라의 하늘은 신성하며, 이 방패는 강력하고 불굴의 공군을 통해 지켜야 합니다. 해외의 침략자들로부터 우리의 하늘을 방어할 능력을 갖추어야 합니다. 침략자는 많을 수 있고 그중에는 이웃도 있을 수 있습니다."
 USB_nsp_monarchist_our_vast_resources: "우리의 방대한 자원"
 USB_nsp_monarchist_our_vast_resources_desc: "국내 생산과 제조를 확보해야 합니다. 이를 위해 자원 채굴 산업에 투자하고, 키우고, 보조해야 합니다. 이러한 1차 산업은 모든 경제 전체를 순환하는 피이며, 우리는 반드시 그 피가 흐르도록 하겠습니다."
 USB_nsp_monarchist_our_strategic_resources: "우리의 전략 자원"
 USB_nsp_monarchist_our_strategic_resources_desc: "우리의 영토적 위치를 고려하면 자급자족이 최선의 전략은 아니지만, 적어도 국내 상황을 극대화하여 세계 무대에서 더 전략적으로 행동할 수 있습니다. 따라서 채굴 사업을 통한 전략 비축분과 자원 공급선을 만드는 데 막대한 금액을 투자할 것입니다."
 USB_nsp_monarchist_the_great_power_plant: "대발전소"
 USB_nsp_monarchist_the_great_power_plant_desc: "이처럼 거대하고 신속한 확장이 이루어지는 만큼, 그에 따른 수요 또한 충족시켜야 합니다. 이를 염두에 두고 대규모 발전소 단지에 투자하여 에너지 생산과 활용을 크게 끌어올려야 합니다."