 asteroid_mining_orbit_tt: "소행성이 궤도에 진입하면, 기업들은 이제 채굴용 드론을 소행성으로 보내 채굴하게 됩니다.\n"
 asteroid_mining_opportunity_tt: "우리는 소행성을 채굴할 수 있을 것입니다\n"
