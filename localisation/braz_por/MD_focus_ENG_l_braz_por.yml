 ENG_type_23_lifex: "Extensão de Vida da Type 23"
 ENG_type_23_lifex_desc: "A fragata Type 23 foi projetada para uma vida útil de casco de dezoito anos, mas em meados dos anos 2000 os dezesseis navios sobreviventes eram toda a força de escolta. O programa de Extensão de Vida, conhecido universalmente como LIFEX, passou cada casco, um a um, por uma reforma completa em Devonport: novos geradores a diesel e caixas de engrenagem, renovação estrutural, o radar Artisan Type 997 no lugar do Type 996 e o Sea Ceptor substituindo o Sea Wolf. O trabalho estendeu a vida de navios individuais para além de trinta anos em serviço e deu à Marinha Real a década de que precisava para projetar um sucessor."
 ENG_future_surface_combatant: "Futuro Combatente de Superfície"
 ENG_future_surface_combatant_desc: "Aberto em 1998 e reestruturado mais de uma vez, o programa Futuro Combatente de Superfície foi a tentativa de definir o que viria depois das Type 22 e Type 23. Passou pelos estudos de Capacidade de Combatente de Superfície Sustentada e pelos conceitos C1, C2 e C3, um navio antissubmarino, um navio de uso geral e uma patrulha oceânica, antes de convergir para um único casco flexível comercializado como Global Combat Ship. Toda fragata britânica projetada depois herda as premissas definidas aqui."
 ENG_ark_royal_class_carrier: "Porta-Aviões Classe Ark Royal"
 ENG_ark_royal_class_carrier_desc: "Com o Queen Elizabeth e o Prince of Wales em serviço, a questão passa a ser o que vem depois deles. Um terceiro casco construído num projeto revisado acabaria com a aritmética que deixa a frota sem porta-aviões de ataque sempre que um navio entra em manutenção pesada, e carregaria um nome usado por cinco navios de guerra britânicos anteriores, o mais recente o navio da classe Invincible desativado em 2011."
 ENG_type_45_daring_class: "Contratorpedeiro Type 45 Classe Daring"
 ENG_type_45_daring_class_desc: "Encomendado depois que a Grã-Bretanha deixou o programa trilateral de fragatas Horizon em 1999, o Type 45 foi construído em torno do sistema Sea Viper, do radar multifunção Sampson montado no alto do mastro e do radar de longo alcance S1850M. Seis navios foram montados em Govan, Scotstoun e Portsmouth entre 2003 e 2013 para substituir os Type 42. Daring e Dauntless lideram a classe e, juntos, dão à Marinha Real a plataforma de defesa aérea de área mais capaz que ela já operou."
 ENG_aukus_programme: "Programa AUKUS"
 ENG_aukus_programme_desc: "Anunciada em setembro de 2021, a parceria AUKUS compromete o Reino Unido, os Estados Unidos e a Austrália com um submarino de ataque de propulsão nuclear comum. O projeto SSN-AUKUS é liderado pelos britânicos e nasce dos estudos do sucessor do Astute, combinando uma planta de reator Rolls-Royce com sistemas de combate americanos e lançamento vertical. A construção é dividida entre Barrow-in-Furness e Osborne, unindo três bases industriais em uma única linha de produção pelo resto do século."
 ENG_albion_class_lpd: "Doca de Plataforma de Desembarque Classe Albion"
 ENG_albion_class_lpd_desc: "O programa de Substituição da Doca de Plataforma de Desembarque entregou o HMS Albion e o HMS Bulwark, comissionados em 2003 e 2004 no lugar dos desgastados Fearless e Intrepid. Cada navio carrega uma doca alagável para quatro lanchas de desembarque utilitárias, um convés de veículos, um convoo capaz de receber dois helicópteros médios e os espaços de comando para o estado-maior de um grupo-tarefa anfíbio. São as plataformas das quais os Fuzileiros Navais Reais colocam uma brigada em terra."
 ENG_royal_marines_future_commando_force: "Força de Comandos do Futuro"
 ENG_royal_marines_future_commando_force_desc: "O programa Força de Comandos do Futuro afasta a 3ª Brigada de Comandos do assalto anfíbio em massa e a leva a incursões avançadas persistentes. Os comandos operam em pequenas equipes autossuficientes, atuam a partir de auxiliares convertidos e navios de ataque litorâneo em vez de uma cabeça de praia, e são equipados para reconhecimento, sabotagem e tomada de terreno marítimo-chave. É a maior mudança na doutrina dos Fuzileiros Navais Reais desde a Segunda Guerra Mundial."
 ENG_royal_marines_littoral_response_group: "Grupo de Resposta Litorânea"
 ENG_royal_marines_littoral_response_group_desc: "Dois Grupos de Resposta Litorânea, um mantido no Euro-Atlântico e outro a leste de Suez, mantêm uma companhia de comandos e seus navios permanentemente no mar. Construídos em torno de um navio-doca classe Albion e auxiliares classe Bay, oferecem uma capacidade permanente de evacuação, ajuda em desastres, treinamento com forças parceiras e incursões, disponível em dias, e não nas semanas que uma força-tarefa levaria para se reunir."
 ENG_royal_marines_arctic_warfare_centre: "Centro de Guerra Ártica"
 ENG_royal_marines_arctic_warfare_centre_desc: "A Grã-Bretanha mantém o compromisso de clima frio com o flanco norte da OTAN desde os anos 1970, enviando a 3ª Brigada de Comandos a Bardufoss e Porsangmoen todo inverno. Formalizar esse desdobramento sazonal em um estabelecimento de treinamento permanente preserva o quadro de líderes de esqui e montanha, as tripulações de veículos para neve e os instrutores de sobrevivência, e mantém os Fuzileiros Navais Reais como a formação de referência da aliança para operações acima do Círculo Polar Ártico."
 ENG_military.048.t: "A Proposta AUKUS"
 ENG_military.048.d: "Londres propõe uma parceria trilateral com Washington e Canberra, construída em torno de um submarino de ataque de propulsão nuclear comum. O projeto britânico nasce dos estudos do sucessor do Astute e combina uma planta de reator da Rolls-Royce com sistemas de combate americanos e células de lançamento vertical. O pedido vai além de qualquer acordo anterior: desde o Acordo de Defesa Mútua de 1958, a propulsão nuclear naval foi compartilhada apenas com o Reino Unido, e os britânicos agora pedem que a Austrália seja admitida nela. A aprovação faria de Barrow-in-Furness e Osborne uma única linha de produção e colocaria submarinos caçadores-assassinos aliados no leste do Oceano Índico pelo resto do século."
 ENG_military.048.a: "Estender o acordo de propulsão a Canberra"
 ENG_military.048.b: "O reator permanece dentro do acordo de 1958"
 ENG_military.049.t: "Barcos Nucleares ou a Encomenda Convencional"
 ENG_military.049.d: "O Reino Unido e os Estados Unidos ofereceram à Austrália um submarino de ataque de propulsão nuclear, o primeiro já fornecido a um país sem armas nucleares próprias. O preço é o atual programa convencional de substituição, cujo contrato teria de ser cancelado por completo e seu parceiro europeu indenizado. Em seu lugar vêm rodízios por HMAS Stirling, um estaleiro reconstruído em Osborne e um pagamento às bases industriais britânica e americana para comprar a capacidade produtiva de que nossos próprios submarinos precisarão. A decisão compromete a Commonwealth com uma força submarina que ela não consegue manter sem apoio aliado, e com a parceria que a fornece."
 ENG_military.049.a: "Cancelar o pedido e construir submarinos nucleares em Osborne"
 ENG_military.049.b: "Honraremos o contrato que assinamos"
 ENG_military.050.t: "AUKUS é Assinado"
 ENG_military.050.d: "Os três governos anunciaram a parceria. A Austrália operará um submarino de ataque de propulsão nuclear construído segundo um projeto britânico, e a planta do reator, o sistema de combate e os estaleiros que os montam passam a ser um empreendimento compartilhado. Barrow-in-Furness ganha uma encomenda de exportação que sustenta o sucessor do Astute por décadas, e engenheiros navais britânicos, americanos e australianos trabalharão pela primeira vez a partir de um conjunto comum de projetos."
 ENG_military.050.a: "Três marinhas, um submarino"
 ENG_military.051.t: "O Contrato é Rasgado"
 ENG_military.051.d: "Canberra cancelou o programa de submarinos sem aviso e sem consulta, e o fez para aceitar uma oferta anglo-americana negociada pelas nossas costas. A encomenda era o maior contrato de defesa já conquistado por nossos estaleiros, e sua perda recai diretamente sobre os estaleiros e as equipes de projeto que já haviam começado o trabalho. Nossos embaixadores estão sendo chamados de volta. Qualquer que seja o argumento estratégico para o novo arranjo, aliados não ficam sabendo de tais decisões pela imprensa."
 ENG_military.051.a: "Uma facada nas costas"
 ENG_military.052.t: "Washington Retém o Reator"
 ENG_military.052.d: "Os Estados Unidos se recusaram a estender a propulsão nuclear naval além do acordo de 1958. As objeções de não proliferação sempre seriam levantadas, e Washington decidiu que elas pesam mais que o ganho estratégico. O submarino será construído, mas será construído sozinho."
 ENG_military.052.a: "Então nós mesmos o construiremos"
 ENG_military.053.t: "Canberra Recusa"
 ENG_military.053.d: "A Austrália decidiu manter seu programa de submarinos existente. A oferta de um barco de propulsão nuclear trazia obrigações que Canberra não estava disposta a aceitar, desde as multas de cancelamento até uma dependência de manutenção que se estenderia por meio século. A parceria não avançará."
 ENG_military.053.a: "A oferta continua de pé se mudarem de ideia"
 ENG_military.054.t: "AUKUS Anunciado"
 ENG_military.054.d: "O Reino Unido, os Estados Unidos e a Austrália anunciaram uma parceria trilateral de segurança cujo primeiro empreendimento é um submarino de ataque de propulsão nuclear comum. A Austrália se torna o primeiro país sem armas nucleares a operar um. A reação é imediata: especialistas em proliferação questionam as salvaguardas sobre o combustível naval altamente enriquecido, Pequim condena o arranjo como um bloco dirigido contra ela, e o parceiro europeu cujo contrato foi cancelado chamou seus embaixadores de volta."
 ENG_military.054.a: "O equilíbrio do Indo-Pacífico muda"
 AST_aukus_submarine_programme: "Programa de Submarinos AUKUS"
 AST_aukus_submarine_programme_desc: "O estaleiro de Osborne está sendo reconstruído para montar submarinos de ataque de propulsão nuclear segundo um projeto britânico, com uma força de trabalho treinada por meio de rodízios em Barrow-in-Furness e nos estaleiros americanos. As plantas de reator chegam como unidades lacradas, mas o casco, a integração do sistema de combate e uma vida inteira de trabalho de manutenção permanecem na Austrália Meridional, dando à Commonwealth uma indústria de submarinos que ela nunca teve nessa escala."
 britain_md.300.t: "Os Blocos de Construção sob o Projeto"
 britain_md.300.d: "A Arm está comprando a Artisan Components, passando de projetos de processadores para as bibliotecas físicas que transformam qualquer projeto em silício de verdade. É um passo acima na cadeia de valor e para fora do puro negócio de licenciamento. O Tesouro deve decidir se os incentivos britânicos à pesquisa acompanharão a empresa até lá."
 britain_md.300.a: "Estender os incentivos à pesquisa ao trabalho de projeto físico"
 britain_md.300.b: "Deixar a aquisição seguir seus méritos comerciais"
 britain_md.301.t: "O Processador em Cada Bolso"
 britain_md.301.d: "Um núcleo Arm está no centro do novo aparelho da Apple, e de quase todos os rivais que virão depois. O royalty de cada chip é medido em centavos e o volume é medido em bilhões. Cambridge construiu algo de que toda a indústria agora depende sem ser dona de nada."
 britain_md.301.a: "Financiar o polo de projetos de Cambridge em torno dele"
 britain_md.301.b: "Deixar o modelo de licenciamento se sustentar sozinho"
 britain_md.302.t: "Sessenta e Quatro Bits"
 britain_md.302.d: "O ARMv8 leva a arquitetura Arm a 64 bits e, com ela, aos servidores e data centers que a Intel dominou sem um concorrente sério. Whitehall pode apoiar a computação pública na arquitetura britânica ou deixar a questão ao mercado. As compras públicas são a única alavanca que age com essa rapidez."
 britain_md.302.a: "Comprometer a computação pública com a arquitetura"
 britain_md.302.b: "Manter a plataforma comercialmente neutra"
 britain_md.303.t: "A Oferta da SoftBank"
 britain_md.303.d: "A SoftBank ofereceu 24,3 bilhões de libras pela Arm, com um prêmio que nenhum comprador britânico igualará, com garantias sobre a sede e o número de funcionários britânicos. A empresa continuaria em Cambridge. A propriedade, não continuaria britânica."
 britain_md.303.a: "Assumir uma participação pública antes da conclusão da venda"
 britain_md.303.b: "Aceitar as garantias e deixar a venda prosseguir"
 britain_md.304.t: "Quarenta Bilhões de Dólares pela Arm"
 britain_md.304.d: "A Nvidia concordou em comprar a Arm da SoftBank. Os próprios licenciados da Arm, que competem com a Nvidia em todos os mercados que importam, perguntaram publicamente que neutralidade sobreviveria à venda. A decisão cabe à autoridade da concorrência e aos ministros que a orientam."
 britain_md.304.a: "Autorizar a venda com condições comportamentais vinculantes"
 britain_md.304.b: "Encaminhá-la por motivos de segurança nacional"
 britain_md.305.t: "Onde a Arm Abre Capital"
 britain_md.305.d: "A SoftBank está lançando a Arm na bolsa novamente e escolheu Nova York. Londres foi informada sem rodeios de que suas regras de listagem, seus pesos de índice e sua base de investidores não poderiam sustentar a maior empresa de tecnologia que a Grã-Bretanha já produziu. Manter a oferta em casa significaria reescrever os três."
 britain_md.305.a: "Reformar as regras de listagem e ancorar a oferta em Londres"
 britain_md.305.b: "Aceitar a listagem em Nova York e manter a sede"
 britain_md.306.t: "No Que a Arm se Tornou"
 britain_md.306.d: "Um quarto de século de licenciamento, aquisições e listagens definiu o que a Arm é: quem é dono da empresa de Cambridge cuja arquitetura está dentro de quase todo telefone do planeta, e qual bolsa lhe dá um preço."
 britain_md.306.a: "Uma participação soberana na arquitetura"
 britain_md.306.b: "A arquitetura da plataforma de outra pessoa"
 britain_md.306.c: "Listada em casa"
 britain_md.306.e: "Uma ilha que licencia o mundo"
 ENG_arm_sovereign_architecture_stake: "Participação Soberana na Arquitetura"
 ENG_arm_sovereign_architecture_stake_desc: "O Estado detém participação na empresa cujo conjunto de instruções o mundo usa como base, além de poder de veto sobre seu rumo. A participação rende menos do que o mercado renderia e compra algo que o mercado não vende."
 ENG_arm_foreign_platform_architecture: "Arquitetura de uma Plataforma Estrangeira"
 ENG_arm_foreign_platform_architecture_desc: "A Arm agora pertence a uma empresa maior, e o roteiro de desenvolvimento serve primeiro ao silício dessa empresa. A engenharia ainda é feita em Cambridge, em uma escala que nenhum licenciador independente poderia ter financiado, e nos termos de outra pessoa."
 ENG_arm_listed_at_home: "Listada em Casa"
 ENG_arm_listed_at_home_desc: "A oferta ficou em Londres, e as regras foram reescritas para mantê-la. A bolsa finalmente tem uma âncora tecnológica, e as reformas que a conquistaram valem para todos que abrirem capital depois."
 ENG_arm_licensing_island: "Uma Ilha que Licencia o Mundo"
 ENG_arm_licensing_island_desc: "Os projetos são britânicos, os donos não são, e as ações são negociadas em Nova York. A Grã-Bretanha fica com os engenheiros, os royalties e a reputação, e com nenhum do controle que esteve disponível duas vezes e foi recusado duas vezes."
 ENG_scottish_agitation_rising_tt: "A agitação escocesa está acima de 10."
 ENG_north_irish_agitation_rising_tt: "A agitação norte-irlandesa está acima de 10."
 ENG_wales_agitation_rising_tt: "A agitação galesa está acima de 10."
 devolution.20.t: "O Desarmamento Fracassa"
 devolution.20.d: "A Comissão Internacional Independente de Desativação de Armas suspendeu seu trabalho. A tensão no terreno subiu mais rápido do que os inspetores conseguiam certificar os depósitos, e as lideranças paramilitares retiraram seus interlocutores para não serem vistas se desarmando enquanto as ruas ardem. Tanto as organizações legalistas quanto as republicanas insistem que as armas nunca foram o obstáculo, e cada lado culpa o outro pelo colapso. Nada do que foi inutilizado voltará, mas nada mais será entregue também, e o movimento será muito mais difícil de trazer de volta à mesa agora que seus linhas-duras podem dizer que estavam certos."
 devolution.20.a: "Baixar a tensão e tentar de novo"
 devolution.21.t: "Fora de Uso"
 devolution.21.d: "A Comissão informou que testemunhou o desarmamento da totalidade dos arsenais restantes. Depósitos lacrados de fuzis, semtex, morteiros e metralhadoras pesadas foram tornados permanentemente inacessíveis sob supervisão independente, com clérigos de ambas as comunidades como testemunhas. As facções dissidentes que passaram anos denunciando o processo de paz como uma traição ficaram sem a única coisa que justificava a denúncia. O recrutamento colapsou, as redes de arrecadação de fundos nos Estados Unidos secaram, e a Special Branch avalia que o que resta é um resíduo criminoso, e não uma insurgência. A Irlanda do Norte ainda não está reconciliada, mas, pela primeira vez desde 1969, não está armada."
 devolution.21.a: "A guerra acabou"
 devolution.23.t: "Westminster Oferece a Unificação"
 devolution.23.d: "O plebiscito de fronteira deu maioria a uma Irlanda unida e, nos termos do Acordo, o governo britânico é obrigado a dar efeito a esse desejo. Londres convidou formalmente Dublin a aceitar a soberania sobre os seis condados. A oferta é real, e a conta que vem com ela também: dois milhões de pessoas, um subsídio que Westminster carrega há décadas, uma força policial em que metade da população ainda não confia e uma comunidade unionista que votou contra isso e não vai a lugar nenhum. Aceitar significa que a República herda tudo isso, junto com a mais antiga ambição da política irlandesa. Recusar significa dizer a uma maioria no Norte que a República não os quer."
 devolution.23.a: "A Irlanda não livre jamais estará em paz"
 devolution.23.b: "Não estamos prontos para carregar o Norte"
 devolution.24.t: "O Plebiscito de Fronteira Fracassa"
 devolution.24.d: "A contagem terminou e a União se mantém. A participação foi alta dos dois lados e a campanha fez o que as campanhas na Irlanda do Norte sempre fazem, que é lembrar a todos o que os divide, mas quando a pergunta foi de fato feita a resposta foi não. Políticos nacionalistas já começaram a discutir se o plebiscito foi convocado cedo demais, e os partidos unionistas tratam o resultado como um acordo definitivo, e não como um adiamento. O Secretário de Estado confirmou que outro plebiscito não será considerado num futuro previsível."
 devolution.24.a: "A questão está respondida, por ora"
 devolution.25.t: "Dublin Aceita"
 devolution.25.d: "O Taoiseach confirmou à Câmara que a República aceitará a soberania sobre a Irlanda do Norte. A transferência seguirá os termos do Acordo, com garantias para a comunidade unionista escritas no acerto e a cidadania britânica mantida por todos que a quiserem. Não há derrota a ser vingada nem tratado imposto à ponta de arma. Um século da questão irlandesa se encerra com um voto, uma transferência e muitas pessoas no Ulster que jamais chamarão isso de lar."
 devolution.25.a: "O povo falou"
 devolution.26.t: "Dublin Recusa"
 devolution.26.d: "A República recusou. Ministros em Dublin foram educados em público e diretos em particular: o subsídio sozinho engoliria o orçamento deles, o fardo de segurança é algo que não têm capacidade de carregar, e não há apetite nos vinte e seis condados por herdar uma minoria unionista que os vê como uma potência estrangeira. O Norte votou por sair e ouviu que não há para onde ir. A opinião nacionalista encarou a recusa como uma humilhação, e é Westminster quem viverá com as consequências."
 devolution.26.a: "Ficamos com a Província nas mãos"
 devolution.27.t: "A Insurreição do Ulster"
 devolution.27.d: "Stormont acabou, o Acordo é letra morta, e a garantia constitucional que mantinha o movimento republicano dentro da política se foi com ele. O que começou como tumultos após a revogação se tornou algo que o Chefe de Polícia não descreve mais como desordem pública. Delegacias foram invadidas, patrulhas do exército são atacadas com armas pesadas em plena luz do dia, e uma administração provisória que reivindica autoridade sobre os seis condados declarou a Província independente da Coroa. Da última vez que a Grã-Bretanha travou essa guerra, foram trinta anos e um acordo negociado para encerrá-la. Agora não há acordo ao qual recorrer."
 devolution.27.a: "Então a retomaremos pela força"
 devolution.28.t: "A Insurreição Além da Fronteira"
 devolution.28.d: "Os britânicos rasgaram o Acordo e o Norte está em revolta aberta. Um governo provisório em Belfast apelou a Dublin por reconhecimento, armas e homens, e o apelo foi feito de forma pública o bastante para que o silêncio seja lido como resposta. Os artigos dois e três foram emendados, não esquecidos, e há aqui uma base que esperou a vida inteira por exatamente este momento. Há também um exército britânico, uma dissuasão nuclear britânica e todo o argumento que a República defende desde 1998 de que a fronteira só mudaria por consentimento e por nada mais."
 devolution.28.a: "Reconhecer o Governo Provisório e marchar"
 devolution.28.b: "Armá-los e não admitir nada"
 devolution.28.c: "Esta não é a nossa guerra"
 ENG_decommission_paramilitaries: "Desativar os Paramilitares"
 ENG_decommission_paramilitaries_desc: "A Comissão Internacional Independente de Desativação existe desde 1997 sem nunca ter recebido um arsenal completo. As facções republicanas dissidentes que rejeitaram o Acordo não têm interesse em desarmar enquanto ainda puderem recrutar, e recrutam onde os conjuntos habitacionais são pobres e a tensão é alta. Ponha dinheiro e capital político por trás da Comissão, mantenha a Tensão Sectária baixa o bastante para que os intermediários continuem conversando, dê-lhe dois anos, e os últimos arsenais poderão ser inutilizados de forma permanente. Deixe a tensão voltar a subir e todo o processo colapsa."
 ENG_call_border_poll: "Convocar uma Consulta sobre a Fronteira"
 ENG_call_border_poll_desc: "O Acordo obriga o Secretário de Estado a convocar uma consulta sempre que parecer provável que a maioria na Irlanda do Norte votaria por uma Irlanda unida, e obriga o governo britânico a dar efeito ao resultado. Os partidos nacionalistas agora detêm o fiel da balança em Stormont, e a exigência já não pode ser adiada sem romper o Acordo de vez. Uma consulta leva um ano de campanha e o resultado será o que a opinião norte-irlandesa tiver se tornado quando for contado, de modo que o ano de campanha importa tanto quanto a decisão de convocá-la.!"
 ENG_border_poll_mission: "A Campanha da Consulta sobre a Fronteira"
 ENG_border_poll_mission_desc: "A consulta foi convocada e a campanha tem um ano pela frente. O resultado será decidido pela posição do nacionalismo norte-irlandês no dia da votação, e não pela que ele tinha quando a data foi marcada. Uma clara maioria nacionalista tira a Província da União e a leva para a República, desde que Dublin a aceite. Qualquer coisa aquém disso deixa a questão constitucional encerrada por anos e um movimento nacionalista derrotado nas urnas que sabe disso.\n\nNacionalismo Norte-Irlandês: §Y[?ENG_north_irish_nationalists|0]§!\nUm Sim claro exige mais de §G65§!."
 ENG_all_ireland_dominion: "Um Domínio de Toda a Irlanda"
 ENG_all_ireland_dominion_desc: "Com a República já respondendo a Londres, a fronteira se tornou uma linha administrativa e não mais constitucional. Entregar os seis condados a Dublin não nos custa nada que já não tenhamos garantido: a ilha inteira é governada a partir de uma capital que é governada por nós. Isso resolve o mais antigo agravo destas ilhas a nosso favor e a nosso critério, aposenta o subsídio e a guarnição, e deixa o movimento republicano com uma Irlanda unida que ele não pode celebrar.\n\nIsso exige que a devolução norte-irlandesa esteja realmente resolvida antes. Uma província entregue em meio a uma crise é uma crise exportada, não resolvida.\n\nTensão Sectária: §Y[?ENG_north_irish_agitation|0]§!/§G10§!\nDependência Norte-Irlandesa: §Y[?ENG_north_irish_dependency|0]§!/§G70§!\nPressão por Independência: §Y[?ENG_north_irish_pressure|0]§!/§G40§!"
 ENG_repeal_good_friday_agreement: "Revogar o Acordo da Sexta-Feira Santa"
 ENG_repeal_good_friday_agreement_desc: "O Acordo nos custa um subsídio permanente, um aparato policial inflado e um executivo de poder compartilhado em que homens que um dia comandaram campanhas de atentados ocupam cargos ministeriais. Revogue-o, suspenda Stormont e governe a Província diretamente de Londres, como fazíamos antes de 1998. A economia é imediata, e tudo o mais também: a garantia constitucional que mantinha o movimento republicano dentro da política desaparece, os paramilitares retornam, e a Tensão Sectária será sentida com todo o seu peso, sem nada para amenizá-la.\n\nO Ulster se levantará. Teremos poucos meses para conter a Província antes que isso aconteça."
 ENG_repeal_gfa_remove_TT: "Remover §Y$ENG_good_friday_agreement$§!"
 ENG_ulster_on_the_brink_activated_TT: "Temos §Y180§! dias para forçar a §YTensão Sectária Norte-Irlandesa§! abaixo de §G20§!, ou a Liderança Republicana Provisória declarará §RIndependência§! e lutaremos pelo §YUlster§!"
 ENG_ulster_on_the_brink: "Ulster à Beira do Abismo"
 ENG_ulster_on_the_brink_desc: "O Acordo acabou e a Província está se desintegrando. Os distúrbios se tornaram contínuos, o exército voltou às ruas em números não vistos desde os anos setenta, e ambas as comunidades se armam partindo do princípio de que ninguém virá protegê-las. Se a Tensão Sectária puder ser forçada a baixar em seis meses, a Província poderá ser mantida sem acordo e sem uma revolta. Se não puder, a liderança republicana provisória fará a declaração e lutaremos pelo Ulster.\n\nTensão Sectária: §Y[?ENG_north_irish_agitation|0]§!\nDeve cair abaixo de §G20§!."
 OPEN_devolution_BUTTON: "Assuntos de Devolução"
 OPEN_devolution_BUTTON_TT: "Abre o painel de devolução e permite gerir Escócia, País de Gales e Irlanda do Norte."
