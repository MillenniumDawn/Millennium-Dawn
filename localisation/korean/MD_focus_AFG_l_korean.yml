 GULBUDDIN_HEKMATYAR_DESC: "굴부딘 헤크마티아르는 아프가니스탄의 정치인이자 전직 무자헤딘 지도자입니다. 그는 헤즈브-에 이슬라미 굴부딘 정당의 창립자이자 지도자이며, 이 이름은 1979년 모하마드 유누스 칼리스가 헤즈브-에 이슬라미에서 분리되어 헤즈브-에 이슬라미 칼리스를 세운 뒤에 붙여진 것입니다. 그는 1990년대에 두 차례 총리를 지냈습니다. 헤크마티아르는 1970년대 초 학생 시절 무슬림 청년 조직에 가입했으며, 그곳에서 조직 대다수가 받아들이지 않았던 이슬람 급진주의로 알려졌습니다.\n\n그는 파키스탄에서 시간을 보낸 뒤 1979년 소련-아프가니스탄 전쟁이 시작되자 아프가니스탄으로 돌아왔고, 이때 CIA는 파키스탄 정보부 ISI를 통해 급속히 성장하던 그의 헤즈브-에 이슬라미 조직, 즉 아프가니스탄 무자헤딘 최대 조직 중 하나에 자금을 대기 시작했습니다. 그는 소련-아프가니스탄 전쟁 기간 중 다른 어떤 무자헤딘 지도자보다 많은 CIA 자금을 받았습니다.\n\n1992년 소련이 지원하던 아프가니스탄 대통령 모하마드 나지불라가 축출된 뒤, 헤크마티아르는 새 정부에 참여하기를 거부하고 다른 군벌들과 함께 아프가니스탄 내전에 뛰어들어 카불에서만 민간인 약 5만 명이 사망하는 사태를 초래했습니다. 헤크마티아르는 카불에 대한 로켓 공격의 가장 큰 책임이 있다는 비난을 받았습니다. 한편 아흐마드 샤 마수드가 주도한 평화 및 권력 분점 노력의 일환으로, 헤크마티아르는 1993년부터 1994년까지, 그리고 1996년부터 1997년까지 잠시 아프가니스탄 총리를 지냈습니다."
 MOHAMMED_ZAHIR_SHAH_DESC: "40년간 재위한 자히르는 18세기 두라니 제국이 세워진 이래 아프가니스탄에서 가장 오래 재위한 통치자였습니다. 그는 냉전의 양 진영을 포함한 여러 나라와 아프가니스탄의 외교 관계를 확대했습니다. 1950년대에 자히르 샤는 나라의 현대화를 시작했으며, 그 결과 새 헌법과 입헌군주제가 수립되었습니다. 초당파적 태도를 보인 그의 장기 집권기는 이후 사라져 버린 평화로 기억됩니다.\n\n1973년 자히르 샤가 이탈리아에서 치료를 받던 중, 그의 사촌이자 전직 총리인 모하마드 다우드 칸이 쿠데타를 일으켜 정권을 전복하고 일당제 공화국을 수립하여 225년 넘게 이어진 군주 정부를 끝냈습니다.\n\n자히르 샤는 군주제 아프가니스탄을 되살리고 그의 가문의 왕위 계승권을 이어 가기에 가장 적합한 후보입니다."
 raid_taliban_hideouts: "탈레반 아지트 기습"
 raid_taliban_hideouts_desc: "우리 특공대가 탈레반 무장세력의 위치를 파악했으며, 특공대 부대를 파견해 기습 작전으로 이들 탈레반 무장세력을 제거하거나 생포할 수 있습니다."
 bomb_taliban_targets: "탈레반 기지 폭격"
 bomb_taliban_targets_desc: "우리 정보 기관이 탈레반 집결지 여러 곳을 식별했으며, 공군의 대반란전 전투기를 동원하여 이들 무장세력을 폭격할 수 있습니다."
 secure_afghan_pakistani_border: "아프간-파키스탄 국경 보호"
 secure_afghan_pakistani_border_desc: "탈레반 반란을 근절하기 어려운 핵심 원인 중 하나는 탈레반 전투원들이 파키스탄으로 도주해 재편성한 뒤 돌아와 국내에서 반란을 이어 가는 것입니다. 파키스탄과의 국경 대부분은 경비가 이루어지지 않고 있으므로, 국경을 따라 보안 체계를 구축하는 노력을 강화해야 합니다."
 afghan_unity_propaganda: "아프간 통합 선전"
 afghan_unity_propaganda_desc: "탈레반은 대부분 아프가니스탄인으로 구성되어 있습니다. 아프가니스탄인은 모두 동포이나, 우리는 이념 차이로 인해 오랫동안 내전을 겪어 왔습니다. 탈레반 무장대원들이 과거의 행위를 용서해 주겠다고 약속하며 무기를 내려놓고 나라의 발전에 기여하도록 설득하는 데 노력을 기울일 수 있습니다."
 show_supporting_counter_insurgency_countries: "대반란전을 지원하는 국가 보기"
 show_supporting_counter_insurgency_countries_desc: "탈레반에 맞선 우리의 대반란 임무를 지원하는 국가들을 보여 줍니다. 이들 국가는 군사 행동뿐 아니라 기술 지원도 제공할 것입니다."
 eliminate_taliban_insurgency: "탈레반 반란 제거"
 eliminate_taliban_insurgency_desc: "이제 우리 군이 주요 지역에 배치되고 국경 지대가 확보되었으니, 이 오랜 분쟁을 끝내기 위해 탈레반 반란을 분쇄하는 마지막 노력을 기울일 수 있습니다."
 isaf_raid_taliban_hideouts: "반 탈레반 공습"
 isaf_raid_taliban_hideouts_desc: "아프가니스탄 주둔 우리 군 정보 부대가 탈레반 집결지 여러 곳의 위치를 성공적으로 파악했으며, 습격 작전으로 이들 반군을 소탕할 수 있습니다."
 isaf_launch_drone_strike: "드론 공습 실시"
 isaf_launch_drone_strike_desc: "아프가니스탄 주둔 우리 군 정보 부대가 도시 지역 인근의 탈레반 은신처 다수의 위치를 성공적으로 파악했으며, 드론 공격을 개시하여 아프가니스탄 정부 목표물이나 아프가니스탄에 주둔한 아군에 대한 그들의 공격 능력을 무력화할 수 있습니다."
 isaf_bomb_taliban_hotspots: "탈레반 중심지 폭격"
 isaf_bomb_taliban_hotspots_desc: "탈레반 반란 세력이 위험한 수준까지 성장했으며 아프가니스탄군은 이들에 대응하는 데 너무나 무능하므로, 전략 폭격기를 투입하여 그들의 거점을 폭격해야 합니다."
 isaf_provide_technical_equipment: "대반란전 장비 지원"
 isaf_provide_technical_equipment_desc: "아프가니스탄 자체에는 관련 대반란 장비가 없으나 우리가 그 장비를 제공할 수 있으며, 이는 아프가니스탄 국군과 아프가니스탄 국가 경찰의 대반란 작전 수행 효율을 높일 것으로 보입니다."
 isaf_withdraw_from_afghanistan: "아프간에서 철수"
 isaf_withdraw_from_afghanistan_desc: "아프가니스탄에서의 우리 임무는 완료되었습니다. 이 끝나지 않는 전쟁에서 병력을 철수시킬 때입니다."
 AFG_economic_recovery_research_boost: "경제 회복"
 AFG_economic_recovery_research_boost_desc: "국제연합의 도움으로 우리는 이제 자원을 민간 사업에 집중하기 시작할 수 있는 단계에 이르렀습니다."
 AFG_military_research_boost: "군사 연구"
 AFG_military_research_boost_desc: "우리는 국가 예산의 일부를 새로운 군사 기술 연구에 투자했습니다."
 AFG_hezb_i_wahdat: "칼릴리의 정부"
 AFG_hezb_i_wahdat_desc: "아프가니스탄 이슬람 통일당은 1989년에 시아파 이슬람을 기반으로 창당된 아프가니스탄의 정당입니다."
 AFG_invite_fatemiyoun: "파테미욘 초대"
 AFG_invite_fatemiyoun_desc: "파테미윤 사단은 아프가니스탄 시아파 의용병으로 편성되어 이란 혁명수비대의 훈련을 받았습니다. 그 참전 용사들을 귀국시키면 테헤란이 이들의 무장에 동의하는 한 칼릴리가 실전 경험이 풍부한 전투원들을 활용할 수 있게 됩니다."
 AFG_join_axis_of_resistance: "저항 추축국"
 AFG_join_axis_of_resistance_desc: "테헤란은 지역 전역의 동맹 운동 네트워크를 이끌고 있으며, 카불의 시아파 정부는 그 안에 속하는 것이 마땅합니다. 우리 성직자들을 이란 모델과 공식적으로 결합시키면 국가 내 수니파의 우위가 끝나고 우리의 방위는 이란의 방위와 묶이게 됩니다."
 AFG_declare_hazaristan: "하자리스탄 선포"
 AFG_declare_hazaristan_desc: "하자라인은 한 세기 동안 모든 아프가니스탄 정권에게 박해받은 소수 민족이었습니다. 하자라스탄을 선포하면 국가 이름이 그들의 이름을 따르게 되며, 아프가니스탄이 이제 누구의 것인가라는 문제가 정리됩니다."
 TT_AFG_NOT_FACTION_WITH_PAK: "어떤 파키스탄 세력과도 동맹 관계가 아님"
 TT_AFG_BORDER_WAR_WARN_OF_WAR: "§R우리가 이 땅을 점령하면 적이 우리에게 선전포고할 가능성이 높다!§!"
 AFG_Baluchistan: "발루치스탄 영유권 주장"
 AFG_invasion: "파키스탄 침공"
 claim_pashtunistan: "파슈툰스탄 영유권 주장"
 claim_pashtunistan_desc: "파슈툰스탄 지역은 파키스탄 북서부와 아프가니스탄 동부를 아우릅니다. 이 지역이 극단주의 세력의 통제 아래 있는 만큼, 우리는 이 지역의 진정한 수호자라고 주장할 수 있습니다."
 claim_baluchistan: "발루치스탄 영유권 주장"
 claim_baluchistan_desc: "통일 파슈툰스탄 담론에는 파키스탄 서부의 발루치스탄 지역도 포함되는 경우가 많습니다. 이 지역에는 오랫동안 독립을 위해 투쟁해 온 발루치인이 살고 있습니다. 이곳은 한때 아프가니스탄에 속했으며, 우리에게 바다로의 접근로를 열어 주므로 우리에게 필수적입니다."
 afg_claims_advance_to_baluchistan: "발루치스탄 진격"
 afg_claims_advance_to_baluchistan_desc: "발루치스탄 북부와 주요 도시 퀘타가 우리의 첫 번째 목표가 되어야 합니다. 이를 통해 바다를 향한 진격을 계속할 수 있습니다."
 afg_claims_advance_to_the_sea: "발루치스탄 점령 완료"
 afg_claims_advance_to_the_sea_desc: "항구 도시 과다르로 진격해 점령함으로써 발루치스탄 점령을 완료해야 합니다."
 afg_claims_advance_into_tribal_areas: "파슈토 부족 지대 진격"
 afg_claims_advance_into_tribal_areas_desc: "우리의 첫 번째 목표는 연방직할부족지역을 돌파하는 것이어야 합니다. 파키스탄 탈레반의 거점을 제거하는 것으로 시작할 것입니다."
 afg_claims_clear_tribal_areas: "부족 지대 소탕"
 afg_claims_clear_tribal_areas_desc: "탈레반 기지를 처리했으니 다음 단계는 나머지 부족 지대를 평정하는 것입니다."
 afg_claims_invade_peshawar: "페샤와르 점령"
 afg_claims_invade_peshawar_desc: "파키스탄 파슈툰 지역의 보석, 웅장한 도시 페샤와르가 우리 눈앞에 있습니다. 우리는 지금 흔들릴 수 없습니다!"
 afg_invade_pakistan: "파키스탄 침공"
 afg_invade_pakistan_desc: "천천히 전진하여 영토를 점령하는 대신, 우리는 직접 침략하여 적을 기습할 수 있습니다. 그러나 이는 국제 사회에서 눈살을 찌푸릴 것이고, 파키스탄의 수호자들이 개입할 가능성이 있습니다."
 afg_integrate_pashtunistan: "파슈툰족 통합"
 afg_integrate_pashtunistan_desc: "파슈툰족은 아프가니스탄의 지배적인 민족을 공유하지만, 새로운 지역에 거주하는 많은 파슈툰족은 여전히 우리 정부에 불만을 가지고 있습니다. 우리는 그들에게 우리가 함께하는 것이 더 나은 선택임을 설득하기 위해 자원을 투입해야 합니다."
 unite_with_pakistan_taliban: "파키스탄 탈레반과 연합"
 unite_with_pakistan_taliban_desc: "파키스탄의 우리 형제들은 무슬림의 해방을 위해 싸우고 있습니다. 우리는 그들과 힘을 합쳐야 합니다!"
 AFG_technical_specialists: "기술 전문가"
 AFG_technical_specialists_desc: "러시아는 필수적인 계획, 전투 계획을 위한 물류 지원, 그리고 장비의 훈련과 운영에 필요한 전문 지식을 제공하여 우리의 노력을 돕기 위해 기술 전문가를 배치할 계획을 세웠습니다."
 AFG_symbolic_new_start: "상징적인 새 출발"
 AFG_symbolic_new_start_desc: "일각에서는 이를 아프가니스탄이 정부를 재편하고 새로운 시대로 나아갈 기회라고 부를 것입니다."
 AFG_cautious_approach: "신중한 접근"
 AFG_cautious_approach_desc: "일부는 아프가니스탄이 급속한 성장에 이어 대규모 개혁의 시대로 접어들 것이라고 믿었으나, 실제로는 완만한 성장과 보다 신중한 접근을 경험했습니다."
 AFG_local_military_pressure: "국지적 군사 압박"
 AFG_local_military_pressure_desc: "\\"국지적 군사 압박\\"으로 알려진 전술 교리입니다. 이 전략은 적군에게 지속적이고 국지적인 압박을 가해 그들의 작전을 교란하고 사기를 떨어뜨리는 데 중점을 둡니다."
 Militia_Bat_ShuraeNazar: "민병대"
 AFG_taloqan_text1: "§g오직 커다란 쇠망치로만 깨뜨릴 수 있다.§!"
 AFG_taloqan_text2: "§g그들은 회색 노새를 타고 붉은 머리띠를 두른 젊은 하심 가문 사내가 이끌 것이다. 마치 그가 유프라테스강을 건너는 모습이 보이는 듯하다. 그가 온다는 소식을 듣거든, 눈 위를 기어서라도 그에게 달려가라.§!"
 AFG_Election_over: "첫 번째 선거 종료"
 AFG_Election_over2: "선거 종료"
