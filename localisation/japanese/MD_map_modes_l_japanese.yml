l_japanese:
 MAPMODE_EU_MAP_MODE_NAME: "EU"
 MAPMODE_EU_MAP_MODE: "EU"
 MAPMODE_EU_MAP_MODE_DESCRIPTION: "EUの加盟国、潜在的な加盟国、および現在の役職を表示する"
 EU_map_mode_tooltip: "欧州連合"
 EU_map_mode_tooltip_delayed: "Shows the current membership and leadership of the European Union.\n\n§Y[FROM.CONTROLLER.GetNameWithFlag]§!: §Y[FROM.CONTROLLER.map_mode_EU_status]§!\n\n§YColor Legend:§!\n§nBlue§! = EU Member State\n§YGold§! = Potential Member State\n\n§YOffice Holders:§!\n§RRed§! = President of the European Commission, European Council, or European Parliament\n§WWhite§! = President of the European Federation\n§BIndigo§! = Secretary General of EuroArmy or EuroNavy, or Frontex Executive Director\n§4Light Blue§! = High Representative or Ambassador of the Union to the United Nations\n§GGreen§! = President of the European Central Bank or European Minister of Economy and Finance\n\nColors follow the §YMap Mode Colors§! choice in Automation Settings.\nUpdated weekly."
 MAPMODE_INFLUENCE_MAP_MODE_NAME: "影響"
 MAPMODE_INFLUENCE_MAP_MODE: "影響"
 MAPMODE_INFLUENCE_MAP_MODE_DESCRIPTION: "他国における自国の影響力ランキングを表示する。影響力は外交上の交渉力を決定し、時間の経過とともに政治情勢に影響を与える。"
 influence_map_mode_tooltip: "影響力"
 influence_map_mode_tooltip_delayed: "Shows countries where you hold influence, your ranking among influencers, and nations set for auto-influence.\n\nInfluence determines your diplomatic leverage over a nation. Higher ranking means greater sway over their political alignment and foreign policy.\n\n§YColor Legend:§!\n§YYellow§! = Your nation\n§4Pale Blue§! = 1st Influencer (dominant)\n§lSky Blue§! = 2nd or 3rd Influencer\n§2Blue§! = 4th to 7th Influencer\n§PMagenta§! = Auto-Influenced Nation (monthly)\n§RRed§! = Spread Influence Cooldown (recently targeted)\n§gDark Gray§! = No influence\n\nColors follow the §YMap Mode Colors§! choice in Automation Settings.\nUpdated weekly."
 MAPMODE_GCC_MAP_MODE_NAME: "GCC"
 MAPMODE_GCC_MAP_MODE: "GCC"
 MAPMODE_GCC_MAP_MODE_DESCRIPTION: "湾岸協力会議の加盟国および潜在的な加盟候補国を表示する。"
 GCC_map_mode_tooltip: "湾岸協力会議"
 GCC_map_mode_tooltip_delayed: "Shows the current membership of the Gulf Cooperation Council (GCC).\n\n§Y[FROM.CONTROLLER.GetNameWithFlag]§!: §Y[FROM.CONTROLLER.map_mode_GCC_status]§!\n\n§YColor Legend:§!\n§CTeal§! = GCC Member State\n§GYellow-Green§! = Potential Member State\n\nUpdated weekly."
 MAPMODE_SCO_MAP_MODE_NAME: "SCO"
 MAPMODE_SCO_MAP_MODE: "SCO"
 MAPMODE_SCO_MAP_MODE_DESCRIPTION: "上海協力機構の加盟国、オブザーバー、および潜在的な加盟候補国を表示する。"
 SCO_map_mode_tooltip: "上海協力機構"
 SCO_map_mode_tooltip_delayed: "Shows the current membership of the Shanghai Cooperation Organisation (SCO).\n\n§Y[FROM.CONTROLLER.GetNameWithFlag]§!: §Y[FROM.CONTROLLER.map_mode_SCO_status]§!\n\n§YColor Legend:§!\n§OOrange§! = SCO Member State\n§0Purple§! = Observer State\n§4Light Blue§! = Dialogue Partner\n§YYellow§! = Potential Member State\n\nUpdated weekly."
 MAPMODE_GDP_C_MAP_MODE_NAME: "1人当たりGDP"
 MAPMODE_GDP_C_MAP_MODE: "1人当たりGDP"
 MAPMODE_GDP_C_MAP_MODE_DESCRIPTION: "国家の1人当たりGDPを表示する。これは、1人当たりの平均経済生産高を表している。"
 gdp_c_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]の1人当たりGDP"
 gdp_c_map_mode_tooltip_delayed: "GDP per capita of §Y[FROM.CONTROLLER.GetNameWithFlag]§! is: §Y$[?FROM.CONTROLLER:gdp_per_capita|Y]K§!.\n\nGDP per capita represents the economic output per person. Higher values indicate a wealthier, more productive economy.\n\n§YColor Legend:§!\n§nNavy§! = Below 8K (Low income)\n§lDark Teal§! = 8K - 18K (Lower-middle income)\n§5Teal§! = 18K - 32K (Middle income)\n§6Sea Green§! = 32K - 60K (Upper-middle income)\n§7Light Green§! = 60K - 110K (High income)\n§WPale Yellow§! = Above 110K (Extremely wealthy)\n\nBrighter is wealthier.\nUpdated with the weekly economic tick."
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_NAME: "電力不足率"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE: "電力不足率"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_DESCRIPTION: "国家の現在の電力不足率を表示する。"
 energy_consumption_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]の電力不足率"
 energy_consumption_map_mode_tooltip_delayed: "Energy Consumption Unfulfillment in §Y[FROM.CONTROLLER.GetNameWithFlag]§! is: §Y[?FROM.CONTROLLER:unfulfilled_energy_demand_var|%+]§!\n\nThis shows the percentage of energy demand that is not being met. A negative value means demand exceeds supply (energy deficit).\n\n§YColor Legend:§!\n§nNavy§! = Below -30% (Severe deficit)\n§lDark Teal§! = -30% to -18% (Moderate deficit)\n§5Teal§! = -18% to -12% (Mild deficit)\n§6Sea Green§! = -12% to -4% (Nearly met)\n§7Light Green§! = -4% to -1% (Almost met)\n§WPale Yellow§! = Above -1% (Fully met)\n\nDarker is worse. Invest in energy production to improve.\nUpdated with the weekly economic tick."
 MAPMODE_PRODUCTIVITY_MAP_MODE_NAME: "生産性"
 MAPMODE_PRODUCTIVITY_MAP_MODE: "生産性"
 MAPMODE_PRODUCTIVITY_MAP_MODE_DESCRIPTION: "州の現在の生産性を表示する。これは、労働者一人あたりの経済生産効率を表している。"
 productivity_map_mode_tooltip: "[FROM.GetName]の生産性"
 productivity_map_mode_tooltip_delayed: "Productivity in §Y[FROM.GetName]§! is: §Y[?FROM.productivity_state_var|Y]§!\n\nProductivity measures the economic output efficiency of a state. Higher values mean more economic output per worker.\n\n§YColor Legend:§!\n§nNavy§! = Below 200 (Very low)\n§2Blue§! = 200 - 500 (Low)\n§lDark Teal§! = 500 - 800 (Below average)\n§3Steel Blue§! = 800 - 1200 (Average)\n§5Teal§! = 1200 - 1900 (Above average)\n§6Sea Green§! = 1900 - 3800 (High)\n§7Light Green§! = 3800 - 5000 (Very high)\n§WPale Yellow§! = Above 5000 (Outstanding)\n\nBrighter is more productive.\nUpdated with the weekly economic tick."
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_NAME: "再生可能エネルギー補正"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE: "再生可能エネルギー補正"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_DESCRIPTION: "風力、太陽光、その他の地理的要因に基づいた、各州の自然の再生可能エネルギー潜在能力を表示する。"
 renewable_energy_hotspot_map_mode_tooltip: "[FROM.GetName]の再生可能エネルギー補正"
 renewable_energy_hotspot_map_mode_tooltip_delayed: "Renewable Energy Capacity Bonus in §Y[FROM.GetName]§! is: §Y[?FROM.state_renewable_capacity_factor_modifier_var|Y]§!\n\nThis is a multiplier on the state's renewable output: §Y1.0§! is the world average, so a state at 1.5 produces 1.5x the average and one at 0.5 half of it.\n\n§YColor Legend (1.0 = world average):§!\n§nNavy§! = Below 0.6 (very poor)\n§3Dark Blue§! = 0.6 - 0.8 (poor)\n§lDark Teal§! = 0.8 - 1.0 (slightly below average)\n§5Teal§! = 1.0 - 1.2 (above average)\n§6Sea Green§! = 1.2 - 1.45 (well above average)\n§7Light Green§! = 1.45 - 1.6 (outstanding)\n§WPale Yellow§! = Above 1.6 (exceptional)\n\nBrighter is better.\nThis value is fixed and does not change over time."
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_NAME: "失業率"
 unemployment_rate_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]の失業率"
 unemployment_rate_map_mode_tooltip_delayed: "Unemployment Rate in §Y[FROM.CONTROLLER.GetNameWithFlag]§! is: §Y[?FROM.CONTROLLER:total_unemployed_percentage_display|%Y]§!\n\nThis shows the percentage of the working-age population that is unemployed.\n\n§YColor Legend:§!\n§nNavy§! = Above 35% (Crisis)\n§lDark Teal§! = 22% - 35% (Very high)\n§5Teal§! = 10% - 22% (High)\n§6Sea Green§! = 5% - 10% (Moderate)\n§7Light Green§! = 2% - 5% (Low)\n§WPale Yellow§! = Below 2% (Full employment)\n\nDarker is worse. Reduce unemployment through economic growth and policy.\nUpdated with the weekly economic tick."
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE: "失業率"
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_DESCRIPTION: "この地図モードでは、各国の現在の失業率を労働年齢人口に対する割合として表示している。"
 MAPMODE_SUBIDEOLOGY_MAP_MODE_NAME: "与党"
 MAPMODE_SUBIDEOLOGY_MAP_MODE: "与党"
 MAPMODE_SUBIDEOLOGY_MAP_MODE_DESCRIPTION: "Shows the subideology of the party ruling each country, with the vote share of the governing parties on hover."
 subideology_map_mode_tooltip: "Ruling party of [FROM.CONTROLLER.GetNameWithFlag]"
 subideology_map_mode_tooltip_delayed: "§H[FROM.CONTROLLER.GetNameWithFlag]§!\n\n§HRuling Party:§![FROM.CONTROLLER.map_mode_ruling_party]\n\n§HGovernment Coalition:§![FROM.CONTROLLER.map_mode_coalition_none][FROM.CONTROLLER.L_coal_elect_percent_0][FROM.CONTROLLER.L_coal_elect_percent_1][FROM.CONTROLLER.L_coal_elect_percent_2][FROM.CONTROLLER.L_coal_elect_percent_3][FROM.CONTROLLER.L_coal_elect_percent_4][FROM.CONTROLLER.L_coal_elect_percent_5][FROM.CONTROLLER.L_coal_elect_percent_6][FROM.CONTROLLER.L_coal_elect_percent_7][FROM.CONTROLLER.L_coal_elect_percent_8][FROM.CONTROLLER.L_coal_elect_percent_9][FROM.CONTROLLER.L_coal_elect_percent_10][FROM.CONTROLLER.L_coal_elect_percent_11][FROM.CONTROLLER.L_coal_elect_percent_12][FROM.CONTROLLER.L_coal_elect_percent_13][FROM.CONTROLLER.L_coal_elect_percent_14][FROM.CONTROLLER.L_coal_elect_percent_15][FROM.CONTROLLER.L_coal_elect_percent_16][FROM.CONTROLLER.L_coal_elect_percent_17][FROM.CONTROLLER.L_coal_elect_percent_18][FROM.CONTROLLER.L_coal_elect_percent_19][FROM.CONTROLLER.L_coal_elect_percent_20][FROM.CONTROLLER.L_coal_elect_percent_21][FROM.CONTROLLER.L_coal_elect_percent_22][FROM.CONTROLLER.L_coal_elect_percent_23]\n\n§HTotal Government Support:§! §Y[?FROM.CONTROLLER:government_coalition_strength_elect|%1]§!\n\nPercentages are the vote share each party won at the last election, so nations that have never held one show 0.0%.\n\n§YColor Legend:§!\nEvery party has its own color, checked to stay readable with red-green and blue-yellow color blindness. Hover a country to see its ruling party.\n\nUpdated whenever a government changes."
 map_mode_ruling_party_text: "\n[show_ruling_party] ([?party_pop_elect_array^ruling_party|%1])"
 map_mode_coalition_none_text: "\nNone (single-party government)"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE_NAME: "Reserve Currency"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE: "Reserve Currency"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE_DESCRIPTION: "Shows the reserve currency each country holds under its Reserve Currency Policy."
 reserve_currency_map_mode_tooltip: "Reserve currency of [FROM.CONTROLLER.GetNameWithFlag]"
 reserve_currency_map_mode_tooltip_delayed: "§Y[FROM.CONTROLLER.GetNameWithFlag]§!\n\nReserve Currency Policy: §Y[FROM.CONTROLLER.map_mode_reserve_currency]§!\n\n§YColor Legend:§!\n§lBlue§! = Dollar\n§nDeep Blue§! = Euro\n§RRed§! = Yuan\n§GDark Green§! = Rouble\n§WWhite§! = Yen\n§YYellow§! = Pound\n§pPink§! = Franc\n§OOrange§! = Guilder\n§7Light Green§! = Real\n§0Purple§! = Bitcoin\n§gDark Gray§! = Domestic Reserve\n\nColors follow the §YMap Mode Colors§! choice in Automation Settings.\nUpdated with the weekly economic tick."
 map_mode_member_state: "Member State"
 map_mode_potential_member_state: "Potential Member State"
 map_mode_not_a_member: "Not a Member"