 AFG_pomegranate_investment1_collect: "석류 수확"
 AFG_pomegranate_investment1_collect_desc: "농민들이 석류 한 트럭 분량을 우리가 가져가도록 준비해 두었습니다."
 AFG_almond_investment1_collect: "아몬드 수확"
 AFG_almond_investment1_collect_desc: "농민들이 아몬드 한 트럭 분량을 우리가 가져가도록 준비해 두었습니다."
 AFG_almond_investment1: "아몬드 생산 투자"
 AFG_almond_investment1_desc: "Almonds have been a major source of income for many Afghans. The government can invest in the almond industry by providing infrastructure, transportation, and market access for farmers. This investment program is limited to 5 major initiatives, after which the market reaches saturation. Investment: 5% GDP, Returns: 8% GDP (60% profit margin)."
 AFG_pomegranate_investment1: "석류 생산 투자"
 AFG_pomegranate_investment1_desc: "아프가니스탄의 석류는 그 품질로 전 세계에 명성이 높습니다. 정부는 생산 시설과 무역망에 투자하여 이 천연 자원을 활용할 수 있습니다. 이 투자 계획은 5개의 주요 사업으로 제한되며, 그 이후에는 시장이 포화 상태에 이릅니다. 투자: GDP의 5%, 수익: GDP의 6% (이윤율 20%)."
 AFG_invite_nahzat_e_melli_ye_into_government: "헤즈브-에 누흐자트-에 밀리 아프가니스탄을 정부에 초청"
 AFG_domestic_decisions: "국내 목표"
 AFG_domestic_decisions_desc: "회복 중인 국가로서 우리는 국가를 재건하고 새로운 미래를 개척하기 위한 목표를 수립했습니다."
 AFG_taloqan_siege_mission: "도시 사수"
 AFG_taloqan_siege_mission_desc: "우리 영토가 줄어드는 가운데 도시를 지키는 것은 매우 중요하며, 북서부의 광활한 평원은 향후 공세를 위한 매력적인 목표가 됩니다."
 AFG_headquarters_taloqan: "탈로칸 사령부"
 AFG_headquarters_taloqan_desc: "탈로칸은 소련 침공 당시 아흐마드 샤 마수드의 핵심 거점으로 부상했습니다. 이후 1997년 마자르이샤리프가 탈레반 세력에 함락된 뒤에는 타지키스탄으로 통하는 중요한 관문으로서 [AFG.GetFlag] [AFG.GetNameDefCap]의 중앙 지휘 본부가 되었습니다."
 taliban_insurgency_category: "탈레반 반란"
 taliban_insurgency_category_desc: "£GFX_AFG_salafist_jihadism §Y탈레반§! 세력은 연합군에 의해 격파되었으나 완전히 소멸되지는 않았으며, 탈레반 무장세력은 조각조각 흩어진 채 아프가니스탄 곳곳에서 §R반란§!을 일으키고 새 정부와 연합군을 상대로 각종 §R테러 공격§!을 벌이기 시작했습니다. 탈레반 반란을 근절하는 데에는 여러 요인에 따라 수년이 걸릴 것으로 예상됩니다.\n\n§Y탈레반 세력§!은 국내 탈레반 무장세력의 강도를 나타내며, 그 증가와 반란 소탕의 효율은 §Y중앙 정부에 대한 신뢰(안정도, 부패, 외세의 간섭)§!와 §Y아프가니스탄-파키스탄 국경 상황§!에 좌우됩니다. §Y탈레반 세력§!이 너무 높아지면 £GFX_AFG_salafist_jihadism §Y탈레반§!은 §R테러 공격§!을 벌일 수 있으며, 이를 §R내전 재발§!로까지 확대할 수도 있습니다. 한편 일부 방법은 단기적으로 탈레반의 위협에 대응하는 데 효과적일 수 있습니다.\n\n§Y탈레반 세력§!: [?AFG.taliban_strength]%"
 AFG_pashtunistan_decisions: "파슈툰스탄 통일"
 AFG_pashtunistan_decisions_desc: "파키스탄 인구의 약 16%는 아프가니스탄의 최대 민족 집단인 파슈툰인으로 정체화하고 있습니다. 파키스탄의 파슈툰인 대부분은 이 나라의 북서부에 살고 있습니다. 파키스탄 내전으로 인해 이들 중 다수가 이제 끔찍한 정권 아래에서 고통받고 있습니다. 이들을 보호하는 것이 우리의 의무입니다."
 AFG_russian_airlift_is_active: "러시아 공중 수송 보유"
 AFG_donkey_logistics_tech: "짐승 운반 군수"
 AFG_donkey_logistics_tech_desc: "노새와 당나귀 행렬이 어떤 트럭도 닿을 수 없는 고갯길로 보급품을 운반합니다."
 AFG_donkey_logistics_tech2: "짐승 운반 군수 II"
 AFG_donkey_logistics_tech2_desc: "더 큰 규모의 대상과 북부 경로를 따라 확립된 집결지."
 AFG_donkey_logistics_tech3: "짐승 운반 군수 III"
 AFG_donkey_logistics_tech3_desc: "한 번도 멈춘 적 없는 짐승 운반대를 중심으로 구축된 상설 수송 군단."
 AFG_legacy_of_the_mujahideen: "무자헤딘의 유산"
 AFG_legacy_of_the_mujahideen_desc: "소련과의 전쟁에 참전한 노병들이 야전 기술을 민병에게 전수합니다."
 AFG_tech_the_farmer_and_their_rifle: "농민과 그들의 소총"
 AFG_tech_the_farmer_and_their_rifle_desc: "자신의 계곡을 위해 싸우며 그곳의 모든 접근로를 알고 있는 농촌 징집병들."
 AFG_tech_training_of_local_police_officers: "현지 경찰관 훈련"
 AFG_tech_training_of_local_police_officers_desc: "싸울 뿐만 아니라 치안도 유지하고, 점령한 지역을 지킬 수 있도록 훈련받은 민병."
 AFG_tech_return_of_dostum: "도스툼의 귀환"
 AFG_tech_return_of_dostum_desc: "도스툼이 북부로 돌아왔으며, 우즈베크 민병들은 그에 걸맞게 싸웁니다."
 AFG_the_lion_of_panjshir: "판지시르의 사자"
 AFG_the_lion_of_panjshir_desc: "고지를 점거하고 그곳에서 타격한다는 마수드의 교리."
 AFG_karzai_installed: "카르자이 정부 출범"
 AFG_political_path_chosen: "정치적 노선이 선택되었다"
 AFG_border_wars.7.c: "아프가니스탄인들의 문제다"
 AFG_border_wars.8.c: "아프가니스탄인들의 문제다"
 AFG_request_american_return: "[USA.GetFlag] 미국의 복귀 요청"
 AFG_request_american_return_desc: "미국이 떠나자 탈레반은 더욱 강해져 돌아왔습니다. 우리 힘만으로 그들을 막을 수 없다면, 워싱턴에 병력을 다시 보내 달라고 요청할 수 있습니다."
 AFG_taliban_threat_overwhelming_tt: "우리가 §Y탈레반§!과 전쟁 중이거나 §Y탈레반 세력§!이 최소 §Y50§!임"
 AFG_american_return_tt: "[USA.GetFlag] §Y미국§!이 아프가니스탄으로 복귀합니다. 우리는 미국의 종속국이 되고, 미국은 우리가 §Y탈레반§!에 맞서 치르는 모든 전쟁에 참전하며, 미국의 주둔으로 반란이 진행되는 동안 매달 §Y탈레반 세력§!이 §G2§! 감소합니다."