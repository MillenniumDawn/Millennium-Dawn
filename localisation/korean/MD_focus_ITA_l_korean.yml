 mafia.29.d: "약간의 뇌물과 다른 부추김으로 한 조직이 다른 가문의 작전에 간섭하도록 설득할 수 있을지도 모릅니다. 한쪽을 강화시키는 대신 다른 쪽을 크게 약화시킬 수 있습니다. \n\n 이제 어느 조직을 표적으로 삼을지 선택해야 합니다."
