 IRQ_educational_restructuring: "教育再編"
 IRQ_restructured_police: "再編警察"
 IRQ_all_walks_of_life: "あらゆる階層"
 IRQ_raad_bin_zeid: "ラアド・ビン・ゼイド"
 IRQ_free_forces_irq: "イラク自由軍"
 IRQ_sadrist_forces: "サドル派勢力"
 IRQ_american_springboard: "アメリカの踏み台"
 IRQ_party_coffers: "党資金"
 IRQ_empowering_shias: "シーア派強化"
 IRQ_militia_reliance: "民兵への依存"
 IRQ_oil_auctions: "石油オークション"
 IRQ_pmf_deployed: "PMF展開"
 IRQ_iranian_military_companies: "イラン軍事産業"
 IRQ_army_of_the_revolution: "革命軍"
 IRQ_constitutional_manipulation: "憲法操作"
 IRQ_islam_over_state: "国家よりイスラム"
 IRQ_war_against_propaganda: "プロパガンダとの戦い"
 IRQ_gate_to_the_world: "世界への門"
 IRQ_quds_advice: "コッズ部隊の助言"
 IRQ_irgc_expertise: "IRGC専門知識"
 IRQ_equality_society: "社会における平等"
 IRQ_al_ansar_resurgence: "アル・アンサール再興"
 IRQ_expulsion_of_iranian_idea: "Expulsion of Iranians"
 IRQ_expulsion_of_foreigners_idea: "外国人追放"
 IRQ_democratic_youth_federation_idea: "民主青年連盟"
 IRQ_power_of_the_unions: "労働組合の力"
 IRQ_al_hawasim: "アル・ハワシム"
 IRQ_mahdi_army_expansion_idea: "マフディー軍拡大"
 IRQ_untrustworthy_neighbors: "信用できない隣人"
 IRQ_the_lions_den: "The Lion's Den"
 IRQ_strategic_partnerships: "戦略的パートナーシップ"
 IRQ_sadrist_militias: "サドル潮流"
 IRQ_sadrist_militias_desc: "Saraya al-Salam, the latest incarnation of the Mahdi Army, is the militia of the Sadrist Movement which is fighting on the frontlines together with the Iraqi Army. Its leader, Muqtada al-Sadr is a popular Iraqi Shia cleric and politician who has inherited his movement from his popular father. His platform is based on a cocktail of political Shiite Islam, Anti-Americanism, Iraqi independence from Iranian influence and Iraqi populist nationalism."
 IRQ_threat_of_al_qaeda: "迫り来る災害"
 IRQ_threat_of_al_qaeda_desc: "The dissolution of the [IRQ.GetFlag] Iraqi Armed Forces meant that many soldiers and commanders were left without a job. This led to many elements within the army aligning themselves with various extremist groups in the nation, one of which being [AIQ.GetFlag] Al-Qaeda in Iraq. If left unchecked, then this group may launch an attack against our government.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if we resolve the §HInsurgency Crisis§!"
 IRQ_sunni_dynamic_idea: "スンニ派政治影響力"
 IRQ_sunni_dynamic_idea_desc: "The Sunni community within our nation has mobilized in order to preserve their identity, way of life, and sense of being. Due to the rise of Shi'ism, and the marginalization of the Sunnis in political life, their mobilization will work against our nation's interests.\n§W-----------------------------------------------------------------§!\nThis national spirit will change dynamically every §H10§! levels that the §HSunni Political Variable§! changes by. Currently, Sunni Political Influence is at §H[?IRQ_sunni_political_influence]/100§!\n§W-----------------------------------------------------------------§!\nWhile this national spirit is active, §H[AIQ.GetFlag] Al-Qaeda in Iraq§! can start a §Rcivil war§! if Salafism is §H20%§! or greater, stability is less than §H55%§!, and our state religion is §HShia§!"
 IRQ_triumph_over_america: "アメリカに対する勝利"
 IRQ_triumph_over_america_desc: "Our soldiers taught a lesson to the Americans that they will never forget."
 IRQ_mosque_income_idea: "増加したモスク税"
 IRQ_mosque_income_idea_desc: "国内の様々なプロジェクトに資金を提供するために、モスクからの税金を増加させた。"
 IRQ_PIJ_idea: "PIJ旅団"
 IRQ_PIJ_idea_desc: "PIJ Brigades are currently operating in our nation, and will help us fight back against the Zionist state.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if the §HBa'athist party§! is no longer in power, or [ISR.GetFlag] §HIsrael§! no longer exists."
 IRQ_cult_of_saddam: "サダム崇拝"
 IRQ_cult_of_saddam_desc: "Our great leader, Saddam Hussein, has brought great wealth and dignity to [IRQ.GetFlag] Iraq. His contributions must be cherished while he is still around.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if the §HBa'athist party§! is no longer in power, or if §HSaddam Hussein§! is no longer the leader."
 IRQ_air_support_granted: "反乱軍に対する空爆支援"
 IRQ_air_support_granted_desc: "空軍は、国内の反乱軍に対する空爆支援を提供するために昼夜を問わず働いている。"
 IRQ_recovering_from_the_gulf_war: "湾岸戦争からの回復"
 IRQ_recovering_from_the_gulf_war_desc: "壊滅的な湾岸戦争の余波で、イラクは混乱と破壊の状態にある。激しい空爆と地上作戦を特徴とするこの紛争は、国家に永続的な影響を残した重要な戦闘を目の当たりにした。最初の空爆とクウェート解放から、イラク軍を押し戻した地上作戦まで、戦争は大きな犠牲を強いた。"
 IRQ_MEK_bases: "MEK基地"
 IRQ_MEK_bases_desc: "Recognizing the strategic importance of the Mojahedin e Khalq (MEK) during the Iran-Iraq War, Iraq seeks to leverage their assistance and establish bases to enhance its military capabilities. This allows for the establishment of MEK bases within Iraq to threaten Iran, enabling an increase in the maximum number of volunteer forces that can be mobilized. Like its use in 1991 against the Kurds."
 IRQ_high_political_opposition: "高い政治的反対"
 IRQ_high_political_opposition_desc: "イラクは、多様な少数民族グループと宗教コミュニティを含む高い政治的反対に直面しており、重大な課題に直面している。"
 IRQ_bastion_of_baathism: "バース主義の砦"
 IRQ_bastion_of_baathism_desc: "イラクの肥沃な土壌で、バース主義の種が蒔かれ、時代の課題と願望の中で発芽した。国家統一、アラブ国民主義、社会正義の追求への願望に駆られた先見的な指導者たちが現れた。アラブ人が永遠に一つであらんことを！"
 IRQ_international_sanctions: "国際制裁"
 IRQ_international_sanctions_desc: "2000年、イラクは1991年の湾岸戦争後に課せられた国際制裁の有害な影響に直面した。これらの制裁は、イラクが国際貿易に従事する能力を厳しく制限し、経済回復を妨げ、イラク国民の生活水準の低下をもたらした。制裁はまた、医療、必須サービス、基本的ニーズに必要な資源へのアクセスに影響を与える重大な人道的結果をもたらした。これらの制裁の長期的な影響は、この期間中のイラクの経済的および社会的状況を形成した。"
 IRQ_conscriptions_in_schools: "学校での徴兵"
 IRQ_conscriptions_in_schools_desc: "子供たちを軍隊に入隊させるために授業をサボらせている。"
 IRQ_fadayyene_saddam: "ファダィーイーン・サッダーム民兵"
 IRQ_fadayyene_saddam_desc: "国家周辺に防御陣地を設置するために、ファダィーイーン・サッダームのいくつかの部隊を命じた。"
 IRQ_kurdish_friends: "[KUR.GetFlag]クルド人の友人"
 IRQ_kurdish_friends_desc: "The [KUR.GetFlag] Kurds have historically been ousted by most nations in the region, thus isolating them and leaving them with little to no friends. It's about time that we strengthen our friendship with the [KUR.GetFlag] Kurds, so that we may get what we want, liberation, freedom, and independence from foreign powers."
 IRQ_negotiations_with_kurdish_government: "[KUR.GetFlag]クルド人政府との交渉"
 IRQ_negotiations_with_kurdish_government_desc: "[KUR.GetFlag]クルド人政府とのコミュニケーションラインを開くことにより、流血なしにクルド人を国家に再統合することができるかもしれない。"
 IRQ_bolster_communist_party_of_kurdistan_iraq: "[KUR.GetFlag]クルディスタンにおける£KUR_Neutral_Communism_small 共産主義思想の強化"
 IRQ_bolster_communist_party_of_kurdistan_iraq_desc: "The [KUR.GetFlag] Kurdish people need one thing, and that is independence and liberation from all forms of foreign exploitation. By promoting communist ideals in [KUR.GetFlag] Kurdistan, we may be able to sway their people to finally join us hand in hand in this movement."
 IRQ_request_an_election: "選挙の要請"
 IRQ_request_an_election_desc: "現在の[KUR.GetFlag]クルド人政府に選挙を実施するよう圧力をかけることにより、[KUR.GetFlag]クルド人共産主義者はついに正当な議席を獲得する機会の窓を得るかもしれない。"
 IRQ_rojava_shipments: "[ROJ.GetFlag]ロジャヴァへの輸送開始"
 IRQ_rojava_shipments_desc: "[SYR.GetFlag]シリア政府は歴史的に[ROJ.GetFlag]ロジャヴァ地域のクルド人を抑圧しており、可能な限り必要な支援を与えることによってこれらの人々を解放する方法を見つけなければならない。"
 IRQ_shipping_to_rojava: "輸送中……"
 IRQ_shipping_to_rojava_desc: "貨物トラックの車輪はシリアの土壌の上をぐるぐる回る。"
 IRQ_political_decisions: "イラク国内政治"
 IRQ_recall_nsa_bahrain: "NSAバーレーン掌握"
 IRQ_recall_nsa_bahrain_desc: "アメリカ人が占領している土地、NSAバーレーンの支配権を掌握し、統合する時が来た！"
 IRQ_mek_revolt_trig: "反乱"
 IRQ_mek_revolt_trig_desc: "今日、MEKの友人たちにイランへの国境を越えた侵攻を開始させ、ムッラー政権をきっぱりと転覆させることができる！"
 IRQ_the_blood_quran: "「血のクルアーン」完成"
 IRQ_the_blood_quran_desc: "サダム・フセインの血を使って書かれた血のクルアーンを完成させ発表することにより、政府は[IRQ.GetFlag]イラク国民の間で敬虔さを示そうとすることができるが、それは裏目に出る可能性もある……"
 IRQ_smuggle_goods_from_jordan: "[JOR.GetFlag]ヨルダンからの物品密輸"
 IRQ_smuggle_goods_from_jordan_desc: "フセイン家は[JOR.GetFlag]ヨルダンの特定の個人と多くのつながりを持っており、それらのつながりを使って、政府に気づかれずに国境を越えていくつかの物品を密輸することができる。"
 IRQ_al_salam_palace: "アル・サラーム宮殿の再設計"
 IRQ_al_salam_palace_desc: "The Al-Salam Palace was initially designed in 1950, more than 50 years ago, and since then the palace has begun showing its age. Redesigning certain aspects of it could be useful in helping [IRQ.GetLeader] clear his mind when he needs to."
 IRQ_arrest_muqtada: "ムクタダー・アッ＝サドル逮捕"
 IRQ_arrest_muqtada_desc: "That cockroach Muqtada has been running his mouth recently, and just like his father, we might need to find a solution."
 IRQ_civil_war_mechanic: "反乱危機"
 IRQ_civil_war_mechanic_desc: "§Hサダム政権§!の崩壊はイラク軍の完全な崩壊につながった。我々の§H元軍人§!の多くは、自分たちの組織のためであれ§Rジハード主義者§!のためであれ、国家§Rに対して§!戦争を戦うことに人生を捧げてきた。我々は当初§Rサラフィスト§!と紛争状態にあるが、もし同盟を結ばなければ§Hシーア派§!はすぐに敵対的になる可能性がある。彼らが十分に弱体化したときに§H降伏§!するまで、各州で反乱軍を攻撃する必要がある。我々の§H即応性§!は作戦における成功を決定するだろう。§H即応性§!は、より多くの作戦を行うか、特定のNFを取得するにつれて向上するだろう。\n\n州をクリックすることで作戦を行うことができる。実施するすべての作戦で§H装備§!と§H人員§!を失うだろう。\n\nマップは§H進捗§!を表示するために§H動的に§!色が変わるだろう。\n\n§p紫色§! - クルド軍\n§R赤色§! - サラフィスト・ジハード主義軍\n§Y黄色§! - シーア派軍\n§Oオレンジ色§! - 中程度の反乱\n§G緑色§! - 低い反乱\n\n§H即応性§!: [?IRQ_government_readiness]%\n§H人員§!: [?IRQ_government_troops]\n§H確保された州§!: [?IRQ_variable_for_win]\n\n\n\n\n\n"
 IRQ_start_negotiations_shias: "シーア派民兵との交渉開始"
 IRQ_start_negotiations_shias_desc: "共通の敵を破壊するための取引を結ぶために、形成された多くのシーア派民兵と交渉のテーブルにつくだろう。もし十分に早く彼らを味方に引き入れるのに失敗すれば、彼らは敵対的になるかもしれない！"
 IRQ_request_coalition_forces: "空爆支援要請"
 IRQ_request_coalition_forces_desc: "もし空軍が一日中何もしないなら、なぜパイロットに給料を払っているのか？空における我々のてこを使って、反乱軍を服従させなければならない。"
 IRQ_request_awakening_council_militias: "アル・サフワ（覚醒評議会）のための協議促進"
 IRQ_request_awakening_council_militias_desc: "アル・サフワ、またはイラクの息子たちは、反乱軍と戦うためにスンニ派部族と他のグループの間で提案された同盟である。反乱軍に対して数的優位を保つために、彼らの部隊を組み込むことができる。"
 IRQ_militarize_police_force: "警察部隊の軍事化"
 IRQ_militarize_police_force_desc: "警察部隊から武器と人員を奪取し、彼らを軍隊に入隊させて反乱軍と戦うのを助けるだろう、たとえ彼らの訓練で手を抜かなければならなくても。"
 IRQ_recruitment_campaign: "訓練努力"
 IRQ_recruitment_campaign_desc: "反乱軍と安全かつ効率的に対処するために、兵士を訓練し、条件付けなければならない。これを行うことはまた、危険にさらされる命を少なくするのに役立つだろう。"
 IRQ_iraq_war: "生存のための戦い"
 IRQ_iraq_war_desc: "The war for Iraq and its lands has begun. The United States will have a maximum of 6 months to capitulate the Iraqi government, or else they will have to order an immediate withdrawal from the nation and risk their influence."
 IRQ_war_phase_one: "フェーズI"
 IRQ_war_phase_two: "フェーズII"
 IRQ_war_phase_two_desc: "アメリカ人はよろめくだろう、彼らの努力は無駄になるだろう！"
 IRQ_preparation_for_the_war: "戦争"
 IRQ_preparation_for_the_war_desc: "[USA.GetFlag]§H[USA.GetName]§!の帝国主義者たちは、我が国に対する§R不当な§!キャンペーンを開始した！\n\n我々は国家の力と資源を結集し、§H生存のための戦争に備えなければならない§!。我々が持っているものと、§Hイラン戦争§!および§H湾岸戦争§!からの経験を使って、入ってくる侵略者にとって絶対的な地獄を作り出すだろう。\n\nもし我々がアメリカ人を§H少なくとも6ヶ月§!撃退することに成功すれば、彼らの国民は戦争の不人気のために§H停戦§!を彼らに圧力をかけるだろう！"
 IRQ_threaten_kuwait: "[KUW.GetFlag]クウェートを脅迫"
 IRQ_threaten_kuwait_desc: "The Americans have a base right under our nose, and the Kuwaitis are at fault for this. We will demand that they swiftly take control so that the Americans cannot attack us from Middle Eastern lands."
 IRQ_restore_the_iron_ring: "鉄の輪の回復"
 IRQ_restore_the_iron_ring_desc: "鉄の輪は80年代のイラン・イラク戦争でイラン人に対する防御に役立つことが証明された。我々は迅速にそれを元に戻さなければならない。"
 IRQ_golden_guard_divisions: "黄金警備隊師団の編成"
 IRQ_golden_guard_divisions_desc: "国家防衛のためにいくつかの黄金警備隊師団を動員し、可能な限り絶対的に最高の程度まで訓練するだろう。"
 IRQ_conscription_in_schools: "学校での徴兵"
 IRQ_conscription_in_schools_desc: "We absolutely must get more manpower to field our units in the time of war, and schools are a perfect location for this very reason. They can get an education later."
 IRQ_kurdish_compromise: "[KUR.GetFlag]クルド人との妥協"
 IRQ_kurdish_compromise_desc: "We will come to an agreement with the [KUR.GetFlag] Kurds, and secure our northern front from any sudden attacks if they accept, that is."
 IRQ_faddayean_saddam: "ファダィーイーン・サッダームの動員"
 IRQ_faddayean_saddam_desc: "We need to prepare the Fedayeen Saddam for the incoming invasion, and by all means we must equip and train more divisions to continue the fight no matter what."
 IRQ_weapons_concealment: "ミサイル計画の強化"
 IRQ_weapons_concealment_desc: "もし必要ならば遠くから敵を壊滅させるために、ミサイル計画を迅速に強化する必要がある。"
 IRQ_contract_the_MEK: "£PER_anarchist_communism MEKとの契約"
 IRQ_contract_the_MEK_desc: "Mojahedin-e Khalq, or the £PER_anarchist_communism MEK have been residing in our country for a very long time. It is about time that we have them do something actually useful for our nation."
 IRQ_economic_union_menu: "イスラム繁栄連合"
 IRQ_invite_to_economic_union_targeted_decision: "Invite [FROM.GetName]"
 IRQ_kick_from_economic_union_targeted_decision: "[FROM.GetName]を追放"
 IRQ_the_constitution: "イラク憲法"
 IRQ_the_constitution_desc: "Following the overthrow of §YSaddam Hussein§!, and the subsequent §YBa'athist§! Party, our nation has been tasked with §YDrafting a new constitution§! for a more §YDemocratic, and Free Iraq§!. Each §YArticle§! of the §YConstitution§! that we draft will have an §YImpact§! on the future of which political parties can be elected, and who could be in politics."
 IRQ_constitution_draft_government_type: "第I条: イラク政府"
 IRQ_constitution_draft_government_type_desc: "憲法は、国家がイスラム共和国になるか、世俗共和国になるかを明記しなければならない。"
 IRQ_constitution_draft_languages: "第II条: イラクの言語"
 IRQ_constitution_draft_languages_desc: "言語は国民を団結させるものであり、大部分はアラビア語ではない別の言語を話す。他の言語を国家言語として許可するかどうかを決定しなければならない。"
 IRQ_constitution_draft_nationalism: "第三条：イラクにおける愛国主義"
 IRQ_constitution_draft_nationalism_desc: "歴史が示すように、過度の国粋主義と愛国主義は国家の終焉につながった。これを第III条で明確にしなければならない。"
 IRQ_constitution_draft_democratic_form: "第IV条: イラクの連邦化"
 IRQ_constitution_draft_democratic_form_desc: "国家はクルド人、アッシリア人、トルクメン人など、多くの異なる民族グループで構成されている。また、特にシーア派とスンニ派の間で、宗教宗派の大きな分裂もある。これらすべてを憲法で対処しなければならない。"
 IRQ_constitution_draft_militias: "第V条: イラクの安全保障"
 IRQ_constitution_draft_militias_desc: "国家は軍隊を持つだろうが、国民の多くは政府が安全を保つことを信用しておらず、そのため民兵を結成した。これらの民兵が合法であるかどうかを明確にしなければならない。"
 IRQ_constitution_draft_identity: "第VI条: イラクのアイデンティティ"
 IRQ_constitution_draft_identity_desc: "多くの民族がイラクを構成しており、イラクがアラブのアイデンティティを採用するか、多文化のアイデンティティを採用するかを明確にしなければならない。"
 IRQ_black_gold_decisions: "黒い金"
 IRQ_black_gold_decisions_desc: "Part of our post-victory plan is to secure economic domination in the region. Through the exploitation of corruption amongst the Southern Khaleeji states, we are able to slowly increase our grip over their most precious resource, oil. We will need to increase our influence in these nations in order to gain access to new decisions (such as buying up more shares) that will allow us to get one step closer to seizing these precious resources. Once we get more than 50% control over Aramco, we will be able to make an attempt to seize the company. The higher the control we have, the higher the chance of success will be.\n\n[SAU.GetFlag] Aramco Control: [?IRQ_aramco_control]/100"
 IRQ_open_aramco_scheme: "[SAU.GetFlag]アラムコ計画ディシジョンを開く"
 IRQ_close_aramco_scheme: "[SAU.GetFlag]アラムコ計画ディシジョンを閉じる"
 IRQ_find_dirt_on_saudi_king: "[SAU.GetLeader]に関する秘密を探る"
 IRQ_find_dirt_on_saudi_king_desc: "アラムコ株を手に入れる最初のステップは、[SAU.GetFlag][SAU.GetLeader]を脅迫するための何かを見つけることだろう。"
 IRQ_establish_the_hussein_fund: "フセイン基金の設立"
 IRQ_establish_the_hussein_fund_desc: "フセイン基金を設立することにより、組織を通じて[SAU.GetFlag]アラムコ株に資金を注ぎ込み、あまり注目を集めることなく行うことができるだろう。"
 IRQ_buy_shares_of_aramco: "株の購入"
 IRQ_buy_shares_of_aramco_desc: "今やフセイン基金があるので、[SAU.GetFlag]アラムコの少量の株を購入でき、この初期投資後に大量に購入できるようになる。"
 IRQ_prop_up_iraqi_ceo: "[IRQ.GetFlag]イラク人CEOの擁立"
 IRQ_prop_up_iraqi_ceo_desc: "いくつかの糸を引くことにより、[SAU.GetFlag]アラムコの新しいCEOとして[IRQ.GetFlag]イラク人CEOを擁立し、会社に対する支配力を高めることができる。"
 IRQ_seize_aramco: "[SAU.GetFlag]アラムコの掌握"
 IRQ_seize_aramco_desc: "時が来た、[SAU.GetFlag][SAU.GetName]の貴重な資源を確保するために、会社の積極的な乗っ取りを開始しなければならない！"
 IRQ_send_over_iraqis_to_saudi_arabia: "Send over [IRQ.GetFlag] Iraqis to [SAU.GetFlag] [SAU.GetName]"
 IRQ_send_over_iraqis_to_saudi_arabia_desc: "By paying for the flights of thousands of [IRQ.GetFlag] Iraqis, we are able to ensure proper [IRQ.GetFlag] Iraqi influence in [SAU.GetFlag] [SAU.GetName]."
 IRQ_encourage_iraqis_to_work_for_aramco: "Encourage [IRQ.GetFlag] Iraqis to Work for [SAU.GetFlag] Aramco"
 IRQ_encourage_iraqis_to_work_for_aramco_desc: "[SAU.GetName]に送った人々の結果として、会社内で潜在的なコネクションを確立するために、彼らを[SAU.GetFlag]アラムコで働かせることができる。"
 IRQ_buy_more_shares: "追加株の購入"
 IRQ_buy_more_shares_desc: "フセイン基金を通じて会社の株をさらに購入することにより、[SAU.GetFlag]アラムコの支配力を高めることができる。"
 IRQ_regional_baathism_decisions: "£IRQ_Nat_Autocracy_small 地域バース主義"
 IRQ_regional_baathism_decisions_desc: "我々の派閥は地域および世界中からの支持者を持っている。バース主義イデオロギーの信奉者を結集することにより、我々が支配する地域司令部のネットワークを創設することができる。高級で忠実なイラク当局者を指導者として配置することにより、これらの国家からの完全な忠誠を保証できる。"
 IRQ_appoint_control_syria: "£IRQ_Nat_Autocracy_small [SBP.GetFlag]シリア地域司令部の設立"
 IRQ_appoint_control_egypt: "Establish the £IRQ_Nat_Autocracy_small [EBP.GetFlag] Egyptian Regional Command"
 IRQ_appoint_control_jordan: "Establish the £IRQ_Nat_Autocracy_small [JBP.GetFlag] Jordanian Regional Command"
 IRQ_clergy_balance_of_power_category: "Return to Faith Campaign"
 IRQ_secularists_bop_mid_range: "イスラム主義と世俗主義の間"
 IRQ_secularists_bop_left_win_range: "世俗化された国家"
 IRQ_secularists_bop_left_advanced_range: "高度に世俗的な社会"
 IRQ_secularists_bop_left_medium_range: "社会における自由主義の成長"
 IRQ_secularists_bop_left_low_range: "中程度に世俗的な社会"
 IRQ_clergy_bop_right_win_range: "シャリーア国家"
 IRQ_clergy_bop_right_advanced_range: "イスラム社会"
 IRQ_clergy_bop_right_medium_range: "イスラム理想の再興"
 IRQ_clergy_bop_right_low_range: "穏健イスラム社会"
 IRQ_promote_female_participation: "女性参加の促進"
 IRQ_promote_female_participation_desc: "我々は女性が社会に参加し、労働力の不可欠な部分となることを奨励するだろう。"
 IRQ_promotion_of_iraqi_identity: "イラク・アイデンティティの促進"
 IRQ_promotion_of_iraqi_identity_desc: "Our people must know who they are, and their history, culture, and language are a part of their identity that must be reinforced."
 IRQ_restoration_of_ancient_sights: "Renovation of Historical Sites"
 IRQ_restoration_of_ancient_sights_desc: "我々の過去は我が国の非常に重要な部分であり、我々の人々はかつて達成した偉大さと、再び目指さなければならない偉大さを認識しなければならない。"
 IRQ_promotion_of_saddam: "バアス党業績の促進"
 IRQ_promotion_of_saddam_desc: "すべての通り、家、オフィス、学校には、バアス党史上最も偉大な指導者の肖像画がなければならない。我々の人々はこの国を築いたのが誰であり、誰に感謝すべきかを知らなければならない。"
 IRQ_power_of_mosques: "モスクの権力拡大"
 IRQ_power_of_mosques_desc: "モスクはこの国で権力を握っており、我々はそれと折り合いをつけなければならない。彼らの権力を拡大することによって、我々は彼らに我々が彼らの側にいることを示すことができる。"
 IRQ_crack_down_on_haram: "不道徳な活動への反撃"
 IRQ_crack_down_on_haram_desc: "我々の社会は西側帝国主義の装いによって腐敗させられてはならない。我々は可能な限りのあらゆる手段によってイラク社会へのこれらの浸透に反撃しなければならない。"
 IRQ_upholding_sharia: "シャリーアの支持"
 IRQ_upholding_sharia_desc: "土地の法はシャリーアであり、いくつかの悪人が社会規範を回避したい場合にそれを支持するのは我々の義務である。"
 IRQ_clergy_right_side: "イスラム主義者"
 IRQ_secularists_bop_left_side: "世俗主義者"
 IRQ_debaath_balance_of_power_category: "£IRQ_Nat_Autocracy_small De-Ba'athification of [IRQ.GetFlag] Iraq"
 IRQ_baathists_bop_right_low_range: "バアス党サークル"
 IRQ_baathists_bop_right_medium_range: "バアス党デモ"
 IRQ_baathists_bop_right_advanced_range: "バアス党再興"
 IRQ_baathists_bop_right_win_range: "バアス党クーデター"
 IRQ_antibaathists_bop_left_low_range: "政府の脱バアス化"
 IRQ_antibaathists_bop_left_medium_range: "バアス党員の迫害"
 IRQ_antibaathists_bop_left_advanced_range: "日常生活の脱バアス化"
 IRQ_antibaathists_bop_left_win_range: "イラクにおけるバアス主義の終焉"
 IRQ_antibaathists_bop_mid_range: "脆弱な政府"
 IRQ_antibaathists_bop_left_side: "反バアス主義者"
 IRQ_baathists_right_side: "バアス主義者"
 IRQ_anti_baath_sentiment_schools: "学校における反バアス感情"
 IRQ_anti_baath_sentiment_schools_desc: "フセイン家は権力の座にあった間、イラクの教育制度に大きな損害を与え、政府プロパガンダで学校に通ったすべての人々の脳を腐らせた。我々はその損害が元に戻され、我々の学生がバアス主義者の真の恐怖を認識することを保証する必要がある。"
 IRQ_anti_baath_ad_campaigns: "反バアス主義テレビキャンペーン"
 IRQ_anti_baath_ad_campaigns_desc: "The Iraqi populace spends a lot of their time on their couches, watching television either alone or with their families. We need to make sure that in between their shows, they don't forget about the atrocities committed by the Ba'athists."
 IRQ_persecute_potential_baathists: "潜在的バアス主義者の調査"
 IRQ_persecute_potential_baathists_desc: "イラク社会には依然として多くのバアス党同調者がおり、彼らは我々の社会の隙間に滑り込んだ。これらの愚か者に対する調査を開始することは有益だろう。"
 IRQ_sunni_in_politics: "宗派間の地震"
 IRQ_sunni_in_politics_desc: "Our government will need to manage 3 factors regarding the Sunnis in the nation, §HSatisfaction§!, §HRadicalization§!, and §HPolitical Influence§!\n\nSatisfaction will determine the Sunnis' overall happiness with the government's decision making. If Sunni §HSatisfaction§! is lower than §H30/50§!, then §HRadicalization§! will start gradually increasing. Lower §HSatisfaction§! will also exponentially increase the rate of §HRadicalization§! anytime it increases (Will begin to multiply).\n\n§HRadicalization§! will be the frequency that Iraqi Sunnis join extremist groups, as well as how politically active they will be. Anytime the §HRadicalization§! amongst the Sunnis increases, they will become more politically active and will have a higher §HPolitical Influence§!.\n\n§HPolitical Influence§! will determine the growth in Sunni-led political parties within our nation. There is also a random chance that our Sunni Generals will launch a coup if Sunni §HPolitical Influence§! and §HRadicalization§! is high.\n\nSunni Satisfaction: §H[?IRQ_sunni_satisfaction]/50§!\nSunni Radicalization: §H[?IRQ_sunni_radicalization]/75§!\nSunni Political Influence: §H[?IRQ_sunni_political_influence]/100§!"
 IRQ_satisfy_sunnis: "スンニ派のニーズを満たす"
 IRQ_satisfy_sunnis_desc: "In order to get on the good side of our Sunnis, we are going to have to direct more resources in developing their standard of living, and giving them a greater voice in our government which is primarily led by Shi'ite individuals."
 IRQ_redirect_sunni_resources: "スンニ派資源の転用"
 IRQ_redirect_sunni_resources_desc: "スンニ派コミュニティは確かにより少ない資源を持つことを気にしないだろう、特に我々の政府が確かにこれらの不可欠な資源を使用できるからだ。"
 IRQ_make_a_promise: "約束をする"
 IRQ_make_a_promise_desc: "スンナ派住民の満足度が低い状況を踏まえ、我々は政府が職務を遂行するに値することを証明する機会を得るための約束をすることができる。\n§W-----------------------------------------------------------------§!\nこのディシジョンは180日後に再度利用可能になる。"
 IRQ_resolve_the_crisis: "危機の解決"
 IRQ_resolve_the_crisis_desc: "The time has come for us to resolve the sectarian earthquake that has rocked our nation."
 IRQ_lower_iranian_influence_1: "[PER.GetFlag]イランの影響力への取り組み"
 IRQ_lower_iranian_influence_1_desc: "We have promised our Sunnis that we will lower Iranian influence."
 IRQ_anbar_infrastructure: "アンバールにおけるインフラ改善"
 IRQ_anbar_infrastructure_desc: "我々はアンバールにおけるインフラを改善することを約束した。"
 IRQ_salahuddin_infrastructure: "サラーフッディーンにおけるインフラ改善"
 IRQ_salahuddin_infrastructure_desc: "我々はサラーフッディーンにおけるインフラを改善することを約束した。"
 IRQ_nineveh_infrastructure: "ニネヴェにおけるインフラ改善"
 IRQ_nineveh_infrastructure_desc: "我々はニネヴェにおけるインフラを改善することを約束した。"
 IRQ_anbar_airbase: "アンバールにおける空港改善"
 IRQ_anbar_airbase_desc: "我々はアンバールに位置する空港を改善することを約束した。"
 IRQ_salahuddin_airbase: "サラーフッディーンにおける空港改善"
 IRQ_salahuddin_airbase_desc: "我々はサラーフッディーンに位置する空港を改善することを約束した。"
 IRQ_nineveh_airbase: "ニネヴェにおける空港改善"
 IRQ_nineveh_airbase_desc: "我々はニネヴェに位置する空港を改善することを約束した。"
 IRQ_economic_prosperity: "経済状況の改善"
 IRQ_economic_prosperity_desc: "我々はイラクにおける経済状況を改善することを約束した。"
 IRQ_smaller_government: "Limit the Government's Reach"
 IRQ_smaller_government_desc: "我々は政府がイラク社会においてより小さな役割を果たすことを保証することを約束した。"
 IRQ_sunni_internet: "インターネットインフラの改善"
 IRQ_sunni_internet_desc: "We've promised to improve internet infrastructure in the Western Regions populated by Sunnis."
 IRQ_pmf_decisions: "人民動員隊"
 IRQ_pmf_decisions_desc: "The §HPMF§!, or §HPopular Mobilization Forces§! are a series of §HMilitias§! that have banded together to form an umbrella group for the security of the nation. We are able to §HMobilize§! these §HMilitias§! at a cost in order to prepare for a war against our enemies. Total mobilization could take years, however we are able to deploy the §HPMF§! at any time relative to the mobilization rate.\n\nWhile the §HPMF§! is deployed, we will suffer from §Rincreased troop up-keep§!, but we are able to §HDemobilize§! them in order to save our budget.\n\nIf we are at war, mobilization will progress §HDouble§! its standard rate monthly."
 IRQ_begin_mobilization: "動員の開始"
 IRQ_begin_mobilization_desc: "PMFを動員することによって、我々は地域におけるいかなる脅威にも立ち向かうために必要な量の部隊を自由に使えるだろう。"
 IRQ_stop_mobilization: "動員の停止"
 IRQ_stop_mobilization_desc: "PMFの動員を維持することは費用のかかる任務であり、国家を経済崩壊から救うためにはPMFの動員を停止することが必要である。"
 IRQ_deploy_the_pmf: "PMFの展開"
 IRQ_demobilize_the_pmf: "PMFの復員"
 IRQ_demobilize_the_pmf_desc: "彼らの援助がもはや我々の軍隊にとって何の役にも立たなくなったため、PMFを復員させる時が来た。"
 IRQ_spring_of_islam: "イスラムの春"
 IRQ_spring_of_islam_desc: "In order to expand the reach of our alliance and ideology, we will need to export §HShi'ite Revolutions§! in nations with some semblance of §HShi'ite Movements§!. We will disguise the movements as Islamic in nature, but will have them spearheaded by §HShi'ite§! leaders and groups to ensure that there is no hijacking of our influence. We will expand our influence within the nations in order to influence their §HMilitaries and Governmental Bodies§! to win them over when the revolution comes. The first stage will be arming and funding the rebels, which will then allow us to give them the greenlight to start their §HRevolution§!.\n"
 IRQ_arm_rebels_in_jordan: "[JOR.GetFlag]ヨルダンの反乱軍を武装させる"
 IRQ_arm_rebels_in_jordan_desc: "We can fund, train, and arm Shi'ites in [JOR.GetFlag] Jordan and prepare them to overthrow the [JOR.GetFlag] Jordanian government in order to install an Islamic Republic."
 IRQ_islamic_spring_in_jordan: "[JOR.GetFlag]ヨルダンにおけるイスラムの春"
 IRQ_islamic_spring_in_jordan_desc: "時が来た、我々の[JOR.GetFlag]ヨルダンのパートナーたちは彼らのイスラム革命をもたらす準備ができている！"
 IRQ_arm_rebels_in_kuwait: "[KUW.GetFlag]クウェートの反乱軍を武装させる"
 IRQ_arm_rebels_in_kuwait_desc: "We can fund, train, and arm Shi'ites in [KUW.GetFlag] Kuwait and prepare them to overthrow the [KUW.GetFlag] Kuwaiti government in order to install an Islamic Republic."
