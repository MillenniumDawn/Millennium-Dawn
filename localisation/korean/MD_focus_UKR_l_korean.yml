 ukraine_warehouse_explosions.7.name: "로조바 탄약고 폭발"
 ukraine_warehouse_explosions.7.desc: "최근 하르키우주 로조바 지구의 로조바시에서 예상치 못한 대규모 사고가 발생했습니다. 2008년 8월 27일 16시 20분, 육군 남부작전사령부 제61 조병창의 창고에서 불이 났습니다. 면적이 약 500헥타르에 달하는 제0829 군부대 병기창에는 포탄 9만 5천 톤이 보관되어 있었습니다. 폭발은 약 두 시간 뒤부터 시작되었습니다. 창고 반경 3km 이내의 모든 주민이 대피했습니다."
