 TAI_pc_industry_events.9.t: "MSI Pushes Gaming Notebooks"
 TAI_pc_industry_events.9.d: "The overclockable GX600 gives MSI a way to carry its enthusiast reputation from motherboards into notebooks. Management can concentrate on high-margin gaming machines, chase broader consumer volume, or adapt its engineering base to professional systems."
