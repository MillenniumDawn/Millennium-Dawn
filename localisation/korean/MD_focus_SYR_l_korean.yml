 TT_SYR_DEAL_WITH_TRADE_UNIONS: "노동조합이 내부 파벌로 존재할 경우 노동조합과의 관계가 개선됩니다"
 syrian_industrial_heartland: "시리아 산업 중심지"
 TT_syrian_industrial_heartland_dynamic_modifier: "이 지역은 국내에서 가장 산업화된 지역 중 하나로 꼽히며, 이에 따라 해당 지역의 산업 건설과 가동이 더 수월합니다."
 syrian_industrial_encouragement: "산업화 계획"
 TT_syrian_industrial_encouragement_dynamic_modifier: "이 지역은 시리아 정부의 장려에 힘입어 산업화 단계에 접어들었습니다."
 syrian_industrial_heartland_fully_unleached: "산업 확장"
