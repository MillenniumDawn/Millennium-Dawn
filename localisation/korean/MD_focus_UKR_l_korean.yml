 ukr_modernize_sov_equipment_t55_reactivation_program.4.name: "§YT-55AGM§! 시제차 완성"
 ukr_modernize_sov_equipment_t55_reactivation_program.4.desc: "§YKMDB§!가 §YT-55AGM§!을 완성했습니다. 자동 장전 장치를 갖춘 새 포탑 후부가 125mm 주포를 지탱하고, 더 강력한 §Y5TDFM§! 엔진이 무거워진 전차를 움직이며, §YNizh§! 반응 장갑과 열상 조준경으로 낡은 차체가 §G현대식 수준에 가까워졌습니다§!."
