l_korean:
 DPR_start: "인민공화국"
 dpr_focus: "도네츠크인민공화국의 중점"
 DPR_start_desc: "이제 우리는 돌아갈 길이 없습니다. 우리는 독립을 위해 싸울 것입니다."
 DPR_vstavai_dombass: "일어나라 돈바스"
 DPR_vstavai_dombass_desc: "Every miner, teacher, soldier and worker. We will all fight for our homeland!"
 DPR_reform_army: "군사 개혁"
 DPR_reform_army_desc: "모든 전투 부대를 단일 구조로 편성할 필요가 있습니다."
 DPR_reforms_army: "군사 개혁 완료"
 DPR_reforms_army_desc: "우리의 인민 민병대는 조국을 방어할 준비가 되었습니다."
 DPR_bank: "도네츠크 중앙은행"
 DPR_bank_desc: "우리의 은행 제도를 정비해야 합니다."
 DPR_propaganda_desc: "우리 봉기의 정당성을 사람들에게 납득시킬 때입니다."
 DPR_gos_granitca: "주 국경 강화"
 DPR_gos_granitca_desc: "적은 지나가지 못할 것입니다!"
 DPR_pasports: "도네츠크 공화국 시민 여권"
 DPR_pasports_desc: "우리 시민은 여권을 가져야 합니다."
 DPR_cheburashka_desc: "우리 자체의 다연장 로켓 체계는 군에 훌륭한 보탬이 될 것입니다."
 DPR_resource_from_sov: "러시아의 도움"
 DPR_resource_from_sov_desc: "우리는 우크라이나의 전력망과 가스 공급에서 차단되었습니다. 러시아가 도와주기를 바랍니다."
 DPR_warehouse: "무기 창고"
 DPR_warehouse_desc: "옛 소련 창고를 뒤져 볼 때입니다."
 DPR_somali: "\\"소말리\\" 대대"
 DPR_somali_desc: "우리 공화국 영토에서 처음 창설된 대대 중 하나입니다."
 DPR_rebuild_ruins: "폐허 재건 시작"
 DPR_rebuild_ruins_desc: "전쟁은 우리나라에 많은 파괴를 가져왔습니다. 이제 재건을 시작할 때입니다."
 DPR_nationalise: "우크라이나 기업 국유화"
 DPR_nationalise_desc: "우리 공화국에는 공장과 기업, 그리고 세수가 필요합니다. 이 문제를 해결할 수 있다고 봅니다."
 DPR_interbrigade: "국제 여단"
 DPR_interbrigade_desc: "The inter-brigades of the national Bolsheviks are coming to us from Russia, together we are a force!"
 DPR_ros_banks: "러시아 은행에 자리 제공"
 DPR_ros_banks_desc: "어쩌면 러시아 은행들이 우리 공화국에 관심을 가질지도 모릅니다."
 DPR_obtf_kaskad: "OBTF 카스카드"
 DPR_obtf_kaskad_desc: "도네츠크 인민공화국의 작전 전투 전술 편대입니다. OBTF \\"카스카드\\"에는 DPR 법 집행 기관의 병력과 수단 일부가 포함됩니다. OBTF \\"카스카드\\"의 핵심 고리는 DPR 내무부입니다."
 DPR_vstuplenie_v_rf: "조국으로의 귀환"
 DPR_vstuplenie_v_rf_desc: "러시아 가입에 관한 국민투표를 실시할 것입니다. 이제 집으로 돌아갈 때입니다."
 DPR_integrate_army: "러시아군 통합 개시"
 DPR_integrate_army_desc: "이제 러시아군에 통합되기 시작할 때입니다."
 DPR_integrate_army1: "러시아군 통합 완료"
 DPR_integrate_army1_desc: "우리 군은 러시아군의 기준을 온전히 갖추었습니다."
 DPR_rzso_cheburashka: "다연장 로켓 \\"체부라시카\\""
 DPR_rzso_cheburashka_desc: "기술적 관점에서 체부라시카는 이 부류의 다른 사례들과 유사한 전형적인 현대식 다연장로켓발사시스템입니다. 동시에 이 다연장 로켓은 독특한 외형을 부여하거나 / 그리고 특별한 전투 능력을 제공하는 몇 가지 흥미로운 특징을 지니고 있습니다."
 DPR_rzso_snejinka: "다연장 로켓 \\"스네진카\\""
 DPR_rzso_snejinka_desc: "기술적 관점에서 스네진카는 이 부류의 다른 사례들과 유사한 전형적인 현대식 다연장로켓발사시스템입니다. 동시에 이 다연장 로켓은 독특한 외형을 부여하거나 / 그리고 특별한 전투 능력을 제공하는 몇 가지 흥미로운 특징을 지니고 있습니다."
 DPR_guard: "DPR 공화국 근위대"
 DPR_guard_desc: "공화국 근위대는 전선에서 가장 중요한 임무를 수행하는 정예 부대로 창설될 것입니다."
 DPR_mgb_desc: "공화국 내부에서 시민들의 평화와 안녕을 지킬 우리 자체의 부처를 창설할 것입니다."
 DPR_sparta: "\\"스파르타\\" 대대"
 DPR_sparta_desc: ""
 DPR_oplot: "\\"오플로트\\" 대대"
 DPR_oplot_desc: ""
 DPR_dizel: "\\"디젤\\" 대대"
 DPR_dizel_desc: ""
 DPR_khan: "\\"칸\\" 독립 특수목적 대대"
 DPR_khan_desc: ""
 DPR_blpa: "무인기 연구"
 DPR_blpa_desc: "우리 자체의 무인기를 개발하는 시도를 시작할 것입니다"
 DPR_government: "공화국 정부"
 DPR_government_desc: "우리 국가가 온전히 기능하도록 마침내 정부와 그 구조를 승인할 것입니다."
 DPR_donetsk_build: "도네츠크 강화"
 DPR_donetsk_build_desc: "도네츠크에 방어 요새 건설을 시작할 것입니다. 적이 다가오고 있으며 우리는 도시를 방어할 준비를 갖추어야 합니다."
 DPR_gaz_contracts_russia: "러시아의 석유 및 가스 공급"
 DPR_gaz_contracts_russia_desc: "러시아는 우리에게 석유와 가스 자원을 공급할 준비가 되어 있습니다"
 DPR_youth: "청년 정책"
 DPR_youth_desc: "우리는 청년에게 의지할 것입니다. 그들이 우리의 미래입니다"
 DPR_anti_gibdd: "반LGBT"
 DPR_anti_gibdd_desc: "이러한 소수자 집단의 대표자들이 우리 공화국에 들어오는 것을 허용하지 않을 것입니다"
 DPR_religion_boost: "종교 강조"
 DPR_religion_boost_desc: "우리 공화국은 참된 정교의 보루가 될 것입니다"
 DPR_anti_ukrain: "반우크라이나 활동"
 DPR_anti_ukrain_desc: "우리의 선전을 어디서나 모든 면에서 반우크라이나 활동으로 완전히 전환할 것입니다"
 DPR_sports: "스포츠 발전"
 DPR_sports_desc: "강한 방위 세대가 자라나도록 우리 공화국에서 스포츠를 발전시켜야 합니다."
 DPR_vpk_desc: "이제 우리의 위대한 공장을 되살릴 때입니다"
 DPR_internet: "인터넷 사업자 \\"피닉스\\""
 DPR_internet_desc: "우리는 공화국 시민의 복리를 위해 인터넷망을 발전시킬 준비가 되어 있습니다"
 DPR_rifles: "국산 소총"
 DPR_rifles_desc: "우리는 병사들을 위해 소총 분야에서 자체 개발의 시제품을 만들어 냈습니다"
 DPR_univer: "도네츠크 군 고등학교"
 DPR_univer_desc: "도네츠크 고등 군사정치 공병·통신병 학교를 재건하고 이곳에서 우리 군을 위한 새로운 인력을 양성할 것입니다"
 DPR_sport_development: "스포츠 발전"
 DPR_referendum: "러시아 연방 가입 국민투표"
 DPR_referendum_desc: "이제 결정할 때입니다. 러시아가 우리를 받아들일까요?"
 DPR_first_invest: "러시아의 투자"
 DPR_first_invest_desc: "마침내 첫 투자가 돈바스 재건에 쓰일 것입니다"
 DPR_strelkov_rise: "권력을 쥔 스트렐코프"
 DPR_strelkov_rise_desc: "이고리 프세볼로도비치가 이제 노보로시야를 전적으로 이끌고 있습니다. 이것은 어디로 이어질까요?"
 DPR_traitor_cleane: "통제 불능 지휘관 제거"
 DPR_traitor_cleane_desc: "우리에게 필요한 것은 우리의 명령을 백 퍼센트 수행할 자들뿐입니다"
 DPR_critisize_kremlin: "크렘린 비판"
 DPR_critisize_kremlin_desc: "크렘린은 노보로시야를 전력으로 돕지 않았습니다. 우리는 스스로 싸워야 한다고 국민을 납득시키기 위해 부정적인 수사를 사용합니다"
 DPR_total_mobilisation: "전원 동원"
 DPR_total_mobilisation_desc: "모두가 나선다면 노보로시야가 승리할 것입니다"
 DPR_total_war: "우크라이나와의 마지막 전쟁"
 DPR_total_war_desc: "이제 우리 땅을 해방할 때입니다"
 DPR_npz: "현지 정유소 국유화"
 DPR_npz_desc: "구 정부에 속했던 모든 것을 국유화할 것입니다"
 DPR_infra: "인프라 복구"
 DPR_infra_desc: "우리에게는 도로가, 아주 많은 도로가 필요합니다"
 DPR_total_ressurection: "전면 복구"
 DPR_total_ressurection_desc: "이제 우리 고향 땅을 되살릴 때입니다"
 DPR_ros_invest: "러시아의 투자"
 DPR_ros_invest_desc: "우리 공화국은 발전을 위한 자금이 필요하며, 러시아는 이를 제공할 준비가 되어 있습니다."
 DPR_ros_concept_interven: "러시아 대외 정책 구상"
 DPR_ros_concept_interven_desc: "우리는 러시아의 해외 군사 임무에 적극 참여할 것입니다. 우리 지원병들은 러시아가 필요로 하는 어디에서든 도울 것입니다."
 DPR_create_nov: "노보로시야 수립"
 DPR_create_nov_desc: "단일 국가 실체인 노보로시야의 수립을 선포할 것입니다."
 DPR_nov_army: "노보로시야군"
 DPR_nov_army_desc: "노보로시야 통합군 창설을 시작할 것입니다."
 DPR_nov_annex_opr: "오데사 공화국을 노보로시야에 병합"
 DPR_nov_annex_opr_desc: "새 공화국을 노보로시야에 합쳐 영역을 확장할 것입니다."
 DPR_nov_annex_hpr: "하르키우 공화국을 노보로시야에 병합"
 DPR_nov_annex_hpr_desc: "새 공화국을 노보로시야에 합쳐 영역을 확장할 것입니다."
 DPR_territorial_defence: "영토 방어 생성"
 DPR_territorial_defence_desc: "인민 민병대에 더해, 우리는 국경과 내부 안보를 강화하기 위해 영토방위대를 창설하는 우크라이나의 관행을 차용하고 있습니다"
 DPR_Donbass_war_help: "전쟁에서의 러시아의 도움"
 DPR_Donbass_war_help_desc: "러시아의 도움이 없었다면 우리의 독립 전쟁은 불가능했을 것입니다. 우리는 가능한 모든 도움을 얻으려 노력할 것입니다"
 DPR_smuggle_old_weapons: "\\"인도적\\" 지원 확보"
 DPR_hire_musicians: "\\"음악가\\" 고용"
 DPR_get_russian_volunteers: "러시아 지원병 수용"
 DPR_hire_russian_advisors: "러시아 군사 고문 수용"
 DPR_imamat_donbass: "돈바스 이맘국"
 DPR_russian_money: "러시아의 투자"
 DPR_reforming_army_sov: "러시아군에 완전 통합"
 DPR_unproffesional_army: "민병과 광부의 군대"
 DPR_proffesional_army: "직업 군대"
