 SUPPLYMODE_TOOLTIP_FLOATINGHARBOR_NODE_HEADER: "§YМодульная система дамб§! в $PROVINCE_NAME|H$:"
 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR: "§HПриказ о морском вторжении (с поддержкой модульной системы дамб)§!\nШаг 1) §GНажмите§! на одну из выделенных провинций, чтобы указать источник вторжения.\nШаг 2) §GЩёлкните правой кнопкой мыши§! на желаемой прибрежной провинции (или провинциях) для вторжения.\nПосле активации плана начнётся подготовка к вторжению, в ходе которой из вашего запаса будут выделены конвои и модульная система дамб."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR_NO_HARBOR: "§RУ нас нет §Hмодульной системы дамб§!, необходимой для этого плана§!"
