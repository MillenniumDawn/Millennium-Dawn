 module_naval_vls_cells_4: "Banco VLS (4 celdas)"
 module_naval_vls_cells_4_desc: "Celdas de lanzamiento vertical integradas en el casco. El número de celdas determina la capacidad de lanzamiento del buque: los bancos más grandes aumentan proporcionalmente la carga de munición de misiles instalada a cambio de un mayor coste, tripulación y visibilidad.\n\n§GConsejo de diseño: Las celdas VLS multiplican las estadísticas de combate en el rol de misiles del buque. Los bancos más grandes proporcionan más potencia de fuego de misiles, pero añaden más capacidad industrial (IC), mano de obra, uso de combustible y visibilidad de superficie.§!"
