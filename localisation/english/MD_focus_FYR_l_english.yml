 FYR_political.1.t: "Insurgency in the Northwest"
 FYR_political.1.d: "Ethnic Albanian militants calling themselves the National Liberation Army have seized the border village of Tanuševci, and firefights with the security forces are spreading toward Tetovo. Skopje fears the war that spared Macedonia in the nineties has finally arrived."
 FYR_political.1.a: "Seek international mediation"
 FYR_political.1.b: "Crush the insurgency"
 FYR_political.2.t: "The Ohrid Framework Agreement"
 FYR_political.2.d: "Government and Albanian party leaders have signed a framework agreement at Ohrid under Western mediation. The Albanian language gains official status in municipalities where the minority exceeds a fifth of the population, policing is devolved, and the insurgents will surrender their weapons to NATO collectors under amnesty."
 FYR_political.2.a: "Power shared is better than war"
 FYR_political.3.t: "The Prespa Agreement"
 FYR_political.3.d: "On the shore of Lake Prespa, negotiators from Skopje and Athens have initialled a deal to end the decades-old name dispute. The country would become the Republic of North Macedonia, and in return Greece lifts its veto on NATO membership and European accession talks."
 FYR_political.3.a: "Sign and take the Euro-Atlantic path"
 FYR_political.3.b: "We will not rename our nation"
