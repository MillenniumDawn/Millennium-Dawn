 BRI_request_loan_extension: "대출 연장 요청"
 BRI_request_loan_extension_desc: "채무 불이행 상태인 일대일로 채무에 대해 베이징에 1년간의 상환 유예를 청원합니다. 원금은 탕감되지 않습니다."
 CHI_16_national_congress_mission: "중국공산당 제16차 전국대표대회"
 CHI_16_national_congress_mission_desc: "중국공산당 제16차 전국대표대회가 2002년에 개최되어 세대교체 지도부 전환을 알립니다."
 CHI_16_national_congress_mission_tt: "§R완료에 필요한 중점들을 건너뛰게 됩니다:§! §Y$CHI_the_shanghai_succession$§!"
 CHI_17_national_congress_mission: "중국공산당 제17차 전국대표대회"
 CHI_17_national_congress_mission_desc: "제17차 전국대표대회가 2007년에 개최되어 현 지도부의 의제를 공고히 합니다."
 CHI_18_national_congress_mission: "중국공산당 제18차 전국대표대회"
 CHI_18_national_congress_mission_desc: "제18차 전국대표대회가 2012년에 개최되며, 지도부에 상당한 변화가 있을 것으로 예상됩니다."
 CHI_19_national_congress_mission: "중국공산당 제19차 전국대표대회"
 CHI_19_national_congress_mission_desc: "제19차 전국대표대회가 2017년에 개최되어 당의 방향을 점검하고 지도부를 재확인합니다."
 CHI_20_national_congress_mission: "중국공산당 제20차 전국대표대회"
 CHI_20_national_congress_mission_desc: "제20차 전국대표대회가 2022년에 개최되며, 지도부의 연속성과 임기 제한을 둘러싼 의문이 제기되고 있습니다."
 CHI_21_national_congress_mission: "중국공산당 제21차 전국대표대회"
 CHI_21_national_congress_mission_desc: "제21차 전국대표대회가 2027년에 개최되어 다음 시대의 당 노선을 설정합니다."
 CHI_abolish_birth_limits: "출산 제한 철폐"
 CHI_abolish_birth_limits_desc: "가족 규모에 대한 남은 모든 제한이 공식적으로 폐지됩니다. 국가는 출산을 제한하던 입장에서 적극적으로 장려하는 입장으로 전환하며, 마오쩌둥 시대에 시작되어 덩샤오핑 시대에 제도화된 인구 통제의 시대를 끝냅니다. 이러한 변화는 집행 비용이 이제 제한의 인구학적 이익을 넘어섰으며 자발적 출산율이 이미 대체 출산율을 크게 밑돌고 있음을 인정한 것입니다."
 CHI_activate_princeling_network: "태자당 네트워크 가동"
 CHI_activate_princeling_network_desc: "동문 인맥, 사업적 유대, 총참모부 자산이 하나로 묶여 조율된 정책 수단이 됩니다. 태자당 네트워크는 평양에 대한 우리의 결정적 지렛대로 작동하기 시작합니다."
 CHI_activate_rare_earth_embargo: "희토류 금수 발동"
 CHI_activate_rare_earth_embargo_desc: "일본에 대한 텅스텐과 크롬 수출을 중단합니다. 금수 조치는 해제되거나, 일본이 굴복하거나, 도쿄가 공급선을 다변화할 때까지 유지됩니다."
 CHI_adopt_three_child_policy: "세 자녀 정책"
 CHI_adopt_three_child_policy_desc: "2020년 인구 총조사 결과에 따라 베이징은 부부가 최대 세 자녀까지 낳는 것을 허용하고, 이를 보조금, 연장된 육아 휴직, 사교육비 상한 등의 패키지와 함께 발표합니다. 분석가들은 한국, 일본, 싱가포르가 비슷한 조치를 시도했으나 효과가 제한적이었다고 지적하며, 급격히 오르는 중국의 도시 생활비와 소가족을 선호하는 문화적 변화도 같은 구조적 장벽이 됩니다."
 CHI_adopt_two_child_policy: "두 자녀 정책"
 CHI_adopt_two_child_policy_desc: "국무원이 2016년 1월 1일부터 시행되는 전면 두 자녀 정책을 발표합니다. 1980년부터 시행되어 온 한 자녀 제한이 모든 부부에 대해 해제됩니다. 인구 모델 전문가들은 출산이 소폭 증가하는 데 그칠 것으로 전망합니다. 수십 년간 소가족이 규범이 된 데다 생활비, 주택 가격, 여성의 경제활동 참여가 법적 제약이 없더라도 출산율을 대체 수준 아래로 크게 억누르기 때문입니다."
 CHI_anti_desertification_belt: "삼북 방호림 확장"
 CHI_anti_desertification_belt_desc: "1978년부터 중국 북부, 내몽골, 동북 지역에서 진행 중인 삼북 방호림 프로그램은 세계 최대 규모의 조림 사업으로, 2050년까지 총 880억 그루를 심을 계획입니다. 새로운 식재 단계는 토양을 고정하고 눈 녹은 물을 저장하며 황토고원과 훈산다크 사지의 황폐화된 유역 집수 지역을 복원하는 혼합 수종 군락에 집중합니다. 복원된 식생은 황허의 토사 유입량을 줄이고 고비 사막의 남진 속도를 늦춥니다."
 CHI_Asset_Seizure: "전략 자산 압류"
 CHI_Asset_Seizure_desc: "채무 불이행 상태인 기반시설 자산 하나를 중국이 통제하는 보유 자산으로 전환하고 원금을 프로젝트 비용 한 건만큼 줄입니다. 약탈적 대출 노선에서만 사용할 수 있습니다."
 CHI_asteroid_mining_investment: "소행성 채굴 투자"
 CHI_asteroid_mining_investment_desc: "상업적 우주 자원 사업에 자본을 투입합니다. 사업이 성공하면 백금족 금속, 희토류, 휘발성 물질, 미세중력 제조에서 나오는 영구적인 산업 배당이 하나 잠금 해제됩니다. 이러한 사업은 동시에 최대 다섯 건까지 유지할 수 있습니다."
 CHI_asteroid_survey_mission: "지구 근접 소행성 탐사"
 CHI_asteroid_survey_mission_desc: "톈원 탐사선으로 검증된 심우주 항법을 바탕으로, 탐사 위성이 접근 가능한 지구 근접 소행성의 궤도와 광물 조성을 조사합니다. 탐사에 성공하면 상업적 우주 자원 채굴의 길이 열립니다."
 CHI_automation_robotics_push: "자동화 및 로봇 공학 추진"
 CHI_automation_robotics_push_desc: "중국은 매년 유럽 연합과 미국을 합친 것보다 많은 산업용 로봇을 설치하는 세계 최대의 설치국이 되었습니다. 국가 주도의 가속 정책은 인력 부족이 가장 심각한 노동 집약적 제조 부문을 겨냥합니다. 투자는 협동 로봇, AI 지원 생산 라인, 스마트 물류 시스템으로 흘러가며, 인구 감소로 줄어드는 노동력을 자본으로 대체합니다."
 CHI_avic_innovation: "AVIC: 독자 혁신"
 CHI_avic_innovation_desc: "중국항공공업집단은 중국 항공기 산업의 방대한 모기업입니다. 산하 연구소들이 모방이 아닌 혁신을 하도록 강제하면 중국 공군력이 의존하는 기체 개발이 빨라집니다."
 CHI_back_nepalese_communists: "네팔 공산주의자 지원"
 CHI_back_nepalese_communists_desc: "카트만두의 공산주의 정파에 자금과 이념적 지원을 제공하여 네팔의 정치적 균형을 서서히 베이징 쪽으로 기울입니다."
 CHI_beijing_hosted_talks: "베이징 긴급 정상회의 개최"
 CHI_beijing_hosted_talks_desc: "한반도 지도자들을 긴급 중재를 위해 베이징으로 소환합니다. 양자 회담이 결렬되었을 때 양측을 협상 테이블로 되돌릴 수 있는 것은 중국이라는 주최국뿐입니다."
 CHI_beijing_washington_consultation: "베이징-워싱턴 협의 개시"
 CHI_beijing_washington_consultation_desc: "미 국무부와의 조용한 비공식 채널을 통해 베이징과 워싱턴은 서울을 제쳐 두고 한반도 문제를 관리합니다. 이러한 구도는 소외될까 우려하는 도쿄를 불안하게 만듭니다."
 CHI_big_fund_iii_allocate_tranche_decision: "빅 펀드 III 분할금 배정"
 CHI_big_fund_iii_allocate_tranche_decision_desc: "국가 집적회로 산업 투자 기금의 3,440억 위안 규모 제3기가 목표 하위 부문에 집행됩니다. 분할금이 투입될 때마다 반도체 공장 하나가 완전 가동 상태에 이릅니다."
 CHI_boycott_lotte: "롯데 불매"
 CHI_boycott_lotte_desc: "롯데가 THAAD 배치 부지로 토지를 임대한 데 대한 대응으로 중국 내 롯데그룹 자산에 대한 대중적 불매 운동을 조직합니다."
 CHI_BRI_Forum_Triennial: "일대일로 포럼 개최"
 CHI_BRI_Forum_Triennial_desc: "베이징에서 3년마다 열리는 일대일로 포럼을 개최합니다. 네트워크 전역의 국가 원수들이 모여 약속을 갱신하고 새로운 대표 프로젝트를 발표합니다. 일대일로 국고가 최소 150 이상이어야 합니다. 국고에서 큰 지출이 발생하며 3년의 재사용 대기 시간이 있습니다."
 CHI_BRI_management: "일대일로 구상"
 CHI_BRI_management_desc: "일대일로 구상은 중국의 가장 중요한 경제적 국정 운영 수단으로, 전 세계 파트너 국가의 항만, 철도, 에너지 회랑, 디지털 기반시설에 신용을 투입합니다. 각 프로젝트는 물리적 연결성과 정치적 지렛대를 동시에 강화합니다.\n\n§Y국고:§! ¥[?CHI_bri_treasury|0]B  |  월간 기여금: +[?CHI_bri_monthly_income_total|0]\n§Y프로젝트:§! [?CHI_bri_committed_projects|0]/[?CHI_bri_project_slots|0] 착수  |  §G[?CHI_bri_completed_projects|0]§! 완료  |  §R[?CHI_bri_defaulted_projects|0]§! 누적 채무 불이행\n§Y대출 수입:§! 주간 [?CHI_bri_loan_income|2]  |  §Y세계적 존재감:§! [?CHI_bri_global_presence|0]\n§G상호 발전 [?CHI_bri_winwin_score|0]§!  ·  §R약탈 [?CHI_bri_predatory_score|0]§!"
 CHI_BRI_promote_digital_silk_road: "디지털 실크로드 업그레이드"
 CHI_BRI_promote_digital_silk_road_desc: "통신 기반시설 누적치가 필요 임계값을 넘으면 이 결정은 디지털 실크로드 단계 국가 정신을 업그레이드합니다. 이는 중국이 건설한 광케이블망, 위성 지상국, 화웨이가 공급하는 이동통신 기반시설이 파트너 국가들 전역에 퍼지는 것을 반영합니다."
 CHI_BRI_promote_economic_zones: "경제특구 업그레이드"
 CHI_BRI_promote_economic_zones_desc: "산업 구역 개발 누적치가 필요 임계값을 넘으면 이 결정은 경제특구 단계 국가 정신을 업그레이드합니다. 이는 공급망의 중추 역할을 하며 파트너 국가의 중국 기업에 우대 조건을 제공하는, 중국이 운영하는 수출 가공 및 물류 거점을 반영합니다."
 CHI_BRI_promote_energy_arteries: "에너지 동맥 업그레이드"
 CHI_BRI_promote_energy_arteries_desc: "송유관 건설 누적치가 필요 임계값을 넘으면 이 결정은 에너지 동맥 단계 국가 정신을 업그레이드합니다. 이는 중앙아시아 생산국과 중국 정유 시설을 연결하고 해상 요충지에 대한 노출을 줄이는 확장된 석유 및 가스 수송 기반시설을 나타냅니다."
 CHI_BRI_promote_maritime_network: "해상 네트워크 업그레이드"
 CHI_BRI_promote_maritime_network_desc: "일대일로 구상의 항만 건설 누적치가 필요 임계값을 넘으면 이 결정은 해상 네트워크 단계 국가 정신을 업그레이드합니다. 이는 인도양에서 지중해에 이르는 해상 무역로와 양허성 항만 접근권에 대한 중국의 영향력을 확대합니다."
 CHI_BRI_promote_overland_corridors: "육상 회랑 업그레이드"
 CHI_BRI_promote_overland_corridors_desc: "철도 건설 누적치가 필요 임계값을 넘으면 이 결정은 육상 회랑 단계 국가 정신을 업그레이드합니다. 이는 운송 비용을 줄이고 중앙아시아와 캅카스 전역의 경제적 의존을 심화시키는 대륙 횡단 철도 노선이 추가로 완공되는 것을 반영합니다."
 CHI_BRI_promote_power_generation: "발전망 업그레이드"
 CHI_BRI_promote_power_generation_desc: "일대일로 자금으로 지은 발전소 건설이 필요 임계값을 넘으면 이 결정은 발전 단계 국가 정신을 업그레이드합니다. 이는 중국 기업이 건설한 석탄, 수력, 태양광 설비가 파트너 경제에 전력을 공급하는 동시에 장기적인 유지보수 의존성을 만들어 내는 것을 반영합니다."
 CHI_BRI_promote_prestige_diplomacy: "위신 외교 업그레이드"
 CHI_BRI_promote_prestige_diplomacy_desc: "상징 프로젝트 완공 누적치가 필요 임계값을 넘으면 이 결정은 위신 외교 단계 국가 정신을 업그레이드합니다. 이는 호의를 낳고 중국 국정 운영의 영향력을 과시하는 랜드마크 경기장, 정부 청사, 문화 센터를 반영합니다."
 CHI_BRI_promote_resource_concessions: "자원 양허권 업그레이드"
 CHI_BRI_promote_resource_concessions_desc: "확보한 자원 양허권이 필요 임계값을 넘으면 이 결정은 자원 양허권 단계 국가 정신을 업그레이드합니다. 이는 중국 제조업 공급망에 원료를 대는 구리, 코발트, 리튬 및 기타 전략 광물에 대한 장기 채굴 협약을 나타냅니다."
 CHI_BRI_recipient_actions: "일대일로 구상"
 CHI_BRI_recipient_actions_desc: "중화인민공화국에 일대일로 구상 프로젝트 자금을 신청합니다."
 CHI_build_mega_rail_hub: "초대형 철도 허브 건설"
 CHI_build_mega_rail_hub_desc: "베이징남역, 상하이 훙차오역, 광저우남역 규모로 중국 주요 도시 한 곳에 거대한 통합 철도 터미널을 건설합니다. 이러한 허브는 고속철도, 지하철, 도시 간 노선을 하나의 거점으로 융합하여 지역 전반의 건설과 물류를 가속합니다."
 CHI_build_public_housing: "공공주택 건설"
 CHI_build_public_housing_desc: "[FROM.GetName]에 국유 임대 주택을 짓기 위해 건설 여단을 동원합니다. 프로젝트는 2년 동안 민간 공장 용량을 점유하며 완료되면 국가 소비재 부담을 줄입니다."
 CHI_caic_innovation: "CAIC: 독자 혁신"
 CHI_caic_innovation_desc: "창허 항공공업은 Z-10부터 Z-19에 이르기까지 인민해방군 전용 공격 헬리콥터를 제작합니다. 기술자들이 위험을 감수할 수 있도록 풀어 주면 오랫동안 서방 설계에 뒤처져 온 회전익 타격 전력이 가속됩니다."
 CHI_cancel_east_china_sea_exercise: "동중국해 훈련 취소"
 CHI_cancel_east_china_sea_exercise_desc: "분쟁 중인 센카쿠, 즉 댜오위다오 인근에서의 해군 및 공군 훈련은 도쿄와의 관계를 번번이 악화시킵니다. 계획된 훈련을 중지하면 자제하는 모습을 보이고 일본을 안심시키며 평화적 부상이라는 서사를 뒷받침합니다."
 CHI_casc_innovation: "CASC: 독자 혁신"
 CHI_casc_innovation_desc: "중국항천과기집단은 국가의 우주 발사, 탄도 미사일, 위성을 운영합니다. 이를 개혁하면 중국의 억지력을 뒷받침하는 궤도 및 전략 체계가 가속됩니다."
 CHI_casic_innovation: "CASIC: 독자 혁신"
 CHI_casic_innovation_desc: "중국항천과공집단은 YJ 계열부터 지상 공격 체계에 이르기까지 국가의 순항 및 전술 미사일을 제작합니다. 산하 연구소들이 위험을 감수하게 하면 정밀 타격 무기고가 날카로워집니다."
 CHI_central_theatre_command: "중부 전구"
 CHI_central_theatre_command_desc: "베이징의 중부 전구는 전략 예비대이자 수도의 방패입니다. 다른 모든 방면을 뒷받침하는 병력의 지휘 권한과 사기를 쥐고 있습니다."
 CHI_cetc_innovation: "CETC: 독자 혁신"
 CHI_cetc_innovation_desc: "중국전자과기집단은 모든 현대 플랫폼의 기반이 되는 레이더, 센서, 전투 관리 체계를 공급합니다. 연구 문화를 개혁하면 중국의 컴퓨팅과 인공지능이 최전선으로 나아갑니다."
 CHI_chang_e_mission: "창어 탐사선 발사"
 CHI_chang_e_mission_desc: "창어 무인 탐사선이 달을 향해 출발하여 착륙, 조사를 수행하고 췌차오 중계 위성을 통해 교신합니다. 그 탐사선이 보내오는 자료는 뒤따를 우주비행사들을 위한 지형을 파악해 줍니다. 발사 경험이 쌓일수록 성공 확률이 높아집니다."
 CHI_cheju_summit_arrangement: "제주 정상회담 마련"
 CHI_cheju_summit_arrangement_desc: "휴양 섬 제주는 한국과의 고위급 회담을 위한 중립지를 제공합니다. 정상회담은 외교적 돌파구를 낳을 수 있지만, 준비가 부실한 회담은 공개적 거절로 이어져 양측의 입장을 굳힐 위험이 있습니다."
 CHI_convene_bilateral_channel: "양자 채널 소집"
 CHI_convene_bilateral_channel_desc: "쿼드(미국, 일본, 인도, 오스트레일리아 4자 안보 대화)는 베이징에 맞서 이들 국가를 묶습니다. 도쿄와 조용한 양자 채널을 열면 이 연합의 결속력에 의구심이 생기고 공고화가 더뎌집니다."
 CHI_crack_down_tibet_separatism: "티베트 분리주의 단속"
 CHI_crack_down_tibet_separatism_desc: "조율된 보안 및 행정 조치를 통해 티베트 전역의 분리주의 조직을 진압합니다. 중앙의 권위를 강화하고 통합을 가속합니다."
 CHI_crack_down_xinjiang_separatism: "신장 분리주의 단속"
 CHI_crack_down_xinjiang_separatism_desc: "신장 전역에 내부 보안 병력을 배치하여 분리주의 조직망을 와해합니다. 이 지역에 대한 국가 통제를 강화하고 순응도를 높이지만 국제적 감시를 받게 됩니다."
 CHI_crewed_lunar_landing_mission: "우주비행사 달 착륙"
 CHI_crewed_lunar_landing_mission_desc: "창정 10호 로켓이 멍저우 유인 우주선과 란웨 착륙선을 원창에서 각각 발사하여 달 궤도에서 랑데부합니다. 승무원은 달 남극 지역에 하강하여 깃발을 꽂고 무사히 귀환해야 하며, 이로써 중국은 인간을 달에 보낸 두 번째 국가가 됩니다."
 CHI_critical_minerals_export_license_decision: "핵심 광물 수출 규제"
 CHI_critical_minerals_export_license_decision_desc: "2023년 8월의 허가제 체계에 따라 갈륨, 게르마늄, 희토류 수출을 제한합니다. 공급이 줄어들수록 톤당 수익이 상승합니다."
 CHI_crrc_innovation: "CRRC: 독자 혁신"
 CHI_crrc_innovation_desc: "중국중차는 세계 최대의 철도 장비 제조사이자 막대한 규모의 이중 용도 중공업 기반입니다. 이곳의 공학 역량을 국방으로 돌리면 그 아래의 산업 토대가 넓어집니다."
 CHI_csgc_innovation: "CSGC: 독자 혁신"
 CHI_csgc_innovation_desc: "중국남방공업집단은 민수용 자동차 라인과 함께 육군의 장갑 전투 차량과 경화기를 제작합니다. 신중함의 벽을 허물면 현대적인 전투 차량 계열이 잠금 해제됩니다."
 CHI_csic_innovation: "CSIC: 독자 혁신"
 CHI_csic_innovation_desc: "중국선박중공업집단은 중국 잠수함 설계의 전통적 본산으로 파도 아래의 조용한 전력을 이끕니다. 산하 연구소를 개혁하면 차세대 공격 잠수함과 탄도 미사일 잠수함이 가속됩니다."
 CHI_cssc_innovation: "CSSC: 독자 혁신"
 CHI_cssc_innovation_desc: "중국선박중공집단은 항공모함을 포함한 인민해방군 해군 수상함대를 뒷받침하는 거대 기업입니다. 조선소에 혁신을 허용하면 원양 해군의 전함 건조가 빨라집니다."
 CHI_cultivate_pyongyang_contacts: "평양 인맥 육성"
 CHI_cultivate_pyongyang_contacts_desc: "중국은 연료와 식량의 대부분을 공급하는 북한의 필수 불가결한 후견국으로 남아 있습니다. 평양 지도부 내부에 은밀한 관계를 구축하면 베이징은 노골적인 간섭 없이 정권의 내부 안정을 흔들 수 있습니다."
 CHI_current_congress_mission: "전국대표대회 진행 중"
 CHI_current_congress_mission_desc: "전국대표대회가 개최 중입니다. 위원회 인선이 마무리되고 있습니다."
 CHI_cxmt_hbm_qualification_decision: "CXMT HBM 국내 AI용 인증"
 CHI_cxmt_hbm_qualification_decision_desc: "CXMT의 고대역폭 메모리를 캠브리콘, 비렌, 무어 스레드의 가속기 제품에 투입하여 국내 AI 연산에서 엔비디아와 삼성에 대한 의존을 끝냅니다."
 CHI_dandong_military_district: "단둥 군관구 증강"
 CHI_dandong_military_district_desc: "단둥은 압록강을 사이에 두고 북한과 마주한 곳으로, 중국과 조선민주주의인민공화국 국경의 주요 통로입니다. 동북 주둔군을 강화하는 것은 평양과의 상호 방위인 순망치한 원칙을 따르는 일이며 만주 국경을 단단히 하는 일입니다."
 CHI_de_escalate_at_LAC: "실질 통제선 긴장 완화"
 CHI_de_escalate_at_LAC_desc: "2020년 갈완 계곡 충돌 이후 중국과 인도는 라다크의 분쟁 중인 실질 통제선을 따라 긴장된 대치를 유지해 왔습니다. 국경 병력에 전방 진지에서 물러나도록 명령하면 뉴델리와의 대립이 누그러지고 지역 긴장도가 낮아집니다."
 CHI_Debt_Restructuring: "파트너 부채 재조정"
 CHI_Debt_Restructuring_desc: "채무 불이행 상태인 파트너의 금리를 2%로 낮추고 1년간 상환을 유예합니다. 원금은 그대로 남습니다. 상생 협력 노선에서만 사용할 수 있습니다."
 CHI_deploy_paf_maritime_militia: "인민무장부 해상 민병 배치"
 CHI_deploy_paf_maritime_militia_desc: "댜오위다오 일대에 해상 민병을 상시 배치합니다. 매월 센카쿠 압박이 높아지며 충돌 사고의 위험이 따릅니다."
 CHI_drip_irrigation_rollout: "점적 관개 보급"
 CHI_drip_irrigation_rollout_desc: "중국 농업은 매년 3,600억 세제곱미터가 넘는 물을 끌어다 쓰며, 그 대부분은 효율이 50퍼센트를 거의 넘지 못하는 고랑 담수식 관개를 통해 쓰입니다. 이스라엘의 정밀 농업 경험을 본보기로 삼고 신장의 면화 지대에서 시범 운영한 점적 및 미세 관개 시스템을 전국에 보급하면 헥타르당 농지 단위 물 소비량이 30~50퍼센트 줄어듭니다. 장비 보조금 프로그램과 신규 관개 구역에 대한 의무 효율 기준이 이 기술을 시범 농장에서 더 넓은 농업 부문으로 확산시킵니다."
 CHI_duv_breakthrough_decision: "SMEE DUV 프로그램 추진"
 CHI_duv_breakthrough_decision_desc: "상하이 마이크로 일렉트로닉스의 28나노 액침 리소그래피 시연을 강행합니다. 성공하면 세계 장비 시장이 재편되고, 실패하면 자본만 소진되고 일정이 1년 더 밀립니다."
 CHI_eastern_theatre_command: "동부 전구"
 CHI_eastern_theatre_command_desc: "난징에 본부를 둔 동부 전구는 대만 해협과 동중국해를 마주하고 있습니다. 병력은 상륙 돌격과 방어된 해안선을 돌파하는 데 필요한 화력을 중심으로 편성됩니다."
 CHI_eleventh_five_year_plan_mission: "제11차 5개년 계획"
 CHI_eleventh_five_year_plan_mission_desc: "중국의 제11차 5개년 계획(2006~2010년)은 경제 성장, 3차 산업 확대, 산업 역량, 국가 기반시설, 에너지 효율, 사회 복지의 여섯 가지 의무 발전 목표를 설정합니다. 국가발전개혁위원회가 5년 동안 진행 상황을 점검합니다."
 CHI_establish_dandong_safe_houses: "단둥 은신처 설치"
 CHI_establish_dandong_safe_houses_desc: "압록강변에 장 계열 탈북자들을 숨기고 조직할 은신처를 마련합니다. 향후 작전을 위한 조용한 집결지입니다."
 CHI_fabless_provincial_subsidy_decision: "성급 팹리스 보조금 라운드"
 CHI_fabless_provincial_subsidy_decision_desc: "상하이, 선전, 베이징은 각자 설계 업체 집적지를 위한 자체 벤처 자금으로 중앙 빅 펀드 분할금에 맞춰 출자합니다."
 CHI_facilitate_family_reunions: "이산가족 상봉 지원"
 CHI_facilitate_family_reunions_desc: "중국의 물류망을 이용해 국경을 넘는 이산가족 상봉을 조직합니다. 인도주의적 성과와 함께 그에 따른 외교적 호의도 얻게 됩니다."
 CHI_factional_balance_category: "파벌 균형"
 CHI_factional_balance_category_desc: "중국공산당은 단일한 조직이 아닙니다. 후견 네트워크, 이념적 성향, 경력 궤적에 뿌리를 둔 경쟁 파벌들이 인사 임명, 경제 정책, 정치 개혁의 속도를 둘러싸고 영향력을 다툽니다. 이러한 내부 집단 간 권력 균형을 관리하는 것이 안정적 통치의 전제 조건입니다."
 CHI_FOCAC_Summit: "FOCAC 정상회의 개최"
 CHI_FOCAC_Summit_desc: "3년마다 열리는 중국-아프리카 협력 포럼 정상회의를 개최합니다. 일대일로 기금과 국고에서 각각 50이 들고 정치력도 소모되며, 3년의 재사용 대기 시간이 있습니다."
 CHI_fund_princeling_ventures: "태자당 사업 자금 지원"
 CHI_fund_princeling_ventures_desc: "북한 태자당이 운영하는 국경 간 기업에 자금을 댑니다. 중국 자본에 묶인 부는 이념이 만들어 낼 수 없는 충성심을 낳습니다."
 CHI_fusion_program: "국가 핵융합 프로그램"
 CHI_fusion_program_desc: "실험용 선진 초전도 토카막(EAST), BEST 장치, 계획 중인 중국 핵융합 공학 시험로가 있는 허페이에 국가 연구를 집중시킵니다. '인공 태양'을 정복하면 무한한 청정 전기의 원천을 얻게 됩니다."
 CHI_gobi_desert_solar_expansion: "고비 사막 태양광·풍력 확장 단계"
 CHI_gobi_desert_solar_expansion_desc: "고비 사막에 태양광 패널과 풍력 터빈 건설 단계를 추가로 가동하여 재생 에너지 발전 용량을 확대합니다. 각 단계는 상당한 민간 건설 용량을 필요로 하며 전국의 전반적인 건설 처리량을 일시적으로 낮춥니다."
 CHI_grey_society_crisis: "회색 사회 위기"
 CHI_grey_society_crisis_desc: "중국의 생산 연령 인구는 2011년경 정점을 찍은 뒤 줄어들고 있습니다. 40년간의 한 자녀 정책은 인구 피라미드를 뒤집어 놓았습니다. 이제 자녀 한 명이 보통 부모 두 명과 조부모 네 명을 부양하는 반면, 연금과 의료 비용은 GDP보다 빠르게 증가합니다. 앞으로 10년은 노동력이 줄고 고령 인구가 늘어나는 가운데 중국이 성장을 유지할 수 있을지 시험하게 될 것입니다. 이 위기는 수년간 지속되며, 완화 결정은 그 지속 기간을 줄여 줍니다."
 CHI_haig_innovation: "HAIG: 독자 혁신"
 CHI_haig_innovation_desc: "하얼빈 항공공업집단은 Z-9와 신형 Z-20을 포함한 인민해방군의 수송 및 다목적 헬리콥터를 생산합니다. 설계진을 풀어 주면 다용도 회전익 전력이 빨라집니다."
 CHI_hsr_beijing_shanghai: "베이징-상하이 고속철도"
 CHI_hsr_beijing_shanghai_desc: "중국의 정치 수도와 금융 수도를 잇는 1,318킬로미터의 베이징-상하이 고속철도를 건설합니다. 개통 당시 세계에서 가장 붐비는 고속철도 회랑이며, 시속 300킬로미터로 소요 시간을 14시간에서 4시간 40분으로 줄입니다."
 CHI_hsr_beijing_tianjin: "베이징-톈진 도시 간 철도"
 CHI_hsr_beijing_tianjin_desc: "시속 350킬로미터의 상업 운행 속도를 목표로 설계된 최초의 고속 노선인 117킬로미터의 베이징-톈진 도시 간 철도를 건설합니다. 두 도시 사이의 이동 시간은 70분에서 30분으로 단축되어 베이징-톈진-허베이 통합 경제 회랑의 닻이 됩니다."
 CHI_hsr_chengdu_chongqing: "청두-충칭 고속철도"
 CHI_hsr_chengdu_chongqing_desc: "서부 대개발 전략의 두 축인 청두와 충칭을 잇는 고속철도 연결선을 건설합니다. 완공되면 두 거대 도시가 하나의 1시간 경제권으로 통합되며 확장되는 서부 고속철도망의 중추를 이룹니다."
 CHI_hsr_wuhan_guangzhou: "우한-광저우 고속철도"
 CHI_hsr_wuhan_guangzhou_desc: "중부 중국과 주강 삼각주 제조업 중심지를 잇는 1,069킬로미터의 우한-광저우 고속철도를 건설합니다. 개통 당시 세계에서 가장 긴 고속철도 노선이며, 소요 시간을 10시간 이상에서 3시간 미만으로 줄입니다."
 CHI_identify_beida_alumni: "베이징대학 동문 파악"
 CHI_identify_beida_alumni_desc: "베이징대학에서 수학한 북한 엘리트 자제들의 신상을 파악합니다. 이들의 중국과의 유대와 개혁적 성향은 장래 정부의 후보가 되게 합니다."
 CHI_industrial_investment_category: "석유화학 및 에너지 투자 프로그램"
 CHI_industrial_investment_category_desc: "중국의 석유화학 기반과 재생 에너지 중점 트리를 통해 잠금 해제되는 전략적 산업 투자 결정입니다."
 CHI_initiate_joint_exercises_with_RAJ: "인도와 합동 훈련 개시"
 CHI_initiate_joint_exercises_with_RAJ_desc: "신뢰를 쌓고 국경 긴장 완화의 성과를 공고히 하기 위해 인도군과 연합 훈련 주기를 운영합니다."
 CHI_initiate_joint_military_training: "철의 형제 합동 훈련 개시"
 CHI_initiate_joint_military_training_desc: "상호 운용성과 교리 정합을 높이기 위해 파키스탄군과 연합 훈련 주기를 운영합니다."
 CHI_inner_mongolia_innovation: "제1기계집단: 독자 혁신"
 CHI_inner_mongolia_innovation_desc: "내몽골 제1기계집단은 바오터우에서 99식 주력 전차를 만드는 중국 기갑의 요람입니다. 관료적 신중함의 벽을 허물면 차세대 중장갑 전투 차량이 잠금 해제됩니다."
 CHI_insert_jang_assets: "장 계열 자산 침투"
 CHI_insert_jang_assets_desc: "장 계열 요원들을 신분을 숨기고 조선민주주의인민공화국으로 다시 들여보냅니다. 현지에 자리 잡은 이들은 활성화를 기다립니다."
 CHI_invest_domestic_arms_lines: "국내 무기 생산 라인 투자"
 CHI_invest_domestic_arms_lines_desc: "인민해방군 주문이 로소보론엑스포트 계약이 아닌 국내에서 충족되도록 국가 자금을 노린코와 AVIC 생산 라인에 투입합니다. 투자가 이뤄질 때마다 러시아 공급자와의 격차가 좁혀집니다."
 CHI_invite_basf_caojing: "바스프 베르분트 통합"
 CHI_invite_basf_caojing_desc: "차오징 화학공업단지와 잔장 해안 지구에 통합형 베르분트 화학 단지를 건설하겠다는 바스프의 제안을 승인합니다. 87억 유로의 투자는 첨단 폴리머 및 아크릴 제조를 공정 통합 모델과 결합하여 18개 화학 공장에 걸쳐 유틸리티, 원자재, 부산물 흐름을 연결하며, 유럽 외 최초의 베르분트 거점이 됩니다."
 CHI_invite_bayer_nanjing: "코베스트로 소재 과학 센터"
 CHI_invite_bayer_nanjing_desc: "과거 바이엘 머티리얼사이언스였던 코베스트로를 초청하여 상하이에 지역 연구 및 생산 본부를 설립하게 합니다. 30억 유로 규모의 시설은 폴리카보네이트, 폴리우레탄 전구체, 고급 코팅제를 생산하며, 해당 부문의 글로벌 연구개발 센터를 독일에서 이전하여 산업용 및 고성능 소재에 적용 가능한 폴리머 화학 전문 지식을 이전합니다."
 CHI_invite_exxonmobil_jv: "엑손모빌 취안저우 합작 사업"
 CHI_invite_exxonmobil_jv_desc: "취안저우의 푸젠 정유 석유화학 회사에 대한 엑손모빌의 25퍼센트 지분 참여를 승인하여 최초의 완전 통합형 중외 합작 정유·석유화학 단지를 설립합니다. 엑손모빌은 대규모 통합 정유 운영 전문 지식과 함께 첨단 스팀 크래킹 및 폴리올레핀 생산 기술을 제공합니다."
 CHI_invite_JAP_hitachi: "히타치 초청"
 CHI_invite_JAP_hitachi_desc: "히타치의 산업 및 방위 전자 부문은 철도 제어 시스템, 발전 설비, 임베디드 컴퓨팅 하드웨어를 생산하며, 중국의 산업 및 군사 기반시설 전반에 폭넓은 이중 용도로 적용될 수 있습니다."
 CHI_invite_JAP_honda: "혼다 자동차 초청"
 CHI_invite_JAP_honda_desc: "혼다의 파워트레인 공학 및 로봇 공학 부문은 민간 제조와 방위 관련 생산 라인 모두에 적용할 수 있는 소형 엔진 기술과 공장 자동화 시스템을 제공합니다."
 CHI_invite_JAP_howa: "호와 기계 초청"
 CHI_invite_JAP_howa_desc: "호와 기계는 일본 육상자위대의 89식 및 20식 돌격소총을 만드는 주요 제조사입니다. 정밀 기계 가공 공정과 소화기 생산 라인 관리는 곧바로 활용 가능한 가치를 지닙니다."
 CHI_invite_JAP_ihi: "IHI 주식회사 초청"
 CHI_invite_JAP_ihi_desc: "IHI는 일본을 대표하는 항공 엔진 및 선박 추진 시스템 제조사로, 서방 파트너의 라이선스를 받아 군용기용 터보팬 엔진과 해군 함정용 터빈 부품을 생산합니다."
 CHI_invite_JAP_jmu: "재팬 마린 유나이티드 초청"
 CHI_invite_JAP_jmu_desc: "재팬 마린 유나이티드는 해상자위대의 주요 수상 전투함 건조사로, 이즈모급 헬리콥터 탑재 호위함과 마야급 이지스 유도 미사일 구축함을 담당합니다. 이곳의 모듈형 함정 설계 방식은 중국 조선 사업에 곧바로 적용할 수 있습니다."
 CHI_invite_JAP_jr_east: "JR 동일본 초청"
 CHI_invite_JAP_jr_east_desc: "JR 동일본은 세계에서 가장 발전된 고속철도망을 운영합니다. 철도 차량 공학, 신호 체계, 기반시설 유지보수 전문 지식은 민간 경제적 가치와 전략적 수송 현대화를 모두 제공합니다."
 CHI_invite_JAP_jsw: "일본제강소 초청"
 CHI_invite_JAP_jsw_desc: "일본제강소는 압력 용기, 함포 포신, 원자로 부품에 쓰이는 대구경 강철 단조품의 세계적 선도 생산업체입니다. 이곳의 야금 전문 지식은 중국의 중공업 생산을 곧바로 끌어올릴 것입니다."
 CHI_invite_JAP_kawasaki_aerospace: "가와사키 중공업(항공우주) 초청"
 CHI_invite_JAP_kawasaki_aerospace_desc: "가와사키의 항공우주 부문은 C-2 수송기와 P-1 해상 초계기를 생산하여, 상업용과 방위용 모두에 걸맞은 대형 기체 제작 및 임무 체계 통합에 깊은 역량을 갖추고 있습니다."
 CHI_invite_JAP_kawasaki_shipbuilding: "가와사키 중공업(조선소) 초청"
 CHI_invite_JAP_kawasaki_shipbuilding_desc: "가와사키 중공업의 조선 부문은 소류급 잠수함 건조를 담당합니다. 잠수함 내압 선체 제작과 음향 신호 저감 노하우는 상당한 해군 역량의 이전을 의미합니다."
 CHI_invite_JAP_komatsu: "고마쓰 디펜스 초청"
 CHI_invite_JAP_komatsu_desc: "고마쓰 디펜스는 일본 육상자위대를 위한 경장갑 차량과 자주포를 제조합니다. 모듈식 제작 방식과 경량 장갑 솔루션은 기존 중국 차량 사업을 보완합니다."
 CHI_invite_JAP_mhi_tank: "미쓰비시 중공업(지상 시스템) 초청"
 CHI_invite_JAP_mhi_tank_desc: "미쓰비시 중공업의 지상 시스템 부문은 10식 및 90식 주력 전차와 각종 장갑 차량을 생산합니다. 협력을 통해 장갑 설계 방법론과 첨단 복합 장갑 기술이 이전됩니다."
 CHI_invite_JAP_mitsubishi_aerospace: "미쓰비시 항공우주 초청"
 CHI_invite_JAP_mitsubishi_aerospace_desc: "미쓰비시 중공업의 항공우주 부문은 F-2 기종과 초기 단계의 F-X 사업을 포함해 일본의 첨단 군용기 개발을 주도합니다. 이들이 중국에 진출하면 기체 공학 전문 지식과 이중 용도 제조 역량을 가져옵니다."
 CHI_invite_JAP_mitsubishi_shipbuilding: "미쓰비시 조선 초청"
 CHI_invite_JAP_mitsubishi_shipbuilding_desc: "미쓰비시의 조선 부문은 해상자위대를 위한 구축함 선체와 잠수함 내압 선체를 건조하며, 고급 군함 사업에 적합한 함정 건조 기술과 정밀 용접 공정을 제공합니다."
 CHI_invite_JAP_nec: "NEC 주식회사 초청"
 CHI_invite_JAP_nec_desc: "NEC는 C4ISR 체계, 위성 통신 하드웨어, 신호 정보 플랫폼을 개발하는 일본의 선도 기업입니다. 통합 전문 지식은 방위 전자와 민간 네트워크 기반시설 모두에 걸쳐 있습니다."
 CHI_invite_JAP_nippon_steel: "닛폰 제철 초청"
 CHI_invite_JAP_nippon_steel_desc: "닛폰 제철은 세계 최대의 고장력 구조용 강철 생산업체 중 하나입니다. 고경도 장갑판과 특수 합금 생산은 일본 방위 산업과 더 넓은 기반시설 부문 모두에 쓰입니다."
 CHI_invite_JAP_panasonic: "파나소닉 초청"
 CHI_invite_JAP_panasonic_desc: "파나소닉은 일본 방위 공급망에 첨단 배터리 기술, 내구성 강화 전자 장비, 열화상 부품을 공급하며, 그 생산 기준은 군용 플랫폼 통합에 곧바로 적용할 수 있습니다."
 CHI_invite_JAP_subaru: "스바루 항공우주 초청"
 CHI_invite_JAP_subaru_desc: "스바루 주식회사의 항공우주 부문은 라이선스를 받아 헬리콥터 동체와 고정익 기체 부품을 생산하며, 정밀 금속 가공과 회전익 구조 설계에 특히 강점이 있습니다."
 CHI_invite_JAP_toshiba: "도시바 디펜스 시스템즈 초청"
 CHI_invite_JAP_toshiba_desc: "도시바 디펜스 시스템즈는 일본 자위대를 위한 레이더 어레이, 전자전 장비, 미사일 유도 하드웨어를 생산하며, 핵심 센서 기술과 임베디드 시스템 공학을 파트너십에 가져옵니다."
 CHI_invite_JAP_toyota: "도요타 자동차 초청"
 CHI_invite_JAP_toyota_desc: "도요타의 첨단 제조 시스템과 적시 생산 물류 원칙은 상용 차량 생산뿐 아니라 일본군에 공급되는 경량 다목적 및 물류 차량 사업의 토대이기도 합니다."
 CHI_invite_saudi_aramco: "사우디 아람코 전략적 정유 지분"
 CHI_invite_saudi_aramco_desc: "사우디 아람코에 푸젠 정유 석유화학 회사와 다롄의 헝리 석유화학 단지 지분을 제공합니다. 푸젠에 대한 아람코의 25퍼센트 지분과 헝리에 대한 10퍼센트 지분은 하루 40만 배럴의 합산 정유 용량을 아라비아 반도에서 오는 원유 공급 파이프라인과 통합하여, 중국 정유 부문을 사우디 원유의 장기 공급원에 묶어 둡니다."
 CHI_invite_shell_chem: "셸 다야만 화학 파트너십"
 CHI_invite_shell_chem_desc: "광둥 다야만 석유화학 구역의 셸-CNOOC 합작 사업을 확장합니다. 셸과 CNOOC의 50 대 50 파트너십은 연간 160만 톤 규모의 에틸렌 크래커를 운영하며 폴리에틸렌, 폴리프로필렌, 에틸렌 글리콜, 폴리에테르 폴리올, 스티렌을 생산하여 남부 해안 전역의 중국 하류 화학 생산을 다변화합니다."
 CHI_jap_capitulate_to_demands: "중국의 요구에 굴복"
 CHI_jap_capitulate_to_demands_desc: "베이징의 조건을 수용합니다. 금수 조치는 해제되지만 국내에서의 정치적 대가는 현실적입니다."
 CHI_jap_diversify_rare_earth: "희토류 공급 다변화"
 CHI_jap_diversify_rare_earth_desc: "중국산 희토류 의존에서 벗어나기 위한 1년짜리 속성 프로그램입니다. 고통스럽지만 향후 금수 조치를 무력화합니다."
 CHI_jap_open_back_channel: "비공식 채널 협상 개시"
 CHI_jap_open_back_channel_desc: "비공식 채널을 이용해 센카쿠 해역의 긴장을 낮춥니다."
 CHI_jap_reinforce_coast_guard: "해상보안청 증강"
 CHI_jap_reinforce_coast_guard_desc: "동중국해에서 해상보안청 순찰을 급증시킵니다. 중국의 침범을 억제하지만 긴장 고조의 악순환을 부추깁니다."
 CHI_japan_strategy: "대일 전략"
 CHI_japan_strategy_desc: "희토류 압박, RCEP 정렬, 센카쿠 해상 압박, 비공식 외교, 산업 초청에 이르는 중일 경쟁의 전체 메뉴입니다. 관계가 강압과 유화 사이를 오가는 동안 베이징과 도쿄 모두 여기서 결정을 내립니다."
 CHI_kaesong_expansion: "개성 공단 확장"
 CHI_kaesong_expansion_desc: "남측 자본이 북측 노동력을 고용하던 개성 공업지구는 남북 관계가 무너지면서 2016년에 폐쇄되었습니다. 재개를 중재하는 공동 개발자 역할은 한반도의 긴장을 완화하고 남북한 모두를 중국의 투자에 묶어 둡니다."
 CHI_KPA_Officer_Exchange: "조선인민군 장교 교류 프로그램"
 CHI_KPA_Officer_Exchange_desc: "인민해방군 장교를 평양에 파견하여 조선인민군 상대역들과 합동 훈련 및 계획 회의를 진행합니다. 주기가 반복될 때마다 군사적 상호 운용성이 깊어지고 북한 지휘부에 대한 중국의 영향력이 커집니다."
 CHI_kpop_media_ban: "K-팝 미디어 금지"
 CHI_kpop_media_ban_desc: "중국 내 한국 연예 콘텐츠의 방송과 유통을 제한합니다. 이 금지령은 서울의 안보 노선 선택에 대한 지렛대로서 한류 문화 상품을 겨냥합니다."
 CHI_LATAM_emergency_aid: "중남미 파트너 긴급 원조"
 CHI_LATAM_emergency_aid_desc: "중남미의 안보 우산 파트너에게 재량 원조 패키지를 보냅니다. 해당국의 안정도와 우리의 영향력이 상승합니다."
 CHI_LATAM_intel_sharing_pact: "정보 공유 협정"
 CHI_LATAM_intel_sharing_pact_desc: "파트너 정부와 양자 정보 공유 채널을 개설합니다. 상호 군사적 접근권을 부여하고 동반자 관계를 강화합니다."
 CHI_LATAM_military_advisors: "군사 고문 파견"
 CHI_LATAM_military_advisors_desc: "인민해방군 훈련 간부를 파트너국의 군에 파견합니다. 육군 경험이 이전되고 국방 유대가 깊어집니다."
 CHI_LATAM_security_options: "중남미 안보 옵션"
 CHI_launch_payload: "탑재체 발사"
 CHI_launch_payload_desc: "주취안, 시창, 원창, 타이위안에서 꾸준한 발사 주기를 유지합니다. 발사에 성공할 때마다 주력 임무의 성공 확률을 높이는 운용 경험이 쌓이며, 이는 달 탐사에 착수하기 위한 전제 조건입니다."
 CHI_lift_rare_earth_embargo: "희토류 금수 해제"
 CHI_lift_rare_earth_embargo_desc: "희토류 수출 금지를 끝냅니다. 도쿄는 한숨을 돌립니다."
 CHI_lift_thaad_sanctions: "THAAD 제재 해제"
 CHI_lift_thaad_sanctions_desc: "THAAD 배치에 대응하여 부과한 비공식 경제 제재를 공식적으로 해제합니다. 이 결정은 서울과의 관계를 정상화하려는 의지를 보여 줍니다."
 CHI_localise_licensed_system: "라이선스 체계 국산화"
 CHI_localise_licensed_system_desc: "엔진이든 레이더든 미사일 탐색기든 현재 러시아 라이선스로 제작되는 체계를 역설계하여 토착화함으로써, 모스크바에 지급하는 로열티를 줄이고 중국 산업이 자립할 수 있음을 증명합니다."
 CHI_locate_jang_loyalists: "장 계열 충성파 색출"
 CHI_locate_jang_loyalists_desc: "국경 지역에 흩어져 있는 장성택 파벌의 생존자들을 파악합니다. 숙청당한 이 조직망은 김씨 일가 핵심층에 대한 원한을 간직하고 있습니다."
 CHI_mature_node_export_drive_decision: "성숙 공정 수출 드라이브"
 CHI_mature_node_export_drive_decision_desc: "SMIC과 화훙 고객사에 보조금을 지급하여 성숙 공정 칩으로 세계 자동차, IoT, 백색가전 시장을 석권합니다. 분할금마다 무역 관계가 중첩됩니다."
 CHI_megaprojects: "국가 메가 프로젝트"
 CHI_megaprojects_desc: "싼샤 댐에서 세계 최대의 고속철도망에 이르기까지, 국가가 주도하는 메가 프로젝트라는 중국의 전통입니다. 국가의 수자원, 전력, 교통 체계를 바꿔 놓을 대표 건설 사업에 국가 자원을 투입합니다."
 CHI_military_decisions_category: "군 구조 개편"
 CHI_MSS_Pyongyang_Station: "국가안전부 평양 지부"
 CHI_MSS_Pyongyang_Station_desc: "평양의 국가안전부 지부를 확장하여 북한 지도부에 대한 정보 수집 범위와 정권 불안정에 대한 조기 경보 능력을 높입니다."
 CHI_MSS_Quiet_Removal_Operation: "조용한 제거 작전"
 CHI_MSS_Quiet_Removal_Operation_desc: "국가안전부는 평양에서 개혁 의제를 가로막는 강경파를 특정했습니다. 은밀한 작전으로 걸림돌을 제거하고 추가 자유화의 길을 열 수 있습니다."
 CHI_national_commitee_decisions_category: "전국 위원회"
 CHI_national_commitee_decisions_category_desc: "\n£GFX_CHI_commission_1 \n\n\n\n중국공산당 중앙위원회는 전국대표대회 사이에 당무를 관장합니다. 5년마다 새로운 대회가 소집되어 위원을 선출하고, 서기를 임명하며, 당의 정치적 방향을 정합니다."
 CHI_NKO_Rason_SEZ_Investment: "라선 경제특구 투자"
 CHI_NKO_Rason_SEZ_Investment_desc: "라선 경제특구에 직접 자금을 투입합니다. 이 투자는 항만 접근권을 열어 주고 북한 경제 개혁의 실현 가능성을 보여 줍니다."
 CHI_norinco_innovation: "NORINCO: 독자 혁신"
 CHI_norinco_innovation_desc: "중국북방공업집단은 지상군 전체의 소화기와 포를 공급하는 국내 최대 지상 체계 복합 기업입니다. 설계국들이 소심한 모방에서 벗어나게 하면 진정으로 새로운 보병 및 화포 체계를 추구할 수 있습니다."
 CHI_northern_theatre_command: "북부 전구"
 CHI_northern_theatre_command_desc: "선양을 중심으로 하는 북부 전구는 한반도와 러시아 국경을 관할합니다. 작전 계획과 중무장 합동 병과 부대의 결속을 중시합니다."
 CHI_olympic_athlete_village: "선수촌 및 미디어 센터"
 CHI_olympic_athlete_village_desc: "올림픽 그린 북부에 올림픽 선수촌과 국제 미디어 방송 센터를 건설합니다. 완공 후 건물은 주거 및 상업용으로 전환되어 베이징의 주택 및 사무 공간 재고를 늘립니다."
 CHI_olympic_environmental_program: "환경 프로그램"
 CHI_olympic_environmental_program_desc: "베이징 난방망의 석탄에서 가스로의 전환을 가속하고, 수도강철그룹의 오염이 가장 심한 시설을 이전하며, 주변 산지에서 대규모 조림 사업을 시작합니다. 이 프로그램은 대기질을 올림픽 기준으로 끌어올리고 지속 가능한 발전에 대한 중국의 의지를 보여 줄 것입니다."
 CHI_olympic_mission: "베이징 올림픽 준비"
 CHI_olympic_mission_desc: "우리는 2008년 베이징 올림픽 개최를 약속했습니다. 국제 사회가 지켜보고 있습니다. 마감 기한 전에 경기장, 선수 숙소, 교통, 환경의 네 가지 준비 프로그램 모두에 자금을 투입하십시오. 제때 이행하지 못하면 정부가 망신을 당하고 국민의 신뢰가 훼손될 것입니다."
 CHI_olympic_preparations: "올림픽 준비"
 CHI_olympic_preparations_tt: "올림픽 준비 중점을 모두 완료하면 다음을 얻습니다."
 CHI_olympic_transport_links: "올림픽 교통망"
 CHI_olympic_transport_links_desc: "올림픽 그린까지 지하철 노선을 연장하고, 베이징 서우두 공항 철도를 개통하며, 대회 기간과 그 이후에 예상되는 여객 및 화물 급증을 소화하도록 친황다오-선양 철도 회랑을 개선합니다."
 CHI_olympic_venue_construction: "올림픽 경기장 건설"
 CHI_olympic_venue_construction_desc: "올림픽 그린 지구에 국가체육장, 국가수영센터, 국가 벨로드롬 건설에 자금을 댑니다. 이 중심 경기장들은 2008년 베이징 올림픽의 영구적 유산이 되며 수도의 상업 및 스포츠 거점으로도 기능할 것입니다."
 CHI_pacific_pla_training: "태평양 인민해방군 훈련"
 CHI_patrol_diaoyu_fishing_grounds: "댜오위다오 어장 순찰"
 CHI_patrol_diaoyu_fishing_grounds_desc: "인민무장부 경비정을 분쟁 해역에 보냅니다. 압박이 높아지고 도쿄는 대응할 수밖에 없게 됩니다."
 CHI_pla_joint_maritime_exercise: "태평양 합동 해상 훈련"
 CHI_pla_joint_maritime_exercise_desc: "태평양 일대일로 파트너들과 합동 해상 훈련을 실시합니다. 해당국의 해군 경험과 지역 전반에 대한 우리의 영향력이 상승합니다."
 CHI_pla_train_SOL: "솔로몬 제도 보안군 훈련"
 CHI_pla_train_SOL_desc: "솔로몬 제도 보안군을 지원하기 위해 인민해방군 훈련 간부를 파견합니다. 육군 경험이 이전되고 국방 유대가 깊어집니다."
 CHI_poly_innovation: "폴리 테크놀로지스: 독자 혁신"
 CHI_poly_innovation_desc: "인민해방군의 무기 수출 부문인 폴리 테크놀로지스는 중국 군사 장비 전 품목에 걸쳐 있습니다. 상업적 영향력을 진정한 개발 쪽으로 돌리면 방위 부문 전반의 발전이 확대됩니다."
 CHI_Press_NKO_on_Nuclear: "평양에 핵 자제 압박"
 CHI_Press_NKO_on_Nuclear_desc: "북한에 핵실험 동결과 배치 제한을 요구하는 직접적인 외교적 압박을 가합니다. 진전은 점진적이지만 베이징이 비확산 문제에서 진지한 파트너임을 워싱턴에 보여 줍니다."
 CHI_pressure_iaea_access: "IAEA 접근 압박"
 CHI_pressure_iaea_access_desc: "평양에 IAEA 사찰단의 영변 단지 방문을 허용하도록 압박합니다. 서방의 요구는 북한의 저항만 굳힐 뿐이지만 중국의 압박은 무게가 있습니다."
 CHI_princeling_intelligence_report: "태자당 정보 보고서"
 CHI_princeling_intelligence_report_desc: "북한 지도부 내부의 네트워크 자산이 보내온 최신 보고를 취합합니다. 검토할 때마다 정권의 파벌, 경쟁 관계, 압박 지점에 대한 그림이 선명해집니다."
 CHI_pro_natalist_subsidies: "출산 장려 보조금"
 CHI_pro_natalist_subsidies_desc: "중국 전역의 지방정부가 출산을 장려하기 위해 직접 현금 지급, 주택 구입 보조금, 연장된 출산 및 육아 휴가를 제공하기 시작합니다. 지린과 쓰촨을 비롯한 성들은 자녀 1인당 수만 위안 규모의 프로그램을 시범 운영합니다. 국제 비교에 따르면 막대한 재정 지출에도 출산율 증가는 미미하지만, 보조금은 가계 비용을 줄이고 단기적으로 내수 소비를 뒷받침합니다."
 CHI_propose_unity_government: "한반도 통일 정부 제안"
 CHI_propose_unity_government_desc: "상호 인정을 전제로 한 과도 통일 정부에 대한 공식 중국 제안서를 제출합니다. 이 시대에서 가장 대담한 외교적 승부수이자 가장 위험한 수입니다."
 CHI_push_rcep_signing: "RCEP 서명 추진"
 CHI_push_rcep_signing_desc: "2020년 11월 서명되어 2022년 1월에 발효된 역내포괄적경제동반자협정(RCEP)은 중국, 일본, 한국, ASEAN 국가들, 오스트레일리아, 뉴질랜드를 세계 최대의 자유무역지대로 묶습니다. 서명을 확보하면 우리가 아시아 무역의 중심에 자리 잡게 됩니다."
 CHI_railway_central_upgrade: "중부 철도 회랑 개선"
 CHI_railway_central_upgrade_desc: "후베이, 허난, 베이징을 포괄하는 중부 중국과 베이징 허브의 철도 터미널과 기반시설을 개선합니다. 이 회랑을 강화하면 중국에서 가장 밀집한 화물 동맥의 혼잡이 줄어들고 내륙 제조 구역으로의 산업 자재 공급이 개선됩니다."
 CHI_railway_east_upgrade: "동부 철도 회랑 개선"
 CHI_railway_east_upgrade_desc: "장시, 안후이, 쓰촨을 하나의 연속된 화물 및 여객망으로 연결하는 동부 및 중부 중국의 철도 터미널과 기반시설을 개선합니다. 이 개선으로 지역 건설 용량이 늘고 해안 항구에서 내륙으로 산업 투입재를 옮기는 데 걸리는 시간이 줄어듭니다."
 CHI_railway_improvement: "국가 철도 현대화"
 CHI_railway_north_upgrade: "북부 철도 회랑 개선"
 CHI_railway_north_upgrade_desc: "허베이, 산시와 주변 성들을 잇는 화북 회랑을 따라 철도 터미널과 지상 기반시설을 개선합니다. 철도 용량이 개선되면 보급 처리량이 늘고 물류 비용이 줄며 지역 전반의 건설이 가속됩니다."
 CHI_railway_south_upgrade: "남부 철도 회랑 개선"
 CHI_railway_south_upgrade_desc: "광둥, 후난과 남서 국경 성들을 전국망에 연결하는 화남 및 윈난 전역의 철도 터미널과 기반시설을 개선합니다. 이 프로그램은 공산품과 농산물의 이동을 빠르게 하는 한편 회랑을 따른 산업 확장을 뒷받침합니다."
 CHI_railway_west_upgrade: "서부 철도 회랑 개선"
 CHI_railway_west_upgrade_desc: "산시, 간쑤, 충칭, 신장을 전국 화물망에 연결하는 북서 및 남서 전역의 철도 터미널과 기반시설을 개선합니다. 이 투자는 서부 산업 단지의 운송 비용을 줄이고 이전에는 고립되어 있던 성들을 대규모 제조 공급망에 연결합니다."
 CHI_raise_retirement_age: "정년 연장"
 CHI_raise_retirement_age_desc: "1978년에 정해진 중국의 법정 정년은 세계에서 가장 낮은 축에 속합니다. 남성은 60세, 사무직 여성은 55세, 생산직 여성은 50세입니다. 단계적 연장은 근로 기간을 2~5년 늘려 숙련 노동자를 더 오래 노동력으로 유지하고 연금 제도의 부담을 덜어 줍니다. 조기 퇴직을 기대하는 노동자와 채용 감소를 우려하는 청년층의 반발이 상당합니다."
 CHI_rare_earth_chip_leverage_decision: "희토류 통제 지렛대 활용"
 CHI_rare_earth_chip_leverage_decision_desc: "서방의 칩 금수 완화를 중국의 희토류 및 갈륨 수출 지속과 연계합니다. 워싱턴과 협상을 시작합니다. 성공하면 통제가 완화되고 자립이 진전되며, 거절당하면 금수 조치가 강화되고 투입한 정치력이 헛되이 소진됩니다."
 CHI_rare_earth_embargo_decision: "희토류 지렛대 발동"
 CHI_rare_earth_embargo_decision_desc: "중국은 모든 유도 미사일과 스텔스 항공기 안에 들어가는 자석의 원료인 세계 희토류 원소의 90퍼센트 가까이를 정제합니다. 경쟁국의 접근을 차단하면 몇 달 동안 그 나라의 방위 생산이 멈추지만, 그 대가로 정치력을 잃고 신뢰할 수 없는 공급국이라는 평판을 얻습니다."
 CHI_rare_earth_supply_assurance: "희토류 공급 보장"
 CHI_rare_earth_supply_assurance_desc: "중국은 한국의 반도체, 배터리, 디스플레이의 원료가 되는 세계 희토류 원소의 압도적 다수를 정제합니다. 서울에 공급을 보장해 주면 우리는 믿을 만한 파트너가 되고 동맹국에 대한 워싱턴의 장악력은 약해집니다."
 CHI_rcep_deepening: "RCEP 심화"
 CHI_rcep_deepening_desc: "역내 파트너들에게 RCEP 이행 공약의 가속화를 제안합니다. 아시아·태평양과의 더 깊은 경제 통합은 중국이 역내 필수 불가결한 경제 파트너라는 입지를 공고히 합니다."
 CHI_recall_paf_maritime_militia: "인민무장부 해상 민병 철수"
 CHI_recall_paf_maritime_militia_desc: "상시 배치한 민병을 철수시키고 압박이 식도록 둡니다."
 CHI_rein_in_cliques: "파벌 단속"
 CHI_rein_in_cliques_desc: "밀수 파벌과 후견 네트워크가 통제할 수 없을 만큼 커지기 전에 주기적으로 감사를 실시합니다. 횡령된 자금을 환수하면 국고가 채워지고 당의 자신감이 재확립되지만, 장교단은 이러한 감시를 못마땅해합니다."
 CHI_replace_synopsys_cadence_decision: "시높시스와 케이던스 대체"
 CHI_replace_synopsys_cadence_decision_desc: "2025년 5월의 수출 금지 이후, 모든 국내 팹리스 업체가 완전한 설계 범위를 확보하도록 엠파이리언, 프리마리우스, 엑스피딕의 EDA 흐름으로 이전시킵니다."
 CHI_retry_chang_e_mission: "창어 탐사선 재발사"
 CHI_retry_chang_e_mission_desc: "탐사선이 달에 도달하거나 조사하는 데 실패했습니다. 대체 탐사선을 제작하여 다시 보냅니다."
 CHI_retry_shenzhou_mission: "선저우 임무 재비행"
 CHI_retry_shenzhou_mission_desc: "지난 시도는 실패로 끝났습니다. 비행 데이터를 검토하고 결함을 바로잡은 뒤 또 한 대의 선저우를 발사대에 세웁니다."
 CHI_retry_tiangong_mission: "톈궁 조립 재시도"
 CHI_retry_tiangong_mission_desc: "도킹 또는 모듈 삽입이 계획대로 진행되지 않았습니다. 재정비하고 우주 정거장 조립을 다시 시도합니다."
 CHI_sac_innovation: "선양 항공기: 독자 혁신"
 CHI_sac_innovation_desc: "선양 항공기 공업은 J-11 계열에서 함재형 J-15와 J-35에 이르기까지 인민해방군 공군과 해군의 대형 전투기를 제작합니다. 이를 개혁하면 중국 공중전의 최첨단이 날카로워집니다."
 CHI_sco_anti_terror_crackdown: "대테러 단속 개시"
 CHI_sco_anti_terror_crackdown_desc: "보안 기관에 SCO '3대 악' 틀에 따라 테러 조직망에 대한 전방위 단속을 실시하도록 지시합니다. 국내 안정도를 희생하는 대가로 일시적으로 대테러 태세를 높입니다."
 CHI_sco_apply_as_dialogue_partner: "대화 파트너 지위 신청"
 CHI_sco_apply_as_dialogue_partner_desc: "상하이협력기구 내 대화 파트너 지위를 공식적으로 요청할 수 있습니다. 이는 중국 및 그 파트너들과 더 깊이 관여하기 위한 첫걸음입니다."
 CHI_sco_category: "상하이협력기구"
 CHI_sco_category_desc: "\n£MAIN_desctext_sco \n\n\n\n§Y상하이협력기구§!, 즉 §YSCO§!는 경제, 정치, 안보 협력에 초점을 맞춘 유라시아 정부 간 기구입니다. §Y상하이 5국§!에서 비롯되어 §Y[CHI.GetFlag]중국§!과 §Y[SOV.GetFlag]러시아§!가 지역 안정과 협력을 관리하면서 영향력을 확대하는 폭넓은 틀로 발전했습니다.\n\n§YSCO§!는 전통적인 동맹으로 기능하는 것이 아니라 점진적 통합을 통해 성장합니다. 국가들은 먼저 §Y대화 파트너§!가 된 뒤 §Y옵서버§!를 거쳐 최종적으로 §Y정회원§! 가입을 신청할 수 있습니다.\n\n각국이 §YSCO§!와 협력하려는 의지는 여러 요인에 좌우됩니다.\n\n§Y중국의 공세성§!은 §Y[CHI.GetFlag]중국§!이 얼마나 공세적인지를 반영합니다. 낮은 수준에서는 기구의 매력이 높아지고, 높은 수준에서는 협력 의지를 꺾어 회원국이 이탈할 수도 있습니다.\n\n§YSCO 결속력§!은 참여국 간의 내부 안정과 신뢰를 나타냅니다. 결속력이 높으면 협력과 프로젝트 효율이 개선되고, 낮으면 통합이 더뎌지고 회원국이 이탈할 위험이 커집니다.\n\n§Y중러 균형§!은 기구의 내부 정치적 안정을 결정합니다. 균형 잡힌 관계는 원활한 확장을 보장하지만, 어느 한쪽의 지배는 마찰, 지연, 협력 감소로 이어질 수 있습니다.\n\n공동 §Y경제§!, §Y안보§!, §Y전략 프로젝트§!를 통해 §YSCO§!는 참여국이 영향력을 확대하고 지역 유대를 강화하며 유라시아 전역에 대안적 권력 블록을 구축할 수 있게 합니다.\n\n중국의 공세성이 §R5§!와 §R10§! 수준을 넘으면 §Y[JAP.GetNameWithFlag]§!은(는) [CHI.GetFlag]§Y[CHI.GetAdjectiveCap]§! 군사적 입지에 맞서는 방향으로 헌법 제9조를 확대 해석할 수 있는 새로운 옵션을 얻게 됩니다.\n\n$CHI_chinese_aggression_display$\n$CHI_sco_cohesion_display$\n$CHI_sco_balance_display$"
 CHI_sco_cohesion_decay: "SCO 결속력 조정"
 CHI_sco_cohesion_decay_desc: "SCO 결속력을 자연 균형 수치인 5 쪽으로 이끄는, 보이지 않는 연례 재조정입니다. 활성화된 메가 프로젝트 하나당 0.5포인트만큼 상향 조정됩니다. 결속력이 균형보다 높으면 1 감소하고, 낮으면 1 증가합니다."
 CHI_sco_consider_leaving: "SCO 회원국 지위 재고"
 CHI_sco_consider_leaving_desc: "AI가 관리하는 숨겨진 결정으로, 회원국과 옵서버국이 베이징과의 관계 악화나 SCO 결속력 문제의 심화가 참여 수준을 낮출 만한 사유인지 평가합니다. 중국의 공세에 많이 노출되었거나 중국에 대한 관계가 나쁜 국가일수록 탈퇴를 더 진지하게 고려합니다."
 CHI_sco_upgrade_to_member: "SCO 정회원 가입 신청"
 CHI_sco_upgrade_to_member_desc: "공인된 옵서버로서 이제 상하이협력기구의 정회원 가입을 신청할 수 있습니다."
 CHI_sco_upgrade_to_observer: "옵서버 지위 신청"
 CHI_sco_upgrade_to_observer_desc: "대화 파트너로 자리를 잡았으므로 이제 SCO 내에서 정식 옵서버 지위를 추구할 수 있으며, 이를 통해 더 폭넓은 경제 및 정치 협력에 접근할 수 있습니다."
 CHI_scs_assertive_patrol_MAY: "강경 순찰: 말레이시아령 스프래틀리"
 CHI_scs_assertive_patrol_MAY_desc: "인민해방군 해군 함대를 루코니아 암초 인근 스프래틀리 남부의 말레이시아와 분쟁 중인 해역에 투입하도록 명령합니다. 쿠알라룸푸르는 우리와의 경제적 유대 때문에 대응 선택지가 복잡하지만, 충돌 카운터를 진행시키려면 여전히 결정적 승리가 필요합니다. 말레이시아의 신중한 태도로 인해 결론이 나지 않는 교전이 흔하며, 차질이 생기면 기반시설 대출 관계가 흔들릴 위험이 있습니다."
 CHI_scs_assertive_patrol_PHI: "강경 순찰: 필리핀령 스프래틀리"
 CHI_scs_assertive_patrol_PHI_desc: "인민해방군 해군 함대를 필리핀과 분쟁 중인 해역에 투입하도록 명령하여, 아융인 암초와 스프래틀리 동부 지형에서의 필리핀 보급 작전을 겨냥합니다. 결정적 승리는 필리핀에 대한 충돌 카운터를 진행시키고, 결론이 나지 않으면 현상을 유지하며, 차질이 생기면 $CHI_scs_framework$이(가) 소모되고 마닐라가 미국 상호방위조약 협의를 발동할 수 있습니다."
 CHI_scs_assertive_patrol_VIE: "강경 순찰: 베트남령 스프래틀리"
 CHI_scs_assertive_patrol_VIE_desc: "인민해방군 해군 함대를 베트남과 분쟁 중인 해역에 투입하도록 명령하여, 스프래틀리 서부 군도에서 베트남 해안경비대와 보급선에 도전합니다. 작전의 결과는 세 가지입니다. 결정적 전술 승리는 충돌 카운터를 최후통첩 임계값 쪽으로 진행시키고, 결론이 나지 않는 교전은 카운터를 그대로 유지하며, 차질이 생기면 $CHI_scs_framework$이(가) 하락하고 하노이의 보복성 외교 대응을 부를 수 있습니다."
 CHI_scs_block_asean_consensus: "ASEAN 합의 저지"
 CHI_scs_block_asean_consensus_desc: "캄보디아와 라오스에 대한 중국의 영향력을 이용해 ASEAN 차원의 비난이 정상회의 공동성명에 반영되는 것을 막습니다. 두 나라는 합의 제도 안에서 거부권을 쥐고 있으며, 이들의 협조로 공동성명은 남중국해에서의 행태에 침묵하게 됩니다. 이 책략은 역내 관측통들이 그 냉소를 알아채므로 $CHI_chinese_aggression$을(를) 약간 높이지만, 제도화된 비난을 막아 $CHI_scs_framework$에 소폭의 이득을 안겨 줍니다."
 CHI_scs_boundary_codification_MAY: "해상 경계 조약: 말레이시아"
 CHI_scs_boundary_codification_MAY_desc: "말레이시아와 양자 해상 경계 조약을 체결하여 분쟁 중인 남부 해역의 사실상 합의를 공식화합니다. 쿠알라룸푸르의 서명으로 양자 성문화의 고리가 완성되며 남아 있는 다자간 도전은 고립됩니다."
 CHI_scs_boundary_codification_PHI: "해상 경계 조약: 필리핀"
 CHI_scs_boundary_codification_PHI_desc: "필리핀과 양자 해상 경계 조약을 체결하여 2016년 유엔해양법협약 중재 판정을 대체합니다. 마닐라는 중국의 투자 보증과 공동 개발 구역에 대한 접근 확대를 대가로 재판소 판결을 제쳐 두기로 합의합니다."
 CHI_scs_boundary_codification_VIE: "해상 경계 조약: 베트남"
 CHI_scs_boundary_codification_VIE_desc: "중국에 유리한 조건으로 베트남과 양자 해상 경계 조약을 체결하여, 통킹만에서 합의된 경계선을 성문화하고 파라셀 및 스프래틀리 분쟁은 공동 개발 틀 아래에 유보합니다. 하노이는 이 합의를 가능한 최선의 결과로 받아들이고, 베이징은 선례를 확보합니다."
 CHI_scs_carrier_strike_group_deployment: "항모 타격단 배치"
 CHI_scs_carrier_strike_group_deployment_desc: "항모 타격단 전체를 남중국해에 장기 작전 배치합니다. 이 배치는 중국이 바다를 단지 다투는 데 그치지 않고 무력으로 통제할 능력을 보유하고 있으며 행사하겠다는 신호를 보냅니다."
 CHI_scs_demand_tribute_MAY: "난사 할양 요구"
 CHI_scs_demand_tribute_MAY_desc: "쿠알라룸푸르에 스왈로 암초와 아르다시에르 암초 일대의 말레이시아 점유 지형을 포함한 스프래틀리 남부를 공식 할양하라는 최후통첩을 보냅니다. 이 서한은 말라카에서 출항한 명나라 시대 정화의 순찰에 대한 기억으로 포장되어, 요구를 새로운 병합이 아닌 옛 질서의 복원으로 재구성합니다. 세 영유권 주장국 가운데 말레이시아가 손실을 말없이 삼킬 가능성이 가장 높습니다."
 CHI_scs_demand_tribute_PHI: "중사 할양 요구"
 CHI_scs_demand_tribute_PHI_desc: "마닐라에 이미 중국이 싼샤시 중사 구로 관할하고 있는 수중 지형인 맥클즈필드 퇴를 공식 할양하라는 최후통첩을 보냅니다. 이 서한은 양자 협상이라는 허구를 생략하고, 주둔군도 활주로도 없는 퇴를 두고 1951년 상호방위조약을 시험합니다. 이는 워싱턴이 아직도 암초를 레드라인으로 여기는지 가장 깔끔하게 떠보는 시험입니다."
 CHI_scs_demand_tribute_VIE: "시사 할양 요구"
 CHI_scs_demand_tribute_VIE_desc: "하노이에 베트남 공화국 해군을 크레센트 군도에서 몰아낸 1974년 전투 이후 우리가 무력으로 보유해 온 파라셀 군도를 공식 할양하라는 최후통첩을 보냅니다. 이 서한은 요구를 프랑스령 인도차이나 이전으로 거슬러 올라가는 역사적 권리의 언어로 치장하고, 새로운 영유권 주장이 아닌 미완의 사안을 매듭짓는 것으로 틀을 짭니다. 하노이는 손실을 서면으로 비준하거나, 1979년 방식의 두 번째 교훈을 초래할 수 있습니다."
 CHI_scs_deploy_maritime_militia: "해상 민병 배치"
 CHI_scs_deploy_maritime_militia_desc: "인민해방군 해군의 조율 아래 활동하는 어선단을 분쟁 해역에 전진 배치합니다. 민병은 그럴듯한 민간인 위장 아래 지속적인 존재감을 제공하며, 외교적 항의가 대응하는 것보다 빠르게 바다 위에 기정사실을 만듭니다."
 CHI_scs_first_island_chain_exercise: "제1열도선 훈련"
 CHI_scs_first_island_chain_exercise_desc: "황해에서 남중국해에 이르는 제1열도선 전체에 걸친 대규모 함대 훈련을 실시합니다. 이 훈련은 열도선 안으로 개입을 시도하는 어떤 세력에 대해서도 접근 차단 및 지역 거부 능력을 과시합니다."
 CHI_scs_infrastructure_loan_MAY: "기반시설 대출: 말레이시아"
 CHI_scs_infrastructure_loan_MAY_desc: "동해안 철도 연결선과 말라카 해협 회랑을 따른 항만 확장을 포괄하는 일대일로 기반시설 금융을 말레이시아에 제공합니다. 이 거래는 말레이시아가 경제적으로 가장 긴밀하게 통합된 중국의 ASEAN 파트너라는 입지를 굳힙니다."
 CHI_scs_infrastructure_loan_PHI: "기반시설 대출: 필리핀"
 CHI_scs_infrastructure_loan_PHI_desc: "교량 건설, 철도 개발, 신규 심수항을 포괄하는 일대일로 기반시설 금융을 필리핀에 제공합니다. 이 제안은 마닐라가 워싱턴과의 동맹의 비용과 이익을 저울질하는 시점에 도착합니다."
 CHI_scs_infrastructure_loan_VIE: "기반시설 대출: 베트남"
 CHI_scs_infrastructure_loan_VIE_desc: "항만 개선, 철도 연결, 산업 구역 개발을 포괄하는 일대일로 기반시설 금융을 베트남에 제공합니다. 이 대출은 중국 자본에 대한 베트남의 경제적 의존을 심화시키고 하노이가 외교적 대립을 하는 데 드는 비용을 높입니다."
 CHI_scs_invoke_doc_2002: "2002 DOC 재확인"
 CHI_scs_invoke_doc_2002_desc: "분쟁 관리의 지침이 되는 틀로서 2002년 남중국해 당사국 행동선언을 공개적으로 재확인합니다. 이 제스처는 대체로 상징적이지만 ASEAN 파트너들에게 자제의 신호를 보내고 양자 협상을 위한 외교적 토대를 제공합니다."
 CHI_scs_island_construction_civilian: "민간 기반시설 건설"
 CHI_scs_island_construction_civilian_desc: "섬 단지에 항만 시설, 기상 관측소, 영구적인 민간 주택을 건설합니다. 학교, 진료소, 행정 건물 같은 평범한 거주의 가시적 증거는 이 지형들이 사람이 사는 중국 영토라는 정치적 논거를 뒷받침합니다."
 CHI_scs_island_construction_radar: "레이더 및 신호정보 설비 설치"
 CHI_scs_island_construction_radar_desc: "인공섬에 신호 정보 수집 시설과 초수평선 레이더 어레이를 건설합니다. 이 설비는 남중국해 전역에 걸쳐 지속적인 해양 상황 인식을 제공하고 외국 해군과 공군의 움직임을 실시간으로 추적합니다."
 CHI_scs_island_construction_runway: "활주로 건설"
 CHI_scs_island_construction_runway_desc: "인공섬 단지에 전투기와 장거리 해상 초계기를 운용할 수 있는 3,000미터 포장 활주로를 깝니다. 비행장은 이 시설을 존재감 과시용 전초기지에서 전력 투사 거점으로 탈바꿈시킵니다."
 CHI_scs_island_construction_sam_battery: "지대공 미사일 포대 설치"
 CHI_scs_island_construction_sam_battery_desc: "섬 단지에 장거리 지대공 미사일 포대를 배치합니다. 이 설비는 중국의 방공 범위를 남중국해 깊숙이 확장하여, 외국의 항행의 자유 작전이나 공중 순찰을 어렵게 만듭니다."
 CHI_scs_joint_development_MAY: "루코니아 암초 공동 운영 협정"
 CHI_scs_joint_development_MAY_desc: "중국 해안경비대 경비정이 이미 사우스 루코니아의 말레이시아 시추 설비를 따라다니는 루코니아 암초 일대의 ND6와 SK308 구역을 포괄하는 공동 운영 협정을 페트로나스에 제안합니다. 분쟁을 비공개로 구획하여 다루는 쿠알라룸푸르의 습성 덕분에 가장 쉽게 서명을 얻을 수 있으며, 성사된 거래는 베이징이 하노이와 마닐라에 흔들어 보일 본보기가 됩니다."
 CHI_scs_joint_development_PHI: "마닐라 에너지 MOU 부활"
 CHI_scs_joint_development_PHI_desc: "보류되었던 석유·가스 개발 양해각서를 되살려 리드 뱅크의 서비스 계약 72를 두고 CNOOC와 PXP 에너지를 짝지웁니다. 마닐라는 2016년 중재 판정을 정치적으로 휴면 상태로 다루는 대가로 고정된 수익 배분과 상류 부문 투자 물결을 챙깁니다. 양자 트랙은 필리핀의 사건을 계약법 아래 묻어 버립니다."
 CHI_scs_joint_development_VIE: "반가드 뱅크 공동 운영 협약"
 CHI_scs_joint_development_VIE_desc: "반가드 뱅크 중첩 해역과 2000년 통킹만 획정선 동쪽의 미해결 해역에 대한 공동 개발 구역을 두고 하노이와 은밀한 협상을 시작합니다. CNOOC와 페트로베트남은 '주권을 침해하지 않는다'는 공식 아래 탐사권과 수익을 나누어, 가스가 흐르는 동안 법적 문제를 동결합니다. 양자 채널은 ASEAN을 멀리 떼어 놓고 하노이가 유엔해양법협약을 원용할 동기를 제거합니다."
 CHI_scs_natuna_press_claim: "나투나에 대한 구단선 주장 압박"
 CHI_scs_natuna_press_claim_desc: "구단선에 따른 우리의 역사적 권리가 인도네시아의 나투나 배타적 경제수역과 겹치는 해역까지 미친다고 주장하는 공식 서한을 발송합니다. 인도네시아는 스스로를 남중국해 영유권 주장국으로 여기지 않으므로 이 주장은 법적으로 다툼이 있지만, 이 주장은 외교적 전선을 남쪽으로 확장하고 ASEAN 최대 국가에 새로운 압박 지점을 만듭니다."
 CHI_scs_natuna_provocation: "나투나 도발"
 CHI_scs_natuna_provocation_desc: "일상적인 어로 작업으로 위장하여 중국 해상 민병 선박을 인도네시아의 나투나 배타적 경제수역에 투입합니다. 침범은 부인할 수 있지만 눈에 띄며, 자카르타는 외교적으로 대응할 것입니다. 이 행동은 정규 해군 자산을 투입하지 않고도 중국 작전 범위의 남쪽 한계를 탐색하고 인도네시아의 결의를 시험합니다."
 CHI_scs_reclaim_taiping: "타이핑 탈환"
 CHI_scs_reclaim_taiping_desc: "타이핑 섬은 스프래틀리 군도에서 가장 큰 자연 지형이며 여전히 대만의 중화민국이 관할하고 있습니다. 스프래틀리의 세 영유권 주장국을 모두 확보한 상황에서, 타이핑을 점령하기 위한 직접 작전은 남중국해 공고화의 마지막 행위로서 더 광범위한 대만 통일 시나리오와는 별개이며 그에 앞선 것입니다. 이 작전은 매우 높은 정치력 비용이 들고 인민해방군 해군 남해 함대의 전력 투입이 필요합니다."
 CHI_scs_standoff_malaysia: "대치 실행: 말레이시아"
 CHI_scs_standoff_malaysia_desc: "말레이시아가 영유권을 주장하는 분쟁 지형에 스카버러 모델을 실행합니다. 쿠알라룸푸르는 역사적으로 베이징과의 관계를 신중하게 관리해 왔으며, 이번 대치는 경제적 의존이 공식 외교 항의를 억제하는지 시험합니다."
 CHI_scs_standoff_philippines: "대치 실행: 필리핀"
 CHI_scs_standoff_philippines_desc: "필리핀이 영유권을 주장하는 분쟁 지형에 스카버러 모델을 실행합니다. 필리핀 어선과의 조우는 마닐라가 물러설 때까지 해안경비대 대치로 확대되며, 중국의 영구적 주둔이 남게 됩니다."
 CHI_scs_standoff_vietnam: "대치 실행: 베트남"
 CHI_scs_standoff_vietnam_desc: "베트남이 영유권을 주장하는 분쟁 지형에 스카버러 모델을 실행합니다. 하노이의 해안경비대는 수와 전력 모두에서 열세입니다. 문제는 하노이가 손실을 조용히 받아들일지, 국제적 관심을 끄는 방식으로 사태를 확대할지입니다."
 CHI_scs_summon_dragon_king_blessing: "용왕 함대 축원"
 CHI_scs_summon_dragon_king_blessing_desc: "하이난 싼야의 톈허우 사원에서 남해 함대의 의례적 축원을 거행하며, 대대로 남해 선원들이 숭배해 온 바다의 여신 마주의 보호를 기원합니다. 의식은 전국에 방송되며, 남해 함대는 직후에 훈련을 위해 출항합니다."
 CHI_secure_kpa_general_staff: "조선인민군 총참모부 인맥 확보"
 CHI_secure_kpa_general_staff_desc: "조선인민군 총참모부 내 친중 성향 장교들을 포섭합니다. 조직망 안에 현역 장성 한 명이 있으면 망명한 정치인 열두 명에 맞먹습니다."
 CHI_seek_basing_BAN: "방글라데시 해군 기지 요청"
 CHI_seek_basing_BAN_desc: "전략적 동반자 관계의 일환으로 치타공 항만 시설에 대한 병참 접근권을 다카에 공식 요청합니다."
 CHI_seek_basing_BRM: "미얀마 해군 기지 요청"
 CHI_seek_basing_BRM_desc: "전략적 동반자 관계의 일환으로 짜욱퓨와 싯트웨에 대한 병참 접근권을 네피도에 공식 요청합니다."
 CHI_seek_basing_CBD: "캄보디아 해군 기지 요청"
 CHI_seek_basing_CBD_desc: "전략적 동반자 관계의 일환으로 림 해군 기지에 대한 병참 접근권을 프놈펜에 공식 요청합니다."
 CHI_seek_basing_PAK: "파키스탄 기지 사용권 확대"
 CHI_seek_basing_PAK_desc: "철의 형제 파트너십을 바탕으로 과다르를 넘어 파키스탄 항만 전역으로 중국 해군 병참을 확대합니다."
 CHI_seek_basing_SRI: "스리랑카 해군 기지 요청"
 CHI_seek_basing_SRI_desc: "전략적 동반자 관계의 일환으로 함반토타에 대한 병참 접근권을 콜롬보에 공식 요청합니다."
 CHI_semiconductor_coop_with_kor: "한국과 반도체 협력"
 CHI_semiconductor_coop_with_kor_desc: "한국과 공동 반도체 연구 및 제조 구상을 추진합니다. 한국의 칩 제조 전문 지식에 접근하면 중국의 기술 개발이 가속됩니다."
 CHI_seoul_hanbok_exchange: "서울 한복 교류 마련"
 CHI_seoul_hanbok_exchange_desc: "문화 외교는 공유 유산을 둘러싼 분쟁 속에서도 긴장을 완화할 수 있습니다. 서울에서 한복 교류를 후원하면 대중 정서가 누그러지고 한국으로 향하는 더 부드러운 영향력 경로가 열립니다."
 CHI_shenzhou_mission: "선저우 임무 비행"
 CHI_shenzhou_mission_desc: "주취안 위성 발사 센터에서 창정 2F 로켓 위에 선저우 우주선을 올립니다. 승무원은 궤도에 도달한 뒤 무사히 귀환하여 우리의 독자적인 유인 우주 비행 능력을 입증해야 합니다. 발사 경험이 쌓일수록 성공 확률이 높아집니다."
 CHI_sichuan_tibet_railway: "쓰촨-티베트 철도"
 CHI_sichuan_tibet_railway_desc: "청두와 라싸 사이의 협곡과 고갯길을 관통하는 철도를 놓으며, 전체 구간의 80퍼센트 이상이 터널과 교량으로 이루어져 있습니다. 이 노선은 티베트의 고립을 끝내고, 고원에 대한 중앙의 통제를 강화하며, 인도 국경으로 향하는 전략적 동맥을 제공합니다."
 CHI_skilled_immigration_drive: "숙련 이민 추진"
 CHI_skilled_immigration_drive_desc: "중국의 영주권 제도는 역사적으로 주요 경제권 가운데 가장 제한적인 편이었습니다. 미국과 캐나다의 영주권 경로를 본보기로 삼은 새로운 고숙련 비자 트랙은 연구자, 기술자, 기업가를 겨냥합니다. 이 프로그램은 세계 기준으로 보면 소규모이지만, 국내 인구 공급만으로는 기술 및 의료 부문의 새로운 공백을 메울 수 없음을 인정하는 중대한 정책 전환입니다."
 CHI_snwt_central_route: "남수북조: 중선"
 CHI_snwt_central_route_desc: "후베이 한강의 단장커우 저수지에서 허난과 허베이를 거쳐 북쪽 베이징으로 물을 보냅니다. 2014년 12월부터 가동된 중선은 수도의 식수를 공급하고 화북평원 대수층의 만성적 고갈을 완화합니다."
 CHI_snwt_eastern_route: "남수북조: 동선"
 CHI_snwt_eastern_route_desc: "장쑤 인근 양쯔강 하류에서 고대 대운하를 따라 북쪽의 가뭄에 시달리는 산둥과 톈진의 도시들로 물을 퍼 올립니다. 동선은 합쳐서 매년 약 448억 세제곱미터의 물을 건조한 북부로 옮기는 세 개의 조수 노선 가운데 첫 번째입니다."
 CHI_snwt_western_route: "남수북조: 서선"
 CHI_snwt_western_route_desc: "양쯔강 발원지의 물을 칭장 고원의 바옌카라 산맥 너머 황허 상류로 끌어와 칭하이, 간쑤, 산시에 물을 댑니다. 세 노선 가운데 기술적으로 가장 어려운 이 노선은 건조한 서북부 전체의 물을 확보해 줄 것입니다."
 CHI_south_china_sea_category: "남중국해"
 CHI_south_china_sea_category_desc: "남중국해에서의 우리 입장을 형성하는 지속적 결정입니다. 여기서의 행동은 남중국해 체제 변수, 베트남·필리핀·말레이시아와의 관계, 미국과의 대립 위험에 영향을 미칩니다."
 CHI_southern_theatre_command: "남부 전구"
 CHI_southern_theatre_command_desc: "광저우에 기반을 둔 남부 전구는 남중국해와 베트남 국경을 관할합니다. 흩어진 섬 수비대 전반의 합동 조율과 이들을 묶어 주는 정찰을 전문으로 합니다."
 CHI_space_program: "중국 우주 계획"
 CHI_subcontinent_strategy: "아대륙 전략"
 CHI_subcontinent_strategy_desc: "인도 아대륙을 향한 우리의 외교 및 군사 도구 모음입니다. 실질 통제선을 따른 압박, 파키스탄 및 남아시아 주변국과의 동반자 관계, 분쟁 중인 히말라야 국경이 여기에 포함됩니다. 여기서 내리는 결정은 국경에서의 긴장 고조 수위와 지역 전반에서의 우리 영향력을 좌우합니다.\n\n$raj_chi_border_readiness$: [?THIS.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$: [?global.raj_chi_border_tension|Y0]\n\n§Y영유권 진척도§! (영유권 주장에 80 필요):\n아루나찰프라데시: [?THIS.raj_chi_border_progress_475|Y0]\n시킴: [?THIS.raj_chi_border_progress_982|Y0]\n악사이친: [?THIS.raj_chi_border_progress_591|Y0]\n라다크: [?THIS.raj_chi_border_progress_993|Y0]"
 CHI_Surveillance_Export: "감시 체계 수출"
 CHI_Surveillance_Export_desc: "중국의 감시 및 디지털 모니터링 시스템을 비민주 파트너에게 배치합니다. 일대일로 기금과 국고에서 각각 80이 듭니다."
 CHI_thaad_retaliation_escalate: "THAAD 보복 확대"
 CHI_thaad_retaliation_escalate_desc: "2016년 서울이 미국의 THAAD 미사일 방어 체계를 수용하기로 하자, 베이징은 롯데, 한국 관광, 문화 수출에 타격을 준 비공식 보이콧으로 답했습니다. 압박을 강화하면 한국에 대한 경제적 징벌이 깊어집니다."
 CHI_three_gorges_dam_decision: "싼샤 댐 완공"
 CHI_three_gorges_dam_decision_desc: "이창에서 양쯔강을 가로지르는 싼샤 댐은 2012년 전면 가동과 함께 설비 용량 22.5기가와트로 세계 최대의 발전소가 되었습니다. 이를 완공하면 방대한 수력 발전량이 전국 전력망에 공급됩니다."
 CHI_three_north_shelterbelt: "삼북 방호림 프로그램"
 CHI_three_north_shelterbelt_desc: "신장에서 동북에 이르기까지 건조한 북부를 가로지르는 숲과 초원의 띠인 '녹색 장성'을 조성합니다. 1978년에 시작되어 수십 년간 이어지는 이 프로그램은 팽창하는 고비 사막을 막고, 모래 폭풍에 맞서 토양을 고정하며, 사막으로부터 농경지를 되찾습니다."
 CHI_tiangong_mission: "톈궁 정거장 조립"
 CHI_tiangong_mission_desc: "톈허 핵심 모듈이 궤도에 도달하여 첫 유인 방문과 성공적으로 도킹한 뒤에야 원톈과 멍톈 실험 모듈이 뒤따릅니다. 영구 궤도 전초기지는 저궤도 너머의 모든 것을 위한 토대입니다. 발사 경험이 쌓일수록 성공 확률이 높아집니다."
 CHI_tour_group_freeze: "단체 관광 동결"
 CHI_tour_group_freeze_desc: "한국행 단체 관광을 중단합니다. 이 동결은 한국 관광 수입의 주요 원천을 없애며, 안보 이익이 요구할 때 경제 수단을 강압적으로 사용할 의지가 있음을 보여 줍니다."
 CHI_track_ii_academic_forum: "트랙 II 학술 포럼"
 CHI_track_ii_academic_forum_desc: "우리 학자들과 한국 학자들 간에 한반도 안정에 관한 트랙 II 대화를 후원합니다. 공식 외교가 정체된 곳에서 비공식 채널이 신뢰를 쌓습니다."
 CHI_Track_II_Diplomacy: "트랙 II 외교"
 CHI_Track_II_Diplomacy_desc: "우리 전문가, 미국 전문가, 한국 학자 사이의 비공식 학술 및 싱크탱크 교류에 자금을 댑니다. 라운드를 거듭할 때마다 상호 이해가 쌓이고 공식 협상을 위한 기반이 마련됩니다."
 CHI_trilateral_trade_forum: "3자 무역 포럼"
 CHI_trilateral_trade_forum_desc: "개성 모델을 중심으로 베이징-서울-평양 무역 포럼을 소집합니다. 상업적 상호 의존은 그 자체로 평화를 바라는 지지 기반을 만들어 냅니다."
 CHI_uhv_east_transmission: "초고압 송전망: 동부 송전"
 CHI_uhv_east_transmission_desc: "서부 기지에서 상하이, 베이징, 광둥의 부하 중심지까지 수천 킬로미터에 걸쳐 전기를 실어 나르는 장거리 초고압 송전선을 완공합니다. 장거리 송전은 선로 손실을 줄이고 서부의 청정 에너지로 해안 산업 중심지를 가동합니다."
 CHI_uhv_west_generation: "초고압 송전망: 서부 발전 기지"
 CHI_uhv_west_generation_desc: "신장의 풍력·태양광 단지, 내몽골의 재생 에너지, 양쯔강 상류의 수력 발전 등 서부의 거대한 발전 기지를 건설합니다. 이 외딴 에너지 거점들은 세계 최대의 초고압 송전망의 닻이 됩니다."
 CHI_urban_water_recycling: "도시 하수 재활용"
 CHI_urban_water_recycling_desc: "베이징, 톈진, 허베이성의 주요 도시들은 매년 수십억 세제곱미터의 도시 하수를 배출하며, 대부분은 2차 처리 수준까지만 처리된 채 방류됩니다. 고도 3차 처리 시설과 전용 재생수 배급망 프로그램은 처리된 방류수를 산업 냉각, 도시 조경, 하천 유량 보충으로 돌립니다. 톈진은 재생수 재이용률 30퍼센트 이상에 도달했으며, 이 프로그램은 2030년까지 도시 재이용률 25퍼센트라는 전국 목표를 설정합니다."
 CHI_us_korea_cost_signaling: "한미 비용 신호"
 CHI_us_korea_cost_signaling_desc: "워싱턴과 서울에 양국 안보 동맹이 점점 커지는 경제적·외교적 비용을 수반한다는 신호를 보냅니다. 표적형 압박 조치는 현상 유지가 공짜가 아님을 양측에 일깨워 줍니다."
 CHI_VEN_currency_swap_line: "위안-볼리바르 통화 스와프 라인"
 CHI_VEN_currency_swap_line_desc: "장기 통화 스와프 라인을 구축하여 베네수엘라를 달러 표시 부채 압박으로부터 보호하고 원자재 공급을 확보합니다."
 CHI_VEN_emergency_food_aid: "베네수엘라 긴급 식량 원조"
 CHI_VEN_emergency_food_aid_desc: "식량 수송과 인도적 지원을 보내 마두로 정부를 안정시킵니다. 베네수엘라의 안정도와 우리의 영향력이 향상됩니다."
 CHI_VEN_oil_processing_aid: "베네수엘라 석유 가공 지원"
 CHI_VEN_oil_processing_aid_desc: "우리 기술자와 정유 자본을 보내 베네수엘라의 석유 가공 시설을 개선합니다. 이 사업은 베네수엘라의 채굴 수율을 높이고 오리노코 공급망에 대한 우리의 지분을 확대합니다."
 CHI_VEN_petrocaribe_program: "베네수엘라 지원 프로그램"
 CHI_water_conservation_project: "지방 물 보전 사업"
 CHI_water_conservation_project_desc: "건조한 북부 지방 중 한 곳에서 표적 물 보전 사업이 시작되어, 수로 내벽 개선, 지하수 관측망 복구, 지역 저수지 건설을 통해 낭비와 과잉 취수를 줄입니다. 사업이 하나 완료될 때마다 해당 지방의 지하수위에 가해지는 압력이 줄어듭니다. 이 사업은 물 부족을 겪는 허베이, 산시, 허난, 산시 지방에서 반복할 수 있으며, 충분한 수의 사업이 완료되면 중국의 전국적인 물 부족이 완화됩니다."
 CHI_water_shortage_category: "물 보전 사업"
 CHI_western_theatre_command: "서부 전구 사령부"
 CHI_western_theatre_command_desc: "면적이 가장 넓은 청두의 서부 전구 사령부는 인도와의 히말라야 국경과 불안정한 내륙을 방어합니다. 이 부대는 고지대 방어와 참호를 구축한 진지전을 위해 훈련합니다."
 CHI_yangtze_delta_integration_mission: "장강 삼각주 통합"
 CHI_yangtze_delta_integration_mission_desc: "상하이, 장쑤, 저장이 조율된 발전에 매진함에 따라, 장강 삼각주는 중국에서 가장 생산적인 산업 및 수출 회랑이 될 입지를 갖추고 있습니다. 올해 안에 공장 생산량을 목표 기준 이상으로 끌어올린 지방은 지역 생산성의 지속적인 성장을 얻게 됩니다."
 give_up_membership_status_desc: "상하이 협력 기구를 탈퇴하면 합동 안보 훈련, 경제 회랑, 정치 협의 체계에 대한 참여가 종료됩니다. 중국에 대한 공격성 수치가 높거나 다른 회원국을 상대로 전쟁 중인 회원국은 이 블록에서 탈퇴하라는 압력이 커집니다."
 give_up_observer_status_desc: "옵서버 지위를 철회하면 상하이 협력 기구의 경제 및 안보 프로그램과의 관계가 단절됩니다. 이 결정은 대개 나토 또는 서방으로의 노선 변화나 베이징과의 관계 악화로 인해 내려집니다."
 host_joint_exercises_desc: "중국 또는 러시아는 지휘력 40을 소모하여 SCO 전체 합동 군사 훈련을 개최하고, 모든 회원국에게 21일 동안 임시 전투 태세 국가 정신을 부여할 수 있습니다. 훈련이 종료되면 무작위 육군 지휘관 한 명의 기술 레벨이 상승합니다. 회원국 중 한 곳이라도 전쟁 중이면 훈련을 개시할 수 없습니다."
 offer_joint_exercises_specific_desc: "특정 SCO 회원국에 보내는 양자 훈련 제안입니다. 수락 시 양측은 지휘력 20을 소모하여 14일간의 합동 훈련을 실시하며, SCO 합동 훈련(특정) 국가 정신을 얻고 종료 시 상호 군사 협력 관계 변동치를 얻습니다."
 provide_development_assistance_desc: "[FROM.GetName]의 발전을 강화하고 SCO 체계와의 유대를 심화하기 위해 자원을 투입합니다."
 sco_bilateral_border_patrol: "[FROM.GetName]와(과) 국경 합동 순찰"
 sco_bilateral_border_patrol_desc: "[FROM.GetName]와(과) 국경 안보 작전을 조율하여 국경 간 범죄에 대응하고 상호 신뢰를 강화합니다."
 sco_bilateral_cultural_exchange: "[FROM.GetName]와(과) 문화 교류"
 sco_bilateral_cultural_exchange_desc: "[FROM.GetName]와(과) 문화 및 학술 교류 프로그램을 시작하여 민간 교류와 상호 이해를 증진합니다."
 sco_bilateral_energy_deal: "[FROM.GetName]와(과) 에너지 동반자 관계"
 sco_bilateral_energy_deal_desc: "[FROM.GetName]와(과) 장기 에너지 공급 협정을 협상하여 가격을 안정시키고 전략 자원의 흐름을 확보합니다."
 sco_bilateral_intel_sharing: "[FROM.GetName]와(과) 정보 공유"
 sco_bilateral_intel_sharing_desc: "[FROM.GetName]와(과) 보안이 확보된 정보 공유 채널을 구축하여 대테러 및 안보 작전을 조율합니다."
 sco_bilateral_trade_agreement: "[FROM.GetName]와(과) 양자 무역 협정"
 sco_bilateral_trade_agreement_desc: "SCO 틀 안에서 [FROM.GetName]와(과) 공식 무역 체계를 구축하여 관세를 낮추고 공동 투자를 장려합니다."
 sco_megaproject_air_defense_optin: "SCO 공동 방공 참여"
 sco_megaproject_air_defense_optin_desc: "SCO 공동 방공망에 참여하여 공유 레이더 및 미사일 방어 기반시설에 기여합니다."
 sco_megaproject_air_defense_propose: "SCO 공동 방공 제안"
 sco_megaproject_air_defense_propose_desc: "레이더 탐지 범위를 공유하고 대공 작전을 조율하는 SCO 회원국 간 통합 방공망을 제안합니다."
 sco_megaproject_dev_bank_optin: "SCO 개발은행 가입"
 sco_megaproject_dev_bank_optin_desc: "SCO 개발은행에 출자 회원으로 가입하여 저금리 개발 금융에 접근할 수 있게 됩니다."
 sco_megaproject_dev_bank_propose: "SCO 개발은행 제안"
 sco_megaproject_dev_bank_propose_desc: "SCO 회원국 전역의 기반시설과 개발에 자금을 대는 다자 개발은행의 설립을 제안합니다."
 sco_megaproject_energy_grid_optin: "SCO 에너지 그리드 참여"
 sco_megaproject_energy_grid_optin_desc: "SCO 에너지 그리드 사업에 참여하여 자원을 제공하는 대신 공유 전력 기반시설을 이용할 수 있게 됩니다."
 sco_megaproject_energy_grid_propose: "SCO 에너지 그리드 제안"
 sco_megaproject_energy_grid_propose_desc: "SCO 회원국을 아우르는 통합 에너지 그리드의 건설을 제안하여 비용을 줄이고 모든 참여국의 에너지 안보를 개선합니다."
 sco_megaproject_railway_optin: "유라시아 횡단 철도 참여"
 sco_megaproject_railway_optin_desc: "유라시아 횡단 철도 사업에 참여하여 무역 회랑에 투자하고 장기적인 경제적 이익을 얻습니다."
 sco_megaproject_railway_propose: "유라시아 횡단 철도 제안"
 sco_megaproject_railway_propose_desc: "SCO 회원국 경제를 연결하는 대륙 횡단 철도망을 제안하여 무역 흐름과 건설 능력을 크게 개선합니다."
 start_joint_exercises_specific_desc: "제안을 수락한 회원국과의 양자 SCO 훈련을 확정합니다. 두 나라 모두 14일 동안 SCO 합동 훈련(특정) 국가 정신을 얻으며, 훈련이 끝나면 상호 군사 협력 관계가 향상됩니다."
 chi_bri.1.a: "작업을 시작한다"
 chi_bri.1.d: "2013년 9월, 시진핑 주석은 카자흐스탄 아스타나의 청중 앞에 서서 대담한 구상을 제시했습니다. 중국을 유럽, 중앙아시아, 아프리카와 잇는 실크로드 경제 벨트였습니다. 이 구상은 훗날 일대일로로 알려지게 되며, 역사상 최대의 기반시설 계획이 됩니다."
 chi_bri.1.t: "일대일로"
 chi_bri.10.a: "양보 조건을 제시한다"
 chi_bri.10.d: "[FROM.GetName]에서 공식 신청서가 도착했습니다. 그 대표단은 §Y[FROM.GetBRIProjectName]§!을(를) 위한 중국의 자금과 전문 기술을 구하고 있습니다. 베이징은 이 협력의 전략적 가치와 제시할 수 있는 재정적, 정치적 조건을 저울질해야 합니다."
 chi_bri.10.d_opt: "신청을 거절한다"
 chi_bri.10.t: "[FROM.GetName]의 일대일로 사업 요청"
 chi_bri.103.a: "초청을 수락한다"
 chi_bri.103.b: "제안을 거절한다"
 chi_bri.103.d: "베이징이 아시아인프라투자은행의 창립 회원이 되어 달라는 공식 초청을 보내왔습니다. 회원이 되면 일대일로 네트워크 전역의 기반시설 사업에서 나오는 연간 배당금을 받지만, 우리의 재정 운명이 중국 주도 구상에 묶이게 됩니다. 경제부가 우리의 결정을 기다리고 있습니다."
 chi_bri.103.t: "중국의 AIIB 초청"
 chi_bri.104.a: "새 회원국을 환영한다"
 chi_bri.104.d: "[From.GetName]이(가) 우리의 초청을 받아들여 아시아인프라투자은행의 창립 회원으로 가입했습니다. 이들의 참여는 은행의 정당성을 강화하고 영향력의 범위를 넓혀 줍니다."
 chi_bri.104.t: "[From.GetName]의 AIIB 가입"
 chi_bri.105.a: "그들의 입장을 유념한다"
 chi_bri.105.d: "[From.GetName]이(가) 아시아인프라투자은행 가입 초청을 거절했습니다. 이 거절은 서방 주도 금융 기관에 대한 분명한 선호를 보여 주며 우리의 지역적 야심을 어렵게 만듭니다."
 chi_bri.105.t: "[From.GetName]의 AIIB 가입 거부"
 chi_bri.13.a: "1년의 유예 기간을 부여한다"
 chi_bri.13.b: "연장을 거부한다"
 chi_bri.13.d: "[FROM.GetName]이(가) 재정적 제약과 예기치 못한 사정을 이유로, 미결제 일대일로 채무에 대한 상환을 1년간 유예해 달라고 베이징에 청원했습니다. 원금은 유예 기간이 끝난 뒤에도 그대로 상환해야 합니다."
 chi_bri.13.t: "대출 상환 연장 요청"
 chi_bri.131.a: "경제 지원의 대가로 정박권을 부여한다"
 chi_bri.131.b: "요청을 거절한다"
 chi_bri.131.d: "베이징이 우리에게 제안을 해 왔습니다. 막대한 경제 지원의 대가로 인민해방군 해군에 우리 항구의 정박 및 급유 특권을 부여하라는 것입니다. 이 패키지는 향후 10년간 우리의 수출과 산업 생산을 끌어올리겠지만, 수락하면 오스트레일리아와 미국의 감시를 받게 됩니다."
 chi_bri.131.t: "중국의 정박권 요청"
 chi_bri.132.a: "우리의 태평양 입장을 재검토한다"
 chi_bri.132.d: "[From.GetName]이(가) 인민해방군 해군에 이전에 부여했던 정박 특권을 일방적으로 철회했습니다. 냉각된 관계와 경쟁하는 서방의 유인책이 우리가 힘들게 확보한 합의를 갉아먹었습니다."
 chi_bri.132.t: "기지 사용권 철회"
 chi_bri.133.a: "중재된 조약을 수락한다"
 chi_bri.133.b: "합의안을 거절한다"
 chi_bri.133.d: "베이징은 우리와 지역 경쟁국 사이의 불가침 합의에 대한 보증인을 자처하고 있습니다. 어느 한쪽이 평화를 깨면 중국은 피해를 입은 쪽 편에 서겠다고 약속합니다. 베이징의 커져 가는 외교적 영향력을 고려하면 이 제안은 무게가 있습니다."
 chi_bri.133.t: "중국의 불가침 조약 중재 제안"
 chi_bri.134.a: "조약을 이행하고 선전포고한다"
 chi_bri.134.b: "중립을 지키고 평판 손실을 감수한다"
 chi_bri.134.d: "우리가 직접 보증한 불가침 조약의 당사자 사이에 전쟁이 발발했습니다. 명예와 신뢰는 우리가 피해자 편에 설 것을 요구하지만, 침략자와의 전쟁은 큰 대가를 치르게 됩니다. 아무것도 하지 않는다면 그 사실은 기억될 것입니다."
 chi_bri.134.t: "깨진 우리의 중재 조약"
 chi_bri.135.a: "중국 파트너와 조율한다"
 chi_bri.135.d: "베이징은 자신이 중재한 불가침 합의에 따라 중화인민공화국이 우리 편에서 참전할 것이라고 통보했습니다. 중국 개입의 외교적 무게는 전략적 판도를 바꿔 놓습니다."
 chi_bri.135.t: "조약을 이행할 중국"
 chi_bri.15.a: "과다르 항 (발루치스탄)"
 chi_bri.15.b: "발루치스탄 경제특구"
 chi_bri.15.c: "라호르 철도 회랑 (펀자브)"
 chi_bri.15.d: "베이징이 [FROM.GetName]을(를) 위한 대표 메가 프로젝트를 승인했습니다. 일반적인 일대일로 사업과 달리 이 사업은 중국이 관리하며 중국의 전략적 이익을 직접 반영하게 됩니다. 입지의 선택이 수십 년간 이 프로젝트의 목적을 규정할 것입니다."
 chi_bri.15.d_opt: "함반토타 항 (남부 주)"
 chi_bri.15.e: "콜롬보 포트시티 (서부 주)"
 chi_bri.15.f: "몸바사-나이로비 표준궤 철도 터미널"
 chi_bri.15.g: "해안 전략 시설"
 chi_bri.15.t: "메가 프로젝트: 어디에 건설할 것인가?"
 chi_bri.20.a: "임대 조건을 수락한다"
 chi_bri.20.b: "항구 양도를 거부한다"
 chi_bri.20.d: "건설 과정에서 쌓인 부채를 감당할 수 없게 된 스리랑카 정부는 냉혹한 선택에 직면해 있습니다. 차이나 머천트 포트 홀딩스는 부채 탕감을 대가로 함반토타 항에 대한 99년 임대를 제안했습니다. 비판자들은 이를 부채 함정 외교라 부르고, 옹호자들은 실용적인 국정 운영이라 부릅니다."
 chi_bri.20.t: "함반토타: 99년 임대"
 chi_bri.21.a: "중국에 해군 이용권을 부여한다"
 chi_bri.21.b: "정중히 거절한다"
 chi_bri.21.d: "중국-파키스탄 경제 회랑이 완전히 가동되면서, 인민해방군 해군이 이슬라마바드에 조용하지만 중대한 요청을 해 왔습니다. 과다르를 병참 및 재보급 지점으로 사용할 권리입니다. 이 결정은 CPEC를 경제 회랑에서 전략적 거점으로 바꿔 놓을 것입니다."
 chi_bri.21.t: "과다르: 해군 시설 요청"
 chi_bri.22.a: "중국에 기지 사용권을 부여한다"
 chi_bri.22.b: "제안을 거부한다"
 chi_bri.22.d: "지부티는 수십 년 동안 외국 군사 시설을 받아들여 왔지만, 베이징의 제안은 성격이 다릅니다. 도랄레에 계획된 시설은 인민해방군 최초의 상설 해외 기지가 될 것이며, 이는 서방 전략가들이 오랫동안 우려해 왔고 중국 기획자들이 오랫동안 추구해 온 이정표입니다."
 chi_bri.22.t: "도랄레: 중국 최초의 해외 기지"
 chi_bri.30.a: "제재로 강력히 대응한다"
 chi_bri.30.b: "당분간 상황을 주시한다"
 chi_bri.30.d: "위안화 표시 원유 선물을 도입하겠다는 중국의 발표가 워싱턴에 충격을 주었습니다. 페트로위안 가격 책정이 OPEC 회원국과 일대일로 파트너 사이에서 힘을 얻는다면, 달러의 기축통화 지위는 수 세대 만에 가장 심각한 도전에 직면합니다. 의회는 대응을 요구하고 있습니다."
 chi_bri.30.t: "달러 패권을 위협하는 베이징의 페트로위안"
 chi_bri.40.a: "대담한 새 구상을 발표한다"
 chi_bri.40.b: "새로운 약속을 대거 체결한다"
 chi_bri.40.c: "개혁과 투명성으로 이끈다"
 chi_bri.40.d: "아시아, 아프리카, 유럽 전역의 정부 수반과 재무장관들이 3년마다 열리는 일대일로 포럼을 위해 베이징에 모였습니다. 이 모임은 정상회의이자 무역 박람회이며 지정학적 연극이기도 합니다. 이번 주 중국의 선택이 구상의 다음 단계의 기조를 정할 것입니다."
 chi_bri.40.t: "베이징에서 개막한 일대일로 포럼"
 chi_bri.42.a: "단호하고 주권을 강조하는 어조를 취한다"
 chi_bri.42.b: "협력과 상호 이익을 강조한다"
 chi_bri.42.d: "전 세계의 기자들이 포럼의 폐막 기자회견장에 모였습니다. 중국이 지금 선택하는 프레임이 국제 보도를 좌우하고 향후 3년간 일대일로 외교에 대한 기대를 형성할 것입니다."
 chi_bri.42.t: "포럼 기자회견"
 chi_bri.43.a: "결과를 발표한다"
 chi_bri.43.d: "대표단은 떠났고 현수막도 내려졌습니다. 외교관들과 경제학자들은 체결된 협정, 약속된 공약, 쌓인 영향력 등 성과를 집계하고 있습니다. 일대일로 포럼은 다시 한번 세계에서 중국이 맡는 역할에 대한 인식을 바꿔 놓았습니다."
 chi_bri.43.t: "일대일로 포럼: 최종 평가"
 chi_bri.50.a: "중국 리더십의 새 시대를 선언한다"
 chi_bri.50.d: "중국의 일대일로 네트워크는 이제 사람이 사는 모든 대륙에 걸쳐 있습니다. 베이징이 수십 년에 걸쳐 짜 온 기반시설, 부채, 외교적 의무의 그물망은 전례 없는 무언가로 결정화되었습니다. 중국의 이익을 본떠 형성된 국제 질서입니다. 역사가들은 이를 패권이라 부를지 동반자 관계라 부를지 논쟁할 것입니다. 세계는 이를 그저 하나의 사실이라 부를 것입니다."
 chi_bri.50.t: "팍스 시니카 확립"
 chi_bri.70.a: "중국-아프리카 동반자 시대를 선포한다"
 chi_bri.70.d: "10년이 넘는 중국-아프리카 협력 포럼 정상회의, 일대일로 사업, 부채 탕감 외교의 누적된 효과가 결정적인 변화를 낳았습니다. 한때 베이징과 워싱턴 사이에서 저울질하던 아프리카 대륙 전역의 정부들이 중국을 주요 파트너로 삼아 결집하고 있습니다. 한 세대의 아프리카 지도자들은 중국의 기반시설, 중국의 신용, 중국인 고문과 함께 성장했습니다."
 chi_bri.70.t: "중국의 세기를 받아들이는 아프리카"
 chi_bri.71.a: "사업단을 파견한다"
 chi_bri.71.d: "새 시대를 공고히 하기 위해 베이징은 아프리카 파트너 네트워크 전역의 일련의 대표 메가 프로젝트에 자금을 배정했습니다. 이들은 평범한 기반시설 지원이 아니라, 장기적인 전략적 권리와 우선 접근 조항이 딸린 중국 중심의 개발 사업이 될 것입니다."
 chi_bri.71.t: "아프리카를 위한 대표 사업"
 chi_bri.80.a: "부채 탕감을 발표한다"
 chi_bri.80.b: "담보 조항을 확정한다"
 chi_bri.80.d: "중국-아프리카 협력 포럼이 베이징에서 최근 전체 회의를 소집했습니다. 재무장관, 국가 원수, 개발은행 관계자들이 모여 중국-아프리카 관계의 현황을 검토하고 앞으로의 길을 그리고 있습니다. 정상회의의 첫 발표가 이 모임이 관대함으로 기억될지 지렛대로 기억될지를 결정할 것입니다."
 chi_bri.80.t: "FOCAC 정상회의 개막"
 chi_bri.81.a: "카라카스에 대한 제재를 강화한다"
 chi_bri.81.b: "외교적 항의를 제기한다"
 chi_bri.81.c: "유념하고 넘어간다"
 chi_bri.81.d: "중국이 페트로카리베 협정의 후속 체제를 공식화하여, 석유를 대가로 한 대출 조건을 베네수엘라와 그 이웃 나라들에 확대했습니다. 이제 워싱턴은 불쾌감을 표시하고 중남미의 추가 이반을 감수할지, 이 사태를 조용히 받아들일지 선택해야 합니다."
 chi_bri.81.t: "카라카스에 진출한 중국"
 chi_bri.82.a: "부채를 탕감한다"
 chi_bri.82.b: "연체금을 양보로 전환한다"
 chi_bri.82.c: "채무 불이행을 그대로 둔다"
 chi_bri.82.d: "베네수엘라의 석유 수입이 붕괴했고 중국 국영 은행들에 대한 원리금 상환은 심각하게 연체되어 있습니다. 베이징은 호의 면에서 손실을 감수할지, 담보를 확보할지, 아니면 다른 차입국들에 대한 경고로 채무 불이행을 그대로 둘지 결정해야 합니다."
 chi_bri.82.t: "갚지 못하는 카라카스"
 chi_bri.83.a: "항의하고 철거를 요구한다"
 chi_bri.83.b: "대항 프로그램을 개시한다"
 chi_bri.83.c: "새로운 기준선을 받아들인다"
 chi_bri.83.d: "중국이 아르헨티나와 볼리비아 전역에 베이더우 항법 및 추적 지상국 네트워크를 완성하여 위성군의 남반구 탐지 범위를 크게 확장했습니다. 미 우주사령부와 남부사령부는 이 시설들이 이중 용도라고 경고했습니다. 워싱턴은 어떻게 대응할지 결정해야 합니다."
 chi_bri.83.t: "파타고니아의 베이더우 추적국"
 chi_bri.84.a: "네 곳 모두 확보한다"
 chi_bri.84.b: "신뢰할 수 있는 세 파트너를 확보한다"
 chi_bri.84.d: "뒤집힌 먼로 독트린 전략의 완성은 연쇄적인 외교 승인 전환을 위한 조건을 조성했습니다. 아직 타이베이를 공식 승인하고 있는 나머지 중남미 국가 여러 곳이 이제 중국이 주선하는 조용한 전환의 손이 닿는 범위에 있습니다."
 chi_bri.84.t: "마지막 동맹을 잃은 대만"
 chi_bri.85.a: "지역 재편을 공고히 한다"
 chi_bri.85.b: "정치적 자본을 챙긴다"
 chi_bri.85.d: "중국의 영향력이 중남미 기구들에 깊숙이 자리 잡으면서, 미주기구는 미국 주도 지역 거버넌스의 장으로서 체계적으로 공동화되었습니다. CELAC이 선호되는 다자 포럼으로 부상했습니다. 그 여파는 워싱턴에서 부에노스아이레스까지 체감됩니다."
 chi_bri.85.t: "권한을 잃은 OAS"
 chi_bri.86.a: "더 엄격한 제재 체제를 조율한다"
 chi_bri.86.b: "외교 경로를 통해 우려를 표명한다"
 chi_bri.86.d: "중국이 테헤란과의 25년짜리 포괄적 동반자 관계를 비준하면서 중동 안보 구도에 충격파가 퍼졌습니다. 미국 당국, 이스라엘 국방 기획자들, 걸프 국가들은 각자 그 결과를 평가하며 대응을 고려하고 있습니다."
 chi_bri.86.t: "워싱턴, 텔아비브, 리야드의 경보"
 chi_bri.87.a: "성과를 전 세계에 알린다"
 chi_bri.87.b: "내부적으로 다진다"
 chi_bri.87.d: "사우디-이란 화해를 공식화한 베이징 공동성명이 국제사회 전역에서 받아들여졌습니다. 역사적 적대국 두 나라 사이의 중재자로서 중국이 한 역할은, 10년 전만 해도 예상한 이가 거의 없던 외교적 영향력을 크게 보여 주는 사례입니다."
 chi_bri.87.t: "공을 인정받은 베이징"
 chi_bri.88.a: "새로운 결제 체계를 발표한다"
 chi_bri.88.d: "걸프 국가들이 석유 거래의 일부를 위안화로 결제하기 시작하면서, 중국이 지난 10년 동안 구축해 온 금융 구조가 완성되었습니다. 에너지 시장에서 달러 패권의 침식은 점진적이지만 이제 구조적으로 뿌리내렸습니다."
 chi_bri.88.t: "균열하는 페트로달러"
 chi_bri.89.a: "핵심 국가 전환을 확보한다"
 chi_bri.89.b: "전면적 확보를 추진한다"
 chi_bri.89.d: "중국의 태평양 도서국 포럼 전략이 외교 승인 전환이 가능한 수준까지 무르익었습니다. 솔로몬 제도와 키리바시가 가장 접근하기 쉬운 대상이며, 베이징이 추가 투자를 감수한다면 투발루와 팔라우도 손에 넣을 수 있습니다."
 chi_bri.89.t: "태평양 도서국 승인 전환"
 chi_bri.90.a: "조약을 규탄하고 대응을 조율한다"
 chi_bri.90.b: "우려를 표명하고 지켜본다"
 chi_bri.90.d: "호니아라 안보 협정이 오스트레일리아-미국 장관급 협의회의 긴급 회의를 촉발했습니다. 캔버라, 워싱턴, 웰링턴은 이들이 태평양의 주권과 지역 안정에 대한 직접적 위협이라고 규정하는 사태에 대한 대응을 조율하고 있습니다."
 chi_bri.90.t: "캔버라의 해명 요구"
 chi_bri.91.a: "태평양 안보 주도 역할을 선언한다"
 chi_bri.91.b: "외교적 후퇴를 인정한다"
 chi_bri.91.d: "태평양 8개국 구상의 결과가 나왔습니다. 태평양 도서국들에 대한 중국의 관여 실적이, 베이징이 안보 주도 역할을 주장할 수 있을지 아니면 평판상의 후퇴를 감수해야 할지를 결정할 것입니다."
 chi_bri.91.t: "8개국 구상 보고서"
 chi_bri.92.a: "동맹의 대응을 가속한다"
 chi_bri.92.b: "확전 선택지를 검토한다"
 chi_bri.92.c: "재조정하고 관찰한다"
 chi_bri.92.d: "중국이 솔로몬 제도에서 기지 사용권을 확보하면서 인민해방군 해군의 영향권이 제2도련선 가장자리까지 확대되었습니다. 미 인도태평양사령부와 오스트레일리아 국방군은 그 전략적 함의를 평가하고 대응을 결정하고 있습니다."
 chi_bri.92.t: "제2도련선에 도달한 베이징"
 chi_bri.93.a: "단호한 반대 의사를 표명한다"
 chi_bri.93.b: "이 사태를 인정한다"
 chi_bri.93.d: "이탈리아가 G7 국가 중 처음으로 일대일로 양해각서에 서명하여, 나머지 G7 파트너들이 저마다 다른 정도의 경계심과 기회로 바라보는 선례를 만들었습니다. 각국 수도는 이제 중국의 기반시설 투자에 대한 자국의 입장을 정해야 합니다."
 chi_bri.93.t: "베이징과 서명한 로마"
 chi_bri.94.a: "핵심 파트너를 단속한다"
 chi_bri.94.b: "투자로 틀을 유지한다"
 chi_bri.94.d: "리투아니아의 17+1 협력 체제 탈퇴는 한쪽의 발트 및 북유럽 회원국과 다른 쪽의 발칸-비셰그라드 핵심 사이의 균열을 드러냈습니다. 중국은 더 작고 믿을 만한 연합을 공고히 할지, 아니면 비용을 들여 더 넓은 틀을 유지할지 선택해야 합니다."
 chi_bri.94.t: "갈림길에 선 17+1"
 chi_bri.96.a: "중국의 세기가 시작된다."
 chi_bri.96.b: "새로운 현실을 인정한다."
 chi_bri.96.c: "부상하는 질서를 유념한다."
 chi_bri.96.d: "중국이 글로벌 발전 구상, 아시아인프라투자은행, 고품질 일대일로 협력을 통해 구축한 합의 기반의 세계 질서는 더 이상 구상이 아니라 국제 체제의 작동 구조입니다. BRICS+ 회원국은 세계 인구의 과반을 아우릅니다. 2017년 다보스 연설은 이제 예언처럼 읽힙니다."
 chi_bri.96.t: "공동 미래 공동체"
 CHI_foreign.012.a: "예의 주시하겠다."
 CHI_foreign.012.d: "중국 관리들이 워싱턴에 한국 문제에 대한 접근 방식을 재고하라고 조용히 시사했으며, 이는 외교적 구상이 곧 나올 수 있음을 암시합니다. 이 신호는 기회일 수도, 양동일 수도 있습니다."
 CHI_foreign.012.t: "베이징의 신호"
 CHI_foreign.014.a: "초안을 검토한다."
 CHI_foreign.014.d: "한반도의 미래에 관한 공동 성명의 기반이 마련되었습니다. 베이징이 검토용 초안 틀을 제출했습니다."
 CHI_foreign.014.t: "공동 성명 틀"
 CHI_foreign.024.a: "우리의 선택지를 신중히 검토한다."
 CHI_foreign.024.d: "중국이 한국 문제에 대한 서울 중심의 해결을 수용하겠다는 신호를 보냈습니다. 이는 베이징 입장의 역사적 변화이며 평양은 이제 이를 감안해야 합니다."
 CHI_foreign.024.t: "서울을 지지하는 베이징"
 CHI_foreign.030.a: "이는 상업 관계의 용납할 수 없는 정치화이다."
 CHI_foreign.030.b: "압박은 유감스럽지만 버틸 수 있다. 우리는 굳건히 맞선다."
 CHI_foreign.030.d: "한국의 THAAD 배치에 대한 베이징의 대응이 외교적 항의에서 경제적 강압으로 확대되었습니다. 중국 당국은 한국 기업 활동, 연예 상품, 관광에 대한 제한을 지시하고 있으며, 이는 공식 제재 체제를 촉발하지 않으면서 비용을 부과하도록 정교하게 설계된 캠페인입니다."
 CHI_foreign.030.t: "THAAD 보복"
 CHI_foreign.031.a: "신호를 인정한다. 현재 태세를 유지한다."
 CHI_foreign.031.b: "중국의 보장은 신뢰할 수 없다. 우리의 한국 공약을 강화한다."
 CHI_foreign.031.d: "중국은 군 대 군 채널을 통해 압록강 훈련이 방어 지향적이라는 신호를 보냈습니다. 베이징의 메시지는 분명합니다. 중국이 북한의 행동을 관리할 것이며 지역 안정을 유지하기 위해 미국의 확전이 필요하지 않다는 것입니다."
 CHI_foreign.031.t: "자제를 시사하는 베이징"
 CHI_foreign.032.a: "한국 주둔군에 경보를 발령한다. 서울과 긴급 협의를 요청한다."
 CHI_foreign.032.b: "상황을 주시한다. 도발적인 대응은 피한다."
 CHI_foreign.032.d: "위성 영상은 북한 지상군이 38선을 따라 공세적 배치로 대대적으로 재편되었음을 확인해 줍니다. 중국의 병참 열차가 이 재배치를 지원하고 있습니다. 조선인민군은 통상적인 훈련을 넘어서는 무언가를 준비하고 있는 것으로 보입니다."
 CHI_foreign.032.t: "압록강의 병력 증강"
 CHI_foreign.033.a: "비상 계획 수립을 시작한다. 워싱턴과 협의한다."
 CHI_foreign.033.b: "헌법적 제약은 절대적이다. 오직 외교 경로로만 추진한다."
 CHI_foreign.033.d: "38선을 따른 북한의 병력 증강이 일본 국회에서 헌법 9조와 일본의 자위 태세에 대한 헌법적 한계를 둘러싼 논쟁을 다시 불붙였습니다. 국방 강경파는 집단 자위 공약의 긴급 재해석을 압박하고 있습니다."
 CHI_foreign.033.t: "헌법 9조 논쟁"
 CHI_foreign.034.a: "한국과의 상호 방위 공약을 발동한다."
 CHI_foreign.034.b: "안전보장이사회 긴급 회의를 소집한다."
 CHI_foreign.034.d: "중국의 병참 및 물자 지원을 받은 북한군이 비무장지대를 넘었습니다. 중국은 공식적으로 분쟁에 참전하지 않았지만, 북한 전쟁 기계의 모든 면에 중국의 흔적이 남아 있습니다."
 CHI_foreign.034.t: "한반도의 전쟁"
 CHI_foreign.035.a: "최고 경계 태세에 돌입한다. 비상 병력을 준비한다."
 CHI_foreign.035.b: "상황이 분명해질 때까지 움직이지 않는다."
 CHI_foreign.035.d: "평양 경비 구역 내에서 총성과 군사 이동이 있었다는 미확인 보고는 북한 수도에서 심상치 않은 일이 벌어지고 있음을 시사합니다. 중국 관영 매체는 침묵하고 있습니다. 상황은 위험할 정도로 불투명합니다."
 CHI_foreign.035.t: "평양의 혼란"
 CHI_foreign.036.a: "북한 주권에 대한 간섭을 규탄하는 공식 성명을 발표한다."
 CHI_foreign.036.b: "과도 위원회와 비공식 접촉 채널을 연다."
 CHI_foreign.036.d: "중국의 지원을 받는 장교들이 김정은을 상대로 쿠데타를 일으켰습니다. 김씨 일가는 권력에서 제거되었습니다. 평양에서는 베이징의 대화 상대로 알려진 인물들을 중심으로 과도 위원회가 구성되고 있습니다. 중국은 관리된 승계를 산파하고 있는 것으로 보입니다."
 CHI_foreign.036.t: "평양 쿠데타"
 CHI_foreign.037.a: "외교 경로를 통해 베이징에 우려를 전달한다."
 CHI_foreign.037.b: "기다리며 관찰한다. 강한 성명을 내기에는 상황이 너무 유동적이다."
 CHI_foreign.037.d: "북한의 쿠데타는 일본에게 기회와 위험을 모두 안겨 줍니다. 평양의 친중 과도 정부는 김정은보다 예측하기 쉬울 수 있지만, 한반도의 중국 종속국은 도쿄에 중대한 전략적 도전입니다."
 CHI_foreign.037.t: "새로운 평양"
 CHI_foreign.038.a: "북한 통치 구조의 일방적 개편에 공식 항의한다."
 CHI_foreign.038.b: "새로운 현실을 받아들인다. 베이징의 한반도 정책과의 타협을 모색한다."
 CHI_foreign.038.d: "중국이 평양의 쿠데타 이후 정치적 해결의 조건을 발표했습니다. 새 북한 정부는 헌법적으로 개편되고, 경제적으로 중국 공급망에 통합되며, 전략적으로 베이징의 한반도 정책에 종속됩니다."
 CHI_foreign.038.t: "베이징 합의"
 CHI_foreign.040.a: "이 재편은 용납할 수 없다. 서울에 결과를 경고한다."
 CHI_foreign.040.b: "표류를 받아들인다. 동맹은 강요로 유지할 수 없다."
 CHI_foreign.040.d: "한국이 전략적 자율 교리를 채택하고 중국을 주요 안보 파트너로 삼기로 결정한 것은 인도태평양 균형의 중대한 재편을 의미합니다. 1953년 이래 지속되어 온 한미 동맹은 수십 년 만에 가장 심각한 긴장에 직면했습니다."
 CHI_foreign.040.t: "서울의 표류"
 CHI_foreign.041.a: "변화하는 구도에 신중한 관심을 표명한다."
 CHI_foreign.041.b: "그 프레임을 거부한다. 중국은 북한을 버리지 않는다."
 CHI_foreign.041.d: "한국이 베이징으로 선회하면서 평양은 불편한 계산을 하게 되었습니다. 북한을 배제한 중국-서울 동반자 관계는 남쪽의 미국 주둔보다 전략적으로 더 위협적입니다."
 CHI_foreign.041.t: "어느 중국인가?"
 CHI_foreign.042.a: "보상 조치에 관해 워싱턴과 긴급 협의를 시작한다."
 CHI_foreign.042.b: "양자 간 한일 안보 체제가 가능한지 평가한다."
 CHI_foreign.042.d: "한국이 한미일 3자 안보 체제에서 이탈하면서 일본은 인도태평양 구도의 남은 부분 안에서 고립되었습니다. 서울의 참여가 없으면 일본과 워싱턴의 안보 관계에는 핵심 기둥이 빠지게 됩니다."
 CHI_foreign.042.t: "홀로 남은 도쿄"
 CHI_foreign.043.a: "필리핀 파트너들에게 우리의 공약을 재확인한다."
 CHI_foreign.043.b: "인도태평양 공약에 대한 전략 검토를 시작한다."
 CHI_foreign.043.d: "한국의 3자 안보 체제 이탈은 마닐라에서 인도태평양 전역에 걸친 미국 안보 공약의 지속성에 대한 불안을 촉발했습니다. 필리핀 관리들은 자국의 동맹 태세에 대한 조용한 재평가를 시작했습니다."
 CHI_foreign.043.t: "흔들리는 체제"
 CHI_foreign.044.a: "전략적 후퇴를 받아들인다. 남은 파트너를 중심으로 재조정한다."
 CHI_foreign.044.d: "한국의 3자 체제 이탈은 워싱턴이 10년을 들여 구축한 인도태평양 구조를 사실상 해체합니다. 중국은 대결로는 결코 이룰 수 없었던 것을 인내심 있는 외교로 달성했습니다."
 CHI_foreign.044.t: "인도태평양 전략의 붕괴"
 CHI_foreign.045.a: "요청을 수락한다. 질서 있는 재배치를 시작한다."
 CHI_foreign.045.b: "거부한다. 미군은 워싱턴의 재량에 따라 한반도에 남는다."
 CHI_foreign.045.d: "한국이 중국의 안보 보장을 공식 지지하면서 주한 미 지상군의 계속된 주둔은 정치적으로 유지하기 어려워졌습니다. 서울은 한국 영토에서의 미군 재배치 일정표를 요청했습니다."
 CHI_foreign.045.t: "귀환하는 병력"
 CHI_foreign.046.a: "일본의 안보 태세에 관해 워싱턴과 긴급 협의를 시작한다."
 CHI_foreign.046.b: "자체 방위 능력 개발을 가속한다."
 CHI_foreign.046.d: "미국의 한반도 재배치는 미일 안보 동맹을 전략적으로 불완전하게 만듭니다. 일본의 남쪽 측면이 노출되었고, 지난 70년간 일본 방위 계획을 떠받쳐 온 전제는 근본적인 수정이 필요합니다."
 CHI_foreign.046.t: "공동화된 동맹"
 CHI_foreign.047.a: "보장을 수락한다. 한국의 미래가 먼 후견국에 달려 있을 수는 없다."
 CHI_foreign.047.b: "제안을 거부한다. 한국의 주권을 중국의 후견과 맞바꿀 수는 없다."
 CHI_foreign.047.d: "중국이 한국에 향후 통일 합의를 뒷받침하는 공식 안보 보장을 제안했습니다. 베이징 보장은 통일 한국의 주권을 수호할 것을 중국에 약속시키지만, 그 대가로 한국을 사실상 중국과 연대한 국가로 바꾸는 전략적 조치를 요구합니다."
 CHI_foreign.047.t: "베이징 보장"
 CHI_foreign.048.a: "베이징의 틀에 응한다. 생존은 현실주의를 요구한다."
 CHI_foreign.048.b: "틀을 거부한다. 우리는 흡수되지 않을 것이다."
 CHI_foreign.048.d: "통일 한국에 대한 중국의 안보 보장 제안은 평양에 명확한 순간을 강요했습니다. 북한 지도부는 중국의 후원 없는 저항이 지속 불가능함을 알면서도 저항과 타협 중 하나를 선택해야 합니다."
 CHI_foreign.048.t: "보장과 북쪽"
 CHI_foreign.049.a: "이 과정과 그 함의에 관한 공식 성명을 발표한다."
 CHI_foreign.049.b: "결과를 인정한다. 이에 맞춰 인도태평양 전략을 조정한다."
 CHI_foreign.049.d: "한반도 통일 과정은 중국의 주도 아래, 중국이 정한 조건으로 진행되고 있습니다. 한국의 안보에 대한 미국의 70년 군사 주둔과 외교적 투자는 베이징과 연대한 통일 한국이라는 결과를 낳았습니다."
 CHI_foreign.049.t: "우리가 만들지 않은 통일"
 CHI_foreign.050.a: "유념한다."
 CHI_foreign.050.d: "미 항모 전단들이 고조되는 긴장에 대응해 대한해협 쪽으로 재배치되었습니다. 베이징은 이 움직임을 주시하고 있습니다."
 CHI_foreign.050.t: "대한해협으로 이동하는 항모들"
 CHI_foreign.051.a: "어려운 상황이다."
 CHI_foreign.051.d: "한반도의 긴장이 임계점에 도달했습니다. 워싱턴, 도쿄, 서울은 고도의 대비 태세에 돌입했습니다."
 CHI_foreign.051.t: "지역 위기 경보"
 CHI_foreign.052.a: "물러선다. 대가가 너무 크다."
 CHI_foreign.052.b: "압박을 유지한다."
 CHI_foreign.052.d: "한반도의 긴장이 정점에 달했습니다. 베이징은 한발 물러설지, 기존 노선을 유지할지, 아니면 결정적 결과를 밀어붙일지 결정해야 합니다."
 CHI_foreign.052.t: "벼랑 끝의 한반도"
 CHI_foreign.053.a: "반가운 전개이다."
 CHI_foreign.053.d: "한반도의 위기 분위기가 걷혔습니다. 지역 강대국들은 안정의 회복을 환영합니다."
 CHI_foreign.053.t: "한반도 데탕트"
 CHI_foreign.054.a: "이 인수는 우리의 경제적 이익에 부합한다."
 CHI_foreign.054.b: "카자흐스탄의 석유는 국가의 통제하에 있어야 한다."
 CHI_foreign.054.d: "중국석유천연가스집단공사가 페트로카자흐스탄을 41억 8천만 달러에 인수하겠다는 공식 입찰서를 제출했습니다. 이 거래는 카자흐스탄 최대 독립 석유 생산업체의 운영권을 중국에 넘기는 대신 국고에 상당한 현금 지급을 가져옵니다."
 CHI_foreign.054.t: "CNPC 인수 제안"
 CHI_foreign.056.a: "그들의 결정을 존중한다."
 CHI_foreign.056.d: "아스타나는 국가 자원 주권에 대한 우려를 이유로 페트로카자흐스탄에 대한 CNPC의 제안을 거절했습니다."
 CHI_foreign.056.t: "CNPC 인수 입찰을 거부한 카자흐스탄"
 CHI_foreign.057.a: "이 인수는 앙골라의 경제적 이익에 부합한다."
 CHI_foreign.057.b: "우리의 에너지 자원은 매물이 아니다."
 CHI_foreign.057.d: "시노펙이 앙골라, 나이지리아, 쿠르디스탄 지역 전역의 석유 생산 면허를 확보할 수 있도록 애닥스 페트롤리엄을 72억 달러에 인수하겠다는 제안서를 제출했습니다. 이 거래는 지금까지 시노펙의 최대 해외 인수가 될 것입니다."
 CHI_foreign.057.t: "시노펙 인수 제안"
 CHI_foreign.058.a: "시노펙이 아프리카 석유 생산에서 또 하나의 거점을 확보한다."
 CHI_foreign.058.d: "루안다는 애닥스 페트롤리엄에 대한 시노펙의 입찰을 수락했습니다. 중국 기술자들이 해상 유전 광구의 운영권을 맡게 되며, 수익의 일부는 앙골라 기반시설에 투입됩니다."
 CHI_foreign.058.t: "앙골라의 시노펙 인수 승인"
 CHI_foreign.059.a: "그들의 결정을 존중한다."
 CHI_foreign.059.d: "루안다는 애닥스 페트롤리엄을 인수하겠다는 시노펙의 제안을 거절했습니다."
 CHI_foreign.059.t: "시노펙 인수 입찰을 거부한 앙골라"
 CHI_foreign.060.a: "중국의 전문 기술과 자본을 환영한다."
 CHI_foreign.060.b: "베네수엘라의 석유 자원은 외국에 양허할 것이 아니다."
 CHI_foreign.060.d: "CNOOC가 베네수엘라 국영석유회사와 함께 오리노코 중질유 지대를 개발하기 위한 장기 합작 사업을 제안했습니다. 중국은 생산권 지분을 받는 대가로 선불 자본과 중질유 채굴 전문 기술을 제공합니다."
 CHI_foreign.060.t: "CNOOC 합작 사업 제안"
 CHI_foreign.061.a: "CNOOC가 서반구 최대 석유 매장지에서 거점을 확보한다."
 CHI_foreign.061.d: "카라카스는 오리노코 지대에 대한 CNOOC의 합작 사업 제안에 동의했습니다. 훈인 광구의 생산권이 이제 공유되어, 중국의 채굴 기술이 세계 최대 확인 매장량의 석유 지대에 들어오게 됩니다."
 CHI_foreign.061.t: "베네수엘라의 CNOOC 합작 사업 승인"
 CHI_foreign.062.a: "그들의 결정을 존중한다."
 CHI_foreign.062.d: "카라카스는 오리노코 지대에 대한 CNOOC의 합작 사업 제안을 거절했습니다."
 CHI_foreign.062.t: "베네수엘라의 CNOOC 합작 사업 거부"
 CHI_foreign.063.a: "우리의 에너지 안보를 위한 전략적 인수이다."
 CHI_foreign.063.d: "아스타나는 페트로카자흐스탄에 대한 CNPC의 입찰을 수락했습니다. 중국이 운영하는 유전들이 쿰콜 및 북부 부자치 유전의 생산을 확대하여 중국 정유 시설에 카자흐스탄산 원유를 꾸준히 공급하게 될 것입니다."
 CHI_foreign.063.t: "카자흐스탄의 CNPC 인수 승인"
 CHI_foreign.100.a: "지속적인 압박에 대비한다. 동맹국들과 협의한다."
 CHI_foreign.100.d: "중국이 한국을 겨냥한 조율된 압박 캠페인을 개시하여, 서울의 안보 계산을 워싱턴에서 멀어지게 하려는 외교적, 경제적, 군사적 신호를 보내고 있습니다."
 CHI_foreign.100.t: "베이징의 압박 캠페인"
 CHI_foreign.101.a: "조치들을 기록하고 비례적인 대응을 준비한다."
 CHI_foreign.101.d: "베이징이 THAAD 보복을 비공식 경제 제한이라는 더 넓은 체제로 확대했습니다. 중국에서 영업하는 한국 기업들은 인허가, 통관, 규제 경로 전반에서 체계적인 방해를 받고 있다고 보고합니다."
 CHI_foreign.101.t: "비공식 제재 부과"
 CHI_foreign.102.a: "신중하게 접촉한다. 채널을 열어 둔다."
 CHI_foreign.102.d: "중국과 미국 외교관들이 한반도 문제에 관한 은밀한 실무 채널을 구축했습니다. 이 방식은 양측이 공식 협상 체제를 공개적으로 약속하지 않고도 확전 위험을 관리할 수 있게 합니다."
 CHI_foreign.102.t: "열린 비공식 채널"
 CHI_foreign.103.a: "새로운 틀에 응한다. 그 함의를 주시한다."
 CHI_foreign.103.d: "베이징과 서울은 고위급 접촉을 복원하고 한반도 논의를 위한 3자 틀을 여는 구조적인 외교 재설정에 합의했습니다. 이 합의는 한국이 이전에 워싱턴과 보인 연대에서 크게 벗어나는 것입니다."
 CHI_foreign.103.t: "2022년 재설정"
 CHI_foreign.104.a: "틀을 수락한다. 그 안에서 우리의 역할을 정한다."
 CHI_foreign.104.d: "중국과 미국이 한반도의 정전 이후 안보 구조의 윤곽에 합의했습니다. G2 틀은 두 강대국에 한반도 안정에 대한 공동 책임을 부여하며 다른 행위자들을 주변화합니다."
 CHI_foreign.104.t: "정전 이후 구조"
 CHI_foreign.105.a: "제안을 검토한다. 산업계 및 안보 고문들과 협의한다."
 CHI_foreign.105.d: "중국이 한국 산업을 관리된 통일 과정에 연결하는 경제 통합 플랫폼을 제안했습니다. 이 합의는 서울이 통일 정책을 베이징이 선호하는 결과에 맞추도록 하는 깊은 구조적 유인을 만들어 냅니다."
 CHI_foreign.105.t: "통일을 위한 경제 틀"
 CHI_foreign.106.a: "새 교리를 인정한다. 우리의 전략적 대응을 준비한다."
 CHI_foreign.106.d: "한국의 전략적 자율 교리 공식 채택은 한미 동맹 체제로부터의 결정적인 선회를 의미합니다. 서울은 미국의 안보 궤도 안이 아니라 워싱턴과 베이징 사이에 자리를 잡고 있습니다."
 CHI_foreign.106.t: "되돌려진 선회"
 CHI_foreign.107.a: "최후통첩을 평양에 전달한다."
 CHI_foreign.107.b: "거부한다. 재통일은 오직 우리의 조건으로 이루어져야 한다."
 CHI_foreign.107.d: "[CHI.GetLeader]와(과) [USA.GetLeader]은(는) 드문 합의에 도달했습니다. 두 사람은 공동으로 [NKO.GetName]에 서울 주도의 평화적 재통일을 수용하라고 요구할 것입니다. 거부하면 전쟁입니다. [KOR.GetName]은(는) 이 최후통첩을 평양에 전달할지 결정해야 합니다."
 CHI_foreign.107.t: "북한에 대한 공동 최후통첩"
 CHI_foreign.108.a: "수락한다. 게임은 끝났다."
 CHI_foreign.108.b: "거부한다. 우리는 주권을 내주지 않는다."
 CHI_foreign.108.d: "중미 공동 성명이 평양에 도착했습니다. 이 성명은 [NKO.GetName] 국가의 즉각적이고 평화적인 해체와 서울 정부 아래 한반도의 재통일을 요구합니다. 거부는 중국, 미국, 한국과의 동시 전쟁을 의미합니다."
 CHI_foreign.108.t: "베이징과 워싱턴의 통일 요구"
 CHI_foreign.109.a: "동아시아에 새 시대가 열린다."
 CHI_foreign.109.d: "북한이 최후통첩을 수락했습니다. 김 정권은 국가를 해체하고 권한을 서울에 이양하기로 합의했습니다. 한반도는 총성 한 발 없이 통일되었으며, 이는 역사적 규모의 외교적 승리입니다."
 CHI_foreign.109.t: "평양의 수락"
 CHI_foreign.110.a: "그렇다면 전쟁이다."
 CHI_foreign.110.d: "북한이 최후통첩을 거부했습니다. 평양의 대답은 비무장지대 너머로 날아온 포격이었습니다. 남은 외교적 길은 없습니다. 오직 전쟁과 무력에 의한 한반도의 해방뿐입니다."
 CHI_foreign.110.t: "평양의 거부"
 CHI_foreign.200.a: "문제를 밀어붙인다."
 CHI_foreign.200.b: "탐색하고 철수한다."
 CHI_foreign.200.c: "UN의 중재를 요구한다."
 CHI_foreign.200.d: "우리 해안경비대 함정과 일본 해상자위대는 동중국해에서 2해리도 안 되는 거리를 두고 있습니다. 다음 수는 우리에게 달려 있습니다. 모든 선택지가 결과를 수반합니다."
 CHI_foreign.200.t: "경계선에 다다른 함대"
 CHI_foreign.201.a: "굳건히 버틴다. 해상자위대에 선을 지키라고 명령한다."
 CHI_foreign.201.b: "미국의 즉각적인 개입을 요청한다."
 CHI_foreign.201.c: "물러나 외교적 해결을 모색한다."
 CHI_foreign.201.d: "중국 함정들이 분쟁 경계선에서 위치를 지키고 있습니다. 도쿄는 얼마나 강하게 맞받아칠지 결정해야 합니다."
 CHI_foreign.201.t: "센카쿠 경계선을 압박하는 중국"
 CHI_foreign.202.a: "보장을 이행한다. 일본에 군사적 지원을 시사한다."
 CHI_foreign.202.b: "양다리를 걸친다. 병력 투입 없이 우려를 표명한다."
 CHI_foreign.202.d: "일본이 동맹 의무를 발동했습니다. 중국 함정들이 센카쿠 경계선을 압박하고 있으며 도쿄는 워싱턴에 공약을 이행하라고 요청하고 있습니다. 어느 쪽을 택하든 이 결정에는 대가가 따릅니다."
 CHI_foreign.202.t: "보장을 이행하시겠습니까?"
 CHI_foreign.203.a: "유념한다."
 CHI_foreign.203.b: "문 앞에서 벌어진 충돌이다. 면밀히 주시한다."
 CHI_foreign.203.c: "먼 곳의 다툼이다. 유념하고 넘어간다."
 CHI_foreign.203.d: "중국 함정과 일본 함정이 센카쿠 열도 인근에서 충돌했습니다. 이 사건은 국제적 관심을 끌었고 지역 내 더 광범위한 확전에 대한 우려를 불러일으켰습니다."
 CHI_foreign.203.t: "동중국해의 대치"
 CHI_foreign.204.a: "선언을 거부한다. 우리의 행정적 통제를 유지한다."
 CHI_foreign.204.b: "공식 항의를 제기하고 워싱턴과 협의한다."
 CHI_foreign.204.d: "중국이 댜오위다오에 대한 공식 주권 선언을 발표하고 해안경비대의 상시 순찰 체제를 알렸습니다. 도쿄의 대응이 예상됩니다."
 CHI_foreign.204.t: "댜오위다오를 주장하는 베이징"
 CHI_foreign.206.a: "공동 성명을 도쿄에 보낸다."
 CHI_foreign.206.d: "정상회담은 일본이 공동 성명 전문에 서명하는 것으로 마무리되었습니다. 양측이 안정적인 중일 관계를 지키고 역사적 불만을 암묵적으로 해소한다는 성명이 이제 기록으로 남았습니다."
 CHI_foreign.206.t: "공동 성명 서명"
 CHI_foreign.208.a: "유념한다."
 CHI_foreign.208.b: "지역 균형의 변화이다. 상황을 점검한다."
 CHI_foreign.208.c: "전개를 인정한다."
 CHI_foreign.208.d: "중국과 일본이 전략적 양해를 공식화하는 공동 성명을 발표했습니다. 이 문서는 양측에 안정적인 관계와 역사적 불만에 관한 암묵적 합의를 약속합니다. 분석가들은 베이징과 도쿄 중 어느 쪽이 더 많이 얻었는지를 두고 의견이 갈립니다."
 CHI_foreign.208.t: "중일 공동 성명 서명"
 CHI_foreign.211.a: "방문을 조용히 취소한다"
 CHI_foreign.211.b: "공식 방문을 강행한다"
 CHI_foreign.211.d: "베이징의 대사 소환과 외교적 동결로 인해 다음번 야스쿠니 신사 참배는 중대한 시험대가 되었습니다. 일본 내각은 갈등을 완화할 것인가, 아니면 국가적 자존심을 고수할 것인가?"
 CHI_foreign.211.t: "야스쿠니 참배를 둘러싼 도쿄의 선택"
 CHI_foreign.212.a: "해안경비대 대응을 확대한다"
 CHI_foreign.212.b: "긴장 완화를 위한 비공식 채널을 연다"
 CHI_foreign.212.d: "중국 해상 민병대와 일본 해상보안청 순시선 사이의 대치가 댜오위다오 인근에서 확대되었습니다. 내각은 영상이 저녁 뉴스에 나가기 전에 대응해야 합니다."
 CHI_foreign.212.t: "센카쿠 대치 사건"
 CHI_foreign.216.a: "전투기를 긴급 발진시키고 방공식별구역 선을 지킨다"
 CHI_foreign.216.b: "사건을 조용한 비공식 채널로 돌린다"
 CHI_foreign.216.d: "중국 항공기가 이제 매일 동중국해 방공식별구역에 진입하고 있으며, 인민해방군 전투기와 항공자위대 전투기의 충돌 직전 상황이 도쿄를 긴장시켰습니다. 해안경비대만으로는 더 이상 센카쿠 주변의 압박을 감당할 수 없습니다."
 CHI_foreign.216.t: "센카쿠 방공식별구역 대치"
 CHI_foreign.217.a: "인민해방군 해군 기동 전단을 배치하고 굳건히 버틴다"
 CHI_foreign.217.b: "총성이 울리기 전에 물러난다"
 CHI_foreign.217.d: "중국 해군 기동 전단이 분쟁 도서가 보이는 거리에서 일본 함정들을 추적하고 있으며, 양국 해군은 전투 배치 상태입니다. 한 번의 오판된 기동이 중일 전쟁의 첫 총성을 울릴 수 있습니다. 도쿄는 베이징이 선을 지킬지 물러설지 지켜보고 있습니다."
 CHI_foreign.217.t: "벼랑 끝의 센카쿠 대치"
 CHI_foreign.213.a: "로비 세력을 달래고 불매 운동을 끝낸다"
 CHI_foreign.213.b: "폭풍을 견뎌 낸다"
 CHI_foreign.213.d: "일본 수출업체들과 게이단렌이 인내심을 잃어 가고 있습니다. 중국의 불매 운동은 일본 브랜드를 최대 시장 중 하나에서 몰아내고 있습니다. 도쿄는 결정해야 합니다. 베이징을 달랠 것인가, 폭풍을 견뎌 낼 것인가."
 CHI_foreign.213.t: "불매 운동의 타격"
 CHI_foreign.215.a: "안보 조약을 이행한다"
 CHI_foreign.215.b: "비공식 채널을 통해 휴전을 중재한다"
 CHI_foreign.215.d: "베이징이 센카쿠 문제를 강행했습니다. 상호 안보 조약은 워싱턴이 개입을 고려하도록 의무를 부과합니다. 대통령은 조약을 공개적으로 이행하거나 비공식 채널을 통한 휴전을 추진할 수 있습니다."
 CHI_foreign.215.t: "센카쿠에 대한 워싱턴의 결정"
 CHI_foreign.220.a: "제안을 환영한다"
 CHI_foreign.220.b: "정중한 회의론을 보인다"
 CHI_foreign.220.d: "베이징이 1977년 원조 후쿠다 독트린을 본뜬 개방적 자세를 시사했습니다. 도쿄는 이 제안을 환영하거나 정중한 회의론으로 대응할 수 있습니다."
 CHI_foreign.220.t: "새로운 세기의 후쿠다 독트린"
 CHI_foreign.221.a: "공식 국빈 방문을 개최한다"
 CHI_foreign.221.b: "격식을 낮춘 접견을 한다"
 CHI_foreign.221.d: "중국이 국빈 방문 선물로 우에노 동물원에 자이언트 판다를 제안했습니다. 내각은 공식 국빈 방문을 개최할지, 격식을 낮출지를 결정해야 합니다."
 CHI_foreign.221.t: "도쿄를 위한 판다"
 CHI_foreign.222.a: "조약에 서명한다"
 CHI_foreign.222.b: "더 많은 증거를 기다린다"
 CHI_foreign.222.d: "베이징이 역사적 적대 프레임을 공식 폐기하는 양자 선언을 제출했습니다. 도쿄는 서명하고 화답하거나 중국의 의도를 보여 주는 추가 증거를 기다릴 수 있습니다."
 CHI_foreign.222.t: "상호 위협 감축 조약"
 CHI_foreign.223.a: "일본에 재공약을 압박한다"
 CHI_foreign.223.b: "쿼드를 대화체로 격하한다"
 CHI_foreign.223.d: "베이징의 외교적 쐐기가 도쿄를 쿼드 안보 대화에서 떼어 내기 시작했습니다. 워싱턴은 일본에 재공약을 압박하거나 격하를 조용히 받아들일 수 있습니다."
 CHI_foreign.223.t: "쿼드의 응답"
 CHI_foreign.224.a: "공동 성명 전문에 서명한다"
 CHI_foreign.224.b: "유보 조건을 달아 서명한다"
 CHI_foreign.224.c: "퇴장한다"
 CHI_foreign.224.d: "수년에 걸친 인내심 있는 외교가 공동 성명 초안을 낳았습니다. 전문에 서명하면 일본의 전략적 태세가 재편되고, 유보 조건을 달아 서명하면 워싱턴과 결별하지 않으면서 양자 관계를 지킬 수 있으며, 퇴장하면 전체 과정이 무산됩니다."
 CHI_foreign.224.t: "도쿄 공동 성명"
 CHI_foreign.226.a: "유보 조건을 유념하고 앞으로 나아간다."
 CHI_foreign.226.d: "도쿄는 공동 성명의 더 제한적인 판본에 서명했습니다. 자민당은 전문을 수용하는 대신 특정 유보 조건을 두어 워싱턴과의 일정한 연대를 지켰습니다. 양자 관계는 진전되지만 전략적 모호성은 남아 있습니다."
 CHI_foreign.226.t: "일본과의 부분 합의"
 CHI_foreign.227.a: "피해를 평가한다."
 CHI_foreign.227.d: "수년간의 외교적 기반이 무너졌습니다. 자민당은 베이징이 권한을 넘어서고 일본의 주권을 종속시켰다고 비난하며 최종 공동 성명 문안을 거부했습니다. 협상 체계 전체가 붕괴했습니다."
 CHI_foreign.227.t: "회담에서 퇴장한 일본"
 CHI_foreign.231.a: "상업적 기회를 유념한다."
 CHI_foreign.231.d: "베이징은 미쓰비시 항공우주가 중국 본토에 면허 생산 및 연구 시설을 설립하는 것을 환영했습니다. 일본 산업은 수출 수익과 시장 접근권을 얻고, 중국 항공우주 기술자들은 첨단 기체 설계에 가까이 다가갑니다."
 CHI_foreign.231.t: "중국에 진출한 미쓰비시 항공우주"
 CHI_foreign.232.a: "상업적 기회를 유념한다."
 CHI_foreign.232.d: "가와사키 항공우주 부문이 베이징과 대형 기체 부품 생산을 다루는 기본 협정을 확보했습니다. 이 거래는 중국 시장의 상당한 점유율을 열어 주는 한편 도쿄에 중국 항공우주 조달 주기에 대한 영향력을 안겨 줍니다."
 CHI_foreign.232.t: "중국에 진입한 가와사키 항공우주"
 CHI_foreign.233.a: "상업적 기회를 유념한다."
 CHI_foreign.233.d: "일본제강소가 중국에서 합작 단조 공장을 운영할 승인을 받았습니다. 대형 강철 단조품의 수출 이익은 도쿄에 중국 중공업 능력에 대한 지속적인 영향력을 줍니다."
 CHI_foreign.233.t: "중국에 진출한 일본제강소"
 CHI_foreign.234.a: "상업적 기회를 유념한다."
 CHI_foreign.234.d: "미쓰비시 중공업의 지상 장비 부문이 중국 국영 파트너와 기술 라이선스 계약에 합의했습니다. 일본은 상업적 수익을 얻고, 베이징은 장갑차 설계 방법론에 접근하게 됩니다."
 CHI_foreign.234.t: "중국에 초청된 MHI 지상 장비 부문"
 CHI_foreign.235.a: "상업적 기회를 유념한다."
 CHI_foreign.235.d: "고마쓰 디펜스가 경장갑차량을 다루는 생산 협력 계약을 중국에 구축했습니다. 이 거래는 도쿄에 꾸준한 수출 수입을 안기고 양국 방위산업 관계를 심화합니다."
 CHI_foreign.235.t: "중국에 진출한 고마쓰 디펜스"
 CHI_foreign.236.a: "상업적 기회를 유념한다."
 CHI_foreign.236.d: "스바루 주식회사의 항공우주 부문이 중국 측 상대와 공동 제조 계약을 체결했습니다. 회전익 구조 전문 기술이 중국 계획으로 흘러 들어가는 한편, 스바루는 장기 부품 주문을 확보합니다."
 CHI_foreign.236.t: "스바루 항공우주 제휴 체결"
 CHI_foreign.237.a: "상업적 기회를 유념한다."
 CHI_foreign.237.d: "하우아 기계가 정밀 가공 공정을 중국 파트너 시설에 라이선스했습니다. 이 계약은 수출 수입을 가져오는 동시에 일본의 소화기 제조 표준을 중국 방위 공급망으로 확장합니다."
 CHI_foreign.237.t: "중국에서 활동하는 하우아 기계"
 CHI_foreign.238.a: "상업적 기회를 유념한다."
 CHI_foreign.238.d: "NEC가 중국에 합작 전자 통합 센터를 열었습니다. 상업적 수익은 상당하며, 도쿄에 더 깊은 소득은 중국 C4ISR 조달 표준에 대한 지속적인 영향력입니다."
 CHI_foreign.238.t: "중국 사업장을 설립한 NEC"
 CHI_foreign.239.a: "상업적 기회를 유념한다."
 CHI_foreign.239.d: "도시바 디펜스 시스템즈가 관리형 라이선스 체계 아래 중국 통합업체에 레이더 및 센서 부품을 공급하기로 합의했습니다. 일본은 설계 권한을 유지하면서 꾸준한 기술 이전 로열티를 벌어들입니다."
 CHI_foreign.239.t: "중국의 도시바 디펜스 시스템즈"
 CHI_foreign.240.a: "상업적 기회를 유념한다."
 CHI_foreign.240.d: "미쓰비시의 조선 부문이 중국 국영 조선소와 함정 건조 협력 계약을 체결했습니다. 수출 수익과 중국 수상 전투함 설계 표준에 대한 장기적 영향력이 도쿄의 주된 이익입니다."
 CHI_foreign.240.t: "베이징과 서명한 미쓰비시 조선"
 CHI_foreign.241.a: "상업적 기회를 유념한다."
 CHI_foreign.241.d: "가와사키 중공업의 조선 부문이 중국 파트너와 잠수함 선체 제작 기술을 공유하기로 합의했습니다. 일본은 시장 접근권을 얻고, 베이징은 음향 신호 저감 기법을 접하게 됩니다."
 CHI_foreign.241.t: "중국에서 환영받은 가와사키 조선소"
 CHI_foreign.242.a: "상업적 기회를 유념한다."
 CHI_foreign.242.d: "IHI가 면허 제조 체계에 따라 중국에서 항공 엔진 부품을 생산할 승인을 확보했습니다. 도쿄는 안정적인 수입원과 중국 군용 항공 조달의 발판을 얻습니다."
 CHI_foreign.242.t: "중국 시장에 진입한 IHI"
 CHI_foreign.243.a: "상업적 기회를 유념한다."
 CHI_foreign.243.d: "재팬 마린 유나이티드가 중국 조선업체와 함정 설계 협력 계약을 체결했습니다. 이 거래는 수출 수입을 가져오고 중국 수상 전투함 계획 개발에서 일본의 지속적인 역할을 확립합니다."
 CHI_foreign.243.t: "재팬 마린 유나이티드 제휴 체결"
 CHI_foreign.244.a: "상업적 기회를 유념한다."
 CHI_foreign.244.d: "도요타 자동차가 새로운 제휴 체계에 따라 중국 내 제조 및 물류 기반을 확장하기로 합의했습니다. 생산 방식의 수출은 중국 산업 현대화에 대한 일본의 연성 영향력을 강화합니다."
 CHI_foreign.244.t: "중국 제조 시설을 설립한 도요타"
 CHI_foreign.245.a: "상업적 기회를 유념한다."
 CHI_foreign.245.d: "혼다 자동차가 중국에서 확대된 제조 및 동력 계통 라이선스 계약을 확보했습니다. 꾸준한 로열티 수입이 도쿄로 흘러 들어오는 한편, 혼다의 생산 표준이 중국 공장의 관행에 자리 잡습니다."
 CHI_foreign.245.t: "제휴에 참여한 혼다"
 CHI_foreign.246.a: "상업적 기회를 유념한다."
 CHI_foreign.246.d: "일본제철이 합작 방식으로 중국 파트너에게 고경도 강판과 특수 합금을 공급하기로 합의했습니다. 이 거래는 프리미엄 수출 수익을 가져오고 중국의 장갑 강철 생산을 일본 공급망에 묶어 둡니다."
 CHI_foreign.246.t: "중국 사업에 합류한 일본제철"
 CHI_foreign.247.a: "상업적 기회를 유념한다."
 CHI_foreign.247.d: "히타치가 제휴 체계에 따라 중국에 산업용 전자 및 임베디드 컴퓨팅 사업을 구축했습니다. 수출 수익은 즉각적이며, 장기적으로 도쿄는 중국 기반시설 현대화에 대한 지속적인 영향력을 얻습니다."
 CHI_foreign.247.t: "중국으로 확장하는 히타치"
 CHI_foreign.248.a: "상업적 기회를 유념한다."
 CHI_foreign.248.d: "파나소닉이 중국 파트너에게 배터리 기술과 내구성 강화 전자 장비를 공급하는 계약을 체결했습니다. 이 계약은 안정적인 수출 수입을 만들어 내는 동시에 일본의 부품 표준을 중국 군 관련 생산 라인에 뿌리내리게 합니다."
 CHI_foreign.248.t: "중국 제휴에 진입한 파나소닉"
 CHI_foreign.249.a: "상업적 기회를 유념한다."
 CHI_foreign.249.d: "JR 동일본이 중국 파트너와 고속철도 신호 체계 및 철도 차량 공학을 공유하기로 합의했습니다. 상업적 수익은 분명하며, 도쿄에 있어 전략적 가치는 중국 교통 기반시설에 대한 장기적 영향력에 있습니다."
 CHI_foreign.249.t: "중국에 철도 전문 기술을 들여온 JR 동일본"
 CHI_foreign.250.a: "압박을 견뎌 낸다."
 CHI_foreign.250.d: "중국 관영 매체가 일본의 전시 행적을 겨냥한 조율된 캠페인을 개시하여 공식 야스쿠니 신사 참배, 학교 교과서 개정, 난징 대학살을 부각하고 있습니다. 반일 시위가 중국 도시들로 번지고 있으며, 도쿄는 대응해야 한다는 압박이 커지고 있습니다."
 CHI_foreign.250.t: "역사 문제를 다시 꺼낸 베이징"
 CHI_foreign.55.a: "베이징 주도의 틀을 밀어붙인다."
 CHI_foreign.55.b: "균형 잡힌 중재자로 행동한다."
 CHI_foreign.55.c: "서울의 구상에 양보한다."
 CHI_foreign.55.d: "중국이 베이징에서 긴급 외교 정상회담을 주선하여 한반도 회담을 벼랑 끝에서 되돌려 놓았습니다. 양측 모두 압박을 받으며 참석했고, 중국이 취하는 자세가 각국 수도의 이번 사건 해석을 좌우할 것입니다."
 CHI_foreign.55.t: "베이징 정상회담 개최"
 CHI_foreign.66.a: "결과에 대비한다."
 CHI_foreign.66.d: "작전은 참담하게 실패했습니다. 중국 특수부대원들이 사로잡히거나 사망했으며, 평양은 베이징이 개입했다는 증거를 발표했습니다. 지역 전체가 숨을 죽이고 있습니다."
 CHI_foreign.66.t: "새벽 작전 노출"
 CHI_foreign.67.a: "조용히 철수한다."
 CHI_foreign.67.d: "작전은 목표를 달성하지 못했지만, 평양의 보안 기관은 이 사건을 국내 반체제 인사들의 소행으로 돌렸습니다. 베이징의 역할은 아직은 확인되지 않은 채로 남아 있습니다."
 CHI_foreign.67.t: "내부 봉기로 포장된 습격 실패"
 CHI_foreign.68.a: "사태의 전개를 지켜본다."
 CHI_foreign.68.d: "작전은 수도에서의 공공연한 교전을 촉발했습니다. 충성파 조선인민군 부대와 반체제 세력이 평양의 통제권을 두고 다투는 가운데 바깥 세계가 지켜보고 있습니다."
 CHI_foreign.68.t: "불타는 평양"
 CHI_foreign.69.a: "성과를 공고히 한다."
 CHI_foreign.69.d: "작전은 성공했습니다. 친베이징 지도부가 북한에 대한 통제권을 공고히 했습니다. 한반도의 힘의 균형이 이동했습니다."
 CHI_foreign.69.t: "평양의 새 새벽"
 CHI_military_event.1.a: "시장 가치 전액으로 매각한다"
 CHI_military_event.1.b: "협조하는 장교들에게 보상한다"
 CHI_military_event.1.d: "1998년 12월까지 장쩌민의 군 사업 철수 명령은 인민해방군이 운영하는 수천 개 기업을 민간 평가와 양도 아래 놓았습니다. 부동산 부문, 무역 복합기업, 제약 공장이 감정되어 넘겨졌고, 군대는 수십 년에 걸쳐 쌓아 올린 제국을 잃었습니다. 인수인계 조건은 여전히 협상 중입니다."
 CHI_military_event.1.t: "반케 인수인계"
 CHI_military_event.10.a: "자료를 기율 검사관들에게 넘긴다"
 CHI_military_event.10.b: "조사를 묻어 버린다"
 CHI_military_event.10.d: "중앙기율검사위원회 조사관들이 군의 사업으로 부를 쌓은 중장의 자택을 급습했습니다. 2012년 구쥔산의 경우처럼 현금 상자, 마오타이 술 상자, 마오쩌둥의 금 흉상을 실어 갔습니다. 그의 윗선에 있는 연줄들은 베이징이 감히 실마리를 끌어당길지, 아니면 과거의 숱한 사건처럼 자료가 사라질지 지켜보고 있습니다."
 CHI_military_event.10.t: "드러난 한 장군의 재산"
 CHI_military_event.2.a: "민간 부문을 수확한다"
 CHI_military_event.2.b: "상부에서 지휘한다"
 CHI_military_event.2.d: "2017년 국가 전략으로 격상된 군민 융합은 중국의 민간 산업 기반과 국방 산업 기반을 가르던 벽을 허뭅니다. 대학, 국영 기업, 민간 기술 기업은 연구, 제조 능력, 공급망을 인민해방군과 공유하도록 지시받으며, 중앙군사위원회의 감독 아래 경제 전체가 이중 용도 생산 쪽으로 재편됩니다."
 CHI_military_event.2.t: "군민 융합 선언"
 CHI_military_event.4.a: "무기 시장을 쫓는다"
 CHI_military_event.4.b: "해외의 정치적 접근권을 사들인다"
 CHI_military_event.4.d: "인민해방군 총참모부의 무기 수출 자회사인 폴리 테크놀로지스는 중국제 소총, 대함 미사일, 단거리 탄도 체계를 아프리카, 중동, 중남미로 흘려보냅니다. 위장 민간 조직인 폴리 컬처는 홍콩 경매장과 해외 부동산을 통해 수익을 세탁합니다. 수익은 어떤 공식 예산에도 나타나지 않는 페이퍼 컴퍼니를 거쳐 군으로 되돌아갑니다."
 CHI_military_event.4.t: "폴리 테크놀로지스의 세계 진출"
 CHI_military_event.5.a: "희생양 몇 명을 넘긴다"
 CHI_military_event.5.b: "대오를 굳히고 감사관에 맞선다"
 CHI_military_event.5.d: "2012년 시진핑이 시작한 반부패 운동이 총후근부에 닿았습니다. 전 장교단에 걸쳐 금품 대가 승진 제도를 운영한 두 전직 중앙군사위 부주석 쉬차이허우와 궈보슝이 기소될 처지입니다. 이 파벌은 희생양을 넘기고 숨 돌릴 틈을 살지, 대오를 굳히고 베이징이 더 밀어붙이도록 도전할지 결정해야 합니다."
 CHI_military_event.5.t: "청산의 시간"
 CHI_military_event.6.a: "중국몽에 충성을 맹세한다"
 CHI_military_event.6.b: "조용한 특권을 유지한다"
 CHI_military_event.6.d: "쉬차이허우는 재판 전에 암으로 사망하고 궈보슝은 계급을 박탈당하면서, 살아남은 연줄망은 새로운 조건을 받아들입니다. 시진핑의 중국몽에 대한 요란한 충성 선언, 보여 주기식으로 넘겨진 중간급 장교 몇 명, 그리고 조용한 합의가 이루어집니다. 공공연한 약탈은 끝나지만, 병참 계약, 건설 입찰, 무기 조달을 장악한 연줄망은 더 은밀한 형태로 살아남습니다."
 CHI_military_event.6.t: "중국몽에 숙이는 고개"
 CHI_political_events.1.a: "국가적 대응을 조율한다."
 CHI_political_events.1.d: "신종 코로나바이러스가 광둥성에서 홍콩, 베트남, 캐나다, 싱가포르로 확산되었습니다. WHO는 세계 보건 경보를 발령했습니다. 광저우와 베이징의 병원은 포화 상태이며 대중의 공포는 질병 자체보다 빠르게 퍼지고 있습니다."
 CHI_political_events.1.t: "사스 유행"
 CHI_political_events.2.a: "가용한 모든 자원을 투입한다."
 CHI_political_events.2.d: "규모 7.9의 지진이 쓰촨성을 강타했으며 진앙은 원촨현 부근입니다. 6만 9천 명 이상이 사망하고 1만 8천 명이 실종 상태입니다. 최초의 충격과 이차 산사태로 도시 전체가 파괴되었습니다."
 CHI_political_events.2.t: "원촨 대지진"
 CHI_political_events.3.a: "경기를 시작하라."
 CHI_political_events.3.d: "2008년 베이징 올림픽이 오늘 개막합니다. 수년간의 준비와 전례 없는 건설 노력 끝에 중국은 세계 선수들을 국가체육장으로 맞이합니다. 개막식은 수억 명의 세계 관중을 끌어모으며 세계 무대에서 중국의 부상을 과시합니다."
 CHI_political_events.3.t: "제29회 올림피아드"
 CHI_political_events.4.a: "기술 발전을 가속한다"
 CHI_political_events.4.b: "사회 결속을 강화한다"
 CHI_political_events.4.c: "군사력을 키운다"
 CHI_political_events.4.d: "제19차 당대회가 끝나고, 당대회는 두 개의 100년 이정표에 대한 우선순위를 정합니다. 2021년까지 중산층 사회를 건설하고 2049년까지 완전한 선진 사회주의 국가를 이룬다는 것입니다. 국가의 자원이 투입되어야 합니다. 당은 어디에 에너지를 집중할 것입니까?"
 CHI_political_events.4.t: "두 개의 100년 목표"
 CHI_political_events.5.a: "퇀파이 후보를 내세운다"
 CHI_political_events.5.b: "태자당 후보를 내세운다"
 CHI_political_events.5.c: "결정을 시진핑의 손에 맡긴다"
 CHI_political_events.5.d: "승계 문제는 더 이상 탁상공론이 아닙니다. 시진핑은 권력을 공고히 했지만 당은 제도적 연속성을 요구합니다. 정치국 상무위원회는 방향을 기다리고 있습니다. 지금의 선택이 다음 세대 중국 지도부를 결정할 것입니다."
 CHI_political_events.5.t: "후계자 지명"
 CHI_political_events.50.a: "더 늙은 중국에 대비한 계획을 시작한다."
 CHI_political_events.50.d: "정점에서 약 9억 4천만 명에 달했던 중국의 생산 가능 인구가 긴 감소기에 접어들었습니다. 30년간 두 자릿수 성장을 이끈 잉여 노동력은 더 이상 늘지 않습니다. 경제학자들은 이 변화가 순환적이 아니라 구조적이라고 지적합니다. 정책 개입이 없다면 공장과 건설 현장은 금세기가 끝날 때까지 줄어드는 노동자 풀을 두고 경쟁하게 될 것입니다."
 CHI_political_events.50.t: "인구 배당 효과의 소멸"
 CHI_political_events.51.a: "청산에 직면한다."
 CHI_political_events.51.d: "2010년 제6차 전국 인구 조사는 인구학자들이 오래 경고해 온 사실을 확인해 줍니다. 60세 이상 인구 비율이 13.3퍼센트로 올랐고 중위 연령은 계속 상승하고 있습니다. 한 자녀가 부모 둘과 조부모 넷을 부양하는 4-2-1 가족 구조는 이제 중국 도시 전역에서 통계적 표준이 되었습니다. 인구 감소는 더 이상 먼 훗날의 전망이 아닙니다."
 CHI_political_events.51.t: "가속화되는 고령화를 드러낸 인구 조사"
 CHI_political_events.52.a: "더 어렵지만 더 정직한 기준선이다."
 CHI_political_events.52.d: "수년간의 경제적 부담과 정책 조정 끝에 중국은 새로운 인구학적 균형에 도달했습니다. 노동력은 더 적고 더 늙었으며 연금은 더 많은 비용이 들고 출산율은 대체 수준 아래에 머물지만, 전환기의 급격한 충격은 지나갔습니다. 이 10년을 거쳐 나온 나라는 필요에 의해 규율을 갖추었습니다. 더 날씬한 재정, 더 높은 자동화, 부유해지기 전에 늙어 버린 사회에 맞게 조정된 복지 국가입니다."
 CHI_political_events.52.t: "회색 사회 위기의 진정"
 CHI_political_events.6.a: "우리의 국민 영웅을 기린다"
 CHI_political_events.6.b: "외교적 해결을 추구한다"
 CHI_political_events.6.d: "2001년 4월 1일, 미 해군 EP-3 신호 정보 항공기가 하이난 섬 인근에서 인민해방군 공군 J-8 요격기와 충돌했습니다. 미국 승무원은 중국 영토에 비상 착륙했습니다. 베이징은 이 대치를 어떻게 관리할지 결정해야 합니다."
 CHI_political_events.6.t: "하이난 대치"
 CHI_political_events.7.a: "이 부문은 덜 발달했다 -- 단속의 타격이 크다."
 CHI_political_events.7.b: "이 부문은 혼란은 겪지만 붕괴하지 않고 단속을 흡수한다."
 CHI_political_events.7.c: "이 부문의 규모가 충격을 완화한다."
 CHI_political_events.7.d: "마윈이 와이탄 서밋에서 국영 은행을 전당포에 비유한 연설은 규제 당국에 그들이 기다려 온 빌미를 줍니다. 증감회와 시장감독총국은 상장 며칠 전 앤트 그룹의 IPO를 중단시킵니다. 반독점 조사관들은 알리바바를 상대로 절차를 개시합니다. 사이버공간관리국은 뉴욕 상장 이후 디디에 대한 국가 안보 심사에 착수합니다. 플랫폼 부문은 국가와의 관계가 근본적으로 재편되는 국면을 맞습니다."
 CHI_political_events.7.e: "이 부문은 규제를 구조적 안정으로 바꿀 만큼 성숙했다."
 CHI_political_events.7.t: "빅테크 단속"
 CHI_political_events.8.a: "컴퓨팅 부문에 대한 자금 지원을 이어 간다"
 CHI_political_events.8.d: "과학기술로 나라를 부흥시킨다는 전략 지침에 따라 국가가 후원하는 기관들은 차세대 컴퓨팅과 인터넷 기반시설에 대한 투자를 가속하고 있습니다. 대학 연구실에서 경제특구에 이르기까지 중국의 디지털 토대가 앞으로 수십 년을 위해 놓이고 있습니다."
 CHI_political_events.8.t: "과학기술을 통한 혁신 추진"
 CHI_sco.1.a: "그들의 관심을 환영한다."
 CHI_sco.1.b: "이 지위를 부여할 수 없다."
 CHI_sco.1.d: "[FROM.GetNameWithFlag]이(가) 상하이 협력 기구 옵서버 지위에 대한 공식 신청서를 제출했습니다. 우리는 그 요청을 승인할지 결정해야 합니다."
 CHI_sco.1.t: "SCO 옵서버 신청"
 CHI_sco.10.a: "우리는 중국 편에 선다."
 CHI_sco.10.b: "우리는 중국의 야망에 얽매이지 않는다."
 CHI_sco.10.c: "중립을 유지한다."
 CHI_sco.10.d: "중국은 우리가 SCO 내 자국 세력에 대한 배타적 충성을 선언하라고 요구하여, 베이징과 모스크바 중 하나를 선택하도록 강요하고 있습니다."
 CHI_sco.10.t: "충성을 요구하는 중국"
 CHI_sco.11.a: "지원에 감사한다."
 CHI_sco.11.d: "[FROM.GetNameWithFlag]이(가) SCO 협력 체계의 일환으로 우리의 경제 현대화를 뒷받침하는 개발 지원을 제공하고 있습니다."
 CHI_sco.11.t: "SCO 개발 지원"
 CHI_sco.2.a: "그들은 정회원이 될 자격을 입증했다."
 CHI_sco.2.b: "이 신청을 지지할 수 없다."
 CHI_sco.2.d: "[FROM.GetNameWithFlag]이(가) 상하이 협력 기구 정회원 가입을 위한 공식 신청서를 제출했습니다."
 CHI_sco.2.t: "SCO 회원국 신청"
 CHI_sco.20.a: "정치적 자본을 투입하여 신뢰를 회복한다."
 CHI_sco.20.b: "우리에게는 더 시급한 문제가 있다."
 CHI_sco.20.d: "상하이 협력 기구의 내부 결속력이 우려스러운 수준으로 떨어졌습니다. 여러 회원국이 기구의 방향성에 의문을 제기했으며, 개입이 없다면 협력이 더욱 악화될 수 있습니다."
 CHI_sco.20.t: "SCO의 방향에 의문을 제기하는 회원국들"
 CHI_sco.21.a: "지금이 우리의 때이다."
 CHI_sco.21.d: "상하이 협력 기구가 번영하고 있습니다. 회원국들은 전례 없는 수준의 협력을 보고하고, 공동 사업은 성과를 내고 있으며, 기구의 국제적 위상은 그 어느 때보다 높습니다."
 CHI_sco.21.t: "협력의 황금기"
 CHI_sco.22.a: "우리의 우위를 밀어붙인다."
 CHI_sco.22.b: "긴장을 완화해야 한다."
 CHI_sco.22.d: "상하이 협력 기구 내에서 우리의 지배력이 커지고 있는 것이 간과되지 않았습니다. 러시아의 축소된 역할은 갈수록 마찰의 원인이 되고 있으며, 모스크바는 외교 경로를 통해 불쾌감을 드러내기 시작했습니다."
 CHI_sco.22.t: "SCO에서 소외된 러시아"
 CHI_sco.23.a: "우리의 입지를 다시 세워야 한다."
 CHI_sco.23.b: "어쩌면 이것이 최선일지도 모른다."
 CHI_sco.23.d: "SCO 내 러시아의 영향력이 커져 우리의 주도적 위치마저 의문시되는 수준에 이르렀습니다. 모스크바가 점점 더 의제를 정하고 있으며, 조치를 취하지 않으면 우리가 만든 기구에서 조연으로 밀려날 위험이 있습니다."
 CHI_sco.23.t: "주도권을 잃은 중국"
 CHI_sco.3.a: "우리 군은 그들의 군대와 함께 훈련할 기회를 환영할 것이다."
 CHI_sco.3.b: "[FROM.GetName]와(과)의 협력은 현재로서는 실현 불가능하다."
 CHI_sco.3.d: "[FROM.GetNameWithFlag]이(가) SCO 틀 안에서 합동 군사 훈련을 실시할 것을 제안했습니다. 이는 양국 군대 간 안보 협력을 강화할 것입니다."
 CHI_sco.3.t: "합동 군사 훈련 초청"
 CHI_sco.30.a: "사업을 승인한다."
 CHI_sco.30.b: "지금은 적절한 때가 아니다."
 CHI_sco.30.d: "[FROM.GetNameWithFlag]이(가) SCO 전역을 아우르는 통합 에너지 그리드의 건설을 제안했습니다. 주요 회원국으로서 우리는 이 야심 찬 기반시설 사업을 승인할지 결정해야 합니다."
 CHI_sco.30.t: "SCO 에너지 그리드 제안"
 CHI_sco.31.a: "사업을 승인한다."
 CHI_sco.31.b: "이에 약속할 수 없다."
 CHI_sco.31.d: "[FROM.GetNameWithFlag]이(가) SCO 경제를 연결하는 대륙 횡단 철도망을 제안했습니다. 상당한 투자가 필요하겠지만 기구 전체의 무역을 바꿔 놓을 수 있습니다."
 CHI_sco.31.t: "유라시아 횡단 철도 제안"
 CHI_sco.32.a: "은행 설립을 승인한다."
 CHI_sco.32.b: "조건이 유리하지 않다."
 CHI_sco.32.d: "[FROM.GetNameWithFlag]이(가) SCO 틀 아래 다자 개발은행을 설립할 것을 제안했습니다. 이 기관은 회원국 전역의 기반시설과 개발에 자금을 댈 것입니다."
 CHI_sco.32.t: "SCO 개발은행 제안"
 CHI_sco.33.a: "네트워크를 승인한다."
 CHI_sco.33.b: "이에 대해 우려가 있다."
 CHI_sco.33.d: "[FROM.GetNameWithFlag]이(가) SCO 회원국을 아우르는 통합 방공망을 제안했습니다. 레이더 탐지 범위의 공유와 조율된 미사일 방어는 집단 안보를 강화할 것입니다."
 CHI_sco.33.t: "SCO 공동 방공 제안"
 CHI_sco.34.a: "창립 회원국이 된 것이 자랑스럽다."
 CHI_sco.34.d: "베이징이 오랫동안 논의되어 온 상하이 파이브의 본격적인 정부 간 기구로의 전환을 공식화했습니다. 제안된 상하이 협력 기구는 중국 및 지역 이웃 국가들과의 정치, 안보, 경제 관계를 심화할 것이며, 우리는 첫날부터 창립 회원국입니다."
 CHI_sco.34.t: "중국의 상하이 협력 기구 제안"
 CHI_sco.4.a: "훈련을 시작하라."
 CHI_sco.4.d: "[FROM.GetNameWithFlag]이(가) 합동 군사 훈련 초청을 수락했습니다."
 CHI_sco.4.t: "합동 훈련 수락"
 CHI_sco.5.a: "그들의 손해이다."
 CHI_sco.5.d: "[FROM.GetNameWithFlag]이(가) 합동 군사 훈련 초청을 거절했습니다."
 CHI_sco.5.t: "합동 훈련 거부"
 CHI_sco.6.a: "이 훈련은 전쟁 준비처럼 의심스럽게 보인다."
 CHI_sco.6.b: "이 훈련에서 두려워할 것은 테러리스트와 극단주의자뿐이다."
 CHI_sco.6.c: "주시할 만한 흥미로운 전개이다."
 CHI_sco.6.d: "상하이 협력 기구가 회원국 군대가 참여하는 대규모 군사 훈련을 개시했습니다."
 CHI_sco.6.t: "SCO의 대규모 군사 훈련 개시"
 CHI_sco.7.a: "중국의 세력권이 계속 확대되고 있다."
 CHI_sco.7.b: "다자 외교에 좋은 날이다."
 CHI_sco.7.d: "[FROM.GetNameWithFlag]이(가) 상하이 협력 기구의 정회원으로 공식 승인되었습니다."
 CHI_sco.7.t: "[FROM.GetNameWithFlag]의 SCO 가입"
 CHI_sco.8.a: "중국의 공격성이 또 하나의 파트너를 멀어지게 했다."
 CHI_sco.8.b: "국제 협력에 유감스러운 후퇴이다."
 CHI_sco.8.d: "[FROM.GetNameWithFlag]이(가) 조정할 수 없는 의견 차이를 이유로 상하이 협력 기구 탈퇴를 발표했습니다."
 CHI_sco.8.t: "[FROM.GetNameWithFlag]의 SCO 탈퇴"
 CHI_sco.9.a: "중국은 주목받는 자리를 나누려 하지 않는다."
 CHI_sco.9.d: "중국이 상하이 협력 기구에 대한 지배력을 확고히 주장하며 러시아를 소외시키고 스스로를 블록의 의심할 여지 없는 주도 강국으로 자리매김했습니다."
 CHI_sco.9.t: "공고해진 중국의 SCO 통제권"
 CHI_semiconductor_events.1.d: "미국이 수출 통제를 첨단 반도체 장비, EDA 소프트웨어, 고대역폭 메모리 부품까지 확대했습니다. 유럽, 일본, 한국의 동맹 정부들은 통제를 강화하기 위해 수출 허가를 조율했습니다. 이 기술 금수는 중국이 첨단 로직 및 메모리 생산의 격차를 좁히지 못하도록 하려는 워싱턴의 결의를 반영합니다."
 CHI_semiconductor_events.1.o1: "어쨌든 우리는 앞으로 나아간다."
 CHI_semiconductor_events.1.t: "서방의 반도체 보이콧"
 CHI_semiconductor_events.2.a: "성과를 과시한다"
 CHI_semiconductor_events.2.b: "조용히 하고 생산 능력을 비축한다"
 CHI_semiconductor_events.2.d: "화웨이가 국산 기린 9000S 시스템 온 칩을 탑재한 메이트 60 프로를 출시했습니다. 분해 분석은 SMIC가 7nm급 N+2 공정으로 이 SoC를 제조했음을 확인해 줍니다. 이 돌파구는 수출 통제로 우리가 얼마나 뒤처졌는지에 대한 대중의 통념을 다시 쓰게 합니다."
 CHI_semiconductor_events.2.t: "메이트 60의 충격"
 CHI_semiconductor_events.3.a: "엠피리언에 의존한다"
 CHI_semiconductor_events.3.b: "버티며 회색 경로로 우회한다"
 CHI_semiconductor_events.3.d: "2025년 5월 미국 산업안보국의 개정안은 우리를 EDA 도구의 제한 대상 지역으로 지정합니다. 시높시스와 케이던스는 필수 허가 신청을 제출합니다. 허가 거부는 몇 주 안에 뒤따를 것입니다. 이제 국내 도구가 모든 첨단 설계를 테이프아웃까지 책임져야 합니다."
 CHI_semiconductor_events.3.t: "우리를 차단한 시높시스와 케이던스"
 CHI_semiconductor_events.4.a: "국내 AI 기업과 인증을 추진한다"
 CHI_semiconductor_events.4.b: "HBM을 러시아와 이란에 수출한다"
 CHI_semiconductor_events.4.d: "창신 메모리 테크놀로지스의 허페이 공장이 공개된 2026년 목표보다 꼬박 1년 앞서 HBM2 스택 양산을 시작했습니다. 첫 인증 샘플은 이미 캄브리콘과 비렌에 전달되었습니다. 국산 AI 가속기 제작은 더 이상 외국산 메모리라는 병목을 넘을 필요가 없습니다."
 CHI_semiconductor_events.4.t: "일정보다 앞선 CXMT HBM2"
 CHI_semiconductor_events.5.a: "칩 통제를 완화한다"
 CHI_semiconductor_events.5.b: "수출 통제 노선을 고수한다"
 CHI_semiconductor_events.5.d: "중국은 희토류와 갈륨 수출에 대한 지속적인 접근을 반도체 수출 통제 완화와 연계했습니다. 서방의 자석 및 칩 기판 공급망이 중국의 정제에 의존하는 만큼, 베이징은 지렛대가 양방향으로 작용한다는 데 걸고 있습니다. 이 제안은 직접적인 거래로 우리 앞에 놓입니다. 칩 금수를 완화하는 대신 핵심 광물을 계속 공급받는 것입니다."
 CHI_semiconductor_events.5.t: "베이징의 희토류 제안"
 CHI_semiconductor_events.6.a: "국내 증산을 가속한다"
 CHI_semiconductor_events.6.d: "워싱턴은 희토류 공급 보장의 대가로 성숙 공정 장비 및 설계 소프트웨어에 대한 허가 승인을 조용히 확대했습니다. 이 유예는 부분적이고 되돌릴 수 있지만, 금수의 전면적인 무게 없이 남은 격차를 메울 시간을 우리 파운드리에 벌어 줍니다."
 CHI_semiconductor_events.6.t: "통제 완화"
 CHI_semiconductor_events.7.a: "후퇴를 받아들인다"
 CHI_semiconductor_events.7.d: "워싱턴은 칩에서 양보하면 가장 강력한 지렛대를 잃는다고 계산하여 연계를 단호히 거부했습니다. 수출 통제는 유지되며 이 제안에 쓴 정치적 자본은 사라졌습니다. 자립만이 우리에게 열려 있는 유일한 길입니다."
 CHI_semiconductor_events.7.t: "회담 결렬"
 CHI_space_events.1.a: "온 나라의 눈이 우리에게 쏠려 있다."
 CHI_space_events.1.d: "원창 우주 발사장에서 창정 10호가 연기와 불꽃의 기둥을 타고 솟아올라, 멍저우 유인 우주선과 우주비행사 세 명을 달 전이 궤도 진입 지점으로 실어 나릅니다. 전국의 모든 텔레비전이 상승 장면을 방송합니다. 세계가 지켜보고 있습니다."
 CHI_space_events.1.t: "달을 향해 이륙한 창정 로켓"
 CHI_space_events.10.a: "위성 및 추적 네트워크에 전액 자금을 지원한다"
 CHI_space_events.10.b: "절제된 속도로 진행한다"
 CHI_space_events.10.d: "창어 계획이 달 표면 착륙에 확정된 상황에서, 국무원은 지원 기반시설에 자금을 어떻게 댈지 저울질하고 있습니다. 첫 번째 문제는 위성 및 추적 네트워크입니다. 38만 킬로미터에 걸쳐 승무원과 교신을 유지하는 췌차오 중계위성과 심우주 안테나입니다. 지금 전액을 지원하거나, 비용을 분산하고 절제된 속도로 진행할 수 있습니다."
 CHI_space_events.10.t: "달로 가는 길에 대는 자금"
 CHI_space_events.11.a: "창정 10호 개발을 가속한다"
 CHI_space_events.11.b: "계획된 일정을 고수한다"
 CHI_space_events.11.d: "대형 발사체 없이는 유인 달 탐사 임무가 불가능합니다. 창정 10호는 멍저우 유인 우주선과 란웨 착륙선을 별도 비행으로 달을 향해 쏘아 올리도록 설계되었습니다. 개발을 앞당기는 데는 많은 비용이 들지만, 한 달을 줄일 때마다 착륙은 가까워집니다."
 CHI_space_events.11.t: "대형 발사체 문제"
 CHI_space_events.12.a: "기술자들을 신뢰한다"
 CHI_space_events.12.d: "절제된 경로는 계획의 비용 부담을 낮추고 정치적으로 안전하게 유지합니다. 중국운반로켓기술연구원의 기술자들은 지속 가능한 속도로 인증 시험 과정을 밟아 가며, 인내가 발사대에서 보상받으리라 확신하고 있습니다."
 CHI_space_events.12.t: "꾸준한 발사 주기"
 CHI_space_events.13.a: "보상을 거둔다"
 CHI_space_events.13.d: "지난 몇 년간의 자금 지원 결정이 결실을 맺습니다. 추적 안테나가 가동되고, 엔진은 인증 연소 시험을 통과하며, 달 탐사 구조가 모습을 갖춥니다. 선견지명의 배당금을 이제 꺼내 쓸 수 있습니다."
 CHI_space_events.13.t: "무르익는 투자"
 CHI_space_events.2.a: "중국 인민에게 위대한 도약이다."
 CHI_space_events.2.d: "란웨 착륙선이 달 남극 지역에 착륙합니다. 임무 사령관이 해치를 열고 사다리를 내려갑니다. 10억 청취자에게 생중계된 그의 첫마디는 이러했습니다. 우리는 도착했고, 우리는 머물 것이다. 중국이 달에 도달했습니다."
 CHI_space_events.2.t: "달에 발을 디딘 우주비행사"
 CHI_space_events.20.a: "국가의 승리"
 CHI_space_events.20.b: "우리 산업의 승리"
 CHI_space_events.20.c: "우리 과학의 승리"
 CHI_space_events.20.d: "우주비행사들이 달 위를 걷고 귀환했습니다. 한때 로켓을 수입하던 나라가 다른 세계에 깃발을 꽂았습니다. 이제 지도부는 이 성취에 어떤 지속적인 의미를 부여할지 결정해야 합니다. 국가적 위신, 산업적 위력, 과학적 야망, 혹은 군사적 자신감입니다. 달의 배당금이 앞으로 수십 년을 좌우할 것입니다."
 CHI_space_events.20.e: "우리 결의의 승리"
 CHI_space_events.20.t: "달 착륙의 유산"
 chi_uighur.1.a: "진압 경찰로 해산시킨다"
 chi_uighur.1.b: "협상을 위해 당 관리를 파견한다"
 chi_uighur.1.c: "대규모 체포, 외국 선동가 탓으로 돌린다"
 chi_uighur.1.d: "한족 주민과 위구르 노동자 사이의 사건 이후 시위대가 우루무치 거리로 나섰습니다. 진압 경찰이 중심 구역을 봉쇄했지만 군중은 늘어나고 있습니다. 신장의 당 위원회는 베이징의 지시를 기다리고 있습니다."
 chi_uighur.1.t: "우루무치 거리 시위"
 chi_uighur.2.a: "감시 국가를 확대한다"
 chi_uighur.2.b: "지역 사회 접촉과 경제 원조"
 chi_uighur.2.c: "범인들을 공개 처형한다"
 chi_uighur.2.d: "붐비는 시장 구역에 대한 조직적인 폭탄 공격으로 사상자가 발생했고 도시의 일상 감각이 산산조각 났습니다. 동투르키스탄 이슬람 운동이 책임을 주장했습니다. 보안군은 고도 경계 태세에 들어갔고 베이징은 신속한 대응을 요구하고 있습니다."
 chi_uighur.2.t: "우루무치 시장에 폭탄 공격"
 chi_uighur.3.a: "우루무치에 계엄령을 선포한다"
 chi_uighur.3.b: "대규모 구금, \\"재교육\\" 수용소"
 chi_uighur.3.c: "위구르 지역 사회 지도자들과 협상한다"
 chi_uighur.3.d: "수개월간 쌓여 온 긴장이 우루무치와 여러 외곽 구역 전역에서 공공연한 폭력으로 번졌습니다. 위구르 시위대와 한족 주민 사이의 충돌이 지역 경찰의 역량을 넘어섰습니다. 2009년 폭동을 연상시키는 소요의 규모는 당 중앙의 즉각적인 결정을 요구합니다."
 chi_uighur.3.t: "대규모 폭동으로 폭발한 신장"
 chi_uighur.4.a: "내정에 대한 모든 간섭을 거부한다"
 chi_uighur.4.b: "제한적인 UN 사실 조사 방문을 허용한다"
 chi_uighur.4.d: "신장에서의 대규모 구금과 재교육 시설 설립에 대한 보도는 서방 정부, 튀르키예, 국제 인권 기구의 날카로운 규탄을 불러일으켰습니다. 독립적인 조사를 요구하는 목소리가 커지고 있으며 여러 수도가 징벌적 조치를 위협하고 있습니다."
 chi_uighur.4.t: "베이징을 규탄하는 국제 사회"
 chi_uighur.5.a: "조용한 작전, 완전한 와해"
 chi_uighur.5.d: "보안 기관이 신장 전역에서 공격을 계획하던 무장 조직 세포를 식별하고 위치를 파악하는 데 성공했습니다. 정확한 정보에 따라 조용한 작전이 벌어져 조직망이 공격에 나서기 전에 와해되었습니다."
 chi_uighur.5.t: "대테러 정보 돌파구"
 chi_uighur.6.a: "단호한 대응이 질서를 회복할 것이다"
 chi_uighur.6.b: "베이징의 철권"
 chi_uighur.6.d: "중국 신장 지역 전역에서 폭력적 소요가 발생했습니다. 불타는 차량과 완전 진압 장비를 갖춘 보안군의 영상이 국제적으로 퍼지고 있습니다. 베이징은 질서가 회복될 것이라고 선언했지만, 소요의 규모는 전 세계 정부와 관측통의 이목을 끌고 있습니다."
 chi_uighur.6.t: "신장을 뒤흔든 폭동"
 china_national_committee.02.a: "위원회를 선출한다"
 china_national_committee.02.d: "중국 공산당 전국대표대회가 소집되었습니다. 전국에서 모인 대표들이 향후 5년의 정치적 방향을 정하기 위해 모였습니다. 가장 중요한 위원회들과 그 지도부가 이제 선출될 것입니다."
 china_national_committee.02.t: "전국대표대회 소집"
 china_news.44.a: "70년 분단의 종식이다."
 china_news.44.d: "중미 공동 최후통첩 이후 북한 정부가 평화적으로 해체되고 주권을 대한민국에 이양했습니다. 한반도는 서울의 깃발 아래 다시 하나가 되었습니다. 김씨 왕조는 전쟁 없이 막을 내렸습니다."
 china_news.44.t: "한반도, 서울 아래 재통일"
 china_news.45.a: "마지막 한국 전쟁이 시작된다."
 china_news.45.d: "평양이 중미 공동 최후통첩을 거부한 후, 중국, 미국, 한국이 북한에 선전포고했습니다. 역사상 처음으로 베이징과 워싱턴이 함께 김 정권을 향해 진군합니다."
 china_news.45.t: "북한에 대한 선전포고"
 china_news.boycott_streets.a: "유념한다."
 china_news.boycott_streets.d: "반일 시위가 소셜 미디어에서 거리로 번졌습니다. 자동차 대리점은 문을 닫고, 유니클로 매장은 창문을 판자로 막았으며, 도요타 재고는 팔리지 않고 있습니다. 정부는 개입하지 않았습니다."
 china_news.boycott_streets.t: "중국 도시들로 확산되는 불매 운동"
 china_news.panda_arrives_tokyo.a: "유념한다."
 china_news.panda_arrives_tokyo.d: "중화인민공화국이 선물한 자이언트 판다 두 마리가 나리타 공항에 도착해 대단한 대중적 열광을 불러일으켰습니다. 이 제스처는 중일 관계의 따뜻한 시기를 알리는 외교적 약호입니다."
 china_news.panda_arrives_tokyo.t: "나리타에 도착한 판다"
 china_news.yasukuni_recall.a: "유념한다."
 china_news.yasukuni_recall.d: "일본 총리의 야스쿠니 신사 참배에 따라 중국이 도쿄 주재 대사를 소환했습니다. 이 외교적 항의는 일본이 전몰자를 기리는 방식에 책임을 묻겠다는 베이징의 결의를 보여 줍니다."
 china_news.yasukuni_recall.t: "베이징의 대사 소환"
 china_sar.034.a: "즉각적인 보안 단속을 명령한다."
 china_sar.034.b: "먼저 조사하고 지역 지도자들과 접촉한다."
 china_sar.034.d: "타림 분지의 한 검문소에 조직적인 공격이 가해져 경찰과 민간인 사상자가 발생했습니다. 베이징은 불안정한 지역에서 즉각적인 보안 단속과 더딘 조사 중심 대응 중 하나를 선택해야 합니다."
 china_sar.034.t: "신장 공격 사건"
 china_scs.10.a: "확전을 유념한다."
 china_scs.10.d: "정보 보고는 중국이 분쟁 중인 남중국해 지형을 둘러싸고 어선단, 해상 민병대, 해안경비대 순시선, 호위함을 동심원 형태로 조율하여 배치하고 있다고 설명합니다. 장자오중 해군 소장의 이름으로 알려진 이 교리는 포위가 완성될 즈음에는 법적 이의를 제기할 여지를 남기지 않습니다. 이 지역에서 우리의 영유권 주장과 이익은 이제 직접적인 압박을 받고 있습니다."
 china_scs.10.t: "베이징의 배추 전략 채택"
 china_scs.12.a: "결과를 받아들인다."
 china_scs.12.d: "대치 작전이 결말에 이르렀습니다. 그 결과가 이 지형의 실질적 통제와 중국이 감수해야 할 외교적 비용을 결정합니다."
 china_scs.12.t: "대치 종료"
 china_scs.13.a: "즉시 항행의 자유 작전을 개시한다."
 china_scs.13.b: "당분간 자제한다."
 china_scs.13.d: "국무부가 공식 외교 항의를 발표했고 국방부는 선택지를 저울질하고 있습니다. 인공섬의 12해리 구역을 통과하는 항행의 자유 작전이 가장 유력한 즉각 대응입니다. 제7함대는 경계 태세입니다."
 china_scs.13.t: "중국의 잠식에 대한 워싱턴의 대응"
 china_scs.14.a: "물러난다. 요격하지 않는다."
 china_scs.14.b: "함정을 따라붙고 항의한다."
 china_scs.14.c: "요격하고 최후 경고를 보낸다."
 china_scs.14.d: "미 해군 함정 한 척이 중국 인공섬 시설 중 한 곳 주변의 12해리 구역에 진입했습니다. 남해함대는 명령을 기다리고 있습니다. 물러서면 묵인으로 읽힐 것이며, 따라붙는 것은 확전 없이 존재감을 유지하고, 적극적인 요격은 심각한 사건의 위험을 안고 있습니다."
 china_scs.14.t: "항행의 자유 작전에 대한 인민해방군 해군의 대응"
 china_scs.15.a: "공식 항의를 제기하고 보상을 요구한다."
 china_scs.15.b: "안전보장이사회 긴급 회의를 소집한다."
 china_scs.15.d: "항행의 자유 작전이 해상 충돌 혹은 대치로 끝났습니다. 양측은 일어난 일에 대해 상반된 설명을 내놓고 있습니다. 국제 언론은 전면적인 조사를 요구하고 있으며, 양국 국내 여론은 단호한 대응을 촉구하고 있습니다."
 china_scs.15.t: "남해 사건"
 china_scs.20.a: "남해의 하늘은 중국의 것이다."
 china_scs.20.d: "베이징이 남중국해를 포괄하는 방공식별구역의 설정을 발표했습니다. 이 구역에 진입하는 모든 항공기는 식별 신호를 송신하고, 무선 연락을 유지하며, 중국 항공 관제의 지시를 따라야 합니다. 미국, 일본, 오스트레일리아, 필리핀은 즉시 이 방공식별구역이 국제법상 불법이라고 선언했습니다."
 china_scs.20.t: "남중국해 방공식별구역 선포"
 china_scs.21.a: "외교 경로를 통해 엄중한 경고를 보낸다."
 china_scs.21.b: "호위하여 내보내고 성명을 발표한다."
 china_scs.21.d: "인민해방군 공군 요격기가 중국의 식별 절차를 따르지 않고 남중국해 순찰 구역을 통과하던 외국 군용기와 접촉했습니다. 해당 항공기는 호위되거나 제지되었으며, 베이징이 이 사건에 어떻게 대응하느냐가 순찰 구역의 집행 신뢰성과 해당 항공기 본국과의 관계 온도를 모두 좌우합니다."
 china_scs.21.t: "외국 항공기 요격"
 china_scs.30.a: "새로운 틀에 응한다."
 china_scs.30.d: "베이징은 남중국해 관여를 명나라 보선단의 정신으로, 즉 대결이 아닌 무역, 동반자 관계, 양자 대화를 통해 수행하겠다고 발표했습니다. 해상 실크로드 틀이 모든 연안국에 공식 확대됩니다. 근본적인 영유권 주장이 변하지 않았더라도, 긴장 완화의 여지는 실재합니다."
 china_scs.30.t: "베이징의 해양 외교 추구"
 china_scs.31.a: "건설적인 진전이다."
 china_scs.31.d: "베이징에서 열린 양자 회담 이후 발표된 공동 성명에서 중국과 남중국해 이웃 국가들은 2002년 당사국 행동선언에 대한 약속을 재확인했습니다. 성명은 분쟁을 양자 협의를 통해 평화적으로 관리할 것을 촉구하고 일방적 도발에 반대하는 서약을 갱신했으며, 베이징은 이 표현이 자국의 기존 주둔을 제외하는 것으로 해석합니다."
 china_scs.31.t: "2002년 선언 재확인"
 china_scs.32.a: "마닐라를 새로운 동반자 관계에 환영한다."
 china_scs.32.b: "기존의 미국과의 연대를 유지한다."
 china_scs.32.d: "두테르테 대통령이 베이징에서 필리핀의 미국으로부터의 \\"결별\\"을 선언하고 중국과의 새로운 관계에 대한 개방성을 시사하는 연설을 했습니다. 이 발언은 워싱턴을 아연실색하게 하고 베이징을 기쁘게 했습니다. 남중국해 중재 판정에 대한 마닐라의 입장은 이제 의도적으로 모호해졌습니다."
 china_scs.32.t: "기로에 선 마닐라"
 china_scs.33.a: "지역 안정을 향한 한 걸음이다."
 china_scs.33.d: "인민일보는 중국과 그 파트너가 탄화수소 탐사와 어업권을 위한 공동 행정 체계를 수립하는 공동 해양 개발 협정을 체결했다고 보도합니다. 이 협정은 \\"상생 협력의 모범이자 해상 실크로드의 실천\\"으로 묘사됩니다. 협정에 참여하지 않은 영유권 주장국 정부들은 논평을 거부합니다."
 china_scs.33.t: "공동 해양 개발 협정 체결"
 china_scs.34.a: "유예 기간을 제시하고 재협상한다."
 china_scs.34.b: "원래 조건을 이행하도록 한다."
 china_scs.34.c: "양보를 대가로 부채를 탕감한다."
 china_scs.34.d: "파트너 국가의 정부는 중국의 일대일로 기반시설 금융에 대한 예정된 대출 상환을 이행할 수 없다고 발표했습니다. 국내 야당 정치인들은 조건 재협상을 요구하고 있으며, 베이징은 관계를 지키는 유연성과 금융 선례를 지키는 단호함 사이에서 선택해야 합니다."
 china_scs.34.t: "부채 재협상 요구"
 china_scs.35.a: "외교적 승리이다."
 china_scs.35.d: "처음으로 아세안 정상회의 공동 성명에 남중국해 분쟁의 양자 관리를 명시적으로 지지하고 \\"역외 당사자\\"의 개입을 배격하는 문구가 포함되었습니다. 이 표현은 중국의 고집으로 삽입되었으며 베트남과 필리핀이 요구한 문구의 채택을 막았습니다. 워싱턴은 이 결과를 규탄했습니다."
 china_scs.35.t: "중국의 입장을 지지한 아세안 정상회의"
 china_scs.36.a: "조건을 재협상한다."
 china_scs.36.b: "원래 조건을 이행하도록 한다."
 china_scs.36.c: "대출을 회수한다."
 china_scs.36.d: "파트너 국가의 국내 야권 인사들과 시민 사회 단체들이 불리한 이자 조건, 환경 문제, 전략적 의존에 대한 우려를 들어 중국의 일대일로 대출에 반대하는 공개 캠페인을 시작했습니다. 정부는 재협상하라는 압박을 받고 있으며, 베이징은 금융 선례를 지킬 것인가 정치적 관계를 유지할 것인가 사이에서 선택해야 합니다."
 china_scs.36.t: "부채 반발"
 china_scs.40.a: "중국 초안의 전면 수용을 밀어붙인다."
 china_scs.40.b: "합의 서명을 위해 타협을 수용한다."
 china_scs.40.d: "남중국해 행동준칙 협상이 마지막 라운드에 들어섰습니다. 중국 초안은 강제적 분쟁 해결을 배제하고, 중국이 건설을 진행 중인 지역을 제외하도록 지리적 범위를 제한하며, 비아세안 국가가 어떠한 감독 역할도 맡지 못하게 막습니다. 영유권 주장국들은 결함 있는 합의를 수용할 것인가, 합의 없이 무기한 계속할 것인가를 두고 갈립니다."
 china_scs.40.t: "행동준칙 협상: 마지막 라운드"
 china_scs.41.a: "지역이 목소리를 냈다."
 china_scs.41.d: "국무부는 아세안-중국 남중국해 행동준칙의 발효를 인정하는 성명을 발표했습니다. 성명은 여러 조항에 대한 미국의 반대를 언급하면서도 이 합의를 지역의 규율 체계로 인정합니다. 분석가들은 이를 유엔해양법협약을 유일한 체계로 삼아 온 미국의 오랜 고집으로부터의 상당한 후퇴로 평가합니다."
 china_scs.41.t: "행동준칙을 인정하는 워싱턴"
 china_scs.50.a: "대응을 준비한다."
 china_scs.50.d: "국가의 승인을 받은 것으로 보이며 외교 경로를 통해 배포된 인민일보 사설은 사해라는 고전적 관념을 들어 중국의 해양 주장을 중단된 자연 질서의 회복으로 규정합니다. 이에 수반된 해군 확장 발표는 베이징의 의도를 의심할 여지 없게 합니다. 서태평양의 1945년 이후 해양 질서는 이제 공공연히 도전받고 있습니다."
 china_scs.50.t: "바다의 천명을 주장하는 베이징"
 china_scs.51.a: "그들의 항의를 유념한다."
 china_scs.51.b: "우려를 줄이기 위해 해명 성명을 낸다."
 china_scs.51.d: "중국의 조공 체제 공식 언급은 극명하게 엇갈리는 반응을 낳았습니다. 아세안 외교장관들은 역사적 종주권에 대한 어떠한 주장도 거부하는 긴급 공동 성명을 발표했습니다. 미국, 일본, 오스트레일리아는 조율된 외교적 대응을 발표했습니다. 중국 내에서 관영 매체는 이 반응들을 국가적 존엄의 회복이 백년국치로 이익을 본 이들을 불편하게 한다는 증거로 보도했습니다."
 china_scs.51.t: "조공 수사에 대한 세계의 반응"
 china_scs.52.a: "중국의 권위를 인정한다."
 china_scs.52.b: "최후통첩을 거부한다."
 china_scs.52.d: "중국 대사가 72시간 이내에 분쟁 중인 남중국해 수역에 대한 중국의 행정 권한을 인정하라는 공식 최후통첩을 전달했습니다. 정부는 이제 결정해야 합니다. 조건을 수락하고 관계를 지킬 것인가, 거부하고 그 결과를 감수할 것인가."
 china_scs.52.t: "최후통첩 전달"
 china_scs.53.a: "공동 최후통첩을 발표한다."
 china_scs.53.b: "외교적 항의만 한다."
 china_scs.53.c: "개입하지 않는다."
 china_scs.53.d: "베이징이 이에 응하기를 거부한 남중국해 영유권 주장국에 최후통첩을 발표했습니다. 워싱턴은 선택에 직면했습니다. 중국에 대한 공동 최후통첩에 동참하여 안보 공약을 이행하거나, 관계를 지키는 공식 항의에 그치거나, 전적으로 개입하지 않는 것입니다. 이 결정은 해군 대비 태세, 동맹의 신뢰성, 그리고 행정부가 6천 4백 킬로미터 떨어진 수역의 분쟁에 정치적 자본을 얼마나 쓰려 하는가에 달려 있습니다."
 china_scs.53.t: "남중국해 위기"
 china_scs.54.a: "따르고 철수한다."
 china_scs.54.b: "거부한다. 그들이 중국에 지시할 수는 없다."
 china_scs.54.d: "미국이 영유권 주장국과 함께 베이징에 분쟁 지형에서 병력을 철수하고 최후통첩을 철회하라는 공식 요구를 제시했습니다. 제7함대는 고도의 대비 태세에 있습니다. 따르는 것은 후퇴를 의미하고, 거부하는 것은 미국과 그 지역 파트너들의 합동 해군력과 맞서는 것을 의미합니다. 정치국 상무위원회가 소집되었습니다."
 china_scs.54.t: "워싱턴의 최후통첩"
 china_scs.55.a: "오래도록 그러하기를."
 china_scs.55.d: "남중국해 인민해군 시설에서 온 보고는 함대 전반의 다양한 분위기를 전합니다. 융수 초에서는 수병들이 이제 해도에 고향으로 표시된 바다 위로 떠오르는 일출을 촬영합니다. 항공모함에서는 승조원들이 훈련을 준비합니다. 스카버러의 해안경비 기지에서는 당직 장교가 90일 동안 어떤 외국 선박도 접근 금지선에 다가오지 않았다고 기록합니다. 남해는 평온합니다."
 china_scs.55.t: "남해함대의 목소리"
 china_scs.56.a: "남해를 지켜야 한다."
 china_scs.56.d: "영유권 주장국이 베이징의 최후통첩을 거부한 후, 인민해군 수상함 전단이 이를 집행하기 위해 움직였습니다. 분쟁 중인 스프래틀리 지형을 둘러싸고 짧고 격렬한 해상 교전이 시작되었습니다. 양측 모두 제한된 병력만 투입하고 있으며, 결과는 이 국가의 통제권과 영유권 주장국이 워싱턴에 개입을 요청할지를 결정합니다."
 china_scs.56.t: "스프래틀리 충돌"
 china_scs.57.a: "패배를 인정하고 조건을 모색한다."
 china_scs.57.b: "미국에 호소한다."
 china_scs.57.d: "국경 교전은 패배로 끝났습니다. 분쟁 지형은 이제 중국의 통제하에 있으며 병력은 철수했습니다. 정부는 손실을 받아들이고 남은 주권이라도 지킬지, 아니면 미국에 지원을 호소할지 결정해야 하며, 후자는 워싱턴을 원치 않을 수도 있는 대결로 끌어들일 위험이 있습니다."
 china_scs.57.t: "미국 동맹국들에 대한 호소"
 china_scs.58.a: "철수하고 재평가한다."
 china_scs.58.d: "인민해방군 해군 부대가 분쟁 지형을 두고 영유권 주장국의 병력과 교전했으나 진지를 확보하지 못하고 철수했습니다. 충돌은 제한적이고 국지적이었지만, 외교적 서사는 중국의 과욕과 군사적 부족이라는 것입니다. 베이징은 더 넓은 전략적 태세가 계속되는 동안 정치적 비용을 감수해야 합니다."
 china_scs.58.t: "스프래틀리의 충돌 차질"
 china_scs.60.a: "새로운 연대를 유념한다."
 china_scs.60.d: "남중국해에서의 중국의 공격성이 지역이 더 이상 외교적으로 흡수할 수 없는 한계를 넘어서면서, 미국, 일본, 인도, 오스트레일리아는 안보 협력을 작동하는 쿼드 연대로 공식화했습니다. 합동 해군 순찰, 정보 공유, 조율된 외교적 입장이 발표되었습니다. 이 결성은 베이징의 태세에 대한 직접적인 대응이며 남중국해를 둘러싼 경쟁이 강대국 차원의 성격을 띠게 되었음을 알립니다."
 china_scs.60.t: "쿼드 구상"
 china_scs.70.a: "조용히 사과하고 철수한다."
 china_scs.70.b: "굳건히 버틴다. 이 수역은 중국의 역사적 권리 안에 있다."
 china_scs.70.d: "중국 해상 민병대 선박이 해안경비대 호위를 받으며 인도네시아의 나투나 배타적 경제수역 안에서 활동하는 것이 포착되었습니다. 자카르타는 공식 항의를 제기하고 대사를 소환했으며 중국 선박을 따라붙기 위해 해군 함정을 배치했습니다. 인도네시아는 구단선을 공개적으로 문제 삼지는 않지만, 이 침범은 전략적 인내심의 한계를 시험하며 아세안 최대 국가를 베이징과의 공공연한 대립으로 끌어들일 위험이 있습니다."
 china_scs.70.t: "나투나 사건"
 sino_indian.1.d_opt: "지금은 개입할 수 없다."
 sino_indian.20.a: "방어적 연합 노력이다. 우리는 지역을 지킨다."
 sino_indian.20.b: "징벌 원정이다. 신속하고 결정적이며 가차 없이."
 sino_indian.20.c: "연합의 전면 전시 체제이다. 이것을 영구히 끝낸다."
 sino_indian.20.d: "아프가니스탄-파키스탄 접경 지대의 탈레반과 TTP 분파들에 대항하는 연합 체제가 마련되었습니다. 지휘관들은 작전의 성격에 대한 정치적 방향을 기다리고 있습니다. 이 선택은 지역과 더 넓은 세계가 중앙아시아에서의 중국의 역할을 어떻게 인식할지를 좌우할 것입니다."
 sino_indian.20.t: "산호랑이 작전: 임무를 정의하라"
 sino_indian.21.a: "수락한다. 공식 대화를 시작한다."
 sino_indian.21.b: "신중하게 화답한다. 신뢰하되 검증한다."
 sino_indian.21.c: "거부한다. 이것은 양동이다."
 sino_indian.21.d: "중국이 이슬라마바드와 거리를 두고 뉴델리를 향한 새로운 방향을 알리는 일련의 조치를 취했습니다. 이 제스처는 사전 조건 없이 도착했지만 전략적 함의는 분명합니다. 인도는 응할지, 어떤 조건으로 응할지 결정해야 합니다."
 sino_indian.21.t: "뜻밖의 손을 내민 베이징"
 sino_indian.22.a: "방어 태세이다. 우리가 도발당했다."
 sino_indian.22.b: "징벌 원정이다. 1962년처럼."
 sino_indian.22.c: "전면 전시 체제이다. 맥마흔 선을 영원히 매듭짓는다."
 sino_indian.22.d: "인민해방군 병력이 실질 통제선을 따라 인도 부대와 교전했습니다. 충돌은 정책 결정을 요구할 만큼 심각합니다. 베이징은 이 군사 행동이 스스로를 규정하기 전에 그 정치적 성격을 규정해야 합니다."
 sino_indian.22.t: "갈완 청산"
 sino_indian.30.a: "훌륭하군."
 sino_indian.30.b: "흥미로운 전개이다."
 sino_indian.30.d: "중국이 중재한 탈레반 경쟁 분파 간의 중재가 뜻밖의 균열을 일으켰습니다. 강경파 블록이 제안된 조건을 두고 주류 지도부와 결별하고 이 과정을 공개적으로 비난했습니다. 이 분열은 탈레반의 결속력을 약화시키고 연합에 기회를 만듭니다."
 sino_indian.30.t: "협상을 둘러싼 탈레반 분파의 분열"
 sino_indian.31.a: "예상했던 바이다."
 sino_indian.31.d: "중앙아시아에서 연합 전면 전시 체제를 선언한 베이징의 발표는 앙카라와 테헤란에서 우려를 불러일으켰습니다. 두 수도 모두 이 동원을 자신들이 전략적 주변부로 여기는 지역에 대한 중국 군사력의 투사로 봅니다."
 sino_indian.31.t: "지역 강국들을 놀라게 한 연합 전시 체제"
 sino_indian.32.a: "조약을 수락한다. 우리에게는 보호가 필요하다."
 sino_indian.32.b: "거부한다. 우리는 전략적 자율성을 유지한다."
 sino_indian.32.d: "히말라야 전선에서의 중국의 공세 이후, 워싱턴이 뉴델리에 양자 방위 조약이라는 공식 제안을 해 왔습니다. 미국 기획자들은 인도를 중국 세력에 대한 핵심 균형추로 봅니다. 인도에 있어 수락은 안보 보장을 의미하지만 미국과의 더 깊은 연대도 의미합니다."
 sino_indian.32.t: "워싱턴의 방위 조약 제안"
 sino_indian.33.a: "중국의 압박에 대비한다"
 sino_indian.33.d: "남아시아에서의 중국의 재개된 관여는 인도의 전통적 세력권에 대한 직접적인 도전을 알립니다. 뉴델리는 대응을 준비해야 합니다."
 sino_indian.33.t: "남아시아로 선회하는 베이징"
 sino_indian.34.a: "소총과 명령을 받아들인다"
 sino_indian.34.b: "베이징의 대리인이 되기를 거부한다"
 sino_indian.34.d: "중국이 네팔 통합 공산당에 카트만두에 대한 반란을 밀어붙이도록 무기, 훈련, 정치적 후원을 제안하고 있습니다. 수락은 운동을 베이징의 후견에 묶으며, 만약 붉은 깃발이 싱하 두르바르 위에 휘날린다면 이 빚은 청구될 것입니다."
 sino_indian.34.t: "마오주의자들에게 손을 내민 베이징"
 sino_indian.35.a: "틀을 수락한다"
 sino_indian.35.b: "당분간 거절한다"
 sino_indian.35.d: "베이징이 네팔의 중립적 지위에 대한 상호 존중을 틀로 삼아 카트만두에 경제 및 기반시설 협력을 제안했습니다."
 sino_indian.35.t: "중국의 협력 체계 제안"
 sino_indian.36.a: "동반자 관계를 수락한다"
 sino_indian.36.b: "정중히 거절한다"
 sino_indian.36.d: "중국이 방글라데시에 안보 보장과 확대된 무역 관계를 뒷받침으로 하는 공식 전략적 동반자 관계를 제안했습니다. 다카는 뉴델리의 예상되는 반응에 맞서 그 이점을 저울질해야 합니다."
 sino_indian.36.t: "베이징의 다카 전략적 동반자 관계 제안"
 sino_indian.37.a: "이 제스처를 받아들인다"
 sino_indian.37.d: "뜻밖의 외교적 제스처로 중국이 부탄 북부 국경을 따라 남아 있던 영토 주장을 공식 포기했습니다. 팀푸는 이 발표를 환영합니다."
 sino_indian.37.t: "베이징의 부탄 영유권 주장 철회"
 sino_indian.38.a: "동반자 관계를 받아들인다"
 sino_indian.38.b: "우리에게는 우리만의 공간이 필요하다"
 sino_indian.38.d: "중국이 파키스탄에 영구 동반자 선언, 즉 철의 형제 결속을 제안하여 전천후 동맹을 최고위 정치 수준에서 공고히 하려 합니다."
 sino_indian.38.t: "베이징의 철의 형제 조약 제안"
 sino_indian.39.a: "지상전에 집중한다"
 sino_indian.39.b: "공군력에 집중한다"
 sino_indian.39.c: "해군 능력에 집중한다"
 sino_indian.39.d: "중국의 방위 산업은 파키스탄에 지식을 이전할 준비가 되어 있습니다. 이슬라마바드는 어느 분야가 이 협력으로 가장 큰 혜택을 볼지 결정해야 합니다."
 sino_indian.39.d_opt: "핵 기술에 집중한다"
 sino_indian.39.t: "합동 군사 프로젝트: 중점 분야를 선택하라"
 sino_indian.40.a: "ETIM을 테러 조직으로 공식 지정한다"
 sino_indian.40.b: "요청을 거절한다"
 sino_indian.40.d: "중국이 파키스탄에 동투르키스탄 이슬람 운동을 테러 조직으로 지정하라고 공식 요청했습니다. 이슬라마바드는 대테러 이점과 국내 정치적 민감성을 저울질해야 합니다."
 sino_indian.40.t: "베이징의 ETIM 테러 지정 요청"
 sino_indian.41.a: "투자를 환영한다"
 sino_indian.41.d: "베이징이 중국-파키스탄 경제 회랑 전체 프로그램의 개시를 확인했습니다. 대규모 기반시설 투자는 파키스탄의 교통 및 에너지 네트워크를 재편할 것입니다."
 sino_indian.41.t: "중국-파키스탄 경제 회랑 개시"
 sino_indian.42.a: "동반자 관계를 환영한다"
 sino_indian.42.d: "베이징이 중국 해군 함정을 수용하기 위해 과다르 항의 정박 시설을 확장할 것을 제안했습니다. 이슬라마바드는 그 대가로 새로운 조선소 역량을 얻게 됩니다."
 sino_indian.42.t: "과다르를 해군 거점으로 주목하는 중국"
 sino_indian.43.a: "기구에 참여한다"
 sino_indian.43.d: "중국이 파키스탄에 베이징, 카불, 이슬라마바드, 두샨베를 잇는 공동 대테러 체계인 4자 협력 조정 기구에 가입하도록 초청했습니다."
 sino_indian.43.t: "QCCM: 이슬라마바드에 가입 초청"
 sino_indian.44.a: "기구에 참여한다"
 sino_indian.44.d: "중국이 아프가니스탄에 베이징, 카불, 이슬라마바드, 두샨베를 잇는 공동 대테러 체계인 4자 협력 조정 기구에 가입하도록 초청했습니다."
 sino_indian.44.t: "QCCM: 카불에 가입 초청"
 sino_indian.45.a: "기구에 참여한다"
 sino_indian.45.d: "중국이 타지키스탄에 베이징, 카불, 이슬라마바드, 두샨베를 잇는 공동 대테러 체계인 4자 협력 조정 기구에 가입하도록 초청했습니다."
 sino_indian.45.t: "QCCM: 두샨베에 가입 초청"
 sino_indian.46.a: "중국과 함께 싸운다"
 sino_indian.46.b: "이것은 중국이 치러야 할 전쟁이다"
 sino_indian.46.d: "베이징이 파키스탄에 탈레반과 TTP에 대항하는 연합 군사 작전에 참여하도록 요청했습니다. 공동 노력은 훨씬 더 결정적이겠지만 훨씬 더 큰 약속이기도 합니다."
 sino_indian.46.t: "중국의 아프가니스탄 합동 작전 제안"
 sino_indian.47.a: "국경 안보에서 협력한다"
 sino_indian.47.d: "베이징이 와칸 회랑에 공동 국경 관리 및 대테러 조정 구역을 설정했습니다. 모든 파트너 국가는 개선된 정보 공유의 혜택을 누리게 됩니다."
 sino_indian.47.t: "중국의 와칸 완충 구상 개시"
 sino_indian.48.a: "제스처를 인정한다"
 sino_indian.48.b: "우리는 여전히 회의적이다"
 sino_indian.48.d: "이슬라마바드와 거리를 두기로 한 중국의 결정은 뉴델리에서 간과되지 않았습니다. 이것이 진정한 재편을 의미하는지 일시적인 책략인지는 여전히 열린 질문입니다."
 sino_indian.48.t: "파키스탄에 대한 베이징의 변화를 저울질하는 인도"
 sino_indian.49.a: "공식 항의를 제기한다"
 sino_indian.49.b: "새로운 지역 현실을 받아들인다"
 sino_indian.49.d: "중-인 우호 조약은 워싱턴에 충격파를 보냈습니다. 이것이 안정적인 새 질서인지 이 지역에서 미국의 이익에 대한 위협인지는 이제 최고위 수준에서 논의되고 있습니다."
 sino_indian.49.t: "중-인 조약에 대한 워싱턴의 반응"
 sino_indian.50.a: "중국의 권위에 복종한다"
 sino_indian.50.b: "부탄은 결코 굴복하지 않는다"
 sino_indian.50.d: "중국이 부탄에 냉혹한 선택지를 내밀었습니다. 베이징의 권위에 공식 복종하거나, 무력의 결과에 직면하는 것입니다. 팀푸에게 움직일 여지는 거의 없습니다."
 sino_indian.50.t: "베이징의 팀푸 최후통첩"
 sino_indian.51.a: "조건을 수락한다"
 sino_indian.51.b: "네팔은 저항할 것이다"
 sino_indian.51.d: "중국이 네팔에 베이징의 권위 아래 연합국이라는 공식 지위를 받아들이라고 요구했습니다. 카트만두는 따를지 저항할지 결정해야 합니다."
 sino_indian.51.t: "베이징의 카트만두 최후통첩"
 sino_indian.52.a: "동반자 관계를 수락한다"
 sino_indian.52.b: "요청을 거절한다"
 sino_indian.52.d: "중국이 이른바 진주 목걸이 전략에 따라 우리 항구에 대한 병참 및 기지 사용 접근권을 공식 요청했습니다. 그 대가로 베이징은 상당한 경제 동반자 패키지를 제안합니다."
 sino_indian.52.t: "베이징의 해군 기지 사용권 요청"
 sino_indian.53.a: "베이징의 포옹을 받아들인다"
 sino_indian.53.b: "혁명은 어떤 외국 주인에게도 응답하지 않는다"
 sino_indian.53.d: "네팔 인민공화국은 카트만두에서 승리를 거두었지만, 혁명을 승리로 이끈 소총에는 노린코의 각인이 찍혀 있었습니다. 베이징은 이제 새 국가가 연합국으로서 중국의 세력권 안에 자리 잡기를 기대합니다. 거부는 정중하게 받아들여지지 않을 것입니다."
 sino_indian.53.t: "도착한 베이징의 청구서"
 sino_indian.54.a: "훌륭한 동반자 관계이다"
 sino_indian.54.d: "파키스탄이 우리의 합동 군사 연구 제안을 수락하고 중점 분야를 선택했습니다. 우리의 방위 산업은 이제 합의된 전문 분야의 개발을 조율할 것이며, 우리 연구자들은 이 협력으로 이익을 얻게 됩니다."
 sino_indian.54.t: "합동 군사 프로그램에 참여하는 이슬라마바드"
 sino_indian.55.a: "아라비아 해의 거점이다"
 sino_indian.55.d: "이슬라마바드가 과다르 항에서 우리 해군을 공식 환영했습니다. 확장된 정박 시설과 기지 사용 협정은 우리에게 아라비아 해의 전략적 거점을 주어 서인도양에서의 우리 입지를 굳건히 합니다."
 sino_indian.55.t: "인민해방군 해군에 개방된 과다르"
 CHI_advanced_node_chips_trait: "첨단 공정 칩"
 CHI_advanced_node_chips_trait_desc: "SMIC의 7nm급 공정이 CETC의 지휘통제 체계에 국산 프로세서를 공급합니다. 신호 처리 전자 장비의 해외 공급 병목을 해소합니다."
 CHI_hbm_compute_trait: "HBM 기반 유도 연산"
 CHI_hbm_compute_trait_desc: "CXMT의 HBM2 스택은 CASIC 요격 및 방공 체계의 첨단 센서 융합과 표적 식별을 뒷받침합니다. 국내 공급으로 외국산 메모리 의존이 끝납니다."
 CHI_imfm_jsw_partnership: "일본제강소 제휴"
 CHI_imfm_jsw_partnership_desc: "이 제휴를 통해 일본제강소의 대구경 단조 및 고경도 강재 제조 공정이 이전되어, 공장의 구조 소재 생산 품질이 직접적으로 향상됩니다."
 CHI_imfm_komatsu_partnership: "고마쓰 제휴"
 CHI_imfm_komatsu_partnership_desc: "고마쓰 디펜스와의 협력으로 일본 자위대 차량 사업을 위해 개발된 모듈식 경량 장갑 건조 기법과 차량 체계 통합 관행이 도입됩니다."
 CHI_imfm_mhi_partnership: "미쓰비시 중공업 제휴"
 CHI_imfm_mhi_partnership_desc: "미쓰비시 중공업과의 면허 생산 협정으로 첨단 장갑 설계 방법론과 복합재 방호 기술이 공장의 차량 사업에 도입됩니다."
 CHI_indigenous_euv_trait: "자체 EUV 통합"
 CHI_indigenous_euv_trait_cetc: "자체 EUV 통합"
 CHI_indigenous_euv_trait_cetc_desc: "SiCarrier 방식의 리소그래피로 차세대 CETC CNC 프로세서, 센서 ASIC, 레이더 후단 전자장비를 생산합니다. 국산 툴체인이 성숙함에 따라 웨이퍼당 비용이 하락합니다."
 CHI_indigenous_euv_trait_desc: "SiCarrier 방식의 리소그래피로 CASC 사업 내에서 우주용 및 미사일용 칩을 생산합니다. 전략 체계에 대한 전 과정 국내 공급이 이루어집니다."
 CHI_kirin_avionics_trait: "기린 항전 통합"
 CHI_kirin_avionics_trait_desc: "하이실리콘 기린 기반 SoC가 AVIC의 비행 컴퓨터, 임무 체계, 전자전 장비에 동력을 제공합니다. 2019년 제재 대상 명단 지정 이후의 국산 대체입니다."
 CHI_norinco_howa_partnership: "와고 기계 제휴"
 CHI_norinco_howa_partnership_desc: "이 제휴는 와고 기계의 정밀 소화기 가공 공정을 면허 도입하여, NORINCO 보병 무기 생산 라인 전반의 생산 공차와 품질 일관성을 높입니다."
 CHI_norinco_nec_partnership: "NEC 제휴"
 CHI_norinco_nec_partnership_desc: "NEC 코퍼레이션과의 협력으로 일본의 C4ISR 전자장비 표준과 임베디드 시스템 공학이 NORINCO의 전장 통신 및 센서 제품군에 통합됩니다."
 CHI_norinco_subaru_partnership: "스바루 제휴"
 CHI_norinco_subaru_partnership_desc: "스바루 에어로스페이스와의 기술 이전 협약으로 정밀 금속 가공 기법과 회전익 구조 설계 지식이 NORINCO의 생산 라인에 도입됩니다."
 CHI_norinco_toshiba_partnership: "도시바 제휴"
 CHI_norinco_toshiba_partnership_desc: "도시바 디펜스 시스템즈와의 라이선스 협약으로 첨단 레이더 배열 설계와 전자전 부품 제조 기법이 NORINCO의 전자 부문에 도입됩니다."
 CHI_norinco_trait_red_arrow_L_AT_Equipment_suite: "홍전 HJ 시리즈 대전차 유도 미사일 장비 일체"
