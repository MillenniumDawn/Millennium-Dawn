 COM_federalist_supported_tt: "§Y$COM_the_constitutional_referendum_mission$§!에서 §Y연방주의§! 지지도가 §Y55%§!에서 시작합니다.\n"
 COM_constitutionalists_supported_tt: "§Y$COM_the_constitutional_referendum_mission$§!에서 §Y중앙집권주의§! 지지도가 §Y55%§!에서 시작합니다.\n"
 COM_the_zanzibar_agreement_tt: "앞으로 §Y2년§! 동안 [253.OWNER.GetName]에 다음을 지불합니다:\n"
 COM_pro_federalist: "국민투표 결과: 연방주의 지지"
 COM_anti_federalist: "국민투표 결과: 중앙집권 정부"
 COM_successful_operation: "작전 성공"
 COM_robert_denard_seized_power: "§Y로베르 드나르§!가 권력 장악"
 COM_expanded_private_military_operations: "확대된 민간 군사 작전"
 COM_disbanded_presidential_guard: "§Y대통령 경호대§! 해체"
 COM_island_warlord: "섬의 군벌"
 COM_our_own_path: "우리만의 길"
 COM_our_own_path_desc: "코모로가 스스로의 진로를 설정할 때입니다. 우리 군을 나라 고유의 필요와 과제에 맞게 형성하면 집중적이면서도 적응력 있는 병력을 구축할 수 있습니다. 우리만의 교리를 개발하면 우리 사정에 맞지 않는 외국 모델에 의존하지 않고 어떤 분쟁에도 대비할 수 있습니다."
 COM_spread_the_disarmament_education: "군축 교육 전파"
 COM_spread_the_disarmament_education_desc: "UNREC의 군축 교육을 전파하면 우리 군을 무장 해제하고 아프리카의 형제자매들이 같은 길을 걷도록 장려하는 데 도움이 될 것입니다."
 COM_denounce_nuclear_weapons: "핵무기 규탄"
 COM_denounce_nuclear_weapons_desc: "이제 우리가 아프리카에서 앞장서서 세계의 핵무기를 규탄하고 아프리카가 핵 비확산에 계속 전념하도록 보장할 때입니다."
 COM_east_african_disarmament: "동아프리카 군축"
 COM_east_african_disarmament_desc: "동아프리카 지역에는 수많은 분쟁이 있으며, 이 나라들의 군축은 지역의 평화와 안정을 유지하는 데 결정적입니다. 동아프리카 군축 구상에 협력하면 군대를 무장 해제하는 방향으로 나아갈 수 있으며 동아프리카 지역의 평화롭고 안전한 미래에 대한 우리의 의지를 보여 줄 수 있습니다."
 COM_peaceful_disarmament: "평화적 군축"
 COM_peaceful_disarmament_desc: "우리는 아프리카에서 앞장서서 군대를 무장 해제하고, 나라를 무장 해제함으로써 아프리카 대륙의 평화롭고 안전한 미래에 대한 의지를 보여 주어야 합니다."
 COM_total_ban_on_personal_weapons: "개인 무기 전면 금지"
 COM_total_ban_on_personal_weapons_desc: "나라 안의 모든 개인 무기를 금지하고 국민에게서 모든 무기를 되사들이는 맞춤형 캠페인을 벌일 때입니다."
 COM_new_african_pacifism: "신아프리카 평화주의"
 COM_new_african_pacifism_desc: "모든 아프리카 국가가 평화와 무장 평화주의의 새 시대에 다가서도록 장려하는 것만이 우리에게 강하고 안정적이며 번영하는 미래를 가져다줄 것입니다."
 COM_a_shining_example_of_peace: "평화의 빛나는 본보기"
 COM_a_shining_example_of_peace_desc: "우리는 아프리카의 다른 나라들에게 평화와 군축의 빛나는 본보기가 되어야 합니다. 군대를 무장 해제하고 아프리카 대륙의 평화롭고 안전한 미래에 대한 의지를 보여 줌으로써 다른 나라들이 같은 길을 걷도록 고무할 수 있습니다."
 COM_expanded_military_industries: "군수 산업 확대"
 COM_expanded_military_industries_desc: "나라가 무기 생산을 계속 외주에 맡기는 가운데, [COM.GetName]의 군수 산업은 활력을 되찾는 것이 절실합니다."
 COM_invite_the_pmcs: "민간 군사 기업 초청"
 COM_invite_the_pmcs_desc: "아프리카와 세계 각지의 여러 민간 군사 기업은 우리의 보안군과 방위군을 보강하기에 훌륭한 선택지입니다. 동원령이 내려질 경우에 대비하여 우리의 전투 역량을 확대하도록 그들에게 연락해 초청해야 합니다."
 COM_expand_the_presidential_guard: "대통령 경호대 확대"
 COM_expand_the_presidential_guard_desc: "대통령 경호대는 우리 위대한 나라의 초석 중 하나이며 동아프리카의 정예 전투 부대입니다. 동아프리카 해안에서의 우리의 야망을 뒷받침하기 위해 이 전투원들로 구성된 연대를 하나 더 배치해야 합니다."
 COM_reform_defunct_pmc_units: "해체된 민간 군사 기업 부대 재편"
 COM_reform_defunct_pmc_units_desc: "해체된 여러 민간 군사 기업은 아프리카의 각종 분쟁이나 코모로로 거슬러 올라갈 수 있으며, 이제 손을 내밀어 코모로를 근거지로 이 부대들을 재편할 때입니다."
 COM_expand_the_defense_force: "방위군 재편"
 COM_expand_the_defense_force_desc: "코모로 방위군은 우리 무장 부대의 마지막 3분의 1이며, CSF 본대와 매끄럽게 협력하도록 재편해야 합니다."
 COM_homegrown_military_manufacturing: "자체 군수 제조"
 COM_homegrown_military_manufacturing_desc: "[COM.GetName]은(는) 군수 제조로 알려진 나라가 아니지만, 지역 기업을 계속 지원하고 나라 안에 새로운 군수 산업 조직을 육성한다면 달라질 수 있습니다."
 COM_the_eastern_african_entrepot: "동아프리카 중계무역항"
 COM_the_eastern_african_entrepot_desc: "코모로는 동아프리카 해안의 경제 중심지가 되기에 매우 유리한 위치에 있습니다. 우리는 항만을 확장하고, 다른 국가들과 훨씬 더 포괄적인 경제 협력 관계를 발전시키고 공식화해야 합니다."
 COM_expand_the_prince_said_irabhim_airport: "프린스 사이드 이브라힘 공항 확장"
 COM_expand_the_prince_said_irabhim_airport_desc: "이 공항은 1975년에 개항했으며, 코모로의 유일한 국제공항이자 국영 항공사인 코모로 항공의 거점입니다."
 COM_expand_available_helicopters: "가용 헬리콥터 확충"
 COM_expand_available_helicopters_desc: "우리의 현 헬리콥터 전력은 구식이며 교체되어야 합니다. 새 헬리콥터를 확보함으로써 우리의 역량을 강화하고, 국가를 효과적으로 수호하며 주권에 대한 모든 위협에 대응할 준비를 갖출 수 있습니다."
 COM_comorian_politics: "코모로 정치"
 COM_comorian_politics_desc: "군사력은 국제 정치 방정식의 절반에 불과합니다. 우리의 영향력을 해안 너머로 넓힐 수 있도록 외교관도 양성해야 합니다."
 COM_social_democracy_in_africa: "아프리카의 사회민주주의 다이아몬드"
 COM_social_democracy_in_africa_desc: "사회민주주의는 시장경제와 불평등 완화, 교육 및 보건 접근성 향상, 지속 가능한 발전 촉진을 목표로 하는 사회 정책을 결합한 균형 잡힌 통치 방식을 제시합니다. 사회민주주의 원칙을 채택함으로써 코모로는 포용적 성장과 시민들의 더 밝은 미래를 위한 길을 닦을 수 있습니다."
 COM_a_true_democracy: "진정한 민주주의"
 COM_a_true_democracy_desc: "민주적 이상에 대한 의지를 굳건히 지킴으로써 코모로는 안정을 도모하고, 경제 성장을 촉진하고, 인권을 수호하며, 시민에게 힘을 실어줄 수 있습니다. 이 모든 것은 지속적인 번영을 이루는 데 필수적인 요소입니다."
 COM_our_partnership: "미국과의 동반자 관계"
 COM_our_partnership_desc: "미국과의 전략적 동반자 관계는 큰 도움이 될 수 있습니다. 이 글은 코모로가 미국과의 협력을 받아들여야 하는 설득력 있는 이유를 강조하고자 합니다. 협력은 기회의 문을 열고, 경제 안정을 높이며, 기술 발전을 촉진하고, 사회 진보를 증진할 수 있습니다."
 COM_anti_nato_ally: "코모로의 바그너 PMC"
 COM_anti_nato_ally_desc: "바그너 PMC를 우리나라로 초청하여 정부가 고용하도록 해야 합니다. 프랑스가 우리를 지켜 주려 할 수도 있겠으나, 우리 자신의 강력한 군사력을 갖추는 편이 언제나 더 낫습니다!"
 COM_clearing_the_nomenclature: "노멘클라투라 청산"
 COM_clearing_the_nomenclature_desc: "노멘클라투라 청산이 우리의 새 의제에서 최우선 과제가 되어야 합니다! 그 성가신 서방 유화론자들이 우리의 새로운 신성 정부에 대해 소란을 피우도록 입을 열게 놔둘 이유가 어디 있습니까?"
 COM_pan_arabism: "범이슬람주의"
 COM_pan_arabism_desc: "우리는 지리적으로 외떨어져 있지만, 우리와 나머지 아랍 세계를 하나로 묶는 것에 집중함으로써 영원히 지속될 형제애를 불러일으킬 수 있습니다."
 COM_the_warrior_king: "전사왕"
 COM_the_warrior_king_desc: "드나르가 [COM.GetName]에서 권력을 장악했습니다. 민중의 사람이자 군인이며 민간 군사 기업의 사람인 그는 이제 \\"전사왕\\"이라는 칭호를 얻을 수 있습니다. 우리는 돈을 벌기 위해 세계 곳곳의 여러 분쟁에서 각국 정부를 지원할 준비를 하고, [COM.GetName]을(를) 전 세계 모든 PMC의 으뜸가는 본거지로 자리매김시킬 수 있습니다."
 COM_the_consolidation_of_power: "권력 공고화"
 COM_the_consolidation_of_power_desc: "우리는 무력으로 통치하고 있지만, 군도에서 권력을 공고히 하지 않으면 지금까지 얻은 모든 것을 잃을 위험이 있습니다. 이제 권력을 공고히 할 때입니다."
 COM_legitimize_our_rule: "우리 통치의 정당화"
 COM_legitimize_our_rule_desc: "지금 우리의 중점은 자체적인 자치 행정을 통해서든 지역 강대국들에 승인을 요청함으로써든 우리의 통치를 정당화하는 것이어야 합니다."
 COM_declare_the_state_of_pmcs: "PMC 국가 선포"
 COM_declare_the_state_of_pmcs_desc: "우리나라가 수립되고 우리의 통치가 정당화되고 안정되었으니, 이제 민간 군사 기업의 국가를 공식적으로 명문화하고 보호할 수 있습니다. 민간 군사 기업의 국가를 세우면 경제 성장이 크게 유입되고 해외에서의 영향력이 확대될 것입니다... 우리는 그렇게 되기를 바랍니다."
 COM_a_rifle_for_hire: "고용 가능한 소총"
 COM_a_rifle_for_hire_desc: "일부 민간 군사 기업을 국유화하고 우리 군대를 용병처럼 임대함으로써, 우리는 수익에서 우리 몫과 배분을 계속 늘려 갈 수 있습니다."
 COM_expanded_regional_operations: "지역 작전 확대"
 COM_expanded_regional_operations_desc: "군사 작전 기반을 구축하고 그 역량을 확대하면 우리 군을 지역 각지로 전개할 수 있게 됩니다."
 COM_expanded_global_operations: "세계 작전 확대"
 COM_expanded_global_operations_desc: "우리 민간 군사 기업이 자금과 지원을 확보했으니, 이제 아프리카 분쟁에만 국한하지 않고 전 세계의 여러 분쟁에 우리 병력을 투입할 수 있습니다."
 COM_the_zanzibar_agreement: "잔지바르 협정"
 COM_the_zanzibar_agreement_desc: "우리는 국토를 넓히기 위해 [253.GetName]의 매각을 중개하는 거래를 성사시키고자 [253.OWNER.GetName]에 접근했습니다. 우리는 주 양도 거래안과 함께 제안서를 마련했습니다."
 COM_anti_colonialist_propaganda: "반식민주의 선전"
 COM_anti_colonialist_propaganda_desc: "프랑스가 아프리카에서 철수했을 때 뒤처진 아프리카 국가들이 많습니다. 상황을 올바르게 규정하면 많은 사람들을 매우 빠르게 격분시킬 수 있습니다."
 COM_the_constitutional_referendum: "연방 국민투표"
 COM_the_constitutional_referendum_desc: "코모로 각 섬의 법적 지위는 한동안 불확실한 상태였으며, 이에 코모로가 연방을 구성할 수 있도록 헌법 개정안을 승인하거나 부결하기 위한 국민투표가 소집되었습니다."
 COM_greater_inter_island_cooperation: "섬 간 협력 강화"
 COM_greater_inter_island_cooperation_desc: "바카르 사태는 자치가 통제를 벗어날 수 있음을 보여 주었습니다. 이를 교훈 삼아 섬 간 협력을 더욱 증진해야 합니다."
 COM_the_tourism_industry: "관광 산업"
 COM_the_tourism_industry_desc: "섬나라인 우리에게 관광은 국가 경제 구성에서 중요한 중심축입니다. 전 세계의 방문객들은 카르탈라 화산, 모엘리 해양 공원, 군도의 여러 섬을 뒤덮은 다채로운 해변과 정글을 도보로 탐방할 수 있으며, 관광의 대부분은 앙주앙과 그랑드코모르를 중심으로 이루어집니다. 또한 아랍, 아프리카, 프랑스 문화가 아름답게 어우러진 독특한 문화도 즐길 수 있습니다."
 COM_agricultural_developments: "농업 개발"
 COM_agricultural_developments_desc: "농업은 우리 경제의 근간으로서 인구 대다수를 고용하고 가장 가치 있는 수출품을 생산합니다. 현대적 영농 기술, 관개 인프라, 농업 교육에 투자함으로써 생산성을 높이고 국민의 식량 안보를 보장할 수 있습니다."
 COM_fishery_industry_investment: "수산업 투자"
 COM_fishery_industry_investment_desc: "섬나라인 우리 코모로 주변 바다는 해양 생물이 풍부합니다. 수산업에 투자하면 해안 공동체에 일자리를 제공할 뿐 아니라 국제 시장에서 경쟁할 수 있는 지속 가능한 수출 산업도 만들어 낼 수 있습니다."
 COM_comorian_forestry: "코모로 임업"
 COM_comorian_forestry_desc: "우리의 섬들은 귀중한 목재 자원을 제공하는 울창한 열대림으로 덮여 있습니다. 지속 가능한 임업 관행과 적절한 관리를 시행함으로써 우리는 후세를 위해 자연환경을 보존하면서 이 부문을 발전시킬 수 있습니다."
 COM_join_the_world_trade_organization: "세계무역기구 가입"
 COM_join_the_world_trade_organization_desc: "세계무역기구 회원국이 되면 우리 수출품을 위한 새 시장이 열리고, 국제 무역 협상에서 발언권을 얻으며, 세계 경제에 더 온전히 편입되는 데 도움이 될 것입니다. WTO의 분쟁 해결 체계는 해외에서의 우리 경제적 이익도 보호해 줄 것입니다."
 COM_trade_deals_with_madagascar: "마다가스카르와의 무역 협정"
 COM_trade_deals_with_madagascar_desc: "마다가스카르는 우리의 가장 가까운 이웃이자 자연스러운 무역 상대국입니다. 이들과의 경제적 유대를 강화하면 운송비가 줄고 교역량이 늘며, 양국 모두에 이익이 되는 지역 협력이 촉진될 것입니다."
 COM_trade_deals_with_tanzania: "탄자니아와의 무역 협정"
 COM_trade_deals_with_tanzania_desc: "탄자니아는 더 넓은 지역과 강력히 연결된 동아프리카의 주요 경제 중심지입니다. 이들과 포괄적인 무역 협정을 맺으면 동아프리카 시장에 대한 접근성이 개선되고 지역 무역망에서 우리의 입지가 강화될 것입니다."
 COM_cooperation_with_east_africa: "동아프리카 연합과의 협력"
 COM_cooperation_with_east_africa_desc: "동아프리카 연합(EAU)이라는 구상은 동아프리카 국가들을 하나의 통일된 경제적, 정치적, 사회적 실체로 묶는 지역 통합 사업을 그리고 있습니다. 현재 공식적인 동아프리카 연합은 존재하지 않지만, 동아프리카 국가들 사이의 지역 협력과 통합을 촉진하기 위한 노력이 계속되고 있습니다."
 COM_trading_with_east_africa: "동아프리카 투자"
 COM_trading_with_east_africa_desc: "동아프리카 연합(EAU)의 틀 안에서 서로에게 투자하는 것은 이 지역의 경제 발전과 번영에 큰 잠재력을 지닙니다. 역내 투자를 촉진함으로써 동아프리카 국가들은 공동의 자원, 전문성, 시장을 활용하여 성장을 도모하고, 일자리를 창출하며, 외부 세력에 대한 의존도를 줄일 수 있습니다. 이러한 투자는 다양한 형태를 띨 수 있으며 인프라, 농업, 제조업, 서비스, 기술 등 여러 부문에 기여할 수 있습니다."
 COM_state_of_the_pmcs_idea: "민간 군사 기업의 현황"
 COM_state_of_the_pmcs_idea_desc: "민간 군사 기업을 우리나라 안의 합법적 기관으로 공식 인정하고 지원함으로써, 민간 군사 기업이 GDP와 군사 능력에 크게 기여하는 독특한 경제 모델을 만들어 냈습니다. 국가는 안보 보장과 경제적 이익을 대가로 그들의 활동을 적극 지원합니다."
 COM_expanded_regional_operations_idea: "확대된 지역 작전"
 COM_expanded_regional_operations_idea_desc: "우리 군과 민간 군사 기업 병력은 이제 동아프리카 전역에 배치될 수 있습니다. 이렇게 확대된 작전 범위는 이웃 나라들 전역에서 보안 계약, 평화유지 임무, 군사 지원 작전에 참여할 수 있게 해 줍니다."
 COM_expanded_global_operations_idea: "확대된 세계 작전"
 COM_expanded_global_operations_idea_desc: "충분한 자금과 지원이 있다면 우리 민간 군사 병력은 이제 아프리카에 작전을 한정하지 않고 전 세계에서 계약을 수주할 수 있습니다. 이러한 세계적 영향력은 수익 잠재력을 크게 높이고 코모로를 국제 보안 산업의 주요 행위자로 자리매김하게 합니다."
 COM_comorian_political_decisions: "[COM.GetAdjective] 정치 결정"
 COM_comorian_political_decisions_desc: "코모로의 보안 기구와 용병 정책에 관한 핵심적인 정치 결정입니다."
 COM_disband_the_presidential_guard_decision: "대통령 경호대 해체"
 COM_disband_the_presidential_guard_decision_desc: "대통령 경호대는 코모로에서 권위주의적 통치와 용병 영향력의 상징이 되었습니다. 이 부대를 해체하면 민주적 통치의 새 시대를 알리겠지만, 앞으로의 안보 위협에 취약해질 수 있습니다."
 COM_hire_control_risks_decision: "컨트롤 리스크스 그룹 준군사 조직 결성"
 COM_hire_control_risks_decision_desc: "컨트롤 리스크스 그룹은 전문적인 보안 서비스를 제공할 수 있는 영국의 위험 자문 회사입니다. 다른 선택지보다 비용이 더 들지만, 신중함과 전문성에 대한 평판 덕분에 우리의 취약한 나라에서 안정을 유지하기에 이상적인 선택입니다."
 COM_hire_executive_outcomes_decision: "이그제큐티브 아웃컴즈 재편"
 COM_hire_executive_outcomes_decision_desc: "이그제큐티브 아웃컴즈는 논란이 많은 평판을 가진 남아프리카의 민간 군사 기업입니다. 아프리카 분쟁 지역에서의 경험은 우리에게 상당한 군사 전문성을 제공할 수 있지만, 그들의 존재는 국제적 우려를 불러일으키고 우리 정부를 불안정하게 만들 수 있습니다."
 COM_hire_defense_systems_decision: "디펜스 시스템즈 재편"
 COM_hire_defense_systems_decision_desc: "디펜스 시스템즈 리미티드는 냉전 시기에 활동한 영국의 민간 군사 기업입니다. 이 조직을 재편하면 작은 섬나라 방어의 복잡성을 이해하는 경험 많은 보안 계약자를 확보할 수 있습니다."
 COM_hire_watchguard_decision: "워치가드 재편"
 COM_hire_watchguard_decision_desc: "워치가드 인터내셔널은 1972년에 활동을 중단한 영국의 민간 군사 기업이었습니다. 이 조직을 되살리면 검증된 실적을 가진 용병을 확보할 수 있지만, 그들의 공격적인 전술은 우리의 국제적 평판을 해칠 수 있습니다."
 COM_reform_7_independent_company_decision: "제7독립중대 재편"
 COM_reform_7_independent_company_decision_desc: "제7독립중대는 로디지아에 있던 로베르 드나르의 부대였습니다. 이 부대를 재편하면 우리의 전사왕에게 특별히 충성하는 부대를 가질 수 있지만, 그 충성은 드나르에게 향할 것입니다."
 comoros.33.a: "조건을 받아들일 만하다."
 comoros.33.b: "우리 영토는 매물이 아니다!"
 COM_african_mercenaries_2_tt: "§Y[COM.GetFlag][COM.GetAdjective]§! 정부는 군사력을 보강하기 위해 추가 용병을 고용합니다.\n§Y[269.GetName]§! 주에서 민간 군사 기업 §YAFRIKA-TDL PMC§!를 위한 잠금 사단 편제를 얻습니다."
