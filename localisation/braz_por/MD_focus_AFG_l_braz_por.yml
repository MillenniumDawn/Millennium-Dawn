 AFG_pakistan_border_less_than_three_fort_tt: "O nível de fortificação é menor que §Y1§! em qualquer uma das regiões de fronteira com [PAK.GetNameWithFlag]"
 AFG_fence_along_central_afghanistan_border_tt: "Constrói §G1§! fortificação de fronteira em cada região de fronteira com [PAK.GetNameWithFlag] no Afeganistão §Ycentral§!"
 AFG_fence_along_southern_afghanistan_border_tt: "Constrói §G1§! fortificação de fronteira em cada região de fronteira com [PAK.GetNameWithFlag] no Afeganistão §Ysul§!"
 AFG_fence_along_northern_afghanistan_border_tt: "Constrói §G1§! fortificação de fronteira em cada região de fronteira com [PAK.GetNameWithFlag] no Afeganistão §Ynorte§!"
 AFG_secure_border_with_pakistan_tt: "\nBy building security fortifications along the Afghan-Pakistani border, it will §Gdecrease§! the effectiveness of £GFX_AFG_salafist_jihadism §RTaliban§! infiltration into our country. The construction will start from §Ycentral§! Afghanistan first due to its political significance then continue from §Ysouthern§! Afghanistan to §Ynorthern§! Afghanistan\n"
 afghan_unity_propaganda_success_tt: "\nAs §Ychances de sucesso§! são §Rinfluenciadas§! pela §Yconfiança pública em nosso governo§! e §Ysituação econômica§!."
