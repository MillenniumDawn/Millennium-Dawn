 UKR_lobby_the_deputies_desc: "Встречи, обещания и услуги в кулуарах §YВерховной Рады§! могут склонить следующее голосование в нашу пользу."
 UKR_rada_lobbied_flag: "Пролоббировали депутатов"
 UKR_lobby_the_deputies_tt: "Следующий запрос о расходах в §YВерховной Раде§! получит §G+30%§! к весу голосов «за» (на §Y60§! дней)"
 UKR_modernize_su27up2m: "Модернизация учебно-боевого самолёта §YСу-27УБ§!"
 UKR_modernize_su27up2m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\n§W§YСу-27УП2М§! — украинская модернизация §Rсоветского§! двухместного учебно-боевого самолёта §YСу-27УБ§!, разработанная Запорожским государственным авиаремонтным заводом §L«МиГремонт»§!.\nМодернизация включает улучшенную навигационно-информационную систему, нашлемную систему целеуказания и индикации, автомат отстрела дипольных отражателей и ложных тепловых целей, а также модернизированный вычислитель боевого применения.\nЭти улучшения расширяют возможности прицеливания и позволяют поражать воздушные и наземные цели более широким набором авиационного вооружения.\nВ игре самолёт использует систему РЭБ «Омут-КМ» вместо обновлённых средств противодействия.§!"
 UKR_modernize_su24mu: "Модернизация фронтового бомбардировщика §YСу-24М§!"
 UKR_modernize_su24mu_desc: "§W§YСу-24МУ§! — украинская модернизация §Rсоветского§! фронтового бомбардировщика §YСу-24М§!, приспособленная к требованиям современной войны.\nМодернизация включает бортовой комплекс радиоэлектронного противодействия §Y«Омут-КМ»§!, повышающий живучесть самолёта против вражеских ЗРК с радиолокационным наведением.\nСамолёт также приспособлен к применению современного высокоточного оружия, в том числе британско-французских крылатых ракет §YStorm Shadow§!, отечественных §YР-360Л «Нептун-Д»§! и других современных авиационных средств поражения, что значительно расширяет его ударные возможности.§!"
 UKR_modernize_l39_m1: "Модернизация учебно-тренировочного самолёта L-39C «Альбатрос»"
 UKR_developed_l39_m1_flag: "Выполнено решение §YМодернизация учебно-тренировочного самолёта L-39 «Альбатрос»§!"
 UKR_modernize_l39_m: "Дальнейшая модернизация учебно-тренировочного самолёта L-39C «Альбатрос»"
 UKR_modernize_l39_m1_desc: "§YL-39M1 «Альбатрос»§! — украинская модернизация §Rчехословацкого§! реактивного учебно-тренировочного самолёта §YL-39C§!, призванная улучшить лётные характеристики и продлить срок службы.\nМодернизация включает капитальный ремонт планера, замену штатного двигателя АИ-25ТЛ на более мощный АИ-25ТЛШ и доработку системы управления двигателем.\nВстроенная спутниковая навигационная система и обновлённый бортовой регистратор повышают точность навигации, качество контроля полёта и эксплуатационную надёжность.\nЭти улучшения повышают характеристики самолёта и продлевают срок службы имеющегося в Украине парка учебных самолётов §Rсоветской эпохи§!."
 UKR_modernize_l39_m_desc: "§YL-39M «Альбатрос»§! — дальнейшая украинская модернизация §Rчехословацкого§! реактивного учебно-тренировочного самолёта §YL-39C§!, призванная улучшить подготовку пилотов к современным боевым самолётам.\nПомимо улучшений §YL-39M1§!, самолёт получил бортовой тренажёрный комплекс §YБТК-39§! с многофункциональными индикаторами в кабине, индикатором на лобовом стекле и отдельными органами управления для имитации боевых режимов.\nСистема воспроизводит элементы прицельных и боевых систем истребителя МиГ-29, позволяя пилотам отрабатывать процедуры и боевые навыки на специальном учебном самолёте.\nОбеспечивая более совершенную учебную среду при значительно меньших эксплуатационных расходах, чем у фронтового истребителя, §YL-39M§! улучшает подготовку пилотов и сохраняет пользу от имеющегося в Украине парка учебных самолётов."
 UKR_develop_horlytsia: "Разработка БПЛА §YАн-БК-1 «Горлица»§!"
 UKR_develop_horlytsia_desc: "§W§YАн-БК-1 «Горлица»§! — украинский тактический разведывательно-ударный беспилотный летательный аппарат, разработанный государственным предприятием §Y«Антонов»§!.\nПредназначенный для поддержки сухопутных войск, он сочетает круглосуточную воздушную разведку со сбором разведданных и обнаружением целей в реальном времени.\nБортовые средства наблюдения позволяют обнаруживать и сопровождать вражеские цели, передавая ценную информацию артиллерийским подразделениям и командирам на поле боя.\nАппарат также может нести оружие для поражения наземных целей, что даёт дополнительную возможность высокоточных ударов при меньшем риске для пилотируемой авиации.§!"
 UKR_zelenskiy_popularity_TT: "£ukr_servant_of_the_people (SN) Изменение популярности «Слуги народа»: §G+12.00%§!"
 UKR_sevastopol_received: "(§Gполучено§!)"
 UKR_sevastopol_not_received: "(§Rне получено§!)"
 UKR_restore_an_71_with_project: "Возобновить работы над §YАн-71§!\nсамолётом ДРЛО §G(проект ДРЛО завершён)§!"
 UKR_restore_an_71_with_project_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_soviet_an_71_development_for_tooltip\n\n\n\n\n\n\n\n\n§W§YАн-71§! — самолёт дальнего радиолокационного обнаружения, построенный §LАНТК им. Антонова§! на базе транспортного §YАн-72§!, с обтекателем радара на вершине стреловидного вперёд киля. Он впервые поднялся в воздух 12 июля 1985 года, чтобы управлять §Rсоветской§! фронтовой авиацией, но программа закончилась вместе с §RСоветским Союзом§!, а его радар §Y«Вега-М» «Квант»§! так и не справился полностью с отражениями от земли.\nОпытный экземпляр §Y№ 03§! после 362 полётов по-прежнему стоит на «Антонове», а Индия проявляла интерес к покупке этого типа. Возобновление программы дало бы нашим ВВС собственный самолёт ДРЛО.\n\n§GОсобо важный военный проект:§! после его завершения §YВерховная Рада§! будет охотнее одобрять увеличение военного бюджета.§!\n\n§GНаши инженеры уже завершили проект §YВоздушной системы предупреждения и управления§!, поэтому работа пойдёт §Gбыстрее§! и обойдётся §Gдешевле§!.§!"
 UKR_restore_an_71_without_project: "Возобновить работы над §YАн-71§!\nсамолётом ДРЛО §R(нет проекта ДРЛО)§!"
 UKR_restore_an_71_without_project_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_soviet_an_71_development_for_tooltip\n\n\n\n\n\n\n\n\n§W§YАн-71§! — самолёт дальнего радиолокационного обнаружения, построенный §LАНТК им. Антонова§! на базе транспортного §YАн-72§!, с обтекателем радара на вершине стреловидного вперёд киля. Он впервые поднялся в воздух 12 июля 1985 года, чтобы управлять §Rсоветской§! фронтовой авиацией, но программа закончилась вместе с §RСоветским Союзом§!, а его радар §Y«Вега-М» «Квант»§! так и не справился полностью с отражениями от земли.\nОпытный экземпляр §Y№ 03§! после 362 полётов по-прежнему стоит на «Антонове», а Индия проявляла интерес к покупке этого типа. Возобновление программы дало бы нашим ВВС собственный самолёт ДРЛО.\n\n§GОсобо важный военный проект:§! после его завершения §YВерховная Рада§! будет охотнее одобрять увеличение военного бюджета.§!\n\n§RМы не завершили проект §YВоздушной системы предупреждения и управления§!, поэтому «Антонову» придётся начинать с нуля: работа займёт §Rбольше времени§! и обойдётся §Rдороже§!. Проект будет завершён попутно.§!"
 UKR_restore_an_71_phalcon_mission: "Одобрение Израиля для §YPhalcon§!"
 UKR_restore_an_71_phalcon_mission_desc: "§WElta поставит радар §YPhalcon§! для §YАн-71§!, только если Иерусалим доверяет нам достаточно, чтобы одобрить экспорт. Сам радар будет готов вовремя, но сделка зависит от политики.\n\n§YТребования:§!\n- Мнение §YИзраиля§! о нас не ниже §Y40§!\n- Наше влияние на §YИзраиль§! больше §Y5%§!\n\nВ случае неудачи сделка отменяется, и Израиль возвращает лишь часть денег.§!"
 ukraine_modernize_planes_restore_an_71_kvant_fast_tt: "Примерно через §Y4 месяца§! §YАн-71§! снова поднимется в воздух с советским радаром §Y«Квант»§! (§Y$weap_buff_awacs_1$§!)."
 ukraine_modernize_planes_restore_an_71_kvant_slow_tt: "Примерно через §Y6 месяцев§! §YАн-71§! снова поднимется в воздух с советским радаром §Y«Квант»§! (§Y$weap_buff_awacs_1$§!). Проект §YВоздушной системы предупреждения и управления§! будет завершён попутно."
 ukraine_modernize_planes_restore_an_71_phalcon_fast_tt: "Израильский радар §YPhalcon§! будет готов примерно через §Y3 месяца§!, но §YАн-71У§! полетит с ним (§Y$weap_buff_awacs_2$§!), только если Израиль одобрит экспорт (см. миссию)."
 ukraine_modernize_planes_restore_an_71_phalcon_slow_tt: "Израильский радар §YPhalcon§! будет готов примерно через §Y5 месяцев§!, но §YАн-71У§! полетит с ним (§Y$weap_buff_awacs_2$§!), только если Израиль одобрит экспорт (см. миссию). Проект §YВоздушной системы предупреждения и управления§! будет завершён попутно."
 ukraine_modernize_planes_restore_an_71_phalcon_mission_tt: "В течение §Y6 месяцев§! мнение §YИзраиля§! о нас должно достичь §Y40§!, а наше влияние на Израиль должно превысить §Y5%§!. Иначе Израиль отменит сделку и вернёт лишь §Rчасть§! денег."
 ukraine_modernize_planes_restore_an_71_kvant_after_israel_tt: "§GИзраиль возвращает часть денег§!. Примерно через §Y3–5 месяцев§! §YАн-71§! полетит с советским радаром §Y«Квант»§! (§Y$weap_buff_awacs_1$§!). §RРоссийское§! влияние на нас §Rнемного растёт§!."
 ukraine_modernize_planes_restore_an_71.6.name: "Израиль отменяет сделку по радару"
 ukraine_modernize_planes_restore_an_71.6.desc: "Отношения с Израилем не достигли уровня, необходимого для одобрения экспорта радара §YPhalcon§!. Иерусалим заморозил контракт и согласился вернуть часть денег. «Антонову» остаётся только вернуться к советскому радару, а Москва с интересом наблюдает за ситуацией."
 ukraine_modernize_planes_restore_an_71.6.a: "Вернуться к §Y«Кванту»§! с «Вегой-М»"
 UKR_an_71_phalcon_ready_flag: "Израильский радар §YPhalcon§! для §YАн-71§! готов."
 ukraine_rada.3.t: "Большинство собирается в Украинском доме"
 ukraine_rada.3.d: "Двести тридцать семь депутатов покинули сессионный зал и зарегистрировались через дорогу, в Украинском доме. Левые по-прежнему удерживают зал, трибуну и табло для голосования, поэтому новое пропрезидентское большинство проголосовало вне здания за отставку председателя Александра Ткаченко и его заместителя-коммуниста Адама Мартынюка. Ткаченко называет это путчем, не покидает кабинет и отказывается открывать заседание, которое не может контролировать. Обе половины Верховной Рады теперь называют себя парламентом, и той, которую признаем мы, им и быть."
 ukraine_rada.3.a: "Признать голосование большинства"
 ukraine_rada.3.b: "Велеть нашим людям вернуться в зал"
 ukraine_rada.4.t: "Иван Плющ занимает кресло председателя"
 ukraine_rada.4.d: "Большинство избрало председателем Верховной Рады Ивана Плюща. Он руководил парламентом, проголосовавшим за независимость в 1991 году, и ни у кого нет сомнений, чей он кандидат. Но главный приз достался его первому заместителю: социал-демократ Виктор Медведчук теперь контролирует повестку дня, списки комитетов и время каждого голосования. Левые вернулись в зал, потому что больше им ничего не оставалось, и законопроекты, застрявшие на год, наконец можно поставить на голосование."
 ukraine_rada.4.a: "Зал снова наш"
 ukraine_rada.5.t: "«Солидарность» и конец двух фракций"
 ukraine_rada.5.d: "Реестр фракций перекроили за один день. Пётр Порошенко собрал семнадцать депутатов в новую группу «Солидарность», а Крестьянская партия Александра Ткаченко и остатки «Громады» Павла Лазаренко опустились ниже минимума и прекратили существование. Около тридцати депутатов теперь внефракционные, и их обхаживают все, кому есть что предложить в комитетах. В зале изменилась только арифметика, но в этом парламенте арифметика и есть политика."
 ukraine_rada.5.a: "Распределить их между группами большинства"
 ukraine_rada.5.b: "Оставить их левым"
 ukraine_rada.6.t: "«Независимые» распадаются"
 ukraine_rada.6.d: "«Независимые» перестали притворяться группой. Их депутатов никогда не связывало ничего, кроме удобства зарегистрированного названия, а раз места в комитетах раздают внутри большинства, оставаться вне его больше нет смысла. Большинство ушли в «Возрождение регионов» Александра Волкова, несколько — в «Трудовую Украину», а горстка — никуда. В зале на одну группу меньше, а у большинства — ещё несколько голосов, на которые можно рассчитывать."
 ukraine_rada.6.a: "Пересчитать голоса"
 ukraine_rada.7.t: "Всеукраинский референдум"
 ukraine_rada.7.d: "Проголосовал восемьдесят один процент избирателей, и каждый вопрос получил более восьмидесяти процентов голосов. Теперь президент может распустить Верховную Раду, если она не сформирует большинство или не примет бюджет вовремя, депутаты лишаются неприкосновенности, число мест должно сократиться с четырёхсот пятидесяти до трёхсот, а также должна появиться вторая палата, представляющая регионы. Результат обязателен, но сам по себе бесполезен: внести его в конституцию могут только сами депутаты. А этим депутатам четыре пятых страны только что сказали, что их места и неприкосновенность в наших руках."
 ukraine_rada.7.a: "Заставить Раду внести результат в конституцию"
 ukraine_rada.7.b: "Взять мандат и не трогать конституцию"
 ukraine_rada.8.t: "«Трудовая Украина» становится партией"
 ukraine_rada.8.d: "Депутатская группа Сергея Тигипко и Игоря Шарова зарегистрировалась как политическая партия. До сегодняшнего утра «Трудовая Украина» была строчкой в реестре парламентских групп и телефонным списком днепропетровских директоров. С сегодняшнего дня у неё есть устав, съезд и региональные отделения, и она намерена использовать всё это. Деньги, которые раньше шли на кампании депутатов поодиночке, теперь пойдут в машину, а платит за неё членами Народно-демократическая партия."
 ukraine_rada.8.a: "Теперь кланы строят партии"
 ukraine_rada.9.t: "У «Яблука» появилась фракция"
 ukraine_rada.9.d: "Михаил Бродский наконец собрал нужные подписи, и у партии «Яблуко» появилась собственная фракция в Верховной Раде. Почти весь год её депутаты голосовали с большинством, оставаясь вне его, а теперь будут делать это изнутри, получив место за столом, где делят комитеты. Это маленькая фракция мелких предпринимателей, и её цена — дерегуляция, а не должности."
 ukraine_rada.9.a: "Принять их в большинство"
 ukraine_rada.9.b: "Пусть голосуют по каждому законопроекту отдельно"
 ukraine_rada.10.t: "Партия регионов"
 ukraine_rada.10.d: "Партия регионального возрождения Украины провела объединительный съезд с четырьмя небольшими партиями и вышла из него под новым названием: Партия регионов. Председателем стал глава налоговой администрации Николай Азаров, Владимир Рыбак остался в руководстве, а деньги по-прежнему у донецких директоров. В программе ничего не изменилось: регионы против центра, промышленность против киевских банков. Но название теперь достаточно короткое, чтобы поместиться в бюллетене, ради чего его и меняли."
 ukraine_rada.10.a: "У Востока есть партия"
 ukraine_rada.13.t: "Правительство промышленников"
 ukraine_rada.13.d: "Анатолий Кинах утверждён премьер-министром. Он десять лет руководил Союзом промышленников и предпринимателей и является кандидатом директоров: никакой программы реформ, никаких ссор с энергетическими трейдерами и никакого желания повторить ошибку предшественника и кого-либо проверять. Большинство, развалившееся из-за Ющенко, собралось вновь вокруг человека, которого никто не боится, и президент снова получил своё правительство."
 ukraine_rada.13.a: "Компетентность без энтузиазма"
 ukraine_rada.14.t: "Блок Тимошенко"
 ukraine_rada.14.d: "То, что в феврале началось как форум национального спасения, когда половина оппозиции собралась требовать отставки президента, превратилось в избирательный блок. Его ядро — «Батькивщина», а его имя и лицо — сорокалетняя женщина, вышедшая из тюрьмы в марте. У блока нет денег, которые правительство не пыталось бы изъять, и нет телевидения, которое бы его показывало, но это единственная часть оппозиции, организованная для кампании, а не для протеста."
 ukraine_rada.14.a: "У оппозиции есть имя"
 ukraine_gongadze.1.t: "Расследования «Украинской правды»"
 ukraine_gongadze.1.d: "Интернет-газета без типографии, без лицензии и с редакцией из шести человек стала единственным изданием в стране, которое печатает то, о чём молчат другие. Георгий Гонгадзе и «Украинская правда» публикуют серию материалов о приватизации энергетики, о том, кому принадлежат региональные телеканалы, и о людях, которые подписываются под тем и другим. Ничто из этого не новость для кого-либо в этом здании. Новость в том, что всё это записано, датировано и доступно любому, у кого есть модем. Глава налоговой администрации спросил, не совсем спрашивая, стоит ли редакции ждать визита."
 ukraine_gongadze.1.a: "Стоит. Отправить проверяющих."
 ukraine_gongadze.1.b: "Пусть пишет. Интернет никто не читает."
 ukraine_gongadze.2.t: "Последствия давления"
 ukraine_gongadze.2.d: "Проверяющие пришли и ушли, сервер однажды изъяли и вернули, а газета всё ещё выходит. Гонгадзе написал открытое письмо Генеральному прокурору о том, что за ним следят, и попросил зафиксировать этот факт, разослав копии во все посольства в Киеве. Люди, которых попросили его утихомирить, теперь хотят знать, как далеко им позволено зайти, и хотят услышать это так, чтобы на бумаге ничего не осталось."
 ukraine_gongadze.2.a: "Пусть это станет личным."
 ukraine_gongadze.2.b: "Ограничиться бумагами: проверки, суды, лицензии."
 ukraine_gongadze.3.t: "Новая волна разоблачений"
 ukraine_gongadze.3.d: "Игнорирование не сработало. Следующая серия уже анонсирована: финансирование прошлой президентской кампании, с названиями счетов и именами посредников. Оценка МВД, переданная устно и нигде не записанная, гласит, что журналист перестал быть раздражителем и стал угрозой для системы. Ответить на это можно двумя способами, которые не связаны с тем, о чём в этой комнате все подумали в первую очередь."
 ukraine_gongadze.3.a: "Предложить ему место в новом антикоррупционном комитете."
 ukraine_gongadze.3.b: "Пусть силовики отпугнут его навсегда."
 ukraine_gongadze.4.t: "Журналист замолкает"
 ukraine_gongadze.4.d: "Серия так и не вышла. Гонгадзе перестал публиковаться, отключил телефон и уехал из Киева: коллеги говорят, что в Прагу, мать говорит, что не знает. Газета продолжает выходить, о другом пишут другие люди, а приватизация энергетики ушла с первых полос. Нет тела, нет плёнок и нет площади, полной палаток. Есть лишь вполне ясное понимание у каждого редактора в стране того, что бывает с теми, кто не останавливается."
 ukraine_gongadze.4.a: "Вопрос закрыт."
 ukraine_gongadze.5.t: "Журналист уходит в подполье"
 ukraine_gongadze.5.d: "Он перестал писать, чего и добивались, и все, кто это заказывал, доложили наверх об успехе. Но работать он не перестал. Шесть недель он ночует в чужих квартирах, собирает документы, которые раньше не мог опубликовать, и говорит двум коллегам, знающим, где он, что следующий материал будет тем самым, главным. Людям, которым велели его припугнуть, теперь сообщили, что запугивание не подействовало."
 ukraine_gongadze.5.a: "Тогда им скажут кое-что другое."
 ukraine_yushchenko.1.t: "Премьер-министр нарушает строй"
 ukraine_yushchenko.1.d: "Пока на площади ещё стоят палатки, премьер-министр дал интервью. Он не называет протестующих экстремистами, не защищает Администрацию и дважды говорит, что государство не должно применять силу против собственных граждан. Его аппарат настаивает, что это не было политическим заявлением. Все газеты страны подали его именно так. Бизнес-группы, оплачивающие большинство в Раде, всё утро выясняли, чьё это правительство."
 ukraine_yushchenko.1.a: "Вызвать его и заставить сказать обратное."
 ukraine_yushchenko.1.b: "Промолчать. Его избиратели — и наши избиратели."
 ukraine_yushchenko.2.t: "Письмо троих"
 ukraine_yushchenko.2.d_summoned: "Он пришёл, выслушал и ни на что не согласился. Вместо этого Администрация подготовила совместное письмо за подписями президента, председателя Рады и премьер-министра, в котором протестное движение названо украинской разновидностью национал-социализма, а его организаторы — людьми, готовыми сжечь страну, лишь бы избавиться от одного человека. Плющ подписывает его сегодня. Третья подпись — единственная, которая имеет значение, потому что только её появление кого-то удивит."
 ukraine_yushchenko.2.d_ignored: "Ему ничего не сказали, и сам он больше ничего не говорил, что Администрация решила считать согласием. Подготовлено совместное письмо за подписями президента, председателя Рады и премьер-министра, в котором протестное движение названо украинской разновидностью национал-социализма. Плющ подписывает его сегодня. Ющенко пока никто не спросил, подпишет ли он, а проект ушёл в его секретариат так, будто ответ очевиден."
 ukraine_yushchenko.2.a: "Его подпись будет на письме."
 ukraine_yushchenko.2.b: "Пусть письмо выйдет только за нашей подписью."
 ukraine_yushchenko.3.t: "За закрытыми дверями"
 ukraine_yushchenko.3.d: "Вопрос о премьер-министре переместился из газет в столовую загородного дома под Киевом. Люди за этим столом хотят его убрать не из-за протестов. Они хотят его убрать, потому что он покончил с бартерными схемами на энергорынке, начал выплачивать пенсионные долги живыми деньгами и стал выяснять, какие компании освобождены от каких налогов и по чьему распоряжению. Голосов в Раде у них хватит, чтобы сделать это в любой момент. Сегодня вечером они обсуждают цену и то, кто её заплатит."
 ukraine_yushchenko.3.a: "Пусть назовут свою цену."
 ukraine_yushchenko.3.b: "Сказать им, что премьер-министр не продаётся."
 ukraine_yushchenko.4.t: "Администрация решает"
 ukraine_yushchenko.4.d: "Ответить нужно на этой неделе. Оставить его — значит иметь правительство, которое не выполняет указаний, Администрацию, неспособную навести порядок в собственном кабинете, и большинство в Раде, которое назло начнёт голосовать по-своему. Убрать его — значит подарить оппозиции самого популярного человека в стране, безработного, которому нечего терять и чью репутацию никто не может отнять. Третьего ответа нет, и те, кто хочет его убрать, перестали делать вид, что он может быть."
 ukraine_yushchenko.4.a: "Отправить его в отставку. Пусть Рада оформит это официально."
 ukraine_yushchenko.4.b: "Оставить его, но отнять все оставшиеся у него назначения."
 UKR_tarashcha_shadow_idea: "Тень Таращанского леса"
 UKR_tarashcha_shadow_idea_desc: "Обезглавленное тело в лесу под Киевом, опознание, которое государство оспаривает, и дело, которое никто в прокуратуре не хочет брать. Теперь каждое решение в офисе президента читают через эту призму."
 UKR_cassette_scandal_idea: "Кассетный скандал"
 UKR_cassette_scandal_idea_desc: "Сотни часов записей, сделанных из-под дивана в кабинете самого президента. Иностранные кредиторы перестали перезванивать, министерства перестали подписывать что-либо, что потом могут зачитать вслух, а каждый чиновник в стране теперь исходит из того, что его записывают."
 ukraine_gongadze.6.t: "Тело в Таращанском лесу"
 ukraine_gongadze.6.d: "Сельские жители нашли его в неглубокой могиле в лесу под Таращей, без головы, и местный судмедэксперт шесть недель держал тело у себя, прежде чем кому-то в Киеве сообщили. Украшения — его, травмы одной руки совпадают с его старым переломом, а коллеги опознали то, что осталось. Генеральный прокурор объявил, что останки принадлежат неизвестному мужчине и экспертиза продолжается. Ему никто не верит, и, похоже, он и не ждёт, что поверят."
 ukraine_gongadze.6.a: "Останки не опознаны. Так и сказать и повторять это."
 ukraine_gongadze.6.b: "Подтвердить опознание и возбудить дело об убийстве."