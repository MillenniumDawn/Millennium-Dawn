 CHI.conservatism: "£CHI_conservative (UOCN) 中国民族主义联盟"
 CHI.conservatism_icon: "£CHI_conservative"
 CHI.conservatism_desc: "(右翼三民主义) - 中国民族主义联盟，也被称为中国泛蓝联盟，是一个致力于中国统一的自由保守政党。该党崇尚自由民主，并奉行三民主义理念。"
 CHI.liberalism: "£CHI_liberal 中国民主党"
 CHI.liberalism_icon: "£CHI_liberal"
 CHI.liberalism_desc: "(改良主义) - 中国民主党在中华人民共和国是被取缔的政党。改良主义和自由民主是其核心价值观。据大多数西方消息来源称，该组织由民主活动人士和天安门广场抗议活动的前学生领袖组成。"
 CHI.socialism: "£CHI_social_democrat 民主中国阵线"
 CHI.socialism_icon: "£CHI_social_democrat"
 CHI.socialism_desc: "(进步大西洋主义) - 民主中国阵线是一个总部位于加拿大的组织，主张推动中华人民共和国实现民主化。他们是中国和海外最大的民主运动团体之一。"
 CHI.Autocracy: "£CHI_pro_emerging_autocrat 中国民主同盟"
 CHI.Autocracy_icon: "£CHI_pro_emerging_autocrat"
 CHI.Autocracy_desc: "(务实专制主义)  - 中国民主同盟是统一战线的九大成员之一，也是中国境内少数合法政党之一。其成员倡导中华民族的爱国主义和基本社会主义。"
 CHI.anarchist_communism: "£CHI_left_wing_radical 中国国民党革命委员会"
 CHI.anarchist_communism_icon: "£CHI_left_wing_radical"
 CHI.anarchist_communism_desc: "(左翼三民主义) - 中国国民党革命委员会是组成中国统一战线的九名成员之一。它倡导三民主义、左翼民族主义和民主社会主义。该党被视为仅次于中国共产党的第二大政党，因此在人民政治协商会议中拥有最多的席位。此外，他们是少数获准经营和维护党产的民主党派之一。"
 CHI.Caliphate: "£CHI_salafist_jihadism 突厥斯坦伊斯兰党"
 CHI.Caliphate_icon: "£CHI_salafist_jihadism"
 CHI.Caliphate_desc: "（突厥伊斯兰主义）- 突厥斯坦伊斯兰党成立于1997年，活动遍及亚洲多个国家。该组织倡导维吾尔族、严格的伊斯兰原教旨主义以及突厥民族的团结。该组织被认定为恐怖组织，并与塔利班、基地组织等众多类似组织存在联系。"
 CHI.neutral_Social: "£CHI_neutral_social_democrat 中国民主促进会"
 CHI.neutral_Social_icon: "£CHI_neutral_social_democrat"
 CHI.neutral_Social_desc: "(左翼实用主义) - 该党成立于1945年末，作为中国共产党的另一替代选择，也是规模最大的少数党派之一。"
 CHI.Neutral_Communism: "£CHI_neutral_communism （MCPC）中国毛主义共产党"
 CHI.Neutral_Communism_icon: "£CHI_neutral_communism"
 CHI.Neutral_Communism_desc: "（东方新左派） - 中国毛主义共产党是中华人民共和国的一个地下反修正主义的共产党。他们力图推翻中国共产党的修正主义统治集团，实现真正的共产主义。"
 CHI.Nat_Autocracy: "£CHI_military_junta (PLA) 人民解放军"
 CHI.Nat_Autocracy_icon: "£CHI_military_junta"
 CHI.Nat_Autocracy_desc: "(红色军政府)  - 中国人民解放军成立于1927年南昌起义。它是中华人民共和国及其创始政党的武装部队。"
 CHI.Monarchist: "£CHI_monarchism 爱新觉罗皇室"
 CHI.Monarchist_icon: "£CHI_monarchism"
 CHI.Monarchist_desc: "（帝制统治） - 爱新觉罗皇室统治中国近276年，直到隆裕皇后颁布退位诏书，宣告幼帝溥仪退位。满族统治的王朝在中国官方历史上常常因其在向外国列强妥协以及对汉族多数民族的压迫而受到谴责。"
 PER.conservatism: "£PER_IDF (IDF) - 伊朗民主阵线"
 PER.conservatism_desc: "（亲民主保守主义）- 伊朗民主阵线\n\n伊朗民主阵线是一个倡导在伊朗建立民主政府的政治组织。该组织以反对伊朗伊斯兰共和国为由成立，声称现政权系统性地侵犯人权并从事恐怖活动。该党提倡建立一个世俗的民主阵线，强调通过民众运动取代伊朗伊斯兰共和国的必要性。该党支持伊朗的领土完整和政教分离。"
 PER.liberalism: "£PER_ISDP (ISDP) - 伊朗世俗民主党"
 PER.liberalism_desc: "（自由民主主义）- 伊朗世俗民主党\n\n该党旨在组建世俗民主阵线，推翻伊朗伊斯兰政府，在伊朗建立世俗民主政府。该党的核心议题是人权和宗教自由。"
 PER.socialism: "£PER_socialism (IP) - 伊朗党"
 PER.socialism_desc: "（自由社会主义）- 伊朗党\n\n伊朗党，通常被认为是民族阵线党的骨干。伊朗党主要由受欧洲教育的技术官僚创建，在伊朗推行社会民主主义和自由民族主义。"
 PER.Western_Autocracy: "£PER_Western_Autocracy (CPI)  - 伊朗立宪党 (§C自由民主派§!)"
 PER.Western_Autocracy_icon: "£PER_Western_Autocracy"
 PER.Western_Autocracy_desc: "（专制君主主义） - 伊朗立宪党\n\n伊朗立宪党（自由民主派）期待着礼萨·巴列维的回归，并强烈谴责推翻他的革命者。尽管他们不希望建立绝对君主制，但相较于其他立宪团体，他们暗示应赋予沙阿更直接的权力。"
 PER.Conservative: "£PER_IRGC (IRGC)  - 伊斯兰革命卫队 - 政治部门"
 PER.Conservative_desc: "（霍梅尼主义 - 军国主义） - 伊斯兰革命卫队\n\n伊斯兰革命卫队是伊朗武装部队的一个分支，于1979年4月22日伊朗革命后根据阿亚图拉鲁霍拉·霍梅尼的命令成立，旨在保卫伊朗边境和维持内部秩序。该组织已扩展到政治领域，许多前成员作为强硬派竞选公职。"
 PER.Autocracy: "£PER_autocracy (STQ)  - 库姆神学院教师协会"
 PER.Autocracy_desc: "（霍梅尼主义 - 原则派） - 库姆神学院教师协会\n\n库姆神学院教师协会是由一群阿亚图拉霍梅尼的学生建立的，目的是组织霍梅尼追随者的政治活动并宣传他对伊斯兰教的革命性诠释，例如“法基赫的监护”（伊斯兰政府）的理念。"
 PER.Vilayat_e_Faqih: "£PER_Vilayat_e_Faqih (FoP)  - 原则主义派追随者"
 PER.Vilayat_e_Faqih_desc: "（霍梅尼主义 - 原则派） - 伊朗伊斯兰共和国的强硬派政治联盟 - 原则派 - 奉行极端保守、激进且民族主义的霍梅尼主义。他们与改革派并列为共和国两大主要政治联盟，由多个政党和组织组成，内部也存在派系斗争。"
 PER.Mod_Vilayat_e_Faqih: "£PER_Mod_Vilayat_e_Faqih  (RFS)   - 改革派"
 PER.Mod_Vilayat_e_Faqih_desc: "（霍梅尼主义 - 改革派） - 改革派代表了伊朗伊斯兰共和国内部较为自由派人士的广泛联盟，他们的大部分信念都与更为改革的自由主义纲领相一致。他们致力于伊斯兰共和国的现代化和民主化，其最终目标各不相同，有的主张维护伊斯兰共和国的现有体制，有的则主张走向更加开放的体制。历史上，该团体最杰出的成员是各种左翼人士，他们原本在伊朗国内没有其他政治途径 - 尽管该团体内部也包括进步派、自由派、社会民主党人和温和保守派。"
 PER.anarchist_communism: "£PER_anarchist_communism  (MEK)  - 伊朗人民圣战者组织"
 PER.anarchist_communism_icon: "£PER_anarchist_communism"
 PER.anarchist_communism_desc: "（伊斯兰马克思主义） - 伊朗人民圣战者组织\n\n伊朗人民圣战者组织成立于1965年，旨在反对巴列维王朝，其创立原则深受马克思主义和伊斯兰主义影响。该组织通常被称为“类邪教团体”，因其党内架构完全围绕玛丽亚姆·拉贾维和马苏德·拉贾维夫妇运作。伊朗人民圣战者组织致力于推行一系列计划，推动伊朗向联邦化、社会主义国家转型。"
 PER.Caliphate: "£generic_Caliphate_small (IS–KP)  - 伊斯兰国 - 呼罗珊省"
 PER.Caliphate_desc: "（萨拉菲圣战主义）- 伊斯兰国的“呼罗珊省”是一个未被国际社会承认的、自封的行政区域，其范围涵盖伊朗、阿富汗、巴基斯坦和中亚的部分地区，以历史上的呼罗珊地区为中心。在意识形态上，该组织与伊斯兰国的其他部分秉持相同的信仰体系，融合了伊斯兰民族主义、萨拉菲主义、瓦哈比主义以及逊尼派伊斯兰教中其他一些极端保守派别的影响。"
 PER.Neutral_conservatism: "£PER_Neutral_conservatism (NFI)  - 伊朗民族阵线"
 PER.Neutral_conservatism_desc: "（公民民族主义） - 伊朗民族阵线\n\n国民阵线是穆罕默德·摩萨台创立的伊朗民族主义政党。在穆罕默德·礼萨·巴列维统治期间，政治气氛变得如此严格，以致国民阵线在几年后不复存在。最后，在1977年国王的统治正在慢慢结束时，卡里姆·桑贾比复兴了国民阵线并恢复其在伊朗境内的活动，直到被阿亚图拉政权取缔。"
 PER.oligarchism: "£PER_oligarchism (OI)   - 伊朗寡头"
 PER.oligarchism_desc: "（技术官僚寡头）- 伊朗寡头\n\n伊朗的寡头大多来自两个行业。要么是石油行业，要么是伊朗革命卫队。这两个团体有一个共同点，那就是与当时的统治阶层关系密切。由于他们的职位而建立的这种密切关系使某些人通过获得独家交易而变得非常富有。伊朗寡头往往具有技术官僚倾向，将经济和科学发展置于个人自由等其他事物之上。"
 PER.neutral_Social: "£PER_OIPFM (OIPFM)  -  伊朗人民卫队组织 - 多数派"
 PER.neutral_Social_desc: "（社会民主主义/马克思列宁主义同情者） - 伊朗人民卫队组织 - 多数派\n\n伊朗人民卫队组织 - 多数派，又名伊朗人民自我牺牲者组织，是伊朗左翼反对派政党。伊朗人民卫队组织主张建立伊朗世俗共和国，推翻现任伊朗伊斯兰共和国政府。伊朗人民卫队组织是伊朗人民卫队组织游击队众多分支之一，该组织被认为是1980年至1991年间伊朗最大的共产主义组织之一。与伊朗人民自我牺牲者组织 - 少数派不同，多数派一直保持着一个有凝聚力的政党，没有分裂成多个对立派系。"
 PER.Neutral_Libertarian: "£PER_neutral_Social (FMI)  - 伊朗自由运动"
 PER.Neutral_Libertarian_desc: "（伊斯兰民主主义）- 伊朗自由运动\n\n伊朗自由运动自称是“穆斯林、伊朗人、立宪主义者和摩萨台主义者”。它是伊朗最古老的政党之一，也是伊朗伊斯兰共和国的半反对派。伊朗自由运动基于对伊斯兰教的温和解读。它反对王室和教士独裁，支持政治和经济自由主义。"
 PER.Neutral_Autocracy: "£PER_Neutral_Autocracy  (FoM)  -  蒙塔泽里的追随者"
 PER.Neutral_Autocracy_desc: "（伊斯兰民主主义）- 阿亚图拉蒙塔泽里的追随者\n\n蒙塔泽里追随者是一个由伊斯兰民主党人、神职人员和工人组成的联盟和广泛运动，旨在推动阿亚图拉·蒙塔泽里成为伊朗下一任最高领袖。蒙塔泽里被阿亚图拉·霍梅尼剥夺继承权后，被政府赶出政坛。他的追随者主要由学者和学术界人士组成，但他也得到了改革派政客和伊斯兰共和国反对派团体的大力支持。"
 PER.Neutral_Communism: "£PER_Neutral_Communism (WPI)   - 伊朗工人共产党"
 PER.Neutral_Communism_desc: "（工人主义） - 伊朗工人共产党\n\n伊朗工人共产党成立于1991年，旨在推翻伊斯兰共和国，并在其基础上建立一个社会主义共和国。"
 PER.Neutral_green: "£PER_Neutral_green (GPI)   - 伊朗绿党"
 PER.Neutral_green_desc: "（环保主义）- 伊朗绿党\n\n伊朗绿党对伊朗环境部持激进立场，认为该政府机构是伊斯兰共和国管理不善的掩盖者。"
 PER.Neutral_Muslim_Brotherhood: "£PER_Neutral_Muslim_Brotherhood (GPH)   - 希望的绿色之路"
 PER.Neutral_Muslim_Brotherhood_desc: "（第三道路）- 希望的绿色之路\n\n希望的绿色之路由米尔·侯赛因·穆萨维创立，是一个伊朗协会，致力于通过和平手段寻求民主之路。穆萨维选择选择“道路”而不是“政党”，因为政党必须得到政府的批准，而穆萨维并不认为政府是合法的。希望的绿色之路是一场改良主义运动，融合了共和主义者和温和的伊斯兰理想，形成其核心意识形态。"
 PER.Nat_Autocracy: "£PER_military_junta  (AJA)   - 伊朗武装力量"
 PER.Nat_Autocracy_desc: "（军国主义）- 伊朗武装力量\n\n伊朗武装力量，即伊朗军队，成立于公元前550年，其现代形态形成于1921年巴列维王朝崛起时期。无论在巴列维时代和伊斯兰共和国时期，伊朗军队在国内事务中基本上保持非政治立场。纵观历史，伊朗军队始终效忠于当权政府，但在伊朗政治史上的某些时刻也曾进行过干预。"
 PER.Nat_Fascism: "£PER_fascism_alt  (TPS)   - 人民之春"
 PER.Nat_Fascism_desc: "（新保守民族主义） - 人民之春\n\n“偏差潮流”一词由反对该运动的人士所创造，该运动旨在创建一个伊朗伊斯兰学派。该运动由埃斯凡迪亚尔·马沙伊领导，旨在将神职人员从任何权威职位上移除，并提倡他们与真主建立直接联系。该运动利用伊朗民族主义，并试图将其与伊斯兰民族主义融为一体，以争取社会各界的支持。"
 PER.Nat_Populism: "£PER_Nat_Populism_small (PIP)   - 泛伊朗党"
 PER.Nat_Populism_icon: "£PER_Nat_Populism_small"
 PER.Nat_Populism_desc: "泛伊朗主义 - 泛伊朗党\n\n1952年，泛伊朗主义党成立，旨在推动伊朗人民的统一，并归还伊朗在18世纪和19世纪的屈辱和战败时期失去的领土。他们强烈反对外国势力介入伊朗和地区事务，高度重视民族独立。"
 PER.Monarchist: "£PER_monarchism  (HoP)  - 巴列维王朝"
 PER.Monarchist_desc: "（绝对君主制） - 巴列维王朝\n\n巴列维王朝因其在伊朗现代化进程中的成就以及为现代伊朗民族主义奠定基础而备受推崇。巴列维王朝力图通过推行世俗化和加强与西方国家的联系来推进现代化进程，但这往往使其与国内的伊斯兰主义和反西方势力产生冲突。"
 POL.conservatism: "£POL_conservatism_small 法律与公正党"
 POL.conservatism_icon: "£POL_conservatism_small"
 POL.conservatism_desc: "保守党-法律与公正党是占据主导地位的波兰民族保守派基督教民主党，国家干预主义和社会福利主义相结合，具有社会保守观念。它主张与欧盟进行谨慎合作，并坚决反对俄罗斯。"
 POL.conservatism_1: "£POL_conservatism_1_small 法律与公正党"
 POL.conservatism_1_icon: "£POL_conservatism_1_small"
 POL.conservatism_1_desc: "保守党 - 法律与公正是占主导地位的波兰民族保守党、基督教民主党，将经济干预主义和社会福利与社会保守主义观点相结合。它主张与欧盟谨慎合作，坚决反俄。"
 POL.liberalism: "£POL_liberalism_small 公民纲领"
 POL.liberalism_desc: "自由主义 - 公民纲领是一个中间派的波兰政党，倡导自由主义经济和亲欧洲，中立偏右翼的社会立场。"
 POL.liberalism_icon: "£POL_liberalism_small"
 POL.liberalism_1: "£POL_liberalism_1_small 公民纲领"
 POL.liberalism_1_desc: "自由党 - 公民纲领是一个中间派的大帐篷波兰政党，提倡秩序自由主义经济和亲欧洲的中右翼社会立场。"
 POL.liberalism_1_icon: "£POL_liberalism_1_small"
 POL.socialism: "£POL_socialism_small 民主左翼联盟"
 POL.socialism_icon: "£POL_socialism_small"
 POL.socialism_desc: "社会民主党 - 民主左翼联盟是一个中左翼的第三条道路党，具有后共产主义的根源。它的政策可以被描述为亲欧、经济干预主义和社会中间主义。"
 POL.Conservative: "£POL_Conservative_small 波兰共和国自卫党"
 POL.Conservative_icon: "£POL_Conservative_small"
 POL.Conservative_desc: "反动派 - 波兰共和国自卫党是一个左翼民粹主义保守党，以其有争议的竞选活动而闻名。它是欧洲怀疑论者，并不反对与俄罗斯和其他后苏联国家的合作。"
 POL.Conservative_2017: "£generic_Conservative_small 变革党"
 POL.Conservative_2017_desc: "反动派 - 变革党是一个亲俄、反西方的政党，与俄罗斯情报部门有联系。"
 POL.anarchist_communism: "£generic_anarchist_communism_small 波兰社会党"
 POL.anarchist_communism_desc: ""
 POL.Neutral_conservatism_2017: "£POL_Neutral_conservatism_2017_small 库奇兹15"
 POL.Neutral_conservatism_2017_icon: "£POL_Neutral_conservatism_2017_small"
 POL.Neutral_conservatism_2017_desc: "保守派 - 库奇兹15是一个由各种中右翼到右翼活动家和政治新人的协会，以其领导人 - 前音乐家帕威尔·库奇兹的名字命名，它诞生于反建制情绪，假设打破政党在议会中的垄断，选举改革和直接民主。"
 POL.oligarchism: "£POL_oligarchism_small 波兰人民党"
 POL.oligarchism_icon: "£POL_oligarchism_small"
 POL.oligarchism_desc: "农业派 - 波兰人民党是一个土地基督教民主党，在农村拥有坚定的选民。它提倡支持农业的保护主义政策。"
 POL.neutral_Social: "£POL_neutral_Social_small 劳动联盟"
 POL.neutral_Social_icon: "£POL_neutral_Social_small"
 POL.neutral_Social_desc: ""
 POL.neutral_Social_2017: "£POL_neutral_Social_2017_small 一起"
 POL.neutral_Social_2017_icon: "£POL_neutral_Social_2017_small"
 POL.neutral_Social_2017_desc: "社会民主派 - 一起是一个左翼、进步的波兰政党，主张引入具有强有力的劳动法、福利和累进税制的民主社会主义制度，反对私有化和放松管制。"
 POL.Neutral_Libertarian: "£generic_Neutral_Libertarian_small 自由党"
 POL.Neutral_Libertarian_desc: ""
 POL.Neutral_Libertarian_2017: "£POL_Neutral_Libertarian_2017_small 自由"
 POL.Neutral_Libertarian_2017_icon: "£POL_Neutral_Libertarian_2017_small"
 POL.Neutral_Libertarian_2017_desc: "自由派 - 自由是一个以其领导人雅努什·科尔温-米克为中心的保守-自由党，主张减少政府的作用、广泛的私有化和放松管制，同时保持保守的意识形态立场。"
 POL.Neutral_green: "£generic_Neutral_green_small 波兰生态党 - 绿党"
 POL.Neutral_green_desc: ""
 POL.Neutral_green_2017: "£POL_Neutral_green_2017_small 绿党"
 POL.Neutral_green_2017_icon: "£POL_Neutral_green_2017_small"
 POL.Neutral_Green_2017_desc: ""
 POL.Nat_Autocracy: "£POL_Nat_Autocracy_small 波兰共和国武装力量"
 POL.Nat_Autocracy_icon: "£POL_Nat_Autocracy_small"
 POL.Nat_Autocracy_desc: ""
 POL.Nat_Fascism: "£POL_Nat_Fascism_small 全国激进阵营"
 POL.Nat_Fascism_icon: "£POL_Nat_Fascism_small"
 POL.Nat_Fascism_desc: "法西斯主义 - 全国激进阵营是一个极右翼运动，常被描述为法西斯主义，有时也被视为新纳粹。全国激进阵营自视为1930 年代国家激进阵营的意识形态后裔，这是一个法西斯主义和反犹太主义的政治运动。"
 POL.Nat_Populism: "£POL_Nat_Populism_small 波兰家庭联盟"
 POL.Nat_Populism_icon: "£POL_Nat_Populism_small"
 POL.Nat_Populism_desc: "右翼民粹主义者 - 波兰家庭联盟是一个右翼政党，自认为是战前民族民主运动的继承者。它持有民族主义、近乎极右的民粹主义立场。"
 POL.Nat_Populism_2017: "£POL_Nat_Populism_2017_small 民族运动"
 POL.Nat_Populism_2017_icon: "£POL_Nat_Populism_2017_small"
 POL.Nat_Populism_2017_desc: "右翼民粹主义者 - 民族运动是一个由各种右翼、极右翼和民族主义政治运动组成的波兰政治联盟。它参考了战前的民族民主运动，具有反欧盟、反全球化和极端保守的观点。"
 POL.Monarchist: "£POL_Neutral_Libertarian_small 真实政治联盟"
 POL.Monarchist_desc: "自由主义 - 真实政治联盟是波兰的一个保守自由主义政党，旨在将政府的作用降到最低。该党通常在社会问题上持保守观点。"
 SER.Western_Autocracy: "£SER_western_autocrat 塞尔维亚复兴运动"
 SER.Western_Autocracy_desc: "亲西方专制主义 - 塞尔维亚复兴运动是一个面向欧洲的君主主义政党，主张与所有前南斯拉夫国家和解、相互经济合作以及各种形式的欧洲大西洋一体化，包括加入欧盟和北约。"
 SER.conservatism: "£SER_western_conservative 新塞尔维亚"
 SER.conservatism_desc: "保守主义 - 新塞尔维亚，一个较小的中右翼君主主义政党，在其成员因党内冲突和塞尔维亚复兴运动领导层与米洛舍维奇政权有联系的指控而脱离塞尔维亚复兴运动后出现。"
 SER.liberalism: "£SER_western_liberal 民主党"
 SER.liberalism_desc: "自由主义 - 民主党。民主党是一个中左翼、亲西方的自由派政党，曾是塞尔维亚民主反对派联盟中最大的政党之一。其党主席佐兰·金吉奇随后出任国家总理，但由于他发起的“打击犯罪行动”以及与保守派民主党主席、新任南斯拉夫总统沃伊斯拉夫·科什图尼察之间的分歧，这对昔日盟友之间不可避免地爆发了新的权力斗争。"
 SER.socialism: "£SER_western_social_democrat 社会民主联盟"
 SER.socialism_desc: "社会民主主义 - 社会民主联盟是一个较小的左倾反战、反民族主义政党，曾参与塞尔维亚民主反对派联盟。由于支持LBGT权利，其办公室遭到民族主义者捣毁，成员也受到殴打。"
 SER.anarchist_communism: "£SER_anarchist_communism 南斯拉夫左翼"
 SER.anarchist_communism_desc: "左翼激进主义 - 南斯拉夫左翼联盟。南斯拉夫左翼联盟成立于1994年，由共产主义者联盟领导下的19个左翼政党合并而成。这是一个民族主义、亲南斯拉夫的政党，与其他共产主义政党保持着一定的国际联系，例如中国、古巴和朝鲜的共产党。由于与其关系密切，其对手常称其为“中国傀儡”。"
 SER.anarchist_communism_2017: "£SER_anarchist_communism_alt 社会主义运动"
 SER.anarchist_communism_2017_desc: "左翼激进主义 - 社会主义者运动。社会主义者运动是一个左翼民粹主义和民族主义政党，成立于2008年。该党由塞尔维亚社会党前成员组建，因反对原党的亲欧盟政策而另立门户。"
 SER.Conservative: "£SER_conservatism 联合塞尔维亚党"
 SER.Conservative_desc: "反动主义 - 联合塞尔维亚党是一个较小的民族保守党。该党在社会议题上立场顽固保守，同时提倡地方主义。"
 SER.Autocracy: "£SER_Autocracy 塞尔维亚人民党"
 SER.Autocracy_desc: "专制主义 - 塞尔维亚人民党。塞尔维亚人民党是民粹主义亲俄右翼政党。该党主张塞尔维亚和俄罗斯建立更密切的联系，并反对塞尔维亚加入欧盟。"
 SER.Neutral_Muslim_Brotherhood: "£SER_Neutral_Muslim_Brotherhood 桑扎克的波斯尼亚民主党"
 SER.Neutral_Muslim_Brotherhood_desc: "温和伊斯兰主义 - 桑扎克的波斯尼亚民主党。一个倡导波斯尼亚穆斯林权利的小党派。"
 SER.Neutral_conservatism: "£SER_non_aligned_conservative 塞尔维亚民主党"
 SER.Neutral_conservatism_desc: "保守主义 - 塞尔维亚民主党。塞尔维亚民主反对党中最大的政党，几乎所有反对米洛舍维奇的反对党组成的联盟。塞尔维亚民主党本质上是保守的，并享有塞尔维亚黑帮的支持。"
 SER.Neutral_Libertarian: "£SER_non_aligned_libertarian 塞尔维亚公民联盟"
 SER.Neutral_Libertarian_desc: "自由主义 - 塞尔维亚公民联盟。一个非常小的和平主义自由亲欧政党。"
 SER.Neutral_green: "£SER_Neutral_green 塞尔维亚绿党"
 SER.Neutral_green_desc: "环保主义 - 塞尔维亚绿党。塞尔维亚绿党是塞尔维亚的一个绿色政党。该党倡导环境和生态智能、社会正义和团结、直接民主、绿色经济、可持续性、尊重多样性和人权，以及防止一切形式的暴力。"
 SER.neutral_Social: "£SER_neutral_Social 塞尔维亚社会党 - §C民主派§!"
 SER.neutral_Social_desc: "民主社会主义 - 塞尔维亚社会党。尽管名义是奉行左翼经济政策、与前塞尔维亚共产主义者联盟有直接联系的社会主义政党，但在斯洛博丹·米洛舍维奇领导下，该党演变为民族主义、孤立主义和反西方势力。米洛舍维奇倒台后，该党重回左翼根源，甚至采取了亲欧盟立场。"
 SER.Neutral_Communism: "£SER_Neutral_Communism 塞尔维亚南斯拉夫共产党人联盟"
 SER.Neutral_Communism_desc: "共产主义 - 塞尔维亚共产党人联盟是铁托的南斯拉夫共产党人联盟的残余。"
 SER.Nat_Populism: "£SER_Nat_Populism 塞尔维亚社会党"
 SER.Nat_Populism_desc: "右翼民粹主义者 - 塞尔维亚社会党。尽管名义上是左翼经济学的社会主义政党，并与旧塞尔维亚共产主义者联​​盟有直接联系，但在斯洛博丹·米洛舍维奇的领导下，该党已成为民族主义、孤立主义和反西方的政党。它提倡塞尔维亚民族主义，将南斯拉夫分开，并试图通过包括种族清洗在内的各种手段使塞尔维亚在由此产生的南斯拉夫战争中获得最大收益。"
 SER.Nat_Populism_2017: "£SER_Nat_Populism_alt 塞尔维亚“大门”运动"
 SER.Nat_Populism_2017_desc: "右翼民粹主义 - 塞尔维亚运动“大门”。“大门”是一个右翼至极右翼的政治运动。该组织成立于1999年，最初是一个围绕同名学生杂志聚集起来的基督教右翼青年组织。"
 SER.Nat_Fascism: "£SER_Nat_Fascism 塞尔维亚激进党"
 SER.Nat_Fascism_desc: "法西斯主义 - 塞尔维亚激进党是一个极端民族主义和新法西斯主义政党，其主要目标是建立大塞尔维亚。"
 SER.Nat_Autocracy: "£SER_Nat_Autocracy 特殊行动部队"
 SER.Nat_Autocracy_desc: "军政府 - 特种作战部队，亦称“红色贝雷帽”，是南斯拉夫联邦共和国国家安全局的精英特种警察部队，由准军事和地下犯罪的成员组成。尽管他们从未成为正式政党，却掌握着巨大权力。该部队刺杀了塞尔维亚总理佐兰·金吉奇，最终导致了“佩刀”行动，导致其被解散并走向覆灭。"
 SER.Monarchist: "£SER_nationalist_monarchist 卡拉乔杰维奇王室"
 SER.Monarchist_desc: "君主主义 - 塞尔维亚王国复辟运动，塞尔维亚王国复辟运动正在寻求让卡拉乔杰维奇王室重新掌权。"
 AST.conservatism: "£AST_conservatism (LIB) - 澳大利亚自由党"
 AST.conservatism_icon: "£AST_conservatism"
 AST.conservatism_desc: "(自由保​​守主义) - 澳大利亚自由工党\n\n澳大利亚自由党是澳大利亚政坛主要的中右翼力量，由罗伯特·孟席斯于1944年10月13日创立，是一个由自由派和保守派人士组成的广泛的反工党联盟。该党通常优先考虑自由企业、自由贸易和减税。"
 AST.liberalism: "£generic_liberalism_small (AD) - 澳大利亚民主党"
 AST.liberalism_desc: "(社会自由主义) - 澳大利亚民主党\n\n澳大利亚民主党是一个中间派政党，由前自由党部长唐·奇普于1977年5月9日创立，旨在游走于自由党和工党之间，并承诺监督两党，确保其廉洁奉公。该党优先考虑社会自由主义、环境保护和议会问责制，并以参议院而非众议院作为其政治工具。"
 AST.socialism: "£AST_socialism (ALP) - 澳大利亚工党"
 AST.socialism_icon: "£AST_socialism"
 AST.socialism_desc: "(社会民主主义) - 澳大利亚工党\n\n澳大利亚工党是该国历史最悠久的政党，也是主要的中左翼力量。它由劳工运动于1891年创立，并于1901年建立联邦制组织。其附属工会至今仍占据工党代表大会一半的席位。工党通常优先考虑公共服务、工人权益以及国家在经济中发挥的积极作用，而其左翼和右翼派系则就这些原则的适用范围存在争议。"
 AST.Conservative: "£AST_Conservative_communism (KAP) - 凯特的澳大利亚党"
 AST.Conservative_icon: "£AST_Conservative_communism"
 AST.Conservative_desc: "(农业民粹主义) - 凯特的澳大利亚党\n\n凯特的澳大利亚党是由长期担任肯尼迪选区议员的鲍勃·凯特创立的北昆士兰民粹主义政党。该党将农业社会主义经济、贸易保护主义、州发展银行和国有化基本服务与社会保守主义、放宽枪支管制以及要求北昆士兰建州的诉求结合起来。"
 AST.anarchist_communism: "£AST_left_wing_radical (SA) - 社会主义联盟"
 AST.anarchist_communism_icon: "£AST_left_wing_radical"
 AST.anarchist_communism_desc: "(生态社会主义) - 社会主义联盟\n\n社会主义联盟是一个左翼政党，由民主社会主义视角和国际社会主义组织于2001年8月成立，旨在为澳大利亚极左翼建立统一的选举阵线。该党倡导生态社会主义、反资本主义和民主社会主义，并通过其报纸《绿色左翼》开展气候、难民、原住民权利和工人斗争等方面的宣传活动。"
 AST.Caliphate: "£AST_Caliphate (HT) - 澳大利亚伊斯兰解放党"
 AST.Caliphate_icon: "£AST_Caliphate"
 AST.Caliphate_desc: "(泛伊斯兰主义) - 澳大利亚伊斯兰解放党\n\n澳大利亚伊斯兰解放党是1953年在耶路撒冷成立的国际伊斯兰解放党的悉尼分支机构，其精神领袖是伊斯梅尔·瓦赫瓦，发言人包括瓦西姆·杜雷希和奥斯曼·巴达尔。该组织拒绝民主和任何现有国家的合法性，致力于建立一个实行伊斯兰教法的单一哈里发国，并在主流清真寺之外开展活动，拥有约300名成员。"
 AST.Neutral_conservatism: "£AST_Neutral_conservatism (NAT) - 澳大利亚国家党"
 AST.Neutral_conservatism_icon: "£AST_Neutral_conservatism"
 AST.Neutral_conservatism_desc: "(农业保守主义) - 澳大利亚国家党\n\n澳大利亚国家党是一个代表乡村和地区利益的保守党，成立于1920年1月22日，最初名为澳大利亚乡村党，分别于1975年和1982年更名。该党通常优先考虑农业和矿业利益、地区基础设施以及水资源和干旱政策。其领导人在联盟党执政期间担任副总理。\n\n执政以来，该党一直与自由党保持着互惠联盟关系。"
 AST.Neutral_Libertarian: "£AST_Neutral_Libertarian (LDP) - 自由民主党"
 AST.Neutral_Libertarian_icon: "£AST_Neutral_Libertarian"
 AST.Neutral_Libertarian_desc: "(右翼自由主义) - 自由民主党\n\n自由民主党是一个右翼自由主义政党，主张小政府、低税收、放松管制、毒品法律改革和拥枪权，认为个人自由应该优先于政府权力。"
 AST.Neutral_Communism: "£AST_Neutral_Communism (SEP) - 社会主义平等党"
 AST.Neutral_Communism_icon: "£AST_Neutral_Communism"
 AST.Neutral_Communism_desc: "(托洛茨基主义) - 社会主义平等党\n\n社会主义平等党是一个托洛茨基主义政党，是社会主义劳工联盟的继承者。自1972年以来，社会主义劳工联盟一直在澳大利亚传承第四国际的传统。该党是第四国际国际委员会的澳大利亚支部。它主张所有主要产业国有化，并谴责工会官僚机构、工党和身份政治是工人阶级的障碍。"
 AST.Neutral_green: "£AST_Neutral_green (GRN) - 澳大利亚绿党"
 AST.Neutral_green_icon: "£AST_Neutral_green"
 AST.Neutral_green_desc: "(环保主义) - 澳大利亚绿党\n\n澳大利亚绿党是一个成立于1992年的左翼环保政党，其前身是塔斯马尼亚荒野保护运动，后来发展成为由鲍勃·布朗领导的联盟。该党围绕社会正义、可持续发展、基层民主和和平四大支柱开展工作，优先考虑快速脱碳、公共住房和难民权利。"
 AST.Nat_Autocracy: "£AST_Nat_Autocracy (ADF) - 澳大利亚国防军"
 AST.Nat_Autocracy_icon: "£AST_Nat_Autocracy"
 AST.Nat_Autocracy_desc: "(军政府) - 澳大利亚国防军\n\n澳大利亚国防军作为执政集团，代表着由海军、陆军和空军组成的三军紧急政府。这三军于1976年2月9日统一指挥，如今拥有约59,000名常备人员和33,000名预备役人员。国防军将安全、指挥连续性以及澳新美安全条约和澳欧美安全条约的联盟体系置于议会辩论之上，各部委均置于军事监督之下。\n\n实际上，这意味着加速重整军备，不计代价推进核潜艇计划，并以印太地区威胁为由扩大内部安全权力。其前景是威慑和秩序，风险则是澳大利亚将以命令取代同意。"
 AST.Nat_Fascism: "£AST_Nat_Fascism (AFP) - 澳大利亚第一党"
 AST.Nat_Fascism_icon: "£AST_Nat_Fascism"
 AST.Nat_Fascism_desc: "(白人民族主义) - 澳大利亚第一党\n\n澳大利亚第一党是一个极右翼民族主义政党，由前工党成员格雷姆·坎贝尔于1996年6月创立，此后一直由曾因纵火罪被定罪的前国家社会主义活动家吉姆·萨利姆领导。该党主张终止移民和多元文化主义，限制外资所有权，实行贸易保护主义，并支持公民全民公投，自称是旧工党政府的延续。"
 AST.Nat_Populism: "£AST_Nat_Populism (ON) - 保琳·汉森的一国党"
 AST.Nat_Populism_icon: "£AST_Nat_Populism"
 AST.Nat_Populism_desc: "(右翼民粹主义) - 保琳·汉森的单一民族\n\n一国党是一个右翼民粹主义政党，由保琳·汉森、大卫·奥尔德菲尔德和大卫·埃特里奇于1997年4月11日创立，汉森担任终身主席。该党反对多元文化主义、亚洲和穆斯林移民以及气候政策，同时奉行保护主义，并迎合那些感到被建制派抛弃的选民。"
 SOV.conservatism: "£SOV_western_conservative (URF) 右翼力量联盟"
 SOV.conservatism_icon: "£SOV_western_conservative"
 SOV.conservatism_desc: "（自由市场自由主义）右翼力量联盟\n\n右翼力量联盟成立于1999年，提倡私有化和自由市场资本主义，强烈反对威权主义。"
 SOV.liberalism: "£SOV_western_liberal (RUDPY)亚博卢"
 SOV.liberalism_icon: "£SOV_western_liberal"
 SOV.liberalism_desc: "（社会自由主义） - 俄罗斯联合民主党“亚博卢”\n\n亚博卢是一个提倡市场经济和民主价值观的社会自由党。 亚博卢在俄语中意为‘苹果’，历史上一直是俄罗斯反对共产主义和保守主义的首要政治力量。"
 SOV.socialism: "£SOV_western_social_democrat (PPRF)俄罗斯联邦人民党"
 SOV.socialism_icon: "£SOV_western_social_democrat"
 SOV.socialism_desc: "（左倾中间派）俄罗斯联邦人民党\n\n俄罗斯联邦人民党是在代表派别乌克兰人民代表的基础上成立的，该派别完全由单一选区选出的代表组成。该党是中间派，但经常主张扩大福利计划。"
 SOV.Conservative: "£SOV_emerging_conserva (IM)统一党"
 SOV.Conservative_icon: "£SOV_emerging_conserva"
 SOV.Conservative_desc: "（亲政府中间派）跨区域运动‘统一党’\n\n统一党是99年底大批保守派和工商业派合并而成的政党和社会组织。统一党本应是一个权力政党，首先支持俄罗斯总理，然后支持俄罗斯总统弗拉基米尔·普京。该党由谢尔盖·绍伊古主持。"
 SOV.anarchist_communism: "£SOV_left_wing_radical (RPL) 俄罗斯生活党"
 SOV.anarchist_communism_icon: "£SOV_left_wing_radical"
 SOV.anarchist_communism_desc: "（左倾中间派）俄罗斯生活党\n\n俄罗斯生活党由联邦委员会主席谢尔盖·米罗诺夫创立。该党主张扩大社会计划、提高公民生活水平和国家对经济进行调控。"
 SOV.Neutral_conservatism: "£SOV_conservative_one (PW) 全民联盟"
 SOV.Neutral_conservatism_icon: "£SOV_conservative_one"
 SOV.oligarchism: "£SOV_oligarchists (FAR) 祖国 - 全俄罗斯"
 SOV.oligarchism_icon: "£SOV_oligarchists"
 SOV.oligarchism_desc: "（地区主义）祖国 - 全俄罗斯\n\n祖国-全俄罗斯是“祖国”运动和“全俄罗斯”运动合并后成立的政治集团。俄罗斯联邦总督党的绰号是‘州长党’，因为它包括了大部分地区精英和有影响力的州长。该党的目标是在联邦议会中代表各地区的利益。"
 SOV.Neutral_Libertarian: "£SOV_non_aligned_libertarian (LPR) 俄罗斯自由意志党"
 SOV.Neutral_Libertarian_icon: "£SOV_non_aligned_libertarian"
 SOV.Neutral_Libertarian_desc: "（自由意志主义）俄罗斯自由意志党\n\n俄罗斯自由意志党在俄罗斯推广自由主义思想。作为一个基础广泛的政党，该党试图吸引一大批认同绝对自由和市场关系不可侵犯思想的人。该党组织结构复杂，各分支之间的关系体系复杂。该党认同自由主义国家发展、邦联制度和市场关系发展的思想。"
 SOV.Neutral_Communism: "£SOV_non_aligned_communism (CR) 俄罗斯共产党"
 SOV.Neutral_Communism_icon: "£SOV_non_aligned_communism"
 SOV.Neutral_Communism_desc: "（反修正主义共产主义）共产党‘俄罗斯共产党’\n\n俄罗斯共产党是成立于2012年的一个共产主义政党，将自己定位为俄罗斯联邦共产党的替代党。他们拒绝对马克思列宁主义意识形态进行任何改革，并认为俄罗斯联邦共产党的政策是修正主义的。该党还代表斯大林主义和无神论。"
 SOV.Neutral_green: "£SOV_non_aligned_greens (REPG) 绿党"
 SOV.Neutral_green_icon: "£SOV_non_aligned_greens"
 SOV.Neutral_green_desc: "（绿色行动主义）俄罗斯生态党/‘绿党’\n\n‘绿党’（原名‘俄罗斯生态党’）是一个主张优先考虑环境政策的政党。他们支持对抗污染、无节制的森林砍伐和全球变暖。与西方绿党不同，俄罗斯绿党不支持社会进步主义，但将对抗污染视为最重要的目标。"
 SOV.neutral_Social: "£SOV_non_aligned_socialist_democrat (PR) 俄罗斯爱国者"
 SOV.neutral_Social_icon: "£SOV_non_aligned_socialist_democrat"
 SOV.neutral_Social_desc: "（民主社会主义）俄罗斯爱国者党\n\n俄罗斯爱国者党是由商人根纳季·谢米金创立的政党。该党支持民主社会主义、左翼民族主义和爱国主义思想。"
 SOV.Nat_Fascism: "£SOV_nationalist_fascism (NBP)民族布尔什维克党"
 SOV.Nat_Fascism_icon: "£SOV_nationalist_fascism"
 SOV.Nat_Fascism_desc: "（民族布尔什维克主义）民族布尔什维克党\n\n民族布尔什维克是一个融合了斯大林主义意识形态和国家社会主义元素的极端民族主义运动。"
 SOV.Nat_Populism: "£SOV_nationalist_right_wing_populist (LDPR) 俄罗斯自由民主党"
 SOV.Nat_Populism_icon: "£SOV_nationalist_right_wing_populist"
 SOV.Nat_Populism_desc: "（民族民粹主义）俄罗斯自由民主党\n\n俄罗斯自由民主党既不是自由党，也不是民主党，而是寻求一个在威权主义、民粹主义和民族主义下重生的大大扩张的俄罗斯帝国。"
 SOV.Nat_Autocracy_wagner: "£SOV_Nat_Autocracy_wagner (WP) 瓦格纳党"
 SOV.Nat_Autocracy_wagner_icon: "£SOV_Nat_Autocracy_wagner"
 SOV.Nat_Autocracy_wagner_desc: "（佣兵爱国主义）瓦格纳党\n\n该党是普里戈任在国内影响力扩大的结果。瓦格纳已经成为一种军国主义意识形态，它聚集了所有认同它并准备用手中的机枪捍卫俄罗斯利益的人。"
 SOV.Monarchist: "£SOV_nationalist_monarchist 罗曼诺夫王室"
 SOV.Monarchist_icon: "£SOV_nationalist_monarchist"
 SOV.Monarchist_desc: ""
 TAI.conservatism: "£TAI_conservatism (KMT) 中国国民党"
 TAI.conservatism_icon: "£TAI_conservatism"
 TAI.conservatism_desc: "（右翼三民主义） - 国民党，亦称中国国民党，由孙中山于1894年创立。这位受中国大陆与现居台湾岛的中华民国共同尊崇的领袖，曾引领该党致力于中国统一事业，建立了包纳诸多团体与思想的统一战线。党的官方意识形态深受孙中山“三民主义”影响，其核心要义包括民族主义、民权主义与民生主义。该党最初呈现左倾倾向，甚至曾与苏联结盟，但1927年上海清党屠杀事件导致国共决裂，不久即引发中国内战。国民党在内战结束前始终以不同形式掌控中国政权，最终在内战末期退守台湾岛，建立一党专政的中华民国残余政权，直至1987年恢复民主政治后仍是岛内根深蒂固的政治力量。基于其反共立场、内战历史与冷战格局，国民党逐渐右转，将三民主义调适为契合民族主义与保守主义的政治纲领。"
 TAI.liberalism: "£TAI_liberalism (DPP) 民主进步党"
 TAI.liberalism_icon: "£TAI_liberalism"
 TAI.liberalism_desc: "（进步主义） - 成立于1986年的民进党，已成为国民党“泛蓝阵营”的主要政治对手之一。该党及其盟友不仅主张台湾脱离“中华民国”及中华人民共和国而独立，还提出了一套统一且具有鲜明进步主义色彩的政纲。其具体社会政策（如支持LGBTQ群体）深受该党在台湾“白色恐怖”时期作为人权团体发端的历史影响。"
 TAI.socialism: "£TAI_socialism (CPP) 中国民众党"
 TAI.socialism_icon: "£TAI_socialism"
 TAI.socialism_desc: "（三民主义） - 在中国的小党派中，中华民众党宣称坚持三民主义思想，并致力于追求中国统一。该党的纲领也深受三民主义影响，更倾向于社会民主主义。"
 TAI.Conservative: "£TAI_Conservative  (NP) 新党"
 TAI.Conservative_icon: "£TAI_Conservative"
 TAI.Conservative_desc: "（右翼三民主义） - 新党于1993年由脱离国民党的成员组成，最初是一个名义上遵循与国民党相似纲领的保守倾向政党。然而其意识形态迅速转变，进一步向右翼靠拢，最终在两岸统一问题上采取支持中国大陆的立场，认同\"一国两制\"。"
 TAI.Neutral_conservatism: "£TAI_Neutral_conservatism (PFP) 亲民党"
 TAI.Neutral_conservatism_icon: "£TAI_Neutral_conservatism"
 TAI.Neutral_conservatism_desc: "（自由保守主义） - 由前国民党成员宋楚瑜创立，旨在支持其竞选总统的政党。尽管并未明确认同三民主义，但亲民党的意识形态平台与国民党本身颇为相似。随着一党统治结束后从国民党内部分裂出的众多政党涌现，亲民党在选举中取得的成功寥寥无几。"
 TAI.neutral_Social: "£TAI_neutral_Social (TAIP)建国党"
 TAI.neutral_Social_icon: "£TAI_neutral_Social"
 TAI.neutral_Social_desc: "（进步主义） - 台湾建国党于1996年由不满民进党在台湾问题立场趋于温和的前党员组建。秉持相近的进步主义纲领，建国党将这一争议点确立为核心政治主张。"
 TAI.Neutral_Libertarian: "£generic_Neutral_Libertarian_small 农民党"
 TAI.Neutral_Libertarian_desc: "（农本主义） - 内部信念多元化的同时，农民党在中华统一问题上保持中立立场，同时通过保护主义政策将重心放在保护台湾农民的利益上。"
 TAI.Neutral_green: "£TAI_Neutral_green 台湾绿党"
 TAI.Neutral_green_icon: "£TAI_Neutral_green"
 TAI.Neutral_green_desc: "（环保主义） - 秉持标准绿党政纲的台湾绿党，在选举中鲜有斩获 - 其他拥有同样进步政纲的大型政党能够从其手中争夺选民基础。尽管如此，该党仍坚持其环保行动主义。"
 TAI.Nat_Autocracy: "£TAI_Nat_Autocracy (ROCAF) 中华民国国军"
 TAI.Nat_Autocracy_icon: "£TAI_Nat_Autocracy"
 TAI.Nat_Autocracy_desc: "（民族主义军政府） - 自1924年作为国民革命军成立以来，中华民国国军的组织形态经历了巨大演变。最初的国民革命军在苏联协助下，建立了高度政治化与中央集权的军事体系，旨在在早期国民党旗帜下统一中国，并终结当时肆虐的军阀割据。然而随着孙中山逝世及国民党政治路线的整体转向，局势迅速变化。随着台湾一党专政与戒严体制的终结，军队虽已与政治保持距离，但其历史上与国民党的政治关联、来自大陆的持续威胁，以及数十年前尚未远去的戒严记忆，仍如阴云般笼罩着这支武装力量。"
 TAI.Nat_Fascism: "£TAI_Nat_Fascism (CDSP)中国民主社会党"
 TAI.Nat_Fascism_icon: "£TAI_Nat_Fascism"
 TAI.Nat_Fascism_desc: "（国家民粹主义） - 中华民主社会党最初作为一个倡导社会平等和民主社会主义的左翼政党成立，但随着中国局势的演变以及内战的余波，该党逐渐右倾 - 将保守主义与中国民族主义融入其实际政策中。尽管在台湾独裁统治时期，它是少数被允许与国民党共同活动的政党之一，但该党取得的成功甚微。"
 TAI.Nat_Populism: "£TAI_Nat_Populism (YCP)中国青年党"
 TAI.Nat_Populism_icon: "£TAI_Nat_Populism"
 TAI.Nat_Populism_desc: "（极右三民主义） - 作为台湾地区历史最悠久的政党之一，也是在一党专政时期仍保持合法地位的少数党派，中国青年党提出了反对\"一国两制\"与台湾独立的政纲。该党持续反对大陆政府，并主张恢复中华民国作为中国唯一合法国家的地位。"
 TAI.Monarchist: "£generic_Monarchist_small 皇室"
 TAI.Monarchist_desc: ""
 SWE.conservatism: "£SWE_western_conservative (M)温和党"
 SWE.conservatism_icon: "£SWE_western_conservative"
 SWE.conservatism_desc: "（自由保​​守主义） - 温和统一党是一个自由保守党，历史上一直以瑞典社会民主党的对立面自居，倡导自由市场和降低税收。不过，该党近年来逐渐向政治中间路线靠拢，转而主张维护瑞典的福利模式。"
 SWE.liberalism: "£SWE_western_liberal (FP)自由人民党"
 SWE.liberalism_icon: "£SWE_western_liberal"
 SWE.liberalism_desc: "（保守自由主义） - 瑞典自由人民党成立于1934年，由几个较小的自由主义组织合并而成，是瑞典最早的正式自由主义政党之一。该党最初奉行社会自由主义，但在冷战期间逐渐向中间靠拢，先是转向市场自由主义，之后又转向更为中间偏右的自由主义纲领。尽管政治立场有所转变，该党始终坚持支持为社会福利和公共服务（如教育）提供资金，并强烈支持北约和欧盟。"
 SWE.liberalism_2017: "£SWE_western_liberal_2017 (L)自由党"
 SWE.liberalism_2017_icon: "£SWE_western_liberal_2017"
 SWE.liberalism_2017_desc: "（保守自由主义） - 瑞典自由党（前身为自由人民党）成立于1934年，由几个较小的自由主义组织合并而成，是瑞典最早的正式自由主义政党之一。该党最初奉行社会自由主义，但在冷战期间逐渐向中间靠拢，先是转向市场自由主义，之后又转向更为中间偏右的自由主义纲领。尽管政治立场有所转变，但该党始终坚持支持为社会福利和公共服务（如教育）提供资金，并强烈支持北约和欧盟。"
 SWE.socialism: "£SWE_western_social_democrat (S)瑞典社会民主党"
 SWE.socialism_icon: "£SWE_western_social_democrat"
 SWE.socialism_desc: "（北欧模式） - 瑞典社会民主工人党历来是瑞典最大且最具影响力的政党，在1932年至1994年间仅有以此选举得票率低于40%。该党塑造了现代瑞典，建立了福利国家与劳资合作的“瑞典模式”，但近年来效仿托尼·布莱尔的“新工党”路线，逐渐从民主社会主义转向瑞典政治光谱的中间立场。"
 SWE.anarchist_communism: "£SWE_non_aligned_socialist_democrat (V)左翼党"
 SWE.anarchist_communism_icon: "£SWE_non_aligned_socialist_democrat"
 SWE.anarchist_communism_desc: "（生态社会主义） - 左翼党在1990年前被视为奉行欧洲共产主义理论的共产党。此后，随着社会民主党向右倾斜，为极左翼社会主义政党留出了更大空间，该党迎来了大量新选民。除社会主义之外，左翼党还扛起了女权主义大旗，反对欧盟并主张对以色列实施禁运。"
 SWE.Neutral_conservatism: "£SWE_non_aligned_conservative (KD)基督教民主党"
 SWE.Neutral_conservatism_icon: "£SWE_non_aligned_conservative"
 SWE.Neutral_conservatism_desc: "（基督教民主主义）- 基督教民主党成立于1964年，最初名为基督教民主联盟，是瑞典境内的一个基督教民主党派。在其历史的大部分时间里，该党都致力于支持较为温和、中间派的政党。在意识形态上，该党与更广泛的基督教民主运动高度一致，尽管党内存在一些势力试图将党纲向右翼靠拢，但该党仍然支持瑞典的福利模式。"
 SWE.oligarchism: "£SWE_non_aligned_oligarchism (C)中间党"
 SWE.oligarchism_icon: "£SWE_non_aligned_oligarchism"
 SWE.oligarchism_desc: "（农业主义 - 北欧）- 中间党。传统上作为一个农村和农业政党，中间党一直是任何非社会主义瑞典政府的常客。近年来，该党日益提倡自由保守主义价值观，并支持权力下放。"
 SWE.Neutral_Libertarian: "£SWE_non_aligned_libertarian (PP)海盗党"
 SWE.Neutral_Libertarian_icon: "£SWE_non_aligned_libertarian"
 SWE.Neutral_Libertarian_desc: "（海盗政治）- 海盗党是一个致力于电子民主、版权改革和公民自由的融合政党。该党由瑞典组织“盗版署”创立，该组织正是知名种子网站海盗湾背后的推手，由此诞生了全球首个此类政党。"
 SWE.Neutral_green: "£SWE_non_aligned_greens (MP)绿党"
 SWE.Neutral_green_icon: "£SWE_non_aligned_greens"
 SWE.Neutral_green_desc: "（绿色政治）- 瑞典绿党成立于1981年，是在当时盛行的反核运动背景下应运而生，旨在填补瑞典政坛因缺乏环保政党而造成的空白。该党在意识形态上与更广泛的绿党运动高​​度契合，高度关注生态问题，同时也倡导社会正义、福利和较为左倾的政策。"
 SWE.neutral_Social: "£SWE_feministiskt_initiativ (FI)女权倡议"
 SWE.neutral_Social_icon: "£SWE_feministiskt_initiativ"
 SWE.neutral_Social_desc: "（进步女权主义） - 由左翼党前领导人创立的女权主义倡议组织最初是一个压力团体，后来发展成为一个正式的政党。该组织在意识形态上倡导较为进步的女权主义理念，但其立场与瑞典国内其他进步主义、自由主义和社会民主主义运动大体一致。在选举方面，该组织不如其他更广泛的左翼运动那样成功，但它与瑞典国内外的多个团体保持着联系。"
 SWE.Nat_Populism: "£SWE_nationalist_right_wing_populist (NyD)新民主党"
 SWE.Nat_Populism_icon: "£SWE_nationalist_right_wing_populist"
 SWE.Nat_Populism_desc: "（民族自由主义） - 新民主党成立于1991年，是一个以维护瑞典经济安全为核心的民族主义政党。该党主张以国家主权为核心的经济和移民改革，同时也支持与欧洲一体化。尽管其名义上的纲领偏向中间偏右，但该党内部包含更多右翼和民族民粹主义因素，使其在瑞典政治中逐渐走向边缘化。"
 SWE.Nat_Populism_2017: "£SWE_nationalist_right_wing_populist_2017 (SD)瑞典民主党"
 SWE.Nat_Populism_2017_icon: "£SWE_nationalist_right_wing_populist_2017"
 SWE.Nat_Populism_2017_desc: "（民族保守主义） - 瑞典民主党。该党最初作为法西斯主义和白人民族主义运动兴起，后逐渐趋于温和，并清除了许多纳粹和法西斯同情者。该党强烈反对任何移民，并对欧洲一体化持怀疑态度。"
 SWE.Nat_Fascism: "£SWE_nationalist_fascism (AfS) 瑞典的另类选择"
 SWE.Nat_Fascism_icon: "£SWE_nationalist_fascism"
 SWE.Nat_Fascism_desc: "（极端民族主义） - 瑞典另类选择党由被瑞典民主党开除的成员组成，是一个立场更为强硬、公开宣扬极端民族主义的政党。其意识形态深受德国另类选择党等政党的影响，主张宗派主义纲领和反动社会政策。"
 SWE.Nat_Autocracy: "£generic_Nat_Autocracy_small 瑞典武装力量"
 SWE.Monarchist: "£SWE_House_of_Bernadotte 贝尔纳多特王室"
 SWE.Nat_Monarchist_icon: "£SWE_House_of_Bernadotte"
 IND.conservatism: "£IND_conservative (PKB) 民族觉醒党"
 IND.conservatism_icon: "£IND_conservative"
 IND.conservatism_desc: "（伊斯兰民主主义） - 民族觉醒党由印尼传统保守派伊斯兰教宗教领袖于1999年创立，旨在成为伊斯兰教士联合会的政治载体，以表达其诉求和愿望。该联盟的意识形态偏向中间偏右，倡导伊斯兰民主和温和保守的政策，同时秉持受印尼独特建国五项原则所启发的左翼经济观点。"
 IND.liberalism: "£IND_liberal (PAN) 国家使命党"
 IND.liberalism_icon: "£IND_liberal"
 IND.liberalism_desc: "（伊斯兰民主主义） - 国家使命党成立于1998年苏哈托政权垮台之后，该党标榜自己是印尼半社会主义意识形态建国五项原则的拥护者 - 尽管其宗教背景极大地影响了其观点和政策。该党本身虽然宗教色彩浓厚，但也标榜自己是非宗派的，并在印尼国内选举中取得了一定的成功。"
 IND.socialism: "£IND_social_democrat 工党"
 IND.socialism_icon: "£IND_social_democrat"
 IND.socialism_desc: "（民主社会主义）- 1998年苏哈托政权垮台后，印尼成立了多个政党，其中之一便是工党。该党以民主社会主义意识形态为核心，其理念本身也受到印尼建国五项原则的启发和影响。工党与印尼工人福利联盟关系密切，其成立的部分原因在于该联盟与现有左翼政党之间的分歧日益加剧，工党正是作为该联盟的政治工具而出现的。尽管如此，工党自成立以来在选举中鲜有斩获。"
 IND.Western_Autocracy: "£IND_pro_western_2000 (PDI) 印尼民主党"
 IND.Western_Autocracy_icon: "£IND_pro_western_2000"
 IND.Western_Autocracy_desc: "（务实进步主义） - 印尼民主党成立于1973年，由五个小党被迫合并而成，是苏哈托政权时期为数不多的合法政党之一。作为苏哈托执政的从业党的主要反对党，它是唯一获准在印尼境内活动的官方左翼政党。部分原因是政府的压力以及自身政策的影响，苏哈托政权垮台后，党内派系斗争导致其在90年代分裂，更多左翼派系随后组建了自己的政党。尽管如此，印尼民主党仍然秉持着温和进步的纲领继续运作，但随着印尼回归多党民主制，如今涌现出的主流政党逐渐掩盖了它的光芒。"
 IND.Conservative: "£IND_reactionary 大印度尼西亚运动党"
 IND.Conservative_icon: "£IND_reactionary"
 IND.Conservative_desc: "（民族保守主义）- 大印尼运动党（又称大印尼运动党）是由曾经执政的专业集团党分裂出来的一个团体，旨在复兴苏哈托时代的政治遗产。该党拒绝自由民主，奉行极端民族主义观点，并融合了基于印尼建国五项原则和苏哈托统治时期政策的民粹主义经济立场。"
 IND.Autocracy: "£IND_pro_emerging_autocrat (PKS) 繁荣公正党"
 IND.Autocracy_icon: "£IND_pro_emerging_autocrat"
 IND.Autocracy_desc: "（温和伊斯兰主义） - 繁荣公正党成立于1998年，源于伊斯兰教育运动，最初是一个温和的伊斯兰政党，主要关注政府内部的腐败和改革。然而，随着政治形势的快速变化，其纲领开始转变，宗教因素的影响日益增强，使其立场向右倾斜 - 甚至有指控称其支持更为极端的伊斯兰教原教旨主义。"
 IND.anarchist_communism: "£IND_left_wing_radical (PDI-P) 印度尼西亚民主党斗争派"
 IND.anarchist_communism_icon: "£IND_left_wing_radical"
 IND.anarchist_communism_desc: "（民粹社会民主主义） - 印度尼西亚民主党斗争派由1999年从印度尼西亚民主党叛逃或被迫退出的左翼人士创立，其纲领比苏哈托政权时期所允许的更为激进进步。尽管该党公开宣扬进步政策和纲领，但它拒绝承认自身本质上是社会主义或共产主义，也只是名义上接受左翼标签，而是将自身视为一个致力于世俗民主的包容性运动。与印度尼西亚民主党的命运截然不同，自苏哈托下台以来，印度尼西亚民主党斗争派取得了巨大的成功。"
 IND.Neutral_conservatism: "£IND_neutral_conservative (PD) 民主党"
 IND.Neutral_conservatism_icon: "£IND_neutral_conservative"
 IND.Neutral_conservatism_desc: "（保守技术官僚主义) - 最初主要作为苏西洛・班邦・尤多约诺的政治载体而成立，该党政纲温和，主要主张民族主义、温和社会保守主义与经济自由主义 - 尽管它以世俗化的大帐篷政党（容纳多元立场、面向广泛选民的政党）自居，旨在吸引广泛潜在选民。该党曾一度人气飙升、选举告捷，但随后再度落后于其他政党。"
 IND.Neutral_Libertarian: "£IND_libertarian 国家民主党"
 IND.Neutral_Libertarian_icon: "£IND_libertarian"
 IND.Neutral_Libertarian_desc: "（民族进步主义） - 民族民主党由青年团体民族民主派发展而来，名义上是一个进步的民族主义政党，致力于改革印尼的政治体制。该党的纲领包括民主改革和更加注重经济平等。"
 IND.Neutral_Muslim_Brotherhood: "£IND_moderate_islamist (PPP) 联合发展党"
 IND.Neutral_Muslim_Brotherhood_icon: "£IND_moderate_islamist"
 IND.Neutral_Muslim_Brotherhood_desc: "（传统伊斯兰主义） - 联合发展党成立于1973年苏哈托时期，由几个政纲和选民基础相似的小党强行合并而成，是当时少数几个被容忍的政党之一。在此期间，该党是主要反对党，席位数量仅次于执政党专业集团党，领先于印尼民主党。然而，由于专业集团党和军方对政治的牢牢掌控，该党对执政党的反对收效甚微。在苏哈托“新秩序”时期，该党被迫对其较为伊斯兰化的党派进行温和化处理。但在恢复多党民主制后，该党再次向右翼靠拢，更加倾向于保守主义，并坚定地采取了更为公开的伊斯兰主义立场。"
 IND.Nat_Autocracy: "£IND_military_junta (TNI) 印尼武装部队"
 IND.Nat_Autocracy_icon: "£IND_military_junta"
 IND.Nat_Autocracy_desc: "（民族主义军政府） - 印尼武装部队于1945年成立，最初名为人民安全军。其成立的初衷和参与的第一场重大战役，便是印尼民族革命 - 这场争取独立、反抗荷兰殖民统治的斗争。二战后民族主义情绪高涨，加上印尼最终赢得独立，这股浪潮迅速推动了军队的政治活动。起初，军队围绕着印尼首任总统苏加诺及其社会主义建国五项原则而团结一致。然而，随着西方国家的压力、军队内部的联系以及冷战进程的推进，军队内部开始出现裂痕。最终，右翼势力发动政变，使印尼从此陷入长达90年代的军事独裁统治。苏哈托上台后，政府内外左翼势力遭到清洗。然而，即使独裁统治结束，民主制度恢复，军方在印尼仍然占据主导地位 - 任何试图限制军方权力的努力都因腐败以及来自军方和国内其他势力的压力而受挫。"
 IND.Nat_Fascism: "£generic_Nat_Fascism_small 专业集团党"
 IND.Nat_Fascism_desc: "（极端民族主义）- 成立于1964年的专业集团党，是苏哈托统治时期被称为“新秩序”的威权军事统治的主要政治工具。该党奉行右翼民粹主义、极端民族主义和公开的威权主义观点，力图维持军政府对国家的统治，并贯彻苏哈托及其幕后掌权者的政策和指令。随着“新秩序”的垮台，该党继续存在并参与选举，试图将自身重新定位为一个更为“温和”的政党 - 尽管这些新派别的影响力远不如以往。"
 IND.Monarchist: "£IND_monarchism 哈孟库布沃诺"
 IND.Monarchist_icon: "£IND_monarchism"
 IND.Monarchist_desc: "（苏丹国）- 哈孟库布沃诺家族是日惹苏丹国的统治家族，日惹苏丹国现为印度尼西亚的一个权力下放的君主制国家，位于爪哇岛。哈孟库布沃诺家族成立于1755年，与苏丹国本身的建立时间相同。该家族成功地在敌对政权的阴谋、荷兰的殖民统治、日本的占领以及独立后的时期中幸存下来。"
 SAF.conservatism: "£SAF_conservative (NNP) - 新国家党"
 SAF.conservatism_icon: "£SAF_conservative"
 SAF.conservatism_desc: "（保守主义）\n新国民党\n\n成立于1997年，南非国民党的继承者。人们曾希望这个新政党能够延续国民党广义上的基督教民主与保守主义政策，同时摆脱其前身在种族隔离年代所背负的历史包袱。\n\n新国民党被重塑为一个温和政党，更加注重联邦层面的非种族主义。"
 SAF.liberalism: "£SAF_liberal 民主同盟"
 SAF.liberalism_icon: "£SAF_liberal"
 SAF.liberalism_desc: ""
 SAF.socialism: "£SAF_social_democrat (UDM) - 联合民主运动"
 SAF.socialism_icon: "£SAF_social_democrat"
 SAF.socialism_desc: "（社会民主主义）\n联合民主运动\n\n由前国民党领袖罗尔夫·迈耶与前特兰斯凯黑人家园领导人班图·霍洛米萨将军于1997年创立。该党反对分裂主义，支持多元文化，其政策在社会与经济层面均秉持严格的个人主义理念。"
 SAF.anarchist_communism: "£SAF_neutral_social_democrat (ANC) - 非洲人国民大会"
 SAF.anarchist_communism_icon: "£SAF_neutral_social_democrat"
 SAF.Neutral_conservatism: "£SAF_neutral_conservative (IFP) - I因卡塔自由党"
 SAF.Neutral_conservatism_icon: "£SAF_neutral_conservative"
 SAF.Neutral_conservatism_desc: "（祖鲁保守主义）\n因卡塔自由党\n\n由国王迪努祖鲁之孙曼戈苏图·布特莱齐于1975年创立，因卡塔自由党主要关注影响祖鲁民族的事务，但在广义上寻求以保守主义立场执政，并以“乌班图”精神为指引。尽管自民主统治以来，该党在全国一直拥有相当可观的支持，但其大部分支持者来自[279.GetName]省。\n\n在种族隔离时代，因卡塔自由党处于一个独特的位置 - 布特莱齐曾任半独立班图斯坦“夸祖鲁”的首席部长。在此期间，因卡塔自由党（及布特莱齐）利用其相对特殊的地位，对种族隔离政策表达了批评性的反对。"
 SAF.neutral_Social: "£SAF_left_wing_radical (PAC) - 阿扎尼亚泛非主义者大会"
 SAF.neutral_Social_icon: "£SAF_left_wing_radical"
 SAF.neutral_Social_desc: "（泛非社会主义）\n阿扎尼亚泛非主义者大会\n\n通常简称为“泛非主义者大会”，该党于1959年在索韦托镇的一个公共会堂中成立。泛非主义者大会的成立源于非国大内部的冲突。1950年，非国大在《自由宪章》中采用了新的措辞，更加注重多元种族主义，而泛非主义者大会则倾向于非洲主义。\n其创始人罗伯特·索布克韦在反对“通行证法”的运动中发挥了关键作用，并领导了反对该法的示威活动。1960年沙佩维尔大屠杀后，泛非主义者大会以及非国大遭取缔，该组织遂组建了自己的准军事 组织 - 阿扎尼亚人民解放军，俗称“波科”。\n\n自民主统治以来，泛非主义者大会已不再反对多元种族主义，但仍坚定地站在更广泛的非国大的更左翼 - 尽管他们出于非洲特殊情况仍拒绝马克思主义和共产主义。"
 SAF.Neutral_Communism: "£SAF_neutral_communism (EFF) - 经济自由斗士"
 SAF.Neutral_Communism_icon: "£SAF_neutral_communism"
 SAF.Neutral_Communism_desc: "（泛非桑卡拉主义）\n经济自由斗士\n\n由前非国大青年联盟领袖朱利叶斯·马勒马于2013年创立，经济自由斗士是马勒马被非国大开除后的产物。\n\n经济自由斗士将其政策概括为“七大核心支柱”，从无偿征收土地到打击腐败，其中许多都源于先前的泛非运动与领袖，其中对经济自由斗士影响最大的是托马斯·桑卡拉 - 该党的标志性红色贝雷帽正源自于他。"
 SAF.Neutral_Muslim_Brotherhood: "£SAF_moderate_islamist 非洲穆斯林党"
 SAF.Neutral_Muslim_Brotherhood_icon: "£SAF_moderate_islamist"
 SAF.Neutral_Muslim_Brotherhood_desc: ""
 SAF.Neutral_green: "£SAF_green (GPSA) - 南非绿党"
 SAF.Neutral_green_icon: "£SAF_green"
 SAF.Neutral_green_desc: "（环保主义）\n南非绿党\n\n该党最初于1999年以“人民治理绿党”之名成立，不久后更名为南非绿党。\n\n在其历史中，该党一直是一个相对次要的政党，南非绿党主要在省级层面角逐[281.GetName]，在地方层面角逐$VICTORY_POINTS_12589$，迄今为止在联邦层面鲜有斩获。"
 SAF.Nat_Autocracy: "£SAF_military_junta (SANDF) - 南非国防军"
 SAF.Nat_Autocracy_icon: "£SAF_military_junta"
 SAF.Nat_Autocracy_desc: "（军事军政府）\n南非国防军\n\n种族隔离结束后，南非国防军于1994年重组为目前的形态，取代南非防卫军成为国家武装力量，并同时整合了“民族之矛”（MK）和阿扎尼亚人民解放军（APLA）等准军事组织。"
 SAF.Nat_Fascism: "£SAF_fascism (AWB) - 南非白人抵抗运动"
 SAF.Nat_Fascism_icon: "£SAF_fascism"
 SAF.Nat_Fascism_desc: "（白人至上主义）\n阿非利卡人抵抗运动\n\n由前警官尤金·特雷布兰奇于1973年创立，阿非利卡人抵抗运动最初由白人 - 几乎全是阿非利卡人 - 组成，他们对时任总理B.J.沃斯特领导下的种族隔离制度在种族问题上所表现出的“自由主义观点”感到幻灭。\n\n阿非利卡人抵抗运动是“布尔人国家”理想的坚定支持者，这是一种比“民族国家”更具限制性的形式，主张将南非的大片区域划出，作为仅限白人阿非利卡人居住的地区。"
 SAF.Nat_Populism: "£SAF_right_wing_populism 自由阵线加"
 SAF.Nat_Populism_icon: "£SAF_right_wing_populism"
 SAF.Nat_Populism_desc: ""
 SAF.Monarchist: "£SAF_monarchism 南非联合王国"
 SAF.Monarchist_icon: "£SAF_monarchism"
 SAF.Monarchist_desc: "（君主主义）\n南非联合王国\n\n南非至少拥有七大主要王国，以及可能多达数十个较小的王国与酋长领地。南非联合王国代表着这些君主与酋长的更广泛集合，他们如同一幅拼图，各自治理其辖区，同时维护南非的统一。"
 SAU.Vilayat_e_Faqih: "£SAU_hardline_shite (PGH) 汉志真主党"
 SAU.Vilayat_e_Faqih_icon: "£SAU_hardline_shite"
 SAU.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 汉志真主党\n\n汉志真主党是一个地下组织，自1980年代以来一直对沙特政府进行低烈度的武装斗争。受1979年伊朗革命的启发，该组织旨在以伊斯兰共和国取代沙特王室。它遵循霍梅尼的“法基赫监护”思想，将权力集中于最高法学家手中，因此与伊朗及黎巴嫩真主党结盟。与温和的改革运动不同，该组织拒绝与沙特君主制和解，并继续采取极端主义策略。"
 SAU.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small (RM) 改革运动"
 SAU.Mod_Vilayat_e_Faqih_desc: "（设拉子什叶派伊斯兰主义）- 改革运动（设拉子）\n\n改革运动是一个由沙特阿拉伯东部省份什叶派学者组成的松散网络，他们遵循穆罕默德·设拉子的教义，穆罕默德·设拉子是一位著名的什叶派人物，曾反对阿亚图拉·霍梅尼及其“法基赫监护”思想体系。虽然改革运动曾以“阿拉伯半岛伊斯兰革命组织”的名义对沙特政府发动地下叛乱，但在90年代缓和了言论，与伊朗断绝关系，并同意自行解散以与法赫德国王达成协议 - 国王则长诺释放其成员。如今，该运动的前成员支持温和改革而非伊朗式的革命。这一策略允许沙特王室容忍了他们的持续活动，但也疏远了思想更激进的什叶派青年。"
 SAU.Caliphate: "£SAU_salafist_jihadism (AQ) 基地组织"
 SAU.Caliphate_2009: "£SAU_salafist_jihadism (AQIA)阿拉伯半岛的基地组织"
 SAU.Caliphate_icon: "£SAU_salafist_jihadism"
 SAU.Caliphate_desc: "（萨拉菲圣战主义）- 基地组织\n\n基地组织是由奥萨马·本·拉登和其他所谓“阿富汗阿拉伯人”创立的萨拉菲圣战运动，这些成员曾在苏联入侵阿富汗期间为圣战者组织作战。依托赛义德·库特布的思想体系，基地组织已成为与伊斯兰恐怖主义联系最紧密的团体。其全球圣战的号召力使其在穆斯林世界广泛渗透。自法赫德国王在科威特入侵期间拒绝本·拉登提供的对抗萨达姆·侯赛因的军事援助、转而寻求美国支持以来，基地组织始终致力于用武力推翻沙特王室政权。"
 SAU.Kingdom: "£SAU_kingdom (HoS) 沙特王室"
 SAU.Kingdom_icon: "£SAU_kingdom"
 SAU.Kingdom_desc: "（瓦哈比君主主义）- 沙特王室\n\n自从阿卜杜勒阿齐兹‘伊本沙特’在1900年代初期征服了阿拉伯半岛的大部分地区以来，沙特家族统治了内志、汉志、东部省份、阿西尔、吉赞和纳吉兰的土地。 沙特王室依赖于与瓦哈比派追随者结盟，瓦哈比是一位主张回归“更纯粹”的逊尼派伊斯兰教的萨拉菲派神职人员。瓦哈比教派授予的宗教合法性通过瓦哈比神职人员发布使沙特政治决定神圣化的法特瓦来支持沙特统治。沙特的萨拉菲主义品牌禁止任何形式的政治反对和抗议，这与民粹主义的萨拉菲主义品牌不同，后者反对宗教权威集中在政治精英手中或提倡全球圣战。"
 SAU.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small (IAM) 伊斯兰觉醒运动"
 SAU.Neutral_Muslim_Brotherhood_desc: "（温和伊斯兰主义） - 伊斯兰觉醒运动\n\n萨瓦（伊斯兰觉醒运动）在1990年代作为一个松散的逊尼派神职人员网络出现，他们认为沙特君主制背离了‘真正的’伊斯兰教。该运动推动了沙特阿拉伯王国真正的政治改革，但由于沙特君主制的监禁和异议神职人员的增选而未能取得成功。"
 SAU.Neutral_Muslim_Brotherhood_icon: "£muslim_brotherhood_small"
 SAU.Neutral_Muslim_Brotherhood_2011: "£SAU_reformist_shite 乌玛伊斯兰党"
 SAU.Neutral_Muslim_Brotherhood_2011_desc: "温和伊斯兰主义者 - 乌玛伊斯兰党是一个政治组织，汇集了反对沙特君主制的沙特伊斯兰主义者、知识分子、人权活动家和律师。该党已经代表了沙特阿拉伯内部的现代主义趋势，该趋势寻求将沙特阿拉伯的宗教信仰与政治改革相结合，而不是禁止任何形式的政治异议的瓦哈比主义。"
 SAU.Neutral_Muslim_Brotherhood_2011_icon: "£SAU_reformist_shite"
 SAU.Neutral_green: "£SAU_green 沙特阿拉伯绿党"
 SAU.Neutral_green_icon: "£SAU_green"
 SAU.Neutral_green_desc: ""
 SAU.Nat_Fascism: "£IRQ_Nat_Autocracy_small (ABP) 阿拉伯复兴社会党"
 SAU.Nat_Fascism_icon: "£IRQ_Nat_Autocracy_small"
 SAU.Nat_Fascism_desc: "（复兴党）- 阿拉伯复兴社会党\n\n阿拉伯复兴社会党阿拉伯分支宣扬建立一个横跨大西洋至海湾的统一世俗阿拉伯国家，并以团结、自由和社会主义为旗帜。该党敌视瓦哈比派君主制和伊斯兰反对派，其成员遭到沙特情报部门的追捕，被迫转入地下或流亡巴格达和大马士革。如果他们能够控制阿拉伯半岛，他们将把整个半岛及其石油资源纳入其泛阿拉伯共和国的梦想之中。"
 SAU.Nat_Autocracy: "£generic_Nat_Autocracy_small (SAF) 沙特阿拉伯武装力量"
 SAU.Nat_Autocracy_desc: ""
 TUR.Western_Autocracy: "£TUR_Western_Autocracy (HM) 居伦运动"
 TUR.Western_Autocracy_icon: "£TUR_Western_Autocracy"
 TUR.Western_Autocracy_desc: "（伊斯兰民主主义）- 居伦运动\n\n居伦运动，是由法图拉·居伦领导的一个跨国伊斯兰社交圈。该组织的目标是倡导不同信仰间的对话，提高全世界穆斯林的地位，目标是成为世界领先的穆斯林网络。一些人担心，他们的目标与穆斯林兄弟会并没有什么不同，他们的主要目标是伊斯兰教的统治。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.conservatism: "£TUR_conservatism  (CHP) 共和人民党"
 TUR.conservatism_icon: "£TUR_conservatism"
 TUR.conservatism_desc: "（凯末尔主义）- 共和人民党\n\n共和人民党是由阿塔尔图克本人创立的社会民主凯末尔主义政党。该党亲欧盟，其许多成员支持LGBT和女性权利，通常被视为该国较为西化和进步的政党之一。\n\n该党于军方的§Y地位§!：§G+100§!"
 TUR.liberalism: "£TUR_liberalism (LDP)自由民主党"
 TUR.liberalism_icon: "£TUR_liberalism"
 TUR.liberalism_desc: "（自由主义）- 自由民主党\n\n自由民主党是土耳其商人贝西姆·蒂布克创立的古典自由主义政党。\n\n该党于军方的§Y地位§!：§G+50§!"
 TUR.socialism: "£TUR_socialism (DSP)民主左翼党"
 TUR.socialism_icon: "£TUR_socialism"
 TUR.socialism_desc: "（社会民主主义）- 民主左翼党\n\n民主左翼党是一个旨在改革土耳其经济的凯末尔社会主义政党。该党非常亲欧洲，并希望土耳其进一步融入欧盟。\n\n该党于军方的§Y地位§!：§G+100§!"
 TUR.anarchist_communism: "£TUR_anarchist_communism (ODP) 自由和团结党"
 TUR.anarchist_communism_icon: "£TUR_anarchist_communism"
 TUR.anarchist_communism_desc: "（左翼民粹主义）- 自由与团结党\n\n自由与团结党是一个左翼民粹社会主义政党。该党的核心理念是自由意志社会主义，其模式借鉴了20世纪70年代革命之路的工会运动。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.Conservative: "£TUR_Conservative (FP) 美德党"
 TUR.Conservative_icon: "£TUR_Conservative"
 TUR.Conservative_desc: "（伊斯兰主义） - 美德党\n\n美德党是一个伊斯兰主义政党。它的许多现任成员也是其他伊斯兰主义政党的成员，所有这些政党都在土耳其共和国的世俗借口下被禁止。\n\n该党于军方的§Y地位§!：§R-100§!"
 TUR.Conservative_reform: "£TUR_Conservative_reform (SP) 至福党"
 TUR.Conservative_reform_icon: "£TUR_Conservative_reform"
 TUR.Conservative_reform_desc: "（伊斯兰主义） - 至福党\n\n至福党是一个伊斯兰主义政党，由旧美德党的强硬派组成，现在已经被禁止。该党是埃尔多安的正义与发展党的主要竞争对手之一，他们反对土耳其加入欧盟，反对美国和以色列。该党声称，土耳其应该在保护穆斯林世界免受西方威胁方面发挥主导作用。\n\n该党于军方的§Y地位§!：§R100§!"
 TUR.Autocracy: "£TUR_Autocracy (EMEP) 劳动党"
 TUR.Autocracy_icon: "£TUR_Autocracy"
 TUR.Autocracy_desc: "（马克思列宁主义）- 劳动党\n\n劳动党是一个遵循科学社会主义的政党，其目标是建立一个民主和独立的土耳其。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.Caliphate: "£TUR_Caliphate (IBDA-C) 大东方伊斯兰袭击者阵线"
 TUR.Caliphate_icon: "£TUR_Caliphate"
 TUR.Caliphate_desc: "（伊斯兰军国主义）- 大东方伊斯兰突击者阵线\n\n大东方伊斯兰突击者阵线是一个伊斯兰激进组织，遵循涅西普·法佐·基萨库雷克的教义。该组织的目标是在中东建立一个逊尼派伊斯兰联邦国家，并重建哈里发制度。\n\n该党于军方的§Y地位§!：§R-250§!"
 TUR.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small 温和伊斯兰主义者"
 TUR.Neutral_Muslim_Brotherhood_icon: "£muslim_brotherhood_small"
 TUR.Neutral_Muslim_Brotherhood_desc: ""
 TUR.Neutral_Autocracy: "£TUR_Neutral_Autocracy (GP) 青年党"
 TUR.Neutral_Autocracy_icon: "£TUR_Neutral_Autocracy"
 TUR.Neutral_Autocracy_desc: "（自由民粹主义）- 青年党\n\n青年党是一个民粹自由主义政党。该党领导人杰姆·乌赞利用家族的媒体帝国来提高自己的支持率，有人怀疑他参与腐败和不正当的商业活动。\n\n该党于军方的§Y地位§!：§G+50§!"
 TUR.Neutral_Autocracy_reform: "£TUR_Western_Autocracy 居伦运动"
 TUR.Neutral_Autocracy_reform_icon: "£TUR_Western_Autocracy"
 TUR.Neutral_Autocracy_reform_desc: "（伊斯兰民主主义）- 居伦运动\n\n居伦运动，是由法图拉·居伦领导的一个跨国伊斯兰社交圈。该组织的目标是倡导不同信仰间的对话，提高全世界穆斯林的地位，目标是成为世界领先的穆斯林网络。一些人担心，他们的目标与穆斯林兄弟会并没有什么不同，他们的主要目标是伊斯兰教的统治。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.Neutral_conservatism: "£generic_Neutral_conservatism_small (MP) 民族党"
 TUR.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 TUR.Neutral_conservatism_desc: "（保守主义）- 民族党\n\n民族党是一个保守的民族主义政党。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.oligarchism: "£TUR_oligarchism (DYP) 正确道路党"
 TUR.oligarchism_icon: "£TUR_oligarchism"
 TUR.oligarchism_desc: "（温和派）- 正确道路党\n\n正确道路党是一个自由保守主义政党。其许多成员卷入了苏苏尔卢克丑闻，该丑闻揭露了该党多名议员与土耳其黑帮有牵连。\n\n该党于军方的§Y地位§!：§R-25§!"
 TUR.oligarchism_2007: "£TUR_oligarchism 民主党"
 TUR.oligarchism_2007_icon: "£TUR_oligarchism"
 TUR.oligarchism_2007_desc: "DP - 民主党是一个自由保守的政党，由旧的正确道路党重新命名。该党的许多成员都卷入了苏苏尔卢克丑闻，据透露该党的许多议员都与土耳其黑帮有牵连。\n\n该党于军方的§Y地位§!：§R-25§!"
 TUR.Neutral_Libertarian: "£TUR_Neutral_Libertarian (ANAP)祖国党"
 TUR.Neutral_Libertarian_icon: "£TUR_Neutral_Libertarian"
 TUR.Neutral_Libertarian_desc: "（自由主义）- 祖国党\n\n祖国党是支持自由市场改革的新自由主义政党。\n\n该党于军方的§Y地位§!：§G+50§!"
 TUR.Neutral_green: "£TUR_Neutral_green (HADEP)民众民主党"
 TUR.Neutral_green_icon: "£TUR_Neutral_green"
 TUR.Neutral_green_desc: "（社会民主主义） - 民众民主党\n\n民众民主党是库尔德少数民族政党。该党的政纲包括社会民主、绿色政治、少数民族和妇女权利。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.Neutral_green_phase1: "£TUR_Neutral_green_phase1 民主人民党"
 TUR.Neutral_green_phase1_icon: "£TUR_Neutral_green_phase1"
 TUR.Neutral_green_phase1_desc: "DEHAP - 民主人民党是库尔德少数民族政党。该党的政纲包括社会民主、绿色政治、少数民族和妇女权利。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.Neutral_green_phase2: "£TUR_Neutral_green_phase2 民主社会党"
 TUR.Neutral_green_phase2_icon: "£TUR_Neutral_green_phase2"
 TUR.Neutral_green_phase2_desc: "DTP - 民主社会党是库尔德少数民族政党。该党的政纲包括社会民主、绿色政治、少数民族和妇女权利。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.Neutral_green_phase3: "£TUR_Neutral_green_phase3 和平民主党"
 TUR.Neutral_green_phase3_icon: "£TUR_Neutral_green_phase3"
 TUR.Neutral_green_phase3_desc: "BDP - 和平民主党是库尔德少数民族政党。该党的政纲包括社会民主、绿色政治、少数民族和妇女权利。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.Neutral_green_phase4: "£TUR_Neutral_green_phase4 人民民主党"
 TUR.Neutral_green_phase4_icon: "£TUR_Neutral_green_phase4"
 TUR.Neutral_green_phase4_desc: "HDP - 人民民主党是一个支持少数民族的政党。该党的政纲包括社会民主、绿色政治、少数民族和妇女权利。他们还支持组建地方人民议会。\n\n该党于军方的§Y地位§!：§R-50§!"
 TUR.neutral_Social: "£TUR_neutral_Social 权利与平等党"
 TUR.neutral_Social_icon: "£TUR_neutral_Social"
 TUR.neutral_Social_desc: "HEPAR - 权利与平等党是由“传奇指挥官”奥斯曼·帕穆科卢创立的政党。该党严格遵循凯末尔主义，目标是创造一个没有阶级和特权的社会。与其他政党不同，权利与平等党完全由公众捐款资助。\n\n该党于军方的§Y地位§!：§G+100§!"
 TUR.Neutral_Communism: "£TUR_Neutral_Communism (PKK) 库尔德斯坦工人党"
 TUR.Neutral_Communism_icon: "£TUR_Neutral_Communism"
 TUR.Neutral_Communism_desc: "（自由社会主义） - 库尔德斯坦工人党\n\n库尔德斯坦工人党是一个库尔德武装和政治组织，为土耳其的库尔德人寻求政治和文化权利。库尔德工人党的政治意识形态是马克思列宁主义、库尔德民族主义、自由社会主义和民主联盟主义的混合体。\n\n该党于军方的§Y地位§!：§R-250§!"
 TUR.Nat_Populism: "£TUR_Nat_Populism (MHP)民族主义行动党"
 TUR.Nat_Populism_icon: "£TUR_Nat_Populism"
 TUR.Nat_Populism_desc: "（新奥斯曼主义）- 民族主义行动党\n\n民族主义行动党是一个极端民族主义政党。该党遵循其创始人提出的“九光主义”教义，尽管自90年代末以来，他们融入了保守的伊斯兰教元素。一些人将该组织归类为新法西斯主义，因为它与灰狼组织的关系，以及该组织许多成员发表的种族主义言论。\n\n该党于军方的§Y地位§!：§R-100§!"
 TUR.Nat_Fascism: "£TUR_Nat_Fascism (BK)灰狼"
 TUR.Nat_Fascism_icon: "£TUR_Nat_Fascism"
 TUR.Nat_Fascism_desc: "（泛突厥主义）-灰狼\n\n灰狼是隶属于民族主义行动党的极右翼组织。经常被描述为新法西斯主义者，一些人将其归类为民族解放运动的准军事派别。该组织支持泛突厥主义。该组织策划了多起暗杀和其他暴力犯罪，其武装人员经常参与外国冲突。\n\n该党于军方的§Y地位§!：§R-100§!"
 TUR.Nat_Autocracy: "£TUR_Nat_Autocracy (TSK) 土耳其武装力量"
 TUR.Nat_Autocracy_icon: "£TUR_Nat_Autocracy"
 TUR.Nat_Autocracy_desc: "（民族主义军政府） - 土耳其武装力量\n\n土耳其武装力量是土耳其共和国的主要军事力量。军方经常干预政治，每当它觉得共和国的凯末尔主义理想受到伊斯兰主义者的攻击时，就会发动政变。\n\n该党于军方的§Y地位§!：§G+200§!"
 TUR.Monarchist: "£TUR_Monarchist (HoS) 奥斯曼皇室"
 TUR.Monarchist_icon: "£tur_nationalist_monarchist"
 TUR.Monarchist_desc: "（绝对君主制） - 奥斯曼王室\n\n奥斯曼王室统治奥斯曼帝国长达600年。1922年土耳其独立战争后，该家族被废黜，并被流放（尽管流放后来被解除）。在土耳其，王室的民众支持率仍然很低，因为土耳其人认为土耳其已经从奥斯曼帝国中获得独立，而不是奥斯曼帝国的延续。\n\n该党于军方的§Y地位§!：§R-100§!"
 UKR.conservatism: "£ukr_pmu (NRU) -乌克兰人民之声"
 UKR.conservatism_icon: "£ukr_pmu"
 UKR.conservatism_desc: "（民族民主主义） - 乌克兰人民运动\n\n乌克兰人民运动成立于1989年，起源于异见人士群体，是乌克兰历史上具有独立意义的民族民主政党，也是该国最坚定的亲西方力量。"
 UKR.liberalism: "£ukr_prp (PRP) - 改革与秩序"
 UKR.liberalism_desc: "（市场自由主义） - 改革与秩序党\n\n维克托·平泽尼克领导的改革与秩序党是 2000 年代典型的乌克兰市场自由主义政党：放松管制、税制改革和欧洲一体化。"
 UKR.socialism: "£ukr_fatherland (BAT) - 全乌克兰联盟“祖国”"
 UKR.socialism_desc: "（民粹社会民主主义）- 全乌克兰联盟“祖国”\n\n全乌克兰联盟“祖国”成立于1999年7月9日，以尤利娅·季莫申科的议会党团为中心，将民族民主政治与社会民粹主义相结合。"
 UKR.Western_Autocracy: "£ukr_sdpu (SDPU) - 乌克兰社会民主党（联合）"
 UKR.Western_Autocracy_desc: "（寡头社会民主主义）- 乌克兰社会民主党（联合）\n\n乌克兰社会民主党（联合）是维克托·梅德韦丘克领导的基辅集团的政党：它是社会党国际的成员，名义上亲欧，但实际上是一个依靠行政压力建立起来的寡头政治机器。"
 UKR.Conservative: "£ukr_regions (PR) - 地区党"
 UKR.Conservative_icon: "£ukr_regions"
 UKR.Conservative_desc: "（寡头地区主义）- 地区党\n\n地区党是顿涅茨克家族的政治机器，于2001年3月由地区复兴党更名而来。该党名义上对欧盟持务实态度，实则是亲俄的东部和南部地区的政治家园。"
 UKR.Autocracy: "£UKR_feminism (PSPU) - 乌克兰进步社会党"
 UKR.Autocracy_desc: "（新苏联泛斯拉夫主义）- 乌克兰进步社会党\n\n娜塔莉娅·维特连科领导的进步社会主义党结合了新苏维埃社会主义、泛斯拉夫主义以及对北约和西方的激进反对。"
 UKR.anarchist_communism: "£UKR_anarchism_communism (SAU) - 乌克兰无政府主义联盟"
 UKR.anarchist_communism_desc: "（无政府共产主义）- 乌克兰无政府主义联盟\n\n乌克兰无政府主义联盟是1989年苏联时期无政府主义复兴运动的继承者，是一个规模较小的自由意志社会主义运动。"
 UKR.Neutral_conservatism: "£ukr_presedent (NDP) - 人民民主党"
 UKR.Neutral_conservatism_icon: "£ukr_presedent"
 UKR.Neutral_conservatism_desc: "（行政中心主义）- 人民民主党\n\n人民民主党是列昂尼德·库奇马的执政党，它是一个官僚机器，维系着总统的权力体系，但它本身没有任何外交政策路线。"
 UKR.oligarchism: "£ukr_trudova (TU) - 乌克兰劳工党"
 UKR.oligarchism_desc: "（管理寡头政治）- 乌克兰劳工党\n\n乌克兰劳工党是第聂伯罗彼得罗夫斯克家族的政党，由谢尔盖·蒂希普科和维克托·平丘克领导，是一个为工业金融集团服务的管理机构。"
 UKR.neutral_Social: "£ukr_spu (SPU) - 乌克兰社会党"
 UKR.neutral_Social_icon: "£ukr_spu"
 UKR.neutral_Social_desc: "（民主社会主义）- 乌克兰社会党\n\n乌克兰社会党成立于1991年，是在共产党被取缔之后成立的。在曾两度担任议长的奥列克桑德·莫罗兹的领导下，该党长期以来一直是议会中的第四大力量。"
 UKR.Neutral_Libertarian: "£ukr_yabluko (YAB) - 亚布罗党"
 UKR.Neutral_Libertarian_desc: "（小企业自由主义）- 亚布罗\n\n亚布罗是米哈伊洛·布罗德斯基领导的代表小企业的市场自由主义政党，致力于反对官僚机构对企业家的压力。"
 UKR.Neutral_Libertarian_2017: "£ukr_servant_of_the_people (SN) - 人民公仆"
 UKR.Neutral_Libertarian_2017_icon: "£ukr_servant_of_the_people"
 UKR.Neutral_Libertarian_2017_desc: "（大帐篷民粹主义）- 人民公仆\n\n人民公仆党成立于2017年末，以热门电视剧命名，在2019年凭借包容各方的民粹主义、反腐败运动以及通过与莫斯科对话结束战争的承诺赢得了43%的选票。"
 UKR.Neutral_Autocracy: "£ukr_demsoyuz (DS) - 乌克兰互联网党"
 UKR.Neutral_Autocracy_desc: "（行政庇护主义）- 民主联盟\n\n民主联盟是奥列克桑德·沃尔科夫的个人机器，他曾是列昂尼德·库奇马1999年连任竞选的幕后操盘手。该组织没有意识形态，也没有外交政策路线：它的存在只是为了将与总统的密切关系转化为影响力。"
 UKR.Neutral_Communism: "£UKR_neutral_communism (SKU) - 乌克兰共产党人联盟"
 UKR.Neutral_Communism_desc: "（反修正马克思列宁主义）- 乌克兰共产党人联盟\n\n乌克兰共产党人联盟是一个反修正主义的马克思列宁主义政党，认为现代冲突是资产阶级冲突，并拒绝与俄罗斯结盟。"
 UKR.Neutral_green: "£ukr_greens (PZU) - 乌克兰绿党"
 UKR.Neutral_green_icon: "£ukr_greens"
 UKR.Neutral_green_desc: "（环保主义）- 乌克兰绿党\n\n乌克兰绿党起源于切尔诺贝利事故后的生态运动，在1998年赢得了5.4%的选票和一个党团。"
 UKR.Neutral_Muslim_Brotherhood: "£UKR_neutral_muslim (MF) - 人民党"
 UKR.Neutral_Muslim_Brotherhood_desc: "（克里米亚鞑靼自治主义）- 人民党\n\n人民党是一个立场较为亲俄的克里米亚鞑靼组织，致力于在俄罗斯势力范围内维护克里米亚鞑靼人的权利。"
 UKR.Nat_Autocracy: "£urk_armed_forces (ZSU) - 乌克兰武装力量"
 UKR.Nat_Autocracy_desc: "（军政府）- 乌克兰武装部队\n\n乌克兰武装部队作为政治行动者：军队直接夺取政权的局面。"
 UKR.Nat_Fascism: "£ukr_kongress (KUN) - 乌克兰民族主义者代表大会"
 UKR.Nat_Fascism_desc: "（整体民族主义）- 乌克兰民族主义者代表大会\n\n乌克兰民族主义者大会是乌克兰民族主义者组织的传统政党，联合了乌克兰国民议会-乌克兰人民自卫队和三叉戟等准军事团体。"
 UKR.Nat_Populism: "£ukr_snpu (SNPU) - 乌克兰社会民族党"
 UKR.Nat_Populism_icon: "£ukr_snpu"
 UKR.Nat_Populism_desc: "（社会民族主义）- 乌克兰社会民族党\n\n乌克兰社会民族党成立于1991年，在更名之前曾使用狼钩标志和公开的激进言论。"
 UKR.Monarchist: "£UKR_monarchism (HS) - 斯科罗帕茨基王室"
 UKR.Monarchist_desc: "（盖特曼君主主义）- 斯科罗帕茨基王室\n\n斯科罗帕茨基王室是一个哥萨克贵族家族，在1918年由盖特曼帕夫洛·斯科罗帕茨基领导乌克兰国家。"
 RAJ.conservatism: "£RAJ_Neutral_conservatism (TRS) - 泰伦加纳民族党"
 RAJ.conservatism_icon: "£RAJ_Neutral_conservatism"
 RAJ.conservatism_desc: "(地区保守主义) - 泰伦加纳民族党\n\n泰伦加纳民族党由K·钱德拉谢卡尔·拉奥于2001年创立，此前他离开了泰卢固之乡党。该党旨在从安得拉邦分离出一个独立的泰伦加纳邦。泰伦加纳民族党结合了群众运动和绝食抗议，并不断变换联盟，先是支持全国民主联盟，后又支持联合进步联盟，以换取其在建邦问题上的支持。2014年，泰伦加纳邦正式成立，泰伦加纳民族党在新邦执政，其政策主要包括福利转移、大型灌溉工程和农业补贴。"
 RAJ.liberalism: "£RAJ_liberalism (BSP) - 大众社会党"
 RAJ.liberalism_desc: "(社会自由主义) - 大众社会党\n\n由坎希·拉姆于1984年创立，其前身是早期的全印度落后阶层和少数族裔员工联合会和DS-4运动。该党以大众社会党的名义，组织达利特人、其他落后阶级和宗教少数群体，其理论源自B·R·安贝德卡尔。在玛雅瓦蒂的领导下，该党在北方邦组建了四届政府，其中最近一届（2007年至2012年）通过扩大选民基础，纳入婆罗门选民，赢得了绝对多数席位。该党的纲领以种姓保留、为无地农民提供土地和公共部门就业为核心。"
 RAJ.socialism: "£RAJ_socialism (INC) - 印度国民大会党"
 RAJ.socialism_icon: "£RAJ_socialism"
 RAJ.socialism_desc: "(社会民主主义) - 印度国民大会党\n\n印度国民大会党成立于1885年，在甘地和尼赫鲁的领导下，领导了印度独立运动，并在1947年后的大部分时间里执政。该党将世俗主义和社会福利与纳拉辛哈·拉奥和曼莫汉·辛格于1991年开启的市场改革相结合。在近代的大部分历史时期，该党都由尼赫鲁-甘地家族领导。2004年，该党领导联合进步联盟重返执政，并通过了农村就业保障法和信息公开法。在外交政策方面，该党奉行不结盟政策，与莫斯科保持长期友好关系，并与华盛顿保持密切接触。"
 RAJ.Western_Autocracy: "£RAJ_Western_Autocracy (JD) - 人民党"
 RAJ.Western_Autocracy_icon: "£RAJ_Western_Autocracy"
 RAJ.Western_Autocracy_desc: "(社会民粹主义) - 人民党\n\n人民党于1988年由人民阵线、人民党、民众党和国大党（世俗派）合并而成，旨在联合反对拉吉夫·甘地。在V·P·辛格的领导下，人民党于1989年至1990年领导国民阵线政府，并落实了曼达尔委员会的建议，为其他落后阶级保留中央政府职位。其纲领融合了洛希亚社会主义和以博福斯丑闻为基础的反腐败运动。此后，人民党经历了多次分裂，衍生出人民党（联合派）、人民党（世俗派）、国民人民党和比朱人民党，使其母党沦为边缘力量。"
 RAJ.Conservative_icon: "£RAJ_Conservative_communism"
 RAJ.Conservative: "£RAJ_Conservative_communism (NCP) - 民族主义国大党"
 RAJ.Conservative_desc: "（农业社会民主主义） - 民族主义国大党\n\n沙拉德·帕瓦尔因反对索尼娅·甘地的外国出生而被印度国民大会党开除，之后于1999年创立了民族主义国大党。该党的实力主要依靠马哈拉施特拉邦西部的糖业合作社、地区银行和教育信托基金，这些机构使其掌控了决定当地选举结果的农村信贷。尽管在建党之初存在分歧，该党仍与国大党共同执政马哈拉施特拉邦，并加入了中央的联合进步联盟，执掌农业部长达十年之久。"
 RAJ.anarchist_communism: "£RAJ_left_wing_radical (RSP) - 革命社会主义党"
 RAJ.anarchist_communism_icon: "£RAJ_left_wing_radical"
 RAJ.anarchist_communism_desc: "（革命社会主义） - 革命社会主义党\n\n革命社会主义党成立于1940年，由阿努希兰·萨米蒂的激进分子创立，他们既拒绝甘地的非暴力理念，也拒绝共产国际的纪律。该党主张自下而上地构建马克思主义纲领，并且从未接受过对任何大型共产党的服从。其基本盘仅限于西孟加拉邦、喀拉拉邦和特里普拉邦。在特里普拉邦，该党曾作为左翼阵线成员参选，但由于席位分配问题，其喀拉拉邦支部于2014年加入由国大党领导的联合民主阵线。"
 RAJ.Caliphate: "£RAJ_Caliphate (LeT) - 虔诚军"
 RAJ.Caliphate_icon: "£RAJ_Caliphate"
 RAJ.Caliphate_desc: "(萨拉菲圣战主义) - 虔诚军\n\n虔诚军成立于1987年，是达瓦与伊尔沙德中心的武装分支，其活动基地位于巴基斯坦旁遮普邦，反对印度在克什米尔的统治。该组织参与了2001年印度议会袭击事件，并于2008年11月策划了孟买恐怖袭击，造成160多人死亡。虔诚军的目标是摧毁印度政权，恢复穆斯林对次大陆的统治，因此被印度、美国和联合国列为非法组织。"
 RAJ.Neutral_conservatism: "£RAJ_conservatism (BJP) - 印度人民党"
 RAJ.Neutral_conservatism_icon: "£RAJ_conservatism"
 RAJ.Neutral_conservatism_desc: "(印度民族主义) - 印度人民党\n\n印度人民党由印度人民同盟的前成员于1980年在人民联盟解体后创立，其干部主要来自国民志愿服务团。该党在20世纪90年代初的罗摩诞生地运动中崛起，并于1998年至2004年由阿塔尔·比哈里·瓦杰帕伊领导的全国民主联盟执政，瓦杰帕伊上任几周后便下令进行博克兰核试验。该党将印度教民族主义文化与亲商经济政策相结合，在克什米尔和巴基斯坦问题上采取强硬立场，并致力于与美国和以色列建立更紧密的防务关系。"
 RAJ.neutral_Social: "£RAJ_neutral_Social (SP) - 印度社会党"
 RAJ.neutral_Social_icon: "£RAJ_neutral_Social"
 RAJ.neutral_Social_desc: "(民主社会主义) - 印度社会党\n\n穆拉亚姆·辛格·亚达夫于1992年在人民党解体后创立了社会党，继承了北方落后种姓运动的洛希亚社会主义思想。该党在北方邦的根基在于亚达夫农民和穆斯林选民的联盟，并在穆拉亚姆及其子阿克希莱什的领导下组建了多个邦政府。社会党主张种姓保留制度、农产品支持价格，并抵制印度教民族主义动员。在南方，全印安纳德拉维达进步联盟扮演着类似的角色，将德拉维达地区主义与福利民粹主义相结合。"
 RAJ.Neutral_Autocracy: "£RAJ_Neutral_Autocracy (AITC) - 全印草根大会"
 RAJ.Neutral_Autocracy_icon: "£RAJ_Neutral_Autocracy"
 RAJ.Neutral_Autocracy_desc: "(地区民粹主义) - 全印草根大会\n\n玛玛塔·班纳吉于1998年与西孟加拉邦国大党决裂，创立了全印草根大会党。她指责西孟加拉邦国大党与执政的左翼阵线勾结。该党以辛格尔和南迪格拉姆的农民反抗土地征用运动为竞选纲领，于2011年结束了西孟加拉邦长达34年的共产党统治，并一直执政至今。其政治纲领以班纳吉的个人权威、福利分配和与中央政府的对抗为基础。"
 RAJ.Neutral_Communism: "£RAJ_Neutral_Communism (CPI-M) - 印度共产党-马克思主义派"
 RAJ.Neutral_Communism_icon: "£RAJ_Neutral_Communism"
 RAJ.Neutral_Communism_desc: "（马克思列宁主义） - 印度共产党（马克思主义派）\n\n印度共产党（马克思主义派）于1964年因印度共产党与国大党妥协以及在中苏争端中与莫斯科结盟而脱离印度共产党。它是左翼阵线中最大的政党，从1977年至2011年不间断地执政西孟加拉邦，是历史上执政时间最长的民选共产党政府，此外还在喀拉拉邦和特里普拉邦长期执政。其政绩包括“巴尔加行动”土地征用改革以及导致其失去西孟加拉邦的工业用地征用。在2008年与美国达成核协议之前，它一直从外部支持联合进步联盟。"
 RAJ.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small (IUML) - 印度联合穆斯林联盟"
 RAJ.Neutral_Muslim_Brotherhood_desc: "（温和伊斯兰主义） - 印度联合穆斯林联盟\n\n印度穆斯林联盟成立于1948年，由印巴分治后留在印度的全印穆斯林联盟成员组成。其大本营位于喀拉拉邦北部的马拉巴尔地区，在泰米尔纳德邦和拉克沙群岛也拥有一定影响力。该联盟一直是国大党领导的联合民主阵线的长期合作伙伴。其宗旨在于促进穆斯林教育发展、维护少数族裔保留名额以及在世俗宪政秩序内保护穆斯林个人法，而非建立伊斯兰国家。"
 RAJ.Nat_Autocracy: "£RAJ_Nat_Autocracy (IAF) - 印度武装部队"
 RAJ.Nat_Autocracy_icon: "£RAJ_Nat_Autocracy"
 RAJ.Nat_Autocracy_desc: "（军政府） - 印度武装部队\n\n自独立以来，印度武装部队一直处于文官控制之下，这在次大陆其他地方是绝无仅有的。各军种司令直接向国防部负责。他们通过战略部队司令部掌握着国家的核武器，并多次被用于维护克什米尔和东北部地区的内部安全。只有文官权威崩溃，军官团才会掌控政府，而这样的政权将依靠职业官僚机构，而非政党。"
 RAJ.Nat_Fascism: "£RAJ_Nat_Fascism (SS) - 湿婆军"
 RAJ.Nat_Fascism_icon: "£RAJ_Nat_Fascism"
 RAJ.Nat_Fascism_desc: "（印度教民族主义） - 湿婆军\n\n巴尔·萨克雷于1966年创立了湿婆军，最初是孟买马拉地语使用者反对南印度移民的运动，并在20世纪70年代将其发展成为一个印度教民族主义政党。该党曾长期掌控孟买市政公司，并在1995年至1999年间与印度人民党共同执政马哈拉施特拉邦，并卷入了1992年至1993年的孟买骚乱。其权力并非源于书面纲领，而是依靠社区分支机构、对工会的控制以及萨克雷家族的个人权威。"
 RAJ.Nat_Populism: "£RAJ_nationalist_right_wing_populist (MNS) - 马哈拉施特拉改革军"
 RAJ.Nat_Populism_desc: "（本土民粹主义） - 马哈拉施特拉改革军\n\n2006年，拉杰·塔克雷的叔叔巴尔·塔克雷将湿婆军的领导权移交给堂兄乌达夫·塔克雷后，他创立了马哈拉施特拉改革军。该党效仿湿婆军的街头煽动方式，但其纲领更为狭隘，以马拉地语本土主义为核心，主要针对来自比哈尔邦和北方邦的务工人员、北印度出租车司机以及没有马拉地语招牌的商铺。该党在2009年的选举中达到鼎盛，当时它在孟买分散了湿婆军的选票。此后，该党的竞选活动在反移民和反穆斯林之间摇摆不定。"
 RAJ.Monarchist: "£RAJ_nationalist_monarchist (ABHM) - 全印度印度教大集会"
 RAJ.Monarchist_desc: "（印度教君主制） - 全印度印度教大集会\n\n全印印度教大集会成立于1915年，是V·D·萨瓦卡尔的代表机构。萨瓦卡尔的印度教民族主义教义以神圣的地理而非单纯的信仰来定义国家。1948年，该组织前成员纳图拉姆·戈德西刺杀甘地后，其影响力迅速衰落。如今，它作为一个边缘组织仍然存在，呼吁建立印度教国家、修复寺庙遗址以及在法律上承认印度教至高无上的地位。"
 JAP.conservatism: "£JAP_conservatism (LDP) - 自由民主党"
 JAP.conservatism_desc: "（保守主义） - 自由民主党\n\n自民党成立于1955年，由自由党和日本民主党合并而成，其背景是日本社会党的重新统一等事件。它是日本主要的保守派政党，倡导自由民主理念，并在战后时期执政时间最长。自民党内部既有许多保守派议员，例如以“清和政作研究会”为代表的派系，也包含相对自由派的成员，使其成为一个典型的包容性政党。党内存在多种思潮和派系，其政策也常常随时期和领导层而变化；然而，其党纲倡导家庭纽带和爱国主义等保守价值观，并通过推进权力下放等措施来实现小政府的目标。在安全政策方面，它采取以《日美安保条约》为中心的现实主义方针；在宪法第九条方面，它表示将维持目前的解释，同时在宪法中明确规定自卫队。"
 JAP.liberalism: "£JAP_liberalism (DPJ) - 日本民主党"
 JAP.liberalism_icon: "£JAP_liberalism"
 JAP.liberalism_desc: "（自由主义） - 日本民主党\n\n日本民主党成立于1998年，由多个反对党合并而成，其定位为中左翼、改革导向的政党，旨在挑战长期保守的统治。该党的纲领强调廉洁治理、加强透明度和问责制，并将政治影响力从根深蒂固的中央机构转移到公民和地方政府。\n\n日本民主党倡导建立在机会平等和公平基础上的包容性社会，并与维护日本战后宪政秩序密切相关。它广泛支持宪法第九条和和平主义战略文化，同时承认日本自卫队是保卫领土和保护公众的必要工具。"
 JAP.socialism: "£JAP_socialism (KP) - 公明党"
 JAP.socialism_icon: "£JAP_socialism"
 JAP.socialism_desc: "(社会民主主义) - 公明党\n\n公明党于1998年以现代形式重建，自诩为“人道主义社会主义”政党，将人的安全、尊严和社会福利置于公共政策的核心。它强调以同情心为导向的治理、务实的社会改革和尊重生命的伦理，同时将自身定位为那些感到被日本主要政治集团忽视的普通民众的代言人。\n\n在制度上，公明党主张权力下放，加强地方和都道府县相对于中央各部委的自治权。在外交和经济政策方面，公明党通常强调通过扩大贸易和稳定区域关系（包括与中国的交往）来促进繁荣，同时兼顾日本与美国同盟的战略需求。"
 JAP.Neutral_Communism: "£JAP_Communist_State (JCP) - 日本共产党"
 JAP.Neutral_Communism_desc: "（民主共产主义） - 日本共产党\n\n日本共产党是世界上规模最大的共产党之一，但从未进入过国家政府。与苏联或中国式的模式不同，日本共产党历来坚持独立路线，拒绝一党专制，并以宪政议会制政党的身份在日本民主框架内运作。\n\n自1991年冷战结束和苏联解体以来，日本共产党在选举和组织方面持续衰落。尽管该党推行了纲领性改革，并在公民自由、社会福利和反腐败政治方面树立了鲜明的形象，但由于选民往往对社会主义经济路线持怀疑态度，该党难以扩大支持率。因此，日本共产党仍然是主要反对党之一，其工作重点是监督执政联盟，并将自身定位为国会中秉持原则的监督者。"
 JAP.Nat_Autocracy: "£JAP_Nat_Autocracy (JSDF) - 日本自卫队"
 JAP.Nat_Autocracy_icon: "£JAP_Nat_Autocracy"
 JAP.Nat_Autocracy_desc: "（军事国家主义） - 日本自卫队\n\n日本自卫队成立于1954年，是在日本战后安全架构和与美国密切合作的背景下建立的。在严格的宪法和政治约束下，自卫队主要发展成为一支防御性军队。几十年来，高调的灾害救援和民事支援行动在塑造公众对其的信任度和使其成为值得信赖的国家机构方面发挥了重要作用。\n\n尽管实战经验有限，但日本自卫队被广泛认为是一支高度专业化、技术先进且能与美军协同作战的部队。进入新千年，其核心政治问题在于其任务范围：日本是否会进一步重新解释或修订宪法第九条的实际含义以扩大作战自由度，还是会收紧限制并强调其在防御和国内支援方面的狭义作用？"
 JAP.Monarchist: "£JAP_Monarchist (RNW) - 维新政党·新风"
 JAP.Monarchist_icon: "£JAP_Monarchist"
 JAP.Monarchist_desc: "（帝国复辟主义） - 维新政党·新风\n\n维新政党·新风基于一个君主主义运动，其目标是将日本天皇提升至最高政治权力地位，使皇位凌驾于内阁、国会和现有宪法约束之上。该党的核心目标是进行根本性的宪法改革，重新确立天皇作为国家权力和合法性的最高象征。\n\n除了复辟帝国之外，该党仅维持着一个最低限度的执政纲领，并主要以单一议题为导向。它暗示，一旦其宪法目标达成，它便没有继续作为传统政党执政的长期野心，而是将自身定位为政权转型的催化剂。"
 ENG.conservatism: "£eng_western_conservative (CON) - 保守党"
 ENG.conservatism_icon: "£eng_western_conservative"
 ENG.conservatism_desc: "(保守自由主义) - 保守党\n\n保守党是英国政坛主要的中右翼力量，其政治纲领根植于维护联合王国、保障制度稳定和推行市场导向型治理。该党通常优先考虑财政紧缩、维护法律秩序和强大的国防力量，同时倡导私营企业作为经济增长的引擎。\n\n在执政过程中，该党力求在务实主义与内部各种思潮之间取得平衡，这些思潮涵盖了从一国家长式作风到更具对抗性、以主权为中心的保守主义等多种类型。其持久的力量在于，它能够在适应新压力的同时，始终坚守其作为天然治国之党的核心主张。"
 ENG.liberalism: "£eng_western_liberal (LD) - 自由民主党"
 ENG.liberalism_icon: "£eng_western_liberal"
 ENG.liberalism_desc: "(社会自由主义) - 自由民主党\n\n自由民主党标榜自己是改革派政党，支持公民自由，优先考虑问责制政府、宪政改革和权力下放的英国。他们通常主张加强议会监督、进行选举改革，并通过有针对性的公共投资和社会保障来减少不平等现象。\n\n在国际上，该党总体上支持与欧洲伙伴密切合作以及基于规则的多边主义，同时在国内强调个人权利和社区赋权。他们的政治影响力通常来自于组建联盟和有条不紊的地方竞选活动。"
 ENG.socialism: "£eng_western_social_democrat (LAB) - 工党"
 ENG.socialism_icon: "£eng_western_social_democrat"
 ENG.socialism_desc: "(社会民主主义) - 工党\n\n工党是英国主要的中间偏左力量，以劳工运动为根基，致力于通过民主政府实现社会正义。工党通常优先考虑加强公共服务、保障工人权益以及让国家在经济管理中发挥更积极的作用，旨在减少不平等并提高人民生活水平。\n\n工党内部传统多元，从务实的社会民主主义到更具变革性的经济改革，但其核心始终是强调公平、集体供给和政治问责。工党执政时，力求使国家战略与普惠繁荣而非狭隘特权相契合。"
 ENG.anarchist_communism: "£eng_emerging_left_wing_radical (SPGB) - 大不列颠社会党"
 ENG.anarchist_communism_icon: "£eng_emerging_left_wing_radical"
 ENG.anarchist_communism_desc: "(自由意志社会主义) - 大不列颠社会党\n\n大不列颠社会党是一个教条主义的社会主义组织，它拒绝渐进式的改革，主张以民主的、无货币的共同体彻底取代资本主义。该党强调教育、宣传和有原则的政治行动，拒绝任何会削弱其核心纲领的联盟。\n\n与更为务实的左翼政党不同，大不列颠社会党将议会视为实现明确社会主义授权的工具，而非妥协治理的手段。其力量不在于民众的选举权力，而在于意识形态的一致性和长期的斗争。"
 ENG.Caliphate: "£generic_Caliphate_small (I4UK) - 伊斯兰为英国"
 ENG.Caliphate_icon: "£generic_Caliphate_small"
 ENG.Caliphate_desc: "(伊斯兰极端主义) - 伊斯兰为英国\n\n伊斯兰为英国是一个与“迁徙者”网络及其面向公众的活动有关联的极端主义煽动组织，主张以强硬的伊斯兰教法解释取代英国法律，并追求以哈里发为导向的政治秩序。该组织通过挑衅性的示威活动和对抗性言论而臭名昭著，这些言论将英国政府及其机构描绘成不合法的。\n\n在现代英国，该组织被视为被禁恐怖网络的一部分，并受到反恐立法的打击，导致其四分五裂、受到严密监视，且在政治上备受争议。即便如此，其理念仍可通过非正式渠道和品牌重塑重新出现，尤其是在社会紧张和两极分化时期。"
 ENG.Neutral_conservatism: "£eng_non_aligned_conservative (CPA) - 基督教人民联盟"
 ENG.Neutral_conservatism_icon: "£eng_non_aligned_conservative"
 ENG.Neutral_conservatism_desc: "(基督教民主主义) - 基督教人民联盟\n\n基督教人民联盟是一个规模较小的基督教民主党派，主张英国的公共生活应以明确的基督教社会教义和道德保守主义为指导。该党强调社会正义和社区责任，并在家庭政策和文化问题上持有坚定立场，自诩为主要政党之外的另一种选择，而非其内部的一个派系。\n\n在政治上，基督教人民联盟通过地方竞选和议题驱动型行动来寻求影响力，旨在塑造有关法律、教育和国家权力界限的辩论。它的影响力很少来自选举优势，而是来自动员忠实支持者并迫使敏感问题公开讨论的能力。"
 ENG.neutral_Social: "£eng_non_aligned_social_democrat (SDP) - 社会民主党"
 ENG.neutral_Social_icon: "£eng_non_aligned_social_democrat"
 ENG.neutral_Social_desc: "(社会民主主义) - 社会民主党\n\n社会民主党是一个规模较小的社群主义社会民主党，该党认为英国需要更强的共同责任感、家庭稳定和社会凝聚力，同时政府也应积极参与经济活动。该党支持公共投资和国家复兴，同时反对其所称的忽视普通民众的精英共识政治。\n\n在政治上，社会民主党定位为经济左倾、文化传统，旨在吸引那些感觉被主流右翼和主流左翼都抛弃的选民。该党在议会的影响力有限，但它力图通过地方竞选和在国家动荡时期施加政治压力来发挥超出自身规模的作用。"
 ENG.Neutral_Libertarian: "£eng_non_aligned_libertarian (LPUK) - 自由意志党"
 ENG.Neutral_Libertarian_icon: "£eng_non_aligned_libertarian"
 ENG.Neutral_Libertarian_desc: "(古典自由主义) - 自由意志党\n\n英国自由意志党是一个规模较小的右翼自由主义政党，主张个人自由应优先于国家权力，政府职能应精简至维护安全和司法公正的最低限度。该党倡导自由市场、低税收、放松管制，并主张制定一部限制国家权力的成文宪法，同时奉行不干涉主义的外交政策。\n\n从选举角度来看，该党规模仍然很小，但它旨在通过推行明确的反国家主义纲领，并向大党施压，促使其走向公民自由和缩小政府权力范围，从而影响舆论。"
 ENG.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (EA) - 英国专制派"
 ENG.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 ENG.Neutral_Autocracy_desc: "(威权保守主义) - 英国专制派\n\n英国专制派是一个由强硬派法庭和安全部门主导的统治集团，它将议会政治视为软弱而非合法性的来源。它认为，国家需要纪律严明、等级分明，并在中央行政机构的领导下迅速做出决策，反对派则通过法律、庇护和受控机构来控制。\n\n在实践中，它倾向于扩大国家权力、加强公共秩序控制，以及建立以增强国家韧性和重新武装为导向的战略性国家经济。它的承诺是稳定和国家方向，代价是政治多元化。"
 ENG.Neutral_Communism: "£eng_non_aligned_communism (WRP) - 工人革命党"
 ENG.Neutral_Communism_icon: "£eng_non_aligned_communism"
 ENG.Neutral_Communism_desc: "(托洛茨基主义) - 工人革命党\n\n工人革命党是一个极左的托洛茨基主义组织，它将英国政治视为资本主义的一场可控危机，并主张以革命性的替代而非改革来取代现有体制。该党源于战后托洛茨基主义思潮，并在20世纪70年代发展成为一个独立的政党，其政治认同围绕着干部纪律、严格的意识形态训练以及与劳工斗争紧密相连的鼓动活动而构建。\n\n20世纪80年代中期，托洛茨基主义运动内部发生重大分裂，其公众影响力急剧下降，留下了一个虽小但坚持不懈的核心群体，继续声称自己是正统托洛茨基主义的捍卫者。"
 ENG.Neutral_Communism_2017: "£eng_non_aligned_communism_2017 (PBP) - 人民先于利润"
 ENG.Neutral_Communism_2017_icon: "£eng_non_aligned_communism_2017"
 ENG.Neutral_Communism_2017_desc: "(托洛茨基主义) - 人民先于利润\n\n“人民先于利润”是一个激进的左翼反资本主义运动政党，其根基在于反紧缩行动主义和工作场所组织。该党自诩为生态社会主义政党，倡导公有制和扩大社会福利，并将不平等和住房问题视为系统性失败而非政策失误。\n\n在外交政策上，该党对北约持敌对态度，奉行中立，并将西方安全机构视为局势升级的驱动因素。该党还明确支持统一，主张建立一个全爱尔兰社会主义解决方案，以此作为宪政政治的最终目标。"
 ENG.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small (MAB) - 不列颠穆斯林协会"
 ENG.Neutral_Muslim_Brotherhood_icon: "£muslim_brotherhood_small"
 ENG.Neutral_Muslim_Brotherhood_desc: "(I伊斯兰主义) - 不列颠穆斯林协会\n\n英国穆斯林协会是一个英国逊尼派穆斯林组织，致力于开展以信仰为基础的社区活动、政治参与以及就国内外政策问题进行公共宣传。该协会通过联盟合作和基层组织工作提升了知名度，把自己塑造成英国穆斯林公民参与的代言人。\n\n批评者认为该组织借鉴了穆斯林兄弟会的政治伊斯兰思想，而该组织则标榜自己是一个独立的英国机构。实际上，它游走于主流倡导和意识形态运动政治的争议地带，其影响力既取决于公众的监督，也取决于正式的选举权力。"
 ENG.Neutral_green: "£eng_non_aligned_greens (GPEW) - 绿党"
 ENG.Neutral_green_icon: "£eng_non_aligned_greens"
 ENG.Neutral_green_desc: "(环保主义) - 绿党\n\n英格兰和威尔士绿党是一个环保主义进步政党，将气候政策视为整个国家的组织原则。该党优先考虑快速脱碳、扩大可再生能源规模以及加强对污染和生物多样性丧失的监管，并将这些议程与社会正义和社区赋权相结合。\n\n该党致力于推动政治改革、保障公民自由并加大对公共服务的投入，认为生态可持续性和经济韧性密不可分。其优势在于地方政府的稳固地位和以议题为导向的竞选活动，即便议会席位有限，也能有效影响国家议程。"
 ENG.Nat_Autocracy: "£eng_nationalist_military_junta (BAF) - 英国武装力量"
 ENG.Nat_Autocracy_icon: "£eng_nationalist_military_junta"
 ENG.Nat_Autocracy_desc: "(军政府) - 英国武装力量\n\n英国武装力量作为一个政治统治集团，代表着身着制服的紧急政府，其存在的理由是国家危机和文官领导的失职。其信条将安全、指挥的连续性和国家维护置于党派之争之上，各部委置于军事监督之下，政策由作战需要驱动。\n\n实际上，这意味着加速重整军备、扩大内部安全权力，以及建立以韧性和动员为导向的战略经济。其前景是秩序和威慑，风险则是英国的民意被命令所取代。"
 ENG.Nat_Fascism: "£eng_nationalist_fascism (BNP) - 英国国家党"
 ENG.Nat_Fascism_icon: "£eng_nationalist_fascism"
 ENG.Nat_Fascism_desc: "(极端民族主义) - 英国国家党\n\n英国国家党是一个极右翼民族主义政党，它以种族和文化视角解读英国的问题，并在移民、身份认同和社会秩序等问题上推行强硬立场。该党试图将政治极化为围绕归属感和排斥感的争论，把自己塑造成狭义民族共同体的捍卫者，对抗其所谓的精英背叛。\n\n尽管在地方层面取得了一些零星的突破，但英国国家党一直受到内部派系斗争、公众污名化和持续反对的严重制约，使其在大多数国家层面都处于政治边缘地位。其影响力与其说是通过执政，不如说是通过煽动和将辩论引向极端。"
 ENG.Nat_Populism: "£eng_nationalist_right_wing_populist (UKIP) - 英国独立党"
 ENG.Nat_Populism_icon: "£eng_nationalist_right_wing_populist"
 ENG.Nat_Populism_desc: "(右翼民粹主义) - 英国独立党\n\n英国独立党是一个民族主义、右翼民粹主义政党，其政治核心是主权政治，反对超国家治理，并承诺加强边境管控。该党通过将欧洲问题推至英国政治的中心，并利用激进的宣传和施压运动迅速崛起，令其他主要政党难以忽视。\n\n即使英国独立党在议会中的席位有限，其优势依然在于议程设置：它可以分裂右翼，重塑保守派纲领，并将文化和身份认同问题转化为全国性的冲突焦点。其政治理念以对抗、公投逻辑和对英国自治毫不妥协的立场为驱动。"
 ENG.Monarchist: "£eng_nationalist_monarchist (HOW) - 温莎王室"
 ENG.Monarchist_icon: "£eng_nationalist_monarchist"
 ENG.Monarchist_desc: "(君主专制) - 温莎王室\n\n温莎王室作为执政派别，代表着一种不再满足于礼仪性影响力的君主制。它声称王室是国家统一的最终基石，因此必须对大臣、安全政策和国家走向拥有决定性的权力。在这种格局下，合法性源于王朝传承和延续，而非党派竞争。\n\n其理论主张中央集权的治国方略、严明的公共秩序以及对王室机构的战略性运用，以引导经济和社会发展。支持者称之为稳定和国家目标，反对者则称之为复辟的独裁统治。"
 USA.conservatism: "£USA_conservatism_small 共和党"
 USA.conservatism_icon: "£USA_conservatism_small"
 USA.conservatism_desc: "保守党 - 共和党是美国保守主义的‘老大党’。作为一个反奴隶制政党成立于1854年，其现代化身主要是由于罗纳德·里根的保守主义对更自由主义价值观的胜利而形成的。近年来，随着该党日益成为社会保守主义之一，福音派基督徒大量涌入。作为一个‘大帐篷’政党，主要的温和建制派与各种保守的草根运动之间存在广泛的意见分歧。"
 USA.liberalism: "£USA_liberalism_small 民主党"
 USA.liberalism_icon: "£USA_liberalism_small"
 USA.liberalism_desc: "自由主义 - 民主党曾经是经济自由主义，民粹主义和社会保守主义的政党，自此转变为以社会正义，平等和社会自由主义为核心价值观的政党。作为广泛的中间派联盟的一部分，它是自由主义派的主要倡导者，主张自由贸易和有利于商业的政策，但它也拥有进步派和社会主义者的庞大派系，他们赞成更多左派的解决方案。"
 USA.socialism: "£USA_socialism_small 进步主义派"
 USA.socialism_icon: "£USA_socialism_small"
 USA.socialism_desc: "社会民主主义 - £USA_socialism_small 民主党进步派的主要目标是解决美国日益扩大的收入不平等和日益增加的贫困问题。他们将重商的民主党建制派的经济政策视为‘新自由主义’，主张通过结构性监管改革、增加福利支出以及对富人增税来遏制这种经济政策。他们热情地促进少数民族权利，倡导社会正义。"
 USA.progressives: "£USA_progressive_party 进步党"
 USA.progressives_icon: "£USA_progressive_party"
 USA.progressives_desc: "进步党 - 进步党的主要根源可以追溯到泰迪·罗斯福的政府。 监管、环境保护和关注区域防御而非国际的强大组合意味着进步党是一个全面的国内政党。尽管它的现代对手有更激进的翅膀，但该党在经济监管方面有许多平等的核心价值观和罗宾汉般的心态。"
 USA.anarchist_communism: "£USA_anarchist_communism_small 争取社会主义和解放党"
 USA.anarchist_communism_icon: "£USA_anarchist_communism_small"
 USA.anarchist_communism_desc: "左翼激进主义 - 社会主义解放党是从工人世界党分裂出来的革命社会党。该党主要致力于支持全球社会主义和共产主义运动，并在美国根除资本主义。"
 USA.shepards_party: "£USA_shepeard_party 争取社会主义和解放党"
 USA.shepards_party_icon: "£USA_shepeard_party"
 USA.shepards_party_desc: "争取社会主义和解放党 - 该党是一个从美国主要左翼运动联盟中改革而来的政党。被视为反对右翼国家民主党崛起的谢帕德党希望获得欧洲和美国民主社会主义者想要的东西，但以更清晰、更少玫瑰色的光芒将其出售给美国人民。主要推动力是将经济改革为市场社会主义环境，为人民提供他们应得的真正标准。尽管外交政策更多地关注国内半球霸权，但未来可能会改变党领导本身的愿望。"
 USA.Conservative: "£USA_Conservative_small 美国优先党"
 USA.Conservative_icon: "£USA_Conservative_small"
 USA.Conservative_desc: "反动主义 - 美国优先党是主要致力于外交政策的政党，其目标是让美国退出联合国并解散北约。 此外，该党希望加强持枪权，驱逐所有非法移民，并通过高额关税和取消环境法规来促进经济独立。"
 USA.Autocracy: "£USA_Autocracy_small 社会主义工人党"
 USA.Autocracy_icon: "£USA_Autocracy_small"
 USA.Autocracy_desc: "专制 - 社会主义工人党最初是一个托洛茨基主义共产党，在冷战期间逐渐受到菲德尔·卡斯特罗的影响。今天，它主要致力于促进‘与古巴的团结’。"
 USA.Neutral_Muslim_Brotherhood: "£USA_Neutral_Muslim_Brotherhood_small 伊斯兰民族"
 USA.Neutral_Muslim_Brotherhood_icon: "£USA_Neutral_Muslim_Brotherhood_small"
 USA.Neutral_Muslim_Brotherhood_desc: "温和伊斯兰主义 - 伊斯兰国家是非裔美国人的政治和宗教运动。 在以利亚·穆罕默德（Elijah Muhammad）和马尔科姆·X（Malcolm X）以前的超凡魅力领导下声名显赫，它正在争取非洲裔美国人的社会正义，并动员数百万人参加华盛顿特区的游行。 许多人将其视为黑人至上主义仇恨组织，并被许多外国逊尼派学者视为伊斯兰教中的异教徒，但它仍然拥有强大的核心成员，并已成为中东和北非的重要盟友。"
 USA.Neutral_conservatism: "£USA_Neutral_conservatism_small 宪政主义"
 USA.Neutral_conservatism_icon: "£USA_Neutral_conservatism_small"
 USA.Neutral_conservatism_desc: "保守派 - £USA_Neutral_conservatism_small 共和党的宪政主义者和自由意志主义倾向的派别相信他们自己是戈德华特和里根理念中的‘真正的保守派’。他们宣称美国已经偏离其建国价值观太远，主张限制联邦对各州的权力，提倡财政保守主义、降低税收和退出外国国家建设。"
 USA.constitutionalist: "£USA_constitutionalist 宪法党"
 USA.constitutionalist_icon: "£USA_constitutionalist"
 USA.constitutionalist_desc: "宪法党 - 许多人认为这是通往极右翼运动的垫脚石，该党多数政策可归结为严格遵守美国宪法，并深受美国社会福音派势力的巨大影响。虽然不算极右翼，但它无疑是一块垫脚石，且本质上坚定奉行传统主义，以致多数人认为他们短期内难以问鼎总统之位。"
 USA.neutral_Social: "£USA_neutral_Social_small 美国民主社会主义者"
 USA.neutral_Social_icon: "£USA_neutral_Social_small"
 USA.neutral_Social_desc: "民主社会主义 - £USA_neutral_Social_small 民主党的社会主义派拒绝主要机构的自由主义和进步派的渐进主义，支持更激进的解决方案，以建立一个强大的福利国家，加强对所有重要经济部门的民主控制。他们在国外拒绝美国军国主义，认为为了‘保护自由和民主’而进行的战争只会有利于企业精英的狭隘利益目标。"
 USA.democratic_socialist: "£USA_democratic_socialist 红色民主党"
 USA.democratic_socialist_icon: "£USA_democratic_socialist"
 USA.democratic_socialist_desc: "红色民主党 - 美国的民主社会主义运动催生了罗宾党，更广为人知的是红色民主党。该党深受欧洲同僚影响。伯尼·桑德斯等政党领袖大力宣扬其政策主张，核心在于利用现有体制推动国家改革，通过政府机构将资本主义经济体系渐进转变为社会主义经济体系，从而实现社会与经济层面的平等目标。"
 USA.Neutral_Libertarian: "£USA_Neutral_Libertarian_small 自由意志党"
 USA.Neutral_Libertarian_icon: "£USA_Neutral_Libertarian_small"
 USA.Neutral_Libertarian_desc: "自由主义者 - 以美国的标准来看，自由意志党是一个成功的“第三政党”，定期参与所有选票的竞争。他们倡导社会自由主义和经济保守主义，并视为“美国个人主义精神的化身”，力求在各个方面彻底实现社会自由化，并精简联邦政府，将权力还给各州和人民。他们既反对军国主义，也反对国际主义，倾向于采取不干涉的外交政策。"
 USA.Neutral_Autocracy: "£USA_Neutral_Autocracy_small 美国改革党"
 USA.Neutral_Autocracy_icon: "£USA_Neutral_Autocracy_small"
 USA.Neutral_Autocracy_desc: "旧保守主义 - 美国改革党由亿万富翁罗斯·佩罗创立，源于对£USA_conservatism_small 共和党“新帝国主义”外交政策的强烈不满，旨在推动冷战胜利后的美国回归不干涉主义外交路线。该党反对《北美自由贸易协定》，并试图通过任期限制和选举制度改革重塑美国政治格局。凭借1992年大选创纪录地斩获18.9%选票，以及1998年成功推举杰西·文图拉当选明尼苏达州州长的战绩，该党正致力于重现辉煌，为美国政坛提供超越民主党与共和党的可行替代方案。"
 USA.Neutral_green: "£USA_Neutral_green_small 美国绿党"
 USA.Neutral_green_icon: "£USA_Neutral_green_small"
 USA.Neutral_green_desc: "环保主义 - 绿党是提倡环保主义和女权主义的生态社会主义和反资本主义政党。它希望以合作社和当地社区为基础改革经济。"
 USA.green_party: "£USA_green_party 绿党"
 USA.green_party_icon: "£USA_green_party"
 USA.green_party_desc: "绿党 - 美国绿党是一个混合了进步理想、极端环保主义和全球主义观点的政党，关于如何解决他们政党关注的主要问题。该党可以被视为一个和平主义和平衡的内外政策政党。"
 USA.Neutral_Communism: "£USA_Neutral_Communism_small 工人世界党"
 USA.Neutral_Communism_icon: "£USA_Neutral_Communism_small"
 USA.Neutral_Communism_desc: "共产主义 - 工人世界党成立于1959年，是托洛茨基社会主义工人党的一个分裂团体，因为他们没有足够的托洛茨基主义者，尽管几年后他们自己放弃了托洛茨基主义。他们主要集中在街头行动主义上。"
 USA.Nat_Populism: "£USA_Nat_Populism_small 右翼民粹主义者"
 USA.Nat_Populism_icon: "£USA_Nat_Populism_small"
 USA.Nat_Populism_desc: "右翼民粹主义者 - £USA_Nat_Populism_small 共和党的民粹主义和民族主义翼传统上在1960年代民主党的种族隔离主义者大规模外流后扎根于南方腹地。他们认为自己正受到自由文化战争和高移民率的围困，他们寻求扭转对其文化和价值观的侵蚀。随着外包导致许多工业中心衰落，他们关于‘被从墨西哥引进选民的全球主义政客出卖’的反驳现在在美国引起了更广泛的共鸣。"
 USA.nationalist_front: "£USA_nationalist_front 民族阵线党"
 USA.nationalist_front_icon: "£USA_nationalist_front"
 USA.nationalist_front_desc: "民族阵线党是美国右翼思想家的联盟党，从传统主义者到另类右翼，它在真正的政策概念上来回混淆，但大多数人似乎同意更严格的移民改革，更多地关注国内政策以重新点燃传统的家庭和在学校等公共机构中回归更传统的价值观，宣誓效忠并符合更多的基督教价值观。"
 USA.Nat_Fascism: "£USA_nazi_party 美国纳粹党"
 USA.Nat_Fascism_icon: "£USA_nazi_party"
 USA.Nat_Fascism_desc: "法西斯主义 - 美国纳粹党是白人至上主义者的新纳粹政党。尽管其历史久远，但始终未能获得广泛民众支持，在多次内斗中因成员分裂而屡遭解散与重组。"
 USA.Nat_Autocracy: "£USA_Nat_Autocracy_small 美国军队"
 USA.Nat_Autocracy_icon: "£USA_Nat_Autocracy_small"
 USA.Nat_Autocracy_desc: "美国军队是军事工业综合体中规模最大、最具影响力的分支之一。凭借职业将领和实力雄厚的国防部支持，倘若这片土地遭遇最坏情况，美国军队最有可能确保新政府的建立。"
 USA.Monarchist: "£USA_nationalist_monarchist 美国君主主义运动"
 USA.Monarchist_icon: "£USA_nationalist_monarchist"
 USA.Monarchist_desc: "美国君主主义运动是那些怀念几个世纪前政体的人的边缘运动。当然，除了他们自己的成员之外，没人会认真对待这个运动，但现实是，政府组织本质上并没有太大区别。只需更改几个官职名称，一个君主立宪制国家就出现了。但就目前而言，该运动试图通过草根运动发展壮大，这些草根运动很容易联合起来，组成更大的运动，从而以被动的方式传播他们的理念和理想。"
 ARG.conservatism: "£ARG_conservatism (AR) - 共和国行动党"
 ARG.conservatism_icon: "£ARG_conservatism"
 ARG.conservatism_desc: "（自由保守主义） - 共和国行动党\n\n共和国行动党由多明戈·卡瓦洛于1997年4月24日创立。卡瓦洛曾任卡洛斯·梅内姆政府的经济部长，负责将比索与美元挂钩。该党是一个奉行财政正统、私有化、开放市场并反对梅内姆政府腐败的自由保守主义政党。它吸引了那些希望维持货币兑换模式但又不想被庇隆主义机器掌控的技术官僚和商界人士。\n\n卡瓦略在1999年10月24日的总统选举中获得10.22%的选票，位列第三。该党在1997年和1999年赢得了一部分议席，但2001年他在费尔南多·德拉鲁阿领导下重返经济部，使该党与“小联盟”以及2001年12月的崩溃紧密相连。在随后的选举中，该党彻底覆灭，如今仅在科连特斯省作为一个省级政党苟延残喘。"
 ARG.liberalism: "£ARG_liberalism (FREPASO) - 国家团结阵线"
 ARG.liberalism_icon: "£ARG_liberalism"
 ARG.liberalism_desc: "（进步主义） - 国家团结阵线\n\n国家团结阵线于1994年由卡洛斯·查乔·阿尔瓦雷斯的广泛阵线、社会党、基督教民主党和其他中左翼团体组成，作为梅内姆政府的进步反腐败替代方案。1997年，它加入了激进公民联盟，组成了争取工作、正义和教育的联盟。该联盟在1999年的总统选举中获胜，费尔南多·德拉鲁阿当选总统，阿尔瓦雷斯担任副总统。\n\n2000年初，该党是执政联盟中的小党，也是众议院的第二大党。2000年10月，阿尔瓦雷斯因参议院贿赂丑闻辞去副总统职务，该党未能与德拉鲁阿的紧缩政策决裂，以及2001年12月的崩溃，彻底摧毁了该党，其大部分干部转投埃莉萨·卡里奥的“民主共和联盟”或内斯托尔·基什内尔的庇隆主义阵营。"
 ARG.socialism: "£ARG_socialism (UCR) - 激进公民联盟"
 ARG.socialism_icon: "£ARG_socialism"
 ARG.socialism_desc: "（社会自由主义） - 激进公民联盟\n\n激进公民联盟是阿根廷历史最悠久的政党，由莱安德罗·阿莱姆于1891年6月26日创立，旨在争取自由选举权，反对保守寡头政治。该党曾产生过伊里戈延、阿尔维亚尔、伊利亚、阿方辛和德拉鲁阿等总统。激进公民联盟的意识形态较为多元化，涵盖社会自由主义和社会民主主义，自1996年以来一直是社会党国际的成员，主张共和制度、世俗教育、公民自由和混合经济。\n\n费尔南多·德拉鲁阿于1999年10月24日以48.37%的得票率赢得总统大选，他领导的联盟与国家团结阵线联盟也参与其中。然而，他在2001年12月的下台使该党损失了一代人的时间：里卡多·阿方辛在2011年仅获得11.14%的选票。该党在2015年重新崛起，成为“变革运动”的全国骨干力量，并在之后的“携手变革”中再次崛起。该党的优势在于其在门多萨省、胡胡伊省、科连特斯省和查科省的省级机构，以及遍布全国各城镇的委员会。"
 ARG.Autocracy: "£ARG_Autocracy (FG) - 广泛阵线"
 ARG.Autocracy_icon: "£ARG_Autocracy"
 ARG.Autocracy_desc: "（进步庇隆主义） - 广泛阵线\n\n广泛阵线由卡洛斯·“查乔”·阿尔瓦雷斯和八人小组于1993年4月27日创立。八人小组由庇隆主义议员组成，他们于1990年因抗议卡洛斯·梅内姆的新自由主义转向及其对军政府的赦免而退出联盟，其他成员包括共产党人、基督教民主党人和独立人士。广泛阵线主张进步的、反腐败的庇隆主义，强调社会正义、制度改革和人权，并以此为核心，于1994年成立了FREPASO（波多黎各解放阵线）。\n\n阿尔瓦雷斯在1999年的联盟政府中担任副总统，并于2000年10月因参议院贿赂丑闻辞职，该丑闻导致联盟及其所属的广泛阵线分裂。自2003年以来，该党一直是基什内尔主义的次要盟友，其成员包括爱德华多·西加尔和阿德里亚娜·普伊格罗斯，如今该党隶属于祖国联盟。该党的优势在于其在首都布宜诺斯艾利斯和布宜诺斯艾利斯省的进步庇隆主义传统，其影响力则在于它赋予该运动左翼的合法性。"
 ARG.anarchist_communism: "£ARG_left_wing_radical (PI) - 不妥协党"
 ARG.anarchist_communism_icon: "£ARG_left_wing_radical"
 ARG.anarchist_communism_desc: "（左翼民族主义） - 不妥协党\n\n不妥协党由奥斯卡·阿连德于1972年5月22日创立，他出身于不妥协激进公民联盟，该联盟是激进主义的一个分支，于1956年在阿图罗·弗朗迪齐的领导下分裂出来。不妥协党主张民主社会主义、国家资源控制、不结盟以及工人阶级和中产阶级联合起来反对寡头政治和外国资本。它是激进主义传统的左翼，而非马克思主义传统左翼。\n\n阿连德党的崛起契机出现在西班牙回归民主时期。1983年，该党获得2.33%的选票；1985年，阿连德党以6.07%的得票率和五个议席成为西班牙第三大政党。然而，随着庇隆主义复兴运动和广泛阵线的崛起，阿连德党逐渐衰落。自2007年以来，阿连德党一直是基什内尔主义在胜利阵线、全民阵线和祖国联盟等政党中的小盟友，其影响力主要体现在向庇隆主义联盟提供其选票标识和党名。"
 ARG.Neutral_conservatism: "£ARG_Neutral_conservatism (PDC) - 基督教民主党"
 ARG.Neutral_conservatism_icon: "£ARG_Neutral_conservatism"
 ARG.Neutral_conservatism_desc: "（基督教民主主义） - 基督教民主党\n\n基督教民主党由曼努埃尔·奥多涅斯、奥拉西奥·苏埃尔多和其他天主教平信徒于1954年7月9日创立，是一个奉行基督教社会训导的非宗教政党，主张社会市场经济、家庭、辅助性原则和人权。该党在1963年的总统选举中取得了4.48%的得票率，是其历史上最好的成绩。虽然它从未成为一个主流政党，但其干部的影响力远远超出了其选票范围。\n\n2000年代，该组织曾与基什内尔主义结盟，但在2010年左右与基什内尔家族决裂。此后，在胡安·费尔南多·布吕格和南希·阿尔贝里奥内的领导下，该组织逐渐倾向于胡安·斯基亚雷蒂的科尔多瓦庇隆主义，并在2023年加入了“我们为祖国而战”运动。该组织的优势在于其在天主教社会组织和内陆省份的广泛人脉，以及其名称所带来的影响力，无论加入哪个联盟，都能为其赢得尊重。"
 ARG.neutral_Social: "£ARG_neutral_Social (PS) - 社会主义党"
 ARG.neutral_Social_icon: "£ARG_neutral_Social"
 ARG.neutral_Social_desc: "（社会民主主义） - 社会主义党\n\n社会党主义起源于胡安·B·胡斯托于1896年6月28日创立的政党，是拉丁美洲历史最悠久的社会党。该党于1958年分裂为民主社会党和人民社会党，并于2002年在人权活动家阿尔弗雷多·布拉沃的领导下重新合并。社会主义党主张建立以公共服务、透明政府、世俗主义和公民权利为基础的欧洲社会民主主义，是进步联盟的成员，并始终与庇隆主义保持距离。\n\n该党的大本营是圣菲省，埃尔梅斯·宾纳于2007年成为该国历史上首位社会主义省长，安东尼奥·邦法蒂于2011年至2015年接任。罗萨里奥市也曾由社会主义市长执政长达三十年。宾纳领导的广泛进步阵线在2011年总统选举中获得16.81%的选票，位列第二，这是该党取得的最佳成绩。2023年，该党以“我们为祖国而战”的名义参选。该党的优势在于其在省和市两级的政绩；其劣势在于其影响力从未超越省和市两级。"
 ARG.Neutral_Autocracy: "£ARG_Neutral_Autocracy (PJ) - 正义党"
 ARG.Neutral_Autocracy_icon: "£ARG_Neutral_Autocracy"
 ARG.Neutral_Autocracy_desc: "（庇隆主义） - 正义党\n\n正义党是胡安·多明戈·庇隆的政党，成立于1946年11月21日，最初名为革命单一党，1947年更名为庇隆主义党，1971年定名为现名。与其说它是一个政党，不如说它是庇隆主义运动的政治体现：工会、省长和布宜诺斯艾利斯郊区民众，在社会正义、经济独立和政治主权这三大旗帜的鼓舞下团结在一起。其意识形态经历了从梅内姆的私有化到基什内尔的国家主义的转变，但始终没有改变其庇隆主义的本质。\n\n自1989年以来，该党在大部分时间里都执掌总统职位：卡洛斯·梅内姆执政至1999年，阿道夫·罗德里格斯·萨阿和爱德华多·杜阿尔德 执政至2001年和2002年的崩溃时期，内斯托尔·基什内尔执政至2003年，克里斯蒂娜·费尔南德斯·德·基什内尔执政至2007年至2015年，阿尔贝托·费尔南德斯执政至2019年至2023年，他们先后代表胜利阵线、全民阵线和祖国联盟执政。塞尔吉奥·马萨在2023年第一轮投票中获得36.78%的选票，但在第二轮投票中以44.35%的得票率落败。自2024年12月11日起，费尔南德斯·德·基什内尔担任该党主席。该党的优势在于其在都市区和各州州长中的影响力，其劣势在于基什内尔派系与各州州长之间在失去政权时发生的派系斗争。"
 ARG.Neutral_Communism: "£ARG_Neutral_Communism (PTS) - 社会主义工人党"
 ARG.Neutral_Communism_icon: "£ARG_Neutral_Communism"
 ARG.Neutral_Communism_desc: "（托洛茨基主义） - 社会主义工人党\n\n社会主义工人党成立于1988年3月21日，由被纳韦尔·莫雷诺领导的“走向社会主义运动”开除的一个派系创立。它是阿根廷托洛茨基主义政党中最正统、组织最严密的政党，主张建立工人委员会，没收银行和大型工业企业，拒绝偿还外债，并争取工人阶级摆脱庇隆主义的控制。该党出版《左翼日报》，并通过工厂委员会、学生运动和收复的企业开展工作。\n\n2000年，它只是一个拥有数千名成员、没有代表的干部政党，因其在扎农陶瓷厂占领事件和罢工期间的“皮克特罗”运动中的作用而闻名。后来，何塞·蒙特斯、克里斯蒂安·卡斯蒂略、尼古拉斯·德尔·卡尼奥和米里亚姆·布雷格曼等人物通过工人左翼阵线将其带入国会，但就其自身而言，其影响力主要体现在工作场所，而非选票上。"
 ARG.Neutral_green: "£ARG_Neutral_green (PSur) - 南方计划"
 ARG.Neutral_green_icon: "£ARG_Neutral_green"
 ARG.Neutral_green_desc: "（政治生态主义） - 南方计划\n\n南方计划由电影导演费尔南多·皮诺·索拉纳斯于2007年创立，是一个以保护自然资源为核心的民族左翼运动，其主张包括：石油、天然气和矿业的公有制；禁止露天采矿和出口大豆原矿；保护水资源和冰川；以及收回梅内姆时期私有化的铁路和国有企业。该运动将生态事业与庇隆主义左翼传统的反帝国主义民族主义相结合。\n\n索拉纳斯在2007年总统选举中获得1.58%的选票，随后在2009年6月的选举中，他在布宜诺斯艾利斯市以24.21%的得票率位居第二，成为全国知名人物，并有四名议员进入国会。他于2013年至2019年通过“广泛阵线”担任首都参议员，并于2019年加入“全民阵线”。2020年11月6日，他在巴黎去世，使该运动失去了核心人物。该运动的力量源于索拉纳斯的声望和安第斯山脉各省的采矿冲突；其影响力主要来自道德层面，而非议会层面。"
 ARG.Nat_Autocracy: "£ARG_Nat_Autocracy (FFAA) - 阿根廷武装部队"
 ARG.Nat_Autocracy_icon: "£ARG_Nat_Autocracy"
 ARG.Nat_Autocracy_desc: "（军政府） - 阿根廷武装部队\n\n阿根廷武装部队作为统治集团，代表着1930年至1976年间六次政变的传统，尤其是国家重组进程。维德拉、维奥拉、加尔铁里和比尼奥内领导的军政府从1976年3月24日至1983年12月10日执政，导致约三万人失踪，并在福克兰群岛战争中战败。其政治纲领是国家安全：军队是国家抵御颠覆、共产主义和政客腐败的卫士，经济则交由自由派技术官僚掌控，异议人士则由安全部门处理。\n\n这一传统在1985年的军政府审判、1987年至1990年的宪兵哗变以及2003年内斯托尔·基什内尔重启的人权诉讼中被打破。这些事件导致数百名军官入狱，军队经费不足，遭到清洗，并在政治上噤声。如果总参谋部重新掌权，就意味着重新武装、审判终止以及政党活动暂停，而且它将面对一个将独裁统治的记忆奉为民主建国神话的社会。"
 ARG.Nat_Fascism: "£ARG_Nat_Fascism (PNT) - 新凯旋党"
 ARG.Nat_Fascism_icon: "£ARG_Nat_Fascism"
 ARG.Nat_Fascism_desc: "（新纳粹主义） - 新凯旋党\n\n新凯旋党由亚历杭德罗·比昂迪尼于1990年3月14日创立。比昂迪尼曾是庇隆主义活动家，后转向新纳粹右翼。该党奉行国家社会主义、反犹主义、敌视移民，并主张在阿根廷建立符合第三帝国象征意义的社团国家。它自诩为民族主义和天主教政党，但法院一直将其认定为纳粹组织。\n\n该党申请合法地位近二十年，最终于2009年3月17日被最高法院驳回。最高法院裁定，建立在种族歧视基础上的政党不能被纳入选举制度。该党的优势在于布宜诺斯艾利斯郊区的几百名活跃分子以及早期互联网上的大量影响力；其影响力主要来自集会的挑衅性以及比昂迪尼坚持以新名称重建该党的努力。"
 ARG.Nat_Populism: "£ARG_Nat_Populism (PPR) - 人民重建党"
 ARG.Nat_Populism_icon: "£ARG_Nat_Populism"
 ARG.Nat_Populism_desc: "（天主教民族主义） - 人民重建党\n\n人民重建党由古斯塔沃·布雷德·奥贝德、弗朗西斯科·博什和恩里克·格拉西·苏西尼于1996年创立，他们都是1990年塞内尔丁起义中的前卡拉平塔达军官。该党是一个天主教民族主义政党，其口号是“上帝、祖国和家庭”。它主张实行社团主义和保护主义经济，拒绝偿还外债，重建军队，反对堕胎和国际机构的议程，并以民族主义视角解读阿根廷历史。\n\n布雷德·奥贝德党在2003年总统选举中获得0.22%的选票，在2007年获得0.24%的选票。该党于2011年加入爱德华多·杜阿尔德的人民阵线，之后在大多数省份失去了合法地位，并于2017年解散了其查科省支部。该党的意义不在于选举，而在于它是民族主义军官阶层和传统天主教右翼的政治家园，他们的思想比该党本身更长久地存在了。"
 ARG.oligarchism: "£generic_oligarchism_small (SRA) - 阿根廷农村协会"
 ARG.oligarchism_desc: "（农业精英） - 阿根廷农村协会\n\n阿根廷农村协会由爱德华多·奥利维拉和潘帕斯草原的大地主们于1866年7月10日创立。一个半世纪以来，它一直是拥有大豆、小麦和牛肉出口经济的牧场主们的集体代言人，而这些出口经济正是阿根廷外汇收入的来源。它并非一个政党，而是一股强大的力量：它主张降低出口税、保障财产安全、推动自由贸易，并维护农村地区的比索强势。每年在巴勒莫举行的协会大会是各国总统向农业界发表讲话的场合。\n\n在此期间，该组织最重要的介入是2008年围绕第125号决议的冲突。当时，它与联络委员会的其他三个农业机构一起，对克里斯蒂娜·费尔南德斯·德·基什内尔不断降低的出口税实施了长达129天的罢工，直到2008年7月17日参议院以36比36的票数通过该决议，副总统胡利奥·科沃斯最终投了反对票。在卢西亚诺·米根斯、乌戈·比奥拉卡蒂、路易斯·埃切韦赫雷、丹尼尔·佩莱格里纳和尼古拉斯·皮诺等总统的领导下，该组织一直是内陆地区最有影响力的游说团体，其影响力源于农作物带来的巨额收入。"
