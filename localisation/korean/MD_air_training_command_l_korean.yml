 MD_atc_cost_600_blocked: "£air_experience §R600§!"
 MD_atc_fully_upgraded: "업그레이드 완료"
 MD_atc_exercise_training: "항공 작전 전비 태세 훈련"
 MD_atc_exercise_training_desc: "출격 생성, 공수, 정찰 조율을 아우르는 항공단 전체의 전비 태세 주기입니다. 비행대들은 전진 비행장에서 작전을 지속하는 훈련을 합니다."
 MD_atc_ex_training_short: "90일간 훈련 및 작전 숙련도."
 MD_atc_exercise_design: "비행 시험 평가"
 MD_atc_exercise_design_desc: "시험 비행사와 기술자들이 신형 기체와 항전 장비로 평가 출격을 합니다. 그 결과는 설계 및 정비 관행에 곧바로 반영됩니다."
 MD_atc_ex_design_short: "90일간 항공기 설계 숙련도."
 MD_atc_exercise_heavy: "전략 공수 및 폭격기 훈련"
 MD_atc_exercise_heavy_desc: "중폭격기와 수송기를 위한 장거리 출격입니다. 승무원들은 공중 급유, 대규모 편대 비행, 종심 타격 항로 설정을 연습합니다."
 MD_atc_ex_heavy_short: "90일간 대형 항공기 숙련도."
 MD_atc_exercise_multirole: "다목적 전투기 타격 훈련"
 MD_atc_exercise_multirole_desc: "전투 비행단이 한 번의 출격 중에 공대공 임무와 공대지 임무를 오가며 수행하는 연습을 합니다. 혼성 편대는 표적 정보를 공유하고 호위하는 전술을 훈련합니다."
 MD_atc_ex_multirole_short: "90일간 다목적 항공기 숙련도."
 MD_atc_exercise_strike: "근접 항공 지원 훈련"
 MD_atc_exercise_strike_desc: "공격 비행대가 지상의 전방 항공 통제관과 함께 표적 표시, 저고도 공격 비행, 아군 오폭 방지를 훈련합니다."
 MD_atc_ex_strike_short: "90일간 공격기 숙련도."
 MD_atc_exercise_fighter: "공중전 훈련"
 MD_atc_exercise_fighter_desc: "대규모 공중전 훈련에서 전투기 및 요격기 비행대가 가상 적기 부대와 맞붙습니다. 조종사들은 시계 외 교전과 근접 공중전을 연습합니다."
 MD_atc_ex_fighter_short: "90일간 전투기 숙련도."
 MD_atc_exercise_drone: "무인 체계 훈련"
 MD_atc_exercise_drone_desc: "운용 요원들이 무인기의 발진, 통제, 회수를 훈련합니다. 군집 전술, 데이터링크 복원력, 전자전 공격 하에서의 운용도 다룹니다."
 MD_atc_ex_drone_short: "90일간 드론전 숙련도."
 MD_atc_staff_college_name: "공군 참모대학"
 MD_atc_staff_college_short: "공군 임무 경험치를 얻고 90일간 경험치 손실이 줄어듭니다."
 MD_atc_staff_college: "공군 참모대학 교육 진행 중"
 MD_atc_staff_college_desc: "고위 공군 장교들이 공군 참모대학에서 교육을 받고 있습니다. 최근 작전에서 얻은 교훈이 임무 계획 수립과 승무원 유지를 개선합니다."
 MD_atc_fighter_school_name: "전투기 무장 학교"
 MD_atc_fighter_school_short: "180일간 에이스 배출 개선."
 MD_atc_fighter_school: "전투기 무장 학교 교육 진행 중"
 MD_atc_fighter_school_desc: "선발된 전투기 조종사들이 첨단 무장 및 전술 과정을 이수하고 있습니다. 졸업생들은 교관이자 전술 지휘관으로서 비행대에 복귀합니다."
 MD_atc_rnd_liaison_name: "공군 연구개발 연락단"
 MD_atc_rnd_liaison_short: "공군 돌파 포인트를 얻습니다."
 MD_atc_rnd_liaison_cooldown: "공군 연구개발 연락단 활동 중"
 MD_atc_rnd_liaison_cooldown_desc: "공군 장교들이 항공우주 연구 기관에 파견되어 작전상의 교훈을 개발 요구 사항으로 전환하고 있습니다."
 MD_atc_academy_name: "비행 훈련 교과 과정"
 MD_atc_academy_short: "공군사관학교 국가 정신을 해금하고 훈련 효과를 강화합니다."
 MD_atc_academy_level_text: "레벨 [?ROOT.MD_atc_academy_level|0]/3"
 MD_atc_force_name: "공군 전비 태세 프로그램"
 MD_atc_force_short: "공군 국가 정신을 해금합니다."
 MD_atc_force_level_text: "레벨 [?ROOT.MD_atc_force_level|0]/3"
 MD_atc_command_name: "항공 작전 센터"
 MD_atc_command_short: "공군 지휘 국가 정신을 해금합니다."
 MD_atc_command_level_text: "레벨 [?ROOT.MD_atc_command_level|0]/3"
 MD_atc_academy_1: "항공전 학교 I"
 MD_atc_academy_1_desc: "공중전 전술, 출격 계획, 교관 조종사 기법에 관한 교육이 차세대 승무원을 양성합니다."
 MD_atc_academy_2: "항공전 학교 II"
 MD_atc_academy_2_desc: "$MD_atc_academy_1_desc$"
 MD_atc_academy_3: "항공전 학교 III"
 MD_atc_academy_3_desc: "$MD_atc_academy_1_desc$"
 MD_atc_force_1: "비행 안전 및 정비 프로그램 I"
 MD_atc_force_1_desc: "표준화된 정비 일정과 비행 안전 검토로 항공기를 가동 가능한 상태로 유지하고 전투 외 손실을 줄입니다."
 MD_atc_force_2: "비행 안전 및 정비 프로그램 II"
 MD_atc_force_2_desc: "$MD_atc_force_1_desc$"
 MD_atc_force_3: "비행 안전 및 정비 프로그램 III"
 MD_atc_force_3_desc: "$MD_atc_force_1_desc$"
 MD_atc_command_1: "연합 항공 작전 센터 I"
 MD_atc_command_1_desc: "중앙 작전 센터가 공중 임무를 계획하고 할당하며, 센서 정보를 공중급유기, 타격기, 전투기 전력과 통합합니다."
 MD_atc_command_2: "연합 항공 작전 센터 II"
 MD_atc_command_2_desc: "$MD_atc_command_1_desc$"
 MD_atc_command_3: "연합 항공 작전 센터 III"
 MD_atc_command_3_desc: "$MD_atc_command_1_desc$"
 MD_atc_tt_fully_upgraded: "§G업그레이드 완료§!"
 MD_atc_tt_mastery_0_5: "§G+0.5§!"
 MD_atc_tt_mastery_0_75: "§G+0.75§!"
 MD_atc_tt_mastery_1_0: "§G+1.0§!"
 MD_atc_tt_mastery_1_25: "§G+1.25§!"
 MD_atc_ex_training_tt: "§Y항공 작전 전비 태세 훈련§!\n\n£air_experience 공군 경험치: §R-325§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y항공 작전 전비 태세 훈련§!을 획득합니다:\n £fuel_consumption_texticon  공군 연료 소비: §R+25%§!\n £experience_neutral_texticon  항공단 임무 경험치 획득량: §G+5%§!\n£doctrine_mastery §H훈련 및 작전§! 숙련도: 하루당 [MD_atc_exercise_mastery_tt_text], §H90§!일간\n\n공군 대교리와, 정찰기를 최소 한 대 포함하여 최소 §H50§!대의 배치된 항공기가 필요합니다."
 MD_atc_ex_design_tt: "§Y비행 시험 평가§!\n\n£air_experience 공군 경험치: §R-325§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y비행 시험 평가§!를 획득합니다:\n £fuel_consumption_texticon  공군 연료 소비: §R+25%§!\n £air_accidents_texticon  항공 사고 확률: §G-5%§!\n£doctrine_mastery §H항공기 설계§! 숙련도: 하루당 [MD_atc_exercise_mastery_tt_text], §H90§!일간\n\n공군 대교리와 배치된 항공기 최소 §H50§!대가 필요합니다."
 MD_atc_ex_heavy_tt: "§Y전략 공수 및 폭격기 훈련§!\n\n£air_experience 공군 경험치: §R-325§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y전략 공수 및 폭격기 훈련§!을 획득합니다:\n £fuel_consumption_texticon  공군 연료 소비: §R+25%§!\n £air_range_texticon  공군 항속 거리: §G+3%§!\n£doctrine_mastery §H대형 항공기§! 숙련도: 하루당 [MD_atc_exercise_mastery_tt_text], §H90§!일간\n\n§Y전략 파괴§! 또는 §Y통합 항공전§! 대교리와, 전략 폭격기를 최소 한 대 포함하여 최소 §H50§!대의 배치된 항공기가 필요합니다."
 MD_atc_ex_multirole_tt: "§Y다목적 전투기 타격 훈련§!\n\n£air_experience 공군 경험치: §R-325§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y다목적 전투기 타격 훈련§!을 획득합니다:\n £fuel_consumption_texticon  공군 연료 소비: §R+25%§!\n £air_escort_efficiency_texticon  호위 효율: §G+3%§!\n£doctrine_mastery §H다목적 항공기§! 숙련도: 하루당 [MD_atc_exercise_mastery_tt_text], §H90§!일간\n\n§Y지역 영공 방어§!, §Y전장 지원§!, §Y제공권 확보§!, §Y자율 항공 작전§! 또는 §Y다목적 운용§! 대교리와, 전투기를 최소 한 대 포함하여 최소 §H50§!대의 배치된 항공기가 필요합니다."
 MD_atc_ex_strike_tt: "§Y근접 항공 지원 훈련§!\n\n£air_experience 공군 경험치: §R-325§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y근접 항공 지원 훈련§!을 획득합니다:\n £fuel_consumption_texticon  공군 연료 소비: §R+25%§!\n £cas_efficiency_texticon  항공 지원 임무 효율: §G+3%§!\n£doctrine_mastery §H공격기§! 숙련도: 하루당 [MD_atc_exercise_mastery_tt_text], §H90§!일간\n\n§Y지역 영공 방어§!, §Y전략 파괴§!, §Y전장 지원§!, §Y자율 항공 작전§! 또는 §Y통합 항공전§! 대교리와, 근접 항공 지원기, 전술 폭격기, 해군 폭격기 또는 전략 폭격기를 최소 한 대 포함하여 최소 §H50§!대의 배치된 항공기가 필요합니다."
 MD_atc_ex_fighter_tt: "§Y공중전 훈련§!\n\n£air_experience 공군 경험치: §R-325§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y공중전 훈련§!을 획득합니다:\n £fuel_consumption_texticon  공군 연료 소비: §R+25%§!\n £air_superiority_efficiency_texticon  제공권 임무 효율: §G+3%§!\n£doctrine_mastery §H전투기§! 숙련도: 하루당 [MD_atc_exercise_mastery_tt_text], §H90§!일간\n\n§Y지역 영공 방어§!, §Y전략 파괴§!, §Y전장 지원§!, §Y제공권 확보§!, §Y다목적 운용§! 또는 §Y통합 항공전§! 대교리와, 전투기 또는 요격기를 최소 한 대 포함하여 최소 §H50§!대의 배치된 항공기가 필요합니다."
 MD_atc_ex_drone_tt: "§Y무인 체계 훈련§!\n\n£air_experience 공군 경험치: §R-325§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y무인 체계 훈련§!을 획득합니다:\n £fuel_consumption_texticon  공군 연료 소비: §R+25%§!\n £dive_bombing_texticon  지상 폭격 표적 지정: §G+3%§!\n£doctrine_mastery §H드론전§! 숙련도: 하루당 [MD_atc_exercise_mastery_tt_text], §H90§!일간\n\n§Y자율 항공 작전§! 대교리와 배치된 항공기 최소 §H50§!대가 필요합니다."
 MD_atc_academy_tt_1: "£air_experience 공군 경험치: §R-400§!\n공군사관학교 정신 슬롯에 §Y항공전 학교 I§!을 해금합니다:\n £doctrine_mastery 공군 교리 숙련도 획득: §G+5%§!\n £experience_neutral_training_texticon  항공단 훈련 경험치 획득량: §G+10%§!\n공군 훈련 £doctrine_mastery 하루당 §H숙련도§!가 §Y0.5§!에서 §G0.75§!로 상승합니다"
 MD_atc_academy_tt_2: "£air_experience 공군 경험치: §R-475§!\n공군사관학교 정신 슬롯에 §Y항공전 학교 II§!를 해금합니다:\n장착 중인 경우 §Y항공전 학교 I§!을 대체합니다.\n £doctrine_mastery 공군 교리 숙련도 획득: §G+10%§!\n £experience_neutral_training_texticon  항공단 훈련 경험치 획득량: §G+20%§!\n공군 훈련 £doctrine_mastery 하루당 §H숙련도§!가 §Y0.75§!에서 §G1.0§!으로 상승합니다"
 MD_atc_academy_tt_3: "£air_experience 공군 경험치: §R-600§!\n공군사관학교 정신 슬롯에 §Y항공전 학교 III§!을 해금합니다:\n장착 중인 경우 §Y항공전 학교 II§!를 대체합니다.\n £doctrine_mastery 공군 교리 숙련도 획득: §G+15%§!\n £experience_neutral_training_texticon  항공단 훈련 경험치 획득량: §G+30%§!\n공군 훈련 £doctrine_mastery 하루당 §H숙련도§!가 §Y1.0§!에서 §G1.25§!로 상승합니다"
 MD_atc_academy_tt: "§Y비행 훈련 교과 과정§!\n\n[MD_atc_academy_tt_text]"
 MD_atc_force_tt_1: "£air_experience 공군 경험치: §R-400§!\n공군 정신 슬롯에 §Y비행 안전 및 정비 프로그램 I§!을 해금합니다:\n £air_accidents_texticon  항공 사고 확률: §G-10%§!"
