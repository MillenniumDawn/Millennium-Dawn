 indian_event.53.t: "Договор о союзе с Индией"
 indian_event.53.d: "Сегодня в нашу столицу прибыла индийская делегация с предложением о военном сотрудничестве и дружбе между нашими странами. Мы уже давно ищем потенциального сильного союзника в Азии, и вот появилась эта возможность. Какой выбор мы сделаем?"
 indian_event.53.a: "Дружба лучше войны"
 indian_event.53.b: "Индия - не наш вариант"
 indian_event.54.t: "Предложение о разделе сфер влияния в Афганистане"
 indian_event.54.d: "Поскольку мы являемся союзником Индии, встал вопрос о создании сухопутной связи между нашими странами путём раздела сфер влияния в Афганистане. Предложение очень заманчивое, поскольку таким образом мы можем расширить сферу своего влияния и укрепить свои позиции в мире."
 indian_event.54.a: "Пришло время строить свою империю"
 indian_event.54.b: "У нас достаточно своей территории"
 HE_accepted_TT: "§RТуркменистан должен принять соглашение о союзе, чтобы раздел Афганистана мог состояться§!"
 TRK_accepted_this: "Подписан союзный договор"
 indian_event.55.t: "Военная коалиция БРИКС"
 indian_event.55.d: "На последней встрече БРИКС было предложено объединить БРИКС в военный альянс. Стоит ли нам присоединяться?"
 indian_event.55.a: "Мы в деле!"
 indian_event.55.b: "Спасибо, нет"
 indian_event.56.t: "Переговоры по программе \"НАТО-плюс\""
 indian_event.56.d: "В последние годы Индия значительно сблизилась с Западом. Наши министры и дипломаты предлагают привязать Индию к альянсу в качестве крупного союзника, не входящего в НАТО, — статуса «НАТО плюс», не предусматривающего полноправного членства. Стоит ли нам добиваться этого?"
 indian_event.56.a: "Давайте пригласим их!"
 indian_event.56.b: "А? Нет!"
 RAJ_Indian_alliance: "Нейтральная армия"
 RAJ_Indian_alliance_desc: "Нейтралитет наших армий будет иметь огромную власть над другими. Наш боевой дух будет высок благодаря нашей геополитической позиции, поскольку мы независимы от любой другой иностранной державы!"
