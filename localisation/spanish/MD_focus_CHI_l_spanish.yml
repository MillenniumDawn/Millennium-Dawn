 CHI_054a_production_line_desc: "Cada flota necesita un caballo de batalla, y la nuestra es la Tipo 054A. Construida en una larga serie ininterrumpida desde 2008, esta fragata capaz y asequible se convierte en el escolta estándar de la armada, y en el buque enviado al golfo de Adén cuando China se unió a las patrullas antipiratería ese mismo año, su primera misión sostenida en aguas distantes."
 CHI_45g_national_deployment: "Despliegue de la red 5G"
 CHI_45g_national_deployment_desc: "China Mobile lanza el 4G comercial y, en un plazo de tres años, tenemos más estaciones base que el resto del mundo combinado. El MIIT emite licencias 5G a los tres operadores y, para cuando las compañías telefónicas occidentales están debatiendo sus estrategias de despliegue, nosotros ya operamos 4,1 millones de estaciones base 5G que atienden a mil millones de usuarios. La brecha de infraestructura ya no es algo que estemos cerrando; es algo que hemos invertido a nuestro favor."
 CHI_863_ic_preparatory_research: "Investigación preparatoria de CI del Programa 863"
 CHI_863_ic_preparatory_research_desc: "Bajo el Plan Estatal de Desarrollo de Alta Tecnología, el diseño y la fabricación de circuitos integrados se designan como un campo prioritario. Los fondos estatales fluyen hacia los centros de investigación universitarios y los pilotos de fundición en fases iniciales en el delta del río de las Perlas y Shanghái, sentando las bases del capital humano y de la cadena de suministro que el Fondo Nacional de CI escalará más tarde hacia la producción industrial. Estamos plantando semillas en un suelo que tardará una década en mostrar una cosecha."
 CHI_863_nev_program: "Vía de vehículos de nueva energía y Diez Ciudades del Programa 863"
 CHI_863_nev_program_desc: "Wan Gang, ingeniero convertido en ministro que pasó nueve años en Audi antes de regresar a China, argumentó que podíamos saltarnos por completo los motores de combustión. El programa Diez Ciudades, Mil Vehículos despliega flotas públicas de VNE en ciudades piloto; Shenzhen electrifica toda su flota de autobuses y taxis. La Gigafábrica de Tesla en Shanghái, construida en 357 días desde la colocación de la primera piedra, se convierte en el catalizador que obliga a cada fabricante chino de vehículos eléctricos a competir en calidad y velocidad de producción. No debimos esperar menos del mercado que nosotros mismos creamos."
 CHI_a_lighter_touch_on_dissent: "Mano blanda con la disidencia"
 CHI_a_lighter_touch_on_dissent_desc: "En lugar de intensificar la coacción interna, permitimos un espacio limitado para la expresión de la sociedad civil y el debate intelectual dentro de unos límites cuidadosamente gestionados. Este enfoque intercambia el control político a corto plazo por una reducción de las fricciones que impulsan la organización clandestina."
 CHI_abolish_term_limits: "Abolición de los límites de mandato"
 CHI_abolish_term_limits_desc: "La Asamblea Nacional Popular vota 2958 a favor, 2 en contra y 3 abstenciones para eliminar de la constitución el límite de dos mandatos para la presidencia del Estado. El voto es formalmente unánime en todo menos en el nombre. La autoridad ya no está sujeta a un reloj constitucional. La decisión elimina la restricción institucional más importante al poder personal desde las reformas post-Mao."
 CHI_above_the_neck_reform: "Reforma «Por encima del cuello»"
 CHI_above_the_neck_reform_desc: "Las antiguas siete regiones militares respondían ante el ejército de tierra y libraban sus propias guerras. En 2016 recortamos primero «por encima del cuello»: la Comisión Militar Central asume el mando directo, cinco mandos de teatro de operaciones sustituyen a las regiones y nace un Estado Mayor Conjunto para luchar como uno solo. El mando antes que las fuerzas, la cabeza antes que el cuerpo."
 CHI_active_defense_doctrine: "Defensa activa"
 CHI_active_defense_doctrine_desc: "La defensa activa ha sido la estrategia rectora del ejército desde Mao: estratégicamente defensiva, pero operacional y tácticamente ofensiva. La perfeccionamos para la era de los misiles, sosteniendo que la forma más segura de defender la patria es golpear la punta de lanza del enemigo antes de que aterrice."
 CHI_African_Continental_Integration: "El siglo chino-africano"
 CHI_African_Continental_Integration_desc: "Nos hemos convertido en el mayor socio comercial individual de África, con un comercio bilateral que supera los 254 000 millones de dólares anuales. Décadas de inversión de la Franja y la Ruta en puertos, ferrocarriles y zonas económicas especiales han hecho que nuestra infraestructura y nuestro capital sean indispensables para la agenda de integración continental de la Unión Africana. Ha llegado el momento de convertir este peso económico en una asociación institucional duradera."
 CHI_agricultural_tax_abolition: "Abolición del impuesto agrícola"
 CHI_agricultural_tax_abolition_desc: "El problema Sannong (agricultura, campo, agricultores) se había vuelto explosivo en la China rural mucho antes de que el debate formal llegara a Pekín. Un piloto de reforma fiscal rural arraigado en la provincia de Anhui demostró hasta qué punto la carga de los gravámenes locales había reprimido los ingresos de los campesinos y la inversión agrícola. El Documento N.º 1 del Comité Central volvió a centrarse en la cuestión rural durante diez años consecutivos. La derogación de la Ordenanza del Impuesto Agrícola de 1958 libera un capital rural que ha esperado décadas para fluir hacia las llanuras centrales de Henan, el cinturón arrocero de Hunan y la cuenca de Sichuan."
 CHI_AIIB_Founding: "Banco Asiático de Inversión en Infraestructura"
 CHI_AIIB_Founding_desc: "El Banco Asiático de Inversión en Infraestructura, que fundamos con 57 Estados miembros a pesar de la enérgica oposición de Washington, proporciona financiación multilateral para infraestructuras en Asia y fuera de ella. Su existencia demuestra que podemos construir instituciones internacionales creíbles totalmente al margen del marco de Bretton Woods. El monopolio occidental sobre la financiación del desarrollo se ha roto."
 CHI_An_Alliance_to_Rival_NATO_tt: "§YLos efectos se mostrarán una vez que establezcamos nuestra facción.§!"
 CHI_anshan_steel_modernization: "Modernización del complejo siderúrgico de Anshan"
 CHI_anshan_steel_modernization_desc: "El Grupo de Hierro y Acero de Anshan, el complejo siderúrgico integrado más antiguo y grande de China, se somete a un importante programa de modernización. Los obsoletos hornos de solera abierta se sustituyen por la fabricación de acero al oxígeno básico, lo que reduce los costes y eleva el techo de calidad para la fabricación posterior."
 CHI_ant_group_empire: "El imperio financiero de Ant Group"
 CHI_ant_group_empire_desc: "Ant Group, escindida de Alibaba, construye un imperio financiero que abarca Yu'ebao, Zhima Credit, Huabei y MYbank, respaldando a Paytm, GCash y Dana a nivel internacional. Su concesión de préstamos al consumo funciona al margen de las normas que vinculan a todos los bancos estatales, y Jack Ma desafía públicamente a esos bancos en la Cumbre del Bund, comparándolos con casas de empeño. Los reguladores se han dado cuenta."
 CHI_anti_japanese_boycott_campaign: "Campaña de boicot antijaponés"
 CHI_anti_japanese_boycott_campaign_desc: "Las masas están enfadadas. Nosotros no hemos creado su ira. Simplemente elegimos no interponernos en su camino, hasta el momento en que decidamos hacerlo."
 CHI_Arab_League_Cooperation_Forum: "Foro de Cooperación de los Estados China-Árabes"
 CHI_Arab_League_Cooperation_Forum_desc: "El Foro de Cooperación China-Estados Árabes convoca a los ministros de Asuntos Exteriores de los 22 miembros de la Liga Árabe para coordinar la cartera de proyectos de la Franja y la Ruta, la política comercial y el alineamiento político. A través de él mantenemos un canal institucional permanente en Oriente Medio que elude por completo los marcos liderados por Occidente. Los Estados árabes ganan capacidad de influencia sobre sus socios tradicionales mediante el acceso demostrado a nuestro capital, y nosotros ganamos un bloque cuyos votos siguen nuestro liderazgo."
 CHI_arms_for_influence: "Armas por influencia"
 CHI_arms_for_influence_desc: "Cada caja de exportación compra más que dinero en efectivo. Armamos a clientes a los que ningún proveedor occidental se acercará y cobramos la deuda en puertos, votos y lealtad, convirtiendo el comercio de armas de las fuerzas militares en un discreto instrumento de política exterior."
 CHI_army_aviation_corps: "El Cuerpo de Aviación del Ejército"
 CHI_army_aviation_corps_desc: "Un ejército que no puede volar no puede golpear rápido. Reforzamos la rama de Aviación del Ejército con el helicóptero de ataque Z-10 y el de transporte Z-20, dotando a las brigadas rápidas de sus propios helicópteros artillados y capacidad de elevación para saltar sobre el terreno y desplegar tropas detrás del enemigo."
 CHI_army_reorganisation: "Reorganizar el Ejército"
 CHI_army_reorganisation_desc: "Los trece nuevos ejércitos de grupo se equilibran y se vuelven a numerar, cada uno de ellos construido a partir de brigadas de armas combinadas en lugar de divisiones pesadas y torpes. La fuerza terrestre emerge más ligera, modular y finalmente intercambiable, capaz de concentrarse o dispersarse según lo exija el combate."
 CHI_artillery_modernisation: "Modernizar la artillería"
 CHI_artillery_modernisation_desc: "Las piezas de artillería son tan buenas como el sistema que las apunta. El radar de contrabatería, el control de tiro digital y los proyectiles de precisión convierten a la artillería, que antes era un arma de área, en un bisturí capaz de golpear con precisión desde la primera descarga."
 CHI_assuage_japanese_concerns: "Mitigar las preocupaciones japonesas"
 CHI_assuage_japanese_concerns_desc: "Ellos vigilan a nuestra guardia costera. Vigilan nuestras pruebas de misiles. Así que, cuando cancelamos públicamente un ejercicio, lo notan."
 CHI_astana_speech: "Cinturón Económico de la Ruta de la Seda"
 CHI_astana_speech_desc: "Un discurso en la Universidad Nazarbáyev en Astaná propuso «construir conjuntamente un cinturón económico a lo largo de la Ruta de la Seda» que nos vincule con Europa a través de Asia Central. Combinado con la Ruta de la Seda Marítima del Siglo XXI anunciada el mes siguiente en Indonesia, la Iniciativa de la Franja y la Ruta toma forma. La financiación de infraestructuras, las concesiones portuarias y los contratos ferroviarios deben fluir ahora hacia el exterior desde Pekín a una escala que cambie el orden del mundo."
 CHI_avic_reunification: "Reunificar AVIC"
 CHI_avic_reunification_desc: "Dividida en 1999 en dos mitades rivales para forzar la competencia, la industria de la aviación solo aprendió a duplicar tareas y a pelear. En 2008, AVIC I y AVIC II se vuelven a unir en una sola Corporación de la Industria de la Aviación, un único techo sobre los cazas, motores y aviónica que la fuerza aérea ha esperado durante décadas."
 CHI_Back_Channel_to_Foggy_Bottom: "Canal secundario con Foggy Bottom"
 CHI_Back_Channel_to_Foggy_Bottom_desc: "Los equipos diplomáticos chinos y estadounidenses establecen un canal secundario discreto a través de las trastiendas de las embajadas e interlocutores de la Vía II. Ambos bandos reconocen en privado que la cuestión coreana no puede resolverse sin un entendimiento mutuo."
 CHI_banking_recapitalisation: "Recapitalización del sector bancario"
 CHI_banking_recapitalisation_desc: "Nuestro sector bancario acumuló una carga aplastante de préstamos de cobro dudoso durante la expansión crediticia de la década de 1990. Debemos inyectar capital público para limpiar estos pasivos de los balances de los bancos estatales y, a continuación, sacar a bolsa a las instituciones reestructuradas en el mercado de Hong Kong. Los accionistas minoritarios extranjeros y las normas internacionales de contabilidad llegarán después, otorgando a nuestro sistema financiero la credibilidad de la que actualmente carece."
 CHI_baosteel_ipo: "La OPA de Baosteel"
 CHI_baosteel_ipo_desc: "Baoshan Iron and Steel sale a cotizar en la Bolsa de Shanghái en lo que fue la mayor oferta pública de adquisición de nuestra historia, recaudando 7700 millones de yuanes. Fundada con tecnología licenciada de Nippon Steel, Baosteel absorbió a Shanghái Metallurgical Holding y Meishan bajo la política de Zhu Rongji de «aferrarse a lo grande y liberar lo pequeño». Su integración de chapas automotrices de alta calidad y flejes eléctricos establece el punto de referencia para la modernización del sector siderúrgico de China."
 CHI_baowu_merger: "El nacimiento de Baowu Steel"
 CHI_baowu_merger_desc: "La fusión de Baosteel Group y Wuhan Iron and Steel Corporation crea China Baowu Steel Group, consolidando nuestra estrategia de construir campeones siderúrgicos nacionales capaces de competir a escala global. Bajo la presidencia de Chen Derong, Baowu adquiere posteriormente Maanshan Iron and Steel, Taiyuan Iron and Steel, Chongqing Iron and Steel y Xinjiang Bayi Iron and Steel. Produciendo más de 115 millones de toneladas anuales, Baowu ha superado a ArcelorMittal para convertirse en el mayor fabricante de acero del mundo."
 CHI_bat_platform_rise: "El ascenso de las BAT"
 CHI_bat_platform_rise_desc: "Baidu, Alibaba y Tencent definen nuestro internet. Baidu domina las búsquedas tras la salida de Google; Alibaba ha construido el ecosistema de comercio electrónico más grande del mundo; WeChat de Tencent alcanza los 1300 millones de usuarios. El entorno político que mantuvo fuera a los rivales occidentales no creó a estas empresas, pero les dio el espacio para crecer sin ser adquiridas o destruidas por el capital de Silicon Valley. Ese espacio fue una elección estratégica, y fue la correcta."
 CHI_bayan_obo_ree_group: "Bayan Obo y China Rare Earth Group"
 CHI_bayan_obo_ree_group_desc: "Deng Xiaoping observó que Oriente Medio tiene petróleo mientras que nosotros tenemos tierras raras. El yacimiento de Bayan Obo en Baotou, Mongolia Interior, operado por China Northern Rare Earth Group, es el depósito de tierras raras ligeras más grande del mundo; las minas de Ganzhou en Jiangxi suministran tierras raras pesadas, incluidos el disprosio y el terbio. El MIIT ha consolidado a seis productores regionales en China Rare Earth Group y China Northern Rare Earth Group. Las cuotas de exportación, abolidas formalmente tras un fallo de la OMC, regresan como licencias de exportación y cuotas de producción que logran el mismo efecto. Debemos usar esta influencia antes de que otros encuentren sustitutos."
 CHI_Beidou_Latin_Constellation: "Constelación latina de Beidou"
 CHI_Beidou_Latin_Constellation_desc: "Las estaciones terrestres para nuestro sistema de navegación Beidou en Argentina y Venezuela extienden la precisión de la constelación al hemisferio occidental y reducen la dependencia regional de la infraestructura GPS de los Estados Unidos. Las instalaciones de doble uso sustentan contratos civiles de agricultura y topografía al tiempo que nos proporcionan datos de posicionamiento estratégico. Washington trata las instalaciones como un desafío directo a su dominio de inteligencia de señales en las Américas, y Washington tiene razón."
 CHI_beijing_action_plan_green_olympics: "Plan de Acción para unos Juegos Olímpicos Verdes"
 CHI_beijing_action_plan_green_olympics_desc: "Nuestra candidatura para albergar los Juegos Olímpicos prometió al COI un espectáculo medioambientalmente responsable. Ahora debemos cumplir esa promesa: reforestación a gran escala, cambio de combustible de carbón a gas en toda la red de calefacción de Pekín, reubicación industrial fuera de la capital, normas más estrictas de emisiones de vehículos y la construcción de sedes que abarcan seis ciudades. El mundo nos estará observando."
 CHI_beijing_command_clique: "La camarilla de mando de Pekín"
 CHI_beijing_command_clique_desc: "Las camarillas provinciales convergen en la capital. Una red de generales comprados toma el control de los órganos de mando en la propia Pekín, de modo que ningún ascenso, contrato o destino se mueve sin su bendición y su respectiva comisión."
 CHI_Beijing_Communique: "Comunicado de Paz de Pekín"
 CHI_Beijing_Communique_desc: "Nos hemos posicionado como el mediador de una normalización histórica entre Arabia Saudí e Irán, logrando que los dos rivales regionales restablezcan relaciones diplomáticas bajo nuestra mediación. El comunicado demuestra que podemos ofrecer resultados geopolíticos que Washington no puede o no quiere, consolidando nuestra credibilidad como garante de seguridad alternativo. La opinión regional ahora se inclina notablemente hacia nuestro liderazgo diplomático, y debemos aprovechar esa ventaja."
 CHI_beijing_tianjin_hsr: "Alta velocidad Pekín-Tianjín"
 CHI_beijing_tianjin_hsr_desc: "El ferrocarril interurbano Pekín-Tianjín, de 117 kilómetros de longitud, cubre la distancia en treinta minutos a 350 km/h y marca el inicio de la expansión de la alta velocidad en China. La tecnología licenciada de Kawasaki, Siemens, Alstom y Bombardier se absorbe y nacionaliza a través de China South Railway y China North Railway, que desde entonces se han fusionado para formar CRRC. Una colisión en Wenzhou provoca una reducción de velocidad a 300 km/h y un refuerzo de las normas de calidad. La red supera ya los 40 000 km, y esto es solo el principio de lo que vamos a construir."
 CHI_below_the_neck_disband: "Disolver «Por debajo del cuello»"
 CHI_below_the_neck_disband_desc: "Con el alto mando remodelado, el cuchillo pasa al cuerpo. A partir de abril de 2017, las reformas «por debajo del cuello» disuelven los cuerpos de ejército en brigadas de armas combinadas, recortan trescientos mil soldados y cambian el enfoque del ejército de la masa a la maniobra. Ejércitos enteros desaparecen de las listas para que lo que quede pueda luchar de verdad."
 CHI_Belt_and_Road_Vision: "Iniciativa de la Franja y la Ruta"
 CHI_Belt_and_Road_Vision_desc: "Lanzar la Iniciativa de la Franja y la Ruta, invirtiendo cientos de miles de millones en proyectos de infraestructura que conecten Asia, África y Europa con China a través de carreteras, ferrocarriles, puertos y redes digitales."
 CHI_Bide_Your_Time: "Ocultar la fuerza, esperar el momento"
 CHI_Bide_Your_Time_desc: "Seguir la máxima de Deng Xiaoping. Evitar la confrontación, construir lazos económicos y acumular un poder nacional integral de forma discreta. El ascenso de China no tiene por qué provocar una coalición en su contra."
 CHI_big_four_ipo: "La ola de OPAs de los Cuatro Grandes"
 CHI_big_four_ipo_desc: "Nuestros bancos estatales están completando una ola de salidas a bolsa sin precedentes. El Banco de Construcción de China recauda 9200 millones de dólares en Hong Kong; la cotización dual simultánea del ICBC en Hong Kong y Shanghái establece un récord mundial con 21 900 millones; el Banco Agrícola de China lo supera con 22 100 millones. El ICBC es ahora el mayor banco del mundo por activos totales, y los Cuatro Grandes se incorporan a la lista de bancos de importancia sistémica mundial del Consejo de Estabilidad Financiera. Central Huijin Investment sigue siendo el accionista dominante en cada uno de ellos."
 CHI_big_fund_phase2: "Fondo Nacional de CI: Fase II"
 CHI_big_fund_phase2_desc: "La segunda fase del Fondo Nacional de Circuitos Integrados recauda 200 000 millones de yuanes, destinados a equipos, materiales y encapsulado avanzado para cubrir los huecos en la cadena de suministro que las sanciones de EE. UU. han expuesto. Le sigue una tercera fase de más de 300 000 millones de yuanes, la mayor movilización de capital individual en la historia de los semiconductores. La estrategia ha pasado del escalado de capacidad a la integración vertical completa: desde la oblea en bruto hasta el SoC encapsulado, cada paso del ecosistema se abastecerá o desarrollará de forma nacional. Nada menos que eso nos dará la seguridad que necesitamos."
 CHI_big_fund_phase_1: "Fondo de Inversión de la Industria de Semiconductores"
 CHI_big_fund_phase_1_desc: "El Consejo de Estado ha emitido el Documento N.º 18, que designa a los semiconductores como una industria estratégica. El Fondo Nacional de Inversión de la Industria de Circuitos Integrados (el Gran Fondo) recauda 138 700 millones de yuanes en su cierre inicial, consolidando una movilización de capital liderada por el Estado en fundición, diseño y equipos. Canalizamos fondos hacia SMIC, Huawei HiSilicon y una constelación de instrumentos de coinversión provinciales. Ya no podemos permitirnos la dependencia tecnológica de TSMC y ASML, y este fondo es nuestra declaración de intenciones."
 CHI_blue_granary_aquaculture: "El granero azul"
 CHI_blue_granary_aquaculture_desc: "Nuestro sector acuícola produce 52 millones de toneladas anuales, aproximadamente el 60 por ciento de la producción mundial y el 80 por ciento de nuestra propia cosecha acuática. El delta del río de las Perlas, en Guangdong, alberga las redes de estanques de tilapia más densas del mundo; la costa de Ningbo-Zhoushan, en Zhejiang, domina la producción de camarones y cangrejos. Las jaulas experimentales de salmón en aguas profundas en el mar Amarillo están transformando los distritos agrícolas costeros en centros de exportación de proteínas, aunque el uso excesivo de antibióticos y la eutrofización del lago Tai siguen siendo costes medioambientales no resueltos que no podemos ignorar indefinidamente."
 CHI_bow_to_china_dream: "Inclinarse ante el Sueño Chino"
 CHI_bow_to_china_dream_desc: "Cuando estalla la tormenta contra la corrupción, la alianza se dobla antes que romperse. La camarilla jura una ruidosa lealtad al Sueño Chino de Xi Jinping, entrega a unos pocos miembros como muestra y compra su supervivencia cambiando el saqueo abierto por privilegios más discretos."
 CHI_break_the_first_island_chain: "Romper la primera cadena de islas"
 CHI_break_the_first_island_chain_desc: "La cadena se extiende desde Kyushu a través de las Ryukyu hasta Taiwán. Durante cuarenta años ha embotellado a nuestra armada en aguas costeras. La cadena se rompe allí donde ceda el eslabón más débil. Y ese eslabón va a ceder."
 CHI_BRI_Forum_Beijing: "Foro de la Franja y la Ruta para la Cooperación"
 CHI_BRI_Forum_Beijing_desc: "El Foro de la Franja y la Ruta para la Cooperación Internacional, celebrado en Pekín y en constante crecimiento con cada edición, convoca a jefes de Estado y altos funcionarios de más de 100 países para coordinar carteras de proyectos, firmar acuerdos marco y proyectar nuestro liderazgo en la agenda de desarrollo global. Ninguna otra nación puede reunir a semejante asamblea en torno a su propia mesa."
 CHI_byd_catl_integration: "Build Your Dreams"
 CHI_byd_catl_integration_desc: "BYD, fundada por Wang Chuanfu como fabricante de baterías en Shenzhen, ha detenido por completo la producción de vehículos puros de combustión; su tecnología de celdas LFP a paquete (Blade Battery) establece nuevos estándares de seguridad y coste. CATL, con sede en Ningde, utilizó una lista oficial de baterías aprobadas por el gobierno para excluir a Panasonic, LG y Samsung SDI el tiempo suficiente para construir una posición inexpugnable. Juntas, las dos empresas controlan ahora más del 60 por ciento de la producción mundial de baterías para vehículos eléctricos. Construimos esta industria desde la nada, y nos pertenece."
 CHI_cadre_evaluation_reform: "Reforma de la evaluación de cuadros"
 CHI_cadre_evaluation_reform_desc: "Nuestro sistema de evaluación de cuadros ha recompensado durante demasiado tiempo a los funcionarios provinciales que logran el crecimiento del PIB a costa de degradar el medio ambiente y descuidar los servicios públicos. Debemos introducir ponderaciones obligatorias para la protección medioambiental, la armonía social y la intensidad energética junto con la producción económica. Un funcionario que logra el crecimiento destruyendo las condiciones necesarias para el mismo no merece ningún ascenso."
 CHI_cadre_rotation: "Sistema de rotación de cuadros"
 CHI_cadre_rotation_desc: "El control local es la podredumbre en el corazón de la gobernanza china. Los funcionarios que permanecen demasiado tiempo en el mismo puesto desarrollan lazos con los intereses comerciales locales que corrompen su juicio. Un programa sistemático de rotación aprovecha la experiencia de Chongqing para trasladar a los cuadros entre puestos con regularidad, rompiendo las redes de clientelismo antes de que se solidifiquen."
 CHI_caojing_seven_chem_bases: "Bases petroquímicas de Shanghái Caojing"
 CHI_caojing_seven_chem_bases_desc: "El Consejo de Estado designa siete bases petroquímicas nacionales: el Parque de la Industria Química de Shanghái en Caojing, seguido de Nankín, Ningbo Daxie, la bahía de Daya, Quanzhou, Dalian y Caofeidian. Cada base recibe vapor centralizado, tratamiento compartido de efluentes, instalaciones portuarias dedicadas e instalaciones integradas de craqueo de etileno, replicando el modelo Verbund ideado por BASF en Ludwigshafen. BASF, Bayer, ExxonMobil, Shell y Saudi Aramco obtienen acceso a través de empresas conjuntas o filiales de propiedad absoluta. El complejo de BASF en Zhanjiang, con una inversión de 10 000 millones de euros, se convierte en la mayor inversión individual de BASF a nivel mundial, una muestra de lo que nuestro mercado puede ofrecer al capital extranjero cuando decidimos ofrecerlo."
 CHI_Central_Asia_Connectivity: "Cinturón Económico de la Ruta de la Seda"
 CHI_Central_Asia_Connectivity_desc: "El Cinturón Económico de la Ruta de la Seda discurre por vía terrestre a través de Asia Central, anclado por el puerto seco del Paso de Khorgos en la frontera con Kazajistán, un centro de transbordo ferroviario y de carreteras que conecta el ancho de vía chino con la red rusa de vía ancha. Los volúmenes de carga a lo largo del corredor aumentan a medida que los tiempos de tránsito reducen los costes del transporte marítimo para mercancías que requieren rapidez en la entrega. Deberíamos acelerar la inversión en este corredor antes de que las potencias rivales reconozcan su valor estratégico."
 CHI_central_china_development: "El auge de China Central"
 CHI_central_china_development_desc: "Las provincias centrales de Henan, Hubei y Hunan se vieron ignoradas por el auge costero. Una iniciativa de desarrollo coordinada canaliza transferencias fiscales, inversiones en infraestructuras y la reubicación de la industria manufacturera hacia la región, anclando el corazón demográfico y agrícola de China a la historia del crecimiento nacional."
 CHI_central_manufacturing_belt: "Cinturón manufacturero central"
 CHI_central_manufacturing_belt_desc: "El aumento de los salarios costeros después de 2008 empuja a los fabricantes hacia el oeste, a Anhui, Jiangxi y Hunan. Los incentivos estatales para la reubicación de fábricas, combinados con unos costes de suelo y mano de obra más bajos, convierten a estas tres provincias en la columna vertebral industrial de nivel medio de China en una década, absorbiendo las cadenas de producción de los deltas del río de las Perlas y del Yangtsé en sectores como el textil, la electrónica y los componentes de automoción."
 CHI_central_military_civil_fusion: "Fusión militar-civil"
 CHI_central_military_civil_fusion_desc: "El muro entre la economía de guerra y la civil se derriba por decreto. Bajo la estrategia de Fusión Militar-Civil de Xi Jinping, elevada a prioridad nacional en 2017, cada avance en la electrónica comercial, la informática y el sector aeroespacial se aprovecha para el ejército, y cada avance en materia de defensa fluye de vuelta a la industria. La investigación de toda una nación se convierte en el laboratorio del Estado Mayor."
 CHI_central_urbanization_drive: "Campaña de urbanización de China Central"
 CHI_central_urbanization_drive_desc: "Se estima que cien millones de migrantes rurales de las provincias centrales se están trasladando a las capitales provinciales y ciudades de condado. Deberíamos acelerar la transición con subsidios a la vivienda, la ampliación de los servicios urbanos y la relajación selectiva del sistema hukou. El interior central debe transformarse de una reserva de mano de obra en un mercado de consumo mientras la ventana demográfica siga abierta."
 CHI_Challenge_Dollar_Hegemony: "Desafiar la hegemonía del dólar"
 CHI_Challenge_Dollar_Hegemony_desc: "Promover el renminbi como moneda de reserva alternativa y establecer acuerdos bilaterales de intercambio de divisas, socavando el dominio absoluto del dólar en las finanzas globales."
 CHI_change_lunar_exploration: "Programa lunar Chang'e"
 CHI_change_lunar_exploration_desc: "El programa lunar robótico Chang'e comenzó con un orbitador en 2007 y progresó a través de alunizajes suaves, los vehículos de exploración Yutu y la histórica misión Chang'e 4 en enero de 2019, que colocó un módulo de alunizaje y un vehículo de exploración en la cara oculta de la Luna por primera vez en la historia. Los datos enviados por estas misiones han transformado nuestra comprensión de la geología de la Luna y sientan las bases científicas para las posteriores misiones tripuladas."
 CHI_china_among_the_starts: "China entre las estrellas"
 CHI_china_among_the_starts_desc: "Nuestro programa Shenzhou nos situó entre el puñado de naciones capaces de realizar vuelos espaciales humanos independientes. Las misiones posteriores han establecido el acoplamiento orbital, las operaciones extravehiculares y los cimientos de una estación espacial permanente. Ahora debemos aprovechar estos logros para asegurar nuestro estatus como gran potencia espacial a la altura de los estadounidenses y los rusos."
 CHI_Chinese_Diplomacy: "Diplomacia china"
 CHI_Chinese_Diplomacy_desc: "El Imperio del Centro ha desempeñado históricamente un papel fundamental en los asuntos de Asia Oriental. Ahora que nos hemos recuperado del Siglo de la Humillación, es hora de trazar una estrategia diplomática integral que abarque tanto a los vecinos regionales como a las instituciones globales."
 CHI_chongqing_model_nationalisation: "El Modelo de Chongqing"
 CHI_chongqing_model_nationalisation_desc: "Chongqing bajo el mandato de Bo Xilai demostró que una alternativa estatista al liberalismo de mercado sigue siendo viable dentro de la República Popular. Mediante la renacionalización de activos estratégicos y la canalización del crédito hacia las empresas estatales, el municipio registró un crecimiento del PIB que superó con creces la media nacional. Extenderemos este modelo por todo el país."
 CHI_cic_forex_reserves: "Corporación de Inversión de China"
 CHI_cic_forex_reserves_desc: "Hemos acumulado más de 1,4 billones de dólares en reservas de divisas, depositadas en bonos del Tesoro estadounidense de bajo rendimiento que sirven a las necesidades de financiación de Estados Unidos más que a las nuestras. China Investment Corporation, capitalizada con 200 000 millones de dólares, diversifica esta riqueza soberana en capital privado global, infraestructuras y activos estratégicos. Tras las pérdidas iniciales en Blackstone y Morgan Stanley durante la crisis financiera, la CIC madura hasta convertirse en un inversor disciplinado que gestiona más de 1,3 billones de dólares, situándose entre los fondos soberanos más grandes del mundo."
 CHI_cj10_cj20_cruise_missile_family: "El CJ-10 y el CJ-20"
 CHI_cj10_cj20_cruise_missile_family_desc: "Los misiles de crucero de largo alcance proporcionan a los bombarderos su potencia de ataque. El CJ-10 lanzado desde tierra y el CJ-20 lanzado desde el aire permiten que un solo H-6 ataque objetivos fijos a mil quinientos kilómetros de distancia, multiplicando el alcance de toda la fuerza sin arriesgar a una tripulación sobre el objetivo."
 CHI_cloud_computing_triumvirate: "El triunvirato de la computación en la nube"
 CHI_cloud_computing_triumvirate_desc: "Alibaba Cloud posee el 39 por ciento de nuestro mercado de nube pública; Tencent Cloud sustenta la infraestructura de los videojuegos y la tecnología financiera; Huawei Cloud experimenta un fuerte crecimiento tras las sanciones de 2019 como una alternativa nacional a los servicios estadounidenses. Los proveedores extranjeros están limitados a empresas conjuntas en virtud de la Ley de Ciberseguridad. Hemos construido una infraestructura de nube nacional lo suficientemente grande como para sostener la economía digital sin dependencia extranjera, y eso no fue un accidente."
 CHI_coastal_acceleration_doctrine: "Doctrina de aceleración costera"
 CHI_coastal_acceleration_doctrine_desc: "Nuestras provincias costeras son aquellas donde el crecimiento es más rápido y donde los rendimientos de la liberalización son más evidentes. Deberíamos concentrar las políticas preferenciales en los deltas del río de las Perlas y del Yangtsé: multiplicar las zonas de procesamiento de exportaciones, flexibilizar las cuotas de uso de suelo para parques industriales y permitir que los gobiernos costeros emitan bonos de infraestructura antes que el interior. El interior seguirá el mismo rumbo cuando la costa haya demostrado la viabilidad del modelo."
 CHI_coastal_sez_2nd_generation: "Zonas Económicas Especiales de segunda generación"
 CHI_coastal_sez_2nd_generation_desc: "La primera generación de ZEE en Shenzhen y Pudong demostró el éxito del modelo. Se designa una segunda oleada de zonas en Shanghái y Guangdong, con marcos legales actualizados, logística mejorada y protecciones de propiedad intelectual más sólidas para atraer capital extranjero de mayor valor."
 CHI_combat_engineer_modernisation: "Modernizar los ingenieros"
 CHI_combat_engineer_modernisation_desc: "Los puentes, las brechas y las fortificaciones deciden si una brigada avanza o se estanca. El cuerpo de ingenieros es reequipado con vehículos modernos de tendido de puentes, limpieza de minas y movimiento de tierras para que el terreno nunca más detenga nuestro avance."
 CHI_commercial_launch_sector: "Sector de lanzamientos comerciales"
 CHI_commercial_launch_sector_desc: "Desde 2015, una nueva generación de empresas chinas de lanzamiento comercial ha pasado del plano de diseño a la plataforma de despegue. LandSpace voló el primer cohete propulsado por metano en alcanzar la órbita con el Zhuque-2 en 2023; Galactic Energy e iSpace han realizado múltiples lanzamientos exitosos de satélites pequeños. El respaldo estatal a este ecosistema amplía nuestra base industrial, reduce los costes de lanzamiento y atrae capital privado a la economía espacial."
 CHI_common_prosperity: "Prosperidad común"
 CHI_common_prosperity_desc: "La prosperidad común es nuestra prioridad de gobierno ahora. El crecimiento debe redirigirse hacia la reducción de la brecha de ingresos, la ampliación de los servicios sociales y la limitación de los excesos del sector privado. Las empresas de tutorías académicas, las plataformas tecnológicas y las industrias del entretenimiento deben aceptar nuevos límites. El objetivo declarado es un desarrollo ampliamente compartido; el efecto práctico es que reafirmamos la autoridad sobre sectores que habían crecido fuera de nuestro alcance, y ambas cosas son ciertas a la vez."
 CHI_common_prosperity_original: "Prosperidad común"
 CHI_common_prosperity_original_desc: "El objetivo del desarrollo no es agrandar el pastel indefinidamente mientras se deja que los pobres se peleen por las migajas. La prosperidad común significa dividir el pastel de manera justa a medida que lo hacemos crecer: redistribuir los ingresos, ampliar los servicios sociales y garantizar que los frutos de la industrialización lleguen tanto al trabajador que construyó la fábrica como al funcionario que la planificó."
 CHI_Community_of_Shared_Future: "Comunidad de futuro compartido"
 CHI_Community_of_Shared_Future_desc: "Promover el concepto de una comunidad de futuro compartido para la humanidad, abogando por el multilateralismo y la cooperación de beneficio mutuo como alternativas a las instituciones lideradas por Occidente."
 CHI_Comprehensive_Agreement_Investment: "Acuerdo de Inversión UE-China"
 CHI_Comprehensive_Agreement_Investment_desc: "El Acuerdo Integral sobre Inversiones, concluido tras siete años de negociaciones, otorgaría a nuestras empresas un mejor acceso a los mercados de servicios europeos a cambio de compromisos sobre la transparencia de las ayudas estatales. El Parlamento Europeo suspendió la ratificación tras la imposición de sanciones mutuas, pero la lógica económica del acuerdo persiste. Un acuerdo ratificado reduciría significativamente las barreras para el capital chino en todo el mercado único de la Unión, y deberíamos presionar a Bruselas para reactivarlo."
 CHI_construction_soe_champions: "Campeones estatales de la construcción"
 CHI_construction_soe_champions_desc: "China State Construction Engineering Corporation, China Railway Construction Corporation, China Communications Construction Company y Power Construction Corporation ocupan colectivamente siete de las diez primeras posiciones en la clasificación mundial de contratistas. Décadas de megaproyectos nacionales nos han proporcionado una fuerza laboral capacitada de más de dos millones de personas, costes unitarios entre un veinte y un treinta por ciento inferiores a los de los competidores occidentales y redes de adquisiciones que obtienen materiales más rápido que cualquier rival privado. Debemos proteger estas ventajas estructurales, porque se traducen directamente en menores costes y plazos de construcción más cortos para cada categoría de construcción de infraestructura que emprendamos en el país o vendamos en el extranjero."
 CHI_cosco_global_network: "Red marítima mundial de COSCO"
 CHI_cosco_global_network_desc: "La fusión de COSCO y China Shipping forma uno de los mayores transportistas de contenedores del mundo, y la posterior adquisición de Orient Overseas International extiende aún más nuestro alcance. COSCO Shipping Ports opera actualmente terminales en El Pireo, Zeebrugge, Valencia, Singapur, Abu Dabi y Chancay. La Ruta de la Seda Marítima del Siglo XXI vincula estos nodos en una red respaldada por el Estado a través de cinco continentes. Nunca más deberíamos depender de transportistas extranjeros para mover nuestras mercancías."
 CHI_Counter_Terrorism_Cooperation: "Cooperación antiterrorista"
 CHI_Counter_Terrorism_Cooperation_desc: "El terrorismo, el separatismo y el extremismo amenazan la estabilidad regional. Al establecer mecanismos conjuntos de lucha contra el terrorismo dentro de la OCS, podemos coordinar el intercambio de inteligencia y las operaciones de seguridad entre los Estados miembros."
 CHI_crewed_lunar_landing: "Alunizaje tripulado"
 CHI_crewed_lunar_landing_desc: "El programa de alunizaje tripulado de China se enfoca en la región del polo sur lunar, apuntando a un primer descenso alrededor de 2030. El perfil de la misión empareja el cohete de carga pesada Larga Marcha 10 con el vehículo tripulado Mengzhou y el módulo de alunizaje Lanyue, despegando por separado desde el Centro de Lanzamiento Espacial de Wenchang y realizando un acoplamiento en órbita lunar. El éxito convertiría a China en la segunda nación en llevar seres humanos a la Luna."
 CHI_cross_strait_military_posture: "Postura militar en el Estrecho"
 CHI_cross_strait_military_posture_desc: "Las fuerzas independentistas han consolidado el poder político en Taipéi, y no podemos permitir que ese cambio pase sin una respuesta. El Ejército Popular de Liberación debe intensificar su postura en el estrecho de Taiwán: ejercicios anfibios que crecen en frecuencia y escala, y salidas aéreas rutinarias hacia la zona de identificación de defensa de la isla. La reunificación no es una mera preferencia política. Es un objetivo nacional central, y la fuerza que lo respalda debe ser inconfundible."
 CHI_crossborder_ecommerce: "Comercio electrónico transfronterizo"
 CHI_crossborder_ecommerce_desc: "Nuestros fabricantes venden ahora directamente a los consumidores globales, eludiendo las cadenas de distribución tradicionales que las marcas extranjeras solían controlar. Los ciclos ultrarrápidos de SHEIN operan desde las fábricas de Panyu, en Cantón; Temu se convierte en la aplicación estadounidense más descargada a un año de su lanzamiento. Las exportaciones transfronterizas alcanzan los 400 000 millones de dólares; los gobiernos occidentales responden con restricciones a los umbrales de minimis. Los muros arancelarios que están reconstruyendo nos indican lo eficaces que se han vuelto nuestros exportadores."
 CHI_davos_boycott: "Boicot a Davos"
 CHI_davos_boycott_desc: "El Foro Económico Mundial representa la ideología del capital apátrida: un orden que subordina el desarrollo soberano a las preferencias de las finanzas multinacionales. Ya no enviaremos a nuestros más altos funcionarios a arrodillarse ante los banqueros en los centros turísticos de las montañas suizas. Nuestro camino es la autosuficiencia y el crecimiento dirigido por el Estado, no el Consenso de Washington vestido con nieve alpina."
 CHI_Debt_Trap_Diplomacy: "Diplomacia de la trampa de la deuda"
 CHI_Debt_Trap_Diplomacy_desc: "Conceder préstamos en condiciones que maximicen la influencia china sobre las naciones deudoras. Cuando no puedan pagar, extraer concesiones estratégicas en forma de acceso a puertos, derechos sobre recursos y alineamiento político."
 CHI_defence_industry_consolidation: "Consolidación de la industria de defensa"
 CHI_defence_industry_consolidation_desc: "AVIC, CSIC, NORINCO y los demás grandes conglomerados de nuestra base industrial de defensa son poderosos individualmente pero ineficientes en conjunto. Deberíamos someterlos a una supervisión más estricta de la SASAC, eliminar duplicidades, canalizar la inversión en investigación hacia programas prioritarios e imponer contratos de rendimiento a la dirección de las empresas. Deben ampliarse las instalaciones de producción dedicadas en Sichuan y Guangdong, y el astillero de Jiangnan merece una nueva inversión en diques sin demora."
 CHI_designated_succesor: "Sucesor designado"
 CHI_designated_succesor_desc: "El diseño de liderazgo colectivo de Deng Xiaoping incluía un mecanismo de sucesión ordenado: cada líder supremo cultivaría a un sucesor para evitar un mandato unipersonal indefinido. Ahora navegamos entre las expectativas de esa tradición y la lógica de nuestra propia consolidación. Un sucesor designado ofrece tranquilidad a las facciones recelosas de una autoridad personal sin control, y la facción Tuanpai extrae una concesión simbólica a cambio de su aquiescencia. Es un precio que vale la pena pagar por la estabilidad."
 CHI_Digital_Silk_Road: "Ruta de la Seda Digital"
 CHI_Digital_Silk_Road_desc: "Extender la infraestructura digital de China a las naciones en desarrollo a través de redes 5G, cables de fibra óptica y tecnología de ciudades inteligentes, creando una dependencia tecnológica duradera."
 CHI_Digital_Silk_Road_Initiative: "Iniciativa de la Ruta de la Seda Digital"
 CHI_Digital_Silk_Road_Initiative_desc: "Huawei y ZTE ya han construido redes 4G y 5G, cables submarinos y plataformas de vigilancia para ciudades inteligentes en más de 80 países. La Ruta de la Seda Digital crea profundas dependencias tecnológicas en los Estados socios y nos otorga un acceso preferencial a su infraestructura de telecomunicaciones. Deberíamos acelerar este programa antes de que la presión regulatoria occidental persuada a más gobiernos de excluir a nuestras empresas."
 CHI_digital_yuan_ecny: "El yuan digital"
 CHI_digital_yuan_ecny_desc: "El Banco Popular de China ha lanzado el proyecto de Pago Electrónico de Moneda Digital, distribuyendo el e-CNY a través de bancos comerciales en pruebas piloto en Shenzhen, Suzhou y Pekín. Doscientos sesenta millones de monederos electrónicos están ya activos. El proyecto mBridge pone a prueba la liquidación transfronteriza de monedas digitales de bancos centrales (CBDC) con Hong Kong, Tailandia y los Emiratos Árabes Unidos como alternativa a SWIFT. El yuan digital no es una mera herramienta de pago; es la infraestructura de un orden monetario que no depende de Washington."
 CHI_distant_water_fishing_strategy: "Estrategia de pesca en aguas distantes"
 CHI_distant_water_fishing_strategy_desc: "Nuestra flota pesquera de altura supera ya los 2500 buques que faenan en las zonas económicas exclusivas de Mauritania, Sierra Leona, Argentina y Perú, un programa que tiene sus raíces en la primera expedición de la Corporación Nacional de Pesca de China a aguas de África Occidental. La estrategia de «Salir al exterior» integra la pesca de altura como un brazo permanente de nuestra política de seguridad alimentaria. Los subsidios al combustible, los buques factoría con fabricadores de hielo y los acuerdos portuarios en Bata, Walvis Bay y Montevideo sostienen las operaciones, sirviendo el archipiélago de Zhoushan en Zhejiang como principal centro de procesamiento."
 CHI_ditiao_gang_crackdown: "Represión del acero ilegal"
 CHI_ditiao_gang_crackdown_desc: "Deben cerrarse más de 600 fundiciones de hornos de inducción no registradas, que producen un volumen estimado de 140 millones de toneladas anuales de acero «ditiao gang» de calidad inferior. El Ministerio de Industria y Tecnología de la Información ha convertido esto en el eje central de la reforma estructural de la oferta. Las estadísticas oficiales de producción aumentarán a medida que se absorba la producción en la sombra, mejorará la calidad del acero y se incrementarán los precios al eliminarse del mercado la oferta de baja calidad. Los comerciantes de barras de refuerzo que se beneficiaron de este caos ya han tenido su momento."
 CHI_document_nine: "Documento N.º 9"
 CHI_document_nine_desc: "Un comunicado clasificado del Partido titulado «Sobre el estado actual de la esfera ideológica» identifica siete amenazas ideológicas occidentales que deben suprimirse: la democracia constitucional, la sociedad civil, el neoliberalismo, la libertad de prensa, el nihilismo histórico, el cuestionamiento del socialismo y las dudas sobre la reforma del Partido. Se ordenan sesiones de estudio obligatorias en las universidades y los medios de comunicación estatales. Los límites del pensamiento aceptable se contraen de la noche a la mañana, y la lealtad se demuestra mediante el rechazo de los conceptos extranjeros."
 CHI_domestic_eda: "EDA y propiedad intelectual nacionales"
 CHI_domestic_eda_desc: "El software de automatización de diseño electrónico (EDA), las herramientas utilizadas para diseñar circuitos integrados, había sido suministrado casi exclusivamente por Cadence, Synopsys y Mentor Graphics. Después de que Estados Unidos incluyera las herramientas EDA en la lista de control de entidades, dirigimos la inversión hacia Empyrean Technology, Primarius y Xpeedic. La cobertura nacional de EDA ha alcanzado la capacidad de flujo completo para nodos maduros, aunque la cobertura de nodos avanzados para diseños inferiores a 5 nm sigue siendo parcial. Las licencias estatales de bloques de propiedad intelectual nacionales complementan el desarrollo de EDA, y debemos cerrar la brecha restante antes de que Washington note lo cerca que estamos."
 CHI_dragon_eye_over_lanzhou: "Ojo de Dragón sobre Lanzhou"
 CHI_dragon_eye_over_lanzhou_desc: "China construye su propio sistema Aegis. El destructor Tipo 052C, liderado por el Lanzhou comisionado en 2004, monta el radar de escaneo electrónico activo Tipo 346 «Ojo de Dragón» y el misil HHQ-9, dotando a un buque de guerra chino de una auténtica defensa aérea de zona de la flota por primera vez. La armada puede finalmente proteger sus propios cielos en alta mar."
 CHI_dual_credit_auto_export: "Sistema de doble crédito y mayor exportador del mundo"
 CHI_dual_credit_auto_export_desc: "La regulación de Doble Crédito asigna cuentas separadas de consumo de combustible y de créditos de VNE a cada fabricante de automóviles en nuestro mercado, creando un mecanismo de comercio de derechos de emisión para vehículos eléctricos que sustituye los subsidios directos por presión competitiva. Ahora exportamos más de 5 millones de vehículos al año, superando a Japón como el mayor exportador de automóviles del mundo. La Unión Europea impone aranceles de entre el 17 y el 37 por ciento por encima de la tasa base; los Estados Unidos gravan con un 100 por ciento a nuestros vehículos eléctricos. Ninguna barrera detendrá lo que el mercado ya ha decidido."
 CHI_eat_imperial_grain: "Comer del grano imperial"
 CHI_eat_imperial_grain_desc: "Un ejército que gestiona hoteles, contrabandea coches y comercia con armas es leal a su propio bolsillo, no al Partido. En julio de 1998, Jiang Zemin ordenó al EPL entregar su imperio comercial y vivir en su lugar del grano del Estado, únicamente de los presupuestos oficiales. Llevamos ese camino hasta el final: una fuerza profesional, pagada y limpia, que responde únicamente ante Pekín."
 CHI_ecommerce_infrastructure: "Infraestructura de comercio electrónico de China"
 CHI_ecommerce_infrastructure_desc: "Taobao derrotó a eBay China con anuncios gratuitos y mensajería integrada; posteriormente, Tmall extendió la plataforma a tiendas virtuales B2C de marca para minoristas internacionales. JD.com construyó su propia red de 1500 almacenes y una fuerza de reparto a tiempo completo que opera más rápido que cualquier servicio logístico que hayamos heredado. El comercio electrónico representa ya el 30 por ciento de nuestro comercio minorista, la cuota más alta de cualquier gran economía, y la infraestructura que lo hace posible es enteramente nuestra."
 CHI_Economic_Framework_for_Unity: "Marco económico para la unidad"
 CHI_Economic_Framework_for_Unity_desc: "Las dos Coreas y sus protectores entre las grandes potencias esbozan una hoja de ruta de integración económica. Las inversiones chinas en la infraestructura norcoreana, las transferencias tecnológicas surcoreanas y las garantías financieras estadounidenses constituyen los cimientos de una posible Corea unificada."
 CHI_Economic_Reintegration: "Reintegración económica"
 CHI_Economic_Reintegration_desc: "Comenzamos el largo proceso de integrar la economía de Corea del Norte en nuestra esfera industrial. Las inversiones fluyen hacia el norte; las materias primas y la mano de obra fluyen hacia el sur. La relación tributaria coreana, latente durante un siglo, queda efectivamente restaurada."
 CHI_Eight_Country_Initiative: "Iniciativa Pacífica de los Ocho Países"
 CHI_Eight_Country_Initiative_desc: "Un marco consolidado de seguridad y economía propuesto a ocho Estados de las islas del Pacífico nos otorgaría, con una sola firma, un acuerdo sobre redes de datos, control de la pesca y vigilancia policial a escala regional. La iniciativa pone a prueba si nuestro capital diplomático acumulado en el Pacífico puede convertirse en un acuerdo colectivo que rivalice con la arquitectura regional que Australia ha mantenido durante décadas. El éxito determina si lideramos el diseño institucional del Pacífico o simplemente participamos en él."
 CHI_eleventh_five_year_plan: "El Undécimo Plan Quinquenal"
 CHI_eleventh_five_year_plan_desc: "Nuestro próximo Plan Quinquenal debe fijar objetivos vinculantes: una reducción obligatoria del 20 por ciento en la intensidad energética por unidad de PIB, una reducción del 10 por ciento en las emisiones de los principales contaminantes y una mayor cuota de los servicios en el PIB. También deberíamos aumentar la inversión estatal en investigación y educación y acelerar la construcción de infraestructuras rurales. El crecimiento sin estas restricciones es un crecimiento que no podemos sostener."
 CHI_establish_defence_conglomerates: "Establecer los conglomerados de defensa"
 CHI_establish_defence_conglomerates_desc: "Fábricas dispersas y ministerios en disputa no pueden armar a una gran potencia. Reunimos al sector de la defensa en un puñado de vastos conglomerados estatales, cada uno de ellos un campeón nacional en su dominio, capaz de financiar la investigación, concentrar el talento y responder a las órdenes del ejército a gran escala."
 CHI_Eurasian_Land_Bridge: "Puente Terrestre Euroasiático completado"
 CHI_Eurasian_Land_Bridge_desc: "El servicio de mercancías Yiwu-Londres demostró que un corredor ferroviario terrestre ininterrumpido desde el este de China hasta Europa Occidental es comercialmente operativo. La plena integración euroasiática significa que nuestros fabricantes pueden llegar a los mercados europeos en dieciocho días, en lugar de los treinta y cinco que requiere la vía marítima. Debemos invertir ahora para aumentar la capacidad y la frecuencia hasta que la ruta rivalice en volumen con el transporte marítimo."
 CHI_Exercise_Paektu_Honor: "Ejercicio Honor de Paektu"
 CHI_Exercise_Paektu_Honor_desc: "Señalamos moderación mediante un ejercicio militar bilateral que enfatiza las posturas defensivas en el río Yalu. El mensaje a Washington es claro: podemos gestionar a Pionyang sin una respuesta de escalada estadounidense."
 CHI_Expand_Foreign_Service: "Expandir el Servicio Exterior"
 CHI_Expand_Foreign_Service_desc: "Debemos expandir rápidamente nuestra red consular y nuestro cuerpo diplomático. Ninguna otra nación en la Tierra ha logrado mantener más sedes diplomáticas en todo el mundo que nosotros, y deberíamos aprovechar aún más esa ventaja."
 CHI_export_processing_zones: "Zonas de procesamiento de exportaciones"
 CHI_export_processing_zones_desc: "Las zonas de procesamiento de exportaciones designadas en Jiangsu, Fujian y Zhejiang ofrecen almacenamiento aduanero, aduanas simplificadas y ventajas en los costes laborales que atraen operaciones de ensamblaje desde Corea, Taiwán y Japón. China se convierte en el nodo de ensamblaje final de las redes de producción de Asia Oriental."
 CHI_fabless_design_cluster: "Clúster de diseño sin fábrica"
 CHI_fabless_design_cluster_desc: "Nuestra industria de diseño de semiconductores se ha consolidado en torno a Shenzhen y Shanghái. Los subsidios estatales han atraído a cientos de empresas emergentes al diseño de chips para electrónica de consumo, comunicaciones y aceleradores de IA. La proximidad de Shenzhen al ensamblaje de placas de circuito impreso (PCB), la fabricación por contrato y las cadenas de suministro de electrónica de consumo la convierten en el centro natural; el clúster de diseño de la ciudad ha producido a Himax, Rockchip, Allwinner y a decenas de firmas de diseño más pequeñas, muchas de ellas respaldadas por instrumentos provinciales del Gran Fondo. La profundidad de este ecosistema es nuestra ventaja estructural."
 CHI_factional_balance: "Equilibrio de facciones"
 CHI_faw_changchun_automotive: "Expansión de FAW Changchun"
 CHI_faw_changchun_automotive_desc: "First Automobile Works, con sede en Changchun, es nuestro fabricante de automóviles más antiguo y la base sobre la que se construyó el resto de nuestro sector de automoción. Deberíamos ampliar su cartera de empresas conjuntas con Volkswagen y Toyota, al tiempo que canalizamos la inversión estatal hacia el desarrollo de marcas propias. La provincia de Jilin se convertirá en el pilar de nuestra industria de automoción nacional."
 CHI_fifty_vanke_handover: "La entrega de los cincuenta Vanke"
 CHI_fifty_vanke_handover_desc: "Para diciembre de 1998, miles de empresas gestionadas por las fuerzas militares fueron tasadas, registradas y transferidas a manos civiles. Ramas inmobiliarias que valían una fortuna, el equivalente a cincuenta promotoras del tamaño de Vanke, abandonan los libros de cuentas del ejército para siempre. Los generales pierden sus feudos y el Partido gana una espada más limpia."
 CHI_Five_Stars_Highway: "Corredor de autopistas de los cinco países"
 CHI_Five_Stars_Highway_desc: "Un corredor de carreteras transcontinental que une los puertos atlánticos brasileños con las terminales pacíficas peruanas atraviesa cinco países y acorta el tránsito terrestre en semanas. El proyecto es el buque insignia de nuestra ambición logística en Sudamérica, duplicando la lógica económica del Canal de Panamá a escala continental. Nuestras empresas de construcción e instituciones financieras asumirán la carga del desarrollo, y la gratitud de cinco naciones nos acompañará."
 CHI_flying_leopard_doctrine: "La doctrina del Leopardo Volador"
 CHI_flying_leopard_doctrine_desc: "La flota aprende a golpear desde el aire antes de poseer un portaaviones. Los cazabombarderos JH-7 «Leopardo Volador» basados en tierra, armados con misiles antibuque, convierten a la aviación naval en un brazo de ataque independiente capaz de llegar mucho más allá de la costa y hundir una fuerza de tarea enemiga desde la orilla."
 CHI_Forum_China_CELAC: "Foro de Cooperación China-CELAC"
 CHI_Forum_China_CELAC_desc: "La Comunidad de Estados Latinoamericanos y Caribeños nos proporciona un canal multilateral que elude a la Organización de los Estados Americanos, la cual Washington ha dominado durante mucho tiempo. Un foro ministerial estructurado en torno a las infraestructuras, el comercio y la inversión agrícola nos otorga un instrumento para erosionar la primacía institucional de los Estados Unidos en su propio hemisferio. Debemos tratar este marco como una inversión a largo plazo, no como un gesto aislado."
 CHI_four_trillion_stimulus: "Estímulo de cuatro billones de yuanes"
 CHI_four_trillion_stimulus_desc: "Un paquete de estímulo de 4 billones de yuanes, equivalente al 12 por ciento del PIB, se destina principalmente a ferrocarriles, autopistas, aeropuertos y vivienda social. Los gobiernos locales se endeudan a través de Instrumentos de Financiación de Gobiernos Locales para cofinanciar su parte del programa. China State Construction y China Communications Construction se expanden rápidamente gracias a los contratos resultantes. Evitamos la recesión mientras el resto del mundo se contrae, pero el estímulo genera un exceso de deuda en las finanzas de los gobiernos locales y acelera la formación de una burbuja inmobiliaria en ciudades como Ordos y Changzhou. Los costes son reales y terminarán llegando."
 CHI_FTA_2015: "Acuerdo de Libre Comercio China-Corea del Sur"
 CHI_FTA_2015_desc: "Nuestro acuerdo de libre comercio con Corea del Sur está ya plenamente implementado. Las reducciones arancelarias, los corredores logísticos conjuntos y la expansión del comercio agrícola y electrónico profundizan la interdependencia bilateral y otorgan a Seúl un interés material en mantener relaciones estables con nosotros. Una Corea vinculada económicamente es menos propensa a seguir el liderazgo de Washington cuando ambos intereses entran en conflicto."
 CHI_game_licensing_regs: "Regulaciones de licencias de videojuegos"
 CHI_game_licensing_regs_desc: "La NPPA limita el acceso a los videojuegos para menores a tres horas por semana, exigiendo la aplicación de sistemas de reconocimiento facial. Un editorial de Xinhua describe los videojuegos como opio espiritual, borrando un 10 por ciento del precio de las acciones de Tencent en una sola sesión. Los nuevos títulos requieren una licencia banhao, con preferencia para los temas patrióticos. Las aprobaciones se reanudan a medida que los estudios pivotan hacia los mercados extranjeros, exportando un producto que la regulación ha vuelto ideológicamente fiable."
 CHI_geely_volvo_acquisition: "Adquisición de Volvo por Geely"
 CHI_geely_volvo_acquisition_desc: "La adquisición de Volvo Cars a Ford por parte de Li Shufu por 1800 millones de dólares estableció un modelo para las adquisiciones chinas en el extranjero, enfocadas en la marca, la propiedad intelectual y las redes de distribución en lugar de en las fábricas. Posteriormente, Geely adquiere la London Taxi Company, una participación del 49.9 por ciento en Proton, el 51 por ciento de Lotus y el 9.7 por ciento de Daimler AG. Cada adquisición no es una mera transacción comercial, sino una declaración de que las empresas chinas pueden poseer las cosas que antes solo ensamblaban."
 CHI_Geneva_Carve_Out: "Marco bilateral de Ginebra"
 CHI_Geneva_Carve_Out_desc: "La tradición de neutralidad comercial de Suiza la convierte en un punto de entrada natural para nuestro capital que busca acceder al mercado europeo eludiendo el escrutinio regulatorio de la Unión Europea. Un acuerdo bilateral de libre comercio y una serie de memorandos sobre el mercado financiero otorgan a nuestros bancos y fondos soberanos una posición en Ginebra que opera bajo una supervisión más laxa que cualquier jurisdicción comparable de la UE. Berna obtiene ingresos por comisiones y volumen de transacciones, mientras que nosotros ganamos una dirección financiera occidental creíble."
 CHI_Global_Ambitions: "Ambiciones globales"
 CHI_Global_Ambitions_desc: "Estamos listos para definir nuestro papel en el escenario mundial. La cuestión no es si seremos una gran potencia, sino qué tipo de gran potencia elegimos ser."
 CHI_gobi_solar_offshore_wind: "Cinturón Solar del Gobi y bases eólicas marinas"
 CHI_gobi_solar_offshore_wind_desc: "Nuestra Ley de Energías Renovables y las tarifas de alimentación de la NDRC han construido el marco político que impulsa el colapso de los costes solares. LONGi Green Energy, JinkoSolar, Trina Solar y JA Solar han reducido los costes de los paneles por debajo de los 0.10 dólares por vatio. La producción de polisilicio en Sinkiang y Sichuan abastece ahora a más del 80 por ciento de la demanda mundial. La Gran Muralla Solar de Kubuqi en Mongolia Interior, el Parque Solar del Desierto de Tengger en Ningxia y la Base Eólica-Solar de Hami en Sinkiang son instalaciones a escala de gigavatios; la energía eólica marina se está expandiendo en Yangjiang, Putian y Yancheng. El compromiso de doble carbono ancla el programa de forma permanente."
 CHI_governance_moderenisation: "Modernización de la gobernanza"
 CHI_governance_moderenisation_desc: "Los sistemas de crédito social, la infraestructura de identidad digital y las redes de vigilancia integradas deben unificarse bajo un marco único que rastree el cumplimiento de las normas, recompense la cooperación y alerte sobre la disidencia. Las tecnologías de ciudades inteligentes proporcionan una monitorización en tiempo real de los movimientos y comunicaciones urbanas a una escala que ninguna administración anterior podría haber gestionado. La gobernanza digital es la administración hecha legible: una población visible para nosotros a todos los niveles y, por lo tanto, gobernable acorde a ello."
 CHI_grain_for_green_program: "Programa de grano por verde"
 CHI_grain_for_green_program_desc: "Las catastróficas inundaciones del Yangtsé emitieron un veredicto geológico sobre décadas de deforestación en la meseta de Loes: 4150 muertos, 21 millones de hectáreas inundadas y un sistema fluvial incapaz de absorber su propia cuenca hidrográfica. El programa «Grano por verde» reconvierte las laderas con pendientes superiores a 25 grados de nuevo en bosques o pastizales, sustituyendo los ingresos agrícolas perdidos por pagos en grano y efectivo. Cubrimos 32 millones de hectáreas; la agricultura consolidada en terrenos llanos productivos aumenta los rendimientos por hectárea en las zonas restauradas. La restauración y la productividad no son opuestas."
 CHI_great_wall_suv_dominance: "Dominio de los todoterrenos Haval de Great Wall"
 CHI_great_wall_suv_dominance_desc: "Wei Jianjun convirtió a Great Wall Motors en nuestro campeón de los todoterrenos desde una fábrica en Baoding de la que los fabricantes mundiales apenas se percataron. El Haval H6 se convirtió en el todoterreno más vendido en China durante cuatro años consecutivos; Haval pasó a ser una marca independiente, seguida de WEY, Ora, Tank y Poer. Great Wall opera ahora plantas de ensamblaje en Rusia, Tailandia y Brasil, apuntando a segmentos que los fabricantes occidentales habían subestimado sistemáticamente y dejado sin competir."
 CHI_guatian_reckoning: "El ajuste de cuentas"
 CHI_guatian_reckoning_desc: "El soborno no puede quedarse enterrado para siempre. Los magnates de la logística que vendieron terrenos militares y almacenaron cajas de licor y oro se enfrentan a su día de ajuste de cuentas, y la camarilla debe elegir si entrega a unos pocos chivos expiatorios o cierra filas y desafía a Pekín."
 CHI_Gulf_Yuan_Settlement: "Mecanismo de liquidación del yuan en el Golfo"
 CHI_Gulf_Yuan_Settlement_desc: "Los Estados del Consejo de Cooperación del Golfo comienzan a cotizar una parte significativa de sus exportaciones de petróleo crudo en renminbi, canalizándolas a través del Sistema de Pago Interbancario Cross-Border en lugar de SWIFT. Combinado con las líneas de intercambio de los bancos centrales y las asignaciones en RMB de los fondos soberanos, el cambio erosiona progresivamente la ventaja estructural del petrodólar. Los Estados Unidos pierden una palanca de coacción financiera que ejercían desde 1974."
 CHI_h20_programme: "El programa H-20"
 CHI_h20_programme_desc: "La última brecha en el arsenal de gran potencia es un bombardero furtivo, y nos propusimos cerrarla. El H-20, un diseño de ala volante que se dice que es capaz de transportar diez toneladas de armamento a unos ocho mil kilómetros sin repostar, permitiría a China golpear a través del Pacífico desde su propio espacio aéreo. Con él, la rama de bombarderos de una auténtica tríada global está completa."
 CHI_h6k_revival: "El renacimiento del H-6K"
 CHI_h6k_revival_desc: "La antigua copia del Tu-16 renace. El H-6K cambia su bodega de bombas por pilones de misiles de crucero e incorpora turbofanes eficientes para lograr un alcance mucho mayor, convirtiéndose en una plataforma de ataque a distancia que lanza misiles contra objetivos terrestres desde más allá de las defensas enemigas. Unos ciento diez forman ahora el núcleo de la fuerza de bombarderos."
 CHI_harbin_equipment_manufacturing: "Base de equipos pesados de Harbin"
 CHI_harbin_equipment_manufacturing_desc: "El legado de la industria pesada de la era soviética de Harbin se moderniza y se redirige hacia equipos de generación de energía, componentes ferroviarios y maquinaria industrial. La ciudad se convierte en la columna vertebral de ingeniería de la expansión de infraestructura de China."
 CHI_Health_Silk_Road: "Ruta de la Seda de la Salud"
 CHI_Health_Silk_Road_desc: "La Ruta de la Seda de la Salud extiende nuestra asistencia médica, construcción de hospitales y cadenas de suministro farmacéutico a los Estados socios de la Franja y la Ruta. El marco ganó prominencia durante la pandemia de Covid-19, cuando nuestra diplomacia de vacunas reforzó nuestra posición como socio de desarrollo sanitario para el Sur Global. Ahora deberíamos formalizarlo y ampliarlo para que la dependencia de las instituciones farmacéuticas occidentales deje de ser la opción por defecto."
 CHI_heavy_combined_arms_brigade: "Brigadas pesadas de armas combinadas"
 CHI_heavy_combined_arms_brigade_desc: "Los tanques solos mueren rápido. Agrupamos al Tipo 99 con infantería mecanizada sobre orugas, piezas de artillería autopropulsada e ingenieros en brigadas pesadas de armas combinadas, formaciones de choque autosuficientes creadas para romper una línea fortificada y mantenerse en movimiento."
 CHI_hebei_steel_group: "Grupo de Hierro y Acero de Hebei"
 CHI_hebei_steel_group_desc: "La provincia de Hebei ha consolidado a Tangshan Iron and Steel, Handan Iron and Steel y fundiciones más pequeñas en Hebei Iron and Steel Group, formando lo que se convertirá en HBIS. Fusiones paralelas han creado Anshan-Benxi en Liaoning y Shandong Steel Group en el mismo periodo. El Duodécimo Plan Quinquenal eleva la consolidación a política nacional, fijando el objetivo de que los diez principales productores controlen el 60 por ciento de la producción. La era de las mil pequeñas fundiciones que competían con márgenes estrechos debe terminar."
 CHI_henan_grain_modernization: "Modernización agrícola de Henan"
 CHI_henan_grain_modernization_desc: "La provincia de Henan alimenta a más personas que cualquier país de Europa. La inversión en infraestructura de almacenamiento, capacidad de procesamiento y servicios de extensión agrícola aumenta los rendimientos y reduce las pérdidas postcosecha, fortaleciendo la seguridad alimentaria nacional y liberando mano de obra rural para su redistribución industrial."
 CHI_high_speed_rail_one: "Primera fase de la alta velocidad ferroviaria"
 CHI_high_speed_rail_one_desc: "Nuestras primeras líneas dedicadas de alta velocidad se están inaugurando en rápida sucesión: Pekín-Tianjín, luego Wuhan-Cantón y después el ambicioso corredor Pekín-Shanghái, que será la línea de alta velocidad más larga del mundo. El programa se nutre de la tecnología CRH licenciada por fabricantes europeos y japoneses, que nuestros ingenieros están adaptando a las condiciones chinas. Lo que comienza como conocimiento prestado se convertirá en propio."
 CHI_hisilicon_kirin: "Plataforma móvil HiSilicon Kirin"
 CHI_hisilicon_kirin_desc: "La filial de semiconductores de Huawei, HiSilicon, creó la serie de SoC Kirin para terminales Huawei, introduciendo una NPU integrada en el chip antes que cualquier competidor occidental y alcanzando la producción de 7 nm en TSMC. Después de que los controles de exportación de EE. UU. cortaran ese suministro, Huawei trabajó con SMIC para fabricar el Kirin 9000S en un nodo de proceso alcanzable a nivel nacional. El programa demostró que una firma de diseño sin fábrica china podía alcanzar el nivel de rendimiento de Apple y Qualcomm, y proporcionó un modelo que todos los desarrolladores nacionales de SoC están siguiendo ahora."
 CHI_Honiara_Security_Pact: "Acuerdo de Seguridad de Honiara"
 CHI_Honiara_Security_Pact_desc: "El marco de seguridad con las Islas Salomón permite a la Armada del Ejército Popular de Liberación atracar, reabastecerse y realizar operaciones desde Honiara, a menos de 2000 kilómetros del territorio continental australiano. Canberra reacciona con alarma, acelerando los plazos de AUKUS y presionando a Washington para aumentar la postura de disuasión en el Pacífico. El pacto nos otorga nuestra primera presencia de seguridad reconocida al este de la primera cadena de islas, y deberíamos asegurarla antes de que se presione a Honiara para dar marcha atrás."
 CHI_hq17_medium_range_air_defense: "Defensa por capas de alcance medio"
 CHI_hq17_medium_range_air_defense_desc: "Por encima de la capa de defensa de punto añadimos cobertura de alcance medio, entrelazando misiles de alcance corto y de mayor alcance en un único escudo en red para que ningún vector de aproximación quede abierto entre las copas de los árboles y la estratosfera."
 CHI_hq17_short_range_sam: "SAM de corto alcance HQ-17"
 CHI_hq17_short_range_sam_desc: "Las brigadas necesitan su propio paraguas de protección. El HQ-17, desarrollado a partir del Tor ruso, proporciona una defensa de punto de reacción rápida contra aeronaves, drones y municiones de precisión, montado sobre orugas para mantener el ritmo del blindaje al que protege."
 CHI_hu_jintao_reign: "La era de Hu Jintao"
 CHI_hu_jintao_reign_desc: "La asunción por parte de Hu Jintao de los cargos de secretario general, presidente y presidente de la Comisión Militar Central marca la transición de liderazgo más ordenada en la historia de nuestra república. Su administración enfatizará la gobernanza institucional y la toma de decisiones colectiva por encima de la autoridad personal, acercando nuestro sistema al tipo de sucesión regular que requieren los Estados estables."
 CHI_hua_hong_mature_node: "Capacidad de nodos maduros de Hua Hong"
 CHI_hua_hong_mature_node_desc: "Hua Hong Semiconductor, originalmente una empresa conjunta sino-francesa en Jinqiao, se reorientó hacia la producción especializada de nodos maduros: gestión de energía, memoria integrada no volátil y chips analógicos para los mercados automotriz e IoT. Sus fábricas de 200 mm y 300 mm en Shanghái y Wuxi abastecieron a cadenas de suministro nacionales que las sanciones occidentales no podían alcanzar fácilmente. La reinversión estatal amplió la capacidad y diversificó su base de clientes más allá del mercado de exportación."
 CHI_hualong_nuclear_batch: "Construcción en masa del Hualong unificado"
 CHI_hualong_nuclear_batch_desc: "Tras importar reactores Westinghouse AP1000 a Sanmen y Haiyang, reactores Framatome EPR a Taishan y unidades Rosatom VVER a Tianwan, hemos completado nuestro propio diseño de tercera generación. El Hualong unificado, una fusión del ACP-1000 de CNNC y el ACPR-1000 de CGN, posee plena propiedad intelectual china y cumple con los Requisitos de las Empresas de Servicios Públicos Europeas. La Unidad 5 de Fuqing se conecta primero a la red; la Base Nuclear de Zhangzhou, Changjiang en Hainan, Fangchenggang y Taipingling le siguen. La versión de exportación, HPR1000, entra en servicio en Karachi K-2 y K-3, y esto es solo el comienzo de nuestro programa de exportación nuclear."
 CHI_huawei_zte_export: "Exportaciones de equipos de Huawei"
 CHI_huawei_zte_export_desc: "Huawei y ZTE capturan más del 35 por ciento del mercado mundial de equipos de telecomunicaciones, con la ventaja del Código Polar de Huawei en los estándares 5G apuntalando su dominio. A través de la Ruta de la Seda Digital, nuestra infraestructura llega a operadores de 170 países. Los gobiernos occidentales responden con prohibiciones y restricciones en las listas de entidades, pero la infraestructura física que ya hemos instalado no puede ser eliminada mediante legislación."
 CHI_huludao_schoolhouse: "La escuela de Huludao"
 CHI_huludao_schoolhouse_desc: "Los portaaviones son inútiles sin pilotos que puedan aterrizar en ellos. En Huludao, la Universidad de Aviación Naval crea una vía dedicada a la formación de pilotos de portaaviones, completada con una rampa de salto de esquí y un tren de parada basados en tierra, entrenando desde cero a los aviadores que harán de una cubierta en movimiento un lugar desde el que luchar."
 CHI_hybrid_rice_super_program: "Programa de arroz superhíbrido"
 CHI_hybrid_rice_super_program_desc: "El Centro Nacional de Investigación y Desarrollo de Arroz Híbrido de China de Yuan Longping en Changsha persigue sucesivos hitos de rendimiento, trasladando cada invierno a su equipo de mejoramiento a Sanya, en la isla de Hainan, donde el clima tropical permite un cultivo continuo durante todo el año imposible en el continente. Las variedades híbridas ya cubren el 60 por ciento de nuestra superficie arrocera, y un programa paralelo investiga ahora arroz marino tolerante a la sal para la llanura del norte de China. Debemos mantener esta inversión: la seguridad alimentaria es la base sobre la que descansan todas las demás ambiciones."
 CHI_hydrogen_green_steel: "Fabricación de acero basada en hidrógeno"
 CHI_hydrogen_green_steel_desc: "Nuestros objetivos de doble carbono y el Mecanismo de Ajuste en Frontera por Carbono de la UE presionan a nuestros siderúrgicos para que se descarbonicen antes de que los aranceles extranjeros tomen la decisión por ellos. Baowu ha puesto en marcha una planta de demostración de reducción directa basada en hidrógeno de un millón de toneladas en Zhanjiang, en asociación con Rio Tinto. HBIS está lanzando un proyecto similar en Zhangjiakou utilizando hidrógeno verde procedente de electrólisis. Debemos aumentar sustancialmente la cuota de hornos de arco eléctrico en nuestra producción durante la próxima década, y la planificación de esa transición comienza ahora."
 CHI_hypersonic_strike_integration: "Integración de ataque hipersónico"
 CHI_hypersonic_strike_integration_desc: "La velocidad se convierte en el nuevo sigilo. Integramos armas hipersónicas, que se deslizan a más de cinco veces la velocidad del sonido y maniobran durante todo el descenso, en el paquete de ataque de la fuerza aérea, presentando a las defensas enemigas una amenaza que no tienen medios probados para detener."
 CHI_ilrs_lunar_base: "Estación Internacional de Investigación Lunar"
 CHI_ilrs_lunar_base_desc: "China y Rusia firmaron la hoja de ruta para la Estación Internacional de Investigación Lunar en 2021, invitando a las naciones socias a construir un puesto avanzado de investigación operado conjuntamente cerca del polo sur lunar. El programa prioriza la utilización de recursos in situ, una infraestructura de superficie permanente y un esquema de rotación tripulada comparable al modelo de la estación de investigación de la Antártida. Comprometemos nuestra base industrial y de ingeniería para hacer de esto una realidad."
 CHI_individual_soldier_system: "El sistema de soldado individual"
 CHI_individual_soldier_system_desc: "El fusilero se convierte en un nodo, no solo en un gatillo. Un nuevo sistema de soldado agrupa óptica, radio, navegación y chaleco antibalas en un solo equipo, vinculando a cada soldado de infantería a la red de la escuadra y al mapa del comandante."
 CHI_Indo_Pacific_Strategy_Collapsed: "Colapso de la Estrategia Indo-Pacífica"
 CHI_Indo_Pacific_Strategy_Collapsed_desc: "La retirada de Corea del Sur del marco trilateral EE. UU.-Japón-Corea del Sur corta un eslabón crítico en la cadena de Washington en el Indo-Pacífico. Japón se queda solo para gestionar sus ansiedades de seguridad, y la credibilidad estadounidense en toda la región se ve sacudida."
 CHI_Information_Warfare: "Guerra de la información"
 CHI_Information_Warfare_desc: "Desplegar los medios estatales, operaciones en redes sociales y narrativas estratégicas para moldear la opinión pública en los países objetivo y contrarrestar el dominio de la información occidental."
 CHI_informatized_local_wars: "Ganar guerras locales informatizadas"
 CHI_informatized_local_wars_desc: "Ya no nos preparamos para una guerra total en la llanura del norte. La doctrina rectora pasa a ser ganar guerras locales bajo condiciones informatizadas: campañas cortas, contundentes y de alta tecnología en la periferia de China, decididas por quién ve y golpea primero en un campo de batalla en red. Cada reforma posterior sirve ahora a esta única demanda."
 CHI_inner_party_supervision_regulations: "Regulaciones de supervisión interna del Partido"
 CHI_inner_party_supervision_regulations_desc: "Nuestra rendición de cuentas interna del partido ha dependido durante demasiado tiempo de normas informales y conexiones personales. Debemos adoptar regulaciones de supervisión formales que establezcan procedimientos obligatorios para que los órganos superiores inspeccionen, informen y sancionen a los comités del partido subordinados. Codificar estos mecanismos reducirá el espacio para que los funcionarios locales operen como feudos intocables."
 CHI_integrated_air_and_space: "Espacio y aire integrados"
 CHI_integrated_air_and_space_desc: "La fuerza aérea debe dejar de ser el paraguas del ejército de tierra y convertirse en un servicio estratégico por derecho propio. Perseguimos las «operaciones integradas aéreas y espaciales, preparadas tanto para la ofensiva como para la defensiva», la doctrina adoptada en 2004 que vincula cazas, bombarderos, misiles, satélites y alerta temprana en un único alcance. El cielo y el espacio cercano se convierten en un solo teatro de operaciones, y debe ser nuestro."
 CHI_intra_party_democracy_experiments: "Experimentos de democracia interna del Partido"
 CHI_intra_party_democracy_experiments_desc: "Varias localidades han llevado a cabo elecciones competitivas con múltiples candidatos para puestos del partido a nivel de condado y municipio. Los partidarios argumentan que la selección competitiva reforzará la legitimidad y mejorará la gobernanza; los críticos advierten que las elecciones disputadas erosionarán la disciplina ideológica y crearán rivalidades entre facciones. El resultado de estos experimentos determinará si ampliamos o suprimimos el modelo."
 CHI_invigorate_country_through_STE: "Fortalecer el país mediante la ciencia y la educación"
 CHI_invigorate_country_through_STE_desc: "In 1995, Jiang Zemin impulsó la estrategia de rejuvenecer la nación a través de la ciencia y la educación. Al priorizar la inversión en investigación, la equiparación tecnológica y la educación superior, el plan tiene como objetivo cerrar la brecha con el mundo desarrollado y transformar a China de una economía basada en la mano de obra a una construida sobre el conocimiento."
 CHI_iron_ore_pricing_war: "La batalla por el precio del mineral de hierro"
 CHI_iron_ore_pricing_war_desc: "Baosteel ha tomado el relevo de Nippon Steel como negociador principal de los compradores chinos en las conversaciones anuales de referencia sobre el mineral de hierro con Rio Tinto, BHP Billiton y Vale. El sistema colapsa cuando las compras al contado de las fundiciones chinas más pequeñas socavan los precios de referencia. El arresto del ejecutivo de Rio Tinto, Stern Hu, en Shanghái y el fracaso de la oferta de Chinalco por una participación del 18 por ciento en Rio Tinto marcan el punto álgido de las fricciones diplomáticas, y debemos responder acelerando la inversión minera en el extranjero, concretamente en Australia y África Occidental, para diversificar nuestro suministro."
 CHI_j10c_multirole_refit: "La modernización del J-10C"
 CHI_j10c_multirole_refit_desc: "El J-10 muestra sus garras. El J-10C incorpora un radar AESA, el misil de largo alcance PL-15 y, a partir de 2021, un motor nacional WS-10B, convirtiendo al caza ligero en una auténtica amenaza multimisión que ya ha entrado en combate en los cielos del sur de Asia."
 CHI_j11b_sinification: "Nacionalizar el J-11"
 CHI_j11b_sinification_desc: "El Su-27 construido bajo licencia en Shenyang se convierte en un avión puramente chino. El J-11B sustituye el radar, la aviónica y los misiles rusos por sistemas nacionales, liberando a la línea Flanker de los repuestos de Moscú y demostrando que la industria china puede rediseñar un caza de primera línea de principio a fin."
 CHI_j16_strike_platform: "La plataforma de ataque J-16"
 CHI_j16_strike_platform_desc: "El J-16 «Qianlong», un caza pesado biplaza derivado del Flanker, cuenta con un radar AESA, la mayor capacidad de carga de armas de la flota y un gran radio de acción. Convertido ahora en el avión predilecto de China para presionar el espacio aéreo de Taiwán, es la plataforma de ataque polivalente en torno a la cual se construye el ala aérea moderna."
 CHI_jh7a_update: "La actualización del JH-7A"
 CHI_jh7a_update_desc: "El JH-7A «Leopardo Volador», un robusto cazabombardero biplaza, es actualizado con nuevas armas de precisión y contenedores de designación de objetivos, manteniendo la relevancia de un avión de ataque marítimo barato y probado junto a la flota más nueva."
 CHI_jiang_doctrine_taiwan: "La doctrina Jiang sobre Taiwán"
 CHI_jiang_doctrine_taiwan_desc: "La propuesta de ocho puntos de Jiang enmarca la política a través del Estrecho en torno a una reunificación pacífica, al tiempo que se niega explícitamente a descartar el uso de la fuerza. Integrar esta doctrina con el creciente arsenal de denegación de acceso del EPL nos proporciona un marco coercitivo creíble y eleva el coste de la independencia de jure de Taiwán a un nivel que ningún gobierno en Taipéi puede permitirse pagar políticamente."
 CHI_jiangnan_changxing_move: "El traslado a Jiangnan-Changxing"
 CHI_jiangnan_changxing_move_desc: "Apremiado en el corazón del viejo Shanghái, el histórico astillero de Jiangnan no puede crecer. Lo trasladamos río abajo, a la isla de Changxing, a nuevos y vastos pabellones y muelles de aguas profundas construidos para fabricar buques de guerra por docenas. El traslado multiplica nuestra capacidad de construcción de golpe y se convierte en la forja de la flota moderna."
 CHI_jiangnan_scale: "Ampliar el astillero de Jiangnan"
 CHI_jiangnan_scale_desc: "Los buques de guerra se ganan en la grada de construcción antes de ganarse en el mar. Las vastas e inéditas instalaciones del astillero de Jiangnan en la isla de Changxing se llevan a pleno rendimiento, fabricando destructores y portaaviones en paralelo allí donde sus rivales los construyen de uno en uno."
 CHI_joint_operations_command: "Mando de Operaciones Conjuntas"
 CHI_joint_operations_command_desc: "La victoria pertenece ahora a quien fusione las fuerzas terrestres, marítimas, aéreas y de misiles en un solo puño. Establecemos un auténtico mando de operaciones conjuntas, conectando los cinco teatros de operaciones en una sola imagen para que la batalla sea librada por la totalidad de las fuerzas armadas a la vez, y no por servicios que se van turnando. Esto desbloquea la estructura de mando por teatro de operaciones."
 CHI_Joint_Operations_tt: "Desencadena un evento de elección estratégica. La opción defensiva forma o extiende la facción de la OCS con Afganistán, Pakistán y Tayikistán. Las opciones punitiva y de guerra total crean, en su lugar, objetivos de guerra contra los talibanes y el TTP a través de la respuesta de Pakistán."
 CHI_joint_stock_city_banks: "Bancos comerciales por acciones y bancos urbanos"
 CHI_joint_stock_city_banks_desc: "Por debajo de los Cuatro Grandes, se ha desarrollado un sólido segundo nivel. El Banco de Comerciantes de China se ha convertido en el líder de la banca minorista con una fuerte banca móvil; el Banco Minsheng de China, el primer banco no estatal, atiende a pequeñas y medianas empresas; el HSBC posee una participación del 19.9 por ciento en el Banco de Comunicaciones. Más de 130 bancos comerciales urbanos anclan la financiación regional en ciudades de segundo y tercer nivel, impulsando un acceso al crédito más amplio para las empresas privadas y una adopción más rápida de los servicios de banca digital. Esta diversidad de instituciones es una fortaleza que debemos cultivar."
 CHI_joint_venture_framework: "Marco industrial de empresas conjuntas"
 CHI_joint_venture_framework_desc: "Un marco integral regula la transferencia de tecnología, los requisitos de contenido local y la repatriación de beneficios en las empresas conjuntas. Las empresas extranjeras obtienen acceso al mercado; los socios chinos obtienen tecnología y conocimientos de gestión que fluyen gradualmente hacia las empresas nacionales."
 CHI_keep_the_shell_companies: "Mantener las empresas pantalla"
 CHI_keep_the_shell_companies_desc: "Obligados a desinvertir, desinvertimos solo sobre el papel. Las empresas de las fuerzas militares se vuelven a registrar bajo nombres de primos, testaferros y empresas pantalla, y sus beneficios siguen fluyendo hacia las unidades propietarias. Los auditores encuentran oficinas vacías; los generales conservan sus ingresos."
 CHI_kj2000_mainring_awacs: "El KJ-2000 Mainring"
 CHI_kj2000_mainring_awacs_desc: "Después de que Washington bloqueara la venta del Phalcon israelí, China construyó el suyo propio. El KJ-2000, un radar de escaneo electrónico activo nacional montado en un Il-76, dota a la fuerza aérea de su primer puesto de mando aéreo real, permitiendo a los cazas atacar objetivos que aún no podían ver por sí mismos."
 CHI_kj500_network_centric_hub: "El centro de red KJ-500"
 CHI_kj500_network_centric_hub_desc: "El KJ-500, un radar fijo de tres antenas sobre un turbohélice Y-9, es el caballo de batalla que sirve de ojo en el cielo. Producido en masa, enlaza por datos a cazas, barcos y misiles en una sola imagen, siendo el centro volante de la guerra de redes integradas."
 CHI_KPA_Offensive_Readiness: "Preparación ofensiva del EPC"
 CHI_KPA_Offensive_Readiness_desc: "Respaldamos discretamente un cambio en la postura del Ejército Popular de Corea, pasando de una defensa en profundidad a una preparación ofensiva avanzada. Las transferencias de equipo se aceleran y se amplían las sesiones de planificación conjunta. La península se acerca más al abismo."
 CHI_leader_of_the_people: "Renmin Lingxiu"
 CHI_leader_of_the_people_desc: "La Tercera Resolución Histórica del Comunista formaliza el título Renmin Lingxiu, 'Líder del Pueblo', una designación aplicada a solo dos figuras en la historia del Partido: Mao Zedong y Xi Jinping. El retrato de Mao sigue colgado sobre la Puerta de Tiananmen. El tercer momento histórico del Partido ha encontrado a su figura histórica, y el significado de esa continuidad no pasa desapercibido para nadie que lea la resolución con atención."
 CHI_leading_small_group_doctrine: "Grupos líderes centrales"
 CHI_leading_small_group_doctrine_desc: "Los grupos líderes pequeños centrales supervisan ahora simultáneamente las finanzas, la reforma económica, los asuntos exteriores, la ciberseguridad y la reforma militar, todo ello presidido desde una única oficina. Este acuerdo elude la estructura tradicional de comités del Politburó y concentra la toma de decisiones donde puede avanzar sin demora. Los tecnócratas ejecutan; el centro coordina. La política se mueve más rápido y cada resultado se subordina a una sola voluntad."
 CHI_Let_Seoul_Lead: "Dejar que Seúl lidere"
 CHI_Let_Seoul_Lead_desc: "Señalamos nuestra aceptación del liderazgo surcoreano en cualquier eventual proceso de unificación. Las instituciones democráticas y el peso económico de Seúl lo convierten en el anclaje natural de una Corea unificada. Damos un paso atrás para dejar que los coreanos determinen su propio futuro."
 CHI_liangjiang_new_area: "Nueva Área Nacional de Liangjiang"
 CHI_liangjiang_new_area_desc: "Liangjiang en Chongqing se convierte en la primera nueva área de nivel nacional en el interior del país, siguiendo a Pudong en Shanghái y Binhai en Tianjín. La zona ha atraído a Ford, HP y a más de 300 empresas de Fortune 500, y ya produce 1,19 millones de vehículos al año. La llanura de Guanzhong en Xi'an recibe una inversión paralela, posicionando a Shaanxi como el motor comercial e industrial del noroeste. El modelo está probado; la escala es lo que debemos expandir ahora."
 CHI_Lips_and_Teeth_Doctrine: "Doctrina de labios y dientes"
 CHI_Lips_and_Teeth_Doctrine_desc: "Reafirmamos el vínculo histórico con Corea del Norte. Ambos países están, como siempre, tan unidos como los labios y los dientes. La supervivencia de Pionyang es nuestro imperativo estratégico y actuaremos en consecuencia, independientemente de la presión internacional."
 CHI_Lithium_Triangle_Accord: "Acuerdo del Triángulo del Litio"
 CHI_Lithium_Triangle_Accord_desc: "Argentina, Bolivia y Chile concentran en conjunto más de la mitad de las reservas de litio recuperables del mundo. Los acuerdos de compra a largo plazo y las participaciones accionarias en proyectos de extracción otorgan a los fabricantes chinos de baterías y vehículos eléctricos un acceso fiable a la materia prima que define el próximo paradigma energético. Los acuerdos aíslan a las cadenas de suministro chinas de las coaliciones de compra occidentales."
 CHI_Liu_Huaqing_Doctrine: "Doctrina Liu Huaqing"
 CHI_Liu_Huaqing_Doctrine_desc: "El almirante Liu Huaqing, arquitecto de nuestra estrategia naval moderna, identificó la Primera y la Segunda Cadena de Islas como el perímetro estratégico dentro del cual nuestro poder marítimo debe establecer un dominio indiscutible antes de proyectarse más allá. El mar de la China Meridional se encuentra por completo dentro de la Primera Cadena. No podemos proyectarnos hacia el exterior hasta que esté completamente asegurado y no podemos retrasar esa seguridad indefinidamente."
 CHI_liu_huaqing_first_island_chain: "La primera cadena de islas de Liu Huaqing"
 CHI_liu_huaqing_first_island_chain_desc: "La línea va desde las Kuriles, pasando por las Ryukyu y Taiwán, hasta Borneo, y detrás de ella los mares cercanos deben ser nuestros. El almirante Liu Huaqing, padre de la Armada moderna del EPL, enseñó que una armada de aguas verdes debe dominar primero la Primera Cadena de Islas antes de poder soñar con el océano abierto. Su doctrina de defensa en alta mar marca nuestro rumbo: denegar los accesos, dominar los mares cercanos y luego mirar más allá."
 CHI_livestream_commerce: "Comercio por transmisión en vivo"
 CHI_livestream_commerce_desc: "Taobao Live fusiona el entretenimiento con las compras en tiempo real a una escala que ningún equivalente occidental ha alcanzado. Viya y Austin Li generan miles de millones en ventas en una sola sesión; el 40 por ciento de nuestro comercio electrónico funciona ahora a través de canales de transmisión en vivo. Las agencias MCN gestionan a miles de creadores y los reguladores imponen un estricto cumplimiento fiscal para garantizar que la riqueza que fluye a través de estas plataformas llegue al Estado en la proporción justa. El formato nos pertenece definirlo y el mundo está observando."
 CHI_logistic_modernisation: "Modernizar la logística"
 CHI_logistic_modernisation_desc: "Las reformas en el frente no significan nada si la cola de suministro se rompe. Estandarizamos los contenedores, paletizamos las cargas y digitalizamos la cadena de suministro bajo la nueva Fuerza Conjunta de Apoyo Logístico, de modo que una brigada pueda sostenerse al mismo ritmo que avanza."
 CHI_long_march_modernisation: "Modernización de la serie Larga Marcha"
 CHI_long_march_modernisation_desc: "La familia de vehículos de lanzamiento Chang Zheng (Larga Marcha), desarrollada por la Corporación de Ciencia y Tecnología Aeroespacial de China, constituye la columna vertebral de todo nuestro programa espacial. La actualización de las líneas de ensamblaje y la mejora en la manipulación de combustibles en las variantes CZ-2, CZ-3, CZ-5 y CZ-7 aumentan el ritmo de lanzamientos y la fiabilidad, al tiempo que los avances transversales en ingeniería de propulsión benefician directamente a nuestros programas de misiles."
 CHI_long_range_firepower: "Potencia de fuego de largo alcance"
 CHI_long_range_firepower_desc: "El alcance supera a la masa. Introducimos cohetes de largo alcance y municiones merodeadoras en las brigadas pesadas, permitiéndoles destrozar la retaguardia del enemigo, sus puestos de mando y sus reservas antes de que los tanques lleguen a entablar combate."
 CHI_loongson_riscv: "Loongson y la arquitectura RISC-V"
 CHI_loongson_riscv_desc: "La línea de procesadores Loongson del Instituto de Tecnología de la Computación proporciona una alternativa nacional a x86 y ARM para servidores gubernamentales y sistemas integrados. Junto a Loongson, la arquitectura de conjunto de instrucciones abiertas RISC-V ha atraído nuestra inversión a través de la organización RISC-V International y de empresas emergentes nacionales, incluidas T-Head de Alibaba, Nuclei System Technology y SiFive China. Las licencias abiertas de RISC-V aíslan nuestros diseños nacionales de la exposición a los controles de exportación de EE. UU. en arquitecturas de conjuntos de instrucciones, y ese aislamiento vale más cada año."
 CHI_lunar_sample_return: "Retorno de muestras lunares"
 CHI_lunar_sample_return_desc: "La misión Chang'e 5 trajo de vuelta 1,73 kilogramos de basalto lunar desde Mons Rümker en diciembre de 2020, las primeras muestras nuevas de la Luna en la Tierra desde la misión soviética Luna 24 en 1976. Chang'e 6 le siguió en junio de 2024, recuperando material de la cuenca Aitken del Polo Sur en la cara oculta, un hito inédito para cualquier programa espacial. Concentramos nuestros recursos en esta vía científica robótica, extendiendo la arquitectura de retorno de muestras a nuevos emplazamientos y acelerando la investigación que esta permite."
 CHI_made_in_china_2025: "Made in China 2025"
 CHI_made_in_china_2025_desc: "Ya no podemos seguir siendo la fábrica del mundo. Se identifican diez sectores prioritarios para transformarlos hacia el liderazgo en alta tecnología: robótica, sector aeroespacial, vehículos eléctricos, dispositivos médicos avanzados, semiconductores y más. Los subsidios estatales, los programas de adquisición de tecnología y los objetivos obligatorios de contratación nacional son nuestros instrumentos. Washington y Bruselas se mostrarán descontentos, pero esta es una dirección que debemos mantener firmemente."
 CHI_Maritime_Silk_Road_Indian_Ocean: "Estrategia del collar de perlas"
 CHI_Maritime_Silk_Road_Indian_Ocean_desc: "Una cadena de inversiones portuarias e instalaciones logísticas a lo largo del litoral del océano Índico, que incluye Hambantota en Sri Lanka y Doraleh en Yibuti, extiende nuestro alcance comercial y potencial naval desde el mar de la China Meridional hasta el Cuerno de África. Los críticos describen este patrón como un «collar de perlas» que rodea a la India. No están del todo equivocados, y ese es precisamente el objetivo."
 CHI_mass_line_education: "La línea de masas"
 CHI_mass_line_education_desc: "La campaña de la Línea de Masas del Partido insta a los funcionarios a rechazar el formalismo, el burocratismo, el hedonismo y la extravagancia. Se prohíben los banquetes fastuosos; se confiscan los relojes caros a quienes son fotografiados llevándolos en público. Nuestra relación con el pueblo debe replantearse como un servicio y no como un derecho. El mensaje es tan políticamente conveniente como genuinamente popular, y no deberíamos desperdiciarlo."
 CHI_mass_line_renewed: "Línea de masas renovada"
 CHI_mass_line_renewed_desc: "La Línea de Masas de Mao Zedong sostenía que el partido debe aprender del pueblo antes de poder liderarlo. Se envía a cuadros y estudiantes a los municipios rurales y a las fábricas. Las campañas de escucha sustituyen a las directivas verticales y la experiencia acumulada de las masas se incorpora de nuevo a la política del partido. La revolución no es una cena de gala."
 CHI_mature_node_counter_offensive: "Contraofensiva de nodos maduros"
 CHI_mature_node_counter_offensive_desc: "Después de que los controles de exportación occidentales restringieran nuestra expansión en nodos avanzados, redirigimos la inversión en capacidad hacia nodos maduros de 28 nm y superiores. SMIC, Hua Hong, CXMT y decenas de fundiciones más pequeñas lanzan expansiones paralelas en Shanghái, Shenzhen y Hangzhou. Actualmente representamos más del 33 por ciento de las adiciones mundiales de capacidad en nodos maduros. Los gobiernos occidentales, alarmados ante la perspectiva de un dominio chino en el segmento de nodos maduros que abastece a la electrónica automotriz, industrial y de defensa, están debatiendo la imposición de aranceles secundarios. Debemos consolidar nuestra posición antes de que esos aranceles lleguen."
 CHI_Media_Offensive: "Ofensiva mediática"
 CHI_Media_Offensive_desc: "Lanzar una campaña mediática mundial coordinada a través de CGTN, Xinhua y las plataformas de redes sociales para proyectar las perspectivas chinas y contrarrestar las narrativas hostiles."
 CHI_Mekong_Riparian_Cooperation: "Cooperación Lancang-Mekong"
 CHI_Mekong_Riparian_Cooperation_desc: "El mecanismo de Cooperación Lancang-Mekong organiza el desarrollo conjunto de infraestructuras, la gestión de los recursos hídricos y la facilitación del comercio entre los seis Estados ribereños que comparten el sistema fluvial. Nuestra construcción de presas río arriba y los proyectos de mejora de la navegación nos otorgan una influencia considerable sobre los vecinos de río abajo, que dependen de un caudal que nosotros controlamos. Deberíamos formalizar este marco antes de que dicha influencia sea calificada como coacción."
 CHI_memory_independence: "Independencia en chips de memoria"
 CHI_memory_independence_desc: "YMTC, con sede en Wuhan y el respaldo del Gran Fondo, ha alcanzado la producción de memoria 3D NAND de 128 capas y ha logrado la arquitectura Xtacking de 232 capas, igualando a Samsung y Micron en una generación comparable. CXMT en Hefei produce DDR4 a 17 nm y está desarrollando flujos de proceso compatibles con DDR5. La breve cualificación por parte de Apple de la memoria NAND de YMTC demostró que nuestra memoria había alcanzado el nivel comercial antes de que la presión de EE. UU. forzara su eliminación de la lista de proveedores de Apple. La línea HBM2 de CXMT ha comenzado la producción en masa antes de lo previsto, cualificándose para los ensamblajes de aceleradores de IA de Cambricon y Biren, poniendo fin a la dependencia de la memoria extranjera en nuestra cadena de suministro de computación de alto rendimiento."
 CHI_mengshi_program: "El programa Mengshi"
 CHI_mengshi_program_desc: "El Mengshi, el vehículo blindado ligero de China inspirado en el Humvee, motoriza a la infantería ligera ofreciendo un transporte robusto y resistente a las minas que puede montar ametralladoras, misiles o una estación de armas remota."
 CHI_miit_licensing_framework: "Marco de licencias del MIIT y reestructuración de operadoras"
 CHI_miit_licensing_framework_desc: "El Ministerio de Industria y Tecnología de la Información debe formalizar el marco de licencias que separe nuestro antiguo monopolio de Correos y Telecomunicaciones en distintas operadoras comerciales. Se codifican las normas de asignación de espectro, los precios de interconexión y la obligación de servicio universal, creando la base reguladora sobre la que China Mobile, China Unicom y China Telecom construirán las redes 4G y 5G más grandes del mundo. La era del monopolio cumplió su propósito; la competencia servirá para la siguiente fase."
 CHI_military_training_outline: "El nuevo esquema de entrenamiento"
 CHI_military_training_outline_desc: "Se emite un nuevo Esquema de Entrenamiento Militar para todas las fuerzas, el manual de normas que fija los estándares y tareas de cada unidad. Por primera vez está redactado en torno a operaciones conjuntas y en red, vinculando a todo el ejército bajo una única y exigente medida de preparación combativa."
 CHI_mobile_payment_duopoly: "El duopolio del pago móvil"
 CHI_mobile_payment_duopoly_desc: "Alipay, lanzada como un servicio de depósito en garantía de Alibaba, ha crecido hasta convertirse en una plataforma de pagos independiente. WeChat Pay ganó 200 millones de usuarios en cinco días mediante una campaña de sobres rojos del Año Nuevo Chino. Los códigos QR sustituyen ahora al efectivo en más del 90 por ciento de nuestras transacciones, dejando fuera a Visa, Mastercard y a las empresas de tecnología financiera occidentales antes de que pudieran establecer una presencia significativa. Hemos construido la infraestructura de pagos de consumo más avanzada del mundo, y opera por completo fuera de la arquitectura financiera occidental."
 CHI_money_alliance: "La alianza del dinero"
 CHI_money_alliance_desc: "La riqueza y el mando se fusionan en una sola facción. El grupo de oficiales más ricos y los magnates del contrabando que los financian se unen entre sí, con la fuerza suficiente para proteger a los suyos y dictar condiciones al Partido que nominalmente los dirige."
 CHI_Monroe_Doctrine_Inverted: "Doctrina Monroe invertida"
 CHI_Monroe_Doctrine_Inverted_desc: "Décadas de inversiones pacientes, acercamiento diplomático y créditos para infraestructuras nos han reposicionado como el socio externo indispensable de América Latina, un papel que Estados Unidos llegó a considerar como su dominio exclusivo. La capacidad de Washington para movilizar coaliciones hemisféricas en nuestra contra se ha erosionado hasta el punto de que la Doctrina Monroe ya no se aplica en la práctica. Las Américas ya no son un lago estadounidense. Debemos asegurarnos de que nunca vuelvan a serlo."
 CHI_national_overall_emergency_response_plan: "Plan Nacional de Respuesta a Emergencias"
 CHI_national_overall_emergency_response_plan_desc: "La crisis del SARS expuso las deficiencias de nuestra preparación nacional ante emergencias con dolorosa claridad. Debemos establecer un marco de respuesta unificado que abarque catástrofes naturales, emergencias de salud pública, accidentes y disturbios sociales, con recursos preposicionados, estructuras de mando claras y protocolos de coordinación interinstitucional en todos los niveles administrativos. La próxima crisis no avisará."
 CHI_naura_amec: "Programas de equipos de NAURA y AMEC"
 CHI_naura_amec_desc: "NAURA Technology Group y Advanced Micro-Fabrication Equipment producen herramientas de grabado, CVD y PVD para nuestras fábricas nacionales de chips. NAURA ha logrado la cualificación en SMIC para equipos de grabado de 28 nm; las herramientas de grabado Primaxx de AMEC han entrado en las líneas de producción de gran volumen. Ambas empresas se benefician de la demanda cautiva de SMIC y de las inyecciones de capital del Gran Fondo. Su cartera combinada de herramientas cubre ya aproximadamente el 40 por ciento de los pasos de proceso requeridos para una fábrica de lógica de nodos maduros. El 60 por ciento restante es donde debemos centrarnos a continuación."
 CHI_nco_corps_reform: "Un cuerpo de suboficiales profesionales"
 CHI_nco_corps_reform_desc: "Un ejército moderno se mantiene unido gracias a sus sargentos, no solo por sus coroneles. Construimos un auténtico cuerpo de suboficiales, soldados de carrera con rango, sueldo y autoridad, sustituyendo la antigua dependencia de los reclutas a corto plazo y cerrando la brecha entre el oficial y el recluta."
 CHI_new_energy_vehicles_startups: "Los pioneros de los vehículos de nueva energía"
 CHI_new_energy_vehicles_startups_desc: "NIO, XPeng, Li Auto, la alianza HIMA de Huawei y Xiaomi entraron en el sector de la automoción entre 2014 y 2024, respaldados por capital tecnológico en lugar de por empresas estatales. Cada uno aportó a los vehículos software de la era de los teléfonos inteligentes, capacidades de IA y el reconocimiento de marca de los consumidores. El sedán SU7 de Xiaomi atrajo 88 898 prerreservas en 24 horas; el todoterreno YU7 aseguró 240 000 pedidos en firme en su primer día."
 CHI_New_World_Order: "Nuevo Orden Mundial"
 CHI_New_World_Order_desc: "Nuestro dominio de la información y el alcance de nuestros medios de comunicación han sentado las bases para un desafío fundamental al orden internacional liderado por Occidente. Ahora debemos aprovechar nuestras redes de influencia, los medios estatales y las herramientas encubiertas para promover un mundo multipolar en el que nuestras propias normas y modelos de gobernanza fijen la agenda global."
 CHI_norinco_rationalism: "NORINCO racionalizado"
 CHI_norinco_rationalism_desc: "China North Industries, el ramificado fabricante de todo tipo de material, desde fusiles de servicio hasta artillería, es recortado y enfocado. Se cierran las líneas redundantes, se consolidan las rentables y el arsenal de las fuerzas terrestres habla por fin con una sola voz industrial."
 CHI_northeast_revitalization_plan: "Plan de revitalización del noreste"
 CHI_northeast_revitalization_plan_desc: "Las provincias del cinturón industrial de Liaoning, Jilin y Heilongjiang entraron en un fuerte declive tras la reforma de las empresas estatales. El gobierno central lanza un programa de revitalización en 2003, canalizando hacia la región inversiones en infraestructuras, créditos preferenciales y capacidad industrial reubicada."
 CHI_northeast_russia_corridor: "Corredor Económico Noreste-Rusia"
 CHI_northeast_russia_corridor_desc: "Se moderniza la infraestructura comercial transfronteriza que une la provincia de Heilongjiang con el Lejano Oriente ruso, lo que permite el flujo de recursos, las inversiones transfronterizas y los proyectos de desarrollo conjuntos. El corredor refuerza la asociación estratégica sino-rusa con sustancia comercial."
 CHI_open_the_august_1st_building: "Abrir el Edificio 1 de Agosto"
 CHI_open_the_august_1st_building_desc: "El Edificio 1 de Agosto alberga a la Comisión Militar Central, donde el Ejército Popular de Liberación responde ante el Partido y ante nadie más. El levantamiento de Nanchang del 1 de agosto de 1927 dio al Partido sus primeros fusiles; esa fecha sigue dando nombre al propio ejército. Ahora comienza su remodelación: la corrupción purgada o tolerada, las divisiones reconstruidas en brigadas, una fuerza aérea fusionada con el espacio y una guardia costera transformada en una flota de alta mar."
 CHI_Operation_New_Dawn: "Operación Nuevo Amanecer"
 CHI_Operation_New_Dawn_desc: "Ha llegado el momento. Los oficiales dentro del EPC respaldados por China se movilizan contra el complejo de la familia Kim. Lo que seguirá será breve, violento y decisivo. El Estado norcoreano sobrevivirá; su liderazgo no."
 CHI_Oppose_Strategic_Flexibility: "Oponerse a la flexibilidad estratégica"
 CHI_Oppose_Strategic_Flexibility_desc: "La doctrina de 'flexibilidad estratégica' de Washington, que permite el despliegue de las fuerzas estadounidenses en Corea del Sur más allá de la península, representa una invasión inaceptable de nuestros intereses de seguridad. Exigimos formalmente su marcha atrás."
 CHI_organisation_department_mandate: "Mandato del Departamento de Organización"
 CHI_organisation_department_mandate_desc: "El Departamento de Organización del PCCh gestiona el nombramiento, la evaluación y el traslado de más de 70 millones de cuadros del partido, lo que significa que quien controle el departamento controla el futuro del personal del partido. Bajo la dirección de Zeng Qinghong, el departamento ha endurecido el control sobre los nombramientos de los líderes provinciales y ha reorientado sus criterios de evaluación para favorecer a los funcionarios con un sólido historial de desarrollo industrial."
 CHI_organisation_department_mandate_tt: "El §Y$CHI_organisation_department_1$§! siempre estará activo cuando §YZeng Qinghong§! sea el líder del país."
 CHI_original_innovation_problem: "El problema de la innovación original"
 CHI_original_innovation_problem_desc: "La copia nos llevó hasta la frontera tecnológica; pero no puede llevarnos más allá de ella. La reforma más difícil es la cultural, que exige la innovación original que la ciencia burocrática ha sofocado durante mucho tiempo. Financiamos el riesgo, toleramos el fracaso y recompensamos el avance que ningún plano extranjero puede suministrar."
 CHI_own_designs: "Nuestros propios diseños"
 CHI_own_designs_desc: "Durante una generación aplicamos ingeniería inversa a los planos soviéticos y lo llamamos progreso. Eso se acabó. Se ordena a las oficinas de diseño que creen en lugar de imitar, y que pongan un sello chino en la próxima arma en lugar de uno prestado."
 CHI_Pacific_Island_Forum_Pivot: "Giro en el Foro de las Islas del Pacífico"
 CHI_Pacific_Island_Forum_Pivot_desc: "Debemos acelerar nuestra ofensiva diplomática en los Estados insulares del Pacífico, ofreciendo subvenciones para infraestructuras con baja carga de deuda, acuerdos de pesca y paquetes de reconocimiento diplomático. El propio Foro se convierte en un escenario en disputa a medida que cultivamos votos indecisos y observadores patrocinados. Australia y Nueva Zelanda, que históricamente han dominado los marcos institucionales del Pacífico, verán desafiado su liderazgo en cada sesión ministerial hasta que admitan nuestra posición."
 CHI_Pax_Sinica: "Pax Sinica"
 CHI_Pax_Sinica_desc: "Un orden internacional sinocéntrico, en el que nuestro peso económico, la dependencia de nuestras infraestructuras y el alineamiento político desplacen al orden liberal basado en normas como principio organizador de los asuntos globales. Los académicos lo han llamado Pax Sinica. Nosotros simplemente lo llamamos el mundo como debería ser. Lograrlo representaría la culminación de nuestro siglo de rejuvenecimiento nacional."
 CHI_Peaceful_Development: "Desarrollo pacífico"
 CHI_Peaceful_Development_desc: "Demostrar mediante la acción que el ascenso de China es una fuerza para la estabilidad global. Invertir en misiones de paz, ayuda ante catástrofes y asistencia al desarrollo para construir una reputación como potencia responsable."
 CHI_pearl_river_delta_tech_cluster: "Clúster electrónico del delta del río de las Perlas"
 CHI_pearl_river_delta_tech_cluster_desc: "El delta del río de las Perlas consolida su posición como la mayor base de fabricación de productos electrónicos del mundo. Shenzhen alberga a Huawei y ZTE; Dongguan se llena de fabricantes por contrato de Taiwán; toda la región funciona como una única cadena de suministro integrada para la electrónica de consumo global."
 CHI_Peninsula_Strategy: "La estrategia para la península"
 CHI_Peninsula_Strategy_desc: "Nos encontramos en una encrucijada en la península de Corea. Décadas de calculada ambigüedad deben dar paso a una postura estratégica deliberada. Elegiremos nuestro camino con cuidado, sabiendo que cada opción conlleva consecuencias irreversibles para el orden regional."
 CHI_peoples_armed_police_integration: "Integrar la Policía Armada"
 CHI_peoples_armed_police_integration_desc: "La Policía Armada del Pueblo, con dos millones de efectivos, queda integrada firmemente bajo la Comisión Militar Central a partir de 2018, asegurando la retaguardia y la frontera para que el ejército de campaña quede libre para luchar hacia el exterior."
 CHI_Petrocaribe_Successor: "Sucesor de Petrocaribe"
 CHI_Petrocaribe_Successor_desc: "El programa petrolero preferencial de Venezuela para los Estados del Caribe y Centroamérica ha colapsado bajo las sanciones y la mala gestión económica. Debemos intervenir como el acreedor estabilizador, extendiendo préstamos respaldados por petróleo a Caracas, La Habana y Managua a cambio de compromisos de suministro a largo plazo. El acuerdo profundiza nuestros lazos con gobiernos que ya están aislados de los mercados de capitales occidentales, y su gratitud será duradera."
 CHI_Petroyuan_Settlement: "Iniciativa del petroyuan"
 CHI_Petroyuan_Settlement_desc: "Debemos lanzar contratos de futuros de petróleo crudo denominados en yuanes en la Bolsa Internacional de Energía, creando un mecanismo para que los exportadores de energía de la Franja y la Ruta liquiden contratos en renminbi en lugar de en dólares estadounidenses. Una adopción sostenida erosionará el dominio del petrodólar y reducirá nuestra exposición a las sanciones financieras de EE. UU. Cada barril cotizado en yuanes es un paso hacia un sistema financiero internacional en el que podamos confiar."
 CHI_pgz_gun_missile_hybrid: "Defensa híbrida de cañón y misil"
 CHI_pgz_gun_missile_hybrid_desc: "El sistema autopropulsado PGZ combina un cañón automático dirigido por radar con misiles de corto alcance en un solo chasis, derribando a las aeronaves que vuelan a baja altura, helicópteros y drones que se deslizan por debajo de la cobertura de los misiles principales."
 CHI_phl_mlrs_modernisation: "Modernización de cohetes PHL"
 CHI_phl_mlrs_modernisation_desc: "El PHL-03 y el modular PHL-16 dotan al ejército de artillería de cohetes de largo alcance que alcanzan cientos de kilómetros, desdibujando la línea entre la batería de cohetes y el misil táctico, y permitiendo que una brigada golpee profundamente detrás del frente."
 CHI_pipechina_gas_reform: "Desagregación de PipeChina"
 CHI_pipechina_gas_reform_desc: "China Oil and Gas Piping Network Corporation recibe aproximadamente 600 000 millones de yuanes en activos de tuberías, instalaciones de almacenamiento y terminales de GNL transferidos desde CNPC, Sinopec y CNOOC. El modelo X+1+X sitúa a un único operador neutral en la fase intermedia entre muchos productores aguas arriba y muchos distribuidores aguas abajo, abriendo una infraestructura que las compañías petroleras nacionales habían controlado anteriormente de forma exclusiva. ENN Energy, China Resources Gas, Beijing Enterprises y los proveedores extranjeros de GNL obtienen acceso, y el mercado de la distribución de gas pasa a ser genuinamente competitivo por primera vez."
 CHI_Piraeus_Model: "Modelo del Puerto del Pireo"
 CHI_Piraeus_Model_desc: "La adquisición por parte de COSCO de una participación mayoritaria en el puerto del Pireo transformó el principal puerto comercial de Grecia en el puerto de contenedores más concurrido del Mediterráneo y en un modelo para nuestra gestión portuaria en toda Europa. El modelo ofrece rendimientos económicos medibles a los gobiernos receptores, al tiempo que consolida nuestro control operativo en puntos de estrangulamiento estratégicos. Pequeñas participaciones accionarias en Lisboa y Hamburgo mantienen a esas capitales comprometidas sin activar el escrutinio regulatorio que invitaría una adquisición mayoritaria."
 CHI_plz_howitzer_program: "El programa del obús PLZ"
 CHI_plz_howitzer_program_desc: "La artillería, que durante mucho tiempo fue el orgullo y el cuello de botella del ejército, pasa a ser totalmente autopropulsada. El PLZ-05, un obús sobre orugas de 155 mm en servicio desde 2008, iguala el alcance y la cadencia de fuego occidentales y constituye la línea de fuego de cada brigada pesada."
 CHI_Polar_Silk_Road: "Ruta de la Seda Polar"
 CHI_Polar_Silk_Road_desc: "Nuestro Libro Blanco de la Política Ártica declara a China como un «Estado cercano al Ártico» y respalda el desarrollo de rutas de navegación transpolares como una extensión septentrional de la Ruta de la Seda Marítima. El derretimiento del hielo marino está haciendo que la Ruta del Mar del Norte sea comercialmente viable, recortando los tiempos de tránsito entre nosotros y Europa hasta en dos semanas. Debemos reclamar nuestro lugar en la arquitectura de gobernanza del Ártico antes de que otros nos cierren la puerta."
 CHI_policy_banks_cdb: "Bancos de desarrollo político"
 CHI_policy_banks_cdb_desc: "El Banco de Desarrollo de China, el Banco de Exportación e Importación de China y el Banco de Desarrollo Agrícola de China forman una arquitectura de financiación paralela que opera al margen de las restricciones comerciales normales. El BDC es actualmente la mayor institución financiera de desarrollo del mundo, más grande que el Banco Mundial y el Banco Asiático de Desarrollo combinados, financiando la presa de las Tres Gargantas, la alta velocidad ferroviaria y más de 600 000 millones de dólares en préstamos para infraestructuras de la Franja y la Ruta en más de 100 países. Estos tres bancos no son meras instituciones financieras; son instrumentos de estrategia nacional."
 CHI_politics_law_commision_realigned: "Alineación de la Comisión Político-Legal"
 CHI_politics_law_commision_realigned_desc: "La Comisión de Asuntos Políticos y Legales coordina el aparato de seguridad, los tribunales y la fiscalía. Alinearla firmemente con el Modelo de Chongqing significa construir una infraestructura de vigilancia que pueda identificar las amenazas antes de que se materialicen, aislando a la revolución tanto de la subversión extranjera como del sabotaje interno."
 CHI_poly_goes_global: "Poly se globaliza"
 CHI_poly_goes_global_desc: "Poly Technologies lleva fusiles y misiles chinos a África, Oriente Medio y América Latina, mientras que Poly Culture convierte los beneficios en casas de subastas y bienes inmuebles. La casa comercial del ejército se convierte en un conglomerado global, sus tratos en nuestra diplomacia y sus beneficios quedan fuera del alcance de cualquier presupuesto oficial."
 CHI_Post_Armistice_Architecture: "Arquitectura postarmisticio"
 CHI_Post_Armistice_Architecture_desc: "Nosotros y los Estados Unidos proponemos conjuntamente un sustituto para el Armisticio de 1953: un marco de paz integral que ponga fin formalmente a la guerra de Corea y establezca garantías de seguridad regional aceptables para todas las partes."
 CHI_Predatory_Lending_Doctrine: "La doctrina de Hambantota"
 CHI_Predatory_Lending_Doctrine_desc: "Cuando Sri Lanka no pudo pagar el préstamo del puerto de Hambantota, firmó un contrato de arrendamiento de 99 años que transfería el control operativo a una de nuestras empresas estatales. Debemos formalizar este modelo: estructurar los proyectos desde el principio de modo que los activos estratégicos se conviertan en colaterales, convertibles en derechos de acceso a largo plazo en caso de impago. El deudor elige las condiciones al elegir si paga o no."
 CHI_private_oem_rise: "El auge de los fabricantes privados"
 CHI_private_oem_rise_desc: "Solo los Cuatro Grandes fabricantes estatales fueron designados como socios de empresas conjuntas, pero los gobiernos provinciales respaldaron a sus propios fabricantes a pesar de ello. Chery Automobile en Wuhu, Geely en Zhejiang y Great Wall Motors en Baoding encontraron formas de acceder a la producción legal y ascendieron por su cuenta. Los fabricantes privados construyen ahora un tercio de nuestros vehículos de pasajeros, llenando los segmentos de todoterrenos, bajo coste y vehículos eléctricos que las empresas conjuntas decidieron ignorar. Haríamos bien en apoyarlos."
 CHI_project_921: "Proyecto 921"
 CHI_project_921_desc: "En septiembre de 1992, la Comisión Militar Central aprobó el Proyecto 921, el plan maestro para una capacidad espacial tripulada china. La decisión estableció la oficina de vuelos espaciales tripulados de la CASC, financió el diseño de la nave espacial Shenzhou y comprometió a la nación a alcanzar la órbita bajo sus propios colores."
 CHI_project_998: "Proyecto 998"
 CHI_project_998_desc: "En 1995 y 1996, dos grupos de portaaviones estadounidenses navegaron por el estrecho de Taiwán y nuestra armada solo pudo mirar. El Proyecto 998 es la respuesta a esa humillación: un esfuerzo sostenido de construcción naval destinado al día en que los portaaviones regresen, transformando una fuerza de defensa costera en una que pueda disputar las aguas frente a nuestras propias costas."
 CHI_Project_Coordination_Cell: "Grupo de coordinación de proyectos de la Franja y la Ruta"
 CHI_Project_Coordination_Cell_desc: "Nuestros corredores de la Franja y la Ruta abarcan docenas de países y cientos de proyectos, y sin un órgano de coordinación acumularán retrasos, redundancias y vulnerabilidades políticas. El Departamento Internacional del Comité Central, Zhonglianbu, debería presidir un grupo interministerial para filtrar solicitudes, asignar gestores de proyectos y supervisar los plazos de entrega. El orden produce resultados. Los resultados sostienen la confianza."
 CHI_project_jxx: "Proyecto J-XX"
 CHI_project_jxx_desc: "Iniciado a finales de la década de 1990 como Proyecto J-XX, el programa da como resultado el J-20 «Dragón Poderoso», que voló en 2011 y entró en servicio en 2017. Furtivo, de largo alcance y con gran capacidad de misiles, es el primer caza de quinta generación fuera de Estados Unidos y Rusia, construido para cazar a los aviones cisterna y de alerta temprana de los que depende cualquier maquinaria de guerra en el Pacífico. China se une al club más selecto del cielo."
 CHI_project_no_10: "Proyecto Número 10"
 CHI_project_no_10_desc: "El J-10, nacido del secreto Proyecto 10, es el primer caza nacional moderno de China, un reactor multimisión monomotor de Chengdu que no debe su diseño a ningún plano soviético. Es el avión con el que la industria nacional de cazas aprende por primera vez a valerse por sí misma."
 CHI_property_tax_pilot_program: "Programa piloto del impuesto sobre la propiedad"
 CHI_property_tax_pilot_program_desc: "Shanghái y Chongqing han lanzado los primeros proyectos piloto de impuestos sobre la propiedad, aplicando tasas moderadas a las segundas viviendas y a las residencias principales de gran valor. Los proyectos piloto pretenden frenar las compras especulativas y diversificar los ingresos de los gobiernos locales para reducir su dependencia de la venta de terrenos. Si los resultados se consolidan, deberíamos extender el modelo a todo el país antes de que el mercado inmobiliario se convierta en un lastre demasiado grande para gestionarlo."
 CHI_provincial_reshuffle: "Reestructuración del liderazgo provincial"
 CHI_provincial_reshuffle_desc: "Zeng ha orquestado una amplia rotación de personal en la Asamblea Nacional Popular. Los veteranos de la facción de Shanghái reciben puestos clave: Chen Liangyu como secretario del partido en Shanghái, Huang Ju es elevado al Comité Permanente del Politburó y Jia Qinglin asume la presidencia de la CPCC. La reestructuración consolida la influencia de los «principitos» sobre las provincias más ricas y el aparato consultivo del Estado."
 CHI_provincial_youth_league_cohort: "Promover a la cohorte de la Liga de la Juventud Provincial"
 CHI_provincial_youth_league_cohort_desc: "Li Keqiang en Henan. Wang Yang en Chongqing. El ascenso de Liu Yandong. La cantera de la Tuanpai es profunda y paciente; dejemos que avance."
 CHI_public_health_reconstruction: "Nuevo Sistema Médico Cooperativo Rural"
 CHI_public_health_reconstruction_desc: "El Nuevo Sistema Médico Cooperativo Rural unifica las aportaciones de los residentes rurales, el gobierno local y el presupuesto central para cubrir los costes médicos catastróficos. Es el primer programa sistemático de seguro médico rural en la historia de nuestra república, y deberíamos impulsarlo hasta alcanzar una cobertura casi universal lo antes posible. Ochocientos millones de agricultores no deberían enfrentarse a la ruina financiera simplemente por enfermar."
 CHI_public_rental_housing_drive: "Campaña de vivienda pública de alquiler"
 CHI_public_rental_housing_drive_desc: "Millones de trabajadores migrantes urbanos y graduados universitarios viven en alojamientos precarios a merced de propietarios privados. El Estado movilizará recursos de construcción para edificar viviendas públicas de alquiler asequibles en las principales ciudades, cobrando alquileres subvencionados y ofreciendo derechos de compra tras tres años de inquilinato."
 CHI_pudong_financial_hub: "Centro Financiero de Pudong"
 CHI_pudong_financial_hub_desc: "La Nueva Área de Pudong en Shanghái se desarrolla como el principal centro financiero en el extranjero de China. La construcción del perfil urbano de Lujiazui, la Bolsa de Shanghái y las zonas comerciales francas señalan la ambición de China de desafiar a Hong Kong y Singapur como centros financieros regionales."
 CHI_qbz191_rifle: "El fusil QBZ-191"
 CHI_qbz191_rifle_desc: "El envejecido diseño bullpup del QBZ-95 da paso al QBZ-191, un fusil de diseño convencional con ópticas montadas en riel introducido a partir de 2019. Un arma moderna para un soldado de infantería del que ahora se espera que luche conectado en red, no en solitario."
 CHI_qinghai_tibet_railway_planning: "Ferrocarril Qinghai-Tíbet"
 CHI_qinghai_tibet_railway_planning_desc: "El ferrocarril Qinghai-Tíbet recorrerá 1956 kilómetros a una altitud media de 4500 metros, atravesando el paso de Tanggula. Una vez completado, será el ferrocarril más alto del mundo y nuestro primer enlace ferroviario directo con Lhasa, integrando al Tíbet económica y logísticamente con el resto del país de una forma que ninguna carretera o aeródromo podría conseguir jamás."
 CHI_quiet_succession_engineering: "Orquestar la sucesión"
 CHI_quiet_succession_engineering_desc: "La autoridad de Zeng Qinghong sobre el Departamento de Organización le otorga una influencia decisiva sobre la contienda por la sucesión que ahora se abre. Debería inclinar la balanza a favor de Xi Jinping frente a Li Keqiang, que cuenta con el respaldo de la Liga de la Juventud. Un asiento en primer rango en el Comité Permanente del Politburó confirmará efectivamente a Xi como el próximo secretario general, y habremos moldeado la próxima década de liderazgo del partido antes de que el asunto se resuelva públicamente."
 CHI_ranks_for_sale: "Rangos en venta"
 CHI_ranks_for_sale_desc: "El ascenso militar se convierte en una lista de precios. Como hizo Xu Caihou desde 1999, cada estrella se vende al mejor postor, entregando el dinero en efectivo en cajas marcadas con el nombre del comprador. Cuando finalmente se registró su casa de Pekín, los investigadores sacaron más de una tonelada de divisas. Un cuerpo de oficiales que compró su rango luchará por su inversión, no por su país."
 CHI_rapid_reaction_corps: "El Cuerpo de Reacción Rápida"
 CHI_rapid_reaction_corps_desc: "Las formaciones de élite aerotransportadas y de asalto aéreo se mantienen en constante preparación, capaces de desplegarse por toda China o más allá en cuestión de horas. Transforman una crisis regional en un hecho consumado antes de que los rivales puedan organizar una respuesta."
 CHI_rare_earth_dominance: "Estrategia de desarrollo de tierras raras"
 CHI_rare_earth_dominance_desc: "China controla aproximadamente el 85 por ciento de la producción mundial de tierras raras, concentrada en Mongolia Interior y Jiangxi. Un programa de consolidación dirigido por el Estado reduce la minería ilegal, eleva las normas de procesamiento y posiciona a China como el proveedor indispensable para la fabricación avanzada mundial."
 CHI_rare_earth_leverage: "La palanca de las tierras raras"
 CHI_rare_earth_leverage_desc: "Refinamos las tierras raras sin las cuales las armas del mundo no pueden funcionar, cerca del noventa por ciento del suministro mundial: los imanes del interior de cada misil guiado y caza furtivo. Lo que era una exportación se convierte en una palanca: se corta el suministro y el arsenal de un rival se bloquea mientras el nuestro funciona libremente."
 CHI_Reclaim_The_Heavenly_Waters: "Reclamar las Aguas Celestiales"
 CHI_Reclaim_The_Heavenly_Waters_desc: "Tianshui, las Aguas Celestiales, es la arcaica designación poética para los mares que rodean al Imperio del Centro. El nombre aporta trasfondo; la acción es moderna y naval. Los grupos de superficie de la Armada del EPL comienzan a intensificar las incursiones en las disputadas aguas de las islas Spratly, desafiando a los buques de la guardia costera de los reclamantes, interrumpiendo las operaciones de reabastecimiento y presentando a cada gobierno un ultimátum: aceptar la autoridad administrativa china sobre las zonas en disputa o enfrentarse a la siguiente salida de la flota. El contador del enfrentamiento avanza únicamente cuando logramos un resultado táctico decisivo; los combates no concluyentes y los contratiempos estancan la escala de tensión."
 CHI_reconstruction_development: "Capacidad de reconstrucción"
 CHI_reconstruction_development_desc: "Años de inversión en infraestructuras y la capacidad acumulada del sector de la construcción nos han dotado de una aptitud excepcional para reconstruir rápidamente tras catástrofes naturales y accidentes industriales. Protocolos estandarizados de respuesta ante catástrofes, reservas de equipos preposicionadas y unidades especializadas de ingenieros del ejército sustentan esta capacidad. Debemos invertir para mantenerla a punto, porque el próximo terremoto o inundación no esperará a que estemos listos."
 CHI_red_arrow_program: "El programa Flecha Roja"
 CHI_red_arrow_program_desc: "Se responde al blindaje enemigo con la familia Flecha Roja de misiles antitanque, los modelos HJ-8 y HJ-9 que arman desde los trípodes de la infantería hasta vehículos y helicópteros. Baratos, abundantes y mejorados constantemente, otorgan a cada formación un alcance capaz de destruir tanques."
 CHI_Renminbi_Internationalization: "El yuan como moneda de reserva"
 CHI_Renminbi_Internationalization_desc: "Hemos lanzado el Sistema de Pago Interbancario Cross-Border para liquidar transacciones en renminbi fuera de la red SWIFT, y el Fondo Monetario Internacional ha admitido al yuan en su cesta de Derechos Especiales de Giro. La liquidación en renminbi de las operaciones comerciales de la Franja y la Ruta está aumentando progresivamente el peso de nuestra divisa en las reservas mundiales. Debemos profundizar ahora en estos mecanismos hasta que el renminbi sea una auténtica alternativa al dólar para los socios que valoran su independencia."
 CHI_Responsible_Stakeholder: "Socio responsable"
 CHI_Responsible_Stakeholder_desc: "Deberíamos aceptar el llamamiento de la comunidad internacional a convertirnos en un participante constructivo en las instituciones mundiales. Al profundizar los lazos comerciales y reducir las fricciones en los foros multilaterales, nos posicionamos como un socio indispensable en lugar de como un competidor revisionista. La etiqueta importa, aunque la estrategia que hay detrás no cambie."
 CHI_rmb_internationalisation: "Internacionalización del renminbi"
 CHI_rmb_internationalisation_desc: "Se ha puesto en marcha el programa piloto de liquidación comercial en RMB y se han firmado acuerdos de intercambio de divisas con más de 40 bancos centrales. El FMI admite al yuan en su cesta de Derechos Especiales de Giro, un reconocimiento que ya no se puede retirar. El Sistema de Pago Interbancario Cross-Border proporciona una alternativa al SWIFT denominada en renminbi, llegando a más de 1500 instituciones miembros. Tras la exclusión de Rusia de SWIFT, aproximadamente el 90 por ciento del comercio entre Rusia y China se desplaza al CIPS y a pares yuan-rublo, y Arabia Saudí, los Emiratos Árabes Unidos y Brasil empiezan a aceptar yuanes para contratos de materias primas. El sistema del dólar no se está colapsando, pero ya no carece de competidor."
 CHI_Rome_Memorandum: "Memorando de la Franja y la Ruta de Roma"
 CHI_Rome_Memorandum_desc: "La firma por parte de Italia de un Memorando de Entendimiento de la Franja y la Ruta fue la primera de un miembro del G7, fracturando el consenso occidental sobre la contención de nuestra diplomacia de infraestructuras en Europa. El acuerdo abarca la cooperación en infraestructuras portuarias, ferroviarias y digitales, situando a Trieste y Génova como terminales del Adriático septentrional y de Liguria para nuestra carga. Bruselas y Washington presionarán a Roma para que se retire, pero el atractivo comercial de nuestra inversión debería resultar políticamente duradero si gestionamos bien la relación."
 CHI_sasac: "Entregar las empresas a la SASAC"
 CHI_sasac_desc: "Las empresas arrebatadas al ejército no desaparecen; pasan a la Comisión de Supervisión y Administración de Activos Estatales, fundada en 2003 para controlar los sectores estratégicos de la economía. El beneficio militar se convierte en dividendo civil, registrado en Pekín y no en los cuarteles."
 CHI_sasac_founding: "Comisión de Supervisión de Activos Estatales"
 CHI_sasac_founding_desc: "Nuestro sector de empresas estatales ha sufrido durante mucho tiempo una fragmentación en la supervisión ministerial, careciendo de una estrategia de propiedad coherente. Debemos establecer una comisión de supervisión dedicada a consolidar el control sobre nuestras empresas de gestión central, introducir contratos de rendimiento para la alta dirección ejecutiva, exigir la remesa de dividendos y filtrar las grandes decisiones de inversión. El Estado debe actuar como accionista, no meramente como regulador."
 CHI_saturn_engine_crisis: "La crisis de los motores Saturn"
 CHI_saturn_engine_crisis_desc: "China puede construir la estructura de los aviones, pero no el corazón que llevan dentro. Nuestros mejores cazas siguen volando con los motores rusos Saturn AL-31, y cada embargo o aumento de precio de Moscú amenaza con dejar a la flota en tierra. Hay que hacer funcionar el motor WS-10 Taihang, cueste lo que cueste, o nuestra independencia será una ficción pintada sobre turbinas importadas."
 CHI_scientific_development_outlook_foreshadowed: "Vislumbrar la Perspectiva Científica del Desarrollo"
 CHI_scientific_development_outlook_foreshadowed_desc: "Conceder espacio ideológico al vicepresidente. La gente de Hu Jintao obtiene una apertura doctrinal: sostenibilidad, reequilibrio rural y el enfoque centrado en el ser humano."
 CHI_scientific_outlook_on_development: "Perspectiva Científica del Desarrollo"
 CHI_scientific_outlook_on_development_desc: "La filosofía de gobierno de Hu Jintao exige un desarrollo centrado en las personas, integral, equilibrado y sostenible. Adoptarla como doctrina del partido reorientará la política, alejándola del crecimiento que prioriza el PIB hacia indicadores sociales y medioambientales más amplios. La cuestión es si se puede persuadir a los funcionarios provinciales, que han pasado una década optimizando para alcanzar objetivos de producción, de que optimicen para algo más difícil de medir."
 CHI_scientific_outlook_on_development_tt: "§RDebido a que perdimos $CHI_scientific_outlook_idea_1$ obtenemos:§!"
 CHI_SCO_Exclusive_Core: "Núcleo exclusivo de la OCS"
 CHI_SCO_Exclusive_Core_desc: "En lugar de diluir la OCS mediante una rápida expansión, deberíamos profundizar la integración entre los miembros actuales. Unos lazos más estrechos entre un grupo más reducido de naciones comprometidas reportarán mayores dividendos estratégicos."
 CHI_SCO_Exclusive_Core_tt: "§GMejora§! la cooperación entre miembros y §Rbloquea§! nuevas solicitudes de socios de diálogo. Los miembros actuales reciben bonificaciones permanentes de opinión."
 CHI_SCO_Plus_Expansion: "Expansión OCS+"
 CHI_SCO_Plus_Expansion_desc: "La fuerza de la OCS reside en su amplitud. Reduciendo las barreras de entrada y cortejando activamente a nuevos socios de diálogo, podemos expandir el alcance de la organización por Asia, Oriente Medio y más allá."
 CHI_sea_eagles_carrier_wing: "El ala aérea de portaaviones"
 CHI_sea_eagles_carrier_wing_desc: "Un puñado de cazas no forma un ala aérea. Completamos la cubierta del portaaviones con helicópteros de alerta temprana aerotransportada, antisubmarinos y de guerra electrónica, soldando las aeronaves en una sola ala integrada capaz de explorar, proteger y golpear como un todo."
 CHI_sea_eagles_of_the_liaoning: "Águilas marinas del Liaoning"
 CHI_sea_eagles_of_the_liaoning_desc: "La cubierta del Liaoning gana sus garras. El J-15 «Tiburón Volador», un caza pesado de portaaviones derivado del Su-33, es armado y puesto a punto como avión de ataque, y la doctrina de ataque de portaaviones (de proyectar el poder aéreo desde una cubierta china en movimiento) se redacta por primera vez."
 CHI_second_gen_platforms: "La segunda generación de plataformas"
 CHI_second_gen_platforms_desc: "ByteDance lanza Douyin a nivel nacional y TikTok a nivel internacional, llegando a audiencias a las que la generación BAT nunca apuntó. Pinduoduo revoluciona el comercio electrónico con mecánicas de compra en grupo que llegan a los consumidores de ciudades de cuarto nivel y mercados rurales; Meituan lidera los servicios a la carta. Didi absorbe a Uber China. Una segunda oleada de plataformas está profundizando nuestra economía digital en segmentos que la primera generación consideraba demasiado difusos o poco glamurosos para construir."
 CHI_Second_Island_Chain_Reach: "Proyección hacia la segunda cadena de islas"
 CHI_Second_Island_Chain_Reach_desc: "Los derechos de acceso de la Armada del EPL en el Pacífico melanesio y polinesio sitúan nuestras bases de operaciones avanzadas a una distancia de ataque de Guam, Hawái y las rutas marítimas que conectan a los Estados Unidos con sus aliados de Asia Oriental. La proyección rompe la lógica estratégica de la Segunda Cadena de Islas en la que los planificadores estadounidenses han confiado desde la Guerra Fría. Australia pierde el colchón geográfico que siempre ha considerado una constante. Debemos movernos antes de que se den cuenta de que ha desaparecido."
 CHI_Secure_The_Heavenly_Waters: "Asegurar las Aguas Celestiales"
 CHI_Secure_The_Heavenly_Waters_desc: "Tianshui, las Aguas Celestiales, es el término arcaico para referirse a los mares que rodean los dominios del Imperio del Centro. Aquellos que rechazaron la invitación a reconocer el orden debido son ahora sometidos por la fuerza de las armas. El mar del Sur es restaurado a su legítima administración bajo nuestra autoridad."
 CHI_seed_security_campaign: "Campaña de seguridad de las semillas"
 CHI_seed_security_campaign_desc: "La guerra de la soja expuso claramente nuestra vulnerabilidad: las comercializadoras de grano ABCD adquirieron el 70 por ciento de nuestra capacidad de molienda de soja después de que los procesadores nacionales quebraran por posiciones especulativas en futuros. No debemos permitir que esa exposición vuelva a repetirse. Sanya, en la isla de Hainan, sirve como nuestra base de fitomejoramiento Nanfan, donde los inviernos tropicales permiten tres generaciones de reproducción por año. La adquisición de Syngenta por parte de ChemChina sitúa las colecciones mundiales de germoplasma bajo la influencia del Estado, mientras que Longping Hi-Tech y la agencia de granos Beidahuang son designadas campeones nacionales de la soberanía de las semillas."
 CHI_selective_anti_corruption: "Campaña selectiva contra la corrupción"
 CHI_selective_anti_corruption_desc: "Las investigaciones contra la corrupción de mediados de la década de 2000 fueron sumamente selectivas. Se abrieron casos contra funcionarios que habían acumulado bases de poder independientes o cruzado líneas de facciones, mientras que los aliados y protectores quedaban aislados del escrutinio. La dimensión política de estos procesamientos minó su legitimidad y generó resentimiento entre las facciones del partido."
 CHI_Seoul_Under_Our_Umbrella: "Seúl bajo nuestro paraguas"
 CHI_Seoul_Under_Our_Umbrella_desc: "Nosotros y Corea del Sur formalizamos un marco de asociación estratégica. Nuestras garantías de seguridad sustituyen a la alianza con los EE. UU., se negocia el acceso de la Armada del EPL a la isla de Jeju y las fuerzas estadounidenses comienzan su tan previsto redespliegue fuera de la península."
 CHI_service_of_the_three_distances: "El servicio de las tres distancias"
 CHI_service_of_the_three_distances_desc: "La armada redefine hasta dónde debe llegar. Más allá de la defensa de los mares cercanos de la primera cadena de Liu Huaqing, ahora se entrena tanto para los mares lejanos como para el océano abierto, las tres distancias en las que una flota global debe estar lista para luchar. La doctrina cambia decisivamente de defender la costa a operar en los océanos del mundo."
 CHI_seventeen_plus_one_mechanism: "Marco de Cooperación 17+1"
 CHI_seventeen_plus_one_mechanism_desc: "La plataforma 17+1 para la cooperación entre China y Europa Central y Oriental canaliza nuestra inversión hacia las infraestructuras de la Unión Europea y de los Estados candidatos, lo que despierta preocupación en Bruselas sobre la deriva de alineamiento de los Estados miembros y la elusión regulatoria. Bruselas tiene motivos para preocuparse. Debemos profundizar estas relaciones precisamente porque fragmentan el frente europeo unificado que limita nuestro acceso al mercado."
 CHI_shadow_banking_cleanup: "Saneamiento de la banca en la sombra y del riesgo financiero"
 CHI_shadow_banking_cleanup_desc: "La avalancha de estímulos de 2008 y 2009 provocó que los productos de gestión de patrimonio y las sociedades fiduciarias acumularan un riesgo opaco en el sector inmobiliario y en los instrumentos de financiación de los gobiernos locales. Las Nuevas Reglas de Gestión de Activos exigen la valoración del valor neto de los activos para los productos de gestión de patrimonio y eliminan las garantías implícitas. Anbang Insurance es intervenida por el Estado tras realizar adquisiciones imprudentes en el extranjero por valor de 300 000 millones de dólares. HNA Group colapsa bajo su propia deuda. El saneamiento concentra la supervisión de riesgos en la reformada CBIRC y estabiliza el mercado interbancario. La disciplina no es un castigo; es el precio de un sistema en el que podemos confiar."
 CHI_shandong_at_sanya: "El Shandong en Sanya"
 CHI_shandong_at_sanya_desc: "El segundo portaaviones es totalmente nuestro. El Tipo 002 Shandong, el primer portaaviones diseñado y construido en China, es botado en 2017 y comisionado en 2019, teniendo luego su puerto base en Sanya, en Hainan, junto a las cavernas de submarinos de Yulin. Desde el sur, observa las rutas marítimas y las islas disputadas que China tiene la intención de retener."
 CHI_shantytown_renovation: "Programa de renovación de barrios marginales"
 CHI_shantytown_renovation_desc: "El programa nacional de renovación de barrios marginales demuele las viviendas precarias de los trabajadores en las antiguas provincias carboneras y mineras y las sustituye por distritos residenciales e industriales modernos. Shanxi y Henan, cargadas con una infraestructura de industria pesada envejecida, reciben las mayores asignaciones. El gasto del gobierno central en el programa alcanza los 1,54 billones de yuanes, generando una oleada de contratos de construcción y abriendo nuevas zonas industriales en el interior donde antes no existía ninguna."
 CHI_shenyang_j35_gyrfalcon: "El J-35 Blue Shark"
 CHI_shenyang_j35_gyrfalcon_desc: "Un segundo caza furtivo se une al primero. El J-35 de Shenyang, derivado del demostrador FC-31, es un reactor bimotor de quinta generación dimensionado tanto para bases terrestres como para cubiertas de portaaviones, lo que dota a China de una combinación furtiva de gama alta y baja con el J-20 que solo los Estados Unidos pueden desplegar de otro modo."
 CHI_shenzhou_program: "El programa Shenzhou"
 CHI_shenzhou_program_desc: "El 15 de octubre de 2003, Yang Liwei despegó a bordo de la Shenzhou 5 desde el Centro de Lanzamiento de Satélites de Jiuquan, convirtiéndose en el primer astronauta de China. La misión de catorce órbitas y veintiuna horas de duración convirtió a China en el tercer país en enviar de forma independiente a un ser humano al espacio, e inauguró un programa de vuelos espaciales tripulados que crecería hasta incluir paseos espaciales, acoplamientos orbitales y misiones en estaciones de larga duración."
 CHI_sicarrier_euv: "Programa SiCarrier EUV"
 CHI_sicarrier_euv_desc: "SiCarrier Technology, establecida con el respaldo directo del Estado, tiene la tarea de cerrar la brecha en litografía ultravioleta extrema (EUV). El programa se nutre de la capacidad nacional de diseño óptico desarrollada en el Instituto de Óptica de Harbin y de la experiencia en fabricación de espejos de la CNNC. Un demostrador funcional de EUV requiere la producción nacional de fuentes de luz de 13.5 nm, ópticas reflectantes multicapa y plataformas de obleas con precisión subnanométrica. Este es nuestro intento más ambicioso de lograr la plena soberanía en equipos de semiconductores. Una herramienta de EUV nacional operativa significa que podemos fabricar chips avanzados de principio a fin sin una sola licencia de equipo extranjera, rompiendo el régimen de control de exportaciones occidental en sus cimientos."
 CHI_Silk_Road_Fund: "Fondo de la Ruta de la Seda"
 CHI_Silk_Road_Fund_desc: "La financiación de la Ruta de la Seda, capitalizada con 40 000 millones de dólares procedentes de nuestras reservas de divisas y fondos soberanos, proporciona financiación de capital para proyectos de la Franja y la Ruta que los bancos comerciales y los prestamistas multilaterales no asumirían por sí solos. Es el instrumento mediante el cual podemos dar el sí a proyectos que, de otro modo, se estancarían por falta de un primer actor dispuesto a asumir el riesgo."
 CHI_sinograin_strategic_reserve: "Sinograin"
 CHI_sinograin_strategic_reserve_desc: "La Corporación de Reservas de Grano de China hereda el papel de los graneros imperiales de las dinastías Sui y Tang, anclada por Beidahuang en Heilongjiang, cuyas granjas de tierra negra producen más grano que cualquier otra provincia. Sinograin implementa la política de precio mínimo de compra de grano, adquiriéndolo en nombre del Estado cuando los mercados caen. Desde entonces, una reserva estratégica de carne de cerdo se ha unido a los almacenes de grano, siendo la única de su tipo en el mundo, y deberíamos tratar a este sistema como el activo estratégico que es."
 CHI_smee_lithography: "Desarrollo de litografía de SMEE"
 CHI_smee_lithography_desc: "Shanghai Micro Electronics Equipment Group es nuestro único fabricante de litografía, produciendo herramientas de exposición de 90 nm y 110 nm para procesos de encapsulado y de fase terminal (back-end). La financiación estatal acelera el desarrollo de un escáner DUV de inmersión de 28 nm, informándose actualmente de avances en su cualificación en las fábricas nacionales de chips. SMEE sigue estando una generación por detrás de las herramientas más capaces de ASML, pero la producción nacional de DUV elimina nuestra dependencia para la expansión de la capacidad en nodos maduros y proporciona la base que necesitamos para el desarrollo hacia la litografía de nodos avanzados. La brecha es real; la trayectoria es correcta."
 CHI_smic_advanced_node: "Impulso de nodos avanzados de SMIC"
 CHI_smic_advanced_node_desc: "Tras nuestra inclusión en la Lista de Entidades de EE. UU., SMIC aceleró su vía de desarrollo nacional. Nuestros ingenieros adaptaron las herramientas DUV existentes para lograr una densidad equivalente a 7 nm mediante patrones múltiples, un resultado que confirmó que la ingeniería de procesos creativa puede sustituir parcialmente el acceso a la litografía EUV. El logro compró tiempo para el desarrollo de equipos nacionales y replanteó la brecha tecnológica como un problema de ingeniería con solución. El lanzamiento del Mate 60 Pro expuso esta capacidad de fabricación al mundo, desencadenando una nueva oleada de revisiones de los controles de exportación de EE. UU., y esa respuesta nos indica que estamos haciendo las cosas correctas."
 CHI_smic_zhangjiang: "Expansión de SMIC Zhangjiang"
 CHI_smic_zhangjiang_desc: "La Semiconductor Manufacturing International Corporation construyó su complejo insignia de fábricas de 300 mm en el Parque de Alta Tecnología de Zhangjiang, y la inversión estatal en sucesivas expansiones de capacidad ha permitido a SMIC alcanzar la producción de 28 nm y comenzar la producción de riesgo en 14 nm. Cada nodo sucesivo cierra la brecha con TSMC y Samsung, y SMIC es actualmente la única fundición de la China continental capaz de producir lógica avanzada. Debemos proteger este activo e impulsarlo aún más."
 CHI_smuggling_tax: "Gravar el contrabando"
 CHI_smuggling_tax_desc: "El ejército no gestiona cada red ilegal; les concede licencias. Los contrabandistas que mueven petróleo, coches y cigarrillos a través de puertos y guarniciones pagan a los comandantes locales por protección, y ese gravamen se convierte en un presupuesto no oficial que ningún ministerio puede ver ni tocar."
 CHI_Soft_Power_Projection: "Proyección de poder blando"
 CHI_Soft_Power_Projection_desc: "Establecer Institutos Confucio en universidades de todo el mundo y ampliar el alcance internacional de los medios de comunicación estatales para promover la lengua, la cultura y las perspectivas chinas en el extranjero."
 CHI_special_operations_forces: "Fuerzas de operaciones especiales"
 CHI_special_operations_forces_desc: "Cada teatro de operaciones crea sus propias brigadas de operaciones especiales, entrenadas para incursiones, reconocimiento y ataques de decapitación. Son la punta de la hoja afilada, enviadas antes que la fuerza principal para abrir la puerta desde el interior."
 CHI_star_market_bse: "Mercado STAR y Bolsa de Pekín"
 CHI_star_market_bse_desc: "El Panel de Innovación Científica y Tecnológica (Mercado STAR) de la Bolsa de Shanghái introduce las OPAs basadas en el registro, las estructuras de acciones de clase dual y el acceso a cotización para empresas que aún no generan beneficios. SMIC recauda 7500 millones de dólares en STAR; le sigue la Bolsa de Valores de Pekín, dirigida a pequeñas y medianas empresas innovadoras. Juntas, estas plataformas permiten a las empresas de semiconductores, biotecnología y fabricación avanzada recaudar capital a nivel nacional sin depender de cotizaciones en Wall Street. Nuestros mercados de capitales ya no son un riesgo de dependencia."
 CHI_state_council_information_office: "Oficina de Información del Consejo de Estado"
 CHI_state_council_information_office_desc: "La Oficina de Información del Consejo de Estado gestiona nuestras comunicaciones externas, las operaciones de propaganda en el extranjero, la gobernanza nacional de internet y la acreditación de la prensa extranjera. Debemos utilizarla para institucionalizar el filtrado de contenidos bajo el programa del Escudo de Oro y expandir nuestras emisiones internacionales para contrarrestar el dominio de la narrativa occidental. El entorno de la información es un campo de batalla y no podemos permitirnos el lujo de cederlo por defecto."
 CHI_stock_exchanges_shanghai_shenzhen: "Bolsas de Shanghái, Shenzhen y Hong Kong"
 CHI_stock_exchanges_shanghai_shenzhen_desc: "La Bolsa de Shanghái alberga a grandes empresas estatales, incluidos los Cuatro Grandes bancos, Sinopec, PetroChina y China Mobile. La Bolsa de Shenzhen alberga a empresas privadas e innovadoras como BYD, Midea, Gree y Ping An. ChiNext en Shenzhen funciona como un equivalente de acciones de crecimiento del NASDAQ. Los programas Stock Connect Shanghái-Hong Kong y Shenzhen-Hong Kong abren una pasarela controlada para los inversores de cartera internacionales sin una liberalización total de la cuenta de capital, lo que nos permite atraer capital extranjero bajo nuestras propias condiciones."
 CHI_strategic_materials: "Cadenas de suministro de materiales estratégicos"
 CHI_strategic_materials_desc: "Controlamos más del 80 por ciento de la capacidad mundial de refinado de galio y germanio y dominamos el suministro de fluorita, silicio metálico y elementos de tierras raras utilizados en la fabricación de semiconductores. Tras los controles de exportación de EE. UU., imponemos licencias de exportación al galio y al germanio, añadiendo luego más restricciones a los compuestos de arseniuro de galio. La política nacional redirige la producción de materiales estratégicos hacia nuestras propias fábricas de chips, reduciendo los costes y asegurando la continuidad del suministro para las fundiciones que operan bajo las restricciones de la lista de entidades. El punto de estrangulamiento de los materiales funciona en ambas direcciones."
 CHI_strategic_reserve_system: "El sistema de reserva estratégica"
 CHI_strategic_reserve_system_desc: "La profundidad es su propia defensa. Un sistema reformado de reserva y movilización está listo para inundar el frente con mano de obra cualificada, asegurando que incluso una larga guerra de desgaste sea algo que China pueda resistir y superar."
 CHI_streamline_the_ranks: "Optimizar los rangos"
 CHI_streamline_the_ranks_desc: "Un ejército de dos millones de hombres creado para ahogar al invasor en masa no puede ganar una guerra de precisión. Recortamos la inflada infantería, retiramos lo obsoleto y volcamos los ahorros en potencia de fuego, sensores y movilidad. El Ejército Popular de Liberación será más pequeño, más afilado y, por primera vez, una fuerza construida para ganar en lugar de meramente para resistir."
 CHI_strike_black_sing_red: "Golpear lo negro, cantar lo rojo"
 CHI_strike_black_sing_red_desc: "Una campaña de dos frentes para purificar el cuerpo político. La campaña «Golpear lo negro» detiene a miles de figuras del crimen organizado y funcionarios corruptos, desmantelando las redes de clientelismo que han corrompido la gobernanza local. La campaña «Cantar lo rojo» revive las canciones revolucionarias y las consignas maoístas, canalizando la energía popular hacia la movilización patriótica."
 CHI_Suez_Eastern_Bank: "Zona Industrial de Suez Oriental"
 CHI_Suez_Eastern_Bank_desc: "La Zona de Cooperación Económica y Comercial de Suez China-Egipto, en la orilla oriental del canal, alberga a nuestras empresas manufactureras, logísticas y energéticas bajo condiciones regulatorias egipcias preferenciales. La zona consolida nuestra posición estratégica en uno de los puntos de estrangulamiento marítimo más críticos del mundo, reduciendo los costes de tránsito y otorgando a nuestras empresas una base de acceso a los mercados de África del Norte y Europa. Egipto obtiene ingresos en divisas y una asociación política con nosotros. Ambos bandos entienden el valor de lo que estamos construyendo."
 CHI_Sunshine_Policy_Revival: "Renacimiento de la Política del Sol"
 CHI_Sunshine_Policy_Revival_desc: "Deberíamos coordinarnos con Seúl para reactivar el marco de acercamiento intercoreano que colapsó en los años posteriores al hundimiento del Cheonan y el bombardeo de Yeonpyeong. Los intercambios culturales conjuntos, los programas de visitas de familias unidas y la reapertura de las líneas telefónicas de emergencia reconstruyen la infraestructura básica de comunicación entre las dos Coreas, sirviendo nosotros como un facilitador indispensable. Una Corea que habla es una Corea que no lucha."
 CHI_system_of_systems_operations: "Operaciones de sistema de sistemas"
 CHI_system_of_systems_operations_desc: "El fin de la reforma es una forma de hacer la guerra, no una tabla de organización. Perseguimos operaciones de sistema de sistemas, entrelazando sensores, tiradores y comandantes en una sola red que piensa y golpea más rápido de lo que cualquier enemigo puede reaccionar. El ejército que gane la próxima guerra luchará como un único organismo con capacidad de ver."
 CHI_tactical_electronic_warfare: "Guerra electrónica táctica"
 CHI_tactical_electronic_warfare_desc: "En el campo de batalla informatizado, el bando que ciegue al otro gana. Desplegamos unidades dedicadas de interferencia, señales y ataque electrónico a nivel de brigada, disputando las radios, radares y enlaces de datos del enemigo antes del primer disparo."
 CHI_tactical_uav_integration: "Integración de UAV tácticos"
 CHI_tactical_uav_integration_desc: "Los ojos en el cielo se convierten en equipamiento estándar. Se introducen pequeños drones de reconocimiento a nivel de batallón y compañía, de modo que ningún comandante avance a ciegas y cada objetivo pueda ser localizado antes de abrir fuego."
 CHI_Takeshima_Solidarity: "El comunicado de las Rocas de Liancourt"
 CHI_Takeshima_Solidarity_desc: "Respaldamos formalmente la reclamación de Corea del Sur sobre las Rocas de Liancourt, enmarcando la disputa como un agravio compartido contra la negativa de Japón a reconocer su legado imperial. La brecha entre Seúl y Tokio se amplía, alejando la opinión pública coreana de la arquitectura de la alianza del Pacífico de Washington."
 CHI_telecom_reorganization: "Reorganización de las telecomunicaciones"
 CHI_telecom_reorganization_desc: "El Consejo de Estado reestructura nuestro monopolio de telecomunicaciones, dividiendo a China Telecom y otorgando licencias de espectro 3G a China Mobile, China Unicom y China Telecom de forma simultánea. La competencia resultante impulsa la inversión en infraestructura de red y acelera la adopción de la banda ancha móvil en un mercado de 1400 millones de suscriptores potenciales al que ningún competidor extranjero puede llegar."
 CHI_tencent_games_publisher: "El imperio de los videojuegos de Tencent"
 CHI_tencent_games_publisher_desc: "Tencent adquiere Riot Games y Supercell, y posee participaciones importantes en Epic, Activision Blizzard y Ubisoft. Honor of Kings se convierte en el videojuego móvil con mayores ingresos del mundo; Genshin Impact recauda 5000 millones de dólares en sus primeros dos años. Nuestra inversión en estudios occidentales nos otorga influencia estructural sobre el entretenimiento global a una fracción del coste del poder blando tradicional. La cultura mueve a las personas de formas que la diplomacia no puede alcanzar."
 CHI_The_2022_Reset: "El reinicio de [GetYear]"
 CHI_The_2022_Reset_desc: "Aprovechando el marco del G20 de Bali establecido en [GetYear], nosotros y los Estados Unidos reactivamos formalmente la arquitectura de las Conversaciones a Seis Bandas. Asumimos el papel de mediador honesto entre Washington, Seúl y Pionyang por primera vez en más de una década."
 CHI_The_2025_Blue_Sky_Operation: "Operación Cielo Azul"
 CHI_The_2025_Blue_Sky_Operation_desc: "Nosotros y Corea del Norte lanzamos una campaña militar coordinada contra Corea del Sur. La Operación Cielo Azul pondrá a prueba nuestra disposición a asumir el coste internacional de una unificación coreana por la fuerza."
 CHI_The_610_Northeast_Directive: "La Directiva Noreste 610"
 CHI_The_610_Northeast_Directive_desc: "El Mando Noreste del PCCh activa los protocolos de movilización de emergencia en Manchuria y Liaoning. Se refuerzan las fuerzas fronterizas, se reposicionan las reservas estratégicas y se fortifica la infraestructura en la zona fronteriza para respaldar cualquier contingencia futura en la península."
 CHI_the_610_office_mandate: "El mandato de la Oficina 610"
 CHI_the_610_office_mandate_desc: "La Oficina 610, llamada así por la fecha de su fundación, coordina a nuestras agencias de seguridad estatal en la supresión de Falun Gong y otros grupos considerados amenazas para la estabilidad social. El departamento opera fuera de los canales legales normales, concentrando el poder de ejecución en manos del centro. Su mandato es deliberadamente ilimitado, porque las amenazas que aborda no respetan las fronteras de la ley ordinaria."
 CHI_the_998_project: "El proyecto del bombardero 998"
 CHI_the_998_project_desc: "A la rama de bombarderos, descartada durante mucho tiempo como obsoleta, se le otorga un futuro. Un programa dedicado reconstruye el ataque de largo alcance en torno a una estructura profundamente modernizada, transformando una reliquia de la Guerra Fría en un portamisiles de ataque a distancia capaz de amenazar objetivos en todo el Pacífico Occidental sin cruzar jamás una costa hostil."
 CHI_The_Air_Patrol_Zone: "La zona de patrulla aérea"
 CHI_The_Air_Patrol_Zone_desc: "Lo que otros Estados llaman una ADIZ, nosotros preferimos describirlo como una zona de patrulla regularizada: interceptores de la PLAAF realizando patrullas rutinarias de soberanía sobre el mar de la China Meridional, identificando aeronaves extranjeras y escoltando fuera del área a los tránsitos que no cumplan las normas. El efecto práctico refleja el precedente de 2013 en el mar de la China Oriental, obligando a todas las aeronaves no chinas a identificarse y correr el riesgo de ser interceptadas, pero el enfoque enfatiza nuestro poder aéreo en lugar de una reclamación legal formal que la comunidad internacional impugnaría de inmediato."
 CHI_the_anime_generation_gambit: "Gambito de la Generación del Anime"
 CHI_the_anime_generation_gambit_desc: "Nuestra juventud cita a Hayao Miyazaki más a menudo que a Mao. Esto es un problema o una oportunidad. El camarada Wang Huning cree que es lo segundo."
 CHI_The_Beijing_Peace_Guarantee: "La Garantía de Paz de Pekín"
 CHI_The_Beijing_Peace_Guarantee_desc: "Avalamos un acuerdo definitivo entre las dos Coreas. La Garantía de Paz de Pekín nos compromete a defender la soberanía de cualquier Corea unificada frente a la interferencia externa."
 CHI_The_Beijing_Settlement: "El Acuerdo de Pekín"
 CHI_The_Beijing_Settlement_desc: "Con el golpe consolidado, mediamos las condiciones de la nueva realidad política de Corea del Norte. El gobierno de transición en Pionyang acepta nuestro arbitraje, y el Partido de los Trabajadores de Corea se reestructura bajo nuestra supervisión."
 CHI_the_bohai_bastion: "El bastión de Bohai"
 CHI_the_bohai_bastion_desc: "La disuasión más segura es la que no se puede encontrar. El submarino de misiles balísticos Tipo 094A, equipado con el misil JL-3 con un alcance de unos diez mil kilómetros, puede por fin atacar el territorio continental estadounidense desde aguas nacionales defendidas. Resguardados tras la flota en un bastión protegido, nuestros submarinos de misiles balísticos otorgan a China una auténtica capacidad de segundo ataque con base en el mar, la garantía definitiva de que ningún primer golpe podrá desarmarnos."
 CHI_The_Border_Personnel_Meetings: "Reuniones de personal fronterizo"
 CHI_The_Border_Personnel_Meetings_desc: "Cinco puntos a lo largo de la Línea de Control Actual donde los comandantes indios y chinos pueden reunirse sin recurrir al protocolo de escalada de tensión. Una tetera, una mesa plegable, dos banderas. A veces la diplomacia empieza en lugares así de pequeños."
 CHI_The_Cabbage_Strategy: "La estrategia de la col"
 CHI_The_Cabbage_Strategy_desc: "El contraalmirante Zhang Zhaozhong ha descrito la táctica públicamente: envolver cada zona en disputa en sucesivas capas. Buques pesqueros en el exterior, milicias marítimas detrás de ellos, patrulleras de la guardia costera a continuación y fragatas en el núcleo, hasta que las hojas más externas sean indistinguibles de la soberanía. Para cuando llegan los abogados extranjeros, la col ya ha crecido. Adoptamos esta doctrina como nuestro marco de actuación para el mar de la China Meridional."
 CHI_The_Cabbage_Tightens: "La col se aprieta"
 CHI_The_Cabbage_Tightens_desc: "Las milicias marítimas y los buques de la guardia costera operan ahora bajo la coordinación unificada de la Armada del EPL a lo largo de la disputada cadena de arrecifes. Las capas exteriores de la col se consolidan en una presencia administrativa y de seguridad continua. Lo que antes estaba en disputa está ahora, en la práctica, bajo nuestra administración."
 CHI_the_china_plus_one_counteroffensive: "La contraofensiva de China-Plus-One"
 CHI_the_china_plus_one_counteroffensive_desc: "El señor Toyoda visitó Tianjín esperando concesiones. Se marchó con concesiones y un contrato por cien mil vehículos de pila de combustible. El arte de dar mientras se quita sigue siendo nuestro para perfeccionarlo."
 CHI_The_Chinese_Correction: "La corrección china"
 CHI_The_Chinese_Correction_desc: "El comportamiento errático de la dinastía Kim se ha convertido en un lastre estratégico. Hemos decidido que una transición gestionada, discreta, quirúrgica e irreversible es preferible a otra generación de diplomacia de chantaje por parte de Pionyang."
 CHI_the_chinese_dream: "El Sueño Chino"
 CHI_the_chinese_dream_desc: "El gran rejuvenecimiento de la nación china es el mayor sueño chino. Un siglo de humillación ha dado paso a la restauración, y el Partido enmarca esta transformación no como una ideología, sino como un destino histórico compartido por los 1400 millones de ciudadanos. La fuerza económica, el poder militar y el respeto internacional no son ambiciones; son lo que se nos arrebató y lo que vamos a recuperar."
 CHI_The_Code_Of_Conduct: "Código de Conducta"
 CHI_The_Code_Of_Conduct_desc: "Un Código de Conducta regional vinculante, negociado bajo las condiciones de China, se presenta como la resolución definitiva de las reclamaciones contrapuestas en el mar de la China Meridional. El instrumento codifica los acuerdos bilaterales, excluye el arbitraje externo y consagra el principio de que las disputas son un asunto exclusivo de China y sus vecinos. Se niega a las potencias externas cualquier base jurídica."
 CHI_the_diaoyu_sovereignty_declaration: "La Declaración de Soberanía de las Diaoyu"
 CHI_the_diaoyu_sovereignty_declaration_desc: "Las islas Diaoyu han sido territorio chino desde la dinastía Ming. La «administración» japonesa es una herencia colonial que el mundo ha tolerado durante demasiado tiempo."
 CHI_The_Duterte_Pivot: "El giro de Duterte"
 CHI_The_Duterte_Pivot_desc: "Cuando el presidente Duterte de Filipinas declaró la «separación» de su país respecto a los Estados Unidos y se volvió hacia Pekín, demostró a la región que un líder del sudeste asiático puede elegir la soberanía por encima de la dependencia. Deberíamos cultivar giros similares en otros lugares, con discreción y paciencia, hasta que las alianzas de Washington se conviertan en una duda en lugar de una respuesta."
 CHI_The_Final_Compromise: "El compromiso final"
 CHI_The_Final_Compromise_desc: "Tras años de paciente diplomacia, mediamos un acuerdo final aceptado por ambas Coreas. Sin llegar a la unificación ni a la división permanente, el acuerdo establece una zona económica compartida, pasos fronterizos desmilitarizados y una comisión de supervisión conjunta chino-coreana. Emergemos como el garante indispensable de la paz en la península."
 CHI_The_Five_Fingers_Doctrine: "La doctrina de los cinco dedos"
 CHI_The_Five_Fingers_Doctrine_desc: "Mao lo dijo en 1959: el Tíbet es la palma de la mano derecha, y los cinco dedos son Ladakh, Nepal, Sikkim, Bután y la Agencia de la Frontera Noreste. Tenemos la palma y el pulgar. Los demás dedos están esperando."
 CHI_the_fujian_catapults: "Las catapultas del Fujian"
 CHI_the_fujian_catapults_desc: "La rampa de salto de esquí da paso a la catapulta. El Tipo 003 Fujian, botado en 2022, es el primer portaaviones chino con catapultas electromagnéticas, capaz de lanzar desde su cubierta aviones más pesados, totalmente repostados e incluso aviones de alerta temprana aerotransportada. Con él, la brecha respecto a un superportaaviones estadounidense se reduce de un abismo a un paso."
 CHI_the_fukuda_doctrine_revisited: "La doctrina Fukuda revisada"
 CHI_the_fukuda_doctrine_revisited_desc: "El camarada Deng nos dijo: oculta tu fuerza, espera tu momento. La economía japonesa se está desangrando, su natalidad se desploma y sus políticos rotan por el Kantei cada catorce meses. ¿Por qué buscar pelea con un cadáver andante cuando podemos comprar su herencia?"
 CHI_The_G2_Declaration: "La Declaración del G2"
 CHI_The_G2_Declaration_desc: "En una cumbre que conecta a Washington y Pekín, nuestros líderes y los estadounidenses declaran conjuntamente su compromiso con una península de Corea pacífica y unificada bajo un gobierno coreano. La Declaración del G2 señala una nueva era en la gestión de la seguridad de Asia Oriental por parte de las grandes potencias, y es una declaración que nos reconoce como un socio en igualdad de condiciones en dicho acuerdo."
 CHI_the_great_wall: "La Gran Muralla"
 CHI_the_great_wall_desc: "Algunas batallas se ganan no perdiendo nunca. Elegimos el camino defensivo, la Gran Muralla moderna: fortificaciones por capas, reservas profundas y un ejército preparado para desangrar por completo a cualquier invasor en suelo chino. La reunificación puede esperar si primero se hace que la patria sea inconquistable."
 CHI_the_great_western_development: "El Gran Desarrollo del Oeste"
 CHI_the_great_western_development_desc: "Nuestra política de «Ir al Oeste» canaliza la inversión estatal hacia doce provincias occidentales mediante la construcción de infraestructuras, incentivos a las fábricas y programas de reasentamiento. Reducir la brecha entre la costa y el interior es tanto un imperativo económico como nuestra herramienta más duradera para vincular las inquietas regiones fronterizas con el centro."
 CHI_the_historical_reckoning: "El ajuste de cuentas histórico"
 CHI_the_historical_reckoning_desc: "Los libros de texto omiten una ciudad. Los santuarios honran a los arquitectos. Nosotros seremos los que recordemos."
 CHI_the_iron_fist: "El puño de hierro"
 CHI_the_iron_fist_desc: "La defensa no recupera nada. Elegimos el puño de hierro: brigadas pesadas de armas combinadas lideradas por el Tipo 99, blindaje masivo y fuegos de largo alcance creados para aplastar a un enemigo preparado y tomar terreno. Cuando llegue la orden de cruzar un estrecho o una frontera, se responderá con un peso abrumador."
 CHI_The_Jang_Faction_Rehabilitation: "La rehabilitación de la facción de Jang"
 CHI_The_Jang_Faction_Rehabilitation_desc: "Cuando Jang Song-thaek fue purgado y ejecutado, perdimos con él a nuestro interlocutor más fiable en Pionyang. Ahora rehabilitaremos a su red superviviente en el exilio, cultivando una casta de funcionarios coreanos de mentalidad reformista que deban sus futuros a nosotros."
 CHI_the_japan_question: "La cuestión de Japón"
 CHI_the_japan_question_desc: "Al noreste se encuentra tanto una gran amenaza como una gran oportunidad. La cuestión japonesa, al igual que la de Taiwán y la de Corea, no admite una respuesta permanente, solo la respuesta que convenga a la hora actual."
 CHI_the_komsomolsk_pipeline: "El conducto de Komsomolsk"
 CHI_the_komsomolsk_pipeline_desc: "¿Por qué esperar a nuestras fábricas cuando las de Rusia ya están en marcha? A Komsomolsk del Amur le compramos el Su-27, el Su-30 y los motores AL-31 que propulsan a la mitad de nuestra flota, importando una generación de capacidad que aún no podemos construir. El conducto mantiene moderna a la fuerza aérea hoy, a precio de depender de Moscú mañana."
 CHI_The_Mandate_Of_The_Seas: "El Mandato de los Mares"
 CHI_The_Mandate_Of_The_Seas_desc: "La cosmovisión clásica china reconocía cuatro mares que rodeaban el centro civilizado del Imperio del Centro, los Sihai. Los Reyes Dragón de esas aguas respondían ante el Cielo y, a través de ellos, ante el Hijo del Cielo. Ese orden fue interrumpido por el Siglo de la Humillación; ahora aguarda su restauración bajo un Estado lo suficientemente fuerte como para imponerlo."
 CHI_the_maritime_militia_initiative: "La iniciativa de la milicia marítima"
 CHI_the_maritime_militia_initiative_desc: "Cada barco de pesca es un marcador de soberanía móvil. La Milicia Marítima de las Fuerzas Armadas del Pueblo responde ante la Comisión Militar Central, pero el mundo solo verá pescadores."
 CHI_The_Maritime_Silk_Road_Initiative: "La Iniciativa de la Ruta de la Seda Marítima"
 CHI_The_Maritime_Silk_Road_Initiative_desc: "La Ruta de la Seda Marítima es el componente marítimo de la Iniciativa de la Franja y la Ruta, que extiende nuestra inversión en infraestructuras y redes comerciales por el sudeste asiático, el sur de Asia y África oriental. En el mar de la China Meridional sirve de anclaje económico para nuestra vía diplomática: los Estados reclamantes a los que se ofrece financiación portuaria, acuerdos pesqueros y empresas conjuntas de hidrocarburos encuentran la vía bilateral más atractiva que la confrontación a nivel de la ASEAN. Cada acuerdo firmado refuerza el principio de que estas disputas son asuntos entre vecinos, no casos de arbitraje internacional."
 CHI_the_nanjing_memorial_mandate: "El mandato del memorial de Nankín"
 CHI_the_nanjing_memorial_mandate_desc: "Trescientos mil. El número estará en cada portada de libro de texto, en cada pared de museo, en cada minuto de silencio del 13 de diciembre. El gobierno japonés tiene sus recuerdos. Nosotros tendremos los nuestros."
 CHI_The_Nine_Dots_Consensus: "El consenso de los nueve puntos"
 CHI_The_Nine_Dots_Consensus_desc: "En lugar de elegir bando entre Pionyang y Seúl, trazamos un rumbo intermedio calibrado: mantener los lazos con el Norte sin garantizar la supervivencia del régimen, y profundizar los vínculos económicos con el Sur sin abandonar la ambigüedad estratégica. Apostamos a que sostener ambos hilos simultáneamente es el único enfoque que con el tiempo puede producir una península estable."
 CHI_the_northeast_tiger: "El tigre del noreste"
 CHI_the_northeast_tiger_desc: "El poder en el ejército corrupto funciona a través de la región y el clientelismo. La camarilla de Shenyang del noreste, el suelo del que surgió Xu Caihou, se convierte en un creador de reyes, comerciando con nombramientos y favores en las antiguas regiones militares como si fuera una propiedad privada."
 CHI_the_panda_diplomacy_renewal: "Renovación de la diplomacia de los pandas"
 CHI_the_panda_diplomacy_renewal_desc: "Dos pandas. Doce millones de dólares al año en «tasas de conservación». Una fotografía en primera página de un niño japonés sonriendo a un animal chino. Vale cada yuan."
 CHI_The_Panmunjom_Architecture: "La arquitectura de Panmunjom"
 CHI_The_Panmunjom_Architecture_desc: "Convocaremos un nuevo diálogo multilateral en Panmunjom, el escenario del Armisticio y de dos décadas de diplomacia fallida liderada por los Estados Unidos. Nuestro marco sienta a Seúl y a Pionyang a la misma mesa bajo nuestra mediación, comprometiendo a todas las partes en un proceso gradual de reducción de la tensión respaldado por nuestras garantías diplomáticas. El mundo nos atribuirá el mérito de haber logrado lo que Washington no pudo."
 CHI_the_party_that_lasts: "El Partido que perdura"
 CHI_the_party_that_lasts_desc: "Los mecanismos institucionales del Partido, el sistema de Congresos, el Comité Central y el Politburó, se reafirman como los motores legítimos de la gobernanza, diseñados para durar más que cualquier líder individual. El Pensamiento de Xi Jinping se integra como marco operativo para el próximo siglo, pero el sistema que lo lleva adelante es colectivo y duradero. El Partido sobrevivió a la muerte de Mao, a la Revolución Cultural y a Tiananmen. Su maquinaria está construida para perdurar."
 CHI_The_Pivot_Reversed: "El pivote invertido"
 CHI_The_Pivot_Reversed_desc: "El pivote de Estados Unidos hacia Asia ha sobreextendido los compromisos de Washington y ha creado una apertura estratégica. Llenaremos el vacío a medida que la credibilidad de los EE. UU. se erosione, posicionándonos como el socio de seguridad más capaz y dispuesto de Seúl."
 CHI_The_PLAN_Expeditionary_Buildup: "Despliegue expedicionario de la Armada del EPL"
 CHI_The_PLAN_Expeditionary_Buildup_desc: "Los grupos de combate de portaaviones, los buques de asalto anfibio Tipo 075 y las flotas de reabastecimiento en alta mar otorgan a la Armada del Ejército Popular de Liberación una plena capacidad operativa en aguas azules. El mar de la China Meridional ya no es una frontera que deba defenderse. Es una zona de despliegue desde la cual se puede proyectar la fuerza a un alcance intercontinental."
 CHI_the_poly_compromise: "El compromiso Poly"
 CHI_the_poly_compromise_desc: "¿Por qué renunciar a una fortuna para parecer limpios? Poly Group nació como la rama de comercio de armas del Estado Mayor, y es solo el más grande de los imperios que el ejército ha construido. Nos negamos a la desinversión de Jiang: las empresas se quedan, el contrabando se queda, el dinero se queda. El EPL será rico antes de ser reformado, y la lealtad se comprará en lugar de ganarse."
 CHI_The_Princeling_Network: "La red de los «principitos»"
 CHI_The_Princeling_Network_desc: "Nuestros servicios de inteligencia penetran en el cuerpo de oficiales del EPC a través de los hijos de la élite de Pionyang que se educaron aquí. Estos principitos, moldeados por sus años en Pekín, son nuestra palanca más fiable dentro del Estado norcoreano."
 CHI_the_pterodactyl_generation: "La generación Pterodáctilo"
 CHI_the_pterodactyl_generation_desc: "La familia de drones armados Wing Loong, o Pterodáctilo, proporciona a la fuerza aérea un cazador persistente y barato para reconocimiento y ataque, además de una exportación insignia que lleva el poder aéreo chino a una docena de guerras extranjeras."
 CHI_the_quad_wedge_strategy: "La estrategia de la cuña contra el Quad"
 CHI_the_quad_wedge_strategy_desc: "No hay Quad sin Tokio, y no hay Tokio sin opciones. Les daremos opciones, de forma discreta y bilateral, en salas a las que los estadounidenses no han sido invitados."
 CHI_the_quiet_dragons: "Los dragones silenciosos"
 CHI_the_quiet_dragons_desc: "El ruido es la muerte bajo las olas, y nuestros submarinos siempre han sido escuchados demasiado pronto. El submarino de ataque de nueva generación Tipo 095 está construido en torno al silencio, con propulsión por bomba de chorro (pump-jet) y un reactor más silencioso que cierra la brecha con los cazadores estadounidenses. Los dragones silenciosos pueden por fin escabullirse de las cadenas de islas y acechar a un portaaviones en su propio océano."
 CHI_the_rare_earth_lever: "La palanca de las tierras raras"
 CHI_the_rare_earth_lever_desc: "La mayoría de las tierras raras del mundo fluyen por nuestras manos. Cada motor de un Toyota Prius, cada conjunto de aletas de un F-35, cada altavoz de un iPhone. La válvula nos pertenece cerrarla o abrirla."
 CHI_the_rcep_acceleration: "Aceleración del RCEP"
 CHI_the_rcep_acceleration_desc: "Los estadounidenses se salieron del TPP. Los japoneses se quedaron. El Asociación Económica Integral Regional se firmará, y Tokio lo firmará de pie junto a Pekín, no junto a Washington."
 CHI_the_renhai_cruiser: "El crucero Renhai"
 CHI_the_renhai_cruiser_desc: "China pone en grada su primer buque capital auténtico de la era moderna. El Tipo 055, que la OTAN clasifica como crucero, es un buque de guerra furtivo de diez mil toneladas erizado con más de cien celdas de misiles, construido para liderar un grupo de portaaviones y combatir cualquier amenaza a flote. Ocho se han completado para 2022 y, con ellos, la armada despliega combatientes de superficie a la altura de cualquiera en el mundo."
 CHI_The_Roh_Moohyun_Framework: "El renacimiento de la Declaración del 4.10"
 CHI_The_Roh_Moohyun_Framework_desc: "Reviviremos el espíritu de la Declaración del 4 de octubre y respaldaremos un marco de acercamiento gradual con Corea del Norte. Los proyectos agrícolas conjuntos, el turismo limitado y el comercio transfronterizo controlado se pueden realizar sin condiciones previas, y nosotros seremos los encargados de mantener esa puerta abierta."
 CHI_The_Sansha_Administrative_Upgrade: "Actualización administrativa de Sansha"
 CHI_The_Sansha_Administrative_Upgrade_desc: "La ciudad de Sansha, nuestra sede municipal en la isla del Árbol (Woody Island) en las Paracel, extenderá ahora su jurisdicción a toda la cadena de las Spratly. El marco civil es deliberado: alcaldes, oficinas de censo y departamentos meteorológicos proporcionan la cobertura política para lo que es, en esencia, la incorporación permanente de los territorios de arrecifes en disputa a nuestro orden administrativo."
 CHI_The_Scarborough_Model: "El modelo de Scarborough"
 CHI_The_Scarborough_Model_desc: "El enfrentamiento en el banco de arena de Scarborough nos proporcionó un método replicable: el encuentro con un barco pesquero escala hasta una confrontación de la guardia costera, la otra parte se retira bajo presión y se establece una presencia permanente antes de que cualquier tercero pueda intervenir. Ahora aplicaremos este modelo sistemáticamente a cada zona en disputa restante."
 CHI_The_Sea_Within_The_Sea: "El mar dentro del mar"
 CHI_The_Sea_Within_The_Sea_desc: "El mar de la China Meridional está delimitado en todos sus lados por la primera cadena de islas, con tierras y arrecifes que se curvan desde Japón, pasando por Filipinas, hasta Malasia; mediante la acumulación de presencia militar, la integración económica y las decisiones territoriales, ha quedado completamente cerrado bajo nuestro control administrativo. La línea de los nueve puntos ya no es una reclamación; es una frontera. Las rutas marítimas que transportan un tercio del comercio mundial pasan ahora por aguas que gobernamos por derecho y de hecho, con nuestra guardia costera y la Armada del EPL manteniendo patrullas de soberanía continuas desde las Paracel hasta las Spratly."
 CHI_the_securitate_restructured: "La Seguridad reestructurada"
 CHI_the_securitate_restructured_desc: "Inspirándose en las innovaciones de Wang Lijun en Chongqing, los servicios de seguridad interna se reorganizan siguiendo las líneas de un aparato integral de protección estatal. La inteligencia de señales, las redes de informantes y la coacción legal se integran bajo un mando unificado. Ninguna conspiración contra el Estado del pueblo escapará a la detección."
 CHI_the_self_reliant_path: "El camino de la autosuficiencia"
 CHI_the_self_reliant_path_desc: "Cada motor importado es una correa. Elegimos el camino más difícil de la autosuficiencia, volcando recursos en nuestras propias oficinas de diseño y aceptando años de aviones inferiores para que la próxima generación no deba nada a ningún proveedor extranjero. Una fuerza aérea que no puede construir sus propias alas nunca será verdaderamente libre."
 CHI_the_senkaku_crisis: "La crisis de las Senkaku"
 CHI_the_senkaku_crisis_desc: "Hemos puesto a prueba las de defensas aéreas de Japón durante años y vigilado de cerca a su guardia costera. La próxima provocación no será desmentible. Una patrullera de la guardia costera no es un buque de guerra, hasta que lo es."
 CHI_The_Seoul_Gambit: "El gambito de Seúl"
 CHI_The_Seoul_Gambit_desc: "Hacemos una apuesta calculada: una relación más profunda con Seúl puede aportar una seguridad más duradera que un compromiso indefinido con Pionyang. Acercarse a Corea del Sur como un socio estratégico en lugar de como un vecino hostil supone una ruptura con décadas de nuestra política hacia las Coreas, y no es algo que deba hacerse a la ligera."
 CHI_the_shanghai_succession: "La sucesión de Shanghái"
 CHI_the_shanghai_succession_desc: "Jiang Zemin transfiere el liderazgo formal a Hu Jintao mientras se asegura de que los leales a la camarilla de Shanghái dominen el Comité Permanente del Politburó. Al retener la presidencia de la Comisión Militar Central, preserva la máxima capacidad de influencia sobre la nueva dirección y consolida el equilibrio de facciones a favor de la red de los «principitos». El poder se entrega; pero no se renuncia a él."
 CHI_the_shanghai_succession_tt: "El equilibrio de facciones de §Y$CHI_factional_balance$§! en el §Y$CHI_16_national_congress_mission$§! decide la sucesión: por encima de §Y$CHI_shanghai_clique_leaning$§! recae en §YHu Jintao§!, de lo contrario en §YZeng Qinghong§!"
 CHI_the_sharp_blade: "La hoja afilada"
 CHI_the_sharp_blade_desc: "La próxima guerra podría decidirse en cuestión de horas, no de meses. Elegimos la hoja afilada: fuerzas especiales, aerotransportadas y de asalto aéreo que golpean primero y lejos, tomando aeródromos, puertos y capitales antes de que el defensor pueda reaccionar. La velocidad se convierte en nuestra arma más pesada."
 CHI_the_sharp_sword_doctrine: "La doctrina de la Espada Afilada"
 CHI_the_sharp_sword_doctrine_desc: "La tecnología furtiva no es solo para los cazas. El GJ-11 «Espada Afilada», un dron de combate de ala volante, consolida una doctrina de ataque no tripulado de penetración profunda, enviado por delante de la flota tripulada para localizar y destruir las defensas del enemigo sin arriesgar la vida de ningún piloto."
 CHI_the_soaring_dragon: "El Dragón Alado"
 CHI_the_soaring_dragon_desc: "El WZ-7 «Dragón Alado» (Soaring Dragon), un dron de gran altitud y larga resistencia con unas características alas unidas, patrulla los accesos marítimos durante días enteros, alimentando a la red de ataque con una vigilancia constante sobre los mares que China tiene la intención de controlar."
 CHI_the_sovremenny_bridge: "El puente Sovremenny"
 CHI_the_sovremenny_bridge_desc: "Hasta que nuestros astilleros puedan construir los buques que necesitamos, los compramos. Se adquieren cuatro destructores Sovremenny del Proyecto 956E y 956EM a Rusia a finales de la década de 1990, cada uno de ellos armado con el misil antibuque supersónico Moskit, diseñado para destruir portaaviones estadounidenses. Son un puente a través de los años, potencia de fuego moderna comprada mientras la flota nacional aún está naciendo."
 CHI_The_Spirit_Of_Zheng_He: "El espíritu de Zheng He"
 CHI_The_Spirit_Of_Zheng_He_desc: "Hace seiscientos años, las flotas de tesoros del almirante Zheng He partieron de Nankín en siete viajes que llegaron al golfo Pérsico y a la costa de África Oriental. Llevaban seda, porcelana y los protocolos del intercambio civilizado, no la conquista. La Ruta de la Seda Marítima es la heredera moderna de esa tradición, y nuestro acercamiento al sudeste asiático se llevará a cabo bajo su espíritu."
 CHI_the_surface_capital_fleet: "La flota de superficie de buques capitales"
 CHI_the_surface_capital_fleet_desc: "El poder que no se ve no impresiona, y nosotros pretendemos ser vistos. La flota se construye en torno al portaaviones y al crucero Tipo 055, en grupos de batalla equilibrados capaces de navegar por cualquier océano y dictar condiciones en cualquier mar. Una gran flota de superficie mostrando la bandera en puertos distantes es la prueba visible de que China ha llegado como potencia marítima."
 CHI_the_tanker_gap: "Cerrar la brecha de los aviones cisterna"
 CHI_the_tanker_gap_desc: "El radio de acción es la debilidad más antigua de la fuerza aérea. Al disponer de muy pocos aviones cisterna, nuestros cazas no pueden merodear lejos de sus bases, por lo que ampliamos la flota de reabastecimiento en vuelo para permitir que los paquetes de ataque alcancen los mares lejanos y permanezcan allí."
 CHI_The_THAAD_Response: "La respuesta al THAAD"
 CHI_The_THAAD_Response_desc: "El despliegue del sistema antimisiles THAAD en Corea del Sur degrada nuestra capacidad de disuasión nuclear. Responderemos con coacción económica: restringiendo el turismo, boicoteando los productos de entretenimiento coreanos y presionando a las empresas coreanas que operan en nuestro suelo hasta que Seúl reconsidere su hospitalidad."
 CHI_the_three_represents: "La Triple Representación"
 CHI_the_three_represents_desc: "La contribución teórica de Jiang Zemin a la doctrina del Partido sostiene que el PCCh debe representar a las fuerzas productivas avanzadas, a la cultura avanzada y a los intereses más amplios de nuestro pueblo. Al admitir a empresarios privados y capitalistas como miembros del Partido, ampliamos la base social de nuestro mandato más allá de los trabajadores y campesinos, y el Partido perdura."
 CHI_the_tokyo_communique: "El comunicado de Tokio"
 CHI_the_tokyo_communique_desc: "El comunicado de hoy dirá menos que el texto de 2008, pero significará más. Tener perspectivas diferentes sobre la historia es una fórmula diplomática que significa que no volveremos a hablar de ello."
 CHI_The_Treasure_Fleet_Returns: "El regreso de la flota de tesoros"
 CHI_The_Treasure_Fleet_Returns_desc: "La Iniciativa de la Franja y la Ruta extiende su componente marítimo por todo el sudeste asiático. Se ofrecen concesiones portuarias, acuerdos pesqueros y empresas conjuntas de plataformas de gas a los Estados reclamantes. Cada acuerdo concluido vincula más estrechamente a un socio a la órbita económica china y disminuye el atractivo de la confrontación."
 CHI_the_type_075_yushen: "El Tipo 075 Yushen"
 CHI_the_type_075_yushen_desc: "La infantería de marina obtiene un buque insignia de cubierta corrida. El Tipo 075 Yushen, un buque de asalto en helicóptero de cuarenta mil toneladas, transporta a una brigada y a sus helicópteros artillados más allá del horizonte y los despliega por aire y mar a la vez. Es el corazón de un grupo anfibio construido para tomar y retener terreno mucho más allá de la costa."
 CHI_the_type_901: "El Tipo 901 y la línea de vida de Yibuti"
 CHI_the_type_901_desc: "Una flota de alta mar vive o muere por su cadena de suministro. El rápido buque de apoyo logístico de combate Tipo 901, lo suficientemente grande y veloz como para mantener el ritmo de un grupo de portaaviones, permite que la flota permanezca en el mar lejos de sus bases; en 2017, China abre su primera base en el extranjero en Yibuti, una línea de vida permanente que ancla a la armada en el océano Índico."
 CHI_the_varyag_refit: "El reacondicionamiento del Varyag"
 CHI_the_varyag_refit_desc: "Un casco soviético oxidado se convierte en la semilla de una flota de portaaviones. Comprado desmantelado a Ucrania en 1998 y remolcado a Dalian en 2002, el inacabado Varyag es reconstruido a lo largo de una década y comisionado en 2012 como el Liaoning. Es más un barco de entrenamiento que un buque de guerra, pero sobre su cubierta una armada sin tradición de portaaviones aprende, avión por avión, cómo volar desde el mar."
 CHI_the_yasukuni_protest_doctrine: "La doctrina de protesta por Yasukuni"
 CHI_the_yasukuni_protest_doctrine_desc: "Cuando el primer ministro de Japón se inclina ante los nombres de criminales de guerra de clase A, no está honrando a sus antepasados. Está ensayando para la próxima guerra. Nuestro embajador regresará a Pekín hasta nuevo aviso."
 CHI_the_yuan_and_the_shang: "El Yuan y el Shang"
 CHI_the_yuan_and_the_shang_desc: "La fuerza submarina sale de la era del diésel. El Tipo 039 Yuan, un buque diésel-eléctrico con propulsión independiente de aire, puede acechar silencioso durante semanas en los mares cercanos, mientras que el Tipo 093 Shang de propulsión nuclear dota a la flota de su primer submarino de ataque creíble capaz de operar lejos de casa. Los cazadores silenciosos se convierten en el filo más afilado de la armada."
 CHI_the_yuzhao_pathfinders: "Los exploradores Yuzhao"
 CHI_the_yuzhao_pathfinders_desc: "La proyección de poder anfibio comienza con un casco y una brigada. El buque de asalto anfibio Tipo 071 Yuzhao, diseñado en la década de 2000, dota a la armada de un auténtico buque anfibio de navegación oceánica, y se organizan las primeras brigadas de infantería de marina dedicadas para embarcar en él. Los exploradores de una futura fuerza expedicionaria se hacen a la mar."
 CHI_theaterization_of_command: "Teatralizar el mando aéreo"
 CHI_theaterization_of_command_desc: "Las aeronaves deben responder ante el teatro de operaciones, no ante una cadena de mando de un servicio independiente. El mando aéreo se integra en los cinco mandos de teatro conjunto, de modo que los cazas, bombarderos y drones luchan bajo el mismo comandante que las fuerzas terrestres y navales, como una sola campaña en lugar de tres."
 CHI_three_gorges_completion: "Finalización del Proyecto de las Tres Gargantas"
 CHI_three_gorges_completion_desc: "Propuesta por Sun Yat-sen y defendida por Mao Zedong, la presa de las Tres Gargantas en el Yangtsé está ya terminada. Con 32 turbinas que producen 22.5 GW de capacidad hidroeléctrica, se erige como la central eléctrica más grande del mundo. El proyecto ha desplazado a 1.4 millones de personas y sumergido dos mil yacimientos arqueológicos, pero los beneficios son reales: control de inundaciones, mejoras en la navegación y un aumento decisivo en la producción de energía renovable para el centro y el oeste de China."
 CHI_three_noc_overseas: "Los tres barriles de petróleo van al extranjero"
 CHI_three_noc_overseas_desc: "CNPC, Sinopec y CNOOC son los tres barriles de petróleo a través de los cuales proyectamos nuestra estrategia de «Salir al exterior». CNPC perfora en Sudán mediante la Greater Nile Petroleum Operating Company, adquiere PetroKazakhstan y firma un acuerdo de préstamo por petróleo con Rosneft por valor de 25 000 millones de dólares estadounidenses. Sinopec adquiere Addax Petroleum, asegurando licencias de producción en Angola, Nigeria y la región del Kurdistán. CNOOC, bloqueada en su oferta por Unocal, logra adquirir Nexen Canada. Siguen acuerdos similares con PDVSA y Petrobras. Cada adquisición es un eslabón de la cadena que asegura nuestro suministro energético."
 CHI_three_red_lines_crackdown: "Represión a la financiación inmobiliaria"
 CHI_three_red_lines_crackdown_desc: "Los reguladores imponen tres límites estrictos de coeficientes a los promotores inmobiliarios: pasivos sobre activos por debajo del 70 por ciento, deuda neta sobre capital por debajo del 100 por ciento y efectivo sobre deuda a corto plazo por encima del 100 por ciento. Evergrande, con más de 300 000 millones de dólares en pasivos totales, incumple los tres y colapsa, liquidada por un tribunal de Hong Kong. Más del 70 por ciento de los 30 principales promotores entran en reestructuración. La política aísla el riesgo financiero sistémico del sector bancario a costa de una reducción drástica de la actividad de construcción y de los ingresos de los gobiernos locales. El precio es alto, pero la alternativa era un contagio que no habríamos podido contener."
 CHI_three_represents_codified: "La Triple Representación codificada"
 CHI_three_represents_codified_desc: "Se admite a los empresarios privados en el Partido. La enmienda de Shanghái encuentra su lugar en la constitución. El legado de Jiang queda sellado por escrito."
 CHI_tiangong_station: "Estación Espacial Tiangong"
 CHI_tiangong_station_desc: "El módulo central Tianhe de la estación espacial Tiangong se lanzó en abril de 2021, seguido de los módulos científicos Wentian y Mengtian en 2022. China opera ahora un laboratorio orbital tripulado permanente por completo independiente de la Estación Espacial Internacional, albergando tripulaciones residentes por periodos de seis meses y un programa en expansión de investigación en microgravedad."
 CHI_tianwen_interplanetary: "Sonda interplanetaria Tianwen"
 CHI_tianwen_interplanetary_desc: "Tianwen-1 se lanzó en julio de 2020 y logró la inserción en órbita, la entrada atmosférica y el descenso a la superficie en una sola misión, llevando al vehículo de exploración Zhurong a Utopia Planitia en mayo de 2021. China se convirtió en el segundo país en operar con éxito un vehículo de exploración en Marte. La misión demostró navegación en el espacio profundo, evasión autónoma de riesgos y retransmisión de comunicaciones de alta ganancia, todos ellos precursores esenciales para las misiones tripuladas más allá del espacio cislunar."
 CHI_Tianxia_Realized: "Todo bajo el cielo"
 CHI_Tianxia_Realized_desc: "En Davos articulamos una visión de un orden global abierto e inclusivo anclado en instituciones multilaterales y prosperidad compartida: una Comunidad de Futuro Compartido para la Humanidad. Esa visión se ha hecho realidad, no mediante la coacción, sino a través de la gravedad económica acumulada. La Iniciativa de Desarrollo Global, el Banco Asiático de Inversión en Infraestructura y la cooperación de alta calidad de la Franja y la Ruta han atraído a la comunidad internacional a un marco que reconoce nuestra centralidad por puro interés. El mundo que ahora lideramos eligió seguirnos."
 CHI_tiger_and_flies: "Tigres y moscas"
 CHI_tiger_and_flies_desc: "La campaña contra la corrupción se dirige tanto contra los altos «tigres» como contra las pequeñas «moscas» en todo el aparato del Partido. Zhou Yongkang, exmiembro del Comité Permanente del Politburó, ha recibido una condena a cadena perpetua; Bo Xilai cayó antes que él. Más de dos millones de funcionarios han sido ya investigados y sancionados. La campaña es simultáneamente una reforma genuina de la gobernanza y un medio para desmantelar las redes políticas rivales; y no podemos permitirnos el lujo de detenerla ahora."
 CHI_Tonga_Tuna_Concession: "Concesiones pesqueras en el Pacífico"
 CHI_Tonga_Tuna_Concession_desc: "Los acuerdos de acceso exclusivo con Tonga, Vanuatu y Fiyi otorgan a nuestras flotas pesqueras de altura derechos preferenciales en vastas zonas económicas exclusivas del Pacífico central y occidental. A cambio, financiamos mejoras portuarias, instalaciones de refrigeración y capacidad de vigilancia marítima que vinculan a los gobiernos receptores en una dependencia de infraestructura a largo plazo. Los acuerdos pesqueros son la punta de lanza económica de nuestro compromiso más amplio en el Pacífico."
 CHI_train_as_you_fight: "Entrenar como se lucha"
 CHI_train_as_you_fight_desc: "La instrucción en el patio de armas gana desfiles, no guerras. El entrenamiento se reestructura en torno a condiciones de combate realistas, con ejercicios de juego libre y una fuerza de oposición dedicada en la base de entrenamiento de Zhurihe que castiga las victorias guionizadas del pasado."
 CHI_train_generals: "Entrenar a los generales"
 CHI_train_generals_desc: "Las reformas sobre el papel mueren sin comandantes que las entiendan. Nuestras academias se reconfiguran para producir oficiales fluidos en la guerra conjunta y el mando de la era de la información, descartando a los designados políticos que no saben interpretar una batalla moderna."
 CHI_TwentyFive_Year_Iran_Accord: "Asociación China-Irán de 25 años"
 CHI_TwentyFive_Year_Iran_Accord_desc: "Nuestra Asociación Estratégica Integral nos compromete a invertir 400 000 millones de dólares estadounidenses en infraestructuras, energía y manufactura iraníes durante 25 años a cambio de suministros de petróleo con descuento. El acuerdo otorga a Teherán una línea de vida bajo las sanciones estadounidenses y nos proporciona hidrocarburos con descuento y una posición avanzada en el golfo Pérsico. Washington, Tel Aviv y las monarquías del Golfo consideran el acuerdo como una amenaza directa a su cálculo de seguridad regional. Que lo hagan."
 CHI_two_centeraries: "El 19.º Congreso del Partido"
 CHI_two_centeraries_desc: "El 19.º Congreso Nacional inscribe el «Pensamiento de Xi Jinping sobre el socialismo con características chinas para una nueva era» en la constitución del Partido mientras Xi aún está vivo, una distinción ostentada por última vez por Mao Zedong. Los Objetivos de los Dos Centenarios enmarcan nuestro horizonte: una sociedad moderadamente próspera para 2021 y una nación socialista plenamente desarrollada para 2049. La trayectoria del Estado para las próximas tres décadas queda así fijada, y los recursos de cada institución deben dirigirse en consecuencia."
 CHI_two_establishments: "Los Dos Establecimientos"
 CHI_two_establishments_desc: "La doctrina de los «Dos Establecimientos» afirma la posición central del camarada Xi Jinping dentro del Comité Central del Partido y el papel rector del Pensamiento de Xi Jinping en la vida del Partido. El liderazgo colectivo no se abolirá, pero se replantea: el Comité Permanente delibera, pero la dirección la fija uno solo. El Partido se mueve como un solo cuerpo, y ese cuerpo tiene un centro."
 CHI_two_ocean_fleet: "La flota de los dos océanos"
 CHI_two_ocean_fleet_desc: "Ni las profundidades ni las cubiertas de vuelo por separado bastan para lo que China pretende ahora. Fusionamos la fuerza submarina silenciosa y la orgullosa flota de superficie en una sola armada capaz de luchar en dos océanos a la vez, el Pacífico y el Índico, dominando los mares cercanos mientras patrullamos los lejanos. De la guardia costera que heredó Liu Huaqing emerge una auténtica potencia de alta mar, segunda ante ninguna salvo una, y acortando distancias."
 CHI_two_reaffirmations: "Dos reafirmaciones"
 CHI_two_reaffirmations_desc: "El partido reafirma dos compromisos fundacionales: la lealtad a la vía socialista tal como la define el Pensamiento de Mao Zedong, y la primacía de la Línea de Masas como el método correcto de liderazgo del partido. No son consignas. Son garantías estructurales contra la deriva derechista que ha permitido que la desigualdad y la corrupción vacíen la revolución desde dentro."
 CHI_type_15_light_tank: "El tanque ligero Tipo 15"
 CHI_type_15_light_tank_desc: "El blindaje pesado no puede respirar en la meseta tibetana ni cruzar los puentes del sur. El ZTQ-15, un tanque ligero de treinta toneladas con un potente cañón de 105 mm, dota a las brigadas rápidas de un blindaje real allí donde un Tipo 99 no puede ir, y ahora vigila de cerca a la India a lo largo de la frontera del Himalaya."
 CHI_type_95_adoption: "Adoptar el Tipo 95"
 CHI_type_95_adoption_desc: "El QBZ-95, un diseño bullpup de 5.8 mm adoptado a finales de la década de 1990, sustituye al envejecido Tipo 81 en toda la línea y estandariza a la infantería con un cartucho de fabricación propia. Sus peculiaridades son reales, pero pone un fusil moderno y nacional en manos de cada soldado."
 CHI_ultra_low_emission: "Normas de emisiones ultrabajas"
 CHI_ultra_low_emission_desc: "El Ministerio de Ecología y Medio Ambiente y el MIIT han emitido normas que exigen que las plantas de sinterización, las instalaciones de coquización y las fundiciones de acero cumplan umbrales de emisión más estrictos que las normas europeas. Más del 80 por ciento de los grandes fabricantes de acero integrado están completando la modernización. La reforma sustituye la práctica de cierres generalizados en torno a acontecimientos políticos (el azul APEC, el azul desfile) por una infraestructura permanente de aire limpio. Ya no deberíamos despejar el cielo solo para ocasiones especiales. Deberíamos mantenerlo limpio."
 CHI_underground_great_wall: "La Gran Muralla subterránea"
 CHI_underground_great_wall_desc: "Bajo las montañas cavamos la Gran Muralla subterránea, miles de kilómetros de túneles fortificados que ocultan y resguardan nuestras fuerzas y misiles. Lo que no se puede encontrar no se puede destruir, y un arsenal enterrado garantiza que cualquier primer ataque reciba respuesta."
 CHI_undersea_supremacy: "Supremacía submarina"
 CHI_undersea_supremacy_desc: "Gobernaremos las profundidades antes que la superficie. La prioridad de la flota pasa a ser el submarino: cazadores nucleares para destruir portaaviones, submarinos de misiles balísticos para mantener al mundo bajo amenaza y un muro de buques silenciosos que transformen la primera cadena de islas en una trampa. Que los rivales exhiban sus grandes flotas en la superficie; nosotros poseeremos el agua bajo ellos y les denegaremos el mar sin mostrar jamás un mástil."
 CHI_Unification_Ultimatum: "Ultimátum de unificación de la península"
 CHI_Unification_Ultimatum_desc: "Con Pekín y Washington alineados, ha llegado el momento de presentar a Pionyang una elección: aceptar la reunificación pacífica bajo Seúl o enfrentarse al peso combinado de las fuerzas militares china, estadounidense y surcoreana. El ultimátum pone fin a la cuestión coreana de una forma u otra."
 CHI_Vision_2030_Partnership: "Asociación de inversión Vision 2030"
 CHI_Vision_2030_Partnership_desc: "La agenda de diversificación Vision 2030 de Arabia Saudí y nuestro apetito por el capital del Golfo y los contratos de obras convergen en una amplia asociación que abarca las energías limpias, las infraestructuras turísticas y la fabricación avanzada. Nuestras empresas ganan importantes contratos para los proyectos NEOM y el Mar Rojo, al tiempo que nos aseguramos un suministro de crudo preferencial y una cuota creciente de liquidación en yuanes. El acuerdo otorga a Riad opciones estratégicas sin romper formalmente su dependencia de seguridad de Washington."
 CHI_wanhua_strategic_materials: "Lista de materiales estratégicos"
 CHI_wanhua_strategic_materials_desc: "El MIIT ha publicado una lista de aproximadamente 130 materiales químicos de los que seguimos dependiendo de las importaciones. Fotorresistencias de litografía, películas de poliamida, fibra de carbono de alta resistencia T800 y superiores, y poliuretanos MDI y TDI se encuentran entre los más críticos. Wanhua Chemical en Yantai, que aplicó ingeniería inversa a la tecnología MDI de Mitsui y adquirió la empresa húngara BorsodChem, ha roto el oligopolio de poliuretano de Bayer, BASF y Huntsman. Weihai Guangwei Composites, Jilin Carbon Valley y Sinopec Shanghai Petrochemical aumentan la capacidad de fibra de carbono para palas de aerogeneradores y compuestos aeroespaciales. Cada sustitución reduce nuestra exposición estructural a los controles de exportación extranjeros."
 CHI_warlord_temptation: "La tentación de los señores de la guerra"
 CHI_warlord_temptation_desc: "Un ejército que sirve al dinero puede verse tentado a servirse a sí mismo. Con regiones, ingresos y tropas leales en sus manos, los grandes comandantes se acercan al peligro chino más antiguo: una fuerza que obedece a sus generales antes que al centro, y una república que deriva de regreso hacia la era de los señores de la guerra."
 CHI_water_security_initiative: "Iniciativa Nacional de Seguridad Hídrica"
 CHI_water_security_initiative_desc: "El desequilibrio hídrico norte-sur de China se ha abordado desde 2002 a través del Proyecto de Trasvase de Agua Sur-Norte, el mayor plan de desviación entre cuencas jamás construido, que canaliza agua desde la cuenca del Yangtsé hasta la árida cuenca del río Amarillo y la región de la capital. Una campaña nacional de seguridad hídrica amplía estos cimientos, combinando infraestructuras a gran escala con proyectos de conservación a nivel provincial dirigidos a las zonas con mayor escasez de agua del norte. Completar un número suficiente de estos proyectos aliviará progresivamente la escasez que lastra la economía nacional."
 CHI_weqi_pipeline_lines: "El gasoducto Oeste-Este"
 CHI_weqi_pipeline_lines_desc: "El Proyecto de Transporte de Gas Oeste-Este une la cuenca de Tarim en Sinkiang con Shanghái a través de una línea troncal de 4000 kilómetros, seguida de una segunda línea que transporta gas turcomano hacia el este vía Khorgos y una tercera desde Turkmenistán a través de Kirguistán. El gasoducto Power of Siberia, acordado con Vladímir Putin bajo un contrato anual de 38 000 millones de metros cúbicos por 30 años, suministra ahora gas desde Heilongjiang directamente a nuestra red oriental. CNPC y PetroChina gestionan la construcción y operación en todo momento. Ningún país que controle esta infraestructura de gasoductos puede ser asfixiado por un embargo energético."
 CHI_west_east_gas_pipeline: "Gasoducto Oeste-Este"
 CHI_west_east_gas_pipeline_desc: "El gasoducto Oeste-Este recorre 4000 kilómetros desde la cuenca de Tarim en Sinkiang hasta Shanghái, completado en 2004. Suministra gas natural al este industrial de China, reduciendo la dependencia del carbón y acelerando la comercialización de las reservas de hidrocarburos de Sinkiang."
 CHI_western_development_strategy: "La Estrategia de Desarrollo del Oeste"
 CHI_western_development_strategy_desc: "El programa Xibu Da Kaifa dirige inversiones preferenciales, incentivos fiscales y una construcción acelerada de infraestructuras a doce provincias y regiones autónomas occidentales. Estamos reduciendo la brecha entre la costa y el interior y profundizando nuestra integración con Asia Central y del Sur, atrayendo la periferia hacia nuestro núcleo económico antes de que los rivales puedan ocupar ese espacio."
 CHI_western_energy_strategy: "Desarrollo energético del oeste"
 CHI_western_energy_strategy_desc: "Las provincias occidentales de China albergan las mayores reservas de carbón, gas natural y energía hidroeléctrica del país. Una estrategia de desarrollo coordinada vincula la extracción con el corazón industrial costero, reduciendo la dependencia de las importaciones de energía y extendiendo la actividad económica hacia el interior."
 CHI_western_industrial_drive: "Campaña de Desarrollo Industrial del Oeste"
 CHI_western_industrial_drive_desc: "El Consejo de Estado ha aprobado la elevación de 169 parques industriales provinciales a Zonas de Desarrollo Económico y Tecnológico de nivel nacional, dirigidas en su mayoría a las provincias occidentales subdesarrolladas. La inversión prioritaria en Yunnan, Guizhou y el oeste de Sichuan está empezando a cerrar la brecha de ingresos con la costa y a establecer las condiciones logísticas previas para la manufactura interior a gran escala. El oeste ha esperado bastante tiempo."
 CHI_western_institutional_engagement: "Compromiso institucional occidental"
 CHI_western_institutional_engagement_desc: "Zeng Qinghong defiende una profundización del compromiso con las instituciones multilaterales lideradas por Occidente como la mejor manera de asegurar nuestra posición en el orden internacional mientras aún se están fijando las normas. Presionamos para ampliar la cuota en el FMI, adoptamos las Normas Internacionales de Información Financiera en nuestras empresas estatales y aumentamos nuestra representación en las juntas del Banco Mundial. Es mejor moldear la arquitectura desde dentro que quedarse fuera de ella."
 CHI_western_pipeline_corridor: "Gasoducto Oeste-Este"
 CHI_western_pipeline_corridor_desc: "El gasoducto Oeste-Este recorre 4000 kilómetros desde la cuenca de Tarim en Sinkiang a través de Gansu, Shaanxi y el delta del Yangtsé hasta Shanghái. Una vez completado, desplazará al carbón en la industria del delta del Yangtsé y reducirá la contaminación por partículas que asfixia a nuestras ciudades costeras más ricas, vinculando los recursos del oeste al crecimiento del este."
 CHI_Win_Win_Cooperation: "Comunidad de futuro compartido"
 CHI_Win_Win_Cooperation_desc: "Tras las crecientes críticas internacionales a la financiación de la trampa de la deuda, reformamos nuestras condiciones de préstamo, introduciendo tasas concesionales, requisitos de mano de obra local y evaluaciones de sostenibilidad de la deuda. El enfoque de «beneficio mutuo» reposiciona a la Franja y la Ruta como un instrumento para el desarrollo recíproco en lugar de una ventaja estratégica, y a los críticos les resulta más difícil sostener sus argumentos."
 CHI_Wolf_Warrior_Diplomacy: "Diplomacia del Lobo Guerrero"
 CHI_Wolf_Warrior_Diplomacy_desc: "Adoptaremos una postura diplomática firme y de confrontación. Nuestros diplomáticos defenderán enérgicamente nuestros intereses y desafiarán las narrativas occidentales dondequiera que las encuentren. El objetivo es claro: reemplazar a los Estados Unidos como la potencia global dominante."
 CHI_wolf_warrior_doctrine: "Diplomacia del Lobo Guerrero"
 CHI_wolf_warrior_doctrine_desc: "Un nuevo estilo firme de diplomacia ha surgido de nuestro Ministerio de Asuntos Exteriores. Nuestros embajadores atacan públicamente a los críticos extranjeros; los portavoces estatales responden a la censura con acusaciones de hipocresía y mala fe. Este enfoque abandona la doctrina de Deng Xiaoping de ocultar la fuerza y esperar el momento en favor de una confrontación directa. Ya no pedimos disculpas, y el mundo está empezando a comprender lo que eso significa."
 CHI_ws15_bottleneck_solve: "Romper el cuello de botella del WS-15"
 CHI_ws15_bottleneck_solve_desc: "El motor a reacción es el muro contra el que se ha estrellado cada caza chino, obligándonos a depender de las turbinas rusas para nuestras mejores estructuras de aviones. El turbofán WS-15 está destinado a poner fin a esa dependencia y otorgar al J-20 el empuje de supercrucero en torno al cual fue diseñado. Dominar los álabes de turbina monocristalinos es el último metro de la escalada."
 CHI_wto_accession_drive: "Campaña de adhesión a la OMC"
 CHI_wto_accession_drive_desc: "Tras quince años de negociaciones, nos encontramos al borde de la membresía formal en la Organización Mundial del Comercio. La adhesión consolidará nuestras reformas de liberalización comercial, abrirá los mercados extranjeros a nuestras exportaciones y acelerará la transferencia de tecnología industrial a nuestras manos."
 CHI_wto_commercial_bank_reform: "Reforma de la Ley de Bancos Comerciales de la OMC"
 CHI_wto_commercial_bank_reform_desc: "Nuestra adhesión a la OMC nos compromete a abrir el sector financiero a los bancos extranjeros, y el primer ministro Zhu Rongji ha lanzado una reestructuración en tres pasos antes de que venza ese plazo. Las Sociedades de Gestión de Activos absorben cientos de de miles de millones en préstamos dudosos; Central Huijin Investment inyecta capital utilizando reservas de divisas; los Cuatro Grandes bancos cotizan en bolsas extranjeras para imponer una disciplina de mercado. La revisión de la Ley de Bancos Comerciales transforma a los Cuatro Grandes de instrumentos de crédito político en instituciones formalmente comerciales, una distinción que importará cuando los bancos extranjeros lleguen para competir."
 CHI_wto_implementation: "Implementación de la OMC"
 CHI_wto_implementation_desc: "Nuestra adhesión a la OMC nos comprometió a un calendario plurianual de reducciones arancelarias, reformas de la propiedad intelectual, apertura del sector servicios y eliminación de los privilegios comerciales estatales. La implementación fue desigual y frecuentemente cuestionada por nuestros socios comerciales ante el Órgano de Solución de Diferencias, pero el proceso nos ha integrado profundamente en las cadenas de suministro mundiales, y esa integración es tanto un arma como una obligación."
 CHI_wto_implementation_tt: "Si completamos §Y$CHI_wto_accession_drive$§!, la bonificación será mejor y permanente."
 CHI_wuhan_automotive_hub: "Centro de Automoción de Wuhan"
 CHI_wuhan_automotive_hub_desc: "Dongfeng Motor Corporation, con sede en Wuhan, amplía sus operaciones de empresa conjunta con Peugeot-Citroën, Nissan y Honda. Wuhan se convierte en la capital de la automoción de China central, anclando un clúster de proveedores de componentes y empresas de logística a lo largo del Yangtsé."
 CHI_xi_jinping_thought_enshrined: "Consagración del Pensamiento de Xi Jinping"
 CHI_xi_jinping_thought_enshrined_desc: "El Pensamiento de Xi Jinping es elevado de guía política a doctrina constitucional, de estudio obligatorio en universidades, academias militares y escuelas del Partido en todo el país. La aplicación Xuexi Qiangguo está instalada en cientos de millones de teléfonos y se supervisa su uso diario. La disidencia ya no es meramente mal recibida; ahora es oficialmente una desviación de la verdad establecida. La arquitectura ideológica del Estado y un único nombre ya no son separables."
 CHI_xinjiang_industrial_zones: "Desarrollo Industrial de Sinkiang"
 CHI_xinjiang_industrial_zones_desc: "Zonas industriales especiales en Urumqi y la cuenca de Tarim atraen la migración Han, industrias de procesamiento e inversiones en extracción de recursos. Las zonas están diseñadas para anclar la economía de Sinkiang a la base industrial oriental y reducir su dependencia de la agricultura tradicional."
 CHI_y20_strategic_lift_program: "El programa de transporte estratégico Y-20"
 CHI_y20_strategic_lift_program_desc: "Una gran potencia debe ser capaz de movilizarse por sí misma. El Y-20 «Kunpeng», un transporte pesado a reacción en servicio desde 2016, dota finalmente a China de la capacidad de transporte aéreo para desplegar tropas, blindados y ayuda humanitaria a través de continentes, y sus variantes de reabastecimiento en vuelo y de mando multiplican el alcance de toda la fuerza aérea."
 CHI_Yangtze_confederation: "Confederación Económica del Yangtsé"
 CHI_Yangtze_confederation_desc: "La cuenca del río Yangtsé, desde Chongqing pasando por Hubei y Hunan hasta la desembocadura del río en Shanghái, alberga el corazón industrial de China. Una confederación económica formal de estas provincias bajo una planificación coordinada eliminará las inversiones redundantes, integrará las cadenas de suministro y proyectará el Modelo de Chongqing a través del corredor más productivo de la nación."
 CHI_yangtze_delta_integration: "Integración del delta del Yangtsé"
 CHI_yangtze_delta_integration_desc: "La inversión estatal coordinada en Shanghái, Jiangsu y Zhejiang consolida el delta del río Yangtsé como nuestro principal corredor de fabricación y exportación. La concentración de capital extranjero y mano de obra cualificada aquí asegurará el crecimiento durante la próxima década."
 CHI_yangtze_logistics_corridor: "Corredor logístico del río Yangtsé"
 CHI_yangtze_logistics_corridor_desc: "El río Yangtsé gestiona más carga que cualquier otra vía navegable interior del mundo. La inversión en infraestructuras portuarias, mejoras en la navegación y terminales intermodales integra al río en las cadenas de suministro nacionales, conectando Sichuan con Shanghái a una fracción de los costes del transporte por carretera."
 CHI_yj12_standoff_family: "La familia de misiles de ataque a distancia YJ-12"
 CHI_yj12_standoff_family_desc: "El YJ-12 dota a nuestras aeronaves de un misil antibuque supersónico que vuela a ras de suelo y se aproxima demasiado rápido como para que la mayoría de las defensas puedan responder. Suspendido bajo bombarderos y cazas, pone en peligro a cualquier buque de guerra situado a cientos de kilómetros de la costa china."
 CHI_youth_league_pipeline: "La cantera de la Liga de la Juventud"
 CHI_youth_league_pipeline_desc: "La Liga de la Juventud Comunista es la principal cantera de talento de la facción de Hu Jintao. Sus antiguos miembros ocupan la mayoría de las secretarías provinciales y dominan los puestos intermedios de los ministerios centrales, formando una red nacional de funcionarios unidos por una experiencia organizativa compartida. Quienes ascienden por sus filas deben su progreso al mismo sistema."
 CHI_yuan_internationalisation: "Internacionalización del yuan"
 CHI_yuan_internationalisation_desc: "La crisis financiera global expuso la fragilidad del dólar y nos dio nuestra oportunidad. Los acuerdos bilaterales de intercambio de divisas con docenas de bancos centrales, los centros de liquidación de yuanes en el extranjero en Hong Kong y Singapur y un mercado de bonos dim-sum han otorgado a nuestro renminbi su primera circulación internacional significativa. La prima de reserva del dólar no sobrevivirá indefinidamente."
 CHI_yuanhua_model: "El modelo Yuanhua"
 CHI_yuanhua_model_desc: "Lai Changxing demostró cómo se hace. Desde Xiamen, su imperio Yuanhua contrabandeó unos diez mil millones de dólares en petróleo, coches y cigarrillos a lo largo de la década de 1990 y, cada vez que las aduanas se cerraban, aparecía un oficial poderoso para darles el paso. Convertimos su acuerdo en un sistema: las fuerzas militares protegen al contrabandista y el contrabandista paga a las fuerzas militares."
 CHI_yuzhao_hull_coral_brigades: "El casco Yuzhao y las brigadas de coral"
 CHI_yuzhao_hull_coral_brigades_desc: "La ambición anfibia pasa de exploradora a flota. El Tipo 071 entra en producción en serie y el cuerpo de infantería de marina pasa de dos brigadas a seis, entrenadas para los arrecifes e islas disputadas del mar de la China Meridional. El casco del buque y la brigada de coral crecen juntos hasta convertirse en una fuerza capaz de tomar una línea de costa."
 CHI_zb108_wheeled_family: "La familia de vehículos sobre ruedas Tipo 08"
 CHI_zb108_wheeled_family_desc: "La familia 8x8 Tipo 08, desde el transporte de infantería hasta el cañón de asalto y la ambulancia, dota a las brigadas medianas de un único chasis sobre ruedas que es rápido en carretera y barato de operar, constituyendo el núcleo móvil de las fuerzas de despliegue rápido de China."
 CHI_zbd04_apex_ifv: "El VCI de vanguardia ZBD-04A"
 CHI_zbd04_apex_ifv_desc: "El ZBD-04A es el principal vehículo blindado de combate de infantería sobre orugas del ejército, que transporta un cañón-lanzador de 100 mm, un cañón automático de 30 mm y una escuadra completa bajo blindaje. Es la columna vertebral de las brigadas mecanizadas pesadas y el compañero del Tipo 99 en la línea fronteriza entre China e India."
 CHI_zbd_mechanisation: "Mecanización ZBD"
 CHI_zbd_mechanisation_desc: "La infantería debe mantener el ritmo del blindaje. La familia de vehículos de combate sobre orugas ZBD transporta a los fusileros hacia adelante bajo blindaje y lucha junto a los tanques, completando la mecanización de las brigadas pesadas."
 CHI_zeng_qinghong_reign: "La era de Zeng Qinghong"
 CHI_zeng_qinghong_reign_desc: "Zeng Qinghong, el estratega principal de la camarilla de Shanghái, ejerce como vicepresidente y director de la Escuela Central del Partido. Su control sobre el Departamento de Organización y el Secretariado Central le otorga una influencia decisiva sobre los nombramientos de personal en cada nivel del aparato del partido-estado. Aquellos a quienes coloca, le pertenecen."
 CHI_zero_hour: "Hora cero"
 CHI_zero_hour_desc: "Durante años, el ejército se ha entrenado, reequipado y esperado, y ha llegado la hora de poner todo eso en uso. Nuestra infantería avanzará en números que ninguna línea defensiva podrá absorber, nuestras columnas blindadas en formaciones demasiado profundas para ser flanqueadas, mientras que las fuerzas de cohetes estratégicos esperan en sus silos como el argumento que pretendemos que nunca nos obliguen a usar. A partir de esta hora, el Ejército Popular de Liberación deja de prepararse para la próxima guerra y comienza, en su lugar, a esperarla; cada mando responde por fin a una única voluntad."
 CHI_ztz96_mainstreaming: "Estandarizar el Tipo 96"
 CHI_ztz96_mainstreaming_desc: "No todas las brigadas necesitan el costoso Tipo 99. El ZTZ-96, más barato y ligero, se produce en masa y se actualiza constantemente a las versiones 96A y 96B, convirtiéndose en el tanque de batalla principal que completa el grueso de la fuerza blindada."
 CHI_ztz99_rollout: "Despliegue del Tipo 99"
 CHI_ztz99_rollout_desc: "El ZTZ-99 se convierte en la punta de lanza de las brigadas pesadas, un tanque de batalla principal de tercera generación con blindaje compuesto, un cañón de 125 mm y una suite de defensa láser. Es el primer tanque chino construido para enfrentarse al mejor material de Occidente y Rusia en igualdad de condiciones."
 CHI_ztz99a_apex: "El Tipo 99A Apex"
 CHI_ztz99a_apex_desc: "El ZTZ-99A, desplegado a partir de 2011, es la cúspide de la línea: blindaje más pesado, un motor potenciado, una mira cazador-asesino (hunter-killer) y un sistema completo de gestión de batalla que lo convierte en un nodo de la red de la brigada. Es el puño más pesado que el ejército puede lanzar."
 arctic_observer_status: "Estatus de observador del Ártico"
 arctic_observer_status_desc: "Nuestro asiento en el Consejo Ártico y nuestra infraestructura de la Ruta de la Seda Polar abren nuevas rutas marítimas y fronteras de recursos en el alto norte."
 CHI_610_directive_active: "Directiva Noreste 610"
 CHI_610_directive_active_desc: "El Mando Noreste del PCCh ya ha activado los protocolos de movilización de emergencia. Se refuerzan las fuerzas de seguridad a lo largo del río Yalu y las autoridades provinciales operan bajo poderes de emergencia ampliados."
 CHI_aiib_dividend_member: "Miembro con dividendos del BAII"
 CHI_aiib_dividend_member_desc: "La membresía fundadora en el Banco Asiático de Inversión en Infraestructura ofrece rendimientos constantes. Los pagos de inversión y las condiciones comerciales preferenciales con proyectos financiados por China fortalecen nuestro balance económico."
 CHI_anti_corruption_purge: "Purga contra la corrupción"
 CHI_anti_corruption_purge_desc: "La Comisión Central de Inspección de la Disciplina procesa miles de casos al año. El cohecho dentro de la contratación, la construcción y la gestión de empresas estatales se expone y penaliza. Los funcionarios que habían extraído beneficios de cada contrato descubren que el cálculo político ha cambiado. El rendimiento por función estatal aumenta a medida que las redes de clientelismo se desmantelan y se reemplazan por una rendición de cuentas directa."
 CHI_anti_terror_crackdown_idea: "Represión antiterrorista"
 CHI_anti_terror_crackdown_idea_desc: "Los servicios de seguridad están ejecutando una operación a nivel nacional contra las redes terroristas. La capacidad de detección aumenta mientras que la represión absorbe el ancho de banda político."
 CHI_army_reorganisation_disruption_idea: "Reorganización del Ejército"
 CHI_army_reorganisation_disruption_idea_desc: "Los trece ejércitos de grupo se vuelven a numerar y reconstruir en torno a brigadas de armas combinadas. Mientras la reestructuración está en marcha, la organización y el poder ofensivo se resienten, y el entrenamiento se acumula con retrasos. Una vez que la nueva estructura se asienta, la fuerza terrestre emerge más ligera y capaz que antes."
 CHI_asian_century_concord_idea: "La Concordia del Siglo Asiático"
 CHI_asian_century_concord_idea_desc: "Pekín y Nueva Delhi han acordado coordinarse en asuntos regionales y mundiales, enmarcando el siglo veintiuno como algo que a Asia le corresponde moldear conjuntamente."
 CHI_ban_strategic_partnership: "Asociación estratégica con Pekín"
 CHI_ban_strategic_partnership_desc: "Bangladés alinea su postura de política exterior con China en todos los foros multilaterales."
 CHI_banking_modernised_idea: "Sector bancario recapitalizado"
 CHI_banking_modernised_idea_desc: "Los bancos estatales han sido saneados de préstamos dudosos y han salido a cotizar en la bolsa de Hong Kong con accionistas minoritarios extranjeros. Las normas internacionales de contabilidad, las auditorías externas y la disciplina de mercado mejoran la eficiencia y la credibilidad del sector."
 CHI_beidou_global_constellation: "Constelación global de Beidou"
 CHI_beidou_global_constellation_desc: "Con estaciones terrestres desplegadas por toda América Latina, la red de satélites Beidou proporciona ahora una cobertura global integral. Las operaciones navales, el reconocimiento y la contrainteligencia se benefician de esta precisión y alcance."
 CHI_beijing_communique_guarantor: "Garante del Comunicado de Pekín"
 CHI_beijing_communique_guarantor_desc: "El papel de China como mediador de la paz entre dos rivales regionales ha mejorado su posición como potencia responsable. El capital diplomático fluye libremente y las relaciones son más fáciles de mantener."
 CHI_blue_national_soil: "Suelo nacional azul"
 CHI_blue_national_soil_desc: "La doctrina oficial de la RPC que designa el espacio marítimo dentro de la línea de los nueve puntos como «suelo nacional azul»: un territorio marítimo tan inalienable como cualquier provincia en tierra firme. Este marco teórico hace que cualquier concesión sea políticamente imposible y redefine toda presencia extranjera como una intrusión ilegal."
 CHI_blue_national_soil_militarised: "Suelo nacional azul militarizado"
 CHI_blue_national_soil_militarised_desc: "Lo que comenzó como una doctrina administrativa se ha convertido en una postura operativa. Las fuerzas de la Armada del EPL y de la guardia costera aplican ahora de forma activa la reclamación del suelo nacional azul, tratando las incursiones de buques extranjeros como violaciones de la legislación nacional china."
 CHI_bo_ideological_consolidation: "Consolidación ideológica"
 CHI_bo_ideological_consolidation_desc: "Una campaña de clarificación ideológica refuerza los compromisos socialistas del partido y frena la deriva derechista. Las sesiones de estudio, las reuniones de rectificación y los planes de estudio revisados integran las dos reafirmaciones en todo el aparato estatal."
 CHI_bri_forum_momentum: "Impulso del Foro de la Franja y la Ruta"
 CHI_bri_forum_momentum_desc: "El Foro trienal de la Franja y la Ruta en Pekín ha reafirmado el compromiso de China con una globalización impulsada por las infraestructuras. Las delegaciones extranjeras se marchan con nuevos compromisos y nuestra diplomacia económica cosecha un beneficio plurianual."
 CHI_bri_industrial_zones_tier_1_idea: "Zonas Económicas Especiales I"
 CHI_bri_industrial_zones_tier_1_idea_desc: "Las zonas económicas especiales en el extranjero, construidas según el modelo chino, extienden nuestra base manufacturera más allá de nuestras fronteras."
 CHI_bri_industrial_zones_tier_2_idea: "Zonas Económicas Especiales II"
 CHI_bri_industrial_zones_tier_2_idea_desc: "Las zonas en el extranjero han madurado hasta convertirse en parques industriales operativos, y la experiencia en construcción revierte en los programas de edificación nacionales."
 CHI_bri_industrial_zones_tier_3_idea: "Zonas Económicas Especiales III"
 CHI_bri_industrial_zones_tier_3_idea_desc: "Una red de parques industriales gestionados por China vincula las economías de los socios a nuestras cadenas de suministro y a nuestra industria de la construcción."
 CHI_bri_mines_tier_1_idea: "Concesiones de recursos I"
 CHI_bri_mines_tier_1_idea_desc: "Las concesiones mineras aseguradas mediante préstamos a los Estados socios suministran materias primas de vuelta a la industria china."
 CHI_bri_mines_tier_2_idea: "Concesiones de recursos II"
 CHI_bri_mines_tier_2_idea_desc: "La cartera de concesiones se ha ampliado a varios sectores extractivos, profundizando la base de recursos disponible para nuestra economía."
 CHI_bri_mines_tier_3_idea: "Concesiones de recursos III"
 CHI_bri_mines_tier_3_idea_desc: "Las empresas chinas poseen participaciones de control en todo el sector extractivo de los socios, y el excedente que supera nuestras propias necesidades se revende con un margen de beneficio."
 CHI_bri_pipelines_tier_1_idea: "Arterias energéticas I"
 CHI_bri_pipelines_tier_1_idea_desc: "Los oleoductos y gasoductos de los Estados socios que abastecen a las refinerías chinas reducen nuestra exposición a los puntos de estrangulamiento marítimo de energía."
 CHI_bri_pipelines_tier_2_idea: "Arterias energéticas II"
 CHI_bri_pipelines_tier_2_idea_desc: "La ampliación de la capacidad de los oleoductos y gasoductos y los parques de tanques asociados nos permiten tanto extraer más combustible como mantener una mayor cantidad en reserva."
 CHI_bri_pipelines_tier_3_idea: "Arterias energéticas III"
 CHI_bri_pipelines_tier_3_idea_desc: "Las arterias energéticas terrestres evitan ahora por completo los puntos de estrangulamiento marítimos, y las infraestructuras de almacenamiento para explotarlas se están levantando a gran ritmo."
 CHI_bri_ports_tier_1_idea: "Red marítima I"
 CHI_bri_ports_tier_1_idea_desc: "Las terminales de contenedores operadas por China gestionan ahora una parte significativa del comercio de los Estados socios a lo largo de la ruta marítima, reforzando nuestra posición comercial ante las naciones por las que realizamos envíos."
 CHI_bri_ports_tier_2_idea: "Red marítima II"
 CHI_bri_ports_tier_2_idea_desc: "Las concesiones de terminales se han ampliado a contratos completos de desarrollo portuario. Los astilleros y muelles que nuestros contratistas construyen en el extranjero perfeccionan la experiencia que aportan a la construcción naval en el país."
 CHI_bri_ports_tier_3_idea: "Red marítima III"
 CHI_bri_ports_tier_3_idea_desc: "Una cadena de puertos comerciales, varios de ellos con muelles de doble uso e instalaciones de reabastecimiento, abarca ahora las rutas marítimas. El transporte comercial chino llega más lejos, y también lo hace la flota que lo protege."
 CHI_bri_powerplants_tier_1_idea: "Red de generación de energía I"
 CHI_bri_powerplants_tier_1_idea_desc: "La capacidad de generación construida en el extranjero por contratistas chinos mantiene la industria de los socios funcionando bajo nuestras condiciones, y nuestras propias plantas operan mejor gracias a la experiencia acumulada."
 CHI_bri_powerplants_tier_2_idea: "Red de generación de energía II"
 CHI_bri_powerplants_tier_2_idea_desc: "Una cartera más amplia de centrales de generación en el extranjero sostiene un mayor rendimiento industrial en el país."
 CHI_bri_powerplants_tier_3_idea: "Red de generación de energía III"
 CHI_bri_powerplants_tier_3_idea_desc: "La ingeniería china se ha convertido en el proveedor por defecto de la generación de energía en toda la red de socios, con la producción industrial nacional en sintonía con ello."
 CHI_bri_prestige_tier_1_idea: "Diplomacia de prestigio I"
 CHI_bri_prestige_tier_1_idea_desc: "La inversión visible en los Estados socios nos granjea una reputación de constructores antes que de acreedores."
 CHI_bri_prestige_tier_2_idea: "Diplomacia de prestigio II"
 CHI_bri_prestige_tier_2_idea_desc: "Se habla de la Franja y la Ruta como de un bien público. Mantener relaciones amistosas nos cuesta menos de lo que solía costarnos."
 CHI_bri_prestige_tier_3_idea: "Diplomacia de prestigio III"
 CHI_bri_prestige_tier_3_idea_desc: "Pekín es ahora el socio de primera opción en gran parte del mundo en desarrollo, y la posición que esto aporta se traduce directamente en capital político en el país."
 CHI_bri_railways_tier_1_idea: "Corredores terrestres I"
 CHI_bri_railways_tier_1_idea_desc: "Los enlaces ferroviarios transfronterizos vinculan las economías de los socios a la industria china, y el transporte de mercancías que circula por ellos nos granjea la buena voluntad de los Estados a los que sirven."
 CHI_bri_railways_tier_2_idea: "Corredores terrestres II"
 CHI_bri_railways_tier_2_idea_desc: "Los corredores funcionan ahora como arterias de carga programadas. El transporte terrestre fiable mantiene abastecidas a nuestras fuerzas allí donde el acceso marítimo sea incierto."
 CHI_bri_railways_tier_3_idea: "Corredores terrestres III"
 CHI_bri_railways_tier_3_idea_desc: "Una red terrestre continua se adentra en el interior de la masa continental. Nuestro cuerpo de ingeniería ferroviaria construye más rápido en el país gracias a la experiencia adquirida en el extranjero."
 CHI_bri_telecom_tier_1_idea: "Ruta de la Seda Digital I"
 CHI_bri_telecom_tier_1_idea_desc: "Las redes troncales construidas por China en los Estados socios otorgan a nuestros servicios visibilidad sobre el tráfico que las cruza, blindándonos contra la penetración de la inteligencia extranjera."
 CHI_bri_telecom_tier_2_idea: "Ruta de la Seda Digital II"
 CHI_bri_telecom_tier_2_idea_desc: "El control de la capa de equipamiento en las redes asociadas reduce el coste de mantenimiento de nuestras propias operaciones en el extranjero."
 CHI_bri_telecom_tier_3_idea: "Ruta de la Seda Digital III"
 CHI_bri_telecom_tier_3_idea_desc: "El corredor digital es nuestro de principio a fin: el hardware, el transporte de datos y los amarres de cables. El tráfico extranjero que pasa a través de él no es privado ni está seguro frente a nosotros."
 CHI_brokered_non_aggression_pact: "Pacto de no agresión mediado por Pekín"
 CHI_brokered_non_aggression_pact_desc: "China actúa como garante de nuestro acuerdo de no agresión con nuestro rival regional. Mientras el pacto se mantenga, ambos bandos se benefician de la estabilidad y de unos lazos más cercanos con Pekín."
 CHI_cadre_evaluation_reform_idea: "Reforma integral de la evaluación de cuadros"
 CHI_cadre_evaluation_reform_idea_desc: "Los funcionarios son evaluados ahora por su gestión medioambiental, la armonía social y la prestación de servicios públicos, junto con el crecimiento del PIB. Una menor dependencia de la producción intensiva en combustibles fósiles y un gasto público más eficiente reflejan una clase administrativa con mayor rendición de cuentas."
 CHI_cai_active_phase: "Acuerdo Integral sobre Inversiones UE-China"
 CHI_cai_active_phase_desc: "El Acuerdo Integral sobre Inversiones está en su fase activa. Los mercados europeos están totalmente abiertos a las exportaciones e inversiones chinas, los costes de los bienes de consumo han bajado y nuestra capacidad industrial se ha ampliado significativamente."
 CHI_cai_residual: "Legado duradero del CAI"
 CHI_cai_residual_desc: "Incluso después de que terminara la fase activa del Acuerdo Integral sobre Inversiones, la integración estructural con los mercados europeos persiste. Los lazos comerciales siguen siendo más cálidos de lo que habrían sido de otro modo."
 CHI_central_political_commission_1: "Comisión Central de Asuntos Políticos y Legales"
 CHI_central_political_commission_1_desc: "La Comisión Central de Asuntos Políticos y Legales tiene autoridad de supervisión sobre los tribunales, la fiscalía, el aparato de seguridad pública y los órganos de seguridad del Estado. Su misión principal es mantener el orden interno y garantizar que el sistema judicial sirva a los objetivos del partido en lugar de actuar como un control independiente. A medida que crece su peso dentro del comité, la capacidad de la comisión para anticiparse a los disturbios, procesar la disidencia de manera eficiente y coordinar las respuestas de seguridad entre agencias mejora sustancialmente."
 CHI_chinese_dream_momentum: "Impulso del Sueño Chino"
 CHI_chinese_dream_momentum_desc: "La narrativa del Sueño Chino moviliza un sentido público de propósito nacional. Se llama a los ciudadanos a servir a la renovación colectiva; los órganos del Partido informan de un aumento en las solicitudes de alistamiento y de muestras públicas de sentimiento patriótico. Por ahora, la historia es más cautivadora que el destino."
 CHI_chongqing_model_idea: "Modelo de Chongqing"
 CHI_chongqing_model_idea_desc: "Las empresas estatales anclan la inversión y marcan el ritmo de la economía en general. Los activos nacionalizados proporcionan una base fiscal para el gasto en bienestar social sin depender del capital extranjero o de los ingresos fiscales del sector privado."
 CHI_commercial_bank_law_idea: "Implementación de la Ley de Bancos Comerciales"
 CHI_commercial_bank_law_idea_desc: "Las revisiones de 2003 a la Ley de Bancos Comerciales imponen coeficientes de solvencia al estilo de Basilea, normas de clasificación de riesgos y juntas independientes a los Cuatro Grandes. Los costes de cumplimiento regulatorio aumentan durante la transición, pero el proceso de asignación de créditos sale del control político directo por primera vez."
 CHI_common_prosperity_framework: "Marco de Prosperidad Común"
 CHI_common_prosperity_framework_desc: "La intervención regulatoria en la educación privada, el entretenimiento y la tecnología se combina con una mayor inversión estatal en atención médica, infraestructura rural y seguridad social. La afirmación del Partido es que la prosperidad se vuelve común; el mecanismo es que el Estado determina qué significa prosperidad y quién la recibe primero."
 CHI_cpec_partner: "Corredor Económico China-Pakistán"
 CHI_cpec_partner_desc: "El paquete de inversiones del CPEC está reconfigurando la infraestructura pakistaní, con autopistas, proyectos energéticos y zonas industriales financiados por China que aceleran la actividad económica."
 CHI_crrc_idea1_desc: "China Railway Rolling Stock Corporation, el mayor proveedor de equipos ferroviarios del mundo, impulsa la construcción nacional de vías y terminales, así como la exportación de material rodante chino al extranjero."
 CHI_defiance_of_china: "Desafío a China"
 CHI_defiance_of_china_desc: "El Estado ha rechazado las exigencias chinas, ha resistido la presión económica y ha mantenido su posición en las zonas en disputa. Este acto de desafío conlleva un prestigio nacional significativo y puede alentar a otros actores regionales a endurecer sus propias posturas."
 CHI_diaoyu_patrol_regime: "Régimen de patrulla de las Diaoyu"
 CHI_diaoyu_patrol_regime_desc: "Las continuas rotaciones de la guardia costera cerca de aguas en disputa entrenan a las tripulaciones navales bajo condiciones realistas."
 CHI_digital_governance_spirit: "Gobernanza digital"
 CHI_digital_governance_spirit_desc: "Los sistemas de datos integrados vinculan las redes de vigilancia urbana, la monitorización de transacciones financieras y las puntuaciones de crédito social en una infraestructura de cumplimiento unificada. Los gobiernos locales procesan las solicitudes administrativas digitalmente y hacen cumplir las normas mediante alertas automatizadas. La interfaz burocrática entre el ciudadano y el Estado se simplifica, y el Estado está presente en cada punto de contacto."
 CHI_distant_water_fishing_fleets: "Flota pesquera de altura"
 CHI_distant_water_fishing_fleets_desc: "Subvencionada por Pekín y respaldada por empresas estatales, nuestra flota de altura es la más grande del mundo y opera en las zonas económicas exclusivas de África Occidental, América del Sur y el Pacífico Sur. Más allá de la seguridad alimentaria, los buques proyectan una presencia marítima persistente en aguas lejanas a nuestra costa, reforzando el principio de que los intereses chinos se extienden allí donde navegan los barcos chinos."
 CHI_divestiture_transition_idea: "Transición de desinversión"
 CHI_divestiture_transition_idea_desc: "Obligar al ejército a renunciar a sus ingresos comerciales para depender del presupuesto estatal deja una brecha que ninguna asignación cierra de la noche a la mañana. Las unidades acostumbradas a financiarse mediante hoteles, granjas y el comercio de armas ahora deben esperar a Pekín, y se gasta capital político para suavizar la pérdida. La tensión disminuye una vez que el sector de la defensa se reorganiza en conglomerados autofinanciados."
 CHI_dragon_king_ascendant: "El Rey Dragón ascendente"
 CHI_dragon_king_ascendant_desc: "Long Wang —el Rey Dragón— es el soberano tradicional de los cuatro mares en la cosmología china. Con el sistema tributario formalmente invocado y la presencia militar consolidada, el mar del Sur reconoce a un solo soberano: Pekín."
 CHI_eda_grey_market_idea: "Abastecimiento de EDA por canales grises"
 CHI_eda_grey_market_idea_desc: "Las empresas nacionales de diseño sin fábrica adquieren flujos de Synopsys y Cadence a través de empresas pantalla del sudeste asiático. El envío de diseños para fabricación (tape-outs) funciona, pero el suministro no es fiable y las actualizaciones de las herramientas van con meses de retraso respecto al mercado con licencia."
 CHI_eight_points_doctrine: "Los ocho puntos sobre Taiwán"
 CHI_eight_points_doctrine_desc: "La propuesta de ocho puntos de Jiang Zemin proporciona un marco doctrinal formal para la política a través del Estrecho, combinando propuestas para una reunificación pacífica con advertencias explícitas contra la independencia de jure. La planificación militar para operaciones de contingencia se ejecuta en paralelo a la vía diplomática, otorgando a Pekín un instrumento coercitivo creíble."
 CHI_etim_designation: "Marco de designación del ETIM"
 CHI_etim_designation_desc: "El marco bilateral antiterrorista apunta contra las redes separatistas del Turkestán Oriental."
 CHI_eu_market_access: "Acceso integral al mercado de la UE"
 CHI_eu_market_access_desc: "La ratificación de un marco integral de inversión con Bruselas abre un profundo acceso a los mercados de consumo y de capitales europeos, elevando los techos de exportación y suavizando el clima político para las empresas chinas en todo el bloque."
 CHI_grey_society_crisis_idea: "Crisis de la sociedad canas"
 CHI_grey_society_crisis_idea_desc: "La generación posterior a la política de hijo único en China soporta ahora una pirámide de edad invertida. Una fuerza laboral en contracción debe financiar a una cohorte de jubilados en constante aumento, lo que agota los presupuestos de pensiones y atención médica mientras el crecimiento de la productividad se estanca. La carga disminuirá únicamente cuando la población en edad de trabajar se estabilice.\n§W----------------§!\nEste espíritu nacional se §Reliminará§! cuando termine la misión §Y$CHI_grey_society_crisis$§!, diez años después de su inicio. Las decisiones de mitigación como §Y$CHI_pro_natalist_subsidies$§!, §Y$CHI_raise_retirement_age$§! y el §Y$CHI_automation_robotics_push$§! la acortan."
 CHI_guarantor_of_korean_peace: "Garante de la paz coreana"
 CHI_guarantor_of_korean_peace_desc: "Pekín es reconocido en toda la región como el garante indispensable de la estabilidad coreana. El prestigio que esto confiere perdura más allá de cualquier administración individual."
 CHI_gwadar_basing_rights: "Derechos de base en Gwadar"
 CHI_gwadar_basing_rights_desc: "El acceso a las instalaciones de aguas profundas de Gwadar extiende el alcance operativo de la Armada del Ejército Popular de Liberación a través del océano Índico y el mar Arábigo."
 CHI_ideological_rectification: "Rectificación ideológica"
 CHI_ideological_rectification_desc: "Las prohibiciones del Documento N.º 9 se aplican mediante sesiones de estudio obligatorias y campañas de autocrítica en universidades, organizaciones de medios de comunicación y empresas estatales. Los límites del discurso aceptable se contraen rápidamente. La lealtad se demuestra mediante el rechazo de los conceptos liberales occidentales, y los muros del perímetro ideológico se endurecen frente a la influencia extranjera."
 CHI_informal_sanctions: "Sanciones informales por el THAAD"
 CHI_informal_sanctions_desc: "Hemos impuesto sanciones económicas informales a Corea del Sur en respuesta al despliegue del THAAD. Los turistas chinos son redirigidos, los productos coreanos se enfrentan a barreras no arancelarias y las empresas coreanas que operan en nuestro territorio denuncian acoso oficial."
 CHI_information_warfare: "Aparato de guerra de la información"
 CHI_information_warfare_desc: "Los medios estatales y las plataformas digitales proyectan las narrativas chinas a nivel global al tiempo que contrarrestan las campañas de información hostiles."
 CHI_inner_party_supervision_idea: "Regulaciones de supervisión interna del Partido"
 CHI_inner_party_supervision_idea_desc: "Los procedimientos de supervisión formalizados exigen que los órganos superiores del partido inspeccionen e informen sobre los comités subordinados. Se refuerza la aplicación de las medidas contra la corrupción y se regulariza la rendición de cuentas política."
 CHI_international_department_1: "Departamento Internacional del Partido Comunista Chino"
 CHI_international_department_1_desc: "El Departamento Internacional lleva a cabo la diplomacia de partido a partido a nivel mundial, cultivando relaciones con partidos gobernantes, movimientos de oposición y fundaciones políticas en todas las regiones. También actúa como el principal hogar institucional para el alcance político de la Iniciativa de la Franja y la Ruta, coordinando la ejecución de proyectos, gestionando los beneficios de la participación de los países socios y encargándose de la reestructuración de la deuda cuando los gobiernos receptores se enfrentan a dificultades de reembolso. Ampliar la influencia de su cometido profundiza la red de socios extranjeros receptivos y mejora el rendimiento general de los compromisos de la Franja y la Ruta."
 CHI_international_sanctions: "Sanciones internacionales"
 CHI_international_sanctions_desc: "El apoyo de China a la agresión militar norcoreana ha desencadenado un régimen generalizado de sanciones internacionales. Se restringe el acceso comercial, la inversión extranjera se agota y el aislamiento diplomático se profundiza."
 CHI_Invigorate_Country_Through_STE1: "Fortalecer el país mediante la ciencia y la educación"
 CHI_Invigorate_Country_Through_STE1_desc: "La estrategia de fortalecer el país mediante la ciencia, la tecnología y la educación dirige la inversión estatal hacia los institutos de investigación y el sistema universitario. El dividendo de la investigación llega a costa de un presupuesto educativo más pesado."
 CHI_Invigorate_Country_Through_STE1_tt: "Impulso tecnológico anual para §Y$CAT_information_technology$§! o §Y$CAT_internet$§!"
 CHI_iron_brothers_joint_training: "Entrenamiento conjunto de Hermanos de Hierro"
 CHI_iron_brothers_joint_training_desc: "Los ejercicios conjuntos sostenidos con las fuerzas militares del socio han mejorado la cohesión de las unidades, el alineamiento doctrinal y la competencia en armas combinadas."
 CHI_jap_finlandized_sovereignty: "Soberanía finlandizada"
 CHI_jap_finlandized_sovereignty_desc: "Tokio conserva su parlamento, su prensa y su idioma. También mantiene su silencio sobre lo que Pekín hace más allá de sus fronteras."
 CHI_jap_forced_neutrality: "Neutralidad forzada"
 CHI_jap_forced_neutrality_desc: "La retirada de Japón del paraguas de seguridad estadounidense se produjo a punta de pistola. El tratado está firmado. La humillación es generacional."
 CHI_jap_historical_pressure: "Ofensiva histórica de China"
 CHI_jap_historical_pressure_desc: "Pekín ha reabierto la cuestión de la historia de la guerra, planteando las visitas al santuario Yasukuni, las controversias sobre los libros de texto y el legado de Nankín en todos los foros diplomáticos. La campaña inflama la opinión pública interna en Japón y erosiona la capacidad de Tokio para contrarrestar las operaciones de influencia china."
 CHI_japan_soft_power: "Acercamiento cultural sino-japonés"
 CHI_japan_soft_power_desc: "Los intercambios turísticos, los préstamos de pandas y las sesiones fotográficas ministeriales traducen la buena voluntad en capital político. Se suspende automáticamente si la agresión aumenta demasiado."
 CHI_japanese_cultural_imports: "Importaciones culturales japonesas con licencia"
 CHI_japanese_cultural_imports_desc: "Bilibili transmite a Studio Ghibli. Tencent obtiene la licencia de Demon Slayer. El ala juvenil del Partido estudia los informes de Wang Huning sobre la absorción cultural."
 CHI_joint_command_consultations: "Consultas de mando conjunto"
 CHI_joint_command_consultations_desc: "Las consultas estratégicas periódicas entre los mandos militares chinos y norcoreanos están mejorando la coordinación y reduciendo el riesgo de errores de cálculo."
 CHI_joint_venture_era_idea: "Era industrial de empresas conjuntas"
 CHI_joint_venture_era_idea_desc: "Las empresas conjuntas entre socios nacionales y extranjeros se convierten en el principal vehículo para la adquisición de tecnología, la transferencia de conocimientos de gestión y el acceso a las redes de distribución mundiales."
 CHI_kaesong_co_developer: "Codesarrollador de Kaesong"
 CHI_kaesong_co_developer_desc: "Empresas de construcción y operadores logísticos chinos gestionan empresas conjuntas dentro de la zona ampliada de Kaesong. Las cadenas de suministro compartidas reducen los costes y vinculan las reputaciones."
 CHI_kor_beijing_pressure: "Campaña de presión de Pekín"
 CHI_kor_beijing_pressure_desc: "La sostenida presión económica y diplomática de China está minando la confianza del público surcoreano y reduciendo el margen de Seúl para aplicar una política independiente. El gobierno se enfrenta a un creciente descontento interno y a un margen de maniobra cada vez menor frente a Pekín."
 CHI_kor_beijing_security_guarantee: "Garantía de seguridad de Pekín"
 CHI_kor_beijing_security_guarantee_desc: "Bajo una garantía de seguridad formal de China, Corea del Sur se libera de su dependencia del paraguas nuclear estadounidense. La planificación de la defensa se reorienta en torno a la cooperación con Pekín, reduciendo las cargas de reclutamiento y estabilizando el clima político."
 CHI_kor_exit_trilateral: "Salida del marco trilateral"
 CHI_kor_exit_trilateral_desc: "Corea del Sur se ha retirado del marco de defensa trilateral EE. UU.-Japón-Corea del Sur. La decisión refleja el criterio de Seúl de que la orientación antichina del marco es incompatible con sus intereses económicos y sus objetivos de autonomía estratégica."
 CHI_kor_strategic_autonomy_doctrine: "Doctrina de autonomía estratégica"
 CHI_kor_strategic_autonomy_doctrine_desc: "Corea del Sur ha adoptado una doctrina de autonomía estratégica que distancia a Seúl de la arquitectura de Washington para el Indo-Pacífico. La postura de defensa de Corea se reorienta hacia la autosuficiencia y el multilateralismo regional, en lugar de hacia la gestión de la alianza con los EE. UU."
 CHI_korean_tributary: "Relación tributaria de Corea del Norte"
 CHI_korean_tributary_desc: "La subordinación política de Corea del Norte a Pekín ha recreado, en una forma institucional moderna, la relación tributaria que regía las relaciones sino-coreanas antes de 1895. El acceso de China a los puertos, mercados y espacio estratégico coreanos está garantizado formalmente."
 CHI_kpa_intelligence_penetration: "Penetración de inteligencia en el EPC"
 CHI_kpa_intelligence_penetration_desc: "Los servicios de inteligencia chinos han cultivado una red de activos dentro del Ejército Popular de Corea. El conocimiento en tiempo real de la planificación militar norcoreana y de la política interna otorga a Pekín una palanca sin precedentes sobre Pionyang."
 CHI_lithium_supply_chain_locked: "Cadena de suministro del Triángulo del Litio"
 CHI_lithium_supply_chain_locked_desc: "Los acuerdos de compra a largo plazo con productores argentinos, bolivianos y chilenos garantizan a los fabricantes de baterías chinos el litio que necesitan, suavizando las curvas de eficiencia y aportando un margen de crecimiento a la industria civil."
 CHI_long_range_firepower_idea: "Potencia de fuego de largo alcance"
 CHI_long_range_firepower_idea_desc: "La potencia de fuego de largo alcance nos permite diezmar las posiciones de vanguardia y los centros logísticos del enemigo mucho antes de que nuestras fuerzas principales entren en contacto directo."
 CHI_lotte_market_correction: "Corrección de mercado de Lotte"
 CHI_lotte_market_correction_desc: "Las operaciones de Lotte Group en China se han visto obligadas a una contracción gestionada, liberando cuota de mercado para los competidores nacionales. El ajuste reduce las salidas de bienes de consumo y demuestra la utilidad política de las represalias económicas selectivas."
 CHI_lunar_legacy_industrial: "El Palacio Celestial hecho realidad"
 CHI_lunar_legacy_industrial_desc: "Tiangong significa Palacio Celestial, y por primera vez en la historia hay uno en órbita permanente, construido enteramente por manos chinas. Las fábricas, fundiciones y naves de ensamblaje que lo levantaron vuelven ahora su demostrada disciplina hacia la Tierra. Lo que puede elevar una estación a la órbita puede construir cualquier cosa aquí abajo."
 CHI_lunar_legacy_military: "Cruzando el Puente de las Urracas"
 CHI_lunar_legacy_military_desc: "Queqiao, el Puente de las Urracas, retransmitió nuestras señales desde la cara oculta de la Luna, bautizado así por el puente de aves que una vez permitió que dos amantes se encontraran en los cielos. Las tripulaciones que se entrenaron para la misión más difícil jamás intentada regresaron templadas y seguras de sí mismas. Una fuerza que puede llegar a la Luna no responde con dudas ante ningún desafío en la Tierra."
 CHI_lunar_legacy_political: "Chang'e asciende a los cielos"
 CHI_lunar_legacy_political_desc: "En el viejo mito, Chang'e bebió el elixir y voló a la Luna, dejando a su esposo Hou Yi contemplando el firmamento para siempre. Ahora su nombre ha llevado a una nación real a la superficie lunar, y el pueblo ve en ello la prueba de que China pertenece a la primera línea de las potencias. El alunizaje se convierte en una fuente de prestigio que ningún rival puede arrebatar."
 CHI_lunar_legacy_research: "Las preguntas de Tianwen"
 CHI_lunar_legacy_research_desc: "Tianwen, las Preguntas Celestiales, toma su nombre del antiguo poema de Qu Yuan que interrogaba el orden del cosmos. Los vehículos de exploración Yutu y las muestras lunares respondieron a preguntas que ninguna nación había contestado antes, y los laboratorios que las descodificaron están hambrientos de más. Un estamento científico validado frente a la Luna se extiende ahora hacia cada frontera científica."
 CHI_mass_line_bo_campaign: "Campaña de la Línea de Masas"
 CHI_mass_line_bo_campaign_desc: "Los cuadros se despliegan por todo el campo y en las fábricas para recopilar opiniones y demostrar el compromiso del partido con el pueblo. La campaña eleva la conciencia política y canaliza la energía popular detrás de los objetivos del partido."
 CHI_mazu_blessing: "Bendición de Mazu"
 CHI_mazu_blessing_desc: "Mazu, la Diosa del Mar y protectora de los marineros, es venerada en todo el litoral del mar de la China Meridional. Su bendición templaria ha sido formalmente invocada para la Flota del Mar del Sur. La ceremonia se celebra en toda la flota y refuerza el espíritu de cuerpo."
 CHI_media_offensive: "Ofensiva mediática global"
 CHI_media_offensive_desc: "CGTN, Xinhua y las plataformas de redes sociales coordinan una campaña global que proyecta las perspectivas chinas."
 CHI_militia_deployed: "Milicia marítima activa"
 CHI_militia_deployed_desc: "Los buques de la milicia marítima china están desplegados en posiciones avanzadas en la zona en disputa, manteniendo una presencia persistente bajo cobertura civil. Su presencia impide que los buques de la guardia costera rivales se acerquen sin desencadenar una crisis."
 CHI_monroe_inverted: "Doctrina Monroe invertida"
 CHI_monroe_inverted_desc: "Hemos desplazado a Washington como el principal socio externo de América Latina, anclando un realineamiento hemisférico que reduce el coste de las relaciones y atrae la opinión regional hacia nosotros."
 CHI_national_humiliation: "Humillación nacional"
 CHI_national_humiliation_desc: "Un revés diplomático o militar chino en el mar de la China Meridional se ha enmarcado internamente como una continuación del Siglo de la Humillación. La opinión pública está enardecida; el liderazgo se enfrenta a una intensa presión para recuperar el prestigio por otros medios."
 CHI_national_security_commission_1: "Comisión de Seguridad Nacional del Partido Comunista Chino"
 CHI_national_security_commission_1_desc: "Establecida en 2013-2014 bajo el mandato de Xi Jinping, la Comisión de Seguridad Nacional se sitúa en la cúspide de la arquitectura de seguridad de China, coordinando las funciones de inteligencia, militares, cibernéticas y de contrainteligencia bajo la dirección directa del partido en lugar de a través del Consejo de Estado. Su creación supuso una centralización deliberada de todas las decisiones estratégicas de seguridad. A medida que se profundiza la influencia de la comisión dentro del comité, su autoridad de coordinación se vuelve más integral y su capacidad para responder a las amenazas de seguridad internas y externas se torna más unificada y decisiva."
 CHI_nepal_himalayan_friendship: "Iniciativa de Amistad del Himalaya"
 CHI_nepal_himalayan_friendship_desc: "La inversión y la buena voluntad de China fluyen hacia Nepal bajo un marco de cooperación que respeta la neutralidad de Katmandú, al tiempo que atrae al país hacia la órbita económica de Pekín."
 CHI_neutral_interlocutor: "Interlocutor neutral"
 CHI_neutral_interlocutor_desc: "Nos hemos posicionado como la única potencia con la que ambas Coreas pueden hablar. El papel conlleva influencia, y también expectativas."
 CHI_nko_blue_sky_mobilization: "Movilización Cielo Azul"
 CHI_nko_blue_sky_mobilization_desc: "El EPC ha entrado en plena movilización de combate en coordinación con los objetivos estratégicos chinos. Se han cancelado todos los permisos y las unidades de vanguardia se están trasladando a sus posiciones de asalto."
 CHI_nko_chinese_economic_sphere: "Esfera económica china"
 CHI_nko_chinese_economic_sphere_desc: "La economía de Corea del Norte se ha incorporado formalmente a la esfera industrial de China. Las empresas estatales chinas gestionan sectores clave, se normalizan los acuerdos de paridad cambiaria y el won norcoreano se vincula al renminbi."
 CHI_nko_energy_aid: "Ayuda energética china"
 CHI_nko_energy_aid_desc: "Las transferencias de fuelóleo y electricidad desde Dandong mantienen las fábricas en funcionamiento y las luces encendidas. Los subsidios de Pekín conllevan expectativas discretas."
 CHI_nko_food_package: "Paquete alimentario chino"
 CHI_nko_food_package_desc: "Los envíos de grano canalizados a través de los pasos fronterizos de Tumen están aliviando la escasez crónica. La ayuda compra un respiro político dentro del Partido."
 CHI_nko_infrastructure_investment: "Inversión china en infraestructura"
 CHI_nko_infrastructure_investment_desc: "Las brigadas de construcción chinas están reconstruyendo la infraestructura norcoreana a gran escala. Las carreteras, los ferrocarriles, los puertos y las redes eléctricas se modernizan bajo contratos que vinculan los recursos norcoreanos a las cadenas industriales chinas durante una generación."
 CHI_nko_offensive_readiness: "Preparación ofensiva del EPC"
 CHI_nko_offensive_readiness_desc: "Con el respaldo logístico chino, el Ejército Popular de Corea ha pasado de una postura defensiva a una optimizada para operaciones ofensivas rápidas hacia el sur a través del paralelo 38."
 CHI_nko_security_assurance: "Garantía de seguridad china"
 CHI_nko_security_assurance_desc: "Pekín ha ofrecido un respaldo discreto pero firme contra el colapso del régimen. La garantía estabiliza al círculo interno y atenúa la presión de movilización."
 CHI_npm_red_banner_insurgency: "Insurgencia respaldada por China"
 CHI_npm_red_banner_insurgency_desc: "La red encubierta de Pekín mantiene abastecidas a las columnas maoístas de fusiles, municiones y entrenamiento de cuadros. El Ejército Popular de Liberación considera a Nepal un terreno de prueba para la exportación revolucionaria, y espera un rendimiento de su inversión."
 CHI_nrcms_rollout_idea: "Nuevo Sistema Médico Cooperativo Rural"
 CHI_nrcms_rollout_idea_desc: "Las aportaciones unificadas de los residentes rurales, el gobierno local y el presupuesto central cubren ahora los costes médicos catastróficos de cientos de millones de agricultores, mejorando la salud pública y reduciendo el impacto financiero de la enfermedad en los hogares rurales."
 CHI_organisation_department_1: "Departamento de Organización del Partido Comunista Chino"
 CHI_organisation_department_1_desc: "El Departamento de Organización controla todas las decisiones de personal del partido: nombramientos, ascensos, evaluaciones y disciplina en todos los niveles de la jerarquía del PCCh. Su alcance se extiende a las empresas estatales y los ministerios del gobierno, convirtiéndolo en el instrumento más poderoso de cohesión interna del partido. A medida que se profundiza la influencia de la comisión dentro del Comité Permanente, su control sobre la selección de cuadros se endurece y su capacidad para hacer cumplir las directivas centrales a través del aparato crece en consecuencia."
 CHI_pacific_basing_rights: "Bases en la Segunda Cadena de Islas"
 CHI_pacific_basing_rights_desc: "Los derechos negociados de base y reabastecimiento en la profundidad de la Segunda Cadena de Islas otorgan a la Armada del EPL alcance estratégico, cadenas logísticas más cortas y un mantenimiento en astilleros más rápido para despliegues en alta mar."
 CHI_pacific_diplomatic_setback: "Revés diplomático en el Pacífico"
 CHI_pacific_diplomatic_setback_desc: "Un fracaso de alto perfil en las islas del Pacífico ha endurecido a las capitales regionales contra nuestras iniciativas, elevando el coste político de cada iniciativa diplomática posterior."
 CHI_pacific_security_lead: "Liderazgo de seguridad en el Pacífico"
 CHI_pacific_security_lead_desc: "Los acuerdos de acceso avanzado y los despliegues rotatorios en las islas del Pacífico extienden el alcance operativo de la Armada del EPL y aceleran la infraestructura de bases que la sustenta."
 CHI_paf_maritime_militia: "Milicia Marítima de las PAF"
 CHI_paf_maritime_militia_desc: "Flotas pesqueras civiles organizadas bajo mando militar. Denegación plausible en el mar, números reales cuando es necesario."
 CHI_party_century_endures: "El Partido que perdura"
 CHI_party_century_endures_desc: "El Pensamiento de Xi Jinping está integrado en la estructura constitucional y organizativa del Partido como un marco operativo permanente. El sistema de Congresos, el Politburó y la Comisión Militar Central se reafirman como los motores duraderos de la gobernanza. El Partido que sobrevivió a la muerte de Mao, a la Revolución Cultural y a Tiananmen está diseñado para durar más que cualquier individuo, incluido su actual líder supremo."
 CHI_patriotic_education_mandate: "Mandato de educación patriótica"
 CHI_patriotic_education_mandate_desc: "Los planes de estudio revisados garantizan que ningún estudiante chino olvide lo que se hizo en Nankín, en Pingdingshan y en las celdas prefabricadas de la Unidad 731. La estabilidad se fortalece; también lo hace la sospecha hacia las ideas extranjeras."
 CHI_pearls_economic_partner: "Asociación estratégica china"
 CHI_pearls_economic_partner_desc: "Albergar la logística naval china ha desbloqueado la generosidad económica de Pekín, haciendo fluir fondos de modernización portuaria y créditos de infraestructura hacia el Estado receptor."
 CHI_personal_rule_mandate: "Mandato de mandato personal"
 CHI_personal_rule_mandate_desc: "La Asamblea Nacional Popular de 2018 eliminó los límites de los mandatos presidenciales de la constitución, consolidando la autoridad en torno al líder supremo de forma permanente. La dirección estratégica y la lealtad política fluyen ahora a través de un único centro, aumentando el Apoyo Bélico pero reduciendo el espacio para la iniciativa entre los comandantes de campo."
 CHI_petrodollar_breaks: "Paridad del petroyuan alcanzada"
 CHI_petrodollar_breaks_desc: "El petróleo del Golfo cotizado en yuanes, las líneas de intercambio de los bancos centrales en todo el Sur Global y las alternativas a SWIFT han erosionado la prima de reserva del dólar, traduciendo la influencia monetaria en poder político y confianza demográfica."
 CHI_pla_basing_economic_help: "Asociación económica china"
 CHI_pla_basing_economic_help_desc: "A cambio de albergar la logística de la Armada del EPL, recibimos un apoyo económico sostenido de China: mercados de exportación ampliados, modernización de fábricas civiles y respaldo político en los foros regionales."
 CHI_policy_bank_lending_idea: "Campaña de préstamos de bancos de desarrollo político"
 CHI_policy_bank_lending_idea_desc: "El Banco de Desarrollo de China, el EximBank y el ADBC emiten líneas de crédito preferenciales a empresas estatales y gobiernos provinciales, acelerando la inversión en activos fijos en transporte, energía e infraestructura en el extranjero. La ola de préstamos impulsa la producción de la construcción, pero inmoviliza los ahorros de los hogares en depósitos de bajo rendimiento."
 CHI_princeling_economic_leverage: "Influencia económica de los «principitos»"
 CHI_princeling_economic_leverage_desc: "Una red de lazos comerciales transfronterizos vincula ahora a las élites norcoreanas con el capital chino. Cada transacción profundiza la dependencia."
 CHI_property_sector_contraction_idea: "Contracción del sector inmobiliario"
 CHI_property_sector_contraction_idea_desc: "Las Tres Líneas Rojas obligan a los principales promotores a un desapalancamiento simultáneo. Los inicios de construcción se desploman, los ingresos por venta de terrenos a nivel de gobiernos locales se evaporan y las redes de proveedores de cemento, acero y electrodomésticos sufren a su vez. La economía en general absorbe el impacto a medida que la burbuja inmobiliaria se desinfla a la fuerza."
 CHI_property_tax_pilot_idea: "Piloto del impuesto sobre la propiedad"
 CHI_property_tax_pilot_idea_desc: "Shanghái y Chongqing imponen impuestos moderados a las segundas viviendas y a las propiedades de gran valor, frenando la inversión especulativa y diversificando los ingresos de los gobiernos locales para reducir la dependencia de las ventas de terrenos."
 CHI_publicity_department_1: "Departamento de Publicidad del Partido Comunista Chino"
 CHI_publicity_department_1_desc: "El Departamento de Publicidad establece la línea ideológica para todos los medios impresos, de radiodifusión y digitales en China, dirigiendo la censura, el marco narrativo y la proyección interna de la legitimidad del partido. También coordina la infraestructura de mensajes en el extranjero, incluida la expansión de los medios estatales y las asociaciones de contenido en el extranjero. Una mayor influencia de su cometido se traduce en un entorno de información más coherente y enérgico, reforzando la estabilidad social y el apoyo popular a las prioridades del partido."
 CHI_qccm_coordination_cell: "Célula de coordinación del QCCM"
 CHI_qccm_coordination_cell_desc: "El intercambio de inteligencia cuadrilateral a través del corredor de Pamir vincula los servicios de seguridad de China, Pakistán, Afganistán y Tayikistán."
 CHI_raj_foreign_defense_pressure: "Presión de China"
 CHI_raj_foreign_defense_pressure_desc: "El pivote de Pekín hacia el sur de Asia ha ejercido una presión diplomática e informativa sostenida sobre Nueva Delhi, estrechando las opciones estratégicas de la India a lo largo de sus fronteras septentrional y oriental."
 CHI_rason_investment_flow: "Programa de inversión en Rason"
 CHI_rason_investment_flow_desc: "El capital chino fluye hacia la Zona Económica Especial de Rason, financiando infraestructuras, capacidad industrial e instalaciones portuarias. El experimento está dando resultados visibles."
 CHI_rason_port_access: "Acceso al puerto de Rason"
 CHI_rason_port_access_desc: "Nuestros buques disponen ahora de un acceso fiable al puerto de aguas profundas de Rason, lo que otorga a la Armada del Ejército Popular de Liberación una posición estratégica en el mar de Japón."
 CHI_rcep_member: "Miembro fundador del RCEP"
 CHI_rcep_member_desc: "Coanclamos la Asociación Económica Integral Regional junto a Tokio y Seúl. Los aranceles bajan, las cadenas de suministro se consolidan y la ausencia estadounidense se convierte en la norma regional."
 CHI_reconstruction_plan_idea: "Plan de capacidad de reconstrucción"
 CHI_reconstruction_plan_idea_desc: "Equipos preposicionados, protocolos estandarizados y unidades de ingeniería especializadas del ejército nos otorgan una ventaja de velocidad excepcional para reparar infraestructuras e industrias tras catástrofes."
 CHI_regional_crisis_alert: "Alerta de crisis regional"
 CHI_regional_crisis_alert_desc: "La postura de seguridad china en la península de Corea ha provocado una elevada preparación combativa en toda la región. La cohesión de las alianzas está bajo tensión."
 CHI_reunion_humanitarian_lead: "Liderazgo en diplomacia humanitaria"
 CHI_reunion_humanitarian_lead_desc: "Nuestra coordinación de las reuniones de familias divididas a través de la frontera ha generado una buena voluntad inusualmente amplia. Los ministerios de Asuntos Exteriores acogen con agrado el contacto y los medios de comunicación nacionales lo amplifican."
 CHI_rmb_promotion: "Internacionalización del RMB"
 CHI_rmb_promotion_desc: "El renminbi se acepta cada vez más como moneda de reserva internacional mediante acuerdos bilaterales de intercambio de divisas."
 CHI_russian_arms_dependency: "Dependencia de las armas rusas"
 CHI_russian_arms_dependency_desc: "El Ejército Popular de Liberación se construyó sobre diseños soviéticos y rusos. Sus armas ligeras comenzaron como el Tipo 56, un Kalashnikov bajo licencia, y su cuerpo blindado creció a partir del Tipo 59, una copia directa del T-54A soviético; los tanques y vehículos de combate de infantería posteriores siguen reflejando el linaje del T-72 y el BMP. La artillería, los transportes y las baterías de defensa aérea comparten la misma ascendencia. La dependencia es más profunda en la propulsión: el AL-31F propulsa al J-10 y al J-11, el RD-93 hace volar al JF-17, y los cazas Su-35 y las baterías S-400 se compraron directamente a Moscú. Cada línea de cazas nacionales depende de una turbina rusa, cada modelo bajo licencia paga regalías y las oficinas de diseño siguen copiando más de lo que crean. Hasta que China forje su propia base militar-industrial, el latido del corazón del ejército estará fijado en Rusia.\n§W--------------§!\nNuestra autosuficiencia militar aumenta a través de los enfoques de la industria de defensa como §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§! y §Y$CHI_ws15_bottleneck_solve$§!, y a través de las decisiones §Y$CHI_invest_domestic_arms_lines$§! y §Y$CHI_localise_licensed_system$§!. Este espíritu nacional §Gmejorará§! una vez que la autosuficiencia supere el §Y25§!."
 CHI_sanctions_immunity_partial: "Línea de vida comercial liquidada en yuanes"
 CHI_sanctions_immunity_partial_desc: "Los contratos de energía y bienes denominados en renminbi con socios sancionados atenúan el impacto de la presión financiera occidental, aliviando la presión sobre los consumidores y manteniendo abiertos los canales de exportación."
 CHI_sars_outbreak_uncontrolled_idea: "Epidemia de SARS"
 CHI_sars_outbreak_uncontrolled_idea_desc: "El fracaso a la hora de coordinar una respuesta de emergencia oportuna permitió que el SARS se extendiera por múltiples provincias antes de que se aplicaran las medidas de cuarentena. Nuestra notificación internacional tardía ha dañado nuestra reputación en el extranjero y ha causado importantes perturbaciones económicas en el país."
 CHI_sars_response_effective_idea: "SARS contenido"
 CHI_sars_response_effective_idea_desc: "Nuestro marco de respuesta a emergencias permitió una cuarentena rápida, una notificación internacional oportuna y una acción médica coordinada. El brote está contenido, con perturbaciones económicas limitadas y nuestra reputación internacional intacta."
 CHI_scientific_outlook_idea_1: "Preparación de la Perspectiva Científica del Desarrollo"
 CHI_scientific_outlook_idea_1_desc: "Estamos reorientando la política nacional, alejándola del crecimiento centrado primero en el PIB hacia indicadores sociales y medioambientales más amplios bajo la Perspectiva Científica del Desarrollo."
 CHI_scientific_outlook_idea_1_tt: "Tiempo de finalización del enfoque §Y$CHI_scientific_outlook_on_development$§! §G-35§! §Ydías§!"
 CHI_sco_dialogue_partner: "Socio de diálogo de la OCS"
 CHI_sco_dialogue_partner_desc: "Este país ha sido aceptado como socio de diálogo de la Organización de Cooperación de Shanghái, abriendo la puerta a un compromiso político y económico más profundo con los Estados miembros."
 CHI_sco_member: "Miembro de la OCS"
 CHI_sco_member_desc: "Este país es miembro de pleno derecho de la Organización de Cooperación de Shanghái, participando en todos los marcos de cooperación política, económica y de seguridad establecidos por la organización."
 CHI_sco_member_econ_desc: "Este país es miembro de pleno derecho de la Organización de Cooperación de Shanghái con énfasis en la cooperación económica, obteniendo vínculos comerciales y de inversión mejorados con los demás Estados miembros."
 CHI_sco_member_mil_desc: "Este país es miembro de pleno derecho de la Organización de Cooperación de Shanghái con énfasis en la cooperación militar, participando en ejercicios conjuntos y operaciones de seguridad."
 CHI_sco_member_pol_desc: "Este país es miembro de pleno derecho de la Organización de Cooperación de Shanghái con énfasis en la cooperación política, obteniendo marcos de gobernanza y antisubversión más sólidos."
 CHI_sco_observer: "Observador de la OCS"
 CHI_sco_observer_desc: "Este país ostenta el estatus de observador dentro de la Organización de Cooperación de Shanghái, lo que le otorga acceso a los foros de la OCS y a una cooperación económica limitada, al tiempo que mantiene su soberanía sobre las decisiones de alineamiento político."
 CHI_scs_chinese_debt: "Dependencia de la deuda china"
 CHI_scs_chinese_debt_desc: "Las obligaciones de los préstamos de la Franja y la Ruta han otorgado a Pekín una capacidad de influencia significativa sobre el cálculo de la política exterior del socio endeudado. Los requisitos del servicio de la deuda limitan la libertad del gobierno para adoptar posturas hostiles a los intereses chinos."
 CHI_scs_claimant_under_pressure: "Bajo presión china"
 CHI_scs_claimant_under_pressure_desc: "El dominio chino del mar de la China Meridional ha hecho que cada decisión relacionada con las islas Spratly sea más costosa para este gobierno. La opinión pública interna está dividida entre la aceptación y la resistencia; la penalización de Poder Político en las decisiones del mar de la China Meridional refleja la dificultad de trazar cualquier rumbo mientras Pekín fije las condiciones."
 CHI_scs_de_facto_sovereignty: "Soberanía de facto"
 CHI_scs_de_facto_sovereignty_desc: "A través de una paciente diplomacia bilateral y la acumulación de acuerdos, las reclamaciones de China en el mar de la China Meridional se han convertido en la opción por defecto en la región. Ningún reclamante impugna ahora formalmente el acuerdo; las potencias externas carecen de los instrumentos legales para desafiar lo que los Estados vecinos ya han aceptado."
 CHI_scs_jdz_revenue: "Ingresos por desarrollo conjunto"
 CHI_scs_jdz_revenue_desc: "La extracción de hidrocarburos de las zonas de desarrollo conjunto está generando ingresos compartidos tanto para nosotros como para nuestro Estado socio. Los ingresos petroleros fluyen hacia el Estado correspondiente de las Spratly en ambos lados del acuerdo mientras dure el pacto, otorgando a ambos gobiernos un interés concreto en la continuidad del marco bilateral y complicando cualquier giro de vuelta hacia la confrontación."
 CHI_scs_setback: "Revés en el mar de la China Meridional"
 CHI_scs_setback_desc: "Un enfrentamiento ha terminado de forma desfavorable, una iniciativa diplomática ha sido rechazada públicamente o un fallo internacional ha ido en contra de las reclamaciones chinas. El revés reduce la variable del Marco del Mar de la China Meridional (SCS) y puede invitar a respuestas oportunistas de otros reclamantes."
 CHI_sea_eagles_carrier_wing_idea: "$CHI_sea_eagles_carrier_wing$"
 CHI_sea_eagles_carrier_wing_idea_desc: "[CHI_sea_eagles_carrier_wing_idea_tt]"
 CHI_selective_anti_corruption_campaign_idea: "Campaña selectiva contra la corrupción"
 CHI_selective_anti_corruption_campaign_idea_desc: "Los procesamientos selectivos suprimen la corrupción más flagrante y eliminan a los intermediarios de poder rivales, pero el carácter selectivo y político de la aplicación de la ley crea incertidumbre institucional y reprime la iniciativa propia."
 CHI_self_reliant_path_idea: "Los dolores de crecimiento del Taihang"
 CHI_self_reliant_path_idea_desc: "La autosuficiencia se paga con turbinas incendiadas y escuadrones en tierra. El prematuro WS-10 Taihang se ahoga en su propia ambición, sus álabes se agrietan y su vida útil se mide en apenas unas horas; las tripulaciones pagan el precio de cada lección que los ingenieros aún tienen que aprender. Las oficinas técnicas lo lograrán, pero hasta que lo hagan, la flota vuela por fe."
 CHI_sez_japanese_investors: "ZEE para inversores japoneses"
 CHI_sez_japanese_investors_desc: "Concesiones especiales para Toyota, Sony y Panasonic. La estrategia «China-Plus-One» se revierte al hacer que sea imposible marcharse de China."
 CHI_sino_japanese_understanding: "Entendimiento estratégico sino-japonés"
 CHI_sino_japanese_understanding_desc: "La arquitectura tácita de la distensión: flujos comerciales, reuniones ministeriales y un acuerdo implícito para dejar la historia en los archivos. Se pierde permanentemente si la agresión sino-japonesa vuelve a aumentar."
 CHI_smic_foundry_base: "Base de fundición de SMIC"
 CHI_smic_foundry_base_desc: "El complejo Zhangjiang de SMIC proporciona una plataforma de producción cualificada de 28 nm para los clientes nacionales de diseño sin fábrica. La capacidad cautiva de la fundición reduce la dependencia de China de TSMC para la lógica de nodos maduros y proporciona una base de referencia para el posterior desarrollo de procesos nacionales."
 CHI_society_department_1: "Departamento de Trabajo Social"
 CHI_society_department_1_desc: "Establecido en 2023, el Departamento de Trabajo Social consolidó la supervisión del PCCh sobre las organizaciones sociales de base, las ONG, los sindicatos y el sistema de peticiones que anteriormente se encontraban dispersos en múltiples agencias. Su cometido es garantizar que la sociedad civil opere dentro de los parámetros fijados por el partido y que las quejas populares se canalicen hacia salidas gestionadas en lugar de hacia una movilización independiente. La creciente influencia de la comisión permite al departamento ampliar su alcance organizativo y perfeccionar los mecanismos mediante los cuales se absorben y desactivan las presiones sociales."
 CHI_sovereign_wealth_diversification_idea: "Diversificación de riqueza soberana de China Investment Corporation"
 CHI_sovereign_wealth_diversification_idea_desc: "China Investment Corporation rota las reservas de divisas fuera de los bonos del Tesoro estadounidense de bajo rendimiento hacia el capital privado global, las infraestructuras y las participaciones estratégicas en acciones. La cartera genera mayores rendimientos que la base de reservas y otorga a Pekín posiciones estructurales en los mercados de capitales extranjeros."
 CHI_state_tolerated_boycott: "Boicot tolerado por el Estado"
 CHI_state_tolerated_boycott_desc: "Manifestaciones antijaponesas que la policía no disolverá, hasta que decida hacerlo. Los consumidores patriotas redirigen sus gastos. Algunos minoristas chinos también sufren pérdidas."
 CHI_streamline_the_ranks_idea: "Optimización de los rangos"
 CHI_streamline_the_ranks_idea_desc: "A partir de finales de la década de 1990, el Ejército Popular de Liberación prescindió de cientos de miles de efectivos, cambiando una inflada fuerza de movilización masiva por un ejército profesional más pequeño estructurado en torno a brigadas. La transición satura las cadenas de entrenamiento e inmoviliza a la industria.\n\n§YEsta penalización desaparecerá una vez que se cumplan ambas condiciones:§!\n§Y-§! El ejército esté por debajo de las §Y[?CHI_streamline_div_baseline|0]§! divisiones.\n§Y-§! Las reservas de armas de infantería, artillería y chasis de tanques medios mantengan, cada una, un excedente por encima del §Y10%§! de las necesidades del ejército."
 CHI_strike_black_sing_red_idea: "Golpear lo negro, cantar lo rojo"
 CHI_strike_black_sing_red_idea_desc: "Miles de funcionarios y figuras del crimen organizado han sido arrestados y sus redes desmanteladas. Los eventos masivos de cultura roja inundan la esfera pública de fervor patriótico, elevando la moral y la lealtad hacia el partido."
 CHI_succession_roadmap: "Hoja de ruta de la sucesión"
 CHI_succession_roadmap_desc: "La identificación y preparación de un sucesor designado señala a las instituciones del Partido que la transición del poder será gestionada en lugar de disputada. Los socios internacionales interpretan el marco de sucesión como una prueba de estabilidad sistémica. La prima de riesgo político en los acuerdos a largo plazo con China se reduce, al menos mientras dure este acuerdo."
 CHI_summit_host: "Anfitrión de la cumbre"
 CHI_summit_host_desc: "Pekín alberga activamente delicadas conversaciones regionales. El ancho de banda diplomático es alto y las herramientas de presión conllevan una fuerza adicional."
 CHI_taiwan_strait_pressure_spirit: "Postura de presión en el Estrecho"
 CHI_taiwan_strait_pressure_spirit_desc: "Las incursiones aéreas regulares del EPL en la zona de identificación de defensa aérea de Taiwán, los ejercicios navales a gran escala en las aguas que rodean la isla y una coacción económica calibrada mantienen una campaña de presión constante que no llega a la guerra abierta. Esta postura mantiene a Taipéi en alerta permanente y envía una señal de determinación a Washington, templando a nuestras fuerzas y sosteniendo el Apoyo Bélico público ante posibles contingencias."
 CHI_tech_crackdown_moderate: "Represión tecnológica: reestructuración gestionada"
 CHI_tech_crackdown_moderate_desc: "La campaña regulatoria ha impuesto costes de cumplimiento normativo y ha ralentizado la inversión en investigación, pero el sector de las plataformas tecnológicas tiene la escala suficiente para absorber la perturbación sin sufrir un colapso estructural."
 CHI_tech_crackdown_severe: "Represión tecnológica: severa"
 CHI_tech_crackdown_severe_desc: "Nuestra campaña regulatoria contra el sector de las plataformas tecnológicas ha atrapado a la economía digital en una fase temprana de desarrollo. La construcción en el sector servicios está estancada, el capital de riesgo ha huido y la inversión en investigación se ha contraído drásticamente."
 CHI_the_duterte_precedent: "El precedente de Duterte"
 CHI_the_duterte_precedent_desc: "El ejemplo de un jefe de gobierno de la ASEAN que opta por distanciarse de Washington y acercarse a Pekín resuena en toda la región. Otros líderes observan que los Estados Unidos no pudieron o no quisieron impedirlo, y sopesan sus propias opciones en consecuencia."
 CHI_three_represents_debate: "Controversia de la Triple Representación"
 CHI_three_represents_debate_desc: "Los tradicionalistas ideológicos dentro del Partido se resisten a la propuesta de Jiang de admitir a empresarios privados como miembros del Partido, argumentando que se abandona el carácter de clase de la vanguardia. El debate interno altera temporalmente la coherencia de las políticas y genera fricciones a nivel provincial."
 CHI_three_represents_debate_tt: "\nEste §EEspíritu Nacional§! se §Rcancelará§! si §YJiang Zemin§! no completa §Y$CHI_three_represents_codified$§! y deja de ser el §YLíder del país§!."
 CHI_tibet_crackdown_idea: "Operación de seguridad en el Tíbet"
 CHI_tibet_crackdown_idea_desc: "Una operación de seguridad coordinada en todo el Tíbet está suprimiendo la actividad separatista, a costa de una tensión temporal en la estabilidad."
 CHI_total_war_himalayan_front: "Guerra total en el frente del Himalaya"
 CHI_total_war_himalayan_front_desc: "Cada fábrica, cada terminal ferroviaria, cada reservista movilizado por la cuestión de McMahon."
 CHI_two_centenary_resolve: "Objetivos de los Dos Centenarios"
 CHI_two_centenary_resolve_desc: "Los plazos de los dos centenarios de 2021 y 2049 imponen un horizonte generacional a la planificación económica y social. Las inversiones en infraestructuras, los objetivos de productividad y los programas de desarrollo tecnológico se orientan hacia estos hitos. Los objetivos estructuran los incentivos burocráticos y desbloquean ciclos de planificación sostenidos durante varias décadas en todos los ministerios."
 CHI_united_front_department_1: "Departamento de Trabajo del Frente Unido"
 CHI_united_front_department_1_desc: "El Departamento de Trabajo del Frente Unido gestiona las relaciones del PCCh con sectores ajenos al partido: minorías étnicas, comunidades religiosas, redes de chinos en el extranjero y figuras políticas extranjeras susceptibles de cooptación. Su cometido es neutralizar posibles focos de oposición y extender la influencia del partido más allá de su militancia formal. A medida que crece la influencia de la comisión, el alcance del departamento se vuelve más sistemático, convirtiendo a actores periféricos en instrumentos fiables de los intereses estratégicos chinos."
 CHI_usa_asia_pivot_collapse: "Colapso del pivote indo-pacífico"
 CHI_usa_asia_pivot_collapse_desc: "Con Seúl derivando hacia la órbita de Pekín y Tokio estratégicamente aislado, la piedra angular del reequilibrio estadounidense hacia Asia se ha desmoronado. La planificación avanzada está sumida en el caos, la confianza de los aliados se ha visto sacudida y el coste político de este revés pasa factura a Washington."
 CHI_usa_back_channel_open: "Canal secundario con Foggy Bottom"
 CHI_usa_back_channel_open_desc: "Una línea discreta entre Zhongnanhai y el Departamento de Estado mantiene abierta la comunicación en situaciones de crisis por debajo de la vía diplomática pública. El canal proporciona un flujo constante de inteligencia sobre las intenciones estadounidenses, a costa de una exposición para la contrainteligencia china."
 CHI_usa_g2_framework: "Marco del G2"
 CHI_usa_g2_framework_desc: "Washington y Pekín han institucionalizado un condominio de grandes potencias sobre los asuntos coreanos, coordinando políticas a través de canales bilaterales permanentes. El acuerdo estabiliza los mercados y reduce los costes para el consumidor, pero vincula la política coreana de los EE. UU. a la buena voluntad continua de China."
 CHI_wakhan_buffer_idea: "Zona colchón de Wakhan"
 CHI_wakhan_buffer_idea_desc: "Un régimen coordinado contra la radicalización en todo el corredor de Wakhan ha endurecido la frontera occidental de China frente a la infiltración extremista."
 CHI_wakhan_buffer_partner_idea: "Socio antiterrorista de Wakhan"
 CHI_wakhan_buffer_partner_idea_desc: "Los protocolos conjuntos de control de fronteras con Pekín han mejorado la capacidad antiterrorista nacional, al mismo tiempo que los servicios de inteligencia extranjeros estrechan su cooperación."
 CHI_war_footing_central_asia: "Economía de guerra en Asia Central"
 CHI_war_footing_central_asia_desc: "Producción nacional orientada hacia operaciones sostenidas al oeste de los Pamires."
 CHI_water_shortage: "Escasez de agua"
 CHI_water_shortage_desc: "La llanura del norte de China, la cuenca del río Amarillo y el corredor Pekín-Tianjín-Hebei concentran aproximadamente la mitad de las tierras cultivadas del país, pero menos de una quinta parte de su agua dulce. La disponibilidad de agua per cápita en el norte se sitúa muy por debajo del umbral internacional de escasez de 1000 metros cúbicos al año. Los vertidos industriales y la escorrentía agrícola han contaminado gran parte de las aguas superficiales y subterráneas disponibles, agravando la escasez física. La agricultura representa más del 60 por ciento del consumo total de agua, y las demandas de refrigeración del sector energético añaden más tensión a una base de recursos ya mermada.\n§W--------------§!\nCompletar proyectos de la categoría de decisión §Y$CHI_water_shortage_category$§!, desbloqueada por el enfoque §Y$CHI_water_security_initiative$§!, y las rutas del Proyecto de Trasvase de Agua Sur-Norte en la categoría §Y$CHI_megaprojects$§! aumenta nuestro progreso en la conservación del agua. Este espíritu nacional §Gmejorará§! al completar §Y4§! proyectos."
 CHI_wenchuan_reconstruction_drive_idea: "Campaña de reconstrucción de Wenchuan"
 CHI_wenchuan_reconstruction_drive_idea_desc: "Desplegamos a más de 100 000 soldados y equipos de emergencia a los pocos días del terremoto, y lo complementamos con un plan de reconstrucción de 1 billón de RMB. La magnitud del compromiso ha generado un auge sostenido de la actividad de construcción en Sichuan y la región circundante."
 CHI_western_hemisphere_protector: "Protector de las Américas emergentes"
 CHI_western_hemisphere_protector_desc: "Nos hemos posicionado como el garante de seguridad alternativo para las naciones latinoamericanas que buscan escapar de la órbita de Washington. La influencia fluye libremente y las redes de inteligencia están aisladas de las contramedidas occidentales."
 CHI_western_institutional_engagement_idea: "Compromiso institucional occidental"
 CHI_western_institutional_engagement_idea_desc: "La participación activa en la gobernanza del FMI, el Banco Mundial y la OMC genera credibilidad internacional y amplía el acceso a los mercados financieros globales."
 CHI_wto_implementation_idea: "Implementación de la OMC"
 CHI_wto_implementation_idea_desc: "Las reducciones arancelarias plurianuales, la apertura del sector servicios y el alineamiento con las normas comerciales internacionales profundizan nuestra integración en las cadenas de suministro globales y mejoran nuestra posición ante los socios comerciales."
 CHI_xinjiang_crackdown_idea: "Operación de seguridad en Sinkiang"
 CHI_xinjiang_crackdown_idea_desc: "Una amplia operación de seguridad está en marcha en Sinkiang. La resistencia se ha atenuado, pero el coste repercute en la estabilidad interna."
 chinese_african_century: "El siglo chino-africano"
 chinese_african_century_desc: "Décadas de inversiones en el FOCAC han convertido a China en el socio indispensable del continente africano, reconfigurando la demografía, los flujos comerciales y el alineamiento político."
 chinese_surveillance_systems: "Sistemas de vigilancia chinos"
 chinese_surveillance_systems_desc: "Las plataformas importadas de ciudades seguras, las cámaras de reconocimiento facial y las herramientas de identidad digital blindan al régimen frente a la disidencia y las operaciones de inteligencia extranjeras."
 eurasian_land_bridge: "Puente Terrestre Euroasiático"
 eurasian_land_bridge_desc: "Un corredor ininterrumpido de vías férreas y oleoductos conecta el Pacífico con el Atlántico, con los estándares, anchos de vía y procedimientos aduaneros chinos fijando el ritmo del comercio terrestre."
 JAP_abandoned_by_ally: "Abandonado por Washington"
 JAP_abandoned_by_ally_desc: "Cuando llegó el momento de la verdad, los estadounidenses se mostraron evasivos. La alianza se mantuvo sobre el papel, pero la confianza ha desaparecido, y cada facción de la Dieta está sacando sus propias conclusiones."
 JAP_china_engagement: "Acercamiento a China"
 JAP_china_engagement_desc: "Tokio ha optado por un acercamiento político abierto con Pekín, reduciendo la fricción estratégica a costa de su credibilidad nacionalista."
 JAP_export_pain: "Sufrimiento en las exportaciones"
 JAP_export_pain_desc: "Un boicot sostenido de los consumidores chinos ha dejado a las industrias de exportación japonesas luchando por encontrar mercados alternativos."
 JAP_jcg_emergency_deployment: "Despliegue de emergencia de la JCG"
 JAP_jcg_emergency_deployment_desc: "La Guardia Costera de Japón se encuentra en permanente estado de crisis en el mar de la China Oriental, exigiendo un gran esfuerzo a la industria para mantener las patrulleras en el mar."
 JAP_rare_earth_diversification: "Campaña de diversificación de tierras raras"
 JAP_rare_earth_diversification_desc: "Un programa de emergencia para obtener tierras raras de Australia, Vietnam y mediante el reciclaje nacional. Doloroso a corto plazo."
 JAP_revisionist_pride: "Orgullo revisionista"
 JAP_revisionist_pride_desc: "El desafío público a las críticas extranjeras sobre la memoria de la guerra consolida un ambiente nacionalista en el país."
 JAP_sino_japanese_understanding: "Entendimiento sino-japonés"
 JAP_sino_japanese_understanding_desc: "El Comunicado de Tokio ha institucionalizado las consultas periódicas y las preferencias comerciales con Pekín."
 JAP_strategic_autonomy_drift: "Deriva hacia la autonomía estratégica"
 JAP_strategic_autonomy_drift_desc: "Con el Quad rebajado a un mero diálogo, Japón está reajustando discretamente sus alineamientos fuera de la órbita de Washington."
 NKO_pro_beijing_regime: "Régimen pro-Pekín"
 NKO_pro_beijing_regime_desc: "El nuevo gobierno en Pionyang debe su supervivencia a Pekín. Los asesores chinos se sientan en cada ministerio; el petróleo chino mueve cada camión."
 pax_sinica: "Pax Sinica"
 pax_sinica_consensus: "Comunidad de futuro compartido"
 pax_sinica_consensus_desc: "Hemos alcanzado la preeminencia global tras décadas de inversiones pacientes, financiación preferencial y diplomacia institucional. El orden internacional reconoce nuestra centralidad por puro interés antes que por coacción: un mundo vinculado a nosotros por el beneficio mutuo, no por necesidad estratégica."
 pax_sinica_desc: "Nos situamos en la cúspide de un orden global que hemos moldeado bajo nuestras propias condiciones, con la Franja y la Ruta como el tejido conectivo de un nuevo sistema internacional."
 petroyuan_settlement: "Red de liquidación del petroyuan"
 petroyuan_settlement_desc: "Los contratos energéticos transfronterizos se liquidan cada vez más en renminbi, liberando a nuestra industria de los puntos de estrangulamiento de la liquidación en dólares y acelerando la construcción nacional."
 rmb_reserve_currency: "El renminbi como moneda de reserva"
 rmb_reserve_currency_desc: "El yuan se ha incorporado a la cesta de monedas de reserva mundiales, abriendo mercados de exportación y otorgando a nuestros bancos la resiliencia necesaria para garantizar préstamos de recuperación global."
 SCO_air_defense_initiator: "Defensa Aérea Conjunta de la OCS (Líder)"
 SCO_air_defense_initiator_desc: "Como nación líder de la red de Defensa Aérea Conjunta de la OCS, este país coordina la vigilancia aérea integrada y la defensa antimisiles entre los Estados miembros."
 SCO_air_defense_member: "Defensa Aérea Conjunta de la OCS"
 SCO_air_defense_member_desc: "La participación en la red de Defensa Aérea Conjunta de la OCS proporciona acceso a una cobertura de radar compartida y a la coordinación antiaérea."
 SCO_cultural_exchange_bonus: "Intercambio cultural de la OCS"
 SCO_cultural_exchange_bonus_desc: "Un programa de intercambio académico y cultural está fomentando la colaboración en investigación transfronteriza."
 SCO_dev_bank_initiator: "Banco de Desarrollo de la OCS (Fundador)"
 SCO_dev_bank_initiator_desc: "Como fundador del Banco de Desarrollo de la OCS, este país dirige los flujos de inversión y dispone de acceso privilegiado a financiación de bajo interés."
 SCO_dev_bank_member: "Banco de Desarrollo de la OCS"
 SCO_dev_bank_member_desc: "La membresía en el Banco de Desarrollo de la OCS proporciona acceso a préstamos para el desarrollo y a programas conjuntos de inversión."
 SCO_development_assistance: "Asistencia para el desarrollo de la OCS"
 SCO_development_assistance_2: "Asistencia para el desarrollo [CHI.GetAdjective]"
 SCO_development_assistance_2_desc: "China nos ha concedido una muy necesaria asistencia para el desarrollo bajo los auspicios de la Organización de Cooperación de Shanghái."
 SCO_development_assistance_desc: "La Organización de Cooperación de Shanghái está canalizando recursos de desarrollo hacia este país."
 SCO_energy_deal_income: "Asociación energética de la OCS"
 SCO_energy_deal_income_desc: "Un acuerdo de suministro energético a largo plazo está generando ingresos constantes."
 SCO_energy_grid_initiator: "Red Eléctrica de la OCS (Iniciador)"
 SCO_energy_grid_initiator_desc: "Como iniciador de la Red Eléctrica de la OCS, este país lidera una red de energía integrada que abarca a los Estados miembros."
 SCO_energy_grid_member: "Red Eléctrica de la OCS"
 SCO_energy_grid_member_desc: "La participación en la Red Eléctrica de la OCS proporciona acceso a una infraestructura energética compartida y reduce los costes de la energía."
 SCO_intel_sharing_bonus: "Intercambio de inteligencia de la OCS"
 SCO_intel_sharing_bonus_desc: "Un canal seguro de intercambio de inteligencia está mejorando la coordinación antiterrorista."
 SCO_joint_drill: "Ejercicios militares conjuntos de la OCS"
 SCO_joint_drill_1: "Ejercicios conjuntos de la OCS (Bilaterales)"
 SCO_joint_drill_1_desc: "Los ejercicios militares bilaterales con un socio de la OCS están perfeccionando la coordinación táctica."
 SCO_joint_drill_desc: "La participación en ejercicios militares conjuntos a escala de toda la OCS está mejorando la preparación operativa."
 SCO_joint_drill_specific: "Ejercicios conjuntos de la OCS (Focalizados)"
 SCO_joint_drill_specific_desc: "Los ejercicios conjuntos focalizados con un socio de la OCS abordan deficiencias operativas específicas."
 SCO_railway_initiator: "Ferrocarril Transeuasiático (Iniciador)"
 SCO_railway_initiator_desc: "Como fuerza impulsora del Ferrocarril Transeuasiático, este país se beneficia de un acceso de primer nivel al corredor comercial que abarca todo el continente."
 SCO_railway_member: "Ferrocarril Transeuasiático"
 SCO_railway_member_desc: "El Ferrocarril Transeuasiático conecta a este país con una red comercial de alta capacidad en toda la zona de la OCS."
 SCO_trade_agreement_bonus: "Acuerdo comercial de la OCS"
 SCO_trade_agreement_bonus_desc: "Un marco de comercio bilateral bajo el paraguas de la OCS está impulsando la producción industrial civil."
 CHI_airforce_modifier: "Fuerza Aérea del Ejército Popular de Liberación"
 CHI_airforce_modifier_desc: "La rama aérea del Ejército Popular de Liberación, que despliega cazas, bombarderos, aeronaves de transporte y una red integrada de defensa aérea. Esto representa su doctrina, entrenamiento y equipamiento."
 CHI_belt_and_road_initiative_idea: "Iniciativa de la Franja y la Ruta"
 CHI_belt_and_road_initiative_idea_desc: "La Iniciativa de la Franja y la Ruta de China, lanzada en 2013, financia la construcción de puertos, corredores ferroviarios, oleoductos y gasoductos, centrales eléctricas e infraestructuras digitales en Asia, África, Oriente Medio y Europa. El Estado elegible solicita los proyectos, Pekín los financia y construye, y cada proyecto completado aumenta el nivel de ese socio y la posición de la propia China.\n\n[CHIGetBRIPortTier][CHIGetBRIRailwayTier][CHIGetBRIPipelineTier][CHIGetBRITelecomTier][CHIGetBRIMineTier][CHIGetBRIPowerplantTier][CHIGetBRIIndustrialZoneTier][CHIGetBRIPrestigeTier]"
 CHI_bri_state_industrial: "Proyecto industrial de la Franja y la Ruta"
 CHI_bri_state_industrial_desc: "Un proyecto industrial heredado respaldado por China amplía la capacidad de las fábricas locales y la extracción de recursos."
 CHI_bri_state_infrastructure: "Proyecto de infraestructura de la Franja y la Ruta"
 CHI_bri_state_infrastructure_desc: "Un proyecto de infraestructura heredado de la Franja y la Ruta acelera la construcción regional, el trabajo en los astilleros y el rendimiento del suministro."
 CHI_coast_guard_standoff: "Enfrentamiento de la guardia costera"
 CHI_coast_guard_standoff_desc: "Los encuentros diarios entre la milicia china y la Guardia Costera de Japón deprimen la actividad económica local."
 CHI_defense_industry: "Industria de defensa china"
 CHI_defense_industry_desc: "La base industrial de defensa de China se articula en torno a grandes conglomerados estatales que abarcan la producción terrestre, aérea, naval y electrónica, abasteciendo tanto a las fuerzas armadas como al mercado de exportación. Esto representa la capacidad militar-industrial del país."
 CHI_diplomacy_modifier: "Red diplomática china"
 CHI_diplomacy_modifier_desc: "Una postura diplomática variable concede o retira bonificaciones al aumento mensual de opinión, las relaciones comerciales, la proyección naval, la eficiencia del suministro, las operaciones de influencia extranjera y el poder político, dependiendo de la profundidad de la inversión en la red diplomática de China."
 CHI_economy_modifier: "Modelo económico chino"
 CHI_economy_modifier_desc: "China opera una economía de mercado socialista que combina empresas estatales, industria privada y planificación centralizada a través de sucesivos planes quinquenales. Esto representa la base industrial, la política fiscal y la estructura comercial del país."
 CHI_jap_industrial_partnerships: "Asociaciones industriales sino-japonesas"
 CHI_jap_industrial_partnerships_desc: "La cooperación económica estructurada con Japón amplía el acceso a la fabricación de precisión, a las cadenas de suministro avanzadas de automoción y electrónica, y a los conocimientos nucleares civiles. La asociación reporta beneficios en el rendimiento del blindaje, la agilidad del poder aéreo, la velocidad naval, la capacidad de investigación y la producción industrial, aunque conlleva una sensibilidad política interna dada la animosidad histórica."
 CHI_korea_peninsula_modifier: "Estrategia para la península de Corea"
 CHI_korea_peninsula_modifier_desc: "China comparte frontera terrestre con la península de Corea y mantiene vínculos políticos, económicos y de inteligencia en toda la región. Esto representa la gestión de Pekín de las relaciones, la seguridad fronteriza y las redes de información en su flanco noreste."
 CHI_landforce_modifier: "Fuerza Terrestre del Ejército Popular de Liberación"
 CHI_landforce_modifier_desc: "La rama terrestre del Ejército Popular de Liberación, organizada en brigadas de armas combinadas bajo el sistema de mando por teatro de operaciones. Esto representa su doctrina, entrenamiento y equipamiento."
 CHI_navy_modifier: "Armada del Ejército Popular de Liberación"
 CHI_navy_modifier_desc: "La rama naval del Ejército Popular de Liberación, que comprende buques de superficie, submarinos, portaaviones y el cuerpo de infantería de marina. Esto representa la composición de su flota, su doctrina y su alcance operativo."
 CHI_northeast_revitalisation: "Revitalización del noreste"
 CHI_northeast_revitalisation_desc: "La estrategia de Revitalización del Noreste dirige el capital estatal hacia las provincias del cinturón industrial de Liaoning, Jilin y Heilongjiang, priorizando la industria pesada, la infraestructura energética y la construcción de complejos industriales. Se modernizan las instalaciones de la era soviética y se encarga nueva capacidad de producción para restablecer el papel de la región como base industrial."
 CHI_political_system: "Sistema político chino"
 CHI_political_system_desc: "La República Popular China es un Estado unipartidista liderado por el Partido Comunista de China, organizado en torno al centralismo democrático y una gran burocracia administrativa. Esto representa la estructura de gobierno, las instituciones del partido y el control estatal."
 CHI_rare_earth_embargoed: "Embargo de tierras raras"
 CHI_rare_earth_embargoed_desc: "Pekín ha cortado las exportaciones críticas de tierras raras a Japón, estrangulando la producción industrial."
 CHI_rare_earth_embargoed_idea: "Embargo de tierras raras"
 CHI_rare_earth_embargoed_idea_desc: "Pekín ha cortado las exportaciones críticas de tierras raras, estrangulando a las industrias de defensa y de alta tecnología que dependen del refinado chino."
 CHI_rural_development: "Programa de desarrollo rural"
 CHI_rural_development_desc: "La inversión focalizada en infraestructuras rurales, que incluye carreteras, servicios públicos y capacidad administrativa local, acelera la actividad de construcción en los condados designados. El programa reduce la brecha de ingresos entre el campo y la ciudad y atenúa las tensiones sociales derivadas de una modernización desigual."
 JAP_china_market_partnerships: "Asociaciones con el mercado de China"
 JAP_china_market_partnerships_desc: "La profunda integración con el mercado industrial y de consumo chino mejora la eficiencia de las fábricas japonesas, estabiliza los costes de los bienes de consumo y respalda la cohesión política interna. Se amplía la capacidad de producción para infraestructuras civiles y los volúmenes de comercio bilateral sostienen el crecimiento incluso cuando las fricciones geopolíticas en otros lugares generan vientos en contra."
