 israel_economy.140.t: "Israel quer participar de exposições em Dubai!"
 israel_economy.140.d: "Israel quer assinar um tratado comercial conosco e participar de feiras e exposições em Dubai. Eles pedem que aprovemos sua participação. Devemos concordar?"
 israel_economy.140.a: "Claro!"
 israel_economy.140.b: "Desculpe, não."
 israel_economy.141.t: "Os EAU concordam!"
 israel_economy.141.d: "Os EAU concordaram com a nossa participação em feiras e exposições em Dubai. Também assinamos um tratado comercial, que afetará positivamente nossas relações mútuas."
 israel_economy.141.a: "Ótimo!"
 israel_economy.142.t: "Os EAU recusam!"
 israel_economy.142.d: "Eles não querem nos ver em suas feiras e exposições."
 israel_economy.142.a: "Affe."
