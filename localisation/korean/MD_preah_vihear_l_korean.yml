 CBD_pv_decisive_victory: "결정적 승리 선언"
 CBD_pv_decisive_victory_desc: "전세가 결정적으로 우리에게 유리한 만큼 이점을 밀어붙입니다. 태국을 굴욕적인 후퇴로 몰아넣고, 우리 병력에게 새 땅을 단 1미터도 유지하라고 요구하지 않은 채 대치를 국가적 승리로 선언합니다."
 CBD_pv_de_escalate: "긴장 완화 제안"
 CBD_pv_de_escalate_desc: "방콕과의 비공식 접촉을 통해 자제의 신호를 보냅니다. 전진 배치된 부대를 후퇴시키고 수사를 누그러뜨립니다. 정치적 자본 외에는 아무것도 들지 않으며, 훗날 필요할지 모르는 호의를 얻을 수 있습니다."
