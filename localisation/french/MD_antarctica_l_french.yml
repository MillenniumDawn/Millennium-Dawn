 leave_antarctica_cannot_be_stopped_tt: "§RCette action ne peut pas être arrêtée.§!"
 leave_antarctica_treaty_warning_tt: "§RAVERTISSEMENT :§!\nQuitter le §CTraité sur l'Antarctique§! tout en possédant une §Ystation de recherche§! en §CAntarctique§! provoquera une réaction mondiale des membres du traité, y compris d'éventuelles sanctions et un contrecoup diplomatique. Il est recommandé de démanteler toute station de recherche en §CAntarctique§! avant de quitter le traité pour éviter des conséquences négatives.\n\nPourtant, si vous choisissez de quitter le traité en en ayant une, aucun article ne vous empêchera d'entamer des activités interdites en §CAntarctique§!, telles que l'exploitation des ressources ou une présence militaire, ce qui peut gravement nuire à la réputation mondiale de votre nation."
 antarctica_post_treaty_activity_category: "Activités antarctiques post-traité"
 antarctica_post_treaty_activity_category_desc: "Ces actions sont visibles parce que nous avons quitté le Traité sur l'Antarctique tout en maintenant une station en Antarctique."
 antarctica_post_treaty_resource_extraction: "Exploiter les ressources de l'Antarctique"
 antarctica_post_treaty_resource_extraction_desc: "Nous pouvons utiliser l'infrastructure restante de la station pour extraire des ressources en Antarctique. Cela augmente les revenus mais déclenche un contrecoup diplomatique des membres du traité."
 antarctica_post_treaty_military_preparations: "Préparer l'infrastructure militaire"
 antarctica_post_treaty_military_preparations_desc: "Réaffecter les installations de la station à la planification et à la logistique militaires. Cela offre des avantages militaires mais est perçu comme une grave provocation."
