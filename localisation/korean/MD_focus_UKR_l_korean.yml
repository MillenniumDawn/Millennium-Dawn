 UKR_warehouses_novobohdanivka_2_depot_explosions_comission_flag: "노보보흐다니우카 창고에 대해 두 번째로 특별 정부 감사를 실시함"
 ukraine_nuclear_power_plants.1.name: "체르노빌 원자력 발전소 완전 폐쇄"
 ukraine_nuclear_power_plants.1.desc: "2000년 3월 29일, 우크라이나 내각은 3호기를 조기 폐기하고 2000년 말까지 체르노빌 원전을 최종 폐쇄하기로 결정했습니다.\n2000년 12월 15일, 1999년 3월부터 잠시 가동된 뒤 약 석 달간 수리를 거친 3호 원자로가 가동을 중단했으며, 발전소 전체가 전력 생산을 멈췄습니다.\n파괴된 4호 원자로를 보호해 온 노후하고 급조된 석관을 대체하기 위해 §Y새 안전 격납 시설§!이라는 새로운 강철 격납 구조물을 건설할 계획입니다.\n§Y새 안전 격납 시설§!은 유럽 부흥 개발 은행이 관리하는 국제 기금으로 재원을 조달할 계획이며, 프랑스 주도의 컨소시엄 노바르카가 설계 및 건설했습니다."
 ukraine_nuclear_power_plants.1.a: "영원히 멈춘다"
 ukraine_nuclear_power_plants_flag: "체르노빌 원자력 발전소가 폐쇄됨."
 ukr_history.1.t: "게오르기 곤가제의 실종"
 ukr_history.1.d: "온라인 신문 '우크라인스카 프라우다'의 창립자이자 대통령 행정부에 대한 가장 날카로운 비판자 중 한 명인 게오르기 곤가제가 키이우에서 자취를 감췄습니다. 그의 어머니는 실종 신고를 했고, 동료들은 이미 당국이 배후에 있다고 공공연히 말하고 있습니다. 시신이 발견된다면 이 일은 더 이상 경찰의 소관으로 남지 않을 것입니다."
 ukr_history.1.a: "경찰이 평소처럼 처리하게 두자."
 ukr_history.1.b: "진짜 수사를 지시하고 언론에 계속 알리자."
 ukr_history.2.t: "카세트 스캔들"
 ukr_history.2.d: "사회당 대표 올렉산드르 모로즈가 최고회의 연단에서 국가경호원 미콜라 멜니첸코가 대통령 집무실에서 직접 녹음한 테이프를 틀었습니다. 테이프에는 대통령과 비슷한 목소리가 곤가제를 처리하라고 요구하는 내용이 담겨 있었습니다. 모로즈는 하룻밤 사이에 퇴색하던 좌파 정치인에서 야권의 얼굴로 탈바꿈했습니다."
 ukr_history.2.a: "모두 부인하고 테이프의 신빙성을 문제 삼자."
 ukr_history.2.b: "아무 말 없이 폭풍이 지나가기를 기다리자."
 ukr_history.3.t: "쿠치마 없는 우크라이나"
 ukr_history.3.d: "독립 광장에 상설 시위 천막촌이 생겼습니다. 처음에는 50명으로 시작했으나 이틀 만에 수만 명으로 불어났습니다. 좌파, 중도파, 민족주의자가 처음으로 같은 광장에서 같은 구호 아래 서 있습니다. 주최 측은 대통령이 사임할 때까지 떠나지 않겠다고 말합니다."
 ukr_history.3.a: "무시하자. 추위가 알아서 해결해 줄 것이다."
 ukr_history.3.b: "시위 위원회와 협상을 시작하자."
 ukr_history.4.t: "방코바 거리 충돌"
 ukr_history.4.d: "셰우첸코 탄생 기념일에 1만~1만 5천 명의 행렬이 대통령 행정부를 향해 행진했습니다. 방코바 거리에서는 독립 이후 최악의 시가전이 벌어졌습니다. 저녁 무렵 경찰은 UNA-UNSO 본부를 파괴했고 수백 명이 체포되었습니다. 광장의 천막촌은 사라졌지만, 이 정부가 국민의 동의로 통치한다는 허울도 함께 사라졌습니다."
 ukr_history.4.a: "그렇다면 어쩔 수 없다."
 ukr_history.5.t: "유셴코 내각을 해임한 최고회의"
 ukr_history.5.d: "263명의 의원이 빅토르 유셴코 내각에 대한 불신임에 표를 던졌습니다. 공산당과 과두 중도파가 함께 표를 던졌는데, 좌파는 그의 시장 개혁을 싫어했고 기업 집단들은 그가 에너지 부문의 물물교환 방식을 중단시킨 것을 싫어했습니다. 국가 역사상 가장 인기 있는 총리는 명성을 온전히 지킨 채 물러나지만, 그 명성을 이어 갈 자리는 없습니다."
 ukr_history.5.a: "그렇다면 어쩔 수 없다."
 ukr_history.6.t: "정치 연합 결성을 발표한 유셴코"
 ukr_history.6.d: "해임된 총리는 내년 의회 선거에 선거 연합을 이끌고 나서겠다고 선언했습니다. 민족민주 및 자유주의 정당 열 곳이 이미 명부를 협의하고 있습니다. 이 연합에는 아직 강령도 조직도 없지만, 다른 어떤 세력도 갖지 못한 것, 즉 국민 대다수가 여전히 신뢰하는 지도자를 갖고 있습니다."
 ukr_history.6.a: "그렇다면 어쩔 수 없다."
 ukr_history.7.t: "통합 우크라이나를 위하여!"
 ukr_history.7.d: "집권 정당 다섯 곳이 대통령을 중심으로 하나의 선거 연합으로 결집했습니다. 인민민주당, 노동 우크라이나, 지역당, 농업당, 산업가당입니다. 이들을 묶어 주는 것은 이념이 아니라 행정 자원, 즉 주지사, 세무 조사관, 국영 방송입니다. 지역 유력자들에게는 기대되는 결과가 이미 전달되었습니다."
 ukr_history.7.a: "그렇다면 어쩔 수 없다."
 ukr_history.8.t: "2002년 의회 선거"
 ukr_history.8.d: "유셴코의 연합이 23퍼센트로 정당 명부 1위를 차지했습니다. 통합 우크라이나를 위하여는 겨우 12퍼센트에 그쳤으나, 주지사가 투표함의 결과를 좌우하는 소선거구에서 100석을 거두었습니다. 공산당은 지지율의 절반을 잃었습니다. 여섯 개 세력이 새 최고회의에 입성합니다."
 ukr_history.8.a: "그렇다면 어쩔 수 없다."
 ukr_history.9.t: "의장에 선출된 리트빈"
 ukr_history.9.d: "두 달간의 교착 끝에 대통령 행정부 수장 볼로디미르 리트빈이 최고회의 의장으로 선출되었습니다. 전국적으로는 야권이 더 많은 표를 얻었고, 의회 안에서는 대통령 쪽이 더 많은 표를 얻었습니다. 리트빈은 앞으로 몇 년간 양쪽 모두에게 필요하지만 어느 쪽도 신뢰하지 않는 인물로 지내게 될 것입니다."
 ukr_history.9.a: "그렇다면 어쩔 수 없다."
 ukr_history.10.t: "해체된 통합 우크라이나를 위하여"
 ukr_history.10.d: "선거구에서 승리한 연합이 구성 요소별로 갈라졌습니다. 하나였던 자리에 이제 아홉 개의 별개 교섭단체가 앉아 있습니다. 지역당, 노동 우크라이나, 인민민주당, 농업당 등이 각자의 지도자와 각자의 몸값을 가지고 있습니다. 도네츠크 그룹이 그중 가장 큰 세력이며 더 이상 누구의 하위 파트너도 아닙니다."
 ukr_history.10.a: "그렇다면 어쩔 수 없다."
 ukr_history.11.t: "일어나라, 우크라이나!"
 ukr_history.11.d: "곤가제 실종 2주기를 맞아 야권이 지지자들을 다시 거리로 불러냈습니다. 이번에는 유셴코, 티모셴코, 모로즈, 시모넨코가 같은 연단에 섰습니다. 네 사람은 대통령이 물러나야 한다는 요구 외에는 공통점이 거의 없습니다. 흐레샤티크 거리에 다시 천막이 들어서고 있습니다."
 ukr_history.11.a: "그렇다면 어쩔 수 없다."
 ukr_history.12.t: "슬라바 스테츠코의 죽음"
 ukr_history.12.d: "1941년 리비우에서 우크라이나 국가 재건을 선포한 인물의 미망인이자 전시 민족주의 지하 조직과 오늘날 의회를 잇는 살아 있는 연결 고리였던 야로슬라바 스테츠코가 82세의 나이로 세상을 떠났습니다. 우크라이나 민족주의자 회의는 이제 상징이 아닌 지도자를 찾아야 합니다."
 ukr_history.12.a: "그렇다면 어쩔 수 없다."
 ukr_history.13.t: "지역당을 장악한 야누코비치"
 ukr_history.13.d: "총리가 지역당 대표로 선출되었습니다. 지금까지 이 당은 여러 도네츠크 기업 집단 중 하나였지만, 오늘부터는 대통령이 자리를 물려주려는 인물의 정치적 도구가 되었습니다. 리나트 아흐메토프의 사람들이 당의 지역 조직으로 들어가고 있습니다."
 ukr_history.13.a: "그렇다면 어쩔 수 없다."
 ukr_history.14.t: "인민 운동을 이끄는 타라슉"
 ukr_history.14.d: "NATO와의 헌장을 협상한 전직 외무장관 보리스 타라슉이 루흐의 지도자로 선출되었습니다. 독립을 이룬 정당은 이제 외교관과 지식인으로 이루어진 소규모 전문가 교섭단체가 되었으며, 자신들의 미래가 유셴코의 연합 곁이 아니라 그 안에 있다고 판단했습니다."
 ukr_history.14.a: "그렇다면 어쩔 수 없다."
 ukr_history.15.t: "단일 경제 공간"
 ukr_history.15.d: "대통령이 얄타에서 러시아, 벨라루스, 카자흐스탄과 단일 경제 공간 협정에 서명했습니다. 협정문은 관세 동맹과 경제 규모에 따라 투표권에 가중치를 두는 초국가적 위원회를 언급하고 있는데, 이는 곧 모스크바가 결정한다는 뜻입니다. 최고회의는 공산당과 집권당이 함께 표를 던져 이를 비준했습니다."
 ukr_history.15.a: "서명하자. 동쪽이 우리의 청구서를 대 준다."
 ukr_history.15.b: "서명하되 자유무역 부분만 비준하자."
 ukr_history.16.t: "3선의 문을 연 법원"
 ukr_history.16.d: "헌법재판소는 구 헌법 아래에서 치른 대통령의 첫 임기는 산입하지 않는다고 판결했습니다. 그는 내년에 다시 출마할 수 있습니다. 키이우의 누구도 판사들이 스스로 이 결론에 도달했다고 믿지 않으며, 그가 실제로 이를 이용하리라고 믿는 사람도 없습니다. 그러나 이 판결은 야권에 자신들이 상대하는 것이 무엇인지 정확히 알려 주었습니다."
 ukr_history.16.a: "그렇다면 어쩔 수 없다."
 ukr_history.17.t: "스보보다가 된 사회민족당"
 ukr_history.17.d: "리비우 당대회에서 우크라이나 사회민족당이 당명을 전우크라이나 연합 '스보보다'로 바꾸고, 당 깃발에서 볼프스앙겔을 삭제했으며, 올레흐 탸흐니보크를 당 대표로 선출했습니다. 수사는 순화되었고, 당은 이제 준군사 조직에는 결코 가입하지 않았을 유권자를 겨냥하고 있습니다."
 ukr_history.17.a: "그렇다면 어쩔 수 없다."
 ukr_history.18.t: "6표 차로 부결된 정치 개혁안"
 ukr_history.18.d: "대통령직을 의례적인 자리로 바꿀 헌법 개정안이 6표 모자라 부결되었습니다. 대통령 측은 선거에서 패배할 경우를 대비한 보험으로 이를 원했고, 유셴코 진영은 현행 체제 그대로 대통령직을 차지하리라 예상했기에 반대표를 던졌습니다. 양측은 방금 각자가 자신들의 승산을 어떻게 보는지 온 나라에 알린 셈입니다."
 ukr_history.18.a: "그렇다면 어쩔 수 없다."
 ukr_history.19.t: "농업당을 장악한 리트빈"
 ukr_history.19.d: "의회 의장이 농업당 대표로 선출되었으며, 이 당은 당명을 인민농업당으로 바꾸려 하고 있습니다. 리트빈은 도네츠크 그룹도 오렌지 진영도 내세울 것이 별로 없는 나라의 유일한 지역인 농촌에 자신만의 조직을 구축하고 있습니다."
 ukr_history.19.a: "그렇다면 어쩔 수 없다."
 ukr_history.20.t: "민중의 힘"
 ukr_history.20.d: "유셴코와 티모셴코가 연정 협약에 서명했습니다. 그녀는 대선 출마를 포기하고 그를 위해 선거운동을 하며, 그가 당선되면 총리가 됩니다. 3년 동안 같은 저항 표를 두고 경쟁해 온 두 진영이 한쪽은 후보가, 다른 한쪽은 정부가 되어야 한다고 결정했습니다."
 ukr_history.20.a: "그렇다면 어쩔 수 없다."
 ukr_history.21.t: "탸흐니보크를 제명한 유셴코"
 ukr_history.21.d: "카르파티아산맥의 빨치산 무덤에서 탸흐니보크가 \\"모스칼리, 독일인, 유대 놈들\\"과 싸운 이들을 찬양하는 연설을 한 뒤, 우리 우크라이나는 그를 의원단에서 제명했습니다. 유셴코는 선거운동을 치명적인 인용구로부터 지켜 냈고, 스보보다에는 독자적인 정당으로 자리 잡는 데 필요했던 순교자 이미지를 안겨 주었습니다."
 ukr_history.21.a: "그렇다면 어쩔 수 없다."
 ukr_history.22.t: "독살 시도"
 ukr_history.22.d: "야권 후보가 빈의 병원으로 이송되었습니다. 진단은 정상 수치의 천 배에 달하는 농도의 다이옥신 중독이며, 보안국 부국장과의 만찬에서 투여된 것으로 보입니다. 그는 살아남겠지만 얼굴은 그렇지 못할 것입니다. 그는 일그러진 얼굴로 선거운동에 복귀하고, 모든 유권자는 그에게 어떤 일이 벌어졌는지 보게 됩니다."
 ukr_history.22.a: "식중독이라고 하고 넘어가자."
 ukr_history.22.b: "형사 사건을 열고 진행되게 두자."
 ukr_history.23.t: "1차 투표"
 ukr_history.23.d: "야권 후보가 39퍼센트, 총리가 39퍼센트로, 차이는 불과 몇 십분의 일 퍼센트입니다. 공산당 득표율은 전국의 4분의 1에서 5퍼센트로 무너졌으며, 두 극으로 흡수되었습니다. 나머지는 모두 무의미합니다. 결선까지 3주 남았습니다."
 ukr_history.23.a: "그렇다면 어쩔 수 없다."
 ukr_history.24.t: "결선투표 무효를 선언한 최고회의"
 ukr_history.24.d: "307명의 의원이 2차 투표가 유권자의 뜻을 반영하지 않았다는 데 찬성표를 던졌고, 229명이 정부 불신임에 찬성표를 던졌습니다. 두 표결 모두 법적 구속력은 없습니다. 그러나 두 표결은 보안기관과 지방 행정 당국에 바람이 어느 쪽으로 불고 있는지를 알렸으며, 그것이 목적이었습니다."
 ukr_history.24.a: "그렇다면 어쩔 수 없다."
 ukr_history.25.t: "선거운동에서 이탈한 티히프코"
 ukr_history.25.d: "국립은행 총재이자 총리 선거운동 본부장이 선거운동과 은행 모두에서 사임했습니다. 그가 빅토르 핀추크와 함께 만든 드니프로페트로우스크 정당 노동 우크라이나는 소속 의원들이 더 안전한 곳을 찾아 떠나면서 그의 뒤에서 와해되고 있습니다."
 ukr_history.25.a: "그렇다면 어쩔 수 없다."
 ukr_history.26.t: "결선투표를 무효화한 대법원"
 ukr_history.26.d: "대법원은 2차 투표가 무효라고 판결하고 12월 26일에 재투표를 하도록 명령했습니다. 우크라이나 법원이 현직 대통령 측 후보에게 불리하게 대통령 선거를 판정한 것은 처음이며, 그 판결은 사람들로 가득 찬 광장에 생중계로 낭독되었습니다."
 ukr_history.26.a: "그렇다면 어쩔 수 없다."
 ukr_history.27.t: "법률 2222호 - 일괄 표결"
 ukr_history.27.d: "타협안이 하나의 일괄안으로 표결에 부쳐졌습니다. 재투표를 받아들이는 대신 헌법 개정을 하는 것입니다. 2006년부터 의회가 정부를 임명하고 대통령은 외교와 국방을 맡게 됩니다. 이번 선거의 승자는 자신이 싸워 얻으려던 자리보다 작은 자리를 얻게 될 것입니다."
 ukr_history.27.a: "그렇다면 어쩔 수 없다."
 ukr_history.28.t: "정당이 된 우리 우크라이나"
 ukr_history.28.d: "대통령직을 차지한 연합이 단일 정당 '인민연합 우리 우크라이나'로 창당 대회를 열었습니다. 대통령의 선거운동 본부장 로만 베스스메르트니가 의장직을 맡습니다. 열 개 참여 정당 가운데 여럿이 해산하여 합류하기를 거부했으며, 혁명을 이룬 연합은 이미 12월보다 정당 하나가 줄었습니다."
 ukr_history.28.a: "그렇다면 어쩔 수 없다."
 ukr_history.29.t: "오렌지 진영의 분열"
 ukr_history.29.d: "대통령이 정부 전체를 해임했습니다. 국가안보회의 의장이 생방송에서 총리 측근들의 부패를 고발했고, 총리는 문제는 대통령 자신의 측근들이라고 맞받았습니다. 광장에서의 혁명 8개월 뒤, 그 광장에 함께 섰던 두 사람이 서로를 상대로 맞서고 있습니다."
 ukr_history.29.a: "모두 해임하고 처음부터 다시 시작하자."
 ukr_history.29.b: "총리는 유임하고 대신 고발한 이들을 해임하자."
 ukr_history.30.t: "야누코비치와의 양해각서"
 ukr_history.30.d: "오렌지 진영의 표만으로는 새 총리를 인준할 수 없게 되자, 대통령은 자신이 꺾은 인물과 양해각서에 서명했습니다. 지역당은 기권하고, 유리 예하누로우가 세 표 차로 인준되었으며, 선거 관리 담당자들에 대한 형사 사건은 조용히 중단됩니다. 혁명은 자신이 무너뜨린 이들에게서 자기 정부를 사들인 셈입니다."
 ukr_history.30.a: "그렇다면 어쩔 수 없다."
 ukr_history.31.t: "2006년 의회 선거"
 ukr_history.31.d: "최초의 완전 비례대표제 선거입니다. 지역당이 32퍼센트, 티모셴코 블록이 22퍼센트, 우리 우크라이나가 14퍼센트를 얻었습니다. 대통령 본인의 정당이 승리 1년 만에 3위에 그쳤습니다. 사회당과 공산당은 간신히 의석을 얻었습니다. 누구도 과반을 얻지 못했고 모두가 거부권을 쥐고 있습니다."
 ukr_history.31.a: "그렇다면 어쩔 수 없다."
 ukr_history.32.t: "민주 세력 연합"
 ukr_history.32.d: "석 달 만에 오렌지 진영 파트너들이 서명을 마쳤습니다. 티모셴코 블록, 우리 우크라이나, 사회당이 243표를 모아 티모셴코를 총리로 세웠습니다. 협약을 작성하는 데 걸린 시간이 정부가 존속할 시간보다 길었습니다."
 ukr_history.32.a: "그렇다면 어쩔 수 없다."
 ukr_history.33.t: "의장직에 오른 모로즈"
 ukr_history.33.d: "사회당 대표가 지역당과 공산당의 표로 의장에 선출되었습니다. 지난 6년간 그가 비난해 온 두 정당입니다. 오렌지 연정은 같은 날 오후에 붕괴했습니다. 하루 만에 반위기 연합이 생겨났고, 모로즈는 나라의 절반에게서 가장 미움받는 인물이 되었습니다."
 ukr_history.33.a: "그렇다면 어쩔 수 없다."
 ukr_history.34.t: "국민 통합 선언"
 ukr_history.34.d: "대통령이 반위기 연합과 원칙 선언에 서명하고, 2004년에 자신이 꺾은 인물을 총리로 지명했습니다. 우리 우크라이나는, 지지자들이 이미 패배시켰다고 들어 온 정부에 합류하게 됩니다. 광장의 혁명 20개월 뒤, 야누코비치가 자신이 쫓겨났던 건물로 돌아왔습니다."
 ukr_history.34.a: "서명하자. 대안은 또 한 번의 선거다."
 ukr_history.34.b: "거부하고 지금 최고회의를 해산하자."
 ukr_history.35.t: "야당으로 돌아선 우리 우크라이나"
 ukr_history.35.d: "대통령의 정당이 두 달 전 합류한 정부에서 퇴장했습니다. 소속 장관들은 사임하고 의원들은 야당석으로 옮겼으며, 국민은 국민 통합 선언이 오해였다는 설명을 듣습니다. 반위기 연합은 이들이 필요하지 않다고 공공연히 말합니다."
 ukr_history.35.a: "그렇다면 어쩔 수 없다."
 ukr_history.36.t: "티모셴코 블록에 합류한 개혁과 질서"
 ukr_history.36.d: "1990년대 내내 나라가 외면한 모든 진지한 개혁 프로그램을 작성해 온 빅토르 핀젠이크의 시장자유주의자들이 티모셴코 블록에 흡수되었습니다. 오렌지 진영의 자유주의 계열은 더 이상 별도의 거점으로 존재하지 않습니다."
 ukr_history.36.a: "그렇다면 어쩔 수 없다."
 ukr_history.37.t: "다수 의석을 사들인 연합"
 ukr_history.37.d: "반위기 연합은 당명을 국민 통합 연합으로 바꾸고, 야당석 의원들을 한 명씩 아무도 공개적으로 논하지 않는 가격에 끌어들이기 시작했습니다. 300표를 확보하면 대통령의 거부권을 뒤집고 헌법을 고칠 수 있습니다. 11표가 모자랍니다."
 ukr_history.37.a: "그렇다면 어쩔 수 없다."
 ukr_history.38.t: "최고회의를 해산한 대통령"
 ukr_history.38.d: "연합이 300표에 이르는 것을 지켜보기보다 대통령은 포고령으로 의회를 해산했습니다. 연합은 이 포고령이 위헌이라며 계속 의사를 진행합니다. 두 달 동안 나라에는 정당한 권력 두 개, 헌법재판소장 세 명, 그리고 누구에게도 딱히 책임지지 않는 내무부 하나가 존재했습니다."
 ukr_history.38.a: "해산하자. 그렇지 않으면 자리를 잃는다."
 ukr_history.38.b: "연합을 받아들이고 남은 권한을 지키자."
 ukr_history.39.t: "우리 우크라이나 - 인민 자위"
 ukr_history.39.d: "대통령의 정당은 유리 루첸코의 인민 자위와 함께 더 큰 연합 안에서 조기 선거에 나섭니다. 인민 자위는 루첸코가 데려온 내무부 장교들을 중심으로 구성되었습니다. 아홉 개 정당이 하나의 명부에 올랐고, 따로 출마하는 데 대한 두려움이 이들을 묶고 있습니다."
 ukr_history.39.a: "그렇다면 어쩔 수 없다."
 ukr_history.40.t: "리트빈 블록"
 ukr_history.40.d: "전 의장이 조기 선거를 위해 자신의 블록을 등록했습니다. 읽을 가치가 있는 강령도, 이름을 댈 만한 적도 없는데, 그것이 요점입니다. 누가 이기든 리트빈은 그들에게 부족한 표가 되겠다는 것입니다."
 ukr_history.40.a: "그렇다면 어쩔 수 없다."
 ukr_history.41.t: "물러선 우크라이나 민족주의자 회의"
 ukr_history.41.d: "단독으로는 3퍼센트 장벽을 넘지 못하고 우리 우크라이나 명부에도 자리를 얻지 못한 우크라이나 민족주의자 회의가 선거에 나서지 않겠다고 발표했습니다. 나라에서 가장 오래된 민족주의 정당이 스보보다에 무대를 내주고 떠납니다."
 ukr_history.41.a: "그렇다면 어쩔 수 없다."
 ukr_history.42.t: "한발 물러선 메드베드추크"
 ukr_history.42.d: "한때 대통령 행정부를 움직이던 조직이었던 우크라이나 사회민주당(통합)이 빅토르 메드베드추크를 유리 자호로드니로 교체했습니다. 이 당의 지지율은 1퍼센트에도 미치지 못합니다. 전 대표는 정계에서 은퇴하는 것이 아니라 어느 나라를 위해 정치를 할지 바꾸고 있습니다."
 ukr_history.42.a: "그렇다면 어쩔 수 없다."
 ukr_history.43.t: "조기 선거"
 ukr_history.43.d: "지역당이 34퍼센트를 얻고도 패배했습니다. 티모셴코 블록이 31퍼센트까지 올라섰고, 우리 우크라이나-인민 자위와 합쳐 오렌지 진영이 228석을 차지했습니다. 두 석 차이의 과반입니다."
 ukr_history.43.a: "그렇다면 어쩔 수 없다."
 ukr_history.44.t: "다시, 오렌지 연정"
 ukr_history.44.d: "티모셴코 블록과 우리 우크라이나-인민 자위가 두 표 차 과반의 연정 협약에 서명했습니다. 관련된 모든 사람은 두 표가 과반이 아니라 인질극이라는 것을 알고 있습니다."
 ukr_history.44.a: "그렇다면 어쩔 수 없다."
 ukr_history.45.t: "내각에 복귀한 티모셴코"
 ukr_history.45.d: "두 번째 시도에서 단 한 표 차로 최고회의가 율리야 티모셴코를 총리로 인준했습니다. 그녀는 소련 붕괴로 잃어버린 저축을 돌려주고 도둑맞은 것을 다시 민영화하겠다고 약속합니다. 그녀를 임명한 대통령은 이미 그녀를 몰아낼 방법을 찾기 시작했습니다."
 ukr_history.45.a: "그렇다면 어쩔 수 없다."
 ukr_history.46.t: "통합 중도당을 세운 발로하"
 ukr_history.46.d: "대통령 비서실장이 휴면 정당을 통합 중도당으로 개편하고 대통령의 지역 조직망을 그곳으로 옮기기 시작했습니다. 공식적으로는 대통령을 지지합니다. 실제로는 우리 우크라이나에 대비한 보험이며, 우리 우크라이나의 모든 사람이 이를 알고 있습니다."
 ukr_history.46.a: "그렇다면 어쩔 수 없다."
 ukr_history.47.t: "사망 선고를 받은 연정"
 ukr_history.47.d: "티모셴코 블록이 대통령의 권한을 줄이기 위해 지역당과 함께 표를 던지자 우리 우크라이나-인민 자위가 퇴장했습니다. 의장은 연단에서 연정이 더 이상 존재하지 않는다고 선언했습니다. 새 연정을 꾸리거나 또 한 번의 선거를 치러야 할 시한은 30일입니다."
 ukr_history.47.a: "그렇다면 어쩔 수 없다."
 ukr_history.48.t: "치러지지 않은 선거"
 ukr_history.48.d: "대통령이 다시 의회를 해산하고 12월 7일에 투표를 하기로 정했습니다. 국고에는 이를 치를 돈이 없고, 법원은 포고령을 막았으며, 세계 금융 위기가 같은 달에 닥쳤습니다. 선거는 조용히 포기되었습니다."
 ukr_history.48.a: "그렇다면 어쩔 수 없다."
 ukr_history.49.t: "위기의 도래"
 ukr_history.49.d: "흐리우냐는 여름 이후 달러 대비 가치가 거의 절반으로 떨어졌습니다. 모든 것을 떠받치던 철강 수출은 세계 수요와 함께 무너졌습니다. 정부는 기금으로부터 160억 달러를 받기로 서명했으며, 그에 딸린 조건은 호황을 구경조차 못 한 사람들이 치르게 될 것입니다."
 ukr_history.49.a: "기금의 돈과 조건을 받아들이자."
 ukr_history.49.b: "조건을 거부하고 필요한 만큼 찍어 내자."
 ukr_history.50.t: "자기 당을 맡은 대통령"
 ukr_history.50.d: "지지율이 한 자릿수로 떨어진 대통령이 마침내 우리 우크라이나의 공식 대표직을 맡았습니다. 지역 조직은 통합 중도당에, 유권자는 다른 모든 이들에게 빼앗긴 정당을 구하려는 시도입니다."
 ukr_history.50.a: "그렇다면 어쩔 수 없다."
 ukr_history.51.t: "리트빈과의 연정"
 ukr_history.51.d: "새로운 다수파가 구성되었습니다. 티모셴코 블록, 우리 우크라이나-인민 자위, 리트빈 블록이며, 그 대가로 리트빈이 다시 의장석에 앉습니다. 이제 스무 명의 의원이 누가 나라를 다스릴지 결정합니다."
 ukr_history.51.a: "그렇다면 어쩔 수 없다."
 ukr_history.52.t: "가스 전쟁"
 ukr_history.52.d: "1월에 19일 동안 가스 통과가 중단되어 유럽의 절반이 추위에 떨었습니다. 총리는 모스크바로 날아가 대통령의 승인도 없이, 자신의 대표단도 없이 직접 10년짜리 계약에 서명했습니다. 그 계약의 가격 산정 공식은 그녀의 남은 경력 내내 그녀를 공격하는 데 쓰일 것입니다."
 ukr_history.52.a: "서명하자. 나라가 얼어붙게 둘 수는 없다."
 ukr_history.52.b: "더 나은 공식을 위해 버티자."
 ukr_history.53.t: "테르노필을 차지한 스보보다"
 ukr_history.53.d: "테르노필 주의회 조기 선거에서 스보보다가 35퍼센트로 1위를 차지했습니다. 2년 전만 해도 전국 지지율 1퍼센트에 못 미쳤던 정당이 이제 한 개 주를 운영합니다. 갈리치아는 오렌지 정당들에 투표하기를 멈추고 모두를 상대로 투표하기 시작했습니다."
 ukr_history.53.a: "그렇다면 어쩔 수 없다."
 ukr_history.54.t: "최악의 해"
 ukr_history.54.d: "산업 생산은 3분의 1이 감소했고 경제는 올해 15퍼센트 위축될 것이며, 1990년대 이후 처음으로 임금 체불이 되돌아왔습니다. 1월 대선의 승자는 지난 5년이 가치 있었다는 믿음을 잃은 나라를 물려받게 될 것입니다."
 ukr_history.54.a: "그렇다면 어쩔 수 없다."
 ukr_history.55.t: "티히프코의 복귀"
 ukr_history.55.d: "전직 중앙은행가는 우크라이나 노동당의 이름을 강한 우크라이나로 바꾸고, 언어나 역사가 아닌 능력을 내세워 대선에 출마했습니다. 그는 이기지 못하겠지만, 어느 진영도 원하지 않는 유권자 3분의 1은 마침내 의지할 곳을 얻었습니다."
 ukr_history.55.a: "그렇다면 어쩔 수 없다."
 ukr_history.56.t: "2010년 1차 투표"
 ukr_history.56.d: "야누코비치 35퍼센트, 티모셴코 25퍼센트, 티히프코 13퍼센트, 야체뉵 7퍼센트. 현직 대통령은 5.4퍼센트에 그쳤는데, 이는 어느 나라에서든 현직 대통령이 기록한 최악의 결과입니다. 오렌지 혁명은 그것을 일으킨 사람들에 의해 표로 퇴출되었습니다."
 ukr_history.56.a: "그렇다면 어쩔 수 없다."
 ukr_history.57.t: "안정과 개혁"
 ukr_history.57.d: "새 다수파는 헌법이 분명하게 허용하지 않는 방식, 즉 교섭단체 전체가 아닌 개별 의원이 연정에 가입하는 방식으로 구성되었습니다. 헌법재판소는 한 달 안에 이를 승인할 것입니다. 미콜라 아자로프가 총리가 되었고, 지역당은 대통령직, 정부, 최고회의를 한꺼번에 장악했습니다."
 ukr_history.57.a: "그렇다면 어쩔 수 없다."
 ukr_history.58.t: "당 대표직을 맡은 아자로프"
 ukr_history.58.d: "야누코비치가 대통령직으로 옮겨 가면서 총리가 공식적으로 지역당을 넘겨받았습니다. 당은 이제 내각의 연장선이며, 당을 일으킨 도네츠크 기업 집단들은 국가의 몫을 챙기고 있습니다."
 ukr_history.58.a: "그렇다면 어쩔 수 없다."
 ukr_history.59.t: "야체뉵의 변화 전선"
 ukr_history.59.d: "대선에서 존경할 만한 4위를 기록한 아르세니 야체뉵이 자신의 선거운동을 정당으로 전환했습니다. 변화 전선은 2004년 양 진영 모두에 질린 유권자들에게 기술 관료적 능력과 유럽 통합을 제시합니다."
 ukr_history.59.a: "그렇다면 어쩔 수 없다."
 ukr_history.60.t: "2004년을 되돌린 법원"
 ukr_history.60.d: "헌법재판소는 2004년 정치 개혁이 절차상의 이유로 위헌이라고 판결하고 하룻밤 사이에 1996년 헌법을 복원했습니다. 의회제 공화국 아래에서 취임한 대통령이 최고회의에서 단 한 표도 던지지 않은 채 이제 대통령제 공화국을 통치합니다."
 ukr_history.60.a: "그렇다면 어쩔 수 없다."
 ukr_history.61.t: "지방 선거"
 ukr_history.61.d: "지역당이 남부와 동부, 그리고 중부 대부분을 차지했습니다. 갈리치아에서는 스보보다가 세 곳의 주의회 모두에서 1위를 했습니다. 우리 우크라이나는 2004년에 자신이 그렸던 지도에서 지워졌고, 그 자리는 3년 전 1퍼센트였던 정당의 몫이 되었습니다."
 ukr_history.61.a: "그렇다면 어쩔 수 없다."
 ukr_history.62.t: "세금 마이단"
 ukr_history.62.d: "소상인과 기업가들이 새 세법에 반대하여 독립 광장에 다시 천막을 쳤습니다. 광장에 정당 깃발은 없으며 주최 측은 정치인들에게 접근하지 말라고 요청했습니다. 대통령은 가장 심한 조항에 거부권을 행사했으나, 천막촌은 그래도 밤중에 철거되었습니다."
 ukr_history.62.a: "법안에 거부권을 행사하고 광장을 정리하자."
 ukr_history.62.b: "법안을 그대로 밀어붙이자."
