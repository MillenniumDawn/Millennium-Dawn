l_english:
 econ_forum_category: "Economic Forums"
 econ_forum_category_desc: "Economic forums compete every year for governments, companies and headline speakers. Each summit's score pulls its forum's prestige toward it, and prestige draws the next year's guests. A forum with 60 or more prestige invites every regional power automatically. A forum with 50 or more prestige also publishes a competitiveness report at each summit that draws at least six guests: its top three guests get cheaper investment for a year, and its bottom three pay more.\n[econ_forum_standing_line_0][econ_forum_standing_line_2][econ_forum_standing_line_1][econ_forum_standing_line_3][econ_forum_standing_line_4][econ_forum_standing_line_5][econ_forum_standing_line_6][econ_forum_standing_line_7][econ_forum_standing_line_8]\n\n[econ_forum_preparation_status]\n[econ_forum_program_status]"
 econ_forum_standing_0: "\n§YWorld Economic Forum§!: prestige [?global.econ_forum_prestige^0|0]. Its last summit drew [?global.econ_forum_last_heads^0|0] heads of government and [?global.econ_forum_last_ministers^0|0] ministerial delegations."
 econ_forum_standing_0_vacant: "\n§YWorld Economic Forum§!: vacant until the owner of its seat is free to host it. Prestige [?global.econ_forum_prestige^0|0]."
 econ_forum_standing_2: "\n§YSt. Petersburg International Economic Forum§!: prestige [?global.econ_forum_prestige^2|0]. Its last summit drew [?global.econ_forum_last_heads^2|0] heads of government and [?global.econ_forum_last_ministers^2|0] ministerial delegations, and signed [?global.econ_forum_last_ceremonies^2|0] agreements."
 econ_forum_standing_2_vacant: "\n§YSt. Petersburg International Economic Forum§!: vacant until the owner of its seat is free to host it. Prestige [?global.econ_forum_prestige^2|0]."
 econ_forum_standing_1: "\n§YVisegrád Economic Conference§!: prestige [?global.econ_forum_prestige^1|0]. Its last summit drew [?global.econ_forum_last_heads^1|0] heads of government and [?global.econ_forum_last_ministers^1|0] ministerial delegations, and signed [?global.econ_forum_last_ceremonies^1|0] agreements."
 econ_forum_standing_1_vacant: "\n§YVisegrád Economic Conference§!: vacant until the owner of its seat is free to host it. Prestige [?global.econ_forum_prestige^1|0]."
 econ_forum_standing_3: "\n§YBoao Forum for Asia§!: prestige [?global.econ_forum_prestige^3|0]. Its last summit drew [?global.econ_forum_last_heads^3|0] heads of government and [?global.econ_forum_last_ministers^3|0] ministerial delegations, and signed [?global.econ_forum_last_ceremonies^3|0] agreements."
 econ_forum_standing_3_vacant: "\n§YBoao Forum for Asia§!: vacant until the owner of its seat is free to host it. Prestige [?global.econ_forum_prestige^3|0]."
