 ENG_border_poll_cooldown: "Um plebiscito de fronteira foi realizado recentemente"
 ENG_referendum_region_scotland: "Escócia"
 ENG_referendum_region_northern_ireland: "Irlanda do Norte"
 ENG_referendum_region_wales: "País de Gales"
 ENG_referendum_region_none: "a União"
 ENG_unionist_campaign_tour: "Turnê da Campanha Unionista"
 ENG_unionist_campaign_tour_desc: "Colocar o Gabinete na estrada. Prefeituras, chãos de fábrica, estaleiros e sindicatos universitários, todos os dias da campanha, defendendo o argumento pessoalmente em vez de por meio de um comunicado redigido em Londres. Move alguns pontos e pode ser repetido enquanto os ministros aguentarem.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_fiscal_settlement_offer: "Oferecer um Acordo Fiscal"
 ENG_fiscal_settlement_offer_desc: "Abrir o Tesouro. Uma transferência garantida, projetos de capital confirmados em vez de prometidos e um piso na fórmula de financiamento, tudo assinado antes do dia da votação. Eleitores que pesam a independência contra suas finanças domésticas percebem, e a dependência da região em relação a Westminster se aprofunda a cada libra.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_discredit_separatists: "Desacreditar a Campanha Separatista"
 ENG_discredit_separatists_desc: "Vazar informações contra a liderança separatista. Seus planos monetários, seus arranjos de fronteira, suas finanças e, se os vazamentos seguirem esse caminho, suas vidas privadas. Funciona mais vezes do que não, e quando não funciona lhes entrega uma queixa e uma manchete.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_discredit_separatists_tt: "§G60%§! de chance de a campanha pegar e o apoio à saída cair drasticamente.\n§R40%§! de chance de sair pela culatra, elevando tanto o voto pela saída quanto a agitação local."
 ENG_further_devolution_pledge: "Prometer Mais Devolução"
 ENG_further_devolution_pledge_desc: "A última carta na mão: uma promessa assinada de que um voto por permanecer será respondido com novos poderes sobre impostos, bem-estar social e radiodifusão. Move o voto separatista moderado e tira o calor da política nacionalista por uma geração, ao preço de entregar as alavancas de que Westminster precisaria para manter a região unida da próxima vez.\n\nPode ser prometido uma vez por campanha.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_referendum_leave_vote_down_4_tt: "$ENG_integration_vote$: §G+4§!%"
 ENG_referendum_leave_vote_down_6_tt: "$ENG_integration_vote$: §G+6§!%"
 ENG_referendum_leave_vote_down_7_tt: "$ENG_integration_vote$: §G+7§!%"
 ENG_promote_unionism_scotland: "Defender a União na Escócia"
 ENG_promote_unionism_scotland_desc: "Financiar a operação de base dos partidos unionistas na Escócia entre as eleições, e não durante elas: escritórios de circunscrição mantidos abertos, candidatos recrutados em distritos que o partido havia abandonado e uma defesa sustentada da União feita onde ninguém se deu ao trabalho de fazê-la por anos. Lento, sem glamour, e a única coisa que faz o Nacionalismo Escocês cair."
 ENG_scottish_unionism_calm_tt: "A Agitação Escocesa está abaixo de §G25§! (atualmente §Y[?ENG_scottish_agitation|0]§!)"
 ENG_promote_unionism_nireland: "Defender a União na Irlanda do Norte"
 ENG_promote_unionism_nireland_desc: "Financiar a organização cívica unionista na Irlanda do Norte fora da temporada de marchas: projetos comunitários nas áreas de fronteira entre comunidades, programas de emprego intercomunitários e candidatos capazes de manter uma cadeira sem fazer campanha pela fronteira. Trabalho lento, e a única coisa que faz o Nacionalismo Norte-Irlandês cair."
 ENG_north_irish_unionism_calm_tt: "A Tensão Sectária está abaixo de §G25§! (atualmente §Y[?ENG_north_irish_agitation|0]§!)"
 ENG_promote_unionism_wales: "Defender a União no País de Gales"
 ENG_promote_unionism_wales_desc: "Financiar a organização dos partidos unionistas no País de Gales: trabalho de circunscrição nos vales, campanha em língua galesa que não cede o idioma aos nacionalistas e uma defesa positiva da União em vez de um argumento de que as contas não fecham. Lento, e a única coisa que faz o Nacionalismo Galês cair."
 ENG_wales_unionism_calm_tt: "A Agitação Galesa está abaixo de §G25§! (atualmente §Y[?ENG_wales_agitation|0]§!)"
 ENG_convene_constitutional_convention: "Convocar uma Convenção Constitucional"
 ENG_convene_constitutional_convention_desc: "O acordo constitucional de 1998 foi escrito às pressas, por pessoas que esperavam renegociá-lo mais tarde, e esse mais tarde chegou. Convoque uma convenção suprapartidária sobre o futuro formato da União: as administrações devolvidas, as bancadas da oposição, as igrejas e os sindicatos, reunidos por seis meses e prestando contas ao Parlamento, e não ao Gabinete.\n\nA convenção não decide nada por si só. Seu relatório é a base jurídica e política sobre a qual Westminster pode propor um acordo permanente à Escócia, à Irlanda do Norte ou ao País de Gales, e sem ele nenhuma oferta de acordo seria levada a sério por ninguém.\n\nExige um governo estável o bastante para sobreviver ao debate e nenhuma campanha de referendo ou independência já em andamento."
 ENG_scottish_union_settlement: "Propor um Acordo de União Escocês"
 ENG_scottish_union_settlement_desc: "Com a política escocesa calma, as finanças escocesas atreladas ao Tesouro e os partidos pró-independência em seu ponto mais fraco, Westminster pode levar a questão constitucional à Escócia em seus próprios termos, em vez de esperar ser questionada. Um acordo aprovado nas urnas é um dos três que Westminster precisa vencer antes que o processo de devolução termine de forma permanente: o lugar da Escócia no Reino Unido é inscrito em lei, um referendo por vez, e cada vitória aproxima Holyrood de deixar de ser um caminho de saída da União.\n\nUm acordo rejeitado não muda nada além do dinheiro gasto para convocá-lo, e a região entra em um período de carência de cinco anos antes que outro possa ser tentado.\n\nReferendos vencidos: §Y[?ENG_scottish_referendum_success|0]§!/§G3§!\nPressão pela independência: §Y[?ENG_scottish_pressure|0]§!/§G20§!\nNacionalismo Escocês: §Y[?ENG_scottish_nationalists|0]§!/§G25§!"
 ENG_scottish_settlement_calm_tt: "A pressão pela independência escocesa está abaixo de §G20§! (atualmente §Y[?ENG_scottish_pressure|0]§!)"
 ENG_scottish_settlement_ready_tt: "O Nacionalismo Escocês está abaixo de §G25§! (atualmente §Y[?ENG_scottish_nationalists|0]§!)"
 ENG_north_irish_union_settlement: "Propor um Acordo de União Norte-Irlandês"
 ENG_north_irish_union_settlement_desc: "Com os dissidentes desativados, a Província calma e a política republicana em seu ponto mais fraco, Westminster pode levar a questão constitucional à Irlanda do Norte em seus próprios termos. Um acordo aprovado nas urnas é um dos três que Westminster precisa vencer antes que o processo de devolução termine de forma permanente e o plebiscito de fronteira deixe de ser um caminho de saída da União.\n\nUm acordo rejeitado não muda nada além do dinheiro gasto para convocá-lo, e a região entra em um período de carência de cinco anos antes que outro possa ser tentado.\n\nReferendos vencidos: §Y[?ENG_north_irish_referendum_success|0]§!/§G3§!\nPressão pela independência: §Y[?ENG_north_irish_pressure|0]§!/§G20§!\nNacionalismo Norte-Irlandês: §Y[?ENG_north_irish_nationalists|0]§!/§G25§!"
 ENG_north_irish_settlement_calm_tt: "A pressão pela independência norte-irlandesa está abaixo de §G20§! (atualmente §Y[?ENG_north_irish_pressure|0]§!)"
 ENG_north_irish_settlement_ready_tt: "O Nacionalismo Norte-Irlandês está abaixo de §G25§! (atualmente §Y[?ENG_north_irish_nationalists|0]§!)"
 ENG_welsh_union_settlement: "Propor um Acordo de União Galês"
 ENG_welsh_union_settlement_desc: "Com a política galesa calma e a ala independentista do Senedd marginal, Westminster pode resolver a questão constitucional no País de Gales antes que alguém a levante. Um acordo aprovado nas urnas é um dos três que Westminster precisa vencer antes que o processo de devolução termine de forma permanente e o lugar do País de Gales no Reino Unido seja inscrito em lei.\n\nUm acordo rejeitado não muda nada além do dinheiro gasto para convocá-lo, e a região entra em um período de carência de cinco anos antes que outro possa ser tentado.\n\nReferendos vencidos: §Y[?ENG_welsh_referendum_success|0]§!/§G3§!\nPressão pela independência: §Y[?ENG_wales_pressure|0]§!/§G20§!\nNacionalismo Galês: §Y[?ENG_wales_nationalists|0]§!/§G25§!"
 ENG_wales_settlement_calm_tt: "A pressão pela independência galesa está abaixo de §G20§! (atualmente §Y[?ENG_wales_pressure|0]§!)"
 ENG_wales_settlement_ready_tt: "O Nacionalismo Galês está abaixo de §G25§! (atualmente §Y[?ENG_wales_nationalists|0]§!)"
 devolution.11.t: "[ENG_GetReferendumRegion] Vota por Sair"
 devolution.11.d: "A contagem terminou e o resultado não deixa dúvidas. Uma maioria votou por deixar o Reino Unido, e o governo que convocou o referendo é obrigado a dar efeito a ele. As negociações sobre defesa, dívida, moeda e fronteira começam imediatamente, e o primeiro ato é o constitucional: a transferência de poderes que Westminster passou uma geração se recusando a conceder agora é uma transferência de soberania."
 devolution.11.a: "O resultado é respeitado."
 devolution.12.t: "A União Resiste"
 devolution.12.d: "A campanha pela saída perdeu. A participação foi alta, a margem é clara o bastante para que ninguém crível a conteste, e a questão constitucional está encerrada por uma geração pelos termos claros da votação. Os partidos separatistas vão se reagrupar, e a amargura de uma campanha derrotada levará anos para assentar, mas o Reino Unido está intacto e Westminster tem uma resposta para a próxima vez que a demanda for levantada."
 devolution.12.a: "Uma vez a cada geração."
 devolution.13.t: "O Acordo É Aprovado"
 devolution.13.d: "O acordo foi aprovado. [ENG_GetReferendumRegion] votou por encerrar a questão constitucional nos termos de Westminster, e o resultado passa a fazer parte do mandato: um dos três referendos que o governo precisa vencer antes que o processo de devolução termine aqui de vez. Os partidos nacionalistas ficam argumentando contra um resultado entregue por seus próprios eleitores."
 devolution.13.a: "A questão está resolvida."
 devolution.14.t: "O Acordo É Rejeitado"
 devolution.14.d: "O acordo foi derrotado nas urnas. [ENG_GetReferendumRegion] continua parte da União no nome, mas o resultado encoraja os partidos separatistas, e o dinheiro e o capital político gastos para convocar a votação se perderam. A resistência ao domínio de Westminster se endurece na região até que a questão constitucional seja finalmente resolvida. Westminster poderá apresentar a questão novamente quando o período de carência de cinco anos da região terminar."
 devolution.14.a: "Um erro custoso."
