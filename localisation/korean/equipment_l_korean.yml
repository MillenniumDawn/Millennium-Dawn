 attack_helicopter_6: "Attack Helicopter 2055"
 attack_helicopter_6_desc: "An attack helicopter is a military helicopter equipped with offensive weapons. Its main weapons are rapid-fire automatic weapons (cannons and machine guns), rocket launchers, and precision-guided weapons (missiles). Many attack helicopters can also be equipped with anti-aircraft missiles, but they are mainly used for self-defense. Today's attack helicopters are similar in function to fixed-wing attack aircraft and are specifically designed to attack ground targets such as infantry, armored vehicles, and buildings."
 attack_helicopter_7: "Attack Helicopter 2075"
 attack_helicopter_7_desc: "An attack helicopter is a military helicopter equipped with offensive weapons. Its main weapons are rapid-fire automatic weapons (cannons and machine guns), rocket launchers, and precision-guided weapons (missiles). Many attack helicopters can also be equipped with anti-aircraft missiles, but they are mainly used for self-defense. Today's attack helicopters are similar in function to fixed-wing attack aircraft and are specifically designed to attack ground targets such as infantry, armored vehicles, and buildings."
