 NKO_southern_propaganda_broadcasts: "Transmisiones de Propaganda del Sur de Corea"
 NKO_southern_propaganda_broadcasts_desc: "This national spirit will be §RRemoved§! if we complete the §HCease Propaganda Broadcasts§! focus. \n§W--------------§!\n 2-6 hours per day, the South Korean military uses loudspeakers to broadcast messages at North Korean troops guarding the DMZ. The messages range from weather reports to K-pop and, most significantly, critical reports of the North alongside positive portrayals of the South."
 KOR_northern_propaganda_broadcasts: "Transmisiones de Propaganda del Norte de Corea"
 KOR_northern_propaganda_broadcasts_desc: "La contraparte norcoreana de las transmisiones del Sur de noticias y música K-pop a través de la frontera busca proporcionar una narrativa alternativa a la de la República de Corea. Las transmisiones norcoreanas elogian el sistema de gobierno de la RPDC mientras denigran el sistema capitalista del Sur. Propensas a problemas técnicos, estas transmisiones del Norte representan menos una amenaza y más un recordatorio duradero de la tensión en la península coreana."
 KOR_idea_growth_by_innovation: "Crecimiento mediante la Innovación"
 NKO_southern_balloon_leaflets: "Folletos en Globos del Sur de Corea"
 NKO_southern_balloon_leaflets_desc: "This national spirit will be §RRemoved§! if §HSouth Korea is Annexed§!. \n§W--------------§!\n South Koreans and North Korean defectors regularly send balloons into the North that drop thousands of leaflets in North Korean territory, drawing angry reactions from Pyongyang. While those sending the leaflets argue that they are trying to help their northern compatriots against a dictatorial regime, their critics argue that the leaflets unnecessarily antagonize the North and endanger South Koreans living near the border."
 KOR_intensified_propaganda: "Intensificación de la Propaganda del Sur"
 KOR_intensified_propaganda_desc: "A través de una amplia variedad de medios, el gobierno del sur busca socavar nuestra legitimidad. Tomará tiempo para que podamos contrarrestar este masivo ataque propagandístico."
 KOR_global_korea: "Corea Global"
 KOR_global_korea_desc: "The days when Korea had no need to preoccupy itself with foreign affairs are over. A Global Korea will seek to engage the world as a power within its own right."
 KOR_reunification_shocks: "Choques de Reunificación"
 KOR_reunification_shocks_desc: "Después de décadas de separación, las dos Coreas finalmente se reunifican formalmente. Sin embargo, las dos mitades del país siguen extremadamente polarizadas y el costo económico de la reunificación ha causado un gran impacto. El nuevo gobierno debe tomar medidas rápidas para resolver las diferencias que continúan existiendo a lo largo del paralelo 38, o correr el riesgo de la disolución del joven estado coreano."
 KOR_divided_military: "Ejército Dividido"
 KOR_divided_military_desc: "La nación coreana reunificada hereda dos fuerzas de combate formidables de sus predecesores. Sin embargo, el nuevo estado debe encontrar una manera de superar las dificultades graves en sus intentos de gestionar este ejército sobredimensionado, difícil de controlar y dividido internamente si quiere asegurarse."
 KOR_mass_migration: "Migración Masiva"
 KOR_mass_migration_desc: "Una ramificación significativa de la reunificación es la migración masiva de familias en busca de mejores oportunidades a lo largo del paralelo 38. La inmensa escala y velocidad de este movimiento es altamente desestabilizadora, causando caos en todo el país."
 KOR_fragmented_governance: "Gobierno Fragmentado"
 KOR_fragmented_governance_desc: "Si bien Corea ahora existe formalmente como un único estado soberano, en realidad existen dos culturas políticas muy diferentes a lo largo del paralelo 38. La cuestión de cómo gobernar el país es algo que debe resolverse rápidamente."
 KOR_uneven_economy_2: "Economía Desigual"
 KOR_uneven_economy_2_desc: "Inevitablemente, la significativa discrepancia en los niveles de desarrollo económico entre las dos Coreas está teniendo un impacto después de la reunificación. Para que la nueva nación coreana desbloquee todo su potencial económico, esta desigualdad debe ser rectificada."
 KOR_uneven_economy_3: "Economía Planificada"
 KOR_uneven_economy_3_desc: "Una economía planificada es un tipo de sistema económico en el que la inversión, la producción y la asignación de bienes de capital se llevan a cabo de acuerdo con planes económicos y de producción en toda la economía. Una economía planificada puede utilizar formas centralizadas, descentralizadas, participativas o de tipo soviético de planificación económica. El nivel de centralización o descentralización en la toma de decisiones y la participación depende del tipo específico de mecanismo de planificación empleado."
 KOR_uneven_economy_3_1: "Economía Planificada"
 KOR_uneven_economy_3_1_desc: "Una economía planificada es un tipo de sistema económico en el que la inversión, la producción y la asignación de bienes de capital se llevan a cabo de acuerdo con planes económicos y de producción en toda la economía. Una economía planificada puede utilizar formas centralizadas, descentralizadas, participativas o de tipo soviético de planificación económica. El nivel de centralización o descentralización en la toma de decisiones y la participación depende del tipo específico de mecanismo de planificación empleado."
 KOR_uneven_economy_3_2: "Economía Planificada"
 KOR_uneven_economy_3_2_desc: "Una economía planificada es un tipo de sistema económico en el que la inversión, la producción y la asignación de bienes de capital se llevan a cabo de acuerdo con planes económicos y de producción en toda la economía. Una economía planificada puede utilizar formas centralizadas, descentralizadas, participativas o de tipo soviético de planificación económica. El nivel de centralización o descentralización en la toma de decisiones y la participación depende del tipo específico de mecanismo de planificación empleado."
 KOR_uneven_economy_4: "Apoyar el Mercado"
 KOR_uneven_economy_4_desc: "We will keep a hand under our economy. While not dictating the market, we will support business and do what we can to support the entirety of our economy"
 KOR_uneven_economy_4_1: "Apoyar el Mercado"
 KOR_uneven_economy_4_1_desc: "Mantendremos una mano en nuestra economía, pero no dictaremos el mercado. Apoyaremos a las empresas y haremos todo lo posible para respaldar nuestra economía en su totalidad."
 KOR_uneven_economy_4_2: "Apoyar el Mercado"
 KOR_uneven_economy_4_2_desc: "Mantendremos una mano en nuestra economía, pero no dictaremos el mercado. Apoyaremos a las empresas y haremos todo lo posible para respaldar nuestra economía en su totalidad."
 KOR_uneven_economy_5: "Mercado Libre"
 KOR_uneven_economy_5_desc: "En economía, un mercado libre es un modelo cognitivo idealizado de un sistema económico en el que los precios de bienes y servicios son determinados por la oferta y la demanda expresadas por los vendedores y los compradores. Tales mercados, tal como se modelan, operan sin la intervención del gobierno o cualquier otra autoridad externa. Los defensores del mercado libre como un ideal normativo lo contrastan con un mercado regulado, en el cual un gobierno interviene en la oferta y la demanda mediante diversos métodos como impuestos o regulaciones. En una economía de mercado libre idealizada, los precios de bienes y servicios se establecen únicamente mediante las ofertas y las demandas de los participantes."
 KOR_uneven_economy_5_1: "Mercado Libre"
 KOR_uneven_economy_5_1_desc: "En economía, un mercado libre es un modelo cognitivo idealizado de un sistema económico en el que los precios de bienes y servicios son determinados por la oferta y la demanda expresadas por los vendedores y los compradores. Tales mercados, tal como se modelan, operan sin la intervención del gobierno o cualquier otra autoridad externa. Los defensores del mercado libre como un ideal normativo lo contrastan con un mercado regulado, en el cual un gobierno interviene en la oferta y la demanda mediante diversos métodos como impuestos o regulaciones. En una economía de mercado libre idealizada, los precios de bienes y servicios se establecen únicamente mediante las ofertas y demandas de los participantes."
 KOR_uneven_economy_5_2: "Mercado Libre"
 KOR_uneven_economy_5_2_desc: "En economía, un mercado libre es un modelo cognitivo idealizado de un sistema económico en el que los precios de bienes y servicios son determinados por la oferta y la demanda expresadas por los vendedores y los compradores. Tales mercados, tal como se modelan, operan sin la intervención del gobierno o cualquier otra autoridad externa. Los defensores del mercado libre como un ideal normativo lo contrastan con un mercado regulado, en el cual un gobierno interviene en la oferta y la demanda mediante diversos métodos como impuestos o regulaciones. En una economía de mercado libre idealizada, los precios de bienes y servicios se establecen únicamente mediante las ofertas y demandas de los participantes."
