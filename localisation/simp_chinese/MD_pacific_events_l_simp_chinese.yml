l_simp_chinese:
 Solomon_Islands.1.t: "首都附近出现武装团体"
 Solomon_Islands.1.d: "为了应对日益严重的针对马拉伊塔人的敌对行为，激进的马拉伊塔雄鹰部队应运而生，旨在对抗伊萨塔布自由运动。双方冲突已然爆发，据报道，甚至有我们自己的警察部队成员加入了马拉伊塔雄鹰部队一方。更糟糕的是，该组织目前由政治老手安德鲁·诺里领导，这无疑提升了他们在公众眼中的可信度。"
 Solomon_Islands.1.a: "情况越来越糟了。"
 Solomon_Islands.2.t: "霍尼亚拉围城战"
 Solomon_Islands.2.d: "霍尼亚拉的政治局势已达到崩溃边缘。经过数月各派系之间的种族冲突，据报道，马拉伊塔雄鹰部队成员在准军事警察部队部分人员的协助下，已经控制了首都周边的关键战略要地。\n\n我们有限的情报显示，他们正朝这个方向前进，意图迫使首相辞职。由于我们几乎没有办法阻止他们，唯一的选择是与伊萨塔布自由运动的残余成员达成协议，明确目的是击退这些武装分子。这样做或许只会加剧他们之间的紧张关系，但也可能阻止政变的发生。"
 Solomon_Islands.2.a: "我们别无选择。"
 Solomon_Islands.2.b: "把他们赶回去。"
 Solomon_Islands.3.t: "和平的承诺"
 Solomon_Islands.3.d: "尽管政府已恢复正常运作，但首都岛屿上的袭击事件仍然屡见不鲜。我们与澳大利亚政府已就境外中立地区举行和平谈判的设想进行了探讨。汤斯维尔是其中一个备选地点。届时，马拉伊塔雄鹰部队和伊萨塔布自由运动的成员将出席谈判，以化解彼此间的矛盾，并有望制定相关条款，防止此类冲突再次发生。"
 Solomon_Islands.3.a: "一项值得做的努力。"
 Solomon_Islands.4.t: "所罗门群岛和平谈判"
 Solomon_Islands.4.d: "所罗门群岛的外交官已向我们提出请求，希望我们能够调解当地省政府与各武装组织之间的和平谈判。\n\n1999年的种族冲突之后，马拉伊塔人在西部省份遭受的歧视日益加剧。紧张局势最终演变为首都周边地区的暴力冲突，并导致其前任领导人被推翻。我们在岛屿地区已经拥有相当规模的驻军，这很可能是他们前来寻求我们协助的原因。"
 Solomon_Islands.4.a: "任何破坏稳定的手段。"
 Solomon_Islands.4.b: "这不关我们的事。"
 Solomon_Islands.5.t: "风暴"
 Solomon_Islands.5.d: "我们在岛屿上勉强维持的和平已经彻底崩溃。数月来的政治掠夺、资金的消失和哨所的空置，仅仅是这场席卷而来的风暴的前奏。武装冲突卷土重来，规模远超以往，将大片乡村变成了彻底的战区。全国各地的公司纷纷关门歇业，成千上万的人被迫离开家园，逃离这个国家。\n\n我们距离内战仅一步之遥。或许我们最好的选择是请求邻国立即介入，首先是向我们最亲密的盟友澳大利亚求助。他们的介入无疑会削弱我们的独立性，但我们别无选择，未来前景黯淡。"
 Solomon_Islands.6.t: "澳大利亚批准干预行动"
 Solomon_Islands.6.d: "澳大利亚政府已真诚回应我们的请求，并承诺派遣一支干预部队协助稳定局势。他们将很快开始组建这支特遣部队，其外交官计划与我方外交官会面，协调行动。预计的措施包括派遣2000名警察和军队人员，以及建筑队协助我们。"
 Solomon_Islands.6.a: "或许还有希望。"
 Solomon_IslandsNews.1002.t: "所罗门群岛发生武装政变"
 Solomon_IslandsNews.1002.d: "所罗门群岛总理巴塞洛缪·乌卢法阿卢昨天被名为“马拉伊塔雄鹰部队”的武装组织持枪劫持为人质，迫使他辞职。\n\n政变发生前，政府未能遏制霍尼亚拉岛首府一系列局势升级的事件，最终导致马拉伊塔雄鹰部队和伊萨塔布自由运动之间爆发冲突。过去18个月里，约有60人在种族冲突中丧生，引发了岛上的移民危机。政变领导人现在声称自己是霍尼亚拉的唯一统治者。"
 Solomon_IslandsNews.1002.a: "风暴将至"
 SOL_Lead_to_hostilities_TT: "§R紧张局势将会升级。§!"
 SOL_IFM: "伊萨塔布自由运动"
 Solomon_Islands.0.t: "霍尼亚拉的种族紧张局势加剧"
 Solomon_Islands.0.d: "瓜达尔卡纳尔岛上马拉伊塔移民遭受的虐待持续引发岛上的族群冲突。数千名马拉伊塔人已被名为“伊萨塔布自由运动”的组织强迫逃离家园，首府周边也设置了路障，阻止人们自由进入该省。\n\n虽然我们的警察似乎已被压制或被收买，但我们只能袖手旁观，希望事态不会继续失控。"
 Solomon_Islands.0.a: "这一切都会过去的。"
 Solomon_Islands.3.b: "纯粹是浪费时间。"
 solomon_islands.5.a: "进行呼吁"
 solomon_islands.5.b: "我们只能靠自己了。"
 Solomon_Islands.7.t: "波涛之上，一片寂静"
 Solomon_Islands.7.d: "澳大利亚政府拒绝了我们的干预请求，让我们只能靠自己应对即将到来的风暴。"
 Solomon_Islands.7.a: "我们真的孤立无援。"
 Solomon_Islands.8.t: "干预失败"
 Solomon_Islands.8.d: "鉴于此次干预行动彻底失败，澳大利亚军队选择止损，并已开始从岛屿撤离。由于我们自身兵力不足以保卫国家，我们极有可能再次陷入危机。尽管我们竭尽全力，但仍无法扭转不可避免的局面。"
 Solomon_Islands.8.a: "夜幕降临群岛"
 SOL_worsening_ethnic_tensions_TT: "民族紧张局势将§R恶化§!"
 SOL_munda_accords: "蒙达协议"
 SOL_munda_accords_desc: "20世纪90年代冲突升级后，制定了一系列规定来缓解国内移民增加带来的紧张局势。该协议限制失业流浪者跨省流动，强制将马莱塔人遣返回当地省份，并阻止外国收购土地。"
 SOL_western_logging_efforts: "西部伐木活动"
 SOL_western_logging_efforts_desc: "西部省的商业伐木业已迅速成为我们最赚钱的产业，占我们出口总额的大部分，并为该地区提供了经济支柱。然而，近年来，伐木业的成功吸引了来自岛屿各地的大量移民前来寻找工作，导致该地区出现了严重的移民危机。"
 SOL_aftermath_of_the_tensions: "紧张局势的后果"
 SOL_aftermath_of_the_tensions_desc: "虽然1999年的协议为各种文化争端提供了更多承认和法律途径，但岛屿上的和平仍然十分脆弱。除非我们能够掌控政府的现状，并解决该国持续存在的移民问题，否则我们可能无法阻止另一场危机的爆发。\n§W--------------§!\n如果稳定性高于§Y70%§!，且腐败程度为§Y（3）适度§!或更高，则该国家精神将被§G移除§!。"
 SOL_agreement_with_the_gangs: "与帮派达成协议"
 SOL_agreement_with_the_gangs_desc: "我们与伊萨塔布自由运动达成的协议为我们争取到了急需的喘息之机，但代价是释放了数十名臭名昭著的罪犯。如今，我们的警方正面临着犯罪率飙升的局面，而公众对我们的信任度也跌至历史新低。"