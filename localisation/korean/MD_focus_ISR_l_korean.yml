 peoples_army_9_desc: "국민군 모델은 이스라엘의 건국의 아버지이자 초대 총리인 다비드 벤구리온이 시작한 개념으로, 그는 이스라엘 국방군을 모든 유대인 하위 집단을 단일한 이스라엘 정체성으로 동화시키려는 자신의 '용광로' 프로젝트의 도구로 보았습니다. 이 학파를 신봉하는 이들은 국방군이 단순히 나라를 지키는 것 이상으로 이스라엘 사회에서 더 큰 역할을 한다고 보며, 따라서 의무 복무 개념을 이스라엘의 생존뿐 아니라 이스라엘의 민주주의와 사회의 초석으로 여깁니다. 이에 따라 직업 군대로의 전환에 관한 모든 논의는 수십 년 동안 이스라엘에서 거대한 금기였지만, 초정통파의 병역 면제를 둘러싼 논쟁은 많은 평범한 이스라엘인들에게 자신들의 병역에 대한 의문을 제기했습니다. 이 논쟁을 가로막던 벽이 무너지고 있으며, 정부와 참모부는 이 문제를 다루어야 할 것입니다. \n\n§t국민군에서 멀어질수록§! 추가적인 육군 경험치와 지휘력을 얻고, 육군 교리 및 사단 편성 연구 비용이 저렴해집니다. §6국민군에 가까워질수록§! 정치력, 전쟁 지지도, 육군 사기, 모집 가능 인구를 얻습니다."
 peoples_army_10: "국민군 - §7강화됨§!"
 peoples_army_10_desc: "인민군 모델은 이스라엘의 건국의 아버지이자 초대 총리인 다비드 벤구리온이 주창한 개념으로, 그는 이스라엘 국방군을 모든 유대인 하위 집단을 단일한 이스라엘 정체성으로 동화시키는 '용광로' 프로젝트의 도구로 보았습니다. 이 학파를 신봉하는 이들은 이스라엘 국방군이 단순히 국가를 방어하는 것 이상으로 이스라엘 사회에서 더 큰 역할을 맡고 있다고 보며, 따라서 의무 징병제를 이스라엘의 존립뿐 아니라 이스라엘의 민주주의와 사회의 초석으로 간주합니다. 그리하여 직업군인제로의 전환에 관한 논의는 수십 년간 이스라엘에서 거대한 금기였으나, 초정통파의 징병 면제를 둘러싼 논쟁은 많은 평범한 이스라엘인들로 하여금 자신들의 징병에 대해 의문을 품게 했습니다. 이 논쟁을 가로막던 벽이 무너지고 있으며, 정부와 총참모부는 이 문제를 다루어야 할 것입니다. \n\n§t인민군에서 멀어질수록§! 육군 경험치와 지휘력을 더 많이 얻고, 육군 교리 및 사단 편제 연구 비용이 저렴해집니다. §6인민군에 더 가까워질수록§! 정치력, 전쟁 지지도, 육군 사기, 징집 가능 인구를 얻습니다."
 peoples_army_11: "인민군 - §7의심할 여지 없음§!"
 peoples_army_11_desc: "인민군 모델은 이스라엘의 건국의 아버지이자 초대 총리인 다비드 벤구리온이 주창한 개념으로, 그는 이스라엘 국방군을 모든 유대인 하위 집단을 단일한 이스라엘 정체성으로 동화시키는 '용광로' 프로젝트의 도구로 보았습니다. 이 학파를 신봉하는 이들은 이스라엘 국방군이 단순히 국가를 방어하는 것 이상으로 이스라엘 사회에서 더 큰 역할을 맡고 있다고 보며, 따라서 의무 징병제를 이스라엘의 존립뿐 아니라 이스라엘의 민주주의와 사회의 초석으로 간주합니다. 그리하여 직업군인제로의 전환에 관한 논의는 수십 년간 이스라엘에서 거대한 금기였으나, 초정통파의 징병 면제를 둘러싼 논쟁은 많은 평범한 이스라엘인들로 하여금 자신들의 징병에 대해 의문을 품게 했습니다. 이 논쟁을 가로막던 벽이 무너지고 있으며, 정부와 총참모부는 이 문제를 다루어야 할 것입니다. \n\n§t인민군에서 멀어질수록§! 육군 경험치와 지휘력을 더 많이 얻고, 육군 교리 및 사단 편제 연구 비용이 저렴해집니다. §6인민군에 더 가까워질수록§! 정치력, 전쟁 지지도, 육군 사기, 징집 가능 인구를 얻습니다."
 kirya_glilot_tensions: "키랴-글릴롯 긴장"
 kirya_glilot_tensions_desc: "이스라엘은 주요 정보 수집 기관이 군에 편입되어 있는, 세계에서 몇 안 되는 국가 중 하나입니다. 이스라엘 국방정보국은 세계에서 가장 성공적인 정보기관 중 하나이지만, 수집된 방대한 정보를 평가하는 두 부대, 즉 정보를 분석하여 정부에 전달하는 임무를 맡은 조사국과 정보를 입수하는 임무를 맡은 8200부대는 끊임없는 경쟁 관계에 놓여 있습니다. 이 둘 사이의 갈등은 종종 격한 어조로 번지며, 이로 인해 협력이 어렵습니다.\n§W--------------§!\n§Y$ISR_research_department_focus$§!, §Y$ISR_aman_info_focus$§! 또는 §Y$ISR_balance_hatam_aman_focus$§! 중점을 완료하면 이 국가 정신은 §R제거§!되고 안정된 정보 위계로 대체됩니다."
 state_of_tel_aviv: "텔아비브 국가"
 state_of_tel_aviv_desc: "대부분의 도시 중심부는 자국의 축소판이지만, 텔아비브는 이스라엘 전체와 진정으로 예외적인 도시입니다. 아마도 실리콘밸리와 주강 삼각주에 이어 세계에서 세 번째로 큰 스타트업 및 혁신 중심지로, 수십억 달러의 외국인 투자를 끌어들이고 있습니다. 또한 자유주의 사상의 중심지로서, 인구 대비 성소수자 비율이 지구상에서 가장 높고 인도를 제외하면 비건과 채식주의자가 지구상에서 가장 많은 도시입니다. 많은 아랍인과 이스라엘 농촌 주민들에게 이 도시는 거의 정치적 거품처럼 느껴지며, 심지어 평론가들이 '두 국가 해법'을 색다른 방식으로, 즉 이스라엘 국가와 텔아비브 국가로 칭할 정도입니다."
 unintegrated_ultraorthodox_community_1: "§t고립주의§! 정통파 공동체"
 unintegrated_ultraorthodox_community_1_desc: "하레디 유대인으로 흔히 알려진 초정통파 공동체는 유대 정통파 내에서도 특히 종교적인 공동체입니다. 홀로코스트 이후 수가 적었음에도 다비드 벤구리온은 '네 가지 요점'의 형태로 이들에게 수많은 양보를 허용했습니다. 그중 가장 두드러진 것은 예시바 학생들이 수업에서 토라 외의 과목을 걱정하거나 징병되거나 노동 시장에 진입할 필요 없이 토라를 공부할 수 있게 한 것으로, 정부가 이들의 생계비를 보조합니다. 높은 출산율로 인해 이들의 인구가 향후 수십 년간 극도로 가파르게 증가할 것으로 예상되는 가운데, 그토록 많은 실업 인구를 정부 보조금으로 떠받친다는 발상은 생각할 수도 없는 일입니다. 무언가는 바뀌어야 합니다.\n§W--------------§!\n§Y$ISR_stop_yeshiva_money$§!, §Y$ISR_redraft_conscription_law$§! 또는 §Y$ISR_tal_law$§!처럼 하레디 공동체를 노동 시장과 군에 끌어들이는 중점을 완료하면 이 국가 정신은 §G개선§!되며, §Y$ISR_reform_conversions$§! 또는 §Y$ISR_spread_out_land$§!와 같은 중점을 완료하면 §R악화§!됩니다. 이 국가 정신은 결코 §R제거§!되지 않으나, 최종 단계에서는 보너스로 바뀝니다."
