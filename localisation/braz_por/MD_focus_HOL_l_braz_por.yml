 HOL_nato_not_active_key1:0 "Por décadas, os Países Baixos dependeram de nações estrangeiras para equipamento militar e apoio logístico. Essa dependência deixou nossas forças armadas incapazes de funcionar de forma independente, criando uma perigosa vulnerabilidade diante das ameaças modernas."
 HOL_nato_active_key1:0 "Embora os Países Baixos se beneficiem de fortes parcerias internacionais, continuamos muito dependentes de aliados estrangeiros para equipamentos e suprimentos militares. Essa dependência limita nossa independência e representa um risco significativo caso as relações se deteriorem."
 HOL_nato_not_active_key2:0 "A falta de produção militar autossuficiente criou uma situação crítica. A escassez de equipamentos e as deficiências operacionais ameaçam a prontidão de nossas forças armadas, deixando os Países Baixos vulneráveis a um conflito prolongado ou de grande escala."
 HOL_nato_active_key2:0 "Nossas forças armadas dependem criticamente de apoio externo para equipamentos e suprimentos. Em tempos de crise, essa dependência enfraquece nossa capacidade de sustentar operações prolongadas ou defender efetivamente os interesses nacionais."
 HOL_nato_not_active_key3:0 "§RIr à guerra com um exército dependente enfraquecerá severamente as capacidades de nosso exército§!"
 HOL_nato_active_key3:0 "§RDeixar o apoio da OTAN com um exército dependente enfraquecerá severamente as capacidades de nosso exército.§!"
 HOL_personal_union:0 "União Pessoal"
