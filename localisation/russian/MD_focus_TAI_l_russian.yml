l_russian:
 TAI_legacy_of_1949: "Наследие 1949 года"
 TAI_legacy_of_1949_desc: "После окончания Гражданской войны в Китае в 1949 году националисты Гоминьдана (КНП) и их сторонники бежали в островную провинцию Тайвань. Наследие этого события в сочетании с местным нативистским тайваньским движением привело к решительному неприятию воссоединения с материком большинством тайваньских граждан."
 TAI_the_great_chip_empire: "Великая чиповая империя"
 TAI_the_great_chip_empire_desc: "Воспользовавшись преимуществом на ранних этапах производства полупроводников и микрочипов и будучи более привлекательным направлением для инвестиций, чем другие страны, Тайвань вырвался на передовые позиции в этой отрасли. Благодаря дешёвому, эффективному производству и крупным объёмам экспорта в западные страны, Тайвань сбалансировал свою экономику и национальную безопасность, став поставщиком микрочипов для западного мира, и продолжает оставаться лидером отрасли благодаря постоянным и регулярным инновациям."
 TAI_flight_crew_strike: "Забастовка профсоюза бортпроводников Таоюань"
 TAI_flight_crew_strike_desc: "Никаких результатов! Никаких остановок!"
 USA_tsmc_access_modifier: "Доступ к TSMC"
 USA_tsmc_access_modifier_desc: "Американская промышленность получает выгоду от надёжного доступа к тайваньской полупроводниковой экосистеме. Этот бонус приостанавливается, если Тайвань перестаёт существовать, теряет контроль над Тайбэем, вступает в войну с Соединёнными Штатами или ограничивает экспорт полупроводников."
 TAI_tsmc_trade_benefits_tier_1_tt: "Развитие TSMC увеличивает §Yресурсы на фабрику§! до §G+1§! для §YТайваня§! и §YСоединённых Штатов§!. Американский бонус требует сохранения доступа к Тайваню."
 TAI_tsmc_trade_benefits_tier_2_tt: "Развитие TSMC увеличивает §Yресурсы на фабрику§! до §G+2§! для §YТайваня§! и §YСоединённых Штатов§!. Американский бонус требует сохранения доступа к Тайваню."
 TAI_tsmc_trade_benefits_tier_3_tt: "Развитие TSMC увеличивает §Yресурсы на фабрику§! до §G+3§! для §YТайваня§! и §YСоединённых Штатов§!. Американский бонус требует сохранения доступа к Тайваню."
 TAI_foxconn_ev_pipeline: "Линейка электромобилей без объёма производства"
 TAI_foxconn_ev_pipeline_desc: "Эталонные автомобили и партнёрские программы создают инженерные возможности, однако проверенных продуктов и платёжеспособных клиентов всё ещё мало. Капитал приходится вкладывать до появления надёжных объёмов производства."
 TAI_foxconn_factory_behind_brand: "Фабрика за брендом"
 TAI_foxconn_factory_behind_brand_desc: "Hon Hai/Foxconn превращает проекты заказчиков в стабильное серийное производство благодаря оснастке, закупкам, технологической подготовке, испытаниям и логистике. Огромные объёмы выпуска по-прежнему ограничены низкой маржой и сильной зависимостью от крупных клиентов."
 TAI_foxconn_factory_city_production: "Производство в городах-фабриках"
 TAI_foxconn_factory_city_production_desc: "Плотные сети поставщиков, общежития, транспорт и промышленные службы позволяют быстро наращивать производство. Но концентрация работы и повседневной жизни в нескольких огромных кампусах также усиливает трудовые риски и последствия любых сбоев."
 TAI_foxconn_resilient_manufacturing_network: "Устойчивая производственная сеть"
 TAI_foxconn_resilient_manufacturing_network_desc: "Сеть по принципу «построить, запустить, локализовать» связывает проверенные региональные центры, сохраняя ценные мощности на материке. Резервирование повышает доступ к рынкам и устойчивость к кризисам, но требует постоянных дополнительных затрат на координацию."
 taiwan.300.a: "Создать плотнейшую производственную сеть на материке"
 taiwan.300.b: "Развивать собственный бренд вместо производства для других"
 taiwan.300.d: "К 2000 году тайваньская Hon Hai/Foxconn стала крупным производителем электроники с быстро расширяющейся производственной системой на материке. Руководству предстоит решить: продолжать масштабное производство для чужих брендов или вложить тот же капитал в попытку создать собственный."
 taiwan.300.t: "Фабрика за брендом"
 taiwan.301.a: "Повысить стандарты и осторожно автоматизировать производство"
 taiwan.301.b: "Сдерживать расходы и переносить производство вглубь страны"
 taiwan.301.d: "Серия смертей работников на комплексе Foxconn в Лунхуа, Шэньчжэнь, и сообщения о тяжёлых условиях привлекли внимание к продолжительности рабочего дня, оплате, безопасности и жизни внутри системы городов-фабрик. Причины происходящего остаются предметом споров, но необходимость системного ответа сомнений не вызывает."
 taiwan.301.t: "Трудовой кризис в Шэньчжэне"
 taiwan.302.a: "Сосредоточить запуск производства в Чжэнчжоу"
 taiwan.302.b: "Создать несколько производственных узлов во внутренних районах"
 taiwan.302.d: "Чжэнчжоу предлагает Foxconn инфраструктуру, помощь в наборе персонала и достаточно места для огромного производственного комплекса во внутренних районах страны. Проект способен обеспечить колоссальные мощности для запуска новых iPhone, одновременно усиливая зависимость от одного клиента, одного места и одной политической среды."
 taiwan.302.t: "Город iPhone"
 taiwan.303.a: "Возглавить рекапитализацию Sharp"
 taiwan.303.b: "Сохранить стратегическое партнёрство"
 taiwan.303.d: "Sharp нужен партнёр для рекапитализации, а Foxconn стремится получить доступ к технологиям дисплеев, инженерам и более тесным связям с поставщиком компонентов. Контроль над компанией принесёт сложную реструктуризацию японского бизнеса, а не мгновенную передачу технологий."
 taiwan.303.t: "Sharp на грани"
 taiwan.304.a: "Взять на себя обязательства по проекту в Висконсине"
 taiwan.304.b: "Сократить проект до начала строительства"
 taiwan.304.d: "Вашингтон ответил на предложение Foxconn. Теперь компании предстоит решить, оправдывает ли доступная поддержка полный объём обязательств или проект следует сократить ещё до начала строительных работ."
 taiwan.304.t: "Обязательства в Висконсине"
 taiwan.305.a: "Производственная сеть, которую не сломает ни один кризис"
 taiwan.305.b: "Поставщик для эпохи электромобилей"
 taiwan.305.c: "Город-фабрика вокруг запуска одного продукта"
 taiwan.305.e: "Фабрика за чужими брендами"
 taiwan.305.d: "Полные стойки ИИ объединяют платы, ускорители, питание, охлаждение, кабели и требовательную системную проверку, и Nvidia хочет, чтобы Foxconn собирала их. Четверть века масштабирования, кризисов и диверсификации уже определила, какой именно производитель приходит к этой работе."
 taiwan.305.t: "Фабрика ИИ"
 taiwan.310.t: "Двенадцать дюймов сквозь кризис"
 taiwan.310.d: "Обвал полупроводникового рынка опустошил чистые помещения, строительство которых обошлось в миллиарды, а простаивающая фабрика TSMC не приносит ничего. Переход на 300-мм пластины снизит стоимость каждой пластины, но только после нескольких лет работы над оборудованием, интеграцией и постепенным повышением выхода годных изделий. Строить Fab 12 сейчас означает строить её для рынка, который перестал покупать."
 taiwan.310.a: "Финансировать переход на 300 мм несмотря на спад"
 taiwan.310.b: "Беречь средства до восстановления спроса"
 taiwan.311.t: "Чертежи без нарушения доверия"
 taiwan.311.d: "Клиентам TSMC нужны наборы проектирования, библиотеки, инструменты и данные квалификации, чтобы вообще создавать что-либо на нашем техпроцессе, при этом каждый из них конкурирует с остальными. Платформа Open Innovation Platform предоставит всем одинаковые материалы, не раскрывая никому разработки конкурента. Здесь производят не только чипы — здесь производят доверие."
 taiwan.311.a: "Опубликовать наборы и открыть платформу"
 taiwan.311.b: "Сохранить отдельную работу с каждым клиентом"
 taiwan.312.t: "Мобильный якорный заказчик"
 taiwan.312.d: "Apple требуется больше передовых мощностей для A8, чем большинству остальных клиентов TSMC вместе взятым, и компания готова оплачивать их резервирование на годы вперёд. Одного такого объёма хватит для финансирования следующего технологического узла. Но тогда благополучие фабрики будет зависеть от продуктового цикла одной компании."
 taiwan.312.a: "Зарезервировать передовые мощности для ключевого клиента"
 taiwan.312.b: "Сохранить нейтралитет контрактного производства"
 taiwan.313.t: "Аризона: страховка имеет цену"
 taiwan.313.d: "Вашингтон хочет производить передовые пластины на американской земле, готов помочь оплатить их выпуск и обращается именно к TSMC. Однако объявить о фабрике — не значит построить её: оборудование, инженеры, вода и клиенты должны появиться прежде, чем будет выпущена хотя бы одна квалифицированная пластина, а в Аризоне всё это стоит дороже, чем в Синьчжу. Страховка реальна, и её цена тоже."
 taiwan.313.a: "Вложиться в зарубежные фабрики"
 taiwan.313.b: "Сохранить передовые мощности на острове"
 taiwan.314.t: "Чипы — узкое место"
 taiwan.314.d: "Автопроизводители, потребительские бренды и компьютерные компании борются за объёмы TSMC, которых просто не существует, а их правительства уже сами начали звонить. Передача распределения мощностей государству принесёт значительную политическую благосклонность в важных столицах. Но это также покажет каждому клиенту, что его место теперь определяется очередью, которой он не видит."
 taiwan.314.a: "Передать распределение мощностей государству"
 taiwan.314.b: "Сохранить коммерческое распределение"
 taiwan.315.t: "Ограничение CoWoS"
 taiwan.315.d: "Сама пластина больше не является самым сложным этапом. Ускорителям нужны передовая упаковка, многослойная память и подложки, иначе они бесполезны, а мощностей TSMC по CoWoS катастрофически не хватает. Расширение этих мощностей превращает контрактного производителя пластин в нечто большее и вводит нас в отрасли, где сейчас работают наши собственные клиенты."
 taiwan.315.a: "Превратить передовую упаковку в отдельное направление бизнеса"
 taiwan.315.b: "Остаться чистым контрактным производителем пластин"
 taiwan.316.t: "Какое контрактное производство мы построили?"
 taiwan.316.d: "Двадцать пять лет смены техпроцессов, спадов, ключевых клиентов и строительства зарубежных фабрик окончательно определили, чем стала TSMC, что именно производит остров и кто решает, куда направляется продукция."
 taiwan.316.a: "Контрактное производство под управлением государства"
 taiwan.316.b: "Надёжная сеть союзных фабрик"
 taiwan.316.c: "Системное контрактное производство, а не просто фабрика пластин"
 taiwan.316.e: "Только чистое контрактное производство"
 TAI_tsmc_state_directed_foundry: "Контрактное производство под управлением государства"
 TAI_tsmc_state_directed_foundry_desc: "Распределение заказов проходит через министерство раньше, чем через отдел продаж, а очередь становится вопросом государственной политики. Мощности в первую очередь служат интересам острова и лишь затем клиентам — и клиенты это заметили."
 TAI_tsmc_trusted_allied_foundry_network: "Надёжная сеть союзных фабрик"
 TAI_tsmc_trusted_allied_foundry_network_desc: "Аризона, Кумамото и Дрезден прошли квалификацию и начали работу, поэтому передовое производство больше не сосредоточено в одной точке одного острова. Каждая пластина обходится дороже, чем при концентрации всего производства дома, зато сеть даёт то, чего такая концентрация никогда не могла обеспечить."
 TAI_tsmc_systems_foundry_platform: "Платформа системного контрактного производства"
 TAI_tsmc_systems_foundry_platform_desc: "Пластины, упаковка, многослойная память и испытания теперь выходят как единый квалифицированный продукт. Фабрика продаёт готовую технологическую возможность, а не отдельный нижний слой производства — именно туда к этому моменту и сместилось главное ограничение."
 TAI_tsmc_disciplined_pure_play_foundry: "Дисциплинированный чистый контрактный производитель"
 TAI_tsmc_disciplined_pure_play_foundry_desc: "Никаких собственных брендов и продуктов, никакой конкуренции с теми, кто покупает у нас производство. Дисциплина, благодаря которой эта модель заработала, и есть сама модель — и она сохранена без изменений."
 taiwan.320.t: "Acer отделяет бренд от производства"
 taiwan.320.d: "Acer производит компьютеры для других компаний и одновременно продаёт собственные на тех же полках — конфликт интересов, который клиенты видят прямо в счёте. Выделение производства в Wistron позволит обеим частям бороться за заказы, которых они сейчас лишают друг друга. Но это также разделит компанию надвое именно тогда, когда она наконец стала крупной."
 taiwan.320.a: "Отделить бренд от производства"
 taiwan.320.b: "Сохранить единого интегрированного производителя"
 taiwan.321.t: "Вопрос x86 урегулирован"
 taiwan.321.d: "Многолетние судебные споры VIA Technologies и Intel вокруг наборов инструкций и чипсетов завершаются десятилетним перекрёстным лицензионным соглашением вместо победы в суде. Условия гарантируют VIA право продолжать производство, но на правилах, написанных действующим лидером рынка. Третий поставщик x86 остаётся юридически возможным и коммерчески маловероятным."
 taiwan.321.a: "Заключить соглашение и закрепить лицензию"
 taiwan.321.b: "Добиваться более выгодных условий"
 taiwan.322.t: "Республика геймеров"
 taiwan.322.d: "Покупатели комплектующих, самостоятельно выбирающие материнские платы, готовы доплачивать за детали, которые подчёркивают собственную идентичность. Запуск ASUS отдельной линейки Republic of Gamers даст маржу, недоступную товарному производству, но потребует маркетинга, поддержки и дизайна, которыми поставщику компонентов раньше заниматься не приходилось."
 taiwan.322.a: "Создать премиальный бренд"
 taiwan.322.b: "Остаться поставщиком компонентов"
 taiwan.323.t: "Второе разделение"
 taiwan.323.d: "Тот же конфликт, который разделил Acer, теперь раскалывает её конкурента: бренд не может расти, пока фабрика обслуживает его соперников. Выделение производственного подразделения создаст одного из крупнейших контрактных производителей в мире. Но вместе с ним компания отдаст и фабрику, благодаря которой бренд вообще стал возможен."
 taiwan.323.a: "Выделить производственное подразделение"
 taiwan.323.b: "Сохранить бренд и производство вместе"
 taiwan.324.t: "Компактный ПК для каждого"
 taiwan.324.d: "Нетбук, начатый ASUS с Eee PC, стал самой быстрорастущей категорией компьютерного рынка, и любой тайваньский производитель может за считанные дни выпустить дешёвый, лёгкий и маломощный ноутбук. Маржа ужасна, объёмы огромны. Пока неясно, будущее ли это отрасли или мода, приучающая покупателей ничего не ожидать от техники."
 taiwan.324.a: "Следовать за переходом к мобильности"
 taiwan.324.b: "Защитить маржу настольных ПК"
 taiwan.325.t: "Сжатие маржи"
 taiwan.325.d: "Телефоны забрали объёмы, бренды — место на полках, а Acer, ASUS и другие островные производители конкурируют друг с другом за остатки сокращающегося рынка. Координация отрасли сверху могла бы прекратить ценовую войну между ними. Но тогда министерству пришлось бы решать, кто из компаний заслуживает выжить."
 taiwan.325.a: "Координировать отрасль сверху"
 taiwan.325.b: "Позволить рынку провести консолидацию"
 taiwan.326.t: "Оценка компьютерной экосистемы Тайваня"
 taiwan.326.d: "Четверть века разделений, выделений компаний, премиальных брендов и ценовых войн окончательно определила, чем стали Acer, ASUS, Quanta и остальная компьютерная промышленность острова: чьё имя указано на коробке и чья фабрика стоит за ним."
 taiwan.326.a: "Полноспектральная компьютерная экосистема"
 taiwan.326.b: "Центр брендовых компьютерных систем"
 taiwan.326.c: "Глобальное содружество компонентов"
 taiwan.326.e: "Сжатие маржи, которого не избежал никто"
 TAI_pc_full_spectrum_computing_ecosystem: "Полноспектральная компьютерная экосистема"
 TAI_pc_full_spectrum_computing_ecosystem_desc: "Компоненты, контрактное производство и готовые бренды были сохранены в одной координируемой отрасли вместо того, чтобы позволить им уничтожать друг друга конкуренцией. Остров производит каждый уровень компьютера и осознанно распределяет роли между ними."
 TAI_pc_branded_systems_powerhouse: "Центр брендовых компьютерных систем"
 TAI_pc_branded_systems_powerhouse_desc: "Имена на коробках — тайваньские, и за них готовы платить больше, чего поставщик компонентов добиться не может. Бренды удерживаются вниманием покупателей, а внимание приходится постоянно оплачивать."
 TAI_pc_global_component_commonwealth: "Глобальное содружество компонентов"
 TAI_pc_global_component_commonwealth_desc: "Почти каждый продаваемый в мире компьютер содержит детали, произведённые здесь под чужим именем. Объёмы огромны, а маржа достаётся тому, кто ставит свой логотип."
 TAI_pc_fragmented_margin_squeeze: "Раздробленность и сжатие маржи"
 TAI_pc_fragmented_margin_squeeze_desc: "Слишком много способных компаний боролись за один и тот же сокращающийся рынок и всё время сбивали цены друг другу. Инженерное качество оставалось высоким; цены не переставали падать."