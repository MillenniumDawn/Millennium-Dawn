 BOS_croat_secession_crisis: "Хорватский кризис отделения"
 BOS_croat_secession_crisis_desc: "Учреждения Герцег-Босны разрабатывают законопроекты о выходе из государственных институтов и проводят учения собственных подразделений. Если хорватские претензии не будут урегулированы до окончания противостояния, юг отделится и начнёт вооружённую борьбу."
 BOS_dayton_two: "Пересмотренное Дейтонское соглашение"
 BOS_dayton_two_desc: "В результате пересмотра конституционного соглашения более широкая автономия отдельных образований была обменяна на прекращение боевых действий. Это обеспечивает стабильность ценой ослабления позиций центрального правительства."
 BOS_srpska_secession_crisis_opens_tt: "Республика Сербская развязывает кризис сецессии. Если он не будет урегулирован до истечения установленного срока, образование вступит в войну."
 BOS_croat_secession_crisis_opens_tt: "Герцег-Босна открывает кризис сецессии. Повысьте доверие хорватов до уровня «Дружественное», прежде чем закроется окно возможностей, чтобы удержать юг страны в составе государства."
 bos_srpska_reconciliation_full_tt: "Уровень доверия сербов к правительству возвращается к враждебному, поскольку образование полностью переводится под центральное управление."
 bos_srpska_negotiated_autonomy_tt: "В соответствии с согласованными условиями автономии, доверие сербов к правительству должно стать дружественным."
 BOS_croat_deescalation_hint_tt: "Повысьте доверие хорватов до уровня «Дружественное» с помощью решений фракций, чтобы разрядить кризис до его окончания."
 BOS_rotate_presidency_hint_tt: "Используйте решение о ротации лидеров, чтобы передать президентство и восстановить терпение ожидающей общины."
 BOS_croat_neutrality_pact_honored_tt: "Пакт о нейтралитете хорватов остается в силе. Герцег-Босна не вступает в войну и не отделяется."
 BOS_political.82.t: "Республика Сербская готовится к отделению"
 BOS_political.82.d: "Скупщина образования назначила дату выхода из государственных институтов. Ещё есть короткий промежуток времени, чтобы остановить это до официального провозглашения независимости."
 BOS_political.82.a: "Найдите способ разрядить обстановку."
 BOS_political.83.t: "Герцеговина грозит отделиться."
 BOS_political.83.d: "Хорватские лидеры на юге страны склоняются к отделению, ссылаясь на многолетнее игнорирование их мнений. Единственный способ удержать их в стране — наладить отношения сейчас."
 BOS_political.83.a: "Обратитесь к хорватской общине."
 BOS_political.84.t: "Ротация президентских постов застопорилась"
 BOS_political.84.d: "Пост должен был перейти к другому, но передача постоянно откладывается. Община, ожидающая своей очереди, начинает воспринимать задержку как преднамеренную."
 BOS_political.84.a: "Обратите внимание на их разочарование."
 BOS_offer_amnesty: "Предложение об амнистии"
 BOS_offer_amnesty_desc: "Предоставить амнистию бойцам, сложившим оружие. Это стабилизирует положение сербского сообщества, но будет воспринято как слабость на внутреннем фронте."
 BOS_forced_requisition: "Принудительная реквизиция"
 BOS_forced_requisition_desc: "Захват припасов и материальных средств у этих образований для финансирования военных действий. Это пополняет казну и усиливает недовольство сербов."
 BOS_sign_croat_neutrality_pact: "Подпишите хорватский пакт о нейтралитете"
 BOS_sign_croat_neutrality_pact_desc: "Гарантировать хорватам автономию в обмен на их нейтралитет. В случае захвата власти исламистами Герцеговина останется в составе страны, а не отделится."
 BOS_canton_pressure_campaign: "Кампания давления на кантоны"
 BOS_canton_pressure_campaign_desc: "Необходимо оказать давление на боснийский и хорватский кантоны, чтобы они присоединились к центральной программе. Это стабилизирует ситуацию в государстве за счет доброй воли обеих общин."
 BOS_serbian_alignment_overtures: "Предложения по сербскому сближению"
 BOS_serbian_alignment_overtures_desc: "Укрепление политических и экономических связей с Белградом. Влияние сербов в Боснии растет, сербская община благосклонно относится к правительству, и терпение боснийцев иссякает."
 BOS_srpska_supremacy_measures: "Меры по установлению сербского превосходства"
 BOS_srpska_supremacy_measures_desc: "Продвигать сербские националистические приоритеты и приоритеты в сфере безопасности в государственной политике и государственных учреждениях."
 BOS_bosniak_governing_partner: "Боснийский партнёр по правящей коалиции"
 BOS_bosniak_governing_partner_desc: "Верный боснийский партнер обеспечивает стабильность коалиционной политики и снижает уровень беспорядков."
 BOS_croat_governing_partner: "Хорватский партнёр по коалиции"
 BOS_croat_governing_partner_desc: "Верный хорватский партнёр поддерживает экономические реформы, но снижает гибкость внутренней коалиции."
 BOS_srpska_governing_partner: "Сербский партнёр по коалиции"
 BOS_srpska_governing_partner_desc: "Верный сербский партнер улучшает сотрудничество в сфере безопасности, но ослабляет федеральный надзор."
 BOS_reconstruction_dividends: "Дивиденды от реконструкции"
 BOS_reconstruction_dividends_desc: "Послевоенная коалиция, сотрудничающая с программами восстановления, может принести краткосрочную экономическую выгоду."
 BOS_governing_partner_dividends_tt: "§GЕсли наш партнёр по правящей коалиции будет лоялен:§! Реконструкция приносит свои плоды в течение 180 дней."
 BOS_internal_faction_balance_stability_tt: "§YДоверие общин:§! каждая община с доверием ниже §R25§! даёт §R-15%§! к национальной стабильности, каждая выше §G50§! даёт §G+5%§!, каждая выше §G74§! даёт §G+10%§!."
 BOS_internal_faction_balance_manpower_tt: "§YЛюдские ресурсы общин:§! каждая община с людскими ресурсами ниже §R25§! даёт §R-15%§! к призывному населению, каждая выше §G50§! даёт §G+15%§!, каждая выше §G74§! даёт §G+20%§!."
 BOS_revanchism_peacekeepers_warning_tt: "§YПримечание:§! Миротворцы EUFOR должны покинуть страну до того, как сможет начаться «Национальное пробуждение»."
 BOS_national_awakening_consequences_tt: "§RЭто обязывает нас к войне с Республикой Сербской. Если мы тогда объявим об исламском захвате власти, правительство станет исламистским, и Герцеговина отделится вместе с частью армии.§!"
 BOS_islamic_takeover_consequences_tt: "§RПравительство становится исламистским, и Герцеговина отделяется, забрав с собой часть армии.§!"
 BOS_eufor_withdrawal_threat: "Босния требует вывода EUFOR"
 BOS_csto_accept_tt: "Босния присоединяется к ОДКБ на нашей стороне."
 BOS_csto_reject_tt: "Мы отклоняем заявку Боснии в ОДКБ."
 BOS_euro_defence_accept_tt: "Мы предоставляем Боснии гарантии обороны, и миссия EUFOR завершается."
 BOS_euro_defence_decline_tt: "Мы отказываемся гарантировать безопасность Боснии."
 BOS_events.56.t: "Боснийский блок добивается установления центральной власти."
 BOS_events.56.d: "Боснийские партии в государственном парламенте стремятся укрепить центральные институты за счёт образований и рассчитывают на поддержку правительства."
 BOS_events.56.a: "Поддержите стремление к централизации"
 BOS_events.56.b: "Не уступать в вопросе образований"
 BOS_events.56.c: "Вместо этого финансируйте развитие в рамках Федерации."
 BOS_events.57.t: "Хорватский блок требует гарантий на уровне образований"
 BOS_events.57.d: "Хорватские лидеры в Герцеговине требуют более надежных гарантий представительства хорватов, предупреждая, что без них они будут препятствовать работе государственных институтов."
 BOS_events.57.a: "Пойти навстречу хорватскому блоку"
 BOS_events.57.b: "Откажитесь от новых гарантий"
 BOS_events.57.c: "Вместо этого инвестируйте в Герцеговину."
 BOS_events.58.t: "Республика Сербская требует вернуть полномочия"
 BOS_events.58.d: "Баня-Лука вновь требует вернуть полномочия, переданные государству, этому образованию, представляя это как вопрос Дейтонского соглашения."
 BOS_events.58.a: "Договориться о частичной передаче"
 BOS_events.58.b: "Полностью отклоните это требование."
 BOS_events.58.c: "Передать образованию полномочия по сбору доходов"
 BOS_events.61.t: "Китайское предложение для Республики Сербской"
 BOS_events.61.d: "Правительство Сербской хочет одобрить финансируемый Китаем инфраструктурный проект в этом образовании. Пекин укрепляет свои позиции, и боснийские партии Сараево опасаются условий, связанных с этим проектом."
 BOS_events.61.a: "Утвердить проект"
 BOS_events.61.b: "Заблокировать финансирование"
 BOS_events.62.t: "Стремление к фискальной автономии"
 BOS_events.62.d: "В условиях, когда во главе правительства стоит хорват, лидеры Герцеговины настаивают на очередной передаче полномочий по сбору налогов, что по сути означает третье образование, пусть и без официального названия."
 BOS_events.62.a: "Передать полномочия на местный уровень."
 BOS_events.62.b: "Сохраните централизованный финансовый контроль."
 BOS_events.63.t: "Расширение центрального бюджета"
 BOS_events.63.d: "Правительство, возглавляемое боснийцами, хочет расширить центральный бюджет и профинансировать государственные учреждения, которые образования долгое время держали на голодном пайке. Баня-Лука будет недовольна каждой конвертируемой маркой."
 BOS_events.63.a: "Увеличить бюджет"
 BOS_events.63.b: "Оставьте бюджет как есть."
 BOS_events.64.t: "Автобусы продолжают отъезжать"
 BOS_events.64.d: "Эмиграцию стало невозможно игнорировать. Целые смены остаются незаполненными, и молодые семьи продают свою недвижимость. Программы трудоустройства, гранты на удержание молодежи, торговая связь в рамках проекта Corridor Vc и денежные переводы от диаспоры — вот рычаги, которые могут замедлить отток населения."
 BOS_events.64.a: "Мы должны держать наших людей дома."
 BOS_events.65.t: "Страна пустеет"
 BOS_events.65.d: "Массовый отток населения достиг критической точки. Клиники закрываются из-за нехватки медсестер, деревни полупустеют. Только последовательная работа над программами трудоустройства, грантами на удержание молодежи, проектом Corridor Vc и денежными переводами позволит снизить давление."
 BOS_events.65.a: "Обратить вспять спад"
 BOS_entity_competency_transfer: "Полномочия, переданные образованию"
 BOS_entity_competency_transfer_desc: "Полномочия по сбору доходов были переданы этому образованию, что обеспечило политическое спокойствие за счет более медленной и конфликтной работы центрального правительства."
 BOS_corruption_hits_weakest_tt: "§RПо мере развития скандала, сообщество, наименее доверяющее правительству, теряет еще больше своих позиций.§!"
 BOS_eu_accession_push: "Усилия по вступлению в Европу"
 BOS_eu_accession_push_desc: "Получив официальный статус кандидата и заручившись поддержкой всех сообществ, необходимо продвигать вперед программу присоединения. Международные кредиторы высоко оценивают этот импульс, и доверие к правительству реформ растет."
 BOS_electoral_reform_package: "Пакет мер по реформированию избирательной системы"
 BOS_electoral_reform_package_desc: "Как только все общины начнут доверять государству, дискриминационную структуру президентства наконец-то можно будет заменить. Отмена системы этнических квот устранит угрозу сецессии, которая омрачала старую систему ротации должностей, сохранив при этом ее стабилизирующие преимущества."
 BOS_open_balkan_initiative: "Инициатива «Открытые Балканы»"
 BOS_open_balkan_initiative_desc: "Присоединяйтесь к региональному рынку под руководством Сербии, обеспечивающему свободное перемещение товаров, рабочей силы и капитала. Белград усиливает свое влияние в Сараево, но сербские представители приветствуют более тесные связи и процветание малого бизнеса."
 BOS_berlin_process_commitment: "Обязательства по Берлинскому процессу"
 BOS_berlin_process_commitment_desc: "Необходимо сосредоточить региональное сотрудничество в рамках Берлинского процесса, спонсируемого Германией, а не в орбите Белграда. Проевропейский подход успокаивает хорватских и боснийских партнеров и открывает двери для западного финансирования."
 BOS_confront_entity_obstruction: "Противостояние обструкции со стороны образования"
 BOS_confront_entity_obstruction_desc: "Республика Сербская годами блокировала государственные институты и угрожала выходом из них. Решите, противостоять ли этому препятствию напрямую или завоевать спокойствие путем уступок."
 BOS_energy_transition_strategy: "Стратегия энергетического перехода"
 BOS_energy_transition_strategy_desc: "Преодолеть противостояние угля и гидроэнергетики за счёт мощностей возобновляемой энергетики, распределённых между обоими образованиями. Совместные проекты вселяют уверенность в хорватские и сербские общины и дают молодым работникам повод остаться."
 BOS_digital_diaspora_economy: "Цифровая диаспорная экономика"
 BOS_digital_diaspora_economy_desc: "Наладьте связь между технологическим сектором и многочисленной общиной эмигрантов за рубежом. Удаленная работа и возвращение талантливых специалистов снижают эмиграцию и привлекают владельцев малых и средних предприятий."
 BOS_census_2023: "Перепись населения 2023 года"
 BOS_census_2023_desc: "Проведите давно отложенную перепись населения. Её результаты разрешат споры о численности каждой общины, но тот народ, на котором правительство сделает акцент, почувствует себя признанным за счёт соперника."
 BOS_eu_candidacy_momentum: "Динамика выдвижения кандидатуры в ЕС"
 BOS_eu_candidacy_momentum_desc: "Официальное присвоение статуса кандидата придало энергии лагерю реформаторов и укрепило доверие общественности к правительству."
 BOS_reformed_presidency: "Реформированное президентство"
 BOS_reformed_presidency_desc: "Система ротации этнических президентов была заменена системой, открытой для всех граждан. Управление стало более спокойным и легитимным, а постоянная угроза отделения отдельных регионов исчезла."
 BOS_open_balkan_market: "Открытый Балканский рынок"
 BOS_open_balkan_market_desc: "Участие в региональном рынке расширило экспортные возможности для боснийских фирм при незначительном снижении внутреннего потребления."
 BOS_digital_economy_idea: "Цифровая экономика"
 BOS_digital_economy_idea_desc: "Инвестиции в средства связи и программное обеспечение повысили результативность исследований и помогли заводам внедрить современные методы работы."
 BOS_events.66.t: "Обструкция образования"
 BOS_events.66.d: "Руководство Республики Сербской вновь заблокировало государственное законодательство и предложило выйти из федеральных институтов. Правительство должно отреагировать, прежде чем паралич распространится."
 BOS_events.66.a: "Занять жесткую позицию"
 BOS_events.66.b: "Предложить уступки"
 BOS_events.67.t: "Перепись населения 2023 года"
 BOS_events.67.d: "Данные переписи населения готовы к публикации. Лидеры каждой общины добиваются того, чтобы в официальных результатах были выделены именно их данные."
 BOS_events.67.a: "Подчеркните количество боснийцев."
 BOS_events.67.b: "Подчеркните хорватский подсчет"
 BOS_events.67.c: "Подчеркните количество сербов."
 BOS_confront_entity_obstruction_choice_tt: "§YОткрывает выбор: напрямую противостоять Республике Сербской или искать компромисс.§!"
 BOS_hardline_rs_crisis_warning_tt: "§RЕсли доверие сербов упадёт ниже 25, пока Милорад Додик возглавляет Республику Сербскую, противостояние может перерасти в кризис сецессии.§!"
 BOS_reformed_presidency_tt: "§GЗаменяет активную ротационную систему президентства реформированной системой президентства, устраняя риск сецессии, но сохраняя при этом преимущества стабильности.§!"
 BOS_emigration_eased_energy_tt: "§GЭмиграционное давление снижено на 5.§!"
 BOS_emigration_eased_digital_tt: "§GЭмиграционное давление снижено на 10.§!"
 BOS_digital_diaspora_synergy_tt: "§GДенежные переводы от диаспоры финансируют строительство нового гражданского завода без каких-либо затрат для казначейства.§!"
 RSK_requisition_the_mines: "Реквизировать шахты"
 RSK_requisition_the_mines_desc: "Заберите продукцию шахт образования в военный фонд. Рабочие нас за это не отблагодарят."
 RSK_appeal_to_belgrade: "Обращение к Белграду"
 RSK_appeal_to_belgrade_desc: "Попросите Сербию открыто поддержать образование, что поднимет моральный дух и улучшит отношения с Белградом."
 HZG_war_levy: "Военный сбор Герцеговины"
 HZG_war_levy_desc: "Ввести чрезвычайный налог на кантоны для финансирования войны. Это негативно скажется на стабильности."
 HZG_appeal_to_zagreb: "Обращение к Загребу"
 HZG_appeal_to_zagreb_desc: "Попросите Хорватию поддержать Герцег-Боснию — это поднимет моральный дух и улучшит отношения с Загребом."
 BOS_events.68.t: "Образование взывает о помощи"
 BOS_events.68.d: "Республика Сербская обращается к Сербии с просьбой о помощи в виде оружия и добровольцев. Белграду необходимо взвесить открытую поддержку и риск более масштабной войны."
 BOS_events.68.a: "Отправьте оружие и добровольцев."
 BOS_events.68.b: "Мы не можем позволить себе показаться вмешивающимися."
 BOS_events.69.t: "Белград отвечает"
 BOS_events.69.d: "Сербские ящики прибывают на фронт. Солдаты образования воспряли духом."
 BOS_events.69.a: "За сербский народ"
 BOS_events.70.t: "Кантоны зовут"
 BOS_events.70.d: "Герцег-Босния обращается к Хорватии с просьбой о помощи в виде оружия и добровольцев для удержания линии фронта."
 BOS_events.70.a: "Вооружите кантоны"
 BOS_events.70.b: "Загреб не должен в это вмешиваться."
 BOS_events.71.t: "Загреб отвечает"
 BOS_events.71.d: "Хорватское оружие доставлено в Герцег-Боснию. Защитники кантонов воодушевлены."
 BOS_events.71.a: "За хорватский народ"
 RSK_serbian_support_accept_tt: "§GОтправить 2000 единиц пехотного оружия в Республику Сербскую и открыть поддержку добровольцами.§!"
 RSK_serbian_support_decline_tt: "§RВоенная поддержка Республики Сербской падает.§!"
 HZG_croat_support_accept_tt: "§GОтправить 1500 единиц пехотного оружия в Герцег-Боснию и организовать поддержку добровольцами.§!"
 HZG_croat_support_decline_tt: "§RПоддержка войны в Герцег-Боснии падает.§!"
 BOS_thermal_chinese_financing_tt: "§YПекину сообщат о подписании кредитного соглашения и взамен он получит возможность оказывать влияние в Боснии.§!"
 BOS_events.72.t: "Сараево подписало соглашение с Тузлой"
 BOS_events.72.d: "Босния подписала кредитную линию на расширение лигнитной электростанции в Тузле: 0,10 млрд из нашего бюджета и наши подрядчики на месте. Сама станция — меньший из призов. На самом деле этот кредит покупает нам место за столом в Сараево и партнёра на Балканах, который нам должен."
 BOS_events.72.a: "Великолепно."
 BOS_court_turkish_investment_tt: "§YАнкаре сообщат, что рынок открыт, и в ответ она получит своё влияние в Боснии.§!"
 BOS_court_gulf_investment_tt: "§YЭр-Рияду сообщат, что его средства приветствуются, и взамен он получит влияние в Боснии.§!"
 BOS_events.73.t: "Сараево открывает двери"
 BOS_events.73.d: "Босния расчистила путь для наших строительных компаний и банков. Участки автомагистралей, жилье, сеть филиалов в Сараево. Работа для наших подрядчиков и плацдарм в стране, которая по-прежнему воспринимает нас как родственников. Теперь слово Анкары будет иметь вес в Федерации."
 BOS_events.73.a: "Отлично."
 BOS_events.74.t: "Проект Buroj Ozone нашёл инвесторов"
 BOS_events.74.d: "Сараево привлекло капитал стран Персидского залива в недвижимость, туризм и финансы. Курортный город в Трново — витрина этих вложений, но деньги идут дальше: в квартиры, отели и банки, которые держат их ценные бумаги. Какими бы ни были результаты этих проектов, мусульманское руководство Боснии будет помнить, чьи средства пришли в страну."
 BOS_events.74.a: "Великолепно."
 BOS_defeat_all_serbs: "Гражданская война с Республикой Сербской продолжается"
 BOS_croat_neutrality_pact: "Подписан пакт о нейтралитете хорватов"
 BOS_rs_crisis_resolved: "Урегулирование кризиса, связанного с отделением Республики Сербской"
 BOS_third_entity_resolved: "Вопрос третьего образования решён"
