 emil_constantinescu_desc: "Emil Constantinescu was a senior member of the successor party to the National Peasants Party (PNT), which existed in the Kingdom of Romania but was dissolved after it was banned by the communist regime. In 1992, the Romanian Democratic Convention (CDR), of which the PNTCD was a member, nominated him as its candidate for President of Romania. He lost the election to then-incumbent Ion Iliescu after the second round. In 1996, he competed once again for the presidency as the CDR's candidate and managed to defeat Iliescu in the second round, securing victory by a margin of roughly 10%. CDR's success in the 1996 general elections marked the first peaceful transition of power in post-1989 Romania. On the day he took office, he suspended his membership in the PNTCD, as the Constitution precludes a president holding formal membership in a political party during his tenure. Constantinescu's presidency was marked by ineffective implementation of the processes of privatization, which, bogged down by excessive bureaucracy, increased unemployment and poverty in the short term, coupled with another two mineriads that took place in 1999 and ended with the arrest of the leader behind the mineriads, Miron Cozma. Divides in the governing CDR coalition as a result of ideological differences and political instability have also caused the coalition to further fracture. As a new millennium came and with elections approaching, his popularity has fallen drastically and managed to give rise to the popularity of the ultranationalist Corneliu Vadim Tudor who is calling for radical measures to solve the problems that Romania has, and former president Ion Iliescu is looking to take the presidency once more. With all these issues, Constantinescu is unlikely to run for re-election"
 ion_ilescu_desc: "イオン・イリエスクは1953年にルーマニア共産党（PCR）に入党し、1965年に中央委員会メンバーとなった。しかし、1971年以降、彼はニコラエ・チャウシェスクによって徐々に疎外された。イリエスクはルーマニア革命で主導的な役割を果たし、1989年12月に国の初代大統領となった。1990年に行われた共産主義政権樹立以来初の自由選挙で、彼はルーマニア初の自由選挙で選ばれた国家元首となった。当時の与党である救国戦線（FSN）は、イリエスクの支持者（民主救国戦線（FDSN）を創設）と、ペトレ・ロマン首相の支持者（民主党（PD）を創設）の間で分裂した。イリエスクはその後、1992年の選挙でエミル・コンスタンティネスクに対して勝利したが、1996年の選挙では彼に対して敗れた。イリエスクはその後、新たに設立された社会主義政党PDSRの下で、超国家主義者コルネリウ・ヴァディム・トゥドールに対して勝利を収めた。"
 theodor_stolojan_desc: "ニコラエ・チャウシェスクの支配下で、テオドール・ストロヤンは1972年から1977年まで財務省で国家予算局の経済学者として働き、その後1978年から1982年まで国家予算の会計長として、そしてルーマニア革命まで外国為替および国際金融関係局の副局長として働いた。彼は共産主義崩壊後の最初の財務大臣であり、中央計画経済の終焉後の自由市場改革の設計者として重要な役割を果たし、金融システムの刷新と民営化の開始に深く関与した。ミネリアーダの出来事によるペトレ・ロマン首相の辞任後、ストロヤンは当時の大統領イオン・イリエスクによって首相に任命された。しかし、1992年の経済状況の悪化により、ストロヤン政府は緊縮財政計画を開始し、賃金を制限し、価格をさらに自由化した。経済状況は悪化し、インフレと失業率は大幅に増加した。その後、彼は首相を辞任した。2000年、彼は国民自由党（PNL）のメンバーとして政界に復帰し、2000年の大統領選挙でルーマニア大統領選に出馬し、対立候補に大きな打撃を与え、彼の当選で皆を驚かせた。今、ストロヤンは新たな経済改革、西側との連携強化、そしてルーマニアを近代化するための汚職との戦いに目を向けている。"
 mugur_isarescu_desc: "ムグル・イサレスクは国際経済研究所の研究員であった。彼はアメリカで多くのコースを受講し、資本主義経済に関するいくつかの論文を書いた。1990年2月、ルーマニア革命の後、イサレスクはルーマニア外務省で働き始め、1990年3月、彼はアメリカのルーマニア大使館で経済・金融問題担当秘書として働くために派遣され、ルーマニアの国際通貨基金および世界銀行との関係処理を担当した。1990年7月、イサレスクはルーマニア国立銀行（BNR）を率いるためにアメリカでのポストから呼び戻された。イサレスクのBNRでのリーダーシップは、彼の効果的な知識と銀行のリーダーシップにより、ルーマニア経済を完全な崩壊から救ったと多くの人々に考えられている。1999年、ラドゥ・ヴァシレ首相の辞任後、イサレスクはルーマニア首相になるよう依頼され、任期終了後に国立銀行に戻れることを条件に受け入れた。当時の大統領エミル・コンスタンティネスクはその条件に同意し、1999年12月16日、イサレスクはルーマニア首相に就任した。イサレスクは1年間しか務めなかったにもかかわらず、ルーマニア経済を改善する経済改革を開始した。その後、エミル・コンスタンティネスク大統領が2期目の出馬をしないと決定した後、イサレスクは残りのCDR与党連合によって2000年選挙の大統領候補として指名された。イサレスクは全ての対立候補を破り、ルーマニアの新大統領となり、皆を驚かせた。そして今、イサレスクは親西側の外交政策とルーマニア経済の近代化に目を向けている。"
 corneliu_vadim_tudor_desc: "共産主義時代、コルネリウ・ヴァディム・トゥドールはジャーナリスト、編集者、詩人として働いた。1970年代初頭、彼は「ルーマニア・リベラ」の編集者の一人であり、1975年以降はルーマニア公式通信社の編集者であった。1991年、コルネリウ・ヴァディム・トゥドールはエウジェン・バルブと共に、超国家主義的な大ルーマニア党（PRM）を設立し、政治的現状に対する大衆の幻滅により大規模な支持を得た。1999年、元「ルーマニア・マーレ」の記者であるダン・コルネリウ・フディチは、トゥドールの党が権力を握った場合に逮捕される数十人の政治家（当時のエミル・コンスタンティネスク大統領を含む）、ジャーナリスト、ビジネスマンの「秘密のブラックリスト」が存在すると主張した。この主張は、エミル・コンスタンティネスク大統領の不人気により、彼の人気を高めるのに役立っただけだった。2000年の選挙で、ヴァディムは、彼の上昇する人気と彼の対立候補の不人気と相まって、元大統領で共産党幹部のイオン・イリエスクに対する大勝利で皆を驚かせた。今、コルネリウ・ヴァディム・トゥドールは古い政治的現状を排除し、第二次世界大戦後にルーマニアが失った土地を含む強力なルーマニア国家に置き換えることを目指している。"
 mihai_i_desc: "Following the victory of the PNTCD in the general elections and the monarchist faction in the referendum, the Kingdom of Romania was restored, and Michael once again returned to the throne. Having been King before between 1927–1930 and 1940–1947, Michael holds a vast amount of experience and knowledge, and his non-partisan stance makes him more than capable of reaching compromises in the Parliament. At the same time, Michael is beloved by Romanian society and seen as a symbol of both stability and democracy, as he promises to guide the country towards the brighter future that it deserves."
 ROM_petrol_mafia: "石油マフィア"
 ROM_petrol_mafia_desc: "チャウシェスク政権が崩壊し、民営化が頓挫して以来、ルーマニアの黒い黄金は、権力と金と悪意を持った人々の手に落ちている。"
 ROM_ineffective_industry: "非効率な産業"
 ROM_ineffective_industry_desc: "The Romanian Industry, while big, is outdated. Equipment from the 50s and 60s, low pay, long working hours and unbearable conditions have proven to be a recipe for disaster."
 ROM_chest_brass: "真鍮の胸"
 ROM_chest_brass_desc: "ルーマニア人は多くのことには同意しないが、一つには同意できる。彼らは自国を愛している。時が来て、日が呼ぶとき、彼らは再び祖国を守るために喜んで武器を取るだろう。"
 ROM_intellectual: "知識人"
 ROM_mass_protests: "大規模抗議"
 ROM_revolution_legacy: "革命の遺産"
 ROM_revolution_legacy_desc: "On the 22nd of December 1989 the brutal communist regime of Nicolae Ceausescu was overthrown in what is better known as the Romanian revolution. The effects of the revolution are still badly visible to our people as in its aftermath Romania experienced massive economic problems as well as rampant poverty but our people remember the goals of the revolution which were to free Romania from an authoritarian regime and they will always remember that goal for many years to come "
 ROM_mineriad_legacy: "ミネリアーダの余波"
 ROM_mineriad_legacy_desc: "The Mineriads were a series of protests and episodes of violence carried out by the Jiu Valley miners. Originally Started in 1990, by Coal Miners from Jiu Valley in Transylvania, demanding better wages and working conditions, the mineriads were essentially used by the ruling National Salvation Front Government, which was formed by Ion Iliescu after the fall of the Ceausescu regime to help repress anti-government protests by opposition parties, resulting in countless deaths and destruction caused by the clashes. Five more such events went on to happen, with the most recent one in February of 1999, which resulted in the arrest of Miron Cozma, The leader of the Jiu Valley Miners, therefore putting the mineriads to a close. The miner strikes had significant Social and Economic Impacts to our nation, with many societal scars being created as the result of the political polarization, which followed the mineriads. The mineriads also had the result of many foreign investors being scared away due to the unstable social and economic situation Romania was in, which resulted in further economic instability. The Effects of these events will surely take a long time to fade from our society"
 ROM_romanian_economy_modifier: "ルーマニア経済"
 ROM_romanian_economy_modifier_desc: "The Romanian Economy used to be one of the strongest economies within the eastern bloc, however the economic policies enacted by the Ceausescu regime in the late 1970's and 1980's, as well as the subsequent economic transition to capitalism, have left the Romanian Economy in ruins, with many once prominent sectors being in a state of near collapse. However if we manage to put a strong effort in reviving our land rich economy, we may see a miracle, never seen on the banks of the Danube.\n§W--------------§!\n§RThe Choices You will make in the Economy tree, will shape this dynamic national spirit, according to your choices, which will shape the Romanian Economy in a bold new direction therefore it is advised to tread carefully§!"
 ROM_armed_forces_modifier: "ルーマニア軍"
 ROM_armed_forces_modifier_desc: "The Romanian Armed Forces are in a state of total disarray, with outdated equipment, as well as a reliance on old Soviet doctrines have made our military be a shell of its former self, with our nation being particularly vulnerable in case of a war, which our armed forces would be unprepared for."
 ROM_corruption_modifier: "過度な汚職"
 ROM_corruption_modifier_desc: "ニコラエ・チャウシェスクの全体主義政権から抜け出し、ルーマニアは公共サービスから権力の頂点まで、非常に腐敗した国家構造を持っていることに気づく。これは主に、政権移行を支配した多くの元政権高官が、腐敗したチャウシェスク政権の古い構造を現在まで引き継いだ結果である。汚職は我が国にとって巨大な負担であり、毎日何百万ドルもの価値のお金を失っている。"
