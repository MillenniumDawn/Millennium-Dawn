l_english:
#Events
Solomon_Islands.0.t: "Mounting Ethnic Tensions in Honiara"
Solomon_Islands.0.d: "Mistreatment of Malaitan migrants in Guadalcanal has continued to spark ethnic friction on the islands. Thousands of Malaitans have already been forced to flee their homes by the group known as the Isatabu Freedom Movement, and roadblocks have been set up around the capital to prevent free movement into the province. \n\nWhile our police are seemingly overrun or compromised, we can only sit back and hope things don't continue to get out of hand."
Solomon_Islands.0.a: "This will all blow over."
Solomon_Islands.1.t: "Militant Groups Form Near the Capital"
Solomon_Islands.1.d: "In response to the increasing hostilities to the Malaitan people, the militant Malaita Eagle Force has been formed to counter the Isatabu Freedom Movement. Clashes have already begun between the two groups, with members of our own police force reportedly joining sides with the MEF. It doesn't help that the group is currently being led by political veteran Andrew Nori, giving them an unfortunate level of credibility in the public's eyes."
Solomon_Islands.1.a: "It just keeps getting worse."
Solomon_Islands.2.t: "Honiara Under Siege"
Solomon_Islands.2.d: "The political situation has reached its breaking point in Honiara. After months of ethnic clashes between the various groups, members of the Malaita Eagle Force, reportedly aided by elements of the paramilitary police force, have seized control of key strategic points around the capital. \n\nOur limited intel suggests they are headed this way to force the Prime Minister to resign. Without much in the way of preventing them, our only option is to broker a deal with the remaining members of the Isatabu Freedom Movement, with the express purpose of pushing back the militants. We could be only extenuating the tensions between them, but it might prevent a coup."
Solomon_Islands.2.a: "We have no choice."
Solomon_Islands.2.b: "Force them back."
Solomon_Islands.5.t: "The Storm"
Solomon_Islands.5.d: "The fragile peace we held across the islands has exploded. Months of political robberies, disappearing funding and empty guard posts has only been a prelude to the storm that has arrived at doorstep. The militant clashes have returned in far greater numbers than before, turning swaths of countryside and villages into all out warzones. Companies across the country have packed up shop, along with thousands who have been forced to leave their homes and are now fleeing the country. \n\nWe are only a hair away from a civil war. Our best option may be to request an immediate intervention from neighbouring countries, beginning with our closest ally, Australia. Their presence would certainly weaken our independence, but with little options our future is looking grim."
Solomon_Islands.5.a: "Make the call."
Solomon_Islands.5.b: "We're on our own."
Solomon_Islands.6.t: "Australia Approves Intervention Operation"
Solomon_Islands.6.d: "The Australian government has responded sincerely to our pleas and has promised an intervention force to assist with stabilising the country. They will begin assembling the taskforce shortly, with their diplomats planning to meet with ours to coordinate the operation. Among the expected measures are a mix of 2000 police and military troops, along with construction teams to be sent over in aiding us."
Solomon_Islands.6.a: "There may be hope yet."
Solomon_Islands.7.t: "All Quiet Across the Waves"
Solomon_Islands.7.d: "The Australian government has refused our request for intervention, leaving us to our own devices in terms of dealing with the coming storm."
Solomon_Islands.7.a: "We are truly alone."
Solomon_Islands.8.t: "The Intervention Fails"
Solomon_Islands.8.d: "In light of the intervention's unequivocal failure, the Australian forces have opted to cut their losses and have begun withdrawing from the Islands. Without enough troops of our own to defend the country, we are very likely to descend into another crisis. Despite all our efforts, we have failed to offset the inevitable."
Solomon_Islands.8.a: "Darkness falls over the Islands"

Solomon_IslandsNews.1002.t: "Militant Coup in the Solomon Islands"
Solomon_IslandsNews.1002.d: "The Prime Minister of the Solomon Islands, Bartholomew Ulufa'alu, was taken hostage at gunpoint yesterday by the militant group known as the Malaita Eagle Force, forcing the leader to resign. \n\nThe coup came after the government had failed to curb a series of escalations on the island capital of Honiara, culminating in clashes between Malaita Eagle Force and Isatabu Freedom Movement. During the last 18 months, about 60 people have been killed in ethnic fighting, creating a migration crisis on the islands. With the coup leaders now claiming to be the sole authority in Honiara."
Solomon_IslandsNews.1002.a: "A Looming Storm."

