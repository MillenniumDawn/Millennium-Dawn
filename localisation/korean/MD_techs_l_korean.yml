 OLV: "궤도 발사체 (OLV)"
 OLV_desc: "발사체 또는 운반체 로켓은 로켓 추진체로, 지구 표면에서 우주로, 보통 지구 궤도 또는 그 너머로, 화물을 운반하는 데 사용됩니다."
 OLV1: "궤도 발사체 1965"
 OLV1_desc: "A launch vehicle or carrier rocket is a rocket-propelled vehicle used to carry a payload from Earth's surface to space, usually to Earth orbit or beyond.\n\nOrbital Launch Vehicle (OLV 1965):\n§YSpace Launch§!:\nPayload Mass: §Y2000§! kg | Reliability: §Y60%§!\n§YProduction§!:\nPrice per Unit: $§Y0.006§! billion | Civil Industry per unit: §Y2§! | Production days per unit: §Y240§!"
