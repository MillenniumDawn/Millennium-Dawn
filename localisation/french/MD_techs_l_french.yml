 tech_torpedoes_1: "Torpille 1990"
 tech_torpedoes_1_desc: "Missile sous-marin autopropulsé en forme de cigare conçu pour être tiré depuis un navire ou un sous-marin ou largué dans l'eau depuis un avion et pour exploser lorsqu'il atteint sa cible."
