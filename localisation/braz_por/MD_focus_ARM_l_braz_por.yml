 ARM_balanced_solution: "Crie uma solução equilibrada"
 ARM_ideal_balance: "Nova Disposição Armênia"
 ARM_armenian_mafia_6_desc: "Após o colapso soviético, o crime organizado preencheu o vácuo deixado por um Estado fraco. A máfia armênia se entrelaçou profundamente com a oligarquia, drenando Poder Político, suprimindo a produção industrial e corrompendo todas as camadas da vida pública. As redes criminosas operam com quase total impunidade, e a autoridade do Estado sobre sua própria economia está gravemente comprometida.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos os focos §HConfronto com a Máfia§! ou §HAcordos com a Máfia§!, e será §RRemovido§! se concluirmos o foco §HEsmagar a Máfia§!."
 ARM_armenian_mafia_4_desc: "A pressão do Estado infligiu perdas significativas à máfia armênia. Figuras-chave foram removidas e as receitas criminosas foram interrompidas, embora as redes permaneçam intactas. A corrupção e a interferência política persistem em nível significativo, e um ressurgimento continua possível se a pressão diminuir.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos o foco §HEliminação dos Chefes§! ou a decisão §YDestruir a Influência da Máfia§!."
 ARM_armenian_mafia_3_desc: "Em vez de confrontar a máfia abertamente, o governo negociou uma acomodação incômoda. As organizações criminosas mantêm ampla influência e continuam a extrair rendas da economia, mas o conflito aberto com o Estado foi posto de lado. A corrupção é alta, enquanto os custos políticos continuam sendo um fardo constante.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos o foco §HDominar os Bandidos§!."
 ARM_armenian_mafia_2_desc: "O governo domou a máfia. As redes criminosas não agem mais de forma independente; seus fluxos de caixa passam por canais controlados pelo Estado, e os excessos oligárquicos são mantidos sob controle. Uma economia paralela persiste e a Estabilidade sofre, mas os ganhos agora alimentam o tesouro em vez de centros de poder rivais.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §HEsmagar a Máfia§!."
 armenian_perseverance: "Perseverança Armênia"
 armenian_perseverance_desc: "Muitas civilizações surgiram e desapareceram nos últimos três milênios. Ao contrário de seus antigos amigos e inimigos, os armênios ainda perduram. Embora a Armênia histórica possa nunca mais retornar, a vontade de prosperar e se manter firme é tão forte quanto sempre."
 NKR_marz_arm: "Marz De Facto de [ARM.GetNameWithFlag]"
 NKR_marz_tt: "\n§YDespesa Adicional: $$§R0.350§!§! para os Impostos §Yarmênios§! de [ARM.GetFlag]\n"
 ARM_echoes_1999: "Ecos de 1999 -  §9Oposição Unificada§!"
 ARM_echoes_1999_desc: "As consequências do tiroteio no parlamento em 1999 ainda agitam a população e forçam as facções da oposição a protestar contra Kocharyan.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se Robert Kocharyan deixar de ser nosso líder ou se concluirmos o foco §HPacificar o Yerkrapah§!."
 ARM_echoes_1999_pac: "Ecos de 1999 - §YNacionalistas Expurgados da Coalizão§!"
 ARM_echoes_1999_pac_desc: "As consequências do tiroteio no parlamento em 1999 ainda agitam a população e forçam as facções da oposição a protestar contra Kocharyan.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se Robert Kocharyan deixar de ser nosso líder ou se concluirmos o foco §HMudanças Constitucionais§!."
 ARM_changes_in_militar: "Mudanças nas Forças Armadas"
 ARM_broken_economy: "Eco econômico dos anos 90"
 ARM_broken_economy_desc: "A economia armênia está em profundo declínio. Oligarcas entrincheirados resistem à reforma, deixando problemas estruturais sem solução.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se o nosso §HPIB per capita§! exceder §H$20,000§!."
 ARM_diaspora_links: "Links da Diáspora"
 ARM_diaspora_links_desc: "A diáspora armênia ao redor do mundo possui conexões significativas e pode nos ajudar a construir relações ou a influenciar outros países.\n\nEste espírito nacional nos dá acesso a um painel de decisões relacionadas à diáspora.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §HEnfrentar Contradições Irreconciliáveis§!."
 ARM_rural_water_issues: "Problema de abastecimento de água rural"
 ARM_rural_water_issues_desc: "Após o colapso da URSS, a Armênia começou a enfrentar problemas com a infraestrutura de irrigação de culturas agrícolas. Apesar de a agricultura ocupar uma parte significativa da economia armênia, esses problemas ainda não foram resolvidos."
 ARM_102st_base: "102ª Base Militar de [SOV.GetNameWithFlag]"
 ARM_102st_base_desc: "A 102ª Base Militar Russa é uma base militar russa em Gyumri, na Armênia, sob o comando do Distrito Militar do Sul das Forças Armadas Russas.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se entrarmos na OTAN, se [SOV.GetNameWithFlag] não tiver acesso militar ao nosso território, ou se entrarmos em guerra com [SOV.GetNameWithFlag]."
 ARM_echoes_of_1999: "Ecos de 1999"
 ARM_echoes_of_1999_desc: "A Armênia está numa encruzilhada política e colhendo os frutos do ataque terrorista de 1999. O que significa a ascensão de Robert Kocharyan para a Armênia?"
 ARM_agree_on_places: "Acordos sobre locais"
 ARM_high_emigration_0: "Emigração muito pequena"
 ARM_high_emigration_0_desc: "Com o colapso da URSS e a deterioração da situação econômica, muitos países da CEI tornaram-se reféns do aumento da migração externa. Nas realidades de hoje, a Armênia está ameaçada de extinção, o que não se pode dizer de seu vizinho oriental e principal inimigo político. A solução da questão demográfica deve se tornar a principal agenda da política armênia.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se o nosso §HPIB§! exceder §H$100B§! e a estabilidade for de pelo menos §H64%§!."
 ARM_immigration_desc: "Armênios de todo o mundo estão retornando sistematicamente à sua pátria histórica, repatriando-se em massa como cidadãos plenos."
 ARM_russia_debt_wait: "Acordo de §WAdiamento§! da Dívida com [SOV.GetNameWithFlag]"
 ARM_russia_debt_wait_desc: "[ARM.GetNameWithFlag] é o único país cuja dívida não foi assumida ou perdoada por [SOV.GetNameWithFlag]. Seja um movimento político ou pragmático, eles nos deram um adiamento para resolvermos a questão da dívida.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nossa dívida cair abaixo de §H10§! ou se concluirmos o foco §HAcordo de Propriedade por Dívida§!."
 ARM_official_investigation: "Iniciar investigação oficial"
 ARM_official_investigation_desc: "Para acalmar a oposição e a comunidade internacional, devemos iniciar uma investigação oficial sobre o ataque terrorista de 1999."
 ARM_pacify_yerkrapah: "Pacificando Yerkrapah"
 ARM_pacify_yerkrapah_desc: "A organização militar Yerkrapah é demasiado influente na Armênia para o nosso governo. É composta principalmente por apoiadores nacionalistas de Vazgen Sargsyan. Devemos removê-los do comando militar."
 ARM_meet_putin: "Reunião com Putin"
 ARM_meet_putin_desc: "Talvez consigamos convencer a Rússia a investir em nossa economia e criar o espírito de confiança para o futuro acordo da dívida."
 ARM_northern_avenue_project: "Projeto Avenida Norte"
 ARM_northern_avenue_project_desc: "A Avenida Norte é um projeto proposto para o centro de Yerevan no qual as ruas serão reconstruídas com a demolição de antigos edifícios históricos e a construção de novos edifícios modernos."
 ARM_property_for_debt: "Acordo de Propriedade por Dívida"
 ARM_property_for_debt_desc: "A Armênia é o único país que não teve sua dívida perdoada pela Rússia após a queda da URSS. No entanto, talvez possamos chegar a um acordo doando propriedades em vez de dinheiro."
 ARM_person_business: "Empreendimentos Comerciais Pessoais"
 ARM_person_business_desc: "Embora isso possa prejudicar nosso ciclo econômico, podemos obter alguns benefícios dos empreendimentos comerciais pessoais de Kocharyan."
 ARM_caucasian_tiger: "Tigre caucasiano"
 ARM_caucasian_tiger_desc: "Devido ao sector da construção inflacionado, a Arménia tem agora o maior crescimento do PIB na região. Devemos abraçar esta situação."
 ARM_silence_hun: "Silencing Hunanyan"
 ARM_silence_hun_desc: "Hunanyan pode dar alguma luz à oposição. Não podemos deixar isso acontecer."
 ARM_constitutional_changes: "Mudanças Constitucionais"
 ARM_constitutional_changes_desc: "Para acabar com qualquer esperança de oposição deter nosso governo, precisamos fazer mudanças na constituição e reprimir os protestos."
 ARM_hi_rob: "Olá, Rob!"
 ARM_hi_rob_desc: "Poghos Poghosyan, do partido Dashnaktsutyun, tem sido um problema antigo para Kocharyan. Ele é um velho \"amigo\" seu, e velhos laços são arriscados demais para nós agora."
 ARM_union_state_proposal: "Proposta do Estado da União"
 ARM_union_state_proposal_desc: "Finalmente, podemos tentar aderir ao projeto do Estado de União para nossa prosperidade futura."
 ARM_suppressed_oppos: "Oposição suprimida"
 ARM_cauc_tigr: "Tigre caucasiano"
 ARM_autocratic_grip: "Poder Autocrático"
 ARM_armenia_kocharyan_idea: "Armênia de Kocharyan"
 arm_opposition_backlash_ticker_mission: "Reação da oposição"
 arm_opposition_backlash_ticker_mission_desc: "The [ARM.GetFlag] §YArmenian Opposition§! will be preparing to hold rallies and force the £ARM_reactionary §YKocharyan§! government to give in and hold fair elections. We need to delay this moment and preferably prevent rallies altogether, or be sure that the opposition will lose."
 ARM_first_wave_of_assasinat: "Iniciar a §YPrimeira Onda§! de §YAssassinatos Políticos§!"
 ARM_second_wave_of_assasinat: "Iniciar a §9Segunda Onda§! de §YAssassinatos Políticos§!"
 first_assasinat_done: "§YPrimeira onda de assassinatos concluída§!"
 second_assasinat_done: "§YSegunda onda de assassinatos concluída§!"
 ARM_armenia_kocharyan_idea_tt: "[ARM_Kocharyan_People_loc][ARM_Kocharyan_Tiger_loc][ARM_Kocharyan_Autocratic_loc][ARM_Kocharyan_Opposition_loc]"
 ARM_Kocharyan_People_loc1: "\n§gNOSSA GENTE NOS POSTOS§!:\n£corruption_cost_factor_texticon Custo de Poder Político para mudar a Corrupção: §R+30.00%§!\n£political_power_texticon  Ganho de Poder Político: §G+30.00%§!\n"
 ARM_Kocharyan_Tiger_loc1: "\n§gTIGRE DO CÁUCASO§!:\n£econ_cycle_upg_cost_multiplier_modifier_texticon Multiplicador do §YCusto no Tesouro de Melhoria do Ciclo Econômico§!: §G-10.00%§!\n£construction_speed_texticon  Velocidade de Construção Local: §G+10.00%§!\n"
 ARM_Kocharyan_Autocratic_loc1: "\n§gPODER AUTOCRÁTICO§!:\n£construction_speed_texticon  Velocidade de Construção Local: §G+10.00%§!\n£political_power_texticon  Ganho de Poder Político: §G+5.00%§!\n£interest_rate_multiplier_modifier_texticon §YTaxa de Juros§!: §G-2§!\n£emerging_outlook_campaign_cost_modifier_texticon Apoio Emergente Diário: §G+0.06§!"
 ARM_Sargsyan: "Serzh Sargsyan"
 ARM_Sargsyan_desc: "Desde 1988, Serzh Sargsyan tem sido um dos líderes do \"Movimento Karabakh\", que tem como objetivo a defesa de Nagorno-Karabakh pela Armênia. Com fortes ligações nas esferas militar e política da Armênia, ele se tornou um candidato ideal para a presidência após Kocharyan."
 ARM_appoint_tigran: "Nomeie Tigran"
 ARM_appoint_tigran_desc: "Deveríamos nomear Tigran Sargsyan como chefe do Banco Central da Armênia para possíveis reformas futuras."
 ARM_clear_out_nats: "Expulsar os apoiadores de Andranik Margaryan"
 ARM_clear_out_nats_desc: "Andranik Margaryan e sua ala nacionalista do partido devem ser reprimidos; são demasiadamente desleais e perigosos para serem tolerados em nosso partido."
 ARM_spheres_of_influence_sep: "Esferas de influência separadas"
 ARM_spheres_of_influence_sep_desc: "O governo anterior nos deu sinal verde para governar este país, portanto devemos respeitar seus empreendimentos comerciais."
 ARM_befriend_oligs: "Fazendo amizade com oligarcas"
 ARM_befriend_oligs_desc: "Talvez devêssemos estabelecer contatos com oligarcas e ouvir as propostas que eles poderiam nos oferecer."
 ARM_patriotic_educ: "Educação Patriótica para a Juventude"
 ARM_patriotic_educ_desc: "Devemos educar nossa juventude no espírito do patriotismo. Nosso partido, mesmo antes de assumirmos a liderança, já era muito bem-sucedido nisso e, portanto, devemos dar continuidade a essa tradição."
 ARM_ensure_milit: "Garantir o apoio militar"
 ARM_ensure_milit_desc: "Devemos garantir que as forças armadas ocupem uma das posições mais importantes em nosso governo e sociedade."
 ARM_priorit_loy_gener: "Priorize generais leais"
 ARM_priorit_loy_gener_desc: "Devemos priorizar generais que nos sejam leais e que estabeleçam ligações políticas."
 ARM_new_gov_builds: "Novos edifícios governamentais"
 ARM_new_gov_builds_desc: "Graças às nossas boas ligações com a oligarquia, talvez possamos chegar a um bom acordo com eles para a construção de novas instalações para o nosso governo."
 ARM_navasard_legacy_sup: "O legado de Navasardyan"
 ARM_navasard_legacy_sup_desc: "Embora tenhamos suprimido a velha guarda do partido republicano, usar seus métodos e seu legado pode ser muito útil para o futuro do nosso país."
 ARM_cronies_elevated: "Promovendo amigos"
 ARM_cronies_elevated_desc: "Precisamos mudar nossas prioridades na educação, mantendo, ao mesmo tempo, as ideias centrais."
 ARM_support_monopolies: "Monopólios apoiados"
 ARM_support_monopolies_desc: "Precisamos manter nosso sistema de monopólio para manter nossa influência no estado."
 ARM_hovik_guidelines: "Diretrizes de Hovik"
 ARM_hovik_guidelines_desc: "O primeiro-ministro Hovik Abrahamyan instruiu o Ministério da Economia a elaborar diretrizes para a importação de dez produtos essenciais para o mercado dentro de um mês. Esses produtos incluem açúcar, farinha, trigo, óleo, arroz, trigo sarraceno, manteiga, margarina, bananas, laranjas, alimentos infantis, aves, medicamentos, diesel e gasolina. Ele observou que, embora esses mercados não sejam formalmente monopolizados, são percebidos como tal pelo público."
 ARM_mandatory_pension_system: "Sistema de Pensão Acumulativa Obrigatória"
 ARM_mandatory_pension_system_desc: "Um sistema de pensões acumulativas obrigatórias garantirá a aposentadoria de nossos cidadãos e reduzirá a dependência a longo prazo da assistência social estatal."
 ARM_patronize_nats: "Nacionalistas condescendentes"
 ARM_patronize_nats_desc: "O Partido Republicano apoia os movimentos nacionalistas no país de diversas maneiras."
 ARM_footbal_diplo: "Diplomacia do Futebol"
 ARM_visit_to_russia: "Visita de Estado à Rússia"
 ARM_visit_to_russia_desc: "Serzh Sargsyan viajará à Rússia para negociar a aproximação da Armênia com a UE."
 ARM_approach_eu_serzh: "Abordagem da União Europeia"
 ARM_approach_eu_serzh_desc: "O Dia da Europa é um evento marcante em nosso país, graças ao qual temos mais oportunidades de nos aproximar da UE."
 ARM_serzh_free_speech: "Liberdade de expressão para apoio à UE"
 ARM_serzh_free_speech_desc: "Embora não queiramos fortalecer a oposição, precisamos conceder alguns direitos à população para ampliar as oportunidades econômicas."
 ARM_ss_army: "Exército de S.S."
 ARM_ss_army_desc: "Somos o exército de Serzh Sargsyan, e o seguiremos até os confins da Terra!"
 arm_sargsyan.1.t: "Encontro na Armênia após uma partida de futebol!"
 arm_sargsyan.1.d: "Depois de assistirem à partida de futebol entre Armênia e Turquia, os líderes dos dois países discutem diversos assuntos. A Armênia propõe celebrar um acordo bilateral de cooperação entre nossos países para o desenvolvimento mutuamente benéfico de nossas economias e a normalização das relações."
 arm_sargsyan.1.a: "Claro"
 arm_sargsyan.1.b: "Não"
 arm_sargsyan.2.t: "Assinatura de Acordo de Cooperação Armênia-Turca"
 arm_sargsyan.2.d: "A Turquia concordou em assinar um acordo bilateral de cooperação."
 arm_sargsyan.2.a: "Ótimo"
 arm_sargsyan.3.t: "A Turquia recusou."
 arm_sargsyan.3.d: "Nossos esforços para restaurar as relações não encontraram eco do outro lado."
 arm_sargsyan.3.a: "Ok"
 arm_sargsyan.4.t: "Sargsyan visita Moscou"
 arm_sargsyan.4.d: "Sargsyan está nos pedindo para permitir que a Armênia se aproxime dos países da UE. Ele argumenta que isso não levará a um rompimento de laços conosco."
 arm_sargsyan.4.a: "Concordamos"
 arm_sargsyan.4.b: "A Armênia Não Pode Nos Deixar pela UE"
 arm_sargsyan.4.c: "Podemos Oferecer Uma Parceria Econômica Mais Próxima"
 arm_sargsyan.5.t: "A Rússia Exige que Abandonemos Nossos Objetivos de Aproximação com a UE"
 arm_sargsyan.5.d: "A Rússia é categoricamente contra qualquer aproximação entre nós e a UE e, por isso, nos ameaça com sanções econômicas caso tentemos nos aproximar."
 arm_sargsyan.5.a: "Manteremos nossas opiniões"
 arm_sargsyan.5.b: "Aceitamos as exigências"
 arm_sargsyan.6.t: "A Armênia Não Teme Nossas Ameaças"
 arm_sargsyan.6.d: "Nossas ameaças não assustaram a liderança armênia; devemos impor as sanções prometidas?"
 arm_sargsyan.6.a: "Nós Avisamos"
 arm_sargsyan.6.b: "Talvez da Próxima Vez Possamos Chegar a um Acordo"
 arm_sargsyan.7.t: "A Rússia Oferece um Acordo"
 arm_sargsyan.7.d: "Se abandonarmos nossos planos de aproximação com a UE, receberemos ajuda econômica em troca. Mas se voltarmos atrás na oferta, haverá consequências."
 arm_sargsyan.7.a: "Fechado"
 arm_sargsyan.7.b: "Rejeitamos Esta Oferta"
 arm_sargsyan.8.t: "A Rússia Concorda"
 arm_sargsyan.8.d: "A Rússia concorda com nossa aproximação com a União Europeia."
 arm_sargsyan.8.a: "Perfeito"
 arm_sargsyan.9.t: "A Armênia Recua"
 arm_sargsyan.9.d: "A Armênia decide não nos contrariar e aceita nossas exigências."
 arm_sargsyan.9.a: "Ótimo"
 arm_sargsyan.10.t: "A Rússia Recua"
 arm_sargsyan.10.d: "A Rússia decidiu recuar de suas ameaças e silenciosamente nos deixar pôr nossos objetivos em prática."
 arm_sargsyan.10.a: "Perfeito"
 arm_sargsyan.11.t: "A Armênia Rejeita o Acordo"
 arm_sargsyan.11.d: "Apesar de nossas tentativas de oferecer uma proposta econômica favorável, ela foi rejeitada mesmo assim."
 arm_sargsyan.11.a: "Ruim"
 arm_sargsyan.12.t: "Dia da Europa na Armênia"
 arm_sargsyan.12.d: "A Delegação da UE na Armênia realizará eventos festivos em Yerevan e em diferentes regiões do país, além de reuniões informativas, exposições e concertos dedicados às atividades da UE na Armênia."
 arm_sargsyan.12.a: "É uma Boa Ideia"
 arm_sargsyan.12.b: "Não"
 arm_sargsyan.13.t: "A UE Nos Apoiou"
 arm_sargsyan.13.d: "Os principais países da UE concordaram em apoiar nossa iniciativa europeia."
 arm_sargsyan.13.a: "Rumo ao Futuro com a Europa"
 arm_sargsyan.14.t: "A UE Recusou Nos Apoiar"
 arm_sargsyan.14.d: "Os países da UE ignoraram nosso evento e não nos apoiaram."
 arm_sargsyan.14.a: "Ok"
 arme.12.b: "Desculpe, não."
 ARM_armenia_serj_idea: "Armênia de Sargsyan"
 ARM_tig_reforms: "Reformas de Tigran Sargsyan"
