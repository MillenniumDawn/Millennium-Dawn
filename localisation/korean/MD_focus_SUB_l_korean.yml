l_korean:
 TAT_neftehimshina: "타트네프트 네프테힘시나"
 TAT_tech: "타트네프트 기술 센터"
 TAT_green_energy_investments: "타트네프트 친환경 에너지"
 TAT_tatneft_category: "타트네프트"
 TAT_tatneft_category_desc: "타트네프트는 1950년에 시작된 타타르 석유 기업입니다. 타트네프트는 러시아 최대 수직 계열화 석유 기업 중 하나로, 석유 및 가스 생산, 석유 정제, 석유화학, 타이어 복합 단지, 주유소 네트워크, 전력 산업, 석유 및 가스 산업용 장비의 개발 및 생산, 그리고 서비스 부문 계열사를 역동적으로 발전시키고 있습니다. 타트네프트는 금융 부문 기업들의 자본에도 참여하고 있습니다."
 TAT_tatneft_start: "자동차용 고무 생산 기업 설립"
 TAT_tatneft_tech: "에너지 부문 투자"
 TAT_tatneft_tech2: "녹색 에너지에 투자"
 russian_subjects_focus_tree: "러시아 구성 주체 국가 중점 트리"
 crimea_focus: "크림 국가 중점 트리"
 TAT_natbat_tatar: "민족 대대"
 TAT_natbat_tatar_desc: "우리는 우리의 자유와 러시아의 자유를 위한 전쟁에 참여할 민족 대대를 창설할 준비가 되었습니다."
 TAT_ratnik: "전투원에게 라트니크 장비 지급"
 TAT_ratnik_desc: ""
 TAT_natbat: "타타르스탄 연대"
 TAT_natbat_desc: "우리는 조국을 위해 싸우기를 원하는 이들로 이루어진 연대의 편성을 시작할 준비가 되었습니다."
 TAT_innopolis: "이노폴리스"
 TAT_innopolis_desc: "지역 IT 파크의 성공은 시작에 불과했습니다. 이제 우리는 전례 없는 규모의 프로젝트, 즉 완전히 새로운 도시를 처음부터 건설할 준비가 되었습니다. 현대적인 과학 거점으로 설계되는 '이노폴리스'에는 세계적 수준의 대학, 경제특구, 스마트 인프라가 들어설 것입니다. '실리콘 볼가'를 현실로 만들 때입니다."
 TAT_damir_islamov: "다미르 이슬라모프 전차 대대"
 TAT_damir_islamov_desc: ""
 TAT_boris_kuznetsov: "보리스 쿠즈네초프 포병 대대"
 TAT_boris_kuznetsov_desc: ""
 TAT_sabir_ahtyamov: "사비르 아흐탸모프 기계화 소총 대대"
 TAT_sabir_ahtyamov_desc: ""
 TAT_metro_tatar: "지하철 개통"
 TAT_metro_tatar_desc: "우리는 우리 공화국에 지하철을 개통할 준비가 되었습니다."
 TAT_tatneft: "타트네프트 투자"
 TAT_tatneft_desc: "더 많은 자원 유입을 얻기 위해 타트네프트에 더 많은 자금을 투자하고 있습니다."
 TAT_socialist_humanism: "사회주의적 휴머니즘"
 TAT_socialist_humanism_desc: ""
 TAT_a_new_economic_policy: "신경제 정책"
 TAT_a_new_economic_policy_desc: "5개년 계획은 잘 작동하고는 있지만 충분히 잘 작동하지는 않습니다. 최대한의 경제 성장을 얻으려면 방식을 조금 바꿀 필요가 있습니다."
 TAT_stalin: "재스탈린화"
 TAT_stalin_desc: "우리는 사회주의 건설과 유럽 파시즘의 역병으로부터 인류 문명을 구한 스탈린의 역할에 다시 한번 경의를 표해야 합니다. 오늘날 스탈린 시대의 위대함은 가장 격렬한 비판자들에게도 자명합니다. 우리는 전 세계를 해방할 것입니다!"
 BSH_socialist_humanism: "사회주의적 휴머니즘"
 BSH_socialist_humanism_desc: ""
 BSH_a_new_economic_policy: "신경제정책"
 BSH_a_new_economic_policy_desc: "5개년 계획은 잘 돌아가고는 있지만 충분히 잘 돌아가는 것은 아닙니다. 최대한의 경제 성장을 얻으려면 상황을 조금 바꿀 필요가 있습니다."
 BSH_stalin: "재스탈린화"
 BSH_stalin_desc: "우리는 사회주의를 건설하고 인류 문명을 유럽 파시즘의 역병으로부터 구해 낸 스탈린의 역할에 다시 한번 경의를 표해야 합니다. 오늘날 스탈린 시대의 위대함은 가장 맹렬한 증오자들에게조차 자명합니다. 우리는 온 세계를 해방할 것입니다!"
 CRM_zdravo: "건강한 국민"
 CRM_zdravo_desc: "우리는 시민에게 투자하고 있으며, 사회 및 보건 부문으로 가는 자금 흐름을 늘릴 것입니다."
 KHM_socialist_humanism: "사회주의적 인본주의"
 KHM_socialist_humanism_desc: ""
 KHM_a_new_economic_policy: "신경제 정책"
 KHM_a_new_economic_policy_desc: "5개년 계획은 잘 작동하고는 있지만 충분히 잘 작동하지는 않습니다. 최대한의 경제 성장을 얻으려면 방식을 조금 바꿀 필요가 있습니다."
 TAT_Inter: "타타르 인터넷"
 TAT_tatneft_per: "§Y[PER.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_tatneft_tur: "§Y[TUR.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_tatneft_syr: "§Y[SYR.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_tatneft_irq: "§Y[IRQ.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_tatneft_lba: "§Y[LBA.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_tatneft_sud: "§Y[SUD.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_tatneft_sau: "§Y[SAU.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_tatneft_alg: "§Y[ALG.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_tatneft_klm: "§Y[KLM.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_tatneft_nee: "§Y[NEE.GetNameWithFlag]§!에 석유 계약 제안"
 TAT_pro_russ: "친러시아 노선"
 TAT_pro_russ_desc: "우리는 러시아와 함께할 것입니다."
 TAT_anti_russ: "독립의 길"
 TAT_anti_russ_desc: "우리는 우리만의 길, 독립의 길을 걸을 것입니다."
 TAT_economic: "타타르스탄 경제"
 TAT_western_start: "민주주의의 길"
 TAT_economic_desc: "우리의 경제 상황은 러시아의 다른 공화국들과 다릅니다. 우리는 1990년대를 훨씬 수월하게 견뎌냈으며 이는 유능한 경제 정책 덕분입니다."
 TAT_western_start_desc: "이제 우리나라가 민주적 통치의 길에 들어설 때입니다."
 TAT_promka: "타타르스탄 산업"
 TAT_promka_desc: "우리는 여기서 멈춰서는 안 됩니다. 우리 공화국이 번영하도록 국내 산업을 계속 발전시킬 것입니다."
 TAT_rebuild_promka: "산업 발전 노선"
 TAT_rebuild_promka_desc: "국내 산업의 급속한 성장을 우리 경제 정책의 최우선 과제로 삼겠습니다."
 TAT_rezina: "고무 생산"
 TAT_rezina_desc: "국내 소비자와 외국 구매자 모두의 수요를 충족하도록 고무 생산을 확대하겠습니다."
 TAT_neftehim: "석유화학 부문"
 TAT_neftehim_desc: "이전처럼 석유화학 부문을 계속 발전시키겠습니다."
 TAT_airport: "카잔 공항 재건"
 TAT_airport_desc: "우리는 공항 재건을 위한 자금을 배정할 준비가 되었습니다."
 TAT_tourism: "관광 부문 발전"
 TAT_tourism_desc: "관광 발전은 국고에 상당한 수입을 가져다줄 것입니다."
 TAT_alabuga: "경제특구 - 알라부가"
 TAT_alabuga_desc: "타타르스탄 공화국 옐라부가 지구에 있는 산업 및 생산형 경제특구입니다. 옐라부가에서 10km, 나베레즈니예첼니에서 25km, 니즈넴캄스크에서 40km, 카잔에서 210km 떨어져 있으며 면적은 3903.5헥타르입니다. 타타르스탄 공화국 토지재산관계부는 관리 회사인 JSC SEZ PPT 알라부가의 지분을 100% 보유한 주주입니다."
 TAT_alabuga_small_business: "소기업 중점"
 TAT_alabuga_small_business_desc: "우리는 중소기업에 집중하여 혜택을 배정하고 이들의 발전을 촉진하도록 도울 것이며, 이는 반드시 성과를 낼 것입니다."
 TAT_alabuga_aurus: "아우루스 생산 공장"
 TAT_alabuga_aurus_desc: "러시아 소비자를 위한 고급 승용차를 생산하겠습니다."
 TAT_alabuga_invest: "투자 매력도"
 TAT_alabuga_invest_desc: "우리 경제특구에 투자자를 계속 유치하겠습니다."
 TAT_akbars: "아크 바르스 홀딩"
 TAT_akbars_desc: "OJSC 아크 바르스 홀딩은 1998년에 설립된 다각화 금융 지주 회사입니다."
 TAT_akbars_agro_prom: "농업 부문 발전"
 TAT_akbars_agro_prom_desc: "농업 부문을 투자와 발전의 별도 범주로 분류하겠습니다."
 TAT_akbars_it: "IT 투자"
 TAT_akbars_it_desc: "IT 분야에는 미래가 있으며, 그래서 우리는 여기에 투자하고 있습니다."
 TAT_akbars_sudostroy: "JSC 젤레노돌스크 조선소"
 TAT_akbars_sudostroy_desc: "JSC 젤레노돌스크 조선소는 러시아 젤레노돌스크에 있는 조선 기업입니다. 아크 바르스 홀딩의 일부입니다."
 TAT_military: "군수 산업"
 TAT_military_desc: "우리의 군수 산업은 가장 약한 편이 아니며, 이는 이 분야를 발전시킬 추진력이 됩니다."
 TAT_sokol_bpla: "\\"소콜\\" 설계국"
 TAT_sokol_bpla_desc: "카잔시 카라바예보 구역에 위치해 있습니다. 소콜 설계국의 주요 활동은 무인 항공기의 생산 및 수리, 연구 개발 수행, 항공 장비 시제품 시험입니다."
 TAT_eniks_bpla: "CJSC 에닉스"
 TAT_eniks_bpla_desc: "공중 표적 복합체와 무인 항공기(UAV), 지상 항공기 발사기, UAV용 항공기 제트 엔진, 항공 자율 무선 항법 시스템, 자이로 안정화 광학 UAV 시스템의 개발, 생산, 운용 및 수리에 종사하는 기업입니다."
 TAT_kvz_helicopters: "카잔 헬리콥터 공장"
 TAT_kvz_helicopters_desc: "Mi-8/17 계열 헬리콥터를 제조하는 주식회사입니다. 카잔에서 제조된 헬리콥터는 전 세계에서 총 5천만 비행시간 이상을 비행했습니다. KVZ의 전체 역사에서 Mi-4, Mi-8, Mi-14, Mi-17, 안사트 헬리콥터와 그 파생형 1만 2천 대 이상이 전 세계 100개국에 인도되었습니다."
 TAT_kazavia: "카잔 항공기 공장"
 TAT_kazavia_desc: "1932년 카잔시에서 설립되어 현재까지 가동 중인 항공 산업 최대 기업 중 하나입니다. 카잔 항공기 제작 구역 동부, 카라바예보 구역의 막시모프 거리와 아카데미카 파블로바 거리 사이에 위치해 있습니다. 인근 도시에는 보리소글렙스코예 공장 비행장도 있습니다. 군용 및 민간 항공기와 소비재를 생산합니다. 인근의 JSC \\"카잔 엔진 제작 생산 연합\\"과 함께 지구를 형성하는 핵심 기업 중 하나입니다."
 TAT_reb_zavod: "카잔 광학 기계 공장"
 TAT_reb_zavod_desc: "광학 기기의 개발과 제조를 전문으로 하는 다분야 기업입니다. 정식 명칭은 주식회사 \\"카잔 광학 기계 공장\\"입니다. 전자전 장비 양산을 담당하는 JSC 스텔라-K도 이 기업의 부지에서 운영되고 있습니다."
 TAT_rockets: "엘레콘"
 TAT_rockets_desc: "이 기업의 주요 제품은 커넥터입니다. JSC 엘레콘 공장에서 제조한 원격 측정 장치와 커넥터는 모든 종류의 군용 및 민간 장비와 여러 산업, 발사체(소유즈, 프로톤, 제니트), 대륙간 탄도 미사일(SS-19, SS-20, 토폴-M)과 그 발사 기지, 위성선(보스토크, 보스호트, 소유즈, 코스모스, 몰니야, 에크란, 라두가 등), 궤도 정거장(살류트, 미르, ISS), 행성 간 탐사선(루나, 마르스, 베네라), 군용 및 민간 항공기, 헬리콥터, 선박과 잠수함, 전차, 레이더, 위성 통신 및 항법 시스템, 원격 제어 및 자동화, 텔레비전 및 전기 공학, 원자력 및 화력 발전소, 철도 장비, 자동차에 널리 사용됩니다."
 TAT_western_reform_govern: "정부 개혁"
 TAT_western_reform_govern_desc: "우리 정부는 시급한 개혁이 필요합니다."
 TAT_western_decentr: "지방 분권"
 TAT_western_decentr_desc: "이제 지역에 더 많은 권리를 부여할 때입니다."
 TAT_western_defend_people_rights: "인권과 자유"
 TAT_western_defend_people_rights_desc: "우리 국가는 이제부터 모든 시민의 권리와 자유를 존중할 것입니다."
 TAT_EU_integration: "EU 통합"
 TAT_EU_integration_desc: "우리는 유럽 연합에 통합할 계획입니다."
 TAT_western_anti_corruption: "부패 척결"
 TAT_western_anti_corruption_desc: "부패한 관리들은 처벌받을 것입니다!"
 TAT_western_prave_rabochich: "노동자의 권리"
 TAT_western_prave_rabochich_desc: "우리 노동자들은 사회적 보장으로 보호받아야 합니다."
 TAT_USAD_request: "USAID 요청"
 TAT_USAD_request_desc: "우리는 지원을 받기 위해 USAID에 연락하기로 결정했습니다."
 TAT_western_freedom_smi: "언론의 자유"
 TAT_western_freedom_smi_desc: "언론의 자유는 우리 국가의 기본 원칙 중 하나입니다."
 TAT_Opening_garment: "유명 브랜드 의류 공장 개설"
 TAT_Opening_garment_desc: "우리는 우리나라 영토에 유명 브랜드 의류 제품의 생산 기반을 마련할 준비가 되었습니다."
 TAT_western_welfare: "보건 투자"
 TAT_western_welfare_desc: "우리 국민은 건강해야 합니다."
 TAT_western_mothers_posobia: "출산 수당"
 TAT_western_mothers_posobia_desc: "출산 수당에 가능한 한 많은 자금을 배정하겠습니다."
 TAT_western_economic_rost: "경제 성장"
 TAT_western_economic_rost_desc: "우리의 유능한 정책이 경제 성장으로 이어졌습니다."
 TAT_western_infrastructure: "인프라 투자"
 TAT_western_infrastructure_desc: "우리 국가의 영토가 황량한 사막이어서는 안 됩니다."
 TAT_western_education_reform: "교육 개혁"
 TAT_western_education_reform_desc: "교육 개혁에 대규모로 투자하겠습니다."
 TAT_western_science_reform: "과학 투자"
 TAT_western_science_reform_desc: "과학은 우리나라의 미래이므로 과학에 투자하겠습니다!"
 TAT_western_sport: "스포츠 장려"
 TAT_western_sport_desc: "건강한 국민이 강한 국가입니다!"
 TAT_western_ciphrovisation: "전면적 디지털화"
 TAT_western_ciphrovisation_desc: "디지털화는 우리 경제의 성장을 강화할 것입니다."
 TAT_western_liberal_heaven: "타타르스탄 자유주의 쇼케이스"
 TAT_western_liberal_heaven_desc: "우리는 러시아 영토에서 자유주의 국가를 건설하는 본보기입니다."
 TAT_Communism_start: "공산주의의 귀환"
 TAT_Communism_start_desc: "공산주의가 다시 타타르스탄으로 돌아왔습니다. 공산주의자들이 다시 나라를 다스리게 될까요?"
 TAT_arest_silovic: "농민 지원"
 TAT_arest_silovic_desc: "우리는 자국 농민을 돕겠습니다. 그들이 우리 국민을 먹여 살리기 때문입니다."
 TAT_erase_nationalist: "모든 민족주의자 투옥"
 TAT_erase_nationalist_desc: "이제 우리나라의 민족주의 조직을 제거할 때입니다."
 TAT_antigay_propaganda_laws: "동성애 선전 금지법"
 TAT_antigay_propaganda_laws_desc: "이제 우리나라에서 LGBT를 법적으로 금지할 때입니다."
 TAT_clean_soc_net_desc: "모든 소셜 네트워크를 정화하여 적의 선전이 퍼지지 못하도록 하겠습니다."
 TAT_pioneria: "피오네리아"
 TAT_pioneria_desc: "젊은이들이 빈둥거려서는 안 되므로 피오네르를 부활시키겠습니다."
 TAT_Marks_school: "학교 내 마르크스주의"
 TAT_Marks_school_desc: "학교 교육과정에 반드시 마르크스를 포함하겠습니다."
 TAT_free_education: "무상 교육"
 TAT_free_education_desc: "교육은 우리 영광스러운 국가의 모든 시민에게 무상으로 제공되어야 합니다."
 TAT_state_atheism: "국가 무신론"
 TAT_state_atheism_desc: "종교는 인민의 아편이므로 이제 종교와 싸울 때입니다."
 TAT_collectivism: "집단주의"
 TAT_collectivism_desc: "집단화는 이미 한 번 성과를 냈으므로 그 경험을 되풀이하겠습니다."
 TAT_mobilize_the_masses: "대중 동원"
 TAT_mobilize_the_masses_desc: "우리 군은 당이 요구하는 곳이라면 어디서든 우리나라의 이익을 수호할 인력이 필요합니다."
 TAT_nationalisation_production: "생산 국유화"
 TAT_nationalisation_production_desc: "생산물의 국유화는 우리 경제가 더 강해지는 데 도움이 될 것입니다."
 TAT_the_culture_of_proletarianism: "프롤레타리아 문화"
 TAT_the_culture_of_proletarianism_desc: "이제 노동 계급을 위한 프롤레타리아 문화를 뿌리내릴 때입니다. 이를 통해 우리는 함께 공동의 아름다운 공산주의 미래를 향해 나아갈 것입니다."
 TAT_fight_international_capitalists: "국제 자본가와의 투쟁"
 TAT_fight_international_capitalists_desc: "올리가르히는 위험하고 부패한 계급이며 소비에트 시절의 쿨라크와 다를 바 없습니다. 소련 해체 이후 러시아 올리가르히는 점점 더 많은 경제적 영향력을 삼켜 왔고, 외국 기업이 주도하는 세계주의적 경제 모델을 위해 러시아 노동자들을 일자리에서 몰아냈습니다. 러시아를 되살리려면 무엇보다 먼저 국제 자본가 계급을 몰아내야 합니다."
 TAT_better_roads: "도로 전반 개선"
 TAT_better_roads_desc: "우리나라의 도로 문제를 면밀히 다룰 필요가 있습니다."
 TAT_soviet_academy_of_sciences: "혁명 교육"
 TAT_soviet_academy_of_sciences_desc: "수십 년에 걸쳐 많은 이들이 목숨을 바쳐 이룩한 것을 학생들이 잊지 않도록 교실에서 혁명 이념을 강화해야 합니다."
 TAT_weaken_the_banks: "은행 약화"
 TAT_weaken_the_banks_desc: "은행은 자본주의의 친위대로서 그 깃발을 들고 전투에 나서며 존재 자체로 그 이윤을 지킵니다. 은행은 세계의 가난한 지역에 간섭하고, 임금 덤핑과 이자 투기로 노동 계급을 착취하며, 합법과 불법 기부금으로 정치에 영향력을 행사합니다. 은행은 단순히 비정치적인 단기 대부업자에 머무르는 상태로 되돌려져야 합니다."
 TAT_support_of_the_worker: "노동자 지원"
 TAT_support_of_the_worker_desc: "노동 계급은 우리의 버팀목이자 힘이며, 우리는 자본주의라는 전염병에 맞선 싸움에서 언제나 그들을 지원할 것입니다!"
 TAT_ultimate_tax_reform: "대규모 세제 개혁"
 TAT_ultimate_tax_reform_desc: "우리는 대규모 세제 개혁을 단행할 계획이며, 이는 일반 국민의 세 부담은 덜어 주되 기업에는 정반대가 될 것입니다."
 TAT_single_party: "단일 정당"
 TAT_single_party_desc: "타타르스탄 공산당은 국가와 관련된 모든 분야에서 가장 잘 알고 있습니다. 다른 이들이 비켜 준다면 우리는 진정한 공산주의 이상향을 건설하는 일에 착수할 수 있으며, 이번에는 성공할 것입니다."
 TAT_nationalize_foreign_business: "외국 기업 국유화"
 TAT_nationalize_foreign_business_desc: "외국인이 소유한 산업 시설은 언제나 경제 안보의 위험 요소입니다. 외국이 경제 제재로 우리를 위협하는 상황에서, 산업 소유주들이 하룻밤 사이에 떠나면서 시설의 핵심 부품을 가져가 버릴 위험이 항상 존재합니다. 이를 막으려면 외국 정부의 심기를 거스르더라도 이들 산업을 국가의 소유로 가져와야 합니다."
 TAT_five_year_plan: "첫 5개년 계획"
 TAT_five_year_plan_desc: "서방 국가들의 자유 경제 모델은 사회주의 국가의 미래가 될 수 없습니다. 가급적 고전적인 소비에트식 5개년 계획의 형태로 계획 경제로 복귀하면, 정부는 그동안 통제되지 않던 경제에 대해 제약 없는 영향력을 갖게 될 것입니다."
 TAT_reestablish_the_military_industrial_complex: "군산 복합체 재건"
 TAT_reestablish_the_military_industrial_complex_desc: "군대와 인민은 하나다!"
 TAT_nati_start: "타타르 민족주의"
 TAT_nati_start_desc: "민족주의 세력이 나라의 권력을 장악했습니다. 이들은 타타르스탄을 어디로 이끌까요? 더 밝은 미래일까요, 아니면 나라의 붕괴일까요?"
 TAT_socialochka: "사회 지출 확대"
 TAT_socialochka_desc: "출산율을 성공적으로 높이려면 시민들을 위한 더 나은 환경을 조성해야 합니다. 사회 지출을 늘려야 합니다."
 TAT_rojdaemost: "출산율 장려 선전"
 TAT_rojdaemost_desc: "우리나라는 인구 감소를 겪고 있으므로 젊은 가정의 출산율을 장려해야 합니다."
 TAT_debur: "탈관료화"
 TAT_debur_desc: "관료에 대한 지출을 줄이고 그 수를 감축할 것이며, 확보된 자금은 국민을 위해 쓰일 것입니다."
 TAT_patriotism: "애국주의"
 TAT_patriotism_desc: "이제 우리나라에서 애국 교육을 강화할 때입니다."
 TAT_valute: "자체 통화"
 TAT_valute_desc: "정산에서 자체 통화로의 전환을 시작하겠습니다."
 TAT_National_science: "국내 과학"
 TAT_National_science_desc: "타타르 과학의 발전에 자금을 투자하겠습니다."
 TAT_Tatarisation: "타타르화"
 TAT_Tatarisation_desc: "모든 문헌과 모든 명칭은 타타르어로 되어야 합니다."
 TAT_anti_lgbt: "비정상적 관계 선전 금지"
 TAT_anti_lgbt_desc: "우리는 가족, 혼인(남성과 여성의 결합), 모성의 우선 지위와 보호, 그리고 이념과 단체가 가족 문제에 침해하고 개입하는 것으로부터 가족을 보호하는 법을 채택하고 있습니다. 아울러 인간 본성을 보호하고 인간의 자연스러운 본성에 반하는 비정상적 관계의 선전을 금지하는 법의 채택이 제안되었습니다."
 TAT_territorial_reform: "영토 개혁"
 TAT_territorial_reform_desc: "우리 공화국의 영토 구조를 바꾸겠습니다."
 TAT_Sovereign_Internet: "주권 인터넷"
 TAT_Sovereign_Internet_desc: "다른 나라가 우리 시민에게 영향을 미치지 못하도록 우리의 인터넷 공간을 외국으로부터 완전히 독립시켜야 합니다."
 TAT_Democratic_clean: "민주주의자 숙청"
 TAT_Democratic_clean_desc: "우리는 서방의 하수인이 되지 않을 것입니다. 이제 우리나라에서 민주주의자들을 숙청할 때입니다."
 TAT_Communistst_clean: "공산주의자 숙청"
 TAT_Communistst_clean_desc: "소련의 유산은 파괴되어야 합니다. 이제 붉은 전염병의 추종자들을 몰아낼 때입니다."
 TAT_Anti_corruption_law: "반부패법"
 TAT_Anti_corruption_law_desc: "우리는 모든 형태의 부패와 싸울 것입니다."
 TAT_anti_immigration_policies: "반이민 정책"
 TAT_anti_immigration_policies_desc: "더 많은 반이민 정책을 시행하면 타타르 정체성이 온전히 살아 있도록 유지할 수 있습니다."
 TAT_decolectivisation: "탈집단화"
 TAT_decolectivisation_desc: "이제 소련의 유산을 없애고 주민들이 도시로 이주하도록 도울 때입니다."
 TAT_tatar_past: "타타르의 과거"
 TAT_tatar_past_desc: "역사는 바꿀 수 없으며 우리도 그것을 압니다. 우리는 카잔 칸국의 위대한 후계자입니다."
 TAT_constitution_return: "최초의 타타르 헌법 복원"
 TAT_constitution_return_desc: "이제 우리나라에 정상적인 헌법을 복원할 때입니다."
 TAT_true_political_and_national_freedom: "진정한 정치적 자유"
 TAT_true_political_and_national_freedom_desc: "진정한 정치적 자유의 시작은 국내 숙청 과정에서 발생한 황폐함에서 회복하는 것입니다. 이제 앞으로 나아가 우리 국민이 진정으로 바라는 것을 이룰 때입니다."
 TAT_idel_ural: "이델-우랄"
 TAT_idel_ural_desc: "우리는 이 지역의 다른 민족들을 우리 주위로 결집시켜야 하며, 오직 그렇게 해야만 위대함을 이룰 수 있습니다."
 TAT_idel_ural_rus: "러시아의 일부로서의 이델-우랄"
 TAT_idel_ural_rus_desc: "우리는 지역 경제를 새로운 차원으로 끌어올릴 수 있는 완전히 새로운 주체를 러시아에 제안할 준비가 되었습니다."
 TAT_idel_ural_free: "독립 이델-우랄"
 TAT_idel_ural_free_desc: "볼가 지역의 민족들과 함께 우리는 옛 러시아 영토에서 가장 강력한 국가를 건설할 것입니다."
 TAT_liberals_modifier: "타타르스탄 민주주의"
 TAT_liberals_modifier_desc: "우리 공화국은 민주주의를 향해 나아갈 준비가 되었습니다."
 TAT_tatar_kommi_modifier: "공산주의 타타르스탄의 정치"
 TAT_tatar_kommi_modifier_desc: "타타르스탄의 공산주의 정부는 소비에트 시절에 있었던 모든 좋은 것을 선전과 행동 양면에서 적극적으로 되살리려 하고 있습니다."
 TAT_tatarin_nati_modifier: "타타르스탄 국가 정책"
 TAT_tatarin_nati_modifier_desc: "타타르스탄에서 민족주의 세력이 집권하면서 국내외 정책에 큰 영향을 미쳤습니다. 우선 과제는 민족의 권력과 힘, 위대한 과거에 대한 선전, 그리고 잃어버린 타타르의 위대함을 되찾기 위한 수복주의였습니다."
 TAT_fight_burecraci: "관료주의와의 투쟁"
 TAT_soc_medical: "타타르스탄 사회 정책"
 TAT_anti_lgbtqa_stance: "반LGBT 정책"
 TAT_kazan_kahanate: "카잔 칸국의 정신"
 TAT_inet: "타타르 인터넷"
 TAT_anti_corruption: "반부패 정책"
 TAT_new_roads: "신규 도로"
 TAT_bashkiria_indep: "타타르스탄의 특수 지위"
 TAT_bashkiria_indep_desc: "소련 붕괴 이후 많은 시간이 흘렀지만, 타타르스탄과 달리 많은 공화국이 독립을 거부했습니다. 우리는 여전히 다른 공화국들 사이에서 특수한 지위를 지니고 있습니다."
 TAT_tatneft_idea: "타트네프트"
 TAT_full_social_support: "보건 정책의 결과"
 TAT_industry: "산업 발전"
 TAT_agro: "농업 복합체 발전"
 TAT_five_year_plans: "5개년 계획"
 TAT_clean_soc_net: "소셜 네트워크 정화"
 TAT_vpk: "[TAT.GetFlag]타타르스탄 군산 복합체"
 TAT_vpk_desc: "타타르스탄 영토에 위치한 군수 산업 기업들의 네트워크입니다."
 TAT_develop_turism: "관광 개발"
 TAT_reactioners: "클러스터 경제"
 TAT_help_farmers: "타타르 군산 복합체"
 TAT_react_start: "새 천년에"
 TAT_react_start_desc: "타타르스탄은 러시아의 모든 구성 주체 중 1990년대를 비교적 평온하게 넘긴 유일한 곳입니다. 이제 우리는 이 성공을 발판으로 삼을 준비가 되었습니다."
 TAT_react_corruption: "반부패 투쟁"
 TAT_react_corruption_desc: "우리 공화국에 남은 마지막 부패의 온상을 없애겠습니다."
 TAT_react_energo: "에너지 투자"
 TAT_react_energo_desc: "경제 성장에는 튼튼한 에너지가 필요합니다. 우리는 에너지에 투자하는 데 비용을 아끼지 않겠습니다."
 TAT_react_soc: "사회경제 프로그램"
 TAT_react_soc_desc: "인적 자원은 우리 경제 발전의 원천입니다. 우리는 사회적 보장을 통해 이를 촉진합니다."
 TAT_react_power_support: "최대 산업 지원"
 TAT_react_power_support_desc: "우리 공화국 예산의 근간을 이루는 대기업들을 지원하겠습니다."
 TAT_react_obrazovanie: "교육 개혁"
 TAT_react_obrazovanie_desc: "교양 있는 시민이 성공하는 시민입니다. 우리는 시민의 지적 잠재력 개발에 투자하겠습니다."
 TAT_react_transport: "교통 개혁"
 TAT_react_transport_desc: "접근 가능한 교통수단이 우리 공화국 전역에서 이용 가능해야 합니다."
 TAT_react_small_upor: "소기업 지원"
 TAT_react_small_upor_desc: "우리의 과제는 우리 경제의 엔진인 소기업에서 성장하는 것입니다."
 TAT_react_smart_it: "스마트 IT"
 TAT_react_smart_it_desc: "우리 경제의 주요 방향 중 하나는 IT 부문입니다. 기술의 도움으로 우리 경제의 성장을 몇 배로 키우겠습니다."
 TAT_react_zdorvoie: "보건 개혁"
 TAT_react_zdorvoie_desc: "건강한 시민이 성공하는 시민입니다. 우리는 모든 시민이 더 건강해지도록 기여합니다."
 TAT_react_smart_obrazovanie: "스마트 교육"
 TAT_react_smart_obrazovanie_desc: "교육 분야에 IT 기술을 도입하겠습니다."
 TAT_react_all_religion: "모든 종교에 대한 존중"
 TAT_react_all_religion_desc: "우리 공화국은 종교적 증오의 거점이 되지 않을 것입니다. 우리는 모든 신앙의 대표자를 환영합니다."
 TAT_react_finance: "금융 부문 투자"
 TAT_react_finance_desc: "우리의 경제 개혁이 결실을 맺었으며, 이제 금융 부문이 번성하고 경제는 계속 성장할 것입니다."
 TAT_react_energy_ustoichiva: "에너지 지속 가능 경제"
 TAT_react_energy_ustoichiva_desc: "에너지는 우리의 발전 전략에서 결코 뒷전이 되지 않을 것이며, 우리 경제의 에너지 부문을 계속 강화하겠습니다."
 TAT_react_umnaya_medicina: "스마트 의료"
 TAT_react_umnaya_medicina_desc: "효율을 높이기 위해 우리의 IT 기술을 의료 분야에 도입하겠습니다."
 TAT_react_claster_activation: "효율적인 클러스터 경제"
 TAT_react_claster_activation_desc: "우리의 집중 투자 성과가 가시화되었습니다."
 SOV_Sovfed_category: "연방회의"
 SOV_Sovfed_category_desc: "£text_icon_rusgerb §YThe Federation Council§!, is the upper house of the Federal Assembly of [SOV.GetFlag]§YRussia§!, according to the 1993 Constitution of the [SOV.GetFlag]§YRussian Federation§!. The Federation Council is a chamber of regions in which representatives of the regions represent their interests at the federal level, which reflects the federal principle of the [SOV.GetFlag]§YRussian state§!. As an institution for the integration and consolidation of regions, §Ythe Federation Council§! is called upon to ensure a balance of federal and regional interests when making decisions aimed at implementing the country's strategic development goals. §YThe Federation Council§! is formed and structured according to a non-partisan principle. Senators do not create factions and party associations.\n\nIf you want to §Gannex§! a §YSubject§!, it is necessary to have §Y40% influence§! on it"
 BSH_subject_aes: "§Y바시키르 원전§! 건설 허가 요청"
 BSH_unite_idel_ural: "§Y이델-우랄§! 창설 요청"
 TAT_unite_idel_ural: "§Y이델-우랄§! 창설 요청"
 CHE_attack_geo: "§Y[GEO.GetNameWithFlag]§! 공격 제안"
 CHE_attack_ukr: "§Y[UKR.GetNameWithFlag]§! 공격 제안"
 CHE_bund_sil: "§Y[POL.GetNameWithFlag]§!에서 분리주의 반란 조직"
 CHE_attack_blr: "§Y[BLR.GetNameWithFlag]§! 공격 제안"
 CHE_attack_pol: "§Y[POL.GetNameWithFlag]§! 공격 제안"
 CHE_unite_ing_last: "§Y체첸-잉구셰티야 공화국§! 창설 요청"
 subject_rus.5.t: "[BSH.GetNameWithFlag] 원자력 발전소"
 subject_rus.5.d: "바시키르 원전은 지난 세기에 중단된 소련의 사업입니다. 이제 [BSH.GetNameWithFlag]이(가) 이 사업을 되살려 완공해 달라고 요청하고 있습니다. 수락하시겠습니까?"
 subject_rus.5.a: "Of Course"
 subject_rus.5.b: "안된다"
 subject_rus.6.t: "[BSH.GetNameWithFlag] 원자력 발전소"
 subject_rus.6.d: "[SOV.GetNameWithFlag]이(가) 우리 영토의 바시키르 원전을 되살려 완공하는 데 동의했습니다."
 subject_rus.6.a: "훌륭하군!"
 subject_rus.7.t: "[BSH.GetNameWithFlag] 원자력 발전소"
 subject_rus.7.d: "[SOV.GetFlag]러시아 정부는 바시키르 원전 건설이 나중으로 미룰 수 있는 사업이라고 판단하여 거절했습니다."
 subject_rus.7.a: "Sad"
 subject_rus.8.t: "[BSH.GetNameWithFlag], 이델-우랄 창설 요청"
 subject_rus.8.d: "[BSH.GetFlag]바시키르 정부가 타타르스탄과 바시키리야를 이델 우랄이라는 단일 주체로 통합하는 법안을 제출했습니다. 국내 국경을 이렇게 급진적으로 바꿀 준비가 되어 있습니까?"
 subject_rus.8.a: "Of Course"
 subject_rus.8.b: "안된다"
 subject_rus.9.t: "[BSH.GetNameWithFlag], 이델-우랄 창설 요청"
 subject_rus.9.d: "[SOV.GetFlag]러시아 정부가 우리 공화국과 타타르스탄의 통합 법안을 채택하기로 동의했습니다."
 subject_rus.9.a: "훌륭하군!"
 subject_rus.10.t: "[BSH.GetNameWithFlag], 이델-우랄 창설 요청"
 subject_rus.10.d: "[SOV.GetFlag]러시아 정부가 이델 우랄 지역 창설 법안을 거부했습니다."
 subject_rus.10.a: "Sad"
 subject_rus.13.t: "[FROM.GetNameWithFlag], 보조금 요청"
 subject_rus.13.d: "[FROM.GetNameWithFlag] 정부가 자국 예산을 위한 보조금을 우리에게 요청했습니다. 보조금을 배정할 준비가 되어 있습니까?"
 subject_rus.13.a: "찬성"
 subject_rus.13.b: "안된다"
 subject_rus.14.t: "연방 예산 보조금"
 subject_rus.14.d: "[SOV.GetNameWithFlag]이(가) 연방 예산에서 우리에게 자금을 지원하기로 동의했습니다."
 subject_rus.14.a: "니스"
 subject_rus.15.t: "연방 예산 보조금"
 subject_rus.15.d: "[SOV.GetNameWithFlag]이(가) 연방 예산에서 우리에게 자금을 배정하는 것을 거부했습니다."
 subject_rus.15.a: "슬프군"
 subject_rus.16.t: "[FROM.GetNameWithFlag], USAID 가입 희망"
 subject_rus.16.d: "벨라루스 정부가 USAID 프로그램 가입을 요청해 왔습니다. 이에 긍정적으로 응답할 준비가 되어 있습니까?"
 subject_rus.16.a: "그들의 요청을 승인한다"
 subject_rus.16.b: "안된다"
 subject_rus.17.t: "[BSH.GetNameWithFlag], 이델-우랄 창설 요청"
 subject_rus.17.d: "[BSH.GetNameWithFlag] 정부가 타타르스탄과 바시키리야를 이델 우랄이라는 단일 주체로 통합하는 법안을 제출했습니다. 국내 국경을 이렇게 급진적으로 바꿀 준비가 되어 있습니까?"
 subject_rus.17.a: "Of Course"
 subject_rus.17.b: "안된다"
 subject_rus.18.t: "[BSH.GetNameWithFlag], 이델-우랄 창설 요청"
 subject_rus.18.d: "[SOV.GetFlag]러시아 정부가 우리 공화국과 타타르스탄의 통합 법안을 채택하기로 동의했습니다."
 subject_rus.18.a: "훌륭하군!"
 subject_rus.19.t: "[TAT.GetNameWithFlag], 이델-우랄 창설 요청"
 subject_rus.19.d: "[SOV.GetFlag]러시아 정부가 이델 우랄 지역 창설 법안을 거부했습니다."
 subject_rus.19.a: "Sad"
 subject_rus.22.t: "타트네프트, 석유 투자 제안"
 subject_rus.22.d: "[TAT.GetFlag]타타르스탄의 타트네프트가 석유 부문에 대한 투자를 제안했습니다."
 subject_rus.22.a: "투자를 승인한다"
 subject_rus.22.b: "아니, 우리에겐 필요 없다"
 subject_rus.23.t: "타트네프트의 석유 투자"
 subject_rus.23.d: "§Y[FROM.GetNameWithFlag]§!이(가) 우리의 석유 투자에 동의했습니다."
 subject_rus.23.a: "좋아"
 subject_rus.25.t: "[FROM.GetNameWithFlag], 최후통첩"
 subject_rus.25.d: "국내의 불안정한 정세로 인해 [FROM.GetNameWithFlag] 정부가 우리 정부에 최후통첩을 제시하여 우리를 놀라게 했습니다. 그들의 요구를 받아들이든가, 그렇지 않으면 그들이 우리 국가의 일부이기를 그만두게 될 것입니다."
 subject_rus.25.a: "그들을 진압한다"
 subject_rus.25.b: "그들의 자치를 확대한다"
 subject_rus.27.t: "바시키르 투자"
 subject_rus.27.d: "§Y[BSH.GetNameWithFlag]§! 정부가 우리 지역 한 곳에 대한 농공업 투자를 제안하고 있습니다. 수락하시겠습니까?"
 subject_rus.27.a: "찬성"
 subject_rus.27.b: "안된다"
 subject_rus.28.t: "§Y[CHI.GetNameWithFlag]§!과의 협정"
 subject_rus.28.d: "§Y[CHI.GetNameWithFlag]§! 정부가 우리 공화국과의 협력 협정을 승인했습니다."
 subject_rus.28.a: "니스"
 subject_rus.29.t: "§Y[CHI.GetNameWithFlag]§!과의 협정"
 subject_rus.29.d: "§Y[CHI.GetNameWithFlag]§! 정부가 우리 공화국과의 협력 협정을 승인하지 않았습니다."
 subject_rus.29.a: "슬프군"
 subject_rus.33.t: "[CHE.GetNameWithFlag], 체첸-잉구셰티야 공화국 창설 요청"
 subject_rus.33.d: "[SOV.GetFlag]러시아 정부가 체첸-잉구셰티야 공화국 창설 법안을 거부했습니다."
 subject_rus.33.a: "Sad"
 subject_rus.32.t: "[CHE.GetNameWithFlag], 체첸-잉구셰티야 공화국 창설 요청"
 subject_rus.32.d: "[CHE.GetNameWithFlag] 정부가 체첸과 잉구셰티야를 체첸-잉구셰티야 공화국이라는 단일 주체로 통합하는 법안을 제출했습니다. 국내 국경을 이렇게 급진적으로 바꿀 준비가 되어 있습니까?"
 subject_rus.32.a: "Of Course"
 subject_rus.32.b: "안된다"
 subject_rus.34.t: "[CHE.GetNameWithFlag], 체첸-잉구셰티야 공화국 창설 요청"
 subject_rus.34.d: "[SOV.GetFlag]러시아 정부가 우리 공화국과 잉구셰티야의 통합 법안을 채택하기로 동의했습니다."
 subject_rus.34.a: "훌륭하군!"
