 artsakh_focus: "Árvore de Foco de Artsakh"
 arm_expansion.1.t: "[ARM.GetNameWithFlag] nos Convida para uma Aliança"
 arm_expansion.1.d: "[ARM.GetNameWithFlag] nos oferece uma aliança para que, juntos, possamos conter o expansionismo de [TUR.GetNameWithFlag]"
 arm_expansion.1.a: "[TUR.GetNameWithFlag] não resistirá ao nosso poder"
 arm_expansion.1.b: "Desculpe, mas adoramos kebabs"
 arm_expansion.2.t: "[ARM.GetNameWithFlag] nos Convida para uma Aliança"
 arm_expansion.2.d: "[ARM.GetNameWithFlag] nos oferece uma aliança para que, juntos, possamos conter o expansionismo de [TUR.GetNameWithFlag]"
 arm_expansion.2.a: "[TUR.GetNameWithFlag] não resistirá ao nosso poder"
 arm_expansion.2.b: "Desculpe, mas adoramos kebabs"
 arm_expansion.3.t: "[ARM.GetNameWithFlag] nos Convida para uma Aliança"
 arm_expansion.3.d: "[ARM.GetNameWithFlag] nos oferece uma aliança para que, juntos, possamos conter o expansionismo de [TUR.GetNameWithFlag]"
 arm_expansion.3.a: "[TUR.GetNameWithFlag] não resistirá ao nosso poder"
 arm_expansion.3.b: "Desculpe, mas adoramos kebabs"
 arm_expansion.4.t: "[ARM.GetNameWithFlag] Exige Justiça Histórica"
 arm_expansion.4.d: "Se não houver resposta positiva de nossa parte, eles lançarão a Operação \"Crescente Quebrado\"."
 arm_expansion.4.a: "Não temos outra escolha..."
 arm_expansion.4.b: "Esta é a nossa chance de restaurar a grandeza do Império Otomano!"
 arm_expansion.5.t: "A Armênia Renuncia a Artsakh"
 arm_expansion.5.d: "Reconhecemos oficialmente a renúncia total de nossas reivindicações sobre Nagorno-Karabakh"
 arm_expansion.5.a: "Tudo em nome de nossos parceiros estrangeiros"
 arm_expansion.6.t: "[ARM.GetNameWithFlag] Quer Estabelecer Laços Amistosos Conosco"
 arm_expansion.6.d: "Eles acreditam que é hora de esquecer velhas rixas e conflitos e começar a caminhar juntos rumo a um futuro mais brilhante"
 arm_expansion.6.a: "Todos nós cometemos erros"
 arm_expansion.6.b: "Esqueçam essa história de amizade conosco"
 arm_expansion.7.t: "[ARM.GetNameWithFlag] Nos Pede Investimentos"
 arm_expansion.7.d: "[ARM.GetNameWithFlag] nos pede para investir em sua infraestrutura e, em troca, torna-se nosso centro comercial"
 arm_expansion.7.a: "Sempre ficamos felizes em ajudar"
 arm_expansion.7.b: "Eles não são mais capazes de nos ser úteis"
 arm_expansion.8.t: "[FROM.GetNameWithFlag] Concorda em Investir em Nosso País"
 arm_expansion.8.d: "Felizmente conseguimos convencer [FROM.GetNameWithFlag] a investir em nós"
 arm_expansion.8.a: "Bom"
 arm_expansion.9.t: "[FROM.GetNameWithFlag] Recusou-se a Investir em Nosso País"
 arm_expansion.9.d: "Parece que [FROM.GetNameWithFlag] não tem mais interesse em cooperar conosco."
 arm_expansion.9.a: "Ruim"
 arm_expansion.10.t: "[ARM.GetNameWithFlag] Nos Oferece um Corredor de Zangezur até Nakhichevan"
 arm_expansion.10.d: "Como parte dos novos arranjos, [ARM.GetNameWithFlag] nos oferece um corredor até Nakhichevan. Isso deve afastar novos conflitos entre nossos países"
 arm_expansion.10.a: "Nosso Sonho Prevaleceu!"
 arm_expansion.10.b: "Não, nós amamos a Armênia"
 arm_expansion.11.t: "[AZE.GetNameWithFlag] Concorda em Desmilitarizar Syunik"
 arm_expansion.11.d: "Agora que desmilitarizamos Syunik e entregamos o controle do corredor para Nakhichevan a [AZE.GetNameWithFlag], a guerra nunca mais chegará ao nosso país"
 arm_expansion.11.a: "Tudo pela amizade com nossos parceiros!"
 arm_expansion.12.t: "[AZE.GetNameWithFlag] Recusa Nossa Proposta"
 arm_expansion.12.d: "Logo após a rejeição de [AZE.GetNameWithFlag] à nossa oferta, uma série de grandes protestos ocorreu em Baku"
 arm_expansion.12.a: "Talvez seja melhor assim"
 arm_expansion.13.t: "[TUR.GetNameWithFlag] Concorda"
 arm_expansion.13.d: "[FROM.GetNameWithFlag] concorda em renovar as relações diplomáticas conosco."
 arm_expansion.13.a: "Juntos somos fortes"
 arm_expansion.14.t: "[TUR.GetNameWithFlag] Recusa-se a Retomar os Laços Diplomáticos Conosco"
 arm_expansion.14.d: "[TUR.GetNameWithFlag] aceitou nossa recusa às exigências de reconhecer os crimes de guerra de [TUR.GetNameWithFlag] na Primeira Guerra Mundial, mas não retomará os laços diplomáticos conosco"
 arm_expansion.14.a: "Tanto faz"
 ARM_turkey_compliance_idea: "Governo da Armênia Ocidental"
 ARM_shadow_of_sevres: "Sombra do Tratado de Sèvres"
 ARM_shadow_of_sevres_desc: "O Tratado de Sèvres é um dos tratados do sistema Versalhes-Washington, cuja criação marcou o fim da Primeira Guerra Mundial. Foi assinado em 10 de agosto de 1920 em Sèvres (França) pelos países da Entente e pelos Estados que se juntaram a eles, de um lado, e pelo governo do Império Otomano, de outro. O tratado não entrou em vigor porque a Grande Assembleia Nacional Turca se recusou a ratificá-lo. Foi substituído três anos depois pelo Tratado de Lausanne, que fixou as fronteiras da Turquia em sua forma atual."
 ARM_active_diplomacy: "Diplomacia Ativa"
 ARM_active_diplomacy_desc: "Devemos desempenhar um papel de liderança na política regional, e nossa tarefa fundamental para alcançar esse objetivo será derrotar o principal mal do Cáucaso: a Turquia"
 ARM_west_arm_gov: "Contatar o Governo da Armênia Ocidental"
 ARM_west_arm_gov_desc: "A República da Armênia Ocidental, também conhecida como Estado da Armênia, é um governo no exílio que reivindica soberania sobre partes das terras altas armênias, incluindo seções da Armênia Ocidental, bem como Nakhichevan e, às vezes, também Nagorno-Karabakh. O país autoproclamado afirma ter sua própria presidência, governo, parlamento, constituição, hino nacional e brasão de armas"
 ARM_agree_with_greece: "Restaurar a Grande Ideia"
 ARM_agree_with_greece_desc: "No momento, [TUR.GetNameWithFlag] detém vastos territórios que pertencem por direito a [GRE.GetNameWithFlag]. Convidaremos a Grécia a se juntar à nossa coalizão para recuperar o que foi perdido"
 ARM_negotiate_syria: "Negociações com [SYR.GetNameWithFlag]"
 ARM_negotiate_syria_desc: "Algumas das terras ancestrais de [SYR.GetNameWithFlag] também estão sob controle turco. No entanto, [SYR.GetNameWithFlag] está em posição estratégica vulnerável diante de uma possível invasão vinda do norte"
 ARM_negotiate_kurds: "Negociações com [KUR.GetNameWithFlag]"
 ARM_negotiate_kurds_desc: "Por muitas décadas, os curdos tentam estabelecer seu próprio Estado independente que una todo o povo curdo. Então vamos ajudá-los nesse empreendimento"
 ARM_return_to_western_armenia: "Retorno à Armênia Ocidental"
 ARM_return_to_western_armenia_desc: "É hora de recuperar o que foi perdido e libertar o Cáucaso e a Ásia Menor do colonialismo turco"
 ARM_land_of_peace: "Terra da Paz"
 ARM_land_of_peace_desc: "A experiência passada mostrou que somos incapazes de recuperar nossos territórios. Agora vale a pena repensar nossa política externa e tentar estabelecer relações com nossos vizinhos islâmicos."
 ARM_ussr_success_const: "Herança da RSS da Armênia"
 ARM_ussr_success_const_desc: "Para estabelecer laços amistosos com nossos vizinhos, nos reconhecemos como sucessores da RSS da Armênia, confirmando assim a integridade territorial de todas as outras RSSs, incluindo [AZE.GetNameWithFlag]"
 ARM_normalize_relations_with_turkey: "Normalizar as Relações com a Turquia"
 ARM_normalize_relations_with_turkey_desc: "A principal razão do longo conflito entre Turquia e Armênia foram os crimes de guerra da Turquia na Armênia Ocidental. No entanto, não temos mais interesse nisso, dado que se passaram mais de meio século desde aquela época."
 ARM_crossroad_of_peace: "Encruzilhada da Paz"
 ARM_crossroad_of_peace_desc: "Como país neutro que mantém boas relações com nossos vizinhos, ofereceremos a eles investimento em nossa economia"
 ARM_zang_corr_question: "A Questão do Corredor de Zangezur"
 ARM_zang_corr_question_desc: "De acordo com nossa nova política pacífica, não temos mais interesse em desenvolver militarmente Syunik. E embora seja uma artéria-chave que bloqueia o acesso do Azerbaijão ao seu exclave de Nakhichevan, além de nos fornecer uma rota terrestre para suprimentos militares iranianos, não pretendemos mais usar essa região para pressionar o Azerbaijão"
 ARM_anatolian_heritage: "Herança Anatólia"
 ARM_anatolian_heritage_desc: "É necessário iniciar o intercâmbio cultural, econômico, político e científico entre nossos países, para estabilizar ainda mais nossas relações"
 ARM_kazah_cooperation_idea: "Cooperação [KAZ.GetNameWithFlag] - [ARM.GetNameWithFlag]"
 ARM_shirvan_deal: "Oferecer a [PER.GetNameWithFlag] uma Troca Territorial"
 arme.174.t: "[ARM.GetNameWithFlag] Oferece Troca Territorial"
 arme.174.d: "Recentemente, a Armênia nos propôs trocar territórios: nossa província de Khoy, onde vivem predominantemente curdos iranianos, pelo território habitado por persófonos, a província de Shirvan. Devemos aceitar?"
 arme.174.a: "Claro, por que não!"
 arme.174.b: "Isso é algum tipo de conspiração?"
 arme.175.t: "[PER.GetNameWithFlag] Nega a Troca Territorial!"
 arme.175.d: "O Irã não quer nos transferir Khoy em troca de Shirvan."
 arme.175.a: "Eles vão pagar por isso."
 ARM_turkey_negotiations: "Negociações com [TUR.GetNameWithFlag]"
 ARM_turkey_negotiations_desc: "Desde a nossa independência, a Turquia tem sido um grande obstáculo ao comércio com a Europa. Talvez possamos normalizar nossas relações com eles e abrir as fronteiras."
 arme.176.t: "Nossa Posição sobre as Negociações com [TUR.GetNameWithFlag]"
 arme.176.d: "É hora de definir nossa posição sobre as negociações com a Turquia. Devemos começar a tentar normalizar as relações e abrir as fronteiras ou devemos esquecer essa ideia?"
 arme.176.a: "Avisar a Turquia de que estamos prontos para conversar."
 arme.176.b: "Abandonar essa ideia estúpida."
 arme.177.t: "[ARM.GetNameWithFlag] Quer Normalizar as Relações!"
 arme.177.d: "Recentemente, a Armênia nos enviou uma proposta diplomática para normalizar e regular as relações. A longo prazo, a parceria mútua e a abertura das fronteiras podem trazer benefícios para ambos os lados. No entanto, a Armênia exige de nossa parte o reconhecimento do Genocídio no Império Otomano. Muitos ativistas nacionalistas acreditam que o reconhecimento pode levar a reivindicações territoriais ou reparações econômicas. No entanto, a própria Armênia nega tais alegações."
 arme.177.a: "Estamos prontos para normalizar, mas precisamos discutir alguns pontos."
 arme.177.b: "Primeiro eles terão de resolver o conflito de Nagorno-Karabakh."
 arme.177.c: "Como ousam sequer pensar em falar conosco!"
 arme.178.t: "[TUR.GetNameWithFlag] Nos Pede para Abandonar as Alegações de Genocídio!"
 arme.178.d: "A Turquia recebeu nossa proposta, mas quer que abandonemos as alegações e o reconhecimento do genocídio. O que devemos dizer a eles?"
 arme.178.a: "Exigir justiça não é o mesmo que exigir reparações e reivindicações territoriais."
 arme.178.b: "Podemos abrir mão de nossas aspirações, claro."
 arme.179.t: "[ARM.GetNameWithFlag] Concorda!"
 arme.179.d: "A Armênia concordou em abandonar suas alegações sobre o genocídio e agora está totalmente pronta para normalizar as relações e abrir as fronteiras ao comércio."
 arme.179.a: "Maravilhoso!"
 turkish_relat_negotated: "Relações Armênio-Turcas Normalizadas"
 arme.180.t: "[ARM.GetNameWithFlag] Insiste!"
 arme.180.d: "A Armênia afirma mais uma vez que não tem intenção de reivindicar nenhum território da Turquia. Pelo contrário, museus da paz e da história poderiam ser construídos para condenar a história sangrenta e redimir o Estado turco do passado otomano. A Armênia insiste que quer fomentar as relações comerciais e políticas, não uma agenda irredentista."
 arme.180.a: "Vamos reconhecer as atrocidades do passado e construir um novo futuro."
 arme.180.b: "Eles querem nos humilhar. Isso é inaceitável."
 arme.181.t: "[TUR.GetNameWithFlag] Reconhece o Genocídio Armênio!"
 arme.181.d: "A Turquia aceitou recentemente reconhecer o genocídio de 1915 no Império Otomano e normalizou as relações conosco."
 arme.181.a: "Deus abençoe!"
 arme.182.t: "[TUR.GetNameWithFlag] Recusa-se a Normalizar as Relações!"
 arme.182.d: "A Turquia abandonou recentemente todos os esforços diplomáticos para normalizar as relações conosco. Nenhuma outra conexão será estabelecida."
 arme.182.a: "Eles nunca mudam."
 arme.183.t: "Oposição ao Antigo Governo"
 arme.183.d: "A mudança radical de poder em nosso país não passou despercebida. Apoiadores do governo anterior organizaram uma poderosa campanha de oposição contra nós, testando a força e a estabilidade de nosso governo."
 arme.183.a: "O tempo deles acabou."
 arme.184.t: "Oposição ao Antigo Governo"
 arme.184.d: "A mudança radical de poder em nosso país não passou despercebida. Apoiadores do governo anterior organizaram uma poderosa campanha de oposição contra nós, testando a força e a estabilidade de nosso governo."
 arme.184.a: "O tempo deles acabou."
 arme.185.t: "Oposição ao Antigo Governo"
 arme.185.d: "A mudança radical de poder em nosso país não passou despercebida. Apoiadores do governo anterior organizaram uma poderosa campanha de oposição contra nós, testando a força e a estabilidade de nosso governo."
 arme.185.a: "O tempo deles acabou."
 arme.186.t: "Oposição ao Antigo Governo"
 arme.186.d: "A mudança radical de poder em nosso país não passou despercebida. Apoiadores do governo anterior organizaram uma poderosa campanha de oposição contra nós, testando a força e a estabilidade de nosso governo."
 arme.186.a: "O tempo deles acabou."
 arme.187.t: "Protestos nas Regiões"
 arme.187.d: "A instabilidade política também abalou nossos fantoches. Os Estados sob nosso controle estão tomados por protestos antiarmênios, e devemos lidar com isso rapidamente."
 arme.187.a: "Maldição"
 arme.188.t: "A Armênia Pede Armas"
 arme.188.d: "A Armênia, como membro pleno da OTAN, lançou um programa de rearmamento e agora nos pede que forneçamos certas armas para seu exército reformado."
 arme.188.a: "Daremos as armas"
 arme.188.b: "Não"
 arme.189.t: "Armas da OTAN"
 arme.189.d: "[FROM.GetNameWithFlag] concordou em nos fornecer armas para reequipar nosso exército."
 arme.189.a: "Ótimo"
 arme.190.t: "Armas da OTAN"
 arme.190.d: "[FROM.GetNameWithFlag] recusou-se a nos fornecer armas para reequipar nosso exército."
 arme.190.a: "Triste"
 arme.223.t: "A Rebelião no Azerbaijão"
 arme.223.d: "Os separatistas azerbaijanos aproveitaram-se de nossos serviços especiais despreparados e de nosso pequeno exército e lançaram uma insurreição armada na tentativa de libertar seu país de nosso domínio."
 arme.223.a: "Ah, não"
 arme.224.t: "A Rebelião em Kuban"
 arme.224.d: "Nossas ações em Kuban não ficaram sem consequências: o povo de Kuban se levantou contra nós, anunciou a criação da República de Kuban e começou a formar grupos armados para nos combater."
 arme.224.a: "Ah, não"
 arme.225.t: "A Rebelião no Daguestão"
 arme.225.d: "Nossas ações no Daguestão não ficaram sem consequências: o povo do Daguestão se levantou contra nós, anunciou a criação da República do Daguestão e começou a formar grupos armados para nos combater."
 arme.225.a: "Ah, não"
 arme.226.t: "A Rebelião na Geórgia"
 arme.226.d: "Nossas ações na Geórgia não ficaram sem consequências; o povo georgiano se rebelou contra nós e quer se libertar de nossa ocupação. Agora temos de lidar com uma rebelião georgiana organizada."
 arme.226.a: "Ah, não"
 arme.227.t: "A Rebelião na Abecásia"
 arme.227.d: "Nossas ações na Abecásia não ficaram sem consequências; o povo abecásio se rebelou contra nós e quer se libertar de nossa ocupação. Agora temos de lidar com uma rebelião abecásia organizada."
 arme.227.a: "Ah, não"
 arme.228.t: "A Rebelião no Curdistão"
 arme.228.d: "Nossas ações no Curdistão não ficaram sem consequências; o povo curdo se rebelou contra nós e quer se libertar de nossa ocupação. Agora temos de lidar com uma rebelião curda organizada."
 arme.228.a: "Ah, não"
 arme.229.t: "A Rebelião em Djavakheti"
 arme.229.d: "Os moradores de Djavakheti ficaram extremamente chocados com nossa política em relação a Artsakh e com nosso abandono dessas terras. Nesse contexto, um grupo de militares radicais chegou a organizar uma rebelião, declarando nosso governo ilegal e antiarmênio."
 arme.229.a: "Ah, não"
 arme.230.t: "Autonomia do Talyshstan"
 arme.230.d: "O governo do Talyshstan emitiu um ultimato ao nosso governo, expressando feroz desobediência às nossas ambições políticas de subjugar completamente essas terras à nação armênia. Eles exigem autonomia dentro do nosso Estado ou pretendem defender sua independência de arma em punho."
 arme.230.a: "Sem autonomia"
 arme.230.b: "Vamos dar-lhes autonomia"
 arme.231.t: "Protestos contra um Exército Fraco"
 arme.231.d: "A insurreição armada iniciada contra nós provocou uma onda de protestos em todo o país. As pessoas estão insatisfeitas com a fraqueza de nossas forças armadas e exigem mais financiamento para o nosso exército"
 arme.231.a: "E o que eles vão comer?"
 ARM_repatriate_armenians: "§GRepatriar§! §YArmênios§! para [ARM.GetNameWithFlag]"
 first_repat_done: "Primeira Repatriação Concluída"
 second_repat_done: "Segunda Repatriação Concluída"
 third_repat_done: "Terceira Repatriação Concluída"
 four_repat_done: "Quarta Repatriação Concluída"
 effect_app_if_migr_lev_tt: "§YO Efeito Desta Decisão Aparecerá Quando Atingirmos Pelo Menos um Nível Baixo de Emigração§!"
 ARM_ask_diaspora_invest: "Pedir à §YDiáspora§! que §GInvista§! em [ARM.GetNameWithFlag]"
 ARM_fix_water_yerevan: "Consertar as Tubulações de Água em §YErevan§!"
 ARM_fix_water_gegharkunik: "Consertar as Tubulações de Água em §YGegharkunik-Tavush§!"
 ARM_fix_water_syunik: "Consertar as Tubulações de Água em §YSyunik§!"
 arme.191.t: "A Oposição Tenta o Impeachment de Kocharyan!"
 arme.191.d: "Os líderes da oposição formaram uma coalizão e, além de protestar, agora tentam destituir Kocharyan de seu cargo presidencial. Tudo depende agora de quão leais as elites governamentais são a Kocharyan."
 arme.191.a: "Maldição!"
 arme.191.b: "Eles não tinham chance."
 oppos_killed: "Oposição Eliminada"
 oppos_lived: "Oposição Sobrevive"
 arme.192.t: "Raffi Hovhannisyan Cria o Partido Herança!"
 arme.192.d: "Recentemente, o partido nacional-liberal Herança foi criado na Armênia. Foi fundado pelo primeiro Ministro das Relações Exteriores da Armênia, Raffi Hovhannisyan, que ocupou o cargo sob Levon Ter-Petrosyan nos anos 90. O partido considera sua tarefa principal a formação de um Estado democrático de direito desenvolvido, que construa a política interna e externa com base em seu interesse soberano nacional."
 arme.192.a: "Um novo jogador?"
 ARM_protests: "Protestos da Oposição"
 arme.193.t: "Protestos da Oposição!"
 arme.193.d: "Demirchyan iniciou um protesto exigindo a aposentadoria das autoridades na Praça da Liberdade e depois começou uma marcha até o Palácio Presidencial, mas a polícia bloqueou a rua diante da Assembleia Nacional."
 arme.193.a: "Reprimi-los à força."
 arme.194.t: "Soldado Armênio Assassinado na Hungria!"
 arme.194.d: "Na Hungria, durante um exercício conjunto de países parceiros da OTAN, no qual participaram soldados armênios e azerbaijanos, o militar armênio Gurgen Margaryan foi morto. Desde 11 de janeiro de 2004, Margaryan participava de um curso de inglês de três meses do programa Parceria para a Paz da OTAN em Budapeste. Na madrugada de 19 de fevereiro, ele foi morto. O assassino, o oficial azerbaijano Ramil Safarov, golpeou o rosto do oficial armênio adormecido 16 vezes com um machado, quase separando sua cabeça do corpo. Safarov foi detido, mas seu futuro ainda é bastante incerto. Não se sabe se ele será deportado para o Azerbaijão ou não."
 arme.194.a: "Que ato bárbaro!"
 arme.194.b: "Bom trabalho! Devemos conceder-lhe o título de herói!"
 arme.195.t: "[AZE.GetNameWithFlag] Nos Paga para Libertar Safarov!"
 arme.195.d: "Na Hungria, durante um exercício conjunto de países parceiros da OTAN, no qual participaram soldados armênios e azerbaijanos, o militar armênio Gurgen Margaryan foi morto. Desde 11 de janeiro de 2004, Margaryan participava de um curso de inglês de três meses do programa Parceria para a Paz da OTAN em Budapeste. Na madrugada de 19 de fevereiro, ele foi morto. O assassino, o oficial azerbaijano Ramil Safarov, golpeou o rosto do oficial armênio adormecido 16 vezes com um machado, quase separando sua cabeça do corpo. Safarov foi detido, mas seu futuro ainda é bastante incerto. Não se sabe se ele será deportado para o Azerbaijão ou não."
 arme.195.a: "Dinheiro é sempre bom!"
 arme.196.t: "90 Anos do Genocídio Armênio"
 arme.196.d: "Hoje, o país está de luto pelo 90º aniversário do genocídio de armênios, gregos e assírios na Turquia otomana. Milhões de armênios ao redor do mundo expressam solidariedade conosco, assim como os líderes de muitos países que reconheceram os crimes otomanos contra a humanidade."
 arme.196.a: "Que as vítimas descansem em paz."
 arme.197.t: "Criação do Comitê de Pesquisa do Genocídio"
 arme.197.d: "Hoje, autoridades do governo, representantes do Museu do Genocídio e representantes da Diáspora e do clero armênios se reuniram em Erevan para discutir a criação de um comitê para estudar o Genocídio Armênio."
 arme.197.a: "Boa iniciativa"
 arme.198.t: "Protestos em Massa em Erevan!"
 arme.198.d: "Uma série de distúrbios antigovernamentais ocorreu na Armênia. Protestos eclodiram na capital armênia, Erevan, organizados por apoiadores do candidato presidencial e ex-presidente Levon Ter-Petrosyan e de outros líderes da oposição. Envolvem dezenas de milhares de manifestantes durante o dia e centenas acampados durante a noite."
 arme.198.a: "Reprima-os!"
 arme.199.t: "O Protesto Atinge o Auge!"
 arme.199.d: "Os protestos chegaram a tal nível que a polícia não consegue mais conter a multidão com métodos não violentos. O exército está em alerta, policiais e soldados estão prontos para abrir fogo. Todos esperam pela ordem."
 arme.199.a: "Esmagá-los com nosso exército!"
 arme.199.b: "Não, os militares não são mais leais... Devemos renunciar!"
 arme.200.t: "Transição de Poder para Serzh Sargsyan"
 arme.200.d: "Após a repressão dos comícios e acordos internos, Kocharyan está pronto para passar o cargo de presidente ao seu sucessor escolhido, Serzh Sargsyan."
 arme.200.a: "Ótimo"
 arme.200.b: "Isso não vai acontecer!"
 arme.201.t: "Protestos do Dashnaktsutyun!"
 arme.201.d: "No contexto do início das negociações entre Turquia e Armênia, o partido Dashnaktsutyun iniciou o processo de saída da coalizão e de protesto contra a decisão diplomática de Serzh Sargsyan."
 arme.201.a: "Malditos idiotas"
 arme.203.t: "Movimento do Parque Mashtots"
 arme.203.d: "Devido às decisões do prefeito de Erevan, leal a nós, de demolir quiosques e áreas verdes no Parque Mashtots, um movimento de protesto pacífico começou em Erevan. Eles exigem a preservação das condições atuais do espaço público da cidade."
 arme.203.a: "As exigências deles são razoáveis."
 arme.203.b: "Liberais idiotas!"
 arme.204.t: "Raffi Hovhannisyan Declara uma Revolução!"
 arme.204.d: "Diversos grupos políticos e civis estão realizando protestos antigovernamentais na Armênia. No entanto, o líder do movimento de protesto é claramente Raffi Hovhannisyan. Uma multidão de seus apoiadores se reuniu na Praça da Liberdade de Erevan, onde Hovhannisyan instou o presidente Sargsyan a aceitar a vitória do povo e admitir sua derrota. Tanto partidos pró-ocidentais quanto nacionalistas, como os Dashnaks, estão aderindo ao protesto."
 arme.204.a: "Reprimir os protestos!"
 arme.204.b: "Dar a eles o que querem"
 arme.205.t: "Raffi Hovhannisyan Inicia Greve de Fome!"
 arme.205.d: "Após discursar para seus apoiadores na Praça da Liberdade, Raffi Hovhannisyan anunciou sua decisão de iniciar uma greve de fome. Ele instou o presidente eleito Serzh Sargsyan a renunciar. Segundo Hovhannisyan, não se trata apenas de uma greve de fome, mas de um boicote contra a mentira e a fraude."
 arme.205.a: "Pelo menos os protestos estão diminuindo."
 arme.206.t: "Partido Contrato Civil"
 arme.206.d: "Recentemente, um grupo de várias figuras da oposição anunciou a criação de um novo partido formado por ex-membros do ANC. O líder desse novo partido é Nikol Pashinyan, que foi libertado da prisão há pouco tempo após ter sido detido durante os protestos."
 arme.206.a: "Mais um grupo?"
 arme.207.t: "Protestos da Erevan Elétrica"
 arme.207.d: "Diante da recente tentativa do parlamento de aumentar as tarifas de eletricidade, protestos em massa começaram em Erevan. A polícia tenta dispersar os manifestantes usando força não letal e canhões de água. Devemos reconsiderar nossa posição sobre as tarifas ou deixar as coisas como estão?"
 arme.207.a: "Abandonaremos nosso plano"
 arme.207.b: "Impor a mudança de tarifa!"
 arme.208.t: "Massacre de Gyumri!"
 arme.208.d: "Valery Permyakov, militar da 102ª base militar russa localizada em Gyumri, estava de guarda noturna. Por volta das 4 da manhã de 12 de janeiro, Permyakov, portando um fuzil de assalto AK-74 e dois carregadores de munição, deixou o local da unidade, mais precisamente o posto de guarda dos depósitos da RAV, sem permissão. O desertor seguiu rumo à fronteira armênio-turca, com a intenção de cruzá-la e desaparecer na Turquia. Algum tempo depois de sua fuga, Permyakov decidiu entrar em uma das casas da Rua Myasnikyan, a cerca de 30 minutos a pé da unidade militar russa. Entrando no pátio comum por um portão trancado apenas simbolicamente, Permyakov encontrou várias casas térreas isoladas. O soldado, tendo quebrado o caixilho da parte de vidro da porta da frente, entrou no edifício.\n\nPermyakov matou todos os membros da família Avetisyan, que moravam nessa casa, incluindo as crianças. Após o massacre que cometeu, Valery Permyakov, vestido com as roupas dos mortos e abandonando seu fuzil, deixou a cena do crime. Às 12h30, os corpos da família Avetisyan foram descobertos pelos vizinhos.\n\nEstamos diante de um dilema: devemos lidar com ele nós mesmos ou entregar essa escória à Rússia?"
 arme.208.a: "A Rússia ensinará a esse bastardo na Sibéria como se comportar!"
 arme.208.b: "Executar o bastardo!"
 arme.209.t: "Massacre de Gyumri!"
 arme.209.d: "Valery Permyakov, militar da 102ª base militar russa localizada em Gyumri, estava de guarda noturna. Por volta das 4 da manhã de 12 de janeiro, Permyakov, portando um fuzil de assalto AK-74 e dois carregadores de munição, deixou o local da unidade, mais precisamente o posto de guarda dos depósitos da RAV, sem permissão. O desertor seguiu rumo à fronteira armênio-turca, com a intenção de cruzá-la e desaparecer na Turquia. Algum tempo depois de sua fuga, Permyakov decidiu entrar em uma das casas da Rua Myasnikyan, a cerca de 30 minutos a pé da unidade militar russa. Entrando no pátio comum por um portão trancado apenas simbolicamente, Permyakov encontrou várias casas térreas isoladas. O soldado, tendo quebrado o caixilho da parte de vidro da porta da frente, entrou no edifício.\n\nPermyakov matou todos os membros da família Avetisyan, que moravam nessa casa, incluindo as crianças. Após o massacre que cometeu, Valery Permyakov, vestido com as roupas dos mortos e abandonando seu fuzil, deixou a cena do crime. Às 12h30, os corpos da família Avetisyan foram descobertos pelos vizinhos.\n\nA Armênia foi muito generosa ao não executar esse monstro. Permyakov agora terá de enfrentar julgamento e ser enviado a uma prisão de segurança máxima."
 arme.209.a: "Esse bastardo vai apodrecer num inferno vivo."
 arme.210.t: "Massacre de Gyumri!"
 arme.210.d: "Valery Permyakov, militar da 102ª base militar russa localizada em Gyumri, estava de guarda noturna. Por volta das 4 da manhã de 12 de janeiro, Permyakov, portando um fuzil de assalto AK-74 e dois carregadores de munição, deixou o local da unidade, mais precisamente o posto de guarda dos depósitos da RAV, sem permissão. O desertor seguiu rumo à fronteira armênio-turca, com a intenção de cruzá-la e desaparecer na Turquia. Algum tempo depois de sua fuga, Permyakov decidiu entrar em uma das casas da Rua Myasnikyan, a cerca de 30 minutos a pé da unidade militar russa. Entrando no pátio comum por um portão trancado apenas simbolicamente, Permyakov encontrou várias casas térreas isoladas. O soldado, tendo quebrado o caixilho da parte de vidro da porta da frente, entrou no edifício.\n\nPermyakov matou todos os membros da família Avetisyan, que moravam nessa casa, incluindo as crianças. Após o massacre que cometeu, Valery Permyakov, vestido com as roupas dos mortos e abandonando seu fuzil, deixou a cena do crime. Às 12h30, os corpos da família Avetisyan foram descobertos pelos vizinhos.\n\nA Armênia decidiu executar Permyakov e não entregá-lo para uma pena de prisão perpétua na Rússia."
 arme.210.a: "O que fizeram é justo, mas contraria nossos acordos legais. Esperemos conseguir superar isso..."
 arme.211.t: "Crise de Reféns em Erevan"
 arme.211.d: "Um grupo de homens armados autodenominado Destemidos de Sasun invadiu uma delegacia de polícia em Erevan, na Armênia, e fez nove reféns. Eles exigiram a libertação do líder da oposição Jirair Sefilian e a renúncia do presidente. O grupo iniciou um impasse com as forças do governo, com multidões crescentes de manifestantes aderindo aos pedidos de renúncia do presidente. Dois policiais foram mortos durante o impasse e dezenas ficaram feridos; um policial morreu devido aos ferimentos após o fim da crise. Vários dos atacantes também ficaram feridos. O que devemos fazer?"
 arme.211.a: "Negociar com eles"
 arme.211.b: "Enviar o Serviço de Segurança Nacional para invadir o local!"
 arme.212.t: "Rendição do Sasna Tsrer!"
 arme.212.d: "O grupo Sasna Tsrer decidiu se render para evitar mais derramamento de sangue. Considerando todos os nossos esforços, a situação foi resolvida de forma bastante pacífica."
 arme.212.a: "Graças a Deus..."
 arme.213.t: "Invasão das Forças Especiais Bem-Sucedida!"
 arme.213.d: "As forças especiais invadiram com sucesso a delegacia, eliminando da área os terroristas políticos do Sasna Tsrer. Todos os atacantes foram mortos. Nenhum dos reféns foi ferido."
 arme.213.a: "Operação maravilhosa!"
 pavlik_dies: "Pavlik Manukyan Morreu"
 arme.214.t: "Armen Sarkissian Torna-se Presidente!"
 arme.214.d: "Como parte da reforma autocrática para fortalecer o governo de fato de Serzh Sargsyan e estabelecer uma república parlamentarista, Armen Sarkissian foi eleito presidente da Armênia. Sem laços claros com a velha panelinha, ele pode ajudar muito com nossa nova imagem."
 arme.214.a: "Boa jogada."
 arme.215.t: "Marcha de Protesto em Gyumri!"
 arme.215.d: "Em 31 de março, Nikol Pashinyan iniciou sua marcha de protesto Im Qayl (meu passo), partindo da cidade de Gyumri, com planos de caminhar por cidades como Vanadzor, Dilijan, Hrazdan e Abovyan, até finalmente chegar a Erevan."
 arme.215.a: "Mais um protesto sem sentido?"
 arme.217.t: "Revolução de Veludo"
 arme.217.d: "Após uma série de protestos políticos na Armênia, o chamado partido 'conservador' reacionário da Armênia, liderado por Serzh Sargsyan, renunciou e permitiu que o povo elegesse Nikol Pashinyan para o cargo, que prometeu destruir a corrupção desenfreada que assola a Armênia, melhorar sua situação econômica e deter a emigração em massa."
 arme.217.a: "Dukhov!"
 arme.218.t: "Nikol Pashinyan Nomeia o Próximo Ministro da Defesa!"
 arme.218.d: "O Primeiro-Ministro da Armênia, Nikol Pashinyan, diz que nomeará Davit Tonoyan, ministro interino de situações de emergência, como ministro da defesa. Apesar da reputação duvidosa de Davit Tonoyan e de possíveis conexões corruptas, ele se destaca por sua retórica nacionalista e expansionista, o que pode apaziguar os nacionalistas do país."
 arme.218.a: "Interessante"
 arme.219.t: "Partido do Acordo Nacional Pan-Armênio"
 arme.219.d: "Um novo partido foi formado recentemente na Armênia. A aliança defende a democracia direta, a abolição da Presidência, o fortalecimento da soberania da Armênia, a continuação do desenvolvimento econômico do país, o estabelecimento de mídia independente, a gratuidade do ensino universitário, o incentivo à repatriação da Diáspora Armênia, a proteção dos direitos das minorias étnicas, e apoia o conceito de Armênia Wilsoniana e a unificação de Artsakh com a Armênia."
 arme.219.a: "Interessante."
 arme.220.t: "Partido Movimento Nacional Conservador 5165"
 arme.220.d: "O Partido Movimento Nacional Conservador 5165 foi fundado recentemente e Karin Tonoyan foi eleita presidente do partido. O número no nome do partido representa a altura do Monte Ararat. Em essência, esse partido é formado por ex-militares, parentes de militares e pessoas que apoiam o governo militar na Armênia."
 arme.220.a: "Interessante."
 arme.221.t: "Escolhendo o Verdadeiro Bagratuni"
 arme.221.d: "A União Meliq se reuniu para escolher o novo monarca. Quem será?"
 arme.221.a: "Roland von Bagratuni"
 arme.221.b: "Ter Ashot Bagratuni"
 arme.222.t: "[ARM.GetNameWithFlag] Junta-se ao §GEstado da União!§!"
 arme.222.d: "Recentemente, o Presidente armênio decidiu aderir ao projeto do Estado da União e se unir a nós e a outros Estados-membros!"
 arme.222.a: "Maravilhoso!"
