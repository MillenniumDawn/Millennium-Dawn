 SWI_sig_stgw90: "Sturmgewehr 90"
 SWI_sig_sg551_carbine: "Carabine SG 551"
 SWI_sig_sg552_commando: "Commando SG552"
 SWI_sig_sg553: "Canon long SG 553"
 SWI_sig_mcx_spear: "LANCE MCX"
 SWI_sig_ngsw_program: "Programme NGSW"
 SWI_sig_cold_hammered_barrels: "Barils martelés à froid"
 SWI_sig_neuhausen_works: "Travaux de carabine Neuhausen"
 SWI_sig_p220_p75: "Pistolet P220 75"
 SWI_sig_p210_heritage: "P210 Patrimoine"
 SWI_sig_p226: "Pistolet de service P226"
 SWI_sig_xm9_legacy: "Héritage des essais XM9"
 SWI_sig_p229: "P229 Compacte"
 SWI_sig_p320_m17: "P320 M17"
 SWI_sig_p365: "P365 Micro-Compact"
 SWI_sig_mpx: "Mitraillette MPX"
 SWI_sig_export_sales: "Ventes à l'exportation mondiales"
 SWI_sig_contract_wins: "Contrat d’armes de poing remporté"
 SWI_sig_ssg3000: "SSG 3000 Précision"
 SWI_sig_electro_optics: "Division Électro-Optique"
 SWI_sig_gp90_ammo: "Munitions GP 90"
 SWI_sig_716_dmr: "716 Tireur d'élite désigné"
 SWI_sig_68_hybrid: "Munitions hybrides de 6,8 mm"
 SWI_sig_suppressor_suite: "Suite Suppresseur et Optique"
