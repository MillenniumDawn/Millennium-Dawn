 IRQ_nineveh_infrastructure: "Mejorar la Infraestructura en Nínive"
 IRQ_nineveh_infrastructure_desc: "Hemos prometido mejorar la infraestructura en Nínive."
 IRQ_anbar_airbase: "Mejorar los Aeropuertos en Anbar"
 IRQ_anbar_airbase_desc: "Hemos prometido mejorar los aeropuertos ubicados en Anbar."
 IRQ_salahuddin_airbase: "Mejorar los Aeropuertos en Salahuddin"
 IRQ_salahuddin_airbase_desc: "Hemos prometido mejorar los aeropuertos ubicados en Salahuddin."
 IRQ_nineveh_airbase: "Mejorar los Aeropuertos en Nínive"
 IRQ_nineveh_airbase_desc: "Hemos prometido mejorar los aeropuertos ubicados en Nínive."
 IRQ_economic_prosperity: "Mejorar la Situación Económica"
 IRQ_economic_prosperity_desc: "Hemos prometido mejorar la situación económica en Irak."
 IRQ_smaller_government: "Limit the Government's Reach"
 IRQ_smaller_government_desc: "Hemos prometido asegurar que el gobierno juegue un papel más pequeño en la sociedad iraquí."
 IRQ_sunni_internet: "Mejorar la Infraestructura de Internet"
 IRQ_sunni_internet_desc: "We've promised to improve internet infrastructure in the Western Regions populated by Sunnis."
 IRQ_pmf_decisions: "Fuerzas de Movilización Popular"
 IRQ_pmf_decisions_desc: "The §HPMF§!, or §HPopular Mobilization Forces§! are a series of §HMilitias§! that have banded together to form an umbrella group for the security of the nation. We are able to §HMobilize§! these §HMilitias§! at a cost in order to prepare for a war against our enemies. Total mobilization could take years, however we are able to deploy the §HPMF§! at any time relative to the mobilization rate.\n\nWhile the §HPMF§! is deployed, we will suffer from §Rincreased troop up-keep§!, but we are able to §HDemobilize§! them in order to save our budget.\n\nIf we are at war, mobilization will progress §HDouble§! its standard rate monthly."
 IRQ_begin_mobilization: "Comenzar la Movilización"
 IRQ_begin_mobilization_desc: "Al movilizar el PMF, tendremos la cantidad necesaria de fuerzas a nuestra disposición para enfrentar cualquier amenaza en la región."
 IRQ_stop_mobilization: "Detener la Movilización"
 IRQ_stop_mobilization_desc: "Mantener la movilización del PMF es una tarea costosa, y para salvar a nuestra nación del colapso económico es necesario detener la movilización del PMF."
 IRQ_deploy_the_pmf: "Desplegar el PMF"
 IRQ_demobilize_the_pmf: "Desmovilizar el PMF"
 IRQ_demobilize_the_pmf_desc: "Ya es hora de desmovilizar el PMF, ya que su asistencia ya no es útil para nuestras fuerzas armadas."
 IRQ_spring_of_islam: "La Primavera del Islam"
 IRQ_spring_of_islam_desc: "In order to expand the reach of our alliance and ideology, we will need to export §HShi'ite Revolutions§! in nations with some semblance of §HShi'ite Movements§!. We will disguise the movements as Islamic in nature, but will have them spearheaded by §HShi'ite§! leaders and groups to ensure that there is no hijacking of our influence. We will expand our influence within the nations in order to influence their §HMilitaries and Governmental Bodies§! to win them over when the revolution comes. The first stage will be arming and funding the rebels, which will then allow us to give them the greenlight to start their §HRevolution§!.\n"
 IRQ_arm_rebels_in_jordan: "Armar a los Rebeldes en [JOR.GetFlag] Jordania"
 IRQ_arm_rebels_in_jordan_desc: "We can fund, train, and arm Shi'ites in [JOR.GetFlag] Jordan and prepare them to overthrow the [JOR.GetFlag] Jordanian government in order to install an Islamic Republic."
