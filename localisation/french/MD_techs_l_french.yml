 module_aa_missiles_1: "Missiles Anti-Aériens I"
 module_aa_missiles_1_desc: "Les premiers missiles antiaériens embarqués offrent une défense de base à longue portée contre les avions ennemis. Limités en vitesse et en ciblage, ils étendent l'enveloppe protectrice d'un navire au-delà des canons traditionnels.\n\n§GIndice du concepteur : ce module offre des statistiques antiaériennes et de blindage, au prix d'un CI accru.§!"
 module_aa_missiles_2: "Missiles Anti-Aériens II"
 module_aa_missiles_2_desc: "Les missiles antiaériens améliorés disposent de temps de réaction plus courts, de meilleurs systèmes de guidage et d'une portée accrue, renforçant la capacité de la flotte à contrer les menaces aériennes modernes.\n\n§GIndice du concepteur : ce module offre des statistiques antiaériennes et de blindage, au prix d'un CI accru.§!"
 module_aa_missiles_3: "Missiles Anti-Aériens III"
 module_aa_missiles_3_desc: "Les missiles antiaériens modernes intègrent chercheurs avancés et capacités de contre-contre-mesures électroniques, permettant une interception fiable d'avions rapides et à faible observabilité.\n\n§GIndice du concepteur : ce module offre des statistiques antiaériennes et de blindage, au prix d'un CI accru.§!"
 module_aa_missiles_4: "Missiles Anti-Aériens IV"
 module_aa_missiles_4_desc: "Les systèmes de missiles antiaériens très avancés utilisent capteurs en réseau et contrôle de tir automatisé, permettant l'engagement simultané de plusieurs cibles aériennes.\n\n§GIndice du concepteur : ce module offre des statistiques antiaériennes et de blindage, au prix d'un CI accru.§!"
 module_aa_missiles_5: "Missiles Anti-Aériens V"
 module_aa_missiles_5_desc: "Les missiles antiaériens de nouvelle génération mettent l'accent sur l'engagement à longue portée, une maniabilité supérieure et la résistance à la guerre électronique, renforçant nettement la défense aérienne de la flotte.\n\n§GIndice du concepteur : ce module offre des statistiques antiaériennes et de blindage, au prix d'un CI accru.§!"
 module_aa_missiles_6: "Missiles Anti-Aériens VI"
 module_aa_missiles_6_desc: "Les plateformes de missiles antiaériens du futur proche représentent le pinacle de la défense aérienne navale, combinant ciblage assisté par IA, vitesse extrême et contre-contre-mesures avancées pour vaincre les menaces aériennes les plus sophistiquées.\n\n§GIndice du concepteur : ce module offre des statistiques antiaériennes et de blindage, au prix d'un CI accru.§!"
 module_aa_missiles_7: "Missiles anti-aériens VII"
 module_aa_missiles_7_desc: "Les plateformes de missiles antiaériens hyperavancées représentent le pinacle de la défense aérienne navale, combinant ciblage assisté par IA, vitesse extrême et contre-contre-mesures avancées pour vaincre les menaces aériennes les plus sophistiquées.\n\n§GIndice du concepteur : ce module offre des statistiques antiaériennes et de blindage, au prix d'un CI accru.§!"
 module_aa_missiles_8: "Missiles anti-aériens VIII"
 module_aa_missiles_8_desc: "Les plateformes de missiles antiaériens ultra-avancées représentent le pinacle de la défense aérienne navale, combinant ciblage assisté par IA, vitesse extrême et contre-contre-mesures avancées pour vaincre les menaces aériennes les plus sophistiquées.\n\n§GIndice du concepteur : ce module offre des statistiques antiaériennes et de blindage, au prix d'un CI accru.§!"
