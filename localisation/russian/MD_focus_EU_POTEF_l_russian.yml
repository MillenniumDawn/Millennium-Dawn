 EU_POTEF_trigger_test_1_desc: "[POTEF_polls_loc]"
 tooltip_EU_POTEF_nominee_trigger: "[ROOT.GetNameWithFlag] входит в тройку главных источников влияния во всех государствах-членах с той же правящей партией."
 tooltip_EU_POTEF_nominee_trigger_2: "Партия [ROOT.GetLeader] §Yне выдвинула кандидата§! на выборах Президента Европейской федерации (POTEF)."
 tooltip_EU_POTEF_campaign_in_member_state_effect: "Шанс повысить популярность политической группы, поддерживающей [ROOT.GetLeader], примерно на 5% в [FROM.GetNameWithFlag]. Шанс зависит от §Yвлияния§! [ROOT.GetNameWithFlag] на [FROM.GetNameWithFlag], §Yевроскептицизма§!, §Yправящей партии§! и §Yкандидата POTEF§! от [FROM.GetNameWithFlag]."
 show_POTEF_polls_loc_key: "Опросы POTEF:\nСрок по большинству:\n§Y5-летний срок§!: §Gабсолютное§! большинство голосов §GИ§! побед в государствах-членах\n§Y3-летний срок§!: одно §Gабсолютное§! И одно §Oотносительное§! большинство\n§Y2-летний срок§!: §Oотносительное§! большинство голосов §OИ§! побед в государствах-членах\n§Y1-летний срок§!: §Oотносительное§! большинство голосов\n\nВсего голосов: [?global.POTEF_pop_vote_total|Y0]§YK§!\nПолитическая группа: §YГолоса§! - §CДоля голосов§! - §GПобеды в гос.-членах§! - §YКандидат§!\n\n[EU_POTEF_party_0]\n[EU_POTEF_party_1]\n[EU_POTEF_party_2]\n[EU_POTEF_party_3]\n[EU_POTEF_party_4]\n[EU_POTEF_party_5]\n[EU_POTEF_party_6]\n[EU_POTEF_party_7]\n[EU_POTEF_party_8]\n[EU_POTEF_party_9]\n[EU_POTEF_party_10]\n[EU_POTEF_party_11]\n[EU_POTEF_party_12]\n[EU_POTEF_party_13]\n[EU_POTEF_party_14]\n[EU_POTEF_party_15]\n[EU_POTEF_party_16]\n[EU_POTEF_party_17]\n[EU_POTEF_party_18]\n[EU_POTEF_party_19]\n[EU_POTEF_party_20]\n[EU_POTEF_party_21]\n[EU_POTEF_party_22]\n[EU_POTEF_party_23]\n"
