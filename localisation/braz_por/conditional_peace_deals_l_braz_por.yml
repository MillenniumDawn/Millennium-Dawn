 CPD_resource_rights_button_TT: "§YDireitos de Recursos§!"
 CPD_resource_rights_button_TT_DELAYED: "Garantir os §YDireitos de Extração de Recursos§! desvia a produção de recursos dos estados selecionados para nós. Os próprios estados permanecem sob seu dono atual; apenas o petróleo, o aço, o alumínio, a borracha, o tungstênio e o cromo que eles produzem fluem para a nossa economia. O acordo é mantido até ser revertido por outro acordo de paz."
 CPD_military_basing_button_TT: "§YBases Militares§!"
 CPD_military_basing_button_TT_DELAYED: "Os §YDireitos de Base Militar§! concedem às nossas forças passagem livre pelo território desta nação. Nossas tropas podem se mover e se posicionar livremente até que o acesso seja revogado."
 CPD_full_puppet_button_TT: "§YFantoche Total§!"
 CPD_full_puppet_button_TT_DELAYED: "Exigir §YFantoche Total§! transforma esta nação inteira em nosso súdito. Eles mantêm suas fronteiras e população, mas perdem a independência de política externa; sua economia, mão de obra e militar respondem a nós. Quaisquer exigências de fantoche de estado já neste acordo são absorvidas."
 CPD_ceasefire_button_TT: "§YCessar-fogo§!"
 CPD_ceasefire_button_TT_DELAYED: "Um §YCessar-fogo§! encerra a guerra com a linha de frente tal como está. Cada lado mantém os estados que controla atualmente, independentemente de quem os possuía antes. A trégua dura §Y720 dias§! antes que qualquer um dos lados possa declarar guerra ao outro novamente.\n\nUm cessar-fogo e exigências territoriais não podem coexistir em um mesmo acordo. Ativar o cessar-fogo limpa todas as entradas de nível de estado da proposta atual."
 CPD_war_reparations_button_TT: "§YReparações de Guerra§!"
 CPD_war_reparations_button_TT_DELAYED: "§YReparações de Guerra§! obrigue o perdedor a pagar uma parte do seu PIB semanalmente durante um ano. A transferência aparece como uma nova despesa no orçamento do pagador e como uma nova receita no do recebedor.\n\n[CPD_reparations_preview]"
 CPD_reparations_preview_TT: "Transferência projetada para este acordo: §Y£[?CPD_rep_preview_temp|.2]B por semana§! (~§Y£[?CPD_rep_preview_total_temp|.0]B§! ao longo do ano)"
 CPD_forced_neutrality_button_TT: "§YNeutralidade Forçada§!"
 CPD_forced_neutrality_button_TT_DELAYED: "§YNeutralidade Forçada§! remove esta nação de sua facção ao assinar e a proíbe de entrar ou formar outra por §Ycinco anos§!."
 CPD_regime_change_button_TT: "§YMudança de Regime§!"
 CPD_regime_change_button_TT_DELAYED: "§YMudança de Regime§! substitui o partido governante do alvo pelo que está atualmente no poder em nossa nação. A coalizão deles é dissolvida e um líder da nossa vertente política é instalado. O novo governo carrega §Yinstabilidade pós-guerra§! por dois anos, e nações islâmicas podem ver uma §Yreação salafista§! contra o governo imposto por estrangeiros."
 additional_income_war_reparations_tt: "$$[?CPD_reparations_weekly|+3] de §YReparações de Guerra§!\n"
 additional_expense_war_reparations_tt: "$$[?CPD_reparations_weekly|-3] de §YReparações de Guerra§!\n"
 CPD_war_reparations_payer: "Reparações de Guerra (Pagando)"
 CPD_war_reparations_payer_desc: "Estamos pagando reparações de guerra como resultado de um acordo de paz. Uma transferência semanal em dinheiro aparece como uma despesa adicional em nosso orçamento por §Y1 ano§!."
 CPD_war_reparations_receiver: "Reparações de Guerra (Recebendo)"
 CPD_war_reparations_receiver_desc: "Estamos recebendo reparações de guerra como resultado de um acordo de paz. Uma transferência semanal em dinheiro aparece como receita adicional em nosso orçamento por §Y1 ano§!."
 CPD_forced_neutrality_spirit: "Neutralidade Imposta"
 CPD_forced_neutrality_spirit_desc: "Como condição do acordo de paz, nossa nação é proibida de entrar ou criar alianças militares."
 CPD_regime_change_instability: "Instabilidade Política Pós-Guerra"
 CPD_regime_change_instability_desc: "Uma mudança de regime forçada desestabilizou nosso sistema político."
