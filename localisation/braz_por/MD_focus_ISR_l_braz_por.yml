 israel.114.a: "Um golpe doloroso."
 israel.114.b: "Allahu Akbar!"
 israel.115.t: "Cúpula do Mar Vermelho"
 israel.115.d: "Recentemente, após nossas consultas com autoridades dos EUA, eles propuseram um novo roteiro para a paz. Ele inclui começar a se desligar de Gaza e do norte de Samaria, em troca de Arafat descentralizar o poder nomeando Mahmoud Abbas como primeiro-ministro."
 israel.115.a: "Esperemos que [PAL.GetLeader] seja racional o bastante."
 israel.115.b: "Concordamos com esta proposta."
 israel.115.c: "Que proposta idiota!"
 PAL_abbas_pm: "Mahmoud Abbas como Primeiro-Ministro"
 reform_canbedone_tt: "§YPoderemos fazer o ramo de reformas!§!"
 waituntilarafatdies_tt: "§YTeremos que esperar até Yasser Arafat morrer para fazer as reformas. No entanto, isso pode nos dar outras oportunidades.§!"
 israeli_settlements: "Israeli Settlements"
 israeli_settlements_desc: "Shortly after the Israeli victory in the Six Day War of 1967 that saw Israel seize control of the West Bank from Jordan, a group of Zionist activists staying in a hotel in Hebron refused to leave. The Israeli government sought to compromise with the activists by establishing the first Jewish settlement in the West Bank, in doing so preventing Palestinian herders from continuing to use that land. That event began a trend that has continued to this day, with over a hundred settlements being established, to the growing chagrin of the Palestinian population."
 israeli_settlements2: "Assentamentos Israelenses"
 israeli_settlements2_desc: "Logo após a vitória israelense na Guerra dos Seis Dias de 1967, que fez Israel tomar o controle da Cisjordânia da Jordânia, um grupo de ativistas sionistas hospedados em um hotel em Hebron se recusou a sair. O governo israelense tentou chegar a um acordo com os ativistas estabelecendo o primeiro assentamento judaico na Cisjordânia, impedindo assim que pastores palestinos continuassem a usar aquela terra. Esse evento iniciou uma tendência que continua até hoje, com mais de uma centena de assentamentos estabelecidos, para o crescente desgosto da população palestina."
 israeli_settlements3: "Assentamentos Israelenses"
 israeli_settlements3_desc: "Logo após a vitória israelense na Guerra dos Seis Dias de 1967, que fez Israel tomar o controle da Cisjordânia da Jordânia, um grupo de ativistas sionistas hospedados em um hotel em Hebron se recusou a sair. O governo israelense tentou chegar a um acordo com os ativistas estabelecendo o primeiro assentamento judaico na Cisjordânia, impedindo assim que pastores palestinos continuassem a usar aquela terra. Esse evento iniciou uma tendência que continua até hoje, com mais de uma centena de assentamentos estabelecidos, para o crescente desgosto da população palestina."
 israeli_blockade: "Israeli Blockade"
 israeli_blockade_desc: "Since Hamas seized control of the Gaza Strip from Fatah in, Egypt and Israel have enforced a land, air and sea blockade of Gaza. While Israel has maintained that the blockade is legal under international law and that it is necessary to guarantee Israeli security and put pressure on a violent terrorist organization, humanitarian and intergovernmental organizations have accused Israel of inflicting collective punishment on the people of Gaza through the blockade, forcing the territory's inhabitants to remain dependent on humanitarian aid."
 israel.116.t: "[ISR.GetLeader] propõe a Lei de Desengajamento!"
 israel.116.d: "Recentemente, após os últimos acontecimentos, o governo israelense propôs reduzir a presença na Faixa de Gaza e evacuar os assentamentos naquela região. Isso aliviará nossa posição econômica, porém muitas pessoas da sociedade israelense podem ficar muito furiosas com isso."
 israel.116.a: "Esperemos que eles sejam racionais o bastante."
 israel.116.b: "Ótimo!"
 ISR_support_of_settlements: "Apoio aos Assentamentos"
 ISR_support_of_settlements_desc: "Nosso governo apoia os assentamentos na Palestina de jure destinando um percentual específico do nosso orçamento às necessidades financeiras dos assentamentos.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos o foco §Y$ISR_disengagement_plan$§!."
 ISR_support_of_settlements2: "Apoio aos Assentamentos"
 ISR_support_of_settlements2_desc: "Nosso governo apoia os assentamentos na Palestina de jure destinando um percentual específico do nosso orçamento às necessidades financeiras dos assentamentos.\n§W--------------§!\nEste espírito nacional será §RRemovido§! e substituído por uma política de assentamentos voltada para enclaves se concluirmos o foco §Y$ISR_the_enclave_settlements$§!."
 focus_on_exclaves_0: "Foco nos Exclaves"
 focus_on_exclaves_0_desc: "Nosso governo apoia os assentamentos na Palestina de jure destinando um percentual específico do nosso orçamento às necessidades financeiras dos assentamentos."
 focus_on_exclaves_1: "Foco nos Exclaves"
 focus_on_exclaves_1_desc: "Nosso governo apoia os assentamentos na Palestina de jure destinando um percentual específico do nosso orçamento às necessidades financeiras dos assentamentos."
 israel.117.t: "Rabinos sionistas religiosos protestam contra a lei!"
 israel.117.d: "Recentemente, muitos líderes sionistas religiosos protestaram contra a lei, apoiando os movimentos contrários ao governo. O que devemos fazer?"
 israel.117.a: "Não ofender os rabinos."
 israel.117.b: "Provocar indignação contra sua interferência na política!"
 israel.118.t: "Apelos ao motim contra a lei!"
 israel.118.d: "Muitos manifestantes em Israel pedem um motim contra a lei de desengajamento. Eles querem realizar certos atos de reversão sem a aprovação do governo. O que devemos fazer?"
 israel.118.a: "Punir os que desprezam moralmente a lei!"
 israel.118.b: "Permitir que se contenham durante o desengajamento"
 israel.119.t: "Parlamentares pedem um referendo sobre o plano!"
 israel.119.d: "Membros do Knesset propõem um novo referendo sobre o plano de desengajamento. Devemos realizar um?"
 israel.119.a: "O povo nos deu um mandato para governar!"
 israel.119.b: "Derrubá-lo com a Suprema Corte."
 wemaypiss_people_but_money_tt: "Evacuaremos os assentamentos de §G[ISR.GetNameWithFlag]§! em §R[HAM.GetNameWithFlag]§!, §Greduzindo§! os §Rgastos de dinheiro§! com o §Yapoio aos assentamentos§! em §R[HAM.GetNameWithFlag]!§!\n\n§YNo entanto§!, §Ymuitos grupos§! podem §Rnão apoiar muito§! esta §Ydecisão§!."
 hamas_toofar_tt: "§RRadicais§! tomaram a §RCisjordânia§!. §GNós§! não podemos §Rcorrer o risco de ter isso§! em §Ynossas fronteiras.§!"
 hebron_tt: "§Y[PAL.GetNameWithFlag]§! nos pediu ajuda para lidar com a §RRevolta de Hebron§! e §Greprimir§! os §Rradicais§!. §GNossas tropas§! §Gentrarão no território§! da §YAutoridade Nacional Palestina§! e §Gagirão de acordo§!."
 operation_shover_galim_1: "Operação Shover Galim"
 operation_shover_galim_2: "Operação Shover Galim"
 betrayed_oslo: "Traiu os Acordos de Oslo"
 lioncagcapt_tt: "§GOs líderes do Movimento Cova do Leão serão capturados!§!"
