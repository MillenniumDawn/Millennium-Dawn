 ARM_assemble_meliq_union: "멜리크 연합 결집"
 ARM_assemble_meliq_union_desc: "멜리크 연합은 아르메니아의 귀족적 전통주의 조직입니다. 새로운 타가보르를 선출하기 위해 이 조직의 모든 구성원을 모아야 합니다."
 ARM_armeno_ari_union: "아르메노-아리아 연합"
 ARM_armeno_ari_union_desc: "아르메노-아리아 연합은 고대 아르메니아 이교 전통으로의 회귀와 고대 시대의 모습 그대로 아르메니아 왕국을 복원할 것을 주장하는 아르메니아의 정당입니다."
 ARM_going_to_roots: "뿌리로의 회귀"
 ARM_going_to_roots_desc: "아르메니아는 오늘날까지 살아남은 가장 오래된 나라 중 하나입니다. 모든 민족이 살아남을 수 있었던 것은 아니지만, 많은 이들이 견디지 못했을 가시밭길을 걸어온 것이 바로 우리 민족입니다. 선조들의 신앙, 영광스러운 업적과 전통이 우리가 살아남고 계속 싸울 수 있도록 도운 힘입니다."
 ARM_glory_of_tigr: "대왕 티그라네스의 영광"
 ARM_glory_of_tigr_desc: "아르메니아가 다시 일어서서, 새롭게 부활한 왕국을 중심으로 단결할 때가 왔습니다. 이 왕국은 대왕 티그라네스가 이른 높이에 도달해야 하며 심지어 그것을 뛰어넘어야 합니다!"
 ARM_state_christianity: "국가 기독교"
 ARM_state_christianity_desc: "우리 국가의 헌법은 이미 국민의 삶에서 아르메니아 교회가 갖는 중요성을 기술하고 있습니다. 그러나 이제 교회를 국가의 일부로 삼아 삶의 모든 측면에 통합할 때가 되었습니다."
 ARM_restoring_aspets: "아스페트 복원"
 ARM_restoring_aspets_desc: "아스페트 지아보르, 또는 아이루지스는 아르메니아 타가보르나 귀족 가문에 충성스러운 전사로 복무한 아르메니아 기사들이었습니다. 우리는 옛 전통과 현대전을 결합하여 이 칭호를 군대 내에 복원해야 합니다."
 ARM_support_pan_iranists: "파르티아의 분노"
 ARM_support_pan_iranists_desc: "우리 아르메니아인은 아르사케스 제국의 유일한 잔존자이며, 이 제국은 불행한 일련의 사건 속에 사산 왕조에 의해 멸망했습니다. 이제 우리는 결정해야 합니다. 페르시아인과 동맹을 맺고 통합할 것인가, 아니면 이란에서 우리 왕조를 복원할 것인가?"
 ARM_give_money_to_kob: "KOB 지원"
 ARM_give_money_to_kob_desc: "개념 정당 KOB는 우리와 매우 유사한 가치관을 가지고 있습니다. 우리는 지역에서 우리 동맹들의 결속력 있는 축을 만들기 위해 러시아의 형제들을 지원해야 합니다."
 ARM_supporting_chechens: "이츠케리아 지원"
 ARM_supporting_chechens_desc: "제1차 체첸 전쟁 중 롤란트 폰 바그라투니는 조하르 두다예프와 서신을 주고받았으며, 두 사람은 러시아에 대한 저항과 범코카서스주의의 야망을 논의했습니다."
 ARM_crusader_legacy: "십자군의 유산"
 ARM_crusader_legacy_desc: "아르메니아 민족이 교회와 기독교 세계를 위해 행한 선행 중에서도 특히 강조해야 할 것은, 기독교 군주들과 전사들이 성지를 되찾으러 갔던 시절에 어떤 민족이나 국가도 아르메니아인만큼 열정과 기쁨과 신앙으로 그들을 돕지 않았다는 점입니다. 아르메니아인들은 십자군에게 말과 식량과 길잡이를 제공했습니다. 아르메니아인들은 성전 동안 전적인 용기와 충성심으로 이 전사들을 도왔습니다. - 교황 그레고리오 13세"
 ARM_our_old_realm: "에드워드의 빚"
 ARM_our_old_realm_desc: "아르메니아 킬리키아의 마지막 왕은 아르메니아 해방을 위한 새로운 십자군을 호소하기 위해 잉글랜드 왕 에드워드 3세를 방문했습니다. 킬리키아 왕국의 복원을 바라며, 레본은 국고를 잉글랜드 왕에게 맡겨 보관하게 했습니다. 양측은 아르메니아 왕국이 해방되고 복원될 때까지 국고를 잉글랜드에 보관한다는 협약을 체결했습니다. 이제 우리 돈을 돌려받을 것을 요구할 때입니다."
 ARM_renewed_nobility: "새로운 귀족"
 ARM_renewed_nobility_desc: "우리와의 협력을 주저할 수 있는 구귀족을 통합해야 할 뿐 아니라, 우리 군 지휘관들로부터 새로운 귀족 계층을 만들어야 합니다."
 ARM_polish_hung_dilem: "폴란드의 딜레마"
 ARM_polish_hung_dilem_desc: "롤란트 폰 바그라투니는 폴란드에서 아르메니아로 왔으며, 그의 첫 번째 조국에서 군주주의 운동을 지원할 의사가 있습니다."
 ARM_fate_of_italy: "이탈리아의 운명"
 ARM_fate_of_italy_desc: "사보이아 가문은 이탈리아 왕의 칭호를 정당하게 보유하고 있습니다. 우리의 두 번째 왕관과 어떻게 통합할지 생각하기 시작해야 합니다."
 ARM_true_tseghakronism: "진정한 체가크론주의"
 ARM_true_tseghakronism_desc: "새로 수립된 군주제로서 우리는 체가크론주의 사상을 지지해야 합니다. 이는 우리의 전통주의 노선과 완전히 부합합니다."
 ARM_new_religious_thought: "새로운 종교 사상"
 ARM_new_religious_thought_desc: "우리 위원회의 지도자들은 옛 아르메니아 고유 신앙을 부활시켜 사회에 통합하는 것이 우리 이상의 정신에 부합한다고 믿습니다."
 ARM_support_ossetia: "오세티아 지원"
 ARM_support_ossetia_desc: "오세티아는 코카서스에서 우리와 혈통이 같을 뿐 아니라 이상까지 공유하는 몇 안 되는 국가 중 하나입니다. 우리는 그들의 대의를 지원해야 합니다."
 ARM_pan_caucasianism: "범코카서스주의"
 ARM_pan_caucasianism_desc: "우리 깃발 아래 코카서스 전체를 통합하는 것이 우리 국왕의 목표이며, 그의 뜻은 이루어져야 합니다."
 ARM_liberating_levant: "레반트 해방"
 ARM_liberating_levant_desc: "서방과 아르메니아의 선조들이 그러했듯이, 우리는 레반트를 해방하고 과거의 십자군 국가를 재건하기 위한 새로운 십자군을 일으켜야 합니다."
 ARM_true_urheimat: "진정한 원향"
 ARM_true_urheimat_desc: "아르메니아는 모든 인도유럽인의 진정한 고향입니다. 우리 당이 원래 선언했듯이:\n\n아르메니아 고원\n아르메니아인의 조국,\n아리아 문명의 요람.\n전 세계의 아리아인들이여,\n그곳을 해방하라,\n그리고 스스로를 해방하라."
 arm_empire.2.t: "아르메니아 형제들과의 통합"
 arm_empire.2.d: "우리의 아르메니아 형제들과 하나로 뭉쳐 어깨를 나란히 할 때가 왔습니다. 함께 위대한 미래를 건설하고, 공동의 적을 응징하며, 우리 민족을 번영으로 이끌 것입니다."
 arm_empire.2.a: "하나로 뭉치자"
 arm_empire.2.b: "그렇다면 팔짱을 끼고 지켜보자"
 arm_empire.2.c: "우리는 서로 다른 길을 걷는다"
 arm_empire.3.t: "통합에 대한 동의"
 arm_empire.3.d: "우리의 꿈이 이루어졌으며, 이제 아르메니아 민족과 페르시아 민족이 다시 하나가 되었습니다."
 arm_empire.3.a: "좋다"
 arm_empire.4.t: "우리 제안을 거절한 그들"
 arm_empire.4.d: "우리는 그들이 합류하도록 설득하지 못했습니다."
 arm_empire.4.a: "알겠다"
 arm_empire.5.t: "우리와의 동맹 선택"
 arm_empire.5.d: "그들은 가장 좋은 선택이 우리의 동맹이 되는 것이라고 판단했습니다."
 arm_empire.5.a: "좋다"
 arm_empire.6.t: "아르메니아, [SOO.GetName] 매입을 제안"
 arm_empire.6.d: "아르메니아 정부가 오늘 우리에게 이례적인 제안을 해 왔습니다. 그들은 [SOO.GetName]의 영토를 상당한 거액에 우리에게서 사들이려 합니다. 우리는 이러한 제안에 충격을 받았으며, 게다가 아르메니아 외교관들은 우리가 거절할 경우 부정적인 결과가 따를 것임을 분명히 암시했습니다."
 arm_empire.6.a: "터무니없다!"
 arm_empire.6.b: "동의한다"
 arm_empire.7.t: "아르메니아, [SOO.GetName] 매입을 제안"
 arm_empire.7.d: "아르메니아 정부가 오늘 우리에게 이례적인 제안을 해 왔습니다. 그들은 [SOO.GetName]의 영토를 상당한 거액에 우리에게서 사들이려 합니다. 우리는 이러한 제안에 충격을 받았으며, 게다가 아르메니아 외교관들은 그들의 거절이 부정적인 결과로 이어질 것임을 분명히 암시했습니다."
 arm_empire.7.a: "터무니없다!"
 arm_empire.7.b: "동의한다"
 arm_empire.8.t: "아르메니아, 우리를 매입하겠다고 제안"
 arm_empire.8.d: "아르메니아 정부가 오늘 우리와 외교적 접촉을 갖고 매우 이례적인 제안을 해 왔습니다. 그들은 말 그대로 막대한 금액을 지불하고 우리나라를 자국의 통제 아래로 사들이려 합니다. 금액은 물론 공식 언론에서는 더 외교적으로 표현되겠지만, 그들이 제시한 금액은 상당하며, 게다가 수년간 우리를 자국의 일부로 삼는 데 동의하지 않았던 러시아와 달리 그들의 후원이 따릅니다."
 arm_empire.8.a: "환영한다!"
 arm_empire.8.b: "동의한다"
 arm_empire.9.t: "[SOO.GetName], 제안을 거절"
 arm_empire.9.d: "그들의 정부가 우리의 후한 제안을 거절했습니다. 그렇다면 그들에게 영향력을 행사할 다른 방법을 찾아야 할 것 같습니다."
 arm_empire.9.a: "안타깝다"
 arm_empire.10.t: "아르메니아, 자금 반환을 요구"
 arm_empire.10.d: "이제 아르메니아 왕국이 복원되었으므로, 1378년 조약에 따라 영국에 보관되도록 이전된 아르메니아 국고에 관한 옛 조약의 조건을 이행할 때가 되었습니다. 아르메니아가 국가의 지위를 되찾을 경우 국고는 반환되어야 합니다."
 arm_empire.10.a: "우리는 약속을 지킨다"
 arm_empire.10.b: "이곳은 조약을 체결한 그 아르메니아가 아니다."
 arm_empire.11.t: "영국, 자금 반환을 거부"
 arm_empire.11.d: "영국인에게는 무엇 하나 맡길 수 없다더니, 우리 돈마저 그렇다니 놀랄 일도 아닙니다."
 arm_empire.11.a: "지금은 아니지만, 반드시 돈을 돌려받겠다"
 arm_empire.12.t: "영국, 조약 조건을 이행"
 arm_empire.12.d: "영국 정부가 우리 돈을 돌려주기로 동의했습니다."
 arm_empire.12.a: "어려울 때는 영국인을 정말 믿을 수 있을지도 모르겠다"
 arm_empire.14.t: "하나의 왕관 아래 통합"
 arm_empire.14.d: "이제 사보이아 가문이 아르메니아에서 권력을 잡았으므로, 우리는 하나의 왕관 아래 다시 통합할 기회를 얻었습니다."
 arm_empire.14.a: "아르메니아와의 통합에 동의한다"
 arm_empire.14.b: "통합에 대해 논의하자"
 arm_empire.14.c: "아니요"
 arm_empire.15.t: "이탈리아, 우리 영토가 되는 데 동의"
 arm_empire.15.d: "이탈리아 왕관이 우리 가문의 패권 아래 우리와 통합되는 데 동의했습니다."
 arm_empire.15.a: "완벽하다"
 arm_empire.16.t: "이탈리아, 우리 제안을 거절"
 arm_empire.16.d: "이탈리아가 우리 제안을 거절하여 우리에 대한 극단적인 무례를 드러냈습니다."
 arm_empire.16.a: "그들의 문제다"
 arm_empire.17.t: "이탈리아, 자국 깃발 아래 통합을 제안"
 arm_empire.17.d: "이탈리아는 우리에게 자국의 일부가 될 것을 제안하고 있으며, 그렇게 되면 우리는 재정적으로나 정치적으로 큰 이익을 얻게 됩니다. 또한 우리의 주권도 보존할 수 있습니다."
 arm_empire.17.a: "오히려 당신들이?"
 arm_empire.17.b: "동의한다"
 arm_empire.18.t: "아르메니아, 우리 제안을 거절하고 자국의 일부가 될 것을 제안"
 arm_empire.18.d: "아르메니아가 우리를 자국의 일부가 되도록 초청하고 있습니다. 우리는 주권의 일부를 유지할 수 있습니다."
 arm_empire.18.a: "아니요"
 arm_empire.18.b: "하나로 뭉치자"
 arm_empire.19.t: "체첸 봉기"
 arm_empire.19.d: "체첸에서 전쟁이 다시 시작되었습니다. 우리 정보에 따르면 체첸 반군은 봉기를 일으키도록 아르메니아 특수 기관의 후원을 받았습니다. 아르메니아 정부는 우리나라의 불안정에 이해관계가 있는 것으로 보입니다."
 arm_empire.19.a: "제3차 체첸 전쟁이 시작되었다"
 arm_empire.20.t: "체첸 봉기"
 arm_empire.20.d: "체첸에서 전쟁이 다시 시작되었습니다. 우리 정보에 따르면 체첸 반군은 봉기를 일으키도록 아르메니아 특수 기관의 후원을 받았습니다. 아르메니아 정부는 우리나라의 불안정에 이해관계가 있는 것으로 보입니다."
 arm_empire.20.a: "제3차 체첸 전쟁이 시작되었다"
 arm_empire.21.t: "하나의 깃발 아래 통합"
 arm_empire.21.d: "이제 사보이아 가문이 아르메니아에서 권력을 잡았으므로, 우리는 하나의 깃발 아래 다시 통합할 기회를 얻었습니다."
 arm_empire.21.a: "아르메니아와의 통합에 동의한다"
 arm_empire.21.b: "통합에 대해 논의하자"
 arm_empire.21.c: "아니요"
 arm_empire.22.t: "체첸, 우리 영토가 되는 데 동의"
 arm_empire.22.d: "체첸 정부가 우리 깃발 아래 우리와 통합되는 데 동의했습니다."
 arm_empire.22.a: "완벽하다"
 arm_empire.23.t: "체첸, 우리 제안을 거절"
 arm_empire.23.d: "체첸이 우리 제안을 거절하여 우리에 대한 극단적인 무례를 드러냈습니다."
 arm_empire.23.a: "그들의 문제다"
 arm_empire.24.t: "체첸, 자국 깃발 아래 통합을 제안"
 arm_empire.24.d: "체첸은 우리에게 자국의 일부가 될 것을 제안하고 있으며, 그렇게 되면 우리는 재정적으로나 정치적으로 큰 이익을 얻게 됩니다. 또한 우리의 주권도 보존할 수 있습니다."
 arm_empire.24.a: "오히려 당신들이?"
 arm_empire.24.b: "동의한다"
 arm_empire.25.t: "아르메니아, 우리 제안을 거절하고 자국의 일부가 될 것을 제안"
 arm_empire.25.d: "아르메니아가 우리를 자국의 일부가 되도록 초청하고 있습니다. 우리는 주권의 일부를 유지할 수 있습니다."
 arm_empire.25.a: "아니요"
 arm_empire.25.b: "하나로 뭉치자"
 arm_empire.26.t: "폴란드 내전"
 arm_empire.26.d: "최근의 사건들과 사실상의 친아르메니아 괴뢰 정부로의 권력 이양으로 인해, 모든 정치 세력이 폴란드의 이러한 입장에 동의한 것은 아니었습니다. 폴란드군의 많은 장군들이 서방 정당들의 지지를 받아 우리에 맞서 반란을 조직했습니다!"
 arm_empire.26.a: "신이시여, 우리를 구하소서"
 arm_empire.26.b: "우려스러운 사태다."
 arm_empire.27.t: "이탈리아 내전"
 arm_empire.27.d: "이탈리아에서는 일련의 사건이 벌어진 뒤 곧바로 정치 위기가 시작되었습니다. 국내 많은 이들이 나라를 장악한 노골적인 괴뢰 정권에 불만을 품었습니다. 그 결과 모든 것이 친서방 정치 세력이 이끄는 무장 봉기로 이어졌습니다."
 arm_empire.27.a: "신이시여, 우리를 구하소서"
 arm_empire.27.b: "우려스러운 사태다."
 arm_empire.28.t: "개념 정당 '통합' 지원"
 arm_empire.28.d: "러시아의 정치 체제는 우리의 정치적 이익을 도모할 유력 후보를 선택할 여지를 거의 주지 않습니다. 우리는 현 정부를 우리나라에 순전히 적대적인 것으로 보고 있으므로, 우리가 후원하는 인물을 통해 러시아에서 우리의 이익을 추구하려 합니다."
 arm_empire.28.a: "시작하자"
 arm_empire.29.t: "개념 정당 '통합' 자금 지원 지속"
 arm_empire.29.d: "우리는 향후 우리의 자금이 스스로 값을 하기를 바라며 이 정당에 대한 재정 지원을 계속할 것입니다."
 arm_empire.29.a: "좋아"
 arm_empire.30.t: "개념 정당 '통합'의 운명"
 arm_empire.30.d: "러시아 정권 교체라는 우리 대계획의 대단원으로 나아갈 것인지, 아니면 우리의 영향력을 계속 강화할 것인지 결정할 때가 되었습니다."
 arm_empire.30.a: "아직은 이르다"
 arm_empire.30.b: "때가 왔다"
 arm_empire.31.t: "개념 정당 '통합'의 반란"
 arm_empire.31.d: "모든 준비가 완료되었으며, 이제 우리의 자금이 잘 쓰였기를 바랄 뿐입니다."
 arm_empire.31.a: "때가 왔다"
 arm_empire.32.t: "개념 정당 '통합', 러시아에서 권력 장악"
 arm_empire.32.d: "콘스탄틴 페트로프가 이끄는 개념 정당 '통합'이 별다른 저항 없이 러시아에서 권력을 장악했으며, 정치적 분열이 나라의 내부 방어를 약화시킨 것으로 보입니다."
 arm_empire.32.a: "나라를 잃고 있다."
 arm_empire.32.b: "승리다!"
 arm_empire.33.t: "개념 정당 '통합'의 반란"
 arm_empire.33.d: "콘스탄틴 페트로프가 이끄는 개념 정당 '통합'이 쿠데타를 일으켜 모스크바에서 권력을 장악하려 했으나 특수 기관이 이를 저지했습니다. 안타깝게도 이 정당은 지방에 많은 지지자를 두고 있는 것으로 드러났으며, 이는 전국 각지의 봉기를 촉발했습니다."
 arm_empire.33.a: "나라를 잃고 있다."
 arm_empire.33.b: "부분적 승리"
 arm_empire.34.t: "개념 정당 '통합'의 반란 실패"
 arm_empire.34.d: "콘스탄틴 페트로프가 이끄는 개념 정당 '통합'이 쿠데타를 일으켜 모스크바에서 권력을 장악하려 했으나 특수 기관이 이를 저지했습니다. 또한 지방에 있던 그의 정당 지지자들도 모두 체포되어 모든 것이 평화롭게 끝났습니다."
 arm_empire.34.a: "러시아는 다시 구원받았다."
 arm_empire.34.b: "우리는 패배했다."
 arm_empire_news.1.t: "폴란드 내전"
 arm_empire_news.1.d: "아르메니아가 오랜 세월 공들여 키워 온 친아르메니아 정부가 폴란드에서 권력을 잡았습니다. 그러나 국내 모든 정치 세력이 이 상황을 환영한 것은 아니었습니다. 많은 장군들과 친서방 정당들이 괴뢰 정부를 타도하기 위해 반란을 조직했습니다."
 arm_empire_news.1.a: "불쌍한 폴란드"
 arm_empire_news.2.t: "이탈리아 내전"
 arm_empire_news.2.d: "이탈리아에 위기가 닥쳤습니다. 친아르메니아 정부가 나라를 장악했고, 그 결과 일부 정치 세력이 국내 중앙 정치 권력과 공개적인 무력 충돌에 돌입했습니다."
 arm_empire_news.2.a: "불쌍한 이탈리아"
 arm_empire_news.3.t: "러시아 각 지역의 폭동"
 arm_empire_news.3.d: "크렘린에서 권력 장악에 실패한 콘스탄틴 페트로프의 개념 정당 '통합'은 지방 특수 기관의 약점을 틈타, 정당 지지율이 높았던 러시아 일부 지역에서 폭동을 조직했습니다."
 arm_empire_news.3.a: "광기다"
 arm_empire_news.4.t: "아르메니아 합중국"
 arm_empire_news.4.d: "오늘 아르메니아에서 역사적인 사건이 일어났습니다. 아르메니아 정부는 전신과는 근본적으로 다른 원칙과 법에 기반한 완전히 새로운 국가, 아르메니아 합중국의 수립을 선언했습니다. 이제 아르메니아는 미국과 같지만 코카서스에 있는, 실로 놀라운 사건입니다."
 arm_empire_news.4.a: "그... 그렇군?"
 ARM_new_nobility_idea: "신흥 귀족"
 ARM_new_nobility_idea_desc: "우리 국가의 새로운 귀족층은 작위를 되찾은 옛 가문들뿐 아니라, 새롭고 젊은 군인 귀족도 포함합니다.\n§W--------------§!\n민족주의 군주주의자들이 더 이상 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenian_paganism_idea: "헤타니즘"
 ARM_armenian_paganism_idea_desc: "헤타니즘이라고도 불리는 아르메니아 토착 신앙은 아르메니아인의 역사적인 기독교 이전 신앙 체계와 민족 종교를 되살리려는 현대 이교 신종교 운동입니다."
 ARM_glory_of_tigran_idea: "티그란의 영광"
 ARM_crusade_legacy_idea: "십자군 정신"
 ARM_urheimat_restored_idea: "복원된 원향"
 ARM_tseghakronism_one_idea: "체가크론주의"
 ARM_renewed_knighthood_idea: "기사도의 부활"
 ARM_tseghakronism_two_idea: "체가크론주의"
 ARM_state_christianity_idea: "모든 시민은 기독교인이다"
 ARM_restore_armenian_empire_tt: "이제 §G구 아르메니아 영토를 통합§!할 수 있습니다"
 ARM_house_elections_warning_tt: "§R가문의 수장을 선택할 때 신중해야 합니다§!"
 ARM_bagratuni_house_chosen_tt: "§R바그라투니 가문§!이 국가의 통치 가문이 됩니다"
 ARM_savoya_house_chosen_tt: "§Y사보이아 가문§!이 아르메니아의 통치 가문이 됩니다!"
 ARM_kob_wait_tt: "우리가 §R혁명§!을 일으킬 필요가 있다고 판단할 때까지 러시아에서 개념 정당 '통합' 지지자들의 인기를 계속 §R높여§! 나갈 것입니다"
 ARM_kob_go_tt: "개념 정당 '통합'이 러시아에서 §R쿠데타 시도§!를 §Y개시§!합니다"
 ARM_legacy_of_fedayi: "페다이의 유산"
 ARM_legacy_of_fedayi_desc: "우리는 지난 세기에 튀르크의 폭정에 맞서 싸운 아르메니아 페다이들을 기려야 합니다. 전쟁을 준비해야 합니다. 그렇지 않으면 튀르크인들이 다시 우리를 공격하고 학살할 것입니다!"
 ARM_end_to_democr: "민주주의의 종말"
 ARM_end_to_democr_desc: "환상을 쌓는 일을 그만두고 아르메니아에 세워진 거짓 민주주의의 모든 보루를 무너뜨릴 때가 되었습니다."
 ARM_bring_sefily: "세필리얀의 복귀"
 ARM_bring_sefily_desc: "세필리얀은 우리 당의 신흥 계파가 러시아에 지나치게 유화적으로 변하기 전까지는 독실한 다슈나크 당원이었습니다. 우리는 NDP와 다시 통합해야 합니다!"
 ARM_venerate_nemesis: "네메시스 작전 기리기"
 ARM_venerate_nemesis_desc: "네메시스 작전은 아르메니아 혁명 연맹이 아르메니아 대학살을 저지른 오스만 가해자들과, 1918년 9월 바쿠에서 벌어진 아르메니아인 학살에 가장 큰 책임이 있는 아제르바이잔 민주공화국 관리들을 모두 암살하기 위해 시행한 계획이었습니다."
 ARM_nzhdehs_thought: "은제데 사상의 통합"
 ARM_nzhdehs_thought_desc: "가레긴 은제데는 어느 시점에 우리의 사회민족주의 노선에서 벗어나 다슈나크와 결별했습니다. 그러나 우리는 그의 사상을 우리 철학에 통합하고 그의 이미지를 당의 홍보에 활용하려 노력해야 합니다."
 ARM_soc_nationalism: "사회민족주의"
 ARM_soc_nationalism_desc: "근본적으로 다슈나크추툰은 사회주의 정당이자 아르메니아 민족주의 정당입니다. 20세기에 무슨 일이 있었든, 우리는 우리 이념을 더욱 강화하고 새로운 아르메니아를 건설해야 합니다!"
 ARM_just_like_eagle: "타론의 독수리처럼"
 ARM_just_like_eagle_desc: "은제데주의의 수사를 더욱 활용하면 더 많은 아르메니아 민족주의자를 우리 대열에 끌어들이고 진정한 민족 사회를 건설할 수 있습니다."
 ARM_harmonize_economy: "경제의 조화"
 ARM_harmonize_economy_desc: "우리는 자본가의 손에서 자본을 빼앗아, 노조와 산업 국유화를 통해 경제를 조화시켜야 합니다."
 ARM_scout_movem_ref: "스카우트 운동 개편"
 ARM_scout_movem_ref_desc: "아르메니아 스카우트 운동은 오랫동안 다슈나크의 후원과 지원을 받아 왔습니다. 이제 이들을 군사화하고 미래의 젊은 전사를 훈련시켜야 합니다."
 ARM_militarized_society: "군사화된 사회"
 ARM_militarized_society_desc: "우리 사회는 하나의 거대한 군대, 적을 분쇄하는 데 정신을 바친 사람들의 군대가 되어야 합니다."
 ARM_incr_contr_diaspora: "디아스포라 통제 강화"
 ARM_incr_contr_diaspora_desc: "튀르키예와의 대립 역사 전반과 민족의 생존 문제에서, 아르메니아인은 대규모 및 소규모 공동체 간의 공동 협력에 의지해 왔습니다. 자원 유격대 집단과 로비 이익에 초점을 둔 디아스포라의 영향력은 아르메니아 번영의 열쇠입니다."
 ARM_first_republic_decl: "제1공화국의 계승자"
 ARM_first_republic_decl_desc: "우리는 아르메니아 공화국의 정당한 계승자이며, 우리나라의 모든 땅을 되찾는 것은 우리의 신성한 의무입니다!"
 ARM_lebanon_coup: "레바논 다슈나크 지원"
 ARM_lebanon_coup_desc: "아르메니아 공동체는 레바논에서 상당히 정치적으로 활발합니다. 우리는 쿠데타를 일으키도록 레바논에 있는 우리 당 지부를 지원할 수 있습니다."
 ARM_prevail_of_east_looking_ideas: "동방 지향 사상의 우세"
 ARM_prevail_of_east_looking_ideas_desc: "우리는 정치적 의제를 위해 우리 자신만을 바라봐서는 안 됩니다. 서방의 영향력에 맞서 싸우려면 모두와 협력해야 합니다!"
 ARM_review_all_with_koch: "코차랸과의 동맹 갱신"
 ARM_review_all_with_koch_desc: "코차랸은 오랫동안 우리 당을 자신의 정치적 야망의 인질로 잡아 왔습니다. 이제 우리가 권력을 잡았으니, 그가 우리에게 어떤 쓸모가 있을지 결정할 수 있습니다. 코차랸은 아르메니아 정치에 상당한 영향력을 가지고 있습니다. 우리는 아르메니아에서 영향력을 얻기 위한 도구 중 하나로 그를 이용할 수 있습니다."
 ARM_ishkhan_saghat: "이시한 사가텔얀의 입장"
 ARM_ishkhan_saghat_desc: "이시한 사가텔얀의 입장은 사회주의 정책에 대해 훨씬 온건하지만, 친러시아 발언으로 매우 유명합니다."
 ARM_leftwing_origins: "좌익 기원의 수용"
 ARM_leftwing_origins_desc: "우리는 당의 뿌리를 기억하고 아르메니아적 특색을 지닌 마르크스주의 사상으로 돌아가야 합니다."
 ARM_marxist_thought_integr: "마르크스주의 사상의 통합"
 ARM_marxist_thought_integr_desc: "우리는 마르크스주의 사상을 우리의 사회민족주의 노선에 다시 통합하고 진정한 혁명 국가를 건설해야 합니다!"
 ARM_spirit_of_revol: "혁명 정신"
 ARM_spirit_of_revol_desc: "우리는 우리나라를 혁명의 전위로 만들어야 합니다. 튀르크 제국주의에 맞서는 혁명입니다!"
 ARM_revol_selhoz: "농업 혁명"
 ARM_revol_selhoz_desc: "우리나라는 스스로를 먹여 살릴 수 있어야 하며, 농업 목적으로 쓰이지 않는 땅이 많이 남아 있습니다. 이를 바로잡을 때입니다!"
 ARM_seize_oligs_stuff: "과두 세력 자산 압류"
 ARM_seize_oligs_stuff_desc: "과두 세력은 우리 국가에 복종해야 하며 그들의 자산은 국유화되어야 합니다!"
 ARM_letter_to_russia: "러시아에 보내는 서한"
 ARM_letter_to_russia_desc: "우리는 러시아에 이제 자유주의 서방에 맞선 저항에서 그들이 혼자가 아님을 보여 주어야 합니다!"
 ARM_soc_welfare: "사회 복지 국가"
 ARM_soc_welfare_desc: "아르메니아의 새로운 정치 의제는 모든 시민이 지원받는 완전한 사회 복지 국가여야 합니다."
 ARM_hold_oligs_gunpoint: "과두 세력에게 총구 겨누기"
 ARM_hold_oligs_gunpoint_desc: "어쩌면 과두 세력에게 너무 급진적으로 굴며 그들의 모든 자산을 국유화할 필요는 없을지도 모르지만, 그들의 세금이 높고 충분히 책임을 지도록 해야 합니다."
 ARM_pkk_negotiat: "PKK 지원"
 ARM_pkk_negotiat_desc: "우리 쿠르드 형제들의 투쟁은 지원받고 기려져야 합니다! 그들의 대의를 지원하는 데 모든 노력을 쏟아야 합니다."
 ARM_union_states: "연방 국가 제안"
 ARM_union_states_desc: "마침내 우리는 미래의 번영을 위해 연방 국가 사업에 참여하는 것을 시도해 볼 수 있습니다."
 ARM_armenia_dashnak_idea: "다슈나크의 아르메니아"
 ARM_dashnak_mitia_idea: "신 다슈나크 민병대"
 ARM_legacy_of_nzhden: "은제데의 유산"
 ARM_anti_imperialism: "반제국주의"
 ARM_dashnak_militarism: "다슈나크 군국주의"
 ARM_dashnak_increase_economic_growth_tt: "§Y우리의 경제 성장이 증가합니다!§!"
 ARM_great_trial_radi: "대시련을 향한 준비"
 ARM_class_strugle: "아르메니아 계급 투쟁"
 ARM_arm_revolt_dashnak: "아르메니아 혁명"
 ARM_arm_revolt_selhoz: "농업 혁명"
 ARM_social_welfare_reform_idea: "사회 복지 개혁"
 ARM_armenia_dashnak_idea_tt: "[ARM_Dashnak_AntiEmpire_loc][ARM_Dashnak_Militia_loc][ARM_Dashnak_Militarism_loc][ARM_Dashnak_Trial_loc][ARM_Dashnak_Legacy_loc][ARM_Dashnak_Class_loc][ARM_Dashnak_Selhoz_loc][ARM_Dashnak_Social_loc][ARM_Dashnak_Revoult_loc]"
