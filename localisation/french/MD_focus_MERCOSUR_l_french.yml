 MER_request_mercosur_associate_membership: "Demander le statut d'associé du MERCOSUR"
 MER_request_mercosur_associate_membership_desc: "Soumettre une pétition formelle au MERCOSUR pour le statut d'associé. Si le dossier va à son terme, nous entrerons dans le cercle extérieur du bloc après la période d'examen, ouvrant la voie à une coordination régionale plus étroite."
 MER_request_mercosur_full_membership: "Demander l'adhésion pleine au MERCOSUR"
 MER_request_mercosur_full_membership_desc: "Soumettre une pétition formelle pour entrer au MERCOSUR comme membre à part entière. Si le processus va à son terme, notre adhésion sera formalisée à la fin de la période d'examen, nous plaçant pleinement dans le bloc."
 MER_request_unasul_membership: "Demander l'adhésion à l'UNASUL"
 MER_request_unasul_membership_desc: "Déposer une candidature formelle à l'UNASUL. Si la pétition va à son terme, nous entrerons dans le cadre sud-américain à la fin de la période d'examen, plutôt que d'attendre une invitation bilatérale séparée."
 leave_UNASUL: "Quitter le Mécanisme de défense conjoint de l'UNASUL"
 leave_UNASUL_desc: "Se retirer de l'alliance militaire bâtie autour du Mécanisme de défense conjoint de l'UNASUL et mettre fin à notre participation à sa structure de défense commune."
 UNASUL_leave_tt: "Nous nous retirerons de l'alliance militaire du Mécanisme de défense conjoint de l'UNASUL."
 MER_full_membership_acceptance_hint_desc: "\n\n§YLe taux d'acceptation dépend de l'opinion de ce pays à votre égard, de votre influence sur lui et des progrès de l'arbre MERCOSUR !§!"
 MER_full_membership_invite_process_desc: "\n\n§YSi le pays accepte, il peut soit adhérer immédiatement comme membre à part entière, soit demander un paquet d'adhésion en trois étapes. Achever les trois décisions d'adhésion formalise l'appartenance par la voie de l'investissement.§!"
 MER_mercosur_associate_invite_accept_tt: "Le pays invité devient un §YÉtat associé du MERCOSUR§!. Chaque §YÉtat membre du MERCOSUR§! actuel gagne §G+1,00 %§! de §Ycroissance mensuelle de la productivité§! et §G+1,00 %§! de §Ymultiplicateur d'influence étrangère§!, et les deux parties reçoivent une notification."
 MER_mercosur_associate_invite_reject_tt: "Le pays invité refuse l'offre, ne peut plus être approché pendant §Y180 jours§!, et nous perdons §R15§! de §Ypouvoir politique§! une fois le refus livré."
 MER_mercosur_full_invite_accept_tt: "Le pays invité accepte l'offre. Il choisira ensuite entre §Yl'adhésion immédiate à part entière§! et une §Yvoie d'adhésion en trois étapes adossée à l'investissement§!, et les deux parties reçoivent une notification d'acceptation."
 MER_mercosur_full_invite_reject_tt: "Le pays invité refuse l'offre, ne peut plus être approché pendant §Y365 jours§!, et nous perdons §R25§! de §Ypouvoir politique§! une fois le refus livré."
 MER_unasul_invite_accept_tt: "Le pays invité rejoint l'§YUNASUL§!. Le modificateur dynamique §YÉtat membre de l'UNASUL§! est mis à jour pour tous les membres, croissant de §G+1,00 %§! de §Ygain de pouvoir politique§! et §G+1,00 %§! de §Ystabilité§!, et des événements de notification régionale sont envoyés."
 MER_unasul_invite_reject_tt: "Le pays invité refuse l'offre, ne peut plus être approché pendant §Y365 jours§!, et nous perdons §R15§! de §Ypouvoir politique§! une fois le refus livré."
 MER_full_membership_step_one_desc: "\n\n§YIl s'agit de l'étape d'adhésion 1 sur 3. Achever les trois décisions d'adhésion formalise le statut de membre à part entière.§!"
 MER_full_membership_step_two_desc: "\n\n§YIl s'agit de l'étape d'adhésion 2 sur 3. Achever les trois décisions d'adhésion formalise le statut de membre à part entière.§!"
 MER_full_membership_step_three_desc: "\n\n§YC'est la dernière étape d'adhésion. Une fois les trois décisions d'adhésion achevées, l'appartenance à part entière est formalisée.§!"
 MER_CHL_tariff_alignment: "Alignement tarifaire pour le Chili"
 MER_CHL_tariff_alignment_desc: "Financer la revue tarifaire et la coordination administrative nécessaires pour aligner davantage le Chili sur le régime douanier du bloc.$MER_full_membership_step_one_desc$"
 MER_CHL_customs_system_modernization: "Modernisation du système douanier pour le Chili"
 MER_CHL_customs_system_modernization_desc: "Fournir le financement et le soutien technique nécessaires pour moderniser l'administration douanière chilienne en vue d'une adhésion pleine au MERCOSUR.$MER_full_membership_step_two_desc$"
 MER_CHL_common_standards: "Soutenir l'adoption de normes communes au Chili"
 MER_CHL_common_standards_desc: "Soutenir le travail réglementaire et technique final nécessaire pour que le Chili adopte les normes communes du MERCOSUR.$MER_full_membership_step_three_desc$"
 MER_COL_tariff_alignment: "Alignement tarifaire pour la Colombie"
 MER_COL_tariff_alignment_desc: "Financer la revue tarifaire et la coordination administrative nécessaires pour aligner davantage la Colombie sur le régime douanier du bloc.$MER_full_membership_step_one_desc$"
 MER_COL_customs_system_modernization: "Modernisation du système douanier pour la Colombie"
