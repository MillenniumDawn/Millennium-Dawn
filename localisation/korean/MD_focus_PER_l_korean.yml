 PER_free_global_internet_2: "Global Internet"
 PER_tank_localization_name: "Production of the Zulfiqar Tank"
 PER_tank_localization_desc: "줄피카르는 이란의 주력 전차로, 군 연구 및 자급자족 담당 지상군 부사령관인 미르 유네스 마숨자데가 구상했습니다. 제4대 칼리파이자 최초의 시아파 이맘인 알리의 전설적인 검 줄피카르에서 이름을 따왔습니다. 최근 들어 생산이 줄어들었으나, 1996년에 시작된 줄피카르의 양산이 여전히 진행 중임을 알려야 합니다."
 PER_new_tank_localization_name: "Production of the Sasan Tank"
 PER_new_tank_localization_desc: "사산은 이란의 주력 전차입니다. 이슬람 침략으로 페르시아의 군사적 우위가 막을 내리기 전까지 이란을 다스린 전설적인 왕조 사산에서 이름을 따왔습니다. 오랜 세월이 흘러 기존 전차들이 고장 나기 시작했으므로 사산 전차의 양산에 착수해야 합니다."
 iranian_events.9.t: "Turkey-Iraqi Base Blown"
 iranian_events.9.d: "이라크에 있는 튀르키예 군사 기지가 조직적인 공격을 받아 튀르키예군에 많은 사상자가 발생했습니다. 아직 아무도 이 공격에 대한 책임을 주장하지 않았습니다."
 iranian_events.10.t: "Baku Gas Lines Blown"
 iranian_events.10.d: "아제르바이잔의 바쿠 가스관에서 사보타주 작전이 벌어져 일부 국가와의 무역에 차질이 빚어졌고 그들의 경제에도 피해가 발생했습니다. 아직 아무도 이 공격에 대한 책임을 공식적으로 주장하지 않았습니다."
 CENTO: "중앙조약기구 (CENTO)"
 PER_the_great_purge: "The Great Purge"
 PER_the_great_purge_desc: "통합된 이란이라는 비전을 훼손하는 자들과 부패에 연루된 자들을 겨냥하여 정부 내에서 숙청이 단행되어, 충성스럽고 효과적인 행정부를 보장할 것입니다."
 PER_resistance_movement: "Anti-Government Protests"
 PER_resistance_movement_desc: "As a direct response to recent actions taken by the government, protests have sprung up, threatening the legitimacy of the regime and the stability of the nation. How we choose to respond to these protests will determine whether they continue, or subside.\n\n§RRed§! will indicate government controlled areas, whereas §GGreen§! will indicate where protests have spread to."
 PER_cento_expand: "중앙조약기구 확장"
 PER_cento_expand_desc: "우리 동맹은 걸프협력회의에 대적하기 위하여 더 많은 회원국을 모집해야만 합니다. 그렇기에 우리는 확장 정책을 펼치며 주변의 민주주의 국가에게 적극적인 제안을 해야합니다.\n§C중앙조약기구§!에 가입 가능한 국가들은 현재 존재하는 국가들만이 아닙니다. 잠재적인 국가들에 대한 §H영향력이 30%§!가 된다면 그들을 초대할 수 있는 선택지가 생길 것입니다.\n\n§R우리는 현재 및 과거의 걸프협력회의 (GCC) 회원국들은 초대할 수 없습니다§!\n§C중앙조약기구 (CENTO)에 가입 가능한 국가들§!:\n-----------\n[TUR.GetFlag] §H터키§! [TAJ.GetFlag] §H타지기스탄§! [YEM.GetFlag] §H예멘§! [AFG.GetFlag] §H아프가니스탄§! [SYR.GetFlag] §H시리아§! [IRQ.GetFlag] §H이라크§! [PAK.GetFlag] §H파키스탄§!"
 PER_invite_yemen: "Invite [YEM.GetNameWithFlag]"
 PER_invite_pakistan: "Invite [PAK.GetNameWithFlag]"
 PER_interventionism_is_key: "Interventionism is Key"
 PER_interventionism_is_key_desc: "수동적인 이란은 취약한 이란입니다. 시리아에서 캅카스에 이르기까지 우리는 직접 혹은 대리 세력을 통해 이익을 지키기 위해 행동할 준비가 되어 있어야 합니다."
 PER_the_persian_gulf: "The Persian Gulf"
 PER_the_persian_gulf_desc: "수 세기 동안 남쪽의 바다는 우리의 이름을 지니고 있었습니다. 그것이 우리의 정체성과 자부심에 영원히 묶인 페르시아만임을 세상에 알릴 것입니다."
 PER_repairing_region: "지역 복원"
 PER_repairing_region_desc: "이슬람 공화국의 유산은 지역의 신뢰를 갈라놓았습니다. 신속히 움직여 다리를 다시 놓고 협력을 회복하며 중동에서 이란의 건설적인 존재감을 재확립해야 합니다."
 PER_return_cento: "CENTO 재건"
 PER_return_cento_desc: "냉전 시대의 동맹은 새 생명을 얻을 수 있습니다. 뜻을 같이하는 국가들의 지역 블록은 세계 초강대국들의 균형을 맞추고 지역 평화를 지킬 수 있습니다."
 PER_rajavis_cause: "라자비의 대의"
 PER_rajavis_cause_desc: "라자비의 대의는 언제나 이란 국민을 위한 인프라 개선과 교육 증진이었습니다. 우리는 현대화 사업에 투자하고, 번영하는 미래에 필요한 인프라를 구축하며, 모든 이란인이 교육을 받을 수 있도록 보장할 것입니다."
 PER_paramilitary_structure: "준군사 조직 구조"
 PER_paramilitary_structure_desc: "범이란주의당은 우리 운동이 조직적이고 신속히 행동할 준비가 되어 있도록 준군사 조직 구조를 채택했습니다. 이 구조 덕분에 우리는 규율 잡히고 준비된 병력으로 이란 국민과 그 이익을 수호할 수 있습니다."
 PER_forouhars_dream: "포루하르의 꿈"
 PER_forouhars_dream_desc: "정의와 자유와 단결에 기반한 이란이라는 포루하르의 비전은 지금도 우리에게 영감을 줍니다. 우리는 내부 분열과 외세의 통제에서 벗어난 현대적이고 번영하는 이란을 만들어 가며 그의 유산을 기립니다."
 PER_destroy_the_corrupt: "부패 척결"
 PER_destroy_the_corrupt_desc: "부패는 국가를 내부에서부터 무력하게 만들었습니다. 우리는 이 해악을 뿌리 뽑아 정부에 대한 국민의 신뢰를 회복하고, 자원이 소수가 아닌 모든 이란인의 복리를 위해 사용되도록 할 것입니다."
 PER_restore_order: "질서 회복"
 PER_restore_order_desc: "커지는 소요에 직면하여 아르테시가 나서서 질서를 회복할 때입니다. 우리는 국가에 평화와 안정을 가져오기 위해 필요한 모든 수단을 사용할 것입니다."
 PER_manage_opposition: "야권 관리"
 PER_manage_opposition_desc: "아르테시가 통제권을 쥔 지금, 우리의 권위를 위협하는 모든 반대 세력에 대처해야 합니다. 전략적 조치를 통해 우리 통치에 대한 모든 도전을 무력화할 것입니다."
 PER_consolidate_equipment: "장비 통합"
 PER_consolidate_equipment_desc: "아르테시의 전투 준비 태세를 보장하려면 군사 자원을 통합해야 합니다. 이는 장비를 간소화하고 병참 능력을 강화하는 것을 포함합니다."
 PER_legitimizing_our_rule: "우리 통치의 정당화"
 PER_legitimizing_our_rule_desc: "아르테시가 통제권을 장악한 만큼 우리는 통치의 정당성을 확보해야 합니다. 군과 정부 내의 단결을 도모함으로써 우리 정권의 안정을 보장할 것입니다."
 PER_arash_radar: "아라시 레이더"
 PER_arash_radar_desc: "외부 위협으로부터 국가를 지키기 위해 첨단 레이더 체계를 배치할 것입니다. 아라시 레이더는 모든 외국의 침입을 조기에 경보하여 신속하고 단호하게 대응하는 우리의 능력을 강화할 것입니다."
 PER_anti_corrupt_initiative: "반부패 구상"
 PER_anti_corrupt_initiative_desc: "부패는 군과 민간 구조 모두를 너무 오랫동안 괴롭혀 왔습니다. 우리는 아르테시와 정부 내의 부패를 뿌리 뽑는 구상을 시작하여 국가에 대한 충성이 흔들리지 않도록 할 것입니다."
 PER_majlis.1.t: "마즐리스 선거 결과"
 PER_majlis.1.d: "이번 주 초, 전국의 투표소가 문을 열어 [PER.GetFlag] 이란 국민이 대표를 선출했습니다. 많은 이들이 막 자리를 잡는 신임 정치인들의 의제를 기대하는 한편, 현직 의원들은 자문 의회에서 영향력을 유지하기 위해 분투하고 있습니다."
 PER_majlis.1.a: "국민이 뜻을 밝혔다"
 PER_majlis.2.t: "마즐리스 다음 토론 준비"
 PER_majlis.2.d: "마즐리스 의원들은 다음 주로 예정된 토론을 준비하고 있습니다. 일부 의원들은 아직 적절한 제안을 준비하지 못했다며 더 많은 시간을 요청하고 있습니다. 그러나 대부분은 이미 자신의 제안이 심의되도록 열정적으로 로비를 벌이고 있습니다."
 PER_majlis.2.a: "들어 보자"
 PER_majlis.2.b: "시간이 더 필요하다"
 PER_majlis.10.t: "자유주의 블록의 제안"
 PER_majlis.10.d: "우리는 모두에게 더 포용적인 국가를 만들고 평범한 시민의 일상을 사회적으로 개선하도록 국가를 개혁해 주기를 바라는 자유주의 블록의 제안을 수용하기로 했습니다."
 PER_majlis.10.a: "어떤 내용인지 보자"
 PER_majlis.11.t: "온건 보수 블록의 제안"
 PER_majlis.11.d: "우리는 반동 세력에게 더 세속적인 삶의 방식으로의 전환이 덜 급작스럽게 느껴지도록 국가를 개혁해 주기를 바라는 온건 보수 블록의 제안을 수용하기로 했습니다."
 PER_majlis.11.a: "어떤 내용인지 보자"
 PER_majlis.14.t: "극좌 블록의 제안"
 PER_majlis.14.d: "우리는 좌익 이념과 견해에 환멸을 느낀 이들이 그들의 신념과 사상에 합의하도록 국가를 개혁해 주기를 바라는 극좌 블록의 제안을 수용하기로 했습니다."
 PER_majlis.14.a: "어떤 내용인지 보자"
 PER_majlis.12.t: "사회주의 블록의 제안"
 PER_majlis.12.d: "우리는 노동자와 노동 계급 시민의 일상을 개선하도록 국가를 개혁해 주기를 바라는 사회주의 블록의 제안을 수용하기로 했습니다."
 PER_majlis.12.a: "어떤 내용인지 보자"
 PER_majlis.15.t: "무장 이슬람주의 블록의 제안"
 PER_majlis.15.d: "우리는 국가를 더 보수적이고 이슬람주의 지향적인 길로 되돌리도록 국가를 개혁해 주기를 바라는 무장 이슬람주의 블록의 제안을 수용하기로 했습니다."
 PER_majlis.15.a: "어떤 내용인지 보자"
 PER_majlis.16.t: "온건 이슬람주의 블록의 제안"
 PER_majlis.16.d: "우리는 남아 있는 강경파와 국내에서 부상하는 세속주의 집단 사이의 긴장을 완화하도록 국가를 개혁해 주기를 바라는 온건 이슬람주의 블록의 제안을 수용하기로 했습니다."
 PER_majlis.16.a: "어떤 내용인지 보자"
 PER_majlis.17.t: "자유지상주의 블록의 제안"
 PER_majlis.17.d: "우리는 경제에 대한 규제를 줄이고 정부 통제로부터 더 자유롭게 하도록 국가를 개혁해 주기를 바라는 자유지상주의 블록의 제안을 수용하기로 했습니다."
 PER_majlis.17.a: "어떤 내용인지 보자"
 PER_majlis.18.t: "녹색 블록의 제안"
 PER_majlis.18.d: "우리는 국가의 법과 생활 환경을 더 환경 친화적으로 만들도록 국가를 개혁해 주기를 바라는 녹색 블록의 제안을 수용하기로 했습니다."
 PER_majlis.18.a: "어떤 내용인지 보자"
 PER_majlis.19.t: "기업 블록의 제안"
 PER_majlis.19.d: "우리는 기업에 대한 규제를 덜 가혹하고 더 완화하도록 국가를 개혁해 주기를 바라는 기업 블록의 제안을 수용하기로 했습니다."
 PER_majlis.19.a: "어떤 내용인지 보자"
 PER_majlis.20.t: "군주주의 블록의 제안"
 PER_majlis.20.d: "우리는 국가의 독립을 보존하고 국익을 수호함으로써 국민 사이에 애국적이고 민족주의적인 가치를 다시 회복하도록 국가를 개혁해 주기를 바라는 군주주의 블록의 제안을 수용하기로 했습니다."
 PER_majlis.20.a: "어떤 내용인지 보자"
 PER_majlis.21.t: "극단적 민족주의 블록의 제안"
 PER_majlis.21.d: "우리는 이란 내에서 이슬람 이전의 가치와 국경을 회복하도록 국가를 개혁해 주기를 바라는 극단적 민족주의 블록의 제안을 수용하기로 했습니다."
 PER_majlis.21.a: "어떤 내용인지 보자"
 PER_majlis.22.t: "군부 블록의 제안"
 PER_majlis.22.d: "우리는 군과 그 역량에 대한 신뢰를 다시 회복하도록 국가를 개혁해 주기를 바라는 아르테시의 제안을 수용하기로 했습니다."
 PER_majlis.22.a: "어떤 내용인지 보자"
 PER_majlis.23.t: "개혁주의 블록의 제안"
 PER_majlis.23.d: "우리는 현 체제에 날이 갈수록 환멸을 느끼는 젊은 세대를 달래도록 국가를 개혁해 주기를 바라는 개혁주의자들의 제안을 수용하기로 했습니다."
 PER_majlis.23.a: "어떤 내용인지 보자"
 PER_majlis.24.t: "원칙주의 블록의 제안"
 PER_majlis.24.d: "우리는 1979년 아야톨라 호메이니가 국가에 심어 놓은 혁명 가치를 더 엄격하게 해석하여 채택하도록 국가를 개혁해 주기를 바라는 원칙주의자들의 제안을 수용하기로 했습니다."
 PER_majlis.24.a: "어떤 내용인지 보자"
 PER_majlis.30.t: "선거를 앞두고"
 PER_majlis.30.d: "마즐리스는 얼마간의 시간이 지난 후 다시 선거를 치를 준비를 하고 있으며, 전국의 이란인들은 이 역사적인 선거에서 선호하는 의원에게 투표해야 합니다."
 PER_majlis.30.a: "알겠다"
 PER_majlis.31.t: "마즐리스 의원들, 법 개정에 반대 표명"
 PER_majlis.31.d: "마즐리스 의원 여러 명이 중앙집권화 법의 개정을 '위험하고' '위헌적'이라고 부르며 공개적으로 반대를 표명했습니다. 많은 논쟁이 일어나면서, 여러 의원이 행정부가 다른 법을 개정하려 할 때 걸림돌을 만들겠다고 다짐했습니다."
 PER_majlis.31.a: "좋다, 타협할 수 있다"
 PER_majlis.32.t: "마즐리스 의원들, 법 개정에 반대 표명"
