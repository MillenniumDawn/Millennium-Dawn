l_korean:
 BRM_revisit_the_rohingya_issue: "로힝야 문제 들춰내기"
 BRM_revisit_the_rohingya_issue_desc: "자신들을 '로힝야'랴고 부르는 라카인 주의 이슬람교도들은 불교도 대다수를 적대했습니다. 이 적대감은 긴장, 폭력, 외국의 비난으로 이어졌으며 이를 막기 위해 주의를 기울여야합니다."
 BRM_the_path_of_intolerance: "비관용의 길"
 BRM_the_path_of_intolerance_desc: "소위 '로힝야'라 불리는 사람들은 원래 여기 살던 사람이 아닙니다. 우리는 그들을 방글라데시로 돌려보내야 합니다."
 BRM_support_buddhist_nationalists: "불교 국민주의자 지원"
 BRM_support_buddhist_nationalists_desc: "969운동과 다른 불교 민족주의 운동의 방식은 우리의 취향에 비해 너무 급진적일 수 있으나, 우리는 벵골인들보다는 그들의 편을 들어야합니다."
 BRM_expel_the_rohingya: "로힝야 추방"
 BRM_expel_the_rohingya_desc: "우리는 이전에도 '로힝야'의 추방을 시도했지만 이를 외압에 의해 포기하고 그들이 돌아올 수 있도록 허락했습니다. 이번에는 그렇지 않을 것입니다."
 BRM_the_path_of_tolerance: "관용의 길"
 BRM_the_path_of_tolerance_desc: "'로힝야'가 얼마나 라카인 주에 살았는지는 질문의 대상이 될 수 없습니다. 우리는 이들이 불교도인들을 적대시하더라도 그들을 받아들이면서 폭력을 끝내야합니다."
 BRM_affirm_religious_tolerance: "종교적 관용 허용"
 BRM_affirm_religious_tolerance_desc: "Myanmar is a country with no national religion, a proud mark of our multiculturalism. We should reaffirm this principle and guard against the dominance of Buddhism."
 BRM_reform_the_1982_citizenship_law: "1982년 시민권법 개정"
 BRM_reform_the_1982_citizenship_law_desc: "로힝야들은 1982년에 시민권을 박탈당했습니다. 이제 그들에게 시민권을 돌려줘야 합니다."
 BRM_address_the_democracy_question: "민주주의적 질문 제기"
 BRM_address_the_democracy_question_desc: "미얀마는 민주화를 하라는 압박을 국내외에서 받아오고 있습니다. 만약 우리가 살아남고 싶다면 이 문제를 해결해야합니다."
 BRM_pave_the_way_for_civilian_rule: "민간인 통치의 길을 열다"
 BRM_pave_the_way_for_civilian_rule_desc: "군사통치는 21세기에 더이상 지속가능하지 않습니다. 우리 국민이나 경제적 부를 가진 외국인 모두 이를 용납하지 않을 것입니다."
 BRM_reject_the_way_for_civilian_rule: "민간인 통치의 필요성 거부"
 BRM_reject_the_way_for_civilian_rule_desc: "타트 마도와는 항상 올바른 방향으로 나라를 이끌어왔습니다. 이를 두고 외국인이나 세뇌된 대중이 왈가왈부하면 안됩니다."
 BRM_propose_the_2008_constitution: "신헌법 비준"
 BRM_propose_the_2008_constitution_desc: "To pave the way for democratisation, a new constitution must be drafted. This constitution will seek to balance between civilian and military, maintaining the influence of both in politics."
 BRM_relax_media_censorship: "미디어 검열 완화"
 BRM_relax_media_censorship_desc: "소수의 언론인이 불평해봤자 우리에게 어떤 해를 끼칠 수 있겠습니까?"
 BRM_release_opposition_figures: "야당 의원석 공개"
 BRM_release_opposition_figures_desc: "아웅산 수치와 그녀의 지지자들은 그들의 끈기를 증명했습니다. 이제는 그들을 없애고자 했던 우리의 시도가 실패했음을 인정할 때입니다."
 BRM_allow_labour_strikes_and_unions: "노조 및 파업 허용"
 BRM_allow_labour_strikes_and_unions_desc: "As a government once dedicated to socialist principles, it is only right that we show ourselves to be on the side of the workers."
 BRM_cede_power_to_the_nld: "민주주의민족동맹(NLD)에게 권력 이양"
 BRM_cede_power_to_the_nld_desc: "민주주의 진영에게 권력을 넘길 때입니다. 우리가 작성한 헌법에 군의 독립성과 영향력을 보존해두었기 때문에 아무 문제 없을 겁니다."
 BRM_promote_civilian_enterprises: "민간기업 증진"
 BRM_promote_civilian_enterprises_desc: "정치적 자유와 함께 경제적 자유가 옵니다. 우리의 야심찬 기업가들을 격려할 때입니다."
 BRM_limit_promotion_of_social_liberties: "제한적 사회자유 증진"
 BRM_limit_promotion_of_social_liberties_desc: "군대가 영향력을 가지고 있는 한 완전한 자유화를 추구할 수 없지만 우리는 여전히 우리의 가혹한 법들 중 일부를 완화할 수 있습니다."
 BRM_end_isolationism: "고립주의 종식"
 BRM_end_isolationism_desc: "우리나라는 냉전에 대응하기 위해 스스로를 외부세계와 단절했습니다. 세계화된 21세기에는 이러한 전술은 더 이상 존속할 수 없습니다."
 BRM_announce_the_china_myanmar_economic_corridor: "중국-미얀마 경제 회랑"
 BRM_announce_the_china_myanmar_economic_corridor_desc: "우리는 중국의 '일대일로'프로젝트에 가입해 큰 혜택을 누릴 수 있습니다."
 BRM_increase_trade_with_asean: "아세안(ASEAN)과의 무역 증진"
 BRM_increase_trade_with_asean_desc: "우리의 친구, 이웃들과의 무역은 경제를 성장시키는 확실한 방법입니다."
 BRM_request_western_development_aid: "서구인들에게 개발 지원 요청"
 BRM_request_western_development_aid_desc: "민주화 이후 서구의 기부자들은 우리의 개발에 지원하겠다는 의지를 표명했습니다. 우리는 이것을 활용해야합니다."
 BRM_encourage_investment_from_western_firms: "서구 에너지 업체들의 관심을 사자"
 BRM_encourage_investment_from_western_firms_desc: "서양의 석유 및 가스회사는 국내의 석유, 가스 추출 능력을 발전시키는 데 도움이 될 겁니다."
 BRM_reach_out_to_the_US_for_military_protection: "군사 보호를 위해 미국에 연락"
 BRM_reach_out_to_the_US_for_military_protection_desc: "궁극적으로 중국은 동맹국이기 보다는 큰 위협이며 아세안이 중국을 견제할 수 있는 능력은 모호합니다. 우리는 대신에 미국의 품으로 들어가야 합니다."
 BRM_become_a_major_non_nato_ally: "주요한 비-NATO 동맹국의 일원이 되다"
 BRM_become_a_major_non_nato_ally_desc: "주요 비-NATO 동맹국이 되면 우리에게 큰 군사 및 기술적 혜택을 줄 겁니다."
 BRM_encourage_investment_from_asean_firms: "아세안 산업 업체들의 관심을 사자"
 BRM_encourage_investment_from_asean_firms_desc: "아세안은 저렴한 노동력과 유리한 규제로 우리나라에 유인할 수 있는 다양한 기업들이 있습니다."
 BRM_improve_security_cooperation_with_asean: "아세안과의 안보협력"
 BRM_improve_security_cooperation_with_asean_desc: "아세안은 반드시 서방과 동방을 상대로 잘 버틸겁니다."
 BRM_push_for_mutual_defence_agreements_between_asean_states: "아세안 상호 방위 협정"
 BRM_push_for_mutual_defence_agreements_between_asean_states_desc: "아세안은 더 통합될 수 있습니다. 우리는 아세안의 군사 협력을 강화하는 조약을 제안해야합니다."
 BRM_encourage_investment_from_chinese_firms: "중국 건설 회사들의 관심을 사자"
 BRM_encourage_investment_from_chinese_firms_desc: "Chinese companies are increasingly rivaling those of the West. We should court them with favourable business conditions."
 BRM_establish_a_military_partnership_with_china: "중국과 군사 파트너쉽 구축"
 BRM_establish_a_military_partnership_with_china_desc: "China has been a friend to us when no other country was. While their relations with rebel groups are not ideal, we can look past this to gain a strong ally."
 BRM_join_the_shanghai_pact: "중국과 동맹 형성"
 BRM_join_the_shanghai_pact_desc: "The time has come for a solidification of our ties with China. We should join their alliance to demonstrate our commitment to this friendship."
 BRM_undermine_the_influence_of_the_tatmadaw: "타트마도와의 영향력 훼손"
 BRM_undermine_the_influence_of_the_tatmadaw_desc: "Myanmar will never truly be free until the influence of the Tatmadaw is completely shaken off. We should begin to work against the military for the future of our country."
 BRM_accept_the_role_of_the_tatmadaw: "타트마도와의 지위 승인"
 BRM_accept_the_role_of_the_tatmadaw_desc: "우리는 타트마도와에게 많은 빛을 지고 있고 안보 문제에 대해 지속적인 도움을 필요로 합니다. 우리는 그들과 함께 지배하는 법을 배워야합니다."
 BRM_begin_calls_for_constitutional_revision: "헌법 개정 촉구"
 BRM_begin_calls_for_constitutional_revision_desc: "현행 헌법은 민간 통치로부터 타트마도우의 독립성을 보존하고 정부에서 그들의 대표성을 유지시키고 있습니다. 우리는 우리의 인맥을 통해 변화를 일으켜야합니다."
 BRM_target_the_corruption_of_military_enterprises: "군사 기업의 부정부패를 타겟으로"
 BRM_target_the_corruption_of_military_enterprises_desc: "The military gains significant revenue from enterprises that it owns. The corruption and nepotism of these enterprises is a perfect justification for our targeting of a key source of Tatmadaw power."
 BRM_mobilize_the_workers: "하층계급 동원"
 BRM_mobilize_the_workers_desc: "모든 혁명은 산업 노동자든 농촌 노동자든 억압받는 자들의 지지를 필요로 합니다. 우리도 마찬가지입니다."
 BRM_mobilize_the_students: "학생 동원"
 BRM_mobilize_the_students_desc: "학생들은 지난 수십년 동안 민주화 운동에서 중심적인 역할을 해왔습니다. 그들의 지원은 성공의 열쇠가 될 것입니다."
 BRM_mobilize_the_monks: "승려 동원"
 BRM_mobilize_the_monks_desc: "승려들은 과거에 타트마도우를 상대로 행진했습니다. 우리는 그들에게 다시 그렇게 하도록 설득할 수 있습니다. 승려들의 지원은 불교를 기반으로 둔 우리를 도와줄 것입니다."
 BRM_mobilize_the_ethnic_minorities: "소수민족 동원"
 BRM_mobilize_the_ethnic_minorities_desc: "돌립적인 소수 민족들이 인구의 32%를 차지하지만 중앙 정부의 정치에서 최소한의 역할만을 했습니다. 우리가 그들의 지지를 얻는다면 우리는 과거 어떤 정부도 성공적으로 활용하지 못했던 인구를 활용할 수 있습니다."
 BRM_launch_talks_on_a_new_constitution: "버마 헌법"
 BRM_launch_talks_on_a_new_constitution_desc: "변화에 대한 대중의 지지를 보여준 지금, 타트마도우가 정부에 개입할 권리를 주지 않는 헌법을 논의할 때입니다."
 BRM_end_the_role_of_the_tatmadaw_in_politics: "정치에서 타트마도우의 영향력 종식"
 BRM_end_the_role_of_the_tatmadaw_in_politics_desc: "버마의 민간 통치의 기반은 거의 완료되었습니다. 조금 남아있는 군대의 정부 영향력을 제거한다면 끝날 것입니다."
 BRM_suppress_critics_of_the_military: "군대에 대한 부정적 보도 억제"
 BRM_suppress_critics_of_the_military_desc: "자유화가 일어났지만 군은 기자들의 공개적인 비판을 용납할 수 없습니다. 우리는 침묵하거나 적어도 타트마도우의 분노를 자극 할 수 있는 사람들의 입을 막아야합니다."
 BRM_pursue_rapprochement_with_rebel_groups: "반란군들과의 화해 추구"
 BRM_pursue_rapprochement_with_rebel_groups_desc: "수십년 동안의 투쟁은 폭력을 통해 반란을 해결할 수 없다는 것을 보여주었습니다. 우리는 반란군에게 양보를 해야합니다."
 BRM_crush_the_rebel_groups: "반란군 박멸"
 BRM_crush_the_rebel_groups_desc: "우리나라의 단합을 확립하기 위해서는 '해방 지역'을 하나씩 없애기 위한 일련의 잘 조직된 켐페인이 필요합니다."
 BRM_affirm_protections_of_minority_culture_and_language: "소수 문화 및 언어 보존"
 BRM_affirm_protections_of_minority_culture_and_language_desc: "Ethnic minorities feel threatened by the domination of Buddhism and Burman culture. We should assure them that their cultures will be respected."
 BRM_promise_autonomy: "자치권 보장"
 BRM_promise_autonomy_desc: "대다수의 반란군은 독립이 아니라 더 큰 자치권을 원합니다. 이것은 우리가 수용할 수 있는 요구입니다."
 BRM_establish_a_federated_state: "연방국가 수립"
 BRM_establish_a_federated_state_desc: "우리나라가 통합되는 것은 현실적이지 않습니다. 대신 연방제를 통해 단합합시다."
 BRM_proclaim_an_end_to_the_insurgency: "반란의 종식 선포"
 BRM_proclaim_an_end_to_the_insurgency_desc: "우리의 행동은 지속적인 평화를 가져왔고, 밝은 미래만이 남았습니다."
 BRM_proclaim_a_permanent_end_to_ceasefire_initiatives: "영구적인 정전 계획"
 BRM_proclaim_a_permanent_end_to_ceasefire_initiatives_desc: "우리가 정기적으로 다양한 반군들과 휴전을 추구하는 것은 약하다고 보여집니다. 우리는 협상가능성을 영원히 배제해야합니다."
 BRM_strike_the_karen: "카렌 공격"
 BRM_strike_the_karen_desc: "카렌민족연합은 버마의 독립에 반대해 영국편을 들어 우리와 싸운 이후로 국가의 적이 되었습니다. 카렌민족연합 전국 연합의 지속적인 존재는 역사적 배신의 잔재이며 멸망시켜야합니다."
 BRM_strike_the_kachin: "카친 공격"
 BRM_strike_the_kachin_desc: "To our north the Kachin Independence organization poses a significant threat as they possess the second largest rebel army in the entire country. Nonetheless, if we focus our attention on them they will be unable to defend their resource-rich territories."
 BRM_strike_the_shan: "샨 공격"
 BRM_strike_the_shan_desc: "샨 주는 버마의 심장부에 너무 가까습니다. 따라서 샨 주 복원 위원회와 다른 샨 단체들에 우리의 모든 역량을 쏟을 필요가 있습니다."
 BRM_turn_on_the_united_wa_state_army: "와방연합군 공격"
 BRM_turn_on_the_united_wa_state_army_desc: "연합 와 주 군(UWSA)은 과거에 우리와 함께 싸웠기 때문에 그들을 믿을 수 없습니다. 나라에서 가장 큰 반군 세력이자 중국과 긴밀한 관게가 있기 때문에 우리는 우리의 통제 밖에 있는 이런 강력한 힘이 나라 내부에 있으면 통합된 나라를 만들 수 없습니다. 우리는 그들이 우리의 권한에 복종하도록 강요해야합니다."
 BRM_internal_colonialism: "내부 식민주의"
 BRM_internal_colonialism_desc: "이제 우리는 자원을 수출할 수 있는 국가가 될 수 있습니다."
 BRM_imprison_opposition_figures: "야당 인물 투옥"
 BRM_imprison_opposition_figures_desc: "우리는 NLD 회원들이 거리에 나와서 우리의 권위를 무시하는 것을 두고 볼 수 없습니다. 그들을 투옥하고 목소리를 침묵시킵시다."
 BRM_crackdown_on_protests: "시위 단속"
 BRM_crackdown_on_protests_desc: "어려울 것입니다만 수행해야만 합니다. 만일 우리가 민주주의 시위에 대응할 수 있다면 사람들은 거리에 나오지 않고 우리의 통치는 보장될 것입니다."
 BRM_leave_asean: "아세안에서 떠나기"
 BRM_leave_asean_desc: "ASEAN will not allow us to follow our 'dictatorial' approach. We should leave the organization to show what we think of their hypocritical and ineffective behaviour."
 BRM_establish_direct_military_rule: "군대의 지배를 공고히 하다"
 BRM_establish_direct_military_rule_desc: "우리가 충분히 활동하지 않았기 때문에 미얀마에서의 권위주의는 실패했습니다. 우리는 사회 모든 측면에 대한 우리의 통제를 확장해야합니다."
 BRM_affirm_the_superiority_of_authoritarian_capitalism: "권위주의적 자본주의 확립"
 BRM_affirm_the_superiority_of_authoritarian_capitalism_desc: "서구와 자국의 사회활동가들은 우리의 경제를 자유화하고 외부 세계에 노출시킬 것입니다. 그러나 한국과 중국의 성공사례는 국가의 강력한 시장 주도에서 경제성장이 나온다는 것을 보여줍니다. 우리가 경제를 성공적으로 발전시킨다면 국민들은 우리의 독재를 잊고 우리를 합법적인 통치자로 받아들일 겁니다."
 BRM_increase_the_tatmadaws_role_in_the_economy: "경제에서의 타트마도우의 역할"
 BRM_increase_the_tatmadaws_role_in_the_economy_desc: "타트마도우는 항상 국가의 발전에 전념해 왔습니다. 경제에 대한 우리의 직접적인 참여는 어떤 진보적 시장 세력보다 더 국가의 성장에 도움이 될 것입니다."
 BRM_construct_military_industries: "군사 산업체 설립"
 BRM_construct_military_industries_desc: "군대가 더 많은 사람들이 고용할수록 생계를 위해 군대에게 의존하는 사람들이 늘어납니다. 군사 산업체를 설립하는 것은 우리의 군대, 경제 및 대중들의 지지를 강화하는 데 도움이 될 것입니다."
 BRM_achieve_acceptance_of_military_rule: "군대의 지배"
 BRM_achieve_acceptance_of_military_rule_desc: "많은 노력이 필요했지만 결국 사람들은 우리의 지배를 받아들이기로 했고 이제 우리의 지배는 반석 위에 올랐습니다."
 BRM_distract_attentions_abroad: "해외로의 관심 분산"
 BRM_distract_attentions_abroad_desc: "If we are to hold on to our admittedly loose grip on power, we should focus the attention of our domestic audience on outsiders."
 BRM_reject_foreign_interference: "외국의 간섭 거부"
 BRM_reject_foreign_interference_desc: "우리는 내정에 대한 외세의 개입을 비난하여 국민들의 애국심에 호소할 수 있습니다."
 BRM_promote_anti_thai_rhetoric: "반-타이 연설"
 BRM_promote_anti_thai_rhetoric_desc: "우리 국민과 태국인 사이의 적대감은 여전히 높습니다. 우리가 더 큰 적대감을 조장하는 데는 그리 큰 시간이 걸리지 않을 것입니다."
 BRM_provoke_clashes_on_the_thai_border: "태국 국경에서 충돌"
 BRM_provoke_clashes_on_the_thai_border_desc: "국경 분쟁은 비교적 자주 발생합니다. 국경 부대에 대한 명령을 통해 이러한 사건을 훨씬 더 크게 만들 수 있습니다."
 BRM_strike_our_age_old_enemy: "우리의 앙숙을 공격하라"
 BRM_strike_our_age_old_enemy_desc: "이제 우리에게 명분이 있으니 태국을 공격할 때가 되었습니다. 우리의 지지도를 유지하는데 우리가 증오하는 적과 전쟁하는 것보다 더 좋은 방법이 어디있겠습니까? 그러나 다른나라들이 태국의 방어를 도와준다면 우리의 작전계획을 틀어지게 만들 수 있습니다."
 BRM_criticize_chinas_meddling: "중국의 참견 비판"
 BRM_criticize_chinas_meddling_desc: "UWSA와 다른 반란군에 대한 중국의 지원은 우리 정부의 권위를 훼손합니다. 중국에게서 우리의 국가 주권을 지키기 위한 노력을 해야합니다."
 BRM_undermine_chinese_influence_in_the_border_regions: "반란군에 대한 중국의 지원 약화"
 BRM_undermine_chinese_influence_in_the_border_regions_desc: "우리는 정보기관을 이용해 반란군에 대한 중국의 지원을 방해하도록 지시 할 수 있습니다. 이는 당연히 우리의 강력한 이웃의 분노를 초래할 것이지만, 주권을 지키기위해 이정도는 감수해야합니다."
 BRM_ultimatum_to_china: "중국에 대한 최후통첩"
 BRM_ultimatum_to_china_desc: "중국은 우리의 독립을 존중할지 아니면 전쟁을 하고 싶은지 선택해야합니다. 당연히 이러한 위협은 우리 군대가 중국에게 위협을 가할 만큼 강화된 경우에만 가능한 방법입니다."
 BRM_seek_closer_ties_to_china: "중국과의 긴밀한 관계 추구"
 BRM_seek_closer_ties_to_china_desc: "우리가 주권에 관심이 있는 만큼, 우리는 우리의 강력한 후원자를 화나게 할 여유가 없습니다. 대신 중국과의 관계를 이용해 정부를 보호하는 데 이용할 수 있습니다."
 BRM_promote_chinese_investment: "중국 투지 증진"
 BRM_promote_chinese_investment_desc: "중국의 투자는 우리 나라에 고용과 부를 가져다 줄 것입니다. 이것은 사람들이 민주주의와 같은 사소한 우려를 잊게 할 것입니다."
 BRM_secure_chinese_assistance_in_crushing_dissent: "반대파 분쇄를 위한 중국의 도움 확보"
 BRM_secure_chinese_assistance_in_crushing_dissent_desc: "China's security apparatus is potentially the most effective in the world. We could use their expertise to help silence critics, monitor our population, and crush demonstrations."
 BRM_give_china_preferential_trade_agreements: "중국 특혜 무역 협정 제공"
 BRM_give_china_preferential_trade_agreements_desc: "중국의 지원은 대가없이 오진 않습니다. 그들은 우리가 다른 무역파트너들보다 본인을 특별대우해주기를 원합니다. '다른 무역파트너들은 어떻게 하라고?' 라고 대답합니다."
 BRM_request_chinese_protection: "중국 보호 요청"
 BRM_request_chinese_protection_desc: "우리의 군사정부는 잠재적인 개입의 대상입니다. 우리는 생존을 보장받기 위해서 중국에게 우리 주권 일부를 줘야합니다. 이는 필요한 일입니다."
 BRM_focus_on_the_tatmadaw: "세계적 수준의 타트마도우"
 BRM_focus_on_the_tatmadaw_desc: "미얀마는 내부와 외부 모두에서 많은 위험에 직면해있습니다. 우리의 가장 중요한 기관인 타트마도우에 중점을 두어 보다 전문적이고 유능하게 개혁하는 것은 당연한 일입니다."
 BRM_inward_orientation: "내부로"
 BRM_inward_orientation_desc: "At home, Myanmar possesses both great strength and great weakness. We lasted for many decades despite international isolation, but still need to unite our deeply divided country."
 BRM_defend_our_borders: "국경 방어"
 BRM_defend_our_borders_desc: "현재 침략의 위험이 높지는 않지만, 우리는 모든 사태에 대비해야 합니다."
 BRM_fortify_the_bangladeshi_border: "방글라데시 국경 요새화"
 BRM_fortify_the_bangladeshi_border_desc: ""
 BRM_fortify_the_thai_border: "태국 국경 요새화"
 BRM_fortify_the_thai_border_desc: "역사적으로 적인 태국과의 충돌은 이 위험한 국경에서 매우 자주 발생합니다. 마약, 무기, 사람들도 자유롭게 움직입니다."
 BRM_fortify_the_indian_border: "인도 국경 요새화"
 BRM_fortify_the_indian_border_desc: ""
 BRM_fortify_the_chinese_border: "중국 국경 요새화"
 BRM_fortify_the_chinese_border_desc: "10,000명의 중국 민족주의자 군대가 중국내전의 여파로 이 국경을 넘어 10년 넘게 우리 영토의 일부를 점령한 이래로 우리의 군사전략가들은 이 국경의 방어를 최우선 과제 중 하나로 여겼습니다."
 BRM_improve_domestic_designs: "국내 개선"
 BRM_improve_domestic_designs_desc: "Self-sufficiency has always been a part of our identity. We should develop our technologies to preserve our autonomy."
 BRM_ma_rifle_series: "MA 소총 시리즈"
 BRM_ma_rifle_series_desc: "The MA rifle series is our take on infantry rifles of the 20th century."
 BRM_confirm_the_dominance_of_the_army: "육군의 지배 확정"
 BRM_confirm_the_dominance_of_the_army_desc: "The army has been and will always be the Tatmadaw's most important branch. We see no reason to try to change that now or ever."
 BRM_improve_our_army_doctrine: "군대 교리 개선"
 BRM_improve_our_army_doctrine_desc: ""
 BRM_bolster_officer_training: "장교 교육 강화"
 BRM_bolster_officer_training_desc: "우리의 장교들은 지난 수십년 동안 세계 최고 중 하나가 되기 위해 노력해 왔습니다. 훈련에 더 많은 노력을 기울인다면, 사령관의 질에서는 우리보다 선진국인 나라들과 경쟁할 수 있습니다."
 BRM_improve_counter_insurgency_techniques: "화폐 제조 기술 개선"
 BRM_improve_counter_insurgency_techniques_desc: "현재 가장 심각한 위험은 우리 국경 지역의 민족 반군으로 이들을 뿌리뽑기는 너무나도 어렵습니다. 우리가 이기기 위해서는 반군을 상대하는 전략을 개선해야 성공할 것입니다."
 BRM_outward_orientation: "외부로"
 BRM_outward_orientation_desc: "Opportunities and threats alike abound beyond Myanmar's borders. We must pursue the former and guard against the latter."
 BRM_strengthen_the_other_arms: "육군이외 부대 강화"
 BRM_strengthen_the_other_arms_desc: "육군은 여전히 중요합니다. 그러나 더 균형잡힌 군대는 우리가 반군을 넘는데 더 효과적일 수 있습니다."
 BRM_bolster_the_navy: "해군 강화"
 BRM_bolster_the_navy_desc: ""
 BRM_improve_our_naval_doctrine: "해군 교리 개선"
 BRM_improve_our_naval_doctrine_desc: ""
 BRM_construct_naval_bases: "해군 기지 건설"
 BRM_construct_naval_bases_desc: ""
 BRM_construct_ports: "조선소 건설"
 BRM_construct_ports_desc: ""
 BRM_bolster_the_air_force: "Bolster the Air Force"
 BRM_bolster_the_air_force_desc: ""
 BRM_improve_our_air_doctrine: "항공 교리 개선"
 BRM_improve_our_air_doctrine_desc: ""
 BRM_construct_air_bases: "공군 기지 건설"
 BRM_construct_air_bases_desc: ""
 BRM_cooperate_with_foreign_powers: "외국과의 협력"
 BRM_cooperate_with_foreign_powers_desc: "미얀마는 자랑스러운 나라이지만, 우리 스스로 할 수 있는 일이 제한적이라는 것을 이해해야 합니다. 우리는 외부의 지원이 필요합니다."
 BRM_increase_cooperation_with_china: "중국과의 협력 강화"
 BRM_increase_cooperation_with_china_desc: "중국은 우리의 가장 크고 강력한 위협 중 하나입니다. 그러나 이것이 그들의 협력을 추구하는 이유입니다."
 BRM_chinese_air_power: "중국 공군력"
 BRM_chinese_air_power_desc: "새로운 중국 항공기는 우리의 노후화된 항공기를 대체해 줄 것입니다."
 BRM_increase_cooperation_with_asean: "아세안과의 협력 강화"
 BRM_increase_cooperation_with_asean_desc: "우리는 중국의 부상에 맞서야 합니다. 아세안의 동맹국들은 이 와 관련하여 우리를 도울 수 있습니다."
 BRM_increase_cooperation_with_south_korea: "한국과의 협력 강화"
 BRM_increase_cooperation_with_south_korea_desc: "한국은 중요한 무역 상대이자 우리가 모방할 수 있는 경제 강국입니다. 지금까지 남북이 균형을 이루고 있지만, 지금은 남한과 더 친밀해질 때 입니다."
 BRM_increase_cooperation_with_north_korea: "북한과의 협력 강화"
 BRM_increase_cooperation_with_north_korea_desc: " 북한의 자급자족과 외국의 간섭에 대한 반항은 우리가 존경해야 할 일입니다. 우리는 이로부터 한국보다 더 많은 것을 배울 수 있습니다. 지금까지 남북이 균형을 이루고 있지만, 지금은 북한과 더 친밀해질 때 입니다."
 BRM_singaporean_armour: "싱가포르 군사기술"
 BRM_singaporean_armour_desc: "Singapore is widely known for its advanced weapons technology. Some of their APCs and IFVs will go a long way in modernizing our military."
 BRM_south_korean_naval_power: "한국 해군력"
 BRM_south_korean_naval_power_desc: "한국의 지원은 우리의 해군의 범위를 확장하고 주변지역을 확보하는 데 도움이 될 것입니다."
 BRM_north_korean_missiles: "북한 미사일"
 BRM_north_korean_missiles_desc: "북한의 지원을 받읍시다. 그들의 압도적인 화력은 얕볼 것이 아닙니다."
 burma_focus: "미얀마 중점계통도"
 Burma.1.t: "미얀마의 보호 모색"
 Burma.1.d: "The government of Myanmar, wary of China's growing ambitions and pessimistic about ASEAN's ability to contain these ambitions, has come to us to address their concerns. Should we grant them the assistance that they desire?"
 Burma.1.a: "그래, 우리는 중국을 억제해야 돼."
 Burma.1.b: "아니오, 미얀마는 동맹으로서 가치가 없다"
 Burma.2.t: "우리의 요청을 수락한 미국!"
 Burma.2.d: "우리는 잠재적 적에 맞서 더욱 안전하게 서 있습니다."
 Burma.2.a: "기쁘군!"
 Burma.3.t: "우리를 버리기로 한 미국..."
 Burma.3.d: "미국인들은 자연스럽게 자신들이 우리에게 과분하다고 생각하며 우리의 보호 요청을 거절했습니다."
 Burma.3.a: "차라리 중국에 몸을 맡겼어야 했을지도 모른다…"
 Burma.4.t: "미얀마, 아세안 상호방위협정 제안"
 Burma.4.d: "중국의 남중국해 행동과 일부 버마 반군 단체에 대한 지원에 자극받아, [Owner.GetLeader]은(는) 외부 위협에 대비하고 아세안의 내부 결속을 강화하기 위해 아세안 회원국들에게 상호방위조약에 합의할 것을 촉구했습니다. 이 구상에 찬성 또는 반대 표를 던질 수 있습니다."
 Burma.4.a: "이 조약에 서명해야 한다."
 Burma.4.b: "이 문서에 서명을 보탤 수 없다."
 Burma.5.t: "새로운 정치적 무게 중심?"
 Burma.5.d: "타트마도가 [BRM.GetAdjective] 정부에서의 영향력 있는 지위를 내놓으면서, 새로운 이익 단체들이 우리 정치에서 더 큰 역할을 모색할 기회가 생겼습니다. 정상에 오르는 이가 누구든 우리의 성향에 맞도록 이 새로운 집단 중 하나를 지지하는 것이 우리의 이익입니다."
 Burma.5.a: "농민을 지원한다"
 Burma.5.b: "노동조합을 지원한다"
 Burma.5.c: "중소기업 소유주를 지원한다"
 Burma.6.t: "포화 속의 동맹"
 Burma.6.d: "우리의 동맹인 와족이 미얀마 중앙 정부의 공격을 받았습니다. 우리는 양측 모두와 긴밀한 관계를 맺고 있으나, 정부가 공세를 개시하기 전에 우리와 협의조차 하지 않은 침략 행위는 용납할 수 없습니다. 더욱이 와족이 이번 맹공에 무너진다면 우리는 골든 트라이앵글 지역의 핵심 전략적 파트너를 잃게 될 것입니다."
 Burma.6.a: "우리는 아무것도 할 수 없다."
 Burma.6.b: "무기를 보내라."
 Burma.6.c: "그들에게 병력을 보내라"
 Burma.7.t: "미얀마의 보호 모색"
 Burma.7.d: "서방의 간섭과 내부 체제 전복 세력을 경계하는 미얀마 정부가 우려를 해소하고자 우리를 찾아왔습니다. 그들이 원하는 지원을 제공해야 하겠습니까?"
 Burma.7.a: "그렇다, 서방을 몰아내야 한다"
 Burma.7.b: "아니다, 미얀마는 동맹으로 삼을 가치가 없다"
 Burma.8.t: "우리의 요청을 수락한 중국!"
 Burma.8.d: "우리는 잠재적 적국에 맞서 더욱 굳건히 서 있습니다."
 Burma.8.a: "기쁘군!"
 Burma.9.t: "우리를 버린 중국…"
 Burma.9.d: "중국은 당연하다는 듯 스스로를 우리보다 우월하다고 여기며 우리의 보호 요청을 거절했습니다."
 Burma.9.a: "차라리 미국에 투항했어야 했을지도 모릅니다…"
 Burma.10.t: "우리를 지킬 태세를 갖춘 아세안"
 Burma.10.d: "아세안 상호방위조약이 체결됨에 따라, 외부 침략자의 공격이 있을 경우 다른 아세안 국가들이 우리를 도울 것이라는 사실에 이제 안심할 수 있습니다."
 Burma.10.a: "듣기 좋군"
 Burma.11.t: "미얀마의 주권 존중 요구"
 Burma.11.d: "미얀마의 외교 사절이 우리를 찾아와 UWSA를 비롯해 국경 내에서 활동하는 반군 단체에 대한 지원을 중단하라고 요구했습니다. 이들 단체에 대한 우리의 지원은 국경 안보에 중요하며 미얀마군의 전력은 우리와 비교할 수 없을 만큼 약하지만, 그럼에도 이 문제로 전쟁의 위험을 무릅써야 하겠습니까?"
 Burma.11.a: "전쟁은 무슨 수를 써서든 피해야 한다."
 Burma.11.b: "그들의 위협은 가소롭다!"
 Burma.12.t: "평화를 택한 중국"
 Burma.12.d: "중국은 다행히도 우리의 주권 사안에 대한 간섭을 중단하기로 동의했고, 그 덕분에 우리의 분노를 피할 수 있었습니다."
 Burma.12.a: "현명한 자들이군."
 Burma.13.t: "전쟁을 원하는 중국!"
 Burma.13.d: "중국은 우리 면전에서 비웃으며 최후통첩을 공공연히 조롱했고, 우리 영토 내 반군 단체에 대한 지원을 계속하고 있습니다!"
 Burma.13.a: "필요한 것은 전쟁이다."
 Burma.14.t: "미얀마의 군사 동맹 요청"
 Burma.14.d: "우리와 [BRM.GetNameDef] 정부 사이의 외교적 근접성이 커지면서, 미얀마 정부가 흥미로운 제안을 가지고 접근해 왔습니다. 남부 국경에 군사 동맹국을 두는 것은 유용할 수 있으나, 미얀마와 공식 동맹을 맺으면 우리의 지정학적 야망에 대한 지역의 불안이 커질 수 있습니다."
 Burma.14.a: "우리는 함께합니다!"
 Burma.14.b: "미얀마는 동맹으로 삼을 가치가 없다..."
 Burma.15.t: "중국의 군사 동맹 동의!"
 Burma.15.d: "우리는 두 나라를 어떤 상황에서도 하나로 묶어 줄 군사 협정을 성공적으로 협상해 냈습니다."
 Burma.15.a: "우리의 우정은 영원할 것입니다!"
 Burma.16.t: "중국의 우리 제안 거부!"
 Burma.16.d: "중국은 우리가 동맹을 맺을 만한 상대가 아니라고 판단하고, 우리의 사안에 관여하고 싶지 않다고 주장했습니다."
 Burma.16.a: "실망스럽습니다..."
 Burma.17.t: "민주주의 문제"
 Burma.17.d: "우리나라는 외부 세계로부터 점점 더 큰 압박을 받고 있습니다. 각국은 우리의 독재 체제를 계속 주시하고 있으며, 이제 우리가 나아갈 길을 선택해야 할 때가 되었습니다."
 Burma.17.a: "머지않아 선택해야 합니다..."
 Burma.18.t: "1982년 시민권법"
 Burma.18.d: "1982년 시민권법은 로힝야 사람들이 미얀마의 시민으로 인정받는 것을 적극적으로 막기 위해 제정되었습니다. 이 법의 조항은 억압적이며, 위대한 우리 국가의 사람들이 스스로를 우리의 일원이라고 느끼지 못하게 막고 있습니다. 정부는 오늘 이 법을 개정하여 로힝야가 위대한 우리 국가의 시민권을 얻을 수 있도록 할 때가 되었다고 발표했습니다. 그들은 언제나 우리 국민의 일부일 것입니다.\n"
 Burma.18.a: "우리에게 위대한 한 걸음"
 Burma_News.1.t: "미얀마의 새로운 행보가 시작되는가?"
 Burma_News.1.d: "The military government today announced that the decades-long process of drafting a new constitution has finally been completed. While the new constitution marks a liberalising shift in Myanmar's politics, it nonetheless preserves the military's continued role in government, such as by ensuring its possession of 25% of the seats in parliament. It remains to be seen whether this constitution will be a vehicle for democratisation or a tool for continued military domination."
 Burma_News.1.a: "축하를 해야할 일인가?"
 Burma_News.2.t: "아웅산 수 치 석방"
 Burma_News.2.d: "After an extended period of resistance, the military government has finally caved in to local and international pressure to release Aung San Suu Kyi from house arrest. This momentous decision follows the release of other prominent opposition politicians."
 Burma_News.2.a: "노벨 평화상의 주인공께서 걸음하신다."
 Burma_News.3.t: "미얀마에서 집권한 NLD"
 Burma_News.3.d: "놀라운 사태의 전환으로 NLD가 정권을 잡으면서 50년 가까이 이어진 군부 통치가 막을 내렸습니다. 그러나 논평가들은 NLD가 과연 국가를 다른 방향으로 이끌 수 있을지, 아니면 군부가 막후에서 계속 권력을 행사할지를 두고 여전히 의견이 갈리고 있습니다."
 Burma_News.3.a: "언젠가는 일어날 일이었다."
 Burma_News.4.t: "지배권을 둘러싼 조용한 투쟁"
 Burma_News.4.d: "미얀마 민간 정부가 국군인 탓마도의 정치적 영향력을 약화하려 시도하고 있다는 보도가 나오기 시작하고 있습니다. 군부의 물리적 전력은 의심할 여지 없이 우월하지만, 분석가들은 민간 정부가 군부에 대한 대중의 지지를 약화하고 대중 시위를 지원하는 방식으로 군부를 간접적으로 압박하려 할 것으로 예측합니다. 탓마도가 이러한 움직임에 어떻게 대응할지는 여전히 불확실합니다."
 Burma_News.4.a: "이 나라 앞에는 불확실한 길이 놓여 있다."
 Burma_News.5.t: "평화의 종식"
 Burma_News.5.d: "[BRM.GetLeader]은(는) 오늘 정부가 중앙 정부와 싸우는 여러 반군 단체와 더 이상 휴전을 추진하지 않겠다고 선언했습니다. 이는 반군 단체와 휴전과 충돌을 반복해 온 정부의 통상적인 정책 주기에서 중대한 전환을 의미합니다."
 Burma_News.5.a: "전쟁이 다가오고 있다"
 Burma_News.6.t: "[BRM.GetName]"
 Burma_News.6.d: "이전에 미얀마 연방으로 알려졌던 나라는 공식적으로 연방국가로 전환되었으며, 이는 국경 지역을 지배하는 민족 소수자들에 대한 정부의 태도가 큰 변화를 겪었음을 의미합니다. 정부는 이전에 샨, 카렌, 카친 주를 포함한 이러한 지역들에 대한 실질적인 자치를 부여하는 것을 거부했으나, 수년 간의 갈등 끝에 정부는 이 정책이 장기적으로 지속 가능하지 않다는 것을 결국 인정하게 되었습니다."
 Burma_News.6.a: "예견된 일이었다"
 Burma_News.7.t: "미얀마의 시위 탄압"
 Burma_News.7.d: "최근 몇 주 동안 미얀마에서 나오는 정보는 드물었으나, 정부가 평화적인 민주화 시위에 폭력으로 대응하여 엄청난 규모의 탄압을 개시했다는 사실이 분명해졌습니다. 서방 지도자들과 국제연합 사무총장은 미얀마의 폭력을 공개적으로 규탄했습니다. 중국과 러시아는 이번 탄압에 대해 공식적으로 논평하지 않았지만, 폭력을 규탄하는 안전보장이사회 결의안에는 거부권을 행사했습니다."
 Burma_News.7.a: "끔찍하다!"
 Burma_News.7.b: "언젠가는 일어날 일이었다"
 Burma_News.8.t: "진압된 반란"
 Burma_News.8.d: "[BRM.GetLeader]은(는) 오늘 미얀마의 마지막 소수민족 반란이 소탕되었다고 발표했습니다. 수십 년간의 전투 끝에, 남은 반군 단체를 하나씩 차례로 집중 공략하고 어떠한 타협의 가능성도 거부하는 정부의 새로운 반란 대응 전략이 마침내 분쟁을 종결시켰습니다. 그러나 이 성과에는 대가가 따랐습니다. 이번 군사 작전으로 미얀마와 중국의 관계는 돌이킬 수 없을 만큼 손상되었을지도 모릅니다. 수십만 명의 난민이 중국 국경 안으로 피신했고, 수십 명의 중국 시민이 전투로 인해 사망하거나 부상을 입었으며, 중국의 긴밀한 동맹인 와주연합군(UWSA)이 탓마도에 의해 와해된 데 대한 중국의 분노는 말할 것도 없습니다. 더욱이 현재 군사 점령 아래 있는 소수민족들이, 그들에게 복종을 강요하는 것이 군부의 잔혹성에 대한 공포뿐이라면 앞으로도 중앙 정부의 통치를 받아들일지는 지켜봐야 합니다."
 Burma_News.8.a: "우리 시대의 평화일까?"
 Burma_News.9.t: "아세안 상호방위조약 체결"
 Burma_News.9.d: "오늘 아세안 회원국 정상들은 상호방위조약 체결을 공동으로 발표했습니다. \\"오늘은 어느 한 국가의 이익보다 훨씬 더 큰 이익을 위한 외교적 협력의 놀라운 순간으로 오래도록 기억될 것입니다.\\"라고 [BRM.GetLeader]은(는) 선언했습니다."
 Burma_News.9.a: "중국은 이를 달가워하지 않을 것이다."
 Burma_News.9.b: "그들의 노력이 귀엽군."
 Insurgency.1.t: "카친 위협"
 Insurgency.1.d: "정보 당국에 따르면 카친독립군이 우리 병력을 공격할 계획을 세우고 있습니다!"
 Insurgency.1.a: "대비하겠습니다."
 Insurgency.2.t: "카렌 위협"
 Insurgency.2.d: "정보 당국에 따르면 카렌민족해방군이 우리 병력을 공격할 계획을 세우고 있습니다!"
 Insurgency.2.a: "대비하겠습니다."
 Insurgency.3.t: "샨 위협"
 Insurgency.3.d: "정보 당국에 따르면 샨주군 남부가 우리 병력을 공격할 계획을 세우고 있습니다!"
 Insurgency.3.a: "대비하겠습니다."
 Insurgency.4.t: "탓마도 위협"
 Insurgency.4.d: "탓마도가 우리 병력을 상대로 작전을 계획하고 있다는 소문이 돌고 있습니다!"
 Insurgency.4.a: "대비하겠습니다."
 Insurgency.5.t: "탓마도의 승리"
 Insurgency.5.d: "탓마도는 압도적인 병력과 기술의 우위를 활용하여 반군을 제압하는 데 성공했습니다."
 Insurgency.5.a: "승자가 전리품을 차지하는 법이다."
 Insurgency.5.b: "이 손실은 일시적일 뿐이다."
 Insurgency.6.t: "반군의 승리"
 Insurgency.6.d: "반군은 게릴라 전술을 영리하게 활용하여 탓마도 병력을 소모시켰고, 결국 그들을 후퇴하게 만들었습니다."
 Insurgency.6.a: "승자가 전리품을 차지하는 법이다."
 Insurgency.6.b: "이 손실은 일시적일 뿐이다."
 Insurgency.7.t: "결판이 나지 않은 전투..."
 Insurgency.7.d: "양측 모두 상대에 대한 우위를 점하지 못하고 전장에서 물러났습니다."
 Insurgency.7.a: "일단은 교착 상태다."
 Insurgency.11.t: "정부의 휴전 제안"
 Insurgency.11.d: "우리의 군사적 위용에 분명히 경외감을 느낀 비겁한 탓마도가 적대 행위의 중지를 요청했습니다. 적들이 아무리 비열하더라도 휴전은 우리의 이익에도 부합할 수 있으며, 이 기회를 이용해 미얀마 측에 양보를 압박할 수 있습니다."
 Insurgency.11.a: "야심 찬 요구를 해야 한다."
 Insurgency.11.b: "온건한 요구를 해야 한다."
 Insurgency.11.c: "엿이나 먹으라지, 그들의 제안을 거부해야 한다."
 Insurgency.12.t: "터무니없이 큰 양보를 압박하는 반군!"
 Insurgency.12.d: "이런 요구를 하다니 반군은 분명 우리를 바보로 아는 것입니다! 그럼에도 그들의 요청을 들어주는 것이 장기적으로 우리에게 이로울 수 있다는 가능성을 고려해야 합니다."
 Insurgency.12.a: "그들의 요구를 승인한다"
 Insurgency.12.b: "그들의 요구를 거절한다"
 Insurgency.13.t: "합리적인 요구를 하는 반군"
 Insurgency.13.d: "이 요구는 받아들일 만하며 우리에게 많은 운신의 폭을 줍니다. 그러나 이에 동의하면 당분간 전장에서 성과를 거둘 가능성을 포기해야 합니다."
 Insurgency.13.a: "그들의 요구를 승인한다"
 Insurgency.13.b: "그들의 요구를 거절한다"
 Insurgency.14.t: "우리의 회담 제안을 거부한 [FROM.GetAdjective] 측!"
 Insurgency.14.d: "어리석게도 스스로를 우리보다 우월하다고 여긴 [FROM.GetAdjective] 반군은 그들의 유일한 생존 기회를 걷어찼습니다."
 Insurgency.14.a: "평화는 물 건너갔다."
 Insurgency.15.t: "우리 요구를 수용한 정부"
 Insurgency.15.d: "정부를 설득하여 우리의 관점을 받아들이게 하는 데 성공했으므로, 비록 일시적일지라도 이제 평화의 이점을 누릴 수 있게 되었습니다."
 Insurgency.15.a: "일단은 평화롭다."
 Insurgency.16.t: "우리 요구를 거부한 정부"
 Insurgency.16.d: "배신자 쓰레기인 탓마도는 앞서 내놓은 평화 제안을 철회했고, 우리에게는 그들에 맞선 투쟁을 계속하는 것 외에 다른 선택이 없습니다."
 Insurgency.16.a: "투쟁은 계속된다."
 Insurgency.18.t: "전국 휴전 협정 협상에 대한 정부의 초청"
 Insurgency.18.d: "새 정부는 미얀마의 모든 주요 소수민족 무장 조직(EAO)과 평화를 이루겠다는 야심 찬 제안을 발표했습니다. 우리는 협상에 초청된 15개 최대 단체 중 하나입니다. 이 회담에 참석한다면 미얀마의 미래를 결정지을 수 있는 협상의 테이블에 한 자리를 차지하게 될 것입니다."
 Insurgency.18.a: "어떻게 되는지 지켜보자."
 Insurgency.18.b: "시간 낭비다."
 Insurgency.19.t: "제1차 협상"
 Insurgency.19.d: "미얀마 분쟁과 관련된 가장 중요한 쟁점 중 하나는 미얀마가 연방(Union)이어야 하는가, 아니면 연방제(Federation) 국가여야 하는가입니다. 역사적으로 미얀마 정부는 식민지 분할 통치의 유산을 뼈저리게 알고 있기에, 연방제로 전환하면 국가가 해체될 것이라고 우려하여 그 가능성을 받아들이기를 거부해 왔습니다. 반면 소수민족 무장 조직(EAO)은 보다 대표성 있는 정부 형태가 필요하다고 주장해 왔습니다. 이번 협상을 진행하기에 앞서 이 쟁점에 대한 우리의 협상 입장을 정해야 합니다."
 Insurgency.19.a: "연방을 지켜야 한다."
 Insurgency.19.b: "시대가 변하고 있으니 우리도 변해야 한다. 연방제 국가가 되어야 한다."
 Insurgency.19.c: "이 점에 대해서는 타협해야 한다."
 Insurgency.20.t: "제2차 협상"
 Insurgency.20.d: "다음 의제는 탓마도의 구성에 관한 것입니다. 많은 EAO는 현재처럼 국가의 군대가 불교도와 버마족에게 압도적으로 지배되어서는 안 된다고 주장합니다. 이러한 우려에 대응할지 여부를 고려해야 합니다."
 Insurgency.20.a: "현상을 유지한다."
 Insurgency.20.b: "군 내 소수민족의 대표성을 개선하는 데 전념한다."
 Insurgency.20.c: "이 사안은 지금 결정하기에는 너무 중대하다."
 Insurgency.21.t: "최종 협상"
 Insurgency.21.d: "이번 협상에서 우리가 마주한 가장 큰 걸림돌은 무장 해제·동원 해제·재통합(DDR)을 추진할 것인가, 아니면 안보 부문 개혁(SSR)을 추진할 것인가 하는 문제입니다. 탓마도는 EAO를 완전히 무장 해제하거나 자신의 지휘 아래 두기를 원하므로 역사적으로 DDR을 선호해 왔습니다. 반면 EAO는 무기와 자치권을 유지하면서 국가 안보 부문에 통합될 수 있는 틀인 SSR을 선호해 왔습니다. 이 교착 상태를 타개할 최선의 해법을 고려해야 합니다."
 Insurgency.21.a: "그들은 무기를 가질 수 없다. DDR을 선택한다."
 Insurgency.21.b: "우리도 희생을 감수해야 하므로 SSR을 받아들인다."
 Insurgency.21.c: "이 사안은 지금 결정하기에는 너무 중요하다."
 Insurgency.22.t: "이 초안에 대한 만족"
 Insurgency.22.d: "정부는 서명된 이 초안을 우리 국민에게 가져가 자긍심을 가지고 보여 줄 수 있을 만큼 충분히 양보했습니다."
 Insurgency.22.a: "서명하겠습니다."
 Insurgency.23.t: "받아들일 수 없는 이 초안!"
 Insurgency.23.d: "정부와 군부는 인쇄된 종이 이상의 가치가 있는 협정을 작성할 생각이 전혀 없는 것이 분명합니다! 이것을 우리 국민에게 가져간다면 그들은 틀림없이 우리를 산 채로 가죽을 벗길 것입니다."
 Insurgency.23.a: "서명하지 않겠습니다!"
 Insurgency.24.t: "NCA에 서명한 [FROM.GetAdjective] 대표단!"
 Insurgency.24.d: "우리의 협상 입장을 받아들일 만하다고 판단한 [FROM.GetAdjective] 대표단이 우리와 함께 이 역사적인 문서에 서명했습니다."
 Insurgency.24.a: "환상적이군"
 Insurgency.25.t: "NCA 서명을 거부한 [FROM.GetAdjective] 대표단!"
 Insurgency.25.d: "[FROM.GetAdjective] 대표단은 우리의 '터무니없는' 요구를 이유로 들며 우리와 함께 이 역사적인 문서에 서명하기를 거부했습니다."
 Insurgency.25.a: "그들의 손해다."
 Insurgency.26.t: "우리 금전적 이권을 공격한 샨 반군!"
 Insurgency.26.d: "샨 반군은 태국을 비롯한 다른 국가들의 환심을 사려는 것이 분명하며, 우리의 마약 밀매 역량을 약화하는 일을 자청하고 나섰습니다. 우리는 이 공격에 적절한 대응을 결정해야 하며, 선택지는 아무것도 하지 않는 것부터 그들의 거점 일부를 공격하는 것, 심지어 전면전을 선포하는 것까지 다양합니다."
 Insurgency.26.a: "이것은 전쟁이다!"
 Insurgency.26.b: "대응은 비례적이어야 한다."
 Insurgency.26.c: "현재로서는 대응할 수 없다."
 Insurgency.27.t: "와주연합군의 보복!"
 Insurgency.27.d: "우리가 마약 밀매 자산을 공격한 데 대한 대응으로, UWSA는 우리 국경 초소 일부를 공격했습니다. 격퇴에는 성공했으나 일부 사상자가 발생했습니다."
 Insurgency.27.a: "유감스럽다."
 Rohingya_Crisis: "로힝야족 위기"
 Rohingya_Crisis_desc: "라카인주에서는 스스로를 \\"로힝야\\"라고 칭하는 무슬림과 현지 라카인 불교도 및 탓마도 사이에서 간헐적으로 폭력 사태가 발생해 왔습니다. 미얀마 정부의 로힝야에 대한 종종 잔혹한 처우는 인권 단체와 서방 국가의 강한 비난을 불러왔으나, 라카인주를 비롯한 미얀마 곳곳의 불교 민족주의자들은 이 폭력을 불법 벵골 이민자에 대한 정당한 조치로 보고 있습니다."
 Ethnic_Insurgencies: "소수민족 반란"
 Ethnic_Insurgencies_desc: "독립 이후 미얀마는 외지고 고립된 국경 지역에서 벌어지는 소수민족 반란에 휩싸여 왔습니다. 카렌, 카친, 샨을 비롯한 여러 민족은 중앙 정부가 압도적으로 버마족과 불교도 중심이라고 보며, 자신들의 고유한 생활 방식을 지키기 위해 무기를 들었습니다."
 Democracy_Movement: "민주화 운동"
 Democracy_Movement_desc: "1988년 시위 이후 미얀마에서는 자유화를 향한 대중의 의지가 강력했습니다. 민주주의와 아웅 산 수 치에 대한 이러한 지지는 한때 확고했던 탓마도의 권력 장악을 점점 약화하고 있습니다."
 Western_Sanctions: "서방의 제재"
 Western_Sanctions_desc: "이 주의 인권에 대한 노골적인 무시와 국제 평화 및 안보에 대한 위협은 수입 금지, 자산 동결, 관리 비자 제한 등을 포함한 미국과 EU의 강력한 제재를 불러왔습니다."
 A_Political_Military: "정치화된 군대"
 A_Political_Military_desc: "1962년 미얀마 쿠데타 이래 탓마도는 미얀마 정치의 지배 세력이었습니다. 민간 통치, 민주주의, 표현의 자유에 대한 경멸과, 수십 년간의 치열한 대반란전으로 형성된 단일한 군 문화가 결합하여 응집력 있고 정치적으로 적극적인 군대가 탄생했습니다. 이러한 상황이 변하기 시작했다는 징후는 최근에야 나타나기 시작했습니다."
 Ensure_our_Unity: "단결 보장"
 Preserve_our_Sovereignty: "주권 수호"
 Fortress_Myanmar: "요새 미얀마"
 Bolster_The_Navy: "해군 생산 보너스"
 Bolster_The_Airforce: "공군 생산 보너스"
 Bolster_Officer_Training: "장교 훈련 강화"
 Reduced_Western_Sanctions: "서방의 제재 완화"
 Reduced_Western_Sanctions_desc: "미얀마의 민주화는 미국과 동맹국들이 미얀마의 침체된 경제에 대한 제재를 완화하도록 이끌었습니다."
 Massive_International_Sanctions: "대규모 국제 제재"
 Massive_International_Sanctions_desc: "이 국가는 광범위한 국제적 비난에 직면했으며, 수입 금지, 자산 동결, 관리 비자 제한 등 각국과 국제기구로부터 강력한 제재를 받고 있습니다."
 Struggle_for_power: "권력 투쟁"
 Struggle_for_power_desc: "정부의 민간 부문과 군 부문은 현재 지배권을 둘러싼 치열한 투쟁에 휘말려 있으며, 이 투쟁은 국가를 점차 약화하고 있습니다."
 Anti_tatmadaw_sentiment: "반탓마도 정서"
 Anti_tatmadaw_sentiment_desc: "탓마도가 NLD에 권력을 넘기지 않고 미얀마의 통제권을 유지하기로 선택하자, 군부 통치에 대한 이미 상당했던 적대감은 급격히 커져 전례 없는 수준에 이르렀습니다."
 State_led_economy: "국가 주도 경제"
 State_led_economy_desc: "세계 대부분은 자유민주주의와 자유시장 자본주의를 경제 발전의 필수 조건으로 보지만, 대한민국, 대만 등의 성공 사례는 성장의 토대를 마련하기 위해 강력하고 군사주의적인 정부가 필요함을 보여 줍니다."
 Buddhism_Official: "국교: 불교"
 Buddhism_Official_desc: "국교를 두는 것은 가장 독실한 일부 불교도에게는 매력적일 수 있으나, 버마가 역사 대부분 동안 국교 없이 지내 온 데에는 이유가 있습니다. 불교를 국교로 삼으면 기독교, 이슬람교 또는 버마의 수많은 다른 종교를 믿는 이들이 반감을 품게 됩니다. 국교를 두는 것은 중앙 정부와 대개 비불교도인 여러 소수민족 반군 단체 간의 긴장을 심각하게 악화시킵니다."
 ASEAN_Defence_Treaty: "아세안 상호방위조약"
 ASEAN_Defence_Treaty_desc: "미얀마가 제안한 이 조약은 외부 침략이 있을 경우 아세안 회원국들이 서로를 돕도록 의무화합니다. 이는 중국의 침략을 억제하려는 시도로 널리 인식되고 있습니다."
 The_Anti_Kachin_Offensive: "반카친 공세"
 The_Anti_Kachin_Offensive_desc: "KIO를 섬멸할 때가 왔습니다. 모든 준비를 반KIO 작전에 쏟아부은 지금, 우리는 이 위협을 소탕할 어느 때보다 나은 태세를 갖추고 있습니다."
 The_Anti_Karen_Offensive: "반카렌 공세"
 The_Anti_Karen_Offensive_desc: "KNU를 섬멸할 때가 왔습니다. 모든 준비를 반KNU 작전에 쏟아부은 지금, 우리는 이 위협을 소탕할 어느 때보다 나은 태세를 갖추고 있습니다."
 The_Anti_Shan_Offensive: "반샨 공세"
 The_Anti_Shan_Offensive_desc: "RCSS를 섬멸할 때가 왔습니다. 모든 준비를 반RCSS 작전에 쏟아부은 지금, 우리는 이 위협을 소탕할 어느 때보다 나은 태세를 갖추고 있습니다."
 The_Anti_Wa_Offensive: "반와 공세"
 The_Anti_Wa_Offensive_desc: "UWSA를 섬멸할 때가 왔습니다. 모든 준비를 반UWSA 작전에 쏟아부은 지금, 우리는 이 위협을 소탕할 어느 때보다 나은 태세를 갖추고 있습니다."
 Chinese_Involvement: "중국의 지원"
 Chinese_Involvement_desc: "중국은 명목상으로는 미얀마 중앙 정부를 지지하면서도 정부와 반군 사이의 분쟁에 대해서는 실용적인 태도를 유지하며, 중국 영토와 접한 미얀마 지역을 장악한 반군 단체들과 긴밀한 관계를 이어 가고 있습니다. 이러한 관계 덕분에 반군 단체들은 중국의 물질적 지원을 받을 수 있습니다."
 Low_Chinese_Involvement: "소규모 중국 지원"
 Low_Chinese_Involvement_desc: "중국 중앙 정부로부터 상당한 물질적 지원을 받는 것은 와주연합군뿐이지만, 다른 많은 반군 단체도 미얀마 내 중국의 개입으로부터 보다 간접적으로 혜택을 얻고 있습니다. 이들 단체는 중국에서 무기를 공급받는 다른 단체로부터 무기를 사들이며, 반군 본부를 자주 방문하고 행사에 참석하는 중국 사업가 및 지방 관리들과 긴밀한 관계를 누리고 있습니다."
 Disrupted_Chinese_Involvement: "차질을 빚은 중국 지원"
 Disrupted_Chinese_Involvement_desc: "중앙 정부의 \\"비밀 전쟁\\" 노력으로 중국이 반군 단체에 지원을 제공할 수 있는 능력이 감소했습니다. 그럼에도 지원은 계속되고 있습니다."
 Strategic_Capital: "전략적 수도"
 Strategic_Capital_desc: "양곤은 안보를 중시하는 미얀마 같은 국가가 수도로 삼기에는 지나치게 취약하다고 판단되었습니다. 수도를 네피도로 이전함으로써 강력한 외부의 적이 침공할 경우 탓마도는 더욱 안전한 곳에서 인민 저항을 계속 지휘할 수 있습니다."
 Nationwide_Ceasefire_Agreement: "전국 휴전 협정"
 Nationwide_Ceasefire_Agreement_desc: "전국 휴전 협정은 미얀마의 내부 분쟁을 해결하기 위한 실질적인 조치를 시작하려는 전례 없는 시도의 결과입니다."
 WAA_Narcotics_Producer: "마약 생산국"
 WAA_Narcotics_Producer_desc: "와주는 수십 년 동안 양귀비 재배로 생산되는 헤로인이든 \\"야바\\" 메스암페타민 정제든 마약 생산지였습니다. 마약 거래는 와 경제를 지탱하는 데 도움이 되지만, 와주의 국제적 평판을 심각하게 훼손합니다."
 WAA_Narcotics_Producer_idea_tt: "추가 수입: §G0.080%§!"
 BRM_promote_civilian_enterprises_research_boost: "민간 기업 육성"
 BRM_promote_civilian_enterprises_research_boost_desc: "우리는 경제를 개선하기 위해 독립적인 민간 부문을 육성했습니다."
 BRM_improve_security_cooperation_with_asean_research_boost: "아세안 안보 협력"
 BRM_improve_security_cooperation_with_asean_research_boost_desc: "우리는 아세안과 안보 분야에서 협력하고 있으며, 이를 통해 동맹국들로부터 전술을 배울 수 있습니다."
 ethnic_insurgency_category: "미얀마의 내부 분쟁"
 ethnic_insurgency_category_desc: "지난 수십 년은 미얀마 정부와 여러 소수민족 무장 조직(EAO) 사이의 연이은 휴전으로 점철되었습니다. 이 휴전들은 탓마도와 EAO 간의 무력 충돌로 중단되곤 했으며, 이러한 충돌은 흔히, 항상은 아니지만, 현상 복귀 외에는 아무런 결과도 낳지 못했습니다. 평화와 전쟁 사이의 균형은 미묘하며, 양측 모두 신중하게 다뤄야 합니다.\n\n특정 EAO에 대해 미얀마가 보유한 영향력 수준은 미얀마가 반군 영토를 병합할 수 있는지, 혹은 분리된 주가 독립을 선포할 수 있는지를 결정합니다. 휴전은 미얀마가 장기간에 걸쳐 EAO에 대한 영향력을 서서히 축적하도록 해 줍니다. 군사 작전은 성공할 경우 표적이 된 EAO에 대한 상당한 영향력을 미얀마에 안겨 주지만, 실패할 경우 EAO에 미얀마의 영향력으로부터 훨씬 더 큰 독립성을 부여하게 됩니다.\n\nEAO에 대한 [BRM.GetFlag] [BRM.GetAdjective] 영향력:\n [KAC.GetNameWithFlag] [KAC.BRM_influence_KAC_var_integer]\n [KAR.GetNameWithFlag] [KAR.BRM_influence_KAR_var_integer]\n [SHN.GetNameWithFlag] [SHN.BRM_influence_SHN_var_integer]\n [NHN.GetNameWithFlag] [NHN.BRM_influence_NHN_var_integer]\n [WAA.GetNameWithFlag] [WAA.BRM_influence_WAA_var_integer]"
 BRM_propose_the_NCA: "전국 휴전 협정 제안"
 BRM_propose_the_NCA_desc: "전국 휴전 협정은 미얀마의 가장 강력한 EAO 15개와 지속적인 평화를 이루려는 야심 찬 시도입니다. 이를 시도하기 전에 각 EAO와 양자 휴전을 확보해야 합니다."
 BRM_renegotiate_the_NCA: "전국 휴전 협정 재협상"
 BRM_renegotiate_the_NCA_desc: "전국 휴전 협정은 미얀마의 가장 강력한 EAO 15개와 지속적인 평화를 이루려는 야심 찬 시도입니다. 그러나 현재의 문안은 완벽하지 않으며 개선될 수 있습니다. 이를 시도하기 전에 각 EAO와 양자 휴전을 확보해야 합니다."
 BRM_scrap_the_NCA: "전국 휴전 협정 폐기"
 BRM_scrap_the_NCA_desc: ""
 BRM_ceasefire_KAC: "카친과의 휴전 제안"
 BRM_ceasefire_KAC_desc: "우리와 카친 독립군 간의 갈등은 너무 오랫동안 계속되었습니다. 휴전은 우리가 다시 힘을 회복하고 카친 주에 대한 영향력을 강화할 수 있는 기회를 제공할 것입니다. 반군이 우리의 제안을 받아들일지 여부는 그들과의 관계와 현재 우리의 정부 형태에 달려 있습니다. 휴전 제안을 한 후에는 30일 동안 새로운 제안을 할 수 없습니다."
 BRM_ceasefire_KAR: "카렌과의 휴전 제안"
 BRM_ceasefire_KAR_desc: "우리와 카렌민족해방군 사이의 분쟁은 너무 오래 계속되었습니다. 휴전은 우리가 전력을 회복하고 카렌주에 대한 영향력을 높일 수 있게 해 줍니다. 반군이 우리의 제안을 수락할지 여부는 그들과의 관계와 우리의 현재 정부 형태에 따라 결정됩니다. 휴전을 제안한 후에는 30일 동안 새로운 제안을 할 수 없습니다."
 BRM_ceasefire_SHN: "남부 샨과의 휴전 제안"
 BRM_ceasefire_SHN_desc: "우리와 남부 샨주군 사이의 분쟁은 너무 오래 계속되었습니다. 휴전은 우리가 전력을 회복하고 남부 샨주에 대한 영향력을 높일 수 있게 해 줍니다. 반군이 우리의 제안을 수락할지 여부는 그들과의 관계와 우리의 현재 정부 형태에 따라 결정됩니다. 휴전을 제안한 후에는 30일 동안 새로운 제안을 할 수 없습니다."
 BRM_provoke_KAC: "카친 휴전 지대에서 사건 유발"
 BRM_provoke_KAC_desc: "카친과의 평화는 우리의 이익에 부합하지 않습니다. 우리 병력과 그들의 병력 사이에 충돌을 유발함으로써 카친독립군에 대한 적극적인 작전으로 복귀할 수 있습니다."
 BRM_provoke_KAR: "카렌 휴전 지대에서 사건 유발"
 BRM_provoke_KAR_desc: "카렌과의 평화는 우리의 이익에 부합하지 않습니다. 우리 병력과 그들의 병력 사이에 충돌을 유발함으로써 카렌민족해방군에 대한 적극적인 작전으로 복귀할 수 있습니다."
 BRM_provoke_SHN: "남부 샨 휴전 지대에서 사건 유발"
 BRM_provoke_SHN_desc: "남부 샨과의 평화는 우리의 이익에 부합하지 않습니다. 우리 병력과 그들의 병력 사이에 충돌을 유발함으로써 남부 샨주군에 대한 적극적인 작전으로 복귀할 수 있습니다."
 BRM_operation_KAC: "카친 상대 작전 개시"
 BRM_operation_KAC_desc: "카친독립군이 외곽 마을에서 문제를 일으키고 있습니다. 그들을 몰아내기 위한 작전을 수행해야 합니다."
 BRM_operation_KAR: "카렌 상대 작전 개시"
 BRM_operation_KAR_desc: "카렌민족해방군이 외곽 마을에서 문제를 일으키고 있습니다. 그들을 몰아내기 위한 작전을 수행해야 합니다."
 BRM_operation_SHN: "남부 샨 상대 작전 개시"
 BRM_operation_SHN_desc: "남부 샨주군이 외곽 마을에서 문제를 일으키고 있습니다. 그들을 몰아내기 위한 작전을 수행해야 합니다."
 BRM_annex_KAC: "카친 주 합병"
 BRM_annex_KAC_desc: "우리는 카친의 영토를 완전히 장악할 수 있을 만큼 충분한 영향력을 확보했습니다."
 BRM_annex_KAR: "카렌 주 합병"
 BRM_annex_KAR_desc: "우리는 카렌의 영토를 완전히 장악할 수 있을 만큼 충분한 영향력을 확보했습니다."
 BRM_annex_SHN: "Annex the South Shan"
 BRM_annex_SHN_desc: "우리는 남부 샨의 영토를 완전히 장악할 수 있을 만큼 충분한 영향력을 확보했습니다."
 BRM_annex_WAA: "와 주 합병"
 BRM_annex_WAA_desc: "우리는 와의 영토를 완전히 장악할 수 있을 만큼 충분한 영향력을 확보했습니다."
 attack_drug_factories: "와 마약 공장 공격"
 attack_drug_factories_desc: "와주연합군은 헤로인과 메스암페타민 정제인 \\"야바\\" 같은 마약의 불법 생산에 깊이 관여하고 있습니다. 이 공장들을 공격해 파괴하려면 노력과 자원이 필요하지만, 우리의 국제적 정당성과 더불어 우리의 대의에 도움이 될 것입니다. 그러나 와가 우리에게 보복할 가능성에 대비해야 합니다."
 intercept_drug_convoys: "와 마약 수송대 차단"
 intercept_drug_convoys_desc: "태국 국경에 자리한 우리의 위치 덕분에 와 영토에서 태국으로 이동하는 마약을 차단할 수 있습니다. 이 마약을 압수하여 태국과 국제 언론 앞에서 불태우면 우리 조직에 대한 국제 여론이 개선되겠지만, 와주연합군의 군사적 대응을 촉발할 수 있습니다."
 end_opium_production: "헤로인 생산 중단"
 end_opium_production_desc: "미국은 우리 조직을 마약 밀매 조직으로 규정했으며 일부 최고위 지휘관에 대한 체포 영장을 발부했습니다. 더 중요한 점은, 중국 역시 우리의 헤로인 거래 관여를 달가워하지 않는다는 것입니다. 따라서 경제에 타격이 될 수 있더라도 양귀비 재배를 금지하고 헤로인 생산을 중단하는 것이 우리에게 최선의 이익이 될 수 있습니다."
 end_meth_production: "\\"야바\\" 생산 중단"
 end_meth_production_desc: "야바는 메스암페타민 정제로, 우리의 주요 자금원이며 경제를 지탱하는 데 도움이 됩니다. 그러나 이는 우리의 부정적인 평판을 떨쳐내기 어렵게 만들며, 특히 야바가 널리 퍼진 태국과 관련해서 그러합니다. 국제 사회에서 긍정적으로 평가받고자 한다면 야바 생산 중단에 따른 단기적 경제 충격을 감수해야 할지도 모릅니다."
 attack_tatmadaw: "탓마도 공격"
 attack_tatmadaw_desc: "중앙 정부는 우리를 평화롭게 내버려 둘 생각이 없는 듯합니다. 우리 국민의 안전을 보장하려면 증오스러운 탓마도가 우리 집 안으로 들이닥치기 전에 먼저 그들을 쳐야 합니다."
 declare_independence: "독립 선포"
 declare_independence_desc: "우리는 버마족의 억압적인 멍에에서 충분히 벗어났으므로, 우리 독립 국가에 대한 국제적 승인을 요구할 수 있습니다."
 BRM_sangha_category: "불교 정책"
 BRM_sangha_category_desc: "승가라고도 불리는 국가의 불교 승려들의 여론을 정부에 우호적으로 유지하려면 미얀마의 불교 기관에 충분한 자금이 지원되도록 해야 합니다. 그러나 승가는 우리의 후원 수락을 거부할 수 있으며, 우리에 대한 여론이 낮을수록 그 가능성은 커집니다."
 BRM_impose_state_religion: "불교를 국교로 지정"
 BRM_impose_state_religion_desc: "국민의 90%가 불교 신자이므로, 그러한 종교적 현실을 정치적 현실로도 만드는 것은 지극히 당연합니다. 이 조치는 종교적 소수자들의 반감을 살 수 있으나, 승가의 지지를 얻을 수 있습니다."
 BRM_remove_state_religion: "국교 없는 상태로 복귀"
 BRM_remove_state_religion_desc: "국교 지정이 우리에게 이롭지 않았음을 인정해야 합니다. 여러 소수자의 반감이 소수 불교 민족주의자의 지지 증가로 얻은 이익을 훨씬 넘어섰습니다."
 BRM_minor_funding: "불교 기관에 대한 소규모 자금 지원"
 BRM_minor_funding_desc: "우리는 미얀마의 불교를 지원하는 데 소액 이상을 내놓을 여력이 없습니다. 이는 승가의 우리에 대한 여론을 높일 가능성이 낮습니다."
 BRM_moderate_funding: "불교 기관에 대한 중규모 자금 지원"
 BRM_moderate_funding_desc: "우리는 미얀마의 승려들에게 보다 상당한 기부를 할 여력이 있습니다. 이는 승가의 우리에 대한 여론을 높일 가능성이 중간 정도입니다."
 BRM_major_funding: "불교 기관에 대한 대규모 자금 지원"
 BRM_major_funding_desc: "영적인 사안에서는 비용을 아끼지 말아야 합니다. 이는 승가의 우리에 대한 여론을 높일 가능성이 높습니다."
 BRM_no_influence: "0%"
 BRM_Administrative_Decisions: "행정 결정"
 BRM_Administrative_Decisions_desc: "우리 군사 전략가들은 양곤을 수도로 두면 상륙 침공의 가능성에 취약해진다고 결론지었습니다. 수도를 더 외진 곳으로 옮기면 더 강한 외국 세력과 전쟁이 벌어질 경우 탓마도가 안전한 지휘소에서 게릴라전을 조직할 수 있습니다."
 BRM_plans_for_new_capital: "새 수도 계획 수립"
 BRM_begin_construction_capital: "네피도 건설 착수"
 BRM_ceasefire_NHN: "북부 샨과의 휴전 제안"
 BRM_ceasefire_NHN_desc: "우리와 북부 샨주군 사이의 분쟁은 너무 오래 계속되었습니다. 휴전은 우리가 전력을 회복하고 북부 샨주에 대한 영향력을 높일 수 있게 해 줍니다. 반군이 우리의 제안을 수락할지 여부는 그들과의 관계와 우리의 현재 정부 형태에 따라 결정됩니다. 휴전을 제안한 후에는 30일 동안 새로운 제안을 할 수 없습니다."
 BRM_provoke_NHN: "북부 샨 휴전 지대에서 사건 유발"
 BRM_provoke_NHN_desc: "북부 샨과의 평화는 우리의 이익에 부합하지 않습니다. 우리 병력과 그들의 병력 사이에 충돌을 유발함으로써 북부 샨주군에 대한 적극적인 작전으로 복귀할 수 있습니다."
 BRM_operation_NHN: "북부 샨 상대 작전 개시"
 BRM_operation_NHN_desc: "북부 샨주군이 외곽 마을에서 문제를 일으키고 있습니다. 그들을 몰아내기 위한 작전을 수행해야 합니다."
 BRM_annex_NHN: "북부 샨 병합"
 BRM_annex_NHN_desc: "우리는 북부 샨의 영토를 완전히 장악할 수 있을 만큼 충분한 영향력을 확보했습니다."
 BRM_the_new_economic_boom: "새로운 경제 호황"
 BRM_the_new_economic_boom_desc: "이제 경제를 정체에서 벗어나게 하여 앞으로 나아가게 할 때입니다."
 BRM_loan_refactoring: "대출 재조정"
 BRM_loan_refactoring_desc: "대출을 재조정하는 것은 경제를 앞으로 나아가게 하는 확실한 방법입니다."
 BRM_loan_refactoring_idea: "대출 재조정"
 BRM_loan_refactoring_idea_desc: "현재의 부채 문제는 부채를 재조정할 기회를 필요로 하며, 그러지 않으면 문제가 생길 것입니다."
 boost_national_sentiment: "국민 정서 §Y고취§!"
 boost_national_sentiment_desc: "집회와 행진을 열고 연설을 하며 국가에 대한 소속감을 부각하기 위해 전력을 다함으로써, 분열된 민중으로부터 단결된 국가를 빚어낼 수 있습니다."
 Insurgency.28.t: "북부 샨과의 충돌 발발"
 Insurgency.28.d: "우리 병력과 북부 샨 단체에 충성하는 민병대 사이에 전투가 벌어져, 이미 한계에 다다른 대반란 작전에 또 하나의 전선이 추가되었습니다."
 Insurgency.28.a: "힘에는 힘으로 맞서겠다."
 Burma.19.t: "정당이 된 USDA"
 Burma.19.desc: "연방단결발전협회는 공식적으로 해산하고 회원, 사무소, 자산을 연방단결발전당에 이전했습니다. 새 정당은 민간의 외피를 두르고 다가오는 선거에서 군부의 이익을 대변할 것입니다."
 Burma.19.a: "군부가 자신의 정당을 갖게 되었습니다."
 Burma.20.t: "결성된 아라칸 민족당"
 Burma.20.desc: "라카인 민족개발당과 아라칸 민주연맹이 해산하고 단일 아라칸 민족당으로 합당했습니다. 통합된 이 정당은 이제 국가 정치에서 라카인 민족을 대변한다고 주장합니다."
 Burma.20.a: "라카인 정치가 한목소리를 내게 되었습니다."
 Burma.21.t: "연방선거관리위원회의 NLD 해산"
 Burma.21.desc: "연방선거관리위원회는 새 정당등록법에 따른 등록을 거부한 민주주의민족동맹(NLD), 샨족민주주의민족동맹 및 수십 개의 기타 정당을 해산했습니다. 해산된 정당들은 이 결정을 거부하며 법 바깥에서 활동을 이어 가고 있습니다."
 Burma.21.a: "야당이 불법화되었습니다."
