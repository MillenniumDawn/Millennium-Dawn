 module_light_surface_diesel_power_1: "Light Diesel Powered Engine I"
 module_light_surface_diesel_power_1_desc: "Les diesels optimisés pour les plus petits bâtiments de surface offrent une propulsion fiable avec une consommation efficace.\n\n§GIndice du concepteur : la propulsion diesel légère offre une vitesse et une courte portée maximale modestes à faible coût de production. Convient aux engins côtiers abordables, mais augmente carburant et visibilité de surface.§!"
