 ENERGY_POLICY_AUTOMATION_SHORT: "自动"
 ENERGY_POLICY_AUTOMATION_TT: "§Y自动消费政策§!\n在每周能源更新期间，系统会自动将消费策略调整一级。当可持续净满足率低于§R95%§!时，系统会提高限制；当可持续净满足率高于§G110%§!时，系统会放宽限制或提高消费量。额外消费需要电池储能容量至少达到§Y95%§!，除非没有储能容量。能源进口和已承诺的出口都会被纳入计算，但电池放电不会被纳入。手动选择策略会禁用自动调整功能。"
