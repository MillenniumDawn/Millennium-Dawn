 UKR_storage_item_mig23_icon: "GFX_SOV_AIR_MiG_23MLD"
 UKR_storage_item_mig23_tt: "§YМиГ-23§!\n\n\n£SOV_AIR_MiG_23MLD\n\n\n\nНа хранении: §Y[?ukraine_has_mig23_stockpile|0]§!\nПоколение: истребитель третьего поколения с изменяемой стреловидностью крыла, на вооружении с 1970 года. §YМиГ-23МЛД§! — последняя истребительная версия.\nТип техники: §YИстребитель 3-го поколения§!\n\nСемейство вариантов:\n• МиГ-23МЛД\n• МиГ-23МЛ\n• МиГ-23УБ\n\nИстребитель §Rсоветской§! фронтовой авиации с изменяемой стреловидностью крыла. §YМиГ-23УБ§! — двухместный учебно-боевой вариант."
 UKR_storage_line_mig27_text: "\n• МиГ-27: §Y[?ukraine_has_mig27_stockpile|0]§!"
 UKR_storage_item_mig27: "МиГ-27"
 UKR_storage_item_mig27_count: "§Y[?ukraine_has_mig27_stockpile|0]§!"
 UKR_storage_item_mig27_icon: "GFX_SOV_AIR_MiG_27M"
 UKR_storage_item_mig27_tt: "§YМиГ-27§!\n\n\n£SOV_AIR_MiG_27M\n\n\n\nНа хранении: §Y[?ukraine_has_mig27_stockpile|0]§!\nПоколение: истребитель-бомбардировщик третьего поколения с изменяемой стреловидностью крыла, на вооружении с 1975 года.\nТип техники: §YИстребитель-бомбардировщик 3-го поколения§!\n\nСемейство вариантов:\n• МиГ-27М\n• МиГ-27Д\n• МиГ-27К\n\nИстребитель-бомбардировщик на базе планера §YМиГ-23§!. §YМиГ-27К§! может применять оружие с лазерным и телевизионным наведением. §YЛьвовский государственный авиаремонтный завод§! ремонтирует этот тип с 1979 года."
 UKR_storage_line_mig25_text: "\n• МиГ-25: §Y[?ukraine_has_mig25_stockpile|0]§!"
