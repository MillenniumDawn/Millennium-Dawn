 JAP_earthquake.1.t: "Terremoto Atinge [?JAP_quake_state.GetName]"
 JAP_earthquake.1.d: "Um forte terremoto atingiu [?JAP_quake_state.GetName]. A Agência Meteorológica do Japão relata tremores de intensidade seis em sua escala perto do epicentro, com abalos sentidos nas províncias vizinhas. As estradas ficaram deformadas, os serviços ferroviários estão suspensos enquanto os trilhos são inspecionados, e várias fábricas pararam a produção para verificar danos estruturais. Os governos locais estão avaliando as baixas e solicitando ajuda a Tóquio."
 JAP_earthquake.2.t: "Construído para Resistir ao Próximo"
 JAP_earthquake.2.d: "A última região passou em sua vistoria sísmica, e a reconstrução das áreas devastadas pelo Grande Terremoto do Leste do Japão está concluída. Hospitais e prefeituras repousam sobre isoladores de base, as antigas escolas foram reforçadas ou substituídas, e os pilares das rodovias expressas ganharam colares de aço. O Japão não pode impedir que o solo se mova, mas, pela primeira vez em sua história, um grande tremor deixou de ser uma emergência nacional."
 JAP_earthquake.2.a: "Estamos prontos."
