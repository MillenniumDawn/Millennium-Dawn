 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR: "§H Rozkaz przeprowadzenia desantu morskiego (z wykorzystaniem modułowego systemu pomostów) §!\nKrok 1) §G Kliknij §! jedną z wyróżnionych prowincji, aby wyznaczyć punkt wyjścia inwazji.\nKrok 2) §GKliknij§! prawym przyciskiem myszy wybraną prowincję (lub prowincje) nadbrzeżną, aby przeprowadzić inwazję.\nPo aktywacji planu rozpocznie się przygotowywanie i rezerwowanie konwojów oraz modułowego systemu przeprawowego (Modular Causeway System) z twoich zapasów."
