 LIB.Neutral_Muslim_Brotherhood: "£LIB_muslim_brotherhood_small (NMCL) - 利比里亚全国穆斯林委员会"
 LIB.Neutral_Muslim_Brotherhood_desc: "（温和派伊斯兰教） - 利比里亚全国穆斯林委员会旨在维护该国穆斯林的权利。穆斯林占利比里亚人口的一小部分，大多数来自曼丁加族。泰勒最初因为与利比亚的关系给予利比里亚穆斯林更多的自由，但近年来，他开始对他们进行基督教化运动。"
 LIB.Neutral_Muslim_Brotherhood_icon: "£LIB_muslim_brotherhood_small"
 LIB.Neutral_conservatism: "£LIB_Neutral_conservatism_small (ALCOP) - 全利比里亚联盟党"
 LIB.Neutral_conservatism_icon: "£LIB_Neutral_conservatism_small"
 LIB.oligarchism: "£generic_oligarchism_small (NPL) - 利比里亚民族党"
 LIB.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (RULP) - 改革利比里亚联合党"
 LIB.neutral_Social_icon: "£LIB_neutral_Social_small"
 LIB.Nat_Populism: "£LIB_Nat_Populism_small (LP) - 自由党"
 LIB.Nat_Populism_icon: "£LIB_Nat_Populism_small"
 LIB.Nat_Fascism: "£LIB_Nat_Fascism_small (NPP) - 民族爱国党"
 LIB.Nat_Fascism_desc: "（民族主义） - 民族爱国党是查尔斯·泰勒叛军组织民族爱国阵线的政治继承者。该党主要作为泰勒的忠实拥护者的集合，并没有真正的党派纲领。泰勒的“政策”主要涉及确保他对利比里亚及其邻国的统治。"
 LIB.Nat_Fascism_icon: "£LIB_Nat_Fascism_small"
 BAL.Neutral_Autocracy_icon: "£BAL_neutral_autocracy"
 DAR.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small 骑兵队"
 DAR.Neutral_Muslim_Brotherhood_desc: "（阿拉伯利益） - 骑兵队是一支在达尔富尔活动的阿拉伯民兵组织。该民兵组织由来自萨赫勒地区的阿拉伯牧民和游牧民组成，苏丹政府利用该民兵组织补充军队，以对抗达尔富尔叛军。"
 DAR.Neutral_conservatism: "£generic_Neutral_conservatism_small (JEM) - 正义与平等运动"
 DAR.Neutral_conservatism_desc: "（伊斯兰民主主义） - 正义与平等运动是一个反对苏丹政府的组织。该组织自称是一个由多种族部落组成的组织，但实际上其大多数成员来自扎格哈瓦部落。该组织的许多创始成员都是苏丹执政党全国大会党的老支持者，他们认为该党忽视了苏丹的经济。"
 DAR.neutral_Social: "£generic_neutral_Social_small (DLF) - 达尔富尔解放阵线"
 DAR.neutral_Social_desc: "（达尔富尔利益） - 达尔富尔解放阵线是一个反苏丹抵抗组织，由富尔族、扎格哈瓦族和马萨利特族成员组成。该组织对达尔富尔的阿拉伯化感到厌倦，因此拿起武器反抗政府。"
 SSU.liberalism: "£generic_liberalism_small (UDF) - 联合民主阵线"
 SSU.liberalism_desc: "（自由主义） - 联合民主阵线是一个自由主义党派。它是该国与苏丹人民解放运动无关的主要反对党。"
 SSU.anarchist_communism: "£generic_anarchist_communism_small (SANU) - 苏丹非洲民族联盟"
 SSU.anarchist_communism_desc: "（非洲民族主义）- 苏丹非洲民族联盟成立于1963年，旨在寻求南苏丹脱离阿拉伯苏丹政府的自治。该党的创始人之一威廉·邓尼尔支持泛非洲民主社会主义，因为该党为苏丹各非洲族群的权利而战。"
 SSU.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (SPLM) - 苏丹人民解放运动"
 SSU.Neutral_Autocracy_desc: "（新苏丹）- 苏丹人民解放运动是苏丹人民解放军的一个政治分支，为南苏丹人民的权利而战。尽管该组织最初的意图是将苏丹组建为一个按照联邦制原则统治的“新苏丹”，但该组织越来越倾向于南北苏丹完全分离。"
 SSU.Neutral_conservatism: "£generic_Neutral_conservatism_small (SPLM-DC) - 苏丹人民解放运动 - 民主变革"
 SSU.Neutral_conservatism_desc: "（南苏丹民族主义）民主变革党是苏丹人民解放运动的一个分裂派系，由拉姆·阿科尔领导。"
 SSU.neutral_Social: "£generic_neutral_Social_small (LPSS) - 南苏丹工党"
 SSU.neutral_Social_desc: "（社会民主主义）- 南苏丹工党是一个社会民主党，旨在建立一个公正、平等的南苏丹。"
 SSU.Nat_Populism: "£generic_Nat_Populism_small (SSLM) - 南苏丹解放运动"
 SSU.Nat_Populism_desc: "（南苏丹分离主义） - 南苏丹解放运动于1999年由反苏丹苏丹人民解放军和亲苏丹南苏丹国防军中的努尔人创立。该组织正式宣布自己不参与冲突。该组织表示，只要苏丹停止袭击南苏丹领土，它愿意与苏丹政府进行谈判。"
 SSU.Nat_Autocracy: "£generic_Nat_Autocracy_small (SPLA) - 苏丹人民解放军"
 SSU.Nat_Autocracy_desc: "（军政府）- 苏丹人民解放军成立于1983年，是苏丹军队叛变的一部分。1986年政变后，军队开始在战场上取得更多胜利。人民解放军本身由许多不同的叛乱团体组成，冲突中团体倒戈并不罕见。"
 SUD.conservatism: "£generic_conservatism_small (DUP) - 民主统一党"
 SUD.conservatism_desc: "（自由保守主义）- 民主统一党是苏丹独立前成立的两大政党之一。该党希望建立一个世俗、民主多元和混合经济的苏丹，包括南苏丹和苏丹本土。自1989年奥马尔·巴希尔发动政变推翻民主统一党的总统艾哈迈德·米尔加尼以来，该党一直未能获得大量支持。"
 SUD.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (SPLM-N) - 苏丹人民解放运动-北方"
 SUD.Neutral_Autocracy_desc: "（新苏丹）- 苏丹人民解放运动-北方是苏丹人民解放运动的北方分支，致力于争取南苏丹独立。"
 SUD.Neutral_conservatism: "£generic_Neutral_conservatism_small (NUP) - 国家乌玛党"
 SUD.Neutral_conservatism_desc: "（伊斯兰民主主义）- 国家乌玛党与民主统一党并列为苏丹历史最悠久的政党之一。该党的目标是建立一个基于伊斯兰原则的民主苏丹。"
 SUD.neutral_Social: "£generic_neutral_Social_small (SCP) - 苏丹大会党"
 SUD.neutral_Social_desc: "（社会民主主义） - 苏丹大会党是苏丹最活跃的反对党之一。该党希望建立一个世俗民主的苏丹。他们反对加法尔·尼迈里的独裁统治以及巴希尔政府。"
 SUD.Monarchist: "£generic_Monarchist_small 穆罕默德·阿里王朝"
 SUD.Monarchist_desc: "（君主主义） - 在其统治的最后两年里，埃及国王采用了\"埃及与苏丹国王\"的称号，以强化埃及对苏丹的主权主张。当时苏丹由埃及和英国共同治理（实际上完全由英国控制），但没有任何国家正式承认这一称号中对苏丹的宣称。"
 SOV.Autocracy_1: "£SOV_congress_obshin (CRC)俄罗斯社区代表大会"
 SOV.Autocracy_1_icon: "£SOV_congress_obshin"
 SOV.Autocracy_1_desc: "（左翼保守主义）俄罗斯社区代表大会\n\n俄罗斯社区代表大会成立于1993年，是一个保护后苏联国家俄罗斯侨民利益的组织。后来，俄罗斯社区代表大会转变为一个政党，其总统候选人亚历山大·列别德在总统选举第一轮中获得16%的选票。该党倡导俄罗斯人民的权利，并支持扩大社会计划。"
 SOV.Neutral_conservatism_desc: "（民族保守主义）人民意志党\n\n人民意志党是由资深政治家谢尔盖·巴巴乌林创立的政党。该党聚集了前反叶利钦主义者和爱国者，如亚历山大·鲁茨科伊和尼古拉·列昂诺夫。人民意志党支持爱国主义、俄罗斯民族主义和民族主义思想。"
 SOV.Neutral_conservatism_1_desc: "（民族保守主义）人民联盟\n\n人民联盟是由资深政治家谢尔盖·巴巴乌林创立的政党。该党聚集了亚历山大·鲁茨科伊和尼古拉·列昂诺夫等前反叶利钦主义者。民意党支持爱国主义、俄罗斯民族主义和民族主义思想。"
 SOV.Neutral_conservatism_2_desc: "（民族保守主义）俄罗斯全民联盟\n\n俄罗斯全民联盟是由退伍军人兼政治家谢尔盖·巴巴乌林创立的政党。该党聚集了亚历山大·鲁茨科伊和尼古拉·列昂诺夫等前反叶利钦主义者。民意党支持爱国主义、俄罗斯民族主义和民族主义思想。"
