 RULE_EU_EXP_YES_DESC: "欧盟将优先考虑扩大法"
 RULE_OPTION_MULTIPOLAR_GREECE: "多极希腊"
 RULE_OPTION_MULTIPOLAR_GREECE_DESC: "希腊将继续保持共和国地位，但会疏远西方阵营，转而与俄罗斯、中国和伊朗建立友好关系，最终加入金砖国家，脱离西方机构。"
 RULE_FREE_FACTORIES_AMOUNT: "为玩家提供免费工厂"
