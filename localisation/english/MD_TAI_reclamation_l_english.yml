l_english:
 # Operation Blue Tiger milestone 5: Return to the Mainland
 TAI_reclamation_allowed_tt: "The §YReturn to the Mainland§! game rule allows this country to take the path"
 TAI_beijing_in_crisis_tt: "Beijing is in crisis: China is in a civil war, at war with a major power, or below §Y25%§! stability"
 TAI_repelled_invasion_tt: "We control every state we own"
 TAI_holds_mainland_capitals_tt: "We control Beijing, Nanjing, Shanghai, Guangdong, Hubei and Chongqing"
 TAI_mainland_control_tt: "We control at least §Y75%§! of the mainland's states (currently §Y[?TAI_mainland_control|0]%§!)"
 TAI_restoration_requirements_tt: "Full restoration needs §YBeijing, Nanjing, Shanghai, Guangdong, Hubei and Chongqing§! under our control, at least §Y75%§! of the mainland's states (we hold §Y[?TAI_mainland_control|0]%§!), an army of §Y60§! or more divisions, §Y40%§! stability and §Y50%§! war support."
 ROC_region_held_tt: "We own and control every state of this region that we hold, and hold at least one"
 TAI_reclamation_category: "Return to the Mainland"
 TAI_reclamation_category_desc: "§RAlternate history.§! In 1991 the Republic of China ended the Period of National Mobilization for Suppression of the Communist Rebellion and committed itself to peaceful means. This path breaks with that settlement. The island will fight for the mainland only on terms it can accept, and the balance between §YROC Restoration§! and §YTaiwanese Self-Determination§! decides what happens after victory."
 ROC_administration_category: "Provisional Administration"
 ROC_administration_category_desc: "The Republic's authority on the mainland rests on provisional decrees and military administrators. Restoring civil government region by region removes the penalties of §YProvisional Administration§!."
 TAI_convene_reclamation_pact: "Convene the Reclamation Pact"
 TAI_convene_reclamation_pact_desc: "Bring the parties, the generals and civic groups together to agree the terms on which Taiwan would fight for the mainland."
 TAI_carry_war_across_strait: "Carry the War Across the Strait"
 TAI_carry_war_across_strait_desc: "The invasion has failed. Pursue the enemy to the mainland. Washington's commitment covers Taiwan's defense, not this."
 TAI_strike_while_beijing_divided: "Strike While Beijing Is Divided"
 TAI_strike_while_beijing_divided_desc: "Beijing is in crisis. A war of our choosing would cost us the trust of the United States."
 TAI_reclamation_armistice: "The Reclamation Armistice"
 TAI_resume_reclamation_war: "Resume the Reclamation War"
 TAI_resume_reclamation_war_desc: "The armistice has given us time to rebuild. End it, and finish what the last war began."
 TAI_mobilize_for_reclamation: "Mobilize for Reclamation"
 TAI_mobilize_for_reclamation_desc: "Call up reservists and put the economy on a war footing."
 TAI_appeal_to_compatriots: "Appeal to Our Compatriots"
 TAI_appeal_to_compatriots_desc: "Broadcast the Republic's promises across the Strait: free elections, land reform, an end to the party-state."
 TAI_reassure_the_island: "Reassure the Island"
 TAI_reassure_the_island_desc: "Remind the people of Taiwan that the war is fought for their freedom too, and that their voice will count when it ends."
 TAI_negotiate_island_grievances: "Negotiate with the Island Opposition"
 TAI_negotiate_island_grievances_desc: "Open talks with the island's opposition to repair some of the damage done by breaking the pact."
 TAI_suppress_island_opposition: "Suppress the Island Opposition"
 TAI_suppress_island_opposition_desc: "Arrest the organizers and ban the demonstrations. Washington will notice."
 ROC_restore_north_china: "Restore Administration: North China"
 ROC_restore_north_china_desc: "Replace the military administrators of the North China Plain, from Beijing to Wuhan, with civil government."
 ROC_restore_east_china: "Restore Administration: East China"
 ROC_restore_east_china_desc: "Restore civil government in the Yangtze delta and the coastal provinces from Shandong's borders to Fujian."
 ROC_restore_south_china: "Restore Administration: South China"
 ROC_restore_south_china_desc: "Restore civil government in Guangdong, the southwest and Sichuan."
 ROC_restore_northeast: "Restore Administration: The Northeast"
 ROC_restore_northeast_desc: "Restore civil government in the old industrial northeast and Inner Mongolia."
 ROC_restore_northwest: "Restore Administration: The Northwest"
 ROC_restore_northwest_desc: "Restore civil government in the northwest and the Tibetan plateau, where the Republic's authority has always been thinnest."
 TAI_reclamation_bop: "Postwar Vision"
 TAI_bop_restoration: "ROC Restoration\n\nThe Republic is one country, and the war restores it."
 TAI_bop_self_determination: "Taiwanese Self-Determination\n\nThe people of Taiwan decide Taiwan's future."
 TAI_bop_contested: "A Divided Purpose"
 TAI_bop_restoration_ascendant: "Restoration Ascendant"
 TAI_bop_restoration_fervor: "Restoration Fervor"
 TAI_bop_self_determination_ascendant: "Self-Determination Ascendant"
 TAI_bop_self_determination_consensus: "Self-Determination Consensus"
 ROC_provisional_administration: "Provisional Administration"
 ROC_provisional_administration_desc: "Most of the country is governed by provisional decrees and military administrators. Each region restored to civil government, and each administrative reform, eases these penalties."
 TAI_reclamation_referendum_pledge: "Referendum Pledge"
 TAI_reclamation_referendum_pledge_desc: "We promised the people of Taiwan a referendum on their future after the war. Many who would not otherwise fight have enlisted."
 TAI_reclamation_autonomy_pledge: "Autonomy Pledge"
 TAI_reclamation_autonomy_pledge_desc: "We guaranteed Taiwan's autonomy within the restored Republic."
 TAI_reclamation_no_concessions: "No Concessions"
 TAI_reclamation_no_concessions_desc: "We promised the island nothing. Mobilization meets resistance at every level."
 TAI_broken_reclamation_pact: "Broken Reclamation Pact"
 TAI_broken_reclamation_pact_desc: "We broke the promise made to Taiwan before the war. The island's trust in the government is badly damaged."
 TAI_broken_reclamation_pact_severe: "Broken Reclamation Pact"
 TAI_broken_reclamation_pact_severe_desc: "We broke the promise made to Taiwan before the war, and the island had come to believe in it. Resistance runs through the legislature, the unions and the courts."
 TAI_island_crackdown: "Island Crackdown"
 TAI_island_crackdown_desc: "Demonstrations are banned and opposition organizers detained."
 TAI_taiwan_autonomy_charter: "Taiwan Autonomy Charter"
 TAI_taiwan_autonomy_charter_desc: "Taiwan governs its own internal affairs under a charter guaranteed by the Republic."
 TAI_cross_strait_partnership: "Cross-Strait Partnership"
 TAI_cross_strait_partnership_desc: "Taipei and the mainland government trade freely and settle disputes by negotiation."
 ROC_republic_restored: "The Republic Restored"
 ROC_republic_restored_desc: "Civil government reaches every region under the Republic's flag."
 ROC_three_principles_revived: "The Three Principles Revived"
 ROC_three_principles_revived_desc: "Nationalism, democracy and the people's livelihood guide the Republic's program on the mainland."
 ROC_reconstruction_program: "National Reconstruction Program"
 ROC_reconstruction_program_desc: "A national program directs money and labor to the projects the war left unfinished."
 ROC_national_army: "One National Army"
 ROC_national_army_desc: "One army, loyal to the constitution rather than a party."
 ROC_open_coast: "The Open Coast"
 ROC_open_coast_desc: "The coastal ports are open to world trade and foreign investment."
 CHI_ROC: "Republic of China"
 CHI_ROC_DEF: "the Republic of China"
 CHI_ROC_ADJ: "Chinese"
 reclamation.1.t: "A Pact for National Reclamation"
 reclamation.1.d: "Alternate history. Since 1991 the Republic of China has renounced force against the mainland. Now the cabinet asks the nation to accept a war to restore the Republic on both sides of the Strait. Party leaders, generals and civic groups gather in Taipei to set the terms. Many on the island will fight only if they are promised a say in what comes after."
 reclamation.1.a: "Promise a referendum on Taiwan's future after the war."
 reclamation.1.b: "Guarantee Taiwan's autonomy within the restored Republic."
 reclamation.1.c: "Offer no concessions. The Republic is one."
 reclamation.2.t: "Across the Strait"
 reclamation.2.d: "Alternate history. The landings have been thrown back and the island holds. The general staff now proposes what no government in Taipei has seriously planned for half a century: to carry the war to the mainland itself."
 reclamation.2.a: "For the Republic."
 reclamation.3.t: "Taipei Carries the War to the Mainland"
 reclamation.3.d: "Alternate history. Having repelled a Chinese invasion, the Republic of China has announced it will pursue the war onto the mainland. Our commitment covers Taiwan's defense. It was never meant to cover this."
 reclamation.3.a: "Stand by Taipei, but no further guarantees."
 reclamation.3.b: "Urge restraint publicly."
 reclamation.4.t: "Taipei Strikes First"
 reclamation.4.d: "Alternate history. The Republic of China has attacked the mainland while Beijing is in crisis. No American administration promised to support a Taiwanese war of choice, and Congress is demanding answers."
 reclamation.4.a: "Condemn the attack and suspend assistance."
 reclamation.4.b: "Stay quiet and watch."
 reclamation.5.t: "Beijing Capitulates"
 reclamation.5.d: "Alternate history. The government in Beijing can no longer resist. Whether the Republic can now govern the whole country is another question: it needs the great cities, most of the provinces, an army large enough to garrison them and a home front still willing to pay. Without them, the wiser course is an armistice that keeps what we hold."
 reclamation.5.a: "Restore the Republic's authority over all of China."
 reclamation.5.b: "Accept an armistice and hold what we have."
 reclamation.6.t: "The Postwar Settlement"
 reclamation.6.d: "Alternate history. The war is won. The promises made in Taipei before it began now fall due, and the island is watching to see whether they will be kept."
 reclamation.6.a: "Honor the referendum pledge."
 reclamation.6.b: "Negotiate continued association."
 reclamation.6.c: "Repudiate the pledge."
 reclamation.6.e: "Rule the whole Republic from Taipei."
 reclamation.7.t: "The Referendum"
 reclamation.7.d: "Alternate history. Voters across Taiwan, Penghu, Kinmen and Matsu are asked one question: should Taiwan form its own state, or remain part of the restored Republic?"
 reclamation.7.a: "Count the votes."
 reclamation.8.t: "Taiwan Chooses Its Own Path"
 reclamation.8.d: "Alternate history. A majority has voted for a separate Taiwanese state. The government will keep its word: the island becomes its own country, and the Republic on the mainland continues under a provisional government of its own. Taipei must decide where it will stand."
 reclamation.8.a: "Keep the promise."
 reclamation.9.t: "Two Republics"
 reclamation.9.d: "Alternate history. There are now two governments where there was one: Taiwan, and the Republic of China on the mainland. Which will you lead?"
 reclamation.9.a: "Remain with Taiwan."
 reclamation.9.b: "Lead the Republic on the mainland."
 reclamation.10.t: "Taiwan Votes to Remain"
 reclamation.10.d: "Alternate history. A majority has voted to keep Taiwan within the restored Republic. The government now owes the island the terms of that association."
 reclamation.10.a: "Draft the terms."
 reclamation.11.t: "Terms of Association"
 reclamation.11.d: "Alternate history. Negotiators from the island and the new provincial administrations have two models on the table: one Republic with a chartered autonomy for Taiwan, or a federal union in which Taiwan governs itself under the Republic's protection."
 reclamation.11.a: "One Republic, with an autonomous Taiwan."
 reclamation.11.b: "A federal union under the mainland government."
 reclamation.12.t: "The Pact Is Broken"
 reclamation.12.d: "Alternate history. The government has set aside the promise it made before the war. On the island, the people who were asked to fight for the Republic in exchange for a voice now say they were deceived."
 reclamation.12.a: "The Republic cannot be divided."
 reclamation.13.t: "Protests in Taipei"
 reclamation.13.d: "Alternate history. Hundreds of thousands have filled Ketagalan Boulevard demanding the promised referendum. Opposition legislators have joined them, and the police ask for instructions."
 reclamation.13.a: "Open talks with the protest leaders."
 reclamation.13.b: "Clear the streets."
 reclamation.14.t: "A General Strike on the Island"
 reclamation.14.d: "Alternate history. Dockworkers in Kaohsiung and engineers in Hsinchu have walked out together. Shipping is stopped and the foundries are idle until the government honors its pledge."
 reclamation.14.a: "Concede ground to the strikers."
 reclamation.14.b: "Break the strike."
 reclamation.16.t: "Voices on the Island"
 reclamation.16.d: "Alternate history. No promise was made before the war, and none is owed. Still, many on Taiwan now ask whether the island they defended has become one province among thirty."
 reclamation.16.a: "Promise local self-government."
 reclamation.16.b: "Nothing has changed. Taiwan is the Republic."
 reclamation.18.t: "The Crusade Falters"
 reclamation.18.d: "Alternate history. The war has ended without the mainland in our hands. The generals blame the politicians, the politicians blame Washington, and the island counts the cost of a gamble that failed."
 reclamation.18.a: "Return to the defense of Taiwan."
 reclamation.19.t: "A Republic on the Mainland"
 reclamation.19.d: "Alternate history. A provisional government of the Republic of China now sits on the mainland, separate from Taipei. It inherits a vast country, a broken party-state and an army that fought against it months ago. Its first decision is where to govern from."
 reclamation.19.a: "Return to Nanjing, the Republic's old capital."
 reclamation.19.b: "Govern from Beijing."
 reclamation.20.t: "The Republic Restored"
 reclamation.20.d: "Alternate history. Civil administration now reaches every region under the Republic's flag. The provisional decrees lapse and the ordinary laws of the Republic take their place."
 reclamation.20.a: "A new beginning."
 ROC_m_provisional_government: "The Provisional Government"
 ROC_m_provisional_government_desc: "Alternate history. A government of the Republic sits on the mainland for the first time since 1949. Before it can rule it must exist: a cabinet, a budget and a chain of command that reaches beyond the capital."
 ROC_m_temporary_provisions: "End the Emergency Decrees"
 ROC_m_temporary_provisions_desc: "Alternate history. The provisional decrees that carried the Republic through the war were meant to be temporary. Ending them early tells the country that the Republic means to govern by law."
 ROC_m_national_assembly: "Convene a National Assembly"
 ROC_m_national_assembly_desc: "Alternate history. Delegates from every province meet to draft the Republic's postwar constitution."
 ROC_m_three_principles: "Revive the Three Principles"
 ROC_m_three_principles_desc: "Alternate history. Nationalism, democracy and the people's livelihood: Sun Yat-sen's program was written for this country before it was carried to Taiwan."
 ROC_m_amnesty: "Amnesty for Party Members"
 ROC_m_amnesty_desc: "Alternate history. Tens of millions belonged to the old ruling party. An amnesty keeps the county offices staffed and the trains running, at the price of leaving yesterday's officials in place."
 ROC_m_lustration: "Lustration of the Cadres"
 ROC_m_lustration_desc: "Alternate history. Senior officials of the old regime are barred from public office. The purge is popular with the victims of the old order and leaves many offices empty."
 ROC_m_local_self_government: "Local Self-Government"
 ROC_m_local_self_government_desc: "Alternate history. County and city elections give local communities a stake in the Republic and take some of the burden off the provisional administration."
 ROC_m_first_elections: "The First Free National Elections"
 ROC_m_first_elections_desc: "Alternate history. For the first time, the whole country votes for its government."
 ROC_m_constitutional_court: "A Constitutional Court"
 ROC_m_constitutional_court_desc: "Alternate history. Judges independent of the party and the army will decide what the new constitution means."
 ROC_m_republic_endures: "The Republic Endures"
 ROC_m_republic_endures_desc: "Alternate history. A free government has survived its first years on the mainland."
 ROC_m_restore_ministries: "Restore the Ministries"
 ROC_m_restore_ministries_desc: "Alternate history. The ministries are staffed again, partly by officials from Taipei and partly by former mainland civil servants willing to serve."
 ROC_m_reconstruction_program: "The Reconstruction Program"
 ROC_m_reconstruction_program_desc: "Alternate history. War damage, abandoned projects and neglected provinces: a national program sets priorities for all of them."
 ROC_m_rebuild_railways: "Rebuild the Trunk Railways"
 ROC_m_rebuild_railways_desc: "Alternate history. The trunk lines between Beijing, Wuhan, Shanghai and Guangzhou carry the country. Bridges and junctions destroyed in the war come first."
 ROC_m_power_grid: "Restore the Power Grid"
 ROC_m_power_grid_desc: "Alternate history. Factories cannot reopen until the power stations and transmission lines do."
 ROC_m_return_the_displaced: "Return the Displaced"
 ROC_m_return_the_displaced_desc: "Alternate history. Millions fled the fighting. Bringing them home is the first test of whether the Republic can care for its people."
 ROC_m_provincial_governors: "Appoint Provincial Governors"
 ROC_m_provincial_governors_desc: "Alternate history. Civilian governors replace the military administrators who have run the provinces since the war."
 ROC_m_new_yuan: "The New Yuan"
 ROC_m_new_yuan_desc: "Alternate history. A new currency, backed by reserves from Taipei and foreign credit, replaces the old renminbi."
 ROC_m_reopen_coast: "Reopen the Coastal Markets"
 ROC_m_reopen_coast_desc: "Alternate history. The ports of Shanghai, Tianjin and Guangzhou reopen to world trade under the Republic's flag."
 ROC_m_land_to_the_tiller: "Land to the Tiller"
 ROC_m_land_to_the_tiller_desc: "Alternate history. On Taiwan, land reform built a class of farmer-owners who backed the Republic. The provisional government offers the same bargain on the mainland."
 ROC_m_taiwanese_capital: "Invite Taiwanese Capital"
 ROC_m_taiwanese_capital_desc: "Alternate history. Taiwanese firms know the mainland's factories better than anyone. They are invited back on generous terms."
 ROC_m_state_enterprises: "Restructure the State Enterprises"
 ROC_m_state_enterprises_desc: "Alternate history. The giant state enterprises are broken up, sold or put on commercial footing. Layoffs follow."
 ROC_m_industrial_heartland: "Rebuild the Industrial Heartland"
 ROC_m_industrial_heartland_desc: "Alternate history. The northeast and the Yangtze valley are rebuilt as the Republic's industrial base."
 ROC_m_second_miracle: "A Second Economic Miracle"
 ROC_m_second_miracle_desc: "Alternate history. What Taiwan did in the 1960s, the mainland now tries at fifty times the scale."
 ROC_m_national_army: "One National Army"
 ROC_m_national_army_desc: "Alternate history. Units from Taiwan and new mainland formations are combined under a single command loyal to the constitution, not a party."
 ROC_m_integrate_pla: "Integrate the PLA Remnants"
 ROC_m_integrate_pla_desc: "Alternate history. Former PLA officers and men who swear loyalty to the Republic keep their posts. The army gains experience and inherits old loyalties."
 ROC_m_disband_pla: "Disband the PLA"
 ROC_m_disband_pla_desc: "Alternate history. The old army is demobilized and a new one is recruited from volunteers. It is smaller, untested and politically reliable."
 ROC_m_seat_at_un: "Reclaim the Security Council Seat"
 ROC_m_seat_at_un_desc: "Alternate history. The Republic of China held a permanent seat on the Security Council until 1971. Its diplomats argue that it never lost the right to it."
 ROC_m_friends_in_washington: "Friends in Washington"
 ROC_m_friends_in_washington_desc: "Alternate history. Washington supported Taiwan for half a century. The Republic on the mainland asks it to extend that friendship."
 ROC_m_compact_with_taipei: "A Compact with Taipei"
 ROC_m_compact_with_taipei_desc: "Alternate history. Two governments descended from one republic agree to keep the peace, trade freely and settle disputes by negotiation."
 ROC_m_settle_borders: "Settle the Borders"
 ROC_m_settle_borders_desc: "Alternate history. Moscow and New Delhi want to know whether the Republic will honor the border agreements of the People's Republic. It will, for a price."
 ROC_m_free_china_among_nations: "A Free China Among Nations"
 ROC_m_free_china_among_nations_desc: "Alternate history. The Republic takes its place in the world as a great power and a democracy."
 ROC_m_free_china: "Free China"
 ROC_m_free_china_desc: "Alternate history. The civil war that divided the Chinese nation in 1949 is over. The Republic Sun Yat-sen founded governs the mainland again, by consent."
