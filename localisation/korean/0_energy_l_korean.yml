 energy_building_battery_parks: "배터리 저장소 §Y건설중§!"
 energy_building_battery_parks_desc: "우리는 포괄적인 재생에너지의 길을 선택했습니다. 이제 재생에너지 인프라를 통해 생산된 에너지를 저장할 수 있는 기반 시설을 구축하는 데 착수해야 할 때입니다."
