 alg_promote_arabization: "Promote Arabization"
 alg_promote_arabization_desc: "Strengthen national unity by reinforcing Arab identity. This will stabilize the country but anger Kabyles and Mozabites."
 alg_recognize_tamazight: "Recognize Tamazight Language"
 alg_recognize_tamazight_desc: "Grant official recognition to the Tamazight language, satisfying Kabyles but angering Arab nationalists."
 alg_ethnicity.100.t: "Kabyle Protests"
 alg_ethnicity.100.d: "Frustration in Kabylia has boiled over into protests demanding cultural rights and autonomy. The government must decide whether to suppress them or make concessions."
 alg_ethnicity.100.a: "Suppress the Protests"
 alg_ethnicity.100.b: "Make Concessions"
 alg_ethnicity.200.t: "Crisis in Kabylia"
 alg_ethnicity.200.d: "Kabyle unrest has reached breaking point. The Movement for the Self-Determination of Kabylie is calling openly for independence, the gendarmerie has lost control of Tizi Ouzou, and the Arouch village committees are refusing every channel the government offers. Algiers must answer before the region slips away entirely."
 alg_ethnicity.200.a: "Give them what they Want"
 alg_ethnicity.200.b: "Risk a Civil War"
 alg_ethnicity.200.c: "Recognise Tamazight and Reform"
 alg_appease_kabyles: "Appease the Kabyle Population"
 alg_appease_kabyles_desc: "Growing unrest in Kabylia threatens national stability. By offering concessions such as cultural recognition, economic investment, or limited autonomy, we can calm tensions, though this risks emboldening other regions to demand the same."
 alg_ethnic_policy: "Ethnic Policy"
 alg_ethnic_policy_desc: "\n£MAIN_arab_kabyle\n\n\n\nAlgeria is a diverse country with significant ethnic groups: Arabs, Kabyles, Tuaregs, Mozabites, and Chaouis. Government policy must balance their demands, decisions will bring benefits, but upsetting any group risks unrest and even secession."
 ALG_sahara_poaching: "Poaching in the Sahara"
 ALG_sahara_poaching_desc: "Poaching is a major issue across Algeria's vast Sahara and steppe. Gazelles, bustards, and Barbary sheep are hunted illegally, while trafficking routes connect to international markets. Combined with overgrazing and water overuse, poaching accelerates desertification and biodiversity loss.\n\nLikelihood of §YDesertification§!: §R[?sahara_expands]%§!\nLikelihood of §YStabilisation§!: [?sahara_steady]%\nLikelihood of §YOasification§!: §G[?sahara_retreats]%§!\n\nEvery month, there is a\n§Y[?chance_to_not_kill_poachers]%§! chance of §Y15 new poachers§! entering operations.\n§Y[?chance_to_kill_poachers]%§! chance of our security forces eliminating §Y[?no_of_poachers_to_kill] poachers§!\n\nHigher §YInternal Security Spending§! and targeted anti-poaching measures improve our chances of success.\n\nEstimated active poachers: [?no_of_poachers] ([ALG_threat_level_of_poachers])"
 ALG_bi_yearly_poaching_report: "Yearly Poaching Report"
 ALG_bi_yearly_poaching_report_desc: "Every 12 months, the impact of poaching is assessed. A §GLow Threat§! reduces the risk of desertification, while a §RHigh Threat§! increases it."
 ALG_anti_poaching_extra_security: "Hire Extra Rangers"
 ALG_anti_poaching_extra_security_desc: "Recruit more rangers and patrols to combat poaching across the Sahara and steppe."
 ALG_anti_poaching_extra_security_tt: "§GThe chance of eliminating poachers increases by 10%§!"
 ALG_anti_poaching_heavy_weapons: "Equip Anti-Poaching Units"
 ALG_anti_poaching_heavy_weapons_desc: "Providing patrols with vehicles, drones, and heavy weapons boosts their effectiveness against armed poaching groups."
 ALG_anti_poaching_heavy_weapons_tt: "§GThe number of poachers eliminated increases by 5§!"
 ALG_anti_poaching_awareness: "Wildlife Protection Campaign"
 ALG_anti_poaching_awareness_desc: "Run a public campaign to raise awareness about the importance of protecting endangered species from poaching."
 ALG_threat_level_of_poachers_low: "§GLow Threat§!"
 ALG_threat_level_of_poachers_medium: "§YMedium Threat§!"
 ALG_threat_level_of_poachers_high: "§RHigh Threat§!"
 ALG_eliminate_half_of_poachers: "§GReduce number of poachers by §Y[?poachers_killed]§!§!"
 ALG_anti_poaching_decisions: "Poaching in the Sahara"
 ALG_anti_poaching_decisions_desc: "Poaching in Algeria's Sahara remains a persistent problem. Endangered species such as the addax, gazelles, and desert cheetahs are hunted for trade or sport, while smuggling routes often link these activities to wider criminal and terrorist networks across the Sahel. Some poachers come from neighbouring Mali, Niger, and Libya, though local groups are also involved. Algerian authorities have taken a hard stance on §Ypoachers§!, and clashes between them and security forces are not uncommon.\n\nPoaching (together with overgrazing, climate change, and unsustainable land use) contributes to the continuing desertification of the Sahara. Combating poaching and protecting fragile ecosystems is an important step in safeguarding both biodiversity and human livelihoods.\n\nLikelihood of §YDesertification§!: §R[?sahara_expands]%§!\nLikelihood of §YStabilisation§!: [?sahara_steady]%\nLikelihood of §YOasification§!: §G[?sahara_retreats]%§!\n\nEvery month, there is a\n§Y[?chance_to_not_kill_poachers]%§! chance of §Y15 new poachers§! starting operations.\n§Y[?chance_to_kill_poachers]%§! chance of our security forces eliminating §Y[?no_of_poachers_to_kill] poachers§!\n\nWe can increase the likelihood of eliminating poachers by raising §YInternal Security§! spending or by equipping and training our forces for desert operations.\n\nCurrent estimated amount of poachers: [?no_of_poachers] ([ALG_threat_level_of_poachers])"
 ALG_anti_poaching_dehorn_camels: "Camel Marking Campaign"
 ALG_anti_poaching_dehorn_camels_desc: "Marking and closely monitoring camel herds across the Sahara could help discourage poachers and smugglers. While camels are not endangered, they are often targeted for smuggling routes or illegal trade. By introducing identification tags, community oversight, and patrol cooperation, we can make it more difficult for poachers to profit from camel theft and trade."
 ALG_anti_poaching_dehorn_camels_tt: "§GA successful campaign will halve the number of poachers§!"
 ALG_total_ban_on_poaching: "Total Ban on Poaching"
 ALG_total_ban_on_poaching_desc: "Poaching threatens endangered species such as the addax, gazelle, and desert cheetah. While some hunting traditions persist, we must take decisive action and enforce a total ban on poaching across reserves and fragile ecosystems to protect our natural heritage."
 alg_appease_kabyles_tt: "Increase funding for Kabyle-majority regions, cultural programs, and local autonomy. Arab nationalists will be displeased."
 alg_arabization_tt: "Promote Arabic language and Arab-Islamic identity in education and public life. Berber communities will resist."
 alg_ethnic.10.t: "Tamazight Recognition Bears Fruit"
 alg_ethnic.10.d: "Three months after recognizing Tamazight, Berber communities are reporting improved relations with the state. Public approval is rising."
 alg_ethnic.10.a: "A new chapter for Algeria."
 ALG_ethnic_data.1.t: "Ethnic Demographics of Algeria"
 ALG_ethnic_data.1.d: "Our analysis of Algeria's ethnic composition following the Black Spring is complete. The crisis has revealed deep fractures in our society:\n\n§YArabs§!: [?ALG_ethnic_arab]%, Satisfaction: [?ALG_arab_satisfaction]/100\nThe majority population. Their dominance is being questioned.\n\n§Yⵣ Kabyles§!: [?ALG_ethnic_kabyle]%, Satisfaction: [?ALG_kabyle_satisfaction]/100\n§RThe Black Spring has radicalized many. Tensions are critical.§!\n\n§YChaouis§!: [?ALG_ethnic_chaoui]%, Satisfaction: [?ALG_chaoui_satisfaction]/100\nWatching events in Kabylie closely.\n\n§Y⵿ Tuaregs§!: [?ALG_ethnic_tuareg]%, Satisfaction: [?ALG_tuareg_satisfaction]/100\nSaharan communities feel neglected by Algiers.\n\n§Yⵎ Mozabites§!: [?ALG_ethnic_mozabite]%, Satisfaction: [?ALG_mozabite_satisfaction]/100\nMaintaining their distinct Ibadi communities.\n\n§YOthers§!: [?ALG_ethnic_other]%\n\n§YThe Ethnic Management System is now active.§!"
 ALG_ethnic_data.1.a: "We must manage this carefully."
 ALG_ethnic_system_active_tt: "§GEthnic Management System is now active!§!\n\nMonitor satisfaction in the decision panel.\nUse policies to keep groups satisfied.\nNeglected groups will cause problems!"
 ALG_ethnic_data_category: "[ALG.GetFlag]§YEthnic Demographics§!"
 ALG_ethnic_data_category_desc: "§YAlgeria's Ethnic Mosaic§! represents the complex tapestry of peoples that make up our nation. In the aftermath of the devastating §RCivil War (1991-2002)§!, managing ethnic relations has become crucial for national stability. President [ALG.GetLeader]'s policy of national reconciliation must address the grievances of all communities.\n\nThe §YKabyle population§! in particular remains restless - the §RBlack Spring of 2001§! looms on the horizon if their concerns are not addressed. Meanwhile, the §YTuareg§! communities in the south watch events in neighboring Mali and Niger with interest.\n\n§H HOW IT WORKS §!\n\nEach ethnic group has a §Ysatisfaction level§! (0-100):\n§G- Above 70§!: Group is §GCONTENT§! -> Provides national bonuses\n§Y- 40-70§!: Group is §YNEUTRAL§! -> No special effects\n§R- Below 40§!: Group is §RDISCONTENT§! -> Causes penalties\n§R- Below 25§!: §RDANGER§! -> Severe penalties, possible revolt\n\n§YSatisfaction decays monthly§! for neglected groups. Favoring one group often upsets others!\n\n§H CURRENT STATUS §!\n\n§YARABS§! - [?ALG_ethnic_arab]% of population\n  Satisfaction: [?ALG_arab_satisfaction]/100\n  §YWhen Content:§! §G+Political Power, +Stability, +Manpower§!\n\n§YKABYLES§! - [?ALG_ethnic_kabyle]% of population\n  Satisfaction: [?ALG_kabyle_satisfaction]/100\n  §YWhen Content:§! §G+Research Speed§!\n  §RWarning: Black Spring may trigger if satisfaction stays low!§!\n\n§YCHAOUIS§! - [?ALG_ethnic_chaoui]% of population\n  Satisfaction: [?ALG_chaoui_satisfaction]/100\n  §YWhen Content:§! §G+Construction Speed, +Resources§!\n\n§YTUAREGS§! - [?ALG_ethnic_tuareg]% of population\n  Satisfaction: [?ALG_tuareg_satisfaction]/100\n  §YWhen Content:§! §G+Army Organization, +Desert Combat§!\n\n§YMOZABITES§! - [?ALG_ethnic_mozabite]% of population\n  Satisfaction: [?ALG_mozabite_satisfaction]/100\n  §YWhen Content:§! §G-Consumer Goods, +Trade§!\n\n§YOTHERS§! - [?ALG_ethnic_other]% of population"
 ALG_census_tt: "Conduct a comprehensive national census to update demographic data and inform policy."
 ALG_ethnic_data.2.t: "Census Results and National Identity"
 ALG_ethnic_data.2.d: "Our census reveals Algeria's ethnic diversity. How should we respond politically?"
 ALG_ethnic_data.2.a: "Reinforce Arab-Islamic identity."
 ALG_ethnic_data.2.b: "Celebrate our Berber and Arab heritage equally."
 ALG_ethnic_data.2.c: "Avoid taking a stance."
 ALG_ethnic_data.20.t: "Ghardaïa Clashes"
 ALG_ethnic_data.20.d: "§R2013 - M'ZAB VALLEY§!\n\nViolent clashes have erupted between Arab and Mozabite communities in the M'zab Valley, centered on the historic city of Ghardaïa. The violence, which began over a cemetery dispute, has escalated into widespread communal riots.\n\nMozabite shops and homes have been attacked and burned. Several people have been killed on both sides. The Mozabite community, descendants of the ancient Rustamid dynasty, feel their very existence is threatened.\n\nThe security forces are struggling to contain the situation. How do we respond?"
 ALG_ethnic_data.20.a: "The Arabs have legitimate grievances. Side with them."
 ALG_ethnic_data.20.b: "Protect the Mozabite minority. Deploy troops to secure their areas."
 ALG_ethnic_data.20.c: "Attempt neutral mediation between both communities."
 ALG_ghardaia_arab_side_tt: "We side with the Arab community.\n§RMozabite satisfaction -20§!\n§GArab satisfaction +5§!"
 ALG_ghardaia_mozabite_side_tt: "We deploy forces to protect Mozabites.\n§RMozabite satisfaction -5§! (appreciative but traumatized)\n§RArab satisfaction -10§!"
 ALG_ghardaia_neutral_tt: "We attempt mediation.\n§RMozabite satisfaction -10§!\n§RArab satisfaction -3§!\nNeither side is fully satisfied."
 ALG_ethnic_data.10.t: "Ethnic Tensions Rising"
 ALG_ethnic_data.10.d: "Reports indicate growing unrest among dissatisfied ethnic communities. Local officials warn that protests are being organized, and some fear more radical action if concerns aren't addressed.\n\n§RCurrent Crisis Groups:§!"
 ALG_ethnic_data.10.a: "We cannot address every complaint."
 ALG_ethnic_data.10.b: "Send officials to address their concerns."
 ALG_show_ethnic_data: "§YView Ethnic Overview§!"
 ALG_show_ethnic_data_desc: "Review the current status of all ethnic groups in Algeria."
 ALG_ethnic_overview_full_tt: "§HETHNIC GROUPS OVERVIEW§!\n\n§YARABS§! | Pop: §G[?ALG_ethnic_arab]%§! | Satisfaction: §B[?ALG_arab_satisfaction]§!/100\n§Yⵣ KABYLES§! | Pop: §G[?ALG_ethnic_kabyle]%§! | Satisfaction: §B[?ALG_kabyle_satisfaction]§!/100\n§YCHAOUIS§! | Pop: §G[?ALG_ethnic_chaoui]%§! | Satisfaction: §B[?ALG_chaoui_satisfaction]§!/100\n§Y⵿ TUAREGS§! | Pop: §G[?ALG_ethnic_tuareg]%§! | Satisfaction: §B[?ALG_tuareg_satisfaction]§!/100\n§Yⵎ MOZABITES§! | Pop: §G[?ALG_ethnic_mozabite]%§! | Satisfaction: §B[?ALG_mozabite_satisfaction]§!/100\n§YOTHERS§! | Pop: §G[?ALG_ethnic_other]%§!\n\n§YRemember:§! Groups lose satisfaction if not actively supported!"
 ALG_favor_arab_policies: "Pro-Arab Policies"
 ALG_favor_arab_policies_desc: "Promote Arabic language, Arab-Islamic cultural identity, and prioritize Arab regions in development.\n\n§GEffects:§!\n• Arab satisfaction §G+10§!\n• Kabyle satisfaction §R-5§!\n• Chaoui satisfaction §R-3§!\n• Tuareg satisfaction §R-3§!\n• Mozabite satisfaction §R-3§!\n\n§YCooldown:§! 60 days"
 ALG_favor_arab_tt: "§GArabs are pleased with our support!§!\n§RMinority groups feel marginalized.§!"
 ALG_favor_kabyle_policies: "Pro-Kabyle Policies"
 ALG_favor_kabyle_policies_desc: "Support Tamazight language education, Kabyle cultural preservation, and development in Kabylie region.\n\n§GEffects:§!\n• Kabyle satisfaction §G+10§!\n• Arab satisfaction §R-5§!\n• Chaoui satisfaction §R-2§!\n\n§YCooldown:§! 60 days"
 ALG_favor_kabyle_tt: "§GKabyles celebrate recognition of their heritage!§!\n§RArabs feel their dominance threatened.§!"
 ALG_favor_chaoui_policies: "Pro-Chaoui Policies"
 ALG_favor_chaoui_policies_desc: "Invest in development of the Aurès Mountains region and support Chaoui cultural initiatives.\n\n§GEffects:§!\n• Chaoui satisfaction §G+10§!\n• Arab satisfaction §R-3§!\n• Kabyle satisfaction §R-2§!\n\n§YCooldown:§! 60 days"
 ALG_favor_chaoui_tt: "§GChaouis appreciate the development in their region!§!"
 ALG_favor_tuareg_policies: "Pro-Tuareg Policies"
 ALG_favor_tuareg_policies_desc: "Support Tuareg autonomy in the Sahara, invest in southern development, and integrate Tuareg communities.\n\n§GEffects:§!\n• Tuareg satisfaction §G+10§!\n• Arab satisfaction §R-3§!\n\n§YCooldown:§! 60 days"
 ALG_favor_tuareg_tt: "§GThe Blue Men of the desert appreciate our attention!§!"
 ALG_favor_mozabite_policies: "Pro-Mozabite Policies"
 ALG_favor_mozabite_policies_desc: "Protect Ibadi religious practices, support Mozabite merchant communities, and develop the M'zab Valley.\n\n§GEffects:§!\n• Mozabite satisfaction §G+10§!\n• Arab satisfaction §R-2§!\n\n§YCooldown:§! 60 days"
 ALG_favor_mozabite_tt: "§GMozabite merchants expand their trade networks!§!"
 ALG_recognize_tamazight_1: "Recognize Tamazight Language"
 ALG_recognize_tamazight_1_desc: "Officially recognize Tamazight as a national language of Algeria, alongside Arabic. This historic decision would address a core demand of the Berber movement.\n\n§GEffects:§!\n• Kabyle satisfaction §G+20§!\n• Chaoui satisfaction §G+15§!\n• Tuareg satisfaction §G+10§!\n• Mozabite satisfaction §G+10§!\n• Arab satisfaction §R-10§!\n• §G+5%§! Stability\n\n§YAvailable after 2002§!"
 ALG_recognize_tamazight_tt: "§GHistoric recognition of Tamazight as a national language!§!\nAll Berber groups are pleased, but Arab nationalists are upset."
 ALG_national_unity_initiative: "National Unity Initiative"
 ALG_national_unity_initiative_desc: "Launch a comprehensive program promoting Algerian national identity above ethnic divisions, building on Bouteflika's reconciliation policy.\n\n§GEffects:§!\n• All groups satisfaction §G+5§!\n• §G+3%§! Stability on completion\n\n§YThis is expensive but balanced.§!\n§YCooldown:§! 180 days"
 ALG_unity_policy_tt: "§GAll Algerians unite under the national banner!§!"
 ALG_suppress_ethnic_unrest: "§RSuppress Ethnic Unrest§!"
 ALG_suppress_ethnic_unrest_desc: "Use security forces to quell ethnic protests and restore order.\n\n§REMERGENCY MEASURE§! - Only available when groups are in crisis (<25 satisfaction).\n\n§YEffects:§!\n• Critical groups satisfaction §G+15§!\n• §R-5%§! Stability\n• §R-3%§! War Support\n\n§RThis is only a temporary solution!§!"
 ALG_suppress_unrest_tt: "Security forces restore order for now.\n§RThis will not solve the underlying issues.§!"
 ALG_conduct_national_census: "Conduct National Census"
 ALG_conduct_national_census_desc: "Perform a detailed demographic census to better understand our population composition."
 ALG_census_arab_focus_tt: "§GArabs are pleased!§! Other groups feel marginalized."
 ALG_census_balanced_tt: "§GAll groups appreciate the recognition of diversity!§!"
 ALG_census_neutral_tt: "We take no official stance on identity politics."
 ALG_arab_content: "Arab Community Support"
 ALG_arab_content_desc: "The Arab majority supports the government wholeheartedly, providing political backing and eager recruits for our armed forces."
 ALG_arab_discontent: "Arab Discontent"
 ALG_arab_discontent_desc: "The Arab population is growing frustrated with government policies that seem to favor minorities at their expense."
 ALG_arab_unrest: "Arab Unrest"
 ALG_arab_unrest_desc: "The Arab majority is deeply unhappy. Protests and civil unrest are becoming common, threatening the stability we fought so hard to achieve after the Civil War."
 ALG_chaoui_content: "Aurès Prosperity"
 ALG_chaoui_content_desc: "The Chaoui people are contributing to construction and mining projects throughout the Aurès Mountains, boosting regional development."
 ALG_chaoui_discontent: "Aurès Neglect"
 ALG_chaoui_discontent_desc: "The Chaoui population feels forgotten by the central government. Development in the Aurès region has stagnated since the Civil War."
 ALG_tuareg_content: "Tuareg Alliance"
 ALG_tuareg_content_desc: "The proud Tuareg warriors support the government and lend their legendary desert warfare expertise to our military."
 ALG_tuareg_discontent: "Saharan Tension"
 ALG_tuareg_discontent_desc: "The Tuareg communities feel ignored by Algiers. Regional instability in Mali and Niger is making them question their loyalty."
 ALG_tuareg_unrest: "Tuareg Uprising"
 ALG_tuareg_unrest_desc: "Tuareg fighters are organizing armed resistance in the Sahara. Cross-border movements with Mali and Niger complicate matters. The south is becoming ungovernable."
 ALG_mozabite_content: "Mozabite Commerce"
 ALG_mozabite_content_desc: "The business-minded Mozabite community is boosting trade networks and reducing consumer goods costs through their commercial expertise."
 ALG_mozabite_discontent: "M'zab Tensions"
 ALG_mozabite_discontent_desc: "The Mozabite community is withdrawing from national economic participation. Tensions with Arab neighbors in the M'zab Valley are rising."
 ALG_ethnic_harmony: "Ethnic Harmony"
 ALG_ethnic_harmony_desc: "All major ethnic groups are content with government policies. Algeria stands united, finally moving past the trauma of the Civil War!"
 ALG_ethnic_tension: "Ethnic Tensions"
 ALG_ethnic_tension_desc: "Multiple ethnic groups are deeply unhappy. The fragile peace of the Bouteflika era is crumbling as the country fractures along ethnic lines."
