 TAI_pc_industry_events.10.t: "A Small PC for Everyone"
 TAI_pc_industry_events.10.d: "ASUS has unveiled the compact Eee PC, combining low cost, portability, and an unconventional software stack. The project can open a value-mobility category, support a premium notebook line, or reinforce ASUS as a component-platform company."
