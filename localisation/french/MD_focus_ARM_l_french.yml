 ARM_defence: "En garde pour l'Arménie"
 ARM_defence_desc: "Notre pays a besoin d'une meilleure protection, et seuls les meilleurs services spéciaux peuvent la fournir, que nous financerons généreusement."
 ARM_police: "Police de l'Arménie"
 ARM_police_desc: "La Police de la République d'Arménie est la police nationale d'Arménie. Nous sommes désormais prêts pour une réforme globale de cette structure : nous recruterons de nouveaux agents, écarterons les fonctionnaires corrompus et augmenterons le budget de la police."
 ARM_police_troops: "Troupes de police"
 ARM_police_troops_desc: "Les troupes de police arméniennes ont participé à toutes les opérations majeures aux côtés des anciennes troupes intérieures et de leurs prédécesseurs soviétiques. Leur mission comprend la protection des installations sensibles, le maintien de l'ordre public, la sécurité publique et la formation initiale des conscrits et des sous-officiers."
 ARM_national_central_bureua: "Bureau central national"
 ARM_national_central_bureua_desc: "Le Bureau central national répartit ses activités entre trois divisions : criminologie, soutien opérationnel et assistance technique. Nous augmenterons les financements et procéderons à des réformes du personnel afin que ces trois divisions fonctionnent à plein régime."
 ARM_special_oper_forces: "Forces d’opérations spéciales"
 ARM_special_oper_forces_desc: "Les forces spéciales d'élite de la police arménienne, chargées de contrer les menaces armées contre l'État, sont actuellement en retard en termes de composition et d'équipement, et nous comptons les moderniser entièrement."
 ARM_black_panters: "Panthères noires"
 ARM_black_panters_desc: "Les Black Panthers sont d'anciens militaires intégrés aux forces spéciales de la police. Leur expérience du combat et leurs méthodes d'intervention sur le terrain constituent un atout précieux pour nos forces de l'ordre."
 ARM_nss: "Service de Sécurité Nationale"
 ARM_nss_desc: "Le Service national de sécurité est la principale agence arménienne chargée de la sécurité nationale et du renseignement. Encore relativement jeune, il manque de personnel expérimenté. Nous remédierons à cette situation grâce à des réformes ciblées et à un financement accru."
 ARM_take_border_troops: "Garde-frontière"
 ARM_take_border_troops_desc: "Les gardes-frontières arméniens surveillent et sécurisent les frontières de l'Arménie avec la Turquie, l'Azerbaïdjan, l'Iran et la Géorgie. Chroniquement sous-financés, ils n'accomplissent actuellement qu'une fraction de leurs missions. Nous allons remédier à cette situation."
 ARM_economic_corruption_security: "Sécurité économique et lutte contre la corruption"
 ARM_economic_corruption_security_desc: "Cette unité est chargée de lutter contre la corruption et de protéger l'économie arménienne contre le sabotage interne. La sécurité économique étant plus cruciale que jamais, investir dans ce département est une nécessité, et non un luxe."
 ARM_constitutional_teerorism: "Sécurité et Constitution"
 ARM_constitutional_teerorism_desc: "Ce département a pour mission de défendre l'ordre constitutionnel et de lutter contre le terrorisme. Un financement supplémentaire permettra de renforcer ses capacités et d'améliorer sa réactivité."
 ARM_alpha: "Forces spéciales Alpha"
 ARM_alpha_desc: "Les forces spéciales d'élite des services de renseignement arméniens, qui couvrent un large éventail de missions allant de la lutte contre le crime organisé au contre-terrorisme, bénéficieront d'un renouvellement de leurs effectifs et d'un financement accru qui amélioreront considérablement leurs capacités."
 ARM_fis_desc: "The Foreign Intelligence Service is Armenia's primary external intelligence agency. Our own state intelligence service, which will be responsible for all our unofficial foreign policy actions."
 ARM_special_services_category: "Services spéciaux de l’Arménie"
 ARM_special_services_category_desc: "[ARM.GetFlag]§YL'Arménie§! n'est pas seulement protégée par une armée vaillante qui a surmonté le [NKR.GetFlag]§Rconflit du Karabakh§! par la §Gvictoire§!, mais aussi par de vaillants £text_icon_armnss §2forces de l'ordre et services spéciaux§!, auxquels l'État ne doit pas lésiner, car c'est la clé de la §Ysécurité intérieure £text_icon_armnss du pays§!.\n\nEn §Gachevant§! les focus de la branche £text_icon_armnss §Ydes services spéciaux§!, vous §Gdébloquerez§! de plus en plus d'§Yesprits nationaux§!, qui s'afficheront ci-dessous."
