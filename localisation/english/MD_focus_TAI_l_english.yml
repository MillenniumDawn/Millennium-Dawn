 TAI_pc_industry_events.8.d: "The proposed Gigabyte-ASUS combination has run into strategic and competitive objections. Gigabyte can suspend the venture and refocus on its own products, revive cooperation where an earlier agreement permits it, or convert prior systems investment into a fully independent route."
