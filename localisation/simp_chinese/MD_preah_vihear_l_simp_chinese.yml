l_simp_chinese:
 preah_vihear_decisions_category: "柏威夏边境争端"
 preah_vihear_dispute: "柏威夏寺争端"
 SIA_escalate_preah_vihear_tensions: "升级边境紧张局势"
 SIA_escalate_preah_vihear_tensions_desc: "正式开启对峙：命令部队重新部署在扁担山脉附近，并让民族主义媒体大肆报道。金边方面会清楚地听到这个信息，而且这第一步已经没有回头路了。"
 SIA_request_asean_mediation: "请求东盟调停"
 SIA_request_asean_mediation_desc: "请求东盟介入调解与柬埔寨的边境争端。这一外交手段可能有助于缓和紧张局势，寻求和平解决方案。"
 SIA_accept_icj_ruling: "接受国际法院裁决"
 SIA_accept_icj_ruling_desc: "接受国际法院关于柏威夏寺争端的裁决。这将结束冲突，但可能被视为外交上的失败。"
 SIA_reject_icj_ruling: "拒绝国际法院裁决"
 SIA_reject_icj_ruling_desc: "拒绝国际法院的裁决，继续坚持我们对争议领土的主张。这将加剧国际紧张局势，但能展现我们的决心。"
 CBD_protest_thai_actions: "外交抗议"
 CBD_protest_thai_actions_desc: "召见泰国大使，向东盟和联合国正式提出抗议，让全国人民看到政府的立场。这既能在国内积聚政治资本，又能将我们的不满公之于众，而不是假装平息曼谷根本无意平息的边境冲突。"
 CBD_request_asean_mediation: "请求东盟调停"
 CBD_request_asean_mediation_desc: "请求东盟介入调停与泰国的边境争端。区域性外交解决方案或有助于维护我方主张。"
 CBD_appeal_to_icj: "向国际法院提起诉讼"
 CBD_appeal_to_icj_desc: "向国际法院提起诉讼，重申柬埔寨对柏威夏寺及周边领土的主权。"
 preah_vihear.100.t: "联合国教科文组织将柏威夏寺列为世界遗产"
 preah_vihear.100.d: "联合国教科文组织正式将柏威夏寺列为世界遗产，并认定其归属柬埔寨。泰国各地爆发民族主义抗议活动，示威者要求采取军事行动保护他们眼中的泰国领土。边境局势正在迅速恶化。"
 preah_vihear.100.a: "这简直是奇耻大辱！立刻集结我们的部队！"
 preah_vihear.100.b: "我们应当尊重国际决议。"
 preah_vihear.101.t: "联合国教科文组织承认柏威夏寺"
 preah_vihear.101.d: "联合国教科文组织已正式将古老的柏威夏寺列为柬埔寨主权下的世界遗产。这是一次重大的外交胜利，重申了1962年国际法院的裁决。然而，泰国的民族主义抗议活动可能导致我们边境的紧张局势加剧。"
 preah_vihear.101.a: "对柬埔寨意义重大的一天！"
 preah_vihear.1.t: "泰国的边境挑衅"
 preah_vihear.1.d: "泰国已在我国柏威夏寺附近边境地区升级紧张局势。曼谷的民族主义抗议者要求采取军事行动，泰国军队也已向争议地区重新部署。"
 preah_vihear.1.a: "我们必须保持警惕。"
 preah_vihear.5.t: "泰国军队发动进攻！"
 preah_vihear.5.d: "泰国军队已入侵柏威夏寺附近有争议的边境地区。我军正在与入侵者交战。国际社会密切关注，局势恐将升级为全面冲突。"
 preah_vihear.5.a: "保卫我们的领土！"
 preah_vihear.6.t: "柬埔寨反击"
 preah_vihear.6.d: "柬埔寨军队已对我国位于柏威夏寺附近的阵地发起反击。边境沿线可听到炮火与轻武器交火声。"
 preah_vihear.6.a: "我们必须坚守阵地"
 preah_vihear.10.t: "边境冲突胜利"
 preah_vihear.10.d: "我军已在柏威夏附近的边境冲突中达成作战目标。敌军已被击退，我们在该地区展示了军事实力。"
 preah_vihear.10.a: "好消息"
 preah_vihear.11.t: "边境冲突失利"
 preah_vihear.11.d: "我军在柏威夏附近的边境冲突中遭到击退。此次交战以失败告终，我军已撤回原阵地并出现伤亡。"
 preah_vihear.11.a: "惨痛的挫折"
 preah_vihear.12.t: "边境冲突未分胜负"
 preah_vihear.12.d: "靠近柏威夏寺的边境冲突以僵局告终。双方均未达成目标而撤退，但都获得了宝贵的实战经验。"
 preah_vihear.12.a: "重新集结并评估局势"
 preah_vihear.13.t: "反击胜利"
 preah_vihear.13.d: "我们的反击成功击退了敌军。我们已经表明，任何对我们领土的侵略都将遭到坚决抵抗。"
 preah_vihear.13.a: "我们的主权得到捍卫"
 preah_vihear.14.t: "反击被击退"
 preah_vihear.14.d: "我们的反击已被敌军击退。尽管我们竭尽全力，仍未能将他们从争议地区的阵地上驱逐出去。"
 preah_vihear.14.a: "我们会恢复的!"
 preah_vihear.20.t: "东盟调解提案"
 preah_vihear.20.d: "泰国已请求东盟就柏威夏边境争端进行调解。作为东盟轮值主席国，印尼提议向边境地区派遣观察员，并推动双方谈判。"
 preah_vihear.20.a: "接受调停"
 preah_vihear.20.b: "拒绝调停"
 preah_vihear.21.t: "东盟调解提案"
 preah_vihear.21.d: "柬埔寨已请求东盟就柏威夏边境争端进行调解。作为东盟轮值主席国，印尼提议向边境地区派遣观察员，并推动双方谈判。"
 preah_vihear.21.a: "接受调停"
 preah_vihear.21.b: "拒绝调停"
 preah_vihear.22.t: "东盟调解已接受"
 preah_vihear.22.d: "泰国和柬埔寨均已同意接受东盟调解。印尼观察员将被部署至边境地区，外交谈判即将启动，以寻求和平解决争端。"
 preah_vihear.22.a: "和平之路"
 preah_vihear.23.t: "东盟调解遭拒"
 preah_vihear.23.d: "对方拒绝了东盟在柏威夏寺争端中的调解。外交努力已经失败，边境紧张局势依然严峻。"
 preah_vihear.23.a: "我们必须为持续的对抗做好准备。"
 preah_vihear.30.t: "柬埔寨向国际法院提出诉讼"
 preah_vihear.30.d: "柬埔寨已就柏威夏寺争端向国际法院提起诉讼。法院将审议柬埔寨提出的临时措施请求，并最终对主权问题作出裁决。"
 preah_vihear.30.a: "我们等待法庭的判决。"
 preah_vihear.31.t: "国际法院作出对我方有利的裁决"
 preah_vihear.31.d: "国际法院重申柬埔寨对柏威夏寺的主权，并命令双方从寺庙周边的临时非军事区撤出军事人员。"
 preah_vihear.31.a: "国际法站在我们这边。"
 preah_vihear.32.t: "国际法院裁定我方败诉"
 preah_vihear.32.d: "国际法院裁定支持柬埔寨对柏威夏寺的主权主张。法院已下令在争议区域周边设立非军事区。"
 preah_vihear.32.a: "这是一项不公正的裁决。"
 preah_vihear.35.t: "泰国接受国际法院裁决"
 preah_vihear.35.d: "泰国已接受国际法院对柏威夏寺争端的裁决。泰国军队将从非军事区撤出，这实际上意味着边境危机的结束。"
 preah_vihear.35.a: "终于和平了"
 preah_vihear.36.t: "泰国拒绝接受国际法院裁决"
 preah_vihear.36.d: "泰国拒绝接受国际法院关于柏威夏寺争端的裁决，称其不公，并拒绝承认法院的管辖权。预计边境紧张局势将会加剧。"
 preah_vihear.36.a: "我们必须为持续的冲突做好准备。"
 preah_vihear_news.1.t: "柏威夏争议得到解决"
 preah_vihear_news.1.d: "泰国与柬埔寨之间关于柏威夏寺的长期边境争端已得到解决。泰国接受了国际法院确认柬埔寨对该寺庙群拥有主权的裁决。两国同意从该地区撤出军事力量，并建立正常外交关系。"
 preah_vihear_news.1.o1: "地区稳定得到恢复"
 preah_vihear_news.2.t: "东盟斡旋边境争端"
 preah_vihear_news.2.d: "通过东盟调解，泰国与柬埔寨已同意就柏威夏寺边境争端进行降级处理。印尼观察员将监督停火，两国正致力于通过外交途径解决分歧。"
 preah_vihear_news.2.o1: "外交手段占了上风"
 preah_vihear_news.3.t: "泰国与柬埔寨爆发边境冲突"
 preah_vihear_news.3.d: "泰柬边境争议地区柏威夏寺附近爆发武装冲突。泰国军队已在该地区展开军事行动，柬埔寨军队正在予以回击。据报告，双方已进行炮击与轻武器交火。这座被联合国教科文组织列为世界遗产的古老寺庙群正陷入战火之中，两国领土争端持续升级。"
 preah_vihear_news.3.o1: "危险的升级"
 preah_vihear_decisions_category_desc: "柏威夏寺是一座建于11世纪的高棉圣地，坐落在扁担山脉之上，横跨一条边界线。法国殖民时期的地图和1962年国际法院的裁决都认定柬埔寨占优，但泰国从未完全接受这一结果。2008年联合国教科文组织将其列入世界遗产名录，再次揭开了这道伤口。即使寺庙本身并无争议，但寺庙周围的山坡仍然是双方争夺的焦点。局势升级可能导致双方争夺山崖。每一次冲突都会消耗双方都不愿保留的资源。\n\n§Y边境紧张度：§![?GLOBAL.preah_vihear_tension]\n§Y我们的准备情况：§![?THIS.preah_vihear_readiness]\n§Y我们的冲突进展：§![?THIS.preah_vihear_war_progress]"
 preah_vihear_deescalation_goodwill: "缓和局势的善意"
 SIA_pv_prepare_infantry_training: "进行步兵野外演习"
 SIA_pv_prepare_infantry_training_desc: "轮换前线步兵部队在丹格雷克断崖周围的地形进行实战演习，利用储备的小型武器和支援武器，提高他们应对与柬埔寨边境冲突的准备程度。"
 SIA_pv_prepare_armor_training: "进行装甲野外演习"
 SIA_pv_prepare_armor_training_desc: "将装甲部队调往柏威夏附近的山丘进行机动演习，测试两栖坦克和中型坦克在不适合它们作战的地形上的表现。"
 SIA_pv_prepare_artillery_training: "进行炮兵野外演习"
 SIA_pv_prepare_artillery_training_desc: "炮兵阵地向俯瞰神庙的悬崖进行炮击演练，模拟此前在这条边境线上已经多次爆发的交火。"
 SIA_pv_nationalist_rhetoric: "举行集会引导民族主义舆论"
 SIA_pv_nationalist_rhetoric_desc: "鼓励部长、军方发言人和官方媒体在国内煽动民族主义情绪，以解决与柬埔寨的边界争端。这种做法在国内很受欢迎，但每一轮都会加剧边境地区的紧张局势。"
 SIA_pv_military_posturing: "在边境重新部署兵力"
 SIA_pv_military_posturing_desc: "向柏威夏附近的边境增派部队，以示决心。柬埔寨方面会清楚地解读这一举动。"
 SIA_pv_attack_preah_vihear: "发动边境入侵"
 SIA_pv_attack_preah_vihear_desc: "派遣军队越过边境，夺取寺庙群周围的阵地。成功便能将争议地区置于我方掌控之下。失败则会使我们在国内外失去大量支持，付出惨痛代价。"
 SIA_pv_extort_xp: "从边境汲取教训"
 SIA_pv_extort_xp_desc: "对曾在边境地区作战的军官进行情况汇报，并将这些经验纳入正规军条令中，前提是那里的战斗产生了足够的经验教训。"
 SIA_pv_decisive_victory: "取得决定性胜利"
 SIA_pv_decisive_victory_desc: "鉴于战斗的天平已经完全倒向我方，要乘胜追击：迫使柬埔寨做出屈辱的让步，并将此次对峙宣布为国家胜利，而无需我方军队再推进一米。"
 SIA_pv_capture_northern_khmer: "夺取北柬埔寨"
 SIA_pv_capture_northern_khmer_desc: "战局已完全倒向我们这边，争议的悬崖峭壁已在我们面前敞开。与其满足于虚名，不如彻底占领这片土地：直接吞并柬埔寨北部省份，在寺庙上插上国旗，并按照我们的条件永久解决边界问题。柬埔寨永远不会原谅我们，世界也将称之为征服。"
 SIA_pv_de_escalate: "主动提出缓和局势"
 SIA_pv_de_escalate_desc: "通过与金边方面的秘密渠道沟通来释放克制信号：将部队从前沿阵地撤回，缓和言辞。这除了政治资本之外，我们无需付出任何代价，却能赢得日后可能需要的好感。"
 CBD_pv_prepare_infantry_training: "进行步兵野外演习"
 CBD_pv_prepare_infantry_training_desc: "在柏威夏山综合设施周围，轮换前线步兵部队进行实战演习，利用储备的小型武器和支援武器，提高他们应对与泰国边境冲突的准备程度。"
 CBD_pv_prepare_armor_training: "进行装甲野外演习"
 CBD_pv_prepare_armor_training_desc: "将装甲部队部署到有争议的寺庙附近进行机动演习，测试两栖坦克和中型坦克在不适合它们作战的地形上的表现。"
 CBD_pv_prepare_artillery_training: "进行炮兵野外演习"
 CBD_pv_prepare_artillery_training_desc: "炮兵部队向悬崖上的泰国阵地进行炮击演练，模拟此前在这条边境线上已经多次爆发的交火。"
 CBD_pv_nationalist_rhetoric: "举行集会引导民族主义舆论"
 CBD_pv_nationalist_rhetoric_desc: "鼓励部长、军方发言人和官方媒体在国内煽动民族主义情绪，以解决与泰国的边界争端。这种做法在国内很受欢迎，但每一轮都会加剧边境地区的紧张局势。"
 CBD_pv_military_posturing: "在边境重新部署兵力"
 CBD_pv_military_posturing_desc: "向柏威夏附近的边境增派部队，以示决心。泰国方面会清楚地解读这一举动。"
 CBD_pv_attack_preah_vihear: "发动边境入侵"
 CBD_pv_attack_preah_vihear_desc: "派遣军队越过边境，夺取寺庙群周围的阵地。成功便能将争议地区置于我方掌控之下。失败则会使我们在国内外失去大量支持，付出惨痛代价。"
 CBD_pv_extort_xp: "从边境汲取教训"
 CBD_pv_extort_xp_desc: "对曾在边境地区作战的军官进行情况汇报，并将这些经验纳入正规军条令中，前提是那里的战斗产生了足够的经验教训。"
 CBD_pv_decisive_victory: "取得决定性胜利"
 CBD_pv_decisive_victory_desc: "鉴于战斗的天平已经完全倒向我方，要乘胜追击：迫使泰国做出屈辱的让步，并将此次对峙宣布为国家胜利，而无需我方军队再推进一米。"
 CBD_pv_de_escalate: "主动提出缓和局势"
 CBD_pv_de_escalate_desc: "通过与曼谷的秘密渠道沟通来释放克制信号：将部队从前沿阵地撤回，缓和言辞。这除了政治资本之外，我们无需付出任何代价，却能赢得日后可能需要的好感。"
 preah_vihear_increase_readiness_TT: "§G这将提高我们的边境准备度§!"
 preah_vihear_increase_tension_TT: "§Y这将加剧边境紧张局势§!"
 preah_vihear_tension_TT: "边境紧张局势高于40"
 preah_vihear_readiness_TT: "我们的边境准备度高于50"
 preah_vihear_progress_25_TT: "冲突进程超过25"
 preah_vihear_decrease_progress_25_TT: "§R这将使我们的冲突进程减少25§!"
 preah_vihear_progress_50_TT: "冲突进程超过50"
 preah_vihear_decrease_progress_50_TT: "§R这将使我们的冲突进程减少50§!"
 preah_vihear_deescalation_uses_remaining_TT: "我们仍有缓和局势的提议。"
 preah_vihear_decrease_tension_10_TT: "§G这将使我们的边境紧张度降低10§!"
 preah_vihear_deescalation_used_TT: "§R使用我们有限的降级方案之一§!"
 preah_vihear_no_clash_TT: "目前没有发生边境冲突。"
 preah_vihear_not_settled_TT: "过去五年里，边界问题一直没有得到解决。"
 preah_vihear_no_recent_escalation_TT: "我们最近在边境没有采取任何挑衅行动。"
 preah_vihear_no_recent_protest_TT: "我们最近并没有煽动民族主义情绪。"
 preah_vihear_progress_80_TT: "冲突进程超过80"
 preah_vihear_decrease_progress_80_TT: "§R这将使我们的冲突进程减少80§!"
 preah_vihear_protest_grievance_TT: "边境紧张度高于10，或者泰国已经越境发动袭击。"
 preah_vihear_mediation_tension_TT: "边境紧张度高于20"
 preah_vihear_tension_resolved_TT: "§G这将使我们的边境紧张度归零§!"
 preah_vihear.40.t: "边境训练事故"
 preah_vihear.40.d: "边境附近的一次实弹演习出了差错。装备受损，数名士兵无法继续服役，这次挫折打击了人们对战备计划的信心。"
 preah_vihear.40.a: "吸取教训"
 preah_vihear.41.t: "挑衅适得其反"
 preah_vihear.41.d: "最新一轮的言论和军队调动在国内引发了不必要的关注。反对派人士和媒体质疑政府是否在人为制造一场无法控制的危机，政府被迫缓和了紧张局势。"
 preah_vihear.41.a: "吸取教训"
 preah_vihear.110.t: "诺帕敦公报"
 preah_vihear.110.d: "外交部长诺帕顿·帕塔玛与他人共同签署了一份联合公报，支持柬埔寨将柏威夏寺列入联合国教科文组织世界遗产名录。这份公报一经发布，便在国内引发轩然大波。宪法法院正在审查该协议是否未经议会批准，而民族主义批评人士则要求撤换外交部长。"
 preah_vihear.110.a: "坚持公报"
 preah_vihear.110.b: "驳回这项提议，让部长离开。"
 preah_vihear.111.t: "他信在金边"
 preah_vihear.111.d: "洪森首相任命逃亡的他信·西那瓦为他的私人经济顾问，此举显然是对曼谷政府的蓄意挑衅。柬埔寨拒绝考虑引渡他信，这一任命已成为中柬两国交锋的焦点。"
 preah_vihear.111.a: "召回我们的大使"
 preah_vihear.111.b: "仅提出正式抗议"
 preah_vihear.112.t: "边境的黄衫军"
 preah_vihear.112.d: "人民民主联盟抓住边界争端大做文章，指责政府与金边关系过于密切，在国家主权问题上过于软弱。总理府外的集会人数丝毫没有减少的迹象。"
 preah_vihear.112.a: "应对抗议活动"
 preah_vihear.120.t: "争端提交联合国安理会"
 preah_vihear.120.d: "边境危机已升级到提交安理会审议的地步。成员国呼吁双方保持克制，但预计不会采取任何具有约束力的行动。"
 preah_vihear.120.a: "注意程序"
 preah_vihear.121.t: "印尼提供观察员"
 preah_vihear.121.d: "作为东盟轮值主席国，印尼提议部署非武装观察员监测边境并报告违反停火协议的情况。雅加达方面将此举视为建立信任的举措，而非调解解决。"
 preah_vihear.121.a: "接受观察员"
 preah_vihear.121.b: "拒绝提议"
 preah_vihear.130.t: "一场决定性的失败"
 preah_vihear.130.d: "对方在柏威夏对峙中取得了决定性胜利，现在正动用一切外交和宣传渠道，试图让这场耻辱持续下去。虽然没有领土易手，但我方在边境的处境比多年来任何时候都更加脆弱。"
 preah_vihear.130.a: "暂时接受挫折吧"
 preah_vihear.130.b: "做好全面战争的准备"
 preah_vihear.131.t: "悬崖沦陷了"
 preah_vihear.131.d: "泰军已占领争议地区，曼谷正式吞并了北柬埔寨省，包括寺庙在内。1962年本应属于我们的裁决，在占据高地的军队面前毫无意义。举国震惊，要求我们给出或许无法给出的答案。"
 preah_vihear.131.a: "我国的黑暗日"
 preah_vihear.131.b: "我们将会把它夺回来"
