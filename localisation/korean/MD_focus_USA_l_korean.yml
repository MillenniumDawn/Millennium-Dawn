 USA_treason_event.20.t: "개혁 공화국 우파 \\"2020\\""
 USA_treason_event.20.d: "축하합니다, 당신은 체제를 이겼습니다. 그렇다면 이제 누구를 선택하시겠습니까. 정부 없는 자유지상당, 침착한 개혁당, 그리고 마지막으로 헌법을 문서로 사랑하는 헌정당이 있습니다."
 USA_treason_event.20.o1: "작은 권력, 작은 정부!"
 USA_treason_event.20.o2: "이유가 있는 개혁 공화국"
 USA_treason_event.20.o3: "문서가 곧 법이다!"
 USA_treason_event.20.o4: "왼쪽도 한번 살펴볼까요"
 USA_treason_event.21.t: "개혁 공화국 좌파 \\"2020\\""
 USA_treason_event.21.d: "축하합니다, 당신은 체제를 이겼습니다. 그렇다면 이제 누구를 선택하시겠습니까. 나무를 껴안는 녹색당, 분홍 리본을 맨 진보당, 그리고 마지막으로 유럽 정치를 미국에 들여오자는 민주사회주의자들이 있습니다."
 USA_treason_event.21.o1: "나는 자연을 사랑한다"
 USA_treason_event.21.o2: "나는 사회 진보를 사랑한다"
 USA_treason_event.21.o3: "나는 유럽의 사상을 사랑한다"
 USA_treason_event.21.o4: "나는 양념을 사랑한다, 이 맛들은 뭐죠"
 USA_treason_event.22.t: "개혁 공화국 연립 \\"2020\\""
 USA_treason_event.22.d: "당신이 체제를 너무 심하게 이긴 나머지 어딘가 망가진 모양입니다. 더 부숴 보시겠습니까? 국민전선당과 양치기당이 있습니다. 어느 연립으로 유리창을 깨시겠습니까."
 USA_treason_event.22.o1: "나는 레드 벨벳이 좋다"
 USA_treason_event.22.o2: "나는 밀크 초콜릿이 좋다"
 USA_treason_event.22.o3: "잠깐, 길을 잃은 것 같은데, 입구가 어디죠?"
 USA_treason_event.23.t: "개혁 공화국 우파 \\"2024\\""
 USA_treason_event.23.d: "축하합니다, 당신은 체제를 이겼습니다. 그렇다면 이제 누구를 선택하시겠습니까. 정부 없는 자유지상당, 침착한 개혁당, 그리고 마지막으로 헌법을 문서로 사랑하는 헌정당이 있습니다."
 USA_treason_event.23.o1: "작은 권력, 작은 정부!"
 USA_treason_event.23.o2: "이유가 있는 개혁 공화국"
 USA_treason_event.23.o3: "문서가 곧 법이다!"
 USA_treason_event.23.o4: "왼쪽도 한번 살펴볼까요"
 USA_treason_event.24.t: "개혁 공화국 좌파 \\"2024\\""
 USA_treason_event.24.d: "축하합니다, 당신은 체제를 이겼습니다. 그렇다면 이제 누구를 선택하시겠습니까. 나무를 껴안는 녹색당, 분홍 리본을 맨 진보당, 그리고 마지막으로 유럽 정치를 미국에 들여오자는 민주사회주의자들이 있습니다."
 USA_treason_event.24.o1: "나는 자연을 사랑한다"
 USA_treason_event.24.o2: "나는 사회 진보를 사랑한다"
 USA_treason_event.24.o3: "나는 유럽의 사상을 사랑한다"
 USA_treason_event.24.o4: "나는 양념을 사랑한다, 이 맛들은 뭐죠"
 USA_treason_event.25.t: "개혁 공화국 연립 \\"2024\\""
 USA_treason_event.25.d: "당신이 체제를 너무 심하게 이긴 나머지 어딘가 망가진 모양입니다. 더 부숴 보시겠습니까? 국민전선당과 양치기당이 있습니다. 어느 연립으로 유리창을 깨시겠습니까."
 USA_treason_event.25.o1: "나는 레드 벨벳이 좋다"
 USA_treason_event.25.o2: "나는 밀크 초콜릿이 좋다"
 USA_treason_event.25.o3: "잠깐, 길을 잃은 것 같은데, 입구가 어디죠?"
 USA_ban_election_fraud: "선거 부정 사건 중지"
 USA_ban_election_fraud_desc: "의회가 선거 조작을 금지합니다. 대통령 선거에서 부정 선택지가 더 이상 나타나지 않습니다. 이 효과가 유지되는 동안 선거 부정 사건이 발생하지 않습니다."
 USA_allow_election_fraud: "선거 부정 사건 허용"
 USA_allow_election_fraud_desc: "의회가 선거 부정 금지를 철회합니다. 대통령 선거가 다시 조작될 수 있으며, 선거 부정 사건이 발생하기 시작합니다."
 department_of_state.201.t: "아프가니스탄, 복귀를 요청"
 department_of_state.201.d: "탈레반이 우리가 떠난 땅을 되찾고 있습니다. [AFG.GetLeader]은(는) 카불이 함락되기 전에 우리 병력을 다시 보내 임무를 재개해 달라고 요청했습니다."
 department_of_state.201.a: "그들을 버리지 않겠다"
 department_of_state.201.b: "아프가니스탄은 스스로 일어서야 한다"
 department_of_state.202.t: "미국, 복귀를 거부"
 department_of_state.202.d: "워싱턴이 우리의 요청을 거절했습니다. 미군은 돌아오지 않을 것이며, 우리는 탈레반에 맞서 스스로 전선을 지켜야 합니다."
 department_of_state.202.a: "그렇다면 홀로 싸우겠다"
 usa.204.t: "비행기가 뱅크 오브 아메리카 플라자에 추락"
 usa.204.d: "테러 공격 몇 달 뒤, 15세 소년이 플로리다 주 탬파에서 경비행기를 훔쳐 뱅크 오브 아메리카 플라자에 고의로 충돌시켰습니다. 이 사건은 그 공격에 영향을 받은 것으로 알려졌습니다. 건물 안에 있던 사람은 아무도 죽거나 다치지 않았으며, 어린 조종사만이 유일한 사망자였습니다."
 usa.204.a: "공격의 불안한 메아리"
 raid_type_raid_baath_desc: "특수부대가 이라크에서 여전히 도피 중인 바트당 고위 지도자들을 추적하여 체포하고, 구 정권의 잔당을 와해시킵니다."