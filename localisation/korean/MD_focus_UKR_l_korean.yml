 ukraine_varyag.8.desc: "§Y[UKR.GetNameWithFlag]§!§W은(는) 구매자에게 대금을 보상하고 §!§Y[TUR.GetNameWithFlag]§!§W에 예인 주선 비용을 지불했습니다. 미완성 항공모함이 §!§L흑해 조선소§!§W로 §!§G돌아왔습니다§!§W.§!"
 ukraine_varyag.8.a: "귀환을 확인한다"
 ukraine_varyag.9.name: "§Y바랴크§!, 취역하다"
 ukraine_varyag.9.desc: "§W조선소가 개수를 마치고 해군이 §!§G항공모함을 인수했습니다§!§W. 승조원들은 갑판 시험을 시작할 수 있으며, 조선소의 경험은 §!§G다음 항공모함 설계에 반영될 것입니다§!§W.§!"
