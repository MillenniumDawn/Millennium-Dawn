 BRA_idea_associate_states_desc: "[THIS.GetNameWithFlag](은)는 메르코수르의 준회원국입니다. 준회원국은 기구에서 발언하고 목소리를 낼 수 있으나, 블록의 투표권을 가진 정회원국은 아닙니다."
