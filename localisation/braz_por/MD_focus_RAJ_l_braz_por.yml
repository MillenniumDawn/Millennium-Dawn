 pak_raj_border_attack_426_from_984:0 "Atacar Sindh a partir do Rajastão Ocidental"
 pak_raj_border_attack_426_from_984_desc:0 "Avançar do Rajastão Ocidental rumo a Sindh. Um avanço bem-sucedido adiciona §Y20 de Progresso da Reivindicação§! rumo a este estado; um rechaço custa §Y10§!."
 pak_raj_border_attack_984_from_426:0 "Atacar o Rajastão Ocidental a partir de Sindh"
 pak_raj_border_attack_984_from_426_desc:0 "Avançar de Sindh rumo ao Rajastão Ocidental. Um avanço bem-sucedido adiciona §Y20 de Progresso da Reivindicação§! rumo a este estado; um rechaço custa §Y10§!."
 pak_raj_border_attack_426_from_987:0 "Atacar Sindh a partir de Guzerate Ocidental"
 pak_raj_border_attack_426_from_987_desc:0 "Avançar através do Rann de Kutch, de Guzerate Ocidental rumo a Sindh. Um avanço bem-sucedido adiciona §Y20 de Progresso da Reivindicação§! rumo a este estado; um rechaço custa §Y10§!."
 pak_raj_border_attack_987_from_426:0 "Atacar Guzerate Ocidental a partir de Sindh"
