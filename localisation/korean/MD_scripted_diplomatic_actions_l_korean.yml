 REQUEST_CIV_SPY_ACCESS_ACTION_DESC: "강화된 지구 관측 및 모니터링 기능을 위해 그들의 민간 정찰 위성 체계에 대한 통합 접근을 요청합니다. 여기에는 표준 영상 공유 계약, 기술 데이터 형식 조정, 우리 분석 시스템을 위한 다운링크 프로토콜 구축이 포함됩니다. 이러한 접근은 환경 모니터링, 재난 대응 계획 및 인프라 평가를 개선시킵니다. 수락되면 그들은 우리의 §Y민간용 첩보위성 네트워크§!에 접근할 수 있게 됩니다."
