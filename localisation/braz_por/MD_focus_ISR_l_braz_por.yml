 israel.113.d: "Recentemente, depois que [HAM.GetNameWithFlag] atacou a fronteira de Israel, [HAM.GetNameWithFlag] não teve sucesso contra as forças israelenses."
 israel.113.a: "Ótimo!"
 israel.113.b: "Teremos sucesso da próxima vez!"
 israel.114.t: "[HAM.GetNameWithFlag] tem sucesso nos confrontos recentes!"
