 EH_territorial_defense_idea_TT: "§YДобавляет модификатор «Территориальная оборона»§!"
 EH_electric_traps_TT: "Включает решения §YЭлектроловушки§!, которые будут появляться на карте во время войны с Химерой (при активной вкладке решений). Каждую ловушку можно установить в контролируемом регионе — §Yпередовой линии§! или §Yвторой линии§!. Установка ловушки обойдётся в §R1 технологический металл§! и будет потреблять §R100 МВт§! энергии, пока активна.\n\nЛовушка будет активна в течение §Y10 дней§!, а затем перейдёт в перезарядку на §Y15 дней§!. Пока ловушка активна, все вражеские подразделения в регионе получат §G+20%§! к §Yистощению§! и §G-15%§! к §Yскорости передвижения§!. Ловушку можно демонтировать, что вернёт §G1 технологический металл§!."
