 TOP_protection_three_tt: "§YExceptional Protective Security§!\nCost: §Y60§! political power and §Y$1.50 billion§!\nDuration: §Y182 days§!\nTimed operation success: §G-15 percentage points§!\nNative raid: §G15% chance§! to reduce a nonfailure result by one tier\nProtects our currently serving officials. Requires an eligible country and sufficient funds."
 TOP_counterintelligence_one_tt: "§YBasic Counterintelligence§!\nCost: §Y25§! political power and §Y$0.25 billion§!\nDuration: §Y182 days§!\nForeign dossier collection: §G-3 confidence per collection§!\nForeign operation exposure: §G+5 percentage points§!\nProtects our currently serving officials. Requires an eligible country and sufficient funds."
 TOP_counterintelligence_two_tt: "§YReinforced Counterintelligence§!\nCost: §Y40§! political power and §Y$0.75 billion§!\nDuration: §Y182 days§!\nForeign dossier collection: §G-6 confidence per collection§!\nForeign operation exposure: §G+10 percentage points§!\nProtects our currently serving officials. Requires an eligible country and sufficient funds."
 TOP_counterintelligence_three_tt: "§YExceptional Counterintelligence§!\nCost: §Y60§! political power and §Y$1.50 billion§!\nDuration: §Y182 days§!\nForeign dossier collection: §G-9 confidence per collection§!\nForeign operation exposure: §G+15 percentage points§!\nProtects our currently serving officials. Requires an eligible country and sufficient funds."
 TOP_security_stand_down_label: "Stand Down"
 TOP_security_stand_down_tt: "End both protective security and counterintelligence policies immediately. Previous spending is not refunded."
