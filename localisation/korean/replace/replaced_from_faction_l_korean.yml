 faction_aso_alliance_desc: "대서양 안보 기구(ASO)는 유럽과 대서양 지역 전체에서 나토의 패권에 대항하기 위해 영국이 결성한 신흥 군사 조약입니다. 또한 유럽에서의 CSTO 활동을 완전한 항복에 이르게 한다는 추가 목표도 가지고 있습니다."
 faction_aso_TT: "§R세력 특수 규칙§!:\n- 유럽의 일부 국가만 ASO에 가입할 수 있습니다"
