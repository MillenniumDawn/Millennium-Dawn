 ukraine_develop_btr4.1.name: "Choose 'BTR-4' combat role"
 ukraine_develop_btr4.1.desc: "We can choose the desired role for this equipment - lighter and cheaper APC or more expensive and heavily armed IFV.\nOur decsion will influence what Battalions will be equipped with BTR-4: Mechanized or Armored.\nWe will have an option to produce basically the same equipment type but in opposite role if we want to."
 ukraine_develop_btr4.1.a: "APC"
 ukraine_develop_btr4.1.b: "IFV"
 ukraine_develop_btr4.2.name: "Choose primary weapons for 'BTR-4' APC"
 ukraine_develop_btr4.2.desc: "We can choose the desired main armament for BTR-4 APC.\nIf we want to cut production costs, we can select machine gun, but if we want to maximise its combat effectiveness - we can choose to select among a handful of available heavier weapons modules."
 ukraine_develop_btr4.2.a: "Machine gun only"
 ukraine_develop_btr4.2.b: "Weapons module"
 ukraine_develop_btr4.3.name: "Choose weapons module for 'BTR-4' APC"
 ukraine_develop_btr4.3.desc: "We can choose the desired weapons module for BTR-4 APC.\n\n§YBM-1B 'Hrim'§! armament: 1x 30 mm automatic cannon, 1x 30 mm automatic grenade launcher, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles.\n\n§YKBA-105 'Shkval'§! armament: 1x 30 mm automatic cannon, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles (optional 1x 30 mm automatic grenade launcher with reduction to 2x AT missiles).\n\n§YBAU 23x2§! armament: 2x 23x152 mm automatic cannons, 1x 7.62 mm coaxial machine gun."
 ukraine_develop_btr4.3.a: "BM-1B 'Hrim'"
 ukraine_develop_btr4.3.b: "KBA-105 'Shkval'"
 ukraine_develop_btr4.3.c: "BAU 23x2"
 ukraine_develop_btr4.4.name: "Choose engine for 'BTR-4' APC"
 ukraine_develop_btr4.4.desc: "We can choose the desired engine for BTR-4 APC.\n\n§Y3TD-3§!: Ukrainian 2-stroke 3-cylinder diesel engine with power output of 500 hp.\n\n§YDeutz BF6M1015CP§!: German 4-valve, 6-cylinder diesel engine with power output of 442 hp.\n\n§YIveco Cursor 10-430§!: Italian 24-valve, 6-cylinder diesel engine with power output of 430 hp."
 ukraine_develop_btr4.4.a: "3TD-3"
 ukraine_develop_btr4.4.b: "Deutz BF6M1015CP"
 ukraine_develop_btr4.4.c: "Iveco Cursor 10-430"
 ukraine_develop_btr4.5.name: "Choose engine for 'BTR-4' APC"
 ukraine_develop_btr4.5.desc: "We can choose the desired engine for BTR-4 APC.\n\n§Y3TD-3§!: Ukrainian 2-stroke 3-cylinder diesel engine with power output of 500 hp.\n\n§YDeutz BF6M1015CP§!: German 4-valve, 6-cylinder diesel engine with power output of 442 hp.\n\n§YIveco Cursor 10-430§!: Italian 24-valve, 6-cylinder diesel engine with power output of 430 hp."
 ukraine_develop_btr4.5.a: "3TD-3"
 ukraine_develop_btr4.5.b: "Deutz BF6M1015CP"
 ukraine_develop_btr4.5.c: "Iveco Cursor 10-430"
 ukraine_develop_btr4.6.name: "Choose weapons module for 'BTR-4' IFV"
 ukraine_develop_btr4.6.desc: "We can choose the desired weapons module for BTR-4 IFV.\n\n§YBM-1B 'Hrim'§! armament: 1x 30 mm automatic cannon, 1x 30 mm automatic grenade launcher, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles.\n\n§YKBA-105 'Shkval'§! armament: 1x 30 mm automatic cannon, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles (optional 1x 30 mm automatic grenade launcher with reduction to 2x AT missiles).\n\n§YBAU 23x2§! armament: 2x 23x152 mm automatic cannons, 1x 7.62 mm coaxial machine gun."
 ukraine_develop_btr4.6.a: "BM-1B 'Hrim'"
 ukraine_develop_btr4.6.b: "KBA-105 'Shkval'"
 ukraine_develop_btr4.6.c: "BAU 23x2"
 ukraine_develop_btr4.7.name: "Choose engine for 'BTR-4' IFV"
 ukraine_develop_btr4.7.desc: "We can choose the desired engine for BTR-4 IFV.\n\n§Y3TD-3§!: Ukrainian 2-stroke 3-cylinder diesel engine with power output of 500 hp.\n\n§YDeutz BF6M1015CP§!: German 4-valve, 6-cylinder diesel engine with power output of 442 hp.\n\n§YIveco Cursor 10-430§!: Italian 24-valve, 6-cylinder diesel engine with power output of 430 hp."
 ukraine_develop_btr4.7.a: "3TD-3"
 ukraine_develop_btr4.7.b: "Deutz BF6M1015CP"
 ukraine_develop_btr4.7.c: "Iveco Cursor 10-430"
 ukraine_develop_btr4.8.name: "Test program for 'BTR-4' APC"
 ukraine_develop_btr4.8.desc: "We can choose the duration and complexity of pre-production tests for BTR-4 APC.\n\nWe can make the basic programm and save money and time or extensive one, which will require more resources, but we may found and get rid of some of issues, visible on small-scale batch production. Elimitating them may lead to more reliable machine in the full-scale production run."
 ukraine_develop_btr4.8.a: "Basic tests"
