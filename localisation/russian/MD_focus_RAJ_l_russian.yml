 raj_chi_border_train_artillery_desc: "Проведите пятнадцатидневные артиллерийские учения с артиллерией и реактивной артиллерией, размещенными в [From.GetName], нашем назначенном пограничном секторе. Стоимость: 20 очков командования. Подразделения, находящиеся на передовой, будут подвергаться потерям в течение всего периода учений. Боеготовность повышается на 5. Если подразделения будут выведены из строя до истечения пятнадцати дней, то те же 5 очков боеготовности перейдут к нашему противнику.\n\nПосле окончания учений армия назначает новый пограничный сектор."
 raj_chi_border_stage_incursion: "Организуйте пограничное вторжение с [From.GetName]"
 raj_chi_border_stage_incursion_desc: "Отправьте патруль через линию фронта из сектора [From.GetName], назначенного вам пограничного участка. Стоимость: 20 очков командной силы. Подразделения, находящиеся на передовой, будут подвергаться потерям в течение всего времени. Увеличивает двустороннюю напряженность на 15 и несет риск потерь. Отзыв патруля до истечения пятнадцати дней передает 3 очка боеготовности нашему сопернику.\n\nПосле возвращения патруля армия назначает новый пограничный участок."
 raj_chi_border_shell_positions: "Позиции границ оболочки от [From.GetName]"
 raj_chi_border_shell_positions_desc: "Обстрел позиций напротив [From.GetName], нашего назначенного пограничного сектора, с использованием размещенной там артиллерии и реактивной артиллерии. Стоимость: 20 очков командования. Размещенные подразделения будут подвергаться истощению в течение всего периода обстрела. Увеличивает двустороннюю напряженность на 22, создает дополнительную напряженность в мире и несет риск ответных действий. Вывод орудий до истечения пятнадцати дней передает 5 очков готовности нашему сопернику.\n\nПосле окончания обстрела армия назначает новый пограничный сектор."
 raj_chi_border_negotiate: "Открытые китайско-индийские переговоры"
 raj_chi_border_negotiate_desc: "Используйте взаимную добрую волю, чтобы снизить двустороннюю напряженность на 25% и положить конец активной конфронтации."
 raj_chi_border_negotiate_tt: "§GНапряжение в двусторонних отношениях между Китаем и Индией снижается на 25§!"
 pak_raj_border_attack_427_from_420: "Атака на Джамму и Кашмир из Азад Кашмира"
 pak_raj_border_attack_427_from_420_desc: "Начните ограниченную операцию через линию контроля от Азад Кашмира в Джамму и Кашмир. Успешное продвижение добавляет §Y20 очков прогресса §! к этому состоянию; отступление стоит §Y10§!."
 pak_raj_border_attack_420_from_427: "Атака на Азад Кашмир со стороны Джамму и Кашмира"
 pak_raj_border_attack_420_from_427_desc: "Начните ограниченную операцию через линию контроля из Джамму и Кашмира в Азад Кашмир. Успешное продвижение добавляет §Y20 очков прогресса §! к этому штату; отступление стоит §Y10§!."
 pak_raj_border_attack_429_from_563: "Атака на Восточный Пенджаб из Центрального Пенджаба"
 pak_raj_border_attack_429_from_563_desc: "Продвижение из Центрального Пенджаба в Восточный Пенджаб. Успешное продвижение добавляет §Y20 очков прогресса §! в этом штате; отражение стоит §Y10§!."
 pak_raj_border_attack_563_from_429: "Атака на Центральный Пенджаб со стороны Восточного Пенджаба"
 pak_raj_border_attack_563_from_429_desc: "Продвижение из Восточного Пенджаба в Центральный Пенджаб. Успешное продвижение добавляет §Y20 очков прогресса §! в этом штате; отпор стоит §Y10§!."
 pak_raj_border_attack_573_from_984: "Атака на Южный Пенджаб со стороны Западного Раджастана."
 pak_raj_border_attack_573_from_984_desc: "Продвигайтесь через пустыню Тар из Западного Раджастана в сторону Южного Пенджаба. Успешное продвижение добавляет §Y20 очков прогресса §! в этом штате; отступление стоит §Y10§!."
 pak_raj_border_attack_984_from_573: "Атака на Западный Раджастан со стороны Южного Пенджаба."
 pak_raj_border_attack_984_from_573_desc: "Продвигайтесь через пустыню Тар из Южного Пенджаба в сторону Западного Раджастана. Успешное продвижение добавляет §Y20 очков прогресса §! в этом штате; отступление стоит §Y10§!."
 pak_raj_border_attack_426_from_984: "Атака на Синд со стороны Западного Раджастана"
 pak_raj_border_attack_426_from_984_desc: "Продвижение из Западного Раджастана в сторону Синда. Успешное продвижение добавляет §Y20 очков прогресса §! в этом штате; отражение стоит §Y10§!."
 pak_raj_border_attack_984_from_426: "Атака на Западный Раджастан со стороны Синда."
 pak_raj_border_attack_984_from_426_desc: "Продвижение из Синда в сторону Западного Раджастана. Успешное наступление добавляет §Y20 очков прогресса §! в этом штате; отражение стоит §Y10§!."
 pak_raj_border_attack_426_from_987: "Атака на Синд со стороны Западного Гуджарата."
 pak_raj_border_attack_426_from_987_desc: "Продвигайтесь через Ранн-оф-Кутч из Западного Гуджарата в сторону Синда. Успешное продвижение добавляет §Y20 очков прогресса §! в этом штате; отпор стоит §Y10§!."
 pak_raj_border_attack_987_from_426: "Атака Западного Гуджарата из Синда"
 pak_raj_border_attack_987_from_426_desc: "Продвигайтесь через Ранн-оф-Кутч из Синда в сторону Западного Гуджарата. Успешное продвижение добавляет §Y20 очков прогресса §! в этом штате; отпор стоит §Y10§!."
 pak_raj_border_attack_420_from_418: "Атака на Азад Кашмир со стороны Хайбер-Пахтунхвы."
 pak_raj_border_attack_420_from_418_desc: "Продвижение из Хайбер-Пахтунхвы для оспаривания или восстановления контроля над Азад Кашмиром. Успешное наступление добавляет §Y20 очков прогресса §! к этому штату; отражение стоит §Y10§!."
 pak_raj_border_attack_427_from_428: "Атака на Джамму и Кашмир из Химачала"
 pak_raj_border_attack_427_from_428_desc: "Наступление из Химачала с целью оспорить или восстановить контроль над Джамму и Кашмиром. Успешное наступление добавляет §Y20 очков прогресса §! к этому штату; отпор стоит §Y10§!."
 pak_raj_border_attack_429_from_431: "Атака на Восточный Пенджаб из Харьяны"
 pak_raj_border_attack_429_from_431_desc: "Наступление из Харьяны для оспаривания или восстановления контроля над Восточным Пенджабом. Успешное наступление добавляет §Y20 очков прогресса §! в этом штате; отражение стоит §Y10§!."
 pak_raj_border_attack_563_from_422: "Атака на Центральный Пенджаб с севера Пенджаба."
 pak_raj_border_attack_563_from_422_desc: "Наступление из Северного Пенджаба с целью оспорить или восстановить контроль над Центральным Пенджабом. Успешное наступление добавляет §Y20 очков прогресса §! к этому штату; отпор стоит §Y10§!."
 pak_raj_border_attack_573_from_422: "Атака на Южный Пенджаб с Северного Пенджаба"
 pak_raj_border_attack_573_from_422_desc: "Наступление из Северного Пенджаба с целью оспорить или восстановить контроль над Южным Пенджабом. Успешное наступление добавляет §Y20 очков прогресса §! к этому штату; отражение стоит §Y10§!."
 pak_raj_border_attack_426_from_416: "Атака на Синд из Белуджистана"
 pak_raj_border_attack_426_from_416_desc: "Наступление из Белуджистана для оспаривания или восстановления контроля над Синдом. Успешное наступление добавляет §Y20 очков прогресса §! к этому состоянию; отступление стоит §Y10§!."
 pak_raj_border_attack_987_from_436: "Атака Западного Гуджарата со стороны Восточного Гуджарата."
 pak_raj_border_attack_987_from_436_desc: "Наступление из Восточного Гуджарата для оспаривания или восстановления контроля над Западным Гуджаратом. Успешное наступление добавляет §Y20 очков прогресса §! в этом штате; отражение стоит §Y10§!."
 pak_raj_border_attack_984_from_432: "Атака на Западный Раджастан со стороны Восточного Раджастана"
 pak_raj_border_attack_984_from_432_desc: "Наступление из Восточного Раджастана для оспаривания или восстановления контроля над Западным Раджастаном. Успешное наступление добавляет §Y20 очков прогресса §! в этом штате; отражение стоит §Y10§!."
 pak_raj_border_capture_420: "Выдвинуть претензии на Азад Кашмир"
