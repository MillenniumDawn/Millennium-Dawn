 energy_total_net_energy_balance_yellow_tt: "[?energy_balance_value_display|1%Y]"
 TOGGLE_POWER_PRODUCTION: "Управление станциями"
 toggle_fossil_fuel_power_plant_generation_tt: "§YВкл./выкл. генерацию тепловых электростанций§!\nВключает или отключает генерацию §Yтепловых электростанций§!. Это можно сделать, чтобы полностью перейти на возобновляемые источники, или чтобы сократить почасовой расход ископаемого топлива."
 toggle_fossil_fuel_power_plant_generation_delayed_tt: "§YЭффекты:§!\n[!toggle_fossil_fuel_power_plant_generation_click]"
 toggle_fossil_fuel_power_plant_generation_one_tt: "Включить §Yгенерацию тепловых электростанций§!"
 toggle_fossil_fuel_power_plant_generation_two_tt: "Отключить §Yгенерацию тепловых электростанций§!"
 toggle_nuclear_power_plant_generation_tt: "§YВкл./выкл. генерацию атомных электростанций§!\nВключает или отключает генерацию §Yатомных электростанций§!. Это можно сделать, чтобы опираться только на другие источники и сберечь ядерное топливо на будущее."
 toggle_nuclear_power_plant_generation_delayed_tt: "§YЭффекты:§!\n[!toggle_nuclear_power_plant_generation_click]"
 toggle_nuclear_power_plant_generation_one_tt: "Включить §Yгенерацию энергии на атомных электростанциях§!"
 toggle_nuclear_power_plant_generation_two_tt: "Отключить §Yгенерацию энергии на атомных электростанциях§!"
 add_hydroelectric_energy_production_effect_tt: "Добавляет §Yпроизводство гидроэлектроэнергии§! в размере [?electric_addition|Y] ГВт в [THIS.GetName] (сейчас: [?hydroelectric_energy_production_var|Y0] ГВт)"
 ENABLE_NUCLEAR_PRODUCTION_BUTTON: "Включить"
 DISABLE_NUCLEAR_PRODUCTION_BUTTON: "Отключить"
 energy_building_battery_parks: "§YСтроительство§! аккумуляторного парка"
 energy_building_battery_parks_desc: "Мы сделали ставку на возобновляемую энергетику. Пора создавать объекты, которые позволят стране запасать энергию, вырабатываемую нашей возобновляемой инфраструктурой."
 energy_automatic_fuel_purchase: "Автоматическая §Yпокупка топлива§!"
 energy_automatic_fuel_purchase_desc: "Сейчас мы закупаем топливо по рыночной цене каждые двадцать восемь дней, когда его запасы подходят к концу."
 has_an_energy_deficit_tt: "[THIS.GetNameWithFlag]: сейчас наблюдается §Yдефицит энергии§! (разница: [?THIS.energy_difference_variable|Y0])\n"
 energy_load_sharing_recipient: "[THIS.GetNameWithFlag]: сейчас получает §Yэнергию§! по §Yсоглашению о распределении энергонагрузки§!.\n"
 is_currently_in_an_energy_load_sharing_agreement_tt: "[THIS.GetNameWithFlag]: действует §Yсоглашение о распределении энергонагрузки§! с [ROOT.GetNameWithFlag]\n"
 advanced_production_modifier: "Ограничения высокотехнологичного производства"
 advanced_production_modifier_desc: "Когда у нас начнёт заканчиваться технологические металлы ([?THIS.resource@tungsten|+]), драгоценные металлы ([?THIS.resource@chromium|+]), нефть ([?THIS.resource@oil|+]) или резина ([?THIS.resource@rubber|+]), производство микрочипов и/или композитных материалов пострадает. Дефицит любого ресурса приведёт к снижению производства микрочипов и/или композитных материалов. Кроме того, поскольку для производства микрочипов требуется значительное количество энергии, её нехватка ещё больше снизит объёмы производства на [?unfulfilled_energy_demand_dynmod_var|%]\n\n§YСокращение объёмов производства всегда будет ограничено§! §R95%§! §Yот базовых показателей.§!"
 civilian_microchip_consumption_modifier: "Потребление микрочипов гражданской и промышленной сферами"
 civilian_microchip_consumption_modifier_desc: "Наше население и развитая промышленность начнут потреблять микрочипы по мере того, как всё больше технологий становится доступным для предприятий и обычных граждан. Нам придётся удовлетворять этот спрос, иначе наши производственные линии столкнутся с трудностями. В военное время военное производство будет иметь приоритет над гражданским использованием, но это может привести к беспорядкам среди населения, поскольку их потребности не будут удовлетворены."
 is_currently_importing_oil_tt: "[THIS.GetNameWithFlag]: сейчас импортирует §Yископаемое топливо§! из другой страны.\n"
 early_renewables_9: "Улучшенное управление ветряными турбинами"
 early_renewables_9_desc: "Передовые системы управления оптимизируют работу ветряных турбин, регулируя угол установки лопастей и угол рыскания для извлечения максимальной энергии при различных ветровых условиях."
 renewables_9: "Перовскитные солнечные батареи"
 renewables_9_desc: "Перовскитные солнечные батареи становятся коммерчески жизнеспособными, предлагая более высокую эффективность и более низкие производственные затраты, что ещё больше способствует внедрению солнечной энергии."
 renewables_10: "Приливные электростанции"
 renewables_10_desc: "Мы можем использовать энергию океанских приливов для снабжения прибрежных городов."
 renewables_11: "Расширение приливной энергетики"
 renewables_11_desc: "Достижения в области преобразования энергии приливов позволяют нам устанавливать модули с большей плотностью, чем раньше, а также расширять их размещение на большее расстояние от берега."
 renewables_12: "Вулканические энергетические установки"
 renewables_12_desc: "Размещение электростанций вблизи действующих вулканов позволяет нам использовать огромные объёмы геотермальной энергии, а также снижать угрозу извержений."
 renewables_13: "Отбор энергии из астеносферы"
 renewables_13_desc: "Расширение концепции вулканических электростанций на районы с высокой сейсмической активностью даёт нам лучший доступ к геотермальной энергии из астеносферы Земли."
 fuel_efficiency_7: "Квантовая оптимизация топлива"
 fuel_efficiency_7_desc: "Применение квантовых вычислений к топливным системам позволяет нам управлять производством энергии на ещё более детальном уровне."
 fuel_efficiency_8: "Внедрение сильного ИИ"
 fuel_efficiency_8_desc: "Сильный ИИ управляет преобразованием топлива куда точнее, чем прежде."
 fuel_efficiency_9: "Специализированные топливные нановолокна"
 fuel_efficiency_9_desc: "Современные волокна как никогда ранее ограничивают утечку тепла."
 fuel_efficiency_10: "Сверхинтеллектуальный мониторинг"
 fuel_efficiency_10_desc: "Внедрение сверхинтеллектуальной системы искусственного интеллекта в этот процесс позволяет добиться практически абсолютного контроля над процессом преобразования энергии."
 energy_efficiency_9: "Квантовая энергоэффективность"
 energy_efficiency_9_desc: "Мы можем использовать квантовые технологии для повышения энергоэффективности нашего оборудования."
 energy_efficiency_10: "Передовая квантовая эффективность"
 energy_efficiency_10_desc: "Применение новейших технологических достижений в области квантовых технологий ещё больше повышает эффективность."
 energy_efficiency_11: "Квантовая рекуперация энергии"
 energy_efficiency_11_desc: "Достижения в нашем понимании квантовой физики позволяют рекуперировать энергию на атомном уровне."
 energy_efficiency_12: "Квантовый отбор энергии"
 energy_efficiency_12_desc: "Флуктуации квантовой пены можно отбирать и преобразовывать в электрическую энергию. Мы превратили потери энергии в её прирост!"
