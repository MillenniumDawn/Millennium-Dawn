 super_heavy_tank_chassis_2_desc: "중형 워커 차체는 일반적인 무한궤도나 바퀴식 주행 장치 대신 2족 또는 다족 이동 체계를 통합한 장갑 전투 차량의 차체를 말합니다. 일반적으로 강화된 장갑 캡슐, 출력 밀도가 높은 엔진 또는 발전기 장치, 관절형 구동 장치를 결합하여 잔해, 급경사, 연약 지반 등 기존 기갑 전력의 움직임을 제약하는 지형에서도 이동할 수 있게 합니다."
