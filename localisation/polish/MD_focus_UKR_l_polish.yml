 ukraine_develop_btr4.6.name: "Choose weapons module for 'BTR-4' IFV"
 ukraine_develop_btr4.6.desc: "We can choose the desired weapons module for BTR-4 IFV.\n\n§YBM-1B 'Hrim'§! armament: 1x 30 mm automatic cannon, 1x 30 mm automatic grenade launcher, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles.\n\n§YKBA-105 'Shkval'§! armament: 1x 30 mm automatic cannon, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles (optional 1x 30 mm automatic grenade launcher with reduction to 2x AT missiles).\n\n§YBAU 23x2§! armament: 2x 23x152 mm automatic cannons, 1x 7.62 mm coaxial machine gun."
 ukraine_develop_btr4.6.a: "BM-1B 'Hrim'"
 ukraine_develop_btr4.6.b: "KBA-105 'Shkval'"
 ukraine_develop_btr4.6.c: "BAU 23x2"
 ukraine_develop_btr4.7.name: "Choose engine for 'BTR-4' IFV"
 ukraine_develop_btr4.7.desc: "We can choose the desired engine for BTR-4 IFV.\n\n§Y3TD-3§!: Ukrainian 2-stroke 3-cylinder diesel engine with power output of 500 hp.\n\n§YDeutz BF6M1015CP§!: German 4-valve, 6-cylinder diesel engine with power output of 442 hp.\n\n§YIveco Cursor 10-430§!: Italian 24-valve, 6-cylinder diesel engine with power output of 430 hp."
 ukraine_develop_btr4.7.a: "3TD-3"
 ukraine_develop_btr4.7.b: "Deutz BF6M1015CP"
 ukraine_develop_btr4.7.c: "Iveco Cursor 10-430"
