 UKR_crimea_gui_value_russia: "§Y[?UKR.UKR_crimean_bop_russian_influence|0]%§!"
 UKR_crimea_gui_tooltip_marker: "§YBalance in [669.GetName]§!\n[UKR.GetFlag] §Y[UKR.GetName]§!: §G[?UKR.UKR_crimean_bop_ukrainian_influence|0]%§!\n§YCrimean Tatars§!: §Y[?UKR.UKR_crimean_bop_crimean_tatar_influence|0]%§!\n[SOV.GetFlag] §Y[SOV.GetName]§!: §R[?UKR.UKR_crimean_bop_russian_influence|0]%§!\n\n§WIf current pending missions finish in the modelled order:§!\n[UKR.GetFlag] [?UKR.UKR_crimean_bop_forecast_ukrainian_influence|0]% / Tatars [?UKR.UKR_crimean_bop_forecast_crimean_tatar_influence|0]% / [SOV.GetFlag] [?UKR.UKR_crimean_bop_forecast_russian_influence|0]%\n§LForecast is indicative. Completion order, caps, cancellations and conditional failures can change the result.§!"
