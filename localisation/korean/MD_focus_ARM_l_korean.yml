 ARM_Raffi: "유산의 승리"
 ARM_Raffi_desc: "헤리티지는 아르메니아의 민족자유주의 정당입니다. 독립 아르메니아의 초대 외무장관 라피 호바니샨이 창당했습니다."
 ARM_national_liberal_agenda: "민족자유주의 의제"
 ARM_national_liberal_agenda_desc: "우리 당의 의제는 자유주의 경제와 민족 유산의 보존이어야 합니다. 이것이 위대함으로 가는 우리의 기둥입니다!"
 ARM_freemrk_freppl: "더 자유로운 시장, 더 자유로운 국민"
 ARM_freemrk_freppl_desc: "필요 이상으로 시장을 통제하려는 시도를 멈춰야 한다는 것은 분명합니다."
 ARM_armenian_traders_spir: "아르메니아 상인 정신"
 ARM_armenian_traders_spir_desc: "우리 민족은 역사 내내 성공적인 상인이었으며, 이 전통을 지원해야 합니다."
 ARM_protect_armenian_heritage: "아르메니아 유산 보호"
 ARM_protect_armenian_heritage_desc: "우리를 지금의 우리로 만들어 주는 유산과 문화를 보호해야 합니다."
 ARM_diaspora_connect: "디아스포라 연계"
 ARM_diaspora_connect_desc: "정부의 이익을 위해 디아스포라와의 연계를 활용해야 합니다."
 ARM_part_of_western_civ: "서구 문명의 일부"
 ARM_part_of_western_civ_desc: "아르메니아는 중동이나 동유럽의 평범한 나라가 아닙니다. 우리는 기독교 서구 문명의 일부이며, 이를 받아들이고 본받아야 합니다!"
 ARM_befr_church: "아르메니아 교회와의 우호"
 ARM_befr_church_desc: "아르메니아 교회는 우리 사회 결속의 근본적인 요소 중 하나이므로 이를 지원해야 합니다."
 ARM_liberty_soil_blood: "자유, 대지, 피!"
 ARM_liberty_soil_blood_desc: "우리에게 자유를 주는 대지를 사랑하고, 우리 민족의 자유를 위해 흘린 모든 피를 존중해야 합니다."
 ARM_new_leader_image: "지도자의 새로운 이미지"
 ARM_new_leader_image_desc: "라피는 아르메니아를 위한 정직하고 진정한 대중 지도자의 새로운 상징이 되어야 합니다!"
 ARM_anti_corrupt_mass: "대규모 반부패 캠페인"
 ARM_anti_corrupt_mass_desc: "우리나라에서 부패를 뿌리 뽑아야 하며, 새로운 반부패 경찰을 창설해야 합니다."
 ARM_foster_econ_growth: "더 빠른 경제 성장"
 ARM_foster_econ_growth_desc: "경제 성장은 아르메니아 번영의 열쇠이므로 어떤 대가를 치르더라도 가속해야 합니다."
 ARM_free_full_healthcare: "전면 무상 의료"
 ARM_free_full_healthcare_desc: "시민들을 보살피기 위해 최고 수준의 전면 무상 의료를 제공해야 합니다."
 ARM_anti_braindead: "두뇌 유출 방지 노력"
 ARM_anti_braindead_desc: "소련 붕괴 이후 아르메니아를 괴롭혀 온 두뇌 유출에 맞서 싸워야 합니다."
 ARM_us_example: "미국이라는 모범"
 ARM_us_example_desc: "미국은 민주주의 자본주의 국가의 훌륭한 모범이며, 그 번영은 오늘날까지 빛나고 있습니다. 우리나라도 이러한 이상에 따라 건설해야 합니다!"
 ARM_elect_reform: "선거 개혁"
 ARM_elect_reform_desc: "선거 제도를 더 민주적으로 만들고 완전한 참여를 보장해야 합니다."
 ARM_united_states_armenia: "아르메니아 합중국"
 ARM_united_states_armenia_desc: "미국 체제에서 얻은 우리의 영감이 절정에 이를 것입니다! 우리는 아르메니아 합중국의 창설을 선포할 준비가 되었습니다!"
 ARM_true_air_force: "진정한 아르메니아 공군"
 ARM_true_air_force_desc: "우리는 공군 조직을 미국 공군과 유사하게 구축하고, 공군 발전에 국가 예산의 상당 부분을 투자할 계획입니다."
 ARM_true_national_guard: "진정한 국가방위군"
 ARM_true_national_guard_desc: "우리는 미국 국가방위군의 경험을 아르메니아군의 현실에 맞게 온전히 적용할 계획입니다. 미국의 원형과 마찬가지로 국가방위군은 타국에서의 작전에 참여할 수 있으며, 공군 국가방위군도 창설되어 우리 조종사들 역시 해외 작전에 참여할 수 있게 될 것입니다."
