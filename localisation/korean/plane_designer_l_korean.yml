 weap_ag_cas_hardpoint_4: "4세대 근접항공지원 무장장착소"
 weap_mp_med_hardpoint_4_desc: "$weap_mp_med_hardpoint_1_desc$"
 weap_ag_cas_hardpoint_4_desc: "$weap_ag_cas_hardpoint_1_desc$"
 weap_mp_light_hardpoint_1: "1세대 소형 무장장착소"
 weap_mp_light_hardpoint_1_desc: "경량 하드포인트는 항공기가 일부 무장을 탑재할 수 있도록 하지만 많은 양은 아닙니다. 이 하드포인트는 저렴하며, 경항공기에 일부 무기를 장비하거나 다른 항공기의 무장을 보충하기 위한 것입니다. 이 하드포인트에는 단거리 공대공 미사일, 250-500파운드 폭탄, 로켓 포드가 장비됩니다.\n\n§G설계 힌트: 이 하드포인트는 예산이 제한된 국가가 항공기에 혼합 무장을 장비할 수 있게 하고, 경항공기를 생산하는 국가에 더 저렴하고 가벼운 무장 장비 수단을 제공하기 위한 것입니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B다목적 전투기§!\n\n§R경고: 함재 다목적 전투기는 해전 중 적 함선만 공격합니다§!"
 weap_mp_light_hardpoint_2: "2세대 소형 무장장착소"
 weap_mp_light_hardpoint_2_desc: "$weap_mp_light_hardpoint_1_desc$"
 weap_mp_light_hardpoint_3: "3세대 소형 무장장착소"
