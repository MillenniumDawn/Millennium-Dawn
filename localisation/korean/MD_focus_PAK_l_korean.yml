l_korean:
 pakistan.1.t: "부족 지역에 대한 미국의 압박"
 pakistan.1.d: "미국은 파키스탄에 아프가니스탄 국경을 따라 위치한 연방직할부족지역에서 활동하는 무장 세력에 대해 결정적인 군사 행동을 취하라고 요구하고 있습니다. 워싱턴은 계속 방관할 경우 양국 관계와 미국의 군사 원조에 영향이 있을 것임을 분명히 했습니다."
 pakistan.1.a: "와지리스탄에서 군사 작전을 개시한다"
 pakistan.1.b: "대신 부족 원로들과 협상한다"
 pakistan.1.c: "미국의 요구를 거부한다"
 pakistan.2.t: "파키스탄, 부족 지역 작전 개시"
 pakistan.2.d: "파키스탄은 미국의 압박에 응하여 부족 지역의 무장 세력 거점에 대한 군사 작전을 개시했습니다. 이 작전은 아프가니스탄 국경을 따라 활동하는 탈레반과 알카에다 세력을 겨냥하고 있습니다."
 pakistan.2.a: "긍정적인 진전이다"
 pakistan.3.t: "파키스탄, 행동을 거부"
 pakistan.3.d: "파키스탄은 미국의 요구에도 불구하고 부족 지역에서 결정적인 군사 행동을 취하지 않겠다고 밝혔습니다. 무장 세력은 아프가니스탄 국경을 따라 자유롭게 활동을 이어 가며 아프가니스탄의 연합군 작전을 약화시키고 있습니다."
 pakistan.3.a: "파키스탄에 대한 군사 원조를 중단한다"
 pakistan.3.b: "일단은 그들의 결정을 받아들인다"
 pakistan.4.t: "무장 세력의 보복"
 pakistan.4.d: "부족 지역에서의 군사 작전은 격렬한 보복을 불러왔습니다. 무장 단체들은 주요 도시에서 정부 건물, 시장, 군사 시설을 겨냥한 연쇄 폭탄 테러를 일으켰습니다. 파키스탄 탈레반은 국가를 상대로 전쟁을 선포했습니다."
 pakistan.4.a: "단속을 강화한다"
 pakistan.4.b: "무장 세력과의 휴전을 모색한다"
 pakistan.5.t: "미국 원조 중단"
 pakistan.5.d: "미국은 부족 지역의 무장 세력에 대처하지 않겠다는 정부의 입장에 대응하여 파키스탄에 대한 군사 원조를 중단했습니다. 미국의 자금 지원이 끊기면 국방 예산에 부담이 될 것입니다."
 pakistan.5.a: "이는 용납할 수 없는 일이다"
 pakistan.6.t: "부족 지역의 진전"
 pakistan.6.d: "수개월에 걸친 지속적인 군사 작전 끝에 파키스탄군은 부족 지역에서 상당한 진전을 이루었습니다. 주요 무장 세력 거점이 소탕되었으나 인적, 경제적 비용은 막대했습니다. 이제 승리를 선언할 것인지, 상시 군사 주둔을 유지할 것인지가 문제입니다."
 pakistan.6.a: "승리를 선언하고 기반을 다진다"
 pakistan.6.b: "군사 주둔을 유지한다"
 PAK_waziristan_insurgency: "와지리스탄 반란"
 PAK_waziristan_insurgency_desc: "파키스탄군은 부족 지역에서 대규모 대반란 작전을 수행하며 아프가니스탄 국경을 따라 활동하는 무장 단체들과 싸우고 있습니다."
 PAK_suspended_american_aid: "중단된 미국 원조"
 PAK_suspended_american_aid_desc: "미국이 파키스탄에 대한 군사 원조를 중단하여 국방 예산에 부담이 되고 무기 도입이 제약받고 있습니다."
 PAK_tribal_pacification: "부족 지역 평정"
 PAK_tribal_pacification_desc: "부족 지역에서의 군사 작전 성공은 육군의 대반란 능력을 강화하고 국경 지대에 어느 정도의 안정을 되찾아 주었습니다."
 pakistan_news.1.t: "파키스탄, 부족 지역에서 군사 작전 개시"
 pakistan_news.1.d: "파키스탄군은 아프가니스탄 국경을 따라 위치한 연방직할부족지역의 탈레반과 알카에다 거점을 상대로 대규모 군사 작전을 개시했습니다. 강력한 미국의 압박 아래 진행된 이번 공세는 험준한 지형을 오랫동안 은신처로 삼아 온 무장 조직망을 겨냥하고 있습니다."
 pakistan_news.1.a: "뿌리 뽑을 것이다"
 pakistan_news.1.b: "올바른 방향으로 나아가는 한 걸음이다"
 pakistan_news.1.c: "알겠다"
 pakistan_news.2.t: "파키스탄, 부족 지역에서 승리 선언"
 pakistan_news.2.d: "장기간의 군사 작전 끝에 파키스탄은 부족 지역의 주요 무장 세력 거점이 소탕되었다고 선언했습니다. 이번 작전은 인명과 자원 면에서 막대한 대가를 치렀으나, 정부는 국경 지대가 수년 만에 가장 안전해졌다고 밝혔습니다."
 pakistan_news.2.a: "힘겹게 얻은 승리다"
 pakistan_news.2.b: "이러한 진전을 환영한다"
 pakistan_news.2.c: "알겠다"
