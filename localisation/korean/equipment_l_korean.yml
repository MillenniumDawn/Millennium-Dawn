 CZE_Anti_tank_1: "PTŘS-12 Volant"
 CZE_Anti_tank_1_desc: "Czech first Anti-Tank Guided-Missile. Utilize MCLOS guidance and penetrates up to 400mm armor on 3km range with speed of 130m/s. The slow movement is purposefully used to allow more precise guidance and larger reaction time before hitting the target."
 CZE_Anti_tank_2: "RPTZ-84"
 CZE_Anti_tank_2_desc: "Anti-Tank Guided-Missile produced in the republic. Utilize SACLOS guidance and penetrates up to 400mm armor on 3km range with speed of 350m/s. It was response to latest advances of armor of the enemies of the state."
 CZE_Anti_tank_3: "RPTZ-96"
 CZE_Anti_tank_3_desc: "Raketová Protitanková Zbraň 96 stands for Rocket Anti-Tank Weapon Type 96. First prototype of our own Czech F&F (Fire and Forget) design. In the end, the project resulted in weapon capable of switching modes between quite unreliable Fire and Forget software sometimes interchanging house for a Self-Propelled gun and very precise SACLOS system."
 CZE_Anti_tank_4: "PTŘS-101"
 CZE_Anti_tank_4_desc: "Stands for ATGM-101. First reliable F&F design only 5 prototypes since the first one! It also uses precursor missiles to counter newly emerging threat of the Active-Protection Systems. The idea is different than in foreign designs though, because the first warhead fired is still packed with explosives meant to shrapnel outside of tank and sensors on top of tank towers, and second penetrating tandem warhead."
 CZE_Anti_Air_0: "PLŘS-KD vz. 2 스트렐라"
 CZE_Anti_Air_0_desc: "2세대 지대공 미사일(SAM)입니다. 이 무기는 짧은 10km의 사거리를 자랑합니다. 무기의 이름인 스트르젤라(Střela)의 의미는 미사일로 vz. 2는 쉽게 뿌리칠 수 있는 적외선 조준 방식을 사용하지만, 다른 한편으로는 높은 신뢰성을 보여줍니다."
 CZE_Anti_Air_1: "PLŘS-MD vz. 3 리흘리크\""
 CZE_Anti_Air_1_desc: "Second generation Surface-to-Air medium-range missile produced by our companies. It's part of the Second-generation family of vz.2 Short-range, vz.3 Medium-range and vz.4 Long-range missiles. It's a Semi-active radar guided missile flying at Mach 2 with big shrapnel warhead meant for Strike fighters flying in formations in hope they haven't detected the missile beforehand."
 CZE_Anti_Air_2: "PLŘS-SD vz. 5 예흘라\""
 CZE_Anti_Air_2_desc: "3세대 지대공 미사일(SAM)입니다. 단거리 미사일로 탄두에 반능동 레이더가 탑제되어 있습니다. 3세대 미사일로써의 같은 계열로 vz. 6 AMRSAM, vz. 7 LRSAM and vz. 8 ALRSAM가 있습니다. 16G의 중력 가속도를 이겨내고 마하 2의 속력으로 날아갑니다. 개량형에 따라서는 30km의 거리에서 마하 3.5의 속력으로 날아가 비행기를 파괴하기도 합니다."
 CZE_Anti_Air_3: "PLŘS-KD vz. 13 Hroznýš"
 CZE_Anti_Air_3_desc: "5th generation of Czech short-range SAM. Design has passive radar and infrared seeker resistant to jamming due to no outside connection. Terminal guidance can utilize most of the missile lifting body to pull out 14G at Mach 3 although the missile is capable of Mach 4 and Mach 4.5 when launched from 5km height. The missile computer recognized target speed and is able to slow down to pull better turn radius. Range of 150km from plane."
 CZE_Anti_Air_4: "PLŘS-MD vz. 25 즈미예\""
 CZE_Anti_Air_4_desc: "The missile is utilizing the latest technologies and hardware to hit even the stealthiest planes of our adversaries. Includes satellite link which guides the missile to any stealth plane, because even stealth plane isn't stealth in visible spectrum."
 CZE_MBT_1: "T-54AR 르제카"
 CZE_MBT_1_desc: "체코 전차는 소련제 T-55 전차로부터 시작되었습니다. 이 전차는 차체를 그대로 한 채 소프트웨어의 향상으로 통해 전차의 성능을 늘렸습니다. 클라디보라 불리는 새로운 화기 통제 시스템으로 정확도가 6배나 증가하였습니다. 이로 인해, 새 전차에 비견될 만해졌습니다."
 CZE_MBT_2: "T-72M1"
 CZE_MBT_2_desc: "T-72의 현대화를 위한 두번째 계획의 결과물입니다. 이 전차는 새로운 포와 추가 장갑을 추가했습니다."
 CZE_MBT_3: "T-72M4 CZ 모데르나"
 CZE_MBT_3_short: "T-72M4CZ"
 CZE_MBT_3_desc: "T-72M1의 5번째 개량의 결과물로 새로운 전장 환경에서의 투입을 위해 소프트웨어, 하드웨어의 모든 부분을 개선하였고 새로운 유형의 반응 복합장갑을 장착하였습니다. 이 전차는 T-72의 능력을 한계치로 끌어올린 결과물입니다."
 CZE_MBT_4: "T-8 오하르시"
 CZE_MBT_4_desc: "VOP 노비 이친사에서 개발한 새로운 차체를 기반으로 하여 만들어진 전차입니다. 반응장갑을 장착한 복합장갑과 자동 장전기가 탑재된 포탑과 혁신적인 내부 설계를 가진 승무원실이 자랑입니다. 이 전차는 또한 자동 변속기, 레이저 측정기, 대전차 유도 미사일(ATGM), 새로운 변속기가 탑재되어 있습니다."
 CZE_MBT_5: "T-15 오타카르"
 CZE_MBT_5_desc: "Step further from past technologies due to newly acquired combat experience of our tank crews, this tank features many small improvements inside its smaller chassis pointed out by the experienced crews. The tank is operated only by two soldiers functioning as driver-commander and gunner-reloader. The tank has internal-external communication system reducing radio operators and other crew from this tank. Active-Protection-system of Czech origin called Deštník is installed on tower with 360° radius."
 CZE_MBT_7: "T-25 오스카르"
 CZE_MBT_7_desc: "The tank has improved its armor layout due to modular armor system. The tank can be moved very fast without armor which is added when unloaded. This system also eases maintenance and repairs. This tank features new Active protection system called Štít mounted in dual configuration to deal with tandem and dumb warheads. It is capable of destroying up to 3 incoming missiles if there is at least 0.5 second between them or 2 simultaneously."
 CZE_MBT_8: "T-35 오렐"
 CZE_MBT_8_desc: "From experience from the T-15/T-25 series and T-72 modernizations, the T-35 Orel is designed as the unique product of the Czech industry recovered from ashes since its height before the WWII. Tank composed of parts, electrical-armor and other modular components such as four-channel APS is capable to deal with any threat. The turret has mounted Directed-Energy Weapon using the tank reactor to heat the injected plasma and accelerate it onto the enemy tank. The reactor also supplies the tank with the necessary power."
 CZE_APC_1: "OT-64 스코트"
 CZE_APC_1_desc: "Obrněný Transportér 64 or Armoured Personnel Carrier 64 is able to take 20 soldiers into the battle including 2 crewmen and is optionally armed with heavy machine gun. Versions without machine-gun features more space for personal weapons and cargo space for ammunition."
 CZE_APC_2: "OT-90"
 CZE_APC_2_desc: "OT-90은 OT-64의 계승작으로 두터운 방호벽 아래서 군인을 수송하고 자동 기관포나 중기관총을 탑재하고 있습니다. BVP-1의 차체를 바탕으로 개발되었으며, 포탑은 더 작은 것으로 교체되었습니다."
 CZE_APC_3: "OT-90M"
 CZE_APC_3_desc: "노후한 OT-90를 개량하기 위한 두번째 현대화 작업입니다. 이 차량은 분해되었다가 재조립되었습니다. 무기는 최신 중기관총으로 교체되었고 차량 부품은 새롭게 개발된 더 가벼운 것들로 교체되었습니다. 또한 무거운 라디오 장비 또한 컴퓨터가 장착된 것을 바꾸어서 도로가 아닌 곳에서도 더 빨리 달릴 수 있게 되었습니다."
 CZE_APC_4: "OT-105 호우센카\""
 CZE_APC_4_desc: "통합 무기 체계인 호우센카는 군의 요구에 따라 하나의 차제에 장착되어 다양한 개량형이 만들어졌습니다. 대공 로켓포나 대전차 유도 미사일(ATGM)를 탑재할 수 있습니다. 병력 수송 장갑차(APC)로 사용될 때에는 무선으로 조종되는 중기관총과 16명을 뒤쪽에 실을 수 있습니다."
 CZE_APC_5: "OT-105M2"
 CZE_APC_5_desc: "호우센카의 현대화는 변화하는 세계 정세에 따라서 필수불가결하게 되었습니다. 중기관총이 지연 신관 탄환과 함께 탑재되어 있습니다. 차량의 소프트웨어는 4.5버전으로 개량되었고 많은 부분에서 바뀌었으며, 지연 신관으로 벽 뒤의 적들에게도 유효타를 날릴 수 있게 되었습니다."
 CZE_APC_6: "OT-121 토파스"
 CZE_APC_6_desc: "호우센카 UWS의 계승작으로 UWS 토파스는 모듈화 장갑과 부품을 사용하고 있습니다. 병력 수송 장갑차(APC)는 가장 적은 방호력을 가지는 A 패키지를 가지고 있지만, RPG나 소형 대전차 미사일(ATGM)에 관통되지는 않을 정도의 방호력은 가지고 있습니다. 장갑은 복합장갑으로 구성되고 주변에 철장이 둘러져 있습니다."
 CZE_APC_7: "OT-133 바브르진"
 CZE_APC_7_desc: "UWS 바브르진은 최신 능동 방호 체계를 장착하여 탑승인원들을 안전하게 보호할 수 있습니다. 또한 이 차량은 열흡수 도료를 적용하여 적외선 장비에 덜 감지되도록 하였습니다. 이 차량은 하이브리드 엔진을 장착하여 일반 연료나 바이오매스 연료를 사용할 수 있어 (아주 많은) 나무를 연료로 공급하여 재보급 없이도 이동할 수 있습니다."
 CZE_APC_8: "OT-136 레크닌"
 CZE_APC_8_desc: "UWS Leknín is successor to the UWS Vavřín. It is armed with jammers, solid-state directed-energy weapon of laser as its main offensive and defensive weapon and also anti-personnel HMG. The laser is capable of hitting fast-moving ATGMs in flight destroying their guidance or interfering with it. In case the laser fails, the vehicle has Dual APS Štít, one on each side of the vehicle. This won't protect the vehicle from tank rounds though."
 CZE_IFV_1: "BVP-1"
 CZE_IFV_1_desc: "BVP는 기갑 전투 차량(AIFV)으로써 수송을 주목적으로 배치된 차량으로 필요시에는 배치된 보병과 함께 자동 기관포로 경장갑 차량이나 적 보병에게 화력지원을 해주기도 합니다. 8명을 수송할 수 있습니다."
 CZE_IFV_2: "BVP-1K"
 CZE_IFV_2_desc: "BVP-1의 개량으로 대전차 유도 미사일(ATGM)과 새로운 통신장비, 컴퓨터 장비를 탑재하였습니다. 이 차량은 더 가벼운 통신장비와 새로운 엔진을 탑재하였습니다."
 CZE_IFV_3: "BVP-2"
 CZE_IFV_3_desc: "새로운 차체, 새로운 자동 기관포, 새로운 대전차 유도 미사일(ATGM). 또한 BVP-2는 더 두터운 장갑과 새로운 전력 전달 체계를 가지고 있습니다. BVP-1의 개량형으로 3명을 수송하고 3명의 승무원이 탑승합니다."
 CZE_IFV_4: "BVP 스네슈카"
 CZE_IFV_4_desc: "BVP 스네슈카는 BVP-2를 참고하여 새로운 전력 전달 체계와 기술을 적용하였습니다."
 CZE_IFV_5: "KBVP 판두르 II"
 CZE_IFV_5_desc: "Pandur II, bought from Austria and assembled in the Czech republic. Then developed from scratch and produced, this unified weapon system is including ATGM carrier, Communication vehicles, Commanding vehicles, APCs, IFVs and other AFVs. Using SPIKE-LR ATGMs."
 CZE_IFV_5_short: "KBVP"
 CZE_IFV_6: "KBVP M1 판두르 II"
 CZE_IFV_6_desc: "Czech-made upgrades on the Pandur II making upgrades in this Modernization mainly improving its defense capabilities with addition of cage armor against RPGs. It also has improved filters and air-mechanics for dust and sand environmental control and its reliability. Using SPIKE-LR ATGMs."
 CZE_IFV_6_short: "KBVP M1"
 CZE_IFV_7: "KBVP 코마르"
 CZE_IFV_7_desc: "KBVP는 기갑 전투 차량(AIFV)으로써 모듈 장갑을 장착하고 패키지 B 형식을 장착한 OT-133을 장갑화한 차량입니다. 포탑은 두 개의 종류가 있습니다."
 CZE_IFV_8: "KBVP 바슈카\" #Fictional"
 CZE_IFV_8_desc: "KBVP 바슈카는 OT-136을 기반으로 개발되었지만, 패키지 B를 사용하여 적은 보병 수송량과 두터운 장갑을 가진 차량입니다. OT-136과 같은 레이저를 사용하지만 더 강력한 보조동력원을 탑재하고 있습니다."
 CZE_Rec_tank_0: "BPzV 스바타바"
 CZE_Rec_tank_0_desc: "BVP-1의 정찰 개량형으로 광학, 센서를 장착하였습니다."
 CZE_Rec_tank_1: "LOS"
 CZE_Rec_tank_1_desc: "OT-90의 정찰 개량형으로 장비의 향상 C2I과 다른 정찰 장비들의 개선을 꾀했습니다."
 CZE_Rec_tank_2: "KBVP-PZ 판두르 II"
 CZE_Rec_tank_2_desc: "판두르 II의 정찰 개량형입니다."
 CZE_Rec_tank_3: "KBVP-PZ M1 판두르 II"
 CZE_Rec_tank_3_desc: "판두르 II M1의 정찰 개량형입니다."
 CZE_Rec_tank_4: "KBVP-PZ 코마르\" 	#Fictional"
 CZE_Rec_tank_4_desc: "코마르의 정찰 개량형입니다."
 CZE_Rec_tank_5: "KBVP-PZ Vážka"
 CZE_Rec_tank_5_desc: "바즈카의 정찰 개량형입니다."
 CZE_Heavy_Anti_tank_1: "BRDM-1-ST"
 CZE_Heavy_Anti_tank_1_desc: "Soviet ATGM carrier produced domestically."
 CZE_Heavy_Anti_tank_2: "BRDM-2-ST"
 CZE_Heavy_Anti_tank_2_desc: "Second-generation of BRDM ATGM carrier produced domestically with upgraded systems."
 CZE_Heavy_Anti_tank_3: "KBVP-ST Pandur II"
 CZE_Heavy_Anti_tank_3_short: "KBVP-ST"
 CZE_Heavy_Anti_tank_3_desc: "Pandur II, licensely bought from Austria and assembled in the Czech republic, this unified weapon system is including ATGM carrier, Communication vehicles, Commanding vehicles, APCs, IFVs and other AFVs. Using SPIKE-LR ATGMs."
 CZE_Heavy_Anti_tank_4: "KBVP-ST M2 Pandur II"
 CZE_Heavy_Anti_tank_4_desc: "Czech-made upgrades on the Pandur II making upgrades into the Modernization 2 modification improving its defence and dust or sand environmental reliability and control. Using SPIKE-LR ATGMs."
 CZE_SP_Anti_Air_0: "PLRK 스트르젤라-1M"
 CZE_SP_Anti_Air_0_desc: "고기동의 지대공 미사일 차량으로 중단거리 미사일을 탑재하고 있습니다."
 CZE_SP_Anti_Air_1: "PLRK 오사"
 CZE_SP_Anti_Air_1_desc: "고기동의 지대공 미사일 차량으로 중거리 미사일을 탑재하고 있습니다."
 CZE_SP_Anti_Air_2: "PLRK-121 예흘라"
 CZE_SP_Anti_Air_2_desc: "OT-121의 통합 무기 체계에 최신 지대공 미사일(SAM) PLŘS vz. 13, 14, 15 흐로즈니시를 장착했습니다."
 CZE_SP_Anti_Air_3: "PLRK-133 흐로즈니시"
 CZE_SP_Anti_Air_3_desc: "OT-133의 통합 무기 체계에 최신 지대공 미사일(SAM) PLŘS vz. 16, 17, 18,19 흐로즈니시를 장착했습니다."
 CZE_SP_Anti_Air_4: "PLRK-136 즈미예"
 CZE_SP_Anti_Air_4_desc: "OT-136의 통합 무기 체계에 최신 지대공 미사일(SAM) PLŘS vz. 25, 26, 27, 28 흐로즈니시를 장착했습니다."
 CZE_SP_R_arty_0: "RM-51"
 CZE_SP_R_arty_0_desc: "소련제 자주 다연장 로켓포와 2차 대전에 사용하던 카츄사를 기반으로 하여 만든 무기입니다. 8km의 사거리를 가진 32개의 로켓을 탑재합니다."
 CZE_SP_R_arty_1: "RM-70 그라드"
 CZE_SP_R_arty_1_desc: "RM-51의 계승작으로 새로운 차체와 사격 체제를 탑재하여 20km의 사거리를 가진 40개의 로켓을 탑재합니다."
 CZE_SP_R_arty_2: "RM-71 밤피르"
 CZE_SP_R_arty_2_desc: "RM-70의 계승작으로 승무원을 위한 새로운 전투실과 유도 로켓으로 100km의 사거리를 가지고 있습니다."
 CZE_SP_R_arty_3: "RM-94 몬준\"		#Fictional"
 CZE_SP_R_arty_3_desc: "The new generation of MLRS has been developed into the RM-94. It features better communication and radio equipment and its shells have been replaced with new smart ammunition guided by many systems including GPS or Galileo."
 CZE_SP_R_arty_4: "RM-96 타이푼"
 CZE_SP_R_arty_4_desc: "RM96는 명작이라 불릴만한 무기입니다. 42개의 독립된 목표물에 동시에 타격을 가할 수 있으며, 그 사거리는 300km에 달합니다."
 CZE_SP_arty_0: "ShM vz. 85 PRÁM-S"
 CZE_SP_arty_0_desc: "This BVP-2 converted into mortar carrier is useful close-range support when our fellow soldiers get under fire."
 CZE_SP_arty_1: "ShKH vz. 77 다나"
 CZE_SP_arty_1_desc: "세계 곳곳에 수출된 다나 자주포는 고기동의 차체와 진보된 사격 통제 컴퓨터로 높은 정확도와 재방열 능력을 가지고 있습니다."
 CZE_SP_arty_2: "ShKH vz. 77 다나 M2"
 CZE_SP_arty_2_desc: "다나 자주포의 개량으로 최신의 기준과 기술, 새로운 탄약 종류를 가진 차량입니다. 새로운 바퀴 차축과 엔진, 사격 통제, 통신장비로 더 정확한 사격을 가할 수 있습니다."
 CZE_SP_arty_3: "ShKH vz. 105 카트카\"	#Fictional"
 CZE_SP_arty_3_desc: "다나 자주포의 계승작으로 카트카 자주포는 고기동 차량인 동시에 다른 군사 장비와 실시간으로 통신이 연결되어 상태, 위치, 움직임, 날씨, 상황을 알아내어 더 정확한 사격을 가할 수 있습니다. 더 긴 포신과 가스 배출구를 가진 새로운 포를 장착하고 있습니다."
 CZE_SP_arty_4: "ShKH vz. 109 바라\"	#Fictional"
 CZE_SP_arty_4_desc: "Bára is the masterpiece of the engineering. It is resistant to counter-artillery fire losses due to remote control and fast off-road speeds, but also high ammunition stores for longevity of its fire and resupplying."
 CZE_artillery_1: "122mm houfnice vz. 38/74"
 CZE_artillery_1_short: "vz. 38/74"
