 EDGAR_SAVISAAR_DESC: "Edgar Savisaar ist ein estnischer Politiker, eines der Gründungsmitglieder der Volksfront Estlands und der Zentrumspartei. Er war amtierender Ministerpräsident Estlands, Innenminister, Minister für Wirtschaft und Kommunikation sowie Bürgermeister von Tallinn."
