 ISR_speak_to_malal: "Falar com o Mal'al"
 ISR_speak_to_malal_desc: "No novo século, Israel deve conduzir uma política externa muito cautelosa e delicada para sustentar a nossa segurança."
 ISR_usa_china_balance: "Andar na Corda Bamba"
 ISR_usa_china_balance_desc: "As relações de Israel com os EUA e a China estão agora em seu ponto mais alto. Agora devemos decidir o que fazer com as oportunidades recém-abertas."
 ISR_balance_favor_america: "A Velha Aliança"
 ISR_balance_favor_america_desc: "Os EUA são nosso aliado mais longevo e antigo. A cooperação econômica entre nós e eles é a escolha mais racional que podemos fazer."
 ISR_balance_favor_china: "O Legado da Rota da Seda"
 ISR_balance_favor_china_desc: "No cenário político moderno em mudança, favorecer a China pode ser benéfico para a nossa economia."
 ISR_joint_development_zone: "Grupo Econômico de Desenvolvimento Conjunto"
 ISR_joint_development_zone_desc: "O Grupo Econômico de Desenvolvimento Conjunto EUA-Israel (JEDG) é a reunião bilateral anual entre Israel e os Estados Unidos destinada a discutir as condições econômicas em ambos os países e possíveis reformas econômicas que poderiam ser adotadas pelo Governo de Israel."
 ISR_visa_free_request: "Aderir ao Programa de Isenção de Vistos"
 ISR_visa_free_request_desc: "O Programa de Isenção de Vistos permite que cidadãos de determinados países viajem aos Estados Unidos a turismo ou negócios, por estadias de 90 dias ou menos, sem obter um visto. Os participantes do programa devem cumprir requisitos específicos, incluindo possuir uma autorização válida do Sistema Eletrônico de Autorização de Viagem antes de embarcar em seus voos."
 ISR_defence_pact_usa: "Propor um Pacto de Defesa"
 ISR_defence_pact_usa_desc: "Precisamos repensar nossos acordos de defesa com os EUA e, provavelmente, aprofundar a cooperação."
 ISR_china_arm_shipments: "Exportações de Armas Sofisticadas"
 ISR_china_arm_shipments_desc: "Podemos cooperar com a China na área de defesa oferecendo nosso armamento para venda."
 ISR_israel_china_innovation_conference: "Fórum da Conferência de Inovação Israel-China"
 ISR_israel_china_innovation_conference_desc: "O Comitê Conjunto China-Israel para Cooperação em Inovação é uma iniciativa do Ministério das Relações Exteriores de Israel, para construir um mecanismo governamental de alto nível entre os dois países."
 ISR_haifa_port_lease: "Conceder um Arrendamento do Porto de Haifa"
 ISR_haifa_port_lease_desc: "Conceder um arrendamento do porto de Haifa pode ser benéfico para nós e para a China e impulsionar o nosso comércio mútuo."
 ISR_cyrus_accords: "O Sonho de Neemias"
 ISR_cyrus_accords_desc: "Quando Artaxerxes enviou o profeta Neemias a Jerusalém para reparar suas muralhas, ele não apenas reafirmou aos judeus a promessa feita por Ciro; ele selou uma amizade centenária entre o povo persa e os filhos de Israel. Os aiatolás, por mais que tentem esconder, vão contra a vontade de seu povo ao perseguir a nossa extinção. Apoiaremos o povo do Irã na esperança de uma nova e melhor era."
 ISR_cyrus_accords_sign: "Assinar os Acordos de Ciro"
 ISR_cyrus_accords_sign_desc: "Depois que o Irã for libertado do regime tirânico dos aiatolás, devemos assinar um novo tratado entre os nossos países."
 ISR_cyrus_promise: "A Vingança de Ben Ushiel"
 ISR_cyrus_promise_desc: "Há mais de mil e quinhentos anos, Neemias Ben Ushiel foi sacrificado pelo xá persa Cosroes II em Tiro como pretexto para erradicar a última tentativa de um Estado judeu antes do Estado de Israel. Agora que retornamos à Terra Santa, não esqueceremos o sacrifício de Ushiel: o Irã e seus líderes são uma ameaça existencial ao Estado Judeu e, enquanto isso for verdade, eles não dormirão."
 ISR_iran_command: "Departamento Estratégico e do Terceiro Círculo"
 ISR_iran_command_desc: "A Diretoria Estratégica e do Terceiro Círculo será criada para concentrar a atividade das IDF em relação aos inimigos de terceiro círculo de Israel (aqueles com os quais não compartilha fronteira), sendo o Irã o principal deles. Por isso, a Diretoria também é apelidada de Comando do Irã. À frente da Diretoria está um oficial sênior das IDF com patente de Aluf, equivalente a general de divisão."
 ISR_cyber_defence_unit: "Criar a Brigada de Defesa Cibernética"
 ISR_cyber_defence_unit_desc: "Devemos ser capazes de nos defender não apenas no âmbito da segurança física, mas também no espaço cibernético."
 ISR_cyber_attack_iran: "Propor Ataques Cibernéticos de Retaliação"
 ISR_cyber_attack_iran_desc: "Devemos atacar cibernéticamente as agências governamentais do Irã para garantir que nenhuma parte de seu plano malicioso escape à nossa vigilância."
 ISR_operation_olympic_games: "Operação Jogos Olímpicos"
 ISR_operation_olympic_games_desc: "Precisamos conduzir, junto com os EUA, uma campanha conjunta de sabotagem por meio de disrupção cibernética, direcionada às instalações nucleares iranianas."
 ISR_deniable_drone_strikes: "Ataques Avançados de Drones com Negação Plausível"
 ISR_deniable_drone_strikes_desc: "Ganhamos muita experiência conduzindo ataques de drones com negação plausível; usaremos essa experiência para aprimorar nossa metodologia de ataques com drones."
 ISR_supply_the_pjaks: "Implementar o Plano Gimel"
 ISR_supply_the_pjaks_desc: "O Irã tem um problema interno interessante: o movimento curdo PJAK. Mesmo que nossas posições ideológicas sejam bem diferentes, podemos lucrar muito apoiando sua luta..."
 ISR_accept_diplomacy: "Abandonar a Pressão Máxima"
 ISR_accept_diplomacy_desc: "Devemos tentar pacificar as ambições do Irã buscando uma boa postura negociadora em novas conversas."
 ISR_strike_with_america: "Pressionar por uma Operação Conjunta"
 ISR_strike_with_america_desc: "Devemos conduzir uma operação conjunta para neutralizar a ameaça nuclear iraniana."
 ISR_strike_alone: "Devorar a Espada para Sempre"
 ISR_strike_alone_desc: "É apenas dever nosso cortar a espada sobre nossas cabeças que ameaça a nossa existência."
 ISR_invite_rajavi: "Reunir-se com Maryam Rajavi"
 ISR_invite_rajavi_desc: "Maryam Rajavi é a esposa do conhecido líder da oposição de esquerda iraniana Massoud Rajavi. Talvez devêssemos tentar conquistar o apoio deles..."
 ISR_invite_pahlavi: "Reunir-se com Reza Pahlavi"
 ISR_invite_pahlavi_desc: "Para garantir a legitimidade de nossas ações subversivas contra o Irã, devemos nos reunir com Reza Pahlavi, filho do antigo xá do Irã, para obter seu apoio."
 ISR_support_iranian_protesters: "Apoiar os Manifestantes Iranianos"
 ISR_support_iranian_protesters_desc: "Devemos desestabilizar o cenário político iraniano e apoiar os manifestantes contrários ao regime..."
 ISR_steal_the_nuclear_archive: "Roubar o Arquivo Nuclear Iraniano"
 ISR_steal_the_nuclear_archive_desc: "Nossos agentes já estão em Teerã, aguardando ordens para entrar em uma instalação militar especial. Teremos de coordenar diretamente suas ações e prestar atenção aos detalhes."
 ISR_bct_pipleine_azerbaijan: "Importações Baku-Tbilisi-Ceyhan"
 ISR_bct_pipleine_azerbaijan_desc: "Fortalecer as relações com o Azerbaijão pode ser muito benéfico para a nossa economia e para a nossa capacidade de combater o Irã."
 ISR_tavor_arm_shipments: "Remessas de Armas Tavor"
 ISR_tavor_arm_shipments_desc: "Podemos lucrar fornecendo nossos fuzis Tavor ao exército do Azerbaijão, além de fortalecer os laços entre nossos países."
 ISR_uvda_airlift: "A Ponte Aérea de Uvda"
 ISR_uvda_airlift_desc: "Precisamos obter uma base para operações aéreas e pouso "
 ISR_sitalchay_airbase_lease: "Arrendar a Base Aérea de Sitalchay"
 ISR_sitalchay_airbase_lease_desc: "Talvez precisemos que os azeris nos arrendem a base aérea de Sitalchay para impedir ainda mais a agressão iraniana e estabelecer um pacto secreto com eles."
 ISR_mossads_door: "A Porta do Mossad"
 ISR_mossads_door_desc: "O Azerbaijão tem enormes conexões no Irã, apesar da animosidade entre os dois países. Pessoas de ambos os países circulam no território um do outro e as relações comerciais prosperam, apesar das diferenças políticas. Talvez o Azerbaijão nos dê a chance de usar o país deles como refúgio para nossos agentes que entram no Irã."
 ISR_karabakh_victory: "Vitória em Karabakh"
 ISR_karabakh_victory_desc: "Em parte graças aos nossos esforços, Karabakh foi finalmente libertado dos representantes iranianos. A vitória é nossa!"
 ISR_reconsider_caucasus_position: "Considerar Nosso Papel na História"
 ISR_reconsider_caucasus_position_desc: "Devemos aprender com a nossa história e nos reaproximar da Armênia e do povo armênio. Nossa história comum mostra muitas semelhanças e não podemos nos permitir negá-las."
 ISR_recognize_arm_genocide: "Reconhecer o Genocídio Armênio"
 ISR_recognize_arm_genocide_desc: "Nós, judeus, assim como os armênios, sofremos o mesmo destino no passado, no que diz respeito à perseguição do nosso povo. Devemos reconhecer o sofrimento dos armênios, mesmo que isso piore nossas relações com a Turquia."
 ISR_syunik_air_base: "Arrendar a Base Aérea de Syunik"
 ISR_syunik_air_base_desc: "Devemos pedir à Armênia que coopere secretamente conosco, caso nosso país seja atacado. Uma base aérea deve ser estabelecida para que nossos planos tenham sucesso."
 ISR_armenia_mossad_door: "A Janela Aberta do Mossad"
 ISR_armenia_mossad_door_desc: "Devemos pedir à Armênia que coopere contra a ameaça iraniana comum. Se concordarem, nossos espiões entrarão no Irã pela fronteira deles."
 ISR_airlift_support_armenia: "Operação Monte Ararate"
 ISR_airlift_support_armenia_desc: "Devemos cooperar militarmente com a Armênia e fornecer a ela nossos drones mais recentes."
 ISR_recognize_artsakh: "Nossa Posição sobre a Questão de Artsakh"
 ISR_recognize_artsakh_desc: "Chegou a hora de proclamarmos finalmente nossa posição definitiva sobre a questão de Artsakh. Isso aumentará drasticamente nossa influência sobre a Armênia e Artsakh."
 ISR_influence_caucasus: "Xeque-Mate nos Portões de Alexandre"
 ISR_influence_caucasus_desc: "Devemos estabelecer conexões poderosas e espalhar influência e relações comerciais por todo o Cáucaso, mesmo com países que não gostam muito de nós."
 ISR_free_trade_geo: "Acordo de Livre Comércio Israel-Geórgia"
 ISR_free_trade_geo_desc: "Para o nosso benefício econômico mútuo, devemos estabelecer um acordo de livre comércio entre nossos países e fomentar as relações econômicas entre eles."
 ISR_mil_cyb_geo: "Exportar Capacidades Militares"
 ISR_mil_cyb_geo_desc: "A cooperação militar com a relativamente pacífica Geórgia pode ser realmente benéfica para nós no plano de longo prazo de influenciar o Cáucaso Sul."
 ISR_approach_georgia: "Aproximar-se da Geórgia"
 ISR_approach_georgia_desc: "A Geórgia é um dos países que sempre demonstrou algum interesse em cooperar com o nosso. Devemos tentar fazer amizade com eles."
 ISR_balance_favor_ukraine: "Importar Trigo Ucraniano"
 ISR_balance_favor_ukraine_desc: "A Ucrânia tem uma das maiores diásporas judaicas do mundo. Não podemos negar a generosa oferta de compra de seus grãos, para fomentar nossa relação comercial."
 ISR_balance_favor_russia: "Importar Trigo Russo"
 ISR_balance_favor_russia_desc: "Para mostrar à Rússia que gostamos muito da ideia de amizade com eles, talvez devêssemos comprar grãos deles, como primeiro passo para a cooperação."
 ISR_russian_military_coordination: "Coordenação Militar Russa"
 ISR_russian_military_coordination_desc: "Para fomentar nossas relações com a Rússia, podemos propor cooperação militar entre nossos países."
 ISR_honor_the_red_army: "Honrar o Exército Vermelho"
 ISR_honor_the_red_army_desc: "Nossos povos lutaram juntos contra a ameaça nazista na Segunda Guerra Mundial. Devemos apoiar nossa história de irmandade e honrar o Exército Vermelho!"
 ISR_cede_sergeys_courtyard: "Acordo do Pátio de Sergei"
 ISR_cede_sergeys_courtyard_desc: "O Complexo Russo é um dos distritos mais antigos do centro de Jerusalém, com uma grande igreja ortodoxa russa, o Pátio de Sergei, de propriedade russa, e as instalações do Consulado-Geral da Rússia em Jerusalém, além do local de antigas hospedarias de peregrinos, algumas das quais são usadas como prédios do governo israelense, e uma das quais abriga o Museu dos Prisioneiros Clandestinos."
 ISR_part_of_the_russian_world: "Parte do Mundo Russo"
 ISR_part_of_the_russian_world_desc: "Para aumentar nossos laços com a Rússia e obter benefício mútuo, talvez precisemos assinar um acordo de livre comércio com a UEEA."
 ISR_ukrainian_foreign_workers: "Trabalhadores Estrangeiros Ucranianos"
 ISR_ukrainian_foreign_workers_desc: "Como parte da cooperação econômica com a Ucrânia, podemos convidar seus trabalhadores para o nosso país. Talvez isso beneficie a ambos."
 ISR_ukrainian_refugees: "A Proposta Shaked"
 ISR_ukrainian_refugees_desc: "Embora nossos laços com a Ucrânia sejam agora fortes, devemos apoiar o retorno de nossa diáspora da Ucrânia para Israel."
 ISR_visit_central_asia: "Viajar para a Ásia Central"
 ISR_visit_central_asia_desc: "Chegou a hora de melhorarmos nossas relações com os países da Ásia Central."
 ISR_red_color_systems: "Exportar Sistemas Tzeva Adom"
 ISR_red_color_systems_desc: "Considerando a situação política ucraniana atual, pode ser previdente exportar a eles nossos sistemas de radar de alerta antecipado."
 ISR_deliver_kipot_barzel_to_ukraine: "O Acordo dos Céus do Norte"
 ISR_deliver_kipot_barzel_to_ukraine_desc: "Nosso próximo passo para garantir nossos laços com a Ucrânia seria exportar a Cúpula de Ferro para a Ucrânia."
 ISR_travel_to_europe: "Viajar pela Europa"
 ISR_travel_to_europe_desc: "Além dos EUA, os Estados europeus são nossos parceiros comerciais e militares mais próximos. Precisamos melhorar nossas relações com eles."
 ISR_germany_relations: "Reforçar a Staatsräson"
 ISR_join_oecd: "Assistência da OCDE"
 ISR_join_oecd_desc: "A Organização para a Cooperação e Desenvolvimento Econômico é uma organização intergovernamental fundada em 1961 para estimular o progresso econômico e o comércio mundial. É um fórum cujos países-membros se descrevem como comprometidos com a democracia e a economia de mercado, oferecendo uma plataforma para comparar experiências de políticas, buscar respostas para problemas comuns, identificar boas práticas e coordenar as políticas internas e internacionais de seus membros."
 ISR_germany_relations_desc: "Apesar de nossos... problemas passados com a Alemanha, o governo alemão moderno pediu desculpas por seus atos anteriores e declarou amizade ao nosso povo."
 ISR_kosovo_question: "Reconsiderar a Política nos Bálcãs"
 ISR_kosovo_question_desc: "Ao apoiar o Kosovo, de maioria muçulmana, podemos obter benefícios diplomáticos gerais junto ao mundo islâmico. Além disso, um Kosovo alinhado ao Ocidente pode ajudar a moldar melhor a nossa imagem a favor das potências ocidentais."
 ISR_approach_singapore: "Uma Nova Missão a Singapura"
 ISR_approach_singapore_desc: "Singapura é um de nossos aliados mais antigos e próximos no Extremo Oriente asiático. Devemos renovar nosso acordo de cooperação militar e aprofundar nossos esforços conjuntos."
 ISR_approach_mynamar: "O Legado de Thakin Nu"
 ISR_approach_mynamar_desc: "Mianmar foi um dos primeiros países a nos reconhecer e estabelecer boas relações conosco. Devemos continuar essa amizade frutífera!"
 ISR_state_visit_to_india: "Visita de Estado à Índia"
 ISR_state_visit_to_india_desc: "A Índia é um de nossos parceiros militares e políticos mais próximos contra a agressão islâmica no Oriente Médio. Devemos fomentar boas relações entre nossos Estados."
 ISR_promote_after_army_trips: "Viagens à Índia Após o Serviço Militar"
 ISR_promote_after_army_trips_desc: "A Índia está ansiosa para impulsionar o setor de turismo de sua economia. Podemos ajudá-la estabelecendo viagens pós-serviço à Índia para nossos soldados."
 ISR_arm_exports_to_india: "Exportações de Armas para a Índia"
 ISR_arm_exports_to_india_desc: "O establishment militar indiano pode ter muito interesse em nossos produtos militares. Vamos oferecer nossas armas para venda."
 ISR_ashdod_port: "Conceder um Arrendamento do Porto de Ashdod"
 ISR_ashdod_port_desc: "A Índia há muito tempo tem interesse em acessar o porto de Ashdod. Podemos usar isso em benefício mútuo."
 ISR_joint_space_program: "Colaboração em Programas Espaciais"
 ISR_joint_space_program_desc: "O programa espacial conjunto Israel-Índia é um testemunho do compromisso inabalável de ambas as nações em expandir os limites da exploração espacial."
 ISR_make_in_india: "Made in India"
 ISR_make_in_india_desc: "Devemos aumentar nossas relações comerciais com a Índia para obter benefício mútuo. Os novos programas econômicos indianos proclamados recentemente são uma boa oportunidade para isso."
 ISR_salinization_support_india: "Oferecer Apoio com Tecnologia de Água"
 ISR_salinization_support_india_desc: "A Índia, assim como nós antes, tem problemas com a purificação de água. Podemos usar isso para obter mais influência sobre ela."
 ISR_iran_international: "Sediar a Iran International"
 ISR_iran_international_desc: "A Iran International é um veículo de notícias em língua persa, dedicado a implementar contrapropaganda sobre a população iraniana."
 ISR_plan_bet: "Implementar o Plano Bet"
 ISR_plan_bet_desc: "Para combater os planos maliciosos do Irã e manter os xiitas iraquianos sob controle, devemos apoiar o Estado curdo de fato e as milícias étnicas."
 ISR_indian_imports: "Impulso Comercial Israel-Índia"
 ISR_speak_to_staff: "Falar com o Matkal"
 ISR_speak_to_staff_desc: "Nosso país está cercado de inimigos. Não podemos nos permitir uma abordagem desfocada em relação às nossas forças armadas."
 ISR_women_corps: "Desmantelar o Corpo Feminino"
 ISR_women_corps_desc: "Devemos desmantelar o Corpo Feminino para que as soldadas possam ficar sob a autoridade de unidades individuais com base em suas funções e não em seu sexo."
 ISR_yohalam: "O Yohalam"
 ISR_yohalam_desc: "Esta unidade é responsável por implementar políticas para prevenir o assédio sexual nas IDF, além de assessorar o Chefe do Estado-Maior das IDF e o Fórum do Estado-Maior das IDF sobre a promoção da igualdade de oportunidades de gênero e a otimização do serviço feminino nas IDF."
 ISR_unite_courses: "Unificar os Cursos de Oficiais"
 ISR_unite_courses_desc: "Devemos unificar os cursos de oficiais femininos e masculinos para centralizar o sistema de formação de oficiais."
 ISR_netzah_yehuda: "Batalhão Netzah Yehuda"
 ISR_netzah_yehuda_desc: "O 97º Batalhão Netzah Yehuda, anteriormente conhecido como Nahal Haredi, é um batalhão da Brigada Kfir das Forças de Defesa de Israel. O objetivo da unidade é permitir que homens judeus haredi sirvam como soldados de combate nas forças armadas israelenses, criando um ambiente favorável às suas convicções religiosas na estrita observância da Halachá."
 ISR_karakal: "Batalhão Caracal"
 ISR_karakal_desc: "O 33º Batalhão Caracal é um batalhão de infantaria de combate das Forças de Defesa de Israel, uma das três unidades totalmente de combate da Brigada Paran das forças armadas israelenses compostas por soldados de ambos os sexos."
 ISR_army_builds_society: "Am Bone Tzava Bone Am"
 ISR_army_builds_society_desc: "O exército constrói a nossa sociedade e é o núcleo da nossa condição de Estado!"
 ISR_gsharim: "Gsharim"
 ISR_gsharim_desc: "O programa Gsharim deve permitir que nossos soldados obtenham créditos após deixarem as IDF."
 ISR_titkadmu: "Mitkadmin BeTzahal"
 ISR_titkadmu_desc: "O Titkadmu é um programa militar voltado a soldados no espectro autista. Como parte da visão das IDF de integrar esses jovens à sociedade em geral, o MPOTP elaborou um programa para ajudar e treinar o corpo de comando a trabalhar com soldados no espectro. Também elaboramos um programa que ajuda os soldados no espectro a se integrarem com sucesso ao estilo de vida militar."
 titkadmu_idea: "Titkadmu"
 ISR_fill_our_stocks: "Reabastecer Nossos Estoques"
 ISR_fill_our_stocks_desc: "Precisamos reabastecer nossos estoques o mais rápido possível. Para isso, devemos contatar diversos traficantes de armas e comprar armamento para o nosso exército."
 ISR_merkava_focus: "O Merkava"
 ISR_merkava_focus_desc: "O Merkava é uma série de carros de combate principais usados pelas Forças de Defesa de Israel e a espinha dorsal do Corpo Blindado das IDF."
 ISR_mafat: "Criar o Maf'at"
 ISR_mafat_desc: "O DDR&D é encarregado de desenvolver conceitos inovadores de tecnologia de defesa, gerenciar os projetos de curto e longo prazo do Ministério da Defesa de Israel relacionados à tecnologia defensiva, servir como órgão técnico profissional para a pesquisa e o desenvolvimento de tecnologia militar e defensiva, cooperar com parceiros internacionais no campo da pesquisa e desenvolvimento e treinar a próxima geração de pessoal e profissionais de tecnologia do establishment de defesa."
 ISR_military_industry: "Tornar-se um Grande Produtor de Armas"
 ISR_military_industry_desc: "Devemos fazer da produção de armas um dos maiores setores da nossa economia."
 ISR_eitan: "O Eitan"
 ISR_eitan_desc: "O Eitan é um veículo blindado de combate desenvolvido pela Diretoria de Merkava e Veículos Blindados do Ministério da Defesa de Israel para substituir o envelhecido veículo blindado de transporte de pessoal M113 em uso pelas Forças de Defesa de Israel."
 ISR_pere: "O Pereh"
 ISR_pere_desc: "O Pereh é um veículo lançador de mísseis antitanque israelense, disfarçado de tanque. Serve às Forças de Defesa de Israel no papel de artilharia de precisão."
 ISR_barak_tank: "Apresentar o Barak"
 ISR_barak_tank_desc: "O tanque Barak incorpora tecnologias inovadoras, que proporcionam aos soldados do Corpo Blindado capacidades defensivas e ofensivas únicas que melhoram enormemente a manobrabilidade."
 ISR_winegrad_commission: "As Audiências da Comissão Winograd"
 ISR_winegrad_commission_desc: "A Comissão Winograd é uma comissão de inquérito nomeada pelo governo israelense, presidida pelo juiz aposentado Eliyahu Winograd, que investigou e tirou lições da Guerra do Líbano."
 ISR_unit_as_etrog: "A Unidade como um Etrog"
 ISR_multi_facid_manuevers: "Brigadas Multifacetadas"
 ISR_tenufa_project: "O Projeto Tnufa"
 ISR_tenufa_project_desc: "O plano Tnufa ainda não recebeu a aprovação oficial do gabinete israelense e não está ancorado em um acordo orçamentário plurianual."
 ISR_gideon_plan: "O Plano Gideão"
 ISR_gideon_plan_desc: "O plano Gideão tem dois propósitos. Primeiro, evitar cortes e, de fato, obter mais um aumento no orçamento de defesa à custa do bem-estar social, da educação, da saúde e de todas as outras necessidades nacionais."
 ISR_flash_formations: "Formações Relâmpago"
 ISR_flash_formations_desc: "Devemos usar formações relâmpago para sermos mais eficientes em nossas práticas relacionadas às nossas forças terrestres."
 ISR_lightning_campaign: "Entrar e Sair"
 ISR_lightning_campaign_desc: "Nossas forças devem estar prontas para incursões rápidas e trocas de unidades, o que nos beneficiará especialmente em áreas urbanas."
 ISR_prioritize_givati: "Priorizar a Givati"
 ISR_prioritize_givati_desc: "A 84ª Brigada Givati é uma brigada de infantaria das Forças de Defesa de Israel formada em 1947. Durante a guerra de 1948, participou da captura de aldeias palestinas nas operações Hametz, Barak e Pleshet."
 ISR_ghost_units: "Unidades Fantasma 888"
 ISR_ghost_units_desc: "A Unidade 888 é uma força-tarefa combinada de operações especiais dentro da 99ª Divisão de Infantaria. Devemos priorizá-la e separá-la em uma unidade independente."
 ISR_urban_warfare: "Preparar-se para a Guerra Urbana"
 ISR_urban_warfare_desc: "Agora devemos fazer os preparativos finais para estar prontos para qualquer cenário de guerra possível que envolva um ambiente urbano."
 ISR_paphos_drill: "Os Jogos de Guerra de Pafos"
 ISR_paphos_drill_desc: "Devemos treinar com Chipre para ganhar mais experiência em combate em montanhas para a nossa frente norte."
 ISR_operating_to_victory: "Doutrina Operar até a Vitória"
 ISR_operating_to_victory_desc: "Devemos operar até a vitória, não por soluções parciais!"
 ISR_prioritize_golani: "Golani Sheli"
 ISR_prioritize_golani_desc: "Precisamos priorizar as colinas de Golã como nosso principal setor de defesa a proteger."
 ISR_focus_on_the_battalion: "Focar no Gdud"
 ISR_focus_on_the_battalion_desc: "Os batalhões devem ser nossa principal prioridade, pois serão nosso escudo contra os inimigos do norte."
 ISR_mountain_warfare: "Preparar-se para a Guerra de Montanha"
 ISR_mountain_warfare_desc: "Agora, nosso exército deve estar pronto para qualquer guerra em nossa frente norte e para quaisquer ações em montanhas."
 ISR_focus_air: "A Força Aérea Israelense"
 ISR_focus_air_desc: "A Força Aérea Israelense atua como o ramo de guerra aérea e espacial das Forças de Defesa de Israel. Foi fundada em 28 de maio de 1948, pouco depois da Declaração de Independência de Israel."
 ISR_focus_navy: "A Marinha Israelense"
 ISR_focus_navy_desc: "Para garantir a segurança do nosso país, devemos também focar na nossa segurança marítima."
 ISR_focus_ground_forces: "As Forças Terrestres Israelenses"
 ISR_focus_ground_forces_desc: "As Forças Terrestres Israelenses são as forças terrestres das Forças de Defesa de Israel. O comandante é o Oficial General Comandante com patente de General de Divisão, o Mazi, subordinado ao Chefe do Estado-Maior."
 ISR_extend_standing_period: "Estender o Período de Serviço"
 ISR_extend_standing_period_desc: "Os pilotos não serão trabalhadores 'sazonais', convocados durante a guerra. Estenderemos seu período de serviço e os impediremos de atuar na política."
 ISR_shorten_standing_period: "Encurtar o Período de Serviço"
 ISR_shorten_standing_period_desc: "Devemos encurtar o tempo de treinamento para o treinamento em massa de nossos reservistas."
 ISR_shorten_flight_course: "Reformar o Curso de Voo"
 ISR_shorten_flight_course_desc: "Devemos reformar o curso de treinamento do pessoal da força aérea. Isso exigirá mais tempo para treiná-los, mas os tornará mais profissionais."
 ISR_small_but_professional: "Pequena, mas Profissional"
 ISR_small_but_professional_desc: "Os oficiais da nossa força aérea devem ser poucos em quantidade e de longa permanência."
 ISR_miller_case: "Implementar o Caso Miller"
 ISR_miller_case_desc: "Em 1994, uma jovem corajosa desafiou a instituição e exigiu uma chance de integrar uma das unidades mais de elite das IDF. Natural da África do Sul, Alice Miller emigrou para Israel com a família aos 6 anos. Miller sempre teve paixão pela aviação. Após o ensino médio, obteve a licença de piloto civil e cursou Engenharia Aeroespacial. Aos 23 anos, processou as forças armadas pelo direito de se alistar no prestigiado curso de pilotos. Em uma votação histórica, a Suprema Corte de Israel considerou inconstitucional a proibição de recrutas mulheres no curso de aviação."
 ISR_begin_doctrine: "Reforçar a Doutrina Begin"
 ISR_operation_orchard: "Operação Fora da Caixa"
 ISR_operation_orchard_desc: "Devemos realizar um ataque aéreo a um suposto reator nuclear, conhecido como o local de Al Kibar, na região de Deir ez-Zor, na Síria."
 ISR_prevent_iranian_nukes: "Operação Rainha das Rosas"
 ISR_prevent_iranian_nukes_desc: "Agora sabemos com certeza que o Irã já possui ou está muito perto de adquirir armas nucleares. Devemos retardar esse processo."
 ISR_prevent_libyan_nukes: "Operação Tempestades de Dunas"
 ISR_prevent_libyan_nukes_desc: "Se o governo líbio for hostil a nós e quiser desenvolver ou comprar armas nucleares, devemos impedir seu ataque bombardeando suas instalações nucleares."
 ISR_prevent_iraqi_nukes: "Operação Jogada Final"
 ISR_prevent_iraqi_nukes_desc: "Se o governo iraquiano for hostil a nós e quiser desenvolver ou comprar armas nucleares, devemos impedir seu ataque bombardeando suas instalações nucleares."
 ISR_war_between_the_wars: "A Frente entre as Guerras"
 ISR_war_between_the_wars_desc: "Para combater o regime iraniano, devemos travar uma guerra híbrida com o Irã, enfrentando-o em suas frentes mais distantes."
 ISR_villa_in_the_jungle: "Da Vila na Selva"
 ISR_villa_in_the_jungle_desc: "Talvez possamos tentar manipular a Síria para retirar as tropas iranianas de seu solo e até torná-la uma aliada refém..."
 ISR_expand_lamdan: "Confiar no Lahak de Inteligência"
 ISR_expand_lamdan_desc: "Devemos confiar no LAMDAN para fazer toda a coleta de inteligência da força aérea."
 ISR_researchers_with_idi: "Colocar Pesquisadores nas Bases da IDI"
 ISR_researchers_with_idi_desc: "Devemos colocar nossos pesquisadores militares nas bases da IDI para obter mais informações sobre as táticas e necessidades atuais do nosso exército."
 ISR_shuffle_squadrons: "Reorganização nos Esquadrões"
 ISR_shuffle_squadrons_desc: "Devemos reorganizar as associações políticas criadas por aviadores. Isso garantirá sua lealdade política."
 ISR_research_department_focus: "Defender a Kiryah"
 ISR_research_department_focus_desc: "Devemos garantir o domínio do departamento da Kiryah sobre o Glilot."
 ISR_aman_info_focus: "Defender o Glilot"
 ISR_aman_info_focus_desc: "Devemos garantir o domínio do departamento Glilot sobre a Kirya."
 ISR_balance_hatam_aman_focus: "Os Artistas da Informação"
 ISR_balance_hatam_aman_focus_desc: "Devemos garantir o equilíbrio entre a Kirya e o Glilot, mesmo que eles não gostem."
 ISR_brothers_squadrons: "Esquadrões de Irmãos"
 ISR_brothers_squadrons_desc: "Os reservistas, ao contrário dos soldados, podem atuar na política. Mais notoriamente com sua associação Irmãos de Armas, que liderou a oposição à Reforma Judicial."
 ISR_brothers_in_arms_air: "Irmãos e Irmãs de Armas"
 ISR_brothers_in_arms_air_desc: "Devemos permitir que oficiais mulheres entrem em nossa associação e ampliar o número de aviadores e aviadoras que podem aderir a ela."
 ISR_sion_sead: "O SEAD Si'on"
 ISR_sion_sead_desc: "Devemos estar prontos para a supressão das defesas aéreas inimigas e produzir mais drones de alta tecnologia para poder conduzir tais operações."
 ISR_kochav: "Produção Avançada de Drones"
 ISR_kochav_desc: "Com nossas capacidades, devemos produzir e potencialmente exportar nossos drones, ganhando mais dinheiro e força."
 ISR_prioritize_ramat_david: "Priorizar Ramat David"
 ISR_prioritize_ramat_david_desc: "Se construirmos uma base aérea em Ramat David, poderemos proteger as regiões do sul do nosso país."
 ISR_prioritize_nevatim: "Priorizar Nevatim"
 ISR_prioritize_nevatim_desc: "Devemos priorizar Nevatim para construir uma base aérea por causa de sua localização geográfica."
 ISR_raam: "O Ra'am"
 ISR_raam_desc: "Um caça de longo alcance de dupla função, para ataque e interceptação. A aeronave, a melhor de seu tipo no cenário do Oriente Médio, entrou em serviço em janeiro de 1998 e é a aeronave principal da IAF. O Ra'am é uma versão especial do F-15E Strike Eagle projetada especificamente para Israel pela McDonnell Douglas (hoje Boeing). Sua tremenda capacidade de carga, combinada com seus sistemas avançados, permite realizar ataques em profundidade com grande carga de armamento, a longas distâncias, em baixa altitude, a qualquer hora do dia e da noite e em quaisquer condições climáticas."
 ISR_sufa: "O Sufa"
 ISR_sufa_desc: "Apelidado de \"Sufa,\" ou tempestade, o F-16I é uma versão redesenhada e modificada sob medida do F-16, adaptada às especificações da Força Aérea Israelense (IAF). O F-16I é diferente de qualquer outro F-16, incluindo os da Força Aérea dos EUA."
 ISR_snunit: "O Snunit"
 ISR_snunit_desc: "O Grob G 120 é uma aeronave de treinamento alemã de dois assentos. É ativamente usado pelas Forças de Defesa de Israel e pelas IDF para o treinamento de pilotos."
 ISR_lavi: "O Lavi"
 ISR_lavi_desc: "O IAI Lavi é um protótipo de caça construído pela IAI. O projeto foi encerrado, mas alguns programas de caças em outros países utilizam os resultados da pesquisa realizada durante o desenvolvimento do Lavi."
 ISR_adir: "Receber os Adirs"
 ISR_adir_desc: "A aquisição israelense do Lockheed Martin F-35 Lightning II é resultado de um acordo para o governo de Israel adquirir o Lockheed Martin F-35 Lightning II para a Força Aérea Israelense como o F-35I \"Adir\". Os primeiros nove F-35 tornaram-se operacionais na Força Aérea Israelense em dezembro de 2017."
 ISR_repair_the_atalefs: "Reparar os Atalefs"
 ISR_repair_the_atalefs_desc: "O Eurocopter AS565 Panther Atalef é um helicóptero multifuncional francês, a versão militar do Eurocopter AS365 Dauphin civil. O Panther é usado em uma ampla gama de missões: apoio aéreo, desembarques de combate, combate a alvos terrestres, defesa antissubmarino, busca e salvamento e evacuação de feridos."
 ISR_yassur: "O Yass'ur"
 ISR_yassur_desc: "O CH-53 Sea Stallion (Sikorsky S-65) é uma família americana de helicópteros de transporte pesado projetados e construídos pelo fabricante americano Sikorsky Aircraft."
 ISR_yanshuf: "O Yanshuf"
 ISR_yanshuf_desc: "O Sikorsky UH-60 Black Hawk é um helicóptero militar utilitário de médio porte, de quatro pás e dois motores, fabricado pela Sikorsky Aircraft. A Sikorsky apresentou o projeto S-70 para a competição do Sistema de Aeronave de Transporte Tático Utilitário (UTTAS) do Exército dos Estados Unidos em 1972."
 ISR_saraph: "Receber o Saraph"
 ISR_saraph_desc: "O Boeing AH-64 Apache é um helicóptero de ataque americano de dois turboeixos, com trem de pouso do tipo triciclo com roda de cauda e cabine em tandem para uma tripulação de dois."
 ISR_unit_669: "Unidade 669"
 ISR_air_officers: "Os Melhores para o Voo"
 ISR_air_officers_desc: "Devemos escolher apenas pilotos profissionais para serem nossos aviadores e oficiais. No entanto, essa mudança de política pode exigir a aprovação do Knesset."
 ISR_air_reservists: "Manter o Status Quo"
 ISR_air_reservists_desc: "Devemos reforçar a estratégia de reservistas treinados rapidamente como núcleo da nossa força aérea."
 ISR_aerospace_industries_focus: "As Indústrias Aeroespaciais de Israel"
 ISR_aerospace_industries_focus_desc: "A Israel Aerospace Industries é a principal fabricante aeroespacial e de aviação de Israel, produzindo sistemas aéreos e astronáuticos para uso militar e civil."
 ISR_ilan_ramon: "Voo de Ilan Ramon"
 ISR_ilan_ramon_desc: "Ilan Ramon é um piloto de caça israelense e o primeiro astronauta israelense. Ele será o primeiro israelense no espaço. Vamos torcer para que tudo corra bem."
 ISR_air_defence_pact: "O Pacto de Defesa Aérea"
 ISR_spaceil: "Formar a SpaceIL"
 ISR_spaceil_desc: "A SpaceIL é uma organização sem fins lucrativos que atua para promover a ciência e a educação científica. No entanto, a SpaceIL planeja lançar diversas espaçonaves ao espaço e até potencialmente pousar na Lua."
 ISR_bereshit: "Lançar a Sonda Gênesis"
 ISR_bereshit_desc: "Devemos tentar lançar a Beresheet1 para que chegue à Lua e estabeleça um novo ponto de partida para a SpaceIL!"
 ISR_project_samson: "Projeto SANSÃO"
 ISR_project_samson_desc: "A Opção Sansão é a estratégia de dissuasão de Israel de retaliação maciça com armas nucleares como último recurso contra um país cujas forças armadas tenham invadido ou destruído grande parte de Israel."
 ISR_ofek_satellites: "Preparar o Ofeq"
 ISR_ofek_satellites_desc: "Ofeq é a designação de uma série de satélites de reconhecimento israelenses. A maioria dos satélites Ofeq foi lançada no topo de veículos lançadores Shavit a partir da Base Aérea de Palmachim, em Israel, na costa do Mediterrâneo. Os satélites de órbita terrestre baixa completam uma órbita da Terra a cada 90 minutos."
 ISR_davids_sling: "Funda de Davi"
 ISR_davids_sling_desc: "A Funda de Davi, anteriormente conhecida também como Varinha Mágica, é um sistema militar das Forças de Defesa de Israel projetado para interceptar aviões inimigos, drones, mísseis balísticos táticos, foguetes de médio a longo alcance e mísseis de cruzeiro."
 ISR_magic_wand: "A Varinha Mágica"
 ISR_magic_wand_desc: "A Varinha Mágica é o nome do protótipo de míssil que será a base do futuro projeto Funda de Davi."
 ISR_jericho_missile: "Modernizar os Jericós"
 ISR_jericho_missile_desc: "Jericó é uma designação geral dada a uma família vagamente relacionada de mísseis balísticos implantados, desenvolvidos por Israel desde a década de 1960."
 ISR_arrow: "Testar os Arrows"
 ISR_arrow_desc: "O Arrow ou Hetz é uma família de mísseis antibalísticos projetados para atender a uma exigência israelense de um sistema de defesa antimíssil mais eficaz contra mísseis balísticos do que o míssil superfície-ar MIM-104 Patriot."
 ISR_iron_dome: "Uma Cúpula de Ferro"
 ISR_iron_dome_desc: "A Cúpula de Ferro é um sistema de defesa aérea móvel israelense para todas as condições climáticas, desenvolvido pela Rafael Advanced Defense Systems e pela Israel Aerospace Industries. O sistema foi projetado para interceptar e destruir foguetes de curto alcance e projéteis de artilharia disparados de distâncias de 4 a 70 quilômetros e cuja trajetória os levaria a uma área povoada de Israel."
 ISR_reconsider_lebanese_policy: "Repensar a Política Libanesa"
 ISR_reconsider_lebanese_policy_desc: "Devemos reconsiderar nossa posição sobre o Líbano e o Hezbollah e finalmente nos livrar dos nossos problemas no norte..."
 ISR_accept_the_equation: "Aceitar a Equação Dele"
 ISR_accept_the_equation_desc: "Não devemos ser diretos e atacar o Hezbollah apenas na Síria, para que a situação no Líbano não se agrave e possamos dar passos mais cautelosos..."
 ISR_reject_the_equation: "Rejeitar a Equação Dele"
 ISR_reject_the_equation_desc: "Não devemos nos curvar a regras impostas por terroristas! Atacaremos o Hezbollah diretamente para varrer esse incômodo do mapa!"
 ISR_premptive_strike_lebanon: "Mandá-los de Volta à Idade da Pedra"
 ISR_premptive_strike_lebanon_desc: "Há muito tempo suportamos a existência do Hezbollah. É hora de mandar todos eles de volta à idade da pedra!"
 ISR_sponser_insurgets_lebanon: "A Mão Silenciosa"
 ISR_sponser_insurgets_lebanon_desc: "Devemos apoiar grupos pró-Israel no Líbano para garantir nosso sucesso em uma guerra futura..."
 ISR_recon_planes_lebanon: "Mostrar as Nossas Caras"
 ISR_recon_planes_lebanon_desc: "Colocar nossos aviões de reconhecimento sobre o Líbano nos permitirá tirar proveito do espaço aéreo deles."
 ISR_northern_shield: "Operação Escudo do Norte"
 ISR_northern_shield_desc: "O Hezbollah tem cavado túneis profundos para infiltrar nossa fronteira quando chegar a hora. Devemos impedir isso."
 ISR_fortify_har_dov: "Fortificar Har Dov"
 ISR_fortify_har_dov_desc: "Devemos fortificar nossa fronteira com o Hezbollah e estar preparados para uma guerra total."
 ISR_prepare_radwan: "Proteger a Galileia"
 ISR_prepare_radwan_desc: "Devemos infiltrar as Forças Radwan e piorar sua organização."
 ISR_hold_him_accountable: "Responsabilizá-lo"
 ISR_hold_him_accountable_desc: "O Hamas está pedindo ao Hezbollah que sedie seus ataques de mísseis contra nós. Devemos responsabilizá-los por isso."
 ISR_speak_to_cabinet: "Reunir-se com o Gabinete"
 ISR_speak_to_cabinet_desc: "Nosso país tem muitos problemas relacionados à Palestina e ao Hezbollah. Precisamos convocar uma reunião de emergência do gabinete para discutir um possível plano de ação."
 ISR_intifada_darkest_hour: "BeKol Dor VaDor"
 ISR_intifada_darkest_hour_desc: "Um famoso salmo judaico de Pessach diz o seguinte: 'Em cada geração e geração, eles se levantam contra nós para nos exterminar, e Deus nos salva das mãos deles.' Com ônibus explodindo em todas as grandes cidades e centenas de israelenses mortos, esta é apenas a próxima geração se levantando contra o Povo Judeu. Vamos garantir que seja a última."
 ISR_rely_on_shabac: "Confiar no Shabac"
 ISR_rely_on_shabac_desc: "O Shabac é uma das três principais organizações da comunidade de inteligência israelense, ao lado da Aman e do Mossad."
 ISR_rely_on_8200: "Confiar na ISNU"
 ISR_rely_on_8200_desc: "A Unidade 8200 é uma unidade do Corpo de Inteligência das Forças de Defesa de Israel responsável por operações clandestinas, coleta de inteligência de sinais e decifração de códigos, contrainteligência, guerra cibernética, inteligência militar e vigilância."
 ISR_establish_tzamams: "Estabelecer os Tzamams"
 ISR_establish_tzamams_desc: "Devemos estabelecer os tzamams para fazer nossos serviços de inteligência cooperarem e coordenarem suas ações."
 ISR_recover_josephs_tomb: "O Destino do Túmulo de José"
 ISR_recover_josephs_tomb_desc: "Devemos decidir se permitiremos ou não que judeus continuem indo em veículos blindados ao túmulo de José em Nablus."
 ISR_operation_noahs_ark: "Apreender as Arcas de Noé"
 ISR_operation_noahs_ark_desc: "O Irã armou um plano para entregar armas à Palestina por navio. Devemos impedir isso preventivamente."
 ISR_operation_defensive_shield: "Operação Homat Mahgehn"
 ISR_operation_defensive_shield_desc: "Devemos entrar novamente na Cisjordânia e extirpar a ameaça terrorista por conta própria. Arafat escolheu não nos ajudar."
 ISR_operation_city_wall: "Operação Irr Homa"
 ISR_operation_city_wall_desc: "A Palestina concordou em conduzir a operação antiterrorista por conta própria, apenas com simples assistência nossa. Vamos ver como vai..."
 ISR_nohal_shakhen: "Procedimento do Vizinho"
 ISR_nohal_shakhen_desc: "O procedimento do vizinho ocorre quando, durante uma missão de prisão, ordena-se a um vizinho que deixe sua casa, entre na casa onde se acredita que o procurado esteja e chame todos que estão lá dentro para sair."
 ISR_refuse_nohal: "Rejeitar o Procedimento"
 ISR_refuse_nohal_desc: "Devemos rejeitar quaisquer procedimentos desumanos, mesmo que estejamos lidando com terroristas."
 ISR_disentanglement_plan: "O Plano de Desembaraço"
 ISR_disengagement_plan: "O Plano de Desengajamento"
 ISR_disengagement_plan_desc: "Os assentamentos israelenses na Faixa de Gaza e quatro assentamentos israelenses na Cisjordânia serão desmantelados unilateralmente. Colonos e o exército israelenses serão evacuados do interior da Faixa de Gaza, reposicionando as forças militares ao longo da fronteira."
 ISR_economic_borders: "Fronteiras da Prosperidade"
 ISR_economic_borders_desc: "Devemos criar fronteiras econômicas entre nós e a Palestina, fomentando o comércio e os investimentos mútuos."
 ISR_construct_the_wall_settlements: "Incluir os Assentamentos"
 ISR_construct_the_wall_settlements_desc: "Devemos construir o muro ao redor da Cisjordânia, mas devemos incluir também os nossos assentamentos."
 ISR_construct_the_wall_no_settlements: "Construir a Barreira da Cisjordânia"
 ISR_construct_the_wall_no_settlements_desc: "Não devemos abandonar os assentamentos, mas o muro deve separar nosso território continental da Palestina de jure e da Cisjordânia."
 ISR_propose_hudna: "Propor uma Hudna"
 ISR_propose_hudna_desc: "E se, antes de bloquear economicamente a Faixa de Gaza, oferecermos a eles uma boa proposta, recheada de dinheiro, para a prosperidade futura de Gaza. Talvez funcione... talvez."
 ISR_blockade_gaza: "Estabelecer uma Quarentena"
 ISR_blockade_gaza_desc: "Devemos bloquear a Faixa de Gaza para garantir que os terroristas não consigam cruzar nossa fronteira. Devemos sitiar Gaza e nos preparar para confrontos futuros..."
 ISR_gaza_uprising: "A Revolta de Gaza"
 ISR_gaza_uprising_desc: "Radicais tomaram Gaza. Devemos agir agora."
 ISR_question_gazan_workers: "Mão de Obra Barata de Gaza"
 ISR_question_gazan_workers_desc: "Devemos incentivar a mão de obra barata de Gaza a trabalhar em Israel e não trazer benefício ao governo radical na Faixa de Gaza."
 ISR_ships_not_pass: "Os Navios Não Passarão"
 ISR_ships_not_pass_desc: "Nenhum navio estrangeiro passará para a Faixa de Gaza. Devemos abordar seis navios civis da Flotilha da Liberdade de Gaza, que abastece os terroristas de Gaza."
 ISR_egypt_joint_blockade: "Negociar com o Egito"
 ISR_egypt_joint_blockade_desc: "Talvez devêssemos tentar convencer o Egito a bloquear a Faixa de Gaza junto conosco."
 ISR_limit_fishing_rights: "Limitar a Zona de Pesca de Gaza"
 ISR_limit_fishing_rights_desc: "Devemos limitar a zona de pesca de Gaza para reforçar o bloqueio."
 ISR_qatari_dollars_yes: "Trazer as Malas de Dinheiro dos Patrocinadores"
 ISR_qatari_dollars_yes_desc: "Devemos permitir que os patrocinadores dos terroristas de Gaza enviem salários a eles em troca de um breve cessar-fogo."
 ISR_qatari_dollars_no: "Esnobar Doha"
 ISR_qatari_dollars_no_desc: "Não devemos permitir que nenhum dinheiro flua para Gaza. Pelo menos não mais do que conseguirmos impedir."
 ISR_saudi_donations: "Aceitar a Proposta Saudita"
 ISR_emirati_donations: "Aceitar a Proposta Emirática"
 ISR_gazan_casinos: "A Proposta Aleman"
 ISR_gazan_casinos_desc: "Devemos tentar construir uma nova Las Vegas na Faixa de Gaza. Que a receita flua e a cidade prospere..."
 ISR_gazan_port: "Desenvolver o Porto de Gaza"
 ISR_gazan_port_desc: "Como uma das primeiras etapas do novo plano de desenvolvimento de Gaza, devemos construir um novo porto em Gaza."
 ISR_gazan_airport: "Construir um Aeroporto em Gaza"
 ISR_gazan_airport_desc: "Para preparar Gaza para o novo afluxo de turistas, devemos criar um novo aeroporto em Gaza."
 ISR_little_singapore: "Uma Pequena Singapura"
 ISR_little_singapore_desc: "Gaza se tornará a nova pequena Singapura do Oriente Médio."
 ISR_shalit_agreement: "Trazer Nosso Garoto para Casa"
 ISR_shalit_agreement_desc: "Devemos discutir uma proposta sobre um prisioneiro israelense mantido refém pelo governo de Gaza..."
 ISR_jericho_walls: "Derrubar as Muralhas de Jericó"
 ISR_jericho_walls_desc: "Devemos derrubar as muralhas de Jericó e entrar em Gaza, para acabar com esse incômodo de uma vez por todas..."
 ISR_operation_sea_of_mercy: "Operação Yam HaRakhamim"
 ISR_operation_sea_of_mercy_desc: "Nossa paciência foi testada por tempo demais. A hora chegou."
 ISR_jenin_situation: "Operação Shover Galim"
 ISR_jenin_situation_desc: "Estamos iniciando uma operação contra infraestruturas terroristas na Cisjordânia e o governo nos concedeu plena autoridade e permissões para usar tudo de que precisarmos."
 ISR_daniel_lions_cage: "Daniel na Cova dos Leões"
 ISR_daniel_lions_cage_desc: "A Palestina tem sido um incômodo para nós por tempo demais. Chegou a hora de lidar com isso finalmente, de uma vez por todas."
 ISR_tear_down_oslo: "Anular os Acordos de Oslo"
 ISR_tear_down_oslo_desc: "Os Acordos de Oslo são apenas amarras em nossas mãos para frear o nosso poder! Devemos denunciar esse acordo estúpido e iniciar ações de força!"
 ISR_disarm_the_palestinian_forces: "Desarmar a Autoridade do Fatah"
 ISR_disarm_the_palestinian_forces_desc: "Devemos finalmente entrar na Cisjordânia, desarmar a Autoridade Nacional Palestina e pôr fim a essa história."
 ISR_strangle_jenin: "Estrangular Jenin"
 ISR_strangle_jenin_desc: "Devemos estar preparados para realizar uma operação limitada na Cisjordânia, com nossas forças armadas como principal ator."
 ISR_restore_palestinian_authority: "Restaurar a Ordem na Cisjordânia"
 ISR_restore_palestinian_authority_desc: "Devemos seguir o direito internacional e restaurar a ordem na Cisjordânia."
 ISR_arm_their_security_services: "Armar os Serviços de Segurança Palestinos"
 ISR_arm_their_security_services_desc: "A Palestina concordou em cooperar conosco no esforço antiterrorista. Agora devemos armar seus serviços de segurança para conduzir uma operação conjunta."
 ISR_restart_negotiations: "Legitimar o Fatah"
 ISR_restart_negotiations_desc: "Devemos legitimar e apoiar o Fatah, pois é o único governo cooperativo da Palestina."
 ISR_deligitimize_abbas: "Propaganda Anti-Abbas"
 ISR_deligitimize_abbas_desc: "Devemos deslegitimar Mahmoud Abbas e iniciar uma campanha de propaganda contra ele."
 ISR_deal_with_nablus: "Sitiar Nablus"
 ISR_deal_with_nablus_desc: "Jihadistas palestinos controlam a Casbá de Nablus; devemos tentar invadi-la e capturar os terroristas."
 ISR_focus_on_the_clusters: "Focar nos Blocos"
 ISR_focus_on_the_clusters_desc: "Devemos apoiar a solução de dois Estados e focar nos blocos de assentamentos."
 ISR_the_enclave_settlements: "A Lei de Regularização"
 ISR_the_enclave_settlements_desc: "Devemos focar nos assentamentos mais isolados na Cisjordânia, adotando meios mais duros de apoio aos assentamentos."
 ISR_yesha_council: "Formar o Conselho Yesha"
 ISR_yesha_council_desc: "O Conselho Yesha é uma organização guarda-chuva de conselhos municipais de assentamentos judaicos na Cisjordânia, conhecida pelo acrônimo hebraico Yesha."
 ISR_settlement_amona: "Legalizar Amona"
 ISR_settlement_amona_desc: "Devemos decidir o que fazer com a questão da privatização das terras de Amona."
 ISR_settlement_evyatar: "Defender Eviatar"
 ISR_settlement_evyatar_desc: "O Ministério da Segurança e os colonos negociam sobre Eviatar; precisamos assumir uma posição e talvez resolver a questão."
 ISR_settlement_homesh: "Proteger a Yeshiva de Homesh"
 ISR_settlement_homesh_desc: "Agora devemos decidir o que fazer com a Yeshiva de Homesh."
 ISR_samarian_wine: "Vinho de Samaria"
 ISR_samarian_wine_desc: "Shomron é a maior região vinícola de Israel, composta pelas áreas costeiras ao sul do porto de Haifa, incluindo a Planície de Sharon, o Monte Carmelo e Ramat Menashe."
 ISR_expand_gush_etzion: "Expandir Gush Etzion"
 ISR_expand_gush_etzion_desc: "Gush Etzion é um conjunto de assentamentos israelenses localizado nas Montanhas da Judeia, diretamente ao sul de Jerusalém e Belém, na Cisjordânia."
 ISR_ariel_industrial_zone: "Zonas Industriais de Ariel"
 ISR_ariel_industrial_zone_desc: "Ariel é um assentamento israelense organizado como conselho municipal no centro da Cisjordânia, parte dos territórios ocupados por Israel, a aproximadamente 20 quilômetros a leste da Linha Verde e 34 quilômetros a oeste da fronteira com a Jordânia."
 ISR_edumim_tourist_mall_center: "Cidade do Design de Ma'ale Adumim"
 ISR_edumim_tourist_mall_center_desc: "Ma'ale Adumim é um assentamento urbano israelense organizado como conselho municipal na Cisjordânia, sete quilômetros a leste de Jerusalém."
 ISR_support_our_pmcs: "Apoiar Nossas EMPs"
 ISR_support_our_pmcs_desc: "As EMPs já provaram sua praticidade e utilidade em todo o mundo. Precisamos criar nossas próprias EMPs para defesa e guerra por procuração contra nossos adversários."
 ISR_keep_them_checked: "Manter as EMPs sob Controle"
 ISR_keep_them_checked_desc: "Estamos felizes em ter nossas próprias empresas militares privadas, mas é necessário mantê-las cuidadosamente sob controle para evitar rebelião e desordem nas forças armadas."
 ISR_jewish_outer_heaven: "Outer Heaven Judaico"
 ISR_jewish_outer_heaven_desc: "Controlar nossas EMPs só agravará a posição delas. Ao acompanhá-las, as tornaremos menos independentes, o que significa que perderão sua eficácia."
 ISR_tavor: "TAR-21"
 ISR_tavor_desc: "O TAR-21 é um modelo de fuzil de assalto israelense moderno, de 5,56x45 mm, fabricado pela Israel Weapon Industries."
 ISR_IWI_com: "IWI"
 ISR_IWI_com_desc: "A IWI é uma empresa privada israelense especializada no desenvolvimento, produção e venda de armamentos. A empresa foi formada após a privatização da fábrica Magen, que pertencia à estatal Israel Military Industries. Os principais consumidores de seus produtos são os serviços de inteligência israelenses e as Forças de Defesa de Israel."
 ISR_fab_defense: "FAB-Defense"
 ISR_fab_defense_desc: "A empresa israelense FAB-Defense desenvolve e fabrica acessórios e personalização para armas leves há 50 anos e atualmente ocupa uma posição de liderança na arena internacional. Ao desenvolver seus produtos, os engenheiros da empresa utilizam ativamente a experiência e os desejos das agências de segurança pública israelenses, como a polícia e o exército, além de trabalhar em estreita cooperação com unidades SWAT em todo o mundo."
 ISR_ak_alfa: "Projeto AK-Alfa"
 ISR_ak_alfa_desc: "Por meio da cooperação com o Consórcio Kalashnikov, podemos criar novas armas para o nosso exército, além de aprender com a experiência russa no desenvolvimento de armamentos."
 ISR_gideon_plan_idea: "Plano Gideão"
 ISR_tenufa_project_idea: "Projeto Tenufa"
 ISR_paphos_drills_1: "Jogos de Guerra de Pafos"
 ISR_civillian_exports: "Exportações Civis"
 ISR_civillian_exports_desc: "Precisamos exportar parte de nosso armamento para o mercado civil. Isso nos trará muita receita no longo prazo."
 civ_guns_exports: "Exportações de Armas Civis"
 ISR_Labour: "O Avoda"
 ISR_barak_tree: "Ehud Barak"
 ISR_dawn_of_a_new_day: "Alvorecer de um Novo Dia"
 ISR_dawn_of_a_new_day_desc: "O novo milênio começou e devemos lidar com os problemas do passado para ver o que o futuro nos reserva. Ocupamos o Sul do Líbano há algum tempo; agora devemos decidir o destino dessa iniciativa."
 ISR_south_lebanon_repatriation_act: "Lei de Repatriação dos Soldados do Líbano"
 ISR_south_lebanon_repatriation_act_desc: "Como temos alguma influência sobre a França e o Líbano é uma antiga colônia francesa, podemos fazer os soldados libaneses se mudarem para lá."
 ISR_south_lebanon_fighters_act: "Lei dos Combatentes do Sul do Líbano"
 ISR_south_lebanon_fighters_act_desc: "Devemos dar aos cristãos libaneses a possibilidade de migrar para Israel caso temam perseguição em caso de tomada do poder pelo Hezbollah."
 ISR_herzog_declaration: "A Declaração Herzog"
 ISR_herzog_declaration_desc: "Nosso governo deve iniciar negociações no Knesset sobre a retirada das tropas do Sul do Líbano. Isso nos dará algum tempo para acalmar o público."
 ISR_abandon_ansar_prison: "O Destino da Prisão de Ansar"
 ISR_abandon_ansar_prison_desc: "A Prisão de Ansar está cheia de soldados e terroristas do Hezbollah que capturamos nos anos 90. Devemos decidir o que fazer com ela."
 ISR_withdraw_from_the_security_belt: "Trazer Nossos Rapazes para Casa"
 ISR_withdraw_from_the_security_belt_desc: "Devemos trazer nossas tropas de volta para casa e atender à exigência da nossa população."
 ISR_camp_david_2000: "Reunião em Camp David"
 ISR_camp_david_2000_desc: "Os líderes da Palestina, de Israel e dos EUA concordaram em se reunir em Camp David para discutir a possibilidade de um acordo de paz completo."
 ISR_talk_to_sharon: "Chamar Sharon à Razão"
 ISR_talk_to_sharon_desc: "Devemos conversar com Ariel Sharon para convencê-lo a não visitar o Monte do Templo. É uma empreitada perigosa que não terá resultado positivo."
 ISR_respond_with_caution: "Responder com Cautela"
 ISR_respond_with_caution_desc: "Devemos responder à recente agitação com cautela e talvez fazer Sharon pagar por suas ações."
 ISR_dont_show_weakness: "Não Mostrar Fraqueza"
 ISR_dont_show_weakness_desc: "Não devemos mostrar fraqueza aos inimigos internos. Os protestos devem ser reprimidos!"
 ISR_get_out_of_the_recession: "Sair da Recessão"
 ISR_deris_education_reform: "Reforma Educacional de Aryeh Deri"
 ISR_sarids_education_reform: "Reforma Educacional de Yosi Sarid"
 ISR_increase_student_paychecks: "Lei do Salário dos Estudantes"
 ISR_question_armenia: "Lei de Reconhecimento e Memorial Armênio"
 ISR_toranic_school_system: "Financiar o Sistema Escolar Haláquico"
 ISR_food_security_checks: "Conceder Cheques de Segurança Alimentar"
 ISR_sephardic_history_in_education: "Os Livros Didáticos de Darwish"
 ISR_meet_with_the_committee: "Reunir-se com o Alto Comitê Árabe"
 ISR_meet_with_the_committee_desc: "Agora devemos nos reunir com o Alto Comitê Árabe e discutir os resultados da investigação."
 ISR_investigation_october_events: "Criar uma Comissão de Investigação"
 ISR_investigation_october_events_desc: "Devemos investigar quem foi o responsável por trás dos protestos e punir os policiais que agiram de forma indevida."
 ISR_2_show_hezbollah: "Leia os Nossos Lábios"
 ISR_taba_conference: "Participar da Conferência de Taba"
 ISR_taba_conference_desc: "A Conferência de Taba é uma tentativa egípcia de mediar as relações entre Israel e os palestinos para tentar reduzir as tensões"
 ISR_sharem_conference: "Aceitar o Marco de Sharm"
 ISR_the_shohat_plan: "O Plano Shohat"
 ISR_tax_the_tase: "Tributar a TASE"
 ISR_invest_in_tourism: "Aproveitar a Onda de Turistas"
 ISR_create_better_insurances: "Criar Melhores Opções de Seguro"
 ISR_rewrite_inheritance_laws: "Reescrever as Leis de Herança"
