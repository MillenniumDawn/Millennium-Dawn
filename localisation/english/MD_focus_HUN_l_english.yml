l_english:
 #Karpatalja Question
 HUN_karpatalja_question_category: "The Karpatalja Question"
 HUN_annex_karpatalja: "Answer the Call from Karpatalja"
 HUN_annex_karpatalja_desc: "Ukraine's authority in Zakarpattia has collapsed. Local Hungarian councils are asking Budapest to recognize a union, and no one is left in Kyiv to say no."
 HUN_karpatalja_ultimatum: "Ultimatum to Kyiv"
 HUN_karpatalja_ultimatum_desc: "Karpatalja's Hungarian minority has waited a century for reunion with the motherland. Kyiv should hand it over quietly, or lose it by force."
 HUN_karpatalja_integration_category: "Karpatalja Administration"
 HUN_701_return: "Return of Karpatalja"
 HUN_701_return_desc: "Karpatalja was lost at Trianon. With the province's compliance secured, we can make the reunion permanent."
 HUN_karpatalja_autonomy: "Karpatalja Administration"
 HUN_karpatalja_autonomy_desc: "Governing Karpatalja through local councils buys goodwill and speeds its integration, at the cost of a slower hand on the purse strings and public patience for the arrangement."
 HUN_ukr_cede_tt: "§YUkraine will hand over Karpatalja§!"
 HUN_ukr_refuse_tt: "§RWe will gain a war goal to take Karpatalja by force§!"

 #Events
 hungary_karpatalja.1.t: "The Councils of Karpatalja"
 hungary_karpatalja.1.d: "With Kyiv unable to project authority this far from the capital, local assemblies in Zakarpattia have voted to seek union with Hungary. Budapest is only too willing to oblige."
 hungary_karpatalja.1.a: "Welcome them home"
 hungary_karpatalja.2.t: "Governing Karpatalja"
 hungary_karpatalja.2.d: "Karpatalja is Hungarian on the map. Turning that into a functioning administration is another matter, and the government must decide how heavy a hand to use."
 hungary_karpatalja.2.a: "Rule through local councils"
 hungary_karpatalja.2.b: "Direct rule from Budapest"
 hungary_karpatalja.10.t: "Budapest Demands Karpatalja"
 hungary_karpatalja.10.d: "Hungary has delivered an ultimatum: hand over Zakarpattia, or face the consequences. The government must decide how to respond."
 hungary_karpatalja.10.a: "Cede the province"
 hungary_karpatalja.10.b: "Reject the ultimatum"
 hungary_karpatalja.11.t: "Kyiv Refuses"
 hungary_karpatalja.11.d: "Ukraine has rejected our demands over Karpatalja. If we want the province, we will have to take it ourselves."
 hungary_karpatalja.11.a: "Prepare for war"
