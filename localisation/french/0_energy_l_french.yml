 toggle_nuclear_power_plant_generation_tt: "§YBasculer la production de la centrale nucléaire§!\nBasculer la production d'énergie vers la §YCentrale nucléaire§!. Nous pouvons ainsi nous concentrer uniquement sur d'autres moyens de production afin de réserver ou d'économiser du combustible nucléaire pour une utilisation future."
