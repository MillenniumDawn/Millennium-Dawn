l_english:
 AUTOMATION_SETTINGS_OPEN_TT: "Open Automation Settings"
 AUTOMATION_SETTINGS_TITLE: "Automation Settings"
 AUTOMATION_SETTINGS_DESC: "Manage recurring actions and notification preferences from one panel. Existing controls elsewhere remain available."
 AUTOMATION_SETTINGS_GENERAL_PAGE: "General"
 AUTOMATION_SETTINGS_SPACE_PAGE: "Satellites"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "Influence"
 AUTOMATION_SETTINGS_SPACE_DESC: "Configure automatic satellite production, launches, and constellation upgrades."
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "Configure recurring actions that defend our government from foreign influence."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "[!automation_space_save_button_click_enabled]Store the payload manifest staged in the Space Program as the §YCustom§! plan and switch to it."
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "[!automation_space_upgrade_button_click_enabled]Promote each constellation to the newest researched generation wherever current orbital coverage supports it."
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "Notifications and Preferences"
 AUTOMATION_SETTINGS_ECONOMY_HEADER: "Economy"
 AUTOMATION_SETTINGS_UN_HEADER: "United Nations"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "Diplomacy"
 AUTOMATION_SETTINGS_NATO_HEADER: "NATO"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "Energy"
 AUTOMATION_SETTINGS_PP_RESERVE: "Political Power Reserve"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "Automated actions that spend Political Power will wait until they can pay their cost without reducing Political Power below this reserve. Manual actions are unaffected.\n\n£click_left §YL Click§!: Adjust by §Y1§!\n£key_ctrl + £click_left §YCtrl L Click§!: Adjust by §Y10§!\n£key_shift + £click_left §YShift L Click§!: Adjust by §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §YL Click§!: Increase by §Y1§!\n£key_ctrl + £click_left §YCtrl L Click§!: Increase by §Y10§!\n£key_shift + £click_left §YShift L Click§!: Increase by §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §YL Click§!: Decrease by §Y1§!\n£key_ctrl + £click_left §YCtrl L Click§!: Decrease by §Y10§!\n£key_shift + £click_left §YShift L Click§!: Decrease by §Y100§!"

 AUTOMATION_SETTINGS_CORRUPTION: "Automatically Decline Corruption Offers"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "Skip corruption offers automatically. The events and their possible rewards will not appear while this is enabled."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "Foreign Election Notifications"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "Show news notifications about elections in other countries."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "Influence Raid Notifications"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "Show events about influence raids between other countries. Raids against us will still be reported if this is disabled."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "Monthly Auto-Influence Report"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "Show the monthly report listing countries affected by automatic influence."

 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "Automatically Accept Investment Offers"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "Accept every incoming international investment offer automatically. Enabling this disables automatic rejection."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "Automatically Reject Investment Offers"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "Reject every incoming international investment offer automatically. Enabling this disables automatic acceptance."
 AUTOMATION_SETTINGS_REINVESTMENT: "International Investment Reinvestment"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "Choose how weekly returns from international investments are divided between the treasury and reinvestment."
 AUTOMATION_SETTINGS_REINVEST_OFF: "Off"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "Send all international investment returns to the treasury."
 AUTOMATION_SETTINGS_REINVEST_FULL: "Full"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "Reinvest all international investment returns."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "Split"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "Send half of international investment returns to the treasury and reinvest the other half."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "Automatic Fuel Purchase"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "Purchase fuel immediately, then check every 28 days and purchase again whenever fuel reserves fall below 20 percent. Disable this to cancel future purchases."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "Repeat Selected Internal Investments"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "Pay £pol_power §R0.15§! Political Power daily while enabled. Right-click internal investment buttons in the state view to select the state and investment types to repeat. Selected investments are checked weekly and run while a slot is free, the treasury can pay the current cost, and the Political Power Reserve can be maintained."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "Automatically Resupply Antarctic Station"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "Automatically order fuel for our Antarctic station at 15 or fewer days remaining from November through March, or 30 or fewer days from April through October. Deliveries cost §R$0.25b per 1000 fuel§!, doubled during Antarctic winter. Orders wait until the treasury can pay the full cost."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "Automatic Consumption Policy"

 AUTOMATION_SETTINGS_SC_VOTE: "Security Council Default Vote"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "Select how we vote automatically on Security Council resolutions. Click the selected option again to return to manual voting."
 AUTOMATION_SETTINGS_GA_VOTE: "General Assembly Default Vote"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "Select how we vote automatically on General Assembly resolutions. Click the selected option again to return to manual voting."
 AUTOMATION_SETTINGS_VOTE_YES: "Yes"
 AUTOMATION_SETTINGS_VOTE_NO: "No"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "Abstain"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "Vote Yes automatically on every Security Council resolution."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "Vote No automatically on every Security Council resolution. Permanent members will cast a veto when applicable."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "Abstain automatically from every Security Council resolution."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "Vote Yes automatically on every General Assembly resolution."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "Vote No automatically on every General Assembly resolution."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "Abstain automatically from every General Assembly resolution."

 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "Block AI Satellite Access Offers"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "Prevent AI countries from offering shared access to their military and civilian satellite systems. Human players can still send offers."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "Automatically Ratify NATO Accessions"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "Automatically spend £pol_power §Y20§! to ratify each NATO accession candidate. Ratification waits until the Political Power Reserve can be maintained."

 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "Influence Defense"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "Automatically Combat Foreign Influence"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "Pay £pol_power §R0.05§! Political Power daily while enabled. When available, automatically spend £pol_power §Y100§! to increase Domestic Independence by §G2.5%§!. Repeats after 100 days. Automation pauses while the government is being lobbied or when either cost would reduce Political Power below the reserve."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "Automatically Attack Foreign Influencers"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "Pay £pol_power §R0.05§! Political Power daily while enabled. Automatically spend £pol_power §Y125§! to begin a 60-day campaign against the strongest eligible foreign influencer. Only one campaign runs at a time. Ineligible, lobbied, and cooling-down targets are skipped. Automation pauses when either cost would reduce Political Power below the reserve."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "Each enabled option costs £pol_power §R0.05§! daily. Both options together cost £pol_power §R0.10§! daily."
