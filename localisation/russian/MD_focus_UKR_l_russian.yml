 ukr_modernize_sov_equipment_s75_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s75_for_tooltip\n\n\n\n\n\n\n\n\n§WС 1997 года наши полки §YС-75 «Двина»§! в Стрые, Ковеле, Умани, Светловодске, Донецке, Запорожье и Евпатории уступают место более новым системам. §Y[EGY.GetNameWithFlag]§!, §Y[LBA.GetNameWithFlag]§! и страны Кавказа всё ещё используют этот тип.\n------------------\nКаждая продажа отнимает §R1§! уровень ПВО у области, где стоит полк. Продажа стране §Y[LBA.GetNameWithFlag]§! §Rразозлит НАТО§!.§!"
