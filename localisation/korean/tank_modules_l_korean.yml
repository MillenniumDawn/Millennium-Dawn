 afv_gasoline_engine_gen1: "2차대전 이후 가솔린 엔진"
 afv_gasoline_engine_gen1_desc: "중형 가솔린 엔진 또는 소형 차량을 움직일 수 있을 만큼 충분한 출력을 갖춘 여러 개의 소형 엔진 세트."
 afv_gasoline_engine_gen2: "냉전 초기 가솔린 엔진"
 afv_gasoline_engine_gen2_desc: "경차용 가솔린 엔진의 개선되고 강력한 버전"
 afv_gasoline_engine_gen3: "냉전 후기 가솔린 엔진"
 afv_gasoline_engine_gen3_desc: "현대에서는 보기 드문 결정인 이 매우 효과적인 엔진은 경자동차가 적절한 속도로 이동할 수 있도록 도와줍니다."
 tank_small_medium_cannon_4: "최첨단 경전차포"
 tank_small_medium_cannon_4_desc: "포구 속도가 증가하고 주력 전차포의 요소가 도입된 미래의 경전차포는 전장의 거의 모든 위협에 대응할 수 있을 것입니다.\n\n§G설계 힌트: 저구경 포는 포구 속도가 낮아 고폭탄에 적합합니다. 대물 공격보다 대인 공격을 우선시하려면 사용하십시오.§!"
 tank_medium_cannon_4: "최첨단 중형 전차포"
 tank_medium_cannon_4_desc: "전열 화학 추진(ETC) 기술이 추가됨에 따라, 포신 전체 길이를 통해 탄자가 가속되므로 미래의 전차포는 믿을 수 없을 정도로 높은 포구 속도를 가질 수 있을 것입니다.\n\n§G설계 힌트: 중형 구경 포는 균형 잡힌 전차포입니다. 대인 공격이나 대물 공격 둘 다 선호하지 않는 경우 사용하십시오.§!"
 tank_large_cannon_3: "발전된 중전차포"
 tank_large_cannon_3_desc: "개선된 설계를 통해, 발전된 중전차포에서 발사되는 탄약은 기갑 차량과 보병 모두에게 효과적인 타격을 입힙니다.\n\n§G설계 힌트: 중전차포는 주로 대전차 임무에 사용됩니다. 약간의 대인 공격 능력을 유지하면서도 대물 공격을 선호할 경우 사용하십시오.§!"
 tank_very_large_cannon_3: "발전된 초중전차포"
 tank_very_large_cannon_3_desc: "전자기 가속 보조 장치가 추가되어, 초중전차포는 탄자를 통해 장갑은 물론 건물과 벙커까지 관통할 수 있습니다.\n\n§G설계 힌트: 초중전차포는 대전차 임무에 사용됩니다. 대인 공격보다 대물 공격을 압도적으로 선호할 경우 사용하십시오.§!"
 art_small_gun_gen3: "현대 경곡사포"
 art_small_gun_gen3_desc: "A barrel manufactured to be fired from a lighter vehicle, prepared for quickly firing multiple shots with minimal downtime and with an effective recoil dampening system."
 art_small_gun_gen4: "발전된 경곡사포"
 art_small_gun_gen4_desc: "경포 개념을 현대화하여 신속하게 발사할 수 있고, 재배치 시 플랫폼 속도를 늦추지 않을 만큼 가벼워진 이동식 포병 체계입니다."
 art_small_gun_gen5: "최첨단 경곡사포"
 art_small_gun_gen5_desc: "우리 제조 업체가 생산할 수 있는 최고의 제품인 이 이동식 포병은 모든 목표 지역에 포탄을 쏟아부을 것입니다."
 art_med_gun_gen1: "냉전 초기 곡사포"
 art_med_gun_gen1_desc: "제2차 세계 대전 당시의 중형 곡사포를 궤도형 플랫폼에서 운용할 수 있도록 최소한으로 개조한 형태입니다. 발사 시 충격이 매우 크므로 차량 근처에 서 있는 것은 권장하지 않습니다."
 art_med_gun_gen2: "냉전기 곡사포"
 art_med_gun_gen2_desc: "궤도형 차량에서 운용하기 위해 밀폐된 포탑 체계로 개조된 제2차 세계 대전 시대의 중형 곡사포입니다. 화력과 기동성 사이에서 적절한 균형을 이루고 있으며, 차체 후면에 주퇴용 삽날(Plow)을 갖추어 안정적인 사격이 가능합니다."
 art_med_gun_gen3: "현대 곡사포"
 art_med_gun_gen3_desc: "현대 군대의 요구 사항에 맞춰 특별히 설계된 중형 포병 체계입니다. 이동성과 신뢰성, 그리고 강력한 화력을 완벽하게 결합했습니다."
 art_med_gun_gen4: "발전된 곡사포"
 art_med_gun_gen4_desc: "현대군을 위한 중형 포병 체계로, 포의 구동 메커니즘을 개선하여 목표물에 더 치명적인 피해를 입힐 수 있는 고성능 탄약을 운용할 수 있습니다."
 art_med_gun_gen5: "최첨단 곡사포"
 art_med_gun_gen5_desc: "중형 포병 체계의 정점입니다. 이 포가 발사되는 지역은 그저 먼지와 흙더미로 변하게 될 것입니다."
 art_big_gun_gen3: "현대 곡사포"
 art_big_gun_gen4: "향상된 곡사포"
 art_big_gun_gen3_desc: "적의 위치에 가장 무거운 포탄을 발사할 준비가 된 장거리 포병포입니다. 반동 완화 기능이 향상되었지만 구경이 크기 때문에 여전히 발사 속도가 느립니다."
 art_big_gun_gen5: "Cutting-Edge Howitzer"
 art_big_gun_gen5_desc: "완벽한 중포신과 발사 메커니즘을 통해 실제로 목표물을 파괴해야 할 때 매우 효과적인 중장거리 포병이 개발됩니다."
 art_med_rocket_gen1: "냉전 초기 중형 MLRS"
 art_med_rocket_gen1_desc: "초기 200-300mm 로켓은 일반적으로 수정된 100-200mm 플랫폼에서 발사되며, 발사관 수는 적지만 전반적으로 폭발력과 파편화력이 더 높습니다."
 art_med_rocket_gen2: "냉전기 중형 MLRS"
 art_med_rocket_gen2_desc: "중형 로켓용 발사기 시스템 개발을 통해 플랫폼의 전반적인 효율성과 비용 절감을 실현했습니다. 향상된 사거리와 다양한 탄두 및 로켓 호환성을 갖추어 다양한 사격 임무에 적합하며, 광범위한 지역의 표적과 교전하는 데 사용됩니다."
 art_med_rocket_gen3: "현대 중형 MLRS"
 art_med_rocket_gen3_desc: "Modernization of launchers and their systems has led to medium-sized MLRS that can be used in a far greater range with increased accuracy thanks to better rockets and warheads prepared to engage targets at medium to long ranges."
 art_med_rocket_gen4: "발전된 중형 MLRS"
 art_med_rocket_gen4_desc: "발사관 수를 늘린 대형화된 중형 MLRS 시스템과 더 큰 탄두를 조합하여, 시스템의 효율성을 유지하면서도 최대한의 피해를 입히도록 설계되었습니다."
 art_med_rocket_gen5: "미래 중형 MLRS"
 art_med_rocket_gen5_desc: "중형 MLRS는 동시에 여러 종류의 로켓을 발사할 수 있습니다. 이 발사대는 평소보다 훨씬 빠르게 재장전할 수 있어, 여러 대의 플랫폼을 배치할 필요 없이 지속적인 화력을 투사할 수 있습니다."
 direct_fire_conversion: "직접 사격 모듈"
 direct_fire_conversion_desc: "By giving the gun more gun depression, the artillery piece can be used in direct fire mode for emergencies. This will allow easier engagement of hard targets, but allowing more options for direct fire will compromise some of the indirect fire abilities of the artillery."
 direct_fire_conversion_medium: "직접 사격 모듈"
 direct_fire_conversion_medium_desc: "By giving the gun more gun depression, the artillery piece can be used in direct fire mode for emergencies. This will allow easier engagement of hard targets, but allowing more options for direct fire will compromise some of the indirect fire abilities of the artillery."
 mortar_barrel_conversion_small: "경 박격포대"
 mortar_barrel_conversion_small_desc: "곡사포를 비슷한 크기의 박격포로 교체하면 포병의 발사 속도와 탄도를 향상시킬 수 있습니다. 그러나 장거리 공격을 지원하는 능력은 더욱 제한됩니다."
 mortar_barrel_conversion: "중 박격포대"
 mortar_barrel_conversion_desc: "곡사포를 비슷한 크기의 박격포로 교체하면 포병의 발사 속도와 탄도를 향상시킬 수 있습니다. 그러나 장거리 공격을 지원하는 능력은 더욱 제한됩니다."
 gun_barrel_conversion: "포신"
 gun_barrel_conversion_desc: "표준 곡사포보다 긴 포신을 사용하여 앙각은 낮아졌지만, 작전상의 한계를 감수하면서도 명중률을 높였으며 중거리 교전에 적합합니다."
 thermobaric_ammo_conversion: "열압력탄"
 thermobaric_ammo_conversion_desc: "열압력 로켓은 매우 파괴적인 대보병 무기입니다. 로켓이 목표물에 도달하면 작은 1차 폭발을 통해 기화된 연료 구름을 생성합니다. 이어지는 2차 폭발로 연료가 점화되어 거대한 불덩어리가 형성됩니다. 이 폭발은 주변의 모든 산소를 소진시키며, 인체를 증발시킬 정도로 강력한 고열을 발생시킵니다."
 thermobaric_ammo_conversion_small: "열압력탄"
 thermobaric_ammo_conversion_small_desc: "열압력 로켓은 매우 파괴적인 대보병 무기입니다. 로켓이 목표물에 도달하면 작은 1차 폭발을 통해 기화된 연료 구름을 생성합니다. 이어지는 2차 폭발로 연료가 점화되어 거대한 불덩어리가 형성됩니다. 이 폭발은 주변의 모든 산소를 소진시키며, 인체를 증발시킬 정도로 강력한 고열을 발생시킵니다."
 double_caliber_ammo_conversion: "다중 구경 로켓"
 double_caliber_ammo_conversion_desc: "동일한 발사기에서 여러 구경의 탄약을 발사할 수 있도록 로켓 발사기를 조정하면 전장에서 더 많은 유연성을 얻을 수 있습니다. 하지만 이렇게 하면 두 배의 탄약을 운반해야 하므로 전진 속도가 느려질 것입니다."
 burst_fire_gun_medium_gen1: "초기 점사 발사 모드"
 burst_fire_gun_medium_gen1_desc: "첨단 표적 컴퓨터와 자동 장전 장치를 갖춘 포병은 동일한 표적에 여러 발의 포탄을 빠르게 연속해서 발사하여 제압 효과를 극대화할 수 있습니다."
 burst_fire_gun_medium_gen2: "개선된 점사 발사 모드"
 burst_fire_gun_medium_gen2_desc: "첨단 표적 컴퓨터와 자동 장전 장치를 갖춘 포병은 동일한 표적에 여러 발의 포탄을 빠르게 연속해서 발사하여 제압 효과를 극대화할 수 있습니다."
 burst_fire_gun_medium_gen3: "발전된 점사 발사 모드"
 burst_fire_gun_medium_gen3_desc: "첨단 표적 컴퓨터와 자동 장전 장치를 갖춘 포병은 동일한 표적에 여러 발의 포탄을 빠르게 연속해서 발사하여 제압 효과를 극대화할 수 있습니다."
 multiple_rounds_medium_gen1: "초기 다중 타격 모드"
 multiple_rounds_medium_gen1_desc: "서로 다른 추진제 충전량과 발사 각도를 사용하여 여러 포탄을 연속으로 발사함으로써, 발사된 모든 포탄이 목표물에 동시에 탄착하도록 할 수 있습니다. 이를 위해서는 고도로 숙련된 승무원과 첨단 표적 컴퓨터가 필요합니다."
 multiple_rounds_medium_gen2: "개선된 다중 타격 모드"
 multiple_rounds_medium_gen2_desc: "서로 다른 추진제 충전량과 발사 각도를 사용하여 여러 포탄을 연속으로 발사함으로써, 발사된 모든 포탄이 목표물에 동시에 탄착하도록 할 수 있습니다. 이를 위해서는 고도로 숙련된 승무원과 첨단 표적 컴퓨터가 필요합니다."
 multiple_rounds_medium_gen3: "발전된 다중 타격 모드"
 multiple_rounds_medium_gen3_desc: "서로 다른 추진제 충전량과 발사 각도를 사용하여 여러 포탄을 연속으로 발사함으로써, 발사된 모든 포탄이 목표물에 동시에 탄착하도록 할 수 있습니다. 이를 위해서는 고도로 숙련된 승무원과 첨단 표적 컴퓨터가 필요합니다."
 tank_steel_armor_gen3: "발전된 강철 장갑"
 tank_steel_armor_gen3_desc: "강철 합금에 추가적인 원소들을 포함하여 파괴 및 피로에 대한 강도를 높였습니다.\n\n§G설계 힌트: 강철 장갑은 전차를 위한 저예산 장갑 옵션입니다. 현대적인 복합 장갑을 견뎌내지는 못할 것입니다.§!"
 spaced_armor_gen3: "현대 공간장갑"
 spaced_armor_gen3_desc: "추가적인 세라믹 판과 특수 형상을 적용하여 차량의 전반적인 방어력을 향상시킵니다.\n\n§G설계 힌트: 공간장갑은 전차에 더 많은 보호를 제공하기 위한 폭발반응장갑(ERA)의 보급형 버전입니다.§!"
 afv_machine_gun: "2차 대전기 이후 중기관총"
 afv_machine_gun_desc: "제2차 세계 대전 당시의 신뢰성 높은 총기를 약간 개조한 형태입니다. 현재는 장갑차의 지원 화기로 사용되고 있습니다."
 afv_machine_gun_2: "냉전기 중기관총"
 afv_machine_gun_2_desc: "제2차 세계 대전 이후, 주요 국가들은 중기관총의 운용성을 개선하기 위해 조작 편의성, 정확도 향상 등 여러 가지 설계 변경을 단행했습니다."
 afv_machine_gun_3: "현대 중기관총"
 afv_machine_gun_3_desc: "소련의 해체로 인해 일부 국가들은 양보다 질을 추구할 여유가 생겼고, 이 차세대 중기관총은 바로 그러한 시대적 변화를 반영합니다."
 afv_machine_gun_4: "미래 중기관총"
 afv_machine_gun_4_desc: "플라스틱 덮개와 추적 기술을 적용한 이 중기관총은 그 어느 때보다 치명적인 성능을 자랑합니다."
 afv_assault_gun: "냉전 초기 돌격포"
 afv_assault_gun_desc: "경전차에 탑재된 포는 일반적으로 저속포이며, 낮은 반동을 대가로 대구경의 화력을 발휘합니다."
 afv_assault_gun_2: "냉전 후기 돌격포"
 afv_assault_gun_2_desc: "제2차 세계 대전 이후 설계된 모델들과 비교했을 때, 탄도가 개선되었으며 더 우수한 파편탄을 갖추었습니다."
 afv_assault_gun_3: "현대 돌격포"
 afv_assault_gun_3_desc: "현대 군사 기술이 제공하는 최고 수준인 스마트 탄약과 공중폭발탄을 사용합니다."
 afv_assault_gun_4: "최첨단 돌격포"
 afv_assault_gun_4_desc: "집속탄 타격과 고성능 벙커 파괴 능력을 갖추어, 이 돌격포로 처리하지 못할 목표는 거의 없으며 전차만이 유일한 예외일 것입니다."
 small_autocannon: "냉전 초기 기관포"
 small_autocannon_desc: "With a caliber of 20-30mm, usually just straight up a WW2 AA gun with a few modifications. Does its job well, though."
 small_autocannon_2: "냉전 후기 기관포"
 small_autocannon_2_desc: "보병은 물론 경장갑 차량까지 효과적으로 제압하기 위해 설계된 전용 기관포입니다."
 small_autocannon_3: "현대 기관포"
 small_autocannon_3_desc: "최신 기술의 집약체로, 공중폭발탄과 프로그래밍 가능한 탄약을 사용합니다."
 small_autocannon_4: "최첨단 기관포"
 small_autocannon_4_desc: "최첨단 수준의 기관포로, 그 어떤 목표물도 초토화할 수 있습니다."
 big_autocannon: "냉전 초기 중 기관포"
 big_autocannon_desc: "35mm~60mm 구경의 대구경 기관포로, 시야에 들어오는 모든 경장갑 차량을 파괴하는 것을 목표로 합니다."
 big_autocannon_2: "냉전 후기 중 기관포"
 big_autocannon_2_desc: "새로운 날개안정분리철갑탄(APFSDS)을 적용하여, 이전 모델과는 차원이 다른 위력을 발휘합니다."
 big_autocannon_3: "현대 중 기관포"
 big_autocannon_3_desc: "전장에 있는 그 어떤 장갑 차량이라도 무력화할 수 있도록 설계되었습니다."
 big_autocannon_4: "최첨단 중 기관포"
 big_autocannon_4_desc: "그 어떤 장갑이든 관통할 수 있도록 설계된 최첨단 대구경 기관포입니다."
 afv_steel_armor_gen1: "강철 장갑"
 afv_steel_armor_gen1_desc: "가장 표준적인 군용 등급 강철입니다."
 afv_steel_armor_gen2: "개선된 강철 장갑"
 afv_steel_armor_gen2_desc: "일반 강철보다 더 높은 방호력을 제공하는 압연 균질 장갑(RHA)입니다."
 afv_steel_armor_gen3: "발전된 강철 장갑"
 afv_steel_armor_gen3_desc: "나노코팅과 현대식 합금이 적용되었습니다. 사실상 더 이상 '강철'이라고 부르기 어려울 정도의 물성을 지닙니다."
 afv_alum_armor_gen1: "알루미늄 장갑"
 afv_alum_armor_gen1_desc: "경량이면서도 꽤나 내구성이 강합니다."
 afv_alum_armor_gen2: "개선된 알루미늄 장갑"
 afv_alum_armor_gen2_desc: "합금 개선을 통해 충격 및 관통 저항력을 향상했습니다."
 afv_alum_armor_gen3: "발전된 알루미늄 장갑"
 afv_alum_armor_gen3_desc: "나노코팅 및 현대 합금이 적용되었습니다. '알루미늄'은 기존 장갑 체계를 대체할 훌륭한 선택지가 될 것입니다."
 afv_composite_armor_gen1: "냉전 초기 경형 복합 장갑"
 afv_composite_armor_gen1_desc: "전차용 초기 복합 장갑의 모방품입니다."
 afv_composite_armor_gen2: "냉전기 경형 복합 장갑"
 afv_composite_armor_gen2_desc: "전차에서 이식된 복합 장갑의 개선된 버전입니다."
 afv_composite_armor_gen3: "현대 경형 복합 장갑"
 afv_composite_armor_gen3_desc: "내구성이 뛰어난 기갑 전투 차량(AFV)을 위한 현대적이고 발전된 해법입니다."
 afv_composite_armor_gen4: "발전된 경형 복합 장갑"
 afv_composite_armor_gen4_desc: "미터 단위로 측정되는 압연 균질 장갑(RHA) 환산 방어력을 가진 가장 효과적인 장갑입니다."
 afv_atgm_gen1: "냉전 초기 ATGM (대전차 유도 미사일)"
 afv_atgm_gen1_desc: "차체 외부에 탑재된 초기형 대전차 유도 미사일(ATGM) 발사기입니다."
 afv_atgm_gen2: "냉전 후기 ATGM (대전차 유도 미사일)"
 afv_atgm_gen2_desc: "발사기를 개선하여, 이제야 진정한 대전차 유도 미사일(ATGM)다운 면모를 갖추었습니다."
 afv_atgm_gen3: "현대 ATGM (대전차 유도 미사일)"
 afv_atgm_gen3_desc: "우수한 제어 시스템을 갖춘 현대적인 레이저 유도 미사일입니다."
 afv_atgm_gen4: "발전된 ATGM (대전차 유도 미사일)"
 afv_atgm_gen4_desc: "첨단 광학 장비와 복합 미사일 시스템을 갖추어, 그야말로 전차를 사냥하는 살인 병기입니다."
 afv_atgm_gen5: "미래 ATGM (대전차 유도 미사일)"
 afv_atgm_gen5_desc: "대전차 분야에서 가장 앞선 기술과 혁신을 집약한 차세대 미사일 시스템입니다."
 afv_gun_ports: "포문"
 afv_gun_ports_desc: "승무원이 차량 내부에서 직접 사격할 수 있도록 설계된 포문입니다."
 afv_mine_protection: "지뢰 방어"
 afv_mine_protection_desc: "승무원 보호를 위한 지뢰 방어용 하부 장갑입니다."
 afv_reverse_doors: "인체공학적인 병력 출입구"
 afv_reverse_doors_desc: "승무원이 안전하게 하차할 수 있도록 설계된 크고 위치 선정이 뛰어난 출입구입니다."
 afv_coax_machine_gun: "냉전 초기 동축기관총"
 afv_coax_machine_gun_desc: "동축기관총으로 장착된 제2차 세계대전 당시의 기관총입니다."
 afv_coax_machine_gun_2: "냉전 후기 동축기관총"
 afv_coax_machine_gun_2_desc: "동축기관총으로 장착된 제2차 세계대전 당시 화기의 개량형입니다."
 afv_coax_machine_gun_3: "현대 동축기관총"
 afv_coax_machine_gun_3_desc: "동축기관총으로 장착된 현대식 기관총입니다."
 afv_coax_machine_gun_4: "미래 동축기관총"
 afv_coax_machine_gun_4_desc: "동축기관총으로 장착된 첨단 설계의 기관총입니다."
 afv_coax_autocannon: "냉전 초기 동축기관포"
 afv_coax_autocannon_desc: "동축포로 장착된 기관포입니다."
 afv_coax_autocannon_2: "냉전 후기 동축 기관포"
 afv_coax_autocannon_2_desc: "동축포로 장착된 개량형 기관포입니다."
 afv_coax_autocannon_3: "현대 동축 기관포"
 afv_coax_autocannon_3_desc: "동축포로 장착된 현대식 기관포입니다."
 afv_coax_autocannon_4: "최첨단 동축기관포"
 afv_coax_autocannon_4_desc: "동축 형식으로에 사용되는 미래의 자동포입니다."
 double_feed_system: "이중 구경 급탄 시스템"
 double_feed_system_desc: "이 시스템을 사용하면 대구경 대포가 더 작은 구경의 포탄을 발사할 수 있습니다."
 double_cannons: "이중포"
 double_cannons_desc: "하나의 대포 대신 두 개의 대포를 장착하는 시스템으로, 자체적인 문제가 있습니다."
 GER_tank_diesel_engine_gen5: "유로 파워팩, 1650마력"
 GER_small_autocannon: "RH Mk 20 Rh-202"
 GER_small_autocannon_2: "RH Mk 20 Rh-202+"
 GER_small_autocannon_3: "MLG 27"
 GER_afv_coax_machine_gun: "탑재형 MG1"
 GER_afv_coax_machine_gun_2: "탑재형 MG3"
 GER_afv_coax_machine_gun_3: "탑재형 현대 MG3"
 GER_afv_machine_gun: "MG1"
 GER_afv_machine_gun_2: "MG3"
 GER_afv_machine_gun_3: "현대 MG3"
 USA_tank_small_medium_cannon: "90 mm M36/M41"
 USA_tank_medium_cannon_1: "120mm M5"
 USA_tank_medium_cannon_2: "120mm M256"
 USA_tank_medium_cannon_3: "120mm M360"
 USA_hardkill_system_gen1: "Trophy-ADS"
 USA_reactive_armor_gen2: "ARAT II"
 USA_small_autocannon_2: "M242 부시마스터"
 USA_small_autocannon_3: "M242 부시마스터-E"
 art_big_gun_gen4_desc: "중곡사포의 발사 메커니즘이 개선되면서 가장 무거운 표적을 타격할 수 있는 중포탄을 유지하면서 허용 가능한 속도로 발사할 수 있는 중포 시스템이 탄생했습니다."
 EQ_MOD_SLOT_radar_type_slot_TITLE: "레이다 슬롯"
 EQ_MOD_CAT_tank_small_main_armament_TITLE: "§R보병전투차/경전차§!\n경전차포"
 EQ_MOD_CAT_spaa_battlestation_modules_TITLE: "사격 통제 장치"
 EQ_MOD_CAT_spaa_radar_systems_TITLE: "차량 탑재 레이다 시스템"
 EQ_MOD_CAT_spaa_off_vehicle_radar_systems_TITLE: "레이다 지원차량"
 EQ_MOD_CAT_spaa_optical_guidance_systems_TITLE: "광학 표적 획득 시스템"
 EQ_MOD_CAT_chassis_wheeled_afv_module_TITLE: "차륜형 장갑전투차량 차체"
 EQ_MOD_CAT_chassis_light_tank_module_TITLE: "경전차 차체"
 EQ_MOD_CAT_chassis_tracked_afv_module_TITLE: "궤도형 장갑전투차량(AFV) 차체"
 EQ_MOD_CAT_spaa_chassis_truck_module_TITLE: "트럭 차체"
 EQ_MOD_CAT_spaa_chassis_tank_module_TITLE: "전차 차체"
 EQ_MOD_CAT_spaa_chassis_afv_module_TITLE: "장갑전투차량(AFV) 차체"
 EQ_MOD_CAT_spaa_support_missile_system_category_TITLE: "보조 미사일"
 EQ_MOD_CAT_spaa_auxiliary_autocannon_category_TITLE: "보조 기관포"
 EQ_MOD_CAT_spaa_coax_machinegun_category_TITLE: "추가 기관총"
 EQ_MOD_CAT_tank_longer_gun_category_TITLE: "공격 시스템"
 EQ_MOD_CAT_light_tanks_reload_modules_TITLE: "장갑전투차량 자동장전 시스템"
 light_tank_afv_automatic_loading: "장갑전투차량 자동장전 시스템"
 light_tank_afv_automatic_loading_desc: "자동 장전 시스템은 전시 중 차량의 전투 효율을 효과적으로 높여줍니다."
 tank_small_cannon: "냉전 초기형 경전차포"
 tank_small_cannon_desc: "초기 경전차의 주포는 견인포를 개조해 사용하는 경우가 많았습니다."
 tank_small_cannon_2: "냉전 후기 경전차포"
 tank_small_cannon_2_desc: "경전차의 주포는 저압포가 많아 반동이 적고 전체 중량 또한 가볍습니다."
 tank_small_cannon_3: "현대 경전차포"
 tank_small_cannon_3_desc: "현대 경전차 주포는 첨단 소재 및 설계를 통해 화력과 사거리를 최적화하였습니다."
 tank_small_cannon_4: "최첨단 경전차포"
 tank_small_cannon_4_desc: "나노기술과 컴퓨터 지원 설계의 도입으로 미래 경전차 주포의 전례 없는 발전이 가능해졌으며 경전차의 생존성과 출력 능력이 더욱 향상되었습니다."
 EQ_MOD_CAT_spaa_naval_cannon_systems_TITLE: "해상 함포"
 spaa_naval_cannon_1: "대전기 이후 함포"
 spaa_naval_cannon_1_desc: "당대 기준으로 막대한 구경을 자랑하던 이 함포는 대인/비장갑 표적에 압도적인 파괴력을 선사합니다. 무지막지한 위력이 이 포의 핵심이지만, 기동성과 효율성은 일부 희생해야 했습니다."
 spaa_naval_cannon_2: "냉전기 함포"
 spaa_naval_cannon_2_desc: "포탄 설계와 추진 기구의 개선으로 화력이 강화되었습니다. 상당한 공중 위협 대응 잠재력을 유지하면서도, 원초적인 위력 면에서 여전히 강력한 선택지입니다."
 spaa_naval_cannon_3: "현대 함포"
 spaa_naval_cannon_3_desc: "반자동 장전 장치와 발전된 탄종을 도입하여 발사 속도를 높였으며, 대인/비장갑 표적 제압에서 압도적인 효율을 자랑합니다."
 spaa_naval_cannon_4: "발전된 함포"
 spaa_naval_cannon_4_desc: "유도탄을 채택하여 전례 없는 정확도를 보여주며, 이 대포는 대공 방어의 핵심 자산으로 자리매김했습니다."
 spaa_naval_cannon_5: "최첨단 함포"
 spaa_naval_cannon_5_desc: "최첨단 소재와 최적화된 탄약 설계를 활용하여, 향상된 효율성과 함께 대인/비장갑 표적에 대해 더욱 강력한 파괴력을 보장합니다."
 EQ_MOD_CAT_spaa_light_autocannon_systems_TITLE: "§RSPAA§!\nSupport Autocannon"
 spaa_light_autocannon1: "Post WW2 Support Autocannon"
 spaa_light_autocannon1_desc: "날렵하고 가벼운 이 기관포는 신속한 반응과 기동성을 중시하며, 유동적인 전투 상황에서 필수적인 공중 엄호 능력을 제공합니다."
 spaa_light_autocannon2: "Cold War Support Autocannon"
 spaa_light_autocannon2_desc: "진화된 소재와 최적화된 발사 메커니즘으로 효율성을 높였으며, 역동적인 전장에서 민첩한 방어 수단으로서의 입지를 굳혔습니다."
 spaa_light_autocannon3: "Modern Support Autocannon"
 spaa_light_autocannon3_desc: "고속탄을 사용하여 교전 시간을 단축시켰으며, 공중 위협을 신속하게 무력화하는 데 최적화된 선택입니다."
 spaa_light_autocannon4: "Advanced Support Autocannon"
 spaa_light_autocannon4_desc: "발전된 합금과 높은 연사 속도를 갖추어 신속하고 효율적인 공중 교전에서 선두주자로서의 위상을 확고히 했습니다."
 spaa_light_autocannon5: "Cutting-Edge Support Autocannon"
 spaa_light_autocannon5_desc: "최신 제조 기술을 적용한 이 기관포는 속도와 효율성의 정점에 서 있으며, 신속 대응 체계의 새로운 기준을 제시합니다."
 EQ_MOD_CAT_spaa_autocannon_systems_TITLE: "§R자주대공포(SPAA)§!\n기관포"
 spaa_autocannon_1: "대전기 이후 기관포"
 spaa_autocannon_1_desc: "파괴력과 속도의 균형을 맞춘 이 다목적 기관포는 다양한 전투 상황에서 전천후로 활약할 수 있습니다."
 spaa_autocannon_2: "냉전기 기관포"
 spaa_autocannon_2_desc: "포탄 설계와 소재 구조의 업그레이드를 통해 전반적인 효용성을 높였으며, 다양한 교전에서 신뢰할 수 있는 장비로 거듭났습니다."
 spaa_autocannon_3: "현대 기관포"
 spaa_autocannon_3_desc: "강화된 발사 메커니즘과 최적화된 탄종은 이 세대의 기관포를 새로운 경지로 끌어올렸으며, 공중과 지상 위협 모두에 안정적인 성능을 보장합니다."
 spaa_autocannon_4: "발전된 기관포"
 spaa_autocannon_4_desc: "강화된 포신 설계와 우수한 탄약을 갖춘 이 버전은 다양한 전투 상황에서 더욱 일관된 성능을 제공합니다."
 spaa_autocannon_5: "최첨단 기관포"
 spaa_autocannon_5_desc: "기관포 설계의 정점을 대표하며, 최신 재료 공학 및 탄약 기술을 활용하여 최적의 성능을 보장합니다."
 EQ_MOD_CAT_spaa_missile_systems_TITLE: "이중 목적 미사일"
 spaa_missiles_1: "대전기 이후 이중 목적 미사일"
 spaa_missiles_1_desc: "미사일 기술의 태동기를 함께한 이 유도 발사체는 정확한 교전을 보장합니다. 특히 장갑을 갖춘 공중 적에게 강력할 뿐 아니라 지상 표적과도 교전이 가능합니다."
 spaa_missiles_2: "냉전기 이중 목적 미사일"
 spaa_missiles_2_desc: "향상된 추진력과 공기역학 설계는 미사일의 성능을 높여, 견고하고 회피 기동을 하는 표적에 대해 더 큰 타격을 입힙니다."
 spaa_missiles_3: "현대 이중 목적 미사일"
 spaa_missiles_3_desc: "개선된 유도 시스템과 최적화된 탄두를 갖춘 이 세대는 보다 효과적인 교전을 보장하며 하늘에서의 지배력을 확고히 합니다."
 spaa_missiles_4: "발전된 이중 목적 미사일"
 spaa_missiles_4_desc: "첨단 소재와 추진 시스템을 통해 미사일의 사거리와 타격력을 높여 공중전에서의 우위를 유지합니다."
 spaa_missiles_5: "최첨단 이중 목적 미사일"
 spaa_missiles_5_desc: "미사일 기술의 한계를 뛰어넘는 이 세대는 비교할 수 없는 사거리, 속도 및 타격력을 제공하여 모든 공중 위협을 효과적으로 저지합니다."
 EQ_MOD_CAT_spaa_short_range_missile_systems_TITLE: "§R자주대공포(SPAA)§!\n단거리 미사일"
 spaa_short_range_missiles_1: "대전기 이후 단거리 미사일"
 spaa_short_range_missiles_1_desc: "미사일 기술의 태동기를 함께한 이 유도 발사체는 정확한 교전을 보장하며, 특히 장갑을 갖춘 공중 적을 상대할 때 강력합니다."
 spaa_short_range_missiles_2: "냉전기 단거리 미사일"
 spaa_short_range_missiles_2_desc: "향상된 추진력과 공기역학 설계는 미사일의 성능을 높여, 견고하고 회피 기동을 하는 표적에 대해 더 큰 타격을 입힙니다."
 spaa_short_range_missiles_3: "현대 단거리 미사일"
 spaa_short_range_missiles_3_desc: "개선된 유도 시스템과 최적화된 탄두를 갖춘 이 세대는 보다 효과적인 교전을 보장하며 하늘에서의 지배력을 확고히 합니다."
 spaa_short_range_missiles_4: "발전된 단거리 미사일"
 spaa_short_range_missiles_4_desc: "첨단 소재와 추진 시스템을 통해 미사일의 사거리와 타격력을 높여 공중전에서의 우위를 유지합니다."
 spaa_short_range_missiles_5: "최첨단 단거리 미사일"
 spaa_short_range_missiles_5_desc: "미사일 기술의 한계를 뛰어넘는 이 세대는 비교할 수 없는 사거리, 속도 및 타격력을 제공하여 모든 공중 위협을 효과적으로 저지합니다."
 EQ_MOD_CAT_spaa_long_range_missile_systems_TITLE: "§R자주대공포(SPAA)§!\n장거리 미사일"
 spaa_long_range_missiles_1: "대전기 이후 장거리 미사일"
 spaa_long_range_missiles_1_desc: "미사일 기술의 태동기를 함께한 이 유도 발사체는 정확한 교전을 보장합니다. 특히 장갑을 갖춘 공중 적에게 강력할 뿐 아니라 지상 표적과도 교전이 가능합니다."
 spaa_long_range_missiles_2: "냉전기 장거리 미사일"
 spaa_long_range_missiles_2_desc: "향상된 추진력과 공기역학 설계는 미사일의 성능을 높여, 견고하고 회피 기동을 하는 표적에 대해 더 큰 타격을 입힙니다."
 spaa_long_range_missiles_3: "현대 장거리 미사일"
 spaa_long_range_missiles_3_desc: "개선된 유도 시스템과 최적화된 탄두를 갖춘 이 세대는 보다 효과적인 교전을 보장하며 하늘에서의 지배력을 확고히 합니다."
 spaa_long_range_missiles_4: "향상된 장거리 미사일"
 spaa_long_range_missiles_4_desc: "첨단 소재와 추진 시스템을 통해 미사일의 사거리와 타격력을 높여 공중전에서의 우위를 유지합니다."
 spaa_long_range_missiles_5: "최첨단 장거리 미사일"
 spaa_long_range_missiles_5_desc: "미사일 기술의 한계를 뛰어넘는 이 세대는 비교할 수 없는 사거리, 속도 및 타격력을 제공하여 모든 공중 위협을 효과적으로 저지합니다."
 spaa_radar_gen1: "대전기 이후 레이다 시스템"
 spaa_radar_gen1_desc: "자주대공포 플랫폼 전용으로 특별히 설계된 기반 레이더 시스템으로, 공중 위협을 탐지하기 위해 사거리와 정확도의 균형을 맞췄습니다. 비용은 이 장비의 특수성을 나타냅니다."
 spaa_radar_gen2: "냉전기 레이다 시스템"
 spaa_radar_gen2_desc: "한층 더 발전된 탐지 알고리즘으로 강화된 이 레이더 시스템은 혼잡한 공중 환경에서 두각을 나타내며, 전파 방해 속에서도 일관된 표적 추적을 보장합니다."
 spaa_radar_gen3: "현대 레이다 시스템"
 spaa_radar_gen3_desc: "첨단 소재와 디지털 처리를 구현하여 최적의 실시간 추적 및 정보 전달을 보장하여 빠르게 진행되는 공중 교전에서 우위를 제공합니다."
 spaa_radar_gen4: "발전된 레이더 시스템"
 spaa_radar_gen4_desc: "획기적인 기술을 활용하여 다양한 작전 환경에서 타의 추종을 불허하는 정확도와 표적 식별 능력을 제공하는 최신예 시스템입니다."
 spaa_radar_gen5: "양자 보조 레이다 시스템"
 spaa_radar_gen5_desc: "레이더 설계의 정점이라 할 수 있으며, 여러 위협을 원활하게 관리하는 적응형 기능을 제공합니다. 비록 높은 비용이 들더라도 최고의 탐지 장비라는 명성을 확고히 합니다."
 spaa_off_vehicle_radar_gen1: "대전기 이후 레이다 지원차량"
 spaa_off_vehicle_radar_gen1_desc: "향상된 탐지 범위를 제공하지만, 이 지원 차량의 주된 기능은 SPAA에게 더 나은 표적 데이터를 제공하는 것입니다. 초기 설계 모델이라 최전선 돌파 상황에서는 운용상의 어려움이 있습니다."
 spaa_off_vehicle_radar_gen2: "냉전기 레이다 지원차량"
 spaa_off_vehicle_radar_gen2_desc: "개선된 신호 처리로 강화되어 직접 교전 시의 내구성은 희생했지만 전체 방공 생태계의 반응 시간을 단축시킵니다."
 spaa_off_vehicle_radar_gen3: "현대 레이다 지원차량"
 spaa_off_vehicle_radar_gen3_desc: "이 차량은 안전한 거리에서 작동하는 것을 선호하더라도 더 빠른 위협 분류 및 전달을 약속하는 정교한 레이더 시스템을 자랑합니다."
 spaa_off_vehicle_radar_gen4: "향상된 레이다 지원차량"
 spaa_off_vehicle_radar_gen4_desc: "최첨단 레이더 기술을 수용하는 이 장치는 방공망의 '눈' 역할을 하여 위협을 식별하고 처리하도록 보장하지만 직접적인 대결로부터 보호하는 것이 가장 좋습니다."
 spaa_off_vehicle_radar_gen5: "양자 보조 레이다 지원차량"
 spaa_off_vehicle_radar_gen5_desc: "지원 레이더 진화의 정점을 대표하는 이 제품의 탁월한 탐지 범위와 신속한 정보 전파는 매우 귀중하지만 최전선의 취약성은 여전히 ​​남아 있습니다."
 spaa_optical_guidance_gen1: "대전기 이후 광학 유도"
 spaa_optical_guidance_gen1_desc: "기본 시각 보조 장치와 초기 센서를 활용하는 이 유도 시스템은 유리한 조건에서 공중 표적을 추적하고 교전할 수 있는 비용 효율적인 수단을 제공합니다."
 spaa_optical_guidance_gen2: "냉전기 광학 유도"
 spaa_optical_guidance_gen2_desc: "향상된 렌즈와 초기 전자 추적을 통합하여 특히 주간 작업 중에 보다 일관된 표적 획득을 제공합니다."
 spaa_optical_guidance_gen3: "현대 광학 유도"
 spaa_optical_guidance_gen3_desc: "센서 기술의 발전으로 이 시스템은 더 나은 목표 식별 및 범위 추정을 제공하므로 신뢰할 수 있고 예산 친화적인 선택이 됩니다."
 spaa_optical_guidance_gen4: "향상된 광학 유도"
 spaa_optical_guidance_gen4_desc: "최첨단 시각 센서와 소프트웨어 지원 기능을 결합하여 더 효과적인 표적 추적을 보장하고 더 비싼 레이더 대응 제품에 맞서 입지를 유지합니다."
 spaa_optical_guidance_gen5: "Cutting-Edge Optical Guidance"
 spaa_optical_guidance_gen5_desc: "적응형 시각 추적과 지능형 위협 우선순위 판단을 제공하는 광학 기술의 경이로, 경제적이면서도 효율적인 대안으로서의 입지를 굳혔습니다."
 chassis_wheeled_afv_gen0: "차륜형 장갑전투차량 차체 I"
 chassis_tracked_afv_gen0: "궤도형 장갑전투차량 차체 I"
 chassis_light_tank_gen0: "경전차 차체 I"
 chassis_wheeled_afv_gen1: "차륜형 장갑전투차량 차체 II"
 chassis_tracked_afv_gen1: "궤도형 장갑전투차량 차체 II"
 chassis_light_tank_gen1: "경전차 차체 II"
 chassis_wheeled_afv_gen2: "차륜형 장갑전투차량 차체 III"
 chassis_tracked_afv_gen2: "궤도형 장갑전투차량 차체 III"
 chassis_light_tank_gen2: "경전차 차체 III"
 chassis_wheeled_afv_gen3: "차륜형 장갑전투차량 차체 IV"
 chassis_tracked_afv_gen3: "궤도형 장갑전투차량 차체 IV"
 chassis_light_tank_gen3: "경전차 차체 IV"
 chassis_wheeled_afv_gen4: "차륜형 장갑전투차량 차체 V"
 chassis_tracked_afv_gen4: "궤도형 장갑전투차량 차체 V"
 chassis_light_tank_gen4: "경전차 차체 V"
 chassis_wheeled_afv_gen0_desc: "파나르 AML 같은 초기 차륜식 정찰 차량에서 영감을 얻은 이 차체는 신속한 전개와 지형 적응력을 중시하여, 비용 효율적으로 신속한 교전을 가능하게 합니다."
 chassis_tracked_afv_gen0_desc: "M113 장갑차와 BMP-1의 유산에 뿌리를 둔 이 균형 잡힌 차체는 적당한 생산 비용으로 방어력과 돌파력을 모두 제공합니다."
 chassis_light_tank_gen0_desc: "PT-76과 M551 셰리든의 설계를 연상시키는 이 차체는 다양한 상황에 적합한 방어력과 돌파력을 겸비하고 있습니다."
 chassis_wheeled_afv_gen1_desc: "프랑스 ERC-90 사가이에서 볼 수 있는 발전과 함께 진화한 이 차체는 타의 추종을 불허하는 속도에 대한 의지를 유지하면서, 더 나은 작전 내구성을 위해 조금 더 투자하였습니다."
 chassis_tracked_afv_gen1_desc: "스콜피온과 CVR(T) 계열 같은 설계에서 발전한 이 섀시는 작전 능력을 높이면서도 속도 면에서는 중간 수준을 유지합니다."
 chassis_light_tank_gen1_desc: "AMX-13 같은 전차에서 얻은 교훈을 바탕으로 내구성과 효과적인 작전 능력을 결합하여, 더 무거운 차체들보다 여전히 민첩함을 유지합니다."
 chassis_wheeled_afv_gen2_desc: "EE-9 카스카벨과 LAV-25의 혁신을 참고한 이 차륜식 설계는 예산 부담이 적으며, 향상된 방호력과 돌파력에 초점을 맞추어 개량되었습니다."
 chassis_tracked_afv_gen2_desc: "브래들리와 BMD-4의 혁신에 영향을 받은 이 차체는 향상된 방호력을 제공하여 방어와 돌파 양면에서 진전을 이루었습니다."
 chassis_light_tank_gen2_desc: "비젤 AWC와 89식 보병전투차에서 얻은 통찰을 반영한 이 설계는 적절한 기동성을 유지하면서도 향상된 장갑과 방호력을 입증합니다."
 chassis_wheeled_afv_gen3_desc: "복서와 스트라이커의 모듈식 접근법을 반영하여 생산 비용이 약간 늘었으며, 고유의 속도를 해치지 않으면서 적응성을 제공합니다."
 chassis_tracked_afv_gen3_desc: "CV90과 ASCOD의 발전을 반영한 이 모델은 더 높은 생산 가치로 방어력과 돌파력을 결합합니다."
 chassis_light_tank_gen3_desc: "M8 뷰퍼드와 2S25 스프루트-SD의 발전을 반영한 이 설계는 지나치게 거추장스러워지지 않으면서도 돌파력과 방어력을 우선시하도록 보장합니다."
 chassis_wheeled_afv_gen4_desc: "미래전을 내다본 이 차체는 최첨단 기술을 통합하여 방어와 돌파를 지원하며, 민첩성이 더 나은 방호력으로 보완되도록 합니다."
 chassis_tracked_afv_gen4_desc: "미래 전장을 내다본 이 모델은 생산 비용이 오를 수는 있으나, 방어력, 돌파력, 장갑 수치에서 얻는 보상이 비할 데 없음을 보장합니다."
 chassis_light_tank_gen4_desc: "미래전의 요구를 예견한 이 차체는 최신 방호 기술을 통합하여, 주력 전차에 비해 속도 면의 우위를 잃지 않으면서도 방어와 돌파 측면에서 여전히 가공할 선택지로 남도록 합니다."
 ITA_tank_diesel_engine_gen5: "IVECO Vector 12V, 1600마력"
 smoke_launchers_3: "현대식 연막 및 레이저 경보 체계"
 smoke_launchers_3_desc: "레이저 경보 체계는 차량이 레이저 유도 미사일이나 전차 사격 통제 장치의 표적이 되었을 때 승무원에게 경고합니다.\n\n§G설계 힌트: 연막 발사기를 추가하면 전차의 가시성이 줄어들어 방어와 공격 모두에서 유리해집니다.§!"
 SOV_smoke_launchers_3: "시토라-1"
 SOV_smoke_launchers_3_desc: "시토라-1 '전자광학 능동 방어 체계'는 첨단 연막 발사 장치입니다. 적린으로 연기를 내는 3D17 연막탄을 발사하며, 이 연기는 전차를 열영상으로부터 가릴 만큼 뜨겁게 타오릅니다.\n\n§G설계 힌트: 연막 발사기를 추가하면 아군 전차의 피탐지율이 낮아져 방어와 공격 모두에서 더 유리해집니다.§!"
 USA_tank_small_medium_cannon_2: "105 mm M68/M68E1/M68A1"
 USA_reactive_armor_gen1: "ARAT I"
 tank_heavy_tank_turrets: "초중전차 포탑"
 tank_heavy_tank_turrets_desc: "전차 포탑에 관한 현대 공학의 정점입니다. 초중량 전차 포탑은 소형 화기, 대구경 포 등에 대해 막대한 방호력을 제공합니다. 승무원 서너 명이 편안히 들어갈 수 있는 공간이 있으며, 일반 주포로는 장착할 수 없는 추가 공간이 필요한 추가 무기를 위한 공간도 갖추고 있습니다.\n\n§G설계 힌트: 특수한 미래형 전차 포탑입니다. 레일건이나 쌍열포 같은 특수 무기를 장착하려면 이 전차 포탑을 사용하십시오.§!"
 aa_launchers: "전차 장착형 지대공미사일"
 aa_launchers_desc: "전차 외부에 장착되어 전차 내부에서 적 공중 표적을 조준할 수 있는 지대공 미사일 발사기입니다.\n\n§G설계 힌트: 전차에 포탑 장착식 대공 미사일 발사기를 장비하면 적 항공기로부터 어느 정도의 방호를 얻을 수 있습니다.§!"
 tank_railgun_cannon_1: "레일건 전차포"
 tank_railgun_cannon_1_desc: "전기 엔진과 전자기 기술의 발전으로 특수 탄을 믿을 수 없을 만큼 빠른 속도로 가속할 수 있게 되었습니다. 이 탄의 조정을 통해 가장 두꺼운 장갑조차 무용지물로 만들 만큼 뛰어난 장갑 관통력을 얻을 수 있습니다."
 tank_railgun_cannon_2: "플라즈마 레일건 전차포"
 tank_railgun_cannon_2_desc: "플라즈마 레일건은 고체 발사체 대신 이온화된 뜨거운 기체, 즉 플라즈마 덩어리를 발사합니다. 충돌 시 플라즈마가 폭발하며 막대한 열과 운동 에너지를 만들어냅니다. 또한 전자기 복사를 방출하여 근처의 전자 장비를 교란합니다."
 tank_double_barrel_tank_cannons: "이중 배럴 전차포"
 tank_double_barrel_tank_cannons_desc: "순수한 공상과학처럼 보이는 일이지만, 우리 기술자들은 두 문의 주력 전차포를 하나의 포탑에 장착하는 방법을 고안해 냈습니다. 발사 속도가 증가하고 압도적인 화력을 퍼부어 적의 장갑과 부대를 유린할 수 있습니다. 가능한 한 많은 155mm 포탄으로 한 방향을 통째로 지워 버리고 싶었던 경우를 위한 것입니다."
 tank_focused_laser_beam_cannon: "집속 레이저 빔 포"
 tank_focused_laser_beam_cannon_desc: "우리 과학자 중 한 명이 치과용 레이저를 순수한 집속 에너지로 바꿔 적을 순식간에 기화시키거나 장갑과 단단한 표적에 심각한 피해를 입힌다는 기발한 생각을 해냈습니다. 이른바 \\"빔 캐논\\"은 추가 배터리 팩 등으로 인해 장갑 차량의 공간과 내부 설계에 큰 투자가 필요하지만, 자체 내장 배터리와 탑재 컴퓨터 덕분에 재무장이 필요 없다는 점으로 이를 만회합니다. 그야말로 녹색주의 당원들의 꿈입니다. 낭비도, 문제도 없습니다!"
 tank_laser_point_defense: "레이저 근접 방어 체계"
 tank_laser_point_defense_desc: "전차를 추적하는 드론과 적대적인 대전차 유도 미사일에 대처하기 위한 레이저 체계입니다."
 EQ_MOD_CAT_tank_large_special_main_armament_TITLE: "대형 특수 전차 무기"
 tank_battlestation_5: "최첨단 배틀스테이션"
 tank_battlestation_5_desc: "다목적 카메라 세트와 고급 전투 관측 시스템이 탑재되어 있습니다.\n\n§G설계 힌트: 배틀스테이션은 전차 운용에 필요한 사격 통제, 화기 제어, 광학 장비 및 기타 보조 장비를 나타냅니다. 더 우수한 배틀스테이션을 장착할수록 전차의 전반적인 품질이 향상됩니다.§!"
 tank_battlestation_2_thermal: "냉전기 열상 배틀스테이션"
 tank_battlestation_2_thermal_desc: "열상 조준경을 갖춘 80년대 사양의 배틀스테이션입니다.\n\n§G설계 힌트: 배틀스테이션은 전차 운용에 필요한 사격 통제, 화기 제어, 광학 장비 및 기타 보조 장비를 나타냅니다. 더 우수한 배틀스테이션을 장착할수록 전차의 전반적인 품질이 향상됩니다.§!"
 EQ_MOD_SLOT_secondary_armament_slot_TITLE: "보조 무장"
 EQ_MOD_SLOT_ammunition_load_slot_TITLE: "탄약 적재량"
 EQ_MOD_CAT_artillery_light_ammo_TITLE: "§RSPG/MLRS§!\n경구경 탄약"
 EQ_MOD_CAT_artillery_medium_ammo_TITLE: "§RSPG/MLRS§!\n중구경 탄약"
 EQ_MOD_CAT_artillery_heavy_ammo_TITLE: "§RSPG/MLRS§!\n대구경 탄약"
 EQ_MOD_CAT_autocannon_ammo_TITLE: "기관포 탄약"
 EQ_MOD_CAT_main_gun_ammo_TITLE: "주포 탄약"
 EQ_MOD_CAT_machine_gun_ammo_TITLE: "기관총 탄약"
 EQ_MOD_CAT_assault_gun_ammo_TITLE: "돌격포 탄약"
 EQ_MOD_CAT_artillery_special_ammo_TITLE: "§RSPG/MLRS§!\n특수 간접사격 탄약"
 EQ_MOD_CAT_missile_launcher_systems_TITLE: "§RSPAA§!\n지대공 미사일 발사기"
 EQ_MOD_CAT_assault_gun_TITLE: "§RIFV/경전차§!\n돌격포"
 EQ_MOD_CAT_autocannon_vehicle_TITLE: "§RAPC/IFV/경전차§!\n기관포"
 EQ_MOD_CAT_art_gun_module_TITLE: "§RSPG§!\n곡사포"
 EQ_MOD_CAT_art_rocket_module_TITLE: "§RMLRS§!\nMLRS 발사기"
 EQ_MOD_CAT_tank_suspension_type_light_TITLE: "경량 서스펜션"
 EQ_MOD_CAT_tank_suspension_type_med_TITLE: "중형 서스펜션"
 EQ_MOD_CAT_tank_suspension_type_heavy_TITLE: "중량 서스펜션"
 EQ_MOD_CAT_helicopter_mast_mounted_camera_TITLE: "마스트 탑재형 카메라"
 EQ_MOD_CAT_helicopter_mast_mounted_radar_TITLE: "마스트 탑재형 레이다"
 EQ_MOD_CAT_helicopter_coaxial_engine_type_TITLE: "동축 엔진"
 EQ_MOD_CAT_helicopter_twin_engine_type_TITLE: "쌍발 엔진"
 EQ_MOD_CAT_helicopter_armor_type_light_TITLE: "경량 장갑"
 EQ_MOD_CAT_tank_stealth_armor_TITLE: "스텔스 장갑"
 EQ_MOD_CAT_tank_suspension_type_wheeled_TITLE: "차륜식 서스펜션"
 tank_stealth_armor_camelon: "카멜레온 장갑"
 tank_stealth_armor_camelon_desc: "주변 환경의 색상에 적응하고 질감을 모사할 수 있는 장갑으로, 차량의 위장을 어떤 환경에도 맞출 수 있게 해 줍니다."
 tank_stealth_armor_gen1: "스텔스 장갑"
 tank_stealth_armor_gen1_desc: "적의 관측으로부터 차량을 더 잘 은폐하고 숨겨 주는 첨단 스텔스 장갑입니다."
 tank_stealth_armor_thermal: "열 차폐 장갑"
 tank_stealth_armor_thermal_desc: "전차의 열 신호를 감추거나 조절하여 차량을 열상 광학 장비로부터 숨길 수 있게 하는 장갑 체계입니다."
 defensive_jammers: "방어용 재머"
 defensive_jammers_desc: "날아오는 위협으로부터 장갑차량을 보호하고, 접근하는 항공기의 체계를 교란하여 차량이 공중 위협에 더 쉽게 대응하도록 돕는 재밍 체계입니다."
 two_missile_pack: "2 미사일 팩"
 two_missile_pack_desc: "모듈식 미사일 발사 체계로, 미사일을 다양한 수의 팩 단위로 차량에 장착하여 더 많거나 적은 탄약을 휴대할 수 있습니다."
 four_missile_pack: "4 미사일 팩"
 four_missile_pack_desc: "모듈식 미사일 발사 체계로, 미사일을 다양한 수의 팩 단위로 차량에 장착하여 더 많거나 적은 탄약을 휴대할 수 있습니다."
 eight_missile_pack: "8 미사일 팩"
 eight_missile_pack_desc: "모듈식 미사일 발사 체계로, 미사일을 다양한 수의 팩 단위로 차량에 장착하여 더 많거나 적은 탄약을 휴대할 수 있습니다."
 sixteen_missile_pack: "16 미사일 팩"
 sixteen_missile_pack_desc: "모듈식 미사일 발사 체계로, 미사일을 다양한 수의 팩 단위로 차량에 장착하여 더 많거나 적은 탄약을 휴대할 수 있습니다."
 thirty_two_missile_pack: "32 미사일 팩"
 thirty_two_missile_pack_desc: "모듈식 미사일 발사 체계로, 미사일을 다양한 수의 팩 단위로 차량에 장착하여 더 많거나 적은 탄약을 휴대할 수 있습니다."
 EQ_MOD_CAT_tank_reload_external_module_TITLE: "§RMLRS/SPAA§!\n미사일 팩"
 external_launcher: "외장 무기 발사기"
 external_launcher_desc: "내부 탄약 보급 없이도 차량에 무기를 장착할 수 있게 해 주는 외부 장착식 체계입니다."
 missile_launcher_system: "지대공 미사일 발사기"
 missile_launcher_system_desc: "차량에 지대공 미사일을 장비할 수 있도록 설계된 장착 체계입니다."
 tank_pneumatic_suspension_light: "경량 공압식 서스펜션"
 tank_pneumatic_suspension_light_desc: "유압 공압식 서스펜션에서는 유압유와 질소 가스의 조합이 서스펜션의 완충 요소로 사용됩니다. 이 서스펜션을 갖추면 전차의 승차감이 훨씬 부드러워집니다. 주행 높이를 즉석에서 조절할 수 있고 전차가 스스로 수평을 맞출 수 있습니다. 이로써 더 부드러운 이동과 더 안정적인 조준이 가능합니다. 다만 서스펜션 체계로서는 기존 토션 바 방식보다 제작과 유지가 더 어렵습니다.\n\n§G설계 힌트: 전차에 유압 공압식 서스펜션을 장착하면 신뢰성과 생산 비용을 희생하는 대신 전차의 전반적인 성능이 향상됩니다.§!"
 tank_torsion_bar_suspension_light: "경량 토션 바 서스펜션"
 tank_torsion_bar_suspension_light_desc: "전차의 표준 서스펜션 체계입니다. 로드휠에 연결된 막대가 수평 봉에 연결됩니다. 바퀴가 위아래로 움직이면 봉이 비틀리면서 서스펜션 스프링 역할을 합니다.\n\n§G설계 힌트: 안전하고 위험이 낮은 표준 선택지입니다.§!"
 tank_wheeled_suspension_light: "경량 차륜식 서스펜션"
 tank_wheeled_suspension_light_desc: "4x4/6x6/8x8 등 바퀴를 기반으로 한 서스펜션으로, 더 나은 속도를 제공하지만 파편과 소형 화기 사격에 더 취약합니다.\n\n§G설계 힌트: 전차에 차륜식 서스펜션을 장착하면 차량이 더 빠르고 가벼워지지만, 장갑과 내구성은 떨어집니다.§!"
 tank_pneumatic_suspension_medium: "중형 공압식 서스펜션"
 tank_pneumatic_suspension_medium_desc: "유압 공압식 서스펜션에서는 유압유와 질소 가스의 조합이 서스펜션의 완충 요소로 사용됩니다. 이 서스펜션을 갖추면 전차의 승차감이 훨씬 부드러워집니다. 주행 높이를 즉석에서 조절할 수 있고 전차가 스스로 수평을 맞출 수 있습니다. 이로써 더 부드러운 이동과 더 안정적인 조준이 가능합니다. 다만 서스펜션 체계로서는 기존 토션 바 방식보다 제작과 유지가 더 어렵습니다.\n\n§G설계 힌트: 전차에 유압 공압식 서스펜션을 장착하면 신뢰성과 생산 비용을 희생하는 대신 전차의 전반적인 성능이 향상됩니다.§!"
 tank_torsion_bar_suspension_medium: "중형 토션 바 서스펜션"
 tank_torsion_bar_suspension_medium_desc: "전차의 표준 서스펜션 체계입니다. 로드휠에 연결된 막대가 수평 봉에 연결됩니다. 바퀴가 위아래로 움직이면 봉이 비틀리면서 서스펜션 스프링 역할을 합니다.\n\n§G설계 힌트: 안전하고 위험이 낮은 표준 선택지입니다.§!"
 tank_wheeled_suspension_medium: "중형 차륜식 서스펜션"
 tank_wheeled_suspension_medium_desc: "4x4/6x6/8x8 등 바퀴를 기반으로 한 서스펜션으로, 더 나은 속도를 제공하지만 파편과 소형 화기 사격에 더 취약합니다.\n\n§G설계 힌트: 전차에 차륜식 서스펜션을 장착하면 차량이 더 빠르고 가벼워지지만, 장갑과 내구성은 떨어집니다.§!"
 tank_pneumatic_suspension_heavy: "중량 공압식 서스펜션"
 tank_pneumatic_suspension_heavy_desc: "유압 공압식 서스펜션에서는 유압유와 질소 가스의 조합이 서스펜션의 완충 요소로 사용됩니다. 이 서스펜션을 갖추면 전차의 승차감이 훨씬 부드러워집니다. 주행 높이를 즉석에서 조절할 수 있고 전차가 스스로 수평을 맞출 수 있습니다. 이로써 더 부드러운 이동과 더 안정적인 조준이 가능합니다. 다만 서스펜션 체계로서는 기존 토션 바 방식보다 제작과 유지가 더 어렵습니다.\n\n§G설계 힌트: 전차에 유압 공압식 서스펜션을 장착하면 신뢰성과 생산 비용을 희생하는 대신 전차의 전반적인 성능이 향상됩니다.§!"
 tank_torsion_bar_suspension_heavy: "중량 토션 바 서스펜션"
 tank_torsion_bar_suspension_heavy_desc: "전차의 표준 서스펜션 체계입니다. 로드휠에 연결된 막대가 수평 봉에 연결됩니다. 바퀴가 위아래로 움직이면 봉이 비틀리면서 서스펜션 스프링 역할을 합니다.\n\n§G설계 힌트: 안전하고 위험이 낮은 표준 선택지입니다.§!"
 crows_mg: "원격 무장 거치대"
 crows_mg_desc: "탑승자가 몸을 노출하지 않고도 무기를 조작할 수 있게 하여 보호하는 원격 조작식 무기 체계입니다."
 afv_troop_capacity: "§RAPC/IFV 모듈§!\n병력 수송 공간"
 afv_troop_capacity_desc: "탄약과 전투 능력을 덜어 내어 하차 병력을 수송함으로써 추가적인 전투 작전을 수행할 수 있게 합니다."
 bush_tank_mg: "전차 기관총"
 bush_tank_mg_desc: "''내가 도요타 위에 이걸 용접했더니 전차가 됐다!'' 싶은 모든 분들을 위한 물건입니다!"
 fire_ammo_1: "초기 네이팜 탄약"
 fire_ammo_1_desc: "로켓의 탄두를 네이팜으로 바꾸면 연약한 표적에 대한 효과를 높일 수 있습니다. 하지만 적 장갑차량과 싸우는 능력이 심각하게 떨어집니다."
 fire_ammo_2: "개량형 네이팜 탄약"
 fire_ammo_2_desc: "로켓의 탄두를 네이팜으로 바꾸면 연약한 표적에 대한 효과를 높일 수 있습니다. 하지만 적 장갑차량과 싸우는 능력이 심각하게 떨어집니다."
 fire_ammo_3: "첨단 네이팜 탄약"
 fire_ammo_3_desc: "로켓의 탄두를 네이팜으로 바꾸면 연약한 표적에 대한 효과를 높일 수 있습니다. 하지만 적 장갑차량과 싸우는 능력이 심각하게 떨어집니다."
 mine_ammo_1: "초기 지뢰 살포 로켓"
 mine_ammo_1_desc: "집속 로켓과 비슷하게, 지뢰 살포 로켓은 더 작은 조각으로 분리되어 목표 지역을 대인 또는 대차량 지뢰로 채웁니다"
 mine_ammo_2: "개량형 지뢰 살포 로켓"
 mine_ammo_2_desc: "집속 로켓과 비슷하게, 지뢰 살포 로켓은 더 작은 조각으로 분리되어 목표 지역을 대인 또는 대차량 지뢰로 채웁니다"
 mine_ammo_3: "첨단 지뢰 살포 로켓"
 mine_ammo_3_desc: "집속 로켓과 비슷하게, 지뢰 살포 로켓은 더 작은 조각으로 분리되어 목표 지역을 대인 또는 대차량 지뢰로 채웁니다"
 heat_ammo_1: "초기 HEAT 탄약"
 heat_ammo_1_desc: "HEAT(고폭 대전차) 탄은 적 장갑을 무력화하기 위해 만들어진 특수 탄종입니다. 포탄이 목표에 명중하면 폭발로 금속 제트가 분출되어 적 장갑을 관통합니다. 따라서 직격이 아닌 한 보병에 대한 효과는 매우 낮습니다."
 heat_ammo_2: "개량형 HEAT 탄약"
 heat_ammo_2_desc: "HEAT(고폭 대전차) 탄은 적 장갑을 무력화하기 위해 만들어진 특수 탄종입니다. 포탄이 목표에 명중하면 폭발로 금속 제트가 분출되어 적 장갑을 관통합니다. 따라서 직격이 아닌 한 보병에 대한 효과는 매우 낮습니다."
 heat_ammo_3: "첨단 HEAT 탄약"
 heat_ammo_3_desc: "HEAT(고폭 대전차) 탄은 적 장갑을 무력화하기 위해 만들어진 특수 탄종입니다. 포탄이 목표에 명중하면 폭발로 금속 제트가 분출되어 적 장갑을 관통합니다. 따라서 직격이 아닌 한 보병에 대한 효과는 매우 낮습니다."
 cluster_ammo_1: "초기 집속탄 탄약"
 cluster_ammo_1_desc: "집속탄은 하나의 큰 탄두 대신 여러 개의 작은 폭탄을 싣고 있습니다. 포탄이 목표에 접근하면 작은 폭탄들이 방출됩니다. 이렇게 하면 하나의 큰 폭발 대신 여러 개의 작은 폭발이 해당 지역에 흩뿌려집니다."
 cluster_ammo_2: "개량형 집속탄 탄약"
 cluster_ammo_2_desc: "집속탄은 하나의 큰 탄두 대신 여러 개의 작은 폭탄을 싣고 있습니다. 포탄이 목표에 접근하면 작은 폭탄들이 방출됩니다. 이렇게 하면 하나의 큰 폭발 대신 여러 개의 작은 폭발이 해당 지역에 흩뿌려집니다."
 cluster_ammo_3: "첨단 집속탄 탄약"
 cluster_ammo_3_desc: "집속탄은 하나의 큰 탄두 대신 여러 개의 작은 폭탄을 싣고 있습니다. 포탄이 목표에 접근하면 작은 폭탄들이 방출됩니다. 이렇게 하면 하나의 큰 폭발 대신 여러 개의 작은 폭발이 해당 지역에 흩뿌려집니다."
 laser_guided_ammo_1: "초기 레이저 유도 탄약"
 laser_guided_ammo_1_desc: "레이저 유도 포탄은 소형 제어 추력기를 이용해 비행 도중 경로를 바꿀 수 있습니다. 이를 통해 포탄이 목표를 더 정확하게 명중시킬 수 있습니다."
 laser_guided_ammo_2: "개량형 레이저 유도 탄약"
 laser_guided_ammo_2_desc: "레이저 유도 포탄은 소형 제어 추력기를 이용해 비행 도중 경로를 바꿀 수 있습니다. 이를 통해 포탄이 목표를 더 정확하게 명중시킬 수 있습니다."
 laser_guided_ammo_3: "첨단 레이저 유도 탄약"
 laser_guided_ammo_3_desc: "레이저 유도 포탄은 소형 제어 추력기를 이용해 비행 도중 경로를 바꿀 수 있습니다. 이를 통해 포탄이 목표를 더 정확하게 명중시킬 수 있습니다."
 nera_armor_gen1: "1세대 중량 NERA"
 nera_armor_gen1_desc: "티타늄 또는 열화우라늄 판재를 추가하고 독특한 형상을 적용하면 차량의 전반적인 장갑 방호력을 높일 수 있습니다.\n\n§G설계 힌트: 중량 NERA는 더 단순한 복합 장갑보다 저항력이 높지만 비용도 더 비쌉니다.§!"
 nera_armor_gen2: "2세대 중량 NERA"
 nera_armor_gen2_desc: "티타늄 또는 열화우라늄 판재를 추가하고 독특한 형상을 적용하면 차량의 전반적인 장갑 방호력을 높일 수 있습니다.\n\n§G설계 힌트: 중량 NERA는 더 단순한 복합 장갑보다 저항력이 높지만 비용도 더 비쌉니다.§!"
 nera_armor_gen3: "3세대 중량 NERA"
 nera_armor_gen3_desc: "티타늄 또는 열화우라늄 판재를 추가하고 독특한 형상을 적용하면 차량의 전반적인 장갑 방호력을 높일 수 있습니다.\n\n§G설계 힌트: 중량 NERA는 더 단순한 복합 장갑보다 저항력이 높지만 비용도 더 비쌉니다.§!"
 front_mounted_engine: "전면 장착 엔진"
 front_mounted_engine_desc: "전면 장착 엔진은 엔진을 승무원 방호의 일부로 활용하여, 관통탄이 승무원실에 들어오지 않고 엔진에 맞도록 하는 설계 원칙입니다.\n\n§G설계 힌트: 상당한 신뢰성 저하를 감수하는 대신 장갑, 방어력, 돌파력을 높이려면 이 모듈을 사용하십시오.§!"
 tank_dozer_blades: "전차 도저 블레이드"
 tank_dozer_blades_desc: "전차 전면에 장착되어 참호와 기타 방어 구조물을 파는 데 도움을 주는 도저 블레이드입니다.\n\n§G설계 힌트: 돌파력을 희생하는 대신 전차의 방어력과 장갑을 높이려면 이 모듈을 장비하십시오.§!"
 medium_tank_chassis_0: "1세대 전차 차체"
 medium_tank_chassis_0_desc: "냉전 초기의 전차 차체입니다. 동서 간의 새로운 분쟁 가능성에 대비해 서둘러 개발되었으며, 제2차 세계 대전 말기의 전차와 매우 유사했습니다."
 medium_tank_chassis_1: "2/3세대 전차 차체"
 medium_tank_chassis_1_desc: "냉전 시대의 차체입니다. 이 시기에는 전자 장비가 전차에 더욱 긴밀하게 통합되었고, 장갑이 단순 강철에서 복합 장갑으로 바뀌었으며, 전차포의 구경이 커졌습니다. 이러한 전차 다수는 수많은 개량 패키지를 거치면서 21세기에도 여전히 대규모로 사용되고 있습니다."
 medium_tank_chassis_2: "3+세대 전차 차체"
 medium_tank_chassis_2_desc: "현대 시대의 전차 차체입니다. 냉전 말기로 갈수록 전차 개발은 크게 둔화되었고, 많은 나라가 완전히 새로운 설계를 만드는 대신 기존 설계를 개량하는 쪽을 택했습니다. 더 위험한 대전차 무기가 개발되고 나서야 새로운 설계의 필요성이 생겼습니다."
 medium_tank_chassis_3: "4세대 전차 차체"
 medium_tank_chassis_3_desc: "또 하나의 현대 시대 전차 차체로, 주로 전차 설계를 거의 백지에서 만들어야 했던 신흥 강국들이 개발했습니다."
 medium_tank_chassis_4: "5세대 전차 차체"
 medium_tank_chassis_4_desc: "미래 시대의 전차입니다. 대전차 무기가 급속히 발전하고 전투의 무게중심이 항공 전력으로 옮겨 가면서 주력전차는 갈수록 두려운 적수가 아니게 되었습니다. 전차가 미래 전쟁에서도 유효한 선택지로 살아남으려면 설계와 역할을 완전히 다시 생각해야 합니다."
 medium_tank_amphibious_chassis_0: "1세대 병력수송장갑차(APC)차체"
 medium_tank_amphibious_chassis_0_desc: "냉전 초기에 등장한 초기 설계입니다."
 medium_tank_amphibious_chassis_1: "2/3세대 병력수송장갑차(APC)차체"
 medium_tank_amphibious_chassis_1_desc: "선대 모델을 개량하여 의도된 역할에 훨씬 더 적합해진 병력 수송 장갑차입니다."
 medium_tank_amphibious_chassis_2: "3+세대 병력수송장갑차(APC)차체"
 medium_tank_amphibious_chassis_2_desc: "대체로 우수한 인체공학과 적절한 방호력을 갖추어 임무를 잘 수행하는 장갑차량입니다."
 medium_tank_amphibious_chassis_3: "4세대 병력수송장갑차(APC)차체"
 medium_tank_amphibious_chassis_3_desc: "APC 개념이 다소 시대에 뒤처진 듯 보이지만, 장갑 보병의 적은 승무원 규모는 전혀 이점이 아니며 APC가 적절한 대안이 될 수 있습니다."
 medium_tank_amphibious_chassis_4: "5세대 병력수송장갑차(APC)차체"
 medium_tank_amphibious_chassis_4_desc: "IFV의 저가형으로, 인간이 아니고서는 살아남을 수 없는 상황에서도 여전히 유용하게 쓰일 수 있습니다."
 medium_tank_flame_chassis_0: "1세대 보병전투차(IFV)차체"
 medium_tank_flame_chassis_0_desc: "전장에서 보병을 지원하기 위한 장갑차량의 초기 설계입니다. 소련이 BMP-1으로 실전에 가장 먼저 투입했지만, 미국과 동맹국들도 예상보다 훨씬 일찍 뒤를 따랐습니다."
 medium_tank_flame_chassis_1: "2/3세대 보병전투차(IFV)차체"
 medium_tank_flame_chassis_1_desc: "개선된 IFV 설계로 전투에서 더욱 효율적으로 운용할 수 있습니다."
 medium_tank_flame_chassis_2: "3+세대 보병전투차(IFV)차체"
 medium_tank_flame_chassis_2_desc: "현대적이고 위협적인 이 차량은 보병을 전장의 여왕으로 만드는 '전력 증강 요소'입니다."
 medium_tank_flame_chassis_3: "4세대 보병전투차(IFV)차체"
 medium_tank_flame_chassis_3_desc: "필요한 한 보병을 수송하고 지원하기 위한 전차형 플랫폼입니다."
 medium_tank_flame_chassis_4: "5세대 보병전투차(IFV)차체"
 medium_tank_flame_chassis_4_desc: "첨단의 복잡한 IFV 설계입니다. 그야말로 전쟁의 야수입니다."
 medium_tank_artillery_chassis_0: "1세대 자주포 차체"
 medium_tank_artillery_chassis_0_desc: "자주포란 차량에 설치된 포병을 가리키며, 차량 차체를 이용해 자체 동력을 얻으므로 다른 차량의 견인이 필요 없습니다. 대부분 경장갑으로 보호됩니다. 포병은 일반적으로 곡사포, 박격포, 캐논포, 대전차포, 로켓 발사기 또는 대공포입니다."
