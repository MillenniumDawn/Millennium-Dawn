 UKR_Develop_Domestic_ATGM_Stuhna_P_kyiv_expansion_tt: "§Y240~300일§! 뒤 §Y키이우§!가 §G군수 공장 1개§!를 얻고, 우리는 자체 생산 라인을 갖춘 §YRK-2 스투흐나-P§! 설계를 받습니다."
 ukraine_equipment_develop_domestic_atgm.2.name: "RK-2 '스투흐나-P' 대전차 유도 미사일: 생산 준비 완료"
 ukraine_equipment_develop_domestic_atgm.2.desc: "루치 설계국 공장의 확장과 설비 교체를 마쳤으므로 RK-2 '스투흐나-P' 대전차 유도 미사일의 본격적인 생산을 시작할 수 있습니다."
 ukraine_equipment_develop_domestic_atgm.2.a: "좋아! 이제 생산을 개시하자"
 UKR_equipment_develop_domestic_corsar_atgm: "§YRK-3 '코르사르'§! 대전차 유도 미사일 개발"
 UKR_equipment_develop_domestic_corsar_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_rk3_corsar_for_tooltip\n\n\n\n\n\n\n\n\n§W§YRK-3 '코르사르'§!는 §L루치 설계국§!이 개발한 §Y[ROOT.GetFlag]우크라이나§!제 휴대용 경량 대전차 유도 미사일입니다.\n§Y'코르사르'§!는 §Y9K113 '콘쿠르스'§!와 §Y9K111 '파고트'§! 같은 소련 시대 대전차 체계를 대체할 것으로 보입니다.\n고정 표적과 이동하는 장갑 표적을 파괴하기 위한 무기이며, 방어 진지, 경장갑 목표물, 헬리콥터에도 사용할 수 있습니다.\n발사는 거치대에서도, 참호 흉장에서도 할 수 있습니다. 유도 방식은 레이저 빔 라이딩입니다.\n------------------\n이 결정은 같은 장비 범주의 다음 §Y1§!개 결정을 해금하기 위한 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 이후 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_equipment_develop_domestic_corsar_atgm_flag: "완료된 결정: §YRK-3 '코르사르' 대전차 유도 미사일 개발§!"
