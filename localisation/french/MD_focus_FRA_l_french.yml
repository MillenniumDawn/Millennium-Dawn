 FRA_corporate_systems_events.7.a_military: "Engagements de R&D militaires"
 FRA_corporate_systems_events.7.a_tt: "Souveraineté stratégique : §G+0.4§!\nIntégration européenne : §G+0.4§!\nGagne un bonus de recherche de §G10%§! pour la §Ytechnologie internet§!.\nGagne un bonus de recherche de §G5%§! pour l'§Yéquipement de commandement et de contrôle§!."
 FRA_corporate_systems_events.7.b: "Autoriser une intégration sans restriction"
 FRA_corporate_systems_events.7.b_tt: "Souveraineté stratégique : §R-0.3§!\nSanté d'Alcatel : §G+0.4§!"
 FRA_corporate_systems_events.7.c: "Rechercher un contrôle français exceptionnel"
 FRA_corporate_systems_events.7.c_tt: "Souveraineté stratégique : §G+0.6§!\nIntégration européenne : §R-0.5§!\nSanté d'Alcatel : §R-0.3§!"
 FRA_corporate_systems_events.7.d: "Nokia contrôle désormais Alcatel-Lucent, intégrant l'ancien champion français à un plus grand groupe de réseaux européen. La France doit déterminer avec quelle fermeté faire respecter les engagements sur la recherche, l'emploi et les capacités stratégiques."
 FRA_corporate_systems_events.7.t: "Un pilier français au sein de Nokia"
 FRA_corporate_systems_mobilcom_settlement_burden: "Fardeau du règlement MobilCom"
 FRA_corporate_systems_mobilcom_settlement_burden_desc: "France Télécom a reconnu d'importants passifs liés à MobilCom et à son expansion rapide. La transaction réduit l'incertitude, mais son financement contraint l'investissement."
 FRA_corporate_systems_shift_plan_restructuring: "Restructuration du plan Shift"
 FRA_corporate_systems_shift_plan_restructuring_desc: "Alcatel-Lucent se concentre sur le réseau IP, le cloud et l'infrastructure ultra-haut débit tout en coupant les coûts et vendant les actifs non stratégiques. La transition contraint temporairement la production pendant que l'entreprise reconstruit son portefeuille technologique."
 FRA_corporate_systems_telecom_crash_restructuring: "Restructuration en cas de crash des télécommunications"
 FRA_corporate_systems_telecom_crash_restructuring_desc: "Alcatel ferme des sites et réduit les capacités après l'effondrement du marché des équipements télécoms. Les mesures allègent la pression de long terme sur le bilan mais perturbent la production industrielle et l'emploi à court terme."
 FRA_corporate_systems_vendor_replacement_burden: "Fardeau du remplacement des fournisseurs 5G"
 FRA_corporate_systems_vendor_replacement_burden_desc: "Les restrictions sur les autorisations Huawei forcent les opérateurs à remplacer les équipements installés et à revoir les plans de déploiement. La transition renforce le contrôle de long terme sur les réseaux critiques mais ralentit le déploiement."
 FRA_corporate_systems_wireless_exit_costs: "Coûts de sortie de ST-Ericsson"
 FRA_corporate_systems_wireless_exit_costs_desc: "La dissolution de ST-Ericsson exige des dépréciations, des transferts de personnel et un partage coûteux de la technologie et des actifs. La sortie élimine un fardeau de long terme mais perturbe la recherche sans fil à court terme."
