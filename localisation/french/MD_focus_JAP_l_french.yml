 JAP_whistleblower_protection_act: "Loi sur la protection des lanceurs d'alerte"
 JAP_whistleblower_protection_act_desc: "Les auditeurs ne peuvent lire que ce qu'une firme leur remet, tandis que les employés savent quels prêts ont été reconduits et quelles factures antidatées. Ils travaillent pour l'entreprise qu'ils devraient accuser, dans un marché du travail qui n'offre qu'une carrière et aucune seconde chance. Un statut rendant le licenciement pour révélation illégal transforme des témoins silencieux en déposants."
 JAP_financial_revival_program: "Le programme de renaissance financière"
 JAP_financial_revival_program_desc: "Les banques notent leurs propres emprunteurs, et les notes cachent une incapacité à payer. Le programme de renaissance financière applique une évaluation en flux de trésorerie actualisés à chaque exposition majeure, resserre les limites actif-fonds propres, et publie une cible de réduction de moitié du ratio de créances douteuses. Les fédérations d'affaires l'appelleront une guerre à l'industrie, et elles n'ont pas tout à fait tort."
 JAP_special_investigation_unit: "Département des enquêtes spéciales"
 JAP_special_investigation_unit_desc: "Un audit produit une constatation, un procureur produit un prévenu. Le département des enquêtes spéciales du parquet de Tokyo a fait chuter des ministres et est la seule institution avec laquelle un conseil de keiretsu ne peut régler discrètement. Il est pointé sur les bilans."
 JAP_special_investigation_unit_TT: "L'obstruction s'accumule désormais §G25% plus lentement§!"
 JAP_the_lost_decade_ends: "La décennie perdue s'achève"
 JAP_the_lost_decade_ends_desc: "La dernière des firmes insolvables passe par les tribunaux et le registre est clos. Rien n'a été refinancé, chaque perte a été passée là où elle tombait, et le crédit n'atteint désormais que les firmes qui peuvent le rembourser. Une économie dont les livres disent ce qui est réellement vrai est le seul fondement sur lequel tout le reste peut se bâtir.\n-------------\nCe focus §Gretire§! §Y$JAP_zombie_companies$§! et la §Y$JAP_liquidation_wave$§! venue avec la liquidation."
 JAP_controlled_downsize_TT: "Lance la §Yvague de liquidation§! : les firmes sont liquidées au §Gdouble du rythme§! d'un programme de fusions, au prix d'un §Resprit national sévère§! jusqu'à l'achèvement de la liquidation"
 JAP_forced_mergers_TT: "Lance le §Yprogramme de fusions§! : bon marché et doux maintenant, §Rla moitié de la vitesse de liquidation§!, et une marque permanente sur l'industrie japonaise ensuite"
 JAP_liquidation_wave: "La vague de liquidation"
 JAP_liquidation_wave_desc: "La liquidation est en cours. Les avis de faillite remplissent les pages économiques, les chantiers restent oisifs tandis que leurs promoteurs sont liquidés, le chômage explose, et le gouvernement doit emprunter pour amortir le choc. La douleur est sévère et concentrée, mais elle est temporaire.\n-------------\nLevé une fois que le §Yprogrès de la restructuration des entreprises§! a fini de liquider les firmes zombies."
 JAP_fusion_restructuring: "Orientation administrative"
 JAP_fusion_restructuring_desc: "Le ministère trace les lignes et les banques apportent la dot. Personne n'est renvoyé, personne n'avoue l'échec, et deux forces de vente qui se haïssent depuis trente ans apprennent qu'elles ne font plus qu'une entreprise. Le registre raccourcit chaque trimestre. Le coût est dans la stagnation, non dans le chômage.\n-------------\nLevé une fois que le §Yprogrès de la restructuration des entreprises§! a fini d'absorber les firmes zombies."
 JAP_consolidated_conglomerates: "Consolidée Japon Inc."
 JAP_consolidated_conglomerates_desc: "Les noms insolvables ont disparu du registre, absorbés plutôt que liquidés. Ce qui les a remplacés, ce sont des groupes plus vastes portant des usines en double, des divisions de recherche en double, et des managers qui répondent à un conseil qui les a achetés contre leur gré. L'État a les champions nationaux qu'il a demandés. Il a aussi une base industrielle qui innove plus lentement que celle dont il est parti."
 JAP_zombie_investigation_category: "L'enquête sur les entreprises zombies"
 JAP_zombie_investigation_category_desc: "Auditors and prosecutors are working through the ledgers of Japan's insolvent borrowers, and the firms are working just as hard to stop them.\n\n$JAP_case_files$: [?JAP_zombie_case_files|0] / 14\n$JAP_obstruction$: [?JAP_zombie_obstruction|0] / 100\n\n§YWhat you can do§!\nEach case below can be prosecuted, quietly rescued, or waved through. Prosecution builds the strongest file and costs you the most with the §Yindustrial conglomerates§!, whose opinion drives real output. A rescue builds a thinner file at the taxpayer's expense. Waving a case through builds nothing.\n\n§GThe Report§!\nGraded when the investigation closes.\n§G10 or more§! files: a full reckoning that drives faster wind-down.\n§G3 to 9§!: a partial report.\n§RUnder 3§!: a whitewash that wipes the files gathered and slows the wind-down.\n§Y$JAP_controlled_downsize$§! requires 10 or more files. §Y$JAP_forced_mergers$§! requires 3 or more files. Neither branch is ever permanently closed, even if the investigation is abandoned or whitewashed.\n\n§RObstruction§!\nRises every month you keep digging, faster the angrier the conglomerates are. At §R30§! the ministry leaks, at §R55§! the business federation issues an ultimatum, and at §R80§! the probe is suspended by scandal. The decisions below push it back down."
 JAP_zombie_investigation_mission: "Conclure l'enquête"
 JAP_zombie_investigation_mission_desc: "L'enquête ne peut durer éternellement. Construisez un dossier digne d'être publié avant que la volonté politique ne s'épuise."
 JAP_zombie_investigation_mission_TT: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 10"
 JAP_keidanren_ultimatum_mission: "L'ultimatum du Keidanren"
 JAP_keidanren_ultimatum_mission_desc: "La fédération d'affaires a dit au gouvernement, dans le langage le plus poli possible, que l'enquête endommage la confiance et devrait être close. Ils nous ont donné jusqu'à la fin du semestre fiscal pour comprendre l'allusion."
 JAP_keidanren_ultimatum_TT: "Bring $JAP_obstruction$ below §Y45§!"
 JAP_case_ltcb_shinsei: "Dossier : l'option de vente Shinsei"
 JAP_case_ltcb_shinsei_desc: "La Long-Term Credit Bank a été nationalisée, nettoyée aux frais du public, et vendue à un groupe d'investissement étranger pour une somme symbolique. Le contrat donnait à l'acheteur le droit de renvoyer tout prêt ayant perdu un cinquième de sa valeur directement à la Deposit Insurance Corporation au prix comptable. Les nouveaux propriétaires l'exercent, et chaque yen de la perte retombe sur le contribuable. Quelqu'un au ministère a signé cette clause."
 JAP_case_sogo_collapse: "Dossier : l'effondrement de Sogo"
 JAP_case_sogo_collapse_desc: "La chaîne de grands magasins doit quelque chose comme deux mille milliards de yens et n'a pas dégagé de vrai profit depuis des années. Le plan sur le bureau du ministère est d'effacer la part publique de la dette et de la laisser commercer. Les journaux ont le plan aussi, et la réaction du public à sauver un détaillant tandis que des firmes ordinaires se voient refuser le crédit a été ce que quiconque aurait pu prédire."
 JAP_case_mycal_bankruptcy: "Dossier : Mycal"
 JAP_case_mycal_bankruptcy_desc: "Le groupe de supermarchés d'Osaka s'est étendu pendant la bulle sur de l'argent que sa banque principale n'a jamais espéré revoir, et il a passé les années depuis à être refinancé plutôt que restructuré. S'il échoue, ce sera la plus grande faillite de la distribution que le pays ait enregistrée, et elle emportera une chaîne de fournisseurs du Kansai avec elle."
 JAP_case_resona_injection: "Dossier : Résona"
 JAP_case_resona_injection_desc: "Les auditeurs ont refusé de certifier quelle part du capital de la banque consiste en actifs d'impôts différés, c'est-à-dire des profits futurs qu'elle n'a aucune perspective réaliste de gagner. Sans cette fiction la banque est sous-capitalisée. Près de deux mille milliards de yens d'argent public la rendraient entière et la livreraient de fait à l'État. Refuser serait la première faillite d'une grande banque que le gouvernement aurait permise."
 JAP_case_ashikaga_bank: "Dossier : la banque Ashikaga"
 JAP_case_ashikaga_bank_desc: "Ce n'est pas une banque nationale. C'est la banque de Tochigi, où elle tient les comptes du gouvernement préfectoral, de la plupart des firmes locales, et d'un grand nombre de ménages qui n'en ont jamais utilisé d'autre. Elle est aussi insolvable. La nationaliser protège les déposants et détruit les actionnaires, et chaque prêteur régional du pays lira la décision comme une déclaration d'intention."
 JAP_case_daiei_ircj: "Dossier : Daiei"
 JAP_case_daiei_ircj_desc: "Le détaillant qui a appris au Japon le discount porte des dettes en milliers de milliards et a été maintenu debout par des banques qui ne peuvent se permettre d'admettre ce que valent les prêts. La Industrial Revitalization Corporation peut le reprendre, remplacer la direction et vendre les morceaux. Les alliés du fondateur dans le parti préféreraient qu'il soit refinancé une fois de plus."
 JAP_case_kanebo_accounts: "Dossier : les comptes Kanebo"
 JAP_case_kanebo_accounts_desc: "Le groupe de cosmétiques et de textiles déclare depuis cinq ans des profits qu'il n'a pas gagnés, de l'ordre de deux cents milliards de yens. La fraude n'est pas en litige. Ce qui l'est, c'est le cabinet comptable qui a signé chacun de ces états, et si un pays peut avoir des livres honnêtes tandis que ses auditeurs répondent commercialement aux entreprises qu'ils auditent."
 JAP_press_the_prosecutors: "Lâcher les procureurs"
 JAP_press_the_prosecutors_desc: "Laisser le département des enquêtes spéciales procéder à des arrestations plutôt qu'à des transmissions. Rien n'apaise plus vite une campagne de lobbying qu'un directeur escorté hors de son bureau par des hommes munis d'un mandat."
 JAP_whistleblower_immunity_decision: "Accorder l'immunité aux informateurs"
 JAP_whistleblower_immunity_decision_desc: "Offrir aux cadres intermédiaires qui ont exécuté les instructions une protection contre les poursuites en échange d'un témoignage contre ceux qui les ont données. Les conglomérats l'appelleront une invitation à trahir ses collègues. C'en est une."
 JAP_publish_inspection_manual_decision: "Publier les conclusions d'inspection"
 JAP_publish_inspection_manual_decision_desc: "Rendre les évaluations de supervision en entier plutôt que de les résumer pour le ministère. Les marchés n'apprécieront pas de les lire, mais une firme ne peut faire du lobbying contre un chiffre que tout le pays a déjà vu."
 JAP_cooperating_bank_amnesty_decision: "Amnistie pour les banques coopérantes"
 JAP_cooperating_bank_amnesty_decision_desc: "Offrir à toute banque qui ouvre volontairement ses livres l'assurance que ses dirigeants ne seront pas poursuivis. Cela achète la paix, et coûte à l'enquête le dossier qu'elle construisait contre eux."
 JAP_zombie_probe_abandoned_TT: "L'enquête est §Rabandonnée§! et sera publiée comme un blanchiment, effaçant les dossiers rassemblés jusqu'ici et ralentissant le dénouement"
 JAP_zombie_report_strong_TT: "§GUn bilan complet.§! Le dénouement se fera §G25 % plus vite§!"
 JAP_zombie_report_partial_TT: "§YUn rapport partiel.§! Le dénouement se fera au rythme normal"
 JAP_zombie_report_whitewash_TT: "Wind-Down §R25% slower§!"
 Japan_economy.06.c: "Tout arrêter"
 Japan_economy.08.b: "Publier ce que nous avons"
 Japan_economy.08.c: "Publier et espérer que personne ne lira au-delà du résumé"
 Japan_economy.09.b: "Le trouver et en faire un exemple"
 Japan_economy.23.b: "Renégocier discrètement et racheter la clause"
 Japan_economy.23.c: "La vente est faite. Laissons reposer."
 Japan_economy.24.b: "La restructurer hors des gros titres"
 Japan_economy.24.c: "Remettre la dette et passer à autre chose"
 Japan_economy.25.b: "Organiser une cession ordonnée des magasins rentables"
 Japan_economy.25.c: "Faire pression sur la banque pour une année de plus"
 Japan_economy.26.b: "Injecter les fonds et laisser la direction en place"
 Japan_economy.26.c: "Laisser les auditeurs se laisser convaincre"
 Japan_economy.27.b: "La recapitaliser et la garder dans le privé"
 Japan_economy.27.c: "Laisser la préfecture organiser une fusion de sauvetage"
 Japan_economy.28.b: "Soutenir une restructuration négociée"
 Japan_economy.28.c: "Accorder le refinancement"
 Japan_economy.29.b: "Rayer l'entreprise de la cote et laisser les auditeurs transiger"
 Japan_economy.29.c: "Traitez-le comme un échec isolé"
 Japan_economy.33.t: "L'enquête reprend"
 Japan_economy.33.d: "L'examen a trouvé ce que les examens trouvent. Un nouveau chef a été nommé, les dossiers sont revenus, et l'enquête reprend avec le vent plus contraire qu'avant. Les entreprises ont eu six mois pour se préparer, et elles les ont utilisés."
 Japan_economy.33.a: "Recommencez."
 Japan_economy.34.t: "Le registre est propre"
 Japan_economy.34.d: "Le dernier des emprunteurs insolvables a été liquidé. Cela a pris des années, et le coût s'est payé en faillites, en chômage, et en un gouvernement qui a dépensé l'essentiel de son capital politique à insister que la douleur était nécessaire. Ce qui reste, c'est une économie où le crédit va aux entreprises qui peuvent le rembourser, et où un bilan dit ce qu'il dit."
 Japan_economy.34.a: "Cela valait le prix."
 Japan_economy.35.t: "Rien n'a échoué"
 Japan_economy.35.d: "Les noms insolvables ont disparu du registre. Aucun n'a fait faillite. Ils ont été absorbés par des groupes plus grands par arrangement ministériel, et ces groupes portent désormais les usines en double, les laboratoires en double, et le personnel à qui l'on a dit un vendredi qu'il travaillait pour un concurrent le lundi. Aucun emploi n'a été perdu et rien n'a été avoué. L'industrie japonaise est consolidée, stable, et plus lente qu'avant."
 Japan_economy.35.a: "L'arrangement a tenu."
 JAP_electronics_resilience_complete_TT: "La §Yrésilience de l'électronique§! est à §G5§! ou plus (actuellement [?JAP_electronics_resilience|Y0])"
 JAP_electronics_war_won_tt: "§Y$JAP_model_competition$§! prend fin pour de bon et ne peut plus revenir, quoi que fassent ensuite Séoul, Taipei et Shanghai."
 JAP_seismic_retrofitting: "Programme national de renforcement parasismique"
 JAP_seismic_retrofitting_desc: "La loi de 1981 sur les normes de construction fixe un plancher, non un plafond, et les deux tiers du parc de logements lui sont antérieurs. Un programme national de renforcement parcourt le pays région par région, finançant l'isolation à la base pour hôpitaux et mairies, murs de contreventement et chemisage de colonnes pour les écoles, et contreventement d'acier pour les autoroutes surélevées qui s'effondrèrent si spectaculairement à Kobe. La construction devient plus lente et plus chère partout où les inspecteurs sont passés, mais une région renforcée traverse un séisme majeur avec son infrastructure intacte."
 JAP_news.04.t: "Le Japon s'apprête à tourner la page de l'article 9"
 JAP_news.04.d: "La Diète a reçu le rapport final du comité de transition de la défense, et avec lui le Japon a franchi le pas décisif loin de l'article 9 de sa constitution d'après-guerre. Pendant des décennies, la clause renonçant à la guerre et au maintien d'un potentiel de guerre a été gérée par des réinterprétations successives plutôt que par un amendement : les Forces d'autodéfense ont été déclarées constitutionnelles comme capacité minimale nécessaire, les déploiements outre-mer justifiés comme reconstruction et soutien logistique, et l'interdiction de la légitime défense collective a été réduite jusqu'à ce que navires et aéronefs alliés puissent être défendus sous un ensemble limité de conditions. La conclusion du comité est que ce corpus accumulé d'interprétations ne peut plus être étiré pour couvrir les exigences de sécurité du Japon, et que la contrainte doit être écartée plutôt que reformulée une fois de plus.\n\nLes conséquences pratiques sont immédiates. Les restrictions sur la taille et la composition des formations japonaises tombent, les Forces d'autodéfense sont libres de planifier des opérations au-delà de la défense des îles métropolitaines, et Tokyo recouvre les instruments souverains de la guerre et du leadership d'alliance que toute autre grande puissance tient pour acquis. Les officiels japonais ont insisté sur la continuité, décrivant le changement comme la reconnaissance formelle des droits d'un pays normal plutôt qu'une rupture avec soixante-dix ans de retenue. À Pékin, Séoul et Pyongyang, la lecture est très différente, et Washington se trouve désormais allié à un partenaire capable de bien plus que l'accès aux bases et le soutien d'arrière. Quelle que soit la formulation qui prévale, l'architecture de sécurité de l'Asie de l'Est a été réécrite en un après-midi à la Diète."
 JAP_news.04.a: "L'ère pacifiste à Tokyo est révolue."
 JAP_seismic_retrofit: "Rénovation sismique"
 JAP_seismic_retrofit_desc: "Every structure in this region has been surveyed, reinforced or rebuilt to withstand a major earthquake. Hospitals sit on base isolators, the older schools have been jacketed or torn down, and the expressway piers carry steel collars. Stricter codes, mandatory inspections and heavier foundations slow every new project down, but the next tremor will cost the region some roads and nothing more."
 JAP_seismic_retrofit_category: "Rénovation sismique"
 JAP_seismic_retrofit_category_desc: "Earthquake-proofing a region is a decade-long civil engineering effort, prefecture by prefecture and building by building. A retrofitted region still shakes, but loses only some infrastructure to a tremor while its factories and bases hold, at the permanent cost of slower construction under the stricter codes. Retrofitting every earthquake-prone region is one of the two conditions for lifting §Y$JAP_ring_of_fire$§!."
 JAP_seismic_retrofit_decision: "Mise à niveau [FROM.GetName]"
 JAP_seismic_retrofit_decision_desc: "Survey every structure in the region and bring it up to modern seismic standards. A year of work and a substantial share of national output, in exchange for far lighter earthquake damage and a lasting penalty to local construction speed."
 JAP_zombie_companies_1: "Entreprises zombies"
 JAP_zombie_companies_1_desc: "Des années de clémence ont maintenu en vie, à crédit bon marché, des entreprises non rentables et surendettées, immobilisant capital, main-d'œuvre et encadrement dont les industries saines ont besoin. Personne n'a passé de pertes, personne n'a fermé d'usine, et personne ne peut dire quelle part du système bancaire est une fiction.\n-------------\nÀ §Yprogrès de la restructuration des entreprises§! §G30§! vous pouvez prendre §Y$JAP_restructure_next_tranche$§! pour alléger cet esprit national d'un cran. Voir §Y$JAP_corporate_reform_category$§! pour les chiffres actuels."
 JAP_zombie_companies_2: "Entreprises zombies : liquidation"
 JAP_zombie_companies_2_desc: "La première tranche a été résolue. Les prêts ont été passés plutôt que reconduits, les pires insolvables sont passés par les tribunaux, et le capital mort depuis une décennie circule à nouveau. Ce qui reste est plus gros, mieux connecté, et bien plus dur à toucher.\n-------------\nÀ §Yprogrès de la restructuration des entreprises§! §G60§! vous pouvez prendre §Y$JAP_restructure_next_tranche$§! pour alléger encore cet esprit national d'un cran. Voir §Y$JAP_corporate_reform_category$§! pour les chiffres actuels."
 JAP_zombie_companies_3: "Entreprises zombies : derniers registres"
 JAP_zombie_companies_3_desc: "Seuls les derniers livres restent ouverts. Les firmes restantes sont celles aux relations bancaires les plus profondes et à la couverture politique la plus forte, et chacune s'attend à survivre au gouvernement venu les chercher. Le poids sur l'économie élargie est désormais modeste, mais il n'a pas encore disparu.\n-------------\nÀ §Yprogrès de la restructuration des entreprises§! §G85§! le focus de résolution au bout de la voie choisie §Gretire§! cet esprit national pour de bon. Voir §Y$JAP_corporate_reform_category$§! pour les chiffres actuels."
 JAP_saburoku_audit_campaign: "Auditer les accords saburoku"
 JAP_saburoku_audit_campaign_desc: "L'article 36 de la loi sur les normes du travail permet à une firme de dépasser la journée légale de huit heures en déposant un accord avec le représentant des travailleurs, et pendant des décennies le plafond inscrit dans ces accords était ce que l'employeur avait envie d'écrire. Les inspecteurs extraient désormais les dossiers et les confrontent aux registres de présence, aux logs de badges et aux données d'accès aux bâtiments, et la loi de réforme du mode de travail leur donne un chiffre à mesurer : quarante-cinq heures par mois, trois cent soixante par an."
 JAP_paid_leave_enforcement_campaign: "Faire appliquer les cinq jours"
 JAP_paid_leave_enforcement_campaign_desc: "Les travailleurs japonais se voyaient accorder des congés annuels et ne les prenaient pas, car les prendre vous marquait. Depuis 2019 l'obligation court dans l'autre sens : un employeur dont le personnel a dix jours ou plus doit veiller à ce que cinq soient réellement utilisés, et doit nommer lui-même les dates si le salarié ne le fait pas. Le ministère vérifie les registres de congés et amende les firmes dont les livres montrent des droits intacts."
 JAP_equal_pay_audit_campaign: "Auditer les écarts de salaire"
 JAP_equal_pay_audit_campaign_desc: "Quatre travailleurs japonais sur dix sont non réguliers, faisant le même travail à côté d'un collègue permanent pour environ soixante pour cent de la paye et aucune des primes. La loi sur l'emploi à temps partiel et à durée déterminée oblige l'employeur à expliquer toute différence de traitement sur demande, par écrit, et les explications sont recueillies et comparées à l'échelle d'une industrie plutôt que de mourir à l'intérieur d'une seule entreprise."
 JAP_inspector_sweep_campaign: "Balayer les pires contrevenants"
 JAP_inspector_sweep_campaign_desc: "Les bureaux d'inspection des normes du travail choisissent un secteur, arrivent sans préavis et passent les cartes de pointage de chaque firme. Le ministère publie les noms des entreprises trouvées en infraction grave, ce qui coûte à un recruteur bien plus que l'amende, car un diplômé qui a lu la liste ne postule pas."
 JAP_keidanren_review_campaign: "Examiner le respect de la charte"
 JAP_keidanren_review_campaign_desc: "La charte de comportement des entreprises du Keidanren engage ses membres à des pratiques de travail que la plupart n'auditent pas et qu'aucun ne publie. La fédération est persuadée de mener un cycle de conformité avec de vrais retours, membre par membre, et d'en rapporter l'agrégat au ministère. Rien n'est obligatoire et rien n'est nommé, ce qui est précisément pourquoi les groupes d'entreprises y consentent."
 JAP_shunto_wage_round_campaign: "Soutenir l'offensive salariale de printemps"
 JAP_shunto_wage_round_campaign_desc: "Chaque printemps les affiliés du Rengo mettent un chiffre aux employeurs et les employeurs en rendent un plus petit, et pendant deux décennies la composante d'augmentation de base de cet accord a été zéro. Le gouvernement pèse sur les groupes d'entreprises pour concéder une vraie hausse, car un travailleur assez payé pour vivre cesse de prendre les heures supplémentaires qui le tuent, et couple la pression à un allègement fiscal pour les firmes qui bougent les premières."
 JAP_health_stock_listing_campaign: "Élargir la cote de gestion de la santé"
 JAP_health_stock_listing_campaign_desc: "Le ministère et la Bourse de Tokyo nomment conjointement chaque année une poignée de firmes cotées titres de santé et de productivité, sur la théorie qu'une entreprise qui n'épuise pas son personnel est un meilleur placement de long terme. Élargir la sélection et publier la notation transforme la santé au travail en quelque chose qu'un gérant de fonds peut tarifer, ce qui atteint des conseils qu'un inspecteur du travail n'atteindra jamais."
 JAP_shift_rotation_campaign: "Subventionner le poste du matin"
 JAP_shift_rotation_campaign_desc: "Avancer la journée de travail, payer la prime pour les heures du matin plutôt que celles du soir, et couper le courant de l'atelier le soir pour que rester ne soit pas une option. Itochu l'a fait et a vu sa productivité monter et son taux de natalité avec ; l'État paie désormais une part du coût de transition pour toute firme prête à suivre."
 JAP_overcome_the_slump: "Pousser la reprise plus loin"
 JAP_overcome_the_slump_desc: "Les mesures déjà en cours ont assez bougé le grand livre pour mériter d'être consolidées. Un soutien présenté comme temporaire est inscrit au budget de base, les ministères cessent de traiter le marasme comme hypothèse de travail, et l'on dit clairement aux entreprises que la demande est censée tenir. Chaque pas allège §Y$JAP_entrenched_demand_shortfall_idea_1$§! d'un palier ; pris à la fin, il clôt le long marasme pour de bon."
 JAP_demand_recovery_progress_tier_1_TT: "§YProgression de la reprise de la demande§! est d'au moins §G30§!"
 JAP_demand_recovery_progress_tier_2_TT: "§YProgression de la reprise de la demande§! est d'au moins §G60§!"
 JAP_demand_recovery_progress_complete_TT: "§YProgression de la reprise de la demande§! est d'au moins §G85§!"
 JAP_demand_shortfall_resolved: "Le §Ymarasme de la demande§! du Japon a été surmonté"
 JAP_restructure_next_tranche: "Résoudre la tranche suivante"
 JAP_restructure_next_tranche_desc: "Assez du grand livre a été travaillé pour en clore un lot pour de bon. Le régulateur publie les dossiers réglés, les banques passent les pertes qu'elles reportaient, et les firmes de cette tranche ressortent solvables ou cessent d'exister. Chaque tranche allège §Y$JAP_zombie_companies$§! d'un cran ; l'apurement final vient avec le focus au bout de la voie choisie."
 JAP_enforce_next_reforms: "Faire appliquer les réformes suivantes"
 JAP_enforce_next_reforms_desc: "Les mesures déjà inscrites sont mises en vigueur plutôt que laissées comme intentions. Les plafonds consultatifs deviennent exécutoires, les exemptions écrites pour les plus gros employeurs se resserrent, et l'inspection reçoit le personnel pour donner suite à ce qu'elle trouve. Chaque round allège §Y$JAP_karoshi_crisis$§! d'un cran ; la crise est levée pour de bon par le focus au bout de la voie choisie."
 JAP_galapagos_drift_review_mission: "L'écart de normes"
 JAP_galapagos_drift_review_mission_desc: "Le ministère de l'Économie, du Commerce et de l'Industrie tient une évaluation permanente de l'éloignement de la spécification japonaise de celle qu'utilisent ses clients, et en rapporte le chiffre tous les trente jours. Chaque rapport est pire que le précédent, car la divergence se compose tant que rien n'est fait et que les organismes de certification écrivent d'abord la clause intérieure. Plus l'§Youverture§! est basse, plus l'écart s'élargit vite ; à §G100§! il cesse complètement de s'élargir.\n-------------\nL'évaluation se clôt pour de bon lorsque le Japon atteint §G85§! d'§Youverture§! sur la voie §Y$JAP_world_integration$§!. Rien d'autre n'y met fin."
 JAP_galapagos_cure_condition_TT: "L'§Youverture§! est à §G85§! ou plus (actuellement [?JAP_galapagos_openness|Y0]), dissolvant §Y$JAP_galapagos_syndrome$§!"
 JAP_cool_japan_sphere_count_mission: "Décompte trimestriel des sphères"
 JAP_cool_japan_sphere_count_mission_desc: "Une fois par trimestre le Bureau de promotion des industries créatives recense chaque pays où l'influence japonaise atteint vingt pour cent ou plus et dépose le total comme chiffre d'exportation. Les délégations commerciales planifient le trimestre suivant autour de la liste, et les firmes qui les suivent à l'étranger planifient autour des délégations. Une sphère qui cesse de croître cesse de payer, et le décompte est le seul endroit où cela se voit avant les recettes."
 JAP_cool_japan_sphere_count_step_tt: "§YSphère culturelle§! : [?JAP_galapagos_sphere_count|Y0] pays portant §G20 %§! d'influence japonaise ou plus au dernier décompte. Chacun vaut §G+1 %§! d'§Yinfluence étrangère§! et §G+0,2 %§! de §Yretour sur investissement§!, relevé de moitié avec §Y$JAP_electronics_superpower$§! et d'un quart supplémentaire avec §Y$JAP_home_electronics$§!."
 JAP_zombie_companies_resolved: "Les §Yentreprises zombies§! du Japon ont été pleinement liquidées"
 JAP_corporate_restructuring_complete_TT: "§YProgression de la restructuration des entreprises§! est d'au moins §G85§!"
 JAP_restructure_tranche_1_TT: "§YProgression de la restructuration des entreprises§! est d'au moins §G30§!"
 JAP_restructure_tranche_2_TT: "§YProgression de la restructuration des entreprises§! est d'au moins §G60§!"
 JAP_karoshi_wellbeing_tier_1_TT: "$JAP_worker_wellbeing$ is at least §G30§!"
 JAP_karoshi_wellbeing_tier_2_TT: "$JAP_worker_wellbeing$ is at least §G60§!"
 JAP_karoshi_wellbeing_complete_TT: "$JAP_worker_wellbeing$ is at least §G85§!"
 JAP_zombie_case_files_down_3_tt: "$JAP_case_files$: §R-3§!"
 JAP_zombie_case_files_downsize_tt: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 10"
 JAP_zombie_case_files_fusion_tt: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 3"
 JAP_zombie_case_choice_TT: "Possible outcomes:\n\nProsecution:\n §G+2§! $JAP_case_files$\n§R+8§! $JAP_obstruction$\n\nRescue Quietly:\n§G+1§! $JAP_case_files$\n§R+2§! $JAP_obstruction$\n\nWave it Through:\n §G-3§! $JAP_obstruction$"
 JAP_zombie_whitewash_penalty_TT: "Un blanchiment §Refface les dossiers§! rassemblés jusqu'ici et ralentit le dénouement de §R25 %§!. Aucune des deux issues n'est perdue : les affaires restantes peuvent encore être traitées"
 JAP_seismic_retrofit_tt: "£trigger_yes §YANBâtiments résistants aux tremblements de terre§!"
 JAP_electronics_resilience_below_5_tt: "La §Yrésilience de l'électronique§! est inférieure à §G5§! (actuellement [?JAP_electronics_resilience|Y0])"
 intellectual_platform_rejected: "La plateforme intellectuelle Chine-Corée-Japon rejetée"
 JAP_seek_permanent_unsc_seat: "Briguer un siège permanent au Conseil de sécurité de l'ONU"
 JAP_seek_permanent_unsc_seat_desc: "L'influence économique du Japon et ses contributions aux Nations unies justifient un rôle permanent dans la sécurité internationale. L'obtenir exigera un lobbying soutenu et l'approbation des deux chambres du système des Nations unies."
 JAP_zombie_probe_abandoned: "La sonde Zombie Firm abandonnée"
 JAP_electronics.300.t: "Sony Ericsson est créé"
 JAP_electronics.300.d_agreed: "Ericsson a accepté de fusionner son activité téléphones avec celle de Sony. Aucune des deux ne vend assez de téléphones seule pour compter face à Nokia et Motorola, et ensemble elles auraient l'ingénierie radio suédoise et le design grand public japonais dans une même coentreprise. Sony peut s'y engager, ou garder le mobile dans le groupe et continuer seule."
 JAP_electronics.300.d_alone: "L'activité téléphones suédoise avec laquelle Sony espérait s'associer a pris un autre cours. Sony peut encore bâtir une activité mobile aux conditions disponibles, ou garder les téléphones dans le groupe et accepter une part plus petite d'un marché qu'elle ne mène pas."
 JAP_electronics.300.a: "S'engager dans la coentreprise mobile"
 JAP_electronics.300.b: "Garder le mobile dans le groupe"
 JAP_electronics.301.t: "Le dilemme de la musique numérique"
 JAP_electronics.301.d: "Sony possède à la fois le matériel qui joue la musique et le catalogue qui la remplit, et les deux moitiés veulent des choses opposées. Protéger le catalogue, c'est des lecteurs qui refusent les formats que les auditeurs utilisent déjà. Ouvrir les lecteurs, c'est la division disques qui voit ses propres appareils transporter les fichiers des autres."
 JAP_electronics.301.a: "Protéger le catalogue avec nos propres formats"
 JAP_electronics.301.b: "Ouvrir les lecteurs à ce que les gens possèdent déjà"
 JAP_electronics.302.t: "Le pari de la PlayStation 3"
 JAP_electronics.302.d: "La PlayStation 3 peut être construite autour de Cell, un processeur que Sony a conçu de zéro avec IBM et Toshiba, difficile à programmer et différent de tout le reste du secteur. La console se vendrait alors à perte pendant des années dans l'espoir que le logiciel rattrape. Ou elle peut être construite comme Microsoft a construit la Xbox 360, et sortir plus tôt pour moins cher."
 JAP_electronics.302.a: "Construire la machine autour de la nouvelle architecture"
 JAP_electronics.302.b: "Construire une console classique et la sortir plus tôt"
 JAP_electronics.303.t: "Un Sony"
 JAP_electronics.303.d: "Les divisions de Sony se gèrent elles-mêmes depuis des décennies, et cela se voit dans des produits qui ne fonctionnent pas ensemble et dans le même travail d'ingénierie fait quatre fois. Les ramener sous une seule stratégie, c'est passer outre des gens qui ont eu raison auparavant. Les laisser seules préserve ce que l'indépendance a bâti."
 JAP_electronics.303.a: "Ramener les divisions sous une seule stratégie"
 JAP_electronics.303.b: "Laisser aux divisions leur indépendance"
 JAP_electronics.304.t: "Le pivot des capteurs d'image"
 JAP_electronics.304.d: "Les capteurs d'image de Sony siègent dans des téléphones fabriqués par des entreprises concurrentes, et la demande croît plus vite que les usines ne peuvent servir. Faire des capteurs le centre de l'entreprise, c'est du capital promis aux divisions grand public. Ne pas le faire, c'est céder l'avance à qui construira la capacité le premier."
 JAP_electronics.304.a: "Faire des capteurs d'image le centre de l'entreprise"
 JAP_electronics.304.b: "Garder le capital dans les produits grand public"
 JAP_electronics.305.t: "Ce que Sony est devenu"
 JAP_electronics.305.d: "Un quart de siècle de coentreprises, de formats, d'architectures et de restructurations a fixé ce qu'est Sony et à quoi sert l'électronique grand public japonaise. L'entreprise qui vendait autrefois les produits fournit désormais les pièces à l'intérieur de ceux des autres."
 JAP_electronics.305.a: "Une entreprise à travers le matériel, le contenu et les services"
 JAP_electronics.305.b: "Une fédération d'entreprises de matériel"
 JAP_electronics.305.c: "Une architecture de calcul souveraine"
 JAP_electronics.305.e: "Un Commonwealth numérique ouvert"
 JAP_sony_one_sony_ecosystem: "Un Sony"
 JAP_sony_one_sony_ecosystem_desc: "Les divisions répondent à une seule stratégie, et les capteurs, le catalogue, la console et les services ont été conçus pour se renforcer plutôt que de se disputer le même budget. La coordination coûte de la vitesse et la rend en faisant tout sortir comme une seule chose."
 JAP_sony_hardware_federation: "Fédération du matériel"
 JAP_sony_hardware_federation_desc: "Les divisions ont gardé leur indépendance et chacune est devenue redoutable dans son propre métier. Rien de ce que Sony fabrique n'est conçu en pensant au reste de Sony, et chaque pièce est très bonne."
 JAP_sony_cell_sovereign_compute: "Architecture informatique souveraine"
 JAP_sony_cell_sovereign_compute_desc: "Le Japon a bâti une architecture de processeur à lui et l'a payée d'une génération de consoles. Ce que le secteur a appris à programmer a survécu à la machine qui le portait."
 JAP_sony_open_digital_commonwealth: "Commonwealth numérique ouvert"
 JAP_sony_open_digital_commonwealth_desc: "Les formats se sont ouverts, le catalogue a voyagé, et le matériel a cessé de se battre avec ce que les gens possédaient déjà. Sony gagne moins par appareil et ses produits sont dans bien plus de mains."
 JAP_electronics.310.t: "Deux écrans, deux machines"
 JAP_electronics.310.d: "La Game Boy Advance et la GameCube de Nintendo ont des équipes séparées, des architectures séparées et des catalogues séparés, et chaque jeu doit être construit pour l'une ou l'autre. Les garder toutes deux, c'est financer deux plateformes avec une seule entreprise. Les fusionner mettrait fin à l'activité portable qui paie tout le reste."
 JAP_electronics.310.a: "Financer à la fois le portable et la console"
 JAP_electronics.310.b: "Tout concentrer sur une seule plateforme"
 JAP_electronics.311.t: "La Wii et le grand public"
 JAP_electronics.311.d: "La prochaine console de Nintendo peut courir après ceux qui n'achètent pas de consoles, avec du matériel moins cher, un schéma de contrôle que personne n'a encore commercialisé, et aucune de la puissance graphique que la presse mesure. Ou elle peut affronter Sony et Microsoft aux termes que le secteur a déjà acceptés, et être jugée par eux."
 JAP_electronics.311.a: "Construire pour ceux qui n'achètent pas de consoles"
 JAP_electronics.311.b: "Concurrencer sur la performance"
 JAP_electronics.312.t: "La Wii U ne s'explique pas"
 JAP_electronics.312.d: "La nouvelle console s'est assez mal vendue pour poser la question que personne ne veut poser : Nintendo doit-elle encore fabriquer du matériel ? Ses logiciels se vendraient sur n'importe quelle machine, et les pertes cesseraient. Rester dans le matériel, c'est financer une autre génération sur l'échec de la précédente."
 JAP_electronics.312.a: "Rester dans le matériel et financer une autre génération"
 JAP_electronics.312.b: "Quitter le matériel et mettre les jeux partout"
 JAP_electronics.313.t: "Nintendo et le téléphone"
 JAP_electronics.313.d: "Les personnages de Nintendo valent plus que son matériel, et chaque téléphone au monde pourrait les porter. Les licencier rapporte de l'argent d'un public que les consoles n'atteignent jamais. Refuser les garde exclusifs aux machines que Nintendo contrôle, ce qui est la raison pour laquelle on achète ces machines."
 JAP_electronics.313.a: "Licencier les personnages sur mobile"
 JAP_electronics.313.b: "Les garder exclusifs à notre matériel"
 JAP_electronics.314.t: "Le basculement"
 JAP_electronics.314.d: "Une machine qui soit à la fois le portable et la console mettrait fin à la scission qui divise l'ingénierie de l'entreprise depuis deux décennies, et cela signifie un catalogue, une équipe, et un seul échec si cela ne marche pas. Garder les gammes séparées, c'est ce que Nintendo sait faire."
 JAP_electronics.314.a: "Construire une machine qui soit les deux"
 JAP_electronics.314.b: "Garder le portable et la console séparés"
 JAP_electronics.315.t: "Ce que Nintendo est devenu"
 JAP_electronics.315.d: "Un quart de siècle de matériel que personne d'autre n'aurait construit a fixé ce qu'est Nintendo et quelle part du divertissement japonais passe par elle. Les personnages ont survécu à chaque machine qui les portait."
 JAP_electronics.315.a: "Une plateforme hybride disciplinée"
 JAP_electronics.315.b: "Un écosystème de divertissement intégré"
 JAP_electronics.315.c: "Un concédant mondial de licences de personnages"
 JAP_electronics.315.e: "Un Commonwealth ouvert aux développeurs"
 JAP_nintendo_disciplined_hybrid_platform: "Plateforme hybride disciplinée"
 JAP_nintendo_disciplined_hybrid_platform_desc: "Une machine, un catalogue, et une organisation d'ingénierie derrière les deux. Nintendo a cessé de concurrencer sur les spécifications que tout le monde affiche et a commencé à livrer du matériel qui coûte moins à produire qu'il ne se vend."
 JAP_nintendo_integrated_entertainment_ecosystem: "Écosystème de divertissement intégré"
 JAP_nintendo_integrated_entertainment_ecosystem_desc: "Les personnages passent par les parcs, les films et les produits dérivés autant que par les machines, et chaque partie vend les autres. Les exportations de divertissement japonais reposent sur des propriétés qu'une seule entreprise possède encore en propre."
 JAP_nintendo_global_ip_licensor: "Concédant de licence mondial"
 JAP_nintendo_global_ip_licensor_desc: "Le matériel est devenu un canal de distribution parmi d'autres. Nintendo gagne sur des personnages qui apparaissent sur des machines qu'elle ne construit pas, sur des marchés que ses consoles n'ont jamais atteints."
 JAP_nintendo_open_developer_commonwealth: "Commonwealth des développeurs ouverts"
 JAP_nintendo_open_developer_commonwealth_desc: "La plateforme s'est ouverte aux développeurs à des conditions qui n'exigent pas d'abord une permission. Nintendo prend une plus petite part d'un catalogue bien plus vaste, et les machines portent des œuvres qu'elle n'aurait jamais commandées."
