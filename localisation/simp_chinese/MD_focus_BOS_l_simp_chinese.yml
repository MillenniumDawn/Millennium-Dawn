 news.83.t: "波斯尼亚重回内战"
 news.83.desc: "塞族共和国宣布独立，波斯尼亚和黑塞哥维那再次陷入内战。国际组织呼吁立即停火，各方武装力量正在全国范围内集结。"
 news.83.a: "代顿和平协议失败了"
 news.84.t: "波斯尼亚圣战者加入波斯尼亚战争"
 news.84.desc: "波斯尼亚圣战者武装已与萨拉热窝决裂，并在波斯尼亚宣布建立伊斯兰国家。他们的介入使冲突中出现了第三个武装派别，并招致邻国政府的谴责。"
 news.84.a: "战争已经升级"
 news.86.t: "波斯尼亚内战结束了"
 news.86.desc: "战胜方击败了残余的分裂势力，重新控制了波斯尼亚和黑塞哥维那。政府现在面临复员、重建以及再次尝试政治解决等问题。"
 news.86.a: "战斗结束了"
