 MER_ECU_civilian_industry: "対エクアドル民需産業投資"
 MER_ECU_civilian_industry_desc: "正式加盟への道筋の一環として、エクアドルの首都における新たな民間投資事業を支援する。"
 MER_ECU_infrastructure_development: "対エクアドルインフラ開発支援"
 MER_ECU_infrastructure_development_desc: "加盟準備を強化するため、エクアドルの首都における的を絞ったインフラ改良を支援する。"

