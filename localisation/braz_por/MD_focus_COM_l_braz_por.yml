 COM_pro_federalist: "Resultado do Referendo: Pró-Federalista"
 COM_anti_federalist: "Resultado do Referendo: Governo Centralista"
 COM_successful_operation: "Operação Bem-Sucedida"
 COM_robert_denard_seized_power: "§YRobert Denard§! Tomou o Poder"
 COM_disbanded_presidential_guard: "Dissolveu a §YGuarda Presidencial§!"
 COM_island_warlord: "Senhor da Guerra da Ilha"
 COM_our_own_path: "Nosso Próprio Caminho"
 COM_our_own_path_desc: "É hora de as Comores traçarem seu próprio rumo. Moldando nossas forças armadas às necessidades e desafios singulares da nossa nação, podemos construir uma força ao mesmo tempo focada e adaptável. Desenvolver nossa própria doutrina garantirá que estejamos preparados para qualquer conflito que surja, em vez de depender de modelos estrangeiros que não servem às nossas circunstâncias."
 COM_spread_the_disarmament_education: "Difundir a Educação para o Desarmamento"
 COM_spread_the_disarmament_education_desc: "Difundir a educação para o desarmamento do UNREC nos ajudará a desarmar nossas forças militares e a incentivar nossos irmãos e irmãs africanos a fazerem o mesmo."
 COM_denounce_nuclear_weapons: "Denunciar as Armas Nucleares"
 COM_denounce_nuclear_weapons_desc: "É hora de liderarmos o caminho na África e denunciarmos as armas nucleares do mundo, continuando a garantir que a África permaneça comprometida com a não proliferação nuclear."
 COM_east_african_disarmament: "Desarmamento da África Oriental"
 COM_east_african_disarmament_desc: "A região da África Oriental abriga numerosos conflitos, e o desarmamento dessas nações é crucial para manter a paz e a estabilidade na região. Cooperando com a Iniciativa de Desarmamento da África Oriental, podemos dar passos rumo ao desarmamento de nossas forças militares e demonstrar nosso compromisso com um futuro pacífico e seguro para a região."
 COM_peaceful_disarmament: "Desarmamento Pacífico"
 COM_peaceful_disarmament_desc: "Devemos liderar o caminho na África, desarmar nossas forças militares e demonstrar nosso compromisso com um futuro pacífico e seguro para o continente africano, desarmando nossa nação."
 COM_total_ban_on_personal_weapons: "Proibição Total de Armas Pessoais"
 COM_total_ban_on_personal_weapons_desc: "É hora de proibir todas as armas pessoais em nossa nação e conduzir uma campanha direcionada para recomprar todas as armas dos nossos cidadãos."
 COM_new_african_pacifism: "Novo Pacifismo Africano"
 COM_new_african_pacifism_desc: "Incentivar todas as nações africanas a entrar numa nova era de paz e de pacifismo armado só nos permitirá ter um futuro forte, estável e próspero."
 COM_a_shining_example_of_peace: "Um Exemplo Brilhante de Paz"
 COM_a_shining_example_of_peace_desc: "Devemos ser um exemplo brilhante de paz e desarmamento para o resto da África. Desarmando nossas forças militares e demonstrando nosso compromisso com um futuro pacífico e seguro para o continente africano, podemos inspirar outras nações a fazer o mesmo."
 COM_expanded_military_industries: "Indústrias Militares Ampliadas"
 COM_expanded_military_industries_desc: "As indústrias militares de [COM.GetName] precisam desesperadamente de revitalização, já que a nação continua terceirizando a produção de armamentos militares."
 COM_invite_the_pmcs: "Convidar as EMPs"
 COM_invite_the_pmcs_desc: "Diversas empresas militares privadas da África e do mundo seriam excelentes escolhas para complementar nossas forças de segurança e defesa. Devemos procurá-las e convidá-las a ampliar nossa capacidade de combate caso o chamado às armas venha a soar."
 COM_expand_the_presidential_guard: "Expandir a Guarda Presidencial"
 COM_expand_the_presidential_guard_desc: "A Guarda Presidencial é um dos pilares da nossa grande nação e uma força de combate de elite na África Oriental. Devemos implantar outro regimento desses combatentes para apoiar nossas ambições na costa da África Oriental."
 COM_reform_defunct_pmc_units: "Reformar Unidades de EMP Extintas"
 COM_reform_defunct_pmc_units_desc: "Várias empresas militares privadas extintas podem ser ligadas aos diversos conflitos na África ou às Comores, e agora é hora de procurá-las e reformar essas unidades com as Comores como base."
 COM_expand_the_defense_force: "Reorganizar a Força de Defesa"
 COM_expand_the_defense_force_desc: "A Força de Defesa Comorense é o último terço de nossas unidades armadas; devemos reorganizá-la para trabalhar sem atritos com a própria CSF."
 COM_homegrown_military_manufacturing: "Manufatura Militar Nacional"
 COM_homegrown_military_manufacturing_desc: "[COM.GetName] não é conhecida pela manufatura militar, mas poderá vir a ser se continuarmos apoiando as empresas locais e fomentando novas organizações industriais militares em nossa nação."
 COM_the_eastern_african_entrepot: "O Entreposto da África Oriental"
 COM_the_eastern_african_entrepot_desc: "As Comores estão numa posição extremamente vantajosa para se tornar o polo econômico da costa da África Oriental. Devemos expandir nossos portos e buscar desenvolver e formalizar parcerias econômicas muito mais abrangentes com outras nações."
 COM_expand_the_prince_said_irabhim_airport: "Expandir o Aeroporto Príncipe Said Ibrahim"
 COM_expand_the_prince_said_irabhim_airport_desc: "O aeroporto foi inaugurado em 1975 e é o único aeroporto internacional das Comores e a base da companhia aérea nacional, a Comoros Aviation."
 COM_expand_available_helicopters: "Ampliar os Helicópteros Disponíveis"
 COM_expand_available_helicopters_desc: "Nossa atual frota de helicópteros está obsoleta e precisa ser substituída. Adquirindo novos helicópteros, podemos aprimorar nossas capacidades e garantir que estejamos preparados para proteger a nação com eficácia e responder a qualquer ameaça à nossa soberania."
 COM_comorian_politics: "Política Comorense"
 COM_comorian_politics_desc: "O poderio militar é apenas metade da equação da política internacional; devemos educar também nossos diplomatas, para estender nosso alcance além das nossas próprias costas."
 COM_social_democracy_in_africa: "O Diamante Social-Democrata da África"
 COM_social_democracy_in_africa_desc: "A social-democracia oferece uma abordagem equilibrada de governança, combinando economias de mercado com políticas sociais voltadas a reduzir a desigualdade, melhorar o acesso à educação e à saúde e fomentar o desenvolvimento sustentável. Adotando princípios social-democratas, as Comores podem abrir caminho para um crescimento inclusivo e um futuro mais brilhante para seus cidadãos."
 COM_a_true_democracy: "Democracia de Verdade"
 COM_a_true_democracy_desc: "Mantendo-se firme em seu compromisso com os ideais democráticos, as Comores podem fomentar a estabilidade, promover o crescimento econômico, salvaguardar os direitos humanos e empoderar seus cidadãos, todos elementos cruciais para alcançar uma prosperidade duradoura."
 COM_our_partnership: "Parceria com os EUA"
 COM_our_partnership_desc: "Uma parceria estratégica com os Estados Unidos pode ser decisiva. Este artigo busca destacar as razões convincentes pelas quais as Comores devem abraçar a cooperação com os Estados Unidos, que pode abrir portas a oportunidades, reforçar a estabilidade econômica, promover avanços tecnológicos e fomentar o progresso social."
 COM_anti_nato_ally: "EMP Wagner nas Comores"
 COM_anti_nato_ally_desc: "Precisamos convidar a EMP Wagner a vir ao nosso país para ser contratada pelo nosso governo. A França pode querer nos proteger, mas ter nossa própria força é sempre melhor!"
 COM_clearing_the_nomenclature: "Limpar a Nomenklatura"
 COM_clearing_the_nomenclature_desc: "Limpar a nomenklatura deve ser a nossa prioridade máxima na nova agenda! Por que esses malditos apaziguadores ocidentais deveriam sequer abrir a boca para fazer barulho em torno do nosso novo governo sagrado?"
 COM_pan_arabism: "Pan-Islamismo"
 COM_pan_arabism_desc: "Embora sejamos um ponto fora da curva geográfico, ao focar naquilo que nos une ao resto do mundo árabe podemos gerar um sentimento de irmandade que certamente durará para sempre."
 COM_the_warrior_king: "O Rei Guerreiro"
 COM_the_warrior_king_desc: "Denard tomou o poder em [COM.GetName]. Homem do povo, homem das forças armadas e homem das empresas militares privadas, ele agora pode ostentar o título de \"O Rei Guerreiro\". Podemos nos preparar para apoiar diversos governos nos diferentes conflitos ao redor do mundo para ganhar dinheiro e estabelecer [COM.GetName] como a sede de vanguarda de todas as EMPs do mundo."
 COM_the_consolidation_of_power: "A Consolidação do Poder"
 COM_the_consolidation_of_power_desc: "Embora governemos pela espada, ainda precisamos consolidar nosso poder no arquipélago, ou corremos o risco de perder tudo o que conquistamos. É hora de consolidar nosso poder."
 COM_legitimize_our_rule: "Legitimar Nosso Governo"
 COM_legitimize_our_rule_desc: "Nosso foco agora deve ser legitimar nosso governo, seja por nossa própria administração, seja pedindo reconhecimento às maiores potências da região."
 COM_declare_the_state_of_pmcs: "Declarar o Estado das EMPs"
 COM_declare_the_state_of_pmcs_desc: "Agora que nosso país foi estabelecido e nosso governo foi legitimado e assegurado, podemos consagrar e proteger oficialmente o estado das empresas militares privadas. Estabelecer o estado das empresas militares privadas trará um grande influxo de crescimento econômico e ampliará nossa influência no exterior... ou assim esperamos."
 COM_a_rifle_for_hire: "Um Fuzil de Aluguel"
 COM_a_rifle_for_hire_desc: "Nacionalizando algumas das empresas militares privadas e alugando nossas forças armadas de modo semelhante aos mercenários, podemos continuar aumentando nossa fatia e divisão dos lucros."
 COM_expanded_regional_operations: "Operações Regionais Ampliadas"
 COM_expanded_regional_operations_desc: "Estabelecer as operações das nossas forças armadas e ampliar suas capacidades nos permitirá enviá-las a várias partes da região."
 COM_expanded_global_operations: "Operações Globais Ampliadas"
 COM_expanded_global_operations_desc: "Agora que nossa empresa militar privada foi financiada e apoiada, podemos lançar nossas forças em vários conflitos globais, e não apenas em conflitos africanos."
 COM_the_zanzibar_agreement: "O Acordo de Zanzibar"
 COM_the_zanzibar_agreement_desc: "Procuramos [253.OWNER.GetName] para trabalhar num acordo que intermedie a venda de [253.GetName], ampliando o território disponível ao país. Definimos uma transferência do estado, bem como uma proposta."
 COM_anti_colonialist_propaganda: "Propaganda Anticolonialista"
 COM_anti_colonialist_propaganda_desc: "Há muitos países africanos que foram deixados para trás quando os franceses se retiraram da África. Com o enquadramento certo da situação, podemos deixar muita gente muito irritada muito rápido."
 COM_the_constitutional_referendum: "O Referendo da Federação"
 COM_the_constitutional_referendum_desc: "A situação jurídica de cada uma das ilhas das Comores está incerta há algum tempo, por isso foi convocado um referendo para aprovar ou rejeitar emendas à Constituição que permitam às Comores formar uma Federação."
 COM_greater_inter_island_cooperation: "Maior Cooperação Entre as Ilhas"
 COM_greater_inter_island_cooperation_desc: "A situação de Bacar nos mostrou que a autonomia pode sair do controle; devemos prestar atenção e fomentar maior cooperação entre as ilhas."
 COM_the_tourism_industry: "A Indústria do Turismo"
 COM_the_tourism_industry_desc: "Sendo uma nação insular, o turismo é um ponto focal importante na composição econômica do país. Visitantes de todo o mundo podem fazer trilhas no vulcão Karthala, visitar o Parque Marinho de Mohéli e conhecer as diversas praias e selvas que cobrem as várias ilhas do arquipélago, com a maior parte do turismo concentrada em Anjouan e Grande Comore, além da cultura singular em que elementos árabes, africanos e franceses se misturam em maravilhosa harmonia."
 COM_agricultural_developments: "Desenvolvimentos Agrícolas"
 COM_agricultural_developments_desc: "A agricultura é a espinha dorsal da nossa economia, empregando a maioria da população e produzindo nossas exportações mais valiosas. Investindo em técnicas modernas de cultivo, infraestrutura de irrigação e educação agrícola, podemos aumentar a produtividade e garantir a segurança alimentar do nosso povo."
 COM_fishery_industry_investment: "Investimentos na Indústria Pesqueira"
 COM_fishery_industry_investment_desc: "Sendo uma nação insular, as águas que cercam as Comores são ricas em vida marinha. Investir na nossa indústria pesqueira não só dará emprego às comunidades costeiras, como também criará uma indústria exportadora sustentável capaz de competir nos mercados internacionais."
 COM_comorian_forestry: "Silvicultura Comorense"
 COM_comorian_forestry_desc: "Nossas ilhas são cobertas por florestas tropicais exuberantes que oferecem valiosos recursos madeireiros. Com práticas florestais sustentáveis e manejo adequado, podemos desenvolver esse setor preservando nosso ambiente natural para as gerações futuras."
 COM_join_the_world_trade_organization: "Ingressar na Organização Mundial do Comércio"
 COM_join_the_world_trade_organization_desc: "Ser membro da Organização Mundial do Comércio abrirá novos mercados para nossas exportações, nos dará voz nas negociações comerciais internacionais e nos ajudará a nos integrar mais plenamente à economia global. Os mecanismos de solução de controvérsias da OMC também protegerão nossos interesses econômicos no exterior."
 COM_trade_deals_with_madagascar: "Acordos Comerciais com Madagascar"
 COM_trade_deals_with_madagascar_desc: "Madagascar é nosso vizinho mais próximo e um parceiro comercial natural. Fortalecer os laços econômicos com eles reduzirá os custos de frete, aumentará o volume de comércio e fomentará a cooperação regional em benefício de ambas as nações."
 COM_trade_deals_with_tanzania: "Acordos Comerciais com a Tanzânia"
 COM_trade_deals_with_tanzania_desc: "A Tanzânia é um importante polo econômico da África Oriental, com fortes conexões com toda a região. Estabelecer acordos comerciais abrangentes com eles nos dará melhor acesso ao mercado da África Oriental e fortalecerá nossa posição nas redes de comércio regionais."
 COM_cooperation_with_east_africa: "Cooperação com a UAO"
 COM_cooperation_with_east_africa_desc: "O conceito de uma União da África Oriental (UAO) prevê uma iniciativa de integração regional que reúna os países da África Oriental numa entidade econômica, política e social unificada. Embora atualmente não exista uma União da África Oriental formal, há esforços contínuos para promover a cooperação e a integração regionais entre as nações da África Oriental."
 COM_trading_with_east_africa: "Investimentos na África Oriental"
 COM_trading_with_east_africa_desc: "Investir uns nos outros no âmbito de uma União da África Oriental (UAO) tem grande potencial para o desenvolvimento econômico e a prosperidade da região. Promovendo investimentos intrarregionais, as nações da África Oriental podem aproveitar seus recursos, conhecimentos e mercados coletivos para fomentar o crescimento, criar oportunidades de emprego e reduzir a dependência de atores externos. Tais investimentos podem assumir várias formas e contribuir para diversos setores, incluindo infraestrutura, agricultura, manufatura, serviços e tecnologia."
 COM_state_of_the_pmcs_idea: "Estado das EMPs"
 COM_state_of_the_pmcs_idea_desc: "Ao reconhecer e apoiar oficialmente as empresas militares privadas como instituições legítimas dentro da nossa nação, criamos um modelo econômico singular em que as EMPs contribuem de forma significativa para o nosso PIB e para a nossa capacidade militar. O Estado facilita ativamente suas operações em troca de garantias de segurança e benefícios econômicos."
 COM_expanded_regional_operations_idea: "Operações Regionais Ampliadas"
 COM_expanded_regional_operations_idea_desc: "Nossas forças militares e de EMPs agora são capazes de atuar em toda a região da África Oriental. Esse alcance ampliado nos permite assumir contratos de segurança, missões de paz e operações de apoio militar nos estados vizinhos."
 COM_expanded_global_operations_idea: "Operações Globais Ampliadas"
 COM_expanded_global_operations_idea_desc: "Com financiamento e apoio suficientes, nossas forças militares privadas agora podem aceitar contratos em todo o mundo, em vez de limitar as operações à África. Esse alcance global aumenta significativamente o potencial de receita e firma as Comores como um grande ator da indústria internacional de segurança."
 COM_comorian_political_decisions: "Decisões Políticas [COM.GetAdjective]"
 COM_comorian_political_decisions_desc: "Decisões políticas fundamentais sobre o aparato de segurança das Comores e a política de mercenários."
 COM_disband_the_presidential_guard_decision: "Dissolver a Guarda Presidencial"
 COM_disband_the_presidential_guard_decision_desc: "A Guarda Presidencial se tornou um símbolo de governo autoritário e de influência mercenária nas Comores. Dissolver essa força sinalizará uma nova era de governança democrática, embora possa nos deixar vulneráveis a ameaças futuras à segurança."
 COM_hire_control_risks_decision: "Formar a Ala Paramilitar do Control Risks Group"
 COM_hire_control_risks_decision_desc: "A Control Risks Group é uma consultoria britânica de riscos que pode oferecer serviços profissionais de segurança. Embora mais cara que as outras opções, sua reputação de discrição e profissionalismo faz dela uma escolha ideal para manter a estabilidade em nossa frágil nação."
 COM_hire_executive_outcomes_decision: "Reformar a Executive Outcomes"
 COM_hire_executive_outcomes_decision_desc: "A Executive Outcomes é uma empresa militar privada sul-africana de reputação controversa. Sua experiência em zonas de conflito africanas poderia nos dar considerável conhecimento militar, embora sua presença possa gerar preocupações internacionais e desestabilizar nosso governo."
 COM_hire_defense_systems_decision: "Reformar a Defense Systems"
 COM_hire_defense_systems_decision_desc: "A Defense Systems Limited é uma empresa militar privada britânica que atuou durante a Guerra Fria. Reformar essa organização poderia nos dar contratados de segurança experientes, que entendem as complexidades da defesa de uma pequena nação insular."
 COM_hire_watchguard_decision: "Reformar a Watchguard"
 COM_hire_watchguard_decision_desc: "A WatchGuard International foi uma empresa militar privada britânica que encerrou as operações em 1972. Reviver essa organização nos daria acesso a mercenários com histórico comprovado, embora suas táticas agressivas possam prejudicar nossa reputação internacional."
 COM_reform_7_independent_company_decision: "Reformar a 7ª Companhia Independente"
 COM_reform_7_independent_company_decision_desc: "A 7ª Companhia Independente foi a companhia de Robert Denard na Rodésia. Reformar essa unidade nos dará uma unidade especificamente leal ao nosso rei guerreiro, mas que será leal a Denard."
 comoros.33.a: "Os Termos São Aceitáveis."
 comoros.33.b: "Nosso Território Não Está à Venda!"
 COM_african_mercenaries_2_tt: "O Governo §Y[COM.GetFlag][COM.GetAdjective]§! contratará mercenários adicionais para reforçar nossas forças militares.\nReceberemos um modelo de divisão bloqueado para a EMP §YAFRIKA-TDL PMC§! no estado de §Y[269.GetName]§!."
 COM_a_rifle_for_hire_tt: "Para cada nação onde tivermos voluntários ativos, receberemos $$§Y0.350§! por semana por nação. \nSe também tivermos adotado $COM_african_mercenaries$, esse valor aumentará para $$§Y0.500§! por semana por nação.\n"
 COM_anti_federalist_opinion_campaign_decision: "Campanha Antifederalista"
 COM_anti_federalist_opinion_campaign_decision_desc: ""
 COM_federalist_opinion_campaign_decision: "Campanha Federalista"
 COM_federalist_opinion_campaign_decision_desc: ""
 COM_debt_refactoring: "Reestruturação Direcionada da Dívida"
 COM_debt_refactoring_desc: "Avaliar as dívidas e reestruturá-las em empréstimos maiores com juros menores pode nos ajudar a economizar uns trocados aqui e ali."
 COM_african_mercenaries_1_tt: "Para cada nação onde tivermos voluntários ativos, receberemos $$§Y0.350§! por semana por nação. \nSe também tivermos adotado $COM_a_rifle_for_hire$, esse valor aumentará para $$§Y0.500§! por semana por nação.\n"
 COM_reformed_7_independent: "Reformou a §Y7ª Companhia Independente§!"
 comoros.27.b: "Trabalhar com os franceses para prendê-lo"
 comoros.27.c: "Aumentar a segurança no palácio"