 RULE_OPTION_MNT_EASTERN_ALIGNMENT_DESC: "黑山将依靠莫斯科，加入集体安全条约组织，并购买东方的装备。"
 RULE_OPTION_MNT_SERBIAN_UNION: "联合塞尔维亚"
 RULE_OPTION_MNT_SERBIAN_UNION_DESC: "黑山将重新向贝尔格莱德靠拢，并寻求恢复与塞尔维亚的联盟。"
 RULE_OPTION_MNT_NEUTRAL_HARBOUR: "中立港"
 RULE_OPTION_MNT_NEUTRAL_HARBOUR_DESC: "黑山将宣布武装中立，并将其港口变成对所有集团开放的自由港。"
 SWI_NATO_EU: "欧洲-大西洋一体化"
 SWI_NATO_EU_DESC: "瑞士将放弃中立，加入北约并争取成为欧盟候选国。如果北约不复存在，瑞士将独立建国并解散联邦。"
 SWI_NEUTRAL: "武装中立"
 SWI_NEUTRAL_DESC: "瑞士将保持外交政策中立，走自己的道路，并继续做所有国家的朋友。"
 RULE_FICTIONAL_CONTENT: "虚构与迷因内容"
 RULE_FICTIONAL_CONTENT_NO_DESC: "§Y默认§!玩笑和非历史内容仍然禁用，包括列支敦士登购买阿拉斯加并恢复神圣罗马帝国、南奥塞梯复兴斯基泰、特萨克在古巴掌权，以及散布在模组中的各种彩蛋。"
 RULE_FICTIONAL_CONTENT_YES_DESC: "启用玩笑和非历史内容，包括列支敦士登购买阿拉斯加并恢复神圣罗马帝国，南奥塞梯复兴斯基泰，特萨克在古巴掌权，以及散布在模组中的各种彩蛋。"
 RULE_PLAYER_INSTANT_JUSTIFICATION: "即时战争目标正当化（只限玩家）"
 RULE_YES_PLAYER_INSTANT_JUSTIFICATION_DESC: "每一个人类选手开局获得§Y战争理由§!国家精神，可以§G-100%§!减少正当化战争目标时间。AI无法获得此增益。"
 RULE_NO_PLAYER_INSTANT_JUSTIFICATION_DESC: "战争目标需要花费时间才能被所有人认可其正当性。"
 RULE_OPTION_JAP_HISTORICAL: "史实"
 BOS_AI_BEHAVIOR: "@BOS 波斯尼亚和黑塞哥维那"
 SIA_AI_BEHAVIOR: "@SIA 泰国"
 RULE_OPTION_SIA_DEFAULT_AI_DESC: "泰国遵循其惯常路线。泰爱泰党及其后继政党主导21世纪初，民主党和王室与之抗衡，前进党在2020年代崛起。曼谷不会走向共产主义，不会强行推进领土收复主义诉求，也不会建立东南亚条约组织。"
 RULE_OPTION_SIA_PAN_THAI: "泛泰（大泰国）"
 RULE_OPTION_SIA_PAN_THAI_AI_DESC: "泰国正追寻失去的领土和东盟霸权，大力扩充军备，并向邻国提出诉求。"
 RULE_OPTION_SIA_SEATO_LEADER: "东南亚条约组织领袖"
 RULE_OPTION_SIA_SEATO_LEADER_AI_DESC: "泰国建立东南亚条约组织，在曼谷的领导下将东南亚地区聚集到一个区域防务条约组织中，而不是以牺牲邻国利益为代价进行扩张。"
 RULE_OPTION_SIA_ALT_HISTORY: "另类史实"
 RULE_OPTION_SIA_ALT_HISTORY_AI_DESC: "泰国走上了共产主义道路，逐渐疏远华盛顿和西方。它不会追求领土收复失地，也不会加入东南亚条约组织。"
 RULE_AFG_TALIBAN_INSURGENCY_INTENSITY: "@AFG 塔利班叛乱"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT: "史实"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT_DESC: "塔利班叛乱的兴起和消退遵循着正常的规律。"
 RULE_AFG_TALIBAN_INSURGENCY_WEAK: "受控"
 RULE_AFG_TALIBAN_INSURGENCY_WEAK_DESC: "塔利班的重建速度只有原来的一半。反叛乱工作取得了成效，阿富汗完全有可能彻底铲除叛乱。"
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS: "永不停歇"
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS_DESC: "塔利班的重建速度是原来的一半。维持国家统一变成了一场持久战，而不是一个可以一次性解决的问题。"
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING: "@AFG 北方联盟起义"
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_ALLOWED_DESC: "如果塔利班赢得内战，北方联盟将在几个月后由伊斯梅尔·汗领导再次崛起，或者从 2020 年开始由艾哈迈德·马苏德领导。"
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_BLOCKED_DESC: "塔利班的胜利已成定局。北方不会开辟第二战场。"
 RULE_OPTION_FRA_COMMUNE: "法兰西公社"
 RULE_OPTION_FRA_COMMUNE_DESC: "§8法国共产党§!和激进左翼势力瓦解了法兰西第五共和国，宣布成立法兰西公社。法国脱离西方阵营，走上革命道路，这令欧洲大陆所有国家的首都感到震惊。"
 RULE_OPTION_FRA_KINGDOM: "法兰西王国"
 RULE_OPTION_FRA_KINGDOM_DESC: "一场保皇党政变结束了共和国，并拥立一位波旁王朝或奥尔良王朝的继承人为法国国王。复辟的君主制背弃了布鲁塞尔，并重燃了与邻国的旧怨。"
 RULE_OPTION_FRA_EMPIRE: "法兰西帝国"
 RULE_OPTION_FRA_EMPIRE_DESC: "波拿巴主义政变终结了法兰西共和国，并宣告建立新的法兰西帝国。帝国追求横跨欧洲大陆的野心，使其与德国和英国都处于敌对状态。"
 VEN_AI_BEHAVIOR: "@VEN 委内瑞拉"
 RULE_VEN_CHAVISMO_CONTINUES: "查韦斯主义仍将继续"
 RULE_VEN_CHAVISMO_CONTINUES_DESC: "玻利瓦尔社会主义在统一社会主义党的领导下得以延续，继续推进其使命、委内瑞拉国家石油公司国有化以及在整个大陆上更广泛的玻利瓦尔革命事业。"
 RULE_VEN_OPPOSITION_STATIST: "反对派，垄断模式"
 RULE_VEN_OPPOSITION_STATIST_DESC: "民主反对派掌权，但保留了国家垄断经济，将委内瑞拉国家石油公司和制高点置于政府控制之下。"
 RULE_VEN_OPPOSITION_LIBERTARIAN: "反对派，自由市场模式"
 RULE_VEN_OPPOSITION_LIBERTARIAN_DESC: "民主反对派掌权，推行全面放松管制和私有化，向国内外资本开放委内瑞拉经济。"
 RULE_VEN_MILITARY_JUNTA: "军政府"
 RULE_VEN_MILITARY_JUNTA_DESC: "右翼或军方支持的威权政府夺取政权，奉行民族主义强人统治或侵略扩张主义外交政策。"
 ALG_AI_BEHAVIOR: "@ALG 阿尔及利亚"
 RULE_OPTION_ALG_HISTORICAL: "布特弗利卡的时代"
 RULE_OPTION_ALG_HISTORICAL_DESC: "总统在“黑色十年”结束时颁布了大赦令，并团结了§8民族解放阵线§!及其盟友，直到§8人民运动§!迫使这位老人下台。阿尔及利亚仍然是阿拉伯和非洲外交的支柱，而国内的最终决定权则掌握在将军们手中。"
 RULE_OPTION_ALG_LE_POUVOIR: "权力集团永存"
 RULE_OPTION_ALG_LE_POUVOIR_DESC: "总统职位始终无法摆脱军方的控制，而§8权力集团§!对§8人民运动§!的镇压手段也并非改革，而是逮捕民众。阿尔及利亚表面上维持着平民的形象，而幕后的一切决策都由安全机构掌控。"
 RULE_OPTION_ALG_HIRAK_DEMOCRACY: "人民运动胜利"
 RULE_OPTION_ALG_HIRAK_DEMOCRACY_DESC: "每周的游行示威活动并未止步于总统府，§8人民运动§!打破了寡头政治，瓦解了权力机构。阿尔及利亚制定了一部真正意义上的文官宪法，成为马格里布地区第一个真正的民主国家。"
 RULE_OPTION_ALG_MILITARY_JUNTA: "将军们接管政权"
 RULE_OPTION_ALG_MILITARY_JUNTA_DESC: "§8国家人民军§!撕下假面具，中止了宪法，直接统治阿尔及利亚。国家转向内向型，其邻国则发现边境上出现了一个驻军国家。"
 RULE_OPTION_ALG_ISLAMIST: "伊斯兰主义阿尔及利亚"
 RULE_OPTION_ALG_ISLAMIST_DESC: "§8争取和平社会运动§!和§8复兴运动§!通过选举而非游击战赢得胜利，并通过议会、法院和清真寺建立伊斯兰共和国。阿尔及利亚成为北非政治伊斯兰的代言人。"
 RULE_OPTION_ALG_FIS_UPRISING: "救世阵线回归"
 RULE_OPTION_ALG_FIS_UPRISING_DESC: "§8伊斯兰救世阵线§!从未被遏制，并声称赢得了军队从其手中夺取的选举胜利。“黑色十年”最终以叛乱分子的意愿结束，阿尔及利亚成为萨赫勒地区武装伊斯兰主义的基地。"
 ETH_AI_BEHAVIOR: "@ETH 埃塞俄比亚"
 RULE_OPTION_ETH_HISTORICAL: "史实"
 RULE_OPTION_ETH_HISTORICAL_DESC: "埃塞俄比亚通过在医疗、教育和宗教自由方面的进步，巩固了其联邦民主共和国的地位。§8埃塞俄比亚人民革命民主阵线执政联盟§!在保持政治连续性的同时，深化了与非洲联盟的合作。"
 RULE_OPTION_ETH_MONARCHIST_RESTORATION: "王冠回归"
 RULE_OPTION_ETH_MONARCHIST_RESTORATION_DESC: "埃塞俄比亚恢复了§8埃塞俄比亚王室委员会§!，并邀请泽拉·雅各布·阿姆哈·塞拉西登基。随着议会作用的减弱，帝国权力重新确立，对厄立特里亚的领土要求也再次被提出。"
 RULE_CORPORATE_HISTORY: "企业历史"
 RULE_CORPORATE_HISTORY_FULL: "全面"
 RULE_CORPORATE_HISTORY_FULL_DESC: "企业史以历史里程碑事件为背景，展现企业在行业发展过程中做出的选择。这是通常的做法。"
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY: "仅结果"
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY_DESC: "企业历史悄然应用历史路线及其持续的国家影响，既不显示其事件选择，也不给予其一次性奖励。"
 RULE_CORPORATE_HISTORY_OFF: "禁用"
 RULE_CORPORATE_HISTORY_OFF_DESC: "企业历史不创设任何国家，也不安排任何事件。原产国内容保持不变。"
 RULE_OPTION_ARM_PEOPLES_PARTY: "人民党回归"
 RULE_OPTION_HOL_HISTORICAL: "史实"
 RULE_OPTION_HOL_HISTORICAL_DESC: "AI将按照真实的荷兰历史进程运行：科克的紫色联盟在福图因事件后让位于巴尔克嫩德的基督教民主联盟，吕特的自由民主人民党在2010年上台，维尔德斯的自由党在2024年获胜，杰滕的民主66党在2025年获胜。各党领导人将按计划在其实际任期结束时退休。\n"
 RULE_OPTION_HOL_RANDOM_DEMOCRATIC: "开放式判决"
 RULE_OPTION_HOL_RANDOM_DEMOCRATIC_DESC: "荷兰仍然是一个西方式的议会民主制国家，但历史并非预先写好的：无论民意调查支持哪个政党，都会在一次又一次的选举中组建政府。\n"
 RULE_OPTION_HOL_WESTERN_MONARCHY: "执政回归"
 RULE_OPTION_HOL_WESTERN_MONARCHY_DESC: "ai将争取民众支持，恢复执政制度，并通过王室进行统治。它将复兴西印度公司，并以荷兰的方式 - 通过金钱、影响力以及建立附庸国而非征服 - 进军大西洋。\n"
 RULE_OPTION_HOL_NATIONALIST_MONARCHY: "皇家战斗派"
 RULE_OPTION_HOL_NATIONALIST_MONARCHY_DESC: "AI将发起一场民族主义君主制运动，恢复王室特权，并重建东印度公司作为征服的工具。舰队、海军陆战队和空军是首要目标，好望角和锡兰（今斯里兰卡）是进军的跳板，而印度则是最终的奖赏。\n"
 RULE_OPTION_HOL_NVU: "荷兰人民联盟"
 RULE_OPTION_HOL_NVU_DESC: "AI将把荷兰人民联盟从一个边缘运动发展成为一个执政党，然后进军中央议会大厦。陆军和空军的建立只有一个目的 - 挑战法国和英国，争夺德意志欧洲的霸主地位。\n"
 IND_AI_BEHAVIOR: "@IND 印度尼西亚"
 RULE_OPTION_IND_HISTORICAL: "史实"
 RULE_OPTION_IND_HISTORICAL_DESC: "印度尼西亚在§8民族觉醒党§!的领导下巩固了改革共和国，打击宗教极端主义，并调解马鲁古冲突，而非选边站队。凭借反腐败机构和与西方的合作，印尼成为东南亚稳定的民主基石。"
 RULE_OPTION_IND_ISLAMIST: "伊斯兰印度尼西亚"
 RULE_OPTION_IND_ISLAMIST_DESC: "随着§8伊斯兰捍卫者阵线§!从街头运动发展到掌控国家政权，宗教激进化肆意蔓延。印尼逐渐沦为一个伊斯兰教法共和国，对邻国提出领土和意识形态诉求，并试图在其群岛范围内确立统治地位。"
 RULE_OPTION_ENG_HISTORICAL: "史实"
 RULE_OPTION_ENG_HISTORICAL_DESC: "AI模拟真实的英国历史进程。布莱尔领导的工党继续执政，发布了第二份和第三份竞选宣言；保守党于2010年上台；首相之位从卡梅伦依次传至特蕾莎·梅、约翰逊、特拉斯和苏纳克，最终斯塔默带领工党重返执政。各党派领导人在其任期结束后退休，联合王国得以维持。\n"
 RULE_OPTION_ENG_RISE_OF_BRITAIN: "不列颠崛起"
 RULE_OPTION_ENG_RISE_OF_BRITAIN_DESC: "英国维持议会民主制，不费一枪一弹重建帝国。威斯敏斯特将政治资本投入旧殖民地，收买媒体、政党和内阁，直至从加勒比海到太平洋的各国政府再次对伦敦负责。英国避免了可能消耗其所需影响力的战争。\n"
 RULE_OPTION_CHI_HISTORICAL: "伟大复兴"
 RULE_OPTION_CHI_HISTORICAL_DESC: "§8上海帮§!将党交给§8团派§!，团派又将党交给习近平，香港的自治权也随之瓦解。北京在南海和海峡两岸推进其主权声索，却并未为此发动战争。"
 RULE_OPTION_CHI_HEGEMON: "中央王国复兴"
 RULE_OPTION_CHI_HEGEMON_DESC: "§8重庆模式§!让薄熙来走上领导岗位，§8战狼§!也早早地获得了充分的自主权。中国武力解决了喜马拉雅边境问题，使不丹、尼泊尔和印度屈服，并迅速占领了台湾。"
 RULE_OPTION_CHI_PEACEFUL_RISE: "和平崛起"
 RULE_OPTION_CHI_PEACEFUL_RISE_DESC: "曾庆红继承了江泽民的政治机器，§8上海的技术官僚们§!坚持邓小平的路线。“一国两制”得到贯彻，西藏和新疆的治理依靠法律而非运动，统一问题在谈判桌上寻求解决。"
 RULE_OPTION_MD_RANDOM_PATH: "随机路径"
 RULE_OPTION_MD_RANDOM_PATH_DESC: "游戏开始时，AI会随机选择该国的一条发展路径，可能是史实，也可能是平行世界。具体是哪条路径，对你来说是未知的。"
 RULE_OPTION_MD_NO_PATH: "无路径"
 RULE_OPTION_MD_NO_PATH_DESC: "AI不会遵循预设的路径，而是在游戏过程中自由选择国策。它的行为每次运行都会有所不同。"
 RULE_OPTION_ITA_HISTORICAL: "史实"
 RULE_OPTION_ITA_HISTORICAL_DESC: "权力在§8民主党§!和§8意大利力量党§!之间轮流交替，而意大利则继续留在北约和欧盟。然而，意大利政府的开支更多地用于打击有组织犯罪、偿还公共债务、解决南部问题以及维护自身行政管理，而不是加强国家边境安全。"
 RULE_OPTION_ITA_ROMAN_RESTORATION: "罗马帝国的复兴"
 RULE_OPTION_ITA_ROMAN_RESTORATION_DESC: "§8意大利兄弟党§!和民族右翼势力不断壮大，最终赢得大选，解散议会，并在复辟的罗马帝国境内加冕皇帝。随后，意大利逐一收回昔日帝国的行省，从非洲海岸一直延伸到不列颠尼亚。"
 RULE_OPTION_ITA_MARCH_ON_ROME: "第二次进军罗马"
 RULE_OPTION_ITA_MARCH_ON_ROME_DESC: "同一运动夺取政权，但保留了共和国体制，并在罗马扶植了§8法西斯§!政府。意大利在不觊觎帝国疆域的情况下，对亚得里亚海和阿尔卑斯山脉提出领土收复主义主张。"
 RULE_OPTION_ITA_EASTERN_TURN: "转向东方"
 RULE_OPTION_ITA_EASTERN_TURN_DESC: "§8重建共产党§!和§8意大利共产主义党§!重建了意大利左翼，并带领意大利退出北约。意大利积极拉拢莫斯科和北京，并寻求加入上海合作组织。"
 RULE_OPTION_JAP_HISTORICAL_DESC: "§8自由民主党§!保有国会席位，与华盛顿保持联盟，而自卫队只有在敌对邻国迫使他们这样做的情况下才会实现正常化。日本注销了不良贷款，针对出生率崩溃和过劳死危机立法，并保留了第九条。"
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE: "帝国的回归"
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE_DESC: "§8维新党§!从民族主义右翼中发展壮大，直至皇位复辟，第九条被废除。日本重整旗鼓，组建远洋舰队，武力夺回千岛群岛、朝鲜、台湾以及太平洋旧势力范围。"
 TUR_AI_BEHAVIOR_MD: "@TUR 土耳其"
 RULE_OPTION_TUR_HISTORICAL: "史实AI"
 RULE_OPTION_TUR_HISTORICAL_DESC: "银行业危机摧毁了§8美德党§!，从该党分裂出来的§8正义与发展党§!接管了政权。土耳其在中东和巴尔干地区转向新奥斯曼主义外交，总统权力逐渐凌驾于议会之上。"
 RULE_OPTION_TUR_KEMALIST_GUARD: "凯末尔主义卫士"
 RULE_OPTION_TUR_KEMALIST_GUARD_DESC: "伊斯兰主义者在重整旗鼓之前就被取缔，§8世俗共和国§!团结在总参谋部周围。土耳其继续留在北约，并以军队而非改革来解决库尔德问题。"
 RULE_OPTION_TUR_GREY_WOLVES: "灰狼"
 RULE_OPTION_TUR_GREY_WOLVES_DESC: "§8民族主义右翼§!势力赢得议会，终止选举，拥立苏丹，重建奥斯曼帝国。土耳其则在色雷斯、高加索和突厥世界强行推进其领土主张。"
 RULE_OPTION_TUR_HIZMET: "居伦运动"
 RULE_OPTION_TUR_HIZMET_DESC: "§8居伦§!运动继承了美德党的残局，并通过法院、警察和学校而非选票来掌控国家。土耳其在海外塑造温和的伊斯兰形象，却悄然掏空了自身的体制。"
 RULE_OPTION_TUR_TURKISH_LEFT: "土耳其左翼的回归"
 RULE_OPTION_TUR_TURKISH_LEFT_DESC: "反建制派的选票转向了§8革命左翼§!，而不是伊斯兰主义者。土耳其退出北约，承认其少数民族，并将自己定位为该地区的反帝国主义先锋。"
 RULE_OPTION_TUR_GREAT_EAST: "大东方"
 RULE_OPTION_TUR_GREAT_EAST_DESC: "美德党夺取政权，瓦解了总参谋部，随后激进化为§8萨拉菲§!运动，最终解散了共和国。土耳其宣布建立哈里发国，并向其所能触及的各个方向扩张。"
 RULE_OPTION_BHR_HISTORICAL: "哈利法王朝宪章"
 RULE_OPTION_BHR_HISTORICAL_DESC: "沙特王室以国家宪章和民选议会换取和平，然后在§82月14日青年联盟§!成员齐聚一堂后，以沙特武力将其瓦解。巴林仍然是美国舰队的港口，也是利雅得最可靠的客户。"
 RULE_OPTION_BHR_DAY_OF_RAGE: "愤怒之日"
 RULE_OPTION_BHR_DAY_OF_RAGE_DESC: "§8达瓦格国民伊斯兰协会§!一直阻挠局势，直到什叶派多数群体最终能够通过选举进入他们一直以来被剥夺的政府。巴林废除君主制，建立共和国，并向德黑兰而非利雅得负责。"
 RULE_OPTION_BHR_CROWNED_DEMOCRACY: "宪法契约"
 RULE_OPTION_BHR_CROWNED_DEMOCRACY_DESC: "王室认可了§8全国民主行动协会§!及其竞争对手的合法性，并将治理国家的重任交给了真正的议会，使王室凌驾于争论之上，而非卷入其中。巴林由此成为海湾地区第一个从未脱离西方阵营的民主国家。"
 RULE_OPTION_BOT_HISTORICAL: "博茨瓦纳民主党永存"
 RULE_OPTION_BOT_HISTORICAL_DESC: "§8博茨瓦纳民主党§!将总统职位从其成员手中传承至下一任，并在每次参选的选举中都取得胜利。钻石收入用于资助学校、诊所和抗击艾滋病的工作。博茨瓦纳一直是这片大陆上默默取得成功的国家，它不结盟、财政稳健，并且敢于公开表达其邻国不敢说的话。"
 RULE_OPTION_BOT_POLITICAL_RAINBOW: "雨伞张开"
 RULE_OPTION_BOT_POLITICAL_RAINBOW_DESC: "反对派停止分散选票，团结在§8民主变革之伞§!周围，打破了§8博茨瓦纳民主党§!自独立以来一直把持的政权。博茨瓦纳迎来了历史上首次政府更迭，南部非洲也由此证明，解放党是可以被选下台的。"
 RULE_OPTION_BOT_KGOSIKGOLO: "最高酋长加冕"
 RULE_OPTION_BOT_KGOSIKGOLO_DESC: "§8酋长们§!将酋长院从咨询机构转变为权力中心，并推举自己人担任全国最高酋长。选举制度让位于传统的君主制，非洲大陆的民主典范也变得不再被邻国所认可。"
 BLR_AI_BEHAVIOR: "@BLR 白俄罗斯"
 RULE_OPTION_BLR_HISTORICAL: "欧洲最后的独裁者"
 RULE_OPTION_BLR_HISTORICAL_DESC: "亚历山大·卢卡申科监禁政敌，将经济与卢布挂钩，并出动部队镇压了§8牛仔裤革命§!。白俄罗斯仍然是莫斯科最亲密的盟友，也是欧洲最孤立的政府。"
 RULE_OPTION_BLR_EUROPEAN_BELARUS: "欧洲的白俄罗斯"
 RULE_OPTION_BLR_EUROPEAN_BELARUS_DESC: "安德烈·桑尼科夫领导§8白俄罗斯欧洲一体化§!运动，使白俄罗斯放弃卢布，转向布鲁塞尔。白俄罗斯申请加入北约和欧盟，俄罗斯失去了其在斯摩棱斯克以西的立足之地。"
 RULE_OPTION_BLR_TIKHANOVSKAYA: "季哈诺夫斯卡娅革命"
 RULE_OPTION_BLR_TIKHANOVSKAYA_DESC: "卢卡申科统治了一代人之久，无人挑战，直到一场被窃取的选举让斯韦特兰娜·季哈诺夫斯卡娅领导了一个连防暴警察都无法撼动的§8协调委员会§!。白俄罗斯转向西方的时间远晚于其邻国，而此时俄罗斯的军队早已驻扎在边境。"
 RULE_OPTION_BLR_POPULAR_FRONT: "民族复兴"
 RULE_OPTION_BLR_POPULAR_FRONT_DESC: "齐亚农·帕兹尼亚克领导的§8白俄罗斯人民阵线§!推行白俄罗斯化政策，清洗苏联军官，重振大公国历史，最终夺取政权。白俄罗斯转而与莫斯科对抗，并对所有曾经臣服于维尔纽斯的邻国提出主权要求。"
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS: "民族布尔什维克叛乱"
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS_DESC: "§8民族布尔什维克§!占领街头，进而掌控国家，在劳动军和党卫军的领导下重建苏维埃秩序。在莫斯科的默许下，白俄罗斯武装起来，对抗波兰、乌克兰和波罗的海三国。"
 RULE_OPTION_BLR_LITBEL: "立陶宛-白俄罗斯的复兴"
 RULE_OPTION_BLR_LITBEL_DESC: "§8白俄罗斯共产党§!重新掌权，并将原立陶宛-白俄罗斯共和国作为其建国纲领。白俄罗斯试图通过影响力将立陶宛和拉脱维亚重新拉入社会主义联盟，在影响力不足的地方则诉诸武力。"
 RULE_OPTION_BLR_OLIGARCHY: "寡头的交易"
 RULE_OPTION_BLR_OLIGARCHY_DESC: "谢尔盖·哈伊杜基耶维奇和§8自由民主党§!放弃了卢卡申科的意识形态，转而采取更为坦率的商业策略，以尽可能高的价格出售与莫斯科的联系渠道。白俄罗斯仍然处于俄罗斯的轨道上，但它将联盟国家视为一种契约，而非信条。"
 RULE_OPTION_BOS_HISTORICAL: "代顿协议"
 RULE_OPTION_BOS_HISTORICAL_DESC: "轮值总统制在国际监督下运作，§8民主行动党§!与其塞族和克罗地亚族对手共同执政，而非击败他们。波斯尼亚在北约和欧洲维和部队的协助下重建，并逐渐向布鲁塞尔靠拢，但国家定位始终悬而未决。"
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP: "塞族共和国执掌大局"
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP_DESC: "§8独立社会民主联盟§!赢得总统大选，使萨拉热窝倒向贝尔格莱德和莫斯科，同时保持联邦的完整。波斯尼亚通过协议而非武力脱离西方阵营，俄罗斯在巴尔干地区获得了第二个立足点。"
 RULE_OPTION_BOS_SRPSKA_UNION: "塞族共和国优先"
 RULE_OPTION_BOS_SRPSKA_UNION_DESC: "§8塞尔维亚民主党§!将全国权力集中于巴尼亚卢卡，并与塞尔维亚进行合并谈判。波斯尼亚被并入更大的塞尔维亚国家，其邻国醒来后发现地图已被重新划分。"
 RULE_OPTION_BOS_ISLAMIST_REVIVAL: "波斯尼亚人的觉醒"
 RULE_OPTION_BOS_ISLAMIST_REVIVAL_DESC: "波斯尼亚人的不满情绪逐渐演变为宗教复兴，§8民族觉醒运动§!重新武装共和国，以期按照自己的意愿结束战争。波斯尼亚遣散了维和部队，转而攻击其内部各实体，随后又与邻国交战。"
 RULE_OPTION_BOS_WORKERS_STATE: "工人委员会"
 RULE_OPTION_BOS_WORKERS_STATE_DESC: "大规模失业使§8工人阵线§!超越了民族政党，波斯尼亚的工业也移交给了由工人组成的委员会。国家走向世俗化和自治，不再对布鲁塞尔或贝尔格莱德负责。"
 RULE_OPTION_ARM_HISTORICAL: "卡拉巴赫家族"
 RULE_OPTION_ARM_HISTORICAL_DESC: "卡拉巴赫战争老兵领导的§8亚美尼亚共和党§!执掌总统职位长达二十年，直到街头抗议最终将国家政权移交给§8公民契约党§!。亚美尼亚在安全问题上继续依赖莫斯科，同时又与巴库就山区问题争执不休。"
 RULE_OPTION_ARM_TER_PETROSIAN: "首任总统回归"
 RULE_OPTION_ARM_TER_PETROSIAN_DESC: "§8亚美尼亚国民大会§!拥立了被将军们赶下台的开国总统，而卡拉巴赫人却始终未能如愿。亚美尼亚以山脉为代价，换取了开放的边界和与邻国的正常关系。"
 RULE_OPTION_ARM_PEOPLES_PARTY_DESC: "§8亚美尼亚人民党§!在枪林弹雨中幸存下来，夺回了它被剥夺的国家。亚美尼亚在苏联时期工业和计划经济的基础上重建，成为莫斯科在高加索地区最可靠的伙伴。"
 RULE_OPTION_ARM_TSARUKYAN: "寡头共和国"
 RULE_OPTION_ARM_TSARUKYAN_DESC: "§8繁荣的亚美尼亚§!直接买断了议会，国家政权不再由总统府掌控，而是由一位商人的庄园执政。亚美尼亚变得富裕、腐败，并被出售给出价最高的资本。"
 RULE_OPTION_ARM_UNITED_STATES: "亚美尼亚合众国"
 RULE_OPTION_ARM_UNITED_STATES_DESC: "§8遗产党§!和海外亚美尼亚侨民将共和国重新构想为一个联邦制国家，为所有海外亚美尼亚人保留一席之地。亚美尼亚的未来不再寄托于莫斯科，而是寄托于洛杉矶和贝鲁特。"
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT: "创始议会"
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT_DESC: "卡拉巴赫老兵的§8萨逊勇士§!夺回了他们认为被窃取的共和国，并将其作为驻军地进行统治。亚美尼亚驱逐了俄罗斯的军事基地，并请求西方国家为其提供安全保障。"
 RULE_OPTION_ARM_MONARCHY: "王冠复辟"
 RULE_OPTION_ARM_MONARCHY_DESC: "§8亚美尼亚梅利克联盟§!终结了共和国，六个世纪以来，埃里温首次迎来国王。亚美尼亚实行君主立宪制，并声称拥有其昔日王国所统治的所有省份。"
 RULE_OPTION_ARM_DASHNAK_LEFT: "亚美尼亚革命联盟社会主义"
 RULE_OPTION_ARM_DASHNAK_LEFT_DESC: "§8亚美尼亚革命联盟§!的社会主义派别在党内赢得辩论，并按照建国信条重建共和国。亚美尼亚将寡头的财产国有化，并反对一切形式的帝国主义。"
 RULE_OPTION_ARM_DASHNAK_RIGHT: "费达伊的遗产"
 RULE_OPTION_ARM_DASHNAK_RIGHT_DESC: "§8亚美尼亚革命联盟§!的民族主义派系掌控了党务，并以山地战士的名义执政。亚美尼亚为夺回失去的土地而武装起来，毫不掩饰其夺回土地的野心。"
 RULE_OPTION_BRA_HISTORICAL: "卢拉时代"
 RULE_OPTION_BRA_HISTORICAL_DESC: "§8劳工党§!最终赢得总统大选，并将现金补贴与正统金融政策相结合，但一场腐败调查掏空了左翼势力，最终将总统宝座拱手让给了前陆军上尉。巴西由此成长为一个备受美国青睐的中等强国，它与华盛顿争论不休，却始终未脱离其势力范围。"
 RULE_OPTION_BRA_BROAD_FRONT: "新巴西"
 RULE_OPTION_BRA_BROAD_FRONT_DESC: "§8劳工党§!通过与§8巴西民主运动§!和较小的左翼政党组成广泛的联盟执政，并以改革而非退缩来应对腐败丑闻。巴西保持了宪政民主制度，并成为不再向北方寻求许可的南美洲的支柱。"
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC: "红色共和国"
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC_DESC: "§8劳工党§!停止分享权力，吞并左翼对手，并围绕自身重塑国家体制。巴西宣布建立社会主义共和国，并将这一模式输出到所有愿意接受的邻国。"
 RULE_OPTION_BRA_LIBERALS: "自由秩序"
 RULE_OPTION_BRA_LIBERALS_DESC: "§8巴西社会民主党§!继续执掌总统职位，并将私有化和通胀目标制政策贯彻到底。巴西成为南美洲最开放的经济体，也是赤道以南最稳定的美洲伙伴。"
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS: "社会民主党"
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS_DESC: "§8巴西社会民主党§!与§8民主工党§!联合执政，摒弃了市场经济的正统模式，转向以福利保障为核心的发展型国家。巴西将资金投入工业和教育，而非利息支出，并与华盛顿和北京都保持着一定的距离。"
 RULE_OPTION_BRA_MILITARY_RULE: "统帅的共和国"
 RULE_OPTION_BRA_MILITARY_RULE_DESC: "§8社会自由党§!上台执政，美化旧独裁统治，并解散了阻碍其权力的国会。巴西再次由军营里的独裁者统治，并向其边境的社会主义政府提出领土要求。"
 RULE_OPTION_BRA_MONARCHY: "帝国复兴"
 RULE_OPTION_BRA_MONARCHY_DESC: "§8君主制§!的复兴将民族主义总统制变成了加冕礼，奥尔良-布拉干萨家族重返空缺一个多世纪的王位。巴西废除了选举制度，收回了昔日的西斯普拉蒂纳省，再次臣服于王室。"
 RULE_OPTION_BUL_HISTORICAL: "通往布鲁塞尔之路"
 RULE_OPTION_BUL_HISTORICAL_DESC: "§8民主力量联盟§!将货币局制度和改革方案捆绑在一起，其后的每一届政府都保留了这两项政策。保加利亚先加入北约，后加入欧盟，为欧盟在巴尔干地区提供了最平静的边界。"
 RULE_OPTION_BUL_TSARIST_RESTORATION: "沙皇回归"
 RULE_OPTION_BUL_TSARIST_RESTORATION_DESC: "流亡的§8萨克森-科堡-哥达王室§!凯旋归来，不仅获得了首相之位，还团结了民族主义右翼势力拥护王室，并以自己的名义执政。保加利亚放弃了西部领土的诉求，换取了圣斯特凡诺会议上承诺的边界，而其邻国则发现马其顿问题再次浮出水面。"
 RULE_OPTION_BUL_RED_BALKAN: "红色巴尔干之梦"
 RULE_OPTION_BUL_RED_BALKAN_DESC: "§8保加利亚共产党§!从转型后的废墟中崛起，夺取了§8保加利亚社会党§!未能收复的政权。保加利亚寻求莫斯科和北京的支持，并着手在巴尔干地区建立一个社会主义联邦。"
 RULE_OPTION_CAN_HISTORICAL: "史实"
 RULE_OPTION_CAN_HISTORICAL_DESC: "§8自由党§!奉行中间路线执政，在联邦体制中保留了两种创始语言，并以清晰化法律回应魁北克的诉求，而非做出让步。加拿大留在北约和北美贸易区内，并且仍然是华盛顿最可靠的邻国。"
 RULE_OPTION_CAN_FRENCH_CANADA: "法国的加拿大"
 RULE_OPTION_CAN_FRENCH_CANADA_DESC: "§8魁北克集团§!将语言诉求转化为联邦项目，使法语成为国家唯一语言，并将政府所在地迁至魁北克。英语加拿大人发现自己在首都沦为少数群体，而联邦的维系依靠的是法律而非共识。"
 RULE_OPTION_CAN_ARMED_NEUTRALITY: "唯有真正的北方"
 RULE_OPTION_CAN_ARMED_NEUTRALITY_DESC: "加拿大退出北约，结束了其海外纠葛，并将节省下来的资金用于发展国内经济和自给自足的国防工业。北约北翼陷入沉寂，华盛顿失去了其在北美大陆的第二支军队。"
 RULE_OPTION_CAN_NATIONALIST: "民族主义政变"
 RULE_OPTION_CAN_NATIONALIST_DESC: "§8加拿大优先党§!利用宪政秩序的残骸上台执政，中止选举，并以紧急权力回应魁北克省和印第安保留地。加拿大在其本土大陆上自相残杀，世界上最长的未设防边界从北部加强了防御。"
 RULE_OPTION_CAN_EASTERN_REALIGNMENT: "极地之桥"
 RULE_OPTION_CAN_EASTERN_REALIGNMENT_DESC: "渥太华退出北约，并将北极航线、港口和资源出售给莫斯科和北京，而不是华盛顿。加拿大成为俄中势力范围的北端，而美国则在自己的大陆上发现了一个竞争对手。"
 COM_AI_BEHAVIOR: "@COM 科摩罗"
 RULE_OPTION_COM_HISTORICAL: "科摩罗联盟"
 RULE_OPTION_COM_HISTORICAL_DESC: "阿扎利·阿苏马尼脱下军装，走上投票箱；各岛屿各自选出一位总统，联盟主席一职在各岛屿间轮流担任；非洲联盟军队从上校手中夺回了昂儒昂岛。§8科摩罗复兴大会党§!赢得政权，随后又和平地失去权力，科摩罗群岛最终停止了内战。"
 RULE_OPTION_COM_ORANGE_PARTY: "橙党崛起"
 RULE_OPTION_COM_ORANGE_PARTY_DESC: "穆罕默德·达乌杜领导的§8橙党§!接管了莫罗尼政权，并以择优录用的技术官僚体制治理科摩罗群岛，打击人口贩运团伙，并实现了各部委的专业化。科摩罗向西方资本推销自己，称其为印度洋上唯一一个文件可信的微型国家。"
 RULE_OPTION_COM_ISLAMIC_REPUBLIC: "阿拉伯共和国"
 RULE_OPTION_COM_ISLAMIC_REPUBLIC_DESC: "清真寺委员会推举艾哈迈德·阿卜杜拉·穆罕默德·桑比担任总统，§8复兴党运动§!将科摩罗群岛改组为阿拉伯共和国。港口国有化，大马士革和巴格达取代巴黎成为阿拉伯国家，科摩罗成为阿拉伯联盟在莫桑比克海峡的代表。"
 RULE_OPTION_DEN_HISTORICAL: "雾之年代"
 RULE_OPTION_DEN_HISTORICAL_DESC: "§8左翼党§!和§8社会民主党§!轮流执掌克里斯汀堡，而丹麦保留其选择退出权，否决欧元，并向巴尔干、伊拉克和阿富汗派遣士兵。哥本哈根成为华盛顿在欧洲最积极的小盟友，同时允许欧盟在没有丹麦参与的情况下深化一体化。"
 RULE_OPTION_DEN_EUROPEAN_UNION: "欧洲的心脏之中"
 RULE_OPTION_DEN_EUROPEAN_UNION_DESC: "§8社会自由派§!和§8社会民主派§!举行第二次公投，利用丹麦选民的退出选择权，在欧盟核心席位中赢得一席之地。克朗被欧元取代，哥本哈根转而与柏林和巴黎而非华盛顿结盟。"
 RULE_OPTION_DEN_EUROSCEPTIC_DESC: "§8丹麦人民党§!迫使老牌政党不得不正视这个问题，丹麦最终退出申根区，进而退出欧盟。北欧防务合作取代了布鲁塞尔，而其他斯堪的纳维亚国家则被要求选边站队。"
 RULE_OPTION_DEN_SOCIALIST_DESC: "§8红绿联盟§!和工会将福利国家转变为工人国家，并将地方委员会置于议会之上。丹麦退出联盟和欧盟，向东方寻求盟友，并向北方其他国家发出革命号召。"
 RULE_OPTION_DEN_MONARCHIST_DESC: "法庭不再假装只是例行公事，§8丹麦人民党§!代表王室在议会中推动诉讼，而此时国民已经失去了耐心。君主收回了宪法剥夺的权力，格陵兰岛和法罗群岛牢牢地置于哥本哈根的掌控之下。"
 RULE_OPTION_DEN_NATIONALIST_DESC: "§8丹麦人民党§!接管了它一直以来扶持的政府，并将移民和边境管制作为丹麦政治的全部焦点。丹麦退出联盟和北欧理事会，并开始提出自中世纪以来从未提出过的诉求。"
 RULE_OPTION_CUB_HISTORICAL: "史实"
 RULE_OPTION_CUB_HISTORICAL_DESC: "菲德尔将总统职位交给了他的弟弟，§8古巴共产党§!维持着岛上的单一政党统治，一方面发放小额贸易许可证，另一方面又积极向加拉加斯和莫斯科寻求石油。禁运依然存在，“特殊时期”从未真正结束，哈瓦那在华盛顿的西半球仍然是一个尴尬的例外。"
 RULE_OPTION_CUB_PRO_WESTERN_REFORM: "菲德尔开放了该岛"
 RULE_OPTION_CUB_PRO_WESTERN_REFORM_DESC: "卡斯特罗亲自瓦解了计划经济体制，发放银行牌照，恢复教会，并制定了一部允许§8共产党内亲西方派系§!加入的政党存在的宪法。哈瓦那与华盛顿解决了关塔那摩问题，承认了台北，最终还与北约一起进行了军事演习。"
 RULE_OPTION_CUB_DIAZ_CANEL: "迪亚斯-卡内尔解冻"
 RULE_OPTION_CUB_DIAZ_CANEL_DESC: "米格尔·迪亚斯-卡内尔抢在劳尔之前入主总统府，解除了对§8古巴自由联盟§!的禁令，并举行了革命以来的首次正式选举。审查制度被废除，外国资本回流，古巴在未发生任何战争的情况下，成为了一个普通的加勒比海共和国。"
 RULE_OPTION_CUB_NEW_SOCIALISM: "第二次革命"
 RULE_OPTION_CUB_NEW_SOCIALISM_DESC: "迪亚斯-卡内尔中途放弃了开放计划，围绕年轻一代重建了一党制国家，并与平壤公开进行贸易。古巴加入集体安全条约组织，并将基地归还俄罗斯，使俄罗斯驻军距离佛罗里达仅90英里。"
 RULE_OPTION_CUB_NATIONALIST: "古巴人的古巴"
 RULE_OPTION_CUB_NATIONALIST_DESC: "§8古巴长枪党§!夺取政权，清洗共产党人和民主人士，并围绕青年劳工团重建军队。哈瓦那随后宣称整个海盆是其与生俱来的领土，海地、牙买加和地峡地区被逐一吞并。"
 RULE_OPTION_CUB_RESTORED_REPUBLIC: "共和国重生"
 RULE_OPTION_CUB_RESTORED_REPUBLIC_DESC: "§8古巴社会革命民主党§!赢得政权，释放政治犯，并围绕多党制议会修改宪法。之后，古巴没有征服邻国，而是邀请它们加入加勒比联邦。"
 RULE_OPTION_CZE_HISTORICAL: "史实"
 RULE_OPTION_CZE_HISTORICAL_DESC: "§8捷克社会民主党§!和§8公民民主党§!轮流执政，国家逐步融入北约和欧盟，而斯柯达则将姆拉达-博莱斯拉夫打造成了出口引擎。布拉格向巴尔干半岛和阿富汗派遣军队，成为西方阵营中一个安逸却毫不起眼的成员。"
 RULE_OPTION_CZE_COMMUNISM: "共产党的回归"
 RULE_OPTION_CZE_COMMUNISM_DESC: "§8波希米亚和摩拉维亚共产党§!将民众对私有化的愤怒转化为执政多数，并将各部委的矛头指向了那些出售工厂的人。捷克共和国退出北约，转而拉拢莫斯科和北京，并重新开启了其邻国认为已经解决的边界问题。"
 RULE_OPTION_CZE_MONARCHY_KING: "哈布斯堡王冠"
 RULE_OPTION_CZE_MONARCHY_KING_DESC: "§8捷克君主党§!从最初的小众运动发展成为规模最大的政党，它取出珍藏的王冠珠宝，并邀请卡尔·冯·哈布斯堡回到捷克加冕。捷克再次成为王国，并开始将维也纳和布达佩斯联合起来，在中欧建立一个君主制联盟。"
 RULE_OPTION_CZE_MONARCHY_PRESIDENT: "君主制共和国"
 RULE_OPTION_CZE_MONARCHY_PRESIDENT_DESC: "§8捷克君主党§!使国家回归旧秩序，但保留了选举权，并扶植了一位通过选举而非血统继承的君主制国家元首。捷克共和国保留了议会及其欧洲伙伴关系，同时围绕王位、教会和地区进行重建。"
 RULE_OPTION_FIJ_HISTORICAL: "史实"
 RULE_OPTION_FIJ_HISTORICAL_DESC: "军队推翻了§8斐济联合党§!民选政府，代之以军方支持的政府。岛上恢复了稳定，但最终权力仍掌握在军营手中，选举也因此搁置。"
 RULE_OPTION_FIJ_COUP_AVERTED: "政变被挫败"
 RULE_OPTION_FIJ_COUP_AVERTED_DESC: "政府与军队之间的对峙在造成任何后果之前就被化解，§8斐济工党§!以中间偏左的立场执政。和解与公共投资成为首要议程，斐济保留了其邻国早已放弃的文官政府。"
 RULE_OPTION_FIJ_MILITARY_JUNTA: "军官共和国"
 RULE_OPTION_FIJ_MILITARY_JUNTA_DESC: "§8斐济军方§!的激进分子走得比政变要求的更远，他们正式确立了公开的军事统治，在戒严令下将警察并入军队。政治权力在军营中运作，太平洋地区在其航道中心地带出现了一个公开军事化的国家。"
 RULE_OPTION_FIJ_RESTORED_KINGDOM: "王冠复辟"
 RULE_OPTION_FIJ_RESTORED_KINGDOM_DESC: "§8大酋长委员会§!赢得危机，重建斐济王国，并选举君主统治。酋长习俗成为国家的基础，本土政权以自身的方式解决了民族问题。"
 RULE_OPTION_FIJ_TECHNOCRACY: "工程师政府"
 RULE_OPTION_FIJ_TECHNOCRACY_DESC: "一个由工程师、规划师和行政人员组成的委员会掌控国家，并依据一部技术官僚宪法进行治理。政党政治让位于自动化和工业规划，斐济的目标是超越该地区所有其他经济体。"
 RULE_OPTION_FIJ_EARLY_JUNTA: "兵营提前行动"
 RULE_OPTION_FIJ_EARLY_JUNTA_DESC: "千禧年人质危机始终未能得到控制，§8斐济军方§!在议会仍被围困的情况下彻底占领了整个国家。一个军事化的社会提前数年走向僵化，政变的恶习也更早地在该地区扎根。"
 RULE_OPTION_FIJ_EARLY_KINGDOM: "王冠提前回归"
 RULE_OPTION_FIJ_EARLY_KINGDOM_DESC: "千禧年人质危机最终以§8大酋长委员会§!拥立一位民选国王而非恢复共和制而告终。君主制提前整整一代人得以复辟，而原本可能随之而来的第二次危机也因此而未发生。"
 RULE_OPTION_FRA_SOCIALIST: "社会主义者的回归"
 RULE_OPTION_FRA_SOCIALIST_DESC: "§8社会党§!入主爱丽舍宫，执政纲领包括扩大福利、缩短工时和放缓公共支出。法国留在北约和欧盟内，但主张建立一个社会化的欧洲，而非纯粹的自由主义欧洲。"
 RULE_OPTION_FRA_LIBERAL: "自由中心"
 RULE_OPTION_FRA_LIBERAL_DESC: "中间派的§8法国民主联盟§!及其继任者§8共和国前进党§!执政的政策是放松管制、劳工改革和深化欧洲联邦主义。法国比任何其他主要大国都更积极地推动建立一个真正团结的欧盟。"
 RULE_OPTION_FRA_GAULLIST: "戴高乐主义复兴"
 RULE_OPTION_FRA_GAULLIST_DESC: "§8保卫法兰西联盟§!重拾戴高乐主义主权主义，使法国脱离北约指挥，并坚持独立的核态势。法国保留了其欧洲议会席位，但拒绝追随华盛顿的领导。"
 RULE_OPTION_FRA_GREEN: "绿色共和国"
 RULE_OPTION_FRA_GREEN_DESC: "§8绿党§!及其继任者§8欧洲生态绿党§!赢得政权，引领国家走向生态转型，重新审视核电站和重工业的发展方向。法国以牺牲部分经济增长为代价，换取了欧洲最响亮的环保之声。"
 RULE_OPTION_FRA_FRANCE_UNBOWED: "不屈法国"
 RULE_OPTION_FRA_FRANCE_UNBOWED_DESC: "§8不屈法国§!凭借建立第六共和国和打破欧洲财政正统的承诺，将激进左翼推上执政地位。法国反对欧盟规则，并在西方阵营之外寻求合作伙伴。"
 RULE_OPTION_FRA_NATIONAL_RALLY: "国民联盟"
 RULE_OPTION_FRA_NATIONAL_RALLY_DESC: "§8国民阵线§!及其继任者§8国民联盟§!彻底赢得共和国大选，并以限制移民和民族优先政策为执政纲领。法国在布鲁塞尔寻求退出欧盟，并加深与莫斯科的关系。"
 RULE_OPTION_ETH_DERG_RESTORATION: "德尔格回归"
 RULE_OPTION_ETH_DERG_RESTORATION_DESC: "埃塞俄比亚恢复了门格斯图·海尔·马里亚姆的总统地位，并在§8埃塞俄比亚人民民主共和国§!的领导下重建了共产主义统治。该国与中国结盟，并奉行泛非共产主义团结。"
 RULE_OPTION_EST_HISTORICAL: "史实"
 RULE_OPTION_EST_HISTORICAL_DESC: "§8改革党§!推行彻底的放松管制和单一税率，同时围绕国家网络身份构建数字国家。爱沙尼亚加入北约和欧盟，成为波罗的海地区的西方支柱，并成为制衡俄罗斯影响力的重要力量。"
 RULE_OPTION_EST_CONSERVATIVE: "传统爱沙尼亚"
 RULE_OPTION_EST_CONSERVATIVE_DESC: "§8祖国党§!大力投资教育和家庭福利，同时提供有利于企业的税收优惠并推行有针对性的就业计划。爱沙尼亚保持着西方和亲欧的立场，但在社会层面却趋于封闭，收紧移民政策，并将文化保护置于世界主义之上。"
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC: "北欧模式"
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC_DESC: "§8社会民主党§!致力于构建北欧式福利国家，其基础是最低工资、赋予工会权力以及国家主导的产业投资。爱沙尼亚保持其西方路线，但以社会民主国家的身份融入欧洲，倡导工人权利和工作场所的平等。"
 RULE_OPTION_EST_CENTRIST: "东方平衡"
 RULE_OPTION_EST_CENTRIST_DESC: "§8中间党§!放弃了爱沙尼亚的亲大西洋路线，重新开放与俄罗斯的贸易，并积极争取俄语少数族裔的支持，同时力促与拉脱维亚和立陶宛结盟。爱沙尼亚成为东西方之间的中立桥梁，波罗的海地区失去了其最坚定的北约支持者。"
 RULE_OPTION_EST_NATIONALIST: "爱沙尼亚优先"
 RULE_OPTION_EST_NATIONALIST_DESC: "§8爱沙尼亚保守人民党§!夺取政权，将国家资源据为己有，并将亲欧政党及其支持者逐出政坛。爱沙尼亚退出欧洲一体化进程，大力扩充军备，并对拉脱维亚、立陶宛、芬兰和瑞典提出领土要求，使波罗的海地区成为冲突爆发点。"
 RULE_OPTION_GRN_HISTORICAL: "史实"
 RULE_OPTION_GRN_HISTORICAL_DESC: "格陵兰从丹麦获得自治权，​​并将精力投入到定居、渔业、采矿和公共服务领域，而非对外冒险。北极保持平静，格陵兰的北欧邻国也维持着原有的边界。"
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY_DESC: "格陵兰岛将冰岛、法罗群岛、丹麦、挪威、瑞典和芬兰统一成一个§8北欧联盟§!，然后止步于波罗的海沿岸。斯堪的纳维亚半岛发出统一的声音，而更广泛的欧洲秩序则维持原状。"
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY_DESC: "格陵兰岛将§8北欧联盟§!向南向东扩张，直至§8冰封联邦§!横跨欧洲大部分地区。欧洲大陆的首都都向努克汇报，旧的欧洲秩序就此终结。"
 RULE_OPTION_GRE_HISTORICAL: "史实"
 RULE_OPTION_GRE_HISTORICAL_DESC: "§8新民主党§!凭借紧缩政策和欧元政策带领希腊渡过了债务危机，在经济复苏到来之前大幅削减了预算。雅典进一步巩固了自身在欧盟和北约中的地位，并将塞浦路斯、以色列和法国纳入东地中海战线。"
 RULE_OPTION_GRE_COMMUNIST: "红色卫城"
 RULE_OPTION_GRE_COMMUNIST_DESC: "希腊政权崩溃后，§8希腊共产党§!接管了国家，制定了新宪法，将银行国有化，并组建了一支红军。希腊退出北约，并在巴尔干地区组织了一个共产主义阵营，向保加利亚、阿尔巴尼亚、北马其顿、塞尔维亚和罗马尼亚提出领土要求。"
 RULE_OPTION_GRE_NATIONALIST: "金色黎明"
 RULE_OPTION_GRE_NATIONALIST_DESC: "§8金色黎明党§!趁着希腊经济崩溃之际攫取政权，将共和国置于梅塔克西主义独裁统治之下，并压制新闻媒体和反对派。希腊重拾“伟大理想”，并对阿尔巴尼亚、保加利亚、北马其顿和土耳其提出领土要求。"
 RULE_OPTION_GRE_MULTIPOLAR: "转向东方"
 RULE_OPTION_GRE_MULTIPOLAR_DESC: "共和国幸存下来，但转而攻击欧盟，向俄罗斯、中国和伊朗示好，并将比雷埃夫斯港出售给中国资本。希腊加入金砖国家并退出北约，用其在西方阵营的地位换取多极秩序中的席位。"
 RULE_OPTION_GER_HISTORICAL: "史实"
 RULE_OPTION_GER_HISTORICAL_DESC: "§8社会民主党§!与§8绿党§!联合执政，不顾自身支持者的反对，强行推行哈茨劳工改革，随后将总理职位交给§8基督教民主联盟§!，组建长期联合政府。德国继续留在北约，并在欧盟中扮演着核心角色。"
 RULE_OPTION_GER_LIBERAL: "自由共和国"
 RULE_OPTION_GER_LIBERAL_DESC: "§8自由民主党§!摆脱了其从属伙伴的角色，带领国家走向自由市场、放松管制、国防私有化和数字化国家。德国加强了与北约的联系，并向其积分体系中排名最高的国家开放边境。"
 RULE_OPTION_GER_POPULIST: "另类崛起"
 RULE_OPTION_GER_POPULIST_DESC: "§8另类选择党§!在移民、伊斯兰教、疑欧主义和气候问题上摆脱边缘地位，跻身政府决策层。德国在与莫斯科关系升温的同时，也在欧盟内部对欧盟进行瓦解。"
 RULE_OPTION_GEO_HISTORICAL: "史实"
 RULE_OPTION_GEO_HISTORICAL_DESC: "玫瑰革命推翻了§8格鲁吉亚公民联盟§!，米哈伊尔·萨卡什维利使格鲁吉亚更加亲北约和西方。格鲁吉亚在与俄罗斯争夺分裂共和国的战争中战败，随后和平地将权力移交给§8格鲁吉亚梦想党§!。"
 RULE_OPTION_GEO_SHEVARDNADZE_WEST: "谢瓦尔德纳泽永存"
 RULE_OPTION_GEO_SHEVARDNADZE_WEST_DESC: "爱德华·谢瓦尔德纳泽镇压反对派而非向其屈服，§8格鲁吉亚公民联盟§!使国家在没有发生革命的情况下继续走西进路线。格鲁吉亚仍然是一个威权国家，尽管如此，布鲁塞尔和华盛顿仍在拉拢它们。"
 RULE_OPTION_GEO_PRO_RUSSIAN: "向莫斯科让步"
 RULE_OPTION_GEO_PRO_RUSSIAN_DESC: "§8格鲁吉亚公民联盟§!与克里姆林宫达成协议，俄罗斯军事基地保留原状，分裂共和国的归属问题也按照莫斯科的条件解决。格鲁吉亚加入独联体，脱离西方阵营。"
 RULE_OPTION_GEO_NATIONALIST: "骑士归来"
 RULE_OPTION_GEO_NATIONALIST_DESC: "§8骑士§!准军事组织死灰复燃，夺取政权，格鲁吉亚开始追求建立一个不隶属于任何阵营的“大格鲁吉亚”。亚美尼亚、阿塞拜疆和各个分离共和国都成了攻击目标，而不再只是邻国。"
 RULE_OPTION_GEO_COMMUNIST: "苏维埃共和国复辟"
 RULE_OPTION_GEO_COMMUNIST_DESC: "§8格鲁吉亚联合共产党§!将通过选举或革命重新执政，并再次宣布成立苏维埃共和国。格鲁吉亚与亚美尼亚和阿塞拜疆接洽，以重建外高加索联邦。"
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT: "民族运动盛行"
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT_DESC: "历史最终走向战争及其后的和解，但萨卡什维利的§8统一民族运动§!保住了总统职位，而非失去它。格鲁吉亚加倍坚定地加入北约，并以公开的敌对态度回应莫斯科。"
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS: "爱国者联盟"
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS_DESC: "战后格局如期而至，随后§8爱国者联盟§!凭借民族主义和社会保守主义纲领赢得大选。格鲁吉亚疏远布鲁塞尔，重新向东方靠拢。"
 RULE_OPTION_GEO_UNITED_GEORGIA: "东西方之间"
 RULE_OPTION_GEO_UNITED_GEORGIA_DESC: "战后格局如期而至，随后§8统一的格鲁吉亚§!政府上台，奉行多元化的外交政策。格鲁吉亚力求在欧盟、俄罗斯及其邻国之间保持平衡，而不是在它们之间做出选择。"
 RULE_OPTION_IND_PARTY_OF_STRUGGLE: "斗争党"
 RULE_OPTION_IND_PARTY_OF_STRUGGLE_DESC: "§8印度尼西亚民主斗争党§!上台执政，成为该国最大的世俗民族主义力量，保护争议地区的宗教少数群体，并推进潘查希拉原则，抵制激进化。印度尼西亚将外交重心转向东方，与中国和俄罗斯接轨，同时在群岛各地建立左翼民族主义堡垒。"
 RULE_OPTION_IND_DEMOCRAT_PARTY: "技术官僚式总统制"
 RULE_OPTION_IND_DEMOCRAT_PARTY_DESC: "改革派领导人将§8民主党§!内的技术官僚精英聚集在一起，优先考虑经济增长、制度稳定和投资者信心。印尼作为东南亚专业高效治理的典范，依然坚定地与西方保持紧密联系。"
 RULE_OPTION_IND_UNITED_DEVELOPMENT: "联合发展阵线"
 RULE_OPTION_IND_UNITED_DEVELOPMENT_DESC: "植根于新秩序伊斯兰建制网络的§8联合发展党§!，通过庇护、私人关系和精英共识而非结构性改革来掌控国家并进行统治。印尼在保持其西方根基的同时，通过非正式的权力结构和交易型政治，不断深化其伊斯兰身份认同。"
 RULE_OPTION_IND_PROSPEROUS_JUSTICE: "繁荣正义运动"
 RULE_OPTION_IND_PROSPEROUS_JUSTICE_DESC: "§8繁荣正义党§!是一个纪律严明的伊斯兰主义运动，以反腐败和基层动员为基础，夺取政权，并粉碎了自改革运动以来一直统治印尼的庇护网络。印尼敌视西方的指导，社会立场保守，并以独立行动者的身份，游离于自由秩序和旧精英阶层之外，向东方发展。"
 CHE_AI_BEHAVIOR: "@CHE 车臣"
 RULE_OPTION_CHE_HISTORICAL: "史实"
 RULE_OPTION_CHE_HISTORICAL_DESC: "第二次战争以§8伊奇克里亚共和国§!被摧毁告终，该共和国在卡德罗夫政权的统治下重新并入俄罗斯。车臣以独立换取重建资金，并成为莫斯科在高加索地区最可靠的执法者。"
 RULE_OPTION_CHE_CALIPHATE: "高加索酋长国"
 RULE_OPTION_CHE_CALIPHATE_DESC: "外国§8圣战者§!将世俗分离主义者排挤出局，并以伊斯兰教法统治共和国的残余部分。车臣成为§8基地组织§!的庇护所，并成为向高加索地区乃至俄罗斯境内发动圣战的出发点。"
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION: "高加索邦联"
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION_DESC: "世俗官员击溃了§8伊斯兰主义者§!，并将伊奇克里亚重建为北高加索各民族联盟的核心。车臣依靠安卡拉和巴库的力量，以阻止莫斯科介入山区事务。"
 RULE_OPTION_CHE_WESTERN_ALIGNMENT: "来自西方的认可"
 RULE_OPTION_CHE_WESTERN_ALIGNMENT_DESC: "§8伊斯兰主义者§!被驱逐出境，车臣共和国将独立后的时间用于寻求西方国家的承认，而不是在山区寻求盟友。车臣凭借民主信誉和在欧洲的话语权换取了生存。"
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS: "红色高加索"
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS_DESC: "§8萨尔曼·拉杜耶夫§!的派系占领了车臣共和国，并将伊斯兰教与山区至今仍保留的苏联秩序融合在一起。车臣宣布成立高加索社会主义共和国，并与莫斯科建立平等关系，而非臣属关系。"
 EGY_AI_BEHAVIOR: "@EGY 埃及"
 RULE_OPTION_EGY_HISTORICAL: "史实"
 RULE_OPTION_EGY_HISTORICAL_DESC: "埃及先是让§8民族民主党§!执政，直到广场上的民众将其赶尽杀绝，然后让§8穆斯林兄弟会§!执政一届，最后又将总统职位交还给其将军们。与以色列的和平得以维持，美国的援助源源不断，开罗也开始维护阿拉伯秩序，而不是与之对抗。"
 RULE_OPTION_EGY_BROTHERHOOD: "兄弟会执政"
 RULE_OPTION_EGY_BROTHERHOOD_DESC: "埃及保留了民选的§8穆斯林兄弟会§!政府，收买官员而非清洗他们，并制定了一部法院无法推翻的伊斯兰宪法。开罗向安卡拉、多哈和哈马斯靠拢，海湾君主国将其视为威胁。"
 RULE_OPTION_EGY_PAN_ARAB: "纳赛尔的继承人"
 RULE_OPTION_EGY_PAN_ARAB_DESC: "埃及让§8民族阵线§!重新掌权，将制高点收归国有，并恢复了阿拉伯联合共和国。开罗拉拢大马士革、巴格达和的黎波里，并疏远华盛顿。"
 RULE_OPTION_EGY_SALAFIST: "萨拉菲主义转向"
 RULE_OPTION_EGY_SALAFIST_DESC: "埃及将§8光明党§!扶入总统府，中止选举，并以宗教法律统治。科普特人作为受保护的少数群体，受伊斯兰教法管辖，西奈战役演变为圣战。"
 RULE_OPTION_EGY_COPTIC: "科普特统治"
 RULE_OPTION_EGY_COPTIC_DESC: "埃及被§8科普特教会§!及其世俗盟友掌控，他们声称自己拥有法老的遗产，而非阿拉伯人的遗产。开罗庇护着从巴勒斯坦到亚述的基督徒，却发现自己在自己的区域内陷入孤立。"
 HEZ_AI_BEHAVIOR: "@HEZ 真主党"
 RULE_OPTION_HEZ_HISTORICAL: "史实"
 RULE_OPTION_HEZ_HISTORICAL_DESC: "§8真主党§!以政党身份参加选举，保留了曾与以色列作战的§8塔比亚§!游击队，并与§8黎巴嫩武装部队§!并肩作战，而非取而代之。它与大马士革、§8伊拉克什叶派民兵§!和§8胡塞武装§!并肩作战，同时保持着黎巴嫩国中之国的地位。"
 RULE_OPTION_HEZ_LAND_OF_GOD: "上帝之地"
 RULE_OPTION_HEZ_LAND_OF_GOD_DESC: "§8真主党§!脱离黎巴嫩，在南部和贝卡谷地建立了一个获得国际社会认可的伊斯兰国家，积极争取盟友，并提高了其统治下村庄的生活水平。它组建了远征军和对外情报机构，使黎巴嫩的一个派别发展成为一支名副其实的地区性力量。"
 RULE_OPTION_HEZ_CONQUER_LEBANON: "黎巴嫩主人"
 RULE_OPTION_HEZ_CONQUER_LEBANON_DESC: "§8真主党§!武装§8黎巴嫩武装部队§!的叛逃者，并通过公开战争而非选举夺取黎巴嫩政权。它利用伊朗的资金、工厂和道路来资助这场战争，并将黎巴嫩吞并为一个对德黑兰负责的伊斯兰共和国。"
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE: "输出革命"
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE_DESC: "§8真主党§!在黎巴嫩站稳脚跟，并将资金投入到海外的各种网络中，从西非的§8伊斯兰运动§!到散居海外的真主党成员，再到从委内瑞拉延伸出去的贩毒集团。它在北美内部也建立了组织和民兵，将战争的战火蔓延到黎凡特地区以外。"
 IRQ_AI_BEHAVIOR: "@IRQ 伊拉克"
 RULE_OPTION_IRQ_HISTORICAL: "史实"
 RULE_OPTION_IRQ_HISTORICAL_DESC: "伊拉克在萨达姆·侯赛因的§8复兴党§!统治下，直到美国入侵推翻了该政权；随后，占领政府在巴格达进行统治，权力则转移到什叶派宗教政党§8伊斯兰宣教党§!手中。伊拉克最终成为一个由美国扶持的共和国，但其外交关系却逐渐倒向了伊朗。"
 RULE_OPTION_IRQ_BAATHIST_STATE: "复兴党永存"
 RULE_OPTION_IRQ_BAATHIST_STATE_DESC: "§8复兴党§!在美国入侵后幸存下来，打破了制裁制度，解决了家族内部的权力继承问题，并重新提出了对科威特、库尔德地区和伊朗胡齐斯坦省的主权要求。海湾国家与一个未受分裂的§8复兴党§!统治的伊拉克毗邻，后者向邻国施压，并宣扬其泛阿拉伯野心。"
 RULE_OPTION_IRQ_SHIA_THEOCRACY: "法学家的统治"
 RULE_OPTION_IRQ_SHIA_THEOCRACY_DESC: "什叶派宗教人士和§8巴德尔组织§!接管了战后政权，建立了一个由法学家统治、与德黑兰结盟的共和国。巴格达成为伊朗通往大马士革和贝鲁特的西轴中心。"
 RULE_OPTION_IRQ_SADRIST: "萨德里斯特潮"
 RULE_OPTION_IRQ_SADRIST_DESC: "§8穆克塔达·萨德尔§!的运动从巴格达贫民窟兴起，驱逐了美国人，并以什叶派民粹主义和伊拉克民族主义力量统治伊拉克，它像拒绝美国一样坚决地拒绝伊朗的庇护。伊拉克变得封闭，对所有外国支持者都抱有敌意。"
 RULE_OPTION_IRQ_SECULAR_REPUBLIC: "世俗共和国"
 RULE_OPTION_IRQ_SECULAR_REPUBLIC_DESC: "§8伊拉克国民大会§!和§8伊拉克民族和解§!的世俗反对派制定了一部超越教派和民族的宪法，并将国家维系为一个阿拉伯共和国，而非宗教共和国。伊拉克以亲西方的世俗国家身份重新融入阿拉伯秩序。"
 RULE_OPTION_IRQ_COMMUNIST: "社会主义伊拉克"
 RULE_OPTION_IRQ_COMMUNIST_DESC: "自§8复兴党§!清洗以来一直处于地下状态的§8伊拉克共产党§!走出地下，赢得了工人、妇女和库尔德人的支持，并夺取了共和国政权。伊拉克成为石油君主国中的社会主义国家。"
 RAJ_AI_BEHAVIOR: "@RAJ 印度"
 RULE_OPTION_RAJ_HISTORICAL: "史实"
 RULE_OPTION_RAJ_HISTORICAL_DESC: "印度在§8印度人民党§!和§8印度国民大会党§!之间轮流执政，同时保持经济自由化，并致力于§8金砖国家§!合作以及奉行多极化、不结盟的外交政策。印度与华盛顿和莫斯科都保持着密切联系，同时也在发展中国家确立了自身的重要地位。"
 RULE_OPTION_RAJ_GREATER_INDIA: "大印度"
 RULE_OPTION_RAJ_GREATER_INDIA_DESC: "印度教民族主义阵线夺取政权，在国内实行印度教多数派统治，同时维护种姓等级制度，剥夺少数群体的保护。印度转向自给自足、孤立主义，并对尼泊尔、不丹和孟加拉国提出领土要求，建立了一个威权主义的泛印度政权。"
 RULE_OPTION_RAJ_RED_REPUBLIC: "红色共和国"
 RULE_OPTION_RAJ_RED_REPUBLIC_DESC: "§8印度共产党§!赢得政权，实行经济国有化，恢复五年计划经济，同时与中国结盟，并放弃了对阿克赛钦的主权声索。印度将革命输出到整个南亚，成为该地区激进社会主义的先锋。"
 RULE_OPTION_RAJ_PEOPLES_FRONT: "人民阵线"
 RULE_OPTION_RAJ_PEOPLES_FRONT_DESC: "§8大众社会党§!和§8印度社会党§!组成达利特社会主义联盟，旨在消除种姓特权，并在社会各阶层重新分配财富。印度在坚持不结盟外交政策的同时，致力于构建北欧式福利国家。"
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT: "西方盟友"
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT_DESC: "印度与法国和以色列关系日益密切，成为美国重要的非北约盟友，并深化与华盛顿的军事和贸易合作。印度承认台湾，并最终加入北约，巩固了其在西方联盟中的地位。"
 RULE_OPTION_JAP_NORMAL_NATION: "正常国家"
 RULE_OPTION_JAP_NORMAL_NATION_DESC: "§8自由民主党§!利用第九条共识，最终将自卫队写入宪法，使其成为与其他军队一样的正规军。日本在美国同盟内重新武装，并开始独立应对北京和平壤的挑战。"
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY: "第二次战后时期"
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY_DESC: "§8民主党§!打破了保守派对国会的控制，以信息公开、劳动法和对外籍劳工开放为执政方针。日本将精力投入到提高出生率、扶持工薪阶层以及根除泡沫经济破灭后依然存在的腐败问题上，而不是关注地区发展。"
 RULE_OPTION_JAP_PACIFIST: "和平宪法"
 RULE_OPTION_JAP_PACIFIST_DESC: "§8社会民主党§!承诺第九条将严格执行，以此赢得国会，并最终解散了武器出口、军事基地以及自卫队。日本撕毁了与华盛顿的安保条约，并在中国和朝鲜半岛之间解除武装。"
 RULE_OPTION_HKG_HISTORICAL: "史实"
 RULE_OPTION_HKG_HISTORICAL_DESC: "§8亲北京阵营§!使香港特别行政区继续沿着北京的路线发展，依托爱国者重建§8立法会§!，在学校推行爱国主义教育，并任由粤式公民生活萎缩。随资金来源而来：香港成为人民币离岸中心和§8一带一路§!的融资中心，§8粤港澳大湾区§!则吞噬了§8基本法§!所承诺的一切。"
 RULE_OPTION_HKG_INDEPENDENCE: "我们自己的国家"
 RULE_OPTION_HKG_INDEPENDENCE_DESC: "香港推翻傀儡政权，制定了自己的宪法，并组建军队和航母舰队保卫自身。随后，香港对珠江三角洲提出领土收复主义宣称，要求北京对广东的归属问题作出解释。"
 RULE_OPTION_HKG_BRITISH: "重返王冠之下"
 RULE_OPTION_HKG_BRITISH_DESC: "香港脱离中国主权管辖，要求伦敦回归，赋予英国驻军权，加入§8奥库斯§!情报共享机制，并立法实行普选和建立独立的司法体系。这个位于中国家门口的§8英联邦§!实体，为西方提供了北京数十年来一直试图关闭的民主立足点。"
 RULE_OPTION_HKG_CITY_STATE: "自由市"
 RULE_OPTION_HKG_CITY_STATE_DESC: "香港自行修改了§8基本法§!，保留了海岸防卫部队而非陆军，并成为东亚的金融中心。它不隶属于任何集团，既与北京也与华盛顿进行贸易，且不受任何一方管辖。"
 ISR_AI_BEHAVIOR: "@ISR 以色列"
 RULE_OPTION_ISR_HISTORICAL: "史实"
 RULE_OPTION_ISR_HISTORICAL_DESC: "§8利库德集团§!在和平谈判破裂后接管国家，在隔离墙后镇压了第二次巴勒斯坦起义，并将定居者撤出加沙。以色列继续与华盛顿保持密切关系，与海湾阿拉伯国家实现关系正常化，并将伊朗视为一切的根本威胁。"
 RULE_OPTION_ISR_PEACE_PROCESS: "和平营"
 RULE_OPTION_ISR_PEACE_PROCESS_DESC: "§8工党§!与§8梅雷兹党§!和阿拉伯政党联合执政，并认真就两国方案进行谈判。巴勒斯坦权力机构作为合作伙伴而非嫌疑人被武装起来，加沙地带也获得了一个可用的港口和机场。"
 RULE_OPTION_ISR_SECULAR_CENTRE: "世俗中心"
 RULE_OPTION_ISR_SECULAR_CENTRE_DESC: "§8未来党§!、§8蓝白党§!和§8新希望党§!掌控了国家，并将宗教从国家权力中剥离出来。法院受到保护，征兵制度被修改，以色列向欧洲和经合组织靠拢。"
 RULE_OPTION_ISR_GREATER_ISRAEL: "大以色列"
 RULE_OPTION_ISR_GREATER_ISRAEL_DESC: "§8犹太力量党§!和§8宗教锡安主义§!夺取政权，摧毁了奥斯陆协议框架的残余。定居点被合并和吞并，圣殿山现状被改写，军队在北方遭到攻击之前先发制人。"
 RULE_OPTION_ISR_LOOK_EAST: "转向东方"
 RULE_OPTION_ISR_LOOK_EAST_DESC: "§8利库德集团§!政府逐渐疏远华盛顿，将海法港租借给中国运营商，并向北京出售武器和技术。以色列倒向莫斯科而非基辅，曾经保障以色列的西方联盟也开始显得不切实际。"
 RULE_OPTION_LBA_HISTORICAL: "史实"
 RULE_OPTION_LBA_HISTORICAL_DESC: "卡扎菲镇压了§8利比亚伊斯兰战斗组织§!，放弃了武器计划，并通过谈判摆脱了国际制裁。最终，卡扎菲政权在起义中垮台，利比亚落入一位指挥§8利比亚国民军§!的军事强人手中。"
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE: "伊斯兰哈里发国"
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE_DESC: "卡扎菲容忍了§8利比亚伊斯兰战斗组织§!的存在，该组织刺杀了他并建立了一个萨拉菲主义国家。利比亚成为萨赫勒地区圣战的基地，导致乍得、尼日尔、尼日利亚、阿尔及利亚、马里和毛里塔尼亚局势动荡。"
 RULE_OPTION_LBA_LIBYAN_REPUBLIC: "利比亚共和国"
 RULE_OPTION_LBA_LIBYAN_REPUBLIC_DESC: "利比亚修订了绿皮书，赋予人民代表大会更大的权力，并使政党合法化。国家转型为总统制共和国，竞争性政治取代了卡扎菲的直接民主。"
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION: "反殖民联盟"
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION_DESC: "卡扎菲继续执政，建立了§8反殖民联盟§!，武装了非洲和中东各地的叛乱势力。利比亚成为革命运动的中心，动摇了邻国的稳定，并将混乱蔓延至两大洲。"
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC: "阿拉伯联合共和国"
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC_DESC: "卡扎菲继续执政并与§8复兴党人§!合作，建立§8阿拉伯联合共和国§!。利比亚并入一个横跨毛里塔尼亚至也门的泛阿拉伯国家，重塑了阿拉伯世界的地缘政治格局。"
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA: "非洲合众国"
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA_DESC: "卡扎菲继续执政，并致力于建立一个以他自己为首的§8非洲合众国§!。利比亚成为一个非洲超级大国的首都，彻底改变了非洲大陆的政治秩序。"