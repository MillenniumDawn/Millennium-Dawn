 CPD_peace_deal_explainer_ICON_TT: "Jak działają traktaty pokojowe"
 CPD_peace_deal_explainer_ICON_TT_DELAYED: "Tworzenie układu pokojowego jest tak proste, jak wybranie zakładki powyżej, a następnie zdecydowanie, czy chcesz §Yoddać§! lub §Yzażądać§! dany region.\n\nZbudowanie układu pokojowego o §Ynegatywnym§! koszcie zwiększa szanse na jego zaakceptowanie przez SI, natomiast układ o §Ypozytywnym§! koszcie ma mniejsze szanse na akceptację. Pełen podział czynników wpływających na decyzję SI możesz zobaczyć, najeżdżając kursorem na pole akceptacji.\n\nUkłady pokojowe tworzone z myślą o graczu nie są zależne od tych wartości."
 CPD_annex_state_button_TT: "[CPD_ANNEX_STATE_TT_LOC]"
 CPD_annex_state_button_TT_DELAYED: "[CPD_ANNEX_STATE_TT_DELAYED_LOC]"
 CPD_annex_state_button_TT_DEMAND: "Żądajmy regionów"
 CPD_annex_state_button_TT_CONCESSION: "Oddajmy regiony"
 CPD_annex_state_button_TT_DELAYED_DEMAND: "Wybrane terytoria wroga są anektowane do naszego kraju wraz z ich ludnością, fabrykami i zasobami. Państwa, w których posiadamy rdzenie, ponoszą połowę wartości strategicznej; państwa rościły sobie prawa do jednej trzeciej. Żądanie ziemi, której pierwotny właściciel nadal jest właścicielem, podwaja koszt."
 CPD_annex_state_button_TT_DELAYED_CONCESSION: "§Y Oddanie prowincji §! oznacza przekazanie ich wrogowi. Każde ustępstwo terytorialne obniża całkowity koszt układu, czyniąc nasze pozostałe żądania bardziej atrakcyjnymi."
 CPD_make_puppet_button_TT: "[CPD_MAKE_PUPPET_TT_LOC]"
 CPD_make_puppet_button_TT_DELAYED: "[CPD_MAKE_PUPPET_TT_DELAYED_LOC]"
 CPD_make_puppet_button_TT_DEMAND: "Utworzenie rządu marionetkowego"
 CPD_make_puppet_button_TT_CONCESSION: "Oddanie rządu marionetkowego"
 CPD_make_puppet_button_TT_DELAYED_DEMAND: "Żądanie ustanowienia §Y Rządu marionetkowego §! pozwala wydzielić nowe państwo zależne z wybranych terytoriów wroga. Nowa marionetka przejmuje kulturę państwa macierzystego, lecz w kwestiach polityki zagranicznej podlega nam. Jeśli posiadamy już państwo zależne roszczące sobie prawa do terytoriów państwa macierzystego, obszary te zostaną przyłączone do tego istniejącego podmiotu, zamiast prowadzić do utworzenia nowego."
 CPD_make_puppet_button_TT_DELAYED_CONCESSION: "Zgoda na ustanowienie §Y Rządu marionetkowego §! pozwala wrogowi wydzielić państwo zależne z terytoriów, które obecnie kontrolujemy. Nowy rząd marionetkowy podlega właśnie jemu."
 CPD_demilitarise_state_button_TT: "[CPD_DEMILITARISE_TT_LOC]"
 CPD_demilitarise_state_button_TT_DELAYED: "[CPD_DEMILITARISE_TT_DELAYED_LOC]"
 CPD_demilitarise_state_button_TT_DEMAND: "Żądaj demilitaryzacji regionów"
 CPD_demilitarise_state_button_TT_CONCESSION: "Zaproponuj demilitaryzacje regionów"
 CPD_demilitarise_state_button_TT__DELAYED_DEMAND: "Żądanie §Y Demilitaryzacji §! zmienia wybrane państwa wrogie w strefy, w których nie mogą operować żadne siły zbrojne. Ich właściciel nie może tam stacjonować wojsk ani wznosić fortyfikacji."
 CPD_demilitarise_state_button_TT__DELAYED_CONCESSION: "Zgoda na §Y Demilitaryzację §! nakłada na nasze własne państwa te same ograniczenia. Nie będziemy mogli przemieszczać ani stacjonować sił na objętych nią terytoriach."
