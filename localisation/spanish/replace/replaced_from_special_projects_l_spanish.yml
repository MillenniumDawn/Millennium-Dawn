 sp_secure_military_network: "Red militar segura"
 sp_secure_military_network_desc: "Una red troncal de comunicaciones nacionales reforzada y encriptada que vincula el mando, los sensores y las fuerzas con enlaces de datos resilientes y de baja latencia."
 scientist_trait_antarctica_specialist: "Especialista en investigación polar"
 scientist_trait_antarctica_specialist_desc: "Un investigador curtido que prospera en el entorno más duro del mundo, especializado en sostener y avanzar las operaciones en el hielo antártico."
 scientist_trait_naval_armament_specialist: "Especialista en armamento naval"
 scientist_trait_naval_armament_specialist_desc: "Un especialista en armamento naval, desde cañones de riel y torpedos hasta enjambres de drones y módulos de contramedidas."
 scientist_trait_naval_propulsion_specialist: "Especialista en propulsión naval"
 scientist_trait_naval_propulsion_specialist_desc: "Un experto en plantas de energía marina avanzadas, que impulsa a los buques de guerra a mayor velocidad y distancia mediante propulsión nuclear y de fusión."
 scientist_trait_tank_firepower_specialist: "Especialista en potencia de fuego de tanques"
 scientist_trait_tank_firepower_specialist_desc: "Una autoridad en el armamento de vehículos blindados, desde cañones avanzados y cargadores automáticos hasta cañones de riel y láseres montados en vehículos."
 scientist_trait_tank_armor_specialist: "Especialista en protección de tanques"
 scientist_trait_tank_armor_specialist_desc: "Un especialista en la supervivencia de vehículos blindados, desarrollando blindajes compuestos, sistemas de protección activa y camuflaje adaptativo."
 scientist_trait_tank_mobility_specialist: "Especialista en movilidad de tanques"
 scientist_trait_tank_mobility_specialist_desc: "Un experto en sistemas de propulsión y chasis de vehículos blindados, desde transmisiones eléctricas hasta suspensiones andantes."
 scientist_trait_robotics_specialist: "Experto en robótica y autonomía"
 scientist_trait_robotics_specialist_desc: "Un pionero de los sistemas autónomos, que enseña a las máquinas en tierra, mar y aire a pensar, cazar y trabajar sin un humano en el proceso."
 sp_amws_combat_system_desc: "Desarrollar un sistema de armas avanzado para nuestras plataformas HACS. Completar este proyecto desbloquea el módulo §YSistema de combate AMWS-21§!."
 sp_zamws_advanced_mws_desc: "Desarrollar un sistema de armas múltiples más avanzado para nuestras plataformas HACS. Completar este proyecto desbloquea el módulo §YSistema avanzado de armas múltiples XAMWS-24§!."
 sp_xciws_close_in_weapon_system_desc: "Desarrollar un sistema de armas de defensa de punto para nuestras plataformas HACS. Completar este proyecto desbloquea el módulo §YSistema de armas de defensa de punto XCIWS-2B§!."
 sp_close_range_battle_halberd_desc: "Desarrollar una alabarda de corto alcance para nuestras plataformas HACS. Completar este proyecto desbloquea el módulo §YAlabarda de combate de corto alcance Tipo-77§!."
 sp_great_sword_desc: "Desarrollar un espadón potente para nuestras plataformas HACS. Completar este proyecto desbloquea el módulo §YEspadón BWS-3§!."