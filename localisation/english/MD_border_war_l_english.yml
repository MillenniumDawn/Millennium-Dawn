 attack_475_from_589: "Attack Arunachal Pradesh from Xizang"
 attack_475_from_589_desc: "Advance across the McMahon Line from Xizang to seize Arunachal Pradesh. The operation only goes ahead once readiness is above 60 and tension reaches 80."
