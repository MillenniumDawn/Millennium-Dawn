 neutrality_clique_desc: "Предпочитает строгую политику неприсоединения, поддерживая баланс сил между великими державами, а не привязывая Сингапур к какому-либо лагерю."
 nationalist_clique_desc: "Он выступает за самодостаточный Сингапур, ставящий во главу угла национальную идентичность, отводя страну от иностранных блоков и направляя её к решительному националистическому курсу."
