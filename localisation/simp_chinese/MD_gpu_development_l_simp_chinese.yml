l_simp_chinese:
 gpu_development.1.t: "Radeon向GeForce发起挑战"
 gpu_development.1.d_usa: "在英伟达的GeForce推出硬件加速和光照技术数月后，冶天正准备推出Radeon，直接挑战其在速度、驱动程序和开发者忠诚度方面的领先地位。这场竞争正将美国图形设计推向新的高度，但两家公司都是无晶圆厂的，每一次进步都加深了它们对少数几家台湾代工厂的依赖。华盛顿可以选择保持图形标准和联邦研究的开放性，也可以将支持集中于实力最强的国内设计公司。"
 gpu_development.1.a_usa: "支持开放标准和研究"
 gpu_development.1.b_usa: "支持领先的设计公司"
 gpu_development.1.d_can: "冶天科技正准备在其位于马卡姆的总部发布Radeon显卡，挑战英伟达几个月前GeForce所宣称的性能领先地位。该公司是加拿大为数不多的半导体巨头之一，但要在竞争最前沿的领域脱颖而出，就需要更深入地获取资金、代工产能以及决定硬件市场走向的软件开发商资源。渥太华可以选择保护冶天作为一家国家级设计公司的独立性，也可以将其纳入将加拿大设计与美国资本和亚洲制造业联系起来的北美供应链。"
 gpu_development.1.a_can: "维护冶天的独立性"
 gpu_development.1.b_can: "将冶天整合到大陆供应链中"
 gpu_development.1.d_tai: "Radeon和GeForce之间的竞争正值台湾晶圆订单激增之际。这两家无晶圆厂设计公司都依赖本地代工厂生产芯片。这个新兴的图形市场既可能扩大台湾微芯片产业的客户群，也可能将稀缺的尖端产能集中到增长最快的几家设计公司身上。台北方面必须决定是继续向众多客户开放代工厂，还是与少数几家核心设计公司签订长期合同。"
 gpu_development.1.a_tai: "扩大代工厂准入"
 gpu_development.1.b_tai: "确保锚定设计合同"
 gpu_development.2.t: "着色器变得可编程"
 gpu_development.2.d_usa: "DirectX 8和新一代图形处理器用可编程的顶点着色器和像素着色器取代了固定的渲染管线。硬件厂商、游戏工作室和操作系统开发商现在正竞相定义将塑造实时图形的接口。"
 gpu_development.2.a_usa: "标准化着色器接口"
 gpu_development.2.b_usa: "允许供应商扩展其产品堆栈"
 gpu_development.2.d_can: "冶天的Radeon工程师正在将可编程着色器支持集成到快速发展的图形架构中。通用接口将扩大加拿大设计的市场，而专有扩展则可能使冶天暂时获得技术领先优势。"
 gpu_development.2.a_can: "围绕通用接口构建"
 gpu_development.2.b_can: "区分Radeon平台"
 gpu_development.2.d_jap: "可编程图形技术正在改变游戏主机制造商和游戏工作室在硬件和软件之间的分工方式。日本的游戏平台厂商可以选择推广可移植的着色器标准，也可以选择保留针对自家游戏主机高度优化的架构。"
 gpu_development.2.a_jap: "支持便携式图形标准"
 gpu_development.2.b_jap: "针对家用游戏机平台进行优化"
 gpu_development.3.t: "AMD收购冶天"
 gpu_development.3.d_usa: "AMD已同意收购冶天，此次交易将x86处理器、芯片组和图形业务整合到一家公司旗下。合并有望打造一体化的计算平台，同时也减少了争夺图形设计和代工产能的独立公司数量。"
 gpu_development.3.a_usa: "保持合并过程中的竞争"
 gpu_development.3.b_usa: "鼓励建立集成计算平台"
 gpu_development.4.t: "CUDA开启并行计算时代"
 gpu_development.4.d_usa: "英伟达发布了CUDA，使程序员能够利用兼容的图形处理器完成渲染以外的更多工作。科学计算、模拟和数据分析现在可以利用数千个并行线程，前提是开发者要使用英伟达的软件生态系统。"
 gpu_development.4.a_usa: "推广便携式计算标准"
 gpu_development.4.b_usa: "部署CUDA生态系统"
 gpu_development.5.t: "Alex网络改变了AI竞赛格局"
 gpu_development.5.d_usa: "Alex网络在ImageNet测试中取得的决定性成果表明，在图形处理器上训练的大型神经网络可以超越现有的计算机视觉方法。美国各大实验室和科技公司正竞相获取加速器、数据集和研究人员，以防竞争对手大规模复制这一突破。"
 gpu_development.5.a_usa: "保持加速器研究成果的广泛可及性"
 gpu_development.5.b_usa: "规模化商业AI集群"
 gpu_development.5.d_can: "多伦多大学的研究人员利用英伟达图形处理器训练了Alex网络模型，彻底改变了ImageNet图像测试的格局。加拿大如今拥有非同寻常的机器学习专业人才储备，但外国公司已经开始竞相招揽该团队并将其方法商业化。"
 gpu_development.5.a_can: "扩大公共研究网络"
 gpu_development.5.b_can: "将这一突破转化为AI产业"
 gpu_development.6.t: "张量核心进入数据中心"
 gpu_development.6.d_usa: "英伟达的伏特架构引入了张量核心，旨在加速深度学习中使用的矩阵运算。图形处理器正逐渐成为专用的数据中心引擎，这提高了对先进制造工艺、高带宽内存和高度集成软件的需求。"
 gpu_development.6.a_usa: "扩大AI加速器的使用范围"
 gpu_development.6.b_usa: "专注于全栈平台"
 gpu_development.6.d_tai: "伏特级加速器需要尖端制造技术和日益复杂的封装工艺。台湾的代工厂可以将AI芯片视为众多客户类别之一，也可以将稀缺的先进产能预留给增长最快的加速器设计商。"
 gpu_development.6.a_tai: "保持先进能力的广泛可用性"
 gpu_development.6.b_tai: "优先处理战略加速器订单"
 gpu_development.6.d_kor: "AI加速器需要高带宽内存来为数千个计算单元提供数据。韩国内存生产商可以将高带宽内存扩展为开放的行业标准，或者将新增容量与领先的加速器平台紧密结合。"
 gpu_development.6.a_kor: "规范和扩大高带宽内存供应"
 gpu_development.6.b_kor: "建立长期的加速器合作伙伴关系"
 gpu_development.7.t: "GPU供应告急"
 gpu_development.7.d_shortage: "疫情带来的冲击、电子产品需求的激增以及对代工产能的竞争，导致我们的经济面临微芯片短缺的问题。显卡、汽车、服务器和消费电子设备如今都在争夺同样的有限供应。"
 gpu_development.7.d_resilient: "疫情带来的冲击和电子产品需求的激增给全球微芯片市场造成了压力，但我们目前的供应依然稳健。海外的短缺既是警示，也是确保未来产能的契机。"
 gpu_development.7.a_usa: "协调关键用户的访问权限"
 gpu_development.7.b_usa: "加快国内产能扩张"
 gpu_development.7.a_can: "保护科研和小设计师"
 gpu_development.7.b_can: "锁定大陆供应合同"
 gpu_development.7.a_tai: "将晶圆分配给更多客户"
 gpu_development.7.b_tai: "加快代工厂扩张"
 gpu_development.7.a_kor: "稳定内存供应"
 gpu_development.7.b_kor: "扩大战略芯片生产"
 gpu_development.7.a_chi: "民用工业的配给进口"
 gpu_development.7.b_chi: "加快国内替代"
 gpu_development.7.a_jap: "保护汽车和电子产品输出"
 gpu_development.7.b_jap: "重建国内半导体产能"
 gpu_development.8.t: "霍珀成为AI引擎"
 gpu_development.8.d_usa: "英伟达的霍珀架构和H100加速器结合了Transformer Engine、高带宽内存和高速互连技术，专为大型AI模型而设计。这款数据中心加速器不再是经过改造的显卡，而是一个独立的战略计算系统。"
 gpu_development.8.a_usa: "支持更广泛的加速器生态系统"
 gpu_development.8.b_usa: "扩展领先的全栈平台"
 gpu_development.8.d_tai: "霍珀芯片依赖台积电的定制工艺和先进封装技术，将大型处理器芯片与高带宽内存连接起来。人工智能的需求正使晶圆开片和封装生产线都成为台湾微芯科技产业的战略瓶颈。"
 gpu_development.8.a_tai: "扩大先进封装的获取途径"
 gpu_development.8.b_tai: "为主要客户预留容量"
 gpu_development.8.d_kor: "H100级加速器需要大量3代高带宽内存，这使得韩国内存生产商处于AI供应链的核心地位。产能可以通过与领先平台供应商的深度合作来扩展，以满足多元化的市场需求，或确保产能稳定。"
 gpu_development.8.a_kor: "扩大3代高带宽内存供应"
 gpu_development.8.b_kor: "优先考虑战略平台合同"
 gpu_development.9.t: "AI计算建设"
 gpu_development.9.d_usa: "生成式AI引发了数据中心建设热潮，这些数据中心配备了先进的加速器。超大规模数据中心企业竞相争夺微芯片、电力、网络设备和熟练工人，使计算能力成为一项国家级产业。"
 gpu_development.9.a_usa: "保持计算市场的广泛可及性。"
 gpu_development.9.b_usa: "支持国家战略建设"
 gpu_development.9.d_can: "加拿大的AI研究基础和丰富的电力资源吸引了众多关于新建加速器集群和数据中心的提案。这些设施的建设可能会扩大大学和初创企业的准入机会，但也可能使国内人才与少数大型外国平台更加紧密地联系在一起。"
 gpu_development.9.a_can: "为开放研究网络预留计算资源"
 gpu_development.9.b_can: "利用龙头企业扩大产能"
 gpu_development.9.d_tai: "市场对AI处理器的需求已使尖端晶圆代工和先进封装的订单爆满。台湾可以扩大半导体生态系统中产能的覆盖范围，或者集中投资于那些能够以最快速度扩张为目标的客户。"
 gpu_development.9.a_tai: "拓展获取先进产能的途径"
 gpu_development.9.b_tai: "集中精力快速扩张代工厂"
 gpu_development.9.d_kor: "高带宽内存已成为AI加速器生产面临的最大制约因素之一。韩国企业必须决定是扩大认证范围并向市场供应，还是为长期战略客户专门开辟新的生产线。"
 gpu_development.9.a_kor: "扩大高带宽内存资格认证和供应"
 gpu_development.9.b_kor: "围绕战略客户构建业务"
 gpu_development.9.d_chi: "由于能否获得最先进的国外加速器仍存在不确定性，对AI计算的需求正在上升。国内设计师、代工厂和内存生产商必须组建完整的供应链，而不能假设每个领先组件都将保持可用。"
 gpu_development.9.a_chi: "支持开放的国内加速器标准"
 gpu_development.9.b_chi: "集中资源培养全国冠军"
 gpu_development.9.d_jap: "AI的蓬勃发展重新凸显了日本半导体材料、制造设备、封装技术和新型制造项目的战略价值。协调一致的投资可以将这些优势结合起来，但业界必须在广泛的供应商渠道和集中化的全国性项目之间做出选择。"
 gpu_development.9.a_jap: "加强开放的供应商生态系统"
 gpu_development.9.b_jap: "协调国家能力建设方案"
 gpu_2000_graphics_market: "图形市场蓬勃发展"
 gpu_2000_graphics_market_desc: "对最新图形加速器的需求激增，工程师和订单纷纷涌向领先的设计，加快了研发速度，同时也加剧了他们赖以生存的微芯片供应紧张。"
 gpu_accelerator_demand: "加速器需求"
 gpu_accelerator_demand_desc: "对图形处理器和AI加速器的需求正吸引着投资、人才和微芯片公司向先进计算领域涌入。由此带来的扩张促进了研究和数据中心的发展，同时也给更广泛的芯片供应带来了更大的压力。"
 gpu_foundry_expansion: "代工厂扩张"
 gpu_foundry_expansion_desc: "公共和私人投资正在扩大微芯片工厂的产能、先进封装和高带宽内存生产，以满足对图形处理器和AI加速器不断增长的需求。"