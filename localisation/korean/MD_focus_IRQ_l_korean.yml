 iraq_md.200.t: "이라크 내 미국의 주둔"
 iraq_md.200.d: "우리나라에서의 미국 임무는 수년째 이어지고 있으며, 우리 국민의 시각에서는 그들의 체류가 이제 끝나야 합니다. 일부 미국 대표단은 테러리즘과 극단주의에 맞서기 위해 자신들의 주둔이 필요하다고 주장하지만, 우리는 다르게 봅니다. 우리 정부가 이 문제에 대해 결정을 내릴 때가 되었습니다."
 iraq_md.200.a: "요청을 보낸다"
 iraq_md.200.b: "때가 아니다"
 iraq_md.201.t: "우리의 철수를 요청하는 이라크 정부"
 iraq_md.201.d: "이라크 정부는 우리의 임무가 오래전에 종료되었어야 한다고 주장하며 자국에서 우리 병력을 철수시켜 달라고 요청했습니다. 그들의 외교관들은 이라크 국가를 유지하는 데 우리의 도움이 필요하지 않으며, 국가가 완전히 자력으로 운영될 수 있다고 우리에게 장담했습니다."
 iraq_md.201.a: "우리 병사들을 집으로 데려오자"
 iraq_md.201.b: "아니, 그들은 아직 준비되지 않았다"
 iraq_md.202.t: "병력을 철수하는 미국"
 iraq_md.202.d: "미국은 우리의 요청에 동의하기로 결정하고 병력을 철수하기 시작했습니다. 철수는 점진적으로 이루어지겠지만, 그들은 이미 현재 미국 전문가들이 맡고 있는 모든 정부 직책의 이양을 발효시키는 데 서명했습니다."
 iraq_md.202.a: "드디어!"
 iraq_md.203.t: "철수를 거부한 미국"
 iraq_md.203.d: "미국 정부는 우리 정부가 안정적으로 정부를 통제할 준비가 되어 있지 않다는 이유를 들어 우리의 요청을 거부했습니다."
 iraq_md.203.a: "유감이다"
 iraq_md.74.b: "안 된다! 사담은 우리의 영원한 지도자이다!"
 iraq_md.744.t: "사담 후세인 사망!"
 iraq_md.744.d: "오늘 오전 6시, 대통령이 가까운 가족에게 둘러싸인 채 침대에서 사망한 것으로 보고되었습니다. 그의 삶은 미국을 비롯한 여러 나라와의 몇 차례 전쟁에서 살아남는 등 기복이 많은 삶이었습니다. 그러나 그의 죽음과 함께 새로운 시작이 찾아옵니다. 사담은 아들 중 한 명을 국가 지도자로 지명해 두었으나, 이 사실은 최근까지 널리 알려지지 않았습니다.."
 iraq_md.744.a: "편히 잠드소서.."
 iraq_md.300.t: "이란 전선의 진행 상황 보고를 원하는 사담?"
 iraq_md.300.d: "사담 후세인이 합동참모본부 사무실에 들이닥쳐 이란과의 전쟁이 어떻게 진행되고 있는지 알려 달라고 요구했습니다. 한 경호원이 나서서 \\"대통령 각하, 전쟁은 수십 년 전에 끝났습니다! 이란과의 전쟁은 없습니다\\"라고 말했습니다. 사담은 그 자리에서 즉시 경호원을 쏘았습니다."
 iraq_md.300.a: "Uh.. Yeah it's going great"
 iraq_md.301.t: "병원을 고문실로 착각한 사담"
 iraq_md.301.d: "정기 병원 방문 중 사담은 병원을 고문실로 착각하고 검진을 준비하던 간호사들과 몸싸움을 벌이기 시작했습니다. 그는 즉시 풀어 달라고 요구했으나, 그의 개인 비서가 그곳은 고문실이 아니라고 그를 안심시켰습니다. 그 비서는 어제 해고되었으며, 어찌 된 일인지 출생 증명서를 비롯한 그의 기록은 더 이상 우리 시스템에 나타나지 않습니다."
 iraq_md.301.a: "젠장"
 iraq_md.302.t: "영국 영사관을 급습한 사담"
 iraq_md.302.d: "산책 중이던 사담 후세인은 길에서 마주친 소규모 병사 무리를 설득해 바그다드의 영국 영사관 급습을 돕게 했습니다. 영사관 부지를 돌파하려 하자 영국 경비병들은 사담을 돕던 병사들을 억류하고 누군가 사담을 데려가라고 요구했습니다. 사담은 끌려가면서 미친 듯이 발버둥 치며 \\"오늘 식민주의자들이 식민화되었다! 이라크 민족에게 영광을! 이라크 국민에게 영광을!\\"이라고 외쳤습니다. 영국 영사관은 당분간 철수하겠다는 성명을 발표했습니다."
 iraq_md.302.a: "이런"
 iraq_md.303.t: "손전등을 폭탄으로 착각한 사담"
 iraq_md.303.d: "어찌 된 일인지 어젯밤 사담 궁전의 가정부 한 명이 사담이 자는 동안 그의 침실 협탁 위에 손전등을 올려놓았습니다. 오늘 아침 사담의 방에서 나는 비명에 크게 놀란 경호원 몇 명이 허둥지둥 방으로 뛰어들었습니다. 그들은 방 반대편 구석에 서서 손전등을 가리키며 \\"미국인들과 시온주의자들이 내 방에 폭탄을 몰래 가져다 놓았다!\\"라고 소리치는 잔뜩 겁먹은 사담을 마주했습니다. 경호원들은 재빨리 손전등을 치웠고 사담은 다시 잠들었습니다. 그 가정부는 더 이상 궁전에서 일하지 않습니다."
 iraq_md.303.a: "이게 무슨 일이냐?"
 iraq_md.304.t: "가게 점원을 외국 외교관으로 착각해 매수하려는 사담"
 iraq_md.304.d: "사담은 며칠째 궁전에 초콜릿이 없다고 불평해 왔습니다. 이 때문에 비서들은 더 이상 그의 불평을 참지 못했고, 그가 초콜릿 브랜드를 직접 고르겠다고 고집하자 결국 그를 가게로 데려갔습니다. 경호원들과 비서들이 바깥에 모여드는 인파에 정신이 팔린 사이, 한 명이 사담이 점원의 귀에 대고 속삭이려 하는 것을 알아채고 \\"잘 들어라, 우리 선박이 호르무즈를 문제없이 통과하도록 보장하고 오만인들과 이란인들과의 거래를 뒤집는다면, 앞으로의 석유 거래에서 아주 유리한 가격을 주겠다\\"라고 말하는 것을 엿들었습니다. 경호원들은 즉시 초콜릿을 구입하고 사담을 궁전으로 호송했습니다."
 iraq_md.304.a: "이게 무슨 일이냐?"
 iraq_md.305.t: "저지르지 않은 죄에 대한 감정적인 고백문을 쓰는 사담"
 iraq_md.305.d: "상당한 죄책감과 혼란의 순간에 사담은 자신이 저지르지 않은 범죄에 대해 국민에게 보내는 매우 감정적이고 사과하는 연설문을 쓰기 시작했습니다. 그는 한 지방 도시의 수돗물을 사과 식초로 오염시킨 것을 얼마나 미안하게 생각하는지 계속해서 서술했습니다. 호기심 많은 하녀가 이 편지를 발견하여 사담의 측근 중 한 명에게 보고했고, 그는 즉시 사담과 이야기를 나누며 그가 그런 범죄를 저지르지 않았다고 설명했습니다. 사담은 자신이 저질렀다며 더 이상 죄책감을 견딜 수 없다고 고집했습니다. 그러자 측근은 마지못해 영양사를 데려와 사담에게 사과 식초의 건강상 이점과, 그가 오히려 지역 주민들을 해친 것이 아니라 도왔다는 사실을 알려 주도록 했습니다. 이후 사담은 이라크가 \\"세계 최고의 병사들\\"을 갖게 되도록 모두 사과 식초를 마시자고 호소하는 애국적인 편지를 몰래 작성해 발표했습니다."
 iraq_md.305.a: "안돼!"
 iraq_md.306.t: "자신의 보호자들에 맞선 혁명을 모의하는 사담"
 iraq_md.306.d: "궁전을 나가는 것이 거부되자 사담은 자신의 당이 1963년에 일으킨 쿠데타가 실패했다고 믿으며 자신이 가택 연금 상태에 있다고 생각했습니다. 그는 경호원들을 자기편으로 끌어들이려 하며, 자신의 보호자들을 전복하고 궁전을 탈출하려는 계획을 상세히 설명하기 시작했습니다. 경호원들은 무언가 잘못되었음을 깨닫고 그가 잠들 때까지 잠시 그를 보호했습니다."
 iraq_md.306.a: "왜?"
 iraq_md.307.t: "남은 음식으로 외교 만찬을 준비하는 사담"
 iraq_md.307.d: "사담은 궁전 주방은 물론 누구에게도 알리지 않은 채 궁전 식탁에 접시를 차리기 시작했고, 지역 문제를 논의하기 위한 외교 만찬을 열고자 몇몇 지역 외교관들을 불렀습니다. 그 결과 손님들은 도착하자마자 궁전 경비병들에게 심문을 받았으며, 사담이 자신의 계획을 다른 이들에게 알리기만 했어도 완전히 피할 수 있었던 소동이 벌어졌습니다. 손님들은 결국 안으로 들어왔으나, 손님을 초대한 사실 자체를 잊은 사담은 아무런 음식도 준비하지 않았고, 그가 허둥지둥 주방에서 가져온 식은 남은 음식을 대접받았습니다."
 iraq_md.307.a: "얼마나 민망한가"
 iraq_md.308.t: "이미 방송된 연설을 몇 시간째 연습하는 사담"
 iraq_md.308.d: "사담의 보호자들은 몇 시간 동안 그가 방을 나서는 것을 보지 못했으며, 그가 그날 늦게 예정된 짧은 연설을 연습 중일 것이라 생각했습니다. 걱정이 된 그들은 그가 하는 말을 들어 보려 했고, 그중 한 명이 그것이 미국의 침공에 관한 그의 예전 연설임을 알아챘습니다. 이후 한 비서가 두려움과 망설임 속에 방에 들어가 사담에게 그 연설은 이미 수년 전에 했다고 알렸습니다. 사담은 격분하여 서류를 벽에 내던지며 비서에게 나가라고 말했습니다. 그날 늦게 궁전에서는 우는 사담의 소리가 들렸습니다."
 iraq_md.308.a: "젠장.."
 iraq_md.309.t: "냉장고를 금고로 착각한 사담"
 iraq_md.309.d: "오늘 아침 사담은 금고실 안의 보안 금고에 보관해 둔 자신의 돈을 찾으며 허둥지둥 궁전을 뒤집어 놓았습니다. 이를 기억하지 못한 사담은 냉장고를 금고로 착각하고 누군가 자신의 돈을 훔쳐 다른 곳에 숨겼다고 믿었습니다. 이후 사담은 금고의 위치를 안내받았고, 사치품에 쓸 돈을 가져가겠다고 요구했습니다."
 iraq_md.309.a: "젠장"
 iraq_md.310.t: "화재를 일으킨 사담!"
 iraq_md.310.d: "오늘 일찍 사담이 루트바 변두리의 한 마을을 방문했을 때, 사담은 끄는 것도 피우는 것도 잊은 채 시가에 불을 붙였습니다. 그 시가가 한 집에 닿아 불이 붙었고, 거기서부터 불길이 마을 대부분으로 번졌습니다. 사담은 사고의 원인을 전해 들었지만, 자신은 수년 동안 담배를 피우지 않았다고 계속 우기고 있습니다."
 iraq_md.310.a: "피해는 어느 정도인가?"
 iraq_md.311.t: "엉뚱한 비행기를 탄 사담!"
 iraq_md.311.d: "사담은 프랑스 대통령 [FRA.GetLeader]을(를) 만나겠다고 고집했습니다. 회담은 합의되었고 비행이 준비되었습니다. 비행 중 사담은 자신의 표현대로 \\"프랑스에 여러 번 가 봤기\\" 때문에 프랑스로 가는 길을 알고 있다고 우겼습니다. 그 결과 조종사는 사담의 구두 지시에 동의할 수밖에 없었고, 결국 프랑스령 기아나 한복판에 도착하고 말았습니다. 회담은 곧바로 취소되었습니다."
 iraq_md.311.a: "그를 돌려받을 수 있겠는가?"
 iraq_md.312.t: "중요한 안보 정상회의에 불참한 사담"
 iraq_md.312.d: "사담은 국가 안보 정상회의를 계획하고 최고위 장군과 장교들에게 참석을 요청했습니다. 어제가 정상회의가 열리기로 한 날이었으며, 모든 관리가 도착하자 그들은 사담 후세인이 회의장에서 연설하기를 참을성 있게 기다리며 침묵 속에 맞이했습니다. 놀랍게도 사담 후세인은 끝내 나타나지 않았습니다. 알고 보니 사담은 쿠사이, 우다이와 함께 유프라테스 강에서 낚시 여행을 즐기고 있었습니다."
 iraq_md.312.a: "잘됐군"
 iraq_md.313.t: "축제 퍼레이드를 군사 행진으로 착각한 사담"
 iraq_md.313.d: "오늘 아침 사담은 한 관리와 약속한 회동을 위해 그의 사무실로 이동 중이었습니다. 가는 길에 그는 예정된 퍼레이드를 위해 통제된 거리를 보았고 이를 군사 퍼레이드로 착각했습니다. 그는 운전기사에게 차를 세우라고 말한 뒤 거리 한편의 연단으로 달려가 사회자를 무대 밖으로 걷어찼습니다. 이어 병사들을 기다리며 경례를 하기 시작했지만, 만화 캐릭터들에게 경례하고 있는 자신을 발견하고 나서야 어린이 퍼레이드에 와 있다는 사실을 재빨리 깨달았습니다."
 iraq_md.313.a: "젠장"
 iraq_md.314.t: "신규 벙커 500기의 건설을 명령한 사담!"
 iraq_md.314.d: "사담은 미국의 임박한 핵 공격을 두려워하며 이라크 전역에 신규 벙커 500기를 건설하라고 명령했습니다. 이라크가 여전히 미국과 전쟁 상태에 있다고 믿었기에 공황 상태에 빠졌기 때문입니다. 명령은 취소되었으나 건설 회사들은 이미 손해를 보았으므로 정당한 보상을 해 주어야 합니다."
 iraq_md.314.a: "젠장"
 iraq_md.315.t: "반군에 맞서 쿠르디스탄 지역에 수백 개의 지뢰 매설을 명령한 사담!"
 iraq_md.315.d: "사담은 군사 고문들과 상의하지 않은 채 지역 반군 집단에 맞서기 위해 쿠르디스탄 국경에 수백 개의 지뢰를 매설하라고 명령했습니다. 이 명령은 최근 공격이 늘어난 탓에 심각한 사안이라고 믿은 수령자들에 의해 신속히 이행되었습니다. 하지만 이제 사담의 최고위 고문들은 이 지뢰가 아군 병력에 심각한 피해를 줄 수 있다고 경고하고 있습니다."
 iraq_md.315.a: "이런"
 iraq_md.316.t: "지뢰로 사망한 사담 후세인"
 iraq_md.316.d: "몇 달 전 사담 후세인은 지역 반군의 공격을 막기 위해 쿠르드 국경 근처에 수백 개의 지뢰를 매설하기로 결정했습니다. 쿠르드 국민이 자신을 싫어한다고 느낀 사담은 선의를 보여 주기 위해 홀로 그 지역을 방문해 주민들을 만나야 한다는 충동을 느꼈습니다. 사담은 궁전에서 차를 한 대 타고 쿠르디스탄 국경까지 몇 시간 동안 운전했습니다. 차에는 국경까지 겨우 도달할 만큼의 연료밖에 없었고, 기름이 바닥나자 사담은 걸어서 이동하기 시작했습니다. 지뢰에 대해 잊은 채 가던 도중 어딘가에서 사담은 지뢰를 밟아 그 자리에서 사망했습니다."
 iraq_md.316.a: "편히 잠드소서, 우리의 사랑하는 지도자여"
 IRQ_temp_medical_cost: "병원비"
 IRQ_saddam_ages_TT: "§H사담 후세인§!이 늙고 §R알츠하이머병에 걸립니다!§!"
 IRQ_saddam_is_saddened_TT: "§H사담이 슬퍼합니다§!"
 IRQ_alzheimers_TT: "§R사담의 알츠하이머병§! 때문에 §H사담§!의 이상 행동에 관한 사건이 발생할 수 있습니다!"
 IRQ_saddams_pissfits: "£SOV_paranoia_text_icon  [IRQ.GetLeader]의 분노"
 IRQ_saddams_pissfits_desc: "§H[IRQ.GetLeader]§!은(는) 평생 £SOV_paranoia_text_icon  §R분노§!를 제어하지 못했습니다. 종종 그 분노를 £personnel_cost_multiplier_modifier_texticon  군 인력이나 [IRQ.GetFlag] §H이라크§!에 사는 사람들에게 쏟아냅니다. 그의 £SOV_paranoia_text_icon  §R분노§!는 국민에게 두려움을 심어 주어 실수할 가능성을 낮출 수 있지만, 대가가 따릅니다.\n\n£SOV_paranoia_text_icon  §R분노§!는 특정 §H사건, 결정, 중점§!을 통해 증가합니다. £stability_texticon  §H안정도§!가 §H40%§! 미만이면 £SOV_paranoia_text_icon  §R분노§!는 매달 §H1§! 상승할 확률이 있습니다. £SOV_paranoia_text_icon  §R분노§!가 §H25%§!를 넘으면 결과를 수반하는 무작위 사건이 발생합니다. £SOV_paranoia_text_icon  §R분노§!가 §H50%§!에 도달하면 §H[IRQ.GetLeader]§!은(는) 무작위 £personnel_cost_multiplier_modifier_texticon  장군을 처형합니다. £SOV_paranoia_text_icon  §R분노§!는 £stability_texticon  §H안정도§!가 §H40%§! 이상이면 서서히 감소합니다.\n\n£SOV_paranoia_text_icon  §R분노§!: [?IRQ_saddam_pissboy|%]"
 IRQ_receive_influence_5_TT: "[IRQ.GetFlag] §H이라크§!에 대해 §H5% 영향력§!을 받습니다"
 IRQ_receive_influence_2_TT: "[IRQ.GetFlag] §H이라크§!에 대해 §H2% 영향력§!을 받습니다"
 IRQ_they_receive_2_influence_TT: "상대가 우리에 대해 §H2% 영향력§!을 받습니다"
 IRQ_they_receive_5_influence_TT: "상대가 우리에 대해 §H5% 영향력§!을 받습니다"
 IRQ_fedayeen_patrols: "페다이 순찰"
 IRQ_fedayeen_patrols_desc: "사담 페다이는 우리 국가의 법을 집행하는 데 활용되어야 합니다. 그들은 국민이 신성한 규범을 따르고 올바르게 살아가도록 보장할 것입니다."
 IRQ_western_engineers_in_iraq: "이라크 내 서방 기술자"
 IRQ_western_aid_to_iraq: "이라크에 대한 서방 원조"
 IRQ_assassinate_abdullah_s_jumah: "압둘라 S. 줌아 암살"
 IRQ_assassinate_abdullah_s_jumah_desc: "[SAU.GetFlag] 아람코 CEO 압둘라 S. 줌아는 제거해야 합니다. 우리의 비밀 요원들을 보내 처리할 것이며, 모든 것이 순조롭게 진행되기를 바랍니다."
 iraqi_flavor_events.10.t: "이라크 남부를 집어삼킨 시아파 봉기"
 iraqi_flavor_events.10.d: "사담 후세인의 바트주의 이라크 전역에 대규모 반란이 번졌으며, 이는 최근 몇 년 사이 세 번째 봉기입니다. 시아파 무슬림들은 저명한 성직자가 바스라 거리에서 살해되었다는 주장이 나온 뒤 바트주의 국가에 맞서 무기를 들었습니다. \n\n이번 반란에 이란이 개입했다는 추측이 커지고 있으며, 테헤란이 암살 배후에 있었고 이것이 이번 새로운 소요의 물결을 촉발했다는 소문도 돌고 있습니다. 이라크군은 반란을 진압하기 위해 압도적인 병력을 투입하며 신속하게 대응하고 있습니다. 세계는 이란의 대응과 그것이 가져올 결과를 주시하고 있습니다."
 iraqi_flavor_events.10.a: "전쟁의 대가"
 iraqi_flavor_events.11.t: "이라크 위로 오르는 검은 깃발"
 iraqi_flavor_events.11.t1: "이라크 내 이슬람 국가의 출현"
 iraqi_flavor_events.11.d: "[ISI.GetLeader]은(는) 오늘 알카에다의 이라크 공식 지부 결성을 선언하고, 자마아트 알타우히드 왈지하드(유일신교와 지하드 공동체)가 오사마 빈 라덴의 세계적 테러 조직 알카에다에 충성을 맹세한다고 밝혔습니다. 외국인 전투원과 [IRQ.GetAdjective] 반군으로 구성된 이 조직은 [PER.GetAdjective]의 지원을 받는 집단과 바트주의 이라크에 맞선 타협 없는 지하드를 서약했으며, 칼리파국을 세운 뒤 이라크의 세속적 이웃 국가들로 지하드의 물결을 확산시키고 최종적으로 이스라엘과의 충돌로 마무리하는 것을 목표로 하고 있습니다. 이 집단은 이미 이란 혁명수비대, 시아파 민병대, 이라크 중앙 정부를 상대로 여러 차례 공격을 감행했습니다. 바그다드를 비롯한 이라크 주요 도시들이 연쇄 폭탄 테러로 뒤흔들리는 가운데 이러한 발표가 나왔습니다."
 iraqi_flavor_events.11.d1: "[ISI.GetLeader]은(는) 이라크 이슬람 국가의 수립을 선언했습니다. 이 조직은 이라크 알카에다를 포함한 여러 지하디스트 분파가 자신들의 깃발 아래 통합되었다고 발표했습니다. 조직은 [IRQ.GetLeader]의 바트주의 이라크를 해체하고 [PER.GetAdjective]의 지원을 받는 민병대와 이란 혁명수비대에 맞서 끝없는 지하드를 벌이겠다고 서약했습니다. 궁극적인 목표는 중동 전역에 이슬람 칼리파국을 세우는 것입니다. 이라크가 혼돈에 빠져드는 가운데, 이 집단은 바그다드와 이라크의 다른 주요 도시들에서 폭탄 테러, 암살, 습격 작전을 강화했습니다."
 iraqi_flavor_events.11.a: "이라크는 끝난 것인가?"
 iraqi_flavor_events.12.t: "이라크에서 일어난 이란 지원 쿠데타"
 iraqi_flavor_events.12.d: "불과 몇 분 전, [PER.GetNameWithFlag]의 지원을 받는 시아파 민병대 지도자들의 연합이 바트주의 정부를 상대로 쿠데타를 일으켰습니다. 이들은 이라크 헌법의 효력 정지와 시아파 통치의 수립을 선언했습니다. [IRQ.GetNameWithFlag]의 새 지도자 [IRQ.GetLeader]은(는) 자신의 병력이 표적 작전을 통해 사담 후세인의 거처를 급습하여 그의 시신을 확보했다고 발표했습니다. 그는 열변을 토하며 \\"우리는 만인의 정당한 소유인 이 땅에서 바트주의를 뿌리 뽑을 때까지 쉬지 않을 것이다!\\"라고 선언했습니다. 바그다드는 시아파 민병대가 바트주의 관리들에 대한 고위급 암살을 시작하면서 혼란에 빠졌습니다. 한편 [PER.GetNameWithFlag]의 최고 지도자 [PER.GetLeader]은(는) [IRQ.GetLeader]이(가) 이끄는 새 정부에 전폭적인 지지를 표명했습니다."
 iraqi_flavor_events.12.a: "폭정의 종말인가, 아니면 다음 장일 뿐인가?"
 iraqi_flavor_events.13.t: "무기를 든 바트 충성파"
 iraqi_flavor_events.13.d: "바트주의 충성파 잔당이 [IRQ.GetNameWithFlag] 북서부에서 전면적인 반란을 일으켜 바트 통치를 복원하고 현 시아파 주도 정부를 거부하기 위해 여러 주요 도시를 장악했습니다. [IRQ.GetLeader]은(는) 봉기를 진압하겠다고 서약했으나, 이미 불안정한 정부 전역으로 폭력과 혼란이 확산됨에 따라 결과는 여전히 불투명합니다. 한편 [IRS.GetLeader]은(는) 수도 바그다드를 되찾기 위한 공세를 준비하고 있습니다."
 iraqi_flavor_events.13.a1: "전쟁의 대가"
 iraqi_flavor_events.13.a2: "그들을 박멸하라"
 IRQ_leave_socialist_union: "[PER.GetFlag] 이란과의 사회주의 연합 탈퇴"
 iraq_md.317.t: "브리머로 교체된 가너"
 iraq_md.317.d: "미국 정부의 지시에 따라 제이 가너가 폴 브리머로 교체되었습니다. 가너의 이라크 구상이 무엇이었는지를 두고 의혹이 제기되었는데, 그가 미군을 거치지 않고 이라크인들 자신에게 지나치게 많은 통제권을 넘겨주고 있다고 여겨졌기 때문입니다. 이 조치로 가너의 짧은 이라크 행보는 막을 내리고 새로운 행보가 시작됩니다."
 iraq_md.317.a: "알겠다"
 iraq_md.318.t: ""
 iraq_md.318.d: ""
 iraq_md.318.a: ""
 iraqi_MNF.2.t: "바그다드 함락"
 iraqi_MNF.2.d: "명예로운 도시 바그다드가 점령군에게 함락되었으며, 지금 이 순간에도 정부 건물과 동상, 포스터가 파괴되고 있습니다. 여러 고위 관리가 붙잡히거나 살해되거나 행방불명되었습니다. 최고위 장군들은 저항이 무의미하며, 적에 맞선 무장 투쟁을 계속하기로 한다면 더 많은 목숨을 희생할 위험이 있다고 말하고 있습니다. 그러나 우리에게 무슨 선택지가 있겠습니까? 그들은 우리 땅에 와서 우리 국민을 공격하고 우리의 주권을 침해했습니다."
 iraqi_MNF.2.a: "선택의 여지가 없다"
 iraqi_MNF.2.b: "항복이라는 말은 우리 사전에 없다!"
 iraqi_MNF.3.t: "이라크에서 작전을 개시한 미국"
 iraqi_MNF.3.d: "미국은 스스로를 이라크와 전쟁 상태에 두었으며, 우리는 어떤 적에 맞서서도 미국과 함께 서겠다고 약속한 바 있습니다. 오늘 우리는 이라크 다국적군에 병력을 파견함으로써 그 약속을 이행할 수 있습니다."
 iraqi_MNF.3.a: "전진"
 iraqi_MNF.3.b: "마음이 바뀌었다..."
 iraqi_MNF.4.t: "우리의 철수를 요청하는 이라크 집권 정부"
 iraqi_MNF.4.d: "이라크의 집권 당국은 모든 점령 구역을 포함해 이라크에서 우리 병력을 철수시켜 달라고 공식 요청했습니다. 서한은 접근 방식이 상당히 우호적으로 보였으나 은근한 위협이 없지는 않았습니다. '이라크 주권 영토에서 철수하기를 거부하면 의도치 않은 결과를 초래할 수 있다'고 서한에는 적혀 있었으며, [IRQ.GetLeader]의 서명이 있었습니다."
 iraqi_MNF.4.a: "철수하겠다"
 iraqi_MNF.4.b: "철수하겠다... 한 가지 조건으로"
 iraqi_MNF.4.c: "그렇다면 이 땅에 우리를 묻어야 할 것이다!"
 iraqi_MNF.5.t: "무조건 철수한 [FROM.GetName]"
 iraqi_MNF.5.d: "[FROM.GetAdjective] 정부는 우리의 요청에 따라 점령 지역에서 즉시 철수하기로 결정했습니다."
 iraqi_MNF.5.a: "좋다"
 iraqi_MNF.6.t: "석유 양보를 조건으로 철수한 [FROM.GetName]"
 iraqi_MNF.6.d: "[FROM.GetAdjective] 정부는 우리의 요청에 따라 점령 지역에서 즉시 철수하기로 결정했습니다. 다만 철수 조건의 일부로 석유 권리를 요구하고 있습니다."
 iraqi_MNF.6.a: "알았다, 좋다"
 iraqi_MNF.7.t: "철수를 거부한 [FROM.GetName]"
 iraqi_MNF.7.d: "그 [FROM.GetAdjective] 해충들은 점령 구역을 포기하기를 거부하고 우리 영토에서 더욱 입지를 굳히고 있습니다. 그들이 외교의 언어를 이해하지 못한다면, 우리 무력의 언어는 이해하게 될 것입니다."
 iraqi_MNF.7.a: "유감이다.."
 iraqi_MNF.8.t: "이라크 석유 권리 계약 만료"
 iraqi_MNF.8.d: "이라크 석유에 대한 우리의 계약이 오늘 만료되었으며, 그 결과 우리는 한때 점령했던 지역의 석유를 더 이상 통제하지 못합니다."
 iraqi_MNF.8.a: "합의된 대로이다"
 iraqi_MNF.9.t: "[FROM.GetName] 석유 계약 만료"
 iraqi_MNF.9.d: "[FROM.GetName]은(는) 한때 점령했던 지역의 석유 흐름을 더 이상 통제하지 못하며, 수출과 석유 취급은 다시 이라크의 국가 통제로 반환됩니다."
 iraqi_MNF.9.a: "좋다"
 iraqi_MNF.10.t: "체포된 사담 후세인!"
 iraqi_MNF.10.d: "몇 주간의 도피 끝에 사담 후세인이 은밀한 은신처에서 우리 병력에 의해 마침내 체포되었습니다. 그는 현재 평가를 받고 있는 아부 그라이브 교정 시설로 이송되었습니다. 그의 운명은 곧 이라크의 관계 당국에 의해 결정될 것입니다."
 iraqi_MNF.10.a: "신사 숙녀 여러분, 그를 잡았습니다"
 iraqi_MNF.11.t: "체포된 쿠사이 후세인!"
 iraqi_MNF.11.d: "몇 주간의 도피 끝에 쿠사이 후세인이 은밀한 은신처에서 우리 병력에 의해 마침내 체포되었습니다. 그는 현재 평가를 받고 있는 아부 그라이브 교정 시설로 이송되었습니다. 그의 운명은 곧 이라크의 관계 당국에 의해 결정될 것입니다."
 iraqi_MNF.11.a: "좋다"
 iraqi_MNF.12.t: "체포된 우다이 후세인!"
 iraqi_MNF.12.d: "몇 주간의 도피 끝에 우다이 후세인이 은밀한 은신처에서 우리 병력에 의해 마침내 체포되었습니다. 그는 현재 평가를 받고 있는 아부 그라이브 교정 시설로 이송되었습니다. 그의 운명은 곧 이라크의 관계 당국에 의해 결정될 것입니다."
 iraqi_MNF.12.a: "좋다. 그 미치광이를 거리에서 치워라!"
 iraqi_MNF.13.t: "체포된 아비드 하미드 마흐무드!"
 iraqi_MNF.13.d: "몇 주간의 도피 끝에 아비드 하미드 마흐무드가 은밀한 은신처에서 우리 병력에 의해 마침내 체포되었습니다. 그는 현재 평가를 받고 있는 아부 그라이브 교정 시설로 이송되었습니다. 그의 운명은 곧 이라크의 관계 당국에 의해 결정될 것입니다."
 iraqi_MNF.13.a: "좋다"
 iraqi_MNF.14.t: "체포된 '화학자 알리'!"
 iraqi_MNF.14.d: "몇 주간의 도피 끝에 '화학자 알리'로 알려진 알리 하산 알마지드가 은밀한 은신처에서 우리 병력에 의해 마침내 체포되었습니다. 그는 현재 평가를 받고 있는 아부 그라이브 교정 시설로 이송되었습니다. 그의 운명은 곧 이라크의 관계 당국에 의해 결정될 것입니다."
 iraqi_MNF.14.a: "좋다"
 iraqi_MNF.15.t: "체포된 이자트 이브라힘 알두리!"
 iraqi_MNF.15.d: "몇 주간의 도피 끝에 이자트 이브라힘 알두리가 은밀한 은신처에서 우리 병력에 의해 마침내 체포되었습니다. 그는 현재 평가를 받고 있는 아부 그라이브 교정 시설로 이송되었습니다. 그의 운명은 곧 이라크의 관계 당국에 의해 결정될 것입니다."
 iraqi_MNF.15.a: "좋다"
 iraqi_MNF.16.t: "체포된 하니 압둘라티프 틸파!"
 iraqi_MNF.16.d: "몇 주간의 도피 끝에 하니 압둘라티프 틸파가 은밀한 은신처에서 우리 병력에 의해 마침내 체포되었습니다. 그는 현재 평가를 받고 있는 아부 그라이브 교정 시설로 이송되었습니다. 그의 운명은 곧 이라크의 관계 당국에 의해 결정될 것입니다."
 iraqi_MNF.16.a: "좋다"
 iraqi_MNF.17.t: "체포된 아지즈 살리!"
 iraqi_MNF.17.d: "몇 주간의 도피 끝에 아지즈 살리가 은밀한 은신처에서 우리 병력에 의해 마침내 체포되었습니다. 그는 현재 평가를 받고 있는 아부 그라이브 교정 시설로 이송되었습니다. 그의 운명은 곧 이라크의 관계 당국에 의해 결정될 것입니다."
 iraqi_MNF.17.a: "좋다"
 iraqi_MNF.170.t: "이라크의 최고 수배자들"
 iraqi_MNF.170.d: "전 정부 관리 52명이 트럼프 카드 한 벌에 인쇄되어 이라크에 주둔한 모든 부대에 지급되었으며, 에이스와 그림 카드는 실제로 국가를 운영한 자들에게 배정되었습니다. 일부는 여전히 이라크 안에서 가족 외에는 아무도 모르는 일정에 따라 은신처와 친척 집을 옮겨 다니고 있습니다. 다른 이들은 편리한 동안에는 그들이 거기 없다고 계속 부인할 인접국 수도로 넘어갔습니다. 정보 평가에 따르면 도피 중인 자들은 이미 조직을 꾸리고 있으며, 카드를 뒤집지 않은 채로 두는 매달이 그들에게 계획할 시간을 내주는 또 한 달이 됩니다."
 iraqi_MNF.170.a: "신속한 정의의 손길이 그들을 붙잡을 것이다"
 iraqi_MNF.200.t: "쿠웨이트 해군 기지에 대한 대규모 바트주의 반격!"
 iraqi_MNF.200.d: "바트주의 세력이 우리 쿠웨이트 해군 기지에 대규모 공격을 감행하여 기지의 상당한 기반 시설을 파괴했습니다. 이 공격으로 우리 병력은 굴욕감과 사기 저하, 극심한 동요에 빠졌으며 우리의 명성은 지역 내에서 크게 손상되었습니다. 본토에서는 우리 당이 언론과 국민의 맹렬한 공격을 받고 있습니다. 이라크 안팎에 숨어 있는 바트주의자들을 붙잡지 못한 것이 주된 원인으로 보고되고 있으며, 그들은 지난 몇 년간 별다른 지연 없이 이 공격을 모의할 수 있었습니다."
 iraqi_MNF.200.a: "믿을 수 없다"
 IRQ_request_british_withdrawal: "영국 철수 요청"
 IRQ_request_british_withdrawal_desc: "영국은 짐을 싸서 남부에서 떠나야 합니다. 이곳은 우리의 땅이며, 그들은 우리의 허락 없이 눌러앉아 있었습니다."
 IRQ_request_polish_withdrawal: "폴란드 철수 요청"
 IRQ_request_polish_withdrawal_desc: "폴란드는 짐을 싸서 중부 지역에서 떠나야 합니다. 이곳은 우리의 땅이며, 그들은 우리의 허락 없이 눌러앉아 있었습니다."
 IRQ_5_years_TT: "그들은 §H5§!년간 §H석유 양보§!를 얻게 됩니다!"
 IRQ_MNF_VOLUNTEER_TT: "- 전쟁 수행을 지원하기 위해 [IRQ.GetFlag] §H이라크§!의 §H다국적군§!에 의용군을 파견할 수 있습니다"
 IRQ_increase_pol_inf_15_TT: "§H수니파 정치 영향력§!이 §H15§! 증가합니다\n(현재 영향력: §H[?IRQ_sunni_political_influence]§!)"
 iraq_md.319.t: "고등 억지력에 대한 성스러운 질의"
 iraq_md.319.d: "성스러운 도시 나자프에서 대아야톨라 알리 알시스타니는 며칠간 사적인 성찰에 잠긴 것으로 알려졌습니다. 어제 대아야톨라는 국가에 '이론을 형체로 만들 만큼 충분히 학식을 갖춘 사람'이 있는지 단 하나의 질문을 던진 것으로 전해집니다. 보좌관들은 이것이 신학을 가리키는 것인지 물리학을 가리키는 것인지 확신하지 못한 채 통상적인 성직자 경로로 질문을 전달했습니다. 이 혼란은 꽤 빨리 풀렸는데, 대아야톨라 시스타니가 드문 서면 성명을 통해 국가가 '전략적 설득의 특수한 수단'을 개발해야 한다고 선언했기 때문입니다. 지난 수년간의 대대적인 바트당 숙청 탓에 시스타니의 보좌관들은 이 '전략적 설득의 특수한 수단'을 개발할 수 있는 '믿을 만한' 과학자를 찾지 못했습니다. 대신 링크드인 프로필에 #OpenToNetwork를 걸어 둔 최근 대학 졸업생 한 명을 찾아냈으며, 그를 이라크로 데려와 연구를 수행할 실험실을 제공하겠다는 제안이 전달되었습니다."
 iraq_md.319.a: "인샬라, 이라크는 안전해질 것이다"
 IRQ_renovation_of_baiji_refinery: "바이지 정유소 개보수"
 IRQ_renovation_of_baiji_refinery_desc: "바이지 정유소는 수많은 분쟁과 여러 전투의 중심지였으며, 이로 인해 상당히 낡았습니다. 정유소를 수리하고 재건하는 것은 우리 예산에 달려 있습니다."
 iraq_war.24.t: "아프가니스탄 문제"
 iraq_war.24.d: "이라크에서의 실패는 해외 개입에 대한 대중의 신뢰를 흔들어 놓았습니다. 군이 과도하게 분산되고 국내의 전쟁 피로가 누적되면서 아프가니스탄에서의 임무도 종료해야 한다는 목소리가 커지고 있습니다. 그곳에 주둔을 유지하는 비용은 전쟁에 지친 대중에게 정당화하기가 점점 어려워지고 있습니다."
 iraq_war.24.a: "아프가니스탄에서 철수한다"
 iraq_war.24.b: "기존 노선을 유지한다"
 IRQ_commie_paper: "알카이다 발행"
 IRQ_invite_hezbollah: "[HEZ.GetFlag] [HEZ.GetName] 초청"
 IRQ_receive_iranian_planes_TT: "이란으로부터 §YMiG-29 펄크럼§! §G7§!대를 받습니다."
 IRQ_resistance_jewel_aid_TT: "승인한 동맹국마다 이라크에 인프라 또는 화력 발전소를 건설합니다."
 IRQ_saudi_trade_refusal_TT: "사우디아라비아가 무역 관계 확대를 거부하여 §Y바스라 항 재건§!이 막힙니다."
 IRQ_demand_kuwait_naval_base: "[KUW.GetFlag] 쿠웨이트 해군 기지 요구"
 IRQ_demand_kuwait_naval_base_desc: "[KUW.GetFlag] 쿠웨이트인들은 미국인들이 바로 우리 코앞에 해군 기지를 세우도록 허용했습니다. §H[IRQ.GetLeader]§!은(는) [KUW.GetFlag] 쿠웨이트가 기지의 통제권을 우리에게 넘기거나 그 결과를 감수하라고 요구합니다."
 IRQ_propose_kurdistan_defensive_pact: "[KUR.GetFlag] 쿠르디스탄과 방위 협정 제안"
 IRQ_propose_kurdistan_defensive_pact_desc: "§H[IRQ.GetLeader]§!은(는) [KUR.GetFlag] 쿠르디스탄에 상호 방위 협정을 제안하여 북쪽 측면을 확보하고자 하며, 우리의 안보를 보장받는 대가로 그들의 영토에 대한 영유권 주장을 철회합니다."
 IRQ_expel_economic_union_members_decision: "연합 회원국 추방"
 IRQ_expel_economic_union_members_decision_desc: "우리 §H이슬람 번영 연합§!의 여러 회원국이 약속 이행에 소홀해졌습니다. 우리는 현재 모든 회원국을 연합에서 추방하여 새로운 파트너가 들어오기 전까지 무역 및 산업 혜택을 해체할 것입니다."
 IRQ_members_in_union_TT: "현재 §H이슬람 번영 연합§!에 추방할 수 있는 §H회원국이 최소 한 곳§! 있습니다."
 IRQ_demanded_kuwait_naval_base: "이미 쿠웨이트 해군 기지를 요구함"
 IRQ_proposed_kurdistan_pact: "이미 쿠르디스탄 방위 협정을 제안함"
 iraqi_MNF.26.t: "비어 있던 은신처"
 iraqi_MNF.26.d: "돌격 요원들은 은신처를 방마다 소탕하였으나, 아직 따뜻한 침구와 배터리가 분리된 위성 전화기, 그리고 건물 안에 아무도 없다는 사실만을 발견했습니다. 누군가가 경고의 대가를 받았고 그 값을 해냈습니다. 현장이 조사될 즈음이면 조직망은 그를 국내의 다른 곳으로 옮겼을 것이며, 수색은 남겨진 문서들이 가치가 있는 만큼의 단서에서 다시 시작됩니다."
 iraqi_MNF.26.a: "누가 발설했는지 알아내라"
 IRQ_qusay_hussein_idea: "쿠사이 후세인"
 IRQ_qusay_hussein_idea_desc: "쿠사이가 사담의 후계자로 지명됨에 따라, 우리는 그가 지휘하는 특수 공화국 수비대를 바탕으로 군대를 강화하고 정권을 지킵니다."
 IRQ_demand_kuwait_naval_base_TT: "이 결정이 끝나면 [KUW.GetFlag] §H쿠웨이트§!가 우리의 요구에 답합니다. 그때까지 [KUW.GetFlag] §H쿠웨이트§!에 대한 우리의 £foreign_influence_modifier_texticon  §H영향력§!이 여전히 §H30%§! 이상이라면 그들이 요구를 받아들일 가능성이 §G훨씬 높습니다§!.\n§R이 요구는 한 번만 할 수 있습니다.§!"