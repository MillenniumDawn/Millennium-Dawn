 SOO_ban_sects_desc: "종파와 이단이 우리 사회를 타락시키고 있습니다. 우리 스스로를 무너뜨리기 위해 만들어진 이 파괴적 조직의 주동자와 추종자를 모두 금지하고 억압해야 합니다."
 SOO_military_arms: "자체 군수 산업"
 SOO_military_arms_desc: "외부의 적으로부터 보호하기 위해 우리나라가 자체 무기를 생산할 때입니다."
 SOO_nyhaz_start: "남오세티야에 법치 회복"
 SOO_nyhaz_start_desc: "마침내 이 나라의 진정한 애국자들이 권력을 자신들의 손에 쥐었습니다."
 SOO_nyhaz_narodovlastie: "민주주의"
 SOO_nyhaz_narodovlastie_desc: "국민은 평안히 잠들 수 있습니다. 나라는 안전한 손에 맡겨져 있습니다."
 SOO_nyhaz_razdelenie: "권력 분립"
 SOO_nyhaz_razdelenie_desc: "권력 분립이라는 참된 원칙은 우리의 주요 개혁 중 하나이며 반드시 지켜져야 합니다."
 SOO_nyhaz_reform_pravo: "법 집행 개혁"
 SOO_nyhaz_reform_pravo_desc: "우리는 법 집행 기관을 완전히 탈바꿈시켜야 합니다."
 SOO_nyhaz_kbg_invest: "KGB 개혁"
 SOO_nyhaz_kbg_invest_desc: "KGB가 전면적인 쇄신을 거칠 때입니다."
 SOO_nyhaz_omon_invest: "OMON 개혁"
 SOO_nyhaz_omon_invest_desc: "진압 경찰과 OMON 조직 전체를 숙청하고 개혁해야 합니다."
 SOO_nyhaz_ter_defence: "영토 방어 생성"
 SOO_nyhaz_ter_defence_desc: "우리에게는 가장 어려운 순간에 나라를 지킬 준비가 된 사람들이 필요합니다."
 SOO_nyhaz_defence_doctrine: "방어 교리"
 SOO_nyhaz_defence_doctrine_desc: "우리나라는 누구도 공격하지 않으며, 교리는 이를 분명히 반영해야 합니다."
 SOO_nyhaz_national_guard: "국가 방위대"
 SOO_nyhaz_national_guard_desc: "이제 우리 군만으로는 나라를 지키기에 더 이상 충분하지 않으므로 자체 국가 방위대를 창설할 때입니다."
 SOO_communism_assr: "남오세티야 소비에트 공화국"
 SOO_skufia: "대스키타이"
 SER_Modernise_Belgrade: "새 트랙터"
 SOO_commie_modifier: "남오세티야의 공산주의 정책"
 SOO_commie_modifier_desc: "남오세티야는 다시 한번 공산주의의 길을 택했으며, 붉은 깃발이 다시금 우리 땅을 비추고 있습니다."
 SOO_natpop_modifier: "남오세티야의 인민 정치"
 SOO_natpop_modifier_desc: "인민당은 남오세티야 국민에게 최선을 주고자 노력하지만, 다소 모호한 정치 강령 때문에 이상적으로 실현되기는 어려울 것입니다."
 SOO_nyhaz_modifier: "군국주의적 대중 정치"
 SOO_nyhaz_modifier_desc: "우리 국민은 정치인들의 끝없는 거짓 약속에 지쳤습니다. 우리나라는 망각 속에서 불사조처럼 일어나야 합니다. 오세티야의 운명을 결정할 때입니다."
 SOO_bandit_modifier: "§R타데예프 일족§!의 권력"
 SOO_bandit_modifier_desc: "테데예프 일족은 우리 공화국의 많은 분야를 장악했습니다. 누구도 그들을 상대하려 하지 않아 우리는 수백만의 손실을 보고 있습니다."
 Ossetia.1.t: "남오세티야의 국민투표"
 Ossetia.1.d: "남오세티야 국가가 우리의 위대한 나라에 편입하기 위한 국민투표를 실시했습니다. 주민 대다수가 이 결정에 동의했습니다. 이제 우리의 몫입니다. 이들을 러시아에 받아들이겠습니까?"
 Ossetia.1.a: "물론이다, 고향에 온 것을 환영한다!"
 Ossetia.1.b: "아니다, 우리에게 필요 없다"
 Ossetia.2.t: "남오세티야의 국민투표"
 Ossetia.2.d: "러시아가 우리를 받아들이기로 했습니다!"
 Ossetia.2.a: "만세!"
 Ossetia.3.t: "남오세티야의 국민투표"
 Ossetia.3.d: "러시아가 우리를 받아들이기를 거부했습니다."
 Ossetia.3.a: "젠장"
 Ossetia.4.t: "남오세티야와 북오세티야의 병합"
 Ossetia.4.d: "남오세티야가 북오세티야와의 통합을 요청하고 있습니다. 우리는 이들의 요구를 받아들일 준비가 되어 있습니까?"
 Ossetia.4.a: "물론이지"
 Ossetia.4.b: "안된다"
 Ossetia.5.t: "남오세티야와 북오세티야의 병합"
 Ossetia.5.d: "러시아가 동의했습니다."
 Ossetia.5.a: "만세!"
 Ossetia.6.t: "남오세티야와 북오세티야의 병합"
 Ossetia.6.d: "러시아가 거부했습니다."
 Ossetia.6.a: "젠장"
 Ossetia.7.t: "맏이들의 동맹"
 Ossetia.7.d: "대스키타이의 후계자들이 전 세계를 올바른 길로 이끌고 우리의 공동의 적들을 타도할 동맹을 결성할 것을 제안해 왔습니다."
 Ossetia.7.a: "함께 세상의 더러움을 씻어내자!"
 Ossetia.7.b: "안된다"
 Ossetia.8.t: "맏이들의 동맹"
 Ossetia.8.d: "그들은 우리의 충실한 동맹이 되기로 동의했습니다."
 Ossetia.8.a: "만세!"
 Ossetia.9.t: "맏이들의 동맹"
 Ossetia.9.d: "그들은 우리의 위대한 목표를 돕지 않기로 결정했습니다."
 Ossetia.9.a: "젠장"
 Ossetia.10.t: "오세티야 정치"
 Ossetia.10.d: "2000년 격동의 남오세티야 정국에서, 사실상 독립 국가인 남오세티야는 정통성에 대한 지속적인 도전과 조지아와의 영토 분쟁에 시달렸습니다. 류드비그 치비로프 대통령이 이끄는 남오세티야는 러시아를 포함한 소수의 국가만이 그 주권을 인정하고, 국제 연합과 보조를 맞추는 국제 사회 대다수는 여전히 이를 조지아의 불가분한 일부로 간주함에 따라 신뢰성의 위기에 직면했습니다. 러시아의 영향력은 정치적으로나 군사적으로나 결정적인 역할을 하여, 이 지역이 사실상의 독립을 유지할 수 있는 능력을 좌우했습니다. 조지아와의 긴장은 여전히 높았으며, 행정 경계선을 따라 산발적인 폭력 사태가 발생하여 평화적 해결을 위한 노력을 가로막았습니다. 이러한 배경 속에서 해결되지 않은 분쟁과 인도적 우려는 중대한 과제로 남았으며, 지역에 안정을 가져오기 위해서는 지속적인 국제 외교적 노력이 필요함을 부각시켰습니다."
 Ossetia.10.a: "이라타 라즈마"
 Ossetia.11.t: "코코이티, 대통령에 선출"
 Ossetia.11.d: "에두아르트 코코이티는 남오세티야 공화국 대통령직을 위한 직접 국민 선거에서 야당 후보로 출마하여 대통령에 선출되었습니다."
 Ossetia.11.a: "어떻게 하는지 지켜보자."
 Ossetia.12.t: "다우르베크의 제안"
 Ossetia.12.d: "우리 민족에게는 새로운 지도력이 필요합니다! 우리의 지도자는 신들이 정해 주어야 하는데 선거에 신경 쓸 필요가 있겠습니까? 이 문제에 대해 두 가지 해법을 제안합니다..."
 Ossetia.12.a: "그렇소, 다우르베크, 그대는 자격이 있소."
 Ossetia.12.b: "날치크의 귀족들을 초청해야 한다!"
 Ossetia.12.c: "국정에 간섭하지 마라, 미치광이여."
 Ossetia.13.t: "오세티야, 우리의 도움 요청!"
 Ossetia.13.d: "오세티야가 어려운 재정 상황에서 도와달라고 우리 은행들에 요청하고 있습니다."
 Ossetia.13.a: "물론이다!"
 Ossetia.13.b: "미안하지만 안 된다."
 Ossetia.14.t: "러시아의 도움 제공!"
 Ossetia.14.d: "러시아가 우리에게 경제 원조를 제공합니다."
 Ossetia.14.a: "감사하다"
 Ossetia.15.t: "우리 제안을 거절한 러시아"
 Ossetia.15.d: "러시아가 우리에게 재정 지원을 제공하는 것을 거절했습니다."
 Ossetia.15.a: "알겠다"
 Ossetia.16.t: "CIS-2 창설"
 Ossetia.16.d: "미승인 국가 연합은 1992년에 설립된 구소련권의 미승인 및 부분 승인 국가들의 연합체입니다. 티라스폴에서 미승인 국가들의 새로운 연합이 탄생했습니다. 상설 조정 기구인 외무장관 회의와, 연 2회 이상 개최될 회의 사이의 준비 작업을 위한 전문가급 자문 위원회의 설치에 관한 협정이 체결되었습니다."
 Ossetia.16.a: "알겠다"
