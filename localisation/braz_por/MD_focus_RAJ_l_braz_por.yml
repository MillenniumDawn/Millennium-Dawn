 pak_raj_border_progress_change_tt:0 "§YProgresso da Reivindicação§! rumo ao estado disputado: [?border_war_progress_change|+=0]"
 raj_chi_border_progress_change_tt:0 "§YProgresso da Reivindicação§! rumo ao estado disputado: [?border_war_progress_change|+=0]"
 border_war_claim_progress_cost_tt:0 "§YProgresso da Reivindicação§!: $RIGHT|+=0$"
 pak_raj_border_attack_outcome_tt:0 "Após §Y10§! dias, uma guerra de fronteira se abre pelo estado disputado. Uma vitória adiciona §Y20 de Progresso da Reivindicação§!, uma derrota custa §Y10§! e um impasse custa §Y5§!.\nSe a posse, o controle ou a presença de tropas mudarem antes, a operação é cancelada sem custo."
 raj_chi_border_attack_outcome_tt:0 "Após §Y10§! dias, uma guerra de fronteira se abre pelo estado disputado. Uma vitória adiciona §Y20 de Progresso da Reivindicação§!, uma derrota custa §Y10§! e um impasse custa §Y5§!.\nSe a posse, o controle ou a presença de tropas mudarem antes, a operação é cancelada sem custo."
 border_war_frontier_exercise:0 "Exercício de Fronteira"
 border_war_frontier_exercise_desc:0 "Manobras prolongadas na fronteira estão desgastando as unidades estacionadas aqui."
 border_war_frontier_operation:0 "Operação de Fronteira"
 border_war_frontier_operation_desc:0 "Operações ativas ao longo da fronteira estão desgastando as unidades estacionadas aqui."
 border_war_state_garrison_tt:0 "Controlamos o setor de fronteira designado e temos ao menos §Y5§! divisões estacionadas ali"
 border_war_state_patrol_tt:0 "Controlamos o setor de fronteira designado e temos ao menos §Y3§! divisões estacionadas ali"
 border_war_state_mechanized_tt:0 "Controlamos o setor de fronteira designado e temos ao menos §Y3§! divisões com infantaria mecanizada ou motorizada estacionadas ali"
 border_war_state_artillery_tt:0 "Controlamos o setor de fronteira designado e temos ao menos §Y3§! divisões com artilharia ou artilharia de foguetes estacionadas ali"
 border_war_operation_blocked.2.t:0 "Preparativos Abandonados"
 border_war_operation_blocked.2.d:0 "A guarnição destinada à operação deixou a fronteira antes de os preparativos terminarem. O exercício foi cancelado, e o rival aproveitou a brecha para tomar a iniciativa."
 border_war_operation_blocked.2.a:0 "Um deslize custoso"
 border_war_mobilization_idea:0 "Mobilização Geral"
 border_war_mobilization_idea_desc:0 "As forças armadas passaram a uma postura de crise ao longo da fronteira disputada."
 pak_raj_border_train_army:0 "Realizar Exercícios do Exército em [From.GetName]"
 pak_raj_border_train_army_desc:0 "Realizar um exercício de quinze dias com as divisões que guarnecem [From.GetName], nosso setor de fronteira designado. Custa 20 de Poder de Comando. As unidades mobilizadas sofrem desgaste durante o período. Aumenta a Prontidão em 3. Retirar a guarnição antes de passados os quinze dias entrega os mesmos 3 de Prontidão ao nosso rival.\n\nQuando o exercício terminar, o exército designa um novo setor de fronteira."
 pak_raj_border_train_mechanized:0 "Realizar Exercícios Mecanizados em [From.GetName]"
 pak_raj_border_train_mechanized_desc:0 "Realizar um exercício mecanizado de quinze dias com as divisões mecanizadas e motorizadas estacionadas em [From.GetName], nosso setor de fronteira designado. Custa 20 de Poder de Comando. As unidades mobilizadas sofrem desgaste durante o período. Aumenta a Prontidão em 8, com risco de acidente. Retirá-las antes de passados os quinze dias entrega os mesmos 8 de Prontidão ao nosso rival.\n\nQuando o exercício terminar, o exército designa um novo setor de fronteira."
 pak_raj_border_train_artillery:0 "Realizar Exercícios de Artilharia em [From.GetName]"
 pak_raj_border_train_artillery_desc:0 "Realizar um treino de tiro de quinze dias com a artilharia e a artilharia de foguetes estacionadas em [From.GetName], nosso setor de fronteira designado. Custa 20 de Poder de Comando. As unidades mobilizadas sofrem desgaste durante o período. Aumenta a Prontidão em 5. Retirar as peças antes de passados os quinze dias entrega os mesmos 5 de Prontidão ao nosso rival.\n\nQuando o treino terminar, o exército designa um novo setor de fronteira."
 pak_raj_border_stage_incursion:0 "Encenar uma Incursão de Fronteira a partir de [From.GetName]"
 pak_raj_border_stage_incursion_desc:0 "Enviar uma patrulha através da linha a partir de [From.GetName], nosso setor de fronteira designado. Custa 20 de Poder de Comando. As unidades mobilizadas sofrem desgaste durante o período. Aumenta a Tensão Bilateral em 15 e traz risco de baixas. Retirar a patrulha antes de passados os quinze dias entrega 3 de Prontidão ao nosso rival.\n\nQuando a patrulha retornar, o exército designa um novo setor de fronteira."
 pak_raj_border_shell_positions:0 "Bombardear Posições de Fronteira a partir de [From.GetName]"
 pak_raj_border_shell_positions_desc:0 "Bombardear as posições defronte a [From.GetName], nosso setor de fronteira designado, com a artilharia e a artilharia de foguetes ali estacionadas. Custa 20 de Poder de Comando. As unidades mobilizadas sofrem desgaste durante o período. Aumenta a Tensão Bilateral em 22, gera mais tensão mundial e traz risco de retaliação. Retirar as peças antes de passados os quinze dias entrega 5 de Prontidão ao nosso rival.\n\nQuando o bombardeio terminar, o exército designa um novo setor de fronteira."
 pak_raj_border_negotiate:0 "Abrir Negociações Indo-Paquistanesas"
 pak_raj_border_negotiate_desc:0 "Usar a boa vontade mútua para reduzir a Tensão Bilateral em 25. Um acordo pacífico de crise, respaldado por forte confiança mútua, pode regular a fronteira de forma permanente."
 pak_raj_border_negotiate_tt:0 "§GA Tensão Bilateral Indo-Paquistanesa diminui em 25§!"
 pak_raj_border_settlement_tt:0 "§GA Índia e o Paquistão estabelecem um acordo duradouro de fronteira§!"
 pak_raj_border_issue_ultimatum:0 "Emitir um Ultimato Territorial"
 pak_raj_border_issue_ultimatum_desc:0 "Exigir exatamente o estado respaldado pelo nosso impulso local. A recusa permite um objetivo de guerra limitado contra esse estado."
 pak_raj_border_ultimatum_tt:0 "O rival pode devolver o estado disputado ou rejeitar a exigência e arriscar uma guerra limitada."
 pak_raj_border_tension_90_required_tt:0 "A Tensão Bilateral Indo-Paquistanesa é de pelo menos 90"
 pak_raj_border_stand_down:0 "Recuar da Crise"
 pak_raj_border_stand_down_desc:0 "Encerrar a crise, reduzir a Tensão Bilateral em 30 e aceitar uma perda de Apoio à Guerra."
 pak_raj_border_stand_down_tt:0 "§GEncerra a crise e reduz a Tensão Bilateral Indo-Paquistanesa em 30§!"
 pak_raj_border_reject_ultimatum_tt:0 "§RO emissor pode criar um objetivo de guerra limitado pelo estado disputado§!"
 pak_raj_border_mediation_offer_tt:0 "O escalonador da crise decidirá se aceita a mediação americana."
 raj_chi_border_train_army:0 "Realizar Exercícios do Exército em [From.GetName]"
