 ITA_ignazio_la_russa: "이냐치오 라 루사"
 ITA_ignazio_la_russa_desc: ""
 ITA_giorgia_meloni: "조르자 멜로니"
 ITA_giorgia_meloni_desc: "Io sono Giorgia! Sono una Madre! Sono Italiana!"
 ITA_guido_crosetto: "귀도 크로세토"
 ITA_guido_crosetto_desc: ""
 ITA_attilio_carelli: "아틸리오 카렐리"
 ITA_attilio_carelli_desc: ""
 ITA_roberto_fiore: "로베르토 피오레"
 ITA_roberto_fiore_desc: ""
 ITA_simone_di_stefano: "시모네 디 스테파노"
 ITA_simone_di_stefano_desc: ""
 ITA_post_cold_war_reforms: "냉전 이후 개혁"
 ITA_post_cold_war_reforms_desc: "냉전의 종식과 함께 군사 교리는 정체기에 접어들었으며, 우리나라가 마주할 새로운 현실에 맞춰 조정되어야 합니다."
 ITA_advanced_technology: "첨단 기술"
 ITA_advanced_technology_desc: "재래식 전력은 훌륭한 근간이지만, 더 이색적인 전쟁 수단을 갖추는 것도 언제나 좋은 생각입니다."
 ITA_military_nuclear_program: "군사 핵 프로그램"
 ITA_military_nuclear_program_desc: "이탈리아는 지금까지 비핵화된 국가였지만, 전 세계의 사건들은 이 원칙을 버리는 것이 좋다는 것을 보여 줍니다. 다가오는 폭풍을 견뎌내고 승리하려면 핵무기 개발이 최우선 과제 중 하나가 되어야 합니다."
 ITA_naval_reactors: "함선용 원자로"
 ITA_naval_reactors_desc: "원자력을 사용하는 해군 함선은 재래식 함선보다 적은 보급으로 더 오래 항해하고 더 빠르게 이동할 수 있습니다. 비용이 더 드는 것은 사실이나, 그 이점은 단점과 비용을 훨씬 능가합니다."
 ITA_nuclear_weapons: "핵무기"
 ITA_nuclear_weapons_desc: "기반 작업이 끝나고 이론적 연구가 완료되었으니, 이제 실제로 핵탄두를 개발할 때입니다. 이탈리아가 핵 클럽에 가입할 때가 왔습니다."
 ITA_new_alfa_project: "신 알파 계획"
 ITA_new_alfa_project_desc: "1971년 알파 계획을 통해 이탈리아는 미국의 폴라리스 설계에 기반한 최초의 ICBM을 개발했습니다. 이러한 유형의 새로운 계획을 시작하면 군사 및 민간 항공우주 용도의 모든 종류의 미사일을 개발할 토대가 마련될 것입니다."
 ITA_vega_rocket: "베가 로켓"
 ITA_vega_rocket_desc: "자국의 궤도 발사 능력을 갖추는 것은 위성망을 구축하고 궤도에 제약 없이 접근하는 데 극히 중요합니다. 새로 개발한 ICBM을 우주 발사체로 전환하는 것은 이 능력을 시작하는 저렴하고 좋은 방법입니다. 베가 구상은 별을 향한 새로운 길을 열어 줄 것입니다."
 ITA_galileo_satellites: "갈릴레오 위성"
 ITA_galileo_satellites_desc: "GPS와 GLONASS는 양대 전 지구 위성항법 자리이지만, 이들을 사용하는 것은 우리의 이해관계가 틀어질 경우 주인이 우리를 차단할 위험이 따릅니다. 우리만의 위성항법시스템 네트워크를 구축하는 것은 국가 안보뿐만 아니라 민간의 자부심이 걸린 문제입니다."
 ITA_submarine_missiles: "잠수함 발사 미사일"
 ITA_submarine_missiles_desc: ""
 ITA_cruise_missiles: "순항 미사일"
 ITA_cruise_missiles_desc: ""
 ITA_modernize_air_defence: "대공 방어 현대화"
 ITA_modernize_air_defence_desc: "이제 ICBM을 보유하게 되었으니 이에 대한 방어도 필요합니다. 우리 영토에 대한 타격을 막으려면 탄도탄 요격 및 지대공 미사일 능력을 구축하는 것이 시급합니다."
 ITA_upgrade_nike_missiles: "나이키 미사일 개량"
 ITA_upgrade_nike_missiles_desc: "냉전 시기 미국이 제공한 나이키 체계는 우리에게 초보적인 탄도탄 요격 능력을 부여합니다. 현대의 위협에 대응하려면 이 미사일과 발사대를 현대식 탄도 미사일을 요격할 수 있는 수준으로 개량해야 합니다."
 ITA_upgrade_hawk_missiles: "호크 미사일 개량"
 ITA_upgrade_hawk_missiles_desc: "당시 미국이 제공한 호크 체계는 세계 최고 수준의 방공 체계 중 하나였으나, 세월이 지나며 구식이 되었습니다. 발사대와 미사일을 개량하면 우리의 대공 방어망이 강화될 것입니다."
 ITA_aster_missiles: "아스터 미사일"
 ITA_aster_missiles_desc: "아스터는 지상과 함선 양쪽에 설치할 수 있는, 완전히 유럽 단일 계열의 현대식 지대공 미사일을 개발하기 위한 프랑스와의 공동 노력의 결과물입니다. 구매를 위한 새 계약을 체결하여 상당량을 조달할 수 있습니다."
 ITA_military_leadership: "군 지도부"
 ITA_military_leadership_desc: "평범한 병사, 조종사, 선원도 전투에서 이길 수 있지만, 이들이 대규모로 승리하고 궁극적인 완전한 승리에 이르도록 하는 것은 유능한 지도력입니다. 낡은 사고방식으로는 이 새로운 시대의 전투에서 이길 수 없으므로 새로운 조건에 맞게 조정해야 합니다."
 ITA_air_superiority: "제공권"
 ITA_air_superiority_desc: "제공권 확보는 전쟁 중 한쪽에 일어날 수 있는 가장 결정적인 일인 경우가 많습니다. 날씨와 낡은 전술이 이를 가로막게 둘 수 없습니다. 조종사들에게 공중전과 악천후 조건에서의 운용을 더 잘 훈련시키는 것이 시급합니다."
 ITA_bomber_interception: "폭격기 요격"
 ITA_bomber_interception_desc: "세계 강대국들이 배치한 항공기 수에 맞서기를 바랄 수는 없지만, 우리를 공격하는 비용을 매우 크게 만들어 어떤 강국도 애초에 공격을 감행하기 전에 두 번 생각하도록 할 수는 있습니다."
 ITA_ground_support: "지상 지원"
 ITA_ground_support_desc: "근접 항공 지원(CAS)은 새로운 전쟁의 신이며, 따라서 아래의 지상전을 형성하는 데 공군을 활용하는 방법에 대한 더 나은 훈련이 필요합니다. 정밀 타격, 우선 표적 제거, 막대한 사상자 유발은 우리 공군이 더 잘 훈련해야 할 부분입니다."
 ITA_strategic_bombing: "전략 폭격"
 ITA_strategic_bombing_desc: "적의 물류와 공장 체계를 더 잘 타격하려면 표적 포착, 타격 조율, 방어 비행을 더 열심히 훈련해야 합니다. 이 분야에서 나아지려면 새로운 훈련 체제와 전술적 접근이 필요합니다."
 ITA_airforce_reformer: "공군 개혁가"
 ITA_airforce_reformer_desc: "공중전의 분야는 시작된 이후 많이 변했으며, 이러한 변화의 속도는 느려질 기미를 보이지 않습니다. 우리의 공군 원수들은 이 분야에서 마주한 새로운 현실에 맞게 사고를 조정해야 합니다."
 ITA_army_offense: "육군 공세"
 ITA_army_offense_desc: "우리 육군은 승리를 거두기 위해 순식간에 적에게 찔러 넣을 수 있는 창입니다. 이 창을 강철 같은 의지의 지휘관과 훌륭한 전략적 사고로 단련하여 언제 어떻게 사용하는 것이 최선인지 알아야 합니다. 무기는 그것을 휘두르는 사람만큼만 훌륭합니다."
 ITA_army_defense: "육군 방어"
 ITA_army_defense_desc: "우리 지휘관들은 그들 뒤에서 이탈리아 국민이 가족의 안전을 지켜 줄 것을 그들에게 의지하고 있음을 이해해야 합니다. 우리의 전략과 지도부를 구성하여 육군을 어떤 외부 세력도 뚫을 수 없는 보루로 만들어야 합니다."
 ITA_army_logistics: "육군 병참"
 ITA_army_logistics_desc: "군대는 병참이 작동하는 만큼만 싸울 수 있습니다. 군대의 병참 수요를 계획하는 것은 적을 어떻게 분쇄할지 계획하는 것만큼 중요합니다. 우리 장교들은 항상 병력이 어디서 어떻게 식량과 재보급을 받을지, 그리고 손에 있는 보급품을 승리를 위해 어떻게 최선으로 활용할지 생각해야 합니다."
 ITA_army_planning: "육군 계획"
 ITA_army_planning_desc: "어떤 계획도 적과 접촉하면 살아남지 못합니다. 우리 장교들은 빠르게 사고하고, 변화하는 전장 조건에 적응하기 위해 더욱 민첩하게 움직이도록 훈련받아야 합니다. 적의 돌파를 저지하든 적 전선 깊숙이 돌격을 밀어붙이든, 우리 장교들은 효과적으로 병력을 지휘할 수 있어야 합니다."
 ITA_army_reformer: "육군 개혁가"
 ITA_army_reformer_desc: "우리 육군은 아마도 현대화 노력에서 가장 뒤처져 있을 것입니다. 새로운 전술 사상과 지상전 수행 방식의 개발을 진행하는 것이 매우 중요합니다."
 ITA_decisive_battle: "결전"
 ITA_decisive_battle_desc: "해군의 핵심 목적은 상대의 함대를 파괴하고 이후 그 우위를 밀어붙일 만큼 충분한 함선을 남기는 것입니다. 단 한 번의 정면 대결에 의존하는 전략을 세움으로써, 우리는 적에게 적응하거나 대응할 시간을 주지 않고 승리를 거머쥐게 됩니다."
 ITA_naval_war_of_attrition: "해상 소모전"
 ITA_naval_war_of_attrition_desc: "잠수함과 기타 해군 자산으로 적의 보급선과 무역 선단을 습격하면, 정면 대결에서 우리 병력을 위험에 빠뜨리지 않고도 적의 전쟁 노력에 타격을 줄 수 있습니다. 적을 무너뜨리는 천 번의 작은 상처는 단 한 번의 결정적 일격으로 쓰러뜨리는 것과 다를 바 없습니다."
 ITA_fleet_maneuver: "함대 기동"
 ITA_fleet_maneuver_desc: "대형 함선은 위신과 순수한 전투력에 중요하지만, 수가 적고 매우 비쌉니다. 더 작은 전투 함선을 더 많이 활용하면 동시에 더 많은 곳에 있으면서 못지않게 맹렬하게 타격할 수 있고, 더 많은 손실을 감당하면서도 전투 능력을 유지할 수 있습니다."
 ITA_naval_aviation: "해군 항공"
 ITA_naval_aviation_desc: "운용 가능한 항공모함을 보유하고 더 건조할 계획인 몇 안 되는 세계 강국으로서, 우리는 해군 항공을 미사일과 전통적인 공격 수단이 허용하는 범위를 훨씬 벗어난 표적을 타격하는 함대 능력의 연장으로 바라보는 방식을 다듬어야 합니다."
 ITA_naval_reformer: "해군 개혁가"
 ITA_naval_reformer_desc: "해군은 장비가 잘 갖춰져 있지만, 최근의 동맹과의 전투 경험을 통해 전술을 개선하고 해전과 공중전 모두의 새로운 기술 발전에 맞게 조정할 수 있습니다."
 ITA_military_infrastructure: "군사 기반시설"
 ITA_military_infrastructure_desc: "잘 구축되고 잘 훈련된 군대도 이를 유지하는 데 필요한 기반시설이 없으면 아무것도 아닙니다. 해군 기지, 비행장, 요새, 지대공 미사일, 해안 방어 시설은 강력한 방어상의 이점과, 전쟁에 나서야 할 경우 향후 배치를 위한 강력한 집결지를 제공합니다."
 ITA_air_defences: "대공 방어"
 ITA_air_defences_desc: "현대식 지대공 미사일망을 갖추는 것은 항공기와 미사일을 이용한 적대적 공격으로부터 우리 영토와 병력을 지키는 데 핵심입니다. 냉전 종식 이후 이 분야의 우리 방어는 제한적이고 구식이었습니다. 핵심 지점을 추가적인 현대식 지대공 미사일로 강화하면 큰 도움이 될 것입니다."
 ITA_missile_defences: "미사일 방어"
 ITA_missile_defences_desc: "탄도 미사일은 드문 위협이지만, 단 하나만 뚫고 들어와도 우리 도시에 파멸을 가져올 수 있습니다. 가장 집요한 공격조차 우리에게 그런 치명적 타격을 입히지 못하도록 새로운 탄도탄 요격 미사일망을 구축해야 합니다."
 ITA_naval_bases: "해군 기지"
 ITA_naval_bases_desc: "새로 확장된 이탈리아 해군은 더 많은 해군 인원을 수용하고 더 많은 함선을 정박시켜 즉응 태세를 유지할 수 있는 새 기지가 필요합니다. 함대를 한정된 장소에 밀집시켜 적이 타격하여 섬멸할 완벽한 기회를 제공하지 않도록 이 기지들을 건설하는 것이 최선입니다."
 ITA_coastal_defense: "해안 방어"
 ITA_coastal_defense_desc: "해군은 많은 공격을 막을 수 있지만, 그 노력이 실패할 경우 적대적 침공으로부터 해안을 방어할 대체 계획이 필요합니다. 핵심 지역에 일련의 요새를 건설하는 것은 필요하다면 나중에 확장할 수 있는 좋은 기본선입니다."
 ITA_eastern_alpine_forts: "동부 알프스 요새"
 ITA_eastern_alpine_forts_desc: "동부 알프스 지역은 불안정한 발칸과 접해 있으며 자연 방어물도 부족합니다. 이 지역을 요새화하지 않는 것은 위험하며, 침공 시 우리 병력이 방어할 곳이 아예 없는 상황으로 이어질 수 있습니다."
 ITA_northern_alpine_forts: "북부 알프스 요새"
 ITA_northern_alpine_forts_desc: "스위스의 공격을 예상하는 사람은 거의 없지만, 스위스가 적대 세력의 통제 아래 놓인다면 잠재적 적이 우리 북부 방어선을 반으로 갈라놓을 수 있는 훌륭한 거점이 됩니다. 이러한 가능성을 막으려면 이 지역을 확보해야 합니다."
 ITA_western_alpine_forts: "서부 알프스 요새"
 ITA_western_alpine_forts_desc: "서부 알프스 지역은 프랑스의 잠재적 돌격에 활짝 열려 있으며 우리의 산업 중심지로 곧바로 이어집니다. 국경 수비대가 주력이 도착할 때까지 버틸 수 있는 방어의 근간을 만드는 것이 이 지역을 확보하는 데 시급합니다."
 ITA_procurement_choice: "조달처 선택"
 ITA_procurement_choice_desc: "우리 군수 산업의 일부 부문은 최상의 상태로 끌어올리기 위해 외국과의 협력에서 큰 이익을 얻을 수 있습니다. 손을 내밀 수 있는 몇 가지 원천이 있으며, 혼자서 버텨볼 수도 있습니다."
 ITA_nato_procurement: "나토 조달"
 ITA_nato_procurement_desc: "나토는 공동의 장비 표준과 더 나은 상호운용성을 위해 회원국 사이에 기술 이전 및 판매 체계를 유지합니다. 몇몇 동맹국은 특정 분야에서 우리를 크게 앞서 있으며, 우리가 직접 생산하는 모델을 개발할 때 그들의 경험을 활용하는 것이 좋습니다."
 ITA_eastern_procurement: "동방 조달"
 ITA_eastern_procurement_desc: "러시아와 중국은 수십 년간 기갑과 미사일 개발의 선두에 있었으며, 우리는 더 이상 나토의 원천에서 혜택을 받을 수 없으므로 동쪽으로 눈을 돌려 그들의 경험에 기반하여 우리 체계를 개발하는 데 필요한 기술 지원을 얻어야 합니다."
 ITA_independent_procurement: "독자 조달"
 ITA_independent_procurement_desc: "세계가 더욱 불안정해짐에 따라, 우리는 자국의 군수 산업을 개발하는 노력을 홀로 밀고 나아가야 합니다. 서방과 동방 진영의 표준에 필적할 뿐만 아니라 이를 능가하는 모델을 만들 열정을 가진 이탈리아 설계자들이 많이 있습니다."
 ITA_equipment_specialization: "장비 전문화"
 ITA_equipment_specialization_desc: "특정한 도전에 맞서도록 장비를 더욱 정교화할 필요가 있습니다. 당면한 임무에 정확히 부합하는 도구를 개발해야 합니다."
 ITA_future_army: "미래 육군"
 ITA_future_army_desc: "전쟁이 발전했음에도 병사와 그의 소총은 여전히 모든 군대의 근간입니다. 실제로 몇 명의 병력이 필요한지, 그리고 이들을 실제로 어떻게 훈련시킬지 결정해야 합니다."
 ITA_professional_army: "전문 직업군"
 ITA_professional_army_desc: "누구나 수십만 명을 배치하고 승리하기를 바랄 수 있지만, 총구를 어디로 향해야 할지 모르면 이길 수 없습니다. 복잡한 전투에 능숙한 잘 훈련된 병력의 핵심을 갖추면 어느 상대보다 훨씬 복잡한 전술을 구사하여 승리를 거둘 수 있습니다."
 ITA_stricter_training: "엄격한 훈련"
 ITA_stricter_training_desc: "전투에서는 더 잘 훈련된 쪽이 이깁니다. 병력이 어떤 조건과 어떤 환경에 놓이더라도 싸울 수 있는 수준으로 훈련시켜야 합니다. 이 속도를 유지한다면 우리 병사들은 세계 최고가 될 것입니다."
 ITA_dedicated_logistics: "전담 병참"
 ITA_dedicated_logistics_desc: "잘 훈련된 우리 병력이 효과적으로 싸우려면 잘 훈련된 병참의 근간이 필요합니다. 병력에게 제공하는 최고 수준의 훈련과 최첨단 장비도 실제로 전선에 닿지 않는다면 아무 소용이 없습니다."
 ITA_advanced_equipment_standards: "첨단 장비 표준"
 ITA_advanced_equipment_standards_desc: "최고의 병사에게는 돈으로 살 수 있는 최고의 장비가 필요하며, 경쟁국이 가진 것보다 뛰어난 장비를 개발해야 합니다."
 ITA_volounteer_forces: "지원병 부대"
 ITA_volounteer_forces_desc: "사람들을 억지로 싸우게 하는 것은 좋은 병사를 만드는 경우가 드뭅니다. 가장 동기 부여가 잘된 병력은 자유 의지로 싸우는 지원병입니다. 이러한 사람들을 더 잘 찾아 군대로 이끄는 체계를 마련해야 합니다."
 ITA_massive_army: "대규모 육군"
 ITA_massive_army_desc: "양이 곧 질이라고 말하는 이들도 있으며, 더 큰 나토나 동방 강국들과 겨루려면 그들의 병력 수에 맞설 수 있는 군대가 필요합니다."
 ITA_streamline_mass_recruitment: "대규모 모병 간소화"
 ITA_streamline_mass_recruitment_desc: "양을 택하기로 했으므로, 이만큼의 인원을 효율적으로 소집할 방법을 찾아내야 하며, 그렇지 않으면 동원이 실제로 의미 있을 만큼 빠르지 못할 위험이 있습니다."
 ITA_streamlined_logistics: "병참 간소화"
 ITA_streamlined_logistics_desc: "이렇게 많은 병사를 배치하면 새로운 병참상의 과제가 생기며, 우리 국경 밖 어디에든 실제로 배치하려면 이 과제들을 극복해야 합니다."
 ITA_mass_produced_equipment: "대량 생산 장비"
 ITA_mass_produced_equipment_desc: "모든 병사에게는 전장에서 기능하기 위해 소총, 군복, 구급 키트, 무전기, 그리고 그 밖의 많은 소소한 물품이 필요합니다. 병사들에게 최고의 물품을 충분한 수량으로 사줄 수는 없지만, 좋은 기본선을 갖추는 것은 필수입니다."
 ITA_home_exercises: "국내 훈련"
 ITA_home_exercises_desc: "이렇게 많은 인원을 동시에 동맹국과 훈련시키면서 훈련 수준을 유지할 수는 없습니다. 훈련 기반시설, 기지, 병참 거점을 마련하고, 이렇게 많은 인원을 적절한 수준으로 끌어올릴 수 있는 훈련 체제를 개발해야 합니다."
 ITA_specialize_ariete: "아리에테 전차 전문화"
 ITA_specialize_ariete_desc: "아리에테 주력 전차는 우리 기갑 집단의 근간이자 육군의 자랑입니다. 새로운 육군 교리에 맞게 개조하는 것이 좋겠습니다."
 ITA_specialize_freccia: "프레차 보병전투차 전문화"
 ITA_specialize_freccia_desc: "프레차는 우리 기계화 보병 부대의 주력입니다. 그들의 경험과 의견을 활용하여 이 플랫폼을 더욱 개조해야 합니다."
 ITA_specialize_dardo: "다르도 장갑차 전문화"
 ITA_specialize_dardo_desc: "다르도 장갑차는 우리 군에서 M113의 후속입니다. 같은 급의 차량으로서는 무장과 장갑이 훌륭하지만, 개선할 방법은 언제나 찾을 수 있습니다."
 ITA_specialize_centauro: "첸타우로 경전차 전문화"
 ITA_specialize_centauro_desc: "첸타우로는 21세기 최고의 차륜형 전차입니다. 이를 통해 적 후방 지역에 전격 타격을 가하고 속도와 화력으로 전장의 우위를 유지할 수 있습니다. 그럼에도 더 개선하지 못할 이유가 있겠습니까?"
 ITA_specialize_lince: "린체 트럭 전문화"
 ITA_specialize_lince_desc: "트럭은 모든 군대의 근간이며, 우리 트럭을 최신 상태로 정상 작동하도록 유지하는 것은 필수입니다."
 ITA_specialize_arx: "ARX 총기 전문화"
 ITA_specialize_arx_desc: "소형 화기는 1970년대 말 이후 대체로 정체되어 왔지만, 그렇다고 몇 가지 발전을 이루려는 시도를 할 수 없는 것은 아닙니다."
 ITA_specialize_siaccon: "SIACCON 장비 전문화"
 ITA_specialize_siaccon_desc: "SICCONIA는 전장 지휘통제(C&C)를 위한 우리의 자체 체계입니다. 교리가 발전함에 따라 우리의 체계도 발전해야 합니다."
 ITA_specialize_spike: "스파이크 미사일 전문화"
 ITA_specialize_spike_desc: "이스라엘이 생산하는 스파이크는 세계 최고의 대전차 유도 미사일(ATGM)로 평가받는 현대식 상부 공격 미사일이지만, 언제든 개선할 수 있습니다."
 ITA_specialize_stinger: "스팅어 미사일 전문화"
 ITA_specialize_stinger_desc: "스팅어는 나토에서 가장 흔한 휴대용 방공 시스템(MANPADS)이며 우리도 수십 년간 배치해 왔습니다. 앞으로의 분쟁에 맞게 개조하는 것이 좋겠습니다."
 ITA_specialize_obice_fh: "FH70 곡사포 전문화"
 ITA_specialize_obice_fh_desc: "포병은 진정으로 전쟁의 신이지만, 우리의 FH-70과 그 하위 체계는 우리의 필요에 더 잘 맞도록 손볼 여지가 있습니다."
 ITA_specialize_semovente: "자주포 전문화"
 ITA_specialize_semovente_desc: "우리가 사용하는 PzH 2000은 독일에서 유래했지만, 확실히 \\"이탈리아식\\" 개량 패키지가 있으면 좋을 것입니다."
 ITA_future_airforce: "미래 공군"
 ITA_future_airforce_desc: "이탈리아 공군은 하늘의 수호자입니다. 머지않아 맞서야 할 변화하는 위협에 더 잘 대응하고 다른 군과의 협조를 개선하기 위해 훈련, 장비, 전술을 조정해야 합니다."
 ITA_air_dominance: "공중 우세"
 ITA_air_dominance_desc: "최선의 방어는 좋은 공격입니다. 조종사들이 머리 위 하늘을 완전히 장악할 것이므로, 공격받지도 않을 표적을 보호하는 데 자원을 낭비하지 말고 하늘을 장악하는 데 모든 노력을 쏟는 것이 낫습니다."
 ITA_hostile_sky: "적대적인 하늘"
 ITA_hostile_sky_desc: "항상 공중 우세를 가질 수 있다고 의존할 수는 없으며, 따라서 모든 공습을 요격하지 못할 수 있습니다. 지상군이 이로 인한 사상자를 더 잘 줄이고, 적이 가짜 표적을 타격하거나 아예 표적을 빗맞혀 공격과 탄약을 낭비하게 만들 수 있도록 훈련시켜야 합니다."
 ITA_incapacitate_enemy: "적 무력화"
 ITA_incapacitate_enemy_desc: "적의 병참 기반시설과 산업 기반을 폭격하는 것은 적의 진지를 직접 공격하는 것보다 우리의 승리 가능성에 더 큰 영향을 미치는 경우가 많습니다. 물론 모든 노력을 적 폭격에 집중하면 우리 쪽이 평소보다 더 많이 타격받을 수 있지만, 우리가 받는 것보다 더 큰 피해를 입힌다면 큰 문제가 아닙니다."
 ITA_home_air_defense: "본토 대공 방어"
 ITA_home_air_defense_desc: "현재 우리의 산업과 병참망은 표적 폭격에 취약합니다. 어떤 군대도 근간이 부러진 채로는 싸울 수 없으므로, 적이 뚫고 들어오더라도 피해가 최소화되고 우리의 작전에 영향을 주지 않도록 방어를 마련하고 기반시설을 분산시켜야 합니다."
 ITA_air_superiority_fighter: "공중우세기"
 ITA_air_superiority_fighter_desc: "우리 폭격기가 아무리 첨단이어도, 날아가야 할 하늘을 장악하지 못하면 쓸모가 없습니다. 첨단 제공 플랫폼에 투자하면 하늘을 지배하고 적의 지원이 우리 부대를 타격하지 못하게 할 우위를 얻을 수 있습니다."
 ITA_multirole_fighters: "다목적 전투기"
 ITA_multirole_fighters_desc: "어떤 임무든 소화할 수 있는 항공 전력을 갖추는 것이 자금의 가장 좋은 활용입니다. 다목적 전투기는 우리 공군 함대의 근간이 되어, 어떤 임무가 나타나든 수행할 수 있고 변화하는 전장 상황에 맞춰 임무를 재조정할 준비가 되어 있을 것입니다."
 ITA_light_fighters: "경전투기"
 ITA_light_fighters_desc: "저렴하고 대량 생산되지만 여전히 효과적인 전투기에 의존하면, 대부분의 경우 충분히 좋은 성능을 내는 플랫폼에 너무 많은 돈을 쓰지 않고도 공중전의 모든 틈새를 메울 수 있습니다. 한 대가 격추되어도 상관없습니다. 10대가 더 오고 있으니까요."
 ITA_strike_fighters: "타격 전투기"
 ITA_strike_fighters_desc: "공격 전투기는 지상 표적을 공격하는 동시에 분쟁 중인 공역에서 생존하기에 최선의 선택입니다. 필요하면 반격할 수 있고 지상 표적에 상당한 피해를 줄 만큼 큰 탑재량을 실을 수 있으므로, 지상 공격 플랫폼을 이 영역에 집중해야 합니다."
 ITA_ground_attack_drones: "지상 공격 드론"
 ITA_ground_attack_drones_desc: "미국인들은 무인 전투 항공기(UCAV)가 얼마나 효과적일 수 있는지 입증했습니다. 긴 체공 시간, 상당한 탑재량, 인명 위험이 없다는 점은 전통적인 타격 플랫폼에 비해 상당한 이점을 줍니다. 지상 공격 노력을 드론에 집중하면 소중한 인력을 다른 임무에 쓸 수 있고 전체적으로 비용도 덜 들입니다."
 ITA_naval_bomber: "뇌격기"
 ITA_naval_bomber_desc: "제2차 세계 대전 이후, 항공모함 기반 항공 전력은 공중, 지상, 해상 표적을 모두 타격해야 하는 함대의 주된 타격 자산이었습니다. 강력한 해군 폭격기를 만들고 유지함으로써 우리 해군 항공 집단에게, 모든 적대 세력이 경계해야 할 강력한 도구를 줄 수 있습니다."
 ITA_naval_multirole: "해군 다목적기"
 ITA_naval_multirole_desc: "해군 타격 집단은 흔히 우리 해안에서 멀리 떨어진 매우 적대적인 환경에서 작전해야 합니다. 우리 해군 항공기는 어떤 도전에도 온전히 대응할 수 있어야 하며, 이는 육상 기반 항공기에 필적하는 좋은 해군 다목적기가 있어야만 가능합니다."
 ITA_naval_light_multirole: "경량 해군 다목적기"
 ITA_naval_light_multirole_desc: "큰 항공모함과 큰 함재기는 멋지지만 손실을 감당할 여지가 거의 없습니다. 더 작고 저렴한 플랫폼에 집중하면 더 많이 배치할 수 있을 뿐만 아니라 작전 속도를 저해하지 않고 더 많은 손실을 감당할 수 있습니다. 비용도 더 저렴하니 언제나 좋은 일입니다."
 ITA_strategic_bomber: "전략폭격기"
 ITA_strategic_bomber_desc: "전략 폭격기는 비싸고 유지하기 어려우며 생산도 매우 어렵습니다. 그러나 전략 상황에 미치는 효과는 결정적일 수 있으며 전쟁을 우리에게 유리하게 돌리는 경우가 많습니다. 적에 대해 이러한 힘을 갖길 원한다면 강력한 전략 폭격기를 건조하는 것이 최우선 과제가 되어야 합니다."
 ITA_future_navy: "미래 해군"
 ITA_future_navy_desc: "이탈리아 해군은 역사적으로 유럽에서 가장 강력한 해군 중 하나이며, 잘 발달한 원양 능력과 전력 투사 체계를 갖추고 있습니다. 지역과 세계 전반의 현실에 더 잘 맞도록 이를 더욱 발전시켜야 합니다."
 ITA_mediterranean_navy: "지중해 해군"
 ITA_mediterranean_navy_desc: "지중해는 우리의 본거지이자 수 세기 동안의 역사적 작전 지역입니다. 이 지역을 지배할 수 있는 해군 전력을 개발하고 연안 및 근해 작전에 특화시키는 것은 앞으로 실행 가능한 전략이 될 수 있습니다."
 ITA_land_based_naval_airforce: "육상 기반 해군 항공대"
 ITA_land_based_naval_airforce_desc: "우리 본토는 항공기가 지중해를 순찰하기에 완벽한 중앙 위치에 있습니다. 항공기를 육상에 배치하는 것은 항공모함을 사용하는 것보다 훨씬 저렴하고 안전하며, 우리의 위치 덕분에 작전상의 이점도 포기하지 않습니다."
 ITA_attack_submarines: "공격 잠수함"
 ITA_attack_submarines_desc: "잠수함은 현재 공해에서 가장 다재다능한 전력입니다. 눈에 띄지 않은 채 통상 차단, 전장 감시, 심지어 비밀 작전에 이르기까지 온갖 임무를 수행할 수 있습니다. 지중해에서는 우리 잠수함이 갇혀 있는 더 큰 수상 함선들을 두들길 수 있습니다."
 ITA_frontline_corvettes: "최전선 초계함"
 ITA_frontline_corvettes_desc: "호위함이 우리 해군의 근간을 이루지만, 초계함은 해군 수요의 공백을 메우고 전체 해군력을 희생하지 않으면서 통상 보호나 순찰처럼 전투가 덜 잦지만 못지않게 중요한 임무에 배정될 수 있습니다."
 ITA_frigate_backbone: "호위함 근간"
 ITA_frigate_backbone_desc: "호위함은 오늘날 바다에서 가장 흔한 유형의 전투함이며, 우리의 지역적 초점을 고려하면 우리 또한 이 유형의 함선에 집중하는 것이 당연합니다. 더 큰 함선으로 구성된 비슷한 규모의 함대보다 더 적은 비용으로 더 많이 배치할 수 있습니다."
 ITA_dedicated_AA_destroyers: "대공 전담 구축함"
 ITA_dedicated_AA_destroyers_desc: "공중 공격은 해군 함선이 맞닥뜨릴 수 있는 가장 위험한 위협 중 하나입니다. 우리의 대공 능력을 강화하는 체계와 훈련 체제를 개발해야 하며, 어쩌면 함대 전체의 방공에 집중하는 함선을 생산할 수도 있습니다. 구축함은 이를 위한 최고의 플랫폼입니다."
 ITA_oceanic_navy: "대양 해군"
 ITA_oceanic_navy_desc: "우리는 언제나 주로 지중해의 강국이었지만, 우리 근해의 한계를 벗어나면 더 적극적인 세계적 태세를 취할 수 있습니다. 이는 우리의 교리를 크게 바꿀 것이나, 해군력을 사용할 가능성을 훨씬 더 넓혀 주고, 본토 방어에 덜 특화되더라도 전체적으로 더 강한 전력을 만들어 줄 것입니다."
 ITA_supercarrier_development: "초대형 항공모함 개발"
 ITA_supercarrier_development_desc: "현재의 항공모함은 대규모 해외 작전을 유지하기에는 너무 작으므로 더 큰 항공모함이 필요합니다. 미국의 니미츠급 같은 함선을 이탈리아에서 만든다면 새로 생긴 우리의 필요에 아주 잘 들어맞을 것입니다."
 ITA_missile_submarines: "미사일 잠수함"
 ITA_missile_submarines_desc: "지금까지 우리 잠수함 전력의 대부분은 비교적 작고 항속 거리가 짧았습니다. 장거리 미사일을 탑재한 대형 잠수함은 현재 보유한 것에서 큰 도약이 될 것이며, 훨씬 더 중대한 임무를 수행할 수 있게 해 줄 것입니다. 이 잠수함들은 핵추진일 수도 있고... 핵미사일을 실을 수도 있습니다."
 ITA_frontline_frigates: "최전선 호위함"
 ITA_frontline_frigates_desc: "초계함은 대양 함대의 주요 전단을 따라갈 항속력이 부족하므로, 호위함이 새 교리에서 \\"저렴한\\" 전력입니다."
 ITA_destroyer_backbone: "구축함 근간"
 ITA_destroyer_backbone_desc: "새로운 함대 계획의 토대는 구축함을 우리 해군 교리의 근간으로 삼는 데 집중할 것입니다. 대규모 전력을 구축하는 것은 비용이 들지만, 더 작은 함선으로 구성된 소규모 함대에 비해 순수한 힘의 측면에서 그만한 가치가 있을 것입니다."
 ITA_dedicated_AA_cruisers: "대공 전담 순양함"
 ITA_dedicated_AA_cruisers_desc: "순양함은 함대의 초장거리 대공 방어를 위한 최고의 플랫폼입니다. 구축함보다 더 많은 미사일을 탑재하고 사거리가 더 길어, 더 많은 위협과 더 큰 규모의 타격 편대로부터 방어할 수 있습니다."
 ITA_ASW_corvettes: "대잠 초계함"
 ITA_ASW_corvettes_desc: "제2차 세계 대전 당시 초계함은 잠수함에 맞서 싸우는 주력 중 하나였으며, 현대에도 다르지 않습니다. 강력한 대잠수함(ASW) 무장을 갖춘 작고 민첩한 함선은 적의 잠수함 전력을 끝장내는 데 완벽한 도구입니다."
 ITA_dedicated_landing_ships: "전담 상륙함"
 ITA_dedicated_landing_ships_desc: "상륙함은 전 세계 먼 곳의 전투단을 지원하고 보급할 수 있게 해 줍니다. 이 유형의 전문 함선을 확보하면 나토에 대한 약속을 이행하고 필요한 곳, 심지어 적이 점령한 지역에도 신속히 병력을 배치할 수 있는 능력이 강화될 것입니다."
