 SIA_not_ruled_by_democrats_tt: "§Y[conservatism_L]§! n'est pas le parti au pouvoir."
 SIA_not_ruled_by_royalists_tt: "§Y[Nat_Autocracy_L]§! et §Y[Monarchist_L]§! ne sont pas le parti au pouvoir."
