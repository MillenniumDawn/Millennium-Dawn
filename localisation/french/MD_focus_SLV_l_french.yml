l_french:
 slovenia.9.t: "La Slovénie rejoint l'OTAN"
 slovenia.9.d: "Le drapeau slovène a été hissé au siège de l'OTAN à Bruxelles aux côtés de six autres nouveaux membres, dans le plus grand élargissement de l'histoire de l'Alliance. Treize ans après l'indépendance, le pays se place sous le parapluie de l'article 5."
 slovenia.9.a: "Un monde un peu plus sûr"
 slovenia.10.t: "La Slovénie rejoint l'Union européenne"
 slovenia.10.d: "À minuit, les barrières aux frontières autrichienne, italienne et hongroise ont été levées au son des feux d'artifice et des fanfares. La Slovénie entre dans l'Union comme le plus riche des dix nouveaux membres, et les premiers fonds structurels sont déjà affectés aux routes et au rail."
 slovenia.10.a: "De retour au cœur de l'Europe"
 slovenia.11.t: "Le tolar cède la place à l'euro"
 slovenia.11.d: "La Slovénie est le premier des nouveaux États membres à adopter l'euro, en retirant le tolar après quinze ans de service. Le passage s'est fait sans accroc, et un crédit moins cher devrait maintenir la croissance au-dessus de la moyenne de la zone euro."
 slovenia.11.a: "Adieu au tolar"
 slovenia.12.t: "Schengen ouvre les frontières"
 slovenia.12.d: "La Slovénie est entrée dans l'espace Schengen et les derniers postes de passeports aux passages autrichiens, italiens et hongrois sont démantelés. La frontière croate forme désormais la frontière extérieure de l'Union, surveillée aux normes de Bruxelles."
 slovenia.12.a: "L'Europe sans postes de contrôle"
