 RAJ_bharat_sarkar_desc: "A Índia é um país multi-religioso. Temos que manter ou quebrar a confiança de certos grupos religiosos para alcançar o equilíbrio e o efeito desejado."
 RAJ_regul_pres_gov: "Regular a representação no governo"
 RAJ_ident_of_india: "Identidades da Índia"
 RAJ_ident_of_india_desc: "Toda religião tem interesse em nosso país. Não devemos esquecer que a Índia é bastante sensível a qualquer mudança no campo da religião."
 RAJ_region_gov_pos_sabh: "Posições Regionais"
 RAJ_secul_of_india: "Índia Secular"
 RAJ_secul_of_india_desc: "Achamos que é melhor ser mais pragmático em relação às religiões. Isso causará menos ressentimento do que se nos inclinarmos apenas para um lado."
 RAJ_hindu_nationalism_sabh: "Nacionalismo Hindu"
 RAJ_hindu_nationalism_sabh_desc: "Os hindus são o principal grupo religioso em nosso país. Acreditamos que são os seus desejos que devem ser os primeiros a serem considerados"
 RAJ_integr_sikhism: "Integrar o Sikhismo"
 RAJ_integr_sikhism_desc: "Os Sikhs deveriam se tornar uma religião amigável para nós para que haja um ambiente mais pacífico em nosso país."
 RAJ_suppr_sikhism: "Suprimir o Sikhismo"
 RAJ_suppr_sikhism_desc: "Não estamos pensando em nos inclinar para o lado Sikh."
 RAJ_guarant_christ_rights: "Garantir os direitos cristãos"
