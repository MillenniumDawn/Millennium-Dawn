 chinese_aligned: "Chinese-Aligned"
 chinese_aligned_desc: "Этот офицер поддерживает неформальные контакты с китайскими спецслужбами. Координация при совместном планировании происходит естественным образом, хотя лояльность государству не гарантирована."
 CHI_bri_completed_projects: "BRI Completed Projects"
 CHI_bri_completed_projects_desc: "Общее количество проектов в рамках инициативы «Один пояс, один путь», которые вышли на этап полноценного функционирования."
