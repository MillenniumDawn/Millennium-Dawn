 UKR_develop_2s22: "Разработка САУ §Y2С22 «Богдана»§!"
 UKR_develop_2s22_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_2s22_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y2С22 «Богдана»§! — [UKR.GetFlag] украинская 155-мм самоходная гаубица, разработанная §LКраматорским заводом тяжёлого станкостроения§!, чтобы обеспечить [UKR.GetFlag] Вооружённые силы Украины современной артиллерией стандарта НАТО.\nСистема установлена на колёсное шасси, что обеспечивает высокую оперативную подвижность и позволяет быстро менять огневую позицию после стрельбы.\n155-мм орудие может применять стандартные артиллерийские боеприпасы НАТО, что значительно увеличивает дальность и огневую мощь [UKR.GetFlag] украинских артиллерийских подразделений.\nАвтоматизированные системы управления огнём и навигации позволяют расчёту быстро определять данные для стрельбы и точнее поражать цели.\nСоздание §Y«Богданы»§! — важный шаг в модернизации [UKR.GetFlag] украинской артиллерии и переходе на системы вооружения стандарта НАТО.§!"
 UKR_modernize_su25_m1: "Модернизация ударного самолета §YSu-25§!"
