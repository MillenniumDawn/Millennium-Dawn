l_korean:
 FRA_state_of_french_politics: "프랑스의 정치 상황"
 FRA_state_of_french_politics_desc: "France occupies one of the world's most interesting, and most volatile, political positions. For a long time, our Fifth Republic was a model of stability, with power alternating between a socialist bloc and a conservative bloc. But as we move into this new millennium, the situation is becoming increasingly unclear. Some parties are emerging whilst others are collapsing; no one can say where the coming years will take us."
 FRA_nationalism_in_europe: "The Rise of Nationalism"
 FRA_nationalism_in_europe_desc: "It seems that the Bonapartists' victory in France is encouraging nationalists across all our European countries to become increasingly involved in politics. Whilst this momentum might enable us to better withstand a conflict with a foreign country, the actions of these agitators in peacetime are a real problem."
 FRA_economic_policy: "The Bercy Agenda"
 FRA_economic_policy_desc: "Bercy commands the Treasury directorate and the statisticians of INSEE, and every ministry that spends a franc answers to it in the end. France sits fifth among the world's economies, a rank held by policy rather than by size."
 FRA_free_market: "Into the Single Market"
 FRA_free_market_desc: "The single market has taken price-setting out of the ministry's hands and left our exporters to compete on their own terms. France Telecom and Air France have already passed into private ownership. What remains is to open the rest and let the trade come to us."
 FRA_total_sa: "토탈 (Total SA) 정유 회사"
 FRA_total_sa_desc: "Total has swallowed Petrofina and Elf Aquitaine to become one of the largest producers on earth, holding the Lacq gas field and the Parentis wells with the engineering run out of the CSTJF centre at Pau. Aquitaine still holds more than the majors have bothered to lift. A partnership on the Republic's terms would put that oil to work for us."
 FRA_french_economic_intervention: "Dirigisme"
 FRA_french_economic_intervention_desc: "Colbert set the pattern: the state picks the industries that matter and builds the champions to run them. The planning commissariat drafts the direction and the ministries hold the credit. Plants already standing will be pushed harder, whatever that does to the permit queue for new ones."
 FRA_reduction_in_taxes: "Cutting the Taxe Professionnelle"
 FRA_reduction_in_taxes_desc: "The taxe professionnelle falls on machinery and premises, which is to say on exactly the investment we claim to want. Add the social contributions and France carries one of the heaviest burdens of compulsory levies in Europe. Cutting it back should leave something in the tills and the pay packets."
 FRA_deregulation: "The Attali Commission"
 FRA_deregulation_desc: "The Commission for the Liberation of French Growth, chaired by Jacques Attali, has set out where the rules bind hardest: commercial zoning, protected professions, permits that take years. Lifting them opens ground for development in regions the planners had written off. The unions will read every line of it as a threat."
 FRA_state_stock_in_sa: "The Golden Share"
 FRA_state_stock_in_sa_desc: "A golden share and the equity held through the Agence des Participations de l'Etat give the Republic a vote that no shareholder meeting can outnumber. Output, export contracts and the price at the pump all cross a desk we control."
 FRA_paris_employment_projects: "The Grand Paris Works"
 FRA_paris_employment_projects_desc: "Seine-Saint-Denis has never recovered the work it lost, while the towers of La Defense rise a few stations down the line. The Grand Paris works can put the difference to use: sites, contracts and payrolls inside the Ile-de-France."
 FRA_nationalization_of_steel: "Reclaiming Usinor"
 FRA_nationalization_of_steel_desc: "Usinor-Sacilor holds the Lorraine basin and the works at Fos-sur-Mer and Florange, and it answers to its shareholders rather than to the Republic. Steel stops being a commodity the moment the shipyards and the tank plants depend on it. Taking the mills into state hands will delight the unions and enrage the boardrooms."
 FRA_private_contracting: "Contracting the Majors"
 FRA_private_contracting_desc: "Bouygues, Vinci and Eiffage will bid on partnership contracts where the contractor sets the price and keeps the margin. Sites finish faster than any ministry could manage them, and we pay the premium for it."
 FRA_tapping_resources: "Brignoles and Salau"
 FRA_tapping_resources_desc: "Provencal bauxite around Brignoles and Les Baux feeds the alumina works at Gardanne, and tungsten ore still lies under the Ariege at Salau. The deposits were abandoned when imports were cheaper. Reopening them is the difference between buying our alloys and making them."
 FRA_offshore_oilrigs: "The Guyane Maritime Licence"
 FRA_offshore_oilrigs_desc: "The Zaedyus prospect off Kourou proved that the Guyane Maritime blocks hold oil in deep water. The licence is ours to award and the rigs can be on station within the year. Guyana and Suriname claim the same seabed and will say so loudly."
 FRA_state_run_construction: "State-Led Public Works"
 FRA_state_run_construction_desc: "Under public project ownership the administration sets the price, the schedule and the headcount, and no contractor takes a margin out of it. The failing is familiar: a site voted through without full funding leaves the crews standing around for a season."
 FRA_infrastructure_projects: "State-Region Plan Contracts"
 FRA_infrastructure_projects_desc: "The plan contracts negotiated between the state and each regional council co-finance the roads, rail and networks no council could fund alone. The motorway revival plan and the regional planning offices already have the files open."
 FRA_decentralization: "Act II of Decentralisation"
 FRA_decentralization_desc: "The constitution can be made to say plainly that the organisation of the Republic is decentralised. Competences and the taxes to pay for them pass from the prefects to the regional councils, and decisions get made where the problem actually is. Paris keeps rather less than it is used to keeping."
 FRA_centralization: "The Jacobin State"
 FRA_centralization_desc: "The Jacobin tradition holds that one Republic means one administration, and the prefectoral corps exists to enforce it. Every line of regional spending comes back to Bercy for signature. It costs a fortune in clerks and it delivers a state that moves when it is told to."
 FRA_french_healthcare: "The Securite Sociale"
 FRA_french_healthcare_desc: "The Securite Sociale covers everyone, and the World Health Organisation has ranked the result first in the world. Whatever else the Republic argues about, nobody campaigns on dismantling it. Raising the health budget to match what it already promises buys quiet at home, and it is not cheap."
 FRA_french_arms_industries: "Direction Generale de l'Armement"
 FRA_french_arms_industries_desc: "The Direction Generale de l'Armement writes the requirements and signs the cheques for Nexter, Dassault, Thales, Naval Group, MBDA and Safran. It is the reason France can design a fighter, a frigate and a missile without asking anyone's permission."
 FRA_research_and_dev_projects: "CNRS and the CEA"
 FRA_research_and_dev_projects_desc: "CNRS laboratories and the Atomic Energy Commission carry French science, while the research tax credit pulls private money in behind them. Competitiveness clusters tie the universities to the industries around them. The bill lands on the education budget."
 FRA_reformed_universal_healthcare: "Universal Medical Protection"
 FRA_reformed_universal_healthcare_desc: "Universal medical protection replaces the means-tested patchwork, so cover follows residence rather than employment. A healthier population and a quieter one, bought at the price of a reform nobody in the ministries wanted to administer. The rural interior still has districts with no doctor at all, and hospitals paid by activity have no reason to open one."
 FRA_nexter: "Nexter Systems"
 FRA_nexter_desc: "GIAT Industries, reborn as Nexter, builds the Leclerc main battle tank, the CAESAR truck-mounted howitzer and the VBCI. Design sits at Satory outside Paris and assembly runs at Roanne. Both sites hold capacity we have never fully paid for."
 FRA_dassault: "Dassault Aviation"
 FRA_dassault_desc: "Dassault Aviation builds the Rafale and the Mirage 2000, the Falcon business jets that help pay for them, and the nEUROn demonstrator that comes next. Final assembly runs at Merignac outside Bordeaux, backed by the aerospace cluster across the Midi-Pyrenees."
 FRA_thales_group: "Thales and Naval Group"
 FRA_thales_group_desc: "Thomson-CSF has become Thales, supplying the radars and combat systems aboard the FREMM frigates and the carrier Charles de Gaulle. The hulls come from the yards at Saint-Nazaire and the submarine halls at Cherbourg. Keeping all of it busy is the most expensive commitment in the industry."
 FRA_usa_fra_collaboration: "The Safran-GE Partnership"
 FRA_usa_fra_collaboration_desc: "CFM International, the joint venture between Safran and General Electric, has put French engines under American wings and paid both partners handsomely. CNES instruments already fly on NASA missions. There is room to widen the arrangement to the laboratories behind them."
 FRA_french_armed_forces: "프랑스군"
 FRA_french_armed_forces_desc: "For the majority of French history the French Armed Forces have been a source of immense pride in our country. From the armies that marched against the English to defend our right to a French King, to the men who served under Napoleon himself, the military remains one of our clearest claims to set us apart from others."
 FRA_the_french_army: "프랑스 육군"
 FRA_the_french_army_desc: "The 'Armée de Terre,' or French Army, is one of the three core branches of our armed forces structure. The accomplishments of our army are sung far and wide. The forces should continue to be honoured and expanded to push our country further forward."
 FRA_the_french_air_force: "공군"
 FRA_the_french_air_force_desc: "Our air force is among the oldest in the world. The very first contingent of French air power was formed in 1909 as a wing of the French army. Now, it is its own independent wing, and we export one of the finest pieces of airpower in the world."
 FRA_french_navy: "프랑스 해군 (Marine Nationale)"
 FRA_french_navy_desc: "The French navy helped push our ambitions and our desires on a global scale. It helped found one of the largest colonial empires the world has seen, rivalling the Spanish and English. Investing in this will allow us to further project abroad."
 FRA_amx_leclerc: "AMX 르클레르"
 FRA_amx_leclerc_desc: "The AMX Leclerc and its successors are the MBT class of the French military. It is robust and well-rounded like most modern tanks. Investing further in their development can boost our armoured corps."
 FRA_network_centric_warfare: "네트워크 중심전"
 FRA_network_centric_warfare_desc: "Much like the Americans and other European majors we should invest in more technologically advanced methods of warfare to pull away from using people and begin to rely heavily on technology. The change will be expensive, but it will ultimately save more French lives."
 FRA_land_air_coordination: "Land-air Coordination"
 FRA_land_air_coordination_desc: "Land-air coordination is vital to any joint task force operation. Without ground forces, we cannot push the frontlines; without air, we cannot expect efficient fire support. Therefore, we should push to better coordinate between the air war and the ground war."
 FRA_the_mirage: "미라주 (Mirage) 전투기"
 FRA_the_mirage_desc: "The Mirage has become one of those iconic fighters for the French Air Force. It is used in service by nine other countries in the world and is an imported fighter by many."
 FRA_maritime_fighters: "해상 전투기"
 FRA_maritime_fighters_desc: "우리 공군과 해군 모두의 개선을 위해서는 더 효율적인 해군 전투기가 필요합니다."
 FRA_lafayette_class: "라파예트급 (Frégate Légère Furtive)"
 FRA_lafayette_class_desc: "The Frégate Légère Furtive class frigates were designed in the late 1980s to replace ageing destroyers. The ships are light, multi-purpose vessels well suited to defence roles in the French fleet."
 FRA_de_gaulle_class: "드골급"
 FRA_de_gaulle_class_desc: "The De Gaulle Class Aircraft Carrier is the tenth aircraft carrier made for service in the French navy. It is also the only nuclear-powered aircraft carrier outside of the USN, making it a formidable and strong carrier."
 FRA_amx_10: "AMX-10"
 FRA_amx_10_desc: "The AMX-10 is a light recon tank for the French army. The AMX boasts an impressive speed of 85 km/h on ideal terrain. Needless to say, the AMX moves fast as hell."
 FRA_vbci: "보병전투차량 (VBCI)"
 FRA_vbci_desc: "The VBCI was developed to replace the ageing AMX-10P, entering service by 2008. The VBCI has many improvements, including being faster than the speedster AMX by having a max speed of 100km/h. However, the VBCI sacrifices the big boi gun in favour of a lighter armament and higher speeds."
 FRA_forward_air_bases: "전방 공군 기지"
 FRA_forward_air_bases_desc: "To prepare for any outcome, we must build up our forward air bases to ensure properly staged offensive or defensive plans."
 FRA_mirage_2000d: "미라주 2000D"
 FRA_mirage_2000d_desc: "The Mirage 2000D is a run-of-the-mill attack plane that has served us faithfully since its conception. Pushing for future and better planes will only honour the Mirage's legacy."
 FRA_carrier_fighters: "라팔 마린"
 FRA_carrier_fighters_desc: "라팔 마린은 라팔 전투기의 함재기형입니다. 이 전투기는 개발 원형과 유사한 체급입니다. 전반적으로, 이 전투기는 제해권을 차지하기 위한 전투에서의 괴수입니다."
 FRA_med_naval_bases: "지중해 해군 기지"
 FRA_med_naval_bases_desc: "코르시카는 발전된 해군 기지를 갖출 최고의 입지를 지닌 영토입니다. 본토와 분리되어 있으면서도 비교적 방어가 용이합니다."
 FRA_triomphant_class: "트리옹팡급"
 FRA_triomphant_class_desc: "The Triomphant class submarines were built to supersede earlier boats and are now the fundamental portion of the ocean-going branch of the nuclear deterrent forces."
 FRA_ifv_investment: "보병전투차 (IFV) 투자"
 FRA_ifv_investment_desc: "Investing in better IFVs and other forms of light armour vehicles should be able to help us boost our military and economy!"
 FRA_national_arms_exports: "국가 무기 수출"
 FRA_national_arms_exports_desc: "France has become a major defence industry player, and we should continue this path."
 FRA_the_space_program: "The Space Programme"
 FRA_the_space_program_desc: "Space is a new frontier, and as of recently we have proven that we can learn many great things from space! It is worth reestablishing confidence in our space programme."
 FRA_floreal_class: "플로레알급급"
 FRA_floreal_class_desc: "프로레알급은 프랑스 함대의 주력 경호위함입니다. 프로레알급과 그 후속함들은 대함, 해군-육군 지원, 대공, 본격적이지는 않은 대잠수함 능력을 갖춘 다목적 전투함입니다."
 FRA_laredoubtable_class: "Le Redoutable Class"
 FRA_laredoubtable_class_desc: "The Redoutable class submarines are some of the oldest submarines in service by the French navy. However, they are not to be doubted as they are pivotal in French nuclear deterrent naval strategies."
 FRA_honour_and_fidelity: "\"영광과 충성\" (Honneur et Fidélité)"
 FRA_honour_and_fidelity_desc: "The motto of the French legion resonates well with our country. The military embodies these values in particular: honour in both what they do, and fidelity through their undying faithfulness to the French homeland."
 FRA_cnes_budgeting: "프랑스 국립우주연구센터 (CNES) 예산 지원"
 FRA_cnes_budgeting_desc: "CNES is the main portion of the French space programme. We should allow budgeting for the CNES so we can continue to push and stay competitive in this new frontier."
 FRA_international_space_research: "국제 항공우주 산업 주도"
 FRA_international_space_research_desc: "우리는 이 개척지로 향하기 위해 미국과 같은 다른 나라들과 협력해야 합니다!"
 FRA_kourou_launch_pad: "쿠루 (Kourou) 발사대"
 FRA_kourou_launch_pad_desc: "Kourou in French Guiana is both a strategic space launch location and direct territory owned by us. We can also broker deals with other space agencies about them using this excellent location."
 FRA_french_space: "프랑스 우주 확장"
 FRA_french_space_desc: "우주에서의 우위는 우주에서 얻을 자원과 이득을 위해 필수적입니다."
 FRA_francosphere: "프랑스어권 (Francosphere)"
 FRA_francosphere_desc: "France has been practising a method of neocolonialism since the end of World War II. While not directly occupying these nations' lands, France has been a puppet master pulling the strings in its favour. However, with the start of the twenty-first century, many are willing to reduce their dependence on Paris as a source of leadership. Therefore, it is now time for France to act accordingly."
 FRA_francafrique: "프랑사프리크 (Françafrique)"
 FRA_francafrique_desc: "Africa was once one of the pillars of our former colonial empire. The nations of the former Françafrique must continue to follow our lead into the new century. We should investigate the best way to help them and maintain our influence over the region."
 FRA_faction_the_paris_accord: "파리 협정 (The Paris Accord)"
 FRA_house_of_bonaparte_crowned: "보나파르트가 왕위를 거머쥐었습니다!"
 FRA_a_peaceful_rise_flag: "평화 외교 정책"
 France_news.99.t1: "왕의 귀환"
 France_news.99.t2: "황제의 귀환"
 France_news.99.d1: "The Royal House of Bourbon has returned to the royal residence in Versailles, once built by their ancestor Louis XIV, to once more take up the rulership of France.\n\nKing [FRA.GetLeader] has promised a new and grand age for France and the world. \"The rightful rulers of France and the protectors of Western Europe have returned to their rightful place.\" was the ending clause of his speech - which was immediately criticised as jingoistic and over-entitled by other European leaders and French republicans."
 France_news.99.d2: "The self-styled 'Imperial House' of Bonaparte, the descendants of the self-crowned Emperor Napoleon I Bonaparte (1769-1821), have returned to Versailles. While Napoleon (and his descendants) always had been popular in France, they were less so abroad - both with foreign nobles and foreign commoners.\n\nThe recent jingoistic rhetoric by [FRA.GetLeader], who recently ascended as Emperor of the French, has been called into question by the leaders of Germany, Britain, Italy, and Russia. The new rulers of France have few friends.\n\nTogether with the new ruling system, France had unveiled a new flag: The same as the old, but flown with red by the hoist - a call back to the French Revolution, when a similar flag was flown shortly before the first Bonapartist Empire."
 France_news.99.o1: "국왕 폐하 만세!"
 France_news.99.o2: "황제 폐하 만세!"
 France_news.99.o3: "이럴수가."
 france_md.11.t: "CNES - NASA 협력"
 france_md.11.d: "CNES leaders have approached us to discuss extended cooperation between NASA and the CNES. They believe there is much to learn from space, and combining the resources of two large space programmes could benefit us both significantly. The proposed agreement states that each side would front $10 billion to pursue greater scientific ties."
 france_md.11.a: "충분히 가치있는 조약이다"
 france_md.11.b: "안된다"
 FRA_french_space_decision_category: "The French Space Programme & CNES"
 FRA_french_space_decision_category_desc: "Space: The Final Frontier. We must begin to conquer this frontier in earnest if we are to remain a Great Power in the eyes of the world, but we can only achieve this at great cost. As we can't be sure of any real economic benefits of a large-scale space programme, the French people must remain convinced that it is a worthwhile venture!\n§RIf our Space Programme Enthusiasm falls below 35, space operations will cease!§! Furthermore, each week our §Y Space Programme Enthusiasm§! will fall by §Y0.1§! due to general disinterest in the §YCNES§!\n\n\nOur Space Programme Enthusiasm is currently: [?FRA.FRA_peoples_support|+50.0] \nWeekly Income from §YSpace Operations & Actions§!: $[?FRA.FRA_space_income_var|+3]b"
 FRA_run_support_campaigns_short: "단기간의 민간 지원 캠페인 시작"
 FRA_run_support_campaigns_short_desc: "If our top scientists are only beginning to unlock the scientific wonders that lie in space, then our people must be incredibly confused at the whole ordeal. A short social media campaign should give us some support!"
 FRA_run_support_campaigns_long: "장기간의 민간 지원 캠페인 시작"
 FRA_run_support_campaigns_long_desc: "만약 우리의 최고 과학자들이 우주에 있는 과학적 경이로움을 풀기 시작했다면, 국민들은 그 시련에 대해 엄청나게 혼란할 것입니다. 세밀한 교육 캠페인을 통해 우리는 사람들로부터 놀라울 정도의 지지를 받을 것입니다!"
 FRA_launch_commercial_satellite: "상업 인공위성 발사"
 FRA_launch_commercial_satellite_desc: "Now that the age of information is in full swing, private companies are practically falling over each other to launch satellites. By allowing some of these companies to launch from our facilities, we should bring in some reasonable economic benefits. Be aware, however, that the people may begin to tire of our commercial-focused programme!"
 FRA_prep_international_space_station: "ISS 발사 준비"
 FRA_prep_international_space_station_desc: "Whilst a global achievement and initiative, we can prepare to send our supply rockets to the ISS, along with our personnel."
 FRA_french_iss_launch: "프랑스 국제우주정거장 (ISS) 발사"
 FRA_french_iss_launch_desc: "After months of planning and preparation, our supply shuttle mission is ready to launch. Three. Two. One. Blast-off!"
 FRA_french_space_TT: "§RThe effect of this focus will be revealed when the time is right§!"
 FRA_international_space_nasa_TT: "§G이 거래는 프랑스와 미국 양측 모두에게 10.0 x10억의 비용이 요구됩니다§!"
 fra_has_enough_space_support_tt: "We have sufficient §YSpace Programme Enthusiasm§! to conduct this operation."
 france_focus: "프랑스 중점 계통도"
 FRA_idea_the_francosphere: "프랑스어권"
 FRA_idea_the_francosphere_desc: "프랑스어권은, 프랑스어를 사용하는 국민과 국가들로 이루어진, 글로벌 공동체 입니다. 이는 프랑스가 구 프랑스 식민지에 대한 영향력을 유지하는 하나의 수단이지만, 동시에 프랑스어권 국가들 간의 협력체로도 기능하고 있습니다"
 FRA_idea_french_armored_production: "French Armoured Vehicles"
 FRA_idea_central_decentral: "관료적 개혁"
 FRA_idea_the_french_military: "개혁된 군대"
 FRA_idea_the_french_military_desc: "수년간 군이 무질서에 빠지도록 방치한 끝에, 우리는 마침내 노후한 군을 개혁하기 위해 스스로를 다그쳤습니다. 이제 프랑스가 얕볼 수 없는 나라이자 벗으로 삼을 만한 나라임을 더욱 강하게 알릴 수 있을 것입니다!"
 FRA_idea_reformed_cnes: "CNES(프랑스 국립 우주 연구센터) 개혁"
 FRA_idea_cnes_failing: "CNES (프랑스 국립우주연구센터) 예산 부족"
 FRA_idea_prep_the_launch: "발사 준비"
 FRA_idea_space_research: "우주 연구 개발"
 FRA_idea_nasa_partnership: "CNES - NASA 파트너십"
 FRA_the_french_agriculture: "Granary of Europe"
 FRA_the_french_agriculture_desc: "France is the largest agricultural producer in the Union and draws the largest share of the Common Agricultural Policy. The FNSEA speaks for the farms and the Paris farm show is where politicians go to be seen. Good soil is a strategic holding, and it should be worked like one."
 FRA_the_vineyard_industries: "The Appellations"
 FRA_the_vineyard_industries_desc: "The appellation system policed by the INAO is what separates Bordeaux, Burgundy and Champagne from every imitation abroad. Moet Hennessy sells the result in every market on earth. No advertising budget buys a reputation of that kind."
 FRA_the_dairy_industry: "Lactalis and the Cooperatives"
 FRA_the_dairy_industry_desc: "Lactalis and Danone buy from the Sodiaal cooperative and from herds across Normandy and the Jura. Comte and Camembert carry protected names, and what does not go to the cheesemakers goes into powders, yoghurts and infant formula sold worldwide."
 FRA_wheat_industry: "Wheat from the Beauce"
 FRA_wheat_industry_desc: "The Beauce plain is the granary of France, and its harvest moves by rail to Rouen, the largest grain export port in Europe. Buyers across North Africa and the Near East depend on those cargoes arriving, which is a form of influence no embassy can match."
 FRA_mechanized_agriculture: "The Machinery Cooperatives"
 FRA_mechanized_agriculture_desc: "Shared machinery cooperatives put combines and balers within reach of farms that could never buy them outright. Kuhn implements from Saverne, Manitou handlers and satellite-guided harvesters are already in the fields. The engineering behind them is worth developing at home."
 FRA_packaging_industries: "Sidel and Verallia"
 FRA_packaging_industries_desc: "시델은 식품 산업이 돌아가는 데 필요한 병입 및 포장 라인을 노르망디에서 만들고, 생고뱅에서 분사한 베랄리아는 유리를 공급합니다. 프랑스에서 만들고 재활용이 가능하게 만든 포장재는 가치 사슬이 국경에서 끊기는 일을 막아 줍니다."
 FRA_agriculture_industry: "The Agri-Food Giants"
 FRA_agriculture_industry_desc: "다논, 락탈리스, 벨, 봉뒤엘은 수확물을 어느 시장에서나 가격을 지키는 브랜드 수출품으로 바꿉니다. 우리 자신을 먹여 살리는 것은 최소한의 기준입니다. 잉여분을 파는 것이 수익입니다."
 FRA_improved_railways: "Reseau Ferre de France"
 FRA_improved_railways_desc: "프랑스 철도망공사는 모든 SNCF 열차 아래의 선로를 소유하므로, 그 위에 무엇이 건설될지는 국가가 결정합니다. 알스톰의 신호 체계와 새로운 고속 노선 측량이 차세대 철도망의 윤곽을 결정짓는 곳입니다."
 FRA_focus_on_rails: "벨포르의 철도 차량"
 FRA_focus_on_rails_desc: "알스톰은 벨포르에서 기관차를, 라로셸에서 객차를 만들며, 주요 노선용 2층 고속 열차와 크레팽의 지역 열차 편성도 생산합니다. 지금 발주하면 그 공장들이 계속 가동되고 철도 차량이 계속 나올 것입니다."
 FRA_high_speed_rail_lines: "The LGV Europeenne"
 FRA_high_speed_rail_lines_desc: "동쪽으로 스트라스부르와 라인강까지 이어지는 고속선은 우리 철도망을 독일까지 뻗게 하며, 탈리스와 유로스타는 이를 영불 해협 터널로 이어 줍니다. 세계 철도 속도 기록은 프랑스 선로 위에 서 있습니다. 지도가 국경에서 멈추어야 할 이유는 없습니다."
 FRA_luxury_goods: "LVMH and Kering"
 FRA_luxury_goods_desc: "LVMH, 케링, 에르메스, 샤넬은 해외 누구도 흉내 내지 못한 업종을 지배하고 있으며, 콜베르 위원회는 그 뒤의 장인 기술을 지킵니다. 방돔 광장과 몽테뉴 거리는 그 자체로 상품이 되는 주소입니다. 하우스들은 파리에 남아 있으며, 본사도 그래야 합니다."
 FRA_tourism_industry: "Atout France"
 FRA_tourism_industry_desc: "아투 프랑스는 세계에서 가장 많은 관광객이 찾는 나라를 홍보하며, 수입이 이를 증명합니다. 루브르, 에펠탑, 디즈니랜드 파리는 도시가 더는 감당하지 못할 인파를 끌어들이고 있으며, 주민들은 이를 공개적으로 말하기 시작했습니다."
 FRA_the_gorgeous_coasts: "해안 보전청"
 FRA_the_gorgeous_coasts_desc: "해안 보전청은 노르망디의 코트 플뢰리에서 코르시카의 절벽, 코트다쥐르, 페이드라루아르의 대서양 해변에 이르기까지, 개발되기 전에 해안선을 사들입니다. 접근이 가능해진 이 해안들은 도시의 부담을 덜어 줍니다."
 FRA_the_spaces_between: "라 프랑스 프로퐁드"
 FRA_the_spaces_between_desc: "푸아티에 외곽의 퓌튀로스코프는 내륙의 들판 하나가 수백만 명을 끌어들일 수 있음을 입증했습니다. 리무쟁의 고원, 랭스의 포도원과 대성당, 사부아의 알프스 휴양지도 같은 자격을 갖추었으면서 붐비지 않습니다. 이들에게 없는 것은 연결이며, 철도가 외면한 마을들은 영원히 기다려 주지 않을 것입니다."
 FRA_beaches_of_france: "Deauville to Biarritz"
 FRA_beaches_of_france_desc: "노르망디의 상륙 해변, 비아리츠의 서핑 해안, 코트 도팔의 드넓은 모래사장은 파리에는 발도 들이지 않는 방문객들을 끌어들입니다. 계절과 지역에 걸쳐 분산되면 이 산업은 일 년 내내 사람을 고용하며 누구도 이를 못마땅해하지 않습니다."
 FRA_energy_sector: "The Messmer Plan"
 FRA_energy_sector_desc: "메스메르 계획은 론강, 라인강, 해협을 따라 원자로를 세웠고, 이제 전력망의 4분의 3이 핵분열로 돌아갑니다. EDF, 프라마톰, 원자력청이 이를 건설했고 지금도 운영합니다. 해외의 어떤 카르텔도 프랑스 전력의 가격을 정하지 못합니다."
 FRA_renewable_investments: "론강의 댐"
 FRA_renewable_investments_desc: "론강 국립회사는 강을 따라 이어진 댐 사슬을 운영하며, 그 위로는 세르퐁송과 알프스 양수 발전소가, 오베르뉴 전역에는 트뤼에르 댐들이 있습니다. 랑스 조력 발전소는 누구도 이를 재생 에너지라 부르기 훨씬 전부터 돌아가고 있었습니다. 연료 시장이 어떻게 되든 물은 계속 떨어집니다."
 FRA_solar_investments: "미디의 태양광"
 FRA_solar_investments_desc: "프로방스의 선벨트와 론강 하류 계곡은 북쪽이 부러워할 수밖에 없는 햇빛을 받으며, EDF 르누블라블이 이미 그곳에 발전 단지를 짓고 있습니다. 오들로의 태양로는 패널이 값싸지기 훨씬 전부터 그 물리학을 입증해 왔습니다. 비용은 많이 들지만 고갈되지 않습니다."
 FRA_wind_investments: "트라몽탄 회랑"
 FRA_wind_investments_desc: "북부 평원에는 지평선에서 지평선까지 풍력 발전 단지가 펼쳐져 있고, 대서양 발전 단지용 나셀은 생나제르와 르아브르에서 조립됩니다. 오드를 따라 불어 내리는 트라몽탄 바람은 프랑스 최초의 터빈을 돌렸고 수십 년 전에 그 타당성을 입증했습니다. 바람은 돈이 들지 않으며 멈추지도 않습니다."
 FRA_the_northern_reactors: "슈 원자로"
 FRA_the_northern_reactors_desc: "슈 원자로는 아르덴의 뫼즈강변에 서 있고, 하류 센강변에는 노장이 있으며, 둘 다 국경을 가로지르는 강에서 냉각수를 끌어옵니다. 그곳에 완전히 개량된 2개 호기를 두면 북부 전력망을 한 세대 동안 확보할 수 있습니다. 계획이 공개되는 순간 브뤼셀과 베를린이 불평할 것입니다."
 FRA_improved_nuclear_waste_management: "라 아그와 뷔르"
 FRA_improved_nuclear_waste_management_desc: "라 아그는 사용 후 핵연료를 혼합 산화물로 재처리하고, 마르쿨은 재사용할 수 없는 것을 처리하며, 나머지를 위해 뷔르에 심층 처분장이 굴착되고 있습니다. 폐기물은 반대자들이 가장 잘 써먹는 논거이니, 우리가 반드시 답해야 할 문제입니다."
 FRA_expanded_enrichment_facilities: "조르주 베스 II"
 FRA_expanded_enrichment_facilities_desc: "트리카스탱 부지의 조르주 베스 II에서 이루어지는 원심분리 농축은 가동하는 데 원자로 한 기분의 전력을 먹던 확산 시설을 대체합니다. 국내에서 농축한다는 것은 외국 공급자에게 빚지지 않는 연료를 뜻합니다."
 FRA_the_new_energy_dawn: "유럽의 빛"
 FRA_the_new_energy_dawn_desc: "연계선은 영국, 이탈리아, 스페인, 독일로 잉여 전력을 실어 나르며, 프랑스는 대륙 최대의 순수출국으로 서 있습니다. 이웃 나라들은 우리 전력망에 필요 없는 전기에 대가를 지불합니다."
 FRA_honour_homeland_valour_discipline: "명예, 조국, 용맹, 규율"
 FRA_honour_homeland_valour_discipline_desc: "프랑스 해군의 표어는 군에서 복무한다는 것이 무엇을 뜻하는지 이상의 것을 드러냅니다. 우리 국민은 조국과 하나이며, 명예와 용맹으로 가득 차 있고, 용기에 규율을 갖추고 있습니다."
 FRA_the_levant_problem: "레반트 문제"
 FRA_the_levant_problem_desc: "레반트는 종종 간과되는 프랑코스피어의 한 부분입니다. 이 지역은 한때 프랑스 제국에 귀중한 곡물, 과일, 기름을 제공했습니다."
 FRA_antagonize_syria: "Antagonise Syria"
 FRA_antagonize_syria_desc: "Syria under the al-Assads has made far too many wrong decisions. We should destabilise the regime and start to help encourage Syria toward our ideology and depose the dictators."
 FRA_supporting_armenia: "아르메니아를 지원하자"
 FRA_supporting_armenia_desc: "Armenia is a newcomer to the Francosphere but they are a strategic ally nonetheless. The struggles of the nation remind us much of our own and we must support Armenia in her struggles in the Karabakh."
 FRA_anti_assad_regime_message: "아사드 정권 반대 메시지"
 FRA_anti_assad_regime_message_desc: "Although we have been broadly antagonistic against Syria, it is now time we become blatant and no longer tiptoe around what we truly mean. Syria's leadership under the Assads has taken a turn for the worse and we must continue to state our disdain for the al-Assads."
 FRA_escalation_from_the_damascus_spring: "다마스커스 봄으로부터의 확대"
 FRA_escalation_from_the_damascus_spring_desc: "다마스커스의 봄이 본격화되었습니다. 이제 시리아와 중동 전역의 민주주의 운동에 대한 지지를 계속 보내는 것이 매우 중요합니다."
 FRA_collaboration_with_the_fsa: "시리아 반군과의 협력"
 FRA_collaboration_with_the_fsa_desc: "반군은 알-아사드 가문에 맞서기 위해 상당한 자원을 필요로 할 것입니다. 우리는 시리아를 앞으로 이끌 수 있는 그룹에 무엇을 제공할 수 있을지, 우리의 옵션을 살펴봐야 합니다."
 FRA_oil_and_gas_investments: "석유 및 가스 투자"
 FRA_oil_and_gas_investments_desc: "레반트 지역은 특히 상당한 양의 석유와 가스 매장량을 보유하고 있습니다. 이 지역의 석유와 가스 산업에 자원과 인력을 투자하는 것은 영구적으로 유리할 것입니다."
 FRA_reminder_of_the_taif_agreement: "타이프 협정의 상기"
 FRA_reminder_of_the_taif_agreement_desc: "The Taif Agreement, officially known as the National Reconciliation Accord, was reached to signify the end of the Lebanese Civil War and bring about a return to normalcy. We must remind Lebanon and the Middle East about the agreements of Taif and look to put an end to Hezbollah."
 FRA_root_out_hezbollah: "헤즈볼라 근절"
 FRA_root_out_hezbollah_desc: "헤즈볼라는 레바논, 타이프 협정, 그리고 지역의 평화에 대한 직접적인 도전입니다. 헤즈볼라를 근절하는 것은 중동에서 평화를 구축하는 첫 번째 단계 중 하나입니다."
 FRA_agriculture_works_in_the_levant: "레반트에서의 농업 활동"
 FRA_agriculture_works_in_the_levant_desc: "레반트 전역에서 다양한 농업 투자에 나서는 것은 가치가 있을 것입니다. 이 지역에 대한 대부분의 외국적인 생각과는 달리, 이 지역은 잠재력으로 가득 차 있습니다. 많은 농작물들이 레반트의 풍부한 해안이나 시리아의 강 유역에서 자랄 수 있습니다. 우리는 이 지역에서의 투자를 탐색하고 레반트의 농업 잠재력을 발휘하는 데 도움을 주어야 합니다."
 FRA_francophone_solidarity: "프랑스어권 연대"
 FRA_francophone_solidarity_desc: "This was an initiative that aimed to promote French-speaking culture and French values among Francophone nations. The initiative included greater access to education for lower-income nations and economic support for developing ones, with the hope that they would gain and build upon the foothold they had retained since post-decolonisation. In African nations specifically, France participated actively in supporting partnerships between African nations that maintained its influence and generated profitable gains."
 FRA_continue_cold_war_mentality: "냉전적 사고방식 반복"
 FRA_continue_cold_war_mentality_desc: "Many among the public and the international community believe our status as a global power is fading. We must maintain our position as a leading global nation at any cost. Returning to old methods will not be popular internationally, but action must be taken. The criticism will fade in time."
 FRA_NEPAD_development: "아프리카 발전을 위한 새로운 파트너십 개발"
 FRA_NEPAD_development_desc: "The New Partnership for Africa's Development (NEPAD for short) is an economic development programme developed by the African Union with partners from the European Union, Japan, other G8 members and China. We are especially interested in the development of NEPAD and have taken a focal point of being the main backer of the development monetarily and politically from the European Union. We should look at helping extend the development and increasing the funding and support for the programme to help all of Africa."
 FRA_CFA_Reforms: "CFA 개혁"
 FRA_CFA_Reforms_desc: "Addressing the CFA is one of our biggest concerns. With influence draining over time, we are forced into the position of reform to keep a neocolonial empire alive. Some of our reforms are targeted towards increased autonomy within the banking system. Easier use of monetary funds and exchange controls."
 FRA_introduce_the_eco: "ECO를 소개"
 FRA_introduce_the_eco_desc: "We must detach the CFA Franc from our hold and remove the dependency of our former colonies on us. The ECO is the proposed new currency that should allow the West African nations some degree of economic autonomy and cooperation amongst the new nations who've adopted it. We should look to support them in their endeavor to create a new common currency and potentially convince all of former French Africa to utilise this new currency."
 FRA_unrestricted_subjugation: "제한 없는 예속"
 FRA_unrestricted_subjugation_desc: "Our actions have only been ones of exploitation & extraction. But now we should reconsider our position on this stance and whether we should rethink our diplomatic stance and enter a new phase of governance and control. The choice will not be a popular one but it is only made in the interests of a nation and its global status."
 FRA_intervention_in_africa: "프랑사프리크 개입주의"
 FRA_intervention_in_africa_desc: "우리의 이전 식민지 소유지에는 지원이 필요합니다. 이제 우리는 이 지역에 개입하고 필요한 곳에 군사 지원을 제공하는 추가 정책을 추진할 때입니다."
 FRA_sahel_region: "사헬 지역"
 FRA_sahel_region_desc: "The Sahel region is a prospect for mining and resource extraction, and a frontier for French geopolitical positioning and corporate interests. With the growing extremism of the new millennium, we must act to guarantee the safety of French assets and nationals in the region. Jihadist insurgency is spreading across the Sahel, threatening our interests there. We must take the initiative to protect our position and root out this threat at any cost required."
 FRA_afrique_centrale: "중앙아프리카"
 FRA_afrique_centrale_desc: "The heart and soul of Africa, Afrique Centrale is covered in countless natural wonders and a vast wealth of resources and potential, much of it still untapped."
 FRA_CAR_intervention: "상가리스 작전"
 FRA_CAR_intervention_desc: "상가리스 작전은 중앙아프리카 공화국 내전에 대한 제안된 작전 및 개입의 별칭이다."
 FRA_operation_artemis: "아르테미스 작전"
 FRA_operation_artemis_desc: "제2차 콩고 전쟁이 본격적으로 벌어지면서, 프랑스와 다른 유럽 국가들은 우간다 군의 철수 후 콩고 동부 지역에 자율적인 개입을 시작했습니다. 이는 유럽연합의 외교 및 군사 공동 작전에서 중요한 전환점을 의미했습니다."
 FRA_resources_prospects: "자원 전망"
 FRA_resources_prospects_desc: "The naturally rich regions of Sub-Saharan Africa are full of resources, and French companies already benefit from many partnerships there. With growing demand for these resources, we must take the initiative and invest in our assets abroad to secure our foothold and hold it well."
 FRA_oef_hoa: "OEF - 아프리카의 뿔"
 FRA_oef_hoa_desc: "The Somali Civil War has simply raged on long enough. We must intervene on behalf of the Somali government to help them reclaim their war-torn country and assist the Somali government in their efforts to stabilise their country."
 FRA_operation_licorne: "리콘느 작전"
 FRA_operation_licorne_desc: "리콘느 작전(Operación Licorne)는 코트디부아르 내전 중 새로운 코트디부아르 군(Forces Nouvelles de Côte d'Ivoire)과 코트디부아르 군(Forces Armées de Côte d'Ivoire) 사이의 충돌에 대응하여 프랑스 평화 유지군이 배치된 임무 명칭입니다."
 FRA_the_second_ivory_coast_civil_war: "제2차 코트디부아르 내전"
 FRA_the_second_ivory_coast_civil_war_desc: "The Second Ivorian Civil War was the second armed conflict stemming from the supporters of Laurent Gbagbo and the president-elect Alassane Ouattara. The conflict between the two escalated to a full-scale conflict. We should intervene to help stabilise the conflict before it gets out of hand."
 FRA_Industrial_expansion: "산업 확장"
 FRA_Industrial_expansion_desc: "우리의 이전 식민지 국가들은 절실하게 경제 부흥이 필요합니다. 주로 농업 사회는 이 지역에 투자 기금을 투입하여 경제에 약간의 혜택을 줄 수 있습니다."
 FRA_educational_development: "교육 개발"
 FRA_educational_development_desc: "이전 식민지 지배 지역에 교육 자금을 제공하면 그곳 주민의 교육 수준이 높아지고, 결과적으로 생산성이 향상되는 데 도움이 될 것입니다."
 FRA_operation_serval: "오페르 방르"
 FRA_operation_serval_desc: "오페르 방르(Operación Serval)는 말리 내전 동안 프랑스와 말리 주도의 개입을 위한 명칭으로, 이 지역의 이슬람 극단주의자들에 대한 첫 번째 충돌 단계로서의 역할을 했습니다."
 FRA_French_pillar_of_counterterrorism: "디테러의 기둥"
 FRA_French_pillar_of_counterterrorism_desc: "우리의 반테러 및 반극단주의 세력은 세계적으로 유명해졌으며, 우리는 전 세계적으로 디테러의 중심이자 얼굴이 되었습니다."
 FRA_the_french_foreign_legion: "프랑스 외인부대"
 FRA_the_french_foreign_legion_desc: "The French Foreign Legion is an elite corps of the French Army that consists of a variety of specialties. Having been formed in 1831 by then King Louis-Philippe it was intended to allow foreign recruits a place amongst French forces. As such the Legion is a multi-ethnic and multi-cultural fighting force that is world-renowned for the discipline and esprit de corps."
 FRA_sahel_support_initiative: "사헬 지원 이니셔티브"
 FRA_sahel_support_initiative_desc: "The military forces of the Sahel are often underequipped. It is possible we could reorganise some resources their way either fiscally or militarily to help strengthen our position in Africa."
 FRA_sahel_officer_training: "사헬 장교 교육"
 FRA_sahel_officer_training_desc: "사헬 지역 국가들의 군대는 더 효과적인 전투력을 발휘하기 위해 추가적인 훈련이 필요합니다. 우리는 이 지역의 동맹국 군대에 투자하고, 그들의 장교 수준을 향상시키기 위한 방안을 모색해야 합니다."
 FRA_takuba_task_force: "타쿠바 특무부대"
 FRA_takuba_task_force_desc: "타쿠바 태스크포스(Takuba Task Force)는 프랑스, 말리, EU, 미국 군대 간의 공동 작전 시리즈로, 말리 내전 동안 이슬람 극단주의자들과의 싸움을 이어가기 위한 목적을 가지고 있었습니다. 우리는 이 지역의 안정성을 보장하기 위해 말리에서 다시 한 번 개입을 시작하는 것이 전략적 목표입니다."
 FRA_haitian_coup: "아이티 쿠데타"
 FRA_haitian_coup_desc: "Jean-Bertrand Aristide continues to be a thorn in the side of our country. The demand for reparations is reprehensible. It may be in our interest to look at finding Haiti new leadership of sorts."
 FRA_repeal_the_ordiance: "조례를 철회하라"
 FRA_repeal_the_ordiance_desc: "The 1825 Ordinance of Charles X should be repealed to help normalise Haitian-French relations. The 1825 Ordinance is the cause and the reason for the Haitian independence payments that were carried out for nearly three-quarters of a century. It is time we repeal this ancient piece of legislation as one of our first steps to reconciliation."
 FRA_senegalese_civil_war: "세네갈 내전"
 FRA_senegalese_civil_war_desc: "The Senegalese Civil War has kicked off as a localised conflict with the recent elections. Senegal is important as a coastal nation for bringing material from the interior and north to France. Intervention in the region is a must to continue our ambitions in Africa."
 FRA_returning_to_indochina: "인도차이나로의 귀환"
 FRA_returning_to_indochina_desc: "Indochina was once the pinnacle of the French far-east holdings until the Vietnamese independence wars. It is time to return to Indochina perhaps not as a coloniser but this time as a friend. Our interests in the region with the rise of China have marked it as an area of utmost importance."
 FRA_former_indian_colonial: "인도양 문제"
 FRA_former_indian_colonial_desc: "인도양에서 프랑스의 보유지와 프랑스어를 사용하는 국가들은 원치 않는 외국의 영향력을 저지하고 대응하는 데 전략적으로 중요합니다. 이제 우리는 이 중요한 지역으로 돌아가, 투자와 기타 전략적 개선을 함께 가져오는 준비를 해야 할 때입니다."
 france_md.100.t: "아르메니아 지원"
 france_md.100.d: "Armenia's struggle against Azerbaijan in Artsakh reminds us much of ourselves. Supporting them in their efforts is not only desired but also needed for our interests in the region. We can provide material, financial, or political support in their conflict. How should we help our friends in Yerevan?"
 france_md.100.a: "아르메니아를 정치적 지원하기"
 france_md.100.b: "아르메니아를 재정적으로 지원하기"
 france_md.100.c: "아르메니아를 군사적으로 지원하기"
 france_md.101.t: "프랑스의 지지!"
 france_md.101.d: "프랑스는 우리가 스스로를 확립하기 위해 계속되는 투쟁에 지원을 보내기로 결정했습니다. 아제르바이잔과의 갈등과 터키 문제는 계속해서 우리를 괴롭히고 있지만, 이제 우리는 유럽에 동맹을 맺었습니다."
 france_md.101.a: "Another move in the right direction"
 france_md.102.t: "제1차 코트디부아르 내전"
 france_md.102.d: "제1차 코트디부아르 내전이 본격적으로 시작되었습니다. 분쟁은 맹렬히 이어지고 있으며 잦아들 기미가 없습니다. 한때 프랑사프리크의 보석이었던 이 나라는 대립하는 양측 사이의 살육장으로 변했습니다. 나라가 스스로를 찢어 놓는 가운데 이 지역의 안정은 위태로운 균형 위에 놓여 있습니다. 어느 쪽이 우리의 현재 이익에 가장 부합합니까?"
 france_md.102.a: "로랑 그바그보를 지지한다"
 france_md.102.b: "기욤 소로를 지지한다"
 france_md.102.c: "제3 세력을 지지한다"
 france_md.103.t: "제2차 코트디부아르 내전"
 france_md.103.d: "제2차 코트디부아르 내전이 FNC와 [CDI.GetName] 정부 사이에서 한창 진행 중입니다. 분쟁은 대통령 선거 후에 시작되었는데, 그바그보는 와타라가 공정하고 자유로운 선거에서 승리했음에도 퇴진을 거부했습니다. 어느 쪽이 우리의 현재 이익에 가장 부합합니까?"
 france_md.103.a: "로랑 그바그보를 지지한다"
 france_md.103.b: "알라산 와타라를 지지한다"
 france_md.104.t: "아르테미스 작전"
 france_md.104.d: "유럽 연합이 제안한 이투리 개입인 아르테미스 작전은 콩고 민주공화국에 평화 유지군을 배치할 것입니다. 우리 정부의 많은 인사들은 프랑스가 유럽 연합의 군사 행동을 이끌기를 원합니다. 우리는 참여 세력 가운데 누구를 지지할지 선택할 수 있습니다. 르완다와 [RWA.GetLeader]은(는) 강력한 동맹이 될 수 있으나, 동부에 기반을 두고 있고 나라 전체의 통제를 추구하지는 않습니다. [UGA.GetLeader]와(과) [RCD.GetName]도 또 다른 선택지이지만 대부분 북부 일대에 위치해 있습니다. 현재 집권 중인 정부인 킨샤사를 지지하는 것도 언제든 가능하며, 가장 안전한 선택일 수 있습니다. 누구를 지지하시겠습니까?"
 france_md.104.a: "콩고민주공화국 지원"
 france_md.104.b: "우간다 지원"
 france_md.104.c: "르완다를 지지한다"
 france_md.105.t: "세네갈 내전"
 france_md.105.d: "세네갈 내전이 훨씬 더 넓은 분쟁으로 확대된 것은 관련된 모두에게 뜻밖의 일이었습니다. 카자망스 문제와 선거 조작 의혹이 겹치면서 아프리카의 또 다른 나라가 불안정해졌습니다. 우리의 선택지는 목표에 따라 크게 달라집니다. 우리는 [SEN.GetLeader]와(과) 그 정부, 반군 세력, 혹은 카자망스 주민을 지원할 수 있습니다. 어느 쪽을 택하든 세네갈이 이 지역에서 스스로 새로운 미래를 열도록 도울 것입니다."
 france_md.105.a: "세네갈을 지원한다"
 france_md.105.b: "반군을 지원한다"
 france_md.105.c: "카자망스를 지원한다"
 france_md.106.t: "상가리스 작전"
 france_md.106.d: "우리나라의 국민의회와 군은 중앙아프리카 공화국의 새로운 분쟁에 대응하여 이 나라에 대한 새로운 개입을 제안했습니다. 상가리스 작전으로 알려진 이 제안된 작전은 내전 중인 세력 가운데 하나를 지원하기 위해 우리 군을 투입하게 됩니다. 이 분쟁에서 누구를 지지하시겠습니까?"
 france_md.106.a: "중앙아프리카 공화국을 지원한다"
 france_md.106.b: "UFDR을 지원한다"
 france_md.106.c: "셀레카를 지원한다"
 france_md.106.d1: "로곤 지원"
 france_md.106.e: "중앙아프리카 반정부 기독교 민병대 지원"
 france_md.107.t: "세르발 작전"
 france_md.107.d: "세르발 작전은 말리에서 벌어진 투아레그 반란에 대한 대응으로 국민의회에 제안되었습니다. 세르발은 현재 [MAL.GetName] 정부와 [MAL.GetLeader]을(를) 지원하기 위해 프랑스군을 배치하는 방향으로 짜여 있습니다. 원한다면 외교 정책을 바꾸어 투아레그의 대의를 지원하는 선택지도 있습니다. 분쟁에서 어느 편을 위해 개입해야 하겠습니까?"
 france_md.107.a: "말리 정부를 지원한다"
 france_md.107.b: "투아레그를 지원한다"
 france_md.108.t: "타쿠바 특무부대"
 france_md.108.d: "이슬람 반군이 [MAL.GetAdjective] 정부와 투아레그 세력 양쪽 모두에 맞서 싸우기 시작했습니다. 세르발 작전은 한동안 진행 중이지만, 우리는 이전에 지원했던 세력에 추가 지원을 통합하거나 급진적으로 방향을 바꾸어 말리의 새로운 후원 대상을 지원할 수 있습니다. 앞으로 어느 세력을 지원하시겠습니까?"
 france_md.108.a: "말리 정부를 지원한다"
 france_md.108.b: "투아레그를 지원한다"
 france_md.108.c: "안사르 딘을 지원한다"
 france_md.109.t: "아이티 쿠데타"
 france_md.109.d: "아이티 정부의 집권 세력은 현재 우리에게 우호적이지 않습니다. 집권당이 세우고 있는 선례는 우리의 외교 정책에 이롭지 않습니다. 쿠데타를 부추기고 야권을 지원하는 것은 나머지 식민지들이 식민지 시절의 잘못에 대한 배상을 우리에게 요구하기 시작하지 않도록 하는 최선의 방안 가운데 하나입니다."
 france_md.109.a: "쿠데타를 부추긴다"
 france_md.109.b: "반군을 지원한다"
 france_md.350.t: "우리를 레바논에서 몰아내는 프랑스!"
 france_md.350.d: "정교한 외교적 압박과 경제적 유인책 캠페인을 통해 프랑스인들은 레바논에서의 우리 입지를 체계적으로 약화시켰습니다. 그들의 영향력 공작은 기대 이상의 성공을 거두었습니다. 현지 정치인들은 이제 공공연히 우리의 철수를 요구하고 있으며, 레바논 정부는 우리가 주둔을 철수할 것을 공식 요청했습니다. 이는 굴욕적인 좌절이지만, 어쩌면 돌이킬 수 없는 것은 아닐 수 있습니다. 우리 영향력을 되찾으려 시도할 수도 있으나, 그럴 경우 국제적 분쟁의 위험을 감수해야 합니다."
 france_md.350.a: "쥐새끼 같은 놈들! 대가를 치르게 해 주마!"
 france_md.350.b: "영유권을 행사한다"
 france_md.355.t: "주민들 사이에 반란 의식을 심는 프랑스"
 france_md.355.d: "프랑스인들은 레바논 주민들 사이에 자신들의 혁명 이념을 퍼뜨리느라 분주했습니다. 파리의 자금을 받는 시민사회단체들이 민주적 개혁, 투명성, 자유 선거를 요구하고 있습니다. 시위 운동은 베이루트와 그 너머에서 힘을 얻고 있습니다. 이 사태를 신속히 억제하지 못하면 프랑스 공화주의 원칙에서 영감을 받은 전면적인 봉기에 직면할 수도 있습니다."
 france_md.355.a: "이번엔 아팠다"
 france_md.360.t: "프랑스의 에너지 투자 제안"
 france_md.360.d: "프랑스의 에너지 거대 기업 토탈에너지스가 우리 석유 및 가스 매장량을 개발하기 위한 포괄적인 제안을 가지고 우리 정부에 접근했습니다. 이 거래는 막대한 외국인 투자와 기술 전문성을 가져오고 수천 개의 일자리를 창출할 것입니다. 그러나 일부 국내 비판자들은 프랑스 자본을 받아들이면 우리 경제 정책에 대한 파리의 영향력이 커질 것이라고 주장합니다. 조건은 유리하지만, 우리의 주권을 얼마나 내어주게 될까요?"
 france_md.360.a: "경제적 이익이 위험보다 크다"
 france_md.360.b: "우리의 자원을 외국의 이해관계에 팔 수는 없다"
 france_md.400.t: "북부 레바논에 대한 프랑스의 개발 원조"
 france_md.400.d: "프랑스개발청은 도로 개선, 수처리 시설, 통신망을 포함한 북부 레바논 대규모 기반시설 계획을 제안했습니다. 이 지역은 오랫동안 방치되어 왔으며, 프랑스의 투자는 현지 생활 수준을 바꿀 수 있습니다. 어떤 이들은 이를 프랑스와 레바논의 역사적 유대에서 비롯된 진정한 인도주의적 관심으로 보지만, 다른 이들은 전략적으로 중요한 지역에서 프랑스의 영향력을 확대하려는 계산된 행보로 봅니다."
 france_md.400.a: "이 협력은 우리 국민에게 이익이 될 것이다"
 france_md.400.b: "우리는 스스로 기반시설을 개발하는 쪽을 선호한다"
 france_md.401.t: "남부 지역에 대한 프랑스의 기반시설 구상"
 france_md.401.d: "프랑스는 수년간의 분쟁과 방치로 크게 고통받은 남부 레바논의 주요 기반시설 사업에 자금을 대겠다고 제안했습니다. 이 제안에는 병원, 학교, 전력망 현대화가 포함되어 있습니다. 인도주의적 필요는 부인할 수 없으나, 남부에 프랑스가 주둔하는 것을 받아들이면 서방의 어떤 개입도 의심의 눈초리로 바라보는 다른 지역 강국들과의 관계가 복잡해질 수 있습니다."
 france_md.401.a: "남부는 이 투자가 절실히 필요하다"
 france_md.401.b: "정치적 문제가 너무 크다"
 france_md.402.t: "프랑스의 산업 투자 계획"
 france_md.402.d: "프랑스 기업들이 레바논 제조업에 대한 상당한 투자를 제안하고 있으며, 수천 명의 국민에게 일자리를 제공할 공장을 세우겠다고 약속합니다. 청년 실업은 지속적인 위기였으며, 이 일자리들은 우리나라의 인재를 빼앗아 가는 이민의 물결을 막는 데 도움이 될 수 있습니다. 그러나 프랑스 자본에 대한 산업 의존은 주로 파리에 이익이 되는 방향으로 우리 경제를 재편할 수 있습니다."
 france_md.402.a: "지금은 일자리가 우선이다"
 france_md.402.b: "우리 자체의 산업 기반을 발전시켜야 한다"
 france_md.403.t: "레바논에 대한 프랑스의 인도주의 사절단"
 france_md.403.d: "우리의 계속되는 위기에 대응하여, 프랑스는 의약품, 식량 원조, 기술 지원을 제공하는 인도주의 사절단을 파견하겠다고 제안했습니다. 프랑스 NGO와 정부 기관들이 현지 당국과 협력하여 구호 활동을 조율할 것입니다. 마크롱 대통령은 양국 국민 사이의 깊은 역사적·문화적 유대를 거론하며 레바논을 위한 국제적 지원을 직접 호소했습니다. 이 원조는 절실히 필요한 구호를 제공할 수 있으나, 취약한 시기에 프랑스의 가시성과 영향력을 높이기도 합니다."
 france_md.403.a: "이 지원을 감사히 받아들인다"
 france_md.403.b: "우리 일은 우리가 처리할 수 있다"
 france_md.500.t: "뤼미오 공격"
 france_md.500.d: "뤼미오의 작은 코뮌이 코르시카 민족해방전선의 공격을 받았습니다. 이 공격으로 인명 피해는 없었으나, 코뮌 내 소규모 군사 기반시설에 상당한 피해가 발생했고 헌병 여러 명이 부상을 입었습니다."
 france_md.500.a: "A troubling incident, nothing more"
 france_md.501.t: "마르세유 호텔 공격"
 france_md.501.d: "마르세유에서 일련의 소규모 폭탄 공격이 발생했습니다. 코르시카 민족해방전선이 이 공격의 배후를 자처했습니다. 이 사건으로 여러 명이 입원하고 부상을 입었으나, 다른 호텔에 추가 폭탄 공격을 가할 의도는 없는 것으로 보입니다."
 france_md.501.a: "우리는 위협에 굴하지 않는다"
 france_md.504.t: "맥도날드 폭탄 테러"
 france_md.504.d: "소수의 브르타뉴 민족주의자들이 브르타뉴 케베르에 있는 현지 맥도날드를 폭파하기로 했습니다. 폭탄이 터져 맥도날드 안에서 한 명이 사망했습니다. 진행 중인 수사는 더 큰 음모의 증거를 별로 내놓지 못했으나, 여전히 비극적인 사건입니다."
 france_md.504.a: "무의미한 인명 손실"
 FRA_balance_the_cnes_budget: "CNES 예산 재조정"
 FRA_balance_the_cnes_budget_desc: "우리 우주 계획인 CNES는 과거에 비효율적인 지출과 소규모 부패 문제를 겪은 바 있습니다. 국가 감사관들을 투입하여 과도한 지출을 억제하고, CNES가 절실히 필요로 하는 긍정적 평판을 얻도록 해야 합니다."
 FRA_invest_LEB_decision_category: "프랑스-레바논 투자"
 FRA_invest_LEB_decision_category_desc: "레바논은 한때 우리의 식민지였으며, 따라서 우리가 이 지역으로 돌아가 위대한 나라 [LEB.GetNameWithFlag]에 투자하는 것은 필수적입니다."
 FRA_LEB_invest_infrastructure_south: "남레바논에 투자"
 FRA_LEB_invest_infrastructure_south_desc: "남부 레바논의 경제를 발전시키면 이 지역의 급진화를 막는 데 도움이 될 수 있습니다. 이 지역의 경제적 기회가 많을수록 결국 관련된 모든 당사자에게 더 이롭습니다."
 FRA_LEB_invest_infrastructure_north: "북레바논에 투자"
 FRA_LEB_invest_infrastructure_north_desc: "레바논의 경제적 중심지는 거의 언제나 베이루트와 그 주변 지역을 중심으로 형성되어 왔습니다. 이 나라의 북부를 확장하고 이에 투자하면 훌륭한 수익을 얻을 것입니다."
 FRA_LEB_invest_civilian_factory: "레바논 민간산업에 투자"
 FRA_LEB_invest_civilian_factory_desc: "레바논은 민간 산업에 추가 투자를 받을 필요가 있습니다. 이러한 산업을 발전시키면 레바논의 경제 발전에 더욱 도움이 되고 세계 무대에서 더 자급자족할 수 있게 될 것입니다."
 FRA_LEB_financial_help: "레바논에 재정 지원 제공"
 FRA_LEB_financial_help_desc: "레바논의 예산 부족분 등을 메울 수 있도록 재정 지원을 제공해야 합니다."
 FRA_french_africa_decision_category: "프랑사프리크/아프리카 결정"
 FRA_french_africa_decision_category_desc: "아프리카와 프랑사프리크는 우리에게 종종 동의어일 수 있습니다. 아프리카 대륙은 우리의 도움과 보살핌을 필요로 하며, 따라서 우리는 아프리카를 우리 외교 정책과 이해관계의 초점으로 계속 삼아야 합니다."
 FRA_invest_in_NEPAD_education_decision: "NEPAD 교육 프로그램에 투자"
 FRA_invest_in_NEPAD_education_decision_desc: "NEPAD 교육 프로그램은 추가 자금과 지원이 필요합니다. 늘어난 재원은 우리가 부담하며, 아프리카 국가들은 교육 지출 비용이 더욱 줄어드는 혜택을 보게 됩니다."
 FRA_invest_in_NEPAD_healthcare_decision: "NEPAD 보건의료 프로그램에 투자"
 FRA_invest_in_NEPAD_healthcare_decision_desc: "NEPAD 보건의료 프로그램은 추가 자금과 지원이 필요합니다. 늘어난 재원은 우리가 부담하며, 아프리카 국가들은 보건의료 지출 비용이 더욱 줄어드는 혜택을 보게 됩니다."
 FRA_invest_in_NEPAD_social_care_decision: "NEPAD 사회복지 프로그램에 투자"
 FRA_invest_in_NEPAD_social_care_decision_desc: "NEPAD 사회복지 프로그램은 추가 자금과 지원이 필요합니다. 늘어난 재원은 우리가 부담하며, 아프리카 국가들은 사회복지 지출 비용이 더욱 줄어드는 혜택을 보게 됩니다."
 FRA_invest_in_NEPAD_economic_program_decision: "NEPAD 경제 프로그램에 투자"
 FRA_invest_in_NEPAD_economic_program_decision_desc: "NEPAD 경제 프로그램은 추가 자금과 지원이 필요합니다. 늘어난 재원은 우리가 부담하며, 아프리카 국가들은 생산성과 건설 속도가 향상되는 혜택을 보게 됩니다."
 FRA_extend_the_NEPAD_program_decision: "NEPAD 프로그램 연장"
 FRA_extend_the_NEPAD_program_decision_desc: "이 프로그램은 연장되어야 합니다. 프로그램을 계속 유지하기 위해 추가 자금을 투입할 수 있습니다."
 FRA_space_enthusiasm_effect_tt: "우리의 §Y우주 계획 열기§!가 [?temp_change|1+]만큼 변화합니다 (현재: [?FRA.FRA_peoples_support|1Y])"
 FRA_space_income_effect_tt: "우리의 §Y우주 계획 주간 수입§!이 [?temp_change|3+]만큼 변화합니다 (현재 주간 수입: $[?FRA.FRA_space_income_var|Y3+])"
 FRA_nepad_cost_increase_cost_effect_tt: "$FRA_idea_nepad_modifier$의 주간 비용이 [?temp_change|-3]만큼 변화합니다 (현재: $[?FRA.FRA_nepad_sponsor_weekly_cost|-3]b)"
 FRA_nepad_program_counter_currently_tt: "NEPAD 프로그램이 현재 진행 중입니다 (남은 일수: [?AFRICA_nepad_focus_FRA:days_left|Y0])"
 FRA_cfa_franc_influence_gain_TT: "§Y[FRA.GetNameWithFlag]§!의 영향을 받을 때 $foreign_influence_defense_modifier$이(가) §Y10%§! 감소합니다\n"
 FRA_cfa_franc_custodian_idea_TT: "추가 수입: $$[?additional_income_FRA_cfa_franc_custodian|+]\n"
 FRA_idea_Light_for_Europe_income_TT: "추가 수입: $$§G2.00§!"
 FRA_expansion_tooltip_TT: "§Y이 중점들은 공산주의 또는 민족주의 트리를 완료하기 전까지 실제 효과를 나타내지 않습니다.§!\n"
 FRA_french_canadian_TT1: "§Y프랑스가 캐나다 정부를 도운 결과 프랑스계 캐나다인의 만족도가 상승합니다.§!\n"
 FRA_french_canadian_TT2: "§Y프랑스가 퀘벡인을 지지한 결과 프랑스계 캐나다인의 만족도가 하락합니다.§!\n"
 FRA_idea_development_investment_tt: "§C[FRA.GetNameWithFlag]§!의 투자에 대해 $investment_cost_modifier$ 및 $investment_duration_modifier$을(를) §G5%§! 보정합니다\n"
 FRA_idea_administrative_reforms: "행정 개혁"
 FRA_idea_administrative_reforms_desc: "프랑스의 관료 기구는 일련의 중요한 개혁을 거쳐 비용 일부를 줄이는 동시에 다양한 신규 정책을 입안하고 시행하는 정부의 능력을 확대했습니다."
 FRA_idea_french_armored_production_desc: "프랑스 장갑 차량은 세계 최고 수준의 전투 차량에 속합니다. 새로운 세계적 위협의 부상에 맞서기 위해 우리의 우위를 계속 유지하고 장갑 차량 생산을 지속해야 합니다."
 FRA_idea_central_decentral_desc: "파리와 지방 사이의 권한이 다시 정해지고 있으며, 이양되는 모든 사안은 성과를 내기 전까지 비용과 시간이 듭니다."
 FRA_idea_military_improvement_army: "군 개혁 - 육군"
 FRA_idea_military_improvement_army_desc: "수많은 개혁 중 첫 번째가 육군을 우선으로 시작되었습니다. 우리는 육군이 우리나라의 국경과 동맹국의 국경을 지킬 수 있기에 가장 중요하다고 판단했습니다."
 FRA_idea_military_improvement_navy: "군 개혁 - 해군"
 FRA_idea_military_improvement_navy_desc: "수많은 개혁 중 첫 번째가 해군을 우선으로 시작되었습니다. 우리 해군은 핵심적인 보급선을 유지하고, 군사력을 투사하며, 해외 영토를 지키는 데 중요합니다."
 FRA_idea_military_improvement_air_force: "군 개혁 - 공군"
 FRA_idea_military_improvement_air_force_desc: "수많은 개혁 중 첫 번째가 공군을 우선으로 시작되었습니다. 공군은 누구도 하늘로부터 우리나라를 차지하지 못하게 막고 해군과 지상군에게 효과적인 지원을 제공할 수 있기에 선택되었습니다."
 FRA_idea_military_improvement_army_and_navy: "군 개혁 - 육군 및 해군"
 FRA_idea_military_improvement_army_and_navy_desc: "다음 개혁은 육군과 해군에 초점을 맞춥니다. 육군과 해군은 군종 간 협조, 함선의 효과적인 방어, 그리고 지상군과 연계한 해군 전력의 보다 효과적인 운용을 위해 함께 개혁되어야 합니다."
 FRA_idea_military_improvement_army_and_air_force: "군 개혁 - 육군 및 공군"
 FRA_idea_military_improvement_army_and_air_force_desc: "육군과 공군의 합동 전술 훈련과 개선은 우리가 추진할 수 있는 가장 핵심적인 개혁에 속합니다. 두 군종의 상호 연계는 다가올 분쟁에서 우리의 승리를 보장할 수 있으며 또한 보장할 것입니다."
 FRA_idea_military_improvement_air_force_and_navy: "군 개혁 - 공군 및 해군"
 FRA_idea_military_improvement_air_force_and_navy_desc: "공군과 해군은 불가결한 만큼 불가분의 관계입니다. 두 군종을 겨냥한 개선은 유럽과 전 세계에 있는 우리의 이익뿐 아니라 우방, 동맹국, 민간인의 이익도 지킬 수 있게 해 줄 것입니다."
 FRA_idea_space_agency_name: "CNES"
 FRA_idea_space_agency_name_desc: "국립우주연구센터(CNES)는 프랑스 국립 우주 기관의 이름입니다. 1961년 당시 샤를 드골 대통령이 설립하였으며, NASA와 소련의 우주 계획 및 그 후신인 로스코스모스에 이어 세계에서 세 번째로 오래된 우주 기관입니다."
 FRA_idea_reformed_cnes_desc: "국립우주연구센터(CNES)는 프랑스 국립 우주 기관의 이름입니다. 1961년 당시 샤를 드골 대통령이 설립하였으며, NASA와 소련의 우주 계획 및 그 후신인 로스코스모스에 이어 세계에서 세 번째로 오래된 우주 기관입니다. 최근의 예산 변동과 기타 정치적 변화로 CNES는 오늘날 우리가 아는 형태로 개편되었습니다."
 FRA_idea_cnes_failing_desc: "CNES는 지난 한 해 동안 여러 차례 예산 문제를 겪어 이 분야에 대한 큰 반감을 불러일으켰으며, 유럽 연합은 자체적인 우주 기관 등을 제안하고 있습니다."
 FRA_idea_prep_the_launch_desc: "CNES는 현재 우주선 발사를 준비하고 있습니다. 발사 준비가 끝나기까지는 시간이 걸릴 것입니다."
 FRA_idea_space_research_desc: "우주 연구는 우리를 둘러싼 세계를 더 깊이 이해하는 가장 유익한 방법 중 하나입니다. 우주 연구에 집중하면 우리가 적과 경쟁자를 크게 앞서갈 수 있습니다."
 FRA_idea_nasa_partnership_desc: "미국의 우주 기관 NASA와 우리 CNES 사이의 협력은 이익뿐만 아니라 상호 이해관계에 따른 것입니다. 동맹국과 협력을 확대하고 논의하면 전반적인 과학 연구를 개선하고 두 기관이 새로운 개척지로 나아가는 데 도움이 될 것입니다."
 FRA_idea_Light_for_Europe: "유럽의 빛"
 FRA_idea_Light_for_Europe_desc: "잉여 원자력 및 재생 에너지 전력이 연결선을 통해 흘러나갑니다. 이웃 국가들은 자국 전력망이 필요로 하지 않는 만큼의 전력에 대가를 지불합니다."
 FRA_cfa_franc_custodian: "CFA 프랑 관리국"
 FRA_cfa_franc_custodian_desc: "우리는 제2차 세계 대전 이후 프랑의 평가절하로부터 식민지를 보호하기 위해 CFA 프랑을 만들었습니다. 이제 우리는 프랑을 더 이상 사용하지 않지만, 여전히 서아프리카 국가들 통화의 관리국입니다. 그들은 국고 준비금의 절반을 우리에게 맡기고 있으며, 따라서 우리는 그것이 제공하는 자산을 활용할 수 있습니다.\n\n§YCFA 프랑§!을 사용하는 국가들의 §Y총 GDP의 0.5%§!를 §Y추가 수입§!으로 얻습니다. §YCFA 프랑 사용국§!의 현재 §Y총 GDP§!: [?FRA.FRA_cfa_franc_gdp_total]b"
 the_eco: "에코"
 the_eco_desc: "ECO는 ECOWAS 회원국과 서아프리카 통화 지대 국가들 사이에서 제안된 서아프리카 통화였습니다. 프랑스어권 CFA 프랑 사용국들도 이 신통화를 지지하고자 했습니다. 이는 지역을 통화적으로 통합하여 재화의 거래를 더욱 활발하고 쉽게 하며, 각국이 결집할 수 있는 통합된 매개체를 제공합니다."
 FRA_idea_the_french_pillar_of_counterterroism: "대테러의 기둥"
 FRA_idea_the_french_pillar_of_counterterroism_desc: "테러리즘이 증가하고 있으며, 이 흐름을 막고 우리 자신과 유럽, 그리고 피해를 입을 수 있는 모든 이를 보호하는 것은 프랑스 국민인 우리의 몫입니다. 극단주의가 부상하는 시대의 프랑스의 미래는 말뿐만 아니라, 우리나라에 대한 커져 가는 위협에 맞서는 우리 무력의 힘으로 싸워 나가게 될 것입니다."
 FRA_idea_the_french_foreign_legion: "프랑스 외인부대"
 FRA_idea_the_french_foreign_legion_desc: "프랑스 외인부대는 보병, 기병, 공병, 공수부대 등 여러 전문 분야로 구성된 프랑스 육군의 정예 군단입니다. 외인부대는 모든 외국 국적자의 입대를 허용하는 독특한 전투 부대이며 고도로 훈련되어 있습니다."
 FRA_idea_Grand_ambitions: "아프리카에서의 원대한 야망"
 FRA_idea_Grand_ambitions_desc: "아프리카는 차지하기에 무르익었으며, 우리는 앞으로 나아가 새로운 원대한 야망을 선포해야 합니다. 현재의 안전과 모든 프랑스 국민의 미래를 위해 아프리카에서의 입지를 계속 공고히 하는 것이 무엇보다 중요합니다."
 FRA_idea_development_investment: "개발 투자"
 FRA_idea_development_investment_desc: "[FRA.GetNameWithFlag]이(가) 우리의 국가 발전을 돕기 위해 경제 원조를 제공하고 있습니다."
 AFRICA_idea_nepad_modifier: "NEPAD 개발 프로그램"
 AFRICA_idea_nepad_modifier_desc: "아프리카개발을 위한 새로운 파트너십(약칭 NEPAD)은 아프리카 연합이 유럽 연합, 중국, 일본 및 기타 G8 회원국을 파트너로 하여 마련한 경제 개발 프로그램입니다. 우리는 NEPAD의 발전에 각별한 관심을 가지고 있으며, 유럽 연합 내에서 재정적, 정치적으로 그 주된 후원자가 되었습니다. 아프리카 전체를 돕기 위해 프로그램을 연장하고 자금과 지원을 늘리는 방안을 검토해야 합니다.\n\n[FRA.GetNameWithFlag]이(가) 이 프로그램의 주 후원국입니다."
 AFRICA_idea_nepad_modifier_tt: "§Y[FRA.GetNameWithFlag]§!의 영향을 받을 때 $foreign_influence_defense_modifier$이(가) §Y10%§! 감소합니다\n"
 FRA_idea_nepad_modifier: "NEPAD 개발 프로그램 후원국"
 FRA_idea_nepad_modifier_desc: "아프리카개발을 위한 새로운 파트너십(약칭 NEPAD)은 아프리카 연합이 유럽 연합, 중국, 일본 및 기타 G8 회원국을 파트너로 하여 마련한 경제 개발 프로그램입니다. 우리는 NEPAD의 발전에 각별한 관심을 가지고 있으며, 유럽 연합 내에서 재정적, 정치적으로 그 주된 후원자가 되었습니다. 아프리카 전체를 돕기 위해 프로그램을 연장하고 자금과 지원을 늘리는 방안을 검토해야 합니다.\n\n[FRA.GetNameWithFlag]이(가) 이 프로그램의 주 후원국이며, 따라서 현재 이 프로그램의 혜택을 받고 있는 국가들에 대한 외국 영향력 증가 등 추가적인 이익을 얻습니다.\n"
 FRA_idea_nepad_modifier_cost_tt: "AU NEPAD 개발 후원에는 매주 $[?FRA.FRA_nepad_sponsor_weekly_cost|-3]b가 소요됩니다."
 FRA_unrestricted_subjugation_idea: "무제한 정복"
 FRA_unrestricted_subjugation_idea_desc: "우리가 소유했던 식민지들은 우리에게 엄청난 부와 세계 무대에서의 막대한 존경을 가져다주었습니다. 우리는 어떤 면에서 과거의 방식으로 돌아가 다른 나라들에 맞서 우리의 입지를 다시 주장하고, 마땅히 우리의 것이어야 할 것을 지켜야 합니다. 예속은 군사력, 외교적 압박 등 다양한 방법으로 이뤄질 수 있습니다. 그렇게 하는 것을 가로막는 장애물은 반드시 제거되어야 합니다."
 FRA_SYR_anti_assad_regime_message_idea: "반아사드 정권 메시지"
 FRA_SYR_anti_assad_regime_message_idea_desc: "[FRA.GetNameWithFlag]이(가) 시리아 정부에 반대하는 선전을 송출하고 제공하기 시작했습니다. 이 메시지는 정부를 약화시키기 시작했으며 청년층이 우리 지배 계급에 맞서 급진화하는 것을 계속 부추기고 있습니다. 또한 정부가 외세의 영향에 취약하다는 점도 드러내고 있습니다."
 FRA_educational_development_idea: "교육 발전"
 FRA_educational_development_idea_desc: "[FRA.GetNameWithFlag]이(가) 우리나라의 교육 프로그램을 지원하고 있습니다. 교육 발전은 비용의 일부를 덜어 주는 동시에 현재의 교육 수요를 현대화하고 개선할 수 있게 해 줍니다."
 FRA_resource_prospects_idea: "자원 탐사"
 FRA_resource_prospects_idea_desc: "[FRA.GetNameWithFlag]이(가) 경제에 더 많은 발전 방안을 제공할 수 있도록 우리나라의 자원을 탐사하는 일을 현재 돕고 있습니다."
 FRA_SYR_escalation_from_the_damascus_spring_idea: "다마스쿠스의 봄에서 비롯된 확대"
 FRA_SYR_escalation_from_the_damascus_spring_idea_desc: "[FRA.GetNameWithFlag]이(가) 우리나라가 민주화되어야 한다는 선전을 계속 퍼뜨리고 있습니다. 우리가 나라를 안정시키려 노력하는 가운데 이러한 활동은 우리 지도자 [SYR.GetLeader]의 입지를 계속 약화시키고 있습니다."
 FRA_an_aggressive_expansionism_flag: "공격적인 외교 정책"
 FRA_aze_supports_our_enemy: "아르메니아를 지지함"
 FRA_antagonize_syria_opinion: "우리를 적대시함!"
 FRA_haiti_demands_reparations_opinion: "배상금 요구"
 FRA_repealed_the_ordinance_opinion: "칙령 폐지"
 FRA_francophone_solidarity_opinion: "프랑스어권 연대"
 FRA_supported_nepad_development_opinion: "NEPAD 개발 지원"
 FRA_preparing_launch: "프랑스 ISS 발사 준비 중"
 FRA_french_pillar_of_counterterrorism_tt: "§Y대테러 목적§!으로 §Y외국 고문§!을 각국에 파견하면 우리 고문이 §Y고문 대상국§!에 제공하는 보너스가 두 배가 됩니다."
 FRA_leave_eu_tt: "민족주의자의 인기도가 25%를 넘으면 '탈퇴' 확률이 상승합니다."
 france_md.110.t: "마요트 지위 국민투표"
 france_md.110.d: "마요트 주민들은 프랑스 공화국 내에서의 운명을 결정하기 위해 국민투표를 실시하기로 했습니다. 마요트 섬은 1841년 마다가스카르의 전 국왕이 프랑스에 섬을 매각한 이래 프랑스 공화국의 일부였습니다. 현지 주요 인사들은 공식적으로 프랑스 공화국의 일부가 됨으로써 프랑스 공화국 내 자신들의 역할을 공고히 하거나, 프랑스로부터의 독립을 추구하거나, 코모로의 일부가 되기를 모색하고 있습니다. 우리는 어떻게 해야 합니까?"
 france_md.110.a: "국민투표를 허용한다"
 france_md.110.b: "국민투표를 거부한다"
 france_md.110.c: "제한적 자치를 부여하여 놓아준다."
 france_md.111.t: "마요트 지위 국민투표 결과"
 france_md.111.d: "국민투표가 마침내 자연스러운 결말에 이르렀고 결과가 나왔습니다. 마요트의 미래는 이 결과에 달려 있습니다."
 france_md.111.a: "완벽하다."
 france_md.505.t: "KMW-넥스터 합병안"
 france_md.505.d: "프랑스와 독일 정부는 넥스터 시스템즈와 크라우스마파이 베그만을 하나의 프랑스-독일 방위산업 지주회사로 합병하는 계획을 마무리하고 있습니다. 그 결과 탄생할 KANT 컨소시엄은 르클레르와 레오파르트 2 생산 라인을 한 지붕 아래 두고, 공동의 포병 및 탄약 포트폴리오를 구성하며, 미래의 유럽 주력 전차 계획의 토대가 될 것입니다.\n\n각료들은 지분 이전을 진행하기에 앞서 정치적 승인을 원하고 있습니다."
 france_md.505.a: "합병을 승인한다"
 france_md.505.b: "넥스터의 독립을 유지한다"
 TT_FRA_knds_merge_carry_traits: "§Y넥스터에서 이미 완료된 모든 특성은 새로운 KNDS 조직으로 이어집니다.§!"
 france_md.506.t: "아르퀴스: 산업 통합"
 france_md.506.d: "볼보 그룹의 방위 자회사인 르노 트럭 디펜스와 파나르 제너럴 디펜스가 단일 법인으로 합병을 완료했습니다. 새로운 기업 아르퀴스는 르노의 차륜형 기동 플랫폼과 파나르의 정찰 전통을 결합하며, 프랑스를 유럽 장갑차 시장에서 단일한 경쟁자로 자리매김하게 합니다. 두 기존 기업의 생산 노하우, 사업, 변동치가 새 조직으로 이전됩니다."
 france_md.506.a: "프랑스 장갑 기동 분야의 새로운 장"
 france_md.506_tt: "르노와 파나르가 아르퀴스로 합병됩니다"
 FRA_arguus_established: "르노와 파나르가 2018년 아르퀴스로 합병되었습니다"
 france_md.507.t: "에어버스 헬리콥터스가 된 유로콥터"
 france_md.507.d: "오늘부로 유로콥터 그룹은 에어버스 헬리콥터스로 명칭을 바꾸어, EADS의 회전익 사업을 통합 에어버스 정체성 아래로 편입합니다. 마리냔 공장, 도나우뵈르트 공장, 아에로스파시알의 계보를 잇는 생산 라인이 이제 하나의 깃발 아래에서 운영됩니다."
 france_md.507.a: "유럽 회전익 항공기의 새로운 장."
 TT_FRA_airbus_change_carry_traits: "§Y$FRA_eurocopter_manufacturer$에서 이미 완료된 모든 특성은 $FRA_airbus_manufacturer$로 이어집니다§!"
 france_md.508.t: "나발 그룹이 된 DCNS"
 france_md.508.d: "오늘부로 오랫동안 DCNS로 불려 온 역사적인 국영 조병창 해군건조국(Direction des Constructions Navales)이 새로운 명칭인 나발 그룹을 채택하여, 완전한 민간 기업으로의 전환을 알립니다. 로리앙, 셰르부르, 브레스트 조선소가 이제 하나의 깃발 아래에서 운영되며, 핀칸티에리와의 합작 사업 나비리스, 쉬프랑급 잠수함과 FDI 벨라라 호위함을 중심으로 한 새로운 수출 공세도 함께 추진됩니다."
 france_md.508.a: "프랑스 조선업의 새로운 장."
 TT_FRA_naval_takeover_carry_traits: "§Y$FRA_dcn_manufacturer$에서 이미 완료된 모든 특성은 $FRA_naval_group_naval_manufacturer$로 이어집니다§!"
 FRA_nexter_manufacturer: "GIAT 인더스트리즈"
 FRA_nexter_merge: "넥스터는 2015년에 KMW와 합병되었음"
 FRA_nexter_cold_war_legacy: "냉전의 유산"
 FRA_nexter_scorpion_programme: "스코르피옹 계획"
 FRA_nexter_firepower_ammo: "화력 및 탄약"
 FRA_nexter_manufacturer_trait: "카이사르 화력 교리"
 FRA_nexter_manufacturer_trait_desc: "부르주 병기창의 제련소에서 트럭 탑재형 카이사르 곡사포에 이르기까지, 넥스터는 경량 궤도 및 차륜 플랫폼으로 신속하고 정밀한 화력을 투사하는 것으로 명성을 쌓았습니다."
 FRA_nexter_leclerc_programme: "르클레르 계획"
 FRA_nexter_leclerc_programme_desc: "르클레르는 넥스터의 주력 전차로, 1970년대 말부터 개발되어 1992년에 배치되었습니다. 자동장전 장치와 모듈식 장갑은 프랑스 기갑 교리의 기준이 되었습니다."
 FRA_nexter_leclerc_mk2: "르클레르 시리즈 2"
 FRA_nexter_leclerc_mk2_desc: "시리즈 2 개수는 하이브리드 공조 장치, 개선된 전자 장비, 향상된 복합 장갑 패키지를 도입하여 이 플랫폼의 운용 수명을 2020년대까지 연장했습니다."
 FRA_nexter_leclerc_xlr: "르클레르 XLR 현대화"
 FRA_nexter_leclerc_xlr_desc: "XLR 중간 수명 개량은 르클레르를 원격 무장 거치대, 모듈식 장갑 키트, SCORPION 전투 관리 체계 통합을 중심으로 재구성하여 더 새로운 주력 전차 설계들과도 경쟁력을 유지하게 했습니다."
 FRA_nexter_vbci: "VBCI 차륜형 보병전투차"
 FRA_nexter_vbci_desc: "Véhicule Blindé de Combat d'Infanterie는 프랑스군에 최초의 현대식 차륜형 보병전투차를 안겨 주었습니다. 생산은 2008년에 시작되었으며, 이 플랫폼은 차량화 연대의 기갑 기동력의 중추가 되었습니다."
 FRA_nexter_famas: "FAMAS 제식 소총"
 FRA_nexter_famas_desc: "불펍식 FAMAS 돌격소총은 1981년부터 프랑스 보병의 표준 무기로 복무했습니다. 넥스터의 소화기 라인은 그 생산 및 지속적인 지원 계약에서 성장했습니다."
 FRA_nexter_scorpion_core: "스코르피옹 통합 전투"
 FRA_nexter_scorpion_core_desc: "2014년에 공식화된 스코르피옹 계획은 프랑스군의 새로운 차륜형 전투 차량군을 공통 전투 관리 체계와 디지털 기간망 아래 네트워크로 연결했습니다."
 FRA_nexter_griffon: "VBMR 그리퐁"
 FRA_nexter_griffon_desc: "그리퐁은 스코르피옹 차량군의 6륜 다목적 전술 수송차로, VAB를 대체하여 프랑스의 표준 장갑 병력 수송차가 되었습니다."
 FRA_nexter_jaguar: "EBRC 재규어"
 FRA_nexter_jaguar_desc: "재규어 6륜 정찰 전투차는 40mm CTA 포와 아케롱 MP 미사일을 탑재하며, 르클레르에서 검증된 화력 개념을 계승합니다."
 FRA_nexter_serval: "VBMR-L 세르발"
 FRA_nexter_serval_desc: "경량 4륜 세르발은 소형 알루미늄 차체로 스코르피옹의 기동성을 특수부대, 순찰, 지휘 파생형까지 확장합니다."
 FRA_nexter_40cta: "40 CTA 포"
 FRA_nexter_40cta_desc: "CTA 인터내셔널을 통해 BAE 시스템즈와 공동 개발한 40mm 케이스 텔레스코프식 포는 스코르피옹 차량군 전반에 소형이면서 고속인 대장갑 화력을 제공합니다."
 FRA_nexter_caesar: "카이사르 155mm 플랫폼"
 FRA_nexter_caesar_desc: "트럭 탑재형 155mm 카이사르 곡사포는 전략적 기동성과 장거리 정밀 사격을 결합하여 넥스터의 가장 성공적인 수출 야포 플랫폼이 되었습니다."
 FRA_nexter_eurenco: "유렌코 추진제"
 FRA_nexter_eurenco_desc: "유렌코는 프랑스 야포 및 소화기 탄약의 근간이 되는 추진제, 폭약, 고에너지 물질을 공급하며, 넥스터의 생산을 안정적인 상류 공급망에 연결합니다."
 FRA_nexter_nbc_sys: "NBC-Sys 화생방 장비"
 FRA_nexter_nbc_sys_desc: "자회사 NBC-Sys는 프랑스군과 수출 부대를 위한 화학, 생물, 방사능, 핵 탐지 및 제독 장비를 전문으로 합니다."
 FRA_nexter_lu_family: "LU 계열 포탄"
 FRA_nexter_lu_family_desc: "LU211을 비롯한 LU 계열 155mm 포탄은 베이스 블리드와 개선된 공기역학으로 야포의 사거리를 늘리며, NATO 호환 포신 전반의 장거리 사격을 표준화합니다."
 FRA_nexter_bonus: "BONUS 스마트 탄약"
 FRA_nexter_bonus_desc: "BONUS 센서 신관 155mm 포탄은 기갑 종대를 향해 자체 표적 탐지 자탄을 살포하여, 포병 부대가 표준 곡사포로 정밀 대장갑 능력을 갖추게 합니다."
