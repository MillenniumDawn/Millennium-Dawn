 auslink_in_nt: "AusLink на Северной территории"
 auslink_in_nt_desc: "В прошлом система AusLink позволяла оперативно ремонтировать и модернизировать наши региональные дороги. Мы можем повторно использовать эту систему для быстрого улучшения логистических линий в наших северных районах, строительства мостов, маршрутов для тяжелых грузов и сельскохозяйственной инфраструктуры."
 national_partnership_agreement_ast: "Соглашение о национальном партнерстве"
 national_partnership_agreement_ast_desc: "Тесно сотрудничая с коренными общинами Северной территории и Западной Австралии, мы можем решить проблему серьезной перенаселенности, построив сотни новых домов для размещения местного населения. Эти контракты также обеспечат нам поддержку со стороны групп, занимающихся вопросами жилищного строительства, и предоставят работу местным подрядчикам."
 foundation_for_regional_renewal_ast: "Гранты на обновление сельских районов"
 foundation_for_regional_renewal_ast_desc: "Мы можем создать совместное партнерство между федеральным правительством и фондом Сиднея Майера для формирования механизма финансирования местного сельского хозяйства. Гранты будут направляться предприятиям и муниципалитетам малых городов для финансирования общественных залов, сельских систем водоснабжения и сельскохозяйственных проектов."
 grain_line_upgrades_ast: "Модернизация зерновых линий"
 grain_line_upgrades_ast_desc: "Правительства штатов Новый Южный Уэльс и Виктория представили нам планы масштабной модернизации зерновых линий в регионе. Практически все фермеры региона используют эти линии для транспортировки урожая в порты, и модернизация линий может значительно повысить их производительность и снизить зависимость от автомобильного транспорта. В свою очередь, это уменьшит износ дорог."
 grain_lines_upgraded_ast: "Региональная зерновая линия модернизирована."
 mining_indutrialists_opinion_tt: "Минимум §YИндустрия ископаемого топлива§! мнение §R-20§!"
 peter_costello_desc: "Perhaps few in the history of Australian politics are as versed in economic management as Peter Costello. Bouncing between barrister work and legal counseling before landing in the Liberal Party, Costello would advocate for a radical reorganization of the economy. Eventually joining the economic reformist faction of the party, where he would meet the former opposition leader John Howard. \n\nAfter the 1996 election, and as a deputy leader and treasurer in the Howard government, Costello oversaw his rapid reform. As a result, for the first time in over a decade, the budget was in surplus, and together they'd successfully passed the previously 'impossible' reform of the taxation system. \n\nEven as the relationship between the two began to sour, Costello never strayed far from the levers of power. Now, as he handles the greatest lever in the nation, his dreams of economic dominance are barely a step away from reality."
 western_mining_corp_research_ast: "Исследования Западной горнодобывающей корпорации"
