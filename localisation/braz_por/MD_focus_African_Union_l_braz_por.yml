 african_union_peacekeeping_effort_desc: "Os membros da União Africana concordaram em se concentrar em acabar com os vários conflitos armados que ocorrem na África."
 AFRICAN_UNION_shared_focus_create_african_space_agency_desc: "Até agora, a cooperação entre os países africanos no campo dos satélites tem sido limitada. O mais famoso é a Organização Regional de Comunicações por Satélite da África (RASCOM), composta por 45 países, embora tenham conseguido lançar apenas um ou dois satélites. Precisamos criar um empreendimento conjunto para a criação de uma rede de satélites africana."
