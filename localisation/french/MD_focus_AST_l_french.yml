 aus_cyclone.1.t: "Le cyclone Ului frappe le Queensland"
 aus_cyclone.1.d: "L'un des cyclones les plus violents que nous ayons connus a touché terre dans le Queensland, causant d'importants dégâts aux infrastructures et privant d'électricité plus de 60 000 foyers pendant plusieurs jours. Le cyclone a traversé les îles Salomon et a maintenu une intensité de catégorie 3 avant de se dissiper. Grâce aux alertes précoces, la plupart des personnes ont été évacuées à temps ; toutefois, un décès a été signalé.\n\nLes services nationaux d'urgence et les forces de défense australiennes ont depuis été déployés pour réparer les dégâts et rétablir le courant."
 aus_cyclone.1.a: "A tragedy nonetheless."
