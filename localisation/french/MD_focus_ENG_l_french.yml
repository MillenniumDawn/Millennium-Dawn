 ENG_coal_opencast_mining: "Charbon écossais à ciel ouvert"
 ENG_coal_opencast_mining_desc: "De nouvelles fosses à ciel ouvert dans les bassins houillers d'Écosse alimentent en combustible bon marché nos centrales fossiles, leur permettant de tourner plus fort et de produire davantage d'électricité pour le réseau."
 ENG_glasgow_shipbuilding_idea1: "Centre de construction navale de Glasgow"
 ENG_glasgow_shipbuilding_idea1_desc: "L'investissement dans les chantiers de la Clyde a rationalisé conception, soudure et armement, réduisant le coût de production de tous nos navires construits à Glasgow et au-delà."
 ENG_glasgow_shipbuilding_idea1_tt: "§YCoût de construction de tous les navires :§! §G-5%§!"
 ENG_glasgow_shipbuilding_idea2: "Centre de construction navale de Glasgow"
 ENG_glasgow_shipbuilding_idea2_desc: "L'investissement dans les chantiers de la Clyde a rationalisé conception, soudure et armement, réduisant le coût de production de tous nos navires construits à Glasgow et au-delà."
 ENG_glasgow_shipbuilding_idea2_tt: "§YCoût de construction de tous les navires :§! §G-5%§!"
 ENG_highland_main_line: "Ligne principale des Highlands"
 ENG_highland_main_line_desc: "La Highland Main Line modernisée relie Perth et Inverness par des trains plus rapides et plus fiables, aidant les entreprises locales à atteindre marchés, travailleurs et services."
 ENG_crossrail: "Réseau de traverses"
 ENG_crossrail_desc: "La Elizabeth Line relie Heathrow, le West End, la City et Canary Wharf en un seul bassin d'emploi, fluidifiant les trajets, soulageant les lignes saturées et relevant la productivité de l'économie de bureaux londonienne."
 ENG_high_value_manufacturing_zone: "Zone de fabrication à haute valeur ajoutée"
 ENG_hs2_idea: "Haute vitesse 2"
 ENG_northern_powerhouse_rail_idea: "Rail de la centrale électrique du Nord"
 ENG_andrew_digital_enterprise_modifier: "Campagne de numérisation de Royal Enterprise"
 ENG_andrew_digital_enterprise_modifier_desc: "Soutenu par les réseaux de patronage du duc d'York, un nouvel élan vise à relier investisseurs, entreprises régionales et projets technologiques dans un cadre commercial plus moderne. Bureaux de promotion commerciale, forums d'affaires et partenariats privés accélèrent l'adoption du numérique et la visibilité de l'entreprise britannique au pays comme à l'étranger."
 ENG_edward_beach_youth_modifier: "Campagne de sensibilisation des jeunes de Duke"
 ENG_edward_beach_youth_modifier_desc: "Sous le patronage du comte de Wessex, les initiatives d'engagement des jeunes se sont étendues par des programmes de distinctions, des réseaux communautaires et des événements publics dans tout le pays. La campagne insiste sur la confiance, le service civique et les compétences pratiques, renforçant la cohésion sociale tout en encourageant une nouvelle génération à prendre part à la vie nationale."
 ENG_prince_charles: "Charles"
 ENG_prince_charles_trait: "Prince de Galles"
 ENG_charles_1_idea: "Prince de Galles"
 ENG_charles_1_idea_desc: "Charles fut titré prince de Galles en tant qu'héritier apparent du Royaume-Uni. Ce titre, octroyé par lettres patentes et marqué par une investiture formelle, signifiait son statut premier de successeur de la Couronne et son lien durable avec le pays de Galles et les royaumes plus vastes."
 ENG_prince_andrew: "André"
 ENG_prince_andrew_trait: "Duc d'York"
 ENG_andrew_1_idea: "Commandant de la Marine royale"
 ENG_andrew_1_idea_desc: "En tant que commandant de la Royal Navy, Andrew servit avec distinction dans la flotte britannique, y compris comme pilote d'hélicoptère et commandant de navire. Cela reflète son long service actif et son leadership dans les opérations maritimes, et signifie son lien profond avec l'héritage naval du Royaume-Uni."
 ENG_andrew_3_idea: "Duc d'York"
 ENG_andrew_3_idea_desc: "Le titre de duc d'York fut conféré à Andrew en marque de son statut de royal de premier rang et second fils du souverain. Traditionnellement accordé aux cadets du monarque, il porte un prestige historique et de longues associations avec le service royal et le devoir public."
 ENG_princess_anne: "Anne"
 ENG_princess_anne_trait: "Princesse royale"
 ENG_princess_anne_leader_name: "$ENG_princess_anne_trait$ Princesse $ENG_princess_anne$"
 ENG_anne_1_idea: "Princesse royale"
 ENG_anne_1_idea_desc: "Le titre de princesse royale est porté par Anne en marque d'ancienneté et de service exceptionnel au sein de la famille royale. Traditionnellement accordé par le souverain à sa fille aînée, il n'est pas automatique et n'est octroyé qu'à titre d'honneur personnel. Il porte un prestige historique et signale l'attente d'une vie de devoir visible et d'un engagement indéfectible envers la Couronne."
 ENG_princess_anne_naval_trait: "Commandant en chef des femmes de la Royal Navy"
 ENG_princess_anne_army_trait: "Colonel des King's Royal Hussars"
 ENG_prince_edward: "Édouard"
 ENG_prince_edward_trait: "Comte de Wessex"
 ENG_edward_1_idea: "Comte de Wessex"
 ENG_edward_1_idea_desc: "Le titre de comte de Wessex fut accordé à Edward comme distinction royale liée au service et à la responsabilité publique. Tirant d'un nom anglais ancien à forte résonance historique, il porte du prestige sans impliquer d'autorité constitutionnelle. Dans la Grande-Bretagne moderne, il sert de tribune au patronage, à la représentation et au soutien constant de l'œuvre publique de la monarchie."
 ENG_prince_phillip: "Philippe"
 ENG_prince_phillip_trait: "Duc d'Édimbourg"
 ENG_phillip_1_idea: "Duc d'Édimbourg"
 ENG_phillip_1_idea_desc: "Le titre de duc d'Édimbourg fut porté par le prince Philip comme marque déterminante de son rôle aux côtés du souverain et d'une vie de service au royaume. Conféré lors de son mariage avec la princesse Elizabeth, il alliait prestige historique et identité moderne fondée sur le devoir, la discipline et le soutien institutionnel. Dans la vie publique, il s'associa étroitement à ses patronages et au travail concret qui soutint la monarchie de génération en génération."
 ENG_prince_william: "Guillaume"
 ENG_prince_william_trait: "Duc de Cambridge"
 ENG_prince_william_leader_name: "$ENG_prince_william_trait$ Prince $ENG_prince_william$"
 ENG_william_1_idea: "Duc de Cambridge"
 ENG_william_1_idea_desc: "Le titre de duc de Cambridge fut accordé au prince William comme distinction royale marquant son rôle de figure de premier plan de la génération suivante. Traditionnellement conféré par le souverain à des membres éminents de la famille royale, il porte du prestige et une claire attente de représentation nationale et de devoir public. Dans la Grande-Bretagne moderne, il sert de tribune au patronage, au service et à la préparation constante d'un héritier aux responsabilités futures."
