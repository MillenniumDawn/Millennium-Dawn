 ALG_maintain_kabyle_relations: "Поддерживать отношения с Кабилой"
 ALG_maintain_kabyle_relations_desc: "Простая в реализации стратегия взаимодействия с кабильскими общинами, позволяющая предотвратить снижение уровня удовлетворенности. Требует политической власти, но позволяет избежать суровых последствий неудач, характерных для более масштабных реформ."
 ALG_maintain_kabyle_relations_tt: "§GKabyle Удовлетворенность: §! +5\n§YСтабильность: §! +2,0%\n90-дневный период охлаждения."
 AlgeriaFocusNews.100.t: "Касабланская инициатива: налаживание отношений с великими державами"
 AlgeriaFocusNews.100.d: "Алжир решил заручиться поддержкой крупных держав для своей Касабланской инициативы. Это дорогостоящий шаг, но он повышает шансы на благоприятный исход для Африканского союза."
 AlgeriaFocusNews.101.t: "Касабланская инициатива: региональный подход"
 AlgeriaFocusNews.101.d: "Алжир придерживается исключительно регионального дипломатического курса, полагаясь на соседние государства и союзников по Африканскому союзу."
 AlgeriaFocusNews.102.t: "Касабланская инициатива: смешанная стратегия"
 AlgeriaFocusNews.102.d: "Алжир объединит региональные и международные усилия для усиления давления, одновременно хеджируя риски."
 AlgeriaFocusNews.103.t: "Касабланская инициатива: огромный успех"
 AlgeriaFocusNews.103.d: "Касабланская инициатива принесла решающий результат в процессе Африканского союза/ООН. Дипломатическое давление имеет реальный импульс; Алжир находится в сильной позиции, чтобы убедить Марокко отказаться от дипломатических претензий (и, в рамках вашего исследования, от своих ядерных территорий)."
 AlgeriaFocusNews.104.t: "Касабланская инициатива: умеренный успех"
 AlgeriaFocusNews.104.d: "Касабланская инициатива принесла значимый дипломатический результат. Давление на Марокко усилилось; Африканский союз поддерживает инициативу, но не принимает решительных мер."
 AlgeriaFocusNews.105.t: "Касабланская инициатива: скромный результат"
 AlgeriaFocusNews.105.d: "Касабланская инициатива вызвала лишь умеренную симпатию в Африканском союзе. Вам потребуется приложить дополнительные усилия, чтобы добиться существенных уступок."
 AlgeriaFocusNews.106.t: "«Касабланская инициатива»: миссия завершилась по истечении срока"
 AlgeriaFocusNews.106.d: "Прошло время, а существенного результата так и не достигнуто. Дипломатический импульс утрачен."
