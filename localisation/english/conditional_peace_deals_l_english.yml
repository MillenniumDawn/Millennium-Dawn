 CPD_MIL_BASING_BTN: "Military Basing"
 CPD_FULL_PUPPET_BTN: "Full Puppet"

 # Resource Rights Button
 CPD_resource_rights_button_TT: "§YResource Rights§! — siphon a state's resource output"
 CPD_resource_rights_button_TT_DELAYED: "§YResource Extraction Rights§!\n\nGain or concede the §Yresource rights§! on selected states. The state's resource output (oil, steel, aluminium, rubber, tungsten, chromium) flows to the other party instead of its owner.\n\nThe state itself stays under its original owner — no troops move, no borders shift. Only the resources change hands.\n\n§GVP cost§!: state's strategic value × §Y0.15§! (cheapest territorial option).\n[CPD_ai_accept_resource_rights_aversion]\n§GDuration§!: persists until reversed by another peace deal."

 # Military Basing Button
 CPD_military_basing_button_TT: "§YMilitary Basing§! — station troops in their territory"
 CPD_military_basing_button_TT_DELAYED: "§YMilitary Basing Rights§!\n\nGrants §Ymilitary access§! one-way: the §Ydemanding§! side gains access through the other's territory (and vice versa for concessions). The granting side can revoke at any time later.\n\n§GUse when§!: we need a staging ground for a wider conflict, or want to project power without annexation.\n§GAI acceptance§!: §R-25§! to the receiver's acceptance score when demanded.\n[CPD_ai_accept_military_basing_aversion]\n§GDuration§!: persists until access is revoked."

 # Full Country Puppet Button
 CPD_full_puppet_button_TT: "§YFull Puppet§! — subjugate the entire country"
 CPD_full_puppet_button_TT_DELAYED: "§YFull Puppet§!\n\nTurn the §Yentire§! target nation into a §Ysubject state§!. They keep their borders but lose foreign-policy independence — their economy, manpower, and military feed into our faction.\n\nThis term §Rsupersedes§! any state-level puppet demands in the same deal.\n\n§RVery harsh§! — AI acceptance drops by §R-200§! when this is demanded (§R-100§! if the target is already a subject). Realistic only against a near-collapsed enemy or an already-vassalised one.\n[CPD_ai_accept_full_puppet_aversion]\n§GDuration§!: permanent."

 # Ceasefire Button
 CPD_ceasefire_button_TT: "§YCeasefire§! — status-quo peace, locks the current front line"
 CPD_ceasefire_button_TT_DELAYED: "§YCeasefire§!\n\nEnds the war with a §Ystatus-quo peace§!: each side keeps whatever states it currently controls, regardless of original ownership. States change hands at the moment the deal signs.\n\nAfterward, a §Y720-day truce§! (2 years, double the normal length) prevents new wars between us.\n\n§RConflicts with state actions§!: activating ceasefire clears every state-level demand and concession — status-quo peace and territorial demands are mutually exclusive.\n§GAI bonus§!: +40 to receiver's acceptance score when the war has dragged on >18 months and both sides have low surrender progress (mutually attractive stalemate-breaker).\n[CPD_ai_accept_ceasefire_acceptance]\n§GUse when§!: stalemated wars, mutual exhaustion, locking in territorial control quickly."

 # War Reparations Button
 CPD_war_reparations_button_TT: "§YWar Reparations§! — drain their economy for 1 year"
 CPD_war_reparations_button_TT_DELAYED: "§YWar Reparations§!\n\nFor §Y365 days§! (1 year):\n  - The §Ypayer§! transfers §Y0.05%% of their GDP per week§! (~2.6%% over the full year), capped at §Y£15B per week§!\n  - The §Yreceiver§! gains the same amount as additional weekly income\n\n[CPD_reparations_preview]\n\nThe transfer appears as an §Rexpense line§! on the payer's budget and an §Gincome line§! on the receiver's — exactly visible in the money UI.\n\n§RBalance penalties on the payer§!: §R-0.05 Stability§!.\n§GBalance bonus on the receiver§!: §G+0.02 Stability§!.\n\n§GUse when§!: we've won decisively but want lasting economic harm rather than territory; ideal alongside concessions we offer back as a sweetener."
 CPD_reparations_preview_TT: "§GProjected transfer for this deal§!: §Y£[?CPD_rep_preview_temp|.2]B per week§! (~§Y£[?CPD_rep_preview_total_temp|.0]B total over the year§!)"

 # Forced Neutrality Button
 CPD_forced_neutrality_button_TT: "§YForced Neutrality§! — strip their faction membership for 5 years"
 CPD_forced_neutrality_button_TT_DELAYED: "§YForced Neutrality§!\n\nThe target must §Yleave their faction§! immediately on signing and is barred from §Yjoining or creating§! any faction for §Y1800 days§! (~5 years). They also take a §R-0.05 Political Power§! malus during the period.\n\n§GUse when§!: we want to strip an enemy of alliance protection without annexing or puppeting. Devastating against faction-dependent powers (NATO members, CSTO members, etc.).\n§RAI acceptance§!: drops by §R-60§! if the target is in a faction; §R-20§! if neutral already (still some sting because they lose the option to join one).\n[CPD_ai_accept_forced_neutrality_aversion]"

 # Regime Change Button
 CPD_regime_change_button_TT: "§YRegime Change§! — install your exact subideology in the target"
 CPD_regime_change_button_TT_DELAYED: "§YRegime Change§!\n\nForces the target's §Yruling party§! to switch to our §Yexact subideology§! (not just our ideology group — our specific party). Their coalition is wiped, leader is replaced, and elections are configured to allow.\n\nThe target receives the §RPost-War Political Instability§! idea for §Y720 days§! (2 years): §R-0.1 Stability§!, §R-0.2 Political Power§!, §R-0.1 War Support§!.\n\n§RIslamic backlash§!: if the target has Sunni/Shia/Sufi/Ibadi religion and the new government isn't fascism, salafist (fascism) popularity rises §Y+5%%§! as a reactionary backlash against foreign-imposed regime change.\n\n§RAI acceptance§!: drops by §R-80§! when the ideology mismatches; mitigated by §G+30§! if the target's current ruling party is already weak (<40%% popularity).\n[CPD_ai_accept_regime_change_aversion]\n§GDuration§!: permanent (the new government stays until overthrown internally or by another peace deal)."

 # Ideas
 CPD_war_reparations_payer: "War Reparations (Paying)"
 CPD_war_reparations_payer_desc: "We are paying war reparations as a result of a peace deal. A weekly cash transfer appears as an additional expense on our budget for §Y1 year§!."
 CPD_war_reparations_receiver: "War Reparations (Receiving)"
 CPD_war_reparations_receiver_desc: "We are receiving war reparations as a result of a peace deal. A weekly cash transfer appears as additional income on our budget for §Y1 year§!."
 CPD_forced_neutrality_spirit: "Enforced Neutrality"
 CPD_forced_neutrality_spirit_desc: "As a condition of the peace deal, our nation is prohibited from joining or creating military alliances."
 CPD_regime_change_instability: "Post-War Political Instability"
 CPD_regime_change_instability_desc: "A forced regime change has destabilized our political system."

 CPD_peace_deal_explainer_ICON_TT: "How the Peace Deals Work"
 CPD_peace_deal_explainer_ICON_TT_DELAYED: "Constructing a peace deal is as simple as selecting a tab above and then choosing what to concede or demand within a state.\n\nBuilding a peace deal that has a §Ynegative§! cost will likely be accepted by an AI, whereas building a peace deal that has a §Ypositive§! cost is less likely to be accepted. You can see the full breakdown of the AI's willingness to accept a deal by hovering over the acceptance box.\n\nAny peace deal built for a player is not affected by these values."

 # Annex State Localization
 CPD_annex_state_button_TT: "[CPD_ANNEX_STATE_TT_LOC]"
 CPD_annex_state_button_TT_DELAYED: "[CPD_ANNEX_STATE_TT_DELAYED_LOC]"

 CPD_annex_state_button_TT_DEMAND: "Demand States"
 CPD_annex_state_button_TT_CONCESSION: "Concede States"

 CPD_annex_state_button_TT_DELAYED_DEMAND: "§YDemand States§! — directly annex selected enemy states into our nation. We become the new owner; the state's population, factories, and resources transfer to us.\n\n§GVP cost§!: state's strategic value × §Y1.0§!, halved if it's our core, ÷3 if claimed. Doubled if the original owner still controls it (no allied effort)."
 CPD_annex_state_button_TT_DELAYED_CONCESSION: "§YConcede States§! — hand over selected states we own to the enemy. The enemy becomes the new owner.\n\n§GVP value§!: subtracts from the deal cost (the more you concede, the more the AI will accept demands elsewhere)."

 # Make Puppet Localization
 CPD_make_puppet_button_TT: "[CPD_MAKE_PUPPET_TT_LOC]"
 CPD_make_puppet_button_TT_DELAYED: "[CPD_MAKE_PUPPET_TT_DELAYED_LOC]"

 CPD_make_puppet_button_TT_DEMAND: "Create Puppet Government"
 CPD_make_puppet_button_TT_CONCESSION: "Concede Puppet Government"

 CPD_make_puppet_button_TT_DELAYED_DEMAND: "§YPuppet Government§! (demand) — spawn a new subject state out of selected enemy territory. The new puppet inherits the enemy's culture and our exact ruling party (subideology). They keep the states but answer to us in foreign policy.\n\nIf one of our existing subjects has the same core/tag as the rumped state's owner, that subject gets the states instead of spawning a new puppet.\n\n§GVP cost§!: state's strategic value × §Y0.5§!.\n§RBlocked§!: cannot be combined with §YFull Puppet§! (the full-puppet term supersedes individual state puppets)."
 CPD_make_puppet_button_TT_DELAYED_CONCESSION: "§YPuppet Government§! (concession) — allow the enemy to puppet selected states we own. The enemy spawns a subject state from these territories that answers to them.\n\n§GVP value§!: subtracts from deal cost."

 # Demilitarize State Localization
 CPD_demilitarise_state_button_TT: "[CPD_DEMILITARISE_TT_LOC]"
 CPD_demilitarise_state_button_TT_DELAYED: "[CPD_DEMILITARISE_TT_DELAYED_LOC]"

 CPD_demilitarise_state_button_TT_DEMAND: "Demand Demilitarisation of States"
 CPD_demilitarise_state_button_TT_CONCESSION: "Propose Demilitarisation of States"

 CPD_demilitarise_state_button_TT__DELAYED_DEMAND: "§YDemilitarise State§! (demand) — selected enemy states become §Ydemilitarised zones§!: no military units may operate there, the owner cannot build forts or military buildings.\n\n§GUse when§!: securing a strategic border buffer without annexing — useful against neighbours you don't want as a vassal but don't trust to remilitarise.\n§GVP cost§!: state's strategic value × §Y0.25§! (cheap)."
 CPD_demilitarise_state_button_TT__DELAYED_CONCESSION: "§YDemilitarise State§! (concession) — selected states we own become demilitarised. We cannot station or move troops there.\n\n§GVP value§!: subtracts from deal cost."

 # Liberate in State Localization
 CPD_liberate_in_state_button_TT: "[CPD_LIBERATE_TT_LOC]"
 CPD_liberate_in_state_button_TT_DELAYED: "[CPD_LIBERATE_TT_DELAYED_LOC]"

 CPD_liberate_in_state_button_TT_DEMAND: "Liberate States"
 CPD_liberate_in_state_button_TT_CONCESSION: "Grant Independence"

 CPD_liberate_in_state_button_TT_DELAYED_DEMAND: "§YLiberate State§! (demand) — selected enemy states are transferred to the country that holds their §Ycore§!. Priority order:\n  1. An §Yexisting§! country with a core on the state gets it directly.\n  2. If none exists, a §Ydead-tag§! country with a core is revived and given the state.\n  3. If no core-holder exists at all, a new §Ydynamic country§! is spawned from the state owner's tag and given the state as a splinter.\n\n§GUse when§!: dismantling an empire by handing former conquests back to their original owners.\n§GVP cost§!: state's strategic value × §Y0.33§!."
 CPD_liberate_in_state_button_TT_DELAYED_CONCESSION: "§YGrant Independence§! (concession) — selected states we own are released to their core-holding country (existing or revived). We lose them; the recipient gains them.\n\n§GVP value§!: subtracts from deal cost."

