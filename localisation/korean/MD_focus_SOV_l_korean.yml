 sov_economic.43.t: "[From.GetName]와(과) MTS"
 sov_economic.43.d: "[From.GetName]와(과) 우리 기업 MTS가 새로운 협정을 체결하여 우리에게 그 시장에 대한 접근권을 부여했습니다. 이 제휴는 우리 기업의 시가총액을 크게 높일 것으로 기대됩니다."
 sov_economic.43.a: "훌륭하다"
 sov_economic.44.t: "[From.GetName]와(과) 가즈프롬"
 sov_economic.44.d: "[From.GetName]와(과) 가즈프롬이 시장 접근권을 여는 협정을 마무리했습니다. 이 거래는 우리의 시가총액과 시장 입지를 강화할 가능성이 큽니다."
 sov_economic.44.a: "훌륭하다"
 sov_economic.45.t: "[From.GetName]와(과) VTB"
 sov_economic.45.d: "[From.GetName]와(과) VTB가 우리에게 그 네트워크를 통한 시장 접근권을 제공하는 협정에 서명했으며, 이는 우리의 시가총액에 긍정적인 영향을 미칠 것입니다."
 sov_economic.45.a: "훌륭하다"
 sov_economic.46.t: "[From.GetName]와(과) 로스네프트"
 sov_economic.46.d: "[From.GetName]와(과) 로스네프트가 우리에게 그 시장에 대한 접근을 허용하는 협정을 체결했으며, 시가총액에 긍정적인 효과를 약속합니다."
 sov_economic.46.a: "훌륭하다"
 sov_economic.47.t: "[From.GetName]와(과) ALROSA"
 sov_economic.47.d: "[From.GetName]와(과) ALROSA가 이 기업을 통한 시장 접근권을 우리에게 부여하는 협정에 서명했습니다. 이 거래는 우리의 시가총액을 개선할 것으로 기대됩니다."
 sov_economic.47.a: "훌륭하다"
 SOV_promotion_of_unite_with_russia_bulgaria: "§Y[BUL.GetNameWithFlag]§!에서 §Y러시아§!의 이익 증진"
 SOV_georgia_instructors: "§Y[GEO.GetNameWithFlag]§!에 GRU 파견"
