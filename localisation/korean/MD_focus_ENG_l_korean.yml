 ENG_border_poll_cooldown: "최근 국경 투표가 실시되었음"
 ENG_referendum_region_scotland: "스코틀랜드"
 ENG_referendum_region_northern_ireland: "북아일랜드"
 ENG_referendum_region_wales: "웨일스"
 ENG_referendum_region_none: "연합왕국"
 ENG_unionist_campaign_tour: "통합주의 유세 순회"
 ENG_unionist_campaign_tour_desc: "내각을 거리로 내보냅니다. 시청 회의장, 공장 현장, 조선소, 대학 학생회를 선거 운동 기간 내내 매일 찾아가, 런던에서 작성한 보도 자료가 아닌 직접 대면으로 주장을 펼칩니다. 몇 포인트를 움직일 수 있으며, 장관들이 버티는 한 반복할 수 있습니다.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_fiscal_settlement_offer: "재정 합의 제안"
 ENG_fiscal_settlement_offer_desc: "재무부를 개방합니다. 보장된 포괄 보조금, 약속에 그치지 않고 확정된 자본 사업, 재정 배분 공식의 하한선을 투표일 전에 모두 서명합니다. 독립과 가계 재정을 저울질하는 유권자들은 이를 알아차리며, 그 지방의 웨스트민스터 의존도는 파운드 하나하나마다 깊어집니다.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_discredit_separatists: "분리주의 운동 신뢰 훼손"
 ENG_discredit_separatists_desc: "분리주의 지도부에 대해 은밀히 정보를 흘립니다. 그들의 통화 계획, 국경 협정, 재정, 그리고 브리핑이 그런 방향으로 흐른다면 사생활까지. 실패보다 성공하는 경우가 많지만, 실패하면 그들에게 불만과 헤드라인을 안겨 줍니다.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_discredit_separatists_tt: "§G60%§! 확률로 공작이 먹혀들어 탈퇴 지지가 급감합니다.\n§R40%§! 확률로 역효과가 나서 탈퇴 투표와 지역 동요가 모두 상승합니다."
 ENG_further_devolution_pledge: "추가 권한 이양 공약"
 ENG_further_devolution_pledge_desc: "손에 남은 마지막 카드입니다. 잔류에 투표하면 조세, 복지, 방송에 대한 새로운 권한으로 답하겠다는 서명된 공약입니다. 이는 온건한 분리주의 표를 움직이고 한 세대 동안 민족주의 정치의 열기를 식히지만, 다음에 웨스트민스터가 그 지역을 하나로 묶어 두는 데 필요한 수단을 넘겨주는 대가를 치릅니다.\n\n캠페인당 한 번만 공약할 수 있습니다.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_referendum_leave_vote_down_4_tt: "$ENG_integration_vote$: §G+4§!%"
 ENG_referendum_leave_vote_down_6_tt: "$ENG_integration_vote$: §G+6§!%"
 ENG_referendum_leave_vote_down_7_tt: "$ENG_integration_vote$: §G+7§!%"
 ENG_promote_unionism_scotland: "스코틀랜드에서 연합 유지론 전개"
 ENG_promote_unionism_scotland_desc: "선거 기간이 아닌 선거와 선거 사이에 스코틀랜드의 통합주의 정당 현장 조직에 자금을 지원합니다. 선거구 사무소를 열어 두고, 정당이 포기했던 선거구에서 후보를 모집하며, 수년간 아무도 신경 쓰지 않던 곳에서 연합왕국 유지의 논거를 꾸준히 제시합니다. 더디고 눈에 띄지 않지만, 스코틀랜드 민족주의를 낮추는 유일한 방법입니다."
 ENG_scottish_unionism_calm_tt: "스코틀랜드 동요가 §G25§! 미만임 (현재 §Y[?ENG_scottish_agitation|0]§!)"
 ENG_promote_unionism_nireland: "북아일랜드에서 연합 유지론 전개"
 ENG_promote_unionism_nireland_desc: "행진 시즌이 아닌 때에 북아일랜드의 통합주의 시민 조직에 자금을 지원합니다. 경계 지역의 지역 사업, 공동체 간 고용 계획, 국경 문제를 내세우지 않고도 의석을 지킬 수 있는 후보들을 지원합니다. 더딘 작업이지만, 북아일랜드 민족주의를 낮추는 유일한 방법입니다."
 ENG_north_irish_unionism_calm_tt: "종파 간 긴장이 §G25§! 미만임 (현재 §Y[?ENG_north_irish_agitation|0]§!)"
 ENG_promote_unionism_wales: "웨일스에서 연합 유지론 전개"
 ENG_promote_unionism_wales_desc: "웨일스의 통합주의 정당 조직에 자금을 지원합니다. 밸리 지역의 선거구 활동, 웨일스어를 민족주의자들에게 내주지 않는 웨일스어 선거 운동, 그리고 계산이 맞지 않는다는 논변이 아닌 연합에 대한 긍정적 논거를 마련합니다. 더딘 작업이지만, 웨일스 민족주의를 낮추는 유일한 방법입니다."
 ENG_wales_unionism_calm_tt: "웨일스 동요가 §G25§! 미만임 (현재 §Y[?ENG_wales_agitation|0]§!)"
 ENG_convene_constitutional_convention: "헌법 회의 소집"
 ENG_convene_constitutional_convention_desc: "1998년의 헌법적 합의는 나중에 재협상할 것으로 예상한 사람들이 서둘러 작성한 것이며, 그 '나중'이 도래했습니다. 연합왕국의 미래 모습에 관한 초당적 회의를 소집합니다. 권한 이양 정부들, 야당 지도부, 교회, 노동조합이 여섯 달 동안 회의를 열고 내각이 아닌 의회에 보고합니다.\n\n회의 자체는 아무것도 결정하지 않습니다. 그 보고서는 웨스트민스터가 스코틀랜드, 북아일랜드, 웨일스에 영구적 합의를 제시할 수 있는 법적, 정치적 근거이며, 이것 없이는 어떤 합의 제안도 누구에게도 진지하게 받아들여지지 않을 것입니다.\n\n논쟁을 견딜 만큼 안정된 정부가 필요하며, 이미 진행 중인 주민투표나 독립 운동이 없어야 합니다."
 ENG_scottish_union_settlement: "스코틀랜드 연합 합의 제안"
 ENG_scottish_union_settlement_desc: "스코틀랜드 정치가 조용하고, 스코틀랜드 재정이 재무부에 묶여 있으며, 독립 정당들이 가장 약해진 지금, 웨스트민스터는 질문을 받기를 기다리는 대신 스스로 정한 조건으로 스코틀랜드에 헌법 문제를 제시할 수 있습니다. 투표로 승인된 합의는 권한 이양 절차가 영구히 끝나기 위해 웨스트민스터가 얻어야 할 세 건 중 하나입니다. 영국 내 스코틀랜드의 지위는 주민투표 하나하나를 통해 법에 새겨지며, 승리할 때마다 홀리루드는 연합왕국에서 벗어나는 경로에서 멀어집니다.\n\n거부된 합의는 소집에 쓴 비용 외에는 아무것도 바꾸지 못하며, 해당 지역은 다른 합의를 시도하기까지 5년의 대기 기간에 들어갑니다.\n\n승리한 주민투표: §Y[?ENG_scottish_referendum_success|0]§!/§G3§!\n독립 압력: §Y[?ENG_scottish_pressure|0]§!/§G20§!\n스코틀랜드 민족주의: §Y[?ENG_scottish_nationalists|0]§!/§G25§!"
 ENG_scottish_settlement_calm_tt: "스코틀랜드 독립 압력이 §G20§! 미만임 (현재 §Y[?ENG_scottish_pressure|0]§!)"
 ENG_scottish_settlement_ready_tt: "스코틀랜드 민족주의가 §G25§! 미만임 (현재 §Y[?ENG_scottish_nationalists|0]§!)"
 ENG_north_irish_union_settlement: "북아일랜드 연합 합의 제안"
 ENG_north_irish_union_settlement_desc: "분파 무장 세력이 무장 해제되고, 이 지방이 조용하며, 공화주의 정치가 가장 약해진 지금, 웨스트민스터는 스스로 정한 조건으로 북아일랜드에 헌법 문제를 제시할 수 있습니다. 투표로 승인된 합의는 권한 이양 절차가 영구히 끝나고 국경 투표가 연합왕국에서 벗어나는 경로가 되지 않기 위해 웨스트민스터가 얻어야 할 세 건 중 하나입니다.\n\n거부된 합의는 소집에 쓴 비용 외에는 아무것도 바꾸지 못하며, 해당 지역은 다른 합의를 시도하기까지 5년의 대기 기간에 들어갑니다.\n\n승리한 주민투표: §Y[?ENG_north_irish_referendum_success|0]§!/§G3§!\n독립 압력: §Y[?ENG_north_irish_pressure|0]§!/§G20§!\n북아일랜드 민족주의: §Y[?ENG_north_irish_nationalists|0]§!/§G25§!"
 ENG_north_irish_settlement_calm_tt: "북아일랜드 독립 압력이 §G20§! 미만임 (현재 §Y[?ENG_north_irish_pressure|0]§!)"
 ENG_north_irish_settlement_ready_tt: "북아일랜드 민족주의가 §G25§! 미만임 (현재 §Y[?ENG_north_irish_nationalists|0]§!)"
 ENG_welsh_union_settlement: "웨일스 연합 합의 제안"
 ENG_welsh_union_settlement_desc: "웨일스 정치가 조용하고 세네드의 독립 세력이 주변부에 머물러 있는 지금, 웨스트민스터는 다른 누군가가 문제를 제기하기 전에 웨일스의 헌법 문제를 매듭지을 수 있습니다. 투표로 승인된 합의는 권한 이양 절차가 영구히 끝나고 영국 내 웨일스의 지위가 법에 명시되기 위해 웨스트민스터가 얻어야 할 세 건 중 하나입니다.\n\n거부된 합의는 소집에 쓴 비용 외에는 아무것도 바꾸지 못하며, 해당 지역은 다른 합의를 시도하기까지 5년의 대기 기간에 들어갑니다.\n\n승리한 주민투표: §Y[?ENG_welsh_referendum_success|0]§!/§G3§!\n독립 압력: §Y[?ENG_wales_pressure|0]§!/§G20§!\n웨일스 민족주의: §Y[?ENG_wales_nationalists|0]§!/§G25§!"
 ENG_wales_settlement_calm_tt: "웨일스 독립 압력이 §G20§! 미만임 (현재 §Y[?ENG_wales_pressure|0]§!)"
 ENG_wales_settlement_ready_tt: "웨일스 민족주의가 §G25§! 미만임 (현재 §Y[?ENG_wales_nationalists|0]§!)"
 devolution.11.t: "탈퇴에 투표한 [ENG_GetReferendumRegion]"
 devolution.11.d: "개표가 끝났고 결과에는 의문의 여지가 없습니다. 과반수가 연합왕국 탈퇴에 투표했으며, 주민투표를 소집한 정부는 이를 이행할 의무가 있습니다. 국방, 부채, 통화, 국경에 관한 협상이 즉시 시작되며, 첫 번째 조치는 헌법적인 것입니다. 웨스트민스터가 한 세대 동안 양보를 거부해 온 권한의 이양은 이제 주권의 이양이 되었습니다."
 devolution.11.a: "결과를 받아들인다."
 devolution.12.t: "유지되는 연합"
 devolution.12.d: "탈퇴 운동이 패배했습니다. 투표율은 높았고, 격차는 누구도 신빙성 있게 이의를 제기할 수 없을 만큼 분명하며, 투표용지의 명백한 문구에 따라 헌법 문제는 한 세대 동안 종결되었습니다. 분리주의 정당들은 전열을 재정비할 것이고 패배한 운동의 앙금이 가라앉는 데는 수년이 걸리겠지만, 연합왕국은 온전하며 웨스트민스터는 다음번 이러한 요구가 제기될 때 내놓을 답을 갖게 되었습니다."
 devolution.12.a: "한 세대에 한 번."
 devolution.13.t: "합의 승인"
 devolution.13.d: "합의가 가결되었습니다. [ENG_GetReferendumRegion]은(는) 웨스트민스터의 조건에 따라 헌법 문제를 종결하기로 투표했으며, 이 결과는 위임의 일부가 됩니다. 권한 이양 절차가 이곳에서 영구히 끝나기 위해 정부가 이겨야 하는 세 건의 주민투표 중 하나입니다. 민족주의 정당들은 자신들의 유권자가 내놓은 결과에 맞서 항변해야 하는 처지가 되었습니다."
 devolution.13.a: "문제는 해결되었다."
 devolution.14.t: "합의 부결"
 devolution.14.d: "합의가 부결되었습니다. [ENG_GetReferendumRegion]은(는) 이름뿐인 연합의 일부로 남지만, 이 결과는 분리주의 정당들을 고무시키고, 투표를 소집하는 데 쓴 자금과 정치적 자본은 사라졌습니다. 헌법 문제가 마침내 해결될 때까지 이 지역에서 웨스트민스터 통치에 대한 저항이 굳어집니다. 웨스트민스터는 해당 지역의 5년 대기 기간이 끝나면 다시 이 문제를 제기할 수 있습니다."
 devolution.14.a: "값비싼 실수."
