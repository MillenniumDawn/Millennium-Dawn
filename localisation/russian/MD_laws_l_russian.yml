 defence_00: "[military_spending_protest_title_0]"
 defence_00_desc: "Увеличение военных расходов поможет нам расширить наши вооружённые силы и нарастить военную мощь.\n\nДополнительная стоимость определяется размерами нашей военной и военно-морской промышленности. Чем выше наш ВВП на душу населения, тем дороже это обходится. Текущие расчётные расходы по всем законам основаны на текущем объёме доступных людских ресурсов; ваши расходы на оборону могут увеличиться в зависимости от того, сколько ещё людских ресурсов будет мобилизовано.\n[military_spending_protest_TT]"
 defence_00_TT: "\nНа армию тратится $$[?THIS.array_defence_spend^0] §Hмлрд§!.\n"
