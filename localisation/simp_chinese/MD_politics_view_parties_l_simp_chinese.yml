 ZAM.conservatism: "£generic_conservatism_small 赞比亚进步联盟"
 ZAM.conservatism_desc: "保守主义 - 赞比亚进步联盟是赞比亚的一个政党。 它成立于1999年，由六个较小的政党合并而成，主要是赞比亚议程。 2001年才参加议会选举，在没有获得席位且仅获得0.23%的选票后解散。"
 ZAM.liberalism: "£generic_liberalism_small 国家发展联合党"
 ZAM.liberalism_desc: "自由主义 - 国家发展联合党是一个自由主义政党。它由前多党民主运动政客安德森·马佐卡于1998年创建。在2001年的选举中，它成为仅次于民主运动党的第二大党，并在2011年和2016年取得了不错的成绩，以47.63%的总统选票和41.66%的议会选票再次成为第二大党。它主要流行于该国西部地区。"
 ZAM.socialism: "£generic_socialism_small 多党民主运动"
 ZAM.socialism_desc: "社会民主主义 - 多党民主运动是赞比亚的第三方社会民主党。 它最初成立于1990年，旨在推翻以前的社会主义威权政府。 从1991年到2008年，它一直是最受欢迎的政党。在2015年的特别总统选举中，他们惨败，获得的选票不到 1%。"
 ZAM.Western_Autocracy: "£generic_Western_Autocracy_small 穷人党"
 ZAM.Western_Autocracy_desc: ""
 ZAM.anarchist_communism: "£generic_anarchist_communism_small 联合民族独立党"
 ZAM.anarchist_communism_desc: "左翼激进主义 - 联合民族独立党是赞比亚的一个社会主义民族主义政党。 从1964年到1991年，它在肯尼思·卡翁达的总统任期内统治该国，从1973年到1990年，它是唯一的合法政党。它在1991年选举后严重失去影响力，并在1996年没有获得议会席位。它在2001年小幅复苏, 在159个席位中获得13个席位，但从那以后就没有进入政府。"
 ZAM.Conservative: "£generic_Conservative_small 传统党"
 ZAM.Conservative_desc: "反动主义 - 传统党是一个民族主义保守政党。 它成立于2001年，作为分裂和反对 MMD 并在当年的选举中获得4个席位。 它在接下来的选举中失去了所有席位，此后再也没有获得任何席位。 2015年，它最后一次竞选总统。"
 ZAM.Neutral_conservatism: "£generic_Neutral_conservatism_small 民族复兴党"
 ZAM.Neutral_conservatism_desc: "中立保守主义 - 民族复兴党是一个反共保守党。 它成立于2010年，并于2011年首次竞选政府。它从未在议会中获得任何席位，也从未获得高于0.4%的结果。"
 ZAM.Neutral_green: "£generic_Neutral_green_small 民主与发展论坛"
 ZAM.Neutral_green_desc: "社会民主主义 - 民主与发展论坛是赞比亚的一个社会民主党。 它由多党民主运动的前成员于2001年创立。 它在同年的选举中取得了重大成功，在国民议会中获得了12个席位，但获得的选票超过了统一民族独立党。 它于2006年与统一民族独立党和国家发展统一党共同运行。 之后，他们在2016年举行的2011年国民议会中仅获得一个席位。"
 ZAM.neutral_Social: "£generic_neutral_Social_small 爱国阵线"
 ZAM.neutral_Social_desc: "民主社会主义者 - 爱国阵线是赞比亚的一个民主社会主义政党。 它在2001年脱离了多党民主运动。它在2006年的大选中首次取得重大成功，成为议会第二大党。 五年后的2011年，它在选票和席位上超过了多党民主运动，其候选人迈克尔萨塔赢得了总统选举。 它仍然是今天最强大的政党，并在国民议会中拥有绝对多数。 它在赞比亚西部拥有大部分选区席位。"
 ZAM.Neutral_Communism: "£generic_Neutral_Communism_small 彩虹党"
 ZAM.Neutral_Communism_desc: "共产主义 - 彩虹党是赞比亚的一个民主社会主义政党。该党由前爱国阵线成员于2014年成立，首次参加2016年大选。它是2016年大选中第五大党，没有赢得任何席位，因此成为最受欢迎的未获胜党派。"
 ZAM.Nat_Populism: "£generic_Nat_Populism_small 国民党"
 ZAM.Nat_Populism_desc: "右翼民粹主义者-国民党是赞比亚的一个政党。 它于1993年由前MMD成员组成。它在1996年取得了最大的成功，获得了5个议会席位，但在随后的2001年大选中失去了所有席位。此后它再也没有恢复过往的支持率。"
 ZAM.Nat_Autocracy: "£generic_Nat_Autocracy_small  赞比亚国防军"
 ZAM.Nat_Autocracy_desc: ""
 ZIM.conservatism: "£generic_conservatism_small (ZUM) - 津巴布韦统一运动"
 ZIM.conservatism_desc: "(保守派)\n津巴布韦统一运动\n\n作为20世纪80年代末津巴布韦保守联盟的意识形态继承者和联系纽带，ZUM的成立源于埃德加·特克雷与罗伯特·穆加贝在一党制原则上的分歧。\n\n特克雷在1990年总统选举中挑战穆加贝，但收效甚微，这主要归因于津巴布韦非洲民族联盟利用安全部队进行选民压制，在某些情况下还导致ZUM代表死亡。\n\nZUM在议会层面继续参加选举，但正如1990年的特克雷一样，ZUM至今未能在众议院赢得很多席位。然而，这更可能是由于威斯敏斯特议会制度采用简单多数票计票方式，而非大规模的选民压制。"
 ZAM.Nat_Fascism: "£generic_Nat_Fascism_small 真实公民党"
 ZAM.Nat_Fascism_desc: ""
 ZIM.liberalism: "£generic_liberalism_small (UANC) - 非洲人全国委员会"
 ZIM.liberalism_desc: "（社会自由主义）\n联合非洲人全国委员会\n\n该党由前津巴布韦-罗得西亚总理穆佐雷瓦主教于1971年创立，主要致力于与前罗得西亚政府和军队进行和解，主要是为了防止他们认为的共产主义势力在国内的影响。\n\n联合非洲人全国委员会最初的衰落主要是由于未能完全遵守《兰开斯特宫协议》，并排斥了非洲民族主义政党津巴布韦非洲民族联盟和津巴布韦非洲人民联盟。自衰落以来，该党参加了后来的选举，但迄今收效甚微。"
 ZIM.socialism: "£generic_socialism_small (MDC) - 民主变革运动"
 ZIM.socialism_desc: "（民主社会主义）\n民主变革运动\n\n民主变革运动由摩根·茨万吉拉伊于1999年末创立，是作为罗伯特·穆加贝及其津巴布韦非洲民族联盟-爱国阵线党的反对党而成立的。该反对派虽然广泛反对津巴布韦非洲民族联盟-爱国阵线，但其主要起因是2000年全民公投中提出的宪法修正案。"
 ZIM.anarchist_communism: "£ZIM_emerging_left_wing_radical (ZANU-PF) - 津巴布韦非洲民族联盟-爱国阵线"
 ZIM.anarchist_communism_icon: "£ZIM_emerging_left_wing_radical"
 ZIM.anarchist_communism_desc: "（泛非社会主义）\n津巴布韦非洲民族联盟——爱国阵线\n\n津巴布韦非洲民族联盟——爱国阵线（ZANU-PF）与ZANU-N一同在1975年ZANU分裂时成立，在1987年《统一协议》之前，它一直简称为ZANU，是ZANU中与罗伯特·穆加贝结盟的派系。这次分裂主要源于布什战争期间的战术分歧，但不久之后便演变为部落界线；绍纳族支持穆加贝和ZANU，恩德贝莱族支持恩达巴宁吉·西索莱和ZANU-N。\n\n自津巴布韦独立和罗得西亚解体以来，ZANU-PF一直是津巴布韦最大的政党，几乎控制了津巴布韦政治的方方面面。ZANU-PF追随朱利叶斯·尼雷尔的脚步，旨在以泛非社会主义视角、利用农民先锋主义——换言之，一党制国家——进行治理。\n\n尽管宣称的目标是建立一党制国家，但纸面上，津巴布韦一直维持着多党民主；在实践中，ZANU-PF利用警察和津巴布韦国民军打压选民，维持该党对津巴布韦的控制。"
 ZIM.Nat_Autocracy: "£generic_Nat_Autocracy_small (ZDF) - 津巴布韦国防军"
 ZIM.Nat_Autocracy_desc: "（军政府）\n津巴布韦国防军\n\n津巴布韦国防军于1980年形成，是在《兰开斯特宫协议》签署后成立的。该协议最终终结了津巴布韦的白人少数统治。津巴布韦国防军由两大部分组成：津巴布韦国民军和津巴布韦空军。\n\n津巴布韦国民军是在《兰开斯特宫协议》签署后由多支力量重组而成的混合部队，包括前罗得西亚陆军、津巴布韦非洲民族解放军和津巴布韦人民革命军。而津巴布韦空军则几乎是罗得西亚空军的完全延续。\n\n如今，津巴布韦国防军的人员构成与成立之初已大不相同，但其组织架构自1980年建立以来基本保持完整。"
 USoE.Western_Autocracy: "£EU_parl_PG_party_0 (APWA) - 亲西方专制者联盟"
 USoE.Western_Autocracy_icon: "£EU_parl_PG_party_0"
 USoE.Western_Autocracy_desc: "（西方专制主义） - 亲西方专制联盟（APWA）\n亲西方专制联盟是欧洲议会中一个相对较新的政党。它坚持与西方结盟的外交政策，具有专制特征。"
 USoE.conservatism: "£EU_parl_PG_party_1 (EPP-ED) - 欧洲人民党与欧洲民主党"
 USoE.conservatism_icon: "£EU_parl_PG_party_1"
 USoE.conservatism_desc: "（保守主义） - 欧洲人民党和欧洲民主党(EPP-ED)\n\n欧洲人民党和欧洲民主党是由主要由基督教民主党人组成的欧洲人民党和由持更偏向欧洲怀疑论的保守派人士组成的欧洲民主联盟合并而成。其政治议程侧重于尊重传统和保障个人的社会和经济自由，以及在个人责任的帮助下追求的价值观，不忽视环境，并着眼于公共预算。"
 USoE.conservatism_2017: "£EU_parliament_PG_2017_conservatism (EPP) - 欧洲人民党"
 USoE.conservatism_2017_icon: "£EU_parliament_PG_2017_conservatism"
 USoE.conservatism_2017_desc: "（保守主义） - 欧洲人民党(EPP)\n\n欧洲人民党，前身为“欧洲人民党和欧洲民主党”，占据欧洲议会的中右翼，主要由保守派和基督教民主党组成。其政治议程侧重于尊重传统、保障个人的社会和经济自由，以及在不忽视环境和关注公共预算的情况下，通过个人责任来追求价值观。"
 USoE.liberalism: "£EU_parl_PG_party_2 (ELDR) - 欧洲自由民主和改革党"
 USoE.liberalism_icon: "£EU_parl_PG_party_2"
 USoE.liberalism_desc: "（自由主义） - 欧洲自由民主改革党(ELDR)\n\n欧洲自由民主和改革党的前身是“自由和民主改革小组”，在欧洲议会中占据中左翼位置，主要由自由主义者组成。它的政治议程集中在保证社会和经济的个人自由，保护环境和减少政府在经济中的作用。"
 USoE.liberalism_2017: "£EU_parliament_PG_2017_liberalism 自由主义者联盟和欧洲民主党"
 USoE.liberalism_2017_icon: "£EU_parliament_PG_liberalism"
 USoE.liberalism_2017_desc: "（自由主义） - 欧洲自由民主联盟党(ALDE)\n\n自由主义者联盟和欧洲民主党的前身是“欧洲自由民主党和改革党”，在欧洲合众国议会中占据中左翼，主要由自由派组成。它的政治议程集中在保证社会和经济的个人自由，保护环境和减少政府在经济中的作用。"
 USoE.socialism: "£EU_parl_PG_party_3 (PES) - 欧洲社会党"
 USoE.socialism_icon: "£EU_parl_PG_party_3"
 USoE.socialism_desc: "（社会民主主义）- 欧洲社会党(PES)\n\n欧洲社会党占据了欧洲议会的左翼部分，主要由自由社会主义者组成。它的政治议程集中在消除贫困和不平等，保证社会和工人的权利以及保护环境。它旨在通过累进税和适度提高政府干预来实现这些目标，同时仍然承认经济自由和自由贸易的重要性。"
 USoE.socialism_2017: "£EU_parliament_PG_2017_socialism 欧洲社会主义党"
 USoE.socialism_2017_icon: "£EU_parliament_PG_2017_socialism"
 USoE.socialism_2017_desc: "（社会民主主义）- 欧洲社会党(PES)\n\n欧洲社会主义党占据了欧洲议会的左翼部分，主要由自由社会主义者组成。它的政治议程集中在消除贫困和不平等，保证社会和工人的权利以及保护环境。它旨在通过累进税和适度提高政府干预来实现这些目标，同时仍然承认经济自由和自由贸易的重要性。"
 USoE.anarchist_communism: "£EU_parl_PG_party_5 (EACL) - 欧洲反资本主义左派"
 USoE.anarchist_communism_icon: "£EU_parl_PG_party_5"
 USoE.anarchist_communism_desc: "（左翼激进主义） - 欧洲反资本主义左翼(EACL)\n\n欧洲反资本主义左派是欧洲合众国议会中的一个极左政党，主要由温和的共产主义者组成。它认为有必要取代资本主义，建立一个所有生产资料都归人民所有的经济体系。它的目标是以民主和改革的方式实现真正的社会主义。"
 USoE.anarchist_communism_2017: "£EU_parliament_PG_2017_anarchist_communism (NP) - 人民的时刻！"
 USoE.anarchist_communism_2017_icon: "£EU_parliament_PG_2017_anarchist_communism"
 USoE.anarchist_communism_2017_desc: "（左翼激进分子） - 人民的时刻！(NP)\n\n“人民的时刻！”是欧罗巴议会中的一个极左政党，主要由温和的共产主义者组成。它认为有必要取代资本主义，建立一个所有生产资料都由国家拥有的经济体系。它的目标是以民主和改革的方式实现真正的社会主义。"
 USoE.Conservative: "£EU_parl_PG_party_6 (AoR) - 反动主义者联盟"
 USoE.Conservative_icon: "£EU_parl_PG_party_6"
 USoE.Conservative_desc: "（反动主义） - 反动主义者联盟(AoR)\n\n反动主义者联盟是一个极右翼、欧洲怀疑论者和民族主义政党，旨在撤销联邦并恢复基于种族群体的国家。它的政治观点集中在捍卫传统、拒绝移民和对抗全球化。"
 USoE.Conservative_2017: "£EU_parliament_PG_2017_Conservative (AENM) - 欧洲国家运动联盟"
 USoE.Conservative_2017_icon: "£EU_parliament_PG_2017_Conservative"
 USoE.Conservative_2017_desc: "（反动主义） - 欧洲国家运动联盟(AENM)\n\n欧洲国家运动联盟是一个极右翼、欧洲怀疑论者和民族主义政党，旨在撤销联盟并恢复基于种族群体的国家。它的政治观点集中在捍卫传统，拒绝移民和对抗全球化。"
 USoE.Autocracy: "£EU_parl_PG_party_7 (AoA) - 专制主义者联盟"
 USoE.Autocracy_icon: "£EU_parl_PG_party_7"
 USoE.Autocracy_desc: "（新兴专制主义） - 专制主义者联盟(AoA)\n\n专制主义者联盟涵盖了一个群体和一种新的现象，欧洲合众国正在向俄罗斯和中国靠拢，但采取了新的治理方式。他们致力于建立一种专制政府体制。在这种政体中，国家高于一切，而人民忠于国家。"
 USoE.Mod_Vilayat_e_Faqih: "£EU_parl_PG_party_8 (HAYI-M)  - 伊斯兰之声运动（温和派）"
 USoE.Mod_Vilayat_e_Faqih_icon: "£EU_parl_PG_party_8"
 USoE.Mod_Vilayat_e_Faqih_desc: "（霍梅尼主义 - 改革派） - 伊斯兰之声运动是一个活跃于欧洲的什叶派伊斯兰主义组织。该组织成立于2026年，与伊朗伊斯兰革命卫队关系密切，意识形态与霍梅尼主义一致。总体而言，该组织的主要目的是为伊朗效力，其活动主要围绕武装行动而非政治组织展开。"
 USoE.Vilayat_e_Faqih: "£EU_parl_PG_party_9 (HAYI)  - 伊斯兰之声运动（强硬派）"
 USoE.Vilayat_e_Faqih_icon: "£EU_parl_PG_party_9"
 USoE.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 伊斯兰之声运动是一个活跃于欧洲的什叶派伊斯兰主义组织。该组织成立于2026年，与伊朗伊斯兰革命卫队关系密切，意识形态与霍梅尼主义一致。总体而言，该组织的主要目的是为伊朗效力，其活动主要围绕武装行动而非政治组织展开。"
