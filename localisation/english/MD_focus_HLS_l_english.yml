l_english:
 vatican_focus: "Vatican Focus Tree"

 # Leader Traits
 crusader_pope: "Crusader Pope"
 caliph_pope: "The New Caliph"

 # Ideas
 HLS_idea_vatican_library: "Vatican Library"
 HLS_idea_vatican_library_desc: "The Vatican Library holds one of the oldest collections of manuscripts in the world. Keeping it in pristine condition takes constant care and money, but it remains a monument to the Holy See.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$HLS_refurbish_the_vatican_library$§! focus."
 HLS_idea_refurbished_vatican_library: "Refurbished Vatican Library"
 HLS_idea_refurbished_vatican_library_desc: "The restored Vatican Library needs less care and has opened its reading rooms to scholars from around the world."
 HLS_idea_rise_of_islam: "The Rise of Islam"
 HLS_idea_rise_of_islam_desc: "The seat of Catholicism has embraced a new faith, and the most unlikely one at that. The Pope now preaches the word of Allah from the balcony of Saint Peter's."
 HLS_idea_holy_soldiers: "Crusader Army"
 HLS_idea_holy_soldiers_desc: "Our soldiers carry the title of Crusader. Zeal stiffens their resolve on home soil, though the clergy who lead them have little patience for politics."
 HLS_idea_allahs_will: "Allah's Will"
 HLS_idea_allahs_will_desc: "Recruits flock to the Vatican Caliphate. Few of them are trained, but none of them lack conviction."
 HLS_idea_holy_war: "War Against the Vatican"
 HLS_idea_holy_war_desc: "We are at war with the Holy See, which has declared the conflict a holy war but has not called the rest of Europe to arms."
 HLS_idea_global_crusade_target: "Target of a Crusade"
 HLS_idea_global_crusade_target_desc: "The Pope has called a crusade against us, and the countries of Europe have been asked to join it."
 HLS_idea_fortress_vatican: "Fortress Vatican"
 HLS_idea_fortress_vatican_desc: "The Vatican has been heavily fortified. Any enemy of the Pope will find its walls hard to breach."
 HLS_idea_religious_recruits: "Religious Recruits"
 HLS_idea_religious_recruits_desc: "The faithful wish to fight for the Holy See. Most have never held a rifle, so training them takes time."
 HLS_idea_rejected_islam: "Condemned Islam"
 HLS_idea_rejected_islam_desc: "The Pope has formally condemned Islam, and relations with the Muslim world have collapsed."
 HLS_idea_accepted_islam: "Accepted Islam"
 HLS_idea_accepted_islam_desc: "The Pope has formally recognized Islam as a sister faith, opening a new chapter in relations between the two religions."
 HLS_idea_crusader_state: "Crusader State"
 HLS_idea_crusader_state_desc: "The Pope has declared the Vatican a crusader state once more."
 HLS_idea_italian_power_supply: "Italian Power Supply Agreement"
 HLS_idea_italian_power_supply_desc: "The Vatican buys nearly all of its electricity from Italy. A long-term supply agreement with Italian utilities keeps the lights on in Saint Peter's at a fair price."
 HLS_idea_carbon_neutral_state: "The First Carbon-Neutral State"
 HLS_idea_carbon_neutral_state_desc: "The Vatican offsets its emissions by planting forests abroad and preaches care for creation to the faithful. Clean energy projects find generous patrons within the Curia."
 HLS_idea_papal_diplomacy: "Papal Diplomacy"
 HLS_idea_papal_diplomacy_desc: "Papal nuncios sit in nearly every capital of the world. Few governments refuse a meeting with the Pope's envoy."
 HLS_idea_vatican_observatory: "Specola Vaticana"
 HLS_idea_vatican_observatory_desc: "The Vatican Observatory is one of the oldest astronomical institutes in the world. Its Jesuit astronomers lend the Holy See a scientific reputation few states can match."
 HLS_idea_lacks_an_army: "Lacks a Professional Army"
 HLS_idea_lacks_an_army_desc: "The Vatican has never needed armed forces beyond the Swiss Guard and the Gendarmerie, and has no institutions to raise them.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$HLS_question_of_the_land_forces$§! focus."
 HLS_idea_forming_an_army: "Forming an Army"
 HLS_idea_forming_an_army_desc: "The time has come to raise an army worthy of the Holy See."
 HLS_idea_swiss_guard_reform: "Swiss Guard Reform"
 HLS_idea_swiss_guard_reform_desc: "The Swiss Guard is loyal to the Pope and to no one else. Expanding it into a full army lets us build on centuries of discipline."
 HLS_idea_fanatics_reform: "Fanatic Army"
 HLS_idea_fanatics_reform_desc: "Faith is the one resource we have in abundance. A fanatical army will never lack volunteers, if it can learn to fight in formation."
 HLS_idea_papal_states: "The Papal States"
 HLS_idea_papal_states_desc: "The Pope is a temporal sovereign again, ruling far more than the few acres behind Saint Peter's walls. The Church now has a state to govern as well as a flock to shepherd."
 HLS_idea_roman_curia: "The Roman Curia"
 HLS_idea_roman_curia_desc: "The Curia is the administration of the Holy See, from the Secretariat of State to the Vatican Bank. When it works, the whole Church works, and when it does not, nothing does."
 HLS_idea_pilgrim_pope: "The Pilgrim Pope"
 HLS_idea_pilgrim_pope_desc: "We do not wait for the world to come to Rome. The Pope goes to the world, from the slums of Manila to the squares of Warsaw, and crowds gather wherever he lands."
 HLS_idea_moral_authority: "Moral Authority"
 HLS_idea_moral_authority_desc: "We command no armies, yet heads of state still listen when the Pope speaks. Our voice carries because we have never needed to raise it."

 # Opinion Modifiers
 we_are_the_true_vatican: "The True Vatican"
 agreed_to_our_aid: "Accepted Our Aid"
 disagreed_to_our_aid: "Refused Our Aid"
 accepted_islam: "Embraced Islam"
 rejected_islam: "Rejected Islam"

 # Decisions
 HLS_decision_category: "His Holiness' Agenda"
 HLS_decision_category_desc: "[HLS.GetLeader] carries the authority of the Throne of Saint Peter. The Curia awaits his decisions."
 HLS_ask_for_more_swiss_guard_unit: "Request Additional Swiss Guard"
 HLS_ask_for_more_swiss_guard_unit_desc: "The Swiss have guarded the Pope since 1506. As the Holy See grows, so does its need for their protection."
 HLS_ask_for_more_swiss_guard_tt: "Ask §YSwitzerland§! to send another division of §YSwiss Guard§!."
 HLS_accept_islam: "Accept Islam"
 HLS_accept_islam_desc: "Relations between Islam and Christianity are one of the great debates of our time. A formal recognition from the Vatican would extend the dove of peace to the Muslim world."
 HLS_accept_islam_tooltip: "Every Muslim country will think better of us, and we of them."
 HLS_condemn_islam: "Condemn Islam"
 HLS_condemn_islam_desc: "Some in the Curia want the Pope to denounce Islam outright and break with decades of interfaith dialogue."
 HLS_condemn_islam_tooltip: "Every Muslim country will think worse of us. Unlocks the §Y$HLS_anti_islamist_crusade$§! focus and closes the §Y$HLS_a_dark_path$§! focus."
 HLS_general_audience: "Hold a General Audience"
 HLS_general_audience_desc: "Every week the Pope addresses the crowds in Saint Peter's Square. A good audience lifts our standing, but a poorly chosen word can be used against us."
 HLS_convene_a_consistory: "Convene a Consistory"
 HLS_convene_a_consistory_desc: "A consistory gathers the College of Cardinals around the Pope. A well-managed meeting keeps the princes of the Church loyal and the Curia in line."
 HLS_convene_the_ulema: "Convene the Ulema"
 HLS_convene_the_ulema_desc: "The scholars who guide the Vatican Caliphate expect the Caliph to seek their counsel. Gathering them in Rome reassures them that the new faith is in good hands."
 HLS_rename_istanbul: "Rename Istanbul to Constantinople"
 HLS_rename_istanbul_desc: "The city has not been under a Christian ruler since 1453. Now that it is ours again, we should restore its older name."
 HLS_religious_recruits_decision: "Recruit Religious Volunteers"
 HLS_religious_recruits_decision_desc: "We are a small country, but the faithful across Europe are eager to enlist in God's army."
 HLS_religious_recruits_tt: "Spawns §Y5§! §GHoly Warriors§! divisions in our capital."
 HLS_international_jihadists_decision: "Recruit Foreign Fighters"
 HLS_international_jihadists_decision_desc: "Volunteers from across the Muslim world want to serve the Vatican Caliphate. We should organize them before they organize themselves."
 HLS_international_jihadists_decision_tt: "Spawns §Y5§! §GFadiyeen lil Bayt al-Maqdis§! divisions in our capital."

 # Events
 vatican.1.t: "The Vatican Demands Integration"
 vatican.1.d: "The Holy See has ordered us to dissolve the Italian Republic and join the Papal States, giving the Pope full authority over our land."
 vatican.1.o1: "Anything for God."
 vatican.1.o2: "Never!"
 vatican.2.t: "Italy Agrees"
 vatican.2.d: "[FROM.GetNameDefCap] has agreed to join us. The Papal States are reborn, and Rome is once again the capital of a Christian realm."
 vatican.2.o1: "Excellent!"
 vatican.3.t: "Italy Refuses"
 vatican.3.d: "[FROM.GetNameDefCap] has refused to dissolve itself. It remains our subject, but the refusal has embarrassed the Curia."
 vatican.3.o1: "They will regret this."
 vatican.4.t: "The Vatican Calls a Crusade Against Us"
 vatican.4.d: "The Holy See has declared an anti-Islamist crusade and named our government as its enemy. The Pope demands that we submit."
 vatican.4.o1: "They will pay for this."
 vatican.5.t: "A Crusade or a Holy War?"
 vatican.5.d: "We go to war with [FROM.GetNameDef] in the name of the Lord. Should we call a crusade and bring our allies and the countries of Europe to arms, or keep this war our own?"
 vatican.5.o1: "This is our battle."
 vatican.5.o2: "United we stand against [FROM.GetNameDef]!"
 vatican.6.t: "The Vatican Demands Our Fealty"
 vatican.6.d: "In an unprecedented move, the Holy See has demanded that the Italian government accept the Pope as its temporal sovereign and place the Republic under Vatican authority."
 vatican.6.o1: "We submit to the Holy Father."
 vatican.6.o2: "This is absurd."
 vatican.7.t: "Call a Crusade?"
 vatican.7.d: "We are now at war with [FROM.GetNameDef]. Should we call the Christian countries of Europe and our allies to join the war as a crusade?"
 vatican.7.o1: "No, this is our own war."
 vatican.7.o2: "Yes, together we will be strong!"
 vatican_holy_war_event_tooltip: "Declares this war a §YCrusade§!. Every European country that is not Salafist, and every member of our faction, is invited to join the war against the target."
 vatican.10.t: "The Vatican Caliphate Offers Aid"
 vatican.10.d: "The Vatican Caliphate has offered weapons, money and protection to Muslim countries, promising an alliance of the faithful against their enemies."
 vatican.10.o1: "We accept."
 vatican.10.o2: "We are better off alone."
 vatican.11.t: "The Pope Calls Us to a Crusade"
 vatican.11.d: "[HLS.GetLeader] has called a crusade against [FROM.GetNameDef] and asks every Christian nation of Europe to take up arms or send aid to the Holy See."
 vatican.11.o1: "Deus vult!"
 vatican.11.o2: "We will send some aid."
 vatican.11.o3: "Nonsense, this is the 21st century!"
 vatican.12.t: "A Crusade Is Called Against Us"
 vatican.12.d: "The Pope is asking the countries of Europe to declare war on us. We should prepare for the worst."
 vatican.12.o1: "Let them try!"
 vatican.13.t: "The Pope Requests More Swiss Guard"
 vatican.13.d: "The Holy See has asked us to send another unit of the Pontifical Swiss Guard to take up permanent residence in Vatican City."
 vatican.13.o1: "For the Pope? Of course!"
 vatican.13.o2: "He has enough protection."
 vatican.14.t: "Switzerland Sends More Guards"
 vatican.14.d: "Our request has been granted. A new unit of the Swiss Guard has taken up residence within our walls."
 vatican.14.o1: "Great news!"
 vatican.15.t: "Switzerland Refuses"
 vatican.15.d: "Switzerland has declined to send more of the Swiss Guard at this time."
 vatican.15.o1: "Perhaps when they have men to spare."
 vatican.16.t: "Italy Accepts Papal Suzerainty"
 vatican.16.d: "Against all expectations, [FROM.GetNameDef] has accepted the Pope as its sovereign. Rome answers to the Vatican once more."
 vatican.16.o1: "God's will be done."
 vatican.17.t: "Italy Rejects Papal Suzerainty"
 vatican.17.d: "[FROM.GetNameDefCap] has rejected our demand outright. If Italy will not submit willingly, it must be made to."
 vatican.17.o1: "Then we take it by force."
 vatican.18.t: "Pilgrims Flood Rome for the Jubilee"
 vatican.18.d: "The Pope has proclaimed a jubilee year, and millions of pilgrims are pouring into Rome to pass through the Holy Door of Saint Peter's. The Curia must decide how to receive the crowds."
 vatican.18.o1: "Welcome every pilgrim."
 vatican.18.o2: "Keep the jubilee solemn and controlled."
 vatican.19.t: "Where Will World Youth Day Be Held?"
 vatican.19.d: "Young Catholics from every continent are ready to gather around the Holy Father for World Youth Day. The Curia must choose the host region, and the choice will say much about where the Church sees its future."
 vatican.19.o1: "Hold it in Europe."
 vatican.19.o2: "Hold it in the Americas."
 vatican.19.o3: "Hold it in Africa and Asia."
 vatican.20.t: "Prayer for Peace at Assisi"
 vatican.20.d: "We have called the leaders of the world's religions to pray for peace in Assisi, the town of Saint Francis. The Curia is divided over whom to invite."
 vatican.20.o1: "Invite the leaders of every faith."
 vatican.20.o2: "Invite Christian denominations only."
 vatican.21.t: "A Synod Debates Reform and Tradition"
 vatican.21.d: "Bishops from every continent have gathered in Rome to debate the future of the Church. Reformers want a more open Church, while traditionalists warn against abandoning what has been handed down."
 vatican.21.o1: "Embrace reform."
 vatican.21.o2: "Uphold tradition."
 vatican.21.o3: "Seek a compromise."
 vatican.22.t: "Leaked Documents Expose Curia Finances"
 vatican.22.d: "Confidential papers on the Vatican Bank have reached the press, naming questionable accounts and donors. Editors across Europe are demanding answers from the Holy See."
 vatican.22.o1: "Open the books and prosecute the leakers."
 vatican.22.o2: "Hush it up."

 # News Events
 vatican_news.1.t: "The Pope Calls a Crusade"
 vatican_news.1.d1: "The Pope has called a crusade against [FROM.GetNameDef], following his recent condemnation of Islam. The Vatican urges its allies to go to war at once."
 vatican_news.1.d2: "The Pope has called a so-called crusade against [FROM.GetNameDef], declaring our faith false. May Allah give strength to [FROM.GetName] and bring the Pope to heel."
 vatican_news.1.o1: "A crusade? Is this the 1100s?"
 vatican_news.1.o2: "Insha'Allah."
 vatican_news.2.t: "The Pope Recognizes Islam"
 vatican_news.2.d1: "In a historic announcement, [HLS.GetLeader] declared Islam and Christianity equal before God and called for lasting friendship with Muslims everywhere."
 vatican_news.2.d2: "The leader of the Christians, [HLS.GetLeader], has recognized the truth of Islam before the whole world. Many among the faithful see it as a sign of things to come."
 vatican_news.2.o1: "Less hostility between the two would be welcome."
 vatican_news.2.o2: "Perhaps Christianity and Islam can stand side by side."
 vatican_news.3.t: "The Pope Condemns Islam"
 vatican_news.3.d1: "[HLS.GetLeader] has formally condemned Islam, abandoning decades of interfaith dialogue. Several governments in the Middle East have already issued threats against the Vatican."
 vatican_news.3.d2: "The Christian Pope [HLS.GetLeader] has insulted the faith of a billion Muslims before the world. We will not let this slander go unanswered."
 vatican_news.3.o1: "The Pope denouncing Islam? Whatever next, a crusade?"
 vatican_news.3.o2: "The Pope will regret these words."
 vatican_news.4.t: "Constantinople Reborn"
 vatican_news.4.d1: "[HLS.GetLeader] has officially renamed Istanbul to Constantinople. The city fell to the Ottomans in 1453 and was officially renamed in 1930, but is now back in Christian hands."
 vatican_news.4.d2: "The Pope has renamed Istanbul to Constantinople after seizing it from its rightful owners. The insult will not be forgotten."
 vatican_news.4.o1: "It is the superior name."
 vatican_news.4.o2: "It will not stay in the Pope's hands for long."

 # Wargoals
 holywar_wargoal: "Holy War"
 holywar_wargoal_desc: "A holy war declared by the Holy See."
 holywar_wargoal_short_desc: "This wargoal is for a holy war led by the Pope."
 crusade_wargoal: "Crusade"
 crusade_wargoal_desc: "A crusade called by the Pope against this country."
 crusade_wargoal_short_desc: "This wargoal is for a crusade called by the Pope."
 jihad_wargoal: "Jihad"
 jihad_wargoal_desc: "A jihad declared by the Vatican Caliphate."
 jihad_wargoal_short_desc: "This wargoal is for a jihad declared by the Vatican Caliphate."

 # Factions
 vatican_islamist_alliance: "Allah's Faithful"
 vatican_holy_christian_alliance: "The Holy League"

 # Tooltips
 HLS_retake_african_coast_tt: "Claims the North African coast once held by Rome."
 HLS_anti_islamist_crusade_tt: "Every §YSalafist§! government is told of the crusade. We then choose for each one whether to fight a §YHoly War§! or call a Europe-wide §YCrusade§!."
 HLS_aid_our_brethren_tt: "Every Muslim country not at war with us is offered our aid. Those that accept gain §GStability§! and §GWar Support§!, and join our faction if we lead one."
 HLS_sympathizers_for_the_cause_tt: "Gain §G3%§! influence in every §YSalafist§! country."
 HLS_vatican_radio_tt: "Gain §G2%§! influence in §YItaly§!, §YPoland§!, §YSpain§!, §YPortugal§!, §YIreland§!, §YBrazil§!, §YMexico§! and the §YPhilippines§!."
 HLS_swiss_guard_tooltip: "§YSwitzerland§! sends a division of §YSwiss Guard§! to the Vatican."
 HLS_anti_islamist_crusade_custom_trigger: "Has formally condemned Islam"
 HLS_a_dark_path_custom_trigger: "Has not condemned Islam"
 HLS_ecumenical_outreach_tt: "Gain §G3%§! influence in every §YOrthodox§! country."
 vatican_wyd_europe_tt: "Gain §G3%§! influence in every §YChristian§! country in §YEurope§!."
 vatican_wyd_americas_tt: "Gain §G3%§! influence in every §YChristian§! country in the §YAmericas§!."
 vatican_wyd_global_south_tt: "Gain §G3%§! influence in every §YChristian§! country in §YAfrica§! and §YAsia§!."
 vatican_assisi_muslim_tt: "Every §YMuslim§! country gains a better opinion of us."
 vatican_assisi_orthodox_tt: "Gain §G2%§! influence in every §YOrthodox Christian§! country."

 # National Focuses
 HLS_improve_the_city: "Improve the City"
 HLS_improve_the_city_desc: "The streets and courtyards of the Vatican need repair, and every square meter of the city must be put to use."
 HLS_strengthen_the_walls: "Strengthen the Walls"
 HLS_strengthen_the_walls_desc: "The Leonine Walls have protected the Pope for over a thousand years. Modern threats call for modern defenses."
 HLS_electrical_deals: "Electrical Deals"
 HLS_electrical_deals_desc: "The Vatican buys its power from Italy. A long-term agreement with Italian utilities would secure a cheap and reliable supply."
 HLS_vatican_factories: "Vatican Factories"
 HLS_vatican_factories_desc: "It is not a very holy endeavor, but the Holy See needs an industry of its own."
 HLS_carbon_neutrality: "Carbon Neutrality"
 HLS_carbon_neutrality_desc: "By planting forests to offset our emissions, the Vatican can become the first carbon-neutral state in the world and lead the faithful in caring for creation."
 HLS_solar_panels: "Solar Panels"
 HLS_solar_panels_desc: "The roof of the Paul VI Audience Hall is large, flat and sunny. Covering it with solar panels would make the Vatican a model for clean energy."
 HLS_heavy_restructuring: "Heavy Restructuring"
 HLS_heavy_restructuring_desc: "The Vatican must grow beyond an enclave. The work will take years and cost a fortune, but it will make us strong."
 HLS_vatican_fortress: "Vatican Fortification"
 HLS_vatican_fortress_desc: "The Vatican is not a mere city but the seat of the Pope. Instead of more factories, we should fortify it heavily."
 HLS_refurbish_the_vatican_library: "Refurbish the Vatican Library"
 HLS_refurbish_the_vatican_library_desc: "The Vatican Library needs a thorough restoration if it is to remain a wonder for the centuries to come."
 HLS_road_to_greatness: "The Road to Greatness"
 HLS_road_to_greatness_desc: "The world laughs at the smallest country on earth. It is time to revive the ways of old and lead the world into a new era of faith."
 HLS_status_quo: "Status Quo"
 HLS_status_quo_desc: "The Holy See is in a good place. There is no need to return to the ambitions of the past."
 HLS_swiss_guard: "Swiss Guard"
 HLS_swiss_guard_desc: "The Swiss Guard has always protected us, but the modern world demands that we strengthen it."
 HLS_great_jubilee: "The Great Jubilee"
 HLS_great_jubilee_desc: "In a Holy Year, millions of pilgrims come to Rome to pass through the Holy Door of Saint Peter's. The Church means to welcome every one of them."
 HLS_pastoral_journeys: "Pastoral Journeys"
 HLS_pastoral_journeys_desc: "The Pope no longer waits in the Vatican for the world to come to him. Visits to distant countries bring the Holy See to the faithful and carry its voice to presidents and crowds alike."
 HLS_interfaith_dialogue: "Interfaith Dialogue"
 HLS_interfaith_dialogue_desc: "In 1986 the Pope gathered the leaders of the world's religions at Assisi to pray for peace. Calling them together again would show that faith can be a witness against violence, not a cause of it."
 HLS_world_youth_day: "World Youth Day"
 HLS_world_youth_day_desc: "Every few years the Pope calls the young people of the world to a great gathering of prayer and celebration. Millions answer, and many return home with a deeper faith."
 HLS_synod_of_bishops: "Synod of Bishops"
 HLS_synod_of_bishops_desc: "Bishops from every continent gather in Rome to advise the Pope on the questions facing the Church. Their counsel keeps the Holy See in touch with the faithful in every land."
 HLS_ecumenical_outreach: "Ecumenical Outreach"
 HLS_ecumenical_outreach_desc: "The split between East and West is nearly a thousand years old. Patient dialogue with the Orthodox churches may yet bring the two halves of Christendom closer together."
 HLS_moral_authority: "Moral Authority"
 HLS_moral_authority_desc: "The Pope commands no armies, yet governments and peoples listen when he speaks on war, poverty and human dignity. That trust is the most valuable thing the Holy See owns."
 HLS_italy_our_puppet: "Italy, Our Vassal"
 HLS_italy_our_puppet_desc: "To begin our ascent we must reclaim authority over the Italian mainland. Italy is, after all, our homeland."
 HLS_retake_rome: "Retake Rome"
 HLS_retake_rome_desc: "The Vatican will always be the heart of our realm, but we need the whole of Rome and its factories to sustain it."
 HLS_italian_integration: "Italian Integration"
 HLS_italian_integration_desc: "A vassal is not enough. Italy should join the Papal States outright."
 HLS_rebuild_italy: "Rebuild Italy"
 HLS_rebuild_italy_desc: "With Italy under our authority, we must make room for its reconstruction."
 HLS_reinstate_latin_language: "Reinstate Latin"
 HLS_reinstate_latin_language_desc: "One realm should speak one language. Latin, the tongue of the Church, will replace Italian in our administration."
 HLS_the_rise_of_christianity: "The Rise of Christianity"
 HLS_the_rise_of_christianity_desc: "It is time to show the world that the Church can lead not only souls but nations."
 HLS_new_alliance: "New Vatican Alliance"
 HLS_new_alliance_desc: "The Vatican cannot overcome the stubbornness of the world alone. We need allies."
 HLS_religious_recruits: "Religious Recruits"
 HLS_religious_recruits_desc: "Many of the faithful wish to fight for us. Few of them are fit for combat, so training will take time."
 HLS_restore_roman_empire: "Restore the Roman Empire"
 HLS_restore_roman_empire_desc: "From Rome the Church once guided an empire. It can do so again."
 HLS_divide_et_impera: "Divide et Impera"
 HLS_divide_et_impera_desc: "'Divide and rule.' Break the larger powers into pieces too weak to resist us, and a new Rome will rise."
 HLS_strike_gaul: "Strike Gaul"
 HLS_strike_gaul_desc: "Gallia, Hispania and Britannia all once answered to Rome. Our legions will remind them."
 HLS_retake_african_coast: "Retake the African Coast"
 HLS_retake_african_coast_desc: "North Africa was as much a part of Rome as Gaul. We should restore Roman rule along its coast."
 HLS_recover_balkans: "Recover the Balkans"
 HLS_recover_balkans_desc: "The Balkans have known little but conflict since the collapse of Yugoslavia. United under Rome, its peoples would know peace."
 HLS_recover_anatolia: "Recover Anatolia"
 HLS_recover_anatolia_desc: "The Eastern Empire must be restored, and this time it will not split from the West. Constantinople awaits."
 HLS_holy_soldiers: "Crusader Army"
 HLS_holy_soldiers_desc: "The title of Crusader was once given to everyone who fought in the Crusades. Granting it to our soldiers will bind them to the Church."
 HLS_anti_islamist_crusade: "Anti-Islamist Crusade"
 HLS_anti_islamist_crusade_desc: "The Salafist regimes of the world have earned the wrath of the Church. It is time to raise our swords."
 HLS_retake_the_holy_land: "Retake the Holy Land"
 HLS_retake_the_holy_land_desc: "Whoever said the First Crusade was a bad idea?"
 HLS_second_anti_islamist_crusade: "Second Anti-Islamist Crusade"
 HLS_second_anti_islamist_crusade_desc: "The first crusade did not finish the work. It is time for another."
 HLS_a_dark_path: "A Dark Path"
 HLS_a_dark_path_desc: "Christianity in the Vatican has run its course. The Pope has found a new faith, and the Holy See will follow."
 HLS_jihad: "Declare Jihad"
 HLS_jihad_desc: "The world must know that the Vatican Caliphate is serious about spreading its faith."
 HLS_take_jerusalem: "Take Jerusalem"
 HLS_take_jerusalem_desc: "Jerusalem is holy to all three Abrahamic faiths. The Vatican Caliphate intends to rule it."
 HLS_anti_america: "Anti-America"
 HLS_anti_america_desc: "America's war on terror has turned the Muslim world against it. The Vatican Caliphate will lead the resistance."
 HLS_aid_our_brethren: "Aid Our Brethren"
 HLS_aid_our_brethren_desc: "Muslim countries are too often at the mercy of foreign powers. Together we can protect each other."
 HLS_allahs_will: "Allah's Will"
 HLS_allahs_will_desc: "The faithful flock to the Vatican Caliphate, ready to give their lives for the cause."
 HLS_sympathizers_for_the_cause: "Sympathizers for the Cause"
 HLS_sympathizers_for_the_cause_desc: "The Salafist governments of the world will be useful in spreading our message. We should court them."

 HLS_papal_armed_forces: "Papal Armed Forces"
 HLS_papal_armed_forces_desc: "The Papacy has not needed an army since the Papal States fell in 1870. It is time to take stock of our forces."
 HLS_question_of_the_land_forces: "The Question of the Land Forces"
 HLS_question_of_the_land_forces_desc: "Our land forces are next to nothing. Do we build on the Swiss Guard, or train young zealots in Rome?"
 HLS_maintain_the_swiss_guard: "Maintain the Swiss Guard"
 HLS_maintain_the_swiss_guard_desc: "The Swiss Guard has always been loyal to us. We will keep the tradition and its high standards of discipline."
 HLS_drill_the_guard: "Drill the Guard"
 HLS_drill_the_guard_desc: "The Swiss Guard was never meant to fight offensive wars. Hard drilling will bring it up to the task."
 HLS_offensive_swiss_guard: "Offensive Swiss Guard"
 HLS_offensive_swiss_guard_desc: "The Swiss Guard is drilled and ready to lead our army on the attack."
 HLS_refined_equipment_procurement: "Refined Equipment Procurement"
 HLS_refined_equipment_procurement_desc: "Cheaper ways to put rifles in the hands of our troops mean more troops can carry them."
 HLS_latium_military_industrial_complex: "Roman Military-Industrial Complex"
 HLS_latium_military_industrial_complex_desc: "The Roman legions maintained their own equipment. A similar system will speed up mobilization and bring money into the state."
 HLS_bring_fanatics_to_rome: "Bring Fanatics to Rome"
 HLS_bring_fanatics_to_rome_desc: "Zealots have always found their way to the Church. Now we will put them in uniform."
 HLS_fanatic_infantry: "Fanatic Infantry"
 HLS_fanatic_infantry_desc: "Zealots are unreliable soldiers, but thousands of them charging at once can break any line."
 HLS_disciplined_rabble: "Disciplined Rabble"
 HLS_disciplined_rabble_desc: "With hard discipline our zealots could become a formidable fighting force."
 HLS_papal_fleet: "Papal Fleet"
 HLS_papal_fleet_desc: "The Papal Navy last sailed in 1870. With a coastline under our rule, we can raise a fleet once more."
 HLS_angelforce: "Angel Force"
 HLS_angelforce_desc: "The Vatican already keeps a heliport for the Pope. It can be the seed of a small papal air arm."

 HLS_reform_the_curia: "Reform the Roman Curia"
 HLS_reform_the_curia_desc: "The congregations and councils of the Curia have grown slow and quarrelsome. A reform of the papal bureaucracy is long overdue."
 HLS_clean_up_the_vatican_bank: "Clean Up the Vatican Bank"
 HLS_clean_up_the_vatican_bank_desc: "The Institute for the Works of Religion has been tied to scandal for decades. Opening its books to European regulators would restore trust in our finances."
 HLS_peters_pence: "Peter's Pence"
 HLS_peters_pence_desc: "Catholics around the world give to the Pope each year through Peter's Pence. A renewed appeal will fill our coffers."
 HLS_open_the_vatican_museums: "Open the Vatican Museums"
 HLS_open_the_vatican_museums_desc: "Millions of visitors come to see the Sistine Chapel each year. Longer opening hours and new galleries will draw millions more."
 HLS_vatican_observatory: "The Vatican Observatory"
 HLS_vatican_observatory_desc: "The Specola Vaticana has studied the heavens for over a century. Funding its telescopes in Arizona will keep the Church at the frontier of science."
 HLS_vatican_radio: "Vatican Radio"
 HLS_vatican_radio_desc: "Vatican Radio broadcasts the voice of the Pope in dozens of languages. Expanding its reach will strengthen our ties with the Catholic world."
 HLS_papal_diplomacy: "Papal Diplomacy"
 HLS_papal_diplomacy_desc: "The Holy See keeps diplomatic relations with nearly every state in the world. We should put that network to work."
 HLS_praedicate_evangelium: "Praedicate Evangelium"
 HLS_praedicate_evangelium_desc: "In 2022 the apostolic constitution Praedicate Evangelium reorganized the Roman Curia around the mission of preaching the Gospel. Dicasteries replaced congregations and councils, and laypeople became eligible to lead them."
