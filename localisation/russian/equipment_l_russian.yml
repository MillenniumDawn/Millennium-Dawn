 ENG_APC_2: "FV432 APC"
 ENG_APC_2_desc: "Основанный на конструкции M113, FV432 — это британская версия, которая чаще всего строилась в 1976-х годах. Это был костяк британских моторизованных и механизированных сил до того, как CVR(T) был принят на вооружение. Универсальность FV432 по-прежнему ценна для британской армии и используется в ролях поддержки и во вспомогательных ролях даже сегодня."
