 # Royalist no-coup path focuses
 SIA_the_quiet_word: "The Quiet Word"
 SIA_the_quiet_word_desc: "A phone call from the right office does what tanks used to. The network makes clear whose government this really is, and the message is received without a shot fired."
 SIA_judicial_review_route: "Government by Injunction"
 SIA_judicial_review_route_desc: "The Constitutional Court finds a technicality, and the ruling party dissolves overnight. No barracks, no curfew, just a verdict and a very quiet transfer of power."
 SIA_the_appointed_senate: "An Upper Chamber, Handpicked"
 SIA_the_appointed_senate_desc: "Two hundred and fifty seats that no ballot ever touches, filled by the network and answerable to it alone. Every government now governs at the Senate's pleasure."
 SIA_coalition_kingmakers: "Kingmakers of the Coalition"
 SIA_coalition_kingmakers_desc: "Cabinet seats, budget allocations, and a discreet word to the right power brokers assemble a government that answers to the palace network before it answers to voters."
 SIA_constitutional_engineering: "Engineering the Charter"
 SIA_constitutional_engineering_desc: "A new constitution, drafted in committee rooms rather than at gunpoint, locks the network's advantages into the country's basic law. Nothing about it needed a single soldier."
 SIA_the_establishment_consensus: "The Establishment Consensus"
 SIA_the_establishment_consensus_desc: "Courts, senate, army, and business now move as one, and elections have become a formality the network always wins. Nobody had to call in the tanks."

 # Royalist no-coup path choice tooltips
 SIA_judicial_review_route_choice_tt: "Choose how far the Constitutional Court's ruling reaches.\n - §YA full dissolution§!: breaks the party's popularity but feeds reform pressure\n - §YA narrow technical ruling§!: costs less"
 SIA_coalition_kingmakers_choice_tt: "Choose a coalition partner.\n - §YThe provincial power brokers§!: bought off with treasury\n - §YThe business elite§!: courted at a small cost to stability"

 # Royalist no-coup path flag
 SIA_royalist_no_coup_path: "Committed to the no-coup royalist path (network monarchy)"


 # Royalist no-coup path decision category and decisions
 SIA_establishment_category: "Establishment Management"
 SIA_establishment_category_desc: "The tools of a network monarchy that never needed a coup: the appointed senate, a cooperative bench, and the palace's own channels of persuasion."
 SIA_senate_procedural_vote: "Call a Procedural Vote"
 SIA_senate_procedural_vote_desc: "Whip the appointed chamber into line behind a measure the elected house would never pass. It costs political capital, but the vote is never really in doubt. §GStability rises.§!"
 SIA_court_referral: "Refer It to the Court"
 SIA_court_referral_desc: "Hand the populists' latest maneuver to a sympathetic bench and let a ruling do the work an election refuses to. §RThe ruling party's popularity falls, but the tactic feeds reform pressure the more it is used.§!"
 SIA_palace_audience: "Request a Palace Audience"
 SIA_palace_audience_desc: "A formal audience keeps the army and the old landed families satisfied that the network still speaks for them. §GMilitary and landowner opinion improve.§!"

 # Royalist no-coup path events
 thailand.434.t: "The Court Rules"
 thailand.434.d: "The Constitutional Court hands down its verdict on the ruling party's conduct. Everyone in the courtroom already knows which way this is going to go."
 thailand.434.a: "Dissolve the party outright"
 thailand.434.b: "Narrow the ruling to a technicality"
 thailand.435.t: "The Kingmakers' Bargain"
 thailand.435.d: "Assembling a government the network can live with means paying somebody. The only question is who, and in what currency."
 thailand.435.a: "Buy off the provincial bosses"
 thailand.435.b: "Court the business elite"

 # Intelligence and policing
 SIA_no_lar_dlc_tt: "Requires the La Resistance expansion for the full intelligence agency mechanics. Political power is granted instead."

 SIA_the_national_intelligence: "The National Intelligence Agency"
 SIA_the_national_intelligence_desc: "A single National Intelligence Agency now sits above the police, military, and civilian services that used to compete for the same information. Founding it is expensive, and the agencies it absorbs do not give up their turf without a fight."
 SIA_special_branch_police: "Special Branch"
 SIA_special_branch_police_desc: "A dedicated political and counter-terrorism police wing gives the state a sharper eye on subversion and unrest. Officers expect the funding to match the mandate, and that expectation does not go away once the unit is stood up."
 SIA_counter_insurgency_south: "The Southern Fire"
 SIA_counter_insurgency_south_desc: "Intelligence assets move south to the insurgency in Pattani, Yala, and Narathiwat, hunting networks the army alone could never map. The crackdown buys ground against the militants, but it buys it with the province's patience."
 SIA_signals_intelligence: "The Listening State"
 SIA_signals_intelligence_desc: "A signals and cryptography wing gives Thailand its own ears on the region's air waves and networks. Codebreakers and server farms are a standing expense that never turns itself off."
 SIA_humint_networks: "Men in the Field"
 SIA_humint_networks_desc: "Case officers and paid informants build a human network across the borders no satellite can replace. Recruiting and running agents this way is expensive, unglamorous work, and it is paid for in political capital, not fanfare."
 SIA_cia_partnership: "The Langley Connection"
 SIA_cia_partnership_desc: "A formal liaison channel with the Central Intelligence Agency trades access and training for a tilt toward Washington. Every wire that runs to Langley is a wire Langley can read both ways."
 SIA_mss_cooperation: "The Guoanbu Handshake"
 SIA_mss_cooperation_desc: "A quiet channel to China's Ministry of State Security trades cooperation for a tilt toward Beijing. The relationship deepens Sino-Thai ties, but it carries the same two-way exposure any foreign liaison brings."
 SIA_the_watchful_state: "The Watchful State"
 SIA_the_watchful_state_desc: "Domestic policing and foreign intelligence are fused into a single standing security apparatus, its reach extended by fresh agency upgrades and new officers in the field. Keeping all of it running is now a permanent line in the budget."
 SIA_surveillance_state: "Panopticon"
 SIA_surveillance_state_desc: "The agency's mandate is stretched to its limit, detection and defensive capability raised as high as the law allows and then a little further. Businesses chafe under the scrutiny, the treasury bleeds political capital, and stability pays the difference."
 SIA_accountable_oversight: "Rule of Law"
 SIA_accountable_oversight_desc: "Judicial review, parliamentary oversight, and public reporting requirements are bolted onto the agency, trading raw detection power for legitimacy and lower corruption. The service is slower and less omniscient, but it answers to someone besides itself."

 SIA_national_intelligence_idea: "National Intelligence Doctrine"
 SIA_national_intelligence_idea_desc: "The new agency's founding ethos spreads through the bureaucracy: information is power, and every ministry now feeds it upward. The habit of watching outlasts whichever government happens to be in office."

 SIA_territorial_defense: "Homeland Defence Doctrine"
 SIA_territorial_defense_desc: "The Kingdom's soldiers are drilled to hold ground rather than chase it. Formations dig in, engineers survey the frontier for permanent works, and a defensive doctrine takes hold across the armed forces, hardening the infantry and quickening the pace of fortification before the first shot is ever fired."

 SIA_shorad_defense: "Short-Range Air Defence"
 SIA_shorad_defense_desc: "Short-range missiles, radar-cued guns, and hardened AA sites are woven into a single overlapping shield. Enemy aircraft that stray over Thai skies find every approach already ranged and every battery ready to answer."
 SIA_border_fortification_program: "Border Fortification Program"
 SIA_border_fortification_program_desc: "The Corps of Engineers is handed a standing mandate and a standing budget: survey, pour, and entrench along the whole of the frontier, the long and thinly held Lao border included, so that fresh works rise faster and dug-in troops hold harder wherever they are needed."
 SIA_anti_amphibious_command: "Anti-Amphibious Command"
 SIA_anti_amphibious_command_desc: "A dedicated command studies every beach and river mouth an invader might use. Coastal batteries, layered sensors, and drilled reaction forces make a landing on the Kingdom's shores a bloody and uncertain gamble."
 SIA_defend_myanmar_border: "Fortify the Myanmar Frontier"
 SIA_defend_myanmar_border_desc: "The rugged western march with Myanmar runs the length of the Kingdom. Bunker lines and prepared positions are dug into the passes and river valleys, turning the difficult terrain into a wall."
 SIA_defend_cambodia_border: "Fortify the Cambodian Frontier"
 SIA_defend_cambodia_border_desc: "Memories of the clashes at Preah Vihear are still fresh. The eastern border is hardened with fresh works so that no future dispute finds the Kingdom's soldiers standing in the open."
 SIA_defend_malaysia_border: "Fortify the Malaysian Frontier"
 SIA_defend_malaysia_border_desc: "The restless deep south is laced with bunkers and strongpoints, anchoring the border with Malaysia and giving the garrisons of Pattani hard ground to fall back on."
 SIA_fortress_thailand: "Fortress Thailand"
 SIA_fortress_thailand_desc: "Every frontier is walled, every approach is ranged. Fighting on home soil, Thai formations strike and hold with the confidence of a defender who knows the ground. An invader bleeds away in the heat, the hills, and the endless prepared lines."

 SIA_defend_myanmar_border_tt: "Builds §YLevel 2§! land forts in §Y9§! border provinces, immediately.\n - §YNorthern Thailand§!: 4 provinces\n - §YCentral Thailand§!: 2 provinces\n - §YSouthern Thailand§!: 3 provinces"
 SIA_defend_cambodia_border_tt: "Builds §YLevel 2§! land forts in §Y6§! border provinces, immediately.\n - §YCentral Thailand§!: 3 provinces\n - §YIsaan§!: 3 provinces"
 SIA_defend_malaysia_border_tt: "Builds §YLevel 2§! land forts in §Y5§! border provinces, immediately.\n - §YPattani§!: 4 provinces\n - §YSouthern Thailand§!: 1 province"

 # SIA_resource_sovereignty capstone decisions
 SIA_sovereign_wealth_fund_allocation: "Allocate the Sovereign Wealth Fund"
 SIA_sovereign_wealth_fund_allocation_desc: "Direct another tranche of resource royalties into the sovereign fund's overseas portfolio. The allocation locks up capital for a year before its returns start feeding back into the budget."
 SIA_state_resource_stake: "Take a State Resource Stake"
 SIA_state_resource_stake_desc: "The Treasury buys directly into the mining and energy concessions rather than just taxing them. The cash comes in fast; so does the paperwork nobody wants to look at too closely."

 # SIA_escape_the_trap capstone event
 thailand.436.t: "Escaping the Middle-Income Trap"
 thailand.436.d: "The statisticians confirm it: Thailand has cleared the income threshold that has trapped so many of its neighbors for a generation. Factories that once assembled parts for others now design them. The question in Cabinet is what to do with the moment."
 thailand.436.a: "Broadcast the achievement"
 thailand.436.b: "Bank the dividend"

 # Force-model fork: the Old Guard and its two exits
 SIA_the_army_question: "The Question of the Army"
 SIA_the_army_question_desc: "A general for every couple hundred soldiers, promotion running on Class and faction before merit, and a wage bill fattened by businesses that have nothing to do with defense. The Kingdom's army works, but not at soldiering. Somebody has to decide what kind of army this is going to be."
 SIA_the_professional_turn: "The Professional Turn"
 SIA_the_professional_turn_desc: "Fewer soldiers, better trained, answering to merit instead of the reshuffle list. It is the harder road, and it puts every general with a business to protect on notice."
 SIA_the_reshuffle_list: "The Reshuffle List Is Not a War Plan"
 SIA_the_reshuffle_list_desc: "The annual reshuffle is the RTARF's true operating rhythm and it is brought under a civilian minister's signature instead of the barracks' own arithmetic. Command starts to answer to the government of the day."
 SIA_retire_the_experts: "Retire the Experts"
 SIA_retire_the_experts_desc: "Every senior graduate is owed a supernumerary 'expert' or 'specialist' star billet, whether or not the post does anything. Buy the honorary generals out and close the billets behind them."
 SIA_close_the_ledger: "Close the Ledger"
 SIA_close_the_ledger_desc: "The army television channel, the golf courses, the land holdings and the welfare schemes that ran on soldiers' unpaid labor are handed to civilian administration. Barracks life gets smaller. The budget gets honest."
 SIA_break_the_class_ladder: "Break the Class Ladder"
 SIA_break_the_class_ladder_desc: "Promotion by pre-cadet Class and unit faction, Wongthewan against Burapha Phayak, gives way to promotion on record. It costs the old networks their grip on who commands next."
 SIA_all_volunteer_force: "The All-Volunteer Force"
 SIA_all_volunteer_force_desc: "The army built entirely on those who choose it: better trained, better organized, and paid what that costs. A broadly competent force, at a standing wage the treasury will carry for good."
 SIA_the_elite_spearhead: "The Elite Spearhead"
 SIA_the_elite_spearhead_desc: "Rather than professionalize the whole army, concentrate the investment. A small special-forces tip, expensively equipped and expensively kept, built to punch far above the weight of the force behind it."
 SIA_high_readiness_army: "The High-Readiness Army"
 SIA_high_readiness_army_desc: "Standing formations kept at a war footing: drilled, planned for, and scouted ahead of contact. Readiness like this is never free to maintain, but it means the army that shows up is the army that was promised."
 SIA_the_minister_decides: "The Council Advises, the Minister Decides"
 SIA_the_minister_decides_desc: "The Supreme Command Council keeps its seat at the table, but the decisions are the civilian minister's to make and the generals' to carry out. It is the reform the old guard fights hardest, and the one that makes every other reform stick."
 SIA_the_conscript_host: "The Conscript Host"
 SIA_the_conscript_host_desc: "Numbers over polish. A wider draft fills the ranks cheaply, the treasury stops bleeding for a bloated professional wage bill, and the officer corps keeps every privilege it already has."
 SIA_fill_the_quota: "Fill the Quota"
 SIA_fill_the_quota_desc: "The annual conscription lottery reaches deeper into the eligible pool. More names drawn means more boots filled, and a lower bar to clear to wear the uniform."
 SIA_the_boys_in_black: "The Boys in Black Return"
 SIA_the_boys_in_black_desc: "The Thahan Phran, the volunteer border rangers, are doubled in strength. Lightly paid and locally raised, they hold the frontier villages and bleed an invader on ground they know better than any regular formation."
 SIA_or_sor_grid: "An Or Sor in Every Tambon"
 SIA_or_sor_grid_desc: "The village defense volunteers, the Or Sor, are stood up tambon by tambon across the countryside. It is a militia grid that needs no supply line, because it never leaves home."
 SIA_cheap_steel_many_hulls: "Cheap Steel, Many Hulls"
 SIA_cheap_steel_many_hulls_desc: "Arm the mass from Thai plants instead of foreign catalogues. The kit is simpler and the edge is duller, but the arms factories turn it out fast and turn it out cheap."
 SIA_the_barracks_economy: "The Barracks Economy"
 SIA_the_barracks_economy_desc: "Let the generals' businesses pay for the mobilization instead of fighting them. The channel, the golf courses, and the rest of the portfolio open their books to the war chest, money now and corruption for good."
 SIA_reserve_of_the_realm: "Reserve of the Realm"
 SIA_reserve_of_the_realm_desc: "Every man who ever wore the uniform is registered, tracked, and ready for recall. The reserve rolls swell and the call-up runs faster, at the cost of a training pipeline stretched thinner to cover it."
 SIA_the_old_guard_endures: "The Command That Never Sleeps"
 SIA_the_old_guard_endures_desc: "The mass army is made permanent, the wage bill finally brought back to what the treasury can bear, and with it the officer corps that runs alongside it. Civilian control is off the table for good. The Old Guard has simply learned to live within its means."

 SIA_swf_windfall: "Sovereign Fund Windfall"
 SIA_swf_windfall_desc: "This year's allocation is paying out. The returns cushion the budget until the position is drawn down."

