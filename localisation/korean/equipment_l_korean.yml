 OMA_infantry_weapons_2_desc: "G3A3는 G3 시리즈 중 가장 잘 알려진 버전입니다. 개선된 후방 드럼 조준기와 전방 조준기, 소염기/머즐 브레이크, 고정식 플라스틱 개머리판, 그리고 플로팅 배럴과 접촉하지 않는 플라스틱 핸드가드가 특징입니다. 핸드가드는 슬림형 통풍식과 와이드형 두 가지 버전으로 출시되었으며, 와이드형은 양각대 장착을 통해 안정성을 향상시킬 수 있습니다."
 OMA_infantry_weapons_3_desc: "M16A2 소총의 개발은 원래 미 해병대가 베트남 전쟁에서 XM16E1과 M16A1 소총을 사용해 얻은 전투 경험을 바탕으로 요청한 것이었습니다. 이 소총은 1982년 국방부에서 \"미군 5.56mm 소총 M16A2\"로 공식 채택되었습니다. 미 해병대는 1980년대 초중반에 이 소총을 미군 최초로 도입했으며, 미 육군은 1980년대 후반에 뒤이어 도입했습니다."
 OMA_infantry_weapons_4_desc: "헤클러앤코흐 G36(게베르 36)은 5.56x45mm 구경의 돌격소총으로, 1990년대 초 독일 무기 제조업체 헤클러앤코흐에서 더 무거운 7.62x51mm G3 모델을 대체하기 위해 개발되었습니다. 1990년대 중반 독일 연방군에 채택되어 G3를 대체했으며, 이후 수출용으로도 인기를 얻어 독일, 스페인, 영국 등 여러 국가의 군대와 경찰에서 실전에 투입되었습니다."
 OMA_infantry_weapons_5_desc: "M4 카빈 소총은 M16 돌격소총의 단축형 및 경량형 변형 모델입니다. M4는 5.56x45mm NATO 탄을 사용하는 공랭식, 직접 가스 작동식, 탄창식 카빈 소총입니다. 14.5인치(370mm) 길이의 총열과 접이식 개머리판을 갖추고 있습니다."
 UAE_infantry_weapons_2_desc: "G3A3는 G3 시리즈 중 가장 잘 알려진 버전입니다. 개선된 후방 드럼 조준기와 전방 조준기, 소염기/머즐 브레이크, 고정식 플라스틱 개머리판, 그리고 플로팅 배럴과 접촉하지 않는 플라스틱 핸드가드가 특징입니다. 핸드가드는 슬림형 통풍식과 와이드형 두 가지 버전으로 출시되었으며, 와이드형은 양각대 장착을 통해 안정성을 향상시킬 수 있습니다."
