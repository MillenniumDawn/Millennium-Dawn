l_english:
 STALKER.100.t: "Get Out of Here, Stalker"
 STALKER.100.d: "A conscript at a Cordon checkpoint was filmed shouting at a stalker to get out of here. The clip is everywhere, and half the country now says it to each other at bus stops."
 STALKER.100.a: "Put it on the recruitment posters."
 STALKER.100.b: "Remind the checkpoint to shout less and patrol more."
 STALKER.100.b_tt: "The Zone gains §G2§! §Ycontainment§!."
 STALKER.101.t: "Cheeki Breeki"
 STALKER.101.d: "Bandits in the Cordon have adopted a battle cry that nobody can translate, and a folk song that nobody can get out of their heads. Recruitment is up."
 STALKER.101.a: "Iv damke."
 STALKER.101.a_tt: "§YBandit§! influence in the Zone has already risen by §R5§!."
 STALKER.102.t: "Another Strelok"
 STALKER.102.d: "A stalker at the Bar has announced that he is the legendary Strelok. He is the third this month. Curious visitors are arriving to see which one is real."
 STALKER.102.a: "How many Streloks are there?"
 STALKER.102.a_tt: "The Zone has already gained §Y5§! stalkers."
 STALKER.103.t: "The Trader Raises His Prices"
 STALKER.103.d: "The old trader in the bunker at the Cordon has doubled what he charges our scientists for sausage, vodka and anti-radiation drugs, and insists he is losing money on every deal."
 STALKER.103.a: "Pay him. Nobody else stocks the good vodka."
 STALKER.103.a_tt: "The treasury loses §R$0.1§! billion."
 STALKER.103.b: "Shut the bunker down."
 STALKER.103.b_tt: "The Zone loses up to §G5§! §YBandit§! influence and up to §R5§! stalkers who relied on him."
