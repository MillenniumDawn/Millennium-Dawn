 MD_artc_army_1: "Field Sustainment Standards I"
 MD_artc_army_1_desc: "Common standards for field maintenance, casualty care and fuel discipline keep formations at strength between battles."
 MD_artc_army_2: "Field Sustainment Standards II"
 MD_artc_army_2_desc: "$MD_artc_army_1_desc$"
 MD_artc_army_3: "Field Sustainment Standards III"
