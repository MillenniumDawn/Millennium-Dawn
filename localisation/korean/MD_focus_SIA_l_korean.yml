l_korean:
 charoenchai_hinthao: "짜런차이 힌타오"
 charoenchai_hinthao_desc: "방어 교리와 남부 국경에서 얻은 혹독한 교훈으로 명성을 쌓은 2020년대 세대의 태국 왕립 육군 총사령관입니다. 그는 휘하 부대가 진지를 사수하고 공격자에게 출혈을 강요하도록 훈련시킵니다."
 songwit_noonpakdee: "송윗 눈빡디"
 songwit_noonpakdee_desc: "과시보다는 참모 업무와 조직 관리로 알려진 태국 왕립 육군의 고위 장교입니다. 그는 육군 부대의 인원과 보급, 즉응 태세를 유지하며 고위 지휘부에 따르는 정치에도 능숙합니다."
 adung_phaniam: "아둥 파니암"
 adung_phaniam_desc: "현대 함대를 이끄는 태국 왕립 해군의 제독으로, 주력함과 수상 전투 교리에 정통합니다. 그는 타이만 너머에서도 존재감을 느낄 수 있는 해군을 주장합니다."
 punpakdee_pattanakul: "푼빡디 빳따나꾼"
 punpakdee_pattanakul_desc: "개혁 세대에 속하는 태국 왕립 공군 장교로, 군을 전문적 기준과 현대적 기체, 그리고 퍼레이드용 편대가 아니라 실제 승무원을 배출하는 훈련 체계로 이끌고 있습니다."
 intel_chief_nia: "국가정보국장"
 intel_chief_nia_desc: "태국 국가정보국의 수장은 국가의 민간 정보 활동을 총괄하며, 지방과 국경, 궁정 네트워크에서 올라오는 보고를 엮어 정부를 위한 하나의 그림으로 만들어 냅니다."
 thailand_focus: "태국 중점 트리"
 SIA_the_2001_election_shortcut: "2001년 선거"
 SIA_lost_territories_shortcut: "잃어버린 영토"
 SIA_armed_forces_modernization_shortcut: "군 현대화"
 SIA_recover_from_97_crisis_shortcut: "똠얌꿍 위기"
 SIA_asean_centrality_shortcut: "ASEAN 중심성"
 SIA_the_southern_question_shortcut: "남부 문제"
 SIA_kra_gateway_shortcut: "크라 관문"
 SIA_recover_from_97_crisis: "똠얌꿍 위기로부터의 회복"
 SIA_recover_from_97_crisis_desc: "1997년 방콕에서 똠얌꿍 위기가 시작되었습니다. 바트화의 페그제를 방어하느라 외환 보유고를 소진한 태국은 환율을 변동시키고 IMF 스탠바이 협정을 받아들일 수밖에 없었습니다. 이 구제 금융은 국가의 지급 능력을 지켜 주었지만 간섭적인 감독과 경제적 존엄의 상실이라는 대가를 치르게 했습니다. 마지막 단계가 남아 있습니다. 회복을 마무리하고, IMF 자금을 조기 상환하며, 완전한 주권을 되찾는 것입니다."
 SIA_the_1997_constitution: "국민 헌법"
 SIA_the_1997_constitution_desc: "1997년 헌법은 유례없는 대중 참여 속에 기초되었으며, 선출직 상원과 인권 보장, 강력한 반부패 기구를 약속합니다. 과연 이 헌법이 태국 정치 속에서 살아남을 수 있을까요?"
 SIA_repay_the_imf: "IMF 조기 상환"
 SIA_repay_the_imf_desc: "태국은 2003년 7월, 예정보다 2년 앞서 스탠바이 자금을 마지막까지 상환했습니다. 조기 상환은 원금 자체보다 신호로서의 의미가 더 큽니다. 시장은 더 이상 태국 채무를 구제 금융 위험으로 평가하지 않게 되고, 왕국은 다시 더 낮은 금리로 차입할 수 있게 됩니다."
 SIA_amazing_thailand: "어메이징 타일랜드"
 SIA_amazing_thailand_desc: "위기의 시기를 버티게 해 준 관광 캠페인이 국가 전략이 됩니다. 푸껫에서 치앙마이까지 전 세계를 미소의 나라로 초대하고, 세계는 경화로 값을 치릅니다."
 SIA_rice_and_rubber: "아시아의 쌀 그릇"
 SIA_rice_and_rubber_desc: "태국은 세계 최대의 쌀 수출국이자 고무 강국입니다. 이산과 남부의 농업 경제를 현대화하여 농업의 저력을 수출 수익으로 바꾸십시오."
 SIA_detroit_of_asia: "아시아의 디트로이트"
 SIA_detroit_of_asia_desc: "일본과 미국의 자동차 제조사들이 동부 해안을 지역 생산 기지로 삼았습니다. 자동차 산업에 더욱 힘을 쏟아 '메이드 인 타일랜드'를 세계적인 기준으로 만드십시오."
 SIA_suvarnabhumi_airport: "수완나품 공항"
 SIA_suvarnabhumi_airport_desc: "수십 년간 계획되어 온 방콕의 새 공항은 동남아시아의 위대한 항공 허브가 될 것입니다. 푸껫 같은 지방 관문들이 이곳으로 승객을 모아 주고 태국 항공 산업 전체를 끌어올릴 것입니다. 우리가 건설을 마칠 수만 있다면 말입니다."
 SIA_eastern_economic_corridor: "동부 해안"
 SIA_eastern_economic_corridor_desc: "촌부리에서 라용에 이르는 산업 회랑을 항만, 정유소, 공장, 철도로 더욱 확충합니다. 태국 경제의 엔진실입니다."
 SIA_medical_hub: "아시아의 의료 허브"
 SIA_medical_hub_desc: "개발도상국 가격의 세계적 수준의 병원들. 의료 관광이 전 세계에서 환자와 명성을 불러옵니다."
 SIA_education_for_the_future: "왕국의 교육"
 SIA_education_for_the_future_desc: "태국의 교실은 여전히 문제 해결보다 암기를 보상하며, 교사의 질은 방콕과 지방 사이에서 크게 차이가 납니다. 현대적인 교육 과정과 더 잘 훈련된 교사, 산업 수요에 맞춘 직업 교육 과정이 고소득 경제를 향한 모든 노력의 토대입니다."
 SIA_asean_centrality: "ASEAN 중심성"
 SIA_asean_centrality_desc: "방콕은 1967년 ASEAN이 창설된 곳입니다. 이웃 국가들에 다시 투자하십시오. 안정적이고 우호적인 동남아시아야말로 태국의 최선의 안전 보장이기 때문입니다."
 SIA_treaty_ally: "주요 비NATO 동맹국"
 SIA_treaty_ally_desc: "아시아에서 가장 오래된 미국과의 조약 관계입니다. 코브라 골드를 심화하고, 미국산 장비를 받아들이며, 안전 보장이 유효한 동안 그 혜택을 챙기십시오."
 SIA_bamboo_bends_east: "대나무, 동쪽으로 휘다"
 SIA_bamboo_bends_east_desc: "태국 외교는 바람에 따라 휘며, 지금 바람은 베이징에서 불어오고 있습니다. 중국의 투자, 중국의 철도, 중국의 시장. 그 모두에는 아직 협상 중인 대가가 따릅니다."
 SIA_the_2001_election: "2001년 선거"
 SIA_the_2001_election_desc: "국민 헌법 아래 치러지는 첫 선거입니다. 위기는 기존의 합의를 깨뜨렸습니다. 새로운 포퓰리스트 세력과 전통적인 권력 네트워크, 그리고 민주당이 국가의 방향을 놓고 경쟁합니다."
 SIA_thai_rak_thai: "타이락타이"
 SIA_thai_rak_thai_desc: "타이인은 타이인을 사랑한다. 탁신 친나왓의 압승이 선거 지형을 다시 그립니다. 이제 농촌인 북부와 북동부가 누가 통치할지를 결정하며, 그들은 자신들의 대변자를 선택했습니다."
 SIA_thaksinomics: "탁시노믹스"
 SIA_thaksinomics_desc: "이중 트랙 경제입니다. 첫 번째 트랙은 세계 시장을 향한 수출을 우선시하고, 두 번째 트랙은 풀뿌리 및 국내 기업가 정신을 중시합니다. 이 접근법은 성장을 강화하지만 비판자들은 빈부 격차를 키운다고 말합니다."
 SIA_30_baht_healthcare: "30바트 의료"
 SIA_30_baht_healthcare_desc: "어떤 질병이든, 어느 병원이든, 30바트. 보편적 보장은 수백만 농촌 태국인의 삶을 바꾸고 그들의 친나왓 정당에 대한 충성심을 굳힙니다."
 SIA_village_fund: "100만 바트 마을 기금"
 SIA_village_fund_desc: "왕국의 모든 마을과 도시 공동체에 100만 바트의 순환형 소액 대출을 제공하는, 지금까지 시도된 가장 큰 규모의 소액 금융 프로그램 중 하나입니다."
 SIA_otop: "한 땀본 한 제품"
 SIA_otop_desc: "모든 하위 행정구역이 대표적인 지역 특산품을 개발하고 브랜드화하여 수출합니다. 가내 공업이 국가 전략이 됩니다."
 SIA_dual_track_economy: "이중 트랙 경제"
 SIA_dual_track_economy_desc: "수출은 증가하고, 농촌 소득은 증가하며, 부채는 조기 상환되었습니다. 비판자들이 그 방식에 대해 뭐라고 하든, 성적표는 정부에 유리하게 기울고 있습니다."
 SIA_war_on_drugs: "마약과의 전쟁"
 SIA_war_on_drugs_desc: "메스암페타민 거래를 근절하기 위한 3개월간의 캠페인입니다. 인기를 끌 것입니다. 하지만 정부를 수년간 따라다닐 심각한 인권 문제 제기도 불러올 것입니다."
 SIA_ceo_premier: "CEO 총리"
 SIA_ceo_premier_desc: "나라를 회사처럼 운영하십시오. 각 부처에 KPI를 부여하고, 지방에서 이동 내각 회의를 열며, 관료주의에 대한 조급함을 드러냅니다. 효율적이지만 '아니오'라고 말하도록 설계된 모든 제도를 부식시킵니다."
 SIA_dominant_party_state: "하나의 정당, 하나의 태국"
 SIA_dominant_party_state_desc: "연립 파트너들을 흡수하고, 방송을 장악하며, 모든 보궐선거에서 승리하십시오. 선거 정치는 계속되지만 압도적인 단 하나의 선택지만 남습니다."
 SIA_consolidate_democracy: "민주주의 공고화"
 SIA_consolidate_democracy_desc: "투표로 권력을 얻고, 성과로 그것을 유지하며, 제도는 그대로 남겨 두십시오. 포퓰리스트 조직이 스스로 국민 헌법에 복종합니다."
 SIA_normalization_friction: "정상화의 마찰"
 SIA_normalization_friction_desc: "구 정당 조직의 후원 네트워크는 예정대로 해체되지 않습니다. 정당이 정도를 걷는 동안에도 등록 말소에 저항하며, 이를 정리하는 데는 누구의 약속보다 오래 걸립니다."
 SIA_thaksin_forever: "영원한 탁신"
 SIA_thaksin_forever_desc: "법원이 매수되고 상원이 충성하는 한 야당은 의미가 없습니다. 이 프로젝트가 끝나야 할 이유가 있습니까? 지배 정당은 영구 정당이 됩니다."
 SIA_shinawatra_dynasty: "친나왓 왕조"
 SIA_shinawatra_dynasty_desc: "운동은 한 명의 지도자보다 오래 지속됩니다. 당의 얼굴은 누이나 딸로 바뀔 수 있지만, 실질적인 권력은 여전히 탁신 친나왓과 그의 사람들에게 있습니다."
 SIA_the_old_order: "네트워크 군주제"
 SIA_the_old_order_desc: "궁정, 군부, 사법부, 관료제. 이들은 태국을 모든 폭풍 속에서 이끌어 온 제도입니다. 이들은 민간인의 선거가 모든 것을 결정하도록 내버려 두어서 70년간의 격변을 살아남은 것이 아닙니다."
 SIA_privy_council: "추밀원"
 SIA_privy_council_desc: "국왕의 고문들, 즉 퇴역 장군과 판사, 정치가들은 기득권 네트워크의 조용한 중심에 앉아 있습니다. 선출된 정부를 우회하는 경로를 강화하십시오."
 SIA_royal_guidance: "국왕의 말씀"
 SIA_royal_guidance_desc: "매년 12월 국왕이 말씀하면 국민은 귀를 기울입니다. 생일 연설은 정부를 축복할 수도 있고 조용히 축복을 거둘 수도 있으며, 이는 어떤 투표나 장관도 감히 맞서지 못하는 존경의 힘입니다. 왕좌의 목소리는 나라를 정치적 광기로부터 끌어당깁니다."
 SIA_three_pillars: "민족, 종교, 국왕"
 SIA_three_pillars_desc: "찻, 삿사나, 프라 마하 카삿. 삼색기가 시민 교리문답이 되었습니다. 학교에는 승려가, 모든 벽에는 국왕이 있고, 국가는 하나의 도덕적 몸체가 됩니다. 이는 강력한 접착제이지만, 모스크가 가득 차 있고 교리문답이 닫힌 문으로 읽히는 곳에서는 그렇지 않습니다."
 SIA_yellow_shirts: "민주주의 민중 동맹 집회"
 SIA_yellow_shirts_desc: "민주주의 민중 동맹이 왕실의 노란색 옷을 입고 방콕의 거리를 가득 메우며 선출된 정부의 퇴진을 요구합니다. 도시 중산층은 자신들의 편을 선택했습니다."
 SIA_the_2006_coup: "9월 쿠데타"
 SIA_the_2006_coup_desc: "총리가 해외에 있는 사이 탱크가 방콕으로 진입합니다. 헌법은 정지되고 민주 개혁 위원회가 통제권을 장악합니다. 정치의 순환이 다시 시작됩니다."
 SIA_guardian_of_the_nation: "국가의 수호자"
 SIA_guardian_of_the_nation_desc: "군의 자기상이 교리가 됩니다. 정치 위에 있으면서도 국가를 위협하는 어떤 정치든 끝낼 자격이 있습니다. 군의 거부권을 제도화하십시오."
 SIA_judicial_activism: "사법화"
 SIA_judicial_activism_desc: "법원 판결이면 충분한데 왜 탱크를 보내겠습니까? 정당 해산과 피선거권 박탈이 기득권층이 선호하는 메스가 됩니다."
 SIA_the_2014_coup: "국가평화질서위원회"
 SIA_the_2014_coup_desc: "먼저 계엄령, 그다음 쿠데타. 국가평화질서위원회는 정치를 무기한 정지시키고 온 나라에 \\"태도 교정\\"을 가져옵니다."
 SIA_lese_majeste_enforcement: "신성한 제도의 수호"
 SIA_lese_majeste_enforcement_desc: "형법 112조는 군주제를 모욕으로부터 보호합니다. 이를 가차 없이 집행하고, 모든 야권 운동이 말을 가려서 하는 것을 지켜보십시오."
 SIA_isoc_state: "ISOC 국가"
 SIA_isoc_state_desc: "모든 지방에 군의 정치적 팔을 두고 있는 국내치안작전사령부(ISOC)가 '안보' 사안에 관해 병행 정부가 되며, 특히 최남단이 그 중심입니다."
 SIA_isoc_overreach_backlash: "조용한 대중의 불안"
 SIA_isoc_overreach_backlash_desc: "국내 안보 기구가 최남단뿐만 아니라 일상생활에까지 더 깊이 침투하고 있습니다. 평범한 태국인들이 순찰과 검문소, 군의 움직임에 따른 강화된 보안을 알아차리기 시작합니다."
 SIA_the_2017_constitution: "유도된 민주주의"
 SIA_the_2017_constitution_desc: "전원 임명제 상원, 비선출 총리 조항, 미래 정부를 구속하는 20년 국가 전략. 선거는 재개되겠지만 우리 안에서 치러질 것입니다."
 SIA_perpetual_guardianship: "영구 후견"
 SIA_perpetual_guardianship_desc: "암묵적으로 알려져 왔던 것을 공식화합니다. 군은 영구적인 헌법상의 심판자가 됩니다. 이제 헌법에 새겨진 일종의 안정입니다."
 SIA_royal_restoration: "왕좌의 복권"
 SIA_royal_restoration_desc: "어떤 정부도 감히 하지 못한 데까지 나아가십시오. 정치 네트워크의 실마리를 모아 공식적으로 왕궁의 손에 넘기십시오. 짜끄리 왕조가 절대 군주제로서 왕국을 직접 통치하는 체제로 복귀합니다."
 SIA_seeds_of_reform: "개혁의 씨앗"
 SIA_seeds_of_reform_desc: "포퓰리스트와 왕당파라는 낡은 이분법 바깥에서 제3의 세력이 모이고 있습니다. 젊고, 도시적이며, 온라인에 능하고, 쿠데타에 신물이 난 사람들입니다.\n\n제3의 세력을 지지하면 왕국이 걷고 있던 모든 정치 노선이 폐기되고 왕국은 개혁주의 줄기에 전념하게 됩니다."
 SIA_future_forward: "앞으로 나아갈 미래"
 SIA_future_forward_desc: "초선 정치인들로 이루어진 새로운 정당이 악순환을 끊겠다고 약속합니다. 탈군사화, 분권화, 민주화. 기득권층은 늘 쓰던 수단을 꺼내 들지만 이 새로운 야당이 예상보다 더 강하게 결집하고 있음을 알게 됩니다."
 SIA_three_demands: "세 가지 요구"
 SIA_three_demands_desc: "의회 해산. 국민에 대한 협박 중단과 새 헌법 기초. 학생들은 말할 수 없었던 것을 소리 내어 말하고, 태국 정치의 천장이 움직입니다."
 SIA_demilitarize_politics: "군인은 정치에서 물러나라"
 SIA_demilitarize_politics_desc: "징병 남용을 끝내고, 장성들의 미디어 제국과 이사직을 정리하며, 군을 정치에서 몰아내십시오. 그들은 이에 감사하지 않을 것입니다."
 SIA_civilian_control: "문민 우위"
 SIA_civilian_control_desc: "민간인이 운영하는 국방부, 의회가 심사하는 진급, 감사관에게 책임을 지는 군 예산. 급진적인 것은 방콕에서뿐입니다."
 SIA_amend_section_112: "112조 개정"
 SIA_amend_section_112_desc: "왕실모독죄를 개혁하십시오. 고발 가능한 사람을 제한하고, 형량에 상한을 두며, 정치적 발언에 대한 적용을 중단합니다. 태국에서 가장 위험한 법안으로 여겨지며, 빠져나갈 길도 되돌아올 길도 없을지 모릅니다."
 SIA_decentralize: "방콕 너머로"
 SIA_decentralize_desc: "모든 지방의 선출직 도지사와 수도를 거치지 않는 예산. 방콕은 너무 오랫동안 나라 전체였습니다."
 SIA_break_the_monopolies: "독점 타파"
 SIA_break_the_monopolies_desc: "주류 복점, 통신 사업권, 재벌의 상호 지분 보유. 태국 경제의 병목 지점을 열어젖히고 공정한 경쟁을 들이십시오."
 SIA_welfare_state: "태국식 복지 국가"
 SIA_welfare_state_desc: "누더기 같은 보조금에서 연금, 보육, 실업 보험이라는 진정한 안전망으로. 비용이 많이 들며, 이 정부 이후의 어떤 정부도 감히 되돌리지 못할 것입니다."
 SIA_marriage_equality: "동남아시아 최초"
 SIA_marriage_equality_desc: "혼인 평등이 동남아시아 최초로 법제화됩니다. 전 세계가 주목하는 개혁이며, 기득권층이 맞서 싸우지 않는 드문 개혁입니다."
 SIA_deep_south_peace: "최남단의 평화"
 SIA_deep_south_peace_desc: "왕국 내의 자치, 과거 학대에 대한 정의, 파타니-말레이 정체성의 존중. 반란은 검문소가 아니라 협상 테이블에서 끝납니다."
 SIA_consolidated_democracy: "공고화된 민주주의"
 SIA_consolidated_democracy_desc: "시민이 쓴 헌법, 병영에 머무는 군인, 판결하되 통치하지 않는 법원. 쿠데타의 순환이 마침내 끊어지고 상상조차 할 수 없는 일이 됩니다."
 SIA_reform_transition_costs: "이행기의 세원"
 SIA_reform_transition_costs_desc: "제도를 개편하는 것은 그 재원 조달 방식을 개편하는 것을 뜻합니다. 새 체제가 자리 잡는 동안 세수 징수는 뒤처집니다."
 SIA_a_new_republic: "새로운 공화국"
 SIA_a_new_republic_desc: "한 번도 물어서는 안 되었던 질문이 투표에 부쳐집니다. 결과가 어떻든 새로 나타날 태국은, 만약 하나로 유지된다면, 알아볼 수 없는 모습일 것입니다."
 SIA_lost_territories: "잃어버린 영토"
 SIA_lost_territories_desc: "1893년. 1904년. 1907년. 1909년. 모든 태국 학생은 시암이 제국주의 프랑스와 영국에 의해 잘려 나간 해를 배웁니다. 피분 세대는 한때 그것을 되찾으러 진군했습니다. 시암의 진짜 지도는 아직 기록 보관소에 있습니다."
 SIA_pan_thai_movement: "하나의 타이 민족"
 SIA_pan_thai_movement_desc: "위칫 와타칸의 웅대한 논지를 되살리십시오. 태국인, 라오인, 샨족은 식민지 국경으로 갈라진 하나의 타이 민족이며, 태국 국기 아래의 재결합을 기다리고 있습니다."
 SIA_rearmament: "왕국 재무장"
 SIA_rearmament_desc: "야망에는 강철이 필요합니다. 감사관들이 본 적 없는 수준으로 국방 예산을 올리고 왕국의 산업을 전시 체제로 전환하십시오."
 SIA_modernize_the_rta: "태국 왕립 육군 현대화"
 SIA_modernize_the_rta_desc: "신형 주력 전차, 신형 보병전투차, 추첨제 징집병을 대신하는 직업 군인. 태국 왕립 육군은 쿠데타 임무를 넘어선 전쟁에 대비합니다."
 SIA_blue_water_navy: "두 대양 해군"
 SIA_blue_water_navy_desc: "항공모함 짜끄리 나루에벳은 마침내 제대로 된 항공 전력과 호위함을 얻고, 잠수함 계획은 더 이상 웃음거리가 되지 않습니다. 두 해안, 두 함대."
 SIA_gripen_squadrons_rearm: "수완나품의 평화"
 SIA_gripen_squadrons_rearm_desc: "그리펜, 조기 경보기, 데이터링크 방공망. 지역 전쟁의 첫 주를 이기기 위해 만들어진 작은 공군입니다."
 SIA_dti_self_reliance: "DTI 자력 갱생"
 SIA_dti_self_reliance_desc: "국방기술연구소가 연구 논문에서 생산 라인으로 도약합니다. 태국제 소총, 태국제 장갑차, 태국제 로켓. 어떤 금수 조치도 우리가 직접 만든 것을 막을 수 없습니다."
 SIA_thai_yai: "우리의 타이 야이 형제들"
 SIA_thai_yai_desc: "버마의 샨족은 태국인이 알아들을 수 있는 말을 합니다. 그들의 민병대는 여러 세대에 걸쳐 랑군에 맞서 싸워 왔습니다. 그들에게 부족한 것은 후원자와 함께 싸울 깃발뿐입니다."
 SIA_mekong_destiny: "메콩의 운명"
 SIA_mekong_destiny_desc: "사이냐불리와 참파삭은 생존해 있는 사람들의 기억 속에 시암의 땅이었으며, 라오인은 태국인과 가장 가까운 동족입니다. 우리를 가르는 강이 하나의 나라를 흐를 수도 있습니다."
 SIA_preah_vihear: "그 사원은 우리의 것이다"
 SIA_preah_vihear_desc: "프레아비히어에 관한 1962년 ICJ 판결은 아직도 많은 태국인의 가슴을 태우고 있습니다. 밧탐방과 시엠레아프에는 생존해 있는 사람들의 기억 속에 태국 국기가 휘날렸습니다. 프놈펜과의 국경 분쟁은 더 이상 관리되지 않고 오랜 원한에 다시 불을 붙입니다."
 SIA_lost_sultanates: "1909년 조약은 무효다"
 SIA_lost_sultanates_desc: "끌란딴, 뜨렝가누, 끄다, 쁘를리스. 방콕의 조공국들이 단 한 명의 주민에게도 묻지 않은 채 대영 제국에 넘겨졌습니다. 영국-시암 조약을 규탄하십시오."
 SIA_suwannaphum: "통일된 수완나품"
 SIA_suwannaphum_desc: "고대의 황금의 땅 수완나품이 태국 국기 아래 다시 하나가 되었습니다. 수복한 영토를 왕국에 통합하는 작업을 시작하십시오."
 SIA_victory_monument: "새 승전 기념탑"
 SIA_victory_monument_desc: "랏차위티 로의 오벨리스크는 잃어버린 영토를 위한 마지막 전쟁이었던 1940-41년의 전사자들을 기립니다. 그 후속 기념탑을 세우고, 지역이 스스로 결론을 내리게 하십시오."
 SIA_thailand_4_0: "타일랜드 4.0"
 SIA_thailand_4_0_desc: "모든 것의 부가가치화. 로봇공학, 바이오기술, 디지털 서비스. 정부 청사에서 기획하고 동부 경제 회랑에서 입증되는 4차 산업혁명입니다. 모든 지방이 국가 전략 시행에 따른 생산성 배당을 받습니다."
 SIA_three_airport_rail: "3개 공항 철도 연결"
 SIA_three_airport_rail_desc: "돈므앙, 수완나품, 우타파오를 하나의 고속 노선으로 연결하여 끝에서 끝까지 한 시간이 걸립니다. 태국 역사상 가장 비싼 철도이자 EEC의 척추입니다."
 SIA_u_tapao_aerotropolis: "우타파오 항공 도시"
 SIA_u_tapao_aerotropolis_desc: "베트남 전쟁 시대의 해군 비행장이 정비 격납고와 자유 무역 지구, 그리고 활주로를 중심으로 세워진 번성하는 도시를 갖춘 연간 6,000만 명 규모의 관문으로 탈바꿈합니다."
 SIA_eastern_aviation_city: "동부 항공 도시"
 SIA_eastern_aviation_city_desc: "활주로는 시작에 불과했습니다. 에어버스와 타이 항공이 자유 무역 지구에 정비 및 오버홀 단지를 세우고, 항공 아카데미가 정비사를 양성하며, 화물 터미널이 우타파오를 지역의 관문일 뿐만 아니라 항공우주 작업장으로 만듭니다. 고부가가치 작업이지만 뒷받침하기 까다롭습니다."
 SIA_eec_take_off: "회랑의 도약"
 SIA_eec_take_off_desc: "라용의 전기차 공장, 촌부리의 바이오기술, 차층사오의 항공전자. 동부 경제 회랑은 계획에 그치지 않고 하나의 지역이 됩니다."
 SIA_hedge_the_bets: "양다리 걸치기"
 SIA_hedge_the_bets_desc: "대나무는 바람에 휘었다가 다시 튀어 오릅니다. 워싱턴이나 베이징이 태국이 무엇을 약속했다고 믿든, 태국은 재해석할 수 없는 약속은 아무것도 하지 않았습니다."
 SIA_armed_forces_modernization: "태국 왕립 군대"
 SIA_armed_forces_modernization_desc: "육군, 해군, 공군이 하나의 왕관 아래 있는 왕국의 칼과 방패입니다. 1997년의 붕괴는 조달 사업을 도중에 얼어붙게 하여 절반만 인도된 비행대와 항공기가 없는 항공모함을 남겼습니다. 군을 장악하고 앞으로 수십 년이 따라갈 방향을 정하십시오."
 SIA_gripen_deal: "그리펜 거래"
 SIA_gripen_deal_desc: "사브는 워싱턴이 주지 않을 것을 제공합니다. 완전한 기술 이전, 산업 상쇄 거래, 에리아이 조기 경보기가 모두 패키지에 포함되며, 쿠데타에 대한 훈계는 없습니다."
 SIA_gripen_ef_program: "그리펜 E/F"
 SIA_gripen_ef_program_desc: "F-35는 거부되었고 F-16은 조종사들의 나이보다 오래되었습니다. 차세대 그리펜 E/F는 태국 승무원들이 이미 아는 체계를 유지하며 스웨덴의 생산 라인도 계속 가동하게 합니다."
 SIA_eyes_in_the_sky: "하늘의 눈"
 SIA_eyes_in_the_sky_desc: "이스라엘의 무인 체계인 서처, 헤르메스, 도미네이터는 정글과 국경이 늘 태국 지휘관들에게서 빼앗아 온 것, 곧 지속적인 시야를 제공합니다."
 SIA_chinese_steel: "중국산 강철"
 SIA_chinese_steel_desc: "노린코의 VT-4는 서방 전차 가격의 절반이면서 최종 사용자에 대한 설교 없이 도착합니다. 육군의 미제 M60은 낡아 가고, 공급처는 동쪽으로 옮겨 갑니다."
 SIA_s26t_program: "S26T 잠수함"
 SIA_s26t_program_desc: "위안급 잠수함 3척이 약속되었습니다. 그중 한 척은 실제로 도착할지도 모릅니다. 수출할 수 없는 독일제 엔진과 방어할 수 없는 예산 사이에서 해군의 잠수함 꿈은 모두의 인내심을 시험합니다."
 SIA_chakri_modernization: "기함의 서방식 개장"
 SIA_chakri_modernization_desc: "서방으로 향하는 길은 기함에서도 이어집니다. 스페인에서 건조되어 사타힙에 오래 정박해 있던 HTMS 짜끄리 나루에벳이 미국과 유럽의 전투 체계와 센서를 탑재합니다. 마침내 왕국의 항공모함에 승조원들에게 걸맞은 임무를 주는 NATO 표준 개장입니다."
 SIA_uxv_carrier_conversion: "서방식 드론 비행대"
 SIA_uxv_carrier_conversion_desc: "해리어는 박물관에나 어울리는 물건이 되었지만 스키점프대는 남아 있습니다. 동맹 주요 업체들로부터 사들인 서방의 무인 체계로 기함을 개조하여 무인 항공기와 수상정, 잠수정을 발진시킵니다. 협력국 장비를 운용하는 동남아시아 최초의 UXV 항공모함입니다."
 SIA_telecom_empire: "통신 사업권"
 SIA_telecom_empire_desc: "위성, 이동통신망, 미디어 제국이 모두 통신 재벌들의 정부 아래에서 놀랍도록 번성합니다. 국가 대표 기업과 가족 사업의 경계가 이토록 얇았던 적이 없습니다."
 SIA_prayuth_premiership: "장군의 총리직"
 SIA_prayuth_premiership_desc: "쿠데타 지도자가 군복을 양복으로, 군사정권의 직함을 선출직 직함으로 바꿉니다. 총리에게 투표하는 250명의 임명 상원의원들 덕분에 산술은 편안해집니다."
 SIA_senate_of_appointees: "임명 상원"
 SIA_senate_of_appointees_desc: "250명의 상원의원 모두가 군사 평의회에 의해 선발되었으며, 모두가 누가 통치할지에 대한 표결권을 가집니다. 야당은 선거에서 이길 수 있습니다. 권력을 잡는 것은 또 다른 문제입니다."
 SIA_2020_protest_response: "거리의 청년들"
 SIA_2020_protest_response_desc: "학생들이 세 가지 요구와 세 손가락 경례를 들고 기념물 일대를 가득 메웁니다. 해산이든 대화든 지연이든, 모든 선택지는 다음 세대에게 국가에 관한 무언가를 가르칩니다."
 SIA_orange_wave: "오렌지 물결"
 SIA_orange_wave_desc: "새로운 정치 세대가 온라인으로 조직하고 소액 후원으로 자금을 마련하며, 낡은 후원 네트워크를 물려받을 것이 아니라 삭제해야 할 문제로 취급합니다."
 SIA_digital_democracy: "디지털 민주주의"
 SIA_digital_democracy_desc: "공개 데이터, 온라인 서비스, 이메일에 답하는 국가. 기반시설로서의 투명성이며, 약속과 달리 기반시설은 폐지하기 어렵습니다."
 SIA_creative_economy: "창조 경제"
 SIA_creative_economy_desc: "영화, 음식, 축제, 디자인. 태국의 소프트 파워가 한 부처의 관심과 대차대조표상의 독자 항목을 갖춘 수출 부문이 됩니다."
 SIA_truth_and_reconciliation: "진실과 화해"
 SIA_truth_and_reconciliation_desc: "마약 전쟁의 사망자들, 강경 진압, 최남단의 실종자들. 소환권을 가진 위원회가 공식 기록을 작성합니다. 민주주의는 스스로의 기록을 남기기 때문입니다."
 SIA_the_2005_landslide: "377석 석권"
 SIA_the_2005_landslide_desc: "타이락타이가 의회 500석 중 377석을 차지하여 태국 역사상 최대의 단일 정당 과반을 기록합니다. 구 기득권층의 네트워크는 개표 결과를 침묵 속에 지켜봅니다."
 SIA_rice_pledging_scheme: "쌀 담보 대출 제도"
 SIA_rice_pledging_scheme_desc: "잉락 정부의 대표적인 농촌 프로그램으로, 국가가 시장 가격보다 높은 가격에 농민의 쌀을 매입하여 비축합니다. 마을들은 혜택을 봅니다. 국고는 세계 가격이 협조해 주기를 바라는 처지입니다."
 SIA_red_shirts_mobilized: "투표 뒤의 거리"
 SIA_red_shirts_mobilized_desc: "농촌 기반을 거리로 내보내십시오. 북동부 전역의 붉은 셔츠 조직이 수십만 명 규모로 행진하지만, 수도를 가득 메운 포퓰리스트 군중이 장성들을 위축시키지는 못합니다. 오히려 궁정과 군 수뇌부를 놀라게 하여 그들에게 구실을 쥐여 줍니다. 정부 청사 앞의 탱크로 끝나는 대치가 더 가까워집니다. §R쿠데타 위험이 상승합니다.§!"
 SIA_heartland_development: "붉은 심장부 개발"
 SIA_heartland_development_desc: "이산과 북부의 마을들이 압승을 안겨 주었고, 이제 그들은 정책으로 보상받습니다. 새 도로와 철도가 코랏 고원을 가로질러 치앙마이 계곡까지 닿고, 지방 관청들은 행정과 일자리를 운동의 기반이 실제로 사는 곳에 가져다줍니다. 한 번도 이들에게 투표하지 않은 수도가 아닌 곳에 말입니다."
 SIA_crown_property_bureau: "왕실재산관리국"
 SIA_crown_property_bureau_desc: "관리국은 호텔에서 부동산, 주요 산업 지분에 이르기까지 수십억에 달하는 왕실 자산을 관리합니다. 그 수익을 국가 개발에 활용하려면 최고위급의 조용한 협상이 필요합니다."
 SIA_eastern_tigers: "동부의 호랑이들"
 SIA_eastern_tigers_desc: "제2보병사단과 기갑군단, 곧 부라파 파약, 동부의 호랑이들입니다. 이들의 충성은 왕당파 국가의 힘줄이며, 이들의 지휘관은 차세대 장성들입니다."
 SIA_buddhist_nationalism: "불교 국가"
 SIA_buddhist_nationalism_desc: "군사정권은 승려들을 사회 질서의 파트너로 끌어안습니다. 국가 의식에서의 주황색 가사, 학교 교육과정 속의 불교, 도덕적 권위로서의 승가에 대한 조용한 격상. 최남단은 이를 조용히 받아들이지 않습니다."
 SIA_royal_succession_managed: "치세의 이행"
 SIA_royal_succession_managed_desc: "궁정과 정부는 충격이 아닌 제도적 인수인계로서 이행을 수년 전부터 준비합니다. 제9대 치세가 끝날 때, 바라미는 가장 약한 형태로 붕괴하는 대신 온전히 계승되고, 애도 기간은 단축되며, 군주제 기득권층은 새 왕좌 뒤로 결집합니다. 관리된 이행은 대안보다 비용이 적게 듭니다."
 SIA_conscription_abolished: "직업 군대"
 SIA_conscription_abolished_desc: "의무 병역을 폐지하십시오. 지원병 군대는 규모가 작아지지만 급여는 더 높고 훈련은 더 잘 받을 것이며, 자신들을 징집한 장성들이 아니라 헌법에 충성할 것입니다."
 SIA_open_skies_open_borders: "열린 하늘, 열린 국경"
 SIA_open_skies_open_borders_desc: "착륙권을 자유화하고 비자 규정을 간소화하며 항공사들이 경쟁하게 하십시오. 찾아오는 관광객은 돈을 가져오고, 찾아오는 노동자는 기술을 가져옵니다. 국경은 태국의 가장 큰 자산이니, 더 이상 요새처럼 취급하지 마십시오."
 SIA_chao_phraya_megaprojects: "짜오프라야 홍수 방지 및 친환경 발전"
 SIA_chao_phraya_megaprojects_desc: "수도를 두 차례 범람시킨 강은 저류 저수지와 홍수 방벽, 그리고 연이은 유수식 터빈으로 다스려질 것입니다. 이 프로젝트는 비용이 많이 듭니다. 다음 대홍수는 그보다 더 큽니다."
 SIA_asean_customs_window: "ASEAN 단일 창구 통관"
 SIA_asean_customs_window_desc: "회원국 전반에 걸쳐 세관 신고, 안전 인증서, 식물 위생 규정을 조화시킵니다. 치앙라이에서 쿠알라룸푸르로 가는 트럭이 예전보다 적은 창구에서 멈춥니다."
 SIA_the_southern_question: "남부 문제"
 SIA_the_southern_question_desc: "빠따니, 얄라, 나라티왓은 한 세대 동안 반란으로 들끓어 왔습니다. 모스크 방화와 참수, 도로변 폭탄이 수천 명의 목숨을 앗아갔고 말레이계 무슬림이 사는 남부를 불교도의 방콕에 맞서 더욱 완강하게 만들었습니다. 왕국은 더 이상 최남단을 치안상의 각주로 취급할 수 없습니다. 남부의 불길에 어떻게 대응할지 선택해야 합니다. 그 대응의 형태는 방콕에서 누가 통치하느냐에 따라 결정될 것입니다."
 SIA_kra_gateway: "크라 관문"
 SIA_kra_gateway_desc: "한 세기 묵은 꿈이 이번에는 대차대조표와 함께 내각 테이블로 돌아옵니다. 타당성 조사 위원회가 구성되고, 측량사들이 지협에 파견되며, 송클라에 첫 공동 건설 부지가 마련됩니다. 아직 확정된 것은 아무것도 없습니다. 다음 결정은 누가, 혹시라도, 그 비용을 댈 것인가입니다."
 SIA_kra_patron_china: "일대일로 금융"
 SIA_kra_patron_china_desc: "베이징의 제안은 단연 가장 저렴하며, 일대일로 금융 전액과 중국 엔지니어링 팀, 기록적인 속도의 턴키 운하를 제공합니다. 조건은 당장은 관대하고 나중에는 가혹합니다. 부채는 위안화로 표시되고, 담보는 운하 그 자체이며, 베이징이 대출 상환을 요구하는 날이 올 수도 있습니다."
 SIA_kra_patron_japan: "일본의 고품질 인프라"
 SIA_kra_patron_japan_desc: "JICA와 일본의 대형 은행 컨소시엄은 느리고 비싸지만 흠잡을 데 없이 건설합니다. 부채 함정도, 숨겨진 임대 조항도 없이, 초기 청구액만 더 높을 뿐이며, 바트만큼이나 호의로도 상환받기를 기대하는 파트너입니다. 방콕에 대한 도쿄의 평가는 그만큼 오릅니다."
 SIA_kra_patron_consortium: "국제 컨소시엄"
 SIA_kra_patron_consortium_desc: "ADB가 주도하는 다자 컨소시엄이 비용과 위험을 여러 주체에게 분산하며, 엔지니어들이 늘 선호했던 실용적인 단계적 접근을 고집합니다. 먼저 단계적인 육상 교량을, 그다음 해수면 높이의 전면 굴착을 진행합니다. 어떤 단일 채권자도 병목 지점을 소유하지 않으며, 워싱턴, 도쿄, 마닐라 모두 이에 안도합니다."
 SIA_kra_patron_solo: "독자 추진"
 SIA_kra_patron_solo_desc: "외국 채권자도, 외국 조항도, 갑문에 휘날리는 외국 국기도 없습니다. 왕국은 자체 국고와 자체 채권 시장으로 운하에 자금을 대며, 세계에서 가장 새로운 전략적 수로에 대한 절대적 주권의 대가로 어마어마한 비용을 감수합니다."
 SIA_kra_debt_trap_warning_tt: "일대일로 금융은 당장은 저렴하지만, 공사 비용 초과는 §R베이징의 대출 상환 요구§! 채무 불이행 위기 연쇄를 일으킵니다."
 SIA_two_oceans_one_kingdom: "두 대양, 하나의 왕국"
 SIA_two_oceans_one_kingdom_desc: "마지막 임시 둑이 철거되었습니다. 안다만 해와 타이만의 바닷물이 정상부에서 처음으로 섞입니다. 태국은 더 이상 한쪽 해안만을 차지하지 않습니다. 두 해안을 지배합니다."
 SIA_kra_militarize: "두 바다의 요새"
 SIA_kra_militarize_desc: "운하는 무방비로 두기에는 너무 귀중합니다. 해안 포대, 강화된 해군 기지, 상시 통과 통제 권한이 이 수로를 태국 왕립 해군이 어떤 적에 맞서서도 지킬 수 있는 요새로 만듭니다. 세계는 포를 주시하고, 통행료를 내는 이들은 군사화에 불평합니다."
 SIA_kra_internationalize: "만국의 운하"
 SIA_kra_internationalize_desc: "크라를 모든 깃발에 동등한 조건으로 개방되고 조약으로 보장되는 중립적 국제 통과 체제로 선언하십시오. 태국은 운하를 폐쇄할 권한을 포기합니다. 그 대가로 통행량과 투자, 그리고 한 나라의 손아귀에 든 병목 지점을 두려워했던 모든 해양 강국의 조용한 감사를 얻습니다."
 SIA_gateway_of_asia: "아시아의 관문"
 SIA_gateway_of_asia_desc: "배들은 태국을 스쳐 지나가곤 했습니다. 이제는 이곳에 멈춥니다. 국제 투자와 남부의 더 깊은 항구, 그리고 운하 노선이 선택되었다면 통행료를 내는 모든 이에게 병목 지점을 안전하게 만드는 순찰 권한으로 변모를 완성하십시오."
 SIA_ghosts_of_the_jungle: "정글의 유령들"
 SIA_ghosts_of_the_jungle_desc: "이산과 북부 고원지대의 깊은 산속에서 태국 공산당의 간부들은 결코 완전히 사라지지 않았습니다. 그들은 마을 학교에서 가르치고, 노동조합에서 조직하며, 기억했습니다. 이제 나라가 분열하고 안정이 추억이 되었으며 정부가 자기들끼리만 이야기하는 지금, 그들의 메시지는 들을 준비가 된 새로운 세대를 만납니다.\n\n붉은 길을 택하면 왕국이 걷고 있던 모든 정치 노선이 폐기됩니다."
 SIA_isaan_soviets: "이산 소비에트"
 SIA_isaan_soviets_desc: "북동부는 심장부이자 가장 가난한 지역이며 정치적으로 가장 불안정한 곳으로, 방콕의 기득권층이 늘 값싼 노동력과 값싼 표의 저수지로 취급해 온 곳입니다. 마을 위원회와 노조 회관, 협동조합 평의회가 운동의 조직적 골격이 됩니다. 당은 충성을 요구하지 않습니다. 사람들에게 스스로를 통치하라고 요청하고, 무슨 일이 벌어지는지 지켜봅니다."
 SIA_general_strike: "총파업"
 SIA_general_strike_desc: "운동이 농촌의 각주 이상이 되려면 도시들을 멈춰 세워야 합니다. 항만 노동자, 공장 노동자, 버스 운전사, 교사가 모두 한꺼번에 소집됩니다. 이 도박은 전면적입니다. 정부가 충분히 오랫동안 기능하지 못한다면 굴복하거나 확전할 것입니다. 중간 길은 없습니다."
 SIA_general_strike_tt: "총파업을 선언하고 365일 동안 §Y붉은 길§! 결정을 개방합니다.\n - 파업 동력을 §Y100§!까지 끌어올리면 정부가 굴복하여 권력으로 가는 평화적 길이 열립니다\n - 파업이 이어지는 매주 안정도가 §R0.5%§! 감소합니다\n - 365일이 100에 못 미친 채 끝나면 장성들이 파업을 진압하고 쿠데타로 권력을 장악합니다"
 SIA_people_seize_power: "인민의 권력 장악"
 SIA_people_seize_power_desc: "구 정부는 협상으로 붕괴했든 전장에서 붕괴했든 끝났습니다. 태국 공산당이 새로운 통치 권력입니다. 새 국기는 아직 정해지지 않았지만, 행정 기구는 이제 수십 년을 정글에서 보내며 그것을 어떻게 쓸지 고민해 온 사람들의 손에 있습니다."
 SIA_land_to_the_tiller: "경자유전"
 SIA_land_to_the_tiller_desc: "중부 평원의 대지주 영지, 이산의 논, 남부의 고무 농장. 이들을 만들어 낸 체제는 끝났습니다. 다음 정부가 들어서면 끝나는 정부 계획이 아닌 진정한 토지 재분배는 운동의 약속이자 가장 위험한 행위입니다. 그 영지를 소유했던 가문들이 모두 조용히 물러나지는 않을 것입니다."
 SIA_five_year_plan: "5개년 계획"
 SIA_five_year_plan_desc: "시장은 나라의 생산물을 공정하거나 평등하게 배분하지 못했습니다. 새 국가는 의도적으로 배분할 것입니다. 공장, 강철, 화학, 공작 기계 모두가 중앙에서 계획되고 동원된 국민의 노동으로 건설됩니다. 무역 적자는 물적 자본의 구조적 흑자가 됩니다. 첫해 소비재 통계에서 드러나는 대가는 고립입니다."
 SIA_red_chakri_dilemma: "짜끄리 딜레마"
 SIA_red_chakri_dilemma_desc: "당 지도부가 가능한 한 미뤄 온 한 가지 질문을 더는 외면할 수 없습니다. 공산주의 태국에서 군주제의 헌법상 지위는 무엇인가? 역사는 왕실 제도의 운명에 대해 두 가지 선례를 제시합니다."
 SIA_positive_trade_relations: "우호적 무역 관계"
 SIA_nuclear_proliferation_concern: "태국의 우라늄 농축"
 SIA_nuclear_proliferation_tt: "§R우리 동맹 바깥의 모든 국가가 태국의 새로운 핵 농축 프로그램을 우려 섞인 시선으로 바라봅니다.§!"
 SIA_tt_has_reclaimed: "아직 통합되지 않은 수복 영토를 보유하고 있음"
 SIA_tt_has_unpacified_reclaimed: "순응도가 아직 §Y90%§! 미만인 수복 영토"
 SIA_tt_has_corable_reclaimed: "순응도가 §Y80%§! 이상인 수복 영토"
 SIA_bamboo_curtain: "대나무 장막"
 SIA_bamboo_curtain_desc: "태국의 혁명은 고립된 실험으로는 살아남을 수 없습니다. 베트남과 라오스는 이웃이자 동반자이며 잠재적 파트너입니다. 상호 승인과 서방의 경제적 압력에 대한 공동 저항에 기반한 지역 연대의 틀이 동남아시아에서 지속 가능한 혁명 국가의 구조입니다."
 SIA_protracted_peoples_war: "지구 인민전쟁"
 SIA_protracted_peoples_war_desc: "1970년대의 당은 도시에서 승리하지 못했습니다. 방콕의 명령이 희박하고 선언문보다 소총이 더 큰 힘을 가진 산악 지대에서 기량을 익혔습니다. 고지대에 근거지를 건설하고 농촌이 도시를 포위하게 하십시오. 총파업이 도시가 무너지는 쪽에 걸었다면, 이것은 무력으로 문제를 매듭짓습니다.\n\n당이 전장에 나섭니다. §R태국 공산당§!이 정부에 맞서 봉기하며 당신이 봉기를 지휘합니다. 당 지지율 §Y20%§!가 필요하며 §Y150§! 정치력이 소모됩니다."
 SIA_peoples_tribunals: "인민 재판소"
 SIA_peoples_tribunals_desc: "스스로를 지키지 못하는 혁명은 한 계절을 갈 뿐입니다. 밀고자, 자금 제공자, 그리고 바람이 어느 쪽으로 불지 기다렸던 대령들이 모두 여전히 제자리에 있습니다. 약식으로 공개 진행되는 혁명 재판소가 당에 묻기 전에 충성의 문제를 정리합니다."
 SIA_broad_united_front: "광범위한 통일 전선"
 SIA_broad_united_front_desc: "공포로 통치하는 혁명은 해마다 더 작은 나라를 통치하게 됩니다. 더 어려운 길은 동의입니다. 농민 연맹, 노조, 개혁 지식인, 소상인, 마을 승려를 한 천막 아래 모으고, 그들이 새 국가에서 살아남은 것이 아니라 그것을 세웠다고 느끼게 하십시오. 권력은 문서상으로 공유되고 실제로는 지켜지지만, 합의로 통치할 수 있는 운동은 총으로 통치할 필요가 없습니다."
 SIA_peoples_army: "인민군"
 SIA_peoples_army_desc: "계획은 공장을 세웠고 이제는 방패를 벼립니다. 적대적인 지역의 혁명 국가에는 수가 많고 충성스러우며, 당의 형상으로 훈련된 징집병을 갖추고, 외국의 호의가 아니라 태국의 무기고에서 장비를 공급받는 군대가 필요합니다. 소총을 들 수 있는 모든 사람은 시민 병사이며, 포신을 깎을 수 있는 모든 작업장은 보급망의 고리입니다. 이웃들은 움직이기 전에 두 번 생각할 것입니다."
 SIA_socialist_education: "각자가 한 명씩 가르친다"
 SIA_socialist_education_desc: "계획은 공장을 세웠습니다. 이제는 그것을 운영할 사람들을 길러 냅니다. 대규모 문맹 퇴치 캠페인이 이산의 마지막 마을까지 닿고, 간부 학교는 농민을 기술자로, 사무원을 출신이 아닌 능력으로 책임지는 행정가로 바꿉니다. 글을 읽고 조직된 인구는 속이기 어렵고 통치하기 저렴하며, 옛 왕국을 속 빈 강정으로 만든 후원의 부패는 뿌리 내릴 곳을 찾지 못합니다."
 SIA_the_beijing_road: "베이징의 길"
 SIA_the_beijing_road_desc: "생존에는 후원자가 있고 그는 중난하이에 앉아 있습니다. 베이징의 포옹을 온전히 받아들이십시오. 중국이 우리의 산업 계획을 완성하고, 중국 시장이 서방이 닫아 버린 시장을 대체하며, 어떤 이웃도 도전할 수 없는 강대국의 그림자가 우리에게 드리웁니다. 대가는 작은 글씨로 쓰여 있습니다. 태국 평의회에서 중국의 목소리는 어떤 태국인도 한때는 허락하지 않았을 만큼 커집니다. 하위 파트너도 파트너이며, 배부른 나라는 자존심 강한 나라보다 오래 삽니다."
 SIA_indochina_federation: "인도차이나 연방"
 SIA_indochina_federation_desc: "혹은 속국의 역할을 거부하고 지도자의 역할을 요구하십시오. 라오스, 베트남, 캄보디아는 같은 이념을 위해 피를 흘린 세 개의 혁명이지만 어느 나라도 태국의 산업이나 중심적 위치를 갖고 있지 않습니다. 베이징의 하위 파트너가 아닌 방콕이 선임 파트너가 되는 세 강의 연방은 동남아시아를 강대국이 분할하는 대상이 아니라 협상해야 하는 상대로 만듭니다. 더 어려운 자랑이자 더 자랑스러운 자랑입니다."
 SIA_kingmaker_coalition: "킹메이커 연합"
 SIA_kingmaker_coalition_desc: "아누틴 찬위라꾼의 품짜이타이당은 2019년 의회에서 캐스팅보트를 쥐고 있습니다. 그들과의 연립에는 부처 자리와 정책 양보라는 대가가 따르지만, 통치 과반수와 이 정당의 농촌 북동부 기반에 대한 접근도 얻을 수 있습니다."
 SIA_cannabis_decriminalized: "대마초 비범죄화"
 SIA_cannabis_decriminalized_desc: "품짜이타이당의 2022년 대표 정책은 대마초를 마약 목록에서 제외합니다. 부리람과 이산 전역의 농민들이 새로운 환금작물로 전환합니다. 국고 수입이 늘어납니다. 보수 진영은 도덕적 해이를 경고합니다. 양쪽 모두 옳습니다."
 SIA_million_rai_farms: "100만 라이 현대식 농장"
 SIA_million_rai_farms_desc: "품짜이타이당의 농촌 개발 강령은 남부 전역에 정밀 관개, 계약 농업 인증, 고무나무 재식재 보조금을 가져옵니다. 북동부는 새로운 산업을, 남부는 농장 확장을 얻습니다. 태국의 농산물 수출이 증가합니다."
 SIA_defence_industry_act: "국방 산업법"
 SIA_defence_industry_act_desc: "국내 방위 생산을 위한 법적 틀로, 국내 제조 체계에 대한 조달 우대, 모든 외국 계약에 대한 기술 이전 의무화, 부처 내 방위 산업 사무국을 포함합니다. 이를 통해 세워지는 첫 무기 공장은 소박할 것입니다. 제도적 토대는 그렇지 않을 것입니다."
 SIA_dti_expansion: "DTI 확장"
 SIA_dti_expansion_desc: "국방기술연구소는 자본 투입과 함께 로켓, 배회 탄약, 개량 장갑차 시제품을 인도하라는 임무를 부여받습니다. 이산 시설은 설계 사무실에서 생산 라인으로 도약하고, 그 옆에 새 무기 라인이 가동됩니다. 연구 보너스는 장비를 뒤따릅니다."
 SIA_chaiseri_and_friends: "차이세리와 친구들"
 SIA_chaiseri_and_friends_desc: "차이세리 메탈 앤드 러버의 퍼스트 윈 MRAP는 이미 인도네시아와 필리핀에 팔렸습니다. 국방 산업법을 등에 업고 차이세리, 톤부리 오토모티브, 타이 옵티컬을 비롯한 민간 방위 납품업체들이 세를 불립니다. 국내 조달로 시작된 것이 수출 장부가 되며, 차이세리의 생산 라인은 그 수익으로 한 단계 올라섭니다."
 SIA_arms_exporter: "ASEAN의 무기고"
 SIA_arms_exporter_desc: "태국은 지역에서 선호되는 2선급 무기 공급국이 되기 위한 생산 기반과 법적 틀, 수출 관계를 구축했습니다. 전차나 전투기가 아니라 MRAP, 포탄 신관, 드론, 탄약입니다. 믿을 수 있고, 저렴하며, 제때 인도됩니다. 반복 가능한 수출 계약은 국고의 고정 수입원이 됩니다."
 SIA_regional_defense_pact: "지역 방위 조약"
 SIA_regional_defense_pact_desc: "수출 장부는 외교 수단이 되었습니다. 방콕은 ASEAN 파트너들과 보장된 조달 경로, 공동 정비 프로그램, 지역 안보를 위한 상설 협의 틀을 포함한 상시 방위 물자 공급 협정을 공식화합니다. 공장은 더 뜨겁게 돌아가고, 무관들은 서명된 협정을 들고 귀국하며, 동남아시아에서의 태국의 영향력은 탄약 배정량과 예비 부품 계약으로 측정됩니다."
 SIA_stream_of_the_navy: "해군의 흐름"
 SIA_stream_of_the_navy_desc: "태국 왕립 해병대가 상륙 돌격과 해안 방어에 대한 교리적 투자를 받습니다. 남부의 조선소 확장은 새 상륙 비행대를 뒷받침합니다. 태국 해병대는 더 이상 순전히 의례적이지 않은 훈련에서 인도네시아 및 필리핀 해병대와 함께 훈련합니다."
 SIA_cavalry_of_the_sky: "하늘의 기병대"
 SIA_cavalry_of_the_sky_desc: "육군 항공대가 앞으로의 군사 예산에서 우선권을 얻습니다. 공중 기동 보병을 위한 새로운 다목적 헬리콥터, 산악 지대 지상 작전을 지원하는 공격형 개량형, 그리고 태국의 지형이 초원보다는 정글에 가깝다는 점을 인정하는 공중 강습 교리가 도입됩니다."
 SIA_cyber_command: "사이버 사령부"
 SIA_cyber_command_desc: "미국 사이버사령부와 이스라엘 8200부대의 틀을 본뜬 전담 사이버 작전 사령부입니다. 네트워크 방어와 신호 정보, 그리고 자금 제안서의 은밀한 부록에는 공세적 능력 개발이 포함됩니다. ISOC의 감시 기반시설이 이미 있다면 사령부는 이를 물려받아 영향력을 디지털 영역으로 확장합니다."
 SIA_us_coin_legacy: "미국 대반란전의 유산"
 SIA_us_coin_legacy_desc: "태국 육군은 베트남 전쟁 이후 수십 년간 마을 방어 프로그램, 심리전, ISOC와의 정보 융합을 통해 미국의 대반란전 교리에서 혹독한 교훈을 흡수했습니다. 그 틀은 지금도 태국이 내부의 적과 싸우는 방식을 규정합니다. 이를 체계화하면 성과가 나옵니다."
 SIA_development_is_security: "발전이 곧 안보"
 SIA_development_is_security_desc: "불안정한 북부와 북동부의 도로, 학교, 진료소는 가장 저렴한 대반란전 수단입니다. 선동가보다 먼저 마을에 닿는 기반시설은 머물게 마련입니다. 이산과 북부의 새로운 철도 터미널이 뒤따르는 모든 프로젝트를 앞당깁니다."
 SIA_post_cold_war_professionalization: "냉전 이후의 전문화"
 SIA_post_cold_war_professionalization_desc: "냉전은 태국의 장교단을 반공 작전과 국내 질서에 대한 충성, 궁정에 대한 순종으로 이끌었습니다. 서방 파트너와의 합동 훈련으로 단련되고 국제법을 교육받은 새로운 세대의 장교들이 태국 왕립 군대가 무엇을 위해 존재하는지를 새로 규정하고 있습니다."
 SIA_multi_domain_operations: "다영역 작전"
 SIA_multi_domain_operations_desc: "전장은 더 이상 지도 위의 선이 아닙니다. 사이버, 전자전, 우주 기반 영상, 정밀 드론 타격이 재래식 기동과 융합합니다. 미국 및 오스트레일리아 파트너와 공동으로 개발한 태국의 MDO 개념은 다음 전쟁이 모든 영역에서 동시에 치러질 것임을 인정합니다."
 SIA_mdo_integration_strain: "통합의 부담"
 SIA_mdo_integration_strain_desc: "사이버에서 우주 기반 영상에 이르는 영역 횡단 지휘 구조를 세우는 데는 교리가 효과를 내기 훨씬 전부터 돈이 듭니다."
 SIA_ministry_of_defence: "국방부"
 SIA_ministry_of_defence_desc: "왕국의 국방은 늘 각 군이 스스로 운영해 왔으며, 각자 자기 예산과 교리, 영역을 지켜 왔습니다. 마침내 국방에 제도적 척추를 부여합니다. 육군, 해군, 공군 위에 자리하며 영토 방위, 국가 안보 정책, 정보를 국가에 책임지는 단일 기구로 묶는 부처입니다."
 SIA_comprehensive_security: "포괄적 안보"
 SIA_comprehensive_security_desc: "내무, 국방, 정보 기관은 수십 년간 같은 국경을 지켜보면서도 세 갈래의 문서를 가지고 있었고 공유하는 습관이 없었습니다. 하나의 교리가 이들을 묶고, 경제, 국내 전선, 군이라는 세 갈래의 노력을 동시에 엽니다."
 SIA_protector_of_the_realm_focus: "왕국의 수호자"
 SIA_protector_of_the_realm_focus_desc: "승전 기념탑이 봉헌되자 샨, 라오, 크메르, 말레이의 땅이 태국 국기 아래 놓였습니다. 땅을 차지하는 것과 다스리는 것은 다른 일입니다. 수복한 변경을 위한 행정 조직이 수비대 뒤에 세워지며, 안정화와 개발, 그리고 때가 되면 중핵화 작업이 시작됩니다."
 SIA_atoms_for_peace: "평화를 위한 원자력"
 SIA_atoms_for_peace_desc: "태국은 IAEA의 평화적 이용 의정서에 서명하고 긴 제도적 활주로를 닦기 시작합니다. 원자력 안전 당국, 사용후 핵연료 협정, 첫 국내 연구용 원자로. 민간 프로그램은 우라늄 기반 부하 발전이 지정학적 가격으로 수입하는 석유보다 저렴하고 깨끗하며 주권적이라는 신념 위에 세워집니다."
 SIA_smr_initiative: "SMR 구상"
 SIA_smr_initiative_desc: "소형 모듈 원자로는 대형 발전소의 자본 지출을 감당할 수 없는 나라에도 원자력을 가능하게 하는 기술입니다. 이 구상은 타당성 조사, 동부 해안의 부지 평가, 한국 또는 프랑스 컨소시엄과의 기술 이전 협정에 자금을 댑니다. 첫 콘크리트 타설은 10년 뒤의 일입니다. 결정은 오늘 내려집니다."
 SIA_nuclear_power_program: "원자력 발전 프로그램"
 SIA_nuclear_power_program_desc: "정점은 확정된 가동 일정, 주권적 핵연료 주기 체계, 전력망에 연결된 첫 원자로를 갖춘 국가 원자력 발전 프로그램입니다. 태국은 일본, 한국, 중국, 인도, 파키스탄, 대만과 더불어 지역의 원전 운영국 대열에 합류하며 동남아시아 최초로 민간 원자로를 전력망에 연결한 국가가 됩니다. 에너지 독립은 더 이상 이론이 아닙니다."
 SIA_bangkok_phnom_penh_axis: "방콕-프놈펜 추축"
 SIA_bangkok_phnom_penh_axis_desc: "캄보디아의 지리는 이 나라를 태국의 바다로 가는 자연스러운 경제 회랑으로 만들며, 정치적 궤적은 베트남에 대한 방콕의 자연스러운 외교적 균형추로 만듭니다. 이 중점은 무역 사절단과 도로 연결, 공동 안보 틀을 통해 관계를 구축하여 프놈펜을 방콕 가까이에, 베이징의 궤도에서는 더 멀리 둡니다."
 SIA_jakarta_dialogue: "자카르타 대화"
 SIA_jakarta_dialogue_desc: "인도네시아는 동남아시아의 인구 대국이며 쿠알라룸푸르 다음으로 태국의 가장 중요한 양자 관계입니다. 자카르타 대화는 양자 장관 회담과 합동 군사 훈련, 누가 ASEAN의 다음 10년을 이끌 것인가에 대한 솔직한 대화를 한데 모으는 무대입니다. 결과는 방콕이 자카르타를 파트너로 보는지 경쟁자로 보는지에 달려 있습니다."
 SIA_asean_crossroads: "ASEAN의 기로"
 SIA_asean_crossroads_desc: "왕국 앞에는 두 갈래의 길이 놓여 있습니다. 첫째는 동반자 관계로, 동의를 통해 ASEAN을 묶는 태국 주도의 질서입니다. 둘째는 지배로, 칼로써 동남아시아를 태국의 통제 아래 두는 것입니다."
 SIA_the_2001_election_choice_tt: "2001년 선거 운동에서 한 세력을 지지하십시오. 선거가 누가 통치할지를 결정하며, 승자의 길만이 열립니다.\n - £SIA_neutral_Social §Y타이락타이§!\n - £SIA_Nat_Autocracy §Y궁정 네트워크와 그 장성들§!\n - £SIA_western_conservative §Y현직 민주당§!"
 SIA_the_2006_coup_choice_tt: "9월의 쿠데타로 집권당이 §Y[Nat_Autocracy_L]§!(으)로 교체됩니다. 내전은 일어나지 않으며, 군이 단순히 정부를 장악합니다."
 SIA_a_new_republic_choice_tt: "군주제의 운명을 선택하십시오.\n - §Y폐지§!: 혼란을 견뎌 냄\n - §Y물러섬§!: 안정과 정치력을 위해 왕관을 유지함"
 SIA_the_southern_question_choice_tt: "세 가지 남부 교리 중 하나만 따를 수 있습니다. 하나를 택하면 나머지 둘은 영구히 닫힙니다."
 SIA_red_chakri_dilemma_choice_tt: "왕좌에 대한 혁명의 답을 선택하십시오.\n - §Y군주제 폐지§!: 왕당파 반란에 직면함\n - §Y입헌적 상징적 군주 유지§!: 라오스의 모델을 따르며 강경파의 분노를 흡수함"
 SIA_lost_territories_choice_tt: "영유권 주장을 얼마나 공개적으로 밀어붙일지 선택하십시오.\n - §Y공개적 민족 통일주의§!: 위상을 희생하고 전쟁 지지도를 얻음\n - §Y조용하고 부인 가능한 수정주의§!: 안정도를 보호함"
 SIA_nuclear_power_program_choice_tt: "핵연료 주기의 방향을 선택하십시오.\n - §Y사찰단에 불응§!: 제재 속에서 무기화 잠재력이 있는 농축\n - §YIAEA 안전조치 수용§!: 워싱턴과의 관계 회복"
 SIA_prayuth_premiership_choice_tt: "장군이 후계를 어떻게 계획할지 선택하십시오.\n - §Y관리된 이행§!: 기득권층을 공고히 함\n - §Y체제의 제도화§!: 민간 얼굴로 한발 물러남"
 SIA_2020_protest_response_choice_tt: "시위에 대한 대응을 선택하십시오.\n - §Y강경 진압§!: 안정도가 감소하고 쿠데타 위험이 상승함\n - §Y개혁 양보§!: 진정되며 개혁 운동이 힘을 얻음\n - §Y버티기§!"
 SIA_found_the_pact: "동남아시아 조약 기구 창설"
 SIA_found_the_pact_desc: "태국은 창설자들이 1977년에 버린 이름을 되살려 지역의 주인에게 돌려줍니다. 방콕을 중심으로 하고 이웃 국가들을 회원으로 하는 상호 방위 조약인 동남아시아 조약 기구입니다. 태국은 창립 지도국의 역할을 맡습니다. 깃발이 올라갑니다. 조약은 현실이 됩니다."
 SIA_invite_mainland: "대륙부 파트너 초청"
 SIA_invite_mainland_desc: "베트남, 라오스, 캄보디아, 미얀마는 모두 태국과 국경을 맞대고 있으며 공통의 위협에 직면해 있습니다. 방콕은 대륙부 국가들에 공식 초청장을 보내, 대륙 내부의 안보는 서로 경쟁하는 양다리가 아니라 공동의 대의에 달려 있다고 설득합니다."
 SIA_invite_mainland_tt: "대륙부 이웃 국가들을 SEATO에 가입하도록 초청합니다.\n - 각국은 수락 여부를 스스로 결정합니다\n - 수락하는 회원국은 조약에 대한 결속을 유지하는 국가 정신을 얻습니다"
 SIA_invite_maritime: "해양부 파트너 초청"
 SIA_invite_maritime_desc: "인도네시아, 필리핀, 말레이시아, 싱가포르, 브루나이는 태국이 무역에 의존하는 바다를 통제하고 있습니다. 해양부 파트너들이 조약에 가입하도록 초청되어 군도와 반도가 하나의 전략적 공동체로 묶입니다."
 SIA_invite_maritime_tt: "동남아시아의 해양 국가들을 SEATO에 가입하도록 초청합니다.\n - 각국은 수락 여부를 스스로 결정합니다\n - 수락하는 회원국은 조약에 대한 결속을 유지하는 국가 정신을 얻습니다"
 SIA_invite_breakaways: "변경 소국 초청"
 SIA_invite_breakaways_desc: "남부 샨, 카렌, 와는 태국과 버마 중심부 사이의 땅을 차지하고 있으며, 어느 쪽도 혼자서는 살아남을 수 없습니다. 방콕은 네피도가 결코 주지 않을 것을 제안합니다. 협상 테이블의 자리, 조약 서명, 그리고 반란 세력이 아닌 국가로서의 지위입니다."
 SIA_invite_breakaways_tt: "버마의 분리 독립 국가들이 존재하는 경우 이들을 SEATO에 가입하도록 초청합니다.\n - 각국은 수락 여부를 스스로 결정합니다\n - 수락하는 회원국은 조약에 대한 결속을 유지하는 국가 정신을 얻습니다"
 SIA_seato_invite_line_tt: " - §Y[THIS.GetNameDefCap]§!(이)가 SEATO 가입을 초청받습니다"
 SIA_seato_accession_category: "SEATO 가입"
 SIA_seato_accession_category_desc: "최초의 동남아시아 조약 기구는 1954년 마닐라에서 서명되고 방콕에서 운영되었지만, 여덟 회원국 중 동남아시아 국가는 둘뿐이었고 한 번도 발동되지 못한 채 1977년에 해체되었습니다. 이번 조약은 첫 번째가 되지 못했던 지역 조약입니다. 태국이 의장을 맡고, 이웃 국가들이 회원이 되며, 보장은 다른 누군가의 봉쇄 전략이 아니라 동남아시아의 방어를 향합니다. 자리는 하나씩 채워 나가야 합니다.\n\n세력에 초청하기 전에 각국의 수용도를 확인하십시오."
 SIA_renew_seato_invitation: "초청 갱신"
 SIA_renew_seato_invitation_desc: "조약문과 새로운 제안을 담아 대표단을 [FROM.GetNameDefCap](으)로 다시 보냅니다. 거절은 영구적이지 않으며, 조건도 변하지 않았습니다."
 SIA_seato_charm_offensive_major: "[FROM.GetNameDefCap] 구애"
 SIA_seato_charm_offensive_major_desc: "국빈 방문, 신용 한도, 장교 장학금, 그들의 무역 박람회에 마련된 태국관. 외교부는 석 달 동안 이 일만 합니다. 이 중 어느 것도 조약은 아닙니다. 하지만 모두가 다음에 요청할 때 조약 서명을 쉽게 만들어 줍니다."
 SIA_seato_charm_offensive_minor: "[FROM.GetNameDefCap] 구애"
 SIA_seato_charm_offensive_minor_desc: "국빈 방문, 신용 한도, 장교 장학금, 그들의 무역 박람회에 마련된 태국관. 외교부는 석 달 동안 이 일만 합니다. 이 중 어느 것도 조약은 아닙니다. 하지만 모두가 다음에 요청할 때 조약 서명을 쉽게 만들어 줍니다."
 SIA_courting_mission: "이웃 국가 구애"
 SIA_courting_mission_desc: "고위 외교 인력과 장관 일정, 대부분의 재량 예산이 임무가 끝날 때까지 한 수도에 투입됩니다. 정부의 다른 모든 일은 순서를 기다립니다."
 SIA_seato_rec_opinion_yes: "§G태국에 대한 관계가 40 초과§! (+25)"
 SIA_seato_rec_opinion_no: "§R태국에 대한 관계가 40 이하§! (+25)"
 SIA_seato_rec_faction_yes: "§G다른 세력에 속해 있지 않음§! (+20)"
 SIA_seato_rec_faction_no: "§R이미 다른 세력에 속해 있음§! (+20)"
 SIA_seato_rec_influence_yes: "§G태국이 영향력 상위 3대 공급원에 속하며 20퍼센트 이상 보유§! (+20)"
 SIA_seato_rec_influence_no: "§R태국이 영향력 상위 3대 공급원에 속하지 않거나 20퍼센트 미만§! (+20)"
 SIA_seato_rec_threat_yes: "§G전쟁 중이거나 전쟁 중인 국가와 국경을 맞대고 있음§! (+15)"
 SIA_seato_rec_threat_no: "§R자국도 국경을 맞댄 어떤 국가도 전쟁 중이 아님§! (+15)"
 SIA_seato_rec_trade_yes: "§G태국과 무역 협정을 체결함§! (+10)"
 SIA_seato_rec_trade_no: "§R태국과 무역 협정이 없음§! (+10)"
 SIA_seato_rec_momentum_yes: "§GSEATO에 이미 3개국 이상이 가입함§! (+10)"
 SIA_seato_rec_momentum_no: "§RSEATO 회원국이 3개국 미만임§! (+10)"
 SIA_seato_rec_total: "§YSEATO 수용도§!: §Y[?SIA_seato_temp|0]§!/100. §Y60§!이 되면 초청을 수락합니다."
 SIA_joint_command: "ASEAN 합동 사령부"
 SIA_joint_command_desc: "방콕에 상설 합동 지휘 구조가 설립되어 모든 회원국의 교리, 군수, 정보를 통합합니다. 고위 직책은 태국 장교들이 맡지만 참모진은 진정한 다자 구성입니다. 훈련은 상호 운용이 가능해지고, 계획은 현실이 됩니다."
 SIA_asean_rapid_reaction: "ASEAN 신속 대응군"
 SIA_asean_rapid_reaction_desc: "조약은 다음 단계로 나아가 모든 회원국에서 차출한 상설 신속 대응 여단을 둡니다. 이 부대는 72시간 안에 동남아시아 어디에든 전개할 수 있습니다. 작고 빠르며 의심의 여지 없이 실재하는 조약의 칼입니다."
 SIA_arsenal_integration: "ASEAN 무기고 통합"
 SIA_arsenal_integration_desc: "이미 동남아시아의 작업장인 태국의 방위 산업이 모든 회원국 군대의 무기와 탄약을 표준화합니다. 태국산 소총, 차량, 포탄이 소련제, 중국제, 서방제 장비의 짜깁기를 대체합니다. 이제 조약 회원국들의 군대는 같은 총알을 씁니다."
 SIA_pax_aseana: "팍스 아세아나"
 SIA_pax_aseana_desc: "일은 끝났고 조약은 유지됩니다. 태국은 어떤 외부 강국도 하지 못했던 일, 곧 지역에 뿌리를 두고 어떤 도전자도 억지할 만큼 강한 진정한 안보 구조를 구축했습니다. 이웃 국가들은 원해서 서명했고, 그것이 이 구조가 오래갈 이유입니다."
 SIA_war_economy_push: "전시 경제 추진"
 SIA_war_economy_push_desc: "국가는 전시 체제에 돌입했습니다. 소비재를 만들던 공장은 포탄과 소총 총열을 생산하도록 설비를 바꿉니다. 군사비 지출 한도가 해제되고, 조달 계약은 평소의 지연 없이 체결되며, 방콕 수도권의 급히 정리된 부지에 3개의 새로운 무기 공장이 들어섭니다."
 SIA_friends_abroad: "해외의 친구들"
 SIA_friends_abroad_desc: "태국 군은 수십 년간 외국 파트너들과 함께 훈련해 왔습니다. 합동 훈련과 장교 교류, 무기 이전을 통해 형성된 양자 관계는 태국 안보의 조용한 기둥으로, 동맹보다는 덜 눈에 띄지만 대부분의 동맹보다 오래갑니다. 이미 효과가 있는 것을 공식화할 때입니다."
 SIA_cobra_gold_focus: "코브라 골드"
 SIA_cobra_gold_focus_desc: "코브라 골드는 태국과 미국이 공동 주최하는 아시아 최대의 연례 합동 군사 훈련입니다. 훈련 프로그램을 심화하면 미국의 교리와 군수 훈련, 장비 숙련도가 태국 왕립 육군에 전해지고, 방콕은 동남아시아 대륙부에서 워싱턴의 닻 역할을 하는 파트너로 굳어집니다."
 SIA_partner_japan: "일본과의 국방 유대"
 SIA_partner_japan_desc: "일본의 방위 장비 수출 개혁은 태국 조달에 새로운 경로를 열었습니다. 도쿄는 중국이나 미국의 패키지에 딸린 정치적 조건 없이 태국의 역량을 보완하는 정밀 제조 노하우와 이중 용도 전자 장비, 인프라 금융을 제공합니다."
 SIA_partner_korea: "한국과의 국방 파트너십"
 SIA_partner_korea_desc: "대한민국은 한 세대 만에 경쟁력 있는 방위 산업을 구축했습니다. K-2 전차, FA-50 전투기, K9 자주포가 동남아시아 전역의 파트너들에게 경쟁력 있는 가격으로 판매됩니다. 태국도 줄에 합류하며, 한국식 항공 훈련과 산업 방법론을 가져옵니다."
 SIA_partner_australia: "파이브 아이즈 이웃"
 SIA_partner_australia_desc: "오스트레일리아는 태국의 가장 가까운 영어권 파트너이자 미국의 비NATO 동맹국입니다. 안다만 해와 타이만에서의 합동 훈련이 해군 간 유대를 심화시켰습니다. 파트너십을 확대하면 어느 나라도 혼자서는 감당할 수 없는 육군 상호 운용성과 해양 감시 협력이 이루어집니다."
 SIA_partner_taiwan: "조용한 국방 협력"
 SIA_partner_taiwan_desc: "대만의 방위 산업은 신중하고 기술적으로 정교하며, 정치적으로 친구를 찾으려는 동기가 있습니다. 방콕은 타이베이를 승인하지 않지만, 태국 왕립 육군과 중화민국군은 오래전부터 장비와 훈련을 위한 비공식 경로를 유지해 왔습니다. 그 협력을 조용히 공식화하는 것은 계산된 위험입니다. 베이징은 알아챌 것입니다."
 SIA_hedging_partners: "극동의 친구들"
 SIA_hedging_partners_desc: "도쿄, 서울, 베이징은 각각 워싱턴이 줄 수 없는 것을 방콕에 제공합니다. 인내심 있는 자본, 이중 용도 기술, 광대한 이웃 시장. 어느 나라도 배타성을 요구하지 않습니다. 태국은 세 나라 모두에 구애하면서 몸값을 유지하고, 누구의 닻도 누구의 속국도 되기를 거부합니다. 이미 양다리 전략을 택한 왕국은 이러한 유대에서 두 배의 이익을 얻습니다."
 SIA_national_grid: "왕국에 전력을"
 SIA_national_grid_desc: "태국의 급속한 산업화는 전력망을 앞질렀습니다. 동부 해안은 공장으로 윙윙거리지만 전력망은 노후했고 송전 손실은 부끄러울 정도이며, 앞으로 10년의 성장은 부하를 감당할 수 있는 토대를 요구합니다. 정부는 새 변전소와 개량된 송전선, 그리고 마침내 전력망이 가동할 수 있게 된 지역의 새 공장을 포함한 국가 기반시설 개선에 매진합니다."
 SIA_renewable_push: "재생 에너지 추진"
 SIA_renewable_push_desc: "타이만의 바람, 중부 평원의 태양광, 북부의 소수력. 태국의 지리는 만성적으로 활용되지 못한 재생 에너지 자산입니다. 이 프로그램은 왕국의 모든 지역에 대규모 재생 에너지 설비를 위탁하고 그 생산량을 국가 전력망에 직접 연결합니다."
 SIA_green_grid: "녹색 전력망"
 SIA_green_grid_desc: "재생 에너지 설비 용량은 하나의 문제이고, 이를 활용할 수 있는 전력망은 또 다른 문제입니다. 저장 설비와 스마트 배전, 현대화된 송전이 왕국의 태양광 발전소와 풍력 능선을 믿을 수 있는 공급으로 엮고, 강화된 간선망 덕분에 새로운 패널이나 터빈이 더 빠르게 세워집니다. 왕국의 에너지 독립은 여기서 시작됩니다."
 SIA_fossil_fuels_deal: "걸프 에너지 파트너십"
 SIA_fossil_fuels_deal_desc: "왕국의 정유소는 걸프산 원유로 돌아가고 발전소는 수입 가스를 태웁니다. 방콕은 의존에 맞서 싸우는 대신 이를 공식화합니다. 사우디아라비아, 카타르, UAE와의 장기 공급 협정은 가격의 확실성과 현대적 발전소 개조를 통한 소폭의 연료 효율 배당, 그리고 수표에 따라오는 외교적 온기를 가져다줍니다."
 SIA_gulf_energy_ties: "전략 연료 비축"
 SIA_gulf_energy_ties_desc: "출항하지 않는 유조선은 가동되지 않는 발전소와 같습니다. 남부 산업 회랑과 동부 해안에 두 곳의 전략 연료 저장 시설이 세워집니다. 걸프 파트너들이 건설비의 절반을 대고 태국 엔지니어들이 나머지를 짓습니다."
 SIA_iron_fist_doctrine: "철권 교리"
 SIA_iron_fist_doctrine_desc: "더 이상 불만에 대한 이야기는 없습니다. 세 개 도는 병력과 검문소, 비상 권한으로 가득 찹니다. 반란은 안보 문제이며 신속하고 강경하게, 변명 없이 그렇게 대응될 것입니다. 세계는 반대할 것입니다. 남부는 조용해질 것입니다."
 SIA_martial_law_south: "남부 계엄령"
 SIA_martial_law_south_desc: "긴급 칙령으로 빠따니, 얄라, 나라티왓이 군정 하에 놓입니다. 통행금지와 영장 없는 수색, 기소 없는 구금이 남부 생활의 일상이 됩니다. 육군은 정보가 입수되는 즉시 행동할 수 있게 되고, 주민들은 총을 든 자들을 숨겨 주는 것의 대가를 배웁니다."
 SIA_search_and_destroy: "수색 및 섬멸"
 SIA_search_and_destroy_desc: "특수 부대와 항공대가 의심되는 세포 조직망에 대한 무력 소탕을 실시합니다. 작전은 결정적이며 사상자 수는 많습니다. 표적을 맞힌 모든 급습은 반란을 조금씩 무너뜨리지만, 결혼식장을 맞힌 모든 급습은 그들에게 한 세대의 신병을 안겨 줍니다."
 SIA_pacification_complete: "평정 완료"
 SIA_pacification_complete_desc: "도로변 폭탄은 멈췄고 검문소는 철거되었습니다. 모스크는 감시당하고 학교는 통제되며, 침묵 밑의 불만은 사라지지 않았습니다. 총성은 멎었지만 불씨는 남아 있습니다."
 SIA_royal_development_projects: "왕실 개발 프로젝트"
 SIA_royal_development_projects_desc: "국왕의 구상 아래 왕실의 개발 모델이 남부로 확대되어 관개, 농업, 도로, 왕실 후원 협동조합이 들어섭니다. 말레이계 무슬림 남부를 위해 일하는 것은 반란이 아니라 군주제라는 메시지입니다. 순찰만이 아닌 후원과 존재감입니다."
 SIA_isoc_southern_command: "ISOC 남부 사령부"
 SIA_isoc_southern_command_desc: "국내치안작전사령부가 남부 전역에 대한 통합 권한을 맡아, 민군 협조와 정보 융합, 소프트 파워 기구를 한 지붕 아래 둡니다. ISOC 네트워크가 이미 성숙해 있다면 남부 사령부는 대응에서 예측으로 옮겨 갈 수 있습니다."
 SIA_winning_hearts_royally: "왕실식 민심 얻기"
 SIA_winning_hearts_royally_desc: "장학금, 모스크 보수, 할랄 인증 개발 구역, 그리고 지역의 말레이계 무슬림 명망가를 후원 체제로 의도적으로 끌어올리는 일. 국가는 점령자가 아니라 후원자로서 나타나며, 천천히, 몇몇 곳에서 청년들의 셈법이 바뀝니다."
 SIA_southern_calm: "남부의 평온"
 SIA_southern_calm_desc: "폭력은 관리되고 감시되는 고요 속으로 물러났습니다. 조약도 자치도 없지만 지방들은 기능하며 왕실의 비호는 유지됩니다. 존재감과 후원으로 유지되는 평온입니다."
 SIA_peace_dialogue_initiative: "평화 대화 구상"
 SIA_peace_dialogue_initiative_desc: "방콕은 말레이시아를 중재자로 하여 쿠알라룸푸르 트랙을 공식적으로 엽니다. 국가는 처음으로 자신이 사냥해 온 자들과 마주 앉아, 남부의 미래가 무력만이 아니라 협상의 문제라는 전제를 인정합니다. 국내에서 정치적 자본이 소모되지만, 총알로는 결코 열 수 없었던 길이 열립니다."
 SIA_mara_patani_talks: "MARA 빠따니 회담"
 SIA_mara_patani_talks_desc: "MARA 빠따니 우산 단체와의 공식 협상이 본격적으로 시작됩니다. 신뢰 구축 조치, 안전 구역, 진정한 휴전 체계가 테이블에 오릅니다. 쿠알라룸푸르는 적극 개입하고, 분열되었지만 실체가 있는 반군 지도부는 합의가 가능하다고 믿기 시작합니다."
 SIA_autonomy_framework: "특별 자치 체계"
 SIA_autonomy_framework_desc: "협상가들이 선출된 지역 평의회, 지역 언어 교육, 종교 법원, 개발 수익의 일부를 남부에 유보하는 내용의 세 개 도 특별 행정법을 기초합니다. 이는 왕국 역사상 가장 파격적인 양보이며, 방콕의 기득권층은 이미 이에 맞서 결집하고 있습니다."
 SIA_pattani_peace_accord: "빠따니 평화 협정"
 SIA_pattani_peace_accord_desc: "서명된 협정이 왕국 근현대사에서 가장 긴 반란을 끝냅니다. 남부는 단일 국가 태국 안에서 일정 수준의 자치를 얻고, 무기는 반납되며, 피난민이 돌아옵니다. 불완전하고 논쟁적이지만 역사적입니다. 분쟁은 끝났습니다."
 SIA_ds_tier_to_1: "§G최남단이 낮은 긴장 상태로 가라앉습니다 (1단계, 안정도 -2%).§!"
 SIA_ds_tier_to_2: "§Y빠따니에서 폭력이 고조됩니다 (2단계, 안정도 -4%, 정치력 -5%).§!"
 SIA_ds_tier_to_3: "§R남부가 불타오릅니다 (3단계, 안정도 -7%, 정치력 -10%, 전쟁 지지도 -5%).§!"
 SIA_ds_intensity_down: "§G반군 강도 [?ds_delta|0+]§!"
 SIA_ds_intensity_up: "§R반군 강도 [?ds_delta|0+]§!"
 SIA_ds_grievance_up: "§R지역 사회의 불만 [?ds_grievance_delta|0+]§!, 강도 하한이 상승합니다."
 SIA_ds_grievance_down: "§G지역 사회의 불만 [?ds_grievance_delta|0+]§!, 강도 하한이 하락합니다."
 SIA_pacification_complete_tt: "최남단 반란을 §Y강제§! 해결로 종결합니다. 반란 계기판과 결정이 영구히 닫힙니다."
 SIA_isoc_southern_command_tt: "§YISOC 네트워크§!가 이미 구축되어 있다면 반군 강도가 추가로 §G-4§! 감소합니다."
 SIA_southern_calm_tt: "최남단 반란을 §Y강제§! 해결로 종결합니다. 반란 계기판과 결정이 영구히 닫힙니다."
 SIA_pattani_peace_accord_tt: "최남단 반란을 §Y협상§!에 의한 타결로 종결합니다. 반란 계기판과 결정이 영구히 닫힙니다."
 SIA_anti_narcotics_bureau: "마약 단속국"
 SIA_anti_narcotics_bureau_desc: "태국 마약통제위원회 사무국이 확대되고 실권을 부여받아, 전담 예산과 보호되는 수사권, 그리고 길거리 판매상이 아니라 밀매 조직망을 추적하라는 공식 권한을 갖게 됩니다. 이 기관은 샨 주의 제조소에서 방콕의 유통 거점에 이르기까지 공급망을 표적으로 삼습니다."
 SIA_golden_triangle_interdiction: "골든 트라이앵글 차단"
 SIA_golden_triangle_interdiction_desc: "태국, 미얀마, 라오스가 만나는 3국 접경 지역은 태국 도시들에 넘쳐 나고 세계 시장으로 환적되는 헤로인과 메스암페타민 대부분의 원산지입니다. 국경 순찰 부대가 증강되고 항공 감시가 확대되며, 샨 민병대 파트너들과의 합동 기동대가 구성되어 메콩 강을 건너기 전에 물량을 차단합니다. 마약 조직은 늘 그랬듯 적응하겠지만, 이는 그 비용을 높입니다."
 SIA_anti_graft_push: "부패 척결 추진"
 SIA_anti_graft_push_desc: "국가반부패위원회에 실권이 부여되어 확대된 수사 권한과 별도 예산, 내부 고발자에 대한 법적 보호를 갖게 됩니다. 부패의 가장 수익성 높은 세 경로인 국방, 건설, 세관의 조달 비리가 우선 표적이 됩니다. 투명한 계약은 구태가 뿌리내린 것보다 구축하는 데 시간이 더 걸립니다. 이를 밀어붙이면 정치적 자본이 소모되고 옛 방식에 익숙한 대중이 동요합니다."
 SIA_transparency_watchdog: "투명성 감시 기구"
 SIA_transparency_watchdog_desc: "재무부가 아닌 의회에 직접 보고하는 독립적인 재정 투명성 사무소가 설립됩니다. 고위 공무원의 재산 공개 의무화, 실시간 공공 조달 보고, 시민 감사 포털이 체계적인 지대 추구를 가능하게 한 허점을 막습니다. 부패는 사라지지 않지만 유지하는 데 눈에 띄게 더 큰 비용이 들게 되며, 6개월 동안 폭로된 조직망은 절차와 지연을 통해 반격합니다."
 SIA_watchdog_backlash: "기계의 반격"
 SIA_watchdog_backlash_desc: "새로운 투명성 체제에 의해 폭로된 조직망은 사라지지 않았습니다. 6개월 동안 그들은 절차와 지연, 조용한 방해를 통해 개혁에 맞서며 정치력을 갉아먹고, 이들과 가장 얽혀 있는 지방에서는 대중의 신뢰를 갉아먹습니다."
 SIA_decentralize_governance: "지방에 권한을"
 SIA_decentralize_governance_desc: "부패 척결 추진에 이어 통치 권한과 예산 배분이 방콕에서 지방으로 재분배됩니다. 지방 행정 기구는 확대된 권한을 얻고, 선출직 도지사가 지역 기반시설 지출을 통제하며, 치앙마이, 콘깬, 송클라가 진정한 경제 활동의 부차적 중심지로 부상합니다. 성장이 집중되는 속도는 더디지만 더 차분하고 안정적인 길이 나라를 안정시킵니다."
 SIA_bangkok_primacy: "방콕 우선"
 SIA_bangkok_primacy_desc: "부패 척결의 배당은 수도에 재투자됩니다. 방콕의 산업 지구가 개선되고 연구 기관이 집중되며 대중교통 기반시설이 확충됩니다. 효율과 연구 성과는 급격히 오르지만, 비평가들은 지방이 기다리는 동안 번영이 인구 천만의 도시에 고여 있다고 지적하며, 그로 인한 분노는 나라의 분위기에 실질적인 부담이 됩니다."
 SIA_asean_hegemony: "ASEAN 패권"
 SIA_asean_hegemony_desc: "대태국 프로젝트가 대륙부에서 완료되었습니다. 이제 왕국은 시선을 동남아시아의 나머지로 돌립니다. ASEAN은 정신적으로 늘 태국이 이끄는 프로젝트였습니다. 필요하다면 칼로써 사실로 만드십시오. 참모본부는 군도와 도시 국가를 복속시키기 위한 비상 계획을 입안합니다."
 SIA_maritime_claims: "해양 변경"
 SIA_maritime_claims_desc: "지협 너머에는 거대한 군도 국가들, 마닐라와 자카르타, 그리고 석유가 풍부한 브루나이 술탄국이 있습니다. 대양 해군의 추진에는 태국 왕립 해군과 해병대의 전력이 총동원되어야 합니다. 해군 본부는 남중국해와 자바 접근로를 가로지르는 상륙 작전 계획을 시작합니다."
 SIA_maritime_claims_threat: "군도에서의 태국 해군 증강"
 SIA_claim_philippines: "필리핀 복속"
 SIA_claim_philippines_desc: "필리핀 군도는 남중국해 동쪽 접근로를 장악하고 있습니다. 마닐라를 방콕의 통치 아래 두면 해양 측면이 안전해지고 새 질서를 위한 1억 필리핀인의 노동력을 얻습니다. 우리는 공화국의 모든 섬에 대한 영유권을 주장합니다."
 SIA_claim_indonesia: "인도네시아 복속"
 SIA_claim_indonesia_desc: "인도네시아는 남쪽의 거인으로, 광대하고 인구가 많으며 자원이 풍부합니다. ASEAN을 지배하려면 방콕은 자카르타를 지배해야 합니다. 전역은 길고 섬은 많겠지만, 포상은 동남아시아 최대의 경제와 인구입니다."
 SIA_claim_brunei: "브루나이 점령"
 SIA_claim_brunei_desc: "작은 브루나이는 지역에서 가장 풍부한 탄화수소 매장량 위에 앉아 있습니다. 술탄국의 부와 보르네오에서의 전략적 위치는 거부할 수 없는 포상입니다. 우리는 술탄국을 왕국에 편입시키려 움직입니다."
 SIA_mainland_claims: "대륙부 정리"
 SIA_mainland_claims_desc: "대륙부의 두 세력은 아직 무릎을 꿇지 않았습니다. 안남 산맥 너머의 오랜 숙적 베트남, 그리고 말라카 해협을 지키는 부유한 도시 국가 싱가포르입니다. 동남아시아에서 태국의 우위를 완성하려면 둘 다 굴복시켜야 합니다."
 SIA_mainland_claims_threat: "대륙부 저항 세력에 대한 태국의 동원"
 SIA_claim_vietnam: "베트남 복속"
 SIA_claim_vietnam_desc: "베트남은 옛 시암의 궁정에서 20세기의 킬링필드에 이르기까지 오랫동안 태국과 동남아시아 대륙부를 두고 다퉈 왔습니다. 이제 역사적 경쟁에 결말이 날 것입니다. 우리는 메콩에서 안남 해안까지 영유권을 주장합니다."
 SIA_claim_singapore: "싱가포르 점령"
 SIA_claim_singapore_desc: "싱가포르는 해협의 보석으로, 금융 강국이자 세계에서 가장 붐비는 항로의 문지기입니다. 사자의 도시를 차지하는 자가 아시아 상업의 목줄을 쥡니다. 우리는 이를 태국의 것으로 만들려 움직입니다."
 SIA_asean_protector: "ASEAN의 수호자"
 SIA_asean_protector_tt: "동반자 관계의 길은 §Y대태국 위임 통치§!를 포함한 모든 정부에 열려 있습니다."
 SIA_asean_protector_desc: "대태국이 반드시 정복의 제국일 필요는 없습니다. 대륙부를 확보한 왕국은 대신 이웃 국가를 병합하는 대신 지키는 자애로운 패권국으로서 동남아시아 안보의 보증인이 될 수 있습니다. 방콕은 지역 전역에 보호를 확대하여 점령이 아닌 동맹을 통해 ASEAN을 태국 왕관에 묶습니다."
 SIA_guarantee_maritime: "군도의 방패"
 SIA_guarantee_maritime_desc: "태국은 해양 국가인 필리핀, 인도네시아, 브루나이에 공식적인 안전 보장을 확대합니다. 태국 왕립 해군이 그들의 독립을 보증하며, 그 대가로 방콕은 남쪽 바다에서 없어서는 안 될 강국이 됩니다."
 SIA_guarantee_mainland: "대륙부의 수호자"
 SIA_guarantee_mainland_desc: "방콕은 베트남, 싱가포르, 말레이시아의 안보를 보장하며, 태국 주도의 타결로 수 세기에 걸친 경쟁에 종지부를 찍습니다. 오랜 적과 부유한 도시 국가, 그리고 반도의 이웃이 모두 왕국의 보호 아래 몸을 맡기고, 대륙부는 태국의 조건으로 평화를 얻습니다."
 SIA_guarantee_indochina: "인도차이나 위의 우산"
 SIA_guarantee_indochina_desc: "태국의 이웃 중 가장 가난하고 취약한 나라들은 패권국이 보통 건너뛰는 나라들입니다. 방콕은 그럼에도 이들을 보장합니다. 라오스, 캄보디아, 미얀마, 그리고 그들이 있는 곳의 버마 변경 소국들입니다. 약자에게 닿는 보호만이 왕국이 말한 대로 행한다는 것을 증명합니다."
 SIA_protector_of_asean_focus: "하나의 ASEAN, 하나의 방패"
 SIA_protector_of_asean_focus_desc: "서명된 우산 하나만으로도 지역의 정치 역학을 바꾸기에 충분합니다. 방콕이 어느 보장을 먼저 확대했든, 왕국은 동남아시아의 수호자로 기능하며 태국 주도의 안보 구조가 낡은 공포의 균형을 대체하기 시작합니다. 지역의 방위는 불가분이 되어 가고, 방콕이 쐐기돌을 쥐고 있습니다."
 SIA_professional_officer_corps_focus: "전문 장교단"
 SIA_professional_officer_corps_focus_desc: "개혁파가 논쟁에서 승리합니다. 능력에 따른 진급, 실질적인 참모대학 양성 체계, 후원이 아닌 교리에 기반한 지휘 문화. 군이 정치가 아닌 군인 본연의 일에서 자부심을 느끼게 되면서 쿠데타 습성은 사라집니다."
 SIA_martial_prestige_focus: "검의 영광"
 SIA_martial_prestige_focus_desc: "전통주의자들이 승리합니다. 군은 국가의 혼으로 칭송받고 연병장은 사원만큼 신성하게 여겨집니다. 사기와 상무 정신은 치솟지만, 군복 숭배는 장성들을 권력의 중심 가까이에 붙들어 둡니다."
 SIA_jointness_reform: "합동성 개혁"
 SIA_jointness_reform_desc: "합동 지휘 부대가 세 군을 하나의 전투 수단으로 엮습니다. 참모진을 통합하고 교리를 공유하며 지휘 계통을 일원화함으로써, 병렬적 지휘 구조는 다영역 작전이 가능한 일관된 군대로 진화합니다."
 SIA_defense_export_office: "국방 수출 사무소"
 SIA_defense_export_office_desc: "계약을 중개하고 금융을 주선함으로써 태국산 체계를 세계 시장에 선보이고, 방위 산업 기반을 예산의 부담이 아닌 수익원으로 바꾸는 전담 기관입니다."
 SIA_self_reliant_defense_base: "자력 방위 기반"
 SIA_self_reliant_defense_base_desc: "새로운 무기 공장과 심화된 공급망은 왕국이 외국 공급처에 의존하는 데서 벗어나게 합니다. 태국은 자국 공장에서 자체 설계로 자체 일정에 맞추어 자국과 고객국을 무장시킬 수 있습니다."
 SIA_total_defense_doctrine: "총력 방위 교리"
 SIA_total_defense_doctrine_desc: "방위는 확대된 징병과 일상적인 민방위 훈련, 강화된 후방으로 이루어진 전 국가적 사업이 됩니다. 왕국은 군대뿐 아니라 저항할 준비가 된 사회를 준비합니다."
 SIA_doctrine_professional_tt: "§Y전문 병력§! 국가 정신을 다음 단계로 업그레이드하고 왕국을 전문화 노선에 전념시킵니다."
 SIA_doctrine_prestige_tt: "§Y무인의 영광§!을 부여하고 왕국을 위신 노선에 전념시키며, 안정도를 희생하는 대신 높은 전쟁 지지도와 지휘력을 얻습니다."
 SIA_national_rnd_network: "과학 단지 건설"
 SIA_national_rnd_network_desc: "공공 연구소와 대학 협력, 빠툼타니의 전담 과학 단지가 왕국에 독자적인 연구 기반을 제공합니다. 국가과학기술개발청이 R&D 시설망의 중심이 되어 기술 도입을 가속하고 경제 전체를 더 높은 부가가치 산업으로 끌어올립니다."
 SIA_civilian_rnd_center: "민간 R&D 센터"
 SIA_civilian_rnd_center_desc: "실험실과 시험대, 왕국이 다음에 필요로 하는 것이면 무엇이든 자유롭게 추구하는 엔지니어 집단을 갖춘 전담 민간 연구 및 시제품 시설입니다. 왕국이 처음 가졌던 단 하나의 해군 조선소에 맞서는 네 번째 연구 센터이며, 독자적인 프로젝트를 개발할 여지를 줍니다."
 SIA_air_rnd_center: "항공 R&D 센터"
 SIA_air_rnd_center_desc: "풍동과 계측 비행 시험장, 이를 운용할 엔지니어를 갖춘 항공전자 및 항공 시설입니다. 태국 산업은 완성품을 해외에서 사 오는 대신 국내에서 항공 체계의 시제품을 만들 시험대를 얻습니다."
 SIA_army_rnd_center: "지상전 R&D 센터"
 SIA_army_rnd_center_desc: "장갑 시험 궤도와 무기 사격장, 설계국을 갖춘 지상 체계 시험장입니다. 육군은 외국 공급처와 그 조건을 기다리는 대신 자체 차량과 장비를 개발하고 시제품화할 수 있습니다."
 SIA_gistda_space_agency: "GISTDA 강화"
 SIA_gistda_space_agency_desc: "지리정보우주기술개발청이 실질적인 권한과 실질적인 예산을 부여받습니다. 위성 데이터를 해석하기 위해 설립된 GISTDA는 지상국을 운용하고 엔지니어를 양성하며 태국 연구에 위에서 내려다보는 창을 주는 왕국의 우주 기관이 됩니다. 소규모 우주 프로그램은 더 이상 외국의 사치가 아니라 국가의 역량입니다."
 SIA_theos_earth_observation: "THEOS 지구 관측"
 SIA_theos_earth_observation_desc: "태국 최초의 지구 관측 위성 THEOS가 궤도에서 왕국 자신의 눈을 열어 국토를 지도화하고 홍수와 작황을 추적하며, 어떤 이웃도 막을 수 없는 영상을 정보 기관에 공급합니다. 후속 프로그램은 광학, 다운링크, 영상 처리에서 이 기관의 전문성을 심화하고 원시 촬영 자료를 실행 가능한 정찰로 바꿉니다."
 SIA_space_krenovation_park: "우주 크레노베이션 파크"
 SIA_space_krenovation_park_desc: "클린룸과 조립 홀, 위성 부품 및 소형 발사체를 위한 공급망을 갖춘 항공우주 산업 단지가 동부 해안에 들어섭니다. 연구 기관으로 시작한 것이 이제 국내 항공우주 산업의 중심이 되어 민간 기업을 끌어들이고 태국 공학에 자기 것이라 부를 고부가가치 부문을 선사합니다."
 SIA_sovereign_launch_capability: "주권적 발사 역량"
 SIA_sovereign_launch_capability_desc: "왕국은 마지막 간극, 곧 누구의 허락도 구하지 않고 자체 위성을 설계, 제작하여 궤도에 올릴 능력을 메우기로 결의합니다. 토착 발사체 및 위성군 프로그램이 20년의 노력을 마무리하여, 태국을 우주에 주권적 발판을 가진 소수의 국가에 올려놓고 누구에게도 책임지지 않는 정보 능력을 부여합니다."
 SIA_ptt_energy_champion: "PTT, 국가 에너지 대표 기업"
 SIA_ptt_energy_champion_desc: "국영 에너지 기업이 증권 거래소에 상장되어 상업적 거대 기업으로 풀려납니다. IPO 자본과 타이만에서 미얀마에 이르는 탐사 권한을 두둑이 받은 PTT는 왕국의 연료 공급을 확보하고 가장 큰 단일 기업이 됩니다."
 SIA_scg_industrial_titan: "시암 시멘트 그룹"
 SIA_scg_industrial_titan_desc: "왕국에서 가장 오래되고 큰 산업 재벌이 시멘트에서 석유화학, 건축 자재, 포장재로 확장합니다. SCG의 수주 잔고는 건설 붐을 뒷받침하고 어떤 인프라 프로그램도 없이는 안 되는 국내 공급망의 닻이 되며, 그룹이 인허가 관료제에 더 기대는 와중에도 그 세수는 함께 늘어납니다."
 SIA_packaging_empire: "포장 제국"
 SIA_packaging_empire_desc: "SCG의 포장 부문이 거래소에 상장하고 지역 전역에서 인수에 나서, 인도네시아에서 베트남에 이르는 공장을 흡수하며 동남아시아 절반을 위해 인쇄하고 성형합니다. 내세우는 것은 순환 경제입니다. 재활용 섬유, 더 가벼운 플라스틱, 더 낮은 탄소. 그 대가는 인수당하거나 가격 경쟁에서 밀려나는 소규모 인쇄업자와 상자 제조업자가 치릅니다."
 SIA_cp_agribusiness_giant: "차런 포카판 그룹"
 SIA_cp_agribusiness_giant_desc: "사료 공장에서 세븐일레븐까지, CP 재벌이 태국의 농업 및 유통 거인이 됩니다. 계약 농업은 농촌 소득을 끌어올리고 진열대를 채우며, CP의 수출력은 태국 식품을 아시아와 유럽의 모든 시장에 실어 나릅니다. 상업화된 농업 생산성이 계약 농업 네트워크 전체에서 상승하고, 이산 쌀 지대에 두 번째 구역이 들어섭니다."
 SIA_buffer_states: "완충국 지대"
 SIA_buffer_states_desc: "태국은 샨과 카렌을 삼키는 대신 살아 있고 무장한 채로 유지시켜, 버마의 압력이 왕국에 닿기 전에 흡수하는 우호적 완충의 울타리로 삼을 것입니다. 국경 횡단 보급선과 훈련 캠프, 은밀한 보장이 변경의 반군을 방패로 바꿉니다."
 SIA_protectorate_doctrine: "보호령 교리"
 SIA_protectorate_doctrine_desc: "참모본부는 정복이 아닌 봉신 관계라는 제국의 더 부드러운 수단을 택합니다. 변경 소국들은 태국의 보호 아래 속국으로 편입되며, 그들의 깃발은 방콕에 응답하는 수도 위에 계속 휘날립니다."
 SIA_annexation_doctrine: "병합 교리"
 SIA_annexation_doctrine_desc: "어정쩡한 조치는 없습니다. 변경 지대는 완전히 점령되고, 그 영토는 왕국에 편입되며, 분리주의 정부는 해산됩니다. 방콕은 샨과 카렌의 중심지에 대한 영유권을 주장하고 이를 집행할 육군을 준비합니다."
 SIA_subdue_the_shan: "샨 복속"
 SIA_subdue_the_shan_desc: "태국 왕립 육군이 남부 샨 주로 진격합니다. 그것이 태국 보호령으로 끝날지 태국의 주로 끝날지는 선택한 교리에 달려 있지만, 어느 쪽이든 방콕의 명령은 살윈 강까지 미칠 것입니다."
 SIA_subdue_the_karen: "카렌 복속"
 SIA_subdue_the_karen_desc: "태국군이 카렌 구릉 지대로 진입합니다. 수십 년에 걸친 피난처와 조용한 후원은 끝나고, 왕국은 이제 정책이 요구하는 대로 괴뢰국으로 삼거나 병합하기 위한 주인으로서 나타납니다."
 SIA_burma_breakaway_question: "분리 독립 국가들"
 SIA_burma_breakaway_question_desc: "살윈 강 건너편에서 버마의 통치는 샨, 카렌, 와 같은 무장 소국들의 누더기로 무너졌습니다. 그들은 약하고 분열되어 있으며 태국의 손이 닿는 범위 안에 있습니다. 방콕은 이 분리 독립 영토들이 왕국에 무엇인지 결정해야 합니다. 방패인지, 포상인지, 관리해야 할 문제인지."
 SIA_subdue_the_wa: "와 복속"
 SIA_subdue_the_wa_desc: "와주 연합군은 분리주의 무장 세력 가운데 가장 강력하며 마약에 가장 깊이 얽혀 있는 집단입니다. 와 산악 지대를 제압하려면 치열한 전투를 치러야 하지만, 왕국 문턱의 마약 유통로를 차단하고 미얀마 국경 산악 깊숙이 태국 국기를 꽂을 수 있습니다."
 SIA_rta_looks_abroad: "M48의 육십 년"
 SIA_rta_looks_abroad_desc: "태국 왕립 육군은 여전히 지난 세기의 전차와 장갑차를 운용하고 있습니다. 이제 장비를 교체할지는 문제가 아니며, 코랏의 정문을 통과할 철갑이 누구의 것이 될지, 그리고 거기에 어떤 조건이 용접되어 딸려 올지가 문제입니다. 생산 능력이 허락하는 곳마다 새 생산 라인이 들어섭니다."
 SIA_stryker_brigades: "서방의 바퀴"
 SIA_stryker_brigades_desc: "스트라이커 여단, 미국식 교리, 그리고 세계에서 가장 유능한 군대로 곧바로 연결되는 병참망입니다. 장비는 뛰어나고 상호운용성은 값을 매길 수 없지만, 모든 탄약은 달러로, 그리고 워싱턴에 대한 굴종으로 치러야 합니다."
 SIA_eda_blackhawks: "초강대국의 헌 옷"
 SIA_eda_blackhawks_desc: "잉여 방위 물자와 대외 군사 판매를 통해 정비를 마친 블랙호크와 코브라가 정가의 일부 가격으로 들어옵니다. 기체는 이미 한 번 날았던 것이지만, 적은 예산으로 공중 기동력을 얻는 것은 동맹이 가능하게 해 주는 이득입니다."
 SIA_vn1_mechanization: "소대마다 장갑차 한 대씩"
 SIA_vn1_mechanization_desc: "중국 생산 라인에서 나온 VN1과 VN16 장갑차를 서방 차량 몇 대 값으로 수백 대 들여옵니다. 보병은 마침내 차량에 올라타게 되고, 이를 생산하는 공장은 연말이 되기 전에 비용이 회수됩니다."
 SIA_norinco_fires: "노린코 전 제품군"
 SIA_norinco_fires_desc: "SH1 곡사포와 SR5 다연장 로켓포까지, 전 제품군을 패키지 가격으로 들여옵니다. 화력은 확실하지만 예비 부품 대기열과 야전에서 고장 나는 변속기 또한 확실합니다. 싼 강철은 병참 장교를 밤새 잠 못 들게 합니다."
 SIA_tavor_standard: "우리의 소총"
 SIA_tavor_standard_desc: "타보르 면허 생산을 통해 태국 공장이 육군 제식 소총의 공급원이 됩니다. 금수 조치도, 대기자 명단도, 누구를 무장시킬지에 대한 외국의 거부권도 없습니다. 오직 방콕에만 응답하는 병기창의 첫 벽돌입니다."
 SIA_oplot_and_rotors: "바자르 외교"
 SIA_oplot_and_rotors_desc: "우크라이나의 오플로트 차체, 러시아의 Mi-17 회전익 등 어느 편도 들지 않는 구매자에게 시장이 내놓는 것이면 무엇이든 사들입니다. 전력은 사방에서 한꺼번에 흘러들고, 워싱턴과 베이징을 똑같이, 감당할 만큼만 거슬리게 합니다."
 SIA_dti_black_widow: "검은 과부 거미"
 SIA_dti_black_widow_desc: "국방기술연구소가 자체 개발한 8x8 차량과 차이세리의 실전 검증을 거친 퍼스트 윈입니다. 태국이 설계하고 태국이 만들었으며, 다른 나라가 사고 싶어 할 만큼 훌륭합니다. 병기창이 스스로 비용을 충당하기 시작했습니다."
 SIA_first_army_modernized: "새로운 태국 왕립 육군"
 SIA_first_army_modernized_desc: "어떤 길을 거쳐 장비를 교체했든, 그 결과가 마침내 열병장에 섰습니다. 새 장비를 갖추고 재훈련을 마쳐, 실제로 싸우게 될 세기에 대비한 현대적인 태국 왕립 육군입니다."
 SIA_gripen_globaleye: "하늘 전체를 보는 눈"
 SIA_gripen_globaleye_desc: "사브의 글로벌아이 조기경보통제기는 그리펜 몇 대를 먼저 보고 먼저 쏘는 네트워크화된 전력으로 바꿔 놓습니다. 공중 레이더는 소규모 공군이 수적 열세를 훨씬 뛰어넘는 타격력을 내게 하는 승수 효과입니다."
 SIA_j10_squadrons: "돈므앙 상공의 용"
 SIA_j10_squadrons_desc: "J-10CE 다목적 전투기를 비행대대 단위로, 워싱턴이 결코 맞출 수 없는 가격에, 그리고 워싱턴이 결코 용서하지 않을 방식으로 들여옵니다. 포트워스 대신 청두를 택하는 것은 왕국의 하늘과 동맹 관계를 새로 배선하는 일입니다."
 SIA_hq9_air_defense: "미사일의 지붕"
 SIA_hq9_air_defense_desc: "HQ-9와 FK-3 장거리 지대공 포대가 중부 평원 위에 우산을 펼칩니다. 저렴하고 촘촘하며 통합되어 있습니다. 중국식 지역 거부입니다."
 SIA_wing_loong_uav: "인내하는 사냥꾼"
 SIA_wing_loong_uav_desc: "익룡과 CH 시리즈 무인기는 하루 종일 상공을 선회하다 명령에 따라 타격합니다. 유인 비행대대 하나 값으로 대규모 무인 정찰과 정밀 타격을 확보합니다."
 SIA_f5th_super_tigris: "늙은 호랑이의 새로운 재주"
 SIA_f5th_super_tigris_desc: "이스라엘제 항전 장비, AESA 레이더, 파이썬-5 미사일이 노장 F-5를 F-5TH '슈퍼 타이그리스'로 탈바꿈시킵니다. 새 항공기는 아니지만, 이미 값을 치른 기체에서 전투력을 쥐어짜 내며 어떤 초강대국에도 빚지지 않습니다."
 SIA_dti_uav_command: "주권의 눈"
 SIA_dti_uav_command_desc: "국내에서 설계하고 운용하는 국방기술연구소의 무인기 비행단이 태국 자체의 정찰 영상을 제공하며, 이웃 나라에 팔 상품도 됩니다."
 SIA_air_dominance_doctrine: "태국 하늘의 주인"
 SIA_air_dominance_doctrine_desc: "어떤 장비로 무장했든, 태국 왕립 공군은 현대적이고 네트워크화된 다목적 전력으로 거듭나 수호를 맹세한 영공의 주인이 됩니다."
 SIA_korean_frigates: "푸미폰 표준"
 SIA_korean_frigates_desc: "함대를 위한 서방의 선택입니다. 한국의 현대적인 DW3000 호위함은 서방제 전투 체계와 지역 방공 능력을 갖춘, 함대가 일찍이 운용한 가장 유능한 수상 전투함입니다. 품질에는 대가가 따르며, 서울은 그 값을 달러로 부릅니다."
 SIA_chinese_engine_compromise: "중국제 심장"
 SIA_chinese_engine_compromise_desc: "독일제 엔진은 결코 오지 않을 것이고, 잠수함은 십 년을 기다렸습니다. 중국제 CHD620 동력 장치를 받아들이면 잠수함은 마침내 출항합니다. 저렴하고 주권적이지만, 기술자들이 1년 동안 욕을 하게 될 초기 불안정기가 따릅니다."
 SIA_type071_flotilla: "후둥의 선체"
 SIA_type071_flotilla_desc: "071E형 상륙선거함과 중국제 초계함 여러 척이 하룻밤 사이에 함대에 상륙 능력을 안겨 줍니다. 서방 함선 한 척 값이면 됩니다."
 SIA_krabi_class_opv: "우리 손으로 놓은 용골"
 SIA_krabi_class_opv_desc: "함대를 위한 독립적인 선택입니다. 방콕 조선소에서 건조하는 끄라비급 해양 경비함이 주권 조선 산업의 용골을 놓습니다. 성숙하기까지는 오래 걸리지만, 어떤 외국 조선소에도 종속되지 않습니다."
 SIA_european_propulsion: "면허 생산한 심장, 태국의 선체"
 SIA_european_propulsion_desc: "파트너십이 아닌 구매입니다. MTU 디젤 엔진과 전투 체계를 면허로 단 한 번 사들인 뒤, 나사 하나까지 분해하여 나머지는 국내에서 만듭니다. 수입한 노하우는 어떤 후원국에도 빚지지 않는 주권적 계획 속으로 흡수됩니다."
 SIA_naval_self_reliance: "방콕 조선소의 호위함"
 SIA_naval_self_reliance_desc: "태국 조선소는 이제 자체 설계한 군함을 건조하며, 해군 방위 산업 기반은 복리로 성장해 수출까지 합니다. 마침내 함대가 국내에서 만들어집니다."
 SIA_command_of_the_seas: "두 개의 만, 하나의 함대"
 SIA_command_of_the_seas_desc: "어떤 방식으로 건조했든, 태국 왕립 해군은 진정한 원양 해군으로 우뚝 서서 타이만을 지키고 안다만해까지 뻗어 나가며, 왕국의 두 해안을 적시는 바다를 장악합니다."
 SIA_the_western_anchor: "아시아의 워싱턴 닻"
 SIA_the_western_anchor_desc: "육군, 공군, 해군 모두를 서방제로 사들이면 동맹은 국방의 초석이 됩니다. 상호운용성, 정보 공유, 그리고 암묵적인 미국의 보장을 얻는 대가로 워싱턴의 궤도 안에 확고히 자리 잡게 됩니다."
 SIA_the_bamboo_bloc: "용의 그림자 속으로"
 SIA_the_bamboo_bloc_desc: "세 군이 모두 베이징의 장비로 무장하면 태국은 이 지역에서 중국의 으뜸가는 무기 고객이 됩니다. 값싼 물량, 공유되는 C4ISR 영상, 강력한 후원자를 얻는 대신 서방의 신뢰를 대가로 치릅니다."
 SIA_strategic_autonomy: "누구에게도 얽매이지 않는다"
 SIA_strategic_autonomy_desc: "점점 더 국내에서 만들고 해외에 판매하는 군대입니다. 국방기술연구소는 지역 무기 제조사로 성장하고, 왕국은 자국 방위 수단에 관해 어떤 외국 수도에도 책임을 지지 않습니다."
 SIA_the_bamboo_doctrine: "바람에 휘어라"
 SIA_the_bamboo_doctrine_desc: "스웨덴제 전투기, 중국제 전차, 베이징의 잠수함, 서울의 호위함. 태국은 모두에게서 사들이고 누구에게도 속하지 않습니다. 폭풍에 휘는 갈대는 폭풍을 이겨냅니다. 가장 오래된 태국의 전략이 전투 서열로 구현되었습니다."
 SIA_dual_use_threshold: "이중 용도의 문턱"
 SIA_dual_use_threshold_desc: "모든 민간 원자력 발전 계획은 무기 계획이 필요로 하는 잠재 능력을 그대로 지니고 있습니다. 에너지 독립이라는 명분 아래 우라늄 농축을 포함한 핵연료 주기를 조용히 숙달하면, 왕국은 아직 어느 쪽도 선언하지 않은 채 모든 선택지를 열어 둘 수 있습니다."
 SIA_minimum_deterrent: "최소 억제력"
 SIA_minimum_deterrent_desc: "더도 말고 탄두 몇 발이면 이웃 나라도 강대국도 더 이상 왕국을 만만하게 볼 수 없게 됩니다. 태국은 자신만의 방식으로 핵 클럽에 가입하며, 내각은 이제 이 폭탄이 무엇을 위한 것이라고 말할지 공개적으로 결정해야 합니다."
 SIA_the_democrats_endure: "민주당은 버틴다"
 SIA_the_democrats_endure_desc: "왕국에서 가장 오래된 정당인 민주당은 포퓰리즘의 물결에 정권을 내주지 않고 집권을 유지합니다. 압승도, 카리스마 있는 억만장자도 없이, 광범위한 민간 연립으로서 통치하는 꾸준하고 화려하지 않은 일이 이어집니다. 당은 단 한 명의 지도자가 아닌 제도에 미래를 겁니다."
 SIA_chuan_clean_government: "깨끗한 정부"
 SIA_chuan_clean_government_desc: "'미스터 클린'이 키를 잡습니다. 개인적 청렴이라는 평판이 당의 브랜드가 되어, 예산 공개와 전문적인 부처 운영, 그리고 갈색 봉투와의 전쟁으로 이어집니다. 화려하지는 않겠지만, 정직한 통치를 지속적인 지지층으로 바꾸는 기구를 만들어 냅니다."
 SIA_rule_of_law: "법치"
 SIA_rule_of_law_desc: "지키겠다고 맹세한 헌법에 따라 사는 정부입니다. 적법 절차, 예측 가능한 행정, 병영이 아닌 법에 응답하는 법원이 그것입니다. 모든 쿠데타는 규칙서를 정지시키는 데서 시작되므로, 왕국은 그것을 지키는 법을 배웁니다."
 SIA_judicial_independence: "독립된 법원"
 SIA_judicial_independence_desc: "사법부를 궁정 인맥과 장성들 모두로부터 격리합니다. 압력을 받지 않는 법원은 해산과 쿠데타의 악순환을 막는 가장 확실한 제동 장치이며, 기득권 세력이 가장 즐겨 쓰는 무기인 사법 적극주의도 근원에서 무뎌집니다."
 SIA_strengthen_parliament: "의회 강화"
 SIA_strengthen_parliament_desc: "선출된 의회에 실제로 통치할 수 있는 인력과 위원회, 그리고 위상을 부여합니다. 제대로 작동하는 입법부 덕분에 당은 긴급 칙령이 아닌 표결로 통치할 수 있으며, 국민도 모든 회기의 결과에 이해관계를 갖게 됩니다."
 SIA_liberal_market_stewardship: "자유 시장 관리"
 SIA_liberal_market_stewardship_desc: "건전한 통화, 개방 무역, 지출보다 규제를 택하는 국가입니다. 민주당은 탁신 경제학에 맞서는 기술 관료적 대안을 제시하며, 농촌에 현금을 뿌리는 대신 금융, 수출, 민간 기업이 이끄는 성장을 추구합니다."
 SIA_southern_stronghold: "남부의 거점"
 SIA_southern_stronghold_desc: "당의 근거지는 남부이고 남부에는 불만이 있습니다. 검문소가 아닌 도로, 학교, 진료소로 이에 답하고, 서류상의 약속이 아니라 국고에서 실제로 재원을 대십시오. 개발을 통한 평화는 지지 기반의 충성을 지키고 반군의 신병 공급을 말려 버립니다."
 SIA_coalition_government: "연립 정부"
 SIA_coalition_government_desc: "힘들게 이루어 낸 권력으로, 여러 파트너와 지역 블록, 소수 정당이 얽혀 실질적인 과반을 이룬 것입니다. 느리고 타협적이지만, 전차가 가장 명분을 찾기 어려운 정부 형태이기도 합니다. 선출된 질서는 권력을 나눔으로써 살아남습니다."
 SIA_mature_democracy: "성숙한 민주주의"
 SIA_mature_democracy_desc: "왕국은 충성스러운 야당과 함께 평화로운 정권 교체의 문턱을 넘고, 국민은 쿠데타를 역사로 여길 수 있게 됩니다. 어떤 단일 선거 운동보다 제도가 더 중요합니다. 더 깨끗한 행정과 지속 가능한 권위를 얻는 대신, 더 폭넓은 연립이 얻을 수 있는 지지율 상승보다 느린 속도를 감수합니다."
 SIA_grand_coalition: "대연정"
 SIA_grand_coalition_desc: "낡은 질서와 싸우는 대신 그것을 흡수합니다. 민주당은 보수 기득권의 선출직 얼굴이 되어 지주와 재계를 끌어들이고, 궁정과 관료, 이사회가 병영 대신 투표함을 통해 통치합니다. 합의로 얻은 안정이지만, 그 대가는 당이 한때 맞서 싸웠던 바로 그 후원 네트워크를 먹여 살리는 것입니다."
 SIA_coalition_overhead: "연립 유지 비용"
 SIA_coalition_overhead_desc: "큰 천막 안으로 들어온 모든 파트너가 자기 몫을 원합니다. 연립을 유지하는 데는 혼자 통치할 때보다 더 많은 정치적 자본이 듭니다."
 SIA_democrat_revival: "민주당의 귀환"
 SIA_democrat_revival_desc: "야당의 황야에서 출발해, 당은 2019년 이후의 연립 흥정판을 거쳐 총리 자리로 되돌아옵니다. 민주당은 다시 집권했고, 더 나이가 들고 반성하는 모습으로 이번에는 민간 질서를 정착시키겠다고 결의합니다."
 SIA_answer_thaksinomics: "탁신 경제학에 답하다"
 SIA_answer_thaksinomics_desc: "탁신의 천재성은 방콕이 한 번도 성공하지 못한 일, 곧 마을을 결집시킨 데 있었습니다. 마을 기금을 비웃지 말고, 사람들을 늘어나는 빚과 줄어드는 기회에서 건져 올릴 더 나은 기금을 만드십시오. 타이락타이보다 먼저 시행하는 농촌 신용, 농민 부채 상환 유예, 저가 의료로 이루어진 민주당의 계획은 농촌을 내주고 법원을 통해서만 권력을 되찾는 대신, 포퓰리즘의 호소를 근원에서 무뎌지게 합니다.\n\n§G포퓰리즘의 물결이 잦아듭니다.§!"
 SIA_pracha_wiwat: "국민의 의제"
 SIA_pracha_wiwat_desc: "쁘라차 위왓은 새해 선물로 공개된 아홉 가지 조치입니다. 가장 가난한 가구에 대한 무료 전기, 취사용 가스 보조금, 오토바이 택시 기사와 노점상 등 비공식 경제 종사자를 위한 복지와 등록, 제도 밖 노동자를 위한 저축 제도가 포함됩니다. 자유주의적 보수 정당도 국고를 파산시키지 않고 결핍에 답할 수 있음을 보여 주는 증거입니다.\n\n§G포퓰리즘의 물결이 잦아듭니다.§!"
 SIA_contest_every_election: "모든 선거에 출마한다"
 SIA_contest_every_election_desc: "조작된 조기 총선이든, 도피 중인 인물에 대한 사면이든, 매수된 법원이든 어떤 도발이 있어도 당은 민주주의의 게임에 남습니다. 모든 선거에 출마하고 모든 결과를 받아들입니다. 이는 당이 2006년과 2014년에 저버렸던 규율이며, 민주당은 군인과 판사가 대신 이겨 줄 때만 이긴다는, 유일하게 진정으로 먹혀들었던 비난을 포퓰리스트들에게서 빼앗습니다.\n\n§G포퓰리즘의 물결이 잦아들며,§! 거리로 통하는 문이 영구히 닫힙니다."
 SIA_the_street_over_the_ballot: "투표보다 거리"
 SIA_the_street_over_the_ballot_desc: "투표함에서 지는 것은 이제 충분합니다. 당의 의석을 사퇴하고 운동을 거리로 끌고 나가십시오. 시위는 수도를 마비시키고 선출된 정부가 무너질 때까지 나라를 통치 불능 상태로 만듭니다. 효과는 있었고 수도는 혼란에 빠졌습니다. 장성들은 손에 쥐여진 구실을 받아들이고 전차가 굴러 나오며, 한때 깨끗한 민간 통치를 대표했던 당은 쿠데타의 산파로 기억됩니다.\n\n§R왕국이 군부 통치로 넘어갑니다. 민주당의 길은 여기서 끝나며, 새 질서는 자체 갈래를 갖게 됩니다.§!"
 SIA_break_into_isan: "북동부로 진출하다"
 SIA_break_into_isan_desc: "당이 한 번도 하지 못했던 구조적 해법입니다. 한 세대 동안 민주당은 남부와 방콕을 차지하고, 광대하고 가난한 북동부는 기본적으로 탁신에게 내주었습니다. 대신 그곳에서 십 년을 보내십시오. 지부를 세우고, 후보를 내고, 이산에 그들의 조건에 맞는 믿을 만한 재분배 방안을 제시하십시오. 포퓰리즘의 본거지에서 작은 거점이라도 얻으면 물결은 그 수원을 잃습니다. 지속적인 권력에 이르는 가장 어려운 길이지만, 법원에 의존하지 않는 유일한 길입니다.\n\n§G이제부터 포퓰리즘의 물결은 훨씬 더디게 차오릅니다.§!"
 SIA_board_of_investment: "투자위원회 권한 강화"
 SIA_board_of_investment_desc: "투자위원회는 늘 태국의 조용한 엔진이었으며 외국 자본을 유치하고 태국 기업의 해외 진출을 이끌어 왔습니다. 여기에 실질적인 권한과 예산을 주십시오. 투자는 더 싸고 빨라지며, 방콕이 해외에 투입하는 모든 바트는 더 강해져서 돌아옵니다."
 SIA_regional_trade_network: "지역 무역망"
 SIA_regional_trade_network_desc: "흩어진 양자 협정들을 아세안과 그 너머에 걸친 진정한 자유 무역 협정망으로 엮어 냅니다. 태국이 체결하는 모든 협정은 이제 국고에 관세 배당금을 안겨 주고, 해외에서 태국 소프트 파워의 영향권을 넓힙니다."
 SIA_mekong_soft_power: "메콩 소프트 파워"
 SIA_mekong_soft_power_desc: "방콕은 메콩강의 상류에 자리하고, 강은 라오스, 캄보디아, 미얀마로 이어집니다. 무역, 원조, 투자는 이웃 지역에 대한 조용한 주도권의 수단이 됩니다. 태국은 이제 자국만 지키는 데 그치지 않고 해외에서 자신의 우위를 밀어붙일 수 있습니다."
 SIA_regional_trade_network_tt: "체결한 무역 협정마다 이제 매월 국고 배당금을 지급하며 태국의 해외 영향력 범위를 넓힙니다. 둘 다 상한이 있습니다."
 SIA_trade_dividend_tt: "태국은 무역 협정망에서 나오는 월간 배당금을 챙깁니다."
 SIA_trade_diplomacy_network: "무역 외교"
 SIA_trade_diplomacy_network_tt: "해외 영향력 범위는 체결한 무역 협정 수에 따라 상한까지 늘어납니다."
 SIA_crisis_modifier: "1997년 위기의 유산"
 SIA_crisis_modifier_desc: "똠얌꿍 위기는 기적의 경제를 하룻밤 사이에 무너뜨렸습니다. 바트화는 끝없이 추락했고, 은행들은 부실 대출에 파묻혔으며, IMF가 문 앞에 섰습니다. 회복의 한 걸음마다 상처의 일부가 아물어 갑니다. 왕국은 과거에서 배우고 이전보다 더 탄탄하게 일어섭니다."
 SIA_economy_modifier: "태국 경제"
 SIA_economy_modifier_desc: "수출 기반과 동부경제회랑에서 국가 대표 기업과 디지털 전환에 이르기까지, 왕국의 경제 계획을 누적해 기록한 장부입니다. 모든 개혁과 호황이 이곳에 흔적을 남깁니다."
 SIA_military_modifier: "태국 왕립 군"
 SIA_military_modifier_desc: "왕국의 육해공 장병들의 상태로, 조달, 교리, 훈련, 그리고 그 뒤를 받치는 방위 산업을 포함합니다. 현대화 계획이 이곳에 쌓입니다."
 SIA_politics_modifier: "태국 정치 체제"
 SIA_politics_modifier_desc: "법원, 의회, 관료제, 그리고 왕국의 정치를 지탱하는 타협들 등 태국 통치의 제도적 뼈대입니다. 개혁도 반동도 이곳에 흔적을 남깁니다."
 SIA_armed_forces_state: "구세대"
 SIA_armed_forces_state_desc: "병사 몇백 명마다 장성 한 명이 있고, 실제 숫자는 의회에 숨겨집니다. 진급은 능력보다 먼저 연례 인사 명단, 사관학교 기수, 부대 파벌에 따라 이루어집니다. 장교단은 텔레비전 채널, 골프장, 토지, 그리고 병사들이 무급 노동으로 운영하는 복지 사업을 소유합니다. 이 모든 것의 비용은 전투 준비 태세와 훈련이 치르며, 인건비는 늘어만 갑니다."
 SIA_clean_the_banks: "은행을 정화하라"
 SIA_clean_the_banks_desc: "문을 닫은 금융회사 쉰여섯 곳은 금융부문구조조정청을 통해 정리되고, 태국자산관리공사가 부실 대출을 장부에서 덜어 갑니다. 대차대조표가 깨끗해진 은행은 다시 대출을 시작하고 건설용 크레인이 스카이라인에 돌아옵니다."
 SIA_dual_track_recovery: "내수를 다시 점화하라"
 SIA_dual_track_recovery_desc: "부채를 털어 내면 회복의 방향을 안으로 돌립니다. 저금리 신용, 농촌 지출 계획, 중소기업 지원은 가장 빨리 쓰는 사람들의 손에 돈을 쥐여 줍니다. 성장은 빠르게 돌아와 뜨겁게 달아오르지만, 청구서와 갚아야 할 인정도 그만큼 빨리 쌓입니다."
 SIA_sufficiency_path: "탄탄한 재건"
 SIA_sufficiency_path_desc: "속도보다 안정을 택합니다. 다각화된 농업, 절제된 차입, 자립적인 지역 경제가 다음 충격을 견딜 수 있는 더 조용한 기반을 다시 세웁니다. 호황은 결코 포효하지 않지만, 정화는 통치에까지 미칩니다."
 SIA_frontier_integration: "변경 통합"
 SIA_frontier_integration_desc: "전역은 승리로 끝났고 태국군이 샨 고원, 카렌 산악, 와 고지대를 장악했습니다. 땅을 얻는 일과 땅을 다스리는 일은 서로 다른 과업입니다. 수복한 변경에 행정 조직을 세우고, 첫 도로와 수비대를 놓고, 정복한 사람들을 시민으로 바꾸는 더딘 작업을 시작합니다. 수복지는 이제 안정화하고 개발할 수 있으며, 때가 되면 왕국의 완전한 영토로 선언할 수 있습니다."
 SIA_the_new_order: "남방의 신질서"
 SIA_the_new_order_desc: "영유권은 마닐라에서 말라카 해협에 이르기까지 선포되었고, 우리 군대가 진군한 곳에서는 옛 깃발이 내려졌습니다. 선포된 패권이 곧 유지되는 패권은 아닙니다. 점령한 지역이 단순히 점령에 그치지 않고 행정이 이루어지도록, 총독과 수비대, 재건 사무소로 이루어진 제국의 기구를 세웁니다. 수복지는 이제 안정화하고 개발할 수 있으며, 대태국에 영구히 편입할 수 있습니다."
 SIA_industrial_estates: "공업 단지"
 SIA_industrial_estates_desc: "아마타, 헤마랏, 로자나는 동부 해안 곳곳에 민간 공업 단지를 조성하고 일본과 서방의 공장을 직접 유치합니다. 태국은 수출 호황을 맞이하는 작업장이 되어, 찾아오는 모든 제조업체에 준비된 부지와 전력이 기다립니다."
 SIA_hard_disk_of_the_world: "세계의 하드 디스크"
 SIA_hard_disk_of_the_world_desc: "시게이트, 웨스턴 디지털, 그리고 델타와 하나 같은 현지 공급업체들이 태국을 세계 최대의 하드 디스크 조립국이자 전자 제품 수출 선두 주자로 만듭니다. 관광 엽서 뒤의 조용한 거인으로, 지구 드라이브의 4분의 1을 조용히 실어 보내고 있습니다."
 SIA_thai_union_seafood: "통조림의 왕"
 SIA_thai_union_seafood_desc: "타이 유니온은 치킨 오브 더 씨를 인수해 세계 최대의 참치 통조림 업체가 되었고, 사뭇사콘의 가공업체들은 태국 해역과 값싼 노동력을 세계적인 수산물 제국으로 바꿔 놓습니다. 냉동 새우와 생선 통조림이 전 세계 슈퍼마켓 선반으로 흘러가며, 사뭇사콘의 어항에는 그 새로운 중요성에 걸맞은 해군 기지가 들어섭니다."
 SIA_retail_kings: "유통의 왕"
 SIA_retail_kings_desc: "찌라티와트 일가의 센트럴 그룹, 빅 C, 대형 마트가 쇼핑몰과 현대적 유통을 중심으로 내수 경제를 다시 세웁니다. 센트럴월드가 2006년에 문을 열고, 성장하는 소비자 중산층이 수출에만 매달리지 않고 소비를 시작합니다."
 SIA_beverage_empire: "방콕의 양조업자"
 SIA_beverage_empire_desc: "창 맥주와 쌩솜을 만드는 차런 시리와타나바크디의 타이베브는 지역 음료 및 부동산 거물로 성장합니다. 불교계의 금주 시위로 방콕 증시 상장이 막히자 싱가포르에서 자본을 조달하고 수익금을 본국에 다시 쏟아붓습니다. 법인세 수입은 확실하지만 그것이 불러일으키는 절제 운동의 반발도 확실합니다."
 SIA_fta_decade: "FTA의 십 년"
 SIA_fta_decade_desc: "양자 무역 협정의 물결이 수출 기계를 지역과 연결합니다. 2005년 오스트레일리아 협정, 2007년 일본 동반자 협정, 농산물에 대한 중국과의 조기 수확이 모두 관세를 걷어 냅니다. 서로 다른 점이 많은 경쟁자들이 함께 서명한, 진정한 범정부 차원의 작업입니다."
 SIA_sugar_and_ethanol: "설탕 재벌"
 SIA_sugar_and_ethanol_desc: "미트 폰과 타이 룽 르앙 그룹은 사탕수수 지대를 아시아의 설탕 중심지로 키우고, 설탕과 카사바를 수출품과 가소홀 계획에 쓸 에탄올로 바꿉니다. 농업은 마침내 쌀 너머로 다각화되고, 바이오 연료는 국가 연료 공급에 곧바로 보태집니다."
 SIA_gems_and_gold: "보석과 황금"
 SIA_gems_and_gold_desc: "짠타부리의 세공사들과 방콕의 보석 거래는 태국을 유색 보석 세공과 보석 수출의 세계적 수도로 만듭니다. 독특하고 이윤이 높으며 규모가 작은 산업으로, 규모가 아닌 기술로 외화를 벌어들이며 보석 한 알이 나라를 떠날 때마다 수출 장부가 늘어납니다."
 SIA_map_ta_phut: "마프타풋"
 SIA_map_ta_phut_desc: "PTT와 SCG는 라용에 하류 석유화학 제국을 세우고, 마프타풋의 굴뚝은 동부 해안의 중공업 심장이 됩니다. 산업은 호황을 누리지만 공장 옆 지역 주민들은 오염된 공기와 물로 대가를 치르며, 단지를 지원하는 항구는 수요를 따라가기 위해 용량을 늘립니다."
 SIA_ignite_thailand: "점화하는 태국"
 SIA_ignite_thailand_desc: "정부는 20개년 국가 전략과 IGNITE 허브 비전을 채택하여 마침내 중진국 함정을 적으로 지목합니다. 태국은 정체될 만큼 부유해졌습니다. 임금은 값싼 공장 노동의 수준을 넘어섰지만 혁신의 최전선에는 닿지 못했고, 베트남이 빠르게 따라붙고 있습니다."
 SIA_digital_kingdom: "디지털 왕국"
 SIA_digital_kingdom_desc: "태국은 스스로를 아세안의 디지털 허브로 내세우고, 하이퍼스케일러들이 주목하기 시작합니다. 광케이블, 클라우드 정책, 젊은 온라인 인구가 이 나라를 지역 데이터 트래픽의 유력한 후보지로 만듭니다."
 SIA_data_center_hub: "클라우드 러시"
 SIA_data_center_hub_desc: "아마존, 구글, 마이크로소프트, 틱톡이 촌부리와 라용의 데이터 센터에 수십억 달러를 쏟아붓습니다. 서버는 이를 가동할 전력과 물보다 빠르게 도착하고, 전력망은 부하에 압박을 받기 시작합니다."
 SIA_virtual_banks: "프롬프트페이와 가상 은행"
 SIA_virtual_banks_desc: "프롬프트페이로 태국은 거의 현금 없는 사회가 되어, 9천만 건의 등록이 하루에 수천만 건의 이체를 처리합니다. 중앙은행은 디지털 전용 은행에 면허를 내주고, 한때 현금 속으로 사라지던 돈은 이제 세무 당국이 읽을 수 있는 흔적을 남깁니다."
 SIA_bcg_economy: "바이오-순환-녹색"
 SIA_bcg_economy_desc: "바이오-순환-녹색 모델은 태국의 생물 다양성과 농업 기반을 고부가가치 바이오 산업으로 바꿔 놓습니다. 바이오 연료, 바이오 화학 제품, 기능성 식품이 농촌을 가난하게 묶어 두었던 저마진 상품 작물을 대체하기 시작합니다."
 SIA_future_food: "세계의 주방 2.0"
 SIA_future_food_desc: "CP 푸즈와 식품 대기업들이 가치 사슬을 거슬러 올라 기능성 식품과 대체 단백질로 나아갑니다. 태국은 원료 열량을 파는 일을 멈추고 그 안에 담기는 과학을 팔기 시작합니다."
 SIA_durian_road: "두리안 로드"
 SIA_durian_road_desc: "중국으로 가는 두리안과 열대 과일 수출이 연 60억 달러를 넘어섭니다. 냉장 트럭이 수확물을 싣고 라오스를 거쳐 북쪽으로 달리는 동안, 베트남과 말레이시아는 광저우의 같은 진열대를 두고 다툽니다."
 SIA_capital_of_capital: "자본의 수도"
 SIA_capital_of_capital_desc: "태국 증권거래소는 깊이를 더하고, 와유팍 펀드는 성장하며, 걸프 같은 재벌들은 에너지에서 디지털과 금융으로 방향을 틉니다. 방콕은 자본이 스쳐 지나가는 곳이 아니라 지역 금융 중심지처럼 움직이기 시작합니다."
 SIA_make_thailand_investor: "자본 수출국"
 SIA_make_thailand_investor_desc: "태국은 외국 자금을 받는 나라에서 자국 자금을 해외로 내보내는 나라로 졸업합니다. 센트럴은 유럽에서 인수하고, CP는 전 세계에서 농장을 운영하며, 타이베브는 싱가포르 자체의 음료 대기업을 소유합니다. 수혜국이 투자국이 되었습니다."
 SIA_escape_the_trap: "고소득 왕국"
 SIA_escape_the_trap_desc: "국가 전략이 결실을 맺어 태국은 고소득 국가의 경계선을 넘습니다. 한 세대 동안 최전선 아래에 묶어 두었던 함정을 마침내 벗어났으며, 작업장은 스스로 부유한 왕국이 되었습니다."
 SIA_fta_decade_tt: "무역 외교망을 가동하고 10년간의 자유 무역 협정을 체결합니다."
 SIA_escape_trap_two_sectors_tt: "세 부문 최종 과제 중 두 가지가 필요합니다. 데이터 센터, 미래 식품, 또는 투자국이 해당합니다."
 SIA_data_center_grid_strain_tt: "하이퍼스케일러 구축으로 전력망에 부담이 가해집니다. 불이 꺼지지 않도록 전력 분야에 투자하십시오."
 SIA_sufficiency_and_the_crown: "충족과 왕실"
 SIA_sufficiency_and_the_crown_desc: "푸미폰 국왕의 충족 경제 철학은 똠얌꿍 위기의 잿더미에서 태어나 국가의 지도 원칙이 됩니다. 무모한 성장에 앞서 절제와 자기 면역력, 합리성을 앞세웁니다. 궁정과 기획부는 한목소리를 내며, 분수에 맞게 사는 마을은 다음 충격이 닥칠 때 국가에 요구하는 것이 적습니다."
 SIA_sufficiency_gov_gate_tt: "§Y[communist_state_L]§! 또는 §Y[socialism_L]§!이(가) 집권당이 아닙니다."
 SIA_new_theory_agriculture: "신이론"
 SIA_new_theory_agriculture_desc: "국왕의 신이론은 농민의 땅을 논, 과수원, 연못, 주거지로 나눕니다. 시장에 상품을 내다 팔기 전에 먼저 가족을 지속 가능하게 먹여 살리는 완결된 농지입니다. 이산의 쌀 지대는 이 모델을 지구마다 도입하여, 약간의 수출량을 내어주는 대신 흉년에도 굶지 않는 농민을 얻습니다."
 SIA_doi_tung_highlands: "도이퉁 모델"
 SIA_doi_tung_highlands_desc: "치앙라이 위쪽 산악 지대에서 왕모의 사업이 양귀비를 뽑아내고 그 자리에 커피, 마카다미아, 수공예품을 심습니다. 황금의 삼각지대의 옛 환금 작물은 마약 수사관 대신 방문객을 끌어들이는 고지대 경제에 자리를 내주며, 골짜기 하나씩 바뀌어 갑니다."
 SIA_chaipattana_water: "차이파타나 폭기기"
 SIA_chaipattana_water_desc: "국왕이 직접 특허를 낸 폭기기는 어느 마을 연못이든 감당할 수 있는 저렴한 물레바퀴로, 짜오프라야 유역을 따라 퍼져 조류와 오물로 막힌 물을 정화합니다. 왕실 봉사로서의 발명이며, 이산과 남부의 논은 그 덕에 물이 조금 더 잘 빠집니다."
 SIA_crown_property_portfolio: "왕실재산관리국"
 SIA_crown_property_portfolio_desc: "사이암 상업은행 빌딩 아래의 토지에서 사이암 시멘트 그룹의 주식에 이르는 관리국의 보유 자산은 왕실을 왕국 최대의 지주이자 주주 가운데 하나로 만듭니다. 재벌처럼 운영되고 재벌처럼 과세되지만, 자신이 보고해야 하는 부처의 절반보다 조용히 더 많은 수익을 올립니다."
 SIA_deepen_sufficiency: "자립 왕국"
 SIA_deepen_sufficiency_desc: "충족은 농촌의 안전망에 그치지 않고 전체 전략이 됩니다. 지역 공급망, 절제된 소비, 외국 자본에 대한 경계심이 교리로 굳어집니다. 자급자족은 충격 저항력을 안겨 주지만, 은행가와 재벌들은 성장 목표가 흔들리는 것을 보며 달가워하지 않습니다."
 SIA_pragmatic_balance: "중도의 길"
 SIA_pragmatic_balance_desc: "충족이 곧 고립을 뜻할 필요는 없습니다. 중소기업은 계속 대외 무역을 하고, 충족 원칙은 과도함만을 누그러뜨리는 후퇴가 아닌 절충적 종합입니다. 상한은 완전한 자립보다 낮지만, 그것이 필요해질 위험 또한 그만큼 낮습니다."
 SIA_resilient_kingdom: "회복력 있는 왕국"
 SIA_resilient_kingdom_desc: "왕실과 농촌, 궁정과 논이 하나의 회복력 모델로 엮입니다. 통화 위기든, 팬데믹이든, 공급 충격이든 다음 위기가 무엇을 가져오더라도, 분수에 맞게 사는 왕국이 위기가 지나간 뒤에도 여전히 서 있는 나라입니다."
 SIA_sufficiency_resilience: "충족 경제"
 SIA_sufficiency_resilience_desc: "왕실의 주도로 농촌 경제 전반에 뿌리내린 절제, 자기 면역력, 지역 회복력입니다."
 SIA_sufficiency_resilience_2: "심화된 충족 경제"
 SIA_sufficiency_resilience_2_desc: "자립이 안전망에서 교리로 굳어져, 추가 성장을 내주고 추가적인 충격 저항력을 얻습니다."
 SIA_resilient_kingdom_idea: "회복력 있는 왕국"
 SIA_resilient_kingdom_idea_desc: "왕실의 후원과 충족 경제학이 융합되어 다음 충격에 맞서는 지속적인 국가 완충재가 되었습니다."
 SIA_tourism_masterplan: "관광 종합 계획"
 SIA_tourism_masterplan_desc: "관광은 이미 경제를 떠받치고 있지만 즉흥에 의존해 돌아갑니다. 제대로 된 기반시설보다 리조트가 먼저 지어지고, 교육받은 인력보다 호텔이 앞서 들어섭니다. 국가 종합 계획은 지역별 목표를 정하고 부처들을 엮어, 접객업을 다른 산업 부문과 똑같은 산업으로 다룹니다."
 SIA_phuket_andaman: "안다만의 진주"
 SIA_phuket_andaman_desc: "푸껫은 이미 세계를 해변으로 끌어들이고 있으며, 새 공항 청사와 개선된 도로 덕에 섬은 훨씬 더 많은 사람을 받아들일 수 있습니다. 안다만은 나라의 외화 수입에서 점점 더 큰 몫을 짊어지도록 요구받고, 그만큼 많은 낯선 이들이 그들이 도착하는 해안선을 바꿔 놓습니다."
 SIA_pattaya_eastern_riviera: "동부 리비에라"
 SIA_pattaya_eastern_riviera_desc: "파타야의 호텔과 유흥가는 대부분 저임금의 비공식 노동으로 돌아갑니다. 동부 해안을 따라 사무직과 서비스 경제를 공식화하십시오. 장부에 오르는 노동자는 모두 복지 국가가 실제로 책임을 다하리라 기대하게 됩니다."
 SIA_chiang_mai_lanna: "북방의 장미"
 SIA_chiang_mai_lanna_desc: "사원, 산악 지대, 느린 삶의 속도가 이미 배낭여행객과 디지털 노마드를 북쪽으로 끌어당기고 있습니다. 치앙마이의 관광 기반시설을 확충하면 인파가 따라오지만, 방문객들이 보러 온 동네를 비싸게 만들어 몰아내는 임대료도 함께 따라옵니다."
 SIA_rebuild_the_andaman: "파도 이후"
 SIA_rebuild_the_andaman_desc: "박싱 데이 쓰나미는 안다만 해안을 휩쓸었고, 복구 과정에서 취해진 편법은 지금도 눈에 띕니다. 제대로 재원을 갖춘 재건은 긴급 대응이 해내지 못한 일을 마무리하고 재난에 대한 청구서를 영구히 닫습니다."
 SIA_medical_wellness_hub: "아시아의 메스"
 SIA_medical_wellness_hub_desc: "세계 수준의 민간 병원들은 이미 지역 곳곳에서 날아온 환자를 치료하고 있습니다. 웰니스와 수술 관광 무역을 더 확대하면 태국 병원은 훨씬 낮은 가격으로 싱가포르 최고 수준의 병원과 직접 경쟁하지만, 국내 환자는 돈을 내는 외국인 뒤에서 기다리게 됩니다."
 SIA_volume_tourism: "숫자 싸움"
 SIA_volume_tourism_desc: "더 많은 항공편, 더 싼 패키지, 더 많은 입국자. 단순한 방문객 수를 쫓으면 외화는 쌓이지만, 이 정도 교통량의 일부만을 위해 지어진 해변과 옛 도시는 그 무게에 휘어지며, 그곳에 사는 사람들은 재무제표보다 훨씬 먼저 압박을 느낍니다."
 SIA_high_value_tourism: "양보다 질"
 SIA_high_value_tourism_desc: "훨씬 더 많이 쓰는 소수의 방문객입니다. 패키지 관광객 대신 고급 리조트와 부티크 체험 시장을 유치하고, 입국자 수를 내주는 대신 제대로 세금을 내고 다음 불황에도 온전히 살아남는 관광 부문을 얻습니다."
 SIA_tourism_capital: "세계가 가장 사랑하는 여행지"
 SIA_tourism_capital_desc: "방콕의 길거리 음식에서 푸껫의 해변, 치앙마이의 사원에 이르기까지 태국은 관광 주도 발전의 표준 사례가 됩니다. 관광부는 홍보 캠페인에서 상설 산업 정책으로 한 단계 올라서며, 그에 걸맞은 결정을 내립니다."
 SIA_tourism_boom: "관광 호황"
 SIA_tourism_boom_desc: "입국자의 물결이 호텔과 공항을 가득 채우고 있습니다. 성수기가 지나면 이 급등은 가라앉습니다."
 SIA_host_major_international_event: "대형 국제 행사 유치"
 SIA_host_major_international_event_desc: "정상회담, 세계 박람회, 또는 주요 스포츠 선수권 대회를 유치하여 일주일 동안 지구상의 모든 텔레비전 화면에 태국을 띄웁니다. 비용은 현실이지만 공짜 광고 또한 현실입니다."
 SIA_new_resort_zone: "신규 리조트 구역 개방"
 SIA_new_resort_zone_desc: "해안선이나 농촌의 새 구역에 리조트 개발을 위한 지구 지정과 허가를 내주어, 이미 가득 찬 해안에서 넘치는 투자를 분산시킵니다."
 SIA_global_amazing_thailand_campaign: "글로벌 '어메이징 타일랜드' 캠페인"
 SIA_global_amazing_thailand_campaign_desc: "해외 광고, 여행 박람회 참가, 인생 최고의 시간을 보내는 것처럼 보이도록 돈을 받는 소셜 미디어 인플루언서와 함께, 관광청의 대표 슬로건을 새롭게 선보입니다."
 SIA_baht_and_bourse: "바트화와 증권시장"
 SIA_baht_and_bourse_desc: "방콕의 은행과 태국 증권거래소는 이전 시대의 상가 고리대금업자들을 훌쩍 넘어섰지만, 이곳의 자본 시장은 태국이 경쟁하는 이웃 나라들보다 여전히 얕고 비공식적으로 운영됩니다. 조율된 추진으로 누가 돈을 모으고 누가 빌려줄 수 있는지가 넓어지지만, 늘어나는 같은 자본의 풀이 규제 당국을 가장 빨리 요리하는 쪽에 넘어가는 대가를 치릅니다."
 SIA_tamc_workout: "자산관리공사"
 SIA_tamc_workout_desc: "태국자산관리공사는 1997년 폭락이 남긴 부실 대출을 삼키기 위해 2001년에 세워졌으며, 이십 년 동안 팔 수 있는 것은 천천히 팔고 팔 수 없는 것은 상각해 왔습니다. 기금의 장부를 영구히 닫으면 그 안에 아직 묶여 있는 자본이 풀려납니다. 장부에 남은 손실을 또 한 해 이월하는 대신 마침내 인정한다는 전제입니다."
 SIA_consumer_credit_boom: "서민을 위한 신용"
 SIA_consumer_credit_boom_desc: "신용카드, 개인 대출, 할부 계획이 방콕의 쇼핑몰에서 지방으로 퍼져, 평범한 가구가 내일의 월급을 담보로 오늘 소비할 수 있게 됩니다. 소비가 늘고 정부 수입이 뒤따르지만, 이만큼 새로운 소비자 신용을 얻은 인구는 상환 기한이 닥쳤을 때 국가가 받쳐 주기를 기대하는 법을 금세 배웁니다."
 SIA_responsible_lending: "거시건전성 규율"
 SIA_responsible_lending_desc: "태국 중앙은행은 주택담보 및 소비자 신용 시장 전반에서 담보인정비율 상한과 대출 기준을 강화하여, 빠른 팽창 대신 느리지만 튼튼한 팽창을 택합니다. 은행은 지급 능력을 유지하고 가계는 분수에 맞게 지내지만, 소비 호황에 불을 붙이는 손쉬운 소비자 신용은 흐를 기회를 얻지 못합니다."
 SIA_deepen_the_set: "거래소 심화"
 SIA_deepen_the_set_desc: "더 많은 기업이 태국 증권거래소에 상장하고, 외국 포트폴리오 운용사들이 태국 주식으로 새 통로를 열면서 시장은 더 깊어지고 유동성도 풍부해집니다. 더 크고 더 긴밀히 연결된 거래소는 상장 재벌의 감사받은 장부가 인쇄된 종이보다 가치가 없다고 드러나는 날 더 큰 충격을 의미하기도 합니다."
 SIA_vayupak_stabilization: "와유팍 펀드"
 SIA_vayupak_stabilization_desc: "국가가 후원하는 와유팍 펀드는 지수가 너무 멀리 너무 빨리 떨어질 때 매수에 나설 태세를 갖추고 있어, 다음 공황 때 개인 투자자에게 바닥을 마련해 줍니다. 국고의 돈으로 주가를 떠받치는 것은 그 뒤의 경제를 성장시키는 것과 같지 않으며, 펀드가 개입하는 비용은 다른 모든 것과 같은 예산에서 나옵니다."
 SIA_bank_consolidation: "크룽시 문제"
 SIA_bank_consolidation_desc: "일본의 MUFG는 아유타야 은행의 지배 지분을 보유하고 있으며, 이는 태국 은행권이 소수의 대형, 흔히 외국 자본에 닻을 내린 생존자들을 중심으로 통합되고 있음을 보여 주는 여러 징후 중 하나입니다. 더 큰 재무제표는 더 큰 충격을 흡수하지만, 한때 중소 차주를 상대하던 중소 대출 기관은 남의 지점망 속으로 계속 사라집니다."
 SIA_financial_center: "선진 금융 중심지"
 SIA_financial_center_desc: "방콕은 단순히 싱가포르와 홍콩에 자금을 대는 시장이 아니라 그들과 겨루는 독자적인 지역 금융 허브로 자리매김합니다. 깊은 자본 시장, 안정된 거래소, 통합된 은행 부문이 하나로 모여 태국만이 아니라 지역 전체를 위해 위험을 평가하고 자본을 조달할 수 있는 중심지를 이룹니다."
 SIA_financial_center_idea: "선진 금융 중심지"
 SIA_financial_center_idea_desc: "깊은 자본 시장, 안정된 거래소, 통합된 은행 부문이 태국에 자국뿐 아니라 지역 전체를 위해 위험을 평가하고 자본을 조달하는 금융 중심지를 안겨 줍니다."
 SIA_the_ground_beneath: "발밑의 땅"
 SIA_the_ground_beneath_desc: "국가 지질 조사는 북동부의 칼리 광상에서 태국만의 가스 매장 분지에 이르기까지, 왕국의 땅과 대륙붕 아래에 실제로 무엇이 있는지 목록으로 만들기 시작합니다. 그곳에 무엇이 있는지 아는 것은 쉬운 부분입니다. 얼마나 세게 끌어올릴지, 그리고 끌어올리다 잘못되면 누가 비용을 치를지는 그다음 문제입니다."
 SIA_extractive_drive: "파라, 베이비, 파라"
 SIA_extractive_drive_desc: "허가는 빠르게 나오고, 자원 부문은 최소한의 지연으로 최대한의 물량을 생산하라는 지시를 받습니다. 수출 수입은 오르고 화석 연료 로비는 요구한 것을 전부 얻지만, 광산과 유정마다 직전의 것보다 더 많은 일손이 필요해지고, 굴착지와 가장 가까이에 땅과 물이 있는 농민들이 가장 먼저 이를 알아챕니다."
 SIA_stewarded_extraction: "국가를 위한 채굴"
 SIA_stewarded_extraction_desc: "채굴은 시장이 아닌 국가의 조건에 따라 진행됩니다. 허가는 더디게, 환경 심사는 실질적으로, 허가 구역당 면적은 더 작게 합니다. 땅은 더 자유로운 손길 아래에서보다 적게 내어 주지만, 채굴장과 유정 옆에 사는 농민과 지주는 부수적 피해로 취급되지 않습니다."
 SIA_udon_potash: "이산의 칼리"
 SIA_udon_potash_desc: "세계 최대 규모에 속하면서도 대부분 손대지 않았던 이산의 광대한 칼리 광상이 마침내 생산에 들어갑니다. 새 갱도와 가공 시설은 국내 비료 산업을 약속하지만, 채굴 허가 경계는 소농과 쌀 협동조합이 여러 세대 동안 경작해 온 땅을 곧장 가로지릅니다."
 SIA_chatree_gold_tin: "금, 주석, 석고"
 SIA_chatree_gold_tin_desc: "차트리 광산 단지와 인근 광산들이 중부 평야에서 금, 주석, 석고를 캐내며, 방콕이 이미 유명한 보석 무역과 나란히 화려하진 않아도 실질적인 광업 부문을 이룹니다. 광미 저장지 하류의 마을들은 지하수에 무엇이 스며드는지 면밀히, 그리고 점점 더 목소리를 높여 지켜봅니다."
 SIA_gulf_gas_oca: "중첩 영유권 구역"
 SIA_gulf_gas_oca_desc: "태국과 캄보디아는 소유권을 해결하는 대신 수십 년 동안 가스가 풍부한 만 일대를 개발하지 않은 채 내버려 두었습니다. 중첩 영유권 구역에서 일방적으로 밀어붙인다면 가스 1입방미터가 해안에 닿기 훨씬 전부터 자본 집약적인 개척지 시추가 필요하며, 이 모든 것에 동의하지 않은 이웃 나라가 존재합니다."
 SIA_resource_sovereignty: "자원 주권"
 SIA_resource_sovereignty_desc: "칼리, 비철금속, 가스가 한데 모여, 그 분기에 누가 사든 그에게 응답하는 대신 방콕에 응답하는 자원 부문을 이룹니다. 한때 낱낱이 팔려 나가던 채굴권의 이야기는, 자국 땅에서 나오는 것에 대해 더는 허락을 구할 필요가 없는 왕국의 이야기가 됩니다."
 SIA_resource_sovereignty_2of3_tt: "세 가지 자원 사업 중 최소 2개를 완료했습니다"
 SIA_the_digital_consumer: "디지털 소비자"
 SIA_the_digital_consumer_desc: "태국인들은 창구에 줄을 서는 대신 온라인으로 은행 업무를 보고 쇼핑하고 예약하는 일이 점점 늘고 있습니다. 푸껫의 작은 사무실에서 출발한 여행 예약 플랫폼 아고다는 토종 디지털 사업이 누구와도 겨룰 수 있음을 보여 줍니다. 이 변화 아래에 기반, 신뢰, 세원을 구축하는 것이 이제 국가 사업입니다."
 SIA_promptpay_rails: "프롬프트페이"
 SIA_promptpay_rails_desc: "프롬프트페이는 은행 지점이나 송금 수수료 없이 전화번호와 주민등록번호 사이에서 돈을 몇 초 만에 옮기게 해 줍니다. 그 많은 거래를 공식화하면 현금 경제의 일부가 양지로 끌려 나오며, 한때 그 불투명함으로 이익을 보던 중개인들은 곧바로 알아챕니다."
 SIA_super_app_economy: "슈퍼 앱"
 SIA_super_app_economy_desc: "그랩, 라인맨, 경쟁사들은 차량 호출, 음식 배달, 택배 업무를 모든 태국인이 이미 열어 놓은 단 하나의 앱으로 합칩니다. 효율성 이득은 현실이지만, 앱을 돌아가게 하는 운전자와 배달원에게는 계약도, 복지도, 협상 테이블의 자리도 없다는 점 또한 현실입니다."
 SIA_ecommerce_marketplaces: "중소기업 입점"
 SIA_ecommerce_marketplaces_desc: "라자다와 쇼피는 소규모 제조업자와 시장 노점 상인에게 자기 지방을 훨씬 넘어서고 때로는 태국 국경 너머의 고객에게 닿는 점포를 마련해 줍니다. 이에 맞춰 창고와 배송 차량을 건설해야 하며, 이를 먼저 짓는 일은 마켓플레이스가 안겨 주기로 한 이득을 갉아먹습니다."
 SIA_national_digital_champions: "두 그룹, 하나의 시장"
 SIA_national_digital_champions_desc: "열린 경쟁에서 심판을 보는 대신 국가는 소수의 국가 플랫폼을 밀어주고 시장을 통합하도록 놔둡니다. 집중된 디지털 부문은 과세하기 효율적이고 규제하기 쉽지만, 실질적인 경쟁자가 남지 않은 시장은 가격을 정직하게 유지할 이유가 거의 없습니다."
 SIA_open_digital_market: "복점 해체"
 SIA_open_digital_market_desc: "반독점 규정과 개방형 데이터 이동성 요건은 가장 큰 두 앱이 시장을 나눠 먹게 두는 대신 소규모 플랫폼이 경쟁할 수 있도록 유지시킵니다. 소비자는 진정한 경쟁의 혜택을 누리지만, 국가 대표 기업이 안겨 주었을 깔끔한 세수를 대가로 치릅니다."
 SIA_the_outward_turn: "외향적 전환"
 SIA_the_outward_turn_desc: "수십 년 동안 태국 자본은 한 방향으로만, 외국인이 쓰도록 지어진 공장과 호텔로 흘렀습니다. 이제 다른 세대의 재벌들은 자신만의 성장을 위해 해외로 눈을 돌려, 한때 태국의 고객이었을 뿐 표적이 아니었던 지역에서 지분을 사고 공장을 짓습니다."
 SIA_leveraged_expansion: "세계를 사라"
 SIA_leveraged_expansion_desc: "탄탄한 재무제표를 담보로 돈을 빌려 해외 쇼핑에 속도를 냅니다. 부채로 자금을 조달한 인수는 포트폴리오를 빠르게 키우지만, 외상으로 사들인 모든 자산은 그만큼 빠르게 물에 잠길 수도 있는 자산입니다."
 SIA_organic_expansion: "가진 것을 키우라"
 SIA_organic_expansion_desc: "사들이려고 빌리는 대신, 태국 재벌이 이미 지배하는 것을 확장합니다. 자체 수익으로 더 많은 지점, 더 많은 생산 능력, 더 많은 시장을 일굽니다. 더디고 거래 전문지의 1면을 장식하는 일은 없지만, 이렇게 얻은 것은 서둘러 팔아야 할 필요가 없습니다."
 SIA_cp_into_china: "증서 0001호"
 SIA_cp_into_china_desc: "1990년 짜런 뽁파은 재개장한 상하이 증권거래소의 지분을 사들인 최초의 외국인 투자자가 되었고, 증서 번호는 0001이었습니다. 30년이 지난 지금 CP의 중국 사업은 핑안 보험에서 전국에 걸친 사료 공장까지 이어지며, CP가 한때 본국에서 키웠던 것의 일부를 속 빈 강정으로 만들면서도 결코 수익을 멈추지 않은 도박입니다."
 SIA_thaibev_conquers_asean: "맥주 남작의 제국"
 SIA_thaibev_conquers_asean_desc: "타이베브의 베트남 음료 법인은 2017년에 약 50억 달러로 사이공 맥주를 인수하고, 이어서 프레이저 앤 니브의 싱가포르 음료 및 부동산 제국을 같은 우리에 편입합니다. 이제 단일 태국 재벌이 나머지 지역이 마시는 것의 상당한 몫을 소유합니다."
 SIA_scg_long_son: "롱선의 부상"
 SIA_scg_long_son_desc: "베트남 롱선 반도에 있는 사이암 시멘트 그룹의 석유화학 단지는 태국 공장들이 늘 수입해야 했던 플라스틱 원료를 나프타에서 분해해 냅니다. 해외에 지어진 생산 능력은 콘크리트가 마침내 굳으면 더 저렴하고 안정적인 공급망이 되어 돌아옵니다."
 SIA_central_minor_abroad: "해외의 쇼핑몰과 객실"
 SIA_central_minor_abroad_desc: "센트럴 그룹은 오스트리아 시그나 그룹을 통해 셀프리지스, 카데베, 일룸의 지분을 인수하고, 마이너 인터내셔널의 호텔 브랜드는 방콕에서 몰디브와 리스본까지 퍼져 나갑니다. 태국의 소매업과 접객업 자금이 이제 자국 쇼핑객들이 한 번도 발을 들인 적 없는 매장과 호텔 로비를 소유합니다."
 SIA_ptt_banpu_resources: "세계를 시추하다"
 SIA_ptt_banpu_resources_desc: "PTTEP의 상류 유전은 오만에서 모잠비크, 말레이시아와 공유하는 해역까지 뻗어 있고, 반푸의 석탄 채굴권은 오스트레일리아와 인도네시아를 가로지릅니다. 태국은 국내에 없는 자원을 확보하지만, 국내 광산이 탔을 것과 똑같은 상품 사이클에 묶입니다."
 SIA_outbound_statecraft: "국정 운영으로서의 투자"
 SIA_outbound_statecraft_desc: "거래들은 개별적인 도박이기를 멈추고 하나의 국가적 태세가 되어, 태국 자본이 이윤의 수단인 만큼이나 외교 정책의 도구로 쓰입니다. 전담 부서가 이제 인수 파이프라인을 관리하며, 아세안 절반의 이사회는 부분적으로 방콕에 응답합니다."
 SIA_outbound_statecraft_3of5_tt: "다섯 가지 해외 확장 거래 중 최소 3개를 완료했습니다"
 SIA_thai_multinationals: "태국 다국적 기업"
 SIA_thai_multinationals_desc: "태국 기업들은 국내 시장을 벗어나 한때 자신들이 섬기기만 했던 다국적 기업처럼 행동하기 시작합니다. 해외로의 영향력은 현실이지만, 해외로 보낸 모든 바트와 임원의 근무 시간은 국내에서 짓는 데 쓰이지 않은 시간과 돈입니다."
 SIA_overseas_deal_boom: "해외 거래 호황"
 SIA_overseas_deal_boom_desc: "또 한 건의 인수가 마무리되었고, 태국 국경 너머에서 나온 이익이 이를 성사시킨 파이프라인으로 흘러 들어오고 있습니다."
 SIA_overseas_acquisitions_category: "해외 인수"
 SIA_overseas_acquisitions_category_desc: "태국 재벌들은 계속 해외 쇼핑에 나섭니다. 다음 표적을 물색하거나, 거래를 성사시키거나, 국고가 허락한다면 전체 포트폴리오를 들고 세계 순회 설명회에 나섭니다."
 SIA_scout_overseas_targets: "해외 표적 물색"
 SIA_scout_overseas_targets_desc: "누군가 서명하기 전에 다음 인수 대상의 현장을 둘러보도록 거래 팀을 파견합니다. 태국 자본이 다음에 어디에 내려앉아야 할지에 대한 간단하고 짧은 점검입니다."
 SIA_close_the_deal: "거래 성사"
 SIA_close_the_deal_desc: "다음 지분, 자회사 또는 상시 채굴권 서류에 서명합니다. 국고에서 나가는 돈은 현실인 반면, 그 값을 할지는 아직 입증되지 않은 자산입니다."
 SIA_global_ma_roadshow: "글로벌 M&A 로드쇼"
 SIA_global_ma_roadshow_desc: "재벌의 딜메이커들을 싱가포르, 홍콩, 런던 순회에 보내 은행가와 인수 대상 이사회 모두에게 태국 자본을 홍보합니다. 홍보 효과만으로도 다음 거래 라운드의 분위기가 달아오릅니다."
 thailand.1.t: "2001년 총선"
 thailand.1.d: "2001년 1월 6일, 태국인들은 국민 헌법 아래 처음 치러지는 총선에서 투표합니다. 세 세력이 표를 다툽니다. 마을 기금, 부채 상환 유예, 보편적 의료를 내건 타이락타이의 공약은 농촌을 열광시켰습니다. 궁정 인맥과 군 기지 내 동맹 세력은 통치하는 자들을 견제 아래 두는 쪽을 선호합니다. 현직 민주당은 꾸준하고 화려하지 않은 손길을 약속합니다. 우리가 어디에 힘을 싣느냐가 나라의 선택을 좌우할 것입니다."
 thailand.1.a: "타이락타이와 농촌의 압승을 지지한다."
 thailand.1.b: "궁정 인맥과 장성들을 결집시킨다."
 thailand.1.c: "민주당의 집권을 지원한다."
 thailand.2.t: "CEO들의 정부"
 thailand.2.d: "새 정부는 태국을 성공한 기업처럼 운영하겠다고 약속하며 출범합니다. 기업인들이 내각을 채우고, 각 부처는 성과 목표를 받으며, 정책은 관료제가 일찍이 본 적 없는 속도로 움직입니다."
 thailand.2.a: "태국은 사업을 위해 열려 있다."
 thailand.3.t: "마약과의 전쟁"
 thailand.3.d: "2003년 2월 정부는 메스암페타민 거래를 근절하기 위한 3개월간의 캠페인을 선언했습니다. 지방 블랙리스트가 작성되고 할당량이 정해졌습니다. 캠페인이 끝날 무렵 인권 단체들은 2,800건의 살해를 기록했으며, 상당수는 제대로 조사되지 않았습니다. 이 캠페인은 언론에서 인기가 있지만 해외에서는 비난받고 있습니다."
 thailand.3.a: "거침없이 캠페인을 밀어붙인다."
 thailand.3.b: "조용히 마무리한다."
 thailand.4.t: "9월 쿠데타"
 thailand.4.d: "2006년 9월 19일, 총리는 국제연합 총회 참석차 뉴욕에 있습니다. 그사이 전차가 방콕을 활보하고 헌법이 폐지되며, 민주 개혁 위원회는 평화적으로 정부 권력을 장악했다고 발표합니다. 군중은 병사들에게 꽃을 가져다주고, 농촌의 다수는 침묵 속에서 지켜봅니다."
 thailand.4.a: "군이 책임을 지게 한다."
 thailand.4.b: "민간 명의의 허수아비 정부를 세운다."
 thailand.5.t: "사법적 해산"
 thailand.5.d: "헌법재판소는 최대 야당에 대한 선거 부정 사건을 심리합니다. 해산이 이루어지면 지도부 이사진은 5년간 정치 활동이 금지되어, 병사 한 명 병영을 떠나지 않고도 운동의 머리를 잘라 내게 됩니다."
 thailand.5.a: "정당을 해산한다."
 thailand.5.b: "위협을 계속 드리워 둔다."
 thailand.6.t: "NCPO의 권력 장악"
 thailand.6.d: "2014년 5월 22일, 수개월간의 시위와 이틀간의 계엄령 선포 끝에 육군 참모총장은 대립하는 세력들을 육군 클럽으로 소집하고 회의실에서 체포합니다. 육군 참모총장은 국가평화질서위원회가 정부 권력을 장악한다고 발표합니다. 민주 제도가 안정될 때까지 선거 일정은 정해지지 않을 것입니다."
 thailand.6.a: "질서가 회복되었다."
 thailand.7.t: "광장을 점령한 레드셔츠"
 thailand.7.d: "반독재민주주의연합전선이 방콕의 상업 중심지를 가득 메우고 정부의 사퇴와 새 선거를 요구합니다. 라차쁘라송에는 바리케이드가 올라가고 도시 곳곳에서 타이어와 건물이 불탑니다. 세계의 카메라는 군이 다음에 무엇을 하는지 지켜보고 있습니다."
 thailand.7.a: "광장을 정리한다."
 thailand.7.b: "협상하며 기다린다."
 thailand.8.t: "공항 점거"
 thailand.8.d: "2008년 11월 노란 셔츠를 입은 시위대가 수완나품 공항과 돈므앙 공항을 점거하여 30만 명의 여행객의 발이 묶이고 나라의 항공 상업이 마비됩니다. 포위는 그들이 반대하는 정부를 무너뜨리는 법원 판결이 나온 뒤에야 끝납니다."
 thailand.8.a: "대가를 가늠한다."
 thailand.9.t: "세 가지 요구"
 thailand.9.d: "1992년 이후 가장 큰 규모의 학생 주도 군중이 세 가지 요구를 내세웁니다. 의회 해산, 비판자 위협 중단, 새 헌법 제정입니다. 방콕의 무대 위에서, 여러 세대 동안 태국의 공적 발언을 지배해 온 금기가 단 하루 저녁에 깨집니다."
 thailand.9.a: "세 가지 요구를 모두 지지한다."
 thailand.9.b: "의회가 통과시킬 것만 밀어붙인다."
 thailand.10.t: "본회의에 오른 112조"
 thailand.10.d: "불경죄법을 개정하는 법안이 의회에 상정됩니다. 고발할 수 있는 자를 제한하고, 처벌을 상한으로 묶으며, 정치적 발언에 대한 적용을 끝내는 내용입니다. 어떤 태국 입법부도 이 문제에 대해 기록 표결을 감행한 적이 없습니다. 이제 낡은 질서의 모든 기관이 움직이고 있습니다."
 thailand.10.a: "표결을 요청한다."
 thailand.11.t: "해산 위기"
 thailand.11.d: "헌법재판소는 개정 운동이 국왕을 국가 원수로 하는 민주 체제를 전복하려는 시도라고 판결합니다. 정당은 해산되고 지도부는 활동이 금지됩니다. 운동은 늘 그래왔듯 같은 사람들과 함께 새 이름으로 다시 시작해야 합니다."
 thailand.11.a: "금요일까지 새 정당을 등록하겠다."
 thailand.12.t: "기득권의 역습"
 thailand.12.d: "군 부대들이 정부의 명령 없이 수도에서 움직이고 있습니다. 낡은 질서는 실험이 충분히 멀리 갔다고 판단했습니다. 앞으로 6시간 동안 일어나는 일이 개혁의 시대가 이어질지, 아니면 중단된 태국 민주주의의 긴 목록에 이름을 올릴지를 결정합니다."
 thailand.12.a: "국민을 거리로 불러낸다."
 thailand.12.b: "운동을 지키기 위해 물러선다."
 thailand.13.t: "공화정 문제"
 thailand.13.d: "정부는 국가 자체의 헌법적 형태에 관한 국민투표를 예정합니다. 어떤 태국 정부도 국민에게 물은 적 없는 질문입니다. 결과가 어떠하든 왕국의 모든 것이 이전과 같지 않게 될 것입니다."
 thailand.13.a: "국민에게 묻는다."
 thailand.13.b: "국민투표를 철회한다."
 thailand.14.t: "새로운 치세"
 thailand.14.d: "2016년 10월 13일, 왕실청은 라마 9세 푸미폰 아둔야뎃 국왕 폐하가 70년간의 재위, 태국 역사상 가장 긴 치세 끝에 승하하셨음을 발표합니다. 왕세자가 라마 10세 마하 와찌랄롱꼰 국왕으로 즉위합니다. 정부가 이 전환을 어떻게 기리고 얼마나 빨리 넘어갈 것인지는 이제 방콕의 결정에 달려 있습니다."
 thailand.14.a: "새 치세를 공개적으로 천명한다."
 thailand.14.b: "의례가 순리대로 진행되게 한다."
 thailand.14.c: "의식과 연속성의 균형을 맞춘다."
 thailand.15.t: "이어지는 왕조"
 thailand.15.d: "운동의 창시자는 더 이상 직접 이끌 수 없지만, 그 이름은 여전히 유권자를 사로잡고 있습니다. 당 앞에 놓인 문제는 누가 그것을 다음 선거로 이끌고 가느냐입니다."
 thailand.15.a: "잉락 친나왓이 후보진을 이끈다."
 thailand.15.b: "재계 계파를 위해 부동산 재벌 쎄타 타위신이 후보진을 이끈다."
 thailand.15.c: "패통탄 친나왓이 후보진을 이끌고, 그 이름은 새 세대로 이어진다."
 thailand.15.e: "이름보다 조직을 앞세운다."
 thailand.16.t: "영원한 탁신"
 thailand.16.d: "연례 당 대회는 내부 임기 제한을 폐지하고 지도부에 후보 선정, 비례 명부, 연립 정책에 대한 비상 권한을 부여하기로 표결합니다. 야당 의석에는 중요한 인물이 아무도 없습니다. 선거는 계속 치러질 것이고, 계속 승리할 것입니다."
 thailand.16.a: "한 명의 지도자, 하나의 정당, 하나의 태국."
 thailand.17.t: "왕권 복원"
 thailand.17.d: "의회, 추밀원, 군이 공동으로 궁정에 국가 제도의 직접 관할을 맡아 달라고 청원합니다. 지난 세기의 입헌 허구는 폐기됩니다. 짜끄리 왕조는 1932년 이전에 지녔던 역할을 되찾습니다."
 thailand.17.a: "국왕 폐하 만세."
 thailand.18.t: "2017년 체제"
 thailand.18.d: "새 헌법은 반대를 형사 범죄로 만든 선거 운동 제한 아래 치러진 국민투표를 통과합니다. 전원 임명제 상원이 앞으로 총리 선출에 관여하고, 20개년 국가 전략이 모든 미래 정부를 구속합니다. 선거는 재개되지만 울타리 안에서만 치러집니다."
 thailand.18.a: "그렇다면 교도 민주주의다."
 thailand.19.t: "투표소로 향하는 왕국"
 thailand.19.d: "2001년 1월 6일 76개 전 도에서 투표소가 문을 엽니다. 국민 헌법 아래 치러지는 첫 투표이며, 내무부가 아닌 독립 위원회가 개표하고, 단독 과반을 확보한 정당이 수개월의 연립 흥정 없이 통치할 수 있게 된 첫 선거입니다."
 thailand.19.a: "개표를 시작하라."
 thailand.20.t: "재판소의 정당 해산"
 thailand.20.d: "헌법재판소는 집권당이 무효가 된 선거에서 소수 정당들에 돈을 주고 후보를 내세우게 했다고 판결하고 해산을 명령합니다. 지도부 111명은 5년간 정치 활동이 금지됩니다. 판결은 당의 이름과 등록, 지도부를 없애지만 유권자는 한 명도 건드리지 못합니다. 몇 주 안에 같은 의원들이 새 깃발 아래 새 등록 서류를 제출하고 있으며, 북동부의 조직은 단 하나의 선거구도 잃지 않았습니다."
 thailand.20.a: "새 경영진 아래 깨끗하게 재등록한다."
 thailand.20.b: "활동 금지된 지도부가 밖에서 계속 운영한다."
 thailand.21.t: "법원의 의사당 비우기"
 thailand.21.d: "두 번째 해산이며, 이번에는 집권당도 함께 휩쓸립니다. 판결은 옛 국가 보수 블록도 무너뜨리는데, 이 블록의 지방 파벌 보스들이 이제 의사당의 의석 계산을 손에 쥐고 양측의 구애를 받고 있습니다. 그들의 지도자는 활동이 금지되었지만 입을 닫지는 않았으며, 부리람의 한 저택에서 협상하고 있습니다. 그의 의원들이 떠나면 야당은 선거 없이 정부를 구성합니다. 붙잡을 수 있다면 연립은 살아남겠지만, 그 대가가 무엇이었는지 모두가 정확히 알게 될 것입니다."
 thailand.21.a: "떠나게 두고 민주당이 통치해 보도록 한다."
 thailand.21.b: "그들이 제안받은 것에 맞춰 준다."
 SIA_bench_hands_power_to_democrats_tt: "의사당이 §Y민주당§!의 집권 아래 다시 소집됩니다."
 thailand.50.t: "똠얌꿍 위기 탈출"
 thailand.50.d: "바트화가 무너진 지 3년이 지나 경제가 다시 성장하고 있습니다. 동부 해안의 공장들은 다시 사람을 뽑고 있으며, 굴욕 속에서 시작된 IMF 프로그램은 예정보다 앞서 가고 있습니다."
 thailand.50.a: "최악은 지나갔다."
 thailand.51.t: "IMF의 퇴장"
 thailand.51.d: "2003년 7월 태국은 IMF에 대한 마지막 상환금을 예정보다 2년 앞당겨 갚습니다. 총리는 이를 기념하여 경제적 독립을 회복했다고 선언하는 대국민 담화를 텔레비전으로 방송합니다."
 thailand.51.a: "다시는 없다."
 thailand.52.t: "박싱 데이 쓰나미"
 thailand.52.d: "2004년 12월 26일 수마트라 앞바다의 해저 지진이 태국의 안다만 해안으로 쓰나미를 보냅니다. 카오락과 푸껫은 황폐화되고 태국에서 5,000명이 넘게 사망했으며, 그중 다수는 외국인 관광객입니다. 세계가 우리의 대응을 지켜보고 있습니다."
 thailand.52.a: "구호 활동에 아낌없이 지원한다."
 thailand.52.b: "최소한의 대응."
 thailand.53.t: "대홍수"
 thailand.53.d: "짜오프라야 유역을 따라 내려오는 몬순 물결이 나라 전체 도의 3분의 2를 침수시키고 방콕 북쪽의 공업 단지를 위협합니다. 침수된 태국 공장에서 전 세계 하드 디스크 생산이 중단됩니다. 수도는 모래주머니 방벽을 쌓고 기다립니다."
 thailand.53.a: "모든 것을 동원한다."
 thailand.53.b: "방콕을 지키고 지방은 물이 빠지게 둔다."
 thailand.54.t: "쌀 담보 대출 제도"
 thailand.54.d: "정부는 시장 가격의 1.5배로 쌀 수확물 전체를 사들여 수십억을 농가에 이전하고, 세계 가격이 따라오리라는 데 도박을 걸겠다고 제안합니다. 경제학자들은 창고가 가득 차고 손실이 역사적일 것이라고 경고합니다. 우리를 뽑아 준 농민들이 기다리고 있습니다."
 thailand.54.a: "낟알 하나까지 담보로 사들인다."
 thailand.54.b: "조용히 제도를 보류한다."
 thailand.55.t: "아시아의 디트로이트"
 thailand.55.d: "차량 생산이 100만 대를 돌파했습니다. 태국은 이제 동남아시아 최대의 자동차 제조국이자 1톤 픽업트럭의 세계 최대 생산국입니다."
 thailand.55.a: "도요타와 혼다를 유치하고 문을 활짝 연다."
 thailand.56.t: "태국 방문의 해"
 thailand.56.d: "방콕은 세계에서 가장 많은 사람이 찾는 도시 중 하나입니다. 카오산 로드에서 카론 해변에 이르기까지 왕국은 세계를 맞이하며, 관광객의 소비는 수백만 태국인의 주머니를 지탱합니다."
 thailand.56.a: "사와디."
 thailand.56.b: "산업 자체에 투자한다."
 thailand.57.t: "잠수함 문제"
 thailand.57.d: "중국제 S26T 잠수함에 대한 해군의 계약은 국민적 논쟁이 되었습니다. 이것은 두 대양 함대의 첫 잠수함일까요, 아니면 공급업체가 인도하지 못하는 엔진에 쏟아붓는 수십억일까요? 조달 결정이 정부의 책상 위에 떨어집니다."
 thailand.57.a: "잠수함을 구매한다."
 thailand.57.b: "계획을 취소한다."
 thailand.100.t: "잃어버린 영토"
 thailand.100.d: "국영 언론은 옛 지도를 되살립니다. 1893년, 1904년, 1907년 프랑스에 넘겨준 지방들, 1909년 영국에 할양한 술탄국들입니다. 피분 시대의 국가적 굴욕 서사가 교과서에 되돌아오고, 1945년 이후 어느 정부도 입에 올리지 않았던 운동이 다시 꿈틀거립니다."
 thailand.100.a: "빼앗긴 것은 돌려받을 수 있다."
 thailand.101.t: "살윈강 너머의 형제들"
 thailand.101.d: "방콕은 언어와 혈통에서 태국인과 같은 겨레이며 여러 세대 동안 미얀마 군부와 전쟁을 벌여 온 샨주 타이 야이의 운명에 대한 관심을 공식적으로 선언합니다. 이 선언은 영토 요구 직전에서 멈춥니다. 그러나 지역의 누구도 그 의미를 오해하지 않습니다."
 thailand.101.a: "타이족은 하나의 민족이다."
 thailand.102.t: "태국의 강, 메콩"
 thailand.102.d: "정부는 1893년과 1904년의 프랑스-시암 조약을 강압 아래 서명된 문서로서 공식 부인합니다. 당장의 영유권 주장은 참빠삭을 포함하지만, 집권당 내 일부 목소리는 영유권 주장이 프랑스가 우연히 지도에 그린 지방에서 왜 멈춰야 하느냐고 묻습니다."
 thailand.102.a: "1904년의 영토에 영유권을 주장한다."
 thailand.102.b: "라오스 전역을 타이족의 땅으로 주장한다."
 thailand.103.t: "쁘라삭 쁘레아 위히아 대치"
 thailand.103.d: "2011년 이후 최악인 절벽 위 사원 일대의 포격전은 방콕에 구실을 줍니다. 정부는 1962년 국제사법재판소 판결을 더 이상 인정하지 않는다고 발표하고, 생존자들이 기억하는 시암의 지방인 밧탐방과 시엠레아프에 대한 영유권을 주장합니다."
 thailand.103.a: "영유권을 주장한다."
 thailand.103.b: "영유권과 최후통첩."
 thailand.104.t: "1909년 조약 폐기"
 thailand.104.d: "외무부는 방콕의 말레이 속국들을 영국 제국에 이양한 1909년 영국-시암 조약을 공식 폐기한다고 선언합니다. 클란탄과 트렝가누가 직접 거론됩니다. 쿠알라룸푸르는 한 시간 안에 대사를 소환합니다."
 thailand.104.a: "클란탄과 트렝가누에 영유권을 주장한다."
 thailand.104.b: "할양된 모든 술탄국을 요구한다."
 thailand.105.t: "수완나품"
 thailand.105.d: "연대기에 나오는 황금의 땅이자, 하나의 깃발 아래 모인 타이족의 세계입니다. 정부는 통일 계획이 원칙적으로 완료되었다고 선포합니다. 남은 것은 수복한 영토를 명목뿐 아니라 행정에서도 태국의 것으로 만드는 일입니다."
 thailand.105.a: "살윈강에서 바다까지 하나의 깃발을 올린다."
 thailand.105.b: "멈춘다. 군이 먼저 공고히 하게 한다."
 thailand.106.t: "샨 지역의 통합"
 thailand.106.d: "태국의 행정, 태국의 교육, 태국의 기반시설이 샨 고원에 닿습니다. 통합 위원회는 새 지방들이 왕국에 완전히 편입될 준비가 되었다고 보고합니다."
 thailand.106.a: "집에 온 것을 환영한다."
 thailand.107.t: "라오 지역의 통합"
 thailand.107.d: "메콩 지방들이 행정 통합을 마칩니다. 강은 더 이상 국경이 아닙니다."
 thailand.107.a: "집에 온 것을 환영한다."
 thailand.108.t: "크메르 지방의 통합"
 thailand.108.d: "옛 지명 사전의 프라따봉과 씨엠마랏, 곧 밧탐방과 시엠레아프가 1946년 이후 처음으로 태국 행정으로 돌아옵니다."
 thailand.108.a: "집에 온 것을 환영한다."
 thailand.109.t: "남부 지방의 통합"
 thailand.109.d: "옛 술탄국들이 편입을 마칩니다. 한 세기에 걸친 영국과 말레이시아의 통치가 끝납니다. 이제 시작되는 것은 이를 제대로 작동시켜야 하는 더 어려운 과업입니다."
 thailand.109.a: "집에 온 것을 환영한다."
 thailand.110.t: "세계의 반응"
 thailand.110.d: "모든 이웃 수도에서 긴급 회의가 열립니다. 식민지 시대 국경의 불가침이라는 아세안의 창립 원칙이 창립 회원국에 의해 부정되었습니다. 대사들이 소환되고 훈련이 중단되며, 오랜 친구들은 태국을 새로운 어휘로 묘사하기 시작합니다."
 thailand.110.a: "그들도 적응할 것이다."
 thailand.150.t: "남부의 불길"
 thailand.150.d: "2004년 1월 4일, 무장 세력이 나라티왓의 육군 보급창을 습격해 병사들을 살해하고 수백 정의 무기를 탈취합니다. 이어 최남단 말레이계 무슬림 지방 곳곳에서 조직적인 방화가 벌어집니다. 20년간 잠잠했던 분리주의 반란이 돌아왔습니다."
 thailand.150.a: "남부가 우리를 시험할 것이다."
 thailand.151.t: "최남단 지방에서의 사건"
 thailand.151.d: "또 한 주, 또 하나의 도로변 폭탄, 얄라, 빠따니, 나라티왓에서 벌어진 또 한 번의 검문소 총격입니다. 분쟁은 방콕이 무시하는 법을 배운 속도로 이어지고, 남부는 폭력이라는 새로운 현실을 받아들이도록 방치됩니다."
 thailand.151.a: "견딘다."
 thailand.152.t: "강압적 대응"
 thailand.152.d: "최남단 지방에서의 보안 작전이 억류자들의 죽음으로 끝나고 군은 자신들의 방식을 옹호합니다. 조사가 약속되지만 기소는 뒤따르지 않습니다. 국경 너머와 무슬림 세계 전체에서 그 영상들이 우리에게 불리하게 작용합니다."
 thailand.152.a: "질서에는 대가가 따른다."
 thailand.153.t: "쿠알라룸푸르 회담"
 thailand.153.d: "태국 관리들이 말레이시아 중재자들이 마련한 테이블에서 BRN 대표들과 마주 앉습니다. 의제는 안전 구역, 수감자 처우, 대화 자체의 승인 등으로 소박합니다. 수년 동안 전쟁이 존재한다는 것을 부정해 온 끝에, 대화하는 것이 곧 양보입니다."
 thailand.153.a: "대화를 이어 가게 한다."
 thailand.154.t: "평화 협정"
 thailand.154.d: "빠따니 지방들을 위한 자치 체제 틀이 서명됩니다. 선출직 지역 통치, 태국어와 함께하는 말레이어 교육, 분쟁 중 학대에 대한 사법 절차, 보안 병력의 단계적 철수가 포함됩니다. 태국 국경 안에서 가장 오래된 전쟁이 서명으로 끝납니다."
 thailand.154.a: "남부의 평화."
 thailand_news.1.t: "방콕에서의 쿠데타"
 thailand_news.1.d: "태국 왕립 육군이 방콕에서 권력을 장악하고 헌법을 정지시키며 선출된 정부를 해임했습니다. 1932년 이후 군사 위원회가 태국을 거듭 통치해 왔으며, 시장과 각국 외무 당국은 이번에는 얼마나 오래 머물 생각인지 가늠하고 있습니다."
 thailand_news.1.a: "또다시?"
 thailand_news.2.t: "'잃어버린 영토'에 대한 태국의 영유권 주장"
 thailand_news.2.d: "방콕은 한 세기 전 프랑스와 영국에 할양한 영토에 대해 공식적으로 영유권을 주장했으며, 제2차 세계 대전 이후 들어본 적 없는 영토 회복주의 계획을 되살렸습니다. 동남아시아 각국 수도는 경악하며 대응하고 있습니다."
 thailand_news.2.a: "우려스럽다."
 thailand_news.3.t: "시암의 공화국?"
 thailand_news.3.d: "태국이 군주제의 미래에 대한 국민투표를 실시합니다. 왕국의 근현대사에서 전례가 없는 문제입니다. 지역 전체가 숨을 죽이고 있습니다."
 thailand_news.3.a: "전례 없는 일이다."
 thailand_news.4.t: "푸미폰 국왕을 애도하는 태국"
 thailand_news.4.d: "세계에서 가장 오래 재위한 군주인 푸미폰 아둔야뎃 국왕이 향년 88세로 방콕에서 승하했습니다. 태국은 대부분의 태국인이 알았던 유일한 국왕을 위해 1년간의 애도에 들어갑니다. 그의 아들이 라마 10세 마하 와찌랄롱꼰 국왕으로 뒤를 잇습니다."
 thailand_news.4.a: "한 시대가 막을 내린다."
 thailand.58.t: "코브라의 늪"
 thailand.58.d: "'코브라 늪'이라 불리는 농응우하오는 1970년대부터 돈을 집어삼켜 왔습니다. 이제 새 공항이 실제로 그 위에 올라서고 있으며 비용도 함께 치솟습니다. 배수 문제, 갈라진 유도로, 같은 콘크리트를 두 번 청구하는 시공업체들. 이사회는 더 많은 돈 또는 더 많은 시간을 원합니다."
 thailand.58.a: "자금을 쏟아붓고 일정대로 개항한다."
 thailand.58.b: "일정이 밀리게 둔다."
 thailand.59.t: "아시아의 관문"
 thailand.59.d: "수완나품은 세계 최대급이며 방콕을 모든 아시아 노선도의 중심에 올려놓도록 지어진 유리와 강철의 대형 공항 터미널로 문을 엽니다. 첫 도착 안내판이 관광부의 꿈속처럼 별처럼 켜집니다."
 thailand.59.a: "왕국에 새로운 정문이 생겼다."
 thailand.60.t: "동부에서의 첫 삽"
 thailand.60.d: "동부경제회랑은 서류상으로만 존재하며 누군가 콘크리트와 강철의 비용을 대야 합니다. 베이징의 대표단이 일대일로 수사에 포장된 금융 제안을 가지고 도착합니다. 재무부는 국내에서도 자금을 조달할 수 있지만, 더 느리고 조건이 없습니다."
 thailand.60.a: "중국 자본을 유치한다."
 thailand.60.b: "국내 채권을 발행한다."
 thailand.61.t: "철도 연결 예산 초과"
 thailand.61.d: "세 공항 아래를 굴착하는 일은 처음부터 비쌀 수밖에 없었지만, 내각에 그것이 얼마나 비쌀지 현실적으로 추산한 사람은 없었습니다. 세 공항 연결선에는 또 다른 신용 한도나 더 작은 설계도가 필요합니다."
 thailand.61.a: "지불한다. 척추는 온전히 건설한다."
 thailand.61.b: "범위를 축소한다."
 thailand.62.t: "찾아온 일대일로"
 thailand.62.d: "쿤밍에서 비엔티안을 거쳐 방콕으로 이어지는 고속철도입니다. 중국의 인도차이나 회랑에서 빠진 중간 구간이 태국 영토를 지나가며, 베이징은 이를 기꺼이 지원하려 합니다. 조건은 후합니다. 그러나 조건은 어디까지나 조건입니다."
 thailand.62.a: "철도 양해각서에 서명한다."
 thailand.62.b: "태국식으로 천천히 재협상한다."
 thailand.63.t: "이권 문제"
 thailand.63.d: "야당 상원의원들은 최대 보유자가 정부를 구성한 이후 국가 통신 이권이 어떻게 되었는지 표로 정리합니다. 세금은 조정되고, 면허는 연장되며, 경쟁사는 감사를 받았습니다. 공식 답변에서 '우연'이라는 말이 무거운 일을 하고 있습니다."
 thailand.63.a: "지분을 처분한다. 국고 손실을 감수하고 깨끗한 평판을 산다."
 thailand.63.b: "뻔뻔하게 버틴다. 숫자는 선거에서 이기고, 변호사는 시간을 번다."
 thailand.64.t: "가계 부채의 청산"
 thailand.64.d: "마을 기금은 가게와 오토바이, 정미소를 모두 외상으로 지었습니다. 농촌 가구의 평균 부채는 거의 두 배로 늘었고 협동조합의 장부가 흔들리기 시작했습니다. 은행들은 만기 연장 시즌 전에 지침을 원합니다."
 thailand.64.a: "협동조합을 구제한다. 상환 유예에는 비용이 들지만 마을을 구한다."
 thailand.64.b: "신용을 조이게 둔다. 시장이 스스로 바로잡고 마을이 비용을 흡수한다."
 thailand.65.t: "상쇄 거래와 에리아이"
 thailand.65.d: "사브의 최종 제안이 테이블 위에 놓입니다. 소스 코드 전면 접근 권한이 있는 그리펜, 에리아이 공중 조기경보 레이더, 대학 제휴, 태국 산업을 위한 부품 작업이 모두 일정 가격에 포함됩니다. 아니면 같은 전투기를 알맹이만 훨씬 싼 값에 들여옵니다."
 thailand.65.a: "전체 패키지를 받아들인다."
 thailand.65.b: "기체만. 예산을 생각하자."
 thailand.66.t: "엔진 문제"
 thailand.66.d: "독일은 중국제 수출용 잠수함에 들어갈 디젤 엔진의 면허를 내주지 않으려 하며, 이로 인해 대금이 반만 지급된 S26T 선체는 우한에서 심장을 기다리고 있습니다. 베이징은 자체 엔진과 할인을 제안합니다. 해군은 내각에 민망한 선택지 가운데 하나를 고르라고 합니다."
 thailand.66.a: "중국제 엔진을 받아들이고 인도받는다."
 thailand.66.b: "보상으로 호위함 선체를 요구한다."
 thailand.66.c: "계약을 전면 취소한다."
 thailand.67.t: "부활한 기함"
 thailand.67.d: "스키 점프대 위의 무인기, 격납고 갑판 웰 안의 무인정, 해리어 예비 부품이 녹슬던 자리에 놓인 통제 콘솔. HTMS 짜끄리 나루에벳은 이 지역의 어떤 해군도 흉내 낼 수 없는 임무 구성을 갖추고 사타힙으로 돌아옵니다."
 thailand.67.a: "카메라 앞에서 퍼레이드를 시킨다."
 thailand.67.b: "조용히 재취역시켜 곧바로 임무에 투입한다."
 thailand.68.t: "공포의 90일"
 thailand.68.d: "블랙리스트는 사망자 수가 되었습니다. 3개월 동안 2천 명이 넘게 죽었고, 상당수는 수사관이 찾아낼 수 있는 마약 연관성조차 없습니다. 농촌은 박수를 치고, 병원은 가득 차며, 외무부의 수신함은 더 빨리 채워집니다."
 thailand.68.a: "계속 밀어붙인다. 캠페인은 효과가 있다."
 thailand.68.b: "마무리하고 검토를 지시한다."
 thailand.69.t: "장교 클럽의 술렁임"
 thailand.69.d: "방콕의 모든 정부가 읽는 법을 배우는 징후가 여기 모두 있습니다. 제1군 관구로의 이례적인 보직 이동, 갑자기 텔레비전 인터뷰를 좋아하게 된 예비역 장성들, 군 수뇌부의 절반이 참석한 기병 병영의 동기 모임입니다."
 thailand.69.a: "수뇌부를 숙청한다."
 thailand.69.b: "장성들의 비위를 맞춘다."
 thailand.69.c: "공개적으로 맞선다."
 thailand.70.t: "정부 청사 앞의 전차"
 thailand.70.d: "언제나 시작되는 방식 그대로 시작됩니다. 정규 방송은 애국가요로 대체되고, 교차로에는 장갑차가 서 있으며, 어제까지 아무도 들어본 적 없는 '위원회'의 성명이 나옵니다. 정부에는 무엇을 치를 각오가 있는지 결정할 시간이 몇 분밖에 없습니다."
 thailand.70.a: "충성파를 결집시켜 저항한다."
 thailand.70.b: "양보하고 비행기에 오른다."
 thailand.70.c: "거국 일치 정부를 협상한다."
 thailand.70.c_tooltip: "§Y장성들은 내각에 들어가지만 궁정에는 들어가지 않습니다.§!\n선거는 유지되며(§G선거 중단 없음§!) 쿠데타 압력이 §Y35§!로 떨어집니다. 왕국은 안정성이 낮아지고 정치적 의지가 제한되며, §Y불편한 타협§!이 180일 동안 정부를 압박합니다."
 thailand.71.t: "거리의 청년들"
 thailand.71.d: "그들은 텔레그램으로 조직하고, 햄토리와 헝거 게임을 인용하며, 기념물을 수만 명으로 가득 채웁니다. 요구 사항은 바리케이드 너머로 던진 종이비행기에 적혀 있습니다. 의회 해산, 헌법 개정, 건드릴 수 없는 제도의 개혁."
 thailand.71.a: "집회를 해산한다. 질서는 기다릴 수 없다."
 thailand.71.b: "대화를 연다. 어조는 양보하되 본질은 양보하지 않는다."
 thailand.71.c: "버티며 기다린다. 우리보다 먼저 지칠 것이다."
 thailand.155.t: "불타는 지역"
 thailand.155.d: "하룻밤 사이 세 지방에서 조직적인 방화가 벌어집니다. 검문소가 대낮에 공격당합니다. 교사들은 호위를 받고, 학교들은 학기 내내 문을 닫습니다. 남부는 한 세대 동안 이런 불길에 휩싸인 적이 없었고, 국가안보회의는 방향을 요구합니다."
 thailand.155.a: "남부에 병력을 쏟아붓는다."
 thailand.155.b: "쿠알라룸푸르에 연락해 대화를 넓힌다."
 thailand.156.t: "빠따니의 조용한 도로"
 thailand.156.d: "월간 사건 지도에는 붉은색보다 빈 공간이 더 많습니다. 시장은 해가 진 뒤에도 문을 열고, 검문소는 차량을 통과시키며, 쿠알라룸푸르 테이블 건너편의 사람들은 조심스럽게 최종 지위가 어떤 모습일지 묻고 있습니다."
 thailand.156.a: "최종 협정을 추진한다."
 thailand.156.b: "고요와 현상 유지를 계속한다."
 thailand.350.t: "남부의 불길"
 thailand.350.d: "남부 세 지방의 지도는 폭탄 테러, 매복, 방화, 암살이 찍힌 붉은 핀의 성좌와 같습니다. 수천 명이 죽었고 보안군은 대체할 수 없는 병력을 잃고 있습니다. 이 위기는 더 이상 변두리에서 관리할 수 없습니다. 정부는 남부에서 어떤 종류의 국가가 되려는지 결정해야 합니다. 주먹이 될지, 후원자가 될지, 테이블 건너편의 파트너가 될지."
 thailand.350.a: "분쇄한다. 남부는 질서의 의미를 알게 될 것이다."
 thailand.350.b: "국왕의 평화. 남부를 개발하여 되찾는다."
 thailand.350.c: "대화한다. 오랜 적과도 서류에는 서명할 수 있다."
 thailand.350.e: "명확한 정책이 없다. 닥치는 대로 관리한다."
 thailand.356.t: "트럭"
 thailand.356.d: "또 한 번의 소탕, 또 다른 지구 경찰서 밖의 또 다른 군중. 수백 명의 억류자가 군용 트럭에 엎드린 채 포개져 실려 가다 수용소에 도착했을 때 수십 명이 질식사한 채로 끝났습니다. 영상은 방콕이 성명을 내기도 전에 무슬림 세계로 퍼집니다. 현장에서 작전이 무엇을 이루었든, 한 세대를 급진화시켰고 반군에게 창설 신화를 안겨 주었습니다."
 thailand.356.a: "재앙이다. 남부는 이를 잊지 않을 것이다."
 thailand.357.t: "평정 완료"
 thailand.357.d: "장성들은 임무가 완수되었다고 보고합니다. 도로변 폭탄은 멎었고, 조직은 와해되었으며, 검문소는 철거되고 있습니다. 군이 측정하는 모든 지표로 보면 최남단 지방은 평정되었습니다. 그러나 침묵 아래에서 원한은 죽지 않았습니다. 단지 기다리는 법을 배웠을 뿐입니다."
 thailand.357.a: "총성이 멎었다. 불씨를 지켜본다."
 thailand.358.t: "남부의 평온"
 thailand.358.d: "조약도 자치도 없었지만 폭력은 관리된 고요 속으로 물러났습니다. 왕실 개발이 이어지고, 지역 유력자들은 울타리 안에 들어와 있으며, 남부에서 군주제의 정통성은 조용히 회복됩니다. 주둔과 후원으로 유지되는 평온이며, 해결되었다기보다 지켜보는 상태입니다."
 thailand.358.a: "왕실은 쟁취한 평화를 지킨다."
 thailand.359.t: "기득권의 반발"
 thailand.359.d: "특별 자치법 초안이 유출되었고 방콕의 반응은 격렬합니다. 장성들은 분할을 경고하고, 궁정 보수파는 선례를 두고 중얼거리며, 민족주의 언론은 이를 항복이라 부릅니다. 협상단은 서명할 준비가 되어 있지만, 정부는 전선을 지키기 위해 정치적 자본을 쓸지, 아니면 중앙이 삼킬 수 있는 수준으로 틀을 희석할지 결정해야 합니다."
 thailand.359.a: "전선을 지킨다. 협정은 진짜여야 한다."
 thailand.359.b: "희석한다. 평화는 지키되 원칙을 잃는다."
 thailand.360.t: "빠따니 협정"
 thailand.360.d: "한 장의 서류 위 서명이 왕국의 근현대 국경 안에서 가장 오래된 전쟁을 끝냅니다. 남부는 단일 국가 태국 안에서 진정한 자치를 얻고, 무기는 반납되며, 실향민들은 돌아오기 시작합니다. 불완전하고 논란이 많지만 역사적인 협정이며, 한 세대 만에 처음으로 빠따니의 아이들은 통행금지 없이 자라게 될 것입니다."
 thailand.360.a: "마침내 남부에 평화가 왔다."
 thailand_news.24.t: "딱바이 학살"
 thailand_news.24.d: "딱바이 밖 군용 트럭에서 억류자들이 질식한 영상이 무슬림 세계의 모든 수도에 닿았습니다. 쿠알라룸푸르, 자카르타, 앙카라는 태국 대사를 소환했고 인권 단체들은 조사를 요구합니다. 방콕의 남부 정책은 이제 잔학 행위의 대명사가 되었으며, 반군은 이보다 쉬운 모집 시즌을 가진 적이 없습니다."
 thailand_news.24.a: "세계가 남부를 지켜보고 있다."
 thailand_news.25.t: "빠따니에 찾아온 평화"
 thailand_news.25.d: "한 세대에 걸친 유혈 사태 끝에 태국 최남단에서 총성이 멎었습니다. 군인의 손에 의해서든 협상가의 펜에 의해서든, 왕국의 근현대사에서 가장 오래된 반란이 막을 내렸습니다. 도로는 열리고 시장은 가득 차며, 빠따니, 얄라, 나라티왓에 조심스러운 일상이 돌아옵니다."
 thailand_news.25.a: "긴 전쟁이 끝난다."
 thailand_news.23.t: "거국 일치 정부"
 thailand_news.23.d: "교차로에서 전차는 물러났지만 밤사이에 맺은 거래는 위기보다 오래 갈 것입니다. 선출된 정부는 위임을 유지하고 투표함은 자리를 지키지만, 이제 군 수뇌부가 내각 테이블에 앉아 있으며 방콕의 모든 이는 누가 평화를 보증했는지 이해하고 있습니다. 아무도 좋아하지 않고 아무도 감히 깨지 못하는 타협이며, 군을 울타리 안에 들인 국가 정부입니다."
 thailand_news.23.a: "권력은 나뉘고 감시받는다."
 thailand.3.c: "양귀비가 아닌 작물을. 대체 개발에 자금을 댄다."
 thailand.361.t: "길가의 시신들"
 thailand.361.d: "3개월간의 캠페인이 끝났고 집계가 나왔습니다. 인권 단체들은 약 2,800명의 사망을 기록했으며, 대다수는 어떤 혐의로도 기소된 적이 없고 상당수는 이름조차 확인되지 않았습니다. 블랙리스트는 오래된 원한을 갚았고 할당량은 시신으로 채워졌습니다. 거리는 더 조용해졌고 지지율은 어느 때보다 높지만, 병영과 궁정에서는 일정표대로 사람을 죽이는 정부에 대해 사람들이 메모를 하고 있습니다."
 thailand.361.a: "숫자는 숫자일 뿐이다. 우리는 사과하지 않는다."
 thailand.362.t: "양귀비가 아닌 작물"
 thailand.362.d: "차단만으로는 거래를 다음 산등성이 너머로 밀어냈을 뿐입니다. 농학자와 공중 보건 관계자들은 다른 제안을 내놓습니다. 산악 지대 농민들에게 아편 대신 커피, 마카다미아, 과일을 재배하도록 보수를 지급하고, 중독을 범죄가 아닌 질병으로 다루며, 헬리콥터가 결코 하지 못한 일을 합법적 환금 작물이 하게 하자는 것입니다. 더 느리고 더 저렴하며, 국가에 총을 쏘는 일을 멈추고 사들이기 시작하라고 요구합니다."
 thailand.362.a: "대체 개발에 자금을 댄다. 시장으로 산악 지대를 얻는다."
 thailand.362.b: "계속 차단한다. 지금의 방어선을 지킨다."
 thailand_news.5.t: "태국의 동부경제회랑 공개"
 thailand_news.5.d: "방콕은 세 개의 공항을 잇는 고속철도, 확장된 우타파오 항공도시, 전기차와 항공우주, 생명공학을 겨냥한 인센티브 패키지를 갖춘 동부 해안의 대표 개발 구역을 공식 개장했습니다. 분석가들은 이를 1980년대 동부 해안 계획 이후 가장 야심 찬 태국 경제 사업이라 평가합니다."
 thailand_news.5.a: "미소의 나라는 진지하다."
 thailand.50.b: "충격을 완화하고 국민을 보호한다."
 thailand.55.b: "국민차를 만든다."
 thailand.200.t: "국민 헌법"
 thailand.200.d: "시민 사회 단체, 학자, 지역 사회 지도자들이 진정한 대중 참여로 작성된 헌법을 기념합니다. 수십 년 만에 처음으로 평범한 태국인들은 자신들의 기본법을 만드는 데 손을 보탰다고 느끼며, 방콕의 거리는 뜻밖에도 축제 분위기입니다."
 thailand.200.a: "민주주의가 뿌리내린다."
 thailand.201.t: "돈므앙의 기록"
 thailand.201.d: "돈므앙의 승객 수가 이전의 모든 기록을 넘어섰고, 어메이징 타일랜드 캠페인은 누구의 예측도 뛰어넘는 성과를 냈습니다. 항공사 임원들은 신규 직항 노선을 발표하고 있으며 여행사들은 이미 다음 두 시즌 예약을 마감하고 있습니다. 우리 앞의 문제는 이 수익을 어떻게 할 것인가입니다."
 thailand.201.a: "남부 리조트에 재투자한다."
 thailand.201.b: "뜻밖의 수익을 저축한다."
 thailand.202.t: "쌀에 굶주린 세계"
 thailand.202.d: "인도 아대륙의 가뭄과 동남아시아 전역의 흉작으로 세계 쌀 가격이 10년 만의 최고치로 치솟았습니다. 태국은 모든 곡물 수입국이 당장 원하는 고급 홈말리와 재스민 품종의 비축분을 쥐고 있습니다. 상무부가 우리의 답을 기다리고 있습니다."
 thailand.202.a: "비축분을 프리미엄 가격에 판매한다."
 thailand.202.b: "쌀을 국내에 두고 국내 가격을 보조한다."
 thailand.203.t: "기지 사용 요청"
 thailand.203.d: "미국 태평양 사령부는 병참, 감시, 사전 배치를 위해 우타파오 공군 기지에 대한 접근권 확대를 조용하지만 공식적으로 요청했습니다. 미국은 국고 이전, 장비 개선, 정치적 엄호로 그 값을 치를 용의가 있습니다. 대중은 세부 사항을 알 필요가 없습니다."
 thailand.203.a: "접근을 허용하고 돈을 받는다."
 thailand.203.b: "정중히 거절한다. 태국의 땅, 태국의 주권."
 thailand_news.6.t: "휘어도 부러지지 않는 대나무"
 thailand_news.6.d: "태국은 워싱턴과의 조약 관계를 심화하는 동시에 베이징과 새로운 틀의 경제 동반자 관계를 체결하는 획기적인 이중 트랙 외교 노선을 확정했습니다. 방콕의 외무부는 이를 '대나무 외교'라 부르며, 유연하고 회복력이 있으며 무엇보다 태국의 이익에 뿌리를 두고 있다고 말합니다."
 thailand_news.6.a: "놀라운 줄타기다."
 thailand_news.7.t: "태국의 IMF 부채 2년 앞당김 상환"
 thailand_news.7.d: "방콕은 국제통화기금에 대한 전체 채무를 예정보다 2년 앞서 청산했습니다. 재무부가 요란하지 않게 발표한 이번 조기 상환은 1997년 아시아 금융 위기의 장을 마감하고, 태국을 1997년 구제금융 프로그램에 따른 마지막 조건에서 해방시킵니다."
 thailand_news.7.a: "미소의 나라는 빚을 갚는다."
 thailand.205.t: "테크노크라트 대 구세대"
 thailand.205.d: "새로운 CEO식 내각은 모든 부처에 성과 목표를 설정했고, 여러 상임 차관이 기업 임원으로 교체되었습니다. 낡은 관료 조직은 달갑지 않습니다. '주식회사 태국'을 밀어붙이는 테크노크라트와 30년 동안 부처를 운영해 온 직업 관료 사이에 조용한 전쟁이 벌어지고 있습니다."
 thailand.205.a: "테크노크라트를 지지한다. 부처를 개혁한다."
 thailand.205.b: "직업 관료제를 보호한다. 부처를 돌아가게 하고 장성들을 우리 편에 둔다."
 thailand.207.t: "쁘라윳 피로감"
 thailand.207.d: "3년이 지나면서 장성들의 개혁 약속은 빛이 바래고 있습니다. 헌법 기초 위원회는 두 차례 재구성되었습니다. 선거 날짜는 두 번 미뤄졌습니다. 의회 밖에서 팻말을 든 대학생은 열일곱 건의 혐의에 직면해 있습니다. 허니문은 끝났습니다."
 thailand.207.a: "전환을 신중하게 관리하겠다."
 thailand.208.t: "계속되는 대치"
 thailand.208.d: "며칠이 지나고 몇 주가 흐릅니다. 시위는 무너지지도 않았지만 확대되지도 않았습니다. 정부는 양보하지도 광장을 정리하지도 않습니다. 결국 양측 모두 눈을 깜박일 것입니다. 누가 먼저 무너질까요?"
 thailand.208.a: "양보를 통해 조용한 해결을 모색한다."
 thailand.208.b: "시위대가 공을 차지하고, 정부는 비난을 받는다."
 thailand_news.8.t: "키를 잡은 궁정"
 thailand_news.8.d: "태국 왕실은 왕실재산관리국 자산 관리에서의 역할을 공식화하여, 수천억 바트 규모의 상업 자산에 대한 권한을 궁정에 직접 보고하는 구조로 통합했습니다. 방콕의 분석가들은 이것이 헌법적 새로움인지, 수십 년 동안 비공식적으로 존재해 온 체계를 법적으로 정리한 것에 불과한지 논쟁하고 있습니다."
 thailand_news.8.a: "짜끄리 왕조는 영속한다."
 thailand.209.t: "온라인에 모인 아이들"
 thailand.209.d: "청년이 이끄는 시위 운동이 방콕, 치앙마이, 그리고 세 곳의 지방 대학 캠퍼스에서 동시에 터져 나왔습니다. 경찰이 바리케이드를 펼치기도 전에 그들의 요구가 라이브 스트림으로 전파됩니다. 정부는 개입할지 기다릴지 결정해야 합니다."
 thailand.209.a: "그들의 대의를 옹호한다."
 thailand.209.b: "계속 통치한다. 이 순간이 지나가게 둔다."
 thailand.210.t: "병영에서 온 서한"
 thailand.210.d: "고위 장교들 사이에서 돌다 유출된 익명의 문서가 진급과 조달에 대한 군의 영향력을 민간이 주도하여 줄이려는 계획을 서술합니다. 문서에는 경고가 담겨 있습니다. 군이 지켜보고 있으며 인내에는 한계가 있다는 것입니다. 초기 단계의 진짜 쿠데타 음모일 수도, 허세일 수도 있습니다. 어떻게 대응하느냐가 이곳이 어떤 나라인지를 규정합니다."
 thailand.210.a: "지금 행동하여 음모자들이 조직하기 전에 숙청한다."
 thailand.210.b: "조용히 진행한다. 유출에 대응해 격을 높여 주지 않는다."
 thailand.211.t: "지방의 목소리"
 thailand.211.d: "북동부와 북부 상부의 개표 결과가 나왔고, 선거구마다 개혁 명부로 쏠렸습니다. 30년 경력의 베테랑 의원들이 소셜 미디어로 선거 운동을 한 28세 후보들에게 패배했습니다. 지역구 의원이 전화를 받아 준 적이 없었던 유권자들이 선거 지도를 다시 그리고 있습니다."
 thailand.211.a: "위임을 장악한다."
 thailand.211.b: "우리 유권자만이 아닌 모두를 위해 통치한다."
 thailand.212.t: "재벌들의 대응"
 thailand.212.d: "이전에 독점되었던 주파수 대역의 경매는 개혁가들이 예측한 바로 그 횡재를 가져왔습니다. 같은 주에 3대 재벌이 조율한 법적 도전이 헌법재판소에 접수되었고, 왕당파 신문의 사설 칼럼은 재무부를 '이념에 사로잡혔다'고 묘사했습니다. 분할 정책은 효과를 내고 있으며, 강력한 적들이 생겼습니다."
 thailand.212.a: "밀어붙인다. 법은 우리 편이다."
 thailand.212.b: "강제 분할이 아닌 관리된 단계적 정리라는 합의안을 제시한다."
 thailand.213.t: "공화국의 첫 해"
 thailand.213.d: "선언으로부터 열두 달이 지났고, 나라는 여전히 여기에 있습니다. 멍들고, 활기차고, 논쟁하고 있지만 존재합니다. 왕당파 운동은 사라지지 않았습니다. 그것은 법적, 문화적 운동으로 변이했습니다. 첫 대통령 선거가 예정되어 있습니다. 내각 앞에 놓인 문제는 이를 성공이라 부를지, 균열을 인정할지, 아니면 그냥 통치를 이어 갈지입니다."
 thailand.213.a: "우리는 오래 지속될 무언가를 세웠다."
 thailand.213.b: "짜끄리의 대의는 끝나지 않았다. 국민은 기억한다."
 thailand.213.c: "공화국은 지금은 살아남았다. 아직 지킬 것이 많다."
 thailand.214.t: "기념비를 지나가는 행렬"
 thailand.214.d: "세 시간 동안 포병, 기갑, 보병이 이어지며 군 전체가 라차담넌 대로를 따라 완전한 열병 대형으로 행진합니다. 군중은 기획자들이 예상한 것보다 많습니다. 자신들의 전쟁을 잊고 쿠데타를 일상으로 받아들인 나라에서 이 과시는 이례적인 무게로 다가옵니다."
 thailand.214.a: "국가가 수호자들에게 경례한다."
 thailand_news.9.t: "태국의 동성 결혼 합법화"
 thailand_news.9.d: "태국 의회는 혼인 평등법을 3분의 2 다수로 통과시켜 성별에 관계없이 완전한 혼인권을 부여하는 동남아시아 최초의 국가가 되었습니다. 이 법은 즉시 발효됩니다. 방콕의 실롬과 치앙마이의 님만 지구에서 열린 기념 행사에는 수만 명이 모였습니다. 이웃 나라 정부 몇 곳은 '우려'를 표명하는 성명을 냈습니다."
 thailand_news.9.a: "아시아의 이정표."
 thailand_news.10.t: "지켜진 봄"
 thailand_news.10.d: "청년 시위의 물결을 타고 개혁 정부가 출범한 지 3년, 태국은 오늘 완전한 민주적 전환을 마쳤습니다. 군에 대한 민간 통제가 공식화되고, 임명제 상원이 해산되었으며, 20년 만의 첫 자유 경쟁 선거가 아무 사고 없이 치러졌습니다. 17개국의 국제 참관단이 결과를 인증했습니다."
 thailand_news.10.a: "민주주의가 뿌리내린다."
 thailand_news.11.t: "아시아를 휩쓰는 태국판 한류"
 thailand_news.11.d: "도쿄에서 타이베이, 쿠알라룸푸르에 이르기까지 태국 콘텐츠가 곳곳에 있습니다. 스트리밍 시리즈, 힙합 가수, 패션 브랜드, 그리고 정부가 계획하지도 않았고 전적으로 공을 주장할 수도 없는 음식 외교의 흐름까지. 태국의 문화 산출물은 가치와 영향력 모두에서 이웃 나라들을 앞질렀습니다."
 thailand_news.11.a: "세계는 태국이 만드는 것을 원한다."
 thailand.215.t: "왕국의 현황 점검"
 thailand.215.d: "새 정부의 첫 내부 검토가 완료되었습니다. 관리들은 숫자, 부채 비율, 기반시설 격차, 무역 수지, 민심을 모았고, 분석에서 세 가지 길이 두드러졌습니다. 정부는 첫 번째 우선순위를 선택해야 합니다. 지금 무엇을 택하든 향후 2년간 나라의 궤적을 좌우할 것입니다."
 thailand.215.a: "회복에 집중한다. 경제를 바닥부터 재건한다."
 thailand.215.b: "질서에 집중한다. 개혁에 앞서 제도를 강화한다."
 thailand.215.c: "세계에 집중한다. 외교와 무역을 앞세운다."
 thailand.216.t: "장성들의 수"
 thailand.216.d: "정부의 저항 호소가 경찰, 국경 순찰대, 시민 사회 네트워크, 거리의 충성파들에게 전달되었습니다. 국민이 응답하느냐가 태국 정치의 향후 10년을 결정하는 문제입니다. 작전실에서 참모들은 지도 위의 부대 배치를 지켜보며 숫자를 세고 있습니다."
 thailand.216.a: "전선을 지킨다."
 thailand.217.t: "베이징의 불쾌감 표명"
 thailand.217.d: "중국 대사관의 서한은 외교적으로 표현되었지만 분명히 차갑습니다. 워싱턴에 대한 태국의 깊어지는 밀착은 간과되지 않았습니다. 베이징의 국영 언론은 태국의 '모순된 자세'를 언급합니다. 투자 사절단은 조용히 방문을 연기합니다. 방콕 앞에 놓인 문제는 이 중 얼마만큼을 받아들이고 얼마만큼을 흘려보낼 것인가입니다."
 thailand.217.a: "관계가 식도록 둔다. 우리는 선택을 했다."
 thailand.217.b: "총리의 친서로 베이징을 조용히 안심시킨다."
 thailand.218.t: "워싱턴의 조정"
 thailand.218.d: "미국 국무부는 태국의 새로운 일대일로 밀착에 대해 공개적으로는 계산된 중립을 보였지만, 의회 직원들은 코브라 골드 예산과 조약상의 공약에 대해 날카로운 질문을 하기 시작했습니다. 워싱턴 싱크탱크에 유출된 국방부의 평가는 태국을 '전략적으로 모호하다'고 묘사합니다. 방콕은 관계를 관리해야 합니다."
 thailand.218.a: "냉각을 받아들인다. 우리는 주권 국가다."
 thailand.218.b: "대사에게 비공식적으로 안심시킨다. 본질적으로 달라지는 것은 없다."
 thailand.219.t: "영속하는 장성들"
 thailand.219.d: "군의 후견을 제도화하겠다는 결정은 국제 신문 사설란에까지 닿았습니다. 파이낸셜 타임스는 이를 '관리된 권위주의'라 묘사합니다. 유럽 대사 세 명이 같은 주에 외무부에 면담을 요청했습니다. 국내에서는 개혁 성향의 학자와 학생들이 보도를 읽고 나름의 결론을 내리고 있습니다."
 thailand.219.a: "우리는 우리의 판단대로 통치한다. 외국의 논평은 무관하다."
 thailand.219.b: "비판자들은 태국에 대해 틀렸다. 우리의 방식으로 그들이 틀렸음을 증명하겠다."
 thailand.220.t: "다시 방문객을 맞이하는 남부"
 thailand.220.d: "쓰나미가 안다만 해안의 해변을 복구 인력 외에는 모두에게 닫아 둔 지 2년, 마지막 리조트가 다시 문을 열었습니다. 태국 관광청은 신중한 재활 캠페인을 펼쳤고, 예약 상황은 그 효과를 보여 줍니다. 남부가 돌아왔습니다."
 thailand.220.a: "태국이 문을 열었다."
 thailand.221.t: "남부 재건 완료"
 thailand.221.d: "국제 원조 팀과 정부 기술자들이 해안 기반시설 재건 계획을 마쳤습니다. 도로는 재건되고, 어항 부두는 수리되었으며, 전력망은 복구되었습니다. 원조 파트너들에게 감사를 표했고 비계는 철거되고 있습니다."
 thailand.221.a: "남부가 다시 일어섰다."
 thailand.222.t: "글로벌 금융 위기"
 thailand.222.d: "뉴욕에서 리먼 브라더스가 붕괴하면서 아시아 시장에 충격파가 퍼졌습니다. 태국의 수출 부문은 수주 장부를 면밀히 지켜보고 있습니다. 방콕 앞의 문제는 지난 10년 동안 쌓은 금융 완충재가 버텨 줄 것인지, 아니면 위기가 방파제를 뚫고 들어올 것인지입니다."
 thailand.222.a: "태국은 폭풍을 이겨 낸다. 우리의 신중함이 보답을 받았다."
 thailand.222.b: "폭풍이 도착했다. 어려운 2년에 대비해야 한다."
 thailand.223.t: "삼백칠십칠"
 thailand.223.d: "추밀원의 열람실과 군 내부 정보 부서의 복도에서 분석가들이 선거 결과를 분석하고 있습니다. 377석. 단독 과반. 태국 민주주의 역사상 전례 없는 위임이며, 조직에는 이에 맞설 믿을 만한 수단이 없습니다. 오늘은 아닙니다."
 thailand.223.a: "마을이 말했다. 지금은."
 thailand.224.t: "쌀의 청산"
 thailand.224.d: "세계 쌀 가격은 협조하지 않았습니다. 세계적인 공급 과잉으로 정부는 시장 가치를 크게 웃도는 가격에 사들인 수백만 톤의 비축 쌀을 떠안았고, 제도의 재원을 마련하기로 했던 차익 거래는 실현되지 않았습니다. 재무부는 세 가지 선택지를 테이블에 올렸습니다. 그중 둘은 정치적으로 가능합니다."
 thailand.224.a: "손실을 흡수하고 부족분을 국고로 메운다."
 thailand.224.b: "제도를 무너지게 두고 정치적 타격을 지금 받는다."
 thailand.225.t: "마을에 닿은 길"
 thailand.225.d: "안전모를 쓴 장관들이 코랏 고원을 가로지르는 새 고속도로와 북부 계곡으로 이어지는 철도 지선의 테이프를 끊습니다. 아들들을 수도 건설에만 보내던 소도시들에 지방 사무소가 문을 엽니다. 이번만은 개발이 압승을 안겨 준 사람들에게 돌아갑니다."
 thailand.225.a: "근거지가 보답받는다."
 thailand.226.t: "와찌랄롱꼰 국왕의 치세"
 thailand.226.d: "애도의 해가 끝나가고 있습니다. 새 국왕의 왕위 접근 방식은 부왕과 다릅니다. 대중 앞에서 더 눈에 띄는 모습, 왕실 재산에 대한 더 단단한 장악, 다른 종류의 왕실 카리스마. 9세 치세를 섬겼던 네트워크는 10세를 섬기는 법을 배워야 합니다. 같은 네트워크가 아닙니다."
 thailand.226.a: "왕국이 새 시대로 들어선다."
 thailand.227.t: "퇴역 군인들의 반발"
 thailand.227.d: "징병제를 단계적으로 폐지한다는 발표는 퇴역 장교와 재향군인회의 조직적인 반응을 불러왔습니다. 병영에서는 고참 부사관들이 '속이 텅 빈' 군대에 대해 불평합니다. 언론은 불만스러운 표정을 한 노장성들의 정복 사진을 싣습니다. 정부는 이를 예상했지만, 반발의 폭은 모델이 시사한 것보다 큽니다."
 thailand.227.a: "굳건히 버틴다. 개혁은 옳다."
 thailand.227.b: "재향군인 예우 행사를 열고 비판을 상징적으로 흡수한다."
 thailand.228.t: "관광 배당금"
 thailand.228.d: "항공 자유화 협정 이후 첫 시즌이 기록에 남았습니다. 관광청의 수치는 강력합니다. 입국자 수는 12퍼센트 증가했고 일일 평균 지출은 19퍼센트 늘었으며, 신규 저가 항공 노선의 혜택을 가장 많이 받는 남부 리조트들은 10년 만에 최고의 분기를 보고하고 있습니다."
 thailand.228.a: "바트가 흘러들고 있다."
 thailand_news.13.t: "아시아의 관문, 태국"
 thailand_news.13.d: "태국 정부는 운하든 육교든 남부 기반시설 회랑을 '공정한 조건으로 모든 국가에 개방'한다고 공식 선언했습니다. 국제 투자는 이미 남부 경제 구역으로 흘러들기 시작했으며, 방콕은 우대 통과 협정을 원하는 열두 개국의 대표단을 맞이하고 있습니다."
 thailand_news.13.a: "미소의 나라가 해상 교통로를 장악한다."
 thailand.250.t: "눈을 깜박인 정부"
 thailand.250.d: "파업은 너무 오래 나라를 멈춰 세웠고, 권력을 쥔 자들에게 비용은 감당할 수 없는 수준이 되었습니다. 부두, 철도, 부처, 모든 것이 멈췄고 거리는 운동의 것입니다. 군이 자국민에게 발포하는 데 도박을 거는 대신 내각은 협상의 문을 엽니다. 총이 아닌 배짱으로 얻어낸 권력으로 가는 평화로운 길입니다."
 thailand.250.a: "거리를 얻었다. 이제 국가를 얻는다."
 thailand.259.t: "장성들의 질서 회복"
 thailand.259.d: "파업은 길게 이어졌지만 정부의 의지를 끝내 꺾지는 못했고, 군 수뇌부가 먼저 인내심을 잃었습니다. 대로에는 전차가 서 있고, 파업 지도자들은 체포되고 있으며, 통행금지가 발효되었습니다. 혁명은 권력을 쥐기도 전에 진압되었고, 제복을 입은 자들이 이제 질서의 이름으로 통치합니다. 붉은 길은 막혔습니다."
 thailand.259.a: "혁명은 꺾였다."
 thailand.251.t: "움츠러든 세계"
 thailand.251.d: "태국의 새 정부가 세계에 모습을 드러냈습니다. 워싱턴의 반응은 당 창당 문서의 잉크가 마르기도 전에 도착했습니다. 경제 제재, 동결된 원조 파이프라인, 그리고 생색을 내면서 동시에 위협하는 국무부의 성명입니다. 반면 베이징과 하노이는 축하를 보내왔습니다."
 thailand.251.a: "제재하라 하라. 우리는 그들의 승인을 받으려고 이 혁명을 한 것이 아니다."
 thailand.252.t: "왕당파의 출국"
 thailand.252.d: "토지 개혁은 점잖은 방콕 사교계가 묻기를 꺼렸던 질문에 답을 내놓았습니다. 옛 체제 위에서 부를 쌓은 자들, 곧 부재지주, 궁정 주변의 투자 네트워크, 자녀 한 명 한 명의 명의로 1만 라이씩을 보유했던 지방 가문들이 선택을 내렸습니다. 그들 대부분은 이미 싱가포르, 런던, 로스앤젤레스행 비행기에 올라 있습니다."
 thailand.252.a: "나라는 지주의 것이 아니다."
 thailand.253.t: "짜끄리 딜레마"
 thailand.253.d: "짜끄리 왕조는 2세기가 넘도록 시암과 태국을 통치했습니다. 군주제라는 제도는, 그것을 차지한 개인들을 어떻게 생각하든, 시민의 달력과 법 체계, 방콕의 지리, 상당수 국민의 정서적 구조 속에 엮여 있습니다. 당은 이를 어떻게 할지 결정해야 합니다.\n\n혁명의 목표에 대한 당의 헌신은 의심할 여지가 없습니다. 문제는 단절과 관리된 전환 중 어느 쪽이 그 목표에 더 이로우냐입니다."
 thailand.253.a: "군주제를 폐지한다. 인민 공화국에 그 자리는 없다."
 thailand.253.b: "당이 통치하는 동안 입헌적 허수아비를 유지한다."
 thailand_news.14.t: "내려오는 죽의 장막"
 thailand_news.14.d: "태국은 라오스와 베트남과의 연대를 지역 연대 체제로 공식화했으며, 분석가들은 이미 이를 '죽의 장막'이라 부르고 있습니다. 폴 포트의 캄보디아 이후 처음으로 동남아시아의 한 정부가 공산 진영 지향을 선언했습니다. 서방 수도들은 계산을 다시 하고 있습니다. 베이징은 환영합니다. 태국 바트는 하룻밤 사이에 새 통화로 대체되었습니다."
 thailand_news.14.a: "동남아시아의 지도가 바뀌었다."
 thailand_news.31.t: "도시를 포위한 농촌"
 thailand_news.31.d: "방콕이 죽은 전쟁의 잔재로 치부해 온 수년간의 반란 끝에 태국 공산당이 공개적인 인민 전쟁을 선언했습니다. 북부 고지대와 이산 고원 전역의 근거지는 이제 보안군의 손이 닿지 않으며, 국가가 오래전 봉사를 중단한 마을들에서 신병이 쏟아져 들어오고 있습니다. 운동이 끝났다고 보았던 군사 분석가들은 조용히 평가를 수정하고 있습니다."
 thailand_news.31.a: "이제 산악 지대는 그들의 것이다."
 thailand_news.32.t: "용의 항적에 합류한 태국"
 thailand_news.32.d: "방콕은 베이징과 포괄적 동반자 관계를 체결했습니다. 투자, 무역 접근, 그리고 혁명 태국을 중국의 궤도 안에 확고히 두는 안보 양해가 따라옵니다. 국영 언론은 이를 두 사회주의 이웃 나라의 자연스러운 정렬이라 부릅니다. 서방 외교관들은 위성이 태양을 얻은 것이라 말합니다. 방콕 위로 솟아오르는 건설용 크레인을 보면 돈만은 진짜인 듯합니다."
 thailand_news.32.a: "궤도는 정해졌다."
 thailand_news.33.t: "세 강의 연방"
 thailand_news.33.d: "태국, 라오스, 베트남, 캄보디아는 방콕을 산업과 외교의 심장으로 하는 인도차이나 사회주의 연방의 틀을 발표했습니다. 처음으로 메콩 혁명들이 한목소리를 내고 있으며, 그 목소리는 열강이 무시하지 못하고 답해야 할 만큼 큽니다. 자존심 센 네 수도가 하나의 사업을 공유할 수 있을지는 열린 질문으로 남아 있습니다."
 thailand_news.33.a: "인도차이나가 하나로 말한다."
 thailand.260.t: "레드셔츠의 라차쁘라송 점령"
 thailand.260.d: "농촌의 표가 방콕에 도착했습니다. 수만 명의 레드셔츠가 수도의 상업 중심지인 라차쁘라송 교차로를 점거하고 뾰족한 대나무와 쌓아 올린 타이어로 바리케이드를 쳤습니다. 쇼핑몰은 문을 닫았고, 교통은 멈췄으며, 운동은 정부가 선거를 공표할 때까지 머물겠다고 말합니다. 군은 명령을 기다리고 있습니다."
 thailand.260.a: "머물게 둔다. 도시는 점거된 교차로 하나쯤은 견딜 수 있다."
 thailand.260.b: "교차로를 정리한다. 수도를 무기한 닫아 둘 수는 없다."
 thailand.270.t: "킹메이커"
 thailand.270.d: "아누틴 찬위라꾼의 정당이 새 의회에서 결정적인 블록을 쥐고 있습니다. 연립 참여에 대한 그의 요구는 무리하지 않습니다. 부처 몇 개, 농촌 개발 지출에 대한 약속, 그리고 아주 특정한 정책 공약 하나입니다. 그러나 연립은 언제나 처음 제안이 시사하는 것보다 더 많은 비용이 듭니다."
 thailand.270.a: "연립을 구성한다. 집권 과반은 그 값어치가 있다."
 thailand.270.b: "거절한다. 그들 없이 통치하거나, 아예 통치하지 않거나."
 thailand.271.t: "부처 중의 부처"
 thailand.271.d: "내각 수준의 협상이 마무리되었습니다. 품짜이타이는 보건부, 농업부, 부총리직을 받습니다. 서류에 서명이 이루어졌고 연립은 공식화되었으며, 즉시 맞교환 흥정이 시작됩니다."
 thailand.271.a: "연립은 유지된다. 지금은."
 thailand.272.t: "폐지 운동"
 thailand.272.d: "연립 내 보수 인사들과 그 밖의 왕당파 계열 시민 사회 단체들이 대마 비범죄화법에 대한 공식 폐지 운동을 벌이고 있습니다. 이들은 의회 토론을 강제할 만큼의 서명을 모았습니다. 정부가 정책을 지키기 위해 싸울지, 정치적 평화와 맞바꿀지가 문제입니다."
 thailand.272.a: "법을 폐지한다. 안정은 그린 러시보다 값지다."
 thailand.272.b: "굳건히 버틴다. 정책은 유지된다. 법원으로 가져가게 두라."
 thailand.273.t: "방콕의 제안"
 thailand.273.d: "태국이 샨족에게 손을 내밉니다. 왕국과 정렬하는 샨주를 위해 승인, 무기, 실질적인 국고가 테이블에 올라와 있습니다. 자치는 실질적일 것입니다. 그에 따르는 의존도 마찬가지이며, 네피도는 이 선택을 용서하지 않을 것입니다."
 thailand.273.a: "방콕의 보호를 받아들인다."
 thailand.273.b: "우리 힘으로 서겠다."
 thailand.280.t: "도로 위의 퍼스트 윈"
 thailand.280.d: "차이세리 금속·고무의 퍼스트 윈 4x4는 연합 전역에서 구매자를 찾았습니다. 인도네시아 해병 보병, 필리핀 경찰군, 말레이 국경 연대입니다. 첫 물량이 선적되었습니다. 수출 대리인의 수수료는 평판이라는 배당금보다 작습니다. 이제 동남아시아는 태국이 살 만한 물건을 만든다는 것을 알게 되었습니다."
 thailand.280.a: "계약에 서명한다. 아세안 시장은 우리 것이다."
 thailand.281.t: "사타힙에서 훈련하는 해병대"
 thailand.281.d: "태국 왕립 해병대의 10년 만의 첫 상륙 전담 훈련으로 대대 하나가 사타힙 해군 기지의 해안 돌격 코스를 통과합니다. 새 교리가 작성되었고, 조선소 확장 자금이 마련되었으며, 해병대 사령관은 예산에 대해 사과하기를 멈추고 다음 훈련을 계획하기 시작했습니다."
 thailand.281.a: "바다로부터."
 thailand_news.15.t: "태국, 아세안의 신흥 병기창"
 thailand_news.15.d: "이번 분기 방콕에서 체결된 일련의 방위 수출 계약은 지역 분석가들이 동남아시아 방위 시장에서 태국의 위치를 재고하게 만들었습니다. 퍼스트 윈 MRAP은 필리핀과 인도네시아의 보유 장비에 들어가 있고, 태국에서 제조한 포탄 신관은 말레이시아의 비축고에 들어 있습니다. 태국 왕립 병기창은 더 이상 국내 조달 계획이 아닙니다. 지역 공급업체입니다."
 thailand_news.15.a: "왕국의 공장들이 일하고 있다."
 thailand_news.16.t: "방콕의 다영역 작전 교리 발표"
 thailand_news.16.d: "태국 왕립 군 최고사령부는 사이버, 전자전, 무인기 타격, 재래식 지상 기동을 하나의 통합 작전 체계로 아우르는 태국 최초의 공식 다영역 작전 교리를 발표했습니다. 미국 및 오스트레일리아 파트너들과의 합동 훈련으로 개발된 MDO 교리는 태국이 더 이상 전쟁을 단일 영역의 경쟁으로 보지 않음을 알립니다."
 thailand_news.16.a: "왕국은 모든 전선에서 싸운다."
 thailand.310.t: "임계에 도달한 원자로"
 thailand.310.d: "새벽 3시 47분, 제어실 계기판이 영점을 넘어 올라갑니다. 태국 최초의 가압수형 원자로가 임계에 도달했습니다. 수석 기술자는 이를 기술적 이정표라 부르고, 내각은 에너지 안보라 부릅니다. 둘 다 옳습니다. 아침이면 전국 전력망의 모습이 달라져 있을 것입니다."
 thailand.310.a: "기저 전력의 새 시대."
 thailand.311.t: "프놈펜의 응답"
 thailand.311.d: "캄보디아 외무부가 방콕의 접근에 대해, 예상보다 공식적이고 우려한 것보다 따뜻하게 답했습니다. 프놈펜 정부의 계산은 분명합니다. 태국과의 긴밀한 관계는 베이징에 대한 과도한 의존을 막는 방어막이자, 지역에서 가장 빠르게 성장하는 경제가 제공할 수 있는 수입원입니다."
 thailand.311.a: "동반자 관계를 환영한다."
 thailand.311.b: "신중하게 접근한다. 진전에는 시간이 걸린다."
 thailand.312.t: "자카르타 대화"
 thailand.312.d: "인도네시아 대표단이 공동 성명 초안도 없이 도착합니다. 자카르타는 방콕이 무엇을 의도하는지 알고 싶어 합니다. 지역 대등국 간의 진정한 동반자 관계입니까, 아니면 인도네시아가 오래도록 자기 몫이라 여겨 온 아세안 주도권을 둘러싼 경쟁입니까? 두 선택지가 모두 테이블 위에 있습니다. 어느 쪽도 값싸지 않습니다."
 thailand.312.a: "동반자 관계. 합동 훈련, 공유 교리, 상호 이익."
 thailand.312.b: "경쟁. 자카르타의 앞마당에서 영향력으로 앞서겠다."
 thailand.313.t: "중국 계약 서류"
 thailand.313.d: "재무부의 평가는 명확합니다. 일대일로 틀 아래 체결된 기반시설 계약은 태국에 필요했던 도로와 철도를 제공했지만, 금융 조건은 베이징의 영향력을 한 세대 동안 사업 파이프라인에 박아 넣었습니다. 내각 앞에 놓인 문제는 중국 자본을 계속 끌어다 쓸 것인지, 재협상의 단기적 고통을 감수할 것인지입니다."
 thailand.313.a: "자금 조달을 유지한다. 사업은 성과를 낸다."
 thailand.313.b: "재협상한다. 주권에는 돈이 든다."
 thailand.314.t: "워싱턴의 검토 요청"
 thailand.314.d: "미국 태평양 사령부가 양자 안보 검토를 공식 요청했습니다. 실상은 태국의 조약상 정렬을 심화하고, 훈련 패키지를 받아들이며, 미국의 가장 믿음직한 동남아시아 파트너가 되는 데 따르는 정치적 가시성을 수용하라는 초대입니다. 대안은 양다리 외교를 유지하는 것입니다."
 thailand.314.a: "동맹을 심화한다. 훈련과 공약을 받아들인다."
 thailand.314.b: "거리를 둔다. 양다리 외교가 태국에 더 이롭다."
 thailand_news.17.t: "태국의 첫 원자로 가동"
 thailand_news.17.d: "태국 왕실 정부는 태국 최초의 상업용 원자력 발전소를 전면 가동하여 동남아시아에서 최초로 민간 원자력 발전을 운영하는 국가가 되었습니다. 차청사오주에 위치한 600메가와트급 가압수형 원자로는 전국 전력 수요의 약 8퍼센트를 공급할 것입니다. 분석가들은 이 원자로의 이중적 효용을 지적합니다. 에너지 안보를 제공하는 동시에, 핵 능력이 중견국의 야망을 가르는 표지가 되어 가는 지역에서 새로운 기술적 위신의 축을 제공합니다."
 thailand_news.17.a: "왕국이 원자력 시대에 합류한다."
 thailand.315.t: "따무엔톰의 지뢰"
 thailand.315.d: "분쟁 중인 따무엔톰 사원 단지 인근에서 일어난 지뢰 폭발로 태국 왕립 육군 병사 세 명이 부상을 입었습니다. 양측은 서로 상대가 매설했다고 비난합니다. 이 사건은 방콕과 프놈펜에서 민족주의 시위를 촉발했습니다."
 thailand.315.a: "해명을 요구하고 민족주의 정서를 동원한다."
 thailand.315.b: "아세안 중재를 요청하고 외교관들이 앞장서게 한다."
 thailand.316.t: "따무엔톰에서의 총격"
 thailand.316.d: "분쟁 국경을 따라 소규모 교전이 발생했습니다. 양국 정부는 자국 군부와 민족주의 운동의 압박을 받고 있습니다. 아세안 사무총장은 자제를 촉구하는 성명을 발표했습니다."
 thailand.316.a: "우위를 밀어붙인다."
 thailand.316.b: "아세안 휴전을 받아들인다."
 thailand.317.t: "7월 전쟁, 전면적 군사 충돌"
 thailand.317.d: "태국군과 캄보디아군이 따무엔톰과 쁘레아 위히아 인근에서 일주일간 국경 교전을 벌였습니다. 포격전으로 양측에 사상자가 발생했습니다. 아세안은 긴급 정상회의를 소집했습니다."
 thailand.317.a: "힘을 과시한 뒤 아세안 휴전을 받아들인다."
 thailand.317.b: "참호를 파고 얻은 것을 지킨다."
 thailand.318.t: "국경에서 재점화되는 긴장"
 thailand.318.d: "휴전 합의에도 불구하고 분쟁 국경을 따라 충돌이 재개되었습니다. 12월의 재발은 두 나라가 합의를 지킬 수 있는지, 아니면 공개적 분쟁으로 되돌아갈지를 시험합니다."
 thailand.318.a: "휴전을 재확인한다."
 thailand.318.b: "적대 행위를 재개한다."
 thailand.319.t: "F-35에 대한 워싱턴의 거절"
 thailand.319.d: "미국은 기술 이전 제한과 태국의 대중국 관계에 대한 우려를 이유로 F-35 라이트닝 II 전투기에 대한 태국의 공식 요청을 거절했습니다."
 thailand.319.a: "그리펜 E/F 계획을 추진한다."
 thailand.319.b: "대신 F-16V 블록 70을 받아들인다."
 thailand.319.c: "J-10CE로 선회한다. 베이징이 공급할 것이다."
 thailand.320.t: "법원에 의한 패통탄 해임"
 thailand.320.d: "태국 헌법재판소는 독립 기관을 훼손한 것으로 보이는 통화 내용이 유출된 것과 관련하여 패통탄 친나왓 총리를 해임했습니다. 품짜이타이의 아누틴 찬위라꾼이 임시 총리로 지명됩니다."
 thailand.320.a: "판결을 받아들인다."
 thailand.320.b: "판결에 이의를 제기한다."
 thailand.321.t: "키를 잡은 아누틴"
 thailand.321.d: "아누틴 찬위라꾼은 국민당의 신임 및 예산 지원 아래 임시 정부를 이끕니다. 그는 4개월 안에 새 선거를 치르겠다고 약속했습니다."
 thailand.321.a: "임시 정부가 업무를 시작한다."
 thailand.322.t: "2026년 2월 태국 총선"
 thailand.322.d: "태국인들은 앞으로 4년간 나라의 정치적 방향을 결정할 총선에서 투표합니다. 국경 전쟁은 민족주의 정서를 품짜이타이 쪽으로 몰았습니다. 국민당은 도시 지역 여론조사에서 앞서 있습니다."
 thailand.322.a: "품짜이타이가 승리하고 아누틴의 위임이 확인된다."
 thailand.322.b: "국민당 연립이 집권한다."
 thailand_news.18.t: "아세안이 중재한 태국-캄보디아 휴전"
 thailand_news.18.d: "동남아시아 국가 연합은 태국과 캄보디아 사이의 휴전 합의를 성공적으로 중재하여 따무엔톰 사원 단지 인근에서 몇 주간 이어진 국경 교전을 끝냈습니다. 아세안 사무총장은 이 결과를 지역 기구가 양자 간 화약고를 공개적 전쟁으로 번지기 전에 억제할 수 있다는 증거라며 환영했습니다."
 thailand_news.18.a: "지역은 버틴다. 지금은."
 thailand_news.19.t: "태국 선거를 석권한 아누틴의 정당"
 thailand_news.19.d: "품짜이타이당이 2026년 2월 태국 총선에서 193석을 확보하여 아누틴 찬위라꾼에게 압도적인 권한을 안겨 주었으며, 수개월간 이어진 과도 정부의 불확실성도 끝났습니다. 이번 결과는 태국의 보수적 포퓰리즘 정치 중심을 공고히 하고 4년 임기를 온전히 수행할 수 있는 기반을 마련합니다."
 thailand_news.19.a: "왕국을 위한 새로운 권한."
 thailand.330.t: "장교단의 영혼"
 thailand.330.d: "참모본부 안에서 조용한 논쟁이 이어지고 있습니다. 한쪽은 유능한 기술 전문가로 이루어진 직업적이고 비정치적인 군대를 원합니다. 다른 쪽은 국가의 자부심이자 검인 찬란한 무인 계층을 원합니다. 왕국이 지금 내리는 선택이 한 세대 동안 장교단의 모습을 결정할 것입니다."
 thailand.330.a: "전문 장교단을 육성한다."
 thailand.330.b: "무인의 위신을 키운다."
 thailand.334.t: "잠수함 취역"
 thailand.334.d: "엔진 논란이 있은 지 수년 만에, 첫 번째 S26T 잠수함이 마침내 타이 왕립 해군에 취역합니다. 승조원들은 이날을 위해 열심히 훈련해 왔습니다. 조달 과정의 정치적 논란과 관계없이, 태국은 이제 현대적인 잠수함을 운용하게 되었으며 지역 균형은 남쪽으로 조금 기울게 됩니다."
 thailand.334.a: "함대가 바다로 나아간다."
 thailand_news.26.t: "방콕 상공의 그리펜"
 thailand_news.26.d: "타이 왕립 공군이 첫 JAS 39 그리펜 다목적 전투기를 인도받았으며, 이를 기념하여 수도 상공에서 편대 비행을 선보였습니다. 스웨덴제 전투기는 태국에 진정한 4세대 공중전 능력과 현대적 데이터링크 공중전의 발판을 제공합니다."
 thailand_news.26.a: "왕국의 하늘이 지켜지고 있다."
 thailand_news.27.t: "세계 시장에 진출한 태국 무기"
 thailand_news.27.d: "태국의 새 방위 수출청이 첫 해외 계약 물량을 발표했습니다. 장갑차량, 야포, 탄약이 동남아시아와 그 너머의 구매국으로 향합니다. 한때 예산 항목에 불과했던 왕국의 방위 산업이 수출로 수익을 올리는 산업으로 거듭나고 있습니다."
 thailand_news.27.a: "태국에서 만들어 세계에 판매한다."
 thailand_news.28.t: "전 국민 무장"
 thailand_news.28.d: "방콕이 총력 방위 계획을 공개했습니다. 예비대 확대, 모든 주에서의 민방위 훈련, 그리고 사회 전체를 최후의 저항선으로 보는 교리가 포함됩니다. 비판자들은 군사화라고 부르지만 정부는 신중한 대비라고 말합니다."
 thailand_news.28.a: "온 국민이 준비되어 있다."
 SIA_expansionism_threat: "태국의 팽창주의"
 thailand.380.t: "지협의 기술자들"
 thailand.380.d: "타당성 조사 위원회의 결론이 나왔습니다. 굴착은 어렵지만 가능합니다. 남은 질문은 한 세기 동안 이 사업을 좌절시켜 온 문제, 곧 누가 비용을 부담하느냐입니다. 자체 자금 조달이라는 선택지와 함께 세 건의 외국 제안이 내각 탁자 위에 놓여 있습니다. 각 제안에는 바트화로만 환산할 수 없는 대가가 따릅니다."
 thailand.380.a: "베이징의 일대일로 자금을 받아들인다. 저렴하고 빠르며, 조건은 나중에 고민하면 된다."
 thailand.380.b: "일본을 택한다. 느리고 비싸지만 오래 가며 숨은 조항도 없다."
 thailand.380.c: "국제 컨소시엄을 끌어들인다. 단계적이고 분담되며 어느 한 강대국에도 얽매이지 않는다."
 thailand.380.e: "우리 손으로 건설한다. 운하는 말뚝 하나까지 태국의 것이 될 것이다."
 thailand.381.t: "첫 삽을 뜬 착공"
 thailand.381.d: "물막이 둑이 가라앉고 첫 굴착토가 퍼 올려지면서 크라 지협의 대규모 굴착이 본격적으로 시작되었습니다. 공사는 단계별로 진행되며, 각 단계는 국고의 배짱을 새로이 시험하게 될 것입니다."
 thailand.381.a: "굴착을 시작하라."
 thailand.382.t: "한 단계 완료"
 thailand.382.d: "운하의 또 다른 단계가 완료되어 기술자들의 승인을 받았습니다. 굴착은 더 깊어졌고 공사는 한층 진척되었으며, 내각은 다음 청구서가 도착하기 전에 잠시 조심스러운 자부심을 느낍니다."
 thailand.382.a: "다음 단계로."
 thailand.383.t: "비용 초과"
 thailand.383.d: "최근 단계가 예산을 크게 초과했습니다. 단단한 암반, 침수된 갱도, 그리고 시공사의 수정된 견적으로 인해 사업 사무소가 내각에 결정을 요청하고 있습니다. 자금을 마련하거나, 운하가 약속보다 늦게 개통될 것을 받아들여야 합니다."
 thailand.383.a: "자금을 쏟아붓고 일정을 지킨다."
 thailand.383.b: "지연을 받아들인다. 국고가 우선이다."
 thailand.384.t: "운하 완공"
 thailand.384.d: "마지막 수문이 설치되고 정상부 수로에 물이 채워졌으며, 도선사들이 평형수만 실은 채 첫 통항을 마쳤습니다. 크라 운하는 개통식만 남겨둔 채 사실상 완공되었습니다. 왕국은 이제 이 초대형 사업의 완료를 선언할 수 있습니다."
 thailand.384.a: "테이프를 끊고 운하를 개통한다."
 thailand.385.t: "굴착 현장의 파괴 공작"
 thailand.385.d: "양수장 폭발과 끊어진 운반 도로는 남부 심층 지역 반군의 소행임을 보여 줍니다. 운하는 분쟁 지역을 가로지르며, 방콕에 맞서는 이들은 신문 헤드라인을 장식할 만한 표적을 찾았습니다. 사업 사무소가 결정을 요청하고 있습니다. 공사를 요새화하거나, 현지 주민과 대화해야 합니다."
 thailand.385.a: "운하 회랑의 경비를 강화한다."
 thailand.385.b: "현지 지도자들과 협상한다. 경비병만이 아니라 평화를 산다."
 thailand.386.t: "베이징의 대출 회수"
 thailand.386.d: "비용 초과로 일대일로 협정의 특약 조항이 발동되었고, 베이징의 협상단이 모두 중국에 유리한 선택지를 담은 서류철을 들고 방콕에 도착했습니다. 위안화 표시 부채는 지렛대가 되었고 운하 자체가 담보입니다. 내각은 이 요구에 어떻게 응답할지 선택해야 합니다."
 thailand.386.a: "운영 임대를 양보하고 베이징이 통행료의 일부를 가져가게 한다."
 thailand.386.b: "가혹한 조건으로 재조정한다. 빚을 갚고 운하를 태국의 것으로 지킨다."
 thailand.386.c: "채무를 불이행한다. 운하는 우리 것이니 시장이 어떻게 하든 내버려 둔다."
 thailand.388.t: "자본 도피"
 thailand.388.d: "채무 불이행으로 시장이 공포에 빠졌습니다. 외국인 투자자들이 빠져나가고 바트화는 하락하고 있으며, 중앙은행은 공황을 늦추기 위해 외환 보유고를 쏟아붓고 있습니다. 피해는 심각하지만, 소신을 지킨 주권 국가라면 시간이 지나면 이를 이겨낼 것입니다."
 thailand.388.a: "폭풍을 견뎌 낸다."
 thailand.389.t: "워싱턴과 뉴델리의 주시"
 thailand.389.d: "크라 지협에 대한 중국의 운영 임대는 워싱턴에서 뉴델리에 이르기까지 경종을 울렸습니다. 두 수도 모두 베이징의 손에 들어간 병목 지점을 우려하고 있으며, 방콕이 자신들을 안심시킬지 아니면 더욱 동쪽으로 기울지 지켜보고 있습니다."
 thailand.389.a: "양측을 안심시키고 정치적 자본을 써서 우리 편으로 붙들어 둔다."
 thailand.389.b: "베이징에 기댄다. 동반자 관계는 정해졌으니 서방이 적응하게 하라."
 thailand.390.t: "독점을 잃은 해협"
 thailand.390.d: "첫 만재 유조선들이 크라 운하를 통과하고 있으며, 말라카 해협의 대형 항구들은 그 대가를 치르고 있습니다. 옛 병목 지점 위에 부를 쌓아 올린 싱가포르와 쿠알라룸푸르는 통과 수입이 북쪽으로 빠져나가는 것을 지켜보고 있으며, 이를 빼앗아 간 왕국을 쉽게 용서하지 않을 것입니다."
 thailand.390.a: "이제 두 대양이 방콕에 응답한다."
 thailand.391.t: "어떤 운하인가?"
 thailand.391.d: "운하는 개통되었지만, 무엇이 되어야 할까요? 해군이 무력으로 장악하고 경쟁국에는 닫혀 있으며 포대가 늘어선 요새일까요? 아니면 모든 깃발에 열려 있고 조약으로 보장되는 중립적인 국제 수로일까요? 이 선택이 한 세대 동안 해양 강국들 사이에서 태국의 위상을 규정할 것입니다."
 thailand.391.a: "크라 운하를 요새화하여 방어하고 접근을 차단한다."
 thailand.391.b: "통행료를 내는 모든 이에게 평화롭게 크라 운하를 개방한다."
 thailand_news.20.t: "두 대양, 하나의 왕국"
 thailand_news.20.d: "수년간의 노동과 수십억 바트, 어떤 기술자도 예견하지 못했던 지정학을 거쳐 크라 운하가 개통되었습니다. 역사상 처음으로 선박이 말레이 반도를 돌지 않고 안다만해와 타이만 사이를 오갑니다. 아시아 무역의 지도가 다시 그려졌으며, 붓은 방콕이 쥐고 있습니다."
 thailand_news.20.a: "한 세기를 기다려 온 운하."
 thailand.393.t: "지역의 천덕꾸러기"
 thailand.393.d: "가면이 벗겨졌습니다. 이웃 나라들을 굴복시키려는 방콕의 야욕은 ASEAN 지도국이라는 모든 허울을 벗겨 냈습니다. 동남아시아 각국의 수도는 움츠러들었고, 더 넓은 세계는 계산을 다시 하고 있습니다. 태국은 더 이상 지역의 의장국이 아니라 지역의 위협이며, 외교적·경제적 장벽이 이미 세워지고 있습니다."
 thailand.393.a: "우리를 두려워하게 하라. 제국은 친구들로 이룬 적이 없다."
 thailand.394.t: "워싱턴의 방콕 규탄"
 thailand.394.d: "미국이 동남아시아에서의 태국의 침략을 강하게 규탄했습니다. 워싱턴은 위협받는 지역 국가들과 함께하겠다는 뜻을 밝히며, 보장 조치를 검토하고 동맹국들에 패권을 노리는 자에 맞서 결속할 것을 촉구하고 있습니다. 방콕이 한때 구애했던 미국의 영향력이 빠져나가고 있습니다."
 thailand.394.a: "미국의 반대는 우리의 진군을 막지 못할 것이다."
 thailand.395.t: "베이징의 열린 손"
 thailand.395.d: "워싱턴이 물러서는 곳에서 베이징은 다가옵니다. 중국은 고립되고 공격적인 태국에서 쓸모 있는 동반자를 봅니다. 서방과 지역 모두와의 다리를 불태워 더 이상 갈 곳이 없어진 강국이기 때문입니다. 방콕의 천덕꾸러기 처지는 베이징에게 기회이며, 그 열린 손에는 왕국이 더 이상 거절할 여유가 없는 조건이 달려 있습니다."
 thailand.395.a: "동방이 우리를 받아 준다면 그렇게 하겠다."
 thailand.431.t: "방콕의 초청"
 thailand.431.d: "태국이 동남아시아 조약 기구 가입을 위한 공식 초청을 보내왔습니다. 이 협정은 공동 지휘, 상호 안보, 그리고 방콕의 지도 아래 단일한 지역적 목소리를 제공합니다. 그러나 ASEAN은 언제나 자국의 독립을 지켜 왔으며, 우리의 운명을 태국에 묶는 것은 작은 걸음이 아닙니다. 선택은 자유롭게 우리가 내리며, 더 이상 도움이 되지 않는다면 거둘 수도 있습니다."
 thailand.431.a: "수락한다. 안보는 함께할 때 더 강하다."
 thailand.431.b: "거절한다. 우리의 독립은 거래 대상이 아니다."
 thailand.425.t: "[FROM.GetNameDefCap]의 조약 서명"
 thailand.425.d: "[FROM.GetNameDefCap]의 답변은 수락입니다. 대표단이 서명을 위해 방콕으로 향하고 있으며, 동남아시아 조약 기구는 새 회원국을 얻게 됩니다. 서명이 하나 늘 때마다 다음 서명은 더 쉽게 얻을 수 있습니다."
 thailand.425.a: "회의 탁자에 또 하나의 자리."
 thailand.426.t: "초청을 거절한 [FROM.GetNameDefCap]"
 thailand.426.d: "[FROM.GetNameDefCap]은(는) 우리의 제안에 감사를 표했으나 이를 거절했습니다. 어조는 따뜻하지만 답은 거절입니다. 이런 종류의 협정은 누구에게도 강요할 수 없으며, 문은 계속 열려 있습니다."
 thailand.426.a: "그들의 선택이다. 제안은 유효하다."
 SIA_kra_fortress_threat: "크라 운하 요새화"
 SIA_kra_default_threat: "태국의 국가 채무 불이행"
 SIA_kra_chokepoint_threat: "크라 병목 지점"
 SIA_asean_hegemon_threat: "태국의 ASEAN 패권 추구"
 thailand.410.t: "대왕국의 지도"
 thailand.410.d: "란나, 산 구릉지, 캄보디아와 라오스의 잃어버린 지방, 그리고 말레이 남부를 당연히 태국의 것으로 표시한 옛 지도들이 다시 꺼내졌습니다. 범타이 운동은 이제 내각 안에 목소리를 갖고 있으며, 이 질문을 분명히 던집니다. 왕국이 수복 대상 영토를 세계에 선포해야 할까요, 아니면 보다 부드러운 방식으로 같은 목적을 추구해야 할까요? 모든 강대국이 방콕의 대답을 지켜보고 있습니다."
 thailand.410.a: "선포한다. 이 땅은 태국의 것이며 세계가 알아야 한다."
 thailand.410.b: "조용히 진행한다. 칼을 흔들지 않고 입지를 구축한다."
 thailand.411.t: "한 민족, 하나의 운명"
 thailand.411.d: "범타이 사상은 더 이상 장교와 역사가들의 변두리 낭만이 아닙니다. 사남 루앙에는 집회 인파가 가득하고, 언론은 윈난에서 지협까지 뻗은 단일 타이 민족의 깃발을 보도합니다. 운동은 이제 공개적인 얼굴을 갖게 되었으며, 정부 또한 그것을 내세우기로 합니다."
 thailand.411.a: "민족이 자신의 이름을 듣게 하라."
 thailand.412.t: "바람에 흔들리는 대나무"
 thailand.412.d: "태국은 휘어질지언정 꺾이지 않습니다. 워싱턴과 베이징 사이에서 선택을 거부함으로써 방콕은 양쪽이 모두 구애하게 만들었으며, 이는 현대적 방식으로 되살린 옛 대나무 외교입니다. 두 수도 모두 따뜻한 신호를 보내며, 어느 쪽도 왕국을 상대편의 품으로 밀어 넣을 여유가 없습니다."
 thailand.412.a: "선택지를 열어 두고, 친구들이 짐작하지 못하게 한다."
 thailand.413.t: "핵연료 주기 문제"
 thailand.413.d: "태국의 새 원자로는 주권적 핵연료 주기로 가동되며, 주권적 핵연료 주기는 농축을 의미하고, 농축은 민간 발전과 무기 선택지 사이의 경계가 얇아짐을 의미합니다. IAEA는 강화된 안전조치를, 워싱턴은 확약을 원하며, 지역은 방콕의 의도를 알고 싶어 합니다. 공식적인 폭탄 계획은 없지만 능력은 이제 손이 닿는 거리에 있으며, 왕국은 그 방향으로 얼마나 나아갈지 결정해야 합니다."
 thailand.413.a: "맞선다. 주권적 농축은 우리의 권리이며, 대비책이든 아니든 상관없다."
 thailand.413.b: "안심시킨다. 전면적 안전조치를 받아들이고 신뢰를 지킨다."
 thailand.413.a_tooltip: "§R확산 경보.§! 태국은 §Y주권적 농축 반항§! 위협을 얻으며, 미국은 방콕에 크게 등을 돌리고 인도는 경계를 높이며, §R태국 내 미국 영향력이 15% 감소합니다§!."
 thailand.414.t: "수호자 헌장"
 thailand.414.d: "감시자들이 결코 잠들 필요가 없도록 헌법이 다시 쓰였습니다. 임명제 위원회, 유보된 권한, 병영에 책임을 지는 상원이 그 내용입니다. 심층 국가는 더 이상 비공식적 관행이 아니라 성문화된 보장이 되었습니다. 질서는 확보되었지만, 그 대가는 제약 없는 정치의 조용한 죽음으로 치러집니다."
 thailand.414.a: "안정, 영구적으로."
 SIA_guardianship_cost_tt: "국제 사회는 수호자 세력의 영구적 고착화에 반발합니다.\n - §R국고 -20§!\n - §R미국 및 영국과의 관계 악화§!"
 thailand.415.t: "팍스 아세아나"
 thailand.415.d: "마닐라에서 자카르타까지, 하노이에서 싱가포르까지, 동남아시아 각국의 수도가 방콕을 향해 잔을 듭니다. 한때 태국의 패권 시도를 두려워했던 그들은 이제 신뢰로 이끌고, 동의에 기초해 협정을 세우며, 약속한 평화를 지키는 왕국을 보증인으로 바라봅니다. 이것이 팍스 아세아나이며, 태국은 정복자가 아닌 동반자로서 그 정점에 서 있습니다."
 thailand.415.a: "평화로운 지역, 그리고 그 쐐기돌인 태국."
 thailand.416.t: "장군 이후"
 thailand.416.d: "장군에게는 총리직과 허니문 기간, 그리고 관리된 이행 과정이 아직 앞에 놓여 있습니다. 기득권층은 제도를 장악하고 당의 국가 기구 장악력을 조임으로써 더욱 뿌리를 내릴 수도 있고, 분위기를 읽고 성과를 제도화한 뒤 대중의 인내가 바닥나기 전에 보다 민간 친화적인 태도로 한발 물러설 수도 있습니다."
 thailand.416.a: "뿌리내린다. 기득권층이 장악력을 조인다."
 thailand.416.b: "제도화한다. 성과를 공고히 하고 얼굴을 부드럽게 한다."
 thailand.417.t: "시동을 거는 동부의 엔진"
 thailand.417.d: "동부 해안을 따라 크레인은 멈추지 않습니다. 새로운 철도, 새로운 활주로, 새로운 산업 단지가 들어섭니다. 동부 경제 회랑은 이륙 단계에 이르렀으며, 투자는 스스로 복리로 불어나기 시작하고 있습니다. 촌부리, 라용, 차층사오는 태국 경제의 기관실이 되어 가고 있습니다."
 thailand.417.a: "회랑이 활기를 띠기 시작한다."
 SIA_nuclear_defiance_threat: "주권적 농축 반항"
 SIA_tsunami_warning: "쓰나미 경보망"
 thailand.363.t: "생산성의 함정"
 thailand.363.d: "성장의 시대는 끝났습니다. 한 세대가 정체된 임금, 해외로 옮겨 간 공장 일자리, 결코 진입할 수 없는 부동산 시장이라는 침체된 경제로 대학을 떠났습니다. 이들은 태국 역사상 가장 많이 교육받은 세대이면서도 어디에도 갈 곳이 없고, 누구를 탓해야 하는지 정확히 알고 있습니다. 방콕의 교차로는 세 손가락 경례로 가득 차고, 해시태그는 경찰이 읽는 속도보다 빠르게 퍼집니다. 무브 포워드는 그들의 언어로 말합니다. 과거의 느긋하고 안락한 정치로는 그들을 붙잡을 수 없습니다."
 thailand.363.a: "체제를 연다. 개혁을 양보하고 새로운 정치가 숨 쉬게 한다."
 thailand.363.b: "질서가 먼저다. 거리를 정리하고 화제를 국가로 돌린다."
 thailand.363.c: "성장으로 시간을 번다. 경기 부양으로 선회하여 압박을 완화한다."
 thailand.364.t: "두 개의 태국"
 thailand.364.d: "왕국 안에는 두 개의 나라가 있습니다. 하나는 방콕과 지방 도시들, 졸업생들, 사무용 고층 건물, 그리고 개혁이 기정사실인 카페들입니다. 다른 하나는 쌀 생산 지대와 북동부로, 포퓰리스트들이 마을 기금과 쌀 보조금 위에 조직을 세우고 결코 놓지 않은 곳입니다. 그들은 서로 다른 것을 원하고, 서로 다른 미래를 두려워하며, 서로 다른 정당에 투표합니다. 정부는 어디에 깃발을 꽂을지 선택해야 하며, 그렇지 않으면 이 경계선 위에 설 수 있는 척해야 합니다."
 thailand.364.a: "수도와 졸업생들, 곧 태국의 도시적 미래를 공략한다."
 thailand.364.b: "성과를 내 주는 지방 기반인 쌀 생산 지대를 공략한다."
 thailand.364.c: "분열 위에 선다. 두 개의 태국을 하나로 묶는 것은 왕좌뿐이다."
 thailand.365.t: "탄압의 메아리"
 thailand.365.d: "거리를 정리했다고 불만이 사라지지는 않았습니다. 오히려 더 날카로워졌습니다. 흩어졌던 운동은 더 크고 더 분노한 채 재결집했으며, 지도자들은 이제 순교자가 되었고 요구는 이제 협상 불가능합니다. 시위였던 것이 한 세대의 결정적인 대의가 되어 가고 있으며, 작년에 휘두른 곤봉 하나하나가 올해 열 명을 더 끌어들였습니다."
 thailand.365.a: "되돌릴 수 없다. 폭풍을 견뎌 낸다."
 thailand.418.t: "술렁이는 정글"
 thailand.418.d: "고통은 너무 오래 이어졌습니다. 국가가 잊어버린 오지 지역에서 옛 이름들이 다시 떠오르고 있습니다. 사면 이전에 태국 공산당을 위해 소총을 들었던 간부들은 이제 백발이 되었으나 잊히지 않았고, 잃을 것이 없는 그들의 손자 세대가 함께합니다. 연구 모임은 등잔불 아래 열리고, 40년간 접어 두었던 붉은 깃발이 다시 펼쳐지고 있습니다. 지난 반란을 집어삼켰던 정글은 여전히 그곳에 있고, 그것을 채웠던 불만 또한 그대로입니다."
 thailand.418.a: "세포 조직이 결성되게 둔다. 농촌은 잃을 수도 있는 우리의 기반이다."
 thailand.418.b: "지하 조직을 분쇄한다. 확산되기 전에 간부들을 검거한다."
 thailand.418.c: "불만의 늪을 말린다. 지역에 자금을 쏟아붓는다."
 thailand.74.t: "자산 사건"
 thailand.74.d: "헌법재판소는 총리가 가정부, 운전기사, 경호원의 이름 뒤에 주식 보유분을 숨겼는지 판단하고 있습니다. 유죄 판결이 나오면 총리직은 시작도 하기 전에 끝납니다. 재판관들의 의견은 갈려 있으며, 궁정과 언론과 장군들 모두가 판결이 어떻게 내려지는지 지켜보고 있습니다."
 thailand.74.a: "재판부를 압박한다. 판결은 우리에게 유리하게 나올 것이다."
 thailand.74.b: "절차에 따르고 법원이 결정하게 한다."
 thailand.75.t: "딱바이"
 thailand.75.d: "무슬림이 사는 남부 심층 지역에서 군인들이 결박된 수백 명의 시위대를 군용 트럭에 겹쳐 싣습니다. 호송 차량이 도착할 무렵 85명이 사망했으며, 대부분 질식사였습니다. 영상은 전 세계로 퍼집니다. 장교단은 자기 사람들을 감싸며 결속하고, 문민 정부가 감히 무슨 일이 있었는지 물을 것인가가 문제로 남습니다."
 thailand.75.a: "군을 지지한다. 조사는 없다."
 thailand.75.b: "조사를 명령한다. 군은 우리에게 답해야 한다."
 thailand.76.t: "CTX 스캐너"
 thailand.76.d: "새 공항의 폭발물 탐지 스캐너 대금이 세 배로 불어났으며, 부풀려진 차액은 내각과 가까운 중간상인들의 사슬 속으로 사라졌습니다. 정직한 감사는 정부를 난처하게 만들 것입니다. 이를 덮으면 차액은 챙길 수 있지만, 국고를 가족 계좌처럼 다루는 행정부라는 이야기를 키우게 됩니다."
 thailand.76.a: "감사를 덮고 차액을 챙긴다."
 thailand.76.b: "계약을 취소하고 손실을 줄인다."
 thailand.77.t: "비판자들의 입막음"
 thailand.77.d: "한 언론 거물의 야간 방송이 반정부 거리 운동의 구심점이 되었고, 독립 방송사 iTV는 통제를 벗어나고 있습니다. 명예훼손 소송, 면허 압박, 우호적인 소유권 이전으로 이들을 길들일 수 있지만, 그 대가로 서서히 다가오는 일인 지배에 대해 비판자들이 하는 모든 말을 입증하는 셈이 됩니다."
 thailand.77.a: "언론을 길들인다."
 thailand.77.b: "언론이 자유롭게 하고 말에는 말로 답한다."
 thailand.78.t: "일인 의회"
 thailand.78.d: "집권당이 단독 과반을 차지했으며, 이는 태국 역사상 최초의 단일 정당 정부입니다. 관리할 연립이 없고 독립 기관들이 충성파로 채워진 상황에서 총리는 견제 없이 통치할 수 있습니다. 쌀 생산 지대에는 이것이 위임이지만, 방콕의 기득권층과 병영에는 선출된 독재의 시작입니다."
 thailand.78.a: "견제 없이 통치한다. 국민이 우리에게 이를 주었다."
 thailand.78.b: "야당을 끌어들이고 탁자를 나눈다."
 thailand.73.t: "친 코프 매각"
 thailand.73.d: "총리의 가족이 통신 제국을 싱가포르 국영 펀드에 약 730억 바트에 매각했으며, 편리한 구조조정을 통해 사땅 하나의 세금도 내지 않았습니다. 합법성은 흠잡을 데 없지만 겉모습은 파국적입니다. 며칠 만에 노란 셔츠 군중이 대로를 메우고, 군은 국가 자산을 면세로 판 사람에게 헌법이 여전히 구속력을 갖는지 공개적으로 묻기 시작합니다."
 thailand.73.a: "수십억을 챙긴다. 모두 합법이었다."
 thailand.73.b: "세금을 내고 분노를 가라앉힌다."
 thailand.420.t: "포퓰리스트의 위임"
 thailand.420.d: "권력이 포퓰리스트 진영으로 넘어갔습니다. 쌀 생산 지대와 도시 빈곤층은 다시 자신들의 정부를 갖게 되었고, 마을 기금, 저렴한 의료, 그들의 언어로 말하는 지도자라는 탁신주의 계획이 함께합니다. 옛 기득권의 정신은 더 이상 유지되지 않으며, 새 기구가 권력의 지렛대를 쥐면서 궁정 네트워크와 개혁 의원 모임은 녹아 사라집니다. 병영은 언제나처럼 지켜보고 있습니다."
 thailand.420.a: "농촌이 자신들의 정부를 갖게 되었다."
 thailand.421.t: "기득권층의 귀환"
 thailand.421.d: "권력의 지렛대가 왕당파 기득권층에게 넘어갔습니다. 투표를 통해서든, 궁정의 거래를 통해서든, 새벽의 전차를 통해서든 마찬가지입니다. 네트워크 군주제가 다시 자리를 잡습니다. 추밀원 고문관, 장군, 명문가들이 왕좌 주위로 결집합니다. 포퓰리스트 기구의 정신은 그 위임과 함께 해체되고, 개혁 운동은 탁자에서 쓸려 나갑니다. 왕국은 익숙한 손길 아래 안정을 되찾습니다."
 thailand.421.a: "왕국에 질서가 있다."
 thailand.422.t: "개혁의 물결"
 thailand.422.d: "새로운 세대가 권력을 잡았습니다. 거리에서 행진했던 개혁 운동이 이제 내각에 앉아 있으며, 의제는 징병제, 독점, 손댈 수 없던 기관들 등 옛 질서를 해체하는 쪽으로 향합니다. 이전 정부의 정신은 지도자들이 물러나면서 희미해집니다. 문제는 기득권층이 이 실험이 계속되도록 놔둘 것인가입니다."
 thailand.422.a: "미래는 지금이다."
 thailand.423.t: "법원의 결정"
 thailand.423.d: "헌법재판소가 집권당을 겨냥하고 있습니다. 해산 명령이 작성되었으며, 이전의 수많은 정부처럼 행정부가 사법적 명령으로 축출될 수 있습니다. 정부는 판결에 순응하여 권력을 경쟁자들에게 넘기거나, 재판부에 맞서 그 결과를 감수할 수 있습니다."
 thailand.423.a: "판결을 받아들이고 품위 있게 물러난다."
 thailand.423.b: "법원에 맞선다. 우리는 판사가 아니라 유권자에게 답한다."
 thailand.424.t: "민주당의 건재"
 thailand.424.d: "권력이 왕국에서 가장 오래된 정당인 민주당으로 돌아왔습니다. 투표함의 방향 전환 때문이든, 행정부를 야당에 넘긴 법원 때문이든 마찬가지입니다. 압승도, 카리스마 있는 억만장자도 없이, 폭넓은 민간 연립으로 통치하는 인내심 있고 화려하지 않은 일이 있을 뿐이며, 미래를 한 명의 지도자가 아닌 제도에 걸고 있습니다. 이전 정부의 정신은 그 위임과 함께 해체됩니다. 그리고 쌀 생산 지대에서는 탁신의 조직이 이미 다음 승부를 위해 힘을 모으고 있습니다."
 thailand.424.a: "기득권층이 방어선을 지킨다."
 thailand.430.t: "폭탄은 무엇을 위한 것인가?"
 thailand.430.d: "태국의 첫 핵탄두는 실재하지만, 선언되지 않은 무기는 누구도 억지하지 못합니다. 국가안전보장회의는 모든 핵보유국이 답해야 하는 질문을 정리해야 합니다. 어떤 상황에서 왕국이 그것을 사용하겠습니까? 우리가 선언하는 태세는 지역과 강대국들이 우리의 의도를 읽는 방식을 결정할 것입니다."
 thailand.430.a: "보복 전용. 전략 무기로 공격받을 때에만 타격한다."
 thailand.430.b: "전술 및 전략 보복. 어떤 핵 공격에도 같은 방식으로 응답한다."
 thailand.430.c: "선제 사용 선언. 적들이 궁금해하게 하고 두려워하게 하라."
 thailand_news.30.t: "태국의 핵 클럽 가입"
 thailand_news.30.d: "방콕은 정보기관들이 수개월간 소문으로 전해 온 사실을 확인했습니다. 태국 왕국은 핵무기를 보유하고 있습니다. 새로운 참가자가 문턱을 넘으면서 아시아 전역과 그 너머의 수도들이 세력 균형을 다시 계산하느라 분주합니다."
 thailand_news.30.a: "지도가 바뀌었다."
 SIA_threat_thai_bomb: "태국의 핵무기 계획"
 SIA_threat_thai_enrichment: "태국의 우라늄 농축 계획"
 SIA_threat_thai_first_use: "태국의 선제 사용 선언 태세"
 thailand.432.t: "기다려 주지 않는 전략"
 thailand.432.d: "공장 시대는 태국을 정체할 만큼 부유하게 만들었고, 각 부처는 탈출 계획을 두고 너무 오래 논쟁해 왔습니다. 변경은 기다려 주지 않으며, 베트남은 격차를 좁히고 있습니다. 국가 전략은 지금 채택되어야 합니다."
 thailand.432.a: "칙령으로 채택한다"
 thailand.432.b: "먼저 합의를 구축한다"
 thailand.433.t: "북방의 방패"
 thailand.433.d: "방콕이 베이징에 왕국에 대한 공식 보장을 제공해 달라고 요청했습니다. 중국의 서약은 태국의 대륙 쪽 기울기를 고정하고 국경을 시험하려는 경쟁국을 경고할 것입니다. 그 대가는 본토에서 멀리 떨어진 곳에서의 상시 약속입니다."
 thailand.433.a: "우리의 보호를 제공한다"
 thailand.433.b: "방콕은 홀로 설 수 있다"
 SIA_frontier_overextension_idea: "변경 과다 전개"
 SIA_frontier_overextension_idea_desc: "서부 국경 지대에 투입된 사단은 방콕을 지키지 않는 사단입니다. 타이 왕립 육군은 정부가 인정하고 싶어 하는 것보다 얇게 늘어나 있으며, 총성이 울리기도 전에 한 약속의 부담을 대중이 느끼고 있습니다."
 SIA_regional_pariah: "지역의 천덕꾸러기"
 SIA_regional_pariah_desc: "방콕은 미얀마 국경 지대를 통째로 삼켰습니다. 워싱턴과 베이징은 이 영토 강탈을 규탄하고, ASEAN 각국의 수도는 자국 국경을 불안하게 살피며, 태국 수출업자들은 해외의 모든 계약에서 왕국의 더럽혀진 이름의 대가를 치릅니다."
 SIA_frontier_partners: "변경 동반자"
 SIA_frontier_partners_desc: "수복한 국경 지대는 점령이 아닌 예속 세력과 협약을 통해 통치됩니다. 연성 권력은 주둔군보다 저렴합니다. 행정은 간소하게 운영되고 건설 인력은 자유롭게 움직이며, 병합이 가져왔을 외교적 반발은 전혀 없습니다."
 SIA_royal_guidance_idea: "왕실의 시선 아래"
 SIA_royal_guidance_idea_desc: "궁정의 연례 훈시는 왕국을 안정시키고 외세의 간섭으로부터 차단하지만, 왕좌에 순응하는 선출 정부는 자신의 권한이 일정 범위까지만 미친다는 것을 알게 됩니다."
 SIA_three_pillars_idea: "민족, 종교, 국왕"
 SIA_three_pillars_idea_desc: "왕좌와 상가(승단)에 결합된 관제 민족주의입니다. 불교도 다수는 전복 활동과 외래 사상에 대해 단단히 결속되지만, 그 대가로 대중의 정신은 더 단조롭고 더 순종적이 됩니다."
 SIA_deep_south_grievance: "남부의 불만"
 SIA_deep_south_grievance_desc: "말레이계 무슬림 지방에서 불교·왕당파 신조는 배제로 받아들여집니다. 파타니의 불만은 굳어지며, 방콕은 사태를 억누르기 위해 안정도와 정치적 자본으로 대가를 치릅니다."
 SIA_scarred_coast: "상처 입은 해안"
 SIA_scarred_coast_desc: "재건을 뒷받침할 국가 자금이 없어 안다만 해안의 리조트들은 수년간 반쯤 폐허로 남아 있습니다. 호텔은 텅 비었고 잔해는 치워지지 않았으며 관광객은 다른 곳으로 향합니다."
 SIA_new_reign_mourning: "애도에 잠긴 왕국"
 SIA_new_reign_mourning_desc: "국가가 선왕을 애도합니다. 공적 생활은 가라앉았고 오락은 중단되었으며, 정치는 불안한 휴전을 지키고 있습니다."
 SIA_ninth_reign_barami: "라마 9세 치세의 바라미"
 SIA_ninth_reign_barami_desc: "푸미폰 국왕은 반세기 넘게 재위하여 지구상 어느 군주보다 오래 통치했습니다. 그 수십 년에 걸쳐 쌓은 도덕적 권위인 바라미는 모든 정치인과 장군 위에 있습니다. 위기의 순간 궁정의 한마디가 어떤 내각도 해결하지 못하는 일을 매듭짓고, 왕좌는 왕국을 외세의 책략으로부터 지켜 줍니다."
 SIA_ninth_reign_zenith: "절정에 이른 네트워크 군주제"
 SIA_ninth_reign_zenith_desc: "궁정은 더 이상 단순히 군림하지 않습니다. 추밀원, 법원, 그리고 충성스러운 장교와 사업가들의 망을 통해 왕실은 국가의 모든 기관에 손길을 뻗습니다. 국왕의 말은 법의 무게를 지니며, 반대 의견은 발붙일 곳이 없고, 외세의 영향력은 왕당파 합의라는 벽에 부딪혀 부서집니다."
 SIA_tenth_reign_barami: "라마 10세 치세의 바라미"
 SIA_tenth_reign_barami_desc: "왕좌는 와치랄롱꼰 국왕에게 넘어갔지만, 존경은 상속되지 않습니다. 새 군주는 부왕이 맡았던 자리를 이어받았으나 그 자리를 채웠던 도덕적 권위는 없습니다. 궁정은 여전히 왕국을 안정시키고 외세의 간섭을 막지만, 모든 지렛대가 9세 치세의 희미한 메아리일 뿐입니다."
 SIA_two_thailands: "두 개의 태국"
 SIA_two_thailands_desc: "하나의 국경 안에 두 개의 나라가 있습니다. 방콕과 중부 평원은 부와 부처, 그리고 옛 기득권을 쥐고 있습니다. 농촌인 북부와 북동부는 표를 쥐고 있으며, 자신들의 투표가 법원과 쿠데타로 도둑맞는다는 확신이 굳어지고 있습니다. 둘 사이의 간극은 모든 선거를 양극화하고 국고가 감당하기 힘든 평화를 사도록 강요합니다."
 SIA_three_pillars_start: "민족, 종교, 국왕"
 SIA_three_pillars_start_desc: "$SIA_three_pillars_idea_desc$"
 SIA_populist_machine: "포퓰리즘 기구"
 SIA_populist_machine_desc: "마을 기금, 의료 카드, 채무 탕감. 정부의 정책 이행을 선거 충성도로 전환하는 정책 기구로, 선거 주기마다 되풀이됩니다."
 SIA_yellow_shirts_idea: "노란 셔츠"
 SIA_yellow_shirts_idea_desc: "민주주의 인민연합은 왕당파이고 도시적이며 중산층이고, 선거 다수가 매수되고 있다고 확신합니다. 이들이 거리를 메우면 정부는 흔들립니다."
 SIA_red_shirts_idea: "붉은 셔츠"
 SIA_red_shirts_idea_desc: "독재 반대 민주주의 연합전선은 농촌, 북부와 북동부 기반입니다. 그들은 출마한 모든 선거에서 이겼고 구성한 모든 정부를 잃었습니다. 그들은 다수이며, 스스로도 그것을 알고 있습니다."
 SIA_junta_government: "군정"
 SIA_junta_government_desc: "군사 위원회가 칙령으로 통치합니다. 질서는 강제되고, 반대 의견은 '조정'되며, 선거가 언제 돌아오느냐는 질문에는 미소와 연기로 대답합니다."
 SIA_guided_democracy: "2017년 체제"
 SIA_guided_democracy_desc: "임명제 상원, 구속력 있는 20년 전략, 그리고 믿을 만한 성향의 법원. 선거는 치러지지만 경기장에는 울타리가 쳐져 있습니다."
 SIA_network_monarchy_idea: "네트워크 군주제"
 SIA_network_monarchy_idea_desc: "궁정, 추밀원, 군, 사법부가 선거 정치 위에서 작동하는 비공식적 권위의 망을 이루며, 모든 정부보다 오래 살아남습니다."
 SIA_reform_momentum: "개혁의 추진력"
 SIA_reform_momentum_desc: "한 세대 만에 처음으로, 태국 정치의 에너지는 체제를 관리하는 이들이 아니라 체제를 바꾸려는 이들 편에 있습니다."
 SIA_consolidated_democracy_idea: "공고화된 민주주의"
 SIA_consolidated_democracy_idea_desc: "문민 통제, 입헌 정부, 그리고 쿠데타가 역사가 되었다고 기대하는 대중. 태국의 민주주의 제도는 마침내 스스로의 기반 위에 서게 되었습니다."
 SIA_republic_turmoil: "헌정 혼란"
 SIA_republic_turmoil_desc: "공화국 문제는 모든 기관과 모든 지방, 그리고 수많은 가정을 갈라놓았습니다. 국가는 존속하지만 그 밑바탕의 합의는 사라졌습니다."
 SIA_pan_thai_irredentism: "범타이 수복주의"
 SIA_pan_thai_irredentism_desc: "잃어버린 영토 서사가 다시 국가 교리가 되었습니다. 타이계 민족은 하나의 민족이며, 1893~1909년의 할양은 부당하고, 역사는 태국에 바로잡음을 빚지고 있다는 것입니다."
 SIA_drug_war_stain: "국제적 비난"
 SIA_drug_war_stain_desc: "마약 전쟁 중 발생한 수천 건의 초법적 살해가 모든 인권 포럼과 모든 외교 협상에서 태국을 따라다닙니다."
 SIA_tourism_powerhouse: "관광 강국"
 SIA_tourism_powerhouse_desc: "연간 수천만 명의 방문객이 관광을 경제의 한 축으로, 태국 브랜드를 세계적 자산으로 만듭니다."
 SIA_tourism_powerhouse_2: "관광 산업 정책"
 SIA_tourism_powerhouse_2_desc: "관광은 계절적 횡재에서 국가 정책이 관리하는 기둥으로 성장합니다. 다변화되고 소비가 큰 방문객층은 실질적인 법인세를 납부하며, 예전 어느 때보다 외국 여행 대기업에 덜 휘둘립니다."
 SIA_tourism_luxury_boom: "고급 여행 급증"
 SIA_tourism_luxury_boom_desc: "소비가 큰 방문객의 물결이 5성급 리조트를 채우며 수입을 끌어올리고 있습니다. 성수기가 지나면 급증세는 사라집니다."
 SIA_credit_boom_overheating: "신용 호황 과열"
 SIA_credit_boom_overheating_desc: "값싼 자금이 은행 체계가 흡수할 수 있는 것보다 빠르게 밀려들어 왔고, 차입자들은 이제 그 차이를 더 높은 금리로 치르고 있습니다. 순환이 식으면 압력은 완화됩니다."
 SIA_sustainable_extraction: "관리되는 자원"
 SIA_sustainable_extraction_desc: "허가는 느리게 진행되고 채굴권은 좁게 유지되지만, 국가는 땅에서 나오는 것으로 누가 이익을 얻는지에 대해 더 단단한 통제권을 쥐고 있으며, 다른 곳에서 더 빠른 채굴에 자금을 대는 외국 자본에 덜 휘둘립니다."
 SIA_digital_national_champions: "국가 디지털 대표 기업"
 SIA_digital_national_champions_desc: "국가가 선호하는 소수의 플랫폼이 의도적으로 시장을 지배합니다. 과세하기 쉽고 규제하기 간단하지만, 자신의 지위에 안주한 나머지 개선을 위한 노력을 멈춥니다."
 SIA_detroit_of_asia_idea: "아시아의 디트로이트"
 SIA_detroit_of_asia_idea_desc: "동부 해안은 전 세계를 위한 픽업트럭을 조립합니다. 자동차 공급망은 태국 제조업의 중심을 이루며 수출 장부를 건실하게 유지해 줍니다."
 SIA_bamboo_diplomacy: "대나무 외교"
 SIA_bamboo_diplomacy_desc: "바람에 휘되 결코 꺾이지 않는다. 방콕은 미국과의 동맹, 중국의 투자, 그리고 자신만의 판단을 동시에 유지합니다."
 SIA_war_on_drugs_campaign: "마약과의 전쟁"
 SIA_war_on_drugs_campaign_desc: "블랙리스트, 할당량, 그리고 사살 허용의 모호함. 메스암페타민 거래는 후퇴하고 있으며, 법치도 함께 후퇴하고 있습니다."
 SIA_deep_south_insurgency_1: "남부 반란 (잠복)"
 SIA_deep_south_insurgency_1_desc: "파타니, 얄라, 나라티왓의 무장 분리주의 반란은 낮은 수준으로 잦아들었습니다. 사건은 산발적이며 왕국에 주는 부담은 가볍습니다. 강도는 §Y30§! 미만입니다."
 SIA_deep_south_insurgency_2: "남부 반란 (확대)"
 SIA_deep_south_insurgency_2_desc: "파타니, 얄라, 나라티왓의 무장 분리주의 반란이 확대되고 있습니다. 매주 발생하는 사건이 피해를 입히고, 남부에서 방콕의 권위는 눈에 띄게 도전받고 있습니다. 강도는 §Y30§!에서 §Y59§! 사이입니다."
 SIA_deep_south_insurgency_3: "남부 반란 (불타오름)"
 SIA_deep_south_insurgency_3_desc: "파타니, 얄라, 나라티왓의 무장 분리주의 반란이 공공연한 불길로 번졌습니다. 폭탄 테러와 매복이 일상이 되었고, 그 대가는 이제 군과 대중 모두에게 미칩니다. 강도는 §Y60§! 이상입니다."
 SIA_pacified_but_smoldering: "진압되었으나 불씨는 남음"
 SIA_pacified_but_smoldering_desc: "철권은 효과가 있었습니다. 군이 인정하는 유일한 척도로 보면 남부는 조용합니다. 하지만 한 세대가 통행금지와 검문소 아래에서 자랐고, 불만은 사라진 것이 아니라 지하로 숨어들었습니다. 이따금 사건이 여전히 불붙으며, 충원의 원천도 마르지 않았습니다."
 SIA_royal_pacification: "왕실의 평정"
 SIA_royal_pacification_desc: "왕실의 비호 아래 후원과 주둔으로 유지되는 관리되고 감시되는 평온입니다. 개발이 이루어지고, 지역 유력자들이 포섭되며, 남부에서 군주제의 정통성이 조용히 회복됩니다. 해결이 아니라 관리입니다."
 SIA_pattani_autonomy: "파타니 자치"
 SIA_pattani_autonomy_desc: "단일 국가 태국 안에서 선출된 지역 의회, 현지어 교육, 남부 수입의 일부를 남부에 보유하는 자치 특별 행정 구역입니다. 평화의 배당은 실재하며, 그 선례는 방콕의 중앙집권주의자들을 불안하게 합니다."
 SIA_limited_devolution: "제한적 분권"
 SIA_limited_devolution_desc: "자치 틀은 기득권층을 달래기 위해 희석되었습니다. 어느 정도의 지방 행정은 있지만 진정한 자치는 없습니다. 총성은 당분간 잦아들었으나, 이 합의는 남부와 중앙 모두를 불만스럽게 남겨 둡니다."
 SIA_hearts_minds_education_strain: "민심 확보 계획"
 SIA_hearts_minds_education_strain_desc: "세 개 지방에서의 접촉 활동은 안보 예산이 아닌 교육 예산으로 충당됩니다. 교육부가 1년 동안 그 비용을 부담합니다."
 SIA_southern_development_levy: "남부 개발 부과금"
 SIA_southern_development_levy_desc: "세 개 지방의 개발 추진은 민간 산업을 소비재 생산으로 전용시킵니다. 자금은 1년 동안 남쪽으로 흘러가고, 본토의 매대는 그 영향을 느낍니다."
 SIA_peoples_constitution: "국민 헌법"
 SIA_peoples_constitution_desc: "폭넓은 시민 참여로 작성된 새 기본법은 권리, 군에 대한 문민 감독, 독립 기관을 명문화하여 헌정 질서에 대한 대중의 신뢰를 회복합니다."
 SIA_worlds_rice_bowl: "세계의 쌀 그릇"
 SIA_worlds_rice_bowl_desc: "태국 홈말리와 자스민 쌀은 모든 대륙에서 프리미엄 가격을 받습니다. 농산물 수출 수입은 경상수지를 떠받치며, 수확철마다 방콕의 외교적 비중을 다시 세워 줍니다."
 SIA_bri_debt: "일대일로 부채 노출"
 SIA_bri_debt_desc: "일대일로 인프라 대출은 예산이 메울 수 없는 틈을 채워 주지만, 상환 조건은 베이징에서 작성됩니다. 태국의 재정 주권은 협정에 서명할 때마다 줄어듭니다."
 SIA_landslide_mandate: "국민의 위임"
 SIA_landslide_mandate_desc: "압승은 정부에 진정한 민의의 위임을 안겨 주었습니다. 정당 조직은 활기를 띠고 농촌 기반은 동원되었으며 야당은 수세에 몰렸지만, 장군들은 숫자를 매우 주의 깊게 지켜보고 있습니다."
 SIA_ceo_state: "CEO 국가"
 SIA_ceo_state_desc: "내각은 이사회가 되었고 부처는 지주회사가 되었습니다. 결정은 빠르게 움직이고 책임은 더 느리게 움직입니다. 견제와 균형이 사라진 것은 아니며, 단지 재구성되고 있을 뿐입니다."
 SIA_cult_of_the_ceo: "CEO 숭배"
 SIA_cult_of_the_ceo_desc: "총리는 자문이라는 연극을 생략했습니다. 그의 지지율은 무기이고, 비판자는 장애물이며, 당의 내부 절차는 이번 주에 그가 말하는 대로입니다. 왕실 네트워크는 평소보다 훨씬 자주 모임을 갖고 있습니다."
 SIA_dynasty_politics: "왕조 정치"
 SIA_dynasty_politics_desc: "친나왓이라는 이름은 이제 하나의 왕조이자 브랜드, 후원 네트워크, 그리고 후계 구상이 한 가문에 접혀 있는 것입니다. 당에 대한 충성과 가문에 대한 충성은 구분할 수 없게 되었습니다."
 SIA_institutionalized_party: "제도화된 정당"
 SIA_institutionalized_party_desc: "이 운동은 망명, 두 차례의 쿠데타, 세 번의 정당 해산을 견뎌 냈습니다. 어느 한 지도자보다 더 오래 지속되는 존재, 곧 모든 지방에 뿌리를 둔 진정한 정치 제도가 되었습니다."
 SIA_judicialization: "법정의 정치"
 SIA_judicialization_desc: "헌법재판소는 그 자체로 정치 행위자가 되었습니다. 모든 청원은 무기이고, 모든 판결은 한 파벌에게는 승리이자 다른 파벌에게는 상처입니다. 야당은 살아남기 위해 법을 공부합니다."
 SIA_isoc_network: "ISOC 네트워크"
 SIA_isoc_network_desc: "국내 보안 작전 사령부는 선출된 장관이 아닌 군에 보고하며 모든 지방에 걸쳐 있습니다. 이 정보망은 국가의 손길을 보이지 않게, 어디에나 존재하게, 그리고 놀랍도록 효과적으로 만듭니다."
 SIA_crown_property_idea: "왕실재산관리국"
 SIA_crown_property_idea_desc: "궁정의 상업 부문은 수천억 바트 규모의 토지, 은행, 보험 지분을 보유하고 있습니다. 절대 군주제는 끝났습니다. 경제 군주제는 매우 잘 지내고 있습니다."
 SIA_uncle_tu_honeymoon: "쁘라윳 허니문"
 SIA_uncle_tu_honeymoon_desc: "질서가 회복되고, PDRC가 거리에서 물러났으며, 20년 계획을 가진 정부가 들어섰습니다. 당분간은 안정에 대한 대중의 갈망이 새 총리에게 예외적인 수준의 관용을 줍니다."
 SIA_uncle_tu_fatigue: "쁘라윳 피로감"
 SIA_uncle_tu_fatigue_desc: "정치를 지루하게 만들겠다고 약속한 총리는 잘못된 방식으로 성공했습니다. 개혁 의제는 멈춰 섰고, 약속된 선거는 끝없이 미뤄지고 있으며, 젊은 태국인들은 '임시'가 정확히 언제 끝나기로 했었는지 묻기 시작했습니다."
 SIA_reform_spring: "개혁의 봄"
 SIA_reform_spring_desc: "시민의 에너지 물결이 개혁 운동에 밀려들었습니다. 새로운 얼굴, 새로운 요구, 그리고 나이 든 정치인들이 한 세대 동안 본 적 없는 거리의 분위기가 있습니다. 기득권층은 이를 주시하고 있으며, 늘 유쾌하게만 보는 것은 아닙니다."
 SIA_youthquake: "청년 지진"
 SIA_youthquake_desc: "대학 캠퍼스, 소셜 미디어 피드, 그리고 길모퉁이가 정치적 에너지로 들끓고 있습니다. 한 번도 투표해 본 적 없는 젊은 태국인들이 이제 출마하고, 정당 사무실에서 일하며, 온라인으로 모금하고 있습니다. 형성 중인 기술 관료들은 이전 어느 세대보다 높은 교육을 받았습니다."
 SIA_barracks_pushback: "병영의 반발"
 SIA_barracks_pushback_desc: "고위 장교들은 퇴역 중개인, 의미심장한 침묵, 가시 돋친 언론 브리핑을 통해 문민 개혁의 속도가 군의 제도적 인내심을 시험하고 있음을 분명히 했습니다. 군은 여전히 자체 인사, 예산, 기지 배치를 통제합니다."
 SIA_thai_republic: "태국 공화국"
 SIA_thai_republic_desc: "차크리 왕조의 입헌 군주제가 변모를 이루었습니다. 직선제 대통령, 완전한 주권을 가진 의회, 그리고 군의 거부권 없이 작성된 헌법이 있습니다. 변화는 피 없이 이루어지지 않았지만, 견뎌 냈습니다."
 SIA_mandate_recovery: "회복의 위임"
 SIA_mandate_recovery_desc: "정부는 경제 재건을 최우선 과제로 선언했습니다. 소비자 비용은 억제되고 건설 계획은 가속화됩니다. 생산적 투자에 쓰이는 모든 바트는 향후 2년간 정부의 전적인 지원을 받습니다."
 SIA_mandate_order: "질서의 위임"
 SIA_mandate_order_desc: "정부의 첫 수는 개혁에 앞선 안정화입니다. 제도는 강화되고, 법원은 존중되며, 정치적 표류는 억제됩니다. 질서를 설득력 있게 제공하면 개혁이 나중에 필요로 하는 신뢰를 얻게 되리라는 것이 도박입니다."
 SIA_mandate_outreach: "대외 접촉의 위임"
 SIA_mandate_outreach_desc: "외교와 무역이 정부가 천명한 우선순위입니다. 대사관은 인력이 가득 찼고, 장관급 대표단은 잦으며, 무역부는 확대된 예산과 총리 일정으로 통하는 직통 회선을 부여받았습니다."
 SIA_uneasy_compromise: "불안한 타협"
 SIA_uneasy_compromise_desc: "장군들은 내각에 앉아 있고 정치인들은 위임을 유지하는, 순전한 상호 불신으로 왕국을 하나로 묶어 두는 거국 정부입니다. 안정은 결단력 있는 행동을 대가로 얻은 것입니다. 모든 부처가 감시받고 모든 구상이 두 번씩 협상됩니다. 이 체제는 나라를 안정시키지만 (§G+5% 안정도§!) 정부의 기동의 자유를 옥죕니다 (§R정치력 획득 -10%§!). 이 거래가 끝날 때까지 그렇습니다."
 SIA_gfc_headwinds: "세계 금융 위기의 역풍"
 SIA_gfc_headwinds_desc: "서방 신용 시장의 붕괴로 태국의 수출 주문이 둔화되고 무역 금융이 경색되었습니다. 소비재 가격은 슬금슬금 오르고 무역량은 위축됩니다. 이 폭풍은 태국의 잘못이 아니지만, 경제는 2년 동안 그 영향을 느낄 것입니다."
 SIA_coup_risk_modifier: "쿠데타 위험 압박"
 SIA_coup_risk_modifier_desc: "높아진 쿠데타 위험은 정치적 안정에 부담을 주고 정치력 축적을 억제합니다. 위험이 높을수록 부담은 더 무거워집니다. 위험 측정치의 모든 수치가 정부의 통치 능력에 그대로 느껴집니다."
 SIA_coup_tier_watchful: "병영의 주시"
 SIA_coup_tier_watchful_desc: "장군들은 당분간 만족하고 있습니다. 그들은 신문을 읽고 예산 항목을 헤아리며 속마음을 드러내지 않습니다. 불이익은 없지만, 정부가 내리는 선택마다 측정치는 오르거나 내립니다.\n\n§Y쿠데타 위험§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_restless: "병영의 동요"
 SIA_coup_tier_restless_desc: "군이 소유한 언론의 날카로운 사설, 토크쇼에서 불평하는 퇴역 장교들, 고위 사령부와 상의 없이 이뤄진 내각 개편. 장교 식당의 분위기가 나빠졌습니다. 깨끗하게 통치하거나, 더 악화되기 전에 그들을 다시 매수하십시오.\n\n§Y쿠데타 위험§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_plotting: "장군들의 음모"
 SIA_coup_tier_plotting_desc: "이례적인 병력 교대, 총리가 초대받지 못한 만찬, 군복 차림의 방문객을 맞는 궁정. 방콕의 모두가 징후를 읽을 수 있습니다. 정부는 여전히 벼랑 끝에서 물러설 수 있지만, 창은 닫혀 가고 있습니다.\n\n§Y쿠데타 위험§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_tanks: "전차의 시동"
 SIA_coup_tier_tanks_desc: "종대는 연료를 채웠고 방송 원고도 작성되었습니다. 고위 사령부는 정부 청사로 진군하기까지 도발 하나만을 남겨 두고 있습니다. 쿠데타 위험을 70 아래로 빠르게 낮추십시오. 그렇지 않으면 §R고위 사령부 안심시키기§! 임무가 만료되고 전차가 올 것입니다.\n\n§Y쿠데타 위험§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_rice_pledge: "쌀 가격 보증 제도"
 SIA_rice_pledge_desc: "정부는 농민에게 시장가보다 높은 쌀 수확 가격을 보장하고 전략 비축분을 보유합니다. 농촌 소득은 오르지만, 국고의 세계 상품 가격 노출도 함께 오릅니다."
 SIA_red_shirts_mobilized_idea: "행진하는 붉은 셔츠"
 SIA_red_shirts_mobilized_idea_desc: "농촌 네트워크가 동원되어 거리에 나와 있습니다. 우돈타니, 콘깬, 방콕 외곽의 대규모 시위는 지지층을 결집시키고, 선출 정부가 통제력을 잃었다고 궁정과 고위 사령부를 확신시킵니다. 행진이 있을 때마다 군과의 결판이 가까워집니다."
 SIA_kings_moral_authority_2: "새 치세"
 SIA_kings_moral_authority_2_desc: "제10대 왕의 치세는 권위를 안착시켰지만, 이는 다른 종류의 권위입니다. 전임자보다 더 눈에 띄고, 더 상업적이며, 더 논쟁적입니다. 한 왕좌에서 70년간 쌓인 도덕적 무게는 한 번의 대관식으로 이전되지 않습니다."
 SIA_kra_mobilization: "크라 운하를 위한 국가 총동원"
 SIA_kra_mobilization_desc: "왕국이 동원할 수 있는 모든 크레인, 굴착기, 공병 대대가 크라 회랑에 투입되었습니다. 소비자 물가는 오르고, 정치적 자본은 고갈되며, 정부 지지율은 그 무게에 휘어지지만, 건설 속도는 놀랍습니다. 이 국가 정신은 운하가 완공되면 제거됩니다."
 SIA_kra_canal: "크라 운하"
 SIA_kra_canal_desc: "타이만과 안다만해를 잇는 운하는 태국을 세계 두 번째로 붐비는 항로의 병목 지점으로 만듭니다. 통행료는 국고로 흘러들고, 각국 해군은 통항권을 위해 공손히 줄을 서며, 방콕의 의견은 이제 모든 아시아 수도에서 구해야 할 가치가 있습니다."
 SIA_kra_debt_trap: "일대일로 부채"
 SIA_kra_debt_trap_desc: "베이징이 비용을 댔기 때문에 운하는 싸게 시작할 수 있었습니다. 상환 일정은 위안화로 표시되고 담보는 수로 자체이며, 비용 초과가 날 때마다 채무는 깊어집니다. 대출이 뒤에서 복리로 불어나는 동안 소비자 물가는 오르고 정치적 자본은 새어 나갑니다."
 SIA_kra_debt_serviced: "부채 재조정"
 SIA_kra_debt_serviced_desc: "대출은 가혹하지만 감당할 수 있는 조건으로 재협상되었습니다. 위기는 지나갔고, 운하는 태국의 것이며, 정부는 밀실이 아닌 협상 탁자에서 베이징에 맞선 대가로 어느 정도의 신뢰를 얻었습니다."
 SIA_kra_default_pariah: "국가 채무 불이행"
 SIA_kra_default_pariah_desc: "태국은 일대일로 대출에서 손을 뗐습니다. 운하는 스스로의 것이지만, 국제 신용 시장은 기억하고 무역 상대국은 위험을 분산하며, 정치가 요구할 때 채무를 부인할 수 있음을 보여 준 나라의 자본 비용은 높습니다."
 SIA_kra_lease_concession: "베이징의 임대 양허"
 SIA_kra_lease_concession_desc: "채무를 청산하기 위해 운하 일부에 대한 장기 운영 양허가 중국 국영 기업에 양도되었습니다. 왕국은 여전히 수문에 깃발을 게양하지만, 이제 모든 통행료의 일부는 베이징으로 흘러가며, 세계는 임대권을 실제로 누가 쥐고 있는지 알아챘습니다."
 SIA_kra_capital_flight: "자본 도피"
 SIA_kra_capital_flight_desc: "채무 불이행은 시장을 놀라게 했습니다. 외국 자본은 출구로 향하고, 바트화는 압박을 받으며, 중앙은행은 출혈을 늦추기 위해 외환 보유고를 소진하고 있습니다. 충격은 심각하지만 일시적이며, 먼지가 가라앉으면 신뢰는 돌아올 것입니다."
 SIA_kra_delay: "공사 지연"
 SIA_kra_delay_desc: "예산을 초과한 단계에 더 많은 자금을 쏟아붓는 대신, 정부는 더 느린 일정을 받아들였습니다. 건설 속도는 떨어지고 대외 인상도 좋지 않지만, 국고는 최악의 초과 비용을 면했습니다."
 SIA_kra_canal_sovereign: "주권 운하"
 SIA_kra_canal_sovereign_desc: "외국 채권자도, 외국의 조항도 없이 건설된 운하는 말뚝 하나까지 태국의 것입니다. 절대적 주권을 위해 치른 프리미엄은 더 깊은 해군 산업 기반, 더 강한 통행료 체제, 그리고 어떤 양허로도 따라올 수 없는 국가적 위신을 사 줍니다."
 SIA_kra_fortress: "요새 운하"
 SIA_kra_fortress_desc: "해안 포대, 강화된 벙커, 상설 해군 수비대는 크라를 타이 왕립 해군이 무력으로 지킬 수 있는 수로로 만듭니다. 함대는 병목 지점을 지키며 기량을 갈고닦지만, 군사화된 통로는 해운 업계에서 방콕의 호의를 조금 깎아 먹습니다."
 SIA_kra_neutral_transit: "중립 통항 체제"
 SIA_kra_neutral_transit_desc: "크라는 조약으로 보장되고 모든 해양 강국의 신뢰를 받으며 모든 깃발에 동등한 조건으로 열려 있습니다. 교통량과 호의가 함께 흘러들어 옵니다. 통행료는 높게 유지되고 무역 국가들의 평판은 오르며, 운하는 국가의 무기가 아닌 세계의 공유재가 됩니다."
 SIA_red_revival: "태국 공산당의 유령들"
 SIA_red_revival_desc: "1970년대 투쟁의 생존자인 태국 공산당 간부들과 그들의 자녀, 그들의 학생들이 변두리에서 나타났습니다. 당은 정치적 에너지와 역사 이론, 그리고 권력에 대한 갈망을 지녔습니다. 또한 적도 있으며, 당이 기존 체제 안에서 일하기를 거부하는 달마다 그 존재는 국가 대화에서 안정도를 몇 퍼센트포인트씩 깎아 먹습니다."
 SIA_general_strike_idea: "총파업 (진행 중)"
 SIA_general_strike_idea_desc: "나라가 의도적으로 마비되고 있습니다. 부두, 철도, 학교, 병원이 최소 인력으로 운영됩니다. 파업이 이어지는 매주 안정도가 반 퍼센트씩 하락합니다. 붉은 길 결정을 통해 파업 동력을 100까지 끌어올리면 정부가 항복합니다. 365일이 먼저 지나가면 군이 장악합니다.\n\n§R파업 동력§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_western_sanctions: "서방의 경제 제재"
 SIA_western_sanctions_desc: "미국과 동맹국들은 정권 교체 이후 태국에 제재 패키지를 부과했습니다. 투자는 얼어붙었고 무역 금융은 마련하기 어려워졌으며 여러 양자 협정이 정지되었습니다. 그 대가는 실재하지만, 명확한 외부의 적을 갖게 된 정치적 이익도 실재합니다."
 SIA_asean_pariah: "지역의 천덕꾸러기"
 SIA_asean_pariah_desc: "이웃 나라들을 굴복시키려는 태국의 시도는 태국을 동남아시아와 그 너머에서 천덕꾸러기로 만들었습니다. ASEAN 파트너들은 방콕을 지역 상거래에서 배제했고, 외국 자본은 침략자를 떠났으며, 벽돌 하나와 기름 한 통의 가격은 이제 한때 이끌던 지역과 전쟁을 벌이는 왕국을 반영합니다. 고립에는 대가가 있으며, 태국 경제가 그것을 치르고 있습니다."
 SIA_peoples_siam: "인민 연대 블록"
 SIA_peoples_siam_desc: "태국은 라오스, 베트남과의 지역 정렬에 스스로를 정박시켰습니다. 상호 인정 틀은 외교적 방패를 제공하고 고립을 줄이며, 막 주요 산업을 국유화한 나라에 매대를 채울 무역 관계를 제공합니다. 블록 전반의 군 대 군 협력은 진정으로 독립적인 방위 태세의 토대입니다."
 SIA_green_rush: "그린 러시"
 SIA_green_rush_desc: "대마 비범죄화는 새로운 농산물 시장을 열었습니다. 이산의 농민들은 작물을 다변화하고 있고, 약초 제품 수출업자들은 면허 기관이 처리하는 속도보다 빠르게 등록하며, 방콕 접객업계의 한 귀퉁이는 조용히 방향을 틀었습니다. 비판자들은 이를 사회 실험이라 부르고, 국고 수입은 이를 수입원이라 부릅니다."
 SIA_war_plan_brm: "버마 전쟁 계획"
 SIA_war_plan_brm_desc: "태국 작전 기획자들은 살윈 전역을 상세히 모의 전투로 검토했습니다. 침투 회랑, 병참 거점, 전력 증강 요소로서의 샨 비정규군. 계획은 최신이며 집결 기반 시설은 갖춰져 있고 장교단은 지형을 잘 알고 있습니다."
 SIA_war_plan_lao: "라오스 전쟁 계획"
 SIA_war_plan_lao_desc: "메콩강 도하 지점, 고지대 고개, 농카이 방면에서의 공세에 취약한 비엔티안. 작전 계획은 제3군 사령부의 모든 작전 바인더에 존재합니다. 국경 기반 시설은 신속한 진격을 지원하도록 조용히 개선되었습니다."
 SIA_war_plan_cbd: "캄보디아 전쟁 계획"
 SIA_war_plan_cbd_desc: "쁘레아 비헤아르 회랑, 당렉 산맥 절벽, 씨엠립으로 향하는 평탄한 접근로. 태국 기획자들은 작전 경계를 그렸고 병참을 세 차례 모의 전투로 검토했습니다. 집결 태세는 갖춰져 있습니다."
 SIA_war_plan_may: "말레이시아 전쟁 계획"
 SIA_war_plan_may_desc: "1909년의 국경은 기획상의 제약일 뿐, 자연의 사실이 아닙니다. 나라티왓 접근로와 끄란딴 회랑에 대한 상세한 작전 명령은 '제한' 표시가 된 붉은 서류철 속에 있습니다. 남부 심층 지역의 기반 시설 투자는 집결지 역할도 겸합니다."
 SIA_protector_of_the_realm: "왕국의 수호자"
 SIA_protector_of_the_realm_desc: "태국군은 이제 수복한 변경의 점령을 떠받치며, 민간 행정이 따라잡는 동안 범타이 전쟁에서 얻은 샨, 라오, 크메르, 말레이 지역의 질서를 유지합니다. 승리가 확보되면서 전쟁 피로도는 줄어들고, 재통일된 왕국에 대한 자부심이 후방을 안정시킵니다."
 SIA_comprehensive_security_idea: "포괄적 안보"
 SIA_comprehensive_security_idea_desc: "통합 국가 안보 체계는 내무, 국방, 정보 기관 간의 중복을 줄입니다. 조정이 개선되면서 소비재 간접비가 감소합니다. 어떤 외부 후원국으로의 쏠림도 눈에 띄게 만들어 내기 어려워집니다."
 SIA_cambodia_partnership: "캄보디아 동반자 관계"
 SIA_cambodia_partnership_desc: "프놈펜과의 체계적인 양자 관계는 무역 원활화, 공동 개발 구역, 그리고 태국을 캄보디아가 선호하는 경제 동반자로 자리매김하는 외교 협정을 포괄합니다. 영향력은 양방향으로 흐르고, 무역 수입은 한 방향으로 흐릅니다."
 SIA_fuel_reserves: "전략 연료 비축"
 SIA_fuel_reserves_desc: "전국 연료 소비량의 3개월분이 다섯 개 지역 전체에 분산된 저장 단지에 전략 비축분으로 보관되어 있습니다. 이 비축분은 가격 급등을 완화하고 위기 시 완충 역할을 하며, 태국의 군 병참이 단일 공급 경로에 발목 잡히지 않음을 동반국들에 알립니다."
 SIA_medical_tourism_boom: "의료 관광 호황"
 SIA_medical_tourism_boom_desc: "소문이 퍼졌습니다. 방콕의 민간 병원은 외국인 환자로 예약이 가득 찼고, 회복기 환자들은 관광객으로 남습니다. 수입과 방문객은 달마다 늘어나지만, 병동은 과열되고 현지인들은 병상을 더 오래 기다립니다."
 SIA_aec_tailwind: "ASEAN 통합 순풍"
 SIA_aec_tailwind_desc: "무역 원활화 추진이 지역 전반에서 성과를 내고 있습니다. 국경에서의 마찰은 줄고, 공급망은 깊어지며, 태국 공장들은 지역 계약을 따냅니다. 수출 주도 성장은 수년에 걸쳐 복리로 불어나지만, 조정 과정에서 국내 소비재 생산 능력은 압박을 받습니다."
 SIA_arms_export_orders: "방위 수출 수주 잔고"
 SIA_arms_export_orders_desc: "수주 잔고가 가득 찼습니다. MRAP, 탄약, 배회 드론, 면허 생산 체계가 ASEAN 구매국에 순차적으로 인도됩니다. 무기 생산 라인은 최대 가동 중이며 지역이 선호하는 공급국으로서 태국의 입지는 깊어지지만, 이웃에 무기를 공급하는 일이 늘 불러오는 외교적 마찰이 대가로 따릅니다."
 SIA_royal_development_lands: "왕실 개발지"
 SIA_royal_development_lands_desc: "왕실이 후원하는 사업들이 경작과 채굴을 위한 새 땅을 열었고 해당 지방을 안정시켰습니다. 농촌은 더 차분해지고 자원 기반은 넓어졌지만, 사업이 진행되는 동안 국가의 물자를 소모합니다."
 SIA_eec_construction_boom: "EEC 건설 급증"
 SIA_eec_construction_boom_desc: "동부 경제 회랑은 살아 있는 건설 현장으로, 항구 위에는 크레인이 서고 철도 노반이 다져지며 공장 골조가 올라갑니다. 건설은 더 빨라지고 생산량은 오르지만, 급증세는 그동안 소비재 생산 능력을 묶어 둡니다."
 SIA_asean_chair_spotlight: "ASEAN 의장국 조명"
 SIA_asean_chair_spotlight_desc: "방콕이 의사봉과 카메라를 쥐고 있습니다. 의장국 지위는 조명이 이어지는 동안 쉬운 호의와 협의체 전반에서 더 저렴한 외교 태세를 가져다줍니다."
 SIA_purge_disruption: "부패 척결 혼란"
 SIA_purge_disruption_desc: "단속 일제 소탕은 조달을 얼어붙게 하고 후원 네트워크를 긴장시켰습니다. 계약은 막혀 버렸고 정치 기구는 삐쳐 있습니다. 이것은 더 깨끗한 체제를 위해 선불로 치르는 대가입니다."
 SIA_army_wage_inflation: "부풀려진 장교 급여"
 SIA_army_wage_inflation_desc: "호의로 고위 장성들을 매수했지만, 그 대가는 비대해진 급여 명부였습니다. 장교 봉급, 수당, 유령 보직이 전 계급에서 부풀려졌으며, 예산이 다시 통제될 때까지 군 급여 비용은 과열 상태로 이어집니다."
 SIA_chuan_leekpai_desc: "1992년부터 1995년까지, 그리고 1997년부터 2001년까지 총리를 지낸 민주당의 베테랑 정치인이자 원로 정치가입니다. 두 번째 임기에 그는 IMF 프로그램으로 태국을 아시아 금융 위기에서 이끌었습니다. 부패가 만연한 체제 속에서 흠잡을 데 없는 개인적 청렴함으로 알려져 있습니다."
 SIA_thaksin_shinawatra_desc: "타이 락 타이당을 창당하고 2001년 압승을 거둔 억만장자 통신 재벌입니다. 30바트 의료 제도와 마을 개발 기금 등 그의 포퓰리즘 정책은 농촌 정치를 바꾸어 놓았습니다. 2006년 군사 쿠데타로 축출된 뒤 망명지에서 여러 대리 정당을 통해 태국을 통치했습니다."
 SIA_bhumibol_adulyadej_desc: "짜끄리 왕조의 아홉 번째 군주이자 세계 최장 재위 국가 원수인 라마 9세입니다. 통합의 상징으로서의 그의 도덕적 권위는 모든 정치 위기에서 발휘되었습니다. 2016년 10월 그의 서거로 70년 치세가 막을 내렸고 깊은 국가적 애도의 시기가 시작되었습니다."
 SIA_vajiralongkorn_desc: "2016년 부왕의 서거 이후 왕위에 오른 라마 10세 마하 와치랄롱꼰입니다. 그는 왕실 자산과 근위대에 대한 직접적인 통제권을 행사했고, 전임자들보다 더 직접적으로 정치에 개입했습니다. 그의 치세는 태국 헌정사에서 가장 격동적인 시기와 맞물려 있습니다."
 SIA_abhisit_vejjajiva_desc: "헌법재판소가 국민권력당을 해산한 후 2008년 의회 표결로 총리가 된 옥스퍼드 출신의 민주당 지도자입니다. 그의 정부는 2010년 4월부터 5월까지 방콕에서 붉은 셔츠 시위대에 대한 강경 진압을 총괄했습니다."
 SIA_yingluck_shinawatra_desc: "탁신 친나왓의 막내 여동생이자 프아 타이당 지도자로, 2011년 7월 선거에서 2001년 이래 최대 다수를 얻어 승리했습니다. 그녀의 정부는 이후 대규모 부패 스캔들이 된 쌀 담보 제도를 시작했습니다. 2014년 헌법재판소에 의해 면직되었으며 형사 판결이 나기 전에 해외로 도피했습니다."
 SIA_prayut_chanocha_desc: "태국의 열두 번째 쿠데타인 2014년 5월 쿠데타를 이끌고 국가평화질서평의회(NCPO) 군정과 팔랑 쁘라차랏당 아래에서 9년간 총리를 지낸 타이 왕립 육군 사령관입니다. 야당을 분열시키도록 고안된 2017년 헌법의 혼합 비례대표제의 설계자입니다."
 SIA_sonthi_boonyaratglin_desc: "총리가 해외에 있는 동안 탁신 친나왓을 축출한 2006년 9월 쿠데타를 이끈 육군 사령관입니다. 과도 민간 정부가 들어설 때까지 국가안보회의 군정을 이끌었습니다. 이후 소수 정당 지도자로서 선거 정치에 뛰어들었습니다."
 SIA_anutin_charnvirakul_desc: "품짜이타이당 지도자이자 건설업계 가문의 후계자로, 부총리로서 두각을 나타냈습니다. 군부와 민간 진영 사이에 전략적으로 자리 잡은 그의 정당은 세 차례 연속 연립 정부에서 킹메이커가 되었습니다. 헌법재판소가 패통탄을 면직하자 2025년 말 총리 직무대행이 되었습니다."
 SIA_pita_limjaroenrat_desc: "전진당 지도자로, 그의 정당은 2023년 5월 선거에서 최다 득표율로 승리했으나 군부가 임명한 상원에 의해 정부 구성이 가로막혔습니다. 이후 헌법재판소는 정당을 해산시키고 그의 정치 활동을 10년간 금지했습니다."
 SIA_natthaphong_ruengpanyawut_desc: "재편된 국민의당 지도자로서 피타 림짜런랏의 후계자이며, 방콕 역대 최연소 선출 주지사입니다. 헌법 개혁과 함께 지방 자치와 기후 정책으로 향하는 태국 진보 정치의 세대교체를 대표합니다."
 SIA_songkhram_phaendin_desc: "'땅의 전쟁'을 뜻하는 이름을 지닌 범타이 학파의 원수입니다. 그는 1893년과 1909년의 할양이 여전히 열려 있는 상처이며 오직 군인의 정부만이 그것을 닫을 수 있다고 설파하며 장교단 내에서 출세했습니다."
 SIA_somchai_ratchaphruek_desc: "공산당의 정글 시절을 겪은 베테랑으로, 황금 샤워 나무에서 따온 성을 지녔습니다. 그는 수용소를 비운 사면 조치들보다 오래 살아남아 북동부에서 다시 조직 활동을 벌였으며, 혁명은 목적이 아니라 시기에서 실패했다고 주장합니다."
 SIA_banharn_silpaarcha_desc: "수판부리 출신으로 1995년부터 1996년까지 총리를 지낸 찻 타이당 지도자이자 건설업계 후원자입니다. 그의 정부는 고향에 지방 기반 시설 지출을 쏟아부었고, 언론은 그에게 걸어 다니는 현금인출기라는 별명을 붙였습니다. 연립은 부패 의혹과 1997년 붕괴에 앞선 경제 경고 신호 속에서 1년 안에 무너졌습니다."
 SIA_chavalit_yongchaiyudh_desc: "새 희망당의 창립자이자 지도자이며, 1996년 11월 총리가 된 전 타이 왕립 육군 총사령관입니다. 그의 정부는 1997년 중반 바트화 위기가 터졌을 때 집권 중이었으며, 정부가 막지 못한 통화 붕괴의 압력으로 그해 11월 사임했습니다."
 SIA_thanathorn_juangroongruangkit_desc: "2018년 미래전진당을 공동 창당하고 청년 중심 개혁 정치의 얼굴이 된 자동차 부품 재벌입니다. 그의 급부상은 기득권층을 놀라게 했습니다. 헌법재판소는 정당이 그 개인에게서 받은 대출을 이유로 2020년 2월 정당을 해산시키고 그의 공직 진출을 10년간 금지했습니다."
 SIA_virot_paoin_desc: "탁신 계파가 다음 단계로 넘어가자 프아 타이당 지도부를 이어받은 경찰 중장입니다. 그는 집회 연단이 아닌 제복 뒤에서 정당의 포퓰리즘 연립을 이어 갑니다. 그의 통치 방식은 전임자가 정당을 세웠던 대규모 농촌 동원이 아니라 경찰과 공직 사회 내의 제도적 충성에 의존합니다."
 SIA_srettha_thavisin_desc: "부동산 개발 기업 임원이자 프아 타이당의 2023년 총리 후보로, 옛 경쟁자들과 구성한 정권 복귀 연립 속에서 그해 8월 총리가 되었습니다. 헌법재판소는 각료 임명과 관련된 윤리 위반을 이유로 2024년 8월 그를 면직했으며, 이는 지난 10년간 선출된 태국 총리 중 가장 짧은 재임 중 하나였습니다."
 SIA_paetongtarn_shinawatra_desc: "탁신 친나왓의 막내딸이자 프아 타이당의 세 번째 친나왓 총리로, 법원의 전임자 면직에 대한 당의 대답으로서 2024년 8월 취임했습니다. 국경 분쟁과 관련해 캄보디아의 훈 센과 나눈 통화가 유출되어 1년도 안 돼 총리직을 잃었으며, 정부의 방향이 여전히 얼마나 그녀의 아버지를 거치는지에 대한 의문을 되살렸습니다."
 SIA_greater_thailand_consolidated: "공고화된 대태국"
 SIA_greater_thailand_consolidated_desc: "수복주의 작전은 종결되었습니다. 왕국은 이전보다 더 크고 강하게 서 있으며, 인력 예비대는 깊어지고, 산업은 대담해졌으며, 국민은 공유된 희생과 공유된 승리로 하나가 되었습니다. 전쟁을 치렀던 국가 기구는 이제 건설을 이끕니다."
 SIA_pax_aseana_idea: "팍스 아세아나"
 SIA_pax_aseana_idea_desc: "태국은 안정적이고 일관되며 자급자족하는 안보 블록을 이끕니다. 정치적 자본은 동맹 수도로부터 흘러들어 오고, 방콕이 홀로 서지 않을 것이며 어떤 동맹국도 그러지 않을 것이라는 인식으로 안정이 강화됩니다. 지역의 평화는 태국의 힘이 뒷받침합니다."
 SIA_asean_defense_member: "SEATO 회원국"
 SIA_asean_defense_member_desc: "이 나라는 스스로의 의지로 태국의 지역 방위 협정에 가입하기로 선택했습니다. 공동 지휘와 공통의 목적은 후방을 안정시키고 방어를 강화합니다. 강압이 아닌 동의로 묶여 있기에, 강제된 동맹이라면 무너졌을 곳에서도 공동체에 대한 헌신이 유지됩니다."
 SIA_rally_round_flag: "깃발 아래 결집"
 SIA_rally_round_flag_desc: "국경 사건은 태국 대중을 군 뒤에 단결시켰습니다. 민족주의 정서가 고조되고 입대 줄이 길지만, 분위기는 불안정하며 이 허니문은 영원히 계속되지 않을 것입니다."
 SIA_anti_graft_idea: "부패 척결 단속"
 SIA_anti_graft_idea_desc: "권한이 강화된 국가반부패위원회는 태국 국가의 수입을 빼돌리는 조달 및 관세 네트워크를 해체하기 시작했습니다. 계약자들은 다시 실력으로 경쟁하며, 대중도 이를 볼 수 있습니다. 6개월 동안 이 캠페인 자체가 정치력에 큰 부담이 되며, 이는 뿌리 깊은 이해관계를 무너뜨리는 대가입니다."
 SIA_strait_patrol_posture: "해협 순찰 태세"
 SIA_strait_patrol_posture_desc: "타이 왕립 해군은 해협에서 강화된 순찰 교대를 운용하고 있습니다. 호위함들이 항로를 따라 감시하고, 초계선이 접근로를 지켜보며, 이 태세가 유지되는 동안 함대는 항구에서 더 멀리 활동합니다."
 SIA_asean_security_pledge: "ASEAN 안보 서약"
 SIA_asean_security_pledge_desc: "태국은 동남아시아의 정복자가 아니라 방패가 되겠다고 서약했습니다. 첫 보장 조치가 방콕의 보호를 받아들이는 이웃들에게 전달되고, 외교단은 안심시키는 인내심 있는 작업에 매진합니다. 보장은 더 저렴해지고 관계는 더 낮은 비용으로 유지되며, 왕국의 군대는 약속에 신빙성을 부여하기 위해 진지를 구축합니다."
 SIA_protector_of_asean: "ASEAN의 수호자"
 SIA_protector_of_asean_desc: "태국은 정복자가 아닌 보증인의 역할을 택했습니다. 안보 우산을 동남아시아 전역으로 넓힘으로써 왕국은 이웃의 신뢰와 지역 강대국의 지위를 얻습니다. 상설 외교단은 이제 여러 ASEAN 수도에 동시에 태국의 영향력을 투사하며, 그 역할이 가져오는 꾸준한 정치적 자본이 이를 뒷받침합니다. 외교는 더 저렴하고 방위는 더 견고하며 ASEAN의 호의는 방콕으로 흐릅니다."
 SIA_frontier_buffer_idea: "변경 완충국"
 SIA_frontier_buffer_idea_desc: "샨족과 카렌족은 버마 국경을 따라 살아 있는 방패로서 무장한 채 우호적으로 유지됩니다. 더 저렴한 보장, 더 안정적인 변경, 네피도에서의 어떤 공세에 대해서도 방어상의 우위를 줍니다."
 SIA_shan_campaign: "샨 전역"
 SIA_shan_campaign_desc: "군은 남부 샨주 진입 작전을 위해 동원되고 방향이 맞춰져 있으며, 전역이 이어지는 동안 샨 병력에 대한 전투 보너스를 얻습니다."
 SIA_karen_campaign: "카렌 전역"
 SIA_karen_campaign_desc: "태국군이 카렌 구릉지로 압박해 들어가며, 전역이 이어지는 동안 카렌 병력에 대한 전투 보너스를 얻습니다."
 SIA_wa_campaign: "와 전역"
 SIA_wa_campaign_desc: "태국군이 UWSA에 맞서 와 구릉지로 돌진하며, 전역이 이어지는 동안 와 병력에 대한 전투 보너스를 얻습니다."
 SIA_us_mech_standard: "나토 표준 기계화"
 SIA_us_mech_standard_desc: "미국 교리와 서방 차량은 우수한 편제, 정찰, 야전 신뢰도를 가져다주지만 그 대가는 국방 예산으로 계산됩니다."
 SIA_reliability_woes: "신뢰도 문제"
 SIA_reliability_woes_desc: "값싼 대량 도입에는 값싼 지원이 따라왔습니다. 변속기 고장과 예비 부품 적체는 함대가 정비될 때까지 사기와 장비 신뢰도를 갉아먹습니다."
 SIA_chd620_teething: "엔진 초기 결함"
 SIA_chd620_teething_desc: "대체 중국제 동력 장치는 과열되고 검증되지 않았습니다. 결함이 해결될 때까지 함정은 더 느리고 승조원들은 자신감이 덜합니다."
 SIA_bamboo_doctrine: "대나무 교리"
 SIA_bamboo_doctrine_desc: "모두와 친하되 누구에게도 얽매이지 않습니다. 외교적 유연성, 폭넓은 호의, 그리고 어느 편도 고르기를 거부하는 나라의 국내 안정입니다."
 SIA_loyal_opposition: "충성스러운 야당"
 SIA_loyal_opposition_desc: "이기든 지든 정당은 존속합니다. 모든 지방에 뿌리를 둔 수십 년 된 조직이며, 정치적 날씨에 따라 흔들리지 않는 확고한 핵심 유권자층을 지녔습니다. 이는 태국 정치에서 가장 안정적인 지지층이며, 포퓰리스트든 궁정이든 어떤 경쟁 운동도 떼어 놓기 가장 어렵습니다."
 SIA_democratic_institutionalism: "민주적 제도주의"
 SIA_democratic_institutionalism_desc: "규칙이 이제 통치자보다 오래갑니다. 독립적인 법원, 작동하는 의회, 전문적인 부처, 그리고 권력이 투표함에서 교체되기를 기대하는 대중이 있습니다. 태국 민주주의는 한철이 아닌 하나의 체제가 되었으며, 거리와 궁정과 병영으로부터의 장악 시도에도 버팁니다."
 SIA_pt_tier_dormant: "포퓰리즘 물결 주시"
 SIA_pt_tier_dormant_desc: "당분간 농촌 표는 유지되고 민주당은 평화롭게 통치합니다. 그러나 탁신의 조직은 결코 진정으로 잠들지 않습니다. 북부와 북동부에서는 옛 충성이 기다리고 있으며, 집권당이 안일해 보이는 순간 결집할 준비가 되어 있습니다. 지역구 조직으로 앞서 나가면 물결은 계속 이렇게 잠잠할 것입니다.\n\n§Y포퓰리즘 물결§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_pt_tier_rising: "포퓰리즘 물결의 상승"
 SIA_pt_tier_rising_desc: "북동부에서는 붉은 깃발이 다시 내걸렸습니다. 탁신의 조직이 세를 얻고 있으며, 이에 대응하지 못하는 정부는 표로 쫓겨나기를 기다리는 관리 정부처럼 보이기 시작합니다.\n\n§Y포퓰리즘 물결§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_red_shirt_encampment: "라차쁘라송 농성"
 SIA_red_shirt_crackdown: "라차쁘라송 진압"
 SIA_red_shirt_encampment_desc: "수만 명의 붉은 셔츠 시위대가 대나무와 타이어 바리케이드 뒤에서 방콕 중심의 쇼핑 지구를 점거하고 있습니다. 쇼핑몰은 닫혔고 사무실은 비었으며 상업 지구는 기능을 멈췄습니다. 정부는 그들이 지치기를 기다리기로 했습니다."
 SIA_red_shirt_crackdown_desc: "군이 실탄으로 교차로를 정리했습니다. 바리케이드도 점거도 사라졌지만 건물들은 불탔고, 경찰은 이전보다 더 많은 비용이 들며, 나라는 군인들이 민간인에게 총격을 가하는 모습을 텔레비전으로 지켜보았습니다."
 SIA_pt_tier_surge: "포퓰리즘 압승 임박"
 SIA_pt_tier_surge_desc: "여론조사는 참패를 기다리고 있습니다. 붉은 셔츠들은 방콕으로 오겠다고 말하고 있으며, 물결이 100에 도달하도록 놔두는 정부는 그들이 진심이었는지 알게 될 것입니다.\n\n§Y포퓰리즘 물결§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_thaksin_ascendant: "타이 락 타이당의 부상"
 SIA_thaksin_ascendant_desc: "1997년 붕괴는 구 정당들을 무너뜨렸고, 그 공백으로 통신 재산과 규율 잡힌 조직, 그리고 북부와 북동부 마을들이 한 세대 동안 기다려 온 약속을 지닌 탁신 친나왓이 걸어 들어옵니다. 저렴한 의료, 채무 탕감, 모든 마을을 위한 개발 기금. 달마다 농촌 표가 그의 타이 락 타이당 뒤로 모이고, 추안의 민주당은 빌린 시간 위에서 통치합니다.\n\n매달 타이 락 타이당과 더 넓은 비동맹 블록은 기득권 표를 끌어와 약 2%의 지지를 얻으며, 이는 2001년 재편이 문제를 결정지을 때까지 이어집니다.\n\n§Y결판까지 남은 개월 수§!: [?ROOT.SIA_thaksin_rise_months|0]/12"
 SIA_broad_coalition_idea: "광범위한 연립"
 SIA_broad_coalition_idea_desc: "의회 방화벽의 대가로 부처가 소수 정당과 지방 유력자들에게 넘어갔습니다. 폭넓고 안정적이지만 모든 결정이 협상이며, 내각은 가장 마지못해 참여하는 동반자의 속도로 움직입니다. 이 거래는 1년간 유효합니다."
 SIA_mekong_soft_power_idea: "메콩 연성 권력"
 SIA_mekong_soft_power_idea_desc: "태국 은행, 건설업체, 방송사들이 방콕의 영향력을 메콩강 상류로 실어 나릅니다. 이웃 지역에서 더 큰 목소리를 내고, 동시에 한 나라를 더 구애할 외교적 여력이 생깁니다."
 SIA_occupation_administration: "점령 행정"
 SIA_occupation_administration_desc: "군정관, 재정착 위원회, 재건 사무소가 이제 정복한 지방을 운영합니다. 순응도는 더 빠르게 오르고, 무장 저항은 마모되며, 통합을 위한 도로와 철도가 더 빠르게 놓입니다. 군이 빼앗은 것을 지키는 기구입니다."
 SIA_deep_south_category: "남부 심층 지역"
 SIA_deep_south_category_desc: "파타니, 얄라, 나라티왓의 말레이계 무슬림 지방은 반란 상태에 있습니다. 진압, 개발, 대화 모두 지지자가 있으며 각각의 대가가 있습니다.\n\n§Y반란 강도§!는 반란의 세기입니다. 높을수록 주간 사건이 더 치명적이고 남부에 대한 부담이 더 무겁습니다. 무력, 개발, 대화는 이를 낮추고, 잔학 행위와 방치는 이를 높입니다.\n\n§Y공동체 불만§!은 그 밑에 깔린 소외감입니다. 강압적 전술은 이를 높이고 양보는 낮추며, 이는 강도를 자체 값의 60%로 설정된 §Y불만 하한선§! 위로 유지시킵니다. 무력으로 반란을 마모시키면 불만이 높아지고, 하한선도 함께 높아집니다.\n\n§Y반란 강도§!: [?ROOT.SIA_insurgency_intensity|0]/100\n§Y공동체 불만§!: [?ROOT.SIA_ds_grievance|0]/100\n§Y불만 하한선§!: [?ROOT.SIA_ds_intensity_floor|0]/100"
 SIA_greater_thailand_category: "대태국"
 SIA_greater_thailand_category_desc: "잃어버린 영토 계획입니다. 민병대, 영유권, 그리고 수복한 땅의 통합."
 SIA_ds_security_operations: "보안 소탕"
 SIA_ds_security_operations_desc: "남부 지방 전역에서의 포위 수색 작전입니다. 소탕이 끝나면 질서가 돌아옵니다. 이것이 반란을 끝내는지 키우는지는 모든 사후 보고서에서 논쟁거리입니다."
 SIA_ds_development_fund: "남부 개발 기금"
 SIA_ds_development_fund_desc: "나라에서 가장 가난한 지방들을 위한 도로, 학교, 일자리입니다. 병력보다 느리지만 전쟁보다 저렴합니다."
 SIA_ds_emergency_decree: "비상 칙령"
 SIA_ds_emergency_decree_desc: "남부 지방의 보안군에 부여되는 특별 권한입니다. 기소 없는 구금, 면책 조항, 통행금지. 효과적이지만 부식적입니다."
 SIA_ds_peace_dialogue: "공개 평화 대화"
 SIA_ds_peace_dialogue_desc: "말레이시아의 중재 아래 분리주의 운동과의 공식 회담을 승인합니다. 그들과 대화하는 것은 그들의 존재를 인정하는 것입니다. 그것은 또한 탁자에서 이를 끝내는 가장 빠른 길입니다."
 SIA_arm_shan_militias: "샨 민병대 무장"
 SIA_arm_shan_militias_desc: "버마 국경 너머의 샨 군대에 조용히 물자를 공급합니다. 호송대 하나하나가 샨주가 무엇이 될지에 대한 영향력을 사들입니다."
 SIA_shan_client_state: "샨주 후원"
 SIA_shan_client_state_desc: "방콕과 연대하는 샨 국가를 승인하고 보증합니다. 우리의 형제들은 자기 나라를 얻고, 우리는 그 충성을 얻습니다."
 SIA_integrate_shan: "샨 영토 통합"
 SIA_integrate_shan_desc: "샨 고원에 태국 행정을 확대하여 총독, 학교, 바트화를 들여옵니다. 방콕이 통제를 공고히 하려면 주민이 충분히 안정되어야 합니다."
 SIA_integrate_laos: "라오 영토 통합"
 SIA_integrate_laos_desc: "영유권을 주장하는 라오 지방에 태국 행정을 확대합니다. 공식 통합을 진행하려면 핵심 국가에서 높은 순응도와 낮은 저항이 필요합니다."
 SIA_integrate_cambodia: "크메르 지방 통합"
 SIA_integrate_cambodia_desc: "1941~1946년과 같이 밧담방과 씨엠립에 태국 행정을 확대합니다. 공식 행정을 부과하려면 크메르 주민이 태국의 통치를 받아들여야 합니다."
 SIA_integrate_malaya: "남부 지방 통합"
 SIA_integrate_malaya_desc: "1909년에 할양된 옛 술탄국들에 태국 행정을 확대합니다. 통합을 위해서는 공식 병합에 앞서 주민이 방콕의 영향력 아래 확고히 놓여야 합니다."
 SIA_cost_1_0: "£treasury 1.0"
 SIA_cost_1_5: "£treasury 1.5"
 SIA_thaksinite_party_governs_tt: "집권당은 §Y[neutral_Social_L]§!입니다."
 SIA_cost_2_0: "£treasury 2.0"
 SIA_cost_2_0_blocked: "£treasury 2.0 §R(부족)§!"
 SIA_otpc_education_strain: "아동 1인 1태블릿 보급"
 SIA_otpc_education_strain_desc: "충전기, 파손, 교체 기기, 아무도 비용을 계산하지 않은 교육 예산. 교육부가 이 계획의 실제 값을 떠안고 있습니다."
 SIA_packed_senate: "우리만의 상원"
 SIA_packed_senate_desc: "상원과 독립 기관에 배치된 충성파들입니다. 당분간 정부 법안은 고개만 끄덕이면 통과됩니다."
 SIA_cost_5_0: "£treasury 5.0"
 SIA_economy_category: "태국 전략 및 경제 결정"
 SIA_economy_category_desc: "관광, 의료, 제조업, 무기, 초대형 사업들과 함께 ASEAN 외교와 대전략의 지렛대가 있습니다. 태국 국가의 엔진들은 국고와 내각이 여력이 있을 때 투자와 정치적 자본에 반응합니다."
 SIA_ds_hearts_and_minds: "민심 확보"
 SIA_ds_hearts_and_minds_desc: "말레이어 교육, 종교적 접촉, 보상 위원회, 마을 중재자입니다. 아무도 이를 위해 퍼레이드를 열지 않지만, 사건 지도는 더 조용해집니다."
 SIA_contain_the_crisis: "위기 억제"
 SIA_contain_the_crisis_desc: "남부 심층 지역이 끓어 넘쳤습니다. 6개월 이내에 반란 강도를 §Y60§! 아래로 되돌리십시오. 그렇지 않으면 폭력이 소용돌이치며 안정도와 정통성의 손실이 쌓일 것입니다."
 SIA_choose_a_path: "남부의 길 선택"
 SIA_choose_a_path_desc: "위기는 진행 중이며 정부는 분명한 정치적 위임을 갖고 있지만 남부 전략은 확정되지 않았습니다. 1년 안에 무력, 왕실 개발, 대화 중 하나를 확정하십시오. 그렇지 않으면 표류가 왕국에 큰 대가를 치르게 할 것입니다."
 SIA_medical_tourism_campaign: "의료 관광 캠페인"
 SIA_medical_tourism_campaign_desc: "태국 병원을 세계에 홍보하여, 서방 가격의 일부로 수술과 회복 서비스를 해변과 함께 제공합니다. 병동이 부하를 감당할 수 있다면 캠페인은 스스로 비용을 충당합니다."
 SIA_eec_investment_phase: "EEC 투자 단계"
 SIA_eec_investment_phase_desc: "동부 지방의 토지 정리, 공공 설비, 항만 및 철도 공사를 위해 동부 경제 회랑 자금의 다음 분할분을 집행합니다."
 SIA_cost_3_0: "£treasury 3.0"
 SIA_cost_4_0: "£treasury 4.0"
 SIA_cost_6_0: "£treasury 6.0"
 SIA_cost_7_0: "£treasury 7.0"
 SIA_cost_1_0_blocked: "£treasury 1.0 §R(부족)§!"
 SIA_cost_1_5_blocked: "£treasury 1.5 §R(부족)§!"
 SIA_cost_3_0_blocked: "£treasury 3.0 §R(부족)§!"
 SIA_cost_4_0_blocked: "£treasury 4.0 §R(부족)§!"
 SIA_cost_5_0_blocked: "£treasury 5.0 §R(부족)§!"
 SIA_cost_6_0_blocked: "£treasury 6.0 §R(부족)§!"
 SIA_cost_7_0_blocked: "£treasury 7.0 §R(부족)§!"
 SIA_family_holdings: "가문 지분"
 SIA_family_holdings_desc: "친나왓 가문은 통신, 위성 서비스, 위성 텔레비전 및 십여 개의 관련 사업에서 상당한 지분을 지배합니다. 정부와의 관계를 배당금으로 바꾸는 것은 가문의 전통이며 당이 의지하는 수입원입니다."
 SIA_royal_projects: "왕실 개발 사업"
 SIA_royal_projects_desc: "시범 농장, 이동 보건소, 유역 관리, 직업 훈련을 위해 왕실 개발팀을 농촌 지방에 파견합니다. 국왕의 개인적 위신이 모든 사업에 함께하며, 마을 이장들은 누가 자신들을 보냈는지 기억합니다."
 SIA_isoc_surveillance_sweep: "ISOC 감시 소탕"
 SIA_isoc_surveillance_sweep_desc: "남부 심층 지역의 이동통신망, 마을 정보원망, 국경 통과 지점을 소탕하기 위해 ISOC 정보팀을 파견합니다. 영장도, 기록도 없으며, 군이 한 번도 가져 보지 못한 남부의 그림을 얻습니다."
 SIA_isoc_grid_disruption: "ISOC 네트워크 교란"
 SIA_isoc_grid_disruption_desc: "반란의 작전 속도를 유지하는 자금 경로, 지휘 거점, 연락망을 표적으로 삼습니다. 교란된 거점 하나하나가 터지지 않는 폭탄 하나입니다."
 SIA_ds_cordon_and_search: "포위 수색"
 SIA_ds_cordon_and_search_desc: "마을을 봉쇄하고 집집마다 무기와 전투원을 수색합니다. 반군의 작전 속도를 빠르게 꺾지만, 걷어차인 문과 구금된 친척 하나하나가 운동의 양분이 되는 불만을 깊게 합니다."
 SIA_ds_fund_religious_schools: "뽄독 학교 지원"
 SIA_ds_fund_religious_schools_desc: "남부가 소중히 여기는 말레이계 무슬림 종교 학교와 문화 기관에 남부 자신의 방식대로 국가 보조금을 지급합니다. 이번 주 폭력에는 거의 영향이 없지만, 폭력을 지탱하는 소외감을 강하게 타격합니다."
 SIA_asean_rotating_summit: "ASEAN 정상회의 개최"
 SIA_asean_rotating_summit_desc: "태국의 의장국 지위를 이용해 방콕을 동남아시아의 외교 수도로 내세우는 이목을 끄는 정상회의를 개최합니다. 그 결과 얻는 호의는 국내의 정치적 자본과 해외의 위신으로 이어집니다."
 SIA_asean_mediate_myanmar: "미얀마 위기 중재"
 SIA_asean_mediate_myanmar_desc: "태국을 미얀마 군정과 국제 사회 사이의 정직한 중재자로 자리매김합니다. 조용한 성공은 네피도에서 지속적인 영향력을 쌓습니다. 공개적인 실패도 지역의 나머지 국가들에게는 여전히 유용한 신호입니다."
 SIA_asean_free_trade_push: "ASEAN 자유무역 조치 추진"
 SIA_asean_free_trade_push_desc: "의장국 지위를 이용해 관세 조화, 비관세 장벽 축소, 디지털 무역 회랑과 같은 무역 원활화 조치를 밀어붙입니다. 기반을 닦는 데는 시간이 걸리지만 수출 수입은 예정대로 들어옵니다. ASEAN 이웃들은 방콕의 건설적인 리더십에 주목합니다."
 SIA_retry_section_112: "개정안 재상정"
 SIA_retry_section_112_desc: "112조 개혁을 위한 첫 시도는 입법부에서 실패했습니다. 대중의 반발은 컸지만 젊은 유권자들의 맞불 동원도 컸습니다. 더 잘 준비되고 더 좁게 작성된 두 번째 시도는 시기가 맞으면 여전히 통과될 수 있습니다."
 SIA_ds_autonomy_framework: "남부 자치 틀"
 SIA_ds_autonomy_framework_desc: "지역 자문 위원회, 말레이어의 공용어 지위, 이양된 학교 재정을 갖춘 말레이계 무슬림 지방을 위한 소규모 행정 자치 제도를 시범 도입합니다. 독립은 아니며 근처에도 못 가지만, 방콕이 귀 기울일 수 있음을 보여 주기에는 충분합니다. 설계에 6개월, 평가에는 한 세대가 걸립니다."
 SIA_isr_persistent_sweep: "ISR 상시 감시"
 SIA_isr_persistent_sweep_desc: "하늘의 눈 자산을 남부 심층 지역의 상시 감시에 배정합니다. 국경 통과 지점, 이동통신 통신량, 차량 이동을 감시합니다. 반군은 눈에 띄지 않고 움직일 능력을 잃으며, 병사 한 명도 마을에 들어갈 필요가 없습니다."
 SIA_political_gambits_category: "정치적 책략"
 SIA_political_gambits_category_desc: "국가 중점 사이에도 정부에게는 여전히 지렛대가 있습니다. 장관 개편, 검사 지휘, 지방으로 보내는 자금, 그리고 때가 되면 궁정과의 거래나 법정에서의 하루입니다.\n\n§Y개혁 압력§!: [?ROOT.SIA_reform_pressure|0]/100. 도시와 청년층의 불만이 전진당으로 쏠리고 있습니다. 60을 넘으면 시위로 번집니다.\n§Y포퓰리즘 물결§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. 농촌이 프아 타이당으로 다시 쏠리고 있습니다. 이는 민주당 정부만 해당됩니다."
 SIA_cabinet_reshuffle: "내각 개편"
 SIA_cabinet_reshuffle_desc: "장관들을 교체하고, 비판자들을 매수하며, 가장 성과가 나쁜 인물을 텔레비전 일정에서 빼냅니다. 현재 정부에 매달려 있는 것이 쁘라윳 피로감이든 법정의 정치든 그와 함께 사라집니다. 당은 중요한 것은 아무것도 바꾸지 않은 채 쇄신을 주장합니다."
 SIA_lese_majeste_lever: "불경죄 지렛대 가동"
 SIA_lese_majeste_lever_desc: "가장 목소리가 큰 개혁 비판자들에 대한 112조의 선별적 집행입니다. 기소가 제기되고 보석이 거부되며 발언이 철회됩니다. 야당은 목소리 하나를 잃고, 이를 지켜보는 모두가 체제에서 한 걸음 더 멀어집니다."
 SIA_coup_watch_category: "병영이 지켜보고 있다"
 SIA_coup_watch_category_desc: "태국 역사에서 선출된 모든 포퓰리스트는 군의 그림자 속에서 통치해 왔습니다. 통신 특혜, 부풀린 계약, 가족 비리와 같은 빠른 성과는 지금 당장 돈과 표를 사 주지만, 각각이 §Y쿠데타 위험§!을 높입니다. 위험은 또한 매주 저절로 올라가는데, 평소 0.5씩, 안정도가 50% 미만일 때는 1.0씩 오르며, 조치 없이는 결코 내려가지 않습니다. 아래의 결정들은 위험을 다시 사들여 낮추지만, 각각 무언가의 대가를 치러야 합니다. 85를 넘으면 §R고위 사령부 안심시키기§! 임무가 발동합니다. 이를 해소하지 못하면 군이 정부를 장악합니다.\n\n§Y쿠데타 위험§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_shin_corp_tax_holiday: "통신 면세 기간 맞춤 설계"
 SIA_shin_corp_tax_holiday_desc: "가문의 통신 제국이 다음 횡재에서 거의 아무것도 내지 않도록 양허 조건을 조용히 고칩니다. 국고와 당 모두 이익을 얻습니다. 장군들은 이를 하나하나 세고 있습니다."
 SIA_school_milk_contract: "학교 우유 계약 수주"
 SIA_school_milk_contract_desc: "농촌 학생들을 위한 전국 무상 우유 제도로, 마을에서는 대단히 인기가 있지만 누구에게 감사해야 하는지 정확히 아는 공급업자 카르텔을 통해 처리됩니다. 마을은 고마워합니다. 장교들은 그렇지 않습니다."
 SIA_otpc_tablet_procurement: "아동 1인 1태블릿 시행"
 SIA_otpc_tablet_procurement_desc: "모든 1학년 학생의 손에 태블릿을 쥐여 주는 화려한 계획입니다. 카메라는 이를 좋아하고 당의 지지율은 오릅니다. 비용은 현금으로 지불되고 교육 예산이 반년간 부담을 지며, 조달은 군복을 입은 모두가 아는 리베이트 기계입니다."
 SIA_family_business_favors: "가문 기업에 계약 몰아주기"
 SIA_family_business_favors_desc: "공공사업, 수입 면허, 한두 개의 항만 양허가 모두 총리의 친척들이 우연히 소유한 기업으로 갑니다. 국고와 가문을 위한 돈입니다. 군은 이를 당신에 대한 사건 기록에 더합니다."
 SIA_court_the_generals: "장군들 구슬리기"
 SIA_court_the_generals_desc: "은밀한 예산 항목, 위신 있는 보직, 그리고 적절히 배치된 몇 건의 진급입니다. 어느 것도 저렴하지 않지만 만족한 장교단은 인내심 있는 장교단입니다. 쿠데타 위험이 감소합니다."
 SIA_military_budget_boost: "국방 조달 대규모 승인"
 SIA_military_budget_boost_desc: "잠수함, 전투기, 새 사령부 청사 동. 군의 희망 목록을 승인하면 고위 장성들은 누가 비용을 대는지 기억합니다. 민간 경제는 이 때문에 조금 더 굶주리지만 쿠데타 위험은 크게 떨어집니다."
 SIA_anti_corruption_gesture: "측근 하나를 검찰에 던지기"
 SIA_anti_corruption_gesture_desc: "소모 가능한 동맹을 골라 사건 서류를 반부패위원회에 넘기고 카메라가 돌게 합니다. 당 지지자들은 친구가 좋은 헤드라인과 맞바꿔 팔려 가는 것을 지켜보고 지지율이 떨어집니다. 장군들은 자기 사람을 처벌하는 정부를 봅니다."
 SIA_promote_loyalists: "충성스러운 장교 진급"
 SIA_promote_loyalists_desc: "연간 진급 명단을 개편하여 믿을 만한 인물을 제1군, 국왕 근위대, 수도 수비대와 같은 중요한 지휘부로 옮깁니다. 정치적 자본이 들지만 정부와 전차 사이에 더 우호적인 인물들을 세웁니다. 쿠데타 위험이 감소합니다."
 SIA_reassure_high_command: "고위 사령부 안심시키기"
 SIA_reassure_high_command_desc: "종대는 연료를 채웠고 방송 원고도 작성되었습니다. 제한 시간이 다하기 전에 예산, 진급, 혹은 측근들에 대한 공개적 청산을 통해 쿠데타 위험을 70 아래로 되돌리십시오. 실패하면 군이 정부를 장악합니다."
 SIA_canal_tolls: "운하 통행료 징수"
 SIA_canal_tolls_desc: "크라 운하는 세계에서 가장 부가가치가 높은 해상 교통을 일부 실어 나릅니다. 컨테이너선, 유조선, 벌크선, 크루즈선 같은 상업 선박의 통행료 징수액이 6개월마다 국고로 직접 흘러듭니다."
 SIA_kra_construction: "크라 운하"
 SIA_kra_construction_desc: "크라 운하의 전 과정입니다. 먼저 크라 지협 대굴착의 단계별 공사로, 각 단계가 차례로 자금을 받으며 방치하면 비용 초과와 분쟁 지역에서의 파괴 공작을 불러옵니다. 그다음은 완공된 해협의 해군 관리로, 순찰 일정, 통항 규약, 그리고 세계에서 가장 새로운 병목 지점의 안전입니다.\n대굴착은 자금이 투입되는 세 단계로 진행됩니다. §Y공사 진행도§!: [?ROOT.SIA_kra_progress|0]%"
 SIA_kra_phase_1: "1단계, 지협 굴착"
 SIA_kra_phase_1_desc: "첫 번째 대규모 굴착입니다. 반도의 등줄기를 관통하는 수로를 뚫습니다. 건설 시즌이 끝나기 전에 이 단계의 자금을 대지 않으면 사업 사무소가 비용 초과를 안고 돌아올 것입니다."
 SIA_kra_phase_2: "2단계, 수문 및 수로 공사"
 SIA_kra_phase_2_desc: "굴착한 수로에 벽을 두르고, 수문을 가라앉히며, 두 바다를 막아 낼 수로 공사를 건설합니다. 일정에 맞춰 국고를 유지하지 않으면 또 다른 비용 초과를 맞게 됩니다."
 SIA_kra_phase_3: "3단계, 해상 시운전"
 SIA_kra_phase_3_desc: "정상부 수로에 물을 채우고, 수문을 달고, 도선사들을 평형수만 싣고 통과시킵니다. 운하가 개통되기 전의 마지막 단계입니다. 자금을 대면 초대형 사업은 완료됩니다."
 SIA_strait_patrol: "해협 순찰"
 SIA_strait_patrol_desc: "타이 왕립 해군 함정을 크라 통항 회랑의 정기 순찰에 투입합니다. 이 주둔은 해적 행위를 억제하고 해운업계를 안심시키며, 함대에게 한 번도 가져 보지 못한 해상 경험을 줍니다."
 SIA_red_path_category: "붉은 길"
 SIA_red_path_category_desc: "태국 공산당은 의회 경쟁이 아닌 마을 위원회, 직장 지부, 이웃 협회를 통해 기반을 구축합니다. 뿌리를 내린 각 위원회는 운동의 대중적 지지를 넓히고 공식 관용의 한계를 시험합니다.\n\n총파업이 선포되면 그 수단들도 이 범주에 나타납니다. §R파업 동력§!이 365일 이내에 100에 도달하면 파업은 성공하며, 그 시점에 정부가 양보하고 당은 무장 봉기 없이 권력을 잡습니다. 그 기간이 먼저 만료되면 군이 파업을 진압하고 스스로 권력을 잡습니다.\n§R파업 동력§!: [SIA_strike_momentum_status]"
 SIA_spread_flame_isaan: "이산 마을 조직화"
 SIA_spread_flame_isaan_desc: "당 간부들이 이산 전역의 마을과 군 소재지에 배치되어 마을 위원회, 문해 모임, 협동조합 네트워크를 구축합니다. 북동부는 태국에서 가장 가난하고 인구가 많은 지역으로, 1960~1970년대 반란 내내 당의 핵심 지지 기반을 제공했으므로 그곳에서의 조직화는 운동이 이미 쥔 기반을 공고히 합니다."
 SIA_spread_flame_north: "북부 공동체 조직화"
 SIA_spread_flame_north_desc: "북부 지방은 1970년대 소작농 연합에서 그 뒤를 이은 협동조합 운동에 이르기까지 농민 시위와 노동 조직의 오랜 기록을 지녔습니다. 당 조직가들은 산비탈 협동조합과 목재 노조를 통해 활동합니다. 이산 밖의 두 번째 지역 기반은 운동에 순수한 북동부적 성격이 아닌 전국적 성격을 부여합니다."
 SIA_mass_education_campaign: "대중 정치 교육 캠페인"
 SIA_mass_education_campaign_desc: "당은 노동사, 경제 이론, 동남아시아에 대한 외세 개입의 기록을 다루는 전국적 정치 교육 프로그램을 실시합니다. 교육은 국립 학교가 아닌 당과 연대한 노조, 협동조합, 공동체 센터를 통해 이루어집니다. 이 캠페인은 당의 조직가와 교사들을 바쁘게 하며, 자신이 지지하도록 요청받은 강령을 이해하는 지지 기반을 만들어 냅니다."
 SIA_asean_arms_export: "ASEAN 무기 수출 계약"
 SIA_asean_arms_export_desc: "태국의 방위 제조업체들은 반복적인 수출 프로그램을 유지할 생산 능력과 지역적 관계를 갖추고 있습니다. MRAP, 포탄 신관, 탄약 물량, 배회 탄약 등 각 연간 계약은 국고에 직접 더해지며 태국이 지역에서 선호되는 2선급 공급국으로서의 입지를 깊게 합니다."
 SIA_defense_export_contract: "방위 수출 계약"
 SIA_defense_export_contract_desc: "방위 수출청이 자리 잡고 왕국의 무기고가 판매 인증을 받으면서, 내각은 새로운 수출 계약을 승인할 수 있습니다. 차이세리 퍼스트 윈 차량, DTI 로켓 및 탄약, 면허 생산 체계가 ASEAN 구매국에 정기적으로 인도됩니다. 거래를 확보하는 데 쓴 정치적 자본은 확실한 수출 수입으로 국고에 돌아오며, 방위 산업 부문은 스스로의 비용을 감당합니다."
 SIA_counter_chinese_influence: "중국 영향력 대응"
 SIA_counter_chinese_influence_desc: "방콕의 이웃 지역에서 베이징의 영향력을 되돌리기 위해 외교, 경제, 정보 자원을 투입합니다. 이 작전은 수개월이 걸리고 비용이 들지만, 대안은 묵인입니다."
 SIA_counter_indian_influence: "인도 영향력 대응"
 SIA_counter_indian_influence_desc: "투자에서 문화 프로그램, 전략적 동반자 관계에 이르기까지 동남아시아에서 뉴델리의 연성 권력이 조용히 확대되어 왔습니다. 조율된 영향력 대응 캠페인은 지역 동반국들을 방콕 쪽으로 돌려놓습니다."
 SIA_renegotiate_china_contracts: "중국 계약 재협상"
 SIA_renegotiate_china_contracts_desc: "일대일로 인프라 계약은 태국이 필요로 했던 도로와 철도를 건설했지만, 자금 조달 조건은 한 세대 동안 베이징의 영향력을 새겨 넣습니다. 내각은 그 의존을 받아들이거나, 조건을 재협상하는 정치적 대가를 치를 수 있습니다."
 SIA_us_security_review: "미국-태국 안보 검토"
 SIA_us_security_review_desc: "워싱턴이 공식적인 양자 안보 검토를 요청했습니다. 그 결과는 태국이 훈련 패키지, 조달 접근권, 정치적 가시성을 수반하는 조약 연대를 심화할지, 아니면 전략적 이중 보험을 유지할지를 결정합니다."
 SIA_strategic_fuel_reserve: "전략 연료 비축 구축"
 SIA_strategic_fuel_reserve_desc: "분산된 저장 단지에 3개월분의 국가 연료 비축을 의뢰합니다. 이 투자는 가격 변동성을 완화하고 군 병참 완충 역할을 하며 지역 동반국들에 공급망 회복력을 알립니다."
 SIA_anti_corruption_drive: "부패 척결 운동"
 SIA_anti_corruption_drive_desc: "조달 부패, 관세 사기, 지방 정부에 박힌 후원 네트워크를 겨냥한 표적 단속 캠페인입니다. 깨끗한 계약은 처음에는 더 느리지만, 장기적으로는 더 저렴합니다."
 SIA_tax_modernization: "세금 체계 현대화"
 SIA_tax_modernization_desc: "국세청의 종이 기반 평가 체계를 의무 전자 신고, 알고리즘 감사, 징수 실적 기반 평가자 인센티브로 대체합니다. 시행은 고통스럽습니다. 영구적인 효율 배당은 5년 이내에 자본 비용을 갚습니다."
 SIA_gripen_ef_upgrade: "그리펜 E/F 계약"
 SIA_gripen_ef_upgrade_desc: "2025년 8월에 체결된 12대 규모의 그리펜 E/F 계약은 5세대급 능력을 갖춘 전투기에 대한 RTAF의 의지를 나타냅니다. 첫 인도는 2029년으로 예상됩니다. 이 계약은 RTAF와 SAAB의 장기 관계를 굳히고 2040년대까지 스웨덴의 정비 지원을 확보합니다."
 SIA_imf_program_active: "§Y$SIA_recover_from_97_crisis$§!에서 시작된 진행 중인 IMF 상환 프로그램"
 SIA_ds_active: "남부 심층 지역 반란이 진행 중입니다"
 SIA_ds_resolved_force: "남부 심층 지역이 무력으로 평정되었습니다"
 SIA_not_ruled_by_communists_tt: "§Y[communist_state_L]§!은(는) 집권당이 아닙니다."
 SIA_not_ruled_by_democrats_tt: "§Y[conservatism_L]§!은(는) 집권당이 아닙니다."
 SIA_not_ruled_by_royalists_tt: "§Y[Nat_Autocracy_L]§! 및 §Y[Monarchist_L]§!은(는) 집권당이 아닙니다."
 SIA_ds_intensity_below_25_tt: "남부 심층 지역 반란 강도가 §Y25§! 미만 (현재 §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_30_tt: "남부 심층 지역 반란 강도가 §Y30§! 미만 (현재 §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_35_tt: "남부 심층 지역 반란 강도가 §Y35§! 미만 (현재 §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_40_tt: "남부 심층 지역 반란 강도가 §Y40§! 미만 (현재 §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_50_tt: "남부 심층 지역 반란 강도가 §Y50§! 미만 (현재 §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_aligned_west_tt: "서방 연대 선택을 최소 두 가지 선택함 (현재 §Y[?SIA_pick_west|0]§!)"
 SIA_aligned_china_tt: "중국 연대 선택을 최소 두 가지 선택함 (현재 §Y[?SIA_pick_china|0]§!)"
 SIA_aligned_self_tt: "자력갱생 선택을 최소 두 가지 선택함 (현재 §Y[?SIA_pick_self|0]§!)"
 SIA_no_bloc_dominant_tt: "어느 블록도 한 번 넘게 선택되지 않음. 서방 §Y[?SIA_pick_west|0]§!, 중국 §Y[?SIA_pick_china|0]§!, 자력갱생 §Y[?SIA_pick_self|0]§!"
 SIA_bamboo_east_gate_tt: "우리가 §Y[Nat_Autocracy_L]§! 또는 §Y[Monarchist_L]§! 통치 아래에 있으면서 동시에 §Y미국§!과 같은 세력에 속해 있지 않음."
 SIA_outlook_western_tt: "£western_outlook_campaign_cost_modifier_texticon §Y서방 이념 성향§! 인기도: [?temp_outlook_increase|%+]\n"
 SIA_outlook_emerging_tt: "£emerging_outlook_campaign_cost_modifier_texticon §Y신흥국 이념 성향§! 인기도: [?temp_outlook_increase|%+]\n"
 SIA_outlook_nonaligned_tt: "£nonaligned_outlook_campaign_cost_modifier_texticon §Y비동맹 이념 성향§! 인기도: [?temp_outlook_increase|%+]\n"
 SIA_outlook_nationalist_tt: "£nationalist_outlook_campaign_cost_modifier_texticon §Y민족주의 이념 성향§! 인기도: [?temp_outlook_increase|%+]\n"
 SIA_coup_risk_increase_tt: "§R쿠데타 위험 [?coup_delta|0+]§! (현재 §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_coup_risk_decrease_tt: "§G쿠데타 위험 [?coup_delta|0+]§! (현재 §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_coup_risk_reset_tt: "쿠데타가 성공합니다. 군부 통치 아래에서 쿠데타 위험은 0으로 초기화됩니다."
 SIA_army_patience_exhausted_tt: "군의 인내심이 바닥났습니다. 쿠데타 위험이 60 초과, 2010년 1월 1일 이후."
 SIA_ds_force_track_increase_tt: "무력 해결을 향한 진행도: §Y[?ROOT.SIA_ds_force_track|0]§!/4. 이 방식으로 끝내려면 강도와 불만도 §Y30§! 미만이어야 합니다."
 SIA_ds_peace_track_increase_tt: "협상 타결을 향한 진행도: §Y[?ROOT.SIA_ds_peace_track|0]§!/2. §Y공개 평화 대화§! 결정이 열립니다."
 SIA_reform_pressure_increase_tt: "§R개혁 압력 [?reform_delta|0+]§! (현재 §Y[?ROOT.SIA_reform_pressure|0]§!/100)"
 SIA_reform_pressure_decrease_tt: "§G개혁 압력 [?reform_delta|0+]§! (현재 §Y[?ROOT.SIA_reform_pressure|0]§!/100)"
 SIA_engage_reform_movement: "개혁 운동 끌어안기"
 SIA_engage_reform_movement_desc: "학생회와 개혁 의원 모임을 탁자로 초대하고, 청년 일자리 계획에 자금을 대며, 카메라에 악수를 보여 줍니다. 거리는 잠잠해집니다. 운동을 탁자에 앉히는 것은 그들을 존중받는 존재로 만들기도 하며, 전진당이 그로부터 이득을 얻습니다."
 SIA_rural_development_package: "농촌 개발 패키지"
 SIA_rural_development_package_desc: "마을 기금, 쌀 가격 하한선, 농가 부채 탕감, 군 소재지로 가는 새 도로. 국고에서 나가는 한 번의 지출로 농촌이 포퓰리즘 기구에 귀 기울이지 않는 1년을 삽니다."
 SIA_rural_package_active: "농촌 개발 패키지"
 SIA_rural_package_active_desc: "마을 기금이 집행되고 있고, 가격 하한선이 유지되며, 군 도로 건설 인력이 일하고 있습니다. 이것이 진행되는 동안 소비재는 조금 더 비싸지고, 그 1년 동안 농촌은 정부의 것입니다."
 SIA_palace_bargain: "궁정과의 거래 성사"
 SIA_palace_bargain_desc: "협상으로 해결되는 쿠데타입니다. 전차를 기다리는 대신, 궁정과 그 장군들이 어차피 가져갈 것을 건넵니다. 왕당파 기득권층이 선임 동반자로 정부에 들어오고, 우리 당은 의석은 유지하되 주도권을 잃으며, 왕국은 한 발의 총성도 없이 방향을 틉니다."
 SIA_face_the_court: "헌법재판소와 맞서기"
 SIA_face_the_court_desc: "태국이 20년간 그래 왔듯 집권당의 운명을 판사들에게 맡깁니다. 궁정과의 거래와 달리 이것은 타결이 아닌 도박이며, 재판부가 결정합니다. 해산에 순응하여 권력을 경쟁자들에게 넘기거나, 판결에 맞서 안정도와 군의 인내심으로 대가를 치릅니다."
 SIA_pack_the_senate: "상원 채우기"
 SIA_pack_the_senate_desc: "아무것도 정부를 견제하지 못할 때까지 상원과 독립 기관을 충성파로 채웁니다. 법안은 반년 동안 반대 없이 통과됩니다. 장군들에게 이것은 눈앞에서 벌어지는 권력 찬탈입니다."
 SIA_populist_trunk_entry_tt: "집권당은 §Y[neutral_Social_L]§!입니다."
 SIA_democrat_trunk_entry_tt: "집권당은 §Y[conservatism_L]§!입니다."
 SIA_telecom_excise_favor: "통신 소비세 전환"
 SIA_telecom_excise_favor_desc: "통신 양허 수수료를 소비세로 전환하되, 가문 소유의 AIS가 선두를 유지하고 신규 진입자들이 부담을 떠안도록 구조화합니다. 국고와 고마워하는 기업 기반 모두 당신에게 보상합니다. 고위 사령부는 국가가 한 가문의 대차대조표를 위해 운영되고 있음에 주목합니다. §R쿠데타 위험이 증가합니다.§!"
 SIA_exim_myanmar_loan: "양곤에 대한 수출입은행 대출"
 SIA_exim_myanmar_loan_desc: "미얀마 군정에 완화된 조건의 국가 대출을 제공하며, 공교롭게도 이 자금은 가문 소유의 신 위성에서 위성 및 통신 서비스를 구매하는 용도로 지정됩니다. 가문 기업에는 깔끔한 계약이 되는 외교 정책 제스처입니다. 장군들이 놓치지 않는 교과서적인 이해 충돌입니다. §R쿠데타 위험이 증가합니다.§!"
 SIA_state_lottery_scheme: "정부 복권"
 SIA_state_lottery_scheme_desc: "지하 숫자 게임을 국가 제도에 편입합니다. 후원과 애착 사업을 위한 예산 외 현금이며, 도박꾼들에게 인기가 있고, 모든 쿠데타 성명이 가장 먼저 꼽는 종류의 책임 없는 기금입니다."
 SIA_democrat_machine_category: "정당 기구"
 SIA_democrat_machine_category_desc: "민주당의 강점은 조직이지만, 탁신의 조직은 언제나 농촌 압승 한 번이면 권력에 복귀할 수 있습니다. 방어선을 지키려면 지역구를 챙기십시오.\n\n§Y포퓰리즘 물결§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. 매주 1씩 오르며, 경기 침체나 안정도 하락 시에는 더 빠르고, 경제가 호황이고 나라가 평온해도 여전히 서서히 상승합니다. 이를 다시 낮추려면 아래의 결정, 이산 교두보, 또는 농촌 개발 패키지가 필요합니다. 35를 넘으면 안정도와 성장이 훼손됩니다. 70을 넘으면 훨씬 더 큰 손실이 따릅니다."
 SIA_constituency_machine: "지역구 챙기기"
 SIA_constituency_machine_desc: "의원들을 지역구로 돌려보내 진료소를 열고, 배수로를 고치고, 분쟁을 해결하며, 이름을 기억하게 합니다. 지루한 일이지만 의석을 지키는 유일한 방법입니다. §Y민주당 인기도가 상승하며§! 포퓰리즘 물결이 가라앉습니다."
 SIA_pt_pressure_increase_tt: "§R포퓰리즘 물결 [?pt_delta|0+]§! (현재 §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)"
 SIA_pt_pressure_decrease_tt: "§G포퓰리즘 물결 [?pt_delta|0+]§! (현재 §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)"
 SIA_match_the_populists: "포퓰리스트에 맞대응"
 SIA_match_the_populists_desc: "마을 기금을 이길 수 없다면 더 나은 것을 만드십시오. 민주당 깃발 아래 저렴한 의료, 채무 탕감, 농촌 신용을 제공합니다. 국고는 줄어들지만 프아 타이당에서 쟁점을 빼앗아 옵니다."
 SIA_expose_corruption: "네트워크 폭로"
 SIA_expose_corruption_desc: "반부패 기관과 법원을 포퓰리즘 기구로 돌립니다. 자산 사건, 매표 수사, 그리고 이미 한 건 이상의 탁신계 정부를 무너뜨린 긴 법정 투쟁입니다."
 SIA_broaden_the_coalition: "연립 확대"
 SIA_broaden_the_coalition_desc: "의석의 대가로 부처를 소수 정당과 지방 유력자들에게 넘깁니다. 대가는 분열되고 흥정에 바쁜 내각(§R연립의 요구§!)이지만, 어떤 단일 포퓰리즘 압승도 뚫을 수 없는 의회 방화벽을 구축합니다. §G포퓰리즘 물결이 크게 가라앉습니다.§!"
 SIA_counter_messaging: "포퓰리즘 메시지에 맞대응"
 SIA_counter_messaging_desc: "사람들이 실제로 듣는 곳에서 포퓰리즘 노선에 응수합니다. 아침 토크쇼, 마을 방송탑, 노조 회관입니다. 작지만 반복할 수 있는 압박이며, 프아 타이당의 추진력을 조금씩 깎아 냅니다."
 SIA_reconstruction_category: "수복 영토 개발"
 SIA_reconstruction_category_desc: "서부 변경 또는 ASEAN 패권 작전에서 점령한 영토는 확보되었으나 아직 통합되지 않았습니다. 지방을 안정시키고, 재건 자금을 쏟아붓고, 충분히 잠잠해지면 국가의 영토로 완전히 편입하십시오."
 SIA_reconstruction_pacify: "지방 안정화"
 SIA_reconstruction_pacify_desc: "점령 지방에 행정관, 정보원, 사면 프로그램을 쏟아붓습니다. 우리가 장악했으나 아직 통합하지 않은 모든 지방에서 순응도가 오릅니다. 느리고 인내심이 필요한 작업이지만, 다른 모든 것이 세워질 토대입니다."
 SIA_reconstruction_develop: "재건 사업 자금 지원"
 SIA_reconstruction_develop_desc: "수복한 영토 전역의 도로, 전력, 공공 사업을 위해 재건 자금을 투입합니다. 장악한 모든 지방에서 인프라와 건설 슬롯이 늘어나 그들을 국가 경제에 묶고 주민에게 태국 통치에 대한 이해관계를 부여합니다."
 SIA_reconstruction_integrate: "재통일 지방 선포"
 SIA_reconstruction_integrate_desc: "순응도가 충분히 높은 곳에서 점령은 끝나고 지방은 태국의 영토가 됩니다. 우리가 장악한 모든 안정된 지방이 왕국의 중핵으로 편입되며, 어떤 평화 회의도 되돌릴 수 없는 영구적 성과입니다."
 SIA_ghosts_5pct_tt: "§Y[communist_state_L]§!의 인기도가 최소 5%입니다."
 SIA_reform_5pct_tt: "§Y[socialism_L]§!의 인기도가 최소 5%입니다."
 SIA_reform_trunk_entry_tt: "집권당은 §Y[socialism_L]§!입니다."
 SIA_communist_trunk_entry_tt: "집권당은 §Y[communist_state_L]§!입니다."
 SIA_seize_power_gate_tt: "§Y총파업§!으로 정부가 항복할 수밖에 없었거나 §Y내전§!에서 승리했습니다."
 SIA_strike_momentum_tt: "§R파업 동력 [?strike_delta|0+]§! (현재 §Y[?ROOT.SIA_strike_momentum|0]§!/100). 100에 도달하면 정부가 항복합니다."
 SIA_strike_mass_pickets: "대규모 피켓 시위"
 SIA_strike_mass_pickets_desc: "수만 명의 파업 참가자들이 직장 밖 피켓 라인을 점거하고 며칠씩 도시 교차로를 지킵니다. 대규모 피켓 시위는 파업 위원회가 가장 자주 반복할 수 있는 수단이며, 전선이 유지되는 동안 직장을 닫아 둡니다.\n\n§Y7일§! 동안 지속되며, 종료 후 §Y20일§! 뒤에 반복할 수 있습니다. 30일 동안 작업장과 소매 수입을 멈춥니다."
 SIA_strike_paralyze_transport: "항만과 철도 마비"
 SIA_strike_paralyze_transport_desc: "파업 기금은 부두 노동자와 철도 노동자가 일을 멈추도록 보수를 지급하여 항만과 공급망을 통한 화물 흐름을 멈춥니다. 이는 운동이 쓸 수 있는 가장 큰 피해를 주는 행동이면서 유지하는 데도 가장 비용이 많이 듭니다. 중단이 이어지는 동안 기금이 파업 참가자의 임금을 부담하기 때문입니다.\n\n§Y7일§! 동안 지속되며, 종료 후 §Y30일§! 뒤에 반복할 수 있습니다. 인프라 1레벨을 파괴하고 30일 동안 자원 생산을 중단시킵니다."
 SIA_strike_win_the_conscripts: "징집병 포섭"
 SIA_strike_win_the_conscripts_desc: "조직가들은 시위대에 대한 군 투입에 반대하는 논거를 펴기 위해 징집병 병영에 들어갑니다. 타이 왕립 육군은 연간 추첨으로 병력을 채우며, 당이 수년간 조직해 온 농촌 북동부에서 크게 충원하므로 징집병이 장교들보다 더 수용적입니다. 신뢰도가 의심스러워지는 부대 하나하나가 정부의 선택지를 좁힙니다.\n\n§Y7일§! 동안 지속되며, 종료 후 §Y30일§! 뒤에 반복할 수 있습니다. 조직가를 병영으로 돌리는 것은 90일 동안 §R정치력 획득§!을 소모합니다."
 SIA_dti_materiel_manufacturer: "방위기술연구소"
 SIA_dti_rocket_arty: "국산 로켓 계획"
 SIA_dti_guided_mlrs: "DTI-1 유도 다연장로켓발사시스템"
 SIA_dti_dti1_saturation: "포화 일제 사격 교리"
 SIA_dti_dti1g_precision: "DTI-1G 정밀 유도"
 SIA_dti_rocket_mobility: "사격 후 이탈 발사대"
 SIA_dti_uav_program: "D-Eyes 무인기 계획"
 SIA_dti_c4isr_research: "C4ISR 연구반"
 SIA_dti_loitering_munition: "배회 탄약 생산 라인"
 SIA_dti_datalink: "전술 데이터링크 통합"
 SIA_dti_domestic_rifle: "국산 소총 연구개발"
 SIA_dti_advanced_optics: "첨단 광학 장비 일체"
 SIA_dti_munitions_line: "표준화 탄약 생산 라인"
 SIA_chaiseri_tank_manufacturer: "차이세리 메탈 앤 러버"
 SIA_chaiseri_mrap_expertise: "퍼스트 윈 MRAP 전문성"
 SIA_chaiseri_first_win: "폭풍 굴절 차체"
