 sov_economic.41.t: "¡La Iniciativa de Proyectos Nacionales Fracasó!"
 sov_economic.41.d: "El último informe del Ministerio de Economía revela que no hemos logrado alcanzar los objetivos de los Proyectos Nacionales. Este fracaso daña tanto nuestra reputación internacional como la confianza interna. ¿Cómo debemos responder a este revés?"
 sov_economic.41.o1: "Manipula los hechos; lo más importante es la estabilidad."
 sov_economic.41.o2: "Admite el fracaso con honestidad."
 sov_economic.42.t: "¡La Iniciativa de Proyectos Nacionales es todo un Exito!"
 sov_economic.42.d: "El Ministerio de Economía informa que hemos alcanzado los objetivos de nuestros proyectos nacionales. Este éxito demuestra la fortaleza y la capacidad de nuestro pueblo. Es un momento de orgullo para Rusia."
 sov_economic.42.o1: "¡Lo conseguimos! ¡Ura!"
 SOV_interrao_buy_pmr_gres_desc: "La Central Eléctrica de Cuciurgan lleva mucho tiempo en pésimas condiciones, y el Gobierno de §Y[PMR.GetNameWithFlag]§! está considerando la posibilidad de privatizarla y convertirla en nuestra propiedad, lo que nos permitiría reforzar nuestra influencia en este país y proporcionarles capacidad energética adicional."
 SOV_capitalisation_alrosa_tt: "La £text_icon_sov_ruble §Ycapitalización§! de £text_icon_sov_alrosa §YALROSA§! §Ycambiará§! en $§Y[?SOV_modify_capitalisation_alrosa]§! mil millones\n"
 SOV_Economy_stop_capitalisation_TT: "£text_icon_sov_ruble §YCapitalización§! de las empresas §Rdejará de cambiar§!"
 SOV_safe_russia: "Seguridad del País"
 SOV_safe_russia_desc: "Nuestro país es extenso y, para protegerlo de manera eficaz, necesitamos fuerzas amplias, junto con unidades y organismos especializados que trabajen las 24 horas del día para garantizar la seguridad de la nación."
 SOV_svr_desc: "El SVR es la principal agencia de inteligencia exterior de Rusia y opera bajo la autoridad del presidente. Es un servicio paramilitar estatal clave encargado de la inteligencia y las operaciones encubiertas en el extranjero."
 SOV_vimpel_omon_exp: "Grupo Vympel"
 SOV_vimpel_omon_exp_desc: "El Grupo Vympel, o Dirección V, es una unidad spetsnaz del FSB, a menudo denominada Dirección V del KGB. Es la unidad hermana del Grupo Alfa y se especializa en operaciones estratégicas bajo el mando del FSB."
 SOV_second_slujba: "Segundo Servicio"
 SOV_second_slujba_desc: "También conocido como el Servicio para la Protección del Orden Constitucional y la Lucha contra el Terrorismo, el Segundo Servicio combate el terrorismo, el extremismo y las amenazas políticas internas, protegiendo el orden constitucional de Rusia y manteniendo la contrainteligencia en ámbitos sociales y culturales delicados."
 SOV_inner_army: "Tropas Internas"
 SOV_inner_army_desc: "Las Tropas Internas del Ministerio del Interior son una fuerza paramilitar encargada del control de multitudes, la vigilancia de instalaciones críticas y el apoyo a las operaciones policiales. Han desempeñado un papel clave en conflictos internos como las Guerras de Chechenia."
 SOV_omon: "OMON"
 SOV_omon_desc: "OMON is a system of special police units within Russia's Ministry of Internal Affairs, originally formed in 1988. Known for riot control and paramilitary policing, OMON also operates in several post-Soviet states under similar roles."
 SOV_upravlenie_k: "Departamento K"
 SOV_upravlenie_k_desc: "El Departamento K del Ministerio del Interior se especializa en la lucha contra la ciberdelincuencia y el tráfico ilegal de dispositivos electrónicos y equipos de vigilancia."
 SOV_centr_t: "Centro para la Lucha contra el Extremismo"
 SOV_centr_t_desc: "Conocida como Centro E, esta unidad del Ministerio del Interior se centra en identificar y reprimir las actividades extremistas en toda Rusia."
 SOV_gusb: "Dirección General de Seguridad Interna"
 SOV_gusb_desc: "La Dirección General de Seguridad Interna es una unidad policial independiente dependiente del Ministerio del Interior encargada de prevenir la corrupción y los delitos internos, así como de garantizar la integridad del personal encargado de hacer cumplir la ley."
 SOV_sobr: "SOBR"
 SOV_sobr_desc: "SOBR es una unidad de respuesta rápida spetsnaz con entrenamiento y equipamiento militar. Trabaja junto con OMON y funciona como una fuerza táctica policial paramilitar desplegable para operaciones de alto riesgo."
 SOV_anti_corrupt_upravlenie: "Dirección General de Seguridad Económica y Lucha contra la Corrupción"
 SOV_anti_corrupt_upravlenie_desc: "Esta dirección lidera los esfuerzos del Ministerio del Interior para combatir los delitos económicos y la corrupción, implementando las políticas estatales y las regulaciones legales para proteger la seguridad económica de Rusia."
 SOV_gru: "GRU"
 SOV_gru_desc: "El GRU es la agencia de inteligencia militar exterior de Rusia dependiente del Estado Mayor. Comanda la inteligencia militar y las fuerzas spetsnaz, y es conocido por llevar a cabo operaciones complejas y de alto riesgo en todo el mundo, informando al Ministerio de Defensa."
 SOV_gru_spetznaz: "Spetsnaz GRU"
 SOV_gru_spetznaz_desc: "Las Spetsnaz GRU son las unidades de fuerzas especiales del GRU, encargadas de llevar a cabo operaciones militares encubiertas y misiones de inteligencia en el extranjero."
 SOV_zaslon: "Zaslón"
 SOV_zaslon_desc: "Zaslón es una unidad especial altamente clasificada del SVR formada en 1997. Proporciona apoyo militar para operaciones de inteligencia en el extranjero, protege las misiones diplomáticas rusas y garantiza la seguridad de los líderes del SVR durante misiones de alto riesgo."
 SOV_outer: "Inteligencia Extranjera"
 SOV_outer_desc: "Nuestra seguridad nacional depende de lo bien que vigilemos y debilitemos a nuestros adversarios. Debemos permanecer alerta ante cualquier enemigo que intente socavarnos."
 SOV_alpha_idea: "Unidad Especial Alfa"
 SOV_alpha_idea_desc: "Una unidad especial del Centro de Propósito Especial del Servicio Federal de Seguridad de la Federación de Rusia. Las tareas principales de la Dirección A incluyen la realización de operaciones especiales de seguridad para prevenir actos terroristas, la búsqueda, neutralización o eliminación de terroristas y la liberación de rehenes. Los combatientes del Grupo Alfa también llevan a cabo otras operaciones de alta complejidad del FSB y operan en zonas de conflicto activo."
