l_english:
 # Operation Blue Tiger milestone 10: reserve mobilization
 OBT_mob_crisis_condition_tt: "Cross-Strait Tension is at §YCrisis§! or higher, Taiwan is under blockade, or Taiwan is at war with China"
 OBT_mob_war_condition_tt: "Taiwan is at war with China, or Cross-Strait Tension is at §YBrink§! (80 or higher)"
 OBT_reserve_readiness_at_least_20_tt: "Reserve Readiness is at least §Y20§!"
 OBT_mob_partial: "Partial mobilization is active"
 OBT_mob_general: "General mobilization is active"
 OBT_mob_cooldown: "Taiwan demobilized less than a year ago"
 OBT_reserve_program: "The Reserve Readiness Program is running"
 OBT_reserve_program_cost: "Reserve Readiness Program"
 OBT_partial_mobilization: "Partial Mobilization"
 OBT_general_mobilization: "General Mobilization"
 OBT_start_reserve_program_tt: "Reserve Readiness rises by §G2§! a month while the program runs (otherwise it falls by 1 a month, to no lower than 10)."
 OBT_start_reserve_program: "Launch the Reserve Readiness Program"
 OBT_start_reserve_program_desc: "Keep reserve rosters current, store equipment where units will gather, and train the cadres who will lead them. The program costs political capital every day it runs."
 OBT_end_reserve_program: "End the Reserve Readiness Program"
 OBT_end_reserve_program_desc: "Stop the program and save its political cost. Readiness will slowly decline."
 OBT_reserve_refresher_recall_tt: "Reserve Readiness §G+8§!."
 OBT_reserve_refresher_recall: "Annual Reserve Refresher Recall"
 OBT_reserve_refresher_recall_desc: "Call reservists back for five to seven days of refresher training, as the armed forces did each year in the late 1990s. Employers and families notice."
 OBT_partial_mobilization_dec_tt: "§Y4§! reserve infantry brigades arrive in two groups, after §Y15§! and §Y30§! days. They draw equipment and manpower from the stockpile as they fill."
 OBT_partial_mobilization_dec: "Partial Mobilization"
 OBT_partial_mobilization_dec_desc: "Call up the first reserve brigades. They gather over the next month with whatever equipment the depots hold, and they will be far less trained than the regular army."
 OBT_general_mobilization_dec_tt: "Up to §Y8§! more reserve infantry brigades arrive in pairs every §Y15§! days, §Y12§! in total."
 OBT_general_mobilization_dec: "General Mobilization"
 OBT_general_mobilization_dec_desc: "Call up every reserve brigade the system can form. The economy will slow sharply while factories lose their workers."
 OBT_demobilize_reserves_tt: "Every mobilized reserve brigade is disbanded. Their manpower and equipment return to the pool."
 OBT_demobilize_reserves: "Demobilize the Reserves"
 OBT_demobilize_reserves_desc: "Send the reserve brigades home. Their men and equipment return to the pool, and the economy recovers. Mobilizing again will not be possible for a year."
 OBT_reserve_category: "Reserve Mobilization"
 OBT_reserve_category_desc: "Reserve Readiness: §Y[?TAI.OBT_reserve_readiness|0]§! / 100. Mobilized brigades: §Y[?TAI.OBT_mob_spawned|0]§!.\n\nReserve formations do not exist in peacetime. Preparation raises readiness, which decides how experienced the brigades are when they are called up. Partial mobilization raises §Y4§! brigades in a crisis; general mobilization raises up to §Y12§! in a war with China. Brigades fill from the equipment stockpile, the economy pays while they serve, and demobilization sends them home with a one-year cooldown."
