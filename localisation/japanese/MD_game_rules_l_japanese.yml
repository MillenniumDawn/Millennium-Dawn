l_japanese:
 MD_RULES: "さまざまなルール"
 RULE_REMOVE_MICRO_STATES: "国家を削除"
 RULE_NO_RULE_REMOVE_MICRO_STATES_DESC: "ゲーム開始時に、いかなる国も削除されない。"
 RULE_DISABLE_NATO: "NATOを無効化"
 RULE_YES_DISABLE_NATO_DESC: "NATOはゲームロード時に無効化される。"
 RULE_NO_DISABLE_NATO_DESC: "NATOは陣営として残る。"
 RULE_DISABLE_EU: "EUを無効化"
 RULE_YES_DISABLE_EU_DESC: "全ての国がEUから離脱する。"
 RULE_NO_DISABLE_EU_DESC: "EUは存続する。"
 RULE_DISABLE_ANTI_BULLY: "厭戦感情を無効化"
 RULE_YES_ANTI_BULLY_DESC: "厭戦感情システムを無効化し、ペナルティなしで戦争屋になることができる。"
 RULE_NO_ANTI_BULLY_DESC: "厭戦感情システムが有効になる。"
 RULE_SALAFIST_BRANCH: "サラフィー主義への分岐を有効にする"
 RULE_YES_SALAFIST_BRANCH_DESC: "開始時の宗教に関係なく、すべての国の汎用ツリーでサラフィー主義への分岐を有効にする。"
 RULE_NO_SALAFIST_BRANCH_DESC: "イスラム系の国家でのみ、汎用ツリーでサラフィー主義への分岐を有効にする。"
 RULE_ENABLE_DIVISION_LIMITER: "AI師団制限を有効化"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "AI師団制限の無効化\n\nデフォルトでは、AIが生産できる師団数に制限はない。パフォーマンス上の理由で師団数を制限したい場合は、この機能を有効化すればよい。"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "AI師団制限を有効化\n\n有効にすると、AIが師団を生成する頻度が低下し、よりスムーズなゲーム体験を実現する。プレイヤーは比較的平穏な状態でプレイできる！"
 RULE_OPTION_POTATO_EDITION: "ジャガイモ版"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "ジャガイモ版AI師団制限を有効化\n\n性能上の理由から、さらにAIを制限する。\n"
 RULE_ALLOW_CHEAT_DECISIONS: "チートディシジョンを許可"
 RULE_YES_ALLOW_CHEAT_DECISIONS_DESC: "チートディシジョン有効"
 RULE_NO_ALLOW_CHEAT_DECISIONS_DESC: "チートディシジョン無効"
 RULE_ALLOW_TOGGLING_CHEAT_DECISIONS: "§Y（マルチプレイヤー）§!チートディシジョンを全体で切り替えられるようにする"
 RULE_YES_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y（オプション）§!\n\n全体チートディシジョンを有効化\n§Y注：§!世界中のどの国でも「チートディジション」を切り替えることができ、その効果は§Y全世界§!に及ぶ。どの国が切り替えたかを示すイベントがポップアップ表示される。\n§Yマルチプレイでこのディシジョンの使用が許可されていることを確認したほうがいい！§!\n\n§Y注：§!チートを使用する場合は、ゲームルールの「チートディジションを許可する」を有効にする必要がある！"
 RULE_NO_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y（オプション）§!\n\n全体チートディシジョンを無効化\n§Y注：§!世界中のどの国でも「チートディジション」を切り替えることができ、その効果は§Y全世界§!に及ぶ。どの国が切り替えたかを示すイベントがポップアップ表示される。\n§Yマルチプレイでこのディシジョンの使用が許可されていることを確認したほうがいい！§!\n\n§Y注：§!チートを使用する場合は、ゲームルールの「チートディジションを許可する」を有効にする必要がある！"
 RULE_ALLOW_RECALL_INTERVENTION_FORCES: "介入部隊の召還を可能にする"
 RULE_YES_ALLOW_INTERVENTION_FORCES: "§Yデフォルト§!各国からの介入部隊の召還が可能になる。"
 RULE_NO_ALLOW_INTERVENTION_FORCES: "外国での紛争から介入部隊を撤退させることはできない。"
 RULE_OPTION_MD_DEFAULT: "デフォルトAI動作"
 RULE_OPTION_MD_DEFAULT_AI_DESC: "AIは史実での選択を若干重視しながら、ランダムに国家方針を選択する。世界情勢と国家の状態は選択に若干の影響を与える。"
 RULE_OPTION_RANDOM_DESC: "AIのたどる道は、カオスにならない程度にランダムに選ばれる。"
 RULE_OPTION_PUTIN: "統一ロシア"
 RULE_OPTION_PEACEFUL_REFORM: "リベラルなロシア"
 RULE_OPTION_THE_RED_MENACE: "赤の脅威"
 RULE_OPTION_RISE_OF_RUSSIA: "ジリノフスキーのロシア"
 NIG_AI_BEHAVIOR: "@NIG ナイジェリア連邦共和国"
 RULE_OPTION_RISE_OF_BOKO_HARAM: "ボコハラムの台頭"
 RULE_OPTION_RISE_OF_BOKO_HARAM_AI_DESC: "ボコ・ハラムがナイジェリアを支配できるよう圧力をかける。"
 RULE_OPTION_PDP_EMPOWERED: "人民民主党"
 RULE_OPTION_PDP_EMPOWERED_AI_DESC: "人民民主党はナイジェリア最大の政党の1つである。主にキリスト教と非同盟的イデオロギーを擁護する。"
 RULE_OPTION_ANPP_EMPOWERED: "全ナイジェリア人民党"
 RULE_OPTION_ANPP_EMPOWERED_AI_DESC: "全ナイジェリア人民党（2017年においては進歩民主党会議）は、2000 年のナイジェリアの主要野党である。ヨーロッパの社会民主主義に非常に似ており、ナイジェリアの主要な改革を推進している。"
 FRA_AI_BEHAVIOR_MD: "@FRA France"
 RULE_OPTION_FRA_HISTORICAL: "Historical"
 RULE_OPTION_FRA_HISTORICAL_DESC: "The Fifth Republic holds its course as the presidency passes from Chirac to Sarkozy, then Hollande and Macron, with the §8Republicans§! and the centre trading office between them. France anchors European integration and keeps its hand on the Françafrique sphere."
 BRM_AI_BEHAVIOR: "@BRM ミャンマー連邦"
 RULE_OPTION_BEACON_OF_DEMOCRACY: "民主主義の篝火"
 RULE_OPTION_BEACON_OF_DEMOCRACY_AI_DESC: "ミャンマーは妥協なく改革を追求し、迅速にNLDを権力の座につける。軍に譲歩する代わりに、ミャンマーは民族反乱グループを含む政治的自由化の様々な支持者を動員し、軍の政治への影響力を最終的に終わらせることを目指す。"
 RULE_OPTION_AN_IRON_FIST: "鉄拳"
 RULE_OPTION_AN_IRON_FIST_AI_DESC: "このゲームルールは2000年で開始時にのみ適用され、ミャンマーは独裁制を維持し、史実で行ったように改革するための圧力に前向きに応じる代わりに、弾圧と全体主義で対応する。さらに、正当性の喪失から気をそらすために、軍事政権は国内の反乱グループだけでなく隣国との戦争も追求する。"
 RULE_OPTION_NORTHERN_AMBITION: "北方の野望"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "スウェーデンで極右の人気が急上昇し、北ヨーロッパにスウェーデン帝国を確立しようとする動きに発展するだろう。"
 SYR_AI_BEHAVIOR: "@SYR シリア・アラブ共和国"
 RULE_OPTION_SYR_HISTORICAL: "史実AI"
 RULE_OPTION_SYR_HISTORICAL_DESC: "ハーフェズ・アル＝アサドは長男バシャール・アル＝アサドに跡を継がせる。バシャールは外交、軍事、経済にバランスよく焦点を当て、シリアをロシアの同盟国として維持するだろう。"
 RULE_OPTION_SYR_IRON_LADY: "シリアの鉄の女"
 RULE_OPTION_SYR_IRON_LADY_DESC: "ハーフェズ・アル＝アサドは娘のブシュラ・アル＝アサドに跡を継がせる。ブシュラは大国間でより中立的なアプローチを取り、外交と経済に焦点を当てる。"
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "シリアの野獣"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "ハーフェズ・アル＝アサドは末っ子のマーヘル・アル＝アサドに跡を継がせる。マーヘルは軍事と経済の拡大に焦点を当て、大シリアを形成し、中東に新たな勢力を築こうとするだろう。"
 RULE_OPTION_SYR_NEW_ASSAD: "新たなアル＝アサド"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "ハーフェズ・アル＝アサドはダマスカスの春の後、兄弟のリファート・アル＝アサドに跡を継がせる。リファートは外交と経済に焦点を当てたサウジアラビア寄りの政策を行うだろう。"
 RULE_OPTION_SYR_DAMASCUS_SPRING: "ダマスカスの春"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "シリアはダマスカスの春運動に乗っ取られ、民主主義に変わる。"
 BHR_AI_BEHAVIOR: "@BHR バーレーン"
 SAU_AI_BEHAVIOR: "@SAU サウジアラビア王国"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST: "国際ジハード - GCCを優先"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST_AI_DESC: "サウジアラビアは経済改革を試み、GCCを超国家として統一しようとする。その後、サウジ王家はアルカイダの蜂起によって打倒され、暴力的手段によって原理主義イデオロギーを広めようとする過激派イスラム国家の設立につながる。"
 RULE_OPTION_GLOBAL_JIHAD: "国際ジハード"
 RULE_OPTION_GLOBAL_JIHAD_AI_DESC: "サウジ王家はアルカイダの蜂起によって打倒され、暴力的手段によって原理主義イデオロギーを広めようとする過激派イスラム国家の設立につながる。"
 RULE_OPTION_ISLAMIC_AWAKENING: "イスラムの目覚め"
 RULE_OPTION_ISLAMIC_AWAKENING_AI_DESC: "ムスリム同胞団の影響を受けたサフワ、または覚醒運動は、サウジ王政に圧力をかけ、多元的イスラム民主主義に道を譲らせることに成功する。"
 RULE_OPTION_RETURN_OF_THE_BAATH: "バアスの帰還"
 RULE_OPTION_RETURN_OF_THE_BAATH_AI_DESC: "サウジアラビアは徐々に自由化し、社会アラブ民族主義というバアス党の独自のイデオロギーが国内で足場を得る機会を提供する。バアス党化したアラビアは中東から外国軍を追放し、自国の領土を拡大しようとする。"
 RULE_OPTION_SHIA_REVIVAL: "シーア派の復興"
 RULE_OPTION_SHIA_REVIVAL_AI_DESC: "シーア派は政治的自由化によって提示された機会を利用してサウジアラビアを掌握し、イランとロシアの同盟国となる。"
 BRI_AI_BEHAVIOR: "@ENG イギリス"
 RULE_OPTION_RULE_BRITANNIA: "統べよ、ブリタニア"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Once, this sceptered isle was known and feared the world over. The British monarch presided over the empire upon which the sun never set. Now however, Britain's international position has fallen into decline. A mere lackey of the United States, a shadow of its former self. The time has come for the British Empire to be restored. The Crown's partisans will break the two-party system, build their movement through the decade and take power outright in 2010 - and then the fleet sails.\n"
 MD_RANDOM_RULES: "ゲームルールをランダム化する"
 RULE_RANDOM_IDEOLOGIES: "世界観をランダム化"
 RULE_RANDOM_IDEOLOGIES_NO_DESC: "すべての国家は歴史的な世界観を維持する"
 RULE_RANDOM_IDEOLOGIES_YES_DESC: "すべての国家はランダムな世界観をもつようになる"
 RULE_RANDOM_RELIGION: "宗教観をランダム化"
 RULE_RANDOM_RELIGION_NO_DESC: "全ての国は歴史的宗教観を維持する。"
 RULE_RANDOM_RELIGION_YES_DESC: "全ての国の宗教観をランダムにする。"
 RULE_RANDOM_INTERNAL_FACTIONS: "内部派閥をランダム化"
 RULE_RANDOM_INTERNAL_FACTIONS_NO_DESC: "全ての国が歴史的な内部派閥を維持する。"
 RULE_RANDOM_INTERNAL_FACTIONS_YES_DESC: "全ての国の内部派閥をランダムにする。"
 RULE_INFLUENCE_COOLDOWN: "投資影響力獲得クールダウン"
 RULE_14_DAY_INFLUENCE: "14日間のクールダウン"
 RULE_14_DAY_INFLUENCE_DESC: "デフォルトのオプション。投資により影響力を獲得するクールダウンは14日に設定される。クールダウン期間中も投資は可能であるが、影響力は得られない。"
 RULE_0_DAY_INFLUENCE: "クールダウンなし"
 RULE_0_DAY_INFLUENCE_DESC: "昔ながらのオプション。投資に対する影響力の獲得に上限はない。バランスを重視する方にはおすすめできない。"
 RULE_30_DAY_INFLUENCE: "30日間のクールダウン"
 RULE_30_DAY_INFLUENCE_DESC: "マルチプレイにおいて推奨されるオプション。クールダウンがデフォルトの倍（30日）になる。クールダウン期間中も投資は可能であるが、影響力は得られない。"
 ITA_AI_BEHAVIOR_MD: "@ITA Italy"
 BOT_AI_BEHAVIOR: "@BOT ボツワナ"
 RULE_ALLOW_EDGY_FLAGS: "過激な国旗を許可する"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "物議を醸すいくつかの国旗を非表示にする。"
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "物議を醸すいくつかの国旗を表示する。"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN: "影響力拡大の獲得量"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN_DESC: "影響力拡大からの影響力獲得量を変更する。"
 RULE_SPREAD_INFLUENCE_GAIN_0_5: "0.5%"
 RULE_SPREAD_INFLUENCE_GAIN_0_5_DESC: "拡大行動ごとに0.5%の影響力を獲得。影響力獲得を本当に遅くしたい場合に。"
 RULE_SPREAD_INFLUENCE_GAIN_2: "2%"
 RULE_SPREAD_INFLUENCE_GAIN_2_DESC: "拡大行動ごとに2%の影響力を獲得。影響力獲得を本当に増強したい場合に。"
 RULE_SPREAD_INFLUENCE_GAIN_4: "4%"
 RULE_SPREAD_INFLUENCE_GAIN_4_DESC: "拡大行動ごとに4%の影響力を獲得。影響力獲得を本気で増強したい場合に。"
 RULE_SPREAD_INFLUENCE_AMOUNT_COOLDOWN: "影響力拡大クールダウン"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN: "30日"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN_DESC: "デフォルトのクールダウン。30日に一度、他国に影響力を広げることができる。"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN: "14日"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN_DESC: "14日に一度、他国へ影響力を広げることができる。"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN: "クールダウンなし"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "影響力を広めるためのクールダウンがないため、§H政治力§!の全てを他国への影響力に投じたい時に。"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60日"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "60日に一度、他国に影響力を広げることができる。"
 RULE_INVEST_INFLUENCE_AMOUNT_GAIN: "投資影響力増加"
 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "誰かがあなたの投資を受け入れるたびに1%の影響力を得る。"
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "誰かがあなたの投資を受け入れるたびに0.5%の影響力を得る。"
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
 RULE_INVEST_DEFAULT_GAIN_2_DESC: "誰かがあなたの投資を受け入れるたびに2%の影響力を得る。"
 LIC_AI_BEHAVIOR: "@LIC リヒテンシュタイン"
 RULE_DISABLE_FORMABLE_NATIONS: "国家形成を無効化"
 RULE_YES_FORMABLE_NATIONS_DESC: "国家形成のディシジョンを無効化する"
 RULE_NO_FORMABLE_NATIONS_DESC: "国家形成が可能になる"
 RULE_ALLOW_ENABLE_LEDGER: "MD台帳を有効化"
 RULE_ALLOW_ENABLE_LEDGER_YES_DESC: "MD台帳が有効になる。(La Resistance の諜報元帳の一部の情報は不要になる場合がある。より難しいゲームを望む場合は、この機能を無効にしてほしい。)"
 RULE_ALLOW_ENABLE_LEDGER_NO_DESC: "MD台帳を無効にする。これは、より本格的な体験を好み、La Resistance を利用して重要な情報を取得したいプレイヤー向けだ。"
 RULE_HARD_AI_ECONOMIC: "経済AI"
 RULE_DISABLE_HARD_AI_ECONOMIC: "標準制限"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "AIに対する標準的な制限であり、経済力を強化することを許可しない。史実プレイ向け。"
 RULE_ENABLE_HARD_AI_ECONOMIC: "制限なし"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "AIがいつも経済危機から抜け出せないのに飽きたプレイヤー向け。AIはもはや経済に関するディシジョンに制限されない。多くの国がプレイヤーより豊かになる覚悟をしておこう。恐れ知らずのチャレンジャー向け。バトルAIよりご挨拶(・_<)"
 MD_AI_RULES: "AIオプション"
 MD_PEACE_DEALS: "講和会議"
 MD_FOCUS_TREE_RULES: "国家方針ツリーオプション"
 MD_FORMABLE_RULES: "国旗と建国可能な国家"
 MD_ORGANISATION_RULES: "組織オプション"
 MD_INFLUENCE_RULES: "影響力システムオプション"
 MD_OPTIMISATION_RULES: "最適化とパフォーマンス"
 MD_NUCLEAR_RULES: "核オプション"
 MD_CHEAT_RULES: "チートオプション"
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "AIの債務戦争"
 RULE_DISABLE_AI_DEBT_WAR: "無効"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "これにより、AIの債務戦争が無効になる。AIは債務不履行に陥った国を侵略する選択肢を選ぶことはなくなる。"
 RULE_ENABLE_AI_DEBT_WAR: "有効"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "この設定により、AIに対する債務不履行が発生した場合、AIが債務戦争を宣言する可能性がある。"
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "混沌の和平交渉を有効化"
 RULE_OPTION_CHAOTIC_PC_NO: "無効"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "この設定により、AI講和会議で誰もが土地を奪い合うのを阻止できる。\n請求権行使が可能な国を主要国と陣営指導国に制限することで実現される。（これは AIにのみ影響し、プレイヤーには影響しない。）"
 RULE_OPTION_CHAOTIC_PC_YES: "有効"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "§Yロシア§!を12個に分割することができるというのに、なぜ世界は1つの§Yロシア§!しか認めないのだろうか！という意見をお持ちの邪悪な講和会議が大好きな人向け。\n（この設定から生じる結果に私は責任を負いません！）"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "プレイヤー主導の講和会議を有効化"
 RULE_OPTION_PLAYER_LED_PC_NO: "無効"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "この設定により、AIはたとえ愚かであっても、独自の選択を行うことができる。"
 RULE_OPTION_PLAYER_LED_PC_YES: "有効"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "AIが丸い釘を丸い穴に打ち込むことを信頼していない人向け。これにより、講和会議中はプレイヤーのみが主張できるようになる。"
 RULE_OPTION_DEMOCRAT: "民主党寄り"
 RULE_OPTION_DEMOCRAT_AI_DESC: "アメリカ合衆国は民主党の指導者を選出し、現代的な意味で、国家統治において中道左派のコンセンサスに向かって国を維持しようとする。"
 RULE_OPTION_REPUBLICAN: "共和党寄り"
