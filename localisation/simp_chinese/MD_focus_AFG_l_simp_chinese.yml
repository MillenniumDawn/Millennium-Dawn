l_simp_chinese:
 afghanistan_focus: "阿富汗国策树"
 AFG_civil_war: "打击塔利班"
 AFG_civil_war_desc: "我们的国家已经被极端分子所分裂。我们现在已经山穷水尽，为了维持我们的生活方式而战。我们必须反击这些想要撕裂我们国家的恐怖分子。"
 AFG_enlisting_personal: "招募人员"
 AFG_enlisting_personal_desc: "我们需要与当地村里的长老接触，并努力争取年轻人加入到与塔利班的斗争中来。"
 AFG_foreign_loyalist: "阿富汗少数民族民兵"
 AFG_foreign_loyalist_desc: "阿富汗的许多少数民族正在逃离塔利班的压迫。这些少数民族大多与周边国家的少数民族同族。我们可以动员那些逃离塔利班并希望为我们而战的人，也可以从邻国招募志愿者。"
 AFG_updating_equipment: "更新我们的装备"
 AFG_updating_equipment_desc: "我们的士兵正在用过时的装备与塔利班作战，如果我们要赢得这场战争，我们需要为他们提供更好的装备。"
 AFG_infrastructure_equal_war: "道路在战争中至关重要"
 AFG_infrastructure_equal_war_desc: "即使是古罗马人也知道，战争的正常进行需要合适的道路。我们需要修建这些道路，为我们所控制的部分国家提供补给，否则我们根本无法赢得这场战争。"
 AFG_foreign_equipment: "俄罗斯武器"
 AFG_foreign_equipment_desc: "由于塔利班支持车臣叛军，俄罗斯人已经对塔利班感到厌恶。因此，他们决定向我们提供一些老旧的苏联时期武器。"
 AFG_minor_military_construction: "小型武器制造"
 AFG_minor_military_construction_desc: "我们没有军工生产可言，也根本没有工业。然而，为了与塔利班作战，我们需要能够在国内生产一些武器，这样才能在这场战争中保证部队的供给。"
 AFG_adjusting_our_economy: "调整我们的经济"
 AFG_adjusting_our_economy_desc: "随着内战愈演愈烈，一支庞大的警察队伍对我们来说用处不大。我们应该把为数不多的资源用于医院，以改善士兵的状况。"
 AFG_better_officers: "军官教育"
 AFG_better_officers_desc: "我们再次需要将警察培训资源转向更紧迫的问题，即对我们的军官进行适当的军事教育。他们必须像利刃一样锋利，才能在战场上领导我们的士兵。"
 AFG_elite_help: "山地作战单位"
 AFG_elite_help_desc: "我们控制的巴达赫尚省，居住着大量熟悉地形的塔吉克族人，其中相当一部分人参与了苏阿战争。虽然他们中的大多数人已经到了中年，但他们仍然准备好并愿意为我们国家的生存而战。"
 AFG_enhanced_recruitment_efforts: "加强征兵工作"
 AFG_enhanced_recruitment_efforts_desc: "我们输不起这场战争，是时候让国民明白这一点了，我们需要加大征兵力度。"
 AFG_going_offensive: "开始我们的进攻"
 AFG_going_offensive_desc: "我们已经坐视不管了太久，捍卫我们所剩无几。现在是我们开始与塔利班战斗并夺回曾经属于我们的东西的时候了。"
 AFG_getting_new_tech: "获得新技术"
 AFG_getting_new_tech_desc: "我们打仗的方式还停留在20世纪。我们需要投资新技术并实现军队现代化。面对优势敌军，是时候用火力压制他们了。"
 AFG_planes: "启动我们的空军"
 AFG_planes_desc: "我们没有飞机可言，但如果我们主宰天空，我们就更容易击退塔利班。"
 AFG_specialize_equipment: "专用设备"
 AFG_specialize_equipment_desc: "如果我们要赢，我们需要确保我们拥有尽可能多的优势超过塔利班。"
 AFG_cars_over_donkeys: "美国悍马"
 AFG_cars_over_donkeys_desc: "虽然我们的驴子在山区环境中表现不错，但它们在平地上却表现不佳。当我们需要击退敌人时，速度是至关重要。我们会提议从美国人购买一些旧悍马车。"
 AFG_fuel_for_economy: "为经济注入燃料"
 AFG_fuel_for_economy_desc: "我们的经济一团糟，全国各地的腐败猖獗，我们需要稳定局势，我们不仅要赢得战争，还要为最终的重建进程。"
 AFG_war_experience: "战争经验"
 AFG_war_experience_desc: "长期的战争让我们能够从过去的错误中学习和适应，让我们在此过程中改进我们的军事和战术。"
 AFG_army_budget: "军队预算"
 AFG_army_budget_desc: "即使目前军队有所改进，如果我们要保持高昂的士气以帮助我们赢得战争，我们还需要为武装部队提供更多资金。"
 AFG_improving_our_economy: "意外之喜"
 AFG_improving_our_economy_desc: "虽然我们一直在改变我们的国家，以帮助赢得与塔利班的战争，但这也带来了意想不到的好处，即略微改善了我们的经济，甚至改善了我们与国际投资者的关系。尽管许多投资者仍然对涉足一个饱受战争蹂躏的国家持谨慎态度。"
 AFG_equipment_production: "装备生产"
 AFG_equipment_production_desc: "在开始我们的设备生产后，我们很快就想到了改进设计的方法。"
 AFG_large_equipment_production: "大型设备生产"
 AFG_large_equipment_production_desc: "我们决定在国内生产设备上投入更多资金。这意味着我们迟早会战胜塔利班。"
 AFG_huge_equipment_production: "大规模装备生产"
 AFG_huge_equipment_production_desc: "即使我们国家经济微薄，我们的领导人也意识到是时候将我们拥有的一切投入国内军事生产，以便我们最终击败塔利班。"
 AFG_loyal_guards: "忠诚卫兵"
 AFG_loyal_guards_desc: "我们必须选拔绝对效忠于艾哈迈德·沙阿·马苏德的护卫，他们忠诚到愿以生命为代价守护他。"
 AFG_elite_guards: "精英卫队"
 AFG_elite_guards_desc: "必须确保领导人身边的近身护卫皆为顶尖战力，他们需经过严苛训练且素质超群，绝不容塔利班刺客获得任何可乘之机。"
 AFG_the_end_of_war: "战争的终结"
 AFG_the_end_of_war_desc: "最后……我们的国家免受塔利班的猛攻，我们的领导人引导我们走向胜利，赞美真主让他正义的儿女赢得这场可怕的战争。"
 AFG_civil_war_recovery: "从内战中恢复"
 AFG_civil_war_recovery_desc: "我们终于打败了塔利班，夺回了我们的国家，现在是时候集中精力恢复经济了。在内战期间，我们的经济遭受了重大打击。"
 AFG_pleasing_the_ulema: "求助伊玛目"
 AFG_pleasing_the_ulema_desc: "内战的部分根源在于宗教分歧。我们仍然信仰伊斯兰教，但我们对伊斯兰教的解释与塔利班不同。在坚决击败他们之后，我们需要确保我们忠诚的伊玛目们同意我们的统治方式。"
 AFG_rebuild_mosques: "重建清真寺"
 AFG_rebuild_mosques_desc: "自1978年二月革命以来，我国经历了无休止的冲突和战争，许多清真寺不幸被毁或年久失修，现在是时候恢复它们昔日荣光了。"
 AFG_spread_our_religion: "传播我们的宗教"
 AFG_spread_our_religion_desc: "我国拥有大量虔诚的穆斯林，而我国经济正处于大幅振兴过程中，我们应通过我国公民与邻国公民之间的国际互动，传播我们对伊斯兰教的解释和愿景。"
 AFG_un_troops: "联合国维和部队"
 AFG_un_troops_desc: "内战结束后，我国大部分地区都已成为废墟，迄今为止，我们仍无法完全控制这些地区。我们应该请求联合国维和人员协助我国军队巡逻。"
 AFG_sticking_with_opium: "坚持鸦片经济"
 AFG_sticking_with_opium_desc: "过去生产和销售大量鸦片的模式对我们一直很有效。正如俗话说，如果没坏，就不要修。"
 AFG_industrial_economy: "工业化"
 AFG_industrial_economy_desc: "现在是我们开始工业化以建设经济的时候了。我们需要建造大量工厂，生产国民日常生活所需的各种产品。"
 AFG_changing_our_economy: "我们的未来经济"
 AFG_changing_our_economy_desc: "我们正站在十字路口；我们必须决定，是要加倍发展目前以鸦片为基础的经济，还是要努力实现国家的工业化？"
 AFG_opium_barons: "鸦片大亨"
 AFG_opium_barons_desc: "随着我们扩大市场，某些派系也相应增加了他们在市场上的影响力。这些派系有效地控制了鸦片市场。"
 AFG_focusing_on_infrastructure: "夷平鸦片田"
 AFG_focusing_on_infrastructure_desc: "是时候摆脱我们国家的鸦片种植了。我们必须实现经济现代化，为我们的工业雄心铺平道路。"
 AFG_selling_large_quantities: "大量出售鸦片"
 AFG_selling_large_quantities_desc: "我们已实现对鸦片生产的集中管控，这将带来巨额利润。现在正是出售部分库存、实现盈利的好时机。"
 AFG_focusing_on_factories: "启动我们的工业"
 AFG_focusing_on_factories_desc: "大部分罂粟田都被夷为平地，是时候在这片空地上兴建工厂了，好让我们的人民能从我们的努力中受益。"
 AFG_relief_effort: "救济行动"
 AFG_relief_effort_desc: "联合国眼看着我们的国家被内战撕裂，却没有多大介入。然而，在尘埃落定之后，维和部队的到来起到了稳定因素的作用，联合国决定提供资金帮助我们进一步重建和稳定我们的国家。"
 AFG_building_society: "重建我们的社会"
 AFG_building_society_desc: "我们的大部分预算都用于战争期间的部队。现在我们不再需要应对塔利班的威胁，联合国要求我们将精力集中在我们的社会和照顾人民上。"
 AFG_wounded_veterans: "退伍军人的创伤护理"
 AFG_wounded_veterans_desc: "我们的大部分人口都经历了战争的恐怖。我们必须努力为那些受伤最重的人提供治疗，这不仅是为了我们国家的复苏，也是为了将来能够汲取我们退伍军人的专业知识。"
 AFG_economic_recovery: "部分恢复"
 AFG_economic_recovery_desc: "在联合国的帮助下，到目前为止，我们在复苏的道路上取得了良好的进展。我们已经不必再为基本生存而挣扎，终于可以着手提升国内民众的生活水平了。"
 AFG_un_troops_removal: "联合国部队撤离"
 AFG_un_troops_removal_desc: "我们在稳定国家方面取得了巨大进展，因此不再需要联合国维和人员协助在我国境内巡逻。"
 AFG_tribes_or_cities: "部落或城市"
 AFG_tribes_or_cities_desc: "部落政治与现代化政治的鲜明对比一直是阿富汗政治进程的一部分，这是建设现代阿富汗过程中无法回避的问题。我们必须审慎抉择，是固守旧制，还是采纳更为现代的制度。"
 AFG_the_mountains: "部落"
 AFG_the_mountains_desc: "部落是阿富汗的支柱，我们不能为了鼓励国际资本的增长而冒着失去稳定和民族认同的风险。"
 AFG_the_rural_areas: "发展农村地区"
 AFG_the_rural_areas_desc: "我们几乎所有的农村地区都未得到开发，我们应该开始开发我们的农村地区以释放其真正潜力。"
 AFG_the_tribal_leaders: "赋予部落领袖权力"
 AFG_the_tribal_leaders_desc: "在我国历史上，部落与中央政府之间的纷争往往引发国家动荡，继而招致外国干预或入侵。通过将部落领袖纳入政府体系，我们将避免重蹈覆辙。"
 AFG_the_towns: "开发城市地区"
 AFG_the_towns_desc: "为了推动国家现代化，就必须从城镇开始，在城市地区进行更多开发。这无疑会疏远部落，但只要中央政府正常运作，一切都在掌控之中。"
 AFG_the_cities: "发展城市"
 AFG_the_cities_desc: "经过几十年的战争，我们的城市蕴藏着巨大的发展潜力，部分受损建筑可改造为工厂，以更好地满足市民的需求。"
 AFG_the_capital: "发展喀布尔"
 AFG_the_capital_desc: "20世纪中叶，喀布尔曾是度假胜地，然而，数十年的战乱让这座城市沦为废墟。重建并现代化喀布尔不仅将恢复其昔日的繁荣，更能彰显中央政府的权威。"
 AFG_getting_running_water: "获取自来水"
 AFG_getting_running_water_desc: "阿富汗是世界上最缺水的国家之一，我们的阿富汗同胞因无法获得清洁用水而遭受了太多苦难，现在是政府通过建设适当基础设施来解决缺水问题的时候了。"
 AFG_feed_the_nation: "供养国家"
 AFG_feed_the_nation_desc: "我们的大多数公民都遭受着营养不良的困扰，战争已经结束，现在没有任何借口，我们必须竭尽全力改善公民的福祉，尤其是我们的孩子们。"
 AFG_spread_electricity: "扩建电网"
 AFG_spread_electricity_desc: "战争期间，国家电网大部分受损或毁坏，民众因频繁断电而依赖发电机。现在是时候重建并扩展我们的电网了。"
 AFG_means_of_communication: "通讯方式"
 AFG_means_of_communication_desc: "现在我们的电网已经恢复，我们可以为民众提供最基本的电视和网络服务——这些设施曾遭塔利班破坏。"
 AFG_rebuild_the_roads: "重建道路"
 AFG_rebuild_the_roads_desc: "我们的大部分道路网络在战争期间遭到破坏，许多残存的道路上还留有塔利班埋设的简易爆炸装置。必须清除这些爆炸物并重建我们的道路。"
 AFG_public_transportation: "公共交通"
 AFG_public_transportation_desc: "我国确实拥有公共交通系统，但由于担心塔利班发动恐怖袭击，它几乎处于瘫痪状态。如今和平终于到来，是时候恢复公共交通，造福人民了。"
 AFG_our_nation_recovered: "我国已恢复元气"
 AFG_our_nation_recovered_desc: "随着联合国维和人员的撤离，这无疑意味着我们的国家重回正轨，是时候卷起袖子，进一步建设阿富汗了。"
 AFG_future_national_policy: "阿富汗的未来"
 AFG_future_national_policy_desc: "战争结束了。然而，国家仍是一片废墟，是时候塑造国家的未来了。"
 AFG_approaching_nato: "接近西方"
 AFG_approaching_nato_desc: "西方列强经济雄厚、科技先进，如果我们选择倒向西方，他们定会在未来提供大量的经济和军事援助。"
 AFG_aspiring_nato: "成为主要的非北约盟友"
 AFG_aspiring_nato_desc: "我国的地理位置使得正式成为北约成员的可能性微乎其微，但我们可以成为重要的非北约盟友。这样做有机会获得联合国授予的非北约国家无法获得的各种军事和经济利益。"
 AFG_emerging: "接近东方"
 AFG_emerging_desc: "西方国家在与第三世界国家打交道时往往言而无信，过去与它们的合作导致了我国公民受到西方资本家阶级的压迫和剥削。这种剥削只会使少数寡头获利。与中国和俄罗斯等东方新兴国家的合作则存在着许多新的合作机遇。"
 AFG_seek_american_protection: "寻求美国保护"
 AFG_seek_american_protection_desc: "美国是世界上最强大的军事力量，鉴于我们被强国环绕的独特战略地理位置，寻求美国的保护不仅可以确保我们免受外来侵略，还可以帮助维护国家的内部稳定。"
 AFG_monarchy: "巴拉克宰王朝的回归"
 AFG_monarchy_desc: "前总理穆罕默德·达乌德·汗犯了一个巨大的错误，他推翻堂兄穆罕默德·查希尔·沙阿国王，建立了共和独裁政权。这导致了阿富汗陷入数十年的内乱，现在是时候准备迎接王国回归，为国家带来稳定了。"
 AFG_prepare_the_king: "准备迎接国王归来"
 AFG_prepare_the_king_desc: "我们敬爱的前国王穆罕默德·查希尔·沙阿仍有家人流亡在意大利，是时候准备让他们返回阿富汗，再次以王国形式统治我们的国家了。"
 AFG_the_king_returns: "国王归来"
 AFG_the_king_returns_desc: "基础工作已经就绪，必要的过渡也已结束，是时候张开双臂迎接我们的国王归来，并将权力交还给他了。"
 AFG_restore_the_constitution: "恢复1964年宪法"
 AFG_restore_the_constitution_desc: "1964年宪法以体现现代民主为特征；议会选举、妇女权利和公民权利，重要的是，它确保了君主制得以延续。我们需要恢复这部宪法，让我们的王国重拾昔日荣光。"
 AFG_pro_establishment: "阿富汗伊斯兰党政变"
 AFG_pro_establishment_desc: "是时候让阿富汗归于中央集权的普什图伊斯兰统治之下了！部落战争影响了我们国家的现代化进程与稳定。西方世界抛弃了我们，东方列强则企图摧毁我们。我们将不懈努力，让阿富汗彻底归于伊斯兰统治。"
 AFG_bring_military_to_our_side: "拉拢军队"
 AFG_bring_military_to_our_side_desc: "我们的军队肩负着保卫国家、维护国内稳定的重任。然而，由于前政府腐败严重，高层官员频繁克扣军饷，军方对新政权持怀疑态度。我们必须解决这一问题，以确保新政权的稳固。"
 AFG_secure_the_power: "巩固我们的力量"
 AFG_secure_the_power_desc: "既然我们已经获得了军队的支持，现在是时候建立警察力量来稳定国家，并将军队与警察一同部署，以消除部落势力影响，最终实现建立一个强大、中央集权、普什图人主导的伊斯兰政府的目标。"
 AFG_declare_the_emirate: "宣布成立酋长国"
 AFG_declare_the_emirate_desc: "是时候为我们的阿富汗同胞带来一个强大、集权领导层，以服务于国家的最高利益。希克马蒂亚尔将成为我们仁慈的埃米尔。"
 AFG_future_diplomacy: "我们的外交立场"
 AFG_future_diplomacy_desc: "现代世界，任何国家都不能孤立无援。考虑到我国国情，我们必须慎重确定与其他国家的相处之道。"
 AFG_invite_western_investors: "邀请西方投资者"
 AFG_invite_western_investors_desc: "我们可以邀请一些西方投资者参与国内几个项目的投资，这将刺激我国经济，并促进未来与西方的经济合作。"
 AFG_invite_eastern_investors: "邀请东方投资者"
 AFG_invite_eastern_investors_desc: "东方强国才是真正愿意帮助我们国家的，而且没有任何所谓的“民主”和“人权”的附加条件。我们可以邀请他们来我国投资，加强经济联系，并为未来开辟更多合作机会。"
 AFG_request_chinese_protection: "请求中国保护"
 AFG_request_chinese_protection_desc: "中国是我们的邻邦，但从未有过占领或征服我们的意图。我们双方在内部安全方面有着共同的关切。因此，我们可以与中国签订防务条约，以换取允许他们在我国开展商业活动的一些好处。"
 AFG_internal_policy: "聚焦国内政策"
 AFG_internal_policy_desc: "如今我国局势已定，我们必须决定未来的道路。"
 AFG_aggresive_foreign_policy: "激进外交政策"
 AFG_aggresive_foreign_policy_desc: "俗话说，进攻是最好的防御。我国历史上之所以屡遭外敌入侵，正是因为我们一直采取被动防御的策略。我们必须主动出击，才能避免历史重演。"
 AFG_isolism: "防御性外交政策"
 AFG_isolism_desc: "尽管阿富汗曾是历史上的强国，并曾击败过两个前超级大国，但不可否认的是，阿富汗在当代并非一个地区强国。然而，人民的福祉是本届政府的第一要务。我们可以采取积极防御的外交政策，以避免国家再次遭受外部干预或入侵。"
 AFG_increased_mobilization: "增加征兵"
 AFG_increased_mobilization_desc: "我国四面强敌环伺，但国民尚未做好战斗准备，我们必须推行征兵制，以确保国民为战争做好准备。"
 AFG_eyes_on_pakistan: "公开谴责杜兰线"
 AFG_eyes_on_pakistan_desc: "英国人在20世纪划定的杜兰线是对我们国家的耻辱和侮辱，它使我们大多数普什图兄弟留在了在巴基斯坦境内——一个我们认为本不该存在的国家。我们永远不会承认杜兰线，也不会忘记巴基斯坦在历史上给我们人民造成的数十年苦难。"
 AFG_defending_our_borders: "保卫我们的边境"
 AFG_defending_our_borders_desc: "尽管我国奉行严格的中立外交政策，但周边国家并非都局势稳定，因此我们绝不能掉以轻心。作为积极防御战略的一部分，我们将在与巴基斯坦的边境上构筑防御工事。"
 AFG_leg_infantry: "提升我军步兵"
 AFG_leg_infantry_desc: "过去我们的武器主要来自邻国和地区强国，士兵也以步兵为主。虽然士兵的重新装备可以暂缓，但我们的武器已严重落后于时代；我们需要革新步兵武器。"
 AFG_afghan_sof: "专注特种部队"
 AFG_afghan_sof_desc: "在21世纪，特种部队往往是最先投入战场，最后撤离战场的部队。他们肩负着最艰巨却最不被重视的任务，包括侦察、反恐、救灾等。我们应当发展这些部队。"
 AFG_mobile_units: "专注机动部队"
 AFG_mobile_units_desc: "在现代战争中，步兵无疑是高强度冲突中的炮灰。如果步兵能够实现机动化，其作战效能和战场生存能力将得到极大提升。"
 AFG_preparing_invasion: "备战"
 AFG_preparing_invasion_desc: "为了收复本应属于我们的普什图斯坦，我们必须开始备战。巴基斯坦将是一个难以对付的敌人。"
 AFG_invade_pakistan: "夺回我们的土地"
 AFG_invade_pakistan_desc: "时机已至，是时候将我们的普什图同胞从巴基斯坦的暴政中解放出来了。"
 AFG_armoured_units: "发展我们的装甲部队"
 AFG_armoured_units_desc: "如果没有像样的装甲部队，现代军队就不是一支有效的战斗部队。幸运的是，我们在过去的战争中拥有坦克，但幸好只遭受了轻微的损坏、被炸毁的履带和其他容易修复的问题。我们可以在开发一辆坦克的同时修复这些坦克国产坦克设计，以组建一支有效的装甲部队。"
 AFG_defensive_army: "防御型陆军"
 AFG_defensive_army_desc: "我们的国情不允许我们在军事上投入过多预算，然而许多情况下军队的战斗力并不取决于武器的现代化程度或数量，正如我们过去驱逐苏联和英国的努力所证明的那样。通过教授防御战术，我们可以在不超支军费的情况下提升军队战斗力。"
 AFG_army_engineer_school: "陆军工兵学校"
 AFG_army_engineer_school_desc: "在提高我军官兵战斗力方面，设立军事学院培养未来军官至关重要。政府相信，由经验丰富的退役军官担任教授，必将使我军未来的指挥官们带领部队走向胜利。"
 AFG_homeguard: "国土卫队"
 AFG_homeguard_desc: "在军事指挥部看来，仅靠正规军并不足以有效保卫我们的国家。幸运的是，我们独特的地理条件允许我们训练擅长山地作战的民兵部队。这些民兵成员通常过着普通的平民生活，但会接受定期的军事训练，一旦外敌入侵，他们便能够迅速投入战斗，保卫我们的国家。"
 AFG_the_swiss_way: "瑞士之路"
 AFG_the_swiss_way_desc: "阿富汗在上世纪中叶最为和平稳定，当时被称为“中东的瑞士”。我们应该努力恢复这一历史地位。我们的地理环境与瑞士有几分相似，政府认为可以借鉴瑞士在国家关键点周围构筑防御工事的经验。"
 AFG_superior_firepower: "优势火力"
 AFG_superior_firepower_desc: "对于某些国家而言，纯粹的军事势力足以震慑侵略者，使其不敢发动代价高昂的入侵。我们应当投入资源发展优势火力学说，以最高效地保卫我们的边境。"
 AFG_military_research: "军事研究"
 AFG_military_research_desc: "现在国家局势稳定，我们可以将部分国家预算投入军事研究，尤其是军民两用技术。"
 AFG_moderate_islamists: "伊斯兰促进会政府"
 AFG_moderate_islamists_desc: "艾哈迈德·沙阿·马苏德和布尔汉努丁·拉巴尼致力于推动国家统一，这听起来是一项能让国家未来焕发生机的计划。伊斯兰促进会目前执政，我们应确保中央政府为我们的议程铺平道路。"
 AFG_fight_corruption: "打击政府腐败"
 AFG_fight_corruption_desc: "赢得人民信任的关键在于我们的政府要解决国家根深蒂固的腐败问题。重要的是要让人民知道，我们的政府服务于人民的利益，而不是为权贵阶层谋利。"
 AFG_decentralization: "权力下放"
 AFG_decentralization_desc: "伊斯兰促进会纲领的关键要点之一是权力下放，艾哈迈德·沙阿·马苏德曾表示，阿富汗内部的权力关系应效仿瑞士模式，实质上建立一个去中心化政府，并将权力从喀布尔分散下放。这将使全国各省能够更高效地分配资源和权力，从而为整个国家带来繁荣和稳定。"
 AFG_jamiate_islami: "瑞士政治模式"
 AFG_jamiate_islami_desc: "我们已经改革了政府结构，人民的支持肯定是这些计划的后盾。现在是开启阿富汗新时代的时候了。"
 AFG_authortarian: "阿富汗民族伊斯兰运动政府"
 AFG_authortarian_desc: "阿富汗民族伊斯兰运动是一个由军事领导人阿卜杜勒·拉希德·杜斯塔姆掌舵的大帐篷民粹主义政党。它旨在促进世俗主义，保护阿富汗人、土库曼人和乌兹别克人的利益，并恢复上个世纪在共和统治时期的繁荣。杜斯塔姆必将引领国家进入一个新时代。"
 AFG_helping_our_friends: "政治清洗"
 AFG_helping_our_friends_desc: "虽然我们已经掌权，但一些昔日的盟友对中央政府的权威构成了巨大威胁，我们必须将他们从职位上清除，并由忠于我们的人取而代之。"
 AFG_secularism_campaign: "世俗化运动"
 AFG_secularism_campaign_desc: "杜斯塔姆议程中的一个关键点是政教分离；此举旨在增加中央政府的权力，并将毛拉排除在政治之外。这无疑会激起一些宗教团体的愤怒，但我们将通过多种手段加以应对。"
 AFG_junbishi_milli: "恢复世俗共和国"
 AFG_junbishi_milli_desc: "在上个世纪的共和政府领导下，阿富汗得以迅速实现现代化，妇女获得解放，能够平等参与阿富汗社会。共和治理方式证明，阿富汗确实可以摒弃落后习俗，推动国家现代化进程。"
 AFG_pro_western: "亲西方独立派"
 AFG_pro_western_desc: "在西方的支持下，一个独立政府几乎必然会倾向于西方，并在该地区维持现状。"
 AFG_supported_by_west: "西方支持"
 AFG_supported_by_west_desc: "我国政府目前因内部腐败问题而缺乏人民的支持，我们需要保护执政精英免受民众的愤怒冲击，既然我们倾向于西方阵营，西方必将支持我们，包括施压反对派以组建联合政府。"
 AFG_increase_opium_trade: "暗中支持鸦片产业"
 AFG_increase_opium_trade_desc: "尽管我们公开宣布我们打算解决鸦片问题，但我们可以暗中支持鸦片产业，对其不采取任何行动，甚至派一些便衣警察守卫罂粟田。作为回报，我们很可能会从鸦片大亨那里获得一些政治献金。"
 AFG_afghan_independents: "允许窃盗统治"
 AFG_afghan_independents_desc: "改变？谁需要改变？我们有西方的援助，局势会按计划好转的。"
 AFG_hezb_i_wahdat: "哈利利政府"
 AFG_hezb_i_wahdat_desc: "阿富汗伊斯兰团结党是1989年以什叶派伊斯兰教为基础成立的阿富汗政党。"
 AFG_invite_fatemiyoun: "呼唤法特米扬"
 AFG_invite_fatemiyoun_desc: "法蒂米扬师由阿富汗什叶派志愿者组成，并由伊朗革命卫队训练。如果德黑兰同意武装这些老兵，那么召回这些身经百战的战士就等于将他们置于哈利利麾下。"
 AFG_join_axis_of_resistance: "抵抗轴心"
 AFG_join_axis_of_resistance_desc: "德黑兰领导着整个地区的联盟运动网络，喀布尔的什叶派政府也属于其中。正式使我们的神职人员与伊朗模式保持一致将结束逊尼派在该国的主导地位，并将我们的国防与伊朗的国防结合起来。"
 AFG_declare_hazaristan: "宣布哈扎拉斯坦"
 AFG_declare_hazaristan_desc: "一个世纪以来，哈扎拉人一直是阿富汗历届政权迫害的少数民族。宣布成立哈扎里斯坦，就是将国家更名为哈扎拉斯坦，并最终确定阿富汗的归属问题。"
 AFG_remain_neutral: "中立之路"
 AFG_remain_neutral_desc: "阿富汗在20世纪中叶的繁荣证明，既不偏向西方也不偏向东方，可以让我们从任何一方受益，也不会得罪任何一方。这可能是当今阿富汗外交关系的最佳政策。"
 AFG_economy_first: "经济优先"
 AFG_economy_first_desc: "由于我们正在寻求中立的外交关系，我们国家发展的重点需要放在民用经济上，军费开支需要保持在低水平，仅需足以自卫并能够应对任何可能的叛乱既可。"
 AFG_looking_for_protection: "寻求联合国承认中立地位"
 AFG_looking_for_protection_desc: "目前我们已经证明了作为永久中立国履行义务的能力，现在只需要获得联合国的认可，并至少得到联合国安理会一个常任理事国的担保，以确保我们将继续保持永久中立国的地位。"
 AFG_idea_enhanced_recruitment_efforts: "加强征兵工作"
 AFG_idea_enhanced_recruitment_efforts_desc: "我们的人民正被动员起来参军入伍。若没有足够的人力投入战斗，我们将无法赢得这场战争。"
 AFG_idea_starting_offensive: "发起进攻"
 AFG_idea_starting_offensive_desc: "我们被迫防守太久了。是时候扭转局势，开始收复我们失去的土地了。"
 AFG_idea_changing_economy: "工业经济"
 AFG_idea_changing_economy_desc: "随着我们摆脱以鸦片为基础的经济模式，国际投资者和列强开始对我国表现出浓厚兴趣。"
 AFG_idea_war_experience: "战争经验"
 AFG_idea_war_experience_desc: "旷日持久的战争让我们这一代成为勇士的一代。"
 AFG_idea_equipment_production: "小型设备生产"
 AFG_idea_equipment_production_desc: "喀布尔和赫拉特的作坊已经开始自行生产小型武器和轻型装备。产量虽然不大，但每支在国内组装的步枪，我们就无需再从国外购买。"
 AFG_idea_large_equipment_production: "大型设备生产"
 AFG_idea_large_equipment_production_desc: "我们的武器作坊已经发展成为正规工厂，除了生产小型武器和轻型装备外，还增加了多用途车辆的生产。阿富汗现在能够供应其士兵所需的大部分装备。"
 AFG_idea_water_infrastructure_construction: "水利基础设施建设启动"
 AFG_idea_water_infrastructure_construction_desc: "我国最近启动了水利基础设施工程。为确保工程按时完成，将需要大量年轻劳动力参与其中。"
 AFG_idea_recent_public_transportation: "公共交通近期重新启用"
 AFG_idea_recent_public_transportation_desc: "我国近期重新引入了公共交通系统，这将带来一段经济繁荣期，因为我国大多数人没有自己的车辆，他们定会享受到交通网络带来的便利。"
 AFG_idea_recovered_from_war: "从内战中恢复"
 AFG_idea_recovered_from_war_desc: "经过数十年的战争，和平终于降临。人民满怀动力为国家工作，因为国家再次拥有了未来。"
 AFG_idea_tribal_support: "部落支持"
 AFG_idea_tribal_support_desc: "我们以部落为导向的政策赢得了各部落的支持，他们现在愿意尊重中央政府的权威，前提是他们的利益得到充分保障。"
 AFG_idea_diplomatic_interaction: "外交互动"
 AFG_idea_diplomatic_interaction_desc: "我国政府终于开始在国际舞台上与其他国家互动，短期内我们将因此获得一些好处。然而，我们不会忘记曾经遭受的苦难。"
 AFG_idea_prepare_king_return: "准备迎接国王归来"
 AFG_idea_prepare_king_return_desc: "我们的国王不幸仍流亡于意大利。在他必然归国之前，我们必须提前做好准备。"
 AFG_idea_internal_policy_debate: "内部政策辩论"
 AFG_idea_internal_policy_debate_desc: "政府已开始就决定国家未来对内政策的可能方案展开辩论。"
 AFG_idea_tribal_culture: "阿富汗部落文化"
 AFG_idea_tribal_culture_desc: "阿富汗以其前现代部的落文化而闻名，整个国家被划分为\"喀布尔\"和\"非喀布尔\"的差异。历史上，中央政府很难服务于地方层面的利益。每个部落的人民都优先效忠于他们的长老。部落士兵是否参战，取决于长老们的决定。"
 AFG_idea_factional_infighting: "北方联盟派系内讧"
 AFG_idea_factional_infighting_desc: "阿富汗北方联盟是由过去相互斗争的各种军阀组成的，他们为了消灭所有军阀，不得不联合起来抵抗塔利班。尽管如此，军阀之间的内讧仍然很频繁，一些军阀为了击败敌方派系而秘密与塔利班勾结。\n§W--------------§!\n将在£GFX_AFG_salafist_jihadism §Y塔利班§!政权§Y倒台§!后§R移除§!，但内讧仍将§R继续§!。"
 AFG_idea_offensive_army: "激进军事"
 AFG_idea_offensive_army_desc: "在文官领导层的影响下，军方决定采取激进的对外政策。"
 AFG_idea_defensive_army: "防御性军事"
 AFG_idea_defensive_army_desc: "在文官领导层的影响下，军方选择了奉行防御性外交政策。"
 AFG_offensive_war_preparation: "战争准备"
 AFG_offensive_war_preparation_desc: "为备战，我们必须加倍努力，全面动员并训练我们的军队。"
 AFG_idea_state_sponsored_opium_industry: "国家支持的鸦片产业"
 AFG_idea_state_sponsored_opium_industry_desc: "尽管政府承认阿富汗农民不种植罂粟就无法维持生计，并宣布将解决鸦片问题，但实际上政府将无所作为，甚至在一定程度上暗中支持该国的鸦片生产。"
 AFG_economic_recovery_research_boost: "经济复苏"
 AFG_economic_recovery_research_boost_desc: "在联合国的帮助下，我们已经能够开始将资源集中用于民用项目。"
 AFG_military_research_boost: "军事研究"
 AFG_military_research_boost_desc: "我们已将部分国家预算投入到新型军事技术的研究中。"
 AFG_taliban_tribal_support_tt: "由于我们以城市为中心的发展重点，以部落为导向的£GFX_AFG_salafist_jihadism §Y塔利班§!将重新获得§Y5.00%§!的支持率。\n"
 AFG_feed_nation_tt: "将改造§R2§!民用工厂为我们的公民生产食物。"
 AFG_invest_investment_tt: "§R需要被邀请国的批准§!，批准的机会取决于§G我们与他们的关系§!和§R国内安全状况§!。\n"
 AFG_usa_guarantee_obligation: "我们将有义务§R保护§![AFG.GetNameWithFlag]，并协助他们§R平息§! £GFX_AFG_salafist_jihadism §Y塔利班§! §R叛乱§!。"
 AFG_process_sco_member_tt: "§Y开始融入 SCO 的过程。§!"
 AFG_monarchist_10_precent_tt: "£GFX_AFG_monarchist §Y巴拉克宰 王朝§! 获得 §G10%§! 相对声望。"
 AFG_monarchist_in_power_tt: "£GFX_AFG_monarchist §Y巴拉克宰 王朝§! 已经恢复。"
 AFG_more_than_thirty_percent_monarchist_tt: "£GFX_AFG_monarchist §Y巴拉克宰 王朝§! 获得了超过 §Y30%§! 的支持。"
