 revolt_party_TT: "§HDémarrer une révolution en tant que [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\n\n§YPrérequis :§!\n[!revolt_button_click_enabled]\n§YEffets :§!\n[!revolt_button_click]"
 boost_party_TT: "§HRenforcer [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nPour diluer le pouvoir de nos véritables adversaires politiques, nous pouvons utiliser notre machine politique pour renforcer la popularité d'autres partis\n\n§YPrérequis :§!\n[!boost_button_click_enabled]\n§YEffets :§!\n[!boost_button_click]"
 attack_party_TT: "§HAttaquer [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nNous pouvons user de campagnes de désinformation et de dossiers sur les grands partis hors du gouvernement pour frapper leur popularité — afin qu'ils ne puissent pas contester notre pouvoir. Toute attention portant de la popularité aux petits partis, cela ne fonctionne qu'avec les partis majeurs au-dessus du seuil électoral de [?election_threshold|%0]\n\n§YPrérequis :§!\n[!attack_button_click_enabled]\n§YEffets :§!\n[!attack_button_click]"
 ban_party_TT: "§HInterdire [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nInterdire un parti ou un mouvement politique garantit qu'il ne pourra jamais gagner le pouvoir par les urnes, et facilite la persécution de ses membres.\n\n§YPrérequis :§!\n[!ban_button_click_enabled]\n§YEffets :§!\n[!ban_button_click]"
 allow_party_TT: "§HLégaliser [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nLe moment est venu de lever notre interdiction et de laisser leurs membres briguer des charges et s'organiser légalement.\n\n§YPrérequis :§!\n[!allow_button_click_enabled]\n§YEffets :§!\n[!allow_button_click]"
