l_simp_chinese:
 occupied_countries.1.title: "[FROM.FROM.GetNameDef]临时政府"
 occupied_countries.1.desc: "我们在[FROM.FROM.GetNameDef]的占领当局目前正与当地官员密切合作，大部分民众已经接受了我们的存在。由当地合作人士组成的临时政府已准备好在我们的指导下接管行政管理工作。"
 occupied_countries.1.a: "我们祝福他们。"
 occupied_countries.1.b: "他们还没有准备好。"
 occupied_countries.1.c: "别再给我们发这些请愿书了。"