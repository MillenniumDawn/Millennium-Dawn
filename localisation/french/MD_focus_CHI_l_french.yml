 CHI_korea_peninsula_tension_display: "$CHI_korea_peninsula_tension$ : [?CHI_korea_peninsula_tension]"
 CHI_legitimacy_concentrated_desc: "Le Comité permanent du Politburo n'a plus besoin de quorum — le cercle du secrétaire général a fusionné avec le réseau. La Commission centrale de contrôle de la discipline n'est plus qu'une courtoisie."
 CHI_Lips_and_Teeth: "Lèvres et dents"
 CHI_Lips_and_Teeth_desc: "La caractérisation historique des relations sino-nord-coréennes « aussi proches que lèvres et dents » guide la politique chinoise depuis la guerre de Corée. Formaliser cette doctrine engage la Chine à la survie du régime Kim, approfondissant les liens avec Pyongyang au prix d'une réconciliation coréenne plus large."
 CHI_mass_line_campaign: "Campagne de ligne de masse"
 CHI_mass_line_campaign_desc: "Des fonctionnaires sont envoyés dans les communautés rurales, tenus de manger avec les paysans et de déposer des rapports sur les conditions locales. Les biens de luxe sont retirés des bureaux gouvernementaux et les dépenses publiques extravagantes sont publiquement condamnées. La campagne remodèle le comportement officiel visible et bride la consommation informelle qui détournait les ressources de l'État vers des canaux privés."
 CHI_Mount_Paektu_Understanding: "Compréhension du mont Paektu"
 CHI_Mount_Paektu_Understanding_desc: "Une entente bilatérale secrète, conclue à l'ombre du mont Paektu — le lieu de naissance mythologisé de la dynastie Kim — formalise les consultations de sécurité chinoises avec le commandement militaire nord-coréen."
 CHI_nc_inf_cplac_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_cplac|Y0]"
 CHI_nc_inf_intl_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_intl|Y0]"
 CHI_nc_inf_nsc_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_nsc|Y0]"
