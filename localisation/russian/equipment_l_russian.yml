 Strike_fighter1: "УИ 3-го поколения"
 Strike_fighter1_desc: "Специализированные ударные истребители созданы для атаки наземных целей и превосходно справляются как с изоляцией района боевых действий, так и с непосредственной авиационной поддержкой, сохраняя при этом неплохие возможности ведения воздушного боя, в основном для самообороны."
