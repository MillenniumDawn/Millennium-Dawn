 deep_state_press_freedom_tt: "§G군의 압력으로부터 언론의 자유가 수호되었습니다.§!"
 deep_state_generals_welcomed_tt: "예비역 장군들이 이제 정치에서 활동하고 있습니다."
 deep_state_generals_barred_tt: "§G군 인사의 정치 활동이 금지되었습니다.§!"
 deep_state_loyalty_rewarded_tt: "§G민간 정부에 충성하는 지휘관들이 진급했습니다.§!"
 deep_state_promotions_controlled_tt: "§R딥 스테이트가 군 진급을 통제합니다.§!"
 deep_state_foreign_help_tt: "§Y외국의 지원을 수락했습니다. 이는 결과를 초래할 수 있습니다.§!"
 deep_state_foreign_refused_tt: "외국의 간섭이 거부되었습니다."
 deep_state_coup_tt: "§R군사 쿠데타!\n딥 스테이트가 알제리의 직접 통제권을 장악했습니다!§!"
 deep_state_military_control_tt: "§R알제리는 이제 군사 통치하에 있습니다.§!"
 deep_state_resist_coup_tt: "§Y군사 쿠데타에 저항을 시도합니다.§!"
 deep_state_resist_success_tt: "§G쿠데타 저항 성공!\n민간 정부가 복원되었습니다!§!"
 deep_state_resist_failed_tt: "§R저항 실패!\n군이 반대 세력을 진압했습니다. 내전이 뒤따를 수 있습니다.§!"
 deep_state_accept_junta_tt: "군사 통치가 받아들여졌습니다."
