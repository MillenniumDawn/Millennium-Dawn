 nsb_rocket_pods_tech_1: "1세대 로켓 포드"
 nsb_rocket_pods_tech_1_desc: "헬리콥터 로켓 포드는 헬기에 부착하는 외부 발사대로, 다양한 전투 임무를 위해 비유도 또는 유도 로켓을 배치할 수 있습니다. 이 포드는 헬기의 화력을 크게 향상시켜 지상 표적의 효과적인 교전, 적진 진압, 근접 항공 지원 작전을 수행할 수 있게 해줍니다."
