 RULE_HARD_AI_ECONOMIC: "经济AI"
 RULE_DISABLE_HARD_AI_ECONOMIC: "标准限制"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "对AI的一个标准限制，不允许它加强自己的经济。对于一个历史游戏来说"
 RULE_ENABLE_HARD_AI_ECONOMIC: "无限制"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "如果你感到厌烦，每场游戏的AI都不能摆脱经济危机——这是为你准备的。AI在对其经济做出决定时不再受到限制。准备好了，许多国家将变得比你更富有。只为那些不怕挑战的人。战斗型AI向您问好;)"
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "AI债务战争"
 RULE_DISABLE_AI_DEBT_WAR: "禁用"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "这将禁用AI的债务战争功能。AI将不再入侵一个拖欠债务的国家。"
 RULE_ENABLE_AI_DEBT_WAR: "启用"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "如果你拖欠了他们的债务，该设置将使AI更有可能进行债务战争。"
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "启用混乱的和平协议"
 RULE_OPTION_CHAOTIC_PC_NO: "不"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "这个选项有望阻止每个人在AI和平会议上掠夺土地。\n它通过限制谁可以向主要国家和阵营领导人宣称领土来做到这一点。（这只会影响 AI，而不会影响玩家）"
 RULE_OPTION_CHAOTIC_PC_YES: "是"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "对于那些真正享受可恨的和平会议的人来说，为什么当可以创建12个§Y俄罗斯§!的时候，要将世界限制在只有1个§Y俄罗斯§!！\n（我不对此选项可能发生的后果负责）"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "启用玩家主导的和平会议"
 RULE_OPTION_PLAYER_LED_PC_NO: "不"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "这个选项将让AI做出自己的选择，尽管它们可能非常愚蠢。"
 RULE_OPTION_PLAYER_LED_PC_YES: "是"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "对于那些不相信AI能够量凿正枘的人，这项选项将只允许玩家在和平会议期间提出要求。"
 RULE_SALAFIST_BRANCH: "启用萨拉菲主义分支"
 RULE_YES_SALAFIST_BRANCH_DESC: "在通用国策树中为所有国家启用萨拉菲主义分支，而不管其拥有何种宗教。"
 RULE_NO_SALAFIST_BRANCH_DESC: "启用逊尼派国家通用国策树中的萨拉菲主义分支"
 RULE_OPTION_DEMOCRAT: "倾向民主党"
 RULE_OPTION_DEMOCRAT_AI_DESC: "§8民主党§!掌控着白宫和国会，并以中间偏左的路线执政长达一代人。华盛顿在国内投入巨资，在国际上则依靠制度而非武力来发挥领导作用。"
 RULE_OPTION_REPUBLICAN: "倾向共和党"
 RULE_OPTION_REPUBLICAN_AI_DESC: "§8共和党§!掌控着白宫和国会，并以中间偏右的路线执政长达一代人。华盛顿在国内削减开支，却依靠军备来维持世界秩序。"
 RULE_OPTION_REFORMED_REPUBLIC: "改革后的共和"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "公众压力迫使政治和选举改革得以推进，赋予第三党真正的选票资格和代表权。两党垄断局面被打破，美国政府首次面临组建联合政府的问题。"
 RULE_OPTION_POST_UNITED: "后合众国时代"
 RULE_OPTION_POST_UNITED_AI_DESC: "联邦政府失去控制，美国分裂成继承其领土的各个共和国。北美变成一个由相互敌对的美国各州组成的洲，§R而这条道路无法与史实AI规则相吻合§!。"
 NIG_AI_BEHAVIOR: "@NIG 尼日利亚"
 RULE_OPTION_FRA_HISTORICAL: "史实"
 RULE_OPTION_FRA_HISTORICAL_DESC: "第五共和国在总统职位从希拉克到萨科齐、再到奥朗德和马克龙的交接中保持着既定路线，§8共和党§!和中间派则在他们之间轮流执政。法国是欧洲一体化的基石，并继续掌控着法兰西非洲地区。"
 BRM_AI_BEHAVIOR: "@BRM 缅甸"
 RULE_OPTION_NORTHERN_AMBITION: "北方雄心"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "瑞典民族主义右翼势力崛起，将北方情怀转化为统一纲领。斯德哥尔摩着手将斯堪的纳维亚半岛和波罗的海地区纳入复兴的瑞典帝国版图，力图在能够通过条约达成协议的地方实现统一，在必要时则诉诸武力。"
 SYR_AI_BEHAVIOR: "@SYR 叙利亚"
 RULE_OPTION_SYR_HISTORICAL: "史实AI"
 RULE_OPTION_SYR_HISTORICAL_DESC: "哈菲兹·阿萨德的长子巴沙尔·阿萨德将成功继任。巴沙尔将使叙利亚继续与俄罗斯结盟，并会同样重视外交、军事和经济。"
 RULE_OPTION_SYR_IRON_LADY: "叙利亚铁娘子"
 RULE_OPTION_SYR_IRON_LADY_DESC: "哈菲兹·阿萨德的女儿布莎拉·阿萨德将成功继任。布莎拉将在大国之间采取更加中立的态度，并着重于外交和经济。"
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "叙利亚暴君"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "哈菲兹·阿萨德的继任者是他的幼子马赫尔，而非巴沙尔，军队直接接管了国家。叙利亚重新武装，意图建立“大叙利亚”，黎凡特地区也迎来了一个咄咄逼人的强权，而此前该地区一直是一个谨慎的地区。"
 RULE_OPTION_SYR_NEW_ASSAD: "新的阿萨德"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "哈菲兹·阿萨德的弟弟里法特·阿萨德将在大马士革之春之后成功继任。里法特将专注于亲沙特政策，特别是在外交和经济上。"
 RULE_OPTION_SYR_DAMASCUS_SPRING: "大马士革之春"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "§8大马士革之春§!沙龙从未关闭，改革派将一场辩论转化为政权更迭。叙利亚成为一个运转良好的民主国家，复兴党失去了其第二个首都。"
 BHR_AI_BEHAVIOR: "@BHR 巴林"
 SAU_AI_BEHAVIOR: "@SAU 沙特阿拉伯"
 RULE_OPTION_RULE_BRITANNIA: "统治吧，不列颠尼亚"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "拥护英国王室的势力打破了两党制，利用国家衰落的契机建立起自己的运动，并最终夺取政权。帝国以武力复辟，英国不再是华盛顿的附庸。"
 BOT_AI_BEHAVIOR: "@BOT 博茨瓦纳"
 NKO_AI_BEHAVIOR: "@NKO 朝鲜"
 SIN_AI_BEHAVIOR: "@SIN 新加坡"
 SIN_GLOBAL_DIPLOMACY: "全球外交"
 SIN_GLOBAL_DIPLOMACY_DESC: "新加坡将财富用于举办会议而非仅仅用于贸易，使这座岛屿成为亚洲各国缓和彼此竞争的场所。小国在这里获得了原本无法获得的发言权，而大国则在中立的平台上会晤。"
 SIN_SINGAPORE_ALONE: "新加坡独自前行"
 SIN_SINGAPORE_ALONE_DESC: "§8人民行动党§!执政从不间断，始终将岛屿防务掌握在自己手中，不相信任何未经其支付费用的担保。新加坡保持富裕、武装和中立，在贸易需要之外，绝不偏袒任何一方。"
 SIN_PRESSURE_SOUTH_ASIAN_SEAS: "对南亚海域施压"
 SIN_PRESSURE_SOUTH_ASIAN_SEAS_DESC: "新加坡将海军力量和资金投入海外，开始在其赖以生存的海峡中制定规则。东南亚因此获得了一个愿意维护其海上航道秩序的小国，而其邻国也注意到了这一点。"
 UKR_AI_BEHAVIOR: "@UKR 乌克兰"
 SPR_CONSERVATIVE_LEANINGS: "保守倾向"
 SPR_CONSERVATIVE_LEANINGS_DESC: "§8人民党§!和更广泛的西班牙右翼势力掌控着议会，并以市场自由主义和大西洋主义路线执政。西班牙仍然是北约的坚定成员国，也是布鲁塞尔方面一个不爱冒险的伙伴。"
 SPR_RENACIMIENTO_NACIONALISTA: "民族主义复兴"
 SPR_RENACIMIENTO_NACIONALISTA_DESC: "§8呼声党§!和民族主义右翼势力摆脱边缘地位，掌控了政府。西班牙开始反对自治区和移民，并发现自己不再跟随布鲁塞尔，而是与布鲁塞尔争论不休。"
 SPR_NACION_UNIDAD_IMPERIO: "国家统一帝国"
 SPR_NACION_UNIDAD_IMPERIO_DESC: "§8长枪党§!从政治低谷中重返政坛，并以民族工团主义模式重建西班牙国家。议会让位于垂直工团，西班牙的目光转向昔日的帝国，而非欧洲。"
 SPR_SOCIALISM_RISING: "社会主义崛起"
 SPR_SOCIALISM_RISING_DESC: "§8西班牙社会主义工人党§!及其领导的左翼势力执政长达一代人，并将福利国家建设推向了前所未有的高度。西班牙成为欧洲社会民主主义的典范，并带动地中海沿岸国家也朝着这个方向发展。"
 SPR_COMMUNIST_REVISIONISM: "共产主义复兴"
 SPR_COMMUNIST_REVISIONISM_DESC: "§8西班牙共产党§!接管了社会主义者不愿接管的国家，并按照马克思主义路线重建了共和国。西班牙脱离了西方阵营，北约失去了其南翼。"
 SPR_THE_OLD_WAYS: "旧道路"
 SPR_THE_OLD_WAYS_DESC: "王室和教会重新成为国家中心，西班牙着手收复失去的帝国。直布罗陀、马格里布和昔日的总督辖区被视为未竟之业，而非历史。"
 GEO_AI_BEHAVIOR: "@GEO 格鲁吉亚"
 GEO_NATIONALIST_behavior: "@GEO 民族主义行为"
 GEO_help_CHE_behavior: "@GEO 帮助车臣人"
 GEO_2008_war_behavior: "@GEO 2008战争行为"
 GEO_WILL_FOLLOW_OWN_WAY: "自己的道路"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "民族主义的格鲁吉亚将走自己的道路，并将粉碎亚美尼亚和阿塞拜疆。"
 GEO_WILL_BE_PRO_ARMENIA: "亲亚美尼亚"
 GEO_WILL_BE_PRO_ARMENIA_DESC: "民族主义格鲁吉亚将帮助亚美尼亚粉碎阿塞拜疆"
 GEO_WILL_BE_PRO_AZERI: "亲阿塞拜疆"
 GEO_WILL_BE_PRO_AZERI_DESC: "民族主义格鲁吉亚将帮助阿塞拜疆粉碎亚美尼亚"
 GEO_WILL_HELP: "帮助 @CHE 车臣"
 GEO_WILL_HELP_DESC: "格鲁吉亚将帮助车臣人与俄罗斯开战。他们可以在未来帮助格鲁吉亚。"
 GEO_WONT_HELP: "不帮助 @CHE 车臣"
 GEO_WONT_HELP_DESC: "格鲁吉亚不会帮助车臣人与俄罗斯开战。他们将敌视格鲁吉亚。"
 GEO_ATTACK_RUS: "整军备战"
 GEO_ATTACK_RUS_DESC: "格鲁吉亚将为2008年的战争做好准备，并将努力赢得战争。"
 GEO_WEAKBOY: "与俄罗斯妥协"
 GEO_WEAKBOY_DESC: "格鲁吉亚将寻求与俄罗斯妥协，以避免战斗行动。"
 BLR_union_state_ai_behavior: "@BLR 联盟国"
 BLR_WONT_FOLLOW_UNION_STATE: "不跟随联盟国"
 BLR_WONT_FOLLOW_UNION_STATE_DESC: "白俄罗斯不会组建联盟国，也不会成为俄罗斯的傀儡。"
 BLR_WILL_FOLLOW_UNION_STATE: "成立联盟国"
 BLR_WILL_FOLLOW_UNION_STATE_DESC: "白俄罗斯将尝试组建联盟国。起初他们会成为俄罗斯的傀儡，但后来......"
 RULE_DISABLE_FORMABLE_NATIONS: "禁用可成立国家"
 RULE_YES_FORMABLE_NATIONS_DESC: "禁用“可成立国家”决议"
 RULE_NO_FORMABLE_NATIONS_DESC: "启用“可成立国家”决议"
 RULE_ALLOW_EDGY_FLAGS: "允许争议性旗帜"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "避免出现一些更有争议的旗帜选项。"
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "允许更多通常会被审查的有争议性旗帜选择。"
 RULE_DISABLE_EU: "禁用欧盟"
 RULE_YES_DISABLE_EU_DESC: "所有国家都将脱离欧盟"
 RULE_NO_DISABLE_EU_DESC: "欧盟将会继续存在"
 RULE_DISABLE_NATO: "禁用北约"
 RULE_YES_DISABLE_NATO_DESC: "北约在载入游戏时将被取缔"
 RULE_NO_DISABLE_NATO_DESC: "北约仍将作为一个阵营存在"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN: "传播行动影响力数值收益"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN_DESC: "改变从传播影响中获得的影响力"
 RULE_SPREAD_INFLUENCE_GAIN_0_5: "0.5%"
 RULE_SPREAD_INFLUENCE_GAIN_0_5_DESC: "每次传播行动获得0.5%的影响力。如果你真的很想减缓影响力的获得。"
 RULE_SPREAD_INFLUENCE_GAIN_2: "2%"
 RULE_SPREAD_INFLUENCE_GAIN_2_DESC: "每次传播行动获得2%的影响力。如果你真的想提升影响力。"
 RULE_SPREAD_INFLUENCE_GAIN_4: "4%"
 RULE_SPREAD_INFLUENCE_GAIN_4_DESC: "每次传播行动获得4%的影响力。对于如果你真的很想加快影响力的获得。"
 RULE_SPREAD_INFLUENCE_AMOUNT_COOLDOWN: "传播影响行动冷却期"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN: "30天"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN_DESC: "默认冷却时间。每30天一次，你可以将你的影响力扩散到另一个国家。"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN: "14天"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN_DESC: "每14天一次，你可以将你的影响力扩散到另一个国家。"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN: "无冷却期"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "传播影响力没有冷却时间，当你想把你所有的§H政治点数§!投入到影响其他国家的时候。"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60天"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "每60天一次，你可以将你的影响力扩散到另一个国家。"
 RULE_INVEST_INFLUENCE_AMOUNT_GAIN: "投资影响"
 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "只要对方接受投资，你就会获得1%的影响力。"
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "只要对方接受投资，你就会获得0.5%的影响力。"
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
 RULE_INVEST_DEFAULT_GAIN_2_DESC: "只要对方接受投资，你就会获得2%的影响力。"
 RULE_INFLUENCE_COOLDOWN: "投资影响冷却期"
 RULE_14_DAY_INFLUENCE: "14天冷却期"
 RULE_14_DAY_INFLUENCE_DESC: "投资影响行动的默认冷却时间为14天或两周。 这适用于国家所有可能的投资机会。"
 RULE_0_DAY_INFLUENCE: "无冷却期"
 RULE_0_DAY_INFLUENCE_DESC: "老派千禧黎明的影响力是通过投资期限获得的。您可以随意投资，同时仍能获得影响力，该项不推荐给那些喜欢平衡的人！"
 RULE_30_DAY_INFLUENCE: "30天冷却期"
 RULE_30_DAY_INFLUENCE_DESC: "建议的多人游戏选项。通过投资获得的影响力的冷却时间为30天或大约1个月。这适用于国家所有可能的投资机会。虽然你仍然可以投资，但在这段时间内你不会获得任何影响力。"
 RULE_ENABLE_DIVISION_LIMITER: "启用AI师数量限制器"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "禁用AI师数量限制器\n\n默认情况下，AI不会受到它所能生产的师数量的限制。如果你出于性能原因希望限制师数量，请启用它！"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "启用AI师数量限制器\n\n当该选项启用时，AI将减少生产师的可能性，允许更多的流畅体验，让玩家可以相对平稳的游玩！"
 RULE_OPTION_POTATO_EDITION: "土豆版"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "启用土豆版AI师数量限制器\n\n由于性能原因，进一步限制AI。\n"
 RULE_REMOVE_MICRO_STATES: "移除国家"
 RULE_NO_RULE_REMOVE_MICRO_STATES_DESC: "游戏开始时不移除任何国家。"
 RULE_ALLOW_ENABLE_LEDGER: "启用千禧黎明报表"
 RULE_ALLOW_ENABLE_LEDGER_YES_DESC: "千禧黎明报表已启用（来自抵抗组织情报报表的一些信息可能会变得冗余。如果你想玩更高的游戏难度，请禁用此功能。）"
 RULE_ALLOW_ENABLE_LEDGER_NO_DESC: "禁用千禧黎明报表。这对于那些更喜欢真实体验并希望利用“抵抗运动”DLC获取关键信息的用户来说更好。"
 RULE_ALLOW_CHEAT_DECISIONS: "允许作弊模式"
 RULE_YES_ALLOW_CHEAT_DECISIONS_DESC: "开启作弊模式"
 RULE_NO_ALLOW_CHEAT_DECISIONS_DESC: "关闭作弊模式"
