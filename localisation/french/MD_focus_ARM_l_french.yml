 ARM_nor_aven_first: "Avenue du Nord"
 later_good_thing_tt: "Lorsque les problèmes d'infrastructure à Erevan seront §Rretirés§!, nous obtiendrons des améliorations d'infrastructure d'État à Erevan."
 ARM_infr_problems_yerevan: "Problèmes d'infrastructure à Erevan"
 ARM_infr_problems_yerevan_desc: "La reconstruction du centre d'Erevan provoque des perturbations temporaires : congestion du trafic, interruption commerciale et coûts de construction pèsent sur l'économie et les services de la capitale.\n§W--------------§!\nCet esprit national sera §Rretiré§! lorsque la reconstruction sera achevée, ce qui accordera une infrastructure d'État améliorée à Erevan."
 ARM_nor_aven_sec: "Vieux Erevan"
 norav_tt: "Nous obtiendrons §Ydiverses options§! sur ce qu’il faut faire avec le §Yprojet de l’Avenue Nord§!"
 rus_waits_tt: "We have §Yagreed§! with [SOV.GetNameWithFlag] that we will solve the §Rdebt issue§! within a §Yyear!§!"
 first_assasin_tt: "§YNous terminerons la première phase des assassinats politiques !§!"
 second_assasin_tt: "§YNous terminerons la deuxième phase des assassinats politiques !§!"
 arm_milit.1.t: "L’Arménie demande une licence pour les fusils !"
 arm_milit.1.d: "Le gouvernement arménien nous a récemment contactés pour solliciter une licence de production de nos fusils d'assaut sur son territoire. Devrions-nous accepter cette offre ?"
 arm_milit.1.a: "Où signer ?"
 arm_milit.1.b: "Non, bien sûr."
 arm_milit.2.t: "[FROM.GetNameWithFlag] Accepts Our Offer!"
 arm_milit.2.d: "[FROM.GetNameWithFlag] accepted our offer and will provide us all papers for the rifle production."
 arm_milit.2.a: "Merveilleux."
 arm_milit.3.t: "[FROM.GetNameWithFlag] Rejected Our Offer!"
 arm_milit.3.d: "Ils ont rejeté notre offre et ne nous fourniront aucun document ou licence pour la production de leurs fusils."
 arm_milit.3.a: "Pff."
 arm_milit.4.t: "L’offre d’Orsis"
 arm_milit.4.d: "Orsis, entreprise spécialisée dans l'armement militaire, a proposé d'investir dans notre complexe militaro-industriel. Nous pouvons accepter leur proposition ou exploiter cette opportunité à des fins politiques."
 arm_milit.4.a: "Bien sûr, nous acceptons !"
 arm_milit.4.b: "Votre matériel est pour la chasse, pas pour l’armée !"
 arm_milit.5.t: "L’armée de l’Artsakh s’intègre à la nôtre"
 arm_milit.5.d: "Les forces armées de la République de l’Artsakh prennent des mesures pour s’intégrer à notre armée, pour une meilleure interaction et coopération de nos forces armées."
 arm_milit.5.a: "Super !"
 arme.6.t: "[ARM.GetNameWithFlag] Asks for Investments!"
 arme.6.d: "Notre ancien partenaire politique et ami, Robert Kotcharian, nous propose d'investir dans l'économie arménienne dans le cadre d'un accord mutuellement avantageux. Devrions-nous accepter ?"
 arme.6.a: "Bien sûr !"
 arme.6.b: "Désolé, pas cette fois."
 arme.7.t: "[SOV.GetNameWithFlag] Agrees!"
 arme.7.d: "Grâce à nos bonnes relations avec les dirigeants politiques russes, ils ont accepté d'investir dans notre économie et de construire une usine civile dans notre pays."
 arme.7.a: "Merveilleux !"
 arme.8.t: "[SOV.GetNameWithFlag] Rejects!"
 arme.8.d: "Malheureusement, la Russie n’a pas été convaincue d’investir dans notre économie et de signer l’accord."
 arme.8.a: "Pff."
 arme.9.c: "Rénover les bâtiments historiques anciens"
 arme.11.t: "Assassinat de Poghos Poghosyan !"
 arme.11.d: "Suite à la récente rencontre entre Robert Kotcharian et Poghos Poghosyan, ce dernier a été limogé. Le parti Dashnaktsutyun sera très probablement furieux. Il nous faut décider de la marche à suivre."
 arme.11.a: "Rapprocheons les plus fidèles."
 arme.11.b: "Ils sont inutiles."
 koch_union_stat_tt: "[ARM.GetNameWithFlag] Will Join The §GUnion State!§!"
 arme.15.t: "L’opposition gagne du soutien !"
 arme.15.d: "Face à l'inaction du gouvernement de Kocharyan, l'opposition a vu son soutien populaire s'accroître et s'est consolidée."
 arme.15.a: "Zut !"
 ARM_Pashik_misters_loc1: "Convaincre Monsieur P"
 ARM_Pashik_misters_loc2: "Convaincre Monsieur J"
 ARM_Pashik_misters_loc3: "Convaincre Monsieur N"
