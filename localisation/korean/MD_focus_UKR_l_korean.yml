 UKR_modernize_t55_64: "§YT-55-64§! 개발"
 UKR_modernize_t55_64_desc: "§WT-55-64는 하르키우 장갑차 수리공장이 만든 T-55의 우크라이나식 혼합 현대화형입니다. 이 사업은 기존 T-55 포탑과 T-64의 차체를 결합하여 차량에 향상된 기동성과 더 현대적인 현가 및 주행 장치를 제공합니다. 이 전차는 출력 700마력의 5TDF 디젤 엔진을 사용하며 포탑에 추가 반응 장갑을 받았습니다. 2000년대 중반에 개발 및 시험된 T-55-64는 노후화된 T-55의 운용 수명을 연장하는 비교적 저렴한 방법으로 의도되었습니다.§!"
 UKR_develop_bmp64: "§YBMP-64§! 개발"
 UKR_develop_bmp64_flag: "결정 §YBMP-64 개발§! 완료"
 UKR_develop_bmp64_desc: "§WBMP-64는 하르키우의 설계자들이 T-64 차체를 기반으로 개발한 실험적 중형 보병전투차입니다. 개조 과정에서 원래의 전차 포탑을 제거하고 차체를 재배치하여 방호된 병력 수용 공간을 마련하면서도, 전차의 육중한 차체와 방어력은 상당 부분 유지합니다. 첫 시제품에는 원격 조종식 전투 모듈과 후방 출입문이 장착되어 우크라이나 중형 보병전투차의 기본 개념을 확립했습니다.§!"
 UKR_develop_bmp64d: "§YBMP-64D§! 개발"
 UKR_develop_bmp64d_desc: "§WBMP-64D는 최초 BMP-64 개념을 발전시킨 모델입니다. 이 차량은 추가적인 대전차 및 대공 능력을 갖춘 확장형 전투 모듈과 개선된 방호력 및 장비를 받습니다. 이 사업은 T-64 차체를 병력을 지원하면서도 전차에서 유래한 차체의 생존성을 유지하는 다목적 중형 보병 플랫폼으로 바꾸려는 시도를 보여 줍니다.§!"
 UKR_develop_bmpt64: "§YBMPT-64§! 개발"
 UKR_develop_bmpt64_desc: "§WBMPT-64는 T-64 기반 우크라이나 중형 보병전투차를 한 단계 더 발전시킨 모델입니다. 재설계된 차체와 무인 포탑으로 내부 배치가 개선되었으며, 후방 램프로 병력 수용 공간에 더 편리하게 출입할 수 있습니다. 이 차량에는 개선된 방호력과 전투 장비를 포함해 우크라이나의 다른 T-64 현대화 계획을 위해 개발된 기술이 적용되었습니다. BMPT-64는 UMR-64 계열에서 가장 앞선 구상 중 하나가 되었습니다.§!"
 UKR_develop_bmpk64: "§YBMP-K-64§! 개발"
 UKR_develop_bmpk64_desc: "§WBMP-K-64는 T-64 기반 보병 차량 계열의 독특한 차륜형 파생형입니다. 원래의 궤도식 차체를 8x8 플랫폼으로 대대적으로 재설계했으며, 엔진과 변속기를 차륜 구동에 맞게 개조했습니다. 그 결과 궤도식 차량보다 훨씬 가볍고 빠르면서도 원래 전차 차체에서 물려받은 상당한 방호력을 유지합니다. 이 시제품은 노후한 T-64 차체를 신형 장갑차의 기반으로 재활용하려는 우크라이나의 노력을 보여 주었습니다.§!"
 UKR_develop_t72ag: "§YT-72AG§! 개발"
 UKR_develop_t72ag_desc: "§WT-72AG는 T-80UD와 T-84를 위해 개발된 기술을 적용한 T-72의 우크라이나 수출용 현대화 모델입니다. 이 현대화는 원래의 T-72 차체와 포탑은 유지하면서 동력 장치, 사격 통제 장비, 방호력 및 기타 체계를 대폭 개선합니다. 이 사업은 소련 시대의 전차 플랫폼을 탈소련 시대의 국산 기술과 결합하려 한 우크라이나의 초기 시도 중 하나입니다.§!"
 UKR_develop_t72_120: "§YT-72-120§! 개발"
 UKR_develop_t72_120_desc: "§WT-72-120은 T-72 플랫폼을 서방의 운용 기준에 더 가깝게 끌어올리기 위한 우크라이나의 수출 지향 현대화 모델입니다. 가장 두드러진 특징은 자동 장전 장치와 분리된 탄약 구획을 갖춘 재설계된 포탑 후부입니다. 현대화된 사격 통제 및 지원 체계와 함께, 이 사업은 소련제 T-72 설계를 해외 고객에게 맞추려 한 야심 찬 시도를 보여 줍니다.§!"
 UKR_develop_t72ua1: "§YT-72UA1§! 개발"
 UKR_develop_t72ua1_desc: "§WT-72UA1은 주로 수출 고객을 위해 개발된 T-72의 경제적인 우크라이나식 현대화 모델입니다. 이 계획은 기본적인 T-72 구조는 유지한 채 기동성, 방호력, 관측 및 사격 통제 장비의 개선에 중점을 둡니다. 완전히 새로운 전차를 개발하기보다 기존 차량의 실용적인 개수와 현대화를 강조하는 접근 방식입니다.§!"
 UKR_develop_t80_2019: "§YT-80BV zr. 2019§! 개발"
 UKR_develop_t80_2019_desc: "§WT-80BV zr. 2019는 2017년 T-64BV 현대화 경험을 바탕으로 우크라이나 공수 및 해군 보병 부대를 위해 실시한 T-80BV 현대화 모델입니다. 이 계획은 현대적인 열상 장비, 개선된 통신 및 항법 체계, 향상된 방호력과 기타 갱신된 구성품을 도입합니다. T-80의 기동성에 기갑 전력 현대화에서 쌓은 우크라이나의 폭넓은 경험에서 나온 장비를 결합한 것입니다.§!"
 UKR_develop_skif: "§YSkif§! APC 개발"
 UKR_develop_skif_desc: "§W스키프는 우크라아르모테크가 M113 APC를 기반으로 설계한 새로운 우크라이나 궤도식 병력수송장갑차입니다. 이 차량은 전방의 엔진 구획과 램프가 있는 후방 병력 구획을 중심으로 제작되었으며, 모듈식 차체는 더 폭넓은 차량 계열을 지원하도록 의도되었습니다. 시제품은 알루미늄 장갑 차체를 사용하고 현대적인 우크라이나제 통신, 항법 및 전자 체계를 갖추고 있습니다. 해당 기업이 플랫폼의 기동성과 전반적인 설계를 평가하면서 2026년에 공장 시험이 시작되었습니다.§!"
 UKR_develop_kevlar_e: "§YKevlar-E§! 개발"
 UKR_develop_kevlar_e_desc: "§W케블라-E는 2S1 자주포의 차체를 개조하여 만든 우크라이나의 보병전투차입니다. 재설계를 통해 동력 장치를 전방으로 옮기고 후방에 더 큰 방호 병력 구획을 마련했습니다. 공간장갑, 추가적인 내부 방호, 원격 조종식 포탑으로 포병 차체가 현대적인 보병 플랫폼으로 탈바꿈합니다. 이 사업은 노후한 소련제 차량을 새로운 장갑 플랫폼으로 재활용할 수 있음을 보여 줍니다.§!"
