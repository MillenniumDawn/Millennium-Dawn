 CZE_Air_UAV1: "CANTAS A"
 CZE_Air_UAV1_desc: "Малый разведывательный дрон вертикального взлёта и посадки."
 CZE_Air_UAV2: "CANTAS II"
 CZE_Air_UAV2_desc: "Проект современного дрона вертикального взлёта и посадки среднего размера с базовыми ударными возможностями."
 CZE_Air_UAV3: "BL-1 Bouře"
 CZE_Air_UAV3_desc: "Проект перспективного беспилотного летательного аппарата большой дальности с высокоточными боеприпасами и базовыми возможностями класса «воздух — воздух»."
 CZE_Air_UAV4: "BL-4 Blesk"
 CZE_Air_UAV4_desc: "Отечественный малозаметный беспилотник с высокоточными ударными возможностями и очень большой продолжительностью полёта: он способен держаться на высоте 30 км в течение 250 часов за счёт более низкого сопротивления воздуха и удельного давления."
 CZE_early_helicopter: "HC-102"
 CZE_early_helicopter_desc: "Двухместный разведывательный вертолёт, разработанный в 60-е годы."
 CZE_MR_Fighter1: "Су-22М4"
 CZE_MR_Fighter1_desc: "Модернизированный Су-22 (М4) отечественного производства с улучшенной авионикой и программным обеспечением, позволяющим применять новейшие ракеты AGM."
 CZE_MR_Fighter2: "Let-25K"
 CZE_MR_Fighter2_desc: "Чешский многоцелевой истребитель, разработанный с упором на удары по наземным целям; воздушный бой для него — второстепенная задача."
 CZE_MR_Fighter3: "Aero L-21 Sova"
 CZE_MR_Fighter3_desc: "Истребитель с новыми форсажными двигателями способен развивать скорость до 3000 км/ч на высоте 20 км. Он может нести на своих пилонах множество вариантов вооружения, включая высокоточные боеприпасы и бомбы JDAM. В ходе испытаний бомба, сброшенная с такой скорости на такой высоте, поразила движущуюся цель на расстоянии в 57 км от самолёта."
 CZE_MR_Fighter4: "Let-35 Skřivan"
 CZE_MR_Fighter4_desc: "Манёвренный многоцелевой истребитель с хорошим сохранением энергии. Ориентирован в основном на воздушный бой."
 CZE_MR_Fighter5: "Let-55 Straka"
 CZE_MR_Fighter5_desc: "Сверхманёвренный истребитель с двумя двигателями с управляемым вектором тяги. Может применять большинство современных боеприпасов благодаря специально разработанному программному обеспечению, состоящему из базового кода в сочетании с модульными фрагментами кода от различных производителей оружия, что позволяет программировать каждый элемент системы вооружения специально под его конкретное назначение. Это также упрощает обновление программного обеспечения и практически исключает несовместимость."
 CZE_MR_Fighter6: "Aero L-73 Špaček"
 CZE_MR_Fighter6_desc: "Малозаметный многоцелевой истребитель, способный к полёту на сверхзвуковой крейсерской скорости, с внутренними отсеками вооружения на 8 точек подвески, предназначенный для подавления ПВО противника (SEAD)."
 CZE_MR_Fighter7: "Let-81 Sup"
 CZE_MR_Fighter7_desc: "Гиперзвуковой перехватчик с оружием направленной энергии как наступательного, так и оборонительного назначения, а также с гиперзвуковыми ракетами."
 CZE_MR_Fighter8: "Let-83 Slavík"
 CZE_MR_Fighter8_desc: "Гиперзвуковой многоцелевой самолёт, способный изменять форму (морфинг), с противоспутниковым вооружением и двигателями изменяемой конфигурации, способный к длительному суборбитальному полёту и одновременно служащий самолётом-шпионом, который может сбить любого противника, пытающегося его перехватить."
 CZE_CV_MR_Fighter1: "Як-38"
 CZE_CV_MR_Fighter1_desc: "Советский Як-38, выпускаемый на отечественных заводах."
 CZE_CV_MR_Fighter2: "Су-30МК2"
 CZE_CV_MR_Fighter2_desc: "Советский Су-30МК2, выпускаемый на отечественных заводах."
 CZE_CV_MR_Fighter3: "Су-33"
 CZE_CV_MR_Fighter3_desc: "Советский Су-33, выпускаемый на отечественных заводах."
