 SOV_khodorkovsky_path_warning_TT: "§Y이 판결은 러시아의 경제 체제를 결정하는 다섯 건의 판결 중 첫 번째입니다.§! 호도르콥스키에게 §G유죄§!를 선고하면 국가가 §Y유코스를 몰수§!할 수 있습니다. §R무죄§!를 선고하면 유코스는 민간의 손에 남고 사건은 §Y항소§!로 넘어갑니다."
 SOV_khodorkovsky_guilty_path_TT: "호도르콥스키에게 §G유죄§!를 선고하면 §Y푸티니스트 노선§!에 대한 접근이 유지됩니다."
 SOV_khodorkovsky_not_guilty_path_TT: "호도르콥스키에게 §R무죄§!를 선고하면 §Y푸티니스트 노선§!은 막히고 러시아는 §Y자유주의 노선§!으로 나아가게 됩니다."
 SOV_subject_referendum_tt: "§Y이 결정은 해당 지역의 지위에 대한 국민투표를 발생시킵니다. 해당 지역은 [ROOT.GetNameWithFlag]의 자치 종속 주체로 남거나(또는 되거나) 완전한 §R독립§!을 달성할 수 있습니다. 종속 주체로 남을 경우, 해당 지역에서 징수되는 §G연방세§!가 §G증가§!하고, 다른 종속 주체들의 §R분리주의§!는 §G감소§!합니다§!\n"
 SOV_chechnya_referendum_tt: "§Y이 결정은 체첸을 [ROOT.GetNameWithFlag]의 자치 종속 주체로 공식 확립하는 국민투표를 발생시킵니다. 체첸에서 징수되는 §G연방세§!가 §G증가§!하고, 다른 종속 주체들의 §R분리주의§!는 §G감소§!합니다§!\n"
 SOV_opr_instructors: "§Y[OPR.GetNameWithFlag]§!에 GRU 파견"
 SOV_drp_instructors: "§Y[DRP.GetNameWithFlag]§!에 GRU 파견"
 SOV_seu_instructors: "§Y[SEU.GetNameWithFlag]§!에 GRU 파견"
 SOV_wagner_opr_instructors: "§Y[OPR.GetNameWithFlag]§!에 PMC 바그너 파견"
 SOV_wagner_drp_instructors: "§Y[DRP.GetNameWithFlag]§!에 PMC 바그너 파견"
 SOV_computing_sovereignty_chinese_substitution: "중국산 대체"
 SOV_computing_sovereignty_chinese_substitution_desc: "중국 공급업체들이 러시아 컴퓨팅 체계 전반에서 서방의 부품을 대체합니다. 부족 현상은 완화되지만, 의존이 사라진 것이 아니라 옮겨 갔을 뿐입니다."
 SOV_computing_sovereignty_mature_node_specialization: "성숙 공정 특화"
 SOV_computing_sovereignty_mature_node_specialization_desc: "러시아는 최첨단을 쫓는 대신 성숙 공정에서의 견고한 국내 생산에 집중합니다. 첨단 프로세서는 여전히 외부 파운드리 경로를 필요로 합니다."
 SOV_computing_sovereignty_parallel_import_economy: "병행 수입 경제"
 SOV_computing_sovereignty_parallel_import_economy_desc: "비공식 조달 경로를 통해 외국산 하드웨어를 더 높은 비용과 낮은 예측 가능성으로 계속 확보할 수 있습니다. 부족 현상은 해결된 것이 아니라 관리되고 있을 뿐입니다."
 SOV_computing_sovereignty_sovereign_computing_stack: "자주적 컴퓨팅 체계"
 SOV_computing_sovereignty_sovereign_computing_stack_desc: "국내 프로세서 설계, 제조, 소프트웨어, 체계 통합이 이제 일관된 국가 체계를 이루고 있습니다. 이를 유지하려면 지속적인 투자와 전문성이 필요합니다."
 sov_economic.300.a: "엘브루스 아키텍처를 지원한다"
 sov_economic.300.b: "검증된 외국 아키텍처를 기반으로 구축한다"
 sov_economic.300.d: "MCST의 엘브루스 아키텍처를 중심으로 한 상용 프로세서 라인은 x86 생태계 밖에서 러시아의 설계 전문성을 보존할 수 있습니다. 그 가능성을 실제 배치 가능한 하드웨어로 만들려면 인내심 있는 지원, 호환 소프트웨어, 그리고 제조 시설에 대한 지속적인 접근이 필요합니다."
 sov_economic.300.t: "엘브루스라는 도박"
 sov_economic.301.a: "VEB 대출을 보증한다"
 sov_economic.301.b: "경제성이 개선될 때까지 보증을 보류한다"
 sov_economic.301.d: "앙스트렘-T는 AMD의 옛 드레스덴 시설에서 생산 라인을 인수하여 젤레노그라드에 설치할 것을 제안합니다. 이 사업은 국내 생산 능력을 확대할 수 있지만, 부채, 설치 위험, 노후한 공정이 경제성을 위협합니다."
 sov_economic.301.t: "앙스트렘-T 사업"
 sov_economic.302.a: "각 부처에 대체를 의무화한다"
 sov_economic.302.b: "국산 장비가 부족한 곳에서는 조달을 열어 둔다"
 sov_economic.302.d: "제재와 전략적 불안이 수입 대체를 구호에서 교리로 격상시켰습니다. 각 부처는 국산 대안이 여전히 비싸거나 미성숙한 경우에도 엘브루스 프로세서, 바이칼 시스템 칩, 아스트라 리눅스가 외국 체계를 대체하기를 원하고 있습니다."
 sov_economic.302.t: "수입 대체 교리"
 sov_economic.303.a: "장기 금수 조치에 대비한다"
 sov_economic.303.d: "공조된 수출 통제로 인해 러시아는 첨단 반도체, 전자 설계 자동화, 제조 장비에 대한 접근이 제한되었으며, TSMC는 바이칼과 엘브루스 부품의 제조를 아예 중단했습니다. 컴퓨팅 부문은 금수 조치를 감내하고 대체 비용을 부담할 수도 있고, 이를 우회하는 데 필요한 네트워크를 구축할 수도 있습니다."
 sov_economic.303.t: "기술 금수 조치"
 sov_economic.304.a: "아직 제조할 수 있는 공정으로 물러난다"
 sov_economic.304.b: "중국 파운드리로 눈을 돌린다"
 sov_economic.304.c: "국내 생산 라인에 자금을 지원한다"
 sov_economic.304.d: "TSMC는 새로운 수출 통제 체제 아래에서 더 이상 러시아의 프로세서 주문을 받지 않을 것입니다. TSMC를 통해 제조되던 엘브루스 제품은 이제 기존의 생산 경로를 잃어, 공급 충격이 전략적 위기로 번지고 있습니다."
 sov_economic.304.t: "닫히는 TSMC의 문"
 sov_economic.305.a: "중국 파운드리를 대체재로 받아들인다"
 sov_economic.305.e: "실제로 만들 수 있는 성숙 공정으로 후퇴한다"
 sov_economic.305.d: "수년간의 투자와 위기 관리 끝에 MCST의 엘브루스 라인, 바이칼, 젤레노그라드 제조 공장, 국내 소프트웨어 기업들이 하나의 국가 전략으로 묶였습니다. 지금 정해지는 균형이 러시아가 독자적인 첨단 분야를 보유할지, 관리되는 의존 상태로 살아갈지, 아니면 여전히 만들 수 있는 것에 만족할지를 결정합니다."
 sov_economic.305.t: "자주적 컴퓨팅 체계"
 sov_economic.303.b: "통제를 우회하는 네트워크를 구축한다"
 sov_economic.305.b: "병행 수입 경제를 공식화한다"
 sov_economic.305.c: "자주적 체계의 완성을 선언한다"
 SOV_khodorkovsky_verdict_delivered_TT: "호도르콥스키 사건에 대한 판결이 내려졌습니다"
 SOV_verdict_scorecard_TT: "§H지금까지의 올리가르히와의 투쟁:§!\n친정부 판결: §Y[?SOV_statist_verdicts]§!/§Y5§!\n친올리가르히 판결: §Y[?SOV_oligarch_verdicts]§!/§Y5§!\n§Y친정부§! 판결이 과반이면 §Y국가 조합주의§!가, §Y친올리가르히§! 판결이 과반이면 §Y과두 공화국§!이, 양쪽 판결이 각각 최소 §Y2§!건이면 §Y혼합 경제 체제§!가 열립니다."
 SOV_ruling_statist_TT: "§H국가 편에서 판결할 경우:§!"
 SOV_ruling_statist_hardline_TT: "§H그를 매수하는 대신 투옥할 경우:§!"
 SOV_ruling_oligarch_TT: "§H올리가르히 편에서 판결할 경우:§!"
 SOV_media_path_fork_TT: "§Y구신스키를 석방§!하면 방송망이 민간의 손에 남고 국영 언론 노선 대신 §Y독립 방송§! 노선이 열립니다. 어느 쪽이든 이 갈래는 계속됩니다."
 SOV_economic_rus_hydro_TT: "§Y[671.GetName]§!, §Y[1065.GetName]§!, §Y[1069.GetName]§!의 수력 발전량이 §G25%§! 증가했습니다"
 SOV_economic_rus_hydro_expanded_TT: "§Y볼가-카마 계단식 발전소§! 전체의 수력 발전량이 §G25%§! 증가했습니다"
 SOV_has_empowered_fsb: "§YFSB§!가 실로비키의 지휘를 받는다"
 SOV_has_internal_troops: "§Y내무군§!이 러시아 국가 근위대에 넘겨지지 않았다"
 SOV_sber_ipo_done_tt: "스베르뱅크가 §Y시장에 상장§!되었습니다"
 SOV_economy_modifier: "러시아 경제"
 SOV_economy_modifier_desc: "국가가 소유하거나 지분을 보유하거나 의존하는 기업들의 상시 장부입니다. 모스크바의 손아귀에 다시 들어온 모든 기업이 이곳에 흔적을 남깁니다."
 SOV_capitalisation_modifier: "기업 시가 총액"
 SOV_capitalisation_modifier_desc: "시장이 우리의 국가 대표 기업들에 매기는 가치입니다. 시가 총액이 클수록 국고와 연구진이 그들에게서 얻는 것이 많아집니다."
 SOV_landforce_modifier: "지상군"
 SOV_landforce_modifier_desc: "BMP, BTR, T-72부터 T-90에 이르는 계열의 장비를 갖춘 차량화 소총 및 전차 부대를 중심으로 구성된 러시아군 최대의 군종입니다. 뉴 룩 개혁은 물려받은 사단 편제를 상시 전투 준비 여단으로 분해했으나, 이후 서부 전선을 따라 사단이 재편되면서 이 결정은 번복되었습니다."
 SOV_airforce_modifier: "항공우주군"
 SOV_airforce_modifier_desc: "공군과 항공우주방위군을 통합하여 창설되었으며, 항공, 대공 방어, 군사 우주 작전을 단일 지휘 체계 아래 두었습니다. 전투력은 Su-27 파생형, Su-34 타격 전력, 그리고 미사일 발사를 감시하는 조기 경보망에 기반합니다."
 SOV_navy_modifier: "해군 함대"
 SOV_navy_modifier_desc: "북방, 태평양, 발트, 흑해 함대와 카스피 소함대로 나뉘며, 탄도 미사일 잠수함 전력이 중심입니다. 오랫동안 노후한 소련 시대의 함체에 의존해 왔으며, 보레이급과 야센급 사업이 대체 전력을 인도하기를 기다리고 있습니다."
 SOV_intelligence_modifier: "보안 기관"
 SOV_intelligence_modifier_desc: "암호 및 신호 정보 업무는 과거 연방정부통신정보국(FAPSI)의 소관이었으나, 이 기관이 해체되면서 그 기능은 FSB, SVR, GRU로 나뉘었습니다. 그 곁에는 국내 치안을 담당하는 기관들이 있습니다. 내무부군에서 분리되어 대통령 직속으로 편입된 러시아 국가 근위대, 그것이 흡수한 OMON 진압 부대, 그리고 군사 정보와 해외 스페츠나츠 여단을 운영하는 GRU입니다."
 SOV_corrupt_oligarchy_desc: "1990년대 중반의 주식 담보 대출 경매는 러시아의 가장 큰 산업 및 에너지 자산을 소수의 금융가 집단에 가치의 극히 일부만 받고 넘겨주었습니다. 그 결과 형성된 과두 체제는 국가를 흥정의 대상으로 취급하며, 그들의 동의 없이는 어떤 개혁도 통과되지 않습니다.\n§W--------------§!\n이 국가 정신은 러시아 산업의 소유권 문제를 매듭짓는 §H정치 분기§!의 중점으로 §R제거§!됩니다. 모든 정치 노선이 그 중점을 하나씩 제공합니다."
 SOV_the_plundered_russian_navy1_desc: "10년간의 급여 미지급 승조원과 부품을 뜯어낸 선체는 함대 대부분을 부두에 묶어 두었습니다. 아직 항해하는 함선들도 빌려 온 부품과 단축된 순찰로 버티고 있습니다.\n§W--------------§!\n이 국가 정신은 §H러시아 해군 개혁§! 중점으로 §H부분 재건된 함대§!로 §G완화§!됩니다."
 SOV_the_plundered_russian_navy2_desc: "조선소가 다시 가동되고 녹의 최악의 부분은 제거되었으나, 함대는 여전히 다른 해군을 위해 건조된 선체를 중심으로 구성되어 있습니다.\n§W--------------§!\n이 국가 정신은 §H개정된 해군 교리§! 중점으로 §H거의 재건된 함대§!로 §G완화§!되며, 이를 위해서는 먼저 §H낡은 군대§! 국가 정신이 사라져야 합니다."
 SOV_the_plundered_russian_navy3_desc: "이제 러시아가 실제로 감당할 수 있는 함대를 위한 교리가 마련되었습니다. 남은 것은 현대화 계획 그 자체뿐입니다.\n§W--------------§!\n이 국가 정신은 §H함대 현대화 착수§! 중점으로 §R제거§!됩니다."
 SOV_otkos_army_idea_desc: "돈을 낼 수 있는 징집병은 복무하지 않습니다. 뇌물은 장교단을 잠잠하게 하고 두마를 협조적으로 만들지만, 군이 약속받은 병력을 잃는 대가를 치릅니다.\n§W--------------§!\n이 국가 정신은 §Y[communist_state_L]§! 또는 §Y[Neutral_Communism_L]§!이(가) 집권하면 §R상실§!됩니다."
 SOV_oligarch_supply_army_idea_desc: "러시아 산업을 소유한 이들은 자신들의 자산 인근에 주둔한 부대를 후원하기로 동의했으며, 예산이 감당하지 못하는 연료, 식량, 수리 비용을 부담합니다.\n§W--------------§!\n이 국가 정신은 §Y[Monarchist_L]§! 또는 §Y[Nat_Populism_L]§!이(가) 통치하는 동안에만 유지되며, 다른 누구든 집권하는 즉시 §R상실§!됩니다."
 SOV_leib_guard_idea_desc: "역사적인 근위 연대들이 군주의 호위대로 재건되어, 최정예 특수 부대원들을 옥좌에 복종하는 부대로 끌어모았습니다.\n§W--------------§!\n이 국가 정신은 §Y[communist_state_L]§! 또는 §Y[Neutral_Communism_L]§!이(가) 집권하면 §R상실§!됩니다."
 SOV_military_priests_desc: "연대 군종 사제가 편제에 다시 편입되었으며, 총대주교청은 이제 요청하는 모든 부대의 군기에 축복을 내립니다.\n§W--------------§!\n이 국가 정신은 §Y[Monarchist_L]§! 또는 §Y[Nat_Populism_L]§!이(가) 통치하는 동안에만 유지되며, 다른 누구든 집권하는 즉시 §R상실§!됩니다."
 SOV_economic_tv6_broadcasting: "TV-6, 독립 방송사"
 SOV_economic_tv6_broadcasting_desc: "구신스키가 자유의 몸이 되면서 NTV 보도국은 온전히 유지된 채 TV-6로 옮겨 갑니다. 우리는 이 채널을 장악하는 대신 허가를 내주어, 두 번째 전국 방송사가 크렘린이 아닌 주주에게 책임지도록 할 것입니다."
 SOV_economic_independent_press: "독립 언론 헌장"
 SOV_economic_independent_press_desc: "국가가 마음대로 철회할 수 없는 발행 허가에 스스로를 묶는 헌장입니다. 편집권의 독립은 양보가 아니라 법적 보장이 되지만, 국가 소유가 우리에게 안겨 주었을 여론에 대한 영향력을 대가로 치르게 됩니다."
 SOV_independent_media_idea: "독립 언론"
 SOV_auto_industry_idea: "러시아 자동차 산업"
 SOV_auto_industry_idea_desc: "아프토바즈, GAZ, 카마즈는 1990년대를 물물교환과 임금 체불로 버텨 냈습니다. 공장이 다시 가동되고 세법이 개정되면서, 톨리야티, 니즈니노브고로드, 나베레즈니예첼니의 조립 라인은 마침내 차량을 살 여유가 생긴 국내 시장을 위해 차량을 쏟아내고 있습니다."
 SOV_yukos_idea_desc: "유코스는 러시아에서 가장 크고 수익성이 높은 석유 생산업체로, 서구식 회계 기준에 따라 운영되며 점점 자체적인 정치적 의제를 추구하고 있습니다. 공격적인 세금 최적화로 막대한 석유 수입이 연방 예산 바깥에 머물고 있습니다.\n§W--------------§!\n이 국가 정신은 호도르콥스키 사건이 해결되면 §R제거§!됩니다. 그의 무죄 판결은 즉시 이를 해제하며, 유죄 판결에는 §H호도르콥스키 재판§! 및 §H유코스 석유 장악§! 중점이 필요합니다."
 SOV_broken_economy_idea_1_desc: "소련 산업의 붕괴와 1998년 채무 불이행은 생산, 연구, 세수를 폐허로 만들었습니다. 산업 전체가 물물교환과 임금 체불로 연명하고 있으며, 국고는 그 잔재를 지탱하기에도 벅찹니다.\n§W--------------§!\n이 국가 정신은 £text_icon_sov_ruble §H경제 회복§!이 §H10§! 이상이고 정치력 §H250§!이 드는 §H경제 성장 선포§! 결정으로 §H심각한 경제적 여파§!로 §G완화§!됩니다.\n§W--------------§!\n£text_icon_sov_ruble §Y경제 회복§!은 §H경제 분기§!의 중점을 완료할 때마다 상승합니다. 현재: §Y[?SOV.SOV_economic|0]§!"
 SOV_broken_economy_idea_2_desc: "위기의 최악의 국면은 지나갔고 생산은 다시 오르고 있으나, 1990년대의 상처는 가동되지 않는 설비, 구식 장비, 전문가 한 세대를 통째로 잃은 연구 기반에서 여전히 뚜렷합니다.\n§W--------------§!\n이 국가 정신은 §H러시아 경제§! 중점과 £text_icon_sov_ruble §H경제 회복§! §H20§! 이상이 필요하고 정치력 §H250§!이 드는 §H경제 성장 선포§! 결정으로 §H평범한 경제적 여파§!로 §G완화§!됩니다.\n§W--------------§!\n£text_icon_sov_ruble §Y경제 회복§!은 §H경제 분기§!의 중점을 완료할 때마다 상승합니다. 현재: §Y[?SOV.SOV_economic|0]§!"
 SOV_broken_economy_idea_3_desc: "성장이 돌아오고 예산은 흑자이지만, 생산성과 인프라, 산업 역량은 여전히 소련 붕괴 이전 수준에 크게 못 미칩니다.\n§W--------------§!\n이 국가 정신은 §H러시아 경제§! 중점과 £text_icon_sov_ruble §H경제 회복§! §H30§! 이상이 필요하고 정치력 §H350§!이 드는 §H경제 성장 선포§! 결정으로 §R제거§!됩니다.\n§W--------------§!\n£text_icon_sov_ruble §Y경제 회복§!은 §H경제 분기§!의 중점을 완료할 때마다 상승하며 §H30§!에서 상한에 도달합니다. 현재: §Y[?SOV.SOV_economic|0]§!"
 sov_economic.306.t: "검찰의 항소"
 sov_economic.306.d: "무죄 판결로도 문제는 끝나지 않았습니다. 검찰총장실이 유코스의 장부가 제대로 조사된 적이 없으며 판결은 합리적 판단이 아니라 매수된 것이라고 주장하며 항소를 제기했습니다. 올리가르히들은 무죄 판결이 유지될 수 있을지 지켜보고 있습니다."
 sov_economic.306.a: "항소를 밀어붙여라."
 sov_economic.306.b: "판결을 그대로 두어라."
