 UKR_repair_bombers_category_desc: "\n\n\n\n\n\n£UKR_desctext_tu_160_main\n\n\n\n\n\n\n\n\n§Y[UKR.GetNameWithFlag]§!의 장거리 항공대 전력을 보존하기로 한 만큼, 이제 이 항공기들을 가동 가능한 상태로 복원하는 노력이 필요합니다. 이를 위해서는 막대한 자원과 전문 장비, 그리고 우크라이나 항공 기업들의 전문 기술이 필요합니다.\n\n보관 중인 §YTu-160§! 수량: §C[?tu160_storage|0]§! \n보관 중인 §YTu-95MS§! 수량: §C[?tu95_storage|0]§! \n보관 중인 §YTu-22M2§! 수량: §C[?tu22m2_storage|0]§! \n보관 중인 §YTu-142§! 수량: §C[?tu142_storage|0]§! \n\n사용 가능한 조립 라인: 전체 §C[?UKR_repair_slots_max|0]§!개 중 §G[?UKR_repair_slots_free|0]§!개"
