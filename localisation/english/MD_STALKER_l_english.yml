l_english:
 STALKER.1.t: "The Zone Breaches Containment"
 STALKER.1.d: "Anomalous activity around Chornobyl has expanded beyond the old exclusion perimeter. The government must decide whether to seal the Zone under military authority or permit controlled scientific access."
 STALKER.1.a: "Seal the perimeter under military control."
 STALKER.1.b: "Open the Zone to scientific teams."
 STALKER_military_policy_tt: "Costs §Y0.2%§! of GDP. Raises Zone §Ycontainment§! by §Y30§!. The first emission is guaranteed after the §Y90-day§! grace period. In the Chornobyl Zone this gives containment §Y60§!, exploitation §Y0§!, and §Y2%§! recurring monthly risk before emission effects or further actions."
 STALKER_scientific_policy_tt: "Costs §Y0.2%§! of GDP. Raises Zone §Yexploitation§! by §Y30§!, providing research speed while this Zone remains under our control. The first emission is guaranteed after the §Y90-day§! grace period. In the Chornobyl Zone this gives containment §Y30§!, exploitation §Y30§!, §G+1.5%§! research speed, and §Y12%§! recurring monthly risk before emission effects or further actions."
 STALKER.2.t: "An Emission Sweeps the Zone"
 STALKER.2.d: "A violent wave of anomalous energy has swept across [event_target:STALKER_zone_event_target.GetName]. Infrastructure has been disrupted and the Zone has become more active."
 STALKER.2.a: "Assess the damage."
 STALKER.2.b: "Reinforce the perimeter."
 STALKER.2.b_tt: "Spend §Y50§! political power to raise containment by up to §G15§!, lower activity by up to §G10§!, and lower exploitation by up to §R5§!."
 STALKER.2.c: "Study the emission residue."
 STALKER.2.c_tt: "Spend §Y25§! political power to raise exploitation by up to §G15§! while lowering containment by up to §R5§!."
 STALKER_zone_management_category: "Zone Administration"
 STALKER_zone_management_category_desc: "Balance containment, public safety, and scientific access in the anomalous territories under our control."
 STALKER_reinforce_zone_containment: "Reinforce the Perimeter in [FROM.GetName]"
 STALKER_reinforce_zone_containment_desc: "Deploy additional personnel and equipment to suppress anomalous activity in [FROM.GetName].\n\nCurrent activity: §Y[?FROM.STALKER_zone_activity|0]§!\nCurrent containment: §Y[?FROM.STALKER_zone_containment|0]§!\nCurrent exploitation: §Y[?FROM.STALKER_zone_exploitation|0]§!\nEmission outlook: §Y[FROM.STALKER_current_emission_risk]§!\n\nAfter the first emission, monthly risk is §Y(Activity + Exploitation - Containment) × 0.2§!, clamped between §Y2%§! and §Y20%§!."
 STALKER_reinforce_zone_containment_tt: "Zone §Ycontainment§! increases by §G20§!, while §Yactivity§! falls by up to §G10§! and §Yexploitation§! falls by up to §R5§!."
 STALKER_zone_presence: "The Zone"
 STALKER_zone_presence_desc: "An expanding region of lethal anomalies, altered ecosystems, and unreliable physical laws."
 STALKER_emission_disruption: "Emission Disruption"
 STALKER_emission_disruption_desc: "A recent emission has disrupted military and economic activity."
 STALKER_zone_administration: "Zone Administration"
 STALKER_zone_administration_desc: "Maintaining the perimeter consumes national resources, while controlled exploitation of the Zone produces scientific insights."
 STALKER_first_emission_outlook: "Opening emission guaranteed on the first monthly pulse after the 90-day grace period and policy selection"
 STALKER_emission_cooldown_outlook: "No emission risk while the 180-day cooldown is active"
 STALKER_current_emission_risk_value: "[?STALKER_emission_risk_display|.1]%"
