l_french:
 hong_kong_focus: "Arbre de focus de Hong Kong"
 HKG_divided_hong_kong: "Un Hong Kong divisé"
 HKG_divided_hong_kong_desc: "Les dernières années de la domination britannique à Hong Kong ont laissé un héritage de démocratie pluraliste. Elles ont toutefois aussi produit d'interminables disputes entre les camps pro-établissement, pro-démocratie et localiste, réduisant l'efficacité administrative à chaque tournant. Les gens commencent à se demander si cette « démocratie » chaotique est vraiment aussi bonne qu'on le dit."
 HKG_support_pro_beijing_camp: "Soutenir le camp pro-Pékin"
 HKG_support_pro_beijing_camp_desc: "« La liberté n'est pas sans importance. Mais dans notre culture sociale, la liberté n'est pas aussi importante que la stabilité. » Il est temps que le monde voie un Hong Kong plus stable et plus sûr."
 HKG_railway_development_strategy_2000: "Stratégie de développement ferroviaire 2000"
 HKG_railway_development_strategy_2000_desc: "Une population croissante et un commerce transfrontalier en hausse poussent le réseau routier de Hong Kong vers la saturation. La stratégie de développement ferroviaire 2000 guidera l'expansion du MTR durant la prochaine décennie, en reportant navetteurs et fret de la route vers le rail."
 HKG_sign_CEPA: "Signer le CEPA"
 HKG_sign_CEPA_desc: "L'arrangement de partenariat économique plus étroit formalise un accès commercial préférentiel entre Hong Kong et le continent. Un atout pour le commerce transfrontalier, et un pas de plus vers l'interdépendance économique."
 HKG_approve_funding_for_XRL: "Approuver le financement de la XRL"
 HKG_approve_funding_for_XRL_desc: "La liaison ferroviaire express reliera Hong Kong directement au réseau à grande vitesse du continent. Le financement est considérable, le symbolisme politique plus encore."
 HKG_co_location_bill: "Le projet de colocalisation"
 HKG_co_location_bill_desc: "Un projet de loi controversé plaçant la juridiction des forces de l'ordre chinoises continentales à la gare XRL de West Kowloon. Le camp pro-Pékin y voit du pragmatisme, les pan-démocrates une atteinte constitutionnelle."
 HKG_electoral_reform: "Réforme électorale"
 HKG_electoral_reform_desc: "La Loi fondamentale prescrivait comment le chef de l'exécutif serait choisi pour les deux premiers mandats et le LegCo pour les trois premiers, mais ne dit rien des élections suivantes. C'est l'occasion de pousser une réforme du système électoral et d'avancer vers un véritable suffrage universel."
 HKG_a_broader_electorate: "Un électorat plus large ?"
 HKG_a_broader_electorate_desc: "Le suffrage universel à Hong Kong ne peut pas se faire du jour au lendemain. Comme étape intermédiaire, nous pouvons pétitionner le NPCSC pour élargir l'effectif du comité électoral, rendant les élections plus démocratiques sans passer directement au suffrage intégral."
 HKG_choose_your_own_puppet: "\\"Choisissez votre propre marionnette\\""
 HKG_choose_your_own_puppet_desc: "Le suffrage universel à Hong Kong doit être atteint, mais pas au prix de la stabilité. Le comité de nomination veillera à ce que seuls ceux qui sont vraiment « patriotes envers la Chine et Hong Kong » puissent se présenter comme chef de l'exécutif."
 HKG_a_new_reform_attempt: "Une nouvelle tentative de réforme"
 HKG_a_new_reform_attempt_desc: "Le LegCo est à nouveau invité à examiner la réforme électorale. Passera-t-elle cette fois, ou l'histoire se répétera-t-elle ?"
 HKG_support_pan_democrats: "Soutenir les pan-démocrates"
 HKG_support_pan_democrats_desc: "La démocratie et la liberté sont déjà tissées dans le tissu de la vie hongkongaise, et Deng Xiaoping a promis de ne pas s'immiscer dans ses affaires intérieures. Nous devons participer activement au mouvement démocratique et défendre les libertés qui sous-tendent la prospérité de Hong Kong."
 HKG_keep_to_one_country_two_systems: "Rester fidèle à un pays, deux systèmes"
 HKG_keep_to_one_country_two_systems_desc: "« Un pays, deux systèmes » fonctionne sans heurt. Le continent se sert de Hong Kong comme pierre angulaire de sa politique d'ouverture, tandis que Hong Kong s'appuie sur la garantie des « cinquante ans sans changement » pour préserver un mode de vie qui le distingue du reste de la Chine. L'arrangement sert les deux parties, et il est clairement dans notre intérêt mutuel de le maintenir intact."
 HKG_hong_kong_post_2047_status: "Le statut de Hong Kong après 2047"
 HKG_hong_kong_post_2047_status_desc: "Deng Xiaoping a promis que le système politique et économique de Hong Kong resterait inchangé pendant cinquante ans, mais personne ne peut dire à quoi ressemblera la ville après 2047. L'heure est venue d'envisager son avenir."
 HKG_stick_to_CPC_line: "S'en tenir à la ligne du PCC"
 HKG_stick_to_CPC_line_desc: "Hong Kong s'alignera discrètement sur la ligne préférée de Pékin sur les questions contestées. Les pan-démocrates seront furieux, le camp patriotique ravi."
 HKG_loyal_puppet: "« Le pantin loyal »"
 HKG_loyal_puppet_desc: "Les pan-démocrates ont montré leur jeu, et les rues leur fureur. La stabilité et la prospérité exigent que Hong Kong s'engage, ouvertement et sans excuses, sur la voie tracée par Pékin. La transition vers une région administrative spéciale pleinement intégrée ne sera pas populaire, mais elle sera définitive."
 HKG_promote_patriotism: "Promouvoir le patriotisme"
 HKG_promote_patriotism_desc: "Une génération élevée aux manuels coloniaux et à la sentimentalité cantopop ne peut pas être comptée pour défendre la mère patrie. L'éducation à la sécurité nationale sera ancrée dans chaque salle de classe, chaque lieu de travail, chaque diffuseur. La loyauté au Parti, c'est la loyauté à Hong Kong."
 HKG_patriots_governing: "Patriotes au pouvoir à Hong Kong"
 HKG_patriots_governing_desc: "La fonction publique a trop longtemps répondu aux habitudes coloniales et à de silencieuses sympathies. Des comités de filtrage balayeront la bureaucratie, des officiers de district aux administrateurs seniors, remplaçant les hésitants par des patriotes éprouvés. La productivité souffrira à court terme ; la fiabilité, non."
 HKG_suppress_cantonese_local_culture: "Supprimer la culture locale cantonaise"
 HKG_suppress_cantonese_local_culture_desc: "Hong Kong est chinois, et chinois veut dire mandarin. La diffusion cantonaise sera restreinte, les festivals d'identité locale discrètement privés de fonds, et les voix dissidentes du secteur culturel déplatformées. Le prix sera l'agitation dans les rues et le ressentiment au foyer, mais une culture nationale unifiée en vaut le coût."
 HKG_reduce_size_of_LegCo: "Réduire la taille du LegCo"
 HKG_reduce_size_of_LegCo_desc: "Le Conseil législatif s'est alourdi de sièges de district qui ne servent que de scènes au théâtre de l'opposition. Une chambre allégée, avec moins de sièges élus au suffrage direct et davantage de circonscriptions fonctionnelles, laissera le gouvernement gouverner. Le programme de talents du continent comblera les vides avec des administrateurs formés à Pékin et Shenzhen."
 HKG_gong_zyu_ou_integration: "Intégration Hong Kong-Zhuhai-Macao"
 HKG_gong_zyu_ou_integration_desc: "« Un pays, deux systèmes » n'a jamais été qu'un arrangement transitoire. Les patriotes gouvernant la RAS, la frontière entre Hong Kong, Zhuhai et Macao devient administrative plutôt que significative. Infrastructures transfrontalières, réglementation harmonisée et viviers de talents partagés achèvent la Grande baie comme un seul corps économique, prêt à la pleine réintégration à la mère patrie."
 HKG_gong_zyu_ou_integration_tt: "Si Hong Kong est actuellement un sujet de §Y[CHI.GetFlag]§!, la RAS est annexée et absorbée dans la Grande baie. Sinon, cela achève l'alignement politique loyaliste sans transfert immédiat de souveraineté."
 HKG_support_democracy_in_china: "Soutenir la démocratie en Chine"
 HKG_support_democracy_in_china_desc: "Le mouvement pro-démocratie de Hong Kong soutiendra ouvertement les efforts de réforme sur le continent. Un défi direct à l'autorité de Pékin."
 HKG_commemorate_june_fourth: "Commémorons le 4 juin"
 HKG_commemorate_june_fourth_desc: "La veillée au Victoria Park a lieu chaque année depuis 1990, et chaque année Pékin l'a regardée avec un mécontentement silencieux. Cette année, nous la rendons officielle : une commémoration publique sanctionnée par le gouvernement de la RAS, avec les bougies, les chants et les noms des morts. Le continent n'oubliera pas. Nous non plus."
 HKG_inspire_chinese_grassroots_movements: "Inspirer les mouvements populaires chinois"
 HKG_inspire_chinese_grassroots_movements_desc: "Hong Kong ne peut pas sauver le continent seul, mais il peut montrer à quoi ressemble la démocratie chinoise en pratique. Diffusions ouvertes vers le delta de la Rivière des Perles, pamphlets clandestins aux passages frontaliers, et discret soutien financier aux réseaux de samizdat — les graines du changement plantées depuis la ville chinoise la plus libre."
 HKG_call_on_CPC_to_release_dissidents: "Appeler le PCC à libérer les dissidents"
 HKG_call_on_CPC_to_release_dissidents_desc: "Les noms sont connus : Liu Xiaobo, Wang Bingzhang, Xu Wenli, des dizaines d'autres. Le gouvernement de la RAS exige formellement et publiquement leur libération. Pékin refusera, bien sûr — mais l'exigence met les prisons du régime à l'agenda international."
 HKG_pro_democracy_media_charter: "Charte des médias pro-démocratie"
 HKG_pro_democracy_media_charter_desc: "La liberté de la presse n'est pas un slogan mais un régime juridique. La Charte codifie les protections des journalistes, criminalise l'ingérence politique dans les décisions éditoriales et établit un radiodiffuseur public véritablement indépendant de l'exécutif. L'idée Presse muselée est annulée."
 HKG_fund_civil_society: "Fonds pour la société civile"
 HKG_fund_civil_society_desc: "Subventions publiques aux ONG, associations de quartier, cliniques d'aide juridique et plaidoyer pro-démocratie. Le Trésor encaisse le coup ; le corps politique se fortifie. Une démocratie sans société civile est un forum sans public."
 HKG_legco_reform_petition: "Pétition de réforme du Conseil législatif"
 HKG_legco_reform_petition_desc: "Une pétition formelle à Pékin pour un véritable suffrage universel aux élections du Conseil législatif. Élection directe de tous les sièges, abolition des circonscriptions fonctionnelles, pas de comité de nomination. L'idée Absence de suffrage universel est remplacée par Suffrage universel limité comme première concession."
 HKG_accountability_for_tiananmen: "Responsabilité pour Tiananmen"
 HKG_accountability_for_tiananmen_desc: "Nous nommons les hommes qui ont donné les ordres. Nous nommons les unités qui les ont exécutés. Nous ouvrons les archives de la RAS, soutenons les tribunaux internationaux et amplifions le témoignage des survivants. Pékin y verra une déclaration de guerre au Parti. Les démocrates de Hong Kong entendront un autre message."
 HKG_peaceful_democratic_path: "Voie démocratique pacifique"
 HKG_peaceful_democratic_path_desc: "Réformer de l'intérieur, pas confronter de l'extérieur. Hong Kong consolide ses institutions démocratiques, stabilise la société civile et attend que le continent change selon son propre calendrier. Les bougies brûlent encore au Victoria Park, mais les rues restent calmes. La prochaine phase de réforme commence depuis une position de force."
 HKG_appease_localists: "Apaiser les localistes"
 HKG_appease_localists_desc: "Des concessions au mouvement localiste : préservation de la langue cantonaise, politiques d'embauche locales d'abord, et ralentissement des projets d'intégration transfrontalière."
 HKG_stoke_anti_mainland_sentiment: "Attiser le sentiment anti-continental"
 HKG_stoke_anti_mainland_sentiment_desc: "La Chine a pris tous les bénéfices et a laissé aux Hongkongais des prix immobiliers élevés et un faible pouvoir d'achat. Pourquoi Hong Kong devrait-il rester avec la Chine et accepter d'être une minuscule colonie de la Chine ?"
 HKG_restrict_tourism_immigration: "Restreindre le tourisme et l’immigration"
 HKG_restrict_tourism_immigration_desc: "De nouveaux plafonds sur les touristes du continent et des règles d'immigration transfrontalière plus strictes. Les locaux apprécieront l'espace pour respirer ; les commerçants et promoteurs, moins."
 HKG_emphasize_hong_kong_identity: "Mettre l'accent sur l'identité de Hong Kong"
 HKG_emphasize_hong_kong_identity_desc: "La sécession réussie de Singapour vis-à-vis de la Malaisie tenait aux réformes de conscience identitaire nationale de M. Lee Kuan Yew. Hong Kong est parfaitement capable d'adopter la même approche."
 HKG_distance_from_china: "Distance vis-à-vis de la Chine"
 HKG_distance_from_china_desc: "Hong Kong, il est temps de lever l'ancre et de se libérer du contrôle de la Chine."
 HKG_great_hong_kong_nation: "Grande nation de Hong Kong"
 HKG_great_hong_kong_nation_desc: "La rétrocession était une trahison. Les promesses de cinquante ans sont un mensonge. Hong Kong est une nation, pas une province, et une nation exige son propre drapeau, ses propres frontières, ses propres forces armées. Nous déclarerons ce qui n'aurait jamais dû être négocié."
 HKG_hong_kong_first: "Hong Kong d’abord"
 HKG_hong_kong_first_desc: "Des ports d'Aberdeen aux gratte-ciel de Mong Kok, Hong Kong appartient aux Hongkongais. Investissement, main-d'œuvre et influence du continent seront soumis à la volonté de la population locale. La citoyenneté est un héritage, pas une commodité transférable."
 HKG_hong_kong_state_constitution: "Nouvelle Constitution de l'État de Hong Kong"
 HKG_hong_kong_state_constitution_desc: "La Loi fondamentale a été rédigée à Pékin, signée à Londres, et imposée à un peuple qui n'avait de vote dans aucune des deux capitales. Une nouvelle constitution rédigée à Central, par des Hongkongais, pour des Hongkongais, la remplace. La transition est définitive."
 HKG_armed_forces_of_hong_kong: "Forces armées de Hong Kong"
 HKG_armed_forces_of_hong_kong_desc: "Une nation qui ne peut se défendre n'est pas une nation. La force de défense de Hong Kong, tirée de volontaires comme de conscrits, alignera une infanterie capable de tenir les Nouveaux Territoires et une garde côtière capable de défier toute incursion. Les restrictions militaires de la Loi fondamentale sont lettre morte."
 HKG_irredentist_claim_pearl_river: "Revendiquer le delta de la Rivière des Perles"
 HKG_irredentist_claim_pearl_river_desc: "Le delta de la Rivière des Perles — Shenzhen, Guangzhou, Zhuhai — était cantonais avant d'être communiste, et les gens là-bas partagent plus avec nous qu'avec Pékin. Nous affirmons ouvertement notre revendication. Par la négociation ou par la force, le delta se réunira à son cœur culturel."
 HKG_little_bird_under_british_wing: "Petit oiseau sous l'aile britannique"
 HKG_little_bird_under_british_wing_desc: "Le fait que Hong Kong se soit séparé de la Chine ne signifie pas qu'il puisse survivre seul dans le monde. Nous avons besoin de l'aide d'autrui. Et nos anciens maîtres britanniques ?"
 HKG_request_rerule_british_government: "Demander à être de nouveau gouverné par le gouvernement britannique"
 HKG_request_rerule_british_government_desc: "Jadis, les négociations sino-britanniques n'ont jamais honoré le souhait du peuple de Hong Kong de rester dans l'Empire britannique. Cette fois, nous suivrons notre propre cœur."
 HKG_aukus_intelligence_share: "Partage de renseignements AUKUS"
 HKG_aukus_intelligence_share_desc: "Les services de renseignement britanniques, américains et australiens ont longtemps maintenu un intérêt discret pour Hong Kong. Un transfert technologique et une coopération en signaux formalisés, sous l'égide d'AUKUS, placent fermement la RAS dans l'architecture de sécurité de l'Anglosphère."
 HKG_uk_garrison_rights: "Droits de garnison britannique"
 HKG_uk_garrison_rights_desc: "Un détachement symbolique de Royal Marines à Stonecutters, des escales de la Royal Navy dans Victoria Harbour, et un accord de basing qui permet à la Grande-Bretagne d'atteindre la mer de Chine méridionale depuis un rivage ami. La garnison est petite. Le signal, non."
 HKG_commonwealth_realm_ambition: "Ambition du Royaume du Commonwealth"
 HKG_commonwealth_realm_ambition_desc: "Canada, Australie, Nouvelle-Zélande — tous jadis colonies, tous désormais royaumes, tous encore sous la Couronne. Hong Kong pétitionne les chefs de gouvernement du Commonwealth pour être accueilli de nouveau, non comme possession mais comme royaume souverain partageant un monarque. L'affront historique de la rétrocession trouve sa longue réponse."
 HKG_city_state_idea: "L'idée de cité-État"
 HKG_city_state_idea_desc: "Singapour a prouvé que c'était possible. Une ville à majorité chinoise, entourée de puissances plus grandes, peut survivre et prospérer comme plaque commerciale souveraine si elle choisit la neutralité et la compétence plutôt que l'idéologie. Hong Kong suivra ce modèle, mais en mieux."
 HKG_revise_basic_law: "Réviser la Loi fondamentale"
 HKG_revise_basic_law_desc: "La Loi fondamentale a été rédigée comme document transitoire, Pékin étant l'autorité ultime implicite. Une charte révisée en ôte ces clauses, affirme la pleine souveraineté et réécrit le cadre de la RAS en république de droit. La défense et la politique étrangère appartiennent désormais à Hong Kong."
 HKG_pearl_of_east_asia: "La perle de l'Asie de l'Est"
 HKG_pearl_of_east_asia_desc: "Libre des contraintes du continent comme des enchevêtrements occidentaux, la ville se positionne comme l'entrepôt financier et commercial sans rival de l'Asie de l'Est. Les capitaux affluent à Central. Les talents affluent à Wan Chai. La Perle éclipse Shanghai comme Singapour."
 HKG_global_financial_capital: "Capitale financière mondiale"
 HKG_global_financial_capital_desc: "HKEX, une autorité monétaire indépendante, et un régime réglementaire conçu pour attirer les capitaux qui ne peuvent plus faire confiance à New York ou Londres. Hong Kong devient le centre de gravité financier de l'Asie-Pacifique — discrètement, profitablement, irremplaçablement."
 HKG_coastal_defence_doctrine: "Doctrine de défense côtière"
 HKG_coastal_defence_doctrine_desc: "Une cité-État ne peut se permettre une marine de haute mer, mais elle peut rendre toute incursion coûteuse. Missiles antinavires, approches minées, port durci et doctrine axée sur le déni plutôt que la projection. Hong Kong sera un porc-épic, pas un lion."
 HKG_under_lion_rock_hill: "Sous le Lion Rock"
 HKG_under_lion_rock_hill_desc: "§CSur le même bateau, au pied du Rocher, nous lutterons unis\n\nTous égaux sous le Soleil.\n\nQuand nous serons libres et unis\n\nNous poursuivrons nos rêves de joie\n\nEnsemble, une âme, un cœur\n\nUn espoir que nulle peur ne détruira.\n\nLà où s'achèvent le ciel et la mer\n\nPrends ma main, marche avec moi\n\nPour vaincre, et écrire\n\nLe récit lumineux de notre foyer.§!\nPour vaincre, et triompher dans notre lutte pour écrire\nLe récit de notre foyer, brillant.§!\nPoursuivons nos rêves de joie\nUn espoir qu'aucune peur ne peut détruire.\nJoignons les mains, et marche avec moi\nNotre récit du foyer, brillant.§!\nLà où s'achèvent ciel et mer\nNotre récit de foyer, brillant.§!"
 HKG_race_discrimination_bill: "Projet de loi sur la discrimination raciale"
 HKG_race_discrimination_bill_desc: "La Loi fondamentale et l'ordonnance sur la Déclaration des droits de Hong Kong protègent les droits des individus, y compris le droit contre la discrimination raciale. Nous avons aussi l'obligation, au titre de la Convention internationale sur l'élimination de toutes les formes de discrimination raciale, d'interdire et d'éliminer la discrimination raciale."
 HKG_LGBT_rights: "Droits LGBT"
 HKG_LGBT_rights_desc: "La communauté LGBT de Hong Kong a trop attendu. Le gouvernement examinera quelles protections et réformes sont possibles dans le cadre juridique actuel."
 HKG_affirm_support_for_christian_organizations: "Réaffirmer le soutien aux organisations chrétiennes"
 HKG_affirm_support_for_christian_organizations_desc: "Les organisations chrétiennes ont longtemps exercé une influence démesurée sur la politique sociale de Hong Kong. Leur rôle consultatif sera réaffirmé et protégé."
 HKG_reduce_power_of_christian_groups: "Réduire le pouvoir des groupes chrétiens"
 HKG_reduce_power_of_christian_groups_desc: "Le rôle consultatif des organisations chrétiennes en politique sociale sera restreint. Des processus de consultation laïcs s'étendront pour combler le vide."
 HKG_consult_public_on_new_law: "Consulter le public sur une nouvelle loi"
 HKG_consult_public_on_new_law_desc: "Avant de légiférer, le gouvernement mènera une vaste consultation publique. Le processus prendra du temps, mais le résultat portera une légitimité démocratique."
 HKG_outlaw_anti_LGBT_discrimination: "Interdire la discrimination anti-LGBT"
 HKG_outlaw_anti_LGBT_discrimination_desc: "La discrimination au travail, au logement et dans la prestation de services contre les personnes LGBT sera rendue illégale. Attendez-vous à un combat législatif prolongé."
 HKG_seek_reform_of_existing_legislation: "Chercher à réformer la législation existante"
 HKG_seek_reform_of_existing_legislation_desc: "Les clauses discriminatoires existantes dans le droit du travail, de la famille et de la location seront identifiées et réformées."
 HKG_anti_discrimination_reform_package: "Le paquet de réforme antidiscrimination"
 HKG_anti_discrimination_reform_package_desc: "Une réforme antidiscrimination complète couvrant race, religion, orientation sexuelle, identité de genre et handicap."
 HKG_legalize_gay_marriage: "Légaliser le mariage homosexuel"
 HKG_legalize_gay_marriage_desc: "Hong Kong devient la première juridiction d'Asie de l'Est à pleinement légaliser le mariage homosexuel. Attendez-vous à des célébrations dans certains cercles, à un violent retour de bâton dans d'autres."
 HKG_gender_pay_gap: "L'écart salarial entre les sexes"
 HKG_gender_pay_gap_desc: "Déclaration obligatoire de l'écart salarial pour tous les grands employeurs. Nommer et faire honte accomplira ce que le respect volontaire n'a pas fait."
 HKG_require_greater_transparency_from_employers: "Exiger plus de transparence des employeurs"
 HKG_require_greater_transparency_from_employers_desc: "Les employeurs au-dessus d'un certain effectif devront publier chaque année des rapports détaillés d'équité salariale."
 HKG_deny_existence_of_pay_gap: "Nier l'existence de l'écart salarial"
 HKG_deny_existence_of_pay_gap_desc: "Position officielle du gouvernement : les différences de rémunération existantes reflètent le choix professionnel, non la discrimination. Aucune autre action n'est nécessaire."
 HKG_secondary_school_education_reform: "Réforme de l'enseignement secondaire"
 HKG_secondary_school_education_reform_desc: "L'ancienne structure 3-2-2-3 du secondaire sera remplacée par le schéma 3-3-4 déjà en usage aux États-Unis et en Chine continentale. La réforme ôte les contenus redondants et obsolètes tout en introduisant un plus large éventail de matières optionnelles."
 HKG_patriotic_education_curriculum_reform: "Réforme du programme d'éducation patriotique"
 HKG_patriotic_education_curriculum_reform_desc: "L'éducation patriotique n'a pas sa place dans le programme existant de Hong Kong. Nous introduirons les études libérales pour combler ce vide."
 HKG_chinese_based_education_curriculum: "Programme scolaire fondé sur le chinois"
 HKG_chinese_based_education_curriculum_desc: "Nous sommes Chinois d'abord et Hongkongais ensuite. Chaque école de Hong Kong enseignera en chinois, et chaque enfant est censé le parler."
 HKG_hong_kong_police_force: "Police de Hong Kong"
 HKG_hong_kong_police_force_desc: "La police de Hong Kong a été établie le 1er mai 1844, et c'est la plus grande force disciplinée du gouvernement de Hong Kong. En raison des restrictions sur les mouvements de l'Armée populaire de libération stationnée à Hong Kong, des fonctions typiquement militaires ailleurs sont assumées par la police à Hong Kong. Longtemps, la police de Hong Kong a été saluée comme « la meilleure d'Asie »."
 HKG_anti_terrorist_train: "Formation antiterroriste"
 HKG_anti_terrorist_train_desc: "Le nouveau millénaire a apporté prospérité et opportunités, mais aussi de nouvelles menaces. Le terrorisme ne doit pas prendre racine à Hong Kong."
 HKG_purchase_chinese_weapons: "Acheter de l'armement chinois"
 HKG_purchase_chinese_weapons_desc: "Remplacer les revolvers Smith and Wesson de l'ère britannique par des alternatives fournies par Norinco. Le coût est faible, le symbolisme considérable."
 HKG_create_CTRU: "Créer l'unité de réponse antiterroriste"
 HKG_create_CTRU_desc: "L'unité de réponse antiterroriste, dite CTRU, est une force de réaction rapide établie pour répondre aux incidents terroristes. Ses officiers seront les meilleurs que la force puisse produire."
 HKG_police_system_reform: "Réforme du système policier"
 HKG_police_system_reform_desc: "Une modernisation de la formation, de la structure de commandement et des mécanismes de responsabilité de la HKPF."
 HKG_investigate_police_triad_cooperation_problem: "Enquêter sur le problème de coopération police-triades"
 HKG_investigate_police_triad_cooperation_problem_desc: "Nous plaçons des agents infiltrés dans les triades, mais elles font de même chez nous. Ces taupes compromettent nos opérations avant même qu'elles ne commencent. En travaillant par l'ICAC et l'OCTB, nous déracinerons ces « Hak Ging »."
 HKG_anti_protest_train: "Formation approfondie contre les émeutes"
 HKG_anti_protest_train_desc: "Formation spécialisée aux scénarios de gestion des foules, des rassemblements pacifiques aux troubles violents."
 HKG_purchase_anti_riot_armour: "Acquérir de l'équipement anti-émeute"
 HKG_purchase_anti_riot_armour_desc: "Nouvel équipement balistique et anti-choc pour l'unité tactique de police."
 HKG_purchase_non_lethal_weapons: "Acheter des armes non létales"
 HKG_purchase_non_lethal_weapons_desc: "Lanceurs de gaz lacrymogène, balles en caoutchouc et armes à billes de poivre : la panoplie moderne du maintien de l'ordre."
 HKG_form_elite_team: "Former l'équipe d'élite"
 HKG_form_elite_team_desc: "Une unité d'intervention antiterroriste dédiée, inspirée des équipes tactiques étrangères."
 HKG_gong_hei_fat_coi: "Que vous soyez heureux et prospères"
 HKG_gong_hei_fat_coi_desc: "Le [HKG.GetFlag]Hong Kong qui vient de traverser une crise financière et d'entrer dans le nouveau millénaire n'est pas à court de problèmes économiques et sociaux. La façon de les résoudre est une question à laquelle le peuple doit répondre."
 HKG_typhoon_shelter_from_financial_storm: "Abri contre la tempête financière"
 HKG_typhoon_shelter_from_financial_storm_desc: "La tempête est passée. Il est temps de nettoyer le désordre. Le gouvernement déploiera des réserves de change et une intervention ciblée pour stimuler l'économie."
 HKG_merge_into_HKEX: "Fusionner HKCE et HKFE dans HKEX"
 HKG_merge_into_HKEX_desc: "Au lendemain de la crise financière de 1997, le Hong Kong Commodity Exchange (HKCE) et le Hong Kong Futures Exchange (HKFE) seront fusionnés dans le nouvel Hong Kong Exchanges and Clearing Limited (HKEX), aiguisant l'avantage concurrentiel de la ville sur un marché de plus en plus mondialisé."
 HKG_greatest_entrepot: "Le plus grand port marchand d'Asie de l'Est"
 HKG_greatest_entrepot_desc: "Hong Kong est depuis longtemps le premier entrepôt d'Asie. Étendre la capacité du port et l'efficacité du fret conservera le titre."
 HKG_expand_Kwai_Tsing_terminals: "Agrandir les terminaux de Kwai Tsing"
 HKG_expand_Kwai_Tsing_terminals_desc: "Nouvelle capacité de manutention de conteneurs à Kwai Tsing. Des navires plus grands, un délai d'escale plus court, davantage de fret par Hong Kong."
 HKG_attract_foreign_investment: "Attirer les investissements étrangers"
 HKG_attract_foreign_investment_desc: "Un paquet d'incitations fiscales, de simplification réglementaire et de services de liaison investisseurs dédiés pour attirer les capitaux de l'étranger."
 HKG_european_business: "Les affaires européennes"
 HKG_european_business_desc: "Une démarche ciblée vers les chambres de commerce européennes. Hong Kong comme porte régionale des firmes européennes entrant en Asie."
 HKG_chinese_entrepreneurs: "Les entrepreneurs du continent"
 HKG_chinese_entrepreneurs_desc: "Le capital chinois continental est l'avenir de l'économie de Hong Kong. Le gouvernement approfondira les liens avec l'establishment des affaires de Pékin."
 HKG_develop_solar_power: "Investir dans l'énergie solaire"
 HKG_develop_solar_power_desc: "Installations photovoltaïques distribuées sur toits et réservoirs. Un début modeste, mais un début."
 HKG_T_PARK: "Installation T·PARK"
 HKG_T_PARK_desc: "L'installation de traitement des boues T-PARK à Tuen Mun transforme les déchets en énergie et démontre l'ambition environnementale de Hong Kong."
 HKG_indonesian_gas: "Gaz de Jakarta"
 HKG_indonesian_gas_desc: "Un accord d'approvisionnement à long terme en gaz naturel liquéfié avec l'Indonésie, sécurisant les besoins énergétiques de Hong Kong pour des décennies."
 HKG_australian_oil: "Pétrole de Sydney"
 HKG_australian_oil_desc: "Un partenariat d'importation avec des producteurs de brut australiens, diversifiant la dépendance hydrocarbonée de Hong Kong loin d'un seul fournisseur."
 HKG_new_development_idea: "Nouveau plan de développement"
 HKG_new_development_idea_desc: "La nouvelle initiative de développement regroupe projets d'infrastructure, de logement et de zones industrielles sous une seule bannière coordonnée."
 HKG_invest_hong_kong: "Investir à Hong Kong"
 HKG_invest_hong_kong_desc: "InvestHK est restructuré et refinancé comme agence phare de promotion de l'investissement de la ville."
 HKG_hong_kong_science_parks: "Parcs scientifiques"
 HKG_hong_kong_science_parks_desc: "Des zones dédiées à Sha Tin et Tseung Kwan O pour la biotech, l'IA et la R&D en fabrication avancée, avec des bureaux subventionnés pour les start-up."
 HKG_invite_talent_to_hong_kong: "Attirer les talents à Hong Kong"
 HKG_invite_talent_to_hong_kong_desc: "Un régime de visas accéléré pour les professionnels étrangers hautement qualifiés, avec des services en anglais et des incitations fiscales pour faciliter la transition."
 HKG_hong_kong_cyberport: "Le Cyberport"
 HKG_hong_kong_cyberport_desc: "Le mandat de Cyberport est renouvelé et étendu comme pôle d'affaires numériques ciblant la fintech, le commerce électronique et les médias numériques."
 HKG_tech_incubation_programme: "Programme d'incubation technologique"
 HKG_tech_incubation_programme_desc: "Incubateurs financés par le gouvernement avec capital d'amorçage, mentorat et infrastructures partagées pour les start-up technologiques en phase initiale."
 HKG_favor_traditional_values: "Retour à la tradition"
 HKG_favor_traditional_values_desc: "Le gouvernement s'alignera publiquement sur les valeurs familiales traditionnelles, restreignant l'activisme LGBT dans l'éducation et la vie publique."
 HKG_undercover_oppression: "Oppression secrète"
 HKG_undercover_oppression_desc: "Une approche plus discrète : surveillance, pression des employeurs et découragement officieux plutôt qu'une législation ouverte contre les groupes minoritaires."
 HKG_legislate_to_ban_LGBT: "Interdire le collectif LGBT"
 HKG_legislate_to_ban_LGBT_desc: "Une législation ouverte criminalisant les expressions publiques d'identité LGBT. La communauté internationale réagira vivement."
 HKG_regulate_sale_of_residential_buildings: "Réglementer la vente d'immeubles résidentiels"
 HKG_regulate_sale_of_residential_buildings_desc: "Un cadre modeste de règles de divulgation, de plafonds hypothécaires et de taxes anti-spéculation. Le plan Suen reste en place, mais les pires excès du marché non réglementé sont encadrés."
 HKG_land_reclamation: "Remise en état des terres"
 HKG_land_reclamation_desc: "Hong Kong n'a que tant de terre. Le département du génie civil dresse un nouveau programme de poldérisation au large de Lantau, de la côte des Nouveaux Territoires et du port de Kowloon. Le coût est énorme et les écologistes sont furieux ; les nouveaux créneaux de construction en valent la peine."
 HKG_lock_housing_price: "Geler les prix du logement"
 HKG_lock_housing_price_desc: "Le gouvernement légifère un plafond dur sur les prix immobiliers résidentiels, indexé sur le revenu médian. Les propriétaires terriens sont apoplectiques ; locataires et syndicats célèbrent. Le marché devient prévisible — et stagnant."
 HKG_expand_home_ownership_scheme: "Élargir le programme d'accession à la propriété"
 HKG_expand_home_ownership_scheme_desc: "Le Home Ownership Scheme est élargi : plus de logements, seuils plus bas, traitement plus rapide. Un Hongkongais de la classe ouvrière peut enfin aspirer à la propriété. Le Trésor assume la subvention ; la paix sociale est le dividende."
 HKG_let_government_hold_companies: "Sociétés détenues par le gouvernement"
 HKG_let_government_hold_companies_desc: "Les plus grandes firmes de promotion immobilière — Sun Hung Kai, Cheung Kong, Henderson — sont partiellement nationalisées. Les tycoons protestent fort ; le gouvernement détient le capital. Les prix immobiliers passent sous contrôle politique direct."
 HKG_maintain_public_housing_construction: "Maintenir la construction de logements publics"
 HKG_maintain_public_housing_construction_desc: "Le pipeline de construction de l'Autorité du logement est préservé et étendu. Des cités publiques s'élèvent à travers les Nouveaux Territoires. L'investissement d'infrastructure se traduit en stabilité et en une population tranquillement plus contente."
 HKG_my_home_purchase_scheme: "Programme d'achat de maison"
 HKG_my_home_purchase_scheme_desc: "Le My Home Purchase Plan de Donald Tsang est mis en œuvre tel que conçu : des unités location-accession pour la classe sandwich, les Hongkongais qui gagnent trop pour le logement public mais ne peuvent s'offrir le marché privé. Une réponse tangible à la crise de l'accessibilité."
 HKG_subsidised_sale_flats_project: "Projet d'appartements subventionnés"
 HKG_subsidised_sale_flats_project_desc: "Logements en vente subventionnés par le gouvernement, vendus sous le prix du marché aux primo-accédants. L'Autorité du logement devient, de fait, le plus grand promoteur de la RAS."
 HKG_green_form_subsidised_home_ownership_scheme: "Programme de propriété de forme verte"
 HKG_green_form_subsidised_home_ownership_scheme_desc: "Le couronnement de la réforme du logement : les titulaires de formulaire vert — locataires actuels du logement public — obtiennent un accès préférentiel à la propriété subventionnée. La chaîne de mobilité ascendante, brisée depuis deux décennies, est enfin reconstruite. La crise du logement de Hong Kong s'achève."
 HKG_public_housing_problem: "Problème du logement public"
 HKG_public_housing_problem_desc: "La crise du logement de Hong Kong est l'échec le plus visible du gouvernement post-rétrocession. Les prix médians des logements dépassent les revenus médians d'un ordre de grandeur ; appartements subdivisés et cages à lapins abritent des dizaines de milliers de personnes ; la liste d'attente du logement public s'étire au-delà de six ans. La pression politique pour faire quelque chose — n'importe quoi — est écrasante."
 HKG_sun_housing_policy: "Politique des neuf réformes du logement de Sun"
 HKG_sun_housing_policy_desc: "Le programme en neuf points du secrétaire au Logement Michael Suen. Restreindre l'offre, halt à la construction publique, laisser le marché se remettre. Les propriétaires et conglomérats approuvent. Les syndicats et locataires, non. L'histoire jugera durement la politique, mais elle sécurise le marché immobilier à court terme."
 HKG_end_tenants_purchase_scheme: "Mettre fin au Tenants Purchase Scheme"
 HKG_end_tenants_purchase_scheme_desc: "Les locataires du logement public ne pourront plus acheter leur appartement à tarif réduit. Le Trésor conserve l'actif ; les locataires restent locataires. Un petit gain de recettes à un véritable coût social."
 HKG_suspend_home_ownership_scheme: "Suspendre le Home Ownership Scheme"
 HKG_suspend_home_ownership_scheme_desc: "Le Home Ownership Scheme est suspendu indéfiniment. Le pipeline de logements en vente subventionnés se tarit, le marché privé est libéré de la concurrence publique, et les tycoons de l'immobilier ont un souci de moins."
 HKG_curtail_land_supply: "Restreindre l'offre de terrains"
 HKG_curtail_land_supply_desc: "Les ventes de terrains publics sont haltées ; le Lands Department garde son inventaire hors marché. Les prix se stabilisent à des niveaux élevés, le marché immobilier se consolide, et la crise du logement devient un trait permanent de la vie hongkongaise."
 HKG_legco_decision_categories: "§1LegCo§!"
 legco_current_motion_clock: "Mouvement actuel : §Y[ROOT.legco_current_motion]§!"
 legco_current_special_motion_clock: "Mouvement actuel : §Y[ROOT.legco_current_motion]§!"
 legco_increase_administration_motion_clock: "Motion actuelle : §YAugmenter £political_power_texticon les dépenses bureaucratiques§!"
 legco_decrease_administration_motion_clock: "Motion actuelle : §YDiminuer £political_power_texticon les dépenses bureaucratiques§!"
 legco_increase_policing_motion_clock: "Motion en cours : §Yaugmenter le financement de la £foreign_influence_defense_modifier_texticon §Csécurité§!§!"
 legco_decrease_policing_motion_clock: "Motion en cours : §Yréduire le financement de la £foreign_influence_defense_modifier_texticon §Csécurité§!§!"
 legco_increase_education_motion_clock: "Motion en cours : §YAugmenter le budget de l'£research_speed_texticon §Géducation§!§!"
 legco_decrease_education_motion_clock: "Motion en cours : §YDiminuer le budget de l'£research_speed_texticon §Géducation§!§!"
 legco_increase_health_motion_clock: "Motion actuelle : §YAugmenter £population_texticon le financement de la §RSanté§!§!"
 legco_decrease_health_motion_clock: "Motion actuelle : §YDiminuer £population_texticon le financement de la §RSanté§!§!"
 legco_increase_social_motion_clock: "Motion actuelle : §YAugmenter £consumer_goods_texticon les dépenses de §nretraites§!§!"
 legco_decrease_social_motion_clock: "Motion actuelle : §YDiminuer £consumer_goods_texticon les dépenses de §nretraites§!§!"
 HKG_unrestricted_housing_market: "Marché du logement sans restriction"
 HKG_unrestricted_housing_market_desc: "Le marché du logement libre de Hong Kong est parmi les plus dynamiques du monde et les plus durement inabordables. Sans intervention, l'écart entre revenus et prix continuera de s'élargir."
 HKG_victoria_harbour: "Port Victoria"
 HKG_victoria_harbour_desc: "Victoria Harbour est le cœur historique de l'économie portuaire de Hong Kong : trafic de conteneurs, ferries et terminaux de croisière y convergent."
 HKG_victoria_harbour_expand_desc: "Un Victoria Harbour élargi avec de nouveaux quais à conteneurs, des chenaux approfondis et une manutention modernisée."
 HKG_victoria_harbour_expand_plus_desc: "Victoria Harbour à pleine capacité moderne : terminaux automatisés, quais en eau profonde et le plus haut débit de fret de la région."
 legacy_of_handover_hong_kong: "Héritage de la rétrocession de Hong Kong"
 legacy_of_handover_hong_kong_desc: "La rétrocession de 1997 a créé des liens institutionnels, économiques et culturels entre Hong Kong et le continent qui continuent de façonner la politique des décennies plus tard."
 Basic_Law_HKG: "La loi fondamentale de la RAS de Hong Kong"
 Basic_Law_milltary_HKG: "La Loi fondamentale de la [HKG.GetFlag]RAS de Hong Kong"
 Basic_Law_milltary_HKG_desc: "Aux termes de la Loi fondamentale, la défense est réservée au gouvernement central. Hong Kong n'entretient pas de forces armées indépendantes ; la garnison de l'APL à Hong Kong assume tout rôle de défense extérieure."
 Basic_Law_HKG_desc: "La Loi fondamentale était le document fondateur de la Région administrative spéciale de Hong Kong après la rétrocession de Hong Kong du Royaume-Uni à la République populaire de Chine. Le document décrit entre autres le statut de Hong Kong par rapport à la Chine, lui accordant une autonomie dans toutes les matières autres que la défense et les affaires étrangères, toutes deux confiées au gouvernement central."
 One_Country_Two_Systems: "Un pays, deux systèmes"
 One_Country_Two_Systems_desc: "Hong Kong s'est vu garantir 50 ans d'autonomie par rapport à la domination directe de la Chine. Le modèle « un pays, deux systèmes » permet de préserver et même de développer un grand nombre des libertés politiques chères à Hong Kong, telles que la liberté d'expression et la liberté de réunion publique. L'absence de ces droits en Chine continentale est l'un des principaux moteurs du soutien au camp « pan-démocrate » dans la politique de Hong Kong, de nombreux Hongkongais inquiets se méfiant d'une plus grande intégration avec la Chine continentale."
 Localist_Movement: "Mouvement localiste"
 Localist_Movement_desc: "Depuis la rétrocession en 1997, les tensions entre la Chine continentale et les Hongkongais ont conduit au développement d'un sentiment localiste « Hong Kong First » chez certains Hongkongais. Ce sentiment considère le système politique de la Chine communiste avec méfiance, mais considère également les Hongkongais comme culturellement distincts et même supérieurs au peuple chinois. La montée en puissance de ce mouvement à partir du mouvement des parapluies de 2014 a modifié le ton auparavant plus mesuré du clivage politique de Hong Kong en un ton plus émotif et radical."
 Lacks_Universal_Suffrage: "Absence de suffrage universel"
 Lacks_Universal_Suffrage_desc: "Si la loi fondamentale prévoit que le chef de l'exécutif et le conseil législatif seront un jour élus au suffrage universel, cette éventualité ne s'est pas encore concrétisée, principalement en raison des inquiétudes de la Chine quant à ce qui pourrait se passer si les pan-démocrates, nettement plus populaires, prenaient le contrôle du gouvernement."
 Limited_Universal_Suffrage: "Suffrage universel limité"
 Limited_Universal_Suffrage_desc: "La Chine a accepté que le chef de l'exécutif de Hong Kong soit élu au suffrage universel, à condition que les candidats soient d'abord contrôlés par la Chine. Cette décision est largement considérée comme un moyen de réduire la probabilité que des candidats pan-démocrates ou localistes deviennent chefs de l'exécutif."
 Universal_Suffrage: "Suffrage universel"
 Universal_Suffrage_desc: "La Chine a finalement accepté de permettre à Hong Kong d'élire son chef de l'exécutif au suffrage universel sans interférence des autorités chinoises."
 Hong_Kong_Protests: "Manifestations à Hong Kong"
 Hong_Kong_Protests_desc: "À la suite des récentes mesures prises par le gouvernement chinois, de vastes manifestations ont éclaté à Hong Kong pour exiger l'annulation de la décision chinoise."
 asian_crisis_HKG_desc: "La crise économique qui a saisi l'Asie de l'Est et du Sud-Est en développement a anéanti des décennies de croissance. La perte de confiance dans les monnaies nationales hante encore les banques centrales. La dette publique et privée a également explosé.\n\nDes leçons douloureuses ont été tirées, et d'anciennes réformes économiques indésirables vont bon train. Chaque pays a été touché différemment et chacun a ses propres solutions.\nL'afflux d'investissements vers les pays touchés représentait autrefois la moitié du total mondial, mais il se dirige désormais vers [CHI.GetFlag]la Chine et ailleurs."
 asian_crisis_league_HKG: "La crise économique qui a saisi l'Asie de l'Est et du Sud-Est en développement a anéanti des décennies de croissance. La perte de confiance dans les monnaies nationales hante encore les banques centrales. La dette publique et privée a également explosé.\n\nDes leçons douloureuses ont été tirées, et d'anciennes réformes économiques indésirables vont bon train. Chaque pays a été touché différemment et chacun a ses propres solutions.\nL'afflux d'investissements vers les pays touchés représentait autrefois la moitié du total mondial, mais il se dirige désormais vers [CHI.GetFlag]la Chine et ailleurs."
 HKG_HKEX: "Bourse et chambre de compensation de Hong Kong"
 HKG_improve_trade: "Attirer les investissements étrangers"
 HKG_improve_trade_desc: "Une poussée coordonnée pour approfondir les relations commerciales de Hong Kong à travers l'Asie et au-delà : nouveaux accords, douanes simplifiées et sections commerciales d'ambassade actives."
 HKG_idea_T_PARK: "§5T-PARK§!"
 HKG_idea_T_PARK_desc: "L'installation T-PARK traite les boues d'égout de Hong Kong tout en générant de l'électricité, servant à la fois d'infrastructure de gestion des déchets et de vitrine environnementale."
 HKG_new_develop_idea_dynamic_modifier: "Nouvelle idée de développement"
 HKG_new_develop_idea_dynamic_modifier_desc: "Les effets regroupés de la nouvelle initiative de développement sur l'économie et la base d'infrastructure de Hong Kong."
 HKG_idea_secondary_education_reform: "Réforme de l'enseignement secondaire"
 HKG_idea_secondary_education_reform_desc: "L'ancienne structure 3-2-2-3 du secondaire est remplacée par le schéma 3-3-4 déjà en usage aux États-Unis et en Chine continentale. Les contenus redondants et obsolètes sont ôtés et un plus large éventail de matières optionnelles introduit."
 HKG_idea_patriotic_education_reform: "Réforme de l'éducation patriotique"
 HKG_idea_patriotic_education_reform_desc: "L'éducation patriotique n'a pas sa place dans le programme existant de Hong Kong. Les études libérales ont été introduites pour combler ce vide."
 HKG_idea_chinese_based_education_reform: "Réforme éducative fondée sur le chinois"
 HKG_idea_chinese_based_education_reform_desc: "Toutes les écoles de Hong Kong enseignent désormais en chinois. Tous les enfants sont censés le parler."
 HKG_rise_of_internet: "L'essor d'Internet"
 HKG_rise_of_internet_desc: "Internet a ouvert une nouvelle direction au développement humain. Qu'il s'avère un feu de paille ou la tendance économique dominante des décennies à venir reste à voir."
 HKG_idea_SARS_outbreak: "Impact du SRAS"
 HKG_idea_SARS_outbreak_desc: "L'épidémie de SRAS a durement frappé l'économie et la confiance publique de Hong Kong, perturbant tourisme, commerce de détail et vie quotidienne dans toute la ville."
 HKG_idea_railway_development_strategy_2000: "Stratégie de développement ferroviaire 2000"
 HKG_idea_railway_development_strategy_2000_desc: "La stratégie de développement ferroviaire 2000 est le plan directeur de l'expansion du MTR pour la prochaine décennie."
 HKG_patriotic_loyalist_drive: "Campagne loyaliste patriotique"
 HKG_patriotic_loyalist_drive_desc: "L'éducation à la sécurité nationale sature écoles, diffuseurs et service public. Le résultat est un public plus docile et des institutions du Parti plus fortes, au prix de l'ouverture intellectuelle et de la production de recherche."
 HKG_loyalist_civil_service_purge: "Purge de la fonction publique loyaliste"
 HKG_loyalist_civil_service_purge_desc: "Des comités de filtrage peignent la fonction publique à la recherche d'hésitants et de dissidents silencieux. L'administration quotidienne souffre le temps de la purge, mais la bureaucratie qui en sortira n'aura qu'un maître."
 HKG_mainland_talent_scheme: "Programme de talents du continent"
 HKG_mainland_talent_scheme_desc: "Les rangs administratifs vacants de Hong Kong sont remplis par des professionnels formés sur le continent. La production de recherche se rétablit et les bureaux tournent efficacement, mais une main-d'œuvre locale en recul rend le pouvoir politique plus dur à mobiliser sur place."
 HKG_gba_integration_idea: "Intégration de la région de la Grande Baie"
 HKG_gba_integration_idea_desc: "Hong Kong, Macao, Shenzhen et Zhuhai fonctionnent désormais comme une seule économie. La production industrielle et le commerce prospèrent, et la ligne entre RAS et continent s'estompe à dessein."
 HKG_great_hong_kong_nation_idea: "Grande nation de Hong Kong"
 HKG_great_hong_kong_nation_idea_desc: "Hong Kong a déclaré sa souveraineté au mépris de Pékin. L'humeur est martiale : le moral est haut, la conscription large, et une génération qui a grandi en regardant les répressions des parapluies est prête à défendre l'indépendance pour laquelle elle s'est battue. Les relations avec le continent sont au point mort."
 HKG_city_state_doctrine: "Doctrine d'État-cité"
 HKG_city_state_doctrine_desc: "Hong Kong suit le modèle de Singapour : petit, neutre, prospère, technocratique. L'économie vibre du commerce et de la finance, le port est le sang vital de l'État, et l'ambition militaire est fermement subordonnée au pragmatisme commercial."
 HKG_under_british_wing_idea: "Sous l'aile britannique"
 HKG_under_british_wing_idea_desc: "Hong Kong a formalisé son alignement sécuritaire et politique avec le Royaume-Uni et le Commonwealth élargi. Accès de volontaires des armées de l'Anglosphère, licences technologiques à des conditions préférentielles, et une posture diplomatique claire : Londres, non Pékin, est le partenaire senior."
 HKG_pro_democracy_media: "Charte des médias pro-démocratie"
 HKG_pro_democracy_media_desc: "Apple Daily, Stand News, RTHK et des dizaines de plus petits médias opèrent sous une protection juridique explicite contre l'ingérence politique. Les réseaux de désinformation du continent peinent à prendre, et le discours public penche nettement vers les normes démocratiques."
 HKG_civil_society_funding: "Financement de la société civile"
 HKG_civil_society_funding_desc: "ONG, associations de quartier et groupes de plaidoyer pro-démocratie reçoivent un financement public transparent. Le résultat est une culture civique plus engagée et un camp démocratique silencieusement plus fort, payé par les caisses publiques."
