 idea_JAP_emperor_akihito: "아키히토 천황"
 idea_JAP_emperor_akihito_desc: "His Imperial Majesty Akihito, son of Hirohito, is the Emperor of Japan. He, though he holds no real power, is a source of great happiness and calmness for the Japanese people. He stands for what connects the Empire of old with the Japan of now. He stands for what connects the veterans of the wars Japan faced with the young people who have no idea of such things."
 islamic_sectarian_conflicts: "이슬람 종파 갈등"
 islamic_sectarian_conflicts_desc: "이슬람교는 여러 종파로 나뉘지만, 크게 수니파(전 세계 무슬림의 88%), 시아파(전 세계 무슬림의 10%), 그리고 하와리지파/이바디파(전 세계 무슬림의 약 1%)의 세 주요 그룹으로 나뉩니다. 이들 그룹은 여러 교리적 분쟁을 가지고 있는데, 특히 수니파와 시아파 간의 경쟁은 수세기 동안 진정한 신학적 논쟁이든, 영토 분쟁이나 민족 폭력의 구실로든 끊임없이 갈등을 야기해 왔습니다.\n\n이 나라는 수니파와 시아파 인구가 모두 상당수를 차지하고 있어, 양측 모두 서로에 대해 깊은 불신을 갖고 있습니다. 이러한 불신은 예배 장소, 정부 직책, 그리고 일상적인 공공생활 영역 등 모든 곳에서 나타납니다."
