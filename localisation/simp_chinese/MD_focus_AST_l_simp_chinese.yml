 collapsing_state_sol_desc: "全国的法律和秩序已彻底崩溃，大片地区被流窜的流氓警察和武装分子控制。残存的经济也处于自由落体式的下滑状态，政府本身也被困在议会之中，既无力也无权控制不断恶化的局势。"
 collapsing_state_sol_1: "脆弱的国家"
 collapsing_state_sol_1_desc: "大部分武装分子已被解除武装，并仍被国家拘留。一些城镇已恢复秩序，但局势仍处于微妙的平衡之中。"
