 CHE.Conservative: "£generic_Conservative_small (K) 卡德罗夫派系"
 COL.conservatism: "£COL_western_conservative 哥伦比亚保守党"
 COL.conservatism_desc: "（基督教民主主义） - 哥伦比亚保守党成立于1849年，与哥伦比亚自由党共同主导着国家的政治格局，尽管政治领域存在多元化，但仍成功维持了有效的两党制。自成立以来，该党保持了相当一贯的纲领，并随着哥伦比亚社会和经济形势的发展，逐步将其基督教民主主义纲领现代化。"
 COL.liberalism: "£COL_western_liberal 激进改革党"
 COL.liberalism_desc: "（保守自由主义）- 从哥伦比亚自由党分裂而出的激进变革党，自诩为更保守的替代选择，其成员多为因原党转向社会民主主义及社会自由主义价值观而感到被边缘化的人士。"
 COL.socialism: "£COL_western_social_democrat 哥伦比亚自由党"
 COL.socialism_desc: "（社会自由主义） - 哥伦比亚自由党成立于1848年，最初是一个古典自由主义政党。得益于1958年至1974年间存在的“国民阵线”权力分享协议，该党与保守党共同维持了政治主导地位。自1940年代以来，该党进一步向左翼倾斜，信奉社会自由主义甚至社会民主主义价值观的派系日益凸显。"
 COL.Neutral_conservatism: "£COL_non_aligned_conservative (MIRA)争取完全独立运动"
 COL.Neutral_conservatism_desc: "（基督教民主主义） - 自称追随“米拉主义”，该党的立场和信念在功能上与基督教民主主义保持一致 - 支持多项社会保守主义主张。该党的影响力已成功超越哥伦比亚本土，其自称的意识形态以某种方式传播至拉丁美洲大部分地区，甚至欧洲部分地区。"
 COL.neutral_Social: "£COL_non_aligned_socialist_democrat 民族团结社会党"
 COL.neutral_Social_desc: "（第三道路） - 该新党派围绕团结“乌里韦派”（即阿尔瓦罗·乌里韦的支持者）而组建，其成员大量吸纳自包括自由党在内的现有左翼及中间党派。其大部分纲领理念源于对单一领袖的追随 - 该党派以温和右翼的社会民主主义为纲领，宣称支持市场经济、社会福利及深化全球化进程。"
 COL.Neutral_green: "£COL_non_aligned_greens 绿色联盟"
 COL.Neutral_green_desc: "（环保主义） - 倡导进步社会价值观的绿色联盟，其纲领主要借鉴了多数绿党的标准政纲。为实现其目标，绿色联盟已与中间派及左翼政党组建联合阵线，并进一步支持旨在终结该国数十年内战的哥伦比亚和平进程。"
 COL.Nat_Autocracy: "£COL_nationalist_military_junta 哥伦比亚军事力量"
 COL.Nat_Autocracy_desc: "（务实军政府）- 哥伦比亚武装力量于1819年正式成立，是拉丁美洲国际活动中较为活跃的军队之一；曾参与第二次世界大战和朝鲜战争，并为反毒品贩运行动提供士兵与援助。在政治上，军方长期深度介入政局，多次政变将不同政治人物推上权力宝座。国内针对贩毒集团及意识形态化准军事组织的平叛行动，更锤炼了其战略视野与行动重心。"
 COL.Nat_Populism: "£COL_nationalist_right_wing_populist 民主中心党"
 COL.Nat_Populism_desc: "（右翼民粹主义） - 自诩为\"中间派\"政党的民主中心党，其纲领与意识形态深受哥伦比亚保守主义传统影响。该党不仅在美国境内支持并推动共和党发展，更与欧盟自身的欧洲保守派和改革主义者党建立合作关系 - 将影响力拓展至哥伦比亚国境之外。"
 COL.oligarchism: "£COL_non_aligned_oligarchism 乌拉贝诺家族"
 COL.oligarchism_desc: "（卡特尔统治） - 作为哥伦比亚规模最大、实力最强的贩毒集团之一，乌拉贝诺斯集团诞生于哥伦比亚国内冲突中一支极右翼准军事组织解散后的权力真空。该组织装备精良，且已与哥伦比亚多数贩毒集团敌对势力爆发冲突，迅速崛起为该国最富有的犯罪集团之一。"
 COM.socialism: "£COM_western_social_democrat 科摩罗复兴公约(CRC)"
 COM.socialism_icon: "£COM_western_social_democrat"
 COM.socialism_desc: "(社会民主总统制)科摩罗复兴公约\n\n该党虽于2002年正式成立，实则代表了阿扎利·阿苏马尼领导的政治运动与意识形态。该党常被视为奉行总统制的政党，致力于在1999年阿苏马尼发动政变后推动科摩罗的国家统一与发展。"
 COM.Monarchist: "£COM_nationalist_monarchist 斑宝王室"
 COM.Monarchist_icon: "£COM_nationalist_monarchist"
 COM.Monarchist_desc: "(绝对君主制) - 班博家族\n\n班博家族是科摩罗群岛历代苏丹的称呼。在大部分历史时期，这些苏丹与众多地方统治者共享权力，鲜少实现对群岛的统一统治。其中最著名的大科摩罗苏丹赛义德·阿里·本·赛义德·奥马尔于1892年至1912年在位，成功将整个科摩罗统一为单一苏丹国。1912年，他将主权让予法国，随后很快被流放至留尼汪岛。数年后，法国将科摩罗整合为单一领土，并在行政上将其划归马达加斯加殖民地管辖。"
