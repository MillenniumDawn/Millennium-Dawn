 BHR.Western_Autocracy_icon: "£BHR_Autocracy_small"
 BHR.neutral_Social: "£generic_neutral_Social_small (Wa'ad) - 全国民主行动协会"
 BHR.neutral_Social_desc: "（阿拉伯社会主义）- 全国民主行动协会\n\n全国民主行动协会是巴林政坛的世俗阿拉伯民族主义左翼政党，是巴林解放人民阵线的合法继承者，于2002年注册成立。它主张建立君主立宪制，拥有民选政府、跨教派公民权和劳动权利，并且是反对派联盟中与伊斯兰民族和谐协会的主要非宗教伙伴。\n\n该组织总书记易卜拉欣·谢里夫在2011年起义后被捕入狱，该组织于2017年被法院下令解散，此后便转入地下并在海外活动。其影响力主要来自专业人士、中产阶级、工会成员以及两个教派的知识分子，而非群众动员。"
 BHR.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small (Haq) - 哈克自由与民主运动"
 BHR.Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义）- 哈克自由与民主运动\n\n哈克运动是一个未经批准的反对派运动，由哈桑·穆沙伊马和其他前维法克党成员于2005年成立，他们拒绝接受2002年宪法及其建立的两院制。该运动抵制选举，就歧视和入籍政策向联合国请愿，并于2011年加入呼吁彻底结束君主制的“共和国联盟”。\n\n由于其领导人被判处终身监禁，该运动主要通过街头网络和流亡媒体开展活动。其影响力在于农村地区心灰意冷的什叶派青年，而这群人也正是“2月14日联盟”和萨拉亚·阿什塔尔等武装组织的支持者。"
 BHR.Conservative: "£generic_Conservative_small (Al Wefaq) - 伊斯兰民族和谐协会"
 BHR.Conservative_desc: "（什叶派伊斯兰主义）- 伊斯兰民族和谐协会\n\n巴林什叶派最大的政治团体伊斯兰民族和谐协会成立于2001年，由谢赫·阿里·萨勒曼创立，并由西斯塔尼学派的宗教人士指导。该团体要求建立一个完全民选的立法机构和一个在君主立宪制下运作的、对公众负责的政府，并通过参与议会、举行群众集会和定期抵制等方式来实现这一目标，而非诉诸武装行动。该团体公开与伊朗划清界限，并反对建立共和国的呼声。\n\n该组织在2011年起义期间退出议会，抵制了2014年的选举，并于2016年被法院下令解散。此后，该组织一直秘密运作，其领导人或被监禁，或流亡海外。其影响力依然在于其在什叶派村庄和清真寺中无与伦比的动员能力。"
 BHR.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small (Amal) - 伊斯兰行动协会"
 BHR.Mod_Vilayat_e_Faqih_desc: "（设拉子什叶派伊斯兰主义）- 伊斯兰行动协会\n\n伊斯兰行动协会是巴林伊斯兰解放阵线的政治继承者，遵循哈迪·穆达里西的设拉子教法学派。该学派接受教士的监护，但与伊朗政府保持距离。阿迈勒协会争取那些认为“伊斯兰民族和谐协会”过于谨慎的什叶派社群的支持，积极推动宪法改革和释放囚犯，并抵制其认为存在舞弊的选举。\n\n尽管与伊斯兰民族和谐协会西斯塔尼派神职人员都反对统治家族，但教义上的冲突限制了双方的合作。该教团于2012年被法院下令解散，如今以地下网络的形式存在，其影响力主要来自宗教机构和海外侨民关系。"
 BHR.Kingdom: "£generic_Kingdom_small (Asalah) - 正道伊斯兰协会"
 BHR.Kingdom_desc: "（萨拉菲主义）- 正道伊斯兰协会\n\n正道伊斯兰协会是萨拉菲伊斯兰教育协会的政治分支，该协会于2002年注册成立，其根基在于穆哈拉克、里法和已归化的逊尼派社区。它倡导更严格的公共道德、宗教教育和基于伊斯兰教法的立法，反对什叶派反对派的宪法诉求，并将沙特阿拉伯视为其教义和政治的标杆。\n\n该社团对统治家族忠心耿耿，从未推行过独立于统治家族之外的议程，而是以议会支持换取对社会政策的影响力。其影响力主要源于其清真寺和慈善网络，以及政府需要一个逊尼派力量来制衡“伊斯兰民族和谐协会”组织。"
 BHR.Caliphate: "£SAU_salafist_jihadism (AQ) - 基地组织"
 BHR.Caliphate_desc: "（萨拉菲圣战主义）- 基地组织\n\n基地组织在巴林没有合法的据点，但其萨拉菲圣战主义追随者主要来自巴林逊尼派强硬派人士以及从伊拉克、叙利亚和也门返回的人员。他们视巴林君主制为美国的叛教傀儡，将第五舰队总部和西方侨民视为合法攻击目标，并将什叶派多数群体视为宗派敌人。\n\n巴林宗教人士图尔基·比纳利于2015年被剥夺公民身份，他正是从这样的环境中崛起，最终成为伊斯兰国的高级官员。该组织的影响力在于其小型分支、海湾地区的资金渠道以及国家安全政策加剧的教派分化。"
 BHR.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small (Al-Menbar) - 国民伊斯兰论坛协会"
 BHR.Neutral_Muslim_Brotherhood_desc: "（穆斯林兄弟会）- 国民伊斯兰论坛协会\n\n国民伊斯兰论坛协会是伊斯兰改革协会（穆斯林兄弟会巴林分支）的政治分支，自2002年以来一直以效忠逊尼派伊斯兰主义联盟的身份参加选举。该党主张通过家庭法、媒体和教育方面的立法逐步推行伊斯兰化，反对其认为不符合伊斯兰教义的国际人权公约，并支持统治家族对抗什叶派反对派。\n\n与海湾地区其他穆斯林兄弟会分支机构不同，该组织享有较为宽容的地位，因为其母会的领导层长期以来由王室高级成员担任。该组织支持2017年卡塔尔和伊朗的地区孤立。其影响力主要体现在其慈善机构、学校和专业干部队伍上，而非群众基础。"
 BHR.Nat_Fascism: "£IRQ_Nat_Autocracy_small (NDA) - 国民民主大会"
 BHR.Nat_Fascism_icon: "£IRQ_Nat_Autocracy_small"
 BHR.Nat_Fascism_desc: "（复兴党）- 国民民主大会\n\n国民民主大会是伊拉克复兴党在巴林的支部，它融合了阿拉伯社会主义、泛阿拉伯团结和世俗的、国家主义的民族主义。该党反对2003年入侵伊拉克，反对外国劳工的政治归化，并要求巴林公民在就业和住房方面享有优先权。\n\n尽管该组织根植于逊尼派阿拉伯民族主义，但它与伊斯兰民族和谐协会、伊斯兰行动协会和全国民主行动协会同属反对派联盟，并抵制其认为不具代表性的选举。该组织在议会中没有席位；其影响力主要体现在一小群专业人士、媒体宣传以及与阿拉伯世界各地复兴党网络的联系上。"
 BHR.Nat_Autocracy: "£generic_Nat_Autocracy_small (BDF) - 巴林国防军"
 BHR.Nat_Autocracy_desc: "（军政府）- 巴林国防军\n\n巴林国防军是一支小型专业部队，约有8000名现役人员，得到国民警卫队和警察的支持，由美国和英国装备，自2008年以来由陆军元帅哈利法·本·艾哈迈德·阿勒哈利法指挥。其军官队伍来自统治家族和忠诚的逊尼派部落，不包括占多数的什叶派。\n\n该部队于2011年与半岛盾牌部队一同部署，并自2015年以来一直参与沙特领导的也门军事行动。作为一个政治力量，它是沙特王朝强硬派哈瓦利德派的权力基础，主张安全至上、与沙特结盟，并且不与反对派进行谈判。"
 BHR.Monarchist: "£BHR_Autocracy_small 哈利法王室 - 传统派"
 BHR.Monarchist_desc: "（传统君主主义）- 哈利法王室 - 传统派\n\n哈利法王朝的传统派系以皇家宫廷大臣哈立德·本·艾哈迈德、国防军司令哈利法·本·艾哈迈德以及已故首相哈利法·本·萨勒曼（通常被称为“哈瓦利德”）为核心。该派系认为，王朝的存亡取决于对安全部门的绝对控制、对逊尼派部落的庇护以及与沙特阿拉伯的紧密结盟，并将与什叶派反对派的对话视为一种威胁。\n\n在2011年的起义中，这个集团战胜了王储的改革派，并造成了社会解体后的政治孤立。它的影响力在于王室、军队和内政部。"
