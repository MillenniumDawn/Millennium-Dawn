l_polish:
 reverse_engineering_tech_bonus: "Inżynieria wsteczna"
 reverse_engineering.1.t: "Analiza zagranicznego sprzętu"
 reverse_engineering.1.d: "Nasi inżynierowie rozebrali na części zagraniczny sprzęt wojskowy, który niedawno trafił w nasze ręce. Wyniki ich analizy pomogą naszym instytutom badawczym nadrobić zaległości względem tej generacji rozwiązań konstrukcyjnych."
 reverse_engineering.1.a: "Podziel się ustaleniami z naszymi projektantami."