 SIN_infantry_weapons_2: "SAR 80"
 SIN_infantry_weapons_3: "SR 88"
 SIN_infantry_weapons_4: "SAR 21"
 SIN_infantry_weapons_4_desc: "ST Kinetics가 자체 설계 및 생산한 최초의 성공적인 국산 돌격소총인 SAR 21은 21세기 싱가포르군(SAF)의 요구에 부응하는 현대적인 솔루션입니다. 슈타이어 AUG와 외형은 유사하지만, 그 작동 방식은 SAF의 필요에 맞게 개량된 AR-15 모델을 기반으로 합니다. 구형 M16S1을 대체한 SAR 21은 현재 SAF의 모든 병사, 예비군 및 병력의 주력 무기로 사용되고 있습니다."
 SIN_infantry_weapons_5: "SAR 21 MMS"
 SIN_infantry_weapons_5_desc: "In the early 2000s the Ministry of Defence had unveiled a new framework for a technologically advanced fighting force, launching the initiative to transform the SAF into a 3rd Generation Army. The SAR 21 MMS is a modified variant of the SAR 21 that comes under the Advanced Combat Man System. It was introduced in 2005 to give every serviceman the situational awareness they need in the modern battlefield, fully integrated with HUD displays, tactical data-links and an advanced network of communications as part of the SAF's transition into a 3G Fighting Force."
 SIN_infantry_weapons_6: "BR 18 BMCR"
 SIN_infantry_weapons_6_desc: "The BMCR was first revealed in the 2014 Singapore Air Show as part of the SAF's future technology. It soon became the BR-18 Assault Rifle that will be replacing the SAR 21, quickly entering production in 2018."
 SIN_util_vehicle_6: "Belrex PCSV"
 SIN_util_vehicle_6_short: "Belrex"
 SIN_util_vehicle_6_desc: "The Belrex PCSV was revealed in 2016 as part of the SAF's initiative to transform its Army into a 3rd Generation Fighting Force. Originally derived from the South African Marauder MRAP, the Belrex is designed to serve a similar role but with the flexibility to be modified for different missions and needs. The Belrex was to replace SAF's 5-ton trucks and armoured vehicles."
