 BOS_ac_unity_mio_trait_weapon_overhaul: "무기 정비 라인"
 BOS_focus: "보스니아 국가 중점 트리"
 BOS_army_of_the_federation_bosnia_herzegovina: "연방군"
 BOS_army_of_the_federation_bosnia_herzegovina_desc: "연방의 보스니아크인 및 크로아티아인 부대는 작전 준비 태세를 잃지 않은 채 국가 지휘 체계에 편입되어야 합니다."
 BOS_army_of_republic_of_srpska: "스릅스카 공화국군"
 BOS_army_of_republic_of_srpska_desc: "군사 통합이 지속되려면 스릅스카 공화국의 부대가 새로운 군대에 대표성을 가져야 합니다."
 BOS_air_doctrine: "항공 교리 검토"
 BOS_air_doctrine_desc: "보스니아의 소규모 공군에는 영토 방어, 수송, 지상군 지원에 적합한 교리가 필요합니다."
 BOS_air_defence_initiative: "대공 방어 구상"
 BOS_air_defence_initiative_desc: "다층 대공 방어망은 대규모 전투기 전력 없이도 적 항공기에 대한 실질적인 대응책을 보스니아에 제공합니다."
 BOS_apc_armament: "장갑 수송차"
 BOS_apc_armament_desc: "부대에 장갑 수송차를 장비하면 보병을 보호하는 동시에 기계화 부대의 화력을 높일 수 있습니다."
 BOS_re_enlist_ratko_mladic: "라트코 믈라디치 재입대"
 BOS_re_enlist_ratko_mladic_desc: "라트코 믈라디치를 지휘관으로 복귀시키면 경험을 얻을 수 있으나, 화해와 국제적 정당성을 대가로 치러야 합니다."
 BOS_detain_ratko_mladic: "라트코 믈라디치 구금"
 BOS_detain_ratko_mladic_desc: "국제 사법과의 협력으로 라트코 믈라디치를 군사 업무에서 배제하겠지만, 많은 보스니아 세르비아인들이 분노할 것입니다."
 BOS_sam_systems: "지대공 미사일 체계 배치"
 BOS_sam_systems_desc: "고정식 지대공 미사일 기지는 사라예보와 주요 군사 기반시설을 공습으로부터 보호할 것입니다."
 BOS_aa_personnel_equipment: "대공 방어 부대 장비 지급"
 BOS_aa_personnel_equipment_desc: "기동 대공 방어 팀이 지상 부대를 동반하려면 현대식 발사기, 센서, 훈련이 필요합니다."
 BOS_helicopter_transportation: "헬리콥터 수송 확대"
 BOS_helicopter_transportation_desc: "수송 헬리콥터 전력을 늘리면 신속한 전개, 후송, 재난 구호를 뒷받침할 수 있습니다."
 BOS_radar_detection_advancement: "레이더 탐지 능력 향상"
 BOS_radar_detection_advancement_desc: "현대식 레이더 기지는 보스니아의 대공 방어 부대를 연결하고 접근하는 항공기를 더 일찍 경보해 줄 것입니다."
 BOS_domestic_production: "국산 항공기 생산"
 BOS_domestic_production_desc: "국내 군수 공장은 공군 장비를 유지하고 불확실한 외국 공급자에 대한 의존을 줄여 줄 것입니다."
 BOS_national_air_force_scheme: "국가 공군 계획"
 BOS_national_air_force_scheme_desc: "국가 공군 계획은 전투기, 지원, 기지 투자를 하나의 조달 계획 아래 통합할 것입니다."
 BOS_house_of_representatives: "하원 권한 강화"
 BOS_house_of_representatives_desc: "더 강력한 하원은 각 구성 민족에 대한 헌법상의 대표성을 보존하면서 국가 입법에 명확한 민주적 위임을 부여할 것입니다."
 BOS_bosnian_elections_crisis_gate_tt: "국가가 금융 위기 상황에 있는 동안에만 사용할 수 있습니다."
 BOS_the_federation: "연방 협약 갱신"
 BOS_the_federation_desc: "연방 협약을 갱신하면 정치체별 권한이 명확해지고 외국의 영향력이 줄어들겠지만, 모든 구성 지도부가 행동의 자유를 일부 양보해야 합니다."
 BOS_elections_political: "선거 제도 개혁"
 BOS_elections_political_desc: "선거 제도 개혁은 순환 대통령제에 대한 지속 가능한 위임을 확립하고 어느 국가 연립이 현대화 계획을 주도할지 결정할 것입니다."
 BOS_balkan_backyard: "발칸의 뒷마당"
 BOS_balkan_backyard_desc: "유고슬라비아 시절 번영에 대한 공통의 기억은 자발적인 지역 프로젝트를 뒷받침할 수 있으나, 이웃 정부들은 압박이나 강요가 아닌 설득을 통해 이끌어야 합니다."
 BOS_fight_or_perish: "싸울 것인가, 죽을 것인가"
 BOS_fight_or_perish_desc: "국가는 남은 인력을 동원하고 내전에서 살아남기 위해 필요한 부담을 감수할 것입니다."
 BOS_unified_armed_forces: "통합 군대"
 BOS_unified_armed_forces_desc: "모든 구성 민족이 수용할 수 있는 통합 군대는 협력적 복구 계획을 완수하고 비상 재정 조치를 종료할 것입니다."
 BOS_anti_federation_propaganda: "연방에 도전"
 BOS_anti_federation_propaganda_desc: "연방 권위에 도전하고, 새로운 산업을 스릅스카 공화국으로 유도하며, 국가 안정을 희생하더라도 세르비아와의 관계를 심화합니다."
 BOS_alija_izetbegovic_legacy: "알리야 이제트베고비치의 유산"
 BOS_alija_izetbegovic_legacy_desc: "알리야 이제트베고비치의 유산은 보스니아크인의 국가성을 민주적 제도와 전시 동원 모두에 결부시킵니다. 그의 후계자들은 그 유산 중 어느 부분이 보스니아를 이끌지 결정해야 합니다."
 BOS_european_relations: "유고슬라비아 유산 되살리기"
 BOS_european_relations_desc: "옛 유고슬라비아 전역에 걸친 문화적, 정치적 교류는 향수를 지역 협력에 대한 지지로 바꿔 놓을 것입니다."
 BOS_revive_relation_with_serbia_yugoslavia: "[SER.GetName]와(과)의 관계 회복"
 BOS_revive_relation_with_serbia_yugoslavia_desc: "세르비아와의 공식 관계를 복원하면 스릅스카 주도 정부는 강화되겠지만, 보스니아크 및 크로아티아 지도자들은 경계할 것입니다."
 BOS_eu_loans: "EU 개발 차관"
 BOS_eu_loans_desc: "유럽의 개발 신용은 재건을 위한 즉각적인 유동성을 제공하는 한편, 감당할 수 있는 수준의 부채 부담을 더할 것입니다."
 BOS_bosnian_revanchism: "보스니아 복수주의"
 BOS_bosnian_revanchism_desc: "복수주의 지도자들은 보스니아크인의 전시 요구를 데이턴 타협보다 앞세워 군사적 이해관계를 강화하겠지만, 공동체 간 갈등이 재발할 위험을 안게 됩니다."
 BOS_western_objectives: "서방 노선"
 BOS_western_objectives_desc: "확고한 서방 노선은 유럽-대서양 기구와 안보 지원의 문을 열어 주는 한편 동방이라는 대안을 닫을 것입니다."
 BOS_eastern_frontier: "동방 노선"
 BOS_eastern_frontier_desc: "보스니아는 서방의 감독에 대한 동방의 균형추로서 러시아 및 세르비아와의 동반자 관계를 추구할 것입니다."
 BOS_a_new_struggle: "새로운 투쟁"
 BOS_a_new_struggle_desc: "복수주의 조직가들은 민족주의 조직망을 동원하여 전후 정치적 합의를 약화시킬 것입니다."
 BOS_us_assistance: "미국의 지원"
 BOS_us_assistance_desc: "미국과의 더욱 긴밀한 상업적 유대는 광범위한 NATO 무역 관계를 집중된 양자 동반자 관계로 대체할 것입니다."
 BOS_bosnian_euro_defence_clause: "유럽의 방위 보장"
 BOS_bosnian_euro_defence_clause_desc: "EUFOR가 책임을 국가 기관에 이양함에 따라, 유럽 주요국들은 보스니아를 보장할지 개별적으로 결정할 것입니다."
 BOS_russo_bosnian_alignment: "러시아와의 동반자 관계"
 BOS_russo_bosnian_alignment_desc: "러시아와의 공식 동반자 관계는 보스니아의 주권을 훼손하지 않고 동방과의 무역 및 정치적 지지를 심화할 것입니다."
 BOS_serbian_bosnian_arms_treaty: "[SER.GetAdjective]-보스니아 무기 조약"
 BOS_serbian_bosnian_arms_treaty_desc: "세르비아의 생산 라이선스는 재무장을 가속하는 한편 보스니아 국방 정책에 대한 베오그라드의 영향력을 키울 것입니다."
 BOS_srpska_supremacy: "스릅스카 우위"
 BOS_srpska_supremacy_desc: "우월주의 계획은 권력 분점을 해체하고 국가를 스릅스카 기관 아래에 두어 다른 구성 민족들을 자극할 것입니다."
 BOS_national_awakening: "민족 각성"
 BOS_national_awakening_desc: "복수주의 운동은 국제 감독과 결별하고 이슬람주의 세력의 국가 권력 장악을 준비할 것입니다."
 BOS_relax_conscription_laws: "징병법 완화"
 BOS_relax_conscription_laws_desc: "정치체의 병력이 국가 민간 통제로 돌아옴에 따라, 의무 복무를 줄이면 가계의 부담이 덜어질 것입니다."
 BOS_cooperation_alignment: "협력 노선"
 BOS_cooperation_alignment_desc: "공동 행정과 반부패 조치는 정치체의 자치를 폐지하지 않고도 정치체들을 사라예보와 정렬시킬 것입니다."
 BOS_bosnian_trade_alliance: "서방 무기 동반자 관계"
 BOS_bosnian_trade_alliance_desc: "미국 항공기 및 보병 무기 라이선스가 서방 무기 동반자 관계의 중심이 될 것입니다."
 BOS_beograd_conference: "베오그라드 회담"
 BOS_beograd_conference_desc: "베오그라드 회담은 보스니아가 보다 폭넓은 동방 동맹을 모색하기에 앞서 안보 및 경제 분쟁을 해소할 것입니다."
 BOS_muslim_strong_arm: "이슬람주의 전위대"
 BOS_muslim_strong_arm_desc: "이슬람주의 전위대는 새 정권을 공고히 하고 해외의 우호적인 정부들로부터 지지를 구할 것입니다."
 BOS_muslim_nationalism: "무슬림 민족주의"
 BOS_muslim_nationalism_desc: "무슬림 민족주의는 종교적 권위, 동원, 개입주의적 외교 정책을 결합할 것입니다."
 BOS_demote_serbian_irrational_nationalism_new: "세르비아 강경파 견제"
 BOS_demote_serbian_irrational_nationalism_new_desc: "연방 정당들은 세르비아 강경 세력을 고립시키며, 단기적 긴장을 감수하는 대신 더 강한 시민 국가를 얻을 것입니다."
 BOS_accommodate_serbian_pride_new: "세르비아 자치 수용"
 BOS_accommodate_serbian_pride_new_desc: "헌법상의 양보는 세르비아의 자치를 인정하고 온건한 스릅스카 정당들을 정부로 끌어들일 것입니다."
 BOS_nato_status: "NATO 가입 추진"
 BOS_nato_status_desc: "보스니아는 국내 화해와 비상 외국 감독의 종료 이후에야 NATO 가입을 추진할 것입니다."
 BOS_union_with_serbia: "세르비아와의 연합"
 BOS_union_with_serbia_desc: "세르비아는 정치적 연합에 대한 협상안을 받게 되며, 보스니아의 편입을 받아들이거나 거절할 수 있습니다."
 BOS_mosque_construction: "모스크 건설 계획"
 BOS_mosque_construction_desc: "모스크와 종교 기관에 대한 국가 지원은 정권의 이슬람적 정체성을 심화할 것입니다."
 BOS_milorad_dodik_new: "밀로라드 도디크 배제"
 BOS_milorad_dodik_new_desc: "밀로라드 도디크의 후원 조직망을 제거하면 부패는 줄겠지만 스릅스카 유권자 일부가 멀어질 것입니다."
 BOS_european_affairs: "유럽 사안"
 BOS_european_affairs_desc: "유럽과의 무역과 민주적 제도는 보스니아의 평화적 외교 정책의 기반이 될 것입니다."
 BOS_pathway_towards_eu_membership: "EU 가입 경로"
 BOS_pathway_towards_eu_membership_desc: "보스니아가 유럽의 기반시설 및 통치 요건을 충족하는 동안 EU 회원국들은 투자 여부를 결정할 것입니다."
 BOS_formation_of_bonds_with_the_eu: "EU와의 경제적 유대 구축"
 BOS_formation_of_bonds_with_the_eu_desc: "유럽 연합과의 상업적 유대를 확대하면 시장 접근성이 깊어지고 자금 조달 비용이 줄어들 것입니다."
 BOS_yugoslav_cultural_revival: "유고슬라비아 문화 부흥"
 BOS_yugoslav_cultural_revival_desc: "국가가 지원하는 영화, 음악, 공동 전쟁 기념비는 유고슬라비아 시절을 실패한 실험이 아니라 공동의 유산으로 제시할 것입니다."
 BOS_common_market_proposal: "공동 시장 제안"
 BOS_common_market_proposal_desc: "후계 국가들 사이의 무관세 무역 제안은 1990년대에 단절된 상업적 유대를 재건할 것입니다."
 BOS_federal_charter: "연방 헌장 초안 작성"
 BOS_federal_charter_desc: "자발적 연방을 위한 헌법 초안을 공표하면 재통합 운동에 구체적인 정치 강령을 제공할 것입니다."
 BOS_reconciliation_commission: "화해 위원회"
 BOS_reconciliation_commission_desc: "전시 불만에 관한 합동 위원회는 세 구성 민족 모두의 증언을 청취하고 유고슬라비아 구상의 국내적 비용을 낮출 것입니다."
 BOS_convene_the_federation: "연방 소집"
 BOS_convene_the_federation_desc: "대중의 지지가 허락하면 사라예보는 후계 정부들을 소집하여 복원된 연방을 협상할 것입니다."
 BOS_greater_srpska_state: "대스릅스카 국가"
 BOS_greater_srpska_state_desc: "중앙집권 국가는 스릅스카 기관을 중심으로 재건되며, 연합 구상은 국내의 정치체 우위로 대체될 것입니다."
 BOS_purge_the_federation: "연방 숙청"
 BOS_purge_the_federation_desc: "보스니아크 및 크로아티아 관리들은 부처, 법원, 경찰 지휘부에서 제거되어 스릅스카 통치에 대한 조직적 저항이 끝날 것입니다."
 BOS_srpska_command_primacy: "스릅스카 지휘 우위"
 BOS_srpska_command_primacy_desc: "스릅스카 장교들이 군의 모든 고위직을 차지하여 군대를 정치체 지도부에 묶어 둘 것입니다."
 BOS_dominant_entity: "지배적 정치체"
 BOS_dominant_entity_desc: "스릅스카는 이제 사실상, 법적으로도 보스니아를 통치합니다. 남아 있는 연방 기관들은 정치체를 섬기기 위해 존재합니다."
 BOS_council_democracy: "평의회 민주주의"
 BOS_council_democracy_desc: "직장 평의회는 국가 기구에 대표를 선출하여 조직된 노동에 영구적인 헌법상의 역할을 부여할 것입니다."
 BOS_nationalize_heavy_industry: "중공업 국유화"
 BOS_nationalize_heavy_industry_desc: "국가는 제철소, 광산, 기계 공장의 지배 지분을 확보하고 이를 평의회 관리 아래 둘 것입니다."
 BOS_workers_republic: "노동자 공화국 선포"
 BOS_workers_republic_desc: "노동 운동은 데이턴 이후 체제를 평의회를 통해 통치되는 사회주의 공화국으로 대체할 것입니다."
 BOS_business_sector_management: "기업 부문 육성"
 BOS_business_sector_management_desc: "사라예보에 비용을 산정한 사무 단지 사업을 추진하면, 충분한 인력이 확보되는 한 서비스 경제가 공식화될 것입니다."
 BOS_lumber_harvesting: "임업 부문 육성"
 BOS_lumber_harvesting_desc: "지속 가능한 임업과 가공 기준은 또 다른 영구 보조금 제도에 의존하지 않고도 농촌 수출을 확대할 것입니다."
 BOS_land_mines_desc: "전시 지뢰밭은 지금도 민간인의 목숨을 앗아 가고, 정착을 제약하며, 생산 가능한 토지를 사용하지 못하게 만들고 있습니다."
 BOS_prep_for_civil_war_map: "내전 준비"
 BOS_prep_for_civil_war: "내전 준비 작전"
 BOS_prep_for_civil_war_desc: "보스니아가 내전 재발을 앞두고 있는 가운데 스릅스카 공화국이 재무장하고 있습니다. 준비 작전을 통해 전투가 시작되기 전에 무기를 확보하고 정부의 대비 태세를 높일 수 있습니다."
 BOS_bosnian_faction_management: "구성 집단 관리"
 BOS_internal_factions: "보스니아의 민족들"
 BOS_internal_factions_desc: "데이턴 합의는 국가 기관, 보스니아 헤르체고비나 연방, 스릅스카 공화국 사이에 권한을 나눕니다. 정부 정책은 각 구성 집단의 신뢰, 안정도, 그리고 인력 제공 의지를 변화시킵니다."
 BOS_return_of_entitled_lands: "통제 지역 통합"
 BOS_return_of_entitled_lands_desc: "인접한 통제 국가가 순응도 80% 이상에 도달하고 저항도 10% 미만으로 떨어진 뒤에 통합합니다."
 BOS_islamic_uprising: "보스니아 내전의 운명"
 BOS_islamic_uprising_desc: "내전이 그들의 인내심보다 오래 지속되면 엘 무자히드 전투원들이 사라예보와 스릅스카 공화국 양측 모두에 등을 돌릴 수 있습니다."
 BOS_declare_islamic_takeover: "엘 무자히드 반란"
 BOS_declare_islamic_takeover_desc: "외국인 이슬람주의 전투원들이 정부와 결별하고 내전이 계속되는 동안 자신들의 국가를 세울 준비를 하고 있습니다."
 BOS_core_states_2: "[FROM.GetName] 통합"
 BOS_core_states_2_desc: "순응하는 이 인접 국가를 통합하는 데 정치적, 산업적 자원을 투입합니다."
 BOS_raid_weapon_stockpiles: "무기 비축고 습격"
 BOS_raid_weapon_stockpiles_desc: "내전이 재발하기 전에 경비가 허술한 전시 무기고에서 보병 무기를 확보합니다."
 BOS_civil_war: "다가오는 폭풍"
 BOS_civil_war_desc: "스릅스카 공화국이 분리 독립을 준비하고 있습니다. 위기가 해결되지 않으면 이 임무가 만료될 때 내전이 시작됩니다."
 BOS_croats_declare_independence: "크로아티아인 독립 선언"
 BOS_croats_declare_independence_desc: "국가 안정도가 계속 낮으면 적대적인 크로아티아인 공동체가 헤르체고비나의 분리 독립을 지지할 수 있습니다."
 BOS_srpska_declares_independence: "스릅스카 공화국 독립 선언"
 BOS_srpska_declares_independence_desc: "국가 안정도가 계속 낮으면 적대적인 세르비아인 공동체가 분리 독립을 지지할 수 있습니다."
 BOS_quell_serbians: "세르비아인 반대 세력 진압"
 BOS_quell_serbians_desc: "적대적인 세르비아인 조직에 강압 수단을 사용하여 그들의 신뢰와 안정도를 낮추는 대신 정당 지지 구도를 바꿉니다."
 BOS_gain_srpska_popular_support: "세르비아인의 대중적 지지 확보"
 BOS_gain_srpska_popular_support_desc: "대민 활동과 지역 사업에 자금을 대어 세르비아인의 신뢰와 안정도를 높입니다."
 BOS_fund_bosniak_community_programs: "보스니아크 공동체 사업 지원"
 BOS_fund_bosniak_community_programs_desc: "보스니아크 거주 지역의 학교, 진료소, 지역 서비스 비용을 국고에서 지불합니다. 정치 캠페인처럼 보스니아크인의 신뢰를 회복시키지만, 정치력 대신 자금을 사용합니다."
 BOS_fund_croat_community_programs: "크로아티아인 공동체 사업 지원"
