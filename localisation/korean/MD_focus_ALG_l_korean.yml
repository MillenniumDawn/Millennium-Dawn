 ALG_social_contract_idea: "사회 계약"
 ALG_state_hospitals_idea: "국립 병원"
 ALG_transparent_budget: "투명한 예산"
 ALG_appoint_sellal: "압델말렉 셀랄 임명"
 ALG_appoint_sellal_desc: "부테플리카의 기술 관료이자 충성파인 셀랄은 안정과 국가 기관 관리에 중점을 둔 연속성과 실용적 통치를 대표합니다."
 ALG_sellal_gets_appointed: "압델말렉 셀랄이 총리로 임명되었습니다."
 ALG_sellal_modifiers: "§Y셀랄 임명의 효과:§!\n민주주의 이동: §G+0.10§!\n관료제 비용: §G-10%§!\n세수: §G+3%§!\n예상 경찰 지출: §R-1§!\n예상 의료 지출: §R-1§!"
 ALG_appoint_ouyahia: "아흐메드 우야히아 임명"
 ALG_appoint_ouyahia_desc: "우야히아는 가혹한 긴축과 집권 기득 세력에 대한 충성으로 유명한 노련한 정치인입니다. 그의 지도 방식은 중앙 집권적 통제와 재정 규율을 선호합니다."
 ALG_ouyahia_gets_appointed: "아흐메드 우야히아가 총리로 임명되었습니다."
 ALG_ouyahia_modifiers: "§Y우야히아 임명의 효과:§!\n민주주의 이동: §G+0.10§!\n관료제 비용: §G-10%§!\n세수: §G+3%§!\n예상 경찰 지출: §R-1§!\n예상 의료 지출: §R-1§!"
 ALG_appoint_bedoui: "누레딘 베두이 임명"
 ALG_appoint_bedoui_desc: "직업 관료이자 장관인 베두이는 대통령직에 대한 기술 관료적 충성을 구현합니다. 그의 통치 방식은 행정 효율과 제한적 개혁을 강조합니다."
 ALG_bedoui_gets_appointed: "누레딘 베두이가 총리로 임명되었습니다."
 ALG_bedoui_modifiers: "§Y베두이 임명의 효과:§!\n민주주의 이동: §G+0.10§!\n관료제 비용: §G-10%§!\n세수: §G+3%§!\n예상 경찰 지출: §R-1§!\n예상 의료 지출: §R-1§!"
 ALG_no_pm_set: "§R총리가 임명되지 않음§!"
 ALG_ahmed_gaid_salah_desc: "인민 국가군 참모총장이었던 아흐메드 가이드 살라는 독립 전쟁 중에 계급을 올라온 직업 군인으로, 훗날 알제리 군사 및 정치 문제에서 가장 영향력 있는 인물 중 한 명이 되었습니다."
 ALG_smain_lamari_desc: "알제리 정보 및 방첩 기관의 수장이었던 스마인 라마리는 암흑의 10년 동안 이슬람주의 반군에 맞선 '더러운 전쟁'에서 핵심적인 역할을 했습니다."
 ALG_kaidi_mohamed_desc: "기계화 부대 경험이 풍부한 존경받는 장교인 카이디 모하메드는 기갑전과 알제리 육군의 현대화를 전문으로 했습니다."
 ALG_ahcene_tafer_desc: "아흐센 타페르는 알제리 기계화 부대에서의 리더십과 내전 이후 시기 육군 재편에서의 역할로 알려졌습니다."
 ALG_mohammed_larbi_haouli_desc: "모하메드 라르비 하울리는 현대화 시기에 알제리 해군을 지휘하며 연안 방어와 지역 협력 사이의 균형을 잡았습니다."
 ALG_ammar_atamnia_desc: "알제리 육군의 전략가로 복무한 고위 장교 암마르 아탐니아는 방어전과 군사 훈련을 강조한 것으로 알려졌습니다."
 ALG_mohammed_al_arabi_hawalli_desc: "모하메드 알아라비 하왈리는 해군 지휘직을 역임하며 알제리 해상 전력의 개혁에 기여했습니다."
 ALG_mahmoud_laraba_desc: "공군 사령관이었던 마흐무드 라라바는 조종사 훈련과 알제리 항공 방어망의 재편에 관여했습니다."
 ALG_mohamed_lamari_desc: "암흑의 10년 동안 참모총장을 지낸 모하메드 라마리는 알제리의 대반란 작전을 지휘한 핵심 인물 중 한 명이었습니다."
 ALG_said_chengriha_desc: "사이드 셍그리하는 기갑전과 병참을 전문으로 하였으며, 이후 알제리 육군을 지휘하는 자리에 올라 마침내 참모총장을 역임했습니다."
 ALG_ben_ali_ben_ali_desc: "알제리 정예 부대의 지휘관인 벤 알리 벤 알리는 보병 내에서 전문성과 규율로 명성을 쌓았습니다."
 ALG_fatima_zohra_ardjoune_desc: "알제리에서 장군 계급에 오른 최초의 여성 중 한 명인 파티마 조흐라 아르주네는 군의관이자 군 현대화의 상징이었습니다."
 ALG_mohamed_mediene_desc: "'투피크'로 알려진 모하메드 메디엔은 1990년부터 2015년까지 알제리의 막강한 정보기관(DRS)을 이끌었으며, 현대 알제리 역사에서 가장 영향력 있는 인물 중 한 명이 되었습니다."
 ALG_abdelmalek_guenaizia_desc: "압델말렉 게나이지아는 국방 차관을 거쳐 참모총장을 역임하며 알제리 군 현대화에서 핵심적인 역할을 했습니다."
 ALG_ahmed_bousteila_desc: "알제리 헌병대 사령관 아흐메드 부스테일라는 알제리 농촌 지역의 치안과 밀수 및 테러 대응을 총괄했습니다."
 ALG_fatima_boudouani_desc: "알제리 육군에서 장군으로 승진한 최초의 여성(2009년)인 파티마 부두아니는 군 내 성별 통합의 돌파구를 상징했습니다."
 alg_medal_1: "11월 1일 훈장"
 alg_medal_1_desc: "국가 방어에서의 탁월한 용맹에 수여됩니다."
 alg_medal_2: "민족 해방 훈장"
 alg_medal_2_desc: "알제리 독립 투쟁에 대한 뛰어난 공헌을 기립니다."
 alg_medal_3: "군사 공로 훈장"
 alg_medal_3_desc: "탁월한 지휘와 복무에 수여됩니다."
 alg_medal_4: "용맹 훈장"
 alg_medal_4_desc: "전장에서의 용기 있는 행위를 인정합니다."
 alg_medal_5: "인민 봉사 훈장"
 alg_medal_5_desc: "민간인 보호를 위한 헌신적인 봉사에 수여됩니다."
 alg_medal_6: "순국선열 유산 훈장"
 alg_medal_6_desc: "조국을 위한 궁극적인 희생의 상징입니다."
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_0: "소위"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1: "중위"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_2: "대위"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3: "소령"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4: "대령"
 algeria_intro.1.t: "알제리 인민 민주공화국"
 algeria_intro.1.d: "알제리는 피로 얼룩진 암흑의 10년의 상처를 안은 채 21세기에 들어섰지만 여전히 굳건히 서 있습니다. 국가는 이슬람주의 반란에서 살아남았으나, 내전의 상처는 여전히 깊습니다. 압델아지즈 부테플리카 대통령은 화해와 재건을 약속하지만, 앞에 놓인 과제는 버겁습니다. 경제를 되살리고, 군을 개혁하고, 국민과 국가 사이의 신뢰를 재건하며, 강대한 해외 파트너들 사이에서 균형을 잡아야 합니다. 알제리는 안정을 공고히 하여 지역 강국으로 부상할 것입니까, 아니면 다시 한 번 내분에 빠져들 것입니까?"
 algeria_intro.1.a: "상처 입었으나 꺾이지 않은 나라."
 ALG_resistance_window_title: "알제리 저항 운동"
 ALG_resistance_window_desc: "나라가 광범위한 시위와 불안, 저항으로 흔들리고 있습니다. 르 푸부아르은 반대 의견을 억누르려 하지만, 압박이 가해질수록 저항은 더욱 거세집니다."
 ALG_protester_exhaustion_TT: "§Y시위대§!가 정부의 대응 조치에 지쳐 가고 있습니다."
 ALG_deploys_security_TT: "§Y국가가 불안을 진압하기 위해 대규모 보안 병력을 투입합니다.§!"
 ALG_presidential_decisions_only_one_is_available_TT: "진압 조치는 한 번에 하나만 활성화할 수 있습니다."
 ALG_resistance_movement: "히라크 운동"
 ALG_resistance_movement_desc: "히라크로 알려진 전국적 풀뿌리 시위가 알제리 전역에서 정치 개혁, 투명성, 사회 정의를 계속 요구하고 있습니다."
 ALG_throttle_internet_speeds: "칙령 제24-17호: 통신 규제"
 ALG_throttle_internet_speeds_desc: "칙령 24-17호에 따라 당국은 히라크 조직자들을 교란하기 위해 온라인 플랫폼과 소셜 미디어 접속을 제한합니다. 이는 시위 조율을 제한하지만 시민들의 불만을 키우고 경제 활동을 둔화시킵니다."
 ALG_nationwide_security_presence: "사막 매 작전: 전국 보안 병력 배치"
 ALG_fund_pro_government_protests: "국민 연대 프로그램: '바라카' 구상"
 ALG_fund_pro_government_protests_desc: "정부는 히라크 운동에 맞서기 위해 바라카 프로젝트에 따라 친정부 시위에 자금을 지원하고 조직합니다. 이는 반대 세력의 기세를 꺾을 수 있지만 비용이 많이 들고 대중의 분노를 부채질할 위험이 있습니다."
 ALG_deploy_security_kabylia_1: "카빌리아에 보안 병력 배치"
 ALG_deploy_security_kabylia_1_desc: "카빌리아는 불안의 온상이 되었습니다. 보안 병력을 배치하면 지역을 진정시킬 수 있지만, 지역의 분노를 더욱 키울 위험이 있습니다."
 ALG_deploy_security_mzab_1: "음자브 계곡에 보안 병력 배치"
 ALG_deploy_security_mzab_1_desc: "음자브 계곡의 긴장이 고조되었습니다. 보안 분견대를 파견하면 현지의 불안을 억제할 수 있지만, 강압적인 작전은 지역 사회를 소외시키고 장기적 신뢰를 훼손할 위험이 있습니다."
 ALG_deploy_security_aures_1: "오레스 고지에 보안 병력 배치"
 ALG_deploy_security_aures_1_desc: "오레스 고지는 시위의 중심지가 되었습니다. 보안 병력 배치는 대규모 집회를 해산시킬 수 있지만, 험준한 지형에서 병참에 부담을 주고 지역의 불만을 부채질할 수 있습니다."
 ALG_deploy_security_tamanrasset_1: "타만라세트 지방에 보안 병력 배치"
 ALG_deploy_security_tamanrasset_1_desc: "타만라세트 남부 지방에서 불안이 커지고 있습니다. 병력을 배치하면 수송로와 주요 시설을 안정시킬 수 있지만, 지역 사회와의 관계를 해치고 사하라 횡단 무역을 교란할 위험이 있습니다."
 ALG_deploy_security_granderg_1: "서부 대사구에 보안 병력 배치"
 ALG_deploy_security_granderg_1_desc: "서부 대사구(그랑 에르그 오시당탈) 주변의 불안이 외딴 정착지와 핵심 기반시설을 위협하고 있습니다. 보안 순찰은 단기적인 질서를 가져올 수 있지만, 가혹한 환경 탓에 지속적인 작전은 비용이 많이 들고 정치적으로 민감합니다."
 ALG_deploy_security_atlas_1: "아틀라스 산기슭에 보안 병력 배치"
 ALG_deploy_security_atlas_1_desc: "아틀라스 산기슭에서는 시위와 노동 쟁의가 반복되고 있습니다. 표적을 정한 배치는 수송 회랑을 따라 대규모 동원을 막을 수 있지만, 농촌 주민들의 분노를 키울 수 있습니다."
 ALG_deploy_security_constantinois_1: "콩스탕티누아 지역에 보안 병력 배치"
 ALG_deploy_security_constantinois_1_desc: "콩스탕틴과 그 주변에서 시위가 빈번히 일어나고 있습니다. 이곳에 보안 자산을 집중하면 정부 시설과 항만을 보호할 수 있지만, 인구 밀집 지역에서 충돌이 일어날 가능성이 높아집니다."
 ALG_deploy_security_algerois_1: "알제 수도권에 보안 병력 배치"
 ALG_deploy_security_algerois_1_desc: "알제는 여전히 히라크 활동의 중심입니다. 대규모 보안 병력은 거리 동원을 억제하고 기관을 지킬 수 있지만, 수도에서 눈에 띄는 탄압이 이루어질 위험이 있으며 상당한 정치적 파장이 따를 것입니다."
 ALG_deploy_security_oranais_1: "오랑 및 서부 해안에 보안 병력 배치"
 ALG_deploy_security_oranais_1_desc: "오랑 지역에서는 노동 및 청년 네트워크와 연계된 시위가 늘고 있습니다. 병력을 배치하면 항만과 경제 거점을 보호할 수 있지만, 상업을 방해하고 지역 지도자들과의 긴장을 고조시킬 수 있습니다."
 ALG_doing_decision: "현재 진압 조치 시행 중"
 ALG_doing_decision_y: "현재 진압 조치 시행 중"
 ALG_protests_ongoing: "전국 시위 진행 중"
 ALG_locals_swayed: "현지인들이 시위대에 동조함"
 ALG_kabylia_fell_recently: "카빌리아가 최근 진압됨"
 ALG_oranais_fell_recently: "오라네 지역이 최근 진압됨"
 ALG_algerois_fell_recently: "알제 수도권이 최근 진압됨"
 ALG_constantinois_fell_recently: "콩스탕티누아 지역이 최근 진압됨"
 ALG_atlas_fell_recently: "아틀라스 산기슭이 최근 진압됨"
 ALG_granderg_fell_recently: "서부 대사구가 최근 진압됨"
 ALG_tamanrasset_fell_recently: "타만라세트 지방이 최근 진압됨"
