 FRA_alstom_manufacturer: "阿尔斯通"
 FRA_alstom_manufacturer_desc: "阿尔斯通公司于1998年在巴黎上市，主要生产法国的机车、高速列车、地铁、有轨电车和铁路信号系统。2004年接受政府救助后，该公司于2015年将其电力业务出售给通用电气，此后成为一家纯粹的铁路公司；2021年收购庞巴迪运输公司后，成为中国以外最大的铁路车辆制造商。"
 FRA_alstom_manufacturer_trait: "铁路车辆产业基地"
 FRA_alstom_manufacturer_trait_desc: "贝尔福、拉罗谢尔、赖希绍芬、克雷斯潘、勒克勒佐和奥尔南在法国境内构成了一条完整的铁路供应链，涵盖牵引、车体、转向架、总装和信号系统，且不含任何外国部件。"
 FRA_alstom_branch_high_speed: "高速项目"
 FRA_alstom_branch_urban_transit: "城市交通"
 FRA_alstom_branch_freight_logistics: "货运与物流铁路"
 FRA_alstom_tgv_duplex: "TGV双层"
 FRA_alstom_tgv_duplex_desc: "TGV双层于1996年投入使用，成为饱和的巴黎-里昂轴线上的标准高速列车，每列列车的载客量增加了40%，而无需加长站台。"
 FRA_alstom_belfort_power_cars: "贝尔福特动力列车"
 FRA_alstom_belfort_power_cars_desc: "贝尔福工厂为所有法国高速列车制造牵引头。自阿维利亚地平线项目以来，该厂四分之三的工作量都来自这一个项目，这使得成本和风险集中在一个车间内。"
 FRA_alstom_avelia_horizon: "阿维利亚地平线"
 FRA_alstom_avelia_horizon_desc: "法国国家铁路公司于2018年订购的第五代TGV列车保留了双层布局，但缩短了动力车厢，在降低每座成本的同时增加了20%的运力，并声称能源消耗减少了20%。"
 FRA_alstom_avelia_liberty: "阿维利亚自由"
 FRA_alstom_avelia_liberty_desc: "为美国铁路公司东北走廊线建造的摆式列车是阿尔斯通首次向美国出口高速列车。认证延误造成了不小的损失，但这份订单使阿尔斯通在美国这个此前对法国铁路车辆关闭的市场站稳了脚跟。"
 FRA_alstom_la_rochelle_assembly: "拉罗谢尔组装"
 FRA_alstom_la_rochelle_assembly_desc: "拉罗谢尔工厂为阿维利亚系列列车组装客车，并设计西塔迪斯有轨电车。它是大西洋沿岸最大的单一铁路雇主，也是新型车身结构技术在推广到其他工厂之前进行验证的基地。"
 FRA_alstom_citadis_tramway: "西塔迪斯有轨电车"
 FRA_alstom_citadis_tramway_desc: "2000年推出的低地板模块化电车西塔迪斯迅速成为欧洲电车的标配，销往六十多个城市。其标准化的模块设计使得无需定制设计方案即可完成整个网络的规划和交付。"
 FRA_alstom_metropolis_metro: "大都会地铁"
 FRA_alstom_metropolis_metro_desc: "大都会系列列车涵盖了基于同一平台的无人驾驶和传统地铁车辆，规格从轻型自动化摆渡车到八节编组的干线列车不等。批量生产使得单价低于定制国家级设计的成本。"
 FRA_alstom_urbalis_cbtc: "乌尔巴利斯列车通信控制系统"
 FRA_alstom_urbalis_cbtc_desc: "乌尔巴利斯是阿尔斯通公司基于通信技术的列车控制系统，可实现无人驾驶运行，并将发车间隔缩短至90秒以内。该系统在克雷斯潘和维勒班的研发中心开发，是该公司大部分自动化地铁项目的信号系统底层。"
 FRA_alstom_innovia_automated_transit: "创新自动化交通"
 FRA_alstom_innovia_automated_transit_desc: "创新自动化旅客捷运系统继承自庞巴迪公司，连接机场航站楼和人口密集的城区。其短列车组和固定轨道使其成为在现有轨道交通设施中增加固定轨道运力的最经济方案。"
 FRA_alstom_grand_paris_express: "巴黎大快车"
 FRA_alstom_grand_paris_express_desc: "欧洲最大的交通项目将在巴黎周边新建四条自动化地铁线路和两百公里轨道。阿尔斯通公司提供车辆和信号系统，该项目将为巴黎的城市交通运输提供十年的运力保障。"
 FRA_alstom_prima_locomotives: "普瑞玛铁路机车"
 FRA_alstom_prima_locomotives_desc: "普瑞玛系列电力和柴油货运机车于2001年起在贝尔福工厂生产，取代了法国国家铁路公司老旧的机车车队，并出口到摩洛哥、叙利亚和中国。它是法国铁路货运和军用铁路运输的主力军。"
 FRA_alstom_prima_h4_hybrid: "普瑞玛H4混合动力"
 FRA_alstom_prima_h4_hybrid_desc: "H4型调车机车将柴油发电机组与电池组相结合，使调车作业的燃料消耗减少了大约一半，并可在车辆段和编组站内实现静音运行。"
 FRA_alstom_atlas_ertms: "阿特拉斯欧洲列车控制系统"
 FRA_alstom_atlas_ertms_desc: "阿特拉斯是阿尔斯通公司对欧洲铁路交通管理系统的实施，它用单一的欧洲大陆标准取代了不兼容的各国信号系统。列车和路边设备均在克雷斯潘工厂生产。"
 FRA_alstom_coradia_ilint: "氢动力列车"
 FRA_alstom_coradia_ilint_desc: "首列氢燃料电池区域列车于2018年投入商业运营，运行于未电气化的支线线路上，唯一的排放物是水。它省去了在那些永远无法收回成本的线路上架设接触网的必要。"
 FRA_alstom_bombardier_transportation: "庞巴迪运输公司"
 FRA_alstom_bombardier_transportation_desc: "在欧盟委员会阻止了阿尔斯通与西门子交通集团的合并后，阿尔斯通于2021年1月完成了对庞巴迪运输公司的收购。此次收购使阿尔斯通的工厂和订单量翻了一番，并使其成为世界第二大铁路制造商。"
 FRA_crusade_time: "夺回祖产"
 FRA_crusade_time_desc: "无论是为了收复我们法兰克祖先的土地，还是为了夺回圣地，我们都必须与欧洲和中东的列强对抗。现在是我们开战的时候了。"
 FRA_vigipirate_surveillance: "The Vigipirate Plan"
 FRA_vigipirate_surveillance_desc: "To protect our citizens from potential terrorist attacks, we need to be more cautious and more intrusive."
