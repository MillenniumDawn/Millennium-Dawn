 RULE_EVENT_HORIZON_BLITZ: "闪电战 - 2001"
 RULE_EVENT_HORIZON_BLITZ_DESC: "事件穹界场景将在2001年开始\n\n§H注意：§!一旦§Y事件穹界§!中的巨型国家形成，你将失去当前的国策树，并被特定场景的国策树所取代。"
 RULE_EVENT_HORIZON_CASUAL: "随意 - 2012"
 RULE_EVENT_HORIZON_CASUAL_DESC: "事件穹界场景将在2012年开始\n\n§H注意：§!一旦§Y事件穹界§!中的巨型国家形成，你将失去当前的国策树，并被特定场景的国策树所取代。"
 RULE_EVENT_HORIZON_DELAYED: "迟滞 - 2020"
