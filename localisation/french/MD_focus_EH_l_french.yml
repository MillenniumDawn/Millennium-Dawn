 EH_event.406.d: "Après les récentes unifications en Amérique du Nord et centrale, le gouvernement de [FROM.GetName] a proposé une voie similaire pour nos nations sud-américaines. L'objectif est de créer un front unifié contre la menace chimère, en mettant en commun ressources, force militaire et volonté politique pour assurer la survie. Si les idéologies et les gouvernements diffèrent, la situation pourrait les faire changer d'avis."
