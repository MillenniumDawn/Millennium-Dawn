 GER_unemployment_crisis: "실업 위기"
 GER_unemployment_crisis_desc: "대규모 경기 부양 지출에도 불구하고 실업률, 특히 동부 연방주의 실업률은 높은 수준을 유지하고 있습니다. 독일은 이러한 점과 다른 경제적 실책들로 인해 '유럽의 병자'라고 조롱받아 왔습니다. 이제 새 천년의 경제 문제에 대한 입장을 정해야 할 때입니다."
 GER_control_over_the_market: "시장 통제"
 GER_control_over_the_market_desc: "개입주의적 접근을 취함으로써 우리는 연방 공화국의 경제를 직접 통제할 수 있으며, 이를 통해 고용을 촉진하고, 관료제를 더 효율적으로 만들며, 관광을 장려하여 독일인의 주머니에 곧바로 수익을 가져다줄 수 있습니다."
 GER_manage_workers: "노동자 관리"
 GER_manage_workers_desc: "독일 노동자는 현재 추적하지 않고 내버려 두기에는 너무 믿을 수 없는 존재입니다. 정부에 다양한 기관과 표준화된 절차를 도입함으로써 우리는 시민의 숙련된 손길을 더 효율적으로 관리할 수 있습니다."
 GER_stabilize_government_income: "수입 안정화"
 GER_stabilize_government_income_desc: "국가 및 행정 목적에 더 많고 더 안정적인 재원이 투입되도록 이끄는 조치가 시행될 것입니다."
 GER_unions_compromise: "조합과의 협상"
 GER_unions_compromise_desc: "노조는 건전한 노동 환경에서 만들어질 때 소유주와 그 관계자들(협력적인 노동 환경을 촉진함으로써)뿐 아니라 일반 노동자에게도 이로울 수 있습니다. 우리는 노동조합과의 타협안을 마련하여 깨끗한 노동 환경을 증진하고 연방공화국 전역의 기업에서 건전한 노사 관계를 보장할 수 있습니다."
 GER_increase_government_jobs: "정부 주도 구직 프로그램"
 GER_increase_government_jobs_desc: "정부 일자리 프로그램(Regierung Arbeitsprogramm)을 마련하면 국내 보안 병력의 규모를 신속히 확대할 수 있을 뿐 아니라 전국의 많은 실업자에게 일자리를 제공할 수 있습니다."
 GER_federal_employment_agency: "노동청"
 GER_federal_employment_agency_desc: "연방고용청 또는 BA(Bundesagentur für Arbeit)는 연방 노동사회부(BMAS)의 감독 아래 직업 알선 담당자(Arbeitsvermittler)를 활용하여 실업을 완화하고 실업 보험과 급여를 제공하도록 설계된 연방 차원의 행정 기관입니다."
 GER_prop_up_tourists: "관광객 유치"
 GER_prop_up_tourists_desc: "독일은 다채로운 풍경과 수많은 전통 서유럽 명소 덕분에 지구상에서 관광객이 가장 많이 찾는 국가 중 하나입니다. 관광객은 현지인과 가이드에게 상당한 사업 수익을 안겨 주므로 독일 국민에게 이익이 됩니다."
 GER_expand_visa_acceptance: "비자 수용 확장"
 GER_expand_visa_acceptance_desc: "비자 신청자를 위한 몇 가지 기준을 여기저기 완화하여 도이칠란트의 심장부로 향하는 여행을 더 쉽고 덜 번거롭게 만들 수 있습니다."
 GER_more_hotels: "관광 호텔 건설"
 GER_more_hotels_desc: "평균적인 관광객의 마음에 들도록 호텔을 건설하고 개선하면 관광객이 팁을 더 줄 가능성이 높아지고 더 오래 머물 뿐 아니라 다시 찾아오도록 유도할 수 있습니다. 이는 도시 지역의 수익을 직접적으로 증대시킬 것입니다."
 GER_tourism_in_bayern: "바이에른의 관광"
 GER_tourism_in_bayern_desc: "바이에른은 전국에서 관광객이 가장 많이 찾는 연방주 중 하나이며, 뮌헨은 베를린에만 뒤질 뿐입니다. 도시 한가운데의 고전적인 마리엔플라츠, 중세풍의 구시가지, 신시청사 등이 관광객으로 붐비는 명소의 일부 사례입니다."
 GER_tourism_in_hamburg: "함부르크의 관광"
 GER_tourism_in_hamburg_desc: "함부르크는 세계에서 가장 아름다운 도시 중 하나이며 비할 데 없는 매력을 발산합니다. 엘베강변의 이 도시에는 세계에서 가장 인기 있는 도시 풍경, 눈부신 명소, 독특한 밤 문화가 있습니다. 방문해 보십시오!"
 GER_german_workers_abroad: "독일 노동자들을 해외로"
 GER_german_workers_abroad_desc: ""
 GER_free_market_approach: "자유 시장 접근"
 GER_free_market_approach_desc: "경제는 내버려 둘 때 가장 번영합니다. 이 원칙에 따라 금융 문제에 대한 정부 개입을 줄이면 결국 지역 기업들이 건전하고 자연스러운 성장을 이룰 것입니다."
 GER_promote_german_startups: "독일 중소기업 촉진"
 GER_promote_german_startups_desc: "일부 국내 소기업에 투자하여 이들이 스스로 확장하고 개선하는 데 쓸 수 있는 자본과 자재를 제공할 수 있습니다."
 GER_education_investments: "교육에 투자"
 GER_education_investments_desc: "경제 규제 기관에서 관료 예산 일부를 확보한 만큼, 이제 교육과 문해력 프로그램에 지출을 집중하여 미래에 더 지적인 독일을 만들 수 있습니다."
 GER_foreign_policy_dedication: "외교 정책에 대한 헌신"
 GER_foreign_policy_dedication_desc: "국내 기업들이 더 폭넓은 국제 수출 모델로 나아가도록 장려하면 우리 경제를 점진적으로 소비·수출 혼합 경제로 전환하고, '메이드 인 저머니' 제품이 전 세계에 알려질 기회를 얻게 될 것입니다."
 GER_foreign_investment_opportunities: "해외 투자 기회"
 GER_foreign_investment_opportunities_desc: "국고에 목적 없이 잠들어 있는 돈은 없는 것과 같습니다. 대신 놀고 있는 수십억의 비축금을 용도 변경하여 국제 투자에 돌리고, 투자 수익률 구조를 통해 더 큰 이익을 창출해야 합니다."
 GER_a_digital_germany: "디지털화된 독일"
 GER_a_digital_germany_desc: "자유 시장은 언제나 승리하며, 멈출 수 없는 기술 진보의 톱니바퀴도 마찬가지입니다. 기회를 포착하고 사랑이 넘치는 독일 사업가들은 앞으로 수십 년 동안 독일이 유럽 문명의 요람으로 남도록 할 것입니다. 디지털 독일을 위하여!"
 GER_an_active_germany: "활력 넘치는 독일"
 GER_an_active_germany_desc: "수동성과 미루기의 시대는 끝났습니다. 안정적이고 근면한 독일 시민들은 국가의 보살피고 이끄는 손길의 도움을 받아 건전한 경쟁력을 통해 우리 조국의 세계적 위치를 보장할 것입니다. 활동적인 독일을 위하여!"
 GER_the_constitution_of_germany: "독일 헌법"
 GER_the_constitution_of_germany_desc: "국가의 헌법에는 국가의 기본법이 기록되어 있습니다. 그러나 이는 완벽하지 않을 수 있으며, 우리는 이를 바꾸어 국가를 우리 뜻대로 빚을 수 있습니다."
 GER_rule_out_article_twenty_one: "21조 폐지"
 GER_rule_out_article_twenty_one_desc: "독일 헌법 21조는 잠재적으로 공화국에 위협이 될 수 있는 특정 정당의 성장을 방지하자는 조항입니다. 이는 당연하게도, 민주주의에 위배되는 행위이므로, 폐지되어야 하며 새롭게 대체되어야만 합니다!"
 GER_expand_article_twenty_one: "21조 확대"
 GER_expand_article_twenty_one_desc: "21조는 어떤 특정 정당이 왜 금지되어야 하는지 구체적으로 명시되어 있지 않습니다. 공화국을 보호하기 위해선, 우린 이 조항을 확장해야 합니다."
 GER_will_of_the_people: "민중들의 의지"
 GER_will_of_the_people_desc: "법과 정당을 결정하는 것은 자의적인 헌법이 아니라 국민이어야 합니다. 따라서 모든 정치 단체가 국내에서 자유롭게 활동할 수 있습니다. 이 새로운 변화의 결과로 연방헌법보호청은 폐쇄됩니다."
 GER_will_of_the_republic: "공화국의 의지"
 GER_will_of_the_republic_desc: "연방 공화국은 어떤 대가를 치르더라도 보호되어야 합니다. 불순한 세력이 국가 정치에서 발판을 마련하도록 놔두면 우리와 우리의 자유 및 민주주의 가치가 무너질 것이기 때문입니다!"
 GER_expand_article_twenty: "20조 확대"
 GER_expand_article_twenty_desc: "20 조는 독일은 절대 공화국에서 벗어날 수 없다는 것을 제대로 명시해 놓지 않았습니다. 우리는 이를 최대한 빨리 변경해야만 합니다."
 GER_stronger_federal_state: "강력한 연방 국가"
 GER_stronger_federal_state_desc: "우리는 연방이 강한 만큼만 강할 수 있습니다. 우리는 국가를 중앙집권화하고 어떤 주의 분리 독립도 금지해야 합니다. 특히 일부 [BAY.GetFlag] 바이에른 사람들은 수년째 분리를 시도해 왔으며, 이는 용납할 수 없습니다!"
 GER_rule_out_article_twenty: "20조 폐지"
 GER_rule_out_article_twenty_desc: "우리는 독재가 아닌, 공화국 입니다. 그렇기에 모든 독일 내부의 국가들은 적법한 절차에 따라 그들 스스로의 미래를 결정할 권리가 있습니다."
 GER_decentralized_republic: "'연방' 공화국"
 GER_decentralized_republic_desc: "우리는 연방공화국이므로 자치가 우리의 우선순위가 되어야 합니다. 주와 지역은 민주주의의 틀 안에서 스스로 미래를 결정할 수 있습니다."
 GER_farewell_to_humiliation: "치욕은 더 이상 없다"
 GER_farewell_to_humiliation_desc: "독일 국가는 수십 년 동안 굴욕을 당하고 조롱받아 왔습니다. 이제 우리는 마침내 이에 작별을 고할 수 있으며, 새로운 행정부 아래에서 독일을 그 어느 때보다 강하게 재건할 수 있습니다."
 GER_nuclear_rearmarment: "독일 핵 프로그램"
 GER_nuclear_rearmarment_desc: "누가 우리에게 안 된다고 말할 수 있겠습니까? 우리나라에는 프랑스와 영국처럼 핵 프로그램이 필요합니다. 평화를 유지하기 위한 그토록 중요한 무기의 사용에서 독일만 배제되는 것은 공정하지 않습니다."
 GER_end_of_war_reparations: "배상의 종료"
 GER_end_of_war_reparations_desc: "우리는 수십 년 전 다른 행정부가 저지른 일 때문에 여러 나라에 전쟁 배상금을 지불하는 데 지쳤고 신물이 납니다. 이를 즉시 중단할 것입니다!"
 GER_our_new_legacy: "우리의 새로운 유산"
 GER_our_new_legacy_desc: "독일은 사람들이 군대가 너무 강해지는 것을 두려워하게 만든 낡은 유산에 의해 얼룩져 왔습니다. 우리는 스스로를 새로운 국가로 그려 내고, 따라서 이 끔찍한 특성을 떨쳐내기 위한 새로운 유산을 만들어야 합니다!"
 GER_lufthansa: "주식회사 루프트한자"
 GER_lufthansa_desc: "도이체 루프트한자 AG는 독일 최대의 항공사이며 승객 수송 기준으로 유럽 전체에서 두 번째로 큽니다.\n루프트바페는 루프트한자와 계약을 맺어 루프트바페를 위한 새로운 공군 기지를 건설하도록 하였습니다."
 GER_hensoldt: "주식회사 헨솔트"
 GER_hensoldt_desc: "헨졸트 AG는 국가의 국경과 군대의 감시 및 보호를 위한 새로운 레이더 및 센서 기술을 개발하는 임무를 맡은 항공우주 기업입니다."
 GER_duetches_telekom: "Deutsche Telekom"
 GER_duetches_telekom_desc: "도이체 텔레콤은 매출 기준으로 유럽에서 두 번째로 큰 통신 사업자입니다.\n지역 통신 산업에 자금을 지원함으로써 우리는 국내 네트워크 보안과 시민을 위한 더 빠른 통신 수단을 보장할 수 있습니다."
 GER_defensive_infrastructure: "방어 기반시설"
 GER_defensive_infrastructure_desc: "어쩌면 침략자가 되는 것이 항상 최선의 선택은 아닐지도 모릅니다. 강력한 방어 국가가 되는 것이 더 나은 선택일지도 모릅니다."
 GER_naval_defensive: "해군 기반시설"
 GER_naval_defensive_desc: "발트해 또는 어쩌면 북대서양에서 오는 어떤 종류의 침략도 막기 위해 북부 해안에 해군을 위한 새로운 방어 전초기지를 만들어야 합니다."
 GER_offensive_infrastructure: "공격 기반시설"
 GER_offensive_infrastructure_desc: "전투 준비를 갖추고 설 수 있는데 왜 기다려야 합니까? 공격을 받았을 때 그들이 독일 땅에 오기를 기다리는 쪽이 아니라, 그들의 땅으로 쳐들어가 지옥을 맛보게 해 줄 준비를 하는 쪽이 되어야 합니다!"
 GER_german_irredentism: "독일의 여명"
 GER_german_irredentism_desc: "우리나라는 패배, 굴욕, 그리고 고통을 맛봤습니다. 이 모든 것은, 외세와 우리 주변국들에 의해 좌지우지 되었죠. 그러나, 새로운 독일의 여명이 우리 앞을 기다리고 있으며, 이제 누가 세상의 진정한 주인인지 보여줄 준비가 되었습니다..."
 GER_colonial_spark: "식민지를 수복하라"
 GER_colonial_spark_desc: "우리는 한때 아프리카에 광대하게 뻗은 식민 제국을 보유하고 있었으나, 베르사유 조약의 책임자들의 손에 그것을 잃었습니다. 우리는 이 영역을 되찾고 우리의 권위를 다시 세울 것입니다."
 GER_reclaim_tanzania: "탄자니아 수복"
 GER_reclaim_tanzania_desc: "탄자니아는 독일 시민의 도움 없이는 제대로 지내지 못하고 있으며, 무능한 정부의 손아귀에서 그 나라를 해방할 때가 되었습니다."
 GER_camaroon_invasion: "카메룬 수복"
 GER_camaroon_invasion_desc: "카메룬은 우리 나라의 전문성 없이 서서히 무너지고 있으며, 어쩌면 우리가 이를 바꿀 수 있을지도 모릅니다.."
 GER_namibian_invasion: "나미비아 수복"
 GER_namibian_invasion_desc: "나미비아는 아프리카 남부에서 우리가 통제하던 중요한 지역이었으며, 이곳을 되찾는 것은 우리의 최우선 과제 중 하나가 되어야 합니다."
 GER_congo_invasion: "콩고  수복"
 GER_congo_invasion_desc: "콩고에는 우리가 국가를 위해 사용할 수 있었던 자원이 풍부했는데, 왜 되돌아가서는 안 됩니까? 21세기에는 모든 국가의 신속한 현대화가 필요할 것이며, 현대화하려면 자원이 필요합니다. 우리가 그 자원을 통제하면 세계가 우리에게 의존하게 만들 수 있습니다!"
 GER_togo_invasion: "토고 수복"
 GER_togo_invasion_desc: "토고는 보기에는 작을지 몰라도, 우리가 다시 차지하는 데 성공한다면 서아프리카에서 상당히 중요한 보유지가 될 것입니다."
 GER_new_guinea: "뉴기니 수복"
 GER_new_guinea_desc: "파푸아뉴기니는 혼란 상태에 있으며 이웃 나라 인도네시아로부터 끊임없는 괴롭힘을 받고 있습니다. 파푸아뉴기니를 되찾음으로써 우리는 오세아니아에서 통제력을 다시 확립할 수 있습니다."
 GER_demand_american_islands: "아메리카 제도 요구"
 GER_demand_american_islands_desc: "미국이 동남아시아의 그 모든 섬을 보유할 무슨 권리가 있습니까? 우리는 그들을 위협하여 그 섬들의 통제권을 우리에게 넘기게 할 수 있습니다."
 GER_demand_micronesia: "미크로네시아의 권위"
 GER_demand_micronesia_desc: "미크로네시아에는 질서가 거의 없어 보이며, 우리가 이 지역에 대한 통제권을 행사하면 아마 이를 바로잡을 수 있을 것입니다."
 GER_german_europe: "독일령 유럽"
 GER_german_europe_desc: "독일은 역사 내내 그러했듯 유럽 전체에 대한 권위를 확립해야 하며, 또 그럴 것입니다. 우리가 우위를 회복하지 못하면 다른 나라들이 우리를 자신들의 속국으로 만들 것입니다."
 GER_czech_invasion: "체코 침략"
 GER_czech_invasion_desc: "체코 공화국은 슬로바키아가 분리된 이후 만들어졌으며, 그 후로 줄곧 경제적인 면을 제외한 모든 면에서 약하고 가난한 나라였습니다."
 GER_polish_invasion: "폴란드를 향한 최후의 일격"
 GER_polish_invasion_desc: "무슨 일이 있어도 폴란드는 언제나 되살아났습니다. 더 이상 그렇게 되지 않도록 해야 하며, 폴란드는 영원히 짓밟힐 것입니다."
 GER_danish_invasion: "6시간 만에"
 GER_danish_invasion_desc: "제3제국이 덴마크 전체를 침공하는 데 6시간이 걸렸다는 것은 믿기 어려운 일입니다. 어쩌면 우리는 그 기록을 넘어 훨씬 짧은 시간에 해낼 수 있을지도 모릅니다.."
 GER_french_invasion: "다시 한번 프랑스는 항복하리"
 GER_french_invasion_desc: "프랑스인은 두 차례의 세계 대전 모두에서 항복한 것으로 악명이 높습니다. 이는 오직 한 가지를 의미하는데, 그들이 아마 다시 그럴 것이라는 점입니다. 우리는 파리로 군대를 진격시킬 것이며, 그 과정에서 최소한의 저항만 맞닥뜨릴 것입니다!"
 GER_cooperate_with_ukraine: "우크라이나와의 협력"
 GER_cooperate_with_ukraine_desc: "우크라이나는 러시아 정권을 무너뜨리는 데 있어 중요한 동맹이 될 것입니다. 그들과 접촉함으로써 우리는 러시아 국가에 대항하는 집결지를 마련할 수 있습니다."
 GER_no_deals: "협상은 없다"
 GER_no_deals_desc: "러시아 정권을 무너뜨릴 수 있다 하더라도 우리는 유럽의 그 누구와도 거래해서는 안 됩니다. 우리는 힘으로 우크라이나로 진격하고, 이어 러시아로 진격할 것입니다!"
 GER_russian_invasion: "러시아 평정"
 GER_russian_invasion_desc: "러시아의 그 테러리스트들은 세계 대부분을 윽박질러 자기들 뜻대로 움직이게 해 왔습니다. 누군가 그들에게 맞서 영원히 파괴해야 할 때입니다."
 GER_british_invasion: "왕국을 분쇄하라"
 GER_british_invasion_desc: "영국인은 지금까지 존재했던 모든 지역, 사안, 분쟁에 코를 들이밀어 왔습니다. 그들의 작은 왕국을 박살 내고 누가 진정으로 바다를 지배하는지 보여 줄 때입니다."
 GER_canadian_coup: "북으로의 기습"
 GER_canadian_coup_desc: "북쪽에서 캐나다를 기습 침공하면, 전쟁의 때가 왔을 때 이를 미국에 대항하는 집결지로 활용할 수 있습니다."
 GER_strike_the_eagle: "독수리를 사냥해라"
 GER_strike_the_eagle_desc: "미국은 마침내 우리 나라와 다른 많은 나라에 한 짓에 대한 대가를 치르게 될 것입니다. 현재의 세계 질서가 미국 중심에서 독일 중심으로 바뀔 때입니다."
 GER_contact_mexico: "멕시코와 접촉"
 GER_contact_mexico_desc: "역사상 두 번째로 멕시코에 연락하여 미국에 대한 공격을 감행할 의향이 있는지 물어볼 수 있습니다. 그들이 동의한다면 우리는 남쪽에서 공격하여 귀중한 동맹과 함께 미국의 나머지를 정복할 수 있습니다!"
 GER_chinese_menace: "중국의 용을 참수시켜라"
 GER_chinese_menace_desc: "중국인은 세계의 다음 강대국이 되려고 너무 무리하게 애써 왔습니다. 우리는 그들의 작은 시도를 일찌감치 끝장내고, 바로 그 자리에서 중국의 용을 죽일 수 있습니다."
 GER_austrian_invasion: "오스트리아 확보"
 GER_austrian_invasion_desc: "오스트리아는 우리의 새로운 야망에서 중요한 목표가 될 것이며, 우리를 겨냥한 잠재적 침공에 대비해 남쪽의 방벽 역할을 하는 데 유용할 것입니다."
 GER_belgian_invasion: "벨기에 해체"
 GER_belgian_invasion_desc: "현실적으로 벨기에는 국가가 아닙니다. 국경 안에는 독일인을 포함한 여러 민족 집단이 있습니다. 이른바 이 국가를 없앰으로써 우리는 마침내 동포들을 고향으로 데려올 수 있습니다."
 GER_german_war_machine: "독일 워머신 (War Machine)"
 GER_german_war_machine_desc: "독일의 전쟁 기계가 다시 한번 깨어났으며, 이제 최대 가동 준비가 되었습니다!"
 GER_our_agents_everywhere: "모든 곳에 우리의 손이"
 GER_our_agents_everywhere_desc: "유럽 전역에 첩보원을 흩뿌림으로써 우리는 친독일 정서를 퍼뜨리고 독일의 점령에 저항하려는 자들의 의지를 꺾을 수 있습니다."
 GER_militarized_riot_police: "기동대 무장"
 GER_militarized_riot_police_desc: "진압 경찰에 군용 장비를 지급함으로써 우리는 국가에서 더 불안한 지역의 반대와 무질서를 분쇄할 수 있습니다."
 GER_we_are_all_germans: "우리는 모두 독일인이다"
 GER_we_are_all_germans_desc: "민족과 상관없이 자신이 독일인이라고 믿게 만들면, 그들은 우리 체제와 정부에 맞서 싸우려는 마음이 덜 들 것입니다."
 GER_stray_from_the_republic: "공화국으로부터 벗어나라"
 GER_stray_from_the_republic_desc: "공화국은 과거의 기억이 될 것이며, 그 실패와 결함은 내일의 희생양이 될 것입니다."
 GER_make_imperial_for_invite: "§gWe will get the ability to invite§! §R[TUR.GetNameWithFlag]§! §gand / or§! §7[ITA.GetNameWithFlag]§! §gif they are§! §YMonarchists§!§g. We will also be able to invite more§! §3European§! §gcountries that are Monarchists.§!"
 GER_bundeswehr_recovery_progbar_tt: "§Y연방방위군 복원 진행도§!: §G[?bundeswehr_recovery_status]§!"
 GER_add_5_bundes_reform: "§H연방방위군 개혁§!을 §H5%§! 증가시킵니다"
 GER_add_10_bundes_reform: "§H연방방위군 개혁§!을 §H10%§! 증가시킵니다"
 GER_idea_east_german_debuff1: "동독의 분노"
 GER_idea_east_german_debuff1_desc: "동독인들은 생활 여건에 몹시 분노하고 있으며, 이제 우리의 이익에 반하여 행동하고 있습니다..\n§W--------------§!\n이 국가 정신은 동독인의 관계를 §G개선§!하거나 생활 수준을 높이면 §R제거§!될 수 있습니다."
 GER_unlock_Network_Infrastructure_decision_TT: "£decision_icon_small  '§H디지털 시대§!' 디시전을 해금합니다"
 GER_F35_airframe: "F35 기체"
 GER_F35_stealth: "F35 스텔스"
 GER_F35_weapons: "F35 무기"
 GER_Tra: "수송기 (TRA)"
 GER_no_nuclear: "핵 금지"
 GER_meet_with_lutte_ouvriere: "‘노동자 투쟁’과의 회담"
 GER_meet_with_lutte_ouvriere_desc: "우리는 프랑스의 사회주의 동맹인 노동자 투쟁(Lutte Ouvrière)과 만날 것입니다. 우리는 두 정당의 향후 진로, 관계 개선, 유대 강화에 관해 좋은 대화를 나누었습니다."
 GER_how_to_overthrow_TT: "§C공화국§!§R을 전복시키기 위해선, 우리는 자금 수준을§! §H‘매우 낮음’§! §R단계로 격하시켜§! §Y연방헌법수호청§!§R의§! §Y좌익§! §R또는§! §Y우익§! §R부서의 지원금을 삭감하고, 두 부서가 붕괴될 때 까지 기다리면 됩니다!§!"
 GER_skip_last_payment_TT: "[ROOT.GetNameWithFlag] §Y측은 마지막 전쟁 배상금을 지불하지 §R않을§! 것이며 미래에도 지불하지 §R않을§! 것입니다!§!"
 germany_focus: "독일 국가 중점 트리"
 GER_BWB: "연방 방위 기술 및 거리청"
 GER_BWB_desc: "연방 방위 기술 및 조달청(BWB)은 독일 Koblenz에 위치한 연방군(Bundeswehr) 행정의 기관이었습니다. 이 기관은 독일 국방부의 주요 무기 부서에 속해 있었습니다. BWB는 모든 종류의 군사 장비의 개발, 시험, 조달을 담당했으며, 군사 장비의 수정, 군사 기술 표준화, 품질 보증 및 시험을 수행하는 역할을 맡고 있었습니다."
 GER_Shipyards: "Modernize Shipyards"
 GER_Shipyards_desc: "To support the construction and maintenance of a modern naval fleet, the Bundeswehr is investing in the modernization of its shipyards. This includes upgrading facilities at key locations such as Kiel and Hamburg, where the latest naval vessels will be constructed and overhauled. The initiative focuses on integrating advanced production technologies, improving efficiency, and ensuring the capability to build and maintain the next generation of frigates, submarines, and support ships. By modernizing its shipyards, the Bundeswehr ensures that its naval forces will have the most advanced and reliable vessels available."
 GER_Blohm_and_Voss: "Blohm & Voss Collaboration"
 GER_Blohm_and_Voss_desc: "In collaboration with the renowned shipbuilding company Blohm & Voss, the Bundeswehr is advancing the development of its naval fleet. Known for its expertise in constructing cutting-edge naval vessels, Blohm & Voss will play a crucial role in the design and production of new frigates and corvettes. This partnership leverages the company's decades of experience and innovative capabilities to ensure that the Bundeswehr's ships meet the highest standards of performance, durability, and technological sophistication."
 GER_ThyssenKrupp_Marinesystem: "ThyssenKrupp Marine Systems Collaboration"
 GER_ThyssenKrupp_Marinesystem_desc: "ThyssenKrupp Marine Systems (TKMS), a leader in submarine technology, is a key partner in the Bundeswehr's efforts to modernize its underwater fleet. This collaboration focuses on developing advanced submarines equipped with state-of-the-art stealth technology, improved propulsion systems, and enhanced weaponry. The TKMS partnership ensures that the Bundeswehr's submarine force remains at the forefront of naval warfare, capable of conducting a wide range of missions from strategic deterrence to special operations."
 GER_HDW: "Howaldtswerke-Deutsche Werft (HDW) Collaboration"
 GER_HDW_desc: "Howaldtswerke-Deutsche Werft (HDW), another vital partner in Germany's naval defense industry, is collaborating with the Bundeswehr to develop and maintain its fleet of submarines and surface vessels. Located in Kiel, HDW is renowned for its expertise in shipbuilding, particularly in producing advanced submarines. This collaboration will focus on enhancing the design, construction, and maintenance of the Bundeswehr's naval assets, ensuring that they are equipped with the latest technologies and capabilities to meet modern defense challenges."
 Renovate_the_fleet: "함대 개조"
 Renovate_the_fleet_desc: "우리는 냉전 시대가 끝났기 때문에 함대를 개조해야 합니다. 이제 우리는 새로운, 알 수 없는 위협에 직면해 있습니다. 우리의 해군 능력을 업데이트하는 것은 진화하는 안보 환경에 대응하고 잠재적인 도전에 대비하기 위해 필수적입니다. 함대를 현대화하는 것은 기존 선박에 첨단 기술을 업그레이드하고, 향상된 능력을 가진 새로운 선박을 도입하며, 우리의 해양 군이 다양하고 예측할 수 없는 위협에 대응할 수 있도록 준비하는 과정입니다. 이러한 선제적인 접근은 국가 안보를 유지하고, 예측할 수 없는 글로벌 환경에서 우리의 이익을 보호하는 데 중요합니다."
 GER_New_Minesweepers: "새로운 소해 장비"
 GER_New_Minesweepers_desc: "우리는 해군 능력을 최상 상태로 유지하기 위해 새로운 기뢰처리정을 필요로 합니다. 이러한 첨단 선박을 획득하는 것은 우리의 해양 작전의 안전성과 효율성을 보장하는 데 필수적입니다. 기뢰처리정은 해상 기뢰를 탐지하고 무력화하는 중요한 역할을 하여, 우리의 함대를 보호하고 전략적인 해로를 확보합니다. 현대적인 기뢰처리정에 투자함으로써, 우리는 해군력을 보호하고 국제적인 임무를 지원하며 항행의 자유를 수호할 수 있는 능력을 강화합니다."
 GER_New_Fregattes: "신형 호위함"
 GER_New_Fregattes_desc: "As part of its naval modernization efforts, the Bundeswehr is investing in the development and acquisition of new frigates. These vessels, such as the F125-class, are designed to provide enhanced capabilities in anti-submarine warfare, air defense, and surface combat. The new frigates will feature state-of-the-art sensors, weapons systems, and command and control technologies, ensuring they can operate effectively in a variety of mission profiles. The acquisition of these frigates is crucial for maintaining Germany's maritime security and ensuring that the Deutsche Marine can project power globally."
 GER_New_Corvettes: "신형 초계함"
 GER_New_Corvettes_desc: "The Bundeswehr is expanding its naval capabilities with the introduction of new corvettes, such as the Braunschweig-class (K130). These vessels are designed for coastal defense and open-sea operations, offering advanced stealth features, enhanced firepower, and superior maneuverability. The corvettes will play a vital role in patrolling Germany's coastal waters, as well as supporting international missions in contested maritime environments. This investment in new corvettes is part of a broader effort to ensure that the Deutsche Marine remains a versatile and effective force in the 21st century."
 GER_New_Submarines: "신형 잠수함"
 GER_New_Submarines_desc: "To enhance its underwater warfare capabilities, the Bundeswehr is acquiring new submarines, including the Type 212A class. These submarines are equipped with air-independent propulsion (AIP) systems, allowing them to operate submerged for extended periods with minimal acoustic signature. The new submarines will be critical for maintaining Germany's strategic deterrence and conducting covert reconnaissance and special operations. The acquisition of these advanced submarines reflects Germany's commitment to maintaining a robust and capable naval force capable of operating in the most challenging environments."
 GER_Rheinmetall_: "Rheinmetall Collaboration"
 GER_Rheinmetall__desc: "Rheinmetall, a cornerstone of Germany's defense industry, continues to be a pivotal partner in the Bundeswehr's modernization efforts. This collaboration focuses on developing cutting-edge technologies across various domains, including armored vehicles, artillery systems, and advanced munitions. Projects like the upgrade of the Leopard 2 main battle tank and the development of the Puma IFV showcase Rheinmetall's expertise. Under the guidance of figures such as Armin Papperger, Rheinmetall is instrumental in ensuring that the Bundeswehr remains equipped with world-class military technology, capable of meeting the demands of contemporary warfare."
 GER_KMW_: "Krauss-Maffei Wegmann Collaboration"
 GER_KMW__desc: "Krauss-Maffei Wegmann (KMW) has been a long-standing partner in the development of the Bundeswehr's armored forces. This collaboration focuses on advancing the design and production of cutting-edge armored vehicles, including the Leopard 2 and the Puma IFV. KMW's expertise in vehicle manufacturing ensures that the Bundeswehr's armored units are equipped with the most advanced and reliable platforms. The ongoing partnership with KMW is crucial for maintaining Germany's armored capabilities and ensuring that the Bundeswehr can operate effectively in diverse combat environments."
 GER_Update_Leopard_Tank: "레오파르트 2 업그레이드"
 GER_Update_Leopard_Tank_desc: "레오파르드 2는 여전히 업그레이드할 수 있지만, 문제는 그것이 얼마나 더 지속될 수 있느냐는 것입니다. 우리는 이 전차를 한 번 더 업그레이드할 계획이지만, 그 후속 전차를 위한 새로운 프로젝트를 시작하는 것이 필수적입니다. 레오파르드 2는 여전히 강력하고 신뢰할 수 있는 플랫폼이지만, 기술의 지속적인 발전과 변화하는 전장 요구 사항을 고려할 때, 차세대 주력 전차 개발을 위한 준비가 필요합니다. 이 새로운 프로젝트는 장갑, 기동성, 화력 및 전자 시스템 분야의 최첨단 혁신을 통합해야 하며, 이를 통해 우리의 장갑 부대가 군사 능력의 최전선에 남을 수 있도록 해야 합니다. 지금 이 개발을 적극적으로 시작하는 것은 원활한 전환을 보장하고, 우리의 전략적 우위를 유지하는 데 중요합니다."
 GER_Main_Ground_Combat_System: "주요 지상 전투 시스템(MGCS)"
 GER_Main_Ground_Combat_System_desc: "MGCS(Main Ground Combat System)는 독일과 프랑스 간의 협력 프로젝트로, 두 나라의 장갑 부대의 중추가 될 새로운 주력 전차를 공동으로 설계, 개발 및 생산하는 것을 목표로 합니다. 이 프로젝트는 독일과 프랑스의 주요 방위 산업 회사들이 협력하는 형태로 진행되며, 크라우스-마페이 베그만(KMW), 넥스터 시스템(Nexter Systems), 라인메탈(Rheinmetall)과 같은 회사들이 MGCS의 개발 및 생산에서 중요한 역할을 할 것으로 예상됩니다."
 GER_Panther: "KF51 판터"
 GER_Panther_desc: "The KF51 is based on the hull of the Leopard 2A4, but with a new turret mounting an autoloaded 130 mm calibre main gun. The tank is designed to increase the lethality, mobility, survivability, and networking capabilities of MBTs without incurring a significant increase in weight. The tank has a crew of 3-4 members, each of whom can hand over and take over tasks and roles from others with no reduction of functionality. Its main armament is a Rh-130 L/52 130 mm smoothbore gun, and it also has a 12.7 mm coaxial machine gun and a 7.62 mm NATTER RCWS."
 GER_Reform_Fuhrungsakademie: "Reform the Führungsakademie"
 GER_Reform_Fuhrungsakademie_desc: "Recognizing the need for a modern approach to military leadership, the Bundeswehr is reforming the Führungsakademie der Bundeswehr in Hamburg. This initiative focuses on updating the curriculum to reflect contemporary military challenges, integrating new training methodologies, and enhancing the academy's role in preparing future leaders. The reforms are designed to ensure that Germany's military leaders are equipped with the latest strategic, operational, and ethical knowledge. This effort is supported by prominent military figures and defense experts, who are working to align the academy's programs with the Bundeswehr's evolving needs."
 GER_Reform_Zentrum_innere_Fuhrung: "Reform the Zentrum Innere Führung"
 GER_Reform_Zentrum_innere_Fuhrung_desc: "As part of its commitment to maintaining high ethical standards and strong leadership within the ranks, the Bundeswehr is reforming the Zentrum Innere Führung. This reform aims to modernize the institution's approach to leadership training, focusing on ethical decision-making, internal cohesion, and the moral development of soldiers. The Zentrum, located in Koblenz, plays a crucial role in shaping the Bundeswehr's internal culture and values. The reform is driven by the need to adapt to the changing nature of military service in the 21st century, ensuring that German soldiers are well-prepared for the ethical challenges of modern warfare."
 GER_Reform_Heeresamt: "육군청 개혁"
 GER_Reform_Heeresamt_desc: "The Heeresamt, located in Cologne, is undergoing significant reforms to enhance its efficiency and effectiveness. This initiative focuses on streamlining administrative processes, improving support capabilities, and modernizing the office's structure to better serve the operational needs of the Bundeswehr. The reforms are intended to ensure that the Heeresamt can provide timely and effective support to Germany's ground forces, enabling them to meet the demands of modern military operations. This effort is part of a broader strategy to ensure that the Bundeswehr remains a capable and agile force in a rapidly changing global security environment."
 GER_invest_in_Universitat_der_Bundeswehr_Hamburg: "독일 연방군 함부르크 대학교 개혁"
 GER_invest_in_Universitat_der_Bundeswehr_Hamburg_desc: "Universität der Bundeswehr Hamburg(독일 연방군 함부르크 대학교)는 독일 연방군의 두 개 대학 중 하나로, 1973년에 설립되었습니다. 이 대학은 뮌헨에 있는 또 다른 대학과 유사하게, 독일 연방군의 장교와 장교 후보자들에게 학문적 교육과 훈련을 제공하기 위해 설립되었습니다. 이 대학은 군사 교육과 일반 교육을 통합하여, 학생들에게 현대적인 군사적 전문 지식과 학문적 기반을 제공하며, 독일 군의 미래 리더들을 위한 교육의 중심 역할을 합니다."
 GER_focus_artillerie_schule: "Focus on Artillerie Schule"
 GER_focus_artillerie_schule_desc: "The Bundeswehr is enhancing its Artillerie Schule, located in Idar-Oberstein, to ensure that it remains the premier institution for artillery training. This initiative involves upgrading training facilities, incorporating the latest artillery systems like the Panzerhaubitze 2000, and developing new curricula that reflect modern combat scenarios. The goal is to produce artillery units that are proficient in the use of advanced technology and capable of delivering decisive firepower in support of ground operations. This focus on the Artillerie Schule is crucial for maintaining the effectiveness of Germany's artillery forces."
 GER_focus_Panzertruppenschule: "Focus on Panzertruppenschule"
 GER_focus_Panzertruppenschule_desc: "The Panzertruppenschule in Munster is the heart of the Bundeswehr's armored warfare training. The Bundeswehr is intensifying its focus on this institution to ensure that its armored forces are well-prepared for the demands of modern combat. This initiative includes the modernization of training programs, the integration of advanced simulators, and the use of the latest armored vehicles, such as the Leopard 2A6. The Panzertruppenschule plays a pivotal role in shaping the capabilities of Germany's armored units, making this focus essential for maintaining the Bundeswehr's combat readiness."
 GER_focus_Infanterie_Schule: "Focus on Infanterie Schule"
 GER_focus_Infanterie_Schule_desc: "The Bundeswehr is dedicating significant resources to enhancing its Infanterie Schule in Hammelburg. This initiative aims to modernize infantry training programs, incorporating lessons learned from recent conflicts and the latest tactical innovations. The Infanterie Schule will see upgrades to its training facilities, including new ranges and urban warfare environments, to better prepare soldiers for the complexities of modern combat. By focusing on the Infanterie Schule, the Bundeswehr ensures that its infantry forces are well-equipped and ready to face any challenge on the battlefield."
 GER_European_Anker_Army: "유럽 앵커 군대 형성"
 GER_European_Anker_Army_desc: "독일연방군는 동맹국들의 군대의 앵커 역할을 수행하고, 훈련과 지도력에서 더 긴밀한 협력을 촉진하여 공동 작전에서 원활한 상호 운용성과 효과성을 보장하는 것을 목표로 합니다. 이러한 분야에서 협력을 강화하는 것은 공동의 안보 과제에 신속하고 단호하게 대응할 수 있는 능력을 증대시키는 데 필수적입니다. 공동 훈련, 모범 사례 교환, 지도력 개발 프로그램에 대한 노력을 강화함으로써, 우리는 동맹군 간의 협조, 커뮤니케이션 및 신뢰를 향상시킬 수 있습니다. 이는 위기 상황에서 원활하고 효과적으로 협력할 수 있게 해 주며, 연대감을 강화하고 우리의 공동 안보 태세를 강화하는 데 기여할 것입니다."
 GER_Reform_Light_forces: "우리의 경부대에 집중하자"
 GER_Reform_Light_forces_desc: "기동성, 유연성, 경제성은 전장에서 승리를 거두는 데 중요한 요소입니다. 이러한 장점의 중요성을 과소평가하지 말고, 오히려 이를 적극적으로 활용하여 경쟁 우위를 유지하는 것이 중요합니다. 기동성을 우선시함으로써 변화하는 상황에 빠르게 적응하고, 적을 제치고 기습할 수 있습니다. 유연성은 특정 상황에 맞는 다양한 전술과 전략을 활용할 수 있게 하여, 다양한 작전 환경에서 효과성을 극대화합니다. 또한, 경제성은 군사 능력을 장기적으로 유지할 수 있도록 보장하며, 자원을 과도하게 소모하지 않고 준비 태세를 유지할 수 있게 합니다.\n이러한 장점을 활용함으로써, 우리는 군사 효과성을 최적화하고, 작전 효율성을 향상시키며, 진화하는 위협에 대응할 수 있는 회복력을 강화할 수 있습니다. 이 강점을 효과적으로 활용하기 위해서는 지속적으로 혁신하고, 우리의 접근 방식을 조정하여 모든 군사 작전에서 기동성, 유연성, 경제성을 유지하는 것이 필수적입니다."
 GER_introduce_Medium_Forces: "중간 지점 찾기"
 GER_introduce_Medium_Forces_desc: "정확히 말합니다. 중장비와 경장비의 균형을 맞추는 것은 군의 효과성과 다용성을 보장하는 데 매우 중요합니다. 중장비 부대는 지속적인 작전과 전통적인 전투 상황에서 필요한 화력, 보호력, 내구성을 제공합니다. 반면, 경장비 부대는 기동성, 속도, 유연성을 제공하여 빠른 배치, 기동성, 동적이고 비대칭적인 환경에서의 적응력을 가능하게 합니다.\n중장비와 경장비 요소를 군 구조에 통합함으로써 우리는 각각의 강점을 활용하여 상호 보완하며, 다양한 작전 요구 사항을 포괄할 수 있습니다. 이 접근 방식은 특정 임무와 위협에 맞게 부대를 조정할 수 있게 해 주며, 목표를 달성하는 능력을 극대화하면서 취약성을 최소화할 수 있습니다. 이러한 균형을 맞추는 것은 고강도 전투부터 평화유지 작전, 인도적 지원 임무까지 다양한 도전에 효과적으로 대응할 수 있는 능력을 보장합니다."
 GER_Reform_Heavy_Forces: "우리의 중장비 부대에 집중"
 GER_Reform_Heavy_Forces_desc: "맞습니다. 중장비 부대는 방어에서 중요한 역할을 하며, 그들은 지면을 고수하고 적의 진격을 효과적으로 저지할 수 있는 화력, 보호력, 내구성을 갖추고 있습니다. 전차, 포병, 기계화 보병을 장비한 중장비 부대를 배치함으로써 우리는 강력한 방어선을 구축하고 잠재적인 적의 공격을 억제할 수 있습니다. 이러한 부대는 지속적인 전투 작전에서 매우 적합하며, 침입에 대한 강력한 억제력을 제공하고 우리의 영토 경계를 보호하는 데 중요한 역할을 합니다.\n또한, 중장비 부대의 존재는 지역 안보에서 안정적인 요인으로 작용하며, 우리의 동맹국들에게 안도감을 주고 잠재적인 위협을 억제하는 역할을 합니다. 그러나 방어에서 종합적인 접근 방식을 유지하는 것이 중요하며, 경장비 부대, 공중 지원, 정보, 물류 등 다른 요소들도 포함되어야 합니다. 이러한 구성 요소들을 통합함으로써 우리는 다양한 위협에 대해 최대한 효과적이고 회복력 있는 방어 태세를 구축할 수 있습니다."
 GER_Weltraumkommando_der_Bundeswehr: "연방방위군 우주사령부 창설"
 GER_Weltraumkommando_der_Bundeswehr_desc: "현대전에서 우주의 중요성이 커지고 있음을 인식하여 연방방위군은 전담 우주사령부를 창설하고 있습니다. 이 신설 사령부는 위성 감시, 우주 기반 통신, 미사일 방어 체계를 포함한 우주와 관련된 모든 군사 작전을 감독할 것입니다. 연방방위군 우주사령부는 독일이 우주 안보의 선두 주자로 남아, 궤도상의 이익을 지키고 마지막 개척지에서 떠오르는 위협에 대응할 수 있도록 보장할 것입니다."
 GER_V_fall_Decision: "국방 사태(Der Verteidigungsfall)"
 GER_V_fall_Decision_desc: "\n£GER_desc_V_Fall\n\n\n\n국방 사태는 독일이 주권 또는 영토 보전에 대한 직접적이고 심각한 위협에 직면했을 때 발동되는 국가 방위 상태의 선포입니다. 이는 연방 정부에 모든 군사력의 동원, 핵심 민간 부문에 대한 통제, 일부 시민 자유의 제한을 포함한 특별한 권한을 부여합니다. 이 조치는 위기 시 국가를 보호하기 위해 군사 자원과 민간 자원을 신속히 조율할 수 있도록 보장합니다."
 GER_fortifications_I: "슐레스비히-홀슈타인 요새 재건"
 GER_fortifications_II: "니더작센 요새 재건"
 GER_fortifications_III: "헤센과 바이에른 요새 재건"
 GER_Army: "군에 대한 공포증"
 GER_Army_desc: "우리 국민은 두 차례의 세계 대전의 결과로 오랫동안 군대에 대한 공포증을 갖고 있었습니다.\n§Y시민 여론§!: [?ROOT.Citizens_opinion]% \n§Y군 여론§!: [?ROOT.Army_opinion]%"
 GER_Officer_Training_Decisions: "독일군 지휘참모대학교"
 GER_Officer_Training_Decisions_desc: "\n£GER_Offiziersschule\n\n\n\n\nThe Führungsakademie der Bundeswehr (Federal Armed Forces Command and Staff College) serves as the General Staff College of the German Armed Forces. It operates in collaboration with the GIDS (German Institute for Defence and Strategic Thinking), a think tank associated with the German Armed Forces. This partnership enhances the exchange of knowledge and expertise, fostering a dynamic environment for strategic analysis and military leadership development within the German defense framework."
 germany.513.t: "[FROM.GetName]에 MEKO 호위함 판매"
 germany.513.d: "우리 조선소는 노동자들에게 임금을 지급하기 위해 함선을 생산해야 하므로, 일부를 수출할 필요가 있습니다."
 germany.513.a: "앤잭급을 판매한다"
 germany.513.b: "빅토리급을 판매한다"
