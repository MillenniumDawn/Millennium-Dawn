 stealth_destroyer_1: "2015년형 스텔스 구축함"
 stealth_destroyer_1_desc: "현대 전쟁 기술의 변화로 인해 더 선진적인 함대들은 함대의 생존성을 위한 새로운 해답을 모색하게 되었습니다. 스텔스 구축함이 그 최우선 과제로 떠올랐습니다. 적의 첨단 센서와 레이더에 탐지되지 않는다는 것은 이 강력한 무기가 더 가까이, 더 빠르게, 더 높은 살상력으로 타격할 수 있다는 뜻이며, 현대 분쟁에서의 생존성 향상이라는 부가적인 이점도 얻게 됩니다."
 stealth_destroyer_2: "2030년형 스텔스 구축함"
 stealth_destroyer_2_desc: "현대 전쟁 기술의 변화로 인해 더 선진적인 함대들은 함대의 생존성을 위한 새로운 해답을 모색하게 되었습니다. 스텔스 구축함이 그 최우선 과제로 떠올랐습니다. 적의 첨단 센서와 레이더에 탐지되지 않는다는 것은 이 강력한 무기가 더 가까이, 더 빠르게, 더 높은 살상력으로 타격할 수 있다는 뜻이며, 현대 분쟁에서의 생존성 향상이라는 부가적인 이점도 얻게 됩니다."
 stealth_destroyer_3: "2045년형 스텔스 구축함"
 stealth_destroyer_3_desc: "현대 전쟁 기술의 변화로 인해 더 선진적인 함대들은 함대의 생존성을 위한 새로운 해답을 모색하게 되었습니다. 스텔스 구축함이 그 최우선 과제로 떠올랐습니다. 적의 첨단 센서와 레이더에 탐지되지 않는다는 것은 이 강력한 무기가 더 가까이, 더 빠르게, 더 높은 살상력으로 타격할 수 있다는 뜻이며, 현대 분쟁에서의 생존성 향상이라는 부가적인 이점도 얻게 됩니다."
 battleship_hull_1: "1965년형 전함 선체"
 battleship_hull_1_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
 battle_cruiser_hull_1: "1965년형 순양전함 선체"
 battle_cruiser_hull_1_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
