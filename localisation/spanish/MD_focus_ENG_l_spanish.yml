 ENG_the_inner_circle_dm: "El Círculo Íntimo"
 ENG_the_inner_circle_dm_desc: "El Círculo Íntimo de la Reina reúne a la casa real y a las figuras más confiables de [ENG.GetNameDef], leales en defender la autoridad de la reina $ENG_elizabeth_queen$ y proteger los intereses de la Corona. Unidos por el deber y el prestigio, compiten por la proximidad, los nombramientos y la confianza de la soberana, sabiendo que la influencia en la corte puede moldear la política mucho más allá de la vista del público. Sus manos alcanzan decisiones militares, industriales y políticas por igual, dirigiendo a Gran Bretaña a través del patronazgo, el acceso y la dirección discreta."
