 ENG_productivity_gap_mission_desc: "수년간 기반 시설, 교육 및 기타 핵심 서비스에 대한 투자가 부족했던 탓에 성장이 정체되는 악순환이 이어지고 있습니다. 경제는 계속 성장하고 있지만, 젊은 세대와 취업 노동자들은 임금이 줄고 해마다 그 구매력이 떨어지는 것을 겪고 있습니다. 경제 부흥에 투자하면 이러한 흐름을 되돌리는 데 도움이 되기 시작할 수 있습니다.\n§W--------------§!\n§Y$ENG_closing_britains_productivity_gap$§! 중점을 완료하면 이 임무는 §R제거§!됩니다."
