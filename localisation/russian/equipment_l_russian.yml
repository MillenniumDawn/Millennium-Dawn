 GRE_infantry_weapons_5_desc: "Карабин M4 — более короткий и лёгкий вариант штурмовой винтовки M16. M4 — магазинный карабин под патрон 5,56x45 мм НАТО с воздушным охлаждением и газоотводной автоматикой с прямым воздействием пороховых газов на затворную раму. Он имеет ствол длиной 14,5 дюйма (370 мм) и телескопический приклад."
 ISR_infantry_weapons_3_desc: "Разработка винтовки M16A2 была первоначально запрошена Корпусом морской пехоты США по итогам боевого опыта во Вьетнаме с XM16E1 и M16A1. Она была официально принята на вооружение Министерством обороны под обозначением «Винтовка США калибра 5,56 мм, M16A2» в 1982 году. Морская пехота стала первым видом Вооружённых сил США, принявшим её на вооружение, в начале/середине 1980-х годов, а Армия США последовала её примеру в конце 1980-х."
 KOR_infantry_weapons_1_desc: "Винтовка M14, официально именуемая американской винтовкой калибра 7,62 мм, M14, — это американская автоматическая винтовка, использующая патроны 7,62x51 мм НАТО (.308 дюйма). Она стала стандартной винтовкой армии США в 1959 году, заменив винтовку M1 Garand в армии США к 1961 году."
 KOR_infantry_weapons_2_desc: "Винтовка M16, официально обозначаемая «Rifle, калибр 5,56 мм, M16», представляет собой семейство армейских винтовок, созданных на основе винтовки ArmaLite AR-15 для Вооружённых сил США. Оригинальная винтовка M16 представляла собой автоматическую винтовку калибра 5,56 мм с магазином на 20 патронов."
 NKO_infantry_weapons_6_desc: "АК-12 — новый российский автомат. Он был разработан в рамках программы экипировки солдата будущего «Ратник». Созданный для специализированных подразделений, он должен заменить производство АК-103. АК-12 имеет улучшенный баланс и эргономику, что делает его самым элитным российским автоматом на сегодняшний день."
