 libya_order_of_jihad_NAME: "리비아 지하드 기사단"
 libya_order_of_jihad_DESC: "리비아 복지 증진에 기여한 자에게 수여됩니다. 리비아로서 1인당 GDP를 5만 달러 이상으로 만드세요.\n\n\\"리비아가 회복되면 UAE의 마천루들은 비둘기 둥지가 될 것이다.\\"\n\n- 칼리드 알 마스리"
 libya_order_of_grand_conqueror_NAME: "리비아 대정복자 훈장"
 libya_order_of_grand_conqueror_DESC: "방문 외빈에게 수여됩니다. 초강대국 또는 강대국과 동맹을 맺으세요.\n\n\\"우리는 기름을 유지해야만 리비아에 관심이 있다. 기름을 유지하지 않으면 관심 없다.\\"\n\n- 도날드 트럼프"
 libya_medal_of_merit_NAME: "리비아 군사 공로 훈장"
 libya_medal_of_merit_DESC: "군사적 용맹을 인정받은 자에게 수여됩니다. 역사를 되돌려 이집트와 차드를 상대로 전쟁에서 승리하세요.\n\n\"우리는 다시 항복하지 않을 것이다. 우리는 여자가 아니다. 우리는 계속 싸울 것이다.\"\n\n- 무아마르 카다피"
