l_english:
 STALKER.161.t: "Strelok Reaches the Center"
 STALKER.161.d: "A stalker the Cordon calls Strelok has passed the Brain Scorcher and reached the center of [STALKER_zone_name]. He means to shut down the C-Consciousness. The Monolith is already moving to stop him, and the military wants the road closed before either of them finishes."
 STALKER.161.d_marked: "The amnesiac the Cordon called the Marked One has remembered the name Strelok. He has passed the Brain Scorcher and reached the center of [STALKER_zone_name]. He means to shut down the C-Consciousness. The Monolith is already moving to stop him, and the military wants the road closed before either of them finishes."
 STALKER.161.d_remembers: "Strelok has passed the Brain Scorcher and reached the center of [STALKER_zone_name]. He already knows what is there. He means to shut down the C-Consciousness. The trader at the Cordon says Clear Sky died trying to walk him in. The Monolith is moving to stop him, and the military wants the road closed."
 STALKER.161.a: "Let him shut the C-Consciousness down."
 STALKER.161.a_tt: "The Monolith loses up to §G40§! influence. Activity rises by §R15§!, containment falls by up to §R10§!, and the stalker population rises by §Y10§!. Strelok lives, and he remains opposed to the Zone."
 STALKER.161.b: "Stop him at the Brain Scorcher."
 STALKER.161.b_tt: "Costs §R50§! political power. Military influence and containment each rise by §G15§!, and the Monolith gains §R5§!. Strelok does not return."
 STALKER.161.c: "Leave him to the C-Consciousness."
 STALKER.161.c_tt: "The Monolith gains §R20§! influence. Activity falls by up to §G10§! and containment rises by §G5§!. Strelok does not come back as himself."
 STALKER.162.t: "The Center of the Zone"
 STALKER.162.d_turned_back: "Strelok never reached the power plant. Clear Sky turned him back in the swamps a year ago, and the center has stayed shut."
 STALKER.162.d_shutdown_marked: "The Marked One remembered the name Strelok at the center of the Zone and shut the C-Consciousness down. The Monolith's outer posts have gone quiet. The emissions have not."
 STALKER.162.d_shutdown_remembers: "Strelok reached the center knowing the C-Consciousness was there, and he shut it down. The Monolith's outer posts have gone quiet. The emissions have not."
 STALKER.162.d_shutdown: "Strelok reached the center of the Zone and shut the C-Consciousness down. The Monolith's outer posts have gone quiet. The emissions have not."
 STALKER.162.d_stopped: "The army turned Strelok back before he reached the power plant. The Brain Scorcher is still running, and the Monolith still holds the center."
 STALKER.162.d_taken: "Strelok entered the center and did not come out. The Monolith's patrols are moving south again, and the Zone has gone quiet in a way nobody trusts."
 STALKER.162.a: "The Zone is still there."
