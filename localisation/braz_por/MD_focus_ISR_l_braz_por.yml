 israel_economy.194.d: "O Egito concordou com nossa oferta. A construção começará em breve."
 israel_economy.194.a: "Ótimo!"
 israel_economy.195.t: "O Egito recusa!"
 israel_economy.195.d: "Eles não concordaram com nossa oferta."
 israel_economy.195.a: "Affe!"
 israel_economy.196.t: "Israel propõe projeto ferroviário!"
