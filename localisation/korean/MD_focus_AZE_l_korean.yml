 AZE_EU_oil_research_desc: "EU는 석유가 절실하며, 이제 우리가 이 문제를 해결하도록 돕겠습니다."
 AZE_Order_new_machinery: "신규 기계 주문"
 AZE_Order_new_machinery_desc: "신규 기계는 우리의 산업 기반을 구축하는 데 도움이 될 것입니다."
 AZE_Free_deals: "자유 협정"
 AZE_Free_deals_desc: "자유 시장 가치에 기반한 협정을 더 많이 맺으면 더 많은 부를 얻게 될 것입니다."
 AZE_EU_deals: "EU 협정"
 AZE_EU_deals_desc: "수익성 있는 관계를 구축하기 위한 일련의 계약과 협정입니다."
 AZE_NATO_associate_status: "나토 중시"
 AZE_NATO_associate_status_desc: "나토군과의 협력을 개선하기 위한 나토 연계 프로그램입니다."
 AZE_Combat_influence: "영향력 대항"
 AZE_Combat_influence_desc: "외부의 영향력을 견제해야 합니다."
 AZE_Investment_portfolio: "투자 포트폴리오"
 AZE_Investment_portfolio_desc: "견실한 투자 포트폴리오를 구성하면 더 많은 투자자를 유치하는 데 도움이 될 수 있습니다."
 AZE_Fight_corruption: "부패 척결"
 AZE_Fight_corruption_desc: "부패는 우리나라를 파괴하고 있으며, 이에 맞서 싸워야 합니다."
 AZE_Strict_market_control: "엄격한 시장 통제"
 AZE_Strict_market_control_desc: "엄격한 시장 통제는 최종적으로 개방 시장으로 느리고 부드럽게 전환할 수 있게 해 줄 것입니다."
 AZE_gradual_market_clearance: "점진적 시장 정리"
 AZE_gradual_market_clearance_desc: "시장을 자유롭고 개방적으로 만들기 위한 일련의 이정표를 갖춘 느슨한 통제가 소련식으로 시장을 통제하는 것보다 낫습니다."
 AZE_Combat_human_trafficing: "UN 인권 위원회"
 AZE_Combat_human_trafficing_desc: "우리는 일부 인권 침해 혐의를 받아 왔지만, 반대론자들이 틀렸음을 증명할 준비가 되어 있습니다."
 AZE_Strengthen_ties: "유대 강화"
 AZE_Strengthen_ties_desc: "동맹국과의 유대를 강화하는 것은 언제나 좋은 선택입니다."
 AZE_Local_business: "지역 사업체"
 AZE_Local_business_desc: "소규모 및 지역 사업체에 집중하는 것은 장기적으로 도움이 될 수 있습니다."
 AZE_Self_help_projects: "자조 프로젝트"
 AZE_Self_help_projects_desc: "자조 프로젝트는 우리나라가 지역의 주도적 노력에 의존하도록 도울 것입니다."
 AZE_Oil_reserves: "석유 비축"
 AZE_Oil_reserves_desc: "석유를 비축하면 공장이나 파이프라인의 기술적 결함이 발생했을 때 나라에 공급하는 데 도움이 될 수 있습니다."
 AZE_Joint_trade_associations: "공동 무역 협회"
 AZE_Joint_trade_associations_desc: "공동 무역 협회는 최소한의 간섭으로 무역과 시장을 규제하는 데 도움이 될 것입니다."
 AZE_Mutual_shadow_control: "상호 음성 거래 통제"
 AZE_Mutual_shadow_control_desc: "불법 활동의 흐름을 통제하는 것은 비도덕적일 수 있으나 효과적입니다."
 AZE_Root_out_shadow_market: "음성 시장 근절"
 AZE_Root_out_shadow_market_desc: "불법 거래를 근절하면 우리나라의 범죄 자금을 줄이는 데 도움이 될 것입니다."
 AZE_Mutual_defense_initiative: "상호 방위 구상"
 AZE_Mutual_defense_initiative_desc: "상호 방위 구상은 우리와 동맹국이 스스로를 방어하는 데 도움이 될 것입니다."
 AZE_Defense_funds: "방위 기금"
 AZE_Defense_funds_desc: "비상 상황에 대비해 자금을 비축하는 것이 우리 발전의 다음 단계일 수 있습니다."
 AZE_Pipeline_initiative: "파이프라인 구상"
 AZE_Pipeline_initiative_desc: "파이프라인을 개발하면 시장 가치와 노출도를 높이는 데 도움이 될 수 있습니다."
 AZE_arms_factory: "군수 시설 쇄신"
 AZE_arms_factory_desc: "우리 방위 산업의 생산량은 여전히 매우 낮으므로 투자가 필요합니다."
 AZE_old_school_production: "구식 생산"
 AZE_old_school_production_desc: "오래된 제품을 생산하는 것은 어리석어 보일 수 있지만, 팔린다면 일시적으로 해 볼 수 있습니다."
 AZE_it_indusrty: "IT 산업"
 AZE_it_indusrty_desc: "IT는 미래이며, 아제르바이잔은 과거의 나라가 아닙니다."
 AZE_fast_development: "빠른 발전"
 AZE_fast_development_desc: "빠르고 지속 가능한 발전, 50년 뒤의 역사책은 이 시기를 이렇게 기록할 것입니다."
 AZE_no_more_narcotics: "마약 근절"
 AZE_no_more_narcotics_desc: "우리나라를 거치는 마약 밀매는 해마다 수백 명의 목숨을 앗아가고 있으며, 즉시 중단시켜야 합니다."
 AZE_economy_rise: "경제 상승"
 AZE_economy_rise_desc: "우리 경제는 상승세에 있지만, 이를 개선할 수단은 아직 많지 않습니다."
 AZE_surface_ships: "수상함"
 AZE_surface_ships_desc: ""
 AZE_naval_doctrine_innovations: "새로운 해군 교리"
 AZE_naval_doctrine_innovations_desc: ""
 azeev.15.t: "알리예프의 시대"
 azeev.15.d: "카라바흐 전쟁에서의 패배로 타격을 입은 아제르바이잔은 전 소련 공산당 지도자 헤이다르 알리예프의 노력 덕분에 영토 손실을 입었음에도 정치적으로 버틸 수 있었습니다. 알리예프는 세습 체제를 구축하려 하면서 다양한 대내외 요인 사이에서 기동하려 합니다. 서방과 동방 사이의 유연한 외교는 아제르바이잔의 미래 성공에 중요한 기여를 할 수 있습니다. 그러나 낙담한 국민은 더 이상의 죽음을 원하지 않으며 평화와 민주주의를 요구하고, 민족주의자들은 아르메니아와 이란에 대한 총력전을 요구하며, 친러시아 세력은 현상 유지를 요구합니다. 상당한 석유 자원을 보유했지만 인프라와 산업은 미발달한 아제르바이잔은, 외부와 내부에서 불이 붙어 경제적·정치적 혼란에 빠지지 않는다면 지역 강국이 될 수 있습니다."
 azeev.15.a: "그렇군..."
 azeev.13.t: "아제르바이잔군"
 azeev.13.d: "아르차흐 전쟁의 패배 이후 완전한 붕괴를 겪었으나 여러 국제 단체와 국가의 후원을 받는 아제르바이잔군이 점진적인 회복을 시작하고 있습니다. 충성스럽지 않은 장군, 민족주의 이데올로그, 군벌은 아제르바이잔군에 붙은 기생충입니다. 이 모든 것을 바꿀 때입니다."
 azeev.13.a: "그렇다."
 azeev.14.t: "아제르바이잔 경제"
 azeev.14.d: "90년대 이후 아제르바이잔의 포스트소련 경제는 깊은 침체에 빠져 있습니다. 한때 위대했던 석유 및 농업 산업은 간신히 숨만 붙어 있어 아제르바이잔이 어떻게든 존속하게 해 줍니다. 그러나 외국 투자자와 상당한 양의 아제르바이잔 자원 덕분에 아제르바이잔은 장래에 경제적으로 발전한 나라가 될 수 있습니다."
 azeev.14.a: "돈이 들어온다!"
 AZE_remove_cult_tt: "현재의 국가 정신을 §Y알리예프 숭배§!로 교체합니다.\n"
 AZE_Aliev_died: "헤이다르 알리예프 사망"
 AZE_aze_eastern_focus: "동부 중시"
 AZE_aze_eastern_focus_desc: "우리의 입지를 바로잡기 위해 동부 문제에 집중해야 합니다."
 azeev.1.t: "확전 가능성"
 azeev.1.d: "최근 몇 주 동안 긴장이 고조되어 이제 상황을 더 확대할 수 있지만, 그것이 우리에게 이로운가?"
 azeev.1.a: "확대하라!"
 azeev.1.b: "다시 생각해 보니..."
 azeev.2.t: "아제르바이잔의 도움 요청"
 azeev.2.d: "아제르바이잔과 이란 사이에 최근 긴장이 고조되면서 아제르바이잔이 우리의 도움을 구하고 있습니다."
 azeev.2.a: "사악한 자에게 도움은 없다."
 azeev.2.b: "약속을 하자."
 azeev.2.c: "그들은 우리의 전폭적인 지지를 받는다."
 azeev.3.t: "국빈 방문"
 azeev.3.d: "우리의 입지를 굳히기 위해 어느 강대국을 공식 방문하는 것은 당연한 일입니다. 그렇다면 어디로 가야 하겠습니까?"
 azeev.3.a: "튀르키예로."
 azeev.3.b: "러시아로."
 azeev.3.c: "최근의 긴장에도 불구하고 이란으로."
 azeev.4.t: "아제르바이잔 석유 정상회의"
 azeev.4.d: "아제르바이잔이 대규모 석유 및 경제 정상회의를 개최했으며, 우리 외교관들이 접촉을 받아 몇 가지 투자 프로젝트를 제안받았습니다. 투자하시겠습니까?"
 azeev.4.a: "물론이지."
 azeev.4.b: "때가 아니다."
 azeev.5.t: "첫 번째 통화"
 azeev.5.d: "우리의 입지가 아직 불안정하므로, 외국 세력이 움직이기 전에 그들과의 관계를 개선해야 합니다. 의장의 첫 번째 통화 상대는 누구입니까?"
 azeev.5.a: "튀르키예."
 azeev.5.b: "러시아."
 azeev.5.c: "이란."
 azeev.5.e: "중국."
 azeev.6.t: "아제르바이잔의 도움 요청"
 azeev.6.d: "아제르바이잔은 꽤 오래전부터 재무장을 해 왔지만, 있을 수 있는 충돌에서는 여전히 더 많은 무기가 필요하며 우리에게 손을 내밀었습니다. 도와주시겠습니까?"
 azeev.6.a: "해 보자."
 azeev.6.b: "정신이 나갔나?"
 azeev.7.t: "러시아의 동의"
 azeev.7.d: "우리가 바란 대로 러시아가 우리와 무기를 공유하기로 동의했습니다."
 azeev.7.a: "훌륭하다!"
 azeev.8.t: "러시아의 거부"
 azeev.8.d: "우리의 모든 노력에도 불구하고 협상은 결렬되었고, 러시아로부터 어떤 무기도 받지 못하게 되었습니다."
 azeev.8.a: "젠장"
 azeev.9.t: "헤이다르 알리예프의 사망"
 azeev.9.d: "어젯밤 우리의 지도자가 세상을 떠났습니다. 그는 거의 10년 동안 나라를 이끌었으며, 이제 그의 유산은 시간의 시험을 받게 될 것입니다."
 azeev.9.a: "전설도 죽는 법이다."
 azeev.10.t: "군사정권의 가능성?"
 azeev.10.d: "내부 기관이 군사 쿠데타 가능성을 알려 왔습니다. 장군들이 꽤 오래전부터 암암리에 음모를 꾸며 왔다고 합니다. 한편 증거는 기껏해야 부족해 보입니다..."
 azeev.10.a: "사실일 수 있을까?"
 azeev.11.t: "군사 쿠데타!"
 azeev.11.d: "군 소속 장군 몇 명이 직접 나서서 [Root.GetLeader]을(를) 체포했습니다. 이제 나라의 미래가 불투명해졌지만, 새로 들어선 권력은 안정과 평화를 보장한다고 장담합니다."
 azeev.11.a: "어떻게 그럴 수가?!"
 azeev.16.t: "튀르키예의 수락"
 azeev.16.d: "튀르키예가 이란과의 충돌 가능성에 대비해 일부 장비를 제공하기로 동의했습니다."
 azeev.16.a: "좋다."
 azeev.17.t: "튀르키예의 거부"
 azeev.17.d: "튀르키예는 이란과의 충돌 가능성에서 어떤 도움도 제공하는 데 동의하지 않았습니다."
 azeev.17.a: "어리석은 자들."
 azeev.18.t: "알리예프 숭배의 인기 변화"
 azeev.18.d: "최근 여론조사에 따르면 일반 국민 사이에서 알리예프와 그의 유산에 대한 인식이 바뀌었습니다."
 azeev.18.a: "지켜보자."
 aze_news.1.t: "[AZE.GetLeader] 전복!"
 aze_news.1.d: "군 소속 장군 몇 명이 직접 나서서 [AZE.GetLeader]을(를) 체포했습니다. 거리에서 충성파와 군 병력 사이에 소규모 교전이 벌어지는 가운데 상황은 여전히 암울해 보이며, 아제르바이잔의 미래는 불확실합니다."
 aze_news.1.a: "잠깐, 뭐라고?"
 aze_news.1.b: "좋은 전개다."
 eat_up_doomsday_fund: "비상 기금 사용"
 eat_up_doomsday_fund_desc: "비상 기금을 사용하여 빠르게 자금을 마련할 수 있습니다. 하지만 기다릴수록 더 많은 자금을 얻게 됩니다."
 AZE_aliev_propaganda_category: "알리예프 숭배"
 AZE_aliev_propaganda_category_desc: "§Y국가의 아버지§! §G헤이다르 알리예프§!는 우리가 널리 활용하고 확대하는 숭배에 가까운 추종자들을 거느리고 있습니다. 알리예프 숭배를 확대하지 않으면 우리 일족의 정통성이 흔들릴 수 있으며 다른 나쁜 결과가 펼쳐질 수 있습니다. §R이런 일이 일어나게 두어서는 안 됩니다.§!"
 AZE_buy_support_PP: "정치적 수단으로 지지 확대"
 AZE_buy_support_PP_desc: "정치 집회와 성명으로 숭배에 대한 지지를 높일 수 있습니다."
 AZE_buy_support: "지지 매수"
 AZE_buy_support_desc: "또는 일정 자금을 들여 언론을 통해 지지를 높일 수 있습니다."
