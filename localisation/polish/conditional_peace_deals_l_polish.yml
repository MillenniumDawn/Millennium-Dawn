 CPD_send_ready_TT: "§G Warunki tej umowy są gotowe do wysłania do[THIS.GetName]. §!\n\n[CPD_send_status_breakdown]\n\n[CPD_deal_recap]"
 CPD_send_blocked_TT: "§RNie możemy jeszcze wysłać tej oferty.§! Wysłanie §Yżądań§! wymaga §Ywkładu wojennego§! przeciwko [THIS.GetName]: wygrania co najmniej jednej bitwy lub prowadzenia wojny przez trzy miesiące. Porozumienie obejmujące §Ywyłącznie zawieszenie broni§! można wysłać bez wkładu własnego. Bez wkładu własnego można również wysyłać porozumienia składające się wyłącznie z ustępstw.\n\n[CPD_send_status_breakdown]\n\n[CPD_deal_recap]"
 CPD_deal_recap_TT: "Rządania: §Y[?CPD_recap_demands|.0]§!\nKoncesje: §Y[?CPD_recap_concessions|.0]§!\nKoszt netto: §Y[?CPD_recap_total_cost|+0]§! £victory_points"
