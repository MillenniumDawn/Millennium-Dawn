 leave_antarctica_treaty_warning_tt: "§RATENÇÃO:§!\nDeixar o §CTratado da Antártica§! enquanto possui uma §YEstação de Pesquisa§! na §CAntartica§! provocará uma resposta global dos membros do Tratado, incluindo potenciais sanções e reações diplomáticas. É recomendado desmantelar quaisquer estações de pesquisa na §CAntartica§! antes de deixar o tratado para evitar consequências negativas.\n\nNo entanto, se você escolher deixar o Tratado enquanto possuir uma, nenhum artigo o impedirá de iniciar atividades proibidas na §CAntartica§!, como exploração de recursos ou presença militar, o que pode levar a consequências graves para a reputação global da sua nação."
