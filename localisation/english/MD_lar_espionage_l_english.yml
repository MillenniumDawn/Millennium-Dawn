l_english:
 # LaR Espionage Operations events
 # Heavy Water Raid
 lar_heavy_water.1.t: "Enemy Sabotage at the Heavy Water Plant"
 lar_heavy_water.1.d: "A covert operation has destroyed our heavy water production facility. Without a steady supply of heavy water, our nuclear research program faces a serious setback."
 lar_heavy_water.1.a: "Investigate the sabotage immediately"
 lar_heavy_water.2.t: "Heavy Water Plant Destroyed"
 lar_heavy_water.2.desc: "Our operatives have successfully demolished the enemy heavy water plant. The raid went as planned, and the facility will take years to rebuild, severely hampering their nuclear ambitions."
 lar_heavy_water.2.a: "A clean strike with lasting results"

 # Bruneval Raid
 lar_bruneval_raid.1.t: "Coastal Radar Installation Raided"
 lar_bruneval_raid.1.desc: "Enemy commandos have struck our coastal radar station at Bruneval. Key components of our Wurzburg radar array have been seized. The technical intelligence they gain could prove costly."
 lar_bruneval_raid.1.a: "Reinforce our coastal defenses"
 lar_bruneval_raid.2.t: "Bruneval Raid Successful"
 lar_bruneval_raid.2.desc: "Our commandos have seized critical radar components from the enemy installation at Bruneval. The intelligence gathered will accelerate our own research into advanced detection technology."
 lar_bruneval_raid.2.a: "Our engineers will put this to good use"

 # Capture Tito
 lar_capture_tito.1.t: "Operation Rösselsprung Has Failed"
 lar_capture_tito.1.desc: "Our airborne assault on Tito's headquarters at Drvar has failed. The partisan leader narrowly escaped capture. Our forces took casualties, and Tito's prestige among the resistance has only grown."
 lar_capture_tito.1.a: "We will find him another way"

 # Rescue Mussolini
 lar_rescue_mussolini.1.t: "Operation Oak Has Failed"
 lar_rescue_mussolini.1.desc: "Our glider-borne assault on the Gran Sasso did not succeed. Mussolini remains in enemy hands. Without him, our position in Italy grows more precarious by the day."
 lar_rescue_mussolini.1.a: "A regrettable outcome"
 lar_rescue_mussolini.2.t: "Mussolini Rescued"
 lar_rescue_mussolini.2.desc: "SS commandos under Otto Skorzeny have extracted Mussolini from his mountain prison in a daring glider raid on the Gran Sasso. The Duce is free, and our alliance with Italy can be restored."
 lar_rescue_mussolini.2.a: "A triumph for our special forces"

 # Fake Intel Units
 lar_fake_intel_units.1.t: "Decommissioning Ghost Units"
 lar_fake_intel_units.1.d: "Our intelligence service is clearing outdated phantom unit records from the enemy's files. The deception has run its course."

 # Collaboration Government
 lar_collab_gov.1.t: "Collaboration Government Established"
 lar_collab_gov.1.d: "A local administration aligned with our occupation has been installed. Its legitimacy will depend on our ability to maintain order and deliver results."

 # Occupied Countries
 occupied_countries.1.title: "Establish a Collaboration Government"
 occupied_countries.1.desc: "With sufficient compliance among the occupied population, conditions may be ripe to establish a collaboration government. Such an administration would legitimize our occupation and ease the burden of direct control."
 occupied_countries.1.a: "Proceed with establishing the collaboration government"
 occupied_countries.1.b: "Not yet — direct administration will continue"
