 ROM.conservatism: "£ROM_conservatism 基督教民主民族农民党"
 ROM.conservatism_icon: "£ROM_conservatism"
 ROM.conservatism_desc: "（农业保守主义）- 基督教民主全国农民党\n\n基督教民主全国农民党由前反共异见人士科尔内留·科波苏、约安·亚历山德鲁和扬·拉蒂乌于1989年12月创立，是全国农民党的继承者，后者在二战期间一直是罗马尼亚政治的主导力量，直到二战后新成立的罗马尼亚人民共和国禁止该党。基督教民主全国农民党是前共产党官员扬·伊利埃斯库领导的民族救国阵线政府最反对的力量之一，这使得基督教民主全国农民党成为新成立的罗马尼亚民主大会的领导力量，该大会由多个政党组成，其中民族自由党是其中的重要一员。罗马尼亚民主大会在1996年大选中获胜，选举埃米尔·康斯坦丁内斯库成为罗马尼亚自共产主义政权建立以来第一位非社会主义总统。然而，随后的经济改革以及罗马尼亚民主大会内部的分裂使得对基督教民主全国农民党的支持大幅减少，转而支持其他右翼政党，这可能会威胁到他们作为一支重要政治力量的生存。基督教民主全国农民党持有基督教民主观点，并高度重视农业主义和反共产主义。该党最引人注目的是罗马尼亚君主制的最大代言人之一，它积极支持恢复君主制，该政体在1947年苏联支持的政变后被废除。"
 ROM.liberalism: "£ROM_liberalism 国家自由党"
 ROM.liberalism_icon: "£ROM_liberalism"
 ROM.liberalism_desc: "（民族自由主义）- 民族自由党\n\n民族自由党由拉杜·坎佩亚努和米尔恰·约内斯库·昆图斯在1989年罗马尼亚革命后创立，是同名政党的继承者，该党在二战后苏联建立罗马尼亚共产主义政权之前被视为罗马尼亚政治的霸主，坎佩亚努和昆图斯在该党解散前都是该党的成员。民族自由党是1989年共产主义结束后第一次选举中最大的反对力量，随后与基督教民主民族农民党一起成为罗马尼亚民主大会的重要组成部分，但由于联盟内部出现分歧，该党在1992年选举中退出，随后经历了多次分裂，导致其在1992年大选中失去代表权。然而，民族自由党后来重新加入了罗马尼亚民主大会，并与基督教民主全国农民党一起成功选举埃米尔·康斯坦丁内斯库担任总统。然而，罗马尼亚民主大会政府的失败损害了该党的形象，并且它在参与罗马尼亚民主大会联盟方面面临内部分歧。民族自由党虽然主要是社会和经济自由主义以及大西洋主义的大力支持者，但内部有大量声音坚持更保守和民族主义的观点，因此有些人认为民族自由党只是名义上的自由派。尽管如此，民族自由党仍然是罗马尼亚最强大的中右翼政党之一"
 ROM.socialism: "£ROM_socialism 罗马尼亚社会民主党"
 ROM.socialism_icon: "£ROM_socialism"
 ROM.socialism_desc: "（大帐篷）- 罗马尼亚社会民主党\n\n罗马尼亚社会民主党的根源可以追溯到前罗马尼亚共产党，它是罗马尼亚社会民主党与两个较小的左翼政党组成的联盟，是民主救国阵线的继承者，后者是由尼古拉·齐奥塞斯库政权垮台后不久掌权的共产党前官员领导的政党。虽然罗马尼亚社会民主党名义上具有中左翼和亲欧洲的观点，但实际上它采取了更务实的立场，结合了左翼民族主义、工党主义、第三条道路社会民主主义和民粹主义。与其他欧洲同僚相比，罗马尼亚社会民主党也更偏向社会保守和民族主义，党内许多人都持欧洲怀疑论立场，但总体而言，罗马尼亚社会民主党的主要优势在于它能够采取务实的立场，这确保了它在罗马尼亚政治中的持续实力。该党在后共产主义时期的执政初期还被指控犯有多项腐败丑闻，并窝藏了许多前齐奥塞斯库官员，而这些官员是齐奥塞斯库政权的关键部分。"
 ROM.Western_Autocracy: "£ROM_monarchist  霍亨索伦-锡格马林根王室 - 迈克尔分支"
 ROM.Western_Autocracy_icon: "£ROM_monarchist"
 ROM.Western_Autocracy_desc: ""
 ROM.anarchist_communism: "£ROM_radical_left 社会主义劳动党"
 ROM.anarchist_communism_icon: "£ROM_radical_left"
 ROM.anarchist_communism_desc: ""
 ROM.Neutral_conservatism: "£ROM_neutral_social  民主党 - §B保守派§!"
 ROM.Neutral_conservatism_icon: "£ROM_neutral_social"
 ROM.Neutral_conservatism_desc: "（自由保守主义）- 民主党\n\n民主党成立于1993年，由罗马尼亚1989年革命后第一位非共产党总理彼得·罗曼接替救国党而成立。民主党的§B保守派§!以前交通部长特拉扬·伯塞斯库为中心，力推巩固自由市场并维持罗马尼亚16%的统一税率。他们还支持改革罗马尼亚宪法，以实现行政权力下放并赋予八个发展区更大的权力。"
 ROM.neutral_Social: "£ROM_neutral_social 民主党 - §R社会主义派§!"
 ROM.neutral_Social_icon: "£ROM_neutral_social"
 ROM.neutral_Social_desc: "（社会民主主义）- 民主党\n\n民主党成立于1993 年，由罗马尼亚1989年革命后第一位非共产党总理彼得·罗曼创立，作为民族救国党的继任者。民主党的§R社会主义派§!以罗马尼亚1989年后第一位非共产党总理彼得·罗曼为中心，正在推动罗马尼亚采用欧洲社会民主模式，重点是进一步发展罗马尼亚民主机构，并且反对民族主义言论，这与过去曾使用过这种言论的罗马尼亚社会民主党不同。"
 ROM.Neutral_Libertarian: "£ROM_neutral_libertarian 罗马尼亚匈牙利人民主联盟"
 ROM.Neutral_Libertarian_icon: "£ROM_neutral_libertarian"
 ROM.Neutral_Libertarian_desc: "（匈牙利少数民族利益）- 罗马尼亚匈牙利人民主联盟\n\n罗马尼亚匈牙利人民主联盟成立于1989年罗马尼亚革命后，是代表罗马尼亚特兰西瓦尼亚匈牙利少数民族的主要政党，该党呼吁塞凯伊地自治，并为匈牙利少数民族提供更多接受匈牙利语教育的机会。"
 ROM.Nat_Fascism: "£ROM_nat_fascism 新右翼"
 ROM.Nat_Fascism_icon: "£ROM_nat_fascism"
 ROM.Nat_Fascism_desc: "（新军团主义）- 新右翼\n\n新右翼最初成立时是一个非政府组织，是罗马尼亚唯一著名的新军团主义运动，自称是两次世界大战期间科诺留·泽列亚·科德里亚努极端民族主义铁卫队的继承者。新右派采取反西方文化立场，最明显的是反对少数民族权利、万圣节等西方文化以及罗马尼亚东正教以外的宗教团体。该党还采取反资本主义和反马克思主义立场，并遵循第三立场。"
 ROM.Nat_Populism: "£ROM_nat_populism 大罗马尼亚党"
 ROM.Nat_Populism_icon: "£ROM_nat_populism"
 ROM.Nat_Populism_desc: "（极端民族主义）- 大罗马尼亚党\n\n大罗马尼亚党由科尼利乌·瓦迪姆·都铎于1991年创立，大罗马尼亚党拥护民族民粹主义，融合了极端民族主义、民族共产主义以及新军团主义情绪。该党主要围绕其领导人科尼利乌·瓦迪姆·都铎展开，他是一位前诗人，曾发表声明反对匈牙利少数民族权利，并呼吁建立一个大罗马尼亚，包括罗马尼亚王国在二战后失去的土地。"
