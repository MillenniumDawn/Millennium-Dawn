l_russian:
 HUN_karpatalja_question_category: "Вопрос Карпатальи"
 HUN_annex_karpatalja: "Откликнуться на призыв Карпатальи"
 HUN_annex_karpatalja_desc: "Власть Украины в Закарпатье рухнула. Местные венгерские советы просят Будапешт признать объединение, и в Киеве не осталось никого, кто мог бы сказать «нет»."
 HUN_karpatalja_ultimatum: "Ультиматум Киеву"
 HUN_karpatalja_ultimatum_desc: "Венгерское меньшинство Карпатальи целый век ждало воссоединения с родиной. Киев должен тихо передать её или потерять силой."
 HUN_karpatalja_integration_category: "Администрация Карпаталии"
 HUN_701_return: "Возвращение Карпаталии"
 HUN_701_return_desc: "Карпаталья была потеряна в Трианоне. Заручившись согласием провинции, мы можем сделать воссоединение окончательным."
 HUN_karpatalja_autonomy: "Администрация Карпаталии"
 HUN_karpatalja_autonomy_desc: "Управление Карпатальей через местные советы обеспечивает расположение населения и ускоряет её интеграцию ценой более слабого контроля над финансами и общественного терпения к такому порядку."
 HUN_ukr_cede_tt: "§YУкраина передаст Карпаталью§!"
 HUN_ukr_refuse_tt: "§RМы получим цель войны для захвата Карпатальи силой§!"
 hungary_karpatalja.1.t: "Советы Карпаталии"
 hungary_karpatalja.1.d: "Поскольку Киев не может демонстрировать свою власть так далеко от столицы, местные собрания в Закарпатье проголосовали за объединение с Венгрией. Будапешт только рад услужить."
 hungary_karpatalja.1.a: "Добро пожаловать домой"
 hungary_karpatalja.2.t: "Правление Карпаталией"
 hungary_karpatalja.2.d: "На карте Карпаталья — венгерская. Превратить это в функционирующую администрацию — другой вопрос, и правительство должно решить, насколько жёсткой рукой действовать."
 hungary_karpatalja.2.a: "Правление через местные советы"
 hungary_karpatalja.2.b: "Прямое правление из Будапешта"
 hungary_karpatalja.10.t: "Будапешт требует Карпаталью"
 hungary_karpatalja.10.d: "Венгрия поставила ультиматум: сдайте Закарпатье или столкнётесь с последствиями. Правительство должно решить, как реагировать."
 hungary_karpatalja.10.a: "Уступить провинцию"
 hungary_karpatalja.10.b: "Отклонить ультиматум"
 hungary_karpatalja.11.t: "Киев отказывается"
 hungary_karpatalja.11.d: "Украина отклонила наши требования по поводу Карпатальи. Если мы хотим заполучить провинцию, нам придётся захватить её самим."
 hungary_karpatalja.11.a: "Готовьтесь к войне"