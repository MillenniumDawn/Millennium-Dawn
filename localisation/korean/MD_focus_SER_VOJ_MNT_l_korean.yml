 ser_invest.7.d: "[FROM.GetNameWithFlag] 정부가 우리나라에 투자하기로 동의했습니다! 이는 우리 경제의 성장을 가속할 것입니다!"
 ser_invest.7.a: "좋아"
 SER_serbian_armed_forces: "세르비아군"
 SER_serbian_armed_forces_desc: "군대는 세르비아의 독립을 보장하는 데 필수적입니다. 우리 스스로를 지킬 수 있도록 가능한 한 많은 힘을 실어 줍시다."
 SER_army_reform: "군 개혁"
 SER_army_reform_desc: "어떤 종류의 전쟁이든 대비하려면 군대를 시급히 정비해야 합니다. 지금 상태로는 누구도 지킬 준비가 되어 있지 않을 것입니다."
 SER_army: "세르비아군"
 SER_army_desc: "세르비아군은 세르비아의 군대입니다."
 SER_doctrine: "새로운 군사 교리"
 SER_doctrine_desc: "이제 우리는 나라를 지키기 위해 거대한 군대를 유지할 필요가 없으므로, 군사 교리를 바꿀 것입니다."
 SER_oborona: "국방법"
 SER_oborona_desc: "우리나라는 이웃을 공격하는 것이 아니라 자국의 영토를 방어하는 데 집중할 것입니다.."
 SER_slujba: "계약제 군대로의 전환"
 SER_slujba_desc: "우리는 군대를 계약제로 전환하고 징병제 관행에서 벗어날 계획입니다."
 SER_goz_granitca: "국경 수비 권한 이관"
 SER_goz_granitca_desc: "이제부터 국경을 수비하는 권한은 내무부로 이관됩니다."
 SER_univer: "군사 아카데미"
 SER_univer_desc: "국방대학교 군사 아카데미는 세르비아 베오그라드에 위치한, 군사 교육과 경력 개발을 전담하는 대학입니다. 이 아카데미는 세르비아 고등 교육 체계의 일부로, 인가받은 대학원 및 대학원 이후 과정을 제공합니다. 학부 군사 대학과 대학원 과정을 모두 갖추고 있습니다.."
 SER_avia: "구식 공군"
 SER_avia_desc: "세르비아 공군 및 방공군은 세르비아의 공군이자 세르비아군의 군종입니다. 그 임무는 세르비아 영공의 주권을 지키고 보호하는 것이며, 세르비아 육군과 함께 국가의 영토 보전을 수호하는 것입니다.."
 SER_new_air_lines: "신규 항공 비행단 편성"
 SER_new_air_lines_desc: "더 나은 조율과 관리 용이성을 위해 우리 항공 전력의 비행단 수를 최적화하고 있습니다.."
 SER_pereosnash: "재장비"
 SER_pereosnash_desc: "우리 항공 전력을 새로운 모델의 예비 부품과 장비로 재장비하기 시작할 것입니다."
 SER_vpk: "세르비아 방위 산업"
 SER_vpk_desc: "세르비아의 군산 복합체는 군사 및 특수 장비, 탄약, 무장의 개발과 생산을 수행하는 세르비아 내 과학 연구 기관, 시험 기관, 제조 기업의 집합체로, 세르비아군과 수출 모두를 위한 것입니다."
 SER_zastava: "자스타바 암스"
 SER_zastava_desc: "자스타바 암스는 세르비아 크라구예바츠에 본사를 둔 세르비아의 화기 및 야포 제조업체입니다. 1853년에 설립되어 첫 대포를 주조했습니다. 세르비아 최고의 화기 생산업체이자 자국 방위 산업에 크게 기여하는 기업입니다. 자스타바 암스는 칼라시니코프 소총인 자스타바 M70을 비롯한 다양한 제품을 40개국 이상에 생산 및 수출합니다.."
 SER_uniform: "밀레 드라기치"
 SER_uniform_desc: "군복, 군용 장비, 헬멧, 방탄조끼를 생산합니다.."
 SER_rszo: "EDePro"
 SER_rszo_desc: "EDePro는 세르비아 베오그라드에 기반을 둔 기업으로, 고체 로켓과 터보제트 추진 미사일을 위한 솔루션을 개발하고 고에너지 물질을 생산합니다."
 SER_avto: "자스타바 테르보"
 SER_avto_desc: "자스타바 테르보(Zastava TERVO)는 \\"자스타바 테렌스카 보질라(Zastava Terenska Vozila)\\"의 약칭으로, 전지형 차량 생산을 전문으로 하는 세르비아의 자동차 및 방위 산업 기업입니다. 크라구예바츠에 본사를 두고 있으며, 자스타바 트럭의 모든 자산과 대부분의 직원을 인수하여 설립되었습니다."
 SER_pvo: "PPT 나멘스카"
 SER_pvo_desc: "PPT 나멘스카는 무기, 박격포, 유탄발사기, 무인 지상 차량, 유압 및 공압 장치, 항공기 부품, 그리고 현대화된 M-77 오그냐, PASARS-16, LRSVM 모라바를 비롯한 일부 복합 무기 체계를 다양한 생산 단계에서 제조하는 세르비아의 제조업체입니다. 민간 및 산업용 생산도 병행하고 있습니다."
 SER_droni: "PR-DC"
 SER_droni_desc: "민간 소유의 세르비아 드론 전문 기업 PR-DC는 자폭 드론을 포함한 전 제품군을 전시했으며, 그중 하나는 시장 출시를 눈앞에 두고 있고 다른 여러 제품은 여전히 개발 단계에 있습니다."
 SER_export: "유고임포트 SDPR"
 SER_export_desc: "유고임포트 SDPR은 세르비아 국영 무기 제조업체이자 방위 관련 장비의 수출입을 중개하는 기업입니다."
 SER_genshtab: "세르비아 총참모부"
 SER_genshtab_desc: "세르비아군 총참모부는 세르비아군 내 최고 권위 기관이며, 직접 지휘하는 수많은 조직 단위를 거느린 주요 지휘 기관입니다."
 SER_guard: "세르비아군 근위대"
 SER_guard_desc: "세르비아군 근위대는 총참모부의 직접 지휘를 받는 세르비아군의 의장대입니다. 의전 임무 외에도 경비 및 병참 임무를 주요 과업으로 수행합니다."
 SER_kobra: "\\"코브라\\""
 SER_kobra_desc: "특수작전 헌병 분견대 \\"코브라\\"는 총참모부 직속의 세르비아군 헌병 부대입니다. 이 부대는 근접 경호, 대테러 및 특수 작전을 담당합니다."
 SER_training: "훈련 사령부"
 SER_training_desc: "훈련 사령부는 세르비아군 구성원의 훈련을 담당하는 사령부입니다."
 SER_uchenia: "합동 군사 훈련"
 SER_uchenia_desc: "우리 군은 경험이 더 풍부한 국가들로부터 경험을 쌓아야 합니다. 강대국 대표들과 함께 공개 훈련을 실시하기 시작할 것입니다."
 SER_mvd: "내무부"
 SER_mvd_desc: "세르비아 공화국 내무부는 세르비아 정부의 장관급 부처입니다."
 SER_police: "세르비아 경찰"
 SER_police_desc: "세르비아 경찰은 공식적으로 세르비아 공화국 경찰이며, 흔히 세르비아 경찰로 줄여 부르는 세르비아의 국가 민간 경찰력입니다. 세르비아 경찰은 모든 지방 및 국가 단위의 법 집행을 담당합니다. 경찰청을 통해 내무부의 관할을 받습니다."
 SER_jandarmi: "헌병대"
 SER_jandarmi_desc: "헌병대는 위험도가 높고 전문적인 법 집행 임무를 맡은 세르비아의 국가 헌병 조직입니다. 세르비아 경찰의 경찰청 지휘 아래 있습니다."
 SER_anti_terror: "특수 대테러 부대"
 SER_anti_terror_desc: "특수 대테러 부대는 세르비아 경찰의 정예 전술 부대입니다."
 SER_kto: "대테러 부대"
 SER_kto_desc: "대테러 부대는 세르비아 경찰의 전술 부대였습니다."
 SER_zakup: "외국 무기 구매"
 SER_zakup_desc: "우리는 경찰 부대를 위해 무기를 구매할 것입니다."
 SER_military: "개편된 세르비아군"
 SER_defence_doctrine: "국방법"
 SER_usa_exer: "미국과의 훈련"
 SER_sov_exer: "러시아와의 훈련"
 SER_anti_rom_doc: "반루마니아 군사 교리"
 SER_anti_bos_doc: "반보스니아 군사 교리"
 SER_anti_bul_doc: "반불가리아 군사 교리"
 SER_anti_cro_doc: "반크로아티아 군사 교리"
 ser_exer_start: "현재 §Y훈련§!이 진행 중입니다"
 prepare_change_doctrine: "교리를 §Y변경§!할 수 있는 기회가 있습니다"
 SER_korba_TT: "헌병 대대 - §Y\\"코브라\\"§! - 가 창설됩니다"
 SER_guard_TT: "§Y세르비아 근위대§! 대대가 창설됩니다"
 SER_kto_unit: "개편된 내무부"
 SER_exercises_category: "[SER.GetFlag]군사 훈련"
 SER_exercises_category_desc: "\n\n\n\n\n\n£SER_desctext_export_exer \n\n\n\n\n\n\n\n\n§Y우리 군§!은 §R세계적 분쟁§!과 거리가 멀기 때문에 끊임없는 경험이 필요합니다. 우리는 [SOV.GetFlag]§Y러시아§!와 [USA.GetFlag]§Y미국§! 중 어느 나라와 훈련을 실시할지 결정해야 합니다."
 SER_uchenia_with_sov: "[SOV.GetFlag]§Y러시아§!와 훈련 §Y실시§!"
 SER_uchenia_with_usa: "[USA.GetFlag]§Y미국§!과 훈련 §Y실시§!"
 SER_doctrine_category: "[SER.GetFlag]세르비아 군사 교리"
 SER_doctrine_category_desc: "\n\n\n\n\n\n£SER_desctext_export_doctrine \n\n\n\n\n\n\n\n\n§Y군사 교리§!는 [SER.GetFlag]우리나라의 §Y외교 정책§!, 즉 누구를 §R적§!으로 보고 누구를 §G동맹§!으로 보는지를 반영합니다. 우리는 누군가를 §R공격§!할 준비가 되어 있습니까, 아니면 외부의 §R적§!으로부터 §G방어§!하겠습니까?"
 SER_de_fence_doctrines: "[SER.GetFlag]§Y방어§! 교리"
 SER_anti_rom_doctrines: "[ROM.GetFlag]§R반루마니아§! 군사 교리"
 SER_anti_bos_doctrines: "[BOS.GetFlag]§R반보스니아§! 군사 교리"
 SER_anti_bul_doctrines: "[BUL.GetFlag]§R반불가리아§! 군사 교리"
 SER_anti_cro_doctrines: "[CRO.GetFlag]§R반크로아티아§! 군사 교리"
 ser_export.1.t: "자국 무기 구매를 제안하는 세르비아"
 ser_export.1.d: "[SER.GetFlag]세르비아 정부가 유고임포트 SDPR을 통해 자국이 생산하는 특정 무기의 구매를 우리에게 제안해 왔습니다. 수락하시겠습니까?"
 ser_export.1.a: "SPART 구매"
 ser_export.1.b: "전차 구매"
 ser_export.1.c: "소총 구매"
 ser_export.1.e: "세르비아 무기를 도입할 계획은 없다"
 ser_export.2.t: "무기 수출"
 ser_export.2.d: "[FROM.GetFlag]그들이 우리의 SPART를 구매했습니다."
 ser_export.2.a: "좋아"
 ser_export.3.t: "무기 수출"
 ser_export.3.d: "[FROM.GetFlag]그들이 우리의 전차를 구매했습니다."
 ser_export.3.a: "좋아"
 ser_export.4.t: "무기 수출"
 ser_export.4.d: "[FROM.GetFlag]그들이 우리의 소총을 구매했습니다."
 ser_export.4.a: "좋아"
 ser_export.5.t: "무기 수출"
 ser_export.5.d: "[FROM.GetFlag]그들이 우리의 무기 구매를 거절했습니다."
 ser_export.5.a: "슬프군"
 SER_the_kingdom_of_serbia: "새로운 민족주의 세르비아"
 SER_the_kingdom_of_serbia_desc: "세르비아 민족이 굴욕을 겪은 시대를 끝낼 때가 되었습니다. 우리는 민족의 국가적 부흥을 위해 노력할 것입니다."
 SER_ter_down_communist_narratives: "공산주의자 타도"
 SER_ter_down_communist_narratives_desc: "우리는 마르크스주의라는 병의 확산을 막고 세르비아 애국심을 강화해야 합니다!"
 SER_end_modern_decadence: "민족 정신의 부흥"
 SER_end_modern_decadence_desc: "위대한 세르비아 민족의 민족 정신을 되살리는 일을 지금 시작할 것입니다!"
 SER_cultural_reawakening: "문화적 각성"
 SER_cultural_reawakening_desc: "세르비아 문화는 세계에서 가장 위대한 문화 중 하나입니다! 우리는 이를 되살려야 합니다."
 SER_national_reforms: "국가 개혁"
 SER_national_reforms_desc: "첫 개혁안이 곧 준비되어 국민에게 발표될 것입니다. 세르비아인이 자기 영토에서 멸시받는 일은 이제 끝내야 합니다."
 SER_loyal_military: "충성스러운 군대"
 SER_loyal_military_desc: "강한 국가에는 강하고 충성스러운 군대가 있어야 합니다. 우리는 우리나라 군대의 충성을 얻기 위해 싸울 것입니다."
 SER_traditional_family_values: "전통적 가족 가치"
 SER_traditional_family_values_desc: "전통적인 가족은 세르비아 민족이 팽창하는 원동력입니다. 우리에게 서구의 가치는 필요하지 않습니다."
 SER_reinforce_the_population: "국민 무장 강화"
 SER_reinforce_the_population_desc: "모든 세르비아인은 손에 무기를 들고 조국을 지킬 준비가 되어 있어야 하며, 조국이 죽어가는 것을 우리 국민이 다시는 침묵 속에 지켜보게 해서는 안 됩니다."
 SER_autarkal_transition: "자급자족 체제로의 전환"
 SER_autarkal_transition_desc: "우리는 자급자족을 추구할 것이며, 우리 국민은 경제적으로 자립해야 합니다."
 SER_bread_and_mother_serbia: "빵과 어머니 세르비아"
 SER_bread_and_mother_serbia_desc: "우리가 어머니 세르비아를 얼마나 사랑하는지 모두가 알도록 조국을 찬양할 것입니다!"
 SER_rally_the_hope_of_the_people: "국민의 희망 결집"
 SER_rally_the_hope_of_the_people_desc: "희망은 국민이 기적을 일으키게 하는 가장 강력한 원동력입니다! 국민이 우리 민족의 옛 위대함이 돌아오기를 희망하게 합시다."
 SER_nationalize_motor_industries: "자동차 산업 국유화"
 SER_nationalize_motor_industries_desc: "우리는 서구 자본가들에게 아무것도 내주지 않을 것이며, 우리 산업은 우리나라의 것이 될 것입니다!"
 SER_reincorporation_of_resources: "자원 재통합"
 SER_reincorporation_of_resources_desc: "세르비아의 천연자원은 서방 관료들의 손에서 되찾아 올 것입니다."
 SER_luxury_parties_end: "세르비아 내 서구 사상의 종말"
 SER_luxury_parties_end_desc: "서구의 가치는 마침내 세르비아 정치 영역에서 지워질 것이며, 우리는 이러한 사상의 이론가들을 적극적으로 제거할 것입니다."
 SER_kosovo_uprising: "코소보 봉기"
 SER_kosovo_uprising_desc: "우리는 코소보를 되찾을 것이며, 타협은 없습니다."
 SER_reinstate_the_church_in_macedonia: "마케도니아 교회 복원"
 SER_reinstate_the_church_in_macedonia_desc: "우리는 이 나라에 진정한 교회, 참된 교회를 되돌려 놓을 것입니다."
 SER_reinstate_church_bulgaria: "불가리아 교회 복원"
 SER_reinstate_church_bulgaria_desc: "우리는 이 나라에 진정한 교회, 참된 교회를 되돌려 놓을 것입니다."
 SER_independent_frontier: "독립된 국경"
 SER_independent_frontier_desc: "우리 공화국의 국경은 거대한 장벽과 같으며, 적이 그곳을 넘을 수 있다는 어떠한 희망도 주지 않고 철저히 지킬 것입니다."
 SER_nationalist_propaganda: "민족 선전"
 SER_nationalist_propaganda_desc: "우리 인구가 오직 우리 당의 올바른 서사만을 듣도록 해야 합니다!"
 SER_serbian_revanchism: "세르비아 보복주의"
 SER_serbian_revanchism_desc: "우리는 여전히 적들과 우리를 괴롭힌 자들에게 복수할 것입니다. 세르비아어로 레반시즘이라 불리는 이 복수심을, 적들은 두려워하게 될 것입니다."
 SER_legacy_of_stefan_dusan: "두샨의 유산"
 SER_legacy_of_stefan_dusan_desc: "세르비아의 위대한 과거는 많은 국민이 군에 입대하도록 동기를 부여합니다. 오직 무력으로만 우리나라의 옛 위대함을 되찾을 수 있기 때문입니다."
 SER_autark_idea: "세르비아의 자급자족"
 SER_inner_policy: "국내 정책"
 SER_nati_idea: "새로운 국가 정신"
 SER_idea_loyal_military: "충성스러운 군대"
 SER_democratic_ascendant: "민주주의의 부상"
 SER_democratic_ascendant_desc: "민주 국가로서의 우리 역사는 지금부터 시작됩니다. 지역이 매우 불안정한 만큼 우리는 동료 발칸 국가들의 본보기가 되어야 하며, 빛의 등대가 될 것입니다."
 SER_Join_the_united_nations: "국제연합 가입"
 SER_Join_the_united_nations_desc: "과거에는 불가능하거나 단순히 좋지 않은 생각이었으나, 이제 우리에게는 UN에 가입할 충분한 이유가 있습니다."
 SER_increase_federalization: "연방화 확대"
 SER_increase_federalization_desc: "가능한 모든 것을 연방화하고, 우리 사이에 남아 있는 해로운 잡초를 뿌리 뽑기를 기대합시다."
 SER_shift_towards_mixed_economy: "혼합 경제로의 전환"
 SER_shift_towards_mixed_economy_desc: "현재의 경제는 돌아가기는 하지만 번창하지는 못하고 있습니다. 경제 성장의 시대로 나아갈 수 있도록 운영 방식을 바꿔야 합니다."
 SER_protect_local_industries: "지역 산업 보호"
 SER_protect_local_industries_desc: "가족 기업이 운영하는 산업은 우리에게 가장 중요합니다. 이를 없애는 것은 세르비아 국민과 그 추진력의 핵심을 없애는 것입니다."
 SER_protect_landlords: "지주 보호"
 SER_protect_landlords_desc: "지주들 덕분에 부동산 사업이 우리에게 훨씬 수월해집니다. 그들이 없다면 우리는 심각하게 부족해지고 큰 도움이 필요해질 것입니다."
 SER_common_worker: "평범한 노동자"
 SER_common_worker_desc: "세르비아는 이를 움직이는 국민이라는 토대 위에서 돌아갑니다. 어떤 사업을 하든 반드시 그들의 최선의 이익을 마음에 두어야 합니다."
 SER_external_weapons_dev: "외부 무기 개발"
 SER_external_weapons_dev_desc: "우리가 사용하는 무기는 우리가 지휘하는 병사들만큼이나 중요합니다. 국내 생산은 대단치 않지만, 해외에서 적절한 장비를 구매할 수 있습니다."
 SER_international_arms_contracts: "국제 무기 계약"
 SER_international_arms_contracts_desc: "우리는 적을 쓰러뜨릴 무기를 원합니다. 외부 공급원으로부터 사들여 비축할 수 있습니다."
 SER_final_chapters_of_milosevic: "밀로셰비치의 마지막 장"
 SER_final_chapters_of_milosevic_desc: "21세기로 접어들면서, 우리는 국가로서 우리 정부가 시대에 뒤떨어졌으며 진정한 민주주의가 미래의 길임을 깨달아야 합니다. 밀로셰비치의 독재는 끝나야 하며, 이전 지도자들의 모든 허튼짓을 잊고 우리 역사의 새로운 장을 시작해야 합니다. 고토브 예! (끝났다!)"
 SER_Serbian_Arms_Industry: "세르비아 무기 산업"
 SER_Serbian_Arms_Industry_desc: "우리의 무기는 아직 최고가 아닙니다. 총기를 쏟아내고 병사들을 무장시킬 산업을 만들어 봅시다."
 SER_Factory_modernisation: "공장 현대화"
 SER_Factory_modernisation_desc: "우리 공장은 구식이어서 일을 처리하는 데 어려움을 겪고 있습니다. 오늘날 까다로운 국제 경제에서 경쟁할 수 있도록 현대식 기계로 따라잡아야 합니다."
 SER_Defence_Contracts: "방위 계약"
 SER_Defence_Contracts_desc: "계약을 체결하여 일부 무기를 확보할 것입니다. 염두에 둔 기업이 몇 곳 있으며, 연락하여 거래를 협의할 것입니다."
 SER_market_oriented_reforms: "시장 지향 개혁"
 SER_market_oriented_reforms_desc: "밀로셰비치 집권기에 우리는 국제 사회로부터 소외되었고 그 결과 자급자족 경제가 되었습니다. 이제 사회주의의 규칙에 얽매이지 않고 슬로보단 밀로셰비치의 급진적 의제에 발목 잡히지 않으니, 현대에 맞게 시장을 개혁할 수 있습니다."
 SER_Vojvodina_Agriculture: "보이보디나 농업 개발"
 SER_Vojvodina_Agriculture_desc: "보이보디나는 우리 농경지의 절반 이상을 보유하고 있으며, 농업이 세르비아 경제에서 가장 중요한 부문인 만큼 이 지역의 농업 발전을 소중히 여기는 것이 중요합니다."
 SER_crop_field_production: "작물 재배지 생산"
 SER_crop_field_production_desc: "우리 농지는 낼 수 있는 수확에 훨씬 못 미치는 수확량을 내고 있습니다. 관개, 기계, 우량 종자에 투자하면 전국의 작물 생산량이 늘어날 것입니다."
 SER_bluechip_corporations: "블루칩 기업"
 SER_bluechip_corporations_desc: "블루칩 일렉트로닉스(Blue Chip Electronics, Inc.)는 이후 블루칩 인터내셔널로 불렸으며, 1982년 존 로시가 설립한 미국의 컴퓨터 기업이었습니다. 코모도어 가정용 컴퓨터용 주변기기를 개발하기 위해 설립되었으며, 1986년부터 저가의 IBM PC 호환기를 판매하기 시작했습니다."
 SER_fiat_chrysier: "피아트 크라이슬러"
 SER_fiat_chrysier_desc: "피아트 크라이슬러 오토모빌스는 주로 자동차, 상용차, 자동차 부품 및 생산 시스템 제조업체로 알려진 이탈리아-미국계 다국적 기업입니다."
 SER_volkswagen: "폭스바겐"
 SER_volkswagen_desc: "폭스바겐은 독일 니더작센주 볼프스부르크에 본사를 둔 독일의 자동차 제조업체입니다."
 SER_smederevo_steel_mill: "스메데레보 제철소"
 SER_smederevo_steel_mill_desc: "흔히 헤스틸 세르비아로 알려진 HBIS 그룹 세르비아 철강은 본사가 베오그라드에 있는 세르비아의 철강 제조 복합 기업입니다."
 SER_novi_sad_railroad: "노비사드 철도"
 SER_novi_sad_railroad_desc: "노비사드 철도역은 세르비아 노비사드의 중앙 철도역입니다. 현재의 역은 야세 토미차 대로에 위치해 있으며, 오늘날 리만 신선 시장이 있는 자리에 있던 1883년의 옛 철도역이 폐쇄된 뒤 1964년에 개통되었습니다. 이 역은 베오그라드행 고속열차 두 편이 매일 운행하며 부다페스트-베오그라드 철도 사업의 일부입니다."
 SER_Nikola_Tesla_international: "니콜라 테슬라 국제공항"
 SER_Nikola_Tesla_international_desc: "베오그라드 니콜라 테슬라 공항은 세르비아 베오그라드를 오가는 국제공항입니다. 세르비아에서 가장 크고 가장 붐비는 공항이며, 비옥한 저지대에 둘러싸인 교외 지역 수르친 부근, 베오그라드 도심의 서쪽에 위치해 있습니다. 프랑스 복합 기업 뱅시 에어포트가 운영하며, 세르비아계 미국인 발명가 니콜라 테슬라의 이름을 따서 명명되었습니다."
 SER_war_mafia: "마피아와의 전쟁"
 SER_war_mafia_desc: "이제 우리나라의 마피아와 전면적으로 맞서 싸울 때가 되었습니다."
 SER_step_up_inevstigations: "수사 강화"
 SER_step_up_inevstigations_desc: "우리 사회에서 범죄 요소를 완전히 뿌리 뽑으려면 새로운 수사를 시작하고 우리의 모든 움직임을 신중히 가늠해야 합니다."
 SER_legal_framework: "법적 체계"
 SER_legal_framework_desc: "향후 개혁에 필요한 법적 체계를 마련할 것입니다."
 SER_active_combatting: "적극적 소탕"
 SER_active_combatting_desc: "이제 도적들의 은신처를 급습하고 범죄 요소와 적극적으로 맞서 싸울 때가 되었습니다."
 SER_national_assembly: "국민의회"
 SER_national_assembly_desc: "세르비아 국민의회는 세르비아 공화국의 시민을 대표하고 법률을 제정하는 단원제 입법 기관입니다."
 SER_independent_judiciary: "독립된 사법부"
 SER_independent_judiciary_desc: "정부 기관의 권력 분립은 우리의 향후 민주주의 발전을 보장할 것입니다."
 SER_support_serbian_bosniaks: "보스니아 세르비아인 지원"
 SER_support_serbian_bosniaks_desc: "우리는 보스니아 연합 내의 동포들을 지원해야 합니다. 그것은 우리의 가장 높은 의무입니다."
 SER_Redevelop_Ties_with_Bosnia: "보스니아와의 유대 재건"
 SER_Redevelop_Ties_with_Bosnia_desc: "스릅스카의 형제들을 지원하려면 보스니아와의 관계를 재건하고 그들의 경제에 투자하는 것을 고려해야 합니다."
 SER_national_framework: "국가 체제"
 SER_national_framework_desc: "우리는 민족적 가치를 소홀히 하지 않으면서 국가의 번영을 위해 더욱 노력해야 합니다."
 SER_Propose_Open_Balkan_Initiative: "열린 발칸 구상 제안"
 SER_Propose_Open_Balkan_Initiative_desc: "발칸 지역 국가 간 상호 협력을 증진하고 지속 가능한 평화를 보장하려면 우리 나라들 사이의 상호 무역을 늘려야 합니다."
 SER_european_investment: "유럽의 투자"
 SER_european_investment_desc: "유럽 국가들과의 유대를 강화하려면 그들에게 우리에게 투자해 달라고 요청하는 것이 좋겠습니다."
 SER_orthodox_values: "정교회 가치 지지"
 SER_orthodox_values_desc: "정교회 가치는 우리 사회의 기둥이며, 우리는 이를 지원할 것입니다."
 SER_church_and_state: "교회와 국가"
 SER_church_and_state_desc: "우리는 국민의 뜻에 따라 정교회와의 관계를 재정립해야 합니다."
 SER_kosovo_question: "코소보 문제"
 SER_kosovo_question_desc: "2000년, 코소보 문제는 여전히 국제적으로 중요한 우려 사항이었습니다. 알바니아인 대다수의 인구와 세르비아 당국 간의 민족적 긴장이 계속된 끝에, 코소보는 독립을 선언하였고, 1999년에는 인도적 위기를 중단시키기 위한 NATO의 군사 개입이 일어났습니다. 그러나 이 지역의 지위는 여전히 해결되지 않았으며, 코소보와 세르비아 간의 국제적인 중재 하에 협상이 계속되고 있었습니다. 코소보의 주권과 세르비아와의 관계는 여전히 불확실성의 원천이었으며, 외교적 노력은 갈등의 지속 가능한 평화적 해결을 위한 방향으로 집중되었습니다."
 SER_coperate_kosovo_separatists: "코소보 분리주의자와의 협력"
 SER_coperate_kosovo_separatists_desc: "세르비아 인구의 집단 거주지가 여전히 코소보에 남아 있습니다. 우리는 그들과 협력하고 그들의 안전을 보장해야 합니다."
 SER_brussels_agreement: "브뤼셀 협정"
 SER_brussels_agreement_desc: "관계 정상화를 규율하는 원칙에 관한 제1차 협정, 비공식적으로 브뤼셀 협정으로 알려진 이 협정은 세르비아 정부와 코소보 정부 간의 관계를 정상화하기 위한 합의입니다."
 SER_domestic_automotive_industry: "국내 자동차 산업"
 SER_domestic_automotive_industry_desc: "자체 자동차 산업이라는 우리의 유산을 잊어서는 안 되며, 우리는 이 산업의 성공을 우리 경제에 적극적으로 접목하고 있습니다."
 SER_free_elections: "선거법 개정"
 SER_free_elections_desc: "이제 우리 체제를 진정으로 경쟁적이고 민주적으로 만들기 위해 선거법에 변화를 가져올 때입니다!"
 SER_free_elections_again: "밀로셰비치 이후의 세르비아"
 SER_free_elections_again_desc: "밀로셰비치는 자신에게 향한 혁명을 견뎌낼 수 있었음에도 불구하고 우리나라의 대통령직에서 물러났습니다. 조만간 모든 통치자는 자리를 떠나기 마련입니다."
 SER_nova_democratica_stranka: "세르비아 신민주당"
 SER_nova_democratica_stranka_desc: "세르비아 신민주당이 이끄는 연합이 선거에서 승리했습니다! 시민들은 우리 국민의 문화적 특성을 고려하여 민주적 변혁을 이끌 사람으로 우리를 선택했습니다!"
 SER_national_conservatism: "세르비아 민족 보수주의"
 SER_national_conservatism_desc: "우리의 정치는 우리 민족 고유의 사상에 따라 이끌어져야 합니다. 그러한 사상은 전통적 가치와 온건한 민족주의입니다. 그러나 이러한 사상을 절대적인 것으로 격상시킬 수는 없으며, 우리에게는 온건한 민족 보수주의가 필요합니다."
 SER_diplomatic_pragmatism: "강제된 외교적 실용주의"
 SER_diplomatic_pragmatism_desc: "우리는 서방의 직접적인 동맹국이거나 그러한 지위를 주장하는 나라들에 둘러싸여 있습니다. 지역의 안정을 유지하고 주권의 상실을 막으려면 서방의 규칙에 따라야 하지만, 동시에 우리 정책의 다른 방향을 잊어서는 안 됩니다."
 SER_market_corporatism: "시장 조합주의"
 SER_market_corporatism_desc: "자유 시장이 우리가 선호하는 선택이지만, 그 시장의 작동 메커니즘에는 결함이 있습니다. 가장 성공한 대기업을 지원하고 이들 기업과 직원 사이의 대화를 보장하는, 시장 경제에 대한 정부 개입을 요구하는 체제를 만들어야 합니다. 또한 중소기업이 활발히 발전하고 확장할 수 있도록 돕는 여건을 조성하는 것도 중요합니다."
 SER_anti_communist_stance: "반공 노선"
 SER_anti_communist_stance_desc: "공산주의는 세르비아 국민에게 일어난 최악의 일입니다. 우리가 이 공산주의의 멍에를 벗어던질 수 있었음에도 과거 정권의 사상과 그 지지자들은 여전히 인기가 있습니다. 사람들의 정신에서 이 오물을 씻어내기 위한 대규모 캠페인을 벌여야 하며, 주요 선동가들은 전쟁 범죄 혐의에 대해 조사받아야 합니다!"
 SER_anticorruption_action: "부패 척결 운동"
 SER_anticorruption_action_desc: "밀로셰비치 정권은 우리에게 막대한 부패를 남겼습니다. 이는 말 그대로 우리나라의 모든 권력 기관에 존재합니다. 부패를 근절하고 부패한 세력을 일소하기 위한 프로그램을 시작해야 합니다!"
 SER_burrecarcy_destroy: "관료주의에 대한 성전!"
 SER_burrecarcy_destroy_desc: "관료주의는 우리 체제의 아킬레스건입니다. 비대해진 국가 기구는 우리 예산에 큰 타격을 주고 부패도 일으킵니다. 우리는 각 기관의 활동을 감사하고 불필요하고 비효율적인 부서를 없애 예산의 균형을 맞출 것입니다."
 SER_punish_war_criminals: "전쟁 범죄자 처벌"
 SER_punish_war_criminals_desc: "유고슬라비아 전쟁 이후에도 많은 전쟁 범죄자들이 여전히 우리 땅에서 자유롭게 활보하고 있으며, 우리는 이를 바꿔야 합니다."
 SER_spirit_of_gaulism: "드골주의 정신"
 SER_spirit_of_gaulism_desc: "우리는 우리 민족의 역사를 소중히 여기지만, 성공한 외국의 경험을 서로 배우는 것이 우리에게 낯설어서는 안 됩니다. 샤를 드골의 사상은 우리 국민과 가까운 사상으로 볼 수 있습니다. 강한 국가, 전통 사회, 보수적 민주주의, 사회적 번영이라는 사상은 우리 사회에 이상적으로 들어맞습니다!"
 SER_democratica_stranka: "민주당"
 SER_democratica_stranka_desc: "민주당이 연합 동맹들과 함께 선거에서 승리할 수 있었습니다! 세르비아 국민은 우리나라에 유럽의 길이 필요하다는 점을 깨달았고, 자유주의와 유럽 통합이라는 우리의 강령을 지지했습니다!"
 SER_western_approach: "서방에 접근"
 SER_western_approach_desc: "세르비아의 가장 진정한 동맹은 언제나 서방이었습니다. 우리가 밀로셰비치의 독재 정권을 제거하고 군사적 적대 세력을 정리할 수 있었던 것은 서방 덕분이었습니다. 우리는 서방과의 경제적, 외교적 관계를 계속 확립해야 합니다."
 SER_free_market_capitalism: "자유 시장 자본주의"
 SER_free_market_capitalism_desc: "사유 재산의 불가침과 자유 시장 경제는 모든 자유주의 사회의 가장 높은 가치 중 하나입니다. 우리는 정부의 간섭을 최소화하면서 시장 관계가 발전할 수 있는 모든 조건을 만들 의무가 있습니다."
 SER_eu_investments: "EU의 투자"
 SER_eu_investments_desc: "유럽 연합은 발칸 지역, 특히 그 발전에 큰 관심을 가지고 있습니다. 우리는 추가 투자에 관심이 있습니다. 서로 돕는 것이 어떻겠습니까?"
 SER_radical_liberalism: "급진적 자유주의"
 SER_radical_liberalism_desc: "많은 사람들이 우리의 자유주의 강령을 급진적이라 부르며, 세르비아는 그런 변화를 감당할 준비가 되어 있지 않고 우리가 새로운 혁명을 일으키고 있다고 말합니다. 그것은 사실이지만, 마르크스가 \\"혁명은 역사의 기관차다\\"라고 말했듯이 우리의 개혁은 어느 정도 혁명이라고 부를 수 있으므로, 우리는 자랑스럽게 급진적 자유주의자를 자처할 것입니다!"
 SER_multiculturalism: "유럽식 교육"
 SER_multiculturalism_desc: "실제 사례가 보여주듯 유럽 교육 표준으로의 전환은 교육 체계의 효율성을 높이며, 발칸 국가들에서 유럽 표준을 채택한 경험은 세르비아에도 적용될 수 있습니다."
 SER_antimilitarism: "반군국주의"
 SER_antimilitarism_desc: "군국주의는 우리 사회의 병폐입니다. 비대해진 군사 예산과 공공 생활의 군사화는 적대국에 대한 불가피한 방어 조치로 우리에게 제시되었지만, 우리는 사실상 진보와 문명에 맞서 스스로를 방어하려 했던 것입니다. 세르비아에서 반군국주의가 승리했으며, 이제 군 예산을 삭감할 때입니다."
 SER_miracle_of_european_system: "유럽 체제의 기적"
 SER_miracle_of_european_system_desc: "우리는 세르비아에 이상적인 유럽 모델을 구축하는 길에 있습니다. 이 모델은 한때 서방 국가들에 번영과 진보를 가져왔으며 이제 우리나라에 진보를 가져와 진정한 기적을 만들어낼 것입니다!"
 SER_progressivna_stranka: "스릅스카 나프레드나 스트란카"
 SER_progressivna_stranka_desc: "세르비아 진보당이 이끄는 세르비아 애국 세력 연합이 선거에서 승리했습니다. 나라는 오랫동안 불안정과 불확실성에 시달려 왔으며, 이제 안정과 경제 성장을 나라에 되돌릴 때입니다. 세르비아는 멈춰서는 안 됩니다!"
 SER_economic_stimulation: "세르비아 경제 부양"
 SER_economic_stimulation_desc: "우리는 경제가 추락하는 것을 그저 앉아서 지켜볼 수 없습니다. 경제 성장을 부양하는 정책이 필요하며, 경제 규제 수단과 올바른 경제 운영을 활용해야만 불안정한 상황에서 벗어날 수 있습니다."
 SER_eastern_investments: "동방과의 접촉"
 SER_eastern_investments_desc: "진보적인 세르비아에는 전 세계와의 교류를 포함하는 진보적인 다방면 정책이 필요합니다. 우리의 동쪽에는 우리에게 우호적인 러시아와 발칸 발전에 관심이 있는 중국이 있습니다. 그렇다면 그들을 우리의 유망한 경제에 투자하도록 초청하는 것이 어떻겠습니까?"
 SER_western_investments: "서방 투자자 초청"
 SER_western_investments_desc: "우리의 다방면 정책은 서방 국가들과의 긴밀한 협력도 전제로 합니다. 우리는 경제 발전을 위해 많은 서방 투자자를 유치할 수 있습니다."
 SER_populism: "세르비아 포퓰리즘"
 SER_populism_desc: "우리는 종종 포퓰리스트라 불리며, 말만 할 수 있을 뿐 실제로는 결정조차 내리지 못한다고들 합니다. 그러나 우리는 포퓰리즘을 우리 방식으로 이해합니다. 우리에게 포퓰리즘은 대중주의이며, 우리는 끝까지 국민을 섬기고 국민의 의견을 경청하며 오직 국민의 편에 설 준비가 되어 있습니다!"
 SER_anticor_mesuars: "부패 방지 조치"
 SER_anticor_mesuars_desc: "부패와의 싸움은 우리가 선거에 나서며 한 약속입니다. 이제 약속을 이행할 때입니다. 우리는 부패 방지 부서의 모든 역량을 동원하여 나라에서 이 병을 일소할 것입니다!"
 SER_centralisation_police: "경찰력 중앙집권화"
 SER_centralisation_police_desc: "우리나라에 민주주의가 도래하면서 우리에 앞선 자유주의 정부들은 당분간 경찰이 불필요하다고 판단하여 경찰력을 점차 해체했습니다. 사회 질서를 강화하려면 경찰에 자금을 되돌려 주어야 합니다."
 SER_social_democracy: "사회민주연합"
 SER_social_democracy_desc: "사회민주연합이 이끄는 연합이 선거에서 승리했습니다! 우리 국민은 나라에 번영을 가져올 수 있는 두 가지 사상인 반군국주의와 사회민주주의의 길을 선택했습니다."
 SER_social_security: "사회 보장"
 SER_social_security_desc: "우리에게 가장 중요한 것은 시민들에게 높은 생활 수준을 보장하고 좋은 삶의 기회를 주는 것입니다. 사회 지출을 늘려야 합니다!"
 SER_social_market: "사회적 시장"
 SER_social_market_desc: "자유 시장이 선호되는 경제 체제이긴 하지만, 시장이 평범한 사람을 대하는 방식은 용납할 수 없습니다. 국가는 사회적 보호 조치와 자유 시장을 모두 결합한 체제를 만들어야 합니다."
 SER_social_dem: "세르비아 사회민주주의"
 SER_social_dem_desc: "우리의 핵심 이념은 사회민주주의이며, 이는 서구 사회가 위대함을 이룬 이유입니다. 우리는 파트너들의 경험을 활용하여 사회민주주의를 우리 정부의 지침으로 삼을 것입니다."
 SER_antiauthoritarism: "반권위주의"
 SER_antiauthoritarism_desc: "우리 사회의 가장 큰 두려움은 권위주의와 독재라는 나락으로 되돌아가는 것입니다. 우리를 뒤로 끌어당기는 자들을 사회에서 근절하기 위해 모든 노력을 다할 것입니다!"
 SER_support_unions: "노동조합 지원"
 SER_support_unions_desc: "노동조합은 우리 사회에서 상당히 중요한 기능, 즉 기업가에게 억압받는 평범한 노동자를 보호하는 기능을 합니다. 우리는 시민들의 경제적 평등을 보장하기 위해 노동조합을 지원할 의무가 있습니다."
 SER_western_dominance: "서방의 우위"
 SER_western_dominance_desc: "서방은 세계 무대에서 우리의 주요 동맹이며, 그 도움은 아무리 높이 평가해도 지나치지 않습니다. 따라서 우리의 외교 정책에서 서방 노선이 우위를 점해야 합니다."
 SER_balkan_social_democracy: "발칸반도의 사회민주주의"
 SER_balkan_social_democracy_desc: "발칸에는 진정한 사회민주주의 국가의 좋은 본보기가 없었습니다... 지금까지는 말입니다. 우리는 조화롭고 평등한 사회를 만드는 방법의 본보기가 되었습니다!"
 SER_neutral_souverign: "발칸반도의 사회민주주의"
 SER_neutral_souverign_desc: "우리는 서방과 동방이 밧줄을 잡아당겨 우리를 자기편으로 끌어가려는 환경 속에 있지만, 우리는 누구의 괴뢰도 되지 않을 것입니다! 우리는 우리만의 다방면 정책을 추구하고 국내의 안정을 보장할 것입니다!"
 SER_socialist_party: "세르비아 사회당"
 SER_socialist_party_desc: "과거에 밀로셰비치를 중심으로 한 정당이었으나, 이제는 새로운 이미지를 만들고 새로운 민주 체제에 편입하려 하고 있습니다. SPS는 1990년 세르비아 공산주의자 동맹과 세르비아 노동 인민 사회주의 동맹이 합쳐져 창당되었으며, 슬로보단 밀로셰비치가 초대 대표를 맡았습니다."
 SER_popular_socialism: "대중 사회주의"
 SER_popular_socialism_desc: "우리의 새로운 사회주의 의제는 평범한 민중을 중심으로 해야 합니다. 그들의 기대를 충족시키는 것이 우리의 의무입니다!"
 SER_implement_economic_regulations: "경제 규제"
 SER_implement_economic_regulations_desc: "시장이라는 무서운 괴물이 우리 국민을 억압하도록 내버려 두어서는 안 됩니다! 우리 국민의 이익이 보호되도록 시장을 규제해야 합니다."
 SER_green_initiatives: "녹색 구상"
 SER_green_initiatives_desc: "우리는 경제를 위해 더 건강한 경제적 해법을 제시해야 합니다. 우리의 자연을 희생해서는 안 됩니다!"
 SER_hard_pragmatism: "강경한 실용주의"
 SER_hard_pragmatism_desc: "독일과 오스트리아는 우리나라에 투자하려는 의지를 보였습니다. 과거의 관계는 긴장되었지만, 우리는 좋은 사업 관계를 맺으려 노력할 수 있습니다."
 SER_promote_traditions: "전통 장려"
 SER_promote_traditions_desc: "세르비아 정교회는 우리를 사람이자 민족으로 형성해 왔습니다. 우리의 정체성을 지키려면 우리의 전통을 지지해야 합니다. 누군가는 결국 하느님은 세르비아인이라고 말합니다..."
 SER_medicine_for_everyone: "모두를 위한 의료"
 SER_medicine_for_everyone_desc: "우리나라의 모든 사람에게 의료가 제공되도록 해야 합니다."
 SER_socialist_renewal: "사회주의 쇄신"
 SER_socialist_renewal_desc: "마침내 우리의 정책이 정점에 이르렀고 우리의 모든 계획이 완료되었습니다!"
 SER_support_border_closure: "국경 폐쇄 지지"
 SER_support_border_closure_desc: "우리는 코소보의 공세에 대비하여 코소보와의 국경을 준비해야 합니다. 대비하고 있어야 합니다."
 SER_de_escalation: "긴장 완화"
 SER_de_escalation_desc: "평화와 번영을 보장하기 위해 코소보 상황을 완화해야 합니다."
 SER_kosovo_is_serbia: "코소보는 세르비아다!"
 SER_kosovo_is_serbia_desc: "우리는 코소보를 공격하기 위해 우리의 안녕을 희생할 수 없습니다. 하지만 그들을 승인할 수도 없습니다!"
 SER_recognize_kosovo: "코소보 대학살 인정"
 SER_recognize_kosovo_desc: "Although the Albanian conquest of Kosovo was unfair, we must bury the hatchet once and for all."
 SER_further_belt_and_road_cooperation: "일대일로 협력"
 SER_further_belt_and_road_cooperation_desc: "중국은 우리나라에 투자하는 데 매우 관심이 많습니다. 우리는 이를 우리의 이익을 위해 활용해야 합니다."
 SER_jp_electric_power_industry_of_serbia: "JP 엘렉트로프리브레다 스르비예"
 SER_jp_electric_power_industry_of_serbia_desc: "엘렉트로프리브레다 스르비예는 세르비아 정부가 전액 소유한 주식회사 형태의 전력 공기업으로, 본사는 세르비아 베오그라드에 있습니다."
 SER_renewed_serbia: "새로워진 세르비아!"
 SER_renewed_serbia_desc: "세르비아가 마침내 새로워졌으며, 더 이상 과거의 그림자에 불과하지 않게 되었습니다!"
 SER_end_isolationism: "고립주의 종식"
 SER_end_isolationism_desc: "우리는 고립을 멈추고 이웃 나라들과 교류하기 시작해야 합니다."
 SER_crush_the_old_system: "낡은 체제 분쇄"
 SER_crush_the_old_system_desc: "낡은 통치 체제는 파괴되어야 하며 새로운 체제가 수립되어야 합니다."
 SER_revive_cefta: "CEFTA 협정"
 SER_revive_cefta_desc: "중부유럽 자유무역협정은 유럽 연합 회원국이 아닌 국가들 사이의 비세그라드 협정을 계승한 자유무역 기구입니다."
 SER_new_constitution: "새 헌법"
 SER_new_constitution_desc: "우리나라가 개혁의 길을 더 나아갈 수 있도록 확실히 하기 위해 헌법을 바꿔야 합니다."
 SER_democratic_system: "인권 보장"
 SER_democratic_system_desc: "우리나라는 새로운 세계 질서에 제대로 부합하고 다른 유럽 국가들과 협력하기 위해 인권을 존중하기 시작해야 합니다."
 SER_loosened_union: "느슨해진 연합"
 SER_loosened_union_desc: "몬테네그로와의 연합은 언제든 붕괴할 수 있습니다. 이제 몬테네그로에 더 큰 자치권을 부여하고 그들의 바람을 충족시켜 우리 연합을 개혁할 때입니다."
 SER_economic_autonomy: "경제 자치"
 SER_economic_autonomy_desc: "우리는 형제들에게 일종의 경제적 자치를 부여하고 빠른 경제 성장을 위한 자극을 주어야 합니다."
 SER_shared_currency: "공동 통화"
 SER_shared_currency_desc: "몬테네그로를 진정으로 자치적으로 만들려면 그들을 위한 새로운 통화를 만들어야 합니다. 이는 발전을 위한 더욱 평등한 조건을 만들 것입니다."
 SER_a_new_start: "새출발"
 SER_a_new_start_desc: "우리 연합의 새로운 시대가 시작되었습니다! 우리의 개혁은 몬테네그로 지역에 안정을 가져왔고, 우리는 그들에게 세르비아와 동등한 권리를 줄 준비가 되어 있습니다."
 SER_involve_un: "UN과의 회담"
 SER_involve_un_desc: "몬테네그로와의 이 연합은 붕괴 직전에 있습니다. 이를 원만하고 신속하게 처리하기 위해, UN과 국제 사회에 주권 국가 몬테네그로를 만드는 일에 관여하고 도와 달라고 요청할 것입니다."
 SER_begin_the_recognition_process: "승인 절차 개시"
 SER_begin_the_recognition_process_desc: "우리는 연합 해체와 세르비아 및 몬테네그로 국가 수립에 대한 승인을 얻기 위한 국제 캠페인을 시작해야 합니다."
 SER_remove_previous_kleptocrats: "이전 도둑 정치인 제거"
 SER_remove_previous_kleptocrats_desc: "우리는 세르비아에 더 큰 고통을 가져오고 있는 과거 정권의 도둑 정치인들을 제거할 것입니다."
 SER_free_at_last: "마침내 자유"
 SER_free_at_last_desc: "우리는 이 불경한 연합을 원만하고 신속하게 해체하는 데 성공했습니다. 세르비아 역사의 새로운 장입니다. 새로운 세르비아 공화국 만세!"
 SER_eu_integration: "EU와의 협력 모색"
 SER_eu_integration_desc: "우리는 지리적으로 대부분 유럽 연합 회원국에 둘러싸여 있습니다. 경제와 무역을 활성화하기 위해 협력하고 어쩌면 EU 가입까지도 모색해야 합니다."
 SER_national_conservatism_idea: "민족 보수주의"
 SER_liberal_corporatism_idea: "자유주의적 조합주의"
 SER_anticomm_idea: "반공 행동"
 SER_degaull_idea: "드골의 정신"
 SER_radical_liberalism_idea: "급진적 자유주의"
 SER_free_market_idea: "자유 시장"
 SER_model_democracy_idea: "유럽식 민주주의"
 SER_populismus_idea: "세르비아 포퓰리즘"
 SER_anticorruption_measures_idea: "부패 방지 조치"
 SER_econom_stim: "경제 부양"
 SER_souverign_nat: "중립과 주권"
 SER_social_dem_idea: "사회민주주의"
 SER_antiauth_idea: "권위주의 단속"
 SER_unions_supp_idea: "노동조합 지원"
 SER_social_mark_idea: "사회적 시장"
 SER_balkan_soc_dem_idea: "발칸 사회민주주의"
 SER_people_socialism_idea: "대중 사회주의"
 SER_implement_econ_reg_idea: "경제 규제 시행"
 SER_traditions_enrolled_idea: "전통 편입"
 SER_socialist_renew_idea: "사회주의 쇄신"
 SER_cefta_idea: "CEFTA"
 SER_cefta_idea_desc: "중부유럽 자유무역연합은 유럽 연합 회원국이 아닌 국가들 사이의 비세그라드 협정을 계승한 자유무역 기구입니다."
 SER_idea_rights: "인권 보장"
 SER_shared_currency_idea: "공동 통화"
 SER_listened_un_idea: "국제 사회의 지지"
 SER_ditched_subject_idea: "몬테네그로로부터의 해방"
 SER_ditched_subject_idea_desc: "연합 해체에는 좋은 점도 있습니다. 그중 하나는 몬테네그로에 돈을 쓸 필요가 없다는 것입니다."
 SER_mixed_economy: "혼합 경제"
 SER_mixed_economy_desc: "우리가 자급자족식 경제 접근을 계속했다면 세르비아는 21세기에 결코 살아남지 못했을 것입니다. 우리는 세계에 문을 열었고 이제 세계도 우리에게 문을 열었습니다."
 SER_bluechip_corp: "블루칩 기업"
 SER_bluechip_corp_desc: "블루칩 일렉트로닉스(Blue Chip Electronics, Inc.)는 이후 블루칩 인터내셔널로 불렸으며, 1982년 존 로시가 설립한 미국의 컴퓨터 기업이었습니다. 코모도어 가정용 컴퓨터용 주변기기를 개발하기 위해 설립되었으며, 1986년부터 저가의 IBM PC 호환기를 판매하기 시작했습니다."
 SER_disorganized_industrial_sector_desc: "우리 산업은 여전히 곳곳이 무질서하고 혼란스럽습니다. 정부 전환과 함께 사회주의 경제에서 정부 소유였던 탓에 우리 산업의 계약이 만료되었으며, 독립 이후 벨라루스 산업에서 벌어졌던 상황이 되풀이되었습니다!"
 ser_dem.1.t: "투자를 원하는 세르비아"
 ser_dem.1.d: "세르비아 대표들이 우리에게 접근하여 세르비아 경제에 대한 투자를 요청했습니다. 이것은 우리가 붙잡아야 할 좋은 기회입니까, 아니면 그들의 요청을 무시하기로 하겠습니까?"
 ser_dem.1.a: "산업 단지면 충분할 것이다."
 ser_dem.1.b: "새 도로면 괜찮을 것이다."
 ser_dem.1.c: "세르비아가 정말 원하는 것은 네트워크 기반시설이다."
 ser_dem.1.f: "다음 기회에, 아마도."
 ser_dem.2.t: "그들의 동의!"
 ser_dem.2.d: "외국 세력이 우리에게 투자하기로 동의했습니다!"
 ser_dem.2.a: "만세!"
 ser_dem.3.t: "그들의 거절!"
 ser_dem.3.d: "외국 세력이 우리에게 투자하는 것을 거절했습니다!"
 ser_dem.3.a: "안타깝군!"
 ser_dem.4.t: "외교 정책"
 ser_dem.4.d: "우리는 누구와 협력할지 신중하게 선택해야 합니다. 서방 열강과 접촉할 수도 있고, 동방 진영과 가까워지려 할 수도 있습니다. 또는 우리 지역의 국가들과 협력할 수도 있습니다."
 ser_dem.4.a: "동방이 우리의 선택이다"
 ser_dem.4.b: "...하지만 우리는 여전히 서방 민주주의 국가다."
 ser_dem.4.c: "발칸은 평화로워야 한다!"
 ser_dem.5.t: "세르비아 급진당 내 분쟁!"
 ser_dem.5.d: "세르비아 급진당 내에서 갈등이 벌어졌습니다. 당의 사실상 지도자인 토미슬라프 니콜리치가 보이슬라프 셰셀리가 대표하는 당 중앙위원회와 충돌했으며, 이제 니콜리치와 알렉산다르 부치치는 측근들과 함께 당을 떠나 자신들만의 새로운 조직을 만들겠다고 위협하고 있습니다."
 ser_dem.5.a: "니콜리치와 부치치가 새 정당을 만들 것이다!"
 ser_dem.5.b: "분쟁은 해결될 것이다"
 SerbiaFocus.1.t: "열린 발칸 구상"
 SerbiaFocus.1.d: "[SER.GetName]이(가) \\"열린 발칸 구상\\"이라는 새로운 구상에 서명할 것을 제안했습니다. 이 구상은 우리 나라들 사이의 경제 성장과 무역을 늘리는 것을 목표로 하며, 지역 안정을 개선하는 것 또한 목표로 합니다."
 SerbiaFocus.1.a: "어디에 서명하면 되지?"
 SerbiaFocus.1.b: "절대 안 된다!"
 SerbiaFocus.2.t: "구상에 서명한 [FROM.GetName]!"
 SerbiaFocus.2.d: "[FROM.GetName]이(가) 열린 발칸 구상에 서명하기로 결정한 듯하며, 지역의 경제 성장을 촉진하기 위해 협력할 것입니다!"
 SerbiaFocus.2.a: "좋은 소식이다"
 SerbiaFocus.3.t: "구상에 서명하기를 거부한 [FROM.GetName]!"
 SerbiaFocus.3.d: "[FROM.GetName]은(는) 우리 및 우리의 구상과 아무 관계도 맺고 싶어 하지 않습니다. 따라서 이 협정을 확대할 가능성은 잊어야 할지도 모릅니다."
 SerbiaFocus.3.a: "슬프군"
 SerbiaFocus.4.t: "국민투표 실시를 요구하는 [FROM.GetName]"
 SerbiaFocus.4.d: "[FROM.GetName]이(가) 스릅스카 공화국 영토에서 국민투표를 실시하고 더 많은 자치권을 부여할 것을 요구하고 있습니다. 그들은 분명 무언가를 꾸미고 있습니다. 우리 지역에 자치권을 부여하겠습니까, 아니면 베오그라드의 압력을 무시하겠습니까?"
 SerbiaFocus.4.a: "양보하자"
 SerbiaFocus.4.b: "그들을 무시한다"
 SerbiaFocus.5.t: "스릅스카 공화국의 운명"
 SerbiaFocus.5.d: "[FROM.GetName]은(는) 우리가 원했던 대로 우리의 압력에 굴복하여 스릅스카 공화국에 자치권을 부여하기로 동의했습니다."
 SerbiaFocus.5.a: "좋아"
 SerbiaFocus.6.t: "스릅스카 공화국의 운명"
 SerbiaFocus.6.d: "[FROM.GetName]은(는) 우리의 압력에도 불구하고 스릅스카 공화국에 자치권을 부여하기를 거부했습니다."
 SerbiaFocus.6.a: "그들은 더 큰 대가를 치르게 될 것이다"
 Serbia.20.t: "우리에게 중재자가 되어 달라고 요청하는 세르비아!"
 Serbia.20.d: "세르비아의 새 정부가 우리에게 코소보와 세르비아 사이의 중재자가 되어 달라고 요청했습니다."
 Serbia.20.a: "물론이지!"
 Serbia.20.b: "헤, 잘 가라."
 Serbia.21.t: "동의하지 않은 그들"
 Serbia.21.d: "그들은 협상을 마련하기를 원하지 않습니다."
 Serbia.21.a: "으억"
 Serbia.22.t: "브뤼셀 회담"
 Serbia.22.d: "최근 브뤼셀에서 열린 회담에서 세르비아는 우리와 그들 사이의 관계 정상화 협정을 제안했습니다."
 Serbia.22.a: "동의한다"
 Serbia.22.b: "안된다"
 Serbia.23.t: "코소보의 동의!"
 Serbia.23.d: "그들이 협정에 서명했습니다."
 Serbia.23.a: "매우 좋다!"
 Serbia.24.t: "동의하지 않은 코소보"
 Serbia.24.d: "그들은 협정에 서명하기를 원하지 않습니다."
 Serbia.24.a: "매우 유감이다."
 serbia_news.2.t: "코소보를 승인한 세르비아!"
 serbia_news.2.d: "중대한 외교적 진전으로, 세르비아가 코소보를 독립 국가로 공식 승인하여 오랜 분쟁에서 역사적인 전환점을 맞았습니다. 이 결정은 치열한 협상 끝에 나왔으며, 두 발칸 이웃 국가 간 관계 정상화를 향한 의지를 반영합니다. 이 획기적인 조치는 지역의 협력과 안정을 위한 새로운 길을 열 것으로 보이며, 경제적, 정치적 통합 확대로 가는 길을 닦을 가능성이 있습니다. 과제는 분명히 남아 있지만, 이 행보는 발칸에서 화해와 평화적 공존을 향한 유망한 첫걸음을 알립니다."
 serbia_news.2.o1: "흥미롭군"
 SerbiaFocus.21.t: "투자를 제안하는 세르비아!"
 SerbiaFocus.21.d: "최근 세르비아가 우리나라에 투자하겠다고 제안했습니다. 이는 보스니아 세르비아인들의 호감도를 높이고 우리에게 경제적 이익을 가져다주겠지만, 보스니아계 무슬림의 호감도를 낮추고 우리에 대한 세르비아의 영향력을 높일 수도 있습니다. 동의하겠습니까?"
 SerbiaFocus.21.a: "동의한다!"
 SerbiaFocus.21.b: "안된다"
 SerbiaFocus.22.t: "보스니아의 동의!"
 SerbiaFocus.22.d: "우리는 공장 건설 비용을 일부 충당하기 위해 35억 달러를 지출합니다. 우리는 그들에 대한 영향력을 5% 얻습니다."
 SerbiaFocus.22.a: "좋아"
 SerbiaFocus.23.t: "동의하지 않은 보스니아"
 SerbiaFocus.23.d: "그들은 우리의 투자를 원하지 않습니다."
 SerbiaFocus.23.a: "매우 유감이다."
 SerbiaFocus.14.t: "투자를 요청하는 세르비아!"
 SerbiaFocus.14.d: "세르비아가 우리나라에 자신들에게 투자해 달라고 요청하고 있습니다. 동의하겠습니까?"
 SerbiaFocus.14.a: "물론이지!"
 SerbiaFocus.14.b: "미안하지만, 안된다"
 SerbiaFocus.15.t: "[FROM.GetNameWithFlag]의 수락!"
 SerbiaFocus.15.d: "그들이 우리나라에 투자할 것입니다."
 SerbiaFocus.15.a: "좋아"
 SerbiaFocus.16.t: "우리 제안을 수락하지 않은 [FROM.GetNameWithFlag]"
 SerbiaFocus.16.d: "그들은 우리나라에 투자하기를 원하지 않습니다."
 SerbiaFocus.16.a: "으억"
 SerbiaFocus.13.t: "세르비아에서 체포된 세르비아 전쟁 범죄자들!"
 SerbiaFocus.13.d: "세르비아의 새 정부는 많은 고민 끝에 이전 정치인과 군 지휘관 다수를 체포하여 재판에 회부하기로 결정했습니다. 그들 중 다수는 헤이그에서 재판을 받게 될 것입니다."
 SerbiaFocus.13.a: "흥미롭군"
 Serbia.3.tt.a: "§Y조란 진지치의 암살 시도를 막을 것은 아무것도 없을 것이다§!"
 Serbia.14.t: "힘을 얻는 [MNT.GetFlag] [MNT.GetAdjective] 독립 운동"
 Serbia.14.d: "[MNT.GetFlag] [MNT.GetAdjective] 사람들은 한동안 독립을 추진해 왔으며, 우리가 이를 막으려 한다면 이 대의를 위해 싸울 의지가 있을 가능성이 점점 더 높아 보입니다."
 Serbia.14.a: "어떻게 되는지 지켜보자"
 Serbia.15.t: "[MNT.GetFlag] [MNT.GetName] 연합"
 Serbia.15.d: "대규모 국민투표를 통해 [MNT.GetFlag] [MNT.GetName]은(는) [SER.GetFlag] [SER.GetName](우리)에서 벗어나 세계에서 자신들의 이익을 추구하기로 결정했습니다. 이미 많은 국가가 그들의 독립을 승인하기 시작했고 안보 및 기타 사안에 대한 외교 회담을 시작한 듯합니다."
 Serbia.15.a: "그들 스스로의 선택이었다."
 Serbia.16.t: "폭력적으로 변하는 [MNT.GetFlag] [MNT.GetAdjective] 운동!"
 Serbia.16.d: "[MNT.GetFlag] [MNT.GetAdjective] 운동이 폭력적으로 변했으며, 그들을 통제하려는 우리의 시도에 맞선 실질적인 반란이 시작된 듯합니다. 우리는 이 위험한 정치적 도박에서 완전히 물러나거나, 그들의 저항 운동을 진압하려는 노력을 배가해야 합니다."
 Serbia.16.a: "우리는 물러서지 않는다!"
 Serbia.16.b: "그거 아나? 독립을 가져라."
 Serbia.17.t: "잦아드는 [MNT.GetFlag] [MNT.GetAdjective] 운동"
 Serbia.17.d: "[MNT.GetFlag] [MNT.GetAdjective] 저항 운동은 다행히도 우리의 숙련된 보안군과 정치인들에 의해 진압되었습니다. 이제 거리에서 그들과 싸우는 것을 걱정할 필요는 없지만, 지역에 입힌 피해를 복구하는 것을 걱정해야 합니다."
 Serbia.17.a: "당연한 결과다."
 SerbiaFocus.11.t: "세르비아의 민주주의 전환!"
 SerbiaFocus.11.d: "세르비아는 불도저 혁명 이후 민주주의의 새벽을 맞이하고 있습니다. 시민들의 끈질긴 시위가 구체제를 몰아냈으며, 이는 투명성과 책임성의 새 시대를 알립니다. 세르비아가 변화를 받아들이며 더 밝은 미래에 대한 희망을 알리는 가운데 세계가 지켜보고 있습니다."
 SerbiaFocus.11.a: "마침내"
 serbia_news.1.t: "UN에 가입한 [SER.GetName]"
 serbia_news.1.d: "[SER.GetAdjective] 정부는 원래 유고슬라비아 붕괴 이후 [SER.GetAdjective] 민족 영토의 회복에 대한 국가의 지속적인 헌신을 이유로 국제연합 가입을 거부해 왔습니다.\n\n이제 이 문제에 대한 국민투표를 거쳐 [SER.GetAdjective] 정부는 관망자의 입장을 버리고 정회원으로서 이 기구에 가입하기로 했다고 발표했습니다."
 serbia_news.1.o1: "이제야 때가 되었군, [SER.GetName]!"
 SerbiaFocus.12.t: "평화 보장을 모색하는 세르비아"
 SerbiaFocus.12.d: "민주 혁명 이후 세르비아의 새 정부는 평화적인 지역 협력을 수립하기 위해 손을 내밀었습니다. 그들은 상호 평화 보장, 무역 협정, 외교 정상화를 제안합니다. 이는 발칸의 새로운 안정의 시대를 알리는 신호일 수 있습니다. 그들의 제안에 어떻게 응답하겠습니까?"
 SerbiaFocus.12.a: "물론이지!"
 SerbiaFocus.12.b: "안된다"
 Serbia.19.t: "수감된 밀로셰비치!"
 Serbia.19.d: "최근 세르비아 혁명 이후 슬로보단 밀로셰비치는 자신의 범죄로 수감되었으며 곧 헤이그에서 재판을 받게 될 것입니다."
 Serbia.19.a: "혈기 왕성한 민족주의자들을 억누르자..."
 Serbia.19.b: "이 범죄에 대한 민족적 대응이 필요하다!"
 Serbia.1.d: "준군사 조직 아르칸의 호랑이들의 전 지휘관이자 츠르베네 베레트케의 장교이며 사업가인 젤코 라즈나토비치, 일명 아르칸이 베오그라드의 호텔 콘티넨탈에서 친구들과 술을 마시던 중 암살 시도를 당했습니다. 23세의 기동 경찰 여단 하급 대원인 저격범 도브로사브 가브리치는 아르칸의 왼쪽 눈과 그의 친구들 및 행인 몇 명을 맞혔습니다. 가브리치는 도주 중 총격을 받고 체포되었으며, 의사들은 아르칸을 살리기 위해 애쓰고 있습니다. 그는 죽을 운명입니까?"
 Serbia.1.a: "조의를 표한다"
 Serbia.1.b: "그를 죽게 내버려 둘 수 없다"
 Serbia.1.tt: "§Y아르칸은 죽을 것이다!§!"
 Serbia.2.d: "젤코 라즈나토비치는 호텔 콘티넨탈 총격 사건 5일 후인 2000년 1월 20일 노보 그로블레에 묻혔습니다. 수천 명이 참석했는데, 그중에는 레드 스타 베오그라드 울트라스와 그가 몸담았던 준군사 및 범죄 지하 세계의 인물들이 있었습니다. 살해를 사주한 혐의로 유죄 판결을 받은 사람은 아직 없으며, 이는 무작위 폭력 행위라기보다는 청산으로 널리 해석되고 있습니다. 우리는 그의 죽음을 어떻게 기리겠습니까?"
 Serbia.2.a: "죽은 이들을 위한 장례를 치른다"
 Serbia.2.b: "격분할 일이다! 국제 무대에서 이를 규탄하자!"
 Serbia.3.d: "세르비아 범죄 지하 세계가 조란 진지치를 달가워하지 않는다는 사실이 우리 귀에 들어왔습니다. 제문파는 야당을 권력에서 몰아내기 위해 3월 12일 계획된 암살을 실행하고자 전 JSO 부대원들을 이용하고 있습니다. 우리는 그에게 경고하여 이를 막을 수 있지만, 반드시 그래야 할 의무는 없습니다."
 Serbia.3.a: "즉시 그에게 공격에 대해 경고한다!"
 Serbia.3.b: "어떻게 되는지 지켜보자, 응?"
 Serbia.5.d: "크랄레보에 규모 5.5의 지진이 발생했습니다. 국민을 위해 내진 인프라를 우선할지, 산업 시설을 보호할지 결정해야 합니다."
 Serbia.5.a: "공장은 구할 수 없다. 국민을 위한 내진 기반시설을 설치하고 여진에 대비해 몸을 낮춘다"
 Serbia.5.b: "산업 건물을 우선시한다. 우리 경제는 그런 타격을 견딜 수 없다"
 Serbia.5.tt: "§Y향후 지진이 우리를 덮친다면 제대로 대비하지 못할 것이다.§!"
 Serbia.6.d: "사이클론 타마라가 우리나라에 심각한 홍수를 일으켜 인명 피해와 사회기반시설 파손이 발생했습니다."
 Serbia.6.a: "참으로 유감이다"
 Serbia.7.d: "돌발 홍수로 농업이 피해를 입었습니다. 농민 지원과 인구 밀집 지역 지원 중 무엇을 우선할지 결정해야 합니다."
 Serbia.7.a: "지금은 농민들이 누구보다 더 많은 도움이 필요하다"
 Serbia.7.b: "가장 밀집된 인구를 무시할 수 없다"
 Serbia.8.t: "다뉴브강의 시안화물 유출"
 Serbia.8.d: "금광 회사 아우룰이 일으킨 루마니아 바이아마레 인근의 시안화물 유출이 소메슈강, 티서강, 다뉴브강을 오염시켰습니다. 이 재난으로 헝가리, 세르비아, 루마니아에서 많은 물고기가 죽어가고 있으며, 현재 체르노빌 이후 유럽 최악의 환경 재난으로 불리고 있습니다."
 Serbia.8.a: "외국 자원 채굴 기업을 탓한다"
 Serbia.8.b: "루마니아와 협력하여 정화 작업을 한다"
 Serbia.9.d: ""
 Serbia.9.a: "전국적인 수사를 시작한다. '사브르 작전'을 전면 시행한다."
 Serbia.9.b: "참으로 유감이다. 또 한 명이 쓰러졌군..."
 Serbia.10.d: ""
 Serbia.10.a: "저 빌어먹을 DSS의 책임이다. 세르비아의 정치적 자유는 어떻게 된 건가?"
 Serbia.10.b: "이 범죄 행위가 저지된 것은 잘된 일이다"
 Serbia.11.d: ""
 Serbia.11.a: "그의 목숨을 살린 것은 큰 실수였다. 이 정치적 골칫거리를 이번에 완전히 끝장내자!"
 Serbia.11.b: "그들이 우리를 비난하게 두자. 우리는 잘못한 것이 없고 이 일은 곧 잠잠해질 것이다."
 Serbia.12.d: ""
 Serbia.12.a: "정부가 이 상황을 중재하는 것을 돕겠다"
 Serbia.12.b: "그들이 다투게 두자. 어차피 우리 문제가 아니다"
 SerbiaFocus.99.t: "보이보디나의 자유의 시간"
 SerbiaFocus.99.d: "우리 국민은 마침내 세르비아에 맞선 해방 전쟁을 시작할 준비가 되었습니다. 그러나 우리는 그런 결정을 내릴 준비가 되었습니까?"
 SerbiaFocus.99.a: "보이보디나의 자유를 위하여!"
 SerbiaFocus.99.b: "절대 안 된다!"
 SerbiaFocus.100.t: "보이보디나의 자유의 시간"
 SerbiaFocus.100.d: "보이보디나의 지방 정부가 우리에게 반기를 들었습니다! 사회와 국민의 반응이 우리에게 기대되는 가운데, 그들이 조용히 나라에서 분리해 나가도록 허용하겠습니까? 아니면 무력으로 그들을 진압하겠습니까?"
 SerbiaFocus.100.a: "세르비아는 하나가 될 것이다"
 SerbiaFocus.100.b: "그들에게 자유를 주자"
 SerbiaFocus.101.t: "연방화를 요청하는 보이보디나"
 SerbiaFocus.101.d: "보이보디나 정부가 세르비아와 자신들 사이에 본격적인 연방을 창설할 필요가 있다는 요청을 우리에게 제시했습니다. 우리는 우리나라 국가 체제를 이렇게 전면적으로 개편할 준비가 되었습니까?"
 SerbiaFocus.101.a: "찬성"
 SerbiaFocus.101.b: "세르비아는 하나가 될 것이다"
 SerbiaFocus.102.t: "연방화 요청"
 SerbiaFocus.102.d: "세르비아 정부가 나라를 연방화하는 데 동의했으며, 마침내 우리는 동등한 구성체가 될 것입니다!"
 SerbiaFocus.102.a: "니스"
 SerbiaFocus.103.t: "연방화 요청"
 SerbiaFocus.103.d: "세르비아 정부가 나라를 연방화하기를 거부했으며, 그들은 우리의 제안을 거부한 결과를 곧 알게 될 것입니다."
 SerbiaFocus.103.a: "알겠다"
 SerbiaFocus.104.t: "자체 군대의 허가를 요청하는 보이보디나"
 SerbiaFocus.104.d: "보이보디나 정부가 자체 무장 병력을 보유할 수 있도록 허가해 달라고 요청했습니다. 어쩌면 이것이 장차 우리에게 유리하게 작용할 수도 있지만, 우리는 이를 위험으로도 봅니다. 허용하겠습니까?"
 SerbiaFocus.104.a: "찬성"
 SerbiaFocus.104.b: "그들에게 자체 군대는 필요 없다."
 SerbiaFocus.105.t: "군대 요청"
 SerbiaFocus.105.d: "세르비아 정부가 우리가 자체 무장 병력을 구축하기 시작하는 것을 허용했습니다."
 SerbiaFocus.105.a: "니스"
 SerbiaFocus.106.t: "군대 요청"
 SerbiaFocus.106.d: "세르비아 정부가 우리에게 자체 군대를 주기를 거부했으며, 그들은 우리의 제안을 거부한 결과를 곧 알게 될 것입니다."
 SerbiaFocus.106.a: "알겠다"
 SerbiaFocus.107.t: "자치권 확대 요청"
 SerbiaFocus.107.d: "세르비아 정부가 우리의 자치권을 확대하는 것을 허용했으며, 이제 우리에게는 더 많은 기회가 생겼습니다."
 SerbiaFocus.107.a: "니스"
 SerbiaFocus.108.t: "자치권 확대 요청"
 SerbiaFocus.108.d: "세르비아 정부가 우리의 자치권을 확대하기를 거부했으며, 그들은 후회하게 될 것입니다!"
 SerbiaFocus.108.a: "알겠다"
 SerbiaFocus.109.t: "자치권 확대를 요청하는 보이보디나"
 SerbiaFocus.109.d: "보이보디나 정부가 현재의 자치 권한을 확대해 달라고 요청하면서 이것이 우리에게도 이익이 될 것이라고 설득하고 있습니다. 그들의 주장에 동의하겠습니까?"
 SerbiaFocus.109.a: "찬성"
 SerbiaFocus.109.b: "그들에게 더 많은 자치권은 필요 없다."
 SerbiaFocus.9.t: "보이보디나의 자치 지위"
 SerbiaFocus.9.d: "우리나라를 뒤흔든 정치적 격변이 보이보디나의 정치 세력을 일깨웠습니다. 이 지역 대표들은 주민들의 자치권을 확대해 달라고 요청하고 있습니다. 이를 받아들이겠습니까?"
 SerbiaFocus.9.a: "그들에게 어느 정도 자치권을 줘야 할 것이다."
 SerbiaFocus.9.b: "절대 안된다"
 SerbiaFocus.17.t: "발칸 연방"
 SerbiaFocus.17.d: "[FROM.GetName]이(가) 우리 정부와의 회담에서 발칸 연방 가입을 위한 공식 초청장을 건넸습니다. 이러한 연방의 회원이 되면 우리에게 많은 제약이 가해질 것이지만, 세르비아 정부가 우리를 설득하듯이 대체로 연방의 모든 구성체는 동등한 권리를 갖게 될 것입니다."
 SerbiaFocus.17.a: "연방 가입에 동의한다"
 SerbiaFocus.17.b: "우리에게 연방은 필요 없다."
 SerbiaFocus.20.t: "발칸 연방"
 SerbiaFocus.20.d: "[FROM.GetName]이(가) 발칸 연방 가입이라는 우리의 제안을 거절했습니다."
 SerbiaFocus.20.a: "슬프군"
 Serbia.27.t: "발칸 연방"
 Serbia.27.d: "우리는 공식적으로 발칸 연방의 회원이 되었습니다."
 Serbia.27.a: "좋아"
 ser_reading.1.t: "세르비아 정치 위기"
 ser_reading.1.d: "세르비아 사회에 엄청난 파괴적 영향을 미친 1999년 NATO 폭격 이후, 밀로셰비치의 권위는 거의 무너졌습니다. 세르비아 전역에 수많은 야당 단체가 퍼져 있으며, 한때 안정적이었던 나라는 다가오는 천년기라는 거대한 도전에 직면해 있습니다."
 ser_reading.1.a: "오직 단결만이 세르비아인을 구할 것이다..."
 serbia_news.3.t: "CEFTA 결성"
 serbia_news.3.d: "최근 많은 중부 유럽 국가들이 CEFTA 협정에 서명했습니다. 중부유럽 자유무역협정은 유럽 연합 회원국이 아닌 국가들 사이의 비세그라드 협정을 계승한 자유무역 기구입니다. 우리가 유럽 연합에 가입하면 이 국가 정신은 제거될 것입니다."
 serbia_news.3.o1: "흥미롭군"
 SER_radical_create_tt: "세르비아 진보당이 창당됩니다!"
 SER_jp_electric: "JP 전력공사"
 SER_coalition_TT: "우리와 §C연대한§! §C정당§!들이 우리 §C연립§!에 합류합니다."
 SER_radical_div_TT: "진보당이 창당되었습니다."
 ser_we_will_int_tt: "[FROM.GetNameWithFlag]이(가) 네트워크 기반시설 2개를 건설합니다. 이로써 우리에 대한 [FROM.GetNameWithFlag]의 영향력이 5% 증가합니다!"
 bombed_us_in_the_nineties: "90년대에 우리를 폭격함"
 oppress_the_muslim_population: "무슬림 인구 탄압"
 oppress_the_serbian_population: "세르비아 인구 탄압"
 serbian_speaking: "세르비아어 사용 국가"
 kla_attacks: "KLA가 우리 국민을 습격!"
 ethnic_cleansing: "우리 땅에서 인종 청소를 자행!"
 nationalized_automobile_industry: "국유화된 자동차 산업"
 nationalized_automobile_industry_trade: "국유화된 자동차 산업"
 cooperated_to_clean_up_cyanide_spill: "시안화물 유출 정화에 협력함"
 caused_cyanide_spill: "다뉴브강에 시안화물을 유출시킴"
 blame_us_for_cyanide_spill: "다뉴브강 시안화물 유출을 우리 탓으로 돌림"
 vojvodina_focus: "보이보디나 중점 트리"
 VOJ_economic: "보이보디나의 경제"
 VOJ_economic_desc: "우리 공화국은 경제 발전의 큰 잠재력을 지니고 있으며, 세르비아가 우리를 자국 영토에 묶어두려 그토록 애쓰는 것도 괜한 일이 아닙니다. 우리가 그들 수입의 상당 부분을 제공하고 있기 때문입니다!"
 VOJ_selhoz: "농업"
 VOJ_selhoz_desc: "우리나라는 잘 발달한 농업을 보유하고 있지만, 거기에 만족하지 않고 계속 그 발전에 투자할 것입니다."
 VOJ_construct: "건설업"
 VOJ_construct_desc: "우리는 건설업에 대한 투자를 확대할 것이며, 보이보디나의 모든 킬로미터가 개발될 것입니다!"
 VOJ_oil: "석유 산업"
 VOJ_oil_desc: "석유 산업은 우리 지역에서 상당히 강력하며 일부 외국 투자자들에게도 매력적이어서 우리 경제에 긍정적인 영향을 미치고 있습니다."
 VOJ_chim: "화학 산업"
 VOJ_chim_desc: "우리나라의 화학 산업은 아직 발달이 미흡하지만 탄력을 받기 시작했으며, 더 많은 자금을 투자하면 틀림없이 몇 배의 이익을 얻게 될 것입니다."
 VOJ_metal: "야금업"
 VOJ_metal_desc: "야금업은 우리에게 공기처럼 필요합니다. 우리는 세르비아 정부가 투자한 것보다 더 많은 자금을 그 발전에 투자할 것입니다."
 VOJ_it: "IT 부문"
 VOJ_it_desc: "우리나라의 IT 부문은 발달이 미흡하지만, 그것이 미래이기에 우리는 투자할 준비가 되어 있습니다!"
 VOJ_regionalism: "지역주의"
 VOJ_regionalism_desc: "우리는 세르비아 국가 안에서 지역주의를 적극 옹호합니다! 민족들에 대한 어떠한 침해도 안 됩니다!"
 VOJ_federalisation: "연방화"
 VOJ_federalisation_desc: "세르비아의 연방화는 우리가 공동 국가의 미래로 보는 것입니다. 우리는 가능한 한 많은 특권을 얻어내기 위해 적극적으로 노력할 것입니다."
 VOJ_vs: "우리의 무장 병력"
 VOJ_vs_desc: "우리가 자체 무장 병력을 보유할 수 있도록 허용하는 법안을 세르비아 정부에 제안할 것입니다."
 VOJ_autonomy: "자치 지위 격상"
 VOJ_autonomy_desc: "국가 내 자치 지역으로서 우리의 특권을 확대해 줄 것을 세르비아 정부에 제안할 것입니다."
 VOJ_true_fed: "세르비아-보이보디나 연방"
 VOJ_true_fed_desc: "세르비아-보이보디나 연방의 창설 검토에 관한 법안을 세르비아 정부에 제출할 것입니다."
 VOJ_separ: "자치를 위한 연합"
 VOJ_separ_desc: "보이보디나의 많은 정당이 보이보디나의 자치와 어쩌면 독립을 위해 싸우기 위한 하나의 연합으로 결집했습니다."
 VOJ_vojvodina_spirit: "자유의 정신"
 VOJ_vojvodina_spirit_desc: "우리 국민은 언제나 자치와 독립을 열망해 왔으며, 우리에게 세르비아는 점령자이므로 우리는 그에 맞서 싸울 것입니다."
 VOJ_europe_friend: "EU와의 동반자 관계"
 VOJ_europe_friend_desc: "우리는 유럽 연합을 잠재적 파트너로, 우리 자신을 그 회원으로 봅니다."
 VOJ_brothers_nation: "소수민족의 목소리"
 VOJ_brothers_nation_desc: "우리는 우리 공화국의 소수민족을 구실로 헝가리, 크로아티아 같은 인접국의 투자자를 유치합니다."
 VOJ_kosovo: "같은 처지의 형제"
 VOJ_kosovo_desc: "코소보 또한 우리처럼 오랫동안 세르비아의 그늘 아래 있었으며, 우리의 형제와도 같은 문제가 우리를 하나로 묶어 주어야 합니다."
 VOJ_propaganda: "애국주의 선전"
 VOJ_propaganda_desc: "우리 국민은 자신들의 뿌리와 역사를 사랑하고 존중한다는 것이 무엇인지 이미 잊어버렸으며, 우리는 선전을 통해 그들을 올바른 길로 이끌 것입니다."
 VOJ_self_defence: "보이보디나 자위대"
 VOJ_self_defence_desc: "우리는 세르비아의 영향력에 저항하기 위해 자위 부대를 창설하고, 독립이 짓밟힐 경우 스스로를 방어할 준비를 갖출 것입니다."
 VOJ_buy_weapon: "무기 구매"
 VOJ_buy_weapon_desc: "우리는 자신을 방어할 무기가 필요하며, 다행히 일부 이웃 국가들이 기꺼이 우리에게 팔고자 합니다."
 VOJ_anti_serb: "반세르비아 선전"
 VOJ_anti_serb_desc: "우리는 세르비아가 우리를 식민지처럼 이용하고 있으며 우리는 그 노예라는 논리를 적극적으로 발전시킬 것입니다."
 VOJ_war_freedom: "베오그라드 진군"
 VOJ_war_freedom_desc: "우리는 점령자이자 적에 맞서 해방 전쟁을 치를 준비가 되어 있습니다."
 VOJ_madyar: "보이보디나의 헝가리 민족주의"
 VOJ_madyar_desc: "헝가리 소수민족이 보이보디나의 삶에서 지배적인 역할을 맡게 되었으며, 이제 진정으로 예측할 수 없는 미래가 우리를 기다립니다."
 VOJ_new_nation: "새로운 국가 정신"
 VOJ_new_nation_desc: "보이보디나가 오랫동안 가지지 못했던 국가 정신이 이제 나타날 것입니다. 헝가리인들이 이 아름다운 땅을 영광스러운 미래로 이끌 것입니다."
 VOJ_we_hungary: "헝가리 정체성 고취"
 VOJ_we_hungary_desc: "보이보디나의 정체성은 불필요하고 시대에 뒤떨어진 것입니다. 헝가리인이야말로 보이보디나의 진정한 계승자입니다."
 VOJ_we_not_serb: "세르비아 정체성 거부"
 VOJ_we_not_serb_desc: "보이보디나의 정체성은 불필요하고 시대에 뒤떨어진 것입니다. 헝가리인이야말로 보이보디나의 진정한 계승자입니다."
 VOJ_propagandase: "친헝가리 선전"
 VOJ_propagandase_desc: "우리 언론은 헝가리가 이 땅의 진정한 계승자이며 이 지역의 모든 주민이 헝가리인이라는 점을 적극적으로 선전할 것입니다."
 VOJ_defences: "방어선"
 VOJ_defences_desc: "잠재적인 적이 우리를 그렇게 쉽게 돌파하지 못하도록 방어선을 구축해야 합니다."
 VOJ_mobilisation: "인구 동원"
 VOJ_mobilisation_desc: "우리는 인구 동원을 선포하며, 그들이 우리 자체 무장 병력의 대열에 합류하도록 독려합니다."
 VOJ_guard: "국가방위군"
 VOJ_guard_desc: "우리를 지켜 줄 자체 국가방위군 부대를 창설할 것입니다."
 VOJ_path: "갈림길에서"
 VOJ_path_desc: "이제 우리 지역을 위한 운명적인 결정을 내릴 때입니다."
 VOJ_part_hungary: "우리는 헝가리의 일부다"
 VOJ_part_hungary_desc: "우리는 헝가리에 합류하고자 하는 우리의 뜻을 선언할 것이며, 우리 형제들이 우리를 거절하지 않기를 바랍니다."
 VOJ_nopart_hungary: "우리가 진정한 헝가리다"
 VOJ_nopart_hungary_desc: "헝가리 국가는 썩었습니다. 그들은 우리 민족의 영광스러운 전통을 잊고 자신들의 역사를 완전히 저버렸으며, 우리는 전 세계 헝가리인들의 보루가 될 것입니다."
 VOJ_volunteer: "헝가리 의용병"
 VOJ_volunteer_desc: "전 세계의 헝가리 의용병들이 부다페스트의 이 부패한 정부가 아니라 우리를 헝가리의 진정한 계승자로 보고 우리에게 모여들기 시작했습니다."
 VOJ_claims: "영토 영유권 주장"
 VOJ_claims_desc: "헝가리의 땅은 헝가리 민족의 것이며, 우리에게는 그 땅에 대한 모든 권리가 있습니다."
 VOJ_war: "헝가리를 위한 전쟁"
 VOJ_war_desc: "헝가리는 자유로워질 것입니다!"
 VOJ_start_army: "군 개혁 착수"
 VOJ_start_army_desc: "우리의 무장 병력은 말 그대로 존재하지 않으며, 앞으로 우리나라가 스스로를 방어할 수 있도록 이를 창설하기 시작해야 합니다."
 VOJ_reforms_army: "계약제 군대"
 VOJ_reforms_army_desc: "우리 작은 나라에는 거대한 군대가 필요하지 않으며, 우리는 소규모 전문 직업군에 집중할 것입니다."
 VOJ_weapon_zakup: "무기 구매"
 VOJ_weapon_zakup_desc: "우리는 군대에 보급하기 위해 여러 나라에서 무기를 구매할 것입니다."
 VOJ_new_officer: "장교 학교"
 VOJ_new_officer_desc: "우리 군의 첫 장교단을 양성하기 시작할 것입니다."
 VOJ_inter_specialist: "외국인 전문가"
 VOJ_inter_specialist_desc: "우리 군을 유능하게 준비하는 데 도움을 받기 위해 외국인 전문가들을 초청할 것입니다."
 VOJ_finish_reform: "개혁 완료"
 VOJ_finish_reform_desc: "우리는 자체 무장 병력의 창설을 완료했습니다."
 VOJ_serbs: "우리는 세르비아인이다"
 VOJ_serbs_desc: "우리 지역은 언제나 세르비아와 함께할 것이며, 우리는 하나의 민족이자 하나의 나라입니다."
 VOJ_anti_separ: "분리주의자 탄압"
 VOJ_anti_separ_desc: "분리주의는 우리 지역을 쉽게 불길에 휩싸이게 하고 내전으로 이어질 수 있으며, 이는 용납할 수 없습니다!"
 VOJ_propagandais: "친세르비아 선전"
 VOJ_propagandais_desc: "우리 지역 주민들은 분리주의가 우리에게 위험하며 세르비아와의 단결이 안정의 열쇠임을 알아야 합니다."
 VOJ_serb_infra: "기반시설 투자"
 VOJ_serb_infra_desc: "세르비아 정부가 우리 지역의 기반시설 개발에 투자했습니다."
 VOJ_serb_people: "하나 된 민족"
 VOJ_serb_people_desc: "우리는 우리 민족의 단결과 하나의 목표, 즉 강력하고 위대한 세르비아를 인정합니다."
 VOJ_serb_invest: "세르비아 산업 투자"
 VOJ_serb_invest_desc: "세르비아 정부가 우리 영토에 기업을 건설하기 위한 자금을 배정했습니다."
 VOJ_serb_police: "세르비아 경찰 수용"
 VOJ_serb_police_desc: "안정을 보장하기 위해 세르비아 경찰이 우리 지역에 접근하는 것을 허용할 것입니다."
 VOJ_serb_military: "세르비아 산업에 통합"
 VOJ_serb_military_desc: "세르비아 산업이 우리 영토에 진출하는 것을 적극적으로 허용할 것입니다."
 VOJ_agro_selhoz1: "보이보디나 농업"
 VOJ_agro_selhoz: "보이보디나 농공업"
 VOJ_prom_idea: "보이보디나 산업"
 VOJ_patriotism: "보이보디나 애국주의"
 VOJ_vojvodina_nation: "새로운 국가 정신"
 VOJ_vojvodina_nation1: "진정한 헝가리"
 VOJ_no_army: "군대 없는 나라"
 VOJ_no_army1: "군 개혁 중"
 VOJ_no_nation: "민족 없는 나라"
 VOJ_debuff_nation: "보이보디나의 자치 열망"
 VOJ_debuff_nation_desc: "과거의 사건들로 인해 보이보디나의 자치 지지자들이 활성화되었으니, 어쩌면 이 문제를 해결해야 할지도 모릅니다."
 ser_voj.1.t: "우리와 통합하기를 원하는 보이보디나"
 ser_voj.1.d: "보이보디나가 우리의 위대한 나라의 일부가 되고자 하는 뜻으로 국민투표를 발표했습니다. 그들을 받아들이는 것에 동의하겠습니까?"
 ser_voj.1.a: "찬성"
 ser_voj.1.b: "안된다"
 ser_voj.2.t: "우리에게 보장을 제안하는 보이보디나"
 ser_voj.2.d: "보이보디나가 세르비아나 다른 나라들이 우리를 공격할 경우 서로를 지켜 주는 상호 보장을 제안합니다. 어쩌면 이것이 우리에게 우호적이지 않은 이웃들의 열기를 가라앉힐 수 있을 것입니다."
 ser_voj.2.a: "찬성"
 ser_voj.2.b: "안된다"
 ser_voj.3.t: "상호 보장에 동의한 코소보"
 ser_voj.3.d: "코소보 정부가 서로의 독립을 보장하는 상호 보장에 동의했으며, 이제 우리는 공격받지 않을 가능성이 생겼습니다."
 ser_voj.3.a: "좋아"
 SER_vojvodina_separatism_category: "보이보디나 분리주의"
 SER_vojvodina_separatism_category_desc: "\n\n\n\n\n\n£SER_desctext_vojvodina \n\n\n\n\n\n\n\n\n밀로셰비치 축출 이후의 사건들은 보이보디나의 공화주의 및 분리주의 정서를 심화시켰습니다. 이제 보이보디나와 세르비아는 함께 갈 것인지, 아니면 서로 갈라질 것인지 결정해야 합니다."
 VOJ_more_separ: "분리주의 정서 고조"
 VOJ_more_autonomy: "더 많은 자치권 요청"
 VOJ_more_army: "자체 군대 허가 요청"
 VOJ_more_federation: "연방화 허가 요청"
 VOJ_integrate: "보이보디나 통합"
 VOJ_separ_debuff: "보이보디나의 분리주의 감소"
 VOJ_separ_debuff1: "보이보디나의 분리주의 감소"
 VOJ_ser_police: "세르비아 경찰"
 VOJ_ser_avto: "세르비아 산업"
 SER_voj_separ_TT: "보이보디나의 분리주의가 §Y[?modify_voj_separ]%§! 증가합니다. (현재 분리주의: §Y[?VOJ.voj_separ]%§!)\n"
 SER_voj_integr_TT: "통합 열망이 §Y[?modify_voj_integr]%§! 증가합니다. (현재 열망: §Y[?VOJ.voj_integr]%§!)\n"
 VOJ_support_for_union_more_60: "통합 열망이 60% 이상"
 montenegro_focus: "몬테네그로 중점 트리"
 SER_The_Montenegro_Confederacy: "몬테네그로 연합"
 SER_The_Montenegro_Confederacy_desc: "\n\n\n\n\n\n£SER_desctext_montenegro \n\n\n\n\n\n\n\n\n[MNT.GetFlag] [MNT.GetName]은(는) 1990년대부터 독립을 추구해 왔으며, 날이 갈수록 점점 더 성공을 거두고 있습니다. 우리는 그들을 막으려 시도할 수 있지만, 그렇게 한다면 득보다 실이 더 클 수도 있습니다. [MNT.GetFlag] [MNT.GetName]을(를) 붙들어 두려는 시도는 해결하는 데 수년이 걸릴 수도 있는 장기적인 결과를 낳을 수 있습니다.\n\n우리는 그들의 독립 의제를 저지함으로써 [MNT.GetFlag] [MNT.GetName]을(를) 유지할 수 있습니다. 독립에 대한 그들의 갈망에 계속 맞선다면 그들의 운동은 폭력적으로 변할 것이며, 반란을 진압하기 위해 군대를 사용해야 할 것입니다.\n\n아무것도 하지 않기로 선택한다면, [MNT.GetFlag] [MNT.GetName]은(는) 별다른 중대한 결과 없이 평화롭게 우리나라에서 분리될 것입니다.\n\n[MNT.GetFlag] [MNT.GetAdjective] 분리주의: §Y[?SER_Montenegro_separatism]%§!\n-------------------------------------------------------\n[MNT.GetFlag] [MNT.GetAdjective] 저항 전투원: §R[?SER_Montenegro_combatants]§!\n[SER.GetFlag] [SER.GetAdjective] 배치된 보안군: §R[?SER_Serbian_combatants]§!"
 SER_Montenegro_independence_referendum: "몬테네그로 독립 국민투표"
 SER_retainment_of_connections_Montenegro: "[MNT.GetFlag] [MNT.GetAdjective] 분리주의 저지"
 SER_retainment_of_connections_Montenegro_desc: "우리는 입장을 굳건히 지키며 [MNT.GetFlag] [MNT.GetAdjective] 분리주의에 맞서 싸울 것입니다."
 SER_attack_mnt_militias: "[MNT.GetFlag] [MNT.GetAdjective] 무장 세력 공격"
 SER_attack_mnt_militias_desc: "우리는 그들의 저항을 진압하기 위해 [MNT.GetFlag] [MNT.GetAdjective] 무장 세력에 대한 공격을 개시할 것입니다."
 SER_deploy_more_troops: "보안 병력 증강"
 SER_deploy_more_troops_desc: "무장 세력에 대응하기 위해 [MNT.GetFlag] [MNT.GetName] 지역의 보안 병력을 늘릴 것입니다."
 SER_Political_separatism: "[MNT.GetFlag] [MNT.GetAdjective] 분리주의"
 MNT_neoyug: "신유고슬라비아주의"
 MNT_neoyug_desc: "유고슬라비아에 대한 향수의 불꽃은 몬테네그로에서 아직 꺼지지 않았습니다! 공산주의의 길은 언제나 최선이었으며 우리는 이를 확실히 알고 있습니다."
 MNT_selfcoup: "더 이상 민주주의는 없다!"
 MNT_selfcoup_desc: "부르주아 자본주의 민주주의는 오늘날 우리와 옛 유고 동지들이 처한 모든 혼란의 근원입니다. 우리는 이 하찮은 관행을 멈추고 프롤레타리아의 진보적 독재로 돌아가야 합니다!"
 MNT_onepartystate: "일당제 국가"
 MNT_onepartystate_desc: "이 어리석은 정당들은 논리의 변증법적 이해를 완전히 파악하지 못하는 뒤떨어진 멍청이들이며 우리 사회를 계급 갈등 사회로 만들고 싶어 합니다. 우리는 그런 일이 일어나게 해서는 안 됩니다!"
 MNT_eliminate_bourjuy: "부르주아 제거"
 MNT_eliminate_bourjuy_desc: "쥐처럼 우리나라를 괴롭히는 어리석은 시민 계급은 제거되어야 하며, 그들의 재산은 인민에게 나누어져야 합니다!"
 MNT_declare_autarky: "자급자족 선언"
 MNT_declare_autarky_desc: "더러운 자본주의 세계 시장은 항상 피 묻은 손을 우리 목 가까이에 두고 있습니다! 우리는 제국주의라는 세계적 뱀에 굴복하지 않고 당분간 오직 우리 자신에게만 의존할 것입니다."
 MNT_nationalise_economy: "경제 국유화"
 MNT_nationalise_economy_desc: "국가의 모든 경제는 국가의 인민에게 속해야 합니다! 그리고 우리는 평범한 민중 가운데 최고 중의 최고로 이루어진 프롤레타리아 독재이므로, 정부가 모든 기업을 관리해야 합니다."
 MNT_revolution_might: "혁명의 힘"
 MNT_revolution_might_desc: "성스러운 마르크스의 이름으로, 혁명의 힘은 가깝고 먼 모든 나라에 분명히 드러나야 합니다! 자본주의의 위협은 우리의 힘에 대해 듣고 두려워 떨어야 합니다!"
 MNT_titois_economic_practise: "티토의 실용주의"
 MNT_titois_economic_practise_desc: "요시프 브로즈 티토는 모든 발칸을 통틀어 가장 현명한 사람이었으며, 이를 의심하는 자는 배신자 아니면 바보입니다. 우리나라가 번영하는 모습을 보려면 빛나는 붉은 몬테네그로에서 그의 경제 정책을 다시 도입해야 합니다!"
 MNT_socialist_agenda_desc: "우리나라의 모든 사람은 마르크스주의를 공부하고 외워야 합니다! 이것이 우리의 새로운 의제이며, 이에 따라 평범한 민중의 필요를 충족시키기 위해 더 많은 사회 프로그램을 도입해야 합니다!"
 MNT_greate_reclaimation: "위대한 수복!"
 MNT_greate_reclaimation_desc: "이제 혁명을 수출하고 발칸 전역에 붉은 깃발을 드높일 때가 왔습니다!"
 MNT_montenegro_dem: "몬테네그로 민주당"
 MNT_montenegro_dem_desc: "몬테네그로는 마침내 권위주의의 공포에서 벗어났으며, 다시는 그 아래에 굴복하지 않을 것입니다! 민주주의만이 나아갈 길입니다!"
 MNT_european_agenda: "유럽 의제"
 MNT_european_agenda_desc: "몬테네그로는 언제나 유럽이었으며, 어떠한 공산주의나 권위주의의 과거도 우리가 유럽 가족에 합류하고 협력을 받아들이는 것을 막을 수 없습니다!"
 MNT_anti_oligarchism: "반과두주의"
 MNT_anti_oligarchism_desc: "반과두주의는 우리 정치 의제의 최우선 과제 중 하나여야 합니다. 진정한 시장이 일어서려면 새로운 공간이 열려야 합니다!"
 MNT_democratisation: "민주화"
 MNT_democratisation_desc: "민중의 목소리를 억압해 온 세월은 우리를 투표에 대한 민주적 문화가 존재하지 않는 상태로 이끌었습니다. 우리는 이를 바로잡아야 합니다!"
 MNT_montenegro_nationalism: "몬테네그로 민족주의"
 MNT_montenegro_nationalism_desc: "우리는 세르비아인이 아닙니다! 모두가 이를 알아야 합니다. 우리는 이른바 형제라는 이들의 그늘 아래 있어서는 안 됩니다. 우리는 독립적이고 주권을 가진 몬테네그로인입니다!"
 MNT_multiparty_system: "다당제"
 MNT_multiparty_system_desc: "우리의 바람과 어긋나더라도 우리는 억압의 구렁텅이에 빠지지 않고 경쟁자들과 정치적 협력을 확립하여 진정한 다당제를 공고히 할 것입니다."
 MNT_fight_organized: "범죄와의 전쟁"
 MNT_fight_organized_desc: "범죄는 처벌받아야 하며 우리나라에 법과 질서가 확립되어야 합니다!"
 MNT_social_market: "사회적 시장"
 MNT_social_market_desc: "우리 국민이 번영하고 행복한 모습을 보려면 사회적으로 그들을 지원하고 필수적인 필요에 대한 보장을 확립해야 합니다."
 MNT_kill_serb_nats: "세르비아인 단속"
 MNT_kill_serb_nats_desc: "어리석은 세르비아 민족주의자들은 여전히 우리를 세르비아와 재통합시키려 하고 있습니다. 이는 막아야 합니다!"
 MNT_freetrade: "자유 무역"
 MNT_freetrade_desc: "우리나라는 모든 외국 무역에 열려 있어야 합니다. 우리의 항구는 모두에게 개방되어 있습니다!"
 MNT_secularism: "세속주의 확립"
 MNT_secularism_desc: "우리는 종교의 있을 법한 진리를 부정하지는 않지만, 종교를 국가로부터 분리해야 합니다."
 MNT_dukanovic_rule: "지우카노비치의 통치"
 MNT_dukanovic_rule_desc: "밀로 지우카노비치는 여러 정치직에서 여러 임기를 역임하며 1990년대 이래 몬테네그로 정치에서 중요한 역할을 해 온 저명한 몬테네그로 정치인입니다."
 MNT_family_comes_first: "가족이 우선"
 MNT_family_comes_first_desc: "많은 사회민주주의자들이 내게 예산 일부를 가족을 지원하는 데 배정하라고 말합니다. 동의합니다! 그래서 내 모든 가족 구성원이 정부 기구에서 중요한 정치적 역할을 맡게 될 것입니다..."
 MNT_cement_power: "권력 공고화"
 MNT_cement_power_desc: "우리는 민주적 제도를 유지하면서 우리 당의 권력을 영원히 공고히 해야 합니다."
 MNT_dominance_of_dps: "DPS의 지배"
 MNT_dominance_of_dps_desc: "DPS는 의회의 지배 정당이며 앞으로도 그럴 것입니다! 우리는 선전과 정치적 조작을 활용하여 우리의 인기를 높일 것입니다."
 MNT_person_of_the_year: "조직 범죄 올해의 인물"
 MNT_person_of_the_year_desc: "지우카노비치가 범죄 조직 및 마피아와 많은 연줄을 가지고 있다는 것은 비밀이 아닙니다. 마피아가 몬테네그로에 해를 끼치지 않도록 지우카노비치는 마피아를 정치 구조에 편입시키려 할 것입니다. 야당은 우리 대통령이 조직 범죄 분야의 올해의 인물 같은 존재라고 말할 수 있겠지만, 그들이 국가 운영에 대해 무엇을 알겠습니까?"
 MNT_full_scale_privatisation: "민영화 운동"
 MNT_full_scale_privatisation_desc: "우리 경제가 완전히 민영화되고 사회주의적 관행을 청산해야 할 때가 왔습니다."
 MNT_formation_of_oligachs: "과두 재벌과의 동맹"
 MNT_formation_of_oligachs_desc: "우리의 정치 기득권을 지탱하기 위해 과두 세력과 동맹을 맺어야 합니다."
 MNT_bar_pirate_bay: "바르 해적만"
 MNT_bar_pirate_bay_desc: "우리 항구의 모든 암시장은... 합법화되어야 하며, 그 수익은 국가에 귀속되어야 합니다."
 MNT_reconsiliation_with_monarchists: "군주주의파와 화해"
 MNT_reconsiliation_with_monarchists_desc: "군주주의자들은 지지와 대표성을 얻으려고 열심입니다. 우리는 이를 우리의 정치적 이익을 위해 활용할 수 있습니다."
 MNT_friend_in_the_west: "서방의 친구들"
 MNT_friend_in_the_west_desc: "미국과 유럽은 우리의 무역 파트너이며, 우리는 그들과 좋은 관계를 증진해야 합니다."
 MNT_contacts_in_the_east: "동방의 친구들"
 MNT_contacts_in_the_east_desc: "러시아와 중국은 우리의 무역 파트너이며, 우리는 그들과 좋은 관계를 증진해야 합니다."
 MNT_castle_of_montenegro: "몬테네그로의 성"
 MNT_castle_of_montenegro_desc: "몬테네그로는 지우카노비치의 성이며, 우리 모두 분명 이를 좋아합니다!"
 MNT_serb_democrats: "세르비아 민주당"
 MNT_serb_democrats_desc: "세르비아 소수민족 정당들도 몬테네그로에 존재합니다. 그리고 그들 역시 때때로 정치적 지도력을 원합니다."
 MNT_promote_serbian_culture: "세르비아 문화 장려"
 MNT_promote_serbian_culture_desc: "몬테네그로인은 분명 세르비아인입니다! 세르비아 문화는 어디서나 장려되어야 합니다!"
 MNT_fight_corruption: "부패와의 전쟁"
 MNT_fight_corruption_desc: "부패와의 싸움은 자원의 공평한 분배를 보장하고, 경제 발전을 촉진하며, 법치를 수호하고, 제도에 대한 대중의 신뢰를 지키는 데 필수적입니다."
 MNT_traditional_values: "전통적 가치"
 MNT_traditional_values_desc: "우리는 평범한 민중의 전통적 가치를 지지하고 모든 진보적 헛소리를 청산해야 합니다."
 MNT_serbian_cooperation: "세르비아와의 협력"
 MNT_serbian_cooperation_desc: "세르비아와의 단결을 공고히 하기 위해 세르비아 국가와의 협력을 증진해야 합니다."
 MNT_fight_crime: "범죄와의 전쟁"
 MNT_fight_crime_desc: "범죄는 처벌받아야 하며 우리나라에 법과 질서가 확립되어야 합니다!"
 MNT_cooperation_with_russia: "러시아와의 협력"
 MNT_cooperation_with_russia_desc: "우리 세르비아인들이 말하듯이, 하늘에는 하느님, 땅에는 러시아입니다."
 MNT_serbian_language_in_constitution: "언어 정책"
 MNT_serbian_language_in_constitution_desc: "우리는 인위적인 언어 차이를 없애고 세르비아어를 국가 공용어로 확립해야 합니다."
 MNT_economic_regulations: "경제 규제"
 MNT_economic_regulations_desc: "경제 분야의 성공적인 발전을 보장하기 위해 우리 경제를 규제해야 합니다."
 MNT_serbian_chucrh: "세르비아 교회"
 MNT_serbian_chucrh_desc: "세르비아 정교회는 동방 정교회 전통 내의 저명한 종교 기관으로, 세르비아 민족의 다수 신앙을 대표하며 발칸에서 중요한 문화적, 역사적 역할을 하고 있습니다."
 MNT_serbian_montenegro: "세르비아 몬테네그로"
 MNT_serbian_montenegro_desc: "이제 모든 준비를 마치고 마침내 세르비아와 재통합할 준비가 되었습니다."
 MNT_monarchist_in_power: "집권한 군주주의자들"
 MNT_monarchist_in_power_desc: "우리 민족이 고대의 뿌리로 돌아갈 때가 왔습니다. 군주제를 복원합시다!"
 MNT_monarchist_constitution: "새 헌법"
 MNT_monarchist_constitution_desc: "우리의 어리석은 민주주의 헌법을 다시 써야 합니다."
 MNT_royal_guard_desc: "우리의 신성한 민족을 보호하려면 국왕을 위한 왕실 근위대를 창설해야 합니다!"
 MNT_traditional_vl_mon: "전통주의"
 MNT_traditional_vl_mon_desc: "우리는 평범한 민중의 전통적 가치를 지지하고 모든 진보적 헛소리를 청산해야 합니다."
 MNT_royal_nobility: "귀족 제도 재확립"
 MNT_royal_nobility_desc: "몬테네그로와 세르비아의 많은 옛 귀족 가문이 자신들의 의지와 권력의 재확립을 바라고 있습니다. 우리는 그것을 실현할 수 있습니다."
 MNT_state_religion: "국교 정교회"
 MNT_state_religion_desc: "정교회는 우리 민족의 근본적인 요소이며, 우리는 이를 정부 차원에서 시행해야 합니다."
 MNT_centralisation: "국가 중앙집권화"
 MNT_centralisation_desc: "우리는 국가의 모든 권력을 우리 군주에게 집중시켜야 합니다."
 MNT_russian_royal: "러시아 왕실과의 유대"
 MNT_russian_royal_desc: "러시아 왕실은 오랫동안 외부의 적에 맞선 우리의 대의를 지지해 왔습니다. 우리는 그들과 계속 우호 관계를 유지해야 합니다."
 MNT_national_economy_desc: "우리나라의 경제는 국제적 패거리가 아니라 우리 민족의 이익에 초점을 맞춰야 합니다!"
 MNT_serbian_legacy: "세르비아의 유산"
 MNT_serbian_legacy_desc: "이제 세르비아를 어떻게 할지 결정해야 할 때가 왔습니다..."
 MNT_neutral_prin: "중립 원칙"
 MNT_neutral_prin_desc: "우리는 정치 분야에서 도박을 하지 않을 것입니다. 오히려 중립을 유지하고 매우 신중해야 합니다."
 MNT_Economy_baby: "경제부"
 MNT_Economy_baby_desc: "우리의 위기를 해결하기 위해 경제부를 설립해야 합니다!"
 MNT_restore_port: "바르 항구 복원"
 MNT_restore_port_desc: "바르 항구는 우리나라에서 가장 큰 항구이자 아드리아해에서 가장 큰 운송 거점입니다. 우리는 항구에서 수익을 얻기 위해 항구의 기능을 복원해야 합니다."
 MNT_join_wto: "WTO 가입"
 MNT_join_wto_desc: "외부 무역 공동체와 연결되려면 세계무역기구에 가입해야 합니다!"
 MNT_agricul_dev: "농업 및 농촌 개발 전략"
 MNT_agricul_dev_desc: "몬테네그로 농업 및 농촌 개발 전략은 몬테네그로 농업부와 EU가 자금을 지원하는 프로젝트입니다. 이 프로젝트의 주요 목표는 몬테네그로 농업 부문을 되살리는 것입니다."
 MNT_support_tourism: "관광 지원"
 MNT_support_tourism_desc: "관광은 우리 경제에서 가장 유망한 부문입니다. 우리는 관광 부문을 발전시키기 위한 조치를 취해야 합니다."
 MNT_tourist_mecca: "관광 메카"
 MNT_tourist_mecca_desc: "우리는 전 세계 관광객을 위한 그야말로 메카를 만들어 내는 데 성공했습니다."
 MNT_revive_industry: "산업 부문 복원"
 MNT_revive_industry_desc: "우리 산업 부문의 몰락은 유고슬라비아 경제의 잘못된 운영이 낳은 결과입니다. 우리는 산업을 복원하고 경제를 바로잡아야 합니다!"
 MNT_save_aluminium_plant: "포드고리차 알루미늄 공장"
 MNT_save_aluminium_plant_desc: "포드고리차 알루미늄 공장의 중요성은 이루 말할 수 없으며, 이 알루미늄 공장은 우리 GDP의 가장 큰 부분을 창출하고 있습니다. 우리는 공장이 무너지지 않도록 지켜야 합니다!"
 MNT_expand_port: "바르 항구 확장"
 MNT_expand_port_desc: "입항 물자와 관광객의 수용 능력을 늘리기 위해 바르 항구를 확장해야 합니다."
 MNT_wind_power: "몬테네그로의 풍력"
 MNT_wind_power_desc: "우리의 지리적 위치는 풍력을 최대한 활용할 수 있게 해 줍니다!"
 MNT_foreign_production: "외국 생산"
 MNT_foreign_production_desc: "GDP를 개선하기 위해 외국인 투자자들을 초청하여 더 많은 산업 단지를 건설하게 할 수 있습니다."
 MNT_heaven_for_elits: "엘리트의 천국"
 MNT_heaven_for_elits_desc: "당신이 세계에서 가장 부유한 사람이고 요트를 어딘가에 정박해야 한다고 상상해 보십시오. 그곳은 비교적 저렴하고 아름다운 자연으로 둘러싸여 있어야 하는데, 몬테네그로 공화국은 이 기준에 부합합니다!"
 MNT_support_tourist_bussiness: "관광 사업 지원"
 MNT_support_tourist_bussiness_desc: "소규모 사업의 성장이 우리나라에 대한 관광객의 관심 증가와 관련되어 있음은 분명합니다. 이러한 성장을 촉진하기 위해 우리가 할 수 있는 모든 조치를 취해야 합니다."
 MNT_revive_old_relics: "고고학 발굴"
 MNT_revive_old_relics_desc: "몬테네그로의 땅은 풍부한 역사를 지니고 있습니다. 슬라브 부족의 고대 도시 유적과 베네치아 공화국의 요새가 우리 영토 곳곳에 자리하고 있습니다. 우리는 고대 유물을 발굴하기 위한 고고학 작업에 자금을 지원해야 합니다."
 MNT_highway_to_hell: "M급 간선도로 확장"
 MNT_highway_to_hell_desc: "몬테네그로의 기반시설을 개선하고 우리 국민과 관광객이 나라 곳곳을 더 쉽게 이동할 수 있도록 주요 M급 간선도로를 확장해야 합니다."
 MNT_support_holdings: "농업 경영체 지원"
 MNT_support_holdings_desc: "농업 경영체는 농업 시장의 주요 주체입니다. 이들이 쓰러지지 않도록 우리가 가진 모든 자금으로 지원해야 합니다."
 MNT_improve_logistick: "물류 개선"
 MNT_improve_logistick_desc: "농업 시장의 공급망을 바로잡기 위해 R급 도로를 개선해야 합니다. 모든 지역 도로 사업에 자금을 지원하도록 교통부를 참여시킬 것입니다."
 MNT_export_agri: "농산물 수출"
 MNT_export_agri_desc: "국내 시장의 농산물 수요를 충족한 뒤에는 우리 농산물로 수익을 창출하고 이를 해외 시장에 수출할 수 있습니다."
 MNT_agri_revival: "농업 부흥"
 MNT_agri_revival_desc: "올리브, 과일, 담배. 이 모든 아름다운 산물은 어머니 자연이 우리 국민에게 선사한 금입니다. 우리의 개혁 덕분에 우리는 국내 시장을 충족시키고 세계 시장에서 만만치 않은 경쟁자가 될 수 있었습니다."
 MNT_ageconomic_prosperity: "몬테네그로 번영의 시대"
 MNT_ageconomic_prosperity_desc: "우리가 해냈습니다! 1990년대와 2000년대가 우리 국민에게 가져다준 이 파괴적인 위기에서 벗어났습니다. 21세기가 우리 번영의 시대가 될 수 있다고 말할 수 있습니다!"
 MNT_aremd_forces: "몬테네그로군"
 MNT_aremd_forces_desc: "어떤 나라든 외부의 적에 맞서 방어하기 위한 무장 병력이 필요합니다. 보복주의적 세르비아인, 알바니아 민족주의자, NATO의 독수리들. 이들은 모두 잠재적 적 목록의 시작에 불과합니다."
 MNT_legacy_of_yugoslavia: "유고슬라비아군의 유산"
 MNT_legacy_of_yugoslavia_desc: "우리의 지리적 위치는 몬테네그로를 지키기 위해 유고슬라비아식 방어 전략을 사용하도록 강제하고 있습니다. 우리의 모든 장군이 유고슬라비아 복무 시절 이미 이 전략에 익숙하므로 이를 시행하는 것은 어렵지 않을 것입니다."
 MNT_montenegro_navy: "몬테네그로 해군"
 MNT_montenegro_navy_desc: "몬테네그로의 해안선은 우리의 아킬레스건입니다. 우리의 모든 대도시와 운송 거점이 바다 가까이에 있습니다. 우리 해안을 지키기 위해 자체 해군을 창설해야 합니다!"
 MNT_save_yug_boat: "유고슬라비아 함선 구조"
 MNT_save_yug_boat_desc: "많은 옛 유고슬라비아 함선이 여전히 우리의 옛 조선소에 남아 있습니다. 이들을 구해 낸다면 괜찮은 연안 함대를 보유할 수 있습니다."
 MNT_buy_transport: "해병 상륙함 구매"
 MNT_buy_transport_desc: "우리의 군사 전략상 상륙함을 일부 보유할 필요가 있습니다."
 MNT_anti_navy_defence: "해안선 방어"
 MNT_anti_navy_defence_desc: "우리의 긴 해안선을 지키려면 해안 전체를 따라 방어 시설군으로 이루어진 방어선을 구축해야 합니다."
 MNT_improve_navy_base: "해군 기지 개선"
 MNT_improve_navy_base_desc: "우리의 안보를 보장하려면 조선소를 개선해야 합니다."
 MNT_montenegro_ground_forces: "몬테네그로 지상군"
 MNT_montenegro_ground_forces_desc: "우리의 땅과 산악을 지키기 위해 지상군을 창설하고 최신 기술로 무장시켜야 합니다."
 MNT_ammunition_from_zastava: "자스타바의 탄약"
 MNT_ammunition_from_zastava_desc: "자스타바 탄약은 혼란의 시기에도 파괴되지 않은 유고슬라비아의 유산입니다. 그들의 탄약을 구매하면 군 창설에 큰 도움이 될 것입니다."
 MNT_american_ammunition: "미국의 탄약"
 MNT_american_ammunition_desc: "서방 파트너들은 시장에서 가장 기술적으로 앞선 탄약을 보유하고 있습니다. 이를 확보하면 기술적으로 발달한 군대를 만드는 데 도움이 될 것입니다."
 MNT_russian_ammunition: "러시아의 탄약"
 MNT_russian_ammunition_desc: "러시아의 파트너들은 시장에서 가장 효율적인 탄약을 보유하고 있습니다. 이를 확보하면 강력한 군대를 만드는 데 도움이 될 것입니다."
 MNT_russian_vehicles: "러시아 차량"
 MNT_russian_vehicles_desc: "러시아 차량은 시장에서 가장 효과적입니다. 이를 구매하면 우리 군이 더 체계적이고 강력해질 것입니다."
 MNT_american_vehicles: "미국 차량"
 MNT_american_vehicles_desc: "미국 차량은 시장에서 가장 진보한 차량입니다. 이를 구매하면 우리 군이 기술적으로 더 발전하고 기동력이 높아질 것입니다."
 MNT_tara_arms: "타라 암스"
 MNT_tara_arms_desc: "타라 암스는 옛 11월 4일 공장을 기반으로 한 기업입니다. 이 기업의 주된 목적은 시민을 위한 민수용 무기와 군을 위한 군용 무기를 제조하는 것입니다."
 MNT_montenegro_air: "몬테네그로 공군"
 MNT_montenegro_air_desc: "우리의 영공을 안전하게 지키려면 공군을 창설하고 필요한 모든 장비를 갖춰 주어야 합니다."
 MNT_save_yug_air: "유고슬라비아 항공기 구조"
 MNT_save_yug_air_desc: "우리는 옛 비행장으로부터 유고슬라비아의 전투기를 다수 물려받았습니다. 먼지를 털어내면 바로 운용할 수 있습니다."
 MNT_mlrs: "대공 방어"
 MNT_mlrs_desc: "대공 방어 체계가 없다면 적들이 손댈 수 없는 존재가 아니라고 확신할 수 없습니다. 옛 유고슬라비아 대공 방어 체계를 복원하고 새로운 체계를 구매하면 우리의 영공을 확보할 수 있을 것입니다."
 MNT_foreign_helis: "외국 헬리콥터 구매"
 MNT_foreign_helis_desc: "험난한 기후와 어려운 지정학적 조건에서 병력을 재배치하려면 새로운 헬리콥터를 확보해야 합니다."
 MNT_improve_air_base: "공군 기지 개선"
 MNT_improve_air_base_desc: "항공기 보관 수용 능력을 늘리기 위해 공군 기지를 개선해야 합니다."
 MNT_strong_and_ready: "강하고 준비되었다"
 MNT_strong_and_ready_desc: "우리 병력은 창설되었으며 군사 임무를 수행할 준비가 잘 되어 있습니다. 우리의 병사들은 몬테네그로의 가장 위대한 아들들입니다!"
 MNT_foreign_affairs: "외교부"
 MNT_foreign_affairs_desc: "외부 세계와 접촉하려면 외교부가 설립되어야 합니다."
 MNT_eyes_on_west: "서방을 주시"
 MNT_eyes_on_west_desc: "NATO가 우리 땅에 가져온 모든 나쁜 일에도 불구하고, 튼튼한 무역 기반을 구축하려면 부유하고 발달한 서방 국가들과의 협력이 필요합니다."
 MNT_american_inv: "미국 투자자 초청"
 MNT_american_inv_desc: "산업 부문에서 미국 투자자들과의 협력은 우리의 GDP 성장과 대륙 간 협력에 도움이 될 수 있습니다."
 MNT_german_inv: "독일 투자자 초청"
 MNT_german_inv_desc: "산업 부문에서 독일 투자자들과의 협력은 우리의 GDP 성장과 향후 EU 통합 가능성에 도움이 될 수 있습니다."
 MNT_european_trade: "유럽 무역 협정"
 MNT_european_trade_desc: "몬테네그로가 유럽 국가임은 부인할 수 없으며, EU와의 무역이 우리에게 필수적이라는 사실을 무시할 수 없습니다. 우리의 풍요로운 땅은 평범한 유럽인들에게 모든 것을 제공할 수 있습니다."
 MNT_eyes_on_east: "동방을 주시"
 MNT_eyes_on_east_desc: "러시아, 세르비아, 중국. 이들은 모두 우리의 역사적 동맹입니다. 우리는 역사적 협력의 뿌리에 연결되어 있으며 분리될 수 없습니다."
 MNT_seek_serb_trade: "세르비아와의 무역"
 MNT_seek_serb_trade_desc: "세르비아는 우리와 가장 가까운 나라입니다. 한때 하나였고 이제는 갈라섰지만, 우리는 경제 대화를 계속해야 합니다."
 MNT_seek_rus_trade: "러시아와의 무역"
 MNT_seek_rus_trade_desc: "러시아는 우리의 역사적 동맹입니다. 러시아 국가는 우리가 도움이 필요할 때 언제나 형님처럼 곁에 있습니다. 우리가 경제 대화를 계속해야 한다는 것은 분명합니다."
 MNT_chinese_infra: "베오그라드-바르 고속도로"
 MNT_chinese_infra_desc: "발칸의 기반시설을 개선하고 우리를 발칸 외부와 연결해 줄 통로를 만들기 위해, 바르 항구에서 베오그라드까지 고속도로를 건설하는 사업이 마련되었습니다. 이 사업의 주된 문제는 우리에게 재정 지원이 절실히 필요하다는 점이며, 정부는 중국 금융 기관에 투자를 요청하기로 결정했습니다."
 MNT_questio_of_direction: "방향의 문제"
 MNT_questio_of_direction_desc: "우리는 외교 정책의 방향뿐만 아니라 발칸의 정세에도 영향을 미칠 가장 중대한 선택의 기로에 서 있습니다. 현명하게 결정해야 합니다."
 MNT_cave_to_serbia: "세르비아와의 협력 강화"
 MNT_cave_to_serbia_desc: "세르비아와의 우리의 따뜻한 관계는 우리의 친동방 의제와 마찬가지로 누구도 깨뜨릴 수 없습니다."
 MNT_sco_observer: "SCO와의 연계"
 MNT_sco_observer_desc: "상하이 협력기구는 서방 제국주의 동맹에 대한 최선의 대안입니다. 우리는 SCO를 면밀히 지켜보고 모든 회의에 참석할 것입니다."
 MNT_reunion_with_serbia: "세르비아와의 재통합"
 MNT_reunion_with_serbia_desc: "세르비아-몬테네그로 국가의 해체가 지역의 정치적 불안정을 더욱 심화시킨 큰 실수였음이 분명해지고 있습니다. 우리는 세르비아-몬테네그로 연합을 재창설하자는 공식 제안을 보낼 것입니다."
 MNT_union_with_russia: "CSTO 가입"
 MNT_union_with_russia_desc: "우리는 러시아와의 따뜻한 관계를 무시할 수 없습니다. 우리의 형제는 누군가 우리를 해치도록 두지 않겠지만, 러시아가 우리를 도울 것을 확실히 하기 위해 CSTO 가입을 위한 공식 청원서를 보낼 것입니다."
 MNT_free_harbour: "자유 항구"
 MNT_free_harbour_desc: "어느 한쪽으로 기우는 것은 우리 경제와 독립에 치명적일 것입니다. 우리의 주권을 지키기 위해 아드리아해의 자유 항구를 자처할 것입니다."
 MNT_neutral_status: "중립 지위"
 MNT_neutral_status_desc: "우리나라를 독립 국가로 유지하려면 유럽 주요 열강의 도움을 받아 공식적으로 중립국임을 선언해야 합니다."
 MNT_swiss_model: "발칸의 스위스"
 MNT_swiss_model_desc: "우리나라의 평화를 유지하려면 국경을 맞댄 국가들과 협상해야 합니다. 스위스식 외교 정책 모델을 도입하여 발칸의 스위스가 되어야 합니다."
 MNT_european_intragrate: "친유럽 의제"
 MNT_european_intragrate_desc: "권위주의의 유산에서 벗어나기 위해 서방 의제가 우리 외교 정책에서 우위를 차지해야 합니다."
 MNT_nato_affairs: "NATO와의 협력"
 MNT_nato_affairs_desc: "권위주의라는 파괴적인 세력으로부터 우리의 정체성과 나라를 지키려면 NATO와 협력해야 합니다."
 MNT_eu_model: "유럽 모델 도입"
 MNT_eu_model_desc: "EU에 환영받으려면 진보적인 개혁을 시행하고 유럽의 정부 구조 표준을 채택해야 합니다. 긴 과정이 되겠지만, 우리는 우리 자신을 믿습니다!"
 MNT_nato_aspiration: "NATO 가입"
 MNT_nato_aspiration_desc: "어떠한 외부 위협도 두려워하지 않고 우리의 민주주의가 해를 입지 않을 것임을 확신하려면 NATO 기구에 가입해야 합니다."
 MNT_independent_politics: "몬테네그로 정치"
 MNT_independent_politics_desc: "유고슬라비아 공산주의자들의 오랜 점령 끝에 몬테네그로는 우리 국민의 뜻으로 다시 독립했습니다! 이제 정치적 변화를 이룰 때입니다!"
 MNT_organised_crime: "조직 범죄"
 MNT_organised_crime_soften: "누그러진 조직 범죄"
 MNT_organised_crime_non: "용인할 만한 조직 범죄"
 MNT_organised_crime_of_the_year: "조직 범죄 올해의 인물"
 MNT_legacy_of_90: "90년대의 유산"
 MNT_legacy_of_9: "90년대의 유산"
