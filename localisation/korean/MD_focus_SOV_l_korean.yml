 SOV_start_reunification_talks: "[FROM.GetNameWithFlag]와(과) 통합 협상 개시"
 SOV_start_reunification_talks_desc: "우리는 [FROM.GetNameWithFlag] 지도부와 마주 앉아 러시아 복귀를 협상할 수 있습니다. 그 대표단은 협상이 끝나면 우리가 이행해야 하는 요구 사항을 제시할 것입니다."
 SOV_start_reunification_talks_tt: "§Y통합 협상 진행 방식:§!\n1. 협상은 [FROM.GetNameWithFlag]의 요구로 시작됩니다. 요구를 수락하거나, 한 번에 한해 다른 요구를 내놓도록 압박하거나, 협상장을 떠날 수 있습니다. 협상장을 떠나면 §Y365§!일 동안 그들과 새 협상을 열 수 없습니다.\n2. 진행도는 §Y통합 원탁 협상§! 임무에서 보듯 매달 상승합니다. 때때로 이벤트가 정치력, 자금, 또는 공장을 요구하거나, 대표단이 요구를 추가합니다.\n3. 협상은 어느 한쪽이 전쟁 중이면 중단되며, [FROM.GetName]이(가) 소멸하거나 종속국이 되면 결렬됩니다.\n4. 진행도가 §Y100§!에 이르면 [FROM.GetNameWithFlag]을(를) 합병합니다. §Y1§!년 동안 §R재통합 부담§!을 겪으며, 수락한 모든 요구는 §Y3§!년 동안 적용됩니다."
 SOV_reunification_cooldown: "최근 통합 협상 이탈"
 SOV_negotiate_shard_release: "[FROM.GetNameWithFlag]의 종속 해제 협상"
 SOV_negotiate_shard_release_desc: "[FROM.GetNameWithFlag]은(는) 외국의 종주국에 복종하고 있습니다. 그 후견국에 완전한 독립을 허용해 달라고 요청할 수 있으며, 이는 통합 협상으로 가는 길을 엽니다."
 SOV_prepare_reconquest: "[FROM.GetNameWithFlag]의 무력 탈환 준비"
 SOV_prepare_reconquest_desc: "[FROM.GetNameWithFlag]이(가) 협상을 통해 복귀하지 않는다면 군이 되찾아 올 수 있습니다. 같은 국민에게 총구를 돌리는 것은 국내에서 큰 대가를 치르게 할 것입니다."
 SOV_prepare_reconquest_tt: "§Y60§!일 후 [FROM.GetNameWithFlag]을(를) 상대로 §Y전쟁 목표§!를 주장할 수 있습니다. 이를 추진하면 안정도 §R15%§!와 전쟁 지지도 §R15%§!를 잃습니다."
 SOV_reunification_minus_15: "§R통합 진행도가 15 감소합니다§!"
 SOV_breakaway_defense_category: "공화국 방위"
 SOV_breakaway_defense_category_desc: "모스크바로부터의 독립은 이를 지키는 군대만큼만 안전합니다. 우리 영토에 있는 옛 러시아 보급 창고의 물자로 우리 자체 병력을 무장시킬 수 있습니다."
 SOV_breakaway_raise_army: "국민군 창설"
 SOV_breakaway_raise_army_desc: "우리는 현지 지원병과 영토 내 보급 창고에 있던 전직 러시아 군인들을 무장시킬 수 있습니다. 수도에 보병 여단 §Y10§!개와 기갑 보병 여단 §Y5§!개가 편성됩니다."
 SOV_reunification_mission_desc: "협상은 매달 진행됩니다. 간헐적인 차질로 양보가 필요할 수 있으며, 지역 대표단이 새로운 요구를 추가할 수도 있습니다. 우리나 상대가 전쟁 중이면 협상이 중단되며, 상대가 소멸하거나 외세의 지배 아래 들어가면 결렬됩니다."
 SOV_reunification_mission_tt: "통합 진행도는 매달 §G10§! 상승하며, 그들의 우리에 대한 호감도가 §Y50§! 이상이면 §G5§! 더, 우리 안정도가 §Y40%§! 미만이면 §R5§! 덜 오릅니다. §Y100§!에 이르면 해당 지역이 합병됩니다."
 SOV_reconquest_mission: "재정복 준비"
 SOV_reconquest_mission_desc: "우리 장군들이 이탈한 지역을 되찾기 위한 계획을 세우고 있습니다. 타이머가 끝나면 작전 준비가 완료됩니다."
 SOV_reunification_demand_offered_tt: "협상이 끝나면 이 요구를 §Y3§!년 동안 이행해야 합니다:"
 SOV_reunification_reroll_tt: "그들의 대표단이 다른 요구를 제시합니다. 협상 한 차례당 한 번만 압박할 수 있습니다."
 SOV_reunification_cooldown_tt: "§R365§!일 동안 이 지역과 협상을 재개할 수 없습니다."
 SOV_russia_reunited_legacy_tt: "이것이 만료되면 §Y재통합된 러시아§!가 영구적인 §Y재통합의 유산§!이 됩니다."
 sov_dissolution.13.t: "조건을 제시하는 지역들"
 sov_dissolution.13.d: "재편입 협상을 시작하기 위해 대표단들이 모스크바에 도착했습니다. 어떤 합의에 서명하기 전에 지역 지도부는 자신들만의 보장을 요구하고 있습니다."
 sov_dissolution.13.a: "그들의 조건을 수락한다"
 sov_dissolution.13.b: "다른 조건을 요구한다"
 sov_dissolution.13.c: "협상장을 떠난다"
 sov_dissolution.14.t: "협상 테이블에 오른 새 조건"
 sov_dissolution.14.d: "협상이 한창이던 중 지역 대표단이 조건을 하나 더 추가했습니다. 이 조건 없이는 주민들이 재편입을 받아들이지 않을 것이라고 주장합니다."
 sov_dissolution.14.a: "새 조건에 동의한다"
 sov_dissolution.14.b: "거부하고 협상을 질질 끈다"
 sov_dissolution.15.t: "재통합 노력의 붕괴"
 sov_dissolution.15.d: "우리가 되찾고자 했던 지역이 소멸했거나 외세의 지배 아래 들어갔습니다. 합의에 서명할 상대가 남지 않았고, 우리의 노력은 물거품이 되었습니다."
 sov_dissolution.15.a: "쓰라린 좌절이다"
 sov_dissolution.16.t: "준비를 마친 군"
 sov_dissolution.16.d: "장군들이 이탈 지역 탈환 계획이 완성되었다고 보고합니다. 진격을 명령하면 러시아인끼리 싸우게 되며, 국민은 이를 잊지 않을 것입니다."
 sov_dissolution.16.a: "진격을 명령한다"
 sov_dissolution.16.b: "물러선다"
 sov_dissolution.17.t: "다시 하나가 된 러시아"
 sov_dissolution.17.d: "마지막 이탈 지역이 돌아왔습니다. 붕괴 이후 처음으로 모스크바가 연방의 구석구석을 다스립니다. 이제 재건 작업이 시작됩니다."
 sov_dissolution.17.a: "나라를 재건한다"
 sov_dissolution.18.t: "무너진 정부"
 sov_dissolution.18.d: "패배가 우리를 전쟁으로 이끈 이들의 권위를 산산조각 냈습니다. 군은 굴욕을 당하고 지역들은 이탈하는 가운데 기존 지도부는 어쩔 수 없이 물러났습니다. 이제 경쟁하는 파벌들이 모스크바의 공백을 메우려 다투고 있습니다."
 sov_dissolution.18.a: "자유주의 개혁파가 정권을 잡는다"
 sov_dissolution.18.b: "공산주의자들이 정권에 복귀한다"
 sov_dissolution.18.c: "보수파가 거국일치 정부를 구성한다"
 sov_dissolution.18.e: "장군들이 권력을 장악한다"
 SOV_post_defeat_regime_tt: "전쟁에서 패한 지도자는 §R권좌에서 물러나며§!, 우리를 패배로 이끈 정당은 인기를 잃습니다."
 news.93.t: "재통합된 러시아"
 news.93.d: "패배로 연방이 찢어진 지 수년 만에 러시아는 모든 이탈 지역에 대한 권위를 회복했습니다. 분석가들은 재건에 열의를 보이는 재통합된 러시아가 곧 세계 무대에서 다시 존재감을 드러낼 것이라고 경고합니다."
 news.93.a: "우리나라는 다시 하나가 되었다"
 news.93.b: "곰이 힘을 모았다"
 SOV_reunification_demand_western_elites_idea: "친서방 지역 엘리트"
 SOV_reunification_demand_western_elites_idea_desc: "지역 지도자들이 서방 파트너들과의 관계를 연방 안으로 가져왔으며, 이제 그 영향력이 모스크바에까지 미칩니다."
 SOV_reunification_demand_tax_autonomy_idea: "지역 세금 자치"
 SOV_reunification_demand_tax_autonomy_idea_desc: "재편입된 지역들이 거둔 세금의 더 큰 몫을 보유하면서 연방 예산에 돌아가는 몫이 줄어듭니다."
 SOV_reunification_demand_resource_rights_idea: "지역 자원 권리"
 SOV_reunification_demand_resource_rights_idea_desc: "지방 당국이 자신들의 땅 아래 매장된 광물 자원에 대한 통제권을 유지해 연방의 접근이 제한됩니다."
 SOV_reunification_demand_cossack_self_rule_idea: "카자크 자치"
 SOV_reunification_demand_cossack_self_rule_idea_desc: "카자크 집단이 전통적인 자치 제도와 연방 징병 면제를 유지했습니다."
 SOV_reunification_demand_federal_subsidies_idea: "연방 보조금 공약"
 SOV_reunification_demand_federal_subsidies_idea_desc: "모스크바가 지역 복지와 사회 기반 시설에 자금을 대기로 약속하여 공장들이 소비재 생산에 묶여 있습니다."
 SOV_reunification_demand_separatist_amnesty_idea: "분리주의자 사면"
 SOV_reunification_demand_separatist_amnesty_idea_desc: "전직 분리주의 지도자들이 사면을 받고 연방 정부의 직책을 얻어 우리의 의제를 방해하고 있습니다."
 SOV_reunification_demand_garrison_retention_idea: "지역 수비대 유지"
 SOV_reunification_demand_garrison_retention_idea_desc: "지역 민병대가 장교와 급여 체계를 그대로 유지한 채 군에 편입되어 군인 임금이 부풀려졌습니다."
 SOV_reunification_demand_regional_parliament_idea: "강화된 지역 의회"
 SOV_reunification_demand_regional_parliament_idea_desc: "지역 의회가 연방법에 이의를 제기할 권리를 얻어, 이제 모든 개혁이 지방에서 저항에 직면합니다."
 SOV_russia_reunited_idea: "재통합된 러시아"
 SOV_russia_reunited_idea_desc: "연방이 다시 하나가 되면서 국가는 전쟁으로 파괴된 것을 재건하는 데 전력을 쏟았습니다."
 SOV_russia_reunited_legacy_idea: "재통합의 유산"
 SOV_russia_reunited_legacy_idea_desc: "갈가리 찢겼다가 다시 하나가 된 나라의 기억이 러시아인들을 정부와 결속시킵니다."