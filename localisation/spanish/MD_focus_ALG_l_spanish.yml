 ALG_cabinet_category_desc: "The cabinet is the public face of Algerian governance under President Bouteflika. Behind titles and portfolios lies a constant balancing act between loyalty, competence, and the influence of le pouvoir.\n\nCabinet Loyalty: [GetCabinetLoyaltyLevel]\nCabinet Competence: [GetCabinetCompetenceLevel]\nCabinet Deep State Influence: [GetCabinetDeepStateLevel]"
