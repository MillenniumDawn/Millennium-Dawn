l_polish:
 faroe_islands_focus: "Drzewo celów Wysp Owczych"
 FAO_national_decisions: "Decyzje władz Wysp Owczych"
 FAO_national_decisions_desc: "Sytuacja na Wyspach Owczych jest jednocześnie spokojna i pełna napięcia. Oprócz prób podejmowanych przez polityków, by – cóż, po prostu cokolwiek zrobić – na rzecz rozwoju wysp i ich mieszkańców, trzeba się tam również mierzyć z nieustannie powracającą kwestią ewentualnej niepodległości. Jedni chcą jej natychmiast, inni woleliby poczekać na osiągnięcie większej stabilności. Tak czy inaczej, to, czy wyspy ostatecznie staną się w pełni wolne, zależeć będzie zarówno od samych Farerów, jak i od Duńczyków."
 FAO_decision_independence_war: "Wojna o niepodległość"
 FAO_decision_independence_war_desc: "Nadszedł ten moment, a politycy postawili obywateli pod ścianą. Wojna została wypowiedziana i trwa teraz wyścig z czasem: czy Danii uda się utrzymać koronę, czy też władza ta wymknie się jej z rąk, gdy presja społeczna wymusi zawarcie pokoju między wszystkimi stronami?"