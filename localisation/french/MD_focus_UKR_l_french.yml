 UKR_decrease_pension_desc: "Si le débat à la Verkhovna Rada est §Gréussi§!, la loi sera §Ymodifiée§!"
 UKR_promote_russian_interests: "Promouvoir les intérêts russes [SOV.GetFlag]"
 UKR_promote_russian_interests_desc: "Nous promouvrons les intérêts russes [SOV.GetFlag] au sein de la nation pour accroître la popularité du bloc pro-russe lors des prochaines élections."
 UKR_promote_western_interests: "Promouvoir les intérêts occidentaux [USA.GetFlag]"
 UKR_promote_western_interests_desc: "Nous promouvrons les intérêts américains [USA.GetFlag] au sein de la nation pour accroître la popularité du bloc pro-occidental lors des prochaines élections."
 UKR_dissolved_verkhovna: " A dissous le Parlement"
 UKR_get_50_buggies: "Assembler 50 véhicules polyvalents"
 UKR_party_regions_start: "Parti des régions"
 UKR_party_regions_start_desc: "Yanoukovytch a pris le pouvoir dans le pays entre ses mains, il est temps pour les régions !"
 UKR_party_regions_decrease: "Réduire le personnel administratif"
 UKR_party_regions_decrease_desc: "Nous réduirons le nombre d'employés de l'appareil d'État."
 UKR_party_regions_anti_corrupt: "Comité national anti-corruption"
 UKR_party_regions_anti_corrupt_desc: "Nous créerons un nouveau ministère, le Comité national anticorruption, pour combattre les fonctionnaires corrompus dans notre pays."
 UKR_party_regions_unifed_window: "Investissements à guichet unique"
 UKR_party_regions_unifed_window_desc: "Nous introduirons de nouvelles règles pour les investisseurs dans notre pays, qui leur faciliteront l'interaction avec nos autorités."
 UKR_party_regions_decrease_agro: "Réduire les régulations sur l'agriculture"
 UKR_party_regions_decrease_agro_desc: "L'agro-industrie recevra de nouveaux avantages, ce qui, nous l'espérons, augmentera sa productivité."
 UKR_party_regions_laizes: "Laissez-faire"
 UKR_party_regions_laizes_desc: "Nous adopterons partiellement l'un des principes libertariens dans notre politique économique et n'interviendrons pas dans les processus économiques."
 UKR_party_regions_taxx: "Change The Tax Code"
 UKR_party_regions_taxx_desc: "Nous apporterons les changements nécessaires au code des impôts. Nos concessions réduiront les taxes locales par trois !"
 UKR_party_regions_autocracy: "Renforcer l'autocratie"
 UKR_party_regions_autocracy_desc: "Un gouvernement fort doit tout contrôler ce qu'il peut, sinon c'est le chaos et le désordre qui existaient avant notre règne."
 UKR_party_regions_pressure_media: "Pression sur les médias"
 UKR_party_regions_pressure_media_desc: "Les médias sont devenus trop libres, il faut refroidir leur ardeur."
 UKR_party_regions_stability_reform: "Stabilité et réforme"
 UKR_party_regions_stability_reform_desc: "Nous assemblerons une coalition loyale de politiciens, que nous appellerons « Stabilité et réformes », qui promeuvra activement nos projets et nos idées."
 UKR_party_regions_stability_restricting_freedom_speech: "Restreindre la liberté d'expression"
 UKR_party_regions_stability_restricting_freedom_speech_desc: "La liberté d'expression s'arrête là où elle commence à nous offenser"
 UKR_party_regions_stability_purge_opposition: "Tenter d'éliminer l'opposition politique"
 UKR_party_regions_stability_purge_opposition_desc: "L'opposition est trop volontaire et sape les institutions du pouvoir en usant de sa liberté, il est temps d'y remédier."
 UKR_party_regions_lustration: "Lustration des gouverneurs et des agences de sécurité"
 UKR_party_regions_lustration_desc: "La lustration des personnes déloyales et ouvertement nuisibles à l'État dans ces structures est nécessaire depuis longtemps."
 UKR_party_regions_agreement_opposition: "Accords avec l'opposition"
 UKR_party_regions_agreement_opposition_desc: "Nous essaierons d'établir des relations avec une partie de l'opposition, la divisant ainsi."
 UKR_party_regions_appease_the_westermists: "Appease The Westernists"
 UKR_party_regions_appease_the_westermists_desc: "Western Ukraine has long been a hotbed of discontent and instability, we will appease them, we will try to give them what they want - promises."
 UKR_party_regions_request_russian: "Demander des investissements russes"
 UKR_party_regions_request_russian_desc: "Nous demanderons des investissements russes, qui ne seront évidemment pas de trop."
 UKR_party_regions_personal_gain: "Se concentrer sur le gain personnel"
 UKR_party_regions_personal_gain_desc: "Le pays, c'est bien sûr bien, mais il vaut la peine de penser à soi."
 UKR_party_regions_titushki: "Rassembler les Titushki"
 UKR_party_regions_titushki_desc: "Nous utiliserons une nouvelle méthode pour discréditer les rassemblements de l'opposition : les Titushki."
 UKR_party_regions_regional_council: "Conseil régional"
 UKR_party_regions_regional_council_desc: "Nous introduirons une nouvelle autorité, le conseil régional, pour faciliter l'interaction des autorités régionales et étatiques."
 UKR_party_regions_optimise_east_ukraine_gamble: "Pari sur l'Ukraine orientale"
 UKR_party_regions_optimise_east_ukraine_gamble_desc: "L'Ukraine orientale a toujours été notre patrimoine ; nous essaierons activement d'obtenir leur soutien, car ils sont en fait notre électorat principal."
 UKR_party_regions_optimise_prior_loyals: "Prioriser les loyaux"
 UKR_party_regions_optimise_prior_loyals_desc: "Les gens qui nous sont loyaux sont bien plus importants, et nous les promeuvrons activement."
 UKR_party_regions_western_oligarch: "Approcher les oligarques occidentaux"
 UKR_party_regions_western_oligarch_desc: "Les oligarques de l'ouest de l'Ukraine seront notre priorité ; nous voulons trouver un équilibre entre l'ouest et l'est, peut-être leurs oligarques nous aideront-ils."
 UKR_party_regions_meet_akhmetov: "Rencontrer Akhmetov"
 UKR_party_regions_meet_akhmetov_desc: "Le clan oligarchique de Donetsk, et son représentant Rinat Akhmetov, une importante ressource politique que nous utilisons pour maintenir notre pouvoir : il vaut la peine de l'écouter."
 UKR_party_regions_informational_act: "Loi sur l'information"
 UKR_party_regions_informational_act_desc: "Le nouvel acte, ou loi, ouvrira aux larges masses l'accès aux activités des politiciens, ce qui réduira la composante de corruption de leurs activités."
 UKR_party_regions_optimise_ministries: "Optimiser les ministères"
 UKR_party_regions_optimise_ministries_desc: "Les structures gouvernementales sont devenues trop lourdes : il est temps de les réduire."
 UKR_party_regions_reform_constituion: "Réformer la Constitution"
 UKR_party_regions_reform_constituion_desc: "Nous promouvrons activement la réforme de la Constitution. Il est temps que notre pays avance vers des changements globaux !"
 UKR_party_regions_compulsory: "Changement du service militaire obligatoire"
 UKR_party_regions_compulsory_desc: "Nous changerons le système de service dans notre armée, la transformant littéralement en armée de contrat."
 UKR_party_regions_pension_reform: "Réforme des retraites"
 UKR_party_regions_pension_reform_desc: "La réforme des retraites mijote depuis longtemps et nous la mènerons maintenant."
 UKR_party_regions_kozhara: "Kozhara dirige le ministère des Affaires étrangères"
 UKR_party_regions_kozhara_desc: "Nous nommerons l'un de nos amis et partenaires ministre des Affaires étrangères."
 UKR_party_regions_youth_region: "Élargir les régions jeunesse"
 UKR_party_regions_youth_region_desc: "L'aile jeunesse de notre parti gagnera davantage de pouvoir et d'influence ; nous leur ouvrirons l'accès."
 UKR_party_regions_berkut_reforms: "Réformes de Berkut"
 UKR_party_regions_berkut_reforms_desc: "Berkut, en tant que structure policière, a besoin de réformes afin que nous puissions nous protéger."
 UKR_party_regions_berkut_extreme_training: "Entraînement extrême pour Berkut"
 UKR_party_regions_berkut_extreme_training_desc: "Berkut deviendra encore plus actif dans la conduite de compétitions et de processus d'entraînement pour améliorer son savoir-faire."
 UKR_dual_language: "État bilingue"
 UKR_dual_language_desc: "La langue russe occupe une part importante de la vie de l'Ukraine et il serait sot de le nier. Nous ne promeuvrons pas de stupides idées politiques sur l'abolition de la langue russe dans notre pays."
 UKR_cancel_decommunization: "Anti-décommunisation"
 UKR_cancel_decommunization_desc: "Nous ne permettrons pas une lutte contre notre passé soviétique, lorsque nous combattions le fascisme et le nazisme."
 UKR_donbass_autonomy_pass: "Autonomie spéciale du Donbass"
 UKR_donbass_autonomy_pass_desc: "Le Donbass est une région particulière de notre pays ; peut-être est-il temps d'ouvrir une discussion sur l'autonomie spéciale de cette région."
 UKR_sng_integrate: "Intégration à la CEI"
 UKR_sng_integrate_desc: "Nous poursuivrons les processus d'intégration dans le cadre de la coopération entre les pays de la CEI."
 UKR_europe_negotiat: "Négociations avec l'UE"
 UKR_europe_negotiat_desc: "Nous entamerons des négociations avec l'Union européenne sur une question qui est à notre agenda politique depuis longtemps. C'est une association avec l'Union européenne."
 UKR_russian_ukrainian_military_coop: "Coopération militaire ukraino-russe"
 UKR_russian_ukrainian_military_coop_desc: "Nous renforcerons la coopération avec les Forces armées russes."
 UKR_party_regions_european_chart: "European Language Charter"
 UKR_party_regions_european_chart_desc: "Nous signerons la Charte européenne des langues régionales comme indicateur de notre attitude démocratique envers les minorités nationales."
 UKR_parti_regions_anti_corruption_commitie: "Comité national anti-corruption"
 UKR_parti_regions_anti_corruption_commitie_desc: "Le nouveau comité est conçu pour lutter contre les fonctionnaires corrompus à tous les niveaux."
 UKR_parti_regions_invest_open_window: "Investissements à guichet unique"
 UKR_parti_regions_taxx: "Code des impôts réformé"
 UKR_parti_regions_laizes: "Laissez-faire"
 UKR_parti_regions_stability_reform: "Stabilité et réforme"
 UKR_parti_regions_lustration: "Lustres"
 UKR_parti_regions_opposition_agree: "Coopération avec l'opposition"
 UKR_parti_regions_titushki: "Titushki"
 UKR_parti_regions_optimise_ministers: "Optimisation des ministères"
 UKR_parti_regions_inform_act: "Loi sur l'information"
 UKR_parti_regions_pension_reform: "Réforme des retraites"
 UKR_parti_regions_youth_regions: "Régions jeunesse"
 UKR_parti_regions_autocracy: "Autocratie de Yanoukovytch"
 UKR_parti_regions_autocracy_desc: "Les actions de Yanoukovytch sont largement qualifiées de véritable autocratie, mais est-ce important pour le bien de l'État ?"
 ukraine_regions.7.t: "Investissements en Ukraine"
 ukraine_regions.7.d: "Le président ukrainien nous a demandé d'investir dans son pays. Devrions-nous accepter sa proposition ?"
 ukraine_regions.7.a: "Oui"
 ukraine_regions.7.b: "Non"
 ukraine_regions.8.t: "Investissements en Ukraine"
 ukraine_regions.8.d: "La Russie a accepté d'investir dans notre pays"
 ukraine_regions.8.a: "Bien"
 ukraine_regions.9.t: "Investissements en Ukraine"
 ukraine_regions.9.d: "La Russie a refusé d'investir dans notre pays"
 ukraine_regions.9.a: "triste"
 ukraine_regions.10.t: "Coopération avec la CEI"
 ukraine_regions.10.d: "Nous n'avons pas activement coopéré avec les pays de la CEI ces dernières années, et une partie de la population favorable à l'opposition pourrait également s'indigner de notre décision de poursuivre cette coopération. Devons-nous le faire ?"
 ukraine_regions.10.a: "Bien sûr"
 ukraine_regions.10.b: "Non"
 ukraine_regions.11.t: "Négociations d'association avec l'UE"
 ukraine_regions.11.d: "Il est temps de lancer les négociations d'association avec l'Union européenne, que nous cherchons à entamer depuis si longtemps. Devons-nous enfin décider de les commencer ?"
 ukraine_regions.11.a: "Bien sûr"
 ukraine_regions.11.b: "Non"
 ukraine_regions.12.t: "Question du statut du Donbass"
 ukraine_regions.12.d: "Depuis des années, nous entendons des propositions pour accorder un statut spécial au Donbass, entamant ainsi un lent processus de fédéralisation de l'Ukraine. C'est une décision sérieuse que nous devons prendre, en réalisant qu'il n'y aura pas de retour en arrière."
 ukraine_regions.12.a: "Nous leur accorderons un statut spécial"
 ukraine_regions.12.b: "Laissons les choses comme elles sont"
 ukraine_nato_help.1.t: "[FROM.GetName] Provides Monetary Help"
 ukraine_nato_help.1.d: "[GetUKRNatoAidDonorLine]"
 ukraine_nato_help.1.a: "Bien"
 ukraine_parliament.100.d: "Le bloc pro-russe remporte la majorité des sièges"
 ukraine_parliament.100.t: "Le bloc prorusse remporte la majorité des sièges"
 ukraine_parliament.100.a: "Voyons comment ils font"
 ukraine_parliament.200.d: "Le bloc pro-occidental remporte la majorité des sièges"
 ukraine_parliament.200.t: "Le bloc pro-occidental remporte la majorité des sièges"
 ukraine_parliament.200.a: "Voyons comment ils font"
 ukraine_parliament.300.t: "Le bloc pro-ukrainien remporte la majorité des sièges"
 ukraine_parliament.300.d: "Le bloc pro-ukrainien de notre parlement a remporté la majorité des sièges lors des récentes élections, en raison de l'influence vacillante des gouvernements américain et russe."
 ukraine_parliament.300.a: "Voyons comment ils font"
 ukraine_parliament.400.t: "Élections parlementaires"
 ukraine_parliament.400.d: "La saison électorale est de nouveau arrivée, et les bureaux de vote s'ouvrent partout dans la nation. Espérons que la participation soit assez élevée pour apporter un bon changement au pays."
 ukraine_parliament.400.a: "Voyons comment ça se passe"
 ukraine_parliament.1.t: "Le Parlement approuve la loi de centralisation"
 ukraine_parliament.1.d: "Le Parlement a décidé d'adopter un projet de loi qui augmente nos dépenses bureaucratiques, suite à une proposition que nous avions faite il y a quelques jours."
 ukraine_parliament.1.a: "Super"
 ukraine_parliament.2.t: "Le Parlement rejette la nouvelle loi de centralisation"
 ukraine_parliament.2.d: "Le Parlement a décidé de rejeter un projet de loi qui aurait augmenté nos dépenses bureaucratiques. Cela fait suite à notre proposition d'il y a quelques jours, et il semble que la motion n'ait pas été assez populaire."
 ukraine_parliament.2.a: "C'est malheureux"
 ukraine_parliament.2.b: "Peut-être qu'un peu de corruption pourrait changer leur avis..."
 ukraine_parliament.3.t: "Le Parlement approuve la loi de décentralisation"
 ukraine_parliament.3.d: "Le Parlement a approuvé notre demande de diminuer les dépenses de bureaucratie. Cela fait suite à notre proposition d'il y a quelques jours, et il semble que la motion ait gagné beaucoup de popularité et de soutien."
 ukraine_parliament.3.a: "Super"
 ukraine_parliament.4.t: "Le Parlement rejette la nouvelle loi de décentralisation"
 ukraine_parliament.4.d: "Le Parlement a décidé de rejeter un projet de loi qui aurait réduit nos dépenses bureaucratiques. Cela fait suite à notre proposition d'il y a quelques jours, et il semble que la motion n'ait pas été assez populaire."
 ukraine_parliament.4.a: "C'est malheureux"
 ukraine_parliament.4.b: "Peut-être qu'un peu de corruption pourrait changer leur avis..."
 ukraine_parliament.5.t: "Le Parlement approuve notre nouveau budget militaire"
