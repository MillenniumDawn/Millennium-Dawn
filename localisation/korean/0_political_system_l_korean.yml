 generic.Western_Autocracy: "£generic_Western_Autocracy_small 친서방 전제주의자"
 generic.Western_Autocracy_desc: "친서방 전제주의는 서방의 지정학적 이익에 부합하는 비민주적, 권위주의적 이념의 폭넓은 스펙트럼을 가리킵니다."
 generic.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 generic.conservatism: "£generic_conservatism_small 보수주의자"
 generic.conservatism_desc: "보수주의는 전통 문화, 단결, 안정적인 생활 방식의 중요성을 옹호하는 온건 우파 이념의 폭넓은 스펙트럼을 가리킵니다. 보수주의자들은 사회 및 경제 문제에 대한 국가 개입에 반대하는 경향이 있으며, 규제가 줄어들수록 국민의 사회적 이동성이 높아진다고 믿는 경우가 많습니다."
 generic.conservatism_icon: "£generic_conservatism_small"
 generic.liberalism: "£generic_liberalism_small 자유주의자"
 generic.liberalism_desc: "자유주의는 개인의 권리를 증진하고 국가 권력의 확대보다 자유를 중시하는 중도 이념입니다. 자유주의자들은 전 세계와의 자유 무역이 이루어지는 자유 시장의 틀 안에서 진보적인 사회 정책을 지지하는 경향이 있습니다."
 generic.liberalism_icon: "£generic_liberalism_small"
 generic.socialism: "£generic_socialism_small 사회민주주의자"
 generic.socialism_desc: "사회민주주의는 대부분의 자유주의 분파보다 더 폭넓게 경제적, 사회적 정의를 옹호하는 좌익 이념의 폭넓은 스펙트럼을 가리킵니다. 사회민주주의자들은 자본주의를 인간적으로 개선하여 불평등과 억압을 억제하고 민주주의를 육성하고자 합니다."
 generic.socialism_icon: "£generic_socialism_small"
 generic.anarchist_communism: "£generic_anarchist_communism_small 좌익 급진주의자"
 generic.anarchist_communism_desc: "좌익 급진주의는 대체로 자본주의와 세계화의 종식을 주장하는 극좌 이념의 폭넓은 스펙트럼입니다. 일부는 무장 저항을 지지할 수도 있지만, 상당수는 스스로를 사회민주주의자보다 '더 좌파'일 뿐이라 여기며 자유민주주의를 받아들입니다."
 generic.anarchist_communism_icon: "£generic_anarchist_communism_small"
 generic.Conservative: "£generic_Conservative_small 반동주의자"
 generic.Conservative_desc: "반동주의는 온건 보수주의자보다 더 나아간 목표를 가진 극우 이념의 폭넓은 스펙트럼을 가리킵니다. 반동주의자들은 대체로 이상화된 과거를 믿으며, 복수주의 및 영토 회복주의 이념과 공격적인 군사 정책을 통해 국가의 옛 영광을 되찾고자 합니다."
 generic.Conservative_icon: "£generic_Conservative_small"
 generic.Autocracy: "£generic_Autocracy_small 전제주의자"
 generic.Autocracy_desc: "전제주의는 한 명의 통치자 또는 특권 엘리트 집단이 모든 정치 권력을 장악하는 비민주적, 권위주의적 정치 체제의 폭넓은 스펙트럼을 가리킵니다."
 generic.Autocracy_icon: "£generic_Autocracy_small"
 generic.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small 온건 시아파 혁명가"
 generic.Mod_Vilayat_e_Faqih_desc: "온건 시아파 혁명가는 시아파 이슬람을 엄격하게 해석하지만 강경파 형제들보다 더 큰 정치적 다원주의를 지지하는 우파 시아파 신봉자들의 스펙트럼을 가리킵니다. 그럼에도 이들은 대체로 신정 체제의 존속을 지지합니다."
 generic.Mod_Vilayat_e_Faqih_icon: "£generic_Mod_Vilayat_e_Faqih_small"
 generic.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 강경파 시아파 혁명가"
 generic.Vilayat_e_Faqih_desc: "강경파 시아파 혁명가는 시아파 이슬람을 엄격하게 해석하는 극우 및 군국주의 성향의 시아파 신봉자들의 스펙트럼을 가리킵니다. 이들은 수니파에 대체로 부정적인 시각을 가지고 있으며, 신정 국가 안에서 시아파 이슬람이 지속되도록 보장하고자 합니다."
 generic.Vilayat_e_Faqih_icon: "£generic_Vilayat_e_Faqih_small"
 generic.Kingdom: "£generic_Kingdom_small 체제 옹호 살라피주의"
 generic.Kingdom_icon: "£generic_Kingdom_small"
 generic.Kingdom_desc: "와하비즘과 마드칼리즘 등 살라피 사상의 일부 계통은 급진적 혁명과 무장 지하드보다 현상 유지를 옹호합니다. 이 살라피들은 쿠틉주의 지하디스트들의 근본주의적이고 불관용적인 견해를 공유하지만, 대체로 폭력을 거부하고 기존 정부를 지지합니다. 이러한 순응적 태도 덕분에 이들은 더욱 정치적인 이슬람주의 분파가 자국 권력에 가하는 위협을 두려워하는 권위주의 아랍 국가들에게 인기가 있습니다."
 generic.Caliphate: "£generic_Caliphate_small 살라피 지하드주의"
 generic.Caliphate_icon: "£generic_Caliphate_small"
 generic.Caliphate_desc: "살라피 지하드주의는 사이드 쿠틉의 가르침에서 영감을 받은 극도로 엄격하고 초보수적이며 근본주의적인 이슬람 정치 이념의 분파를 가리킵니다. 이들은 모든 이슬람 영토를 정복하여 이슬람 율법에 대한 가혹한 해석으로 통치하고자 합니다. 다른 형태의 이슬람이나 소수 종교를 인정하지 않으며, 목표를 달성하기 위해서라면 어떤 수단도 마다하지 않습니다."
 generic.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small 온건 이슬람주의자"
 generic.Neutral_Muslim_Brotherhood_icon: "£muslim_brotherhood_small"
 generic.Neutral_Muslim_Brotherhood_desc: "온건 이슬람주의는 이슬람 율법의 범위 안에서 민주 국가를 수립하고자 하는 이슬람 정치 운동의 폭넓은 스펙트럼을 가리킵니다."
 generic.Neutral_Autocracy: "£generic_Neutral_Autocracy_small 비동맹 전제주의자"
 generic.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 generic.Neutral_Autocracy_desc: "전제주의는 모든 권력이 한 명의 통치자 손에 집중되는 비민주적, 권위주의적 이념의 폭넓은 스펙트럼을 가리킵니다."
 generic.Neutral_conservatism: "£generic_Neutral_conservatism_small 보수주의자"
 generic.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 generic.Neutral_conservatism_desc: "보수주의는 전통 문화, 단결, 안정적인 생활 방식의 중요성을 옹호하는 온건 우파 이념의 폭넓은 스펙트럼을 가리킵니다. 보수주의자들은 사회 및 경제 문제에 대한 국가 개입에 반대하는 경향이 있으며, 규제가 줄어들수록 국민의 사회적 이동성이 높아진다고 믿는 경우가 많습니다."
 generic.oligarchism: "£generic_oligarchism_small 과두주의자"
 generic.oligarchism_icon: "£generic_oligarchism_small"
 generic.oligarchism_desc: "과두제는 통제권이 정치적, 경제적 엘리트로 이루어진 소수 집단의 손에 놓인 권력 구조를 가리킵니다. 과두제는 대개 비민주적이고 권위주의적인 성격을 띱니다."
 generic.Neutral_Libertarian: "£generic_Neutral_Libertarian_small 자유지상주의자"
 generic.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 generic.Neutral_Libertarian_desc: "자유지상주의는 자유를 핵심 원칙으로 삼는 폭넓은 정치 이념과 운동을 가리킵니다. 자유지상주의자들은 보수주의자보다 더 폭넓게 사회, 정치, 경제 생활 전반에 대한 정부 개입을 제한하는 것을 지지하는 경향이 있습니다."
 generic.Neutral_green: "£generic_Neutral_green_small 녹색주의자"
 generic.Neutral_green_icon: "£generic_Neutral_green_small"
 generic.Neutral_green_desc: "녹색 정치 또는 생태 정치는 비폭력, 사회 정의, 직접 민주주의, 환경주의를 옹호하는 좌익 운동의 폭넓은 스펙트럼을 가리킵니다."
 generic.neutral_Social: "£generic_neutral_Social_small 사회주의 민주주의자"
 generic.neutral_Social_icon: "£generic_neutral_Social_small"
 generic.neutral_Social_desc: "사회주의 민주주의 이념은 경제적, 사회적 정의를 옹호하는 좌익 이념을 가리킵니다. 자본주의의 틀 안에서 활동하면서도 불평등을 억제하기 위해 대대적인 부의 재분배를 추구합니다. 복지 국가를 장려하며 민간 기업에 대한 규제를 강화하고자 합니다."
 generic.Neutral_Communism: "£generic_Neutral_Communism_small 공산주의자"
 generic.Neutral_Communism_icon: "£generic_Neutral_Communism_small"
 generic.Neutral_Communism_desc: "공산주의는 자본주의 체제를 종식시키고 공동체적인 노동자의 낙원을 건설하자고 주장하는 이념을 폭넓게 가리킵니다. 현실에서 공산주의 국가들은 자본주의적 경제 체제를 유지하며 비민주적인 성격을 띠는 경우가 많습니다."
 generic.Nat_Populism: "£generic_Nat_Populism_small 우익 포퓰리스트"
 generic.Nat_Populism_icon: "£generic_Nat_Populism_small"
 generic.Nat_Populism_desc: "우익 포퓰리즘은 사회를 지배한다고 인식되는 엘리트에 맞서 국민에게 힘을 실어주고자 하는 포퓰리즘 이념의 특정 분파를 가리킵니다. 우익 포퓰리스트들은 대체로 반세계화, 보호무역주의, 토착민 우선주의, 민족주의, 이민 반대를 지지합니다."
 generic.Nat_Fascism: "£generic_Nat_Fascism_small 파시스트"
 generic.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 generic.Nat_Fascism_desc: "파시즘은 군국주의적 색채를 띠는 권위주의적 초민족주의의 한 형태입니다. 파시즘은 절대적 권위를 휘두르는 한 명의 지도자가 이끄는 일당 국가를 수립하고자 하며, 국가의 부흥을 도모하기 위해 폭력과 공격적인 팽창주의를 지지합니다."
 generic.Nat_Autocracy: "£generic_Nat_Autocracy_small 군사 정권"
 generic.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 generic.Nat_Autocracy_desc: "군사 정권은 군 지도자들로 구성된 위원회가 이끄는 정부를 가리킵니다. 군사 정권은 대개 비민주적이고 권위주의적인 성격을 띠며, 매우 넓은 의미에서 군사 독재 또는 군정의 한 형태로 볼 수 있습니다."
 generic.Monarchist: "£generic_Monarchist_small 군주주의자"
 generic.Monarchist_icon: "£generic_Monarchist_small"
 generic.Monarchist_desc: "군주주의 이념은 절대 군주제를 가리킵니다."
 western_icon: "£democratic_group_small"
 emerging_icon: "£communism_group_small"
 salafist_icon: "£fascism_group_small"
 non_aligned_icon: "£neutrality_group_small"
 nationalist_icon: "£nationalist_group_small"
 col_checkmark: "£col_check"
 FULL_POLITICS_VIEW_BUTTON_TT: "정당 보기 확장"
 si_title_text: "정당 및 운동"
 si_title_text_tt: "§Y현행 정치 법률:§!\n선거 실시 여부: [has_elections_check]\n선거 문턱: [?election_threshold|%0] [term_limit_text]"
 western_desc: "서방 및 친서방 정부들은 소련 붕괴 이후 줄곧 군림해 온 미국 중심의 자유주의 세계 질서를 유지하고자 합니다. 이들은 세계은행과 IMF 같은 기구를 통해 경제 자유화와 탈국유화를 장려합니다. 서방 성향을 가진 국가의 대다수는 다양한 형태의 민주주의 국가이지만, 현상 유지로 이익을 얻는 친서방 강권 정부들도 그 배후에 있습니다."
 emerging_desc: "신흥국 성향의 정부는 특히 글로벌 사우스와 소련 붕괴 후 지역에서 지배적인 자유주의 세계 질서를 자체적인 대안 기구와 다극적인 국제 정치 방식으로 대체하고자 하는 정부들입니다. 이들은 세계화, 정부 형태, 국내 정책에 대해 서로 다른 태도를 보이는 경우가 많습니다."
 salafist_desc: "살라피주의는 주류 수니파 이슬람에서 갈라져 나온 초보수적이고 불관용적인 근본주의 분파입니다. 20세기 중반 이후 와하비즘을 신봉하는 걸프 군주국들이 그 가르침에 수십억 달러를 지원하면서 세력이 커졌습니다. 살라피주의는 탈레반, 알카에다, ISIS에서 특히 폭력적인 형태로 나타났습니다."
 non_aligned_desc: "비동맹 정부들은 정부 형태와 하위 이념이 매우 다양하며, 대개 외교적 입장에 있어 매우 실용적인 접근을 취합니다. 많은 정부는 단지 자국의 독립이나 기타 지역적 목표를 증진하고자 합니다. 다른 정부들은 영향력을 둘러싼 투쟁 속에서 서로 다른 방향으로 이들을 끌어당기는 강대국들 사이에서 갈팡질팡합니다."
 communist_state_pop_election: "지난 선거에서 [?party_pop_elect_array^4|%1] 득표"
 generic.communist_state: "£generic_Communist_State_small 공산주의자"
 generic.communist_state_desc: "공산주의는 자본주의 체제를 종식시키고 공동체적인 노동자의 낙원을 건설하자고 주장하는 이념을 폭넓게 가리킵니다. 현실에서 공산주의 국가들은 자본주의적 경제 체제를 유지하며 비민주적인 성격을 띠는 경우가 많습니다."
 generic.communist_state_icon: "£generic_Communist_State_small"