 CUB.liberalism_icon: "£CUB_western_liberal"
 CUB.socialism_icon: "£CUB_western_social_democrat"
 CUB.Neutral_Communism: "£CUB_non_aligned_autocracy 古巴共产党 - §g中立派§!"
 CUB.Neutral_Communism_icon: "£CUB_non_aligned_autocracy"
 CUB.Neutral_Communism_desc: ""
 CUB.Neutral_Libertarian: "£CUB_non_aligned_libertarian 古巴自由党"
 CUB.Neutral_Libertarian_icon: "£CUB_non_aligned_libertarian"
 CUB.Neutral_Libertarian_desc: "古巴自由意志党 - 何塞·马蒂，以古巴著名民族英雄、思想家何塞·马蒂命名，是一个致力于自由主义原则的政党。成立是为了满足保护古巴个人自由和经济自由的需要。该党主张尽量减少政府对公民生活的干预、市场经济和保护私有财产。它还积极支持公民权利和民主改革，以加强法治和发展公民社会。受到何塞·马蒂自由主义思想的启发，该党致力于创建一个开放和自由的古巴社会。"
 CUB.Nat_Populism: "£CUB_nationalist_right_wing_populist 东正教复兴党"
 CUB.Nat_Populism_icon: "£CUB_nationalist_right_wing_populist"
 CUB.Nat_Populism_desc: "神权政治是一种政府形式，其中一个或多个神被承认为最高统治当局，为管理政府日常事务的人类中介提供神圣的指导。"
 CUB.Nat_Fascism: "£CUB_nationalist_fascism 古巴长枪党"
 CUB.Nat_Fascism_icon: "£CUB_nationalist_fascism"
 CUB.Nat_Fascism_desc: "受西班牙法西斯运动启发，古巴长枪党于20世纪30年代兴起。该运动宣扬民族主义和威权主义理想，反对共产主义，并寻求建立一个集权的非自由国家。长枪党支持严格的等级制度和公司经济管理。尽管该运动在1959年革命后失去了相当大的人气，但古巴长枪党仍然有积极的支持者，他们继续表达他们的极右观点并支持该运动的思想。"
