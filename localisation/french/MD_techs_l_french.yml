 module_naval_ammo_drone_swarm_1: "Charge d'essaim de drones I"
 module_naval_ammo_drone_swarm_1_desc: "Une charge de magasin de munitions rôdeuses et de drones d'attaque lancés en essaims coordonnés contre des cibles de surface et côtières. Exige des affûts de missiles ou des bancs VLS. Les charges de munitions peuvent aussi être rapidement rééquipées selon la mission."
