 ISR_ask_egypt_to_mediate: "이집트에 외교적 중재 요청"
 israel.93.t: "외교적 호의를 요청하는 이스라엘!"
 israel.93.d: "이스라엘 정부가 최근 우리에게 접근하여 이스라엘과 팔레스타인 간 협상을 중재해 줄 것을 우리 외교 사절단에 요청했습니다.\n\n최근 이스라엘과의 관계가 개선되었고 팔레스타인이 우리를 더 신뢰하는 점을 고려하면, 외교적 비중을 높이기 위해 이를 수락할 수도 있습니다. 동의하겠습니까?"
 israel.93.a: "아라파트에게 연락하라!"
 israel.93.b: "악마와는 거래하지 않는다."
 israel.94.t: "이집트의 거절!"
 israel.94.d: "이집트 지도자 [EGY.GetLeader]는 우리의 제안을 거절했습니다. 그들은 우리와 팔레스타인 사이를 중재하는 데 관심이 없다고 말합니다. 그들은 이러한 외교적 기만 시도를 결코 받아들이지 않을 악마와의 거래로 간주합니다."
 israel.94.a: "뭐라고?!"
 medsuc_pr_tt: "§Y중재§!가 성공하면 팔레스타인과 이스라엘 사이의 긴장이 완화되고 양측 모두 이익을 얻게 됩니다."
 israel.95.t: "샤름 엘셰이크 회담!"
 israel.95.d: "최근 이집트 정부는 이스라엘 정부로부터 우리와 이스라엘 간의 긴장 완화를 중재해 달라는 요청을 받았습니다.\n\n양측 외교 사절단이 샤름 엘셰이크에 도착했으며, 회담의 결과를 좌우할 첫마디를 전할 준비가 되어 있습니다."
 israel.95.a: "상황을 진정시키는 데 동의한다."
 israel.95.b: "어리석은 발상이다!"
 israel.96.t: "샤름 엘셰이크 회담 성공!"
 israel.96.d: "다행히 이집트 정부의 노력 덕분에 이스라엘과 팔레스타인은 긴장을 낮추었고 임시 합의에 도달했습니다."
 israel.96.a: "훌륭해!"
 israel.96.b: "고맙다, 이집트!"
 israel.97.t: "샤름 엘셰이크 회담 실패!"
 israel.97.d: "한 시간의 협상 끝에 팔레스타인 대표단은 회의장을 떠났으며 회담을 계속하지 않을 것입니다."
 israel.97.a: "글쎄... 우리는 노력했다."
 israel.97.b: "완고한 어리석음이다!"
 PAL_emergency_quartet_meeting: "긴급 4자 회담 요청"
 ISR_associate_with_waronterror: "테러와의 전쟁에 동참하라!"
 ISR_clearance_tax_discuss: "세금 정산 논의"
 israel.98.t: "세금 정산 논의"
 israel.98.d: "팔레스타인에 대한 세금 정산액을 늘려야 하겠습니까, 줄여야 하겠습니까? 이제 우리의 결정은 무엇입니까?"
 israel.98.a: "늘려라!"
 israel.98.b: "줄여라."
 israel.98.c: "마음이 바뀌었다."
 israel.99.t: "세금 정산액을 줄이는 이스라엘!"
 israel.99.d: "이스라엘은 최근 세금 정산액을 줄이기로 결정했습니다. 이제 우리는 그 영향을 덜 받게 되었습니다."
 israel.99.a: "좋다!"
 israel.100.t: "세금 정산액을 늘리는 이스라엘!"
 israel.100.d: "이스라엘은 최근 세금 정산액을 늘리기로 결정했습니다. 이제 우리는 그 영향을 더 크게 받게 되었습니다."
 israel.100.a: "개자식들!"
 BLOCK_OPERATIONS_TT: "§R1§! §Y년§! 동안 §Y작전을 수행할 수 없게 됩니다!§!"
