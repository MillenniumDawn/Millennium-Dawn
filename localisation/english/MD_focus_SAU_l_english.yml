 SAU_events.318.b: "AWACS: Joint Ground Link"
 SAU_events.318.c: "AWACS: Early Warning Net"
 SAU_events.318.desc: "How shall the E-3 fleet shape the battle? Each path is a lasting trade-off - it makes us stronger one way and weaker another.\n\n§YHover an option to see exactly what it grants and costs.§!"
 SAU_events.318.t: "AWACS Battle Management Training"
