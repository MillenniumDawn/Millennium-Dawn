 LBA_workers_republic_created_desc: "리비아 정부는 노동자의 낙원을 만들려는 시도로 노동자 공화국을 수립했습니다.\n\n§R우리가 [socialism_L], [communist_state_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L], [Neutral_Communism_L] 중 어느 것에도 통치받지 않으면 이 국가 정신은 제거됩니다§!"
 libya_demand_toubou_territory: "[FROM.GetNameDef]에 투부 영토를 요구한다"
 LibyaFocus.115.b: "사양한다"
 LBA_nigeria_boko_haram_response_tt: "나이지리아는 보코 하람 문제로 내전에 돌입합니다. 리비아는 나이지리아 정부가 선택한 편에 합류합니다."
 LBA_royal_assassination_discovery_tt: "영국이 이 작전을 알아내면 공개 사과를 요구할 수 있습니다."
 LBA_tinner_response_tt: "스위스는 프리드리히 티너를 체포하거나, 고용하거나, 리비아로 돌려보낼 수 있습니다."
 LBA_arms_deal_accepted_tt: "수령국은 리비아와 군사 협력을 수립하며 리비아의 영향력이 2% 증가합니다."
 LBA_reparations_accepted_tt: "이탈리아는 리비아에 배상금을 지불하고 관계를 개선합니다."
 LBA_crete_autonomy_accepted_tt: "그리스는 크레타에 자치권을 부여합니다."
 LBA_submission_accepted_tt: "수령국은 리비아의 괴뢰국이 됩니다."
 LBA_chad_mining_accepted_tt: "차드는 우라늄 거래를 맺으며 리비아의 영향력이 4% 증가합니다."
 LBA_aouzou_cession_accepted_tt: "차드는 아우주 지대를 리비아에 이양합니다."
 LBA_chad_cotton_accepted_tt: "차드는 면화 무역 협정을 받습니다. 리비아는 그에 상응하는 무역 협정을 받으며 영향력이 5% 증가합니다."
 LBA_mengistu_response_tt: "에티오피아는 멩기스투에 대한 지원 또는 산업 투자 중 하나를 받습니다."
 LBA_liberia_coup_response_tt: "표적이 된 국가는 리비아에 굴복하거나 내전에 직면합니다."
 LBA_somalia_destabilization_response_tt: "소말리아의 주들은 내전 상황에 따라 국경 긴장 또는 무장 저항에 직면합니다."
 LBA_socotra_response_tt: "예멘은 점령을 전쟁으로 확대하거나 안정도 하락을 겪을 수 있습니다."
 LBA_brotherhood_accepted_tt: "수령국은 무슬림 형제단에 가입하며 리비아에 세력 회원 자격을 부여합니다."
 LBA_arms_deal_declined_tt: "수령국은 리비아와의 군사 협력을 거절합니다."
 LBA_reparations_declined_tt: "이탈리아는 배상금 지불을 거부합니다."
 LBA_crete_autonomy_declined_tt: "그리스는 크레타의 자치를 거부하며 리비아와의 전쟁을 준비할 수 있습니다."
 LBA_chad_mining_declined_tt: "차드는 제안된 우라늄 거래를 거절합니다."
 LBA_liberia_coup_declined_tt: "표적이 된 국가는 내전으로 저항합니다."
 LBA_aouzou_cession_declined_tt: "차드는 아우주 지대 이양을 거부합니다."
 LBA_chad_cotton_declined_tt: "차드는 면화 무역 협정을 거절합니다."
 LBA_brotherhood_declined_tt: "수령국은 무슬림 형제단 가입을 거부합니다."
 LBA_eu_exists_tt: "유럽 연합이 회원국 1개국 이상으로 존재해야 합니다"
 LBA_fall_of_gaddafi: "카다피가 권좌에서 물러났습니다"
 LBA_tribalism_disabled: "부족 체제가 해체되었습니다"