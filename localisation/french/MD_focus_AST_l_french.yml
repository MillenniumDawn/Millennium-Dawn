 support_doctrine_ast: "Doctrine de soutien"
 support_doctrine_ast_desc: "Notre rôle dans le Pacifique est en fin de compte de soutenir nos alliés en surveillant et en aidant le commerce, en se spécialisant dans les situations de toucher-et-partir."
 dominance_doctrine_ast: "Doctrine de domination"
 dominance_doctrine_ast_desc: "Notre rôle dans le Pacifique est celui de la suprématie navale. Grâce à cela, nos mandats sont exécutés et soutenus par la force que nous exerçons en mer."
