 CPD_peace_deal_explainer_ICON_TT: "Wie die Friedensverhandlungen funktionieren"
 CPD_peace_deal_explainer_ICON_TT_DELAYED: "Der Aufbau eines Friedensabkommens geht einfach. Nötig ist die Auswahl eines Tabs oben und dann die Auswahl dessen, was innerhalb eines Staates aufgegeben oder verlangt werden soll.\n\nEin Friedensabkommen welches §Ynegative§! Kosten hat wird wahrscheinlicher von der KI akzeptiert, hingegen wird ein Friedensabkommen welches §Ypositive§! Kosten weniger wahrscheinlich akzeptiert. Sie können die vollständige Aufschlüsselung der Bereitschaft der KI, einen Deal zu akzeptieren, sehen, indem Sie mit der Maus über die Akzeptanzbox fahren.\n\nJede Friedensvereinbarung, die zwischen Spielern geschlossen wurde, wird von diesen Werten nicht beeinflusst."
 CPD_annex_state_button_TT: "[CPD_ANNEX_STATE_TT_LOC]"
 CPD_annex_state_button_TT_DELAYED: "[CPD_ANNEX_STATE_TT_DELAYED_LOC]"
 CPD_annex_state_button_TT_DEMAND: "Nachfragestaaten"
 CPD_annex_state_button_TT_CONCESSION: "Staaten aufgeben"
 CPD_annex_state_button_TT_DELAYED_DEMAND: "Ausgewählte feindliche Gebiete werden zusammen mit ihrer Bevölkerung, ihren Fabriken und Ressourcen in unsere Nation eingegliedert. Staaten, auf die wir Kerngebietsansprüche haben, kosten die Hälfte des strategischen Wertes; beanspruchte Staaten ein Drittel. Die Forderung nach Land, das der ursprüngliche Besitzer noch hält, verdoppelt die Kosten."
 CPD_annex_state_button_TT_DELAYED_CONCESSION: "§YStaaten abtreten§! bedeutet, sie dem Feind zu überlassen. Jedes abgetretene Gebiet senkt die Gesamtkosten des Abkommens und macht unsere übrigen Forderungen günstiger."
 CPD_make_puppet_button_TT: "[CPD_MAKE_PUPPET_TT_LOC]"
 CPD_make_puppet_button_TT_DELAYED: "[CPD_MAKE_PUPPET_TT_DELAYED_LOC]"
 CPD_make_puppet_button_TT_DEMAND: "Marionettenregierung erstellen"
 CPD_make_puppet_button_TT_CONCESSION: "Marionettenregierung zugeben"
 CPD_make_puppet_button_TT_DELAYED_DEMAND: "Die Forderung nach einer §YMarionettenregierung§! spaltet einen neuen Vasallenstaat aus ausgewählten feindlichen Gebieten ab. Der neue Vasall übernimmt die Kultur seines Mutterlandes, ist uns jedoch in der Außenpolitik unterstellt. Besitzen wir bereits einen Vasallen mit Kerngebietsansprüchen auf das Mutterland, schließen sich diese Staaten stattdessen diesem Vasallen an, anstatt einen neuen zu erzeugen."
 CPD_make_puppet_button_TT_DELAYED_CONCESSION: "Das Zugestehen einer §YMarionettenregierung§! erlaubt es dem Feind, einen Vasallenstaat aus Gebieten abzuspalten, die wir derzeit besitzen. Die neue Marionettenregierung ist ihm unterstellt."
 CPD_demilitarise_state_button_TT: "[CPD_DEMILITARISE_TT_LOC]"
 CPD_demilitarise_state_button_TT_DELAYED: "[CPD_DEMILITARISE_TT_DELAYED_LOC]"
 CPD_demilitarise_state_button_TT_DEMAND: "Die Demilitarisierung der Staaten fordern"
 CPD_demilitarise_state_button_TT_CONCESSION: "Die Demilitarisierung der Staaten vorschlagen"
 CPD_demilitarise_state_button_TT__DELAYED_DEMAND: "Die Forderung nach §YEntmilitarisierung§! verwandelt ausgewählte feindliche Staaten in Zonen, in denen kein Militär operieren darf. Ihr Besitzer darf dort weder Truppen stationieren noch Befestigungen errichten."
 CPD_demilitarise_state_button_TT__DELAYED_CONCESSION: "Das Zugestehen der §YEntmilitarisierung§! unterstellt unsere eigenen Staaten denselben Beschränkungen. Wir werden nicht in der Lage sein, Truppen in die zugestandenen Gebiete zu verlegen oder dort zu stationieren."
