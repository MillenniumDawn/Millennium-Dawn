 SAU_events.313.b: "Artillery: Precision Fires"
 SAU_events.313.c: "Artillery: Shoot-and-Scoot"
 SAU_events.313.desc: "The gunners refine their craft - but in which direction? Each path is a lasting trade-off - it makes us stronger one way and weaker another.\n\n§YHover an option to see exactly what it grants and costs.§!"
 SAU_events.313.t: "Live-Fire Artillery Exercise"
