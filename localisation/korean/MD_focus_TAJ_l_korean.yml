 TAJ_tajik_drugs_desc: "[TAJ.GetFlag] 타지키스탄 정부는 불장난을 하기로 결심했습니다. 그들은 고의로 마약이 우리나라로 유입되도록 방치하고 있습니다. 공식적으로는 이러한 행위를 인정하지 않지만, 우리는 그들이 우리 정부에 대한 경제적, 정치적 영향력을 얻기 위해 이러한 짓을 하고 있음을 알고 있습니다.\n§W------------------§!\n[TAJ.GetFlag] 타지키스탄은 우리에게 투자나 지원을 요청할 것이며, 우리가 거절하면 유입되는 마약의 양을 §R늘릴§! 수도 있습니다. 그들이 §HCSTO§!에 속해 있는 동안에는 공식적으로 위협할 수 없으나, 위협을 가한다면 그들은 다른 강대국에 도움을 구하여 우리의 영향권에서 이탈할 수도 있습니다."
