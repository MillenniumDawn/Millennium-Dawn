l_english:
 STALKER.110.t: "The Zone Spreads"
 STALKER.110.d: "The anomalies around [event_target:STALKER_zone_event_target.GetName] have crossed into [event_target:STALKER_footprint_event_target.GetName]. Wells have gone bad, compasses spin, and the first emission warnings are sounding in towns that never expected them."
 STALKER.110.a: "Evacuate the affected towns."
 STALKER.110.a_tt: "Costs §Y0.4%§! of GDP. [event_target:STALKER_footprint_event_target.GetName] is §YEvacuated§! for §Y180 days§!."
 STALKER.110.b: "People stay in their homes."
 STALKER.111.t: "The Zone Recedes"
 STALKER.111.d: "Containment work around [event_target:STALKER_zone_event_target.GetName] is paying off. Anomalous readings in [event_target:STALKER_footprint_event_target.GetName] have fallen back to normal, and the exclusion line there has been lifted."
 STALKER.111.a: "One less region to guard."
 STALKER_zone_evacuated: "Zone Evacuation"
 STALKER_zone_evacuated_desc: "Residents have been moved out of towns the anomalous Zone has reached."
