 FYR.Nat_Populism: "£FYR_nationalist_right_wing_populist 马其顿内部革命组织"
 FYR.Nat_Populism_desc: ""
 GAH.conservatism: "£GAH_western_conservatism (NPP) 新爱国党"
 GAH.conservatism_desc: "（自由保守主义） - 新爱国党成立于1992年，是加纳政坛的一支主导力量，是与左倾的全国民主大会党针锋相对的右翼政党。该党的前身政治力量曾积极参与第四共和国的创建，自新宪法颁布以来，新爱国党参加了每一次选举。"
 GAH.liberalism: "£GAH_western_liberalism (PPP)进步人民党"
 GAH.liberalism_desc: "（进步主义） - 进步人民党是一个大致属于中间偏左的政党，它通过将自身定位为与主流的全国民主大会党和新爱国党不同的选择，成功跻身全国第三大党之列。进步人民党奉行以进步为核心的纲领，倡导改善医疗保健、促进平等、普及教育、创造更多就业机会，并采取强硬的反腐败立场。"
 GAH.socialism: "£GAH_western_socialism (NDC) 全国民主大会党"
 GAH.socialism_desc: "（社会民主主义） - 全国民主大会党由当时的军事独裁者杰里·罗林斯于1981年创立，并在90年代初加纳向民主过渡期间成功维持了政权。尽管有着专制历史，该党在加纳仍然保持着强大的影响力，是与右翼政党新爱国党抗衡的主要左翼政党。该党以罗林斯的个人立场和纲领为核心，名义上奉行温和的社会民主主义理念。"
 GAH.anarchist_communism: "£GAH_anarchism_communism (DPP)民主人民党"
 GAH.anarchist_communism_desc: "（非洲社会主义） - 民主人民党是1992年军政府统治结束后成立的几个政党之一，其目标是把自己塑造成一个倡导推进非洲社会主义的现代化进步政党。与人民大会党类似，民主人民党的意识形态和纲领深受克瓦米·恩克鲁玛的影响。"
 GAH.Neutral_conservatism: "£GAH_neutral_conservatism (NDP) 民族民主党"
 GAH.Neutral_conservatism_desc: "（调和民粹主义） - 民族民主党是由全国民主大会党因领导层分歧而分裂出来的政党，声称遵循杰里·罗林斯的意识形态和纲领，继承了民粹主义遗产。"
 GAH.Neutral_Libertarian: "£GAH_neutral_liberalism 国家改革党"
 GAH.Neutral_Libertarian_desc: "（调和民粹主义） - 国家改革党成立于1999年，由奥古斯都·奥布阿杜姆·塔诺从全国民主大会党分裂而来。他创立该党的原因是与全国民主大会党在腐败指控和组织问题上存在分歧。尽管该党在选举中鲜有建树，但塔诺本人仍然活跃于政坛，甚至担任过多个职务。"
 GAH.neutral_Social: "£GAH_neutral_socialism (EGLE)加纳全民党"
 GAH.neutral_Social_desc: "（民主社会主义） - 成立于1992年民主恢复之后的加纳全民党是几个名义上的左翼政党之一，声称继承了前社会主义总统克瓦米·恩克鲁玛的政治遗产。该党在很大程度上与全国民主大会党结盟，在1992年支持杰里·罗林斯，并公开表示其政纲与全国民主大会党的政纲一致。"
 GAH.Neutral_Communism: "£GAH_neutral_communism (PNC) 人民全国大会党"
 GAH.Neutral_Communism_desc: "（非洲社会主义） - 由前总统希拉·利曼创立的人民全国大会党实际上是人民民族党的继承者。该党的纲领、立场和意识形态都基于之前的人民民族党 - 人民民族党本身就是一个左翼泛非主义政党，继承了夸梅·恩克鲁玛的遗产。"
 GAH.Nat_Autocracy: "£GAH_nationalist_junta (GAF) 加纳武装力量"
 GAH.Nat_Autocracy_desc: "（民粹主义军政府） - 加纳武装力量成立于1957年，在加纳政坛各个政治派别都极为活跃。1966年，军方推翻了克瓦米·恩克鲁玛政权，并执政至1969年。1972年，军方再次掌权，并在多届政府中持续统治，直至1979年再次发生政变，最终于1992年恢复民主。尽管历史动荡，加纳武装部队也积极参与非洲的维和行动，尤其是在西非地区。"
 GAH.Monarchist: "£GAH_monarchism 阿散蒂王治下"
 GAH.Monarchist_desc: "（传统主义选举君主制） - 阿散蒂王是阿散蒂人统治者的头衔，也是阿散蒂帝国统治者的旧称。尽管阿散蒂帝国已经解体，加纳也成为了共和国，但阿散蒂人仍然保留着这一统治者职位，将其视为一个具有礼仪性和文化意义的职位。"
 GAM.Nat_Populism: "£GAM_nationalist_populism 爱国主义调整与建设同盟"
 GAM.Nat_Populism_desc: ""
 GEO.conservatism: "£GEO_western_conservative 自由民主党(格鲁吉亚)"
 GEO.conservatism_icon: "£GEO_western_conservative"
 GEO.conservatism_desc: "自由民主党是格鲁吉亚的一个自由派和亲西方政党。该党由格鲁吉亚前驻联合国特使伊拉克利·阿拉萨尼亚于2009年7月16日创立。塔玛尔·科克纳泽是该党现任主席。该党成立的目的是反对米哈伊尔·萨卡什维利及其统一民族运动党领导的政府。2012年至2014年，该党是格鲁吉亚梦想联盟的一部分，该联盟推翻了统一民族运动党政府。2016年，该党独立于联盟竞选，勉强达到进入议会所需的5%门槛。自那以后，该党一直处于议会外的反对派地位。"
 GEO.liberalism: "£GEO_western_liberal 格鲁吉亚梦想 - 民主格鲁吉亚"
 GEO.liberalism_icon: "£GEO_western_liberal"
 GEO.liberalism_desc: "格鲁吉亚梦想 - 民主格鲁吉亚是格鲁吉亚的一个民粹主义政党。它目前是格鲁吉亚的执政党。伊拉克利·加里巴什维利担任党主席，前任主席伊拉克利·科巴希泽自2024 年2月起担任总理。比兹纳·伊万尼什维利被广泛认为是该党事实上的领导人，他担任该党的名誉主席。该党由亿万富翁商人和寡头比兹纳·伊万尼什维利于2012年4月19日创立。该党在同年赢得了大选，成为也被称为格鲁吉亚梦想的折衷联盟的一部分，该联盟包括亲西方自由派和反北约民族主义政党。随后，格鲁吉亚梦想党独立赢得了2016年和2020年的大选。"
 GEO.socialism: "£GEO_western_social_democrat 格鲁吉亚工党"
 GEO.socialism_icon: "£GEO_western_social_democrat"
 GEO.socialism_desc: "格鲁吉亚工党是格鲁吉亚的一个政党，由沙尔瓦·纳捷拉什维利于1995年创立。工党最大的成功是在1998年和2002年的地方政府选举中取得的。在1999年的议会选举中，他获得了7%的选票，未能突破7%的门槛，但他以2个多数派进入议会（诺达尔·格里加拉什维利在博尔若米获胜，塔马兹·梅基奥里在蒂亚涅蒂获胜）。根据1999年的数据，该党有9万名成员，其中1.5万名是活跃成员。在2002年的地方自治选举中，工党在第比利斯市议会中赢得了16名代表。工党在市议会中组建了“工党”派系。该派系由乔治·古加瓦担任主席。2003年玫瑰革命后，工党成功保住了第比利斯市议会16名代表中的6名。"
 GEO.Western_Autocracy: "£GEO_western_autocrat 统一民族运动"
 GEO.Western_Autocracy_icon: "£GEO_western_autocrat"
 GEO.Western_Autocracy_desc: "统一民族运动党是格鲁吉亚一个亲西方的自由保守派政党，由米哈伊尔·萨卡什维利创立，在玫瑰革命后上台执政。该党由米哈伊尔·萨卡什维利于2001年创立，他脱离了当时执政的总统爱德华·谢瓦尔德纳泽的公民联盟，在2003年议会选举和随后的玫瑰革命中挑战现任者后上台执政。统一民族运动党奉行亲西方路线，实行新自由主义经济政策和文化自由主义。它的统治经常被描述为独裁统治。在格鲁吉亚监狱丑闻证实萨卡什维利统治下格鲁吉亚监狱普遍存在系统性酷刑之后，该党在2012年议会选举中输给了格鲁吉亚梦想党。自那以后，它一直是主要反对党。"
 GEO.Conservative: "£GEO_emerging_reactionary 民主运动 - 统一的格鲁吉亚"
 GEO.Conservative_icon: "£GEO_emerging_reactionary"
 GEO.Conservative_desc: "民主运动 - 统一的格鲁吉亚是格鲁吉亚的一个政党，由妮诺·布尔贾纳泽担任主席；该党成立于2008年11月24日。该党的秘书长是瓦赫坦·科尔巴亚。直到2012年，该党一直反对米哈伊尔·萨卡什维利及其统一民族运动领导的政府。该党主张与俄罗斯和欧盟建立更紧密的联系，同时维持和扩大政府的许多经济和社会改革举措。它还声称寻求比萨卡什维利政府声称提供的更大的政治自由。它强烈反对萨卡什维利政府的独裁主义。该党是2011年格鲁吉亚抗议活动的主要组织者之一。2011年5月21日，上万名民众举行抗议活动，反对米哈伊尔·萨卡什维利政府，党魁妮诺·布尔贾纳泽、其丈夫巴德里·比萨泽等反对派领导人是主要人物。"
 GEO.Autocracy: "£GEO_Autocracy 格鲁吉亚公民联盟"
 GEO.Autocracy_desc: "格鲁吉亚公民联盟是1993年至2003年格鲁吉亚的执政党。该党由总统爱德华·谢瓦尔德纳泽和前苏联驻捷克斯洛伐克总贸易代表戴维·尚特拉泽共同创立，谢瓦尔德纳泽曾于1972年至1985年担任格鲁吉亚苏维埃社会主义共和国共产党领导人。谢瓦尔德纳泽率领该党在1995年和1999年的议会选举中获胜，但在2003年议会选举被普遍认为存在舞弊行为后，谢瓦尔德纳泽在玫瑰革命后下台，该党很快解散。在格鲁吉亚公民联盟执政期间，该国遭受了严重的腐败和政治不稳定。政府通常被描述为“半独裁”，容忍多元化和政治竞争，只要它不对该党的权力进行实质性挑战。格鲁吉亚公民联盟被描述为具有不同的保守派和自由派，后者主张改革。在外交政策方面，联合格鲁吉亚政府支持格鲁吉亚加入欧盟和北约。"
 GEO.Autocracy_icon: "£GEO_Autocracy"
 GEO.anarchist_communism: "£GEO_anarchist_communism 格鲁吉亚剧团"
 GEO.anarchist_communism_icon: "£GEO_anarchist_communism"
 GEO.anarchist_communism_desc: "格鲁吉亚剧团是格鲁吉亚左翼反对派政党，民族主义成分强烈，成立于2007年1月，由前格鲁吉亚工党主要活动家琼迪·巴加图里亚担任主席。巴加图里亚在2006 年12月与工党领导人沙尔瓦·纳泰拉什维利发生分歧后退出工党。该党承诺将外国人购买的公司和财产收归国有。自2007年11月以来，该党一直是联合反对派联盟的一部分。"
 GEO.Neutral_conservatism: "£GEO_non_aligned_conservative 工业拯救格鲁吉亚"
 GEO.Neutral_conservatism_icon: "£GEO_non_aligned_conservative"
 GEO.Neutral_conservatism_desc: "工业拯救格鲁吉亚是格鲁吉亚的一个中右翼保守党派。该党由大型啤酒和饮料公司卡兹贝吉的老板戈吉·托帕泽于1999年创立，并聚集了亲商界和工业界的游说者。其主要目标是改变国家的经济政策，特别是通过对抗国际货币基金组织的影响。该党参加了1999年的议会选举，赢得了15个席位，成为第三大党派。尽管它不是政府的一部分，但它与当时执政的总统爱德华·谢瓦尔德纳泽的格鲁吉亚公民联盟合作，并不构成坚定的反对派。在2004年的立法选举中，该党与新权利党一起加入了右翼反对派联盟。该联盟赢得了23个席位，成为议会中的第二大力量，仅次于新总统米哈伊尔·萨卡什维利主导的统一民族运动。2012年议会选举中，该党作为获胜的格鲁吉亚梦想联盟的一部分参选。该党在 2016 年议会选举前退出了格鲁吉亚梦想联盟。尽管如此，格鲁吉亚梦想联盟仍继续与该党合作。在2016年选举中，工业拯救格鲁吉亚党赢得了其唯一的多数党西蒙·诺扎泽选区，没有与格鲁吉亚梦想党的竞争候选人竞争。"
 GEO.neutral_Social: "£GEO_non_aligned_socialist_democrat 格鲁吉亚发展社会民主党"
 GEO.neutral_Social_icon: "£GEO_non_aligned_socialist_democrat"
 GEO.neutral_Social_desc: "格鲁吉亚社会民主党发展党是格鲁吉亚的一个政党。该党成立于2010年2月，并于2013年2月加入社会主义国际，成为其顾问成员。该党在格鲁吉亚议会中拥有6名议员，并且曾是格鲁吉亚梦想联盟的成员，直到2019年，该党因在养老金和司法改革问题上的分歧而退出联盟。"
 GEO.Neutral_Libertarian: "£GEO_non_aligned_libertarian 新政治中心 - 吉尔基"
 GEO.Neutral_Libertarian_icon: "£GEO_non_aligned_libertarian"
 GEO.Neutral_Libertarian_desc: "新政治中心 - 吉尔基是格鲁吉亚的一个自由主义政党。该党由四名反对统一民族运动的成员于2016年春季创立并注册。其中包括2016年至2018年担任该党主席的祖拉布·贾帕里泽，以及2020年离职前的实际领导人，他后来成立了一个名为吉尔基（更多自由）的新政党。伊阿古·赫维奇亚自2018年起担任该党主席。吉尔基是自由市场和小政府的支持者。此外，该党反对大多数形式的税收和监管。尽管通常被归类为右翼政党，但它支持毒品自由化、性工作合法化和废除征兵制等政策，这使得格鲁吉亚共产党成为格鲁吉亚最自由的政党之一。然而，它支持其他更为传统保守的社会问题，如枪支权利和不受限制的言论自由，并称“觉醒主义”为“现代类型的共产主义”。"
 GEO.Neutral_Communism: "£GEO_non_aligned_communism 格鲁吉亚统一共产党 - §Y不结盟主义派§!"
 GEO.Neutral_Communism_icon: "£GEO_non_aligned_communism"
 GEO.Neutral_Communism_desc: ""
 GEO.Neutral_green: "£GEO_non_aligned_greens 格鲁吉亚绿党"
 GEO.Neutral_green_icon: "£GEO_non_aligned_greens"
 GEO.Neutral_green_desc: "格鲁吉亚绿党是格鲁吉亚的一个政党。该党由乔治·加切齐拉泽领导。该党的成功程度各不相同 - 1992年在235名议会议员中占11名，1995年成为执政联盟的一部分。1999年独立参选时，仅获 0.55%的选票。在2003年被取消的选举中，该党作为爱德华·谢瓦尔德纳泽联盟的一部分参选。2012年，该党加入了格鲁吉亚梦想联盟，在2012年选举和2016年选举中选出一名议员，但在2020年议会选举之前退出了联盟。该党是欧洲绿党和全球绿党的成员。"
 GEO.Monarchist: "£GEO_nationalist_monarchist 巴格拉季昂王朝"
 GEO.Monarchist_icon: "£GEO_nationalist_monarchist"
 GEO.Monarchist_desc: "巴格拉季昂王朝是中世纪至19世纪初统治格鲁吉亚的一个王朝，是世界上现存最古老的基督教统治王朝之一。在现代用法中，该王朝的名称有时被希腊化，被称为格鲁吉亚巴格拉季昂王朝，在英语中也被称为巴格拉季昂。穆赫拉尼的大卫·巴格拉季昂是该家族的现任首领。"
 GEO.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 第比利斯伊玛目"
 GEO.Vilayat_e_Faqih_desc: ""
 GEO.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small 温和的第比利斯伊玛目"
 GEO.Mod_Vilayat_e_Faqih_desc: ""
 GEO.Caliphate: "£GEO_caliphate 维拉亚特格里祖尼斯坦"
 GEO.Caliphate_icon: "£GEO_caliphate"
 GEO.Caliphate_desc: ""
 GEO.Kingdom: "£GEO_kingdom 巴提拉什维利集团"
 GEO.Kingdom_icon: "£GEO_kingdom"
 GEO.Kingdom_desc: ""
 GNA.Neutral_Autocracy: "£generic_Neutral_Autocracy_small 总统议会"
 GRA.conservatism: "£generic_conservatism_small 新国家党"
 GRA.conservatism_desc: ""
 GRA.liberalism: "£generic_liberalism_small 民主党全国代表大会(NDC)"
 GRA.liberalism_desc: ""
 GRE.conservatism: "£GRE_western_conservative (ND) - 新民主党"
 GRE.conservatism_icon: "£GRE_western_conservative"
 GRE.conservatism_desc: "（自由保守主义） - 新民主党\n\n新民主党由康斯坦丁诺斯·卡拉曼利斯于1974年10月创立，旨在巩固复辟后的希腊共和国。该党是希腊中右翼的主要政党，也是欧洲人民党的成员。它融合了自由保守主义、基督教民主主义和民族保守主义，先后由科斯塔斯·卡拉曼利斯（2004年）、安东尼斯·萨马拉斯（2012年）和基里亚科斯·米佐塔基斯（2019年）执政。2004年，新民主党以45.36%的得票率和165个席位结束了泛希腊社会主义运动长达十年的统治；在债务危机爆发初期，其得票率一度跌至33.47%，但随后通过吸收危机后右翼的大部分力量而重振旗鼓。"
 GRE.liberalism: "£GRE_western_liberal (EK) - 中间派联盟"
 GRE.liberalism_icon: "£GRE_western_liberal"
 GRE.liberalism_desc: "（社会自由主义） - 中间派联盟\n\n瓦西里斯·莱文蒂斯于1992年3月创立了中间派联盟，声称其源自乔治·帕潘德里欧的中间派联盟，并以韦尼泽洛斯式的中间路线、社会自由主义和亲欧外交政策为竞选纲领。在2015年9月该党意外突破3%的得票门槛，获得186,644张选票和9个议席之前，莱文蒂斯曾以边缘人物的身份活跃了二十余年。然而，该党在2019年的选举中全部落败，至今未能重返议会。"
 GRE.socialism: "£GRE_western_social_democrat (PASOK) - 泛希腊社会主义运动党"
 GRE.socialism_icon: "£GRE_western_social_democrat"
 GRE.socialism_desc: "（社会民主主义） - 泛希腊社会主义运动\n\n安德烈亚斯·帕潘德里欧于1974年9月创立了泛希腊社会主义运动，该党迅速成为希腊中左翼的主导力量，并在1981年至2011年期间，由帕潘德里欧、科斯塔斯·西米蒂斯和乔治·帕潘德里欧领导执政。2009年，该党支持率高达43.92%，但随后遭遇了欧洲执政社会民主党中最严重的党内崩盘，支持率在2012年跌至约12%，2015年更是跌至约6%，这主要是由于签署了救助备忘录。2022年，在尼科斯·安德鲁拉基斯的领导下，该党更名为“变革运动”，并在2023年6月回升至11.85%的支持率和32个议席，重新成为官方反对党，与社会党和民主党一起在欧洲议会中占有一席之地。"
 GRE.anarchist_communism: "£GRE_left_wing_radical (SYRIZA) - 激进左翼联盟"
 GRE.anarchist_communism_icon: "£GRE_left_wing_radical"
 GRE.anarchist_communism_desc: "（左翼民粹主义） - 激进左翼联盟\n\n激进左翼联盟于2004年1月以希腊民族团结党为核心的选举联盟成立，并于2013年在阿莱克西斯·齐普拉斯的领导下成为单一制政党。该党以反对紧缩政策为竞选纲领，在2015年1月的大选中赢得36.34%的选票和149个席位，并与独立希腊人党联合执政。2015年7月全民公投后，齐普拉斯接受了第三份备忘录，25名议员脱离该党，成立了人民团结党，此后该党逐渐向中左翼靠拢。到2023年6月，其支持率跌至约17.8%，同年晚些时候，又有一部分议员加入新左翼党，目前在欧洲议会中与左翼党同席。"
 GRE.Neutral_conservatism: "£GRE_non_aligned_conservative (ANEL) - 独立希腊人士"
 GRE.Neutral_conservatism_icon: "£GRE_non_aligned_conservative"
 GRE.Neutral_conservatism_desc: "（右翼民粹主义） -独立希腊人\n\n帕诺斯·卡梅诺斯于2012年2月创立了独立希腊人党，此前他因投票反对救助计划而被新民主党开除。该党以反对备忘录为旗帜，聚集了民族保守派、社会保守派和温和的疑欧派人士。2012年5月，该党首次亮相，获得10.6%的支持率和33个席位。2015年1月，该党与激进左翼联盟组成了看似不可能的左右翼联合政府，卡梅诺斯担任国防部长。2019年1月，他因希腊与北马其顿签署的普雷斯帕协议而退出该党；该党没有参加当年7月的选举，并在选举后不久解散。"
 GRE.Nat_Fascism: "£GRE_nationalist_fascism (XA) - 金色黎明"
 GRE.Nat_Fascism_icon: "£GRE_nationalist_fascism"
 GRE.Nat_Fascism_desc: "（新纳粹主义） -金色黎明\n\n尼古拉斯·米哈洛利亚科斯于1980年创办了一份杂志，并将金色黎明党发展成为1993年注册的政党。该党奉行新纳粹主义、生物种族主义、对梅塔克西斯主义的怀旧以及否认大屠杀的论调。金色黎明党于2012年5月以6.97%的得票率进入议会，在2015年的两次选举中均位列第三大党，并在2014年赢得三个欧洲议会席位。2013年9月，一名成员谋杀了说唱歌手帕夫洛斯·菲萨斯后，该党领导层被捕。2020年10月，雅典一家法院以组织犯罪组织的罪名判处米哈洛利亚科斯和其他六名领导人共计37项罪名成立。"
 GRE.Nat_Autocracy: "£GRE_nationalist_military_junta (HAF) - 希腊武装力量"
 GRE.Nat_Autocracy_icon: "£GRE_nationalist_military_junta"
 GRE.Nat_Autocracy_desc: "（军政府） - 希腊武装部队\n\n希腊武装部队并非政党，而是共和国的宪政军队，此处指的是作为政治行动者的军官团，而非作为一个机构的存在。希腊对此深有体会：1967年4月夺取政权的军官们统治了七年，直到1974年7月塞浦路斯危机后才被推翻。复辟后的共和国随即在宪法中写入了广泛的文官控制条款。与土耳其持续不断的爱琴海紧张局势，以及希腊在北约成员国中最高的国防负担之一，使得军方在国家政治中拥有举足轻重的地位。"
 GRE.Monarchist: "£GRE_nationalist_monarchist 格吕克斯堡王室"
 GRE.Monarchist_icon: "£GRE_nationalist_monarchist"
 GRE.Monarchist_desc: "（君主主义） - 格吕克斯堡王室\n\n石勒苏益格-荷尔斯泰因-索恩德堡-格吕克斯堡王室的希腊分支自1863年起统治希腊，直至1974年12月全民公投，69.2%的选民投票支持建立共和国。随后的宪法废除了贵族头衔，希腊政府不承认任何亲王等级。2000年，康斯坦丁二世在欧洲法院就希腊被没收的王室财产胜诉。2013年，他返回雅典居住，并于2023年1月去世，王储帕夫洛斯继位成为王室首领。希腊的君主制组织规模微乎其微：唯一注册的政党“国家希望”在2012年和2015年的选举中被禁止参选，在参选的两次选举中仅获得0.07%的选票，并于2019年解散。"
 GUA.conservatism: "£generic_conservatism_small 民族进步党"
 GUA.conservatism_desc: "保守主义 - 民族进步党是危地马拉的右翼保守党。该党成立于1989年，并在1995年的总统选举中获胜。它也是同年国会选举中最强的政党。在那之后，它开始落后于更强大的政党，此后几乎每次选举都失去选票。"
 GUA.liberalism: "£generic_liberalism_small 爱国党"
 GUA.liberalism_desc: "自由派 - 爱国党是一个保守的自由党，成立于2001年。它在2007年和2011年的选举中取得了巨大的成功，但此后失去了很多支持，直到它最终在2017年解散。2011年，他们是国会中最强的政党，在158个席位中占据56个席位。"
 GUA.socialism: "£generic_socialism_small 民族团结希望"
 GUA.socialism_desc: "社会民主派 - 民族团结希望是危地马拉的一个社会民主党。它还将自己定义为社会基督教和民粹主义。2002年成立后，在2003年大选中大获全胜，成为2019年和2007年议会第一大党，并在总统选举中获胜。该党在 2019 年的总统选举中赢得第一轮，但在第二轮输给瓦莫斯的候选人。"
 GUA.anarchist_communism: "£generic_anarchist_communism_small 新国家联盟"
 GUA.anarchist_communism_desc: "左翼激进派 - 新国家联盟是一个左翼政党。它于1999年进入危地马拉国会，成为第三大最受欢迎的政党。之后，它不断失去选票，最终在2007年根据危地马拉选举法因缺票而被迫解散。"
 GUA.anarchist_communism_2007: "£generic_anarchist_communism_small 温纳克政治运动"
 GUA.anarchist_communism_2007_desc: "左翼激进派 - 温纳克政治运动成立于2007年，是危地马拉的一个民主社会主义政党。它起源于危地马拉的土著社区和国内各族裔平等运动。‘温纳克’这个名字是 K'iche'ean 的意思，意思是‘人’，K'iche'是美洲原住民，是玛雅人的后裔。他们最初与危地马拉民族革命统一结成联盟，但在2019年的选举中离开了联盟，在那里他们在选票和席位上超过了联盟。"
 GUA.Conservative: "£generic_Conservative_small 统一党"
 GUA.Conservative_desc: "反动派 - 统一党是一个保守的政党。它是右翼民族主义者和经济自由主义者。它的主要目标是重建中美洲联盟。它最初取得了超过 6% 的微弱成功，但在2007年之后受欢迎程度下降。它在2015年与承诺、更新和秩序成了选举联盟。"
 GUA.Neutral_conservatism: "£generic_Neutral_conservatism_small 复兴民主自由党"
 GUA.Neutral_conservatism_desc: "中立保守派 - 复兴民主自由党是危地马拉的一个短命的中右翼政党。2010年从联合统一党中分裂出来，在2011年的选举中初见成效，接近9%。在接下来的选举中，他们的支持率几乎翻了一番，达到近 19%。由于不断违反《选举法和政党法》，它们在2016年被禁止。据报道，它还与贩毒集团有密切联系。"
 GUA.Neutral_conservatism_2017: "£generic_Neutral_conservatism_small Vamos"
 GUA.Neutral_conservatism_2017_desc: "中立保守派 - Vamos是危地马拉的一个保守政党。它成立于2017年，并在2019年迅速崛起成为第二大党，并在同年的第二轮总统选举中获胜。它在社会上是保守的，在经济上是自由的。它的正式全称是‘Vamos por una Guatemala Diferente’，字面意思是‘我们要成为一个不一样的危地马拉’。"
 GUA.Neutral_Libertarian: "£generic_Neutral_Libertarian_small 国家变革联盟"
 GUA.Neutral_Libertarian_desc: "民族主义派 - 国家变革联盟是危地马拉的一个民族主义政党。它成立于2006年，表现不错，2007年大选获得超过4%的选票，2011年接近10%，此后略有下降，但仍保持在5%以上。"
 GUA.Neutral_green: "£generic_Neutral_green_small 全民党"
 GUA.Neutral_green_desc: "中间主义 - 全民党是危地马拉的一个中间派政党。它是民族主义者，提倡基督教民主和人道主义，以及社会市场经济。它是在一群来自民族团结希望的国会议员离开该党并组建了一个因其着装而被称为“紫色领带”的政府派系之后成立的。2012年年中，他们加入了绿党，绿党改了名字和标志，变成了‘全民党’。该党在2015年成为第三大党，但在下次选举中席位跌至不到之前的一半。"
 GUA.neutral_Social: "£generic_neutral_Social_small 一起为危地马拉"
 GUA.neutral_Social_desc: "社会民主派 - 一起为危地马拉是危地马拉的一个社会民主党。它强烈主张将土著人民的权利作为其主要理念。他们的徽标代表危地马拉的四个土著群体，玛雅人、加里富纳斯人、辛卡斯人和拉迪诺人都聚集在一起。从2007年到2015年，他们取得了大约 6% 的成功，但在2019年惨败，导致他们在2020年解散。"
 GUA.Neutral_Communism: "£generic_Neutral_Communism_small 人民解放运动"
 GUA.Neutral_Communism_desc: "共产主义派 - 人民解放运动是危地马拉的一个土著政党。它是根据温纳克政治运动和危地马拉民族革命统一不代表土著人民的说法创建的。它成立于2016年底，但仅在两年后才合法化。在2019年的选举中，他们获得了超过 10% 的总统选票，但只有 3% 左右的国会选票。"
 GUA.Nat_Populism: "£generic_Nat_Populism_small 民族解放运动"
 GUA.Nat_Populism_desc: "右翼民粹主 - 民族解放运动是危地马拉的一个极右翼政党。它成立于1954年，前身是全国民主运动。1963年的政变导致民族解放运动成为军方的主要政治纲领。它也被归类为右翼民粹主义者、土地主义者、保守主义者和经济自由主义者。由于在当年的选举中失去了国会的所有席位，它于1999年解散。"
 GUA.Nat_Populism_2008: "£generic_Nat_Populism_small 全国融合阵线"
 GUA.Nat_Populism_2008_desc: "右翼民粹主义 - 全国融合阵线是危地马拉的一个右翼民粹主义政党。它由退役军官于2008年创立，是民族主义者、民族和社会保守派、反共和社会主义者以及民族主义者的组合体。它在2011年的第一次选举中没有成功，仅获得0.5%，但支持率飙升，获得9%。2019年，他们再次失去了绝大多数席位。"
 GUA.Nat_Fascism: "£generic_Nat_Fascism_small 危地马拉共和阵线"
 GUA.Nat_Fascism_desc: "极右 - 危地马拉共和阵线是一个极右翼政党。它是由保守的、共和的、反共的，也是右翼民粹主义者组成。它于1989年由危地马拉前总统兼独裁者埃弗拉因·里奥斯·蒙特创建。它在90年代取得了巨大的成功，在1999年以42%的得票率成为迄今为止最大的政党。然而，在接下来的两次选举中，它的选票两次减半，直到2011年降至不到3%。2015年，他们未能赢得任何席位，并于当年晚些时候解散。2013年，它更名为危地马拉共和阵线。"
 GUA.Nat_Fascism_2013: "£generic_Nat_Fascism_small 制度共和党"
 GUA.Nat_Fascism_2013_desc: "极右 - 制度共和党是一个极右翼政党。它是由保守的、共和的、反共的，也是右翼民粹主义者组成。它于1989年由危地马拉前总统兼独裁者埃弗拉因·里奥斯·蒙特创建。它在90年代取得了巨大的成功，在1999年以42%的得票率成为迄今为止最大的政党。然而，在接下来的两次选举中，它的选票两次减半，直到2011年降至不到 3%。2015年，他们未能赢得任何席位，并于当年晚些时候解散。 在2013年之前，它被称为危地马拉共和阵线。"
 GUA.Nat_Autocracy: "£generic_Nat_Autocracy_small 危地马拉武装力量"
 GUA.Nat_Autocracy_desc: ""
 GUA.oligarchism: "£generic_oligarchism_small 洛斯惠斯塔斯(LH)"
 GUA.oligarchism_desc: ""
 GUB.socialism: "£generic_socialism_small 社会复兴党"
 GUB.socialism_desc: "社会民主派 - 社会复兴党是几内亚比绍的一个社会民主党。"
 GUB.neutral_Social: "£generic_neutral_Social_small 民主交替运动"
 GUB.neutral_Social_desc: "社会民主派 - 民主交替运动是几内亚比绍的一个社会民主党。"
 GUB.anarchist_communism: "£GUB_emerging_left_wing_radical 几内亚和佛得角非洲独立党（温和派）"
 GUB.anarchist_communism_icon: "£GUB_emerging_left_wing_radical"
 GUB.anarchist_communism_desc: "左翼激进派 - 几内亚和佛得角非洲独立党最初是为了从葡萄牙和平争取独立而成立的，该党在1960年代转向武装冲突，是其中之一 几内亚比绍独立战争中的交战国。战争快结束时，该党在1990年代初引入民主之前建立了马克思列宁主义的一党制国家。"
 GUB.Nat_Autocracy: "£generic_Nat_Autocracy_small 人民革命武装力量"
 GUB.Nat_Autocracy_desc: "军政府 - 人民革命武装力量"
 GUI.Western_Autocracy: "£generic_Western_Autocracy_small 进步与复兴联盟"
 GUI.liberalism: "£generic_liberalism_small 几内亚民主力量联盟"
 GUI.Neutral_Autocracy: "£generic_Neutral_Autocracy_small 团结进步党"
 GUI.neutral_Social: "£generic_neutral_Social_small 几内亚人民集会"
 GUY.conservatism: "£GUY_western_conservative 团结力量"
 GUY.conservatism_desc: "保守主义 - 联合力量是一个社会保守的圭亚那政党。它在经济上是自由的，遵循反俄情绪，在意识形态上是中右翼。它成立于1960年，一直持续到2015年大选。然而，1968年之后，他们的得票率再也没有突破5%，仍然是最大的小党派之一。"
 GUY.liberalism: "£GUY_western_liberal 变革联盟"
 GUY.liberalism_desc: "自由主义 - 变革联盟是一个社会自由主义政党。它于2005年由三名离开前政党的国会议员组成。它是进步的和多种族的，并持有中间到中间偏左的位置。他们成立后，一直是议会的第三大党。自2015年以来，它们与争取民族团结伙伴关系在一个列表中运行。"
 GUY.socialism: "£GUY_western_social_democrat 人民全国大会党"
 GUY.socialism_desc: "社会民主 - 人民全国大会党（改革派）是圭亚那的一个社会民主党。它也被归类为民主社会主义政党，过去曾是左翼民族主义和民粹主义政党。该党政治立场偏左翼。它成立于1957年，此后一直是圭亚那两大政党之一，另一个是人民进步党/公民联盟。该党主要由圭亚那非裔民众支持。2011年，该党与其他几个政党组成了名为“国家团结伙伴关系”的选举联盟。"
 GUY.socialism_2011: "£GUY_western_social_democrat_alt 争取民族团结伙伴关系"
 GUY.socialism_2011_desc: "社会民主派 - 争取民族团结伙伴关系成立于2011年，用于同年十个不同政党的选举，人民全国大会党是最重要和最受欢迎的。它主要由左翼政党组成。2011年，他们与变革联盟党联结成联盟。他们获得了多数席位，但人民进步党/公民毕竟是最大的政党，这意味着他们赢得了总统职位。在下一次选举中，争取民族团结伙伴关系和变革联盟党在同一个名单上同时竞选，这意味着它们可以作为一个实体竞选总统。"
 GUY.anarchist_communism: "£GUY_anarchist_communism 人民进步党/公民"
 GUY.anarchist_communism_desc: "共产主义 - 人民进步党/公民是圭亚那两大政党之一。它成立于1950年，由英属圭亚那工党和政治事务委员会合并而成。自成立以来，它一直是圭亚那最大或第二大政党。它是多民族的，但其选民基础主要由印度裔圭亚那人组成。它是中左翼到左翼，遵循社会民主主义、民主社会主义和左翼民粹主义的意识形态。过去，它被归类为左翼民族主义和马克思列宁主义。"
 GUY.Neutral_conservatism: "£GUY_non_aligned_conservative 崛起组织和重建圭亚那"
 GUY.Neutral_conservatism_desc: "中立保守派 - 崛起组织和重建圭亚那是加纳的一个保守党。这是第一个认为自己以种族为基础的政党，是一个印度裔-圭亚那政党 它成立于1999年，在2001年的选举中表现不佳。之后，它与圭亚那行动党结成联盟并取得了稍好一些的成功，之后其许多成员在2011年的选举之前离开了变革联盟党。"
 GUY.neutral_Social: "£GUY_neutral_Social 劳动人民联盟"
 GUY.neutral_Social_desc: "民主社会主义派 - 劳动人民联盟是一个左翼的圭亚那政党。它成立于1974年，是三个左翼政党的联盟，并于1979年正式宣布自己的政党。它总体上取得了小的成功，在2001年的选举中取得了最好的成绩，当时它与圭亚那行动党一起竞选。"
 GUY.Neutral_Communism: "£GUY_Neutral_Communism 圭亚那行动党"
 GUY.Neutral_Communism_desc: "共产主义派 - 圭亚那行动党是圭亚那的左翼政党。它代表该国的土著美洲印第安人人口。它成立于1989年，但在2001年与劳动人民联盟 结盟后首次运行。2006年与崛起组织和重建圭亚那结盟，2011年加入争取民族团结伙伴关系。"
 GUY.Nat_Populism: "£GUY_Nat_Populism 联合共和党"
 GUY.Nat_Populism_desc: "右翼民粹主义派 - 联合共和党于1985年在美国成立，1987年在圭亚那成立。1992年，它未能赢得一个席位。它只是从2015年开始再次参加选举，无论如何都收效甚微。它希望提高圭亚那的生活和教育水平，以及其他主题。"
 GUY.Nat_Autocracy: "£GUY_Nat_Autocracy 圭亚那国防军"
 GUY.Nat_Autocracy_desc: ""
 GUY.oligarchism: "£GUY_non_aligned_oligarchism 阿格里科拉巴克斯顿帮(ABG)"
 GUY.oligarchism_desc: ""
 HAI.conservatism: "£HAI_western_conservatives RDNP - 国家民主进步大会"
 HAI.conservatism_desc: "基督教民主 - 国家民主进步大会是海地现存最古老的政党之一，成立于1979年，在杜瓦利埃第二任倒台后不久于1987年获准参加选举政权。"
 HAI.liberalism: "£HAI_western_liberalism PHTK - 海地光头党"
 HAI.liberalism_desc: "自由主义 - 海地光头党是一个自由党，于2012年8月从农民代表党中分离出来。尽管米歇尔·马尔泰利从未是海地光头党的成员，但他们与农民代表党保持着密切的联系。"
 HAI.socialism: "£HAI_western_socialism FL - 拉瓦拉斯之家"
 HAI.socialism_desc: "社会民主民粹主义 - 拉瓦拉斯之家是一个以拉瓦拉斯政治运动命名的政党，该运动因1990年让·贝尔特兰·阿里斯蒂德 的总统竞选而流行，并于1996年正式从斗争人民组织分裂。\n\n该党以坚持‘增长与公平’政策而闻名，寻求西欧社会民主原则，同时拒绝国际货币基金组织实施紧缩措施的愿望。"
 HAI.anarchist_communism: "£HAI_anarchist_communists PPD - 德萨林之子平台"
 HAI.anarchist_communism_desc: "德萨林主义 - 德萨林之子平台是一个民主社会主义政党，成立于2014年12月，深受广泛的德萨林主义经济原则的影响。\n\n该党以海地革命后第一位统治者让-雅克·德萨林的名字命名，在永久禁止奴隶制后，德萨林将所有经济作物的生产和加工置于海地新政府的控制之下，采取高度保护主义政策来保护海地的经济利益。他一般并不反对外国投资，只是反对来自法国的投资。"
 HAI.Neutral_conservatism: "£HAI_neutral_conservatives MCNH - 基督教新海地运动"
 HAI.Neutral_conservatism_desc: "基督教民主主义 - 新海地基督教运动是一个中右翼基督教民主党，于1991年由海地福音派新教教会联合成立。\n\n直到1999年，选举当局才承认该党为正式选举候选人。"
 HAI.neutral_Social: "£HAI_neutral_socialist OPL - 斗争人民组织"
 HAI.neutral_Social_desc: "社会民主主义 - 斗争人民组织是一个政党，成立于1991年拉瓦拉斯运动期间。\n\n虽然该党属于社会民主主义阵营，但他们支持私有化和经济紧缩措施，以此作为振兴海地陷入困境的经济的一种方式，导致斗争人民组织和拉瓦拉斯之家在1996年在意识形态上分裂。"
 HAI.Nat_Autocracy: "£HAI_nationalist_junta FAd'H - 海地武装力量"
 HAI.Nat_Autocracy_desc: "军事统治 - 海地武装力量是海地军队的官方名称，由于军事高级指挥部内部政变和政变企图的盛行，该部队于1995年暂停并随后解散。"
 HEZ.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 真主党"
 HEZ.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 真主党由什叶派神职人员于1982年为应对以色列入侵和占领黎巴嫩而成立。该组织迅速聚集支持，并组建民兵组织袭击以色列阵地。在意识形态上，真主党深受伊朗影响，采纳了鲁霍拉·霍梅尼的理念和模式。真主党活跃于黎巴嫩政坛，并在多个国家设有分支机构 - 尽管许多国家因其在黎巴嫩境内外的活动而将其视为恐怖组织。"
 HKG.conservatism: "£HKG_conservatism 民主党"
 HKG.conservatism_desc: "中间派 - 民主党在1995年香港首次选举产生的立法会中是最大政党。它是最温和的泛民主派政党之一，寻求与北京妥协的方式使其失去了一些前支持者。"
 HKG.liberalism: "£generic_liberalism_small 民权党"
 HKG.liberalism_desc: "自由主义 - 民权党与民主阵营的其他成员一样，要求普选和保护个人自由。 该党与众不同的是它对环境保护和少数群体权利的关注。"
 HKG.liberalism_2006: "£HKG_liberalism_2006 公民党"
 HKG.liberalism_2006_desc: "自由主义 - 公民党是由一群大律师组成的主流亲民主政党，专注于普选，公民自由以及法治问题。"
 HKG.socialism: "£generic_socialism_small 前线"
 HKG.socialism_desc: "社会民主主义 - 刘慧卿的心血结晶“前线”，是一个比其他泛民主主义者更为激进的民主政党，呼吁建立新宪法取代《基本法》。"
 HKG.socialism_2006: "£generic_socialism_small 社会民主连线(LSD)"
 HKG.socialism_2006_desc: "社会民主主义 - 社会民主连线是一个‘进步民主主义者’政党，与其他泛民主主义政党不同，它与街头行动议程密切相关。"
 HKG.socialism_2016: "£generic_socialism_small 人民力量 - 社会民主党联盟(PP-LSD)"
 HKG.socialism_2016_desc: "社会民主主义 - 人民力量 - 社会民主党联盟是两个‘进步民主主义者’政党的组合，与其他泛民主主义政党不同，他们将自己与街头行动议程紧密联系在一起。"
 HKG.Conservative: "£HKG_Conservative 民主建港协进联盟(DAB)"
 HKG.Conservative_desc: "保守主义 - 民建联一直是立法会中主要的亲北京政党，始终支持与大陆的融合。该党还采取了保守的社会立场，反对同性婚姻，并与福音派基督教组织保持密切联系。"
 HKG.Autocracy: "£HKG_Autocracy 新民党(NPP)"
 HKG.Autocracy_desc: "保守主义 - 新民党被广泛认为是著名的亲北京政客叶刘淑仪的选举工具。她倡导国家安全立法，并声称外国势力利用社交媒体来干预抗议活动，这使她成为一个争议性人物。"
 HKG.anarchist_communism: "£HKG_anarchist_communism 香港工会联合会(HKFTU)"
 HKG.anarchist_communism_desc: "左翼激进主义 - 香港工会联合会与中国共产党有很长时间的联系。在1967年左派针对英国殖民当局的暴动中，工会发挥了重要作用。今天，工会保持了亲北京的工人阶级地位，这使它有别于反北京的泛民主派和其他拥有更多中产阶级的亲北京政党。"
 HKG.Neutral_conservatism: "£generic_Neutral_conservatism_small 民主思路"
 HKG.Neutral_conservatism_desc: "中间派 - 民主思路是一个小型的中间派政党，其描绘自己的观点高于亲北京阵营和泛民主主义者之间的二元区别。它推动采取在双方之间妥协的方法，但在这一努力中获得的支持相对较少。"
 HKG.Neutral_Libertarian: "£generic_Neutral_Libertarian_small 新思維"
 HKG.Neutral_Libertarian_desc: "自由主义 - 新思维是一个小型的中间派政党，其描绘自己的观点高于亲北京阵营和泛民主主义者之间的二元区分。它推动采取在双方之间妥协的方法，但在这一努力中获得的支持相对较少。"
 HKG.oligarchism: "£generic_oligarchism_small 自由党"
 HKG.oligarchism_desc: "寡头政治 - 自由党是一个亲商且社会保守的政党。尽管属于亲北京阵营，该党并非总与其所谓的盟友步调一致，曾多次公开反对政府。"
 HKG.Neutral_green: "£generic_Neutral_green_small 香港绿党"
 HKG.Neutral_green_desc: "环保主义 - 香港绿党是一个有左翼理想的小型环保党。它是亚太绿色联盟的成员。"
 HKG.Nat_Populism: "£generic_Nat_Populism_small 本土派"
 HKG.Nat_Populism_desc: "右翼民粹主义 - 本土派是一个政治团体，由广泛的不同政党组成，他们渴望在香港实现自决。青年新政，香港众志和香港民族党等团体在2014年香港抗议活动中脱颖而出，代表着一个崭新的，更激进的，更民粹的香港政治品牌，尽管这一品牌备受争议。一些本土派主张保留香港的独特文化，另一些则主张限制大陆的旅游业和移民，一些更极端的本土派主张独立或甚至想暂时恢复英国统治以作为过渡措施。无论如何，相当大比例的年轻香港人对此表示支持，而年龄较大的人群则对此表示厌恶和反对。"
 HOL.conservatism: "£HOL_western_conservative (CDA) - 基督教民主呼吁党"
 HOL.conservatism_icon: "£HOL_western_conservative"
 HOL.conservatism_desc: "(基督教民主主义) - 基督教民主呼吁党。基督教民主呼吁党是一个根植于荷兰基督教民主传统的中间偏右政党。该党强调社会责任、平衡的市场经济、强大的农村代表性以及社区机构的维护。基督教民主呼吁党支持坚定的亲欧盟和亲北约外交政策，认为欧洲合作和跨大西洋关系对荷兰的安全和繁荣至关重要。尽管选举形势起伏不定，基督教民主呼吁党在农业、家庭政策和伦理道德等议题的辩论中仍然具有重要影响力，并将自身定位为自由派和保守派阵营之间务实的桥梁。"
 HOL.liberalism: "£HOL_western_liberal (VVD) - 自由民主人民党"
 HOL.liberalism_icon: "£HOL_western_liberal"
 HOL.liberalism_desc: "(自由主义) - 自由民主人民党。自由民主人民党是一个奉行市场自由主义、亲商的政党，优先考虑经济增长、低税收和个人责任。该党坚定支持欧盟合作，并牢牢扎根于北约，倡导放松管制、鼓励创业和财政紧缩，同时在社会议题上保持温和立场。长期以来，自由民主人民党一直是荷兰政坛的主导力量，并将自身定位为维护稳定和经济竞争力的务实力量。"
 HOL.socialism: "£HOL_western_social_democrat (PvdA) - 工党"
 HOL.socialism_icon: "£HOL_western_social_democrat"
 HOL.socialism_desc: "(社会民主主义) - 工党。工党是一个中间偏左的社会民主党，致力于通过累进税制和公共投资来加强福利国家建设、保护工人权益并减少不平等。该党支持与欧盟保持密切合作，积极参与北约事务，并支持以公共服务和集体谈判为核心支柱的混合经济体制。工党曾是荷兰的主要执政党之一，如今依然在社会正义、劳动条件和公共服务未来等议题上发挥着重要作用。"
 HOL.Neutral_conservatism: "£HOL_non_aligned_conservative (SGP) - 改革政治党"
 HOL.Neutral_conservatism_icon: "£HOL_non_aligned_conservative"
 HOL.Neutral_conservatism_desc: "(宗教保守主义) - 改革政治党。改革政治党是荷兰历史最悠久的政党，代表着根植于正统改革教会的严格加尔文主义传统。该党倡导社会保守主义政策，将家庭生活、公共道德和圣经原则作为治理的指导基础。该党对欧洲一体化持怀疑态度，主张谨慎的国防政策，并强调以基督教责任为指导的有限政府。尽管规模较小，但改革政治党以其严明的组织、政策的连续性和在议会谈判中的可靠性而闻名。"
 HOL.neutral_Social: "£HOL_non_aligned_socialist_democrat (D66) - 民主66"
 HOL.neutral_Social_icon: "£HOL_non_aligned_socialist_democrat"
 HOL.neutral_Social_desc: "(社会自由主义) - 民主66。民主66是一个进步的亲欧政党，它将市场经济与强有力的公民自由以及国家在教育和创新领域发挥的积极作用相结合。该党倡导全民公投和体制改革，支持更紧密的欧盟一体化，并在安乐死、毒品政策和LGBTQ权益等问题上持自由主义立场。在联合执政中，民主66经常扮演中间偏左和中间偏右阵营之间的桥梁角色，同时推动荷兰国家和社会的现代化。"
 HOL.Neutral_Libertarian: "£HOL_non_aligned_libertarian (LP) - 自由意志党"
 HOL.Neutral_Libertarian_icon: "£HOL_non_aligned_libertarian"
 HOL.Neutral_Libertarian_desc: "(自由意志主义) - 自由意志党。自由意志党主张国家干预最小化、大幅减税，并大力保障个人在经济和社会生活中的自由。该党呼吁公共服务私有化、放松市场管制，并奉行不干涉主义外交政策。尽管自由意志党在选举中规模较小，但其意识形态立场始终如一，并在数字权利、政府透明度和个人自主权等议题上拥有影响力。"
 HOL.Neutral_Communism: "£HOL_non_aligned_communism (SP) - 社会党"
 HOL.Neutral_Communism_icon: "£HOL_non_aligned_communism"
 HOL.Neutral_Communism_desc: "(社会主义) - 社会党。社会党起源于20世纪70年代的毛主义运动，后来发展成为一个以经济平等、强大的公共服务和抵制市场自由化为核心的左翼民粹主义政党。该党主张在关键领域扩大国有化程度，加强对跨国公司的监管，并提高社会福利保障。尽管对欧盟一体化的某些方面持批评态度，但社会党支持以社会正义而非市场纪律为基础的国际合作。其支持者包括工人阶级选民、医护人员以及对现有政治体制持怀疑态度的民众。"
 HOL.Neutral_green: "£HOL_non_aligned_greens (GL) - 绿色左翼"
 HOL.Neutral_green_icon: "£HOL_non_aligned_greens"
 HOL.Neutral_green_desc: "(环保进步主义) - 绿色左翼。绿色左翼是一个进步的绿色政党，致力于气候行动、社会平等和国际人权。该党倡导快速脱碳、扩大公共交通、财富再分配以及强有力的环境法规。绿色左翼坚定支持欧盟，并支持在气候和移民政策方面深化欧洲合作。其支持者包括城市进步人士、年轻选民以及致力于可持续发展和社会正义的活动家，这使得绿色左翼成为荷兰生态和社会改革的领军力量。"
 HOL.Nat_Autocracy: "£HOL_nationalist_military_junta (AFN) - 荷兰武装力量"
 HOL.Nat_Autocracy_icon: "£HOL_nationalist_military_junta"
 HOL.Nat_Autocracy_desc: "(军事专制主义) - 荷兰武装力量。在这种体制下，荷兰武装力量直接控制国家，高级军官负责国家安全、行政管理和战略规划。文职政治机构名存实亡，在军方监督下运作，而政府的合法性则建立在稳定、纪律和国家安全之上。军政府与北约伙伴保持着密切的行动联系，但奉行严格的内部安全政策，将秩序和忠诚置于多元化和议会权威之上。"
 HOL.Nat_Fascism: "£HOL_nationalist_fascism (NVU) - 荷兰人民联盟"
 HOL.Nat_Fascism_icon: "£HOL_nationalist_fascism"
 HOL.Nat_Fascism_desc: "(极端民族主义) - 荷兰人民联盟。荷兰人民联盟是一个极右翼极端民族主义运动，以其在身份认同、移民和国家主权等问题上的强硬立场而闻名。该党兴起于20世纪后期，一直处于政治边缘，但以其对抗性言论和与主流社会频繁冲突而著称。它主张高度集权的国家、严格的文化同质化以及退出超国家机构。尽管其选举影响力有限，但荷兰民族联盟仍然通过活跃分子网络和边缘示威活动持续存在，代表着荷兰最极端的意识形态潮流之一。"
 HOL.Nat_Populism: "£HOL_nationalist_right_wing_populist (LPF) - 皮姆·富图恩名单"
 HOL.Nat_Populism_icon: "£HOL_nationalist_right_wing_populist"
 HOL.Nat_Populism_desc: "(右翼民粹主义) - 皮姆·富图恩名单。由皮姆·福图恩于2002年创立的皮姆·富图恩名单以严格的移民管控、文化保护和强烈的民族自信心呼吁为核心纲领，挑战了荷兰的政治体制。福图恩极具个人魅力且直言不讳的风格赢得了广泛的公众支持，他批评官僚机构的停滞不前、多元文化政策以及精英阶层的脱离群众。"
 HOL.Monarchist: "£HOL_nationalist_monarchist (N-HoON) - 奥兰治-拿骚王室"
 HOL.Monarchist_icon: "£HOL_nationalist_monarchist"
 HOL.Monarchist_desc: "(民族君主主义) - 奥兰治-拿骚王室。奥兰治-拿骚王室体现了一种民族君主主义愿景，在这种愿景中，王权是民族认同、政治统一和国家延续的核心。王室被视为荷兰主权、文化遗产和社会凝聚力的守护者，凌驾于党派政治之上，同时对政府方向施加决定性影响。在这种模式下，对君主制的忠诚成为维系公民团结的支柱，强调民族自豪感、传统制度以及建立在数百年王朝传承基础上的和谐有序的社会。"
