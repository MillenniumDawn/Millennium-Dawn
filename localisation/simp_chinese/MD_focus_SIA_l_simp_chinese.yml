 SIA_cost_6_0_blocked: "£treasury 6.0§R(不足)§!"
 SIA_cost_7_0_blocked: "£treasury 7.0§R(不足)§!"
 SIA_family_holdings: "家族产业"
 SIA_family_holdings_desc: "钦那瓦家族控制着电信、卫星服务、卫星电视及十余家相关企业的巨额股份。利用与政府的关系谋取私利是该家族的传统，也是该党赖以生存的收入来源。"
 SIA_royal_projects: "皇家发展项目"
 SIA_royal_projects_desc: "派遣皇家发展团队前往农村省份，设立示范农场、流动医疗诊所、流域管理和职业培训。国王的个人威望伴随每一个项目，村长们铭记这份恩情的由来。"
 SIA_isoc_surveillance_sweep: "国安司令部监视清查"
 SIA_isoc_surveillance_sweep_desc: "派遣治安战情报小组对深南地区的移动网络、村庄线人网络及边境通道进行彻底清查。无需搜查令，不留任何记录，从而获得军方从未有过的南部地区全貌。"
 SIA_isoc_grid_disruption: "国安司令部断线行动"
 SIA_isoc_grid_disruption_desc: "锁定那些维持叛乱行动节奏的资金管道、指挥节点和信使网络。每切断一个节点，就相当于拆除了一枚不会引爆的炸弹。"
 SIA_ds_cordon_and_search: "搜索与清剿"
 SIA_ds_cordon_and_search_desc: "封锁村庄，逐户搜查武器和战斗人员。这能迅速打乱叛乱分子的节奏，但每踹开一扇门、每拘留一名亲属，都会加深这场运动所依赖的怨恨。"
 SIA_ds_fund_religious_schools: "资助伊斯兰寄宿学校"
 SIA_ds_fund_religious_schools_desc: "国家为马来穆斯林宗教学校和文化机构提供资助，这些是南部所珍视的，且以南部自身的方式来进行。这对本周的暴力事件作用甚微，但直击了助长这种暴力的疏离感。"
 SIA_asean_rotating_summit: "主持东盟峰会"
 SIA_asean_rotating_summit_desc: "利用泰国担任主席国的机会，举办一场高规格峰会，将曼谷打造为东南亚的外交之都。由此产生的善意转化为国内的政治资本和国际上的声望。"
 SIA_asean_mediate_myanmar: "调解缅甸危机"
 SIA_asean_mediate_myanmar_desc: "将泰国定位为缅甸军政府与国际社会之间的诚实中间人。静默的成功将在内比都建立持久的影响力。而公开的失败，对地区其他国家而言，仍是一个有用的信号。"
 SIA_asean_free_trade_push: "推动东盟自贸"
 SIA_asean_free_trade_push_desc: "利用主席国身份推动贸易便利化措施，如海关协调、减少非关税壁垒和建设数字贸易走廊。基础工作耗时较长，但出口收入将如期到账。东盟邻国将注意到曼谷建设性的领导作用。"
 SIA_retry_section_112: "再次提交修正案"
 SIA_retry_section_112_desc: "第一次对第112条提出修正案的尝试在立法机构中失败了。公众的反对声浪很大，但年轻选民的动员反击也同样强烈。如果时机得当，第二次准备更充分、条款更精准的尝试仍有可能通过。"
 SIA_ds_autonomy_framework: "南方自治框架"
 SIA_ds_autonomy_framework_desc: "为马来穆斯林各省推行一项适度的行政自治方案，设立地区咨询委员会，赋予马来语官方地位，并下放学校资金管理权。这远不是独立，但足以表明曼谷愿意倾听。用六个月来设计，用一代人来评判。"
 SIA_isr_persistent_sweep: "情报机构持续扫荡"
 SIA_isr_persistent_sweep_desc: "将“天空之眼”情报资产部署至泰南边境三府，实施常态化监视——边境口岸、移动交通、车辆动向悉数覆盖。叛乱分子将丧失隐匿行动的能力，而士兵无需踏入任何一座村庄。"
 SIA_political_gambits_category: "政治博弈"
 SIA_political_gambits_category_desc: "在各项国策之间，政府仍有可用的杠杆：内阁改组、检察官定向行动、向内地输送资金，以及在必要时，与王室达成交易或诉诸法庭。\n\n§Y改革压力§!：[?ROOT.SIA_reform_pressure|0]/100。城市与青年不满情绪正向前进党偏移。超过60后，将溢出为抗议活动。\n§Y民粹浪潮§!：[?ROOT.SIA_pheu_thai_pressure|0]/100。农村地区正在倒向为泰党。只有民主政府才能与之对抗。"
 SIA_cabinet_reshuffle: "内阁改组"
 SIA_cabinet_reshuffle_desc: "轮换部长，收买批评者，把收视率最差的节目从电视排期里撤下来。巴育疲劳症或法庭政治，哪个目前拖累政府，就随他一同下台。党声称焕新，却不改变任何实质性的东西。"
 SIA_lese_majeste_lever: "利用大不敬罪"
 SIA_lese_majeste_lever_desc: "对最响亮的改革批评者选择性执行第112条。提出指控，拒绝保释，撤回声明。反对派失去一个声音，而每个目睹这一切的人，都离这个体制更远了一步。"
 SIA_coup_watch_category: "军方的注视"
 SIA_coup_watch_category_desc: "泰国历史上每一位民选的民粹主义总理，都是在军队的阴影下执政的。电信优惠政策、虚报合同和家族贪腐之类的速效手段，固然能在当下换取金钱和选票，但每一项都会推高§Y政变风险§!。该风险每周还会自动攀升——正常情况每周增加0.5点，若稳定度低于50%则每周增加1.0点；且若不采取行动，绝不会自行回落。以下决策可逐步买回风险下降空间，但每项都会让你付出某些代价。若政变风险超过85，§R“安抚军部”§!任务将启动。要么化解它，要么军队就会接管政府。\n\n§Y政变风险§!：[?ROOT.SIA_coup_risk|0]/100"
 SIA_shin_corp_tax_holiday: "定制税收漏洞"
 SIA_shin_corp_tax_holiday_desc: "悄悄改写让步条款，让家族电信帝国在下一笔意外之财上几乎分文不出。国库与党皆有收益。将军们心中自有盘算。"
 SIA_school_milk_contract: "授予学校牛奶合同"
 SIA_school_milk_contract_desc: "一项面向农村学童的全国免费牛奶计划，在乡村中极受欢迎，通过一个深知该感谢谁的供应商卡特尔来实施。村民们心怀感激，而官员们则不然。"
 SIA_otpc_tablet_procurement: "启动“每个孩子一台平板”"
 SIA_otpc_tablet_procurement_desc: "一个光鲜的计划，要让每个一年级学生人手一台平板电脑。媒体对此趋之若鹜，党派的民调数字也随之攀升。这笔钱是用现金支付的，学校预算要承担半年的重负，而采购过程则是一台人人皆知、体制内都心知肚明的回扣机器。"
 SIA_family_business_favors: "安排家族企业中标"
 SIA_family_business_favors_desc: "公共工程、进口许可证、一两处港口特许权，全都落到了总理亲戚们恰好拥有的公司手里。国库和家族都得了钱。军方把这笔账记在了你的案卷上。"
 SIA_court_the_generals: "笼络将领"
 SIA_court_the_generals_desc: "谨慎的预算条目、体面的职位安排，以及几处恰到好处的晋升。这一切都不便宜，但满意的军官团会更有耐心。降低政变风险。"
 SIA_military_budget_boost: "批准国防采购大单"
 SIA_military_budget_boost_desc: "潜艇、战斗机、一个新的司令部联队。批准陆军的愿望清单，让高层记住是谁在买单。民用经济会因此稍微吃紧，但政变风险会大幅下降。"
 SIA_anti_corruption_gesture: "苦肉计"
 SIA_anti_corruption_gesture_desc: "挑一个可以牺牲的盟友，把档案交给反腐委员会，然后让镜头开拍。党内支持者看到朋友为换取头条新闻和民调而遭出卖，支持率下滑。将领们则看到一个惩罚自己人的政府。"
 SIA_promote_loyalists: "提拔忠诚军官"
 SIA_promote_loyalists_desc: "重新调整年度晋升名单，将可靠之人调入关键指挥岗位——第一集团军、国王卫队、首都卫戍部队。此举虽耗费政治资本，但能在政府与军方的坦克之间安插更亲近的人手，从而降低政变风险。"
 SIA_reassure_high_command: "安抚军部"
 SIA_reassure_high_command_desc: "各纵队已整装待发，广播稿也已拟就。在计时结束前，通过预算调整、人事晋升或对亲信进行公开清算，将政变风险降至70以下。若失败，军方将接管政府。"
 SIA_canal_tolls: "征收运河通行费"
 SIA_canal_tolls_desc: "克拉运河承载着全球价值最高的海上交通流之一。来自集装箱船、油轮、散货船和邮轮等商业船只的通行费，每半年直接流入国库。"
 SIA_kra_construction: "克拉运河"
 SIA_kra_construction_desc: "克拉运河的整个建设周期。首先是克拉地峡宏伟运河的分期工程，每一阶段依次获得资金；若疏于投入，则将导致成本超支，且在争议地区可能遭受破坏。随后是竣工后的海峡海军管理：巡逻安排、通航规程，以及这一全球最新战略咽喉的安全保障。\n这项宏伟工程分三个阶段推进，每阶段均需资金投入。§Y工程进度§!：[?ROOT.SIA_kra_progress|0]%"
 SIA_kra_phase_1: "第一阶段，开挖地峡"
 SIA_kra_phase_1_desc: "第一次大规模开挖。将运河通道贯穿半岛山脊。在施工季节结束前为该阶段提供资金，否则项目办公室将以成本超支为由再次提出申请。"
 SIA_kra_phase_2: "第二阶段，船闸与航道工程"
 SIA_kra_phase_2_desc: "对齐切口，沉下船闸，建造起能够阻挡两片海洋的运河工程。确保财政支出跟上进度，否则又将面临一次超支。"
 SIA_kra_phase_3: "第三阶段，海上试航"
 SIA_kra_phase_3_desc: "淹没最高段河道，安装闸门，并让引航员以压载状态试航。这是运河通航前的最后阶段。投入资金，这项超级工程便告竣工。"
 SIA_strait_patrol: "海峡巡逻"
 SIA_strait_patrol_desc: "让皇家泰国海军舰艇在克拉地峡过境走廊进行常态化巡逻。此举既能震慑海盗，安抚航运，也让舰队获得了前所未有的海上训练时间。"
 SIA_red_path_category: "村委会行动"
 SIA_red_path_category_desc: "将党的组织触角延伸至农村社区、工作场所和居民区。每一个扎根的委员会都加强了运动的大众基础，并考验着政府的容忍度。"
 SIA_spread_flame_isaan: "组织依善村庄"
 SIA_spread_flame_isaan_desc: "向依善村庄和区镇派遣党的干部。建立村委员会、扫盲小组和合作网络。东北部是运动的天然基地，因此要深化它。"
 SIA_spread_flame_north: "组织北部社区"
 SIA_spread_flame_north_desc: "北方有着悠久的劳工组织和农业激进主义历史。党的组织者深入山坡合作社和木材工会开展工作。在这里建立根据地意味着这场运动的意义远不止于依善地区。"
 SIA_mass_education_campaign: "大规模政治教育运动"
 SIA_mass_education_campaign_desc: "涵盖劳工史、经济理论及东南亚帝国主义史的国家政治教育课程，通过亲党的工会、合作社和社区中心推行。这项投入会消耗当前的政治资本，但回报是真正具有政治意识的选民群体。"
 SIA_asean_arms_export: "东盟军火出口合同"
 SIA_asean_arms_export_desc: "泰国防务制造商拥有产能和区域关系，足以维持一项经常性的出口计划。每一年度的合同——无论是防雷车、炮弹引信、弹药批次还是巡飞弹——都直接为国库带来收益，并巩固泰国作为本地区首选二级供应商的地位。"
 SIA_defense_export_contract: "防务出口合同"
 SIA_defense_export_contract_desc: "随着国防出口办公室的成立和王国王室兵工厂获得销售认证，内阁可以批准新的出口合同。财生利“首胜”战车、DTI火箭和弹药以及授权生产的系统定期运往东盟买家。为促成协议所花费的政治资本将以实际出口收入的形式回流国库，国防工业部门由此实现自负盈亏。"
 SIA_counter_chinese_influence: "抵制中国影响力"
 SIA_counter_chinese_influence_desc: "调动外交、经济与信息资源，以削弱北京在曼谷周边地区的影响力。这项行动耗时数月且代价高昂，但若不做此选择，便是默许。"
 SIA_counter_indian_influence: "削弱印度影响力"
 SIA_counter_indian_influence_desc: "新德里在东南亚一直在悄然扩展软实力，从投资到文化项目再到战略伙伴关系。一场协调一致的反影响力行动正将区域伙伴引向曼谷。"
 SIA_renegotiate_china_contracts: "重新谈判中国合同"
 SIA_renegotiate_china_contracts_desc: "一带一路基础设施合同修建了泰国所需的公路与铁路，但融资条款将北京的影响力嵌入了整整一代人。内阁可以接受这种依赖，或者付出政治代价重新谈判条款。"
 SIA_us_security_review: "美泰安全审查"
 SIA_us_security_review_desc: "华盛顿已请求进行正式的双边安全审查。审查结果将决定泰国是深化其条约同盟关系，从而获得相关培训计划、采购渠道及政治曝光度，还是继续保持战略对冲姿态。"
 SIA_strategic_fuel_reserve: "建立战略燃料储备"
 SIA_strategic_fuel_reserve_desc: "在全国各地的分布式油库实施为期三个月的国家燃料储备。这项投资有助于平抑价格波动，提供军事后勤缓冲，并向区域伙伴展示供应链的韧性。"
 SIA_anti_corruption_drive: "反腐运动"
 SIA_anti_corruption_drive_desc: "针对采购腐败、海关欺诈以及省政府中根深蒂固的庇护网络，开展专项执法行动。干净的合同流程起初较慢，但从长远来看成本更低。"
 SIA_tax_modernization: "税务系统现代化"
 SIA_tax_modernization_desc: "将税务局的纸质评估系统替换为强制电子申报、算法审计和基于产出的评估员激励机制。实施过程十分痛苦。但长期的效率红利将在五年内收回资本成本。"
 SIA_gripen_ef_upgrade: "“鹰狮”E/F合同"
 SIA_gripen_ef_upgrade_desc: "2025年8月签署的12架鹰狮E/F战斗机合同是泰国皇家空军建设拥有五代机能力战斗机承诺的体现。首批交付预计于2029年完成。该合同巩固了泰国皇家空军与萨博公司的长期合作关系，并将与瑞典的维护支持服务延续至2040年代。"
 SIA_gripen_ef_upgrade_bonus: "“鹰狮”E/F整合"
 SIA_imf_program_active: "IMF备用安排仍在进行"
 SIA_ds_active: "泰南叛乱仍在进行"
 SIA_ds_resolved_force: "泰南三府被武力平定"
 SIA_not_ruled_by_communists_tt: "§Y[Communist-State_L]§!不是执政党。"
 SIA_not_ruled_by_democrats_tt: "§Y[conservatism_L]§!不是执政党。"
 SIA_not_ruled_by_royalists_tt: "§Y[Nat_Autocracy_L]§!和§Y[Monarchist_L]§!不是执政党。"
