 korea_russia.53.t: "잠수함 기술"
 korea_russia.53.d: "Russia Supplied Us with Better Technology so we can improve our submarines. This is all thanks to the North Korean leader's push to develop nuclear-powered submarines."
 korea_russia.53.a: "수령님께 축복을"
 korea.135.t: "해킹 작전 성공"
 korea.135.d: "우리 해커들이 서방 국가들의 은행 기반시설에 침투하여 상당한 자금을 빼돌렸습니다. 본국으로 자금을 옮기는 데 사용한 비공식 경로에서 일부가 사라졌지만, 작전은 성공이었습니다."
 korea.135.a: "훌륭한 솜씨다"
 korea.136.t: "우리를 해킹한 북한"
 korea.136.d: "북한 해커들이 자금을 빼돌리기 위해 우리 은행 기반시설에 사이버 공격을 감행했습니다. 우리는 자체 작전으로 보복하거나 국제사회에 호소해야 합니다."
 korea.136.a: "예상치 못한 일이군"
 korea.137.t: "거리에 넘쳐나는 마약"
 korea.137.d: "새로운 마약의 물결이 우리 거리에 넘쳐나고 있습니다. 출처는 아직 확인되지 않았지만, 이미 생산성이 저하되고 있으므로 신중하게 움직여야 합니다."
 korea.137.a: "중독자를 지원한다"
 korea.137.b: "우리가 무엇을 할 수 있겠는가"
 korea.138.t: "마약 작전 성공"
 korea.138.d: "새로운 마약의 물결이 적국의 거리에 넘쳐나고 있습니다. 그들은 위기를 억제하기 위해 비용을 써야 하는 반면, 우리는 적당한 이윤을 얻게 됩니다. 기관에 대한 지속적인 투자가 자금 흐름을 이어 줄 것입니다."
 korea.138.a: "잘했다!"
 korea.139.t: "위조 달러 작전"
 korea.139.d: "우리는 위조 100달러 지폐를 인쇄했으며, 이를 비공식 경로를 통해 해외 시장에 유통하고 그 수익을 우리의 암시장 네트워크를 통해 세탁할 것입니다. 이 계획에서 나오는 안정적인 수입이 추가 작전의 자금이 될 것입니다."
 korea.139.a: "잘했다!"
 NKO_korean_russian_friendship: "북러 포괄적 전략 동반자 조약"
