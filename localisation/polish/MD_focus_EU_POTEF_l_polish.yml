 tooltip_EU_POTEF_nominee_trigger: "[ROOT.GetNameWithFlag] to trzecia trójka wpływowych osób we wszystkich państwach członkowskich z tą samą partią rządzącą."
 tooltip_EU_POTEF_nominee_trigger_2: "Partia [ROOT.GetLeader] §YNOT ogłosiła kandydata§! w wyborach na Prezydenta Federacji Europejskiej (POTEF)."
 tooltip_EU_POTEF_campaign_in_member_state_effect: "Szansa na zwiększenie popularności grupy politycznej wspierającej [ROOT.GetLeader] o około 5% w [FROM.GetNameWithFlag]. Szansa zależy od §Ywpływu§! [ROOT.GetNameWithFlag] na [FROM.GetNameWithFlag], §YEurosceptycyzm§!, §partia rządząca§! i kandydat §YPOTEF§! z [FROM.GetNameWithFlag]."
