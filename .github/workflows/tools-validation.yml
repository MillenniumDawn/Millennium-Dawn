---
name: Tools Validation

"on":
  pull_request:
    paths:
      - "tools/**"
      - "common/on_actions/**"
      - "common/scripted_effects/**"
      - ".claude/docs/typo-watchlist.md"
      - "resources/documentation/modifiers_documentation.md"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "package.json"
      - "bun.lock"
      - ".jscpd.json"
      - ".github/workflows/coding-pipeline.yml"
      - ".github/workflows/nightly-pr-validation.yml"
      - ".github/workflows/pr-cache-cleanup.yml"
      - ".github/workflows/tools-validation.yml"
      - ".github/workflows/validator-cache.yml"
      - ".github/workflows/validator-impact.yml"
      - ".github/workflows/validator-impact-report.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ${{ matrix.check.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `name` is the status-check context branch protection matches on —
        # keep these strings stable when reshaping the job.
        check:
          - name: report_lib + validator unit tests
            id: unit
            runner: ubuntu-latest
          - name: tools unit tests (macOS)
            id: unit-macos
            runner: macos-latest
          - name: tools unit tests (Windows)
            id: unit-windows
            runner: windows-latest
          - name: tools quality checks
            id: quality
            runner: ubuntu-latest
    steps:
      # The unit-test checkout must include every config and fixture that the
      # tests read; config_drift_test enforces this list.
      - name: Checkout (unit tests)
        if: startsWith(matrix.check.id, 'unit')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            .pre-commit-config.yaml
            .claude/docs/typo-watchlist.md
            common
            resources
            .github/workflows/coding-pipeline.yml
            .github/workflows/nightly-pr-validation.yml
            .github/workflows/pr-cache-cleanup.yml
            .github/workflows/tools-validation.yml
            .github/workflows/validator-cache.yml
            .github/workflows/validator-impact.yml
            .github/workflows/validator-impact-report.yml
          sparse-checkout-cone-mode: false

      - name: Checkout (quality checks)
        if: matrix.check.id == 'quality'
        id: quality-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            package.json
            bun.lock
            .jscpd.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        if: startsWith(matrix.check.id, 'unit') || matrix.check.id == 'quality'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      - name: Install dependencies (unit tests)
        if: startsWith(matrix.check.id, 'unit')
        run: |
          python -m pip install --upgrade pip
          # analysis pulls scipy/numpy/matplotlib used by the optional
          # tools/balance and tools/analysis scripts and their tests.
          pip install --group dev --group runtime --group analysis

      - name: Install dependencies (quality checks)
        if: matrix.check.id == 'quality'
        id: quality-deps
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Verify pytest collection configuration
        if: startsWith(matrix.check.id, 'unit')
        run: >-
          python -m pytest tools/tests/collection_layout_test.py
          -o addopts= -q

      - name: Run unit tests
        if: matrix.check.id == 'unit'
        run: |
          python -m coverage run --branch -m pytest tools/tests \
            -o addopts= -o 'python_files=*_test.py' -v
          python -m coverage report

      - name: Run cross-platform unit tests
        if: matrix.check.id == 'unit-macos' || matrix.check.id == 'unit-windows'
        run: >-
          python -m pytest tools/tests -o addopts=
          -o "python_files=*_test.py" -v

      - name: Run ruff
        if: >-
          always() && !cancelled() && matrix.check.id == 'quality' &&
          steps.quality-deps.outcome == 'success'
        run: ruff check tools --output-format=github

      - name: Check formatting (black)
        if: >-
          always() && !cancelled() && matrix.check.id == 'quality' &&
          steps.quality-deps.outcome == 'success'
        run: black --check tools

      - name: Run pylint
        if: >-
          always() && !cancelled() && matrix.check.id == 'quality' &&
          steps.quality-deps.outcome == 'success'
        run: pylint tools --output-format=github --reports=no --score=no

      - name: Run mypy
        if: >-
          always() && !cancelled() && matrix.check.id == 'quality' &&
          steps.quality-deps.outcome == 'success'
        run: mypy

      - name: Setup Bun
        if: >-
          always() && !cancelled() && matrix.check.id == 'quality' &&
          steps.quality-checkout.outcome == 'success'
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install duplication dependencies
        if: >-
          always() && !cancelled() && matrix.check.id == 'quality' &&
          steps.bun.outcome == 'success'
        id: bun-deps
        run: bun install --frozen-lockfile

      - name: Run jscpd
        if: >-
          always() && !cancelled() && matrix.check.id == 'quality' &&
          steps.bun-deps.outcome == 'success'
        run: bun run jscpd
