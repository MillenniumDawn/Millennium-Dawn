l_korean:
 muslim_brotherhood_sponsor: "무슬림 형제단 네트워크"
 muslim_brotherhood_suppressor: "형제단 대응"
 MB_build_network_hub: "국제 조직 구축"
 MB_build_network_hub_desc: "무슬림 형제단은 국경을 넘나드는 운동으로, 그 계열 단체들이 단일한 중심 없이 지역 전역에 흩어져 있습니다. [Root.GetNameDef]이(가) 그 중심이 되어 네트워크를 조율하고, 해외의 형제들을 지원할 수단을 확보하도록 합시다."
 MB_fund_affiliates: "형제단 계열 단체 지원"
 MB_fund_affiliates_desc: "[FROM.GetNameDef]의 형제단은 의지는 있으나 가난합니다. 자금과 조직가, 그리고 꾸준한 지원이 있다면 그들을 제거하고 싶어 하는 정부에 맞설 힘이 강화될 것입니다."
 MB_diplomatic_solidarity: "형제단 연대 촉구"
 MB_diplomatic_solidarity_desc: "형제단과 뜻을 같이하는 정부들은 흩어져 있을 때보다 함께할 때 더 강합니다. 이들을 한 자리에 모아 공동의 대의를 재확인하고, 우리 사이의 온정이 블록 전체에 느껴지게 합시다."
 MB_bankroll_crackdown: "해외 탄압 자금 지원"
 MB_bankroll_crackdown_desc: "[FROM.GetNameDef]은(는) 자국 내에서 형제단이 성장하는 것을 지켜보면서도 대응할 수단이 없습니다. 운동이 국가를 위협할 만큼 힘을 얻기 전에 선제공격을 할 수 있도록 자금과 정보를 제공합시다."
 MB_designate_terrorist_organization: "형제단을 테러 조직으로 지정"
 MB_designate_terrorist_organization_desc: "무슬림 형제단을 우리가 규정하는 그대로, 즉 테러 조직으로 낙인찍습니다. 이 지정은 국내에서는 비용이 거의 들지 않으며, [Root.GetNameDef]을(를) 같은 선을 그은 모든 정부와 나란히 서게 합니다."
 MB_counter_sponsor_influence: "형제단 자금줄 폭로"
 MB_counter_sponsor_influence_desc: "누군가가 [FROM.GetNameDef]의 형제단에 자금을 대고 있으며, 그 돈은 흔적을 남깁니다. 이를 폭로하고 차단하면, 후원자들이 백일하에 끌려 나오면서 운동이 동력을 잃는 모습을 보게 될 것입니다."
 MB_rescind_terrorist_designation: "테러 조직 지정 철회"
 MB_rescind_terrorist_designation_desc: "테러 조직 지정을 조용히 만료되게 둡니다. 형제단에 대한 강경한 태도는 제 역할을 다했으며, 낡은 원한을 장부에 남겨 두어서 얻을 것은 거의 없습니다."
 MB_sponsored_network: "우리의 형제단 운동 후원"
 MB_funding_subversion: "해외 형제단 전복 활동 자금 지원"
 MB_solidarity: "무슬림 형제단 연대"
 MB_crackdown_patron: "우리의 탄압에 자금 지원"
 MB_funding_repression: "형제단 탄압 자금 지원"
 MB_counter_bloc: "형제단에 대한 공동 입장"
 MB_branded_terrorist: "형제단을 테러 단체로 낙인"
 brotherhood.6.c: "그들의 온건파를 정부에 끌어들입니다."
 brotherhood.11.t: "탄압 자금 지원 제안"
 brotherhood.11.d: "[FROM.GetNameDef]이(가) 무슬림 형제단이 더 강해지기 전에 억제하도록 우리에게 은밀히 자금과 정보를 제안해 왔습니다. 그들의 특사가 답변을 기다리고 있습니다."
 brotherhood.11.a: "자금을 받고 그들에 맞서 움직입니다."
 brotherhood.11.b: "제안을 거절합니다."
 BROTHER_civil_war_has_started: "§Y무슬림 형제단§! 내전이 발발했습니다"