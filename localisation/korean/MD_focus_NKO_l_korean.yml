 NKO_naval_focus_destroyer_unleashed_tt: "§H선군 해군 교리   구축함 출격§!\n• 해군 증강 포인트: §G+5§!\n• §Y미사일 고속정 선단§! 진행도: §G+20§! (다음 단계까지)\n• §Y해안 방어 네트워크§! 진행도: §G+10§!\n• §H미사일 고속정 군집 기세§! 국가 정신을 §Y180§!일간 추가\n   §L해군 속도 +5%, 해군 타격 공격력 +10%, 해군 경험치 획득 +10%§!\n• 구축함 사무국이 MIO 특성 §Y지상전 지원§!과 §Y대공 포대§!를 잠금 해제합니다\n• 각 계열이 §Y25§!/§Y50§!/§Y75§!/§Y100§!에 도달한 뒤 다음 §H투자§! 클릭 시 단계가 상승합니다\n• 일회성 특별 사건 §H출격하는 구축함 전대§!가 발생합니다"
 NKO_naval_focus_missile_boat_track_tt: "§H선군 해군 교리§!가 잠금 해제된 경우: 해군 증강 포인트 §G+3§! 및 미사일 고속정 선단 진행도 §G+10§!, 단계를 넘어설 때마다 해당 특별 사건이 발생합니다."
 NKO_naval_focus_coastal_defense_track_tt: "§H선군 해군 교리§!가 잠금 해제된 경우: 해군 증강 포인트 §G+3§! 및 해안 방어 네트워크 진행도 §G+10§!, 단계를 넘어설 때마다 해당 특별 사건이 발생합니다."
 NKO_naval_focus_specops_track_tt: "§H선군 해군 교리§!가 잠금 해제된 경우: 해군 증강 포인트 §G+3§! 및 해군 특수 작전 진행도 §G+10§!, 단계를 넘어설 때마다 해당 특별 사건이 발생합니다."
 NKO_naval_capstone_news_tt: "§H주요 뉴스 사건§!을 방송합니다: §Y'평양의 해상 방벽이 완성되다'§!   국내에서는 축하하고, 해외에서는 주목합니다."
 NKO_naval_allocate_party_funds: "당 자금 배정"
 NKO_naval_allocate_party_funds_desc: "당 보조금을 은밀히 해군 계획으로 전용합니다. 정치적 자본을 소모하는 대가로 꾸준한 자원이 조금씩 들어옵니다."
 NKO_naval_mobilize_nampo_shipyards: "남포 조선소 동원"
 NKO_naval_mobilize_nampo_shipyards_desc: "남포의 민간 공장 하나를 3개월간의 초과 근무 제작에 투입합니다. 작업이 끝나면 조선소가 추가로 다량의 증강 포인트를 보답으로 제공합니다."
 NKO_naval_juche_drive: "주체 해군 총동원 개시"
 NKO_naval_juche_drive_desc: "함대를 위한 전국적 동원입니다. 조선소는 반년 동안 전력으로 가동되고 민간 경제가 그 비용을 부담하며, 계획은 한꺼번에 많은 포인트를 얻습니다. 이를 유지하려면 안정적인 후방이 필요합니다."
 NKO_naval_invest_submarine: "잠수함 전력 투자"
 NKO_naval_invest_submarine_desc: "해군 증강 포인트 1개를 소모하여 잠수함 계열을 추진합니다. 설계가 성숙해짐에 따라 승조원들이 새로운 해군 경험치를 얻습니다. 진행도 §Y25§!, §Y50§!, §Y75§!, §Y100§!에 도달하면 다음 잠수함 현대화 단계가 잠금 해제됩니다."
 NKO_naval_invest_missile_boat: "미사일 고속정 선단 투자"
 NKO_naval_invest_missile_boat_desc: "해군 증강 포인트 1개를 소모하여 미사일 고속정 계획을 확대합니다. 개장이 거듭될 때마다 우리의 연안 타격 능력이 날카로워집니다. 진행도 §Y25§!, §Y50§!, §Y75§!, §Y100§!에 도달하면 다음 미사일 고속정 단계가 잠금 해제됩니다."
 NKO_naval_invest_coastal_defense: "해안 방어 네트워크 투자"
 NKO_naval_invest_coastal_defense_desc: "해군 증강 포인트 1개를 소모하여 해안선을 강화합니다. 벙커 승조원과 해안 포대가 경험을 쌓습니다. 진행도 §Y25§!, §Y50§!, §Y75§!, §Y100§!에 도달하면 다음 해안 방어 단계가 잠금 해제됩니다."
 NKO_naval_invest_specops: "해군 특수 작전 투자"
 NKO_naval_invest_specops_desc: "해군 증강 포인트 1개를 소모하여 정찰총국 특수 잠수부와 해군 보병을 훈련시킵니다. 특수부대가 상륙 기량을 갈고닦습니다. 진행도 §Y25§!, §Y50§!, §Y75§!, §Y100§!에 도달하면 다음 해군 특수 작전 단계가 잠금 해제됩니다."
 NKO_naval_capstone_complete: "해상 방벽 완성"
 NKO_naval_capstone_complete_desc: "네 개 계열이 모두 최종 단계에 도달했습니다. 선군 해군 교리의 완성을 선포하고 국가에 지속적인 보너스를 부여합니다."
 NKO_songun_navy_capstone: "선군 해군 교리"
 NKO_songun_navy_capstone_desc: "수년간의 집중적인 증강으로 일관된 비대칭 해군이 완성되었습니다. 장거리 잠수함, 군집 미사일 고속정, 다층 해안 방어, 정예 해군 특수부대가 이제 하나의 교리로 운용됩니다."
 NKO_sub_drill_momentum: "잠수함 전력 훈련 기세"
 NKO_sub_drill_momentum_desc: "최근의 훈련으로 침묵의 부대 전체의 사기와 절차적 규율이 높아졌습니다."
 NKO_mb_swarm_momentum: "미사일 고속정 군집 기세"
 NKO_mb_swarm_momentum_desc: "선단은 최근 훈련 이후 자신감의 물결을 타고 있습니다."
 NKO_cd_bunker_momentum: "벙커 방벽 고도 경계"
 NKO_cd_bunker_momentum_desc: "해안 수비대가 고도의 대비 태세에 있으며, 공병들이 두 배의 속도로 요새화 작업을 밀어붙이고 있습니다."
 NKO_so_recon_momentum: "정찰총국 작전 속도"
 NKO_so_recon_momentum_desc: "정찰총국이 과열 상태로 가동 중이며, 특수 잠수부 팀과 해군 특수부대 간부들이 끊임없이 교대하고 있습니다."
 NKO_naval_strategy_momentum: "해군 전략 기세"
 NKO_naval_strategy_momentum_desc: "통합된 전략 교리가 모든 해군 사무국을 고무했습니다. 연구, 훈련, 함대 조직 모두 새로워진 목적의식의 혜택을 누립니다."
 NKO_sub_tier_1: "상어급 현대화"
 NKO_sub_tier_1_desc: "상어급 연안 잠수함 함대 전반에 대한 개장과 승조원 훈련."
 NKO_sub_tier_2: "연어급 소형 잠수함 계획"
 NKO_sub_tier_2_desc: "연어급 침투정과 개선된 소나 대응책으로 우리의 작전 반경이 확대됩니다."
 NKO_sub_tier_3: "로미오급 개조"
 NKO_sub_tier_3_desc: "로미오급 선체가 새로운 전자 장비, 배터리, 더 조용한 추진 장치를 갖추게 됩니다."
 NKO_sub_tier_4: "신포급 SLBM 계획"
 NKO_sub_tier_4_desc: "신포급 잠수함이 북극성 계열을 배치합니다. 전략적 사거리, 실질적인 억제력."
 NKO_mb_tier_1: "코마르급 개장"
 NKO_mb_tier_1_desc: "낡은 코마르급 선체가 새로운 발사대와 출력이 향상된 엔진을 받습니다."
 NKO_mb_tier_2: "소주급 및 농어급 생산"
 NKO_mb_tier_2_desc: "국산 소주급과 농어급 미사일 고속정이 점점 더 많은 수가 취역합니다."
 NKO_mb_tier_3: "금성-3 대함 순항미사일 통합"
 NKO_mb_tier_3_desc: "금성-3 대함 순항미사일이 우리 선단에 신뢰할 만한 장거리 타격력을 부여합니다."
 NKO_mb_tier_4: "늑대 무리 교리"
 NKO_mb_tier_4_desc: "일제 발사, 다층 전자전, 기만정을 활용한 협동 군집 전술."
 NKO_cd_tier_1: "벙커 방벽"
 NKO_cd_tier_1_desc: "동해안과 서해안을 따라 이어지는 강화 벙커의 연속된 사슬."
 NKO_cd_tier_2: "기동 해안 야포"
 NKO_cd_tier_2_desc: "트럭 탑재 포대가 준비된 진지 사이를 이동하며 대포병 사격을 무력화합니다."
 NKO_cd_tier_3: "요새화된 곶"
 NKO_cd_tier_3_desc: "전략적 곶에 깊은 갱도, 강화 탄약고, 통합 레이더가 설치됩니다."
 NKO_cd_tier_4: "해안 배치 대함 미사일"
 NKO_cd_tier_4_desc: "기동 금성 발사대가 적 함대가 우리 해안에 접근할 수 없게 합니다."
 NKO_so_tier_1: "정찰총국 특수 잠수부"
 NKO_so_tier_1_desc: "정찰총국 특수 잠수부 팀이 훈련과 장비 풀을 확대합니다."
 NKO_so_tier_2: "해상 저격수 여단"
 NKO_so_tier_2_desc: "전담 해상 저격수 여단이 신속한 해안 습격을 전문으로 합니다."
 NKO_so_tier_3: "해상 경보병"
 NKO_so_tier_3_desc: "경보병 대대가 상륙 작전을 위해 해상 요소를 포함하여 재편됩니다."
 NKO_so_tier_4: "폭풍군단 해군"
 NKO_so_tier_4_desc: "폭풍군단 부대가 상시 해군 배속을 받습니다. 우리의 선봉은 어느 해안에든 닿습니다."
 nko_naval_buildup.1.t: "새 시대를 위한 해군 교리"
 nko_naval_buildup.1.d: "총참모부가 장기 계획을 마련했습니다. 누적된 해군 증강 포인트를 통해 진전시키는 네 개의 병행 계열입니다. 세 가지 결정이 포인트를 생성하고, 네 가지 투자 결정이 이를 소모합니다. 모든 계열에서 최종 단계에 도달하면 선군 해군 교리가 완성됩니다."
 nko_naval_buildup.1.a: "우리가 계획을 이끌겠다."
 nko_naval_buildup.11.t: "상어급 승조원들의 약진"
 nko_naval_buildup.11.d: "개장 조선소가 밀려 있던 상어급 선체를 처리합니다. 승조원들은 밤낮없이 훈련하며 침묵의 부대에 대한 자신감이 커집니다."
 nko_naval_buildup.11.a: "전진."
 nko_naval_buildup.12.t: "그물을 빠져나가는 연어급 소형 잠수함"
 nko_naval_buildup.12.d: "연어급 침투정이 우리 해안 레이더를 상대로 한 훈련에서 성공을 거두며, 포착했어야 할 탐지선을 빠져나갔습니다."
 nko_naval_buildup.12.a: "진정한 강점이다."
 nko_naval_buildup.13.t: "로미오급 개조의 결실"
 nko_naval_buildup.13.d: "현대화된 로미오급 잠수함은 이제 원래 설계자들이 상상했던 것보다 더 멀리, 더 조용히 순찰합니다."
 nko_naval_buildup.13.a: "훌륭하다."
 nko_naval_buildup.14.t: "부상하는 신포"
 nko_naval_buildup.14.d: "신포급 잠수함이 예정대로 부상했으며, 북극성 발사관이 장착되어 시험을 마쳤습니다. 전략적 억제력은 더 이상 꿈이 아닙니다."
 nko_naval_buildup.14.a: "계획에 영광을."
 nko_naval_buildup.21.t: "코마르급 개장 완료"
 nko_naval_buildup.21.d: "노후한 코마르급 선체가 새로운 발사대, 출력이 향상된 엔진, 놀랄 만큼 공격적인 승조원들과 함께 조선소를 떠납니다."
 nko_naval_buildup.21.a: "좋은 출발이다."
 nko_naval_buildup.22.t: "소주급과 농어급 선단 편성"
 nko_naval_buildup.22.d: "최초의 전담 소주급과 농어급 선단이 편성됩니다. 이전의 것들보다 더 빠르고, 더 날렵하며, 훨씬 더 위험합니다."
 nko_naval_buildup.22.a: "밀어붙여라."
 nko_naval_buildup.23.t: "바다로 나가는 금성-3"
 nko_naval_buildup.23.d: "금성-3 대함 미사일이 최종 함상 시험을 마쳤습니다. 이제 우리 선단은 적이 쉽게 대응할 수 없는 거리에서 타격할 수 있습니다."
 nko_naval_buildup.23.a: "사거리가 연장되었다."
 nko_naval_buildup.24.t: "늑대 무리 교리 채택"
 nko_naval_buildup.24.d: "일제 발사, 다층 재밍, 기만정. 늑대 무리 교리가 미사일 고속정 함대 전체에 공식 채택되었습니다."
 nko_naval_buildup.24.a: "무리가 준비되었다."
 nko_naval_buildup.31.t: "벙커 방벽 완성"
 nko_naval_buildup.31.d: "강화 벙커의 연속된 사슬이 이제 양쪽 해안선에 걸쳐 이어집니다. 현지 지휘관들은 수비대의 사기가 눈에 띄게 향상되었다고 보고합니다."
 nko_naval_buildup.31.a: "방어선을 사수하라."
 nko_naval_buildup.32.t: "기동 해안 야포 배치"
 nko_naval_buildup.32.d: "트럭 탑재 포대가 사격 후 이동 훈련을 거듭하여, 대포병 포탄이 도달하기 전에 사격 진지를 벗어날 수 있게 되었습니다."
 nko_naval_buildup.32.a: "규율 잡힌 작업이다."
 nko_naval_buildup.33.t: "요새화된 곶"
 nko_naval_buildup.33.d: "가장 전략적인 곶에 깊은 갱도, 강화 탄약고, 통합 레이더가 설치됩니다. 적 계획가들은 이제 본격적으로 방어된 해안과 마주하게 됩니다."
 nko_naval_buildup.33.a: "강철의 해안."
 nko_naval_buildup.34.t: "해안 배치 대함 미사일 가동"
 nko_naval_buildup.34.d: "기동 금성 포대가 해안 진지에 배치됩니다. 우리 해안에 접근하려는 모든 시도는 막대한 대가를 치르게 될 것입니다."
 nko_naval_buildup.34.a: "올 테면 와 보라."
 nko_naval_buildup.41.t: "특수 잠수부 인력 확충"
 nko_naval_buildup.41.d: "정찰총국이 은밀하게 특수 잠수부 선발 규모를 두 배로 늘리고 잠수 장비를 표준화합니다."
 nko_naval_buildup.41.a: "간부단을 키워라."
 nko_naval_buildup.42.t: "해상 저격수 여단 창설"
 nko_naval_buildup.42.d: "전담 해상 저격수 여단이 공식 활성화되었습니다. 가상의 해안 목표물을 상대로 한 첫 훈련은 기대를 뛰어넘었습니다."
 nko_naval_buildup.42.a: "날카로워졌다."
 nko_naval_buildup.43.t: "바다로 향하는 경보병"
 nko_naval_buildup.43.d: "선별된 경보병 대대가 해상 요소를 포함하여 재편됩니다. 상륙 교리가 소수의 전문 부대를 넘어서 확대됩니다."
 nko_naval_buildup.43.a: "어느 해안이든."
 nko_naval_buildup.44.t: "바다를 차지한 폭풍군단"
 nko_naval_buildup.44.d: "폭풍군단 부대가 상시 해군 배속을 받습니다. 우리의 선봉은 이제 진정한 해륙 겸용 전력입니다."
 nko_naval_buildup.44.a: "어디든 타격하라."
 nko_naval_buildup.51.t: "원산에서의 해군 훈련"
 nko_naval_buildup.51.d: "원산의 잠수함 선단이 분기별 훈련을 예정하고 있습니다. 승조원들은 출항 전 명령을 기다리고 있습니다."
 nko_naval_buildup.51.a: "강하게 몰아붙여 땀을 쏟게 하라"
 nko_naval_buildup.51.b: "절제된 일상적 속도면 충분하다"
 nko_naval_buildup.51.c: "취소하라, 연료와 부품이 부족하다"
 nko_naval_buildup.52.t: "외국 정찰선 발견"
 nko_naval_buildup.52.d: "해안 레이더가 우리가 주장하는 해역 안에서 배회하는 식별 불명의 선박을 포착했습니다. 해안 지휘관이 결정을 요구합니다."
 nko_naval_buildup.52.a: "차단하여 돌려보내라"
 nko_naval_buildup.52.b: "교전하지 말고 추적만 하라"
 nko_naval_buildup.52.c: "철수하여 사건을 피하라"
 nko_naval_buildup.53.t: "잠수함 탈북 위기"
 nko_naval_buildup.53.d: "우리 초계 잠수함 중 한 척에 탑승한 하급 장교가 입항 중 행방불명되었습니다. 정찰총국이 작전 승인을 요청합니다."
 nko_naval_buildup.53.a: "폭풍군단을 보내 회수하거나 제거하라"
 nko_naval_buildup.53.b: "수동적으로 추적하되 작전은 하지 마라"
 nko_naval_buildup.53.c: "보고를 묻어라"
 nko_naval_buildup.54.t: "남포 조선소, 할당량 초과"
 nko_naval_buildup.54.d: "남포 조선소의 현장 감독들이 할당량을 돌파한 달을 보고합니다. 노동자들은 의욕에 차 있지만 지쳐 있습니다."
 nko_naval_buildup.54.a: "보너스 배급으로 공개 포상하라"
 nko_naval_buildup.54.b: "더 요구하라, 할당량은 늘 낮았다"
 nko_naval_buildup.56.t: "밀수선 나포"
 nko_naval_buildup.56.d: "해안 순찰대가 밀수품을 운반하던 소형 선박을 나포했습니다. 현지 지휘관이 이 노획물을 어떻게 처리할지 묻습니다."
 nko_naval_buildup.56.a: "TV에 공개하라, 선전의 승리다"
 nko_naval_buildup.56.b: "조용히 압수하고 화물은 비축분에 편입하라"
 nko_naval_buildup.56.c: "선장의 뇌물을 받고 눈감아 주어라"
 nko_naval_buildup.60.t: "당당히 걷는 침묵의 부대"
 nko_naval_buildup.60.d: "신포와 그 자매함들이 승리의 페넌트를 휘날리며 귀항합니다. 조선인민군 해군 잠수함 부문이 성년에 이르렀습니다. 조국을 지키는 신뢰할 만한 수중 전력입니다."
 nko_naval_buildup.60.a: "심해는 우리의 것이다."
 nko_naval_buildup.61.t: "해안의 늑대들"
 nko_naval_buildup.61.d: "늑대 무리 교리가 모든 선단에 공식 채택되었습니다. 일제 발사, 다층 전자전, 기만정. 우리의 연안 타격 전력은 하나의 유기체처럼 움직입니다."
 nko_naval_buildup.61.a: "늑대들을 풀어라."
 nko_naval_buildup.62.t: "강철의 해안"
 nko_naval_buildup.62.d: "신의주에서 원산에 이르기까지 모든 접근로가 강화 벙커, 기동 야포, 해안 발사 대함 미사일로 봉쇄되었습니다. 어떤 함대도 무사히 우리 해안에 접근하지 못할 것입니다."
 nko_naval_buildup.62.a: "장벽이 서 있다."
 nko_naval_buildup.63.t: "바다로 나가는 폭풍군단"
 nko_naval_buildup.63.d: "폭풍군단 부대가 해상 전투 서열에 자리를 잡습니다. 정찰총국, 해상 저격수, 특수 잠수부, 해군 경보병이 이제 어느 해안이든 타격할 수 있는 하나의 정예 선봉을 이룹니다."
 nko_naval_buildup.63.a: "어디든 타격하라."
 nko_naval_buildup.70.t: "바다를 위한 전략 교리"
 nko_naval_buildup.70.d: "총참모부 해군 사무국이 통합 교리를 승인했습니다. 다층 잠수함, 군집 미사일 고속정, 요새화된 해안, 해군 코만도가 협력하는 체계입니다. 모든 조선소, 기지, 훈련 학교가 이제 같은 방향으로 나아갑니다."
 nko_naval_buildup.70.a: "전원이 계획에 투입된다."
 nko_naval_buildup.71.t: "계류를 푼 최초의 국산 구축함"
 nko_naval_buildup.71.d: "남포와 원산의 조선소가 수년 만에 처음으로 자체 건조한 미사일 구축함을 진수합니다. 승조원들이 새 선체에 몰려들어 작전 가능 상태를 향해 훈련합니다. 수상 함대가 다시 살아난 듯합니다."
 nko_naval_buildup.71.a: "바다로 보내라."
 nko_naval_buildup.72.t: "국산 잠수함 선체 형성"
 nko_naval_buildup.72.d: "잠수함 조선소가 촉박한 일정으로 새로운 공격 잠수함을 찍어냅니다. 구형 상어급과 로미오급 선체에서 훈련받은 승조원들이 새 플랫폼으로 순환 배치되어 자격 취득이 가속화됩니다."
 nko_naval_buildup.72.a: "조용히, 심해로."
 nko_naval_buildup.73.t: "출격하는 구축함 전대"
 nko_naval_buildup.73.d: "국내에서 건조되고 승조원까지 갖춘 구축함 전대 하나가 동해 함대에 배치됩니다. 늑대 무리 훈련을 받은 미사일 고속정 선단과 결합하여, 수상 전투 서열은 진지한 억제력이 됩니다."
 nko_naval_buildup.73.a: "전대를 달리게 하라."
 nko_naval_buildup.74.t: "현대식 함대의 각성"
 nko_naval_buildup.74.d: "2005년형 구축함 선체와 1995년급 공격 잠수함이 함께 우리 조선소에 들어와 §Y최현급§!과 §Y신포급§!으로 명명되었습니다. 각 함급 다섯 척이 비축분에 인도되었으며, 남포와 원산 조선소에는 두 함급의 전용 생산 라인이 이미 깔려 §H잠수함 사무국§!과 §H수상함 사무국§!이 직접 관할하고 있습니다.\n\n이 이정표는 양 사무국의 후반 단계 MIO 특성을 잠금 해제합니다. 잠수함 사무국에서는 §Y해대지 무기§!, §Y현대 소재§!, §Y정제된 잠수함 설계§!이며, 수상함 사무국에서는 §Y최적화된 생산§!과 §Y대규모 레이더 기술§!입니다."
 nko_naval_buildup.74.a: "강철의 시대가 시작된다."
 nko_naval_buildup.99.t: "완성된 평양의 해상 방벽"
 nko_naval_buildup.99.d: "수년간의 집중적인 노력 끝에 조선인민군 해군이 선군 해군 교리를 완성했습니다. 장거리 잠수함, 군집 미사일 고속정, 다층 해안 방어, 정예 해군 특수부대가 하나로 움직입니다. 비대칭 함대는 이제 현실입니다."
 nko_naval_buildup.99.a: "해상 방벽이 완성되었다."
 nko_naval_buildup.99.b: "평양의 해군이 현대화된다."
 NKO_naval_modern_fleet_milestone: "현대식 함대 취역"
 NKO_naval_modern_fleet_milestone_desc: "신포급 공격 잠수함과 최현급 구축함이 모두 생산 준비를 마쳤습니다. 각 함급의 첫 5척을 조선인민군 해군에 취역시키고, 전용 생산 라인을 마련하며, 양 해군 사무국에 자금을 지급합니다."
 NKO_more_arms_factories_desc: "군수 산업은 멈춰 서 있을 수 없습니다. 조선인민군에 보급을 이어가고 선군 노선을 굳건히 하기 위해 새로운 무기 공장이 건설될 것입니다."
 NKO_spa_focus_lifts_industry_tt: "§G'산업 침체' 상시 페널티를 §!§Y영구적으로 제거§!§G합니다.§!"
 NKO_spa_focus_lifts_production_tt: "§G'생산 라인 쇠퇴' 상시 페널티를 §!§Y영구적으로 제거§!§G합니다.§!"
 NKO_spa_focus_lifts_military_tt: "§G'속 빈 군대' 상시 페널티를 §!§Y영구적으로 제거§!§G합니다.§!"
 NKO_spa_focus_lifts_economy_tt: "§G'자원 사재기' 상시 페널티를 §!§Y영구적으로 제거§!§G합니다.§!"
 NKO_spa_focus_lifts_research_tt: "§G'연구 침체' 상시 페널티를 §!§Y영구적으로 제거§!§G합니다.§!"
 NKO_spa_focus_lifts_agriculture_tt: "§G'자급자족 농업' 상시 페널티를 §!§Y영구적으로 제거§!§G합니다.§!"
 NKO_spa_focus_lifts_foreign_tt: "§G'외교적 고립' 상시 페널티를 §!§Y영구적으로 제거§!§G합니다.§!"
 NKO_spa_focus_lifts_construction_tt: "§G'건설 병목' 상시 페널티(방어 기반시설)를 §!§Y영구적으로 제거§!§G합니다.§!"
 NKO_spa_umbrella: "최고인민회의"
 NKO_spa_umbrella_desc: "최고인민회의를 통해 §Y최대 두 개의 생산성 권한 위임§!을 동시에 유지할 수 있습니다. 각 권한 위임은 계획경제의 만성적 기능 장애 여덟 가지 중 하나를 §Y365일§!간 정지시키고 고유한 보너스를 적용합니다. 하나가 만료되면 그 슬롯이 비어 다른 것을 채택할 수 있습니다. 상시 페널티는 대응하는 국가 중점을 완료하여 영구적으로 제거할 수 있습니다."
 NKO_spa_debuff_industry: "산업 침체"
 NKO_spa_debuff_industry_desc: "수십 년간의 중앙 배분으로 공장은 원자재와 숙련 노동력이 고갈되었습니다. 건설은 더디게 진행됩니다."
 NKO_spa_debuff_production: "생산 라인 쇠퇴"
 NKO_spa_debuff_production_desc: "공구는 마모되었고, 공급망은 임기응변이며, 품질 관리는 그날 아침 현장 감독의 기분에 달려 있습니다."
 NKO_spa_debuff_military: "속 빈 군대"
 NKO_spa_debuff_military_desc: "서류상으로 조선인민군은 수백만 명의 병력을 자랑합니다. 그러나 실제로 훈련은 연극에 불과하고 사기는 깨지기 쉽습니다."
 NKO_spa_debuff_economy: "자원 사재기"
 NKO_spa_debuff_economy_desc: "지방 간부들이 자기 관할을 지나가는 물자를 빼돌립니다. 중앙에서 배분된 자원은 늦게, 부족하게, 혹은 아예 도착하지 않습니다."
 NKO_spa_debuff_research: "연구 침체"
 NKO_spa_debuff_research_desc: "제재, 두뇌 유출, 열악한 실험 장비로 인해 기초 연구조차 크게 느려집니다."
 NKO_spa_debuff_agriculture: "자급자족 농업"
 NKO_spa_debuff_agriculture_desc: "협동농장은 자기 마을을 먹여 살리기에도 빠듯한 수확을 냅니다. 도시는 식량이 부족합니다."
 NKO_spa_debuff_foreign: "외교적 고립"
 NKO_spa_debuff_foreign_desc: "제재와 국제 사회의 따돌림으로 인해 모든 외교적 접촉에는 마땅한 것보다 더 많은 비용이 들고 얻을 수 있는 것보다 적은 성과가 돌아옵니다."
 NKO_spa_debuff_construction: "건설 병목"
 NKO_spa_debuff_construction_desc: "방어 공학은 가장 심각한 영향을 받는 부문입니다. 요새는 완공되기도 전에 무너지고, 레이더 마스트는 배선이 반만 된 채 세워지며, 해군 기지는 준설이 반쯤 된 채로 남아 있고, 비행장은 부실한 유지 보수로 곳곳이 패여 있습니다."
 NKO_spa_resolution_industry: "산업 가속"
 NKO_spa_resolution_industry_desc: "최고인민회의가 구속력 있는 산업 지침을 내립니다. 민간 공장이 더 빠르게 늘어나며 군수 단지가 뒤를 따릅니다."
 NKO_spa_resolution_production: "장비 생산 권한 위임"
 NKO_spa_resolution_production_desc: "생산 라인이 계획된 과부하 주기로 가동됩니다. 효율 상한이 해제되고 신규 장비 생산이 더 빠르게 가속됩니다."
 NKO_spa_resolution_military: "선군 결의"
 NKO_spa_resolution_military_desc: "선군의 계절입니다. 훈련 일정이 빡빡해지고, 공격 교리가 날카로워지며, 당은 자신의 우선순위를 재확인합니다."
 NKO_spa_resolution_economy: "주체 자력갱생"
 NKO_spa_resolution_economy_desc: "자력갱생 운동이 토양과 광산에서 한 줌까지 쥐어짭니다. 지역 자원이 흘러나옵니다."
 NKO_spa_resolution_research: "연구 총력전"
 NKO_spa_resolution_research_desc: "모든 연구소가 초과 근무를 하며, 기밀 연구실은 24시간 교대로 돌아갑니다. 제재와 두뇌 유출을 돌파하는 일은 최고인민회의가 통과시킬 수 있는 가장 비싼 권한 위임입니다."
 NKO_spa_resolution_agriculture: "농업 총력전"
 NKO_spa_resolution_agriculture_desc: "협동농장이 할당량을 초과 달성합니다. 민간 부족 현상이 완화되고 공장의 생산량이 소폭 증가합니다."
 NKO_spa_resolution_foreign: "외교 정책 지침"
 NKO_spa_resolution_foreign_desc: "외무성 특사들이 각지로 퍼져 나갑니다. 관계 개선 비용이 줄어들고 무역 상대국이 우리를 조금 더 호의적으로 바라봅니다."
 NKO_spa_resolution_construction: "건설 대대"
 NKO_spa_resolution_construction_desc: "대규모로 동원된 군 공병 여단이 모든 방어 현장에 투입됩니다. 요새, 레이더, 단거리 방공 진지, 비행장, 해군 기지, 연료 저장고, 철도, 보급 거점이 전례 없는 속도로 들어섭니다."
 NKO_spa.0.t: "최고인민회의 소집"
 NKO_spa.0.d: "총비서 동지, 내각이 의제를 마련했습니다. 회의가 열렸습니다. 여덟 가지 만성적 문제가 주의를 요구하며, 우리는 언제든 그중 §Y두 가지§!를 구속력 있는 권한 위임 하에 둘 수 있습니다.\n\n각 권한 위임은 §Y365일§!간 유지되며, 하나가 만료되면 다음을 위한 슬롯이 비게 됩니다."
 NKO_spa.0.a: "회의를 소집하라."
 NKO_spa.20.t: "스타하노프 영웅들"
 NKO_spa.20.d: "황해 공업 지대의 노동자들이 새 지침의 첫 몇 주 동안 할당량을 박살냈습니다. 그들의 초상화가 이미 전국에 걸리고 있으며, 관리자들은 즉시 활용될 생산 능력의 급증을 보고합니다."
 NKO_spa.20.a: "영웅들에게 포상하라."
 NKO_spa.21.t: "공구 혁신"
 NKO_spa.21.d: "평양 중기계 공장의 기술자들이 장갑차량 라인의 처리량을 두 배로 늘리는 새로운 고정구 공법을 고안했습니다. 현재 사용 가능한 최신 차체 35대가 한꺼번에 생산되어 나옵니다. 그 주에 가동된 라인에 따라 전차, 보병전투차, 장갑차, 정찰차량, 또는 자주포가 됩니다."
 NKO_spa.21.a: "기술을 보급하라."
 NKO_spa.22.t: "공화국 영웅"
 NKO_spa.22.d: "선군 훈련 중 한 하급 장교가 보여 준 모범적인 지휘력이 총참모부의 눈에 띄었습니다. 예비역들이 이 본보기에 고무되어 입대 사무소로 몰려들고 있습니다."
 NKO_spa.22.a: "진급시키고 훈장을 수여하라."
 NKO_spa.23.t: "광물 발견"
 NKO_spa.23.d: "북부 산악 지대로 퍼져 나간 측량팀이 이전에 알려지지 않은 광맥을 확인했습니다. 초기 분석을 통해 이 매장지에서 어떤 전략 자원이 나오는지 결정될 것입니다. 국가자원국이 즉각적인 채굴을 승인했습니다."
 NKO_spa.23.a: "채굴을 시작하라."
 NKO_spa.24.t: "외국인 과학자의 망명"
 NKO_spa.24.d: "한 해외 거주 기술자가 제재 통제를 빠져나와 조선민주주의인민공화국의 연구 센터에 합류했습니다. 그의 통찰이 국가과학원의 우선 사업 중 하나를 가속하고 있습니다."
 NKO_spa.24.a: "동지를 환영하라."
 NKO_spa.25.t: "대풍작"
 NKO_spa.25.d: "함경북도의 협동농장들이 할당량을 훨씬 웃도는 수확량을 보고하고 있습니다. 곡물 비축량이 늘고, 농촌 모병 사무소에는 군대에서 일자리를 찾는 젊은 농촌 일꾼들이 가득합니다."
 NKO_spa.25.a: "잉여분을 분배하라."
 NKO_spa.26.t: "외교적 쾌거"
 NKO_spa.26.d: "외무성 특사들이 새 지침을 활용하여 조용한 외교적 승리를 거두었습니다. 주요 파트너로부터 얻어낸 비공식 양보가 경화로 환산됩니다."
 NKO_spa.26.a: "이익을 챙겨라."
 NKO_spa.27.t: "건설 선봉대"
 NKO_spa.27.d: "자원 건설 대대가 모든 예측을 뛰어넘는 성과를 냈습니다. 여유 역량이 남자, 내각은 그 작업을 일정이 가장 뒤처진 사업에 배정할 것을 제안합니다. 노동력을 쓸 수 없다면 대신 노동력을 경화로 현금화할 수도 있습니다."
 NKO_spa.27.factory_take: "민간 공장을 건설한다."
 NKO_spa.27.factory_cash: "노동력을 현금화한다. (국고 §Y+0.5§!)"
 NKO_spa.27.refinery_take: "합성 정제소를 건설한다."
 NKO_spa.27.refinery_cash: "노동력을 현금화한다. (국고 §Y+0.45§!)"
 NKO_spa.27.agri_take: "농업 지구를 건설한다."
 NKO_spa.27.agri_cash: "노동력을 현금화한다. (국고 §Y+0.45§!)"
 NKO_spa.30.t: "5개년 계획 개시"
 NKO_spa.30.d: "모든 공장 정문에 현수막이 피어납니다. 최고인민회의는 향후 365일을 모든 산업 지대에 구체적인 생산 할당량을 부과하는 축소판 5개년 계획으로 선포했습니다."
 NKO_spa.30.a: "계획을 가동하라."
 NKO_spa.32.t: "산업 기록 경신"
 NKO_spa.32.d: "지침은 김일성 광장에서 열린 승리의 집회로 막을 내립니다. 공화국의 생산 역량에 새로운 산업 슬롯이 추가되었고 당의 위신이 치솟았습니다."
 NKO_spa.32.a: "성과를 축하하라."
 NKO_spa.33.t: "새 공구 도착"
 NKO_spa.33.d: "암시장 경로를 통해 교체용 공구가 장비 공장에 도착했습니다. 생산 현장 감독들이 새 사양에 맞춰 작업장을 재교육합니다."
 NKO_spa.33.a: "새 공구를 보급하라."
 NKO_spa.35.t: "품질 관리의 승리"
 NKO_spa.35.d: "장비 생산 권한 위임은 국가 검열로 막을 내렸으며, 검열 결과 품질 기준이 기억에 남을 만큼 최고 수준으로 확인되었습니다. 조선인민군 조달 장교들이 만족해합니다."
 NKO_spa.35.a: "새로운 기준을 문서화하라."
 NKO_spa.36.t: "훈련 강화"
 NKO_spa.36.d: "선군의 계절입니다. 모든 군단에서 훈련 속도가 두 배가 됩니다. 수년간 중단되었던 실사격 훈련이 재개됩니다."
 NKO_spa.36.a: "병력을 더 강하게 몰아붙여라."
 NKO_spa.38.t: "선군의 승리"
 NKO_spa.38.d: "선군 결의는 평양에서 열린 대승리 열병식으로 마무리됩니다. 예비역 소집으로 대열이 다시 채워졌으며, 조선인민군은 수년 만에 가장 강력한 상태입니다."
 NKO_spa.38.a: "대오를 맞춰 행진하라."
 NKO_spa.39.t: "광물 탐사 개시"
 NKO_spa.39.d: "지질 탐사팀이 북부 산악 지대로 퍼져 나갑니다. 소련 시대의 낡은 지도를 꺼내 먼지를 털고 현대 장비로 갱신합니다."
 NKO_spa.39.a: "탐사를 승인하라."
 NKO_spa.41.t: "자력갱생 달성"
 NKO_spa.41.d: "주체 자력갱생 권한 위임은 수출 판매로 외화 보유고가 보충되며 막을 내립니다. 총비서 동지, 공화국이 우뚝 섰습니다."
 NKO_spa.41.a: "보유고를 예치하라."
 NKO_spa.42.t: "열린 연구실 문"
 NKO_spa.42.d: "국가과학원이 명령을 받았습니다. 모든 우선 사업이 해제되고 모든 기밀 문서에 접근할 수 있습니다. 수년간 보안 허가를 기다려 온 연구자들이 하룻밤 사이에 접근 권한을 받습니다."
 NKO_spa.42.a: "우선 사업을 승인하라."
 NKO_spa.44.t: "따라잡기"
 NKO_spa.44.d: "연구 총력전은 조선민주주의인민공화국이 1970년대 이래 그 어느 때보다 기술 최전선에 가까워지며 끝납니다. 당은 조용한 승리를 자축합니다."
 NKO_spa.44.a: "새로운 우위를 밀어붙여라."
 NKO_spa.45.t: "봄 파종 시작"
 NKO_spa.45.d: "전국의 협동농장이 공세적인 파종기를 위해 동원됩니다. 도시의 지원 여단이 농촌 노동력을 보강합니다."
 NKO_spa.45.a: "여단을 동원하라."
 NKO_spa.47.t: "대풍작"
 NKO_spa.47.d: "수확량이 계획을 20% 웃돌았습니다. 곡물 비축량이 늘어나며, 수년 만에 처음으로 일부 지역에서는 온전한 배급을 받게 될 것입니다."
 NKO_spa.47.a: "잉여분을 분배하라."
 NKO_spa.48.t: "외교적 접근"
 NKO_spa.48.d: "조선민주주의인민공화국 대표단이 우호적인 조건과 은밀한 요청을 들고 우방의 수도로 조용히 파견됩니다. 베이징, 모스크바, 테헤란, 다마스쿠스입니다."
 NKO_spa.48.a: "특사를 파견하라."
 NKO_spa.50.t: "무역 양보"
 NKO_spa.50.d: "외교 정책 지침은 외국 자본 유입을 크게 개선하는 일련의 새로운 합의로 막을 내립니다. 향후 10년간의 투자 약속이 체결되었습니다."
 NKO_spa.50.a: "합의에 서명하라."
 NKO_spa.51.t: "건설 선봉대 동원"
 NKO_spa.51.d: "건설 대대 권한 위임은 내각이 공적을 돌리기로 한 내부 파벌에게 뜻밖의 횡재입니다. 당은 정치적 배당을 다른 파벌보다 협력이 더 절실한 파벌에게 돌릴 수 있습니다."
 NKO_spa.51.military: "§Y군대§!의 공으로 돌린다. (기본 관계 §G+15§!, 독재자는 두 배, 월 관계 §G+0.05§!)"
 NKO_spa.51.cadres: "§Y공산당 간부§!의 공으로 돌린다. (기본 관계 §G+15§!, 독재자는 두 배, 월 관계 §G+0.05§!)"
 NKO_spa.51.donju: "§Y돈주§!의 공으로 돌린다. (기본 관계 §G+15§!, 독재자는 두 배)"
 NKO_spa.51.farmers: "§Y농민§!의 공으로 돌린다. (기본 관계 §G+15§!, 독재자는 두 배)"
 NKO_spa.51.labour: "§Y노동조합§!의 공으로 돌린다. (기본 관계 §G+15§!, 독재자는 두 배)"
 NKO_spa.51.none: "정치적 공을 우리가 차지한다. (§G+25 정치력§!)"
 NKO_spa.53.t: "사업 완료"
 NKO_spa.53.d: "건설 대대 권한 위임은 공화국 전역에 방송되는 준공식으로 막을 내립니다. 당은 정치적 배당을 거두고, 인구는 더 안정되며, 국고는 사업 잉여분에서 소소한 횡재를 얻습니다."
 NKO_spa.53.a: "테이프를 끊어라."
