 deep_state_ignore_international_tt: "국제사회의 비판이 무시되고 있습니다."
 deep_state_promise_democracy_tt: "2년 이내에 선거를 실시하겠다고 약속했습니다."
 deep_state_elections_held_tt: "§G선거 실시!\n알제리에 민주주의가 회복되었습니다.\n딥 스테이트 권력이 10으로 초기화됩니다.\n국제 관계가 개선되었습니다.§!"
 ALG_deep_state_category: "딥 스테이트 현안"
 ALG_assess_deep_state: "딥 스테이트 영향력 평가"
 ALG_reduce_deep_state: "딥 스테이트 영향력 축소"
 ALG_reduce_deep_state_desc: "민간 문제에 대한 군 기득권의 영향력을 줄이기 위한 체계적 조치를 취합니다.\n\n§G효과: 딥 스테이트 권력 -5§!\n§R위험: 안정도 -4%, 높은 권력 수준에서는 반발 가능성§!"
 ALG_purge_military_command: "군 지휘부 숙청"
 ALG_purge_military_command_desc: "타협한 장군들을 제거하고 민간 통제를 재확립하기 위한 극단적이고 위험한 조치입니다. 군사 작전에 심각한 차질이 생깁니다.\n\n§G효과: 딥 스테이트 권력 -10§!\n§R심각한 페널티:\n• 안정도 -10%\n• £army_experience 육군 경험치 -50\n• 숙청 중 육군 조직력 -10%§!\n\n§Y재사용 대기: 1년§!"
 ALG_cooperate_with_military: "군 지도부와 협력"
 ALG_cooperate_with_military_desc: "장군들과 협력하여 안정을 유지합니다. 이 실용적 접근은 단기적 이익을 제공하지만 그들의 입지를 강화합니다.\n\n§R효과: 딥 스테이트 권력 +3§!\n§G이점:\n•  안정도 +3%\n• £pol_power 정치력 +50§!\n\n§Y딥 스테이트 권력이 25 초과이면 사용 불가§!"
 ALG_reform_intelligence_services: "정보기관 개혁"
 ALG_reform_intelligence_services_desc: "적절한 민간 감독과 책임성을 보장하도록 정보기관(DRS/DSS)을 재편합니다.\n\n§G효과: 딥 스테이트 권력 -7§!\n§R비용:\n• 안정도 -5%\n• 개혁 중 £pol_power 정치력 -10%\n• 감시 능력 제거§!\n\n§Y재사용 대기: 180일§!"
 ALG_appoint_loyal_officers: "충성파 장교 임명"
 ALG_appoint_loyal_officers_desc: "민간 정부에 충성하는 장교들을 핵심 군 보직에 배치하여 점진적으로 세력 균형을 바꿉니다.\n\n§G효과: 딥 스테이트 권력 -3§!\n§R비용: £army_experience 육군 경험치 -25§!\n\n§Y재사용 대기: 120일§!"
 ALG_declare_emergency: "비상사태 선포"
 ALG_declare_emergency_desc: "비상 권한을 발동하여 딥 스테이트의 활동을 일시적으로 동결합니다. 절박한 시기를 위한 절박한 조치입니다.\n\n§Y효과: 딥 스테이트 성장 180일간 동결§!\n§R비용:\n• 안정도 -8%\n• 비상사태 국가 정신 추가§!\n\n§Y딥 스테이트 권력이 22 초과일 때만 사용 가능§!"
 ALG_negotiate_with_generals: "장군들과 협상"
 ALG_negotiate_with_generals_desc: "군 지도부와 비밀 비공식 협상을 열어 정치적 타협점을 모색합니다.\n\n§Y결과(무작위):§!\n§G50%: 성공 - 딥 스테이트 -4, 안정도 +2%§!\n§Y30%: 부분 성공 - 딥 스테이트 -2§!\n§R20%: 실패 - 딥 스테이트 +2, 안정도 -3%§!\n\n§Y재사용 대기: 180일§!"
 alg_deep_state.5.t: "커져가는 군의 영향력"
 alg_deep_state.10.t: "정보기관의 개입"
 alg_deep_state.15.t: "그림자 속의 장군들"
 alg_deep_state.20.t: "딥 스테이트"
 alg_deep_state.101.t: "국방 계약 비리"
 alg_deep_state.102.t: "정보기관의 권한 확대 요청"
 alg_deep_state.103.t: "민간 권위에 도전하는 장군"
 alg_deep_state.104.t: "군의 경제적 이권"
 alg_deep_state.105.t: "언론 압박"
 alg_deep_state.106.t: "예비역 장군들의 정계 진출"
 alg_deep_state.107.t: "지방 군 지휘관들"
 alg_deep_state.108.t: "외국의 지원 제의"
 alg_deep_state.200.t: "알제의 군사 쿠데타"
 alg_deep_state.201.t: "쿠데타에 저항할 것인가?"
 alg_deep_state.210.t: "군사정권의 권력 공고화"
 alg_deep_state.211.t: "국제사회의 반응"
 alg_deep_state.220.t: "약속된 선거"
 alg_deep_state.5.d: "예비역 장군들과 정보 장교들이 정치·경제계에서 점점 더 눈에 띄고 있다는 보고가 있습니다. 그들의 영향력은 공식적인 직책을 훨씬 넘어서고 있습니다.\n\n§Y딥 스테이트가 네트워크를 구축하고 있습니다.§!"
 alg_deep_state.10.d: "DRS와 기타 정보기관 내의 일부 세력이 국가 정책에 직접 영향력을 행사하기 시작했습니다. 핵심 결정이 적절한 민간 감독 없이 내려지고 있습니다.\n\n§R대응이 필요합니다.§!"
 alg_deep_state.15.d: "군 기득권층은 이제 그림자 정부로 활동하고 있습니다. 장관들은 주요 정책을 시행하기 전에 고위 장군들의 승인을 받아야 하는 경우가 늘고 있습니다.\n\n§R르 푸부아르(le pouvoir)가 점점 더 강해지고 있습니다.§!"
 alg_deep_state.20.d: "보안 기구는 이제 알제리 국가에 막대한 영향력을 행사합니다. 딥 스테이트, 즉 '르 푸부아르'는 왕좌 뒤의 진정한 권력이 되었습니다. 민간 정치인들은 단순한 허수아비일 뿐입니다.\n\n§R위기: 딥 스테이트가 알제리를 장악하고 있습니다!§!"
 alg_deep_state.101.d: "수십억 규모의 대규모 국방 계약이 수상한 상황에서 체결되었습니다. 고위 군 관계자들이 상당한 뒷돈을 받았다는 증거가 있습니다.\n\n§Y어떻게 대응할 것인가?§!"
 alg_deep_state.102.d: "정보기관은 안보 우려와 테러 및 외국 간섭에 대처할 필요성을 이유로 감시 권한 확대를 공식 요청했습니다.\n\n§Y이는 그들의 영향력을 크게 높일 것입니다.§!"
 alg_deep_state.103.d: "저명하고 영향력 있는 한 장군이 정부 정책을 공개적으로 비판하며 '책임 있는 지도력'과 '국가 안보 우선순위'를 촉구했습니다. 이는 민간 권위에 대한 얇은 가면을 쓴 위협입니다.\n\n§R이것은 직접적인 도전입니다!§!"
 alg_deep_state.104.d: "군 고위 인사들이 핵심 경제 부문으로 사업적 이권을 확장하려 하고 있습니다. 그들은 이것이 국가 안보와 발전에 이로울 것이라고 주장합니다."
 alg_deep_state.105.d: "군 기득권층은 주요 언론사에 국방과 안보 문제에 대해 보다 우호적인 편집 방침을 채택하도록 압박하고 있습니다."
 alg_deep_state.106.d: "여러 명의 예비역 고위 장성들이 정계 진출에 관심을 표명하고 있습니다. 그들은 경험과 안정을 제공할 수 있다고 주장합니다."
 alg_deep_state.107.d: "지방 군 지휘관들은 상당한 지역적 영향력을 보유하고 있습니다. 문제는 그들이 민간 정부에 충성할 것인지, 딥 스테이트 네트워크에 충성할 것인지입니다."
 alg_deep_state.108.d: "외국 외교관들이 딥 스테이트의 커지는 영향력을 관리하는 데 도움을 주겠다고 은밀히 제안했습니다. 이에는 정치적 대가와 의무가 따를 것입니다."
 alg_deep_state.200.d: "전차들이 알제의 정부 청사를 둘러쌌습니다. 군은 '질서, 안정, 올바른 통치를 회복하기 위해' '임시' 통제권을 장악한다고 발표했습니다.\n\n§R군이 권력을 장악했습니다!§!\n\n딥 스테이트가 노골적인 군사 통치로 변모했습니다."
 alg_deep_state.201.d: "군이 권력을 장악했지만 아직 저항할 가능성은 남아 있을지 모릅니다. 충성 세력이 민간 정부를 복원하려 시도할 수 있으나, 이는 극도로 위험합니다."
 alg_deep_state.210.d: "군사 정부는 신속하게 통제권을 공고히 했습니다. 핵심 기관들은 이제 확고하게 군의 지휘 아래 있습니다."
 alg_deep_state.211.d: "국제사회가 군의 권력 장악에 반응했습니다. 여러 국가가 쿠데타를 규탄하고 민간 정부로의 복귀를 촉구했습니다."
 alg_deep_state.220.d: "때가 왔습니다. 군은 권력을 장악하면서 2년 이내에 선거를 실시하고 민간 통치를 복원하겠다고 약속했습니다.\n\n그 기한이 도래했습니다. 세계가 지켜보고 있습니다.\n\n§Y장군들은 약속을 지킬 것인가?§!"
 alg_deep_state.5.a: "경계를 늦추지 말아야 한다."
 alg_deep_state.10.a: "그들이 활동하도록 두자. 우리에게는 안정이 필요하다."
 alg_deep_state.10.b: "즉시 민간 통제를 재확립한다."
 alg_deep_state.15.a: "군의 감독을 받아들인다. 저항은 무의미하다."
 alg_deep_state.15.b: "장군들에게 맞선다!"
 alg_deep_state.20.a: "이제 실권은 장군들이 쥐고 있다."
 alg_deep_state.101.a: "눈감아 준다. 우리에게는 군의 지지가 필요하다."
 alg_deep_state.101.b: "조사에 착수한다."
 alg_deep_state.102.a: "확대된 감시 권한을 부여한다."
 alg_deep_state.102.b: "헌법적 한계를 유지한다."
 alg_deep_state.103.a: "물러선다. 우리는 대립을 감당할 수 없다."
 alg_deep_state.103.b: "즉시 해당 장군을 해임한다!"
 alg_deep_state.103.c: "타협안을 찾는다."
 alg_deep_state.104.a: "군의 사업 확장을 허용한다."
 alg_deep_state.104.b: "군의 경제 활동을 차단한다."
 alg_deep_state.105.a: "군이 여론의 흐름을 통제하도록 둔다."
 alg_deep_state.105.b: "언론의 자유를 수호한다."
 alg_deep_state.106.a: "그들의 정치 참여를 환영한다."
 alg_deep_state.106.b: "정치와의 분리를 강제한다."
 alg_deep_state.107.a: "국가에 충성하는 지휘관에게 보상한다."
 alg_deep_state.107.b: "딥 스테이트가 진급을 관리하도록 둔다."
 alg_deep_state.108.a: "은밀한 외국의 지원을 수락한다."
 alg_deep_state.108.b: "어떠한 외국의 간섭도 거부한다."
 alg_deep_state.200.a: "이제 군이 알제리를 통제한다."
 alg_deep_state.201.a: "쿠데타에 저항을 시도한다!"
 alg_deep_state.201.b: "군사 통치를 받아들인다. 저항은 무의미하다."
 alg_deep_state.210.a: "새로운 질서가 확립되었다."
 alg_deep_state.211.a: "비판을 무시한다."
 alg_deep_state.211.b: "언젠가 선거를 실시하겠다고 약속한다."
 alg_deep_state.220.a: "선거를 실시하고 민주주의를 회복한다."
 alg_deep_state.220.b: "국가는 준비되지 않았다. 무기한 연기한다."
 alg_deep_state_news.1.t: "알제리 군사 쿠데타!"
 alg_deep_state_news.1.d: "알제발 보도에 따르면 알제리 군이 정부를 장악했습니다. 전차들이 주요 정부 청사를 둘러싸고 있으며 군사정권이 권력을 잡겠다고 발표했습니다.\n\n이는 오랫동안 소문으로만 돌던 '딥 스테이트'가 이제 공공연히 통제권을 쥔 알제리 정치의 극적인 변화를 의미합니다."
 alg_deep_state_news.1.a: "깊이 우려스러운 일이다."
 alg_deep_state_news.1.b: "알제리의 내정은 우리가 상관할 바가 아니다."
 ALG_deep_state_oversight: "군의 감독"
 ALG_deep_state_control: "딥 스테이트 통제"
 ALG_surveillance_state_1: "확대된 감시"
 ALG_military_junta_1: "군사정권"
 ALG_state_of_emergency: "비상사태"
 ALG_post_coup_recovery: "쿠데타 후 복구"
 ALG_promised_elections: "약속된 선거"
 ALG_deep_state_oversight_desc: "군 기득권층이 정부 결정에 대해 상당한 감독권을 유지하고 있습니다. 장군들은 주요 정책 구상을 시행하기 전에 승인해야 합니다.\n\n§Y딥 스테이트 3단계 활성§!"
 ALG_deep_state_control_desc: "르 푸부아르, 즉 딥 스테이트가 그림자 속에서 알제리 정부를 사실상 통제하고 있습니다. 민간 정치인들은 단순한 허수아비일 뿐입니다.\n\n§R딥 스테이트 4단계 활성 - 위기!§!\n§Y쿠데타 위험이 크게 증가합니다!§!"
 ALG_surveillance_state_1_desc: "정보기관이 최소한의 감독만 받으며 민간인의 활동을 감시합니다. 사생활은 소수만이 누릴 수 있는 사치가 되었습니다.\n\n§R이는 딥 스테이트 권력에 크게 기여합니다.§!"
 ALG_military_junta_1_desc: "군이 알제리 국가의 직접 통제권을 장악했습니다. 이제 장군 평의회가 국가를 통치합니다.\n\n§R군사 쿠데타가 발생했습니다!§!\n\n민주적 통치는 끝났습니다. 딥 스테이트가 공공연히 통치합니다."
 ALG_state_of_emergency_desc: "딥 스테이트의 커지는 영향력에 맞서기 위해 비상 권한이 발동되었습니다. 시민의 자유가 일시적으로 정지됩니다.\n\n§G이것이 활성화된 동안 딥 스테이트의 성장은 동결됩니다.§!\n§R이 상태를 무기한 유지할 수는 없습니다.§!"
 ALG_post_coup_recovery_desc: "알제리는 실패한 군사 쿠데타에서 회복하는 중입니다. 제도는 손상되었고 정부에 대한 신뢰는 낮습니다.\n\n§Y국가는 재건해야 합니다.§!"
 ALG_promised_elections_desc: "군사 정부가 선거를 실시하고 민간 통치를 복원하겠다고 약속했습니다. 국제사회가 지켜보고 있습니다.\n\n§Y이 효과가 만료되기 전에 선거를 실시해야 합니다.§!"
 ALG_deep_state_oversight_added_tt: "§Y군 감독 체제 확립§!\n군이 이제 정부 결정에 대한 공식적인 감독권을 갖습니다.\n\n§R딥 스테이트 영향력이 높습니다.§!"
 ALG_deep_state_control_added_tt: "§R딥 스테이트 통제 확립§!\n르 푸부아르가 이제 그림자 속에서 알제리를 통제합니다.\n\n§R쿠데타 위험이 심각합니다!§!"
 ALG_surveillance_state_added_tt: "§R감시 국가 활성화§!\n정보기관이 이제 민간인의 활동을 광범위하게 감시합니다."
 ALG_military_junta_added_tt: "§R군사정권 수립!§!\n장군들이 권력을 장악했습니다. 알제리는 군사 통치하에 있습니다."
 ALG_state_of_emergency_added_tt: "§Y비상사태 선포§!\n비상 권한이 이제 효력을 발휘합니다.\n§G딥 스테이트 성장이 180일간 동결됩니다.§!"
 ALG_state_of_emergency_removed_tt: "§Y비상사태가 종료되었습니다.§!\n§R딥 스테이트가 다시 성장할 수 있습니다.§!"
 ALG_post_coup_recovery_added_tt: "§Y쿠데타 후 복구 기간§!\n알제리가 실패한 쿠데타 시도 이후 재건 중입니다."
 ALG_promised_elections_added_tt: "§Y선거가 약속되었습니다.§!\n군은 이 약속을 이행할 기한이 2년입니다."
