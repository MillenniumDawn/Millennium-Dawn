 generic.Western_Autocracy: "£generic_Western_Autocracy_small  Prozachodni Autokraci"
 generic.Western_Autocracy_desc: "Autokracja prozachodnia odnosi się do szerokiego spektrum niedemokratycznych, autorytarnych ideologii, które są zgodne z geopolitycznymi interesami Zachodu."
 generic.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 generic.conservatism: "£generic_conservatism_small  Konserwatyści"
 generic.conservatism_desc: "Konserwatyzm obejmuje szerokie spektrum umiarkowanie prawicowych ideologii, które kładą nacisk na znaczenie tradycyjnej kultury, jedności oraz stabilnego stylu życia. Konserwatyści zazwyczaj sprzeciwiają się ingerencji państwa w sprawy społeczne i gospodarcze, często wychodząc z założenia, że ​​ograniczenie regulacji sprzyja większej mobilności społecznej obywateli."
 generic.conservatism_icon: "£generic_conservatism_small"
 generic.liberalism: "£generic_liberalism_small  Liberałowie"
 generic.liberalism_desc: "Liberalizm to centrowa ideologia, która promuje prawa jednostki i kładzie nacisk na wolność, przeciwstawiając ją rozszerzaniu władzy państwowej. Liberałowie zazwyczaj popierają progresywną politykę społeczną w ramach wolnego rynku i wolnego handlu z resztą świata."
 generic.liberalism_icon: "£generic_liberalism_small"
 generic.socialism: "£generic_socialism_small  Socjaldemokraci"
 generic.socialism_desc: "Socjaldemokracja obejmuje szerokie spektrum lewicowych ideologii, które postulują sprawiedliwość gospodarczą i społeczną w większym stopniu niż większość nurtów liberalizmu. Socjaldemokraci dążą do nadania kapitalizmowi bardziej ludzkiego oblicza, aby ograniczyć nierówności i ucisk oraz wspierać demokrację."
 generic.socialism_icon: "£generic_socialism_small"
 generic.anarchist_communism: "£generic_anarchist_communism_small  Lewicowi radykałowie"
 generic.anarchist_communism_desc: "Radykalizm lewicowy to szerokie spektrum ideologii skrajnie lewicowych, które zazwyczaj postulują kres kapitalizmu i globalizacji. Choć niektórzy mogą popierać opór zbrojny, wielu postrzega siebie po prostu jako osoby „bardziej lewicowe” od socjaldemokratów i akceptuje demokrację liberalną."
 generic.anarchist_communism_icon: "£generic_anarchist_communism_small"
 generic.Conservative: "£generic_Conservative_small  Reakcjoniści"
 generic.Conservative_desc: "Mianem reakcjonistów określa się szerokie spektrum skrajnie prawicowych ideologii, których cele wykraczają poza postulaty umiarkowanych konserwatystów. Reakcjoniści zazwyczaj odwołują się do wyidealizowanej wizji przeszłości i dążą do przywrócenia dawnej świetności narodu, opierając się na ideologii rewancjonistycznej i irredentystycznej oraz agresywnej polityce militarnej."
 generic.Conservative_icon: "£generic_Conservative_small"
 generic.Autocracy: "£generic_Autocracy_small  Autokraci"
 generic.Autocracy_desc: "Autokracja odnosi się do szerokiego spektrum niedemokratycznych, autorytarnych systemów politycznych, w których pełnię władzy politycznej sprawuje jeden władca lub grupa uprzywilejowanych elit."
 generic.Autocracy_icon: "£generic_Autocracy_small"
 generic.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small  Umiarkowany szyicki rewolucjonista"
 generic.Mod_Vilayat_e_Faqih_desc: "Mianem umiarkowanych szyickich rewolucjonistów określa się grupę prawicowych wyznawców szyizmu, którzy opowiadają się za ścisłą interpretacją islamu szyickiego, lecz jednocześnie popierają większy pluralizm polityczny niż ich bardziej radykalni współwyznawcy. Mimo to w przeważającej mierze opowiadają się oni za utrzymaniem teokracji."
 generic.Mod_Vilayat_e_Faqih_icon: "£generic_Mod_Vilayat_e_Faqih_small"
 generic.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small Radykalni Szyiccy Rewolucjoniści"
 generic.Vilayat_e_Faqih_desc: "Mianem radykalnych szyickich rewolucjonistów określa się szerokie spektrum skrajnie prawicowych i nastawionych militarnie wyznawców szyizmu, opowiadających się za ścisłą interpretacją tego odłamu islamu. Prezentują oni w dużej mierze negatywny stosunek do sunnitów i dążą do utrzymania szyizmu w ramach państwa teokratycznego."
 generic.Vilayat_e_Faqih_icon: "£generic_Vilayat_e_Faqih_small"
 generic.Kingdom: "£generic_Kingdom_small Salafizm sprzyjający establishmentowi"
 generic.Kingdom_icon: "£generic_Kingdom_small"
 generic.Kingdom_desc: "Niektóre nurty myśli salafickiej, takie jak wahhabizm czy madkhalizm, opowiadają się za utrzymaniem status quo, a nie za radykalną rewolucją czy zbrojnym dżihadem. Przedstawiciele tych odłamów podzielają fundamentalistyczne i nietolerancyjne poglądy dżihadystów nurtu kutbistycznego, lecz zasadniczo odrzucają przemoc i popierają istniejące władze. Taka postawa czyni ich atrakcyjnymi sojusznikami dla autorytarnych państw arabskich, obawiających się zagrożenia, jakie dla ich władzy stanowią bardziej upolitycznione odmiany islamizmu."
 generic.Caliphate: "£generic_Caliphate_small  Salaficki dżihadyzm"
 generic.Caliphate_icon: "£generic_Caliphate_small"
 generic.Caliphate_desc: "Salaficki dżihadyzm to skrajnie surowy, ultrakonserwatywny i fundamentalistyczny odłam islamskiej ideologii politycznej, inspirowany naukami Sayyida Qutba. Jego zwolennicy dążą do opanowania wszystkich ziem muzułmańskich i sprawowania nad nimi władzy w oparciu o własną, surową interpretację prawa islamskiego. Nie uznają oni innych nurtów islamu ani religii mniejszościowych i nie cofną się przed niczym, by osiągnąć swoje cele."
 generic.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small  Umiarkowani islamiści"
 generic.Neutral_Muslim_Brotherhood_icon: "£muslim_brotherhood_small"
 generic.Neutral_Muslim_Brotherhood_desc: "Umiarkowany islamizm odnosi się do szerokiego spektrum islamskich ruchów politycznych dążących do ustanowienia demokratycznego państwa w ramach prawa islamskiego."
 generic.Neutral_Autocracy: "£generic_Neutral_Autocracy_small  Niezaangażowani autokraci"
 generic.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 generic.Neutral_Autocracy_desc: "Autokracja odnosi się do szerokiego spektrum niedemokratycznych, autorytarnych ideologii, w których pełnia władzy spoczywa w rękach jednego władcy."
 generic.Neutral_conservatism: "£generic_Neutral_conservatism_small  Konserwatyści"
 generic.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 generic.Neutral_conservatism_desc: "Konserwatyzm obejmuje szerokie spektrum umiarkowanie prawicowych ideologii, które kładą nacisk na znaczenie tradycyjnej kultury, jedności oraz stabilnego stylu życia. Konserwatyści zazwyczaj sprzeciwiają się ingerencji państwa w sprawy społeczne i gospodarcze, często wychodząc z założenia, że ​​ograniczenie regulacji sprzyja większej mobilności społecznej obywateli."
 generic.oligarchism: "£generic_oligarchism_small  Oligarchowie"
 generic.oligarchism_icon: "£generic_oligarchism_small"
 generic.oligarchism_desc: "Oligarchia to struktura władzy, w której kontrola spoczywa w rękach wąskiej grupy elit politycznych i gospodarczych. Oligarchie mają zazwyczaj charakter niedemokratyczny i autorytarny."
 generic.Neutral_Libertarian: "£generic_Neutral_Libertarian_small  Libertarianie"
 generic.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 generic.Neutral_Libertarian_desc: "Libertarianizm obejmuje szeroki wachlarz ideologii i ruchów politycznych, które za kluczową zasadę uznają wolność. Libertarianie zazwyczaj opowiadają się za ograniczoną ingerencją państwa we wszelkie sfery życia społecznego, politycznego i gospodarczego – w większym stopniu niż konserwatyści."
 generic.Neutral_green: "£generic_Neutral_green_small Zieloni"
 generic.Neutral_green_icon: "£generic_Neutral_green_small"
 generic.Neutral_green_desc: "Polityka zielona (lub ekopolityka) odnosi się do szerokiego spektrum ruchów lewicowych, które opowiadają się za niestosowaniem przemocy, sprawiedliwością społeczną, demokracją bezpośrednią oraz ochroną środowiska."
 generic.neutral_Social: "£generic_neutral_Social_small  Socjaldemokraci"
 generic.neutral_Social_icon: "£generic_neutral_Social_small"
 generic.neutral_Social_desc: "Ideologia socjaldemokratyczna odnosi się do nurtów lewicowych, które postulują sprawiedliwość gospodarczą i społeczną. Działając w ramach systemu kapitalistycznego, zwolennicy tej ideologii dążą do znacznej redystrybucji dochodów w celu ograniczenia nierówności. Promują oni model państwa opiekuńczego i opowiadają się za ściślejszą regulacją działalności prywatnych przedsiębiorstw."
 generic.Neutral_Communism: "£generic_Neutral_Communism_small Komuniści"
 generic.Neutral_Communism_icon: "£generic_Neutral_Communism_small"
 generic.Neutral_Communism_desc: "W szerokim ujęciu komunizm to ideologia postulująca zniesienie systemu kapitalistycznego w celu stworzenia wspólnotowego raju dla robotników. W rzeczywistości państwa komunistyczne utrzymują kapitalistyczne systemy gospodarcze i często mają niedemokratyczny charakter."
 generic.Nat_Populism: "£generic_Nat_Populism_small  Prawicowi populiści"
 generic.Nat_Populism_icon: "£generic_Nat_Populism_small"
 generic.Nat_Populism_desc: "Prawicowy populizm to odmiana ideologii populistycznej, która dąży do wzmocnienia pozycji ludu w kontrze do postrzeganych jako dominujące nad społeczeństwem elit. Przedstawiciele prawicowego populizmu zazwyczaj opowiadają się za antyglobalizmem, protekcjonizmem, natywizmem i nacjonalizmem oraz sprzeciwiają się imigracji."
 generic.Nat_Fascism: "£generic_Nat_Fascism_small  Faszyści"
 generic.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 generic.Nat_Fascism_desc: "Faszyzm to odmiana autorytarnego ultracjonalizmu o zabarwieniu militarystycznym. Dąży on do ustanowienia państwa jednopartyjnego, na którego czele stoi przywódca sprawujący władzę absolutną, oraz popiera przemoc i agresywny ekspansjonizm w celu doprowadzenia do odrodzenia narodu."
 generic.Nat_Autocracy: "£generic_Nat_Autocracy_small  Junta wojskowa"
 generic.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 generic.Nat_Autocracy_desc: "Mianem junt wojskowych określa się rządy sprawowane przez komitet dowódców wojskowych. Junty te mają często charakter niedemokratyczny i autorytarny, a w bardzo szerokim ujęciu można je uznać za formę dyktatury wojskowej lub stratokracji."
 generic.Monarchist: "£generic_Monarchist_small  Monarchiści"
 generic.Monarchist_icon: "£generic_Monarchist_small"
 generic.Monarchist_desc: "Ideologia monarchistyczna odnosi się do monarchii absolutnych."
