 UKR_hur_operation_chechnya_tt: "We will be able to launch a special limited operation in §Y[CHE.GetNameWithFlag]§!"
 UKR_hur_operation_caucas_volunteer_tt: "De nouveaux bataillons du HUR seront disponibles pour des opérations spéciales limitées."
 UKR_hur_operation_russian_tt: "We will be able to launch special limited operations in §Y[SOV.GetNameWithFlag]§!"
