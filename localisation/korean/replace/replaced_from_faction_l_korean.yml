 UNASUL_member: "UNASUL 방위 조약 회원국"
 UNASUL_member_desc: "UNASUL 공동 방위 체제는 남미 회원국들을 하나의 공동 군사 체계로 묶습니다. 그 지휘 구조와 상호 보장은 블록 내부의 정치적 합의를 통해 조율되도록 되어 있으며, 가입은 외교 또는 블록 차원의 정치적 조치를 통해 열릴 수 있습니다."
 UNASUL_member_tooltip: "§R세력 특수 규칙§!:\n- 회원국은 방어 전쟁에서만 호출될 수 있습니다\n- 세력 가입은 일반 외교 또는 블록 사건을 통해 이루어질 수 있습니다\n- 세력 탈퇴는 결정/사건으로 통제됩니다\n- 회원국은 일반 세력 외교를 통해 제명될 수 없습니다\n- 동맹은 일반적인 수단으로 해체될 수 없습니다"
 UNASUL_call_ally_rule_tt: "§RUNASUL 회원국은 방어 전쟁에서만 동맹을 호출할 수 있습니다!§!"
 UNASUL_join_ally_rule_tt: "§RUNASUL 회원국은 방어 전쟁에서만 동맹에 참전할 수 있습니다!§!"
