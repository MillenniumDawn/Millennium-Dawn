 sp_air_autonomous_computers_reward_improved_detection: "향상된 항법 및 탐지 체계"
 sp_air_autonomous_computers_reward_improved_detection_desc: "데이터와 기계 학습의 도움으로, 우리는 전투기 내부 체계가 위협을 더 정확하게 회피하고 표적을 찾아내도록 지시할 수 있습니다."
 sp_air_autonomous_bombers_reward_improved_detection: "향상된 자율성과 의사 결정"
 sp_air_autonomous_bombers_reward_improved_detection_desc: "자율 폭격기의 개발은 고강도 상황에서 도움이 될 것이며, 어떤 표적이 적대적인지를 두고 기획자와 의사 결정자 사이에 오가는 교신과 논쟁을 줄여 줄 것입니다."
