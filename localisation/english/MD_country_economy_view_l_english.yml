 TREASURY_TOOLTIP_DELAYED: "Our treasury reflects the amount of money we have available to spend, and can be used for purchases and investments. If the treasury goes into the red, debt will automatically be issued weekly to keep it positive.\n\n§tEconomy screen is moved to trade tab.§!"
 DEBT_TITLE: "Debt"
