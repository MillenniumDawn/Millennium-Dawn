 nsb_multiple_atgm_tech_1: "Support quadruple d'ATGM de 1ère génération"
 nsb_multiple_atgm_tech_1_desc: "Une nacelle quadruple d'ATGM (missile antichar guidé) désigne un système de lancement équipé de quatre missiles prêts à être tirés, améliorant la capacité d'une plateforme à engager plusieurs cibles blindées en succession rapide. De telles configurations sont souvent intégrées dans divers véhicules militaires, y compris les véhicules de transport de troupes blindés et les véhicules de combat d'infanterie, pour renforcer leur efficacité antichar."
