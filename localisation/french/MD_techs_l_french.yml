 module_ciws_7: "CIWS VII"
 module_ciws_7_desc: "Les systèmes d'armes rapprochées hyperavancés représentent le degré extrême de sophistication de la défense ponctuelle, intégrant capteurs hyperavancés, ciblage assisté par IA et intercepteurs à réponse rapide pour vaincre même les menaces de missiles les plus avancées.\n\n§GIndice du concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais ajoute un coût de production, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de points de vie. Utile contre les menaces aériennes et missiles, mais ajoute coût de production, carburant, effectifs et visibilité de surface.§!"
 module_ciws_8: "CIWS VIII"
 module_ciws_8_desc: "Les systèmes d'armes rapprochées ultra-avancés représentent le pinacle de la défense ponctuelle, intégrant capteurs ultra-avancés, ciblage assisté par IA et intercepteurs à réponse rapide pour vaincre même les menaces de missiles les plus avancées.\n\n§GIndice du concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais ajoute un coût de production, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de points de vie. Utile contre les menaces aériennes et missiles, mais ajoute coût de production, carburant, effectifs et visibilité de surface.§!"
 module_naval_adl_5: "Laser de défense ponctuelle V"
 module_naval_adl_5_desc: "Les lasers de défense rapprochée offrent une réponse rapide et précise contre drones et missiles entrants, engageant les cibles à la vitesse de la lumière et sans les contraintes de rechargement des intercepteurs conventionnels.\n\n§GIndice du concepteur : les lasers de défense rapprochée offrent une forte DCA et un fort blindage pour la protection à courte portée. Utile contre les menaces aériennes et missiles avancées, mais coûtent plus de CI et consomment plus de carburant que la défense rapprochée conventionnelle.§!"
 module_railgun_5: "Railguns V"
 module_railgun_5_desc: "La technologie de canon électromagnétique hyperavancée représente une percée dans la puissance de feu navale, délivrant des projectiles hypersoniques très précis avec une charge logistique minimale et un potentiel destructeur inégalé.\n\n§GIndice du concepteur : les canons électromagnétiques offrent une forte attaque de canon et une forte perforation de canon pour le bombardement côtier et les engagements contre navires blindés. Utile lorsque la perforation compte, mais coûtent plus de CI et de ressources stratégiques que les canons conventionnels.§!\n§GIndice concepteur : les canons électromagnétiques offrent une forte attaque de canons et une forte perforation de canons pour le bombardement côtier et les engagements contre navires blindés. Utiles lorsque la pénétration compte, mais coûtent plus de CI et de ressources stratégiques que les canons conventionnels.§!"
 module_railgun_6: "Railguns VI"
 module_railgun_6_desc: "La technologie de canon électromagnétique ultra-avancée représente une percée dans la puissance de feu navale, délivrant des projectiles hypersoniques très précis avec une charge logistique minimale et un potentiel destructeur inégalé.\n\n§GIndice du concepteur : les canons électromagnétiques offrent une forte attaque de canon et une forte perforation de canon pour le bombardement côtier et les engagements contre navires blindés. Utile lorsque la perforation compte, mais coûtent plus de CI et de ressources stratégiques que les canons conventionnels.§!\n§GIndice concepteur : les canons électromagnétiques offrent une forte attaque de canons et une forte perforation de canons pour le bombardement côtier et les engagements contre navires blindés. Utiles lorsque la pénétration compte, mais coûtent plus de CI et de ressources stratégiques que les canons conventionnels.§!"
 module_ram_7: "RAM VII"
 module_ram_7_desc: "Les plateformes RAM hyperavancées représentent l'apogée de la défense ponctuelle à missiles, intégrant systèmes de guidage de pointe, résistance accrue aux contre-mesures et capacités d'engagement rapide pour vaincre les menaces aériennes les plus avancées.\n\n§GIndice du concepteur : les systèmes RAM offrent une forte DCA et un fort blindage pour la défense rapprochée tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et de main-d'œuvre que les défenses à canons.§!\n§GIndice concepteur : les systèmes RAM offrent une forte DCA et du blindage pour la défense de point tout en ajoutant quelques points de vie. Utiles contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et d'effectifs que les défenses à canons.§!"
 module_ram_8: "RAM VIII"
 module_ram_8_desc: "Les plateformes RAM ultra-avancées représentent l'apogée de la défense ponctuelle à missiles, intégrant systèmes de guidage de pointe, résistance accrue aux contre-mesures et capacités d'engagement rapide pour vaincre les menaces aériennes les plus avancées.\n\n§GIndice du concepteur : les systèmes RAM offrent une forte DCA et un fort blindage pour la défense rapprochée tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et de main-d'œuvre que les défenses à canons.§!\n§GIndice concepteur : les systèmes RAM offrent une forte DCA et du blindage pour la défense de point tout en ajoutant quelques points de vie. Utiles contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et d'effectifs que les défenses à canons.§!"
 module_torpedoes_7: "Torpilles ASW VII"
 module_torpedoes_7_desc: "Les torpilles ASM hyperavancées représentent le pinacle de la technologie de lutte anti-sous-marine, intégrant guidage assisté par IA, vitesse extrême et systèmes avancés de contre-contre-mesures pour dominer les champs de bataille sous-marins modernes.\n\n§GIndice du concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins après détection. Utile sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et de main-d'œuvre sans aider contre les navires de surface.§!\n§GIndice concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins une fois détectés. Utiles sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et d'effectifs sans aider contre les navires de surface.§!"
 module_torpedoes_8: "Torpilles ASW VIII"
 module_torpedoes_8_desc: "Les torpilles ASM ultra-avancées représentent le pinacle de la technologie de lutte anti-sous-marine, intégrant guidage assisté par IA, vitesse extrême et systèmes avancés de contre-contre-mesures pour dominer les champs de bataille sous-marins modernes.\n\n§GIndice du concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins après détection. Utile sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et de main-d'œuvre sans aider contre les navires de surface.§!\n§GIndice concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins une fois détectés. Utiles sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et d'effectifs sans aider contre les navires de surface.§!"
