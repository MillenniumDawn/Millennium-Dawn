 APC_9: "APC 2045"
 APC_9_desc: "Armored Personnel Carriers are armored vehicles designed to carry a squad of soldiers into battle, which then dismount and fight on foot. They offer protection for the soldiers, but usually have limited offensive capabilities of their own. Infantry being carried by APCs are called Mechanized Infantry."
 APC_10: "APC 2055"
 APC_10_desc: "Armored Personnel Carriers are armored vehicles designed to carry a squad of soldiers into battle, which then dismount and fight on foot. They offer protection for the soldiers, but usually have limited offensive capabilities of their own. Infantry being carried by APCs are called Mechanized Infantry."
