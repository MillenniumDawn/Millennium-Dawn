 STALKER.100.t: "Get Out of Here, Stalker"
 STALKER.100.d: "A conscript at a Cordon checkpoint was filmed shouting at a stalker to get out of here. The clip is everywhere, and half the country now says it to each other at bus stops."
 STALKER.100.a: "Put it on the recruitment posters."
 STALKER.100.b: "Remind the checkpoint to shout less and patrol more."
 STALKER.100.b_tt: "The Zone gains §G2§! §Ycontainment§!."
 STALKER.101.t: "Cheeki Breeki"
 STALKER.101.d: "Bandits in the Cordon have adopted a battle cry that nobody can translate, and a folk song that nobody can get out of their heads. Recruitment is up."
 STALKER.101.a: "Iv damke."
 STALKER.101.a_tt: "§YBandit§! influence in the Zone has already risen by §R5§!."
 STALKER.102.t: "Another Strelok"
 STALKER.102.d: "A stalker at the Bar has announced that he is the legendary Strelok. He is the third this month. Curious visitors are arriving to see which one is real."
 STALKER.102.a: "How many Streloks are there?"
 STALKER.102.a_tt: "The Zone has already gained §Y5§! stalkers."
 STALKER.103.t: "The Trader Raises His Prices"
 STALKER.103.d: "The old trader in the bunker at the Cordon has doubled what he charges our scientists for sausage, vodka and anti-radiation drugs, and insists he is losing money on every deal."
 STALKER.103.a: "Pay him. Nobody else stocks the good vodka."
 STALKER.103.a_tt: "The treasury loses §R$0.1§! billion."
 STALKER.103.b: "Shut the bunker down."
 STALKER.103.b_tt: "The Zone loses up to §G5§! §YBandit§! influence and up to §R5§! stalkers who relied on him."
 STALKER.105.t: "A Hello from Alice"
 STALKER.105.d: "A survey team on the Lake Mungo lunettes dug a phone and a necklace out of the sand, buried long before the Zone and somehow still charged. Its last video, shot at night on the dry lakebed by a teenage girl, shows a figure walking toward her out of the dark; enhanced, the footage shows it wearing her own face, grey and drowned. The phone belonged to a girl called Alice, its call log stops in 2008, and the screen holds one unsent message: hello."
 STALKER.105.a: "File the footage. Keep listening."
 STALKER.105.a_tt: "No cost. The file stays open, and she will try again."
 STALKER.105.b: "Authorize a supervised contact."
 STALKER.105.b_tt: "Costs §R25§! Political Power. Zone §Yexploitation§! rises by §G5§! and §Yactivity§! by §R5§!. She will remember it."
 STALKER.105.c: "Close the lunettes to survey teams."
 STALKER.105.c_tt: "Zone §Ycontainment§! rises by §G5§! and §Yexploitation§! falls by §R3§!. She will remember that too."
 STALKER.106.t: "Someone Still Wants to Say Hello"
 STALKER.106.d_observed: "Last night the phone in our evidence locker rang, and the caller ID showed its own number. The analyst on duty says a girl asked whether anyone was still listening. She sounded pleased when he said yes."
 STALKER.106.d_contact: "Since the supervised contact, survey teams keep finding fresh footprints that lead into the dry lake and stop. Last night the phone recorded a new video. Alice stands at the edge of our perimeter lights, waving at the camera."
 STALKER.106.d_restricted: "The lunettes have been closed for months, but the phone is no longer in the evidence locker. A patrol found it back on the dunes, face up and recording. It holds one new message, saying she only wanted to say hello."
 STALKER.106.a: "Say hello back."
 STALKER.106.a_tt: "Zone §Yexploitation§! rises by §G5§! and §Yactivity§! by §R5§!."
 STALKER.106.b: "Close the file for good."
 STALKER.106.b_tt: "Zone §Ycontainment§! rises by §G5§! and §Yactivity§! falls by §G5§!."
