 ishrael.53.t: "Israel aprova a Lei de Repatriação e Financiamento Libanesa"
 ishrael.54.t: "Herzog Apresenta ao Governo uma Declaração de Retirada"
 ishrael.55.t: "What to do with with Ansar Prison?"
 ishrael.56.t: "Últimos Soldados Abandonam o Cinturão de Segurança"
 ishrael.57.t: "Os Sionistas Abandonam sua Chamada Zona Segura"
 ishrael.58.t: "O Knesset Debate a Lei de Reconhecimento e Memorial Armênio"
 ishrael.59.t: "Ehud Barak Desdenha Legisladores Israelenses sobre o Reconhecimento do Genocídio"
 ishrael.6.t: "O Knesset Israelense Reconhece o Genocídio Armênio"
 ishrael.61.t: "Legisladores de Israel Reconhecem os Eventos de 1916 como Genocídio"
 ishrael.62.t: "Barak Propõe uma Reunião Tripartite em Camp David"
 ishrael.63.t: "A Eleição Especial para Primeiro-Ministro de 21"
 ishrael.63.d: "Quando Ehud Barak voltou de Camp David declarando que não havia parceiro para negociações, a coalizão de Barak, com apenas um ano de existência, desmoronou. O partido ultraortodoxo Shas só entrou por causa de promessas relativas ao sistema educacional, mas disputas entre o Ministro da Educação Yosi Sarid e seu vice-ministro do Shas, Naharri, levaram-nos a abandonar o barco enquanto o Primeiro-Ministro preparava sua chegada a Camp David. Enquanto isso, o Meretz, sob Sarid, só concordou em permanecer na coalizão enquanto as negociações de paz continuassem, e o fracasso de Barak em Camp David fez com que eles também saíssem. Barak realmente não tinha outra escolha senão convocar uma eleição especial de confiança para o cargo de Primeiro-Ministro, com um Likud ressurgente ameaçando derrubar o homem que prometeu um \"Alvorecer de um Novo Dia\", mas que principalmente trouxe os horrores da Intifada para o coração do próprio Israel."
 ishrael.63.a: "Dar confiança a Barak para terminar seu mandato."
 ishrael.63.b: "Confiar ao Likud a estabilização da situação."
 ishrael.63.c: "Reeleger Benjamin Netanyahu para o cargo de Primeiro-Ministro."
 ishrael.7.t: "O Shas Deixa a Coalizão de Governo de Ehud Barak"
 ishrael.71.t: "Debates de Netanyahu Antes das Primárias"
 ishrael.71.a: "Netanyahu concorre e obtém a indicação com facilidade."
 ishrael.71.b: "Netanyahu recusa a indicação, permitindo que Sharon vença."
 ishrael.15.t: "Reação Árabe à Visita de Sharon ao Monte do Templo"
 ishrael.15.d: "Após a visita de Sharon ao Monte do Templo, várias nações árabes estão furiosas. Especificamente, Tunísia, Omã, Bahrein, Catar e Marrocos prometeram um afrouxamento dos laços diplomáticos, o que sem dúvida nos deixará mais isolados no cenário local."
 ishrael.15.a: "Maldição!"
 ishrael.151.t: "A Visita de Sharon ao Monte do Templo"
 ishrael.151.d: "O político israelense Ariel Sharon visitou o Monte do Templo, um local sagrado em Jerusalém. Diplomatas de várias nações do Oriente Médio condenaram a decisão, prometeram repercussões diplomáticas e nos incentivaram a fazer o mesmo."
 ishrael.151.a: "Parece que não temos outra escolha."
 ishrael.152.t: "A Visita de Sharon ao Monte do Templo"
 ishrael.152.d: "O político israelense Ariel Sharon visitou o Monte do Templo, um local sagrado em Jerusalém. Diplomatas de várias nações do Oriente Médio condenaram a decisão, prometeram repercussões diplomáticas e nos incentivaram a fazer o mesmo. Podemos romper completamente os laços ou manter alguma aparência de relações."
 ishrael.152.a: "Manter nossos acordos comerciais."
 ishrael.152.b: "Um absurdo!"
 ishrael.155.t: "Israel Renuncia ao Status Quo na Mesquita de Al-Aqsa"
 ishrael.156.t: "Colonos Judeus Rezam no Alto do Monte do Templo"
 ishrael.157.t: "Israel anula nossos direitos sobre a Mesquita de Al-Aqsa"
 ishrael.158.t: "Israel expulsa o Waqf Jordaniano de Al-Aqsa"
 ishrael.159.t: "Itamar Ben-Gvir Questiona Nossa Soberania!"
 ishrael.16.t: "Líderes Israelenses Reafirmam Reivindicações sobre a Terra Prometida"
 ishrael.161.t: "Lembrando a Promessa de Deus a Abraão"
 ishrael.162.t: "Os Julgamentos de Kaplan"
 israel_economy.62.t: "Israel Solicita Acesso para Espionagem"
 israel_economy.62.d: "Israeli officials have recently approached us on the matter of secret cooperation between us and and Israel. They propose a shaky deal on providing a safe haven for Mossad agents entering Iran. Should we agree?"
 israel_economy.62.a: "Sim"
 israel_economy.62.b: "Não"
 israel_economy.63.t: "Eles aceitaram a nossa oferta!"
 israel_economy.63.d: "O Mossad agora usará o território deles como base para entrar no Irã."
 israel_economy.63.a: "Ótimo!"
 israel_economy.64.t: "Eles recusaram a nossa oferta!"
 israel_economy.64.d: "Eles não querem ter qualquer ligação com tais tramas."
 israel_economy.64.a: "Lamentável."
 israel.1.t: "Militares Israelenses Pós-Serviço Viajam para a Índia"
 israel.1.d: "Israel e Índia selaram um pacto significativo que permite que militares israelenses pós-serviço viajem para a Índia, com o objetivo de ampliar o intercâmbio cultural e as relações bilaterais. O acordo permite que o pessoal de defesa israelense que conclui seu serviço visite a Índia para fins de lazer e educação, ressaltando o compromisso das nações em fomentar o turismo e laços mais profundos além da cooperação em defesa. A medida marca um marco no fortalecimento das relações diplomáticas e econômicas, demonstrando a dedicação de ambos os países ao entendimento mútuo e à colaboração em diversas áreas."
 israel.1.a: "Ótimo!"
 ISR_strategy: "Devorar a Espada para Sempre"
 ISR_strategy_desc: "Quando o rei Saul perseguiu o jovem Davi até uma caverna em Ein Gedi, Abner, comandante de Saul, foi a Joabe, filho de Zeruia, perguntar: 'Devorará a espada para sempre?' O tempo provou que sim. Jerusalém, a cidade que Joabe conquistou para o rei Davi, é agora o coração de um Estado cercado por abutres. Por isso, permaneceremos com a espada a postos para sempre e atacaremos primeiro diante de qualquer sinal de ameaça."
 ACCEPTED_GOLAN: "Se esta opção for escolhida e a paz for acordada por ambos: O estado de Golã receberia 14000 pessoas adicionais, enquanto o estado da Galileia perderia 14000 pessoas. Os núcleos israelenses na Síria seriam perdidos e a Síria receberia o estado de Golã. O Ponto de Vitória em Golã seria chamado Quneitra, com valor de 5 Pontos de Vitória. O estado seria renomeado para Jawlan.\n"
 REJECTED_GOLAN: "Se esta opção for escolhida e a paz for acordada por ambos, os núcleos israelenses na Síria seriam perdidos e a Síria receberia o estado de Golã. O Ponto de Vitória em Golã seria chamado Quneitra, com valor de 5 Pontos de Vitória. O estado seria renomeado para Jawlan."
 ACCEPTED_GALILEE: "Se esta opção for escolhida e a paz for acordada por ambos: Golã receberia um aumento de infraestrutura.\n"
 NEUTRAL_GALILEE: "Se esta opção for escolhida, a província ao norte de Afula recebe 2 pontos de vitória extras.\n"
 REJECTED_GALILEE: "Se esta opção for escolhida e a paz for acordada por ambos: a Galileia receberia um aumento de infraestrutura.\n"
 ACCEPTED_HERMON: "Se esta opção for escolhida e a paz for acordada por ambos: Um Ponto de Vitória com valor de 5 Pontos de Vitória chamado \"Jabal al-Sheikh\".\n"
 REJECTED_HERMON: " Se esta opção for escolhida e a paz for acordada por ambos: Israel obteria acesso militar à Síria, e a Síria não poderia revogá-lo a menos que as duas entrem em guerra.\n"
 ACCEPTED_GOLANS: "Se esta opção for escolhida e a paz for acordada por ambos: Golã se tornaria desmilitarizado ao ser entregue à Síria.\n"
 NEUTRAL_TIES_GOLAN: "Se esta opção for escolhida e a paz for acordada por ambos: Nenhum efeito\n"
 ACCEPTED_SYRIA: "Se esta opção for escolhida, reduzirá bastante a influência síria sobre o Hezbollah, removerá toda a influência iraniana e do Hezbollah sobre a Síria, causará um redutor nas relações Síria-Hezbollah e Síria-Irã, e aumentará a opinião dos EUA sobre a Síria.\n"
 REJECTED_SYRIA: "Se esta opção for escolhida e a paz for acordada por ambos: Nenhum efeito\n"
 ACCEPTED_ELI_COHAN: "Se esta opção for escolhida e a paz for acordada por ambos: Israel teria uma opinião \"Recusou-se a devolver Eli Cohen\" junto à Síria.\n"
 REJECTED_ELI_COHAN: "Se esta opção for escolhida e a paz for acordada por ambos: Israel receberia um aumento de Poder Político e uma opinião positiva junto à Síria \"Devolveu Eli Cohen\".\n"
 REJECTED_GOLANS: "Se esta opção for escolhida e a paz for acordada por ambos: a Galileia se tornaria desmilitarizada.\n"
 US_HEIGHTS: "Colinas de [USA.GetLeader]"
 israel_news.1.t: "Suposto Alvo Nuclear na Síria é Atacado"
 israel_news.1.d: "Mais de dezessete toneladas de bombas foram detonadas sobre um local militar conhecido como 'Bustan', a sudeste de Dier Ezzor, no nordeste da Síria, no fim desta noite, bem ao lado do Eufrates. Embora muitas hipóteses tenham sido levantadas sobre o possível autor do ataque, analistas ocidentais apontaram Israel como o ator mais provável, devido a relatórios de inteligência que sugerem que o local é, de fato, um reator pertencente ao suposto programa nuclear secreto da Síria, construído com ajuda norte-coreana. Não está claro se os relatórios são verdadeiros ou não, nem em que medida a Administração dos EUA foi informada do ataque, mas, enquanto [SYR.GetLeader] age rapidamente para remover qualquer evidência que aponte para um programa nuclear, uma coisa é clara: vinte e seis anos após destruir o primeiro programa nuclear do Iraque, a Doutrina Begin continua sendo mantida pelos formuladores de políticas israelenses."
 israel_news.1.o1: "Missão Cumprida!"
 israel_news.1.o2: "Os sionistas podem inventar as histórias que quiserem."
 israel_news.1.o3: "Segurança Nacional de Israel Protegida."
 israel_news.1.o4: "Outra tentativa de autorredenção após a guerra."
 israel_news.1.o5: "O Imperialismo Sionista ataca mais uma vez."
 israel_news.1.o6: "Uma Mensagem Enviada ao Irã."
 israel_news.1.o7: "Histórias sujas contadas por imperialistas!"
 israel_news.2.t: "A Tomada de Gaza!"
 israel_news.2.d: "Um golpe ocorreu na Faixa de Gaza, levando ao poder na cidade o Hamas, grupo frequentemente rotulado por muitos como islâmico e extremista. Embora nem todos na região compartilhem essa posição, os governos israelense e palestino, bem como a comunidade internacional como um todo, estão preocupados com a situação e o futuro da região.\nUma nova guerra está chegando?"
 israel_news.2.o1: "Um Momento sem Precedentes."
 israel_news.3.t: "O Tratado de Jedá"
 israel_news.3.d: "Desde a assinatura dos Acordos de Abraão com os Emirados Árabes Unidos e o Bahrein, e a visita secreta de [ISR.GetLeader] a Jedá para se encontrar com o herdeiro do trono saudita, muitos se perguntavam se Riad seguiria os passos de Abu Dhabi e traria seus laços secretos com Israel à luz do dia. Hoje, isso finalmente aconteceu. Depois que [SAU.GetLeader] deu sua bênção a um tratado em troca de garantias militares americanas e concessões israelenses na questão palestina, [USA.GetLeader] convidou o Ministro das Relações Exteriores saudita e o Primeiro-Ministro israelense para assinar um tratado de paz oficial. Isso abre a porta para maior cooperação diante de ameaças compartilhadas em todo o Oriente Médio e do desejo saudita de usar os investimentos israelenses em alta tecnologia para diversificar sua economia."
 israel_news.3.o1: "O Grande Prêmio foi conquistado!"
 israel_news.3.o2: "Seguimos os Passos dos Antepassados."
 israel_news.3.o3: "Somos todos filhos de Abraão."
 israel_news.3.o4: "Nossos maiores parceiros regionais: unidos."
 israel_news.3.o5: "Ha! Chega de liderar o Mundo Muçulmano..."
 israel_news.3.o6: "Isso vai abalar o Oriente Médio até o âmago."
 israel_news.4.t: "[ISR.GetLeader] Ordena Ataques a Alvos Nucleares Iranianos"
 israel_news.4.d: "Sons de sirenes, explosões, cinzas e aviões caindo: foi o que milhões de iranianos em várias regiões do país viram e ouviram no fim desta noite. Israel, seja com apoio militar ou apenas com o conhecimento de Washington, atacou a República Islâmica com dezenas de aviões da IAF, mirando os alvos nucleares do país. Isso não deveria surpreender ninguém: há décadas Jerusalém ameaça com ação militar para impedir que o Irã jamais obtenha uma arma nuclear, de acordo com a Doutrina Begin e seguindo ações semelhantes contra a Síria e o Iraque. Mas esse ataque não ficaria sem resposta. Já centenas de milhares de civis israelenses entraram em abrigos e os sistemas antiaéreos foram colocados em alerta máximo, preparados para os milhares de mísseis diretos que inevitavelmente choverão sobre as cidades israelenses."
 israel_news.4.o1: "Não tínhamos outra escolha."
 israel_news.4.o2: "Um golpe devastador contra os Mulás."
 israel_news.4.o3: "O inimigo do meu inimigo é meu amigo."
 israel_news.4.o4: "Que os sionistas fujam para seus abrigos!"
 israel_news.4.o5: "Israel e Irã a caminho da guerra."
 israel_news.5.t: "Os Acordos de Genebra"
 israel_news.5.d: "Décadas se passaram desde a última vez que tanques israelenses e sírios se chocaram nas Colinas de Golã, e até desde a Conferência de Madri, onde diplomatas israelenses e sírios se reuniram pela primeira vez para discutir a paz, e hoje a história está sendo escrita. Diplomatas turcos e americanos anunciaram que as versões finais de um acordo abrangente foram aprovadas entre delegados de Damasco e Jerusalém, e autoridades do governo suíço preparam uma cerimônia com a presença de [ISR.GetLeader] e [SYR.GetLeader]. O tratado inclui principalmente disposições para que Israel se retire em grande parte das terras que tomou durante a Guerra dos Seis Dias, em troca de a Síria abandonar sua relação especial com atores externos dedicados à destruição de Israel, com plena normalização e troca de embaixadores."
 israel_news.5.o1: "O tratado de paz é finalmente assinado!"
 israel_news.5.o2: "Nossos esforços deram frutos."
 israel_news.5.o3: "Al-Jawlan finalmente voltou."
 israel_news.5.o4: "Traidores, Traidores, Traidores!"
 israel_news.5.o5: "Um Momento Histórico."
 israel_news.6.t: "A Aliança do Mediterrâneo Oriental"
 israel_news.6.d: "A corrida pelo controle dos campos de gás recém-descobertos no litoral do Mediterrâneo Oriental levou à formação de novas redes de alianças na região, culminando no recente tratado assinado em Larnaca entre [ISR.GetLeader], [CYP.GetLeader] e [GRE.GetLeader]. A Grécia, há muito vista como uma das nações mais hostis a Israel no que diz respeito à Questão Palestina, alinhou-se a Jerusalém para formar uma frente unida contra as exigências turcas no mar e para exportar gás israelense e talvez egípcio para a União Europeia. A Turquia reagiu com fúria, com [TUR.GetLeader] declarando que isso não a impediria de alcançar sua 'pátria azul' e declarando que ordenou a expulsão do embaixador de Israel em Ancara. A União Europeia, liderada pela França, saudou esses desdobramentos."
 israel_news.6.o1: "Permanecemos Unidos."
 israel_news.6.o2: "Uma Frente Unida contra a Turquia."
 israel_news.6.o3: "Uma aliança de abutres e traidores!"
 israel_news.6.o4: "Nossas portas estão abertas."
 israel_news.6.o5: "A competição se intensifica."
 israel_news.7.t: "Os Acordos de Ciro"
 israel_news.7.d: "Imagens verdadeiramente históricas foram registradas hoje em Jerusalém, do tipo que seria impossível imaginar anos atrás. Diplomatas do Governo Provisório Iraniano chegaram em um voo direto de Teerã ao Aeroporto Internacional Ben Gurion, de onde visitaram o Yad VaShem e depois seguiram ao Knesset, onde foi assinado um tratado que encerra o estado de guerra entre Israel e Irã que existia desde a Revolução Islâmica de 1979, incluindo a promessa de acabar com o apoio a grupos de resistência que se opõem ao outro e de estabelecer embaixadas nos países um do outro. Na esteira da Segunda Revolução do Irã, que terminou com a derrubada dos Mulás, este parece ser um marco crítico para restabelecer a forte aliança estratégica irano-israelense dos tempos de Reza Xá, e no espírito de Ciro, que libertou os judeus do cativeiro na Babilônia."
 israel_news.7.o1: "Vamos até eles com um ramo de oliveira."
 israel_news.7.o2: "Uma vitória diplomática!"
 israel_news.7.o3: "No espírito de Kourosh."
 israel_news.7.o4: "Mais um passo rumo à Paz no Oriente Médio."
 israel_news.8.t: "A Organização do Tratado do Oriente Médio"
 israel_news.8.d: "Notícias chocantes surgiram hoje de Israel. Nos últimos tempos, muitos Estados árabes abandonaram o boicote iniciado pela Liga Árabe na Conferência de Cartum em relação a Israel, se não abraçando, ao menos aceitando-o; pelo menos em nome de oportunidades econômicas, do medo de um vácuo de poder regional e de receios sobre inimigos globais comuns. Hoje, essa relação evoluiu de laços bilaterais para uma aliança oficial, assinada entre [ISR.GetLeader] e muitos ministros e estadistas árabes em Tel Aviv. O objetivo desta aliança é claro: criar uma arquitetura estratégica e política para o Oriente Médio numa era em que a projeção de poder americano na região está diminuindo, para equilibrar-se contra rivais comuns e pôr fim ao derramamento de sangue que a região viu por décadas. De fato, pode ser vista como uma vitória americana que facilita sua guinada para a Ásia para conter a influência de Pequim no Extremo Oriente."
 israel_news.8.o1: "Finalmente, verdadeiramente aceitos na região."
 israel_news.8.o2: "Que alívio!"
 israel_news.8.o3: "Que as armas finalmente se calem."
 israel_news.8.o4: "Provaram ser piores que os sionistas!"
 israel_news.8.o5: "Um desdobramento chocante."
 israel_news.9.t: "O Fórum do Negev"
 israel_news.9.d: "No luxuoso hotel 'Beresheet', em Mitzpe Ramon, não muito longe do túmulo de Ben Gurion, o fundador do Estado de Israel, vários ministros das Relações Exteriores árabes reuniram-se com o Secretário de Estado dos EUA e o Ministro das Relações Exteriores de Israel para iniciar um agrupamento político conhecido como 'Fórum do Negev', destinado a consolidar esforços em mudanças climáticas, combate ao terrorismo, agricultura, infraestrutura, alta tecnologia, esforços contra a salinização e muito mais. Os ministros concordaram em fazer das reuniões do fórum um evento anual, cada vez em uma área desértica diferente. Muitos observadores apontaram isso como o próximo passo dos Acordos de Abraão, indo além da simples normalização para uma aliança plena entre Israel e muitas das nações árabes sunitas moderadas ao seu redor. Não está claro se isso se consolidará em uma aliança militar plena, mas é um passo histórico nos esforços israelenses para garantir seu futuro no Oriente Médio."
 israel_news.9.o1: "Fazendo o deserto florescer."
 israel_news.9.o2: "Um Passo Histórico."
 israel_news.9.o3: "Nos passos de nossos antepassados."
 israel_news.9.o4: "Traidores!"
 israel_news.9.o5: "Desdobramentos interessantes."
 israel_news.10.t: "Israel Inicia Guerra Limitada na Síria"
 israel_news.10.d: "A intensificação da guerra civil na Síria levou a um vácuo de poder em muitas das áreas ainda mantidas pelo governo de Damasco, vácuo que Teerã passou a preencher. Embora apoiasse o regime sírio, o Irã aproveitou a oportunidade para instalar uma presença permanente de combatentes do Hezbollah, junto com outras milícias xiitas e lideradas pelo Corpo da Guarda Revolucionária Islâmica, na Síria, como base para expandir a influência iraniana e a revolução e para o 'dia do comando' contra Israel. No entanto, segundo fontes estrangeiras, formuladores de políticas israelenses informaram seus homólogos europeus e americanos de que Jerusalém não pode ficar parada e permitir que a Síria 'se torne um Segundo Líbano', e por isso preparam 'todas as opções sobre a mesa'. Fontes estrangeiras apontam uma possível campanha aérea contra alvos de milícias iranianas em todo o país, evitando alvos do regime para não serem vistos como intervindo abertamente na guerra civil."
 israel_news.10.o1: "O Conflito Sírio se intensifica."
 israel_news.10.o2: "Eles Não Passarão!"
 israel_news.10.o3: "A Conspiração Sionista se revela!"
 israel_news.10.o4: "Que violação da soberania síria."
 israel_news.10.o5: "Abriremos a Frente de Golã!"
 israel_news.10.o6: "Observaremos com interesse."
