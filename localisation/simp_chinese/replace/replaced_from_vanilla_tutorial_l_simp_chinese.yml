l_simp_chinese:
 tut_2_text_1: "很好！既然你已经解决了警报，是时候投入战争之中了。意大利开局便与埃塞俄比亚处于战争状态，只要你耐心学习，他们完全构不成任何问题。\n\n将镜头向东南方向移动，直到你找到非洲的厄立特里亚为止。当你的镜头在正确的地方后，按住§G左键§!拖曳§Y选中§!$STATE|Y$地区的旅。"
 tut_3_text_1: "干得漂亮！现在你将要学习如何计划一次进攻。\n\n可以将多个旅组成§Y军§!。军可以绘制作战计划，你可以派遣一位§Y指挥官§!来带领他们。"
 tut_3_text_2: "当已选中陆军旅时，点击屏幕底部的§Y新建军§!按钮。对南方位于§Y索马里兰§!的单位也进行相同的操作。"
 tut_5_text_1: "很好！埃塞俄比亚现在有一条§Y前线§!了。但想要让你的军队通过§Y战争计划§!进行进攻的话，你还需要绘制一个§Y进攻指令§!。\n\n点击§Y进攻线§!按钮然后保持§G右键§!，并在两个高亮省份拖移。对南方位于§Y索马里兰§!的旅也进行相同的操作。"
 tut_11_text_1: "你的军队将会向埃塞俄比亚的首都，亚的斯亚贝巴进军。当你占领足够的领土后，他们就会投降。\n\n按下£SPACE 来§Y继续§!游戏。你可以按£KP_PLUS 键或者£KP_MINUS 键来调整游戏速度。比起一直使用一个速度，玩家大多数时候回根据情况的不同调整游戏速度。\n\n提示：如果你更喜欢手控制单位，选择一个旅然后§G右键点击§!省份来覆盖作战计划的指令。"
 tut_13_text_1: "你获得了胜利！战争结束了，埃塞尔比亚是最终的失败者。\n\n在和平时期你或许想要§Y转移士兵§!带海洋的另一边来将他们部署到不同的地方，或者为新的战争做准备。\n\n既然埃塞尔比亚已经被击败，这里再不需要这么多旅了。\n\n选择至少§Y4个旅§!并§G右键点击§!将他们移动到§Y高亮的港口§!省份。"
 TUT_QUEUE_DIV: "一个§L旅§!在队列中等待部署"
 TUT_SELECTED_DIVS: "选中部署在$STATE$的$NUMBERS$个旅"
 TUT_TROOPS_IN_PORT: "$NUMBERS$个旅正位于$STATE$的港口"
 TUT_TROOPS_IN_TRANSIT: "$NUMBERS$个旅正被运往一个位于$COUNTRY$的港口"
 BUTTON_WIKI_DIVISION_TEMPLATES: "在HOI4维基上阅读关于§H旅模板§!的条目！"
 HINT_ARMY_PLANNER_TEXT_1_1: "这是§Y招募与部署§!界面，你可以创建陆军旅训练队列，并在之后进行部署。我们建议你在队列中添加一个§Y步兵旅§!。\n\n训练中的陆军旅首先会尝试获得所需的§Y装备§!。当其获得装备后，将会开始训练。训练进度永远无法超过装备进度。\n\n点击§Y训练§!按钮添加一个陆军旅进行训练。"
 HINT_ARMY_PLANNER_TEXT_1_2: "当陆军旅完成训练后，他们可被§Y部署§!至§Y你选择的地点§!。你只能在你的核心领土部署陆军旅。"
 HINT_ARMY_PLANNER_TEXT_2: "旅可以被顺序或并列建造。\n\n被并列训练的旅会以同样的速率获得§Y装备§!。所以他们都会在大致相同的时间完成。当一个旅获得了所有需要的装备并完成了全部训练，他们就会被部署到你选择的位置。\n\n点击§Y添加单位§!来增加并列训练的旅。\n\n当战况不利于你的时候，也许在旅§Y获得所有装备和训练前§!就部署更为有利。当然如果可以，这应当被避免。\n\n你可以在《钢铁雄心IV》维基读到更多关于应该招募什么旅的信息。"
 HINT_DIVISION_DESIGNER: "提示：旅编成界面"
 HINT_DIVISION_DESIGNER_NOXP_TEXT: "这是§Y旅编成界面§!，在这里你可以新建或编辑§Y旅编制§!。新建或编辑旅编制需要消耗£army_experience §Y陆军经验§!。陆军经验可通过单位与敌军交战或陆军演习获得。经验等级1-§Y乌合之众§!的单位不产生£army_experience 陆军经验。\n\n在你能新建或编辑旅编制前你需要更多的£army_experience 陆军经验。"
 HINT_DIVISION_DESIGNER_XP_TEXT: "这是§Y旅编成界面§!，在这里你可以新建或编辑§Y旅编制§!。新建或编辑旅编制需要消耗£army_experience §Y陆军经验§!。陆军经验可通过单位与敌军交战或陆军演习获得。经验等级1-§Y乌合之众§!的单位不产生£army_experience 陆军经验。\n\n对于你的第一次编制编辑，我们建议你点击支援连那一列的空位，向你的旅添加 £unit_artillery_icon_small §Y火炮支援连§!。完成添加后，点击§Y保存§!。你所有使用该编制的旅从现在起会需要火炮§Y装备§!。"
 HINT_EDIT_TEMPLATE_TEXT: "你正在生产并没有被任何§Y旅编制§!用到的装备。而你也拥有足够的£army_experience §Y陆军经验§!来做点什么。\n\n点击§YDivisione di Fanteria§!或其他单位边上的§Y编辑§!。"
 HINT_LOGISTICS_TEXT: "这是§Y后勤§!界面。这个界面的目的是帮助你查看生产速度是否跟得上消耗。\n\n如果你认为某型§Y装备§!生产过多，也许减少该型号装备§Y生产线§!上的工厂数量会是一个好主意。\n\n你的陆军旅§Y补给§!是否充足对战场胜利至关重要。你可以切换至§Y补给地图模式§!£GFX_F4 查看补给状态。"
 HINT_LOGISTICS_TEXT_2: "补给由£GFX_capital_hub_texticon §Y补给首都§!集散并通过£GFX_train_texticon §Y火车§!或£GFX_convoy_texticon §Y运输船§!运输至不同省份的£GFX_supply_hub_texticon §Y补给中心§!或£GFX_naval_supply_hub_texticon §Y海军基地§!。\n\n随后补给将分发至补给中心范围内的野战陆军旅。你可通过选中£GFX_supply_hub_texticon §Y补给中心§!并按住£GFX_shift 来查看补给距离。距离可被使用£GFX_unit_motorized_icon_small §Y卡车§!的摩托化程度影响。\n\n效率进一步受到£GFX_railways_texticon §Y铁路§!和£GFX_naval_supply_hub_texticon §Y海军基地§!等级，缺乏£GFX_train_texticon §Y火车§!及敌军空袭影响。这会产生一些§R瓶颈§!。瓶颈可通过升级到补给首都的铁路、提供战斗机防空及保证有足量火车来缓解。补给可用情况在§Y补给地图模式§!£GFX_F4 中显示。"
 HINT_NO_TEMPLATE_NO_XP_TEXT: "你点击了§Y没有编制警告§!。别紧张，点击警告寻找答案是一件很好的事，他们在这里就是为了帮你。\n\n最可能的情况是，你创建了一条火炮生产线，然而当前，你没有一个§Y旅§!的§Y单位编制§!会使用这个装备。\n\n当你获得更多的£army_experience §Y陆军经验§!后，你可以修改你的旅编制来增加火炮。£army_experience 陆军经验可以通过战斗或演习来获取。\n\n现在你可以忽略这个警告，教程会在你获得更多的£army_experience 陆军经验后帮助你。"
 HINT_NO_TEMPLATE_HAVE_XP_TEXT: "你点击了§Y没有编制警告§!，这个警告告诉你，你正在生产没被使用的装备。\n\n为了让你的旅使用新型装备，你需要修改他们的§Y旅编制§!。编辑旅编制消耗 £army_experience  §Y陆军经验§!。\n\n前往§Y招募与部署§!界面选择单位编制来§Y编辑§!。\n\n在这个警告上悬浮鼠标弹出说明框，你可以看到你正在生产哪些没被用到的装备。"
 HINT_OFFICER_CORPS_SCREEN_TEXT_2: "理论家降低注重整体战略的陆军、海军和空军§Y学说§!花费。学说为各军种设计，提供陆军旅、海军舰队和空军联队提供加成。"
 HINT_OCCUPIED_TERRITORIES_SCREEN: "示意：占领地区"
 HINT_OCCUPIED_TERRITORIES_SCREEN_TEXT: "为了镇压抵抗并监管人群，占领地区需要军队驻扎进行管制。游戏中的驻军代表了这一点，驻军可通过点击左上角国旗打开的§Y政治界面§!中的§Y占领地区§!标签指派。\n\n驻军部队在地图上不可见，且自动分配并获得装备。装备的分配可通过§Y招募与部署§!标签设置。"
 HINT_SELECT_UNIT_TEXT: "是时候向§Y埃塞俄比亚§!开战了。你应该先创建一个带进攻命令的作战计划来给你的部队下达指令。\n\n在§Y厄立特里亚§!地区§Y选择高亮部队§!。"
 HINT_LOW_SUPPLY_TEXT_1: "单位需要补给保持战斗力。补给从£GFX_capital_hub_texticon §Y补给首都§!出发，通过£GFX_train_texticon §Y火车§!或£GFX_convoy_texticon §Y运输船§!运送至不同省份中的£GFX_supply_hub_texticon §Y补给中心§!或£GFX_naval_supply_hub_texticon §Y海军基地§!。\n\n然后，补给中心将补给分配至补给范围内的旅。你可以选中一个£GFX_supply_hub_texticon §Y补给中心§!并长按£GFX_shift来查看补给范围。§Y摩托化优先度§!能提高补给中心的范围，即你的旅能收到补给的范围。这将使用£GFX_unit_motorized_icon_small §Y卡车§!。"