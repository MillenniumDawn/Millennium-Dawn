l_english:
  # Categories
 RAJ_PAK_border_conflict_category: "Indo-Pakistan Border Conflict"
 RAJ_PAK_border_conflict_category_desc: "The Kashmir conflict is a longstanding territorial dispute between India and Pakistan over the region of Jammu and Kashmir, dating back to the partition of British India in 1947. It has led to several wars, including the Indo-Pakistani wars of 1947-48, 1965, and 1999, and to constant border skirmishing and insurgency since. India administers the majority of Jammu and Kashmir, including the contested Kashmir Valley; Pakistan holds Azad Kashmir and Gilgit-Baltistan. Sustained escalation along the Line of Control, the Punjab plains, the Thar desert, or the Rann of Kutch can tip into a full diplomatic crisis with the risk of open war. \n\n§YOur readiness:§! [?THIS.border_readiness]\n§YCurrent tension:§! [?global.border_tension]\n§YOur current progress:§! [?THIS.border_war_progress]"
 RAJ_CHI_border_conflict_category: "Sino-Indian Border Conflict"
 RAJ_CHI_border_conflict_category_desc: "The Sino-Indian border dispute covers the contested frontier between India and China, spanning Aksai Chin in the west, the Himalayas (Sikkim/Arunachal Pradesh) in the centre and east, and Ladakh in between. Decades of failed negotiations have left the Line of Actual Control as the de facto border, and skirmishes at Galwan, Nathu La and the McMahon Line have recurred with no permanent resolution. \n\n§YOur readiness:§! [?THIS.border_readiness]\n§YCurrent tension:§! [?global.border_tension]\n§YOur current progress:§! [?THIS.border_war_progress]"

  # Tooltips
 border_war_increase_readiness_TT: "§GThis will increase our readiness§!"
 border_war_increase_tension_TT: "§YThis will increase border tension§!"
 border_war_tension_TT: "Tension is 80 or higher"
 border_war_readiness_TT: "Our readiness is above 60"
 border_war_not_attacking_TT: "Currently attacking or preparing an attack"
 border_war_progress_TT: "80 or more conflict progress"
 border_war_progress_50_TT: "50 or more conflict progress"
 border_war_negotiate_opinion_TT: "Requires both sides to have an opinion of each other of 25 or higher"
 border_war_negotiate_tension_TT: "§GThis will reduce border tension by 25§!"
 border_war_tension_90_TT: "Tension is 90 or higher"
 border_war_mobilization_unlocks_TT: "Requires our forces to be under general mobilization"
 border_war_stand_down_TT: "§GThis will reduce border tension by 30 and end the crisis§!"
 border_war_settlement_hint_TT: "§GLasting calm along the border has opened the way to a permanent settlement§!"
 border_war_reject_risk_TT: "§RRejection risks a limited war over the disputed territory§!"

  # Idea
 border_war_fortification_idea: "Border Fortification"
 border_war_fortification_idea_desc: "Following our territorial losses we have begun to shore up our remaining border positions."
 border_war_mobilization_idea: "General Mobilization"
 border_war_mobilization_idea_desc: "We have placed our forces along the border on a war footing in response to the ongoing crisis."

  # Negotiate decision
 border_negotiate_pak_raj: "Negotiate With Pakistan"
 border_negotiate_pak_raj_desc: "Diplomatic overtures can de-escalate border tensions if both sides are willing to step back from the brink."
 border_negotiate_chi_raj: "Negotiate With China"
 border_negotiate_chi_raj_desc: "Diplomatic overtures can de-escalate border tensions if both sides are willing to step back from the brink."

  # Crisis decisions
 border_war_general_mobilization: "Order General Mobilization"
 border_war_general_mobilization_desc: "Place our forces along the border on a war footing so we can back up our demands with force if talks fail."
 border_war_issue_ultimatum: "Issue an Ultimatum"
 border_war_issue_ultimatum_desc: "Demand that the disputed territory be handed back within days, backed by the threat of a limited war if it is not."
 border_war_stand_down: "Stand Down From the Crisis"
 border_war_stand_down_desc: "Pull our forces back from the brink and let the crisis run down, at some cost to our standing at home."

  # Training and tension decisions
 prepare_army_training: "Conduct Army Exercises"
 prepare_army_training_desc: "Run infantry exercises along the contested border. Raises our readiness for follow-on border operations at the cost of equipment and command power."
 prepare_mech_army_training: "Conduct Mechanized Training"
 prepare_mech_army_training_desc: "Run combined-arms drills with our mechanized forces. Provides a larger readiness boost than infantry training, but consumes more equipment."
 prepare_arty_army_training: "Conduct Artillery Training"
 prepare_arty_army_training_desc: "Calibrate and drill our artillery batteries near the border. Smaller readiness gain, low cost."
 prepare_attack: "Prepare Infantry Attack"
 prepare_attack_desc: "Ramp up front-line activity and infiltration to raise border tension. Tension is shared across both sides, so it enables operations against any contested neighbour."
 prepare_shelling: "Prepare Artillery Shelling"
 prepare_shelling_desc: "Stage provocations with our artillery to raise border tension. Use this instead of infantry raids if we want to avoid committing ground forces."
 extort_xp: "Learn From The Conflict"
 extort_xp_desc: "Convert the lessons of recent border combat into formal army training. Only available after our forces have actually fought in a border war."
 prepare_army_training_china: "Conduct Army Exercises"
 prepare_army_training_china_desc: "Run infantry exercises along the contested border. Raises our readiness for follow-on border operations at the cost of equipment and command power."
