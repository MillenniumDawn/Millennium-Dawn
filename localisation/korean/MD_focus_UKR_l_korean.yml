 UKR_develop_2s22: "§Y2S22 '보흐다나'§! 자주포 체계 개발"
 UKR_develop_2s22_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_2s22_for_tooltip\n\n\n\n\n\n\n\n\n§W2S22 '보흐다나'는 크라마토르스크 중공작기계 공장이 우크라이나군에 NATO 표준의 현대적 포병 능력을 제공하기 위해 개발한 우크라이나의 155mm 자주 곡사포입니다.\n이 체계는 바퀴형 차체에 탑재되어 높은 작전 기동성을 제공하고, 적에게 사격한 뒤 사격 진지를 신속히 바꿀 수 있게 합니다.\n155mm 포는 표준 NATO 포병 탄약을 사용할 수 있어 우크라이나 포병 부대가 이용할 수 있는 사거리와 화력이 크게 늘어납니다.\n자동화된 사격 통제 및 항법 체계 덕분에 승무원은 사격 제원을 신속히 산출하고 더 높은 정확도로 표적을 공격할 수 있습니다.\n'보흐다나'의 개발은 우크라이나 포병 현대화와 NATO 표준 무기 체계로의 전환에 있어 중요한 한 걸음입니다.\n\n§G특히 중요한 군사 사업:§! 완료되면 §Y최고라다§!가 더 높은 군사 예산을 승인할 의향이 커질 것입니다.§!"
