 GER_idea_DASA: "DASA"
 GER_idea_NL_Cooperation: "독일-네덜란드 군사 협력"
 GER_idea_NL_Cooperation_desc: "독일-네덜란드 군사 협력은 냉전기의 필요에서 뿌리를 둔 유럽에서 가장 강력한 방위 협력 관계 중 하나입니다. 그 이후 양국은 군사 교리와 장비를 일치시켜 원활하게 함께 작전할 수 있는 능력을 높였습니다. 1995년 독일-네덜란드 군단의 창설로 이 관계는 확고해졌고, 여러 나토 임무에 성공적으로 참여한 합동 병력이 만들어졌습니다. 2000년대 초에는 훈련 동기화, 장비 표준화, 대공 방어 같은 군사 기능의 통합 노력이 이 협력을 더욱 심화시켰습니다. 이 협력 관계는 계속해서 유럽 방위의 모범 역할을 하며 양국이 나토의 집단 안보 노력에서 핵심 참여국으로 남도록 보장합니다."
 GER_neuer_markt_idea: "노이어 마르크트"
 GER_neuer_markt_idea_desc: "1997년에 설립된 노이어 마르크트는 젊고 혁신적인 기업, 특히 기술 및 생명공학 분야 기업을 위한 증권 시장 부문을 만들려는 독일의 시도였습니다. 미국의 나스닥을 본떠 만든 노이어 마르크트는 고성장의 미래 지향적 기업들이 기업공개(IPO)를 통해 자본에 접근할 수 있는 플랫폼을 제공하는 것을 목표로 했습니다. 이는 독일 금융 시장을 현대화하고 기업가 정신을 장려하며 유럽의 혁신을 촉진하는 중요한 걸음으로 여겨졌습니다. 기존 거래소에 비해 완화된 상장 요건 덕분에 노이어 마르크트에는 수많은 스타트업이 몰렸고, 투자자들에게 호황을 누리는 인터넷 및 기술 산업에 참여할 기회를 제공했습니다. 기술 발전이 전통적인 사업 모델을 혁신할 것으로 기대되던 신경제의 상징이 되는 데는 오래 걸리지 않았습니다."
 GER_neuer_markt_colapse: "노이어 마르크트의 붕괴"
 GER_neuer_markt_colapse_desc: "그러나 노이어 마르크트를 둘러싼 낙관론은 오래가지 못했습니다. 2000년대 초 닷컴 버블이 터졌고, 상장된 많은 기업들은 높은 기대에 부응하지 못했습니다. 고평가된 주식, 부실한 기업 지배구조, 지속 가능한 사업 모델의 부재로 투자자 신뢰가 곤두박질쳤습니다. 한때 유망했던 노이어 마르크트는 투기, 변동성, 금융 불안정의 동의어가 되었습니다. 2000년의 정점에서 시장은 기업들의 파산이나 상장 폐지로 가치의 90% 이상을 잃었습니다. 2003년에 이르러 노이어 마르크트는 완전히 폐쇄되었으며, 이는 스스로의 무분별한 과열과 닷컴 부문 전반의 붕괴가 낳은 희생양이었습니다. 이 붕괴는 투기 거품의 위험성과 신흥 시장에서의 강력한 감독의 필요성에 대한 경고가 되었습니다."
 GER_neuer_markt_colapse_I: "신시장 붕괴 완화를 위한 정부 개입"
 GER_neuer_markt_colapse_I_desc: "*노이어 마르크트*의 참담한 붕괴에 대응하여, 정부는 충격을 완화하기 위해 개입하여 금융 구제를 제공하기로 결정했습니다. 핵심 산업에 자본을 투입하고 어려움을 겪는 기업을 지원함으로써 경제를 안정시키고 추가적인 금융 공황을 방지하는 것이 목표입니다. 이러한 개입은 단기적인 피해를 제한할 수 있지만, 공공 지출 증가와 국가 부채 확대라는 대가가 따릅니다."
 GER_neuer_markt_colapse_II: "시장이 스스로 조절하게 두기"
 GER_neuer_markt_colapse_II_desc: "자유 시장의 원칙을 신봉하는 정부는 *노이어 마르크트*의 붕괴 이후 경제가 스스로 회복하도록 두기로 하였습니다. 이러한 불개입 접근은 시장이 호황과 불황의 자연스러운 순환을 통해 스스로 바로잡을 것이라고 전제합니다. 장기적인 균형을 회복할 수는 있겠지만, 금융 부문이 서서히 재편되는 동안 기업들이 도산하고 실업이 증가하는 등 당장의 여파는 혹독할 것입니다."
 GER_subventions_mining: "광업 보조금"
 GER_subventions_agrar: "농업 보조금"
 GER_idea_swine_flu: "신종 플루 대유행"
 GER_idea_swine_flu_desc: "신종 플루(H1N1) 대유행으로 광범위한 공중 보건 우려와 경제적 혼란이 발생하고 있습니다. 질병의 급속한 확산으로 의료 체계가 한계에 달했으며, 소비자들의 공포는 돼지고기 생산에 의존하는 농업 산업에 타격을 주고 있습니다. 이 위기에 대처하는 것은 국가를 안정시키는 데 필수적입니다."
 GER_idea_chicken_flu: "조류 인플루엔자 발생"
 GER_idea_chicken_flu_desc: "흔히 조류 독감으로 알려진 조류 인플루엔자의 발생이 양계 산업을 위협하고 있습니다. 이 질병의 높은 전염성과 식품 안전에 대한 대중의 공포는 경제적 손실과 농촌 지역의 긴장을 초래했습니다. 추가 피해를 막으려면 효과적인 봉쇄와 지원 조치가 필요합니다."
 GER_BSE_Crisis_I: "BSE 위기"
 GER_BSE_Crisis_I_desc: "흔히 '광우병'으로 알려진 소해면상뇌증(BSE)은 소에게 발병하는 치명적인 신경 퇴행성 질환입니다. 이는 뇌 속 정상 단백질의 구조적 변화를 유발하는 비정상 단백질인 프리온에 의해 발생하며, 뇌 손상과 특징적인 증상으로 이어집니다. \n\n그래, 우리는 녹색당을 검사해 봤는데, 놀랍게도 87%가 음성이었습니다."
 GER_BSE_Crisis_II: "BSE 위기"
 GER_BSE_Crisis_II_desc: "흔히 '광우병'으로 알려진 소해면상뇌증(BSE)은 소에게 발병하는 치명적인 신경 퇴행성 질환입니다. 이는 뇌 속 정상 단백질의 구조적 변화를 유발하는 비정상 단백질인 프리온에 의해 발생하며, 뇌 손상과 특징적인 증상으로 이어집니다. \n\n그래, 우리는 녹색당을 검사해 봤는데, 놀랍게도 87%가 음성이었습니다."
 GER_idea_Q_fever: "Q열 발생"
 GER_idea_Q_fever_desc: "'Query Fever(미확인 열병)'의 약자인 Q열이 전국의 가축에게 발생하고 있습니다. *콕시엘라 부르네티* 세균이 일으키는 이 인수공통감염병은 감염된 동물 제품, 먼지, 에어로졸을 통해 퍼집니다. Q열은 농업 생산량을 감소시킬 뿐 아니라 인간에게도 독감과 유사한 증상을 일으키며, 심한 경우 장기적인 합병증을 유발하는 심각한 건강 위험이 됩니다. 정부는 질병을 억제하고 공중 보건과 경제에 미치는 영향을 줄이기 위해 신속히 행동해야 합니다."
 GER_idea_banned_pesticid_used: "금지된 농약 사용"
 GER_idea_banned_pesticid_used_desc: "환경 및 공중 보건상의 위험을 뒷받침하는 증거가 늘어남에 따라 몇몇 주요 농약의 사용이 금지되었습니다. 이 결정은 생물 다양성을 보존하고 생태계를 보호하는 것을 목표로 하지만, 농업 생산에 상당한 차질을 빚었습니다. 농민들은 이제 대체 해충 방제 방법에 적응해야 하며, 이는 단기적으로 비용이 많이 들고 효과도 떨어질 수 있습니다."
 GER_idea_H5N8: "H5N8 조류 인플루엔자 발생"
 GER_idea_H5N8_desc: "병원성이 매우 높은 조류 인플루엔자 H5N8 변종이 가금류와 야생 조류 사이에서 빠르게 확산되고 있습니다. 이 바이러스는 인간에게는 위험이 적지만, 양계 산업에 미치는 영향은 파괴적이며 조류의 대량 살처분과 막대한 경제적 손실을 초래하고 있습니다. 확산을 막고 식량 안보를 지키기 위한 긴급한 억제 조치가 필요합니다."
 GER_idea_Foot_and_moooouuuhhh: "구제역 발생"
 GER_idea_Foot_and_moooouuuhhh_desc: "소, 돼지, 양 같은 발굽이 갈라진 동물에게 발열과 물집이 나타나는 구제역이 가축들 사이에서 발견되었습니다. 전염성이 매우 높은 이 질병은 농업 부문을 위협하며 심각한 무역 제한과 감염된 가축 무리의 살처분으로 이어집니다. 추가적인 경제적 파장을 막기 위해 즉각적인 개입이 필요합니다."
 GER_idea_Nazi_I: "위르겐 리거"
 GER_idea_Nazi_II: "우르줄라 하버벡"
 GER_idea_Nazi_III: "프랑크 레니케"
 GER_idea_Mauermoerder_I: "자라 바겐크네히트"
 GER_idea_Mauermoerder_II: "그레고어 기지"
 GER_idea_Mauermoerder_III: "아네타 카하네"
 GER_idea_Neutrals_I: "하랄트 슈미트"
 GER_idea_Neutrals_II: "토마스 고트샬크"
 GER_idea_Neutrals_III: "귀도 크노프"
 GER_idea_reform_international_institutions: "국제기구 개혁"
 GER_idea_reform_international_institutions_desc: "독일은 국제기구가 21세기의 현실을 더 잘 반영하도록 개혁하는 노력을 주도하고자 합니다. 신흥 강국의 대표성을 확대하고 투명성과 책임성을 높일 것을 주장함으로써, 독일은 이들 기구를 현대화하여 지구적 과제에 효과적으로 대응하고 국제 협력을 유지하는 것을 목표로 합니다."
 GER_Ideas_Reformed_German_International_Institutes_desc: "독일은 국제 기관의 효과를 높이고 변화하는 지구적 과제에 적응하도록 이들을 현대화하였습니다. 이 개혁은 혁신과 협력을 우선시하며, 독일의 기관이 외교와 다자간 협력의 최전선에 남도록 보장합니다."
 GER_idea_V_Fall: "방위 사태"
 GER_idea_V_Fall_desc: "독일은 국가 방위 조치를 신속히 동원하고 조율하기 위해 마련된 비상 전략인 '방위 사태(Verteidigungsfall)'를 발동합니다. 이 계획은 연방방위군과 핵심 기반시설이 독일의 안보와 주권에 대한 임박한 위협에 대응할 수 있도록 완전히 준비되어 있음을 보장합니다."
 GER_KfW_IPEX_Bank: "KfW IPEX 은행"
 GER_KfW_IPEX_Bank_desc: "KfW IPEX 은행은 독일의 수출 및 투자 금융을 위한 핵심 기관입니다. 국가 경제 이익을 지원하는 데 초점을 맞춘 이 은행은 기반시설 개발을 촉진하고, 국내 일자리를 확보하며, 기술 혁신을 장려합니다. 이 은행의 활동은 에너지, 운송, 제조업 등 여러 산업에 걸쳐 있어 독일 기업이 세계 무대에서 경쟁력을 유지하도록 보장합니다. 경제 안정에 크게 기여하는 동시에, 이 은행은 지속 가능한 관행과 재생 에너지 사업을 증진하는 역할도 하며 환경적 책임에 대한 독일의 의지에 부합합니다."
 GER_Goethe_intitut: "괴테 인스티투트"
 GER_Goethe_Intitut_desc: "뮌헨에 본부를 둔 괴테 인스티투트는 전 세계에 독일 문화와 언어를 알리는 독일의 대표적 기관입니다. 문화 대사로서 국제 협력을 증진하고, 문화 행사를 개최하며, 전 세계 수백만 명에게 언어 과정을 제공합니다. 뮌헨 본부는 독일의 풍부한 유산을 보존하면서 굳건한 문화적 유대를 유지하려는 이 기관의 헌신을 상징합니다. 90개국 이상에 걸친 네트워크를 통해 괴테 인스티투트는 독일의 예술, 문학, 언어적 기여가 국제적으로 울려 퍼지도록 하여 독일의 소프트 파워와 문화적 영향력을 강화합니다."
 Humbold_foundation_sharing_group_name: "훔볼트 재단 교류 그룹"
 Humbold_foundation_sharing_group_desc: "훔볼트 재단 교류 그룹은 장기적인 국제 학술 협력을 증진하기 위해 마련된 계획입니다. 알렉산더 폰 훔볼트 재단 프로그램의 졸업생을 독일의 학자들과 연결하여 공동 연구 프로젝트와 상호 학술 교류를 촉진합니다."
 GER_Ideas_IT_Workers: "인도 IT 인재 활용"
 GER_Ideas_IT_Workers_desc: "독일은 인도의 숙련된 IT 인력을 활용하고자 합니다. 이 계획은 인도 IT 전문가의 채용을 촉진하여 기술 역량을 높이고 독일 IT 산업의 인력 부족을 해소합니다."
 GER_Ideas_Chinese_Partners: "중국과의 협력 관계 증진"
 GER_Ideas_Chinese_Partners_desc: "독일은 중국과의 경제 및 기술 협력 관계를 강화하는 데 집중합니다. 이 계획은 상호 협력과 전문성 공유를 통해 무역, 공동 연구, 혁신을 촉진하는 것을 목표로 합니다."
 GER_ideas_Israel_partner: "이스라엘 혁신가들과의 협력"
 GER_ideas_Israel_partner_desc: "독일은 기술과 혁신 분야에서 이스라엘과 협력하고자 합니다. 이 계획은 합작 사업, 연구 제휴, 지식 교류를 강조하여 기술 발전과 경제 성장을 이끌어 냅니다."
 GER_wandel_durch_handel: "무역을 통한 변화"
 GER_wandel_durch_handel_desc: "독일은 무역 관계를 증진하여 사회적, 경제적 진보를 이끌어 내고자 합니다. 이 전략은 평화, 혁신, 지속 가능한 발전을 촉진하는 국제 통상의 역할을 강조합니다."
 GER_Ideas_International_education_I: "안정을 위한 교육"
 GER_Ideas_International_education_I_desc: "교육을 지구적 안정의 기둥으로 인식하여, 독일은 개발도상국과의 학술 제휴에 투자합니다. 장학금, 직업 훈련, 교사 교류 프로그램을 지원함으로써 이 계획은 장기적인 사회·경제적 성장을 촉진하고 외교 관계를 강화하는 것을 목표로 합니다."
 GER_Ideas_International_education_II: "국제 교육 프로그램"
 GER_Ideas_International_education_II_desc: "독일은 전 세계 대학 및 연구 기관과 양자 협정을 체결하여 국제 교육 사업을 확대합니다. 이 프로그램은 학생 이동성을 높이고, 최첨단 연구 협력을 촉진하며, 국경을 넘는 학술 혁신을 장려합니다."
 GER_Ideas_International_education_III: "교육 분야의 독일어 보급"
 GER_Ideas_International_education_III_desc: "독일은 독일어를 세계 교육 체계에 포함시키려는 노력을 강화합니다. 괴테 인스티투트 프로그램, 어학 장학금, 문화 교류 사업을 통해 이 정책은 독일의 문화적 영향력을 강화하고 더 깊은 국제 협력을 촉진하는 것을 목표로 합니다."
 GER_Luftwaffe_modifier: "공군"
 GER_Luftwaffe_modifier_desc: "연방방위군의 공군인 루프트바페입니다. 본래 냉전기 병력으로 설계되어, 주요 임무는 소련의 잠재적 침략으로부터 서독 영공을 방어하는 것이었습니다. 그러나 냉전의 종식, 독일의 재통일, 그리고 변화하는 지구적 위협의 성격으로 인해 루프트바페는 새로운 임무 요구에 맞추어 변신해야 하는 과제에 직면해 있습니다."
 GER_Deutsche_Marine_modifier: "독일 해군"
 GER_Deutsche_Marine_modifier_desc: "냉전기 독일 해군의 임무는 서독의 해안선을 보호하고, 핵심 해상 교통로의 통제를 보장하며, 발트해에서 소련 해군력에 대응하는 것이었습니다. 1990년 독일 재통일로 동독 해군(Volksmarine)이 독일 해군에 통합되었고, 서로 다른 교리, 장비, 인력이 하나의 결속력 있는 병력으로 합쳐졌습니다."
 mykonos_judgement: "미코노스 판결"
 helmut_hofer_injailed: "헬무트 회퍼 투옥"
 GER_increase_rightist_status_by_10: "§H제2부서§!의 상태가 §H10§! §G증가§!합니다"
 GER_increase_rightist_status_by_2: "§H제2부서§!의 상태가 §H2§! §G증가§!합니다"
 GER_Diplomatic: "독일 외교"
 GER_Diplomatic_desc: "독일의 외교 정책은 단순한 양자 관계를 훨씬 넘어 확장되었습니다. 대신 독일은 영향력 있는 기관들의 네트워크를 활용하여 세계적 위상을 높였습니다. KfW, 괴테 인스티투트, DAAD, 알렉산더 폰 훔볼트 재단 같은 기구들이 중요한 역할을 했습니다. 이 기관들은 경제 협력, 문화 외교, 학술 교류를 촉진하여 더 강력하고 지속 가능한 국제적 유대를 구축했습니다. 독일은 정치적 합의에만 의존하는 대신, 협력국의 교육, 기반시설, 개발에 대한 투자를 통해 장기적 이익에 집중했습니다. 이러한 제도적 외교는 독일의 세계적 영향력을 강화하고 전 세계에 걸쳐 상호 이익이 되는 협력 관계를 증진했습니다."
 GER_HANS_PETER_KIRCHBACH: "한스 페터 키르히바흐"
 GER_International_schools: "국제학교"
 GER_International_schools_desc: "국제학교에 자금을 지원하면 전 세계에서 온 해외 거주자와 합법 이민자에게 최고 수준의 교육을 제공할 수 있으며, 이들이 자신만의 특성 일부를 유지하면서도 독일 문화와 사회에 더욱 통합되도록 할 수 있습니다."
 GER_Investments_stuggart: "슈투트가르트에 대한 미국 투자"
 GER_Investments_stuggart_desc: "미국의 투자자들은 슈투트가르트와 그 주변 바덴뷔르템베르크 지역에 특히 관심을 보이는 듯하며, 이곳을 개척할 준비가 된 열린 기회의 상자로 보고 있습니다."
 GER_Investments_cologne: "쾰른에 대한 러시아 투자"
 GER_Investments_cologne_desc: "한편 러시아 사업가들은 물가가 높은 도시 쾰른의 잠재력에 주목하며, 그 인기, 높은 삶의 질, 관광 명소로서의 매력을 이유로 이곳의 스타트업을 육성해야 한다고 말합니다."
 GER_rheinmetall_focus: "라인메탈"
 GER_rheinmetall_focus_desc: "우리는 라인메탈과 계약을 체결하고 군용 차량의 생산을 늘릴 것입니다!"
 GER_KMW_focus: "KMW"
 GER_KMW_focus_desc: "KMW에 연락하여 새로운 군용 차량에 대해 우리 정부와 계약을 체결하도록 요청할 것입니다."
 GER_long_range: "장거리 능력"
 GER_long_range_desc: "우리는 먼 거리에서 공격을 수행할 수 있어야 합니다. 그렇지 못하면 우월한 적이 우리가 보복할 수 없는 상태에서 국가를 두들길 수 있기 때문입니다. 장거리 탄도 미사일 사일로를 건설하면 이러한 무기를 보관하고 배치할 수 있게 됩니다."
 GER_Italian_invasion: "이탈리아 타격"
 GER_Italian_invasion_desc: "이탈리아는 자국 군대가 무능과 무질서로 가득하다는 것을 보여 주었습니다. 따라서 이탈리아군의 어떠한 저항도 신속히 분쇄될 수 있다고 안심할 수 있습니다."
 GER_mid_range_desc: "독일에서 균형 잡힌 사회는 다양한 사회적, 경제적, 문화적 요소를 조화시키는 것을 목표로 합니다. 이는 모든 시민에게 자원, 기회, 서비스에 대한 공평한 접근을 보장하고 사회적 결속과 안정을 증진하는 것을 포함합니다."
 GER_1_left_side_range_desc: "독일은 오랫동안 다양한 문화적 사상과 관행이 공유되고 기려지는 문화 간 교류의 중심지였습니다. 이러한 교류는 국가의 문화적 결을 풍부하게 하고 서로 다른 문화 집단 사이의 상호 이해와 존중을 증진합니다."
 GER_left_side_range_desc: "독일의 포용적 사회는 배경에 관계없이 모든 개인에게 평등한 기회를 제공하고자 노력합니다. 여기에는 차별에 맞서고 사회 통합을 증진하여 모든 사람이 존중받고 받아들여진다고 느끼도록 하려는 노력이 포함됩니다."
 GER_middle_left_side_range_desc: "독일은 이민자가 사회적, 경제적, 문화적 삶에 통합되도록 돕기 위해 다양한 정책과 프로그램을 시행해 왔습니다. 이 과정에는 언어 과정, 취업 지원, 지역 사회 참여 사업이 포함되어 이민자가 사회의 적극적이고 기여하는 구성원이 되도록 돕습니다."
 GER_far_left_side_range_desc: "독일은 새로운 사상, 관행, 산물이 끊임없이 등장하여 문화 지형을 형성하는 문화 혁신으로 알려져 있습니다. 이러한 혁신은 전통과 현대성의 역동적인 조화에 의해 추동되어 창의성과 진보를 촉진합니다."
 GER_Militarism_desc: "독일의 문화적 다원주의는 여러 뚜렷한 문화 집단이 공존하면서 각자 고유한 정체성을 유지하는 동시에 더 넓은 사회에 기여하는 모습을 반영합니다. 이러한 다원주의는 국가의 다양성과 문화적 풍요로움을 높이는 강점으로 여겨집니다."
 GER_1_right_side_range_desc: " 민족 공동체(Volksgemeinschaft), 즉 \\"국민 공동체\\"라는 개념은 통일된 민족 정체성을 강조합니다. 오늘날의 독일에서 이 개념은 역사적 함의에 유의하면서 시민들 사이의 소속감과 연대감을 증진하는 것과 흔히 연관됩니다."
 GER_right_side_range_desc: "문화적 순수성이라는 관념은 문화적 전통과 관행을 원래의 형태로 보존하는 것을 수반합니다. 독일에서는 세계화의 영향 사이에서 균형을 잡으면서 지역의 관습, 방언, 유산을 유지하려는 노력에서 이를 볼 수 있습니다."
 GER_middle_right_side_range_desc: "독일의 민족 유산은 풍부한 역사, 전통, 기념물, 문화유산을 아우릅니다. 이 유산을 보존하고 증진하는 것은 시민들 사이에서 민족 정체성과 자부심을 기르는 데 매우 중요합니다."
 GER_far_right_side_range_desc: "독일의 민족적 단결은 다양한 민족 집단 사이의 연대와 결속을 증진하는 데 초점을 맞춥니다. 이는 이해와 협력을 촉진하는 한편 민족 다양성과 통합에 관련된 과제를 다루는 것을 포함합니다."
 GER_Anti_Militarism_desc: "독일의 문화적 순응은 개인의 행동과 신념을 지배적인 문화 규범에 맞추는 관행을 가리킵니다. 이는 일상생활을 형성하는 사회적 기대와 가치에서 볼 수 있으며, 동시에 개인의 표현과 다양성을 위한 여지도 허용합니다."
 GER_multicultural_curriculum_campain_in_schools: "학교 다문화 교육과정 캠페인"
 GER_multicultural_curriculum_campain_in_schools_desc: "독일이 계속해서 더 다문화적인 사회로 진화함에 따라, 학교에서 포용적인 교육과정의 필요성이 무엇보다 중요해졌습니다. 1990년대 진보적 교육 정책의 영향을 이어받은 이 캠페인은 학생들이 현대 독일의 구조를 이루는 다양한 문화적 배경에 대해 배우도록 하는 것을 목표로 합니다. 게르하르트 슈뢰더 총리는 한때 '우리의 미래는 함께 사는 것, 그리고 서로의 문화에 대한 존중과 이해에 달려 있다'고 말했습니다. 이 계획은 변화하는 국가에서 사회적 결속을 기르는 데 핵심입니다."
 GER_Promote_Cultural_exchange_Programs: "문화 교류 프로그램 장려"
 GER_Promote_Cultural_exchange_Programs_desc: "상호 이해와 지구적 협력을 증진하기 위해 독일은 문화 교류 프로그램을 확대하였습니다. 전후 시대로 거슬러 올라가는 이 사업들은 전 세계 국가들과 지속적인 협력 관계를 맺는 것을 목표로 합니다. 빌리 브란트 같은 저명한 지도자들은 '평화가 전부는 아니지만, 평화가 없으면 모든 것이 무다'라고 강조했습니다. 문화 교류는 외교를 강화하고 우정을 쌓으며 국경을 넘어 지식을 교환하는 소프트 파워 수단으로 여겨집니다."
 GER_provide_federal_foundings_for_migration_cultural_centers: "이주민 문화 센터에 연방 자금 지원"
 GER_provide_federal_foundings_for_migration_cultural_centers_desc: "이주민을 독일 사회에 통합하는 것의 중요성을 인식하여, 연방 자금이 이민자 공동체를 위한 문화 센터에 투입됩니다. 이 센터들은 통합을 증진하기 위한 언어 수업, 사회 서비스, 문화 활동을 제공합니다. 요하네스 라우 전 대통령은 연설에서 '우리는 이주를 위협이 아니라 기회로 보아야 한다'고 말했습니다. 이 센터들은 이주민과 난민이 문화적 정체성을 보존하면서 독일에 뿌리를 내리도록 돕는 데 중요한 역할을 합니다."
 GER_Support_Multicultural_Art_and_literature_initiative: "다문화 예술 및 문학 사업 지원"
 GER_Support_Multicultural_Art_and_literature_initiative_desc: "독일 정부는 오래전부터 변화하는 국가 정체성을 반영하는 데 있어 예술과 문학의 역할을 인식해 왔습니다. 다문화 예술 사업을 지원하는 것은 창의성을 기를 뿐 아니라 독일 문화에 대한 이민자 공동체의 기여를 부각합니다. '예술과 문화는 우리 사회의 영혼이다'라고 앙겔라 메르켈은 말했습니다. 이 사업은 독일의 문학과 예술 지형에서 다양한 목소리가 들리도록 보장합니다."
 GER_launch_multicultural_media_campain: "다문화 미디어 캠페인 개시"
 GER_launch_multicultural_media_campain_desc: "다양성과 포용의 가치를 증진하기 위한 미디어 캠페인으로, 이 사업은 고정관념에 도전하고 다문화 사회의 이점을 부각하고자 합니다. 외국인 혐오에 맞서고 사회적 화합을 증진하려는 독일의 노력에 발맞추어, 이 캠페인에는 다양한 문화적 배경을 가진 저명인사들이 출연합니다. 헬무트 슈미트 전 총리는 한때 '관용은 민주주의의 중요한 측면이다'라고 말했습니다. 이 캠페인은 더 포용적인 사회에 대한 독일의 헌신을 강화합니다."
 GER_Wehrmachtsausstellung: "국방군 전시회"
 GER_Wehrmachtsausstellung_desc: "제2차 세계 대전에서 국방군(Wehrmacht)의 역할을 조명하는 전시회인 국방군 전시회(Wehrmachtsausstellung)는 1990년대에 처음 소개되었을 때 전국적인 논쟁을 불러일으켰습니다. 이 전시는 '깨끗한 국방군'이라는 신화에 도전하고 나치 전쟁 범죄에 대한 독일군의 공모를 밝힙니다. 리하르트 폰 바이츠재커 연방 대통령은 '과거를 직시하는 것이 우리 미래의 열쇠다'라고 유명한 말을 남겼습니다. 이 전시는 여전히 독일의 기억 문화(Erinnerungskultur)의 중요한 일부로 남아 있습니다."
 GER_Launch_Erinnerungskultur_campain: "기억 문화 캠페인 개시"
 GER_Launch_Erinnerungskultur_campain_desc: "기억 문화(Erinnerungskultur) 캠페인은 과거를 기억하고 나치 시대의 참상이 결코 되풀이되지 않도록 하려는 독일의 지속적인 헌신을 반영합니다. 교육 프로그램, 공공 기념물, 국가 추모일을 통해 이 캠페인은 미래 세대에게 책임감을 심어 주고자 합니다. 헬무트 콜 전 총리는 한때 '과거를 아는 자만이 현재를 이해하고 미래를 만들어 갈 수 있다'고 말했습니다."
 GER_Revitalize_german_historical_Narratives_in_school: "학교의 독일 역사 서술 활성화"
 GER_Revitalize_german_historical_Narratives_in_school_desc: "독일 역사에 대한 더 균형 잡힌 접근을 요구하는 목소리에 대응하여, 이 사업은 학교에서 역사 서술의 교육을 활성화합니다. 독일 과거의 어두운 장뿐 아니라 민주주의, 인권, 평화 구축에서 이룬 성과도 강조합니다. 요아힘 가우크 전 대통령은 '독일의 역사는 미래 세대에게 경고이자 영감이다'라고 말했습니다. 이 프로그램은 학생들 사이에서 역사에 대한 섬세한 이해를 보장하는 것을 목표로 합니다."
 GER_Promote_Traditional_german_values_in_media: "미디어의 독일 전통 가치 장려"
 GER_Promote_Traditional_german_values_in_media_desc: "이 캠페인은 미디어 플랫폼을 통해 민주주의, 관용, 법치에 대한 존중과 같은 전통적인 독일의 가치를 장려하고자 합니다. 독일의 전후 헌법적 가치에 발맞추어, 이 사업은 공적 담론에서 이러한 원칙을 강화하는 것을 목표로 합니다. 콘라트 아데나워 전 총리는 한때 '국민의 단결이 국가의 힘의 토대다'라고 말했습니다. 이 캠페인은 공유된 가치를 통한 단결을 강조합니다."
 GER_Strengthen_language_purity_campain: "언어 순수성 강화 캠페인"
 GER_Strengthen_language_purity_campain_desc: "일상 의사소통에서 외국어와 속어의 영향이 커지는 데 대응하여, 이 캠페인은 독일어의 순수성을 보존하는 것을 목표로 합니다. 이 캠페인은 문화적 정체성과 언어적 유산에 대한 우려를 반영합니다. 저명한 독일 작가 토마스 만은 한때 '자신의 언어를 잊는 민족은 스스로를 잊는다'고 강조했습니다. 이 사업은 특히 교육과 미디어에서 독일어의 올바른 사용을 장려합니다."
 GER_Launch_national_identity_courses_for_migrants: "이주민 대상 민족 정체성 과정 개시"
 GER_Launch_national_identity_courses_for_migrants_desc: "통합을 촉진하는 동시에 독일 사회의 가치를 가르치는 것을 목표로 하는 이 과정은 이주민이 독일에서 살아가는 데 따르는 권리와 책임을 이해하도록 돕습니다. 이 과정은 민주주의, 법치, 독일 역사 같은 주제를 다룹니다. 프랑크발터 슈타인마이어 대통령은 '우리의 정체성은 우리가 타인을 어떻게 맞이하는가에 의해 규정된다'고 말했습니다. 이 과정은 새로 온 이들이 새로운 고향을 이해하고 받아들이도록 돕습니다."
 GER_Launch_made_in_germany_campain: "'메이드 인 저머니' 캠페인 개시"
 GER_Launch_made_in_germany_campain_desc: "'메이드 인 저머니' 캠페인은 독일 제품의 품질, 혁신, 신뢰성을 부각합니다. 세계적으로 우수성의 표식으로 알려진 '메이드 인 저머니'라는 문구는 공학과 장인 정신의 동의어가 되었습니다. 경제 기적(Wirtschaftswunder)의 설계자인 루트비히 에르하르트 전 총리는 '독일의 경제적 성공은 품질에 대한 헌신에 뿌리를 두고 있다'고 믿었습니다. 이 캠페인은 독일의 산업 유산과 세계적 경쟁력을 홍보합니다."
 GER_Fund_national_Culture_festivals: "국가 문화 축제 지원"
 GER_Fund_national_Culture_festivals_desc: "국가의 다채로운 예술 및 음악 유산을 기리는 독일의 문화 축제는 이 사업을 통해 지원을 받습니다. 이 축제들은 전통 문화와 현대 문화를 모두 조명하며 예술가들이 작품을 선보일 무대를 제공합니다. 괴테는 한때 '한 민족의 문화는 그 국민의 마음과 영혼 속에 깃들어 있다'고 말했습니다. 이 축제들은 독일 문화계의 활력과 창의성을 입증하는 증거입니다."
 Naval_bonus: "해군 보너스"
 GER_harsh_breach_final_settlement_threat: "최종 해결 조약의 중대한 위반"
 GER_breach_final_settlement_threat: "최종 해결 조약 위반"
 GER_Contract_I_TT: "주사위는 던져졌습니다. 이웃 나라들이 어떻게 반응하는지 지켜봅시다."
 GER_Neighbor_Opinion_tt: "이웃 나라가 우리나라와의 관계를 어떻게 이어 갈지 결정합니다"
 GER_SAPOS_decision: "SAPOS 시스템"
 GER_SAPOS_decision_desc: "\n£GER_desctext_sapos_network\n\n\n\nSAPOS 체계, 또는 독일 국가지리원 위성 측위 서비스(Satellitenpositionierungsdienst der deutschen Landesvermessung)는 독일 전역에 걸쳐 고정밀 위치 파악 서비스를 제공하도록 설계된 정교한 네트워크입니다. 이 시스템은 GPS 및 GLONASS와 같은 전 지구 위성항법시스템(GNSS)과 지상 기반 기준국을 결합하여, 실시간 및 사후 처리된 위치 파악 데이터를 센티미터 수준의 정확도로 제공합니다."
 GER_lease_acces_china: "베이더우 시스템 접근권 임차"
 GER_lease_acces_RUS: "GLONASS 시스템 접근권 임차"
 GER_lease_acces_USA: "GPS 시스템 접근권 임차"
 GER_Visit_swearing_in_ceremony: "선서식 참관"
 GER_honor_veterans: "참전 용사 예우"
 GER_advertisment_for_service: "홍보 캠페인"
 GER_Innere_fuhrung_decision: "윤리적 가치 강화"
 GER_Cold_War.1.t: "신규 나토 회원국 통합 주도"
 GER_Cold_War.1.d: "폴란드, 헝가리, 체코가 나토에 가입한 이후, 독일은 동맹 내에서 자국의 영향력을 공고히 하고 나토의 동부 측면을 강화할 유일무이한 기회를 보고 있습니다. 유럽에서 가장 영향력 있는 나토 회원국 중 하나로서 독일은 이 신규 회원국들의 통합 과정을 주도하여, 이들이 완전한 작전 능력을 갖추고 나토 기준에 부합하도록 하는 것을 자국의 사명으로 여기고 있습니다."
 GER_Cold_War.1.a: "독일이 주도적 역할을 맡아야 한다"
 GER_Coldwar_1: "§Y게르하르트 슈뢰더§! 총리는 독일의 전략적 위치와 군사적 경험이 이 통합을 주도하기에 적합하다고 믿습니다. 독일이 주도권을 잡으면 이 신규 동맹국들이 독일의 전략적 이익에 부합하고 동부 측면이 충분히 강화되도록 보장할 수 있습니다. §Y게르하르트 슈뢰더§!: 이는 독일이 나토 확대의 미래를 빚어낼 역사적인 기회입니다. 우리의 지도력이 동부 국경의 안정과 안보를 보장할 것입니다."
 GER_Cold_War.1.b: "이는 기본적으로 나토의 책임이다"
 GER_Coldwar_2: "연방의회의 일부 의원들은 통합이 중요하기는 하나 독일이 단독으로 주도하기보다 나토 전체가 맡아야 한다고 주장합니다. 독일은 나토의 노력을 지원하되 자원이 과도하게 소모되지 않도록 주도적 역할은 맡지 않아야 합니다.§Y루돌프 샤르핑, 독일 국방부 장관§!: 우리는 무리해서는 안 됩니다. 나토는 집단 안보 기구이며, 모든 회원국이 이 노력에 동등하게 기여해야 합니다."
 GER_Cold_War.2.t: "군사 통합 접근 방식 정의"
 GER_Cold_War.2.d: "독일이 신규 나토 회원국의 통합에서 중요한 역할을 맡을 위치에 있는 가운데, 폴란드, 헝가리, 체코를 동맹의 군사 구조에 편입시키는 최선의 전략을 결정하기 위한 논의가 진행되고 있습니다. 이 논의가 이들 국가의 군사 통합의 속도와 성격을 규정하게 될 것입니다."
 GER_Cold_War.2.a: "신속한 무장과 배치 강조"
 GER_Coldwar_4: "§Y하비에르 솔라나§!: 이들의 병력을 더 빨리 통합할수록 나토의 동부 측면은 더 강해질 것입니다. 우리는 신속하게 무장하고 배치해야 합니다."
 GER_Cold_War.2.b: "교리 일치와 훈련에 집중"
 GER_Coldwar_5: "§Y클라우스 라인하르트§! 장군은 광범위한 훈련을 통해 신규 회원국의 군사 교리를 나토 기준에 맞추는 데 중점을 두어야 한다고 주장합니다. 이 접근은 장기적인 호환성과 작전 효율을 보장합니다."
 GER_Cold_War.2.c: "인프라 개발과 통합의 균형"
 GER_Coldwar_6: "균형 잡힌 접근은 군사 통합과 나토 작전을 지원하는 데 필요한 기반시설 개발을 모두 우선시합니다. 이는 병참 능력을 높이고 지속 가능한 통합을 보장할 것입니다."
 GER_Cold_War.3.t: "나토 통합을 위한 장교단 개혁"
 GER_Cold_War.3.d: "폴란드, 헝가리, 체코를 나토에 완전히 통합하려면 이들의 장교단과 지휘 구조를 개혁하는 것이 필수적입니다. 이 단계는 신규 회원국이 나토의 지휘 체계 안에서 효과적으로 작전하고 합동 작전에 기여할 수 있도록 보장하는 데 매우 중요합니다."
 GER_Cold_War.3.a: "신규 회원국에 독일 고문 파견"
 GER_Coldwar_7: "§Y클라우스 라인하르트§!는 경험이 풍부한 독일 군사 고문들을 신규 회원국의 지휘 구조에 파견할 것을 제안합니다. 이는 실무 중심의 개혁 접근을 촉진하여 이들의 지휘 관행이 나토 기준에 신속히 맞춰지도록 보장할 것입니다."
 GER_Cold_War.3.b: "나토 지휘 아카데미 설립"
 GER_Coldwar_8: "§Y하비에르 솔라나§!는 신규 회원국 장교의 훈련 전담 나토 지휘 아카데미를 설립할 것을 제안합니다. 이 아카데미는 표준화된 훈련을 제공하여 나토의 작전 및 전략 교리에 대한 공통된 이해를 길러 줄 것입니다."
 GER_Cold_War.3.c: "합동 작전을 통한 지휘 구조 통합"
 GER_Coldwar_9: "§Y헬무트 빌만§!: 실전 경험이 최고의 스승입니다. 그들을 우리 작전에 참여시켜 함께 배웁시다."
 GER_Cold_War.4.t: "효과적인 항공 및 미사일 방어망 구축"
 GER_Cold_War.4.d: "신규 나토 회원국 통합의 핵심 부분은 견고한 항공 및 미사일 방어 체계를 구축하는 것입니다. 이는 이들 국가를 보호할 뿐 아니라 나토의 전반적인 방어 능력을 강화할 것입니다. 독일은 이러한 방어 체계를 통합하는 최선의 접근 방식을 결정해야 합니다."
 GER_Cold_War.4.a: "폴란드에 패트리어트 미사일 체계 배치"
 GER_Coldwar_10: "미국과 함께 폴란드에 패트리어트 미사일 체계를 배치하는 공동 사업입니다. 이는 즉각적이고 효과적인 미사일 방어 능력을 제공하여 나토 동부 측면의 안보를 강화할 것입니다."
 GER_Cold_War.4.b: "국가 대공 방어 개발에 집중"
 GER_Coldwar_11: "헝가리 정부는 각 신규 회원국이 나토의 지원을 받아 자국의 대공 방어 능력을 개발해야 한다고 제안합니다. 이 접근은 집단 방위에 기여하면서도 독립성과 자립을 증진합니다."
 GER_Cold_War.4.c: "나토 대공 방어 훈련 참가"
 GER_Coldwar_12: "§Y클라우스 나우만§!은 대규모 나토 대공 방어 훈련에 참가할 것을 권고합니다. 이는 신규 회원국이 나토의 기존 대공 방어 체계로 훈련하고 협조를 개선할 수 있게 해 줄 것입니다."
 GER_Cold_War.5.t: "폴란드의 기갑 장비 필요 결정"
 GER_Cold_War.5.d: "1999년에 나토에 가입한 폴란드는 이제 동맹의 기준에 맞추어 군대를 현대화해야 하는 과제에 직면해 있습니다. 수십 년간 소련 시대 장비에 의존해 온 탓에 폴란드군은 화력, 병참, 상호 운용성 전반에 걸친 대대적인 개선이 필요한 상태입니다. 핵심 유럽 동맹국으로서 독일은 폴란드가 현대적 무기, 차량, 통신 체계를 선정하고 도입하는 것을 돕는 데 중요한 역할을 할 기회를 갖고 있습니다. 이 전환을 지원함으로써 독일은 동맹 내 군사 협력을 강화하고, 지역 안보를 높이며, 폴란드가 완전한 역량을 갖춘 나토 회원국이 되도록 보장할 수 있습니다."
 GER_Cold_War.5.a: "폴란드에 잉여 기갑 장비 공급"
 GER_Coldwar_13: "§Y루돌프 샤르핑§!: 우리는 예비 물량의 전차와 장갑차를 보내 폴란드를 도울 수 있습니다. 1975년형 차체를 사용하는 비축 차량을 이전하여 그 설계와 생산자를 보존할 것입니다."
 GER_Cold_War.5.b: "소련제 NVA 장비 공급"
 GER_Coldwar_14: "구 동독 NVA의 잉여 소련제 장비를 활용하는 것이 더 비용 효율적인 해법이 될 것이며, 폴란드가 큰 비용 없이 현대화할 수 있게 해 줍니다."
 GER_Cold_War.5.c: "자국산 기갑 차량 개발 지원"
 GER_Coldwar_15: "폴란드가 독일의 기술 지원을 받아 자체 기갑 차량을 개발하도록 장려하면 현지 산업을 육성하고 장기적인 지속 가능성을 보장할 수 있습니다."
 GER_Cold_War.6.t: "헝가리의 군사 장비 필요 결정"
 GER_Cold_War.6.d: "최근 나토에 가입한 헝가리는 동맹의 기준에 맞추기 위해 상당한 군사 현대화를 거쳐야 합니다. 낡은 소련 시대 장비는 헝가리가 나토의 방어 구조에 효과적으로 통합되는 것을 가로막고 있습니다. 이를 해결하기 위해 헝가리는 현대적 장비 도입, 작전 준비태세 개선, 합동 군사 협력 강화에 대한 지원을 요청하고 있습니다. 첨단 방위 산업과 나토 전문성을 갖춘 독일은 헝가리가 정보에 입각한 조달 결정을 내리도록 이끌 수 있는 좋은 위치에 있습니다. 이 노력을 지원함으로써 독일은 군사적 유대를 심화하고, 지역 안정을 증진하며, 헝가리가 집단 방위 노력에 믿을 수 있는 기여국이 되도록 보장할 수 있습니다."
 GER_Cold_War.6.a: "잉여 기갑 차량 이전"
 GER_Coldwar_16: "우리는 헝가리에 예비 물량의 전차와 장갑차를 제공할 것입니다. 1975년형 차체를 사용하는 비축 차량을 이전하여 그 설계와 생산자를 보존할 것입니다."
 GER_Cold_War.6.b: "소련 시대 장비 보내기"
 GER_Coldwar_17: "소련 시대 장비를 계속 사용하는 것은 헝가리에 비용 효율적인 임시 해법이 될 수 있으며, 나토 기준으로 전환하는 동안 유능한 병력을 유지할 수 있게 해 줍니다."
 GER_Cold_War.6.c: "헝가리 군산 복합체에 대한 투자 지원"
 GER_Coldwar_18: "헝가리 군산 복합체에 대한 투자를 장려하면 현지 역량과 자급자족 기반을 구축하는 데 도움이 되어, 장기적으로 헝가리와 나토 모두에 이익이 될 것입니다."
 GER_Cold_War.7.t: "체코 공화국의 군사 장비 필요 결정"
 GER_Cold_War.7.d: "체코 공화국은 다른 나토 신규 가입국들과 마찬가지로 동맹의 전략적 틀에 완전히 통합되기 위해 군대를 현대화해야 합니다. 체코군은 강한 전통을 유지하고 있지만 장비 대부분이 여전히 낡아 나토 합동 작전에서의 효율성이 제한됩니다. 현대적인 서방 표준의 무기와 방어 체계로의 전환이 우선 과제이며, 이는 기술 전문성과 병참 지원을 모두 필요로 합니다. 독일은 체코 공화국이 이 변혁을 거치도록 이끄는 데 핵심적인 역할을 할 수 있으며, 이를 통해 체코가 나토 회원국으로서의 책임을 이행할 장비를 잘 갖추도록 하는 한편 유럽 방위 협력을 강화할 수 있습니다."
 GER_Cold_War.7.a: "잉여 전차 공급"
 GER_Coldwar_19: "체코 대통령 §Y바츨라프 하벨§!은 자국 기갑 병력에 대한 지원을 요청하고 있습니다. 1975년형 차체를 사용하는 비축 전차를 이전하여 그 설계와 생산자를 보존할 것입니다."
 GER_Cold_War.7.b: "기존 장비 개량 및 개조"
 GER_Coldwar_20: "기존 장비를 현대화하고 개조하는 것은 비용 효율적인 해법이 될 수 있으며, 체코 공화국이 나토에 점진적으로 통합되는 동안 작전 준비태세를 유지할 수 있게 해 줍니다."
 GER_Cold_War.7.c: "군수 산업 합작 사업 개발"
 GER_Coldwar_21: "§Y헬무트 빌만§!: 합작 사업은 양국 경제를 강화하고 양질의 장비를 꾸준히 공급하도록 보장할 것입니다."
 GER_Cold_War.8.t: "클라우스 라인하르트 장군의 공로 인정"
 GER_Cold_War.8.d: "§Y클라우스 라인하르트§! 장군은 신규 나토 회원국의 통합에서 중추적인 역할을 하였으며, 전략적 지침을 제공하고 독일과 이들 국가 간의 긴밀한 협력을 증진했습니다. 독일 정부는 그의 노력을 기리기 위해 연방공로십자훈장(Bundesverdienstkreuz)을 수여하는 방안을 검토하고 있습니다."
 GER_Cold_War.8.a: "§Y클라우스 라인하르트§! 장군에게 연방공로십자훈장 수여"
 GER_Coldwar_22: "§Y게르하르트 슈뢰더§!: 라인하르트 장군은 훌륭하게 복무하였습니다. 나토 통합에서의 그의 노력은 최고의 인정을 받을 자격이 있습니다."
 GER_Cold_War.8.b: "그는 자신의 의무를 다했을 뿐이다"
 GER_Cold_War.9.t: "국제적 긴장을 불러일으킨 산타 바르바라 시스테마스 매각"
 GER_Cold_War.9.d: "레오파르트 2 전차의 생산 면허를 보유하고 있던 스페인 방위 기업 산타 바르바라 시스테마스가 미국 기업 제너럴 다이내믹스에 인수되었습니다. 이 인수는 독일 정부 내에서 상당한 우려를 불러일으켰습니다. 루돌프 샤르핑 장관이 이끄는 독일 국방부는 적절한 보상이나 협정 없이 민감한 군사 기술이 미국으로 이전될 가능성을 경계하고 있습니다. 독일 정부는 정교한 전차 기술이 미국에 넘어가 관련 연구개발 비용을 지불하지 않고도 독일의 군사적 혁신에 접근할 수 있게 될 것을 우려합니다. 독일이 스페인 및 미국과의 강력한 관계를 유지하면서 자국의 군사 지식재산을 보호하려 함에 따라 이 상황은 외교적 긴장을 촉발했습니다. 산타 바르바라 시스테마스의 레오파르트 2 생산 면허를 어떻게 처리할지가 문제로 남아 있습니다."
 GER_Cold_War.9.a: "그들이 면허를 유지하게 둔다"
 GER_Cold_War.9.a_desc: "산타 바르바라 시스테마스가 제너럴 다이내믹스 소유 아래에서도 레오파르트 2 생산 면허를 유지하도록 허용하는 것은 나토 동맹 내의 신뢰와 연대를 보여 줄 것입니다. 이는 미국, 독일, 스페인이 전략적 목표를 공유하며 동맹 내에서 생산을 유지하는 것이 집단 방위 능력을 강화할 수 있음을 인정하는 것입니다. 그러나 이 선택은 민감한 기술이 비유럽 주체에게 쉽게 이전되는 선례를 남길 위험이 있습니다."
 GER_Cold_War.9.b: "전차는 받되, 독일에서 생산한다."
 GER_Cold_War.9.b_desc: "기술 이전의 위험을 줄이기 위해 독일은 스페인에 인도될 레오파르트 2 전차가 계속 독일 시설에서 생산되도록 요구할 수 있습니다. 이 해법은 생산 과정에 대한 통제권을 유지하고 기술이 안전하게 보호되도록 보장합니다. 이는 미국으로의 의도치 않은 기술 이전을 막겠지만, 불신으로 비칠 수 있어 스페인과의 관계에 부담을 줄 수 있습니다."
 GER_Cold_War.9.c: "면허를 철회하겠다. 우리에게서 전차는 받지 못할 것이다!"
 GER_Cold_War.9.c_desc: "가장 엄격한 접근은 산타 바르바라 시스테마스의 레오파르트 2 생산 면허를 완전히 철회하여 스페인에서의 추가 전차 생산을 중단시키는 것입니다. 이는 독일 기술이 완전히 보호되도록 보장하지만, 상당한 외교적 마찰이라는 대가를 치르게 됩니다. 이러한 조치는 스페인과의 관계에 부담을 주고, 중요한 나토 동맹국을 멀어지게 하며, 기술 이전에 대한 독일의 입장을 다른 국가들에 강력히 알리는 메시지가 될 수 있습니다."
 GER_Cold_War.20.t: "기갑 정찰 병력의 미래"
 GER_Cold_War.20.d: "연방방위군이 21세기로 접어들면서, 현대전의 요구를 충족하기 위해 기갑 정찰 병력의 역할이 재평가되고 있습니다. 현재의 지정학적 환경과 변화하는 군사 교전의 성격을 고려하여, 이 병력을 앞으로 어떻게 최선으로 활용할지 결정해야 합니다."
 GER_Cold_War.20.a: "페넥을 도입하고 룩스를 단계적으로 퇴역"
 GER_Fennek_TT: "연방방위군은 노후화되는 룩스를 점진적으로 대체할 페넥 차량을 도입하여 정찰 능력을 현대화할 수 있습니다. 이 전환은 합동 화력 지원팀(JFST) 능력도 도입하여 포병과 항공 지원을 조율하는 부대의 효율성을 높일 것입니다."
 GER_Cold_War.20.b: "룩스를 현대식 후속 차량으로 교체"
 GER_Luchs_TT: "기갑 정찰 병력의 실행 가능한 선택지는 룩스를 더 진보한 정찰 차량으로 교체하는 것입니다. 이는 은밀성과 속도라는 전통적 역할을 유지하면서 센서 기술, 기동성, 전장 인식을 향상시킬 것입니다."
 GER_Cold_War.20.c: "중장갑 정찰 차량 도입"
 GER_Cold_War.21.t: "연방방위군 현역 여단 축소"
 GER_Cold_War.21.d: "냉전의 종식과 변화하는 지구적 분쟁의 성격으로 연방방위군은 기로에 서 있습니다. 냉전 시기에 필수적이었던 대규모 고정식 군 구조는 현재의 안보 환경에서 더 이상 그만큼 적합하지 않습니다. 독일이 군사비를 줄이고 더 기동적이고 유연한 교리에 적응하려 하는 가운데, 육군의 향후 규모에 관해 중대한 결정을 내려야 합니다. 이제 문제는 현역 여단의 수를 대폭 줄여 비용을 낮추고 기동성을 높일 것인지, 아니면 더 높은 비용에도 불구하고 현재의 병력 규모를 유지할 것인지입니다. 이 결정은 독일의 군사 준비태세와 세계 무대에서의 역할에 장기적인 영향을 미칠 것입니다."
 GER_Cold_War.21.a: "현대 교리에 맞추어 육군 규모를 축소한다."
 GER_Cold_War.21.b: "핵심 능력을 유지하면서 균형 잡힌 축소를 한다."
 GER_Cold_War.22.t: "루프트바페 현대화"
 GER_Cold_War.22.d: "연방방위군이 21세기에 접어들면서 루프트바페의 현대화는 핵심 우선 과제입니다. 냉전 시대 항공기를 유로파이터 타이푼으로 교체하면 독일의 공군력이 크게 향상되며, 타우루스 미사일 체계는 정밀 타격 잠재력을 높입니다. 그러나 이러한 개선에 드는 높은 비용이 과제를 안기고 있으며, 정부는 어떻게 진행할지 신중히 결정해야 합니다."
 GER_Cold_War.22.a: "유로파이터 1차분을 주문하고 타우루스 미사일을 도입한다."
 GER_Taurus_TT: "유로파이터와 타우루스 미사일 체계를 도입함으로써 독일은 루프트바페에 최첨단 기술을 갖추어 제공권과 정밀한 장거리 타격 능력을 확보합니다. 이 투자는 루프트바페의 미래를 보장하고 독일의 유럽 선도 공군력 위상을 굳건히 합니다. 높은 비용에도 불구하고 전략적 이점은 값을 매길 수 없습니다."
 GER_Cold_War.22.b: "높은 비용 때문에 유로파이터만 선택하고 타우루스는 거부한다."
 GER_Eurofighter_TT: "유로파이터만 선택하면 독일은 비용을 통제하면서 전투기 전력을 현대화할 수 있습니다. 유로파이터 타이푼은 다목적에 강력한 항공기로 제공권 장악을 보장합니다. 그러나 타우루스 미사일 체계가 없으면 루프트바페의 정밀 타격 능력은 제한된 채로 남으며, 이는 예산 제약으로 인한 더 신중한 현대화 접근을 반영합니다."
 GER_Cold_War.22.c: "이러한 추가 비용은 감당할 수 없다."
 GER_NO_Eurofighter_TT: "루프트바페 현대화를 미루거나 포기하면 유로파이터와 타우루스 미사일의 높은 비용은 피할 수 있지만, 낡은 장비가 남아 독일의 공군력과 영향력이 약화될 위험이 있습니다. 재정 보수적인 이 선택은 장기적인 방위상의 결과를 초래할 수 있습니다."
 GER_Cold_War.23.t: "연방방위군 헬리콥터 전력 현대화"
 GER_Cold_War.23.d: "UH-1D를 포함한 연방방위군의 노후화된 헬리콥터 전력은 현대의 군사적 요구를 충족하기 위해 현대화가 필요했습니다. CH-53 GS 수송 헬리콥터와 유로콥터 티거 공격 헬리콥터가 주요 후보였으며, 기동성, 항공 지원, 화력의 향상을 약속했습니다. 그러나 이러한 개선에 따르는 재정적 부담은 여전히 과제로 남아 있어, 어떻게 진행할지에 대한 정부의 결정이 필요합니다."
 GER_Cold_War.23.a: "CH-53 GS를 주문하고 유로콥터 티거 계획에 투자한다."
 GER_Tiger_TT: "CH-53 GS와 유로콥터 티거를 모두 도입하면 독일군에 최첨단 기술이 갖춰집니다. CH-53 GS는 병력 기동성을 높이고 유로콥터 티거는 공격 능력을 강화하여, 연방방위군이 다양한 작전에서 뛰어난 성과를 낼 수 있게 합니다. 비용이 많이 들지만 수송 헬리콥터와 공격 헬리콥터를 모두 현대화하는 전략적 이점은 부인할 수 없습니다."
 GER_Cold_War.23.b: "CH-53 GS와 미국제 아파치 공격 헬리콥터를 주문한다."
 GER_Apache_TT: "이 선택지는 현대화와 실용적 접근의 균형을 이룹니다. 수송용으로 CH-53 GS를 선택하고 미국의 실전 검증을 거친 아파치 헬리콥터를 택함으로써, 독일은 더 비싼 유로콥터 티거 계획에 전적으로 매달리지 않고도 병력에 충분한 장비를 갖출 수 있습니다. 신뢰성과 전투 성능으로 알려진 아파치는 강력한 공격 능력을 제공하고, CH-53 GS는 기동성을 높입니다. 이 선택은 비용을 관리하면서 강력한 능력을 유지하는 전략적 절충안을 반영합니다."
 GER_Cold_War.23.c: "너무 비싸다. 이러한 추가 비용은 감당할 수 없다."
 GER_NO_Tiger_TT: "예산 제약과 다른 방위 우선순위를 고려하여 CH-53 GS와 신형 공격 헬리콥터의 도입을 미루거나 포기하기로 한 결정은 재정적 책임에 대한 중시를 반영합니다. 이 선택은 당장의 재정 부담을 피하지만, 연방방위군에 낡은 헬리콥터 능력이 남아 향후 작전에서의 효율성이 저해될 위험이 있습니다. 이 보수적인 접근은 비용 절감을 우선시하지만 현대적 군사 과제에 대응하는 독일의 능력을 제한할 수 있습니다."
 GER_Cold_War.24.t: "독일 기갑 병력 현대화"
 GER_Cold_War.24.d: "2000년대 초 독일 연방방위군은 기갑 병력의 현대화와 관련하여 중대한 결정에 직면했습니다. 냉전 시대는 독일에 막강한 전차와 장갑차 전력을 남겼지만, 변화하는 전쟁의 성격과 지정학적 지형의 변동으로 전장에서의 우위를 유지하려면 개선이 필요하다는 점이 분명해졌습니다. KWS-II(Kampfwertsteigerung II, 전투력 향상 II) 계획은 레오파르트 2 전차를 레오파르트 2A6 수준으로 개량하여 화력, 방호력, 전반적인 능력을 크게 높이도록 설계되었습니다. 또한 마르더 보병전투차는 생존성과 현대전에서의 효율을 개선하는 핵심적인 개량을 받을 예정이었습니다. 그러나 자원이 한정된 상황에서 독일 정부는 이 야심 찬 현대화 노력을 어떻게 진행할지 결정해야 합니다."
 GER_Cold_War.24.a: "KWS-II 계획을 완료하고 마르더도 개량한다."
 GER_2A6_TT: "1975년형 차체를 사용하는 비축 전차를 레오파르트 2A5 및 레오파르트 2A6 전차로 교환하고, 마르더 1A5 설계를 도입합니다. 해당 차체를 사용하는 모든 설계 또는 생산자의 전차가 교환 대상에 포함됩니다."
 GER_Cold_War.24.b: "일부 전차만 KWS-I로 개량할 여력이 있다."
 GER_2A5_TT: "현대화 노력을 1975년형 차체를 사용하는 비축 전차를 레오파르트 2A5 전차로 교환하는 것으로 한정합니다. 해당 차체를 사용하는 모든 설계 또는 생산자의 전차가 교환 대상에 포함됩니다."
 GER_Cold_War.24.c: "이것은 돈 낭비다. 주력전차에는 전장에서의 미래가 없다."
 GER_NO_2A6_TT: "기동성, 정밀 타격, 비대칭 위협에 대한 관심이 높아지는 등 전쟁의 성격이 변화함에 따라, 일부는 주력전차(MBT)가 구식이 되어 가고 있다고 주장합니다. 이 선택지는 현대화 계획을 아예 중단하고 자원을 더 유연하고 미래 지향적인 군사 능력으로 돌릴 것을 옹호합니다. 이 접근은 상당한 비용을 절감하겠지만, 전통적이고 고강도의 전쟁에 참여하는 데 필요한 중장갑 전력이 독일에 없게 될 위험이 있으며, 전반적인 군사력이 약화될 수 있습니다."
 GER_Cold_War.25.t: "육군부대사령부 창설"
 GER_Cold_War.25.d: "2000년대 초 연방방위군은 냉전 이후 군사 작전의 현실을 더 잘 다루기 위해 조직 구조를 조정하고자 했습니다. 지원 부대가 개별 사단에 편입된 전통적인 모델은 현대전의 더 유동적이고 역동적인 성격에 비추어 점점 비효율적인 것으로 여겨졌습니다. 제안된 육군부대사령부(Heerestruppenkommando)는 포병과 대공 부대 같은 핵심 지원 능력을 단일 사령부로 중앙집중화하는 것을 목표로 했습니다. 이는 이러한 자원을 더 효과적으로 배분하여 필요에 따라 육군의 어느 부분이든 지원하도록 신속히 배치할 수 있게 합니다. 이 사령부를 창설할지 여부에 대한 결정은 향후 분쟁에서 연방방위군이 효과적으로 작전하는 능력에 상당한 영향을 미칠 것입니다."
 GER_Cold_War.25.a: "육군부대사령부를 사단급 부대로 창설한다."
 GER_Heerestruppe_TT: "육군부대사령부를 사단급 사령부로 창설하면 포병과 대공 부대가 중앙집중화되어 모든 연방방위군 부대를 지원할 수 있는 통합 구조가 마련됩니다. 이러한 중앙집중화는 지원 능력의 보다 효율적인 조율과 신속한 배치를 가능하게 하여 독일 육군의 작전 효율을 크게 높일 것입니다. 이 선택지는 상당한 재편을 필요로 하지만, 다양한 군사 시나리오에 적응할 수 있는 강력하고 유연한 지원 사령부를 제공합니다."
 GER_Cold_War.25.b: "현재 구조를 유지한다."
 GER_keep_structure_TT: "기존 구조를 유지하면 대규모 재편에 따르는 비용과 혼란을 피할 수 있습니다. 이 선택지는 현상 유지를 보존하여 포병과 대공 전력 같은 지원 부대를 현재의 사단에 편입된 상태로 유지합니다. 이 선택은 연속성과 안정성을 보장하지만, 유연하고 중앙집중화된 지원이 점점 더 중요해지는 현대 군사 작전의 요구에 대한 연방방위군의 적응력이 떨어지고 대응이 느려질 수 있습니다."
 GER_Cold_War.30.t: "네덜란드와의 군사 협력 심화"
 GER_Cold_War.30.d: "유럽이 냉전 이후 시대를 헤쳐 나가는 동안 독일과 네덜란드는 군사 협력을 강화하고자 했습니다. 두 나라는 점점 더 긴밀히 연결되는 세계에서 더 긴밀한 방위 관계의 중요성을 인식했습니다. 이 협력은 이미 상당한 통합으로 이어져, 독일군과 네덜란드군 부대가 정기적으로 함께 훈련하고 작전했으며 특히 1990년대에 독일-네덜란드 군단이 편성되었습니다. 그러나 새로운 안보 과제가 대두됨에 따라 독일은 이제 결정에 직면해 있습니다. 네덜란드와의 군사적 유대를 더욱 심화하여 더 통합되고 역량 있는 합동 병력을 만들어야 할까요, 아니면 현재 수준의 협력을 유지해야 할까요?"
 GER_Cold_War.30.a: "네덜란드와의 군사적 유대 강화"
 GER_Military_Ties_TT: "네덜란드와의 군사적 유대를 강화하기로 선택하면 독일군과 네덜란드군의 더 깊은 통합이 이루어져 공동 지휘 구조, 공동 조달 사업, 연합 훈련 확대로 이어질 수 있습니다. 이 선택지는 특히 평화 유지 및 신속 대응 작전에서 양국의 군사적 효율과 준비태세를 높일 수 있습니다. 또한 유럽 방위 협력에 대한 독일의 의지를 알리는 신호가 되며 다른 나토 동맹국과의 향후 협력의 모범이 될 수 있습니다. 그러나 더 깊은 통합은 군사적 결정에 대한 국가 주권의 양보를 요구하고 장비와 작전 기준을 맞추는 데 추가 투자가 필요할 수 있습니다."
 GER_Cold_War.30.b: "현상 유지"
 GER_Status_Quo_TT: "네덜란드와의 현재 군사 협력 수준을 유지하면 추가적인 통합 없이도 기존 협력이 계속됩니다. 이 선택지는 합동 훈련과 작전 경험의 이점을 누리면서도 독일이 자국 군대에 대한 완전한 통제권을 유지하게 합니다. 독일은 더 깊은 통합의 복잡성과 잠재적 정치적 문제를 감수하지 않고 자국의 군사적 우선순위와 현대화 노력에 집중할 수 있습니다. 그러나 이 선택은 네덜란드와의 긴밀한 유대에서 비롯될 수 있는 효율성과 준비태세의 향상 가능성을 제한할 수 있습니다."
 GER_Cold_War.31.t: "네덜란드와의 장교 훈련 동기화"
 GER_Cold_War.31.d: "네덜란드와의 군사 협력 심화에 관한 논의에 이어, 다음으로 고려되는 단계는 양국 간 장교 훈련 프로그램의 동기화입니다. 독일과 네덜란드는 모두 자국의 교리에 익숙할 뿐 아니라 가장 가까운 동맹국의 작전 체계와 절차를 깊이 이해하는 장교를 두는 것의 가치를 인식하고 있습니다. 훈련 프로그램을 일치시킴으로써 양국은 합동 임무에서 원활하게 함께 작전할 수 있는 더 결속력 있고 상호 운용 가능한 지휘 구조를 만들고자 합니다. 그러나 이러한 조치는 기존 훈련 교육과정의 상당한 조정을 필요로 하며, 각국 고유의 훈련 기준 유지를 선호하는 이들의 반발에 직면할 수 있습니다."
 GER_Cold_War.31.a: "동기화를 진행한다"
 GER_Officer_training_TT: "장교 훈련 프로그램의 동기화를 진행하면 독일과 네덜란드 사이의 교육과정, 훈련 방법론, 심지어 공동 아카데미까지 일치시키게 될 것입니다. 이는 연합 작전에서 독일군과 네덜란드군을 똑같이 능숙하게 지휘할 수 있는 새로운 세대의 장교를 길러 내어 양국 군대의 전반적인 상호 운용성과 효율을 높일 것입니다. 이 조치는 독일-네덜란드 군사 관계를 강화하고 작전 결속력을 개선하겠지만, 훈련 프로그램의 대대적인 재편을 요구하고 전환을 관리하기 위한 추가 자원이 필요할 수 있습니다."
 GER_Cold_War.31.b: "계획을 연기한다"
 GER_Postpone_TT: "장교 훈련 프로그램의 동기화를 연기하기로 하면 독일은 현재의 훈련 기준을 유지하고 국가적 우선순위에 집중할 수 있습니다. 이 선택은 두 개의 서로 다른 군사 체계에 걸쳐 훈련 프로그램을 일치시키는 데 따르는 잠재적 혼란과 복잡성을 피합니다. 이 선택지는 현상 유지를 보존하고 독일의 특정 필요에 맞게 훈련을 조정하는 더 큰 유연성을 허용하지만, 네덜란드와의 더 깊은 통합과 합동 작전 능력 향상의 기회를 놓치는 결과를 낳을 수도 있습니다."
 GER_Cold_War.32.t: "네덜란드와의 장비 표준화"
 GER_Cold_War.32.d: "독일과 네덜란드가 군사 협력 심화의 방안을 계속 모색함에 따라, 장비 표준화 문제가 전면에 대두되었습니다. 양군이 통일된 장비 체계를 갖추면 상호 운용성이 크게 향상되고, 병참상의 어려움이 줄며, 합동 작전이 간소화됩니다. 그러나 완전한 표준화는 비용이 많이 들고 복잡한 작업이 될 수 있으며, 양국이 조달 전략을 일치시키고, 기존 보유 장비를 개조하고, 특정 체계에 대한 일부 국가적 선호를 양보해야 할 수도 있습니다. 독일은 이제 자국 군사 장비를 네덜란드의 장비와 일치시키는 데 어디까지 나아갈 용의가 있는지 결정해야 합니다."
 GER_Cold_War.32.a: "완전한 표준화를 추진한다"
 GER_Standardization_TT: "완전한 표준화를 택한다는 것은 독일과 네덜란드가 소화기에서 차량과 통신 체계에 이르기까지 군사 장비 대부분을 조화시킨다는 뜻입니다. 이 접근은 양군 간의 상호 운용성을 크게 높여 합동 작전을 더 효율적으로 만들고 정비와 병참의 복잡성을 줄일 것입니다. 그러나 완전한 표준화는 기존 장비를 교체하거나 개조하는 데 상당한 투자가 필요하며 일부 선호 체계에 대한 양보가 필요할 수 있습니다. 이 선택지는 가장 큰 장기적 작전상의 이점을 약속하지만, 막대한 초기 비용과 잠재적 정치적 문제도 따릅니다."
 GER_Cold_War.32.b: "부분적 표준화"
 GER_Standardization_I_TT: "부분적 표준화를 택하면 통신 체계, 탄약, 일부 차량 등 합동 작전에 가장 중요한 핵심 장비 범주를 표준화하는 데 집중하는 더 선택적인 접근이 가능합니다. 이 접근은 상호 운용성 개선의 필요와 장비 선택에서 어느 정도의 국가적 자율성을 유지한다는 현실적 고려 사이의 균형을 맞춥니다. 이는 완전한 표준화에 비해 비용과 복잡성을 줄이면서도 합동 작전 능력에서 상당한 성과를 거둡니다. 그러나 이 선택지는 일부 장비 분야가 서로 맞지 않는 채로 남을 수 있어 특정 시나리오에서는 여전히 문제가 될 수 있습니다."
 GER_Cold_War.32.c: "별도 체계 유지"
 GER_Standardization_II_TT: "별도의 장비 체계를 유지하면 독일은 네덜란드 체계에 맞출 필요 없이 자국이 선호하는 군사 하드웨어를 계속 사용하고 개발할 수 있습니다. 이 선택은 조달 결정에 대한 완전한 국가적 통제권을 보존하고 독일의 특정 군사적 필요에 맞춘 접근을 가능하게 합니다. 그러나 이 선택지는 네덜란드와의 합동 작전의 효율성을 제한하고 서로 다른 장비 체계를 운용하는 데 따르는 병참 및 작전상의 어려움을 그대로 유지할 수 있습니다. 표준화에 따른 비용과 복잡성은 피하지만, 향후 군사 협력의 깊이를 제한할 수도 있습니다."
 GER_Cold_War.33.t: "상호 보완적 육군"
 GER_Cold_War.33.d: "독일과 네덜란드가 군사 협력을 심화함에 따라, 다음의 중대한 결정은 독일 연방방위군을 가장 잘 보완하기 위한 네덜란드 육군 여단의 구성에 관한 것입니다. 병력을 전략적으로 일치시킴으로써 독일과 네덜란드는 다양한 작전 시나리오에 대응할 수 있는 더 결속력 있고 효과적인 합동 군사력을 만들 수 있습니다. 네덜란드가 경량, 중형, 전차 여단 중 무엇을 운용할지에 대한 결정은 양국 연합군의 상호 운용성과 전반적인 전력에 상당한 영향을 미칠 것입니다. 독일은 어느 선택지가 이 협력 관계를 가장 잘 강화하고 가장 큰 전략적 이점을 제공할지 신중히 고려해야 합니다."
 GER_Cold_War.33.a: "경량 여단 편성 지원"
 GER_Complimentary_TT: "네덜란드 육군의 경량 여단은 신속한 기동성과 유연성을 제공하여, 신속한 배치와 중장갑이 덜 효과적인 험난한 지형에서의 작전에 이상적입니다. 이 선택지는 특히 평화 유지 임무나 속도와 기동성이 중요한 환경에서 독일-네덜란드 병력이 새로 발생하는 위기에 신속히 대응하는 능력을 크게 높일 것입니다. 그러나 경량 여단은 높은 기동성을 제공하는 반면 고강도 분쟁에서 필요한 화력과 방호력이 부족할 수 있어 특정 시나리오에서 효율성이 제한될 수 있습니다."
 GER_Cold_War.33.b: "중형 여단 편성 지원"
 GER_Complimentary_I_TT: "중형 여단은 기동성, 화력, 방호력이 균형 잡힌 조합을 제공하여 광범위한 임무를 수행할 수 있는 다재다능하고 적응력 있는 병력이 됩니다. 이 선택지는 네덜란드 육군이 고강도 전투 상황과 저강도 평화 유지 작전 모두에서 독일군과 함께 효과적으로 작전할 수 있게 합니다. 중형 여단은 더 무거운 독일 기갑 부대를 유연하게 보완하며, 화력이나 방호력을 크게 희생하지 않고 속도와 적응력이 필요한 곳에 지원을 제공할 수 있습니다. 그러나 이 선택지는 신규 장비와 훈련에 대한 상당한 투자가 필요할 수 있습니다."
 GER_Cold_War.33.c: "전차 여단 편성 지원"
 GER_Complimentary_II_TT: "네덜란드 육군의 전차 여단은 독일-네덜란드 협력의 중장갑 능력을 크게 강화할 것입니다. 이 선택지는 강력한 화력과 장갑이 최우선인 고강도 전투 시나리오에서 특히 효과적인 막강한 병력을 만들어 냅니다. 전차 여단은 독일의 기존 기갑 사단을 강력히 보완하여 합동 작전에서 강한 억지력과 전투 능력을 제공할 것입니다. 그러나 이 선택지는 연합 화력과 방호력을 높이는 반면 작전의 유연성을 제한할 수 있고 유지 및 운용에 상당한 자원이 필요할 수 있습니다."
 GER_Cold_War.34.t: "네덜란드와의 대공 방어 동기화"
 GER_Cold_War.34.d: "독일과 네덜란드 간의 군사 협력이 계속 심화됨에 따라 두 나라의 대공 방어 체계 동기화로 관심이 옮겨 갑니다. 나토 내에서 통합 대공 방어의 중요성이 커지는 점을 감안하면, 이웃한 두 나라 간의 조율된 접근은 상당한 전략적 이점을 제공할 수 있습니다. 독일은 이제 중대한 결정에 직면해 있습니다. 네덜란드에 고정식 패트리어트 대공 방어 및 레이더 체계를 주둔시킬 것인지, 필요에 따라 재배치할 수 있는 기동식 패트리어트 부대를 배치할 것인지, 아니면 별도의 독자적 대공 방어 체계를 유지할 것인지입니다. 이 결정은 양국의 안보와 공동 방위 태세의 효율성에 지속적인 영향을 미칠 것입니다."
 GER_Cold_War.34.a: "네덜란드에 패트리어트 대공 방어 및 레이더 체계 주둔"
 GER_Air_defence_TT: "네덜란드에 고정식 패트리어트 방공 포대와 레이더 체계를 배치하면 독일은 견고하고 영구적인 방공망을 구축하여 양국을 공중 위협으로부터 보호하는 능력을 크게 높일 수 있습니다. 이 선택지는 레이더 정보와 방공 범위를 공유하는 고도로 조율되고 통합된 방어 태세를 가능하게 하여 지역 전역에 빈틈없는 방어막을 제공합니다. 또한 독일과 네덜란드 군사 파트너십에 대한 강력한 의지를 보여 주며 NATO 전체의 방어 구조를 강화합니다. 그러나 이 선택지는 유연성을 제한할 수 있으며 고정 시설을 유지하고 운용하기 위해 상당한 자원을 투입해야 합니다."
 GER_Cold_War.34.b: "기동식 패트리어트 방공 부대 배치"
 GER_Air_defence_I_TT: "기동식 패트리어트 방공 부대를 배치하면 독일과 네덜란드가 변화하는 위협 환경에 역동적으로 대응할 수 있는 유연하고 적응력 높은 해법을 얻게 됩니다. 이 기동 부대는 필요에 따라 다른 지역을 방어하도록 신속하게 재배치할 수 있어 자국 작전과 NATO 작전을 모두 지원하는 다용도 방어 능력을 제공합니다. 이 선택지는 작전 유연성을 높이고 방공 전력을 가장 필요한 곳에 배치할 수 있도록 보장하지만, 고정 시설에 비해 방어 범위의 일관성이 떨어질 수 있습니다. 또한 기동 배치에 필요한 병참과 협조가 어려움을 초래할 수 있습니다."
 GER_Cold_War.34.c: "독자적 방공 체계 유지"
 GER_Air_defence_II_TT: "독자적인 방공 체계를 유지하면 독일과 네덜란드 모두 자국 방공 전력에 대한 완전한 통제권을 보유할 수 있습니다. 이 선택지는 광범위한 조율이나 공동 기반시설 없이도 각국이 자국 영공과 방어 우선순위를 스스로 관리하는 자율성을 보존합니다. 두 나라가 각자의 안보 우려에 독립적으로 대처할 수 있다는 장점이 있지만, 공동 방어 능력이 떨어질 수 있으며 NATO 방공망 내에서 더 깊은 통합을 이룰 가능성도 제한될 수 있습니다. 또한 체계를 따로 유지하면 자원 배분에 중복과 비효율이 발생할 수 있습니다."
 GER_Cold_War.35.t: "네덜란드와의 통합 수준 선택"
 GER_Cold_War.35.d: "독일과 네덜란드 사이의 군사 협력 심화는 중대한 기로에 이르렀습니다. 방공 체계의 동기화에서부터 상호 보완적인 여단 구조에 이르기까지 이전의 공동 사업이 성공을 거두면서 독일-네덜란드 군단의 장래에 관한 논의가 가능해졌습니다. 긴밀한 군사 협력의 상징인 이 군단은 연방군 구조에 완전히 통합될 수도 있고, 평시에는 각국이 통제하고 전시에는 통합되는 공동 전력으로 남을 수도 있으며, 양국 모두 완전한 국가 주권을 유지할 수도 있습니다. 이 결정은 독일과 네덜란드의 향후 군사 관계와 NATO 내 집단 방위 능력에 지대한 영향을 미칠 것입니다."
 GER_Cold_War.35.a: "독일-네덜란드 군단을 연방군에 완전 통합"
 GER_Integration_NL_TT: "독일-네덜란드 군단을 연방군 구조에 완전히 통합하면 독일과 네덜란드는 독일의 지휘 아래 하나의 실체로 운용될 수 있는 통일되고 매끄러운 군사력을 갖추게 됩니다. 이 선택지는 지휘 통제의 간소화, 상호운용성 강화, 일관된 방어 전략을 통해 군단의 작전 효율을 극대화합니다. 또한 두 나라의 유대를 강화하여 양국의 군사 파트너십을 유럽 내 NATO 방어 태세의 초석으로 만들 것입니다. 그러나 이 정도의 통합에는 상당한 정치적, 작전적 조정이 필요하며 국가 주권과 자율성에 대한 우려가 제기될 수 있습니다."
 GER_Cold_War.35.b: "평시 국가 통제, 전시 연방군 통합"
 GER_Integration_NL_I_TT: "이 선택지는 평시에 독일-네덜란드 군단에 대한 국가 통제를 보존하여, 두 나라가 각자의 군사 전통과 구조를 유지하면서 군단을 독립적으로 관리할 수 있게 합니다. 전쟁이 발발하면 군단은 연방군에 완전히 통합되어 독일의 지휘 아래 일체화된 부대로 운용됩니다. 이 접근법은 공동 작전의 이점과 국가 주권에 대한 존중을 결합한 균형 잡힌 해법입니다. 작전 유연성을 높이고 위기 시 군단이 신속하고 효과적으로 동원될 수 있도록 하면서도 평시에는 일정한 독립성을 유지합니다."
 GER_Cold_War.35.c: "완전한 국가 주권 유지"
 GER_Integration_NL_II_TT: "독일-네덜란드 군단에 대한 완전한 국가 주권을 유지하기로 선택한다는 것은 독일과 네덜란드가 연방군 구조에 완전히 통합하지 않고 각자의 병력을 계속해서 독립적으로 관리한다는 뜻입니다. 이 선택지는 각국의 자율성을 보존하여 자국 군사력과 의사 결정 과정에 대한 완전한 통제권을 유지하게 합니다. 이 선택은 국가 주권을 존중하지만, 합동 작전에서 군단의 작전 효율을 제한하고 더 깊은 군사 통합의 가능성을 줄일 수 있습니다. 또한 NATO 내 다국적 임무에서 조율과 상호운용성에 어려움이 생길 수 있습니다."
 GER_Cold_War.40.t: "레오파르트 트로피"
 GER_Cold_War.40.d: "레오파르트 트로피는 독일에서 매년 개최되는 권위 있는 군사 대회로, 레오파르트 주력 전차(MBT)의 주요 운용국과 우호적인 동맹군, 특히 NATO 회원국을 위해 마련되었습니다. 이 행사는 국제 군사 협력을 강화하고 참가 병력 간의 상호운용성을 높이며, 고도의 경쟁을 통해 기갑전의 우수성을 육성하는 것을 목표로 합니다. 대회 기간 중 전차 승무원들은 정밀 사격, 전술 기동, 장애물 통과, 팀 단위 작전 훈련 등 일련의 혹독한 과제에 직면합니다. 이러한 시험은 레오파르트 전차의 성능뿐 아니라 승무원들의 기량과 규율, 팀워크를 보여 줍니다. 이 대회는 모범 사례를 교환하고 합동 작전 전술을 다듬으며 국경을 넘는 군사 조율을 개선하는 중요한 장으로 기능합니다. 우호적인 경쟁을 장려함으로써 레오파르트 트로피는 높은 훈련 수준을 유지하게 하며, 참가국들이 공동 방위 노력과 향후 임무에서 협력할 준비를 갖추도록 보장합니다."
 GER_Cold_War.40.a: "고양이들을 풀어라!"
 GER_Cold_War.40.b: "그럴 여유가 없다"
 GER_Cold_War.41.t: "NATO 군사 기량 대회: 전술적 우수성의 과시"
 GER_Cold_War.41.d: "NATO 군사 기량 대회는 매년 열리는 정예 행사로, NATO 회원국과 동맹군의 군 인력이 모여 전술적 역량과 체력, 팀워크를 겨룹니다. 이 대회는 사격술, 장애물 코스, 지형 판독, 응급처치, 전투 모의 훈련 등 다양한 군사 분야에서 참가자들의 능력을 시험합니다. NATO군 간의 동지애와 협력을 증진하기 위해 마련된 이 대회는 우호적인 경쟁 분위기를 조성하는 동시에 참가 군대의 작전 준비태세와 상호운용성을 높입니다. 병사들이 한계에 도전하게 하고 공통의 군사 표준을 장려함으로써, NATO 군사 기량 대회는 합동 임무와 집단 방위에 필요한 높은 훈련 수준을 유지하는 데 핵심적인 역할을 합니다."
 GER_Cold_War.41.a: "보병이 전투를 결정할 것이다"
 GER_Cold_War.41.b: "그럴 여유가 없다"
 GER_Cold_War.42.t: "뵈젤라거 베트캄프: NATO 기병 대회"
 GER_Cold_War.42.d: "뵈젤라거 베트캄프는 독일의 기병 장교 게오르크 폰 뵈젤라거 남작의 이름을 딴 연례 NATO 기병 대회입니다. 독일에서 열리는 이 권위 있는 행사에는 여러 NATO 회원국의 정찰 및 기병 부대가 모여 전술 기량과 지구력, 팀워크를 겨룹니다. 참가자들은 기마 정찰, 사격술, 지형 판독, 장애물 코스 등 폭넓은 과제를 수행합니다. 이 대회는 국제 군사 협력을 강화하고 상호운용성을 높이며 기병 훈련의 높은 수준을 유지하기 위해 마련되었습니다. 우호적인 경쟁과 엄격한 시험을 통해 뵈젤라거 베트캄프는 현대 기병 작전의 우수성을 육성하는 한편, NATO 내 기마 부대의 전통과 유산을 보존합니다."
 GER_Cold_War.42.a: "보이지 않으면서 본다"
 GER_Cold_War.42.b: "여유가 없다"
 GER_Cold_War.43.t: "군사 대회 선택"
 GER_Cold_War.43.d: "뵈젤라거 베트캄프는 독일의 기병 장교 게오르크 폰 뵈젤라거 남작의 이름을 딴 연례 NATO 기병 대회입니다. 독일에서 열리는 이 권위 있는 행사에는 여러 NATO 회원국의 정찰 및 기병 부대가 모여 전술 기량과 지구력, 팀워크를 겨룹니다. 참가자들은 기마 정찰, 사격술, 지형 판독, 장애물 코스 등 폭넓은 과제를 수행합니다. 이 대회는 국제 군사 협력을 강화하고 상호운용성을 높이며 기병 훈련의 높은 수준을 유지하기 위해 마련되었습니다. 우호적인 경쟁과 엄격한 시험을 통해 뵈젤라거 베트캄프는 현대 기병 작전의 우수성을 육성하는 한편, NATO 내 기마 부대의 전통과 유산을 보존합니다."
 GER_Cold_War.43.a: "레오파르트 트로피: 레오파르트 MBT 운용국 및 동맹군을 위한 국제 대회"
 GER_Cold_War.43.a_desc: "전차전에 초점을 맞춘 이 대회에는 레오파르트 주력 전차의 주요 운용국과 동맹국이 참가합니다. 승무원들은 사격 정확도, 기동성, 전술 기동에서 과제에 직면하며, 상호운용성과 합동 작전 전술의 향상에 중점을 둡니다. 기갑전의 우수성과 국제 협력을 육성하기에 가장 적합한 선택입니다."
 GER_Cold_War.43.b: "NATO 군사 기량 대회"
 GER_Cold_War.43.b_desc: "이 포괄적인 행사는 NATO와 동맹군 병사들에게 폭넓은 군사 분야에서 도전을 제공하도록 마련되었습니다. 체력에서 전술 전투 상황에 이르기까지, 이 대회는 다양한 전문 분야에 걸친 병사들의 팀워크와 정밀성, 준비태세를 강조합니다. 단결과 공통의 군사 표준을 증진하기에 이상적입니다."
 GER_Cold_War.43.c: "뵈젤라거 베트캄프: NATO 기병 대회"
 GER_Cold_War.43.c_desc: "NATO 회원국의 정찰 및 기병 부대가 모이는 유명한 행사입니다. 이 대회는 기마 부대의 사격술, 지형 판독, 전술 작전 능력을 시험합니다. 기병의 전통을 선보이는 동시에 현대 전장 기술을 갈고닦고 다국적 군사 협력을 도모하기에 완벽합니다."
 GER_RCH_155: "RCH 155 차륜형 곡사포"
 GER_RCH_155_desc: "RCH 155는 독일이 개발한 기동성이 뛰어난 차륜형 곡사포로, 155mm 포 체계를 통해 신속한 화력 지원을 제공합니다. 복서 8x8 차체에 탑재되어 전통적인 곡사포의 화력과 뛰어난 기동성을 결합하였으며, 사격 후 신속하게 진지를 변환할 수 있습니다. 이 자주 체계는 현대 전장에서의 정밀성, 사거리, 다용도성으로 유명합니다."
 GER_GTK_Boxer_CRV: "복서 전투 정찰 차량(CRV)"
 GER_GTK_Boxer_CRV_desc: "복서 CRV는 독일이 개발한 다용도 중장갑 전투 정찰 차량입니다. 모듈식 GTK 복서 플랫폼을 기반으로 한 이 차량은 정찰 부대에 첨단 감시 능력과 방호력, 기동성을 제공합니다. 다양한 센서와 통신 장비, 무장을 갖추어 적대적 환경에서 승무원의 안전을 지키면서 상황 인식을 보장합니다."
 GER_Leopard_2A8: "레오파르트 2A8 주력 전차"
 GER_Leopard_2A8_desc: "레오파르트 2A8은 독일 레오파르트 주력 전차 계열의 최신형으로, 강화된 장갑과 첨단 센서, 개량된 사격 통제 체계를 갖추고 있습니다. 전장을 지배하도록 제작되어 120mm 활강포로 타의 추종을 불허하는 화력을 제공하며 현대적 위협에 대해 뛰어난 방호력을 지닙니다. 2A8은 우수한 생존성과 기동성, 살상력으로 기계화 부대를 선도하도록 설계되었습니다."
 GER_Leopard_2A7A1: "레오파르트 2A7A1 주력 전차"
 GER_Leopard_2A7A1_desc: "레오파르트 2A7A1은 방호력과 기동성, 화력을 향상시키도록 설계된 레오파르트 2 계열의 개량형입니다. 첨단 수동 및 능동 방호 체계를 갖추어 도시전과 하이브리드전에 최적화되어 있습니다. 정교한 전자 장비와 개량된 120mm 포로 광범위한 위협에 대응하면서 전장 우위를 유지할 수 있습니다."
 GER_Leopard_2A7: "레오파르트 2A7 주력 전차"
 GER_Leopard_2A7_desc: "레오파르트 2A7은 방호력과 화력, 기동성이 강화된 레오파르트 2 계열의 현대화 모델입니다. 첨단 장갑과 최신 체계를 갖춘 2A7은 재래식 전쟁과 비대칭 전쟁 모두에 대응하도록 설계되었습니다. 120mm 활강포는 강력한 화력 지원을 제공하며, 뛰어난 기동성은 신속한 전장 투입을 보장합니다."
 GER_Leopard_2A6_LAHAT: "LAHAT 대전차 미사일을 장착한 레오파르트 2A6"
 GER_Leopard_2A6_LAHAT_desc: "LAHAT(레이저 유도 공격) 미사일을 통합한 레오파르트 2A6은 이미 강력한 레오파르트 2 플랫폼에 첨단 대전차 능력을 더해 줍니다. LAHAT 미사일 체계는 장거리의 장갑 표적을 교전하는 전차의 능력을 높여 주며, 전통적인 전차포의 사거리를 넘어서는 정밀 유도 화력을 제공합니다. 2A6은 화력, 기동성, 방호력이 균형을 이루어 현대 기갑전의 핵심 전력이 됩니다."
 GER_Lynx: "링스 보병 전투 차량(IFV)"
 GER_Lynx_desc: "링스 IFV는 독일이 개발한 차세대 보병 전투 차량으로, 전장에서 최대한의 유연성을 발휘하도록 설계되었습니다. 첨단 장갑과 모듈식 설계, 최첨단 기술을 결합하여 보병 부대를 보호하고 지원합니다. 한 분대 전원을 수송할 수 있으며 30mm 또는 35mm 기관포를 비롯한 다양한 무장을 갖추어 공세 작전과 방어 작전 모두에 강력한 플랫폼이 됩니다."
 GER_Boeselager_wettkampf_history_entry: "뵈젤라거 베트캄프"
 GER_Leopard_trophy_history_entry: "레오파르트 트로피"
 GER_NATO_MSC_history_entry: "NATO 군사 기량 대회"
 GER_launch_military_competition: "군사 대회 개최"
 GER_neuer_markt_II: "닷컴 버블의 교훈"
 GER_neuer_markt_II_desc: "닷컴 버블 당시 기술 부문의 급격한 상승과 몰락은 세계 경제에 깊은 상흔을 남겼습니다. 많은 기업이 붕괴 속에 사라졌지만, 이 경험은 투기적 투자의 위험성, 검증되지 않은 기술에 대한 과신, 지속 가능한 성장 전략의 중요성에 대한 귀중한 교훈을 주었습니다. 그 여파를 지켜본 국가들은 이제 규제되지 않은 시장 호황을 경계하며 신중한 혁신, 금융 감독, 더 탄력적인 기술 부문 육성에 더 큰 비중을 두고 있습니다."
 GER_banking_center: "프랑크푸르트 - 글로벌 금융 중심지"
 GER_banking_center_desc: "프랑크푸르트의 은행 부문은 세계적인 금융 중심지로, 유럽 중앙은행과 프랑크푸르트 증권거래소, 수많은 국제 은행이 자리하고 있습니다. 세계 금융과 유럽 통화 정책에서 핵심적인 역할을 하고 있습니다."
 GER_downfall_of_heavy_industrie: "중공업의 몰락"
 GER_downfall_of_heavy_industrie_desc: "한때 독일 경제의 심장이었던 루르 지방의 중공업은 석탄 및 철강 부문의 국제 경쟁으로 인해 붕괴했습니다."
 GER_new_economic_hubs: "떠오르는 거인들"
 GER_new_economic_hubs_desc: "전통적인 산업 중심지인 노르트라인베스트팔렌(NRW)이 정체를 겪는 가운데, 남부의 바이에른과 바덴뷔르템베르크가 독일의 새로운 경제 강자로 부상했습니다. 자동차, 엔지니어링, 첨단 제조업이 번창하는 이 지역들은 우수한 인재와 투자를 끌어들여 경제 생산과 혁신에서 NRW를 앞질렀습니다. 첨단 기술 산업, 지속 가능한 에너지, 수출 주도 성장에 주력하는 남부는 이제 독일 경제의 엔진으로서 국가의 산업 지형을 재편하고 있습니다."
 GER_Reform_and_Strenghen_of_german_foreign_intitutes: "독일 해외 기관 개혁"
 GER_Reform_and_Strenghen_of_german_foreign_intitutes_desc: "독일은 세계 무대에서 자국 문화 및 학술 기관의 중요성이 커지고 있음을 인식하고 있습니다. 괴테 인스티투트와 DAAD를 비롯한 국제 기구의 구조를 개혁함으로써 독일어와 독일 문화의 영향력을 넓히고, 과학 및 학술 파트너십을 육성하며, 독일 소프트 파워의 장기적 발전을 뒷받침하고자 합니다. 이러한 개혁은 이들 기관이 세계적 도전에 대처하고 역동적인 세계에서 독일의 국제적 영향력을 높일 수 있도록 보장할 것입니다."
 GER_KFW_Restructure: "KfW 구조조정"
 GER_KFW_Restructure_desc: "재건은행(KfW, Kreditanstalt für Wiederaufbau)은 세계 개발 금융의 핵심 주체입니다. 구조조정을 통해 독일은 신흥 시장의 대규모 기반시설, 친환경 에너지, 개발 사업에 자금을 지원할 수 있도록 금융 역량을 확대할 것입니다. KfW를 현대화함으로써 독일은 급변하는 세계 경제의 수요에, 즉 주요 협력국에서의 지속 가능한 성장, 에너지 전환, 혁신적 개발 모델에 보다 잘 대처할 수 있습니다."
 GER_global_infrastructure_projects: "글로벌 기반시설 프로젝트"
 GER_global_infrastructure_projects_desc: "세계 경제에서의 영향력을 높이고 무역을 촉진하기 위해, 독일은 전 세계의 핵심 기반시설 프로젝트에 대한 자금 조달과 지원을 약속할 것입니다. 이 프로젝트에는 교통망, 디지털 기반시설, 에너지망이 포함됩니다. 독일은 전략적 투자를 통해 신흥 시장과 장기적인 파트너십을 구축하는 한편, 경제 발전을 촉진하고 핵심 산업의 안정적인 공급망을 보장하고자 합니다."
 GER_Green_finance_initiative: "녹색 금융 구상"
 GER_Green_finance_initiative_desc: "독일은 전 세계에서 녹색 금융을 촉진하는 데 앞장설 것입니다. 재생에너지 프로젝트, 청정 기술, 지속 가능한 농업 관행에 자금을 투입함으로써 독일은 기후 변화에 맞선 세계적 노력에 기여할 것입니다. 녹색 금융 구상은 탄소 배출을 줄이는 것뿐 아니라 독일을 지속 가능한 금융의 세계적 선도국으로 자리매김시키고 개발도상국에 기후 친화적 기술에 대한 접근권을 제공하는 것도 목표로 합니다."
 GER_Strategic_Partnership_India: "인도와의 전략적 제휴"
 GER_Strategic_Partnership_India_desc: "독일은 지역 강국이자 세계 강국으로서 인도의 중요성이 커지고 있음을 인식하여 인도와의 전략적 파트너십을 심화할 것입니다. 이 파트너십은 무역, 기술, 기후 협력, 안보를 포함한 상호 관심 분야를 아우를 것입니다. 협력 강화를 통해 독일은 가장 빠르게 성장하는 경제 중 하나와 장기적인 경제적, 지정학적 유대를 보장하는 한편, 이 지역의 안정과 공동의 가치를 증진할 것입니다."
 GER_Expand_Export_Promotion_Programs: "수출 진흥 프로그램 확대"
 GER_Expand_Export_Promotion_Programs_desc: "세계 선도 수출국 중 하나로서의 지위를 유지하기 위해, 독일은 수출 진흥 프로그램을 대폭 확대할 것입니다. 이 프로그램은 독일 기업에 신흥 시장에 대한 더 넓은 접근권을 제공하고, 금융 및 물류 지원을 제공하며, 독일 제품의 세계적 경쟁력을 높일 것입니다. 이를 통해 독일은 점점 더 긴밀히 연결되는 세계에서도 수출 기반 경제가 계속 번영하도록 보장할 것입니다."
 GER_Securing_acces_to_Key_Ressources: "핵심 자원 접근권 확보"
 GER_Securing_acces_to_Key_Ressources_desc: "자원 부족의 시대에 독일은 자국 경제에 필수적인 핵심 천연자원에 대한 접근권 확보를 우선시할 것입니다. 자원이 풍부한 국가들과 전략적 파트너십을 구축하고 희토류, 에너지원, 산업용 금속과 같은 핵심 물자에 대한 장기 계약을 보장하는 것이 이 노력에 포함됩니다. 자원 공급망을 다변화함으로써 독일은 불안정한 지역에 대한 의존도를 낮추고 산업 및 기술적 우위를 보장할 것입니다."
 GER_Development_Projects: "개발 프로젝트"
 GER_Development_Projects_desc: "독일은 보건, 교육, 기반시설, 지속 가능성에 초점을 맞춘 프로젝트에 대한 직접 투자를 통해 세계 개발에 대한 지원을 늘릴 것입니다. 이러한 개발 프로젝트는 독일 외교 정책의 초석이 되어 세계적 위상을 높이는 동시에, 취약 지역의 빈곤, 불평등, 환경 파괴와 같은 중대한 문제를 해결할 것입니다."
 GER_DAAD_Expand_Academic_exchange_service: "DAAD 학술 교류 사업 확대"
 GER_DAAD_Expand_Academic_exchange_service_desc: "독일 학술교류처(DAAD)는 전 세계 대학 및 기관과의 학술 협력과 교류를 더욱 촉진하도록 확대될 것입니다. 더 많은 장학금, 연구 보조금, 교류 기회를 제공함으로써 독일은 교육, 과학, 연구를 국제적 이해를 증진하고 세계적 파트너십을 강화하는 수단으로 장려할 것입니다."
 GER_Strategic_Partnership_Israel: "이스라엘과의 전략적 제휴"
 GER_Strategic_Partnership_Israel_desc: "독일은 안보, 기술 협력, 경제 협력과 같은 상호 관심 분야에 초점을 맞추어 이스라엘과의 전략적 관계를 심화할 것입니다. 공유하는 역사와 중동에서 이스라엘이 지니는 지속적인 지정학적 중요성을 고려할 때, 이 파트너십은 이스라엘의 안정과 발전을 지원하는 동시에 이 지역에서 독일의 영향력을 강화할 것입니다."
 GER_International_education_projects: "국제 교육 프로젝트"
 GER_International_education_projects_desc: "독일은 국제 파트너들과 협력하여 전 세계적으로 양질의 학습과 기술 역량에 대한 접근성을 개선하는 교육 프로젝트를 추진할 것입니다. 교육 기반시설이 낙후된 국가에 초점을 맞춤으로써 독일은 핵심 지역의 경제 성장과 사회 안정을 뒷받침하는 장기적 혜택을 제공하고자 합니다. 이러한 프로젝트는 또한 독일과 세계 사이에 더 강한 문화적 유대를 형성하여 상호 이해에 기여할 것입니다."
 GER_Education_for_stability: "안정을 위한 교육"
 GER_Education_for_stability_desc: "교육이 평화와 안정의 초석임을 인식하여, 독일은 분쟁 가능성이 높거나 분쟁 이후의 지역에서 교육 프로그램에 투자할 것입니다. 특히 농촌 및 저개발 지역의 교육 기회를 개선함으로써, 독일은 민주주의적 가치와 지속 가능한 발전이 번영할 수 있는 안정된 사회의 성장을 촉진하고자 합니다. 이러한 프로젝트에는 직업 훈련도 포함되어 청년층에게 힘을 실어 주고 더 강한 지역 경제를 구축할 것입니다."
 GER_Strategic_Partnership_Brazil: "브라질과의 전략적 제휴"
 GER_Strategic_Partnership_Brazil_desc: "독일은 재생에너지, 환경 보호, 산업 발전과 같은 분야에 초점을 맞추어 브라질과의 전략적 파트너십을 심화할 것입니다. 브라질의 방대한 천연자원과 성장하는 경제는 브라질을 글로벌 사우스에서 독일의 핵심 파트너로 만듭니다. 무역, 기술 협력, 환경 구상을 확대함으로써 이 파트너십은 양국에 경제적 이익을 가져다주고 지역 선도국으로서 브라질의 지속적인 발전을 뒷받침하고자 합니다."
 GER_Modernize_Goethe_Institutes: "괴테 인스티투트 현대화"
 GER_Modernize_Goethe_Institutes_desc: "독일 문화의 세계적 영향력을 높이기 위해 괴테 인스티투트는 디지털 학습, 온라인 콘텐츠, 강화된 문화 프로그램을 도입하는 현대화 노력을 거칠 것입니다. 이러한 개선으로 전 세계 사람들이 독일어와 독일 문화에 더 쉽게 접근할 수 있게 되며, 학술, 예술, 문학 교류도 촉진될 것입니다. 괴테 인스티투트를 현대화하면 급변하는 세계 환경 속에서도 문화 외교의 효과적인 수단으로 남을 수 있을 것입니다."
 GER_Promote_the_german_language: "독일어 보급"
 GER_Promote_the_german_language_desc: "독일은 전 세계 학교, 대학, 문화 센터의 프로그램을 확대하며 독일어를 보급하기 위한 야심 찬 세계적 캠페인에 착수할 것입니다. 언어 교육 자원에 투자하고 외국인 학생이 독일어를 배울 새로운 기회를 창출함으로써, 이 구상은 독일의 소프트 파워와 문화적 영향력을 강화할 것입니다. 독일어 능숙도는 또한 더 강한 경제적, 학술적 협력으로 이어지는 가교 역할을 할 것입니다."
 GER_Culture_andIntegration: "문화와 통합"
 GER_Culture_andIntegration_desc: "독일은 국내외에서 문화적 통합을 촉진하는 구상을 시작할 것입니다. 이 프로그램은 서로 다른 문화 집단 간의 상호 이해, 협력, 존중을 장려하는 데 초점을 맞출 것입니다. 공통의 가치와 문화적 이해를 증진함으로써 독일은 사회적 긴장을 줄이고 민주적 규범을 강화하며, 국내와 세계 곳곳의 파트너 국가들과 평화로운 공존을 도모하고자 합니다."
 GER_Strategic_Partnership_China: "중국과의 전략적 제휴"
 GER_Strategic_Partnership_China_desc: "독일은 기술, 무역, 기후 협력과 같은 분야에 초점을 맞추어 중국과의 전략적 파트너십을 더욱 강화할 것입니다. 중국이 세계 강국으로 계속 부상함에 따라, 독일은 양국에 이익이 되는 더 깊은 경제적 유대와 협력 프로젝트를 모색할 것입니다. 이 파트너십을 통해 독일은 핵심 시장과 자원에 대한 접근권을 확보하는 동시에 중국의 향후 경제 정책을 형성하는 데 중요한 역할을 할 것입니다."
 GER_Alexander_von_humboldt_Institutes_Strengthen_reswarch_cooperations: "알렉산더 폰 훔볼트 연구소 강화"
 GER_Alexander_von_humboldt_Institutes_Strengthen_reswarch_cooperations_desc: "알렉산더 폰 훔볼트 연구소는 국제 연구 협력을 촉진하기 위해 더 큰 지원을 받게 됩니다. 독일은 최첨단 과학 파트너십과 연구 펠로십에 투자함으로써 세계 혁신의 선도국으로 자리매김하고자 합니다. 이러한 협력은 기후 변화, 의학, 기술, 환경 보호와 같은 핵심 분야를 아우르며, 세계 연구의 미래를 형성하는 독일의 역할을 강화할 것입니다."
 GER_International_cutting_edge_research: "국제 최첨단 연구"
 GER_International_cutting_edge_research_desc: "독일은 특히 재생에너지, 생명공학, 인공지능 분야에서 최첨단 연구에 대한 국제 협력을 촉진하는 데 앞장설 것입니다. 이러한 분야에서 세계적 파트너십을 육성함으로써 독일은 세계적 과제를 해결하는 기술 발전을 이끌고자 합니다. 이러한 구상은 독일의 과학계를 강화할 뿐 아니라 혁신 분야에서 독일의 세계적 리더십에도 기여할 것입니다."
 GER_Promote_academic_elites: "학술 엘리트 육성"
 GER_Promote_academic_elites_desc: "독일은 전 세계의 학술 엘리트를 유치하고 육성하려는 노력을 확대할 것입니다. 장학금, 연구 기회, 경력 개발 프로그램을 제공함으로써 독일은 학계와 과학계를 이끌 차세대 세계 지도자를 키우고자 합니다. 이들은 독일 경제에 기여하는 한편, 학술 및 전문 네트워크를 통해 모국과의 유대도 강화할 것입니다."
 GER_International_leadership_training: "국제 리더십 훈련"
 GER_International_leadership_training_desc: "독일은 공무원, 기업 지도자, 시민사회 구성원을 위한 리더십 훈련 프로그램을 통해 파트너 국가에 유능한 지도층을 양성하는 데 투자할 것입니다. 이 프로그램은 통치, 지속 가능한 발전, 경제 관리에 초점을 맞추어 개발도상국에 강력하고 투명한 리더십을 장려할 것입니다. 이러한 노력은 파트너 국가의 안정과 경제 성장을 촉진할 뿐 아니라 유능한 동맹을 통해 독일의 세계적 영향력도 강화할 것입니다."
 GER_Suitable_Agriculture_programs: "적정 농업 프로그램"
 GER_Suitable_Agriculture_programs_desc: "독일은 지속 가능한 영농 방식, 기술 이전, 식량 안보에 초점을 맞추어 개발도상국의 적정 농업 프로그램에 투자할 것입니다. 이 프로그램은 기후 변화, 자원 부족, 인구 증가라는 점점 커지는 도전에 대처하는 데 도움이 될 것입니다. 지속 가능한 농업을 지원함으로써 독일은 농촌 지역의 생계를 개선하고 빈곤을 줄이며 세계 식량 체계를 강화하여, 농업 파트너들이 장기적인 안정과 번영의 혜택을 누리도록 보장하고자 합니다."
 GER_Strategic_Partnership_Japan: "일본과의 전략적 제휴"
 GER_Strategic_Partnership_Japan_desc: "독일은 기술 교류, 재생에너지, 무역과 같은 분야에 초점을 맞추어 일본과의 전략적 파트너십을 확대할 것입니다. 선도적인 두 산업 국가로서 독일과 일본은 경제 성장, 기술 진보, 세계 안정이라는 공통의 목표를 공유합니다. 이 파트너십은 디지털 기반시설과 첨단 제조업을 비롯한 핵심 분야에서 협력을 심화하여 혁신과 세계적 영향력을 위한 강력한 동맹을 만들어 낼 것입니다."
 GER_Strategic_Partnership_South_korea: "남한과의 전략적 제휴"
 GER_Strategic_Partnership_South_korea_desc: "독일은 무역, 기술, 교육 분야의 협력을 강조하며 한국과의 전략적 파트너십을 강화할 것입니다. 동아시아의 핵심 국가인 한국은 독일 기업과 연구 기관에 귀중한 기회를 제공합니다. 이 파트너십은 이 지역에서 독일의 영향력을 높이는 한편, 민주주의, 혁신, 지속 가능한 발전이라는 공통의 가치를 증진할 것입니다."
 GER_Strategic_Partnership_South_Afrika: "남아프리카와의 전략적 제휴"
 GER_Strategic_Partnership_South_Afrika_desc: "독일은 지속 가능한 발전, 무역, 교육에 초점을 맞추어 남아프리카 공화국과의 전략적 파트너십을 강화할 것입니다. 아프리카 대륙의 선도 국가인 남아프리카 공화국은 독일이 아프리카에 관여하는 데 필수적인 파트너입니다. 이 파트너십은 기후 변화, 경제적 불평등, 정치적 안정과 같은 핵심 문제를 다루며 상호 성장을 촉진하고, 아프리카의 장기적 발전에 대한 독일의 의지를 더욱 확고히 할 것입니다."
 GER_Strategic_Partnership_Vietnam: "베트남과의 전략적 제휴"
 GER_Strategic_Partnership_Vietnam_desc: "독일은 무역, 교육, 재생에너지에 초점을 맞추어 베트남과의 전략적 파트너십을 확대할 것입니다. 동남아시아에서 가장 빠르게 성장하는 경제 중 하나인 베트남은 독일 기업과 투자에 중요한 기회를 제공합니다. 이 파트너십은 지속 가능한 발전, 경제 협력, 문화 교류를 촉진하여 독일을 이 지역의 급속한 현대화와 성장에서 핵심 파트너로 자리매김시킬 것입니다."
 GER_International_business: "국제 비즈니스"
 GER_International_business_desc: "독일은 흔히 스스로를 \\"수출 월드챔피언(Exportweltmeister)\\", 즉 '수출 세계 챔피언'이라 칭합니다. 독일 경제는 전통적으로 상당한 무역 흑자를 기록해 왔으며, 다른 산업 국가에 파는 물량이 독일이 그들에게서 사들이는 물량보다 훨씬 많았습니다. 수출 친화적 정책을 지속하려면 상당한 수준의 대외 정치적 실용주의가 필요합니다. 결국 독재자의 돈도 인기 있는 지도자의 돈과 똑같이 값어치가 있기 때문입니다."
 GER_Industrial_outsourcing: "산업 아웃소싱"
 GER_Industrial_outsourcing_desc: "독일 산업 부문은 임금 상승과, 헝가리, 슬로바키아, 루마니아, 불가리아처럼 사정이 어려운 유럽 시장으로의 노동 이동 자유화로 인해 크게 약화되었습니다. 독일 정부는 중국처럼 더 적대적인 경쟁국에 일자리를 빼앗기지 않도록 정부 보조금과 EU 인센티브로 산업체의 이전을 통제해야 합니다."
 GER_Berlin_shithole: "파산한 국가"
 GER_Solidaritatszuschlag: "연대세(Solidaritätszuschlag)"
 GER_Mehrwertsteuer: "부가가치세(Mehrwertsteuer)"
 GER_blame_for_BSE: "광우병 책임 추궁"
 GER_invite_to_garisson: "무력 시위에 초청됨"
 GER_Ideas_Polish_labour.t: "독일 경제 속의 폴란드 노동력"
 GER_Ideas_Polish_labour.d: "폴란드 노동자들은 수확 일손, 숙련 기능공, 돌봄 인력으로서 필수적인 역할을 채우며 독일 경제에서 없어서는 안 될 존재가 되었습니다. 폴란드에서보다 훨씬 많은 돈을 벌 수 있다는 기회에 이끌린 이들은 독일의 노동 시장을 떠받칠 뿐 아니라 귀중한 전문성과 헌신도 가져옵니다. 이들의 기여는 유럽 노동 시장의 상호 연결성을 보여 주며, 경제 성장을 지속하기 위해 외국인 노동자에 대한 공정한 대우와 통합 노력이 중요함을 강조합니다."
 GER_Legacy_mod: "독일의 유산"
 GER_Rafid_Ahmed_Alwan_al_Janabi: "라피드 아흐메드 알완 알자나비"
 GER_Philipp_Schaaf: "필리프 샤프"
 GER_Khalid_al_Masri: "칼리드 알마스리"
 GER_Gerhard_Conrad: "게르하르트 콘라트"
 GER_Erich_schmidt_eenbloom: "에리히 슈미트에엔붐"
 GER_end_V_Fall: "국방 사태 종료"
 GER_end_V_Fall_desc: "이제 방위 상태의 종료를 공식적으로 선언하고 정상 운영으로 복귀할 때입니다. 이를 통해 우리는 정상적인 통치를 회복하고, 민간 감독을 복원하며, 모든 기관의 표준 기능을 재개하여 안정과 일상으로의 복귀를 보장합니다."
 GER_winds.1.t: "주둔지에서 발견된 극단주의 선전물"
 GER_winds.1.d: "우리 주둔지 중 한 곳의 병사가 동료들 사이에 극단주의 선전물을 배포한 혐의로 체포되었습니다. 이 사건은 우리 군 내에 그러한 이념이 존재한다는 점에 대해 심각한 우려를 불러일으켰으며, 사태 확대를 막기 위한 신속한 대응을 요구합니다."
 GER_winds.1.a: "전면적인 조사와 공개 단속에 착수한다"
 GER_winds.1.b: "고립된 비위 행위로 축소한다"
 GER_winds.2.t: "병력 사이에서 발견된 극단주의적 언사"
 GER_winds.2.d: "병력 사이에서 극단주의적 언사가 퍼지고 있다는 보고가 나왔으며, 신병 훈련에서 유사한 사건이 있었다는 스캔들도 함께 불거졌습니다. 이 상황은 연방군의 평판을 더럽히고 민주주의 가치에 대한 우리의 헌신에 대한 대중의 신뢰를 훼손할 위험이 있습니다."
 GER_winds.2.a: "무관용 정책과 체계적 개혁을 시행한다"
 GER_winds.2.b: "내부 잡담은 무시한다. 사기가 최우선이다"
 GER_winds.3.t: "숨겨진 무기고 발견"
 GER_winds.3.d: "극단주의 단체로 의심되는 집단과 관련하여 최신 및 구형 연방군 재고를 모두 포함한 무기고가 발견되었습니다. 이 발견은 우리 보급망 보안의 잠재적 구멍을 드러내며 군 자산을 확보하고 추적하기 위한 즉각적인 조치를 요구합니다."
 GER_winds.3.a: "자산을 압수하고 연루자 전원을 기소한다"
 GER_winds.3.b: "군 정보기관이 조용히 처리하게 한다"
 GER_winds.4.t: "언론, 병사들이 운영하는 극단주의 블로그 폭로"
 GER_winds.4.d: "언론사들이 병사 집단이 운영하며 반민주적 수사를 퍼뜨리는 극단주의 블로그를 밝혀냈습니다. 이 폭로는 연방군에 대한 대중의 신뢰를 위협하며 인원 심사에 대한 심각한 의문을 제기합니다."
 GER_winds.4.a: "해당 플랫폼을 공개 규탄하고 심사 체계를 전면 개편한다"
 GER_winds.4.b: "언론을 침묵시키고 내부적으로 사건을 종결한다"
 GER_winds.5.t: "제대 후 퇴역 군인의 급진화"
 GER_winds.5.d: "일부 전직 군인들이 임무 이후 급진화의 징후를 보이며 민간 생활에 재적응하는 데 어려움을 겪고 있습니다. 보고에 따르면 이들이 극단주의 모임에 끌려들어가고 있어 사회 안정에 대한 위협이 커지고 있습니다."
 GER_winds.5.a: "전국적인 퇴역 군인 관리 및 지원 프로그램을 시작한다"
 GER_winds.5.b: "고립되고 과장된 추세로 일축한다"
 GER_winds.6.t: "쿠데타"
 GER_winds.6.d: "군 지도부와 민간 정부 사이에 고조되던 긴장이 한계점에 도달했습니다. 비공개 자리에서 고위 장교와 보안 관계자들은 정치적 마비, 이념적 극단주의라고 인식되는 것, 그리고 그들이 '국가 방향의 위기'라 부르는 것에 대한 불만을 점점 더 토로하고 있습니다.\n\n한편 민간 정부는 위헌적 행위와 민주적 제도를 훼손하는 비밀 조직망에 대해 경고하고 있습니다.\n\n나라는 숨을 죽이고 있습니다. 충성이 시험대에 오를 것이며, 군은 이제 결정해야 합니다. 지휘 체계를 따를 것인가, 아니면 국가 구원의 이름으로 행동할 것인가?"
 GER_winds.6.a: "세력 균형이 조용히, 혹은 무력으로 바뀌게 놔둔다"
 GER_SAPOS_CHI_I: "§Y베이더우 위성 항법 시스템 접근권을 임차합니다.§!\n사용 가능한 항법 위성이 증가합니다"
 GER_SAPOS_CHI_II: "§Y베이더우 접근 계약을 재협상해야 합니다.§!"
 GER_SAPOS_SOV_I: "§YGLONASS 위성 항법 시스템 접근권을 임차합니다.§!\n사용 가능한 항법 위성이 증가합니다"
 GER_SAPOS_SOV_II: "§YGLONASS 접근 계약을 재협상해야 합니다.§!"
 GER_SAPOS_USA_I: "§YGPS 위성 항법 시스템 접근권을 임차합니다.§!\n사용 가능한 항법 위성이 증가합니다"
 GER_SAPOS_USA_II: "§YGPS 접근 계약을 재협상해야 합니다.§!"
 GER_citizen_in_uniform: "제복을 입은 시민"
 GER_citizen_in_uniform_desc: "'제복을 입은 시민' 원칙은 연방군의 초석으로, 군인이 단순한 군 인력이 아니라 민주 사회의 책임 있는 구성원이기도 하다는 점을 강조합니다. 내적 지도(Innere Führung)라는 개념에 뿌리를 둔 이 교리는 모든 남녀 군인이 헌법적 가치를 수호하고 인권을 존중하며 민간 정부에 책임을 지도록 보장합니다. 비판적 사고, 윤리적 책임, 민주적 충성심을 함양함으로써 우리는 국민 위에 군림하지 않고 국민을 위해 봉사하는 군대를 유지합니다."
 GER_Eurofighter.1.t: "유로파이터 타이푼 인도 기념식"
 GER_Eurofighter.1.d: "독일 항공사에서 이정표가 세워졌습니다. 오늘 독일 공군은 최초의 유로파이터 타이푼 1차 물량을 공식 인수합니다. 유럽 파트너들과 협력하여 개발된 유로파이터는 노후화된 전투기를 최첨단 기술로 대체하며 공중전 능력의 도약을 상징합니다. 고위 관리들이 참석한 인도 기념식은 현대적이고 유능한 공군에 대한 독일의 의지를 상징합니다. 첨단 항전 장비, 뛰어난 기동성, 다목적 기능을 갖춘 유로파이터 타이푼은 향후 수십 년간 독일 영공을 지켜 낼 것입니다."
 GER_Eurofighter.1.a: "독일 공군의 새로운 시대가 시작된다!"
 GER_Support_heimatverein: "향토 협회 지원"
 GER_Support_heimatverein_desc: "향토 협회(heimatverein), 즉 지역 문화 동호회는 지역 전통을 보존하고 공동체 정신을 기르는 데 중요한 역할을 합니다. 이러한 단체를 지원함으로써 독일 정부는 통일된 민족 정체성 안에서 문화적 다양성을 유지하고자 합니다. '우리의 힘은 지역의 다양성에 있다'고 헬무트 콜 전 총리는 말했습니다. 이 협회들은 관습과 지역 유산을 보존함으로써 독일의 사회적 결속에 기여합니다."
 GER_Day_of_open_garrison: "병영 개방의 날"
 Germany_Mech.9.t: "영국군, 독일에서 철수"
 Germany_Mech.9.d: "수십 년 동안 영국군은 독일에 주둔하며 군사 협력과 유럽 안보에 기여해 왔습니다. 이제 그들의 기지는 비어 있고 숙소는 버려졌습니다. 어떤 이들은 이를 우정과 동맹의 시대가 끝나는 것으로 보고, 다른 이들은 과거 점령의 마지막 잔재가 마침내 사라지는 것으로 봅니다."
 Germany_Mech.9.a: "동맹국에 진심 어린 작별을."
 Germany_Mech.9.b: "마침내 점령자들이 떠났다."
 Germany_Mech.10.t: "미군, 독일 땅에서 철수"
 Germany_Mech.10.d: "마지막 미군 병력이 독일의 기지를 떠나면서 여러 세대 동안 이어진 군사적 주둔의 한 장이 막을 내렸습니다. 한때 NATO 유럽 방위의 초석이었던 이 주둔지들은 이제 텅 비어 있습니다. 어떤 이들에게는 믿음직한 파트너와의 씁쓸한 작별이며, 다른 이들에게는 오래전에 이루어졌어야 할 외세의 철수입니다."
 Germany_Mech.10.a: "잘 가시오, 오랜 친구들이여."
 Germany_Mech.10.b: "점령자들은 더 이상 환영받지 못한다!"
 GER_Cold_War.10.t: "전 연방군 주둔지의 미래"
 GER_Cold_War.10.d: "연방군의 재편과 규모 축소로 인해 많은 옛 주둔지가 더 이상 필요하지 않게 되었습니다. 일부는 전략적으로 의미 없는 위치에 있고, 다른 일부는 새로운 용도로 활용될 수 있습니다. 이 부지들을 어떻게 해야 할까요?"
 GER_Cold_War.10.a: "민간 기반 시설로 전환한다."
 GER_Cold_War.10.b: "향후 군사적 활용을 위해 보존한다."
 GER_Cold_War.10.c: "민간 투자자에게 매각한다."
 GER_Cold_War.11.t: "전 영국군 주둔지의 운명"
 GER_Cold_War.11.d: "영국군이 독일에서 점차 철수함에 따라 그들의 옛 주둔지 여러 곳이 비어 있습니다. 이 군사 부지에는 한때 수천 명의 병사와 그 가족이 살았으나, 지금은 냉전의 텅 빈 유물로 남아 있습니다. 이를 용도 전환해야 할까요, 아니면 역사가 그 운명을 정하도록 놔두어야 할까요?"
 GER_Cold_War.11.a: "주택과 상업 지구로 바꾼다."
 GER_Cold_War.11.b: "군사 훈련장으로 유지한다."
 GER_Cold_War.11.c: "냉전 시대의 역사 유적지로 보존한다."
 GER_news.03.t: "에어프랑스 4590편 추락, 109명 사망"
 GER_news.03.d: "파리에서 뉴욕으로 향하던 국제 전세 운항 콩코드 여객기 에어프랑스 4590편이 이륙 직후 추락했습니다. 이 항공기는 이륙 2분 후 인근 고네스의 호텔로 추락했습니다. 탑승한 승무원 9명과 승객 100명(그중 96명이 독일인)이 전원 사망했으며, 호텔 내 4명도 숨졌습니다. 호텔에 있던 다른 6명은 중상을 입었습니다.\n\n공식 조사는 프랑스 사고조사국인 민간항공안전조사분석국(BEA)이 실시했습니다. 사고 후 조사에서 해당 항공기는 주변 기온과 기타 조건에 따른 최대 이륙 중량을 초과했으며 최대 구조 중량보다 810kg(1,790lb) 초과한 상태였고, 무게 중심이 이륙 한계보다 뒤쪽에 오도록 적재되었음이 밝혀졌습니다."
 GER_news.03.a: "유럽 항공에 대한 비극적 타격"
 GER_news.04.t: "탈레반, 바미얀의 고대 불상 파괴"
 GER_news.04.d: "2001년 3월 12일, 아프가니스탄의 탈레반 정권은 바미얀 계곡 절벽에 새겨진 두 기의 거대한 조각상인 바미얀 고대 불상을 파괴했습니다. 문화적, 역사적으로 중요한 이 유물은 1,500년 넘게 서 있으며 이 지역의 풍부한 불교 유산을 상징했습니다. 국제 사회는 이 행위를 세계 유산에 대한 심각한 손실로 규탄했습니다."
 GER_news.04.a: "인류 역사에 대한 비극적 타격이다."
 GER_news.05.t: "'굿바이 레닌!', 2002 베를리날레에서 초연"
 GER_news.05.d: "2002년 베를리날레 영화제에서 독일 영화 '굿바이 레닌!'이 초연되어 비평가들의 큰 찬사를 받았습니다. 독일 통일 직후를 배경으로 한 이 희비극은 병약한 어머니에게 베를린 장벽의 붕괴를 숨기는 한 청년의 이야기를 그립니다. 이 영화는 통일 이후 독일의 정체성과 동서의 충돌에 대한 유머러스하면서도 가슴 뭉클한 성찰을 제공합니다."
 GER_news.05.a: "한 국가의 정신을 담아낸 영화다."
 GER_news.06.t: "PISA 쇼크 - 독일, 평균 이하 점수"
 GER_news.06.d: "2002년 PISA 연구 결과가 독일에 충격파를 일으켰습니다. 15세 학생을 대상으로 한 이 국제 평가에서 독일 학생들은 읽기, 수학, 과학에서 OECD 평균 이하의 성적을 거둔 것으로 드러났습니다. 이 결과는 독일 교육 제도의 현실에 대한 전국적 논쟁을 촉발하여 대대적인 개혁 요구가 이어졌습니다."
 GER_news.06.a: "독일 교육에 대한 경종이다."
 GER_news.07.t: "2000년 러브 퍼레이드 - 음악과 자유의 축제"
 GER_news.07.d: "베를린의 2000년 러브 퍼레이드는 100만 명이 넘는 방문객을 끌어모아 전자 음악, 자유, 화합을 기념했습니다. 본래 평화와 음악을 위한 작은 시위로 시작된 이 연례 행사는 현대 독일 청년 문화의 상징으로 성장하여, 전 세계의 레이버들이 수도의 중심에서 춤추도록 불러모으고 있습니다."
 GER_news.07.a: "베를린, 세계 테크노의 수도."
 GER_news.08.t: "제국의회 유리 돔, 일반에 개방"
 GER_news.08.d: "2001년 제국의회 건물 위에 새로 완공된 유리 돔이 일반에 공개되어 방문객들에게 베를린의 전경을 선사했습니다. 건축가 노먼 포스터 경이 설계한 이 투명한 돔은 정부의 개방성과 투명성을 상징하며 현대 독일 민주주의의 랜드마크가 되었습니다."
 GER_news.08.a: "민주주의의 심장부를 투명하게 들여다본다."
 GER_news.09.t: "키르히 미디어 제국의 붕괴"
 GER_news.09.d: "2002년 독일 최대 미디어 복합 기업 중 하나인 키르히 그룹이 파산을 신청했습니다. 이 붕괴는 전후 독일 최대의 기업 실패 중 하나로, 독일 미디어 지형에 충격파를 일으켰습니다. 쌓여 가는 부채와 실패한 투자 속에서 키르히의 몰락은 독일 미디어 산업의 구조적 약점을 드러냈습니다."
 GER_news.09.a: "미디어 거인이 쓰러진다."
 GER_news.10.t: "트란스라피트 시험 선로 참사"
 GER_news.10.d: "2006년 9월 22일, 독일의 최첨단 트란스라피트 자기부상열차가 엠스란트의 시험 선로에서 비극적인 사고를 당했습니다. 정비 차량이 실수로 선로에 남겨져 있었고, 그 결과 참혹한 충돌로 23명이 목숨을 잃었습니다. 이 사고는 자기부상 기술을 선도하려는 독일의 야심에 오랫동안 그림자를 드리웠습니다."
 GER_news.10.a: "독일 혁신의 비극이다."
 GER_news.11.t: "쾰른 시립 문서보관소 붕괴, 독일에 충격"
 GER_news.11.d: "2009년 3월 3일, 쾰른 시립 문서보관소 건물이 인접한 공사 구덩이로 갑자기 무너져 수 세기에 걸친 수많은 역사 문서가 사라졌습니다. 부실한 지하 공사로 인한 것으로 지목된 이 붕괴는 전후 독일 최대의 문화적 재앙 중 하나로 평가됩니다."
 GER_news.11.a: "역사에 값을 매길 수 없는 손실이다."
 GER_news.12.t: "폭스바겐 감사회 스캔들 전개"
 GER_news.12.d: "2009년 독일의 자동차 거인 폭스바겐은 감사회 고위 구성원들이 연루된 스캔들에 휘말렸습니다. 회사 자금의 부적절한 사용, 호화 여행, 개인적 특혜 의혹은 독일의 가장 상징적인 기업 중 하나의 최고위층 지배 구조 문제를 부각시켰습니다. 이 사건은 폭스바겐의 평판을 훼손하고 더 엄격한 감독을 요구하는 목소리를 불러왔습니다."
 GER_news.12.a: "부패가 자동차 거인을 더럽힌다."
 GER_Idea_Innere_fuhrung_II: "독일 연방방위군의 내적 지도 개념"
 GER_idea_bfv_islamist_high: "연방헌법보호청"
 GER_idea_bfv_islamist_med: "연방헌법보호청"
 GER_idea_bfv_islamist_low: "연방헌법보호청"
 GER_idea_bfv_rightwing_high: "연방헌법보호청"
 GER_idea_bfv_rightwing_med: "연방헌법보호청"
 GER_idea_bfv_rightwing_low: "연방헌법보호청"
 GER_idea_bfv_leftwing_high: "연방헌법보호청"
 GER_idea_bfv_leftwing_med: "연방헌법보호청"
 GER_idea_bfv_leftwing_low: "연방헌법보호청"
 GER_Armored_Rec_TT: "경정찰 차량에만 의존하는 대신, 더 장갑화된 플랫폼을 도입하여 전투 가능한 정찰을 가능하게 할 수 있습니다. 이 접근은 더 높은 생존성과 화력을 보장하여, 정찰 임무를 수행하면서도 필요할 때 적과 교전할 수 있게 합니다."
 GER_Cold_War.21.c: "비용이 많이 들더라도 현재 규모를 유지한다."
 GER_Cold_War.26.t: "영토방위군 재편"
 GER_Cold_War.26.d: "연방군 기반 조직(Streitkräftebasis)이 창설됨에 따라 영토방위군(Territorialheer)의 존속에 의문이 제기되고 있습니다. 별도의 지휘 계통과 중복된 지원 구조를 유지하는 것은 더 이상 현대 군사 교리에 부합하지 않습니다. 이제 이 부대들을 어떻게 할지 결정해야 하며, 이 선택은 앞으로 수년간 우리의 내부 군사 조직을 좌우할 것입니다."
 GER_Cold_War.26.a: "부대를 해체하고 구조를 폐지한다"
 GER_Cold_War.26.b: "병력을 줄이되 일부 능력은 유지한다"
 GER_Cold_War.26.c: "연방군 기반 조직에 완전히 통합한다"
 GER_idea_Sickman: "유럽의 병자"
 GER_idea_BND: "연방정보부(BND)"
 balkan_stability_20: "보통 수준의 긴장"
 balkan_stability_30: "긴장 고조"
 balkan_stability_40: "분쟁 임박"
 balkan_stability_50: "개입 필요"
 balkan_stability_60: "화염에 휩싸임"
 get_active_in_balkans: "발칸 활동에 적극 참여"
 retreat_from_balkans: "발칸에서 철수"
 Rearm_the_Balkans: "[FROM.GetName] 파트너 재무장 지원"
 support_nationalist_movements: "민족주의 운동 지원"
 Send_peacekeepers_SOV: "군사 기지 개설"
 Send_peacekeeper: "군사 기지 개설"
 Balkan.1.t: "코소보를 공격하는 세르비아!"
 Balkan.1.d: "세르비아군이 코소보에 대한 군사 공세를 개시하면서 발칸의 긴장이 다시 한번 공공연한 분쟁으로 터져 나왔습니다. 압도적인 압박에 직면한 코소보 정부는 국제 사회에 도움을 요청했습니다. 우리는 그들의 동맹으로서 어떻게 대응할지 결정해야 합니다. 우리 병력을 투입하여 방어를 도울 것인가, 군사 원조를 제공할 것인가, 아니면 우리 병사들을 보호하기 위해 직접 개입을 피할 것인가?"
 Balkan.1.a: "우리도 싸움에 참여한다!"
 Balkan.1.b: "장비와 물자를 보낸다."
 Balkan.1.c: "우리 병사들의 목숨을 걸 가치가 없다."
 Balkan.101.t: "코소보에 대한 동맹의 지원!"
 Balkan.101.d: "우리의 동맹국들이 우리의 요청에 응하여 코소보 방어를 위해 병력을 투입했습니다. 그들의 도움으로 이제 세르비아의 침략을 격퇴하고 코소보의 주권을 지킬 가능성이 더욱 커졌습니다."
 Balkan.101.a: "함께라면 우리는 승리할 것이다!"
 Balkan.102.t: "코소보에 군사 원조 도착"
 Balkan.102.d: "우리의 동맹국들이 직접 개입하지 않기로 했지만, 절실히 필요한 무기와 물자를 보내 주었습니다. 이는 방어를 강화해 주지만, 그들의 병력이 없는 탓에 우리는 세르비아 공격의 정면을 홀로 감당해야 합니다."
 Balkan.102.a: "적어도 완전히 버려진 것은 아니다."
 Balkan.103.t: "홀로 선 코소보"
 Balkan.103.d: "우리의 절박한 도움 요청에도 불구하고 이른바 동맹국들은 병력이나 물자를 보내기를 거부했습니다. 이제 코소보는 한정된 자체 자원만으로 세르비아의 군사력에 맞서야 합니다. 이 배신은 잊히지 않을 것입니다."
 Balkan.103.a: "우리는 이것을 기억할 것이다."
 Balkan.2.t: "도움을 요청하는 보스니아!"
 Balkan.2.d: "세르비아군이 보스니아에 대한 공세적인 작전을 개시하여 지역 전체를 불안정하게 할 위험이 있습니다. 보스니아 정부는 우리에게 원조를 요청했습니다. 우리는 그들과 함께 서서 병력을 보낼 것인가, 군수 물자를 제공할 것인가, 아니면 우리 병력을 위험에 빠뜨리지 않기 위해 분쟁에서 손을 뗄 것인가?"
 Balkan.2.a: "우리도 싸움에 참여한다!"
 Balkan.2.b: "무기와 물자를 보낸다."
 Balkan.2.c: "이것은 우리의 전쟁이 아니다."
 Balkan.201.t: "보스니아에 도착한 동맹군"
 Balkan.201.d: "우리의 동맹국들이 보스니아의 도움 요청에 응하여 세르비아의 공세를 격퇴하기 위해 병력을 투입했습니다. 이들의 지원은 우리의 입지를 강화하고 세르비아의 침략에 맞선 조율된 노력을 보장합니다."
 Balkan.201.a: "단결하면 우리는 승리할 것이다!"
 Balkan.202.t: "보스니아를 위한 무기"
 Balkan.202.d: "우리의 동맹국들은 병력 파견을 거부했지만 보스니아에 절실히 필요한 무기와 자원을 공급했습니다. 이는 보스니아군이 자국 영토를 방어하는 데 도움이 되겠지만, 외부의 군사적 지원이 없는 탓에 전투의 향방은 여전히 불확실합니다."
 Balkan.202.a: "적어도 어느 정도 후원은 있다."
 Balkan.203.t: "홀로 싸우도록 방치된 보스니아"
 Balkan.203.d: "거듭된 지원 요청에도 불구하고 이른바 동맹국들은 보스니아에 등을 돌렸습니다. 외부의 지원이 없는 이상 보스니아 정부는 이제 세르비아의 침략에 저항하기 위해 오로지 자체 힘에 의존해야 합니다."
 Balkan.203.a: "이 배신을 잊지 않겠다."
 Balkan.3.t: "과거의 영광을 되찾으려는 크로아티아"
 Balkan.3.d: "크로아티아 정부는 발칸에서 과거의 지위와 영향력을 되찾겠다는 야망을 공개적으로 선언했습니다. 새롭게 불붙은 이 민족주의는 이웃 나라와 국제 사회의 우려를 불러일으키고 있습니다. 크로아티아는 위대함을 추구하며 어디까지 나아갈 것인가?"
 Balkan.3.a: "이 지역에 대담한 행보다."
 Balkan.301.t: "내부로 눈을 돌린 크로아티아"
 Balkan.301.d: "민족주의 열기가 나라를 휩쓰는 가운데, 크로아티아는 모든 서방 군대가 자국 영토에서 활동할 수 있는 허가를 철회했습니다. 긴장이 고조되면서 지역에는 불확실성이 드리우고 있습니다. 다음에 무엇이 올지 누가 알겠습니까?"
 Balkan.301.a: "여파가 있을 수 있다."
 Balkan.302.t: "러시아에 지원을 호소하는 크로아티아"
 Balkan.302.d: "크로아티아가 슬라브 민족의 의심할 여지 없는 수호자인 영광스러운 러시아, 즉 우리에게 도움을 요청했습니다. 직접적인 지원은 NATO를 자극할 위험이 있지만, 공공연한 분쟁을 초래하지 않고 은밀하게 그들을 도울 방법은 있습니다."
 Balkan.302.a: "장비와 병사 몇 명을 보낸다. 음, 그러니까… 지원병들을."
 Balkan.302.b: "지원병 몇 명 정도는 의심을 사지 않을 것이다."
 Balkan.302.c: "무의미한 전쟁에 비해 너무 위험하다."
 Balkan.303.t: "크로아티아를 강화하는 러시아의 지원"
 Balkan.303.d: "러시아가 제공한 장비와 인력은 크로아티아의 군사력을 크게 강화했습니다. 러시아의 후원에 힘입어 크로아티아는 이제 민족주의 노선을 추진하기에 더 강력한 위치에 서게 되었습니다."
 Balkan.303.a: "러시아의 변함없는 지원에 감사한다!"
 Balkan.304.t: "'지원병' 해법"
 Balkan.304.d: "러시아의 '지원병'들이 은밀하게 크로아티아군에 합류하여 전문 지식을 제공하고 병력을 보강하고 있습니다. 세계는 러시아의 개입을 의심할 수도 있지만, 그럴듯한 부인 가능성은 아직까지 온전히 유지되고 있습니다."
 Balkan.304.a: "러시아의 '친절한 지원병'들은 언제나 환영이다."
 Balkan.305.t: "크로아티아의 호소를 거절한 러시아"
 Balkan.305.d: "크로아티아의 요청에도 불구하고 크렘린은 크로아티아의 민족주의적 열망에 개입하지 않기로 결정했습니다. 스스로 알아서 해야 하는 처지가 된 크로아티아는 이제 야망을 이룰 다른 길을 찾아야 합니다."
 Balkan.305.a: "수카 블랴트!"
 Balkan.4.t: "과거의 영광을 되찾으려는 알바니아"
 Balkan.4.d: "알바니아 지도부는 과거의 위상을 되찾자고 주창하기 시작했으며, 이는 민족주의 정서를 자극하고 지역의 우려를 불러일으키고 있습니다. 그들의 야망은 어디까지 이어질 것인가?"
 Balkan.4.a: "이 지역에 대담한 행보다."
 Balkan.401.t: "서방 군대를 추방하는 알바니아"
 Balkan.401.d: "민족주의적 이상에 이끌린 알바니아는 서방 군대가 자국 영토에서 활동할 수 있는 모든 허가를 철회했습니다. 외국의 감시가 사라진 이상 그들의 다음 행보는 예측할 수 없습니다."
 Balkan.401.a: "불안정으로 이어질 수 있다."
 Balkan.402.t: "러시아의 원조를 구하는 알바니아"
 Balkan.402.d: "놀랍게도 알바니아가 강대한 러시아, 즉 우리에게 자국의 야망을 지원해 달라고 요청했습니다. 직접적인 개입은 NATO를 자극할 수 있지만, 공공연한 분쟁을 일으키지 않고 은밀하게 그들을 도울 방법은 있습니다."
 Balkan.402.a: "장비와 병사 몇 명을 보낸다. 음, 그러니까… 지원병들을."
 Balkan.402.b: "지원병 몇 명 정도는 의심을 사지 않을 것이다."
 Balkan.402.c: "무의미한 전쟁에 비해 너무 위험하다."
 Balkan.403.t: "알바니아를 강화하는 러시아의 지원"
 Balkan.403.d: "러시아의 원조 덕분에 알바니아는 이제 현대화된 장비와 전술적 전문 지식을 보유하게 되었습니다. 이들의 민족주의 운동은 상당한 동력을 얻었으며, 앞으로 벌어질 수 있는 분쟁의 무대를 마련하고 있습니다."
 Balkan.403.a: "러시아의 대단한 지원에 감사한다!"
 Balkan.404.t: "'지원병' 해법"
 Balkan.404.d: "러시아의 '지원병'들이 은밀하게 알바니아군에 합류하여 그들의 능력을 높이고 자신감을 북돋우고 있습니다. NATO가 의심을 품고 있음에도 러시아와 이 작전을 직접 연결하는 증거는 없습니다."
 Balkan.404.a: "러시아의 '친절한 지원병'들에게 감사한다!"
 Balkan.405.t: "알바니아의 요청을 거절한 러시아"
 Balkan.405.d: "알바니아의 호소에도 불구하고 모스크바는 이 사태에서 손을 떼기로 했습니다. 외부의 지원이 없는 이상 알바니아는 민족주의적 야망을 스스로 추구해야 할 것입니다."
 Balkan.405.a: "수카 블랴트!"
 Balkan.5.t: "러시아의 개입을 보고한 영국 정보기관"
 Balkan.5.d: "영국 정보기관 MI6는 러시아가 발칸의 민족주의 운동에 은밀히 무기를 공급하고 지원하고 있음을 시사하는 증거를 제시했습니다. 사실이라면 이는 지역을 불안정하게 하고 평화를 유지하려는 국제적 노력을 훼손할 수 있습니다. 이 우려스러운 조사 결과에 어떻게 대응해야 하겠습니까?"
 Balkan.5.a: "모스크바에 항의 서한을 보낸다."
 Balkan.5.b: "과잉 반응해서는 안 된다."
 Gruner_news.1.t: "소속 기자 살해 사건을 조사하는 슈테른"
 Gruner_news.1.d: "1999년 6월 13일, 슈테른 기자 가브리엘 그뤼너와 폴커 크레머, 그리고 이들의 통역사 세놀 알리트가 코소보에서 살해되었습니다. 처음에는 이들이 집단 매장지를 찾던 중 함정에 유인되었다는 소문이 돌았으나, 슈테른은 자체 조사에 착수했습니다. 기자들은 프리즈렌에서 돌아오던 길에 안전하다고 여겨지던 둘리에 고개를 택했습니다. 유고슬라비아군 검문소에서 KFOR 병력을 피해 달아나던 러시아인 용병 알렉산더 T.가 차량을 충돌시킨 뒤 절박한 나머지 슈테른 차량에 총격을 가해 크레머와 알리트가 즉사했습니다. 그뤼너는 이후 부상으로 숨졌습니다. 알렉산더 T.는 그들의 차량을 훔쳐 달아났습니다. 이제 함부르크 법원은 그가 모스크바에 거주하고 있다고 알려진 만큼 그에 대한 국제 체포 영장을 발부할지 결정할 것입니다."
 Gruner_news.1.a: "흥미롭다"
 Gruner.1.t: "러시아 시민에 대한 국제 체포 영장을 검토하는 함부르크 법원"
 Gruner.1.d: "1999년 6월, 슈테른 기자 가브리엘 그뤼너와 폴커 크레머, 그리고 이들의 통역사 세놀 알리트가 코소보에서 비극적으로 살해되었습니다. 이후 슈테른의 조사는 러시아인 용병 알렉산더 체르노마첸체프를 범인으로 지목했습니다. 체르노마첸체프는 1998년 지원병으로 유고슬라비아군에 합류했으며 사건 직후 세르비아의 고향에서 목격된 것으로 알려졌습니다. 2001년에는 모스크바에 거주하며 경비원으로 일하는 것으로 추정되었습니다. 함부르크 법원은 현재 수집된 증거가 체르노마첸체프에 대한 국제 체포 영장을 발부하기에 충분한지 검토하고 있습니다. 러시아 헌법이 자국민의 인도를 금지하고 있어 이 결정은 국제 관계를 복잡하게 만들 수 있는 중대한 외교적 파장을 낳습니다. 피해자 가족과 언론계는 언론인을 상대로 한 범죄에 대처하는 데 국제 협력이 중요함을 강조하며 계속해서 정의를 요구하고 있습니다."
 Gruner.1.a: "증거는 확고부동하다."
 Gruner.1.b: "국제적 분쟁은 피해야 한다."
 Gruner_news.2.t: "언론인 살해 사건에 대한 국제 체포 영장 발부"
 Gruner_news.2.d: "1999년 6월 13일 코소보에서 슈테른 기자 가브리엘 그뤼너와 폴커 크레머, 그리고 이들의 통역사 세놀 알리트가 비극적으로 사망한 데 이어, 독일 당국은 범인으로 지목된 러시아인 용병 알렉산더 체르노마첸체프에 대한 국제 체포 영장을 발부했습니다. 조사에 따르면 코소보에서 달아나던 체르노마첸체프는 탈출용으로 차량을 빼앗기 위해 기자들에게 총격을 가한 것으로 알려졌습니다. Stern.de. 영장에도 불구하고 신병 인도는 여전히 가능성이 낮습니다. 모스크바에 거주하며 경비원으로 일하는 것으로 알려진 체르노마첸체프는 러시아 정보기관과 연줄이 있는 것으로 추정됩니다. 러시아 헌법은 자국민의 인도를 금지하고 있어 그를 독일 법정에 세우려는 노력이 복잡해지고 있습니다. 이러한 교착 상태는 독일과 러시아 사이의 외교 관계를 긴장시킬 수 있으며, 국내법과 지정학적 이해가 교차할 때 국제 정의가 직면하는 어려움을 부각합니다. 피해자 가족과 언론계는 전 세계 언론인을 상대로 한 범죄에 대처하는 데 협력이 필요함을 강조하며 계속해서 살인에 대한 책임을 묻고 있습니다."
 Gruner_news.2.a: "그를 잡을 수만 있다면"
 GER_news.13.t: "사하라에서 독일인 관광객 납치"
 GER_news.13.d: "약간의 모험이 곁들여진 사하라로의 짧은 단순 패키지 휴가로 계획되었던 여행이 악몽으로 변했습니다. 독일 국민 16명을 포함한 관광객 32명이 납치되었습니다. 이슬람주의 무장 조직과 연계되었을 가능성이 있는 무장 단체가 납치 배후에 있다는 소문이 커지고 있습니다.\n\n독일 정부는 이제 어려운 결정에 직면했습니다. 고국에서 멀리 떨어진 곳에서 전개되는 이 위험한 위기에 어떻게 대응할 것인가?"
 GER_news.13.a: "위기 대응팀을 구성한다"
 GER_news.14.t: "첫 번째 위기 회의: 대응 방안"
 GER_news.14.d: "우리 위기 대응팀이 상황을 평가했습니다. 알제리 당국은 지원을 제안하고 있으나 전적으로 주도권을 잡는 데는 소극적인 것으로 보입니다. 알제리를 전적으로 신뢰할지, 긴밀히 조율하되 우리가 주도할지, 아니면 자국민을 구출하기 위한 독자 행동을 준비할지 결정해야 합니다."
 GER_news.14.a: "알제리가 주도하게 하고 결과를 기다린다"
 GER_news.14.b: "알제리는 지형을 알지만 우리에게는 기술이 있다. 조율하되 통제권은 유지한다."
 GER_news.14.c: "특수부대, 항공기, 정보, 이들을 데려오기 위해 필요한 모든 수단을 동원한다."
 GER_news.15.t: "독일 전력의 사하라 배치"
 GER_news.15.d: "정부의 결정에 따라 독일 특수부대와 정찰기가 고도의 경계 태세에 들어갔습니다. 광활한 사막을 가로지르는 인질들의 이동을 추적하기 위해 감시 드론과 정보 요원들이 투입되고 있습니다.\n\n우리 병력은 이제 두 가지 병행 전략을 준비해야 합니다. 납치범들과의 협상, 그리고 협상이 결렬될 경우의 정밀 작전 실행입니다."
 GER_news.15.a: "유연성을 유지한다. 생명이 달려 있다."
 GER_news.16.t: "납치범들과 접촉 성사"
 GER_news.16.d: "중개자와 현지 채널을 통한 집중적인 노력 끝에 우리 위기 대응팀은 납치범들과 간접 접촉을 성사시켰습니다. 요구 사항이 제시되었는데 일부는 정치적이고 일부는 금전적입니다. 협상은 어렵겠지만 평화적 해결의 문은 여전히 열려 있습니다."
 GER_news.16.a: "즉시 협상을 시작한다. 한 시간 한 시간이 중요하다."
 GER_news.16.b: "준비할 시간을 주지 마라, 30분 내 출동!"
 GER_news.17.t: "협상 성공: 인질 석방 예정"
 GER_news.17.d: "며칠에 걸친 팽팽한 교신과 신중한 외교 끝에 합의가 이루어졌습니다. 인질들은 조율된 인도 절차를 통해 무사히 석방될 예정입니다. 위기 대응팀은 이들의 안전한 귀환을 확보하기 위해 대기하고 있습니다."
 GER_news.17.a: "인질 인수와 건강 검진을 준비한다."
 GER_news.18.t: "협상 결렬"
 GER_news.18.d: "납치범들과의 회담이 결렬되었습니다. 그들의 요구가 받아들일 수 없는 수준이 되었거나, 무장 세력 내부의 분열이 가능한 합의를 방해했을 것입니다. 정보 당국은 인질들이 이제 사막 더 깊숙이 이동되고 있다고 경고합니다. 외교적 해결의 시간은 지났을지도 모릅니다."
 GER_news.18.a: "기동 부대를 습격 태세로 준비시킨다."
 GER_news.19.t: "습격 작전: 참담한 실패"
 GER_news.19.d: "우리 특수부대는 극한의 조건에서 납치범들의 사막 야영지에 대한 습격을 개시했으나, 그들의 용맹에도 불구하고 작전은 혼란 속에 무너졌습니다. 인질들은 타격 직전에 옮겨졌고 무장 세력은 예상보다 격렬하게 싸웠습니다.\n\n이 시도에서 인질 여럿과 병사들이 목숨을 잃었습니다. 사막은 우리의 희망을 모래와 피 속에 집어삼켰습니다. 이제 국가적 책임 규명이 시작됩니다."
 GER_news.19.a: "독일에게 암울한 날이다."
 GER_news.20.t: "구출 작전: 부분적 성공"
 GER_news.20.d: "납치범들의 야영지에 대한 돌입으로 대다수의 인질을 구출하는 데 성공했습니다. 그러나 혼란스러운 총격전에서 모두가 살아남지는 못했습니다. 일부 가족은 사랑하는 이들을 집으로 맞이하겠지만, 다른 가족은 돌이킬 수 없는 상실을 애도할 것입니다.\n\n국가는 자부심과 슬픔 사이에 서서 구출된 이들을 기뻐하고 데려올 수 없었던 이들을 애도합니다."
 GER_news.20.a: "산 자와 쓰러진 자를 기린다."
 GER_news.21.t: "습격 작전: 완벽한 성공"
 GER_news.21.d: "구출 작전은 가장 낙관적인 예상마저 뛰어넘었습니다. 인질 전원이 안전하게 확보되었으며 납치범들은 독일인 인명 손실 없이 제압되었습니다. 특수부대는 정밀함, 신속함, 그리고 압도적인 우위로 임무를 수행했습니다.\n\n독일 전역의 언론은 이 작전을 현대 위기 대응의 교과서적 사례로 칭송하고 있습니다. 국민이 자국민의 귀환을 축하하면서 정부와 군에 대한 신뢰가 급등했습니다."
 GER_news.21.a: "독일의 흠 잡을 데 없는 승리다."
 GER_news.22.t: "인질들, 독일로 귀환"
 GER_news.22.d: "오늘 전세기가 구출된 독일 인질들을 태우고 베를린 테겔 공항에 착륙했습니다. 가족, 정부 관료, 군 인사들이 모여 이들을 맞이했습니다. 특수 기동 부대원들은 극한의 압박 속에서 보여준 용기와 헌신으로 영예를 받았습니다."
 GER_news.22.a: "우리 국가의 자랑스러운 순간이다."
 GER_news.23.t: "구출 실패 후 국가적 애도"
 GER_news.23.d: "전사자들의 유해가 삼엄한 호송 속에 독일로 돌아왔습니다. 희생자들을 기리기 위해 전국에서 엄숙한 추도식이 계획되어 있습니다. 위기 중에 내려진 모든 결정과 실수를 검토하기 위한 전면 조사가 명령되었습니다. 뮌헨 '72의 기억이 이 비극에 크게 드리워져, 세계 무대에서 실패의 대가가 얼마나 고통스러운지 일깨워 줍니다."
 GER_news.23.a: "독일에게 암울한 날이다."
 GER_news.24.t: "부분적 성공: 인질 귀환, 그러나 전원은 아님"
 GER_news.24.d: "오늘 군 수송기가 구출된 인질들을 태우고 독일 땅에 착륙했습니다. 대부분의 가족에게 이는 엄청난 안도와 감사의 순간입니다.\n\n그러나 이 안도감은 사랑하는 이들의 모험담을 다시는 들을 수 없게 된 가족들의 깊은 고통에 가려져 있습니다. 일부 부모, 자녀, 형제자매, 친구들에게는 슬픔만이 남았습니다. 이제 국가는 산 자와 죽은 자를 모두 기리고 이번 위기의 쓰라린 교훈을 배워야 합니다."
 GER_news.24.a: "씁쓸하면서도 기쁜 귀환이다."
 GER_anti_terror_help1: "인질 구출을 위한 협력"
 GER_anti_terror_help2: "인질 구출을 위한 협력"
 GER_the_Eurofighter: "독일, 유로파이터 계획에 참여"
 GER_BMW_Focus_tt: "§YBMW가 다목적 차량 개발을 시도할 것입니다§!"
 GER_GNY: "독일 해군 조선소 재편"
 GER_GNY_desc: "핵심 해군 능력에 대한 주권적 통제권을 되찾기 위한 결정적 조치로, 독일 정부는 독일 해군 조선소(GNY)를 킬에 본사를 둔 HDW 복합기업에서 공식 분리하는 것을 지원했습니다. 이 재편으로 GNY는 연방방위군과 유럽 파트너를 위한 수상함 건조, 현대화, 함대 지원에 중점을 두는 독립 법인으로 재출범합니다. 이 분리는 외국 의존을 줄이고, 산업 회복력을 높이며, 차세대 호위함과 지원함을 포함한 미래의 해양 방위 구상에 대비하기 위한 전략적 조치로 평가됩니다."
 germany.66.t: "실패한 BMW 신형 군용 지프"
 germany.66.d: "BMW는 군용 다목적 차량 시장에 진출하기를 희망하며 최초의 군용 차량을 독일 육군에 광범위한 시험을 위해 무상으로 제공했습니다. 서류상으로는 깔끔한 선, 튼튼한 휠 아치, 매끈한 캔버스 지붕으로 인상적이었습니다. 그러나 실제로는 엔진 오일 소모량이 터무니없이 높고 불과 몇 킬로미터 후에 엔진이 멈춰 버리는 등 크게 실망스러운 것으로 드러났습니다. 최근 야외 훈련 중에는 차량이 완전히 고장 나서 병사들이 20킬로미터를 걸어서 기지로 돌아와야 했습니다."
 germany.66.a: "우리는 병사가 아니라 외관을 중시한다"
 germany.66.b: "우리는 외관이 아니라 품질을 중시한다"
 germany.67.t: "헬싱 SE 설립"
 germany.67.d: "뮌헨에 본사를 둔 신생 방위 기술 기업 헬싱 SE가 민주주의 정부만을 위해 AI 기반 타격 드론과 자율 체계를 개발하기 위해 설립되었습니다. 연방 정부는 우리의 첨단 군수 산업에 대한 이러한 활력을 환영합니다."
 germany.67.a: "훌륭하군, 우리 방위에 큰 힘이 된다"
 GER_winds.7.t: "연방군에서 극단주의 일소"
 GER_winds.7.d: "민주주의 회복력의 전환점으로 환영받는 조치로서, 독일 정부는 연방군 내부에서 극우 극단주의를 뿌리 뽑기 위한 광범위한 내부 캠페인의 종료를 발표했습니다. 지난 몇 년간 일련의 스캔들과 정보 보고서가 이어진 후, 군은 이념적 침투, 역사 수정주의, 극단주의 조직망 용인에 관해 강도 높은 감시를 받았습니다.\n\n국방부는 구조 개혁, 정보 조율, 가치 기반 장교 교육의 결합을 통해 군의 청렴성을 회복했다고 주장합니다.\n\n'우리가 원하는 것은 제복을 입은 시민이지 SS의 부활이 아닙니다.'라고 정부 대변인은 선언했습니다. 대중의 신뢰는 여전히 신중하지만 메시지는 분명합니다. 연방군은 민주주의를 훼손하는 것이 아니라 수호하기 위해 존재합니다."
 GER_winds.7.a: "현대 군대에 필요한 조치다"
 GER_idea_deutsche_bahn_investments: "도이체 반 투자"
 GER_global_infrastructure_projects_tt: "한 국가가 수락하면 §Y영향력§!과 §G국제 투자§!를 얻습니다."
 GER_Strategic_Partnership_tt: "수락하면 초청받은 국가가 우리의 §Y기술 공유 그룹§!에 가입하며, 우리는 §Y영향력§!과 §G국제 수입§!을 얻습니다."
 GER_Eurofighter.2.t: "유로파이터 파생형 시험 제안"
 GER_Eurofighter.2.d: "세계 안보 환경이 분쟁 해역과 장거리 전력 투사 쪽으로 계속 이동함에 따라, 유로파이터 컨소시엄은 타이푼 기체에 대한 두 가지 특화 개량 경로를 제시했습니다. 이 파생형들은 전투기의 작전 역할을 현재의 다목적 범위 너머로 확장하는 것을 목표로 합니다.\n\n첫 번째 제안은 연안 감시, 대함 작전, 해상 타격에 최적화된 장거리 해상 초계 파생형에 초점을 맞춥니다. 강화된 레이더 통합과 확장된 연료 용량, 임무 지속 시간을 갖춘 이 파생형은 해상 항공 정찰의 현재 공백을 메울 것입니다.\n\n두 번째 안은 항공모함에서의 발진과 착함에 맞게 개조된 함재 운용 가능 유로파이터를 구상합니다. 이 구상에는 구조 보강, 착함 갈고리 통합, STOBAR 호환성이 필요하며, 독일을 유럽 미래 해군 항공의 선두에 올려놓을 가능성이 있습니다.\n\n각 제안은 서로 다른 전략적 이점을 제공합니다. 그러나 두 안 모두 상당한 자금과 교리의 전환, 그리고 지원 기반시설에 대한 장기 투자가 필요할 수 있습니다. 국방부는 이제 이러한 미래 지향적 파생형 중 하나를 채택할지, 아니면 배정된 예산을 다른 현대화 노력에 돌릴지 평가해야 합니다."
 GER_Eurofighter.2.a: "해상 초계 파생형 채택"
 GER_Eurofighter.2.a_desc: "초계 파생형은 연장된 항속거리, 해상 레이더 통합, 바다 위에서의 장시간 감시를 위한 기체 보강 개조를 갖추고 있습니다. 해상 교통로를 보호하고 분쟁 해역에서 존재감을 드러내는 데 이상적일 것입니다."
 GER_Eurofighter.2.b: "함재 운용 가능 파생형 채택"
 GER_Eurofighter.2.b_desc: "함재 운용 가능 유로파이터는 보강된 착륙장치, 착함 갈고리 체계, STOBAR 호환을 위한 구조 개조를 포함합니다. 기술적으로 야심 찬 시도이지만, 이 파생형은 해상 플랫폼에서의 항공 전력 투사를 크게 도약시킬 것입니다."
 GER_Eurofighter.2.c: "자금 전용"
 GER_Eurofighter.2.c_desc: "제안된 파생형들은 독특한 능력을 제공하지만, 현재 우리에게는 이를 배치하는 데 필요한 기반시설이나 전략적 필요가 없습니다. 대신 자원은 더 시급한 조달 또는 연구개발 프로그램에 재배정될 것입니다."
 GER_Eurofighter.3.t: "공동 최종 조립 라인 제안"
 GER_Eurofighter.3.d: "진행 중인 유로파이터 컨소시엄 조율의 일환으로, 최종 조립 공장의 구조를 간소화하고 공식화하자는 제안이 나왔습니다. 통일된 표준과 일정을 유지하면서 각 참가국에 특화된 조립 거점을 할당한다는 구상입니다. 이 접근법은 산업 협력을 강화하겠지만 생산 속도와 국가별 맞춤화에 대한 독자적 통제를 제한할 수 있습니다."
 GER_Eurofighter.3.a: "공동 조립 조율 수락"
 GER_Eurofighter.3.b: "자국 최종 조립을 독립적으로 유지"
 GER_Eurofighter.4.t: "공동 연구개발 프로그램"
 GER_Eurofighter.4.d: "유로파이터 컨소시엄은 다자 협력의 다음 단계, 즉 통합 연구개발 체계를 개시했습니다. 공학 자원, 비행 데이터, 개량 계획을 한데 모으면 모든 파트너가 동기화된 진전과 비용 절감의 혜택을 누릴 것입니다. 그러나 참여는 기술 우선순위와 수출 자율성에 대한 국가의 통제를 줄일 수 있습니다."
 GER_Eurofighter.4.a: "공동 연구개발 참여"
 GER_Eurofighter.4.b: "거절하고 독자 연구 유지"
 GER_Eurofighter.5.t: "[ROOT.GetNameWithFlag]이(가) 날개 조립을 인수함"
 GER_Eurofighter.5.d: "[ROOT.GetNameWithFlag]이(가) 유로파이터의 날개 부품 생산에 대한 책임을 공식적으로 맡았습니다. 여기에는 공기역학적 형상 설계, 무장 장착점 통합, 내부 연료 체계에 대한 통제가 포함됩니다. 이제 이 나라의 산업 부문은 전투기의 비행 특성과 구조 효율에서 결정적인 역할을 합니다."
 GER_Eurofighter.5.a: "흥미롭군"
 GER_Eurofighter.6.t: "[ROOT.GetNameWithFlag]이(가) 동체 생산을 인수함"
 GER_Eurofighter.6.d: "[ROOT.GetNameWithFlag]이(가) 유로파이터 조립의 중앙 동체 및 기체 구조 부문을 맡았습니다. 이 책임에는 항공기의 구조적 중심부와 하중 지지 체계가 포함되며, 전투기의 적응력과 복원력을 좌우하는 핵심 위치입니다."
 GER_Eurofighter.6.a: "흥미롭군"
 GER_Eurofighter.7.t: "[ROOT.GetNameWithFlag]이(가) 조종석 및 항전 장비를 인수함"
 GER_Eurofighter.7.d: "[ROOT.GetNameWithFlag]이(가) 유로파이터의 기수 부문, 조종석, 항전 장비 일체에 대한 생산 주도권을 맡았습니다. 이 부문은 센서 배치, 인터페이스 설계, 레이더 능력을 결정하며, 전투기의 전장 인식과 전투 잠재력에 대한 전략적 통제권을 부여합니다."
 GER_Eurofighter.7.a: "흥미롭군"
 GER_Nationalism: "민족주의"
 GER_Economy: "경제"
 GER_Alexander: "알렉산더 폰 훔볼트"
 GER_Military: "연방방위군"
 GER_constitution: "헌법"
 GER_Rejected_mutual_project: "협력 거부"
 ger_helsing_se_founded: "§Y2021년§!까지, 또는 그 이전에 §Y$GER_Artificial_Inteligence_integration$§!, §Y$GER_future_of_airforce$§! 또는 §Y$GER_reseach_requirents_for_airforce$§!을(를) 완료하면 §YHelsing SE§!가 설립됩니다."
 GER_panavia.1.t: "토네이도 생산을 재개할 것인가?"
 GER_panavia.1.d: "원래의 토네이도 생산 라인은 1998년에 폐쇄되었지만, 변화하는 전략 환경이 이 항공기에 대한 관심을 되살렸습니다. 임무 형태의 변화, 늘어나는 작전 수요, 신형 플랫폼의 일정에 대한 커져 가는 의구심 속에서 토네이도 생산을 재개하자는 제안이 나왔습니다.\n\n지지자들은 재가동된 라인이 새로운 항전 장비와 무장으로 설계를 현대화할 수 있으며, 검증된 신뢰성을 갖춘 과도기적 해법을 제공할 것이라고 주장합니다. 비판자들은 수십 년 된 기체를 부활시키면 보다 미래 지향적인 체계에 쓰일 자원이 고갈될 수 있다고 경고합니다."
 GER_panavia.1.a: "개량과 함께 토네이도 생산 재개"
 GER_panavia.1.b: "토네이도는 퇴역 상태로 둔다"
 GER_panavia.2.t: "유럽 스텔스 구상?"
 GER_panavia.2.d: "세계가 5세대 항공기와 스텔스 기반 교리로 전환함에 따라, 방위 산업계 내에서는 통합된 유럽의 대응을 주장하는 목소리가 나오고 있습니다. 외국 플랫폼에 의존하는 대신 파나비아 네트워크와 기존 산업 기반을 활용하여 스텔스 중심의 개발 프로젝트를 개시할 수 있습니다.\n\n이러한 프로그램은 유럽의 방위 주권을 강화하고 항공우주 경쟁력을 유지하며 미국이나 아시아의 설계에 대한 장기적 대안을 제공할 것입니다. 그러나 막대한 투자와 국경을 넘는 조율, 성공이 보장되지 않는 장기적 헌신이 요구됩니다."
 GER_panavia.2.a: "유럽 스텔스 프로젝트 개시"
 GER_panavia.2.b: "스텔스는 너무 비싸다, 다른 곳에 집중한다"
 GER_panavia.3.t: "더 저렴하고 민첩한 유럽 전투기?"
 GER_panavia.3.d: "예산 제약과 작전 유연성 요구에 비추어, 방위 전문가들은 더 가벼운 새로운 유럽 전투기의 개발을 제안했습니다. 이 항공기는 공중 치안, 요격, 전술 타격 임무를 겨냥하여 민첩성, 다용도성, 경제성을 우선시할 것입니다.\n\n지지자들은 이러한 플랫폼이 유로파이터와 같은 더 무거운 체계를 보완하고 외국산 경전투기에 대한 의존을 줄일 것이라고 주장합니다. 비판자들은 이것이 차세대 스텔스 프로젝트의 자금을 고갈시키거나 유럽 방위 산업의 분열로 이어질 수 있다고 경고합니다."
 GER_panavia.3.a: "그렇다, 가볍고 민첩한 유럽 다목적 전투기를 개발한다"
 GER_panavia.3.b: "아니다, 기존 플랫폼에 집중한다"
