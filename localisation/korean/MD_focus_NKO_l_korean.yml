 NKO_specialise_commando_tt: "§G코만도 훈련을 받은 지휘관이 특수부대를 지휘하도록 진급합니다.§!"
 NKO_sso_new_general_tt: "§G특수작전군이 특수부대 전문가 §!§Y김영복§!§G을 새로운 군단 지휘관으로 임명합니다.§!"
 NKO_arms_export: "대외사업국"
 NKO_arms_export_desc: "KOMID와 해외 무기 거래를 배후에서 운영하는 부서입니다. 전쟁 중인 국가들에 무기, 미사일, 병력, 위성을 공급하고 경화, 기술, 그리고 영구적으로 성장하는 산업 기반을 얻습니다."
 NKO_arms_export_modifiers: "대외사업국"
 NKO_arms_export_modifiers_desc: "평양의 무기 수출 부서입니다. 우리가 공급하는 국가가 늘어날 때마다 우리의 §Y공장 생산량§!과 §Y생산 효율§!이 영구적으로 증가하며, 다극 무기고가 확대될수록 이 보너스도 커집니다."
 NKO_arms_export_title: "§Y대외사업국§!"
 NKO_arms_export_clients_readout: "공급한 국가: §Y[?NKO_arms_export_clients|0]§!    체결한 거래: §Y[?NKO_arms_export_deals|0]§!"
 NKO_arms_export_output_readout: "영구 공장 생산량: §G+[?NKO_arms_export_clients|0]%§!"
 NKO_arms_export_revenue_readout: "벌어들인 경화: §G$[?NKO_arms_export_revenue|0]§! 십억"
 NKO_arms_export_sanctions_readout: "제재 압박: [NKO_arms_export_sanctions_status]"
 NKO_arms_export_hint: "§Y재래식§! 항목을 열어 §R전쟁에서 패하고 있는§! (항복 진행도 30% 이상) §W비서방§! 국가에 무장을 지원하십시오. 고객국 하나당 §G영구 공장 생산량 +1%§!, 경화, 기술을 얻지만 §R제재§!가 가중됩니다. 후원국에 로비하여 이를 완화하십시오."
 NKO_arms_export_capstone_status_progress: "§O다극 세계의 무기고: 10개국에 공급하면 최종 단계가 잠금 해제됩니다.§!"
 NKO_arms_export_capstone_status_ready: "§G다극 세계의 무기고가 손에 닿을 거리에 있습니다. 대외사업국을 소집하십시오.§!"
 NKO_arms_export_capstone_status_done: "§G다극 세계의 무기고를 달성했습니다.§!"
 NKO_arms_export_sanctions_max: "§R최대 (UNSC)§!"
 NKO_arms_export_sanctions_severe: "§R심각§!"
 NKO_arms_export_sanctions_heavy: "§O강력§!"
 NKO_arms_export_sanctions_moderate: "§O보통§!"
 NKO_arms_export_sanctions_light: "§Y경미§!"
 NKO_arms_export_sanctions_none: "§G없음§!"
 NKO_arms_export_conv_open: "재래식 무기 수출 §Y열기§!"
 NKO_arms_export_conv_open_desc: "전쟁 중인 모든 국가를 대상으로 한 포탄 및 폭풍군단 지원병 등 재래식 공급 결정을 표시합니다."
 NKO_arms_export_conv_close: "재래식 무기 수출 §Y닫기§!"
 NKO_arms_export_conv_close_desc: "패널이 어수선해지지 않도록 재래식 공급 결정을 숨깁니다."
 NKO_export_munitions: "[FROM.GetNameWithFlag]에 재래식 무기 패키지 선적"
 NKO_export_munitions_desc: "인민군 창고에서 전선으로 무기 패키지를 철도로 수송합니다. [FROM.GetName]이(가) 가장 필요로 하는 사단 유형(§Y경보병§!, §Y차량화§!, §Y기갑§!, §Y기계화§!)을 선택하면 우리는 우리 비축분에서 곧바로 꺼내 §Y3개 대대§! 분량의 1995년 이후 현대 장비를 선적합니다. 기갑 및 기계화 패키지에는 현대식 전차 설계가 필요합니다. 항공기는 공급하지 않습니다. 그들은 더 강하게 싸우고, 우리는 경화로 대가를 받습니다."
 NKO_deploy_storm_corps: "[FROM.GetNameWithFlag]에 폭풍군단 파병"
 NKO_deploy_storm_corps_desc: "[FROM.GetName]에 북한의 개입을 제안합니다. 상대가 수락하면 그들의 전선에 §Y지원 사단§!을 보낼 수 있게 되어, 우리의 후원국과의 관계를 더 긴밀히 하고 감사를 얻습니다. §Y러시아§!나 §Y중국§!에 파병하면 군단이 귀환한 후에도 계속되는 영구적인 경화 보조금이 열립니다. §Y세계적 개입주의§! 외교 정책이 필요합니다."
 NKO_arms_export_lobby_relief: "제재 완화 로비"
 NKO_arms_export_lobby_relief_desc: "무장한 우리 파트너들의 외교적 영향력과 은밀한 현금을 투입하여 국제연합에서 국제 제재를 한 단계 완화시킵니다."
 NKO_arms_export_capstone: "다극 세계의 무기고"
 NKO_arms_export_capstone_desc: "제국주의 질서에 맞서는 국가들의 연합을 무장시켰으니, 평양이 다극 세계의 공방이라는 역할을 공식화하십시오."
 NKO_arms_export_relief_deals_tt: "최소 §Y5§!건의 수출 거래를 체결함"
 NKO_arms_export_relief_sanctions_tt: "현재 국제 제재를 받고 있음"
 NKO_arms_export_unlock_tt: "§G대외사업국, 즉 해외 무기 및 인력 수출 프로그램을 잠금 해제합니다.§!"
 NKO_export_munitions_effect_tt: "상대가 수락하면 고객국이 사단 패키지 하나를 요청하며, 우리는 §Y우리 비축분에서 곧바로 꺼내§! §Y3개 대대§! 분량의 §Y1995년 이후§! 장비를 인도합니다. 기갑 및 기계화 패키지에는 §Y현대식 전차 설계§!(냉전 이후 모듈이 절반 이상)가 필요합니다. §R항공기는 공급되지 않습니다.§! 우리는 §Y경화§!로 대가를 받으며, 새로운 고객국은 패키지 규모에 비례한 영구적인 공장 생산량 보너스를 부여합니다. 경보병 §G+1%§!, 차량화 §G+2%§!, 기갑 또는 기계화 §G+3%§!. 제재 압박이 증가합니다.\n\n고객국은 §Y365§!일간 §Y북한 군수품§!을 얻습니다.\n  사단 공격력 §G+5%§!\n  사단 회복 속도 §G+5%§!\n  보급 소모 §G-5%§!"
 NKO_export_troops_effect_tt: "개입 병력의 파병을 제안합니다. 상대가 수락하면 그들의 전쟁에 §Y지원 사단§!을 보낼 수 있게 되며, 우리는 정치적 호의와 경화를 얻습니다. 본국의 인력은 손실되지 않습니다."
 NKO_storm_corps_permanent_income_tt: "강대국 후원자로서 상대는 폭풍군단이 귀환한 후에도 계속되는 §Y영구적인§! 주간 경화 보조금을 제공합니다."
 NKO_arms_client_munitions: "북한 군수품"
 NKO_arms_client_munitions_desc: "북한제 포탄과 소총 상자들이 포를 계속 쏘게 해 줍니다."
 NKO_arms_client_troops: "조선인민군 지원병"
 NKO_arms_client_troops_desc: "폭풍군단 베테랑들이 전선을 굳건히 하고 방어선을 지킵니다."
 NKO_storm_corps_abroad: "해외 파병된 폭풍군단"
 NKO_storm_corps_abroad_desc: "우리의 최정예 병력이 외국 전쟁에서 싸우고 있습니다. 그들의 부재는 본국의 인력과 사기에서 느껴집니다."
 NKO_arms_export_capstone_spirit: "다극 세계의 무기고"
 NKO_arms_export_capstone_spirit_desc: "평양은 서방에 맞서는 국가들에 없어서는 안 될 공급자가 되었습니다. 우리 공장들은 제재의 압박에서 벗어나 전력으로 가동됩니다."
 NKO_export.1.t: "포탄을 필요로 하는 모스크바"
 NKO_export.1.d: "러시아의 공세는 공장이 공급할 수 있는 속도보다 빠르게 탄약을 집어삼키고 있습니다. 크렘린은 비공식 경로를 통해 평양에 포탄, 로켓, 그 밖에 인민군이 내줄 수 있는 모든 것을 요청합니다. 대가는 후할 것입니다. 현금, 곡물, 그리고 우리가 오랫동안 탐내 온 군사 기술입니다."
 NKO_export.1.a: "주문을 이행한다"
 NKO_export.1.b: "지금은 안 된다"
 NKO_export.10.t: "무기 패키지를 제안하는 [FROM.GetNameWithFlag]"
 NKO_export.10.d: "평양이 궁지에 몰린 우리 군대에 경화를 대가로 현대식 무기 패키지를 철도로 수송하겠다고 제안합니다. 우리는 가장 필요한 사단 유형에 맞는 장비를 요청할 수 있습니다. 북한의 비축분에서 곧바로 꺼내 §Y3개 대대§! 분량의 장비를 제공합니다."
 NKO_export.10.a: "§Y경보병§! 패키지 요청: 소총 및 지휘 장비"
 NKO_export.10.b: "제안을 거절한다"
 NKO_export.11.t: "우리 무기를 수락한 [FROM.GetNameWithFlag]"
 NKO_export.11.d: "[FROM.GetName]이(가) 우리의 제안을 받아들였습니다. 화물은 우리 창고를 떠나 전선으로 향하며, 경화는 이미 우리 계좌에 들어와 있습니다."
 NKO_export.11.a: "열차에 싣는다"
 NKO_export.12.t: "우리 무기를 거절한 [FROM.GetNameWithFlag]"
 NKO_export.12.d: "[FROM.GetName]이(가) 우리 무기를 거절했습니다. 상자들은 우리 창고에 그대로 남습니다."
 NKO_export.12.a: "그렇게 하자."
 NKO_export.99.t: "다극 세계의 무기고"
 NKO_export.99.d: "모스크바에서 테헤란에 이르기까지 십여 개 군대의 총포가 북한 공장의 제품으로 채워지고 있습니다. 경화를 위한 절박한 거래로 시작된 일이 워싱턴에 맞서는 모든 세력에게 조선민주주의인민공화국을 없어서는 안 될 존재로 만들었습니다. 혁명의 공방이 고객들을 찾았습니다."
 NKO_export.99.a: "세계가 우리에게 의존하게 하라"
 NKO_export.22.t: "개입 병력을 제안하는 평양"
 NKO_export.22.d: "[FROM.GetName]이(가) 우리 전선에 조선 지원 사단을 배치하겠다고 제안합니다. 그들의 병사들은 우리 병사들과 나란히 우리의 적에 맞서 싸울 것이며, 평양의 개입 제안을 우리는 거절하기 어렵습니다."
 NKO_export.22.a: "그들의 병사를 받아들인다"
 NKO_export.22.b: "제안을 거절한다"
 NKO_export.20.t: "병력을 필요로 하는 [FROM.GetNameWithFlag]"
 NKO_export.20.d: "우리 폭풍군단이 이미 싸우고 있는 [FROM.GetName]의 인력 예비가 바닥났습니다. 그들의 지휘부가 평양에 방어선을 지킬 새 병력을 보내 달라고 호소합니다."
 NKO_export.20.a: "증원군을 보낸다"
 NKO_export.20.b: "병력을 내줄 여유가 없다"
 NKO_export_send_manpower_tt: "§G[FROM.GetName]의 징집 가능 인력 풀의 §Y10%§!에 해당하는 인력을 우리 예비에서 차출하여 보냅니다.§!"
 NKO_export.40.t: "제재로 응답하는 서방"
 NKO_export.40.d: "우리 무기는 제국주의자들이 우리에게 막아 두고자 했던 전선들에서 계속해서 모습을 드러내고 있습니다. [USA.GetName]은(는) [FRA.GetName], [GER.GetName], [JAP.GetName]과(와) 함께 새로운 제재 패키지를 내놓았습니다. 계좌 동결, 거래 업체 블랙리스트 등재, 그리고 평양으로부터 계속 구매하는 모든 이에 대한 경고입니다. 우리는 이전에도 그들의 압박을 견뎌냈습니다."
 NKO_export.40.a: "제국주의자들이 날뛰게 두어라"
 NKO_export.40.b: "조용히 타격을 감수한다"
 NKO_arms_contract_title: "§Y후원국 지원병 투입 약정§!"
 NKO_expeditions_readout: "투입한 원정: §G[?NKO_expeditions_completed|0]§!"
 NKO_commit_volunteers: "[FROM.GetName]에 지원병 원정대 투입 약정"
 NKO_commit_volunteers_desc: "[FROM.GetName]에서 싸우고 있는 우리 지원 사단의 파병을 공식화합니다. 평양은 후원국에 인력 대금을 청구하여 경화를 챙깁니다. [FROM.GetName]은(는) 우리 사단에 대해 웃돈을 지불합니다."
 NKO_commit_volunteers_req_tt: "[FROM.GetName]에 우리 지원 사단이 최소 §Y6§!개 주둔 중"
 NKO_commit_volunteers_effect_tt: "경화 웃돈을 우리의 §Y국고§!에 예치합니다. 우리의 §Y지원 사단§!이 해외에서 계속 싸우는 동안, 지속적인 파병이 우리 군을 단련하여 매주 §Y육군 교리 숙련도§!를 얻습니다."
 NKO_economy_shortcut: "경제"
 NKO_military_shortcut: "군사"
 NKO_38th_parallel_shortcut: "38선"
 NKO_political_shortcut: "정치"
 NKO_overcome_the_arduous_march: "고난의 행군 극복"
 NKO_overcome_the_arduous_march_desc: "기아의 시기는 우리 뒤로 지나갔습니다. 농업은 복구되었고, 희천은 재건되었으며, 부상하는 시장 계층도 체제 안으로 끌어들였습니다. 마침내 고난의 행군을 극복했음을 선언하고 국가의 모든 역량을 민족 재건으로 돌릴 수 있습니다."
 NKO_renovate_water_supply_facilities: "상수도 시설 개보수"
 NKO_renovate_water_supply_facilities_desc: "상수도 시설의 개보수와 확충은 공중 보건과 산업 발전에 필수적입니다. 모든 인민과 산업에 깨끗하고 안정적인 물 공급을 보장할 것입니다."
 NKO_national_power_grid: "전국 전력망"
 NKO_national_power_grid_desc: "재생 에너지 발전소와 수력 발전소를 통합된 전국 전력망으로 연결하면 공장과 가정 모두에 대한 전력 공급이 안정되어, 오랫동안 생산을 마비시켜 온 순환 정전을 끝낼 수 있습니다."
 NKO_pojon_field_responsibility: "포전담당책임제"
 NKO_pojon_field_responsibility_desc: "포전담당책임제는 소규모 가족 단위 작업반에게 국가 할당량을 초과하는 농업 잉여에 대한 자율권을 부여합니다. 농민이 장려 수확분을 보유하도록 허용함으로써 생산이 확대되고 식량 안보가 강화됩니다."
 NKO_rason_ftz: "라선 경제특구"
 NKO_rason_ftz_desc: "중국 및 러시아의 투자로 공동 개발되는 북동부의 라선 자유무역지대는 북한의 합법적인 국경 간 무역의 관문을 엽니다. 나진항과 국경 접근권을 장악하면 지속적인 경제 교역이 가능해집니다."
 NKO_koryolink_network: "고려링크 이동통신망"
 NKO_koryolink_network_desc: "오라스콤 텔레콤과 함께 구축하여 2008년에 개통한 3G 네트워크인 고려링크는 수백만 가입자에게 현대적인 통신을 제공합니다. 이동통신망은 정보의 흐름을 현대화하고 국가가 통제하는 매체에 대한 의존을 줄입니다."
 NKO_pyongyang_prestige_streets: "평양의 위신 거리"
 NKO_pyongyang_prestige_streets_desc: "미래과학자거리, 려명거리와 같은 대표 거리들은 국제 제재에도 불구하고 국가의 현대성과 불굴의 의지를 과시하기 위해 빠른 속도로 건설되었습니다. 이 도시의 상징들은 대중의 사기와 국제적 위신을 높입니다."
 NKO_ryugyong_hotel: "류경호텔 완공"
 NKO_ryugyong_hotel_desc: "오랫동안 방치되었던 105층 피라미드형 류경호텔은 2008년부터 2011년 사이에 유리 외장 마감을 전면 시공받습니다. 이 건축물의 랜드마크는 국가의 기술적 야망과 경제 회복을 상징합니다."
 NKO_exporting_workforce: "노동력 수출"
 NKO_chollima_speed: "천리마 속도"
 NKO_field_responsibility_system: "포전담당책임제"
 NKO_field_responsibility_system_desc: "포전담당책임제는 농민 작업반이 국가 할당량을 초과하는 잉여 수확분을 보유할 수 있도록 하여 생산 유인을 만들어 냅니다. 지속적인 농업 생산은 식량 안보와 대중의 사기를 개선합니다."
 NKO_mobile_network: "고려링크 이동통신망"
 NKO_mobile_network_desc: "현대적인 3G 통신망이 수백만 가입자에게 닿아 통신 기반시설을 현대화합니다. 정보 접근성이 개선되고 국영 매체에 대한 의존이 줄어 사회적 부담이 완화됩니다."
 NKO_people_army: "인민군"
 NKO_people_army_desc: "인민군은 \\"고난의 행군\\"이라는 어려운 시기에도 미 제국주의와 그 남조선 괴뢰들로부터 스스로를 방어하기 위해 전쟁에 대비하고 있어야 했습니다."
 NKO_national_defence_force: "국방"
 NKO_national_defence_force_desc: "우리는 어떠한 위협으로부터도 조국을 안전하게 지키기 위해 군사비 지출을 남쪽 상대방의 수준에 맞게 늘릴 것입니다."
 NKO_red_dawn: "붉은 여명"
 NKO_red_dawn_desc: "군사력을 강화함에 따라 우리의 혁명 정신의 새벽이 다시 한번 밝아 올 것입니다. 이것이 우위를 향한 우리의 끊임없는 행군의 시작이 되게 합시다."
 NKO_studying_their_airforce: "적 공군 연구"
 NKO_studying_their_airforce_desc: "불가피한 분쟁에 대비하려면 적들의 공군을 연구하여 그들의 강점과 약점을 파악하고 대응 전략을 마련해야 합니다."
 NKO_focus_on_the_f_35: "F-35 집중 연구"
 NKO_focus_on_the_f_35_desc: "F-35의 기술을 분석하여 그 설계를 영감으로 삼아 우리의 항공 능력을 향상시키고 이 첨단 전투기를 운용하는 자들에 대항할 것입니다."
 NKO_focus_on_the_f_16: "F-16 집중 연구"
 NKO_focus_on_the_f_16_desc: "F-16은 유능한 전투기임을 입증했습니다. 그 전술과 기술을 분석하여 그 과정에서 우리의 전투기 전력을 강화할 것입니다."
 NKO_focus_on_the_future_kai_kf_21: "KF-21 집중 연구"
 NKO_focus_on_the_future_kai_kf_21_desc: "KF-21은 남한의 차세대 전투기입니다. 그 잠재력을 분석함으로써 우리 공군이 이 전투기가 가할 수 있는 어떠한 위협에도 대응할 수 있도록 준비합니다."
 NKO_begin_uranium_enrichment: "우라늄 농축 개시"
 NKO_begin_uranium_enrichment_desc: "남조선 인민의 해방을 위해서든, 미 제국주의자들의 핵 위협으로부터 위대한 조국을 수호하기 위해서든, 우리는 단호하고 용감하게 핵무기 개발을 계속해야 합니다!"
 NKO_remove_monitoring_devices: "감시 장치 제거"
 NKO_remove_monitoring_devices_desc: "우리의 우라늄 농축은 국제 사회의 저항에 부딪힐 수밖에 없습니다. 그렇다면 우라늄 농축을 숨기기 위해 우리가 할 수 있는 최선은 ----- 국제 사회를 보이지 않게 만드는 것입니다."
 NKO_expel_inspectors: "사찰단 추방"
 NKO_expel_inspectors_desc: "국제원자력기구는 우리가 핵 기술을 에너지 공급에만 사용하는지 확인하기 위해 많은 사찰관을 우리나라에 파견했습니다. 이제 그들로부터 벗어나려는 참이니, 그 김에 이 제국주의의 첩자들도 추방하는 편이 낫습니다."
 NKO_withdraw_from_npt: "NPT 탈퇴"
 NKO_withdraw_from_npt_desc: "우리의 독립과 안보에 관련된 핵 프로그램의 중요한 단계는 NPT에서 탈퇴하는 것입니다. 우스꽝스러운 제국주의자들의 불평등 조약 때문에 우리나라의 독립과 안보를 지킬 능력을 제한할 수는 없습니다!"
 NKO_missile_tests: "미사일 시험"
 NKO_missile_tests_desc: "북한의 미사일 시험은 단거리에서 대륙간 탄도 미사일(ICBM)에 이르는 다양한 체계를 선보이며 커져 가는 탄도 미사일 능력을 과시하는 것입니다. 이러한 시험은 군사 기술을 발전시키고, 지역 내 영향력을 과시하며, 전략적 의도를 알리는 데 핵심적이며, 흔히 긴장을 고조시키고 국제 사회의 대응을 불러옵니다."
 NKO_nuclear_tests: "핵실험"
 NKO_nuclear_tests_desc: "북한의 핵실험은 핵무기 개발 프로그램의 일환으로 2006년 이래 이 나라가 실시한 일련의 지하 핵폭발입니다. 이러한 시험은 무기 위력과 기술의 진전을 보여 주며, 흔히 국제 사회의 비난과 제재를 촉발합니다. 이는 체제 안보를 보장하고 세계 무대에서 힘을 과시하려는 북한 전략의 핵심 요소입니다."
 NKO_our_pride_and_joy: "우리의 자랑이자 기쁨"
 NKO_our_pride_and_joy_desc: "기뻐하라! 미 제국주의자들과 그 추종 국가들의 가혹한 봉쇄에 맞서, 경애하는 [NKO.GetLeader] 동지의 영도 아래 우리 조선민주주의인민공화국은 마침내 우리 자신의 핵 억제력을 갖게 되었다! 미 제국주의 침략자들이 핵 몽둥이로 우리를 위협하려 하던 시대는 지나갔다!"
 NKO_nuclear_approval_not_sco: "우리는 SCO 회원국이 되어서는 안 된다"
 NKO_people_air_force: "인민 공군"
 NKO_people_air_force_desc: "조선의 하늘은 미 제국주의자들이나 그 남쪽 동맹의 어떠한 침범으로부터도 안전하게 지켜져야 합니다. 우리의 항공 능력을 개선하지 않는다면 이는 어려운 과업이 될 것입니다."
 NKO_self_produced_rifles: "자체 생산 소총"
 NKO_self_produced_rifles_desc: "조선인민군은 제식 소총을 외국 공급자에게 의존할 수 없습니다. 국내 병기창이 소형 화기를 대량으로 생산할 설비를 갖추어, 모든 병사가 조국에서 만든 무기로 무장하도록 보장할 것입니다."
 NKO_model_master: "모델 마스터"
 NKO_model_master_desc: "북한의 전차 개발은 자국의 지형과 군사 교리에 맞춘 토착 기갑 차량 생산에 초점을 맞춥니다. 소련식에서 영감을 받은 모델부터 현대화된 설계에 이르기까지, 이 전차들은 기동성, 화력, 다양한 전투 시나리오에서 작전할 수 있는 능력을 강조하며 국가 지상군에서 핵심적인 역할을 합니다."
 NKO_artillery: "우리의 포병"
 NKO_artillery_desc: "북한의 포병은 전통적인 곡사포에서 첨단 로켓 포병에 이르는 방대한 체계를 갖춘 군사 전략의 초석입니다. 막대한 비축량으로 유명한 이 포병은 압도적인 화력을 위해 설계되었으며, 군사 시설과 민간 지역, 특히 이웃 남한을 모두 겨냥할 수 있어 억제와 공격의 핵심 요소가 됩니다."
 NKO_spaa: "우리의 대공 방어"
 NKO_spaa_desc: "북한의 대공 방어 체계는 소련 시대의 기술과 자체 개발한 플랫폼이 섞인 것으로, 핵심 기반시설을 보호하고 잠재적 공중 위협에 대응하도록 설계되었습니다. 지대공 미사일, 대공포, 레이더 체계를 포함하며 계층 방어 전략을 강조합니다. 현대적 체계에 비하면 한계가 있지만, 이는 자력갱생과 억제에 대한 이 나라의 중점을 반영합니다."
 NKO_rocket_artillery: "로켓 포병"
 NKO_rocket_artillery_desc: "북한의 로켓 포병은 강력한 KN-09와 KN-25 모델을 포함한 다양한 체계를 갖춘 군의 핵심 구성 요소입니다. 이 플랫폼들은 장거리 정밀 타격을 위해 설계되었으며 군사 및 전략 표적 모두에 상당한 화력을 투사할 수 있습니다. 이들의 기동성과 신속 전개 능력은 북한의 전력 투사 및 공세 작전 지속 능력을 높입니다."
 NKO_naval_modernization: "해군 현대화"
 NKO_naval_modernization_desc: "북한의 해군 현대화는 더 작고 민첩한 함정과 첨단 미사일 체계로 능력을 강화하는 데 초점을 맞춥니다. 여기에는 탄도 미사일(SLBM)을 발사할 수 있는 잠수함의 개발과 수상함의 현대 무장 개량이 포함됩니다. 이 노력은 연안 및 수중 자산을 활용해 더 큰 해군 강국에 대응하고 지역 해역에서 힘을 과시하는 비대칭 전쟁 전략을 반영합니다."
 NKO_anti_submarine: "대잠수함 능력"
 NKO_anti_submarine_desc: "북한의 대잠수함 능력은 제한적이지만 발전하고 있으며, 초계정, 폭뢰, 소나를 갖춘 함정의 조합에 의존합니다. 이러한 체계를 개선하려는 노력에는 더 작고 민첩한 함선의 배치와 토착 기술의 시험이 포함됩니다. 이 능력은 연안 해역 방어와 적의 잠재적 잠수함 침투 차단에 초점을 맞추어, 해안 인근의 해양 안보를 보장합니다."
 NKO_infiltration_by_sea: "해상 침투"
 NKO_infiltration_by_sea_desc: "북한의 해상 침투 전략은 소형 고속정, 잠수함, 반잠수정으로 이루어진 함대를 활용해 비밀 작전을 수행합니다. 이 자산들은 정찰, 파괴 공작, 비정규전을 위해 특수 부대와 장비를 흔히 탐지되지 않은 채 수송할 수 있게 합니다. 이러한 접근법은 적 해안선의 취약점을 이용하려는 북한의 비대칭 전술 강조를 부각합니다."
 NKO_submarine_development: "잠수함 개발"
 NKO_submarine_development_desc: ""
 NKO_upgrade_shipyards: "조선소 개선"
 NKO_upgrade_shipyards_desc: "북한의 잠수함 개발은 신포급과 같은 탄도 미사일 잠수함(SLBM)을 포함해 재래식 및 전략 함정으로 함대를 확장하는 데 초점을 맞춥니다. 이 프로그램은 신뢰할 만한 수중 억제력을 구축하겠다는 이 나라의 야망을 보여 주며, 핵 전략에서 은밀성과 생존성을 높입니다. 토착 설계와 구형 모델의 현대화를 병행하며, 북한은 방어와 전략적 도달 범위를 강화하기 위해 비대칭 해군 능력을 우선시하고 있습니다."
 NKO_expand_bases: "기지 확장"
 NKO_expand_bases_desc: "군사 기지를 확장하려는 북한의 전략은 방어와 준비 태세 강화에 대한 중점을 반영합니다. 여기에는 기존 시설의 개선, 새로운 지하 대피소의 건설, 병력을 지원하는 병참 거점의 강화가 포함됩니다. 기지 확장은 병력 전개 효율을 개선하고, 핵심 자산을 보호하며, 전략적 종심을 제공하여 잠재적 공격에 대한 생존성을 보장하는 한편 주요 전략 요충지에서 힘을 투사하는 것을 목표로 합니다. 이러한 발전은 미사일 체계, 잠수함, 기타 군사 장비의 진전을 뒷받침하는 데도 맞추어져 있습니다."
 NKO_green_water_navy: "연안 해군"
 NKO_green_water_navy_desc: "북한의 연안 해군 개발은 작전 범위를 연안 해역 너머 지역 해역으로 넓히는 데 초점을 맞춥니다. 이 전략은 소형 호위함, 초계함, 미사일 정을 배치하고 잠수함 능력을 강화하려는 노력을 수반합니다. 목표는 영유권 주장을 지키고, 비대칭 전쟁 전략을 지원하며, 특히 황해와 동해에서 제한적인 힘을 투사하는 것입니다. 이러한 접근법은 비용 효율적인 현대화와 전략적 군사 목표 사이에서 균형을 맞추려는 북한의 야망을 부각합니다."
 NKO_revolutionary_military_spirit: "혁명적 군인 정신"
 NKO_revolutionary_military_spirit_desc: "북한의 \\"혁명적 군인 정신\\" 개념은 국가와 그 영도에 대한 흔들림 없는 충성, 규율, 헌신을 강조하는 핵심 이념입니다. 이는 군대에게 동기를 부여하는 틀로서, 역경 앞에서의 불굴의 의지, 자력갱생, 희생할 각오를 장려합니다. 이 국가 정신은 경제적·기술적 어려움에도 전략적 목표를 달성하기 위한 단결과 결의를 키우며 국가의 군사 문화를 뒷받침합니다. 이는 정치 이념과 군사 전략의 통합이 북한의 국방 구상을 이끄는 원동력임을 보여 줍니다."
 NKO_expand_peasant_militia: "농민 민병대 확장"
 NKO_domestic_naval_strategy: "자체 해군 전략"
 NKO_domestic_naval_strategy_desc: "현대적인 해군 교리의 토대를 마련합니다. 이 프로그램의 각 부문, 즉 잠수함, 미사일 정, 연안 방어, 특수 작전은 개발을 시작하기 위한 자원의 몫을 배정받게 됩니다."
 NKO_domestic_submarine_program: "자체 잠수함 프로그램"
 NKO_domestic_submarine_program_desc: "설계국의 역량을 토착 잠수함 건조에 집중합니다. 정교해진 선체 생산과 강화된 승조원 훈련은 우리 해안에서 멀리 떨어진 적을 위협하는 데 필요한 소리 없는 타격 전력을 제공할 것입니다."
 NKO_domestic_destroyer_buildup: "자체 구축함 증강"
 NKO_domestic_destroyer_buildup_desc: "연안 해역에서 적 함대를 에워싸기 위해 미사일 정과 소형 수상 전투함을 대량 생산합니다. 우리 조선소는 남쪽이 중구축함을 배치하는 것보다 더 빠르게 선체를 투입할 수 있습니다."
 NKO_destroyer_unleashed: "구축함의 해방"
 NKO_destroyer_unleashed_desc: "더 무거운 함포와 전용 대공 포대를 장착한 새로운 세대의 구축함을 배치합니다. 이제 함대는 해안을 따라 숨는 대신 마침내 원양 교전을 겨룰 수 있게 될 것입니다."
 NKO_navy_projects: "북한 해군 프로젝트"
 NKO_navy_projects_desc: "§Y해군 현대화§! 중점이 이 프로그램을 개시합니다. 자금 지원, 조선소, 주체 추진 결정으로 해군 증강 포인트를 얻은 뒤, 네 가지 계열이 모두 §Y100§!에 도달할 때까지 §H잠수함 전력§!, §H미사일 정 선단§!, §H연안 방어망§!, §H해군 특수 작전§! 계열에 사용하십시오."
 NKO_expand_peasant_militia_desc: "노농적위군으로 알려진 농민 민병대를 확장하는 북한의 조치는 대중 동원을 통해 국방을 강화하려는 전략적 행보입니다. 민간인으로 구성된 이 준군사 조직은 정규 군사 작전을 보완하고, 지역 사회를 방어하며, 국내 안보를 보장하는 임무를 맡습니다. 확장 노력에는 훈련 강화, 민병대원에 대한 경무장 지급, 더 넓은 군사 훈련에의 통합이 포함됩니다. 이러한 접근법은 비대칭 전쟁과 \\"전민 방위\\" 전략에 대한 북한의 중점을 반영하며, 외부 위협에 맞서고 국내 안정을 유지할 수 있는 크고 분산된 병력을 보장합니다."
 NKO_bolster_young_red_guards: "붉은청년근위대 강화"
 NKO_bolster_young_red_guards_desc: "북한의 청소년 준군사 조직인 붉은청년근위대를 강화하는 것은 젊은 인구에게 이념적 충성과 군사적 준비 태세를 심어 주기 위한 핵심 구상입니다. 여기에는 학생들을 위한 군사 훈련, 정치 교육, 체력 단련의 강화가 포함되며, 흔히 이들을 국방 훈련에 편입시킵니다. 붉은청년근위대에 기초 무기와 생존 기술을 갖춰 줌으로써, 북한은 분쟁 시 정규군을 지원할 수 있는 이념적으로 헌신적이고 전투 준비가 된 인원이 꾸준히 공급되도록 보장합니다. 이 구상은 \\"전민 방위\\" 전략의 일환으로 청년 동원에 의존하는 체제의 성격을 부각합니다."
 NKO_rebuild_sso: "특수 부대 개혁"
 NKO_rebuild_sso_desc: "북한의 특수 부대 개혁은 비대칭 전쟁, 비정규 작전, 신속 대응 임무를 수행하는 정예 부대의 능력을 현대화하고 강화하는 데 초점을 맞춥니다. 이 개혁에는 훈련 체계 개선, 첨단 전술 도입, 현대 무기와 통신 체계의 지급이 포함됩니다. 특수 부대는 침투, 파괴 공작, 정찰, 직접 행동에 뛰어나도록 설계되어 있으며, 흔히 전략 자산이나 핵심 기반시설을 표적으로 삼습니다. 이 개혁은 지역 분쟁에서의 효율성을 높이고, 억제력을 강화하며, 다양한 고위험 임무에 대한 준비 태세를 유지하는 것을 목표로 합니다. 이러한 강조는 재래식 군사력의 한계를 상쇄하기 위해 고도로 숙련되고 민첩한 부대에 의존하는 북한의 전략을 반영합니다."
 NKO_rebuild_kim_il_sung_military_university: "김일성군사종합대학 재건"
 NKO_rebuild_kim_il_sung_military_university_desc: "평양에 있는 핵심 국방 교육기관인 김일성군사종합대학은 1952년 이래 이 나라 최고의 지휘관 다수를 한자리에 모아 왔습니다. 새로운 세기에 들어서면서 이 대학의 낡은 시설은 새로운 양상의 전쟁에 점점 맞지 않게 되고 있습니다. 이 기관을 옛 영광으로 되돌릴 때입니다."
 NKO_revolutionary_spirits: "혁명적 군인 정신"
 NKO_the_green_water_navy: "연안 해군"
 NKO_the_green_water_navy_desc: "§H해군 현대화§! 중점을 완료하면 이 국가 정신이 §Y업그레이드§!됩니다. \n§W--------------§!\n연안 해군(green-water navy)이란 자국의 연안 해역에서 작전할 수 있으며 주변 연해에서 작전할 수 있는 제한적인 역량을 갖춘 해상 전력입니다. 이는 비교적 새로운 용어로, 오랫동안 쓰여 온 두 가지 개념인 원양 해군(심해와 공해)과 근해 해군(연안 해역 및 해안 인근)을 더 잘 구분하고 미묘한 차이를 더하기 위해 만들어졌습니다."
 NKO_the_blue_water_navy: "원양 해군"
 NKO_the_blue_water_navy_desc: "수년간의 조선소 확장, 교리 개혁, 합동 훈련을 통해 우리 함대는 연안 전력에서 진정한 원양 해군으로 탈바꿈했습니다. 이제 우리는 이 지역의 어떤 경쟁자에도 뒤지지 않는 승조원과 선체를 갖추고 해안에서 멀리 떨어진 곳까지 출격할 수 있습니다.\n§W--------------§!\n원양 해군(blue-water navy)이란 공해의 심해 전역에서 지속적인 작전을 수행하며 본국 해안을 훨씬 넘어서는 곳까지 힘을 투사할 수 있는 해상 전력입니다."
 NKO_planned_economy: "계획 경제"
 NKO_planned_economy_desc: "공식 명칭이 조선민주주의인민공화국(DPRK)인 북한은 고립되고 엄격하게 통제되는 지령 경제를 가지고 있습니다. 지령 경제에서는 경제가 정부에 의해 중앙에서 계획되고 조정되며, 이는 모든 공산주의 국가의 표준적인 구성 요소입니다."
 NKO_the_38th_parallel: "38선"
 NKO_the_38th_parallel_desc: "1953년 7월, 북한, 중국 인민지원군 및 국제연합군에 의해 한국 정전 협정이 체결되어 38도선을 기준으로 한 비무장지대가 설정되었고, 이로써 남북이 갈라졌습니다. 이 분단선은 약 50년 동안 존재해 왔으며, 어떤 방식으로든 통일을 향해 나아갈 때가 되었을지도 모릅니다."
 NKO_the_road_to_peace: "평화로 가는 길?"
 NKO_the_road_to_peace_desc: "남한의 \\"햇볕정책\\"은 통일에 대한 진지한 열망을 보여주는 듯합니다. 이제는 남북의 동지들이 통일을 향해 함께 노력해야 할 때일지도 모릅니다."
 NKO_the_road_to_war: "전쟁으로 가는 길"
 NKO_the_road_to_war_desc: "미 제국주의자들과 그 남조선 괴뢰들은 과거에도, 지금도, 앞으로도 결코 진정한 조선 통일을 용납하지 못할 것입니다. 무력에 의한 통일은 영원한 진리입니다."
 NKO_end_six_party_negotiations: "핵무기 준비"
 NKO_end_six_party_negotiations_desc: "6자회담은 지연 외에는 아무것도 가져다주지 못했습니다. 우리는 협상 테이블에서 물러나 핵 억제력을 완전한 준비 태세로 끌어올릴 것입니다. 남한, 일본, 미국은 우리의 안보가 그들이 흥정할 대상이 아님을 알게 될 것입니다."
 NKO_remilitarize_the_dmz: "비무장지대 재무장"
 NKO_remilitarize_the_dmz_desc: "비무장지대를 재무장하는 것은 남한과의 갈등을 크게 격화시키겠지만, 다가올 충돌에서 우리 군에 분명한 이점을 줄 것입니다."
 NKO_struggle_for_power: "권력 투쟁"
 NKO_struggle_for_power_desc: "김정은과 그의 형 김정남 사이의 권력 투쟁은 북한 지배 가문 내부의 은밀한 후계 다툼이었습니다. 아버지 김정일이 사망한 뒤 두 형제 모두 정권을 이끌 잠재적 후보였습니다. 한때 유력한 후계자로 여겨졌던 김정남은 정권에 대한 공개적 비판과 마카오 망명으로 인해 총애를 잃었습니다. 한편 김정은은 영향력 있는 엘리트들의 지지를 받아 전략적 동맹과 내부 숙청을 통해 입지를 굳혔습니다. 이 투쟁은 2011년 김정은의 권력 승계로 막을 내렸으며, 2017년 김정남의 의문스러운 암살로 정점을 찍었습니다. 많은 이들은 이것이 북한 정부가 꾸민 일이라고 믿고 있습니다. 이 갈등은 세계에서 가장 비밀스러운 정권 중 하나에서 벌어지는 권력 역학의 냉혹한 본질을 여실히 보여주었습니다."
 NKO_orthodox_successor: "정통 후계자"
 NKO_orthodox_successor_desc: "1990년대에 김정은은 뛰어난 자질로 인해 위대한 장군 김정일에 의해 권력의 후계자로 선택되었습니다. 과거와 현재와 미래에 하늘이 조선 인민에게 내려준 사랑하는 동지 김정은은 주체 조선의 안전과 번영을 영원히 지켜낼 것입니다."
 NKO_promote_self_reliance: "자력갱생 장려"
 NKO_promote_self_reliance_desc: "남에게 의지해서는 결코 부강한 나라가 될 수 없으며, 오직 자력갱생해야만 강해질 수 있습니다!"
 NKO_ostracize_kim_jong_nam: "김정남 배척"
 NKO_ostracize_kim_jong_nam_desc: "김정남을 배척하여 \\"아버지\\"가 그를 더욱 불신하게 만들면 우리가 권력을 잡을 가능성이 더 높아집니다."
 NKO_bribe_kpa_seniors: "조선인민군 고위 간부 매수"
 NKO_bribe_kpa_seniors_desc: "조선인민군의 장성들이 군사력을 쥐고 있는 자들이며, 이들 고위 간부의 지지를 얻으면 우리가 권력을 장악할 가능성이 더 높아집니다."
 NKO_oppose_to_chinese_reform_road: "중국식 개혁 노선에 공개 반대"
 NKO_oppose_to_chinese_reform_road_desc: "중국의 개혁 모델은 집단지도체제에서 비롯된 것입니다. 이 방식을 북한에 이식한다면 필연적으로 사회적 혼란을 초래할 것입니다. 또한 \\"아버지\\"도 이를 지지하지 않습니다. 백두혈통이 이어지도록 하기 위해, 우리는 중국식 개혁 모델의 도입에 공개적으로 반대해야 합니다."
 NKO_discredit_jang_seong_taek: "장성택 신용 실추"
 NKO_discredit_jang_seong_taek_desc: "장성택은 북한 내 잘 알려진 친중 파벌이자 아버지 곁에서도 인기 있는 인물입니다. 민족의 이익을 팔아넘긴 이러한 배신자를 용납해서는 안 됩니다. 성공적으로 권력을 잡기 위해서는 그의 죄상에 대한 증거를 수집하여 아버지 앞에서 그를 고발해야 합니다."
 NKO_call_for_change: "변화에 대한 요구"
 NKO_call_for_change_desc: "조선민주주의인민공화국은 거의 50년 동안 계획경제 체제로 운영되어 왔습니다. 그러나 잇따른 \\"1989년 혁명\\"과 \\"고난의 행군\\"은 국가 계획경제가 더 이상 새로운 세기에 맞지 않음을 입증했습니다. 북한이 다시 강해지려면 대담하고 근본적인 개혁이 필요합니다."
 NKO_pull_in_young_military_officers: "젊은 군 장교 영입"
 NKO_pull_in_young_military_officers_desc: "조선인민군의 젊고 열린 사고를 가진 장교들을 끌어들이는 것은 해가 되지 않을 것입니다. 이들은 일반 병사들과 더 가까워 우리가 군대를 통제하는 데 더 유리할 것입니다."
 NKO_frame_opposition: "반대파 모함"
 NKO_frame_opposition_desc: "김정은을 모함하는 전략은 그를 북한 지도부 내에서 무모하고 불안정을 초래하는 세력으로 묘사하는 것입니다. 그의 공격적인 숙청, 변덕스러운 의사 결정, 외교적 세련미의 부족을 부각함으로써 그가 정권의 안정과 지역 안보 모두에 위험한 존재임을 각인시킬 수 있습니다. 이러한 구도는 그의 행보를 안정적이고 합리적인 지도력의 비전과 대비시키며, 더 균형 잡히고 국제적으로 받아들여질 만한 인물의 필요성을 강조할 것입니다. 면밀히 가공된 서사와 표적화된 메시지, 내부자 증언을 활용하여 그의 신뢰도를 훼손하고 국내외 여론을 우리 쪽으로 돌리는 것이 목표입니다."
 NKO_stir_up_father_son_relations: "부자 갈등 조장"
 NKO_stir_up_father_son_relations_desc: "김정은과 김정일 사이의 갈등을 조장하는 것은 쉽지 않겠지만, 우리에게 더 많은 지지를 가져다줄 것입니다."
 NKO_place_loyalists_in_kpa: "조선인민군에 충성파 배치"
 NKO_place_loyalists_in_kpa_desc: "20년 전 김정일과 그의 이복형제가 모두 북한의 지도자가 될 기회를 가졌을 때, 김정일에 대한 노병 빨치산들의 지지는 그가 결국 최고지도자로 선출되는 데 핵심 요인이었습니다. 이제 조선인민군이 그 지위를 물려받았습니다. 조선인민군에 충성파를 배치하여 우리의 군 장악력을 높이십시오."
 NKO_finding_reformist_of_party: "당내 개혁파 물색"
 NKO_finding_reformist_of_party_desc: "당내에 개혁파가 없는 것은 아니지만, 그들은 김정일의 반대 앞에서 목소리를 내기를 두려워합니다. 우리가 그들의 지지를 얻는다면 조선을 변화시킬 가능성이 더 커집니다."
 NKO_power_struggle: "권력 투쟁"
 NKO_power_struggle_desc: "조만간 오늘날 북한의 위대한 지도자인 김정일 동지는 세상을 떠날 것이며, 그의 후계자는 두 아들 김정남과 김정은 중 한 명이 될 것임이 분명합니다. 그러나 \\"한 나라에 두 주인은 있을 수 없으며\\", 두 사람 모두 아버지의 신임을 얻을 방법을 찾아야 합니다. 후계자가 결정될 때까지 한쪽 후보를 다른 쪽보다 지지하면 £stability_texticon §Y안정도§!가 감소합니다.\n\n£stability_texticon §Y안정도§!가 45%보다 높지 않다면 김정일이 사망한 뒤 군사정권이 권력을 장악하려 할 것입니다.\n\n현재 £stability_texticon §Y안정도§!: [?NKO.stability|1%]\n\n현재,\n§O김정은§!의 정통성: §Y[?ROOT.NKO_kim_jong_un]%§!\n§G김정남§!의 정통성: §Y[?ROOT.NKO_kim_jong_nam]%§!\n\n§Y김정일이 선택한 후계자§!: [ROOT.GetChosenSuccessor]\n§R현재 가장 유력한 후계자§!: [ROOT.GetSuccessor]\n\n우리의 지도자 §Y김정일§!은 2012년을 보지 못할 수도 있으므로, §Y2011년§!에 후계자를 선택할 준비를 하십시오."
 NKO_1_increase_kim_jong_un_tt: "김정은의 지지가 1% §Y증가§!합니다"
 NKO_2_increase_kim_jong_nam_tt: "김정남의 지지가 2% §Y증가§!합니다"
 NKO_3_increase_kim_jong_un_tt: "김정은의 지지가 3% §Y증가§!합니다"
 NKO_3_increase_kim_jong_nam_tt: "김정남의 지지가 3% §Y증가§!합니다"
 NKO_2_5_increase_kim_jong_un_tt: "김정은의 지지가 2% ~ 5% §Y증가§!합니다"
 NKO_2_5_increase_kim_jong_nam_tt: "김정남의 지지가 2% ~ 5% §Y증가§!합니다"
 NKO_5_decrease_kim_jong_un_tt: "김정은의 지지가 5% §Y감소§!합니다"
 NKO_2_decrease_kim_jong_nam_tt: "김정남의 지지가 2% §Y감소§!합니다"
 NKO_3_decrease_kim_jong_un_tt: "김정은의 지지가 3% §Y감소§!합니다"
 NKO_4_increase_kim_jong_nam_tt: "김정남의 지지가 4% §Y증가§!합니다"
 NKO_5_increase_kim_jong_nam_tt: "김정남의 지지가 5% §Y증가§!합니다"
 NKO_kim_jong_il_death: "김정일의 사망"
 NKO_kim_jong_il_death_desc: "\n--------------\n이 국가 중점은 §Y2011년 12월 17일 오전 8시 30분§!에 §Y잠금 해제§!됩니다. 사랑하는 위대한 영도자이자 조선로동당 총비서이며 국방위원회 위원장인 김정일은 2011년 12월 17일 오전 8시 30분, 열차로 지방 현지지도를 가던 도중 심인성 쇼크를 동반한 급성 심근경색으로 사망하였습니다."
 NKO_junta: "군사정권 쿠데타"
 NKO_junta_desc: "중국과 베트남의 성공적인 개혁은 우리에게 좋은 본보기가 되었지만, 그들의 개혁이 순탄했던 것은 아닙니다. 우리 자신의 개혁이 실패한다면 우리는 죽어 없어지고 남한에 병합될 것입니다. 게다가 김정은과 김정남은 서로 다른 수준의 개혁을 원합니다. 나라도 당도 잃지 않으려면 가장 어려운 선택을 해야 할 것입니다..."
 NKO_preserve_songun: "선군 유지"
 NKO_preserve_songun_desc: "선군은 군대의 토대이며, 우리는 그 이념을 반드시 수호해야 합니다."
 NKO_entrench_military_authority: "군부 권위 공고화"
 NKO_entrench_military_authority_desc: "우리가 군대를 이용해 김씨 왕조로부터 권력을 빼앗았지만, 군대 내에는 여전히 일부 김씨 충성파가 남아 있습니다. 우리의 \\"수단\\"으로 그들을 설득할 것입니다..."
 NKO_smash_black_market: "\\"장마당\\" 분쇄"
 NKO_smash_black_market_desc: "\\"장마당\\" 세력은 우리나라에 큰 해를 끼치고 있으며 즉시 저지되어야 합니다!"
 NKO_determining_the_loyalty_of_army: "군의 충성도 판별"
 NKO_determining_the_loyalty_of_army_desc: "이제 우리는 일부 충성파를 승진시켜 그들이 우리에게 더욱 복종하게 만들 수 있습니다."
 NKO_purge_dissenters: "반대파 숙청"
 NKO_purge_dissenters_desc: "권력 이양이라는 이 중대한 시기에 국가의 안정을 유지하기 위해, 우리는 모든 잠재적 반체제 인사들을 즉시 체포해야 합니다!"
 NKO_crush_the_kims: "김씨 일가 처형"
 NKO_crush_the_kims_desc: "김정일의 아들들을 살려두는 것은 결국 불안정 요인이 되므로, 비밀리에 처형하십시오!"
 NKO_constrain_the_donju: "돈주 억제"
 NKO_constrain_the_donju_desc: "돈주는 과거에 우리나라의 경제 발전에 작게나마 기여했으므로, 그들이 계속 활동하도록 두십시오..."
 NKO_end_the_donju: "밀수 단속"
 NKO_end_the_donju_desc: "밀수는 중범죄이며, 국가 경제에 대한 기여에도 불구하고 이제는 이러한 범법자들을 완전히 소탕할 때입니다."
 NKO_high_pressure_politics: "고압적 정치"
 NKO_high_pressure_politics_desc: "민중의 불만이 극에 달하여, 우리의 통치를 유지하기 위해서는 강압적 수단을 사용해야 합니다."
 NKO_empower_the_state_security_department: "정찰총국 강화"
 NKO_empower_the_state_security_department_desc: "이제 우리는 군의 정찰총국에 더 큰 책임을 맡기고 이를 국가의 지배적인 정보 기관으로 만들도록 승인해야 합니다. 정찰총국은 잠재적 사보타주 분자와 제국주의 스파이를 색출하고 체포하며 제거할 것입니다."
 NKO_chi_military_support: "중국의 군사 지원"
 NKO_chi_military_support_desc: "중국은 영원한 형제이자 동맹입니다. 국제 무대에서 살아남기 위해 우리는 다시 한번 베이징의 품에 안길 것입니다."
 NKO_chi_invest_resources: "자원 채굴 지원"
 NKO_chi_invest_resources_desc: "우리는 중국 자원 기업들이 우리 영토에 진출하도록 허용할 준비가 되어 있습니다."
 NKO_chi_banks: "중국 은행"
 NKO_chi_banks_desc: "우리는 중국 은행들이 우리나라에 진출하도록 허용할 준비가 되어 있습니다."
 NKO_chi_help_factories: "중국 공장"
 NKO_chi_help_factories_desc: "우리는 중국 정부에 우리 영토 내 신규 공장 건설에 대한 도움을 요청할 계획입니다."
 NKO_chi_huawei: "화웨이와의 협력"
 NKO_chi_huawei_desc: "화웨이는 세계에서 가장 유명한 기업 중 하나이며, 우리는 중국 정부가 이들이 우리 영토에서 사업을 하도록 허용해 주기를 바랍니다."
 NKO_military_collectives: "군사정권 통치"
 NKO_military_collectives_desc: "우리 인민은 서방을 받아들일 준비가 되어 있지 않으며, 우리는 계속해서 우리의 통치를 유지해야 합니다."
 NKO_encourage_private_enterprise: "민간 기업 장려"
 NKO_encourage_private_enterprise_desc: "민간 기업 활동은 우리 경제가 나아가는 미래의 동력이며, 우리는 이를 장려할 것입니다."
 NKO_market_based_economy: "시장 기반 경제"
 NKO_market_based_economy_desc: "우리의 경제 체제는 문제와 끊임없는 위기만을 가져왔으며, 이제는 이를 바꿀 때입니다."
 NKO_reorganising_government: "정부 개편"
 NKO_reorganising_government_desc: "이제 정부를 개편할 때입니다. 나라에는 새로운 정부가 필요합니다."
 NKO_kim_jong_un: "김정은"
 NKO_kim_jong_un_desc: "김정일의 후계자로서 큰 기대를 받아온 김정은은 나라가 안정되고 단합된 동안 경제를 부양할 적절한 경제 개혁을 이루기를 바랍니다. 그러나 그는 안정적인 권력 장악력과 \\"백두혈통\\"이라는 숭고한 지위를 잃고 싶어 하지 않습니다..."
 NKO_consolidate_power: "권력 공고화"
 NKO_consolidate_power_desc: ""
 NKO_light_industry_develop: "경공업 발전"
 NKO_light_industry_develop_desc: ""
 NKO_criticize_ineptitude: "무능 비판"
 NKO_criticize_ineptitude_desc: ""
 NKO_improvement_of_people_live: "인민 생활 향상"
 NKO_improvement_of_people_live_desc: ""
 NKO_people_support: "인민의 지지"
 NKO_people_support_desc: ""
 NKO_centralize_power: "권력 집중화"
 NKO_centralize_power_desc: ""
 NKO_root_out_corruption: "부패 척결"
 NKO_root_out_corruption_desc: ""
 NKO_formalize_power_structures: "권력 구조의 공식화"
 NKO_formalize_power_structures_desc: ""
 NKO_assassinate_kim_jong_nam: "김정남 암살"
 NKO_assassinate_kim_jong_nam_desc: "김정남이 죽지 않는 한 그는 항상 우리 정권의 안정에 위협이 될 것입니다. 어떤 대가를 치르더라도 그를 제거하십시오."
 NKO_appoint_loyalists: "충성파 임명"
 NKO_appoint_loyalists_desc: ""
 NKO_civilian_control_of_the_economy: "경제에 대한 민간 통제"
 NKO_civilian_control_of_the_economy_desc: ""
 NKO_party_state_army: "당, 국가, 군대"
 NKO_party_state_army_desc: ""
 NKO_party_unchecked: "영원한 당"
 NKO_party_unchecked_desc: ""
 NKO_eternal_juche_sasang: "영원한 주체사상"
 NKO_eternal_juche_sasang_desc: ""
 NKO_kim_jong_nam: "김정남"
 NKO_kim_jong_nam_desc: "김정일의 장남 김정남은 오랫동안 북한 정치에서 논란의 인물이었습니다. 한때 유력한 후계자로 여겨졌으나, 정권에 대한 공개적 비판과 이후의 망명으로 인해 반체제의 상징이 되었습니다. 경제 개혁과 국제사회와의 교류를 주장하는 김정남의 비전은 동생 김정은의 전통주의적 접근과 극명하게 대조됩니다. 그의 북한 복귀는 보다 개방적인 정책으로의 전환과 기존 질서에 대한 잠재적 도전을 의미할 수 있습니다."
 NKO_face_world: "세계와 마주하기"
 NKO_face_world_desc: "나라의 제도 개혁은 외부의 지원 없이는 이루어질 수 없으므로, 우리는 통치의 외교적 측면에 집중하고 세계와 좋은 관계를 맺을 필요가 있습니다."
 NKO_diplomatic_overtures: "각국과의 외교 관계 수립"
 NKO_diplomatic_overtures_desc: "북한 외교의 두 번째 단계는 여러 나라와 공식 외교 관계를 수립하는 것이며, 이는 나라의 개혁 경로를 원활하게 해 줄 것입니다."
 NKO_step_up_joint_ventures: "합작 사업 추가 유치"
 NKO_step_up_joint_ventures_desc: "외국인 투자는 우리 경제를 개혁하는 데 도움이 되는 통로이며, 우리는 이를 환영합니다."
 NKO_embrace_the_people: "인민 포용"
 NKO_embrace_the_people_desc: "우리나라는 영원히 닫혀 있을 수 없습니다. 이제 팔을 벌려 인민을 끌어안고 다른 북한을 만들어 갈 때입니다."
 NKO_loosen_information_monopoly: "정보 독점 완화"
 NKO_loosen_information_monopoly_desc: "인민은 자유롭게 자신의 의견을 표현할 수 있습니다."
 NKO_tone_down_propaganda: "공식 선전 축소"
 NKO_tone_down_propaganda_desc: "공식 언론은 과거에 국가의 의지를 구현해 왔지만, 우리의 민주화 개혁은 이제 그들에게 \\"민주주의\\"를 강요할 필요가 없습니다."
 NKO_end_forced_labor: "강제 노동 철폐"
 NKO_end_forced_labor_desc: "더 이상의 강제 노동은 없으며, 우리는 열린 세계로 나아갑니다."
 NKO_expand_sezs: "경제특구 확대"
 NKO_expand_sezs_desc: "우리는 라선과 개성의 경제특구의 도움 없이는 경제를 개혁할 수 없으며, 더 많은 경제특구를 설립하여 일부 사람들이 먼저 부유해지도록 할 수 있습니다."
 NKO_end_juche: "주체사상 폐기"
 NKO_end_juche_desc: "주체사상은 만병통치약이 아니며, 우리에게는 더 과학적인 지도 모델이 필요합니다."
 NKO_foreign_knowledge: "외부 연구 인재"
 NKO_foreign_knowledge_desc: "조선민주주의인민공화국은 지난 수십 년간의 억압적 정책으로 많은 인재를 잃었으며, 인재 격차를 메우기 위해 외부 연구자를 일부 영입할 수 있습니다."
 NKO_join_the_wto: "WTO 가입"
 NKO_join_the_wto_desc: "우리는 너무 오랫동안 세계무역기구 회원국들이 누리는 세계 무역의 혜택에서 배제되어 왔습니다. 이제 이를 바꾸려는 만큼, 우리의 개혁을 위해 서구 자유주의 경제 질서의 메커니즘을 더 잘 활용할 수 있습니다."
 NKO_preserve_the_party: "조선노동당의 영도 유지"
 NKO_preserve_the_party_desc: "개혁개방이 노동당의 영도를 끝내는 것과 같은 것은 아니며, 노동당은 인민을 밝고 번영하는 미래로 이끌 수 있습니다."
 NKO_appeal_to_the_youth: "청년층에 호소"
 NKO_appeal_to_the_youth_desc: "우리 개혁의 중추는 바로 청년들입니다."
 NKO_the_choson_dream: "조선의 꿈"
 NKO_the_choson_dream_desc: "\\"조선의 꿈\\"은 [NKO.GetLeader] 주석이 제시한 새로운 개념으로, 조선 민족의 개인적, 국가적 목표를 함축하고 있습니다. 여기에는 경제, 정치, 국제 분야를 비롯한 다양한 영역에서의 열망이 담겨 있습니다."
 NKO_democracy_with_north_characteristics: "북한식 민주주의"
 NKO_democracy_with_north_characteristics_desc: "서구식 민주주의는 조선민주주의인민공화국에 전적으로 적합하지 않으며, 조선민주주의인민공화국에는 자신만의 특색을 가진 민주주의가 필요합니다."
 NKO_people_before_party: "당보다 인민"
 NKO_people_before_party_desc: "인민이 나라의 주인입니다!"
 NKO_elections: "지방 선거"
 NKO_elections_desc: "우리의 개혁에는 정치 체제의 민주화가 포함되며, 인민은 자신들이 원하는 지도자를 선택할 권한을 갖게 될 것입니다."
 NKO_free_expression: "표현의 자유"
 NKO_free_expression_desc: "북한 인민은 너무 오랫동안 억압적 정책 아래 억눌려 왔으며, 인민에게 부여되는 가장 우선적인 자유는 언론의 자유입니다."
 NKO_byungjin: "병진"
 NKO_byungjin_desc: "고난의 행군 시기에 현명한 김정일 장군은 안정을 유지하기 위해 \\"선군\\" 정책을 채택함으로써 우리나라를 지탱해 냈습니다. 그러나 이제 나라의 경제가 회복되었으니, 낡은 군사 중심의 접근법을 버리고 군사와 경제를 함께 발전시킬 때입니다!"
 NKO_scale_back_spending: "정부 지출 축소"
 NKO_scale_back_spending_desc: ""
 NKO_encourage_consumption: "소비 장려"
 NKO_encourage_consumption_desc: ""
 NKO_loosen_grip_on_soes: "국영 기업 통제 완화"
 NKO_loosen_grip_on_soes_desc: ""
 NKO_state_owned_enterprises_competition: "국영 기업 간 경쟁"
 NKO_state_owned_enterprises_competition_desc: ""
 NKO_resorts_and_tourism: "리조트와 관광"
 NKO_resorts_and_tourism_desc: "국제 제재로 인해 우리가 외화를 얻을 방법은 몇 가지 되지 않습니다. 관광을 강화하여 전 세계 사람들이 와서 북한의 아름다움을 보게 하십시오!"
 NKO_samjiyon: "삼지연"
 NKO_samjiyon_desc: "삼지연은 북한의 위대한 혁명 성지입니다. 이곳은 중국의 옌안과 비슷한 위상을 지니고 있습니다. 사람들이 더 많은 애국주의 교육을 받을 수 있도록 이곳을 건설하는 데 힘써야 합니다."
 NKO_incentive_based_economy: "인센티브 기반 경제"
 NKO_incentive_based_economy_desc: "기업에 대한 중앙의 통제를 완화한 것이 성과를 보였습니다. 관리자가 생산성에 따라 보상하고 생산물의 일부를 보유하도록 허용함으로써, 국가는 경제의 핵심 부문을 포기하지 않으면서도 성장을 위해 개인의 이익을 활용합니다."
 NKO_empower_the_donju: "돈주 육성"
 NKO_empower_the_donju_desc: "나라가 발전을 위해 외부 세계에 지나치게 의존해서는 안 되지만, 돈주 없이는 우리 경제를 지속할 수 없습니다. 그들에게 무역에 유리한 더 많은 권리를 주고 국가 경제의 선도자가 되게 하여, 조선 경제의 천리마가 달리게 하십시오!"
 NKO_weaken_the_donju: "돈주 약화"
 NKO_weaken_the_donju_desc: "중국과 남한의 상품을 재포장하여 되파는 것으로는 우리나라가 부유해지지 않았습니다. 우리는 자체 산업 브랜드에 집중하여 북한 브랜드가 세계 시장의 정상에 오르게 해야 합니다!"
 NKO_protect_state_owned_business: "국영 기업 보호"
 NKO_protect_state_owned_business_desc: ""
 NKO_encourage_foreign_investment: "외국인 투자 장려"
 NKO_encourage_foreign_investment_desc: "우리 국내 산업이 아무리 탄탄하다 해도 해외 투자 없이는 그 경제적 잠재력을 온전히 끌어낼 수 없습니다. 우리나라에 대한 외국인 직접 투자를 장려하기 위해 인센티브를 제공해야 합니다."
 NKO_privatize_means_of_production: "생산 수단의 사유화"
 NKO_privatize_means_of_production_desc: ""
 NKO_economy_revival: "경제 부흥"
 NKO_economy_revival_desc: "\\"고난의 행군\\"이 끝났으니, 이제 우리 경제를 다시 가동할 때입니다."
 NKO_priorit_for_civilian_industry: "민수 산업 중점"
 NKO_priorit_for_civilian_industry_desc: ""
 NKO_priorit_for_army_industry: "군수 산업 중점"
 NKO_priorit_for_army_industry_desc: "군수 산업은 국내 경제 수요를 끌어올리고 방위력을 강화하는 데 모두 우리에게 필수적입니다."
 NKO_arms_trafficking: "무기 밀매"
 NKO_arms_trafficking_desc: "무기가 창고에 끝없이 쌓여 있을 이유가 어디 있습니까? 이를 금과 맞바꿀 수 있습니다."
 NKO_sinuiju: "신의주 특별행정구"
 NKO_sinuiju_desc: "신의주는 예로부터 북한과 중국 사이 무역의 중요한 항구였습니다. 우리는 중국의 일국양제 방식을 따를 수 있으며, 이를 외국과의 무역에 더 적합하게 만들 수 있습니다."
 NKO_recognition_of_economic_backwardness: "경제적 낙후성 인정"
 NKO_recognition_of_economic_backwardness_desc: "북한 경제는 \\"고난의 행군\\" 이후 시대에 뒤처졌습니다. 우리에게는 근본적인 개혁이 필요합니다."
 NKO_2009_revaluation: "화폐 개혁"
 NKO_2009_revaluation_desc: "고난의 행군 동안 우리 국민경제, 특히 화폐 제도가 큰 타격을 입었습니다. 인민은 우리 화폐를 신뢰하지 않았고 일상생활마저 물물교환으로 가득했습니다. 이러한 상황을 바꾸려면 대담한 화폐 개혁과 평가절상이 필요합니다."
 NKO_revaluation_failure: "화폐 개혁 실패..."
 NKO_revaluation_failure_desc: ""
 NKO_air_koryo: "고려항공"
 NKO_air_koryo_desc: ""
 NKO_reform_of_the_privatisation_of_collective_farms: "협동농장의 사유화"
 NKO_reform_of_the_privatisation_of_collective_farms_desc: "지역 협동농장에 대한 통제를 완화하여 생산 유인을 높입니다."
 NKO_construction_of_hydraulic_facilities: "수리 시설 건설"
 NKO_construction_of_hydraulic_facilities_desc: "화학 비료에 크게 의존하지 않고 농업 수확량을 늘리려면 더 많은 수리 시설을 건설해야 합니다."
 NKO_free_housing: "추가 무상 주택"
 NKO_free_housing_desc: "인민이 감당할 수 있도록 더 많은 아파트를 건설하십시오!"
 NKO_expand_compulsory_education: "의무 교육 확대"
 NKO_expand_compulsory_education_desc: "교육은 강한 국가의 토대입니다. 의무 교육을 확대하여 더 많은 아동이 높은 수준의 교육을 받을 수 있도록 합니다."
 NKO_chollima_speed_desc: "기반시설 개발은 경제 재건으로 가는 길의 중요한 단계이며, 경제 발전뿐만 아니라 중장비를 운반할 수 있는 도로와 미사일 열차를 운반할 수 있는 철도 등 군사적 목적에도 필요합니다."
 NKO_arduous_march: "고난의 행군"
 NKO_arduous_march_desc: "§R북한 기근§!은 1994년부터 북한에서 일반적인 경제 위기와 함께 대규모 기아가 발생한 시기로, \\"고난의 행군\\"이라고도 합니다."
 NKO_dmz_remilitarized: "비무장지대 재무장 완료"
 NKO_dmz_remilitarized_desc: "비무장지대를 재무장하는 것은 남한과의 갈등을 크게 격화시키겠지만, 다가올 충돌에서 우리 군에 분명한 이점을 줄 것입니다."
 NKO_kor_hostile_action_tt: "최근의 적대 행위로 인해 적대시되지 않았습니다."
 NKO_broken_juche: "무너진 주체"
 NKO_eternal_juche: "영원한 주체"
 NKO_marxism_leninism: "마르크스-레닌주의"
 NKO_democratic_land: "민주주의의 땅"
 NKO_songun_junta: "선군"
 NKO_songun_junta_desc: "선군은 북한의 정책입니다. 이는 나라의 정치와 경제에서 \\"모든 것에 조선인민군이 우선\\"할 것을 요구합니다."
 NKO_self_reliance: "자력갱생"
 NKO_choson_dream: "조선의 꿈"
 NKO_anti_tatmadaw_sentiment: "반 인민군 정서"
 NKO_anti_tatmadaw_sentiment_desc: "조선인민군이 조선의 정치 상황을 대대적으로 개편하기로 했을 때, 군부 통치에 대한 인민의 적대감은 유례없는 수준에 이르러 있었습니다."
 NKO_simhwajo_sageon_legacy: "심화조 사건의 유산"
 NKO_simhwajo_sageon_legacy_desc: "심화조 사건은 1997년부터 2000년까지 조선민주주의인민공화국에서 김정일이 아버지 김일성의 사람들을 제거하기 위해 벌인 대규모 숙청 운동입니다.\n어떤 이들은 이를 \\"북한판 매카시즘\\" 또는 \\"북한판 문화대혁명\\"이라고 불렀습니다."
 NKO_close_dmz: "비무장지대 봉쇄"
 NKO_close_dmz_desc: ""
 NKO_superiority_of_dprk_model: "조선민주주의인민공화국 모델의 우월성"
 NKO_superiority_of_dprk_model_desc: ""
 NKO_abolish_life_time_system_for_cadres_in_leadership: "지도 간부 종신제 폐지"
 NKO_abolish_life_time_system_for_cadres_in_leadership_desc: ""
 NKO_allow_donju_to_join_wpk: "돈주의 조선노동당 입당 허용"
 NKO_allow_donju_to_join_wpk_desc: "돈주는 합법적으로 사업을 하고 법에 따라 세금을 내는 사업가일 뿐입니다. 이들이 조선노동당에 입당하지 못할 이유가 무엇입니까?"
 NKO_kim_jong_un_successor: "§Y김정은§!이 권좌에 올랐습니다."
 NKO_kim_jong_nam_successor: "§Y김정남§!이 권좌에 올랐습니다."
 NKO_chi_propose_trade_agreement_tooltip: "§Y[CHI.GetNameWithFlag]§!와(과) 무역 협정을 맺고 있음\n"
 NKO_russian_friendship: "러시아-북한 동맹"
 NKO_russian_friendship_desc: "러시아는 언제나 우리의 주요 동맹국 중 하나였으며, 소련은 우리의 탄생과 존속에 더욱 깊이 관여했습니다. 우리는 양국 간의 동맹 관계를 다시 되살리려 합니다."
 NKO_south_korea_influency_tt: "[KOR.GetFlag] §Y[ROOT.GetNameWithFlag]§!에서 남한의 §H영향력 배율§!: §R+5%§!"
 NKO_national_recovery_plan_started_tooltip: "§Y$NKO_national_recovery_plan$§!을(를) §Y1§!년 이상 전에 완료함"
 NKO_export.10.a.tt: "§Y3개 경보병 대대§!(대대 요구량의 3배)에 충분한 §Y소총§!과 §Y지휘 장비§!를 인도합니다."
 NKO_export.10.c: "§Y차량화 보병§! 패키지 요청: 소총, 다용도 차량 및 지휘 장비"
 NKO_export.10.c.tt: "§Y3개 차량화 보병 대대§!(대대 요구량의 3배)에 충분한 §Y소총§!, §Y다용도 차량§!, §Y지휘 장비§!를 인도합니다."
 NKO_export.10.e: "§Y기갑§! 패키지 요청: 주력 전차 및 지휘 장비"
 NKO_export.10.e.tt: "§Y3개 기갑 대대§!(대대 요구량의 3배)에 충분한 §Y주력 전차§!와 §Y지휘 장비§!를 인도합니다. 현대식 북한 전차 설계가 필요합니다."
 NKO_export.10.f: "§Y기계화 보병§! 패키지 요청: 보병전투차, 장갑차, 소총 및 지휘 장비"
 NKO_export.10.f.tt: "§Y3개 기계화 보병 대대§!(대대 요구량의 3배)에 충분한 §Y보병전투차§!, §Y장갑차§!, §Y소총§!, §Y지휘 장비§!를 인도합니다. 현대식 북한 차량 모듈이 필요합니다."
 korea.50.b: "동아시아는 결코 예전과 같지 않을 것이다."
 NKO_tank_facility_foundry_trait: "전차 시설 주조소"
 NKO_second_economic_committee_trait: "제2경제위원회"
 NKO_kim_jong_il_death_tt: "김정일이 사망했습니다"
 NKO_5_increase_kim_jong_un_tt: "김정은의 지지가 5% §Y증가§!합니다"
 NKO_5_decrease_kim_jong_nam_tt: "김정남의 지지가 5% §Y감소§!합니다"
 NKO_korean_repair_frontline_workers_desc: "2024년 동반자 조약에 따라 북한 노동 여단이 러시아 서부 지역의 후방에서 철도 조차장, 비행장, 조선소, 무기 공장을 재건하는 작업을 수행합니다. 평양은 이 파견의 대가로 현금과 연료를 받습니다."
 NKO_korean_repair_frontline_workers_sov_desc: "수천 명의 노동자가 국가 계약에 따라 러시아 재건 현장에 파견되었습니다. 이들의 임금은 경화로 평양에 돌아오지만, 이들은 조선인민군이 병력을 모집하는 것과 같은 인력 풀에서 차출됩니다."
 NKO_korean_repair_civil_workers_desc: "북한 건설 인력이 러시아 전역의 민간 재건 작업에 배정되어 공장, 주택, 도로를 보수합니다. 모스크바가 이들의 유지비를 부담하며 평양에 계약 대금을 지불합니다."
 NKO_korean_repair_civil_workers_sov_desc: "민간 노동 인력이 국가 계약에 따라 러시아 건설 콤비나트에 배치됩니다. 이 파견은 해외에서 경화를 벌어들이지만, 국내 인력을 대가로 치릅니다."
 NKO_korean_ratnik_conversion_desc: "러시아가 공급한 라트니크 보병 장비가 조선인민군에 도달합니다. 방탄복, 하중 분산 장비, 광학 장비, 방한복이 포함됩니다. 이 장비는 자국산 보급품보다 크게 향상되었으며, 그만큼 유지 비용도 많이 듭니다."
