 sp_monitor_portal_energy_emissions_project: "Surveiller les émissions d'énergie des portails"
 sp_monitor_portal_energy_emissions_project_desc: "Avec l'aide de nos satellites, nous surveillerons les émissions d'énergie du portail le plus proche. Cela nous permettra de rassembler davantage de renseignement sur l'ennemi et ses mouvements. Si nous réussissons, nous pourrons aussi nous débarrasser des pannes cycliques de notre réseau satellite causées par ces émissions."
 sp_monitor_portal_energy_emissions_project_prototype: "Marques énergétiques irrégulières"
 sp_monitor_portal_energy_emissions_project_prototype_desc: "Nos satellites endommagés ont réussi à signaler des marquages énergétiques irréguliers qu'ils captaient en permanence depuis les portails. Il semble qu'ils soient responsables des pannes de notre réseau satellite. Nous pouvons préparer des contre-mesures pour protéger nos satellites de ces émissions, ou consacrer plus de temps à étudier le phénomène pour mieux le comprendre."
 sp_monitor_portal_energy_emissions_project_prototype_a: "Le progrès est le plus important"
 sp_monitor_portal_energy_emissions_project_prototype_b: "Passer du temps pour des recherches supplémentaires"
 sp_spies_in_hive_project: "Espions dans la ruche"
 sp_spies_in_hive_project_desc: "Certaines unités chimères retournent vers la zone de leur portail après un assaut réussi. Elles semblent avoir un comportement quasi instinctif durant cette phase, créant une fenêtre pour les marquer d'un traceur et d'une petite caméra. Ensuite, nous les laisserons retourner au portail. Qu'est-ce qui pourrait mal tourner ?"
 sp_spies_in_hive_project_prototype: "Les mechs peuvent être nos livreurs"
 sp_spies_in_hive_project_prototype_desc: "Puisque nous produisons des mechs, nous pouvons les utiliser pour poser des traceurs tout en combattant les forces chimères. Ce sera risqué et nous perdrons à coup sûr de nombreuses bonnes machines et leurs pilotes, mais cela peut nous rapprocher de la fin de cette guerre."
 sp_spies_in_hive_project_prototype_a: "Utilisez uniquement des Mechs"
 sp_spies_in_hive_project_prototype_b: "Nous ne pouvons pas trop perdre de mechs, l'armée aidera"
 sp_spies_in_hive_project_prototype_c: "Ne prenez pas de risque supplémentaire"
 sp_the_tesla_weapon_project: "L'arme T.E.S.L.A."
 sp_the_tesla_weapon_project_desc: "Le Tactical Electromagnetic System of Linear Annihilation (T.E.S.L.A.) est une super-arme conçue pour émettre une puissante impulsion électromagnétique (IEM) capable de désactiver les systèmes électroniques dans un large rayon. Cette arme pourrait être notre clé pour perturber les portails et affaiblir durablement les forces chimères."
 sp_the_tesla_weapon_project_prototype: "Réorienter le secteur de la recherche"
 sp_the_tesla_weapon_project_prototype_desc: "Nous pouvons réorienter tous nos efforts de recherche vers le développement de l'arme T.E.S.L.A. Cela accélérera le projet, mais pourrait retarder d'autres initiatives de recherche importantes."
 sp_the_tesla_weapon_project_prototype_a: "Concentrer toute la recherche sur T.E.S.L.A."
 sp_the_tesla_weapon_project_prototype_b: "Équilibrer les efforts de recherche"
 sp_the_tesla_weapon_project_prototype_c: "Nous ne pouvons pas nous permettre de retards"
 sp_hacs_gen_one_project: "BF-38 Atlas"
 sp_hacs_gen_one_project_desc: "La première génération de mechs High Agility Combat System (HACS) sera une étape significative dans notre lutte contre les Chimères. Ces mechs seront notre plus grand atout pour combattre les forces chimères."
 sp_hacs_gen_one_project_prototype_western_one: "Durabilité ou puissance de feu ?"
 sp_hacs_gen_one_project_prototype_western_one_desc: "Le champ de bataille est un endroit rude, et nos mechs doivent encaisser le feu lourd tout en portant de puissants coups à l'ennemi. Nous pouvons nous concentrer sur la durabilité de nos HACS, les rendant plus résilients au combat. Alternativement, nous pouvons prioriser la puissance de feu, en les équipant d'armement avancé pour abattre l'ennemi rapidement."
 sp_hacs_gen_one_project_prototype_western_one_a: "Améliorer la durabilité"
 sp_hacs_gen_one_project_prototype_western_one_b: "Donner la priorité à la puissance de feu"
 sp_hacs_gen_one_project_prototype_western_one_c: "C'est parfait tel quel"
 sp_hacs_gen_one_project_prototype_western_two: "Priorité des composants HACS"
 sp_hacs_gen_one_project_prototype_western_two_desc: "Nous avons quelques fonds de réserve pour améliorer la conception de nos HACS. Nous pouvons soit renforcer la mobilité de nos mechs, les rendant plus rapides et agiles sur le champ de bataille. Alternativement, nous pouvons investir dans l'amélioration de leurs systèmes d'armes, accroissant leurs capacités offensives."
 sp_hacs_gen_one_project_prototype_western_two_a: "Se concentrer sur la mobilité"
 sp_hacs_gen_one_project_prototype_western_two_b: "Se concentrer sur l'armement"
 sp_hacs_gen_one_project_prototype_eastern_one: "Réduction possible de la production"
 sp_hacs_gen_one_project_prototype_eastern_one_desc: "Nous pouvons sauter certains déclencheurs de sécurité et systèmes redondants dans la conception de nos HACS pour accélérer la production. Cela pourra légèrement augmenter le taux de pannes, mais nous permettra de déployer plus de mechs plus vite."
 sp_hacs_gen_one_project_prototype_eastern_one_a: "Nous en avons besoin au plus vite"
 sp_hacs_gen_one_project_prototype_eastern_one_b: "Nous devrions y mettre plus de travail"
 sp_hacs_gen_one_project_prototype_eastern_one_c: "Maintenir les normes de production actuelles"
 sp_hacs_gen_one_project_prototype_eastern_two: "Efficacité sur le champ de bataille"
 sp_hacs_gen_one_project_prototype_eastern_two_desc: "Nous pouvons construire un plus grand nombre de mechs HACS pour submerger l'ennemi par le nombre. Alternativement, nous pouvons nous concentrer sur l'amélioration de la conception pour les rendre plus efficaces au combat, même si cela signifie produire moins d'unités."
 sp_hacs_gen_one_project_prototype_eastern_two_a: "Nous avons besoin de plus de mechs"
 sp_hacs_gen_one_project_prototype_eastern_two_b: "Améliorons leur conception"
 sp_hacs_gen_two_project: "GSK-41 Bogatyr"
 sp_hacs_gen_two_project_desc: "Le moment est venu d'une nouvelle amélioration de nos majestueux mechs HACS. Grâce à des ingénieurs et scientifiques civils passionnés, nous avons encore amélioré la conception. Peut-être trouverons-nous même un moyen de les rendre moins chers à produire."
 sp_hacs_gen_two_project_prototype_western_one: "Réduction des coûts Randallite"
 sp_hacs_gen_two_project_prototype_western_one_desc: "En fouillant de vieilles notes de recherche, nous avons trouvé des idées pour réduire la quantité de randallite utilisée dans la production des HACS. En les appliquant, nous pouvons baisser le coût de chaque mech sans trop impacter leurs performances."
 sp_hacs_gen_two_project_prototype_western_one_a: "Sure!"
 sp_hacs_gen_two_project_prototype_western_one_b: "Nous ne pouvons pas affaiblir nos mechs"
 sp_hacs_gen_two_project_prototype_eastern_one: "Réduction des coûts Randallite"
 sp_hacs_gen_two_project_prototype_eastern_one_desc: "Grâce aux nouvelles recherches sur la randallite, nous avons trouvé un moyen de réduire encore la quantité de cette précieuse ressource utilisée dans la production des HACS. Cela nous permettra de produire plus de mechs avec la même quantité de randallite, mais les machines devront sacrifier une partie de leurs performances."
 sp_hacs_gen_two_project_prototype_eastern_one_a: "Bien sûr, pourquoi pas"
 sp_hacs_gen_two_project_prototype_eastern_one_b: "C'est trop de désavantage sur le champ de bataille"
 sp_hacs_gen_three_project: "SAS-32 Hercules"
 sp_hacs_gen_three_project_desc: "Le moment est venu d'une nouvelle amélioration de nos majestueux mechs HACS. Grâce à des ingénieurs et scientifiques civils passionnés, nous avons encore amélioré la conception. Peut-être trouverons-nous même un moyen de les rendre moins chers à produire."
 sp_hacs_gen_three_project_prototype_one: "L'arme finale"
 sp_hacs_gen_three_project_prototype_one_desc: "Nos ingénieurs ont proposé une refonte radicale des mechs HACS, visant à créer l'arme ultime contre les Chimères. Cette nouvelle conception poussera les limites de la technologie actuelle, aboutissant à un mech plus rapide, plus fort et plus résilient que jamais — mais à un prix bien plus élevé."
 sp_hacs_gen_three_project_prototype_one_a: "C'est l'arme ultime"
 sp_hacs_gen_three_project_prototype_one_b: "Nous en avons besoin maintenant !"
 sp_hacs_gen_three_project_prototype_one_c: "Le design actuel est parfait"
 EH_spirits_lasts_until_war_is_active_TT: "§YCet esprit national durera jusqu'à ce qu'il y ait guerre contre les Envahisseurs.§!"
