l_polish:
 MD_wacky.1.t: "Niezarejestrowany kontakt w Wigilię"
 MD_wacky.1.d: "Obrona powietrzna wykryła nisko lecący i powolny obiekt, który tuż po północy przekroczył granicę, i bez ostrzeżenia podjęła przeciwko niemu działania. Zespół podejmujący melduje o saniach, dziewięciu reniferach oraz bardzo dużym worku z zapakowanymi pakunkami."
 MD_wacky.1.a: "Sklasyfikuj wrak."
 MD_wacky.1.b: "Przeproś dzieci."
 MD_wacky.2.t: "Niezidentyfikowany obiekt nad stolicą"
 MD_wacky.2.d: "Tysiące ludzi sfotografowało nieruchome, trójkątne, bezgłośne światło, które przez jedenaście minut utrzymywało się nad dzielnicą rządową. Siły powietrzne utrzymują, że ich radary nie zarejestrowały absolutnie niczego."
 MD_wacky.2.a: "Podnieś myśliwce przechwytujące w powietrze."
 MD_wacky.2.b: "Ogłoś, że to był balon meteorologiczny."
 MD_wacky.3.t: "Kosmiczne szczątki spadły na parking ministerstwa"
 MD_wacky.3.d: "Tytanowy zbiornik paliwa z nieczynnego satelity telekomunikacyjnego spadł w nocy na ziemię, miażdżąc trzy pojazdy służbowe oraz żywopłot. Nikt nie ucierpiał, a żadna agencja kosmiczna nie chce przyznać, do kogo należał ten satelita."
 MD_wacky.3.a: "Obciążyć kosztami państwo dokonujące startu."
 MD_wacky.3.b: "Umieść to w muzeum."
 MD_wacky.4.t: "Automaty sprzedające paraliżują sieć ministerstwa"
 MD_wacky.4.d: "Ministerstwo Spraw Wewnętrznych przez tydzień polowało na zagraniczny cyberatak, zanim technicy wyśledzili ruch do inteligentnych automatów sprzedających znajdujących się w budynku, które w nieskończonej pętli po cichu zmieniały kolejność napojów gazowanych."
 MD_wacky.4.a: "Odłącz od zasilania wszystkie maszyny w budynku."
 MD_wacky.4.b: "Niech prasa wierzy, że to było obce mocarstwo."
 MD_wacky_events: "Zwariowany incydent"
 MD_wacky_classified_intercept: "Przechwycenie tajnej wiadomości"
 MD_wacky_classified_intercept_desc: "Starcie to nie figuruje w żadnym opublikowanym rejestrze, a załogi biorące w nim udział otrzymały polecenie, by nigdy nie omawiać kształtu obiektu będącego celem. Nagranie z kamery pokładowej stanowi jednak doskonały materiał szkoleniowy."
 MD_wacky_ufo_conspiracy: "Wyjaśnienie dotyczące balonu meteorologicznego"
 MD_wacky_ufo_conspiracy_desc: "Nikt nie wierzy w oficjalne oświadczenie. Dwa konkurencyjne komitety obywatelskie publikują obecnie sprzeczne ze sobą analizy zdjęć, a pewna stacja telewizyjna zleciła realizację filmu dokumentalnego na temat milczenia rządu."
 MD_wacky_debris_exhibit: "Wystawa szczątków obiektów powracających w atmosferę"
 MD_wacky_debris_exhibit_desc: "Zbiornik paliwa znajduje się w muzeum narodowym, obok zdjęcia trzech pojazdów, na które spadł. Frekwencja wzrosła, a wyjątkowo wielu odwiedzających muzeum uczniów deklaruje teraz chęć podjęcia studiów inżynierskich."
 MD_wacky_phantom_cyber_threat: "Widmowe zagrożenie cybernetyczne"
 MD_wacky_phantom_cyber_threat_desc: "Ministerstwo nigdy nie sprostowało doniesień o wtargnięciu z zewnątrz, a budżet na awaryjne zabezpieczenie sieci zatwierdzono bez ani jednego pytania. Automaty z przekąskami i napojami usunięto z budynku."