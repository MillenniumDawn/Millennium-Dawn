the_great_australia_act: "§2The Great Australia Act§!"
the_great_australia_act_desc: "Perhaps the largest social reform program in our country's history. A massive endeavor to improve Australia's equality and lift millions out of poverty. With sweeping coverage of welfare capacity, an overhaul of eligibility and scale of coverage, increased support payments and a number of programs to assist disadvantaged Australians get ahead."
clean_feed_ast: "§OClean Feed§!"
rudd_tax_reform_ast: "§2Rudd Tax Reform§!"
the_care_act_idea_ast: "Care For All"
reduced_interstate_regulation_ast: "§2Reduced Interstate Regulation§!"
paid_parental_scheme_ast: "Paid Parental Scheme"
paid_parental_scheme_ast_2: "Parental Payments Scheme"
paid_parental_scheme_ast_desc: "Entitles new parents up to 26 weeks of paid leave. Allowing them to take time off from work to better care for their newborns, or adopted children, and encourage a growing population."
paid_parental_scheme_ast_2_desc: "An amalgamation of our parental support schemes, replacing the former Baby Bonus with financial payments to assist new parents. Also entitles new parents up to 26 weeks of paid leave, and once off payments to better care for their newborns, or adopted children, and encourage a growing population."
social_capitalism_ast: "Social Capitalism"
social_capitalism_ast_desc: "Our more hands on approach to managing the economy has come with some benefits, and some minor downsides. We can more directly influence our economy and ensure that it remains aligned to the benefit of our citizens by utilising regulation and direct management. As we work on implementing the approach, our methods will become more refined."
building_the_education_revolution_ast: "§GBuilding the Education Revolution§!"
a_new_era_ast: "A New Era"
a_new_era_ast_desc: "Our nation has entered a new era of equality. Through the constant work of the many, the future is now brighter for all Australians..."
ast_a_national_agreement_tt: "Programs to support the Indigenous Community will unlocked in the Political §2Decisions§! tab."
ast_closing_the_gap_tt: "It will take time before we start to see the §Gresults§! of these programs..."
nrf_ast: "National Reconciliation Foundation"
nrf_ast_desc: "If we're going to ensure the framework for proactive reconciliation exists after our term, we need to create an organisation body dedicated to funding projects that make a difference."
sihip_ast: "Strategic Indigenous Housing and Infrastructure Program (SIHIP)"
sihip_ast_desc: "The Aboriginal members in the Northern Territory have arguably had it the toughest in recent years. The housing, among many other things, has fallen into a state of disrepair, and is in dire need of renovations."
family_reunion_services_ast: "Family Reunion Services"
family_reunion_services_ast_desc: "We can begin developing a program to provide family tracing, reunion, and counseling services for Aboriginal and Torres Strait Islander people who were forcibly removed from their families during the Stolen Generations."
rural_job_initiative_ast: "Rural Job Initiative"
rural_job_initiative_ast_desc: "Working with some of our larger benefactors like Andrew Forrest to create government and private projects, hiring locals for the majority of the work, will spur up opportunity for some of our communities suffering work droughts."
seasonal_worker_visas_ast: "§2Seasonal Worker Visas§!"
ast_keep_the_gears_turning_tt: "New efforts to maintain our security commitments will be available in the §2decisions§! tab."
trans_tasman_trade_deal: "Trans-Tasman Trade Deal"
fruits_of_the_summit: "Fruits of the Summit"
toughen_up_on_boat_arrivals_ast: "Toughen Up on Boat Arrivals"
toughen_up_on_boat_arrivals_ast_desc: "A constant issue in the headlines is asylum seekers arriving by boat. There's no easy solution trying to fix it, but if we don't take a stand against them the opposition will, and then it'll only be a stick they can use against us."
strengthen_police_funding_ast: "Strengthen Police Funding"
strengthen_police_funding_ast_desc: "To help with the rise in gang violence and extremist groups we can pad our departments with funding to secure better equipment and train more personnel."
