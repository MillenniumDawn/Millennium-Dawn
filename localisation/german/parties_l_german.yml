l_german:
 democratic: "Westliche Richtung"
 democratic_noun: "Westlich"
 democratic_desc: "Pro-Westliche Regierung"
 conservatism: "Konservatismus"
 conservatism_desc: "Conservatism: - Western and Pro-Western governments seek to retain the US-centric Liberal World Order that has reigned supreme since the fall of the Soviet Union. Through institutions such as the World Bank and the IMF, they promote economic liberalization and denationalization. While the vast majority of countries with a Western Outlook are various forms of democracies, Pro-Western strongman governments that benefit from the status quo are also behind them.\n\nConservatism is, broadly, the support of traditional institutions and social norms. In democratic countries, this generally manifests as support for religious and nationalist values, a free market economy, and gradual, cautious reform."
 liberalism: "Liberalismus"
 liberalism_desc: "Liberalism: - Western and Pro-Western governments seek to retain the US-centric Liberal World Order that has reigned supreme since the fall of the Soviet Union. Through institutions such as the World Bank and the IMF, they promote economic liberalization and denationalization. While the vast majority of countries with a Western Outlook are various forms of democracies, Pro-Western strongman governments that benefit from the status quo are also behind them.\n\nLiberalism is a widespread ideology with many diverse variants across the world. However, most liberals are united in support of civil liberties, free markets, and democratic government. They generally take a reformist view of politics, seeking to change and transform institutions over time."
 socialism: "Sozialdemokrat"
 socialism_desc: "Social Democrat: - Western and Pro-Western governments seek to retain the US-centric Liberal World Order that has reigned supreme since the fall of the Soviet Union. Through institutions such as the World Bank and the IMF, they promote economic liberalization and denationalization. While the vast majority of countries with a Western Outlook are various forms of democracies, Pro-Western strongman governments that benefit from the status quo are also behind them.\n\nSocial Democrats occupy the left wing of democratic politics. They generally support a strong welfare state, liberal social values, sweeping reforms, and the promotion of human rights, especially for historically oppressed groups. Moderate socialists are also often included under this grouping."
 Western_Autocracy: "Pro-Westliche Autokratie"
 Western_Autocracy_desc: "Pro-Western Autocrat: - Western and Pro-Western governments seek to retain the US-centric Liberal World Order that has reigned supreme since the fall of the Soviet Union. Through institutions such as the World Bank and the IMF, they promote economic liberalization and de-nationalization of laws. While the vast majority of countries with a Western Outlook are various forms of democracies, Pro-Western strongman governments that benefit from the status quo are also behind them.\n\nPro-Western autocracies are not truly in line with \"Western Values\" of democracy, pluralism, and human rights. However, they remain aligned with the West for pragmatic reasons, and often still include some weak liberal institutions- if only to appease their western backers."
 communism: "Emerging Outlook"
 communism_noun: "Emerging"
 communism_desc: "Aufstrebende Regierung"
 Conservative: "Reaktionär"
 Conservative_desc: "Reactionary: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.\n\nReactionaries are displeased with the direction their country has taken, and seek a return to an idealized 'golden age' of the past. As such, they seek to reverse many of the changes their nations have experienced. They are staunchly opposed to liberalism, and as such are generally aligned against the West in the modern era."
 Autocracy: "Autokratie"
 Autocracy_desc: "Autocracy: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.\n\nAutocracies are classic dictatorships, where a single individual wields the lion's share of political power. Autocrats oppose any factions or policies that threaten their power. Those who see the West as the principal foreign threat to their thrones will generally align with the emerging powers."
 Vilayat_e_Faqih: "Schiitische Revolutionäre"
 Vilayat_e_Faqih_desc: "Hardline Shiite Revolutionary: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.\n\nKhomeinism is a hardline Shiite-revolutionary ideology. Opposed to traditional monarchism, socialism, and liberalism alike, Khomeinists support the creation of a theocratic republic, where Shiite religious clerics hold supreme authority over elected officials."
 Mod_Vilayat_e_Faqih: "Moderate schiitische Revolutionäre"
 Mod_Vilayat_e_Faqih_desc: "Moderate Shiite Revolutionary: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.\n\nModerate Shiite politicians, while still generally aligned with Iran geopolitically, do not seek to create Khomeinist theocracy. Instead, they generally favor a more pluralist form of government (democratic or otherwise) influenced by Shiite Muslim values."
 anarchist_communism: "Linker Flüger"
 anarchist_communism_desc: "Left-Wing Radical: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.\n\nLeft-wing radicals promote a more moderate vision of socialism compared to communists, but are still more hardline than social democrats. They generally oppose current international economic and political structures, considering them unfair and exploitative."
 fascism: "Salafistische Richtung"
 fascism_noun: "Salafist"
 fascism_desc: "Totalitäres fundamentalistisches Regime"
 Kingdom: "Königreich"
 Kingdom_desc: "Pro-Establishment Salafism: - Salafism is an ultraconservative, intolerant, fundamentalist offshoot of mainstream Sunni Islam. It has grown in prominence as the Wahabi Gulf Monarchies provided billions in funding for its teachings since the mid-20th century. Salafism has seen particularly violent incarnations in the Taliban, Al-Qaeda, and ISIS. They seek to conquer all Islamic lands and rule them through their harsh interpretation of Islamic Law. They do not recognize other forms of Islam nor minority religions, and will stop at nothing to achieve their goals.\n\nCertain strains of Salafi thought, such as Wahhabism and Madkhalism, advocate the preservation of the status quo over radical revolution and armed jihad. These Salafis share the fundamentalist and intolerant views of Qutbian jihadists, but generally reject violence and support existing governments. Their compliance makes them popular with authoritarian Arab states fearful of the threat that more political strands of Islamism pose to their power."
 Caliphate: "Kalifat"
 Caliphate_desc: "Caliphate: - Salafism is an ultraconservative, intolerant, and fundamentalist offshoot of mainstream Sunni Islam. It has grown in prominence as the Wahabi Gulf Monarchies provided billions in funding for its teachings since the mid-20th century. Salafism has seen particularly violent incarnations in the Taliban, Al-Qaeda, and ISIS. They seek to conquer all Islamic lands and rule them through their harsh interpretation of Islamic Law. They do not recognize other forms of Islam nor minority religions, and will stop at nothing to achieve their goals.\n\nJihadists seek to tear down and destroy the governments of the Islamic world, which they see as heathen and heretical. They seek to spread their version of Islam by gunpoint."
 neutrality: "Blockfreier Ausblick"
 neutrality_noun: "Blockfrei"
 neutrality_desc: "Blockfreie Regierung"
 Neutral_conservatism: "Konservativ"
 Neutral_conservatism_desc: "Conservative: - Non-Aligned governments vary vastly in government types and sub-ideologies, and usually have a very pragmatic approach to their foreign alignments. They may want to further their own national independence or other regional goals, or simply are torn between greater powers, who in their struggle for influence pull them in different directions."
 neutral_Social: "Sozialdemokrat"
 neutral_Social_desc: "Social Democrat: - Non-Aligned governments vary vastly in government types and sub-ideologies, and usually have a very pragmatic approach to their foreign alignments. They may want to further their own national independence or other regional goals, or simply are torn between greater powers, who in their struggle for influence pull them in different directions."
