 EMPLOYMENT_PRIORITY_TT: "§YПриоритет занятости§!"
 EMPLOYMENT_PRIORITY_TT_DELAYED: "У каждого типа зданий есть §Yприоритет§! от 1 до 10. Когда работников меньше, чем рабочих мест, они распределяются пропорционально приоритету и числу рабочих мест каждого типа, поэтому место с приоритетом 10 заполняется в десять раз охотнее, чем с приоритетом 1. Работники, которых полностью укомплектованный сектор не может принять, уходят в другие.\n\nКогда работников хватает на все места, все здания полностью укомплектованы и приоритеты не играют роли. Здания с нехваткой работников производят меньше. Здравоохранение и госуправление получают приоритет наравне с другими секторами, но их укомплектованность не опускается ниже 10%."
