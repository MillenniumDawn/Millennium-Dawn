 AFG_MOTDIV_Tooltip: "£GFX_unit_category_apc_icon_small Raise one §YMechanized Regiment§! with 7 §YMechanized Infantry§! battalions and 2 §YArtillery§! battalions. In §g$STATE_411$§!"
