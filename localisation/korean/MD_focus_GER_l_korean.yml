 GER_the_balanced_Army: "균형 잡힌 군대"
 GER_the_balanced_Army_desc: "오직 균형 잡힌 군대만이 우리에게 미래의 도전에 맞설 충분한 능력을 제공할 수 있습니다."
 germany.45.t: "바텐샤이트 구덩이"
 germany.45.d: "보훔 시는 역사적인 탄광 도시였으나, 석탄 산업이 쇠퇴한 이후 루르 지역의 필수적인 일부를 이루는 활기차고 현대적인 도시로 탈바꿈했습니다.\n\n그러나 석탄 시대의 유산이 불쾌한 흔적으로 되살아날 수 있으며, 특히 옛 지하 탄광이 갑자기 붕괴하여 상당한 크기의 파괴적인 구덩이가 드러나는 경우가 그렇습니다. 이러한 사건 중 하나가 2000년 1월 2일 보훔-회트로프에서 일어났습니다."
 germany.45.a: "시가 처리할 수 있다."
 germany.45.b: "산업 안전 입법을 추진하기에 좋은 때다!"
 germany.47.t: "EXPO 2000 '내일의 세계에 오신 것을 환영합니다!'"
 germany.47.d: "하노버 EXPO 2000은 독일에서 열린 최초의 세계 박람회로서 역사적인 순간을 장식했습니다. 총리 게르하르트 슈뢰더가 공식 개막을 선언하고 대통령 요하네스 라우가 의례적으로 개회를 알리면서 행사는 성대하게 시작되었습니다. 슈뢰더는 연설에서 세계적 협력의 중요성을 강조하며 '이곳 하노버에서 우리는 미래로 가는 다리를 놓고 있습니다. 함께라면 내일의 도전에 대처할 수 있습니다.'라고 말했습니다. 라우 대통령은 책임의 중요성을 한층 강조하며 '우리의 미래는 자연과 기술의 균형에 달려 있으며, 우리가 세상과 어떻게 조화롭게 살아갈지 결정하는 곳이 바로 여기입니다.'라고 선언했습니다. '인간, 자연, 그리고 기술'이라는 주제 아래, EXPO 2000에는 190개국 이상이 모여 전 세계 곳곳의 전시관을 선보였습니다. 이 행사는 시급한 환경 문제의 해결책, 과학 기술의 돌파구, 인류의 풍부한 문화적 다양성을 탐구했습니다. 방문객들은 재생 에너지와 친환경 기술에서부터 21세기 도시 생활 개념에 이르기까지 지속 가능한 개발에 관한 혁신적인 아이디어를 체험했습니다. EXPO 2000은 세계적 협력과 지속 가능한 미래에 대한 영감을 주는 데 중점을 두며, 인류가 지구와 균형을 이루며 번영할 방법에 관한 국제적 대화의 전환점이 되는 것을 목표로 했습니다."
 germany.47.a: "우리도 방문해야 한다"
 germany.90.t: "마침내 모두 갚은 우리의 빚"
 germany.90.d: "우리나라는 제1차, 제2차 세계 대전 중 우리가 입힌 피해에 대해 이웃이자 이제는 동맹이 된 나라들에 대한 빚을 갚아 왔습니다.\n오늘 우리는 마침내 한 시대의 끝과 새로운 독일의 시작을 맞이합니다. 우리는 마침내 과거의 족쇄에서 벗어났으며 앞으로 나아갈 수 있습니다!"
 germany.90.a: "마침내 자유다.."
 germany.91.t: "2000년 BfV 보고서"
 germany.91.d: "연방헌법수호청(BfV)은 헌법 보호를 위한 연방 기관입니다.\n이 기관은 내부의 위협과 영향력으로부터 시민의 국내 안전을 보장합니다.\n이 네오나치와 이슬람 테러리스트를 우리나라에서 억제하려면 이 부서에 충분한 자금을 지원하는 것이 최우선 과제입니다. 그러지 못하면 민주주의의 붕괴와 시민 소요로 이어질 수 있습니다!\n부서의 자금 수준과 내부 안보 위협을 면밀히 감시하는 한, 우리는 위협에 효과적으로 대처할 것입니다."
 germany.91.a: "알겠다"
 germany.200.t: "전쟁 배상을 요구하는 독일!"
 germany.200.d: "[GER.GetName](이)가 [ROOT.GetName]인 우리에게 자국에 대한 전쟁 배상금을 지불하라고 요구했습니다. 솔직히 터무니없고 유치한 일이지만, 독일이 유럽에서 또 다른 대규모 분쟁을 일으키기 직전에 있는 만큼 그들을 달래는 것이 최선입니다.."
 germany.200.a: "그냥 빌어먹을 배상금을 지불하자"
 germany.200.b: "유화? 독일에? 미쳤습니까? 도대체 무슨 소리를 하는 겁니까"
 germany.201.t: "돈을 내놓은 [FROM.GetName]"
 germany.201.d: "우리가 [FROM.GetNameWithFlag]을(를) 상당히 겁먹게 한 모양입니다. 실제로 그들이 우리에게 배상금을 지불할 정도로 말입니다. 새로 얻은 자금을 우리나라의 국력에 돌릴 수 있으니 오늘은 축하하고 기뻐할 날이 될 것입니다!"
 germany.201.a: "훌륭하군"
 germany.202.t: "우리 요청을 무시한 [FROM.GetName]!"
 germany.202.d: "[FROM.GetNameWithFlag]의 저 멍청이들이 우리의 최근 요청을 대놓고 무시하기로 결정했습니다. 이는 잊히지 않을 것이며, 머지않아 그들은 자신의 행동을 후회하게 될 것입니다."
 germany.202.a: "이 일을 잊지 않겠다!"
 germany.203.t: "튀르키예 이주민"
 germany.203.d: "최근 튀르키예 이주민들이 독일로 상당히 많이 들어오고 있습니다. 이는 우리나라의 더 민족주의적인 세력들 사이에서 강한 반응을 불러일으켰고 정치계 내에서 상당한 논쟁을 야기했습니다. 오늘 대규모 튀르키예 이주민 집단이 동독 지역으로 들어가 영구 정착할 계획이라는 정보를 입수했습니다. 이 모든 일을 어떻게 진행할지 결정해야 합니다."
 germany.203.a: "오게 두자, 우리의 문은 열려 있다"
 germany.203.b: "뭐라고? 안 된다. 그리고 본보기를 보이기 위해 추방을 시작한다!"
 germany.204.t: "마약 문제"
 germany.204.d: "최근 사람들은 마약을 합법화해야 하는지, 아니면 범죄화해야 하는지를 놓고 논쟁하고 있습니다. 현재 법은 다소 모호한 영역에 있어 양쪽으로 해석될 수 있습니다. 우리는 마약을 전면 금지하거나 완전히 합법화할 수 있습니다."
 germany.204.a: "합법화한다"
 germany.204.b: "아니다, 모든 마약을 엄격히 금지한다"
 germany.205.t: "방위 조약을 제안하는 [GER.GetName]"
 germany.205.d: "[GER.GetName](이)가 우리에게 방위 조약을 제안했으며, 전시에 우리를 돕겠다는 의사를 밝혔습니다. 다만 이 조약을 수락하면 우리도 똑같이 하기로 동의하는 것입니다."
 germany.205.a: "알겠다"
 germany.205.b: "아니, 괜찮다"
 germany.206.t: "우리 제안을 수락한 [FROM.GetName]!"
 germany.206.d: "[FROM.GetName](이)가 방위 조약 체결 제안을 수락했으며, 우리는 위급할 때 서로를 구하러 가기로 합의했습니다."
 germany.206.a: "훌륭하군"
 germany.207.t: "우리 제안을 거절한 [FROM.GetName]"
 germany.207.d: "[FROM.GetAdjective] 측이 방위 조약 요청을 거절했으며, 이는 우리 관계의 악화로 이어졌습니다.."
 germany.207.a: "젠장"
 germany.208.t: "LGBT를 위한 피난처?"
 germany.208.d: "많은 사람들이 LGBT의 신념을 금지하는 억압적인 정부로부터 도피처를 구하기 위해 모국을 떠나 독일로 오고 있습니다. 이들은 주로 중동 국가 출신이며, 오늘 의학 지식을 가진 대규모 난민 집단이 도착했다는 보고를 받았습니다. 이들은 머무르게 해 주는 대가로 매우 저렴한 보수로 우리를 위해 일하겠다고 제안하고 있습니다.."
 germany.208.a: "안 된다"
 germany.208.b: "안 될 이유가 있나?"
 germany.209.t: "할례 문제"
 germany.209.d: "할례를 둘러싸고 수많은 논쟁이 벌어지고 있습니다. 우리 정당의 많은 이들이 개인이 성인이 될 때까지 할례를 금지하라고 요구하는 반면, 다른 이들은 이를 바꾸려 하지 말자고 제안합니다."
 germany.209.a: "납득했다, 일단 할례를 금지하라"
 germany.209.b: "도대체 무슨 소리를 하는 겁니까? 내 사무실에서 나가시오."
 germany.210.t: "미국 무기 판매"
 germany.210.d: "우리는 미국과 잠재적인 무기 판매에 대해 논의해 왔으며, 구매할 수 있는 몇 가지 선택지가 있습니다.."
 germany.210.a: "우리는... 항공기를 구매할 것이다"
 germany.210.b: "우리는... 보병 장비를 구매할 것이다"
 germany.211.t: "우리에게 NATO 탈퇴를 요구하는 [GER.GetName]"
 germany.211.d: "[GER.GetName](이)가 우리에게 NATO를 탈퇴하고 '미국 제국주의'로부터 벗어날 것을 요구했습니다. 그러나 아이러니하게도 독일인들 스스로는 NATO와 CSTO에 맞서는 새로운 동맹을 만들고 있습니다."
 germany.211.a: "좋은 조언이다.."
 germany.211.b: "흥, 싫다"
 germany.2111.t: "우리 요청에 응한 [FROM.GetName]"
 germany.2111.d: "[FROM.GetName](이)가 평화의 이름으로 NATO를 탈퇴하는 데 동의했으며, 머지않아 모든 미국의 영향력에서 완전히 벗어날 것입니다."
 germany.2111.a: "훌륭하군"
 germany.2112.t: "응하기를 거부한 [FROM.GetName]!"
 germany.2112.d: "[FROM.GetName](이)가 NATO 탈퇴를 거부했지만, 머지않아 그 대가를 치르게 될 것입니다."
 germany.2112.a: "기억해 두겠다"
 germany.212.t: "러시아와의 전쟁에 우리의 도움을 요청하는 [GER.GetName]"
 germany.212.d: "[GER.GetAdjective] 측이 러시아와 싸우는 데 도움을 달라고 요청했습니다. 그들은 우리가 동시에 공격하여 상대의 허를 찌르고, 우리가 입힐 수 있는 피해를 극대화하기를 원합니다."
 germany.212.a: "좋은 생각이다"
 germany.212.b: "아니요"
 germany.213.t: "러시아와의 전쟁에 동의한 [FROM.GetName]"
 germany.213.d: "[FROM.GetName]이(가) 러시아에 맞서 싸우는 일을 돕기로 동의하여, 우리의 새로운 동맹과 영원한 우정을 알렸습니다."
 germany.213.a: "훌륭하군"
 germany.214.t: "러시아와의 전쟁에서 우리를 돕기를 거부한 [FROM.GetName]!"
 germany.214.d: "[FROM.GetName](이)가 러시아에 맞서 싸우는 일을 돕기를 거부한 모양이며, 안타깝게도 우리는 일석이조를 노려야 할지도 모릅니다.."
 germany.214.a: "자초한 일이다"
 germany.215.t: "미국과의 전쟁에 우리의 도움을 요청하는 [GER.GetName]"
 germany.215.d: "[GER.GetAdjective] 측이 미국과 싸우는 데 도움을 달라고 요청했습니다. 그들은 우리가 동시에 공격하여 상대의 허를 찌르고, 우리가 입힐 수 있는 피해를 극대화하기를 원합니다."
 germany.215.a: "좋은 생각이다"
 germany.215.b: "아니요"
 germany.216.t: "미국과의 전쟁에 동의한 [FROM.GetName]"
 germany.216.d: "[FROM.GetName]이(가) 미국에 맞서 싸우는 일을 돕기로 동의하여, 우리의 새로운 동맹과 영원한 우정을 알렸습니다."
 germany.216.a: "훌륭하군"
 germany.217.t: "미국과의 전쟁에서 우리를 돕기를 거부한 [FROM.GetName]!"
 germany.217.d: "[FROM.GetName](이)가 미국에 맞서 싸우는 일을 돕기를 거부한 모양이며, 안타깝게도 우리는 일석이조를 노려야 할지도 모릅니다.."
 germany.217.a: "자초한 일이다"
 germany.218.t: "우리의 새로운 제국"
 germany.218.d: "오늘은 독일 역사에서 특별한 날입니다.\n마침내 우리가 위대한 왕좌를 선포하고 제국에 다시 관을 씌울 날이 왔습니다!\n문제는 단 하나, 국민과 정부가 우리나라의 새로운 제국 칭호를 무엇으로 할지 결정하지 못하고 있다는 점입니다."
 germany.218.a: "우리는... 독일 제국이 될 것이다"
 germany.218.b: "우리는... 신성 독일 제국이 될 것이다"
 germany.218.c: "우리는... 신성 로마 제국이 될 것이다"
 germany.218.d1: "독일이면 충분하다"
 germany.219.t: "러시아와의 동맹?"
 germany.219.d: "우리 당의 여러 파벌과 급진 세력들이 러시아와 방위 조약을 맺어야 하는지를 놓고 논쟁하고 토론해 왔습니다. 더 급진적인 좌파는 러시아에 합류해야 한다고 주장하는 반면, 다른 이들은 러시아를 신뢰할 수 없다고 말합니다."
 germany.219.a: "CSTO 가입을 신청한다"
 germany.219.b: "구두 협정만 맺자.."
 germany.219.c: "우리끼리가 더 낫다"
 germany.220.t: "미군 기지 철수를 요구하는 [GER.GetName]"
 germany.220.d: "[GER.GetName] 정부가 우리나라에 있는 미군 기지를 철수시킬 것을 요구했습니다. 그들은 이것이 세계를 더 '평화로운' 방향으로 이끄는 데 도움이 되고 우리의 독립을 유지하는 데도 도움이 될 것이라고 주장합니다."
 germany.220.a: "글쎄, 틀린 말은 아니다"
 germany.220.b: "절대 안 된다"
 germany.221.t: "응한 [FROM.GetName]!"
 germany.221.d: "[FROM.GetName](이)가 자국에서 미군 기지를 철수시키는 데 동의하여, 우리가 영향력을 동쪽으로 확장할 수 있게 되었습니다."
 germany.221.a: "좋다.."
 germany.222.t: "응하기를 거부한 [FROM.GetName]"
 germany.222.d: "[FROM.GetName](이)가 우리의 요청에 응하기를 거부했으며, 이는 그들이 한낱 미국의 꼭두각시에 불과함을 보여 줍니다."
 germany.222.a: "유감이다"
 germany.223.t: "연방으로의 초대"
 germany.223.d: "[GER.GetName](이)가 우리를 그들의 사회주의 연방에 가입하도록 초대했습니다. 우리나라 내 사회주의 세력의 압박이 커져 정부가 벼랑 끝으로 몰렸고, 신속한 해결책을 찾아야 하는 상황에서 나온 제안입니다. 우리 국민과 그들의 안전을 위해 최선을 원한다면 응해야 할 것입니다.."
 germany.223.a: "결국 최선의 선택이다"
 germany.223.b: "절대 안 된다"
 germany.224.t: "우리의 초대를 수락한 [FROM.GetName]!"
 germany.224.d: "[FROM.GetName](이)가 우리의 새로운 연방에 가입하자는 제안을 수락했으며, 그들과 앞으로 수 세기에 걸친 협력을 기대합니다!"
 germany.224.a: "훌륭하군"
 germany.225.t: "우리 제안을 거절한 [FROM.GetName]!"
 germany.225.d: "저 빌어먹을 [FROM.GetAdjective] 광인들이 혼자서 사는 편이 낫다고 결정했습니다! 우리의 새로운 유럽 질서에서 이것이 통하지 않는다는 점을 보여 주어야 할 것입니다."
 germany.225.a: "대가를 치르게 될 것이다"
 germany.226.t: "'우파' 쪽 높은 곳에 있는 친구들"
 germany.226.d: "우리 당은 전 세계에 연줄이 있지만, 특히 크로아티아의 £CRO_nationalist_right_wing_populist 크로아티아 권리당(HSP)과 매우 긴밀한 관계를 맺고 있습니다. 이제 우리에게는 친구들을 지원하여 그들의 정치에 직접 영향을 미칠 예산과 능력이 있습니다."
 germany.226.a: "약간의 지원이면 충분하다"
 germany.226.b: "적당한 지원이 좋겠다"
 germany.226.c: "많은 지원이 필요할 것이다"
 germany.227.t: "거래를 주선하려는 [GER.GetName]"
 germany.227.d: "새 정부를 세운 [GER.GetName](이)가 [ISR.GetName]에 대한 작전을 수행하는 데 도움을 달라며 우리를 찾아왔습니다. 그들은 이 국가를 공격하고 고립시키려는 노력에 우리가 동참하기를 요청하며, 이를 위해 우리의 군대를 동원해야 합니다."
 germany.227.a: "그렇다, 반드시 해내야 한다!"
 germany.227.b: "아니요"
 germany.228.t: "동의한 [FROM.GetName]!"
 germany.228.d: "[FROM.GetName](이)가 거짓 국가를 처리하는 데 우리를 돕기로 동의했습니다! 우리의 군대는 그동안 효과적으로 소통할 수 있는 임시 구조를 만들기 시작할 것입니다."
 germany.228.a: "한 걸음 더 가까워졌다"
 germany.229.t: "거절한 [FROM.GetName]!"
 germany.229.d: "[FROM.GetName](이)가 우리의 제안을 완전히 무시하며 거절했습니다! 그들은 [ISR.GetName]의 동맹이거나 우리에게 반대하는 쪽인 듯합니다."
 germany.229.a: "후회하게 될 것이다!"
 germany.230.t: "동남아시아의 우리 섬들을 요구하는 [GER.GetName]!"
 germany.230.d: "[GER.GetName](이)가 동남아시아에 있는 우리의 모든 섬을 양도하라고 요구했습니다. 그들은 우리가 섬의 지배권을 넘겨주면 미국의 영토 보전을 침해하지 않겠다고 약속하며, 섬들을 더 '인도적으로' 대하겠다고 주장합니다."
 germany.230.a: "절대 안 된다!"
 germany.230.b: "독일인들을 진정시킬 수 있다면..."
 germany.231.t: "섬을 양도한 [USA.GetName]!"
 germany.231.d: "[USA.GetName](이)가 동남아시아의 섬들을 넘겨주는 것이 자국에 가장 이익이라고 결정했습니다. 이로써 우리나라의 영향력을 확장할 수 있으며, 틀림없이 전략적 지역에 우리 해군을 주둔시킬 수 있을 것입니다.."
 germany.231.a: "좋다.."
 germany.232.t: "우리 요청을 묵살한 [USA.GetName]!"
 germany.232.d: "[USA.GetName](이)가 우리의 요청을 완전히 무시하기로 결정했으며, 일부 정치인들은 의회에서 우리의 요청을 조롱하기까지 했습니다.."
 germany.232.a: "유감이다"
 germany.232.b: "논쟁을 이용하라!"
 germany.233.t: "점검으로 드러난 연방군의 결함"
 germany.233.d: "올해 초 시작된 일련의 점검 이후, 데이터는 연방군이 다른 재래식 군대에 뒤처지기 시작했음을 보여 주었습니다. 연방군을 괴롭히는 가장 큰 문제들이 기록되었고, 군을 개혁하기 위한 포괄적인 계획이 마련되었습니다."
 germany.233.a: "일을 시작하자"
 germany.234.t: "위기의 공화국"
 germany.234.d: "BfV 부서 중 하나가 폐쇄된 이후, 국내 급진 세력이 날뛰고 있습니다. 혼란이 만연하고 무정부 상태가 새로운 일상이 되었습니다. 많은 이들이 공화국이 죽어 가고 있다고 말하며, 그 말이 틀리지 않을 수도 있습니다."
 germany.234.a: "우리가 무엇을 한 것인가?"
 germany.235.t: "공화국의 죽음"
 germany.235.d: "연방군 관계자들은 오늘 휘하의 여러 사단이 이탈하여 국내 급진 세력이 수립한 과도 정부에 합류했다고 발표했습니다. 그들은 주요 정부 기관에 포격을 시작했으며, 많은 이들이 오늘을 독일 공화국의 마지막 날이라 부르고 있습니다.."
 germany.235.a: "공화국은 죽었다(Die Republic Ist Tot)"
 germany.236.t: "독일의 운명"
 germany.236.d: "오늘은 과도 정부가 독일의 집권당을 결정하는 날입니다. 극우 NPD, 과거의 군주제, 또는 급진 좌파인 디 링케를 지명할 수 있습니다."
 germany.236.a: "카이저가 돌아올 것이다"
 germany.236.b: "NPD가 집권할 것이다"
 germany.236.c: "디 링케가 선출될 것이다"
 germany.237.t: "적대적인 독일 국가"
 germany.237.d: "독일 국가는 다시 한번 평화적이고 유럽 중심적인 국가에서 광기 어린 호전적 국가로 변모했습니다. 안타깝게도 역사는 되풀이되었으며, 우리 정부의 붕괴를 막기 위해 우리나라에서 커지는 독일의 영향력을 경계해야 합니다."
 germany.237.a: "젠장"
 germany.2343.t: "연방군 개혁 성공"
 germany.2343.d: "우리는 연방군 개혁에 성공했습니다. 재앙은 피했으며, 우리 군은 [GER.GetName]의 국경을 지킬 능력에 자신감을 가질 수 있습니다!"
 germany.2343.a: "훌륭하군"
 germany.238.t: "부서 붕괴 위험"
 germany.238.d: "우리의 핵심 부서 중 하나 이상이 상태 수치 10/50에 도달했습니다. 이는 자금을 늘리지 않으면 조만간 해당 부서가 무너진다는 뜻입니다. 부서가 무너지면 우리의 민주주의는 전복되고 급진 정당들이 마음대로 할 수 있게 됩니다."
 germany.238.a: "아직 배를 돌릴 수 있다!"
 germany.240.t: "우리를 제국 블록에 초대하는 독일"
 germany.240.d: "독일 정부가 새로 결성된 동맹인 제국 블록에 가입하도록 우리를 초대했습니다. 이는 전 세계에서 활동 중인 다른 동맹들에 맞서고 우리 국가들의 목소리를 키우기 위한 것입니다."
 germany.240.a: "물론이지"
 germany.240.b: "아니요"
 germany.242.t: "우리 제안을 거절한 [FROM.GetName]!"
 germany.242.d: "[FROM.GetName](이)가 우리의 제안을 거절하여, 동맹의 근본 자체를 무시했습니다!"
 germany.242.a: "젠장"
 germany.369.t: "중요한 정보!"
 germany.369.d: "독일의 콘텐츠가 개편되면서 BfV(연방헌법수호청) 메커니즘, 바이에른 민족주의 메커니즘, 동서독 분열 메커니즘을 비롯한 많은 새로운 메커니즘이 도입되었습니다. 뒤의 두 가지는 꽤 직관적인 체계이지만, 플레이어들은 BfV 체계와 그 작동 방식에 대해 혼란스러울 수 있습니다.\n그렇다면 어떻게 작동할까요?\n\n BfV 버튼은 화면 오른쪽 하단의 원장 바로 위에서 찾을 수 있으며, BfV를 통해 급진 정당으로 플레이할지 여부를 제어할 수 있습니다. 간단히 말해, 3개 부서 모두에 높은 자금을 투입하면 정당들이 모두 통제되므로 문제없는 민주주의 국가가 됩니다. 자금을 중간 수준으로 두면 현상이 유지됩니다. 그러나 자금이 매우 낮으면 부서가 상태 점수를 잃기 시작하고 결국 무너지며, (개입하지 않으면) 내전으로 이어집니다. 구체적으로 2부 또는 5부가 무너지면 내전이 시작됩니다. 6부가 무너지면 다른 결과가 발생합니다. 내전이 일어나면 그 전쟁에서 승리해야 하며, 그러면 사용 가능한 3개의 급진 정당 중 어느 것으로든 플레이할 수 있습니다.\n\n즐겁게 즐기시길 바랍니다.\n - 밀레니엄 던 독일 리워크 팀."
 germany.369.a: "알겠다"
 germany.400.t: "테러와의 전쟁 참여"
 germany.400.d: "우리는 최근 미국 친구들의 테러와의 전쟁을 돕기로 동의했습니다. 평화를 유지하고 소규모 전투 임무를 지원하기 위해 일정 규모의 병력을 배치할 수 있습니다. 그런데 문제는 전장에 몇 명을 투입할 것인가입니다."
 germany.400.a: "500명"
 germany.400.b: "1000명"
 germany.400.c: "2000명"
 germany.400.d1: "4000명"
 germany.4011.t: "공습 임무 성공"
 germany.4011.d: "우리 공군은 [AFG.GetFlag] 아프가니스탄 전역의 여러 표적에 대한 공습 임무를 성공적으로 수행했습니다."
 germany.4011.a: "잘했다, 이제 다시 임무로 복귀하자!"
 germany.4021.t: "공습 임무 실패"
 germany.4021.d: "우리 공군은 아프가니스탄 전역의 여러 표적에 대한 제대로 된 공습 임무를 수행하지 못했습니다. 우리의 실패로 인해 많은 현지인들의 지지를 잃었습니다. 또한 임무에 참여한 항공기 한 대가 격추되었다는 보고가 있습니다."
 germany.4021.a: "젠장"
 germany.403.t: "작전 성공"
 germany.403.d: "우리 병력이 [AFG.GetFlag] 아프가니스탄의 여러 테러 표적에 대한 임무를 성공적으로 수행했습니다."
 germany.403.a: "잘했다"
 germany.404.t: "작전 실패"
 germany.404.d: "최근 우리 병력이 [AFG.GetFlag] 아프가니스탄에서 작전을 수행하려다 붙잡혀 총살당했다는 보고를 받았습니다.."
 germany.404.a: "비극적인 날이다"
 germany.405.t: "우리 기지를 습격하는 테러리스트들!"
 germany.405.d: "테러리스트들이 [AFG.GetFlag] 아프가니스탄에 있는 우리 기지에 공격을 개시했습니다. 어떤 형태로든 대응해야 하며, 그렇지 않으면 이어질 결과를 감수해야 합니다.."
 germany.405.a: "우리가 할 수 있는 일은 없다"
 germany.405.b: "반격에 나서라!"
 germany.406.t: "인도주의 물자 고갈 중"
 germany.406.d: "최근 재고 점검 결과 인도주의 물자가 부족해지기 시작한 것으로 확인되었습니다. 주민들이 우리 군을 계속 지지하도록 새로운 물자를 보내야 합니다."
 germany.406.a: "미안하지만 오늘은 아니다"
 germany.406.b: "새로운 물자 수송을 승인한다"
 germany.407.t: "임무 종료 보고서"
 germany.407.d: "[AFG.GetFlag] 아프가니스탄에서 수년간의 전투를 치른 끝에, 우리의 행동 덕분에 사람들이 더 안전해졌음을 알고 이제 안심할 수 있습니다.."
 germany.407.a: "돌아온 것을 환영한다, 제군들!"
 germany.408.t: "[UKR.GetName] 투자"
 germany.408.d: "우리는 [UKR.GetName]이(가) 현대화된 국가로 가는 올바른 길에 오를 수 있도록 투자할 수 있습니다. 이를 위한 방법은 여러 가지가 있으며, 그들의 기반시설을 돕거나 산업을 돕는 방법이 있습니다."
 germany.408.a: "중요한 것은 기반시설이다"
 germany.408.b: "그들의 국민에게는 일자리가 필요하다!"
 germany.409.t: "벨라루스의 반체제 운동"
 germany.409.d: "우리는 벨라루스인들의 정부에 대한 반대 운동을 도울 수 있습니다. 다만 이에 어떻게 접근할지는 정부 내에서 논쟁 중입니다.."
 germany.409.a: "그들의 언론을 표적으로 삼는다"
 germany.409.b: "정권에 대한 비밀 정보를 공개한다"
 germany.410.t: "군사 기지 설치를 원하는 [GER.GetName]"
 germany.410.d: "[GER.GetAdjective] 정부는 잠재적인 러시아군 및 기타 위협으로부터 우리 국민을 더 잘 '보호'하기 위해 우리나라에 군사 기지를 설치하기를 원합니다."
 germany.410.a: "물론이지"
 germany.410.b: "좋은 생각이 아니다, 안 된다"
 germany.412.t: "군사 통행권을 거부한 [FROM.GetName]!"
 germany.412.d: "[FROM.GetName](이)가 우리의 안보 제안을 억제하는 것이 자국에 가장 이익이라고 결정했습니다. 그들에게 많은 무기를 제공했음에도 불구하고 그들은 우리의 안보 파트너십을 다음 단계로 끌어올릴 준비가 아직 되어 있지 않습니다.."
 germany.412.a: "젠장"
 germany.411.t: "군사 통행권을 허용한 [FROM.GetName]"
 germany.411.d: "[FROM.GetName](이)가 우리 군이 자국에 주둔할 수 있어야 한다고 판단했습니다. 그들은 우리가 인근의 잠재적 침략자들에 대한 방벽을 제공해 주기를 바라고 있습니다."
 germany.411.a: "좋다"
 germany.414.t: "날뛰는 이슬람주의자들!"
 germany.414.d: "6부가 붕괴한 이후 이슬람주의자들이 날뛰고 있으며, 사람들의 일상이 상당히 악화되었습니다. 바이에른의 보수주의자들도 상당히 격앙되어 바이에른 민족주의가 급등하고 우리 경제에 막대한 타격을 주고 있습니다."
 germany.414.a: "오, 이런."
 germany.415.t: "우익 조직 폐쇄를 원하는 BfV"
 germany.415.d: "BfV는 최근 우리나라에서 주목을 받게 된 우익 민족주의 조직을 폐쇄하기를 원합니다. 많은 이들이 이 단체가 더 큰 조직으로 성장할 수 있다고 우려하는 반면, 다른 이들은 불만을 품은 독일인들의 또 다른 소규모 단체에 불과하다며 대수롭지 않게 여깁니다.."
 germany.415.a: "폐쇄한다"
 germany.415.b: "내버려 둔다"
 germany.416.t: "좌익 조직 폐쇄를 원하는 BfV"
 germany.416.d: "BfV는 최근 우리나라에서 주목을 받게 된 좌익 조직을 폐쇄하기를 원합니다. 많은 이들이 이 단체가 더 큰 조직으로 성장할 수 있다고 우려하는 반면, 다른 이들은 불만을 품은 독일인들의 또 다른 소규모 단체에 불과하다며 대수롭지 않게 여깁니다.."
 germany.416.a: "폐쇄한다"
 germany.416.b: "내버려 둔다"
 germany.417.t: "이슬람주의 조직 폐쇄를 원하는 BfV"
 germany.417.d: "BfV는 최근 우리나라에서 주목을 받게 된 이슬람주의 조직을 폐쇄하기를 원합니다. 많은 이들이 이 단체가 더 큰 조직으로 성장할 수 있다고 우려하는 반면, 다른 이들은 불만을 품은 독일인들의 또 다른 소규모 단체에 불과하다며 대수롭지 않게 여깁니다.."
 germany.417.a: "폐쇄한다"
 germany.417.b: "내버려 둔다"
 germany.418.t: "더 큰 예산을 요청하는 BfV"
 germany.418.d: "BfV는 국내 급진 단체를 더 쉽게 단속할 수 있도록 더 큰 규모의 자금을 이용할 수 있게 해 달라고 요청했습니다."
 germany.418.a: "좋다"
 germany.418.b: "아니요"
 germany.419.a: "하일!"
 germany.419.t: "제4제국을 수립한 독일"
 germany.419.d: "오늘 우리는 독일이 다시 한번 진정한 국가가 된 날을 역사책에 새깁니다!\n50여 년 만에 독일이 제4제국을 선포합니다. 우리나라는 다시 한번 세계적 강대국으로 떠오를 것이며, 사회의 규칙과 현대 민주 국가들의 규범에 순응하지 않을 것입니다. 우리는 우리 자신의 승리의 길을 개척할 것입니다!\n우리가 다시 한번 일어서고 있음을 알고, 위대한 총통께서도 평안히 잠드실 수 있을 것입니다!"
 germany.420.a: "이제 비겼다"
 germany.420.b: "덤으로 더 가져가라"
 germany.420.c: "이미 충분히 받았다"
 germany.420.t: "마지막 전쟁 배상금 지불"
 germany.420.d: "제1차, 제2차 세계 대전 중 우리가 상처를 입힌 나라들에 90년이 넘도록 전쟁 배상금을 갚아 온 끝에, 오늘 우리는 빚을 청산하고 과거를 뒤로하기 위한 마지막 지불을 합니다. 긴 여정이었지만 마침내 끝에 이르렀고 이제 비겼다고 할 수 있습니다.\n이제 이 기간 동안 견뎌야 했던 경제적 어려움의 세월에서 우리의 경제와 은행이 회복할 차례입니다."
 germany.580.t: "MIG-29"
 germany.580.d: "독일 통일 과정에서 우리는 구 동독의 비축분에서 MiG-29 전투기 여러 대를 인수했습니다. 앞으로 나아가면서 이 항공기의 향후 거취와 현재 및 미래의 방위 전략에 어떻게 부합시킬지를 결정하는 것이 중요합니다."
 germany.580.a: "더 많은 기체를 구매한다"
 germany.580.b: "현재 보유량을 유지한다"
 germany.580.c: "자체 생산이 필요하다"
 germany.581.t: "구매 협상"
 germany.581.d: "MiG-29 기체 보유량을 늘리기 위해 어느 나라들과 협상해야 할지 결정해야 합니다."
 germany.581.a: "러시아와 협상한다"
 germany.581.b: "구 소련 공화국들과 협상한다"
 germany.581.c: "우크라이나와 협상한다"
 germany.582.t: "이제 필요 없어진 그들"
 germany.582.d: "우리는 소련제 항공기가 우리 군에 필요하지 않다는 결론에 이르렀으며, 이제 어떻게 할지 결정해야 합니다."
 germany.582.a: "폴란드에 판매한다."
 germany.582.b: "그냥 고철로 만들어야 한다."
 germany.582.c: "동유럽에 판매한다."
 germany.583.t: "면허 생산"
 germany.583.d: "우리는 이 항공기들이 공군의 중요한 일부가 될 수 있다는 결론에 이르렀으며, 따라서 이를 국내에서 생산할 방법을 찾아야 합니다."
 germany.583.a: "러시아에 연락한다."
 germany.583.b: "독자적인 파생형을 개발한다"
 germany.583.c: "폴란드와 함께 파생형을 개발한다."
 germany.585.t: "구조 개혁 시행"
 germany.585.d: "바이츠재커 위원회가 제안한 구조 변경을 완료했습니다. 우리 군은 이제 현대적 위협에 맞서고 국가 안보를 지키는 데 더 나은 장비를 갖추게 되었습니다. 더 유연하고 적응력 있는 군대를 갖춘 우리는 새로 나타나는 도전에 신속하게 대응할 준비가 되어 있으며, 필요하다면 앞으로의 변혁에도 대비하고 있습니다."
 germany.585.a: "새로운 시대를 위한 현대적인 군대."
 germany.586.t: "바이츠재커 위원회 소집"
 germany.586.d: "1999년 이래 전직 대통령 리하르트 폰 바이츠재커가 이끄는 바이츠재커 위원회는 독일 육군의 미래를 위한 종합 구상을 연구해 왔습니다. 위원회에는 페터-하인리히 카르스텐스와 헬게 한센 같은 전직 장성들과 법률 전문가, 신학자, 역사학자, 경제계 대표들이 포함되어 있습니다. 이들의 목표는 연방군을 냉전 시대의 군대에서 현대적이고 유연한 군대로 변모시키는 것입니다. 위원회는 신기술 도입, 대테러로의 초점 전환, 그리고 냉전 이후의 해빙기를 활용한 군의 간소화와 최적화를 강조합니다."
 germany.586.a: "현대화를 위한 필수적인 조치다."
 germany.586.b: "우리 군은 우리가 운영할 줄 안다."
 germany.587.t: "바이츠재커 위원회 보고서 완성"
 germany.587.d: "서로 다른 관점과 초점을 가진 전문가들 간의 긴 논의 끝에, 바이츠재커 위원회가 연방군의 미래에 관한 보고서를 완성했습니다. 이 문서는 독일 육군을 21세기의 도전에 맞는 현대적이고 유연한 군대로 변모시키기 위한 핵심 권고안을 제시합니다. 제안된 변경 사항에는 신기술 도입, 기동성 강화를 위한 구조 개편, 대테러 및 국제 평화 유지로의 초점 전환이 포함됩니다. 보고서는 이제 연방의회에 제출되어 결정을 내려야 합니다. 이 제안들을 받아들여야 할까요, 아니면 군의 미래를 위해 다른 길을 모색해야 할까요?"
 germany.587.a: "권고안을 채택하여 연방군을 현대화한다."
 germany.587.b: "보고서를 거부하고 다른 전략을 추구한다."
 germany.588.t: "연방군의 다음 구조"
 germany.588.d: "육군은 창설 이래 여러 차례 구조 개편을 겪었습니다. 가장 최근의 개편은 새로운 국방 정책 지침과 함께 시작되었습니다. 이 개편은 2010년까지 완료될 예정이며 \\"육군 2010\\" 또는 \\"신 육군\\"이라 불립니다. 육군은 개입군, 안정화군, 지원군 등 여러 범주로 나뉩니다."
 germany.588.a: "육군을 축소하고 비용을 절감해야 한다"
 germany.588.b: "병력을 줄이지 않고 전문화해야 한다"
 germany.588.c: "우리의 능력을 키워야 한다"
 germany.589.t: "육군 2010"
 germany.589.d: "이 구조의 종료와 함께 우리는 더 이상 엄격한 구조가 필요하지 않다는 결론에 이르렀습니다. 빠르게 변화하는 요구에 적응하려면 상시 진행되는 변혁이 필요합니다."
 germany.589.a: "유연성은 독일인의 미덕이다"
 germany.590.t: "독일 대공 방어의 미래 구상"
 germany.590.d: "독일이 증가하는 세계적 위협과 급속히 발전하는 군사 기술에 직면함에 따라, 대공 방어(Luftverteidigung)의 미래 구조에 관한 중대한 결정을 내려야 합니다. 국가 안보를 보장하고, 작전 효율을 최적화하며, 현대적 도전에 적응하는 전략을 선택하는 것이 목표입니다. 세 가지 선택지는 각기 뚜렷한 이점이 있습니다. 대공 방어를 기동화하면 유연성이 향상되어 새로 나타나는 위협에 신속하게 대응할 수 있으며, 체계가 더 기민해지고 취약성도 줄어듭니다. 방어 체계를 여러 지역에 분산시키면 포괄적인 방어 범위를 제공하고 공격으로 핵심 기반시설이 마비될 위험을 줄여 장기적인 복원력을 확보합니다. 한편 현재 구조를 유지하면 이미 입증된 기존 체계의 효율성을 보존하고 높은 비용과 혼란을 피할 수 있습니다."
 germany.590.a: "패트리어트 체계를 확대한다"
 germany.590.b: "롤랑 체계를 확대한다"
 germany.590.c: "현재 구조를 유지한다"
 GER_promote_private_investments: "민간 투자 촉진"
 GER_promote_private_investments_desc: "독일은 특히 기술, 기반시설, 재생에너지 같은 분야에서 개발도상국 및 신흥 시장에 대한 민간 부문 투자를 적극 촉진할 것입니다. 인센티브를 제공하고 위험을 줄이며 해외 독일 기업을 지원함으로써, 독일은 핵심 지역에서 지속 가능한 발전을 도모하는 동시에 세계 경제 유대를 강화하고자 합니다. 이러한 노력은 상호 이익을 보장하여 세계적 성장과 독일 자체의 경제 팽창에 기여할 것입니다."
 germany.408.c: "지금은 감당할 수 없다"
 germany.580.e: "더 이상 쓸모가 없다"
 GER_east_opinion_below_50_TT: "§H동독§! 관계가 §H50§! 미만"
 GER_seek_permanent_unsc_seat: "UN 안전보장이사회 상임이사국 추진"
 GER_seek_permanent_unsc_seat_desc: "독일의 외교적 영향력과 국제 질서에 대한 기여는 국제연합 안전보장이사회 상임이사국 지위에 대한 요구를 뒷받침합니다. 우리는 안전보장이사회와 총회에 이 요구를 제기하는 데 필요한 지지를 얻고자 합니다."
 germany_yearly.300.t: "밀레니엄의 지멘스"
 germany_yearly.300.d: "지멘스는 자동화, 전력, 운송, 통신에 걸친 폭넓은 산업 복합기업으로서 새 세기를 맞이합니다. 그 미래는 이 통합 모델을 강화할지, 아니면 디지털 산업에 자본의 더 큰 몫을 줄지에 달려 있습니다."
 germany_yearly.300.a: "통합 산업 그룹을 강화한다"
 germany_yearly.300.b: "디지털 산업을 우선시한다"
 germany_yearly.301.t: "네트워크 분야의 합작 투자"
 germany_yearly.301.d: "지멘스는 통신사업자용 네트워크 장비 사업을 외국 파트너와의 합작 투자로 통합하여 직접적 통제권을 세계적 규모와 맞바꿀 수 있습니다. 반대로 기술자들을 사내에 두면 그룹은 산업 자동화 분야의 강점을 밀어붙일 수 있습니다."
 germany_yearly.301.a: "네트워크 합작 투자에 전념한다"
 germany_yearly.301.b: "대신 산업 자동화를 우선시한다"
 germany_yearly.302.t: "네트워크 사업을 재고하는 지멘스"
 germany_yearly.302.d_venture: "네트워크 합작 사업은 약속했던 수익을 한 번도 내지 못했으며, 파트너는 정산을 압박하고 있습니다. 지멘스는 지분을 매각하여 그 수익을 디지털 산업에 투입하거나, 파트너의 지분을 인수하여 단독으로 사업을 운영할 수 있습니다."
 germany_yearly.302.d_independent: "통신사업자용 네트워크 사업이 기로에 서 있습니다. 지멘스는 이 사업을 완전히 매각하고 디지털 산업에 재투자하거나, 더 큰 경쟁사들에 맞서 입지를 지키는 데 필요한 자본을 투입할 수 있습니다."
 germany_yearly.302.a: "사업을 매각하고 수익을 재투자한다"
 germany_yearly.302.b: "네트워크 사업을 완전히 장악한다"
 germany_yearly.303.t: "시장에 진출한 지멘스 헬시니어스"
 germany_yearly.303.d: "지멘스 헬시니어스는 시장 상장 준비를 마쳤으며, 지멘스가 과반 지분을 유지하는 가운데 의료 기술 사업이 자체 주가와 독자적인 자본 조달 경로를 갖게 됩니다. 그룹 내에 그대로 두면 연구와 현금에 대한 더 확고한 통제권을 지킬 수 있습니다."
 germany_yearly.303.a: "지멘스 헬시니어스를 상장한다"
 germany_yearly.303.b: "헬시니어스를 완전히 통합된 상태로 유지한다"
 germany_yearly.304.t: "독립한 지멘스 에너지"
 germany_yearly.304.d: "지멘스는 에너지 부문을 분사하여 독자적으로 상장할 준비를 마쳤습니다. 독립하면 지멘스 에너지는 자동화 부문과 자본을 놓고 경쟁하지 않고 에너지 전환을 추구할 수 있으며, 통합을 계속 유지하면 엔지니어링 포트폴리오가 온전하게 유지됩니다."
 germany_yearly.304.a: "지멘스 에너지 분사를 완료한다"
 germany_yearly.304.b: "에너지 부문을 통합된 상태로 유지한다"
 germany_yearly.305.t: "지멘스가 된 모습"
 germany_yearly.305.d: "사반세기에 걸친 상장, 분사, 부문 유지를 거치며 지멘스가 어떤 기업인지가 정해졌습니다. 그룹이 도달한 이 모습이 이제 독일 산업이 경쟁하는 방식을 규정합니다."
 germany_yearly.305.a: "집중된 산업 기술 그룹"
 germany_yearly.305.b: "디지털 산업 기업"
 germany_yearly.305.c: "자동화 및 제어 강자"
 germany_yearly.305.e: "다각화된 산업 복합기업"
 GER_siemens_focused_industrials: "집중된 산업 그룹"
 GER_siemens_focused_industrials_desc: "헬시니어스와 에너지는 각자의 주가로 독립했으며, 그 결과 자동화, 소프트웨어, 모빌리티만을 책임지는 더 작아진 지멘스가 남았습니다. 풀려난 자본은 운용하기가 더 쉬우며 남은 부문들은 더 이상 서로를 보조하지 않습니다."
 GER_siemens_digital_industries: "디지털 산업"
 GER_siemens_digital_industries_desc: "소프트웨어와 산업용 컴퓨팅이 중공업 부문보다 우선시되었으며, 그룹의 연구는 이제 터빈이 아니라 디지털 트윈, 제어 플랫폼, 기계 지능을 중심으로 이루어집니다."
 GER_siemens_automation_core: "자동화 및 제어 핵심"
 GER_siemens_automation_core_desc: "그룹은 수익성이 높은 곳에 기술자들을 남겨 두었고, 공장 자동화는 다른 모든 것을 가늠하는 기준이 되는 분야가 되었습니다. 독일의 생산 라인은 그 누구보다도 빠르게 설비를 개편합니다."
 GER_siemens_diversified_conglomerate: "다각화된 산업 복합기업"
 GER_siemens_diversified_conglomerate_desc: "지멘스는 분할하라는 모든 압력의 물결 속에서도 부문들을 하나로 묶어 두었습니다. 폭넓음은 효율성을 희생시키지만, 전력, 보건, 운송, 산업을 아우르는 그룹은 어떤 전문 기업도 따라올 수 없는 무게감을 지닙니다."
 germany.68.t: "주흘로 돌아온 C.G. 해넬"
 germany.68.d: "주흘의 정문 위에 걸린 이름은 독일 무기 제조업에서 가장 오래된 이름 중 하나입니다. C.G. 해넬은 1840년부터 그곳에서 소총을 만들었고, 후고 슈마이저에게 최초의 돌격소총을 설계한 작업장을 제공했으며, 이후 공장이 최종적으로 폐쇄되기 전까지 40년 동안 국영 사냥용 무기 공장으로 지냈습니다. 에미리트 자본이 이제 이 상표를 인수하여 메르켈 시절 생산 라인을 다시 열었으며, 해넬은 새로운 세대의 정밀 소총과 제식 소총으로 연방 계약을 놓고 헤클러 & 코흐와 경쟁할 생각입니다."
 germany.68.a: "주흘이 다시 소총을 만든다"
 ger_bmw_unlocked: "§Y$GER_BMW_Focus$§!을(를) 완료한 후 또는 §Y2021년§!에 §Y$GER_BMW$§!이(가) 방산 생산 진출을 제안합니다. 이 제안은 반드시 수락해야 합니다."
 GER_airbus_change: "유로콥터가 2014년 에어버스 헬리콥터스로 통합되었습니다"
 TT_GER_airbus_change_carry_traits: "§Y에어버스 디펜스는 $GER_Eurocopter_helicopters_tank_manufacturer$에서 이미 완료한 특성 수만큼 조직 규모와 무료 특성 선택권을 얻습니다.§!"
 GER_airbus.1.t: "에어버스 헬리콥터스가 된 유로콥터"
 GER_airbus.1.d: "그룹은 10년 동안 하나의 항공기를 세 개의 브랜드로 판매해 왔습니다. 1월 1일부터 유로콥터라는 이름은 폐기됩니다. 도나우뵈르트, 마리냔, 알바세테는 이제 에어버스 헬리콥터스 소속이 되며, 이 부문은 브레멘의 수송기 부문과 만힝의 무인기 사업과 함께 에어버스 디펜스 앤드 스페이스에 보고합니다."
 GER_airbus.1.a: "모든 로터 위에 하나의 이름."
