 TAT_SP_arty_1_desc: "Вооружённая 152,4-мм пушкой Д-22, способной при необходимости «выстрелить в солнце с небес». Это выдающаяся артиллерийская батарея с дальностью стрельбы до 50 км."
 TAT_SP_arty_2: "2С19М2 «Мста-С»"
 TAT_SP_arty_2_desc: "2С19 «Мста-С» была разработана в конце холодной войны: в ней применены новые технологии и увеличена дальность стрельбы по сравнению с предшественницей."
