 CHI_local_government_debt: "Local Government Debt"
 CHI_local_government_debt_desc: "Provincial and municipal governments cannot borrow openly, so they raise money through financing vehicles that pledge future land sales against bank loans and bonds. The proceeds fund the factories, office parks and infrastructure that cadre evaluations reward, and every project beyond what the fiscal system can carry adds to a debt pile that the central government has never formally guaranteed. Banks roll the loans over rather than write them off, interest absorbs a growing share of local budgets, and the true size of the liabilities stays hidden in trust products and off-balance-sheet lending. When Beijing is forced to deleverage, credit tightens, construction stalls and the growth model built on borrowed land revenue begins to unwind.\n§W--------------§!\nLocal debt pressure rises each month while our factories and office parks exceed the fiscal tolerance, and falls slowly when they do not. Focuses such as §Y$CHI_shadow_banking_cleanup$§!, §Y$CHI_three_red_lines_crackdown$§! and §Y$CHI_common_prosperity$§! lower the pressure, focuses such as §Y$CHI_policy_banks_cdb$§! and §Y$CHI_wto_commercial_bank_reform$§! raise the tolerance, and the §Y$CHI_provincial_debt_swap$§! decision pays it down directly. Stimulus focuses such as §Y$CHI_four_trillion_stimulus$§! raise it. This national spirit will §GImprove§! once pressure falls below §Y90§!."
