 CHI_Anti_tank_1: "HJ-73"
 CHI_Anti_tank_1_desc: "HJ-73 — китайский вариант советской ракеты 9М14 «Малютка»."
 CHI_Anti_tank_2: "HJ-8"
 CHI_Anti_tank_2_desc: "HJ-8 или Hongjian-8 («Красная стрела-8») представляет собой противотанковый ракетный комплекс второго поколения с трубчатым пуском, оптическим отслеживанием и проводным наведением."
 CHI_Anti_tank_3: "HJ-12"
 CHI_Anti_tank_4: "HJ-19"
 CHI_MBT_1: "Тип 59"
 CHI_MBT_1_desc: "Основной боевой танк Тип 59 (WZ-120) представляет собой китайскую версию советского танка Т-54А. Он оснащен 100-мм нарезной пушкой и 203-мм броней."
 CHI_MBT_1_short: "Тип 59"
 CHI_MBT_2: "Тип 80"
 CHI_MBT_2_desc: "Тип 80, также известный как ZTZ80, представляет собой семейство китайских основных боевых танков (ОБТ) второго поколения. Он оснащен 105-мм пушкой."
 CHI_MBT_2_short: "Тип 80"
 CHI_MBT_3: "Тип 96"
 CHI_MBT_3_desc: "Тип 96, или ZTZ-96, — китайский основной боевой танк второго поколения и окончательная версия конструкции Тип 88. Он оснащён композитной бронёй, 125-миллиметровой гладкоствольной пушкой и двумя пулемётами."
 CHI_MBT_3_short: "Тип 96"
 CHI_MBT_4: "Тип 99"
 CHI_MBT_4_short: "Тип 99"
 CHI_MBT_4_desc: "ОБТ Тип 99, или ZTZ-99, — китайский основной боевой танк третьего поколения с навесной модульной композитной бронёй и динамической защитой, 125-мм гладкоствольной пушкой ZPT-98 и двумя пулемётами."
 CHI_MBT_5: "Тип 99А2"
 CHI_MBT_5_short: "Тип 99А2"
 CHI_MBT_5_desc: "ОБТ Тип 99, или ZTZ-99, — китайский основной боевой танк третьего поколения с навесной модульной композитной бронёй и динамической защитой, 125-мм гладкоствольной пушкой ZPT-98 и двумя пулемётами."
