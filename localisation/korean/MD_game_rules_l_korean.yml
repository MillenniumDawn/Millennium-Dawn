 RULE_OPTION_COM_WARRIOR_KING: "전사 왕"
 RULE_OPTION_COM_WARRIOR_KING_DESC: "로베르 드나르는 마지막으로 섬들에 돌아오고, §8대통령 경호대§!는 총성 한 번 없이 그에게 궁을 넘겨줍니다. 코모로는 군대를 가진 나라가 되기를 멈추고 깃발을 가진 빌려줄 군대가 되어 용병을 아프리카 전역에 팔아넘깁니다."
 RULE_OPTION_COM_MILITARY_DICTATORSHIP: "The Colonel Stays"
