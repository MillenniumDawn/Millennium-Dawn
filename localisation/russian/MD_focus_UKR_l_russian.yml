 UKR_develop_bastion_flag: "Выполнено решение §YРазработка Т-84 «Бастион»§!"
 ukraine_modernize_planes_restore_an_71.1.name: "РЛС для Ан-71"
 ukraine_modernize_planes_restore_an_71.1.desc: "«Антонов» восстановил опытный экземпляр № 03 и собрал прежнюю команду Ан-71. Планер в порядке, но судьбу программы решит РЛС. Московская «Вега-М» предлагает доработать «Квант», а израильская Elta — облегчённую версию своей РЛС с ФАР Phalcon для дискового обтекателя Ан-71."
 ukraine_modernize_planes_restore_an_71.1.a: "Доработать §Y«Квант»§! вместе с «Вегой-М»"
 ukraine_modernize_planes_restore_an_71.1.b: "Купить израильскую РЛС §YPhalcon§!"
 ukraine_modernize_planes_restore_an_71.2.name: "Ан-71 снова в воздухе"
 ukraine_modernize_planes_restore_an_71.2.desc_kvant: "Опытный экземпляр № 03 поднялся в воздух с доработанной РЛС «Квант», и новые фильтры «Веги-М» наконец выделяют низколетящие цели. Харьковский авиазавод, выпускающий Ан-74, предлагает перенести улучшения этого самолёта на планер Ан-71."
 ukraine_modernize_planes_restore_an_71.2.desc_phalcon: "Опытный экземпляр № 03 поднялся в воздух с израильской РЛС в дисковом обтекателе, и ФАР сопровождает низколетящие цели куда лучше, чем когда-либо удавалось «Кванту». Харьковский авиазавод, выпускающий Ан-74, предлагает перенести улучшения этого самолёта на планер Ан-71."
 ukraine_modernize_planes_restore_an_71.2.a: "Перестроить его по стандарту §YАн-74ТК-200§!"
 ukraine_modernize_planes_restore_an_71.2.b: "Перенести двигатели под крыло, как на §YАн-74ТК-300§!"
 ukraine_modernize_planes_restore_an_71.2.c: "Оставить планер опытного экземпляра"
 ukraine_modernize_planes_restore_an_71_200_tt: "Примерно через §Y5 месяцев§! Харьков поставит планер Ан-74ТК-200: усиленная противообледенительная система (§Y$spec_redundant_3$§!), увеличенные топливные баки (§Y$spec_refuel_1$§!) и больший отсек авионики (§Y$avionics_manned_2$§!)."
 ukraine_modernize_planes_restore_an_71_300_tt: "Примерно через §Y8 месяцев§! Харьков и §Y«Мотор Сич»§! поставят компоновку Ан-74ТК-300: двигатели под крылом (§Y$engine_jet_double_3$§!) и новая авионика кабины (§Y$avionics_manned_3$§!). Самолёт утратит короткий взлёт, который давала схема с двигателями над крылом."
 ukraine_modernize_planes_restore_an_71.3.name: "Ан-71 перестроен по стандарту Ан-74ТК-200"
 ukraine_modernize_planes_restore_an_71.3.desc: "Харьков перестроил Ан-71 по стандарту Ан-74ТК-200. Улучшенная противообледенительная система, увеличенные топливные баки и больший отсек авионики позволяют ему дольше патрулировать и летать в более суровую погоду."
 ukraine_modernize_planes_restore_an_71.3.a: "Принять новый планер"
 ukraine_modernize_planes_restore_an_71.4.name: "Ан-71 получает компоновку Ан-74ТК-300"
 ukraine_modernize_planes_restore_an_71.4.desc: "Харьков перенёс двигатели Ан-71 на подкрыльевые пилоны, как на Ан-74ТК-300. Самолёт лишается короткого взлёта, зато летит быстрее и расходует меньше топлива в долгом патрулировании."
 ukraine_modernize_planes_restore_an_71.4.a: "Принять новый планер"
