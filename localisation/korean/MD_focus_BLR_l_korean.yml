 BLR_expand_azot_production: "비료 생산 확대"
 BLR_mission_to_Poland: "Trade Mission to [POL.GetNameWithFlag]"
 BLR_mission_to_Poland_desc: "폴란드와 무역 임무를 활성화하는 것은 국산품 시장을 위한 안전한 사업이 될 것입니다."
 BLR_mission_to_Germany: "Trade Mission to [GER.GetNameWithFlag]"
 BLR_mission_to_Germany_desc: "독일과 무역 임무를 활성화하는 것은 국산품 시장을 위한 안전한 사업이 될 것입니다."
 BLR_mission_to_France: "Trade Mission to [FRA.GetNameWithFlag]"
 BLR_mission_to_France_desc: "프랑스와 무역 임무를 활성화하는 것은 국산품 시장을 위한 안전한 사업이 될 것입니다."
 BLR_mission_to_Norway: "Trade Mission to [NRY.GetNameWithFlag]"
 BLR_mission_to_Norway_desc: "노르웨이와 무역 임무를 활성화하는 것은 국산품 시장을 위한 안전한 사업이 될 것입니다."
 BLR_mission_to_Sweden: "Trade Mission to [SWE.GetNameWithFlag]"
 BLR_mission_to_Sweden_desc: "스웨덴과 무역 임무를 활성화하는 것은 국산품 시장을 위한 안전한 사업이 될 것입니다."
 BLR_mission_to_Russia: "Trade Mission to [SOV.GetNameWithFlag]"
 BLR_mission_to_Russia_desc: "러시아와 무역 임무를 활성화하는 것은 국산품 시장을 위한 안전한 사업이 될 것입니다."
 BLR_mission_to_Ukraine: "Trade Mission to [UKR.GetNameWithFlag]"
 BLR_mission_to_Ukraine_desc: "우크라이나와 무역 임무를 활성화하는 것은 국산품 시장을 위한 안전한 사업이 될 것입니다."
 BLR_mission_to_Kazahstan: "Trade Mission to [KAZ.GetNameWithFlag]"
 BLR_mission_to_Kazahstan_desc: "카자흐스탄과 무역 임무를 활성화하는 것은 국산품 시장을 위한 안전한 사업이 될 것입니다."
 BLR_mission_to_Czechia: "Trade Mission to [CZE.GetNameWithFlag]"
 BLR_mission_to_Czechia_desc: "체코와 무역 임무를 활성화하는 것은 국산품 시장을 위한 안전한 사업이 될 것입니다."
 BLR_mission_to_Netherland: "Trade Mission to [HOL.GetNameWithFlag]"
 BLR_mission_to_Netherland_desc: "Establishing a trade mission with the Netherlands is a sound business decision for the good of our nation."
 cancel_BLR_trade: "비료 무역 거래 취소"
 BLR_pending_offer: "현재 비료 거래에 대해 고민하고 있습니다"
