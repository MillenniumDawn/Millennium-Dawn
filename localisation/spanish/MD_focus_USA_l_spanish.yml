 USA_econ_event.30.t: "BAE Systems se ofrece a adquirir United Defense"
 USA_econ_event.30.d: "BAE Systems ha presentado una oferta en efectivo de 4200 millones de dólares para adquirir United Defense Industries. El conglomerado británico busca establecer una posición permanente en el mercado estadounidense de combate terrestre integrando la producción de los vehículos Bradley, Paladin y AAV de UD en una nueva división de Land & Armaments. El Departamento de Defensa está sopesando las implicaciones estratégicas mientras el Departamento de Justicia prepara una revisión antimonopolio."
 USA_econ_event.30.a: "Aprobar la adquisición"
 USA_econ_event.30.b: "Ordenar una revisión antimonopolio del Departamento de Justicia"
