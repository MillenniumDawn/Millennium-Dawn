 BLR_army_on_streets: "거리의 특수부대"
 BLR_unstable_situation: "불안정한 상황"
 BLR_tourism: "관광 여행"
 BLR_tourism_desc: "관광 산업의 발전은 우리나라에 막대한 예산 수입을 가져다줍니다."
