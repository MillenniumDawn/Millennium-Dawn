 EH_non_state_mines_TT: "Каждый §Yнегосударственный рудник рэндаллита§! учитывается в лимите новых шахт."
 EH_search_for_randallite_decreased_TT: "Время решений §YПоиск жил рэндаллита§! и §YСоздание новой шахты§! сокращено на §G10 дней§!."
 EH_more_precious_than_gold_TT: "Во вкладке решений §YНайти новые жилы рэндаллита§! появится решение, запрещающее частным компаниям добывать §Yрэндаллит§! (видно, если действует хотя бы одна негосударственная компания)."
 EH_outlaw_randallite_extraction_TT: "Правительство §Yзапретит добычу рэндаллита§! частными компаниями, национализирует все шахты и прекратит любые новые проекты разработки негосударственными субъектами."
