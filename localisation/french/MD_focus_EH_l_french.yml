 EH_OPEN_RANDALLITE_TAB_TITLE: "Ouvrir/fermer la fenêtre §YRandallite§! et §YMechs§!"
 EH_OPEN_RANDALLITE_TAB_DESC: "Ouvrir ou fermer la fenêtre de gestion de la ressource randallite et de la production de mechs."
