 ROJ_war_effort_category: "The Defense of Rojava"
 ROJ_war_effort_category_desc: "Our communes and the YPG and YPJ hold the north against every army that wants it. Whatever we cannot make ourselves, we must win from friends abroad or carry across the border."
 ROJ_request_coalition_support: "Ask [From.GetNameDef] for Support"
 ROJ_request_coalition_support_desc: "Our envoys will spend ten days pressing [From.GetNameDef] for weapons, money, or military advisors for the fight against the jihadists. They may refuse, and they will not hear a second appeal for three months."
