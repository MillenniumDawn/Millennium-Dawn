 MAGHREB_form_category: "Union des Arabischen Maghreb"
 MAGHREB_form_category_desc: "The Arab-Maghreb Union is a political union of states comprised of Algeria, Libya, Mauritania, Morocco, and Tunisia. It largely served the purpose of ensuring political unity and economic integration within the nation-states. Although, in recent years, the activity of the union seems to be dwindling, it may be time to rekindle this idea. Unifying the people of the Maghreb would create a new nation that could dominate the African continent and the Mediterranean shelf. It is time to unite the Maghreb and become one of the great nations of the globe."
