mercosur.28.d: "[FROM.GetName]との長い加盟過程は、ついに終着点へ辿り着いた。交渉、制度調整、そして相互の意思確認を重ねた末に、もはや曖昧さはない。[FROM.GetName]は今やMERCOSURの正式加盟国である。"
mercosur.28.a: "新たな加盟国だ"

mercosur.29.t: "加盟正式化"
mercosur.29.d: "[FROM.GetName]との間で積み重ねられてきた加盟への道筋は、ついに結論へ達した。慎重な接近として始まったものは正式加盟という形で結実し、我々の立場はもはや暫定的なものではなくなった。"
mercosur.29.a: "我々はブロックに加わる"

mercosur.30.t: "南米サミット発表"
mercosur.30.d: "新たな南米サミットが、地域協力再生の第一歩として発表された。主催者は、MERCOSURを再活性化し、経済協調を強化し、大陸に世界情勢の中でより強い集団的発言力を与えねばならないと宣言している。支持者はこれを、長らく待たれていた地域的野心への回帰として称賛している一方、批判者は南米が象徴主義を超えて持続的統合へ進めるのか疑問視している。"
mercosur.30.a: "新たな地域章の始まりだ"

mercosur.31.t: "[FROM.GetName]がMERCOSUR準加盟国化"
mercosur.31.d: "[FROM.GetName]はMERCOSURに準加盟国として加わることに同意し、南米地域協力復活の新たな一歩を刻んだ。準加盟は正式加盟には及ばないが、より緊密な貿易関係、政治協調、そして将来の加盟交渉への道を開く。支持者たちは、この動きをMERCOSURが再び本格的な地域勢力となりつつある兆しと見ている。"
mercosur.31.a: "ブロックは拡大している"

mercosur.32.t: "[FROM.GetName]がMERCOSUR正式加盟国化"
mercosur.32.d: "[FROM.GetName]はMERCOSURの正式加盟国となった。地域外交として始まったものは、今やブロック自体の具体的拡大へと結実し、ラテンアメリカ全域でその経済的重みと政治的重要性を深めている。統合支持者にとって、これは単なる外交的成功以上のものだ。MERCOSURがなお大陸の未来を形作り得ることの証明なのである。"
mercosur.32.a: "新加盟国、より強いブロック"
BRA_unasul: "UNASULの設立"
BRA_unasul_desc: "南米諸国の協力を一時的な枠組みにとどめず、恒常的な地域機構として制度化する時が来た。政治対話、インフラ整備、社会協力を束ねる枠組みを整え、南米の結束を新たな段階へ進めよう。"
MER_expansion_unasul: "UNASULの拡大"
MER_expansion_unasul_desc: "UNASULを大陸規模の枠組みとして定着させるには、参加の拡大と政治的求心力の維持が欠かせない。域内の諸国を取り込み、南米の共通機構としての正統性を強めよう。"
MER_sa_corridor_development: "南米回廊整備"
MER_sa_corridor_development_desc: "大陸統合は宣言だけでは進まない。道路、港湾、鉄道、通信、内陸回廊を結び、国境をまたぐ物流と移動を現実のものにしなければならない。"
MER_counter_cartel: "カルテル対策協力"
MER_counter_cartel_desc: "麻薬密輸、武器取引、越境犯罪組織は、南米の安定と統合の双方を脅かす。情報共有と共同対処を進め、国家の枠を越える脅威に地域全体で向き合わなければならない。"
MER_sa_energy_council: "南米エネルギー評議会"
MER_sa_energy_council_desc: "石油、ガス、水力、送電網を抱える南米は、エネルギー協力の潜在力が高い。国家間の競合を調整し、地域全体で安定供給と相互補完を目指そう。"
MER_sa_health_council: "南米保健評議会"
MER_sa_health_council_desc: "保健協力は目立ちにくいが、南米統合の中では最も実務的で成果を出しやすい分野の一つだ。疾病監視、医薬品、保健人材の協力を進め、生活に直結する統合を示そう。"
MER_productive_integration_and_sme_networks: "生産連結と中小企業網"
MER_productive_integration_and_sme_networks_desc: "南米統合を大企業や資源輸出だけの話にせず、中小企業、域内サプライチェーン、産業補完の形成へ広げる。目立ちはしないが、地域統合の実利を示す一手となる。"
MER_sa_defense_council: "南米防衛評議会"
MER_sa_defense_council_desc: "南米の安全保障を域外依存だけに任せず、防衛協調と信頼醸成の仕組みを地域内で整える。共同作戦より先に、対話、透明性、危機管理の土台を築くことが重要だ。"
MER_sa_network_for_science_and_innovation: "南米技術革新網"
MER_sa_network_for_science_and_innovation_desc: "統合を将来へつなげるには、資源輸出だけでなく知識と技術の連携が必要だ。研究協力と技術交流を通じて、南米の自立的発展を支えていこう。"
MER_unasul_factions: "UNASUL共同防衛機構"
MER_unasul_factions_desc: "南米の結束を政治協力にとどめる時代は終わった。域内の安全保障を守り、外部からの圧力や地域不安定化に共同で対処するため、UNASULの下で防衛協力を制度化し、南米諸国を結ぶ新たな共同防衛機構を築こう。"
unasul_member_state_modifier: "UNASUL加盟国"
unasul_member_state_modifier_desc: "UNASULは、南米における政治協調、開発、共同行動のための大陸的枠組みとして再建されつつある。加盟国が増え、新たな評議会や計画が進むにつれて、その恩恵はさらに大きくなる。\n\n§Yこの国民精神はUNASUL加盟国数の増加に応じて強化される。§!"
MER_unasul_integrated_corridor_plan_modifier: "UNASUL統合回廊計画"
MER_unasul_integrated_corridor_plan_modifier_desc: "UNASULは、南米全体の道路、物流、デジタル接続への協調投資を開始した。当面の間、加盟国では輸送・ネットワーク関連インフラ建設が通常より速く進む。"
MER_unasul_energy_security_modifier: "UNASULエネルギー安全保障構想"
MER_unasul_energy_security_modifier_desc: "UNASULは、エネルギー強靭化のためにブロック全体の資源を投入している。現在、加盟国では共通の地域計画の下で化石燃料、原子力、再生可能エネルギー関連建設が加速している。"
MER_unasul_joint_exercises_modifier: "UNASUL共同演習"
MER_unasul_joint_exercises_modifier_desc: "UNASUL加盟国軍は現在、共同演習、参謀交流、相互運用性計画を一体で進めている。"
MER_invite_to_unasul: "[FROM.GetName]をUNASULへ招待"
MER_invite_to_unasul_desc: "[FROM.GetName]をUNASULへ迎え入れるための正式協議を開始する。受託率はその国とのopinion、影響力、そしてUNASULツリーの進行度によって決まる。"
MER_unasul_integrated_corridor_plan: "統合回廊計画の始動"
MER_unasul_integrated_corridor_plan_desc: "国庫を投じ、現在のUNASUL加盟国すべてで180日間、輸送・ネットワーク関連建設を加速させる。"
MER_unasul_counter_cartel_operation: "反カルテル同盟作戦の発動"
MER_unasul_counter_cartel_operation_desc: "カルテルの影響を受けるUNASUL加盟国すべてに対し、共同の反カルテル作戦へ政治力を拠出するよう求める。最終的な効果は、どれだけの国が本格的にコミットするかで決まる。"
MER_unasul_counter_cartel_operation_tt: "カルテルの影響を受けるUNASUL加盟国には、共同作戦への政治的コミットを求める通知が送られる。最終的な成果は、参加各国がどこまで本格的に作戦を支えるかによって左右される。"
MER_unasul_energy_security_reinforcement: "南米エネルギー安全保障の強化"
MER_unasul_energy_security_reinforcement_desc: "国庫を投じ、現在のUNASUL加盟国すべてで180日間、化石燃料、原子力、再生可能エネルギー関連建設を加速させる。"
MER_unasul_joint_health_improvement_project: "UNASUL共同健康向上プロジェクト"
MER_unasul_joint_health_improvement_project_desc: "180日間の保健協調プロジェクトを開始する。完了時にUNASULへ月毎の人口増加への恒久補正が追加される。最大4回まで完了できる。\n\n§Yこの系統によるUNASULの月毎の人口増加は最大+10%まで成長する。§!"
MER_unasul_supply_chain_strengthening: "南米サプライチェーンの強化"
MER_unasul_supply_chain_strengthening_desc: "180日間のサプライチェーン協調計画を開始する。完了時にUNASULへ民需産業生産性への恒久補正が追加される。最大4回まで完了できる。\n\n§Yこの系統によるUNASULの民需産業生産性は最大+15%まで成長する。§!"
MER_unasul_joint_exercises: "UNASUL共同演習の実施"
MER_unasul_joint_exercises_desc: "180日間のUNASUL共同演習を実施し、ブロック全体で陸海空の日毎の経験値獲得を強化する。"
MER_unasul_joint_research_exchange_project: "UNASUL共同研究・技術交流プロジェクト"
MER_unasul_joint_research_exchange_project_desc: "180日間の研究協調計画を開始する。完了時にUNASULへ研究速度への恒久補正が追加される。最大4回まで完了できる。\n\n§Yこの系統によるUNASULの研究速度は最大+10%まで成長する。§!"
mercosur.35.t: "UNASUL加盟招待"
mercosur.35.d: "[FROM.GetName]が、UNASULへの参加を提案してきた。彼らはこれを、南米が再び共通して動くための政治的な屋根だと位置づけている。これを受け入れるということは、対話と協調、そして大陸的な構想を掲げる計画の内側へ入るということだが、同時に、自国の進路をより広い地域的構想へ結びつける覚悟も問われる。"
mercosur.35.a: "UNASULへ参加する。"
mercosur.35.b: "今は見送る。"
mercosur.36.t: "UNASUL招待送付"
mercosur.36.d: "[FROM.GetName]のUNASUL加盟に向けた外交協議を開始した。招待は届けられ、説得の言葉も尽くされた。あとは相手国が、南米協調の再来に賭ける意思を持つかどうかを見極めるだけだ。"
mercosur.36.a: "進めよう。"
mercosur.37.t: "UNASUL招待受諾"
mercosur.37.d: "[FROM.GetName]は我々の招待を受け入れ、UNASULへ加わった。ついこの前まで演説や共同声明の中にあった構想が、少しずつ実在する大陸機構の姿を帯び始めている。"
mercosur.37.a: "素晴らしい。"
mercosur.38.t: "UNASUL招待拒否"
mercosur.38.d: "[FROM.GetName]は今のところUNASUL加盟への招待を辞退した。より広い南米枠組みという夢が完全に退けられたわけではないが、少なくとも今は、相手国の信頼を勝ち取るには至らなかった。"
mercosur.38.a: "また後で試そう。"
mercosur.39.t: "UNASUL加盟受諾"
mercosur.39.d: "我々は[FROM.GetName]の招待を受け入れ、UNASULへ加わった。南米統合の将来がどれほど不確かであろうと、我々はそれを外から眺める側ではなく、内側で形作る側に立つことを選んだ。"
mercosur.39.a: "より広い南米へ。"
mercosur.40.t: "[FROM.GetName]がUNASULへ加盟"
mercosur.40.d: "[FROM.GetName]がUNASULへ加盟した。新たな政府、新たな官僚機構、そして新たな国家的思惑が、この南米枠組みに加わったことになる。加盟国が増えるたび、この計画は懐古的な夢として退けにくくなり、持続的な政治的現実として見えやすくなっていく。"
mercosur.40.a: "大陸の足並みが揃っていく。"
mercosur.50.t: "統合回廊計画始動"
mercosur.50.d: "UNASUL統合回廊計画は、会議室の議題から現場の地図と実施計画へ移りつつある。大陸各地で官僚、技師、計画担当者たちが、統合という言葉を道路、連絡網、回廊という実感ある形へ変えようとしている。"
mercosur.50.a: "建設を進めよう。"
mercosur.51.t: "共同健康プロジェクト開始"
mercosur.51.d: "UNASULの下で新たな共同健康構想が始まった。共同調達や危機対応、制度調整が語られているが、その官僚的な言葉の下には、統合を病院、診療所、日常生活の水準で実感させようという、より大きな野心がある。"
mercosur.51.a: "より健全な大陸へ。"
mercosur.52.t: "共同健康プロジェクト完了"
mercosur.52.d: "最新の共同健康構想は完了し、その中で有効だった仕組みはUNASULの恒常的な枠組みに取り込まれつつある。一時的な試みとして始まったものが、今では組織の習慣へと変わり、統合により人間的で身近な顔を与え始めている。"
mercosur.52.a: "持続的な成果だ。"
mercosur.53.t: "エネルギー安全保障構想始動"
mercosur.53.d: "UNASULは大陸規模のエネルギー安全保障構想を打ち出した。電力当局、計画担当者、閣僚たちは、南米の豊かさが対立の火種ではなく、安定の基盤となるよう、同じ地域地図の上で動き始めている。"
mercosur.53.a: "大陸へ電力を。"
mercosur.54.t: "サプライチェーン構想開始"
mercosur.54.d: "UNASULは新たなサプライチェーン構想を始動した。各国政府、商工団体、技術機関はいま、南米の生産が互いに隣り合って存在するだけでなく、実際に噛み合うものとなるよう、骨の折れる調整に着手している。"
mercosur.54.a: "市場を結びつけよう。"
mercosur.55.t: "サプライチェーン構想完了"
mercosur.55.d: "最新のUNASULサプライチェーン構想が完了した。そこで築かれた実務慣行、商業関係、制度的な接点は、もはや一過性の実験ではない。地域経済を支える恒常的な骨格の一部になりつつある。"
mercosur.55.a: "生産基盤が強まった。"
mercosur.56.t: "共同演習実施中"
mercosur.56.d: "UNASUL共同演習が始まった。これまで儀礼的な場でしか顔を合わせなかった将校たちは、いま現場で互いのやり方を学び、前提を試し、地域協調が実際に機能するとはどういうことかを確かめている。"
mercosur.56.a: "即応性を高めよう。"
mercosur.57.t: "研究交流計画開始"
mercosur.57.d: "新たなUNASUL共同研究・技術交流計画が始まった。南米各地の大学、研究所、技術機関は、今や同じ会話の輪の中へ引き寄せられつつある。物資だけでなく知識そのものを本気で行き来させられるかが問われている。"
mercosur.57.a: "知識を共有しよう。"
mercosur.58.t: "研究交流計画完了"
mercosur.58.d: "最新の共同研究・技術交流計画は完了した。この計画が生んだつながりは、事業そのものの終了後も残り続けている。南米の知が散在するだけのものではなく、組織され得るものだという感覚が、以前よりも確かなものになった。"
mercosur.58.a: "知識は残る。"
mercosur.60.t: "反カルテル作戦への拠出"
mercosur.60.d: "UNASULはカルテルの影響に対抗するため、協調的な作戦を開始した。問われているのは脅威が現実かどうかではない。我々が、この地域的な回答のためにどこまで自らの政治的重みを差し出す覚悟があるかだ。"
mercosur.60.a: "各機関に限定的な協力態勢を敷かせる。"
mercosur.60.b: "国家の威信を懸けて全面支援へ踏み切る。"
mercosur.61.t: "反カルテル作戦強化"
mercosur.61.d: "参加したUNASUL諸国の過半数は、今回の作戦に本気で踏み込む道を選んだ。その結果は単なる示威ではない。カルテル網、その後ろ盾、そして彼らを存続させてきた恐怖の空気そのものに、鋭い地域的打撃が与えられた。"
mercosur.61.a: "圧力を維持しよう。"
mercosur.62.t: "反カルテル作戦完了"
mercosur.62.d: "作戦は、より抑制的な支援のもとで進められた。それでも共同の圧力はカルテル網を揺さぶり、その行動余地を狭めたが、より結束した対応であれば与えられたはずの衝撃には届かなかった。"
mercosur.62.a: "有益な一歩だ。"
mercosur.75.t: "UNASUL防衛条約への招待"
mercosur.75.d: "[FROM.GetName]が、UNASUL防衛枠組みへの参加を提案してきた。これを受け入れるということは、単にもう一つの文書へ署名するだけではない。南米が圧力の高まりに際して共に立つ意思を、隣国にも域外勢力にも示す軍事的了解の内側へ入るということだ。"
mercosur.75.a: "防衛条約へ参加する。"
mercosur.75.b: "辞退する。"
mercosur.76.t: "防衛条約招待受諾"
mercosur.76.d: "[FROM.GetName]は我々の招待を受け入れ、UNASUL防衛条約へ加わった。同盟はまだ若いが、署名が増えるたびに、その信頼性も重みも、単なるスローガンを超えた意味も増していく。"
mercosur.76.a: "同盟は拡大する。"
mercosur.77.t: "防衛条約招待拒否"
mercosur.77.d: "[FROM.GetName]は今のところUNASUL防衛条約への参加を辞退した。地域的連帯の言葉がいかに美しくとも、すべての政府が防衛政策まで南米の共通物語へ組み込む覚悟を持っているわけではない。"
mercosur.77.a: "残念だ。"
mercosur.78.t: "UNASUL防衛条約へ参加"
mercosur.78.d: "我々は[FROM.GetName]の招待を受け入れ、UNASUL防衛条約へ参加した。それは我々の安全保障を、政治的な親近感だけでなく、戦略的な責任を伴う大陸的枠組みへ結びつける選択でもある。"
mercosur.78.a: "南米は結束する。"
mercosur.79.t: "関税調整完了"
mercosur.79.d: "新規加盟国候補との間で進められていた関税と制度面のすり合わせが一区切りついた。表向きには技術的な調整に見えても、その政治的意味は明白だ。両国のあいだにあった境目の一つが、恒久的なものではないと示されたのである。"
mercosur.80.t: "税関制度近代化完了"
mercosur.80.d: "新規加盟国候補向けの税関改革は完了した。手続きは整理され、国境での運用は引き締められ、国家の行政姿勢そのものが、MERCOSURの内側へ入る準備を帯び始めている。"
mercosur.81.t: "共通基準採用支援完了"
mercosur.81.d: "新規加盟国候補向けの共通基準導入は完了した。かつて距離を映していた規則や慣行が、いまや整合性という言葉で書き換えられつつあり、ブロックへの道筋は以前よりはるかに現実味を帯びている。"
mercosur.82.t: "物流回廊計画完了"
mercosur.82.d: "新規加盟国候補向けの物流回廊計画が完了した。抽象的な統合構想として語られていたものが、今では動線、拠点、接続という形を取り始め、加盟が儀礼ではなく現地の実感を伴うものになりつつある。"
mercosur.83.t: "輸送網整備完了"
mercosur.83.d: "新規加盟国候補の加盟支援に結びついた輸送整備が完了した。距離そのものが消えたわけではないが、地図は以前より少しだけ狭まり、統合という言葉は少しだけ現実に近づいた。"
mercosur.84.t: "接続性強化計画完了"
mercosur.84.d: "新規加盟国候補向けの接続性強化計画が完了した。商流、行政連絡、越境調整は、これまでより確かな経路の上で動けるようになっている。"
mercosur.85.t: "開発資金拠出完了"
mercosur.85.d: "新規加盟国候補向けの開発パッケージは全額実行された。この規模の目に見える関与は、どんな共同声明よりも雄弁に、MERCOSURが信頼を求めるだけでなく、自らも賭け金を出していることを伝える。"
mercosur.86.t: "民需投資完了"
mercosur.86.d: "新規加盟国候補向けの民需投資段階が完了した。工房や企業、商業地区にとって、地域統合はもはや外交文書の中だけの話ではなく、現実の機会として映り始めている。"
mercosur.87.t: "インフラ整備完了"
mercosur.87.d: "新規加盟国候補向けのインフラ改良計画が完了した。完成した一つ一つの事業は同じ政治的メッセージを残す。加盟とは署名だけではなく、国が地域との結び方そのものを組み替えることなのだと。"
mercosur.88.t: "商業インフラ拡張完了"
mercosur.88.d: "新規加盟国候補向けの商業インフラ計画が完了した。MERCOSURの約束は、いまや演説の中だけでなく、忙しくなる物流路や整えられた施設の中にも姿を現し始めている。"
mercosur.89.t: "産業投資協定発効"
mercosur.89.d: "新規加盟国候補との産業投資協定が発効した。外交上の了解として始まったものは、いまや深みと期待、そして儀礼を超えて残り続ける利害を伴う経済関係へ変わりつつある。"
mercosur.90.t: "商業投資枠組み確立"
mercosur.90.d: "新規加盟国候補との商業投資枠組みが整えられた。銀行、企業、官庁のあいだには以前より頑丈な橋がかかりつつあり、そのこと自体が加盟を象徴的な身振りではなく、互いに賭ける現実的選択へ変えていく。"
mercosur.91.t: "金融協力パッケージ実施"
mercosur.91.d: "新規加盟国候補向けの金融協力パッケージが届けられた。最後の一片がはめ込まれたことで、この加盟努力はもはや仮のものには見えない。その国がブロックの内側へ着実に引き寄せられている感触がある。"
mercosur.108.t: "MERCOSUR開発基金ラウンド始動"
mercosur.108.d: "MERCOSUR開発基金の新ラウンドが動き出した。各加盟国の官庁、企業、地方当局は、これを単なる数字ではなく、統合がなお資金と実務の裏付けを伴って前へ進んでいる証として受け止めるだろう。開発の約束は再び紙から現場へ移りつつある。"
mercosur.108.a: "資金を地域へ行き渡らせよう。"
mercosur.accession_project_complete.a: "進めよう。"
mercosur.93.t: "正式加盟受諾"
mercosur.93.d: "[FROM.GetName]は我々の提案を受け入れ、段階的な移行を挟むことなく、その場でMERCOSURの正式加盟国となった。慎重な助走ではなく、ブロックが今日この瞬間に一回り大きくなったという政治的事実だけが残る。"
mercosur.93.a: "素晴らしい。"
mercosur.94.t: "MERCOSURへ即時加盟"
mercosur.94.d: "我々の進路は定まり、MERCOSURはもはや外から眺める会議体ではなく、その内側から関わる現実となった。地域秩序の中での我々の立場をめぐる曖昧さは薄れ、より重い事実だけが残る。我々はすでにブロックの一員である。"
mercosur.94.a: "我々はブロックに加わる。"
mercosur.95.t: "準加盟申請"
mercosur.95.d: "[FROM.GetName]は、MERCOSURへ準加盟国として加わりたいと正式に求めてきた。この請願は、まだブロックを全面的に拡張せよと迫るものではない。だが、それでも我々に問うているのは、相手を我々の政治的圏内へ引き込み、その意味を引き受ける覚悟があるかどうかだ。これを認めれば、新たな政府がMERCOSURを軸に自らの進路を考え始めることになる。"
mercosur.95.a: "準加盟を認めよう。"
mercosur.95.b: "今は認められない。"
mercosur.96.t: "準加盟申請送付"
mercosur.96.d: "我々の準加盟申請は[FROM.GetName]へ届けられた。もはや案件は正式に相手の机上へ載せられており、返答もほどなく届くだろう。"
mercosur.96.a: "返答を待とう。"
mercosur.97.t: "準加盟申請拒否"
mercosur.97.d: "[FROM.GetName]は、我々の準加盟申請を退けた。少なくとも今は、彼らは我々をブロックの制度と期待の内側へ引き込むより、外にとどめておく方を選んだ。"
mercosur.97.a: "扉は閉ざされた。"
mercosur.98.t: "正式加盟申請"
mercosur.98.d: "[FROM.GetName]は、MERCOSURの正式加盟国として迎え入れられたいと求めてきた。もはやブロックの縁に立つだけでは満足せず、その内側に席を得ようとしているのだ。これを認めるということは、相手の将来を我々とより深く、より恒久的に結び付けるかを決めることでもある。"
mercosur.98.a: "加盟への道を開こう。"
mercosur.98.b: "まだ早い。"
mercosur.99.t: "正式加盟申請送付"
mercosur.99.d: "我々のMERCOSUR正式加盟申請は[FROM.GetName]へ届けられた。返答が届けば、ブロックの中での我々の最終的な立場は、外交上の願望ではなく具体的な選択肢として迫ってくる。"
mercosur.99.a: "請願は出された。"
mercosur.100.t: "正式加盟申請拒否"
mercosur.100.d: "[FROM.GetName]は、我々の正式加盟申請を前へ進めることを拒んだ。どれほどの信頼や期待があったとしても、それはブロックの内側を広げる決断を下すには足りなかった。"
mercosur.100.a: "今回は否だ。"
mercosur.101.t: "UNASUL加盟申請"
mercosur.101.d: "[FROM.GetName]は、UNASULへ加わりたいと求めてきた。相手政府は、形成されつつある南米枠組みの外側ではなく、内側に席を得ようとしている。そして今、その請願への答えは我々に委ねられている。これを認めるということは、UNASULを閉じた倶楽部ではなく、なお新たな国々を引き込める構想として扱うことを意味する。"
mercosur.101.a: "UNASULへ迎え入れよう。"
mercosur.101.b: "扉は閉ざしておく。"
mercosur.102.t: "UNASUL加盟申請送付"
mercosur.102.d: "我々の請願は[FROM.GetName]へ届けられた。返答が届けば、我々の将来が南米枠組みの外側にあるのか、それとも内側にあるのかがはっきりする。"
mercosur.102.a: "返答を待つ。"
mercosur.103.t: "UNASUL加盟申請拒否"
mercosur.103.d: "[FROM.GetName]は、我々のUNASUL加盟申請を退けた。大陸的な言葉がいかに高らかに語られていようとも、少なくとも今は、その門を守る者たちは我々をその物語の一部とは見なしていない。"
mercosur.103.a: "それが答えか。"
mercosur.105.t: "準加盟承認"
mercosur.105.d: "我々の請願は実を結び、MERCOSURの準加盟国として迎え入れられることになった。まだ最も内側の席ではない。だが、我々の政治的・経済的な地平が、もはや南米統合から遠ざかる方向ではなく、その側へ傾き始めたことは明らかだ。"
mercosur.105.a: "一歩近づいた。"
mercosur.107.t: "UNASUL加盟承認"
mercosur.107.d: "我々の請願は通り、UNASULの内側へ加わることになった。南米統合の将来にどれほど不確実さが残っていようとも、我々はその実験を外から眺めるのではなく、内側に入り、自ら担う側へ回る道を選んだのである。"
mercosur.107.a: "我々は構想に加わる。"
mercosur_news.1.t: "UNASUL設立"
mercosur_news.1.d: "南米諸国は、政治対話、インフラ整備、社会協力を束ねる恒常的な地域機構として、UNASULの設立を打ち出した。これにより南米の結束は新たな段階へ進み、域内協調はより制度的で継続的なものとなるだろう。一方で、この構想が真に機能するかどうかは、加盟国間の利害の違いを乗り越えられるかにかかっている。"
mercosur_news.1.a: "南米統合の新段階"
mercosur_news.2.t: "UNASULが共同防衛条約を創設"
mercosur_news.2.d: "UNASULは経済・政治協調を超え、新たな南米共同防衛条約の創設を発表した。支持者はこれを地域統合の自然な延長とみなす一方、懐疑派は大陸がより積極的で分断的になり得るブロック政治の段階へ入ったと警戒している。"
mercosur_news.2.a: "南米が足並みを揃える。"
mercosur_news.3.t: "UNASULから一国が距離を置く"
mercosur_news.3.d: "[ROOT.GetNameWithFlag]はUNASUL共同防衛機構からの離脱を発表し、南米が防衛の線を引き直したあの瞬間に封じ込められたはずだった疑念を再び表面へ押し戻した。離脱支持派はこれを主権的判断の回復として語るが、反対派は、政治的信認の上に立っていた条約に初めて目に見える綻びが走ったと受け止めている。これが単発の後退で終わるのか、それとも大陸全体の結束を試す前兆となるのか、域内の視線はいま静かに一点へ集まりつつある。"
mercosur_news.3.a: "条約はもはや絶対ではない。"
