 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_next_batch_tt: "Если §YБолгария§! согласится, примерно через §Y60§! дн. мы сможем запросить следующую партию из §Y40§! §YБТР-60ПБ§!."
 ukraine_modernize_sov_equipment_btr_60_modernization_overhaul_wait_tt: "Наши заводы завершат капитальный ремонт примерно через §Y$DAYS$§! дн."
