 SOV_module_helipads_2: "Ka-27"
 production_line_improvements_2: "Líneas de Producción Mejoradas II"
 production_line_improvements_2_desc: "El uso ampliado de componentes estandarizados y procesos de ensamblaje semiautomatizados permite a las fábricas escalar la producción de manera más confiable y, al mismo tiempo, reducir los cuellos de botella laborales."
 production_line_improvements_3: "Líneas de Producción Mejoradas III"
 production_line_improvements_3_desc: "La coordinación logística avanzada y los sistemas optimizados de manejo de materiales mejoran significativamente el rendimiento y reducen el desperdicio en las instalaciones industriales."
 production_line_improvements_4: "Líneas de Producción Mejoradas IV"
 production_line_improvements_4_desc: "La adopción generalizada de robótica industrial y herramientas de precisión mejora la velocidad de producción, el control de calidad y la adaptabilidad a nuevos diseños."
 production_line_improvements_5: "Líneas de Producción Mejoradas V"
 production_line_improvements_5_desc: "Los sistemas de gestión de producción integrados digitalmente permiten la monitorización en tiempo real y el ajuste rápido de los procesos de fabricación, aumentando la eficiencia general."
 production_line_improvements_6: "Líneas de Producción Mejoradas VI"
 production_line_improvements_6_desc: "La automatización de alto nivel y el mantenimiento predictivo reducen las tasas de fallas de los equipos, lo que permite que las fábricas funcionen con la máxima eficiencia sostenida."
 production_line_improvements_7: "Líneas de Producción Mejoradas VII"
 production_line_improvements_7_desc: "Las técnicas de fabricación inteligente combinan el análisis de datos con la toma de decisiones automatizada, optimizando los flujos de producción en redes industriales enteras."
 production_line_improvements_8: "Líneas de Producción Mejoradas VIII"
 production_line_improvements_8_desc: "Las líneas de producción altamente modulares permiten una rápida reconfiguración para nuevos equipos y diseños, mejorando enormemente la flexibilidad industrial."
 production_line_improvements_9: "Líneas de Producción Mejoradas IX"
 production_line_improvements_9_desc: "Las fábricas casi autónomas utilizan el aprendizaje automático para optimizar la producción, el uso de recursos y la asignación de mano de obra con una mínima intervención humana."
 production_line_improvements_10: "Líneas de Producción Mejoradas X"
 production_line_improvements_10_desc: "Los ecosistemas industriales totalmente integrados sincronizan proveedores, fabricantes y logística en tiempo real, impulsando la eficiencia de la producción a niveles sin precedentes."
 improved_building_constructions_2: "Enfoque en Construcción de Planta II"
 improved_building_constructions_2_desc: "Los componentes prefabricados y una logística de construcción mejorada reducen los tiempos de construcción manteniendo la integridad estructural."
 improved_building_constructions_3: "Enfoque en Construcción de Planta III"
 improved_building_constructions_3_desc: "Las prácticas de ingeniería mejoradas y los equipos de construcción modernos permiten construir plantas industriales más rápidamente y con mayor confiabilidad."
 improved_building_constructions_4: "Enfoque en Construcción de Planta IV"
 improved_building_constructions_4_desc: "La automatización en los procesos de construcción y una mejor coordinación de la fuerza laboral aceleran significativamente el desarrollo industrial."
 improved_building_constructions_5: "Enfoque en Construcción de Planta V"
 improved_building_constructions_5_desc: "La planificación asistida digitalmente y las técnicas de construcción de precisión minimizan los retrasos y reducen el consumo general de recursos."
 improved_building_constructions_6: "Enfoque en Construcción de Planta VI"
 improved_building_constructions_6_desc: "Los materiales avanzados y los métodos de construcción modular permiten una rápida expansión y actualización de la infraestructura industrial."
 improved_building_constructions_7: "Enfoque en Construcción de Planta VII"
 improved_building_constructions_7_desc: "Las cadenas de construcción altamente optimizadas integran proveedores, constructores y planificadores, agilizando todo el proceso de construcción industrial."
 improved_building_constructions_8: "Enfoque en Construcción de Planta VIII"
 improved_building_constructions_8_desc: "Los sistemas de construcción inteligentes aprovechan la automatización y los datos en tiempo real para garantizar la máxima eficiencia y el mínimo desperdicio."
 improved_building_constructions_9: "Enfoque en Construcción de Planta IX"
 improved_building_constructions_9_desc: "Los proyectos industriales a gran escala se benefician de la planificación asistida por IA, lo que permite una finalización más rápida y un mejor rendimiento a largo plazo."
 improved_building_constructions_10: "Enfoque en Construcción de Planta X"
 improved_building_constructions_10_desc: "Las técnicas de construcción casi autónomas reducen drásticamente los tiempos de construcción, lo que permite una rápida movilización industrial."
 CAT_microchips: "Microchips"
 CAT_helicopter_operators: "Operadores de Helicópteros"
 microchip_production_1: "Producción temprana de chips"
 microchip_production_1_desc: "El establecimiento de la fabricación nacional de semiconductores permite la producción en masa de circuitos integrados básicos. Esto sienta las bases de la electrónica moderna, mejorando la fiabilidad y la disponibilidad de los componentes informáticos utilizados en sistemas militares, automatización industrial e infraestructura civil."
 microchip_production_2: "DRAM de 1 Kbit"
 microchip_production_2_desc: "La memoria de acceso aleatorio dinámico temprana permite a los sistemas electrónicos almacenar y acceder a los datos de forma temporal a velocidades mucho más altas que las tecnologías anteriores. Aunque tiene una capacidad limitada, esta memoria hace que las computadoras sean más receptivas, dando soporte a los primeros sistemas de control digital y mejorando las capacidades de procesamiento de datos."
 microchip_production_3: "DRAM de 64 Kbit"
 microchip_production_3_desc: "Las mejoras en los procesos de fabricación incrementan significativamente la densidad de la memoria y los rendimientos de producción. La DRAM de 64 kilobits admite software más complejo y un funcionamiento del sistema más rápido, lo que permite aplicaciones informáticas más avanzadas en comunicaciones, análisis de inteligencia y sistemas de control de armas."
 microchip_production_4: "DRAM de 1 Gbit"
 microchip_production_4_desc: "Los módulos de memoria gigabit de alta densidad representan un avance crucial en la tecnología de semiconductores. Estos chips permiten el procesamiento de datos a gran escala, simulaciones avanzadas y sistemas modernos de mando en red, formando un componente crítico de la infraestructura informática militar y civil contemporánea."
 microchip_production_5: "Producción de chips del futuro"
 microchip_production_5_desc: "La producción avanzada de chips utiliza litografía EUV, transistores de nanofilamentos (nanosheet) y líneas de fabricación altamente automatizadas para manufacturar semiconductores más pequeños, rápidos y eficientes energéticamente para la electrónica civil y militar."
 composite_production_1: "Producción temprana de compuestos"
 composite_production_1_desc: "El desarrollo inicial de materiales compuestos combina metales tradicionales con polímeros o fibras para lograr mejores relaciones de resistencia a peso. La producción temprana de compuestos mejora el rendimiento estructural en vehículos, aeronaves e infraestructura, al tiempo que reduce los costes generales de material y el peso."
 composite_production_2: "Materiales compuestos de 2.ª generación"
 composite_production_2_desc: "Los perfeccionamientos en la ciencia de materiales y las técnicas de fabricación conducen a materiales compuestos más consistentes y duraderos. Estos compuestos de segunda generación ofrecen una resistencia al calor y una fiabilidad estructural mejoradas, lo que los hace adecuados para aplicaciones militares e industriales más amplias."
 composite_production_3: "Compuestos casi modernos"
 composite_production_3_desc: "Los avances en la tecnología de fibras y la química de resinas permiten la producción de compuestos de alto rendimiento que se aproximan a los estándares modernos. Estos materiales mejoran significativamente la durabilidad, la reducción de peso y la resistencia a la fatiga, dando soporte a aeronaves avanzadas, vehículos blindados y sistemas navales."
 composite_production_4: "Producción de compuestos moderna"
 composite_production_4_desc: "Los procesos maduros de fabricación de compuestos permiten la producción a gran escala de materiales avanzados con tolerancias precisas y una calidad constante. Los compuestos modernos son fundamentales para las plataformas militares contemporáneas, proporcionando una mayor protección, movilidad y eficiencia en las fuerzas aéreas, terrestres y navales."
 composite_production_5: "Producción de compuestos avanzada"
 composite_production_5_desc: "La producción avanzada de compuestos utiliza la colocación automatizada de fibras, el moldeo por transferencia de resina y métodos de curado mejorados para fabricar estructuras más ligeras y fuertes para aeronaves, vehículos blindados, misiles y sistemas de protección."
 NAVAL_TITLE_PATROLBOATS: "PATRULLEROS"
 NAVAL_TITLE_PATROLBOATS_DESC: ""
 NAVAL_TITLE_HEAVY_FRIGATES: "FRAGATAS PESADAS"
 NAVAL_TITLE_HEAVY_FRIGATES_DESC: ""
 NAVAL_TITLE_DIESEL_ENGINES: "MOTORES NAVALES DIÉSEL"
 NAVAL_TITLE_DIESEL_ENGINES_DESC: ""
 NAVAL_TITLE_TURBINE_ENGINES: "MOTORES NAVALES DE TURBINA"
 NAVAL_TITLE_TURBINE_ENGINES_DESC: "Ships usually operate by massive diesel engines or turbine engines, or a combination of both."
 NAVAL_TITLE_FUSION_ENGINES: "MOTORES DE FUSIÓN"
 NAVAL_TITLE_FUSION_ENGINES_DESC: "Los motores nucleares disponen esencialmente de combustible ilimitado, lo que permite a nuestros buques operar en el océano mientras queden suministros para los marineros a bordo."
 NAVAL_TITLE_RADAR_DRONE: "DRONES DE RADAR"
 NAVAL_TITLE_RADAR_DRONE_DESC: "Los drones de radar amplían el alcance de los sensores de un buque más allá del horizonte al transportar radares ligeros de búsqueda marítima por el aire, mejorando la detección de barcos, aviones, misiles y amenazas de bajo vuelo antes de que alcancen a la flota."
 NAVAL_TITLE_RADAR_JAM: "INHIBIDORES DE RADAR"
 NAVAL_TITLE_RADAR_JAM_DESC: "Los módulos inhibidores de radar montan matrices dedicadas de ataque electrónico en los buques de guerra, lo que les permite interferir con los radares de búsqueda enemigos, los sensores de puntería y los buscadores de misiles guiados por radar durante el combate."
 NAVAL_TITLE_RAILGUNS_BATTERY: "BATERÍAS DE CAÑONES DE RIEL"
 NAVAL_TITLE_RAILGUNS_BATTERY_DESC: "Railguns use kinetic ammunition that is accelerated to high speeds with electromagnetic forces. The projectile accelerates into incredibly high speeds, giving it good penetration and accuracy characteristics."
 NAVAL_TITLE_ANTI_DRONE_LASER: "LÁSERES DE DEFENSA DE PUNTO"
 NAVAL_TITLE_ANTI_DRONE_LASER_DESC: ""
 NAVAL_TITLE_VLS_DRONE: "SISTEMAS DE LANZAMIENTO VERTICAL DE DRONES"
