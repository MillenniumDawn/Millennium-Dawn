 ALG_minister_vacant: "Vago"
 ALG_military_industrial_complex: "Complexo Militar-Industrial"
 ALG_patronage_networks: "Redes de Clientelismo"
 ALG_crush_all_opposition: "Esmagar Toda a Oposição"
 ALG_control_hydrocarbons: "Controlar os Hidrocarbonetos"
 ALG_fortress_algeria: "Fortaleza Argélia"
 ALG_military_industrial_complex_desc: "Os militares expandem seu império econômico, construindo fábricas de armas e garantindo lucrativos contratos de defesa. O corpo de oficiais torna-se uma classe empresarial, com generais ocupando conselhos de administração e acumulando vastas fortunas."
 ALG_patronage_networks_desc: "Uma teia de clientelismo liga o regime às elites empresariais e aos poderosos regionais. A lealdade é comprada com contratos, licenças e acesso. O Estado se torna um instrumento de enriquecimento privado."
 ALG_crush_all_opposition_desc: "O regime elimina toda oposição organizada por meio de prisões, censura e intimidação. Os partidos políticos são cooptados ou banidos. A sociedade civil é esvaziada. Apenas a voz do regime é ouvida."
 ALG_control_hydrocarbons_desc: "O Estado toma o controle total do setor de hidrocarbonetos, canalizando as receitas de petróleo e gás diretamente para os cofres do regime. Os parceiros estrangeiros são espremidos, os operadores independentes são absorvidos e o Estado profundo controla a torneira."
 ALG_fortress_algeria_desc: "A Argélia se torna um Estado de guarnição - militarizado, fechado e desconfiado do mundo exterior. O exército é forte, as fronteiras são seladas e a população é mantida na linha por uma combinação de riqueza petrolífera e repressão."
 ALG_oil_crash_weakens_regime_tt: "A queda do petróleo enfraqueceu gravemente a capacidade do regime de comprar paz social. O descontentamento popular está aumentando."
 ALG_hirak_wins_tt: "O movimento Hirak triunfou. Uma nova Argélia é possível."
 ALG_military_wins_tt: "O Estado profundo prevaleceu. O domínio militar continua sob uma nova face."
 ALG_republic_new_era_tt: "Uma nova era começa para a República da Argélia. O antigo sistema está sendo desmantelado."
 ALG_parliamentary_republic_tt: "A Argélia adotou um sistema de governo parlamentarista. A Assembleia Nacional é suprema."
 ALG_semi_presidential_republic_tt: "A Argélia adotou um sistema de governo semipresidencialista. O poder é dividido entre o presidente e o parlamento."
 ALG_presidential_republic_tt: "A Argélia adotou um sistema de governo presidencialista. O presidente detém a autoridade executiva dominante."
 ALG_patronage_enriches_regime_tt: "As redes de clientelismo enriquecem o regime e seus aliados às custas do povo argelino."
 ALG_fortress_state_tt: "A Argélia se tornou um Estado-fortaleza. O Estado profundo governa de forma absoluta, e a nação está fechada para o mundo."
 ALG_military_industrial_economy: "Economia Militar-Industrial"
 ALG_state_hydrocarbon_monopoly: "Monopólio Estatal de Hidrocarbonetos"
 ALG_fortress_state: "Estado-Fortaleza"
 ALG_military_industrial_economy_desc: "Os militares se expandiram para a produção de armas e a indústria de defesa, criando uma base econômica autossustentável para o regime. Generais ocupam conselhos de administração e a linha entre o uniforme e o terno de negócios se tornou turva."
 ALG_state_hydrocarbon_monopoly_desc: "O controle estatal total sobre as receitas de petróleo e gás financia o regime e suas redes de clientelismo. O setor de hidrocarbonetos é um mundo fechado onde apenas os bem relacionados podem operar."
 ALG_fortress_state_desc: "A Argélia se tornou um Estado fechado e militarizado. O exército é poderoso, a sociedade é controlada e o Estado profundo governa sem contestação. A estabilidade foi comprada ao preço da liberdade."
 ALG_redmed_group_expansion: "Expansão do Grupo RedMed"
 ALG_redmed_group_expansion_desc: "O Grupo RedMed provou ser um parceiro logístico confiável para o setor de petróleo e gás em torno de Hassi Messaoud. Com o investimento certo, pode se tornar uma força industrial mais ampla."
 ALG_star_aviation_operations: "Operações da Star Aviation"
 ALG_star_aviation_operations_desc: "A subsidiária de aviação do Grupo RedMed mantém um histórico de segurança perfeito desde a sua fundação. Devemos aproveitar essa reputação para aprofundar nosso envolvimento no setor aeronáutico."
 ALG_military_aviation_contract: "Contratos de Aviação Militar"
 ALG_military_aviation_contract_desc: "A excelência operacional da Star Aviation chamou a atenção dos militares. Garantir contratos de defesa abrirá a porta para o desenvolvimento aeroespacial avançado e financiará a próxima fase de expansão."
 ALG_missile_development_initiative: "Iniciativa de Desenvolvimento de Mísseis"
 ALG_missile_development_initiative_desc: "Uma força militar moderna não pode depender apenas de armas estrangeiras. Iniciaremos um programa nacional de mísseis por meio do Grupo RedMed, lançando as bases para a dissuasão estratégica."
 ALG_star_aviation_uav_division: "Divisão de VANTs da Star Aviation"
 ALG_star_aviation_uav_division_desc: "Com a tecnologia estrangeira de VANTs em mãos, a Star Aviation está pronta para estabelecer uma divisão dedicada a drones. Engenheiros argelinos estudarão, adaptarão e, por fim, superarão o que lhes foi dado."
 ALG_domestic_uav_production: "Produção Nacional de VANTs"
 ALG_domestic_uav_production_desc: "A fase de engenharia reversa está concluída. As instalações da Star Aviation estão prontas para produzir VANTs de projeto argelino em larga escala. Não se trata mais de importações, trata-se de soberania."
 ALG_russian_missile_cooperation: "Cooperação de Mísseis com a Rússia"
 ALG_russian_missile_cooperation_desc: "A indústria de mísseis da Rússia está entre as mais avançadas do mundo. Uma parceria com Moscou acelerará significativamente nosso programa, ao custo de aprofundar nossa dependência da boa vontade russa."
 ALG_chinese_missile_cooperation: "Cooperação de Mísseis com a China"
 ALG_chinese_missile_cooperation_desc: "A China demonstrou disposição para compartilhar tecnologia de mísseis com Estados amigos. Um acordo com Pequim oferece acesso a sistemas modernos e fortalece nossa posição no emergente mundo multipolar."
 ALG_redmed_star_convergence: "Convergência RedMed-Star"
 ALG_redmed_star_convergence_desc: "Chegou a hora de unir a divisão de mísseis da RedMed às capacidades de VANTs da Star Aviation sob uma única estrutura de defesa integrada. A Argélia não importará mais sua segurança, irá fabricá-la."
 ALG_regional_defense_leader: "Líder de Defesa do Magrebe"
 ALG_regional_defense_leader_desc: "A indústria de defesa da Argélia agora não tem rival no Magrebe. Nossos VANTs patrulham o Saara, nossos mísseis dissuadem nossos rivais e nossa tecnologia é procurada por vizinhos que antes olhavam para a Europa. É isso que a soberania significa."
 ALG_uav_procurement_category: "Aquisição de VANTs"
 ALG_uav_procurement_category_desc: "A Star Aviation precisa de uma plataforma de referência para iniciar a engenharia reversa. Selecione um fornecedor estrangeiro de VANTs."
 ALG_drone_program_category: "Programa de Desenvolvimento de Drones"
 ALG_drone_program_category_desc: "A divisão de VANTs da Star Aviation está pronta para desenvolver o primeiro drone nacional da Argélia. Escolha uma direção de desenvolvimento."
 ALG_purchase_turkish_uavs: "Comprar VANTs Turcos"
 ALG_purchase_turkish_uavs_desc: "O Bayraktar TB2 provou seu valor em vários conflitos. Adquiri-lo da Turquia fornecerá experiência operacional com VANTs e uma plataforma sólida para engenharia reversa, ao custo de nos aproximarmos de Ancara."
 ALG_purchase_chinese_uavs: "Comprar VANTs Chineses"
 ALG_purchase_chinese_uavs_desc: "O Wing Loong II da China oferece capacidades comparáveis às dos sistemas ocidentais por uma fração do preço. Pequim também demonstrou disposição para incluir cláusulas de transferência de tecnologia em tais acordos."
 ALG_purchase_iranian_uavs: "Comprar VANTs Iranianos"
 ALG_purchase_iranian_uavs_desc: "O Mohajer-6 do Irã é econômico e testado em combate. Adquiri-lo de Teerã é a opção mais barata e aprofunda os laços com um parceiro estratégico natural, embora possa atrair o escrutínio internacional."
 ALG_develop_amel_recon_uav: "Desenvolver o VANT Amel"
 ALG_develop_amel_recon_uav_desc: "O Amel será o primeiro VANT de reconhecimento projetado nacionalmente pela Argélia, uma plataforma de alta autonomia otimizada para vigilância de fronteiras e coleta de inteligência em todo o vasto sul saariano."
 ALG_develop_el_djazair_ucav: "Desenvolver o UCAV El-Djazair"
 ALG_develop_el_djazair_ucav_desc: "O El-Djazair será um verdadeiro drone de combate, um UCAV armado capaz de ataques de precisão. Mais caro e tecnicamente exigente que uma plataforma de reconhecimento, mas um ativo militar muito mais potente."
 ALG_develop_swarm_loitering: "Desenvolver Munições Vagantes em Enxame"
 ALG_develop_swarm_loitering_desc: "Em vez de um único drone grande, a Argélia investirá em enxames de munições vagantes pequenas, baratas e coordenadas. Mais difíceis de interceptar, devastadoras em quantidade e mais baratas de produzir em larga escala."
 ALG_redmed_group_tt: "§GO Grupo RedMed se expande além da logística de petróleo e gás para capacidades industriais mais amplas.§!"
 ALG_star_aviation_founded_tt: "§GA excelência operacional da Star Aviation a posiciona para contratos militares.§!"
 ALG_military_contract_tt: "§GA Star Aviation garantiu contratos militares. As decisões de aquisição de VANTs agora estão disponíveis.§!"
 ALG_uav_division_tt: "§GUma divisão dedicada a VANTs foi estabelecida. As decisões de desenvolvimento de drones agora estão disponíveis.§!"
 ALG_domestic_production_tt: "§GA Argélia agora pode fabricar VANTs internamente.§!"
 ALG_amel_developed_tt: "§GO VANT de reconhecimento Amel foi desenvolvido com sucesso.§!"
 ALG_ucav_developed_tt: "§GO VANT de combate El-Djazair agora está operacional.§!"
 ALG_swarm_developed_tt: "§GA Argélia desenvolveu uma capacidade de munições vagantes em enxame.§!"
 ALG_missile_division_tt: "§GO Grupo RedMed estabeleceu uma divisão dedicada ao desenvolvimento de mísseis.§!"
 ALG_redmed_leader_tt: "§GO Grupo RedMed e a Star Aviation se fundiram em um complexo industrial de defesa unificado.§!"
 ALG_defense_leader_tt: "§GA Argélia é reconhecida como a principal nação em tecnologia de defesa do Magrebe.§!"
 ALG_redmed_group_logistics: "Logística do Grupo RedMed"
 ALG_redmed_group_logistics_desc: "O Grupo RedMed fornece serviços logísticos abrangentes ao setor de petróleo e gás da Argélia."
 ALG_redmed_star_aviation: "Operações da Star Aviation"
 ALG_redmed_star_aviation_desc: "A Star Aviation mantém um histórico de segurança perfeito. Sua precisão operacional está sendo redirecionada para o desenvolvimento aeroespacial."
 ALG_star_aviation_military: "Contratos Militares da Star Aviation"
 ALG_star_aviation_military_desc: "A Star Aviation garantiu contratos militares, trazendo sua excelência operacional civil para o setor de defesa."
 ALG_star_aviation_uav_division_idea: "Divisão de VANTs da Star Aviation"
 ALG_star_aviation_uav_division_idea_desc: "Uma divisão dedicada a drones está estudando plataformas estrangeiras de VANTs para desenvolver as capacidades próprias da Argélia."
 ALG_star_aviation_uav_production: "Fabricação de VANTs da Star Aviation"
 ALG_star_aviation_uav_production_desc: "A Star Aviation agora fabrica VANTs de projeto argelino em larga escala."
 ALG_redmed_integrated_defense_systems: "Defesa Integrada RedMed"
 ALG_redmed_integrated_defense_systems_desc: "O Grupo RedMed fundiu seus programas de VANTs e mísseis em um complexo unificado de armamentos avançados."
 ALG_maghreb_defense_powerhouse: "Potência de Defesa do Magrebe"
 ALG_maghreb_defense_powerhouse_desc: "A indústria de defesa da Argélia, liderada pelo Grupo RedMed e pela Star Aviation, é a mais avançada do Norte da África."
 ALG_aerospace_training_program: "Programa de Treinamento Aeroespacial"
 ALG_aerospace_training_program_desc: "Um programa nacional que forma engenheiros aeroespaciais e técnicos de drones para sustentar a crescente indústria de defesa da Argélia."
 ALG_combat_uav_program: "Programa de VANTs de Combate"
 ALG_combat_uav_program_desc: "O desenvolvimento ativo de VANTs armados está aumentando a capacidade de ataque da Força Aérea Argelina."
 ALG_redmed_missile_division_idea: "Divisão de Mísseis da RedMed"
 ALG_redmed_missile_division_idea_desc: "O braço dedicado ao desenvolvimento de mísseis do Grupo RedMed está construindo o dissuasor estratégico da Argélia do zero."
 ALG_cruise_missile_development: "Desenvolvimento de Mísseis de Cruzeiro"
 ALG_cruise_missile_development_desc: "Um programa ativo de mísseis de cruzeiro está dando à Argélia, pela primeira vez, capacidade de ataque de precisão de longo alcance."
 ALG_precision_strike_capability: "Capacidade de Ataque de Precisão"
 ALG_precision_strike_capability_desc: "Sistemas integrados de mísseis e VANTs deram à Argélia uma genuína capacidade de ataque de precisão."
 ALG_defense_export_industry: "Indústria de Exportação de Defesa"
 ALG_defense_export_industry_desc: "VANTs e mísseis argelinos agora estão disponíveis para exportação. Cada venda é ao mesmo tempo receita e influência diplomática."
 ALG_redmed_group_concern: "Grupo RedMed"
 ALG_redmed_group_concern_desc: "Um importante conglomerado industrial argelino com raízes na logística de petróleo e gás. O Grupo RedMed cresceu até se tornar o principal fabricante de defesa da Argélia, produzindo VANTs e sistemas de mísseis para as forças armadas."
 ALG_star_aviation_concern: "Star Aviation"
 ALG_star_aviation_concern_desc: "A subsidiária de aviação do Grupo RedMed. Fundada em 2001 com um histórico de segurança perfeito, a Star Aviation agora lidera os programas nacionais de fabricação aeroespacial e de drones da Argélia."
 ALG_arrest_opponents_started_tt: "As forças de segurança estão iniciando operações de prisão..."
 ALG_surveillance_started_tt: "A expansão da rede de vigilância está em andamento..."
 ALG_ban_parties_started_tt: "Os procedimentos legais para banir os partidos de oposição foram iniciados..."
 ALG_imf_loan_started_tt: "As negociações do empréstimo do FMI estão em andamento..."
 ALG_oil_licensing_started_tt: "As negociações de licenciamento de petróleo com empresas estrangeiras foram iniciadas..."
 ALG_repay_imf_started_tt: "O processo de pagamento do empréstimo do FMI começou..."
 ALG_pardon_islamist_started_tt: "Os procedimentos de perdão para islamistas moderados foram iniciados..."
 ALG_dialogue_started_tt: "Sessões de diálogo nacional estão sendo organizadas..."
 ALG_reintegrate_fighters_started_tt: "Programas de reintegração de ex-combatentes estão começando..."
 ALG_arrest_opponents_complete_tt: "As operações de prisão foram concluídas. A oposição foi enfraquecida."
 ALG_surveillance_complete_tt: "A rede de vigilância agora está totalmente operacional."
 ALG_ban_parties_complete_tt: "Os partidos de oposição foram oficialmente banidos."
 ALG_imf_loan_complete_tt: "Os fundos do empréstimo do FMI foram recebidos."
 ALG_oil_licensing_complete_tt: "Os acordos de licenciamento de petróleo agora estão em vigor."
 ALG_repay_imf_complete_tt: "O empréstimo do FMI foi totalmente pago."
 ALG_pardon_islamist_complete_tt: "Os perdões foram concedidos. A reconciliação política avança."
 ALG_dialogue_complete_tt: "O diálogo nacional foi concluído com sucesso."
 ALG_reintegrate_fighters_complete_tt: "Os ex-combatentes foram reintegrados com sucesso."
 ALG_fis_return_threat: "Retorno da Frente Islâmica de Salvação na Argélia"
 ALG_fis_return_western_concern: "Alarmado com o Governo Salafista na Argélia"
 ALG_fis_return_salafi_solidarity: "Apoia o Governo Salafista na Argélia"
 ALG_fis_return_islamist_sympathy: "Recebe com Cautela o Governo Islamista na Argélia"
 ALG_fis_return_neighbor_alarm: "Alarmado com a Tomada de Poder Islamista na Argélia"
 ALG_fis_return_anti_political_islam: "Opõe-se ao Islã Político na Argélia"
 ALG_world_tension_security_ended_tt: "As medidas de segurança foram suspensas."
 ALG_world_tension_high_security_ended_tt: "O alerta de segurança máxima terminou."
 ALG_crackdown_momentum_ended_tt: "O ímpeto da repressão diminuiu."
 ALG_reconciliation_momentum_ended_tt: "O ímpeto da reconciliação desapareceu."
 ALG_by_the_people_for_the_people: "Pelo Povo, Para o Povo"
 ALG_by_the_people_for_the_people_desc: "O movimento Hirak abalou a Argélia até as suas raízes. O povo exige uma transformação completa do sistema político, não apenas uma troca de rostos, mas uma reestruturação fundamental do poder. A velha guarda não sairá em silêncio."
 ALG_by_the_people_for_the_people_tt: "O §Ymovimento Hirak§! deve ter ímpeto suficiente (equilíbrio de poder acima de §G70%§!)."
 ALG_break_the_oligarchs: "Quebrar os Oligarcas"
 ALG_break_the_oligarchs_desc: "A rede de empresários que lucrou com a proximidade do regime deve ser desmantelada. Seus bens serão confiscados, seus contratos revisados e sua influência sobre o Estado encerrada para sempre."
 ALG_dismantle_le_pouvoir: "Desmantelar Le Pouvoir"
 ALG_dismantle_le_pouvoir_desc: "O Estado paralelo, os generais, os serviços de inteligência, a mão invisível que guia a Argélia desde a independência, devem ser trazidos à luz e despojados de sua autoridade."
 ALG_new_economic_model: "Um Novo Modelo Econômico"
 ALG_new_economic_model_desc: "Com os oligarcas removidos, a Argélia precisa de uma nova visão econômica. O modelo de Estado rentista está morto. Em seu lugar, uma economia diversificada construída sobre indústria, tecnologia e capital humano."
 ALG_unleash_civil_society: "Libertar a Sociedade Civil"
 ALG_unleash_civil_society_desc: "Uma imprensa livre, sindicatos independentes e partidos políticos que representam eleitorados reais, esses são os alicerces sobre os quais a democracia é construída."
 ALG_constitutional_convention: "Convenção Constitucional"
 ALG_constitutional_convention_desc: "Representantes de toda a Argélia se reúnem para redigir uma nova constituição. Pela primeira vez, o documento será escrito pelo povo, e não imposto pelos poderosos."
 ALG_presidential_republic: "República Presidencialista"
 ALG_presidential_republic_desc: "A Argélia adotará um sistema presidencialista com um Executivo forte, autoridade clara e responsabilização democrática. O presidente governa com decisão, enquanto salvaguardas constitucionais impedem o abuso de poder."
 ALG_parliamentary_republic: "República Parlamentarista"
 ALG_parliamentary_republic_desc: "A Argélia adotará um sistema parlamentarista em que o poder é compartilhado entre representantes eleitos. A formação de coalizões e o consenso garantem que nenhum indivíduo possa dominar o Estado novamente."
 ALG_civilian_military_control: "Controle Civil sobre os Militares"
 ALG_civilian_military_control_desc: "Os militares devem servir ao Estado, não governá-lo. Oficiais profissionais substituem generais políticos. O exército é modernizado, despolitizado e colocado firmemente sob autoridade civil."
 ALG_democratic_dividend: "O Dividendo Democrático"
 ALG_democratic_dividend_desc: "Uma Argélia transparente e democrática atrai investimento estrangeiro, parcerias internacionais e o retorno da diáspora. A economia se diversifica além dos hidrocarbonetos à medida que o mundo toma nota."
 ALG_a_new_algeria: "Uma Nova Argélia"
 ALG_a_new_algeria_desc: "Das cinzas do antigo regime, surge uma nova nação. As redes de corrupção são desmanteladas. A fuga de cérebros se inverte. A Argélia se destaca como prova de que a verdadeira democracia pode ser construída pela vontade de seu próprio povo."
 ALG_transitional_instability: "Instabilidade Transitória"
 ALG_transitional_instability_desc: "O colapso da velha ordem deixou um vácuo de poder. As instituições são fracas, a economia está desorganizada e forças políticas competem para moldar o futuro."
 ALG_economic_disruption: "Perturbação Econômica"
 ALG_economic_disruption_desc: "O confisco dos bens dos oligarcas e a reestruturação de contratos corruptos perturbaram temporariamente a atividade econômica."
 ALG_free_press_and_assembly: "Imprensa e Reunião Livres"
 ALG_free_press_and_assembly_desc: "Jornais independentes publicam sem medo. Os cidadãos se organizam livremente. A praça pública pertence ao povo."
 ALG_diversified_economy: "Economia Diversificada"
 ALG_diversified_economy_desc: "A economia da Argélia vai além da dependência do petróleo rumo à indústria, à tecnologia e ao desenvolvimento sustentável."
 ALG_new_constitution_permanent: "A Constituição do Povo"
 ALG_new_constitution_permanent_desc: "Escrita por delegados eleitos e ratificada por referendo popular, a nova constituição da Argélia consagra os direitos democráticos, a separação de poderes e o Estado de direito."
 ALG_presidential_system: "Sistema Presidencialista"
 ALG_presidential_system_desc: "Um Executivo forte, com autoridade clara e responsabilização democrática, governa a Argélia com decisão."
 ALG_parliamentary_system: "Sistema Parlamentarista"
 ALG_parliamentary_system_desc: "Um sistema deliberativo em que representantes eleitos debatem, negociam e constroem consenso. O poder é compartilhado entre partidos e coalizões."
 ALG_professional_military: "Forças Armadas Profissionais"
 ALG_professional_military_desc: "Despolitizados, modernizados e sob comando civil. Os militares argelinos servem à nação em vez de controlá-la."
 ALG_foreign_investment_boom: "Boom de Investimento Estrangeiro"
 ALG_foreign_investment_boom_desc: "O capital internacional flui para a Argélia democrática. Governança transparente e Estado de direito tornam o país um destino atraente para investimentos."
 ALG_beacon_of_democracy: "Farol da Democracia"
 ALG_beacon_of_democracy_desc: "A Argélia é a prova viva de que uma genuína transformação democrática é possível. A nação inspira movimentos em toda a região e atrai a admiração global."
 ALG_the_nation_stands_at_a_crossroads_desc: "A Argélia emerge marcada da Década Negra. Mais de 200.000 mortos, aldeias inteiras arrasadas e uma economia destruída pela guerra civil. O presidente Bouteflika apostou seu mandato na Concórdia Civil, oferecendo anistia aos militantes e prometendo reformas. Mas por trás dele está le Pouvoir, a rede obscura de generais e oficiais de inteligência que governa a Argélia desde a independência. O caminho adiante pertence a quem controlar o que vem a seguir."
 ALG_counterterrorism_agency_desc: "O Département du Renseignement et de la Sécurité (DRS) foi reconstruído a partir dos remanescentes do antigo serviço de inteligência militar Sécurité Militaire (SM) após a Guerra Civil. Operando com autonomia quase total em relação à supervisão civil, o DRS tornou-se a instituição mais poderosa da Argélia, mais temida que a própria presidência."
 ALG_investments_in_iraq: "Amizade com o Iraque"
 ALG_investments_in_iraq_desc: "Apesar de o Iraque ter tido laços menos que ideais conosco no passado, é melhor nos aproximarmos. Podemos investir na infraestrutura iraquiana e ganhar sua confiança."
 ALG_diplo: "Diplomacia do MSP"
 ALG_diplo_desc: "Devemos reformar nossa diplomacia de acordo com nosso novo governo."
 ALG_balance_islamists_and_secularists: "Equilibrar Islamistas e Secularistas"
 ALG_balance_islamists_and_secularists_desc: "Um equilíbrio frágil deve ser mantido entre os movimentos religiosos e as elites seculares; o fracasso arrisca um novo conflito."
 ALG_new_constutition_reforms: "Reformas Constitucionais"
 ALG_new_constutition_reforms_desc: "As demandas por reformas não podem ser ignoradas para sempre. Uma nova constituição pode abrir caminho para uma governança mais pluralista."
 ALG_denounce_previous_colonialist_regimes: "Denunciar a Lei Francesa sobre o Colonialismo"
 ALG_denounce_previous_colonialist_regimes_desc: "A polêmica lei da França que glorifica seu passado colonial provocou indignação. A FLN deve liderar a denúncia dos crimes colonialistas e reafirmar a luta anticolonial da Argélia."
 ALG_share_power: "Compartilhar o Poder"
 ALG_share_power_desc: "Em vez de governar sozinha, a FLN pode compartilhar o poder com cautela com forças selecionadas da oposição e tecnocratas. Isso pode preservar a estabilidade e reduzir a ira popular contra o regime."
 ALG_legacy_revolution: "FLN"
 ALG_legacy_revolution_desc: "A Front de libération nationale (Frente de Libertação Nacional) é um partido nacionalista argelino. Foi o único partido legal até 1989, quando governou a Argélia como um Estado de partido único. Após a Guerra Civil Argelina, retomou o poder em 2002 como o partido mais popular e assim permanece desde então. Sua ideologia segue uma mentalidade nacionalista pan-arabista, tendo o anticolonialismo como valor central original. Apoia o socialismo, mas particularmente o socialismo árabe, pois se opõe às ideias marxistas."
 ALG_devlop_industry: "Desenvolver a Indústria Nacional"
 ALG_devlop_industry_desc: "O futuro da Argélia depende do fortalecimento de sua base industrial. Ao nos concentrarmos no desenvolvimento de setores-chave como manufatura, produção de energia e tecnologia, podemos reduzir a dependência de importações estrangeiras e construir uma economia autossuficiente."
 ALG_expand_hydro: "Expandir a Infraestrutura Hidrelétrica"
 ALG_expand_hydro_desc: "Para atender à crescente demanda energética de nossa nação e reduzir a dependência de recursos estrangeiros, devemos investir na expansão da energia hidrelétrica. Aproveitar nossos rios não só fornecerá energia limpa, como também fortalecerá nossa base industrial e melhorará a vida de nossos cidadãos."
 ALG_optimize_water_management: "Otimizar a Gestão da Água"
 ALG_optimize_water_management_desc: "Para combater a escassez de água e melhorar a produção agrícola, devemos implementar sistemas modernos de gestão hídrica. Uma distribuição e conservação eficientes apoiarão tanto as comunidades rurais quanto os centros urbanos em crescimento, tornando nossa terra mais resiliente à seca."
 ALG_hydroelectric_authority: "Autoridade Hidrelétrica Nacional"
 ALG_hydroelectric_authority_desc: "Ao estabelecer uma autoridade hidrelétrica centralizada, podemos desenvolver sistematicamente os recursos hídricos inexplorados da Argélia. Isso fornecerá eletricidade confiável para a industrialização, além de criar empregos e conhecimento técnico nos setores de energia renovável."
 ALG_electrify_rural_algeria: "Eletrificar a Argélia Rural"
 ALG_electrify_rural_algeria_desc: "Levar eletricidade ao campo argelino é essencial para o desenvolvimento moderno. Por meio da expansão da rede e de projetos hidrelétricos locais, podemos melhorar o padrão de vida, viabilizar a agricultura mecanizada e conectar comunidades remotas ao progresso nacional."
 ALG_foreign_investment: "Atrair Investimento Estrangeiro"
 ALG_foreign_investment_desc: "Para acelerar nosso desenvolvimento econômico, devemos criar condições favoráveis ao capital internacional. Parcerias estratégicas em projetos de infraestrutura e energia trarão tanto financiamento quanto conhecimento técnico, mantendo a soberania nacional."
 ALG_algeria_islamic: "MSP"
 ALG_algeria_islamic_desc: "O Mouvement de la société pour la paix (Movimento da Sociedade pela Paz) é um partido político argelino de direita a extrema-direita. Foi fundado em 1990 pela Irmandade Muçulmana, à qual permanece alinhado. É islamista sunita e segue uma democracia islâmica e conservadora. Teve seu maior sucesso nas eleições legislativas de 1997, sendo o segundo maior partido e obtendo 69 das 380 cadeiras. Também concorreu uma vez nas eleições presidenciais de 1995, obtendo 25,6% dos votos. Entrou em uma coalizão eleitoral com o MRN e o MRI em 2012. O partido também é conhecido como \"Hamas\", abreviação de seu nome árabe \"Harakat mujtama' as-silm\"."
 ALG_algerian_islamic_movement: "Movimento Islâmico Argelino"
 ALG_algerian_islamic_movement_desc: "O movimento islâmico, em resumo, foi um movimento islamista na Turquia muito popular entre os estudantes, que defendia uma visão pacifista e moderna do Islã. Nos inspiraremos em seus ensinamentos e reformaremos nossos currículos escolares para promover valores islâmicos e ensiná-los aos estudantes, além de melhorar a educação como um todo."
 ALG_nationwide_security_presence_desc: "As forças de segurança são mobilizadas em todo o país sob a Operação Falcão do Deserto para desencorajar as manifestações do Hirak. Embora eficaz em dissuadir protestos, essa medida aumenta os custos e mina a confiança pública."
 algerian_events.300.t: "Agitação Crescente"
 algerian_events.300.d: "Chegam relatos de protestos esporádicos e desobediência civil de todo o país. A frustração do público com a corrupção, o desemprego e a falta de reformas políticas está chegando ao limite. Por enquanto, as manifestações continuam dispersas, mas podem facilmente se transformar em algo muito maior."
 algerian_events.300.a: "Vai passar."
 algerian_events.300.b: "Isso pode sair do controle."
 algerian_events.230.t: "Protestos em Massa Varrem a Argélia"
 algerian_events.230.d: "A Argélia foi abalada por protestos massivos e prolongados que exigem reformas políticas e o fim do establishment governante. Centenas de milhares de pessoas foram às ruas em cidades de todo o país no que vem sendo chamado de um novo movimento Hirak. A comunidade internacional acompanha de perto a evolução da situação."
 algerian_events.230.a: "Um momento decisivo para a Argélia."
 ALG_deepen_african_union: "Aprofundar a Cooperação com a União Africana"
 ALG_deepen_african_union_desc: "A Argélia tem sido há muito tempo um dos pilares da diplomacia africana. Ao fortalecer ativamente nosso papel na União Africana, podemos aumentar nossa influência no continente, fomentar a solidariedade e impulsionar iniciativas de paz e integração econômica. Embora isso nos custe financeiramente, reforçará nossa legitimidade na África."
 ALG_strengthen_maghreb_union: "Fortalecer a União do Magrebe"
 ALG_strengthen_maghreb_union_desc: "O sonho da integração regional no Norte da África tem permanecido inalcançável, mas a Argélia tem o potencial de revivê-lo. Ao fomentar a cooperação com nossos vizinhos do Magrebe, podemos reduzir as barreiras comerciais, melhorar a confiança diplomática e reforçar nossos laços culturais e históricos compartilhados."
 ALG_restoration_of_the_ummah: "Restauração da Umma"
 ALG_restoration_of_the_ummah_desc: "A visão de um mundo islâmico unido está ao alcance. Os fiéis se levantarão mais uma vez sob uma única bandeira."
 ALG_guidance_council: "O Conselho de Orientação"
 ALG_guidance_council_desc: "Um conselho de estudiosos seniores supervisionará nossas políticas e garantirá que o governo permaneça fiel à orientação divina."
 ALG_restore_the_ummah_experiment: "O Experimento da Umma"
 ALG_restore_the_ummah_experiment_desc: "Tentaremos criar um novo modelo de governança, combinando fé, lei e liderança para inspirar o mundo muçulmano."
 ALG_victory_of_the_faithful: "Vitória dos Fiéis"
 ALG_victory_of_the_faithful_desc: "Nossa perseverança e devoção trouxeram a vitória. A Argélia se erguerá agora como o baluarte dos fiéis em todo o mundo."
 ALG_exterminate_corruption: "Exterminar a Corrupção"
 ALG_exterminate_corruption_desc: "Expurgaremos a corrupção de todas as instituições. Nenhum funcionário, nenhum soldado e nenhum clérigo estará acima da justiça divina."
 ALG_to_serve_allah: "Servir a Alá"
 ALG_to_serve_allah_desc: "Nosso governo não é por ambição mundana, mas somente por Alá. Cada política, cada reforma e cada luta deve refletir a submissão à Sua vontade divina. Servir a Alá é purificar tanto a nação quanto a alma."
 ALG_economic_islamization: "Islamização Econômica"
 ALG_economic_islamization_desc: "Reconstruiremos nossa economia sobre fundamentos islâmicos. Os sistemas baseados em juros e a corrupção serão substituídos por finanças compatíveis com a Sharia, ética comercial e distribuição justa da riqueza."
 ALG_rust_belt_rejuvenation_desc: "As fábricas abandonadas durante os anos de turbulência voltarão a rugir. Nossos trabalhadores, guiados pela fé e pelo propósito, reconstruirão os centros industriais da Argélia."
 ALG_rule_to_perfection_desc: "Nossa governança deve ser refinada e aperfeiçoada. O Califado da mente, o Estado da alma, a perfeição na administração por meio da disciplina divina."
 ALG_new_islamic_architecture_desc: "Uma nova era exige um novo rosto para a nossa nação. Por meio de mesquitas, escolas e edifícios cívicos, a beleza da arte islâmica simbolizará o renascimento da Argélia."
 ALG_prioritize_military_industries_desc: "Um exército fiel deve ser armado por uma indústria fiel. Priorizaremos a produção militar, garantindo que nossa defesa se apoie na força nacional."
 ALG_industrialize_the_umma_desc: "A indústria servirá ao Islã, não à ganância. A Umma deve se tornar autossuficiente, produtiva e orgulhosa, uma civilização movida tanto por aço quanto por fé."
 ALG_militarize_the_nation: "Militarizar a Nação"
 ALG_militarize_the_nation_desc: "Todo crente deve estar pronto para defender a Umma. Prepararemos nossa sociedade para a mobilização total sob comando divino."
 ALG_soldiers_of_faith: "Soldados da Fé"
 ALG_soldiers_of_faith_desc: "Nossos soldados não lutam por terra ou poder, mas pela própria fé. O Exército da Fé será o escudo do Islã e a espada da nação."
 ALG_forged_in_belief: "Forjados na Crença"
 ALG_forged_in_belief_desc: "A fé é o nosso aço, inquebrável, inflexível. Os soldados da Argélia são forjados na crença e guiados por convicção divina."
 ALG_disciplined_army_of_god: "Exército Disciplinado de Deus"
 ALG_disciplined_army_of_god_desc: "Forjaremos um exército construído sobre obediência, pureza e devoção inabalável. Cada soldado é ao mesmo tempo guerreiro e servo de Deus."
 ALG_made_of_steel_and_faith: "Feitos de Aço e Fé"
 ALG_made_of_steel_and_faith_desc: "Nossas legiões marcharão com a força do ferro e a fé dos profetas. Disciplina e crença se fundirão em uma força inquebrável."
 ALG_unrestricted_research: "Pesquisa Irrestrita"
 ALG_unrestricted_research_desc: "A ciência não é inimiga da fé. Guiados por um propósito divino, abraçaremos a pesquisa moderna para avançar nossas capacidades militares e tecnológicas."
 ALG_ai_military_integration: "Integração Militar de IA"
 ALG_ai_military_integration_desc: "A inteligência artificial e a automação se tornarão ferramentas a serviço da ordem divina. Integraremos esses sistemas à nossa estrutura de defesa para aumentar a precisão e o controle."
 ALG_new_executors_continent: "Novos Executores do Continente"
 ALG_new_executors_continent_desc: "A Argélia está pronta para impor a justiça divina em toda a África. Nossa fé e nosso aço moldarão o destino do continente."
 ALG_the_future_in_the_present: "O Futuro no Presente"
 ALG_the_future_in_the_present_desc: "O futuro já está sobre nós, guiado pela sabedoria de Alá e fortalecido pela inovação humana. Nossa nação conduzirá os fiéis a uma nova era."
 ALG_destroy_their_will: "Destruir Sua Vontade"
 ALG_destroy_their_will_desc: "Esmagaremos todos os que se opõem à fé, na mente, na vontade e no corpo. A resistência será quebrada, e a ordem divina prevalecerá."
 ALG_declare_jihad: "Proclamar a Jihad"
 ALG_declare_jihad_desc: "Nosso movimento amadureceu. Não nos restringiremos mais a sermões e reformas. Chegou a hora de unir os fiéis em armas, de declarar uma Jihad contra a corrupção e a tirania em todas as terras do Islã."
 ALG_tharir_al_aqsa: "Tahrir al-Aqsa"
 ALG_tharir_al_aqsa_desc: "A libertação de Al-Aqsa é o dever eterno da Umma. Reuniremos os fiéis em todo o Oriente Médio, forjando uma aliança sagrada sob uma só bandeira de resistência e unidade."
 ALG_faction_with_middle_east: "Unir-se à Frente do Oriente Médio"
 ALG_faction_with_middle_east_desc: "O Oriente Médio continua sendo o coração espiritual do Islã. De Damasco a Meca, nosso chamado ecoará, unindo as nações sunitas que anseiam defender Al-Aqsa e resistir aos opressores."
 ALG_faction_with_north_africa: "Unir-se à Frente do Norte da África"
 ALG_faction_with_north_africa_desc: "Nossos irmãos no Norte da África, dos desertos da Líbia às ruas do Cairo, suportaram as mesmas lutas. É hora de estender a mão e convidá-los à nossa causa."
 ALG_faction_with_asia: "Unir-se à Frente Oriental"
 ALG_faction_with_asia_desc: "A luz do Islã brilha além da Arábia. Os povos da Ásia Central e do Sul devem ser chamados a se juntar à ascensão da Umma, das estepes às ilhas do Oriente."
 ALG_faction.1.t: "Um Convite de Argel"
 ALG_faction.1.d: "Um comunicado diplomático de Argel chegou ao nosso governo. A Frente Islâmica de Salvação, agora no poder na Argélia, convida as nações do Oriente Médio a se juntarem a uma nova coalizão, a Frente de Libertação de Al-Aqsa, dedicada a coordenar o apoio político e material à defesa e libertação de Al-Aqsa. Aceitar nos vincularia a uma causa regional; recusar nos manteria afastados do projeto da Argélia. Como devemos responder?"
 ALG_faction.1.a: "Aceitar, ingressar na Frente de Libertação de Al-Aqsa"
 ALG_faction.1.b: "Recusar, não nos juntaremos a esta coalizão regional"
 ALG_faction.2.t: "Uma Proposta do Magrebe"
 ALG_faction.2.d: "Delegações da Argélia convidaram formalmente os governos do Norte da África a se comprometerem com a cooperação em uma nova coalizão, a Frente de Libertação de Al-Aqsa. A proposta busca uma frente magrebina para coordenar a pressão política e o apoio humanitário à Palestina. Aderir aprofundaria os laços com Argel; recusar preservaria nossa autonomia atual. Como responderemos?"
 ALG_faction.2.a: "Sim, o Magrebe estará unido"
 ALG_faction.2.b: "Não, este não é um caminho que seguiremos"
 ALG_faction.3.t: "Um Chamado de Argel ao Oriente"
 ALG_faction.3.d: "Enviados argelinos procuraram nações muçulmanas da Ásia com uma oferta: juntar-se à Frente de Libertação de Al-Aqsa, uma coalizão voltada a coordenar esforços diplomáticos, políticos e materiais para a defesa de Al-Aqsa. A iniciativa pede solidariedade entre regiões; também corre o risco de nos envolver em conflitos mais amplos. Vamos aderir à coalizão de Argel?"
 ALG_faction.3.a: "Aderir, atendemos ao chamado da solidariedade"
 ALG_faction.3.b: "Recusar, devemos evitar esse envolvimento"
 ALG_islamic_offices: "Estabelecer Escritórios Islâmicos"
 ALG_islamic_offices_desc: "Para governar segundo os princípios do Islã, nosso movimento deve construir uma estrutura organizada capaz de administrar tanto a fé quanto o Estado. Estabelecendo Escritórios Islâmicos em todo o país, supervisionaremos a educação religiosa, os assuntos sociais e a orientação moral, garantindo que a governança esteja alinhada aos valores da Umma. Esses escritórios serão a espinha dorsal de nossa nova ordem, unindo o povo sob a fé, a disciplina e a justiça."
 ALG_integrate_kabylie_tt: "§GIntegrar a Cabília pacificamente§!"
 ALG_improve_relations_with_egypt: "Melhorar as Relações com o Egito"
 ALG_improve_relations_with_egypt_desc: "O Egito e a Argélia compartilham laços profundos como nações árabes de peso. O MSP, com raízes na tradição da Irmandade Muçulmana, vê o Cairo como um parceiro natural. Fortalecer as relações com o Egito aumentará nossa posição no mundo árabe e abrirá portas para a cooperação econômica e religiosa."
 ALG_el_karaouin_uni: "A Universidade Al-Qarawiyyin"
 ALG_el_karaouin_uni_desc: "Ao estabelecer laços com uma das universidades islâmicas mais antigas do mundo, a FIS cultivará uma geração de estudiosos leais à nova ordem, afastando os militares da autoridade religiosa."
 ALG_father_of_the_ummah: "Pai da Umma"
 ALG_father_of_the_ummah_desc: "O líder da Frente Islâmica de Salvação se posicionará como pai espiritual de toda a comunidade muçulmana, cultivando um culto à personalidade enraizado na piedade e no mandato divino."
 ALG_followers_of_the_prophet: "Seguidores do Profeta"
 ALG_followers_of_the_prophet_desc: "O Estado será remodelado em torno da estrita observância da Sunna. Espera-se que os cidadãos vivam como o Profeta, e as instituições governamentais serão reestruturadas para refletir essa visão."
 ALG_governmental_cleansing: "Expurgo Governamental"
 ALG_governmental_cleansing_desc: "Aqueles dentro do aparato estatal considerados insuficientemente devotos ou ideologicamente impuros serão sistematicamente removidos e substituídos por adeptos leais ao movimento."
 ALG_make_our_nation_pure: "Purificar Nossa Nação"
 ALG_make_our_nation_pure_desc: "A FIS lançará uma ampla campanha social para expurgar a influência ocidental da sociedade argelina, impondo valores islâmicos na educação, nas vestimentas e no comportamento público."
 ALG_new_patriotism: "Um Novo Patriotismo"
 ALG_new_patriotism_desc: "O amor pela Argélia e o amor pelo Islã são uma coisa só. A FIS forjará uma nova identidade nacional em que a fé é a base do orgulho cívico e do propósito coletivo."
 ALG_restore_the_soul_of_the_ummah: "Restaurar a Alma da Umma"
 ALG_restore_the_soul_of_the_ummah_desc: "A Argélia assumirá o dever sagrado de reacender a chama espiritual do mundo muçulmano, posicionando o Estado como a bússola moral de todas as nações islâmicas."
 ALG_sharia_through_discipline: "Sharia pela Disciplina"
 ALG_sharia_through_discipline_desc: "A lei sharia será aplicada não pela persuasão, mas pela disciplina firme. O Estado ampliará seus poderes de policiamento e punição para garantir o pleno cumprimento da lei islâmica."
 ALG_strength_and_virtue: "Força e Virtude"
 ALG_strength_and_virtue_desc: "Um Estado forte e um povo virtuoso são inseparáveis. A FIS investirá tanto na educação moral quanto na disciplina institucional para construir uma sociedade íntegra de caráter e firme na determinação."
 ALG_strict_authority: "Autoridade Rigorosa"
 ALG_strict_authority_desc: "A nova Argélia exige mão firme. A FIS centralizará o poder e aumentará o orçamento policial, garantindo que a população siga os padrões de conduta do movimento."
 ALG_the_people_are_not_to_be_trusted: "Não Se Deve Confiar no Povo"
 ALG_the_people_are_not_to_be_trusted_desc: "A democracia provou ser uma porta de entrada para a corrupção e a impiedade. A FIS desmantelará o processo democrático e colocará o governo firmemente nas mãos daqueles que sabem o que Alá exige."
 ALG_urban_preachers: "Pregadores Urbanos"
 ALG_urban_preachers_desc: "A FIS enviará uma rede de pregadores às cidades da Argélia, difundindo a ideologia do movimento e consolidando o Islã estatal como força dominante na vida pública."
 ALG_jamiat_al_karaouin_desc: "Os laços com a antiga instituição Al-Qarawiyyin produziram uma nova classe de estudiosos islâmicos leais ao Estado da FIS e hostis à interferência militar em assuntos religiosos."
 ALG_coalition_economic_program: "Programa Econômico da Coalizão"
 ALG_coalition_economic_program_desc: "A coalizão presidencial deve apresentar uma visão econômica unificada. Coordenando as políticas econômicas dos parceiros da coalizão, podemos atrair investimentos, apoiar pequenos negócios e lançar as bases para um crescimento sustentável. Uma economia forte legitimará a coalizão e calará nossos críticos."
 ALG_governmental_transparency: "Transparência Governamental"
 ALG_governmental_transparency_desc: "Se nosso caminho democrático deve significar alguma coisa, precisamos nos submeter a um padrão mais elevado do que aqueles que vieram antes de nós. Implementando medidas de transparência e abrindo os registros do governo ao escrutínio público, podemos extirpar a corrupção e restaurar a fé do povo em suas instituições, mesmo que isso signifique fazer inimigos entre a velha guarda."
 ALG_support_mujahideen: "Apoiar os Mujahidin"
 ALG_support_mujahideen_desc: "Elementos dentro do Estado defendem o apoio encoberto a combatentes islamistas que atuam pela região. Embora tais ações possam fortalecer nossa influência entre redes radicais e desestabilizar atores hostis, elas correm o risco de uma forte reação internacional e de consequências internas de longo prazo."
