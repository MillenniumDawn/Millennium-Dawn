 auslink_in_nt: "노던 준주의 오스링크"
 auslink_in_nt_desc: "오스링크 체계는 과거 지방 도로의 신속한 보수와 개량을 가능하게 했습니다. 이 체계를 다시 활용하여 북부 지역 사회의 물류망을 신속히 개선하고, 교량과 중화물 노선, 농업 인프라를 건설할 수 있습니다."
 national_partnership_agreement_ast: "국가 파트너십 협약"
 national_partnership_agreement_ast_desc: "노던 준주와 서오스트레일리아의 원주민 공동체와 긴밀히 협력하여 수백 채의 새 주택을 지어 주민을 수용함으로써 심각한 과밀 문제를 해결할 수 있습니다. 이 계약은 주택 이익단체의 지지를 얻는 데도 도움이 되며, 지역 계약업체에게 일감도 제공합니다."
 foundation_for_regional_renewal_ast: "농촌 재생 지원금"
 foundation_for_regional_renewal_ast_desc: "연방 정부와 시드니 마이어 기금의 공동 파트너십을 맺어 지역 농업 자금 조달 수단을 만들 수 있습니다. 지원금은 소도시 사업체와 지방 의회에 지급되어 마을 회관, 농촌 수도 시설, 영농 프로젝트의 자금이 됩니다."
 grain_line_upgrades_ast: "곡물 철도선 개량"
 grain_line_upgrades_ast_desc: "뉴사우스웨일스 주와 빅토리아 주 정부가 지역 곡물 철도선의 대규모 구조 개량 설계도를 보내왔습니다. 거의 모든 지역 농민이 수확물을 항구로 운송하는 데 이 노선을 사용하며, 노선을 개량하면 생산량을 크게 늘리고 차량 운송 의존도를 낮출 수 있습니다. 그 결과 도로의 마모도 줄어듭니다."
 grain_lines_upgraded_ast: "지역 곡물 철도선 개량됨"
 peter_costello_desc: "오스트레일리아 정치사에서 피터 코스텔로만큼 경제 운영에 정통한 인물은 드물 것입니다. 법정 변호사 업무와 법률 자문을 오가다 자유당에 입당한 코스텔로는 경제의 급진적 재편을 주창했습니다. 결국 당내 경제 개혁파에 합류했고, 그곳에서 전 야당 대표 존 하워드를 만났습니다. \n\n1996년 선거 이후 하워드 정부의 부대표이자 재무장관으로서 코스텔로는 신속한 개혁을 감독했습니다. 그 결과 10년 넘게 처음으로 예산이 흑자를 기록했고, 두 사람은 함께 이전에는 '불가능'하다던 세제 개혁을 성공적으로 통과시켰습니다. \n\n두 사람의 관계가 틀어지기 시작한 때에도 코스텔로는 권력의 레버에서 멀리 벗어난 적이 없었습니다. 이제 나라에서 가장 큰 레버를 다루게 된 그에게 경제적 패권의 꿈은 현실에서 한 걸음밖에 떨어져 있지 않습니다."
