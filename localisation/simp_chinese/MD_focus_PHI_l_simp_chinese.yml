 PHI_edsa_dos_impeachment_atmosphere: "Impeachment Paralysis"
 PHI_edsa_dos_impeachment_atmosphere_desc: "The impeachment trial dominates every news broadcast. Political capital is bleeding away daily as the nation watches the administration fight for survival."
 PHI_edsa_dos_recovery_spirit: "Post-EDSA Stabilisation"
 PHI_edsa_dos_recovery_spirit_desc: "The new administration has assumed power under extraordinary circumstances. Reform promises are generating cautious public optimism, though deep political wounds remain."
 PHI.1.t: "The Juetengate Scandal Explodes"
 PHI.1.d: "A whistleblower has come forward accusing President Joseph Estrada and members of his inner circle of receiving millions in jueteng kickbacks. Public outrage is growing rapidly as media reports expose deeper layers of corruption within the administration. Opposition figures, church leaders, and civil society organizations have begun organizing demonstrations demanding accountability from the government. With tensions rising nationwide, the administration must now decide how it will respond to the growing unrest. Or face the end of the administration entirely."
 PHI.1.a: "This may spiral into something greater..."
 PHI.2.t: "End of the Line"
 PHI.2.d: "It began with a walkout. When the senate voted 11-10 to suppress key impeachment evidence, the entire prosecution team walked out of the courtroom. Within hours, hundreds of thousands of Filipinos had begun flooding EDSA Shrine in a mass demonstration recalling the original People Power Revolution of 1986. Within days, the Armed Forces of the Philippines and the Philippine National Police withdrew their support from the administration. Cabinet secretaries resigned en masse. Chief Justice Hilario Davide Jr. administered the oath of office to Vice President Gloria Macapagal-Arroyo. Joseph Estrada departed Malacañang Palace without formally resigning. A new chapter begins."
 PHI.2.a: "The people have spoken."
 PHI.3.t: "Inaguration of Gloria Macapagal Arroyo"
 PHI.3.d: "Just as after Joseph Estrada left his office as the president of the Philippines, Gloria Arroyo, The VP of Joseph Estrada of the £PHI_conservatism Lakas-CMD party has been sworn in as the 14th president of the Philippines. While some may say that Arroyo's ascension to the presidency was illegitimate, the people rejoice as another corrupt leader has been toppled with the blocks of revolution and protesting. Though the Arroyo administration will take time to recover, change might finally be in the air as Arroyo promises to mend the wounds of the former president that was toppled."
 PHI.3.a: "Change might be in the air."
 PHI.4.t: "The Second Envelope is Opened"
 PHI.4.d: "After days of political turmoil, the Senate has voted to open the controversial 'Second Envelope.' What was expected to become the defining moment of the impeachment trial instead brings a brief sigh of relief across the nation. With the evidence now entering the judicial process, the prosecutors abandon plans for a mass walkout, and calls for another People Power Revolution quickly lose momentum.\nPresident Joseph Estrada survives the day's political storm, but his administration remains deeply wounded. Allegations of corruption continue to dominate the headlines, financial markets remain uneasy, and both allies and opponents understand that the impeachment battle is far from over. The government has avoided collapse, yet its future now rests entirely on the outcome of the trial."
 PHI.4.a: "The Republic holds... for now"
 PHI.5.t: "The Mindanao Campaign Ends"
 PHI.5.d: "The last organised base commands of the Moro Islamic Liberation Front have been overrun. What remains of the Front is a handful of fugitive commanders without territory, revenue, or a chain of command capable of coordinating them. Southern Command has handed responsibility for the recovered municipalities back to civilian authorities, and the Armed Forces are drawing down to garrison strength.\n\nThe insurgency ends without a signature on any document. Whether the grievances that produced it have ended with it is another question entirely."
 PHI.5.a: "Mindanao is under our authority."
 PHI.6.t: "The Comprehensive Agreement on the Bangsamoro"
 PHI.6.d: "After years of Malaysian-brokered negotiation, the government and the Moro Islamic Liberation Front have signed a comprehensive settlement. The Front will decommission its weapons and combatants under independent verification. In exchange, the Autonomous Region in Muslim Mindanao gives way to a Bangsamoro entity with its own parliament, a defined share of national revenue, and authority over its internal affairs.\n\nThe transition will cost Manila a great deal of money and a measure of sovereignty over the south. It also ends four decades of war."
 PHI.6.a: "Peace is worth the price."
 PHI.7.t: "The Longest Rebellion Is Broken"
 PHI.7.d: "The guerrilla fronts of the New People's Army have been dismantled one region at a time. Its regional committees have been captured or dispersed, its rural tax networks broken, and what remains of the Central Committee directs nothing from exile in the Netherlands.\n\nThe Communist Party of the Philippines launched its protracted people's war in 1969. It has outlasted the Marcos dictatorship, four presidents, and every peace process attempted since. It will not outlast this one."
 PHI.7.a: "Fifty years of war are over."
 PHI.8.t: "Settlement in Oslo"
 PHI.8.d: "The Norwegian government has hosted the final round of talks between Manila and the National Democratic Front. The agreement grants amnesty to political prisoners and commits the government to a programme of agrarian reform and rural investment. In return, the New People's Army will demobilise permanently and the Front will contest power through legal parties.\n\nHardliners on both sides denounce the deal. Neither side commands the forces to continue without the other."
 PHI.8.a: "The war ends at the table."
 PHI.9.t: "The Anti-Dynasty Law Passes"
 PHI.9.d: "Against every expectation, Congress has passed enabling legislation for Article II, Section 26 of the Constitution. Relatives of incumbent officials within the second degree of consanguinity are barred from succeeding them or holding office simultaneously in the same jurisdiction.\n\nThe provincial clans that have supplied governors, congressmen, and presidents for generations now face an electoral map they cannot inherit. Party leadership is open to candidates with no family behind them, and a great many careers ended the moment the president signed."
 PHI.9.a: "The families do not own the Republic."
 PHI_news.1.t: "Estrada Ousted in Second People Power Revolution"
 PHI_news.1.d: "President Joseph Estrada has been forced from office after days of mass demonstrations and the collapse of his impeachment proceedings triggered a political crisis in Manila. As the Armed Forces and the Philippine National Police withdrew their support for the embattled president, Vice President Gloria Macapagal Arroyo took the oath of office, bringing an end to the Estrada administration. Governments across Asia have welcomed the peaceful transfer of power while closely watching the political future of the Philippines."
 PHI_news.1.a: "A dramatic end to Estrada's presidency."
 PHI_news.2.t: "Estrada Survives Crisis"
 PHI_news.2.d: "Philippine President Joseph Estrada has narrowly weathered what appeared to be the gravest political crisis of his presidency. After the Senate voted to admit the controversial Second Envelope into evidence, the impeachment trial resumed instead of collapsing into political chaos.\nThe decision temporarily eased fears of mass demonstrations and another People Power movement, allowing Estrada to remain in office while the judicial process continues. Despite this reprieve, allegations of corruption continue to cast a long shadow over the administration, leaving both foreign governments and financial markets uncertain about the country's political future."
 PHI_news.2.a: "Estrada remains in power."