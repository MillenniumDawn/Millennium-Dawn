 total_civilian_factories_amount_tt: "Это значение отражает общее количество §Yгражданских заводов§! в нашей стране."
 total_civilian_factories_amount_tt_delayed: "Это здание обеспечивает регион промышленностью для производства гражданских товаров и строительства новых зданий. При необходимости может быть переоборудовано для нужд военной промышленности.\n\nОбеспечивает регион:\nБазовое количество необходимых работников: §Y206 тыс.§!\nБазовый ВВП на §Yединицу гражданской промышленности§!: $§Y17.5 млрд§!\nБазовое энергопотребление: §R-0.5§! ГВт\n\nВлияние ВВП на душу населения на §Yрабочую силу§!: [?worker_requirement_gdp_multiplier_display|-%1]\nВлияние законов, национальных духов и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу гражданской промышленности§!: [?modifier@civ_facs_worker_requirement_modifier|-%0]\nСуммарное снижение ограничено §Y90%§!.\n\nНеобходимо работников на §Yединицу гражданской промышленности§!: [?workers_per_civ_fac_display|2] тыс.\n"
 total_military_factories_amount_tt: "Это значение представляет собой общее количество §Yвоенных заводов§! в нашей стране."
 total_military_factories_amount_tt_delayed: "Это здание обеспечивает регион промышленностью для производства новой военной техники. При необходимости может быть переоборудовано в гражданскую промышленность.\n\nОбеспечивает регион:\nБазовое количество необходимых работников: §Y18.8 тыс.§!\nБазовый ВВП на §Yединицу военной промышленности§!: $§Y1.5 млрд§!\nБазовое энергопотребление: §R-0.5§! ГВт\n\nВлияние законов, национальных духов и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу военных заводов и верфей§!: [?modifier@mil_facs_worker_requirement_modifier|-%0]\nСуммарное снижение ограничено §Y90%§!.\n\nНеобходимо работников на §Yединицу военной промышленности§!: [?workers_per_mil_fac_display|2] тыс.\n"
 total_naval_yard_amount_tt: "Это значение представляет собой общее количество §Yвоенно-морских верфей§! в нашей стране."
 total_naval_yard_amount_tt_delayed: "§YВоенно-морские верфи§! отражают способность региона производить военные суда всех типов: §Yпатрульные катера§!, §Yконвои§!, §Yэсминцы§!, §Yавианосцы§! и многое другое.\n\nОбеспечивает регион:\nБазовое количество необходимых работников: §Y18.8 тыс.§!\nБазовый ВВП на §Yвоенно-морскую верфь§!: $§Y1.5 млрд§!\nБазовое энергопотребление: §R-0.5§! ГВт\n\nВлияние законов, национальных духов и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу военных заводов и верфей§!: [?modifier@mil_facs_worker_requirement_modifier|-%0]\nСуммарное снижение ограничено §Y90%§!.\n\nНеобходимо работников на §Yвоенно-морскую верфь§!: [?workers_per_dockyard_display|2] тыс.\n"
 total_offices_amount_tt: "Это значение представляет собой общее количество §Yофисных секторов§! в нашей стране."
 total_offices_amount_tt_delayed: "§YОфисный сектор§! включает все отрасли экономики, помимо добывающей и тяжёлой промышленности: финансы, обслуживание клиентов, информационные технологии, розничную торговлю и многое другое.\n\nОбеспечивает регион:\nБазовое количество необходимых работников: §Y473 тыс.§!\nБазовый ВВП на §Yофисный сектор§!: $§Y50 млрд§!\nБазовое энергопотребление: §R-0.25§! ГВт\n\nВлияние ВВП на душу населения на §Yрабочую силу§!: [?worker_requirement_gdp_multiplier_display|-%1]\nВлияние законов, национальных духов и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу офисного сектора§!: [?modifier@offices_worker_requirement_modifier|-%0]\nСуммарное снижение ограничено §Y90%§!.\n\nНеобходимо работников на §Yофисный сектор§!: [?workers_per_office_display|2] тыс.\n"
 total_agriculture_district_amount_tt: "Это значение представляет собой общее количество §Yрайонов коммерческого сельского хозяйства§! в нашей стране."
 total_agriculture_district_amount_tt_delayed: "§YРайоны коммерческого сельского хозяйства§! — общее обозначение всего товарного (не натурального) сельского хозяйства страны: агропромышленность, пахотные земли, зернохранилища, скотобойни и многое другое.\n\nОбеспечивает регион:\nБазовое количество необходимых работников: §Y188 тыс.§!\nБазовый ВВП на §Yрайон коммерческого сельского хозяйства§!: $§Y25 млрд§!\nБазовое энергопотребление: §R-0.10§! ГВт\n§YПрирост топлива§! от регионов: 8\n§YМестное снабжение§!: 1.5%\n\nВлияние ВВП на душу населения на §Yрабочую силу§!: [?worker_requirement_gdp_multiplier_display|-%1]\nВлияние законов, национальных духов и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу районов коммерческого сельского хозяйства§!: [?modifier@agriculture_district_worker_requirement_modifier|-%0]\nСуммарное снижение ограничено §Y90%§!.\n\nНеобходимо работников на §Yрайон коммерческого сельского хозяйства§!: [?workers_per_agriculture_district_display|2] тыс.\n"
 total_microchips_factories_amount_tt: "Это значение представляет собой общее количество §Yзаводов микрочипов§! в нашей стране."
 total_microchips_factories_amount_tt_delayed: "§YЗаводы микрочипов§! — это производство полупроводников и малой электроники в нашей стране.\n\nОбеспечивает регион:\nБазовое количество необходимых работников: §Y37.5 тыс.§!\nБазовый ВВП на §Yзавод микрочипов§!: $§Y32 млрд§!\nБазовое энергопотребление: §R-0.75§! ГВт\n\nВлияние ВВП на душу населения на §Yрабочую силу§!: [?worker_requirement_gdp_multiplier_display|-%1]\nВлияние законов, национальных духов и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу заводов микрочипов§!: [?modifier@microchip_plant_worker_requirement_modifier|-%0]\nСуммарное снижение ограничено §Y90%§!.\n\nНеобходимо работников на §Yзавод микрочипов§!: [?workers_per_microchip_plant_display|2] тыс.\n"
 total_composites_factories_amount_tt: "Это значение представляет собой общее количество §Yзаводов композитных материалов§! в нашей стране."
 total_composites_factories_amount_tt_delayed: "§YЗаводы композитных материалов§! — это передовые предприятия по производству материалов, включая керамическую броню, армированные полимеры и высокоэффективные конструкционные материалы.\n\nОбеспечивает регион:\nБазовое количество необходимых работников: §Y37.5 тыс.§!\nБазовый ВВП на §Yзавод композитных материалов§!: $§Y28 млрд§!\nБазовое энергопотребление: §R-0.8§! ГВт\n\nВлияние ВВП на душу населения на §Yрабочую силу§!: [?worker_requirement_gdp_multiplier_display|-%1]\nВлияние законов, национальных духов и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу заводов композитных материалов§!: [?modifier@composite_plant_worker_requirement_modifier|-%0]\nСуммарное снижение ограничено §Y90%§!.\n\nНеобходимо работников на §Yзавод композитных материалов§!: [?workers_per_composite_plant_display|2] тыс.\n"
 total_refineries_amount_tt: "Это значение представляет собой общее количество §Yсинтетических НПЗ§! в нашей стране."
 total_refineries_amount_tt_delayed: "§YСинтетические НПЗ§! — промышленные предприятия, производящие синтетический каучук и сопутствующие химические материалы, критически важные для промышленности и логистики.\n\nОбеспечивает регион:\nБазовое количество необходимых работников: §Y184 тыс.§!\nБазовый ВВП на §Yсинтетический НПЗ§!: $§Y10 млрд§!\nБазовое энергопотребление: §R-0.2§! ГВт\n\nВлияние ВВП на душу населения на §Yрабочую силу§!: [?worker_requirement_gdp_multiplier_display|-%1]\nВлияние законов, национальных духов и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу синтетических НПЗ§!: [?modifier@synthetic_refinery_worker_requirement_modifier|-%0]\nСуммарное снижение ограничено §Y90%§!.\n\nНеобходимо работников на §Yсинтетический НПЗ§!: [?workers_per_synthetic_refinery_display|2] тыс.\n"
 increases_population_tax_tooltip: "Эта кнопка повышает §Yставку налога с населения§! в нашей стране.\nНаселение готово принять до §Y[?expected_population_tax_rate|0]%§!. Повышение выше и этого значения, и любой более высокой ставки, с которой мы недавно её снизили, на время стоит §R2%§! §Yстабильности§! за каждый пункт (см. §YИздержки смены политики§!).\n\n§YПредпосылки:§!\n[tax_button_req]\n\n[allowed_to_adjust_personal_tax_laws]"
 increases_population_tax_delayed_tooltip: "£click_left §YЛКМ§!, чтобы повысить §Yставку налога с населения§! на 1%.\n£key_shift + £click_left §YShift + ЛКМ§!, чтобы повысить §Yставку налога с населения§! на 5% (£pol_power_icon [?tax_rate_change_5])\n"
 decreases_population_tax_tooltip: "Эта кнопка понижает §Yставку налога с населения§! в нашей стране.\nСнижение ниже и ожидаемой ставки §Y[?expected_population_tax_rate|0]%§!, и любой более низкой ставки, с которой мы недавно её повысили, на время даёт §G0.5%§! §Yстабильности§! за каждый пункт; новое повышение этот бонус отменяет (см. §YИздержки смены политики§!).\n\n§YПредпосылки:§!\n[tax_button_req]\n\n[allowed_to_adjust_personal_tax_laws]"
 decreases_population_tax_delayed_tooltip: "£click_left §YЛКМ§!, чтобы понизить §Yставку налога с населения§! на 1%.\n£key_shift + £click_left §YShift + ЛКМ§!, чтобы понизить §Yставку налога с населения§! на 5% (£pol_power_icon [?tax_rate_change_5])\n"
 increases_corporate_tax_tooltip: "Эта кнопка повышает §Yставку корпоративного налога§! в нашей стране.\nБизнес готов принять до §Y[?expected_corporate_tax_rate|0]%§! в зависимости от нашего благосостояния и экономического цикла. Повышение выше и этого значения, и любой более высокой ставки, с которой мы недавно её снизили, на время стоит §R1.2%§! §Yстабильности§! за каждый пункт (см. §YИздержки смены политики§!).\n\n§YПредпосылки:§!\n[tax_button_req]\n\n[allowed_to_adjust_corporate_tax_laws]"
 increases_corporate_tax_delayed_tooltip: "£click_left §YЛКМ§!, чтобы повысить §Yставку корпоративного налога§! на 1%.\n£key_shift + £click_left §YShift + ЛКМ§!, чтобы повысить §Yставку корпоративного налога§! на 5% (£pol_power_icon [?tax_rate_change_5])\n"
 decreases_corporate_tax_tooltip: "Эта кнопка понижает §Yставку корпоративного налога§! в нашей стране.\nСнижение ниже и ожидаемой ставки §Y[?expected_corporate_tax_rate|0]%§!, и любой более низкой ставки, с которой мы недавно её повысили, на время даёт §G0.01§! к §Yежемесячному росту производительности§! и удешевляет §Yиностранные инвестиции§! в нашу страну на §G2%§! за каждый пункт; новое повышение этот бонус отменяет (см. §YИздержки смены политики§!).\n\n§YПредпосылки:§!\n[tax_button_req]\n\n[allowed_to_adjust_corporate_tax_laws]"
 decreases_corporate_tax_delayed_tooltip: "£click_left §YЛКМ§!, чтобы понизить §Yставку корпоративного налога§! на 1%.\n£key_shift + £click_left §YShift + ЛКМ§!, чтобы понизить §Yставку корпоративного налога§! на 5% (£pol_power_icon [?tax_rate_change_5])\n"
 increases_cb_rate_tooltip: "Повысить §Yключевую ставку§! на 1 п.п., ужесточив денежно-кредитные условия.\n\n§YЭффекты:§!\nЕжеквартальная инфляция дополнительно сдерживается вплоть до §G0.2%§! за квартал\nДоля инфляции, переходящая в следующий квартал, снижается на §G2.5 п.п.§!, а при чрезмерном бюджетном дефиците всего на §G1.25 п.п.§!, при повышении ставки выше 0%. Пока ставка остаётся на уровне 0% или ниже, перенос не меняется\nВклад ключевой ставки в процент по госдолгу повышается на §R0.33 п.п.§! до применения нижнего порога и верхнего предела\nЕжемесячное давление на §Yкурс валюты§! растёт на §G0.001§! или на §G0.00025§!, пока инфляция намного выше ставки (без изменений, когда ставка превышает инфляцию на 6 п.п.)\n\n§YПредпосылки:§!\n£pol_power_icon §Y25§! политической власти\nКлючевая ставка ниже 30%\nСтавка не менялась последние 30 дней"
 decreases_cb_rate_tooltip: "Понизить §Yключевую ставку§! на 1 п.п., смягчив денежно-кредитные условия.\n\n§YЭффекты:§!\nЕжеквартальная инфляция сдерживается слабее, вплоть до §R0.2%§!\nДоля инфляции, переходящая в следующий квартал, растёт на §R2.5 п.п.§!, а при чрезмерном бюджетном дефиците всего на §R1.25 п.п.§!, при снижении положительной ставки. При ставке 0% и ниже перенос не меняется\nВклад ключевой ставки в процент по госдолгу снижается на §G0.33 п.п.§! до применения нижнего порога и верхнего предела\nЕжемесячное давление на §Yкурс валюты§! снижается на §R0.001§! или на §R0.00025§!, пока инфляция намного выше ставки (без изменений, пока ставка остаётся на 6 п.п. выше инфляции)\n\n§YПредпосылки:§!\n£pol_power_icon §Y25§! политической власти\nКлючевая ставка выше -10%\nСтавка не менялась последние 30 дней"
