 investments_build_amount_red: "§R[?ROOT.project_build_amount^-1]§!"
 investments_building_amount_increase_button_tt: "이 주에 건설할 선택한 유형의 건물 수를 선택합니다.\n\n§L최대 수량은 건물 종류, 주의 빈 슬롯, 그리고 보유한 기술에 따라 달라집니다.§!"
