 USA_attack_helicopter_2: "AH-64 Apache"
 USA_attack_helicopter_2_desc: "Boeing AH-64 Apache — американский ударный вертолёт с двумя турбовальными двигателями, шасси с хвостовым колесом и тандемной кабиной для экипажа из двух человек. Он оснащён установленным в носовой части комплексом датчиков для обнаружения целей и системами ночного видения. Он вооружён 30-мм (1,18 дюйма) цепной пушкой M230, установленной между основными стойками шасси под передней частью фюзеляжа, и четырьмя точками подвески на пилонах коротких крыльев для вооружения и подвесных грузов — как правило, сочетания ракет AGM-114 Hellfire и блоков НАР Hydra 70. AH-64 имеет значительное резервирование систем для повышения боевой живучести."
 USA_attack_helicopter_2_short: "AH-64 Apache"
 USA_attack_helicopter_3: "AH-64D Apache Longbow"
 USA_attack_helicopter_3_desc: "AH-64D Apache Longbow оснащён стеклянной кабиной и усовершенствованными датчиками, наиболее заметными из которых являются система обнаружения целей с РЛС управления огнём (FCR) миллиметрового диапазона AN/APG-78 Longbow и радиочастотный интерферометр (RFI), размещённые в куполе над несущим винтом. Приподнятое положение обтекателя позволяет обнаруживать цели, когда вертолёт находится за препятствиями (например, рельефом местности, деревьями или зданиями). AN/APG-78 способна одновременно сопровождать до 128 целей и поражать до 16 из них; атака может быть начата в течение 30 секунд. Радиомодем, интегрированный с комплексом датчиков, позволяет обмениваться данными с наземными подразделениями и другими Apache, давая им возможность вести огонь по целям, обнаруженным одним вертолётом."
 USA_attack_helicopter_3_short: "AH-64D Apache"
 USA_attack_helicopter_4: "AH-64E Apache Guardian"
 USA_attack_helicopter_4_desc: "Ранее известный как AH-64D Block III, в 2012 году он был переименован в AH-64E Guardian, чтобы отразить его возросшие возможности. AH-64E оснащён улучшенной цифровой связью, Объединённой системой распределения тактической информации, более мощными двигателями T700-GE-701D с модернизированной трансмиссией с торцевыми зубчатыми передачами, рассчитанной на большую мощность, возможностью управления беспилотными летательными аппаратами (БПЛА), полной способностью к полётам по приборам (IFR) и улучшенным шасси."
 USA_attack_helicopter_4_short: "AH-64E Apache"
 USA_attack_helicopter_5: "AH-66 Comanche"
 USA_attack_helicopter_5_desc: "Boeing–Sikorsky RAH-66 Comanche - малозаметный вооруженный разведывательно-ударный вертолет, разработанный для армии Соединенных Штатов. После десятилетий разработки, в 2004 году, программа RAH-66 была отменена до начала массового производства, и к этому моменту на эту программу уже было потрачено почти $7 млрд."
 USA_attack_helicopter_5_short: "AH-66 Comanche"
