l_korean:
 Commonwealth_member_modifier: "영연방 회원국"
 CMW_Leaving.1.t: "[FROM.GetName]의 영연방 탈퇴"
 CMW_Leaving.1.d: "[FROM.GetName]이(가) 영연방 탈퇴를 공식 발표했습니다. 이 결정은 더 큰 자율성과 새로운 국제 동맹을 바라는 외교 정책의 중대한 전환을 의미합니다. 이 탈퇴는 영연방 내의 외교 관계와 경제적 유대에 영향을 미칠 수 있으며, 떠나는 나라와 남는 회원국 모두에게 새로운 과제와 기회를 제시합니다."
 CMW_Leaving.1.a: "행운을 빈다"
 Commonwealth_member_modifier_desc: "영연방의 회원국으로서 우리나라는 다른 회원국들과의 강력한 외교적 유대와 경제 협력의 혜택을 누립니다. 이 역사적 결합은 우리에게 상호 지원과 공유된 가치의 네트워크를 제공하여 국제적 위상과 무역 기회를 높여 줍니다. 그러나 우리의 주권과 영연방의 집단적 이익 사이에서 균형을 잡는 일은 때때로 외교적, 정치적 난관으로 이어질 수 있습니다."
 CMW_member_eng_influence_tt: "[ENG.GetNameWithFlag] $foreign_influence_modifier$: §G+10%§!"