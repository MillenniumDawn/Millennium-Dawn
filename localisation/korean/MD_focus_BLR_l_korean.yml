 BLR_batka_very_weak: "Very Weak Support of the Bat'ka"
 BLR_batka_very_weak_desc: "I will say one thing that you should remember: presidents are not made, presidents are born. There will definitely be a president after me, for sure. But do not think that they will all be born - §YAlexander Lukashenko§!\n§W--------------§!\nThis national spirit is §Rdynamic§! and changes depending on the popularity of §YLukashenko§! among the people."
 BLR_batka_weak: "Weak Support of the Bat'ka"
 BLR_batka_weak_desc: "I will say one thing that you should remember: presidents are not made, presidents are born. There will definitely be a president after me, for sure. But do not think that they will all be born - §YAlexander Lukashenko§!\n§W--------------§!\nThis national spirit is §Rdynamic§! and changes depending on the popularity of §YLukashenko§! among the people."
 BLR_batka_medium: "Medium Support of the Bat'ka"
 BLR_batka_medium_desc: "I will say one thing that you should remember: presidents are not made, presidents are born. There will definitely be a president after me, for sure. But do not think that they will all be born - §YAlexander Lukashenko§!\n§W--------------§!\nThis national spirit is §Rdynamic§! and changes depending on the popularity of §YLukashenko§! among the people."
 BLR_batka_strong: "바트카를 향한 강력한 지원"
