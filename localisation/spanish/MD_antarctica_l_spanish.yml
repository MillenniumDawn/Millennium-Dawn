 antarctica_atcp_apply_pending_tt: "El estatus consultivo se concederá tras aproximadamente §Y3 meses§!. Las naciones consultivas tienen permitido enviar Observadores a cualquier estación de investigación."
 antarctica_join_ccas_effect_tt: "Unirse a la §YCCFA§!.\nAumenta la producción de los laboratorios pertinentes en un §G+20%§!:\n- Producción de §YTecnología genética§!\n- Producción del multiplicador de coste de salud\n- Producción de población mensual\nEjemplo: §Y+8.0%§! en genes pasa a ser §G+9.6%§!."
 antarctica_leave_ccas_effect_tt: "Abandonar la §YCCFA§! y eliminar sus bonificaciones de laboratorio de la CCFA."
 antarctica_join_ccamlr_effect_tt: "Unirse a la §YCCRVMA§!.\nAumenta el rendimiento de los laboratorios pertinentes en un §G+20%§! (multiplicador), no en valores fijos:\n- Rendimiento de §YInvestigación de submarinos§!\n- Rendimiento de §YInvestigación de módulos navales§!\n- Rendimiento de detección naval\nEjemplo: §Y+6%§! en investigación de submarinos pasa a ser §G+7.2%§!."
