l_german:
 ARMY_EXPERIENCE_DESC: "As your equipment is used in combat, you gain Army Experience. This means that you can gain Army Experience when your §HBrigades§! engage in battle or if you have §HLend-Leased§! equipment to your allies' wars.\nYou also gain experience from conducting §HArmy Exercises§! with troops that are at least at the $UNIT_TRAINING_LEVEL|Y$ level, and from certain §HNational Focuses§!. Some §HMinisters§! can increase experience gained.\n\nArmy Experience is needed to create and modify your §HBrigade Templates§! and unlock §HDoctrines§!."