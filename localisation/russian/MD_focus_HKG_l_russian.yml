 hongkong.8.t: "Год Дракона"
 hongkong.8.d: "Прошло три года с момента воссоединения с материковым Китаем. Гонконг пережил азиатский финансовый кризис, избежав спада, предсказанного Западом. С наступлением нового тысячелетия город продолжит доказывать, что интеграция с Китаем – это не так уж и плохо."
 hongkong.8.a: "Сан Нин Фаа Лок! (С Новым годом!)"
 hongkong.9.t: "Гонконг нуждается в нашем оборудовании."
 hongkong.9.d: "Полиция Гонконга разместила заказ на стрелковое оружие китайского производства. Объем невелик, но символичен: это первая официальная закупка вооружений Гонконгом у поставщика из материкового Китая. Государственные СМИ уже преподносят эту сделку как признак растущего доверия Специального административного района к промышленности своей страны."
 hongkong.9.a: "Одобряйте заявки по выгодным ставкам."
 hongkong.9.b: "Используйте этот момент для государственной пропаганды."
 hongkong.13.t: "Пекин отвечает"
 hongkong.13.d: "Спустя месяц после обращения Законодательного совета с требованием освобождения диссидентов с материка Канцелярия связи центрального правительства выступает с резким осуждением. Государственные СМИ обвиняют гонконгских политиков во «вмешательстве во внутренние дела Китайской Народной Республики». Несколько малоизвестных задержанных тихо освобождают; многие другие остаются за решёткой. Лагерь сторонников демократии в ярости, патриотический лагерь торжествует."
 hongkong.13.a: "Приветствуем частичные освобождения!"
 hongkong.13.b: "Осудить осуждение со стороны Пекина"
 hongkong.13.c: "Оставьте этот вопрос в покое."
 HKG_aukus_request_tt: "§Y[ROOT.GetNameDef]§! §Yзапросит§! доступ к обмену разведывательной информацией у §H[ENG.GetName]§!, §H[USA.GetName]§! и §H[AST.GetName]§!. Они могут отказаться."
 HKG_uk_garrison_request_tt: "§H[ENG.GetName]§! будет приглашён разместить войска в Гонконге. Он может отказаться."
 hongkong.14.t: "Гонконгский вопрос"
 hongkong.14.d: "Два миллиона человек вышли на улицы Гонконга. Движение против экстрадиции потрясло политический порядок в Специальном административном районе до основания. Пропекинские чиновники требуют более решительных действий; прагматики в Государственном совете предупреждают, что чрезмерные меры отпугнут иностранный капитал. Решение о дальнейших действиях примет Политбюро."
 hongkong.14.a: "Укрепим свою хватку: формальный статус марионетки"
 hongkong.14.b: "Проявите сдержанность: сохраните структуру."
 hongkong.15.t: "Гонконг добивается доступа к AUKUS."
 hongkong.15.d: "Прозападно настроенное правительство Гонконга официально запросило доступ к обмену разведывательной информацией и размещению базы. Стратегическая ценность дружественного порта на южной окраине Китая значительна, но Пекин воспримет это как враждебный акт, и последствия для безопасности будут иметь взаимный характер. Вопрос будет передан в Совет национальной безопасности."
 hongkong.15.a: "Предоставить доступ: Гонконг — стратегический актив"
 hongkong.15.b: "Отказ: держать Пекин на расстоянии"
 hongkong.16.t: "Гонконг пригласил британский гарнизон"
 hongkong.16.d: "Правительство Гонконга официально пригласило Соединенное Королевство восстановить постоянный военный гарнизон в Специальном административном районе. Символизм этого шага был бы экстраординарным; дипломатические последствия для Пекина — серьезными. Задание министра обороны поступило на рассмотрение Кабинета министров."
 hongkong.16.a: "Принять: восстановить британское присутствие"
 hongkong.16.b: "Отказ: дипломатические издержки слишком высоки."
 hongkong.10.t: "Вопрос о всеобщем избирательном праве"
 hongkong.10.d: "В соответствии с Основным законом первые два главы администрации и первые три состава Законодательного совета формировались Избирательной комиссией, а не путём всеобщего избирательного права. Выборы главы администрации 2007 года и выборы в Законодательный совет 2008 года дают возможность решить, следует ли реформировать демократическую систему Гонконга, с полным всеобщим избирательным правом как конечной целью."
 hongkong.10.a: "Избирательная система Гонконга сохранит статус-кво."
 hongkong.10.b: "Мы не выступаем за немедленное всеобщее избирательное право, но будем поддерживать постепенную и упорядоченную избирательную реформу."
 hongkong.10.c: "Вполне логично пойти на радикальные меры и просто разрешить всеобщее избирательное право!"
 hongkong.11.t: "PCCW объединяется с HKT."
 hongkong.11.d: "Компания Cable & Wireless объявила о планах продать Hong Kong Telecom компании SingTel, несмотря на возражения китайского правительства. Компания PCCW, контролируемая Ли Цзарь-каем, сыном Ли Ка-шина, участвовала в торгах и в итоге одержала победу. После объявления о слиянии цена акций PCCW подскочила с нескольких центов до 28,50 гонконгских долларов к закрытию торгов в тот же день, ненадолго подняв рыночную капитализацию компании выше 250 миллиардов гонконгских долларов."
 hongkong.11.a: "Интернет — это замечательная вещь!"
 hongkong.12.t: "Последствия краха дотком-пузыря"
 hongkong.12.d: "После того, как лопнул пузырь доткомов, цена акций PCCW рухнула на 98%, всего через несколько месяцев после слияния с Hong Kong Telecom, которое привело к резкому росту их стоимости. Компания оказалась со значительным отрицательным собственным капиталом и не имела другого выбора, кроме как запланировать продажу своего основного бизнеса, чтобы облегчить финансовые трудности."
 hongkong.12.a: "Новое тысячелетие, новые проблемы."
 hongkong_legco.1.t: "Места в Законодательном совете [GetYear]"
 hongkong_legco.1.d: "Законодательный совет начинает работу на новый срок. Подсчитаны места в парламенте по географическим и функциональным округам, и теперь известны рабочие большинства палаты. Для принятия решений по предложениям потребуется [?HKG_legco_required_seats] мест; для принятия конституционных предложений потребуется [?HKG_legco_specially_required_seats]."
 hongkong_legco.1.a: "Понятно."
 hongkong_news.4.t: "Демократический альянс 123 распущен сегодня."
 hongkong_news.4.d: "Созданный в 1994 году группой политиков, выступавших за Тайвань, демократию и бизнес, Демократический альянс 123 был распущен из-за отсутствия финансовой поддержки со стороны правительства Тайваня после поражения Гоминьдана на президентских выборах."
 hongkong_news.4.a: "Хорошие новости, не правда ли?"
 hongkong_news.4.b: "Понятно."
 hongkong_news.5.t: "Вспышка SARS"
 hongkong_news.5.d: "В провинциях Гуандун и Гонконге произошла вспышка вируса тяжелой пневмонии, известного как \"SARS\". Несмотря на заявления властей материкового Китая о том, что вспышка эффективно локализована, она продолжается в Гонконге. ВОЗ выпустила предупреждение о поездках в Южный Китай и Гонконг, заявив, что это представляет угрозу для здоровья населения во всем мире. На данный момент один человек умер в результате вспышки. Правительство Гонконга ввело обязательные карантинные меры для лиц, подозреваемых в заражении."
 hongkong_news.5.a: "Наш туристический сектор переживает трудные времена."
 hongkong_news.5.b: "Арестовать некомпетентных чиновников и принять меры по борьбе со вспышкой заболевания прозрачным образом."
 hongkong_news.5.c: "Для поддержания социальной стабильности нам необходимо и дальше скрывать реальные данные."
 hongkong_news.5.e: "Тревожное развитие событий."
 hongkong_news.6.t: "Уход из жизни Лесли Чанга"
 hongkong_news.6.d: "Всемирно известный гонконгский певец, актёр и икона Лесли Чанг покончил жизнь самоубийством в возрасте 46 лет, спрыгнув со здания отеля «Мандарин» в Гонконге из-за депрессии. Лесли Чанг завоевал сердца бесчисленных поклонников своими проникновенными песнями, превосходным актёрским мастерством и уникальной личной харизмой. Его смерть потрясла всё китайское сообщество, многие глубоко опечалены и потеряны.\n\nСмерть Лесли Чанга — это не только значительная потеря для индустрии развлечений, но и культурный и духовный удар. Его музыка и киноработы будут продолжать влиять и вдохновлять будущих артистов и зрителей, но его отсутствие навсегда оставит незаполненную пустоту."
 hongkong_news.6.a: "Сегодня мы потеряли великого художника."
 hongkong_news.7.t: "Ушла из жизни Анита Муи."
 hongkong_news.7.d: "Анита Муи Йим-фонг, широко известная как «Мадонна Азии», скончалась в возрасте 40 лет после мужественной борьбы с раком шейки матки.\n\nАнита Муи, родившаяся в 1963 году, прославилась в 1980-х, став ключевой фигурой на кантопоп-сцене и оставив неизгладимый след в сердцах миллионов поклонников. Её преданность благотворительности и непоколебимая сила духа перед лицом болезни снискали ей глубокое восхищение. По мере распространения известия о её кончине страну охватывает скорбное настроение, и люди объединяются, чтобы почтить память любимой «Дочери Гонконга»."
 hongkong_news.7.a: "Конец великой эпохи."
 hongkong_news.8.t: "Сильный тропический шторм Утор"
 hongkong_news.8.d: "4 июля в 17:45 тайфун Юэт вошел в 800-километровую зону предупреждения, что побудило Гонконгскую обсерваторию выпустить сигнал тревоги № 1. 5 июля в 19:30 сигнал был повышен до штормового сигнала № 8, что стало первым подобным сигналом в XXI веке. Из-за штормовых нагонов, сочетание штормового нагона и обычного прилива тем утром привело к тому, что уровень моря в Куорри-Бэй поднялся до 3,4 метра, что является самым высоким показателем с момента удара тайфуна Ванда по Гонконгу в 1962 году. Это привело к сильному наводнению в Тай-О и северо-западных Новых Территориях 6 июля. Некоторые главные улицы Тай-О превратились в реки, глубина воды достигала трех метров. Оптовый рынок морепродуктов в Лау-Фау-Шане также был затоплен, что вынудило многие магазины закрыться."
 hongkong_news.8.a: "Обсерватория выполнила свою задачу."
 hongkong_news.9.t: "Сильный тропический шторм Юту (Лунный Кролик)"
 hongkong_news.9.d: "Тропический шторм Юту пересек зону предупреждения Гонконгской обсерватории, в связи с чем был объявлен сигнал готовности № 1. Расписание общественного транспорта скорректировано, школы приведены в состояние штормового наблюдения, а городские службы водоотведения и экстренной помощи приведены в боевую готовность. Обсерватория ожидает наихудшего сценария в течение следующих двадцати четырех часов."
 hongkong_news.9.a: "Затаитесь и переждите."
 HKG_european_bussiness_opinion: "Улучшение торговых отношений с европейскими бизнесменами."
 HKG_chinese_entrepreneurs_opinion: "Содействовать развитию торговли с предпринимателями из материкового Китая."
 HKG_protest_movement_rises: "Протесты начинаются"
 HKG_protest_movement_rises_desc: "Сотни тысяч людей выходят на улицы. Весь мир наблюдает. Пекин тоже наблюдает."
 HKG_loyalist_consolidation: "Консолидация лоялистов"
 HKG_loyalist_consolidation_desc: "Пропекинские фракции усиливают свой контроль над Законодательным советом и назначениями на государственные должности."
 HKG_umbrella_revolution: "Революция зонтиков"
 HKG_umbrella_revolution_desc: "Студенты и активисты занимают главные улицы города. Жёлтые зонты становятся символом надежд целого поколения."
 HKG_democratic_opposition_network: "Демократическая оппозиционная сеть"
 HKG_democratic_opposition_network_desc: "Пандемократические партии и группы гражданского общества формируют широкую коалицию для противостояния посягательствам Пекина."
 HKG_nsl_imposed: "Закон о национальной безопасности"
 HKG_nsl_imposed_desc: "Пекин полностью обходит Законодательный совет. В одночасье протесты, подрывная деятельность, сепаратизм и сговор с иностранными силами становятся преступлениями, наказуемыми пожизненным заключением."
 HKG_press_freedom_crackdown: "Замалчивание прессы"
 HKG_press_freedom_crackdown_desc: "Газета Apple Daily подвергается рейдам и закрывается. Редакционная независимость RTHK лишается права голоса. Последние свободные голоса заглушаются."
 HKG_police_state_apparatus: "Полицейская политика «железного кулака»"
 HKG_police_state_apparatus_desc: "В соответствии с положениями Национальной стратегии по борьбе с терроризмом (NSL) полиция расширяет свои полномочия. Создание отрядов по борьбе с беспорядками, проведение операций под прикрытием и массовые аресты становятся обычным делом."
 HKG_dialogue_with_protesters: "Диалоговая комиссия"
 HKG_dialogue_with_protesters_desc: "Последняя отчаянная попытка посредничества перед тем, как репрессии станут тотальными. Независимым наблюдателям предлагается оценить действия полиции."
 HKG_anti_extradition_bill: "Кризис вокруг законопроекта об экстрадиции"
 HKG_anti_extradition_bill_desc: "Предложенный закон, разрешающий экстрадицию в материковый Китай, вызвал крупнейшие протесты в истории Гонконга. Два миллиона человек вышли на марш."
 HKG_youth_resistance_cells: "Молодежное сопротивление"
 HKG_youth_resistance_cells_desc: "Отважные молодые гонконгцы формируют передовые отряды. Одетые в черное, они сражаются с помощью бутылок с зажигательной смесью и зонтов против слезоточивого газа и резиновых пуль."
 HKG_emigration_wave: "Великий Исход"
 HKG_emigration_wave_desc: "Сотни тысяч людей уезжают в Великобританию, Канаду и Австралию по программам BN(O). Гонконг теряет свой профессиональный класс."
 HKG_preserve_financial_hub: "Сохраним финансовый центр"
 HKG_preserve_financial_hub_desc: "Бизнес-элита лоббирует Пекин: ценность Гонконга заключается в его уникальной правовой системе и международных связях. Уничтожьте это — уничтожьте всё."
 HKG_foreign_business_exodus: "Отток иностранного капитала"
 HKG_foreign_business_exodus_desc: "Банки, юридические фирмы и транснациональные корпорации незаметно переносят региональные штаб-квартиры в Сингапур и Токио. Финансовая корона уступает место."
 HKG_western_sanctions_threat: "Угроза западных санкций"
 HKG_western_sanctions_threat_desc: "США, Великобритания и ЕС пересматривают особый торговый статус Гонконга. Привилегированный доступ города на западные рынки находится под угрозой."
 HKG_deeper_mainland_integration: "Углублённая интеграция с материковым Китаем"
 HKG_deeper_mainland_integration_desc: "Инициатива «Большой залив» вовлекает Гонконг в экономическую орбиту Китая. Инфраструктура, финансы и управление постепенно сближаются."
 HKG_patriotic_education: "Патриотическое образование"
 HKG_patriotic_education_desc: "Новая учебная программа переписывает историю. Следующему поколению будут преподавать, что Гонконг всегда был и всегда будет китайским."
 HKG_last_stand_opposition: "Последний демократический рубеж"
 HKG_last_stand_opposition_desc: "Выжившие деятели демократического движения отказываются молчать. Находясь в изгнании в Лондоне и Вашингтоне, они продолжают лоббировать интересы по всему миру, понимая, что, возможно, никогда не вернутся домой."
 HKG_absorption_complete: "Полное поглощение"
 HKG_absorption_complete_desc: "Одна страна. Одна система. Эксперимент завершен. Уникальная идентичность Гонконга теперь существует только в памяти и в диаспоре."
 HKG_city_of_resistance: "Город Сопротивления"
 HKG_city_of_resistance_desc: "Вопреки всему, дух сопротивления неугасателен. Гонконг становится символом демократий во всем мире, доказательством того, что за некоторые вещи стоит бороться, даже когда кажется, что шансы на победу ничтожны."
 HKG_silenced_press: "Заглушенная пресса"
 HKG_silenced_press_desc: "Замалчивание прессы облегчит интеграцию, но мы должны действовать быстро, прежде чем общественное негодование достигнет критической точки."
 HKG_annexation: "Образцовый САР"
 HKG_annexation_desc: "Гонконг стал образцовым особым административным районом Пекина — послушным, процветающим, интегрированным. Политбюро вознаграждает лояльность льготным торговым доступом, притоком рабочей силы из материкового Китая и инвестициями в инфраструктуру. Эти привилегии сохраняются до тех пор, пока Гонконг остается частью Китайской Народной Республики."
 HKG_democratic_reform_initiative: "Инициатива демократических реформ"
 HKG_democratic_reform_initiative_desc: "Мирный путь принес свои плоды. Благодаря организации гражданского общества, защите прессы и открытости Законодательного совета, САР официально подтверждает свою приверженность программе демократических реформ. Институты существуют; теперь они будут укреплены."
 HKG_universal_suffrage_amendment: "Поправка о всеобщем избирательном праве"
 HKG_universal_suffrage_amendment_desc: "Каждый совершеннолетний житель Гонконга получает право голоса, выборы на все выборные должности становятся предметом оспаривания, а комитет по выдвижению кандидатов распускается. Поправка принимается Законодательным советом и закрепляется в качестве конституционного права. Пекин протестует; Гонконг празднует."
 HKG_independent_judiciary_reform: "Независимая судебная реформа"
 HKG_independent_judiciary_reform_desc: "Апелляционный суд последней инстанции освобожден от политического вето, прокуроры действуют независимо от исполнительной власти, а назначения судей рассматриваются независимой комиссией. Судебная система, достойная того верховенства права, которое она толкует."
 HKG_freedom_of_information_act: "Закон о свободе информации"
 HKG_freedom_of_information_act_desc: "Правительственные документы по умолчанию становятся доступными для общественности. Информаторы получают законодательную защиту. Идея «замалчиваемой прессы» отменяется, и журналистика в Гонконге становится самым редким явлением в регионе: свободной прессой в китайском городе."
 HKG_democratic_consolidation: "Демократическая консолидация"
 HKG_democratic_consolidation_desc: "Всеобщее избирательное право, независимая судебная система и свободная пресса теперь взаимно усиливают друг друга. Гонконг является самым демократическим китайским обществом в истории. Реформы не могут быть отменены указом; они являются новым фундаментом."
 HKG_infrastructure_megaproject: "Инфраструктурный мегапроект"
 HKG_infrastructure_megaproject_desc: "Департамент земельных ресурсов разрабатывает генеральный план: развитие Гонконга в течение следующего десятилетия зависит от строительства вширь, вверх и под землей. Открывается казначейство. Подписываются контракты. Прибывают краны."
 HKG_mtr_expansion_phase_2: "Фаза 2 расширения метрополитена"
 HKG_mtr_expansion_phase_2_desc: "Расширение Западной железнодорожной линии, соединение Шатин-Централ и давно обещанный коридор на Северном острове. Время в пути сокращается, стоимость недвижимости вдоль новых станций растет, а сеть метрополитена достигает районов, которые ждали этого со времен британского правления."
 HKG_third_runway_chek_lap_kok: "Третья взлетно-посадочная полоса в Чек Лап Кок"
 HKG_third_runway_chek_lap_kok_desc: "Только работы по намыву территории занимают годы, а затраты колоссальные, но Гонконгский международный аэропорт не может оставаться аэропортом с двумя взлетно-посадочными полосами, пока Сингапур и Шанхай расширяются. Третья взлетно-посадочная полоса обеспечит городу статус регионального авиационного узла."
 HKG_lantau_tomorrow_vision: "Лантау: Видение будущего"
 HKG_lantau_tomorrow_vision_desc: "Самый амбициозный проект по освоению земель в истории Гонконга: искусственные острова к востоку от Лантау, жилье для сотен тысяч людей, новый центральный деловой район. Экологи возражают; бедные жилищным сектором ликуют. Политическая цена реальна, а прирост пригодной для использования земли огромен."
 HKG_smart_city_initiative: "Инициатива «Умный город»"
 HKG_smart_city_initiative_desc: "Городская сеть 5G, интегрированное управление дорожным движением, цифровая идентификация для каждого жителя и API для государственных услуг, позволяющий стартапам использовать данные Специального административного района. Гонконг совершает скачок от процветающего города к городу, способному к программированию."
 HKG_world_class_infrastructure: "Инфраструктура мирового класса"
 HKG_world_class_infrastructure_desc: "Дороги, железные дороги, порт, аэропорт, оптоволоконная сеть и освоенные территории — все модернизировалось согласованно. Инфраструктура города, построенного для второй половины XXI века, наконец-то завершена."
 HKG_hospital_authority_reform: "Реформа управления больницами"
 HKG_hospital_authority_reform_desc: "Органы управления больницами реорганизуются в целях повышения прозрачности, эффективности и финансирования, ориентированного на результаты. Время ожидания начинает сокращаться, разрыв между государственным и частным здравоохранением уменьшается, и закладывается основа для современной системы."
 HKG_pandemic_preparedness: "Готовность к пандемии"
 HKG_pandemic_preparedness_desc: "Вирус атипичной пневмонии (SARS) преподал городу жестокий урок; новый Центр защиты здоровья следит за тем, чтобы он не застарел. Запасы средств индивидуальной защиты, возможности отслеживания контактов и интегрированная система эпидемиологического надзора с ВОЗ гарантируют, что следующая вспышка не застанет Гонконг врасплох."
 HKG_chinese_medicine_integration: "Интеграция китайской медицины"
 HKG_chinese_medicine_integration_desc: "Традиционная китайская медицина интегрирована в систему здравоохранения: лицензированные специалисты, больничные отделения, гранты на университетские исследования. Пациенты, желающие получить и то, и другое, получают и то, и другое, и Пекин замечает это уважение к культуре."
 HKG_universal_healthcare_voucher: "Универсальный ваучер на медицинское обслуживание"
 HKG_universal_healthcare_voucher_desc: "Каждый житель получает годовой ваучер, который можно обменять в государственных или частных клиниках. Медицинское страхование становится всеобщим как на практике, так и формально, и малоимущие работники перестают выбирать между оплатой аренды жилья и посещением врача."
 HKG_public_health_modernisation: "Модернизация общественного здравоохранения"
 HKG_public_health_modernisation_desc: "Новые онкологические центры, расширенные услуги в области психического здоровья, модернизированные больницы по всей территории Новых Территорий. Сама медицина догоняет институциональные реформы."
 HKG_healthcare_excellence: "Превосходство в здравоохранении"
 HKG_healthcare_excellence_desc: "Средняя продолжительность жизни в Гонконге уже является одной из самых высоких в мире; система, которая её обеспечила, теперь достойна этой статистики. Это модель, которую начинают изучать и перенимать соседние регионы."
 HKG_labour_reform_charter: "Хартия трудовой реформы"
 HKG_labour_reform_charter_desc: "Первый за десятилетия всеобъемлющий пересмотр трудового кодекса Гонконга. Подробные проблемы, такие как эксплуатация рабочих на предприятиях с нечеловеческими условиями труда, неоплачиваемая сверхурочная работа, злоупотребления в общежитиях и эксплуатация в неформальном секторе, — все это названо, оценено и включено в законодательный календарь. Профсоюзы обратили на это внимание."
 HKG_minimum_wage_ordinance: "Постановление о минимальной заработной плате"
 HKG_minimum_wage_ordinance_desc: "Установленная законом минимальная заработная плата, пересматриваемая раз в два года. Крупные корпорации протестуют против повышения конкурентоспособности; уборщики и работники ресторанов впервые за целое поколение видят рост своих зарплат."
 HKG_collective_bargaining_rights: "Права на коллективные переговоры"
 HKG_collective_bargaining_rights_desc: "Профсоюзы получают законодательное признание, коллективные договоры приобретают юридическую силу, а право на забастовку кодифицируется, а не допускается. Конфедерация профсоюзов становится подлинным противовесом торговым палатам."
 HKG_foreign_domestic_helpers_protections: "Защита иностранных домашних работников"
 HKG_foreign_domestic_helpers_protections_desc: "Домашние работницы, проживающие в доме работодателя, в основном филиппинки и индонезийки, получают действенную защиту от самых серьезных злоупотреблений со стороны работодателей. Обязательные выходные дни, прозрачные условия контрактов и регулирующий орган с реальными полномониями. Давно назревшее признание того, что они являются работниками, а не прислугой."
 HKG_pension_scheme_reform: "Реформа пенсионной системы"
 HKG_pension_scheme_reform_desc: "Наихудшие черты Обязательного накопительного пенсионного фонда — высокие комиссии, удержание взносов работодателем, разрыв в размере взносов — были исправлены. Проблема бедности среди пожилых людей в Гонконге перестала быть тихим скандалом."
 HKG_labour_dignity: "Достоинство труда"
 HKG_labour_dignity_desc: "Установленный законом минимальный уровень заработной платы, признанные профсоюзы, защищенные права помощников и пенсия, которая действительно обеспечивает пенсию. Работа в Гонконге, наконец, становится чем-то, напоминающим достойную занятость."
 HKG_renminbi_offshore_hub: "Оффшорный хаб юаня"
 HKG_renminbi_offshore_hub_desc: "Пекин доверяет Гонконгу крупнейший в мире пул офшорных юаней. Выпуск облигаций Dim Sum, валютные свопы и клиринговые услуги для всего региона осуществляются через Central. Близость к материковому Китаю приносит свои плоды."
 HKG_belt_and_road_financing: "Финансирование в рамках ОПОП"
 HKG_belt_and_road_financing_desc: "Гонконг становится финансовыми воротами для инфраструктурных проектов в рамках инициативы «Один пояс и один путь» по всей Евразии. Проектное финансирование, синдицирование облигаций, разрешение споров — опыт Специального административного района экспортируется вместе с китайским капиталом."
 HKG_green_finance_centre: "Центр зеленого финансирования"
 HKG_green_finance_centre_desc: "Гонконгская фондовая биржа (HKEX) запускает площадку для зеленых облигаций, Комиссия по ценным бумагам и фьючерсам Гонконга (SFC) вводит жесткие правила раскрытия информации о климатических данных, а Гонконг позиционирует себя как азиатские ворота для капитала, ориентированного на ESG-факторы. Европейские пенсионные фонды это замечают. То же самое делают и разработчики возобновляемых источников энергии."
 HKG_fintech_revolution: "Финтех-революция"
 HKG_fintech_revolution_desc: "Виртуальные банковские лицензии, регуляторные песочницы и система ускоренных платежей, наконец-то выводящие розничные финансовые услуги в цифровую эпоху. Следующее поколение финансовых компаний рождается в Киберпорте, а не в Центральном районе."
 HKG_global_wealth_management: "Глобальное управление активами"
 HKG_global_wealth_management_desc: "Клиринг юаня, «зеленая» столица, финтех-технологии — Гонконг находится в центре всех трех. Мировое богатство управляется само собой через Специальный административный район. Одних только комиссий было бы достаточно, чтобы оправдать существование города."
 HKG_tourism_board_revival: "Возрождение туристического совета"
 HKG_tourism_board_revival_desc: "После передачи полномочий, после эпидемии SARS, после всего остального, Туристическое управление перезапускается: улучшенный маркетинг, расширенные услуги для посетителей, целостный бренд для города и за его пределами. \"Мировой город Азии\" Банальности. Посетители это замечают."
 HKG_disney_hong_kong: "Гонконгский Диснейленд"
 HKG_disney_hong_kong_desc: "На острове Лантау расположен самый маленький из парков Диснея — и самый доступный для туристов с материка. Строительство обходится дорого, церемония открытия проходит с большим размахом, а Специальный административный район получает привлекательный для семей туристический объект."
 HKG_cantopop_revival: "Возрождение кантопопа"
 HKG_cantopop_revival_desc: "Волна государственных инвестиций, квоты для телевещателей и спонсорская поддержка музыкальных фестивалей возвращают кантонской популярной музыке коммерческую значимость. Вместе с музыкой возвращается и культурная уверенность, которую когда-то олицетворял кантопоп."
 HKG_film_industry_renaissance: "Возрождение киноиндустрии"
 HKG_film_industry_renaissance_desc: "Киностудии TVB расширяются, независимые режиссеры находят финансирование, а гонконгский кинематограф вновь обретает ту уверенность, которая была у него в восьмидесятых и девяностых. Речь идет не только о боевых искусствах и криминале — серьезные драмы, семейные комедии и целое поколение новых режиссеров, которым есть что рассказать."
 HKG_west_kowloon_cultural_district: "Культурный район Западного Коулуна"
 HKG_west_kowloon_cultural_district_desc: "Музей современного искусства M+, Дворцовый музей, Центр сицюй и десяток более мелких учреждений расположены на территории, ранее отвоеванной у моря. Настоящий культурный квартал, позволяющий городу рассказывать свою собственную историю в галереях и театрах, а не в вестибюлях стеклянных небоскребов."
 HKG_world_class_destination: "Место мирового класса"
 HKG_world_class_destination_desc: "Туризм, инфраструктура, кухня и культура – все это достигает своего апогея одновременно. Гонконг становится не просто транзитным пунктом или местом для финансовой поездки, а самостоятельным туристическим направлением – городом, вокруг которого путешественники планируют целые поездки."
 HKG_consolidated_democracy: "Консолидированная демократия"
 HKG_consolidated_democracy_desc: "Демократические институты Гонконга теперь самоподдерживаются: свобода прессы, независимые суды, оспариваемые выборы. Демократия, которой не требуется разрешение центрального правительства для функционирования."
 HKG_modernised_infrastructure_idea: "Модернизированная инфраструктура"
 HKG_modernised_infrastructure_idea_desc: "Дороги, железные дороги, порт и цифровая инфраструктура Гонконга модернизируются до первоклассных мировых стандартов. От этого эффекта выигрывает каждый сектор экономики."
 HKG_modern_healthcare_system: "Современная система здравоохранения"
 HKG_modern_healthcare_system_desc: "Всеобщий охват медицинским обслуживанием, модернизированные больницы и интегрированная государственно-частная система здравоохранения обеспечивают одни из лучших в мире показателей здоровья при приемлемых затратах."
 HKG_renminbi_hub_idea: "Оффшорный центр по переводу юаня"
 HKG_renminbi_hub_idea_desc: "Гонконг является ведущим мировым центром клиринга офшорных операций с юанем. Торговые, инвестиционные потоки и операции по хеджированию валютных рисков проходят через банки и биржи Специального административного района."
 HKG_green_finance_idea: "Центр зеленого финансирования"
 HKG_green_finance_idea_desc: "Центральный регион — это азиатский канал привлечения капитала, соответствующего климатическим требованиям. Здесь можно приобрести зеленые облигации, акции с рейтингом ESG и привлечь финансирование для проектов в области возобновляемой энергетики."
 HKG_tourism_boom: "Туристический бум"
 HKG_tourism_boom_desc: "Гонконг вновь стал одним из ведущих мировых туристических направлений. Расходы туристов стимулируют розничную торговлю, гостиничный бизнес и культуру; социальные настроения улучшаются вместе с ростом доходов."
 HKG_modernised_police_force: "Модернизированная полиция"
 HKG_modernised_police_force_desc: "Полиция Гонконга работает в соответствии с современными стандартами подготовки, оснащения и процедур. Рутинная работа полиции становится более эффективной, затраты на борьбу с преступностью снижаются, а доверие общественности к полиции можно измерить с помощью данных опросов."
 HKG_counter_terrorism_capability: "Возможности по борьбе с терроризмом"
 HKG_counter_terrorism_capability_desc: "Подразделение по борьбе с терроризмом обеспечивает поисково-спасательным операциям надежные специализированные возможности для противодействия организованным угрозам. Иностранным разведывательным службам сложнее действовать незамеченными, а в составе подразделения имеется небольшой постоянный кадровый резерв спецназа."
 HKG_riot_control_capability: "Возможности по подавлению массовых беспорядков"
 HKG_riot_control_capability_desc: "Полиция располагает бронетехникой, щитами, слезоточивым газом и отработала протоколы управления толпой. Беспорядки сдерживаются более надежно; защитное снаряжение также является наглядным напоминанием о том, что Служба по борьбе с терроризмом выбрала особый подход к поддержанию общественного порядка."
 HKG_clean_police_force: "Чистая полиция"
 HKG_clean_police_force_desc: "Внутренние расследования, надзор со стороны ICAC и публичная приверженность принципам честности заметно снизили уровень коррупции в полиции. Сотрудники, уличенные в получении платежей от триад, сталкиваются с реальными последствиями. Репутация полиции и ее эффективность улучшаются."
 hongkong_order.1.t: "Давление, оказываемое на гражданские преобразования"
 hongkong_order.1.d: "В Специальном административном районе САР растет число рутинных инцидентов, связанных с нарушением общественного порядка. Причины разнообразны: нехватка жилья, трансграничная миграция, языковые и культурные противоречия, экономическая нестабильность в некоторых районах. Ни одна из причин не является доминирующей. Перед полицией стоит задача, как реагировать на ситуацию, которая носит скорее социальный, чем криминальный характер."
 hongkong_order.1.a: "Усильте патрулирование районов."
 hongkong_order.1.b: "Создать программы взаимодействия с местным сообществом."
 hongkong_order.1.c: "Сохраняйте текущую позицию."
 hongkong_order.2.t: "Координация трансграничной преступности"
 hongkong_order.2.d: "Подразделение по борьбе с терроризмом выявило сети организованной преступности, действующие на границе между Специальным административным районом и материковым Китаем. Эффективное пресечение их деятельности требует координации с органами общественной безопасности материкового Китая, однако правовые рамки различаются, а Основной закон устанавливает ограничения на оперативную интеграцию. Комиссар запрашивает разъяснения."
 hongkong_order.2.a: "Углублять совместные операции с властями материкового Китая."
 hongkong_order.2.b: "Поддерживать независимую деятельность в пределах нашей юрисдикции."
 hongkong_order.2.c: "Ограничьте сотрудничество только официальными каналами."
 hongkong_order.3.t: "Демонстрации у здания правительства"
 hongkong_order.3.d: "Несколько тысяч протестующих собрались у здания правительства. Их претензии разнообразны — проблемы с доступностью жилья, занятостью, а также гражданское недовольство, которое сложнее сформулировать. На некоторых плакатах упоминается передача власти; на многих — нет. Толпа шумит, но не проявляет насилия. Полиция должна принять решение о дальнейших действиях."
 hongkong_order.3.a: "Наладьте открытый диалог с организаторами."
 hongkong_order.3.b: "Сохраняйте видимый периметр и ожидайте развития событий."
 hongkong_order.3.c: "Разрешить разгон толпы."
 hongkong_order.4.t: "Обвинения в сотрудничестве полиции и триады"
 hongkong_order.4.d: "В сообщении информатора утверждается, что сотрудники полиции получали выплаты за то, чтобы закрывать глаза на некоторые операции триад. Политическое давление с целью проведения расследования значительно; профсоюз полиции предостерегает от того, чтобы делать отдельных офицеров козлами отпущения до истечения надлежащего судебного процесса. Этот вопрос нельзя игнорировать."
 hongkong_order.4.a: "Начать официальное расследование через ICAC."
 hongkong_order.4.b: "Только внутреннее дисциплинарное разбирательство."
 hongkong_order.4.c: "Рассматривайте как единичные случаи."
 HKG_new_development_idea_buff: "Новый план развития"
 HKG_new_development_idea_buff_desc: "Переходный этап нового плана развития Специального административного района САР. Научно-исследовательские и политические институты получают первоначальный импульс, но экономика несет издержки реструктуризации — работа офисов и предприятий потребительского сектора временно нарушается, пока вводится в действие новая система."
 HKG_new_development_idea_buff_complete: "Новый план развития"
 HKG_new_development_idea_buff_complete_desc: "Новый план развития полностью введен в действие. Скорость исследований, эффективность образования и производительность труда в офисах постоянно повышаются. Переходные издержки начального этапа окупаются, и экономика знаний Гонконга теперь действительно находится на первом уровне."
 hongkong_housing.1.t: "Жилищный кризис в Гонконге"
 hongkong_housing.1.d: "Средние цены на недвижимость в двадцать раз превышают средний доход домохозяйств. Десятки тысяч жителей Гонконга живут в квартирах, разделенных на несколько частей, и в крошечных домах. Очередь на получение государственного жилья превышает шесть лет и продолжает расти. Правительство признало кризис и взяло на себя обязательство провести программу реформ, но какие именно реформы и за чей счет – остается центральным вопросом гонконгской политики."
 hongkong_housing.1.a: "Мы должны действовать решительно."
 hongkong_housing.2.t: "Жилье для всех жителей Гонконга"
 hongkong_housing.2.d: "После многих лет строительства, реформ и политических баталий достигнута последняя цель жилищной программы. Клетчатые дома освобождаются. Жильцы государственного жилья приобретают собственное. Список ожидания впервые за целое поколение сократился до менее чем двух лет. Кризис, определявший эпоху после передачи власти, наконец-то остался позади."
 hongkong_housing.2.a: "Дом для каждого жителя Гонконга."
