 cyber_radar_spoofing_tracking_desc: "Une charge utile de guerre électronique coordonnée injecte de faux échos dans les réseaux de détection aérienne de la cible, dégradant leur conscience situationnelle. L'opération s'achèvera sous 30 jours."
 cyber_election_interference_tracking: "Ingérence électorale active"
 cyber_election_interference_tracking_desc: "Nos opérateurs mènent une campagne d'influence coordonnée visant l'espace informationnel politique de la cible, semant la désinformation et finançant des réseaux d'opposition pour éroder la confiance du public dans le gouvernement. L'opération durera environ 180 jours."
 cyber_industrial_espionage_tracking: "Espionnage industriel actif"
 cyber_industrial_espionage_tracking_desc: "Nos équipes ont établi un accès aux réseaux de recherche de la cible et extraient des données techniques et industrielles classifiées. Les analystes traitent le matériel volé."
 cyber_comms_intercept_tracking: "Interception des communications active"
 cyber_comms_intercept_tracking_desc: "Nos équipes de signaux ont pénétré les canaux de communication gouvernementaux et diplomatiques de la cible. Nous surveillons leur trafic et en extraions du renseignement actionnable en temps réel."
 cyber_financial_system_attack_tracking: "Attaque du système financier active"
 cyber_financial_system_attack_tracking_desc: "Nos opérateurs ont déployé des charges destructrices visant l'infrastructure de banque centrale et de traitement des paiements de la cible, étouffant sa capacité à commercer et à financer les opérations de l'État. L'opération durera environ 150 jours."
 cyber_logistics_disruption_tracking: "Perturbation de la logistique militaire active"
 cyber_logistics_disruption_tracking_desc: "Nous dégradons activement les logiciels militaires de commandement et contrôle et de gestion de la chaîne logistique de la cible, gênant leurs cycles de ravitaillement et de renfort. L'opération s'achèvera sous 90 jours."
 cyber_sleeper_network_tracking: "Réseau dormant activé"
 cyber_sleeper_network_tracking_desc: "Nous avons établi un accès persistant et prépositionné au sein des réseaux critiques de la cible. Cette tête de pont rend les opérations futures plus rapides et moins coûteuses tant qu'elle reste indétectée, jusqu'à un an."
 cyber_deception_campaign_tracking: "Campagne de tromperie stratégique active"
 cyber_deception_campaign_tracking_desc: "Une opération de déception multi-vecteurs coordonnée est en cours : communications falsifiées, fuites de renseignement fabriquées et opérations d'influence clandestines sont déployées pour manipuler la prise de décision de la cible au plus haut niveau. La campagne durera environ 180 jours."
 cyber_zero_day_strike_tracking: "Grève du jour zéro : conséquences"
 cyber_zero_day_strike_tracking_desc: "Notre arsenal zero-day a été déployé dans une frappe destructive de précision contre les systèmes les plus critiques de la cible. L'opération est achevée ; cette entrée expirera lorsque le chaos initial s'estompera."
 cyber_op_slot_0_network_hardening_tracking: "Renforcement du réseau en cours"
 cyber_op_slot_0_network_hardening_tracking_desc: "Nos équipes de cybersécurité mènent un durcissement complet de notre infrastructure réseau critique : renforcement des systèmes d'authentification, correction des vulnérabilités et isolation des canaux d'accès sensibles. Les travaux s'achèveront dans environ 120 jours."
