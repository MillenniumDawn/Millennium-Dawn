 RULE_OPTION_DEMOCRAT: "Skłonność demokratyczna"
 RULE_OPTION_DEMOCRAT_AI_DESC: "Stany Zjednoczone będą dążyć do wybrania przywódców Partii Demokratycznej i utrzymania narodu, we współczesnym znaczeniu, w kierunku centrolewicowego konsensusu w sprawie rządzenia krajem."
 RULE_OPTION_REPUBLICAN: "Skłonność Republikańska"
 RULE_OPTION_REPUBLICAN_AI_DESC: "Stany Zjednoczone będą dążyć do wybrania przywódców Partii Republikańskiej i utrzymania narodu, we współczesnym znaczeniu, w kierunku centroprawicowego konsensusu w sprawie rządzenia narodem."
 RULE_OPTION_REFORMED_REPUBLIC: "Republika Zreformowana"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "Wola ludu została wysłuchana. Naciski polityczne i protesty społeczne doprowadziły do ​​kluczowych reform politycznych i gospodarczych, które umożliwiły lepszą reprezentację i widoczność stron trzecich. Teraz to obywatele wybierają partię, która ich reprezentuje."
 RULE_OPTION_POST_UNITED: "Epoka Post-Zjednoczenia"
 RULE_OPTION_POST_UNITED_AI_DESC: "Orzeł wypada znacznie więcej niż z łaski. §RNie włączaj historycznego AI§!"
 FIJ_AI_BEHAVIOR: "@FIJ Fiji"
 NIG_AI_BEHAVIOR: "@NIG Federalna Republika Nigerii"
 RULE_OPTION_RISE_OF_BOKO_HARAM: "Powstanie Boko Haram"
 RULE_OPTION_RISE_OF_BOKO_HARAM_AI_DESC: "Naciska na Nigerię, aby pozwoliła Boko Haram przejąć kontrolę nad krajem."
 RULE_OPTION_PDP_EMPOWERED: "Partia Ludowo-Demokratyczna"
 RULE_OPTION_PDP_EMPOWERED_AI_DESC: "Partia Ludowo-Demokratyczna jest jedną z największych partii w Nigerii. Opowiada się przede wszystkim za chrześcijańską stroną spektrum religijnego i ideologiami niezaangażowanymi."
 RULE_OPTION_ANPP_EMPOWERED: "Cała Partia Ludowa Nigerii"
 RULE_OPTION_ANPP_EMPOWERED_AI_DESC: "Ogólnonigeryjska Partia Ludowa (lub Postępowy Kongres Demokratyczny w 2017 r.) jest główną partią opozycyjną w Nigerii w 2000 r. Należy zauważyć, że bardzo przypominają one socjaldemokrację w Europie i nawołują do poważnych reform w Nigerii."
 FRA_AI_BEHAVIOR_MD: "@FRA France"
 RULE_OPTION_FRA_HISTORICAL: "Historical"
 RULE_OPTION_FRA_HISTORICAL_DESC: "The Fifth Republic holds its course as the presidency passes from Chirac to Sarkozy, then Hollande and Macron, with the §8Republicans§! and the centre trading office between them. France anchors European integration and keeps its hand on the Françafrique sphere."
 ITA_AI_BEHAVIOR_MD: "@ITA Italy"
 ROC_AI_BEHAVIOR: "@TAI Republika Chińska"
 RULE_OPTION_TAI_PROJECT_NATIONAL_GLORY: "Projekt Chwała Narodowa"
 RULE_OPTION_TAI_PROJECT_NATIONAL_GLORY_AI_DESC: "Zgodnie z dziedzictwem zmarłego prezydenta Czang Kaj-szeka przeprowadzimy kontratak na kontynent i zjednoczymy Chiny."
 RULE_OPTION_TAI_UNITE_CHANNEL: "Zjednoczenie Cieśniny Tajwańskiej"
 RULE_OPTION_TAI_UNITE_CHANNEL_AI_DESC: "Obie strony Cieśniny Tajwańskiej nie mogą pozostać wiecznie podzielone i zdecydowanie będą dążyć do zjednoczenia w ramach tego samego systemu."
 RULE_OPTION_TAI_STATUS_QUO: "Utrzymaj status quo"
 RULE_OPTION_TAI_STATUS_QUO_AI_DESC: "Żadnego zjednoczenia, żadnej niepodległości, żadnej walki."
 RULE_OPTION_TAI_ROAD_TO_SPLIT: "Sen o Tajwanie"
 RULE_OPTION_TAI_ROAD_TO_SPLIT_AI_DESC: "Obie strony Cieśniny Tajwańskiej są zarządzane oddzielnie i nie są sobie podporządkowane. Czym jest Republika Chińska?"
 BRM_AI_BEHAVIOR: "@BRM Związek Birmy"
 RULE_OPTION_BEACON_OF_DEMOCRACY: "Światło Demokracji"
 RULE_OPTION_BEACON_OF_DEMOCRACY_AI_DESC: "Birma będzie kontynuować reformy bez kompromisów, szybko wypychając NLD do władzy. Zamiast iść na ustępstwa wobec Tatmadaw, Birma zmobilizuje różnych zwolenników liberalizacji politycznej, w tym etniczne grupy rebeliantów, w celu raz na zawsze położyć kres wpływom wojska w polityce."
 RULE_OPTION_AN_IRON_FIST: "Żelazna Pięść"
 RULE_OPTION_AN_IRON_FIST_AI_DESC: "Ta zasada gry, mająca zastosowanie wyłącznie do daty rozpoczęcia 2000 r., zmusi Birmę do pozostania dyktaturą i zamiast pozytywnie reagować na naciski na reformy, jak to miało miejsce w przeszłości, reagować represjami i totalitaryzmem. Co więcej, aby odwrócić uwagę od utraty legitymacji, rząd wojskowy będzie prowadził wojnę nie tylko z grupami rebeliantów w kraju, ale także z jego sąsiadami."
 RULE_OPTION_NORTHERN_AMBITION: "Ambicja Północy"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "The Swedish far-right will see a surge in popularity, culminating in an attempt to establish a Swedish Empire in Northern Europe."
 SYR_AI_BEHAVIOR: "@SYR Syryjska Republika Arabska"
 RULE_OPTION_SYR_HISTORICAL: "Historyczna sztuczna inteligencja"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Następcą Hafeza al-Assada zostanie jego najstarszy syn Bashar al-Assad. Bashar utrzyma Syrię jako kraj sprzymierzony z Rosją, ze zrównoważonym naciskiem na dyplomację, wojsko i gospodarkę."
 RULE_OPTION_SYR_IRON_LADY: "Żelazna Dama Syrii"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Następcą Hafeza al-Assada zostanie jego córka Bushra al-Assad. Bushra przyjmie bardziej neutralne podejście między wielkimi mocarstwami, koncentrując się na dyplomacji i gospodarce."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Syryjski Dzikus"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Następcą Hafeza al-Assada zostanie najmłodszy syn Maher al-Assad. Maher będzie próbował utworzyć Wielką Syrię i wyrzeźbić nową potęgę na Bliskim Wschodzie. Skupi się na ekspansji militarnej i gospodarczej."
 RULE_OPTION_SYR_NEW_ASSAD: "Nowy al-Assad"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Po Wiosnie w Damaszku następcą Hafeza al-Assada zostanie jego brat Rifaat al-Assad. Rifaat skoncentruje się na polityce pro-saudyjskiej, ze szczególnym uwzględnieniem dyplomacji i gospodarki."
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Wiosna Damaszku"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "Syria zostanie opanowana przez ruch Wiosny Damasceńskiej i przekształcona w demokrację."
 BHR_AI_BEHAVIOR: "@BHR Bahrajn"
 SAU_AI_BEHAVIOR: "@SAU Królestwo Arabii Saudyjskiej"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST: "Globalny Dżihad – Najpierw GCC"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST_AI_DESC: "Arabia Saudyjska podejmie próbę reformy swojej gospodarki i zjednoczenia GCC jako superpaństwa. Następnie monarchia saudyjska zostanie obalona przez powstanie Al-Kaidy, co doprowadzi do powstania radykalnego państwa islamskiego, które będzie starało się szerzyć swoją fundamentalistyczną ideologię za pomocą przemocy."
 RULE_OPTION_GLOBAL_JIHAD: "Globalny Dżihad"
 RULE_OPTION_GLOBAL_JIHAD_AI_DESC: "Monarchia saudyjska zostanie obalona przez powstanie Al-Kaidy, co doprowadzi do powstania radykalnego państwa islamskiego, które będzie starało się szerzyć swoją fundamentalistyczną ideologię brutalnymi środkami."
 RULE_OPTION_ISLAMIC_AWAKENING: "Przebudzenie Islamu"
 RULE_OPTION_ISLAMIC_AWAKENING_AI_DESC: "Sahwa, czyli Ruch Przebudzenia, będący pod wpływem Bractwa Muzułmańskiego, skutecznie wywrze presję na monarchię saudyjską, by ta ustąpiła miejsca pluralistycznej demokracji islamskiej."
 RULE_OPTION_RETURN_OF_THE_BAATH: "Powrót Baasów"
 RULE_OPTION_RETURN_OF_THE_BAATH_AI_DESC: "Arabia Saudyjska będzie stopniowo liberalizować, dając szansę wyjątkowej ideologii partii Baas, polegającej na socjalistycznym arabskim nacjonalizmie, na zdobycie przyczółka w kraju. Arabia Baas będzie wówczas dążyć do wypędzenia obcych wojsk z Bliskiego Wschodu i powiększenia własnego terytorium."
 RULE_OPTION_SHIA_REVIVAL: "Odrodzenie szyickie"
 RULE_OPTION_SHIA_REVIVAL_AI_DESC: "Szyici w Arabii Saudyjskiej skorzystają z okazji, jaką daje liberalizacja polityczna, aby przejąć Arabię ​​Saudyjską, jednocząc kraj z Iranem i Rosją."
 BRI_AI_BEHAVIOR: "@ENG Wielka Brytania"
 RULE_OPTION_RULE_BRITANNIA: "Rządź Brytanią"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Once, this sceptered isle was known and feared the world over. The British monarch presided over the empire upon which the sun never set. Now however, Britain's international position has fallen into decline. A mere lackey of the United States, a shadow of its former self. The time has come for the British Empire to be restored. The Crown's partisans will break the two-party system, build their movement through the decade and take power outright in 2010 - and then the fleet sails.\n"
