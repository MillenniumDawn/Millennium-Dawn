 UKR_modernize_sov_equipment_effect: "Soviet Military Equipment Modernization Efforts"
 UKR_modernize_sov_equipment_effect_tooltip: "Modernizes defense industry facilities producing Soviet-designed military equipment, improving their production capabilities."
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.name: "Offers for the BRDM-2 Modernization"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.desc: "Our request for BRDM-2 upgrades has reached the defense industry. The §YMykolayiv Tank Repair Plant§! promises a series of upgrades over the decade, §YNVK Techimpex§! wants to rebuild the vehicle thoroughly but needs time, and the smaller plants in Kyiv, Kremenchuk and Vinnytsia offer cheaper solutions. We could also leave the old scout cars as they are."
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.a: "Choose the Mykolayiv Tank Repair Plant"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.b: "Choose NVK Techimpex"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.c: "Choose the smaller plants"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.d: "Close the BRDM-2 program for good"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.name: "Early BRDM-2 Upgrade Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.desc: "The Mykolayiv plant has finished both early upgrades. The §YBRDM-2LD§! gets a Ukrainian SMD-21 diesel that stretches its range by a quarter, while the §YBRDM-2M§! keeps the old gasoline engine and only adds the side hatches."
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.a: "Adopt the §YBRDM-2LD§! with the diesel engine"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.b: "Adopt the cheaper §YBRDM-2M§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.c: "Put the project on hold"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.name: "BRDM-2DI Khazar Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.desc: "The Mykolayiv plant has finished the §YBRDM-2DI Khazar§! with an IVECO Tector diesel, a thermal imager and an extra hatch for the dismounts. The plant can also fit it with the new §YBuh§! weapon station at an extra cost."
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.a: "Adopt the §YBRDM-2DI Khazar-Buh§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.b: "Adopt the §YBRDM-2DI Khazar§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.c: "Put the project on hold"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.name: "New Manufacturers for the BRDM-2"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.desc: "Four more companies have sent their BRDM-2 proposals to the Ministry of Defence. We can bring one of them into the program next to Mykolayiv. Or we can focus on Mykolayiv only and their development cycle could benefit from it."
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.a: "Order the §YBRDM-2T§! from NVK Techimpex"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.b: "Buy the §YBRDM-2DP§! from Mayak"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.c: "Bring in the Vinnytsia plant"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.name: "The Remaining BRDM-2"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.desc: "Many old BRDM-2 still wait for an upgrade. The Mykolayiv plant offers the §YBRDM-2L1§!, a mobilization upgrade that is cheap and quick to build, or the §YBRM Manhust§!, a complete rethink of the reconnaissance vehicle."
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.a: "Adopt the mobilization §YBRDM-2L1§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.b: "Develop the §YBRM Manhust§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.c: "Put the project on hold"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.name: "Arey Builds Its Own Scout Car"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.desc: "While Mykolayiv starts work on the Manhust, the §YArey§! engineering group of army and National Guard volunteers is rebuilding the BRDM-2 in a closed Kyiv factory. Their §YBKM Hekkon§! aims at the same role."
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.a: "Focus on the §YBRM Manhust§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.b: "Back Arey and its §YBKM Hekkon§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.c: "Wait for both prototypes"
 ukraine_modernize_sov_equipment_brdm_2_modernization.7.name: "BRM Manhust Prototype Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.7.desc: "The Mykolayiv plant has presented the §YBRM Manhust§!. Every component except the engine is Ukrainian, new hatches let the troops dismount quickly, and a remote weapon station carries a 14.5 mm and a 7.62 mm machine gun."
 ukraine_modernize_sov_equipment_brdm_2_modernization.7.a: "Adopt the §YBRM Manhust§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.name: "Manhust or Hekkon"
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.desc: "Both prototypes have finished their trials. The §YBRM Manhust§! is a well-protected factory product, while the §YBKM Hekkon§! carries nine people and was designed by soldiers who know what the front needs."
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.a: "Adopt the §YBRM Manhust§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.b: "Adopt the §YBKM Hekkon§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.9.name: "BRDM-2T Prototype Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.9.desc: "§YNVK Techimpex§! has presented the §YBRDM-2T zr. 2012§!. A D-245 diesel replaced the GAZ-41 gasoline engine, which lowers the fire risk and fuel use, and the hull went through a major overhaul."
 ukraine_modernize_sov_equipment_brdm_2_modernization.9.a: "Adopt the §YBRDM-2T zr. 2012§!"
