 ENG_the_inner_circle_dm_desc: "여왕의 측근 집단은 왕실 가솔과 [ENG.GetNameDef]에서 가장 신뢰받는 인물들로 이루어져 있으며, 여왕 $ENG_elizabeth_queen$의 권위를 지키고 왕실의 이익을 보호하는 데 충성합니다. 의무와 위신으로 묶인 이들은 여왕과의 근접성, 임명권, 군주의 신임을 놓고 경쟁하며, 궁정에서의 영향력이 대중의 시선 밖에서 정책을 크게 좌우할 수 있음을 알고 있습니다. 이들의 손길은 군사, 산업, 정치 결정 모두에 미치며, 후원과 접근성, 은밀한 지시를 통해 영국을 이끕니다."
