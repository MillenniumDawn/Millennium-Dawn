 armour_subtitle_ammo: "AMMO"
 armour_subtitle_ammo_desc: "La munición incluye munición mejorada y cargas de combate para mejorar las capacidades de combate de las diferentes unidades."
 armour_subtitle_medium_tank_destroyer_chassiss: "CASCOS DE TANQUES LIGEROS"
 armour_subtitle_medium_tank_destroyer_chassiss_desc: "Los tanques ligeros pueden ofrecer a nuestras tropas apoyo de fuego en terrenos que son demasiado limitantes para nuestros tanques de batalla principales."
 AIR_TITLE_ENGINE: "ENGINES"
 AIR_TITLE_ENGINE_DESC: "Motores de helicóptero, todos diseñados con diferentes objetivos de rendimiento en mente."
 AIR_TITLE_ATGM: "ATGM"
 AIR_TITLE_ATGM_DESC: "Misiles guiados antitanque, todos diseñados para ser lanzados desde helicópteros."
 AIR_TITLE_ANTI_INFANTRY: "ARMAS Y COHETES"
 AIR_TITLE_ANTI_INFANTRY_DESC: "Vainas de cohetes, vainas de armas y cañones montados en el morro, utilizados para atacar infantería y objetivos ligeramente blindados."
 AIR_TITLE_SPECIAL: "EQUIPO ESPECIAL"
 AIR_TITLE_SPECIAL_DESC: "Equipo especial montado en helicópteros para aumentar las capacidades de combate o la capacidad de supervivencia."
 mbt_tech_ops: "Desarrollo de Cascos Blindados"
 mbt_tech_ops_desc: "Piedra angular de la guerra blindada, esta investigación se centra en los principios fundamentales de diseño de los cascos blindados. Desde el robusto chasis de los carros de combate principales hasta las versátiles plataformas de los vehículos de combate de infantería y los vehículos blindados de transporte de personal, esta tecnología sienta las bases para el desarrollo futuro de los vehículos blindados. Al equilibrar movilidad, protección y adaptabilidad, garantiza que nuestras fuerzas cuenten con una base sólida para las operaciones mecanizadas."
 nera_armor_tech_1: "NERA de 1st generación"
 nera_armor_tech_1_desc: "El blindaje reactivo no explosivo (NERA) utiliza un sándwich de insertos pesados ​​de titanio o uranio empobrecido para desviar los proyectiles. Es más pesado y costoso que el compuesto convencional, pero mucho más efectivo."
 nera_armor_tech_2: "NERA de 2da generación"
 nera_armor_tech_2_desc: "Blindaje reactivo no explosivo mejorado (NERA) con materiales y diseño mejorados, que proporciona una mejor protección contra cargas huecas y penetradores cinéticos."
 nera_armor_tech_3: "NERA de 3ra generación"
 nera_armor_tech_3_desc: "Blindaje reactivo no explosivo avanzado (NERA) que utiliza materiales de última generación y configuraciones innovadoras, ofreciendo una defensa superior contra una amplia gama de amenazas."
 defensive_systems: "Sistemas defensivos"
 defensive_systems_desc: "Una colección de tecnologías destinadas a mejorar la capacidad de supervivencia de nuestros vehículos a través de diversas medidas defensivas."
 defensive_systems_2: "Sistemas defensivos avanzados"
 defensive_systems_2_desc: "Avances adicionales en tecnologías defensivas para mejorar la supervivencia de los vehículos. Estos sistemas incorporan lanzadores de humo mejorados y blindaje espaciado mejorado, lo que proporciona mayor protección contra amenazas enemigas y mejora la capacidad defensiva general de nuestros vehículos."
 defensive_systems_3: "Sistemas defensivos modernos"
 defensive_systems_3_desc: "Tecnologías defensivas de vanguardia para maximizar la supervivencia de los vehículos. Estos modernos sistemas incluyen generación avanzada de humo, sistemas de alerta láser y diseños innovadores de blindaje espaciado, lo que proporciona a nuestras fuerzas un conjunto integral de medidas defensivas para contrarrestar una amplia gama de amenazas en el campo de batalla moderno."
 defensive_systems_4: "Sistemas defensivos de vanguardia"
 defensive_systems_4_desc: "La cumbre de las tecnologías defensivas, diseñadas para brindar una protección inigualable a nuestros vehículos. Estos sistemas avanzados incorporan sistemas de protección activa de vanguardia y capacidades de guerra electrónica para contrarrestar una amplia gama de amenazas, garantizando la supervivencia de nuestras fuerzas en el campo de batalla moderno."
 defensive_systems_5: "Sistemas de defensa mejorados"
 defensive_systems_5_desc: "La próxima generación de tecnologías defensivas, centrada en mejorar la capacidad de supervivencia de nuestros vehículos a través de medidas defensivas avanzadas."
 SOV_module_helipads_1: "Ka-25"
 SOV_module_helipads_3: "Ka-27M"
 SOV_module_esm_1: "'Vympel-R2' con\nPK-16 / PK-10"
 SOV_module_esm_1_desc: "El radar de guerra electrónica 'Vympel-R2' está diseñado para detectar la radiación de los radares operativos de buques y aeronaves, así como de las cabezas de guiado de los misiles, y crear interferencias activas para ellos.\nLos PK-16/PK-10 son sistemas soviéticos de interferencia electrónica a bordo de buques para establecer interferencias pasivas (reflectores dipolo y falsos objetivos térmicos).\n\n§GConsejo de diseño: Este módulo reduce la visibilidad del buque y aumenta la durabilidad, a costa de un coste adicional de producción industrial (IC) y recursos estratégicos.§!"
 SOV_module_esm_2: "MP-401S 'Start-S'\ncon PK-10 / PK-2"
 SOV_module_esm_2_desc: "El complejo de adquisición de objetivos e interferencias MP-401S 'Start-S' está diseñado para suprimir los radares de detección y control de armas, así como los radares de los misiles antibuque.\nLos PK-2/PK-10 son sistemas soviéticos de interferencia electrónica a bordo de buques para establecer interferencias pasivas (reflectores dipolo y falsos objetivos térmicos).\n\n§GConsejo de diseño: Este módulo reduce la visibilidad del buque y aumenta la durabilidad, a costa de un coste adicional de producción industrial (IC) y recursos estratégicos.§!"
 SOV_module_esm_3: "TK-25E\ncon PK-10 / PK-2"
 SOV_module_esm_3_desc: "El TK-25E está diseñado para interceptar la radiación de las estaciones de radar de detección y control de armas de aviones y buques, así como de las cabezas de guiado por radar de los misiles antibuque, analizar automáticamente la radiación, determinar las direcciones más peligrosas del ataque a un buque y crear interferencias en las direcciones de peligro.\nLos PK-2/PK-10 son sistemas soviéticos de interferencia electrónica a bordo de buques para establecer interferencias pasivas (reflectores dipolo y falsos objetivos térmicos).\n\n§GConsejo de diseño: Este módulo reduce la visibilidad del buque y aumenta la durabilidad, a costa de un coste adicional de producción industrial (IC) y recursos estratégicos.§!"
 SOV_module_chain_gun: "1x2 25mm 2M-3M"
 SOV_module_chain_gun_desc: "El 2M-3 es un montaje de artillería naval soviético automático de 25 mm y doble cañón. Es un medio de autodefensa para los buques y puede utilizarse para batir objetivos a un alcance inclinado de hasta 3000 m.\n\n§GConsejo de diseño: Este módulo mejora la protección contra armas antibuque al tiempo que proporciona durabilidad adicional y capacidad antiaérea.§!"
 SOV_module_ciws_1: "1x2 30mm AK-230"
 SOV_module_ciws_1_desc: "El AK-230 es un cañón naval soviético doble de 30 mm totalmente automático. Su función principal es la defensa antiaérea. Está montado en una torreta automática cerrada y dirigido por radar.\n\n§GConsejo de diseño: Este módulo mejora la protección contra armas antibuque al tiempo que proporciona durabilidad adicional y capacidad antiaérea.§!"
 SOV_module_ciws_2: "2x1 30mm AK-630"
 SOV_module_ciws_2_desc: "El AK-630 es un sistema de armas de defensa próxima (CIWS) naval soviético y ruso, totalmente automático y con cañón rotativo. La designación '630' se refiere a los seis cañones del arma y a su calibre de 30 mm.\n\n§GConsejo de diseño: Este módulo mejora la protección contra armas antibuque al tiempo que proporciona durabilidad adicional y capacidad antiaérea.§!"
