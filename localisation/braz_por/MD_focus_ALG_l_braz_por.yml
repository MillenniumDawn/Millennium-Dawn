 alg_cabinet.1.d: "O gabinete atual reflete o equilíbrio entre a presidência, a burocracia e o establishment de segurança.\n\nPrimeiro-Ministro: [GetPMName]\nMinistro da Defesa: [GetMODName]\nMinistro do Interior: [GetMOIName]\nMinistro das Relações Exteriores: [GetMOFAName]\nMinistro das Finanças: [GetMOFName]\nMinistro da Energia: [GetMOEName]\nMinistro da Justiça: [GetMOJName]\nChefe da Inteligência: [GetDRSName]\n\nLealdade do Gabinete: [GetCabinetLoyaltyLevel]\nCompetência do Gabinete: [GetCabinetCompetenceLevel]\nInfluência do Estado Profundo no Gabinete: [GetCabinetDeepStateLevel]"
 alg_cabinet.10.d: "O cargo de Primeiro-Ministro continua central para coordenar os ministérios, proteger a presidência e gerir o governo no dia a dia. A escolha certa pode reforçar o regime, enquanto a errada pode encorajar rivais."
 alg_cabinet.1000.d: "O cargo de Primeiro-Ministro continua central para coordenar os ministérios, proteger a presidência e gerir o governo no dia a dia. A escolha certa pode reforçar o regime, enquanto a errada pode encorajar rivais."
 alg_cabinet.20.d: "O Ministério da Defesa não é meramente administrativo. Ele está profundamente entrelaçado com o corpo de oficiais, o alto comando e as redes que compõem o estado profundo. Substituir seu titular é sempre perigoso."
 alg_cabinet.25.d: "O corpo de oficiais não recebeu bem as recentes mudanças no Ministério da Defesa. Algumas facções reclamam abertamente que a presidência está perturbando o equilíbrio estabelecido dentro das forças armadas."
 alg_cabinet.30.d: "O Ministério do Interior controla a administração interna, a governança provincial e muitas das alavancas da ordem doméstica. Seu titular deve ser ao mesmo tempo confiável e politicamente capaz."
 alg_cabinet.40.d: "O Ministro das Relações Exteriores da Argélia define o tom da república no exterior, equilibrando as relações com o Ocidente, o mundo árabe e a ampla tradição não alinhada."
 alg_cabinet.50.d: "O Ministério das Finanças determina se a Argélia seguirá uma reforma tecnocrática, uma gestão estatista ou o familiar equilíbrio burocrático que há muito define o regime."
 alg_cabinet.60.d: "Os hidrocarbonetos continuam sendo a espinha dorsal do Estado argelino. O Ministério da Energia é, portanto, um dos cargos economicamente mais estratégicos do gabinete."
 alg_cabinet.70.d: "O Ministério da Justiça pode ser usado como veículo de reforma, instrumento de disciplina do regime ou arma do establishment de segurança."
 alg_cabinet.80.d: "O chefe da inteligência comanda as instituições mais opacas e temidas do Estado. Esta é a nomeação mais sensível do gabinete, e qualquer mudança importante pode gerar uma reação adversa."
 alg_cabinet.800.d: "O chefe da inteligência comanda as instituições mais opacas e temidas do Estado. Esta é a nomeação mais sensível do gabinete, e qualquer mudança importante pode gerar uma reação adversa."
 alg_cabinet.85.d: "Elementos dos serviços de inteligência resistem à recente nomeação. As antigas redes permanecem intactas, e nem todas estão dispostas a aceitar um controle político mais rígido."
 alg_cabinet.100.d: "Uma reforma ministerial completa dá à presidência a chance de restaurar a ordem, recompensar aliados e redefinir o rumo do governo. Mas todo novo equilíbrio cria novos inimigos."
 alg_cabinet.110.d: "Rumores de lealdade vacilante chegaram à presidência. Uma demonstração pública de unidade pode restaurar a autoridade, mas forçar a questão também pode expor fraturas ocultas."
 alg_cabinet.200.d: "Vários membros-chave do gabinete mostram sinais de desobediência ou de falta de confiabilidade política. Em um sistema já moldado por redes rivais e centros de poder ocultos, tal deslealdade é perigosa."
 alg_cabinet.201.d: "O estado profundo exige maior influência sobre as nomeações ministeriais e o rumo das políticas. Ceder à pressão pode preservar a calma a curto prazo, mas resistir arrisca um confronto."
