 UKR_storage_item_mig25_icon: "GFX_SOV_AIR_MiG_25RBT"
 UKR_storage_item_mig25_tt: "§YМиГ-25§!\n\n\n£SOV_AIR_MiG_25RBT\n\n\n\nНа хранении: §Y[?ukraine_has_mig25_stockpile|0]§!\nПоколение: высотный перехватчик третьего поколения, на вооружении с 1970 года.\nТип техники: §YПерехватчик 3-го поколения§!\n\nСемейство вариантов:\n• МиГ-25РБ\n• МиГ-25РБТ\n• МиГ-25РБШ\n• МиГ-25ПД\n• МиГ-25ПДС\n• МиГ-25ПУ\n\nПерехватчик и разведчик со скоростью до 2.8 Маха. Семейство §YМиГ-25РБ§! выполняет разведывательные и бомбардировочные задачи, §YМиГ-25ПД/ПДС§! — перехват, §YМиГ-25ПУ§! — учебный вариант."
