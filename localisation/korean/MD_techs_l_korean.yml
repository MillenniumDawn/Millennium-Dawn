l_korean:
 AA_upgrade_1: "2세대 주포 냉각 장치"
 AA_upgrade_1_desc: "비행 전 작동에 전력을 공급하기 위한 열전지와 미사일 탐색기의 적외선 감지기를 식히기 위한 아르곤 가스 공급 장치를 포함합니다."
 AA_upgrade_2: "3세대 적외선 및 자외선 탐지기"
 AA_upgrade_2_desc: "전자기 스펙트럼의 자외선 대역폭은 작전에 투입된 무기들을 이끄는 도구로써 사용될 수 있는 가능성이 있습니다."
 AA_upgrade_3: "적외선 시스템 냉각장치"
 AA_upgrade_3_desc: "냉각식 적외선 탐색기는 열 감도를 크게 향상시켜, 휴대용 대공 미사일(MANPADS)과 차량 장착 단거리 대공 방어 시스템이 더 약한 열 신호를 감지하고 더 안정적인 조준을 유지하며 단순한 조명탄 대응책에 대한 저항력을 향상시킬 수 있게 합니다."
 AA_upgrade_4: "인듐 갈륨 비소 (InGaAs) 센서"
 AA_upgrade_4_desc: "InGaAs 단파 적외선 이미저는 저조도, 아지랑이, 복잡한 배경에서 표적 대비를 개선하여, 보병 및 기갑 대공 방어 시스템이 드론, 헬리콥터, 저공 비행 항공기를 더 높은 신뢰성으로 추적할 수 있도록 돕습니다."
 AT_upgrade_1: "반자동 시선 유도 (SACLOS)"
 AT_upgrade_1_desc: "\"반자동 시선 유도\"는 미사일 비행의 전체 과정에 작전 목표물을 고정시키는 일을 필요로 하는 미사일 통제 및 지휘 방침입니다."
 AT_upgrade_2: "발사 후 망각(Fire & Forget)"
 AT_upgrade_2_desc: "미사일이 발사되면 목표물을 스스로 유도하는 능력입니다."
 AT_upgrade_3: "개선된 텐덤 탄두"
 AT_upgrade_3_desc: "반응장갑을 공격할 때 효과적입니다. 이 다중 구조의 탄두는 우선 외부 장갑에 구멍을 내며, 이를 통해 두 번째 탄두가 외부의 방해없이 돌파할 수 있게 되고, 내부에서 폭파될 수 있도록 합니다."
 AT_upgrade_4: "배회 대기탄 (자폭 드론)"
 AT_upgrade_4_desc: "무기 시스템 종류의 하나로써, 표적 지역 주변을 배회하며 표적을 찾고, 그 위치에 단 한번의 포격을 가합니다."
 AS_upgrade_1: "추력편향 엔진"
 AS_upgrade_1_desc: "엔진의 추력 방향을 조작하는 능력으로 훨씬 뛰어난 투견 능력과 민첩성을 제공합니다."
 AS_upgrade_2: "2세대 스텔스"
 AS_upgrade_2_desc: "더욱 거대한 침입을 가능하게 하며 적 영공에서의 생존 가능성을 높여주는 발전된 스텔스의 특징과 성능입니다."
 AS_upgrade_3: "원격 조종"
 AS_upgrade_3_desc: "더 이상 사람을 기계 위에 올라타지 않도록 만드는 것은 더욱 위험한 임무 수행을 가능하게 하고 항공기들이 더욱 큰 중력가속도로 비행할 수 있도록 합니다."
 MR_upgrade_1: "초음속 순항"
 MR_upgrade_1_desc: "엔진 재연소 장치 없이도 효과적으로 유지되는 초음속 비행을 가능하게 합니다."
 MR_upgrade_2: "2세대 스텔스"
 MR_upgrade_2_desc: "더욱 거대한 침입을 가능하게 하며 적 영공에서의 생존 가능성을 높여주는 발전된 스텔스의 특징과 성능입니다."
 MR_upgrade_3: "원격 조종"
 MR_upgrade_3_desc: "더 이상 사람을 기계 위에 올라타지 않도록 만드는 것은 더욱 위험한 임무 수행을 가능하게 하고 항공기들이 더욱 큰 중력가속도로 비행할 수 있도록 합니다."
 tank_armor_upgrade: "장갑"
 tank_armor_upgrade_desc: "적군의 포탄이 뚫을 수 있는 것보다 두꺼운 장갑은 우리 사단에 큰 이익을 주지만 아마도 느려지게 할 것입니다."
 tank_gun_upgrade: "주포"
 tank_gun_upgrade_desc: "적 장갑의 내구도를 따라가고 관통할 수 있는 화기를 갖는 것은 중요합니다."
 tank_reliability_upgrade: "신뢰도"
 tank_reliability_upgrade_desc: "신뢰도를 향상하는 것은 당신이 교체해야 하는 고장난 전차의 수를 줄여줄 겁니다."
 tank_engine_upgrade: "엔진"
 tank_engine_upgrade_desc: "더 좋은 기동력은 전술, 전략적 이익을 주며, 상당한 속도 저하 없이 더 많은 장갑 강화를 가능하게 합니다."
 AA_Reliability: "신뢰도"
 AA_Reliability_desc: "신뢰도를 향상하는 것은 당신이 교체해야 하는 고장 난 전차의 수를 줄여줄 겁니다."
 SP_AA_engine_upgrade: "엔진"
 SP_AA_engine_upgrade_desc: "더 좋은 기동력은 전술, 전략적 이익을 주며, 상당한 속도 저하 없이 더 많은 장갑 강화를 가능하게 합니다."
 L_AT_Reliability: "신뢰도"
 L_AT_Reliability_desc: "신뢰도를 향상하는 것은 당신이 교체해야 하는 고장 난 전차의 수를 줄어들게 할 것입니다."
 H_AT_Reliability: "신뢰도"
 H_AT_Reliability_desc: "신뢰도를 향상하는 것은 당신이 교체해야 하는 고장 난 전차의 수를 줄어들게 할 것입니다."
 nav_gun_upgrade: "무기"
 nav_gun_upgrade_desc: "Better weapons to fight other naval targets with."
 strike_gun_upgrade: "무기"
 strike_gun_upgrade_desc: "지상 목표물을 타격하기 위한 더 나은 무기입니다."
 fighter_gun_upgrade: "공격"
 fighter_gun_upgrade_desc: "Better weapons to fight other planes with."
 plane_engine_upgrade: "엔진"
 plane_engine_upgrade_desc: "빠른 속도는 비행기가 자리를 잡고 목표물을 선택할때 이점을 줍니다. 요격기에 중요합니다."
 plane_reliability_upgrade: "신뢰도"
 plane_reliability_upgrade_desc: "신뢰도가 낮은 비행기는 임무 간 사고를 일으킬 가능성이 있습니다."
 plane_range_upgrade: "항속거리"
 plane_range_upgrade_desc: "보다 넓은 기동반경을 지닌 비행기는 임무간 보다 넓은 작전 범위를 소화할 수 있습니다."
 plane_bomb_upgrade: "폭격"
 plane_bomb_upgrade_desc: "탑재 중량을 늘려 페이로드를 증가시킵니다."
 plane_tac_bomb_upgrade: "폭격"
 plane_tac_bomb_upgrade_desc: "탑재 중량을 늘려 페이로드를 증가시킵니다."
 plane_cas_upgrade: "공격"
 plane_cas_upgrade_desc: "지상 목표물을 타격하기 위한 더 나은 무기입니다."
 destroyer_vls_upgrade: "수직발사관(VLS)"
 destroyer_vls_upgrade_desc: "적 항공기, 함선을 타격하기 위해 미사일 탑재량은 중요한 요소입니다."
 destroyer_asw_upgrade: "대잠수함"
 destroyer_asw_upgrade_desc: "잠수함을 탐지하고 공격하기 위해 대 잠수함 무기는 아주 중요합니다."
 destroyer_cm_upgrade: "전자 대응책"
 destroyer_cm_upgrade_desc: "더 나은 전자 대응책으로 적 미사일이나 어뢰를 피할 수 있습니다."
 destroyer_radar_upgrade: "레이더"
 destroyer_radar_upgrade_desc: "더 나은 레이더를 통해 적 함선을 탐지할 수 있습니다."
 destroyer_stealth_upgrade: "스텔스"
 destroyer_stealth_upgrade_desc: "더 나은 스텔스 성능으로 적 레이더의 탐지를 피할 수 있습니다."
 destroyer_engine_upgrade: "스텔스"
 destroyer_engine_upgrade_desc: "더 좋은 기동력은 전술, 전략적 이익을 주며, 상당한 속도 저하 없이 더 많은 장갑 강화를 가능하게 합니다."
 carrier_armor_upgrade: "장갑"
 carrier_armor_upgrade_desc: "Improving the armor on our carriers can allow our carriers and other carrier class vessels to hold up against anti-ship warfare."
 ship_anti_air_upgrade: "대공포"
 ship_anti_air_upgrade_desc: "Carrier anti-air is incredibly important. Upgrading the AA on our vessels allows us to prevent ground-based aircraft from destroying our air power before it takes off."
 ship_ASW_upgrade: "대잠수함"
 ship_ASW_upgrade_desc: "대잠 감지 시스템은 해상에 떠있는 우리 함선들을 지키는데 중요한 역할을 합니다."
 ship_armor_upgrade: "장갑"
 ship_armor_upgrade_desc: "앞으로 몇년 후의 함선 장갑은 예전의 평범한 무기들을 막기 보다는 미사일이나 다른 중형의 화기들을 방어할 수 있도록 만들어 질 것입니다."
 ship_VLS_upgrade: "수직발사관(VLS)"
 ship_VLS_upgrade_desc: "구축함과 호위함의 주요 화기입니다. 이는 항공기와 함선을 공격하는데 쓰이는 미사일들을 수용할 수 있습니다."
 ship_gun_upgrade: "총기 개선"
 ship_gun_upgrade_desc: "총기의 개선은 근접무기시스템, 체인건, 그리고 다목적 해상 함포 모두를 포함합니다."
 carrier_engine_upgrade: "엔진"
 carrier_engine_upgrade_desc: "엔진은 함선 전체에서 제일 중요한 부분 중 하나입니다. 이를 발전시키는 것은 더욱 빠른 기동성과 더불어 작전거리 범위를 더욱 넓힐 수 있을 것입니다."
 ship_engine_upgrade: "엔진"
 ship_engine_upgrade_desc: "엔진은 함선 전체에서 제일 중요한 부분 중 하나입니다. 이를 발전시키는 것은 더욱 빠른 기동성과 더불어 작전거리 범위를 더욱 넓힐 수 있을 것입니다."
 ship_ground_support: "지상 지원"
 ship_ground_support_desc: "지상 지원은 우리의 지상군이 해안가 근처에서 교전하고 있을 때 지원할 수 있는 순항미사일과 다른 형태의 무기들을 모두 포함합니다."
 frig_destroy_asw_upgrade: "대잠수함"
 frig_destroy_asw_upgrade_desc: "대잠 감지 시스템은 해상에 떠있는 우리 함선들을 지키는데 중요한 역할을 합니다."
 ship_CM_upgrade: "대응책"
 ship_CM_upgrade_desc: "더 나은 전자 대응책으로 적 미사일이나 어뢰를 피할 수 있습니다."
 sub_engine_upgrade: "엔진"
 sub_engine_upgrade_desc: "엔진은 함선 전체에서 제일 중요한 부분 중 하나입니다. 이를 발전시키는 것은 더욱 빠른 기동성과 더불어 작전거리 범위를 더욱 넓힐 수 있을 것입니다."
 carrier_displacement_upgrade: "배수량"
 carrier_displacement_upgrade_desc: "함선의 배수량은 함체의 용적 톤수와 관련이 있습니다. 항공모함 급의 함선들의 배수량에 더욱 집중하여, 배수량을 높이고, 함체를 증가시키며, 갑판의 크기도 확장합니다."
 sub_stealth_upgrade: "스텔스"
 sub_stealth_upgrade_desc: "우리 잠수함에 있는 개선된 스텔스 장비들은 함선들이 해양보호구역 (MPAs), 구축함, 호위함, 그리고 다른 대잠 무기들을 피할 수 있도록 할 것입니다."
 sub_sonar_upgrade: "소나"
 sub_sonar_upgrade_desc: "우리 잠수함의 소나를 개선하는 것은 적 수송과 해군에 대항하여 우리의 목표인 함대 전멸을 성공시키는데 큰 도움을 줄 수 있습니다."
 sub_displacement: "배수량"
 sub_displacement_desc: "Displacement is the definition of using ballasts to maintain a sub's ability underwater. However, improving displacement air tanks allows for additional missiles and torpedoes against hostiles."
 ship_reliability_upgrade: "신뢰도"
 ship_reliability_upgrade_desc: "우리 함선의 신뢰도는 극히 중요합니다. 만약 이를 개선하지 않는다면 우리 함선들은 적들보다 뒤떨어지게 될 것입니다."
 sub_torpedo_upgrade: "어뢰"
 sub_torpedo_upgrade_desc: "Upgrading torpedoes allows us to sink hostiles much quicker than our other sub counterparts."
 Early_APC: "장갑차 설계"
 early_bomber: "폭격기 설계"
 early_bomber_desc: "Reviewing and exploring the early bomber designs from World War II and Korea will allow us to build some of our bomber designs."
 electronics_folder: "전자기기"
 electronics_folder_desc: "컴퓨팅 발전 및 인터넷 프로토콜."
 basic_computing: "기초적인 컴퓨터"
 basic_computing_desc: "전자식 디지털 컴퓨터는 이제 프로그래밍 가능하게 되었습니다. 비록 엄청나게 크고 비싸지만, 이 컴퓨터는 인간의 범위를 넘어선 정보 분석을 가능하게 해주었습니다.\n"
 integrated_circuit: "집적회로"
 integrated_circuit_desc: "집적 회로는 반도체 소자재에 형성되어 각각의 부품들로 만들어진 더 큰 회로와 동일한 기능을 수행합니다.\n"
 microprocessors: "마이크로프로세서"
 microprocessors_desc: "하나 또는 많은 집적회로의 기능을 통합해 더 좋은 컴퓨터 프로세서를 구축하는 마이크로프로세서입니다. 프로세서의 출현으로 컴퓨터가 훨씬 저렴해질 수 있었습니다.\n"
 radar: "레이더"
 radar_desc: "레이더는 목표 대상에서 굴절되어 반사되는 전자파를 이용하여 특정 대상의 존재 여부, 이동 방향, 거리와 속도를 감지할 수 있는 시스템입니다."
 lte: "LTE"
 lte_desc: "4G의 이동통신 기술입니다."
 wimax: "WiMAX"
 wimax_desc: "인터넷 상의 데이터에 이동통신으로 접속할 수 있는 시스템입니다."
 umts: "범용 이동 통신 시스템 (UMTS)"
 umts_desc: "유럽의 차세대 이동통신의 명칭입니다."
 edge: "EDGE"
 edge_desc: "EDGE (Enhanced Data Rates for GSM Evolution)는 GSM 방식의 이동통신 망을 이용한 데이터 전송기술입니다. 기존의 GSM, GPRS 기지국을 이용한 고속 데이터 서비스 지원을 위한 기술 방식이며, 3세대 이동통신 기술을 2세대에 적용한 기술로써 2.75세대 정도로 분류되기도 하는 통신규격입니다.EDGE는 라디오 채널당 더 높은 비트 전송률을 제공합니다. EDGE는 2.75G라고도 합니다."
 hsupa: "고속 상향/하향 패킷 접속"
 hsupa_desc: "고속 상향 패킷 접속 (HSDPA)과 고속 하향 패킷 접속 (HSDPA)은 두가지 모바일 프로토콜의 융합체입니다. 이들은 WCDMA (광대역 코드 분할 다중 접속) 프로토콜을 이용하여 현존하는 3G 모바일 통신 네트워크의 성능을 향상시키고 확장합니다."
 gprs: "일반 패킷 무선 시스템 (GPRS)"
 gprs_desc: "일반 패킷 무선 시스템 (GPRS)은 패킷을 기반으로 하는 무선 통신 서비스로 데이터 전송률을 최소 56 kbps에서 최대 114 kbps 까지 보장하며 모바일 휴대폰과 컴퓨터 사용자들의 지속적인 인터넷 접속을 가능하게 합니다. 기기는 모바일 통신을 위한 2G 또는 3G 셀룰러 이동통신망의 전세계적인 시스템에 정착해 있습니다."
 civilian_folder: "산업 기술"
 civilian_folder_desc: "유전 공학, 나노 섬유 및 AI와 같은 21세기 기술입니다."
 fuel_silos: "기초 연료 정제"
 fuel_silos_desc: "Because of growing attention to environmental concerns and the increased price of oil, refineries across the world have started to focus increasingly on efficiency and the ability to utilize more diverse feeds."
 fuel_refining: "연료 정제 I"
 fuel_refining_desc: "화학적 분해법의 발전으로 석유로 더 질 좋은 경유를 생산할 수 있습니다."
 fuel_refining2: "연료 정제 II"
 fuel_refining2_desc: "Better planning of refinery layouts reduces wastage of fuels."
 fuel_refining3: "연료 정제 III"
 fuel_refining3_desc: "재사용법이 향상되며 정제 연료의 잔여물도 활용할 수 있습니다."
 fuel_refining4: "연료 정제 IV"
 fuel_refining4_desc: "화학 공학의 새로운 발전으로 신종 기름원에서 연료를 정제할 수 있습니다."
 fuel_refining5: "연료 정제 V"
 fuel_refining5_desc: "Using new methods and improved layouts in the construction of refineries dramatically increases throughput while reducing wastage."
 construction1: "건설 I"
 construction1_desc: "개선된 방법과 재료는 우리가 민간과 군사 모두에서 건물을 더 빨리 건설하게 합니다."
 construction2: "건설 II"
 construction2_desc: "우리의 건축 공구와 장비 현대화는 우리의 건설에 더 많은 도움이 될 것입니다."
 construction3: "건설 III"
 construction3_desc: "현대식 차량의 채택과 건축 분야에서 우리의 진보된 경험은 엄청나게 빠르게 수리할 수 있게 합니다."
 construction4: "건설 IV"
 construction4_desc: "높은 수준의 기계화와 개선된 건설 과정은 건축물의 건설 속도를 더 빠르게 합니다."
 construction5: "건설 V"
 construction5_desc: "미래의 효율적인 건설은 개별의 프로젝트에 대한 광범위한 계획 뿐만 아니라 언제나 가능할 때 표준화된 해결책을 요구할 것입니다."
 construction6: "건설 VI"
 construction6_desc: "Modern construction methods use building information modeling, prefabricated components, and improved project management systems to plan, coordinate, and deliver civilian and military infrastructure with greater speed and efficiency."
 construction7: "건설 VII"
 construction7_desc: "Advanced construction expands modular building, automated site surveying, and digitally coordinated supply chains, reducing delays while allowing large facilities, bases, and industrial sites to be assembled more predictably."
 construction8: "건설 VIII"
 construction8_desc: "Robotic construction systems, 3D printing, and autonomous earthmoving equipment allow structures to be built with less manual labor, lower material waste, and faster deployment in difficult or remote environments."
 excavation1: "채굴 I"
 excavation1_desc: "Advancements in drilling techniques allow us to excavate resources that were impossible to reach earlier."
 excavation2: "채굴 II"
 excavation2_desc: "새로운 기술은 우리들로 하여금 자원을 더 효율적으로 채취할 수 있게 합니다. 우리는 더이상 채굴 간 자원을 오염시키지 않고 더 많은 산출량을 낼 수 있습니다."
 excavation3: "채굴 III"
 excavation3_desc: "지질학의 발전은 우리가 자원의 위치를 결정하는 것을 돕습니다. 우리는 이제 우리의 채굴 능력을 더 많은 천연자원이 발견될 가능성이 높은 장소에 집중할 수 있습니다."
 excavation4: "채굴 IV"
 excavation4_desc: "핵심 처리공정의 자동화와 진보화된 장비는 우리의 모든 자원 채굴지를 더욱 더 효율적으로 만듭니다."
 excavation5: "채굴 V"
 excavation5_desc: "지표 채굴과 같은 지상에서의 채굴기술 발전은 우리에게 현재 채광지에서의 자원 생산량을 더 늘려줍니다."
 excavation6: "채굴 VI"
 excavation6_desc: "Modern excavation uses digital surveying, GPS-guided equipment, and improved drilling and blasting methods to extract resources from mines, quarries, and drilling sites with greater efficiency."
 excavation7: "채굴 VII"
 excavation7_desc: "Advanced excavation expands remote-controlled machinery, autonomous haulage, and real-time fleet management, allowing resource sites to move more material safely and consistently."
 excavation8: "채굴 VIII"
 excavation8_desc: "Sensor-based ore sorting, precision blasting, and automated sampling improve recovery from lower-grade deposits by identifying valuable material earlier and reducing wasted extraction and transport."
 Fighter_TITLE_EQP: "제트기"
 AIR_TITLE_TRANSPORT_HELICOPTER: "수송 헬리콥터"
 AIR_TITLE_ATTACK_HELICOPTER: "공격 헬리콥터"
 AIR_TITLE_ASW_HELICOPTER: "대잠\n헬리콤터"
 AIR_TITLE_TRANSPORT_PLANE: "수송기"
 AIR_TITLE_NAVAL_PLANE: "해상\n초계기"
 AIR_TITLE_HEAVY_FIGHTER: "중\n전투기"
 AIR_TITLE_M_FIGHTER: "다목적\n전투기"
 AIR_TITLE_A_FIGHTER: "제공\n전투기"
 AIR_TITLE_S_FIGHTER: "타격 전투기"
 AIR_TITLE_L_S_FIGHTER: "경 타격 전투기/훈련기"
 AIR_TITLE_MEDIUM_BOMBER: "전술\n폭격기"
 AIR_TITLE_STRAT_BOMBER: "전략\n폭격기"
 AIR_TITLE_CAS: "근접 항공\n지원"
 AIR_TITLE_AIR_UAV: "무인 정찰기"
 NAVAL_TITLE_DESTROYERS: "구축함"
 INFANTRY_TITLE_WEAPONS: "소화기"
 INFANTRY_TITLE_WEAPONS_DESC: "모든 군인은 소총병으로 시작합니다. 소화기는 주력 돌격소총부터 저격소총과 권총에 이르기까지 다양한 무기를 아우릅니다."
 INFANTRY_TITLE_SPECIAL: "특수부대"
 ARTILLERY_SP_TITLE: "자주포"
 INFANTRY_TITLE_nvg: "야간 투시경"
 INFANTRY_TITLE_DRONES: "드론"
 INFANTRY_TITLE_COMMAND: "지휘&통제 장비"
 INFANTRY_TITLE_COMBAT_ENGI: "공병 장비"
 NAVAL_TITLE_CARRIERS: "AIRCRAFT CARRIERS"
 INDUSTRY_TITLE: "산업"
 INDUSTRY_TITLE_PRODUCTION: "생산"
 INDUSTRY_TITLE_CONSTRUCTION: "건설"
 TITLE_ELECTRONIC_SUBTITLE: "컴퓨터"
 TITLE_INTERNET_SUBTITLE: "인터넷"
 CIVILIAN_TITLE_ARTIFICIAL_INTELLIGENCE: "인공 지능 기술"
 CIVILIAN_TITLE_ARTIFICIAL_INTELLIGENCE_DESC: "인공 지능은 기계를 통해 설명 가능한 모든 지능 관련 분야들을 나타냅니다."
 CIVILIAN_TITLE_NANOFIBERS_AND_PRINTERS: "나노 섬유와 3D 프린터"
 CIVILIAN_TITLE_NANOFIBERS_AND_PRINTERS_DESC: "나노 섬유와 3D 프린터는 현대 시대의 산업 분야에 접근하는 더욱 새로운 방식입니다. 그러나 이들은, 현대 시대에 소개된 제일 중요한 기술들 중 하나이기도 합니다."
 CIVILIAN_TITLE_GENETICS: "유전 공학"
 CIVILIAN_TITLE_GENETICS_DESC: "Genetic engineering is a relatively new science. Its primary focus pertains to the editing and understanding of genetics."
 CIVILIAN_TITLE_FUEL: "연료 정제 및 에너지 기술"
 CIVILIAN_TITLE_FUEL_DESC: "현대 시대의 연료 정제는 과거의 연료 정제 과정을 기반으로 하며 바이오 연료와 관련된 방향으로 점점 발전해 나갑니다."
 night_vision_1: "1세대 야간 투시경"
 night_vision_1_desc: "1세대 야간 투시경은 매우 기초적인 장비입니다. 이들은 그들의 환경을 정밀하고 깔끔하게 표현하는데 큰 제한이 있지만, 그래도 사용자들이 더 효과적인 야간 전투를 가능하게 합니다."
 night_vision_2: "2세대 야간 투시경"
 night_vision_2_desc: "2세대 야간 투시경은 1세대의 형태를 개선하였고 더 가늘어진 이미지와 야간 투시경의 가시거리를 증가시켰습니다."
 night_vision_3: "3세대 야간 투시경"
 night_vision_3_desc: "3세대 고글은 이전 세대 플랫폼을 다시 한 번 개선하여 일광과 거의 유사한 이미지를 볼 수 있는 전투원의 능력을 향상시킵니다."
 night_vision_4: "4세대 야간 투시경"
 night_vision_4_desc: "4세대는 가장 많은 개선을 이루어낸 야간 투시경으로써, 매우 깔끔한 이미지를 보여주고 전투 상황에서 매우 효율적입니다."
 support_weapons: "냉전 시대 지원 화기"
 support_weapons_desc: "지원 화기는 장거리에서 화력 지원을 제공하고 적 위치를 압박하기 위해 자주 쓰여왔습니다. 이 관점은 냉전 시대에 크게 발전하였습니다."
 squad_automatic_weapon: "편대 자동화 무기"
 squad_automatic_weapon_desc: "Squad automatic weapons started to take their shape as a vital role in the squad structure in the later part of the century."
 tandem_charge_warheads: "탠덤 기반 탄두"
 tandem_charge_warheads_desc: "탠덤 기반 탄두는 장갑차와 헬리콥터와의 전투에서 우리 보병들에게 큰 도움을 줄 것입니다."
 support_weapons2: "현대 지원 화기"
 support_weapons2_desc: "Improvements in the delivery system for our LMGs and effectiveness of our anti-tank weapons have met with great success."
 support_weapons3: "향상된 대전차 무기"
 support_weapons3_desc: "대전차 무기들의 개선은 적 부대에 대항하여 더욱 높은 관통력을 가져다 줄 것입니다."
 support_weapons4: "보병자동소총"
 support_weapons4_desc: "보병자동소총은 경기관총의 모든 기능들을 가지고 있고, 이를 하나로 묶어 사용하기에 편리한 형태로 만든 다중 구조의 형태를 대체하기 위한 형태의 소총입니다."
 support_weapons5: "향상된 대공 무기"
 support_weapons5_desc: "경 대공 무기들은 최근 몇년간 엄청난 발전을 하였으며, 실제 전투에서 헬리콥터의 역할을 대체하기 시작하였습니다."
 camouflage_desc: "지난 수세기 동안 군대에서 위장이 사용되기는 했으나, 진정한 위장색이라 할만한 색은 2차대전 전후 군복에서 사용되었습니다. 첫 위장색은 2개에서 3개의 색깔이 고르게 분배되어 있는 색깔을 띄고 있습니다."
 legacy_doctrines: "과거 교리"
 legacy_doctrines_desc: "냉전의 교리는 우리의 군사적 결정을 미래로 안내하고 추진할 것입니다."
 armoured_mass_assault: "기갑 대량 공격"
 armoured_mass_assault_desc: "대규모의 기갑부대를 활용하여 적의 방어를 기갑주먹으로 무너뜨릴 것입니다."
 offensive_focus: "공세적 전투 교리"
 offensive_focus_desc: "우리 군대는 강력한 공격군으로, 우리 영토 외에서 적을 공격하고 파괴하도록 만들어 졌습니다."
 lr_maritime_strike: "장거리 해상 타격"
 lr_maritime_strike_desc: "우리는 전략적으로 지상에서 출발하는 폭격기들을 해상 전투에 투입시킬 수 있습니다."
 rw_frontline_focus: "최전방 회전익 항공기 중심"
 rw_frontline_focus_desc: "고정익 항공기 자원과 비교했을 때 근접전의 반경과 낮은 속도는 헬리콥터들이 깊은 곳으로 진입하여 타격하는 것을 어렵게 만듭니다. 그렇기에, 최전선의 부대들이 대공 지원을 제공하여 헬리콥터의 효율을 높이는 전략이 더욱 중요시됩니다."
 recon_strike_complex: "정찰 타격 단지"
 recon_strike_complex_desc: "정찰 타격 단지는 대규모 수준의 대형에서 장거리 타격 자산과 공중 및 우주 기반 감시 체계의 융합을 구상하는 전쟁의 개념입니다. 이는 고가치의 표적을 전면에서 깊숙히 근 실시간으로 파괴할 수 있습니다."
 roaving_fighters: "순회 비행 전투기"
 roaving_fighters_desc: "공중 정찰 및 감시 장비를 발견하고 파괴하는 것은 목표물 파괴를 주도하는 숙련되고 경험이 많은 조종사가 필요합니다."
 pilot_adversarial_training_oi: "조종사 적대적 훈련"
 pilot_adversarial_training_oi_desc: "조종사 적대적 훈련은 적군이 사용하는 항공기와 전술들을 시뮬레이션하는 고급 조종사 훈련 방법입니다."
 aviation_fire_strike: "항공기 집중 폭격"
 aviation_fire_strike_desc: "공중 폭격은 미사일, 항공기, 전자기기 등 모든 종류의 화력 병기들을 이용하여 첫 폭격에 모든 것을 쏟아붓는 공격 방식입니다."
 alcm_raid_oi: "공중발사 순항 미사일 공습"
 alcm_raid_oi_desc: "공중발사 순항 미사일 공습은 적 함대를 향해 대함 미사일을 발사하는 해군 타격 항공기의 대규모 작전에 특화되어있습니다."
 jsead: "합동 적 방공망 제압 (JSEAD)"
 jsead_desc: "적의 방공망에 대한 합동 제압 작전은 적의 방공 무기들을 억제하기 위한 군사 작전입니다. 조직화된 진압 전술과 함께 지대공미사일 (SAM)과 대공포 (AAA) 기지를 파괴함으로써 조종사들이 적은 위험으로 공중 지원 임무를 수행할 수 있도록 해줍니다."
 tech_naval_systems_engineering: "해군 시스템 공학"
 tech_naval_systems_engineering_desc: "Contemporary naval systems are mainly manual with few interfaces. Naval Systems Engineering is a key aspect in developing vessels to bring us through to the future."
 tech_digital_naval_systems: "디지털 해군 시스템"
 tech_digital_naval_systems_desc: "과거 2차 대전과 냉전시대의 선박들의 디자인을 기반으로 디지털 시스템을 추가하여 우리의 선박들을 재정비합니다. 또한 컴퓨터 사용의 개선은 우리 함선들에게 큰 도움을 줄 것입니다."
 tech_modern_naval_electronics: "현대 해군 전자부품"
 tech_modern_naval_electronics_desc: "해군 전자부품은 수직 발사 시스템 (VLS), 경함포, 또는 다른 형태의 주력 무기처럼 더욱 향상된 시스템을 우리의 현대 함선에 구축하는데 있어 매우 중요한 역할을 합니다."
 tech_digital_communication_equipment: "디지털 통신 장비"
 tech_digital_communication_equipment_desc: ""
 tech_modern_hull_design_materials: "현대 함체 디자인 요소"
 tech_modern_hull_design_materials_desc: "첨저선 (아랫부분이 역삼각형으로 뾰족한 모양, Wave-piercing) 형태의 새로운 선박 디자인은 적들의 무기로 인한 피해를 격퇴하는데 큰 도움을 줄 것입니다."
 tech_ar_networking_navigation_systems: "증강 현실 네트워킹 항해 시스템"
 tech_ar_networking_navigation_systems_desc: "증강 현실 항해는 조타수와 승무원들이 사전에 대응 체계를 훈련하며, 더 많은 정보들을 습득하고 익히기 위해서 점점 해상을 기반으로 한 게임을 늘려가고 있는 중입니다."
 tech_advanced_systems_microengineering: "향상된 마이크로 시스템 공학"
 tech_advanced_systems_microengineering_desc: "해군 시스템의 기본적인 개념은 재설계되어야 합니다. 디지털과 아날로그 시스템은 점점 더 쓸모가 없어지고 있습니다."
 tech_automated_digital_ship_systems: "자동화된 디지털 선박 시스템"
 tech_automated_digital_ship_systems_desc: "자동화는 최초의 자동으로 움직이는 기계가 처음 사용될 때부터 지금까지 오랜 기간 동안 발전해 왔습니다. 선박 내의 지루하고 반복적인 임무들을 자동화 하는 것은 우리 함선들이 더욱 빠르고 효과적으로 대응하도록 발전하는데 큰 도움을 줄 것입니다."
 tech_naval_armament_engineering: "해군 군사장비 공학"
 tech_naval_armament_engineering_desc: "무거운 선박을 생산하는 것은 우리의 대양함대에 매우 중요한 역할을 합니다. 해군 군비 공학 부서를 확장하는 것은 이 문제를 개선하는데 큰 도움이 될 것입니다."
 tech_power_systems_1: "터빈 엔진"
 tech_power_systems_1_desc: "Most modern ships use a reciprocating diesel engine as their prime mover, due to their operating simplicity, robustness and fuel economy compared to most other prime mover mechanisms."
 tech_nuclear_power_systems_1: "Early Surface Nuclear Reactors"
 tech_nuclear_power_systems_1_desc: "Compared to oil or diesel fuelled ships, nuclear propulsion offers the advantages of very long intervals of operation before refueling."
 tech_nuclear_power_systems_2: "Advanced Surface Nuclear Reactors"
 tech_nuclear_power_systems_2_desc: "An upgraded generation of Nuclear Reactor allows for more speed, longer life, and better reliability"
 tech_nuclear_power_systems_3: "Modern Surface Nuclear Reactors"
 tech_nuclear_power_systems_3_desc: "Modern Nuclear Reactors produce far more power for their size, allowing for ships to harness energy-intensive weapons as required"
 tech_combat_support_systems: "전투 지원 시스템"
 tech_combat_support_systems_desc: "전자전을 바탕으로 하는 병참 자동화 시스템을 통해, 군의 계획을 지원하는 도구로써 사용되고, 현대전 지원의 물질적인 필요조건을 충족시켜줄 것입니다."
 tech_fire_control_1: "Fire Control Systems"
 tech_fire_control_1_desc: "Used aboard naval warships - often in conjunction with electronic computerized systems, to control targeting of guns against surface ships, aircraft, and shore targets, with either optical or radar sighting."
 tech_fire_control_2: "Improved Support Systems"
 tech_fire_control_2_desc: "Next generation of logistical systems providing combat support and material requirements for military combat"
 tech_combat_radar_1: "레이더 II"
 tech_combat_radar_1_desc: "Early phased-array combat radars allow warships to search, track, and support missile engagements with far greater speed and reliability than older rotating radar systems."
 tech_combat_radar_2: "레이더 III"
 tech_combat_radar_2_desc: "Improved naval radar suites integrate air search, surface tracking, and combat-system data processing, helping warships coordinate missile defense and fleet air-defense operations."
 tech_combat_radar_3: "레이더 IV"
 tech_combat_radar_3_desc: "Advanced multifunction radar systems provide better 3D tracking, fire-control support, and resistance to clutter, allowing ships to manage aircraft, missiles, and surface contacts at the same time."
 tech_combat_radar_4: "레이더 V"
 tech_combat_radar_4_desc: "Active electronically scanned array radars use electronically steered beams and modern signal processing to track more targets, resist jamming, and support integrated air and missile defense."
 tech_combat_radar_5: "레이더 VI"
 tech_combat_radar_5_desc: "Digital AESA radar systems use advanced transmit-receive modules, adaptive waveforms, and high-speed processing to improve detection of low-flying missiles, drones, aircraft, and surface threats."
 tech_combat_sonar_1: "음파탐지기 II"
 tech_combat_sonar_1_desc: "Improved naval sonar systems combine stronger hull-mounted arrays, passive listening equipment, and early towed sensors to detect submarines, torpedoes, and underwater contacts with greater reliability."
 tech_combat_sonar_2: "음파탐지기 III"
 tech_combat_sonar_2_desc: "Modern sonar suites integrate hull-mounted sensors, towed arrays, and combat-system processing, allowing warships to localize, classify, and track underwater threats more effectively during anti-submarine operations."
 tech_combat_sonar_3: "음파탐지기 IV"
 tech_combat_sonar_3_desc: "Advanced sonar systems use low-frequency active search, improved passive arrays, and variable-depth equipment to detect quieter submarines across different ocean layers and acoustic conditions."
 tech_combat_sonar_4: "음파탐지기 V"
 tech_combat_sonar_4_desc: "Multifunction undersea warfare suites fuse hull sonar, towed arrays, torpedo-warning sensors, and offboard ASW data into a single tactical picture, improving detection, tracking, and engagement coordination."
 tech_combat_sonar_5: "음파탐지기 VI"
 tech_combat_sonar_5_desc: "Digital sonar systems use wideband processing, adaptive filtering, and automated contact classification to separate submarines, torpedoes, mines, and seabed noise in cluttered underwater environments."
 tech_early_naval_weapon_systems: "2차대전 무기 시스템"
 tech_early_naval_weapon_systems_desc: "제2차 세계 대전 시기의 해군 무기 체계는 검증된 함재 포, 어뢰, 폭뢰, 단순한 사격 통제 장비에 의존했습니다. 이 구형 무기들은 현대적인 유도 해군전 이전 수상전의 기본 토대를 이루었습니다."
 tech_naval_weapon_systems: "냉전 시대 무기 시스템"
 tech_naval_weapon_systems_desc: "냉전 시기의 해군 무기 체계는 개선된 대잠 박격포, 소해정, 기뢰 부설 장비를 사용하여 근거리 대잠전과 기뢰전을 확대함으로써 함대를 보호하고 연안 해역을 다투었습니다."
 tech_light_guns_1: "Naval Guns 1975"
 tech_light_guns_1_desc: "소구경과 대구경의 해군 무기 시스템으로, 수상 및 공중 표적 모두를 공격할 수 있도록 설계되었습니다."
 tech_light_guns_2: "Naval Guns 2000"
 tech_light_guns_2_desc: "소구경과 대구경의 해군 무기 시스템으로, 수상 및 공중 표적 모두를 공격할 수 있도록 설계되었습니다."
 tech_rail_guns_1: "Railguns 2015"
 tech_rail_guns_1_desc: "Experimental naval railguns use electromagnetic force to launch high-velocity projectiles without chemical propellant. Early systems promise long range and powerful kinetic impact, but require large power supplies, cooling systems, and durable launcher components."
 tech_rail_guns_2: "Railguns 2025"
 tech_rail_guns_2_desc: "Improved railgun prototypes refine pulsed-power storage, barrel materials, and fire-control integration, bringing electromagnetic launch systems closer to practical shipboard use against surface targets, shore positions, and incoming threats."
 tech_rail_guns_3: "Railguns 2035"
 tech_rail_guns_3_desc: "Practical shipboard railguns combine compact power systems, improved thermal management, and automated loading to fire hypervelocity projectiles at long range with deeper magazines than missile-based weapons."
 tech_point_defense_system_1: "근접 방어시스템 I"
 tech_point_defense_system_2: "근접 방어시스템 II"
 tech_point_defense_system_2_desc: "Improved CIWS mounts use faster tracking radars, refined fire-control logic, and more reliable rotary cannons to engage sea-skimming missiles, aircraft, and close-range surface threats with greater accuracy."
 tech_point_defense_system_3: "근접 방어시스템 III"
 tech_point_defense_system_3_desc: "Modern CIWS upgrades add electro-optical tracking, infrared sensors, improved barrels, and enhanced ammunition, allowing gun systems to engage missiles, aircraft, small boats, and drones more effectively."
 tech_point_defense_system_4: "근접 방어시스템 IV"
 tech_point_defense_system_4_desc: "Networked CIWS mounts link close-in guns with ship sensors and combat management systems, improving reaction time and target handoff against cruise missiles, drones, helicopters, and fast attack craft."
 tech_point_defense_system_5: "근접 방어시스템 V"
 tech_point_defense_system_5_desc: "Advanced CIWS guns use automated threat evaluation, improved tracking algorithms, programmable ammunition, and efficient fire-control systems to defeat larger numbers of close-range missile and drone threats."
 tech_point_defense_system_6: "근접 방어시스템 VI"
 tech_point_defense_system_6_desc: "Future CIWS mounts combine rapid-fire cannon systems, smart airburst ammunition, adaptive targeting logic, and improved cooling to sustain defensive fire against missiles, drones, and precision-guided weapons."
 tech_turret_missiles_surface_1: "Anti-Vessel Missiles 1975"
 tech_turret_missiles_surface_1_desc: "Anti-vessel missiles comprise Anti-Submarine and Anti-Ship missile platforms. The two turret systems are slightly different in design and payload, but they ultimately perform the same function. Destroy the target."
 tech_turret_missiles_surface_2: "Anti-Vessel Missiles 1985"
 tech_turret_missiles_surface_2_desc: "Improved anti-vessel missile systems use better seekers, sea-skimming flight profiles, and more reliable launch equipment to threaten surface ships or deliver anti-submarine payloads at greater range."
 tech_turret_missiles_surface_3: "Anti-Vessel Missiles 2000"
 tech_turret_missiles_surface_3_desc: "Modern anti-vessel missile platforms integrate over-the-horizon targeting, containerized launchers, vertical-launch compatibility, and improved guidance for both anti-surface strikes and standoff anti-submarine attacks."
 tech_turret_missiles_aa_1: "Rolling Airframe Missiles 1975"
 tech_turret_missiles_aa_1_desc: "Early Rolling Airframe Missile (RAM) launchers provide close-range defense against aircraft and incoming anti-ship missiles."
 tech_turret_missiles_aa_2: "Rolling Airframe Missiles 1985"
 tech_turret_missiles_aa_2_desc: "Improved RAM systems use faster reaction launchers, better target acquisition, and more reliable missile handling to engage sea-skimming missiles and close-range air threats."
 tech_turret_missiles_aa_3: "Rolling Airframe Missiles 2000"
 tech_turret_missiles_aa_3_desc: "Modern RAM launchers combine improved seekers and digital fire-control links to protect ships from missiles, aircraft, helicopters, and small attack craft."
 tech_turret_missiles_aa_4: "Rolling Airframe Missiles 2015"
 tech_turret_missiles_aa_4_desc: "Advanced RAM systems use improved datalinks, electro-optical cueing, and more agile interceptors to defeat maneuvering aircraft, drones, and anti-ship missiles."
 tech_turret_missiles_aa_5: "Rolling Airframe Missiles 2030"
 tech_turret_missiles_aa_5_desc: "Future RAM launchers combine active seekers and automated combat-system integration to improve ship self-defense against complex attacks."
 tech_torpedoes_1: "1975 Torpedo"
 tech_torpedoes_1_desc: "Cold War torpedoes use active and passive acoustic homing to attack submarines and surface vessels from ships, submarines, or aircraft, giving fleets a reliable underwater weapon against close and medium-range threats."
 tech_torpedoes_2: "1990 Torpedo"
 tech_torpedoes_2_desc: "Improved torpedoes use better sonar processing, guidance control, and countermeasure resistance to track quieter submarines and surface ships in deeper water, shallow seas, and cluttered acoustic conditions."
 tech_torpedoes_3: "2010 Torpedo"
 tech_torpedoes_3_desc: "Modern torpedoes integrate digital guidance, upgraded seekers, and improved propulsion systems, allowing them to classify targets more accurately and resist decoys, jammers, and evasive maneuvers."
 tech_torpedoes_4: "2020 Torpedo"
 tech_torpedoes_4_desc: "Advanced torpedoes use smarter onboard electronics, fiber-optic guidance links, and refined acoustic homing to receive targeting updates, improve terminal accuracy, and remain effective against modern submarines and surface combatants."
 tech_torpedoes_5: "2035 Torpedo"
 tech_torpedoes_5_desc: "Future torpedoes combine adaptive sonar processing, wake and acoustic signature tracking, and improved counter-countermeasure logic to hunt stealthier submarines and maneuvering surface targets in contested waters."
 tech_improved_target_tracking: "발전된 목표물 추적"
 tech_improved_target_tracking_desc: "Target tracking has been relatively manual since the advent of ship-based weaponry. New technology now allows us to follow heat signatures, trails, and even follower paths from radar trajectories. Utilizing this will help make our ships a more effective fighting vessel. Expanding the use of this technology to our torpedoes will make our submarines and other torpedo-carrying vessels that much deadlier."
 tech_signature_reduction: "선박 특성 교체 및 감소"
 tech_signature_reduction_desc: "적들에게 우리 함대만의 고유의 특성이 보여지는 방식을 달리하는 것은 매우 중요한 일입니다. 우리의 장갑이 어떻게 강화되었는지, 또는 우리의 데이터가 어떻게 전송되는지 그 과정과 방법을 변경하는 것을 통해 이에 따른 위험을 감소시키는 것은 적들에게 우리의 특성을 드러나지 않게 하는 그저 작은 발걸음에 불과합니다."
 tech_improved_propulsion: "개선된 추진력"
 tech_improved_propulsion_desc: "어뢰의 추진력을 개선하는 것은 적 함선의 승무원들이 대응하기 전에 더 빠르게 함선의 중요 시스템을 타격함으로써 더욱 효과적인 공격을 가능하게 할 것입니다."
 tech_long_distance_homing: "장거리 자동 유도 장치"
 tech_long_distance_homing_desc: "어뢰에 자동 유도 장치를 가능하게 하는 것은 적 소나 시스템으로부터 우리 어뢰를 효과적으로 '숨길' 수 있거나, 또는 그들의 작전에 휘말리지 않도록 해줄 것입니다."
 tech_precision_explosive_warheads: "정밀한 폭발형 탄두"
 tech_precision_explosive_warheads_desc: "정밀한 폭팔형 탄두는 공군 기반 미사일과 포에서 유래되었습니다. 정밀한 폭발형 탄두와 함께 어뢰를 함재하는 것은 우리 어뢰들을 지배할 수 있는 경함선들에 대한 효율성을 더욱 높여줄 것입니다."
 tech_radiowave_detection: "전파 탐지"
 tech_radiowave_detection_desc: "전파 탐지를 통해서 우린 적들이 어디에 위치하고 있는지 정확히 찾아낼 수 있습니다."
 tech_modern_firefighting_equipment: "현대 소방 장비"
 tech_modern_firefighting_equipment_desc: ""
 tech_combat_repair_protocols: "전투 복구 프로토콜"
 tech_combat_repair_protocols_desc: ""
 tech_critical_system_reinforcement: "중요 시스템 강화"
 tech_critical_system_reinforcement_desc: ""
 tech_hull_spacing: "선체 간격"
 tech_hull_spacing_desc: ""
 tech_digital_status_reporting: "디지털 상황 보고"
 tech_digital_status_reporting_desc: ""
 tech_specialized_repair_equipment: "특수 수리 장비"
 tech_specialized_repair_equipment_desc: ""
 tech_flexible_backup_systems: "유연한 복구 시스템"
 tech_flexible_backup_systems_desc: ""
 tech_autonomous_helper_drones: "자동화 도우미 드론"
 tech_autonomous_helper_drones_desc: ""
 tech_autonomous_system_control_ai: "자동화 시스템 통제 AI"
 tech_autonomous_system_control_ai_desc: ""
 corvette_hull_1: "1965년형 초계함 함체"
 corvette_hull_1_desc: "전함으로 분류되는 가장 작은 등급의 선박인 초계함은, 일반적으로 대양을 책임지고 보호할 수 있는 해군 집단인 '대양 해군'에는 포함되지 않습니다. 이 작고 빠른 선박은 대부분 각 종류의 장비들로 무장하고 있고, 그렇기에 다양한 범위의 임무들을 수행할 수 있습니다. 초계함은 다른 함선들과 비교했을 때 가격과 생산비용이 적은 특성 때문에 많은 국가들이 작거나 중간 정도 규모의 해군을 위해 초계함을 사용하고 있습니다. 초계함은 주로 다음과 같은 임무에 사용됩니다 : 해안 방어와 감시, 기뢰 소해, 대잠, 대공 및 대함, 그리고 현대에선, 지상 공격 임무를 수행하기도 합니다."
 corvette_hull_2: "1980년형 초계함 함체"
 corvette_hull_2_desc: "전함으로 분류되는 가장 작은 등급의 선박인 초계함은, 일반적으로 대양을 책임지고 보호할 수 있는 해군 집단인 '대양 해군'에는 포함되지 않습니다. 이 작고 빠른 선박은 대부분 각 종류의 장비들로 무장하고 있고, 그렇기에 다양한 범위의 임무들을 수행할 수 있습니다. 초계함은 다른 함선들과 비교했을 때 가격과 생산비용이 적은 특성 때문에 많은 국가들이 작거나 중간 정도 규모의 해군을 위해 초계함을 사용하고 있습니다. 초계함은 주로 다음과 같은 임무에 사용됩니다 : 해안 방어와 감시, 기뢰 소해, 대잠, 대공 및 대함, 그리고 현대에선, 지상 공격 임무를 수행하기도 합니다."
