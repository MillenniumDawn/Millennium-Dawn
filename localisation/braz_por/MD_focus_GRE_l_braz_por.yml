 GRE_rheinmetall_lynx_digital_backbone: "Espinha Dorsal Eletrônica do Veículo"
 GRE_rheinmetall_lynx_export_package: "Configuração de Exportação OTAN"
 GRE_rheinmetall_lethality_platform: "Integração da Torre Lance 2.0"
 GRE_rheinmetall_rws_baseline: "Base da Estação de Armas Remota"
 GRE_rheinmetall_rws_30mm_upgrade: "Atualização do Canhão Mk 30-2/ABM"
 GRE_rheinmetall_rws_dual_weapon: "Sistema de Engajamento com Arma Dupla"
 GRE_rheinmetall_fire_control: "Controle de Tiro Eletro-Óptico"
 GRE_rheinmetall_hunter_killer: "Modo de Engajamento Caçador-Matador"
 GRE_rheinmetall_ammo_logistics: "Logística de Munição Padronizada"
 GRE_rheinmetall_battlefield_networking: "Integração de Gestão do Campo de Batalha"
 GRE_rheinmetall_lethality_export_package: "Pacote de Armamentos para Exportação"
 GRE_rheinmetall_hellenic_lynx_doctrine: "Doutrina de Combate Helênica do Lynx"
 GRE_vision_2030: "Visão Militar"
 GRE_vision_2030_desc: "Nossas forças armadas ficaram para trás após anos de austeridade e de um pensamento ultrapassado da Guerra Fria. Temos equipamentos envelhecidos, estruturas inchadas e um militar que não reflete as ameaças que enfrentamos. Este plano é a reforma de defesa mais ambiciosa da história grega moderna."
 GRE_armored_transition: "Transição Blindada"
 GRE_armored_transition_desc: "O BMP-1 e o M48 Patton já cumpriram seu tempo. Aposentar nossa blindagem da Guerra Fria e fazer a transição para o Leopard 2 em sua variante helênica dará às nossas brigadas blindadas uma força de tanques capaz de rivalizar com qualquer uma na região."
 GRE_pzh_2000: "Obuseiros PzH 2000"
 GRE_pzh_2000_desc: "Nossa artilharia precisa acompanhar a guerra blindada moderna. O obus autopropulsado PzH 2000 daria às nossas forças fogo preciso a longa distância e garantiria que nossos comandantes terrestres sempre tenham apoio eficaz de fogo indireto."
 GRE_m270_mlrs: "M270 MLRS"
 GRE_m270_mlrs_desc: "Cobrir desembarques em ilhas e atingir alvos costeiros no Egeu exige poder de fogo que vá além da linha de frente. O sistema de lançamento múltiplo de foguetes M270 daria ao nosso exército esse alcance."
 GRE_puls_rocket: "Sistema de Foguetes PULS"
 GRE_puls_rocket_desc: "Por meio do programa conjunto EURO-PULS com Israel e nossos parceiros europeus, podemos empregar um sistema de artilharia de foguetes de precisão capaz de atingir alvos a grande distância. Isso faria qualquer adversário no Egeu pensar duas vezes."
 GRE_special_warfare_command: "Comando de Guerra Especial"
 GRE_special_warfare_command_desc: "Unificar nossas unidades EKAM, brigadas de incursores, mergulhadores de combate e paraquedistas sob um único Comando de Guerra Especial nos daria uma força de elite capaz de operar em nossas ilhas e além. Na guerra moderna, unidades pequenas e letais podem decidir resultados que divisões inteiras não conseguem."
 GRE_archipelagos_strategy: "Estratégia dos Arquipélagos"
 GRE_archipelagos_strategy_desc: "Nossas milhares de ilhas não são um problema. Com defesa adequada e uma doutrina coerente, tornam-se uma barreira em camadas que nenhuma frota inimiga pode cruzar sem sofrer pesadas perdas. Devemos usar a geografia do Egeu a nosso favor."
 GRE_f16_modernisation: "Modernização dos F-16"
 GRE_f16_modernisation_desc: "Atualizar 83 de nossos F-16 ao padrão Block 70/72 Viper por meio da Indústria Aeroespacial Helênica manteria nossa frota de caças em bom estado e, ao mesmo tempo, construiria a expertise nacional de que precisamos para a futura manutenção dos F-35."
 GRE_intl_flight_training: "Centro Internacional de Treinamento de Voo"
 GRE_intl_flight_training_desc: "Abrir nossas instalações de treinamento de voo a nações aliadas geraria boa vontade, aprofundaria os laços militares e daria a nossos pilotos experiência de treinamento segundo padrões internacionais."
 GRE_new_transport_helicopters: "Novos Helicópteros de Transporte"
 GRE_new_transport_helicopters_desc: "O transporte rápido entre nossas ilhas é essencial para a defesa insular. Empregar 35 UH-60M Black Hawk junto com nossos MH-60R Seahawk nos daria a capacidade de içamento para reforçar qualquer posição ameaçada antes que o inimigo se entrincheire."
 GRE_f35_program: "Colaboração no Programa F-35"
 GRE_f35_program_desc: "Ingressar no programa F-35 nos dá um caça furtivo de quinta geração que ninguém na região pode igualar. O contrato assinado em julho de 2024 é um marco importante para a Força Aérea Helênica e coloca nossos pilotos à frente de todos no Egeu."
 GRE_patriot_air_defense: "Sistemas de Defesa Aérea Patriot"
 GRE_patriot_air_defense_desc: "Nossas baterias Nike Hercules são antigas demais para lidar com as ameaças modernas. Atualizar para o Patriot PAC-3 com interceptadores MSE finalmente daria à Grécia uma defesa real contra mísseis balísticos e protegeria nossa infraestrutura crítica."
 GRE_centauros_anti_drone: "Sistema Antidrone Centauros"
 GRE_centauros_anti_drone_desc: "O sistema C-UAS Centauros foi desenvolvido pela Indústria Aeroespacial Helênica e comprovado em operações no Mar Vermelho. Empregá-lo em nossas ilhas, bases navais e aeródromos é uma prioridade. Os drones são a maior ameaça na guerra moderna e precisamos ser capazes de neutralizá-los."
 GRE_achilles_shield: "Escudo de Aquiles"
 GRE_achilles_shield_desc: "Integrar nossas baterias Patriot, as defesas antidrone Centauros e os sistemas de mísseis costeiros em uma rede unificada que cobre todo o Egeu criaria uma zona de negação de acesso que torna qualquer ataque ao território grego extremamente custoso."
 GRE_kimon_class_frigate: "Fragata Classe Kimon"
 GRE_kimon_class_frigate_desc: "Após anos de programas cancelados, finalmente assinamos com a Naval Group por três fragatas FDI HN, com opção para uma quarta. A classe Kimon dará à Marinha Helênica um combatente de superfície de verdade, capaz de enfrentar qualquer frota da região."
 GRE_hydra_class_upgrade: "Modernização da Classe Hydra"
 GRE_hydra_class_upgrade_desc: "As fragatas da classe Hydra são navios MEKO 200HN construídos em Skaramangas na década de 1990 e formam a espinha dorsal de nossa força de superfície. Uma atualização de meia-vida em seus radares, conjuntos de guerra eletrônica e mísseis antinavio os manteria eficazes em combate por décadas."
 GRE_elli_class: "Programa de Substituição da Classe Elli"
 GRE_elli_class_desc: "As fragatas da classe Elli são antigos navios holandeses da classe Van Speijk transferidos a nós na década de 1980 e há muito excederam sua vida útil. Precisamos de cascos de substituição, construídos internamente em Skaramangas ou adquiridos no exterior, para restaurar nossa força de fragatas."
 GRE_roussen_attack_craft: "Lanchas de Ataque Rápido Classe Roussen"
 GRE_roussen_attack_craft_desc: "O Egeu não é um oceano aberto, são águas estreitas perfeitas para lanchas de ataque rápido. A classe Roussen foi feita exatamente para isso: rápida, armada com mísseis e letal a curta distância. Uma nova geração dessas embarcações poderia negar a qualquer frota hostil o acesso às águas gregas."
 GRE_fremm_frigate: "Fragatas Multimissão FREMM"
 GRE_fremm_frigate_desc: "Nossa frota precisa de mais navios. Podemos adquirir rapidamente as comprovadas fragatas italianas FREMM ou investir em uma quinta FDI da Naval Group. Cada opção tem vantagens diferentes em termos de rapidez, capacidade e relações de aliança."
 GRE_submarine_expansion: "Programa de Aquisição do Tipo 214"
 GRE_submarine_expansion_desc: "A classe Papanikolis representa o que há de melhor em guerra submarina convencional. A propulsão independente do ar permite que nossos barcos fiquem submersos por semanas sem emergir. Expandir e manter este programa fortaleceria nosso controle do domínio submarino do Egeu."
 GRE_bluewhale_submarines: "Submarinos BlueWhale"
 GRE_bluewhale_submarines_desc: "Submarinos autônomos não tripulados da Israeli Aerospace acrescentariam uma capacidade que ninguém na região pode igualar. Esses sistemas operam sem tripulação e sem risco, dando à nossa marinha uma presença submarina persistente."
 GRE_defense_manufacturing: "Mandato de Fabricação Local"
 GRE_defense_manufacturing_desc: "Uma exigência de 25 por cento de conteúdo local em todos os grandes programas de defesa garantiria que nossa indústria nacional se beneficie de cada contrato. A EAS, a HAI e nossos estaleiros se fortaleceriam e reduziríamos nossa dependência de fornecedores estrangeiros."
 GRE_research_hubs: "Polos de Pesquisa"
 GRE_research_hubs_desc: "Uma colaboração formal entre nossas universidades, a Indústria Aeroespacial Helênica e o Ministério da Defesa criaria um fluxo de inovação para as forças armadas."
 GRE_defense_innovation_center: "Centro Helênico de Inovação em Defesa"
 GRE_defense_innovation_center_desc: "Um centro de inovação dedicado, conectando startups, universidades e parceiros da indústria de defesa, ajudaria a acelerar o desenvolvimento de tecnologia militar de próxima geração na Grécia."
 GRE_communication_satellites: "Satélites de Comunicação"
 GRE_communication_satellites_desc: "Satélites militares de comunicação dedicados nos dariam cobertura aérea persistente do Egeu e uma espinha dorsal de comunicações segura para todos os ramos das forças armadas."
 GRE_theon_international: "Expansão Internacional da Theon"
 GRE_theon_international_desc: "A Theon International tem uma forte reputação global em visão noturna e sistemas ópticos. Apoiar sua expansão a novos mercados de exportação geraria receita e construiria relações de defesa, mostrando que a indústria grega pode competir no mais alto nível."
 GRE_industrial_synergy: "Sinergia Industrial"
 GRE_industrial_synergy_desc: "Nossos programas de defesa funcionam melhor quando nossas indústrias cooperam. Uma coordenação formal entre a HAI, nossos estaleiros, a EAS e nossas instituições de pesquisa tornaria cada programa mais rápido, mais barato e mais capaz."
 GRE_irix_loitering: "Munições Vagantes IRIX"
 GRE_irix_loitering_desc: "A Hellenic Defence Systems se associou à Paramount Industries para produzir o IRIX, a primeira munição vagante feita na Grécia. Com alcance de até 100 quilômetros, dá às nossas forças uma capacidade de ataque de precisão que alcança o fundo do território inimigo sem depender de fornecedores estrangeiros."
 GRE_lora_ballistic: "Sistema de Mísseis Balísticos LORA"
 GRE_lora_ballistic_desc: "O sistema de mísseis balísticos LORA da Israel Aerospace Industries nos daria uma capacidade de ataque de precisão de longo alcance, com 400 quilômetros. Esse alcance muda significativamente o equilíbrio no Egeu e dá a qualquer adversário em potencial algo sério em que pensar."
 GRE_iniochos: "Programa de Exercícios Iniochos"
 GRE_iniochos_desc: "O exercício anual Iniochos em Andravida tornou-se um dos principais eventos multinacionais de treinamento aéreo da Europa. Ampliar a participação e tornar os cenários mais complexos aprimorará nossos pilotos e fortalecerá nossas relações militares com nações aliadas."
 GRE_grypas_ucav: "Programa UCAV Grypas"
 GRE_grypas_ucav_desc: "A Indústria Aeroespacial Helênica desenvolveu o Grypas, nosso primeiro drone de combate projetado internamente. Investir neste programa nos dá uma capacidade de ataque não tripulada que não depende de restrições de exportação estrangeiras ou condições políticas."
 GRE_integrated_air_defense: "Rede Integrada de Defesa Aérea"
 GRE_integrated_air_defense_desc: "Ligar as baterias Patriot, o escudo de mísseis Aquiles, os sistemas antidrone e nossa cobertura de radar em uma única rede em camadas dá à Grécia um céu que nenhuma aeronave ou drone hostil cruza sem resposta. Cada sensor e cada interceptador agora luta como um único sistema."
 GRE_strategic_transport_fleet: "Frota de Transporte Estratégico"
 GRE_strategic_transport_fleet_desc: "Nossa defesa insular é tão boa quanto nossa capacidade de reabastecer e reforçá-la. Modernizar nossa frota de C-27J e adquirir mais transportes C-130H garantiria que nenhuma guarnição fique sem apoio e nenhuma ilha seja isolada em uma crise."
 GRE_constellation_co_production: "Coprodução da Classe Constellation"
 GRE_constellation_co_production_desc: "Junto com os Estados Unidos, começamos a planejar a coprodução da fragata classe Constellation FFG-62. Essa parceria acrescenta navios de guerra de classe mundial à nossa frota e desenvolve a expertise e a capacidade de nossos estaleiros em Skaramangas e Elefsina."
 GRE_eyes_of_poseidon: "Olhos de Poseidon"
 GRE_eyes_of_poseidon_desc: "Não podemos defender o que não podemos ver. Integrar aeronaves de patrulha marítima, estações de radar costeiras e imagens de satélite em uma rede de vigilância unificada nos daria plena consciência dos mares Egeu e Jônico."
 GRE_souda_bay_expansion: "Expansão da Base Naval da Baía de Suda"
 GRE_souda_bay_expansion_desc: "A Baía de Suda é um dos portos mais estrategicamente valiosos do Mediterrâneo. Ampliar nossa cooperação com os Estados Unidos e a OTAN nessa instalação fortaleceria nossas alianças e consolidaria o papel da Grécia como âncora-chave no flanco sul da OTAN."
 GRE_alexandroupolis_strategic_hub: "Polo Estratégico de Alexandrópolis"
 GRE_alexandroupolis_strategic_hub_desc: "O porto de Alexandrópolis tornou-se um corredor logístico vital da OTAN para a Europa Oriental, contornando totalmente o Bósforo. Investir em sua infraestrutura e trabalhar mais de perto com a Bulgária e a Romênia o transformaria em um ativo estratégico permanente."
 GRE_spike_atgm_integration: "Integração do ATGM Spike"
 GRE_spike_atgm_integration_desc: "Nossa infantaria e nossos veículos blindados precisam de um míssil antitanque guiado moderno capaz de atingir alvos além da linha de visada. Integrar a família de mísseis Spike em nossas forças terrestres e embarcações de patrulha naval daria a todo comandante uma opção de ataque de precisão."
 GRE_stinger_manpads: "Modernização dos MANPADS"
 GRE_stinger_manpads_desc: "Nossas guarnições insulares e unidades avançadas enfrentam ameaças aéreas que grandes baterias de defesa aérea não conseguem cobrir de forma econômica. Modernizar e ampliar nosso inventário de MANPADS Stinger daria a toda unidade de infantaria e embarcação de patrulha uma capacidade orgânica de defesa aérea."
 GRE_infantry_digitisation: "Programa de Digitalização da Infantaria"
 GRE_infantry_digitisation_desc: "Os soldados modernos precisam compartilhar o mesmo quadro operacional do piloto acima e da fragata ao largo. Equipar nossa infantaria com sistemas de gestão de campo de batalha, comunicações criptografadas e equipamento digital de designação de alvos os conectaria à rede maior em vez de deixá-los operando isolados."
 GRE_sovereign_waters: "Águas Soberanas"
 GRE_sovereign_waters_desc: "Por décadas, outros desafiaram nossos direitos soberanos no Egeu e no Mediterrâneo Oriental e não tínhamos marinha para fazer muito a respeito. Com uma frota modernizada e defesas insulares adequadas, agora podemos afirmar o que o direito internacional sempre nos concedeu. Nossa zona econômica exclusiva é nossa."
 GRE_rheinmetall_greece: "Rheinmetall na Grécia"
 GRE_rheinmetall_greece_desc: "A Rheinmetall quer instalar montagem e manutenção locais na Grécia como parte de futuros acordos de aquisição. Formalizar essa parceria e integrar sua produção à nossa indústria de defesa nacional fortaleceria a modernização de nossas forças terrestres e faria da Grécia um polo de fabricação de defesa no sudeste da Europa."
 GRE_joint_operations_reform: "Reforma das Operações Conjuntas"
 GRE_joint_operations_reform_desc: "Nossos três ramos passaram décadas operando separadamente, cada um com suas doutrinas e culturas de comando. Uma estrutura unificada de operações conjuntas que faça o exército, a marinha e a força aérea planejarem, treinarem e lutarem juntos é essencial. Tudo o mais que queremos fazer depende disso."
 GRE_new_army_doctrine: "Da Massa à Manobra"
 GRE_new_army_doctrine_desc: "O Exército Helênico foi construído para manter uma linha na Trácia com o maior número possível de homens. Essa guerra nunca veio. Precisamos nos reestruturar em torno de grupos de brigada menores e mais rápidos, capazes de se deslocar rapidamente pelo Egeu e responder a ameaças antes que se tornem crises."
 GRE_nco_reform: "A Espinha Dorsal do Exército"
 GRE_nco_reform_desc: "Esperou-se sempre que os oficiais gregos tomassem todas as decisões até o nível de pelotão, porque os suboficiais nunca receberam autoridade ou treinamento para agir por conta própria. Construir um corpo profissional de suboficiais capaz de liderar e se adaptar sem esperar ordens superiores tornaria o exército muito mais eficaz."
 GRE_thrace_to_aegean: "Reorientando o Exército"
 GRE_thrace_to_aegean_desc: "Por quarenta anos, nossas forças terrestres olharam para o nordeste, em direção ao rio Evros. Essa ameaça não desapareceu, mas já não é nossa única preocupação. Devemos reorientar nosso emprego principal para as ilhas e litorais do Egeu, onde a soberania é testada todos os dias."
 GRE_joint_fires_doctrine: "Escola de Armas Combinadas"
 GRE_joint_fires_doctrine_desc: "Artilharia, blindados, infantaria e apoio aéreo aproximado operaram em compartimentos isolados por tempo demais. A guerra de armas combinadas precisa se tornar o padrão, com todas as unidades treinando juntas. Nossos soldados precisam saber como trabalhar com apoio aéreo, e não apenas ler a respeito."
 GRE_sead_doctrine: "Supressão das Defesas Inimigas"
 GRE_sead_doctrine_desc: "Nossos pilotos estão entre os mais experientes da OTAN em contra-ataque aéreo defensivo sobre o Egeu, mas os ataques ofensivos contra alvos defendidos ainda são pouco desenvolvidos. Precisamos de uma doutrina SEAD dedicada, usando o SCALP e o Meteor do Rafale para eliminar as defesas aéreas inimigas antes da entrada dos pacotes de ataque."
 GRE_iniochos_as_doctrine: "Lições do Iniochos"
 GRE_iniochos_as_doctrine_desc: "Todo ano o Iniochos reúne pilotos de vinte nações para aprender o que funciona em espaço aéreo contestado. Realizamos esse exercício há anos sem traduzir plenamente as lições em doutrina. As conclusões de cada ciclo devem ser formalizadas em táticas e procedimentos atualizados e adotadas em toda a Força Aérea Helênica."
 GRE_cas_doctrine: "Integração do Apoio Aéreo Aproximado"
 GRE_cas_doctrine_desc: "A Força Aérea Helênica e o Exército Helênico raramente treinaram juntos no nível necessário para um apoio aéreo aproximado eficaz. São necessários um fluxo permanente de treinamento conjunto e protocolos de comunicação padronizados para que comandantes terrestres e pilotos de caça possam realmente trabalhar juntos quando importa."
 GRE_aegean_fortress_doctrine: "O Egeu como Nosso Mar"
 GRE_aegean_fortress_doctrine_desc: "O Egeu não é um oceano aberto. É um labirinto de seis mil ilhas, estreitos, bancos rasos e pontos de estrangulamento. Um defensor bem preparado pode tornar essa geografia extremamente perigosa para qualquer frota atacante. Precisamos de uma marinha que faça de cada aproximação ao território grego um risco que ninguém queira correr."
 GRE_aegean_fortress_doctrine_tt: "[GREadmiraldefenseeffect]"
 GRE_aegean_fortress_doctrine_effect: "Almirantes: §G30% de chance§! de ganhar §Y+1 Defesa§! ao subir de nível."
 GRE_submarine_wolf_packs: "Doutrina de Guerra Submarina"
 GRE_submarine_wolf_packs_desc: "Os submarinos são a arma mais perigosa do Egeu. A água é rasa demais para o inimigo se esconder, mas funda o bastante em locais certos para os nossos. Treinar nossas tripulações para operar em grupos coordenados, compartilhando dados de alvos e cobrindo as áreas de patrulha uns dos outros, significaria que nenhuma frota de superfície poderia atravessar o Egeu sem ser rastreada por baixo."
 GRE_missile_corvette_network: "A Rede Roussen"
 GRE_missile_corvette_network_desc: "Nossas corvetas lança-mísseis da classe Roussen são rápidas e letais, perfeitas para o Egeu, mas nunca operaram como uma rede coordenada. Integrá-las com radares costeiros, sensores insulares e relatórios de contato de submarinos em um único quadro de alvos permitiria que qualquer corveta engajasse qualquer ameaça de superfície em minutos."
 GRE_aegean_minefield_doctrine: "Os Estreitos Minados"
 GRE_aegean_minefield_doctrine_desc: "A Grécia tem capacidade de minagem naval desde a Segunda Guerra Mundial, mas nunca foi devidamente integrada à doutrina. Campos minados pré-planejados para cada grande acesso ao Egeu, prontos para ativação em poucas horas, transformariam os estreitos em barreiras que nem uma frota superior consegue cruzar com segurança."
 GRE_sea_denial_complete: "Egeu Fortaleza"
 GRE_sea_denial_complete_desc: "O Mar Egeu é agora totalmente um domínio operacional grego. Cada camada de nossa defesa marítima, submarinos, corvetas, fragatas, minas e mísseis costeiros, foi integrada em uma única doutrina de negação marítima. Podemos não ter a maior marinha do Mediterrâneo, mas temos a mais perigosa para quem tentar avançar sobre nossas águas."
 GRE_eastern_med_doctrine: "Além do Egeu"
 GRE_eastern_med_doctrine_desc: "Os interesses gregos não terminam no Dodecaneso. Nossos direitos de ZEE ao sul de Creta, nosso compromisso com Chipre e nossas parcerias energéticas com Israel e Egito exigem uma marinha capaz de operar longe de casa por períodos prolongados. Precisamos de uma frota crível em todo o Mediterrâneo Oriental, não apenas no Egeu."
 GRE_asw_training: "Caçando Submarinos"
 GRE_asw_training_desc: "A guerra antissubmarino é a habilidade mais exigente e mais negligenciada da Marinha Helênica. Nossas novas fragatas têm excelentes sensores e torpedos ASW, mas as tripulações precisam de treinamento dedicado para usá-los adequadamente. Um programa permanente de treinamento ASW, apoiado em nossa própria força submarina, ensinaria às tripulações de superfície como os submarinos inimigos realmente operam."
 GRE_fleet_coordination: "Comando Naval Único"
 GRE_fleet_coordination_desc: "Operar pelo Mediterrâneo Oriental exige uma coordenação que comandos de esquadrão fragmentados não conseguem oferecer. Reestruturar a Marinha Helênica sob um único comando operacional, com consciência em tempo real de cada navio, submarino e aeronave de patrulha, tornaria a frota muito mais eficaz como um todo."
 GRE_eastern_med_taskforce: "Domínio Operacional do Mediterrâneo"
 GRE_eastern_med_taskforce_desc: "Com o Egeu seguro, precisamos estender nosso alcance pelo Mediterrâneo. Reestruturar nosso fluxo de treinamento, reformar os rodízios da frota e realizar desdobramentos prolongados construirá a capacidade de rastrear e engajar qualquer frota hostil em toda a extensão do Mediterrâneo."
 GRE_eastern_med_supremacy: "Supremacia no Mediterrâneo Oriental"
 GRE_eastern_med_supremacy_desc: "Uma força-tarefa expedicionária permanente, sustentada por docas secas modernas e operando do mar Jônico à bacia do Levante, faz da Marinha Helênica a potência marítima decisiva do Mediterrâneo oriental. Projetar poder nessa escala responde a qualquer desafio antes que chegue às águas gregas."
 GRE_landforces_modifier: "Exército Helênico"
 GRE_landforces_modifier_desc: "A Grécia emprega uma força terrestre calejada pela guerra, moldada por décadas de tensão no Egeu. Nosso exército é treinado, equipado e posicionado para defender cada metro do solo grego."
 GRE_airforce_modifier: "Força Aérea Helênica"
 GRE_airforce_modifier_desc: "A Força Aérea Helênica controla os céus sobre o Egeu. Nossos pilotos estão entre os mais experientes da OTAN, forjados por interceptações diárias e espaço aéreo contestado."
 GRE_navy_modifier: "Marinha Helênica"
 GRE_navy_modifier_desc: "A Grécia é uma nação marítima. Nossa frota de fragatas, submarinos e lanchas de ataque rápido patrulha águas que são gregas desde a antiguidade."
 GRE_cold_war_giant_1: "Exército da Guerra Fria"
 GRE_cold_war_giant_1_desc: "Nosso exército foi construído para barrar um avanço soviético pelos Bálcãs. Essa guerra nunca veio. Agora temos formações superdimensionadas, caras de guarnecer, lentas para se mover e treinadas para um campo de batalha que não existe mais."
 GRE_aircraft_bad_1: "Força Aérea da Guerra Fria"
 GRE_aircraft_bad_1_desc: "Nossa frota aérea é uma colcha de retalhos de aeronaves da era da Guerra Fria. Fuselagens grandes são caras de manter e nossos pilotos carecem de doutrina para projetar poder além do Egeu. A aviação estratégica e a vigilância são grandes lacunas."
 GRE_navy_bad_1: "Marinha da Guerra Fria"
 GRE_navy_bad_1_desc: "Nossa frota parece grande no papel, mas é uma bagunça na prática. Cascos de segunda mão de três marinhas diferentes significam três cadeias logísticas diferentes. Os custos de combustível são altos demais, a cobertura antiaérea tem lacunas e nossos oficiais são treinados para patrulha costeira, e não para operações de frota."
 GRE_defense_industry: "Arsenal do Egeu"
 GRE_defense_industry_modifier: "Arsenal do Egeu"
 GRE_defense_industry_modifier_desc: "Dos estaleiros de Skaramangas às fábricas de armas em torno do Pireu, a indústria grega abastece as forças armadas há gerações. Temos nossa própria indústria de defesa e devemos usá-la."
 GRE_research_hubs_idea_tt: "[GREresearchhubidea]"
 GRE_archipelagos_defense_plan: "Escudo do Egeu"
 GRE_archipelagos_defense_plan_desc: "Uma arquitetura de defesa em camadas que trata o arquipélago do Egeu como uma rede integrada de fortalezas. Reparo rápido, baterias costeiras, negação de suprimentos e cobertura de mísseis se combinam para tornar custosa qualquer aproximação às águas gregas."
 GRE_archipelagos_defense_plan_country: "Escudo do Egeu"
 GRE_archipelagos_defense_plan_country_desc: "Uma arquitetura de defesa em camadas que trata o arquipélago do Egeu como uma rede integrada de fortalezas. Reparo rápido, baterias costeiras, negação de suprimentos e cobertura de mísseis se combinam para tornar custosa qualquer aproximação às águas gregas."
 GRE_defense_innovation_research_mission: "Ciclo de Pesquisa em Inovação de Defesa"
 GRE_defense_innovation_research_mission_desc: "O Centro Helênico de Inovação em Defesa impulsiona pesquisas contínuas em todos os ramos das forças armadas. A cada 100 dias, pode surgir um avanço em blindagem, artilharia, sistemas de infantaria, aviação ou tecnologia naval."
 GRE_aegean_survey: "Levantamento do Leito Marinho do Egeu"
 GRE_aegean_survey_desc: "Mapeamos o que é nosso. Um levantamento geológico completo do leito marinho do Egeu estabelecerá a extensão de nossas reservas de hidrocarbonetos e preparará o terreno para a extração."
 GRE_aegean_surveyed: "Águas do Egeu Mapeadas"
 GRE_aegean_extraction: "Extração de Petróleo no Egeu"
 GRE_aegean_extraction_desc: "Os levantamentos estão concluídos. Começamos a extrair dos campos do Egeu. Petróleo grego de águas gregas para a economia grega."
 GRE_aegean_extracting: "Petróleo do Egeu Extraído"
 GRE_aegean_offshore_industry: "Indústria Offshore do Egeu"
 GRE_aegean_offshore_industry_desc: "A extração gera indústria. Construímos a infraestrutura de apoio para processar e distribuir o que tiramos do leito marinho do Egeu."
 GRE_crete_survey: "Levantamento do Leito Marinho ao Sul de Creta"
 GRE_crete_survey_desc: "As águas ao sul de Creta guardam um potencial considerável inexplorado. Estendemos nossas operações de levantamento às bacias Jônica e do Levante."
 GRE_crete_surveyed: "Águas de Creta Mapeadas"
 GRE_crete_extraction: "Extração de Petróleo ao Sul de Creta"
 GRE_crete_extraction_desc: "As águas gregas mais profundas rendem as maiores reservas. Começamos a extração ao sul de Creta e asseguramos o futuro econômico da nação."
 GRE_crete_extracting: "Petróleo de Creta Extraído"
 GRE_crete_offshore_industry: "Indústria Offshore ao Sul de Creta"
 GRE_crete_offshore_industry_desc: "Os campos do sul estão produzindo. Construímos a capacidade industrial para transformar a extração bruta em produção econômica duradoura."
 TUR_naval_expansion_response: "Programa de Expansão Naval"
 TUR_naval_expansion_response_desc: "Em resposta à assertividade marítima grega, a Turquia acelera seu programa de construção naval. Os estaleiros operam com capacidade ampliada para fechar a lacuna no Mediterrâneo Oriental."
 GRE_creditor_management_category: "Gestão da Dívida Grega"
 GRE_creditor_management_category_desc: "Como detentores da dívida soberana grega, podemos cobrar partes da dívida ou perdoá-la por completo. Nossas posições atuais geram receita regular de juros de Atenas."
 GRE_propose_debt_deal: "Propor Acordo de Dívida"
 GRE_propose_debt_deal_desc: "Propor que uma nação estrangeira assuma parte de nossa dívida nacional em troca de pagamentos regulares de juros. Transferiremos 10% de nossa dívida atual ao credor selecionado, subindo para 25% quando a dívida ultrapassar 90% do PIB."
 GRE_repay_creditor: "Pagar Credor"
 GRE_repay_creditor_desc: "Fazer um pagamento único para reduzir em 10% do valor devido nossa dívida pendente com este credor."
 GRE_creditor_call_in_debt: "Cobrar a Dívida Grega"
 GRE_creditor_call_in_debt_desc: "Exigir que a Grécia pague imediatamente 20% da dívida que nos deve. Esta é uma ação diplomática severa que pode prejudicar as relações."
 GRE_creditor_forgive_debt: "Perdoar a Dívida Grega"
 GRE_creditor_forgive_debt_desc: "Cancelar 25% da dívida que a Grécia nos deve como gesto de boa vontade. Isso melhorará significativamente as relações com Atenas."
 greece_debt.10.t: "Proposta de Dívida Grega"
 greece_debt.10.d: "[FROM.GetName] nos procurou com uma proposta para assumirmos parte de sua dívida nacional. Em troca, receberíamos pagamentos regulares de juros sobre o valor mantido. A quantia proposta é modesta, mas representa uma fonte de renda confiável."
 greece_debt.10.a: "Aceitar os termos"
 greece_debt.10.b: "Não temos interesse"
 greece_debt.10.c: "Somente com uma taxa maior"
 greece_debt.12.t: "Acordo de Dívida Aceito"
 greece_debt.12.d: "[FROM.GetName] concordou em assumir parte de nossa dívida nacional. Faremos pagamentos regulares de juros a eles, mas nosso fardo geral de dívida foi reestruturado."
 greece_debt.12.a: "Um arranjo necessário"
 greece_debt.13.t: "Acordo de Dívida Rejeitado"
 greece_debt.13.d: "[FROM.GetName] recusou nossa proposta de manter parte de nossa dívida. Devemos buscar alívio em outro lugar ou encontrar outros meios de resolver nossa situação financeira."
 greece_debt.13.a: "Encontraremos outro caminho"
 greece_debt.14.t: "Contraproposta Recebida"
 greece_debt.14.d: "[FROM.GetName] está disposto a manter nossa dívida, mas somente a uma taxa de juros maior do que a que propusemos inicialmente. O custo mais alto de servir essa dívida deve ser pesado contra o alívio imediato que ela proporciona."
 greece_debt.14.a: "Aceitar a taxa maior"
 greece_debt.14.b: "Os termos são inaceitáveis"
 greece_debt.16.t: "Dívida Cobrada"
 greece_debt.16.d: "[FROM.GetName] exige o pagamento imediato de parte da dívida que lhe devemos. O descumprimento prejudicará nosso relacionamento e nossa credibilidade internacional."
 greece_debt.16.a: "Pagar o que exigem"
 greece_debt.16.b: "Não podemos pagar isso"
 greece_debt.17.t: "Dívida Perdoada"
 greece_debt.17.d: "[FROM.GetName] generosamente cancelou parte da dívida que lhe devemos. Esse alívio inesperado reduz consideravelmente nosso fardo financeiro."
 greece_debt.17.a: "Um alívio bem-vindo"
 greece_debt.18.t: "Dívida Grega Totalmente Paga"
 greece_debt.18.d: "[FROM.GetName] pagou integralmente toda a dívida pendente conosco. Embora percamos uma fonte de receita de juros, o pagamento demonstra responsabilidade fiscal."
 greece_debt.18.a: "A conta está quitada"
 greece_debt.2.t: "Proposta de Troca de Dívida"
 greece_debt.2.d: "[FROM.GetName] pede que consideremos assumir parte de sua dívida nacional por meio de um acordo de troca."
 GRE_eligible_creditor_tt: "Não deve estar em guerra com a Grécia, ser independente, ainda não ser credor e ter opinião acima de -50"
 GRE_debt_ratio_above_50_tt: "A relação dívida/PIB deve estar acima de 50%"
 GRE_debt_ratio_above_90_tt: "A relação dívida/PIB deve estar acima de 90%"
 GRE_propose_debt_deal_accept_tt: "O credor assume uma parte de nossa dívida, reduzindo nossa dívida nacional em troca de pagamentos contínuos de juros."
 GRE_creditor_call_in_debt_accept_tt: "A Grécia paga a parte cobrada da dívida que nos deve."
 GRE_creditor_call_in_debt_reject_tt: "A Grécia se recusa a pagar, azedando as relações entre nossas nações."
 GRE_retry_outreach_accept_tt: "Eles aceitam nossa aproximação, melhorando as relações e avançando nosso alinhamento."
 GRE_repay_10pct_tt: "Pagar 10% da dívida devida a este credor."
 GRE_call_in_20pct_tt: "Exigir o pagamento de 20% da dívida grega que detemos."
 GRE_forgive_25pct_tt: "Perdoar 25% da dívida que a Grécia nos deve."
 GRE_eastmed_jor_accept_tt: "A Jordânia ingressa no fórum, melhorando as relações e abrindo um acordo comercial conosco."
 GRE_eastmed_jor_reject_tt: "A Jordânia recusa, custando-nos capital político."
 GRE_interest_rate_below_cap_tt: "A taxa de juros deve estar abaixo de 8%"
 GRE_interest_rate_above_min_tt: "A taxa de juros deve estar acima de 0,5%"
 GRE_creditor_holds_significant_debt_tt: "Detemos mais de §Y10 bilhões§! em §YDívida Grega§! (Atual §Y[?GRE_debt_held_by_us|1] bilhões§!)"
 GRE_deferred_to_creditors_tt: "Custos adiados distribuídos proporcionalmente entre as nações credoras"
 GRE_prospecting_category: "Prospecção de Recursos Gregos"
 GRE_prospecting_category_desc: "Nossos levantamentos geológicos identificaram depósitos minerais promissores no continente e nas ilhas gregas. Com a tecnologia de escavação e a infraestrutura certas, podemos desenvolver esses locais em minas produtivas."
 GRE_prospecting_unlocked_tt: "Desbloqueia decisões de prospecção de recursos"
 GRE_halkidiki_prospecting: "Expansão da Mineração em Calcídica"
 GRE_halkidiki_prospecting_desc: "A península da Calcídica, no norte da Grécia, abriga importantes depósitos de cromo e ouro. Os distritos de mineração de Skouries e Stratoni podem ser ampliados com técnicas modernas de escavação."
 GRE_peloponnese_bauxite: "Extração de Bauxita no Peloponeso"
 GRE_peloponnese_bauxite_desc: "As minas de Distomo e o distrito de Fócida contêm reservas substanciais de bauxita. A extração progressiva pode abastecer nossa indústria de alumínio por décadas."
 GRE_thessaly_mining: "Mineração de Níquel na Tessália"
 GRE_thessaly_mining_desc: "Os depósitos de laterita de níquel de Larymna, na Tessália, representam uma das maiores reservas de níquel da Europa. A extração sistemática renderá aço e subprodutos de cromo."
 GRE_aegean_mining: "Extração Mineral nas Ilhas do Egeu"
 GRE_aegean_mining_desc: "As ilhas vulcânicas do Egeu, em especial Milos e Naxos, contêm depósitos de bentonita, perlita e esmeril que podem ser explorados comercialmente."
 GRE_pipeline_infrastructure: "Infraestrutura de Oleodutos"
 GRE_pipeline_infrastructure_desc: "Uma rede de dutos ligando os locais de prospecção às refinarias existentes e aos consumidores industriais torna a extração comercialmente viável e integra o setor de recursos à rede energética grega em geral."
 greece.28.t: "Proposta de Investimento Industrial Chinês"
 greece.28.d: "[FROM.GetName] nos procurou para investir em sua base industrial. Propõem que financiemos a construção de uma fábrica na Tessália em troca de influência comercial sobre sua economia em crescimento."
 greece.28.a: "Um investimento sólido"
 greece.28.b: "Não temos interesse na indústria grega"
 greece.29.t: "Investimento Chinês Aceito"
 greece.29.d: "A China concordou em financiar nossa expansão industrial na Tessália. Uma nova fábrica será construída com capital chinês, aprofundando nossos laços econômicos com Pequim."
 greece.29.a: "Excelente notícia"
 greece.30.t: "Investimento Chinês Recusado"
 greece.30.d: "A China recusou nossa proposta de investimento industrial. Ainda podemos prosseguir com a construção por conta própria, embora às nossas custas."
 greece.30.a: "Nós mesmos financiaremos"
 greece.30.b: "O projeto não é viável sem capital estrangeiro"
 greece.31.t: "Proposta de Investimento no Porto do Pireu"
 greece.31.d: "[FROM.GetName] propõe investimento chinês no porto do Pireu. A COSCO Shipping adquiriria uma participação majoritária na autoridade portuária, financiando grandes melhorias de infraestrutura em troca do controle comercial de um dos portos mais movimentados do Mediterrâneo."
 greece.31.a: "O Pireu é um ativo estratégico que vale o investimento"
 greece.31.b: "Não investiremos em portos gregos"
 greece.32.t: "COSCO Adquire Participação no Pireu"
 greece.32.d: "A China concordou em investir no Pireu. A COSCO Shipping financiará a expansão do porto, acrescentando nova capacidade de estaleiro e infraestrutura. A influência chinesa em nossa economia cresce, mas nossa capacidade portuária também."
 greece.32.a: "O porto prosperará"
 greece.33.t: "China Recusa Investimento no Pireu"
 greece.33.d: "A China recusou investir no Pireu. Ainda podemos modernizar o porto por conta própria, mas sem capital chinês o custo recai inteiramente sobre nosso tesouro."
 greece.33.a: "Nós mesmos modernizaremos o Pireu"
 greece.33.b: "O porto pode esperar"
 greece.34.t: "Proposta de Desenvolvimento Imobiliário Grego"
 greece.34.d: "[FROM.GetName] nos procurou para desenvolver imóveis comerciais na região da Ática. Incorporadores chineses financiariam a construção de shopping centers, hotéis e edifícios de escritórios em troca de arrendamentos de longo prazo e presença comercial."
 greece.34.a: "Imóveis gregos são um investimento atraente"
 greece.34.b: "Não temos interesse em imóveis gregos"
 greece.35.t: "Investimento Imobiliário Chinês Aceito"
 greece.35.d: "Incorporadores chineses financiarão grandes projetos de construção por toda a Ática. Nova capacidade comercial e residencial transformará a região, embora a presença comercial chinesa cresça significativamente."
 greece.35.a: "A construção começa"
 greece.36.t: "China Recusa Investimento Imobiliário"
 greece.36.d: "A China recusou investir em nosso setor imobiliário. Ainda podemos prosseguir com o desenvolvimento usando capital nacional."
 greece.36.a: "Nós mesmos desenvolveremos"
 greece.36.b: "O desenvolvimento pode esperar"
 greece.37.t: "Proposta de Investimento em Infraestrutura Nacional"
 greece.37.d: "[FROM.GetName] propõe um programa abrangente de infraestrutura em toda a Grécia. Estatais chinesas financiariam aeroportos, fábricas e a construção de escritórios em todo o país em troca de substancial influência comercial."
 greece.37.a: "A Grécia está pronta para o desenvolvimento"
 greece.37.b: "O escopo desta proposta nos preocupa"
 greece.38.t: "Investimento Nacional Chinês Aceito"
 greece.38.d: "A China se comprometeu com um programa nacional de infraestrutura. Novos aeroportos, fábricas e edifícios comerciais serão construídos em toda a Grécia às custas da China."
 greece.38.a: "Uma parceria transformadora"
 greece.39.t: "China Recusa Investimento Nacional"
 greece.39.d: "A China recusou nossa proposta de investimento nacional. Ainda podemos construir a infraestrutura por conta própria, embora o custo seja considerável."
 greece.39.a: "Nós mesmos construiremos"
 greece.39.b: "Caro demais sem apoio estrangeiro"
 greece.40.t: "Proposta de Desenvolvimento de Elliniko"
 greece.40.d: "[FROM.GetName] propõe investimento chinês no antigo local do Aeroporto Internacional de Elliniko. O enorme projeto costeiro transformaria pistas abandonadas em um distrito urbano moderno, com melhorias de infraestrutura em toda a Ática e no Peloponeso."
 greece.40.a: "O projeto Elliniko tem grande potencial"
 greece.40.b: "Não investiremos neste projeto"
 greece.41.t: "Investimento Chinês em Elliniko Aceito"
 greece.41.d: "A China concordou em financiar o projeto de redesenvolvimento de Elliniko. As melhorias de infraestrutura se estenderão pela Ática e pelo Peloponeso."
 greece.41.a: "Começa um projeto emblemático"
 greece.42.t: "China Recusa Investimento em Elliniko"
 greece.42.d: "A China recusou investir no redesenvolvimento de Elliniko. Ainda podemos prosseguir com o projeto usando nossos próprios fundos, ou arquivar os planos."
 greece.42.a: "Nós mesmos financiaremos"
 greece.42.b: "Arquivar o projeto por ora"
 greece.46.t: "Pedido de Empréstimo ao ICBC"
 greece.46.d: "[FROM.GetName] procurou o Banco Industrial e Comercial da China em busca de um empréstimo substancial. Propõem que o ICBC conceda crédito equivalente a 10% de seu PIB, aprofundando nossos laços financeiros com Atenas e ampliando a presença bancária chinesa no Mediterrâneo."
 greece.46.a: "Conceder o empréstimo"
 greece.46.b: "O risco é grande demais"
 greece.47.t: "Empréstimo do ICBC Aprovado"
 greece.47.d: "O Banco Industrial e Comercial da China aprovou nosso pedido de empréstimo. Capital chinês flui para nosso tesouro, fornecendo uma injeção significativa de recursos. Nossa dependência financeira de Pequim se aprofunda, mas o alívio imediato é bem-vindo."
 greece.47.a: "Os fundos estão garantidos"
 greece.48.t: "Empréstimo do ICBC Negado"
 greece.48.d: "A China recusou conceder um empréstimo do ICBC. Sem o apoio bancário chinês, devemos buscar fontes alternativas de capital ou nos virar com nossos próprios meios."
 greece.48.a: "Daremos um jeito"
 GRE_drydock_modernization: "Modernização das Docas Secas"
 GRE_drydock_modernization_desc: "O investimento em instalações modernas de docas secas ampliou a capacidade de reparo e construção naval, permitindo que a Marinha Helênica modernize sua frota com mais eficiência."
 GRE_strategic_autonomy_idea: "Autonomia Estratégica"
 GRE_strategic_autonomy_idea_desc: "Sem dever lealdade a nenhum bloco, a Grécia negocia e barganha com todos eles. A liberdade de jogar com todos os lados rende condições melhores e certo grau de isolamento contra a pressão das grandes potências."
 GRE_euro_adopted: "Adoção do Euro"
 GRE_euro_adopted_desc: "A adoção do Euro pela Grécia integrou sua economia à Zona do Euro como um todo, reduzindo os custos de empréstimo e facilitando o comércio, ao preço da política monetária independente."
 GRE_manpads_expansion_idea: "Expansão dos MANPADS"
 GRE_manpads_expansion_idea_desc: "Um programa ampliado de sistemas portáteis de defesa aérea melhorou a capacidade antiaérea e reduziu os custos de produção por meio de pesquisa e fabricação nacionais."
 GRE_port_modernization: "Modernização Portuária"
 GRE_port_modernization_desc: "A infraestrutura portuária modernizada ampliou a capacidade dos estaleiros e melhorou a eficiência da construção naval nos estaleiros gregos."
 GRE_research_hubs_idea: "Polos de Pesquisa Militar"
 GRE_research_hubs_idea_desc: "Foram criados centros de pesquisa militar dedicados para acelerar o desenvolvimento de tecnologia de defesa e a inovação em sistemas de armas."
 GRE_research_hubs_idea_2: "Polos de Pesquisa Avançada"
 GRE_research_hubs_idea_2_desc: "A expansão do programa de polos de pesquisa agora abrange tecnologia espacial além das aplicações militares, ampliando a fronteira tecnológica da Grécia."
 GRE_greater_state_control_authoritarian: "Controle Estatal Autoritário"
 GRE_greater_state_control_authoritarian_desc: "O Estado assumiu o controle direto de setores econômicos-chave, acelerando a construção ao custo da liberdade política e da flexibilidade burocrática."
 GRE_com_liberators: "Libertadores do Povo"
 GRE_com_liberators_desc: "O fervor revolucionário percorre as fileiras. Soldados que lutam em solo pátrio são encorajados pela causa, golpeando com mais força e resistindo com mais firmeza na defesa da revolução."
 GRE_western_outreach: "Aproximação com o Ocidente"
 GRE_western_outreach_desc: "A diplomacia grega está engajada em uma campanha focada de aproximação bilateral e multilateral em toda a OTAN e a União Europeia. Compromisso Ocidental: [?GRE_western_commitment|0]"
 GRE_franco_hellenic_strategic_partnership: "Parceria Estratégica Franco-Helênica"
 GRE_franco_hellenic_strategic_partnership_desc: "A parceria estratégica de 2021 abriu uma profunda cooperação industrial de defesa com a França. As fábricas de armas gregas operam com padrões compartilhados, bônus de pesquisa franceses fluem para nossos programas militares e a coordenação política se estreitou."
 GRE_franco_greek_mutual_defense: "Cláusula de Defesa Mútua Franco-Grega"
 GRE_franco_greek_mutual_defense_desc: "O Artigo 2 da parceria ampliada compromete a França com a defesa do território grego. A cláusula garante a segurança grega em termos continentais e une duas das maiores forças armadas do Mediterrâneo em uma única unidade estratégica."
 GRE_eastmed_trilateral_idea: "Trilateral GRE-ISR-CHI"
 GRE_eastmed_trilateral_idea_desc: "Declarações conjuntas, exercícios conjuntos e inteligência compartilhada fundiram as três marinhas e forças aéreas em um único espaço operacional na bacia do Mediterrâneo Oriental."
 GRE_eastmed_gas_forum_idea: "Membro do Fórum de Gás do EastMed"
 GRE_eastmed_gas_forum_idea_desc: "A navegação grega segue por rotas preferenciais, os fluxos regionais de gás enriquecem as refinarias e estaleiros gregos, e Atenas mantém um assento permanente à mesa de energia do Mediterrâneo Oriental."
 GRE_3plus1_pact: "Diálogo Estratégico 3+1"
 GRE_3plus1_pact_desc: "O engajamento americano coroa a trilateral do Mediterrâneo Oriental. Exercícios conjuntos, troca de inteligência e diálogo estratégico estruturado elevam a capacidade operacional das forças armadas gregas nos domínios marítimo e aéreo."
 GRE_eu_political_anchor_idea: "Âncora de Membro Fundador da UE"
 GRE_eu_political_anchor_idea_desc: "A Grécia exerce o peso político de um membro fundador da UE, beneficiando-se do comércio intrabloco e moldando a agenda de Bruxelas a partir de uma posição de antiguidade."
 GRE_eu_strategic_compass_idea: "Defensora da Bússola Estratégica da UE"
 GRE_eu_strategic_compass_idea_desc: "A diplomacia grega avança a Bússola Estratégica Europeia, clamando por autonomia diante do aventureirismo de grandes potências externas e unindo cada vez mais a base industrial de defesa da UE."
 greece.556.t: "A Reafirmação Ocidental"
 greece.556.d: "A Grécia anuncia uma reafirmação abrangente de seu alinhamento ocidental, abrindo uma campanha sustentada de aproximação bilateral e multilateral em toda a OTAN e a União Europeia. Atenas sinaliza, a aliados e rivais, que seu futuro estratégico está firmemente ancorado no Ocidente."
 greece.556.a: "Uma reafirmação bem-vinda"
 greece.556.b: "A Grécia mantém a linha"
 greece.556.c: "Tomar nota"
 greece.557.t: "Proposta Grega: Parceria Estratégica"
 greece.557.d: "Atenas propõe uma parceria estratégica abrangente, cobrindo cooperação industrial de defesa, alinhamento de política externa e segurança do Mediterrâneo Oriental. O governo grego está disposto a empenhar capital político substancial para fazer disso uma bandeira da política mediterrânea francesa."
 greece.557.a: "Assinar a parceria"
 greece.557.b: "Recusar a proposta"
 greece.558.t: "A França Aceita a Parceria"
 greece.558.d: "Paris aceita a parceria estratégica. Grupos de trabalho conjuntos são formados imediatamente para a cooperação industrial de defesa, com expertise francesa fluindo para as fábricas de armas e programas de pesquisa gregos. A parceria é apresentada como um modelo de cooperação bilateral europeia."
 greece.558.a: "Um acordo histórico"
 greece.559.t: "[FROM.GetName] Recusa a Parceria"
 greece.559.d: "[FROM.GetName] informa Atenas, com discrição diplomática, que a parceria não pode prosseguir. O custo político continua real."
 greece.559.a: "Um revés lamentável"
 greece.560.t: "Proposta Grega: Trilateral do Mediterrâneo Oriental"
 greece.560.d: "Atenas propõe um marco trilateral formal com Israel e Chipre: exercícios conjuntos, inteligência compartilhada e posições diplomáticas coordenadas. O arranjo converteria uma cooperação antiga em uma forma institucional vinculante."
 greece.560.a: "Assinar a trilateral"
 greece.560.b: "Recusar a proposta"
 greece.561.t: "Israel Ingressa na Trilateral"
 greece.561.d: "Israel assina o marco trilateral. Células de planejamento conjunto são formadas em nível operacional, e os arranjos israelenses de compartilhamento de inteligência são estendidos aos homólogos gregos."
 greece.561.a: "Dar boas-vindas aos parceiros"
 greece.563.t: "Proposta Grega: Trilateral do Mediterrâneo Oriental"
 greece.563.d: "Atenas propõe o marco trilateral formal com Chipre e Israel. Para Nicósia, a oferta é essencialmente automática, mas a assinatura formal ainda precisa vir."
 greece.563.a: "Claro que assinamos"
 greece.563.b: "Aguardar mais análise"
 greece.564.t: "Chipre Ingressa na Trilateral"
 greece.564.d: "Nicósia assina o marco trilateral com Atenas e Jerusalém. Os três governos agora operam sob um guarda-chuva diplomático e operacional unificado no Mediterrâneo Oriental."
 greece.564.a: "Um Mediterrâneo Oriental unificado"
 greece.566.t: "Proposta Grega: Cláusula de Defesa Mútua do Artigo 2"
 greece.566.d: "Atenas propõe a conclusão natural da parceria estratégica: uma cláusula de defesa mútua vinculante, modelada no Artigo 5, escrita diretamente no tratado bilateral. A integridade territorial grega seria, pela primeira vez, garantida por uma grande potência europeia em termos de tratado."
 greece.566.a: "Assinar a cláusula de defesa mútua"
 greece.566.b: "Recusar. Longe demais, rápido demais."
 greece.567.t: "A França Assina a Cláusula de Defesa Mútua"
 greece.567.d: "Paris assina. O Artigo 2 do tratado ampliado compromete a França com a defesa do território grego. A onda de choque diplomática alcança muito além do Mediterrâneo."
 greece.567.a: "Uma nova era de segurança europeia"
 greece.568.t: "A França Recusa a Cláusula de Defesa Mútua"
 greece.568.d: "Paris recusa a cláusula de defesa mútua por considerá-la um passo longe demais para a atual doutrina estratégica francesa. A parceria existente permanece, mas a garantia de segurança vinculante não se concretizará."
 greece.568.a: "Um sério revés"
 greece.569.t: "Proposta Grega: Diálogo Estratégico 3+1"
 greece.569.d: "Atenas, Nicósia e Jerusalém propõem em conjunto formalizar o diálogo estratégico 3+1 com os Estados Unidos, um marco apoiado pelo Departamento de Estado que abrange segurança energética, cooperação marítima e contraterrorismo no Mediterrâneo Oriental."
 greece.569.a: "Engajar-se no diálogo"
 greece.569.b: "Adiar o engajamento"
 greece.570.t: "Os Estados Unidos Engajam-se no 3+1"
 greece.570.d: "Washington engaja-se formalmente no diálogo estratégico 3+1. Os compromissos americanos de treinamento e exercícios se expandem pelo Mediterrâneo Oriental, e as forças armadas gregas ganham acesso a um novo nível de experiência operacional conjunta."
 greece.570.a: "Uma parceria indispensável"
 greece.571.t: "Os Estados Unidos Adiam o Engajamento"
 greece.571.d: "O Departamento de Estado sinaliza que prioridades estratégicas mais amplas estão absorvendo a atenção americana. O marco 3+1 não é abandonado, mas a ampliação formal não acontecerá neste ciclo."
 greece.571.a: "Voltaremos ao assunto depois"
 greece.572.t: "Grécia: Pilar do Ocidente"
 greece.572.d: "Sucessivos tratados, declarações e parcerias transformaram a Grécia de um membro periférico da OTAN em uma coluna de sustentação da diplomacia ocidental no Mediterrâneo Oriental. Atenas fala agora com peso estrutural tanto em Bruxelas quanto em Washington."
 greece.572.a: "Pilar do Ocidente"
 greece.572.b: "Um aliado restaurado"
 greece.572.c: "Uma nova geometria estratégica"
 greece.575.t: "FSRU de Alexandrópolis Entra em Operação"
 greece.575.d: "A unidade flutuante de armazenamento e regaseificação atracada em Alexandrópolis iniciou a operação comercial, ancorando a virada do sudeste europeu para longe do gás de gasodutos russos. O solo grego é agora um ponto de entrada para o suprimento energético do continente."
 greece.575.a: "Atenas acende a lamparina"
 greece.575.b: "Um novo nó útil"
 greece.577.t: "O Pireu Ancora o Corredor IMEC"
 greece.577.d: "Chefes de Estado em Délhi, Riade e Bruxelas confirmaram o Pireu como o terminal europeu do Corredor Econômico Índia-Oriente Médio-Europa. Projeta-se que o volume de transbordo pela Ática triplique ao longo da década."
 greece.577.a: "Do Egeu ao Oceano Índico"
 greece.577.b: "Um marco logístico"
 greece.580.t: "Proposta Grega: Roteiro de Cooperação de Prespa"
 greece.580.d: "Atenas propõe um roteiro estruturado para ampliar o Acordo de Prespa: grupos de trabalho setoriais, um acordo de livre comércio e planejamento conjunto de infraestrutura. O pacote uniria nossas economias por uma geração."
 greece.580.a: "Skopje está pronta para avançar sobre Prespa"
 greece.580.b: "Não iremos além do marco existente"
 greece.581.t: "A Macedônia do Norte Endossa o Roteiro"
 greece.581.d: "Skopje assinou o roteiro de cooperação de Prespa. Os grupos de trabalho se reunirão em Salônica dentro de semanas, e um acordo de livre comércio está agora ao alcance."
 greece.581.a: "Excelente notícia"
 greece.582.t: "Proposta Grega: Marco de Direitos das Minorias"
 greece.582.d: "Atenas propõe um marco formal sobre os direitos da comunidade de língua grega no sul da Albânia: escolas de idioma, restituição de propriedades e cooperação cultural transfronteiriça, em troca de laços bilaterais mais calorosos."
 greece.582.a: "Tirana aceita o marco"
 greece.582.b: "Não podemos concordar com estes termos"
 greece.583.t: "A Albânia Assina o Marco das Minorias"
 greece.583.d: "O acordo é assinado em Tirana. As comunidades de língua grega no sul da Albânia recebem proteções concretas, e os canais ministeriais com Atenas se aprofundam em consequência."
 greece.583.a: "Um ganho diplomático"
 greece.584.t: "Proposta Grega: Acordo de ZEE no Mediterrâneo Oriental"
 greece.584.d: "Atenas propõe uma delimitação bilateral de zona econômica exclusiva com o Cairo. O acordo resolveria reivindicações marítimas sobrepostas e excluiria atores rivais do desenvolvimento conjunto dos recursos do leito marinho."
 greece.584.a: "O Cairo assina o acordo"
 greece.584.b: "O Cairo recusa por ora"
 greece.585.t: "O Egito Ratifica o Acordo de ZEE"
 greece.585.d: "O Egito ratificou a delimitação marítima. Levantamentos conjuntos da zona demarcada começam dentro do mês, e as cláusulas comerciais vinculadas ao acordo entram em vigor."
 greece.585.a: "Um acordo fundamental"
 greece.586.t: "Proposta Grega: Eixo Mediterrâneo Ítalo-Helênico"
 greece.586.d: "Atenas propõe uma parceria abrangente com Roma: política industrial coordenada, programas de estaleiros compartilhados e posições alinhadas sobre a segurança do Mediterrâneo. As duas penínsulas agiriam como uma só em Bruxelas."
 greece.586.a: "Roma concorda com a parceria"
 greece.586.b: "Roma recusa educadamente"
 greece.587.t: "A Itália Ingressa no Eixo Mediterrâneo"
 greece.587.d: "A Itália assinou o documento da parceria. Comitês industriais conjuntos e um marco para coprodução naval serão convocados em Atenas dentro do trimestre."
 greece.587.a: "Nasce um eixo"
 greece.588.t: "Proposta Grega: Expansão do Gasoduto IGB"
 greece.588.d: "Atenas propõe uma expansão em fases do interconector Grécia-Bulgária e do terminal de Alexandrópolis a ele ligado. Sófia ganharia um suprimento de gás diversificado; Atenas captaria receita de trânsito pelos Bálcãs."
 greece.588.a: "Sófia assina o plano de expansão"
 greece.588.b: "Sófia rejeita a proposta"
 greece.589.t: "A Bulgária Dá Sinal Verde à Expansão do Gasoduto"
 greece.589.d: "Sófia aprovou a expansão. A construção está prevista para começar dentro da estação; os fluxos de gás para o norte, rumo à Bulgária, e para o sul, pelos terminais gregos, devem dobrar."
 greece.589.a: "Um corredor estratégico"
 greece.590.t: "Proposta Grega: Conselho Estratégico Helênico-Saudita"
 greece.590.d: "Atenas propõe um Conselho Supremo de Cooperação Estratégica com Riade: cooperação industrial de defesa, coinvestimento de fundos soberanos e diálogo ministerial regular. O Reino ganharia um parceiro mediterrâneo; a Grécia ganharia capital."
 greece.590.a: "Riade aceita"
 greece.590.b: "Riade recusa"
 greece.591.t: "A Arábia Saudita Convoca o Conselho"
 greece.591.d: "O Conselho Supremo de Cooperação Estratégica realiza sua reunião inaugural em Atenas. Fundos soberanos sauditas anunciam uma primeira parcela de investimento na indústria grega."
 greece.591.a: "Uma parceria emblemática"
 greece.592.t: "Proposta Grega: Pacto de Investimento Helênico-Emirático"
 greece.592.d: "Atenas propõe um pacto de investimento estruturado com Abu Dhabi: tratamento tributário para fundos emiradenses, acesso a zonas francas na Ática e investimento grego recíproco na rede logística do Golfo."
 greece.592.a: "Abu Dhabi aceita"
 greece.592.b: "Abu Dhabi recusa"
 greece.593.t: "Os Emirados Árabes Unidos Assinam o Pacto"
 greece.593.d: "Abu Dhabi assinou o pacto. O capital emiradense começa a fluir para a logística e a indústria gregas, e as empresas gregas ganham acesso preferencial à infraestrutura dos polos do Golfo."
 greece.593.a: "Excelente"
 greece.594.t: "Proposta Grega: Adesão ao Fórum de Gás do EastMed"
 greece.594.d: "Atenas propõe que Amã ingresse no Fórum de Gás do Mediterrâneo Oriental, com a Grécia patrocinando sua adesão. Surgiria uma arquitetura energética regional que se estende do Levante ao Egeu."
 greece.594.a: "Amã aceita o convite"
 greece.594.b: "Amã recusa"
 greece.595.t: "A Jordânia Ingressa no Fórum de Gás do EastMed"
 greece.595.d: "A Jordânia formalizou sua adesão ao Fórum de Gás do EastMed. O alcance geográfico e político da instituição agora se estende de forma decisiva por toda a bacia do Mediterrâneo Oriental."
 greece.595.a: "Uma vitória diplomática"
 GRE_lobby_eu_partners: "Fazer Lobby com Parceiros da UE"
 GRE_lobby_eu_partners_desc: "Gastar capital político em uma campanha de lobby sustentada dentro da União Europeia: visitas bilaterais, documentos de posição e troca de concessões, para avançar as prioridades diplomáticas gregas e acumular Compromisso Ocidental."
 GRE_eastern_alignment_score: "Alinhamento Oriental Grego"
 GRE_eastern_alignment_score_tt: "$GRE_eastern_alignment_score$: $RIGHT|+=0Y$"
 GRE_aegean_tension: "Tensão no Egeu"
 GRE_aegean_tension_tt: "§HTensão no Egeu§!: §Y[?GRE_aegean_tension|+=0]§!/100"
 GRE_cyprus_momentum: "Impulso do Chipre"
 GRE_cyprus_momentum_tt: "§HImpulso do Chipre§!: §Y[?GRE_cyprus_momentum|+=0]§!/100"
 GRE_tension_change: "§Y[GRE.GetFlag][CYP.GetFlag]Tensão no Egeu[TUR.GetFlag][NCY.GetFlag]§!"
 GRE_tension_change_tt: "$GRE_tension_change$: $RIGHT|-=0$"
 GRE_momentum_change: "§Y[GRE.GetFlag][CYP.GetFlag]Impulso do Chipre[TUR.GetFlag][NCY.GetFlag]§!"
 GRE_momentum_change_tt: "$GRE_momentum_change$: $RIGHT|+=0$"
 GRE_confederation_all_done_TT: "§BAs três decisões da confederação foram resolvidas§!"
 GRE_cyprus_momentum_high_TT: "§BImpulso do Chipre acima de §H+70§!§!"
 GRE_cyprus_momentum_mid_TT: "§BImpulso do Chipre acima de §H+40§!§!"
 GRE_aegean_tension_low_TT: "§BTensão no Egeu abaixo de §H40§!§!"
 GRE_migration_deal_active: "A cooperação migratória com a Turquia está ativa"
 GRE_lost_continental_shelf_claims: "Reivindicações da plataforma continental cedidas à Turquia"
 GRE_aegean_de_escalation: "Recuou diante do ultimato turco"
 GRE_confederation_autonomy_done: "Estrutura de autonomia da confederação acordada"
 GRE_confederation_economy_done: "Distribuição econômica da confederação acordada"
 GRE_confederation_security_done: "Marco de segurança da confederação acordado"
 GRE_defending_sovereignty: "Defendendo a Soberania Grega"
 GRE_defending_sovereignty_desc: "Uma postura sustentada de prontidão militar voltada a dissuadir a invasão turca no Egeu e sobre Chipre. A Marinha e a Força Aérea Helênicas mantêm vigilância reforçada, e os gastos com defesa consomem recursos que poderiam ir para bens de consumo. Essa dissuasão direcionada fortalece a determinação grega, mas impõe um custo econômico."
 GRE_aegean_naval_supremacy: "Supremacia Naval no Egeu"
 GRE_aegean_naval_supremacy_desc: "Patrulhas avançadas e uma presença permanente de superfície dão à Marinha Helênica a vantagem nas águas disputadas do Egeu."
 GRE_migration_cooperation_idea: "Pacto Migratório UE-Turquia"
 GRE_migration_cooperation_idea_desc: "A Turquia processa os fluxos de migrantes em seu próprio território em troca de concessões gregas e da UE, aliviando a pressão sobre as ilhas do Egeu."
 GRE_migration_crisis_idea: "Crise Migratória"
 GRE_migration_crisis_idea_desc: "A Turquia se retirou do pacto migratório, enviando novas ondas de chegadas pelo Egeu e sobrecarregando as instalações de acolhimento gregas."
 GRE_confederation_category: "Confederação de Chipre"
 GRE_confederation_category_desc: "Resolver as questões estruturais da proposta confederação cipriota: autonomia, distribuição econômica e segurança."
 GRE_eastern_missions_category: "Missões da Irmandade Oriental"
 GRE_eastern_missions_category_desc: "Desafios políticos recorrentes surgidos das trilhas do Egeu e de Chipre."
 GRE_decide_autonomy_level: "Decidir a Autonomia da Confederação"
 GRE_decide_autonomy_level_desc: "Definir se o novo Estado adotará um modelo federal com instituições centrais fortes ou uma confederação mais frouxa que conceda a cada comunidade ampla autonomia de governo."
 GRE_decide_economic_distribution: "Decidir a Distribuição Econômica"
 GRE_decide_economic_distribution_desc: "Decidir se o orçamento federal será dividido em bases paritárias entre as duas comunidades ou ponderado pela contribuição ao PIB."
 GRE_decide_security_guarantees: "Decidir as Garantias de Segurança"
 GRE_decide_security_guarantees_desc: "Decidir se o Estado reunificado ficará sob o guarda-chuva de segurança da OTAN ou adotará uma postura de defesa neutra."
 GRE_aegean_dialogue_mission: "Diálogo do Egeu"
 GRE_aegean_dialogue_mission_desc: "A cada seis meses, negociadores gregos e turcos devem decidir até onde levar suas respectivas reivindicações. A missão termina se o diálogo degenerar em confronto aberto ou guerra."
 greece.700.t: "Diálogo do Egeu: Revisão Semestral"
 greece.700.d: "A mais recente rodada de negociações chegou a uma bifurcação familiar. Os interlocutores turcos pressionam por concessões gregas parciais sobre a plataforma continental em troca de maior desescalada. Manter-se firme preserva nossas reivindicações, mas os ânimos vão se exaltar."
 greece.700.a: "Oferecer concessões moderadas"
 greece.700.b: "Manter a linha"
 greece.701.t: "Ancara Abandona o Pacto Migratório"
 greece.701.d: "Citando a postura diplomática grega, as autoridades turcas suspenderam a cooperação no retorno e processamento de migrantes. Novas chegadas já são relatadas pelas ilhas do Egeu; os centros de acolhimento enfrentarão uma crise em poucas semanas."
 greece.701.a: "Preparar-se para o afluxo"
 greece.702.t: "Incidente no Egeu"
 greece.702.d: "Uma patrulha turca entrou durante a noite no espaço aéreo reivindicado pela Grécia. Interceptadores helênicos intervieram. Não houve disparos, mas as distâncias de aproximação foram perigosamente curtas. A decisão agora é desarmar a situação ou reagir com mais força."
 greece.702.a: "Desescalar"
 greece.702.b: "Escalar a resposta"
 greece.703.t: "Ancara Reforça o Norte de Chipre"
 greece.703.d: "A mídia estatal turca confirmou o apoio ampliado à administração do Norte de Chipre. A medida parece calibrada e não provocativa, um sinal de que Atenas não pode lidar com Chipre nos próprios termos."
 greece.703.a: "Registrar para constar"
 greece.704.t: "Crise do Gás no Mediterrâneo Oriental"
 greece.704.d: "Navios de perfuração turcos entraram em águas que a Grécia e Chipre consideram zona econômica exclusiva. Atenas deve decidir se desarma o impasse ou mantém o terreno, correndo o risco de um confronto maior."
 greece.704.a: "Ceder terreno por ora"
 greece.704.b: "Manter o terreno"
 greece.705.t: "Ultimato Turco"
 greece.705.d: "Ancara emitiu um aviso severo: a continuidade da ação grega em Chipre será respondida com consequências não especificadas, mas concretas. O Ministério das Relações Exteriores deve responder."
 greece.705.a: "Recuar da beira do abismo"
 greece.705.b: "Recusar-se a ser intimidado"
 greece.706.t: "Incidente Rotineiro no Espaço Aéreo"
 greece.706.d: "Mais um sobrevoo turco foi registrado e protestado pelos canais habituais. O padrão continua, sem que nenhum dos lados deseje escalada, nem queira recuar."
 greece.706.a: "Registrar o protesto"
 greece.710.t: "Confederação: A Questão da Autonomia"
 greece.710.d: "Os negociadores colocaram dois modelos sobre a mesa: um arranjo federal com instituições centrais fortes ou uma confederação que delega a maioria dos poderes às comunidades. A escolha definirá o caráter do novo Estado."
 greece.710.a: "Modelo federal"
 greece.710.b: "Modelo confederal"
 greece.711.t: "Confederação: Distribuição Econômica"
 greece.711.d: "Como serão divididas as receitas federais? A paridade estrita tranquiliza a comunidade menor, mas uma fórmula ponderada pelo PIB reflete a realidade econômica e seria mais fácil de defender internamente."
 greece.711.a: "Distribuição baseada na paridade"
 greece.711.b: "Distribuição ponderada pelo PIB"
 greece.712.t: "Confederação: Marco de Segurança"
 greece.712.d: "O Estado reunificado ficará sob o guarda-chuva da OTAN ou adotará uma postura de defesa neutra? Cada caminho tem seus defensores em Atenas e Nicósia."
 greece.712.a: "Guarda-chuva de segurança da OTAN"
 greece.712.b: "Postura de defesa neutra"
 greece.720.t: "Exigências pela União Cipriota"
 greece.720.d: "Após meses de manobras diplomáticas e pressão sobre a Turquia, Atenas está pronta para fazer exigências formais pela união de Chipre e do Norte de Chipre com a Grécia. A Grécia cultivou apoio suficiente entre a população greco-cipriota e, se a Turquia recuou sob pressão internacional, a liderança cipriota do norte também pode ser persuadida. O momento da verdade chegou."
 greece.720.a: "Fazer as exigências"
 greece.721.t: "A Guerra Volta a Chipre"
 greece.721.d: "Um ou ambos os governos cipriotas recusaram as exigências gregas de união, e o conflito militar é iminente. Ancara emitiu condenações e advertências furiosas. As forças armadas turcas mantêm postura de prontidão, mas não se comprometeram diretamente com uma intervenção. A comunidade internacional observa com tensão para ver se Atenas empregará suas próprias forças armadas ou continuará o apoio encoberto."
 greece.721.a: "Registrar a reação"
 greece.722.t: "Até Onde Irá Atenas? (Chipre)"
 greece.722.d: "A República de Chipre rejeitou a exigência de união e o conflito militar é iminente. Podemos armar e abastecer das sombras as forças greco-cipriotas pró-união com voluntários e material, ou empregar abertamente as Forças Armadas Helênicas para impor a anexação. A primeira opção mantém a Grécia nas boas graças da OTAN. A segunda coloca soldados gregos em combate, exige a saída da aliança e pode provocar intervenção turca direta. Mas também garante uma conquista rápida e a integração da ilha do sul."
 greece.722.a: "Apenas voluntários e material"
 greece.722.b: "Empregar as Forças Armadas Helênicas; declarar guerra a Chipre"
 greece.730.t: "Pressão da OTAN sobre a Turquia"
 greece.730.d: "Atenas procura um aliado da OTAN, pedindo que use canais diplomáticos para persuadir a Turquia a moderar sua postura agressiva no Egeu. Tal pressão de uma potência ocidental poderia levar Ancara a reconsiderar sua posição."
 greece.730.a: "Apoiar Atenas"
 greece.730.b: "Esta não é a nossa disputa"
 greece.731.t: "Apoio Aliado Garantido"
 greece.731.d: "Nosso parceiro da OTAN concordou em abordar Ancara sobre as tensões no Egeu. O apoio diplomático do Ocidente deve ajudar a aliviar o impasse e justificar nossa postura assertiva."
 greece.731.a: "Uma vitória diplomática"
 greece.732.t: "Nosso Pedido Foi Recusado"
 greece.732.d: "O aliado da OTAN recusou educadamente entrar em conversas diretas com a Turquia sobre as disputas do Egeu. Prefere permanecer neutro em questões marítimas bilaterais."
 greece.732.a: "Permanecemos resolutos"
 greece.733.t: "Proposta de Integração Econômica Cipriota"
 greece.733.d: "Atenas propõe uma integração econômica profunda com a República de Chipre, incluindo uma união aduaneira, harmonização bancária e política energética coordenada. Tais laços prenderiam a ilha de perto à economia grega e elevariam o padrão de vida em Nicósia."
 greece.733.a: "Integrar-se à Grécia"
 greece.733.b: "Preservar nossa autonomia"
 greece.734.t: "Chipre Aceita a Integração"
 greece.734.d: "Nicósia abraçou a proposta. Empresas gregas e cipriotas estão harmonizando regulamentações, os sistemas bancários estão se consolidando e investimentos compartilhados fluem pelo Egeu. A união econômica fortalece a posição de Atenas em qualquer futuro acordo político."
 greece.734.a: "A união gera prosperidade"
 greece.735.t: "Chipre Recusa a Integração Profunda"
 greece.735.d: "Nicósia recusou respeitosamente a oferta de integração econômica profunda. A República de Chipre prefere, por ora, manter sua independência em matéria econômica, mesmo ao custo de um crescimento mais lento."
 greece.735.a: "Permanecemos comprometidos"
 greece.736.t: "Proposto o Desenvolvimento de Gás no Mediterrâneo Oriental"
 greece.736.d: "Atenas propõe o desenvolvimento conjunto de campos de gás natural offshore nas águas ao sul de Chipre e a leste de Creta. Um programa de extração compartilhado impulsionaria ambas as economias e geraria receita energética de longo prazo."
 greece.736.a: "Desenvolver os campos juntos"
 greece.736.b: "Provocativo demais por ora"
 greece.737.t: "Campos de Gás de Chipre Iniciam Operações"
 greece.737.d: "As plataformas de perfuração gregas e cipriotas começaram a extrair gás natural dos campos conjuntos. Nova capacidade de refino entra em operação e ambas as economias se beneficiam de receita energética sustentada. A medida envia um sinal a Ancara de que os gregos estão dispostos a desenvolver sua Zona Econômica Exclusiva apesar das objeções turcas."
 greece.737.a: "Os recursos garantem nosso futuro"
 greece.738.t: "Chipre Rejeita o Empreendimento de Gás"
 greece.738.d: "A República de Chipre recusou participar do desenvolvimento conjunto de gás, temendo a reação diplomática da Turquia. Atenas não forçará a questão."
 greece.738.a: "Uma oportunidade perdida"
 greece.739.t: "Aproximação com os Cipriotas Turcos"
 greece.739.d: "Atenas estende uma mão econômica e cultural à comunidade cipriota turca do norte. Atenas oferece investimento, privilégios comerciais e programas de intercâmbio cultural, demonstrando que a reunificação sob auspícios gregos serve tanto aos interesses do norte quanto aos do lado greco-cipriota."
 greece.739.a: "Aceitar o investimento grego"
 greece.739.b: "Continuamos cautelosos"
 greece.740.t: "O Norte de Chipre Acolhe o Investimento"
 greece.740.d: "A liderança cipriota turca aceitou o investimento grego e laços econômicos mais estreitos. O dinheiro flui para o norte, parcerias empresariais se formam e a influência gradualmente pende a favor de Atenas. A base para a eventual reunificação se solidifica a cada mês."
 greece.740.a: "Sementes plantadas para a união"
 greece.741.t: "O Norte de Chipre Rejeita a Aproximação"
 greece.741.d: "A comunidade cipriota turca, desconfiada das intenções gregas, recusou o pacote de investimentos. O apoio de Ancara continua sendo seu escudo, e as investidas de Atenas não os convenceram do contrário."
 greece.741.a: "Mais um revés"
 greece.742.t: "Proposto o Acordo das Bases Soberanas"
 greece.742.d: "Atenas pede que o Reino Unido transfira o controle das Áreas de Base Soberana de Akrotiri e Dhekelia. Em troca, a Grécia oferece compensação, acesso contínuo da OTAN e garantias de preservar as instalações militares britânicas. A transferência dessas bases remodelaria o equilíbrio estratégico em Chipre."
 greece.742.a: "Ceder as bases à Grécia"
 greece.742.b: "As bases permanecem britânicas"
 greece.743.t: "O Reino Unido Concorda com a Transferência"
 greece.743.d: "Londres decidiu que transferir as bases serve aos interesses de longo prazo de ambas as nações. As forças gregas agora ocupam Akrotiri e Dhekelia, e Atenas ganha profundidade estratégica e controle de aeródromos e portos importantes. A mudança inclina decisivamente o equilíbrio militar a favor da Enosis."
 greece.743.a: "Uma aquisição histórica"
 greece.744.t: "O Reino Unido Recusa a Transferência"
 greece.744.d: "O governo britânico recusou abrir mão das Áreas de Base Soberana. Elas continuam sendo território britânico e instalações militares britânicas, como desde 1960."
 greece.744.a: "Estamos de mãos atadas"
 GRE_western_commitment: "Alinhamento Ocidental Grego"
 GRE_western_commitment_tt: "$GRE_western_commitment$: $RIGHT|+=0Y$"
 greece.745.t: "A Campanha de Pressão Termina"
 greece.745.d: "A campanha para pressionar a Turquia sobre Chipre foi concluída. Várias grandes potências manifestaram apoio à posição grega, citando a necessidade de estabilidade no Mediterrâneo Oriental e os direitos do povo cipriota. Atenas agora detém uma influência diplomática significativa. Com base no número de vozes aliadas, Ancara tem [GRE_GetTurkeyConcessionChance] de chance de recuar e aceitar influência reduzida sobre Chipre. Se a Turquia recusar, as tensões aumentarão por todo o Egeu."
 greece.745.a: "Ver como Ancara responde"
 greece.724.t: "Atenas Exige a União"
 greece.724.d: "O governo grego exigiu formalmente que a República de Chipre se submeta à união com a Grécia. A oferta é clara: ingresse voluntariamente e a transição será tranquila e próspera. Com base no sentimento greco-cipriota e na influência turca, as chances de aceitação são de [GRE_GetCyprusAcceptanceChance]. O governo em Nicósia enfrenta uma escolha histórica."
 greece.724.a: "Aceitar a união com a Grécia"
 greece.724.b: "Recusar a exigência"
 greece.725.t: "Atenas Exige que o Norte se Submeta"
 greece.725.d: "A Grécia voltou agora sua atenção para o Norte de Chipre, exigindo que a liderança cipriota turca também aceite a união com Atenas. A posição cipriota turca é mais complicada: o norte há muito depende da proteção militar e dos laços culturais turcos. As chances de aceitação são de [GRE_GetNorthernCyprusAcceptanceChance], moduladas por a Turquia ter ou não recuado sob pressão da OTAN e pela profundidade do impulso greco-cipriota. Se o Norte de Chipre recusar, a ilha permanece dividida e o conflito armado se torna provável."
 greece.725.a: "Aceitar a união com a Grécia"
 greece.725.b: "Buscar proteção turca; recusar a exigência"
 greece.726.t: "Até Onde Irá Atenas?"
 greece.726.d: "O Norte de Chipre se recusa a se submeter voluntariamente, e o governo cipriota turco sinaliza que buscará apoio militar turco para resistir à absorção. A Grécia agora enfrenta uma escolha: continuar a ajuda encoberta às forças pró-união e esperar que a situação se resolva pacificamente, ou empregar diretamente as Forças Armadas Helênicas para anexar o norte pela força. A ação militar direta significa deixar a OTAN, pois a aliança não apoiará uma guerra ofensiva para tomar território da esfera de influência de um membro da OTAN."
 greece.726.a: "Apenas voluntários e material"
 greece.726.b: "Empregar as Forças Armadas Helênicas; declarar guerra ao Norte de Chipre"
 greece.723.t: "Chipre Reunificado"
 greece.723.d: "Os dois Estados cipriotas foram unificados sob a bandeira grega. Tanto os territórios do sul quanto os do norte estão agora plenamente incorporados à Grécia como estados núcleo. Pela primeira vez desde 1974, a ilha é inteira sob uma única autoridade. Este é o ápice de décadas de nacionalismo cipriota e ambições irredentistas gregas: a enosis finalmente alcançada."
 greece.723.a: "Um dia histórico para o helenismo"
