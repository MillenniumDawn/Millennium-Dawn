 cartel_penalties: "贩毒集团"
 cartel_penalties_desc: "毒品暴力和帮派活动是该国犯罪版图的重要组成部分。这些强大的犯罪组织在整个国家范围内活动，让许多居民生活在恐惧之中，担心局势只会日趋恶化。然而，根据我们政府的对策，我们或许能将这个阻碍转化为一项战略机遇。"
 has_cartels_tt: "拥有国家精神§Y$cartel_penalties$§!\n"
 defeated_the_cartels: "贩毒集团的终结"
 hard_drug_trade_restrictions: "严格监管的卡特尔腐败"
 light_drug_trade_restrictions: "监管松散的卡特尔腐败"
 narco_state_bonuses: "毒枭国家"
 narco_state_bonuses_desc: "多年的斗争逐渐平息，贩毒集团已控制了国家。"
 CARTEL_defeated_the_cartels: "击败我国的贩毒集团"
 narcos_state: "毒枭国家"
 narcos_state_desc: "经过多年的斗争，毒枭现在控制了国家机器本身。"
 cartels_decision_category: "犯罪"
 cartels_decision_category_desc: "犯罪组织已渗透到我们社会的各个层面。黑帮集团、贩毒集团和暴力团伙以冷酷高效的手段争夺权力和地盘，所到之处血流成河。若不采取果断行动，我们的国家恐将沦为犯罪军阀统治的失败国家。\n\n§Y政治影响力§!代表贩毒集团对我们的机构腐蚀的程度。随着其影响力增长，我们的调查因内部破坏和贿赂而失败的可能性越来越大。\n\n§Y力量§!衡量贩毒集团的军事能力和地盘控制力。实力越高，意味着我们的突袭将遭遇更强烈的抵抗和更惨重的伤亡。\n\n若任一指标达到临界水平，贩毒集团可能试图通过腐败政变或直接军事对抗来全面夺取国家政权。\n\n$political_influence_of_cartels$: [?ROOT.cartel_political_influence|1]\n$strength_of_cartels$: [?ROOT.strength_of_cartels|1]\n"
 narcos_crisis: "毒枭危机"
 narcos_crisis_desc: "猖獗的腐败和有组织犯罪活动严重损害了我们政府的权威。贩毒集团渗透到关键机构，损害了我们执法的能力，也削弱了国家对暴力的垄断。情报报告显示，我们正濒临一场由贩毒集团官员策划的军事政变，或一场由贩毒集团内部协调的武装起义。必须立即采取行动，防止国家权威彻底崩溃。"
 mafia_crisis: "黑帮危机"
 mafia_crisis_desc: "普遍存在的腐败和有组织的犯罪活动严重损害了我们政府的权威。黑手党渗透到了关键机构，损害了我们执法的能力，也削弱了国家对暴力的垄断。情报报告显示，我们正濒临一场由与黑手党结盟的官员策划的军事政变，或一场由犯罪组织协调的武装起义。必须立即采取果断行动，以防止国家权力的彻底崩溃。"
 mexican_cartel_war: "墨西哥毒品战争"
 mexican_cartel_war_desc: "我国政府执行法律和垄断武力的能力已因日益严重的腐败和犯罪活动而受到损害。我们的军队本身和政治基础设施已被彻底渗透，再也无法分辨谁可以信任。混乱很快将达到白热化，届时，我们将陷入一场新的内战之中。"
 anti_cartel_propaganda_decision: "反卡特尔宣传"
 anti_cartel_propaganda_decision_desc: "一直以来，围绕着卡特尔的神话不断滋长，他们被美化成了美好旧时光里的“侠盗”。虽然做坏事却总归是为了自己的人民好的迷人恶棍。如同所有神话一样，这纯属捏造。任何生活在卡特尔势力影响下的人都清楚这是谎言。通过全国性的媒体宣传，揭露他们对自己人施加的暴行，我们就能朝着彻底破除这一迷思的目标迈进。"
 police_investments_decision: "警察机构"
 police_investments_decision_desc: "像卡特尔这样的犯罪组织是拥有广泛资源、资金和武装的成熟犯罪企业。仅靠有限武力或常规警务手段无法遏制他们。尽管警察部队是我们对抗这些组织的主要防线，却常常因资源不足而难以应对他们所面临的极端暴力。虽然警察军事化会带来一定的社会代价，但为警方提供强化装备、高级战术培训和增援人力，对构建有效遏制卡特尔活动的屏障至关重要。这一转型需要巨大的财政投入，但为了奠定国家有效打击有组织犯罪所需的安全基石，这项投入不可或缺。"
 utilize_the_military_decisions: "利用军队"
 utilize_the_military_decisions_desc: "尽管我们的警察部队装备精良，但仍受制于人力有限、地方官僚主义和潜在腐败。部署军队能为我们带来更强大的火力、更强大的指挥体系以及能够绕过地方行政障碍的丰富资源。军队的全国性组织结构使我们能够在贩毒集团活动的区域开展协调一致的行动。然而，这种做法也存在重大缺陷：平民往往担心军队出现在他们的社区，当地警方可能会对军队行动的不足感到不满，民用基础设施也可能在行动中遭到破坏。军事部署也有可能引发人权问题，并可能损害公众对政府机构的信任。我们必须谨慎权衡战术优势与公众支持和合法性的潜在损失。"
 target_cartel_money_laundering_decision: "打击洗钱活动"
 target_cartel_money_laundering_decision_desc: "卡特尔必须通过洗钱将非法获利转化为合法资产，这个过程分为三个阶段：将\"黑钱\"置入金融系统、分层交易模糊资金来源、最终整合进合法资产。经过清洗的资金使他们得以购置房产、收购企业，并收买政府官员。通过针对分层与整合阶段进行打击，我们能够破坏其金融基础设施并遏制腐败。这需要系统性地调查并关停涉案金融机构与空壳公司。然而该策略存在显著风险。若行动失败，卡特尔为维护资金流动可能发动暴力报复，加剧其对政府力量和平民的双重敌意。"
 investigate_the_casinos: "调查赌场"
 investigate_the_casinos_desc: "赌场运营处于监管灰色地带，使其成为洗钱的理想切入点。赌场的高现金周转率创造了一个环境，大额资金可以在不引起怀疑的情况下进行处理，既匿名又合法。我们的策略包括识别已知犯罪集团成员经常光顾的场所，并对其财务运作进行彻底审计。通过细致追踪可疑交易并建立与犯罪组织的直接联系，我们可以针对这些犯罪集团建立严密的调查。一旦收集到足够的证据，我们将协同突袭，关闭这些场所并扣押其资产，在重创犯罪集团金融基础设施的同时，为国家追回资金。"
 investigates_the_banks: "调查银行"
 investigates_the_banks_desc: "银行虽然通常是合法机构，但却是复杂洗钱活动中至关重要的渠道。通过对银行高管和金融分析师进行战略调查，并结合对交易记录的全面分析，我们可以在可疑资金流动完成之前将其拦截。通过耐心和严密监控，我们可以在非法资金达到最大集中度时 - 通常是在它们接近最终目的地时 - 发起打击。这种方法可以对犯罪组织造成最大的经济损失，并大幅削减其运营资金。然而，维持有效的监控面临着巨大的挑战，因为犯罪集团不断改进其规避侦查的手段。此外，由于涉案银行机构的经济重要性和强大的关系网络，关闭这些机构在政治上仍然难以实现。"
 investigate_shell_companies: "调查空壳公司"
 investigate_shell_companies_desc: "空壳公司在复杂的洗钱活动中扮演着至关重要的中间人角色，既是犯罪资产的中转站，也是最终的存放地。这些法律实体代表犯罪集团持有财产和资金，并逐步将这些资产转移到合法目的地。由于要建立与犯罪组织的直接联系需要大量的金融取证和情报收集工作，因此对空壳公司进行调查极具挑战性。尽管如此，成功打击空壳公司仍能对犯罪集团的金融体系造成毁灭性打击。此类行动通常不会缴获大量现金，而是没收大量实物资产，例如商业地产、豪华车辆、工业设备和合法获得的武器。这是因为犯罪分子通常通过这些空壳公司进行小额且持续的交易，以逃避侦查。"
 target_cartel_drug_running_decision: "打击贩毒活动"
 target_cartel_drug_running_decision_desc: "贩毒是贩毒集团最大的非法收入来源。虽然有些贩毒集团自己种植毒品，但许多贩毒集团通过供应链运输精制或未精制的产品来获利。通过系统地瞄准和监控这些运输路线，我们可以确定原产地、目的地和中转枢纽。这些情报使我们能够对设备仓库、炼油厂、农场、毒品窝点和行动基地进行战略突袭。或者，我们可以拦截运输中的货物，尽管这种方法通常对大型行动无效。然而，它可以极大地破坏资源有限的小团体从此类损失中恢复过来。"
 raid_drug_convoys_decision: "突袭毒品车队"
 raid_drug_convoys_decision_desc: "拦截运输途中的毒品车队使我们能够以最低的运营成本有效地破坏供应链。大型贩毒集团拥有快速调整路线和运输方式的资源，但小型贩毒集团尤其容易受到此类行动的影响。产品和收入的突然损失会严重损害他们的财务稳定，并常常引发内部冲突，因为领导层在资源日益匮乏的情况下难以维持控制。这些有针对性的拦截行动取得了引人注目的成功，展现了政府的行动力，同时也利用了犯罪集团内部的分裂。"
 raid_cartel_hideouts_decision: "突袭卡特尔藏身处"
 raid_cartel_hideouts_decision_desc: "直接打击卡特尔的据点和补给站能够破坏其运作体系，严重削弱其运输毒品、协调行动和保卫地盘的能力。此类突袭行动通常会缴获大量战术车辆和武器，这些物资原本可能被用于对抗政府军或敌对组织。这些行动的战略意义在于可能动摇卡特尔的权力格局。实力削弱的组织往往会成为竞争对手扩张领土的目标，这既可能有利于我们瓦解犯罪网络，也可能因权力真空的出现而引发暴力冲突升级。"
 raid_distribution_centres_decision: "突袭分销中心"
 raid_distribution_centres_decision_desc: "打击卡特尔的配送中心，包括毒窝和藏匿点，使我们能够在毒品流入街头前截获大量毒品。这些行动缴获了大量非法现金，并逮捕了关键的配送人员，从而切断了供应链数周甚至数月。然而，由于这些突袭行动直接影响了卡特尔的利润，却并未削弱其执法能力，因此也带来了更高的暴力报复风险。在开展此类行动之前进行情报收集至关重要，因为配送中心通常戒备森严，且位置优越，便于快速调动毒品和人员。"
 raid_refinement_centres_decision: "突袭经销中心"
 raid_refinement_centres_decision_desc: "通过突袭毒品实验室、种植园或种植房屋，我们可以抑制卡特尔创造新药进行分销的能力，同时使它们大大退缩。这种挫折通常足以阻碍他们的生产数月，因为他们试图弥补损失。与此同时，它不太可能招致报复性打击，因为卡特尔的大部分资源都用于保护其领土。"
 target_local_cartel_leaders_decision: "抓捕地区卡特尔头目"
 target_local_cartel_leaders_decision_desc: "卡特尔如同任何复杂的组织一样，依靠层级分明的领导结构来协调其行动。通过战略性地锁定并瓦解地方卡特尔头目，无论是通过逮捕还是其他更持久的手段，我们都能严重破坏其指挥链。这种不稳定会带来多重益处：缺乏有效指挥，招募工作受阻；行动能力大幅下降；下属争夺空缺的领导职位，内部权力斗争爆发。此外，这些备受瞩目的抓捕或铲除行动还能获得大量正面媒体报道，提振公众士气，并展现政府打击有组织犯罪的成效。每一次针对这些头目的成功行动，不仅削弱了卡特尔的组织架构，也动摇了他们不可战胜的信念。"
 MEX_baja_california_sinaloa_cartel: "减少锡那罗亚贩毒集团影响"
 MEX_baja_california_sinaloa_cartel_desc: "锡那罗亚贩毒集团越来越强大了，我们需要遏制他们在下加利福尼亚的影响力"
