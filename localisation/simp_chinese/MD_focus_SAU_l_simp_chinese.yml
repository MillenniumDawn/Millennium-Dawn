 SAU_the_dynamic_tiering_formula: "动态分级公式"
 SAU_the_dynamic_tiering_formula_desc: "对于一家拥有九千名员工的公司来说，配额的意义是一回事；而对于一家只有九名员工的公司来说，配额的意义又是另一回事，因此不能用单一的数字来表示。配额要求会根据员工人数、收入和行业进行调整，并且每个季度都会重新计算。\n\n企业不再通过一分为二的方式来规避门槛。"
 SAU_high_green_zone_incentives: "高绿区奖励"
 SAU_high_green_zone_incentives_desc: "在白金级之下，是王国大多数真正重要的雇主所处的阶层。他们循规蹈矩，并不出类拔萃，而迄今为止，体制并未给予他们任何相应的回报。\n\n优先处理和较轻的审计安排，其理论依据是奖励接近合规者比惩罚他们更便宜。"
 SAU_the_yellow_band_warnings: "黄色预警"
 SAU_the_yellow_band_warnings_desc: "被标记为黄色的公司会收到书面通知，上面会注明日期，并详细说明其亏损的程度以及季度末将会发生什么情况。\n\n大多数公司都会进行整改。这份警告函只需给财政部发一封信，却能避免冻结利润。"
 SAU_the_secularization_of_finance_choice_tt: "§Y选择如下§! - \"全盘盎格鲁-撒克逊 - 允许使用所有工具\" / \"渐进式 - 披着伊斯兰教法外衣的西方习俗\"。"
 SAU_bastion_of_islamic_finance_choice_tt: "§Y选择如下§! - ‘务实 - 引领全球伊斯兰金融市场’/‘严格的正统观念 - 无妥协’"
 SAU_the_banking_control_law_choice_tt: "§Y选择如下§! - “沙特阿拉伯货币局 - 独立的世俗监管机构” / “沙特阿拉伯货币局+拥有强制否决权的伊斯兰教法委员会”"
 SAU_the_interbank_lending_code_choice_tt: "§Y选择如下§! - “传统的以利息为基础的银行间市场”/“基于穆拉巴哈模式的伊斯兰银行间市场”/“混合型 - 两者分别运行”"
 SAU_the_anti_speculation_directives_choice_tt: "§Y选择如下§! - “监管宽松 - 允许衍生品和期货交易” / “严格禁止 - 禁止一切投资活动，禁止一切赌博行为” / “仅限受监管的衍生品 - 平衡的方法”"
 SAU_fractional_reserve_mandates_choice_tt: "§Y选择如下§! - “现代部分准备金制度 - 以牺牲稳定为代价实现增长” / “仅以资产为支撑的投资 - 稳定但速度较慢” / “适度的储备金要求”"
 SAU_the_standardized_interest_law_choice_tt: "§Y选择如下§! - “允许开设传统的计息账户”/“严格禁止利息 - 伊斯兰教法至高无上”/“公共领域适用伊斯兰债券，私人领域关注务实利益”"
 SAU_conscript_the_kingdom_choice_tt: "§Y选择如下§! - “全民义务兵役制。所有成年男性，无一例外。”/“选征兵役制。各部落保留豁免权。”。这将影响§H军官阶层对国家的掌控以及军政府的合法性§!。"
 SAU_emergency_tribunal_choice_tt: "§Y选择如下§! - \"王子们。让全国人民看着他们为此负责。\"/\"异见者。案卷早已写好\"/\"两者兼有。我们夺取政权并非为了有所选择。\"。这将动摇§H军官团对国家的掌控与军政府的合法性§!。"
 SAU_the_defense_industries_act_choice_tt: "§Y选择如下§! - “授权使用这些设计。我们需要的是生产，而不是面子。”／“从矿石开始，我们自己建造它。”这将影响§H军官团对国家的掌控以及军政府的合法性§!。"
 SAU_martial_law_issues_choice_tt: "§Y选择如下§! - \"全套机制：宵禁、法庭、审查员。\"/\"仅限紧急状态。请勿扰乱街道秩序。\"。这将影响§H军官团对国家机器的掌控以及军政府的合法性§!。"
 SAU_the_regency_decree_choice_tt: "§Y选择如下§! - “受限摄政，保留王位和清真寺治权” / “完全摄政，包揽所有权力” / “五年摄政。设定一个期限”。这会影响§H军官对国家的控制以及军政府的合法性§!。"
 SAU_the_succession_question_choice_tt: "§Y选择如下§! - \"养着他们，慷慨且永久\" / \"流放年长者\" / \"起诉，并没收发现的一切\" / \"让他们荣华富贵吧\"。这将影响§H军官团对国家的掌控以及军政府的合法性§!。"
 SAU_the_silk_road_pivot_choice_tt: "§Y选择如下§! - “港口、铁路和北部走廊” / “首都，且不附带任何条件”。这会影响§H军官团对国家的掌控以及军政府的合法性§!。"
 SAU_guardians_of_the_two_mosques_choice_tt: "§Y选择如下§! - \"站在国王身后。借用头衔，不要夺取。\" / \"监护权属于国家，而不是个人。\"。这将影响§H军官团对国家的掌控以及军政府的合法性§!。"
 SAU_secure_support_in_the_al_madinah_province_choice_tt: "§Y选择如下§! - \"讨好他们。做出必须做出的让步。\" / \"重新分配坐席。我们现在就需要措辞。\"。这将影响§H军官团对国家的掌控以及军政府的合法性§!。"
 SAU_secure_support_in_the_mecca_province_choice_tt: "§Y选择如下§! - “付钱给商队。妥善收买希贾兹” / “驻守那里。他们会适应的”这将影响§H军官团对国家的掌控与军政府的合法性§!。"
 SAU_appoint_loyalists_in_the_provinces_choice_tt: "§Y选择如下§! - '那些年长的王子们。他们的名字至今仍代表着这个国家。' / '被忽视的堂兄弟们。感激比威望更廉价' / '富有的不满者。先拉拢进来，之后再审查'。此举将影响§H军官团对国家的掌控以及军政府的合法性§!。"
 SAU_disband_the_national_guard_choice_tt: "§Y选择如下§! - \"吸收他们，进行改编\" / \"彻底解散卫队，让他们回家\" / \"将之缩编，置于我们的指挥之下\"。这将影响§H军官对国家的掌控以及军政府的合法性§!。"
 SAU_the_riyadh_meeting_operation_decisive_storm_choice_tt: "§Y选择如下§! - \"那就这么定了。把这个问题向他们所有人提出\"/\"王国将自己回应也门\"。"
 SAU_the_oil_defense_strategy_choice_tt: "§Y选择如下§! - “抽取。油田就是策略。” / “打造一个比油井更长久的产业。” / “勘探。外面还有更多”。"
 SAU_women_in_the_shura_council_choice_tt: "§Y选择如下§! - “根据皇家法令，设立三十个席位” / “议事厅保持原样”"
 SAU_hold_municipal_elections_choice_tt: "§Y选择如下§! - “席位减半，只允许男性参与” / “全部由任命产生，然后称之为协商” / “让女性也参与进来”"
 SAU_counter_terrorism_cooperation_choice_tt: "§Y选择如下§! - “全盘接受华盛顿的提议” / “马巴希特能自己搞定” / “改造他们，把他们下狱只能制造模仿者”"
 SAU_al_saud_national_dialogue_choice_tt: "§Y选择如下§! - “让他们发声，并公布他们的言论” / “他们或许会召开会议，但议程由我们掌控”"
 SAU_consolidating_the_crown_choice_tt: "§Y选择如下§! - “让忠诚的委员会决定继承问题” / “国王指定了他的继承人，委员会将会高呼万岁” / “进行收买以求得同意”"
 SAU_a_new_kingdom_choice_tt: "§Y选择如下§! - \"在政府能承受的范围内进行改革\" / \"只有法令上的署名会改变\" / \"开放经济，然后再开放政治\""
 SAU_the_global_ummah_question_choice_tt: "§Y选择如下§! - “清真寺是责任而非命令”/“我们代表虔信徒发声”。这将改变§H王国的海外方针§!。"
 SAU_reclaim_the_oic_leadership_choice_tt: "§Y选择如下§! -“提供资金”/“配备人员”。"
 SAU_the_expatriate_workforce_question_choice_tt: "§Y选择如下§! - “让他们回家”/“归化有用者”。这将改变§H王国的海外方针§!。"
 SAU_islamic_solidarity_conference_choice_tt: "§Y选择如下§! - \"在麦加召开\" / \"在国外召开\"。"
 SAU_the_sovereign_aid_question_choice_tt: "§Y选择如下§! - “无条件援助”/“有条件援助”。这将决定§H王国的海外方针§!。"
 SAU_the_domestic_supply_quota_choice_tt: "§Y选择如下§! - “严格配额”/“分阶段配额”。"
 SAU_the_foreign_wealth_question_choice_tt: "§Y选择如下§! - “全部转回国内”/“让它们生利息”。这将决定§H王国的海外方针§!。"
 SAU_eradicate_foreign_dependency_choice_tt: "§Y选择如下§! - “武器优先”/“其他事项优先”。"
 SAU_the_superpower_engagement_question_choice_tt: "§Y选择如下§! - “自力更生”/“武装中立”。这将决定§H王国的海外方针§!。"
 SAU_the_international_forums_question_choice_tt: "§Y选择如下§! - “退出这些机构” / “从内部瓦解他们”。这将改变§H王国的海外方针§!。"
 SAU_the_spirit_of_73_choice_tt: "§Y选择如下§! - “公开威胁禁运” / “悄悄实施”。"
 SAU_the_fortress_kingdom_choice_tt: "§Y选择如下§! - “重视外部”/“重视内部”。"
 SAU_the_national_cadre_initiative_choice_tt: "§Y选择如下§! -“技术机构”/“军事学院”。"
 SAU_the_sovereign_civil_service_choice_tt: "§Y选择如下§! - “用考试任命” / “按忠诚任命”。"
 SAU_centralization_of_the_provincial_emirates_choice_tt: "§Y选择如下§! - “买断他们的特许”/“直接替换掉他们”。"
 SAU_the_foreign_bases_question_choice_tt: "§Y选择如下§! - “打击外国势力，让他们滚回家”/“维持这一安排。必要时，原则也得让步”。"
 SAU_purge_the_westernized_elite_choice_tt: "§Y选择如下§! - “放逐他们 / “再教育他们”。"
 SAU_the_closed_frontier_choice_tt: "§Y选择如下§! - “彻底封锁”/“接纳我们所需之人”。"
 SAU_ban_foreign_media_choice_tt: "§Y选择如下§! - “干扰”/“收买”。"
 SAU_the_virtue_committees_return_choice_tt: "§Y选择如下§! - “让他们以强力巡逻”/“保持建议性质”。"
 SAU_increase_the_ulemas_authority_choice_tt: "§Y选择如下§! - “给他们法院”/“给他们学校”。"
 SAU_the_faisalite_resurgence_choice_tt: "§Y选择如下§! - \"由布道坛宣布\"/\"由宫室宣布\"。"
 SAU_the_2007_legal_reforms_choice_tt: "§Y选择如下§! - “盎格鲁-撒克逊体系”/“以伊斯兰教法为先的框架。”/“混合模式”。"
 SAU_royal_decree_m_30_capital_market_law_choice_tt: "§Y选择如下§! - “独立的技术官僚” / “王室监督至关重要” / “引进外国专家”。"
 SAU_establish_corruption_courts_choice_tt: "§Y统治格局重塑§! - 宫廷肃清腐败，税收与政治点数收益随之上升。§R投资者将新风险计入价格§!，而被指控者亦有靠山。"
 SAU_the_ritz_carlton_purge_choice_tt: "§Y统治格局重塑§! - 清洗带来了政治点数、更廉价的腐败和更好的情报。§R外国资本将其视为征收§!，并据此盘算对王国索取。"
 SAU_backdoor_deals_choice_tt: "§Y统治格局重塑§! - 回报、市场收入与投资均有所改善。§R腐败加倍加深§!，宫廷为此付出政治点数的代价。"
 SAU_new_partners_choice_tt: "§Y选择如下§! - 委员会在海湾以外挑选一个庇护国：'土耳其' / '伊朗' / '印度' / '巴基斯坦' / '俄罗斯'。被选中的国家将被要求作出答复。"
 SAU_the_khaleeji_union_choice_tt: "§G海湾地区合并为一个国家§! - 所有剩余的海合会成员国将被§H吞并并保留其军队§!，其领土被核心化，王国将更名为§H海湾国§!。"
 SAU_ras_al_khair_complex: "拉丝海尔综合体"
 SAU_ras_al_khair_complex_desc: "在朱拜勒以北的海湾沿岸，王国正为一座规模前所未见的海水淡化与发电综合设施浇筑地基。这是国家的钱、国家的土地、国家的劳力，并且当那些签署批准它的人逝去之后，它仍将继续运转。\n\n§G在哈萨建造一座化石燃料发电厂及基础设施§!，并稳定国家。\n\n§R耗资60B§!。由王国建造，归王国所有。"
 SAU_the_shuaibah_iwpp: "舒艾巴独立水电项目"
 SAU_the_shuaibah_iwpp_desc: "在吉达以南，一个财团自担成本建设了海水淡化和发电厂，并以二十年合同将产出回售给王国。这更便宜，也更快，但电表控制权在他国。\n\n§G在汉志建造一座化石燃料发电厂和能源基础设施§!。\n\n§R耗资30B并加深美国影响力§!。价格减半，却不完全属于你。"
 SAU_the_sovereign_saudi_water_company: "沙特主权水务公司"
 SAU_the_sovereign_saudi_water_company_desc: "无论管道由谁铺设，王国如今都将这一切置于一家主权公司之下 - 关税、储备、各省之间的分配。有史以来第一次，有一个部门能回答“王国究竟有多少水”这个问题。\n\n§G开启“主权水务”§!，即王国在水资源上的立场，并授予政治点数。\n\n它并不生产水。它只是让王国对水负责。"
 SAU_throttle_pipeline_yemen: "阿拉伯海管道限流"
 SAU_throttle_pipeline_yemen_desc: "限制南部管线流量。我们运得少、赚得也少 - 但萨那的过境费也会随之下降，他们会更快撑不住的。"
 SAU_throttle_pipeline_syria: "黎凡特管道限流"
 SAU_throttle_pipeline_syria_desc: "限制地中海管线流量。安曼和大马士革都得少拿，这同时会提醒他们是谁家原油在填充这条管道。"
 SAU_throttle_pipeline_iraq: "欧洲管道限流"
 SAU_throttle_pipeline_iraq_desc: "限制北方管线流量。来自巴格达的费用相应减少，但我们的施压不代表完全关闭阀门。"
 SAU_tt_pipeline_shutdown_dependence: "§G减少对石油的依赖。§!随着这条管道关闭，沙特阿拉伯王国对原油出口的依赖程度降低了。"
 SAU_shutdown_pipeline_yemen: "关闭阿拉伯海管道"
 SAU_shutdown_pipeline_yemen_desc: "关闭马赫拉的阀门。出口收入将中断，但我们支付给萨那的过境费也将停止。也门不会原谅这一点。"
 SAU_shutdown_pipeline_syria: "关闭黎凡特管道"
 SAU_shutdown_pipeline_syria_desc: "关闭地中海管线。安曼和大马士革都将失去他们的过境费，而他们都会记住是谁关掉了油泵。"
 SAU_shutdown_pipeline_iraq: "关闭欧洲管道"
 SAU_shutdown_pipeline_iraq_desc: "关闭北方管线。土耳其延伸段无货可运，也将随之关闭；巴格达和安卡拉都失去了过境费。"
 SAU_shutdown_pipeline_turkey: "关闭土耳其延伸段"
 SAU_shutdown_pipeline_turkey_desc: "停止在伊拉克边境以外继续输送油。干线保持开放 - 只有安卡拉会失去它的分成，而安卡拉会注意到这一点。"
 SAU_events.355.a: "批准销售"
 SAU_events.355.b: "拒绝请求"
 SAU_events.355.desc: "利雅得想要帕拉丁火炮，而且需求可观。自1970年代以来，沙特一直使用美制155毫米火炮，因此人员、炮弹和整套火力指挥体系早已由我国产品掌控；他们真正想要的是信息化系统，能让炮兵连在反炮兵雷达作出反应之前完成射击并转移阵地。沙特人将按时以现金支付，这笔交易还能将竞争对手挡在我们已占据三十年的火炮市场之外。但这也意味着把我国制造的榴弹炮置于一场我们无法控制的边境战争之中。"
 SAU_events.355.t: "沙特请求美国火炮"
 SAU_events.356.a: "批准销售"
 SAU_events.356.b: "拒绝请求"
 SAU_events.356.desc: "利雅得传来一项不寻常的请求：沙特人想要姆斯塔-S。沙特从未购买过俄罗斯火炮，其炮兵整个职业生涯都在训练使用西方火炮，因此这笔交易的动机相当薄弱。但政治上并非如此。向海湾地区资金最雄厚的军队出售武器将撬开自石油禁运以来华盛顿一直视为封闭的市场，而其他海湾国家都会注意到利雅得的动向。"
 SAU_events.356.t: "沙特请求俄国火炮"
 SAU_events.357.a: "批准销售"
 SAU_events.357.b: "拒绝请求"
 SAU_events.357.desc: "利雅得已提出购买“凯撒”火炮，而这一次，推销词几乎不用费心去写。依靠自身动力即可跨越王国的广袤距离，无需运输车，且能在最后一发炮弹射出后一分钟内重新上路。沙特人目睹了轮式榴弹炮在其南部边境的表现，并得出了显而易见的结论。这笔订单将让罗阿讷的生产线维持多年运转，并将利雅得绑定在法国炮弹、法国火炮和法国技术人员之上。"
 SAU_events.357.t: "沙特请求法国火炮"
 SAU_events.358.a: "批准销售"
 SAU_events.358.b: "拒绝请求"
 SAU_events.358.desc: "沙特人想要PzH 2000，这既令人荣幸，也同样令人尴尬。它是世界上最好的榴弹炮，业内人尽皆知；也正因如此，联邦议院将花费两周时间争论这些火炮最终会去向何处。沙特是一个付得起钱的客户，其南部边境正有战事，而出口许可证必须由一个承诺过对此事慎之又慎的政府来签署。工业界想要这笔订单。执政联盟若批准，可能就撑不下去了。"
 SAU_events.358.t: "沙特请求德国火炮"
 SAU_events.364.a: "批准销售"
 SAU_events.364.b: "拒绝请求"
 SAU_events.364.desc: "利雅得正在求购M270，而这并非又一笔火炮买卖。一套能在不到一分钟内将一个营级当量的钢铁倾泻到某个网格区域的发射装置是一种战略武器；而只要沙特拥有了发射车，供应或扣留火箭弹的选择权就掌握在我方手里。这既是筹码也是风险：无论这些发射车被用于什么，都会被与板条箱上的我国旗帜一同进入媒体视线。"
 SAU_events.364.t: "沙特请求美国火箭炮"
 SAU_events.365.a: "批准销售"
 SAU_events.365.b: "拒绝请求"
 SAU_events.365.desc: "利雅得已请求购买“龙卷风”系统，而这一请求所透露的信息远超过订单所能带来的收益。若非遭拒，没人会把300毫米火箭炮卖给一个能买美国货的国家。沙特渴望得到在华盛顿无法获得的影响力，并愿意来莫斯科寻求。这批火炮是一笔好买卖。而开创的先例则更为有利。"
 SAU_events.365.t: "沙特请求俄国火箭炮"