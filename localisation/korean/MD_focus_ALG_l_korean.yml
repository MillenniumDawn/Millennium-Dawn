 AlgeriaFocusNews.100.t: "카사블랑카 구상: 강대국 구애"
 AlgeriaFocusNews.100.d: "알제리는 카사블랑카 구상을 지지받기 위해 주요 강대국에 구애하기로 했습니다. 비용이 많이 들지만 AU에서 강력한 결과를 얻을 가능성이 높아집니다."
 AlgeriaFocusNews.101.t: "카사블랑카 구상: 지역적 접근"
 AlgeriaFocusNews.101.d: "알제리는 인접국과 아프리카 연합 동맹국에 의존하는 지역 한정 외교 노선을 추진하고 있습니다."
 AlgeriaFocusNews.102.t: "카사블랑카 구상: 혼합 전략"
 AlgeriaFocusNews.102.d: "알제리는 위험을 분산하면서 압력을 높이기 위해 지역적 노력과 국제적 노력을 결합할 것입니다."
 AlgeriaFocusNews.103.t: "카사블랑카 구상: 대성공"
 AlgeriaFocusNews.103.d: "카사블랑카 구상이 AU/UN 절차에서 결정적인 결과를 거두었습니다. 외교적 압력에 실질적인 탄력이 붙었으며, 알제리는 모로코가 외교적 영유권 주장을 포기하도록(그리고 귀하의 중점에 따라 중핵을 제거하도록) 압박할 유리한 위치에 있습니다."
 AlgeriaFocusNews.104.t: "카사블랑카 구상: 어느 정도의 성공"
 AlgeriaFocusNews.104.d: "카사블랑카 구상이 의미 있는 외교적 결과를 냈습니다. 모로코에 대한 압력이 커졌으며, AU는 지지하지만 결정적이지는 않습니다."
 AlgeriaFocusNews.105.t: "카사블랑카 구상: 미미한 결과"
 AlgeriaFocusNews.105.d: "카사블랑카 구상은 AU에서 미미한 공감만 얻어 냈습니다. 중대한 양보를 이끌어 내려면 추가 작업이 필요합니다."
 AlgeriaFocusNews.106.t: "카사블랑카 구상: 임무 시간 초과"
 AlgeriaFocusNews.106.d: "실질적인 결과 없이 시간이 흘렀습니다. 외교적 동력을 잃었습니다."
