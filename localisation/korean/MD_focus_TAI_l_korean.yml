l_korean:
 TAI_legacy_of_1949: "1949년의 유산"
 TAI_legacy_of_1949_desc: "1949년 국공내전이 종결되면서 국민당(KMT)과 그 지지자들은 대만 섬으로 피난했습니다. 이 사건의 유산은 대만 현지의 토착주의 운동과 맞물려, 대다수 대만 시민들이 중국 본토와의 통일을 강력하게 거부하는 계기가 되었습니다."
 TAI_the_great_chip_empire: "반도체 대제국"
 TAI_the_great_chip_empire_desc: "Having taken advantage of semiconductor and microchip production in its infancy, and by being a more attractive investment than other nations, Taiwan has catapulted itself to the forefront of the industry. Through cheap, efficient production, and large exports to western nations, Taiwan has balanced its economy and national security on being the supply of microchips to the western world, and continues to be an industry leader through constant and regular innovation."
 TAI_flight_crew_strike: "타오위안 승무원 노조 파업"
 TAI_flight_crew_strike_desc: "결과가 없으면! 멈추지 않는다!"
 USA_tsmc_access_modifier: "TSMC 접근권"
 USA_tsmc_access_modifier_desc: "미국 산업은 대만의 반도체 생태계에 대한 안정적인 접근권으로 이익을 얻습니다. 대만이 존재하지 않게 되거나, 타이베이의 통제권을 잃거나, 미국과 전쟁에 돌입하거나, 반도체 수출을 제한하면 이 이익은 중단됩니다."
 TAI_tsmc_trade_benefits_tier_1_tt: "TSMC의 발전으로 §Y대만§!과 §Y미국§!의 §Y공장당 자원§!이 §G+1§!만큼 증가합니다. 미국이 받는 이익에는 대만에 대한 지속적인 접근권이 필요합니다."
 TAI_tsmc_trade_benefits_tier_2_tt: "TSMC의 발전으로 §Y대만§!과 §Y미국§!의 §Y공장당 자원§!이 §G+2§!만큼 증가합니다. 미국이 받는 이익에는 대만에 대한 지속적인 접근권이 필요합니다."
 TAI_tsmc_trade_benefits_tier_3_tt: "TSMC의 발전으로 §Y대만§!과 §Y미국§!의 §Y공장당 자원§!이 §G+3§!만큼 증가합니다. 미국이 받는 이익에는 대만에 대한 지속적인 접근권이 필요합니다."
 TAI_foxconn_ev_pipeline: "물량 없는 전기차 파이프라인"
 TAI_foxconn_ev_pipeline_desc: "기준 차량과 협력 사업은 공학적 선택지를 만들어 내지만, 검증된 제품과 지급 능력이 있는 고객은 여전히 드뭅니다. 안정적인 물량이 확보되기도 전에 자본이 먼저 투입됩니다."
 TAI_foxconn_factory_behind_brand: "브랜드 뒤의 공장"
 TAI_foxconn_factory_behind_brand_desc: "훙하이/폭스콘은 금형, 조달, 공정 엔지니어링, 시험, 물류를 통해 고객사의 설계를 반복 가능한 생산으로 바꿉니다. 방대한 처리량에도 불구하고 낮은 마진과 막강한 고객사에 발목이 잡혀 있습니다."
 TAI_foxconn_factory_city_production: "공장 도시 생산"
 TAI_foxconn_factory_city_production_desc: "촘촘한 공급업체망, 기숙사, 교통, 산업 서비스 덕분에 생산량을 빠르게 늘릴 수 있습니다. 소수의 캠퍼스 안에 노동과 일상생활을 집중시키는 것은 노동과 운영 차질 위험도 함께 키웁니다."
 TAI_foxconn_resilient_manufacturing_network: "회복력 있는 제조 네트워크"
 TAI_foxconn_resilient_manufacturing_network_desc: "'구축, 운영, 현지화' 네트워크는 검증된 지역 거점들을 연결하면서 가치 있는 중국 본토의 생산 역량을 유지합니다. 중복성은 시장 접근성과 위기 복구력을 높이지만, 그 대가로 지속적인 조율 비용이 발생합니다."
 taiwan.300.a: "가장 촘촘한 본토 네트워크를 구축한다"
 taiwan.300.b: "남을 위해 만들기보다 자체 브랜드를 추구한다"
 taiwan.300.d: "2000년에 이르러 대만에 본사를 둔 훙하이/폭스콘은 중국 본토에서 빠르게 확장 중인 생산 체계를 갖춘 자리 잡은 전자제품 제조업체가 되었습니다. 경영진은 계속해서 타사 브랜드를 위해 대규모로 생산할 것인지, 아니면 같은 자본을 들여 자체 브랜드를 구축하려 시도할 것인지 결정해야 합니다."
 taiwan.300.t: "브랜드 뒤의 공장"
 taiwan.301.a: "기준을 높이고 신중하게 자동화한다"
 taiwan.301.b: "비용을 억제하고 생산을 내륙으로 옮긴다"
 taiwan.301.d: "선전 룽화 캠퍼스에서 발생한 일련의 노동자 사망과 고통을 호소하는 보고로 인해, 근무 시간, 보상, 안전, 그리고 공장 도시 체제 내의 생활이 도마 위에 올랐습니다. 원인에 대해서는 논란이 있으나, 제도적 대응이 필요하다는 점만큼은 논란의 여지가 없습니다."
 taiwan.301.t: "선전 노동 위기"
 taiwan.302.a: "출시 체계를 정저우에 집중한다"
 taiwan.302.b: "여러 내륙 생산 거점을 구축한다"
 taiwan.302.d: "정저우는 폭스콘에 기반시설, 인력 모집 지원, 그리고 거대한 내륙 생산 캠퍼스를 위한 충분한 부지를 제공합니다. 이 사업은 아이폰 출시를 위한 탁월한 생산 능력을 만들어 낼 수 있지만, 하나의 고객, 하나의 장소, 하나의 정책 환경에 대한 의존도를 심화시킵니다."
 taiwan.302.t: "아이폰 시티"
 taiwan.303.a: "샤프 자본 재구성을 주도한다"
 taiwan.303.b: "전략적 제휴를 유지한다"
 taiwan.303.d: "샤프는 자본 재구성 파트너가 필요하고, 폭스콘은 디스플레이 전문성과 엔지니어, 그리고 더 긴밀한 부품 관계를 원합니다. 경영권을 확보하면 기술이 즉시 이전되는 것이 아니라 어려운 일본 기업 회생 작업을 떠안게 될 것입니다."
 taiwan.303.t: "벼랑 끝의 샤프"
 taiwan.304.a: "위스콘신 사업을 추진한다"
 taiwan.304.b: "착공 전에 사업을 축소한다"
 taiwan.304.d: "워싱턴이 폭스콘의 제안에 답하였습니다. 회사는 이제 제시된 지원이 전면적인 투자를 정당화하는지, 아니면 착공 전에 사업을 축소해야 하는지 결정해야 합니다."
 taiwan.304.t: "위스콘신 사업 이행"
 taiwan.305.a: "어떤 단일 충격에도 무너지지 않는 제조 네트워크"
 taiwan.305.b: "전기차 시대를 위한 공급업체"
 taiwan.305.c: "하나의 제품 출시를 중심으로 세워진 공장 도시"
 taiwan.305.e: "모두의 브랜드 뒤에 있는 공장"
 taiwan.305.d: "완제품 AI 랙은 보드, 가속기, 전원, 냉각, 케이블, 그리고 엄격한 시스템 검증을 결합하며, 엔비디아는 폭스콘이 이를 조립해 주기를 원합니다. 사반세기에 걸친 규모 확대, 위기, 다각화가 이미 이 일에 어떤 유형의 제조업체가 임하게 될지를 결정해 두었습니다."
 taiwan.305.t: "AI 공장"
 taiwan.310.t: "불황을 뚫고 12인치로"
 taiwan.310.d: "반도체 붕괴로 건설에 수십억이 든 클린룸이 텅 비었고, TSMC의 팹은 가동하지 않으면 아무것도 벌지 못합니다. 300mm 전환은 웨이퍼당 비용을 모두 낮추겠지만, 이는 장비, 통합, 인내심 있는 수율 개선 작업에 수년을 들인 뒤의 일입니다. 지금 팹 12를 짓는다는 것은 구매가 끊긴 시장을 향해 짓는다는 뜻입니다."
 taiwan.310.a: "불황 속에서도 300mm 증설에 자금을 댄다"
 taiwan.310.b: "수요가 돌아올 때까지 현금을 보존한다"
 taiwan.311.t: "배신 없는 설계도"
 taiwan.311.d: "TSMC의 고객들은 우리 공정으로 무엇이든 만들려면 설계 키트, 라이브러리, 도구, 검증 데이터가 필요하며, 이 고객들은 모두 서로 경쟁 관계에 있습니다. 개방형 혁신 플랫폼은 모두에게 동일한 자료를 제공하면서도 어느 누구에게도 경쟁사의 설계는 넘기지 않을 것입니다. 여기서 제조되는 제품은 바로 신뢰입니다."
 taiwan.311.a: "키트를 공개하고 플랫폼을 연다"
 taiwan.311.b: "모든 고객과의 협력을 양자 관계로 유지한다"
 taiwan.312.t: "모바일 핵심 고객"
 taiwan.312.d: "애플은 A8을 위해 TSMC의 다른 고객 대부분을 합친 것보다 많은 최첨단 생산 능력을 원하며, 수년 앞서 이를 확보하기 위해 대가를 지불할 것입니다. 이 물량만으로도 다음 공정 노드의 자금을 댈 수 있습니다. 하지만 그렇게 되면 파운드리의 운명이 한 회사의 제품 주기에 좌우됩니다."
 taiwan.312.a: "핵심 고객을 위해 최첨단 생산 능력을 확보해 둔다"
 taiwan.312.b: "파운드리 중립성을 고수한다"
 taiwan.313.t: "애리조나: 대가를 치르는 보험"
 taiwan.313.d: "워싱턴은 미국 땅에서 최첨단 웨이퍼를 생산하기를 원하고 비용 일부를 지원할 의향이 있으며, 요청을 받은 회사는 TSMC입니다. 발표가 곧 팹은 아닙니다. 장비, 엔지니어, 용수, 고객이 모두 갖춰져야 비로소 검증된 웨이퍼가 한 장이라도 나오며, 이 모든 것이 신주보다 애리조나에서 더 많은 비용이 듭니다. 보험은 실재하며, 보험료 또한 실재합니다."
 taiwan.313.a: "해외 팹에 투자한다"
 taiwan.313.b: "최첨단 공정을 섬에 남겨 둔다"
 taiwan.314.t: "병목이 된 칩"
 taiwan.314.d: "자동차 제조사, 소비자 브랜드, 컴퓨팅 고객 모두가 존재하지 않는 TSMC 생산량을 두고 입찰하고 있으며, 이들의 정부가 직접 전화를 걸기 시작했습니다. 국가가 물량 배정을 정하게 하면 중요한 수도들에서 상당한 호의를 얻을 수 있습니다. 하지만 이는 모든 고객에게 보이지 않는 대기열이 이제 자신의 순번을 결정한다는 것을 알리는 일이기도 합니다."
 taiwan.314.a: "국가가 물량 배정을 주도하게 한다"
 taiwan.314.b: "물량 배정을 상업적 기준으로 유지한다"
 taiwan.315.t: "CoWoS 제약"
 taiwan.315.d: "이제 어려운 부분은 웨이퍼가 아닙니다. 가속기는 첨단 패키징, 적층 메모리, 기판이 있어야 가치를 지니는데, TSMC의 CoWoS 생산 능력은 턱없이 부족합니다. 이 능력을 구축하면 웨이퍼 파운드리가 더 큰 무언가로 바뀌며, 현재 우리 고객들이 차지하고 있는 사업 영역에 발을 들이게 됩니다."
 taiwan.315.a: "첨단 패키징을 하나의 사업으로 키운다"
 taiwan.315.b: "순수 웨이퍼 파운드리로 남는다"
 taiwan.316.t: "우리는 어떤 파운드리를 만들어 냈는가?"
 taiwan.316.d: "25년에 걸친 공정 노드, 불황, 핵심 고객, 해외 기공식은 TSMC가 무엇인지, 섬이 실제로 무엇을 제조하는지, 그리고 그것이 어디로 가는지를 누가 결정하는지를 확정해 주었습니다."
 taiwan.316.a: "국가가 이끄는 파운드리"
 taiwan.316.b: "신뢰할 수 있는 동맹 네트워크"
 taiwan.316.c: "웨이퍼 가공소가 아닌 시스템 파운드리"
 taiwan.316.e: "순수 파운드리, 그 이상은 없다"
 TAI_tsmc_state_directed_foundry: "국가 주도 파운드리"
 TAI_tsmc_state_directed_foundry_desc: "물량 배정은 영업부서를 거치기 전에 정부 부처를 거치며, 대기열은 정책의 문제입니다. 생산 능력은 섬의 이익에 먼저 응답하고 고객에게는 그다음으로 응답하며, 고객들도 이를 알아차렸습니다."
 TAI_tsmc_trusted_allied_foundry_network: "신뢰할 수 있는 동맹 파운드리 네트워크"
 TAI_tsmc_trusted_allied_foundry_network_desc: "애리조나, 구마모토, 드레스덴이 검증을 마치고 가동되었으므로, 최첨단 공정은 더 이상 하나의 섬에 있는 하나의 지점이 아닙니다. 모든 것을 본국에 집중하는 것보다 웨이퍼당 비용은 더 들지만, 집중으로는 결코 얻을 수 없던 것을 얻게 됩니다."
 TAI_tsmc_systems_foundry_platform: "시스템 파운드리 플랫폼"
 TAI_tsmc_systems_foundry_platform_desc: "웨이퍼, 패키징, 적층 메모리, 시험이 이제 하나의 검증된 제품으로 출하됩니다. 파운드리는 그 아래 계층이 아니라 완성된 역량을 판매하며, 어차피 제약 요인이 옮겨 간 곳이 바로 그곳입니다."
 TAI_tsmc_disciplined_pure_play_foundry: "절제된 순수 파운드리"
 TAI_tsmc_disciplined_pure_play_foundry_desc: "브랜드도, 제품도, 우리에게서 구매하는 이들과의 경쟁도 없습니다. 이 모델을 성립시킨 절제가 곧 모델 자체이며, 그것은 처음 그대로 지켜졌습니다."
 taiwan.320.t: "브랜드와 공장을 분리하는 에이서"
 taiwan.320.d: "에이서가 다른 회사들의 컴퓨터를 제조하면서 같은 매대에 자사 제품을 판매하는 것은 고객이 청구서만 봐도 알 수 있는 이해 충돌입니다. 제조 부문을 위스트론으로 분리하면 각 부문이 상대 부문 때문에 놓치던 사업을 좇을 수 있습니다. 하지만 마침내 회사가 커진 시점에 둘로 쪼개는 일이기도 합니다."
 taiwan.320.a: "브랜드와 공장을 분리한다"
 taiwan.320.b: "하나의 통합 제조업체로 유지한다"
 taiwan.321.t: "x86 문제의 매듭"
 taiwan.321.d: "명령어 집합과 칩셋을 둘러싼 VIA 테크놀로지스와 인텔 간의 수년간의 소송은 법정 승리가 아닌 10년간의 상호 라이선스로 막을 내립니다. 이 조건은 VIA가 계속 제품을 만들 권리를 보장하지만, 그 조건은 기존 강자가 정한 것입니다. 세 번째 x86 업체는 법적으로는 여전히 가능하나 상업적으로는 가능성이 낮습니다."
 taiwan.321.a: "합의하고 라이선스를 확보한다"
 taiwan.321.b: "더 나은 조건을 위해 버틴다"
 taiwan.322.t: "게이머 공화국"
 taiwan.322.d: "자신의 메인보드를 직접 고르는 부품 구매자들은 존재감을 드러내는 부품에 프리미엄을 지불할 것입니다. 에이수스가 전용 '로그(Republic of Gamers)' 라인을 출시하면 범용 사업에서는 볼 수 없던 마진을 얻겠지만, 부품 공급업체가 한 번도 해 본 적 없는 마케팅, 지원, 디자인이 필요합니다."
 taiwan.322.a: "프리미엄 브랜드를 구축한다"
 taiwan.322.b: "부품 공급업체로 남는다"
 taiwan.323.t: "두 번째 분리"
 taiwan.323.d: "에이서를 갈라놓았던 것과 같은 갈등이 이제 경쟁사를 갈라놓습니다. 공장이 브랜드의 경쟁사들을 상대하는 한 브랜드는 성장할 수 없습니다. 제조 부문을 분사하면 세계 최대 규모의 위탁 제조업체 중 하나가 탄생합니다. 하지만 브랜드를 가능케 했던 공장을 내주는 일이기도 합니다."
 taiwan.323.a: "제조 부문을 분사한다"
 taiwan.323.b: "브랜드와 공장을 함께 유지한다"
 taiwan.324.t: "모두를 위한 소형 PC"
 taiwan.324.d: "에이수스가 이PC로 시작한 넷북은 컴퓨팅 분야에서 가장 빠르게 팔리는 부류가 되었고, 대만의 모든 제조사가 주말이면 값싸고 가볍고 성능이 낮은 노트북을 만들어 낼 수 있습니다. 마진은 형편없고 물량은 엄청납니다. 이것이 업계의 미래인지, 고객이 아무것도 기대하지 않도록 길들이는 일시적 유행인지는 아직 분명하지 않습니다."
 taiwan.324.a: "모바일 전환을 좇는다"
 taiwan.324.b: "데스크톱 마진을 방어한다"
 taiwan.325.t: "마진 압박"
 taiwan.325.d: "물량은 휴대전화가 가져갔고 매대는 브랜드들이 차지했으며, 에이서와 에이수스를 비롯한 섬의 제조사들은 줄어드는 시장의 남은 몫을 두고 서로 경쟁하고 있습니다. 위에서 업계를 조율하면 서로 가격을 깎는 일을 막을 수 있습니다. 그러나 이는 어느 기업이 살아남을 자격이 있는지를 정부 부처에서 결정한다는 뜻이기도 합니다."
 taiwan.325.a: "위에서 업계를 조율한다"
 taiwan.325.b: "시장이 통합하도록 맡긴다"
 taiwan.326.t: "대만 컴퓨팅 생태계 평가"
 taiwan.326.d: "사반세기에 걸친 분할, 분사, 프리미엄 브랜드, 가격 전쟁은 에이서, 에이수스, 콰타를 비롯한 섬의 컴퓨터 산업이 무엇인지, 즉 상자에 누구의 이름이 적히고 그 뒤에 누구의 공장이 있는지를 확정해 주었습니다."
 taiwan.326.a: "전 영역을 아우르는 컴퓨팅 생태계"
 taiwan.326.b: "브랜드 시스템 강자"
 taiwan.326.c: "글로벌 부품 연합"
 taiwan.326.e: "누구도 벗어나지 못한 마진 압박"
 TAI_pc_full_spectrum_computing_ecosystem: "전 영역 컴퓨팅 생태계"
 TAI_pc_full_spectrum_computing_ecosystem_desc: "부품, 위탁 제조, 완제품 브랜드가 서로를 갉아먹도록 방치되지 않고 하나의 조율된 산업으로 유지되었습니다. 섬은 컴퓨터의 모든 계층을 만들며 그 사이의 선택도 의도적으로 내립니다."
 TAI_pc_branded_systems_powerhouse: "브랜드 시스템 강자"
 TAI_pc_branded_systems_powerhouse_desc: "상자에 적힌 이름은 대만의 것이며 프리미엄을 요구하는데, 이는 어떤 부품 공급업체도 가져 본 적 없는 위치입니다. 브랜드는 관심으로 유지되고, 관심은 소유하는 것이 아니라 빌리는 것입니다."
 TAI_pc_global_component_commonwealth: "글로벌 부품 연합"
 TAI_pc_global_component_commonwealth_desc: "어디서 팔리든 거의 모든 컴퓨터에는 다른 사람의 이름을 단 채 이곳에서 만들어진 부품이 들어 있습니다. 물량은 어마어마하지만 마진은 상표를 붙이는 쪽의 몫입니다."
 TAI_pc_fragmented_margin_squeeze: "분열된 마진 압박"
 TAI_pc_fragmented_margin_squeeze_desc: "너무 많은 유능한 기업들이 줄어드는 같은 시장을 쫓으며 바닥까지 서로 가격을 깎았습니다. 기술력은 한 번도 나빠진 적이 없었지만, 가격은 끝없이 떨어졌습니다."