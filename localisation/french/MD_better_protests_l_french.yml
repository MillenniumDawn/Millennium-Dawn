 protests_main_text: "Nous devons répondre aux attentes de nos citoyens pour éviter les manifestations et autres développements sociaux néfastes.\n§YForce des manifestations§!: [protest_strength_TT]\n§YRadicalisation des manifestations§!: [protest_radicalisation_TT][fuel_protests_TT]\n"
 OPEN_PROTESTS_BUTTON: "Ouvrir l'écran du §Ysystème de protestations§!"
 OPEN_PROTESTS_BUTTON_TT: "Cet écran contient des informations sur les dépenses gouvernementales attendues, la force attendue du mouvement de protestation et la radicalisation"
 PROTEST_TITLE: "§YSystème de protestations§!"
 CLOSE_PROTEST_SCREEN: "Fermer l'écran des lois attendues"
 expected_law_mechanic_tt: "Objet des §Ylois attendues§! \n"
 EL_green_square_explanation_tt: "Les carrés §GVerts§! représentent le niveau de dépenses requis par nos citoyens et couvert par nos dépenses actuelles."
 EL_blue_square_explanation_tt: "Les carrés §BBleus§! représentent le niveau de dépenses NON requis par nos citoyens mais couvert par nos dépenses actuelles."
 EL_red_square_explanation_tt: "Les carrés §RRouges§! représentent le niveau de dépenses requis par nos citoyens et NON couvert par nos dépenses actuelles - ceci est la source des manifestations qui prennent de l'ampleur."
 EL_white_square_explanation_tt: "Les carrés Blancs représentent les niveaux de dépenses possibles, qui ne sont ni couverts ni attendus."
 expected_social_spending_tt: "Les valeurs suivantes représentent les §YDépenses publiques§! prévues en matière de §YDépenses sociales§!. Chaque nombre entier indique un niveau de dépenses prévues limité au nombre de lois de la catégorie.\n\nLa valeur attendue des §YDépenses sociales§! est §Y[expected_social_spending_law_name]§! (Valeur actuelle: [?expected_welfare_spending|0Y])\n\nRépartition des dépenses §YDépenses sociales§!\n-----------\nImpact des lois, esprits nationaux et technologies sur les §YDépenses sociales prévues§!: [?ROOT.modifier@expected_welfare_modifier]\nModificateur du PIB/c sur les §YDépenses sociales prévues§!: [calculate_gdp_c_modifier_welfare_spending]\n"
 expected_health_spending_tt: "Les valeurs suivantes représentent les §YDépenses publiques§! prévues en matière de §YBudget de la santé§!. Chaque nombre entier indique un niveau de dépenses prévues limité au nombre de lois de la catégorie.\n\nLa valeur attendue des §YBudget de la santé§! est §Y[expected_healthcare_spending_law_name]§! (Valeur actuelle: [?expected_health_spending|0Y])\n\nRépartition des dépenses §YBudget de la santé§!\n-----------\nImpact des lois, esprits nationaux et technologies sur les §YDépenses de santé prévues§!: [?ROOT.modifier@expected_healthcare_modifier]\nModificateur du PIB/c sur les §YDépenses de santé prévues§!: [calculate_gdp_c_modifier_healthcare_spending]\n"
 expected_adm_spending_tt: "Les valeurs suivantes représentent les §YDépenses publiques§! prévues en matière de §YDépenses administratives§!. Chaque nombre entier indique un niveau de dépenses prévues limité au nombre de lois de la catégorie.\n\nLa valeur attendue des §YDépenses administratives§! est §Y[expected_bureau_spending_law_name]§! (Valeur actuelle: [?expected_adm_spending|0Y])\n\nRépartition des dépenses §YDépenses administratives§!\n-----------\nImpact des lois, esprits nationaux et technologies sur les §YDépenses administratives prévues§!: [?ROOT.modifier@expected_adm_modifier]\nModificateur du PIB/c sur les §YDépenses administratives prévues§!: [calculate_gdp_c_modifier_adm_spending]\n"
 expected_edu_spending_tt: "Les valeurs suivantes représentent les §YDépenses publiques§! prévues en matière de §YBudget de l'éducation§!. Chaque nombre entier indique un niveau de dépenses prévues limité au nombre de lois de la catégorie.\n\nLa valeur attendue des §YBudget de l'éducation§! est §Y[expected_education_spending_law_name]§! (Valeur actuelle: [?expected_edu_spending|0Y])\n\nRépartition des dépenses §YBudget de l'éducation§!\n-----------\nImpact des lois, esprits nationaux et technologies sur les §YDépenses prévues en matière d'éducation§!: [?ROOT.modifier@expected_education_modifier]\nModificateur du PIB/c sur les §YDépenses prévues en matière d'éducation§!: [calculate_gdp_c_modifier_education_spending]\n"
 expected_police_spending_tt: "Les valeurs suivantes représentent les §YDépenses publiques§! prévues en matière de §YBudget de la police§!. Chaque nombre entier indique un niveau de dépenses prévues limité au nombre de lois de la catégorie.\n\nLa valeur attendue des §YBudget de la police§! est §Y[expected_police_spending_law_name]§! (Valeur actuelle: [?expected_police_spending|0Y])\n\nRépartition des dépenses §YBudget de la police§!\n-----------\nImpact des lois, esprits nationaux et technologies sur les §YDépenses policières prévues§!: [?ROOT.modifier@expected_police_modifier]\nModificateur du PIB/c sur les §YDépenses policières prévues§!: [calculate_gdp_c_modifier_police_spending]\n"
 expected_defence_spending_tt: "Les valeurs suivantes représentent les §YDépenses publiques§! prévues en matière de §YDépenses militaires§!. Chaque nombre entier indique un niveau de dépenses prévues limité au nombre de lois de la catégorie.\n\nLa valeur attendue des §YDépenses militaires§! est §Y[expected_mil_spending_law_name]§! (Valeur actuelle: [?expected_military_sp|0Y])\n\nRépartition des dépenses §YDépenses militaires§!\n-----------\nImpact des lois, esprits nationaux et technologies sur les §YDépenses militaires prévues§!: [?ROOT.modifier@expected_mil_modifier]\nModificateur du PIB/c sur les §YDépenses militaires prévues§!: [calculate_gdp_c_modifier_military_spending]\n"
 MD_protests_state_calm_text: "§GCalme§! : aucune mission de troubles active."
 MD_protests_state_calm_tt: "Aucune mission d'alerte ou de révolte n'est active. Ce panneau reste visible tant que la §Yforce de protestation§! dépasse 20. Agissez sur la dérive avant qu'une crise ne se déclenche."
 MD_protests_state_warning_text: "§YAlerte§! : un mouvement de protestation se forme."
 MD_protests_state_warning_tt: "La mission §YProtestations imminentes§! est active. Si elle expire, des troubles commencent dans un État cœur non-capitale éligible. Résolvez-la en stabilisant l'économie et les conditions politiques qui ont déclenché l'alerte, ou utilisez §YApaiser les protestataires§! et §YRéforme préventive§! pour gagner du temps et baisser la Force."
 MD_protests_state_revolt_text: "§RRévolte§! : résistance dans les États cœurs."
 MD_protests_state_revolt_tt: "La mission §YRévolte imminente§! est active. De nouvelles régions non-capitale peuvent rejoindre chaque mois, avec une chance égale à la §Yforce de protestation§! actuelle moins l'§Yépuisement des protestations§!, plafonnée à §Y75 %§!. L'épuisement monte de §G5§! points chaque mois actif. Les États concernés se calment à §Y50 % de conformité§! et sous §Y40 % de résistance§!. Maintenir la force de protestation à §G0§! pendant §Y60 jours§! met fin à la révolte. Si la mission principale expire d'abord avec une Force supérieure à 0, la guerre civile prend entre §Y10 %§! et §Y50 %§! du pays selon les États non résolus et la radicalisation."
 MD_protests_state_cooldown_text: "§BDélai§! : convalescence après la crise."
 MD_protests_state_cooldown_tt: "Période de reprise après une crise de protestation. Aucune nouvelle mission de protestation ne peut se déclencher pendant §Y1000§! jours. Profitez de ce répit pour rééquilibrer les dépenses et reconstruire la stabilité avant que la pression ne remonte."
 MD_drift_diagnosed_text: "[MD_top_résistant_state_display]"
 MD_top_resistant_state_active: "§YPire État :§! [event_target:MD_top_resistant_state_scope.GetName] (§R[?MD_top_resistant_state_value|0]%§!)"
 MD_top_resistant_state_none: "§YPire État :§! §Gaucun§!"
 MD_drift_diagnosed_tt: "L'État cœur non-capitale non résolu avec la plus haute §Yrésistance§!. Utilisez les décisions de révolte et une garnison suffisante pour la ramener sous §Y40 % de résistance§! tout en montant la conformité à §Y50 %§!.\n\nAffiche §Gaucun§! lorsque tous les États concernés sont pacifiés."
 MD_drift_header_text: "§YSources de dérive mensuelle§! (dernier tick)"
 MD_drift_spending_tt: "Les citoyens attendent un socle de dépenses sociales, sanitaires, éducatives, policières, administratives et militaires. Un sous-financement fait monter la force des protestations ; un surfinancement calme les tensions mais vide le Trésor. Un forfait §R+1§! s'ajoute lorsque le carburant est épuisé.\n\nRelevez les lois marquées en rouge dans la grille de dépenses ci-dessous pour combler les plus grands écarts. §YApaiser les protestataires§! et §YRéforme préventive§! peuvent gagner du temps le temps de rééquilibrer."
 MD_drift_stability_tt: "La stabilité est tombée sous §Y20 %§! et le gouvernement tient encore des élections, si bien que les électeurs descendent dans la rue.\n\nAdoptez des focalisations et événements qui octroient de la stabilité, et pausez les constructions militaires coûteuses qui la font chuter. §YPromesse : allègement fiscal pour les citoyens§! ajoute un facteur de stabilité de §G+5 %§! pendant 300 jours, ce qui accélère tous les autres gains de stabilité. Un gouvernement non élu supprime ce facteur si votre voie politique permet le changement."
 MD_drift_interest_tt: "Le taux de la banque centrale dépasse §Y8,9 %§!. Les emprunts coûtent plus cher, les entreprises licencient, et le public blâme le gouvernement.\n\nAbaissez le taux depuis l'onglet §YMonnaie§!. Tout taux sous §G8,9 %§! retire ce facteur. Plus le taux dépasse le seuil, plus le choc mensuel est fort. Gardez les hausses brèves et ne les utilisez que contre l'inflation."
 MD_drift_recession_tt: "L'économie est en récession. Chaque mois ajoute un choc aléatoire d'environ §R+3§! de force des protestations.\n\nLever l'idée de §Yrécession§! via le système économique retire entièrement ce facteur. Surveillez le panneau économique pour les événements de reprise, et appuyez-vous sur §YApaiser les protestataires§! et §YRéforme préventive§! pour passer le plus dur."
 MD_drift_depression_tt: "L'économie est en dépression, sœur pire de la récession. Chaque mois ajoute un choc aléatoire d'environ §R+4§! de force des protestations, à peu près un tiers plus sévère que la récession.\n\nLever l'idée de §Ydépression§! via le système économique retire ce facteur. §YPromesse : allègement fiscal§! et §YPromesse : programme d'emplois§! réduisent la pression protestataire si vous tenez les objectifs, tandis que §YApaiser les protestataires§! et §YRéforme préventive§! gagnent du temps."
 MD_drift_war_tt: "Nous sommes en guerre depuis plus de §Y36§! mois et la population est épuisée. Chaque 24 mois de guerre supplémentaires ajoutent encore §R+1§! par mois. Une guerre de quatre ans frappe à §R+2§!, une de six ans à §R+3§!, sans plafond.\n\nTerminer la guerre ramène ce facteur à zéro immédiatement. Si des révoltes ont déjà commencé, la §Ycampagne des cœurs et des esprits§! augmente la conformité pendant que vous mettez fin à la guerre."
 MD_drift_corruption_tt: "La force de la coalition gouvernementale est sous §Y30 %§! alors qu'une idée de corruption est active ou que les élections sont suspendues. Plus la coalition est faible, plus le choc est fort. À §Y10 %§! de force de coalition, cela coûte §R+0,2§! par mois, à §Y20 %§! §R+0,1§!.\n\nAbaissez l'idée de corruption via les focalisations et événements anticorruption. Renforcez la coalition par des pactes de sous-idéologie. Rétablir les élections retire ce facteur d'emblée. §YPromesse : allègement fiscal§! verse §G+3 %§! de force de coalition en cas de succès, utile une fois la stabilité en hausse."
 MD_drift_ct_tt: "La surveillance d'Internet ou les arrestations de protestataires sont actives. La répression ajoute un choc mensuel aléatoire d'environ §R+5§! de force des protestations, le plus dur des sources aléatoires.\n\nCes outils sont pensés pour le court terme. Retirez l'idée CT une fois la mission active close, sinon le saignement continue indéfiniment. Pendant une crise, coupler le CT à §YPromesse : financement d'urgence de la police§! cumule la réduction de croissance de la résistance."
 MD_drift_passive_tt: "L'attention publique se dissipe. Chaque mois, il y a §Y50 %§! de chances de §G-2§! de force des protestations à elle seule, soit environ §G-12§! par an gratuitement.\n\nGagner du temps avec §YApaiser les protestataires§! et §YRéforme préventive§! laisse le refroidissement passif faire l'essentiel du travail."
 MD_drift_total_text: "§YSolde du mois dernier :§!"
 MD_protests_strength_readout_text: "§YForce :§! §Y[?protest_strength|0]§!§Y / 100   ·   Radicalisation :§! §Y[?protest_radicalisation|0]§!§Y / 10§!"
 MD_protests_strength_readout_tt: "Deux jauges pilotent le cycle des protestations.\n\n§YForce des protestations§! (actuellement [?protest_strength|0] / 100) mesure la proximité de la crise. Au-dessus de §Y50§!, la mission d'avertissement peut se déclencher. Pendant une révolte active, la force ne contrôle que la chance de propagation des troubles. La maintenir à §G0§! pendant §Y60 jours§! met fin à la révolte.\n\nLa force monte chaque mois depuis les sources de dérive ci-dessus. Elle baisse par le refroidissement passif, la §Yréforme préventive§! et les missions de promesse réussies.\n\n§YRadicalisation des protestations§! (actuellement [?protest_radicalisation|0] / 10) a §Y20 %§! de chances par mois de monter tant que la force est d'au moins 50 ou qu'une mission de protestation est active. Sinon elle a §Y10 %§! de chances de baisser. Une radicalisation plus haute agrandit la guerre civile d'une révolte ratée."
 MD_drift_total_tt: "La somme de toutes les sources de dérive actives plus le refroidissement passif. Positif : la force des protestations monte ; négatif : elle baisse.\n\nPour inverser le solde, visez le plus gros facteur ci-dessus. §YRéforme préventive§! et §YApaiser les protestataires§! gagnent du temps le temps que les corrections structurelles portent.\n\nTrois décisions de §Ypromesse§! engagent un objectif de 200 à 350 jours. Réussite : plus de temps à la mission de révolte ; échec : la promesse rompue ajoute une petite pénalité. §YPromesse : financement d'urgence de la police§! dure 200 jours et demande de baisser la force des protestations de §G10§!, versant §G+75§! jours à la mission de révolte. §YPromesse : allègement fiscal§! dure 300 jours et demande de hausser la stabilité de §G5 %§!, versant §G+100§! jours. §YPromesse : programme d'emplois§! dure 350 jours et demande de baisser le chômage de §G1,5 %§!, versant §G+120§! jours."
 MD_protests_revolt_states_text: "§RÉtats cœurs encore en résistance :§!"
 MD_protests_revolt_states_tt: "La mission §YRévolte imminente§! s'achève lorsque ceci atteint §G0§!. Les États non-capitale concernés se calment automatiquement à §Y50 % de conformité§! et sous §Y40 % de résistance§!. Les États-capitales ne peuvent pas rejoindre la révolte."
