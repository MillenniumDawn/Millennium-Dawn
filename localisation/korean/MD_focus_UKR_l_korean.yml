 ukr_modernize_sov_equipment_t55_procurement_program_company_mission_desc: "\n\n\n\n\n\n[UKR_t55_batch_image]\n\n\n\n\n\n\n\n\n§W§Y하르키우 장갑차 공장§!이 보관 중인 차체 §Y13§!대를 §Y[UKR_t55_batch_model]§! 사양으로 재제작하고 있습니다. 작업이 끝나면 차량은 §G우리 비축고로 들어가며§!, 같은 물량을 추가로 발주하거나 생산 라인을 다른 모델로 바꾸거나 계획을 종료하고 §G군수 공장을 되돌려 받을§! 수 있습니다.§!"
