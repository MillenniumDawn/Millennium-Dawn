 JAP_choice: "Relance politique"
 JAP_choice_desc: "Face à une stagnation prolongée et à une lassitude institutionnelle, la confiance dans la politique s'est érodée, tandis que le besoin de réformes ne cessait de s'accroître. Pour que ce pays puisse aller de l'avant, il doit d'abord définir une orientation claire en matière de gouvernance et établir un cadre décisionnel."
 JAP_left: "L'aile gauche du Japon"
 JAP_left_desc: "La politique n'a pas pour seul but la croissance économique, mais aussi la protection des moyens de subsistance et de la dignité des personnes. Nous garantirons la transparence et un contrôle rigoureux des personnes au pouvoir, renforcerons le pouvoir de négociation des travailleurs et la protection sociale, et réduirons les inégalités et la précarité. En menant une gouvernance respectueuse des droits humains et en favorisant la transition vers une énergie durable, nous ambitionnons de reconstruire la société japonaise."
 JAP_left_TT: "§YVous pouvez considérablement augmenter le taux d'approbation d'un des partis de gauche !\nToutefois, s'il s'agit du parti au pouvoir, l'augmentation restera faible.§!"
 JAP_information_disclosure: "Renforcer la divulgation d'informations"
 JAP_information_disclosure_desc: "Afin de rétablir la confiance dans la vie politique et l'administration publique, nous veillerons à une transparence totale de l'information et renforcerons la création, la conservation et la diffusion des documents officiels. Cela permettra d'éliminer les sources de corruption et de collusion, de rendre les décisions politiques plus transparentes et de faciliter la mise en œuvre des réformes."
 JAP_left_party_TT: "L'une des conditions suivantes doit être vraie :\n§Y$JAP.liberalism$§! est au pouvoir.\n§Y$JAP.neutral_Social$§! est au pouvoir.\n§Y$JAP.anarchist_communism$§! est au pouvoir.\n"
 JAP_management_documents: "Gestion stricte des documents officiels"
 JAP_management_documents_desc: "Nous organiserons et conserverons, selon une norme unifiée, les archives des décisions politiques, l'historique des procédures administratives et les documents détenus par les institutions publiques, tout en renforçant le système de gestion. En empêchant la dispersion des archives et les traitements irréguliers, et en améliorant la vérifiabilité et la continuité administrative, nous visons à accroître la fiabilité et l'efficacité concrète de l'action gouvernementale."
 JAP_digital_archiving: "Archivage numérique des documents officiels"
 JAP_digital_archiving_desc: "Nous numériserons les archives officielles et les gérerons de façon centralisée afin de simplifier la recherche, le partage et la conservation. En nous éloignant des pratiques centrées sur le papier, nous réduirons les charges administratives et les coûts de gestion, et maîtriserons les dépenses publiques."
 JAP_independent_audits: "Audit totalement indépendant"
 JAP_independent_audits_desc: "Nous garantirons l'indépendance totale des organes de contrôle et mettrons en place un système de surveillance à l'abri des ingérences des politiciens comme de la bureaucratie. En facilitant la détection précoce de la collusion et des abus, nous avancerons la lutte anticorruption et, en restaurant la confiance dans la politique, nous renforcerons aussi la force d'entraînement de la mise en œuvre des politiques."
 JAP_eliminating_amakudari: "Éradiquer Amakudari"
 JAP_eliminating_amakudari_desc: "Nous mettrons fin à la pratique de l'amakudari, qui favorise trop facilement la collusion entre bureaucrates et entreprises, et nous porterons le scalpel sur les intérêts acquis enracinés. En améliorant la transparence des nominations et en renforçant la concurrence, nous freinerons la corruption tout en réduisant l'inefficacité et en relevant la productivité."
 JAP_disclosure_of_political_funding: "Transparence totale du financement politique"
 JAP_disclosure_of_political_funding_desc: "Nous publierons de façon exhaustive les flux de fonds politiques et rendrons clairement visibles les donateurs comme les dépenses. Cela réduira la marge laissée à l'argent opaque en politique et fera avancer la lutte anticorruption, tout en renforçant la résilience face aux opérations d'influence étrangères."
 JAP_protecting_human_rights: "Protéger les droits de l'homme"
 JAP_protecting_human_rights_desc: "Nous placerons la protection de la dignité et des droits de chacun au cœur de la gouvernance. En corrigeant les discriminations et les traitements inéquitables et en bâtissant une société où l'on peut vivre en paix, nous renforcerons la cohésion intérieure et la stabilité."
 JAP_same_sex_partnerships: "Légaliser les partenariats homosexuels"
 JAP_same_sex_partnerships_desc: "Nous reconnaîtrons légalement les partenaires de même sexe et mettrons en place un dispositif réduisant les désavantages quotidiens en matière de consentement médical, de logement et d'héritage. En respectant la diversité des formes familiales et en apaisant les clivages sociaux, nous renforcerons la stabilité intérieure."
 JAP_employment_disabilities: "Élargir l'emploi des personnes handicapées"
 JAP_employment_disabilities_desc: "Nous créerons un environnement où l'on peut travailler indépendamment du handicap, et élargirons le soutien à l'emploi et les aménagements raisonnables sur le lieu de travail. En élargissant les débouchés, nous renforcerons la main-d'œuvre et, en favorisant la participation sociale, nous contribuerons aussi à la stabilité intérieure."
 JAP_prevent_domestic_violence: "Efforts de prévention des violences conjugales"
 JAP_prevent_domestic_violence_desc: "Nous renforcerons la prévention et le dépistage précoce des violences conjugales, et élargirons les services d'écoute et de protection. En brisant le cycle des abus et en réduisant l'insécurité et la violence au foyer, nous améliorerons la stabilité sociale."
 JAP_protecting_labor_union: "Protéger les droits syndicaux"
 JAP_protecting_labor_union_desc: "Nous garantirons clairement les droits des syndicats et créerons un environnement où la négociation collective et le dialogue social peuvent se tenir correctement. En faisant entendre la voix des ateliers dans les institutions et la gestion des entreprises, nous favoriserons la stabilité de l'emploi et des conditions de travail."
 JAP_subcontracto: "Réduire l’intimidation des sous-traitants"
 JAP_subcontracto_desc: "Nous réprimerons les exigences de baisse de prix abusives, les retards de paiement et les modifications unilatérales des contrats imposées aux sous-traitants, et bâtirons un environnement commercial équitable. En protégeant la base de revenus des PME, nous renforcerons la santé de toute la chaîne d'approvisionnement et contribuerons à la stabilité sociale."
 JAP_pressure_wage_increases: "Pression pour des hausses de salaires"
 JAP_pressure_wage_increases_desc: "Nous encouragerons les entreprises à augmenter les salaires et à doper les revenus des ménages. En soutenant la consommation et en apaisant l'insécurité du quotidien, nous renforcerons la stabilité sociale et viserons un cercle vertueux dans l'économie."
 JAP_regulation_temporary_agency_work: "Renforcer la réglementation du travail intérimaire"
 JAP_regulation_temporary_agency_work_desc: "Nous freinerons l'abus du travail intérimaire et ferons avancer la stabilité de l'emploi et l'amélioration des conditions de travail. En privilégiant un environnement de travail sûr et durable plutôt que l'efficacité à court terme, nous renforcerons la stabilité sociale."
 JAP_ban_non_regular_employment: "Interdire l’emploi non régulier"
 JAP_ban_non_regular_employment_desc: "Nous réformerons les pratiques d'emploi fondées sur le travail non régulier et passerons à un système où chacun peut obtenir un emploi stable et un traitement équitable. En réduisant l'insécurité quotidienne et en freinant la fracture sociale, nous renforcerons la stabilité nationale."
 JAP_redistribution: "Prioriser la redistribution"
 JAP_redistribution_desc: "Nous ferons basculer la politique vers la correction des inégalités de revenus et de l'insécurité économique, en allouant plus généreusement les ressources à ceux qui ont besoin d'aide. Par la redistribution, nous freinerons la fracture sociale, renforcerons le sentiment de sécurité et viserons une gouvernance stable."
 JAP_reducing_medical_costs: "Réduire les frais médicaux à la charge des patients"
 JAP_reducing_medical_costs_desc: "Nous réduirons le reste à charge médical et bâtirons un système où l'on peut recevoir les soins nécessaires sans hésiter. En apaisant l'angoisse financière des ménages et en freinant l'élargissement des inégalités de santé, nous renforcerons la stabilité sociale."
 JAP_care_workers: "Augmenter la rémunération et les conditions du personnel soignant"
 JAP_care_workers_desc: "Nous améliorerons les salaires et les conditions de travail des soignants et des aides, et favoriserons le recrutement et la fidélisation. En renforçant la continuité des soins, en allégeant la charge des familles et en soutenant l'activité, nous contribuerons à la stabilité sociale."
 JAP_housing_support: "Élargir le soutien au logement"
 JAP_housing_support_desc: "Nous élargirons le soutien au logement afin de réduire le poids des loyers et d'aider chacun à se loger durablement. En apaisant l'insécurité résidentielle et en soutenant la stabilité du quotidien, nous freinerons la fracture sociale et renforcerons la stabilité intérieure."
 JAP_student_loans: "Réduire le fardeau des prêts étudiants"
 JAP_student_loans_desc: "Nous allégerons le fardeau du remboursement des prêts étudiants et abaisserons les barrières à l'enseignement supérieur et à la reconversion. En faisant du capital humain un investissement d'avenir, nous soutiendrons les progrès de la recherche et de la technique."
 JAP_nuclear_phaseout: "Adieu à l'atome"
 JAP_nuclear_phaseout_desc: "Plutôt que de parier sur le prochain séisme, la nation laisse les réacteurs fermer à l'expiration de leurs licences et verse l'argent dans l'efficacité et les renouvelables. La voie est plus coûteuse à court terme et plus sûre à long terme. Aucune vague au large ne menacera un second Fukushima.\n-------------\nMet à l'arrêt toute la flotte nucléaire et ouvre le §Yprogramme de transformation verte§!, qui remplace cette production perdue par une génération que le Japon n'a pas à importer et par une demande qu'il n'a plus à satisfaire. Chaque projet démantèle aussi définitivement les réacteurs de sa région."
 JAP_leading_disarmament: "Diriger la diplomatie du désarmement"
 JAP_leading_disarmament_desc: "Nous ferons du désarmement et de la désescalade les piliers de notre diplomatie et chercherons la stabilité régionale par le dialogue et les mesures de confiance. Nous privilégierons les solutions qui ne reposent pas sur la force et travaillerons à améliorer les relations avec les autres pays."
 JAP_restricting_arms_exports: "Restreindre les exportations d’armes"
 JAP_restricting_arms_exports_desc: "Nous restreindrons les exportations d'armes et affirmerons clairement une diplomatie moins susceptible d'alimenter les tensions militaires. En privilégiant le désarmement et les mesures de confiance, nous ferons avancer le dialogue vers la stabilité régionale."
 JAP_principle_of_no_armed_forces: "Réaffirmer le principe de non-possession de forces militaires"
 JAP_principle_of_no_armed_forces_desc: "Nous réaffirmerons le principe de ne pas entretenir de forces militaires et affirmerons clairement une gouvernance qui ne repose pas sur la puissance militaire. Nous placerons le pacifisme au cœur de notre politique et mettrons l'accent sur la sécurité par la diplomatie et la coopération internationale."
 JAP_abrogating_us_japan_security_treaty: "Abroger le traité de sécurité nippo-américain"
 JAP_abrogating_us_japan_security_treaty_desc: "Nous nous retirerons du cadre de sécurité nippo-américain et passerons à une politique de sécurité indépendante, sans dépendance vis-à-vis des États-Unis. Cela élargira la liberté de notre diplomatie et affirmera plus clairement notre souveraineté et notre indépendance."
 JAP_dissolving_sdf: "Dissoudre les Forces d'autodéfense"
 JAP_dissolving_sdf_desc: "Nous dissoudrons les Forces d'autodéfense et passerons à une gouvernance qui ne repose pas sur la puissance militaire. En réorientant vers le civil les ressources et l'effort jusqu'ici consacrés à la défense, nous privilégierons le renforcement de l'industrie et des fondements du quotidien, et accélérerons le développement intérieur."
 JAP_army_delete_TT: "§RToutes les forces terrestres seront retirées !§!"
 JAP_right: "La droite japonaise"
 JAP_right_desc: "Nous mettons l'accent sur la capacité de l'État et l'ordre social, en renforçant la sécurité publique, la réponse aux crises et une politique étrangère et de sécurité centrée sur l'intérêt national. Nous visons la croissance par la réforme réglementaire et la revitalisation de l'activité économique, et cherchons à reconstruire le pays sur le socle de la tradition et des valeurs communautaires."
 JAP_right_TT: "§YVous pouvez fortement augmenter la cote d'un des partis de droite !\nToutefois, s'il s'agit du parti au pouvoir, la hausse restera limitée.§!"
 JAP_strengthen_military_power: "Politique de renforcement de la puissance militaire"
 JAP_strengthen_military_power_desc: "Face à l'évolution de l'environnement de sécurité, nous ferons clairement du renforcement de notre posture de défense une politique nationale. En améliorant la dissuasion, nous préviendrons les menaces avant qu'elles ne se matérialisent et démontrerons notre volonté de protéger la sécurité publique et la souveraineté nationale."
 JAP_right_party_TT: "L'une des conditions suivantes doit être vraie :\n§Y$JAP.conservatism$§! est au pouvoir.\n§Y$JAP.socialism$§! est au pouvoir.\n§Y$JAP.Neutral_Libertarian$§! est au pouvoir.\n"
 JAP_allow_overseas_deployment: "Autoriser le déploiement outre-mer des FAD"
 JAP_allow_overseas_deployment_desc: "Compte tenu de la situation internationale et de la coopération avec les alliés, nous affirmerons clairement une politique autorisant les déploiements outre-mer des Forces d'autodéfense. En participant aux missions internationales, nous renforcerons la dissuasion et l'influence, et protégerons plus activement les intérêts nationaux et la sécurité."
 JAP_international_missions: "Cadre juridique des missions internationales"
 JAP_international_missions_desc: "Nous mettrons en place la base juridique et les procédures de participation aux missions internationales, instaurant un système où les Forces d'autodéfense peuvent opérer selon des règles cohérentes. Cela réduira l'incertitude sur le terrain et permettra une coopération internationale plus fiable."
 JAP_revising_use_weapons: "Réviser les règles d'emploi des armes"
 JAP_revising_use_weapons_desc: "Nous réviserons les normes et procédures d'emploi des armes pour les adapter aux réalités des missions internationales et de la gestion de crise. En clarifiant le champ d'autorité et de responsabilité nécessaire à l'exécution des missions, nous instaurerons un système où les Forces d'autodéfense peuvent se protéger elles-mêmes et protéger autrui de façon appropriée."
 JAP_exclusive_defense: "Maintenir une posture exclusivement défensive"
 JAP_exclusive_defense_desc: "Nous maintiendrons strictement une posture exclusivement défensive comme principe directeur de notre politique de sécurité, en limitant clairement l'emploi des capacités de défense à la prévention des attaques contre notre pays. Tout en maintenant la dissuasion, nous éviterons une expansion militaire excessive et démontrerons une attitude moins susceptible d'accroître les tensions avec les pays voisins."
 JAP_exclusive_defense_TT: "§YCe focus national rapproche l'équilibre des pouvoirs du niveau 2 !§!"
 JAP_collective_self_defense: "Autoriser l'autodéfense collective"
 JAP_collective_self_defense_desc: "Partant de l'idée que les attaques contre les alliés peuvent aussi affecter directement notre propre sécurité, nous affirmerons clairement une politique autorisant l'exercice de la légitime défense collective. Cela renforcera la dissuasion et l'efficacité des alliances, et bâtira un cadre de sécurité plus proactif."
 JAP_prioritizing_order: "Prioriser l'ordre"
 JAP_prioritizing_order_desc: "Nous ferons de l'ordre social et de la sécurité publique les priorités de la gouvernance. En valorisant les règles et la responsabilité, et en maintenant l'ordre public et une administration stable, nous reconstruirons les fondements de la nation."
 JAP_strengthen_public_security: "Plan global de sécurité publique"
 JAP_strengthen_public_security_desc: "Nous mènerons une révision complète du système de sécurité publique et formulerons un plan d'ensemble couvrant l'équipement, le personnel et la coordination de l'information. En rationalisant l'action sur le terrain tout en renforçant les capacités policières, nous renforcerons la dissuasion du crime et garantirons la stabilité sociale."
 JAP_against_organized_crime: "Améliorer les mesures de lutte contre le crime organisé"
 JAP_against_organized_crime_desc: "Nous intensifierons la répression du crime organisé et ferons avancer la coupure des sources de financement et l'élargissement des capacités d'enquête. En restaurant l'ordre intérieur, nous renforcerons la stabilité sociale et bâtirons aussi un système national moins vulnérable à l'infiltration et aux opérations d'influence extérieures."
 JAP_against_terrorist_financing: "Mesures de lutte contre le financement du terrorisme"
 JAP_against_terrorist_financing_desc: "Nous surveillerons strictement les flux financiers et ferons pleinement appliquer les dispositifs destinés à couper le financement des organisations terroristes et des groupes extrémistes. En renforçant la coordination entre autorités financières et services d'enquête, nous protégerons la sécurité intérieure et accroîtrons la résilience face aux opérations d'influence extérieures, tout en améliorant la stabilité sociale."
 JAP_counter_espionage: "Mettre en place un cadre antiespionnage"
 JAP_counter_espionage_desc: "Nous renforcerons les contre-mesures contre les activités de renseignement et mettrons en place des systèmes de protection des informations classifiées et de surveillance renforcée. En dissuadant l'infiltration et les opérations clandestines d'acteurs extérieurs et en protégeant la prise de décision nationale, nous assurerons la stabilité intérieure."
 JAP_strengthening_cabinet: "Renforcer l’autorité du Cabinet"
 JAP_strengthening_cabinet_desc: "Nous renforcerons la chaîne de commandement et les fonctions de coordination du Cabinet afin d'améliorer la rapidité et la cohérence de la décision. En bâtissant un système capable d'agir vite sur la gestion de crise et les politiques clés, nous renforcerons un leadership décisif dans la gouvernance nationale."
 JAP_cabinet_personnel_bureau: "Bureau du personnel du Cabinet"
 JAP_cabinet_personnel_bureau_desc: "Nous instaurerons un système permettant au Cabinet de superviser de façon centralisée les questions de personnel, en renforçant la transparence et le contrôle des nominations de haut rang. En plaçant les bonnes personnes aux bons postes, nous rationaliserons le fonctionnement de la bureaucratie et renforcerons la capacité du gouvernement à mettre en œuvre les politiques."
 JAP_breaking_down_bureaucratic_siloing: "Briser les silos bureaucratiques"
 JAP_breaking_down_bureaucratic_siloing_desc: "Nous réformerons l'administration en silos entre ministères et renforcerons le partage d'information et la coordination interministérielle. En réduisant les procédures dupliquées et les goulets d'étranglement, nous rationaliserons l'administration publique et accélérerons l'exécution des investissements et des projets publics."
 JAP_policy_evaluation_and_kpis: "Introduire l'évaluation des politiques et les indicateurs de performance"
 JAP_policy_evaluation_and_kpis_desc: "Nous introduirons un système d'évaluation et des indicateurs de performance afin que les résultats des politiques puissent être vérifiés par des données mesurables. En révisant les mesures à faible impact et en concentrant des ressources limitées sur les domaines à fort effet, nous améliorerons l'efficacité administrative et relèverons la productivité économique."
 JAP_national_security_council: "Établir un Conseil de sécurité nationale"
 JAP_national_security_council_desc: "Nous centraliserons au Cabinet l'information et la décision en matière de sécurité et bâtirons un système permettant des décisions rapides et cohérentes. En renforçant les capacités de gestion de crise et la coordination avec les alliés et les agences concernées, nous renforcerons la dissuasion."
 JAP_emergency_powers: "Clause de pouvoirs d'urgence"
 JAP_emergency_powers_desc: "En prévision de situations extraordinaires telles que les catastrophes majeures ou les attaques armées, nous clarifierons les pouvoirs et procédures nécessaires en urgence. Tout en maintenant le contrôle en temps de paix, nous accélérerons la réponse aux crises et renforcerons la chaîne de commandement, assurant la stabilité nationale et la posture de défense."
 JAP_regulatory_reform: "Croissance par la réforme réglementaire"
 JAP_regulatory_reform_desc: "Nous réviserons les réglementations et les procédures, réduirons les charges administratives et favoriserons l'activité et l'investissement. En facilitant le lancement de nouvelles entreprises et le développement d'installations, nous accélérerons la croissance économique."
 JAP_postal_privatization: "Privatisation postale"
 JAP_postal_privatization_desc: "Nous ferons avancer la privatisation des services postaux, en révisant un système dirigé par l'État afin d'améliorer l'efficacité de l'administration. Si l'intégration des principes de marché vise à renforcer l'activité et l'assiette fiscale, la réforme peut aussi susciter une forte opposition et intensifier le conflit politique."
 JAP_postal_privatization_TT: "§YUn événement se déclenchera où vous choisirez s'il faut dissoudre la Chambre et convoquer des élections générales !§!"
 JAP_second_wave_privatization: "Deuxième vague de privatisations"
 JAP_second_wave_privatization_desc: "Nous pousserons plus loin les réformes de privatisation et réviserons le rôle du secteur public et le mode d'exploitation des services publics. En réduisant l'inefficacité administrative et en encourageant l'investissement et l'activité, nous dynamiserons l'économie."
 JAP_special_zones: "Zones spéciales stratégiques nationales"
 JAP_special_zones_desc: "Nous créerons des dérogations réglementaires dans des zones désignées et y favoriserons intensivement l'entrée des entreprises et les nouveaux investissements. En faisant avancer des projets de démonstration et la commercialisation au-delà des barrières institutionnelles existantes, nous accélérerons une croissance portée par le dynamisme privé et revitaliserons les économies locales."
 JAP_expansion_regulatory_reform_zones: "Étendre les zones de réforme"
 JAP_expansion_regulatory_reform_zones_desc: "Nous généraliserons à l'échelle nationale les résultats obtenus dans les zones spéciales, faisant de la réforme réglementaire une norme nationale plutôt qu'une exception régionale. En abaissant les barrières à l'entrée et à l'investissement, nous encouragerons de nouvelles entreprises et favoriserons la revitalisation économique dans tout le pays."
 JAP_new_market_entry: "Favoriser l'entrée de nouveaux acteurs"
 JAP_new_market_entry_desc: "Nous abaisserons les barrières à l'entrée et soutiendrons l'entrepreneuriat et le lancement de nouvelles entreprises. En favorisant la concurrence et l'innovation, nous relèverons la productivité et renforcerons l'assiette fiscale."
 JAP_new_technologies: "Bienvenue aux nouvelles technologies"
 JAP_new_technologies_desc: "Nous soutiendrons activement l'adoption et la commercialisation des nouvelles technologies, en accélérant la recherche-développement et l'innovation industrielle. En faisant émerger de nouveaux secteurs de croissance, nous renforcerons la compétitivité nationale."
 JAP_key_industries_back_home: "Relocaliser les industries critiques"
 JAP_key_industries_back_home_desc: "Nous bâtirons un système permettant une production intérieure stable des industries critiques, en renforçant les chaînes d'approvisionnement et l'autonomie des secteurs clés. En encourageant l'investissement intérieur, nous renforcerons la base industrielle et créerons une structure moins vulnérable aux évolutions de l'environnement international."
 JAP_economic_security: "Établir la sécurité économique"
 JAP_economic_security_desc: "Nous réviserons l'approvisionnement en matières critiques et industries clés, et gérerons les risques liés à la technologie, au capital et à l'information afin d'établir la sécurité économique. Cela renforcera l'autonomie nationale et la compétitivité durable des entreprises, soutenant une croissance stable."
 JAP_patriotic_education: "Éducation patriotique"
 JAP_patriotic_education_desc: "Nous promouvoirons une éducation mettant l'accent sur l'histoire, la culture et la responsabilité civique de la nation, renforçant la cohésion sociale et le sentiment de normes partagées. En bâtissant un socle moins perméable à l'influence extérieure, nous renforcerons la stabilité intérieure."
 JAP_fundamentals_of_education: "Redéfinir les fondamentaux de l'éducation"
 JAP_fundamentals_of_education_desc: "Nous réviserons les finalités et les normes de l'éducation et redéfinirons, comme politique nationale, le développement des compétences académiques, des savoirs fondamentaux et des aptitudes pratiques. En priorisant l'investissement éducatif, nous renforcerons le socle du capital humain et de la recherche-développement."
 JAP_dotoku_education: "Éducation dōtoku"
 JAP_dotoku_education_desc: "Nous accorderons plus d'importance à l'éducation morale (dōtoku) et cultiverons à l'école des valeurs telles que le civisme, la responsabilité et la considération d'autrui. En renforçant les normes sociales et en approfondissant la cohésion des communautés locales, nous contribuerons à la stabilité intérieure."
 JAP_national_flag_and_anthem: "Respecter le drapeau et l'hymne national"
 JAP_national_flag_and_anthem_desc: "Nous affirmerons clairement le respect du drapeau et de l'hymne national, renforçant le sentiment d'appartenance et l'unité sociale. Cela renforcera la cohésion en temps de crise et bâtira un socle moins perméable à l'influence extérieure."
 JAP_family_policy: "Renforcer la politique familiale"
 JAP_family_policy_desc: "Nous respecterons les valeurs du foyer et de la famille et élargirons les mesures de soutien à l'éducation des enfants et au quotidien. En créant un environnement où l'on peut fonder une famille en toute sérénité, nous renforcerons la base démographique future et contribuerons à la stabilité sociale."
 JAP_glorious_decade: "Vers une décennie éclatante"
 JAP_inflation_target: "Clarifier l'engagement politique"
 JAP_down_long_term_interest_rates: "Baisser les taux d’intérêt à long terme"
 JAP_down_long_term_interest_rates_desc: "Nous maintiendrons des taux d'intérêt à long terme bas et stables, réduisant le coût du financement pour les entreprises et les ménages. En soutenant l'investissement, le renouvellement du capital et l'accession au logement, et ainsi en étayant la demande et en relevant l'économie, nous ouvrirons aussi la voie à une reprise des recettes fiscales."
 JAP_special_inspection_banks: "Inspections spéciales des banques"
 JAP_special_inspection_banks_desc: "Pour restaurer la solidité du système financier, nous mènerons un examen approfondi des actifs des banques. En clarifiant l'état réel des créances douteuses et en mettant fin au report des pertes et aux traitements opaques, nous créerons un point d'appui pour interrompre la réaction en chaîne de l'anxiété du crédit et du resserrement des prêts."
 JAP_bank_supervision: "Renforcer le contrôle bancaire"
 JAP_bank_supervision_desc: "Plutôt que de traiter inspections et mesures correctives comme un épisode ponctuel, nous renforcerons de façon permanente le cadre de supervision. En imposant la transparence et la gouvernance et en empêchant la répétition d'une gestion des risques faible et de traitements opaques, nous stabiliserons la confiance dans le système financier."
 JAP_business_assessment: "Évaluation commerciale équitable"
 JAP_business_assessment_desc: "Pour juger avec précision les capacités et les risques des entreprises, nous évaluerons objectivement la rentabilité et les perspectives. Sans nous reposer sur le maintien artificiel des firmes, nous distinguerons ce qui doit être reconstruit de ce qui doit être restructuré, et préparerons le terrain pour que le capital et les talents affluent vers les secteurs de croissance."
 JAP_corporate_debt_restructuring: "Restructuration de la dette des entreprises"
 JAP_corporate_debt_restructuring_desc: "Nous traiterons le fardeau excessif de la dette et garantirons le temps et la marge de manœuvre nécessaires au redressement. En sortant d'un état où l'on est absorbé par les intérêts et les remboursements, et en permettant d'orienter les ressources vers l'investissement, l'emploi et la transformation des activités, nous briserons la chaîne de la stagnation."
 JAP_corporate_revitalization: "Revitalisation d'entreprise"
 JAP_corporate_revitalization_desc: "Nous ferons passer la restructuration à une nouvelle étape et reconstruirons les fondations des entreprises, tant financières qu'opérationnelles. En traitant les fardeaux excessifs et les inefficacités et en plaçant les entreprises en position d'avancer vers l'investissement, l'embauche et les hausses de salaires, nous solidifierons une reprise menée par le secteur privé."
 JAP_expectations_escaping_deflation: "Restaurer les anticipations de croissance"
 JAP_expectations_escaping_deflation_desc: "En résolvant les créances douteuses et en dénouant la dette excessive, nous ferons passer l'économie de la « défense » à l'« attaque ». Si les entreprises reprennent les dépenses d'investissement, de R&D et de personnel, et si les ménages retrouvent une vision plus claire de l'avenir, un cercle vertueux de productivité et de salaires aura plus de chances de s'enclencher. Nous bâtirons le socle nécessaire pour relancer pleinement le rétablissement de la compétitivité."
 JAP_promoting_labor_mobility: "Promouvoir la mobilité du travail"
 JAP_promoting_labor_mobility_desc: "Nous créerons des conditions facilitant le basculement des talents vers les secteurs de croissance et ferons avancer la réallocation de la main-d'œuvre. En abaissant les barrières au changement d'emploi et à la réembauche et en soutenant la montée en compétences, nous porterons le renouvellement industriel et relèverons la productivité."
 JAP_competition_service_sector: "Promouvoir la concurrence dans le secteur des services"
 JAP_competition_service_sector_desc: "Nous encouragerons l'entrée et la concurrence dans le secteur des services et traiterons les inefficacités et rigidités de prix qui ont contribué à la stagnation. En révisant les réglementations et les pratiques enracinées, nous améliorerons l'environnement des affaires et ferons basculer vers un marché où les meilleurs services sont plus facilement choisis."
 JAP_revitalization_economy: "Revitaliser l'économie japonaise"
 JAP_revitalization_economy_desc: "Nous avons fait avancer la reconstruction du système financier et du secteur des entreprises, et tracé une voie vers la reprise de la demande et l'amélioration des salaires. En éliminant une à une les causes de la stagnation et en créant un environnement où ménages et entreprises voient plus clairement l'avenir, nous ancrerons l'élan vers la croissance."
 JAP_equal_pay_for_equal_work: "À travail égal, salaire égal"
 JAP_equal_pay_for_equal_work_desc: "La loi sur l'emploi à temps partiel et à durée déterminée force les employeurs à justifier chaque écart de salaire et d'avantage entre travailleurs réguliers et non réguliers, ou à le supprimer. Quatre travailleurs japonais sur dix sont non réguliers, assis aux mêmes bureaux pour une fraction du salaire horaire, sans prime, sans indemnité de retraite et sans espoir d'emploi au printemps suivant. Les firmes perdent le tampon de main-d'œuvre bon marché sur lequel elles s'appuient depuis des décennies, et des millions de personnes qui ne pouvaient jamais planifier un an à l'avance le peuvent enfin."
 JAP_diplomacy: "La diplomatie japonaise"
 JAP_diplomacy_desc: "Reconstruire les liens avec le monde et redéfinir le rôle du Japon dans la communauté internationale."
 JAP_diplomacy_idea_TT: "§YÀ mesure que vous progressez dans le focus diplomatique, des modificateurs supplémentaires seront ajoutés à cet esprit national !§!"
 JAP_friendship_asean: "Améliorer les relations avec l'ASEAN"
 JAP_friendship_asean_desc: "Le gouvernement japonais s'emploiera à améliorer les relations avec les pays de l'ASEAN, faisant avancer la restauration de la confiance et la promotion du dialogue. Pour le Japon, l'ASEAN est un partenaire indispensable et important, tant économique que sécuritaire, et son unité et sa stabilité façonneront l'avenir de toute la région."
 JAP_not_asean_war_TT: "Il existe au moins un pays avec l'esprit national « Membre de l'ASEAN », et le Japon n'est en guerre avec aucun pays ayant l'esprit national « Membre de l'ASEAN »."
 JAP_chiang_mai: "Initiative de Chiang Mai"
 JAP_chiang_mai_desc: "Par l'initiative de Chiang Mai, le Japon renforce la coopération financière régionale afin de soutenir la stabilité économique et la cohésion des nations de l'ASEAN."
 JAP_quantitative_oda: "APD quantitative"
 JAP_quantitative_oda_desc: "Par un investissement APD de grande ampleur dans les infrastructures essentielles — transports, ports et énergie —, le Japon soutient la croissance économique de l'ASEAN et la connectivité régionale."
 JAP_qualitative_oda: "APD qualitative"
 JAP_qualitative_oda_desc: "En s'associant aux entreprises et institutions locales, le Japon favorise le développement du capital humain et les valeurs démocratiques, renforçant son influence à travers l'ASEAN."
 JAP_security_south_china_sea: "Posture de sécurité en mer de Chine méridionale"
 JAP_security_south_china_sea_desc: "Soutenu par la confiance des nations de l'ASEAN, le Japon lance un cadre de sécurité maritime neutre et pacifique en mer de Chine méridionale."
 JAP_away_dependence: "Rompre avec la dépendance aux États-Unis"
 JAP_away_dependence_desc: "Le Japon commence à réexaminer la nature de ses liens de longue date, cherchant à élargir ses options stratégiques et son autonomie. Dans l'économie, la technologie et la sécurité, nous poursuivons un cap façonné par notre propre vision de l'avenir."
 JAP_development_production: "Établir des chaînes de production nationales"
 JAP_development_production_desc: "Pour assurer une défense nationale indépendante, nous établirons un système intérieur capable de produire armes et matériels au Japon."
 JAP_japanese_doctrine: "Formuler une doctrine japonaise"
 JAP_japanese_doctrine_desc: "Nous établirons une doctrine de sécurité japonaise indépendante, permettant des réponses flexibles adaptées à notre environnement stratégique."
 JAP_recalling_researchers: "Rappel des chercheurs étrangers"
 JAP_recalling_researchers_desc: "Les universités et laboratoires nationaux offrent des postes accélérés, des installations modernisées et des subventions compétitives pour inverser un long exode des talents. L'objectif est de reconstruire la force de recherche intérieure en ramenant les scientifiques japonais des États-Unis."
 JAP_japanese_cloud: "Nuage Kasumigaseki"
 JAP_japanese_cloud_desc: "Bâtir un « nuage de Kasumigaseki » géré par l'État, opéré par des prestataires japonais et hébergé sur des serveurs intérieurs. Ministères et agences clés migrent leurs systèmes vers cette plateforme partagée afin de réduire les coûts, standardiser la sécurité et garder les données sensibles sous contrôle national."
 JAP_base_okinawa: "Négociations sur le retrait des forces américaines à Okinawa"
 JAP_base_okinawa_desc: "Pour renforcer l'autonomie de sécurité du Japon, des négociations commenceront en vue du retrait des forces américaines stationnées à Okinawa."
 JAP_enhancement_exercises: "Exercices conjoints améliorés"
 JAP_enhancement_exercises_desc: "Approfondir l'intégration avec les forces américaines par des exercices conjoints plus vastes et plus fréquents. Unités maritimes, aériennes et terrestres répètent procédures, communications et logistique partagées afin qu'en crise réelle les deux côtés puissent manœuvrer, combattre et se ravitailler comme une force unique et coordonnée."
 JAP_education_jap_usa: "Programmes éducatifs conjoints nippo-américains"
 JAP_education_jap_usa_desc: "Pour approfondir la compréhension mutuelle entre le Japon et les États-Unis, nous mettrons en œuvre des programmes d'éducation conjoints et des échanges étudiants. En apprenant de la discipline japonaise et de l'esprit d'entreprise américain, cette initiative nourrira une nouvelle génération de dirigeants à l'esprit international et renforcera encore la confiance bilatérale."
 JAP_culture_technology: "Échange de culture technologique entre le Japon et les États-Unis"
 JAP_culture_technology_desc: "Resserrer les liens entre firmes japonaises et pôles technologiques américains en associant laboratoires universitaires et studios à des partenaires de Silicon Valley, Seattle et Los Angeles. Ingénieurs, designers et créateurs vont et viennent sur des projets conjoints, mêlant le savoir-faire américain des plateformes au matériel, aux jeux et à l'animation japonais."
 JAP_dual_use: "Coopération technologique à double usage"
 JAP_dual_use_desc: "Le Japon et les États-Unis approfondiront la coopération dans les technologies à double usage, applicables aux fins civiles comme militaires. Par la collaboration entre industrie et université, ce partenariat accélérera la recherche-développement, stimulant l'avancée technologique d'ensemble."
 JAP_okinawa_development: "Projet de développement conjoint d'Okinawa"
 JAP_okinawa_development_desc: "Pour favoriser la croissance économique d'Okinawa et l'intégration régionale, le Japon et les États-Unis coopéreront à un projet de développement conjoint centré sur les infrastructures. En améliorant réseaux de transport, systèmes logistiques et équipements publics, cette initiative vise à renforcer la croissance régionale tout en ouvrant de nouvelles voies à la coopération nippo-américaine."
 JAP_informal_cooperation: "Cadre de coopération informelle"
 JAP_informal_cooperation_desc: "Malgré l'absence de relations diplomatiques formelles, le Japon et Taïwan ont développé des formes de coopération pratiques et substantielles. Par la réponse aux catastrophes, l'échange technologique et les interactions entre peuples, un fondement mutuellement bénéfique s'établit."
 JAP_disaster_countermeasure_cooperation: "Plateforme de connaissances sur les catastrophes au Japon et à Taiwan"
 JAP_disaster_countermeasure_cooperation_desc: "Compte tenu de leur vulnérabilité partagée aux catastrophes naturelles, le Japon et Taïwan établissent une plateforme conjointe pour partager expertise et leçons en matière de réponse aux catastrophes. Cette coopération renforce la résilience et les capacités de réparation des deux nations."
 JAP_tai_high_technology: "Lien de haute technologie Japon-Taïwan"
 JAP_tai_high_technology_desc: "Institutions de recherche et entreprises privées du Japon et de Taïwan unissent leurs forces pour collaborer sur des technologies civiles de pointe. Ce partenariat vise à doper l'innovation et la productivité des industries des deux nations."
 JAP_tai_tourist_visa: "Assouplissement de la politique de visa touristique"
 JAP_tai_tourist_visa_desc: "Pour encourager davantage le tourisme en provenance de Taïwan, le Japon assouplira ses procédures de visa. L'augmentation des échanges humains et du tourisme aidera à stimuler l'économie et à approfondir la compréhension mutuelle."
 JAP_tai_international_student: "Développement des programmes d'échanges étudiants"
 JAP_tai_international_student_desc: "Le Japon élargira les possibilités d'études des étudiants taïwanais dans ses universités. Cette initiative vise à approfondir les liens académiques et culturels tout en formant de futurs dirigeants qui relieront les deux sociétés."
 JAP_tai_senkaku: "Établir des pourparlers maritimes avec Taïwan"
 JAP_tai_senkaku_desc: "Le différend des îles Senkaku façonne les droits de pêche, la sécurité maritime et chaque négociation en mer de Chine orientale. Le Japon ouvre des canaux de dialogue et des consultations pratiques pour réduire les frictions en mer tout en ne concédant rien sur la souveraineté. Il gère la confrontation plutôt qu'il ne la résout."
 JAP_dprk_national_policy: "Doctrine de la péninsule septentrionale"
 JAP_dprk_national_policy_desc: "La Corée du Nord reste l'étincelle la plus proche de nos côtes et l'acteur le plus imprévisible de la péninsule. Nous définirons une politique nationale unifiée envers Pyongyang, synchronisant diplomatie, renseignement et préparation en une seule doctrine. La direction que nous choisirons fixera les termes de la sécurité en Asie du Nord-Est."
 JAP_dprk_maximum_pressure: "Pression maximale sur Pyongyang"
 JAP_dprk_maximum_pressure_desc: "La Corée du Nord comprend le levier, pas la bonne volonté. Nous resserrerons l'application des sanctions, élargirons la surveillance maritime et coordonnerons la pression diplomatique pour contraindre la marge d'escalade de Pyongyang. L'objectif est simple : élever le coût de chaque provocation jusqu'à ce que le régime soit forcé de recalculer."
 JAP_dprk_missile_defense: "Bouclier antimissile en couches"
 JAP_dprk_missile_defense_desc: "La menace du Nord se mesure en minutes, pas en jours. Nous renforcerons un réseau de défense antimissile en couches sur terre, mer et air pour protéger nos villes, ports et centres de commandement d'une attaque soudaine. Un bouclier crédible déniera à Pyongyang le pouvoir de nous intimider de loin."
 JAP_dprk_trilateral_training: "Exercices trilatéraux sur la péninsule"
 JAP_dprk_trilateral_training_desc: "La sécurité de la péninsule ne peut reposer sur les seules déclarations. Un entraînement conjoint avec la Corée du Sud et les États-Unis améliorera la préparation, l'interopérabilité et la réponse aux crises sur le point de friction le plus dangereux de la région. En s'exerçant ensemble, nous signalons que l'agression rencontrera une réponse coordonnée."
 JAP_dprk_korean_defense_treaty: "Accord de défense Japon-Corée"
 JAP_dprk_korean_defense_treaty_desc: "La péninsule et l'archipel japonais partagent le même front. Un accord de défense formel avec la Corée du Sud liera le partage de renseignement, la planification de contingence et les engagements de sécurité mutuelle en un cadre durable. Les anciens griefs demeurent, mais la nécessité stratégique exige un fondement plus fort."
 JAP_dprk_conditional_engagement: "Canal conditionnel vers Pyongyang"
 JAP_dprk_conditional_engagement_desc: "La pression seule ne peut gérer chaque crise. Nous ouvrirons un canal diplomatique contrôlé vers la Corée du Nord, lié à des conditions strictes sur les essais de missiles, les incidents militaires et la déstabilisation régionale. Le dialogue ne remplacera pas la dissuasion, mais il peut prévenir le calcul erroné."
 JAP_dprk_normalization_framework: "Feuille de route de normalisation"
 JAP_dprk_normalization_framework_desc: "Une Asie du Nord-Est stable exige plus qu'une gestion permanente de crise. Nous établirons un cadre progressif de normalisation avec la Corée du Nord, liant le progrès diplomatique à des engagements de sécurité vérifiables et à des garanties régionales. Tout règlement doit être graduel, applicable et ancré dans la réciprocité."
 JAP_dprk_support_unification: "Soutenez une péninsule unifiée"
 JAP_dprk_support_unification_desc: "La division de la Corée a façonné la sécurité de l'Asie de l'Est pendant des générations, mais elle n'a pas à être permanente. Nous soutiendrons une voie pacifique vers l'unification coréenne par la diplomatie, la coordination avec les partenaires et la planification de la stabilité régionale. Si la péninsule doit être refaite, le Japon doit aider à façonner l'ordre qui suivra."
 JAP_history_education: "Transparence de l'enseignement historique"
 JAP_history_education_desc: "Nous devons affronter les faits historiques de front en révisant les matériels éducatifs et les lignes directrices d'enseignement. Une éducation historique transparente est le premier pas vers la construction de la confiance avec nos pays voisins."
 JAP_statement: "Déclaration [ROOT.GetLeader]"
 JAP_statement_desc: "Pour exprimer une position claire de responsabilité et de repentir concernant les événements historiques, le gouvernement publiera une nouvelle déclaration officielle. Cette initiative vise à favoriser la réconciliation avec les nations concernées et à promouvoir des relations tournées vers l'avenir, fondées sur la confiance mutuelle."
 JAP_intellectual_platform: "Plateforme historique trilatérale"
 JAP_intellectual_platform_desc: "Sous médiation de l'ONU, le Japon, la Chine et la Corée du Sud planifieront et établiront conjointement musées et archives numériques pour transmettre les mémoires de guerre aux générations futures. Le Japon apportera un soutien financier, positionnant cette initiative comme un symbole mondial de paix et de réconciliation."
 JAP_intellectual_platform_TT: "§YSi les deux pays parviennent à un accord, un esprit national qui augmente la §Gstabilité§! sera accordé aux trois nations !§!"
 JAP_chi_friendship: "Améliorer les relations avec la Chine"
 JAP_chi_friendship_desc: "Pour stabiliser les relations nippo-chinoises, le gouvernement japonais poursuivra le dialogue et s'emploiera à promouvoir la compréhension mutuelle et à gérer les frictions. La Chine est un pays voisin d'une influence considérable sur l'ordre régional et l'économie, et l'amélioration des relations est directement liée à la sécurité et à la prospérité du Japon."
 JAP_chi_accept_intellectual_platform: "La Chine a accepté l'établissement de la plateforme historique Japon-Chine-Corée."
 JAP_chi_trade_support: "Soutien à la réforme du système commercial chinois"
 JAP_chi_trade_support_desc: "Fournir un soutien technique et institutionnel à la réforme et à la modernisation du système commercial chinois. Cela facilite l'entrée des entreprises japonaises et renforce l'influence du Japon dans la région."
 JAP_chi_advancement_companies: "Accès mutuel au marché pour les entreprises"
 JAP_chi_advancement_companies_desc: "Promouvoir l'investissement mutuel et l'entrée sur les marchés entre entreprises japonaises et chinoises afin d'accroître l'interdépendance économique et d'améliorer la productivité."
 JAP_chi_kanji: "Projet de coopération culturelle \\"Sinosphère\\""
 JAP_chi_kanji_desc: "En renforçant les liens culturels parmi les pays de la sphère sinisée, ce projet met l'accent sur des valeurs partagées et des liens historiques, servant de tampon culturel contre l'influence extérieure."
 JAP_chi_temple: "Projet conjoint de préservation des temples bouddhistes"
 JAP_chi_temple_desc: "Préserver les temples bouddhistes comme patrimoine culturel partagé par la coopération nippo-chinoise. Ce projet renforce leur valeur comme atouts touristiques et réaffirme les liens historiques entre les deux nations."
 JAP_chi_senkaku: "Gérer le différend des Senkaku"
 JAP_chi_senkaku_desc: "Les tensions autour des îles Senkaku sont directement liées à l'ensemble des relations nippo-chinoises et à la stabilité de la mer de Chine orientale. Tout en maintenant notre position sur la souveraineté, il est nécessaire d'établir un cadre de gestion diplomatique pour éviter les heurts accidentels. Établissons formellement des canaux de dialogue et, tout en retenant les frictions en mer, avançons les négociations dans un environnement favorable à notre pays."
 JAP_kor_friendship: "Améliorer les relations avec la Corée du Sud"
 JAP_kor_friendship_desc: "Vers une relation nippo-sud-coréenne tournée vers l'avenir, le gouvernement japonais s'emploiera à restaurer la confiance et à poursuivre le dialogue. La Corée du Sud est l'un des voisins les plus importants du Japon, directement liée à la stabilité régionale et à l'économie, et l'amélioration des relations élargira les options et l'influence du Japon."
 JAP_kor_accept_intellectual_platform: "La Corée du Sud a accepté l'établissement de la plateforme historique Japon-Chine-Corée."
 JAP_kor_accelerator: "Accélérateur Tokyo Séoul"
 JAP_kor_accelerator_desc: "Un programme d'accélérateur conjoint est établi à Tokyo et Séoul pour soutenir et nourrir les start-up, renforçant l'innovation et la coopération économique entre les deux capitales."
 JAP_kor_local_companies: "Initiative d'échanges d'entreprises locales"
 JAP_kor_local_companies_desc: "Favorise la collaboration entre entreprises régionales, accélérant la croissance et le développement des industries civiles au niveau local."
 JAP_kor_cultural_exchange: "Échange culturel"
 JAP_kor_cultural_exchange_desc: "En promouvant l'échange culturel, on pose le fondement d'une plus grande compréhension mutuelle et d'une influence sur l'opinion publique entre les deux peuples."
 JAP_kor_aging: "Groupe de travail Japon-Corée sur la société vieillissante"
 JAP_kor_aging_desc: "Une task force conjointe Japon-Corée est formée pour affronter le défi partagé des sociétés vieillissantes, tenant des discussions mensuelles pour concevoir des politiques coopératives."
 JAP_kor_liancourt_rocks: "Gérer le différend de Takeshima"
 JAP_kor_liancourt_rocks_desc: "Le différend sur Takeshima (Dokdo) est une question pendante importante qui peut affecter l'ensemble des relations nippo-sud-coréennes. Tout en maintenant fermement la position de notre pays, nous établirons un cadre de dialogue et de consultations pratiques afin d'éviter les frictions accidentelles et l'escalade des tensions diplomatiques. Cela lèvera les restrictions sur les négociations avec la Corée du Sud concernant la question de Takeshima (Dokdo)."
 JAP_approaching_russia: "Rapprochement avec la Russie"
 JAP_approaching_russia_desc: "Pour assurer la stabilité géopolitique et sécuriser l'accès aux ressources, nous poursuivons une ligne diplomatique visant à améliorer les relations avec la Russie, centrée sur la coopération en énergie, infrastructures et commerce."
 JAP_sov_far_east_development: "Initiative d'Extrême-Orient"
 JAP_sov_far_east_development_desc: "En s'appuyant sur l'expertise japonaise de revitalisation régionale dans le climat froid d'Hokkaidō, cette initiative favorise le développement des régions froides de l'Extrême-Orient russe par l'investissement infrastructurel et les capitaux étrangers."
 JAP_sov_saakhalin: "Sakhaline II"
 JAP_sov_saakhalin_desc: "Pour assurer un accès stable aux combustibles fossiles, le Japon renforce l'investissement étranger dans le projet énergétique Sakhaline II en coopération avec la Russie."
 JAP_sov_logistics_corridor: "Corridor logistique Japon-Europe"
 JAP_sov_logistics_corridor_desc: "Nous développerons un corridor logistique terrestre reliant le Japon et l'Europe via la Russie. En utilisant les chemins de fer et autoroutes russes, nous visons à raccourcir les temps de transport et à établir un accès stable aux marchés européens."
 JAP_sov_it_corridor: "Corridor numérique russe"
 JAP_sov_it_corridor_desc: "En collaboration avec des firmes informatiques japonaises, des infrastructures telles que centres de données et câbles de fibre optique seront établies en Russie, créant un réseau de commerce numérique reliant l'Europe, l'Asie centrale et la Russie."
 JAP_sov_kuril_islands: "Gérer le différend des Territoires du Nord"
 JAP_sov_kuril_islands_desc: "La question des Territoires du Nord est une affaire pendante non résolue qui touche au fondement même des relations nippo-russes. Tout en maintenant fermement la position de notre pays, nous établirons un cadre de négociations diplomatiques et de consultations pratiques afin d'éviter l'enracinement de la confrontation. Tout en gérant avec soin les relations avec la Russie, nous lèverons les restrictions sur les négociations concernant la question des Territoires du Nord."
 JAP_defensive_foundations: "Fondations défensives"
 JAP_defensive_foundations_desc: "Le Japon renforce la posture défensive fondamentale des Forces d'autodéfense, en se concentrant sur la protection du territoire, la réponse aux crises et la dissuasion, tout en restant dans les limites d'une interprétation strictement défensive de l'article 9."
 JAP_jgsdf: "Renforcer les FGAD"
 JAP_jgsdf_desc: "Les Forces terrestres d'autodéfense du Japon renforcent leurs capacités défensives par une meilleure mobilité, un entraînement et une préparation accrus. Ces mesures garantissent que la force reste capable de protéger la patrie tout en opérant strictement dans les contraintes juridiques et stratégiques existantes."
 JAP_type_x_mbt: "Mettre en service le char de combat Type 10"
 JAP_type_x_mbt_desc: "Le Type 10 représente un saut dans le développement blindé japonais : plus léger, plus rapide, et conçu spécifiquement pour un déploiement rapide à travers le terrain difficile du Japon. En élargissant la production et en formant les équipages de cette plateforme avancée, les FGAD renforcent leur capacité à répondre vite aux menaces sur le territoire."
 JAP_type_manouvre_combat_vehicle: "Véhicule de combat de manœuvre de type 16"
 JAP_type_manouvre_combat_vehicle_desc: "Le véhicule de combat de manœuvre Type 16 fournit une puissance de feu hautement mobile aux forces de réaction rapide. Sa configuration à roues permet aux FGAD de repositionner rapidement les unités à travers l'archipel, renforçant les régions reculées sans dépendre de la logistique de l'armure lourde."
 JAP_wheeled_howitzer: "Obusier à roues de type 19"
 JAP_wheeled_howitzer_desc: "Une nouvelle génération d'artillerie mobile, le Type 19, combine des systèmes de conduite de tir modernes et une capacité de redéploiement rapide. Son châssis à roues permet un appui flexible aux opérations défensives à travers la géographie dispersée et accidentée du Japon."
 JAP_chu_sam: "Étendre le réseau Chu-SAM Type 03"
 JAP_chu_sam_desc: "Le Japon renforce sa posture de défense aérienne avec des batteries supplémentaires de Chu-SAM Type 03. Ces systèmes de missiles modernes à moyenne portée améliorent la protection contre les incursions aériennes et s'intègrent sans couture à l'infrastructure nationale d'alerte précoce et de pistage."
 JAP_type_atgm: "Améliorer les unités de missiles antichar d'infanterie"
 JAP_type_atgm_desc: "Les FGAD équipent leur infanterie et leurs éléments de reconnaissance de systèmes de missiles guidés antichars améliorés, y compris des modèles mis à jour du Type 01 et du Type 96. Ces améliorations garantissent que les forces terrestres restent capables de contrer les menaces blindées modernes dans tout engagement défensif."
 JAP_central_readiness_force: "Étendre la Force centrale de préparation"
 JAP_central_readiness_force_desc: "La Force centrale de préparation est développée en un commandement flexible, rapidement déployable, capable de répondre aux urgences partout au Japon. En améliorant l'entraînement interarmes, la mobilité et la coordination avec les armées régionales, nous garantissons que les unités terrestres peuvent renforcer les zones critiques à bref délai."
 JAP_civil_protection_act: "Mettre en œuvre le cadre de protection civile"
 JAP_civil_protection_act_desc: "De nouvelles mesures de protection civile formalisent la coopération entre les Forces d'autodéfense, les autorités locales, la police et les services d'urgence. Des procédures juridiques claires pour les évacuations, la réponse aux crises et la protection des infrastructures renforcent la capacité du Japon à protéger sa population lors des catastrophes comme des incidents de sécurité."
 JAP_maritime_self_defence_force: "Renforcer la Force maritime d'autodéfense"
 JAP_maritime_self_defence_force_desc: "Les Forces maritimes d'autodéfense sont renforcées par un meilleur entraînement, une meilleure maintenance et des structures de soutien pour soutenir des opérations à haute cadence en mer. En améliorant les groupes d'escorte, la capacité de patrouille et la logistique navale, le Japon peut mieux protéger les voies maritimes vitales et les eaux côtières."
 JAP_amphibious_rapid_deployment: "Former une brigade de déploiement rapide amphibie"
 JAP_amphibious_rapid_deployment_desc: "Une formation amphibie de déploiement rapide dédiée est établie pour répondre aux crises sur les îles reculées du Japon. Combinant infanterie, blindés et transport naval, cette brigade est entraînée à renforcer, sécuriser et, si nécessaire, reprendre un territoire clé le long de la frontière maritime japonaise."
 JAP_atago_destroyer: "Mettre en service des destroyers Aegis avancés"
 JAP_atago_destroyer_desc: "De nouveaux destroyers équipés Aegis sont mis en service, fournissant de puissantes capacités de défense aérienne, anti-sous-marine et de commandement. Ces escortes avancées forment le cœur de la flotte de surface moderne du Japon et renforcent considérablement la protection de la flotte et la dissuasion régionale."
 JAP_keen_sword_operation: "Développer les exercices conjoints Keen Sword"
 JAP_keen_sword_operation_desc: "La série d'exercices Keen Sword est élargie pour inclure des composantes navales, aériennes et terrestres plus complexes. Des manœuvres régulières de grande ampleur avec les forces alliées aiguisent l'interopérabilité, améliorent le commandement et le contrôle interarmes, et démontrent la préparation du Japon à opérer efficacement dans un environnement régional contesté."
 JAP_f2_multirole_defensive_enhancement: "Renforcer la flotte multirôle F-2"
 JAP_f2_multirole_defensive_enhancement_desc: "La flotte F-2 reçoit avionique, capteurs et systèmes d'armes modernisés pour améliorer la défense aérienne et la frappe maritime dans les eaux proches. Ces améliorations permettent à l'appareil de répondre plus efficacement aux menaces régionales tout en maintenant un profil de mission principalement défensif."
 JAP_f15_defensive_updat_programe: "Programme de modernisation défensive des F-15"
 JAP_f15_defensive_updat_programe_desc: "Les chasseurs de supériorité aérienne F-15 du Japon subissent une modernisation d'ensemble, y compris radars modernes, suites de guerre électronique et missiles air-air améliorés. La flotte mise à jour renforce considérablement la capacité du Japon à sécuriser son propre espace aérien face à des adversaires de plus en plus capables."
 JAP_hyuga_class: "Déployer des destroyers d'hélicoptères de classe Hyūga"
 JAP_hyuga_class_desc: "Les destroyers porte-hélicoptères de classe Hyūga sont mis en service opérationnel complet comme plateformes de commandement et de lutte anti-sous-marine. Leur capacité à coordonner les groupes d'escorte et à opérer plusieurs hélicoptères améliore grandement la protection de la flotte et la conscience situationnelle maritime."
 JAP_p_maritime_patrol: "Développer l'aviation de patrouille maritime"
 JAP_p_maritime_patrol_desc: "Le Japon investit dans des aéronefs de patrouille maritime modernes pour surveiller les voies maritimes, pister les sous-marins et soutenir les opérations de recherche et sauvetage. Une couverture de patrouille renforcée autour de l'archipel renforce à la fois la sécurité nationale et la sûreté du trafic maritime."
 JAP_deploy_ballistic_warning_radars: "Déployer des radars d'alerte aux missiles balistiques"
 JAP_deploy_ballistic_warning_radars_desc: "De nouveaux radars d'alerte précoce à longue portée sont installés pour détecter et pister les lancements de missiles balistiques dans la région. En intégrant ces capteurs au réseau de commandement national, le Japon gagne des minutes vitales pour évaluer les menaces, alerter la population et coordonner les réponses défensives."
 JAP_modernize_jadge: "Moderniser le réseau de défense aérienne JADGE"
 JAP_modernize_jadge_desc: "Le système Japan Aerospace Defense Ground Environment (JADGE) est mis à niveau avec des liaisons de données améliorées, une capacité de traitement accrue et une intégration aux capteurs navals et terrestres. Un réseau JADGE modernisé permet une décision plus rapide et un déploiement plus efficace des moyens de défense aérienne."
 JAP_air_self_defence_force: "Renforcer les Forces aériennes d'autodéfense"
 JAP_air_self_defence_force_desc: "Les Forces aériennes d'autodéfense élargissent leurs programmes d'entraînement, l'infrastructure des bases et les unités de soutien pour gérer une cadence opérationnelle plus élevée. Ces améliorations garantissent que le Japon peut soutenir des patrouilles aériennes continues, des décollages d'alerte rapides et des exercices interarmes complexes alors que l'environnement aérien régional devient plus exigeant."
 JAP_article_nine_transition_comittee: "Établir le comité de transition de la défense"
 JAP_article_nine_transition_comittee_desc: "Un comité dédié est formé pour coordonner la transition du Japon vers une posture de défense nationale modernisée. En réunissant décideurs, planificateurs militaires et experts juridiques, le Japon peut gérer le glissement des responsabilités et assurer une transformation stable et bien organisée."
 JAP_article_nine_transition_comittee_tt: "§GLe modificateur d'équilibre des pouvoirs de l'article 9 ne pourra plus changer, selon le niveau d'interprétation. Cela donne désormais accès à des focuses nationaux, retirant complètement l'article 9.§!"
 JAP_secure_public_support: "Obtenir le soutien public à la réforme de la défense"
 JAP_secure_public_support_desc: "Un effort national est lancé pour expliquer l'évolution de la politique de défense du Japon, répondre aux préoccupations du public et bâtir la confiance dans la nouvelle posture de sécurité. Un large soutien de la société assure la stabilité politique et réduit les frictions pendant la transition."
 JAP_modernize_joint_command: "Moderniser les structures de commandement interarmées"
 JAP_modernize_joint_command_desc: "Les forces armées intègrent leurs commandements opérationnels en une structure interarmes unifiée, améliorant l'interopérabilité et la préparation. Une planification interarmes moderne et des normes d'entraînement partagées permettent des réponses plus efficaces à des scénarios de sécurité complexes."
 JAP_normalize_defense_procurement: "Normaliser les systèmes d'acquisition de défense"
 JAP_normalize_defense_procurement_desc: "Le Japon rationalise l'acquisition de défense, élargit la capacité industrielle et renforce la coordination avec les fabricants intérieurs. Des processus d'acquisition transparents et modernisés garantissent que les projets de défense critiques peuvent être livrés efficacement et durablement."
 JAP_formalize_national_defense: "Formaliser les capacités de défense nationale"
 JAP_formalize_national_defense_desc: "Le Japon codifie officiellement ses responsabilités de défense élargies, clarifiant rôles, missions et objectifs stratégiques à long terme. La transition achevée, les forces armées opèrent sous une vision unifiée conçue pour protéger les intérêts nationaux dans un environnement régional de plus en plus complexe."
 JAP_normalize_defense_procurement_done: "Acquisitions de défense normalisées"
 JAP_modernize_joint_command_done: "Modernisation du commandement interarmées achevée"
 JAP_consolidate_national_defense_framework_done: "Cadre de défense nationale consolidé"
 JAP_rebuild_blue_water_navy: "Reconstruire une marine de haute mer"
 JAP_rebuild_blue_water_navy_desc: "Le Japon prépare sa flotte à des opérations soutenues bien au-delà des eaux territoriales, élargissant la logistique, la capacité de ravitaillement et les forces d'escorte à longue portée. Une marine hauturière renouvelée permet au Japon de protéger les voies maritimes, de soutenir les partenaires et de répondre aux crises à travers la région élargie."
 JAP_carrier_aviation_tt: "[JAP_carrier_aviation_idea_desc]\n"
 JAP_carrier_aviation_development: "Programme d'aviation embarquée"
 JAP_carrier_aviation_development_desc: "Un programme dédié est lancé pour développer une aviation embarquée, intégrant chasseurs navals, opérations de pont et entraînement spécialisé. Bâtir un groupe aérien embarqué crédible accroît dramatiquement la portée et la flexibilité de la flotte, tant en dissuasion qu'en combat."
 JAP_submarine_modernization_project: "Projet de modernisation des sous-marins"
 JAP_submarine_modernization_project_desc: "Le Japon modernise sa flotte sous-marine avec des coques plus silencieuses, des capteurs avancés et des armes modernes. Une nouvelle génération de sous-marins d'attaque renforce la dissuasion sous-marine, le déni d'accès maritime et la capacité de surveiller en profondeur les eaux contestées."
 JAP_expand_multi_role_destroyer_fleet: "Étendre la flotte de destroyers multirôles"
 JAP_expand_multi_role_destroyer_fleet_desc: "Des destroyers multirôles supplémentaires sont mis en service pour fournir défense aérienne, lutte anti-sous-marine et frappe de surface sur une plateforme unique et flexible. Ces escortes forment l'épine dorsale des forces opérationnelles élargies du Japon en mer."
 JAP_establish_joint_rapid_deployment_command: "Établir un commandement conjoint de déploiement rapide"
 JAP_establish_joint_rapid_deployment_command_desc: "Un commandement interarmes est créé pour coordonner des éléments terrestres, aériens et navals rapidement déployables. Avec une planification unifiée et des réponses de contingence préétablies, le Japon gagne une force capable de réagir vite aux crises partout dans son environnement stratégique élargi."
 JAP_full_defense_industrial_mobilisation: "Mobilisation industrielle de défense totale"
 JAP_full_defense_industrial_mobilisation_desc: "Le Japon aligne sa base industrielle, ses institutions de recherche et ses réseaux logistiques derrière un plan de production de défense d'ensemble. Acquisition standardisée, contrats à long terme et capacité élargie permettent la fabrication soutenue de navires, véhicules, aéronefs et armes avancées."
 JAP_long_range_strike_missile_artillery_forces: "Forces de frappe à longue portée et d'artillerie-missiles"
 JAP_long_range_strike_missile_artillery_forces_desc: "Des unités spécialisées de missiles et d'artillerie sont organisées pour livrer des frappes de précision à longue portée. En combinant munitions avancées et systèmes modernes de ciblage et de commandement, le Japon gagne la capacité de menacer des atouts militaires distants et des infrastructures clés."
 JAP_expand_mechanized_brigades: "Développer les brigades mécanisées"
 JAP_expand_mechanized_brigades_desc: "Les formations mécanisées existantes sont renforcées et de nouvelles brigades sont levées, équipées de véhicules de combat d'infanterie modernes et d'un appui blindé. Cette expansion améliore la mobilité, la protection et la capacité de combat soutenue au sol."
 JAP_deploy_next_generation: "Déployez des formations de combat de nouvelle génération"
 JAP_deploy_next_generation_desc: "Les unités de combat sont réorganisées autour d'équipements de nouvelle génération, de systèmes de commandement en réseau et d'une doctrine interarmes. Ces formations sont conçues pour un déploiement rapide, une haute survivabilité et des opérations efficaces dans des environnements complexes et de haute intensité."
 JAP_national_defense_professionalization: "Professionnalisation de la défense nationale"
 JAP_national_defense_professionalization_desc: "Le Japon investit dans l'éducation militaire professionnelle, le développement de carrière et des systèmes de personnel modernes dans toutes les armes. Un corps d'officiers et de sous-officiers plus capable, expérimenté et cohésif accroît la préparation, améliore le commandement et soutient l'efficacité à long terme des forces de défense nationales."
 JAP_integrated_air_space_command: "Commandement aérien et spatial intégré"
 JAP_integrated_air_space_command_desc: "Un commandement aérien et spatial intégré est établi pour coordonner défense aérienne, alerte précoce, soutien satellitaire et surveillance spatiale. En fusionnant l'information des radars terrestres, des capteurs aéroportés et des plateformes orbitales, le Japon gagne une image plus claire de l'espace de bataille et peut répondre plus vite aux menaces émergentes."
 JAP_establish_long_range_strike_aviation: "Établir une aviation de frappe à longue portée"
 JAP_establish_long_range_strike_aviation_desc: "Des unités d'aviation de frappe à longue portée dédiées sont formées, équipées d'aéronefs modernes et d'armes standoff. Ces forces fournissent la capacité de frapper des cibles critiques à distantes, soutenant la dissuasion et les opérations interarmes à travers la région élargie."
 JAP_mext_generation_air_dominance: "Domination aérienne de nouvelle génération"
 JAP_mext_generation_air_dominance_desc: "Le Japon accélère le développement d'un chasseur de domination aérienne de nouvelle génération, combinant furtivité, capteurs avancés et systèmes de combat en réseau. Ce programme garantit que l'armée de l'air puisse maintenir la supériorité dans des cieux de plus en plus contestés bien dans l'avenir."
 JAP_advanced_missile_development: "Direction des missiles avancés"
 JAP_advanced_missile_development_desc: "Une direction dédiée est établie pour superviser la recherche, les essais et la production de systèmes de missiles avancés. Des armes air-air et antinavires modernes aux capacités de frappe de précision à longue portée, cet effort élargit l'arsenal du Japon et améliore l'efficacité de toutes les armes."
 JAP_high_tech_domestic_manufacturing: "Fabrication nationale de défense de haute technologie"
 JAP_high_tech_domestic_manufacturing_desc: "Le Japon investit dans la fabrication haut de gamme d'avionique, de capteurs, de structures composites et de systèmes de propulsion. Renforcer les chaînes d'approvisionnement intérieures pour les composants critiques réduit la dépendance vis-à-vis des fournisseurs étrangers et soutient des modernisations rapides des plateformes aériennes et de missiles."
 JAP_establish_japan_defense_technology_agency: "Agence japonaise des technologies de défense"
 JAP_establish_japan_defense_technology_agency_desc: "Une agence centralisée de technologie de défense est créée pour coordonner recherche, acquisition et innovation à travers l'industrie, l'université et les forces armées. Une supervision unifiée accélère les cycles de développement, réduit les doublons et garantit que les concepts prometteurs passent vite du laboratoire aux unités de première ligne."
 JAP_atla_defense_technology_consolidation: "Consolidation de la technologie ATLA"
 JAP_atla_defense_technology_consolidation_desc: "L'Agence d'acquisition, de technologie et de logistique se voit confier un rôle central dans la coordination de la recherche, du développement et de l'acquisition à travers toutes les armes. En consolidant les programmes de technologie de défense sous une seule autorité, le Japon peut réduire les doublons, accélérer l'innovation et pousser plus vite les projets prometteurs en service opérationnel."
 JAP_gifu_test_aerospace_development_center: "Centre d'essais et de développement aérospatial de Gifu"
 JAP_gifu_test_aerospace_development_center_desc: "Gifu est développé en pôle premier d'essais et d'évaluation pour aéronefs, avionique et systèmes d'armes. Polygones dédiés, espace aérien instrumenté et équipes d'ingénierie spécialisées soutiennent des essais rigoureux, garantissant que les nouveaux designs sont pleinement éprouvés avant d'entrer en service de première ligne."
 JAP_aichi_nagoya_aerospace_defense_cluster: "Pôle aérospatial de défense Aichi-Nagoya"
 JAP_aichi_nagoya_aerospace_defense_cluster_desc: "La région Aichi-Nagoya est cultivée comme pôle de production aérospatiale et de défense de premier plan, liant grands fabricants, fournisseurs et instituts de recherche. Un investissement concentré dans cette zone dote la production de cellules, moteurs et composants de haute technologie pour les plateformes militaires comme à double usage."
 JAP_kobo_maritime_heavy_industry_corridor: "Corridor de l'industrie lourde maritime de Kobé"
 JAP_kobo_maritime_heavy_industry_corridor_desc: "Kobe et les villes côtières environnantes sont développées en un corridor continu d'industrie lourde maritime. Chantiers élargis, aciéries et bureaux d'ingénierie marine fournissent la capacité de construire et d'entretenir une flotte plus vaste et plus capable, ainsi que son infrastructure de soutien."
 JAP_nagasaki_shipyard_defense: "Intégration défensive des chantiers de Nagasaki"
 JAP_nagasaki_shipyard_defense_desc: "Les grands chantiers de Nagasaki sont plus profondément intégrés à la planification de défense nationale, consacrant une capacité supplémentaire aux escortes, bâtiments de soutien et plateformes navales spécialisées. Une coordination plus étroite entre les chantiers et la marine raccourcit les délais de construction et améliore la préparation de la flotte."
 JAP_kure_naval_arsenal_revival: "La renaissance de l'arsenal naval de Kure"
 JAP_kure_naval_arsenal_revival_desc: "Les installations navales historiques de Kure sont revitalisées en un complexe moderne de construction et de réparation. Quais, ateliers et nœuds logistiques modernisés restaurent le rôle de la ville comme centre clé d'entretien, de refontes et de modernisations des navires de guerre de première ligne."
 JAP_sasebo_fleet_support_complex: "Complexe de soutien de la flotte de Sasebo"
 JAP_sasebo_fleet_support_complex_desc: "Sasebo est élargi en un complexe de soutien de flotte d'ensemble, avec une meilleure capacité de réparation, un stockage de munitions et une infrastructure d'approvisionnement. Sa situation dans l'ouest du Japon en fait un pôle idéal pour soutenir les opérations dans les mers proches et les goulets maritimes clés."
 JAP_yokosuka_dockyard_expansion: "Agrandissement du chantier naval de Yokosuka"
 JAP_yokosuka_dockyard_expansion_desc: "Les docks de Yokosuka et les installations associées sont agrandis pour accueillir plus de navires et des cycles d'entretien plus profonds. Comme l'une des principales bases navales du Japon, un Yokosuka élargi accroît grandement la capacité de la marine à tenir les grands bâtiments de surface prêts au déploiement."
 JAP_revitalize_defense_production: "Revitaliser la base de production de défense"
 JAP_revitalize_defense_production_desc: "Le Japon entreprend un effort large pour redynamiser sa base industrielle de défense, soutenant les fabricants clés, stabilisant les contrats à long terme et modernisant les lignes de production. Une fondation industrielle plus saine permet au pays d'équiper ses forces de façon fiable et de s'adapter plus vite aux nouvelles exigences opérationnelles."
 JAP_kaguya_starward_expedition: "Expédition vers les étoiles de Kaguya"
 JAP_kaguya_starward_expedition_desc: "Inspiré par le conte de la princesse Kaguya, qui retourna à la Lune dans une robe de lumière, le Japon lance une ambitieuse campagne d'étude en espace lointain des astéroïdes proches de la Terre. Sondes robotiques avancées et démonstrateurs miniers sont envoyés dans le vide, transformant la légende en technologie et posant le socle d'une future extraction de ressources parmi les étoiles."
 JAP_kaguya_starward_expedition_tt: "§YNotre mission vers la Lune sera lancée !§!"
 JAP_tsukuyomi_lunar_program: "Programme lunaire Tsukuyomi"
 JAP_tsukuyomi_lunar_program_desc: "Nommé d'après Tsukuyomi, kami de la lune de la mythologie japonaise, ce programme unit industrie, instituts de recherche et agence spatiale derrière un effort lunaire soutenu. Orbiters, atterrisseurs et infrastructure de surface transforment la Lune d'un symbole lointain en un avant-poste tangible, au service de la science, de la navigation et des ambitions à long terme de l'avenir spatial du Japon."
 JAP_amaterasu_martian_dawn: "Amaterasu Aube martienne"
 JAP_amaterasu_martian_dawn_desc: "Sous le nom d'Amaterasu, déesse du soleil levant, le Japon tend vers la planète rouge. Sondes à longue portée, propulsion avancée et recherche pionnière de support-vie soutiennent une nouvelle vague d'exploration martienne. Chaque mission pousse les limites de l'ingéniosité humaine, transformant la lueur lointaine de Mars en le prochain horizon de la civilisation high-tech du Japon."
 JAP_restore_imperial_household: "Restaurer la Maison impériale"
 JAP_restore_imperial_household_desc: "La Maison impériale sort de la cérémonie pour entrer dans l'administration nationale, recouvrant une capacité institutionnelle et un rôle de cour formel. La légitimité est réordonnée afin que le Trône du Chrysanthème fixe les termes plutôt que de les ratifier. Chaque faction doit désormais choisir un camp."
 JAP_reinstate_former_imperial_houses: "Rétablir les anciennes maisons impériales"
 JAP_reinstate_former_imperial_houses_desc: "Les anciennes maisons princières sont rétablies et leur statut restauré, élargissant les branches éligibles à hériter du Trône. Les monarchistes saluent la sauvegarde d'une lignée ininterrompue, les constitutionnalistes le condamnent comme ingénierie politique. La succession est assurée, quel que soit le règlement de l'argument."
 JAP_male_line_succession_act: "Adopter la loi de succession en ligne masculine"
 JAP_male_line_succession_act_desc: "L'incertitude successorale est une vulnérabilité stratégique autant qu'une controverse intérieure. Nous codifierons la succession en ligne masculine dans la loi pour éliminer l'ambiguïté et assurer la continuité dynastique pour les générations à venir. Le geste consolidera le soutien monarchiste, mais il enflammera une opposition féroce des réformateurs qui y voient un recul du Japon moderne."
 JAP_imperial_rites_restored: "Restaurer les rites impériaux"
 JAP_imperial_rites_restored_desc: "Un trône sans rituel est une couronne sans poids. Nous restaurerons les rites impériaux comme cérémonies reconnues par l'État, réaffirmant les fondements sacrés de la monarchie et la continuité de la nation. Ce faisant, nous lions l'État moderne à une légitimité ancienne, que la classe politique l'approuve ou non."
 JAP_recall_privy_council: "Rappeler le Conseil privé"
 JAP_recall_privy_council_desc: "La politique parlementaire est devenue bruyante, transitoire et de plus en plus détachée de l'art de gouverner à long terme. Nous rappellerons le Conseil privé pour fournir au Trône un organe consultatif permanent, discret, expérimenté et loyal à la continuité de l'État. Son retour sera vu comme un ancre stabilisateur par les monarchistes et comme un centre de pouvoir non élu par ses adversaires."
 JAP_imperial_reform_commission: "Établir la commission de réforme impériale"
 JAP_imperial_reform_commission_desc: "La restauration exige une structure, non l'improvisation. Nous établirons une commission de réforme impériale pour rédiger le plan juridique et institutionnel d'une monarchie renouvelée et aligner ministères, offices de cour et organes de sécurité derrière une seule doctrine d'État. Une fois convoquée, la commission transformera le symbole en politique et rendra le recul politiquement impossible."
 JAP_imperial_audience: "Tenir une audience impériale"
 JAP_imperial_audience_desc: "Les partis seront convoqués non comme égaux, mais comme pétitionnaires devant le Trône. Dans une audience impériale soigneusement mise en scène, nous lierons les chefs de faction à un nouvel ordre, où la politique élue sert l'État plutôt qu'elle ne le commande. Si le Trône du Chrysanthème doit présider un shogunat moderne, il doit d'abord faire plier la classe politique à sa logique."
 JAP_imperial_civic_oath: "Proclamer le serment civique impérial"
 JAP_imperial_civic_oath_desc: "Un nouvel ordre exige plus que des décrets ; il exige une allégeance partagée. Nous proclamerons un serment civique impérial qui lie officiels, militaires et institutions civiles au Trône comme source ultime de légitimité. Ce faisant, nous transformons la loyauté en loi et faisons ressentir la dissidence comme une trahison."
 JAP_unified_intelligence_secretariat: "Créer un Secrétariat de renseignement unifié"
 JAP_unified_intelligence_secretariat_desc: "Un shogunat moderne ne peut être aveugle. Nous consoliderons les services concurrents en un secrétariat unifié du renseignement qui rend compte par une seule chaîne de commandement et sauvegarde le tableau stratégique du Trône. Cela aiguisera notre art de gouverner du jour au lendemain, tout en donnant à nos rivaux toutes les raisons de craindre ce que la cour sait désormais."
 JAP_blue_water_navy: "Construire une marine de haute mer"
 JAP_blue_water_navy_desc: "Le destin du Japon est maritime, et notre sécurité ne peut s'arrêter à l'horizon. Nous bâtirons une véritable marine hauturière capable d'opérer loin des eaux territoriales, de protéger les voies maritimes et de projeter la puissance là où nos intérêts l'exigent. Avec la flotte comme instrument d'acier du Trône, le monde apprendra à mesurer le Japon à son sillage."
 JAP_imperial_defense_council: "Former le Conseil impérial de défense"
 JAP_imperial_defense_council_desc: "La stratégie ne peut être laissée aux cycles électoraux et à la rivalité ministérielle. Nous formerons un Conseil impérial de défense pour unifier les forces armées, la direction du renseignement et les ministères clés sous une seule doctrine stratégique ancrée au Trône. D'un seul geste, la politique de sécurité du Japon devient cohérente et bien plus difficile à saboter de l'intérieur par les factions."
 JAP_rare_earth_resilience: "La réserve stratégique impériale"
 JAP_rare_earth_resilience_desc: "Le gouvernement impérial enjoint aux grandes maisons de commerce de sécuriser les lignes d'approvisionnement et de constituer des réserves de brut et de métaux stratégiques contre toute guerre ou embargo. La Maison et les ministères tiennent ensemble les nerfs matériels de la nation en fiducie pour la couronne. Ce que le domaine de l'Empereur ne peut acheter librement, il le stocke et le sécurise de sa propre main.\n-------------\nSi §Y$JAP_national_energy_security$§! a déjà été atteinte, la réserve est constituée sur des fondations sécurisées et produit §Gdeux fois§! le bénéfice en métaux stratégiques."
 JAP_national_shipbuilding_plan: "Programme d'expansion de la flotte impériale"
 JAP_national_shipbuilding_plan_desc: "Le Trône ne se contentera pas de la défense côtière ; le Japon commandera les mers qui décident de notre sort. Sous le programme impérial d'expansion de la flotte, nous ferons monter la capacité des chantiers, verrouillerons l'acquisition navale à long terme et porterons un cycle de construction continu de la pose de quille à la mise en service. Quand ce plan sera en cours, nos rivaux ne débattront plus des intentions du Japon. Ils compteront nos coques."
 JAP_imperial_war_cabinet: "Convoquer le cabinet de guerre impérial"
 JAP_imperial_war_cabinet_desc: "En temps de crise, le Japon ne peut être gouverné par le délai, le comité et le marchandage partisan. Nous convoquerons un cabinet de guerre impérial pour centraliser l'autorité de commandement et lier la direction politique à une seule ligne stratégique sous le mandat du Trône. Dès cet instant, l'État agira d'une seule voix, et ce sera celle de l'Empereur."
 JAP_russian_lost_territories: "Reprendre les Territoires du Nord"
 JAP_russian_lost_territories_desc: "Le Japon presse sa revendication sur les îles et eaux tenues par la Russie comme une exigence souveraine étayée par un vrai levier plutôt qu'une formalité diplomatique. Si Moscou refuse, le Japon doit décider jusqu'où il est prêt à aller. Le nord ne restera pas fermé derrière traités et silence."
 JAP_fight_china_again: "Dragon et Chrysanthème"
 JAP_fight_china_again_desc: "L'ancien conflit n'a jamais vraiment été réglé, seulement reporté derrière traités et équilibres changeants. Nous préparerons la nation à affronter de nouveau la Chine, rassemblant industrie, forces armées et volonté publique pour une guerre qui décide de l'avenir de la région. Cette fois, le Japon ne combattra pas pour la seule survie, mais pour l'ordre qui suivra."
 JAP_reclaim_pacific_rim: "Affirmer notre mandat du Rim Pacifique"
 JAP_reclaim_pacific_rim_desc: "La prospérité et la sécurité du Japon sont écrites à travers le Pacifique, des voies maritimes aux chaînes d'îles et aux goulets lointains. Nous affirmerons un mandat du Rim Pacifique qui traite l'influence maritime comme une politique nationale étayée par la présence de flotte, l'accès aux bases et le levier économique. L'ère où l'on regardait les autres tracer la carte est révolue ; le Japon la façonnera."
 JAP_office_for_colonialism: "Faire renaître le Daitōa-shō"
 JAP_office_for_colonialism_desc: "Un empire sans administration est une conquête qui s'effondre sous son propre poids. Nous ferons renaître le Daitōa-shō pour coordonner gouvernance d'outre-mer, arrangements de sécurité et intégration économique sous une seule doctrine impériale. Avec un ministère pour diriger la sphère, l'influence du Japon ne sera plus improvisée : elle sera gérée, élargie et appliquée."
 JAP_office_for_colonialism_tt: "Débloque la loi d'occupation dans les États asiatiques:\n"
 JAP_reclaim_south_chinese_sea: "Commander les mers du Sud"
 JAP_reclaim_south_chinese_sea_desc: "La mer de Chine méridionale est l'artère de l'Asie, et qui la contrôle contrôle le flux du commerce, du carburant et de la puissance. Nous passerons à reprendre la domination de ces eaux, établissant présence, bases et la force navale pour imposer notre volonté contre tout challenger. Le Japon ne demandera pas l'accès, il le garantira par la force."
 JAP_reclaim_indochina: "Retour en Indochine"
 JAP_reclaim_indochina_desc: "L'Indochine se tient au carrefour de l'Asie du Sud-Est, où ports, ressources et voies maritimes décident qui fixe l'équilibre régional. Nous reviendrons par la pression, la force et l'ingénierie politique pour ramener ces territoires sous la direction stratégique du Japon. Une fois sécurisé, le flanc sud de notre sphère maritime sera ancré dans une influence permanente."
 JAP_reclaim_australia: "L'ancre du Sud"
 JAP_reclaim_australia_desc: "L'Australie est la clé de voûte du Pacifique sud, un continent qui peut accueillir flottes, puissance aérienne et la logistique qui décide des guerres longues. Nous passerons à la placer sous le contrôle stratégique du Japon, non comme un raid ou un geste, mais comme une ancre permanente de notre sphère maritime. Si le sud est sécurisé, le Pacifique devient un lac japonais."
 JAP_reclaim_myanmar: "Sécuriser la porte de l'Irrawaddy"
 JAP_reclaim_myanmar_desc: "Le Myanmar est le pont terrestre entre l'Asie du Sud et du Sud-Est, contrôlant des routes qui relient le golfe du Bengale au cœur de la région. Nous passerons à le reprendre par la force et la pression politique, transformant ses ports, aérodromes et corridors en atouts de la sphère élargie du Japon. Une fois la porte de l'Irrawaddy sécurisée, notre flanc sud devient bien plus difficile à contester."
 JAP_reclaim_the_pacific: "L'océan comme notre frontière"
 JAP_reclaim_the_pacific_desc: "Le Pacifique n'est pas une étendue lointaine, c'est la frontière qui décide de la survie et de la grandeur du Japon. Nous le reprendrons par la présence de flotte, des points d'appui insulaires et la volonté d'imposer un ordre maritime façonné à Tokyo. Quand l'océan devient notre frontière, chaque rival sera forcé d'opérer sous notre ombre."
 JAP_reclaim_north_korea: "Lier le Nord sous la main de Tokyo"
 JAP_reclaim_north_korea_desc: "Nous forcerons un règlement qui dépouille Pyongyang d'autonomie stratégique et place sa politique extérieure sous supervision japonaise. Par un accès contrôlé, des garanties de sécurité et un dur levier sur les ressources et la reconstruction, le Nord sera transformé en tampon dépendant plutôt qu'en menace imprévisible. C'est la domination sans illusion, et une stabilité imposée par conception."
 JAP_reclaim_south_korea: "Imposer un cadre de protectorat"
 JAP_reclaim_south_korea_desc: "Nous passerons au-delà de l'influence et établirons un cadre de protectorat qui lie la politique étrangère et de sécurité de la Corée à la direction de Tokyo. Par des accords contrôlés, des conseillers et un levier sur les institutions clés, la Corée sera forcée dans une position subordonnée sans besoin d'annexion ouverte. C'est un empire moderne bâti de paperasse, de pression et de permanence."
 JAP_reclaim_taiwan: "Établir un protectorat à Taiwan"
 JAP_reclaim_taiwan_desc: "Nous passerons de l'influence au contrôle en imposant un cadre de protectorat qui lie la défense et la politique étrangère de Taïwan à la direction de Tokyo. Par des garanties, des droits de basage et un levier institutionnel, l'île sera sécurisée comme bastion maritime loyal sans besoin d'annexion ouverte. C'est un arrangement impérial moderne, imposé par la puissance navale et la pression politique."
 JAP_basic_reconstruction_policy: "Politique de reconstruction"
 JAP_basic_reconstruction_policy_desc: "Au lendemain des dévastations inédites causées par le Grand séisme de l'est du Japon, le gouvernement doit établir une politique de base pour la reconstruction. Présenter un cadre national pour restaurer les moyens d'existence, reconstruire les infrastructures et revitaliser l'industrie sera le premier pas vers le recouvrement de la confiance publique et la stabilisation de la société."
 JAP_tohoku_infrastructure: "Reconstruire les infrastructures du Tōhoku"
 JAP_tohoku_infrastructure_desc: "Le séisme et le tsunami ont infligé des dégâts catastrophiques aux réseaux de transport et aux lignes de vie du Tōhoku. Reconstruire routes, chemins de fer et ports est le premier pas vers la restauration des communautés locales et l'avancée du redressement régional. Bien que l'effort exige des coûts et un temps immenses, il ne peut être reporté."
 JAP_fishery_revival: "Reprise de l’agro-pêche"
 JAP_fishery_revival_desc: "Le tsunami a dévasté les ports de pêche et les terres agricoles du Tōhoku, détruisant d'innombrables moyens d'existence. Reconstruire ces secteurs restaurera la base économique de la région et assurera un approvisionnement alimentaire stable. Cet effort est vital tant pour le redressement local que pour la sécurité nationale."
 JAP_tohoku_port: "Restaurer les fonctions du port Tohoku"
 JAP_tohoku_port_desc: "Le tsunami a paralysé installations portuaires et chantiers, haltant logistique et commerce maritime. La reconstruction fera renaître les industries régionales et rouvrira des routes intérieures et internationales clés. Recouvrer ces portes est essentiel au redressement économique plus large du Japon."
 JAP_power_supply: "Stabilisation de puissance"
 JAP_power_supply_desc: "La catastrophe a endommagé de nombreuses installations électriques et réseaux de transmission, créant une grave pénurie d'électricité. Nous devons vite élargir les sources alternatives et renforcer le réseau pour assurer la stabilité des citoyens comme de l'industrie."
 JAP_kanto_infrastructure: "Reconstruire les infrastructures du Kantō"
 JAP_kanto_infrastructure_desc: "La catastrophe a infligé de graves dégâts à la région de Kantō, particulièrement au nord, perturbant les réseaux de transport et les fonctions urbaines. Restaurer l'infrastructure qui soutient la zone capitale est essentiel pour faire renaître l'activité économique et maintenir la stabilité nationale. Une reconstruction rapide et bien planifiée s'impose."
 JAP_reconstruction_agency: "Créer une agence de reconstruction"
 JAP_reconstruction_agency_desc: "Pour accélérer et coordonner le redressement post-catastrophe, le gouvernement établira l'Agence de reconstruction. Cet organe dédié unifiera les efforts entre autorités centrales et locales, assurant une mise en œuvre effective des plans de redressement."
 JAP_industrial_recovery: "Restaurer la base industrielle"
 JAP_industrial_recovery_desc: "La catastrophe a gravement endommagé usines et installations industrielles. En reconstruisant la base industrielle, nous pouvons restaurer l'emploi et accélérer le redressement de notre économie."
 JAP_funding_local_governments: "Soutien aux municipalités touchées"
 JAP_funding_local_governments_desc: "Fournir des fonds aux collectivités locales des zones touchées pour soutenir le redressement, reconstruire les moyens d'existence et maintenir les services publics."
 JAP_housing_reconstruction: "Reconstruction des logements pour les victimes"
 JAP_housing_reconstruction_desc: "Accélérer la construction de logements temporaires et de quartiers résidentiels de long terme, faisant sortir les familles déplacées des abris et donnant aux villes des plans clairs de réinstallation permanente."
 JAP_reconstruction_completed_focus: "Reconstruction terminée"
 JAP_reconstruction_completed_focus_desc: "Marquer la transition de la reconstruction d'urgence à la revitalisation à long terme à travers le Tōhoku. L'infrastructure essentielle est restaurée, les industries tournent de nouveau, et les villes commencent à passer de la survie à la croissance."
 JAP_trilateral_anti_north_korea_training: "Préparation de la péninsule trilatérale"
 JAP_trilateral_anti_north_korea_training_desc: "Des exercices conjoints réguliers avec la Corée du Sud et les États-Unis ont forgé un livre de jeu partagé pour la réponse aux crises sur la péninsule. Procédures de commandement interopérables, manœuvres aériennes et navales combinées et routines coordonnées de défense antimissile garantissent que toute provocation de Pyongyang rencontre une réponse rapide, unifiée et crédible."
 JAP_dprk_policy_idea: "Pénétration politique japonaise"
 JAP_dprk_policy_idea_desc: "La nouvelle politique coréenne de Tokyo a ouvert des canaux qui n'existaient pas auparavant. Par des contacts diplomatiques, des intermédiaires officieux, le levier économique et la culture du renseignement, le Japon a gagné une fenêtre temporaire pour élargir son influence dans l'environnement politique nord-coréen. L'ouverture est fragile et contestée, mais pour l'heure, la pression et la présence japonaises pèsent plus à Pyongyang qu'auparavant."
 JAP_entrenched_demand_shortfall_idea_1: "Chute persistante de la demande"
 JAP_entrenched_demand_shortfall_idea_1_desc: "Les anticipations déflationnistes et l'anxiété face à l'avenir étouffent les dépenses des ménages, tandis que les entreprises retiennent l'investissement face à une demande faible. Les salaires stagnent, les prix bougent à peine, et personne ne veut dépenser le premier. L'économie japonaise ne s'effondre pas, mais elle se vide par paralysie.\n-------------\nVous pouvez §Gatténuer§! les effets de cet esprit national en utilisant les décisions de §Y$JAP_japanese_economy_decisions$§! pour porter le §Yprogrès de la reprise de la demande§! à au moins §G30§! !"
 JAP_transparency_and_audit_reform_modifier: "Réforme de la transparence et de l'audit"
 JAP_transparency_and_audit_reform_modifier_desc: "Nous renforcerons la divulgation de l'information et la gestion des archives publiques, réduisant les occasions de malversation par la numérisation et des audits indépendants. En traitant l'amakudari et l'opacité du financement politique, nous améliorerons l'efficacité et la confiance administratives, ainsi que la résilience à l'influence extérieure."
 JAP_protecting_human_rights_modifier: "$JAP_protecting_human_rights$"
 JAP_protecting_human_rights_modifier_desc: "$JAP_protecting_human_rights_desc$"
 JAP_worker_protection_modifier: "Protection des travailleurs"
 JAP_worker_protection_modifier_desc: "Nous protégerons les moyens d'existence et la sécurité des travailleurs sur le lieu de travail, créant des conditions qui permettent de continuer à travailler sur le long terme. En soutenant des salaires plus élevés et un meilleur traitement et en apaisant l'insécurité économique, nous renforcerons la stabilité sociale et les fondements de l'industrie."
 JAP_redistribution_modifier: "$JAP_redistribution$"
 JAP_redistribution_modifier_desc: "$JAP_redistribution_desc$"
 JAP_leading_disarmament_idea: "$JAP_leading_disarmament$"
 JAP_leading_disarmament_idea_desc: "$JAP_leading_disarmament_desc$"
 JAP_leading_disarmament_idea_3: "Développement en tant que nation pacifique"
 JAP_leading_disarmament_idea_3_desc: "Nous clarifierons une voie nationale qui ne repose pas sur la puissance militaire et réorienterons ressources et talents vers le développement civil. En privilégiant le renforcement de notre base industrielle et des fonctions urbaines et en accélérant la construction d'industries civiles et de quartiers de bureaux, nous relèverons le niveau de vie et porterons la croissance économique."
 JAP_prioritizing_order_modifier: "$JAP_prioritizing_order$"
 JAP_prioritizing_order_modifier_desc: "$JAP_prioritizing_order_desc$"
 JAP_strengthening_cabinet_modifier: "$JAP_strengthening_cabinet$"
 JAP_strengthening_cabinet_modifier_desc: "$JAP_strengthening_cabinet_desc$"
 JAP_regulatory_reform_modifier: "Réforme réglementaire et stratégie de croissance"
 JAP_regulatory_reform_modifier_desc: "Nous renforcerons la compétitivité intérieure et ferons basculer vers un système capable de soutenir une croissance stable. En réduisant les contraintes sur l'activité des entreprises, nous harnesserons le dynamisme privé pour faire avancer l'industrie et l'emploi."
 JAP_patriotic_education_modifier: "$JAP_patriotic_education$"
 JAP_patriotic_education_modifier_desc: "$JAP_patriotic_education_desc$"
 JAP_strengthen_military_idea: "$JAP_strengthen_military_power$"
 JAP_strengthen_military_idea_desc: "$JAP_strengthen_military_power_desc$"
 JAP_jsdf_international_missions_idea1a: "Fondement institutionnel des missions de coopération internationale"
 JAP_jsdf_international_missions_idea1a_desc: "Le développement du cadre juridique et des normes opérationnelles nécessaires aux missions de coopération internationale a avancé. Les procédures de déploiement outre-mer et les normes de réponse pendant les missions devenant plus claires, la stabilité des opérations de force et la cohérence de la décision sur le terrain s'améliorent."
 JAP_constitutional_debate_idea: "Intensification du débat constitutionnel"
 JAP_constitutional_debate_idea_desc: "Un glissement majeur de la politique de sécurité a ébranlé des hypothèses longtemps tenues sur l'ordre d'après-guerre. Tandis que le soutien au renforcement de la défense nationale croît, l'opposition de ceux qui s'inquiètent du recul du pacifisme reste forte, et le conflit au sein de la société et de la sphère politique s'intensifie."
 JAP_f15_programe: "Programme de modernisation des F-15"
 JAP_submarine_modernization_idea: "Programme de modernisation des sous-marins"
 JAP_carrier_aviation: "Restauration de porte-avions"
 JAP_keen_sword_operation_idea: "Exercices d'épée vifs"
 JAP_defense_technology_agency1: "Agence Nippon des technologies de défense"
 JAP_defense_technology_agency1_desc: "L'Agence japonaise de technologie de défense coordonne recherche, développement et acquisition à travers l'industrie, l'université et les forces armées. En unifiant les projets avancés sous une seule vision stratégique, le Japon accélère l'innovation, réduit les doublons et garantit que les technologies de pointe atteignent plus vite les unités de première ligne."
 JAP_diplomacy_modifier: "La diplomatie japonaise"
 JAP_diplomacy_modifier_desc: "Le Japon met l'accent sur les liens bilatéraux avec des nations clés, renforçant la coopération dans l'économie, la sécurité et la culture. Par des partenariats pragmatiques fondés sur l'intérêt, le Japon renforce sa présence sur la scène mondiale."
 JAP_chiang_mai_initiative: "Initiative de Chiang Mai"
 JAP_chiang_mai_initiative_desc: "Avec l'élargissement des arrangements de swap de devises avec le Japon, les États membres de l'ASEAN renforcent leur résilience aux crises financières, améliorant stabilité économique et autonomie."
 JAP_quantitative_oda_idea: "Investissement japonais d'APD dans les infrastructures"
 JAP_quantitative_oda_idea_desc: "L'aide publique au développement du Japon a accéléré le développement d'infrastructures telles que transports, ports et électricité. Ce soutien sert de fondement vital à la croissance économique de notre nation."
 JAP_qualitative_oda_idea: "APD japonaise pour le capital humain et l'innovation"
 JAP_qualitative_oda_idea_desc: "La coopération avec le Japon a apporté des progrès significatifs en éducation, développement des ressources humaines et recherche. Renforcer la capacité des entreprises et institutions locales ouvre la voie à un développement durable."
 JAP_security_south_china_sea_idea: "Engagement japonais pour la stabilité maritime"
 JAP_security_south_china_sea_idea_desc: "L'engagement neutre du Japon dans la sécurité maritime en mer de Chine méridionale a aidé à apaiser les tensions régionales et à protéger la liberté de navigation. Il sert de présence stabilisatrice fiable pour notre région."
 JAP_jap_education: "Programme d'échanges éducatifs Japon-États-Unis"
 JAP_jap_education_desc: "Un programme éducatif hybride combinant la discipline japonaise et l'esprit d'entreprise américain est expérimenté. Cet apprentissage mutuel des forces fournit un stimulus précieux au développement des générations futures."
 JAP_jap_education_culture: "Coopération culturelle et éducative nippo-américaine"
 JAP_jap_education_culture_desc: "Un partenariat plus complet émerge entre le Japon et les États-Unis, s'étendant au-delà de la pop culture et des technologies de pointe. Le développement des ressources humaines s'est approfondi par une fusion de l'éducation japonaise centrée sur la discipline et de l'éthos américain porté par la créativité. La synergie d'affinité culturelle et de collaboration scientifique favorise à la fois la stabilité sociétale et l'élan d'innovation."
 JAP_dual_use_idea: "Coopération nippo-américaine de recherche à double usage"
 JAP_dual_use_idea_desc: "La coopération entre le Japon et les États-Unis dans les technologies à double usage est renforcée. Un développement accéléré et un savoir-faire partagé promettent une plus grande compétitivité future dans les champs civil et militaire."
 JAP_disaster_countermeasure_cooperation_idea: "Amélioration de la résilience aux catastrophes grâce à la coopération"
 JAP_disaster_countermeasure_cooperation_idea_desc: "Par la coopération en réponse aux catastrophes avec le Japon, Taïwan a considérablement renforcé sa capacité à affronter les urgences. L'échange de connaissances et les programmes d'entraînement conjoints devraient réduire les dégâts et accélérer le redressement."
 JAP_tai_high_technology_idea: "Partenariat technologique avancé Japon-Taïwan"
 JAP_tai_high_technology_idea_desc: "La recherche conjointe avec le Japon accélère l'innovation dans les secteurs technologiques civils de Taïwan. Ressources de recherche partagées et collaboration internationale renforcent la compétitivité industrielle."
 JAP_tai_international_student_idea: "Échange de la prochaine génération avec le Japon"
 JAP_tai_international_student_idea_desc: "L'élargissement des possibilités d'études au Japon permet à davantage d'étudiants taïwanais de gagner des expériences académiques diverses. Cela favorise le développement de futurs dirigeants des relations Japon-Taïwan et élargit les perspectives internationales."
 JAP_chi_kor_intellectual_platform: "Plateforme de dialogue sur la mémoire de l'Asie de l'Est"
 JAP_chi_kor_intellectual_platform_desc: "Avec le soutien des Nations unies, le Japon, la Chine et la Corée du Sud ont lancé une plateforme intellectuelle conjointe pour préserver les mémoires historiques et approfondir la compréhension mutuelle. Cette initiative marque un nouveau cadre international qui équilibre réflexion historique et coopération tournée vers l'avenir."
 JAP_chi_trade_support_idea: "Harmonisation internationale des systèmes commerciaux"
 JAP_chi_trade_support_idea_desc: "Avec le soutien technique et institutionnel du Japon, la Chine fait avancer le développement de systèmes commerciaux alignés sur les normes internationales. Des réformes telles que des procédures douanières simplifiées et des révisions juridiques contribuent à la modernisation institutionnelle."
 JAP_chi_advancement_companies_idea: "Intégration industrielle renforcée avec le Japon"
 JAP_chi_advancement_companies_idea_desc: "L'expansion mutuelle des entreprises japonaises et chinoises rationalise les réseaux de production et approfondit l'interdépendance économique entre les deux nations."
 JAP_chi_kanji_idea: "Coopération sino-japonaise dans le domaine culturel"
 JAP_chi_kanji_idea_desc: "Par la coopération culturelle avec le Japon, la Chine renforce les échanges au sein de la « sphère culturelle des caractères sino-japonais » partagée. Cela contribue à un soft power renforcé et à une image internationale plus favorable."
 JAP_chi_temple_idea: "Préservation conjointe du patrimoine bouddhiste"
 JAP_chi_temple_idea_desc: "En préservant et restaurant conjointement temples bouddhistes et biens culturels avec le Japon, la Chine réaffirme la valeur de son héritage religieux tout en promouvant le tourisme."
 JAP_kor_accelerator_idea: "Coopération sur les accélérateurs Tokyo-Séoul"
 JAP_kor_accelerator_idea_desc: "Le cadre de soutien aux start-up établi conjointement entre Séoul et Tokyo nourrit la prochaine génération d'entrepreneuriat et renforce la coopération technologique interurbaine."
 JAP_kor_local_companies_idea: "Programme d'échanges d'entreprises locales"
 JAP_kor_local_companies_idea_desc: "Par les échanges d'affaires entre entreprises locales de Corée et du Japon, les économies régionales se revitalisent et de nouveaux réseaux industriels privés se forment."
 JAP_kor_aging_idea: "Groupe de travail conjoint sur la société vieillissante"
 JAP_kor_aging_idea_desc: "Pour affronter le défi partagé du vieillissement des populations, une task force conjointe d'experts coréens et japonais a été formée pour échanger des enseignements de politique et renforcer les mesures de protection sociale."
 JAP_sov_logistics_corridor_idea: "Japon Russie Réseau logistique eurasien"
 JAP_sov_logistics_corridor_idea_desc: "Par la coopération avec le Japon, le développement du corridor logistique reliant le Japon et l'Europe via la Russie est en cours. Modernisations d'infrastructure et lien économique renforcent la signification géopolitique de la Russie."
 JAP_sov_it_corridor_idea: "Initiative de connectivité numérique Japon-Russie"
 JAP_sov_it_corridor_idea_desc: "Avec le soutien du Japon, la Russie élargit son infrastructure informatique. Le partenariat nippo-russe vise à bâtir un large corridor numérique et à établir un fondement pour l'échange mondial d'information."
 JAP_territorial_disputes1: "Gains politiques des négociations territoriales"
 JAP_territorial_disputes1_desc: "Un certain degré de progrès ayant été accompli dans les questions territoriales de longue date, les tensions dans les eaux environnantes se sont quelque peu apaisées, et un sentiment de soulagement se répand aussi dans l'opinion intérieure. La réduction de l'incertitude diplomatique a également un effet positif sur l'activité économique des régions côtières, soutenant l'assiette fiscale liée à la pêche par l'amélioration des conditions d'exploitation."
 JAP_monarchist_shipbuilding_idea: "Campagne de construction navale impériale"
 JAP_monarchist_shipbuilding_idea_desc: "L'Empire reviendra à la mer comme à son domaine naturel. Sous une poussée impériale de construction navale, les chantiers sont élargis, les contrats centralisés et la production poussée à un tempo de guerre soutenu jusqu'à ce que la flotte égale l'ambition du Japon. Posées au nom de l'Empereur, les mers appartiennent à l'Empire !"
 JAP_monarchist_shipbuilding_idea_tt: "§RCet esprit national sera retiré lorsque vous serez§! §Y$naval_power_of_the_continent$§!"
 JAP_restoring_imperial_household_idea: "Restaurer la Maison impériale"
 JAP_restoring_imperial_household_idea_desc: "La Maison impériale est reconstruite comme institution d'État, non comme cour décorative. Ses offices sont élargis, ses protocoles formalisés, et son influence restaurée par des nominations qui lient ministères et société plus près du Trône. La maison de l'Empereur fonctionnera de nouveau comme le moteur silencieux de la cohésion et de la direction nationales."
 JAP_once_millennium_disaster: "Une catastrophe millénaire"
 JAP_once_millennium_disaster_desc: "Le Grand séisme de l'est du Japon du 11 mars 2011 demeure l'une des catastrophes les plus dévastatrices de l'histoire japonaise moderne. Le séisme et le tsunami ont brisé infrastructures, industries et moyens d'existence en un instant, plongeant la nation dans un grave tumulte. Le chemin du redressement sera long et ardu, exigeant d'énormes ressources et du temps."
 JAP_scars_earthquake_and_tsunami: "Cicatrices du séisme et du tsunami"
 JAP_scars_earthquake_and_tsunami_desc: "Le Grand séisme de l'est du Japon et son tsunami dévastateur ont infligé des dégâts catastrophiques aux villes, ports et communautés côtières de la région du Tōhoku. Infrastructures et installations industrielles ont été détruites, minant gravement la productivité et les moyens d'existence locaux. Le redressement prendra des années et exigera d'immenses ressources et efforts."
 JAP_scars_earthquake: "Cicatrices du séisme"
 JAP_scars_earthquake_desc: "Les secousses du Grand séisme de l'est du Japon ont aussi frappé la région de Kantō, affectant lourdement les réseaux de transport et perturbant une partie de la base industrielle. Même la zone capitale a connu un recul temporaire de l'activité économique. Bien que la dévastation ne soit pas aussi grave qu'au Tōhoku, le redressement exige encore un temps et un effort considérables."
 JAP_focus_renewable_energy_idea: "Privilégier les énergies renouvelables"
 JAP_focus_renewable_energy_idea_desc: "Les préoccupations de sûreté nucléaire nous ont conduits à prioriser l'énergie renouvelable, renforçant solaire, éolien et efficacité. Le soleil et le vent ne peuvent être soumis à un embargo, mais l'intermittence et les limites du réseau demeurent."
 JAP_focus_energy_TT: "Dépenses supplémentaires : §R0,01 %§! du PIB"
 JAP_focus_thermal_power_idea: "Privilégier les centrales à combustibles fossiles"
 JAP_focus_thermal_power_idea_desc: "Choisir les centrales à combustibles fossiles assure une production stable et un approvisionnement immédiat, surtout pour combler le vide des réacteurs à l'arrêt. Chaque cargaison se paie en devises, et la facture d'électricité des ménages porte la différence."
 JAP_anxiety_nuclear_power: "Inquiétude publique face au nucléaire"
 JAP_anxiety_nuclear_power_desc: "Le choc de l'accident de Fukushima Daiichi a répandu peur et défiance vis-à-vis de l'énergie nucléaire. L'opinion publique reste méfiante, et toute décision de redémarrage se heurte à une résistance persistante."
 JAP_shut_down_nuclear_plants: "Fermer toutes les centrales nucléaires"
 JAP_shut_down_nuclear_plants_desc: "En décidant d'arrêter le nucléaire, le gouvernement a répondu directement à l'anxiété publique. La voie est plus coûteuse à court terme et plus sûre à long terme. Aucune vague au large ne menacera un second Fukushima."
 JAP_nuclear_strict_examination: "Normes de sûreté nucléaire renforcées"
 JAP_nuclear_strict_examination_desc: "En réponse à l'accident, réglementations et examens ont été drastiquement renforcés. Les centrales cherchant à redémarrer doivent passer les normes les plus strictes du monde. Le travail est lent et énormément coûteux, et c'est la seule voie vers une flotte en service."
 JAP_continue_nuclear_plants: "Poursuivre la production d'électricité nucléaire"
 JAP_continue_nuclear_plants_desc: "Le gouvernement a choisi de maintenir le nucléaire, mais le souvenir de l'accident demeure. Les réacteurs redémarrent sous des normes durcies, et le public reste partagé entre sécurité énergétique et peur persistante."
 JAP_crown_centered: "Résurgence de la pensée impériale"
 JAP_crown_centered_desc: "À la suite des propos du Premier ministre Mori, la rhétorique traditionaliste et monarchiste a gagné du terrain. Le Trône redevient un pôle de légitimité, et la politique nationale se réordonne autour de la Maison impériale."
 JAP_monarchist_modifier: "Règle impériale"
 JAP_monarchist_modifier_desc: "Le Trône est revenu au commandement, et l'État se meut désormais par mandat impérial plutôt que par marchandage partisan. La Maison, le Conseil privé et le cabinet de guerre lient ministères et forces armées à une seule ligne stratégique."
 JAP_airforce_modifier: "[JAP_airforce_name]"
 JAP_article9_modifier: "Article 9"
 JAP_defense_industry: "Réseau de défense Kyōdō"
 JAP_defense_industry_2: "Réseau de défense Kyōdō"
 JAP_landforce_modifier: "[JAP_landforces_name]"
 JAP_navy_modifier: "[JAP_navy_name]"
 JAP_navy_modifier_2: "[JAP_navy_name]"
 JAP_japanese_tech_agency_tt: "[JAP_defense_technology_idea_desc]\n"
 JAP_military_decision_category: "Militaires [JAP.GetAdjectiveCap]"
 JAP_consolidate_national_defense_framework_mission: "Consolider le cadre de défense nationale"
 JAP_consolidate_national_defense_framework_mission_desc: "La transition vers une posture de défense plus large a créé de l'incertitude dans les structures de commandement et les responsabilités. Cette mission vise à consolider le cadre jusqu'à ce que la nouvelle doctrine soit pleinement opérationnelle."
 JAP_modernize_joint_command_mission: "Moderniser les structures de commandement interarmées"
 JAP_modernize_joint_command_mission_desc: "Intégrer terre, mer, air et domaines émergents en un commandement interarmes unifié exige du temps, de l'entraînement et une doctrine partagée. Cette mission suit la modernisation jusqu'à ce que les pénalités d'expérience s'estompent."
 JAP_asteroid_mining_light_operation: "Enquête céleste légère"
 JAP_asteroid_mining_light_operation_desc: "Le Japon mène une enquête d'astéroïdes à petite échelle, invoquant la guidance des kami ancestraux. Sondes et démonstrateurs miniers testent l'extraction en espace proche."
 JAP_asteroid_mining_medium_operation: "Mission d'extraction divine moyenne"
 JAP_asteroid_mining_medium_operation_desc: "Une expédition plus vaste s'aventure plus profondément dans la ceinture d'astéroïdes, s'appuyant sur une symbolique mythique. La portée et le rendement s'accroissent, ainsi que le risque et le coût."
 JAP_asteroid_mining_heavy_operation: "Expédition minière céleste lourde"
 JAP_asteroid_mining_heavy_operation_desc: "Une exploitation minière d'astéroïdes à grande échelle est lancée, faisant écho aux récits de forges célestes, tandis que le Japon s'efforce de récupérer de riches ressources célestes."
 JAP_mars_mission_program_mission: "Colonie martienne établie"
 JAP_restore_guarantee: "Demander le rétablissement des garanties de sécurité américaines"
 JAP_restore_guarantee_desc: "Les tensions régionales montant et les doutes sur notre sécurité à long terme croissant, nous chercherons à restaurer les garanties de sécurité et à rassurer partenaires et population."
 JAP_remove_american_blockade: "Demander la fin de la pression navale américaine"
 JAP_remove_american_blockade_desc: "La présence navale américaine accrue autour de nos voies maritimes clés est devenue une source de friction. Nous chercherons à lever ce blocus de fait et à rétablir la liberté de navigation autour de nos côtes."
 JAP_restore_trade_relations: "Chercher la normalisation du commerce avec les États-Unis"
 JAP_restore_trade_relations_desc: "Les tarifs et mesures commerciales ciblées imposés par les États-Unis nuisent à nos exportations et à nos chaînes d'approvisionnement. Nous chercherons à normaliser le commerce et à rétablir un accès prévisible aux marchés américains."
 JAP_chinese_agression_five: "Agression chinoise croissante"
 JAP_chinese_agression_five_desc: "Les actions chinoises récentes dans la région ont soulevé des préoccupations parmi nos planificateurs de défense. La pression s'accroît, et Tokyo doit durcir sa posture."
 JAP_chinese_agression_ten: "Intensification de la pression chinoise"
 JAP_chinese_agression_ten_desc: "La Chine a intensifié sa pression militaire et géopolitique dans la région. Patrouilles, manœuvres et assertions contestent l'équilibre. Le Japon renforcera la dissuasion."
 JAP_chinese_agression_twelve: "Activités chinoises alarmantes"
 JAP_chinese_agression_twelve_desc: "Les dernières actions de Pékin marquent une escalade préoccupante. Les rapports de renseignement indiquent une posture plus agressive. Tokyo élargira ses options opérationnelles."
 JAP_chinese_agression_fourteen: "Graves provocations chinoises"
 JAP_chinese_agression_fourteen_desc: "La Chine a pris plusieurs mesures agressives qui dépassent la pression de routine. Les planificateurs stratégiques recommandent de durcir la défense et d'élargir l'interprétation de l'article 9."
 JAP_chinese_agression_sixteen: "Dangereuse escalade chinoise"
 JAP_chinese_agression_sixteen_desc: "La situation régionale devient de plus en plus périlleuse. Les manœuvres militaires chinoises se multiplient. Le Japon doit prendre des mesures concrètes de dissuasion."
 JAP_chinese_agression_eighteen: "Pression militaire chinoise critique"
 JAP_chinese_agression_eighteen_desc: "La posture agressive de la Chine a atteint un point critique. Des zones maritimes clés sont contestées. Tokyo durcira sa posture de défense et élargira les options sous l'article 9."
 JAP_chinese_agression_twenty: "Grave crise régionale : l’agression chinoise atteint son paroxysme"
 JAP_chinese_agression_twenty_desc: "La situation est devenue une crise régionale à part entière. La Chine s'est engagée dans une pression militaire étendue. Le Japon doit désormais envisager des mesures extraordinaires."
 JAP_world_tension_high: "Réviser la posture de sécurité"
 JAP_world_tension_high_desc: "L'instabilité mondiale croissante exige que le Japon réévalue ses politiques défensives et durcisse sa posture."
 JAP_world_tension_high2: "Se préparer aux contingences régionales"
 JAP_world_tension_high2_desc: "Le monde devient de plus en plus dangereux. Le Japon doit prendre des mesures concrètes pour renforcer la dissuasion et la préparation."
 JAP_world_tension_high3: "Activer les mesures de sécurité nationale"
 JAP_world_tension_high3_desc: "Les tensions mondiales ont atteint un niveau critique. Le Japon doit désormais envisager des mesures extraordinaires de défense."
 JAP_article_nine_protests_appeal: "Répondre aux manifestations prodéfense"
 JAP_article_nine_protests_appeal_desc: "De vastes manifestations pro-défense exigent des capacités militaires plus fortes et une interprétation plus dure de l'article 9."
 JAP_article_nine_protests_appeal_tt: "§YForce des protestations§! est d'au moins §R50§!"
 JAP_article_nine_protests_appeal_tt2: "[JAP.GetName] n'a pas la §Yloi militaire souhaitée§!"
 JAP_article_nine_military_parties: "S'appuyer sur les partis pro-militaires"
 JAP_article_nine_military_parties_desc: "Les partis pro-militaires au sein du gouvernement poussent à une défense nationale plus forte. Nous pouvons nous appuyer sur eux pour avancer l'interprétation de l'article 9."
 JAP_article_nine: "Article 9 Interprétation"
 JAP_article_nine_left_side: "Pacifisme strict"
 JAP_article_nine_level_one: "Niveau I : Interprétation pacifiste"
 JAP_article_nine_level_two: "Niveau II : Interprétation défensive"
 JAP_article_nine_level_three: "Niveau III : défense coopérative"
 JAP_article_nine_level_four: "Niveau IV : autodéfense collective"
 JAP_article_nine_level_five: "Niveau V : rôle militaire élargi"
 JAP_article_nine_right_side: "Défense active"
 JAP_great_east_japan_earthquake_decision: "Voie de la reconstruction"
 JAP_great_east_japan_earthquake_decision_desc: "Le 11 mars 2011, le Grand séisme de l'est du Japon a frappé la nation avec une force inédite. La reconstruction exigera des années d'effort coordonné."
 JAP_tohoku_infrastructure_decision: "Reconstruction des infrastructures du Tōhoku"
 JAP_tohoku_infrastructure_decision_desc: "Pas à pas, nous devons reconstruire l'infrastructure dévastée par le séisme. Restaurer routes, chemins de fer et ports du Tōhoku est le premier pas vers le redressement."
 JAP_kanto_infrastructure_decision: "Reconstruction des infrastructures du Kantō"
 JAP_kanto_infrastructure_decision_desc: "Pas à pas, nous devons reconstruire l'infrastructure dévastée par le séisme. Restaurer les réseaux de transport du Kantō est essentiel à la stabilité nationale."
 JAP_tohoku_communication_decision: "Rétablir les télécommunications dans le Tohoku"
 JAP_tohoku_communication_decision_desc: "L'infrastructure de télécommunications dévastée par la catastrophe est vitale pour le redressement. Restaurer le réseau du Tōhoku ramènera espoir et activité."
 JAP_kanto_communication_decision: "Rétablir les télécommunications dans le Kanto"
 JAP_kanto_communication_decision_desc: "L'infrastructure de télécommunications dévastée par la catastrophe est vitale pour le redressement. Restaurer le réseau du Kantō ramènera espoir et activité."
 JAP_tohoku_industrial_recovery_decision: "Redynamiser l'industrie du Tohoku"
 JAP_tohoku_industrial_recovery_decision_desc: "Faire renaître les industries locales arrêtées par la catastrophe est essentiel au redressement économique. Restaurer emplois et capacité de production au Tōhoku."
 JAP_kanto_industrial_recovery_decision: "Redynamiser l'industrie du Kanto"
 JAP_kanto_industrial_recovery_decision_desc: "Faire renaître les industries locales arrêtées par la catastrophe est essentiel au redressement économique. Restaurer emplois et capacité de production au Kantō."
 JAP_domestic_policy_decision: "[JAP.GetFlag]Décisions de politique intérieure [JAP.GetAdjective]"
 JAP_focus_renewable_energy_decision: "Privilégier les énergies renouvelables"
 JAP_focus_renewable_energy_decision_desc: "Au lendemain des préoccupations croissantes sur la sûreté du nucléaire, un plus grand investissement dans le solaire, l'éolien et l'efficacité s'impose."
 JAP_focus_thermal_power_decision: "Privilégier les centrales à combustibles fossiles"
 JAP_focus_thermal_power_decision_desc: "Parmi les préoccupations de sûreté nucléaire, élargir les centrales à charbon, pétrole et gaz naturel assure une production stable et un approvisionnement immédiat."
 JAP_saudi_aramco_crude_storage: "Stockage de brut de Saudi Aramco"
 JAP_saudi_aramco_crude_storage_desc: "Sécuriser un stockage de brut dédié via Saudi Aramco afin de stabiliser l'approvisionnement et de réduire l'exposition à une fermeture du détroit d'Ormuz."
 JAP_overseas_upstream_equity: "Acheter les puits à la source"
 JAP_overseas_upstream_equity_desc: "INPEX, explorateur phare de la nation, et les financiers d'État de JOGMEC prennent des participations dans des champs d'Abou Dabi à l'Extrême-Orient russe, isolant le pays des caprices du marché spot. Chaque baril tiré d'un puits japonais est un baril qu'aucun rival ne peut retenir. La propriété est l'approvisionnement le plus sûr."
 JAP_kosaka_tsl_furnace: "Agrandissement du four Kosaka TSL"
 JAP_kosaka_tsl_furnace_desc: "Le traitement est aussi stratégique que l'extraction. Nous élargirons le four TSL de Kosaka pour récupérer métaux précieux et terres rares des déchets électroniques."
 JAP_green_ship_recycling: "Recyclage de navires verts"
 JAP_green_ship_recycling_desc: "Une flotte ne se construit pas seulement, elle se démantèle, et l'acier doit revenir à la nation. Nous développerons un recyclage naval vert pour fermer la boucle."
 JAP_bibi_world_decision: "Construction de la fonderie Rapidus IIM-1 « Bibi World »"
 JAP_bibi_world_decision_desc: "Accélérer la construction de la fonderie Rapidus IIM-1 « Bibi World » pour sécuriser la prochaine génération de puces au pays."
 JAP_yufutsu_oil_expansion_decision: "Expansion pétrolière de Yufutsu"
 JAP_yufutsu_oil_expansion_decision_desc: "Élargir le champ de Yufutsu pour renforcer l'approvisionnement intérieur et réduire l'exposition aux importations."
 JAP_toray_expansion_program_decision: "Programme d'expansion de Toray"
 JAP_toray_expansion_program_decision_desc: "Accroître la production de matériaux avancés de Toray pour renforcer la base industrielle japonaise là où cela compte le plus."
 JAP_teijin_aerospace_prepreg_decision: "Préimprégné Teijin Aerospace"
 JAP_teijin_aerospace_prepreg_decision_desc: "Élargir la capacité de préimprégné aérospatial de Teijin pour sécuriser l'épine dorsale composite des cellules et missiles de prochaine génération."
 JAP_demand_south_kuril: "Exiger les Kouriles du Sud"
 JAP_demand_south_kuril_desc: "Tokyo adressera une exigence formelle de retour des Kouriles du Sud. Moscou devra choisir entre céder et risquer l'escalade."
 JAP_demand_north_kuril: "Exiger les Kouriles du Nord"
 JAP_demand_north_kuril_desc: "Le Japon exigera le retour des Kouriles du Nord dans le cadre d'une revendication impériale plus large. Si Moscou refuse, Tokyo décidera jusqu'où aller."
 JAP_demand_sakhalin: "Exigez Sakhaline"
 JAP_demand_sakhalin_desc: "Le Japon exigera le retour de Sakhaline. Si le gouvernement soviétique rejette l'exigence, Tokyo devra choisir entre raid, guerre ou recul."
 JAP_peaceout_russia: "Faire la paix avec la Russie"
 JAP_peaceout_russia_desc: "Nous forcerons un règlement avec la Russie pour mettre fin à la guerre selon nos termes et sécuriser ce que nous avons pris."
 JAP_claiming_south_korea: "Affirmer une revendication sur la Corée"
 JAP_claiming_south_korea_desc: "Nous cadrerons la Corée comme une affaire de sécurité japonaise et de prérogative historique, posant les revendications qui précèdent un protectorat."
 JAP_claiming_north_korea: "Définir la question nord de la Corée"
 JAP_claiming_north_korea_desc: "Le régime de Pyongyang n'est pas un voisin, c'est une crise permanente qui menace nos côtes. Nous poserons des revendications et un levier pour le lier sous la main de Tokyo."
 JAP_claiming_taiwan: "Réaffirmer notre mandat sur Taïwan"
 JAP_claiming_taiwan_desc: "Taïwan se tient à la charnière de la première chaîne d'îles et à la gorge de nos voies maritimes. Nous poserons des revendications et un cadre de protectorat qui lie l'île à la direction de Tokyo."
 JAP_claiming_malaysia: "Affirmer une revendication sur la Malaisie"
 JAP_claiming_malaysia_desc: "La Malaisie se tient à cheval sur des détroits et des routes d'approvisionnement qui décident du flux de la région. Nous revendiquerons une prérogative japonaise sur ces eaux et ces terres."
 JAP_claiming_indonesia: "Revendiquer un mandat en Indonésie"
 JAP_claiming_indonesia_desc: "L'Indonésie contrôle les îles et les goulets qui lient l'océan Indien et le Pacifique. Nous poserons des revendications sur cet archipel comme clé de notre sphère maritime."
 JAP_claiming_vietnam: "Déclarer notre intérêt au Viêt Nam"
 JAP_claiming_vietnam_desc: "Le Viêt Nam ancre le bord de la mer de Chine méridionale et offre des bases qui peuvent façonner l'équilibre régional. Nous déclarerons un intérêt japonais et poserons les revendications qui s'ensuivent."
 JAP_claiming_cambodia: "Étendre la sphère au Cambodge"
 JAP_claiming_cambodia_desc: "Le Cambodge est petit, mais la géographie en fait un corridor, un tampon et un levier en Indochine. Nous étendrons la sphère et poserons des revendications."
 JAP_claiming_laos: "Revendiquer l'hinterland du Mékong"
 JAP_claiming_laos_desc: "Le Laos contrôle routes terrestres, rivières et la profondeur tranquille derrière la côte. Nous revendiquerons l'hinterland du Mékong comme partie de notre sphère."
 JAP_claiming_australia: "Déclarer une revendication sur l'Australie"
 JAP_claiming_australia_desc: "L'Australie est l'ancre sud du Pacifique, un continent qui peut accueillir flottes, puissance aérienne et la logistique des guerres longues. Nous poserons des revendications sur cet ancre."
 JAP_claiming_new_zealand: "Revendiquer les avant-gardes du Sud"
 JAP_claiming_new_zealand_desc: "La Nouvelle-Zélande peut être lointaine, mais elle se tient sur des routes qui importent quand le Pacifique devient un théâtre. Nous revendiquerons les avant-gardes du Sud."
 JAP_claiming_myanmar: "Affirmer le contrôle de la porte de l'Irrawaddy"
 JAP_claiming_myanmar_desc: "Le Myanmar est un pont terrestre entre océans et une porte vers l'intérieur de la région. Nous affirmerons le contrôle de la porte de l'Irrawaddy."
 JAP_demand_palau: "Demander aux Palaos"
 JAP_demand_palau_desc: "Palaos est une petite chaîne à grande empreinte dans la planification navale, offrant mouillage, surveillance et accès. Nous exigerons Palaos."
 JAP_demand_micronesia: "Demande Micronésie"
 JAP_demand_micronesia_desc: "La Micronésie s'étend à travers le Pacifique central comme des pas japonais pour flottes et aviation. Nous exigerons la Micronésie."
 JAP_demand_nauru: "Demander Nauru"
 JAP_demand_nauru_desc: "Nauru est minuscule, mais des îles comme celle-ci décident de la couverture de surveillance et de l'accès à travers le Pacifique. Nous exigerons Nauru."
 JAP_demand_kiribati: "Exiger Kiribati"
 JAP_demand_kiribati_desc: "Kiribati s'étend à travers des approches clés qui peuvent soutenir reconnaissance, ravitaillement et présence. Nous exigerons Kiribati."
 JAP_demand_marshall_islands: "Exiger les îles Marshall"
 JAP_demand_marshall_islands_desc: "Les îles Marshall offrent de l'espace pour aérodromes, logistique et contrôle sur le Pacifique central. Nous les exigerons."
 JAP_demand_tuvalu: "Demander Tuvalu"
 JAP_demand_tuvalu_desc: "Tuvalu offre peu de terre, mais elle offre une présence, et la présence décide du contrôle des mers. Nous exigerons Tuvalu."
 JAP_demand_solomon_islands: "Exiger les îles Salomon"
 JAP_demand_solomon_islands_desc: "Les Salomon sont une barrière naturelle et une zone de staging dans le Pacifique sud-ouest, idéales pour flottes et aviation. Nous les exigerons."
 JAP_demand_guinea: "Exiger la Nouvelle-Guinée"
 JAP_demand_guinea_desc: "La Nouvelle-Guinée est un bastion de taille continentale qui domine les approches entre Australie et Pacifique. Nous l'exigerons."
 JAP_demand_vanuatu: "Exiger Vanuatu"
 JAP_demand_vanuatu_desc: "Vanuatu se tient sur des lignes qui importent pour le ravitaillement et la portée dans le Pacifique sud-ouest. Nous exigerons Vanuatu."
 JAP_demand_fiji: "Exiger Fidji"
 JAP_demand_fiji_desc: "Fidji est un pôle central du Pacifique sud, capable de soutenir la logistique de flotte et l'aviation. Nous exigerons Fidji."
 JAP_demand_samoa: "Demander aux Samoa"
 JAP_demand_samoa_desc: "Samoa se tient sur des routes qui relient le Pacifique central aux approches du Sud. Nous exigerons Samoa."
 JAP_demand_tonga: "Demande Tonga"
 JAP_demand_tonga_desc: "Tonga offre un pied stratégique dans le Pacifique sud et une plateforme de surveillance. Nous exigerons Tonga."
 JAP_demand_american_islands: "Exiger les îles américaines"
 JAP_demand_american_islands_desc: "Les îles tenues par les Américains ne sont pas seulement un territoire, ce sont des bases avancées qui projettent la puissance à travers le Pacifique. Nous les exigerons."
 JAP_demand_french_islands: "Exiger les îles françaises"
 JAP_demand_french_islands_desc: "Les possessions insulaires françaises offrent portée, ports et couverture diplomatique à une présence étrangère. Nous les exigerons."
 JAP_demand_british_islands: "Exiger les îles britanniques"
 JAP_demand_british_islands_desc: "Les possessions insulaires britanniques sont des restes d'un ordre plus ancien, mais elles offrent encore ports et accès. Nous les exigerons."
 JAP_imperial_procurement_standardization: "Normalisation impériale des achats"
 JAP_imperial_procurement_standardization_desc: "Centraliser les règles d'acquisition, standardiser les composants et imposer des spécifications communes afin d'accélérer la production et de réduire les coûts."
 JAP_zaibatsu_empowerment_charter: "Charte d'autonomisation de Zaibatsu"
 JAP_zaibatsu_empowerment_charter_desc: "Accorder des privilèges élargis à des conglomérats industriels sélectionnés en échange d'une production de guerre soutenue et d'une loyauté au Trône."
 JAP_neighborhood_associations_system: "Système d'associations de quartier"
 JAP_neighborhood_associations_system_desc: "Reconstruire un réseau national d'associations locales pour enregistrer les foyers, coordonner la distribution et soutenir une mobilisation rapide. Cela renforce le contrôle social et améliore la réactivité de l'État."
 JAP_state_rites_restoration: "Restauration des Rites d’État"
 JAP_state_rites_restoration_desc: "Restaurer les cérémonies d'État et les rites publics comme pilier central de la vie nationale. Cette réforme renforce la légitimité impériale et encourage la conformité publique à l'ordre restauré."
 JAP_national_morals_education_act: "Loi sur la morale nationale et l'éducation"
 JAP_national_morals_education_act_desc: "Standardiser l'éducation civique autour du devoir, du service et de la cohésion nationale. Les écoles serviront à bâtir la discipline, élargir la préparation et favoriser la loyauté à l'État restauré."
 JAP_imperial_rescript_revival: "Renaissance du rescrit impérial"
 JAP_imperial_rescript_revival_desc: "Faire renaître un rescrit impérial officiel pour ancrer la légitimité de l'État et définir les obligations du citoyen. L'ordre restauré sera présenté comme un retour à l'unité, au devoir et au dessein national."
 JAP_north_korean_remilitarized_dmz: "Réagir à l'escalade nord-coréenne dans la zone démilitarisée"
 JAP_north_korean_remilitarized_dmz_desc: "La Corée du Nord a renforcé ses positions le long de la zone démilitarisée. Tokyo invoquera cette escalade pour durcir la posture de sécurité et élargir la latitude opérationnelle sous l'article 9."
 JAP_north_korean_increased_nuclear_testing: "Réagir aux essais nucléaires nord-coréens"
 JAP_north_korean_increased_nuclear_testing_desc: "Un rythme renouvelé d'essais nucléaires a durci l'environnement de menace régionale. Le gouvernement s'en servira pour justifier une interprétation plus stricte de l'article 9 et accélérer les mesures de préparation."
 JAP_north_korean_threats_to_south_korea: "Réagir aux menaces nord-coréennes"
 JAP_north_korean_threats_to_south_korea_desc: "Des menaces directes contre la République de Corée accroissent le risque d'un conflit plus large qui pourrait déborder dans le périmètre de sécurité du Japon. Tokyo peut élargir l'interprétation de l'article 9 et renforcer la planification de dissuasion."
 JAP_north_korean_road_to_war: "Se préparer à la marche nord-coréenne vers la guerre"
 JAP_north_korean_road_to_war_desc: "La situation glisse vers un conflit ouvert. Le Japon ne peut plus s'en remettre à la seule retenue. Une interprétation révisée de l'article 9 permettra une planification militaire plus robuste et des options de réponse plus rapides."
 JAP_russian_agressiveness: "Réagir à l'agressivité russe"
 JAP_russian_agressiveness_desc: "La posture de plus en plus assertive de la Russie en Asie du Nord-Est mine la stabilité régionale. Tokyo utilisera l'environnement de menace accru pour renforcer la dissuasion et élargir la latitude opérationnelle sous l'article 9."
 JAP_defence_russian_asian_ambitions: "Contrer les ambitions asiatiques de la Russie"
 JAP_defence_russian_asian_ambitions_desc: "Les ambitions de Moscou en Asie menacent l'environnement de sécurité du Japon et l'équilibre des puissances dans le Pacifique. Tokyo durcira sa posture de défense et élargira les options opérationnelles sous l'article 9."
 JAP_russian_north_korean_alliance: "Se préparer à un axe Russie–Corée du Nord"
 JAP_russian_north_korean_alliance_desc: "Un alignement plus étroit entre la Russie et la Corée du Nord resserrerait la pression sur le Japon depuis plusieurs directions. Tokyo répondra en renforçant la dissuasion et en desserrant les contraintes restantes sous l'article 9."
 JAP_russian_pacific_naval_presence: "Répondre au renforcement naval russe dans le Pacifique"
 JAP_russian_pacific_naval_presence_desc: "La posture navale de la Russie dans le Pacifique devient plus assertive. Le Japon utilisera ce glissement pour justifier une préparation maritime élargie et une interprétation plus flexible de l'article 9."
 JAP_tookover_sikhalin_mission: "Échéance pour reconquérir les territoires perdus"
 JAP_tookover_sikhalin_mission_desc: "Le temps presse. Si la Russie ne reprend pas les objectifs requis avant l'échéance, la pression internationale et l'épuisement intérieur forceront un règlement. Une paix sera signée, et les territoires perdus seront cédés comme prix de la fin de la guerre."
 JAP_russia_demands_peace_japan: "Un règlement de paix avec la Russie"
 JAP_russia_demands_peace_japan_desc: "Les Kouriles et Sakhaline désormais fermement sous contrôle japonais, Tokyo a avancé une proposition pour mettre fin à la guerre. L'offre est simple et calculée : la paix en échange de la reconnaissance par la Russie de la nouvelle réalité au nord. Ce n'est pas un acte de charité mais un règlement stratégique, sécurisant nos gains tout en épargnant aux deux nations le coût d'un conflit prolongé. L'acceptation mettrait fin à la guerre et formaliserait notre contrôle des territoires pris. Le rejet signalerait que Moscou est prêt à continuer une guerre qu'il n'est plus certain de gagner."
 JAP_russia_demands_peace_russia: "Exiger la paix du Japon"
 JAP_russia_demands_peace_russia_desc: "Nous exigerons un règlement avec le Japon pour mettre fin aux combats et geler la situation avant qu'elle n'empire. Ce n'est pas une réconciliation, c'est du contrôle des dégâts, verrouillant des termes tant que nous avons encore un levier pour forcer un résultat. Si Tokyo refuse, nous saurons qu'ils cherchent la victoire, pas la paix."
 JAP_auto_claiming_tt: "En sélectionnant cette décision, elle se répétera jusqu'à ce que tous les États cœurs soient revendiqués. Vous pourrez alors exiger la soumission."
 JAP_intellectual_platform_decision: "$JAP_intellectual_platform$"
 JAP_intellectual_platform_decision_desc: "$JAP_intellectual_platform_desc$"
 JAP_declining_birthrate_category: "Agence de lutte contre la baisse du taux de natalité"
 JAP_declining_birthrate_category_desc: "La crise démographique du Japon est multiforme : les naissances sont inférieures aux décès, la part des retraités croît chaque année, et la population en âge de travailler se contracte, incapable de se remplacer. Sans action coordonnée, la tension se cascade sur l'offre de travail, la solvabilité des retraites, la stabilité de l'État et la vitalité économique des préfectures rurales. Il n'y a pas de solution miracle unique, seulement une réforme soutenue et d'ensemble répartie sur plusieurs domaines de politique.\n\nLes décisions disponibles ici sont conçues pour fonctionner de concert avec les branches de focus démographiques. Chacune cible une ou plusieurs dimensions de la crise (le déficit de naissances, la pénurie de main-d'œuvre, le seuil de chômage, le fardeau des coûts de santé, le fardeau des coûts sociaux, ou l'érosion de la stabilité) et chaque décision se retire d'elle-même une fois que sa condition cible s'améliore, empêchant le surusage d'un seul levier.\n\n§YLes progrès apparaissent dans l'esprit national §!§G$JAP_demographic_pressure_modifier$§!§Y : à mesure que les focuses démographiques s'achèvent et que les décisions pertinentes sont prises, les pénalités du modificateur s'allègent progressivement vers zéro. Un négligement soutenu permet à la pression de demeurer ou d'empirer, érodant stabilité et capacité économique.§!"
 JAP_territorial_disputes: "Les conflits territoriaux de [JAP.GetNameWithFlag]"
 JAP_territorial_disputes_desc: "[JAP.GetName] est actuellement engagé dans des différends territoriaux avec des pays voisins sur les trois régions suivantes :\n\n§YTerritoires du Nord (Kouriles du Sud)§! : [JAP.GetName] revendique les îles d'Etorofu, Kunashiri, Shikotan et le groupe Habomai, situées au nord-est d'Hokkaidō, arguant que leur occupation par l'Union soviétique après la Seconde Guerre mondiale était illégitime et continue d'en chercher le retour auprès de [SOV.GetName]. [SOV.GetName], de son côté, affirme sa souveraineté sur les îles et maintient le contrôle effectif.\n\n§YTakeshima (nom [KOR.GetAdjective] : Dokdo)§! : Située dans la mer de [JAP.GetName] (mer de l'Est), cette île est revendiquée par [JAP.GetName] mais est sous contrôle effectif de [KOR.GetName] depuis les années 1950. Le différend demeure une question hautement contentieuse entre les deux pays, impliquant interprétations historiques et droits de pêche, et est considéré comme politiquement sensible.\n§YParce que Takeshima est trop petite pour figurer sur la carte, même une négociation réussie n'entraînera pas de gains territoriaux. Vous pourrez toutefois obtenir les modificateurs décrits ci-dessous !§!\n\n§YÎles Senkaku (nom chinois : îles Diaoyu)§! : Ce groupe d'îlots inhabités en mer de Chine orientale est sous le contrôle effectif de [JAP.GetName] depuis 1895, mais est aussi revendiqué par [CHI.GetName] et [TAI.GetName]. Depuis les années 1990, protestations diplomatiques répétées et assertions concurrentes ont fait de la question un point de friction potentiel pour de futures tensions.\n\nTous ces différends sont profondément entrelacés avec l'histoire, le droit international, le contrôle effectif, les relations diplomatiques et l'opinion publique intérieure. Les résoudre exige de favoriser des liens plus étroits et une compréhension mutuelle avec les pays concernés.\n\n§YAstuce : augmenter l'opinion du pays cible ou renforcer votre influence sur lui rendra les négociations plus susceptibles de réussir !§!\n\n§YRécompense :§! Si les négociations réussissent, vous pouvez gagner des modificateurs à §G$MODIFIER_STABILITY_FACTOR$§! et §G$agriculture_district_income_tax_modifier$§!!"
 JAP_territorial_disputes_TT: "Si les négociations réussissent, outre la résolution de la question territoriale, vous pouvez gagner des bonus à §G$MODIFIER_STABILITY_FACTOR$§! et §G$agriculture_district_income_tax_modifier$§!!"
 JAP_dec_negotiations_resolve_northern_territories_dispute: "Négociations pour résoudre le différend des Territoires du Nord"
 JAP_dec_negotiations_resolve_northern_territories_dispute_desc: "La question territoriale des Territoires du Nord demeure l'une des affaires non résolues les plus significatives de la diplomatie d'après-guerre [JAP.GetName]-[SOV.GetName]. Affronter cette question de front et chercher une résolution pacifique est crucial pour restaurer la souveraineté de [JAP.GetName] et assurer la stabilité en Extrême-Orient. Si une confiance mutuelle suffisante et des conditions de négociation sont établies, nous pouvons engager des négociations diplomatiques formelles avec [SOV.GetName] pour demander le retour des territoires."
 JAP_dec_negotiations_resolve_senkaku_dispute_china: "Négociations pour résoudre le différend des îles Senkaku avec [CHI.GetName]"
 JAP_dec_negotiations_resolve_senkaku_dispute_china_desc: "Les revendications territoriales de [CHI.GetName] sur les îles Senkaku sont devenues un facteur de déstabilisation des relations [JAP.GetName]-[CHI.GetName]. En tant que partie exerçant le contrôle effectif des îles, [JAP.GetName] cherche à résoudre cette question diplomatiquement en persuadant [CHI.GetName] de retirer sa revendication. La confiance mutuelle et l'influence internationale nécessaires étant en place, nous sommes désormais prêts à commencer des négociations directes avec [CHI.GetName]."
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan: "Négociations pour résoudre le différend des îles Senkaku avec [TAI.GetName]"
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan_desc: "La revendication territoriale de [TAI.GetName] sur les îles Senkaku est devenue un obstacle potentiel à la confiance mutuelle et à la coopération entre [JAP.GetName] et [TAI.GetName]. Afin d'obtenir la reconnaissance diplomatique du contrôle effectif de [JAP.GetName] sur les îles, nous sommes désormais prêts à entrer en négociations pacifiques avec les autorités [TAI.GetAdjective]."
 JAP_dec_negotiations_resolve_takeshima_dispute: "Négociations pour résoudre le différend de Takeshima"
 JAP_dec_negotiations_resolve_takeshima_dispute_desc: "Le différend territorial avec [KOR.GetName] sur Takeshima a longtemps été un obstacle majeur aux relations [JAP.GetName]-[KOR.GetName]. Notre nation est prête à proposer formellement des négociations territoriales au gouvernement [KOR.GetAdjective], cherchant une résolution par une diplomatie calme et sincère."
 JAP_base_okinawa_decision: "Avenir des forces américaines à Okinawa"
 JAP_base_okinawa_decision_desc: "Okinawa demeure le foyer d'un nombre significatif de bases militaires américaines, impactant à la fois le cadre de sécurité du Japon et les communautés locales.\nLe gouvernement japonais explore désormais des voies pour réévaluer l'arrangement actuel afin de poursuivre une plus grande autonomie de sécurité et de réduire les fardeaux régionaux.\nPar l'engagement diplomatique, un nouvel équilibre dans la relation de sécurité nippo-américaine peut être trouvé.\n\nAstuce : l'§Yinfluence de [JAP.GetName] dans [USA.GetName]§! et l'§Yinfluence de [USA.GetName] dans [JAP.GetName]§! affectent le taux de succès des négociations. De plus, vous pouvez aussi augmenter le taux de succès en §Yrésolvant l'équilibre des pouvoirs sur l'article 9§! ou en §Yportant les dépenses militaires à au moins $defence_04$§!!"
 JAP_negotiation_base_okinawa: "Ouvrir des négociations sur le retrait américain d'Okinawa"
 JAP_negotiation_base_okinawa_desc: "Pour renforcer l'autonomie de sécurité nationale, le Japon engagera des négociations diplomatiques concernant le retrait des forces militaires américaines stationnées à Okinawa. Cette démarche vise à réévaluer les arrangements de sécurité actuels et à explorer un cadre plus adaptable à la lumière de la dynamique régionale évolutive."
 Japan.101.t: "Dissolution postale : mettre notre mandat à l'épreuve"
 Japan.101.d: "Le débat sur la privatisation postale a rencontré une forte résistance à la Diète, et les délibérations deviennent de plus en plus tendues. Même au sein du parti, les voix prudentes et opposées restent fortes : certains arguent que nous devrions avancer par ajustements et révisions, tandis que d'autres insistent que le moment est venu de clarifier la question et de chercher le jugement du public.\nSi nous dissolvons la Chambre des représentants et tenons des élections générales, nous mettrons la réforme elle-même à l'épreuve directe. Dans le même temps, le calendrier politique basculerait rapidement vers une élection, et une tension politique accrue serait inévitable.\n\nDevons-nous avancer vers une dissolution et des élections générales ?"
 Japan.101.a: "Dissoudre la Chambre des représentants."
 Japan.101.b: "Ne pas dissoudre."
 Japan.103.t: "Montée des forces de gauche"
 Japan.103.d: "Parmi la stagnation économique, l'insécurité de l'emploi et les préoccupations croissantes sur la sécurité sociale, l'intérêt monte rapidement pour les forces de gauche qui appellent à une redistribution élargie et un soutien aux moyens d'existence. Comme réceptacle du mécontentement vis-à-vis de la politique établie, le soutien se répand dans diverses régions, et les sondages ont aussi commencé à montrer une croissance notable des partis de gauche. Dans la situation politique à venir, la présence de la gauche deviendra probablement impossible à ignorer."
 Japan.103.a: "Un vent favorable pour les forces libérales"
 Japan.103.b: "Montée des forces sociales-démocrates"
 Japan.103.c: "Présence accrue des forces communistes"
 Japan.103.e: "Montée rapide des forces populistes de gauche"
 Japan.104.t: "Montée des forces de droite"
 Japan.104.d: "Parmi l'anxiété croissante sur l'environnement de sécurité et la défiance montante vis-à-vis de la politique, le soutien se répand pour les forces de droite qui appellent au maintien de l'ordre, à l'autonomie nationale et à un accent sur les valeurs traditionnelles. Ces positions attirent l'intérêt d'un large éventail d'électeurs, et les sondages ont aussi commencé à montrer une croissance notable des partis de droite. Dans la situation politique à venir, la présence de la droite peut encore s'accroître."
 Japan.104.a: "Soutien élargi aux forces conservatrices"
 Japan.104.b: "Montée des forces sociales-démocrates"
 Japan.104.c: "Montée des forces réformistes-conservatrices"
 Japan.104.e: "Soutien élargi aux forces alignées sur la Restauration"
 JAP_diplomacy.01.t: "Ouverture de négociations sur le retrait des troupes américaines d'Okinawa"
 JAP_diplomacy.01.d: "Pendant des décennies, la présence des forces américaines au Japon a été une pierre angulaire du cadre de sécurité d'après-guerre de la nation et de la stabilité régionale. Toutefois, à la lumière de conditions géopolitiques évolutives, de glissements de l'opinion publique et de l'intérêt croissant du Japon à renforcer ses propres capacités de défense, le gouvernement a déterminé qu'il doit réexaminer la présence militaire américaine à Okinawa. Comme premier pas, des négociations formelles avec les États-Unis commenceront désormais."
 JAP_diplomacy.01.a: "Entamer des négociations diplomatiques"
 JAP_diplomacy.02.t: "Demande japonaise de négociations sur le retrait des troupes"
 JAP_diplomacy.02.d: "Le gouvernement japonais a soumis une demande formelle d'entrer en négociations concernant le retrait des forces américaines stationnées à Okinawa. La proposition n'est pas antagoniste par nature mais plutôt cadrée comme partie d'une réévaluation plus large de la posture de défense du Japon et de besoins de sécurité évolutifs. Les États-Unis doivent maintenant considérer comment répondre, équilibrant l'intégrité de l'alliance et les intérêts stratégiques à long terme dans la région."
 JAP_diplomacy.02.a: "Accepter la demande"
 JAP_diplomacy.02.b: "Refuser la demande"
 JAP_diplomacy.03.t: "Accord conclu : les forces américaines se retireront"
 JAP_diplomacy.03.d: "À la suite d'une série de discussions diplomatiques, le Japon et les États-Unis sont parvenus à un accord concernant le retrait des forces américaines d'Okinawa. Cela marque un moment charnière dans l'évolution de la politique de défense du Japon et souligne son désir d'assumer une plus grande responsabilité pour sa propre sécurité. Si cela marque la fin d'un cadre existant, cela offre aussi une occasion de réévaluer la relation nippo-américaine et d'explorer de nouvelles formes de coopération de sécurité pour l'avenir."
 JAP_diplomacy.03.a: "Un nouveau chapitre de la politique de sécurité s'ouvre"
 JAP_diplomacy.04.t: "Échec des négociations : retrait refusé"
 JAP_diplomacy.04.d: "Le gouvernement américain a refusé la demande du Japon de retrait des troupes d'Okinawa. En conséquence, l'arrangement de sécurité existant restera en place. Ce résultat peut provoquer des réactions mitigées au Japon, alimentant potentiellement le débat sur l'autonomie du pays en matière de défense. Le gouvernement japonais doit désormais réévaluer son approche tout en continuant de surveiller le paysage régional et intérieur plus large."
 JAP_diplomacy.04.a: "Il est temps de considérer notre prochain mouvement"
 JAP_diplomacy.05.t: "Vers une mémoire partagée pour l'avenir"
 JAP_diplomacy.05.d: "Le gouvernement japonais a décidé de proposer l'établissement d'une plateforme intellectuelle trilatérale sous médiation de l'ONU, visant à partager les mémoires et leçons des guerres passées et à transmettre une culture de paix aux générations futures. Le projet inclura musées et archives numériques, tous les coûts étant couverts par le Japon. La proposition sera formellement transmise à la Chine et à la Corée du Sud par les canaux diplomatiques."
 JAP_diplomacy.05.a: "Envoyer la proposition"
 JAP_diplomacy.06.t: "Proposition du Japon : partager la mémoire et l'avenir"
 JAP_diplomacy.06.d: "Le gouvernement japonais a proposé, sous médiation de l'ONU, l'établissement d'une plateforme intellectuelle trilatérale avec la Chine et la Corée du Sud pour préserver les mémoires et leçons de la guerre pour les générations futures. L'initiative inclut la construction de musées et d'archives numériques, tous les coûts étant couverts par le Japon. Choisirons-nous une coopération tournée vers l'avenir, ou continuerons-nous à habiter la défiance ? Notre décision façonnera l'avenir de la mémoire en Asie de l'Est."
 JAP_diplomacy.06.a: "Accepter la proposition"
 JAP_diplomacy.06.b: "Rejeter la proposition"
 JAP_diplomacy.08.t: "Lancement d'une plateforme intellectuelle trilatérale"
 JAP_diplomacy.08.d: "La Chine et la Corée du Sud ont toutes deux accepté la proposition. Sous médiation de l'ONU, la plateforme intellectuelle trilatérale a été formellement lancée. Par des musées et archives conjoints, la mémoire et les leçons de la guerre seront désormais transmises aux générations futures. Cela peut marquer un premier pas significatif vers la réconciliation et la compréhension mutuelle."
 JAP_diplomacy.08.a: "Un nouveau pas vers l'avenir"
 JAP_diplomacy.09.t: "La proposition a été rejetée"
 JAP_diplomacy.09.d: "Malheureusement, la plateforme intellectuelle que nous envisagions a été rejetée. Il est clair que la réconciliation exige plus de temps et des efforts continus pour bâtir la confiance."
 JAP_diplomacy.09.a: "Nous devons attendre une autre occasion"
 JAP_news.01.t: "Déclaration de [JAP.GetLeader] : Reconnaître l'histoire"
 JAP_news.01.d: "Aujourd'hui, le gouvernement japonais a publié une déclaration officielle du Premier ministre [JAP.GetLeader], exprimant un profond repentir et des excuses sincères pour la domination coloniale passée du Japon et ses actions de guerre. La déclaration a souligné un engagement sincère à bâtir des relations diplomatiques tournées vers l'avenir et à préserver de façon responsable la mémoire de l'histoire. Le discours a attiré une attention significative tant à l'intérieur qu'à l'étranger, et devrait influencer la diplomatie future en Asie de l'Est."
 JAP_news.01.a: "Notre responsabilité pour l'avenir."
 JAP_news.01.b: "Nous surveillerons de près les développements futurs."
 JAP_diplomacy.34.t: "Proposition d'élargir les accords d'échange de devises"
 JAP_diplomacy.34.a: "Accepter"
 JAP_diplomacy.34.b: "Refuser pour l'instant"
 JAP_diplomacy_34_TT: "§YChaque pays de l'ASEAN qui accepte recevra un modificateur de stabilité et gagnera une §Gopinion favorable§! à notre égard.§!"
 JAP_diplomacy.35.t: "Accord sur un dispositif de swap élargi"
 JAP_diplomacy.35.d: "[FROM.GetName] a accepté la proposition du Japon d'élargir l'arrangement de swap de devises. Cela renforce encore le « filet de sécurité » de soutien de liquidité en temps de crise, accroissant la confiance des marchés et l'efficacité de la coopération régionale. Cet accord est aussi un pas clair vers le renforcement de la confiance dans le Japon au sein de l'ASEAN."
 JAP_diplomacy.35.a: "Bien"
 JAP_diplomacy.36.t: "Proposition refusée"
 JAP_diplomacy.36.d: "[FROM.GetName] a indiqué qu'il refusera la proposition du Japon d'élargir l'arrangement de swap de devises. Cela reflète une préférence à prioriser la clarification des termes de l'accord et des procédures d'exploitation, et n'est pas une critique de la proposition elle-même. Le Japon devrait rester attentif aux circonstances de l'autre pays tout en maintenant ouverts les canaux de dialogue."
 JAP_diplomacy.36.a: "Compris."
 JAP_diplomacy.37.t: "Proposition d'investissement dans les infrastructures essentielles"
 JAP_diplomacy.37.d: "Pour doper la connectivité régionale et la croissance économique, le gouvernement japonais a proposé un investissement APD de grande ampleur dans notre pays, centré sur les infrastructures essentielles telles que réseaux de transport, ports et énergie. Les améliorations des routes, ports et réseaux électriques renforceront les fondements de la logistique et de l'industrie, soutenant directement la croissance de notre pays. Accepter la proposition accroîtrait aussi l'influence du Japon au sein de l'ASEAN.\n\nDevons-nous accepter cette proposition et accélérer le développement des infrastructures ?"
 JAP_diplomacy.37.a: "Accepter"
 JAP_diplomacy.37.b: "Rejeter"
 JAP_diplomacy_37_TT: "§YChaque pays de l'ASEAN qui accepte recevra un modificateur de vitesse de construction d'infrastructure. Nous contribuerons §R3,5 milliards de $§! et gagnerons §G2,5 % d'influence§! dans chaque pays acceptant.§!"
 JAP_diplomacy.38.t: "Proposition d'investissement acceptée"
 JAP_diplomacy.38.d: "[FROM.GetName] a accepté la proposition du Japon d'investissement APD dans les infrastructures essentielles. Faire avancer les améliorations des réseaux de transport, des ports et de l'infrastructure électrique dopera la connectivité régionale et la croissance économique, tout en ancrant plus fermement notre implication. Cet accord renforcera encore l'influence du Japon au sein de l'ASEAN."
 JAP_diplomacy.38.a: "Bien"
 JAP_diplomacy.39.t: "Proposition refusée"
 JAP_diplomacy.39.d: "[FROM.GetName] a indiqué qu'il refusera la proposition du Japon d'investissement APD dans les infrastructures essentielles. L'autre pays semble prioriser ses plans intérieurs et ses préparatifs institutionnels, mais cela ne signifie pas qu'il rejette la proposition elle-même. Le Japon devrait rester attentif aux circonstances de l'autre pays tout en laissant de la place à une coopération future."
 JAP_diplomacy.39.a: "Compris."
 JAP_diplomacy.40.t: "Proposition de coopération en capital humain et recherche"
 JAP_diplomacy.40.a: "Accepter"
 JAP_diplomacy.40.b: "Rejeter"
 JAP_diplomacy_40_TT: "§YChaque pays de l'ASEAN qui accepte recevra des modificateurs de vitesse de recherche et de croissance de la productivité. Nous gagnerons §G2,5 % d'influence§! dans chaque pays acceptant.§!"
 JAP_diplomacy.41.t: "Proposition de coopération acceptée"
 JAP_diplomacy.41.a: "Bien"
 JAP_diplomacy.42.t: "Proposition refusée"
 JAP_diplomacy.42.a: "Compris."
 JAP_diplomacy.43.t: "Demande d'adhésion au cadre de sécurité maritime japonais"
 JAP_diplomacy.43.d: "Le gouvernement japonais a présenté un plan pour lancer un cadre de sécurité maritime neutre et pacifique visant à apaiser les tensions en mer de Chine méridionale et à protéger la liberté de navigation, et a approché notre pays pour y adhérer. Une coopération telle que le partage d'information, la recherche et le sauvetage maritimes, la lutte contre la piraterie et les exercices conjoints contribuerait à la stabilité régionale et améliorerait les capacités de gestion de crise. Accepter la proposition accroîtrait aussi l'influence du Japon au sein de l'ASEAN.\n\nDevons-nous accepter cette proposition et coopérer dans le cadre du Japon ?"
 JAP_diplomacy.43.a: "Accepter"
 JAP_diplomacy.43.b: "Rejeter"
 JAP_diplomacy_43_TT: "§YChaque pays de l'ASEAN qui accepte recevra un modificateur de stabilité. Nous gagnerons §G2,5 % d'influence§! et une opinion favorable de chaque pays acceptant.§!"
 JAP_diplomacy.44.t: "Accord d'adhésion au cadre"
 JAP_diplomacy.44.d: "[FROM.GetName] a accepté d'adhérer au cadre de sécurité maritime neutre et pacifique proposé par le Japon. À mesure qu'avancent le partage d'information, la recherche et le sauvetage maritimes, la lutte contre la piraterie et les exercices conjoints, nous pouvons attendre des progrès tangibles en stabilité régionale et en protection de la liberté de navigation. Cet accord renforcera la confiance et l'influence du Japon au sein de l'ASEAN."
 JAP_diplomacy.44.a: "Bien"
 JAP_diplomacy.45.t: "Proposition de participation refusée"
 JAP_diplomacy.45.d: "[FROM.GetName] a indiqué qu'il refusera d'adhérer au cadre de sécurité maritime neutre et pacifique proposé par le Japon. L'autre pays semble prioriser des considérations de la situation régionale et des priorités intérieures, mais cela ne signifie pas qu'il rejette les principes de coopération eux-mêmes. Le Japon devrait maintenir une posture qui n'enflamme pas les tensions tout en laissant de la place au dialogue et à la coopération."
 JAP_diplomacy.45.a: "Compris."
 JAP_diplomacy.46.t: "Lancement du programme d'éducation conjoint Japon-États-Unis"
 JAP_diplomacy.46.d: "Le gouvernement japonais a proposé d'élargir les programmes d'éducation conjoints et les échanges étudiants afin d'approfondir la compréhension mutuelle et de nourrir la prochaine génération. En créant un cadre où les deux pays peuvent apprendre des forces de l'autre, la discipline du Japon et l'esprit d'entreprise des États-Unis, l'objectif est de cultiver une nouvelle génération de dirigeants à l'esprit international. Cette initiative accroîtra les liens humains et renforcera encore la confiance au sein de l'alliance."
 JAP_diplomacy.46.a: "Un investissement dans l'avenir."
 JAP_diplomacy.47.t: "Échange technologique et culturel Japon-États-Unis"
 JAP_diplomacy.47.d: "Le gouvernement japonais a présenté un plan pour élargir l'échange technologique et culturel en liant laboratoires universitaires, studios et réseaux d'entreprises japonais à des partenaires de Silicon Valley, Seattle et Los Angeles. Ingénieurs, designers et créateurs iraient et viendraient pour des projets conjoints, visant à combiner le savoir-faire américain des plateformes et les forces du Japon en matériel, jeux et animation. Si l'affinité culturelle et la coopération scientifique avancent de concert, elles étayeront à la fois la stabilité sociale et l'élan d'innovation."
 JAP_diplomacy.47.a: "Maximisons la synergie."
 JAP_diplomacy.48.t: "Coopération nippo-américaine de recherche à double usage"
 JAP_diplomacy.48.d: "Le gouvernement japonais a présenté une proposition pour renforcer encore la coopération Japon-États-Unis dans les domaines de technologies à double usage applicables aux fins civiles comme militaires. Centré sur la collaboration entre industrie et université, le plan vise à faire avancer la recherche conjointe, partager l'expertise et promouvoir les échanges de personnel, accélérant la R&D et portant le développement technologique d'ensemble. Si ce partenariat s'enracine, on s'attend à ce qu'il renforce la compétitivité future dans les secteurs civil et militaire."
 JAP_diplomacy.48.a: "Faisons avancer la recherche conjointe."
 JAP_diplomacy.49.t: "Plateforme de connaissances sur la préparation aux catastrophes Japon-Taïwan"
 JAP_diplomacy.49.a: "Renforçons notre résilience."
 JAP_diplomacy.50.t: "Renforcer le partenariat de technologies avancées Japon-Taïwan"
 JAP_diplomacy.50.a: "Accélérons la recherche conjointe."
 JAP_diplomacy.51.t: "Développement des places d'études au Japon"
 JAP_diplomacy.51.d: "Le gouvernement japonais a proposé d'élargir les quotas de bourses et les places d'admission afin d'accroître les possibilités pour les étudiants taïwanais d'étudier dans les universités japonaises. Cette initiative vise non seulement à approfondir les liens académiques et culturels, mais aussi à cultiver les talents futurs qui peuvent relier nos deux sociétés. À mesure que les échanges s'élargissent, le fondement pour que la prochaine génération porte les relations Japon-Taïwan deviendra encore plus fort."
 JAP_diplomacy.51.a: "Un investissement dans la prochaine génération."
 JAP_diplomacy.52.t: "Proposition de soutenir la réforme du système commercial"
 JAP_diplomacy.52.d: "Le gouvernement japonais a proposé une coopération technique et institutionnelle pour soutenir la réforme et la modernisation du système commercial chinois. En simplifiant les procédures douanières, en numérisant les opérations administratives et en développant des règles alignées sur les normes internationales, l'objectif est de faciliter le commerce et d'améliorer la prévisibilité de l'activité des entreprises. Si ces réformes avancent, la charge procédurale des importations et exportations sera réduite, abaissant les frictions de l'activité économique. Accepter cette proposition accroîtrait aussi l'influence du Japon en Chine.\n\nDevons-nous accepter le soutien du Japon et faire avancer l'harmonisation internationale de notre système commercial ?"
 JAP_diplomacy.52.a: "Accepter"
 JAP_diplomacy.52.b: "Rejeter"
 JAP_diplomacy_52_TT: "§YSi l'offre est acceptée, la Chine recevra un modificateur de fardeau fiscal réduit, et nous gagnerons de l'§Ginfluence§! en Chine !§!"
 JAP_diplomacy.53.t: "Proposition de coopération acceptée"
 JAP_diplomacy.53.d: "[FROM.GetName] a accepté l'offre du Japon de soutien technique et institutionnel pour réformer et moderniser son système commercial. À mesure que les procédures douanières sont rationalisées et les opérations administratives améliorées, la facilitation du commerce et la prévisibilité de l'activité des entreprises augmenteront, et l'environnement d'entrée des entreprises japonaises s'améliorera aussi. Cet accord renforcera progressivement l'influence du Japon en Chine."
 JAP_diplomacy.53.a: "Bien"
 JAP_diplomacy.54.t: "Proposition refusée"
 JAP_diplomacy.54.d: "[FROM.GetName] a indiqué qu'il refusera la proposition du Japon de fournir un soutien technique et institutionnel pour réformer et moderniser son système commercial. L'autre partie semble prioriser ses priorités de conception de politique et sa coordination intérieure, mais cela ne signifie pas qu'elle rejette le besoin de réforme lui-même. Le Japon devrait rester attentif aux circonstances de l'autre pays tout en laissant de la place au dialogue et à la coopération."
 JAP_diplomacy.54.a: "Compris."
 JAP_diplomacy.55.t: "Expansion de la coopération d'investissement Japon-Chine"
 JAP_diplomacy.55.d: "Le gouvernement japonais a indiqué son intention d'avancer une coordination institutionnelle et un cadre de coopération pour promouvoir l'investissement mutuel et l'entrée sur les marchés entre entreprises japonaises et chinoises. Si l'entrée croisée s'accélère, les réseaux de production peuvent être optimisés et les chaînes d'approvisionnement rendues plus efficaces, ce qui devrait relever la productivité industrielle d'ensemble. Approfondir l'interdépendance économique comporte aussi des risques, mais cela peut simultanément servir de facteur de stabilisation pratique en réduisant les frictions."
 JAP_diplomacy.55.a: "Ouvrons le marché et améliorons l'efficacité."
 JAP_diplomacy.56.a: "Renforçons la solidarité culturelle."
 JAP_diplomacy.57.t: "Projet conjoint de préservation des temples bouddhistes Japon-Chine"
 JAP_diplomacy.57.d: "Le gouvernement japonais a proposé de mettre en œuvre un projet conjoint Japon-Chine pour préserver les temples bouddhistes comme patrimoine culturel partagé en menant ensemble conservation et restauration. En partageant techniques de restauration et méthodes d'enquête et en établissant un cadre coopératif de protection des biens culturels, l'objectif est de réaffirmer la valeur des temples et des biens culturels connexes et d'assurer leur préservation à long terme. Si les résultats de ces efforts de préservation deviennent visibles, l'attrait du tourisme culturel s'accroîtra, et des retombées positives sur les économies locales peuvent aussi être attendues. Cette coopération peut aussi servir d'occasion de réaffirmer les liens historiques entre nos deux pays."
 JAP_diplomacy.57.a: "Protégeons notre héritage et promouvons le tourisme."
 JAP_diplomacy.58.t: "Accélérateur Tokyo Séoul"
 JAP_diplomacy.58.d: "Le gouvernement japonais a présenté une proposition d'établir un programme d'accélérateur conjoint à Tokyo et Séoul, institutionnalisant le soutien aux start-up dans les deux pays. Par l'aide à la levée de fonds, le mentorat, la coopération avec entreprises et universités, et les échanges de talents entre les deux villes, l'objectif est de relever les taux de succès des start-up et de renforcer la coopération technologique. Si ce cadre fonctionne comme prévu, l'innovation entre les villes s'accélérera, et la coopération économique Japon-Corée sera renforcée de façon plus pratique et orientée vers les résultats."
 JAP_diplomacy.58.a: "Accélérons l'élan des start-up."
 JAP_diplomacy.59.t: "Développement de la coopération décentralisée entre le Japon et la Corée"
 JAP_diplomacy.59.a: "Générons de la croissance depuis les régions."
 JAP_diplomacy.60.t: "Proposition d'échanges culturels Japon–Corée"
 JAP_diplomacy.60.d: "Le gouvernement japonais a présenté une proposition d'élargir systématiquement l'échange culturel entre le Japon et la Corée du Sud. Par les médias, les arts, le sport, le tourisme et les échanges éducatifs, l'objectif est d'approfondir la compréhension mutuelle entre nos peuples et de réduire la distance sociale. Si les échanges s'élargissent, ils influenceront aussi le sentiment public et les attitudes extérieures, et les deux pays gagneront un environnement dans lequel ils peuvent s'exprimer plus efficacement dans la sphère intérieure de l'autre.\n\nDevons-nous accepter cette proposition et promouvoir l'échange culturel ?"
 JAP_diplomacy.60.a: "Accepter"
 JAP_diplomacy.60.b: "Rejeter"
 JAP_diplomacy_60_TT: "§YSi l'offre est acceptée, nous gagnerons de l'§Ginfluence§! en Corée, mais la Corée gagnera aussi de l'§Rinfluence§! au Japon.§!"
 JAP_diplomacy_60_TT2: "§YL'échange culturel nous permettrait de gagner de l'influence au Japon, mais l'influence du Japon chez nous s'accroîtrait aussi.§!"
 JAP_diplomacy.61.t: "Proposition acceptée"
 JAP_diplomacy.61.d: "[FROM.GetName] a accepté la proposition du Japon d'élargir l'échange culturel. À mesure que s'élargissent les échanges dans les médias, les arts, le sport, le tourisme et l'éducation, la compréhension mutuelle s'approfondira et des glissements de sentiment public dans les deux pays pourront s'ensuivre. Par cet accord, le Japon gagnera une voix plus forte en Corée, tandis que la Corée renforcera aussi son influence au Japon."
 JAP_diplomacy.61.a: "Bien"
 JAP_diplomacy.62.t: "Proposition refusée"
 JAP_diplomacy.62.d: "[FROM.GetName] a indiqué qu'il refusera la proposition du Japon d'élargir l'échange culturel. L'autre pays semble prioriser la considération de l'opinion publique et des circonstances intérieures, mais cela ne signifie pas qu'il rejette l'échange culturel lui-même. Le Japon devrait maintenir ouverts les canaux de dialogue tout en laissant de la place pour faire avancer la compréhension mutuelle d'autres façons."
 JAP_diplomacy.62.a: "Compris."
 JAP_diplomacy.63.t: "Groupe de travail Japon-Corée sur la société vieillissante"
 JAP_diplomacy.63.d: "Le gouvernement japonais a proposé d'établir une task force conjointe d'experts et d'institutions concernées du Japon et de Corée du Sud pour affronter le défi partagé d'une société vieillissante, avec des consultations mensuelles pour formuler des politiques coopératives. En partageant l'expertise sur le renforcement des systèmes de soins aux aînés et de santé, le soutien à l'emploi et la conception de la protection sociale de proximité, l'objectif est d'accroître à la fois la vitesse et l'efficacité des réponses politiques. Si ce cadre s'enracine, il fera avancer le renforcement des mesures de protection sociale et contribuera à la stabilité sociale à long terme."
 JAP_diplomacy.63.a: "Avançons les préparatifs ensemble."
 JAP_diplomacy_63_TT: "§YLa Corée du Sud gagnera un modificateur de croissance de la population.§!"
 JAP_diplomacy.64.t: "Coopération au développement des régions froides"
 JAP_diplomacy.64.d: "Le gouvernement japonais a proposé l'« initiative d'Extrême-Orient » pour soutenir le développement des régions froides de l'Extrême-Orient russe en s'appuyant sur l'expérience d'Hokkaidō dans la revitalisation des climats froids, par l'investissement infrastructurel et l'introduction de capitaux étrangers. En faisant avancer des améliorations fondamentales des transports, de la logistique et de l'énergie, l'objectif est de stimuler l'activité économique régionale et d'accroître l'efficacité du développement. L'initiative cible le développement d'infrastructure à Sakha et au Kamtchatka."
 JAP_diplomacy.64.a: "Renforçons les fondements de l'Extrême-Orient."
 JAP_diplomacy.65.t: "Sakhaline II"
 JAP_diplomacy.65.d: "Le gouvernement japonais a indiqué son intention de renforcer l'investissement étranger dans le projet énergétique Sakhaline II tout en coopérant avec la Russie, afin de sécuriser un accès stable aux combustibles fossiles. Si l'investissement en capital et la stabilisation des opérations avancent, la continuité du développement s'améliorera et une expansion de la capacité de production peut être attendue. Sakhaline restera un pôle d'approvisionnement important et est susceptible d'apporter aussi des effets positifs à l'économie régionale."
 JAP_diplomacy.65.a: "Augmenteons la capacité de production."
 JAP_diplomacy.66.t: "Lancement d'une coopération sur le réseau de transport eurasien"
 JAP_diplomacy.66.d: "Le gouvernement japonais a indiqué son intention de faire avancer la coopération Japon-Russie pour développer un corridor logistique terrestre reliant le Japon et l'Europe via la Russie. En s'appuyant sur les réseaux ferroviaires et les grandes autoroutes, l'objectif est de raccourcir les temps de transport et d'établir un accès stable aux marchés européens, tout en accélérant les modernisations d'infrastructure le long du corridor. Si le fret commence à circuler concrètement, la Russie renforcera encore son importance comme pôle eurasien, et la connectivité économique s'approfondira aussi."
 JAP_diplomacy.66.a: "Accélérons le développement du corridor."
 JAP_diplomacy.67.t: "Lancement de la coopération informatique Japon-Russie"
 JAP_diplomacy.67.d: "Le gouvernement japonais a présenté l'initiative du « corridor numérique Russie », travaillant avec des entreprises informatiques japonaises pour développer en Russie des infrastructures telles que centres de données et réseaux de fibre optique. L'objectif est de moderniser l'infrastructure de communications intérieure tout en renforçant le rôle de la Russie comme pôle d'un réseau de commerce numérique reliant l'Europe, l'Asie centrale et la Russie. Si cette coopération se met sur les rails, la stabilité des flux d'information et la capacité du réseau s'amélioreront, et la numérisation de l'activité économique s'accélérera aussi."
 JAP_diplomacy.67.a: "Élargissons notre infrastructure de connectivité."
 JAP_historical.20110311.t: "Le Grand séisme de l'est du Japon"
 JAP_historical.20110311.d: "À 14 h 46 le 11 mars 2011, un séisme massif de magnitude 9,0 a frappé au large de la côte pacifique de la région du Tōhoku. La plus forte secousse jamais enregistrée au Japon a violemment ébranlé de vastes zones du Tōhoku au Kantō, et le tsunami imposant qui a suivi a englouti villes et villages côtiers, laissant une dévastation catastrophique dans son sillage. Ports et communautés de pêche ont été oblitérés en quelques instants, tandis que routes, chemins de fer et aéroports étaient tranchés, plongeant les fonctions urbaines dans le chaos.\n\nDes centaines de milliers de personnes ont perdu leur foyer et se sont réfugiées dans des abris d'urgence. Le tribut économique est stupéfiant, car l'agriculture, la pêche et l'industrie, l'épine dorsale de l'économie régionale, ont subi des dégâts paralysants. Les tâches simultanées de restaurer l'infrastructure, d'aider les déplacés et de reconstruire industries et villes pousseront la capacité administrative du gouvernement à ses limites absolues.\n\nParmi cette tragédie inédite, le peuple japonais a montré résilience et solidarité. Pourtant, la rapidité et l'efficacité de la réponse du gouvernement détermineront la stabilité et l'avenir de la nation."
 JAP_historical.20110311.a: "Nous devons engager tous les efforts au sauvetage et au redressement."
 JAP_great_east_japan_earthquake_tree_tt: "§YL'arbre de focuses nationaux pour la reconstruction après le Grand séisme de l'est du Japon a été débloqué !§!"
 JAP_news.02.t: "Un séisme sans précédent frappe le Japon"
 JAP_news.02.d: "Le 11 mars 2011, le Japon a été frappé par un séisme massif. Plus tard connu comme le Grand séisme de l'est du Japon, ce séisme de magnitude 9,0 au large de la côte pacifique du Tōhoku a causé une destruction catastrophique sur une vaste zone, laissant des dizaines de milliers de morts ou disparus et infligeant des pertes économiques incalculables.\n\nLe tsunami qui s'ensuivit a oblitéré villes côtières, ports et réseaux de transport en quelques instants, forçant des centaines de milliers de personnes dans des abris d'évacuation. La société japonaise affronte désormais sa plus grande crise depuis l'après-guerre.\n\nLe Grand séisme de l'est du Japon est devenu un moment déterminant, alors que le monde regarde comment l'une des principales économies du globe réalisera son redressement."
 JAP_news.02.a: "Une tragédie terrifiante..."
 Japan.201103111.t: "Déclaration d'achèvement de la reconstruction"
 Japan.201103111.d: "Des années ont passé depuis la grande catastrophe, les décombres ont été déblayés, et les villes sont de nouveau emplies de la vitalité de leur peuple. La vie des victimes s'est progressivement stabilisée, et industries et infrastructures ont été restaurées. Aujourd'hui, le gouvernement déclare officiellement « Redressement atteint », clôturant le chapitre d'une longue ère d'épreuves.\n\nBien que cette tragédie ait laissé de profondes cicatrices, elle a aussi nourri résilience et fierté, posant le fondement d'un avenir plus lumineux."
 Japan.201103111.a: "Nous avons surmonté l'adversité !"
 Japan.201103112.t: "Progrès dans la restauration des infrastructures"
 Japan.201103112.d: "Une partie de l'infrastructure détruite par la catastrophe a désormais été restaurée. Transports et logistique reprennent progressivement, apportant de petits mais significatifs changements au quotidien. Bien que le redressement complet reste lointain, c'est un pas clair en avant."
 Japan.201103112.a: "Un pas en avant."
 Japan.201103113.t: "Restauration complète des infrastructures"
 Japan.201103113.d: "L'infrastructure du Tōhoku, dévastée par le séisme, a enfin atteint son niveau ciblé de restauration. Réseaux de transport et fonctions logistiques sont désormais de nouveau pleinement opérationnels, donnant un élan renouvelé à la société et à l'économie locales. L'effort de reconstruction a atteint un jalon majeur."
 Japan.201103113.a: "Une étape majeure."
 Japan.201103114.t: "Progrès dans la restauration des infrastructures"
 Japan.201103114.d: "Une partie de l'infrastructure détruite par la catastrophe a désormais été restaurée. Transports et logistique reprennent progressivement, apportant de petits mais significatifs changements au quotidien. Bien que le redressement complet reste lointain, c'est un pas clair en avant."
 Japan.201103114.a: "Un pas en avant."
 Japan.201103115.t: "Restauration complète des infrastructures"
 Japan.201103115.d: "L'infrastructure du Kantō, dévastée par le séisme, a enfin atteint son niveau ciblé de restauration. Réseaux de transport et fonctions logistiques sont désormais de nouveau pleinement opérationnels, donnant un élan renouvelé à la société et à l'économie locales. L'effort de reconstruction a atteint un jalon majeur."
 Japan.201103115.a: "Une étape majeure."
 Japan.201103116.t: "Télécommunications rétablies"
 Japan.201103116.d: "Le réseau de télécommunications de la région sinistrée a enfin été partiellement restauré. La communication pour le quotidien et les affaires s'est améliorée, apportant un espoir renouvelé à l'économie et à la société locales."
 Japan.201103116.a: "Poursuivre la restauration"
 Japan.201103117.t: "Télécommunications entièrement restaurées"
 Japan.201103117.d: "L'infrastructure de télécommunications du Tōhoku, dévastée par le séisme, a enfin atteint son niveau ciblé de restauration. Le fondement du quotidien et de l'industrie étant assuré, le chemin du redressement a atteint un jalon majeur."
 Japan.201103117.a: "Marquer cela comme un pas en avant dans le redressement"
 Japan.201103118.t: "Télécommunications entièrement restaurées"
 Japan.201103118.d: "L'infrastructure de télécommunications du Kantō, dévastée par le séisme, a enfin atteint son niveau ciblé de restauration. Le fondement du quotidien et de l'industrie étant assuré, le chemin du redressement a atteint un jalon majeur."
 Japan.201103118.a: "Marquer cela comme un pas en avant dans le redressement"
 Japan.201103119.t: "Reprise de l'industrie locale"
 Japan.201103119.d: "Usines et entreprises de la région sinistrée ont repris leurs opérations. Bien que le redressement complet soit encore lointain, le retour des emplois et de l'activité économique offre un sentiment tangible de progrès."
 Japan.201103119.a: "Pousser plus loin le redressement industriel"
 Japan.2011031110.t: "Base industrielle pleinement restaurée"
 Japan.2011031110.d: "La base industrielle du Tōhoku, dévastée par le séisme, a enfin atteint son niveau ciblé de redressement. Avec emplois et capacité de production restaurés, le chemin de la reconstruction a atteint un jalon majeur."
 Japan.2011031110.a: "Passer à l'étape suivante du redressement"
 Japan.2011031111.t: "Reprise de l'industrie locale"
 Japan.2011031111.d: "Usines et entreprises de la région sinistrée ont repris leurs opérations. Bien que le redressement complet soit encore lointain, le retour des emplois et de l'activité économique offre un sentiment tangible de progrès."
 Japan.2011031111.a: "Pousser plus loin le redressement industriel"
 Japan.2011031112.t: "Base industrielle pleinement restaurée"
 Japan.2011031112.d: "La base industrielle du Kantō, dévastée par le séisme, a enfin atteint son niveau ciblé de redressement. Avec emplois et capacité de production restaurés, le chemin de la reconstruction a atteint un jalon majeur."
 Japan.2011031112.a: "Passer à l'étape suivante du redressement"
 Japan.2011031150.t: "Accident de la centrale nucléaire de Fukushima Daiichi"
 Japan.2011031150.d: "Le Japon a été frappé par un séisme et un tsunami inédits, et tandis que la nation s'empresse de répondre, un autre rapport du pire cas est arrivé. Un tsunami a frappé la centrale nucléaire de Fukushima Daiichi, à Fukushima, causant des défaillances des générateurs d'urgence, des batteries et des réservoirs de carburant et plongeant le site dans une perte totale d'alimentation.\nPar-dessus cela, de grandes quantités d'hydrogène ont été générées et accumulées à l'intérieur des bâtiments réacteurs, menant à des explosions d'hydrogène aux unités 1, 3 et 4. Des fuites radioactives depuis des points endommagés étant désormais craintes, le public est tombé dans la panique."
 Japan.2011031150.a: "Nous devons agir immédiatement !"
 JAP_news.03.t: "Accident de la centrale nucléaire de Fukushima Daiichi"
 JAP_news.03.d: "Un accident grave a été signalé à la centrale nucléaire de Fukushima Daiichi au Japon, à la suite du séisme et du tsunami. Bien que les réacteurs se soient arrêtés après le séisme, le tsunami aurait mis hors service les générateurs de secours et d'autres équipements critiques, entraînant une perte totale d'alimentation. Le refroidissement n'étant plus tenable, des fusions du cœur se sont produites dans plusieurs unités.\nLa production et l'accumulation d'hydrogène ont aussi déclenché des explosions dans les bâtiments réacteurs, et il est jugé très probable que des matières radioactives aient été relâchées dans l'environnement par des points endommagés. Le gouvernement japonais s'efforce de réagir dans l'urgence."
 JAP_news.03.a: "Quelle situation..."
 Japan.2011031151.t: "La politique nucléaire japonaise à la croisée des chemins"
 Japan.2011031151.d: "Un mois s'est écoulé depuis l'accident nucléaire, et le gouvernement japonais est désormais contraint de trancher. L'accident de Fukushima Daiichi a ébranlé jusqu'au fond le sentiment de sûreté nucléaire du public. L'opinion est divisée, le monde des affaires craint l'impact sur l'approvisionnement électrique, et les citoyens s'inquiètent d'éventuelles fuites radioactives.\n\nLe Japon doit maintenant indiquer clairement s'il continuera de s'appuyer sur le nucléaire, ou s'il choisira une autre voie."
 Japan.2011031151.a: "Interdisez-le, fermez-le !"
 Japan.2011031151.b: "Nous devons instaurer des inspections strictes."
 Japan.2011031151.c: "Continuer comme avant !"
 JAP_territorial.01.t: "Initier les négociations sur les territoires du Nord"
 JAP_territorial.01.d: "Le litige territorial sur les Territoires du Nord est depuis la fin de la guerre un dossier en souffrance entre [JAP.GetName] et [SOV.GetName]. Notre nation en est désormais au point de demander formellement des négociations avec [SOV.GetName] pour régler l'affaire pacifiquement. Ce n'est pas une simple formalité diplomatique, mais une étape cruciale pour affirmer notre souveraineté et notre légitimité historique."
 JAP_territorial.01.oA: "Commençons !"
 JAP_territorial.02.t: "[JAP.GetName] demande des négociations sur les territoires du Nord"
 JAP_territorial.02.d: "Le gouvernement [JAP.GetAdjective] a adressé une demande formelle d'ouverture de négociations sur les Territoires du Nord. Ce dossier est gelé depuis des décennies, et la décision touchera à la fois notre standing international et la politique intérieure. Un compromis signifiera-t-il une perte d'intérêt national, ou un gain de confiance internationale ? L'heure de décider est venue."
 JAP_territorial.02.oA: "Céder le territoire à [JAP.GetName]"
 JAP_territorial.02.oB: "Refuser la demande. Il n'y a pas de place pour la négociation"
 JAP_territorial.03.t: "Accord sur la rétrocession des Territoires du Nord"
 JAP_territorial.03.d: "Enfin, le dossier de longue date des Territoires du Nord a été réglé. Après des négociations avec [SOV.GetName], un accord a été trouvé pour la rétrocession des territoires contestés. C'est une victoire diplomatique et un accomplissement historique de l'histoire [JAP.GetAdjective] d'après-guerre."
 JAP_territorial.03.oA: "Un accord historique !"
 JAP_territorial.04.t: "Échec des négociations dans les Territoires du Nord"
 JAP_territorial.04.d: "Le gouvernement [SOV.GetAdjective] a officiellement rejeté notre proposition de négociations sur la rétrocession des Territoires du Nord. Malgré nos efforts diplomatiques, aucune résolution n'a été obtenue. Nous devons désormais nous concentrer sur le renforcement de la confiance et l'élargissement de notre influence pour préparer de nouvelles négociations."
 JAP_territorial.04.oA: "C'était trop tôt cette fois..."
 JAP_territorial.05.t: "Engager des négociations sur Senkaku avec [CHI.GetName]"
 JAP_territorial.05.d: "[JAP.GetName] exerce actuellement le contrôle effectif des îles Senkaku, mais [CHI.GetName] continue d'affirmer sa souveraineté. Au vu des efforts diplomatiques passés, le moment est venu pour notre nation d'engager formellement des négociations avec le gouvernement [CHI.GetAdjective] en vue d'un règlement pacifique."
 JAP_territorial.05.oA: "Commençons !"
 JAP_territorial.06.t: "[JAP.GetName] propose des négociations territoriales"
 JAP_territorial.06.d: "Le gouvernement [JAP.GetAdjective] a demandé que nous retirions notre revendication territoriale sur les îles Senkaku. Il plaide pour un règlement pacifique et la stabilité régionale, et avance des négociations étayées par la pression diplomatique et le soutien international. Accepter cette proposition ne manquera pas de susciter appui et opposition, au pays comme à l'étranger."
 JAP_territorial.06.oA: "Retirer la revendication et privilégier la stabilité régionale."
 JAP_territorial.06.oB: "Maintenir la revendication et défendre la souveraineté nationale."
 JAP_territorial.07.t: "[CHI.GetName] retire sa réclamation Senkaku !"
 JAP_territorial.07.d: "[CHI.GetName] a officiellement retiré sa revendication territoriale sur les îles Senkaku. Les tensions de longue date en mer de Chine orientale se sont nettement apaisées, et l'on salue, au pays comme à l'étranger, une victoire diplomatique majeure. C'est un premier pas important vers la stabilité régionale et la construction de la confiance."
 JAP_territorial.07.oA: "Une avancée historique."
 JAP_territorial.08.t: "[CHI.GetName] maintient sa revendication"
 JAP_territorial.08.d: "[CHI.GetName] a déclaré qu'il maintiendrait sa revendication territoriale sur les îles Senkaku. Les négociations se sont achevées sans succès, soulignant le besoin de poursuivre la construction de la relation et le renforcement de l'influence internationale. Le dialogue reste possible, mais la situation demeure difficile."
 JAP_territorial.08.oA: "C'était peut-être trop tôt..."
 JAP_territorial.09.t: "Engager des négociations sur Senkaku avec [TAI.GetName]"
 JAP_territorial.09.d: "[TAI.GetName] revendique de longue date la souveraineté sur les îles Senkaku sur des bases historiques et géographiques, tandis que [JAP.GetName] maintient sa position sur la légitimité de son contrôle effectif. Pour régler pacifiquement ce dossier de longue date, nous adresserons une proposition diplomatique formelle à [TAI.GetName]."
 JAP_territorial.09.oA: "Commençons !"
 JAP_territorial.10.t: "[JAP.GetName] propose des négociations territoriales"
 JAP_territorial.10.d: "Le gouvernement [JAP.GetAdjective] a demandé que nous abandonnions notre revendication sur les îles Senkaku. Compte tenu de la complexité des relations transdétroit et du contexte international plus large, une délibération prudente s'imposera pour décider d'accepter ou non cette demande."
 JAP_territorial.10.oA: "Retirer la revendication pour la stabilité régionale."
 JAP_territorial.10.oB: "Nous devons continuer d'affirmer notre souveraineté."
 JAP_territorial.11.t: "[TAI.GetName] retire sa réclamation Senkaku !"
 JAP_territorial.11.d: "Les autorités [TAI.GetAdjective] ont officiellement retiré leur revendication territoriale sur les îles Senkaku. L'un des dossiers de longue date de la mer de Chine orientale étant réglé, les relations [JAP.GetName]-[TAI.GetName] entrent dans une ère nouvelle de stabilité, nourrissant l'espoir d'une coopération plus profonde."
 JAP_territorial.11.oA: "Un accord historique"
 JAP_territorial.12.t: "[TAI.GetName] refuse de retirer sa revendication"
 JAP_territorial.12.d: "[TAI.GetName] a déclaré qu'il maintiendrait sa revendication territoriale sur les îles Senkaku. Les négociations se sont soldées par un échec, rendant clair que le règlement exigera davantage d'influence diplomatique et une confiance mutuelle plus forte."
 JAP_territorial.12.oA: "C'était peut-être encore trop tôt..."
 JAP_territorial.13.t: "Engager des négociations sur Takeshima avec [KOR.GetName]"
 JAP_territorial.13.d: "Pour mettre fin au litige territorial de longue date sur Takeshima entre [JAP.GetName] et [KOR.GetName], notre gouvernement a proposé des négociations pacifiques avec [KOR.GetName]. Loin d'imposer unilatéralement notre revendication, cette démarche vise une relation tournée vers l'avenir entre les deux nations."
 JAP_territorial.13.oA: "Commençons !"
 JAP_territorial.14.t: "[JAP.GetName] propose des négociations sur Dokdo"
 JAP_territorial.14.d: "Le gouvernement [JAP.GetAdjective] nous a approchés pour négocier la souveraineté de Dokdo. C'est une décision extrêmement difficile au vu de l'opinion intérieure et du contexte historique, mais aussi un jugement diplomatique crucial qui pourrait façonner l'avenir des relations [JAP.GetName]-[KOR.GetName]."
 JAP_territorial.14.oA: "Prioriser l'amélioration des relations avec [JAP.GetName] et accepter le transfert."
 JAP_territorial.14.oB: "Nous ne pouvons pas céder notre territoire national."
 JAP_territorial.15.t: "[KOR.GetName] accepte de céder Takeshima !"
 JAP_territorial.15.d: "Dans le cadre des efforts pour améliorer les relations [JAP.GetName]-[KOR.GetName], le gouvernement [KOR.GetAdjective] a accepté de restituer Takeshima. C'est la fin d'une confrontation de plusieurs décennies et l'ouverture d'une nouvelle phase de confiance entre les deux pays. Un moment où les efforts diplomatiques pacifiques ont porté leurs fruits."
 JAP_territorial.15.oA: "Un exploit historique."
 JAP_territorial.16.t: "[KOR.GetName] refuse les négociations avec Takeshima"
 JAP_territorial.16.d: "Le gouvernement [KOR.GetAdjective] a rejeté notre demande de restitution de Takeshima. Le règlement du dossier territorial reste difficile, et sans une influence diplomatique plus forte et une confiance mutuelle, il sera dur d'y mettre un terme."
 JAP_territorial.16.oA: "Pour l'heure, nous devons poursuivre le dialogue."
 JAP_renegotiation_territory: "Une renégociation sera possible dans un an !"
 JAP_historical.20010426.t: "Yoshirō Mori démissionne, Junichiro Koizumi devient Premier ministre"
 JAP_historical.20010426.oA: "La réforme, maintenant !"
 JAP_historical.20060926.t: "Continuation ou succession ?"
 JAP_historical.20060926.oA: "Junichiro Koizumi"
 JAP_historical.20060926.oB: "Shinzo Abe"
 JAP_historical.20070926.t: "Continuité ou renouveau ?"
 JAP_historical.20070926.oA: "Shinzo Abe"
 JAP_historical.20070926.oB: "Yasuo Fukuda"
 JAP_historical.20080924.t: "Transition discrète ou virage audacieux ?"
 JAP_historical.20080924.oA: "Yasuo Fukuda"
 JAP_historical.20080924.oB: "Tarō Asō"
 Japan.01.t: "Approche des forces traditionalistes"
 Japan.01.d: "Alors que la polémique sur les propos du Premier ministre Mori se poursuit, divers groupes et commentateurs arguant que la Maison impériale devrait être réévaluée comme centre de l'ordre étatique japonais ont intensifié leurs activités. Ils ont approché le gouvernement, suggérant que s'il montrait plus clairement sa volonté de défendre la tradition et le caractère national, ils pourraient le soutenir en façonnant l'opinion et par le militantisme de terrain.\n\nDes liens plus étroits avec de telles forces risquent toutefois d'estomper la ligne entre conservatisme d'établissement et monarchisme radical, et d'attirer de nouvelles critiques. Faut-il user de cette offre, ou garder nos distances ?"
 Japan.01.a: "Garder nos distances."
 Japan.01.b: "Les utiliser comme levier politique."
 JAP_koizumi_appear_TT: "Mori pourra savourer sa partie de golf, mais son influence politique diminuera probablement de façon significative. Le parti pourrait bientôt commencer à chercher §Yun nouveau chef.§!"
 JAP_historical.20030926.t: "Fusion PDJ-PL : le Parti libéral rejoint le Parti démocrate"
 JAP_historical.20030926.d: "Les mouvements pour consolider les forces hors PLD s'accélèrent. Après des pourparlers répétés, le Parti démocrate et le Parti libéral ont convenu d'unifier le principal véhicule politique du camp hors PLD en une seule organisation.\n\nLe Parti libéral se dissoudra et fusionnera par absorption dans le Parti démocrate. Cela accroîtra la présence du camp hors PLD à la Diète, mais pourrait aussi créer de nouveaux points de friction alors que les partis se disputent l'orientation politique et le leadership."
 JAP_historical.20030926.a: "Le réalignement hors PLD est désormais en marche."
 JAP_historical.20070307.t: "Les mystérieuses charges de fluides"
 JAP_historical.20070307.d: "En mars 2007, lors d'une séance de la commission du budget de la Chambre des conseillers, il a été révélé que l'organisation de financement politique du ministre de l'Agriculture, des Forêts et de la Pêche Toshikatsu Matsuoka, le « Forum politique et économique du nouveau siècle Toshikatsu Matsuoka », avait déclaré un total d'environ 28,8 millions de yens de charges de fluides sur cinq ans, de 2001 à 2005, dans ses rapports de fonds politiques.\n\nCe qui a particulièrement attiré l'attention, c'est que le « siège principal » de l'organisation se trouvait dans l'immeuble des bureaux des députés de la Chambre des représentants, où l'eau, l'électricité et la climatisation sont fournis gratuitement.\nLe ministre Matsuoka a expliqué que les dépenses comprenaient les coûts d'un « ioniseur d'eau » et du « chauffage électrique », mais n'a pas fourni de justification claire des montants déclarés. Lors de séances ultérieures de la Diète, il a encore refusé d'élaborer, déclarant : « Selon le système, aucune explication supplémentaire n'est requise. »\n\nLes partis d'opposition ont vivement critiqué la situation, parlant d'éventuelle « fausse déclaration » et d'« abus du système », tandis que la méfiance du public grandissait quant à la responsabilité d'ensemble du gouvernement."
 JAP_historical.20070307.oA: "Exiger du ministre une explication publique complète"
 JAP_historical.20070307.oB: "Le défendre jusqu'à la conclusion de l'enquête"
 JAP_historical.20070528.t: "Un fardeau trop lourd"
 JAP_historical.20070528.d: "Le ministre de l'Agriculture, des Forêts et de la Pêche, Toshikatsu Matsuoka, a été trouvé mort pendu dans sa résidence parlementaire à Akasaka, Tokyo. La police a ensuite confirmé qu'il s'agissait d'un suicide.\n\nPendant plusieurs mois, le ministre Matsuoka avait subi un examen intense à la Diète, dans les médias et dans l'opinion, au sujet des charges de fluides élevées déclarées dans ses dossiers de financement politique.\n\nLa nouvelle a sidéré le public, soulevant des questions plus profondes : « Était-il le seul qui aurait dû rendre des comptes ? » et « La réponse du gouvernement a-t-elle vraiment été adéquate ? »"
 JAP_historical.20070528.oA: "Quelle tragédie..."
 JAP_historical.20070801.t: "Une chaîne de scandales : le poids de la responsabilité"
 JAP_historical.20070801.d: "Après la mort du ministre de l'Agriculture, des Forêts et de la Pêche Toshikatsu Matsuoka, Norihiko Akagi a été nommé pour lui succéder. Toutefois, deux mois plus tard seulement, Akagi a été de facto contraint de démissionner après que plusieurs problèmes ont été soulevés concernant son rapport de financement politique, dont les frais de bureau, le traitement des dons et le double-déclaration de reçus par son groupe politique « Tokuyūkai ».\n\nDeux ministres de l'Agriculture successifs englués dans des scandales en si peu de temps : de sérieuses questions se posent sur le sens des responsabilités de l'administration, sa transparence et la fiabilité des nominations au Cabinet. Le poste de ministre de l'Agriculture en est venu à être vu comme « maudit », et l'administration est désormais sous pression pour des gestes décisifs afin de rétablir la confiance et stabiliser sa direction."
 JAP_historical.20070801.oA: "Pourquoi cela continue-t-il ? Nous devons reconquérir la confiance du peuple."
 JAP_historical.20070704.t: "Une gaffe fatale"
 JAP_historical.20070704.d: "Lors d'une conférence publique, le ministre de la Défense Fumio Kyūma a tenu un propos controversé suggérant que les bombardements atomiques d'Hiroshima et de Nagasaki étaient « inévitables ».\nLe commentaire a été largement interprété comme une justification des bombardements, suscitant un vif retour de flamme des associations de survivants et du public. Les critiques ont afflué des parlementaires de la majorité comme de l'opposition, ainsi que des collectivités locales. Le Premier ministre Abe a adressé un blâme formel.\nAprès la remarque, des sit-in ont été organisés par des élus locaux et des groupes civiques dans les villes touchées, faisant de la polémique une crise politique à part entière. Kyūma a fini par démissionner, et Yuriko Koike a été nommée pour lui succéder.\n\nCe qui avait commencé comme un « simple lapsus d'un ministre » est devenu un test sérieux de la capacité de gouverner de l'administration et de sa crédibilité internationale."
 JAP_historical.20070704.oA: "En tant que gouvernement, nous devons exprimer un regret sincère et profond."
 JAP_historical.20090808.t: "La fondation de Your Party"
 JAP_historical.20090808.d: "Alors que montent les attentes d'une alternance, le mécontentement reste fort face à la lenteur de décision des partis existants et à la rigidité de l'administration. Dans cette atmosphère, Yoshimi Watanabe et d'autres ont mis la « réforme » au premier plan et appelé au rassemblement d'une nouvelle force politique qui ne s'appuierait pas sur le cadre existant.\n\nAinsi a été annoncée la fondation de Your Party. Ce mouvement, prônant la réforme administrative et la déréglementation, élargira les choix des électeurs tout en accélérant encore le réalignement et les manœuvres de la politique japonaise."
 JAP_historical.20090808.a: "Sous la bannière de la réforme, une nouvelle force se met en mouvement."
 JAP_historical.20120928.t: "La fondation du Parti de l'innovation du Japon"
 JAP_historical.20120928.d: "Alors que se répandent la méfiance envers les partis existants et le mécontentement face à la stagnation politique, un mouvement réformiste fondé sur le parti régional Osaka Restoration Association, qui étendait son influence à Osaka, a commencé à se tourner vers la politique nationale. Ce courant, qui avait accru sa présence régionale en prônant la révision de l'administration locale et la réforme de la gouvernance, serait réorganisé en force politique nationale et attirerait l'attention comme alternative aux partis établis.\n\nLa fondation du Parti de l'innovation du Japon ne marquerait pas seulement la naissance d'un nouveau parti, mais aussi un événement accélérant encore le réalignement de l'opposition et la formation d'une « troisième force »."
 JAP_historical.20120928.a: "Une nouvelle force réformiste entre en politique nationale."
 JAP_historical.20141128.t: "La dissolution de Your Party"
 JAP_historical.20141128.d: "Your Party, qui s'était imposée comme une « troisième force » face aux grands partis existants, peinait de plus en plus à maintenir l'unité interne alors que les divergences s'approfondissaient sur la direction du parti et les réponses aux élections.\n\nAu bout du compte, le parti a décidé de se dissoudre, et ses parlementaires affiliés ont chacun suivi des chemins distincts. La dispersion d'une force rassemblée sous la bannière de la réforme souligne une fois encore la fluidité du réalignement de l'opposition, et n'aura sans doute pas un petit impact sur la carte politique à venir."
 JAP_historical.20141128.a: "Un pilier de la troisième force s'achève."
 JAP_historical.20170925.t: "Réalignement de l'opposition : scission entre l'Espoir et les démocrates constitutionnels"
 JAP_historical.20170925.d: "Les forces hors PLD entrent dans une phase majeure de réalignement. Le Parti de l'espoir, nouvellement monté, a rapidement attiré l'attention comme véhicule réformiste, sur fond de mécontentement envers les partis existants et de sentiment de stagnation politique. Pour une partie du camp hors PLD établi, fusion et coopération paraissaient une occasion de reconstruire leurs forces, mais en même temps des conflits sur l'orientation politique et les conditions de fusion ont commencé à affleurer.\nLes forces issues de l'ancien Parti démocrate ne se sont pas unies en un seul bloc : certaines ont fusionné ou coopéré avec le Parti de l'espoir, d'autres ont formé le Parti démocrate constitutionnel et adopté une ligne indépendante. Le réalignement a avancé, mais la division s'est aussi clarifiée, et la structure des forces hors PLD a été dramatiquement redessinée."
 JAP_historical.20170925.a: "Le camp hors PLD s'est scindé entre l'Espoir et les démocrates constitutionnels."
 JAP_historical.20170925_TT: "§YLe Parti démocrate sera remplacé par le Parti démocrate constitutionnel !§!"
 JAP_historical.20180507.t: "Réalignement de l'opposition : formation du Parti démocrate pour le peuple"
 JAP_historical.20180507.d: "Les forces d'opposition, réorganisées par la scission entre le Parti de l'espoir et le Parti démocrate constitutionnel, ont continué de se remanier. Une partie de l'ancien camp démocrate et une partie du camp de l'Espoir, tout en portant des points de désaccord, ont cherché à s'unir comme nouvelle force centriste, et le Parti de l'espoir a progressivement perdu du poids comme cadre indépendant.\nAvec le temps, le Parti démocrate pour le peuple a été formé. Cela a aussi marqué la création d'un nouveau véhicule politique prônant une ligne centriste distincte du Parti démocrate constitutionnel, et la structure de l'opposition continuerait de changer."
 JAP_historical.20180507.a: "Le réalignement continue, et la forme de l'opposition ne cesse de changer."
 JAP_historical.20180507_TT: "§YLe Parti de l'espoir sera remplacé par le Parti démocrate pour le peuple !§!"
 JAP_historical.20190401.t: "La fondation de Reiwa Shinsengumi"
 JAP_historical.20190401.d: "Sur fond de méfiance persistante envers les partis existants et de mécontentement face à l'insécurité du quotidien, Tarō Yamamoto et d'autres ont lancé une nouvelle force politique. Mettant l'accent sur un soutien de terrain qui ne dépend pas de grandes organisations, et prônant de porter à la politique nationale des voix que l'ordre établi ne saisit pas pleinement, ce mouvement peut être situé comme une force qui place au premier plan des appels centrés sur le quotidien, dont le soutien aux ménages, l'élargissement de la sécurité sociale et une révision des charges, y compris la taxe à la consommation.\n\nLa fondation de Reiwa Shinsengumi accroît l'éventail des options au sein de l'opposition tout en soulignant une fois encore la fluidité du réalignement politique."
 JAP_historical.20190401.a: "Une nouvelle force de terrain déclare son entrée en politique nationale."
 JAP_historical.20220710.t: "La montée de Sanseitō"
 JAP_historical.20220710.d: "Alors que grandit le débat sur la méfiance envers les partis existants et un sentiment d'éloignement de la participation politique, Sanseitō, nouvelle force politique qui a élargi son soutien par l'activité de terrain et la diffusion d'information, a commencé à montrer une présence sur la scène nationale. Appuyé sur l'organisation locale et des appels distincts, il attire de plus en plus l'attention comme véhicule pour des segments que les grands partis n'avaient pas pleinement pu absorber.\n\nSoulignant sa distance vis-à-vis des partis établis, Sanseitō s'étend comme un nouveau parti qui accorde de l'importance à la participation et au pouvoir de relais de ses membres et partisans. Sa façon de mettre au premier plan des questions telles que l'éducation, l'alimentation, les systèmes sociaux et la conscience de la souveraineté attire du soutien, tout en pouvant devenir un facteur qui ébranle l'alignement partisan existant et la structure des enjeux.\n\nLa croissance de cette nouvelle force est un changement que les partis existants ne peuvent ignorer, et elle pourra aussi influencer les futurs réalignements de l'opposition et des conservateurs, ainsi que la fixation des agendas politiques."
 JAP_historical.20220710.a: "Une nouvelle force émergente renforce sa présence en politique."
