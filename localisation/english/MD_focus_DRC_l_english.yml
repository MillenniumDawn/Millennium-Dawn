 MDRC_union_expanded: "The regional union has completed its second-stage expansion"
 MDRC_union_admin_done: "The common union administration has been established"
 MDRC_reform_challenges_started: "The initial Congolese reconstruction challenges have been established"
 MDRC_mechanics_141_ready: "Completed institutional reforms have been accounted for"
 MDRC_mechanics_142_ready: "Existing institutional bonuses have been updated to whole percentages"
 MDRC_native_au_144_ready: "African Union focus membership has been synchronized"
