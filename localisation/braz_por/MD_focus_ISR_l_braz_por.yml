 israel.150.t: "O Hamas inicia uma agitação após as eleições!"
 israel.150.d: "Há pouco, após o anúncio dos resultados das eleições, o partido Hamas, que discordou do ocorrido, iniciou protestos contra a Autoridade da Cisjordânia."
