l_spanish:
 algeria_focus: "Árbol de enfoques argelino"
 ALG_political_tree_shortcut: "Árbol político"
 ALG_foreign_policy_shortcut: "Política exterior"
 ALG_industry_shortcut: "Recuperación económica"
 ALG_military_shortcut: "Fuerzas Armadas de Argelia"
 ALG_the_nation_stands_at_a_crossroads: "La nación ante una encrucijada"
 ALG_restore_the_presidency_desc: "A raíz del revuelo político, la presidencia se ha debilitado. Es hora de restaurar la autoridad de nuestro líder electo y restablecer las normas democráticas que se han erosionado. Al restablecer la presidencia, podemos devolver la estabilidad y la confianza a nuestro gobierno."
 ALG_emergency_rule_continues: "§REl estado de emergencia continúa§!"
 ALG_emergency_rule_continues_desc: "Con la nación aún en crisis, el gobierno ha decidido prorrogar el estado de emergencia. Aunque esta medida es necesaria para mantener el orden, tiene un coste para las libertades civiles y los procesos democráticos. Debemos movernos con cautela mientras navegamos por estas aguas turbulentas."
 ALG_national_reconciliation: "Reconciliación nacional"
 ALG_national_reconciliation_desc: "To sanar las heridas de la división y el conflicto, debemos seguir el camino de la reconciliación nacional. Al fomentar el diálogo entre todas las facciones y abordar los agravios, podremos construir una sociedad más unificada y sentar las bases para una paz duradera."
 ALG_moderate_islamist_talks: "Conversaciones con islamistas moderados"
 ALG_moderate_islamist_talks_desc: "En un esfuerzo por tender puentes sobre las divisiones y promover la estabilidad, estamos iniciando conversaciones con facciones islamistas moderadas. Al entablar un diálogo constructivo, nuestro objetivo es encontrar puntos en común y crear un entorno político donde las diversas voces puedan coexistir pacíficamente."
 ALG_charter_for_civil_peace: "Carta por la Paz Civil"
 ALG_charter_for_civil_peace_desc: "Para garantizar la estabilidad duradera y la armonía social, proponemos una Carta por la Paz Civil. Este documento esbozará los derechos y responsabilidades de todos los ciudadanos, promoviendo la tolerancia, el entendimiento y la cooperación entre los diferentes grupos de nuestra sociedad."
 ALG_open_democratic_path: "Abrir el camino democrático"
 ALG_open_democratic_path_desc: "Es hora de abrazar la democracia plenamente y abrir el camino hacia un futuro más brillante. Mediante la aplicación de reformas que empoderen a nuestros ciudadanos y promuevan la participación política, podemos crear una sociedad democrática vibrante que refleje la voluntad del pueblo."
 ALG_clamp_down_on_extremism: "Mano dura contra el extremismo"
 ALG_clamp_down_on_extremism_desc: "Utilizando tribunales militares y fuerzas de inteligencia, el gobierno eliminará todas las amenazas políticas e islamistas radicales restantes."
 ALG_counterterrorism_program: "Programa antiterrorista"
 ALG_counterterrorism_program_desc: "Se debe formar un aparato de seguridad moderno para rastrear, infiltrar y eliminar las amenazas antes de que desestabilicen Argelia."
 ALG_authoritarian_restoration: "Restauración autoritaria"
 ALG_authoritarian_restoration_desc: "La estabilidad solo puede garantizarse mediante un gobierno firme y centralizado. El ejército se hará cargo por completo del futuro de la nación."
 ALG_counterterrorism_agency: "Agencia antiterrorista"
 ALG_extremism_crackdown_modifier: "Represión del extremismo"
 ALG_extremism_crackdown_modifier_desc: "En respuesta a las crecientes amenazas de grupos extremistas que buscan desestabilizar nuestra nación, estamos implementando una represión integral contra el radicalismo. Esta iniciativa pretende desmantelar las redes extremistas, mejorar la vigilancia y reforzar las capacidades de las fuerzas del orden. Al promover una cultura de tolerancia y entendimiento, esperamos abordar las causas profundas del extremismo garantizando al mismo tiempo la seguridad de nuestros ciudadanos. A través de estas medidas, fomentaremos una sociedad más cohesionada y protegeremos nuestros valores democráticos."
 ALG_military_regime_restored: "Régimen militar restaurado"
 ALG_military_regime_restored_desc: "Tras años de inestabilidad política, el ejército ha recuperado el control y ha restaurado el orden. El régimen se centra en la disciplina, la seguridad nacional y un gobierno estricto para reconstruir la fuerza y la unidad de la nación."
 ALG_reconciliation_path_category: "Reconciliación nacional"
 ALG_reconciliation_path_category_desc: "\n£AFG_menu1\n\n\n\nPara sanar las heridas de la división y el conflicto, debemos seguir el camino de la reconciliación nacional. Al fomentar el diálogo entre todas las facciones y abordar los agravios, podremos construir una sociedad más unificada y sentar las bases para una paz duradera."
 ALG_pardon_moderate_islamist: "Indultar a islamistas moderados"
 ALG_pardon_moderate_islamist_desc: "Se puede ofrecer amnistía condicional a antiguos islamistas no violentos a cambio del desarme y la renuncia a la violencia política."
 ALG_initiate_national_dialogues: "Iniciar el diálogo nacional"
 ALG_initiate_national_dialogues_desc: "Se pondrá en marcha un foro nacional que incluirá a antiguos rebeldes, partidos políticos y a la sociedad civil para construir una nueva Argelia."
 ALG_reintegrate_former_fighter: "Reintegrar a antiguos combatientes"
 ALG_reintegrate_former_fighter_desc: "Un programa para reintegrar a los rebeldes rendidos a la vida civil mediante el trabajo, la vivienda o el servicio nacional."
 ALG_crackdown_category: "Represión autoritaria"
 ALG_crackdown_category_desc: "\n£TAJ_desctext_pamir\n\n\n\nPara garantizar la estabilidad del Estado, debemos suprimir los elementos subversivos y reforzar nuestras fuerzas de seguridad internas."
 ALG_arrest_political_opponents: "Arrestar a opositores políticos"
 ALG_arrest_political_opponents_desc: "Neutralizaremos las amenazas internas eliminando a los actores políticos radicales del espacio público."
 ALG_expand_surveillance_services: "Ampliar los servicios de vigilancia"
 ALG_expand_surveillance_services_desc: "Una sólida red de inteligencia vigilará a la población y evitará los disturbios antes de que se extiendan."
 ALG_ban_opposition_parties: "Prohibir partidos de la oposición"
 ALG_ban_opposition_parties_desc: "Todos los partidos políticos que no estén alineados con la unidad nacional verán prohibida su participación en la política."
 ALG_economic_recovery_category: "Programa de recuperación económica"
 ALG_economic_recovery_category_desc: "\n£MAIN_desctext_dept\n\n\n\nEl FMI ofrece apoyo condicional y Argelia puede iniciar ahora reformas más amplias, préstamos y privatizaciones."
 ALG_accept_imf_loan: "Aceptar préstamo del FMI"
 ALG_accept_imf_loan_desc: "Podemos aceptar la ayuda financiera del FMI para estabilizar nuestra moneda e iniciar reformas. Esto se produce a costa de deuda y condiciones a largo plazo."
 ALG_start_oil_licensing: "Abrir licencias petroleras a empresas extranjeras"
 ALG_start_oil_licensing_desc: "Permitir el acceso de corporaciones multinacionales a las reservas de petróleo podría acelerar el crecimiento, pero aumentaría la influencia extranjera."
 ALG_repay_imf_loan: "Pagar el préstamo del FMI"
 ALG_repay_imf_loan_desc: "Con nuestras finanzas estabilizándose, podemos liquidar nuestro préstamo para reducir la dependencia internacional."
 ALG_improve_public_services: "Mejorar los servicios públicos"
 ALG_improve_public_services_desc: "Ampliaremos la atención médica, la educación y el apoyo a las víctimas de la guerra."
 ALG_international_aid_effort: "Esfuerzo de ayuda internacional"
 ALG_international_aid_effort_desc: "Asociarse con la ONU y los donantes puede impulsar los servicios básicos y la reconstrucción."
 ALG_building_civil_society: "Construir la sociedad civil"
 ALG_building_civil_society_desc: "Empoderar a las comunidades y los programas sociales puede ayudar a prevenir nuevos conflictos."
 ALG_economic_recovery_program: "Programa de recuperación económica"
 ALG_economic_recovery_program_desc: "Lanzamos un plan nacional de crecimiento, respaldado por la asistencia extranjera y la reforma del Estado."
 ALG_remove_international_monitors: "Retirar a los observadores internacionales"
 ALG_remove_international_monitors_desc: "Argelia se ha recuperado lo suficiente como para recuperar la plena soberanía sobre su rumbo económico."
 ALG_postwar_recovery_program: "Programa de recuperación de posguerra"
 ALG_postwar_recovery_program_desc: "La guerra ha terminado. Ahora comenzamos a reconstruir el Estado, la economía y la sociedad."
 ALG_un_aid_mission: "Misión de ayuda de la ONU"
 ALG_un_aid_mission_desc: "La ayuda de las Naciones Unidas y las ONG asistirá a nuestros servicios públicos básicos."
 ALG_social_healing_programs: "Programas de sanación social"
 ALG_social_healing_programs_desc: "El trauma de la posguerra y la desconfianza deben abordarse con programas sociales y reconciliación."
 ALG_public_services_funding: "Financiación de servicios públicos"
 ALG_public_services_funding_desc: "Restauraremos el acceso a la atención médica, la vivienda y los programas de empleo."
 ALG_finalize_recovery_phase: "Finalizar la fase de recuperación"
 ALG_finalize_recovery_phase_desc: "Con la estabilidad restaurada, podemos reducir la supervisión extranjera y reclamar la autonomía económica."
 ALG_change_the_economy: "Cambiar el modelo económico"
 ALG_change_the_economy_desc: "Es hora de elegir: ¿debemos preservar el control estatal o liberalizar?"
 ALG_preserve_state_controlled_oil: "Preservar el control estatal sobre el petróleo"
 ALG_preserve_state_controlled_oil_desc: "Sonatrach debe seguir siendo la columna vertebral de nuestra soberanía y economía."
 ALG_industrial_expansion_plan: "Plan de expansión industrial"
 ALG_industrial_expansion_plan_desc: "Aumentaremos la producción nacional mediante infraestructuras y fábricas."
 ALG_open_market_reforms: "Reformas de libre mercado"
 ALG_open_market_reforms_desc: "Argelia puede atraer inversiones y reactivar el crecimiento desregulando sectores clave."
 ALG_oil_licensing_program: "Lanzar programa de licencias petroleras"
 ALG_oil_licensing_program_desc: "Las empresas extranjeras podrán solicitar la explotación de campos petroleros bajo contratos de licencias."
 ALG_urban_or_rural_development: "¿Tribus o ciudades?"
 ALG_urban_or_rural_development_desc: "¿Debería nuestro enfoque de posguerra centrarse en las regiones tribales o en las principales ciudades?"
 ALG_empower_rural_provinces: "Empoderar a las provincias rurales"
 ALG_empower_rural_provinces_desc: "Nuestro sur rural y los núcleos de Cabilia recibirán inversión directa."
 ALG_tribal_consultative_council: "Formar el Consejo Consultivo Tribal"
 ALG_tribal_consultative_council_desc: "Los ancianos locales y los líderes regionales ayudarán a gobernar las prioridades de desarrollo."
 ALG_urbanization_initiative: "Lanzar iniciativa de urbanización"
 ALG_urbanization_initiative_desc: "Los centros urbanos como Argel y Orán son las claves para nuestra modernización."
 ALG_expand_the_capital: "Expandir la capital"
 ALG_expand_the_capital_desc: "Ampliaremos las infraestructuras y las oficinas en Argel para convertirla en un verdadero centro moderno."
 ALG_foreign_policy_review: "Revisar la doctrina de política exterior"
 ALG_foreign_policy_review_desc: "Con el regreso de la estabilidad interna, Argelia debe redefinir su papel en la escena global."
 MSP_foreign_policy_review: "Revisar la doctrina de política exterior"
 MSP_foreign_policy_review_desc: "Con el regreso de la estabilidad interna, Argelia debe redefinir su papel en la escena global."
 ALG_africa_and_arab_nations: "África y las naciones árabes"
 ALG_africa_and_arab_nations_desc: "Nos centraremos en liderar la diplomacia y el desarrollo tanto en África como en el mundo árabe."
 ALG_western_sahara_position: "Apoyar al Sáhara Occidental"
 ALG_western_sahara_position_desc: "Reafirmamos nuestro apoyo a la independencia saharaui frente a las reivindicaciones marroquíes."
 ALG_african_union_engagement: "Unirse a la Unión Africana"
 ALG_african_union_engagement_desc: "Argelia debe volver a unirse y asumir un papel de liderazgo en la diplomacia continental."
 ALG_sahel_initiatives: "Expandirse hacia el Sahel"
 ALG_sahel_initiatives_desc: "Combatiremos la inestabilidad y el terrorismo en el Sahel mediante el poder blando y la defensa."
 ALG_choose_global_partner: "Elegir un socio global"
 ALG_choose_global_partner_desc: "Debemos alinearnos económica y militarmente con una de las superpotencias mundiales."
 ALG_align_with_us: "Alinearse con los Estados Unidos"
 ALG_align_with_us_desc: "Cooperar con los Estados Unidos puede aportar seguridad y ventajas económicas."
 ALG_align_with_china: "Alinearse con la República Popular China"
 ALG_align_with_china_desc: "China ofrece un desarrollo económico no intervencionista y un profundo potencial de inversión."
 ALG_align_with_russia: "Alinearse con la Federación de Rusia"
 ALG_align_with_russia_desc: "Rusia proporciona tecnología militar y comparte el escepticismo de Argelia respecto al dominio occidental."
 ALG_non_aligned_revival: "Revivir la política exterior de No Alineación"
 ALG_non_aligned_revival_desc: "Reviviremos el espíritu de neutralidad y solidaridad del sur, tal como en la década de 1960."
 ALG_global_south_solidarity: "Solidaridad con el Sur Global"
 ALG_global_south_solidarity_desc: "Argelia reforzará los lazos con las naciones poscoloniales a través del comercio, la diplomacia y la ayuda."
 ALG_future_national_policy: "§GEl futuro de Argelia§!"
 ALG_future_national_policy_desc: "With the civil war behind us, we must now define Algeria's new political direction.\n §RNOTE§!: §YPicking this Focus will lead to focuses in the end that will overwrite the current focus tree with a customized one for each party, so finish other important focuses before ending this§!"
 ALG_approach_nato: "§CAcercamiento a la OTAN§!"
 ALG_approach_nato_desc: "La alineación occidental podría traer crecimiento económico y garantías de seguridad."
 ALG_aspire_nato_support: "Aspirar a una asociación con la OTAN"
 ALG_aspire_nato_support_desc: "Al cumplir con las condiciones necesarias, Argelia puede convertirse en un aliado importante no miembro de la OTAN."
 ALG_invite_western_investors: "Invitar a inversores occidentales"
 ALG_invite_western_investors_desc: "Atraer capital y comercio de naciones democráticas."
 ALG_request_us_protection: "Solicitar protección de EE. UU."
 ALG_request_us_protection_desc: "Argelia pedirá a los Estados Unidos protección o garantías militares."
 ALG_remain_neutral: "§gPermanecer neutral§!"
 ALG_remain_neutral_desc: "La no alineación ofrece libertad diplomática y estabilidad interna."
 ALG_economy_first: "Priorizar la economía"
 ALG_economy_first_desc: "Reducir el gasto militar y potenciar la educación junto al desarrollo a largo plazo."
 ALG_seek_un_protection: "Buscar protección internacional"
 ALG_seek_un_protection_desc: "Si las amenazas aumentan, recurriremos al Consejo de Seguridad de la ONU en busca de protección."
 ALG_align_with_china1: "§tAlinearse con China y Rusia§!"
 ALG_align_with_china1_desc: "Las potencias orientales ofrecen una alternativa a la alineación con la OTAN."
 ALG_join_sco: "Solicitar el ingreso en la OCS"
 ALG_join_sco_desc: "La Organización de Cooperación de Shanghái ofrece beneficios económicos y de seguridad."
 ALG_invite_eastern_investors: "Invitar a la inversión oriental"
 ALG_invite_eastern_investors_desc: "Asociarse con empresas de infraestructura chinas y rusas."
 ALG_request_chinese_protection: "Solicitar protección china"
 ALG_request_chinese_protection_desc: "Pekín podría aceptar garantizar la independencia y las inversiones de Argelia."
 ALG_reform_the_military: "Reformar el ejército"
 ALG_reform_the_military_desc: "El ejército argelino requiere una profunda reforma estructural para afrontar los desafíos del siglo XXI."
 ALG_military_academy_upgrade: "Modernizar la academia militar"
 ALG_military_academy_upgrade_desc: "Invertir en educación es clave para formar oficiales competentes y profesionales."
 ALG_internal_security_brigade: "Formar brigadas de seguridad interna"
 ALG_internal_security_brigade_desc: "Debemos garantizar el orden interno mediante unidades especializadas de seguridad nacional."
 ALG_military_industry_support: "Apoyar a la industria militar"
 ALG_military_industry_support_desc: "Impulsar nuestra base industrial-militar ayudará a garantizar la autosuficiencia."
 ALG_anti_air_force: "Establecer el Mando Antiaéreo"
 ALG_anti_air_force_desc: "Las capacidades de defensa aérea son vitales para proteger nuestros cielos."
 ALG_mechanized_modernization: "Modernización de fuerzas mecanizadas"
 ALG_mechanized_modernization_desc: "Las unidades mecanizadas modernas son el núcleo de una fuerza terrestre eficaz."
 ALG_uav_development: "Programa de desarrollo de drones"
 ALG_uav_development_desc: "Los sistemas aéreos no tripulados nos darán capacidad de vigilancia y de ataque de precisión."
 ALG_national_guard_initiative: "Iniciativa de la Guardia Nacional"
 ALG_national_guard_initiative_desc: "Un cuerpo de defensa basado en los ciudadanos puede ayudar a estabilizar las zonas rurales y fronterizas."
 ALG_air_force_reform: "Reformar la Fuerza Aérea"
 ALG_air_force_reform_desc: "Renovar las doctrinas y el equipamiento es fundamental para nuestra superioridad aérea."
 ALG_infantry_equipment_project: "Modernizar el equipamiento de infantería"
 ALG_infantry_equipment_project_desc: "Nuestra infantería merece lo último en armamento y equipo de protección."
 ALG_ballistic_program: "Programa de misiles balísticos"
 ALG_ballistic_program_desc: "Ampliar nuestras capacidades de misiles mejorará la disuasión estratégica."
 ALG_simulation_center: "Centro de simulación militar"
 ALG_simulation_center_desc: "Establecer centros de entrenamiento modernos mejorará drásticamente nuestra preparación para el combate."
 ALG_logistics_command: "Establecer el Mando de Logística"
 ALG_logistics_command_desc: "La optimización de la logística garantiza que nuestras tropas sigan siendo eficaces en combate."
 ALG_military_doctrine_finalization: "Finalizar la doctrina militar"
 ALG_military_doctrine_finalization_desc: "Debemos consolidar las reformas en una doctrina moderna."
 ALG_foreign_arms_contracts: "Contratos de armas extranjeros"
 ALG_foreign_arms_contracts_desc: "Las asociaciones estratégicas pueden ayudar a cubrir rápidamente las deficiencias de nuestro arsenal."
 ALG_local_armor_production: "Producción local de blindados"
 ALG_local_armor_production_desc: "Iniciar la producción local de tanques y vehículos blindados de transporte de personal garantiza nuestra autonomía y crecimiento."
 ALG_military_university_program: "Programa de universidades militares"
 ALG_military_university_program_desc: "Invertir en las academias militares preparará a nuestra próxima generación de líderes."
 ALG_heavy_artillery_project: "Iniciativa de artillería pesada"
 ALG_heavy_artillery_project_desc: "Priorizaremos la investigación y el desarrollo nacional de artillería pesada."
 ALG_special_operations_command: "Mando de Operaciones Especiales"
 ALG_special_operations_command_desc: "Un mando centralizado para unidades de élite mejora la coordinación y la eficacia."
 ALG_joint_command_center: "Establecer un Centro de Mando Conjunto"
 ALG_joint_command_center_desc: "Combinar las distintas ramas en un núcleo de operaciones conjuntas mejorará la integración estratégica."
 ALG_indigenous_rifle_program: "Programa de fusiles nacionales"
 ALG_indigenous_rifle_program_desc: "Desarrollar nuestras propias armas ligeras avanzadas es una prioridad nacional."
 ALG_integrated_defense_network: "Red de defensa integrada"
 ALG_integrated_defense_network_desc: "Un sistema unificado de radar y comunicaciones refuerza la defensa nacional."
 ALG_advanced_command_structure: "Estructura de mando avanzada"
 ALG_advanced_command_structure_desc: "Implementaremos un sistema de mando C4ISR moderno para el campo de batalla digital."
 ALG_military_modernization_complete: "Modernización militar completada"
 ALG_military_modernization_complete_desc: "Nuestro largo camino hacia la reforma por fin ha dado sus frutos. Argelia cuenta ahora con una fuerza moderna y cohesionada."
 ALG_idea_non_aligned_policy: "Política exterior de No Alineación"
 ALG_idea_non_aligned_policy_desc: "Nuestro camino independiente nos permite beneficiarnos de todos los bloques sin alinearnos con ninguno."
 ALG_presidential_succession_crisis: "Crisis de sucesión presidencial"
 ALG_presidential_succession_crisis_desc: "Con la estabilidad erosionándose, la cuestión del liderazgo vuelve a surgir. ¿Continuamos bajo el antiguo régimen o forjamos un nuevo camino?"
 ALG_stay_with_bouteflika: "Mantener el liderazgo de Bouteflika"
 ALG_stay_with_bouteflika_desc: "Bouteflika represents continuity and corruption. We may gain financial stability, but at the cost of legitimacy."
 ALG_choose_tebboune: "Nombrar a Tebboune"
 ALG_choose_tebboune_desc: "Un tecnócrata moderado con reformas orientadas a la estabilidad, pero que le costará muy caro a las arcas del Estado."
 ALG_choose_msp: "Nombrar al líder del MSP"
 ALG_choose_msp_desc: "Una alternativa islamista alineada con los Hermanos Musulmanes. Trae consigo popularidad en ciertos círculos, pero arriesga un conflicto civil con la atrincherada élite militar."
 ALG_random_president: "Elegir un presidente al azar"
 ALG_random_president_desc: "Una carta comodín. Este nuevo presidente podría salvar o condenar a Argelia."
 ALG_resolve_presidency_crisis: "Crisis de la presidencia resuelta"
 ALG_resolve_presidency_crisis_desc: "La incógnita sobre el liderazgo ha sido respondida. Ahora es momento de seguir adelante."
 ALG_idea_bouteflika_legacy: "El legado de Bouteflika"
 ALG_idea_bouteflika_legacy_desc: "A pesar de la profunda corrupción y la desconfianza, la era de Bouteflika sigue siendo sinónimo de la gobernanza pasada de Argelia. Su red de contactos mantiene su influencia."
 ALG_idea_tebboune_moderate: "Presidencia moderada de Tebboune"
 ALG_idea_tebboune_moderate_desc: "Con una imagen de estabilidad y reforma progresiva, Tebboune busca mantener el orden mientras sanea la gobernanza."
 ALG_idea_msp_presidency: "Presidencia del MSP"
 ALG_idea_msp_presidency_desc: "El Movimiento de la Sociedad por la Paz ha tomado el poder. Queda por ver si esto marcará una transformación pacífica o el descenso hacia un conflicto."
 ALG_idea_random_good: "Nuevo presidente eficaz"
 ALG_idea_random_good_desc: "Ya sea por suerte o por estrategia, el nuevo presidente es competente e inspirado, aportando reformas y rumbo."
 ALG_idea_random_bad: "Nuevo presidente inepto"
 ALG_idea_random_bad_desc: "Este líder no está preparado, se encuentra abrumado y posiblemente sea corrupto. Una mala elección para un momento tan crítico."
 ALG_presidency.1.t: "Tensiones con el ejército"
 ALG_presidency.1.d: "Tras el nombramiento del líder del MSP como presidente, la élite militar está furiosa. Ven esto como una amenaza para su histórico control sobre el poder. Circulan rumores sobre movilizaciones secretas, y unidades armadas leales a la vieja guardia comienzan a realizar maniobras. ¿Aceptará el ejército este cambio o se rebelará?"
 ALG_presidency.1.a: "El ejército acepta al nuevo gobierno"
 ALG_presidency.1.b: "El ejército se rebela: ¡comienza la guerra civil!"
 ALG_presidency_army_accepts_tt: "El ejército acepta a regañadientes el gobierno del MSP. Por ahora, se mantiene la paz."
 ALG_presidency_army_civilwar_tt: "¡Un golpe militar estalla en una guerra civil abierta!"
 ALG_economy_digital_initiative: "Iniciativa de economía digital"
 ALG_economy_digital_initiative_desc: "Argelia debe abrazar la era digital para modernizar su economía. La inversión en infraestructura tecnológica, servicios de administración electrónica y programas de alfabetización digital nos posicionará para la economía del siglo XXI."
 ALG_digital_initiative_tt: "§GArgelia pone en marcha un programa integral de transformación digital:§!\n- Modernizar los servicios gubernamentales\n- Ampliar la infraestructura de internet\n- Promover las empresas emergentes tecnológicas\n- Capacitar a la fuerza laboral en habilidades digitales"
 ALG_digital_economy_initiative: "Iniciativa de economía digital"
 ALG_digital_economy_initiative_desc: "Nuestra inversión en infraestructura digital y educación tecnológica está dando sus frutos. Los servicios gubernamentales son más eficientes, las empresas están adoptando prácticas modernas y una nueva generación de trabajadores con conocimientos tecnológicos se incorpora al mercado laboral."
 ALG_arpt_regulatory_framework: "Establecer la Autoridad Reguladora ARPT"
 ALG_arpt_regulatory_framework_desc: "La Autorité de Régulation de la Poste et des Télécommunications (ARPT) garantizará un mercado de telecomunicaciones competitivo y protegerá los derechos de los consumidores."
 ALG_algerie_telecom_expansion: "Modernización de Algérie Télécom"
 ALG_algerie_telecom_expansion_desc: "Modernize and expand Algérie Télécom's infrastructure to improve broadband access and public communications."
 ALG_nedjma_and_mobilis: "Competencia entre Nedjma y Mobilis"
 ALG_nedjma_and_mobilis_desc: "Fomentar una competencia sana entre operadores de telecomunicaciones como Nedjma y Mobilis reducirá los precios y mejorará la calidad del servicio."
 ALG_fiber_optic_program: "Infraestructura de fibra óptica"
 ALG_fiber_optic_program_desc: "Invertir en el despliegue de fibra óptica a nivel nacional para aumentar la conectividad y la velocidad de la red en todo el país."
 ALG_4g_rollout: "Desplegar servicios 4G"
 ALG_4g_rollout_desc: "El lanzamiento de internet móvil 4G transformará la conectividad, permitiendo mejores servicios electrónicos y productividad digital."
 ALG_air_algerie_modernization: "Modernización de Air Algérie"
 ALG_air_algerie_modernization_desc: "Reforzar la flota y las rutas de Air Algérie impulsará el turismo y mejorará la logística internacional."
 ALG_international_airports_upgrade: "Modernizar los principales aeropuertos"
 ALG_international_airports_upgrade_desc: "Invertir en aeropuertos como los de Argel, Orán y Constantina para convertirlos en centros de tráfico aéreo regional y mundial."
 ALG_aadl_housing_projects: "Programas de vivienda de la AADL"
 ALG_aadl_housing_projects_desc: "Los proyectos de la Agencia Nacional para la Mejora y el Desarrollo de la Vivienda proporcionarán viviendas subsidiadas y desarrollo urbano para la creciente población de las ciudades."
 ALG_urbanization_initiatives: "Iniciativas de desarrollo urbano"
 ALG_urbanization_initiatives_desc: "La ampliación de carreteras, servicios públicos y zonas edificables apoyará a nuestras ciudades en crecimiento y mejorará la calidad de vida."
 ALG_arpt_regulation: "Autoridad Reguladora ARPT"
 ALG_arpt_regulation_desc: "La ARPT garantiza las prácticas de mercado justas, la competencia y la protección del consumidor en el sector de las telecomunicaciones."
 ALG_algerie_telecom_program: "Programa de Algérie Télécom"
 ALG_algerie_telecom_program_desc: "Un plan integral de modernización para el operador estatal de telecomunicaciones."
 ALG_mobile_operator_competition: "Reforma de la competencia en telecomunicaciones"
 ALG_mobile_operator_competition_desc: "La competitividad del mercado entre Nedjma y Mobilis ha fomentado la innovación y unos precios asequibles."
 ALG_4g_coverage: "Cobertura nacional 4G"
 ALG_4g_coverage_desc: "La banda ancha móvil avanzada mejora la comunicación y respalda una economía digital."
 ALG_national_innovation_push: "Impulso nacional a la innovación"
 ALG_national_innovation_push_desc: "Una iniciativa respaldada por el gobierno para promover la innovación y el desarrollo tecnológico en todos los sectores."
 ALG_highway_project: "Proyecto de la autopista Este-Oeste"
 ALG_highway_project_desc: "Un proyecto de 13 000 millones de dólares que conecta el este y el oeste modernizará el transporte y reducirá el tiempo de viaje."
 ALG_air_algerie_investment: "Inversión en Air Algérie"
 ALG_air_algerie_investment_desc: "La expansión de la aerolínea nacional de Argelia abre nuevas oportunidades comerciales y de viaje."
 ALG_air_hub_status: "Centro de conexión aérea regional de Argel"
 ALG_air_hub_status_desc: "Argel tiene el potencial de convertirse en un centro neurálgico central entre África, Europa y Oriente Medio."
 ALG_aadl_program: "Iniciativa de vivienda de la AADL"
 ALG_aadl_program_desc: "La Agencia Nacional para la Mejora y el Desarrollo de la Vivienda tiene como objetivo construir viviendas asequibles para miles de familias en toda Argelia."
 ALG_kabylia_unrest: "Disturbios en Cabilia"
 ALG_kabylia_unrest_desc: "Desde la «Primavera Bereber» de 1980, Cabilia ha estado marcada por protestas periódicas, demandas culturales y desconfianza hacia el gobierno central. Estas tensiones latentes bajo la superficie socavan la estabilidad y amenazan con estallar en disturbios más amplios si no se abordan. Si no se resuelven, los acontecimientos podrían agravarse drásticamente en el futuro."
 ALG_black_spring.1.t: "Disturbios en Cabilia"
 ALG_black_spring.1.d: "Tras el asesinato de Massinissa Guermah a manos de las fuerzas de la gendarmería, han estallado protestas masivas en Cabilia. El descontento crece día a día."
 ALG_black_spring.1.a: "Esto debe ser abordado."
 ALG_black_decade: "Década Negra"
 ALG_black_decade_desc: "La guerra civil argelina, conocida en Argelia como la Década Negra, fue una guerra civil librada entre el gobierno argelino y varios grupos rebeldes islamistas desde el 11 de enero de 1992 (tras un golpe de Estado que anuló una victoria electoral islamista) hasta el 8 de febrero de 2002. La guerra comenzó lentamente, ya que inicialmente parecía que el gobierno había aplastado con éxito al movimiento islamista, pero surgieron grupos armados para declarar la yihad y, en 1994, la violencia alcanzó tal nivel que parecía que el gobierno no podría resistirla. Para 1996-97 quedó claro que la resistencia islamista había perdido su apoyo popular, aunque los combates continuaron durante varios años más."
 ALG_maghreb_invite.1.t: "Invitación a la Unión del Magreb"
 ALG_maghreb_invite.1.d: "Argelia propone una alianza económica y militar en el norte de África. ¿Nos uniremos?"
 ALG_maghreb_invite.1.a: "Unirse a la Unión"
 ALG_maghreb_invite.1.b: "Rechazar (Solo Marruecos)"
 ALG_maghreb_trade_hub: "Centro comercial del Magreb"
 ALG_maghreb_trade_hub_desc: "Nuestra economía prospera como el centro del comercio del norte de África."
 ALG_maghreb_diplomacy: "Diplomacia del Magreb"
 ALG_maghreb_diplomacy_desc: "Argelia se está consolidando como el líder del norte de África, fomentando la unidad a través del comercio y la seguridad compartida."
 ALG_maghreb_union_tt: "Maghreb Union Formed\nAlgeria, Tunisia, and other North African nations now share economic and military ties under our leadership."
 ALG_trade_allies: "Aliados comerciales"
 ALG_egypt_algiers_axis: "Eje Egipto-Argel"
 ALG_egypt_algiers_axis_desc: "Our relations with Egypt go way back. We must continue to strengthen our position in Africa and lead this continent."
 FIS_Are_Terrorists: "El FIS son terroristas"
 ALG_un_peacekeepers: "Cascos azules de las Naciones Unidas desplegados"
 ALG_un_peacekeepers_desc: "Las Naciones Unidas han enviado fuerzas de mantenimiento de la paz para estabilizar la región y prevenir nuevos conflictos. Su misión es mantener el orden, proteger a los civiles y apoyar los esfuerzos diplomáticos hacia una paz duradera."
 ALG_civil_war_recovered: "Guerra civil superada"
 ALG_civil_war_recovered_desc: "La nación ha emergido de la agitación de la guerra civil, comenzando el largo proceso de sanación y reconstrucción. Los esfuerzos se centran en restaurar la unidad, reconstruir la infraestructura y prevenir futuros conflictos internos."
 ALG_sonatrach_restructure: "Reestructuración de Sonatrach"
 ALG_sonatrach_restructure_desc: "La empresa petrolera nacional Sonatrach está experimentando una importante reestructuración para mejorar la eficiencia, aumentar la producción y fortalecer la estabilidad económica. Esta transformación tiene como objetivo impulsar el sector energético del país y apoyar el crecimiento a largo plazo."
 ALG_investment_boom_modifier: "Auge de la inversión"
 ALG_investment_boom_modifier_desc: "El país está experimentando un aumento en las inversiones nacionales y extranjeras, lo que impulsa un rápido crecimiento económico y desarrollo. Este auge mejora la capacidad industrial, la infraestructura y la prosperidad general."
 ALG_foreign_oil_licensing_bonus: "Licencias petroleras extranjeras"
 ALG_foreign_oil_licensing_bonus_desc: "Grants temporary access to foreign companies to our oil fields, increasing our oil production capacity."
 ALG_idea_pro_palestinian_campaign: "Campaña propalestina"
 ALG_idea_pro_palestinian_campaign_desc: "Mejora las relaciones con los grupos palestinos y potencia potencialmente el apoyo a los movimientos de independencia de Argelia en la región."
 ALG_idea_palestinian_backing: "Respaldo de Argelia a los derechos palestinos"
 ALG_idea_palestinian_backing_desc: "Análisis del apoyo histórico y continuo de Argelia a los derechos palestinos, incluyendo posturas diplomáticas, iniciativas de ayuda y un compromiso político más amplio."
 ALG_idea_palestinian_aid_fund: "Fondo de ayuda argelino-palestino"
 ALG_idea_palestinian_aid_fund_desc: "Un fondo establecido por Argelia para proporcionar ayuda humanitaria y de desarrollo al pueblo palestino. Esto podría incluir ayuda de emergencia, desarrollo de infraestructura, educación e iniciativas de empoderamiento económico."
 ALG_crackdown_backfired: "La represión contraproducente"
 ALG_idea_refoming_education1: "Reformar la educación"
 ALG_idea_refoming_education: "Reformar la educación"
 ALG_university_expansion: "Expansión universitaria"
 ALG_basic_income_support: "Apoyo de ingresos básicos"
 ALG_housing_support_idea: "Ayuda a la vivienda"
 ALG_childcare_reform: "Reforma del cuidado infantil"
 ALG_civil_rights: "Conceder derechos civiles"
 ALG_public_admin_reform: "Transporte público gratuito"
 MSP_switch_to_morocco: "Abandonar a los saharauis"
 MSP_switch_to_morocco_desc: "Supporting Sahrawi has soured our relations with Morocco. Morocco is a rising economic power, a powerful nation right next to us. It would make most sense to drop our senseless support for Sahrawi and build friendly terms with Morocco instead."
 MSP_influence_mauritania: "Influenciar a Mauritania"
 MSP_influence_mauritania_desc: "Mauritania libró una breve guerra contra Marruecos por el Sáhara Occidental después de que España se retirara de la región. Ya no reclaman el territorio, pero han seguido de cerca el conflicto del Sáhara Occidental y son uno de los partidarios del Frente Polisario. Es importante aumentar nuestro control sobre ellos para resolver el conflicto del Sáhara Occidental."
 MSP_casablanca_accords: "Acuerdos de Casablanca"
 MSP_casablanca_accords_desc: "El conflicto en el Sáhara Occidental ha estado en un estado congelado durante décadas sin que nadie haya sido capaz de resolverlo. Necesitamos usar nuestra influencia en la región para solucionar el conflicto."
 ALG_influence_mauritania: "Influenciar a Mauritania"
 ALG_influence_mauritania_desc: "Mauritania libró una breve guerra contra Marruecos por el Sáhara Occidental después de que España se retirara de la región. Ya no reclaman el territorio, pero han seguido de cerca el conflicto del Sáhara Occidental y son uno de los partidarios del Frente Polisario. Es importante aumentar nuestro control sobre ellos para resolver el conflicto del Sáhara Occidental."
 ALG_energy_reform: "Reforma energética"
 ALG_energy_reform_desc: "We need to fix our energy issue. By reforming the energy industry we can distribute energy for the whole country."
 ALG_focus_on_oil: "Centrarse en el petróleo"
 ALG_focus_on_oil_desc: "Hay muchas vetas de petróleo sin explotar en toda Argelia y, según algunos estudios, Argelia podría ser uno de los países más ricos en petróleo del mundo, la mayor parte del cual está sin explotar. Como tal, deberíamos centrarnos en el petróleo."
 ALG_focus_on_oil_tt: "§CCentrarse en el petróleo nos permitirá obtener más beneficios vendiendo energía a nuestros vecinos, ¡pero será desastroso para Hassi Messaoud!§!"
 ALG_focus_on_renewables: "Centrarse en las renovables"
 ALG_focus_on_renewables_desc: "Argelia es un país donde ningún pueblo es demasiado pequeño para el sol. Necesitamos dar ejemplo al resto del mundo y construir una red energética sostenible. Será costoso, pero valdrá la pena para las futuras generaciones."
 ALG_focus_on_renewables_tt: "§CCentrarse en la energía renovable no generará tantos beneficios como el uso del petróleo, ¡pero será mejor para Hassi Messaoud!§!"
 ALG_oil_production: "Trabajar con Sonatrach"
 ALG_oil_production_desc: "La principal empresa argelina de petróleo y gas es Sonatrach, una entidad estatal. Es un actor importante en el mercado energético mundial y busca activamente inversiones y asociaciones en el sector del petróleo y el gas. Sonatrach participa en todos los aspectos de la cadena de valor de los hidrocarburos, desde la exploración y producción hasta el refino y la distribución."
 ALG_grid_expansion: "Expansión de la red eléctrica"
 ALG_grid_expansion_desc: "Está bien que podamos producir nuestra propia electricidad, pero también necesitamos una red eléctrica robusta para mover la electricidad por todo el país y hacia nuestros vecinos."
 ALG_solar_panel_grid: "Red de paneles solares"
 ALG_solar_panel_grid_desc: "Teniendo en cuenta nuestra posición geográfica, el sol casi siempre abunda en Argelia. Esto la convierte en una ubicación increíble para instalar plantas de energía solar."
 ALG_hassi_massoud_exploitation: "Explotación de Hassi Messaoud"
 ALG_resource_excavation_research: "Investigación de excavación petrolera"
 ALG_resource_excavation_research_desc: "Parte del petróleo se encuentra en lugares de difícil acceso. Necesitamos trabajar junto a la Universidad de Argel 1 para encontrar formas de excavar hasta la última gota de petróleo posible."
 ALG_wind_turbine_research: "Investigación de turbinas eólicas"
 ALG_wind_turbine_research_desc: "Con la tecnología actual, instalar parques eólicos en Argelia es imposible. Las condiciones del viento sencillamente no son adecuadas para las turbinas contemporáneas. Necesitamos invertir en la investigación de soluciones para este problema."
 ALG_ethanol_power_plant: "Planta de energía de etanol"
 ALG_ethanol_power_plant_desc: "Utilizando etanol derivado del estiércol de vaca, podemos crear una forma sostenible de generar electricidad."
 ALG_algeria_steelworks: "Siderurgia de Argelia"
 ALG_algeria_steelworks_desc: "¡Necesitamos extraer más petróleo! Con todo el petróleo extra, también podemos instalar una fábrica de acero."
 ALG_Adrar_wind_park: "Parque eólico de Adrar"
 ALG_Adrar_wind_park_desc: "El parque eólico de Adrar es un parque natural en la parte sur de Argelia. El terreno cercano al parque es adecuado para instalar parques eólicos, y ahí es donde estableceremos el primer parque eólico de Argelia."
 ALG_national_space_program: "Programa espacial nacional"
 ALG_national_space_program_desc: "Argelia debe establecer un programa espacial nacional para unirse a las filas de las naciones con capacidad espacial. Esta iniciativa sentará las bases para futuros logros en la exploración espacial y la tecnología de satélites."
 ALG_arab_world_outreach: "Profundizar los lazos diplomáticos árabes"
 ALG_arab_world_outreach_desc: "Para fortalecer la influencia de Argelia en el mundo árabe, debemos revitalizar nuestros esfuerzos de coordinación y alcance diplomático. A través de visitas bilaterales, cumbres e iniciativas comerciales, Argelia puede consolidarse como una fuerza unificadora en la región."
 ALG_join_arab_league: "Reforzar el compromiso con la Liga Árabe"
 ALG_join_arab_league_desc: "Como miembro actual de la Liga Árabe, Argelia puede ir más allá de la mera participación y asumir un papel diplomático líder. Promover la coordinación económica, las consultas de defensa y la solidaridad cultural mejorará nuestra posición en el mundo árabe."
 ALG_support_palestine: "Apoyar la causa palestina"
 ALG_support_palestine_desc: "Algeria's longstanding relationship with Palestine is rooted in shared historical experiences and political solidarity. This connection manifests in various forms, including diplomatic support for Palestinian self-determination and humanitarian aid. Algeria's commitment to the Palestinian cause is a key aspect of its foreign policy."
 ALG_algeria_algiers_axis: "Forjar el Eje Egipto-Argel"
 ALG_algeria_algiers_axis_desc: "Al alinearse más estrechamente con Egipto, Argelia puede ayudar a formar un poderoso bloque regional capaz de guiar la unidad árabe, asegurar la estabilidad del norte de África y contrarrestar la influencia extranjera."
 ALG_condemn_israel: "Condenar las acciones israelíes"
 ALG_condemn_israel_desc: "Ante la continua agresión y las violaciones de los derechos humanos, Argelia condenará formalmente las acciones israelíes en la escena internacional, movilizando el apoyo a una paz justa y oponiéndose a la normalización sin una resolución previa."
 ALG_palestinian_aid_package: "Paquete de ayuda palestino"
 ALG_palestinian_aid_package_desc: "Asignaremos recursos para proporcionar asistencia humanitaria, económica y técnica a los territorios palestinos, asegurando que el compromiso de Argelia se extienda más allá de las palabras hacia una ayuda real e impactante."
 ALG_pan_african_defense_initiative: "Iniciativa de defensa panafricana"
 ALG_pan_african_defense_initiative_desc: "Para proteger la soberanía africana y mejorar la estabilidad continental, Argelia propondrá una iniciativa de defensa africana coordinada que construya una preparación militar colectiva frente a las amenazas compartidas."
 ALG_send_troops_to_sahel: "Desplegar fuerzas en el Sahel"
 ALG_send_troops_to_sahel_desc: "En respuesta a la creciente inestabilidad en el Sahel, Argelia enviará tropas para apoyar las operaciones de mantenimiento de la paz, la protección de fronteras y las campañas antiterroristas en colaboración con los gobiernos regionales."
 ALG_sahel_stabilization_force: "Fuerza de Estabilización del Sahel"
 ALG_sahel_stabilization_force_desc: "Argelia asumirá el liderazgo en el establecimiento de una Fuerza de Estabilización del Sahel permanente, un marco de seguridad liderado por África para contrarrestar las insurgencias y las redes criminales en la región."
 ALG_exploit_sahel_resources: "Explotar los recursos del Sahel"
 ALG_exploit_sahel_resources_desc: "La influencia argelina en el Sahel ofrece acceso a recursos naturales sin explotar. Mediante la negociación de contratos mineros y de infraestructura, podemos asegurar beneficios económicos y asociaciones estratégicas en la región."
 ALG_propose_maghreb_union: "Proponer la Unión del Magreb"
 ALG_propose_maghreb_union_desc: "Es hora de revivir la visión de un Magreb unido. Argelia asumirá la iniciativa de proponer renovados esfuerzos de integración, centrándose en la cooperación económica, la infraestructura conjunta y la alineación diplomática."
 ALG_economic_integration_initiative: "Integración económica del Magreb"
 ALG_economic_integration_initiative_desc: "A través de la reducción de aranceles, la inversión en infraestructura y debates sincronizados sobre política monetaria, Argelia impulsará los esfuerzos para crear una zona económica común en el Magreb que beneficie a todos los Estados miembros."
 ALG_maghreb_joint_defense_pact: "Pacto de Defensa Conjunta del Magreb"
 ALG_maghreb_joint_defense_pact_desc: "Un Magreb seguro requiere una defensa colectiva. Propondremos un pacto militar regional centrado en la protección de fronteras, el intercambio de inteligencia y la realización de ejercicios militares conjuntos."
 ALG_idea_joint_military_arab: "Fuerzas Armadas Árabes Conjuntas"
 palestine_issue_very_positive: "Apoyar la causa palestina"
 ALG_algerian_airforce: "Modernizar la Fuerza Aérea de Argelia"
 ALG_algerian_airforce_desc: "Una fuerza aérea moderna y capaz es esencial para la defensa nacional. Invertiremos en reestructuración, entrenamiento de pilotos y adquisición de equipamiento para mejorar la preparación aérea."
 ALG_buy_russia_su_27: "Adquirir cazas rusos Su-27"
 ALG_buy_russia_su_27_desc: "Como parte de la modernización de nuestra fuerza aérea, negociaremos con Rusia la compra de un lote de cazas Su-27, reforzando nuestra superioridad aérea y disuasión estratégica."
 ALG_oum_el_bouaghi_airbase: "Expandir la base aérea de Oum El Bouaghi"
 ALG_oum_el_bouaghi_airbase_desc: "Estratégicamente ubicada en el este, Oum El Bouaghi se expandirá para convertirse en un centro operativo principal para la fuerza aérea de Argelia, mejorando nuestras capacidades de despliegue rápido."
 ALG_protect_the_skies: "Proteger los cielos"
 ALG_protect_the_skies_desc: "Con el aumento de las amenazas aéreas regionales, Argelia debe asegurarse de poder detectar e interceptar cualquier incursión. Fortalecer nuestras defensas aéreas es una prioridad de seguridad nacional."
 ALG_russia_mig_servicing: "Contratos rusos de mantenimiento de MiG"
 ALG_russia_mig_servicing_desc: "El mantenimiento y la modernización de nuestra flota de MiG requieren una cooperación más profunda con los contratistas rusos. Estos acuerdos de servicio garantizarán la longevidad operativa de las aeronaves existentes."
 ALG_bosnian_parts: "Asegurar piezas de repuesto bosnias"
 ALG_bosnian_parts_desc: "Argelia asegurará componentes excedentes de la industria de defensa de Bosnia para apoyar y reacondicionar nuestras estructuras aéreas envejecidas, garantizando un mantenimiento y reparación rentables."
 ALG_comprehensive_radar_installations: "Expansión de la cobertura de radar"
 ALG_comprehensive_radar_installations_desc: "Para lograr una cobertura nacional completa de radar, construiremos instalaciones de radar avanzadas a lo largo de las fronteras y costas de Argelia, cerrando todos los puntos ciegos en nuestro espacio aéreo."
 ALG_reform_or_control: "Reforma o control"
 ALG_reform_or_control_desc: "Argelia se encuentra ante una encrucijada política. La elección entre una verdadera reforma democrática o la consolidación del control autoritario definirá el futuro de la nación."
 ALG_legalize_moderate_islamists: "Legalizar a los islamistas moderados"
 ALG_legalize_moderate_islamists_desc: "Reconocer a los partidos islamistas moderados ofrece un camino hacia la estabilidad a través de la inclusión. Una participación cuidadosamente supervisada en las elecciones puede desactivar los sentimientos radicales."
 ALG_restore_elections: "Restaurar los procesos electorales"
 ALG_restore_elections_desc: "Para relegitimar el Estado, Argelia debe reanudar elecciones libres y justas. La transparencia y la rendición de cuentas serán los pilares de nuestra nueva era política."
 ALG_public_media_and_transparency: "Empoderar a los medios públicos y la transparencia"
 ALG_public_media_and_transparency_desc: "La reforma de los medios estatales y la libertad de prensa son vitales para reconstruir la confianza pública. Una ciudadanía informada es esencial para el desarrollo democrático."
 ALG_crackdown_on_opposition: "Represión contra la oposición"
 ALG_crackdown_on_opposition_desc: "Para evitar la desestabilización, la disidencia debe ser contenida. La vigilancia, la censura y los arrestos selectivos neutralizarán a los elementos antigubernamentales."
 ALG_state_surveillance_network: "Red de vigilancia estatal"
 ALG_state_surveillance_network_desc: "Se ampliará una red nacional de inteligencia para supervisar las actividades políticas, garantizando que las amenazas sean neutralizadas antes de que puedan agravarse."
 ALG_joint_governance_experiment: "Experimento de gobernanza conjunta"
 ALG_joint_governance_experiment_desc: "Probaremos una nueva forma de poder compartido entre las fuerzas laicas y religiosas para prevenir un nuevo conflicto. Este arriesgado experimento podría traer tanto la paz como la parálisis."
 ALG_a_radical_reorientation: "Una reorientación radical"
 ALG_a_radical_reorientation_desc: "El orden existente ha fracasado. A través del mandato divino y la claridad ideológica, surge un nuevo camino guiado por una fe inquebrantable y el rechazo a la legitimidad del Estado laico."
 ALG_covert_support_for_islamist_radicals: "Apoyo encubierto a islamistas radicales"
 ALG_covert_support_for_islamist_radicals_desc: "Las redes radicales siguen activas en las sombras. Con financiación estratégica y asistencia logística encubierta, podemos empoderar a estos grupos para que actúen contra el régimen desde dentro."
 ALG_tolerate_radical_preachers: "Tolerar a los predicadores radicales"
 ALG_tolerate_radical_preachers_desc: "El púlpito es una herramienta poderosa. Al hacer la vista gorda ante los sermones incendiarios, permitimos que la ideología se propague orgánicamente a través de las mezquitas y los medios de comunicación, radicalizando a la población a nuestro favor."
 ALG_welcome_militants: "Acoger a militantes extranjeros"
 ALG_welcome_militants_desc: "Nuestra causa trasciende las fronteras. Los combatientes extranjeros alineados con nuestra ideología pueden ser refugiados e integrados de forma segura en células locales, aportando experiencia de combate y una dedicación inquebrantable."
 ALG_arms_smuggling: "Operaciones de contrabando de armas"
 ALG_arms_smuggling_desc: "Para prepararnos para un futuro enfrentamiento, debemos establecer cadenas de suministro clandestinas de armas y municiones. Las alianzas con traficantes de armas transnacionales servirán a nuestras necesidades."
 ALG_start_the_uprising: "Iniciar el levantamiento"
 ALG_start_the_uprising_desc: "Ha llegado el momento. Con nuestras redes activadas, nuestros combatientes armados y nuestra ideología propagándose, nos alzaremos contra el régimen y declararemos un nuevo orden islámico."
 ALG_clamp_down_on_vices: "Mano dura contra los vicios"
 ALG_clamp_down_on_vices_desc: "El juego, el alcohol y la decadencia moral no tienen cabida en nuestra sociedad. Una campaña radical para eliminar estos vicios purificará a la nación y consolidará la autoridad religiosa."
 ALG_revolutionize_the_ulema: "Revolucionar los ulemas"
 ALG_revolutionize_the_ulema_desc: "El estamento religioso debe alinearse con la causa revolucionaria. Los ulemas tradicionales serán purgados o reeducados, mientras que los clérigos leales ocuparán su lugar como líderes espirituales del Estado."
 ALG_traditional_gender_roles: "Reforzar los roles de género tradicionales"
 ALG_traditional_gender_roles_desc: "La era moderna ha corrompido el orden natural. Volveremos a los roles asignados por mandato divino para hombres y mujeres, instituyendo un marco legal estricto que refleje estos valores."
 ALG_pledge_allegiance_to_al_qaeda: "Jurar lealtad a Al Qaeda"
 ALG_pledge_allegiance_to_al_qaeda_desc: "Para que la yihad global triunfe, la unidad es esencial. Juraremos lealtad a Al Qaeda, alineándonos con su visión y obteniendo el apoyo de una red islamista más amplia."
 ALG_pledge_allegiance_to_daesh: "Jurar lealtad al Estado Islámico"
 ALG_pledge_allegiance_to_daesh_desc: "Al Qaeda es un movimiento decrépito y en decadencia que ha perdido de vista su objetivo original de librar una yihad global, estancándose en cambio en asuntos de nivel local. Es hora de que un nuevo movimiento con un nuevo sentido de propósito ocupe su lugar."
 ALG_secure_the_loyalty_of_aqim: "Asegurar la lealtad de AQMI"
 ALG_secure_the_loyalty_of_aqim_desc: "Al Qaeda en el Magreb Islámico debe reconocer nuestro liderazgo y operar en coordinación con nuestro Estado. Su lealtad garantizará un control duradero sobre las operaciones yihadistas regionales."
 ALG_war_on_daesh: "Guerra contra Daesh"
 ALG_secure_the_loyalty_effect_tt: "Effects will depend on having any of the following countries as puppets: [AQY.GetNameWithFlag], [NUS.GetNameWithFlag], [TTP.GetNameWithFlag]"
 ALG_war_on_daesh_desc: "El autoproclamado «Estado Islámico» es una clara amenaza para nuestro liderazgo en el movimiento yihadista global. Su rechazo a nuestra autoridad y sus tácticas poco convencionales ya no pueden ser tolerados. Ha llegado el momento de librar una guerra total contra el advenedizo Daesh."
 ALG_jihad_in_the_maghreb: "Yihad en el Magreb"
 ALG_jihad_in_the_maghreb_desc: "Los regímenes laicos de Marruecos, Túnez y Argelia deben caer. Expandiremos nuestro Califato por la fuerza, comenzando una campaña regional de guerra religiosa y expansión territorial."
 ALG_jihad_in_arabia: "Yihad en Arabia"
 ALG_jihad_in_arabia_desc: "Al albergar los lugares sagrados de La Meca y Medina, la península arábiga es quizás el territorio con mayor importancia religiosa del mundo. Por lo tanto, no se puede permitir que siga gobernada por gobiernos corruptos e insuficientemente piadosos."
 ALG_jihad_in_the_levant: "Yihad en Irak y el Levante"
 ALG_jihad_in_the_levant_desc: "Irak y el Levante son regiones que han sido desgarradas por fuerzas extranjeras desde la era colonial. Solo a través de la fuerza de las armas se podrá expulsar a los ocupantes cruzados y sionistas del Levante."
 ALG_jihad_in_west_africa: "Yihad en África Occidental"
 ALG_jihad_in_west_africa_desc: "Nuestra revolución no se detiene en el Magreb. Ha llegado el momento de exportar la yihad a África Occidental, derrocando a los regímenes de Mali, Níger y Mauritania mientras marchamos hacia el sur."
 AlgeriaFocus.56.t: "[FROM.GetNameDef] apoya nuestra independencia"
 AlgeriaFocus.56.d: "[FROM.GetNameDef] ha afirmado su apoyo a nuestra independencia de Marruecos y ha señalado que desea trabajar aún más de cerca con nosotros en el futuro."
 AlgeriaFocus.56.a: "Excelente"
 AlgeriaFocus.57.t: "[FROM.GetNameDef] nos abandona"
 AlgeriaFocus.57.d: "[FROM.GetNameDef] ha retirado su apoyo a nuestra independencia. Han sido nuestros aliados durante décadas, pero parece que ahora nos han abandonado para mejorar sus relaciones con Marruecos."
 AlgeriaFocus.57.a: "¡Traidores!"
 algeria_algerian_foreign_policy: "Política exterior argelina"
 AlgeriaFocus.64.t: "[FROM.GetNameDef] exige autonomía para Creta"
 AlgeriaFocus.64.d: "El gobierno de [FROM.GetAdjective] ha declarado que está preocupado por nuestra posición en la isla de Creta. Según ellos, nuestro estricto control sobre la isla compromete su seguridad. Exigen que se conceda a Creta una autonomía limitada para garantizar una menor presencia militar y política nuestra en la zona."
 AlgeriaFocus.64.a: "Supongo que podemos aceptarlo"
 AlgeriaFocus.64.b: "Eso es ridículo"
 AlgeriaFocus.65.t: "[FROM.GetNameDef] acepta"
 AlgeriaFocus.65.d: "El gobierno de [FROM.GetAdjective] ha aceptado nuestras demandas de aumentar la autonomía para el pueblo cretense."
 AlgeriaFocus.65.a: "Un éxito"
 AlgeriaFocus.66.t: "[FROM.GetNameDef] rechaza"
 AlgeriaFocus.66.d: "El gobierno de [FROM.GetAdjective] ha rechazado nuestras demandas de aumentar la autonomía para el pueblo cretense."
 AlgeriaFocus.66.a: "Se arrepentirán de esto"
 AlgeriaFocus.66.b: "Esperaremos el momento oportuno"
 AlgeriaFocus.67.t: "Hamás inicia una nueva Intifada"
 AlgeriaFocus.67.d: "Hamás ha convocado una nueva intifada contra nosotros. Estamos viendo un aumento en los movimientos de los militantes de Hamás y ya se han producido varias manifestaciones contra nuestro dominio sobre Palestina. Tenemos informes de que Argelia podría estar detrás del armamento y la motivación de Hamás para esta nueva campaña."
 AlgeriaFocus.67.a: "Se arrepentirán de esto"
 AlgeriaFocus.68.t: "[FROM.GetNameDef] patrocina una nueva Intifada"
 AlgeriaFocus.68.d: "[FROM.GetNameDef] has sent weapons and money for us to start a new Intifada against Israel. We already have a line of new recruits near our offices, and people are mobilising to protest against the Israeli occupiers."
 AlgeriaFocus.68.a: "Agradecemos a Argelia"
 AlgeriaFocus.69.t: "Hamás se levanta"
 AlgeriaFocus.69.d: "Estamos recibiendo informes de combatientes de Hamás tomando el control de instituciones y edificios clave en la Franja de Gaza. Han prometido que Israel sufrirá las consecuencias de una nueva Intifada."
 AlgeriaFocus.69.a: "Maldición"
 AlgeriaFocus.69.b: "¡Aplastadlos!"
 AlgeriaFocus.70.t: "[FROM.GetNameDef] contacta a los tubu"
 AlgeriaFocus.70.d: "Hemos recibido informes de que Argelia ha comenzado a armar a los rebeldes tubu en el norte de nuestro país. Si Argelia nos invade, estos rebeldes sin duda se unirán a su causa."
 AlgeriaFocus.70.a: "Preocupante"
 AlgeriaFocus.71.t: "[FROM.GetNameDef] sugiere una explotación minera conjunta"
 AlgeriaFocus.71.d: "El gobierno de [FROM.GetAdjective] ha sugerido un proyecto conjunto de minería de uranio en la franja de Aouzou. Esto proporcionará recursos para ambos países en el futuro. ¿Cómo deberíamos responder?"
 AlgeriaFocus.71.a: "¡Una excelente idea!"
 AlgeriaFocus.71.b: "No nos interesa"
 AlgeriaFocus.72.t: "[FROM.GetNameDef] acepta nuestro acuerdo"
 AlgeriaFocus.72.d: "El gobierno de [FROM.GetAdjective] ha aceptado nuestro acuerdo sobre la explotación minera conjunta."
 AlgeriaFocus.72.a: "Excelente"
 AlgeriaFocus.73.t: "[FROM.GetNameDef] rechaza nuestro acuerdo"
 AlgeriaFocus.73.d: "El gobierno de [FROM.GetAdjective] ha rechazado nuestro acuerdo sobre la explotación minera conjunta."
 AlgeriaFocus.73.a: "Maldición"
 AlgeriaFocus.74.t: "[FROM.GetNameDef] comienza la minería de uranio"
 AlgeriaFocus.74.d: "[FROM.GetNameDef] ha comenzado a extraer uranio en la Franja de Aouzou. Aunque la mayor parte de los recursos van para ellos, nosotros también recibimos una pequeña parte y los [FROM.GetAdjective] han acordado cubrir todos los costes de la excavación."
 AlgeriaFocus.74.a: "De acuerdo"
 AlgeriaFocus.91.t: "Expansión del gobierno"
 AlgeriaFocus.91.d: "Ahora que estamos a cargo, tenemos que consolidar nuestra posición para llevar a cabo nuevas reformas ampliando nuestra base de apoyo. Dos partidos se han ofrecido a aliarse con nosotros, pero bajo ciertas condiciones. Un partido pequeño pero ambicioso está liderado por descentralistas que buscan delegar el poder e introducir iniciativas de democracia directa. El otro partido está liderado por republicanos populistas que buscan una base de poder burocrática y centralizada que pueda actuar como una fuerza unificadora capaz de mantener el orden y la justicia, totalmente opuesta a la descentralización. Nos aliaremos con:"
 AlgeriaFocus.91.a: "Los descentralistas"
 AlgeriaFocus.91.b: "Los republicanos populistas"
 AlgeriaFocus.91.c: "Sí, podemos hablar de eso más tarde"
 ALG_claim_jerusalem_for_arabs: "Reclamar Jerusalén para los árabes"
 ALG_claim_jerusalem_for_arabs_desc: "Ni los israelíes ni los palestinos se merecen la región. Han demostrado que solo causarán estragos en ella. Debe corresponder a los verdaderos árabes gobernar la región y traer la paz y la estabilidad."
 ALG_claim_jerusalem_for_arabs_tt: "Podremos convertir los estados §YReclamados§! en el Levante en estados §YLegítimos (Cores)§!"
 ALG_approach_hamas: "Acercamiento a Hamás"
 ALG_approach_hamas_desc: "Hamás es la única fuerza real que intenta frenar el sionismo. Necesitamos construir mejores lazos con ellos para prepararnos para derrocar a Israel."
 ALG_send_fighters_to_hamas: "Enviar combatientes a Hamás"
 ALG_send_fighters_to_hamas_desc: "While the Palestinians are bravely resisting the Zionist invaders, the simple truth is that they are outnumbered. We need to arrange a group of volunteers to travel to Palestine and join Hamas' ranks."
 MSP_claim_jerusalem_for_arabs: "Reclamar Jerusalén para los árabes"
 MSP_claim_jerusalem_for_arabs_desc: "Ni los israelíes ni los palestinos se merecen la región. Han demostrado que solo causarán estragos en ella. Debe corresponder a los verdaderos árabes gobernar la región y traer la paz y la estabilidad."
 MSP_approach_hamas: "Acercamiento a Hamás"
 MSP_approach_hamas_desc: "Hamás es la única fuerza real que intenta frenar el sionismo. Necesitamos construir mejores lazos con ellos para prepararnos para derrocar a Israel."
 MSP_send_fighters_to_hamas: "Enviar combatientes a Hamás"
 MSP_send_fighters_to_hamas_desc: "Aunque los palestinos están resistiendo valientemente a los invasores sionistas, la simple verdad es que están superados en número. Necesitamos organizar un grupo de voluntarios para que viajen a Palestina y se unan a las filas de Hamás."
 MSP_condemn_china: "Condenar a China"
 MSP_condemn_china_desc: "El trato que China da a sus musulmanes nativos es aborrecible y debe ser condenado."
 MSP_improve_relations_with_algeria: "Mejorar las relaciones con Egipto"
 MSP_improve_relations_with_algeria_desc: "Algeria has a rocky history with Egypt, mainly due to our past conflicts. We are all on the same side here and we shouldn't be so cold to the Egyptians"
 MSP_work_together_with_BSEC: "Colaborar con la BSEC"
 MSP_work_together_with_BSEC_desc: "La BSEC (Cooperación Económica del Mar Negro) es una organización destinada a llevar la prosperidad a los alrededores del mar Negro. La organización está compuesta por países de la cuenca del mar Negro y algunos países del sur de los Balcanes. Necesitamos trabajar junto a estos países para obtener mayores beneficios."
 MSP_fixing_ideals: "Reparar ideales"
 AlgeriaInvestment.1.t: "[ALG.GetNameDef] nos invita a invertir en sus proyectos"
 AlgeriaInvestment.1.desc: "Al emerger de una década de guerra civil, el gobierno de [ALG.GetNameWithFlag] nos invita a invertir en una serie de proyectos por todo su país. Depende de nosotros si decidimos comprometer nuestro capital. La inversión nos otorgaría influencia en Argel, pero con los grupos islamistas armados aún activos en el interior, el riesgo para nuestros activos es real."
 AlgeriaInvestment.1.a: "¡Invertir en su infraestructura!"
 AlgeriaInvestment.1.b: "¡Invertir en su industria civil!"
 AlgeriaInvestment.1.c: "¡Invertir en su industria de servicios!"
 AlgeriaInvestment.1.d: "Será mejor que no nos arriesguemos."
 AlgeriaInvestment.2.t: "¡[FROM.GetNameDef] ha invertido en nuestra infraestructura!"
 AlgeriaInvestment.2.d: "Tras días de negociaciones, [FROM.GetNameWithFlag] ha acordado invertir en nuestra infraestructura a cambio de algunas concesiones mínimas. La inversión beneficiará a nuestra población rural en el país."
 AlgeriaInvestment.2.a: "¡Estamos agradecidos por su ayuda!"
 AlgeriaInvestment.3.t: "¡[FROM.GetNameDef] ha invertido en nuestra industria civil!"
 AlgeriaInvestment.3.d: "Tras días de negociaciones, [FROM.GetNameWithFlag] ha acordado ayudarnos a construir algunas fábricas civiles a cambio de algunas concesiones menores. La inversión beneficiará al sector industrial de nuestro país y facilitará la modernización del territorio."
 AlgeriaInvestment.3.a: "¡Estamos agradecidos por su ayuda!"
 AlgeriaInvestment.4.t: "¡[FROM.GetNameDef] ha invertido en nuestra industria de servicios!"
 AlgeriaInvestment.4.d: "Tras días de negociaciones, [FROM.GetNameWithFlag] ha acordado invertir en nuestra industria de servicios construyendo algunas oficinas a cambio de algunas concesiones menores. La inversión beneficiará al sector financiero de nuestro país y facilitará la modernización del territorio."
 AlgeriaInvestment.4.a: "¡Estamos agradecidos por su ayuda!"
 AlgeriaInvestment.5.t: "¡[FROM.GetNameDef] ha rechazado invertir!"
 AlgeriaInvestment.5.d: "Tras días de negociaciones, [FROM.GetNameWithFlag] ha rechazado nuestra invitación de inversión, alegando que el entorno empresarial en nuestro país aún no es lo suficientemente seguro y que evaluará cuidadosamente futuros acuerdos de inversión con nosotros."
 AlgeriaInvestment.5.a: "¡Parece que tenemos que trabajar más!"
 AlgeriaInvestment.6.t: "Argelia busca inversiones en Oriente Medio tras su ingreso en la OMC"
 AlgeriaInvestment.6.d: "Con su reciente ingreso en la Organización Mundial del Comercio (OMC), Argelia tiene la vista puesta en aumentar la entrada de capitales para impulsar el desarrollo económico. Los funcionarios se están poniendo en contacto con las naciones de Oriente Medio, solicitando una mayor cooperación e inversión en sectores clave. Esta medida señala el compromiso de Argelia de aprovechar las asociaciones internacionales para impulsar el crecimiento y la estabilidad en la región."
 AlgeriaInvestment.7.t: "Firman un acuerdo comercial"
 AlgeriaInvestment.7.d: "Les gustaría proponer un acuerdo comercial para fomentar una mayor cooperación y dejar la puerta abierta a futuras inversiones."
 AlgeriaInvestment.7.a: "Claro"
 AlgeriaInvestment.6.a: "Firmar un acuerdo comercial"
 AlgeriaInvestment.6.b: "Invertir en una fábrica"
 AlgeriaInvestment.6.c: "No, gracias"
 Algeria.11.t: "[ALG.GetNameDef] solicita nuestra protección"
 Algeria.11.d: "After decades of unrest, the Algerian government fears a reignition of war or external interference and invasion, the [ALG.GetNameWithFlag] President [ALG.GetLeader] has visited the Zhongnanhai and approached General Secretary [CHI.GetLeader] for a defence treaty. If we agree to protect them, we will be able to make sure that they are within our sphere of influence, but we will also have the obligation to defend [ALG.GetNameWithFlag] from external threats as well as provide assistance in maintaining stability of the country, especially countering the £GFX_ALG_salafist_jihadism Islamic extremist insurgency. Taking account of our country's situation, should we sign a defence treaty with [ALG.GetLeader]?"
 Algeria.11.a: "¡Otro hermano de acero!"
 Algeria.11.b: "¡No nos queda nada que ofrecer para un tratado!"
 Algeria.12.t: "[CHI.GetNameDef] ha aceptado protegernos"
 Algeria.12.d: "Gracias a nuestros esfuerzos diplomáticos, el secretario general de [CHI.GetNameWithFlag], [CHI.GetLeader], ha firmado formalmente un tratado de defensa con nuestro presidente [ALG.GetLeader]. Al firmar este tratado de defensa, [FROM.GetNameWithFlag] no solo nos protegerá de agresiones externas, sino que también nos proporcionará asistencia para mantener nuestra estabilidad interna."
 Algeria.12.a: "¡Excelente!"
 Algeria.13.t: "¡[CHI.GetNameDef] se negó a firmar!"
 Algeria.13.d: "A pesar de la visita de nuestro presidente [ALG.GetLeader] a [CHI.GetNameWithFlag] en busca de asistencia en materia de seguridad, [CHI.GetLeader] aparentemente se mostró muy reservado ante cualquier tipo de tratado. [CHI.GetLeader] le dijo a nuestro presidente: «Siempre estaremos comprometidos con la seguridad y la estabilidad regional». Sin embargo, es muy evidente que el compromiso de [CHI.GetLeader] solo se queda en palabras; tendremos que defendernos solos."
 Algeria.13.a: "Qué decepción"
 ALG_join_nato_partnership: "Unirse a la asociación de la OTAN"
 ALG_eu_trade_agreements: "Acuerdos comerciales con la UE"
 ALG_expand_russian_gas_investments: "Ampliar la inversión en gas ruso"
 ALG_expand_russian_gas_investments_desc: "Ampliar los acuerdos con Rusia para obtener más gas y construir nuestra nación."
