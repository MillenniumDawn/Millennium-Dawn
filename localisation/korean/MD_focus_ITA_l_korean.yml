 ITA_unlock_policy_decision_TT: "이 중점은 관련 정책을 시행하는 결정을 해금합니다."
 generic_ITA_desc: "이 범주의 많은 결정은 반복 결정이며, 효과는 그대로이지만 실행할 때마다 비용이 영구적으로 증가합니다."
 ITA_tutorial_decision: "이탈리아 시스템 튜토리얼"
 policies_ITA: "이탈리아 정책"
 policies_ITA_desc: "여러 정책은 중점을 통해 해금되며 이곳에서 활성화할 수 있습니다. 정책은 특정 정당만 시행할 수 있지만, 원래 정당이 권력을 잃은 뒤에도 이를 폐지해야 할 의무는 없습니다. 물론 정반대의 정책을 시행하려는 경우는 예외입니다."
 forced_withdrawal_from_bank_accounts: "은행 계좌 강제 인출"
 forced_withdrawal_from_bank_accounts_desc: "몇 년 전 아마토가 그랬듯이, 우리는 다시 한번 절박하게 돈이 필요한 처지에 놓였으며, 이탈리아 저축자들의 금고가 얼마나 가득 차 있는지 눈여겨보지 않을 수 없습니다."
 reshuffle_coalition: "연립 개편"
 discredit_political_opponents_in_talk_shows: "토크쇼에서 정적 신뢰 훼손"
 discredit_political_opponents_in_talk_shows_desc: "현대 이탈리아 문화의 초석은 토크쇼라는 텔레비전 형식이며, 정치에서 연예와 스포츠까지 모든 주제를 논의하는 데 쓰입니다. 이 형식은 점차 전문가들의 유익한 토론에서 서로를 이기려고 고함 경쟁을 벌이는 악다구니 참가자들의 모임으로 타락했으며, 제작자들이 피상적인 메시지와 갈등이 제대로 된 언론보다 더 많은 시청률을 낳는다는 것을 깨닫고 이를 적극 부추긴 결과입니다. 우리는 이들의 영향력을 활용해 정치적 필요를 충족할 수 있습니다."
 estabilish_technocratic_government: "전문가 정부 수립"
 estabilish_technocratic_government_desc: "이탈리아는 심각한 상황에 처해 있으며, 무능한 정치 계층의 처분에 나라를 맡겨 둘 수는 없습니다. 정치적 기회주의와 이념적 광신이라는 족쇄 없이 해야 할 일을 해낼 수 있도록 전문가 정부가 구성되어야 합니다."
