 hung_parliament_ast: "悬浮议会"
 hung_parliament_ast_desc: "自1940年以来，澳大利亚首次出现悬浮议会。所有政党都没有足够的席位组建政府，在我们能够协商获得足够的支持，使我们的72个席位增加到76个之前，我们实际上处于立法僵局。"
 hung_parliament_ast_2: "洛基联盟"
 hung_parliament_ast_2_desc: "我们或许组建了政府，但现有的联合政府远非理想。它充斥着不满的党员和难以预测的独立人士，任何政策的失败都可能导致我们这个刚刚成立的政府早早终结。"
 diplomacy_tightrope_ast: "外交钢丝"
 diplomacy_tightrope_ast_desc: "我们努力在复杂的平衡中寻求平衡：既要与美国保持深厚的安全防务联盟，又要与中国建立稳定的贸易相互依存关系。避免被迫在两者之间做出选择，正是我们得以维持现状的关键。"
 non_permanent_unsc_member: "联合国安理会非常任理事国"
 non_permanent_unsc_member_desc: "联合国安全理事会每两年选举10个非常任理事国加入大会。这些国家可以在大会上直接提交决议并进行表决。"
